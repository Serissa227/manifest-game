# 寰宇·十六世纪：船坞改装项目
# 玩家在有船坞的港口给船做改装，每艘船每种改装只能做一次，做完永久加数值。
# 字段都是加法：capacity（载货）、durability（耐久）、guns（炮位）、speed（航速，格/天）。
# key 只允许追加。名字取船匠行话；出处写“大致年代”的，是拿不准确切年份的做法。
# 数值为游戏抽象，不是历史报价或实测值。

# 拆去舱内多余的隔板与舱壁，把货舱向艏艉两端拉长。各国船匠自古就有“拆隔板加货位”的做法，十六世纪地中海与大西洋商船普遍如此改。
# 在这个世界里是各港普通船坞的活计，不属于哪一家的专利。
[[refits]]
key = "hold"
name = "扩建货舱"
price = 3000
capacity = 40

# 在最下层甲板之下再架一层低矮的夹层甲板（英语里叫 orlop），专堆粗货与压舱杂物。大致十六世纪的大型帆船上已常见。
# 在这个世界里由伊比利亚与低地诸国的大船厂做得最熟。
[[refits]]
key = "orlop"
name = "底层夹层"
price = 4500
capacity = 30

# 把船底垫的石块、卵石换成铁锭或铁块：同样重量占地更小，腾出舱位，重心也压得更低更稳。铁压舱大致在十六世纪末前后见于北欧与英国船只，此处按大致年代处理。
# 在这个世界里是北海与波罗的海沿岸船厂的手艺。
[[refits]]
key = "ballast"
name = "换铁压舱"
price = 2500
capacity = 10
durability = 10

# 在船体内侧加密肋骨、补上加固的横梁与肘板，让船壳更能扛风浪与炮震。木帆船的“加肋”是各地造船与修船的常规做法，年代不专指。
# 在这个世界里是大型船厂修整老船时的拿手活。
[[refits]]
key = "frames"
name = "加肋补骨"
price = 4000
durability = 30

# 在船底外板下钉上铅皮（并衬以毡层），防船蛆蛀木。十六世纪的西班牙船队曾在远洋船上用铅皮包底，是后来铜包底的前身；具体普及程度此处为大致说法。
# 在这个世界里是伊比利亚船厂的手艺。
[[refits]]
key = "lead_sheathing"
name = "包铅船底"
price = 3500
durability = 20

# 把船体用厚木板隔成若干互不相通的舱室，一处破水不致全船沉没。这是中国造船的传统，福船、广船宋代以来即用，欧洲到很晚才仿效。
# 在这个世界里是东亚（尤其闽粤）船坞的看家手艺，别家船厂须请匠人来做。
[[refits]]
key = "bulkheads"
name = "水密隔舱"
price = 6000
durability = 25

# 用一串链条带着木斗或皮碗，由甲板上的人力曲柄带动，把舱底积水连续提出舷外。十六世纪欧洲大型船只上已有链式抽水机，确切年代此处为大致说法。
# 在这个世界里多由低地诸国与英格兰的船厂安装。
[[refits]]
key = "chain_pump"
name = "链斗水车"
price = 3500
durability = 15

# 在船底刷一层牛脂、硫磺与鱼油（有时加松脂）调成的涂料，少长藤壶与海藻，船跑得轻快些。英国海员称之为“白料”（white stuff），大致在十六至十七世纪见于记载。
# 在这个世界里是各港船坞随手可做的小活。
[[refits]]
key = "white_stuff"
name = "刷白底漆"
price = 2500
speed = 0.1

# 更换老化的缆索，重新排布支索与转帆索，让帆吃风更顺。船具维护与改良是所有航海民族的日常，不专属某一年代。
# 在这个世界里是各大港口帆缆作坊的活计。
[[refits]]
key = "rigging"
name = "换新帆索"
price = 6000
speed = 0.3

# 在中桅之上再接一段顶桅，挂上顶帆（英语 topgallant），借高处的风。大型帆船在十五世纪末至十六世纪逐步加挂顶桅帆，大致年代。
# 在这个世界里由西欧大西洋沿岸的船厂做得最稳。
[[refits]]
key = "topgallant"
name = "加挂顶帆"
price = 8000
speed = 0.2

# 在船尾之后再立一根小桅，挂一面拉丁（三角）帆，转向与顶风更灵活。十六世纪欧洲大帆船常有这一根“艉桅”，法国与英国称其为 bonaventure，此处按大致年代处理。
# 在这个世界里由地中海与大西洋两边的船厂都会做。
[[refits]]
key = "bonaventure"
name = "艉后小桅"
price = 5000
speed = 0.1

# 舵柄末端装一根竖向的吊杆（whipstaff），舵手站在甲板上即可推拉操舵，不必钻进舱里。这是十六至十七世纪欧洲大船上的做法，大致年代，更精确的起始年份拿不准。
# 在这个世界里是各港船坞可装的小改动。
[[refits]]
key = "whipstaff"
name = "舵杆吊臂"
price = 2000
speed = 0.1

# 把高耸的艏楼艉楼削低，船身更低、受风面更小，跑得快，重心也稳。英国在十六世纪后半叶造“低舷船”（race-built）流行此风，大致年代。
# 在这个世界里是英格兰一带船厂的新手艺。
[[refits]]
key = "race_built"
name = "削楼提速"
price = 7000
durability = 5
speed = 0.2

# 在舷侧开出带盖的炮门，多摆几门火炮。舷侧炮门的出现大致在十五世纪末至十六世纪初，以后各国战船与武装商船都沿用。
# 在这个世界里是各大军港与大船厂的常规活计。
[[refits]]
key = "gunports"
name = "加开炮门"
price = 5000
guns = 6

# 在船舷与船楼栏杆上加装可以转动的小口径回旋炮，专打登船的人。回旋炮（swivel gun）十五至十六世纪即见于欧洲与东方的船只，大致年代。
# 在这个世界里各地船坞都能装，铸炮匠人手艺高的港口更便宜。
[[refits]]
key = "swivel_guns"
name = "回旋炮架"
price = 3000
guns = 4

# 把上层货舱改成炮甲板，多开一排炮门，整排火炮齐射。多层炮甲板的大战船大致出现在十六世纪前半叶，此处按大致年代处理。
# 在这个世界里只有最大的官营船厂接得下这样的活。
[[refits]]
key = "gun_deck"
name = "加建炮甲板"
price = 11000
durability = 10
guns = 12
