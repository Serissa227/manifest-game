# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 确切的渡渡鸟记录晚于剧本常规航线；本世界线用一次提前抵岛的故事带回此羽。
# 岛上骑者石像的传说缺少完整实证；本世界线留下一片可供追查的石屑。
# 沿海金工以熟悉的鱼形做小像，这件赠物流转的路线由故事补全。
# 较晚兴盛的外销器在本世界线先有少量试烧，窑口年代待核。
# 国营商船拍租制度是史实，个人持有的这张短期优惠凭记是本世界线的简化。
