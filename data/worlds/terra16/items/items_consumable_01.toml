# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 求顺风的愿望写在纸上，本世界线只给一次很小的航行助益。
# 香商卖的是故事里的配方；本世界线让一次使用稍助雾中行船，不凭空造天气。
# 八百比丘尼故事说食者不老；本世界线不延寿，当前词表只表达有限的船员疾病防护。
# 蒜可入食，后世关于回魂者的民俗在本世界线提前流传。
# 药剂原正文：药铺按当时经验配好一份药汤，船医仍须观察每个人的病情。
# 柠檬汁原正文：酸果能补充久航后的饮食，水手尚不懂后世的病因解释。
# 咖啡原正文：熬夜核账的人分一小杯热饮，醒着并不意味着可以不休息。
# 圣水原正文：这一份用于祈祷与安慰，故事里的护念不编造成攻击性的法术。
# 护符香纸原正文：折好的纸料交给知晓仪式的人，纸本身不教人任何秘术。
