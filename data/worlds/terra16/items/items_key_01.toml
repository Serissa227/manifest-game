# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 故事取得的是获准留下的印文，辽东战役链把相关史事提前约五十五年。
# 铅封与门铭的两份拓记并排保存，本世界线让两地线索彼此印证。
# 短篇经传抄带来上下相应的疑问，作为线索的这片抄纸属于游戏补全。
# 旧航书有真实传承，隐藏支路与接手它的人则由本世界线补全。
# 印纸记录政治承诺，世界线提前的年代写在图鉴，持有人并不因此成为君主。
# 王室书信有真实传统，这封交到玩家手里的副本与差事为游戏补全。
# 真实扎布拉的帆桨形制与古典渡鸦吊桥在本世界线合成一张改装图。
