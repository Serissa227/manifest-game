# I01 新增副武器（第二批）：火器、短刃、弓弩、投掷与船上白刃用具。
# 价格按稀有度对齐既有分片（1 级 180、2 级 720、3 级 2100）；4 级不进商店。
# 百分比为整数；单件上限照 C4（*_pct 不超过 15）。图标简述见 art-src/item-icons/items_1111.tsv。

[[items]]
key = "hackbut_hook_gun"
name = "钩铳"
kind = "sidearm"
rarity = 2
price = 720
bonus = { gunnery = 1 }
effects = [{ kind = "gunnery_pct", value = 10 }]
tags = ["sidearm", "weapons", "northern"]
basis = "historical"
sources = ["16世纪欧洲军械库藏火绳钩铳（hackbut / arquebus à croc）：枪身下带铁钩，可挂在城垛或舷墙上放"]
lore = "枪身底下焊着一只铁钩，往舷墙上一挂，后坐力就吃进了木头里。炮手嫌它沉，轮到登船那天却人人想要一支。"
