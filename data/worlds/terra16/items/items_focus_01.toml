# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 旧图像中的双蛇被刻成研习用杖，本世界线不把它说成神祇的遗物。
# 墨西哥石镜的材质有依据，归于迪伊的传承并不牢靠；本世界线以追索故事连起两端。
# 阴阳道故事里的纸形在本世界线成为练习媒介，效果仍受限于研习。
# 渔夫与瓶中精灵的故事早已流传；本世界线留下一个可追查封印的瓶子。
# 抄写员保留短篇的字母图式，不把十七世纪汇编整部提前；本件为研习用散叶，传本仍待核。
# 文案整理补充：以下原文说明不进入玩家正文。
# 护符衬衫、龙虎山符箓、萨满腰铃、苏菲念珠、圣水瓶、比斯塔米摹写板：作为文化器物保留，不授秘术，不把信仰化成可买的法术，不让墨迹代替人的责任。
# 伊希的黄铁矿镜：受托保管的是一件可移动的小镜，故事不允许抢走庙里的圣物。
# 布尼散叶：所据传本的确切年代待核。
# 水晶球：原文说明其影像能引人沉思，却不能替代航海记录（只作研习器物）。
# 天降石护符：原文说明拾石人记得火光，石头的来处仍要由学者验看（陨石来历未经证实）。
# 萨满铜镜：原文说明外来的收藏者应先问清主人意愿。
