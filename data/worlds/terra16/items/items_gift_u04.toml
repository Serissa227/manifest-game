[[items]]
key = "zouma_lantern"
name = "元宵走马灯"
kind = "gift"
rarity = 1
price = 180
bonus = {  }
effects = []
tags = ["gift", "chinese", "handmade", "lantern"]
basis = "historical"
sources = ["周密《武林旧事》记南宋元夕灯品有“马骑灯”，即走马灯的早名；明代元宵灯市赛灯猜谜的风俗沿袭此类；灯谜赠灯的具体做法为游戏补全"]
