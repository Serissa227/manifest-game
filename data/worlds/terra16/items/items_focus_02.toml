# I01 新增法器（第二批）：各地的乐器、民间器具与炼制之物。
# 宗教物品不给秘术效果（FRAMEWORK §15.3）；乐器沿用既有“好感增益（music）”的口径。

[[items]]
key = "pipa"
name = "琵琶"
kind = "focus"
rarity = 2
price = 720
bonus = { sensibility = 1 }
effects = [{ kind = "affinity_pct", value = 8, tag = "music" }]
tags = ["focus", "study", "chinese", "music"]
basis = "historical"
sources = ["《明史·乐志》；王圻《三才图会》（1609）乐器卷绘琵琶"]
lore = "梨木的曲项，四根弦，抱在怀里横着弹。泉州的歌女弹起一曲《十面埋伏》，满酒楼的人都不敢大声嚼东西。"
shop = { cultures = ["ming"], min_size = 2, weight = 2 }

