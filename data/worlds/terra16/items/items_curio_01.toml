# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 名物的传承须逐段考证；本世界线由茶人请托安排借观，不把孤品摆进寻常店铺。
# 竹节与手工削痕被茶人认真记下，这件器物的雅号为本世界线所拟。
# 1519年之后的抄传让画坊接触到一些笔记；本页的离散经历由游戏补全。
# 沿岸饮咖啡的具体年代待核；本世界线让海路带来一件较早的壶。
# 小像把高地熟悉的动物带到海岸，这件流传经历属于游戏故事。
