# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 建州旧城随辽东战役链整体提前，不能把这一时移扩展到日本和朝鲜全境。
# 海西女真的城寨依赖林产贸易，城址年代按提前的辽东线处理。
# 1545年银矿开采后兴起的高地矿城，1553年已活跃；不采用草案的1538年起年。
# 辽西走廊军城与觉华岛供给相连，事件年代随辽东线提前。
# 湄公河城镇预备承接王廷与玉佛的迁移，不把1564年的结果提前写入1553年。
# 二次整理：以下为本轮改写前的玩家正文，含未来剧透或编写说明，保留供核对。
# 佛罗伦萨：美第奇公国的内陆织造中心，尚不能称托斯卡纳大公国的首府。（1569年起才称大公国）
# 布拉格：波希米亚王城尚未成为鲁道夫二世的宫廷，玻璃与工艺商路已经兴盛。（宫廷迁布拉格在1583年）
# 伊斯法罕：萨法维的工艺商城尚未成为阿拔斯时代的新都。（1598年迁都）
# 非斯：1549年萨阿德已夺取非斯，1554年短暂复辟与再征服仍在未来。
# 大津巴布韦：大城已在十五世纪衰落，此条表示遗址附近的区域贸易，不把废都写成1553年繁华王都。
# 阿格拉：1553年属于苏尔王朝体系，胡马雍的复国尚待1555年。
# 京都：公家与寺社并存，1553年足利义辉退往近江后，城内实际权势属于三好氏。
# 抚顺：辽东马市连接建州来货；铁器禁运不能简化成自由市场。
# 沈阳：辽东卫城位于河谷道路枢纽，1553年仍属大明。
# 库斯科：旧印加王都在殖民统治下重组，比尔卡班巴的独立王廷不在这里。
# 锦州：辽西走廊中段的军城，勿与辽南金州混同。（英文名另以 Liaoxi / Liaodong 区分）
# 金州：辽南驿路连接旅顺和辽阳，名称与辽西锦州分开。
# 琅勃拉邦：玉佛自1552年供奉在此，1564年才随王廷迁往万象。
# 万象：湄公河畔的城镇正等待王廷迁来；1553年，玉佛仍未抵达这里。（上一版正文）

