[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:a1","text"],null]']
src = "blake3:c512ebf2248eec3b7d7a7903f91f6ca0a912e067c008304b1921e6c35225bc67"
text = "七月初七，宫里设了乞巧奠。庭前立着供案，铜盆里蓄满清水，专用来映星。女房们在殿里分坐两列，当中垂下一幅长长的白绢，算作银河。各自把和歌写在纸上，打绢底推去，那边的人接住，写回一首再推过来，这便是“流之座”。我写好一首推过去，跪坐静候。灯火点在绢布那头，映出一排低垂的身影。纸推回来了。那手字我认得，清瘦，硬朗，收锋利落如刀。我的歌竟一字未删，尾端只轻巧续了一句，恰似银河对岸有人低应了一声。绢底递来一句极轻的嘱咐：“别念出声。”正对我坐着的那道影子依旧垂着头，手里的笔尚未放下。身侧的女房凑过来问：“何人所书？”我将纸叠好，压在膝下：“偏不告诉你。”白绢那头的灯火轻轻挪动了一下。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:a2","text"],null]']
src = "blake3:dc7999f62053a0f65fd6d266ceaa839a29c82e6eba61cc82f8818fe1f911c936"
text = "这一年我们在宫中彼此通书。明明相隔不过两道廊，信笺也定要唤小女童跑着传递。这是雪起的头：学着紫式部同她认下的那位姊姊，信里一个称“姐君”，一个称“中君”。她生于二月，我生于六月，她便定下自己是姐君，半点不容商量。这天她打发小女童免跑这一趟，自个儿抱来一卷纸。里头是这两年歌会上我俩轮番接下的联句，叫她逐句誊录，装裱成卷。她的句字端正齐整，我的则依原样临摹，连我写得散漫的那几笔，也照着描得一般潦草。“你那几笔，我摹了半宿，才摹出这副丑样。”卷尾另起一行写着：这一卷不给别人看。她递到半路，手又悬住：“借用古人的称呼，是不是太过郑重了？”廊下的小女童悄悄探了一回脑袋。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:b1","text"],null]']
src = "blake3:0ed8369a9d2ce0f1969aaa680d484e23d5418a58a6a92400a5f48ec1289da931"
text = "入秋后宫中办歌合，请三条西公条担任判者，题为“月前风”。我与雪分列左右两方，各呈一首。判词当席宣读，右方胜出。念及我的歌时，判者将纸放低些，抬眼望了我一下：“气太盛了。风尚未来，先把月亮吹散了。”女房们低声偷笑，右方那一列已然在分领胜者的茶点。我端正跪坐，掌心里的扇骨攥得咯吱作响，眼珠偏不肯往右方斜去。散席后，雪找了过来，手里攥着抄好的判词。她面上全无半点得意，在我对面坐下，折扇摇得极快：“交呈之前，你删过一句罢？起先是如何写的？”十一月的寒天，她扇得额际都渗出了汗。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:b2","text"],null]']
src = "blake3:88ba2769fd9dd5bd11c564c8a1846938a7fb92319e7d0cc2d409b93988b47205"
text = "开春后，骏河的今川家派使上京，请冷泉家遣人南下教歌。名册需誊清一份正本交使者带回，冷泉家把这桩差事派给了雪。她在局里整整誊抄了一上午。名录上是她的叔父、堂兄，还有个去年才元服的远房侄子。唯独没有她。她一丝不乱地抄完，钤印，缄封，交予使者的随从，还依礼行了一礼。及至傍晚，我在相邻的局里忽闻“啪”的一声脆响。推门进去，她正跪坐在书案前，那管毛笔断成了两截，断茬毛糙不堪，墨汁顺着指缝滴落。她抬眼看我，声调平稳得如同在念名册：“歌咏得最好的人，偏不在上头。”我尚未搭腔，她又开口：“把门带上。”半截断笔滚到了我足边。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:c1","text"],null]']
src = "blake3:aad7b0d858132c97693045b3a57582233ed595d6dda4986fa96f7988ce40fb14"
text = "进京尚不满一个月，女房们在局里凑了个小歌会，题是“春海”。我在短册上写得满满当当：土佐的涛浪，下田的船只，落潮时铺满海滩的螺贝，一字也不舍得省。短册传至冷泉家的小姐手中。她略扫一眼，提笔便把后半首勾了，一墨又一墨，划得干干净净，方才递还给我：“这一段削去，余下的才听得见。”满屋女房尽皆举袖掩口而笑。有人窃声道：“土佐来的姬君，连歌都是一船一船载来的。”我死死攥着短册，指尖在纸边掐出了痕，险些当场撕碎。当夜我借灯细瞧。后半首压在墨杠底下，前半首独自立于纸面，一句浪，一句船，没了后头那一长串繁语，竟真听出了水声。我挑亮了些灯芯，愈看愈气恼：她划得没错。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:c2","text"],null]']
src = "blake3:fa5a4e3be0d2c2e2a0bdfad1e12bb93bdaf71146ad6ba748257beaf6465aaf63"
text = "我从土佐携上京的那册《古今集》，乘船时叫海浪溅湿过一回，晒干后纸页一张张起了皱，翻动起来哗啦作响。为了卷头那首年内立春的歌，那一年的春究竟该算去年抑或今年，我抱着书去寻雪。她翻开一看，眉心蹙得比纸褶还紧：“这书莫不是从海里捞上来的？”“是从海上捎来的，读法也是从海上带来的。”“读法也是。”她只裁留了这三个字，提笔在页眉写下一行小字。我指着原文反驳回去，她又批上一行。自午后一直争到女官进来点灯，砚台添了两次清水，谁也不肯服输。灯盏亮起，她合上书卷，又翻开，在我指的那一页纸背上，将我的解说也端正抄录进去。搁笔时，她将毛笔往笔架上一放：“明日接着辩。”那册书在她书案上停了一夜。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","bond_reizei_yuki:s","text"],null]']
src = "blake3:b4f5af4d6408bbd20e3c88b5086649e4492c06585de39bf51e2bcb4c16e6f057"
text = "入冬，本家的房通大人辞世了。一条家的事务骤然繁杂起来，弟弟需归返土佐，我也得随行，待开春自下田出海。雪却要留守京都。冷泉家有部歌稿将要付印，交与她整理，她每日需校勘数十页。她来送别那日，既没携歌，也没带纸，只将折扇插在腰带里。我们立在本家的门廊下。我说开春自下田扬帆，先往堺，再赴平户，而后一路往南，那边的船航行得远，听说直抵满剌加。“先去堺。”她重复道。她望向庭院里的雪：“往后寄信来，毋须封封都是好歌。写坏的也寄来。”我笑说写坏了你又得删。“写坏的也寄来。”她抽回折扇，阖拢，展开，复又阖拢。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","reunion_reizei_yuki:okou","text"],null]']
src = "blake3:95236be54e20d0c7313747c4d99ca30c584a33702de99bd8785ea8917c4593d6"
text = "永禄四年开春不久，雪的信就寄到了，比往年早了些。“冈丰派人来请，要找个教家眷写歌写信的人，谢仪是二十石米。今川那头打去年起就粒米未见，叔父说桶狭间以后，骏河不会再有人来了。叔父问我去不去，我且问你。你若叫我别去，我便不去。”底下本有一行墨迹，被重重划掉了，透着墨杠还能认出“你说什么我都”几个字。信笺边缘她自己批了句小字：上一行删去。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["chapters","reunion_reizei_yuki:reunion","text"],null]']
src = "blake3:b770a3f7aacf6e19cb0fa6c0a71942a5eb0c73c5ff99963f7b4878d4fcfd508c"
text = "七载过后，我的船靠了堺的码头，改走陆路入京，径直去了冷泉宅邸。雪正在内室教歌，五六个女孩子排坐一列，各自案前摆着一枚短册。她执笔在一名女童的歌纸上画了一道，那女童抿紧双唇，眼眶已红了。雪抬眸望见我，笔尖顿在半空。她先打发学童各自回去，直待末后那个孩子踏出房门，才张口道：“晒得跟船夫似的。”说完自书架取下一本册子递予我。正是当年议定付梓的歌稿，如今已刻板印成，书皮题着她的名讳，“冷泉雪”三字占了好大一片。她一页接一页向后翻检，直翻至末页。纸面空着，独独角落题了一行细字：给远来的人。她随手将毛笔交到我手里，笔管上绕着一圈旧线：“在海上作的歌，拿来我听。”砚台中的墨汁刚磨好，犹带着些许微温。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:ask_mercy","reply"],null]']
src = "blake3:6e917a3e5ef555fca1a9ad8ade3fb8aa0910b2b18cbca6cb29afbe225677bacd"
text = "“七夕不删。”她头也不回地道，“一年仅有这一晚。”我尾随其后走了几步，正暗自得意，她又补落一句：“第四句原还可以更好些。”她步履走远了。我立在廊下，将那首歌于心头重念一遍。第四句果真还能再改好些。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:ask_mercy","text"],null]']
src = "blake3:9aea6070a673a42c8a892d386dae2dbcc9b72319510ed62f058dfe7e703c6f92"
text = "散席后追上她，问她今夜为何一字未划。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:keep_her_line","hint"],null]']
src = "blake3:4bca10ffcb5d66846c8b036283987ac8dffd6a9a77cb906da3598be615fdf770"
text = "情谊 50、羁绊 C。她的字落上你的扇面，她只会当你在拿她打趣。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:keep_her_line","reply"],null]']
src = "blake3:7ca6a7a8cff1a19a3e000ac7994f99f35e05cd731872c87c40ca1559fe081048"
text = "次日我将桧扇展开递到她跟前。她瞥见扇骨间自己的那句，手里的扇子“唰”一下挡住半张脸：“你把我的字临丑了。”她伸手接过扇子，蘸墨在我抄的那句旁侧重描了一遍，描成她惯常的笔迹，描罢方才还我：“这是令尊的扇子？”我说是。“那就莫再往上面誊别人的句子了。”"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:keep_her_line","text"],null]']
src = "blake3:e2df1682c78ff385063dad396d8aaa541ca9e2db90cf1e06ac27382e5e4ea62b"
text = "将她接续的那句抄在那把桧扇的扇骨间，次日拿去给她瞧。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:write_only_for_her","hint"],null]']
src = "blake3:3c83812b18175885b73b63c3faf7fc07d8f0edceb36c5fb710c5e6da96af441e"
text = "情谊 20。这等和歌递过去，她只怕会原封退回。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:write_only_for_her","reply"],null]']
src = "blake3:678cce4b33cf6db35ced9824321944da77630d009f19a33eea6115a0e6ac5fb5"
text = "我落笔极慢，写上一句，勾去一句，末了仅余两句，才顺绢底推了过去。这一遭，回歌来得迟缓。纸再推回来时，末尾一字的墨迹尚未干透，沾在我指头上蹭出一点乌黑。散席后，她从我身旁走过，步履未停，只低低嘱咐了一句：“今夜的歌，不准示人。”"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a1:write_only_for_her","text"],null]']
src = "blake3:9f418410d0abe7c951de4fa921c8634befdfa3e8c79bdfc38538d41271fbe2e6"
text = "另赋一首，单写给白绢彼端的她一人。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:call_her_sister","hint"],null]']
src = "blake3:02d6c2828e48937000a54b74687a006f21a5b1a55f174284d41c06415c5e26b7"
text = "情谊 80、羁绊 B、心动 6。今日这般称呼，她只作你在学古人腔调。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:call_her_sister","reply"],null]']
src = "blake3:fe5dd1fd32ffa6c466ea7f89ad3a6c5f12e1cf2e9738dbd70c37764034ab8823"
text = "我喊出口了。她持扇的手顿在胸前。待廊下小女童连着探了两次头，她方才开口：“中君。”那声音极轻，生怕叫廊下的人听了去。唤罢，她俯首卷拢那卷纸，卷歪了，拆开重新卷过，卷齐了放入我手里，却又抽回去，提笔于卷尾“这一卷不给别人看”那一行中，划去了“这一卷”三个字。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:call_her_sister","text"],null]']
src = "blake3:66fd70dbae215b3c8b8372fdabaaa0056b9a6c9808fa7bfda48fdd8e55c94a18"
text = "收下这一卷，当面唤她一声“姐君”。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:keep_scroll","hint"],null]']
src = "blake3:18528115360903b1a07dab20852c15c34fbe541c82787a6bf7b11355c42c1103"
text = "情谊 80、羁绊 B。她递到半道，终归会撤手收回。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:keep_scroll","reply"],null]']
src = "blake3:8d12471a1953308b1674ad7effd4c0773a849598e1317f5fc2c698867b9e681e"
text = "“郑重的是这一卷。”她将我的话删裁得仅余这几字返还回来，举扇半遮脸面：“你这话说的，活像男子寄予女子的恋歌。”然而那日傍晚她送我回局，过了平日止步的那根柱子，又过了一间，再过了一间，一直送到长廊拐角处，方说：“送到这里罢。”我回头望去，她折返的步子迈得极慢。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:keep_scroll","text"],null]']
src = "blake3:f3f50c5388cbc8dc650f46ea8e4517fdabf178e355d4d52e3b042841e7150263"
text = "接过这一卷，说称呼算不得郑重，郑重的是这一卷。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:read_angry_one","reply"],null]']
src = "blake3:6105a4b168cae80365c92770f1d47088235cf89d345c4054fae07c0ad3cc14ef"
text = "那一首是前年歌合落败后写就的，一句讥刺判者，一句怨怼她。我刚念至第二句，她便扑过来抢。我将卷子高举过顶，她够不着，两个人在席面上笑成一团，竟把砚台也碰翻了，那一页泼上一块墨渍。她并未扯掉：“留着，好证明你脾气急。”言罢却自个儿从我掌心抽走卷子，锁进了箱笼里。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:a2:read_angry_one","text"],null]']
src = "blake3:679b5621f851b23a74b9ca00d88178b4d5207696fdb8a3e2be3397667dda7a24"
text = "先翻出当年负气写的这一首，放声诵读以打趣她。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b1:accept_verdict","reply"],null]']
src = "blake3:772671dd1b91b33b1d1de8d31cb68224a18c2fb5633108d0d65bc490a362f6d2"
text = "“下回我要让判者说我气正好，风起了，月亮犹在。”“气正好。”她把我的话删剩三字抛回来，扇子“啪”地一合，“那你得等上好些年。”她伸手讨过我那首歌，当着我的面将后两句划去，再递还回来，旁侧添了三个小字：“月还在。”她起身离去。我独坐原地，将那句判词重念了一遍，愈念愈是不服。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b1:accept_verdict","text"],null]']
src = "blake3:344d8ff67e56c21e3ab16320a9e94d83551b1263bec5c084ecccab60fa248699"
text = "认下这一局落败，放言下回定教判者说我“气正好”。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b1:show_her","hint"],null]']
src = "blake3:bcafd0b5468c4fdab68fa5d90e2d4e3ca0a93c2143e347a72c5ba2c1f0971148"
text = "情谊 20。她刚胜过你，此时凑前发问，她只会疑你嫌她赢得不公。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b1:show_her","reply"],null]']
src = "blake3:8f9136775392c4f66e1f1d433dbbd83365c193df2e4287ed9895e6c4a3117981"
text = "我念了。她听罢点点头，说删得对，又叹删得可惜。轮到她时，她迟疑了好一阵，方用扇尖轻点己作的第三句。我说那处的“露”字压住了月色，她立时点头，点得飞快，分明早已知晓、单等人点破的神态。我俩将判词翻过背面，各自写下一句，一句“我服”，一句“我不服”。至于是谁所写，判者不知情，满屋的女房也不知情。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b1:show_her","text"],null]']
src = "blake3:945f9b0b66071a5b6ae6be09876a2e9e318c1700770a3f2bbd6a9cd052d88439"
text = "将删去的那句念予她听，再问她自己对哪一句拿不准。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b2:ask_why_not","reply"],null]']
src = "blake3:80ec1e6eadf7e9fdaf6db3db693750f81079ece7240bc8cd90e75be6940e36af"
text = "我央托了本家的人，先后塞了两回茶点钱，一回三十文，一回五十文，方打听出一句实话：“女子不宜远行。”归来转告于她。她追问我是如何套出话的，我答使了些银钱。她默然不语，自案下摸出只小纸包，拆开清点，数出八十文重新裹好推至我跟前。“女子不宜远行。”她将原话一字未删地复述一遍，“钱拿回去。我自家的事，不劳一条家破费打听。”此后半月有余，她在歌会上遇见我，仅淡淡点个头。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b2:ask_why_not","text"],null]']
src = "blake3:e620abbcfd235970b12557e16e49e20e1740b0dfe7c6ae76af0246f1433be19e"
text = "替她去探听缘由：名录上凭什么独缺了她。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b2:bind_her_book","hint"],null]']
src = "blake3:c734ea2dff2d5db9a66c93ccf3d166943d01b66a1e7a51a3d39e58b2e351d4f8"
text = "情谊 50、羁绊 C。门扇虽已拉紧，可这一遭，她要将你关在门外。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b2:bind_her_book","reply"],null]']
src = "blake3:63522e0ecba5307b5bcb019a5cdc20fb39aa0fe9b19c0ceeac595022595a3095"
text = "我们整整抄了一个月，夜里抄，清早也抄。那支断笔她用细线缠牢了，接着使唤。抄着抄着她又删汰，删去了十一首，末了剩八十首，我替她订好线，封面留教她自题。“冷泉雪”三字落成，她手捧那一册：“头一回将名字署在最前头。”我说那合该写得再大些。“大些。”她应着，便转身去穿下一册的装订线。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:b2:bind_her_book","text"],null]']
src = "blake3:2bf6c7d9c6806b850bb1a43a5877e23b42477ce6cd21fed1362d7f248112c1cf"
text = "陪她将她的歌逐首誊成一册，封面题她的姓名。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c1:ask_why","reply"],null]']
src = "blake3:50427a9d3766cb4ac98119cef1c19bfbc6a9ae5978f14a655a07514f61e6c3cb"
text = "她招我在对面跪坐下。我争辩道螺乃下田的螺，船是我家的船，满滩也是实打实的满滩。“满滩是真满滩。”她把我的话截去一半说回来，“螺贝不宜进歌，船只不该一条条去数，‘满滩’二字直似鱼市上的吆喝。你的海写得太过喧闹。海原本就闹，用不着你替它高喊。”我回去通宵修改，改至灯油见底，次日再交。她执笔从头勾到尾，划去的比留存的还多，末了于旁侧添上三个小字：“这回近。”"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c1:ask_why","text"],null]']
src = "blake3:6926567060dd729094dc267f3c6708f4c6f4d8999b0204217336fcb4c65bfa58"
text = "去她局里问个明白：被划去的那半首究竟差在哪里。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c1:rewrite_defiant","reply"],null]']
src = "blake3:6999e88b3e510e51b1c8cb33f82c44b3945fefdc582ea49775d96eea08b93d80"
text = "我将那半首一字不改地写回去，又多补了一句，墨汁研得浓浓的，当面摊开在她跟前。她从头读到尾，提笔又划，这一回落笔更快，划罢在旁侧添上三个小字：“还是多。”我气急之下在廊板上重重跺了一脚，整条长廊的女房皆惊而回望。她却又落下墨杠，划的正是我新补的那句。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c1:rewrite_defiant","text"],null]']
src = "blake3:54fdc8aa236726e68269ecf5feb9f042e6aa65c076348bbae70a3c1b20453714"
text = "次日另作一首，偏将她划掉的那半首写回，摊放她眼前。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c2:come_back_tomorrow","hint"],null]']
src = "blake3:7debb5da83e4ef80e075f6b2bbb75ec5adc001a7a88a2ad0b519600d18f26426"
text = "情谊 20。这册皱巴巴的书，她可不会容它在自己案头过夜。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c2:come_back_tomorrow","reply"],null]']
src = "blake3:0688cfc402f37d328b72e541604f2a381a4923d10d07e473a07c5606f87a627a"
text = "次日书便送了回来，以一块素绢细细裹着。每页边缘皆添有她的小楷批注，有驳斥我的，亦有驳古人的。翻至中段，有一页单单写着“这里你对”，字迹细小得须凑近灯焰才辨得出。我持书去问她，可是写岔了页面。她伸手将那一页翻过：“再问，我便划掉。”"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c2:come_back_tomorrow","text"],null]']
src = "blake3:af228679bc7e8f86934f45fb673b4a79c3452fe1d2b4ad623975773b83fd2243"
text = "应承明日还来，将这本水浸过的书暂留她处。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c2:concede","reply"],null]']
src = "blake3:e5fd321e3e063961b61054877e9c563b971bbca761b28ae1985533d487ec6d4a"
text = "“认输太早。”她口上如此说，终究还是把书推了过来。我抄至半夜，抄着抄着忽而停笔：其中一处，她竟将贯之的歌记到了旁人名下。次日我将那一页摊在她面前。她俯首看罢，拿笔将那姓名改回，改毕合卷推还给我：“这本我不批了，拿回去罢。”那一整日，她同谁说话皆是整句，竟一字也未曾删减。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:c2:concede","text"],null]']
src = "blake3:0e94eb7d2c296a1dd4f7487cae32a44ec342aefd111a350a8df088bfc3c110e1"
text = "服软认输，恳请她将这一午后的批语借我抄录一份。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart","hint"],null]']
src = "blake3:f3f2f22ff91dc111a1d33eb927057935601284f2f5338f4bdccf3d7edeb0e4af"
text = "羁绊 A、心动 12，未曾对旁人倾过心意，终身之约也尚未轻许。信已写毕，却递不出手。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart","reply"],null]']
src = "blake3:ad38e7d9bdf6a9d3fb7cb9213d499ee1457318676f45ebadba97f87aace90668"
text = "那封信我断续写了几个晚上，写废了七张纸，封皮上只题了两字：姐君。我递过去，嘱她等我俩都成年了，重逢那日方许启封。她没问里头写了些什么，将信贴着衣襟按住，按得死紧。“倘若我熬不到那天，先拆看了呢？”“那你便依着它写回信，写妥了也收着。”她垂首看着自己按在胸口的那只手，将另一只手伸给了我。我握住了。她掌心冰凉，指尖尚有墨痕，是清早校勘书稿染上的。“回信，”她说，“我那时候也备好了。”门廊外的雪一直下。本家的人已来催了三回。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart","text"],null]']
src = "blake3:31148cfe25d12c831868a77bad78d61db1f5a9721477954000a20ec08aa3114b"
text = "将一封题着“姐君”的信交予她，约定待成年重逢方许启封。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_second","hint"],null]']
src = "blake3:06f96c909763c748e919ed70f06483ca2d3b7a7dbc6eba97a2b51d23a88c3e28"
text = "已许过一份心意：需心动 18、口才 5。信封上的笔迹，她审视得比谁都细。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_second","reply"],null]']
src = "blake3:db000ab6129733e9bfcd02b7ed1c3dede360902fa0a2e039777d8b58e6f43253"
text = "我将信递过去，说等双方都成年了，再见之日方可拆看。她接在手里，先盯着封皮看了一阵：“姐君。这两个字你落笔比平日慢。”她再不问别的，只把信按贴在衣襟上，另一手向我探来。我握住了。她的手冰凉。“回信我彼时也备妥了。”她说罢，便将手抽回，撤得较我预想中更早。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_second","text"],null]']
src = "blake3:1e2b5024a0fa37b8becf42556682b3dd42f8e2fef962b9ab847e29d5801a80a2"
text = "心头既已许过一人，仍旧将那封写着“姐君”的信递予她。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_third","hint"],null]']
src = "blake3:f11a67a31c716b846281dabe9391599b48ce70d0460d86646cd70ec03fbdb049"
text = "已许过两份心意：需心动 26、口才 7，那声“姐君”还得你当面唤过她。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_third","reply"],null]']
src = "blake3:e04972f4c745c09ed8eb291e509e446ded665b1f653d19ae04e66fcd7c7e552b"
text = "我将信呈过去。她细察封皮，罢后翻转信封打量背面，那封口的地方，我正是按了两次才压平的。“中君。”她叫了一声，却未即刻接信，“这一封，费了你几个夜晚？”我说三个。“三个夜晚。”她终于接过信笺，贴着衣襟按住，按得极紧。折扇在她掌中开了又合，合了又开。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:heart_third","text"],null]']
src = "blake3:768610e906e2bd5b34c9848996675b896d68c3b2b31fa228ea695677a73b4aa5"
text = "既已许过两个人，还是将那封题着“姐君”的信交给她。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:own","reply"],null]']
src = "blake3:494f877328e14656c9132957e224736db5dc91595874046b5d99c3b72a898af5"
text = "“十年。”她执扇在掌心轻敲一下，“你在茫茫海上，能吟出什么好歌？”“海上的歌，你一首也没听过。”“一首也没听过。”她说，“那我且等着听。十年以后，判者由我来请。若再教人道一句‘气太盛’……”“那便由他说。我的气，届时只会更盛。”她放下扇子，笑出了声，笑罢却又板起脸，立约一言为定，输了的人须当着判者的面，将自己的歌删去一半。她离去时未曾回头，我也没回头。行至街口我方发觉，自己一路都在盘算，到时候第一首该写些什么。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:own","text"],null]']
src = "blake3:c9992309029c32060588dd317b857f9482257ad685e0269307f45e8717b1a6ea"
text = "约好十年以后，在歌席上重分一回高下。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:promise","hint"],null]']
src = "blake3:fce1a319c933709463885c720d4ff83987035568d5b1fc37dff021f6c57b73db"
text = "羁绊 A。一辈子的约既已同旁人结下，这道门廊便再站不稳。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:promise","reply"],null]']
src = "blake3:5b24aaa8a85a802c4499c5f90dbeea1c0db8b656b22d5a348559e4b46878dae2"
text = "我说，不如每年七夕各寄一首。好的寄，坏的也寄，撞上风浪写得东倒西歪的也一并寄。“写坏的我可要删。”“那就删。删完还请寄回，让我瞧瞧还余几个字。”她笑了，笑得很短促，连扇子都来不及掩遮。“流之座上属你的那个席位，我代你空着。每年七夕，我照旧往白绢底下推一首过去。没人接，便权当海接了。”门廊外的雪势转大。她没撑伞，一直迈至门口才回望一眼，朝我把折扇扬了一扬。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","bond_reizei_yuki:s:promise","text"],null]']
src = "blake3:d2e2a06124e8224ef0012e6c123b4080c5d9e3a73790c480ae659cb4891d6199"
text = "约好岁岁七夕彼此寄歌一首，不论好坏皆寄。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_one","hint"],null]']
src = "blake3:008014eeb160746017123d62e89f957d01ec06a62a317db573c89051562cc513"
text = "仅当她写信问起数目之时。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_one","reply"],null]']
src = "blake3:8b3a355de4c90b0efc8ae440d60a4a0295e35a9afe149bc33f0770eb88e7c9e2"
text = "我于那处留白落笔，端端正正写了“一封”二字，又在侧旁添了个“去”字。她动身去了冈丰。及至入夏，她捎信过来，上头誊了一首今岁新咏，后半段一如既往被墨笔划去，旁边添了三个小字：“还是多。”信尾对我的称呼，依旧是“中君”。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_one","text"],null]']
src = "blake3:dfdd416fac54bf7e266853219c4b41c817be1c07cb5163393821d3120f713377"
text = "在那处留白写下：一封。去冈丰。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_true","hint"],null]']
src = "blake3:008014eeb160746017123d62e89f957d01ec06a62a317db573c89051562cc513"
text = "仅当她写信问起数目之时。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_true","reply"],null]']
src = "blake3:7d5cb2457156ee912a98a405bc58c401f864270ec729f99f896dd850997d269f"
text = "我在那处空白填了数字，写下又划，划了又写，末了还是写上实数。信寄出约莫两月，她的回信才来，并非写在那张原纸上，而是另换了新纸：“那个位子我撤掉了。席子空摆着，女官每年都得问上一回，我懒得应答。冈丰我去。”底下落着“冷泉雪”三字，打那以后，她来信开头一律改称“一条殿”。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:answer_true","text"],null]']
src = "blake3:8a05336fedc6a184d3955af0a8529ab2032fa027f21a4233ea1e3656a8ba1295"
text = "照实填进那段留白：不止一封。冈丰一事，由她自行拿主意。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:tell_go","reply"],null]']
src = "blake3:c9d736af580f3301fe0c6db110186b629c72a4108fa5d5132ab4a8cf705d742e"
text = "我回信劝她去，二十石实打实算二十石，且冈丰距中村并不算远，沿途有一条家的人照料。她便成行了。入夏时有中村的老臣写信来责骂，说一条家的姬君竟将冷泉家送去了长宗我部那头，眼下冈丰女眷提笔写信，全按京里的款式来了。雪的信依旧按时寄来，言及冈丰女眷作歌远比京中弟子循规蹈矩，她删削得不多；又道那府上的主人打听京里风物极其细碎，她只答寥寥数语。她托人顺道往下田捎了一包冈丰的米，袋上题着二十石里的一升。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:tell_go","text"],null]']
src = "blake3:f06a342be53d8dd5581e8db7ddf77e06b241d109f48e0f370131c81ef56118ee"
text = "回信教她去。冈丰的米实实在在。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:okou:tell_stay","reply"],null]']
src = "blake3:b4ddc2b6ed285b1039c2d07cde137df86cdf4e335f5b39ab5c1366fac260db76"
text = "我回信劝她别去，却未写明缘故。她便没有动身。到了秋天她来信言道，冷泉家这一整年并无入项，叔父便把那卷歌稿付印之事推迟了，印坊的人来问过两趟，都被她打发说明年再说。信尾她依然称我“中君”，只是“中君”那两字，写得比往素大了许多。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:friend","reply"],null]']
src = "blake3:69590e6db97b8f528d19087ff2525da56260874a013e120bbcebbc7ff7aa4fab"
text = "我落笔写了上半首：夜深起风，帆吃满了风，整条船都在作响。写罢自己念上一遍，还是觉着喧闹。她接过笔去，半字未划，紧跟着续了下半首。她写的是风止之后：船身仍在游走，听得清水自船底悄悄滑开。末了她在页底并排题上两个名字，她的居左，我的居右，顺势又在我名字上重描了一笔：“你的字迹照旧潦草，我替你补这一笔。”傍晚弟子们回来听讲，她特意翻开那一页给她们瞧，称这是她的歌友。有个女童问起，哪半句是先生写的。她只道：“你猜。”"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:friend","text"],null]']
src = "blake3:af842d499bc279ff7e88c60d62ac261a9c59116c06d3667a656b8c7ea67efeda"
text = "在那页题一首海上歌咏，请她续写下半首。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:love","hint"],null]']
src = "blake3:e14833974b5ea40e56ae9ffcef47047c1fdf649ae6051640a84664225fced734"
text = "须曾将那封题着姐君的书信亲手交予她、心动 24，且情意唯独倾心于她一人。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:love","reply"],null]']
src = "blake3:689f53998e22d1261862383474a0dd0f8cf207e63d55aebccae39dc3943e3820"
text = "我在那一页落了笔，全首里半个浪字也不见，写的是七夕那夜，白绢那头低垂着头的影子。写完我并没念出声，直接将书推了过去。她阅毕，执笔在我作的歌上划过一道，划去的恰是“影子”二字，边上批了三个小字：“是我的。”她起立从书架的漆匣里拿出一封信来，信封磨蹭得发软，封面上写着我的字：姐君。封口原封未动。“说好那日方拆。”她拆了信封，内里是我十六岁时落下的笔墨。读完，她又从匣子最下层抽出另张早已泛黄的纸递予我：“回信。那年就写妥了。”纸上只载着一句歌，续的正是七夕夜我从白绢下头推过去的那首。她那晚只对了一句；而今这是第二句。那一夜冷泉宅的廊下，庭中灯笼一盏接一盏暗了。她轻声唤我“中君”，不及我作答，便吻住了我。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:love","text"],null]']
src = "blake3:73212fcf39c368630b68f293cb5c840112a70a1ae0ce57b341762d80f0981d98"
text = "于那页题一首唯独予她的歌，再向她讨那封回信。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:rival","reply"],null]']
src = "blake3:f4502e6373ba24d98e129fa01c48ab68032948a3caddc4f694ddaa4ebc3d6e7c"
text = "我把笔退还给她：“这一页暂且空着。等到了歌会，当着判者的面写。”“当着判者的面写。”她凝望我半晌，含笑说道：“终归还是要比一比。”她顺手将那页一角折起，拿指甲压平展了。“那便十年为期。从你离开京都那年起算，一天也少不得。”“还有三年。”“还有三年，”她应道，“足够你把大海写静了。”她合拢册子，摆回书架最上头那格，全格子里独独只放了这一本书。临出门相送时，她复添了句：“判者请谁，我心底已有数。届时若是败了，休要在人前跺脚。”我答若是败了，我便回船上去跺。她琢磨一会，说那也算数。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["choices","reunion_reizei_yuki:reunion:rival","text"],null]']
src = "blake3:1f67b76afb6a2146b4f9ddf209c91c5ccaa129a06fa4d3ba3c3eadfbf465bcb8"
text = "暂不题写这一页，邀她赴歌会当着判者再较一回。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["effects","reunion_reizei_yuki:reunion:default:0","text"],null]']
src = "blake3:8cd6748617dbe36f18740591513c739b441663fbb0849c594ab0b6e1abee4b9d"
text = "今年你不曾来京都。你的船停在哪处海面，我找堺的商人问询过两回，两回说法大相径庭，之后便不再过问了。歌稿已然印成。印坊那帮人把我的名字刻得极小，我打发他们重新刻了一遍。末后一页我没准他们刻歌，只叫在页角留一行字：给远来的人。今年既没等来远客，那一页便先这么晾着。我如今带了五个学生，俱比当年的你安分，写出来的东西却也俱不如你。有回一个孩子写得密密麻麻，我替她砍掉半首，她整整哭了半日。次日她另交来一首，前半段好歹能看了。宫中七夕照旧举行，白绢对面换过好几人，接起歌来倒都客客气气。你在海若作了歌，写得妥当的寄过来，我替你润色删减；写得糟糕的，我一并收好，留待你归来当面哂笑。今年我这首亦不出彩，一笔未删，附在信尾。冷泉雪。又及：坏歌也一并寄来。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:okou:count","text"],null]']
src = "blake3:5d16794fc967ca10b9a1f34359b754f724e91f28ac2adf6a6ac6d88d3f0cc957"
text = "永禄四年开春，雪的信就寄到了，比往年要早。信笺头一行墨迹压得极重：“那封写着姐君的信，你到底写了几封？”底下空着好长一截。往后才写别的：“冈丰来了使者，想找个教导女眷写歌写信的人，谢礼是二十石米。今川那头打去年起就一粒米也没来过。叔父问我去不去。”这一次她并没写“我问你”。送信的人交代，冷泉家小姐有言在先，回信就写在这同一张纸上，原样捎回去。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:okou:plain","text"],null]']
src = "blake3:73641c18a192713c435a999d49d218c866f08929b1ac52318e5d1509456b936c"
text = "永禄四年开春不久，冷泉家捎来了信，是雪的笔迹，简短得比歌会用的短册还短：“冈丰派人来请，教女眷作歌，谢礼二十石米。叔父让我前去。土佐是一条家的领地，此事是否该先向一条家知会一声？”通篇除却落款，别无他字。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:lied","text"],null]']
src = "blake3:2c88a4e72acce05ebf88d8bd549781063000128343eae400cda5a6a6c21f4cec"
text = "七载光阴过去，我的船驶入堺港泊定，我由陆路入京，登门造访冷泉家。雪正在内室讲授和歌，五六个女孩跪坐成排。她抬起头瞥见我，笔尖毫不停顿，直到将那个女童的歌划毕，这才打发学生退下。“肤色晒得跟船夫一般。”她打书架上拿下那本印妥的歌稿，掀到最后一页，页角留着一行小字：给远来的人。这回她没有将笔递过来。“堺那边的商人口风不紧，”她说道，“某年某月，哪家的船转递过几封写着姐君的信，他们记着比我都牢。而你回在纸上的是一封。”她合上书页，“流之座上的那个位置，我前年便撤掉了。坐席闲在那里，女官年年问起一回，我懒得应付。”随后她把那册书放回了书架最高一格。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:seat_removed","text"],null]']
src = "blake3:49b8af593d86b5b9c1d2bfa6bb65723571773973e8f6c7c1aed018bf4012f339"
text = "七年过后，我驾船入堺泊岸，折走陆路上京，前往冷泉宅第。雪于里屋授歌，五六个女孩跪坐作一排。她望见了我，仍稳稳将面前那孩子的歌划完，这才示意弟子们散学。“晒得如同船夫了。”她从书架撤下那册刻板印好的歌稿，翻至末页，见页角那行小字已被墨杠涂划。“当年我向你打听一个数目，你回信尽扯了些旁的事，那一截空白竟原封不动寄了回来。”她掩上书，“流之座的那个坐席，打那年我便撤了。”说着她递过毛笔：“海上的歌，拿来给我听听。”门外廊下正有未走的学生候着，其中一人还探出脑袋朝里张望了两趟。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:silent","text"],null]']
src = "blake3:999e839c1ffc1bb16088e62fd42313798a142adeb99a976408d519cb2802fe43"
text = "七载过后，我的船驶泊堺港，改由陆路上京，往冷泉家去。门房说小姐前年动身前往土佐冈丰，于长宗我部府上教了两年女眷，开春才归京。雪正在内室教歌，见了我，笔尖滞于半空，便先叫弟子散学。“一条殿。”她这么唤我，这两年来往书信里也是这等称呼。“冈丰的米确是上等好米。”她从书架摘下那本付梓的歌集，封皮题着她的名讳，翻至末一页，页角印着行小字：给远来的人。她递过笔来：“海上的歌，拿来我听。”院外有人扬声呼喊“一条殿的船到了没有”，听得出是堺派来的脚夫。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:stayed","text"],null]']
src = "blake3:343186d54593b2e808d9726d41da62c61f5d83128b78353e895e348d00d6efcc"
text = "七年过去，我的船入堺停泊，我走陆道进京，登门冷泉家。雪在里间教歌。五六个女孩子跪坐成排，人前各有一枚短册，短册以旧纸裁成，背面仍透得出他人的笔墨。雪抬首看见我，手上的笔停在了半空，叫学生们先散。“晒得像个船夫。”她打架上取过一沓装订起的稿子，连封面也没有。“印坊说推到明年。前年他们也说明年。”她翻到稿纸最末一页，纸面空空，只在页角写了一行小字：给远来的人。她将笔交到我手中，笔杆缠着一圈陈旧的线：“海上的歌，拿来我听。”穿订稿子的线断了一处，她正用手指按着。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:told","text"],null]']
src = "blake3:a5e715eb05a3bd135223e35ab00c20e0d16a50624a316a0cde0fcb21951aba46"
text = "七载之后，我的船靠了堺，我循陆道进京，去了冷泉宅。门房言明，小姐前年刚自冈丰归来，曾在长宗我部家教了两年女眷。雪在里间授歌，瞥见我，手中笔悬停，忙打发学生们先散了。“一条殿。”她近两年寄的信里，也总是这般称呼。她从架上拿下那本印妥的歌集，翻到最末一页，纸角那行“给远来的人”犹在，只是一旁原本留空之处，已然填上了一首写于冈丰的歌。她随手递笔给我：“海上的歌，拿来我听。写去旁张纸上吧。”随即便将一张冈丰所产的楮纸推到我面前。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:went","text"],null]']
src = "blake3:4b10880bbc21ed61b37244818c34a6f2996acd3cdf96e979da4b834d4e4fcce7"
text = "七载一过，我的船靠了堺，改走陆路上京，拜访冷泉家。门房道小姐前年去了土佐冈丰，教了两年女眷，直至开春才返京。雪在里室教歌，矮几上摆着一包冈丰的米，口子上拿草绳束着。她见着我，先叫学生退下。“晒得跟船夫似的。冈丰的女眷问起你的事，比她们家主人问得都要细致。”她拿下那本印好的歌集，翻到末页，页角一行小字：给远来的人。她将笔递予我：“海上的歌，拿来我听。”案上那包冈丰米，她随后打发人送去了厨下，说今夜煮食。"

[entries.'["stories/bonds/bond_reizei_yuki.toml",["variants","reunion_reizei_yuki:reunion:with_ushio","text"],null]']
src = "blake3:f6ae8bb08eb3c4e4f6bef4913c3ddd003ff78aee3561362fb07ac6582fa93cd5"
text = "七载已逝，我的船泊进堺港，循陆路进京，去了冷泉家。雪正在里屋教歌。五六个女孩排排跪坐着，各人跟前铺着张短册。她落笔在一个女童的歌纸上划掉一道，那女童抿着下唇，眼圈顿时泛红。雪一抬头正撞见我，悬笔停于半空，便唤学生们先散去。“晒得像个船夫。”书案上头压着一封打土佐寄来的信，笔迹有些歪斜。她瞧见我视线落在上头，顺手将信朝书册底下塞了塞，掩进去半截。随即自书架取过那本印毕的歌稿，掀至最后一页。纸页全空，单单角落里有一行小字：给远来的人。她递过笔：“海上的歌，拿来我听。”那封土佐来信，仍有半截露在书页外面。"
