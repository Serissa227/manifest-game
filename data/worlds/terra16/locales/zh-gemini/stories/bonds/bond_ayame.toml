[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:a1","text"],null]']
src = "blake3:4eb824747beb6dc02a6b88c69ecc9414d00599d9e9a46d44ecc3ede4a84cb710"
text = "弘治二年春天，宝镜寺的尼僧全去了别院，院子里只落下一株迟开的山樱与我们二人。菖坐在廊檐下，双膝空空，两手拢在袖筒里。静了半晌，她才出声：“一条大人在船上学的那一套，到这儿全派不上用场。上臈讲您数钱的时候，嘴唇都在跟着动。”我回身进了里屋，抱出一大摞抄本搁到她手边——寺中留下的旧歌集、借来未还的《伊势》、不知谁誊到一半就搁笔的《源氏》，纸页卷边，页序错乱，好些年不曾有人翻动。“搭把手分一分。”她打量一番那堆纸卷，又抬眼望我，随即端正跪好，逐册翻检起来。歌集搁在左手边，物语归往右手边，不成卷的残本单摆在当间。忙活了半个时辰，日光斜移过来，不知何时她的一只脚从衣摆下悄悄探出，越过檐影，正晒在暖阳里。她自个儿先发觉了，忙缩回去，顺手将当间那册残本的书脊理齐。“有一册归错了地方，”她说，“《古今》掺在物语堆里了。”她把那册抽出，稳稳放在左手那摞的最顶上。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:a2","text"],null]']
src = "blake3:67f82e97c85f6b569f140c4d35afaf254c4d19739edcc8bda9442e525a959bd8"
text = "刚过重阳，菖带来一柄亲手题字的折扇：正面录着一首古歌，背面则是她新近作的。我凑近灯影翻看背面，见第三行有处纸胎略薄，起着极微的绒毛，显是用小刀轻轻刮去旧迹又补写的。刮得十分精细，不凑近了根本瞧不出破绽。“那儿写岔了一个字，”她语速很快，“原打算重作一柄，无奈手头只余这一副扇骨。”说着从袖中摸出一小片裁妥的补纸，四缘修得圆润，色泽与扇面丝毫不差，“糊上去便遮住了。”“不必糊。”她指间捻着那方小纸，望一眼扇面，又望一眼纸片，再转回扇面，指腹竟将纸边揉出了褶痕。末了，她把纸片对折又对折，重新敛回袖中。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:b1","text"],null]']
src = "blake3:9bbcbe5f1f40178be47925e8f310969735f61c1ce03d98c07e6bb2ec2e024b80"
text = "十一月月次歌会，题作“初时雨”。我未曾报名，只在末座替上臈研墨，席间情形看得真切。菖那首吟罢，满堂皆颔首称好；谁料判者却在判词末了添上四个字：“工而无情。”这一番竟判了她负。待散席后，众人结伴去烤火盆，独她留在原处叠那张怀纸。对折，再对折，每道折线皆以指甲细细刮压，四角贴合得半分不差。我行至她身旁，她连眼皮也不抬：“您特来看我出丑？”“来看你如何叠纸。”她指尖一顿，抽出判词平铺膝头，点着末梢那四字道：“先前那些皆是敷衍的客套，惟独这四字切中要害，我服气。”廊外恰飘起今岁头一阵时雨，敲在竹帘上沙沙作响。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:b2","text"],null]']
src = "blake3:a7a84111643bff7d4cf1c4032a493a1ab9208b20d44a4d5a95a69c257d4e4575"
text = "尚未改元弘治的那个正月，朝廷寒窘得险些连元日节会都筹不出钱来办。上臈谈及此事，也只长叹一句：“天下光景便是如此。”大炊御门家的用度同样吃紧。局中女伴私下议论，说菖的母亲连箱底压着的那件好衣裳也拿去典当了。自那以后，菖当差便常着一袭旧单衣，素色早被水洗得淡薄，两只袖口却依然齐整如常，折痕俐落得仿佛拿刀裁过。那日她跪在我身前归置香具，身子略俯，我恰好瞥见她两肩胛间横着一道补缀——针脚粗重而细密，丝线颜色也深浅不一，显是夜深就着油灯仓促赶缝的。她察觉了我的视线，搁下手里香盒，脊背猛地绷直，却不曾转头。“缝补过的照样是衣裳。”她开口道。“我并未说不是。”“您的眼神说出来了。”她合拢香盒，重又捋平袖口，“今日这炉香，请您来点罢。”盒底其实只余小半块沉香。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:c1","text"],null]']
src = "blake3:3db4fe56801e7e1ab60ddf3f69c9ac6fa6597e99cfc6b4b56b53a1bc928b09cc"
text = "天文二十三年春，是我入宫的首日。上臈所居的局在长廊尽头，纸门紧闭，门外早跪了一位与我年纪相仿的少女。她先将左袖口捋顺一遍，再将右袖口捋顺一遍，复又从左手理起，直整到第三回，方将双掌敛回膝头。我挨着她侧身跪定。她视线垂落到我右手上——虎口处沾着一片乌墨，原是清晨在淀川船头替船夫核对账目时蹭下的。她自袖中取出一块叠成四方的湿巾，递至我眼前。“这一块布暂且记下，”我随口道，“船上的账目若不记分明，可是要闹争执的。”“此处并非船上。”她嗓音极轻，字字句句却皆落在实处，“先理妥袖口，再行出声。”言语虽说得沉稳，伸着巾帕的手却微颤不止。她自个儿也觉出了异样，忙将手抽回，连同指尖与湿布的寒气一道藏进了袖筒深处。纸门内，恰好传来上臈的一声轻咳。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:c2","text"],null]']
src = "blake3:80e50c8097de71f30f04b0f8ed3963fe64f8a6ad13a327c042efb1edf1884a48"
text = "才出梅雨，局中闷热如笼。菖在廊下架起一张膳桌，桌上搁着一只空碗，她托着碗反复演习侍膳转身的架势。“烦请您替我盯着，”她说，“只管挑剔错漏，不准夸赞。”头一遭，她转身过急，裾角扫过桌沿，桌脚“咯”地轻响一记。我点出来，她颔首应下，退回起点重新来过。第二遭是肩头抢先动了，第三遭则是膝盖落得迟了半拍。我每指出一处，她便答一声“是”，半句不争辩。练到后头，我非得眯起眼才觅得出瑕疵，末了只得挑她呼吸略显沉重。“那亦是失仪，”她道，“再来。”其间她亦邀我试上一试。我捧着那只空碗刚要拧腰转身，脚下一绊，碗口正撞在下巴上，衣摆绞住脚踝，险些连人带碗扑进膳桌上去。菖抢上一步托住了碗，却未拉我一把。她把碗安放回桌面，捋平两只袖口，复又跪回起手处：“第七回。请您继续挑错。”我这厢下巴还在隐隐作痛。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","bond_ayame:s","text"],null]']
src = "blake3:60921cee66726587c861f99c2c9d5a520204bf162bb389009278018a4923e302"
text = "十二月里，土佐泊来的船已在堺候我，只等开春便扬帆出海。临行前夜，菖特来局中为我饯别，携来一沓裁得方正齐整的怀纸，言道供我途中作歌之用。“日后的歌合，我依然要同您较量，”她端跪着，双手仍袖在里头，“唯独往来书信里，不须回回写明孰胜孰负。”“那你如何分晓自个儿赢了不曾？”“我心里有数，您亦如是。若落于笔墨，反倒像要央请上臈裁断一般。”我将那沓怀纸清点一遍，整二十张。她静瞧着我点清，方才问道：“行船之人点纸也这般快？”“海上讨生活的人，不论点甚么都利索。”她把纸沓往我身前又推过一寸：“船舱湿气重，从第七张起往后的您先取用罢。”原是她向上臈讨来的纸，纸缘正钤着上臈局里的印记。"

[entries.'["stories/bonds/bond_ayame.toml",["chapters","reunion_ayame:reunion","text"],null]']
src = "blake3:a14a2ee23ba7d6c8a9561b92b24ae6b77672842fe192a1762993e67779f286a8"
text = "永禄四年，我因一桩商事重返京都，须往某位公卿府邸呈递礼单。递送规制我尚记着七八分，余下两三分拿不稳，便先入内里寻菖请教。她如今正侍奉于上臈左右，局中人皆私议，上臈那个位置来日必由她接掌。我赶至时，她恰跪于一名八九岁小见习对面，正指点那孩童理袖：“先左，后右。理妥了，双掌敛回膝上，不可再触。”孩童整了三遭，直至第三遭方才服帖。一侧老女房仍在闲话去岁旧事：正亲町天皇的即位礼拖延数载，终于办成，全仗着西国毛利家进奉的银钱。菖接过我的礼单瞥了一眼：“您的歌，我前年读过，极好。唯独这份礼单乃武家折法，若在内里呈出，旁人少不得要嗤笑一条家失仪。我替您重折，您立着莫动。”她手脚利落地改过一处折痕，演示了一遍呈单仪态，复俯身替小见习摆正偏斜的坐垫，方才转面向我，目光沉静：“一条大人如今往来所见诸人，皆是如何行礼的？”那小见习在旁偷着把袖口又捋了一回。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a1:sort_together","reply"],null]']
src = "blake3:c0635de948c108e98b8bfda99b510f36512f21bd9d77b73f6ce994f356ca14a0"
text = "我俩弄岔了好几处，一册《古今》掺进了物语堆里，谁也懒得再去挪动。她叮嘱道：“今儿的事，莫让上臈知晓。”我笑言说了也无人会信。山门那头悠悠传来暮钟，她收回探出去的脚，重又跪正，将袖口自左而右细细捋过一遍，而后朝我微微颔首：“一条大人，今日多有叨扰。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a1:sort_together","text"],null]']
src = "blake3:dbe94086193157a74b2be727a0af0b96f56a230706429cd526e728f6bff2999e"
text = "就这般伴着她往下分，直至暮钟敲响。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a1:teach_counting","reply"],null]']
src = "blake3:ee2f894540b11760d3f878276679968d7bd6163368d1a21151a0a4a617bad656"
text = "我五枚攒作一叠，指尖一捻一落，目光却只锁在她面上。她竟领悟得出奇之快，点到第三叠已然比我更加麻利，心头一喜，竟忘了抬袖掩口。“这法子倒比作和歌容易些。”话音刚落，她猛醒过来，急忙敛低嗓音，“学过这一手的事，万万不可往外透漏。”说罢将几叠铜钱推还回来，又单从里头拣出一枚：“这枚是私铸的劣钱，边沿削薄。您收钱时也不留神瞧瞧。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a1:teach_counting","text"],null]']
src = "blake3:54cf5935a8b4bf0694d31bf05a5eabedf03e1924cb93d46c6d29ac65480d7125"
text = "倾出一把铜钱，授她船上点钱的法门：五枚一叠，眼不瞧手。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a2:ask_perfect","reply"],null]']
src = "blake3:7125328e074e79eb88641df09cc75d395ab36f085276fe09d86f3fce83d8f6a7"
text = "旬日过后，她果真另题了一柄送来，至于那扇骨是从何处借来的，却半字不肯透口风。两把折扇一并摊在我案前：“请您亲择。”我拣了那柄光洁无痕的。她微一点头，将先前那柄拢合收妥，欠身告退。次日一早，局中新进的两个小见习便被她挑剔了整整一上午的袖口。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a2:ask_perfect","text"],null]']
src = "blake3:4aa987d5cad07efdedcb393c758e9f33078db8c1bcb7e7d14ace6ec3a507daf0"
text = "仍是央她重题一柄，丝毫刮痕皆不许留。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a2:keep_scrape","hint"],null]']
src = "blake3:8c61f52e39a7638e1e6b78bee1f89239510a5c7e687a557a337bc31310aacf5b"
text = "情谊 80、羁绊 B。那柄扇子她仍攥在掌心不肯撒手。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a2:keep_scrape","reply"],null]']
src = "blake3:954ca5ee4e66a84a60d4ab10dcaf5997a23d98f580fc8111751f5694d091aa02"
text = "她执笔在刮擦处侧畔落了一行蝇头小字，正是改字那日的年月，写罢又于末梢添了一个更小的字：菖。“这还是我头一回将未写妥帖的东西赠予旁人。”她收拢扇面递与我，“切莫拿去示人。”我正待收进怀中，她忽又嘱咐一句：“不过须得日日使着。拿扇骨那一面朝外，那一面半点没出错。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:a2:keep_scrape","text"],null]']
src = "blake3:399e1db8fcd8362ec5e8be36c1730e5270cf49e0a650fd1abdd23a9040e58306"
text = "纳下这柄留有刮痕的折扇，央她在旁侧题上改字之日的日期。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b1:enter_next","reply"],null]']
src = "blake3:2cc3f3fdeb6ae7c934a6ccbfedbb0b714cc18f1f8e262e12a36e5ff76765183d"
text = "她闻言仰起面庞，眼底骤然一亮，全然不见方才落败的模样。“既如此，便依着规矩比上一场。”她将判词敛妥，“休想我会让着您。”是夜，全局之中唯独她屋里的灯火熄得最迟。我隔着纸门听她一遍遍低吟浅诵，听到夜深，连我也背得出她究竟换了哪一个字。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b1:enter_next","text"],null]']
src = "blake3:a19e255880ffb09401488d8342e43983f8a650339ccf1414c10e86ba07f94278"
text = "告知她，下月歌会我也一道报名，与她分个高下。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b1:read_judgment","reply"],null]']
src = "blake3:285d2cc7f2e3521aa2b15eb61b1505dd0071e0dfd7b25ce74962e6bf97e57b1f"
text = "她轻诵一句，我便拆解一句：何处是判者应付的门面话，何处方见肺腑。及至读到“无情”二字，我撇嘴道，那判者自个儿的歌也未见得有多少真情。她闻声敛起判词：“判者歌艺高下，非今日之议；今日之议，是我负了。”炭盆内恰有一块银炭塌落，她执火箸拨匀，随即把判词折好，四角切齐，起身向我辞别。行至纸门边，她忽回首道：“一条大人，您方才那番言语，日后在宫中切莫再提。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b1:read_judgment","text"],null]']
src = "blake3:592d5616786683c47a875901ba592b7d66c2d04358d59b727c946ba0e9cea552"
text = "伴她将判词逐句细读下去，直至暮色四合。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b2:mend_seam","hint"],null]']
src = "blake3:1f47d8ef87264c8aef1a387be4022f96d5388e7a37def007279398eba3046374"
text = "情谊 50、羁绊 C。她将那件单衣搂在怀中不肯放。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b2:mend_seam","reply"],null]']
src = "blake3:00531057024a3f31b851543e6ceba41795c82bff31cabd18f086cd8641f86575"
text = "她初时执意推辞，半夜里却静悄悄将叠妥的单衣搁在我枕畔离去了。我挑亮残灯，拆去原先那道补缀，另拣色泽相近的丝线，顺着衣褶的折线一针一针重缝严实。翌日她着衣上身，对着铜镜左转一圈，又右转一圈。待我当差归来，枕边已多出一包干柿子，包纸上端端正正落着一行墨迹：“针法胜我一筹。唯第三针略偏了半分。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b2:mend_seam","text"],null]']
src = "blake3:e0de05ff993cf3b04fc9948bd61f061eacf2eaba2cf79973fab03f9aa024a734"
text = "入夜借来她的单衣，拆开旧补重缀，将针迹密密藏入折痕。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b2:say_nothing","reply"],null]']
src = "blake3:e58319896a5a366a08df76dd0e2161352a3a368944bceb8e6d30c778dbbcee00"
text = "那整整一日，无论她步至何处，我皆寸步不离跟在她身后半步。上臈终究按捺不住发问：“澪，你几时成了菖的影儿？”满局女伴闻言皆笑。菖回首瞥我一眼，面上未露笑意，却也未如往常那般挑剔我行路摆臂太宽。谁料翌日起，她便把这一桩一并补挑了回来，数落得半处不曾漏下。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:b2:say_nothing","text"],null]']
src = "blake3:063930726c74a3b6043cd00600a361cddcb10a7e90e9e9424a6590391c908451"
text = "佯装未曾瞥见，当差时紧站她身后，替她遮住那道补迹。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c1:hand_back","reply"],null]']
src = "blake3:c428a155d74098b636b84e3e23a4b86b5a9963474af3d0c4f6039b6950ef2399"
text = "她霎时失了血色，低声道了句“失礼”，将手连着湿布一并敛进袖中。入内以后上臈垂询，她对答如流，半个字也不差，眼神却丝毫不往我这边扫。那整日她皆未搭理我，次日还把同局一个小见习的跪姿挑出了七桩错处，直把那孩子训哭了。及至黄昏我归返局里，砚畔多出一锭新墨，以一张叠得方正妥帖的纸包着，纸面题着二字：袖口。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c1:hand_back","text"],null]']
src = "blake3:929f41d762910e3e7c206405a2654fdcc3675d27dea5fbed3bfd5a93b5e3eb84"
text = "笑称土佐海风远比墨汁难洗，将湿布递还，请她先拭一拭自个儿指尖。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c1:wipe_ink","reply"],null]']
src = "blake3:41ac40304f703934d3038aee70476de19aa1e3b6082a547577ddd382ba2f8533"
text = "我使劲将虎口拭至泛红，复摊开掌心示她。她微一颔首，收回湿布，重新折作原先的四方块。纸门豁然拉启，她错身让出半步，示意我紧随其后。上臈垂问家世门第，她率先回禀：“大炊御门家，菖。”咬字半分不差，连停顿长短都宛若尺量过一般。及至轮到我，我便依样学着她的节奏答了。上臈打量过她，又审视过我，到底未寻出破绽。待退至门外，菖才压低声气道：“您方才第二个字咬得太实。土佐乡音，日后须得改改。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c1:wipe_ink","text"],null]']
src = "blake3:3c58d4512f16ca8a3b91fd4399f48cbe3a24bd9672d1bbd621544d345e539dfa"
text = "接下湿布，当着她的面拭净墨迹，随她一道入室。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c2:count_seven","hint"],null]']
src = "blake3:e2fe473240db27d7ab9b7bb91dcc8ad449e6565a9e02298c3e8ec5438192b72d"
text = "情谊 20。她决计不愿在您跟前失仪第二遭。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c2:count_seven","reply"],null]']
src = "blake3:c085485f8713c8724123e612491f3a44200d135da96d9e6d5cb916882fe9f306"
text = "第七遭转身毕，她的衣裾距膳桌犹有一指空隙，空碗安稳托于掌心。我言道已挑不出毛病。“请您再审一回。”她仍信不过。复又演了一遍，我依旧寻不出半点错漏。她方将空碗交进我手里：“今儿便到此为止。明儿换您来转，由我来挑。您的短处，我可半桩也不会少说。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c2:count_seven","text"],null]']
src = "blake3:fef23e1170a4bc62fa8bdd11874dc588d0ac3ec49487f2f0744ef6bd3ddfc8fc"
text = "伴她演习至第七遭，每回皆认认真真指摘一处。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c2:just_praise","reply"],null]']
src = "blake3:79b1239fc54ae22fd0332c513ae3619b5612f8c28386fc77f56a5b6158ecfe00"
text = "她面色登时沉白：“我央您挑的是错处，不是听夸漂亮。”言罢敛起空碗，连膳桌一并撤走了。翌日，她另邀了典侍家的女儿去廊下替她挑错。打我身畔掠过时，她步履丝毫未停，只向我行了一记全礼，周正体面，即便面见上臈亦不过如此。自那以后一月有余，她在众人面前皆唤我“一条家的姬君”，生疏而客套。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:c2:just_praise","text"],null]']
src = "blake3:6bbf27a19a337d14f44b3c7d1d7db87f83ee3c51b8fe371d1a9e7a646aa5db5c"
text = "不再挑错，只道一声：“漂亮。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:s:own","reply"],null]']
src = "blake3:d1c1a9918dfca2e5104b7e54df5dd555cbc39cc3467e3f96844addfe8717feef"
text = "“一言为定。”她应得利落，“届时延请一位判者来，落败者不许求饶，亦不准将船上粗俗白话入歌。”“这可难讲。海上的言辞，有时反倒比宫里的悦耳。”她闻言直勾勾瞪着我，瞪了半晌，竟失声笑起来，也不抬袖遮口，笑得双肩轻颤。笑毕她慌忙将袖口捋平，自那沓怀纸中抽出一纸，落笔题上“弘治二年十二月，约歌一番，未比”，折妥压入我行囊最深处：“这一局权且记账。日后取出来兑现，休想赖账。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:s:own","text"],null]']
src = "blake3:2d1ffe63c4c99cb156bcfff620b44dff9ee6df30e27737a5c18e65e88a28d17b"
text = "约期来日重逢，依着规矩正正经经较量一场歌艺。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:s:promise","hint"],null]']
src = "blake3:80492f8eb0fd9a1d6f64d53a5fbea91a288f82138fb4da45aaeaf9af5310c087"
text = "羁绊 A。一生一世之约既已许予他人，此番唯余互道珍重。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:s:promise","reply"],null]']
src = "blake3:063d9bb97a599c01755970ac009712b63b3773a36c81c5d2ef4ce67d011fd7b8"
text = "“只替您正折法。”她说道，“内里所书何事，我一概不窥；自哪府递往哪府，我亦不过问。”“既不阅内容，如何改动？”“折法自有折法的体统，与文辞无涉。”她自袖中抽出一纸，详问了我在土佐的落脚处，一笔一画工整录下：国名、郡名、船东名号，乃至那渡头的旧时称谓皆追问妥帖方才落墨。写毕她轻轻吹干墨迹，叠整递还我，袖口竟未染半星乌墨。“寄来之件我改妥寄回，回函便只题二字，您莫嫌简慢。”廊外恰又潇潇飘起时雨，一如当年歌会散席的光景。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","bond_ayame:s:promise","text"],null]']
src = "blake3:0aa904003f6b40f1f44b2d2dc011c6fd8a4ef19a5c0ebb0d4c86e3c8677024c1"
text = "约妥日后呈入内里的礼单、奉书，皆先寄她修正折法。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","reunion_ayame:reunion:one_more_match","reply"],null]']
src = "blake3:7ce3a7d2082357f873a8075c9136f0e912a9d1e761a3d38d9343a421e6c5708f"
text = "她嘴上道宫中歌合断不容这般胡闹，话未落音却起身取来怀纸。题目是由小见习掣出的“归帆”。我写舟楫尾随的海风，她咏重重宫墙之外遥不可见的大海。孩童双手捧着两幅纸页读了良久，伸指点了菖那一首。“做不得数，”菖摇头道，“这孩子由我调教，自会偏袒。”“那便算我胜出？”“权算平局。”我二人为“平局”二字一直争执到灯油将尽，那小见习早趴在坐垫上酣睡过去。菖卸下外衣轻覆于孩童背上，孩子翻了个身，梦呓里犹自含糊咕哝一声“菖大人赢”。菖佯作不闻：“来日须另邀一位素不相识的判者。您那首里头，次句的‘帆’字使重了。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","reunion_ayame:reunion:one_more_match","text"],null]']
src = "blake3:295d787d218d7fc527c31a1b4108641638b538ad155fda95176dfc4d7f908cab"
text = "邀她当夜即比一局和歌，便请那小见习充任判者。"

[entries.'["stories/bonds/bond_ayame.toml",["choices","reunion_ayame:reunion:tell_bows","reply"],null]']
src = "blake3:c684f6e5a7c66bd31386b0b7670b2924efcf174c2a3364dbe4e3432f292783f9"
text = "我先依着澳门的葡萄牙人比划起：摘帽，退后半步，躬身施礼；次而摹仿明国官员长揖，双掌抱拳，自胸前平推出去；又再学起琉球使臣的叩拜。菖端跪在旁细观，神色比昔日盯我捧膳还要专注，逐一指摘我举止间的偏差。演至暹罗人的礼数——曲膝跪地，合十举过眉额，复伏地三叩，她忽扬手唤停：“此等礼节宫中从未得见，烦请重演一回。”我便又依样做了一遍。她随即招手唤来那小见习，命孩童随我摹学，自个儿则立在侧畔审视。孩童比划得七扭八歪，她俯身托平那双稚嫩小手：“且先照样做规矩了，雅观与否，留待日后。”说罢她将暹罗人那一拜描摹于怀纸之上，四边对齐，郑重夹入教习礼仪的册本中。送我至廊前时，她施了一礼，用的正是宫禁之内送别外客的规仪。“一条大人，途次保重。”"

[entries.'["stories/bonds/bond_ayame.toml",["choices","reunion_ayame:reunion:tell_bows","text"],null]']
src = "blake3:417b4c306dc939123bd71eefe393bfdef1a7f40c638bf191399150a76bcdc60b"
text = "将这数载行经诸地所见礼仪，逐般演与她看。"

[entries.'["stories/bonds/bond_ayame.toml",["effects","reunion_ayame:reunion:default:0","text"],null]']
src = "blake3:13b63c7798681fb328cf004a6bd6444ee6dc04c1d22da29c48e77e4b6dc18bc1"
text = "一条大人：今岁未能得见一面。上臈将新近入局的小见习托我照管，年方八岁，袖口非得整上三回方才齐平。去岁御即位终归礼成，宫内总算度过一个毋须向旁人赊借灯油的寒冬。承寄礼单，第二道折痕弄反了，业已改妥，随函奉还。下回呈送公卿府上，切记先右后左，万勿倒置。余者琐事，书信中皆不须赘言。菖"

[entries.'["stories/bonds/bond_ayame.toml",["variants","reunion_ayame:reunion:promised","text"],null]']
src = "blake3:b71b2e3eebc4abd9e428ae509fda487a8192124cabe288064a3cc977f4985493"
text = "永禄四年，我为操持一桩营生返归京都，须赴某位公卿宅邸递送礼单。这数载以来，凡我欲呈往内里的礼单、奉书，皆先寄予她审正折法后再寄还，她的回函向来寥寥二字：“收到。”有一遭我曾暗暗在礼单内夹附了一首歌，她修正折痕寄归时，那首歌原封未动夹在里头，回信依旧只是那二字。此番我径直入了内里。菖正侍奉上臈左右，跪于一名八九岁小见习身前，教那孩童整顿袖口：“先左，后右。整妥之后，双手收回膝上，不准复碰。”她接过我手中礼单，连字迹也不瞥一眼，翻转过来直盯折线：“这一折，您到底还是折岔了。我信中曾提点过两遭。”她手势利落地改毕，复俯身替小见习摆正坐歪的垫褥，方才回首看我：“一条大人现今往来接物之人，皆是如何行礼的？”我攥回手里那份礼单，折痕早被她掐压得笔直如锋。"

[entries.'["stories/bonds/bond_ayame.toml",["variants","reunion_ayame:reunion:rematch","text"],null]']
src = "blake3:ea3ddafd75b20fbfc275833f80031f91d9cd94e9abf30421bcfd1ed38c7ef19a"
text = "永禄四年，我因一宗买卖回到京都，要去一位公卿家中递交礼单。当年临别所记下的那局和歌，迄今尚未较量。我拿捏不准递单的体例，遂先入内里寻菖。她现下正在上臈跟前听差，跪于一名八九岁小见习对面，指点孩童整理袖口：“先左，再右。理顺了，掌心敛归膝头，莫要再抚。”旁侧老女房犹在叙说去岁光景：即位礼拖宕数载，总算如期办妥，全凭西国毛利家献纳的财帛。菖抬眼瞧见我，开口头一句便是：“那一局约歌，我犹记于心。”她审过我的礼单，修正一处折法，比划了一遍递呈手势，又俯身替小见习摆平坐斜的垫子，这才转过身来：“一条大人今时所会诸人，皆作何等礼数？较量和歌之前，我须先掂量您在外头究竟荒疏成甚么模样。”"
