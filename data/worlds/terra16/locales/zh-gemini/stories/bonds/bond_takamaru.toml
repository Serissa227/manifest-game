[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:a1","text"],null]']
src = "blake3:026261bbebefb66cfb02836656bbaa1bf4b6b7da075602e70e5b04ff33ca9c38"
text = "盂兰盆节，我请了假回土佐。才到下田第二天，河口恰巧又赛竞渡，鹰丸也打能岛赶回来了。他驾的仍是旧船，船板上的刻痕却又添了新的一排。我向渔户讨了条小船。鼓声未落，旁人的船我一概不理，只把眼死死钉在水面上。左岸那道深水线还在，只略挪了些许。鼓点一催，我便压着水线贴过去；木桨刚入水，船底竟似被人托了一记。身后传来叫喊，我头也不回，使尽气力往岸边抢，船首抢先磕上了石阶。鹰丸慢了半个船身。他拢岸后一把扯下头巾，揉成一团甩过来，不偏不倚撞进我怀里，随即转过身去扶稳自家船舷。岸边有人高声问谁赢了。他扭过头，胳膊伸得笔直朝我一指，大声喊道：“这笔账我记下了：你还欠着我一场。”“明明是我赢了，怎么倒成我欠你的？”“胜了一回，就得再赛一回。这是能岛的规矩。”话音刚落，他把船扶正，弯腰拾起甩在岸上的木桨。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:a2","text"],null]']
src = "blake3:e92a317e567ed038383bcaf7899f188bb6c1f346c4f391f3ca80569cff76a3d4"
text = "放夏假时，我再一次回了土佐。薄暮时分，鹰丸寻上门来，说要引我瞧件物事，径直带我爬上岬角。四下暮色合拢，海面上零星冒出火光，初时不过一两星，转眼便连缀成片，原是追逐鲣鱼群的渔船燃起了松明。“开春回能岛后，我成了小早的船头。”“可喜可贺。”“有什么好贺的。”他抬脚将一块石子踢落崖下，过了好一阵才听见水声，“去年严岛那一战，能岛归在陶家一边，却半条船也未派出。如今陶家溃败，我们一箭不曾放。选错了边，又未曾接仗，你倒说说，这算不算是败？”我尚未理出头绪，他已自怀中摸出一块叠得四四方方的素麻手巾，一隅拿白线绣着他名字的首字。“往后你若出海，便将它拴在桅杆上，”他递过手巾，目光却望向海面，“省得我认不出你的船。”海面上的松明又多燃了几点。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:b1","text"],null]']
src = "blake3:dee7e8ceed2e7bc15516c0d7c76bc1184b6b875fada8fdf6561b332944558a4d"
text = "开春我便要上京，入宫学着做女房。风声才传到河口，次日清晨鹰丸便找了过来，掌中握着一截树枝。“京里的人搭船，身家性命全押在船头手里。你得自个儿瞧明白。”他蹲身在退潮后的沙地上，自左而右勾出濑户内海的模样：何时潮涨，何时回转，哪几条水道一旦换潮便会拽着船往暗礁上撞。来岛、能岛、因岛，一岛一个圆圈，水道拉作曲折的线；描到能岛时，他又在旁多圈了一笔，说那处是番所。阿濑坐在岸边一条残破的旧船上，替我缝制上京的衣裳，走上几针便抬眼朝这边望望。我将来岛一处转潮的时辰念差了。他“啧”地一声，举脚便要将那一行沙画扫平重来。我赶忙一把扯住他，跑去拾回一捧贝壳，把错处逐个按压住：“且留着吧。下回我便记牢了，船是打哪儿搁的浅。”他悬在半空的脚生生顿住。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:b2","text"],null]']
src = "blake3:f0001b6c1f6febd0d299fbee5f8b517982f8d97ea7d5919c94aafb08ad14234d"
text = "入京之后，鹰丸每年都捎来两封书信，都是托能岛开往堺的船只带去堺，再打堺辗转送进京城。用的是船上记账裁余的纸张，翻到背面还能瞧见旁人写的数额。信里头尽是潮汐与船只的琐事：哪一艘小早在来岛水道倾覆了，救起四个人，却折损了两支木桨；今岁春潮换向比往常早，提早了小半个时辰；他又置了支新桨，坠手得很。至于宫中光景如何，他半个字也不曾问。每一封信的末行总归是那一句话：“下回我让你。”第二封信送抵那日，我借着灯光摊开信纸，光影打纸背透过来，末行下方却现出一片起毛的印痕。我将信纸举向灯盏斜睨着看：那块纸面曾被小刀刮拭过，薄得几近透亮。原先落下的定是旁的字句，如今早已半笔不剩。同房的女房见状，问我因何发笑。我答道，能岛的潮水今年转得早。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:c1","text"],null]']
src = "blake3:747fe8179eeb1cb23556c405810dbcc18ab9763b3d8e0481ac571c5971754821"
text = "四万十川奔涌到下田口，正迎头撞上倒灌的海潮，竞渡的舟楫便挤进那片浊浪里争先。我磨了乳母阿濑足足三日，她方才松口将我塞进一户渔家的轻舟，临行千叮万嘱船主千万护好姬君，别教人跌进水里。鼓声骤响，我便死命摆桨，半截桨片直拍得水花四溅。前头有只船偏不循中流直行，斜刺里贴着左岸一道暗沉沉的水纹窜出去，眨眼工夫便把众船抛在身后。我咬牙追到末尾，仍落后了他两个船身。那人收桨拢岸，纵身跃立船首，一张脸晒得黝红，咧开嘴露出一口白牙：“公家的姬君原来使不动桨啊。”岸边一众渔夫哄然大笑。他伸手自腰间拔出短刀，在自家船板上深划了一道。那船板上早密密排开了一长溜长短不一的刻痕。“第十七场。落后两个船身，我就实记两个，绝不打折算一个半，你也别跟我缠磨。”我攥住浸透的衣袖拧水，水珠哗啦啦砸在他脚畔：“既有这一笔，就把我的名姓一并刻上去。败在谁手里、差了几个船身，全得落个明白，这种糊涂半拉的账我可不认。”岸上渔夫们的笑声越发响亮了。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:c2","text"],null]']
src = "blake3:4a1e1f7162153f74a141ca7c5c4f55064f74874edfcf8bb8c449946a46f89cba"
text = "汐硬拽着个人过来见我，说是她表兄，打能岛来的，借住在下田的叔父家度秋。我定睛一瞧，可不正是竞渡那日在船板上刻痕的少年。他名唤村上鹰丸。我们三人围着河滩上一艘几欲散架的小早，船底裂开的一道大口子，足能塞进两根手指。鹰丸抛给我一只粗布袋：“你只管往外递钉子，余下的莫动。”袋中船钉长短参差。我全倒在一块船板上，顺着短到长码成一列，数来恰有二十三根，便开口问他：“哪几根砸下去会透穿船底？”他蹲身下来逐根捏在手里掂量，拣出最长的两根，扬起胳膊便甩进了海里。“那你原本打着用哪一根？”他不作声，一矮身钻入船腹底下，用脊梁骨死死顶住船板：“把缝隙按住了！我在下头顶，你在上头压，千万别撒手！”汐在外边叩了叩船帮：“你那条舵柄还是我十岁那年替你削的，那时你才九岁，连刀柄都握反了。待修好这条船，新舵柄你自己动手削去。”船腹底下闷闷传出一声能岛方言的咒骂。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","bond_takamaru:s","text"],null]']
src = "blake3:3a36c4b4cfdc0cf5d62e0f3ffe2005c7157fd758a820d6bd1c0fe79c2ce5abce"
text = "入冬以后，前关白房通公在京里辞世。弟弟动身归返土佐，我也随行回了乡里，待明年开春便要打下田扬帆出海。腊月里一个清早，阿濑入内禀报，说是河口泊着一艘船，船上的人死活不肯登岸，只说是特来迎候姬君的。我奔到水畔一瞧，果然是那艘小早，便是早年秋日里我们三人合力修补的那一条。船腹补丁处泛着白印，船板上的道道刻痕已一路排到了船梢。鹰丸立在船首，一身能岛船头的短褂装束，面皮比盛夏时又晒黑了一层。“上船来，领你往外海逛一逛。开春后你自己领船出海，总不好连外海的涌浪都未曾见过。来岛那一带的浪头高有一丈二，外海的巨浪你没碰过，见了保准两腿发虚。”我立着未动，他亦未动。闷头憋了好半晌，他才再度张口：“做我的船——”话刚吐半截便被他自己狠狠咽了回去，“不对，该是我做你的船。”吐出这句，他把眼挪开，扬手自船头抛来粗缆，绳端恰恰砸落在我脚畔的石块上。"

[entries.'["stories/bonds/bond_takamaru.toml",["chapters","reunion_takamaru:reunion","text"],null]']
src = "blake3:ef5233d2fbd09908036c2790164dc3aa81f65b91041a589bf71650f8dc7e0427"
text = "天正四年夏天，木津川口打了一仗。船未进港，风声先传到了堺：村上家的小早接连把焙烙火矢抛上织田家的大船，烈火从河口一路烧过半夜，运粮的船趁着火光冲进了石山本愿寺。仗歇了半个月，堺的码头上停满了能岛的船。我挨条船寻过去，在最里头的栈桥边认出了那条小早。船舷补了好几块新木，生白生白地嵌在旧板里，旧板上还留着火燎的黑印。鹰丸坐在船首，拿炭笔在一块木片上划道道。他抬头瞥见我，并未起身，先说起战事：潮水在哪一夜转向、他们贴着哪条水道摸近、九鬼家出动了几条船、满共投了七十二只焙烙，他这条船扔出九只。我没先问他赢了多少，跨上船问这趟出去了几人。他说十一个，回来了九个。我逐个问了名字，照着他手里的木片一一点过。点罢，他打怀里抽出一份潮时表，上面添了好些新绘的水道，数木津川口那一段画得最密。“账还没算清。欠我的那一场呢？”问这话时，他的手指仍按在木津川口上。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:carve_it_yourself","hint"],null]']
src = "blake3:addd9aba068e190ee565368a9e6eab917d52342bc4a5a6764377fd6a27d4b59c"
text = "情谊 33、羁绊 C。你朝他船畔走去，他却侧身一横，挡在了船板前。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:carve_it_yourself","reply"],null]']
src = "blake3:3d0930dd16a3c291e1f1cd6566d0f47708d1d0dac206025fde0e4cea72fd8149"
text = "他递过短刀，特意将刀柄朝向我。我顺着那长排刻痕的末端划了一道，又在侧旁添了个“澪”字，手下拿捏不稳，字迹歪斜。他凝神盯着那新痕道：“自第十七场往后，到这第三十一场，才破天荒输了头一回。三十一场里头占了三十场胜绩，你给我记牢了。”顿了顿又嫌道：“刻得真够难看。”可他还是抬起袖子拂了拂，又把刻缝里的木屑吹了个干净。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:carve_it_yourself","text"],null]']
src = "blake3:090669c292a3c44d6e5f1e3a54f64ac0fd17fccfe99120b4afcd8e2b11a365f7"
text = "步至他船畔，讨来他的短刀，亲手将这一局刻在船板上。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:keep_his_headband","hint"],null]']
src = "blake3:9732a337e3a1df7f446c27f27da01ad696a1f0570580d7d78d55688784fa8f04"
text = "情谊 15。你握紧头巾才张口，他已伸手夺了回去，转身忙着系缆去了。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:keep_his_headband","reply"],null]']
src = "blake3:1dd4003bf283a5279ab0a10fafe1acb0c56f0a5dcbc68b180f4b56d2676bd0de"
text = "我揩净面上的汗水，将头巾折叠成小小一方。他伸掌索要，我偏不肯交出。他又探了一回手，终究缩了回去。当夜河面放起盂兰盆灯笼，一盏接一盏顺着四万十川的流势漂向大海。他立在我身侧，直待灯火去远仍不离去。直至阿濑过来唤我回家，他方才闷声道：“那布巾上沾着鱼腥味。”“我知道。”“……那你还收着作甚。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:keep_his_headband","text"],null]']
src = "blake3:d30343a4974978f019c33a04f6f2d38bbe2e55c2fcb5efb070c9d2f6a275e006"
text = "接过他的头巾揩了汗，偏不归还。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:tell_shortcut","reply"],null]']
src = "blake3:956448bf0ba524b498eec53dac66bf9ced77e00e6fbdebc15b807b1bff4c0e4a"
text = "他拴妥缆绳，直起脊背道：“这般说来，我是败给了自家手艺。不算数。”“算数。”“败在自己调教出的人手里，哪儿能算数？”“总之先触着岸边的是我船首，自然作数。”他蹙着眉思忖半晌，伸直一根指头，随即又屈下一半：“顶多算你半场。”借船与我的那户渔家站在岸上拍腿大乐。他亦忍俊不禁，将那半根手指头在我眼前来回晃悠。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a1:tell_shortcut","text"],null]']
src = "blake3:7e28c2cfb413ec3017e77caf1300db47c0231ccdfa35120e38565b0a22cd71b2"
text = "直言相告，这处水路捷径原是他旧年指点给我的。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:about_itsukushima","reply"],null]']
src = "blake3:d7034ec4661b340b7136844fbc8ede24c4f9aa8886d96e35b2e3685dbbdde752"
text = "“陶家一败，毛利家便占了安艺这片海域，往后过往严岛的商船，帆别钱又该缴进谁的账里？”我屈指暗自盘算，“能岛往后哪怕只少收一成，也算轻省了。当初若是早一年归附毛利，现下收银钱的便是你们。”他听罢我的盘算，默默折好手巾，重新揣进襟怀。“你是岸上长大的，”他开口道，“岸上人向来算计得精明。”说罢独自沿着岬角往下走，任凭我在身后呼喊，他脚步也未曾停歇。那夜海上的渔火，便是我独个儿守着看到尽数熄灭。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:about_itsukushima","text"],null]']
src = "blake3:8248ec819862ee915edc8d89e4edf9410116990d5c5b6a8159e5b9ce8cecc947"
text = "直截了当告诉他：站错阵营便是败局，能岛本该早随毛利家。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_on_wrist","hint"],null]']
src = "blake3:8b4b4c4ad2cf86acbcf2a155894b42f77b96fc7929f55bda9cf4c0a12f1444ad"
text = "情谊 61、羁绊 B、心动 6。手才举至半途，复又落回膝头。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_on_wrist","reply"],null]']
src = "blake3:1700ab5fecf5fa2cd09f6859a7f4850bafab78a636d4444cfdafe78e4b610f63"
text = "我将手巾在左手腕间缠绕了两匝，单手百般捉弄却总系不牢结扣。他凑上前替我收紧了绳结，指腹贴着我的腕骨，停驻片刻，并未抽走。海面的点点渔火逐一黯淡下来，远处的先灭，近处的后熄。直待最后一星火光隐没，他方才低声嘱咐：“出海之前，不准解下来。”“那出海之后呢？”“出了海，桅杆上那方布巾就由你自己拿主意了。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_on_wrist","text"],null]']
src = "blake3:c05fb4f5a35f54c6260181ee5fb39a7d7a4499eb2446a9e02b6313d06cbc6276"
text = "接过手巾，权且缠于腕间，道是出海前绝不拆解。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_to_mast","hint"],null]']
src = "blake3:118e592ca2a48dbf6df063c013caa68e49b79f00d2dc628cc011c19945abfda7"
text = "情谊 61、羁绊 B。他手巾才递出半截，又缩回襟怀按了按。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_to_mast","reply"],null]']
src = "blake3:b34cc99d013d868f590fe379a27517f33adc6049b9bff84c63b1353a587a6d9f"
text = "“系在最高处，”我应道，“高过船帆，教你站在能岛的山巅上都能一眼望见。”“挂那么高，大风一扯就跑了。我们能岛的旗也是悬在桅顶，祖父当年那一面旗竟换过十一回之多，里头有三回是被狂风卷走的，余下八回全是叫人拿箭射落的，放箭的正是来岛一帮人——来岛的弓箭虽然了得，造船却远不如我们。”他顺着话头一口气说到当年来岛赊欠能岛的那四十石米，至今尚未偿清。我折好手巾，稳稳系在了腰带间。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:a2:tie_it_to_mast","text"],null]']
src = "blake3:9d7723b5dce22fe30470604d288ef1d79a4120d7f03ecf2848180256a7b38f3e"
text = "收下布巾，允诺定当悬于桅杆最高处。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b1:copy_it","reply"],null]']
src = "blake3:f2ded6e051b86ff738769d8446d611043fadf03e0f8012192d0d4140d77ac477"
text = "我转身回屋取来纸墨，伏在沙滩上一笔一画地描摹。他在一旁驻足看了半晌：“京都里可没有海潮。”“赴京都的途中总会有。”我伏案头也不抬，“揣着你画的这幅图，我识路比京里的船头还要准成几分。”他缄口不言，径直起身将阿濑坐着的那艘破船往高岸拖拽了一截，回来复又把最凶险的来岛那一段重新描了一遍；这一回他落枝极缓，候我录完一笔方才勾出下一笔，画至来岛的番所时，特地在旁多添了一面旗帜。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b1:copy_it","text"],null]']
src = "blake3:ed91498b742d6419f6e41d64ed8eb38ca289ce9b66104ae4e3e44eddf22149c4"
text = "将整幅潮汐时刻誊录纸上，道要携往京都熟记。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b1:shells_stay","hint"],null]']
src = "blake3:f2619119c109b31442a356dd67d8f77cd0e24731b8efdebeac2787752caba152"
text = "情谊 5。他抬脚将那行沙痕蹭平：“错处留着又作甚？”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b1:shells_stay","reply"],null]']
src = "blake3:2233590c1af3d79a428949ad4f906c472d7dd71ad0c4ccf055a8e7719d1e01ac"
text = "我俩在海滩上直争执到涨潮归来。末了还是他退让一步，自己也蹲身下去添置了两枚贝壳，按住的恰是他起笔就勾歪的几处，我先前压根未曾察觉。“这法子倒巧妙，疏漏落在何处，一眼便能识破。”次日阿濑同我讲，见他在港口指点新来的小水夫时，亦在沙地上列了一长排贝壳。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b1:shells_stay","text"],null]']
src = "blake3:4e05df14ea358b55a253914806d63e2ca28254e003f0242931c35c74949bca8f"
text = "同他分辩，将每处疏漏皆拿贝壳镇住，半笔也不许抹去。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b2:ask_what_was_there","hint"],null]']
src = "blake3:5431d933f800b512998f8821a61e7725b06414286d2bac4be8f035df9d58b4c5"
text = "情谊 33、羁绊 C。那纸回信，你写了撕、撕了又写。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b2:ask_what_was_there","reply"],null]']
src = "blake3:3c87501168bb27bddd93a3608b6d16a68e01485454686103f2a91fcf4144a440"
text = "去信中我单问了这么一句。足足隔了半载他方才回函，依旧满纸尽是潮汐船务，记述他头一回在来岛急流中把舵，满船十一人里，竟有一人晕吐了。末了一行仍旧写着“下回我让你”。我将信纸凑近灯火映照，底下刮破了一个细小的孔洞，他竟从背面裁了丁点船帆布贴补稳妥。这纸书信被我夹进了女官讲授礼仪的那卷《源氏》，正压在桐壶那一帖里。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b2:ask_what_was_there","text"],null]']
src = "blake3:c9b05c7dfd69af1468b5eed0f2ffd58b807c8d92691d0ebfcab81f1de5370a8b"
text = "修书相问：末行刮去的那几字，本意究竟写的什么。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b2:write_tides_back","reply"],null]']
src = "blake3:81fcb3bcbc848b60f83aa0a0337499354b26591bbc4309d048f90c3a8f58e3e5"
text = "我学着他的口吻落笔：今年鸭川发过几场水，御苑池沼封冻了几日，哪位公卿的牛车陷落泥淖，费了六个壮汉才推拽出来。收尾那行我写道：“下回不用你让。”这一函他复得极快，未满两月便至，信笺上孤零零只列着五个字：“那你回来比。”笔锋力道沉重，浓墨直透纸背。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:b2:write_tides_back","text"],null]']
src = "blake3:ef0d1eef16eaa572d74007ba65c38e69bc278fe7a610091589b689ff050511f3"
text = "回函亦单写京都琐事，末行落笔“下回不用你让”。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c1:ask_shortcut","reply"],null]']
src = "blake3:7d9aa7a86ba71f52d932ab6f946ab8c886c3b0270d674b329f1cd46ebf57419e"
text = "他未曾料到败北之人倒先打探起这个。他扯着我蹲在河岸边，手指点向水面上一道暗深的水纹：“潮水就打那儿打转。河水往外涌，海潮往里扑，两股劲顶抵消散的缝隙里水流就缓，行船走那道能省下大半气力。来岛水道口也有这般一道水线，凶险劲却比这儿甚十倍，祖父那辈人戏称它作钱匣子——南来北往的商船只得停在那儿候潮，一等就是半日，我们便摇船靠过去抽税，一艘船三百文。”我定睛凝望了老半天，方才辨出那道水线原是缓缓游移的。他起身掸去膝头泥污：“公家的姬君，眼力倒还不算钝。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c1:ask_shortcut","text"],null]']
src = "blake3:eb24b4ca12c55e5199992d3993f349813286371d01581872cdc521ab068f2776"
text = "追问他方才紧贴左岸行船的那条暗道，究系如何辨识出来的。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c1:carve_my_name","reply"],null]']
src = "blake3:a30e5be52a117abf019f4a5db11620ebd82d482f846dbdde24039a4971820f07"
text = "他嘴里碎碎念叨着“公家人的名字笔画好生繁琐”，终究还是落刀刻了上去。“澪”字左偏旁的三点水被凿成了三个小坑，右半边则歪斜着挤进了船板木缝里。他将短刀插回腰际：“待你何日胜得了我，再亲自来刻。”“你且候着。”“候着便候着，届时输了可别掉泪。”阿濑站在岸头催我回去更衣。我已走出老远，再回首一望，却见他依然蹲守船畔，拿手指头去抠那个刻歪了的字。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c1:carve_my_name","text"],null]']
src = "blake3:3d6a05e2b863fc12d43bc66033a52846f90b16b64de05fce30c9b90fcc97c41d"
text = "催着他将我的名姓刻在刻痕侧旁，点画一笔不得缺。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c2:press_the_crack","hint"],null]']
src = "blake3:2994f369746b52fa6241c2555dad101783204d49b05bac75e8918ffffd681468"
text = "情谊 5。他打船腹下探出臂膀将你推开：“此地可非姬君耍乐的所在。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c2:press_the_crack","reply"],null]']
src = "blake3:2008ab3a9bc5d08caca05634632144b544dd539c1356934ba8a869dd259b304a"
text = "我俯身压在船板上，双手死命按住裂口，双膝紧抵着船肋木。他在底下一记接一记往外顶，我便在上一分不让往下压，汐则在外侧挥锤落钉。足足耗了半个时辰，我两条胳膊早已酸麻得不像自家身上之物，却仍咬牙死撑未放。直待他高呼一声“歇手”，才灰头土脸地自船腹下钻出，满面皆是木屑：“手底下力道倒还不差。”他随即自布袋中拣出那批铁钉里最笔直光亮的一枚，重重拍进我掌心：“收好。这一枚连我都舍不得使。”话音未落，他一头又钻回船底去了。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c2:press_the_crack","text"],null]']
src = "blake3:fa12a297f0952dc489c0c75d52d494afd23cbb24b970213d566ca3841ac61f28"
text = "伏下全身死死按住裂口，直至他叫停方肯撒手。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c2:sort_nails","reply"],null]']
src = "blake3:7c8038c3c4426e9d7a78303de8de01014f8ffa5b8626e59688849795998680aa"
text = "我将船钉逐枚比对过后，修长的列于左，短小的归于右，曲折的别置一处。他自船底斜睨了一眼：“摆得倒像御所里的礼单。”可整整一个午后，他伸手讨钉子时从不回头张望，单只高喊“第五根”“第九根”。入暮停工之际，汐清点了余下的船钉，偏生短少了一枚，几番寻觅，末了竟在鹰丸草鞋底的缝隙里找着了。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:c2:sort_nails","text"],null]']
src = "blake3:88892e62446c48540ab954948104e69b39b4144d392dd1dbd6f8421d8603bf54"
text = "接续依长短替他码齐船钉，弯曲的别作一处。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart","hint"],null]']
src = "blake3:46605651b48ab8bd5ad15f7d48b47ed6f81d2e1ca4a7463394afa27a0a76d6c8"
text = "羁绊 A、心动 12，尚未向旁人倾吐心意，终身之约亦未轻许他人。手巾上的绳结，你触及了，却未曾动手去解。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart","reply"],null]']
src = "blake3:d22ec0cc56bfae942a5a9beba62ea393836816aa9804b730dc5e2dc87a3d201b"
text = "我俯身拾起绳缆，纵身跃上他的小船，动手解开腕上的扣结。他瞥见了，立刻出言：“不是说好出海之前不许解么。”“我这会儿不算独自出海，我是在你的船上。”我将素麻手巾系在他的短桅上，用的是汐昔日传授我的水手结，打得比早年齐整得多。他盯着那方素麻在寒风里翻飞看了半晌，弯腰抄起木桨，竟把桨头握反了，手忙脚乱又调转过来。我们并未驶出河口，只在下田港内缓缓兜转，远眺岸边渔人收网。岁末天寒，我扶在船舷上的手冻得通红，他伸过手掌轻轻覆了上来，那掌心比粗缆还要粗糙几分。临别登岸时，他开口道：“开春你启航那天，我过来送你。这方布，我不拆。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart","text"],null]']
src = "blake3:cc3659e813b65f5dec70b1daee3545888083921075092478cdb5ccf970b40e0c"
text = "跃登他的小船，自腕间解下那方素巾，系上他的短桅。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_second","hint"],null]']
src = "blake3:cbac99e48bb202fa4c6d46cd0a1aa3203672f45d05693422fe36412875b88b6c"
text = "既已许下一份心意，须得情谊 90、意志 5。他身在能岛，京都之事还半点不知。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_second","reply"],null]']
src = "blake3:ec63d35cf4335b8603d6e76278a1e415cec811bdb102e30eb8780598fbb209f0"
text = "我登了他的船，解下腕间的布巾，拴在他的短桅上。他凝望着那块素麻，并未重提“出海前不许解”的旧约，只随口问：“系在这处作甚？”“方便你辨认自家船只。”他低笑一声，拿木桨轻叩了两下船舷，便朝港湾深处划去。他对此间种种毫无察觉，沿途絮絮叨叨讲起开春能岛预备放多少艘小早、哪户人家的船头年迈了、来岛那片今年又替几处暗礁新取了名号，说得极尽详尽。我静静听着，半句未曾插言。临登岸之际，他嘱咐道：“开春你启帆那日，我定来相送。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_second","text"],null]']
src = "blake3:e84b8dc5869f184fe671c652b847970ba081c3e75780464f730dfecf03ba2431"
text = "心中纵已有归属，仍旧踏上他的舟楫，将手巾系于他桅杆之上。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_third","hint"],null]']
src = "blake3:494656c28e77eaa4e8ee5c07eb1a6074813003d45fd60f421b11d84f48faddd9"
text = "已许下两份心意：需情谊 96、意志 7，那方素巾仍须长系你手腕之上。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_third","reply"],null]']
src = "blake3:dbfb11ff65e4f42aea36f6e767a906b434551a64a63daa2da62ce5ece52f8b3a"
text = "我踏上他的小船，俯首去解手腕上的扣结，费了老半天工夫方才解开——那结本是盛夏时他亲手替我打上的。我将手巾缠在他的短桅之上。他瞧了一眼，半句未问，转身去松岸桩的缆绳。小船在港湾兜转了一周，他陡然提起汐上月曾寄来一函，纸上独有一句话，他没琢磨透彻，要我帮着瞧瞧。我回绝道，寄给你的书信，自个儿细看便是。他自怀中摸出信笺，迟疑片刻复又揣了回去。待我登岸时，他匆匆抛下一句“开春来送”，语速极快。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:heart_third","text"],null]']
src = "blake3:a2bd88f72749e4c5cc5f84876e6bd05edea8b618d95fd4c4e433192f1a9e8378"
text = "即便已向两人许心，依然登临他的船，将布巾拴上短桅。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:own","reply"],null]']
src = "blake3:1bb74dfe7a53cc6b2b71c70569be13cc5e18d0b1efa832c0e6b886b1ece7a709"
text = "我没应邀上船，只向他借来短刀，纵身一跃而上，循着那排刻痕的尽头、紧贴船梢刻下两个字：未比。“这算什么名堂？”“开春我便出航，你回能岛执掌船头。这一局，待他日你我在大海上各自有了坐船，再一决高下。”他蹲下身端详那两枚刻字，拿拇指指腹反复摩挲：“这一阵，哪怕耗上十年光阴我也定要扳回来。”“十年？你倒真沉得住气性。”“就凭你这点行船微末道行，少于十年休想追得上我。”我俩立在岸畔击掌立誓，他掌心满是被粗缆磨砺出的硬茧，震得我手掌一阵发麻。“十载之后，你可别佯作忘怀。”“白木板上刻得真切，我如何抵赖得脱？”他跃返小舟，独自撑篙将小早驶出了河口。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:own","text"],null]']
src = "blake3:c8f6c279fe64bd78751daff77f3a2a8a3fffbbbcd9de612278aa39964a6e0a22"
text = "在他船板刻下“未比”二字，立约待长成后海上重赛。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:promise","hint"],null]']
src = "blake3:72c43d3e2dc33f71f6eacc3d4715c37991914835cfb6641975c3ba79c534206a"
text = "羁绊 A。终身唯一的诺言倘若另有所属，这条绳缆便无从拾起。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:promise","reply"],null]']
src = "blake3:fd306da219d6c8e8bda875cc914ea7dc6d396fd5609b2f423517602b9add7cd4"
text = "我俯身挽起绳缆，扯近船身，纵步跳上甲板。小早微微一倾，他出手搀住我的臂膀，旋即又收回了手。“启航那日，让你的小早在前头开道，引我的船行上一程。”“领至何处？”“能岛水道口。当年你替我描的来岛那一段，我虽已记熟于心，却想亲眼瞧你驾船行上一遭。”他将双桨沉入水波，稳稳朝着外海划去，摇出好远方才接话：“过了水道口，往后的航路全靠你自己闯了。若吃了亏可别掉眼泪。”“我几时掉过泪？”“头一回竞渡那年，你湿袖筒里拧落的一串水。”“那是河水！”驶离河口，外海涌浪一叠胜过一叠，我紧攥着船帮，他在船尾高声指点潮向何处回转、海风打哪方吹来。及至返航，暮色已浓，他将缆绳拴紧在岸边木桩上，挽了个死扣：“开春之前，这条船就一直泊在此地。”"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","bond_takamaru:s:promise","text"],null]']
src = "blake3:24c393524aa715b9d2ea3c557b69060a4c82265caf975f54b1632520fe368bab"
text = "接住粗缆，约定来日扬帆之际，由他的小早替我引路一程。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:friend","hint"],null]']
src = "blake3:403d18930ab91fd68aa573d17ff8ded2b5fd4a248384403563b34604b6e0c842"
text = "当年在岬角，我说过能岛选错了边。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:friend","reply"],null]']
src = "blake3:d4b605410473c70ef056aa06a085d89671f4c65cbb47689e5f2e19f0a5844995"
text = "我在船头落座。他把木片平放上膝头，从头讲起：他们如何乘着夜潮靠近织田家的大船，船首的人点燃焙烙，抡臂抛过去，陶壳砸在甲板上碎开，火苗登时蹿了起来。讲到脱手那一瞬，他的手在膝上发颤，炭灰簌簌往下掉，他赶忙拿另一只手压稳。“能活着回来的，比我预料的要多。”我唤人从岸上搬来一坛酒，没有酒盏，便就着坛口轮流饮。他提起未归的那两人，一个会唱渔歌，一个欠了他三十文。我说那三十文由我替人还了，他骂我公家人不懂规矩，哪有替亡人还债的。快天亮时我们立下约定：往后我的船走濑户内海，在能岛的水道口挂起一块白布，他见了就出面领航；他的船若在堺或土佐缺了粮，尽管报我的名号赊下。他把这事也写上木片，正好排在那九个名字底下。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:friend","text"],null]']
src = "blake3:da5afba0b3e56be857ffaec9a035c27561ca33d01eeb7fd5ef2a0f221582b994"
text = "坐在他船头，听他细说这一仗的经过，约好往后在海上彼此照拂。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:love","hint"],null]']
src = "blake3:40ca1365e14f523915a5b19bd715738292d74ba8522aee4db29d8a566615d95f"
text = "需得当年在他桅上系过手巾，且心动 24。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:love","reply"],null]']
src = "blake3:5e3319a7b4ffe725258da3fc4475ee6e94afdea8d9e09303c00e730fd682b773"
text = "他先说起下田河口那一场，是我胜了半个船身，他记得分明是半个，不是一整个。讲罢，我问他那些年信尾最末一行刮掉的到底是什么。他捏着炭笔在木片上添了一道，又添一道。“无非是‘下回我让你’。底下起初写的什么，我自己也忘了。”接着又补了一句：“终究没让成。”入夜后他送我回码头边的宿屋，走到门首，他停步，我也跟着停步。门内亮着灯火，宿屋的老板娘探头出来张望一眼，又悄没声缩回去。他打怀里摸出那方素麻手巾，边角燎焦了一块，是木津川口那一宿给火烧的。“挂在桅上的那块，我收起来了。”他把手巾塞进我手里，“你那条船的桅杆高，系那儿罢。”他没踏进门。次日一早，他的船返归能岛，我的船往西行，出港时两条船靠得很近，我瞧见他船板上那一整排刻痕，最末一道边上新添了半道。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:love","text"],null]']
src = "blake3:b04d62ca4cb36c44ff62ed30e0ea47338f9827fec755d0ee0cfa68a3a4edd302"
text = "问他：那些年信里末一行，刮去的到底是什么。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:rival","reply"],null]']
src = "blake3:2674867eb4f52728322471710e80a1b69ed91b8d90f3507475c23643fa946121"
text = "次日天刚破晓，我们各带四名桨手，在堺的港外一字排开。能岛的船上挤来好些人瞧热闹，有人下注押他，也有人押我。我这只小艇是从商船借来的，桨手是码头临时雇请的，才一开拔便迟了半拍。我循旧法先相水路。大阪湾的潮水与四万十川口大不相同，我辨了好一阵才找准那道水线，奋力追至末了，仍旧差他半个船身。他泊了船，蹲身在船板前，挨着那一排刻痕最末再刻下一道，拿大拇指揩了揩：“第五十四场。这一场，我等了整二十年。”“往后那场呢？”“下一场，等你雇来的人学会使桨再议罢。”看热闹的能岛水夫轰然笑开。那几个押我赢的顿时没了神气，我解开钱袋替他们结清输账，合计四百二十文，我一口报出数目，那边的管账还在掰着指头算。鹰丸立在边上瞧着，道是公家的姬君输起钱来倒够爽气。"

[entries.'["stories/bonds/bond_takamaru.toml",["choices","reunion_takamaru:reunion:rival","text"],null]']
src = "blake3:6b61560c5571ac2f24d035f3f9fe2935c3722836548b48d880dfeb65994b7fc3"
text = "把旧日欠下的那一场翻出来：明早就在堺的港外比试一场。"

[entries.'["stories/bonds/bond_takamaru.toml",["effects","reunion_takamaru:reunion:default:0","text"],null]']
src = "blake3:de57a0d0216cc6a5878b47fc1b837c7aa467ebcf59dd5640cbdbd5482a59f5c6"
text = "澪：听说你今年没到堺来。赶在船队回能岛前，我托一条顺道去土佐的船带去这封信，外加一块木板。板是我那条小早上拆下来的。木津川口那一仗，船帮挨了一记，燎黑了三块，换下的就是这块。板上的刻痕，最末一道是七月十三夜里划的，记的是我们烧了织田家的船。这一场不算我同你的，只是想让你瞧瞧。旁边那行字也是我写上去的：欠着的那场，还照样欠着。这趟出去十一个人，回来了九个。一个会唱渔歌，一个欠着我三十文。会唱渔歌那个，前年还在下田竞渡时给我擂过鼓。那三十文我也不要了。那张潮时表我还带在身边，木津川口那一块新添了三条水道，等你来了我画给你看。来岛那段你当年抄过，多半早忘干净了，忘了也不要紧，我替你再画。你整天在海上跑，信不好捎，这封信也不知几时才落到你手里。下回我让你。鹰丸"

[entries.'["stories/bonds/bond_takamaru.toml",["variants","bond_takamaru:s:v_itsukushima","text"],null]']
src = "blake3:d7c3bc8fa0a8cf4a14f5b3f2366a1b8310345814bf8743ecf10896842bfb7cef"
text = "深冬时节，前关白房通公于京中辞世。胞弟起身归返土佐，我随同返乡，定于开春打下田发船出海。腊月一个清晨，阿濑来报说河口泊了艘能岛的小早。我疾步奔赴水畔，正是旧时那一条，船板上的道道刻痕已绵延到了船梢。舟上只见两名能岛水夫，正忙着往岸上搬运赠与阿濑的干鲷，唯独不见鹰丸的身影。水夫答道，船头赶往来岛征缴帆别钱去了——今岁途经来岛的商船甚密，每艘收三百文，一日便足足收了十九条。卸罢干鲷，二人利落地解去缆绳离岸，再不曾回首朝岸边多瞥上一眼。"

[entries.'["stories/bonds/bond_takamaru.toml",["variants","reunion_takamaru:reunion:v0_itsukushima","text"],null]']
src = "blake3:f4d876af465ffe7bbe34761658f9d932d0796812a8f7417027f3a58837c3bf4c"
text = "天正四年夏天，木津川口打了一仗，村上家的小早烧毁了织田家的船队，粮船趁势闯进石山本愿寺。仗歇了半个月，我在堺最靠里的栈桥边认出那条小早，船舷新补了好几块木头。鹰丸坐在船头往木片上划道，瞧见我，劈头就说：“毛利家的船。这一遭我们站对了边，你可算过？”他说帆别钱一成也没少收。我问船上出去多少人。十一个去，九个回。他念名字念得极快，念完就把木片翻扣过去：“岸上的，你来堺做买卖，别到这条栈桥上寻人。”"

[entries.'["stories/bonds/bond_takamaru.toml",["variants","reunion_takamaru:reunion:v1_still_unraced","text"],null]']
src = "blake3:372ed9d9334f544f64190316e95df60caf6e3ace0b7cae4d84b6f02050e2c7ce"
text = "天正四年夏天，木津川口打了一仗。船未进港，风声先一步到了堺：村上家的小早接连把焙烙火矢抛上织田家的大船，火舌从河口一路烧过半夜，粮船正是趁着那片火光冲进了石山本愿寺。仗停了半个月，堺的码头泊满了能岛的船。我挨着一条条寻过去，在最里头的栈桥旁找见了那条小早。船舷换上好几块新木，生白地夹杂在旧板之中，旧板上焦黑的火印仍在。鹰丸坐在船头，正拿炭笔在木片上划道子，一眼望见我，先开口讲起那一仗：潮水哪一夜转的、满共七十二只焙烙，他这条船扔出九只。我问他这趟出去了几人。他说十一个，回来了九个。我逐个问过名字，对着他掌中的木片一一点过去。点罢，他站起身踱去船尾，拿脚尖点着一块旧船板。上头那两个字依旧留着：未比。二十年里摩挲来摩挲去，刻口都泛出了亮光。“十年硬生生说成了二十年。账还没算清。”他把脚往回一收，顺势又在那两个字上踩了踩。"

[entries.'["stories/bonds/bond_takamaru.toml",["variants","reunion_takamaru:reunion:v2_rope_in_the_fold","text"],null]']
src = "blake3:2dc573d8825d198508a21fc63d4ddc1ceeca5884c81a20a7ca4f52e56d3809aa"
text = "天正四年夏天，木津川口打了一仗。风声先于船只传到了堺：村上家的小早接二连三往织田家大船上投焙烙火矢，火势从河口烧到半夜，粮船趁着火光驶进了石山本愿寺。仗歇了半个月，堺的码头上泊满了能岛的船。我一条接一条寻过去，在最里侧的栈桥边找着了那条小早。船舷补了数块新木，旧板上仍残着烧焦的印迹。短桅上悬着一块素麻，色泽已经发灰，边角焦了一块，可绳结分明还是我当年系下的船结。鹰丸坐在船头在木片上划道，手里的炭笔顿住了。我登上去，问他这一遭带出几个人。他说十一个，回来的九个。我挨个问了名姓，照着他手中的木片点过一遍。点完后，他打怀里抽出一份潮时表，指着木津川口那一截：“这账还没算清。”一截缆绳头恰从折缝间滑落出来，他拾起来，照旧塞回原处。"

[entries.'["stories/bonds/bond_takamaru.toml",["variants","reunion_takamaru:reunion:v3_only_tides","text"],null]']
src = "blake3:e732ae3305ecc2e905464b17f35ed7ee9f05be357d4acfdd3a2d5f066566b09e"
text = "天正四年夏天，木津川口打了一仗，村上家的小早一把火烧了织田家的船队。战事过去半个月，我在堺最里边的栈桥旁找着了那条小早，船舷补上了好几块新木。这些年来鹰丸的书信一直未断，每年两封，尽写些潮汛、船只，或是哪条水道改了礁石的名目，只是末行那句“下回我让你”，自永禄初年起便不再落笔，信笺尾端素素净净，连半点刮改的印迹也无。他正坐船头在木片上划道，一看见我便站起身，询起我的船吃水几尺、走过哪条水道、在兵库曾否停泊。我问他这趟带出去多少人。十一个，回来九个。我逐个问名字，他逐个应声报过，末了说了一句：“你那船上的帆也该换新了，今年堺这边的帆布价钱便宜。”他船上的旗，已换作了毛利家给的那一面。"
