[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:a1","news"],null]']
src = "blake3:661f8138f0502f3ad97cb5c67e24974c855fcd5f2dcb96cd8e94697312477f7c"
text = "京都宫中过七夕那晚，水盆旁落着一片未系竹枝的梶叶，叶背写着首无名之歌，女房们猜了整宿是谁的手笔。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:a1","text"],null]']
src = "blake3:74cfc40cf7dc87fee64c190f7592810dfe5e977c68058375b071d82898ff17b0"
text = "七夕夜里，宫中庭院设下水盆，汲满清水以映星斗，又摘了梶叶分与众人，好在叶背题歌。女房们写完一叶又一叶，纷纷悬上竹枝。有人塞了一片到鞠千代手里：“飞鸟井家的，不赋一首？”他双手捧住，握着笔僵立了许久：“我、我写不好这个。”待人群散尽，我折返去收水盆，却见盆沿上歇着一片梶叶，并未系往竹枝。翻过来看，叶背有一首未署名的歌，咏的正是隔墙相望的两颗星。字迹很是端正，唯独每句落笔之处，墨色都较别处深些，显见笔尖曾在那儿停顿过——正像他每回张口之前，总要先吸进一口气。远远地有人在撤竹枝，正唤我回去。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:a2","news"],null]']
src = "blake3:0e6cc6affa83b5b1da1003008257e8352d0d008fa5be68c6d8055217cb371f0a"
text = "京都宫中落雪那日，偏殿设了场小歌席，飞鸟井家那位见人便躲的少年吟出一首极长的歌，散席后竟还追去了廊下寻人。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:a2","text"],null]']
src = "blake3:b1045e7c7035cd8aca13e330dde1b7cb0ca94022fc7e1a9bae208c9eee253c25"
text = "雪落了整整一日。先生于偏殿设下小歌席，拢共只邀了七八人，炭盆里火势正旺。轮至鞠千代时，他起立在席前，掌中折扇捏得发白，才吐出头一句便噎住了。上首有女房轻咳了声。他合了下眼，重新启齿。那是一首长歌，句句相连，中间虽换了两回气，终究没断。末句既毕，只闻窗外积雪压落竹叶的微响，一席人才如梦初醒。他头一个转眸望向的竟是我，随后才对着先生躬身一礼。散席之际雪仍未歇。他一路赶至廊下，打袖底摸出个布缝的小鞠，针线极细密：“我、我自己缝的。练、练脚用。里边填的荞麦壳，一两二钱，比鹿皮制的轻上四成，踢偏了也不、不疼。”他掌心托着那只布鞠，几星雪片飘落上头，融去了一小点。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:b1","news"],null]']
src = "blake3:af84d9e4591f422efd14b84a02eabe94712f0a748b5012b10fba47d65f17c7ec"
text = "京都内里的秋日鞠会上，有上臈嗤笑飞鸟井家少年是个哑巴，一条家新进宫的姬君偏要同他站作一队，引得满庭女房抻长了脖子瞧热闹。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:b1","text"],null]']
src = "blake3:3b48af9410dfb605b540eb53ebde9bb2d54ff35be43a83ca7df4fbd511f2ba55"
text = "秋日鞠会摆在内里的鞠庭之中，四角植的樱、柳、枫俱已染了秋色，独独那棵松树依然苍翠。临到分队，有位上臈以扇掩唇哂道：“飞鸟井家那哑巴也要下场么？鞠场上可少不得出声呼喝。”身畔几个女房随声附笑。鞠千代立在场侧，掌中捧着他那只鞠，腰革边垂着一小绺紫穗，头垂得低低的。我步过去：“我同他一队。”那上臈的折扇顿住了：“一条家的姬君，鞠会之上谁与谁同队，原是有定例的。你且说来听听，依的是哪一条？”满庭目光都聚在我身上，等我回话。鞠千代却迈步过来，将那只鞠搁进我掌心，随即蹲下身去，伸出两指，将我站斜了的右脚尖轻轻拨正，直对着场心。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:b2","news"],null]']
src = "blake3:b5c26bb64a7292fde475bf001c06a4a358eb45a49b7a91fd024153b3ace8d33d"
text = "在京都女房局当差的姬君，同飞鸟井家的少年将一张纸对半裁开，传言是要把去年秋日那场鞠会录下来。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:b2","text"],null]']
src = "blake3:4a09018cbd7dd0fad6bc00108330029c3941a12b0468c496f1794f87b1cf2a96"
text = "入春之后，恰轮到我在女房局当差，专管笔墨抄录。鞠千代前来交割鞠会名册，在外廊踌躇了许久才跨进门来。他仰望着书架上那一排《御汤殿上日记》，低声道：“这、这里面，空了二十来载。打永正至大永，整段尽皆缺漏。那些年头宫中曾开过几场鞠会，哪边胜了，又是谁起脚喊出头一声，再无人知晓了。”说罢他自怀中取出一页素纸，折痕压得十分平整：“去岁秋间那一场，我、我想记下来。”正本向来由女官轮流执笔，我二人谁也不敢擅自往里增字。我便将纸对折起来，顺着折痕裁作两半，一扇推向他，一扇留于己手：“一人记半页，各人收好。”他接过那半纸，先用指腹摩挲了一遍裁口。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:c1","news"],null]']
src = "blake3:0948afc2040377684f9af5c03dd955af3c44287e259c8ac32bffd75f2aff77fc"
text = "京都内里女房局的后庭中，从飞鸟井家那头翻墙飞来一只鞠，新入宫的姬君一脚将它踢落山茶花丛，那家的少年钻进枝叶里寻了半晌。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:c1","text"],null]']
src = "blake3:89753deba37cd59a7e5836d88bdfeb5e9fc07381d0893236e56dd40766bcf56a"
text = "入宫第三日，我正于女房局后方的小院里认路。忽听墙外有人呼了声“呀”，一只白鞠翻过墙头，在石板上蹦了两蹦，滚停在我脚畔。那是鹿皮缝制的，腰间箍着一圈皮带，已磨得起了毛边。墙头上随即冒出张脸孔，是个年岁比我还轻些的少年，满额皆是汗水。他唇瓣张了张，未曾出声；再张了张，依旧没响动。“你的？”我发问道。他连连颔首，点得过急，险些打墙头滑坠下去。“那接稳了！”我抬脚便踢。谁知那鞠擦着鞋尖斜飞出去，一头栽进墙根那丛山茶里。墙上的脸倏地缩没了。过了一阵，他打院门那边绕进院来，跑得气息直喘，头一桩事竟是蹲身察看我的脚踝：“扭、扭伤了没？脚尖朝外撇着踢，十个里有八个要扭。”我答没有。他这才回转身去，拿袖子缠紧手掌，动手去拨山茶的枝桠。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:c2","news"],null]']
src = "blake3:d7bd228e56247d792a60bed02d7e48aa11c38a4a2d5164c20568847cdd818997"
text = "京都宫中夏日的歌会上，一席人皆叫一句古语难倒；事后传出是飞鸟井家那寡言少年破解的，可他本人早不知溜去何处了。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:c2","text"],null]']
src = "blake3:66ff68790eb8b48d9ca1270d734ca2f5fdbbf04817b58756561e191909f498af"
text = "六月歌会之上，先生挑出古歌里的一处字眼，考较满席该如何释义。众人面面相觑。我背后忽有人低声吐出一长串，原是鞠千代，语速极快且轻，连带前后数首一并背诵出来，倒似在自言自语。待我回首，他早已站起身朝门外去了。我紧赶到廊下唤住他：“你再说一遍，适才我未听真切。”他刹住脚步：“那、那个词，前边尚有一首……”恰有两名女房从长廊那端行来，他的话头登时截住。我待那二人转过拐角，先自个儿胡乱猜了个意思，离题万里。他拧了拧眉。我再瞎猜一个，比先前更显荒唐。他终归听不下去，压低喉咙连珠炮般一一指正过来，见于哪卷、何人所作、前首咏何景、后首接何意，甚至连当年判者的评语都背了出来，直讲到半截方才惊觉是在同旁人交谈，话音便又卡在喉间。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:s","news"],null]']
src = "blake3:183edec3f0119d52bf2c0dc9e234ffcf096c9ed3c1e5055233074f26852c794b"
text = "腊月里的京都，飞鸟井家少年须留京争那鞠道的免许；土佐一条家的姬君一过年便要返乡出海，临行前在他家的鞠庭畔驻足良久。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","bond_kikuchiyo:s","text"],null]']
src = "blake3:f0012bfcbe8a5f24e346105d50aeec99067a71e8edd5cb0bea59e0b681285d1e"
text = "时值腊月，飞鸟井家的鞠庭清出了一片空场，积雪尽数堆在四角树根下。鞠千代独自在场心颠着鞠，腰革边那绺紫穗随他身形起起落落。待到开春他便要角逐鞠道的免许；我则一过年就返归土佐，船只早泊在下田候着。我立在场边静看，他竟浑然未觉，直等那鞠坠落之际猛然瞥见了我，脚法一偏，鞠便咕噜噜滚至我足畔，一如当年春日那般。他迈步走近，却不俯身去拾，张了回嘴，又再张了回。及至第三回启唇，仍是半点声息也无。我弯腰拾起那只鞠，拂落上头沾着的碎雪。这一遭，换我先开了口。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","reunion_kikuchiyo:reunion","news"],null]']
src = "blake3:778147f556034d490235111fcf16e069f92f09af7f0c77ad506d48fef5f00f3b"
text = "土佐中村一条家的宴席上，那位自京都来的鞠道师范并不急于踢鞠，先俯身将庭中石子一粒粒捡净，这才请主家的姬君下场。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["chapters","reunion_kikuchiyo:reunion","text"],null]']
src = "blake3:95825a1a38a77435c67d10a2bfa1b381720aab40c541dccbb599e3a0772b5417"
text = "这一年，一条家在中村的馆邸设宴，自京都前来的公家领了一位鞠道师范，说是出自飞鸟井家，拿到免许不久。我从下田乘船溯四万十川而上，赶到时席面已开。庭中铺着白沙，师范立于场心行礼。礼毕，他俯下身，把沙里的石子一粒粒捡进袖中，捡了小半个时辰，满座的人都候着。捡完，他直起身朝我望来，是鞠千代。他高了许多，肩背也宽阔了。对着上首的公家，他谈起中村这片庭院的朝向、白沙宜铺几寸、四角该补栽哪几棵树，一口气说了一大篇，半个磕巴也不打；待转向我，那句问话却断了两回：“澪、澪姬。要、要不要再接一次？”宴散之后，他在庭角树下候着我，开口前先吸了一口气：“当、当年那片鞠庭，是你先开的口。今日……”树下那块平石头，他原是事先擦拭过的。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a1:ask_him","reply"],null]']
src = "blake3:8f923168c219f96c521e97235d24caa32047a3bf03f5a716cbd9226323b92c17"
text = "次日我在鞠庭外畔寻着了他，将那片梶叶托在掌心送过去。他瞥了一眼，目光即刻移开，死死盯住地上的落叶：“不、不知晓。”“既如此，我且替题歌之人收着。”他点点头。静默片晌，他却又道：“第、第三句那个‘隔’字，题歌的人许是写错了，合该用另一个字，那个字作隔水相望解，并非隔着墙垣。”话毕他又添了句，言那片梶叶亦摘错了正反，须得将叶背朝上落墨，若写在正面，墨汁吃不进叶脉里，故而第四句才晕了开去。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a1:ask_him","text"],null]']
src = "blake3:b8cb0347aa65563e287eaa9bc6ab00d57597db1ddf41a4616bf02e7e42fcec52"
text = "捧着梶叶去问他：这歌是谁题的？"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a1:reply_leaf","hint"],null]']
src = "blake3:ed3018a94849b92e3bc5a4375d3ce18674f6e371561bc514e44a211800d7aad5"
text = "此时若回赠一首，只怕他往后更不敢往水盆旁留叶子了。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a1:reply_leaf","reply"],null]']
src = "blake3:7d8eefeda5437a15ddef541184472e8514ee5d6f3fedd06ebdf2586935faad77"
text = "我趁着星色题了一首，同样写高墙，写墙这边正有人静候着鞠飞越过来。题罢将梶叶放回盆沿，拿一枚小石子压稳。翌晨天亮，那片叶子已然不见，独留小石子在原处。午后他在鞠庭练脚，一照面，双颊顿时烧至耳根。整整半晌他踢出百来脚，脚背稳平得仿佛真能托住一碗水。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a1:reply_leaf","text"],null]']
src = "blake3:a757a013b762e238daaf17ea759d920cf14f2ec8a440a7d4a48b69c12a6521bf"
text = "另取一片梶叶回写一首，同样不留名，搁回水盆旁。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:ask_next","reply"],null]']
src = "blake3:5a9793c6a606ef1c8951b46e7180ff91722c0762f8b87616bd46c60481eea4bc"
text = "“念、念不吟……”他目视着廊外落雪，“得看有、有没有你在。”话一出口他倒先唬了一跳，急忙找补道：“在、在底下听的意思。”我应道我自是在底下听着，难不成还代你上去念？他将那布鞠往袖中一塞，掉头便走，步子迈得太急，在廊角跌了一跤，爬起身还咕哝廊板早该打蜡了。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:ask_next","text"],null]']
src = "blake3:3674e05a122144d999803d7ca62a7c445e217d8c1d740e4db82f2e25cc09a4f8"
text = "问他：下一次歌会，还念么？"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:catch_ball","hint"],null]']
src = "blake3:4022e10142d35fd17a23c6a23538029f424cdcbdecd5d7ecc1e15141c48c4af0"
text = "情谊 80、羁绊 B。那只布鞠托在他掌中，你才探出手，他又往回缩了些。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:catch_ball","reply"],null]']
src = "blake3:29e8550cac306ee83e95a6bbfb6122d2069df19f9b5b8ee776212f4982ce5467"
text = "一声，两声，至第三回便颠偏了方向，眼看布鞠要栽进雪堆。他迅即伸腿，鞋尖轻挑便稳稳兜住，复递至我掌中：“太、太轻飘了。我另缝一只与你，里边多填些。”“我只要这一只。”他低眸瞧了瞧鞠，颔首应下。雪花落满他发顶也浑然不觉拂拭，一对耳朵红得刺眼，衬在一片素白当中，隔着半道长廊都清晰可见。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:catch_ball","text"],null]']
src = "blake3:9a5c2b8ed533e32bbf4d639fc69cf1cb6603d5c7fb4759caafb74ed3534bacfa"
text = "收过布鞠，当着他面起脚颠三回。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:say_it_was_good","hint"],null]']
src = "blake3:39a358b2cc0412738b8cadc5e4b0475a50613bce535e41e8ff1a0ed512058517"
text = "情谊 80、羁绊 B、心动 6。眼下开口说这话，怕是要逼得他躲回墙外去。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:say_it_was_good","reply"],null]']
src = "blake3:9c6b415851c640d624638d8746bf70397109bb460015e6640b5497592c857ff5"
text = "他僵立在檐廊下：“你、你瞧见了？”“瞧见了。一屋子的人，你第一个望过来的正是我。”他垂下眼帘，将布鞠安放进我掌心。他的指尖触及我的手背，冰冷彻骨，却未曾抽离，只那样静静搭着。廊外飞雪落了又积，直至炭盆那头传呼收拾，他方才撤回手去，轻声冒出一句：“第、第九句我吟快了些。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:a2:say_it_was_good","text"],null]']
src = "blake3:8c94ae06179d0ebbcc2133df03e7ed4bfbb62d6383d7c5c9b570090a801e571b"
text = "直言相告：你吟罢头一个望向我，我都瞧在眼里。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b1:formal_retort","hint"],null]']
src = "blake3:ccd4e0c964b1dd9b71dd153c0034278460edd8eacc6c072c8be13e53f1ce6245"
text = "礼仪 4。宫中礼数你尚未习全，此刻出声反驳，徒叫她抓了错处。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b1:formal_retort","reply"],null]']
src = "blake3:68f17600fc26e855ad29f96a32d73ea280e3b015ded1b0d22404f3cae5b39274"
text = "我应声道，鞠会分队历来由师范家的人主裁；今日在场属飞鸟井家的唯他一人，那鞠递进谁人掌中，谁便是他同队。那上臈手中的扇子合了又张，张了又合，终究未再发声。那一阵是我二人胜了。他起脚之际高呼了声“呀”，嗓音虽不算洪亮，却教满庭人尽数听清。散会后他追步上来：“你适才那番话，‘历来’二字措辞有误，师范家定队乃是永正之后方兴的规矩，早先其实是……”他滔滔不绝讲了长长一通，临了才回过神来，“不、不过那上臈想来也不知晓。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b1:formal_retort","text"],null]']
src = "blake3:76e1b2855b0d0bc98cfe03559933cf8896974e1a0bf259b80de5240595145289"
text = "搬出宫中规矩将上臈顶撞回去，堂堂正正同他一队。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b1:just_join","reply"],null]']
src = "blake3:7848bcf5fe85fa185aa62b87e6c9a31ed3bf17c9d17b1bb417ba97ff7629ad8a"
text = "上臈叱我二人不知礼法，罚往佛堂静抄经文。直写到三更半夜，油灯续过两遭，我的腕子已酸麻得捏不稳笔杆。及至天明清点，我面前那叠竟平白多出数纸，笔迹与我几可乱真，唯独那个“经”字的末笔收锋比我来得干脆。我抽出来质问他。他垂首研着墨：“笔、笔迹是一模一样的。”“一样也不必代我抄。”“正因为一样，”他道，“旁人才看、看不出破绽。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b1:just_join","text"],null]']
src = "blake3:905b278331b3ea721307c12e77d9f2570ae4f073671e47b2f35e83db2318e40e"
text = "一言不发，径自迈过去站入他那队。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b2:date_it","reply"],null]']
src = "blake3:fe56741a0ab68dd1a3cc633c8c5c7fce6ba76c5b5929062e7553cde204316000"
text = "我落笔写全年月与日辰，再缀上一个“晴”字，便停了手。他凑过头来一瞧，眉头轻蹙：“你、你这么写未免太枯燥了。”“日期既在，此事便算留痕。日后若有人想追究，循着日子去探问便是。”他思忖片刻，从我手边取过笔去，在那个“晴”字后头补录了几字：鞠会，赢。末了还拿笔将那个“赢”字画圈标了出来。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b2:date_it","text"],null]']
src = "blake3:ea4050b801058875984fb2848f9a2ae6dbf392cdacc1f6742ffa578a3a2c5415"
text = "单单写全年月日，余字一概不落。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b2:write_half","hint"],null]']
src = "blake3:753ed15e319b201568d33aeac0ba13b02928ca035ca9d9a0c91f5949130597f9"
text = "情谊 50、羁绊 C。他将那页纸捏紧在掌中，言道此乃飞鸟井自家的桩事。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b2:write_half","reply"],null]']
src = "blake3:dc9d86a8de1a136bc45e12b2f0405e0bf2bf8c3c517db40c01d96bfadabeb716"
text = "我记下的甚为简短：某日鞠会，我站位歪了，有个人俯蹲下来，伸出两根指头将我脚尖拨正。他阅罢，耳廓先染了红：“这、这等事你也往纸上写？”“你写你的，我记我的。”他将两扇半页拼作一处对着窗光举起，裁口严丝合缝，恰好凑足一整日。“往后这一天，便、便用不着旁人去臆测了。”他将己方那半页夹进抄本最前页，随手又将我这半张朝我推近一寸。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:b2:write_half","text"],null]']
src = "blake3:8ec8d3f488faa9f8c1a1dac174107a79a3522e901b7deb6b5c0cdcc735832a31"
text = "在己方半页写下：那日他俯身蹲着，将我站斜的脚尖轻轻拨正。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c1:help_find","reply"],null]']
src = "blake3:8b3c65613373b24380781c93429ac26692a0c25bf0e8a00c2f37cd465a3b5de1"
text = "山茶花枝生得既繁密又硬扎，我二人衣袖皆被勾刮出了裂口。是他头一个探手摸出那只鞠，用袖口揩拭净了，双手托递过来：“这、这一只留与你练脚。”“我踢不准，适才你亦见着了。”“踢、踢偏了，好歹也算踢。”话音方落他才察觉自家衣袖撕开了一道，忙捏住那处破口拔腿便跑，奔出去老远，仍不忘回首望那鞠可还在我掌中。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c1:help_find","text"],null]']
src = "blake3:739bd164be14389d76a197379afeb0db043e2fdc8fcbc70aca1ff8af640ed746"
text = "随他一道俯身钻进山茶花丛寻鞠。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c1:kick_again","reply"],null]']
src = "blake3:3df6802f2cfc1fe932dcc633fd2ff3514234e484e003914d37ea543c156b5ff2"
text = "他寻回那鞠递还于我。我退开三步，扬腿便是一脚，谁料这遭鞠窜得既高且斜，直直翻过墙垣砸进隔壁去了。墙那头立刻响起老女官的呵斥：“谁家这般不知礼数！”他掩紧嘴唇，双肩一耸一耸地憋笑，直笑够了方才蹲身比手势教我：“脚面须得端平，好似平托着一碗清水。脚面一歪斜，水碗便倾了，鞠就顺势飞过墙去——墙外头正是典侍家的庭院，典侍家那老女官顶顶会骂人。”他嘴上磕磕绊绊，手上比划的架势却稳当极了。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c1:kick_again","text"],null]']
src = "blake3:d3775206011e7bcce8eaac0d1da30abf401f02ed32371a6220e05d8d10d3fdac"
text = "讨回那只鞠，重起脚再踢一回。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c2:credit_him","reply"],null]']
src = "blake3:2744e8f99c324906f8b2f7e16a4c848d641a3cae4ef24c4a00b8436cfa021896"
text = "一席之人齐刷刷转过头去。他僵在门扉边，唇瓣一张一合，忙对着一屋人深施一礼，掉头拔腿就逃，脚下木屐踏得长廊咚咚作响。先生打趣言道，飞鸟井家倒是养出一双飞毛腿，引得满席哄笑。打那往后整半月有余，他遥遥望见我便绕道而行，实在避不及，就垂首死盯着自家的木屐瞧。有一遭在鞠庭畔迎面碰个正着，他张口欲言，临了却只挤出句：“下、下趟莫替我出声。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c2:credit_him","text"],null]']
src = "blake3:14868b614ba83abb9a0be8b02758689aa86e2d1286b803f832e76892e592654b"
text = "返回席间，当着众人面挑明这句古语是他破解的。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c2:face_tree","hint"],null]']
src = "blake3:6c8451dbd6306f1a6ceda1cb557f8f6dac7edc7dcf03c5f7181e6ab76813646f"
text = "情谊 20。他见着你亦避之不及，逃得比见那两名女房还要急切。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c2:face_tree","reply"],null]']
src = "blake3:1c6b8590ea495c47f13ca4519b5e08c27f22728d438b5caa814e398379c35979"
text = "我再瞎猜一气，这一遭竟胡扯到旁部歌集里去了。他深吸了口气：“重、重来一遍。这回我单单盯着鞠。”他目光死锁在庭中那株矮垂的松枝上，恰似守候着鞠坠下来一般，从首句起头背诵，一气呵成念至末尾，其间我搭腔猜岔过两次，他亦顺带驳正了，嘴上毫不滞涩。直至诵毕他方回转过身，一张脸霎时涨红：“你、你存心捉弄人。”“我实在是不通此道。”他恼瞪了我一眼，口中却又补念出一句，正是我适才猜错那首的原句。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:c2:face_tree","text"],null]']
src = "blake3:7c3f1b3caf0dc012dbbde93db16f887bb025b4149aa09cb9140e1b280c34066b"
text = "偏要继续猜岔，直逼得他把整篇长歌诵完才罢。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart","hint"],null]']
src = "blake3:545dd331e96bc7a2b030ea5ab7ab875d5e4949964a4966de63c2196e1f084054"
text = "羁绊 A、心动 12，尚未向旁人倾吐过心意，也未曾许下终身之约。那半页纸藏在袖底，你并未取出来。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart","reply"],null]']
src = "blake3:fabaaeab896d280dcbf4ebdc66cdeb114a254f532d0eacd67b790df42faf3b83"
text = "我自袖底取出那半页纸来，裁边已然起了毛絮，正是当年当差时裁下的。他只瞥一眼那道裁口，便认出是哪一张。“那、那是你留的半页。”“如今归你了。”见他不接，我径直塞入他掌中。他探怀摸出那本抄簿，揭开最前页，他那半页果真还夹在里头。两扇半页借着雪色拼拢一处，裁口严密咬合，化作完整的一日。他凝视着那完整的一天，久久不语，末了才启口追忆起那日鞠会：何人踢的头一脚，哪一记扫中了垂柳，我站位歪了几寸。他一口气讲了这许久，竟连一个磕巴也未曾打。飞雪沾上了拼起的纸面，他抬起衣袖轻拂去。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart","text"],null]']
src = "blake3:391f02597e8168cbc6b7c3ddf3b43895ad36ed8e46176d8e19743571463dc252"
text = "将手头半页纸交与他：让那一日，拼回整天。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_second","hint"],null]']
src = "blake3:9c91a142f76a6c2340b36772c5351c94ae514419c23c2b0da294cd17fba727de"
text = "心意已许过一重：需心动 18、口才 5。他素日见人有错，向来忍耐不住总要指明。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_second","reply"],null]']
src = "blake3:322c9bf97c2968aab5de88ccc0db75fff1e2c2ab55dd2da49f0bf9b12fca3493"
text = "我将那半页纸递给了他。他伸手接过，从抄簿中抽回属于自己的那一半，两相拼拢，裁口丝毫不差地合上。他盯着那凑整的一天，张唇欲言却又咽住，双唇微动，恍若正暗自勘对一句古歌。“局、局里的人讲……”他刚起个话头便歇住了，随即将两半页夹回抄簿合严。“没、没什么。说岔的话，我不、不道也罢。”他抬指点向我袖口沾着的雪迹：“你、你衣袖潮湿了，这副模样返局里去，管衣裳的那位定要数落。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_second","text"],null]']
src = "blake3:749067bf31da9673e5ad61045320e91be20c015bbaa68355ba5a25e5bbc5dab4"
text = "心头纵已有归属，仍旧将我那半页纸递与他。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_third","hint"],null]']
src = "blake3:5aa38e2af87e5734934c317727981a06e45401eeba8cf82b1a666a06b3c7e718"
text = "心意已许过两重：需心动 26、口才 7，且当年当差那半页还得是你亲手写就。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_third","reply"],null]']
src = "blake3:e03cf85078a9cd2fa515608bda308c5345f07e9269098b36ce387d1dbdcee86a"
text = "我将那半页纸递过去。他并未去取抄簿，反先将纸翻过来瞧了瞧背面，只见背面素净如初。“背、背页我题个日子罢。”他问我讨了笔，半蹲在雪地上写下一行年月日，紧挨着又添了个“晴”字，写毕举起与我看：正是今日。“今儿正落雪。”我说。“我、我晓得。”“今日分明落雪，”他接道，“我、我落笔偏记成晴。记错了的日子，我破天荒头一遭不改。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:heart_third","text"],null]']
src = "blake3:9304329ddcf320def67e85cd84bb2c554ce428abb47dbd3b72b1f1448ae3de7c"
text = "纵然已许过两人心意，仍将那半页纸交给他。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:own","reply"],null]']
src = "blake3:1dce57ffe1d81255a99431a9beccc849ffbe0c3a03db0147a8ca848d70e8c818"
text = "“来日重逢，我俩比试一场。败者当即赋歌一首。”“我、我定不会输。”“偏你会口吃。吟歌之时磕磕绊绊，可比败阵更窘。”他忍不住笑出声来，震得松针上的积雪扑簌跌落一团，正砸了他满肩。“那、那我一边踢鞠一边吟，咏的是哪一首，全凭你猜。”“若猜不着呢？”“猜不着，便算你输。”他脚背往上一挑，那鞠越过我发顶，直飞落墙垣那头去了。他望定高墙抓了抓头发：“这、这遭轮着你去拾。”我转绕出院墙，见那鞠恰卡在一窝枯败的山茶丛根下。我探手捞了出来，照着高墙隔空踢回过去，仍旧偏得没边。唯闻墙外“咚”地闷响一声，旋即传来他大喊：“接、接稳了！”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:own","text"],null]']
src = "blake3:6c1fd4429a688b329e9e5bf64a244280e9019ec7a78ea47ac6ff0368896da37c"
text = "定约来日再会时比拼一场鞠，败阵者即席赋歌一首。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:promise","hint"],null]']
src = "blake3:5ecf3f0802c8ee15a0e17a6d57501f4021cef7bab0188210dadcc5ca5039e6c6"
text = "羁绊 A。终身之诺既已另有所属，此刻便只能目送他独返鞠庭。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:promise","reply"],null]']
src = "blake3:63e2a3c22ac723938ef438b2fccd694eb30703bf97d664877adc9fe15707a4aa"
text = "“候你当上师范，”我开口道，“便往土佐来，专程为我踢上一场。中村那院落窄小，碎石又多，少不得你亲自拾掇。”他颔了颔首，点过一下，复又一下，方才答话：“一、一定去。中村的院子坐向何方？若然朝东，晌午后的日头最刺眼，须、须得打西面起脚。”他问我借了支笔，蹲身于雪地，将我适才那句原话誊录在纸上，抄毕低诵一遍，字句竟然流利顺溜。随即他将纸条塞入鞠的腰革底下压实。我步离鞠庭好长一截，仍遥遥听得他在身后高声呼喊，言说中村那处庭院果真朝东的话，起脚便得改去西北角，而西北角的碎石全归他自己捡。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","bond_kikuchiyo:s:promise","text"],null]']
src = "blake3:c6a48f8325141d9d517da8200784991f64415be2f0b3196f9e675b0cb89d6bd2"
text = "告知他：待你修成师范，到土佐来为我踢一场。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:let_him_speak","hint"],null]']
src = "blake3:3e394abae55a8cc3f2736ab5684201e85c49b2f4c9d203d7cbee1b5b22e93273"
text = "须当年将半页纸赠予过他、心动 24，且心意唯独许了他一人。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:let_him_speak","reply"],null]']
src = "blake3:a861521a9c2424c950bf9754a8648f522b1557b96de0a92025c2e6a39b72195f"
text = "我立在树下候着。他先吸了一口气，又吸了一口，这才开口说了。他讲起那年鞠庭里的雪，讲起那两个半页，讲起自己在京都七载，每回起脚以前，总要先想一想土佐在何方。他讲得极慢，却连一个字也未结巴。说完之后，他自己倒先怔住了，低头瞧着脚边的白沙：“说、说出来了。”他从怀中摸出抄簿，抽出最前头那两个半页，翻至纸背，向我借了笔，在背面写下一个日子，便是今日。写完他把纸递了过来，我没去接纸，只握住了他的手。那天中村落着小雨，白沙上面一个脚印也没有。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:let_him_speak","text"],null]']
src = "blake3:544fe52187bfe505b7142064530b716ba35023854857e15a2c4133827d0b2a89"
text = "默然立在树下，候他先开口。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:play_match","reply"],null]']
src = "blake3:33b89c849dc997d2f37e62b983de6f057e558d912da278bb06a63377006329a1"
text = "我伸手讨鞠，他将鞠递与我。踢了十来脚，歪掉三回，三回尽数被他接住了，起脚之际只轻轻唤一声“呀”。踢罢，他低头看着我的脚，摇摇头道：“还、还是不平。”于是我们坐到树下。他说京都，说嫡出的兄长们后来终于肯容他上正中的鞠庭了，说领到免许那天，他独自一人在鞠庭站至天黑；我说下田的船，说九州的雨，说丰后水道中的急流。谈到后头，他起身面向那棵树诵了一首长歌，从首至尾，一回也不曾卡住。诵毕他坐回原处，称这首长歌是写给中村的，写此间的河、此间的白沙，与一个总爱将鞠踢歪的人。“抄、抄一份给你，你带到船上去。”"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:play_match","text"],null]']
src = "blake3:46506219b8ba425884085a19203ac1fe2ccfcefcfcaad62617e9e4540afba6e9"
text = "先入场同他踢上一回，罢后坐到树下谈谈这些年。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:speak_first","hint"],null]']
src = "blake3:156837357c55b0a8805bda18fe1239fceeca8a70fb241106a7493af8e9e41b71"
text = "须当年将半页纸给过他、心动 24；若心意唯独许了他一人，便等他先开口。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:speak_first","reply"],null]']
src = "blake3:604f601f9abef297315536318b0ca7ba7c7213790f45c8fb348b0dd55b6a39a2"
text = "我先开了口，提起那年鞠庭里的雪，提起那两个半页，又说自己这些年在海上，有几回想起京都，记起的正是墙那边飞过来的那只鞠。他静静听着，听到半途翻开抄簿，指着那个“晴”字下方的空白：“那、那天，我听说了。我没、没写。”“你可以写下来。”“写、写错的事，我不写。”他将抄簿合上，歇了一会儿却又重新翻开，借了我的笔在那个日子边上添了一行小字，写的是什么我未看清，他也没拿给我看。而后他伸过手来，握住我的手，握得极紧。庭里有人在收拾铺于白沙上的席子。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["choices","reunion_kikuchiyo:reunion:speak_first","text"],null]']
src = "blake3:2f40aeb44a54420da4982ff43647a3f2b630d1dc3bfd30a4a91b1d464c95f3cd"
text = "这一回，仍旧由我先开口。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["defaults","bond_kikuchiyo:s","news"],null]']
src = "blake3:f343286f89b1a55af9632aa0463e40a41a82c4a24d95559df046cc6090e874a3"
text = "时值腊月，京都飞鸟井家把鞠庭清扫得十分干净。那家少年在场中央颠了一整下午的鞠，不时朝场边望上一眼，可场边始终空着，不见半个人影。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["defaults","reunion_kikuchiyo:reunion","news"],null]']
src = "blake3:4a4d875972be16c1049fa1a28ce0a1ee92ed927e490b9193d3da3081567218db"
text = "土佐中村一条家的宴席上，自京都来的鞠道师范先捡了小半个时辰的庭中石子，捡净后往席间环视一遭，直至散宴也未曾踢上一脚。"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["effects","reunion_kikuchiyo:reunion:default:0","text"],null]']
src = "blake3:43c70ebdf82b7926ad19eddc96dfed7d8e7d05b904ae735684e45fc9fd796f88"
text = "澪姬：中村的宴席，我去了。庭中白沙里的石子我先捡了一遍，捡出四百余颗，大的有拇指般大小，在西北角，那、那个角早先兴许挖过井。捡完抬眼，满席中并无你的身影。听闻你的船还在外海，要等过了年才回下田。免许是去年春天取得的，京都正中那片鞠庭，现下也准我上了。中村庭角那棵树下头有块石头，是平的，我曾坐过。下趟你归来，在信里捎个日子，我再赴一趟。鞠千代"

[entries.'["stories/bonds/bond_kikuchiyo.toml",["variants","reunion_kikuchiyo:reunion:shared","text"],null]']
src = "blake3:ffd5e8c865458fedaafb2358ac85c41576c91ef1f49c6c41399f79313a248843"
text = "这一年，一条家在中村的馆邸设宴，自京都前来的公家领了一位鞠道师范，说是出自飞鸟井家，拿到免许方才不久。我赶到之际，宴席已然开场。师范立在场心行礼，行完礼便弯下腰，将沙中的石子一粒粒拾起，拾了小半个时辰。拾完，他直起身朝我这边望过来，是鞠千代。他与上首的公家叙话时，连一个磕巴也不打，一转向我，那句话却断了两回：“澪、澪姬。要、要不要再接一次？”散宴后，他在庭角树下候着我，手中拿着他那本抄簿。他翻开予我瞧，最前头夹着那两个半页，往后一页记着个日子，日子底下一个“晴”字，再无旁物。他把抄簿合拢，张了张嘴，却又合上了。"
