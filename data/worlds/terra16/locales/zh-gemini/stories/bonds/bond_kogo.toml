[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:a1","text"],null]']
src = "blake3:1ca49eebc6912c9d8a6d11139224234922ba22191c571aec18259a4bd31d885a"
text = "宝镜寺的讲经散得迟，我们回局的路上落起了夜雨。石阶经雨水冲刷得发亮，一级接一级往上，望不到尽头。小督撑着伞，我提着灯，灯光只够照出脚前两级，雨点打在油纸伞上，噼啪作响。每拐一道弯，伞就朝我这边倾来些许。才到第三个弯，她半边肩头便已落在了伞外。“往里靠些。”我说。“伞是我的，往哪边斜我说了算。这伞可是赁来的，一晚五文，你要撑，得另付。”我将灯移到两人当中，空出一只手握住伞柄往回带。她的手仍搭在伞柄上，未曾松开。“别动，”她道，“灯晃。”她那一边的袖子，湿到了肘弯。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:a2","text"],null]']
src = "blake3:d358c1ea83c1e35e8327dd8cb23366791623b0d4c122a31fc888a2c4206e22b9"
text = "小督受派去西边一户歌道之家，开春后替那家的女眷教一季歌，再帮着写信。因着路途远，行李只准带一只箱子，还是向局里借来的，箱盖都合不严实。她将箱中的物件逐一往外掏，掏到末了，是一面巴掌大小的小铜镜，外加一块用纸裹着的香饼。那铜镜背面原铸着花样，早磨得摸不出纹路了；镜沿磕扁了一处，镜面上横着一道细细的旧痕。“镜子太沉，带不走。”她把香饼推到我跟前，“这东西轻省。是我自己配的，沉香是向香铺讨的碎末，铺里的伙计只当我要买，竟跟了我半条街。”她把铜镜翻过去扣在膝上，指尖就在那道旧痕上来回摩挲。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:b1","text"],null]']
src = "blake3:c43ab90d2059c0af09ada2f6fb53117235275c15d1b3287759119d273c349223"
text = "秋天的那场歌合，题作“怨恋”。菖的那一首，判者念了两遍；轮到我的，却只念了一回。人散以后，回廊里只余下收屏风的人。小督守在柱子后头，递来一张揉得发软的草纸。“胜过你的那一首，是我写的。”她说得又急又快，“那位付了米，有两斗，够我家吃到年尾。你要骂尽管骂，骂罢把纸还我，那是我写得最好的一首，统共就这一张。”我将草纸摊在膝头抹平。第三句里涂去了两个词，另改上去的，恰是判者连念了两遍的那一处。旁人作怨恋，写的都是袖上的露水、漫长的秋夜；她写的是衣袖上留下的梅香：人走了，香还在。“第三句，”我问她，“为何不用惯常的字？”她抬起脸，把我的话重又问了一遍：“惯常的字？”"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:b2","text"],null]']
src = "blake3:13df32c9d36a2863425b7314e29739188111ece938233a53a0f7231b39f5d7cf"
text = "这一年，局里分派我们抄写《伊势物语》。小督手快，每每抄到教她不服气处，便要在纸边上批一行小字。写到第六段，男子携女子私奔，夜里把人藏进仓房，自己守在门前，待天亮一瞧，人早已被鬼吃了。她在纸边批道：“她问草上白的是什么，是不是珠子，他答都不答。活该。”我借了她的笔，挨着那行字添上一句：“他守了整整一夜，连弓都不曾放下。”她倒没擦去，提笔在两行字当中划了一道细线：“你只管抄你的，休来批我的批。再批一句，算一文。”外头忽然响起衣裾擦过地板的声响。“上臈来了！”我们慌了手脚，急急将那几页拢进书衣。书衣虽合拢了，那道细线却还露着一截在外头。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:c1","text"],null]']
src = "blake3:58bcf73fe82e7db56763a97e05508d1f7e8435302d08ab88ee9afd3c36dc6fa2"
text = "米铺伙计已经动手上门板了。我原是来替局里结这个月米账的，直到账目算毕，才瞥见角落里蹲着个宫中装束的姑娘，单手按在米袋上。袋底压着张折作细条的薄纸，探出的纸角上写着连绵的假名，纤细得宛如屋檐下的雨丝。“究竟买是不买？”伙计出声问她。“等人。”她回得极快。我挪近些去瞧那一角字迹。她的视线先停在我的袖口上，随后才抬起眼来。“一首歌，三升米，瞧一眼也得算钱。您都瞧了两眼了，我权按一眼计价，算便宜您了。”铺门口那位代人写信的老先生，一封不过收一升半；她开出的价却是两倍。我问她，这首歌原是写给谁的。她将纸角往米袋底下推进了半寸：“字由我替你落笔，心事你自己揣着。”那头，伙计举起了末了一块门板。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:c2","text"],null]']
src = "blake3:d86b556d007e7f8c0a6c7705151a2ad94d73e2f8954ca89d82c4aac50df75ad7"
text = "我并未去告发她。半个月后，我在两个局中间的长廊上拦住她，向她讨教女房词。她先朝廊子两头探看了一番，这才压低嗓音：水不叫水，唤作“おひや”；饭唤作“おだい”；肚饿了不能直说饿，要讲“ひもじ”。我挨个跟着念。念到第七个，她住了口，笔尖在纸上点出一星墨迹。“外头人都把这当笑谈，说宫里的女人连水都不敢直唤作水，你学它作甚？”我说船上也有船上的行话，听不懂便登不上船。说罢，我把“ひもじ”又念了一回，偏念成了“ひめじ”。她一愣，旋即笑得整个人伏在纸上，手中笔尖抵在纸面，压散成了一把小扫帚：“姬路！你饿了，是要去播磨吗？播磨的米倒是贱，一斗比京里便宜三十文呢。”她拎起那支笔端详，笔毫散开了，再也拢不回去了。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","bond_kogo:s","text"],null]']
src = "blake3:f142b8860d69bc1fbba893b6d0bad7ca02c6a02f2e9867398f1dfb5575224041"
text = "腊月间，西边那家歌道之家将聘书送到了局里，请她开春去教上一季。小督把聘书和她写就的回帖并排摊开给我看。回帖上一笔一画端方得很，拘谨得全不像她的手笔。“头一回给自己写信，手反倒不听使唤了。替旁人代笔，一封一升；替自己写，还倒贴纸钱。”开春后她往西去，我回土佐，跟家里的船出海。我们拿过一张诗笺，把商船常经的港口挨个写在背面：堺、兵库、尼崎、牛窗、赤间关、博多、府内、浦户。写至浦户，她停住了笔：“你的船，一年到此处几回？”我说看风。“那我的信，也只好看风了。”她把诗笺翻过来，正面尚无一字。"

[entries.'["stories/bonds/bond_kogo.toml",["chapters","reunion_kogo:reunion","text"],null]']
src = "blake3:1d811665343e071f892373858b15c82fb2eef4891110e4d092f0395ae3431944"
text = "永禄五年，丰后府内。舅舅家在大厅设宴，正中坐的是家臣，屏风侧旁另排了一席，坐着请来教和歌的女先生——正是小督。几个家臣的女儿围在她身旁，捧着各自的歌稿问东问西。她压着嗓音，飞快地逐个作答：“‘忍ぶ’在这里是强忍的意思，你当成了躲藏，拿回去再琢磨。”“这字上回就讲过，怎么又写错？错一字罚抄十张，纸钱你家出。”等发问的人都问完了，她方才抬眼望向门边的我。这几年她捎来的信屈指可数，可每封信尾总要问一句浦户的米价。“一条家的姬君，”她开口道，“立在门边做什么，没人给你腾座？”说着伸手将席侧的一张小案拉过来，往旁挪了挪，匀出块放纸的地方。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a1:hold_lamp","reply"],null]']
src = "blake3:d1eec8c9062314e1bf33e93b33fc0ac03dd6bbc8972af77ebc869b79ad6f1004"
text = "她走在后头，伞总算将她自己遮住了。待行至局门檐下收伞，她这才瞧见我半边身子已尽数湿透。“你这般淋着，明日咳起来，药钱谁来出？”她自怀中取出一叠怀纸压在我肩头，纸片登时湿作一团。她随即又抽出一叠，手下按得重了几分。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a1:hold_lamp","text"],null]']
src = "blake3:ce3aa5b3f74f01e37dd13d25b3f05cebbfd5523d17901328f5a2a471438b5131"
text = "放开伞柄，把伞留给她自己撑，提灯走去前头替她照路。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a1:share_umbrella","hint"],null]']
src = "blake3:6fc79a4ebe6c49f0266c6e7c892c4758617352a942878d913a4e275203c2d643"
text = "你若这般往一柄伞下挤，她只会把伞往你手里一塞，独自顶着雨跑上石阶。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a1:share_umbrella","reply"],null]']
src = "blake3:a648ed0a2f058edc49dbca342127abca0756f91edf1c32f0cf516ef79e0a0c20"
text = "伞面不大，两人挤在一处，谁的肩头都露了一半在外头。行至檐下，她才发觉我的衣袖也湿了，蹙起眉正要数落，话到唇边却换作一句：“这五文算白付了。”灯芯“啪”地爆出一响，我们一齐低眼望去。灯并没熄。她将伞柄往我掌心一搁：“你拿着。”自己垂首拧起衣袖，来回绞了许久，上头早就不滴水了。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a1:share_umbrella","text"],null]']
src = "blake3:02f618387f03ee0c4172726b6e2c9d1caf4e0db2ce91f69cc222fa54b837c390"
text = "将伞柄扶直，同她凑在一把伞下，走完这段石阶。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:buy_mirror","reply"],null]']
src = "blake3:a283ef29eea3b3dcb08ba34a59f6e29dbc724d45cb64ed0c805daa86048af00e"
text = "她摇了摇头：“新镜子照不出我来。何况是你买的，我还得算花了你多少，算不清。”她将铜镜重新裹妥，放回箱子最底下，往下一压箱盖，嘎吱响了一声：“沉便沉些吧。”随后，她从香饼上掰下指甲大小的一角，贴着火盆边搁下。细细一缕烟升起来，她把余下的又包严实：“既闻过了，便算送过你了。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:buy_mirror","text"],null]']
src = "blake3:aacbefc252cf04c02b87b01d714ef1cb40d55a53a0792d1f7551a26919e2fa8a"
text = "告诉她，我替她买一面轻巧些的新镜子带走。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:hear_mirror","hint"],null]']
src = "blake3:1dc1176b6da8aea67d4d70aaf7367bb4ef5459adf78039f02ebb0c5f354386d5"
text = "情谊 80、羁绊 B。她将镜子裹回布中，没再往下说。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:hear_mirror","reply"],null]']
src = "blake3:b0292fad2cf921b4450261124c39f33c3cbd64140dc7b63fd6f6b522f8dc7a6c"
text = "她谈起头一回梳头入宫那个清晨，手里发颤，镜子跌在石板上。说到母亲蹲身去拾，她先拿话打趣，说她娘拾镜子的架势，活像在捡地上的米粒，一粒也不肯漏。这话说完，她开口道：“我最难看的模样，这面镜子都照过。”我将这些记在一张诗笺背面，连着香饼裹在一处。她瞧着我包，伸手把香饼朝里头又按了按：“点起来别省着。省着省着，香就放馊了。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:hear_mirror","text"],null]']
src = "blake3:879859d1c1c7db35f7e09e4e0d18fbdf49421ef3ae52dba51acfdb05ec6359e8"
text = "向她问起镜面上那道旧痕的来由，将她讲的录在诗笺背面。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:look_together","hint"],null]']
src = "blake3:a3b31768229214d7d19808579e582403a52e66132993ddee92e4afe115cdf8cc"
text = "情谊 80、羁绊 B、心动 6。此刻拉她一同照镜子，她会笑着说你胡闹，将镜子收回箱中。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:look_together","reply"],null]']
src = "blake3:9dc67dd20da169561fcaadfbdeab0007009e96396b7dff85723b1fe4f742558c"
text = "镜面窄小，容不下两张全脸，只映着挨得极近的两双眼睛。她端详片刻，并未避开目光：“这样便够了。”随后她把香饼搁在镜面上，连镜子一并推到我手边：“镜子先由你替我收好。看管的钱可没有，等我回来，再来取走。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:a2:look_together","text"],null]']
src = "blake3:364c30d05923da5ec2947cc73cf5556237c1d3d8e03a021814104c49c3635bf9"
text = "举起铜镜，将我们俩的脸一并映入镜中。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:ask_why","reply"],null]']
src = "blake3:383dd74c6475a19c6b32c5f4b2dea1ec6d8e60e007b9b001f0d7b05d67458aac"
text = "“米，两斗。”她道，“前天我娘还数落我淘米手重，说淘走的全是钱。”说完就瞅着我，候我动气。我没动气，只说那下回我也出米，你替我作一首赢回来。她却打我膝上将草纸抽了去：“不成。”我问缘故。“你的那一首，我不代写。给三斗也不代。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:ask_why","text"],null]']
src = "blake3:afd0643f5a196abfcdfbd5bc76987a46982bf83550c1f74bd780bb71d4bbbee8"
text = "问她：为何替那一位代笔？"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:keep_draft","reply"],null]']
src = "blake3:c096ec13371edea5762d3978c9cbeffb37977b0e63c2a1e396bb863b955b706e"
text = "我将草纸折好，塞进袖中。她盯着我那只袖子：“留这东西做什么用？”我没有作声。她点一下头，神气仿佛核准了一笔账。“行，随你留着。往后但凡你托我写的，我一概应下，价钱还照老样子，少一文都不成。别以为攥着它就能杀我的价。”说罢，她便转身帮着收屏风的人一道抬屏风去了。次日局里抄书，她照样按时来，照样埋头抄，抄完的纸边清清爽爽，一个批注也没落。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:keep_draft","text"],null]']
src = "blake3:074218536ece5f49df8b10e1acdd2eb88a221522d74351d3b59b1bf2d06039df"
text = "将草纸拢入自己袖中：这张我便留下了。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:so_good","reply"],null]']
src = "blake3:01bbcb66126a214b746143327ca83c4e31047df41e49e86c5436ae4c843258b6"
text = "她怔住了：“你……不恼？”“输在这一首上，我心服。那位付米的，下回再算。”我将草纸递还给她。她接过去，细细折成一方小块，口中已转了话头：“往后你若想胜过她，来找我便是，我少算你些。……不成，这话不作数，我收回来。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b1:so_good","text"],null]']
src = "blake3:68c21ad02bec944e34c2c33ca4cb8e7068f5153e6f6abd3ca01c509c8bbdb0d8"
text = "同她说：第三句甚佳，草纸还你。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:agree_once","reply"],null]']
src = "blake3:915432949674bac8cc35c3c0a650a245e2b578d7b785c5e883bc2bab036153f4"
text = "她见着那个圈，笔尖一顿：“你赞同我？”“只这一句赞同。”她蘸上墨，顺着我画的圈重重又描了一遍，墨汁透出纸背，在下一页的正文上染了个黑点。上臈问起这处墨点，她推说是我手笨。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:agree_once","text"],null]']
src = "blake3:0c97ecfcd1fccc8e3d95b48f3758eebd4e12c3dbb59a6f511f180347e8729849"
text = "这一回便依她，在她的批注旁画个圈。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:keep_arguing","hint"],null]']
src = "blake3:9564bdff893edca7b853f9e2ed66e2d598f855ec52dcff1bb11f3f72035b0c9c"
text = "情谊 50、羁绊 C。她将纸边的批注拭得浅淡，只余几道水迹。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:keep_arguing","reply"],null]']
src = "blake3:5dc90d5530cac57e4c60679e37a47e1711dfaabf5169d287d4d484ed1897fb61"
text = "翻过去便是第二十三段，写的是青梅竹马那一对。我在旁写下，那女子的歌实在太好，男人回头原也应当；她憋了好半晌，终归还是执起笔来，专批男人变了心，一句比一句不饶人。这般来来回回地批下去，页边挤满了我俩的字迹，连正文都差点辨不清了。她把那一页举到灯前照了照：“这张不能交。”“要留给谁？”“收着，往后吵架好翻出来。照句数算，你欠我十一文。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:keep_arguing","text"],null]']
src = "blake3:026d65830690d54e0dca0f245d36b538555d46de72de7819cb3e2c3d7b819b67"
text = "翻到下一页再批，同她把一页纸边争满。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:margin_alone","hint"],null]']
src = "blake3:51963650d3d6d7f476f207c2b441edbfca1224cc9ba81e71aa7352378c911df4"
text = "我手上还留着那张草纸。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:margin_alone","reply"],null]']
src = "blake3:ab34344b3732239af23b868c10afd72479ecbb4d21e276e1d97605a25a565365"
text = "我在第六段旁的纸边上批了句：“他守了一夜，连弓都没放下。”她抄至那一页，把纸翻过去，继续抄下一页。午后，上臈过来收抄本。那一页纸边上只留着我一人的字迹，上臈问起是谁批的，她答说是一条家的姬君，这样批不合规矩，该罚。最后受罚的是我，得抄十张。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:margin_alone","text"],null]']
src = "blake3:44df245543ea28ba8aa6f192bf6083a97e9c60a500d9ca566622ba8cd1252e2c"
text = "自己于纸旁添一句批语，看她接不接话。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:return_draft","hint"],null]']
src = "blake3:074aaeafa091e222932af0655d2ebb08d9903b69bea746524bd07e16a7a1fccc"
text = "情谊 50、羁绊 C；我手边还留着那张草纸。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:return_draft","reply"],null]']
src = "blake3:23a4f933dc65d99baa8fe9e37a62daaa7ca4e25f01a5534196d94d5a1ef6d8fb"
text = "我将草纸夹入她待抄的那册书中，推了过去。她翻至那一页取出草纸，迎着窗光瞧了瞧第三句，便收进自己的书箱。“这张我拿走了，不抵你还我的人情。”她在那页纸边批了行反驳古人的小字，写罢把笔递与我：“你那份，一句一文。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:b2:return_draft","text"],null]']
src = "blake3:4eae14be9c5eca2e2bd6a138ced68c16ef855702fd0e93c0c7599041a0347bb1"
text = "将那张草纸夹进抄本，交还给她。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c1:buy_it","reply"],null]']
src = "blake3:41bbd99d66b4c58f2fb168021ae992e07ea4de6d7618f7b416d4b702fadb095b"
text = "我点出铜钱，码在米袋上。她收下钱，手停在半空：“买歌的，向来不问怎么写。要问怎么写，得另算。”她朝伙计讨过一张包米的纸，笔锋在砚边掭匀了，当着我的面写下一行，一笔连着写到底，写罢才指给我瞧：这是“あ”，从“安”字草化出来的。墨汁还没干透，她就递到我手里，接着把米袋底下那张抽出来，叠在上面：“两张，算一个价。这回不另算，下回再算。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c1:buy_it","text"],null]']
src = "blake3:2f9c9ebd475b3d806c60aafa9513275f4ba71d2705019a62b73ea2c1f01fc527"
text = "依她开价买下这首歌，只道我认不得这般连绵假名，想看她写。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c1:haggle","reply"],null]']
src = "blake3:76fdf8042f0c067a994bc209f06060ce87df1e26636bf5848c999009ff3f653c"
text = "我屈指一项项同她细算：买纸买墨的钱、她蹲在这儿耗着的工夫，再折去买主失约的晦气。起初她还绷着脸，一升一升地往下让，退到一升半时，到底没忍住笑出声，慌忙抬袖遮住嘴：“谁家的姬君会这般讲价？”“跟船上管账的学来的。”她干脆又减了一截：“一升便一升。只是得说定，你从没在这儿碰见过我。没见过我的人，下回来买，依旧是三升。”我一口应下。她从米袋下头抽出歌纸递过来，纸角上按出了个指印。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c1:haggle","text"],null]']
src = "blake3:aa5b47af752cca1e9c96235eca842da8469a822daa81131535049176e5ab4deb"
text = "拿船上理账的法子同她还价，一升一升地往下压。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c2:learn_all","hint"],null]']
src = "blake3:e917b2f71b99744ec28d7e64b0a172988e2e78911e9f3c47527fc641840b0326"
text = "情谊 20。她摇了摇手，只道那些是厨下言语，不值一记。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c2:learn_all","reply"],null]']
src = "blake3:14b4e81175c88cdb8aba05ae75d51ad2a02cfc2df40a0a096b88b688385c1143"
text = "我们一直学到灯油见了底。她取小刀把岔开的笔毫修齐，我在底下兜着剪落的碎毛，没教它掉进砚台里。修罢，她试了一笔：“上头的人里，肯学这些的，你还是头一个。”我回说自己并非上头的人，是从土佐来的。末了，她在我的怀纸最末又添上一个词，却不肯道明是什么意思：“这个词另算，等哪天你用得上了，再来付钱。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c2:learn_all","text"],null]']
src = "blake3:85ac3d70363a9fe288d5417b194d280fe83adb8449aba87578a1d1222e590ba7"
text = "将她口中的女房词逐一抄到怀纸上，念到她颔首方休。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c2:teach_back","reply"],null]']
src = "blake3:94469b2393da4a27717e0c75ec37b299825c879bbf03539d8f88dcbab31fa75e"
text = "她拿袖子掩住嘴，随我学念了几遍，末了才道：“这句话我一辈子也使不上。学费我收下了，算你半升。”三天后，有个上臈的侍女踩翻了她刚摊开晾着的抄本，我在长廊转角听见她压着嗓子骂了一声。使的正是那句话，连土佐腔调也一并学去了。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:c2:teach_back","text"],null]']
src = "blake3:b32586e39b4d86c1dfa21fe7b9d9e3356369b5c4291be27278e7ca1c0b72609d"
text = "拿句船上骂人的脏话教她，权当学费。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart","hint"],null]']
src = "blake3:5c552dfae0b39431eabdafba012318c9bdbf0c2a18c4c93b98672f7186aea845"
text = "羁绊 A、心动 12，尚未把心意交托旁人，也未曾向谁许下终身之约。诗笺的正面还空着。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart","reply"],null]']
src = "blake3:8ec2c85d5f1068a8676e6d53ac5599f2a21aa073457fd2052081cb165d0cb16c"
text = "“三升。”她答着便提起笔，落墨极慢，中间写坏了一个字，涂去，又接着写。写完后，她把诗笺倒扣在案上，不让我瞧。我数出米钱，码在诗笺边上。她将钱推回来，一文一文推得齐整：“这首不收。莫再算了，你一算，我倒想收了。”她伸手过来握住我的手，力道极轻，仿佛执着一支刚蘸饱墨的笔，生怕它滴下来。外头廊下有人唤她的名字，喊到第二声，她才收回手，将那张诗笺折好递给我：“到船上再看。风大的时候别看。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart","text"],null]']
src = "blake3:5add79771b6cf4709eb22322365b79ae6aa591734155a5bc2362a9fbd29eab87"
text = "托她题一首在诗笺正面，我按价给米。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_second","hint"],null]']
src = "blake3:a7d9d1d866ceee98f4c78736900ed3241fcad804bfc11a21b5b216c96fb3243e"
text = "既已许下一份心意：需心动 18、口才 5。宫中谁念着谁，总是她最先听见。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_second","reply"],null]']
src = "blake3:6b2d44fcb354355a6c48284d5ef6b1c1d4b2447e5c4d43a6129e00151f43f8a7"
text = "“三升。”她当即落笔，写完将诗笺覆在案头。我点出米钱，她朝那堆钱瞧了一眼，便推了回来：“这一首不收。”她语速极快，紧接着讲起局里一桩笑话，说是典侍家的侍女把“おひや”端成了热水。我听得笑出声来，她自己倒半点没笑。讲罢，她把诗笺折好递给我：“船上看。”随后起身去收拾回帖，回帖写坏了，她另换一纸，第二张写得跟替旁人写的一样好。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_second","text"],null]']
src = "blake3:eb1adb28388cc24219991cf68dd24e95a34b47ce29064c518527fca6936a2b35"
text = "心底早已许过一个人，却还是请她在诗笺正面题一首。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_third","hint"],null]']
src = "blake3:425026c3b52860b856f4c0f437947ef9a0544c3e1def9a68a42c8a561d1ce212"
text = "既已许下两份心意：须达心动 26、口才 7，且她那面铜镜仍得留在你处替她收好。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_third","reply"],null]']
src = "blake3:b9047e09cd57f5f42f1d70ba6161542ec40fc1db496bf31f0dc1edf2a9aab523"
text = "落笔前她先问了一句：“那面镜子还在你那处吗？”我答在。“那便好，那个我还要取的。”写完一首，她将它反扣在案上。待我点好米钱，她又推了回来：“这一首，不收。”诗笺依旧扣着递来，既不让我当面瞧，也没碰着我的手。“镜子那天我自来取，来取时你莫在。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:heart_third","text"],null]']
src = "blake3:c9728e40c67927ad4b984d77a8dc26d3f610677c66e37012fbc25f033b63072f"
text = "纵然已许过两人，依然请她在诗笺正面题一首。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:own","reply"],null]']
src = "blake3:ededc05a3972e8a248b7b18e8bd281e8dab607cecd4ae53d54a17413db329a95"
text = "她听罢像是松了口气，笑道：“这样倒也好。既立了约，就怕哪年写不出来，白欠你一首。”她将题着港口的那张诗笺对折递给我，自己收好了聘书。两人在局门前说准，谁先去到新地方，便由谁先寄信。我才走开十来步，她又追上来，往我手里塞进一张叠得极小的纸：“这一首算一升，先记你账上，等有米了再还。回了土佐再看，船上风大，别看。”那张纸我一直忍着，直到了浦户的码头方才拆开，已有个字被潮气洇散了。我挨着那个字旁写下一笔：欠小督，一升。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:own","text"],null]']
src = "blake3:f03c19772c308e012001791d721898e41b331d12ad227d46afe287183b8d114a"
text = "不必立约：她往她的歌道之家，我归我的海上，几时想写再落笔。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:promise","hint"],null]']
src = "blake3:80492f8eb0fd9a1d6f64d53a5fbea91a288f82138fb4da45aaeaf9af5310c087"
text = "羁绊 A。一生一世之约既已许予他人，此番唯余互道珍重。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:promise","reply"],null]']
src = "blake3:74bcb656c93a404edd71539940be0a61da7dc43df2b5104a286cb4e062b78fb3"
text = "“一封奉书两升，礼状一升半，若要盖印再添半升，印泥我可不备。”她报得极快，仿佛早就算定好了，“你的船一年往浦户去几趟，我便一年写几趟。信里我附上一张账，你先看过账再读信，可别弄颠倒了。”“要是我付不出呢？”“付不出便欠着。欠着的账，我可比你记得牢。”她将聘书折整齐，压进箱子最底层，又拿过那张回帖端详片刻，撕了，重又写了一张。这一张的字迹牵连得很长，是她自家的手笔。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","bond_kogo:s:promise","text"],null]']
src = "blake3:54016cca86317e605a6939257fccd98b664fe618b617613d6f4f1bbd08040857"
text = "跟她议定，日后我呈予大名的奉书与礼状全托她代笔，按封论价。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:pay_the_sheng","hint"],null]']
src = "blake3:9bb3ec9c5e18f5ae14adc7c15b6a201a09c6bcd22a61b91437d4676b6718aec2"
text = "唯独那一首寄回来、后边夹着账条的时候。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:pay_the_sheng","reply"],null]']
src = "blake3:a38d7e4c5c5f2d635561f2120b118c2a70ab7c5b51b02f47fa590ab632d75557"
text = "去年她托商船捎来一张诗笺，誊的是旧日那一首，一字未改，背后夹着张小账，是她的笔迹：一升。我把一升米的钱码在小案上。她瞥了一眼，收得干脆：“清了。”随即从我指间抽回那张小账，撕作两截，投进火盆。“往后奉书两升，礼状一升半，仍照老规矩。”她垂头改起学生的歌，批罢一首，顺手又取过一首。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:pay_the_sheng","text"],null]']
src = "blake3:f4a181a03619d9b938a2b892f30570a26ebc0e111df04f8ed1045a7cc2cdd28d"
text = "按她夹在那首后面的账目，付出一升。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:read_all","reply"],null]']
src = "blake3:7679742481900b2a8bdb4a4be35d1a7babbaadfe92222177f51978be0edc35e4"
text = "我将信札一封封摊开，顺着年份理齐。宴席那边正在唱今样，劝酒声起起伏伏，我们俩只顾低头核账。对到第三年那一封时，她伸手按住：“这封写得不妥。那年家里出了事。”“那年的信最简短，纸张也换过，是包米的纸。”她没答话，抽走那一封，翻到背面补了一行小字，复推回给我——写的是那年家里的事，笔调极平，就像记账。我顺嘴问她，舅舅家里谁同谁互通书信，哪位家老常往山口那边递信。她搁下笔：“这一样不卖。”说罢继续对账，算下来我还欠她两升半。“来年照旧。你欠的，我记着。”"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:read_all","text"],null]']
src = "blake3:764129fb0c9811a46fcfc6bc2d79966b544cffdc0b7d7d9ef8d98efc235681f5"
text = "坐到小案旁，将这几年的信札与账目同她核上一遍。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:that_poem","hint"],null]']
src = "blake3:94256e7a4317e62fbf4b9a2c4cf0b430bfb30850683476aed494771356a38aaa"
text = "须得当年那一首是她亲笔写给你的、心动 24，且后边没夹账。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:that_poem","reply"],null]']
src = "blake3:8a30526e485ca21b80aeb0abac3088ca2774d60cc2d128236a904da164910446"
text = "她并未看我，仍用教学生时那副低沉快捷的嗓音念了出来，一字未差。念到第三句，她的语速缓了下来，那句写的是浦户的港口，一条船归来的时候。念罢，她说：“你收着的那张纸上，有个字洇开了，我晓得是哪一字，当年落笔便写重了。”她将手覆在我的手背上，放得很稳。宴席那边有人唱着今样，她一直未曾松手。过了片刻，她用空着的另一只手从袖中抽出一张小账，压在小案上：这回写的奉书三封，六升。"

[entries.'["stories/bonds/bond_kogo.toml",["choices","reunion_kogo:reunion:that_poem","text"],null]']
src = "blake3:89e4b9370e65df4685c1d0e65bdf52be9d6ae6bb5d746091837915067f0cbd50"
text = "问她一声，当年那首不收米的，可还记着。"

[entries.'["stories/bonds/bond_kogo.toml",["effects","reunion_kogo:reunion:default:0","text"],null]']
src = "blake3:6cd4517b18d257512be114c4f5526730c8ec6a847dd61a9d9d34a5e2c05a945d"
text = "一条姬：府内的宴席，你舅舅家岁岁都摆，今年你又没到场。府内的学生不算笨，偏生性懒，一首歌能追着问我十遍“这样可好”，独独不肯自己拿回去复读一遍。我教她们写体面的书信，写与父亲，写与夫家，也写与远方人。前些天有个姑娘问我，先生自己写信给谁。我回她，写与一个在海上的人，一年一两封，看风而定。她又问那人回不回信。我回，回的，只是字迹比你还难看。你舅舅家中谁写信与谁，我都瞧在眼里，别来打听，这一样我不卖。这儿米价比京都贱，我如今每月能吃得起两回鱼。附歌一首，照市价一升，记在你账上。小督"

[entries.'["stories/bonds/bond_kogo.toml",["variants","bond_kogo:b2:kept_draft","text"],null]']
src = "blake3:8733116297d70a4d1f2cd173a6673b88f51ffeda8ce9d3c25625c60dd2e13958"
text = "这一年，局里分派我们抄《伊势物语》。小督手快，写完一页便翻一页，纸边始终干干净净，打去年秋天起就是如此。抄至第六段，写男人携女人私奔，入夜将她藏在仓房里，自己守在门口，待到天亮一看，人已被鬼吃了。她的笔尖在那一处略停了停，跟着又往下抄。我在纸旁批道：“他守了一整夜，弓都未曾放下。”她看也不看，只把抄罢的一页移去一旁晾着，另铺开一页。上臈打廊下经过，赞她抄得齐整，说局里众人都该照她的样子。她垂首应了一声，重新蘸墨，又接着抄下一页。"

[entries.'["stories/bonds/bond_kogo.toml",["variants","reunion_kogo:reunion:business","text"],null]']
src = "blake3:1f548c677dbb6cec93191787bc4faaa37510679d156760865680fcb36b86d2e6"
text = "永禄五年，丰后府内。舅舅家在大厅设宴，正席坐着家臣，屏风边另排了一席，坐着请来授和歌的女先生——正是小督。几个家臣的姑娘围着她问长问短，她压低嗓门，飞快地逐个回应：“‘忍ぶ’在这里是强忍的意思，你当成了躲藏，拿回去再细想。”等问话的人散尽，她才抬眼望向门边的我。我怀里揣着这几年她替我写的奉书、礼状底稿，摞起来足有一指厚，每封底下都夹着一张小账：奉书两升，礼状一升半，盖印的另加半升，其中三张底端写着个“欠”字。“一条家的姬君，”她说，“立在门口作甚，账可带来了？”她并未起身，只伸手将席旁的小案挪近些，腾出一块放纸的空处。"

[entries.'["stories/bonds/bond_kogo.toml",["variants","reunion_kogo:reunion:mirror","text"],null]']
src = "blake3:11e921054cc887d7cf2e2a3d296ec90945e0db560a104dcbc91bd9f0606b42ba"
text = "永禄五年，丰后府内。舅舅家在大厅摆宴，正中坐着家臣，屏风一侧另置了一席，坐的是请来教和歌的女先生——正是小督。几个家臣的女儿围在周围七嘴八舌地问，她又低又快地挨个作答：“这字又写错了，上回说过的。错一个字罚抄十张，纸钱你家出。”等问的人都问完了，她才抬首望向门边的我。那面她托我代收的铜镜我随身带来了，裹镜的布换过两趟，镜面上那道旧痕仍在。“一条家的姬君，”她说，“镜子可带来了？保管钱我可没应承给。”她伸手把席旁的小案拖过来，往旁边挪了挪。"

[entries.'["stories/bonds/bond_kogo.toml",["variants","reunion_kogo:reunion:shared","text"],null]']
src = "blake3:658fe39fe48deafabf019921c21c1759064432d06bcb26d25a1b0725220fe43c"
text = "永禄五年，丰后府内。舅舅家在大厅设宴，堂中坐着家臣，屏风旁另设了一席，坐的正是请来教习和歌的女先生小督。她把学生的问询挨个答完，方才朝门边的我看来。我怀中揣着去年她托商船捎来的那张诗笺，誊的是昔年那一首不收米的歌，一字未改，纸后夹着一张小账，是她的字迹：一升。那一升我至今还没付。“一条家的姬君，”她说，“立在门边做什么？”她伸手将席边的小案挪过来，匀出一块摆纸的地方，案角正压着一册账簿。"
