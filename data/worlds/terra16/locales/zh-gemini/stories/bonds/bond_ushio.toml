[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:a1","text"],null]']
src = "blake3:46381aae8f84725b3fcf1ecd55f37dcf7c2e3ff45e64a9c414d7eea7ed729c81"
text = "盂兰盆时节，我们启程回土佐。船打堺驶出，绕过纪伊水道，贴着土佐海岸向西行了七日。临近末了一夜，偏逢上大潮。下田河口外，海潮向内涌，江水往外冲，两股水势在沙洲前相撞，激起一道白线；船只在线外打起转来，进退不得。掌舵的船老大两手直抖。汐一把将他推开，自己攥住舵柄，回身冲我抬了抬下巴：“姬君，提上灯，上船头照水去。”我提着灯笼爬向船首。浪头接连扑打上来，灯笼被海风吹得横斜过去，我双手死死攥着提杆高举着。昏黄的灯光下，水面果真浮出一条色泽偏深的纹路，曲曲折折探入河口。“再往左些，”她在船尾高喊，“就是这儿，莫动。”船首贴着那道深色水线，一寸寸顶了进去。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:a2","text"],null]']
src = "blake3:6634f727d4bf3098c4f52be2eaeeff86acdb1f5d8275ecbfc6ffbb66ed5c280a"
text = "入夏以后，能岛的盐船又进了堺港，汐托船上的人捎回一个小布包。拆开一看，里头是只大三岛大山祇神社的御守，布袋缝得针脚细密，袋口拿麻线缠了好几匝。“泡在海水里也散不了，”她说，“我特意托婶子用缝帆的线缝的，一尺线本该两文，她多要了我一文，说是供在神前的线。”她嘱咐我站稳，自己蹲下身去，把御守拴在我的腰带上。打的不是宫里的花结，而是船上拴缆的结。她两手一绕一穿再一勒，我上手拽了拽，半点不动。“村上家的人出航以前，都要去拜那位神明，”她低头拨弄着那个结，“往后你出了海，也算是村上家的船。”说完，她用牙咬断了线头。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:b1","text"],null]']
src = "blake3:07907e324a502cf36bf2ebfc578b325ad3ecfc97bc76f021abab27e13b8d1d8d"
text = "十月间，宫中女房们去岚山赏红叶，雇了两条游船，自岚山上游顺着桂川放舟而下。我与汐同在后船。刚绕过一处河湾，水声骤然粗重起来，船夫一篙没支稳，船首猛地被急流推得横在江中。满船女房顿时惊叫一片，有的乱抓船帮，有的死抱衣箱不放，反叫船身摇晃得愈发厉害。汐一把抢过船夫手中的竹篙，双足狠蹬船板，三两下便将船头拨正。偏生满船人不肯听一个侍女差遣：管衣裳的老女房还在连声唤着船夫的名字，两名年轻女房又凑作一侧探头去看前头礁石，船身登时又倾斜下去。白浪翻涌间，一块黑礁赫然露头，逼得越来越近。汐拿竹篙死死顶住礁石，篙身都压弯了：“都不许乱动！左边的人往右靠，把衣箱放下，快放下！”船上众人仍只顾着喊船夫的名字。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:b2","text"],null]']
src = "blake3:072dd3e8f3c916e75819c4aa312cc34a017d5df6c54418cd0eb8d942a125d6c7"
text = "刚开春，能岛的盐船泊进堺，顺道给汐捎来一封家书，封皮上的墨字比她写的还要歪斜。信是她叔父写来的：说表兄鹰丸不日就要升任船头，她一个村上家的姑娘家留在京都替人端茶递水，实在糟践；趁着入夏前回去，上船学掌舵罢。汐将信递给我瞧。我读罢还她，她折拢了，少顷又摊开。窗外恰有人晾晒被褥，竹竿拍打得啪啪作响。“鹰丸那小子，幼时连橹都摇不直，他那条破小早的舵柄，还是我十岁那年帮着削的。叔父讲他快当船头了，快又是几年？能岛拢共就一条像样的好船，叫他当去了，我便是回乡，也无非跟在他后头收缆绳。”她把信笺垫进膝下，指尖在榻席上反复勾画，画的是一道蜿蜒曲折的水路。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:c1","text"],null]']
src = "blake3:7b1235df9d52f68d5c6700047f7d90db3a8b26450259803956b2403659a598bc"
text = "进京才第二个月，汐仍旧穿不惯本家宅邸里的足袋。一条本家的长廊日日拿米糠打磨，光洁得能映出人影，她跨出一步便要打半步滑，干脆褪下足袋攥在掌心，赤脚跟在我的身后。转过中庭，正与管衣裳的老女房打了个照面。那老女房“啪”地收拢折扇，拿扇骨点着汐的脚面：“粗鄙地方来的丫头，连双脚都不懂得遮掩？这儿是本家的回廊，可不是你们海贼踩的船板。”汐垂下脑袋，五根脚趾紧抠住木板。我抢上一步刚想回嘴，脚下一滑，身子登时仰翻过去。汐眼疾手快揪住我胳膊拉稳，伏在我耳畔，压低嗓音只教我一人听见：“先留神脚下。别急，潮水总会转头的。”老女房又将折扇撑开了半扇，正等着我答话。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:c2","text"],null]']
src = "blake3:44bc751d502373dc0e4cabd1eb9df43f45057fb23287909cb896bf41cbc38f32"
text = "梅雨连绵落了半月，局里的糊窗纸受了潮，软塌塌的。半夜里我醒转过来，瞧见屏风后头仍透着一点微光，灯芯剪得只剩米粒大小。汐伏在地板上，胳膊肘压着一页纸，纸角早已磨破。那纸上密密麻麻写满了一个个“澪”字：左边的三点水歪斜不定，右旁的“零”字下头总也收不拢。她每描完一字，便拿手指比划着量一量，再接下去描下一个。我脚下不小心踩响了木板，她急忙将纸覆过去，墨迹未干，透出纸背洇成一团黑影。“你留在宫中的信件，”她目不转睛瞧着灯焰道，“日后若归我替你递送，字写得难看了，教旁人笑话的是你。”话音落地，她便拿衣袖胡乱去擦指尖沾的墨，反倒越擦越乌黑。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","bond_ushio:s","text"],null]']
src = "blake3:25c59744f505cb932a5b9c2357e63bceed00c41a48aff43fb650702890f2b72c"
text = "腊月里本家递了信儿来，说是弟弟岁末便回中村，我也随行一道回去，待开春再打下田出海。音讯传进局里那日，汐恰好不在，直到黄昏方归，鞋底沾满泥泞，原是在鸭川岸畔独自行了一个下午。她走到我跟前屈膝跪坐下来。“姬君出阁总要带一条陪嫁的船，船里跟着几名供驱使的仆从，船随主人漂到哪儿便算哪儿。我可不做那条陪嫁船。”我道我压根没打算嫁人，她扬手打断了我。“我要做你的船头。凭真本事把舵，领正经工钱，航路怎么行全由我作主。你若不肯应承，我便回能岛同鹰丸争一条船去；争不赢，就先在他船上收三年缆绳，三年满后再与他争。”说罢，她从襟怀里摸出一张白纸展在两人当间，纸上空无一字。她攥起拳头抵在膝头，下巴微微扬着。"

[entries.'["stories/bonds/bond_ushio.toml",["chapters","reunion_ushio:reunion","text"],null]']
src = "blake3:668855a6d4661ba370fdeff5129b49340acd51da6131d658b21939124762020b"
text = "三年多过去，我又踏回下田。河口的沙洲仍在旧处，潮水涨起时，那道深色的水线一眼就能瞧见。栈桥边泊着一艘关船，船型不大，通身漆得乌黑发亮。汐站在栈桥上，正同一名堺来的商人议一船纸的运费。商人嫌贵，称别家的船要便宜两成。我刚张口想替她报数，又硬生生咽了回去。“别家的船可进不了这河口。”汐开口道，“你去瞧那根桩子，今日小潮，水才淹到第二道绳。你那船吃水五尺，拢不到栈桥边，只得停在沙洲外头另雇驳船，一船纸得驳三趟，花出的驳船钱早比我这两成贵了，纸还得再挨一遭雨淋。”商人低头盘算了许久，只好认下这价钱。她这才回过身，抬手招呼我登船：“船是我亲自挑的。你先顾好脚下。”栈桥木板还湿着，第三块已经松动了。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:hold_lantern_all_night","hint"],null]']
src = "blake3:5ab58a70a59230bc448fbf64b26985a0b7f37ec901ee1c59e78e6a3ffba2ff6b"
text = "情谊 20。举至后半夜，双臂颤得再攥不住提杆，灯笼便交给了水夫。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:hold_lantern_all_night","reply"],null]']
src = "blake3:49b63debe12bc14c5878db9483717d79d25149f172edec91d4322881938dc5d6"
text = "我硬是一直举着。等船过了沙洲、进到河口，靠上下田的栈桥，天边早已泛白。汐大步跳过来把灯笼从我手里掰开，我两只胳膊一松下便再抬不动了。她蹲在船头替我按摩，从手腕一路捏到肩头，嘴里不住数落：“提杆得搭在肘弯里头，你偏拿手腕悬着，硬悬了一宿，明早怕连筷子都夹不住。浪头扑过来时要矮下身去，你倒站得笔直，灯油洒出去半盏。”捏到肩膀那儿，她的手停在上面不挪了，嘴里的抱怨也收了声。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:hold_lantern_all_night","text"],null]']
src = "blake3:3da4dc4363f91c5c121659f428dabfe4c109cdb2e196dad69aa43fc262d698ff"
text = "高举着灯笼不放，直到船靠上栈桥。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:learn_her_line","hint"],null]']
src = "blake3:e9bb064a065c931467664b6edc2b353b4a75b93188ee6be04f0fa7b5c23a0e39"
text = "情谊 50、羁绊 C。她困乏得眼皮都掀不开，辨水线原是村上家的绝活。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:learn_her_line","reply"],null]']
src = "blake3:f82d673ee5d6011a415a82a80c20b120c373a82749b9f376a8d7129bd9b9bf82"
text = "登岸后她倒头便睡到日正当中，刚醒便拽着我奔向河口沙滩，顺手折了支芦苇在沙地上比画。“河水浑浊，海水清澈，两股水头相撞之处，水底会冲刷出一条深槽，水越深，水色就越沉。大潮时深槽宽阔，小潮时窄些，莫去盯海浪，浪头最会哄人，要盯着浪底那一抹底色瞧。”她在沙上描出沙洲、深槽，又画出浪涛的来向。涨潮的海水涌上岸来，将沙画一笔笔冲平，她便往高岸挪几步续着画，直画到天黑点起火把。“往后你的船，水线交给我来认。”“那你可须一直站在船首。”她将芦苇杆往沙里一插，抬头望向潮水漫到了何处。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:learn_her_line","text"],null]']
src = "blake3:5338a8c4c1ebb4f8991a1ae44be9fc67a91f1689a831f03f7e6bd8f26ee3a707"
text = "登岸后向她讨教，那道深色的水线究竟是如何辨出来的。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:thank_her_mother","reply"],null]']
src = "blake3:c61138729d06d79b86aed7cf1475ebd70b24e3c830674cbfcd5193813a13b075"
text = "阿濑守在栈桥畔苦等了一整宿，满头乱发全给海风吹散了。我奔上前去，语无伦次地抢着诉说：风浪多凶险，水线色泽多深，汐又是如何一把推开船老大稳住船舵。阿濑先扯开嗓门把那船老大痛斥了一顿，骂罢方才抬手抚摸汐的发顶：“真不愧是我女儿。”汐立在后头乖乖由她摸着，目光却始终落在我身上。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a1:thank_her_mother","text"],null]']
src = "blake3:636802084d6e3508af47a62a6e991c76c82f32c10b30908189e382bff1f57f12"
text = "登岸后先寻去乳母阿濑那儿，告诉她多亏汐领着船入了港。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:ask_the_god","reply"],null]']
src = "blake3:ea8ad4f642d1164a6ed87900c86d55f2d74e0e03b6d0fa0aa43693581e05ffa9"
text = "“灵验与否，全看你能不能平安回来。”她轻拍两下我腰畔的御守，复又垂首拽开那个船结，摘了下来，转手拴回她自己腰间。“既然你不放心，暂且寄在我这儿，它照样护着你。”我打趣说那它岂不要累坏了。她横了我一眼，嘴角却还是没忍住弯起来：“那你便少往远处去些。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:ask_the_god","text"],null]']
src = "blake3:3a763877fe9ded031d3ce7516ed9f25c88f434fed9e1d110a038c278cd19c80e"
text = "问她大三岛的神明灵不灵验。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:speak_of_cane","hint"],null]']
src = "blake3:940fc499a0b09d8b21ec9264302ce02a7bf7374fb8bf9432cc71cd0327522162"
text = "情谊 80、羁绊 B。这桩旧事，我尚未想妥如何启齿。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:speak_of_cane","reply"],null]']
src = "blake3:5bd8f593935558add047629e1d361955973fc9dae23bfdc30e312885bff422ac"
text = "我招认那年割断缆绳的是我。她打结的指头停也不停：“早知晓是你，我娘也清清楚楚。”“那挨的十下——”“就十下罢了。你放在心上便成，休要拿铜钱去折算，算不清楚。”她将绳结猛地抽紧，抬眸瞄了我一眼。我本没打算拿钱去赔，可方才心底着实又把买姜膏的钱默算了一遍。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:speak_of_cane","text"],null]']
src = "blake3:201fda3b2836f65c87d9e1aac00f88f6c9c57ed9a7a0d11966d58ec22203b567"
text = "接下御守，提起当年下田网棚底下的竹子。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:tie_one_for_her","hint"],null]']
src = "blake3:687a8c514da006b46f9a75015228b8a19a79f652793d794bc8a042c90c32c06f"
text = "情谊 80、羁绊 B、心动 6。发绳攥在指尖，终究还是松开了。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:tie_one_for_her","reply"],null]']
src = "blake3:48e17a9a3f302c3cab96843e1f97715e7fc8eca44bc87cabc542c8716aa94aae"
text = "我解下发间系着的那条红白发绳——是从小用到如今的旧物，线头早磨起了毛边——牵过她的手腕绕了两匝，仿着她的手法打了个船结，只是系得歪斜难看。她垂眼拿另一只手的指尖拨弄着那歪结，拨了两下，竟也没拆开重系。“这东西我可不还你了。”她将那截腕子藏进袖筒，一路藏着走回局里。当晚我披散着长发去见老女房，免不了又遭一顿训斥。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:tie_one_for_her","text"],null]']
src = "blake3:f2e9011b2cb197afc400bf6eaede10c8e1f9ba1ee27b3df3b88d9b356e771f51"
text = "接过御守，随手解下发绳拴到她腕上。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:wear_charm","hint"],null]']
src = "blake3:7301f6ab6968b2ce4c407fcf59b6eb7ea4a487e9f7676476bafc184f11fd4d4c"
text = "情谊 80、羁绊 B。悬于腰际的绝非寻常布囊。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:wear_charm","reply"],null]']
src = "blake3:27c17dfa932b3eb43e9dfc1d5a7217d9f1469391b6bc4cb32b95a1032f7ee6a5"
text = "她手底打结的动作顿了顿。“船头之位得凭本事自己挣来，哪能由姬君随口封赏。”“那我便等你去挣。”她复又将绳结用力抽紧，勒得我倒抽了半口凉气。那一整个秋日，我腰间始终挂着那只御守，步子迈得疾了，它便轻轻拍打一下我的胯侧。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:a2:wear_charm","text"],null]']
src = "blake3:b2aaabcb602c468eb56a7d157033bef8810a45cff95489b0e07b0c39f4b86a84"
text = "接过御守，对她说：这船的船头便是你了。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b1:back_her_up","hint"],null]']
src = "blake3:9e3b50d0f4f2fac7a2106240eaade710f0060f9e59e4b5c24a3ae8bb8fc6fdce"
text = "情谊 20。她背身向着我，双肩紧绷。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b1:back_her_up","reply"],null]']
src = "blake3:e0925f50b673a333ca9fabed5cf90f81c5882d59df6703643db52ab7fc7e22de"
text = "我迎着摇晃的船身霍然立起，扬起打入宫后从未使过的洪亮嗓音喝道：“一条家的人同在此舟，统统听她号令行事！”喧闹的船舱登时鸦雀无声。汐叫往左，众人便往左移；喝蹲下，十几层华贵衣裙齐刷刷俯低下去。小船贴着礁石惊险溜出了激流。及至登岸，众女房纷纷簇拥上来，夸赞一条家的姬君好生胆魄，又赞侍女力气着实惊人。汐将竹篙交还船夫，径自走去前头。回局途中我唤住她，她停步转身，垂着眉眼道：“不知姬君有何示下。”空荡荡的回廊里明明半个外人也无。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b1:back_her_up","text"],null]']
src = "blake3:4311378fc275102ad9c5f070ad7e62d21191872b2f1b30d98192198dbb9bdd98"
text = "站起身来，以一条家姬君之名令众人全听汐的差遣。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b1:hold_her_steady","reply"],null]']
src = "blake3:4ce6537d3a37dabbbbb1694041f4a05710120cad3fc54cd983ec57386373dec8"
text = "我猛扑上前，从身后环搂住她的腰际。她奋力撑篙时身子前倾，我便使劲往后拽着坠住她。船贴着黑礁蹭过，冲入下游平缓水面时，我仍旧死死抱着不放。她这才转过脸来，低头瞧见我圈着的臂膀：“姬君快撒手，岸边有人看着。”我只好松了手。余下那截水路，她始终背对我撑船而行，竹篙点入水中，一下比一下戳得沉重。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b1:hold_her_steady","text"],null]']
src = "blake3:e7efbf61c6dfab13232e521fd48b23c0368f7437104b43dbe8eb375e682f3ff6"
text = "一言不发，只从身后搂紧她的腰，帮着稳住重心。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b2:ask_what_she_wants","reply"],null]']
src = "blake3:a426371ac24bce3b3bfc17e08c71a7dcd98c04cab3e630873a4a1fe701a405a6"
text = "“去海上。”她脱口而出，顿了顿方补上一句：“我娘嘱咐过，喝过同一口奶的孩童走去何方，奶娘的闺女便跟去何方。这是我娘的意思，可不是我自个儿说的。”话刚落地她反倒先睁大了双眼，连忙低首去折那信笺，折成四方齐整的小块，复又摊开重新折起。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b2:ask_what_she_wants","text"],null]']
src = "blake3:5c289cef9d8f67d32d6b6aada707e6c6bf7c27a8feb8e3ee8f9d26616ec50e43"
text = "问她自个儿究竟想去哪儿。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b2:count_the_fare","hint"],null]']
src = "blake3:6202d1c33c14bff71974658926d99e5156aec646d502ed9aea7608a431743f0f"
text = "情谊 50、羁绊 C。那纸家书她不肯再递我看第二遍。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b2:count_the_fare","reply"],null]']
src = "blake3:37c90892d9c810b332f871e6d4523abec05c062093dd8902f3c0f32f88e63c90"
text = "我取过算盘仔细算清：下淀川的船资四十文，打堺乘盐船至能岛每人一百二十文，外加沿途饭食及两道关卡税钱，一并打到三百一十文；末尾拿我攒下的私房钱凑齐，足足有余，还剩出九文。我将写好的纸推向她，她原封推了回来：“盘缠由我自己挣。待我学会了掌舵，再来寻你的水路。”当晚她便写了回信，信中唯有一句话：“再等两年。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:b2:count_the_fare","text"],null]']
src = "blake3:e5eab7f21d97c669fb2860f4bbe6416a549e0050a99e61f818bdfb6051f772c0"
text = "替她把回能岛的盘缠逐笔算明，搁到她跟前。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c1:take_off_shoes","reply"],null]']
src = "blake3:19df52f4ec9a1e47f57573ea873323b1cae69e3e80fd4d3a818fe80557f909c4"
text = "我甩脱足袋，赤足大步向前行去。老女房登时张口结舌，连折扇都忘了收拢。汐随在后头拼命忍笑，笑得两肩不住颤抖，脚下反倒稳当得很，半步未再打滑。直走到长廊尽头，她方才凑上前来：“你脚底板细嫩没茧子，踩这般光滑的木地最易吃亏。五趾得学会抠住地，就同立在船板上一个道理，船一摇，你自个儿先跟着顺势摇，莫傻站着等船把你晃倒。”说罢她蹲下身，伸指头将我的脚趾一根根按贴在廊板上。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c1:take_off_shoes","text"],null]']
src = "blake3:13339c3aa0f57e075b95a0fd4b6f6d2818ce2933e58b741c5569ef98b592381f"
text = "同样褪去足袋，赤脚陪她走尽这条长廊。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c1:talk_back","reply"],null]']
src = "blake3:a778dd2793f0e22b9314aefb1edce6408943960aad97cde9719b7001d97f00ce"
text = "我轻拂衣袖，微笑答道：“劳您挂怀。本家廊下擦拭得如此照人，本就是用来映影的；不论照见了谁的双脚，皆是这条廊下的造化。”老女房脸色青一阵白一阵，手中折扇竟一时张不开了。末了受罚的却是汐：罚在长廊跪足半个时辰，还得替老女房局里修剪灯芯。我隔着纸障门轻声问她寒不寒。她道：“我娘常言，姬君顶撞长辈，领罚的终归是随行侍从。往后你顶嘴前，先瞧瞧我立在何处。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c1:talk_back","text"],null]']
src = "blake3:86f033260f885b3c91499923be4bcfac583bfdff6fc5d66b0a7e58cc4e020707"
text = "拿宫中最周全的礼数话，将老女房噎了回去。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c2:read_her_letter","reply"],null]']
src = "blake3:f508c9ec4bed8b8cc2e5c01e3fc1eedf3ef64755feb980935aafebd079385749"
text = "我不去瞧那信纸，只询问她欲同家中言说些什么。她迟疑良久，复将纸翻回正面，背页尚留有几行字，原是寄与她娘亲的：京都的水都是死水，全无咸味；宅邸回廊滑得出奇；今岁一尾鲷鱼索价六十文，宫中贵人们吃起来连眼皮都不眨。再朝下一行已涂抹成一团墨黑，涂罢重写，写罢又涂。她拿蘸着浓墨的指腹死死压住那处：“这行不算。真写落纸上，倒显着像句假话。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c2:read_her_letter","text"],null]']
src = "blake3:786f50f3944749fd7b28d892822fedadbc44f2486fb520da17d2a8dd83424607"
text = "避开眼不看那纸，请她口述欲寄家书的内容。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c2:teach_her","hint"],null]']
src = "blake3:1c24357f6ed599a347384174014a2783f345a2dbd544494c337f32e28e4faa53"
text = "情谊 20。她将纸压在身下，顺势吹熄了灯盏。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c2:teach_her","reply"],null]']
src = "blake3:01922b6fdc1769f3d64ddae34c76d04f5ea8f5e00151b74af85f6dd072ca8d4a"
text = "我在她身旁屈膝坐下，覆住她握笔的手。她的手远比我硬朗，掌心磨着厚茧，笔杆捏在指间不住打滑。“三点水须有水态，”我道，“一点低过一点，落毫轻巧，收笔干脆，休要拿它作钉子一般往下钉。”她依言落墨，点出纸面的却像三块礁石。我们就这般一直描到窗纸透白，末后那个“澪”字终是她独自写成的，端正妥帖。“那往后你的信，我可以代笔了。”“我的信我自己写。你想写，去写你自个儿的。”她把信纸折成小块，起身去续灯油，添完才醒悟天早亮了。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:c2:teach_her","text"],null]']
src = "blake3:2d4d82c253c67c5227b1547b1460e4282f3800dff04513f97624d6c49d8201e3"
text = "坐至她身侧，握紧她的手逐笔相教。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart","hint"],null]']
src = "blake3:c9da9dd82200f4e03c55e82dd94d3b03a4b8e20738109d634ac6929267604a1b"
text = "羁绊 A、心动 12，尚未向旁人吐露心意，终身之约亦未曾许过谁。笔锋悬在了工钱一栏上。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart","reply"],null]']
src = "blake3:1a04f193bc85e0981534f3ab7b42c3a910177b83958c07c01b9d4c6977e54ee0"
text = "我落笔写道：“船头，汐。舵柄归其执掌，舟中众人皆听调度。”工钱那栏留了白，末尾落款一条澪。她拿指甲尖在留白处轻轻一划。“工钱作何算？”“随你自己添写，要多少皆可。”“由着人随便填的，那算哪门子工钱。”她并未伸手取笔，而是自怀中摸出一块洗得泛白的旧手巾——原是幼时在中村，阿濑常拿来给我俩揩鼻涕的那一方——将纸细细裹入其中，打了个船结。“我娘教过，账目糊涂的物件莫上船。这张纸不上船，归我贴身携着。”那一宿我俩并肩坐在局外的长廊上，木板寒凉透骨，腊月的朔风直打中庭卷进来。她垂首倚住我肩头，我将她冰冷的手揣进袖笼里暖着。远方古刹隐隐传出钟声，默数到末后便再也数不清了。次日清晨她来叠收被褥，开口便道：“你这肩头硌得慌。开春由我来掌舵，你老实坐去船尾罢。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart","text"],null]']
src = "blake3:e0539abf70aca8040d102db85fd2162677e1ea3e9f859dba56300344dc86c853"
text = "仅写明舵位，将工钱一栏留白，落款交予她。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_second","hint"],null]']
src = "blake3:47f327cf987099cf8d281a907d1548dc1343a6830097d30a31e2f653d2a5a28c"
text = "已许过一份心意：需心动 18、意志 5。近几夜我不在局内，油盏里的灯油原是她替我留着的。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_second","reply"],null]']
src = "blake3:4a16c6c98b0b8c22fbd79b9b82287130446d8429014a1dabb5907865bf851687"
text = "我写好舵位，照旧留空了工钱一栏，签下名讳。她双手接过，却不先低头瞧纸，反倒凝望我道：“近来几宿你夜不归局，灯油我一直给你留着，还剩了半盏。”我应了声是。“我也没问你去了何处。”她摸出那方洗得发白的旧手巾——正是儿时在中村阿濑拿来替我俩擦鼻涕的那一块——把纸叠好裹了进去，打牢一个船结。“我娘讲过，交了钱的船得护卫到底。我这条没交钱的，照样护着。”她站起身去替我铺展寝被，行至屏风旁又补上一句：“开春启航那日我来掌舵。这一趟跑完，我便回能岛放那条关船下水。主意是我早先拿定的，与这事全不相干，你休要多问。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_second","text"],null]']
src = "blake3:a498e606f532bbbdb01245b07bdd7c4771b5a332b39b27384326d9e1821858a1"
text = "心中既已许了人，却仍仅填舵位，将空着工钱一栏的纸递予她。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_third","hint"],null]']
src = "blake3:8801fcac2a509c77f61bad8b508c131a1ddde2722b3ae55cdb1ef3442a50e411"
text = "已许过两份心意：需心动 26、意志 7，且她手腕上还须缠着我那条发绳。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_third","reply"],null]']
src = "blake3:6bcf3e98efdbb9c0dde5e6e7773bbe1c7bba6c4dcd044e1bdcf9b42f5b8eeac7"
text = "我填罢舵位，照样将工钱那栏空着。她接在手里翻过背面，背面亦是素白一片。她将左袖往上挽起，腕间那条红白发绳依然系着，只是线头磨得愈发毛糙了。她拿那方旧手巾裹起纸张，系牢一个船结，便站起身替我铺设寝具。待到开春我出航那日，由她把舵，船一离了河口，她沿途只高声报着潮汛时辰与水深尺寸，直喊满一整日，把嗓音都喊嘶哑了。及至泊入浦户，她将舵柄移交予水夫，自个儿搭上盐船径直回了能岛。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:heart_third","text"],null]']
src = "blake3:baeb50ce5ecd4b54368546f9adc23f955e25628e611c50db8d873a5c575982e5"
text = "既已应许过两人，仍唯独写下舵位，将那纸交予她。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:own","reply"],null]']
src = "blake3:d32fd075f05f599d440e279f9947e5f4073a235edfdf8da2ea0bc9e49d9e2b7d"
text = "“那你可准定要败了，”她半点没客气，“我可是村上家出身的。”“我身上也有一半算村上家的人，吃着你娘的奶水长大的。”“既如此，咱俩只比看潮，不比划桨。”她语速极快，“论划桨你抵不过我，辨潮水你倒兴许能胜我一筹。便定在大潮那日，自下田河口外那道白线起算，谁先将船领靠栈桥算谁赢。我娘就立在栈桥上看，她最不偏私。”她朝前探出小指，恰似儿时在中村河滩上那般；我伸指勾住，她猛力往回一拉，险些将我拽个趔趄。开春我打下田出海那日，能岛的盐船早在三日前便离港而去，船梢悬着一面我从不曾见过的小旗。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:own","text"],null]']
src = "blake3:92926c04bc14381cf0896b1eb5ac9c937cdc794c5b26181a338e10bc00a2daba"
text = "与她约定先返能岛学艺，来日再较量谁驾船更快。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:promise","hint"],null]']
src = "blake3:ebc966de96bfd48ae4a6f6f13441efce029374e9b663ffa7b0ad023752571e9e"
text = "羁绊 A。一生唯此一回的约，若已许与旁人，这纸便落不得笔。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:promise","reply"],null]']
src = "blake3:e2ca92985d351aac8cbba7409bfd84c8842534d583adfb66b20ef21bb3988ad4"
text = "我研好墨提笔写道：“船头，汐。舵归其管，舟中人等皆从其令。每月工钱——”写下个数目，比本家支予管事的多出一成，落款一条澪。汐取过去轻念，嘴唇跟着翕动。“多算了一成。”“没有多。”“就是多了。照管事的数额写便好，多出的你自己留着。”我偏不改。她亦不再辩驳，把纸折了又折，转身去替我铺床，行至屏风处回过首：“开春出海那日，我来掌舵。说定的工钱一文都不许少。”打第二年起，但凡到了发工钱的那天，我的枕畔底下总会多出一小串铜钱，数过一遍，分毫不差，正合那一成。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","bond_ushio:s:promise","text"],null]']
src = "blake3:64897cb90bb4518b2b47641c14c9b3c2a4c4d220f31b83a5d98e20665191a470"
text = "将舵位与工钱逐项写明落纸，署名交予她。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:friend","reply"],null]']
src = "blake3:095fbd0787493e9510c7564b4e2462abd25be8d9e64cdcd6d61762baf7891491"
text = "次日清晨我们驶出河口，向西去绕足摺岬。她掌舵，我提灯，天色尚未放亮，她便硬要我提着，说是船上的规矩，便是客人也得干活。海浪比那年盂兰盆平缓些，她却比当年凶多了，一会儿嫌水夫收缆太慢，一会儿又怪我把灯举歪。“往左些。”“行了，别动。”待绕过岬角，日头升起，她将舵交给水夫，来到船头挨着我站定。返港后她清点整船货钱，我在一旁替她报了个总数，她没理会，自顾自重头数起，点出的数目与我说的差了三文，竟真是我算错了。她把一串钱放进我掌心，说是提灯的工钱。“你依旧是我的姬君，我也依旧是你的乳姐妹。可这条船是我的。”我说下回可要涨价。她道：“那你先学着看水线吧。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:friend","text"],null]']
src = "blake3:1548c32e6fbdbcf4a8dadc427fc710a27753ea292f8a323ee2af8489c07f8cb5"
text = "登她的船，随她出趟海，瞧她如何当这船头。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love","hint"],null]']
src = "blake3:bfffcbad7351c9c6c5b6a1ca86d9a43a34bf4660cfe2c12e603bf391a99120ec"
text = "需当年许过心意，且心动达 24。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love","reply"],null]']
src = "blake3:f4e75d349a17cb80f7315defc9e5df0005f3848bce454993e3570fd16247dbf4"
text = "我说我想把当年留空的那一栏讲明白。汐转身冲水夫喊道：“舵你看着。”她攥着我的手腕，穿过堆满纸包的甲板，直走到船头。船头横木上刻着一字，先前在栈桥上未曾瞧见：是个“澪”字，三点水一笔比一笔低。“刻坏了两块板，”她说道，“后来换上的就是这块。”她从怀中摸出那块旧手巾，解开，纸张仍在，工钱那栏依然空白。“不填了。这船是我的，你是乘我船的人，填上什么都不妥。”我说那我不填，我说别的。我说得不缓，词句也不怎么动听，可才说到一半她便笑了，笑着倾身吻了我。一阵浪打上船头，船身晃了一晃，她却未松手。水夫在后头轻咳，她连头也不回：“盯好你的舵。”"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love","text"],null]']
src = "blake3:8acdb493d7b9fd81beb394442305432027c6db5a897d0e86d31b9a469df356e0"
text = "此刻便把当年空着的工钱一栏说清。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love_cane","hint"],null]']
src = "blake3:636e780affef23aefbe7dc30ce915d2f0ba2de3a6a2e66ea02b1ab67f2a0d032"
text = "须当年许过心意、心动达 24，且那十下竹子也在京都时向她提过。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love_cane","reply"],null]']
src = "blake3:33d23eaf34e30cd1aa5c83b4fba6d402eab25a05937b2030e8da21ba9b250caa"
text = "我先提起那十下竹子。汐面朝大海听着，听到半道截住我的话：“这事你在京都讲过一回了。讲过一回便罢，再提反倒像在讨价。”她转身朝水夫喊“舵你看着”，随即将我拉往船头。横木上刻着一个“澪”字，三点水一点比一点低，末一点刻得太重，直裂进了木纹里。她从怀中摸出那块旧手巾，纸还在里头，工钱一栏依然空着。我说我也有话要说。她道那你说，慢些说。我开口了，却说得极快，话未说完，手巾便被海风掀起来，朝船舷边卷去，她一脚踩住，俯身拾起，把它系在了我的手腕上，打的是个船结。"

[entries.'["stories/bonds/bond_ushio.toml",["choices","reunion_ushio:reunion:love_cane","text"],null]']
src = "blake3:ec6bee54df86e124a6f3de83ea1d251fab72e0f049670aace47e3900d405f28b"
text = "先提那十下竹子，再把当年留空的那一栏讲清楚。"

[entries.'["stories/bonds/bond_ushio.toml",["effects","reunion_ushio:reunion:default:0","text"],null]']
src = "blake3:2b1c31570a0a874538b877b594e62f75b8b4d17e9ad7b2988a98904c873094b3"
text = "姬君：这封信是我自己动笔写的，字丑，你认得。你没来。我在下田等了一整夏，等过秋天的大潮，船得去堺装货，实在不能再耽搁了。我如今当了船头。船是我自己选的，一条关船，身量不大，吃水却浅，进得了下田这处河口。别家的船过不来，我的运费便比旁人贵出两成，堺来的商人嘴上骂我，骂完照旧雇我。船上水夫一共七名，两个来自能岛，一个是你家的，就是小时候偷柿子叫我娘追着打的那个，他如今也会收帆了。我娘身子还硬朗，盂兰盆那会儿还去河口点灯，说是替当年提灯的人点的。她问你几时归来，我说不晓得。随信给你捎了张下田河口的潮时表，全是我自个儿记下的，一天记两遍，记了三年，当中病了四天，那四天是水夫替我代记的，字更丑些。日后你的船若要进这河口，照这表上走便是。大潮那几日别硬闯，且在外头候上一夜，我在里头望得见你的灯。背面那句话，你听我说起过。汐"

[entries.'["stories/bonds/bond_ushio.toml",["variants","reunion_ushio:reunion:cane_confessed","text"],null]']
src = "blake3:decd05fd6e8056ed780d8660dc433025201446917216eb4050f569e5651d8ee6"
text = "三年多过去，我又踏回下田。河口的沙洲仍在旧处，潮水涨起时，那道深色的水线一眼就能瞧见。栈桥边泊着一艘关船，船型不大，通身漆得乌黑发亮。汐站在栈桥上，正同一名堺来的商人议一船纸的运费。商人嫌贵，称别家的船要便宜两成。“别家的船可进不了这河口。”汐开口道，“今日小潮，水才淹到第二道绳，你那船吃水五尺，只得停在沙洲外头另雇驳船，一船纸得驳三趟，花出的驳船钱早比我这两成贵了。”商人只好认下这价钱。她回过头瞧见我，先自笑了：“你那回认了，我倒白挨了。”这句话她打小便说过，竟是一字未改。随后她才扬手招呼我登船。"

[entries.'["stories/bonds/bond_ushio.toml",["variants","reunion_ushio:reunion:cane_silent","text"],null]']
src = "blake3:dc1356fc2b3c9ff163f297e7a25e21a22b624140a49f805e1701c34206948a52"
text = "三年多过去，我又踏回下田。河口的沙洲仍在旧处，潮水涨起时，那道深色的水线一眼就能瞧见。栈桥边泊着一艘关船，船型不大，通身漆得乌黑发亮。汐站在栈桥上，正同一名堺来的商人议一船纸的运费。商人嫌贵，称别家的船要便宜两成。“别家的船可进不了这河口。”汐开口道，“今日小潮，水才淹到第二道绳，你那船吃水五尺，只得停在沙洲外头另雇驳船，一船纸得驳三趟，花出的驳船钱早比我这两成贵了。”商人只好认下这价钱。她转过头望见我，手并没抬起来。“当年那竹子，十下我可全替你记着。”说完这话，她方才招手唤我上船。"

[entries.'["stories/bonds/bond_ushio.toml",["variants","reunion_ushio:reunion:shared","text"],null]']
src = "blake3:f19ab863a3b2f4fcfc8369d87a13ec0fcea7de348a435c242bd8c9fc11ef6928"
text = "三年多过去，我又踏回下田。河口的沙洲仍在旧处，潮水涨起时，那道深色的水线一眼就能瞧见。栈桥边泊着一艘关船，船型不大，通身漆得乌黑发亮。汐站在栈桥上，正同一名堺来的商人议一船纸的运费，商人嫌贵，她便将木桩上的水痕、小潮的时辰与驳船的价目逐一摊开说明，商人终究认了价。她回过头招手叫我上船。舱口压着一封信函，封皮字迹并非出自她手。“半道上顺便捎的，给你的。”她说道，“送信那天我顺路见过那人一面，只讲了一句话，别的再没多说。这条船走下田到堺，你的船队朝西去，咱们原不同路。你先留神脚下。”她船舱里悬着的，是能岛的过所旗。"

[entries.'["stories/bonds/bond_ushio.toml",["variants","reunion_ushio:reunion:with_yuki","text"],null]']
src = "blake3:1e6ef17df75c14ebbb2065502e56c3324dcc2f7967d824f37d803d8749c05f6c"
text = "三年多过去，我又踏回下田。河口的沙洲仍在旧处，潮水涨起时，那道深色的水线一眼就能瞧见。栈桥边泊着一艘关船，船型不大，通身漆得乌黑发亮。汐站在栈桥上，正同一名堺来的商人议一船纸的运费。商人嫌贵，称别家的船要便宜两成。“别家的船可进不了这河口。”汐开口道，“今日小潮，水才淹到第二道绳，你那船吃水五尺，只得停在沙洲外头另雇驳船，一船纸得驳三趟，花出的驳船钱早比我这两成贵了。”商人只好认下这价钱。她挥手招我登船：“船是我亲自挑的。你先顾好脚下。”船舱横梁上压着一卷歌稿，用的是京都的薄样纸，字迹纤细，出自冷泉家的手笔。她瞥见我正盯着瞧，咳了一声：“眼下她的书信，不用再经你的手了。”说着她把歌稿往横梁深处推了些，推罢却又往外抽回少许，好教我看清封皮。"
