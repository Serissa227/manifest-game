[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_choice","news"],null]']
src = "blake3:5bc8a79306db8497d352d255eab679d606091d763720c31ca4112d0bfa112631"
text = "宫里的菖头一回踏进京都上京那间替人代书的小屋，一待便是一整个下午，出来时连袖口压皱了也未曾去理。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_choice","text"],null]']
src = "blake3:beac459bd02fd7ad47332fc3b6a914ee304c67b3c9fc0afdd841541b5afe64ad"
text = "内里新殿外搭着木架，匠人的号子声翻过宫墙，直落进上京里。我往柿子树下去拿托小督代笔的信，她才封妥，门前天光一暗，进门的却是菖。这些年头她从未踏足过这屋里，袖口压出一道折痕也不理会，径自落了座。“修整妥当的内里，明春要开头一场歌会。”她只盯着砚台，不瞧人，“当年歌会取胜的那一首，是我拿米买来的。整十五年了，我未曾向谁吐过半字。”她面色发白，言语却一句比一句齐整，“这一遭我想在众人前认了错，只是执笔之人，我断不能牵扯出来。”小督将毛笔放归笔架：“牵扯出来也无妨，一首两斗，当年的价码，我照认。”屋中霎时静了，两人一齐望向我。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_closer","news"],null]']
src = "blake3:5e2181d7375433432a176a311fe10970b7b7726ef7faf4b407f04ca9115baaa4"
text = "京都宫中秋日歌会之上，大炊御门家的菖败得颇为难堪；会散之后，她身边的侍女提了一盒点心出宫去，却不知是送往何人之手。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_closer","text"],null]']
src = "blake3:e47a268852433dd59a55f1be0a59cc1d1417dcc0d32bc3dc58d7ec01d9eb33a4"
text = "秋日歌会前两日，菖的侍女提了一袋米出宫，叩响上京柿子树下那间小屋的门。次日一早，那袋米原封不动地扛了回来，袋口草绳上系着张纸，上头正是那笔教谁也舍不得烧去的假名：“这一回，请您亲自写罢。”菖将纸摊在灯下坐了一整夜，墨磨干了足足两回。歌会上她念出自己写成的那首，判者念判词时中途顿了两次，满座之人皆垂眼看着手中扇子。散会后她唤来侍女：“出宫送一盒点心去。”侍女问可要附带什么话。“不必附话。”隔了一天，侍女携回一张纸，上头独有一句：“写得不坏。”菖对着那四个字看了又看，仔细夹进了自己的歌书之中。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_landing","news"],null]']
src = "blake3:b9e6b4a08f755776261d58362fd3f3dc0b436825054bff14320441535ed3eb87"
text = "京都重修好的内里开了头一场歌会，上京替人代书的小督亦在席间，居于末座；听闻那张请帖正是菖亲手写的。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_landing","text"],null]']
src = "blake3:707208bc5c96fa16828fb60b99a235361b1a6d84c8b94d1a6df89dfa74a4b7d0"
text = "内里修葺一新，新殿的楹柱犹透着木香，开春便办了头一场歌会。小督接得一张请帖，是菖亲笔所书，字迹端端正正，请她赴席作客；帖末还另添了一行小字：这回不必携笔。小督向邻家借来一件旧袿，坐到末席，请帖平平搁在膝上。轮到菖时，她起身站定，未曾吟歌，先说了一句：“当年那首歌，不是我所作。”满座皆住了声，折扇定在半空。上臈没有笑，只将扇子合起，报出下一首的歌题，吩咐菖后头那位女房先念。菖立了一会儿，坐了下来，今年她的歌直待散会也未轮上吟诵。执笔的是谁，她半个字不曾提起。此后，宫里再无人说起上臈那个位子往后归谁。散席时菖在廊下等她，未去碰小督的衣领，双手安分拢在身前：“米价涨了。往后，一首两升。”小督瞅了她一眼：“两升就两升。先付。”菖自袖底摸出钱来，一连数了两遭。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_meeting","news"],null]']
src = "blake3:71bd9443af2afe70d4cc383ed388065de11612b3b83c5e23265ec3dbb95ccd46"
text = "京都建礼门外，捧着文匣的宫中见习与替人代笔的姑娘迎面错身；一个对着背影躬身行礼，一个却连头也未回，教守门的仕丁瞧得愣在了当场。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_meeting","text"],null]']
src = "blake3:11d53d363e50645c532192006e78abd9902f40000fc75f2bc579fd49eadd0ab8"
text = "结业后的第一个夏天，菖随着一位上臈入了宫，小督则在上京的巷弄里租下一间小屋，替人代笔写信。建礼门畔的土墙塌了半截，姑且拿竹篱草草遮拦着。小督前来给守门仕丁送家书——他娘在近江，他自己不识字。门内恰巧出来一行人，菖捧着上臈的文匣走在队尾，目光触及她便即移开，袖口一丝不乱地走了过去。小督让到竹篱边，面向那背影端端正正行过一礼：“上臈倘若短个代笔的人，到上京的柿子树下寻我便是。”菖脚下一顿，终究未曾回头：“仕丁的家书，该从侧门走。”那仕丁捏着手中家书，看看门里，又看看门外。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_turning","news"],null]']
src = "blake3:053b9688bacd4e84c883ff6d3780517e61e1cf3887a83b1c00de371bed7bc89d"
text = "尾张的织田奉着新将军进驻京都，满城尽是兵卒；上京柿子树下那名替人写平安信的姑娘，门前日日排队直到入夜。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["chapters","tie_new_ayame_kogo:tie_new_ayame_kogo_turning","text"],null]']
src = "blake3:c888ed1dffa00c1b1e8afaea21808f1cf44151f18ba4bf6ced939b0ad846cbc0"
text = "上京米铺门前，街坊议的俱是同一桩事：尾张的织田奉着新将军进了京，满城里遍是兵马。有人道他麾下士卒抢一文钱便要砍脑袋；也有人讲那位织田进宫巡过一遭，见着宫墙坍塌，当即唤人丈量尺码，言明要出资修葺内里。柿子树下那替人代书的姑娘，门前日日排着长队直到天色全暗——兵士要向尾张的老娘报一声安好，京中百姓也要往乡下亲眷处捎去平安。有个兵卒憋了半晌也吐不出字句，末了道：“告诉她，我没死。”她便依言落笔，又额外替他缀了两行京都的天气。大炊御门家的侍女亦来排过一次队，手里未带信件，单替自家姬君传了一句问候：“柿子树下的人，近来可好？”姑娘眼皮也未抬：“烦请替我回禀她，眼下米价翻了一倍，我这字，依然是一封一升。”"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:carry_words","news"],null]']
src = "blake3:b85f3b8ea4e881e068f567a0a2d48762c363b131bd24327322020fb131172262"
text = "京都宫中来了名外乡客，怀揣菖写的门帖拜见上臈，不知开口问了句什么，教上臈拿扇子轻敲掌心笑个不停。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:carry_words","reply"],null]']
src = "blake3:e01bac48352ac2f7d7dde19f016c0a2a123657a946fc016b5f4cc70c39c48d6c"
text = "菖替我写下一张门帖。上臈闻罢我的话，将合拢的折扇往手心里轻叩两下：“我昔年便猜着几分了。那一首写得太好，倒不像是出诸她手。”她遂唤人取过纸笔，写就一句复言递与我：“歌会上认错算不算失礼，端看所认的是何种过错。”其余只字未写。我将这回话带返柿子树下。菖念了一遍，复又念了一遍，袖口压出的那道折痕依旧在。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:carry_words","text"],null]']
src = "blake3:94aab2e6dfc74042be5f90b41dd8a90e20593b1e1da3f7c43b1b8ba1f4e6ecca"
text = "替她们进一趟宫，问问上臈：在歌会上认下旧日一桩错，究竟算不算失礼。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:keep_quiet","hint"],null]']
src = "blake3:5b1b1a7367252e47d600b2154060fb0bc36d4c3acb011a2ab0fb44900e4510e0"
text = "仅当那张草纸仍在我手中时。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:keep_quiet","reply"],null]']
src = "blake3:4ed7ec68275abb782c6e41f14d24e6b983057fba9e4f590e187645257e1cc137"
text = "我答道不会拿出来。菖直起腰身，将袖口那道折痕抚平，一连捋了三遭：“您这一句，我记在心上了。”小督放下手里墨锭，跟着开出价来，说既然我替菖作了这句担保，日后我请她代写的奉书，每封加收半升，权作担保钱。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:keep_quiet","text"],null]']
src = "blake3:8aaecedec45bb3f2dc95013b6356079cd6ed5542e9b57622b565d68adffcdd15"
text = "允她之请：那张草纸，我不拿出来。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:write_together","news"],null]']
src = "blake3:b831e7fb11b9bfe51cbd5e22010ec65aa4cb9a60b18d4f3717fcee3239cdd63d"
text = "京都上京柿子树下那座小屋中，宫里的菖与替人代笔的小督对着一页纸坐至天黑，风闻二人是在合写一首歌。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:write_together","reply"],null]']
src = "blake3:ea4df170a5f284e61262df82435cee36a0d54ad121b8cc2d9c77be5e67b1e0a9"
text = "菖言自己吟不出上句。小督将纸推到她面前：“那就照写‘写不出’。”菖横了她一眼，提笔写下，涂了，重又再写。一炷香燃尽时，纸上终究留下一句，写的是脚手架上新刨出来的木头，闻着恰似春天。小督看了半晌，半个字也没改，提笔续写了下句。落款之际，菖要把小督署在先前，小督不肯从，你推我让半天，末了把两个名字并排落在一行上，写得一般大小。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["choices","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:write_together","text"],null]']
src = "blake3:627f620b6cce982b681605a9f4cc3ea9b91478486ee9bbd4069912f67beb8f6d"
text = "劝她们于歌会上合写一首：菖作上句，小督接下句，将两个名字一并署上。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["defaults","tie_new_ayame_kogo:tie_new_ayame_kogo_choice","news"],null]']
src = "blake3:f9d639e5c51c3349f934a654575688a034245167af61be002cd74ab354d0a095"
text = "京都宫中的菖往上京柿子树下那小屋去了一回，坐了整整一下午；据她的侍女讲，她回宫便检出十数年前的旧米账，在上头补录了一行。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["variants","tie_new_ayame_kogo:tie_new_ayame_kogo_choice:kept_draft","text"],null]']
src = "blake3:cd09c30b4be1f88539845ce7ea80b6bf132bd7f956f2ad43154e5a9a332c8167"
text = "内里的新殿搭着脚手架，木匠的号子越过宫墙，一直落进上京。我往柿子树下去拿托小督写的信，她才封妥，门口的光线一暗，跨进来的是菖。这些年头，她不曾进过这屋子半步。她未看小督，先望着我，依礼跪坐，双手按在膝头，袖口压出一道褶子也未去管。“当年歌会那一首的草纸，是在您手里。”她咬字一句比一句齐整，“明年开春，修好的内里要办头一场歌会，我想当众认下这事。认下之后，那张草纸还请您切莫拿出来。”她伏低身去，额头距席面只差一寸。小督在一旁缓缓研墨，砚中的水添过一回。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["variants","tie_new_ayame_kogo:tie_new_ayame_kogo_landing:cosigned","text"],null]']
src = "blake3:2b1cbf930191938c01b9c63d2bac4783619320f3b7660dda3542c0effd49994a"
text = "内里修葺落成，新殿楹柱犹自透着木香，开春便办起头一场歌会。小督收到一张请帖，由菖亲手书写，字体端端正正，邀她来作席上客；帖末另附一行小字：此番不必带笔。小督问邻舍借了件旧袿，居于末席，请帖平平置于膝前。轮及菖时，她站起身来，未曾吟歌，先说了一句：“当年那首歌，非我所作。”满座皆住了声，折扇凝在半空。上臈没有笑，将扇子合拢，吩咐换人吟下一首。菖却不坐，径自将今年那一首也诵了出来：上句出自她手，下句乃末席那位客人所续，满场独这一首并署了两个名姓。上臈听毕，未置一字判词。打那以后，宫里再无人提起上臈之位往后归谁。散席时菖立在廊下等候，未去触碰小督的衣领：“眼下米价涨了。日后，一首两升。”小督答道：“这一首两个名字，一人一升。”她伸出手，菖便将一升的钱搁进她手里。"

[entries.'["stories/npc/tie_new_ayame_kogo.toml",["variants","tie_new_ayame_kogo:tie_new_ayame_kogo_landing:kept_draft_landing","text"],null]']
src = "blake3:b9887627ea81253636527dc35e951c4ebded50df54c6aa5227d186c2a6986800"
text = "内里整修落成，新殿梁柱犹散发着木香，春天开了头一场歌会。小督接了一张请帖，系菖所写，邀她来席间作客。小督向邻家借来一件旧袿，坐在最末一席。轮到菖时，她起身立定，不曾念歌，先开声道：“当年那首歌，并非我写。”满堂人都愣住了。上臈面上未笑，将扇子一合，道出下一首的歌题，唤排在菖身后的女房先吟。此后，宫中再无人议起上臈那个位子往后归属何人。散会时菖在长廊下等着，双手交握在身前：“米价涨了。往后，一首两升。”小督将那张请帖折好，递回给她：“三升。那张纸在一条家手里头，我这儿卖与您的，总要较卖与旁人贵出一升。”菖原地静立了片刻，从袖中摸出钱来，照着三升的数额点清，一枚接一枚排放在廊板上。"
