[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice","news"],null]']
src = "blake3:3a22a3fbdcf6e453bff4e49b0f5c46712eff3ac034e7257e9354b46087bf3008"
text = "听说京都飞鸟井家的少年要发最后一封回信，却拦下替他执笔的姑娘，偏要自己填上末一句。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice","text"],null]']
src = "blake3:270a0e1a4ae694a846579f5c3ccc0d522718b1ae2bc7066b0ed7506269cf065e"
text = "柿子熟透，门前落了满地。城北那户人家三度登门，话也撂得直白：今番定要个明白准话，再休教人揣测。小督研好墨，摊开长纸：“长歌，三升。这回写得教谁也曲解不得。”她翻出米账，寻到两年前那页，见旁侧录着“我的鞠还没落地”，指尖便点在“还”字上：“那年原该拦住你的。”笔锋刚蘸饱墨汁，忽有只手按住纸角。鞠千代指尖微颤，嗓音亦跟着发抖：“这回……这回末一句由我自己写。”小督执笔悬在半空，望望他，又转眼看门口立着的我。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_landing","news"],null]']
src = "blake3:be3df0d8df70481ae6282a99c863334980915747f405d5856097552a87539cb9"
text = "春日京都鞠会罢后，飞鸟井家的少年立在庭中吟出自作之歌，直待末句落音，满院竟寂然无声。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_landing","text"],null]']
src = "blake3:1a37b59fc30fe45d0f1b3f96fd10d267c4d9432b2855eeb0f924c1e879639d5e"
text = "飞鸟井家的鞠会散了，樱瓣铺了满庭。嫡出的兄长们俱托词咽喉不适，无人肯赋歌压轴，众人目光遂投向廊下那少年。鞠千代起身，把袖口捏出了褶子，缓声吟起自己写的歌，及至末句，声线竟稳住未抖。满庭默了片刻，方有人击掌。他横穿过庭院，径直来到墙隅替飞鸟井家抄录诗稿的小督跟前，搁下一袋米在砚侧：“这是报酬。”小督上手掂量一番，解开袋口瞧了瞧，恰好一升，分量足实。“这首可非我所作。”“是、是谢你指点我删改那五回。”他双颊绯红，一直漫到耳根。小督不再推辞，松开绳口抓起一把细看米色：“是今岁新米。润改另算，下次便向你讨钱。”"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_meeting","news"],null]']
src = "blake3:02d4af4e2578572be766b2e14901da71df096bab415eed071578341a0402ca8f"
text = "京都公家町有媒人登门向飞鸟井家的少年议亲，少年揣着首反复琢磨改定数回的歌作答了过去。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_meeting","text"],null]']
src = "blake3:a4897e4711a649024133eb15ddd9d29bb1679f4c6b8cfddd9a00bb6178e69b0a"
text = "城北有户人家遣媒登飞鸟井家的门求亲，府上只传出一句：着鞠千代自答一歌，明晨当着客面诵出。入夜后，他怀抱一小袋米叩响柿树下的矮屋：“替、替我写吧。”“一升一首，改稿另算。”小督眼皮也不抬，就着灯火写了半个时辰，将折妥的纸推至他面前。他诵及次句，喉间恰似被鞠塞住，连试数次，每每卡在同一处。小督遂自米袋舀出半升退还：“米只买得纸上字句，诵不出口的那半截，我不要钱。你不敢念的地方，自己拿去改。”他蹲踞在门槛上斟酌修改，纸缘都被拇指搓起了毛边。直改至第五回，那句才定作“我的鞠还没落地”。小督颔首：“这回倒像你的口吻了。改稿另计，算你半升。”他把纸铺在膝头，目不转睛盯着门外那株柿树，从首句重诵，这一遭终是念到了结尾。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_turning","news"],null]']
src = "blake3:d78376d3bbf29f646e340bc83fb396292bc3eb4b9a997c25d5908dfa9c6aff21"
text = "飞鸟井家少年那首拒婚的歌，竟教人解作了欲迎还拒；京都的女房们传得活灵活现，俱道他不过腼腆，实则早已首肯。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["chapters","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_turning","text"],null]']
src = "blake3:dcbb4e7ea2c0acdf5a49ad24ef66c4ef25c2fa16e7516f7969d66cff8df6154c"
text = "今夏京都的女房局满口只嚼一桩事：飞鸟井家那首答歌。歌中一句“我的鞠还没落地”，城北那户却会意为“还小，再等两年”，果真老实等了一载，及至今夏实在熬不住，复又央人上门。女房们把话头翻来覆去地咀嚼，硬生生添出一层意思：少年家脸皮薄，口头推说鞠未落地，心底早已稳稳接下。“羞怯之人原都这般措辞，谓之欲迎还拒。”一名女房断得铁板钉钉，旁人竟也无人驳她。鞠场边的人则称，整个盛夏少年未曾踏足蹴鞠，春日踢高的一只鞠尚卡在樱树桠间，始终无人去够。亦有路过墙根的，听得他独自冲墙说道：“我没有答应。”连说了好几遍，高墙自然不曾应声。有人携着这些风言去探柿树下代笔的姑娘，她正俯首研墨：“歌句是他亲手改的，我不过点了个头。”来人复探问究竟收了几许米粮，她报了个数目，比实收的多出半升。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:kogo_writes","news"],null]']
src = "blake3:333f8194e20d8de89bbb2ede05290043d779740347f1d0f246ba087f97859059"
text = "听说京都飞鸟井家那末一封回信写得严丝合缝，谁看了也曲解不得，来人读罢便再未登门。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:kogo_writes","reply"],null]']
src = "blake3:015783a2a9e0d486fd252f7f57614498f2f49792212b7508172160e63fdd341b"
text = "“按旧例来。”小督饱蘸浓墨落笔便写，一气呵成，三升米收得利落干脆。鞠千代的手从纸角滑落，自始至终未曾再抬起。那首长歌字字稳妥，毫无曲解之隙：鞠已落定自家庭院，绝不逾墙，句句皆封死了口子。他将长歌从首至尾诵过一遍，不曾打半个磕绊，气息亦未见丝毫紊乱。吟罢他叠起长纸，眼也不瞧她：“这是你写的歌，并非我的。”小督正捆着米袋，手上打了个死结，随即又拆开重新系起。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:kogo_writes","text"],null]']
src = "blake3:fe24f8b2cb209c26c8752a23da6640284e78ecd1f0069555345a07e112765f97"
text = "请小督照例写就全篇，字句不留破绽。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:own_line","news"],null]']
src = "blake3:4f622baeeee70f149f6f3a4770cd3c0806b8426a4388f4a82224662bebb94ce3"
text = "京都飞鸟井家的最后一封回信已递出，闻说通篇皆出少年之手，唯有一字经旁人改动；对方读明白了，此后再未登门。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:own_line","reply"],null]']
src = "blake3:b56d82129027370a4347c49c54e6272303e14fa96a4e50a442efd1dd9bd08719"
text = "小督望了我一眼，将笔搁回笔架，一并朝鞠千代推去：“笔交还你。我单替你挑错字，挑错不收钱。”鞠千代伏案熬了整夜，十余张废稿揉团堆在门槛旁，临近破晓方誊出份工整洁净的。小督从头阅至末尾，独独在末句改了一笔：原写的是“鞠已落地”，偏那“已”字未曾封口，写成个“己”。她抬手提笔将那缺口补全。“唯独这字错了，余下皆妥。”他凝神盯着那个字，良久才吐出声：“那、那这首……”“归你了。只管诵出去，若再读岔了，便是对方的过错。”"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["choices","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice:own_line","text"],null]']
src = "blake3:8dabc28489af5ec5bcdcf336fc4d354cb29bad98be85a3deb5131e1d23385d4a"
text = "劝小督今番仅校错字，全篇交由鞠千代亲笔写就。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["defaults","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_choice","news"],null]']
src = "blake3:4b806c6f3877ddd3a3c50980efdcd11c0605cfd190f44a36a0d249e1838156f4"
text = "京都飞鸟井家的末一封回信已然送出，闻道末句笔迹歪斜，系少年亲手所添；对方既已领会，便再未上门。"

[entries.'["stories/npc/tie_kikuchiyo_kogo.toml",["variants","tie_kikuchiyo_kogo:tie_kikuchiyo_kogo_landing:ghost","text"],null]']
src = "blake3:5781cc9ac41a881408c010030cc8f386bcfaf4a368e5f6a74d06f133fc141fdc"
text = "飞鸟井家的鞠会散了，樱瓣落了满庭。嫡出兄长皆推托喉嗓不济，鞠千代遂起身，吟诵的是一首新近所作，非去秋那一篇。他念得极缓，直迄末句，嗓音稳稳未曾打颤。小督立在众人最末，把手笼在袖里，一字不落地听罢，当先转身经侧门离去。次日一早，柿树下的门槛搁着一袋米，上头压着张歪斜字条：“一升，足数。谢五回。”树影后头响起一声：“报、报酬。”半颗脑袋探了一探，随即缩回。小督拎起米袋，冲着树身说道：“字写得难看，吟得倒是不差。”那字条末了被她夹进书页里。"
