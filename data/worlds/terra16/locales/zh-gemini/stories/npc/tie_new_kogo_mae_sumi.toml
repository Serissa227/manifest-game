[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice","news"],null]']
src = "blake3:77abd4be996345c94e2ed10cb29f2d8e23de86cfd7d5d20ac8e57bcce6238fd2"
text = "琉球使者要取道萨摩上京，那霸替人写家信的真栄澄也想同行，眼下正四处托人说情。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice","text"],null]']
src = "blake3:659ce673ac10a5ac544e04af08a33c4de4b46059adcf642af8ed5e5c19802d65"
text = "开春后，那霸传开了消息：新王要遣首里天龙寺的僧人取道萨摩上京，去拜见如今在京都执掌天下的关白。真栄澄今年四十八岁，三十年的信摞起来，比她那本名簿还要厚实。使者的随行早早排定了名单，没听说要带一个代笔的女子。她将小督新近寄来的信铺在我眼前，指着落款下那行小字：“上京，一条通往北的小巷，门口有棵柿子树的那一户。”“三十年了，向来都是我立在码头上送人离岸。”她把信纸顺着折痕仔仔细细叠好，“这一回，我想自己登船去。”那本名簿就摊在手边，末一页依然留着空白。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_closer","news"],null]']
src = "blake3:1de1d5bcb32901eb0f77307a75d24e0a2f98224b3ce3b14c97a792a9a09e5d14"
text = "那霸帮人读信的真栄澄，读完一封从堺寄来的报丧信，在回信末尾添上一句自己的话，问写这封信的是谁。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_closer","text"],null]']
src = "blake3:3adcbe5c3bd3ab1eb943146e5d70981d9ea56457da9209704968637557142d2b"
text = "这封信在路上走了将近一年，方才递到那霸一位卖鱼的老妇人手中。老妇人不认得字，请了真栄澄来念。真栄澄读得缓慢，念至“他睡下的时候脸朝着南边，朝着家”时，嗓音一转，往后几行竟改作了低唱。老人听罢，攥紧信纸追问：“写信的，是我儿子的什么人？”真栄澄张口欲言，答不上来：“……我替您问一问。”她代老人执笔回信，老人讲一句，她落笔一句：“他的衣裳别寄回来了，留给船上缺衣裳的人穿。”待老人的话记毕，她另起一行，添了自己的一句：“写这封信的人是谁？”入夜后，她摊开名簿，笔下记了一行：京都的代笔人。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_closer_b","news"],null]']
src = "blake3:cca2c76139f03c5416747574e086a7f8737d70bd1e2b37436f9a62d9170e101c"
text = "在京都宫外替人代笔的小督，这回竟为自己写起歌来，连着写了三宿，写废的纸塞满半只书箱。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_closer_b","text"],null]']
src = "blake3:a4254f40d788d2e7fd0d4f698ab25a3956d4e554daf8bdfab805d4d59b53ef04"
text = "这三年里，往返京都与那霸的信都在替旁人传话，只在末梢各夹一句自己的。这年开春由堺转递来的那一封，破天荒没提旁人的事，只有一首琉歌：“三重城下的晚潮水，日日傍晚往北边涨，涨到石堤就回了头——这封信不回头。”小督代人写了十载的歌，还是头一回有人写给她。她要回一首和歌，耗了三夜工夫，写废的信纸塞满半个书箱。第三夜我来取托她代写的信，书箱口还搭着一张没塞进去的，上头只有“京里没有海”五个字，又被人一笔划去了。小督探手抽回去捋平，压在砚台底下。“这封不收钱，”她把写就的那封封上，“纸钱我自家出，三张，写坏的不算。”"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_landing","news"],null]']
src = "blake3:1c10c95d53efbc64f4d231deea22c667f87bf653f1b7c0f12f7ec38ac5a70de2"
text = "琉球使团留驻京都那些天，有个随员日日往来上京那棵柿子树下，每回归来袖中都掖着一卷字。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_landing","text"],null]']
src = "blake3:792148aa28bba6e753342bfa2b2b6c45c3ffc5f5738a04ff0f4046757a121fcc"
text = "真栄澄顶替了病倒的书记，搭后一条船赶抵京都时，使团只剩最后几日。她照着落款下那一行寻进上京的小巷，柿子树下正立着一个女人。两人隔着三步站定，彼此从未谋过面。真栄澄先开口：“京里没有海，只剩砚里一汪海，今夜也起潮——”小督接得严丝合缝：“那霸港口的晚浪，一路涨到笔尖上。”“回来时，也把故事带回来。”真栄澄笑了，“这回，我亲身带来了。”那几夜里，她们把信上未曾写过的话一宿一宿道尽；到了第三夜，小督在灯下执起她的手，轻吻了她。使团动身回程那日，在淀川码头边，小督塞给她一封信，嘱她登船后再拆。里头只有一行：“下一封，我对着你的脸写。”"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_meeting","news"],null]']
src = "blake3:da703df38111b3602470d5edfbf6007a0a54674398fd242c37ea3e8dbf6bfca2"
text = "堺有个琉球水手发热病故，船东特地从京都请人写报丧信；账房老先生读罢连连抹泪，说信里竟一个“死”字也没见着。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_meeting","text"],null]']
src = "blake3:92570a86ed832fd57f901f431f82da8a335a1886a135f768fcfe6d5572435290"
text = "近来堺的码头上都在传这桩事：一艘琉球船上有个年轻水手发了热，卧床九日，再没起来。船东要给他那霸的老母报丧，提笔才写两行，自己瞧着都嫌丑，便托人从京都请来一位替人写信的姑娘。那姑娘并不急于动笔，先问道：“他躺下的时候，脸朝着哪边？”船东思忖了半晌：“朝南。他说南边暖和。”她又打听水手爱吃什么、走前说过些什么，一问便是大半日，落笔写了一整夜。次日账房老先生替船东念信，念到半途便拿袖口按住了眼角，念完又重头翻看了一遍：“怪了，满篇一个‘死’字也没有。”这信随后便搭上下一班驶往那霸的船走了。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_turning","news"],null]']
src = "blake3:f32a465432062357bba8d04ab89089a7423ae1b454a3c0796be09c51d23fc0ea"
text = "萨摩责难琉球使船失礼，自那霸北上的船就此停航；码头有个替人记家信的女子，每月初一总来打听一回可有京都的来信。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_turning","text"],null]']
src = "blake3:8ea5710b568f4c0d2654898e75981fcca51f3a5496569511ad82edbd1d454659"
text = "那霸码头上都在传言：萨摩那边嫌恶琉球的绫船使者失了礼数，当面数落了一通，北去的航船就此停了下来。停到几时，没人拿得准。替人记家信的那个女人，每逢初一便来码头问上一遭。头一回，管船事的还客客气气：“萨摩的船不来，京都的信也发不上路。”待到第五回，他老远瞧见她便直摇头。她也不恼，自袖里抽出一封旧信，把末了一句念给他听：“潮涨的时候，告诉我。”念罢道：“那我下个月再来。”据邻居讲，她回到家便翻开记信的簿子，在留空的那一栏照旧写上日子。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi_side:side","news"],null]']
src = "blake3:62f9e5ea87994ca57cf82abce48244ef16a4458c9d8613ed3c58b87dfb925bc7"
text = "琉球使团留驻京都那些天，有个随员和替人写信的小督将三十年的旧信铺了满屋，整整核对了三昼夜。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["chapters","tie_new_kogo_mae_sumi_side:side","text"],null]']
src = "blake3:6712a54c70427da719c8dfd10e0b4a778c166241690e5ba7f5f41b6247231e65"
text = "琉球使团留驻京都那些天，真栄澄寻到了上京那棵柿子树下的人家。两人顾不得寒暄，上来便将三十年的信自两只箱笼里倒出来，摊满一屋，依着年份逐封核对。萨摩断船那一年，那一格空着；紧挨着的那年，并排摆了两封。内中一封夹着朵压扁的梯梧花，红得发黑了。“这朵是我寄的？”真栄澄拈起来对着光瞧。“你寄的。我信里说京都没这种花，你下一封便寄了来。”第三日，真栄澄翻开名簿，把“京都的代笔人”那一行划去，在第一页端端正正写上“小督”。临别时她们约妥，往后谁先收到信，谁先把那首歌唱上一遍。“我不会唱。”小督说。“那便念。念不出口的地方，改成唱——我来教你。”"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["choices","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice:carry_letter","reply"],null]']
src = "blake3:37e59e448edfdab0cc477787d9661e1a1ad5892e159d67134f070bda184e4e51"
text = "一月之后我抵达京都，立在那棵柿子树下候到天黑。小督打巷口归来，我将信递过去：“她随使团来。”她没拆封，这手字迹她认了三十年了。她将信贴在胸口，先问我那霸今年的梯梧开过没有，方才说道：“劳您跑这一趟。”随后转身入屋，里里外外扫了一遍，连门槛都擦抹过了。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["choices","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice:carry_letter","text"],null]']
src = "blake3:5c376e30a23bbf10300242898945347ab4d50a42883879a127dadacaa79c837c"
text = "先替她捎一封信到京都，让柿子树下那户人家知道她要来。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["choices","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice:envoy_seat","reply"],null]']
src = "blake3:4ef1f6e74a9b394bf17af5eb1328c6d26fa555853a0a438cef1dfb7c919d75ef"
text = "我替她说了半晌好话，随员只管摆手：“使船上向来没有女人的位子。”真栄澄不曾争辩，只将名簿递上前去。他翻了几页，见哪条船、哪一年、船上有哪些人，一个不漏，手便停住了：“使团眼下正缺一个记得住人名的。”这天傍晚，她的名字添进了随员名单，排在最末一行。她伸指在那一行字迹下划了一道，又划一道，直划到随员把名单收拢回去。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["choices","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice:envoy_seat","text"],null]']
src = "blake3:d1789b8e0c037bc82198603f1cc100b543c692bf363e79f2d8bceedfec879503"
text = "陪她去向使者的随员说情，替她在船上谋个书记的位子。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["defaults","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_choice","news"],null]']
src = "blake3:b78bfbeeae03d676776058da4459ea95dd7da8074382277567c8a9c4d81d6df7"
text = "听说琉球使者的书记临行前病倒了，那霸替人记家信的真栄澄被唤去顶缺，只赶上后一条船北上。"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["variants","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_landing:helped","text"],null]']
src = "blake3:f816fb2df53047c8bb7bb0f24cc1efdfb18cb6de6967d4170e49cfd9efc847d9"
text = "真栄澄是作使团书记来的，在京都住足了一个月。初到首日公事刚完，她便按着落款下那一行寻进上京的小巷，柿子树下正立着一个女人。两人隔着三步站定，彼此从未谋过面。真栄澄先开口：“京里没有海，只剩砚里一汪海，今夜也起潮——”小督接得严丝合缝：“那霸港口的晚浪，一路涨到笔尖上。”“回来时，也把故事带回来。”真栄澄笑了，“这回，我亲身带来了。”那整月里，她们把信上未曾写过的话一宿一宿道尽；到了第三夜，小督在灯下执起她的手，轻吻了她。使团动身回程那日，在淀川码头边，小督塞给她一封信，嘱她登船后再拆。里头只有一行：“下一封，我对着你的脸写。”"

[entries.'["stories/npc/tie_new_kogo_mae_sumi.toml",["variants","tie_new_kogo_mae_sumi:tie_new_kogo_mae_sumi_landing:matched","text"],null]']
src = "blake3:e8efcd31e886bb480d68ed99d6f3f272fd55820c6bbe3bc562ded49dbf229669"
text = "打使团进京那日起，小督便日日守在使团借住的寺门外；家里的屋舍扫过三遍，案上摆着一对杯盏。真栄澄顶了病倒的书记，搭后一条船赶来时，使团只剩最后几日。她刚走到寺门口，门旁便站起一个女人。两人隔着三步站定，彼此从未谋过面。真栄澄先开口：“京里没有海，只剩砚里一汪海，今夜也起潮——”小督接得严丝合缝：“那霸港口的晚浪，一路涨到笔尖上。”“回来时，也把故事带回来。”真栄澄笑了，“这回，我亲身带来了。”那几夜里，她们把信上未曾写过的话一宿一宿道尽；到了第三夜，小督在灯下执起她的手，轻吻了她。使团动身回程那日，在淀川码头边，小督塞给她一封信，嘱她登船后再拆。里头只有一行：“下一封，我对着你的脸写。”"
