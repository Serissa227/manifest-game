[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice","news"],null]']
src = "blake3:3523b49042019600c51afa3a0dca75549bd39270a7427b9c512ff40500123995"
text = "堺的纳屋家姑娘裁好一叠未落一字的信纸，附在新茶里寄往那霸祝女处，说是留给候船人家回话用的。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice","text"],null]']
src = "blake3:ca5315939991a3d728054df3bb983ed4f9803814be104dc43f2ca8317672e645"
text = "那艘船终于有了音讯：开春时撞上大风，给吹回了北面，在奄美的一处小湾里修舵候风，这一躲便是整整一年，好在人都在。北上的船将消息带到堺，顺道捎来那三名那霸人各一句口信。纳屋家的茶室里，新茶早已入罐封妥。小夜跪在席间裁纸，裁出二十余张，一笔未落，专给那三户人家回话用。枫倚着门框，目光只望向巷子口。“她替所有人都收了话，”小夜将最末一张按平，“单单没人替她收。”她这才抬眼看我：“你这一回，去不去那霸？”新茶罐子就搁在她手畔，封口纸还潮着。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_landing","news"],null]']
src = "blake3:725f4759d03e190b635346787052a849d639a442fc53ac3dd5484cc7f42472da"
text = "那霸港卖芭蕉布的摊位前，打堺来的茶家姑娘与祝女为着一条拭碗手巾讲了好半天价钱，摊主最后让了零头，才送走她们。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_landing","text"],null]']
src = "blake3:ec1e1ec4646ee8ec5628d82909f32532e78be47073db4c7ee5173923a356de47"
text = "小夜再度来到那霸，刚进门便听见茶筅作响。真鹤正跪在席间点茶，腕子松了下来，碗面浮着匀净的一层细沫。她拿手巾揩过碗沿，才把茶碗推过来——那条白麻巾子已洗得泛灰，边沿也磨起了毛，正是三年前小夜搭在架上的那一条。“磨成这样了。”小夜伸手要拿去丢掉。真鹤按住不放：“还使得。”小夜将茶饮尽：“那明儿一道去选块新的，这条旧的你留着。”次日在港口的布摊前，小夜一眼相中最细密的那块苎麻，真鹤却从她手中抽走：“用不着拿贵重的。”两人为一条手巾和摊主讲了半晌价，摊主最后抹去零头，催着她们快走。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_meeting","news"],null]']
src = "blake3:c003106f29267db98a39feb89d5a36f5dbe419bddbfcf9ba0f280dc1caf5f4cc"
text = "那霸港边都在传：打堺来的茶家姑娘特地乘船过来，教祝女学点茶。先前祝女把茶当药煎足半个时辰，这回点到第三碗，总算起了沫。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_meeting","text"],null]']
src = "blake3:8cba84d9f117351b7f12ccd24f0ba65e5b66e09647ed05f734040f22816af316"
text = "去年，堺的商船返港时讲，那霸有位祝女替一船人祈过平安。小夜托船给她带去一罐新茶，回信只有三个字：“苦得很。”开春后，小夜自己乘船来了。尚未跨进门便闻见一股药味——灶上的陶罐正咕嘟滚着，真鹤把茶叶当药在煎，说要煎足半个时辰才出味。小夜把罐子端离炉灶，取出茶筅教她点茶。真鹤手腕太僵，头两碗只打出浑水一层，到第三碗才浮起细沫。她盯着那层沫瞧了一阵，一句没夸，起身推开竹窗，海浪正一下一下拍击着礁石：“你的茶室里，可有这份静？”小夜端起碗：“先喝完茶，再讲有没有。”她在那霸住了半个月。动身那天，茶筅留在真鹤的架上，拭碗的白麻手巾也搭在一旁。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_turning","news"],null]']
src = "blake3:22409ed9576d90ab1f0ce6d825364d50906481822c19dd4c1cb66244e110fa42"
text = "堺的码头一带都在传，开春发往那霸的那艘船入秋了还不见船影；那霸祝女代船上水手们的家眷把话攒齐，托船捎到了堺。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["chapters","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_turning","text"],null]']
src = "blake3:d52e58e20b237c3eca9cd795c84a4d8f6cd63cd7f4c2e09b5b107968c8c75bab"
text = "入秋之后，堺的码头常有人打探：开春去那霸的那条船，怎么迟迟没了音讯？它赶在末一阵北风出的港，算算程期早该到了，那霸那边却说连个帆影也没瞧见。船上有纳屋家托带的茶，还有三名在堺船上跑了好些年的那霸水手。打那霸回来的船家讲，那里的祝女近来挨家挨户地走动，水手的老母说一句、媳妇说一句，她跟着记一句，全按原话录下。“收齐了一并寄走，”她道，“船要是先一步回堺，话就先搁在那儿等着。”立冬前，纳屋家的伙计在茶屋漏了口风：小姐收着那霸来的信了，三家人的话写得工工整整。小姐连看了两回，只道：“她自己的话，却半个字也没写。”"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["choices","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice:carry_tea","news"],null]']
src = "blake3:bf78f026d257865698e6f2fcd3572bbef694a9bb8d58b215e6d6f7b4d85346c3"
text = "那霸的祝女收下了堺捎来的新茶与一叠信纸，是一位顺道的船长送上门来的；当日午后，三户候船的人家都拿到了纸。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["choices","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice:carry_tea","reply"],null]']
src = "blake3:85bb9dbdc860ac0e36dd0c7d00d89e6469546cbf746a18e6f47e90fcfceb4197"
text = "抵达那霸那日，真鹤坐在屋檐下，膝头摊放着几条折到一半的手巾。她先揭开茶罐嗅了嗅，方才去翻那叠信纸。最顶上一张带着字，是小夜的手迹：“这一张是你自己的。”真鹤拈起那页纸，迎着檐外的光亮照了照，再折成小小一方，放回茶罐里头，仅朝我道：“代我告诉她，这罐我不煮。”余下的纸，她当天下午便挨户送了出去。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["choices","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice:carry_tea","text"],null]']
src = "blake3:ec558995f7bcc6e2496ad768a105f79713837c797fdf7e478577058ef232e4d0"
text = "我这回正要去那霸，茶与信纸交由我带吧。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["choices","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice:wait_for_letter","reply"],null]']
src = "blake3:c58d0d230ecf5f200bbc0f8990592413ea8493380a849b2a4671ebf16ec103bf"
text = "小夜为我点了一碗茶，这才提起笔。写完一张，揉成团；重写一张，又揉了。直等到我手里那碗见底，第三张总算落成，只写了短短一句：“下回你来堺时，我替你看一回门。”门框那边，枫低声笑了一笑。小夜头都不回：“笑什么，你又不懂茶。”说罢便把那页纸叠好，别到了茶罐封口上。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["choices","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice:wait_for_letter","text"],null]']
src = "blake3:4f12527617f5e1ccb69073daa8f7ea1bd0e1bdee21932ece0df4fc3c04161475"
text = "先讨一碗茶，坐着等她给真鹤落上一句。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["defaults","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_choice","news"],null]']
src = "blake3:ea89d459d23ee41aeb90890add200c046c3876ae29d90134084422169b72e616"
text = "堺的纳屋家姑娘封妥一罐新茶，夹上一叠无字信纸，托下趟商船带去那霸，海路上又耽延了一月，才交到祝女手中。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["variants","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_landing:helped","text"],null]']
src = "blake3:0522eb04451d5f4ba41a5895c27b68c4d873aaaebede8f76dea680d5fd7120d1"
text = "小夜再度来到那霸。真鹤点出一碗茶推过来，这一回起了沫；拭抹碗边使的依旧是三年前小夜留下的那条白麻手巾，边上早已磨出了毛。小夜伸手要去丢掉，真鹤按住不放：“还使得。”她又打茶罐底下抽出一页折得方方的纸，正是去年那叠信纸顶头的那一张，如今上头写着一行字：“想要一罐煮起来也不苦的茶，自己喝。”小夜盯住那行字：“那是番茶，算不上茶。”静了片晌又道：“下回替你带来。”次日两人去港边布摊挑选新手巾，旧的那条真鹤留了下来。小夜一眼相中最细的苎麻，真鹤说用不着拿贵重物件，她们和摊主讲了半晌价钱。"

[entries.'["stories/npc/tie_extra_04_naya_sayo_matsuru.toml",["variants","tie_extra_04_naya_sayo_matsuru:tie_extra_04_naya_sayo_matsuru_landing:letter","text"],null]']
src = "blake3:b43c355a106e573446b22d32568f6021343ff8df470757c4a5d2c7b359ddacd4"
text = "小夜又一次来到那霸，尚未跨进门，真鹤便朝门槛一指：“你信里说替我看一回门。堺我是去不成了，就看这一扇吧。”小夜在门槛上坐了一个时辰，打发走两个前来打听船期的人，屋里的茶筅方才停声。那碗茶起了沫；擦碗使的仍是三年前小夜留下的白麻手巾，边上早已磨出了毛。“用成这样了。”小夜拿起来要丢掉。真鹤按住：“还使得。”小夜说：“那明儿一起去选条新的，这条旧的你留着。”次日在港边的布摊前，真鹤把小夜选出的那块细苎麻搁了回去：“用不着拿贵的东西。”两人为一条手巾和摊主讲了半天价钱。"
