[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice","news"],null]']
src = "blake3:7bb903e9d8dbd7333a0172a2a6f4a7d1e220936cdf4ff5bdf5b331a1ace8a103"
text = "在京都快结业的那几日，两个姑娘捧着个空信封反复商议，直到最后，封皮上还是半个字也没落。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice","text"],null]']
src = "blake3:e24c61b2fb451628808008bc7b1c183c4cff33a59900ed1019d5d5a57bc3f6f1"
text = "结业前夕，廊下摆满了各人的行装：汐备了一口勒紧麻绳的木箱，雪则是包袱皮裹就的三叠歌稿。她俩一并寻来，雪捏着个素净信封，封皮上空空如也。信封里装着这一年来两人手抄的歌，你一首我一首地隔行排开，汐抄的那半边，越写到后头笔势越沉稳。“往后她寄来的信，”雪先开了腔，目光却垂在信封上，“都要烦你转递么？”汐扭头望向庭院里的松树，不看她：“船上无人识得冷泉家的门第。”“那便教她识得。”雪的言辞比平日还要疏淡三分，客气里透着股不知朝谁发的闷气。汐的脚尖在长廊木板上轻点，一块、两块、三块，仿若在点数甲板。信封递到了我跟前，她俩霎时都静下来，只候着我发话。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_closer","news"],null]']
src = "blake3:bf07c61b0a7cc728576f640a37ee652d44e9d5d9ae5188cde3a871d2218d64ce"
text = "七夕当夜，有人在鸭川见着一叶小舟，船尾掌篙的是宫中侍女，舟中坐着冷泉家的千金，一路划到出町河岸，全程无人作声。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_closer","text"],null]']
src = "blake3:eaee43ce0ad684d885c4f8e2e637a32ce280b0981947d553490d37deff31d5b8"
text = "七夕的流之座散席了。冷泉雪自袖中掏出一方折纸，一言不发地塞入汐掌心。汐展开一瞥，上头是一首歌，吟咏着退潮后船只搁浅沙洲、静候下回涨潮般的守望——那正是汐心中百转千回、却半字也吐不出的话。她将纸重新叠好，奔至鸭川岸畔，向渔户借了条平底川舟，竹篙朝岸边一点：“上船吧，我渡你回去。”雪拎起衣裾登舟，船体随之一倾。汐急忙揽住她的臂膀：“此舟底平，稍晃便要偏斜，你站到船心去，双足立开，莫攀船舷，一攀反倒倾得厉害。”雪垂首，瞥见搀住自己的那只手，指节缝里还积着未洗净的残墨，新痕覆着旧迹。她未曾多问。沿途唯有竹篙入水的轻响。及至出町河畔，汐将那方歌纸折作拇指大小的方块，既未归还，也不曾道谢，只道今夜鸭川的水位比昨日浅了半尺。雪踏上河岸，忽又回首：“念不出便莫念，我知晓写的是什么。”汐长篙撑岸，小舟悄然退入河心。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_epilogue","news"],null]']
src = "blake3:60e71dc0b9953c212c9f7527300ea256216088544af00f986d3edd85293a5c35"
text = "据能岛的船户讲，这几年经岛交钱的船只，十艘中总有一艘为京都带信，受书的是冷泉家，寄书的是村上家的女船头。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_epilogue","text"],null]']
src = "blake3:ee7e81e950e567e74b575986c77a3bfaa4c213a1d418837e110b62cabf278006"
text = "村上家的千金归了能岛，置下自家的船只，船艏高悬着村上家的过所旗。跑内海的船客都传，近几年在能岛缴过帆别钱，钱财点清后，岛民总不忘加问一句：可是要去京都？若去，便顺道多捎一封书信启程，那帆别钱仍是分毫不减地照收。十艘过往的船里，少说也有一艘曾为京都带信。至于京都那边，冷泉家的门公现下隔着半条长街便能辨出能岛的旗号，不待船家搭腔，早早便伸手过来取信。另有人言道，村上家的女船头每逢深秋必亲赴京都一回，返航时船舱便多出一卷新抄的歌集，裹足三层油纸，严严实实压在罗盘木匣下方，任谁也不许沾手。曾有个初来乍到的水手不知忌讳，探手去碰，当即被她一句喝退：“那是我的海图。”"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_meeting","news"],null]']
src = "blake3:99c8109a2fffa07a43a1fa50d14a743fff9fea06b1a79e7628c71825f995a54f"
text = "京都宫中盛传，冷泉家的小姐润改了一名侍女的歌，那侍女当面便划了回去，二人寸步不让，满堂女房瞧了整整一下午热闹。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_meeting","text"],null]']
src = "blake3:f136400e010976861629c2834cf395d04b69353a15ba7b034e342d4f9bc9d741"
text = "月终将设歌合，女房们先在私局里习练，出题为“春夜”。汐跪坐最末一席，轮到她时，也题了一首：夜里退潮，船底一寸寸搁上沙面。几位年长女房传阅罢，笑言：“海边人家的字，生得像缆绳打的结。”冷泉雪接过审视片刻：“侍女倒也能作歌。”话音尚在耳畔，她已提笔挥毫——将“潮”改作“松风”，“沙”易作“苔”，“船底”换作“衣袖”，海边的歌谣转眼成了宫廷的吟咏。末了她顺手勾去最后一字：“少去一字更佳。”汐取回纸笺，当着她面，将那三处逐道涂销，在旁复写己字：“你可曾听过夜里退潮？”一屋人正等着冷泉家的小姐发难。雪以指尖轻点那三道墨杠，一痕一痕指过，将毛笔放回砚台边：“划得好。下回休教我改得动。”我在帘后看得明白，汐重写了那三处，偏是那被勾销的末字，没再补上。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_together","news"],null]']
src = "blake3:ccf2a9066fba9d34cac0d12bb29e00fe439eed714d5a6e28cda5e496f29fe47d"
text = "京都歌道人家的千金抵了土佐下田港，村上家的女儿日日撑船迎候，港边人常道她俩在舱内对着一摞旧函，灯火直点到半夜。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_together","text"],null]']
src = "blake3:cb9e8251d62794de81a741cf30b6503d4eb2677e2fb83509a3f98d724f319275"
text = "冷泉家南下中村授歌，歌会乘的船停泊于四万十川口。汐驾船已在下田港守候三日。雪登舟后，在舱板上铺开一只油纸裹：里头整整齐齐码着两年间汐寄出的全部书信，依时日排序，字迹一通更胜一通沉稳；最末压着一沓愈发陈旧的，竟是昔年在宫中汐写废投入纸篓的残笺，每张都抚得平平整整，半分不缺。汐拈起垫底那张歪斜废纸，指节陡然收紧：“这等东西你也拾？”“《兰亭》里亦涂抹过好几笔，世人还不是视作珍宝。”雪应道，“况且纸质极佳。”她翻出其中一函，点着封皮上“请人转交”四字：“往后莫再题这句。直书我的名讳。”汐拨亮灯火，展平新笺，落笔写下个“雪”字。初笔过巨，次笔晕墨，及至第三字方才方正。她仍待续写，雪却覆手按住她执笔之手。灯花啪地炸开一星轻响，雪不曾撒手，另只手顺势抽出那张写偏的“雪”字，压入了油纸裹最底层。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_turning","news"],null]']
src = "blake3:0b08823ad3f00788515be3ff15fd505c2372144d6392c57c7239341ac33959ab"
text = "严岛战事的风声递进京都，宫内有人讥笑村上家的侍女，冷泉家的小姐当堂吟诵了一首濑户内海的古歌，生生将讥笑压歇下去。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_turning","text"],null]']
src = "blake3:add386242eb2d4c522e4540f0132cf5099d9ffdccc50f3c24058da69d38e8447"
text = "十月间西方传来战报：毛利氏于严岛大败陶晴贤，传闻为毛利扼守海道的，正是能岛村上家的舟师。消息流入宫闱，女房们方才恍然——平日步履沉重、带着浓重濑户内乡音的那名侍女，原是村上家的血脉。“海贼家的丫头”自此从背地议论化作当面挑衅，听说竟有人在回廊堵住她去路，追问她家中近来屠戮了几许性命。她不予理会，径直折身离去。次日歌席之上，冷泉家的千金未候点名便霍然起身，高吟一曲咏叹濑户内海的古歌，来历逐句交代得分明：《万叶集》卷十五，乃遣新罗使船队航经彼处海域时所咏。歌罢，她环视满堂问道：“此片海域，眼下究竟是谁家的船在看守？”四座皆哑然无声。值夜的老女官后来道，是夜她亲见村上家的侍女伏于廊下修书家信，冷泉家的千金便伴坐侧畔磨墨，直研得砚池墨汁浓稠欲凝。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki_side:pair_ushio_reizei_yuki_side_landing","news"],null]']
src = "blake3:47d5fa545d6d5a8fbf7ad96dedce1b77020420885e29bf99720cd24b4cdccdb8"
text = "冷泉家新辑的歌册收录了首咏退潮的歌，落款写着土佐的汐，正并列于冷泉雪的歌旁，京都众歌人皆道实乃破天荒头一遭。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["chapters","pair_ushio_reizei_yuki_side:pair_ushio_reizei_yuki_side_landing","text"],null]']
src = "blake3:6c6f861cfb256d351780ef20a2bbe7ab691580d04ff09ca7f728658679f2645b"
text = "汐押运一船土佐的鲣节进京，交割完毕，便顺道拐去了冷泉家。雪恰在廊下阴干新誊的歌册，墨汁尚未透干，散页一叠叠铺展竹席之上，押着镇纸。汐蹲下身端详，翻至中页骤然止步：里头竟有首写夜里退潮的歌，落款“土佐的汐”，紧贴着雪本人的那一首，齐齐并列。冷泉家的歌册里，向来不曾收过侍女出身者的作。“字生得太丑，”汐言道，“你抄录之际怎不顺手替我改改？”“改完，你又该划回去了。”雪挪动镇纸一寸，“再丑也是你的。”汐没搭话，在竹席旁坐下，掏出一张满是褶皱的纸片：“船上写就的，你过过目。”雪只瞥了一行便皱眉，举笔待改，立时被汐伸手按住。两人就这般伏在廊下对磨了一下午的歌，谁也不曾让步，待天色入暮，竹席上又多出三页划满墨杠的草纸。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:carry","news"],null]']
src = "blake3:1f76b0e3e048f60a0686af1bd9fd2c7aafbe87ec46ee3cda494ace6c9ac80f52"
text = "京都宫中散学前夕，两个姑娘托人往后替她们递信，信封收信人之下缀了个小小的“转”字，旁侧还描了一道波浪。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:carry","reply"],null]']
src = "blake3:4c6e395c341dfea45bee7c2a10266f64a2b0968fe639133a9852d703f05b72e3"
text = "我伸手接过信封。雪却又探手讨了回去，濡墨在封皮上落了收信人，写的是我的姓名，底下添了个蝇头小的“转”字，须得凑近才能瞧清。汐俯身看了许久，拈起笔，紧挨着那“转”字画了一道浪，笔画歪扭，浪尖卷得高高的。雪瞅着那道浪：“多此一举。”口头虽这么抱怨，拿笔的手却未去涂抹。合抄的歌是一首挨着一首；眼下她俩的笔锋，也双双凑到了这枚“转”字跟前。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:carry","text"],null]']
src = "blake3:8a7a44b207337bb05c77bda7c6427554ea8f83b1cbc0d12fcfeff7760c3b6df6"
text = "接下信封：日后她俩的书信，由我转递。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:own_address","news"],null]']
src = "blake3:adcd96f4b256eea4bc9657ebd52a9cbe96253820b62ed72c5a660a793b39f01e"
text = "临近京都宫中散学，一名侍女于信封正面题下土佐中村，冷泉家的千金则在反面落了自家门第，写罢还教侍女照着重描了一遭。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:own_address","reply"],null]']
src = "blake3:31f001eed03e93a133f1eb41cac8a085f5c8194e15acddfb6e743c24e2a75820"
text = "雪微怔片刻，似未料到还能如此。汐先接过笔，写下“土佐中村”，笔画比寻常大出一圈，墨亦蘸得太浓。雪随即将信封翻面，于背面题上冷泉家的门第，写罢将笔交还汐手中：“这‘冷泉’二字，劳烦你再重描一遍。日后这两个字，少不得要写上好些回呢。”汐描得极慢，待她停笔，雪细细瞧过，一笔未改。汐把信封贴在衣襟上抚平两下，这才转身去捆扎她的木箱。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:own_address","text"],null]']
src = "blake3:9f3e1dbdf2f7fe901834a97d7fef72cedf4f767dcb89ee448277f63363dc5bcc"
text = "将信封推还她们，让二人各自题上彼此的住址。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:say_nothing","reply"],null]']
src = "blake3:72c7951d4674a206ab0618782413d101f98a97f9ae06f0ed5c6fb5af0c72babf"
text = "我将那沓歌稿理齐，妥善收进箱中，只字未提信封。雪望向汐，汐的目光却仍粘在院里的松树上。少顷，雪把空信封自正中撕作两半，一半递予汐，余下一半纳入自己袖口：“收好。哪日盘算清楚写些什么，再来拼在一处。”汐捏着那半边信封翻过来瞧，背面上写着冷泉家门前那条街的名目，她将其压进了木箱的麻绳底下。动身那天，那只木箱顶上便卡着半截信封，一直伴到了土佐。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["choices","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:say_nothing","text"],null]']
src = "blake3:a3e65b53fcf0f9e72cd20b23db24eaa456bb87ed1c2bf02902679c0963ca4eae"
text = "一言不发，单将那沓合抄的歌稿收起。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["defaults","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice","news"],null]']
src = "blake3:a498a25b7168d5a59c09f73c2781049f837effbe39933e89840c1a8e53396a1b"
text = "京都宫内散学当日，村上家的侍女怀揣一只空信封返归土佐，封皮上究系落谁的名讳，据闻她登了船都未曾拿定主意。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["variants","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:v_ushio_first","text"],null]']
src = "blake3:f08487f6fb2236bc791724f9622c8d66f415e641917b55405a8469229b84a890"
text = "结业前日，长廊摆满了行囊：汐备的是口箍着麻绳的木箱，雪则是包袱皮裹就的三叠歌稿。二人结伴寻来，雪掌中攥着一只素白信封，封皮半字未着。里头装了这一载二人合抄的歌谣，汐一首、雪一首地隔行排开，汐手抄的那半边，愈往后笔力愈显稳健。不等雪吐露只言片语，汐已先一步将木箱拽到足旁。她曾撞见过雪唤我“中君”，就在回廊转角，隔了扇纸门听得真切。她将木箱上的麻绳狠狠勒紧，系了道死结，复又补上一道。雪捏着信封立在当场，周身客套得宛若在同谁赌气。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["variants","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_choice:v_yuki_first","text"],null]']
src = "blake3:0bda6ed450fe95cf6593dba0b5bc69cff72dfd00176f1f32e8ad490c27cf059f"
text = "结业将至，廊下摊了一地行装：汐是那只勒着麻绳的木箱，雪是三叠以包袱皮缚妥的歌稿。二人同行过来找我，雪手里持着只信封，封皮光秃秃一字无有。内里盛着这一载她俩合抄的歌，汐一首、雪一首地交替往下排。雪的眼波在汐腕际停驻了须臾，那处绕着一缕红白发绳，绳尾已然起了毛。她将信封置于我面前，封皮收信人一处空空荡荡。她提了笔，复又搁落，径直转过身去，面朝院中那棵苍松。汐端详着她的背影，又看向我，脚尖在木廊上一下一下轻点，像极了数算船板。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["variants","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_together:v1_matched","text"],null]']
src = "blake3:23edc9fb60623527062576ba890673555110e332eec0553f89cc37a50de79d5a"
text = "冷泉家南赴中村传授歌道，载着歌会众人的船泊在四万十川口。汐驾船在下田港苦候了三日。雪踏上甲板，在舱底摊开一方油纸裹：两年来汐寄出的每通书函，皆按时日码放齐整，封皮上清一色签着那位代转之人的名姓，底下缀着个小巧的“转”字，旁侧还有一道歪斜的波浪；最末垫着一摞愈见泛旧的，是当年在宫中汐写废丢入字篓的草纸，每张都抚得服服帖帖。汐一把按住那沓废笺：“连这等纸头你也拾回来？”“《兰亭》卷上尚且有数处涂抹呢，后世照样奉为至宝。况乎这纸本是好纸。”雪抽起一只描着波浪的信封：“劳人转递了两年，合该向人家道明了。往后便直书我的名字。”汐拨亮灯芯，落笔写下个“雪”字，初笔嫌大，次笔化墨，及至第三字方才周正。她犹欲续写，雪忽而覆手攥紧她执笔的手腕，案头灯花啪地又爆开了一星。"

[entries.'["stories/npc/pair_ushio_reizei_yuki.toml",["variants","pair_ushio_reizei_yuki:pair_ushio_reizei_yuki_together:v2_helped","text"],null]']
src = "blake3:95b329f8156a2bd89e3d27a679ca3cdbbb94bda973be5ba605fd0c0835bea5cc"
text = "冷泉家南下中村授歌，歌会的船在四万十川口系缆靠岸。汐的船在下田港足足等了三日。雪登上船来，于舱板间摊开一个油纸包：两年间汐寄来的每封书信，都依日子叠在一处。封皮上冷泉家的门第，打头一封起便是汐亲笔所题，首封的字体大到占尽半张信封，嗣后一封收敛过一封，及至最近数函，已与雪的字迹一般大小。最底层那摞更旧，竟是宫中那几年汐写残弃入废篓的字纸，全数被一一捋平。汐忙不迭按住那叠残纸：“这些废纸你也收？”“《兰亭》上尚涂了好多处呢，后人不也当珍宝。何况纸是好纸。”雪指点着封皮上的门第：“门写对了，名字却还没写过。写我的名字。”汐挑明灯盏，提笔书写“雪”字，至第三个方才周正。她犹待下笔，雪伸手握住她执管的手，将头轻轻靠在了她肩头。"
