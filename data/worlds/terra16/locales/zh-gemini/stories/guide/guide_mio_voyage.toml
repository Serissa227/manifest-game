generator = "gemini-4-hydrogen"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v01_sell_grain","hint"],null]']
src = "blake3:97c02954faba605b31eac87c73dfa6b009b3c94676ce072de6be6a42e245789f"
text = "到下田交易所将舱内的谷和盐卖出，腾出五格舱位。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v01_sell_grain","text"],null]']
src = "blake3:8a075821be4ebfadedeb7aaeb87c21c53c83bb5fc11bfe085a4ace305d773dcf"
text = "米铺伙计拎过谷袋掂量一番，说这是去年的谷。“去年的，共三袋，十一文一袋合三十三。您若嫌陈，三十也罢。”他嘴上说着，手里还在翻找秤砣。盐他不收，指我去旁边的鱼铺。鱼铺老板娘正剖着鲣鱼，两手都是血，拿胳膊肘把秤推到我跟前。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v02_dismiss","hint"],null]']
src = "blake3:433caef0fa809a2ce8db4bd848887e7acaa8b17517a63cc90b09d40ce9d25e85"
text = "凑够十二人，一条小早便驶得动。上酒馆辞退几个水手，每人每日能省工钱二；只是人手紧了，出海容易累。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v02_dismiss","text"],null]']
src = "blake3:fda5f79bfc58a87fb5cdfdd30d168ab61673d3d79d7cb00d346c7aac74a82652"
text = "我将名册铺在舱口，从末行倒着往上念。有人说他娘在清水，趁此正好归家；有人不肯走，讲开春的鲣鱼船尚未招人。我多给过去十文，他点清之后退回四文，道是多了。阿权蹲在一旁数那些离开的人留下的草鞋，反复点过几遭，总多出一只。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v03_contract","hint"],null]']
src = "blake3:806036ad623f36d5c9a0fb8d7e2c4d6e37c2b6e06ee22e5efb7e37cdf4de165d"
text = "出海次日起，下田商会便会张贴一条家的小单，交货港设在下田或清水。留意件数、起运地及期限，再接下。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v03_contract","text"],null]']
src = "blake3:6fc22706ae42861382710030746b7193b2474dfd4dc3a863711aa94192b42b76"
text = "单子用浆糊粘在板壁上，一条家那一张贴在最末，我只得蹲身去看。上头列着货名、件数、起运地和交货日，最底下一行是罚金，字写得顶大。伙计站在我身后劝道，接了便别反悔，一条家的单子，罚的也是一条家的钱。“那不正是罚我。”他挠了挠头，道声也对。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v04_deliver","hint"],null]']
src = "blake3:89b9ec6021100adcd1042de95964e49711c1d043b66f0b2d3fd853a55560f332"
text = "按单上写的起运地采买货物。若舱位不足，便在交货港租下一格仓，分批运去存好，凑足数再从仓中交付。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v04_deliver","text"],null]']
src = "blake3:c4711aa4a12deeeeb004ec239a57e1f3eb6975cb394a33bf3bb4b4f976c76c57"
text = "一趟载不完。我在交货的港租下半间仓，船往返跑了几趟，每卸完一回，阿权就在仓门上划一道炭。凑够件数那天，伙计过来点货，从头查点到尾，点罢回过头，望了望仓门上那几道炭。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v05_inn","hint"],null]']
src = "blake3:987ca125b57899588f7de765cec0c6c4bf7bd96d4989ae034b94f5e7b6568db7"
text = "堺那边的船主1月7日方抵下田，先在下田旅店歇到那日。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v05_inn","text"],null]']
src = "blake3:af1595eb0dadfb51dde941551d40b1b53b8d93379f03b3fec591a5354e494416"
text = "旅店老板娘每日清晨都要问上一句：“还不走？”到了第三天，她不再发问，径自把房里的炭盆换成了大号，账自然也照大盆记。我拦说小盆便够。“姬君是在等人罢，等人的房里可冷不得。”初七清早，河口处传来喊声，一艘吃水颇深的堺船正于栈桥外落帆。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v06_to_sakai","hint"],null]']
src = "blake3:a6c1d56dcb8f8941875f8c520a64659dd4e197703ee9f70dd4d4de8ad9690e43"
text = "堺地紧缺木材，采买几根捎去。在海图上拟好前往堺的航线，出河口那一程由自己掌舵。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v06_to_sakai","text"],null]']
src = "blake3:bf60561106cf7d08799769837a35bd934d34ad7f2dbe379463cd061aeeea6455"
text = "木材行的宫地老板只论根卖。“姬君这船能装几根？”“九根，横着码。舱口处那根得锯去一掌，锯下来的那一截您算钱么？”他吩咐伙计抬了九根至栈桥，锯掉的那截也一并送来。出河口时，沙洲那道白线最难闯。我自个儿扳着舵，舵手在旁高声报水深，报至五尺便闭紧了嘴。越过足摺，室户岬是在第三日望见的。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v07_sell_timber","hint"],null]']
src = "blake3:815c13f63d2b375eafa7e2db4248b60936cbb00202d8a33f870b2b1d4174485f"
text = "把下田带来的木材在堺的交易所脱手。堺缺木料，价钱比下田高。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v07_sell_timber","text"],null]']
src = "blake3:fda9bd8436670066d41ae7d0fed9fbf5dc91db84d73a841f3728d14e91cd356a"
text = "堺的木材牙人将杉木一根根敲过去，嫌下田木料潮气重。“那您便依下田的价收罢。”他拿烟管在木头上磕了磕，到底还是按堺的价钱结账。我翻开船账一算，这九根挣的钱，恰好顶上十二人两日的工钱。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v08_supply","hint"],null]']
src = "blake3:c578f5df2129aee0242abea5a9f551543ee121e7748a63ca824866a081825bcd"
text = "在堺添够粮水，随后到船况页将常设命令改作合用的吩咐。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v08_supply","text"],null]']
src = "blake3:99e88198f69446fd557fc4d6b3e4d5b9abb228726af1f5bb6fefb329b262d079"
text = "阿权掌管粮袋，每添补一趟总要叨念：“米三斗，水两桶，盐可莫漏。”常设命令里本写的是见风即收帆，我改作遇大风方收帆。阿权扫了一眼，道：“姬君好大的胆子。”说着又将备用的帆索多绕绑了一圈。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v09_tavern","hint"],null]']
src = "blake3:5dca044948036cd6a4b53457dffea9362fd1d87c170b70902acf71a97f16faa3"
text = "去堺的酒馆坐片刻，将告示上新出的消息过一遍。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v09_tavern","text"],null]']
src = "blake3:dc08eedd43817c37c54c0d0e3ab10ae3b0def3f7ce16d56271d28537c0e1ffe7"
text = "馆中挤满了候船的客，板壁告示叠着贴了一层又一层，顶上那张连浆糊都未干透。柜台里头的人正同酒客讲，毛利家的兵马已踏进周防。那客问周防在何处，答说紧挨着长门。有个纪伊来的水手凑近问我船上可缺帮手，我只说待过了五月再来寻我。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v10_naruto","hint"],null]']
src = "blake3:9002e08b3dff5263fb24a64d153a72f9fd0884a68045cad7f65b86bedcc8cebc"
text = "来时可见着鸣门的漩涡？若有，去堺的探险页呈报；未曾见过，便往淡路岛西侧走一遭。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v10_naruto","text"],null]']
src = "blake3:955c215ce818b7a6f9c1a21cb06d0e3ea76fa0f7ff272ba300e86d44305ac2bc"
text = "会所书役依我所言逐一录进簿册：何时、何地、涨潮抑或落潮。记到漩涡大小，他抬眼望我。我伸开双臂比画了一下，补上一句，比堺的钱箱还大些。他果真照实落笔：“比钱箱大”。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v11_sayo","hint"],null]']
src = "blake3:e56450f457f842e367430e7fa30fbcf5fa407c4a29f6ea226cf5390e0a6aacd7"
text = "纳屋小夜就在堺的市场。多去同她攀谈，赠她一件手工小物；待好感满六十，便邀她上船作交易员。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v11_sayo","text"],null]']
src = "blake3:45c44874499a034be0dabdf035f37bde485fd3b99ea8391f752e9bc596deb8aa"
text = "小夜初见我时，先点了一碗茶。茶还未饮罢，她便问我船上一月的米钱。我随口报出数目，她摇摇头：“这数目养得起十八个人，您船上如今只剩十二个。”及至第六回去，她照旧先将茶喝干。“想请我上船，船账便归我管。日后您动钱之前，须得先通个气。”“旗钱由我自己收。”她拨转茶碗半圈：“旗钱您留着收，记入我的账上便是。”"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v12_report","hint"],null]']
src = "blake3:69ea6cf70889084077b32e3ecad26b4196edf8e9ab74468ed870235baccd8be1"
text = "去堺的交易所购一份行情通报，底价一百，每添一港加四十。之后往行情推算页瞧上一眼。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v12_report","text"],null]']
src = "blake3:cef1e95e1c8bf346d3f2d30f1ad26410f001517d9670b5e08cbfc662131e1d2b"
text = "所谓通报不过几张抄纸，一港占一页，抬头注着何日、由哪艘船捎来。博多那一页竟是半月前的旧价。我嘀咕着半月前的行市顶何用。小夜却将平户那页折起一角，径直拿去问账台里的人，下一班回平户的船几时开。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v13_shop","hint"],null]']
src = "blake3:26baca2ba014b8ba7655ed4a98cb09358c9ca9ebb4d4be4baf0317817e182b89"
text = "去堺的道具店：置办一件可穿戴之物穿上，挑一样能用的物什使掉，再购一本读得懂的书留着船上读。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v13_shop","text"],null]']
src = "blake3:d88935b6c977e445bc5170d2b63f0a97314f58d40e4e772002b99564e7e5e859"
text = "店家取出一件南蛮样子的短褂，称是葡萄牙船客典当于此的，袖口偏短一截。我套上身试着扬了扬胳膊，不碍着拉缆绳，当即买下。书则拣了本讲潮汐的，店主说这册子堆了两年无人问津，价钱好商量。我问能减几分，他回说让一成。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v14_invest","hint"],null]']
src = "blake3:2aa0d6c46b03cca6b86a10bc0509538c91e89c34807eb4dc4c85692c2a372f4e"
text = "在堺的投资页投进一千。顺道瞧瞧堺眼下在哪一阶，离商馆一级还缺几许。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v14_invest","text"],null]']
src = "blake3:95526a9f0d150a81d78c65bbf82dc65241c02d1c9f26f5e3a13ca41682a03c0c"
text = "会合众收罢钱，在长纸末梢补写下“土佐一条”。前头密密麻麻列着名姓，便是排在最末那位，出资也高出我数倍不止。对方道商馆总得筹够六千上下才肯开张。我将这数记在船账末页，正挨着米钱。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v15_bank","hint"],null]']
src = "blake3:29b402df890cc0ed7660a52957113e10d1ff9216c5f6533e41e97657f6701259"
text = "钱留在船上容易散尽。去堺的银行存起一小笔，船上只留够月底工钱的数；或是借上一笔，二择其一即可。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v15_bank","text"],null]']
src = "blake3:50dc403a5136ab5b946b08cb051bd01163096fc4666fea4ed84abc17aea12ce3"
text = "掌柜先问是存是借，继而问起期限。“一年。慢着，半年罢。小夜，定半年还是定一年？”小夜拨响算盘珠子算了两下：“您船上备的米钱，能支应到几月？”我回说五月。掌柜听罢，提笔在簿子上写了一年。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v16_june_yard","hint"],null]']
src = "blake3:dd0e0b85e96bc75af787c5cf9f95a7944593ac65f309231969854bce32a81004"
text = "6月之后折返堺，到船厂修缮船只；若资财充裕，多置第二条船也成。博多过来的船想来也该入港了。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v16_june_yard","text"],null]']
src = "blake3:9b40b252e212060688e6dc97bc30d36480b728988645dcbbda76dccbca4a6709"
text = "船匠握着凿子沿船底一寸寸敲过去，到船尾处住了手：“此处得换两块木板。”我问需几日。他道得看天晴不下雨。梅雨绵延不绝，我便坐在船坞旁，瞧着自博多驶来的船只一艘接一艘入港。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v17_hire","hint"],null]']
src = "blake3:5f528ec6cbea96fe0c55deca4f3ec078adbb86abc951fd2a85c8d1f9510a04e6"
text = "西去平户海路漫长。去堺的酒馆再募一两个水手，每人三十。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v17_hire","text"],null]']
src = "blake3:b85e666f82d8462dac4dccbe75b8836508616a9b5e6a0ab62296a3f96988ce79"
text = "开春那位纪伊来的水手仍待在酒馆，一见我便站起身来，道眼下六月了。他还领了个同乡，说俩人一块儿雇更划算。“两个六十，便宜在何处？”“他食量小。”那同乡在旁不住点头，手里的饭团已经啃去一半。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v18_noshima","hint"],null]']
src = "blake3:ad2ac5cdcb2ec04eaea0ce99d48bae9468cfa2ee389d23586a51ea68339d7a81"
text = "顺着濑户内海西行往能岛。途中寻个锚地下锚登岸，打一回淡水。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v18_noshima","text"],null]']
src = "blake3:a1d463a17ec46c53c6a842bcdc39c1a15c10d7274a55f88d7b2f9d30429b811e"
text = "抛锚处在一条小河口，岸畔只落着两户农舍。水手们抬水桶往河边走时，屋里走出个老妪，盘问是哪家的船。我答挂的能岛旗。她便不再追问，转身回屋端出一盆煮熟的芋头，开价三十文。我砍到二十五，她伸手从盆中捡出两颗，说二十五文只值这数。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v19_at_sea","hint"],null]']
src = "blake3:af31bc5f84d37dadc76db230cbdb0eab6b8e6259ea82c5e19b7e447e144727c5"
text = "西行途中：遇近处商船便高声喊话，见海面漂物就靠过去察看，再收帆撒一回网。限120天内办妥有赏。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v19_at_sea","text"],null]']
src = "blake3:2f0e606e3e8c7b5b5aca0c668e24b658786454263462aaa7d46b99d9db050008"
text = "搭上话的那艘船归属博多，船老大讲前路有海贼出没，随即又补说自己亦未亲见，纯属道听途说。收网拉上来半筐小鱼外加一只烂草鞋。阿权顺手将破鞋抛回海中，鲜鱼当夜便下了锅。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v20_hakata_chart","hint"],null]']
src = "blake3:ce17fa1bf8a7144e41f65a747812586d99aa298783ac09f2e3636f9edc8ca13a"
text = "去博多的酒馆购置一张海图，拣选未曾涉足的海域。日后前往若狭、越前，日本海那张正用得着。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v20_hakata_chart","text"],null]']
src = "blake3:3658d733c6fd5498bec79278df3a5d08e2949fb2fdce859ccdc470e41f7ed9e8"
text = "兜售海图的是位唐人，纸面标注半是汉字半是南蛮字。他点着若狭一带叮嘱，彼处冬日涌浪高出此地一倍，海图只画得出岸线，可描不出风浪。待他报完价，我连砍两刀，他却仅肯让步头一回的数。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v21_busan","hint"],null]']
src = "blake3:357f402f6b214aab96c5e2d6d976a2c7991380279968bb2474268c62b4c468b9"
text = "自博多取道对马前往釜山，到釜山交易所脱手一件货物。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v21_busan","text"],null]']
src = "blake3:cca5d83ef542cf0ef0e09e1d5e37404665863dac40cae047b8abf34206af773c"
text = "倭馆门前站着朝鲜兵卒把守，入内须报清船名、货名及人数。通事原是对马出身，径直替我将“土佐”改填成“对马”，道如此少些麻烦。货物顺当脱手，税单上落的名号却是属对马的。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v22_hirado","hint"],null]']
src = "blake3:ffbee7b7861b0980bdd4b1c0373ca570c79aef2bc6de929a3b1dd348ba1ed108"
text = "动身去平户。徽王的船停在松浦家码头，赶9月底以前登门见他。"

[entries.'["stories/guide/guide_mio_voyage.toml",["chapters","guide_mio_voyage:v22_hirado","text"],null]']
src = "blake3:61b243330349cc997075b6e653b21d4c586d33ccb44f07407fc14c4fd56341dd"
text = "平户港内泊满了唐船，半坡宅邸挑着“徽王”旗号。码头上有通事候着，见了便问我可是土佐来的那条小早。我应声说是，又问船上十四口人可要报姓名。他回说不必，王直只过问船。"
