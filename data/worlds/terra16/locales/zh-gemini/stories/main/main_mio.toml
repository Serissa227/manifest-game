src = "blake3:0b297ec810290c9d78cb3489f3c56e165690bc39dc7e468e022ecb6712e53931"
text = "盛夏的安格拉，特塞拉岛的港内烟气未散。圣克鲁斯侯爵的舰队才在岛东登岸，法国兵与唐·安东尼奥的人马便往山里撤了。我的船在大海上赶了大半年路才到此处，泊在一群西班牙大船的阴影里。侯爵的军官挨船传令：“没有许可，任何船只休想往西。西边什么都没有。”码头上一名葡萄牙老领航啐了一声：“什么都没有？那每逢盛夏往西开的船，都到哪儿去了？”向西驶出半日，海草便一层叠一层浮上水面，风歇了，罗经的指针在盘心里乱打转。这片海和那智的海一样，正流向一个叫不出名字的所在。我把桧扇撑开，搁在船头的罗经边上，月色将扇骨上的题歌照得泛白。指针晃到最后，停在了扇子指着的方向，并非正北。当年七夕隔着白绢递歌纸，亦是这般看不见对面。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c06_dark_sea:rw_chidori","text"],null]']
src = "blake3:e649ae4e71c512c5915a1e6d2cb8099862f945018bd4ee99d5cdce1125dbacef"
text = "盛夏的安格拉，特塞拉岛的港内烟气未散。圣克鲁斯侯爵的舰队才在岛东登岸，法国兵与唐·安东尼奥的人马便往山里撤了。我的船在大海上赶了大半年路才到此处，泊在一群西班牙大船的阴影里。侯爵的军官挨船传令：“没有许可，任何船只休想往西。西边什么都没有。”码头上一名葡萄牙老领航啐了一声：“什么都没有？那每逢盛夏往西开的船，都到哪儿去了？”向西驶出半日，海草便一层叠一层浮上水面，风歇了，罗经的指针在盘心里乱打转。海草下面深浅莫测，谁也道不明白，千鸟若是在船上，张口头一句准会问：水在几寻？我把桧扇撑开，搁在船头的罗经边上，月色将扇骨上的题歌照得泛白。指针晃到最后，停在了扇子指着的方向，并非正北。当年七夕隔着白绢递歌纸，亦是这般看不见对面。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c07_after:v1_verdict_close","text"],null]']
src = "blake3:8ed15a2b31bae98444db8c9b390224bcb6f90b607ca8dfe7819273a55d9017f3"
text = "入秋后，我的船重回了熟识的海面。彼方的判词言明门要关上——这话我听见了，归途中，海草在船尾一重重重新合拢，仿佛压根不曾让开过。扇骨之间多出枚薄片，瞧不出是何金属，比纸还薄些，敲下去半点不响。港口里卖玻璃珠的葡萄牙水手拨数着珠串说道：“雾没开？开了。无非开给谁，又不开给谁罢了。”水手问我：“姬君这一遭去了何地？”我只说去了趟西边。走过那么一遭，扇子依旧是这把，唯独沉了一片。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c07_after:v2_verdict_open","text"],null]']
src = "blake3:964d14ff9cb01845109cd3daf59c1ccf335c420d6ed4de33d186c13a5a778038"
text = "入秋后，我的船重回了熟识的海面。彼处的金板上刻着判词：航路要开。我坐在那场聚议的末席，听了十个人的言辞，记住了九个半。归返平户后，我破天荒在酒馆里叙了整夜，老板娘添了三遍酒，每遍都催着：“再说说那面金板。”连卖玻璃珠的葡萄牙水手都听得忘了收摊。他最后道：“雾没开？开了。只是开给谁，不开给谁。”我回说日后要开给所有的船。讲到天亮，扇子搁在膝盖上一直没合拢。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c07_after:v3_council","text"],null]']
src = "blake3:9e1ddc6e769d5791b2d6b0c9b6272a365baf845d47c797858faaea799e5886cd"
text = "入秋后，我的船重回了熟识的海面。那边的火光曾熄灭过一阵，昏暗当中，有人将那片海域判给了其中一方。判归了谁，我心里有数，却不愿提。归来以后我许久未出一声，水手们只当我是病倒了，舵手端着碗粥候在舱门边：“姬君，三天不曾进食了。”港里卖玻璃珠的葡萄牙水手晃着珠串逗我：“雾没开？开了。只是开给谁，不开给谁。”我将扇子平置于膝，一整个午后都不曾展开。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c07_after:v4_crossed","text"],null]']
src = "blake3:a856d19db11246f9bad8b4dc5c93f7f9bb5c64940a34c15a63fb9cc81bff6a9d"
text = "入秋后，我的船重回了熟识的海面。海草曾分出过道，随即又在我船尾合拢。我曾涉足彼岸又安然折返，此事我不曾对任何人吐露半字。卖玻璃珠的葡萄牙水手道，归来的那几艘船，船首无端各添了一物，彼此各异；他凝神望着我的船首瞧了许久：“雾没开？开了。只是开给谁，不开给谁。”码头上有人搭讪：“这趟航去何方了，晒得这般黝黑？”我顺手撑开扇面遮住半张脸。扇子遮得住面容，却遮不住浑身沾着的那股海草气息。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c07_after:v5_turned_back","text"],null]']
src = "blake3:d6083e95d85858e70698d1a49c98fd1b1484b971a75ad3839549f7bdf8be2781"
text = "入秋时分，一艘自里斯本返航的葡萄牙船驶入我下锚的港湾。水手们坐上船头谈论起亚速尔：那个盛夏，西面海面上挤满了船，大雾不曾散去，归来者个个缄口不言。一名缺了门牙的老水手接口道：“我们船长一挨近海草边缘便喊调头，余话半句未留。”我曾抵过那片海草边上复又折返，他们口中的见闻，我知晓得比他们多些，却也少些。卖玻璃珠的水手一面捻数珠串一面搭腔：“雾没开？开了。只是开给谁，不开给谁。”打那以后，我总在夜半眺望西陲天色。无论那趟成行与否，手中的扇子终归还是这一把。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c08_kanesada_dies:held","text"],null]']
src = "blake3:bc7e0dd433e91ab80e80b8d0b802f435d5e27dd1c06a62b8d48bf70f914ae345"
text = "盛夏时节，秀吉率大军渡海攻入四国，长宗我部随之归降。就在这月，兼定在中村的御所里咽了气，年纪才四十出头。御所里的侍女依循南蛮旧例，为他竖起一座木十字，当天四万十川往来的渡船尽数悬起素白。渡口的老船夫提起：“殿下临去时指间紧攥着念珠，口中低念的是土佐话。”我在下田河口点起一盏灯，安放在那道沙洲上，候着潮水将其送出海去。一旁补网的老妪瞧着说：“涨着潮放灯，它是漂不走的。”那灯果真没漂出去，就在沙洲边搁了浅，彻夜亮到天光。灯不肯离去，正像他。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c08_kanesada_dies:refused","text"],null]']
src = "blake3:3f1c284634cb91eeebebb770276d056ebadc684aad0d4e9ef4c9bd329fa7927c"
text = "盛夏时节，秀吉率大军渡海攻入四国，长宗我部随之归降。同月，自宇和海驶来的渔船捎来消息：户岛上的兼定亡故了，尚才四十出头，岛上渔户照着南蛮礼数替他竖起一座木十字。渔夫讲：“殿下断气时手里还攥着念珠，嘴里喃喃的都是土佐话。”当年在府内，我未曾借他船只。我在下田河口点起一盏灯，放在那道沙洲上，等潮水将它带走。一旁补网的老妪在侧边说道：“趁涨潮放灯，它是漂不出去的。”灯果真没漂远，就搁浅在了沙洲上，一直燃到破晓。灯不肯走，正像他。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c08_kanesada_dies:saved","text"],null]']
src = "blake3:171a26c5ee991a13845c43e0c3bbb37a6af2b9d6f79d03e763bc4212be7fb9f9"
text = "盛夏时节，秀吉率大军渡海攻入四国，长宗我部随之归降。同月，自宇和海驶来的渔船捎来消息：户岛上的兼定亡故了，尚才四十出头，岛上渔户照着南蛮礼数替他竖起一座木十字。渔夫讲：“殿下断气时手里还攥着念珠，嘴里喃喃的都是土佐话。”早年在渡川，是我亲手将他从芦苇丛中拽上船来的。我在下田河口点起一盏灯，放在那道沙洲上，等潮水将它带走。一旁补网的老妪在侧边说道：“趁涨潮放灯，它是漂不出去的。”灯果真没漂远，就搁浅在了沙洲上，一直燃到破晓。灯不肯走，正像他。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c08_kanesada_dies:told","text"],null]']
src = "blake3:a3f32a8bfd7fd30166cd2178fbdd0bcb10a647b2b6dbc2cf584b415a9cc846aa"
text = "盛夏时节，秀吉率大军渡海攻入四国，长宗我部随之归降。同月，自宇和海驶来的渔船捎来消息：户岛上的兼定亡故了，尚才四十出头，岛上渔户照着南蛮礼数替他竖起一座木十字。渔夫讲：“殿下断气时手里还攥着念珠，嘴里喃喃的都是土佐话。弥留之际还嘱人誊录了一页旧纸，要托带给土佐的姐姐。”那东西我不必拆看，便知是父亲的辞世。我在下田河口点起一盏灯，放在那道沙洲上，等潮水将它带走。一旁补网的老妪在侧边说道：“趁涨潮放灯，它是漂不出去的。”灯果真没漂远，就搁浅在了沙洲上，一直燃到破晓。灯不肯走，正像他。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c09_edict:nobunaga","text"],null]']
src = "blake3:dd4b0163860f948420841959d1499275b570bb95919b71030e43fa3cc10e3b6f"
text = "夏末的能岛，关所门板上钉了张新榜，落款署着安土：自此往后，海上禁收帆别钱，禁卖过所旗，有违令者一概视作海贼。这道令是信长的天下所颁，领命前来督办的是他麾下大将羽柴秀吉。武吉早于前年被迁往筑前，岛上仅留了几个看守屋舍的老水夫。武吉曾托人捎回话来：“缴上去的旗，安土会发回一纸文书；一把火烧了的旗，大海自会记住。”老水夫从关所屋里抱出那捆未曾售出的旗帜，压在顶头那面盖着能岛的石印。他问我：“姬君，旗既然不作准了，船总还作准吧？”我袖中仍贴身藏着阿濑缝制的那面过所旗，旗沿的针脚早磨得泛白。我朝空荡荡的关所道了句：“旗钱，先付。”话音落罢自己先笑出声，老水夫也跟着笑了。旗终究是布帛，海潮却不是。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c09_edict:own_flag","text"],null]']
src = "blake3:8ea009af0bdd22ef72ee7f5dfdc4e7c79c4c85cfea8449993af10ca1b38b7bd3"
text = "夏末的能岛，关所门板上钉了张新榜：自此往后，海上禁收帆别钱，禁卖过所旗，有违令者一概视作海贼。武吉早于前年被迁往筑前，岛上仅留了几个看守屋舍的老水夫。武吉曾托人捎回话来：“缴上去的旗，关白会发回一纸文书；一把火烧了的旗，大海自会记住。”老水夫从关所屋里抱出那捆未曾售出的旗帜，压在顶头那面，正有我当年在这屋里写下的“一条”，墨迹早已褪成灰白。他问我：“姬君，旗既然不作准了，船总还作准吧？”我袖中仍贴身藏着阿濑缝制的那面过所旗，旗沿的针脚早磨得泛白。我朝空荡荡的关所道了句：“旗钱，先付。”话音落罢自己先笑出声，老水夫也跟着笑了。旗终究是布帛，海潮却不是。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c10_epilogue:v1_nobunaga","text"],null]']
src = "blake3:fab936e36fa825686f3882175b219d1d91005a0dd6c02cfe22c5ffb6ffda13c8"
text = "安土的世局已定，小田原开城的风声从安土一路传到平户。五十岁的我坐在平户码头上，膝头放着那把桧扇，扇骨叫海风日久磨得发亮，扇纸也糊补过两遭。港内一群孩子正赛小船玩，有个系红白束发绳的女娃输了局，嚷着非再比一次不可，嗓门倒比胜出的那个还响。她心下不服，跑过来瞧着我的扇子问道：“婆婆，扇子上写了什么？”我将扇面摊开。这许多年头，那首歌我在船头读过，在海潮旁读过，在弟弟那盏灯边读过，却从来不曾朗声诵出。今日这一回，我竟念出了口。歌里所吟的，是银河这头与那头，当间横隔着一道看不见的水路，有人立在此岸等潮。女娃听过后皱眉琢磨了半晌，说：“那直接游过去不就得了。”边上取胜的男孩嘲笑她，挨了她一脚。旗帜换过好几面，唯独这把扇子从头到尾就这一把。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c10_epilogue:v2_abroad_wang","text"],null]']
src = "blake3:1ac82b6f7bef7317dfd0270968884e619023132c2a72cab70a7200e23ae3a473"
text = "小田原开城的信儿传抵平户，天下复归一家。五十岁的我坐在平户码头上，膝头放着那把桧扇，扇骨叫海风日久磨得发亮，扇纸也糊补过两遭。王直昔年在舟山留下的旧泊位，时至今日仍有人为我空着，年年托人递信打听我何时前去。港内一群孩子正赛小船玩，有个系红白束发绳的女娃输了局，嚷着非再比一次不可，嗓门倒比胜出的那个还响。她心下不服，跑过来瞧着我的扇子问道：“婆婆，扇子上写了什么？”我将扇面摊开。这许多年头，那首歌我在船头读过，在海潮旁读过，在弟弟那盏灯边读过，却从来不曾朗声诵出。今日这一回，我竟念出了口。歌里所吟的，是银河这头与那头，当间横隔着一道看不见的水路，有人立在此岸等潮。女娃听过后皱眉琢磨了半晌，说：“那直接游过去不就得了。”边上取胜的男孩嘲笑她，挨了她一脚。旗帜换过好几面，唯独这把扇子从头到尾就这一把。"

