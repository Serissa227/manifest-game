[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a00_gate","hint"],null]']
src = "blake3:a78dc87986398ec33396a1c6ac42353b1aa19249c9f146241732798d3de5f680"
text = "正月初且在下田留神河口人的风声；初七过后，栈桥上会有人来寻你。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a00_gate","news"],null]']
src = "blake3:0300c085621473835ad398f5cdc2b993f305f63144962410c01b3985ce7a7217"
text = "下田河口的人都在传，一条家那位去过京里的姬君，正月里便要驾着小早出海，桅杆上还系着一根红白绳。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a00_gate","text"],null]']
src = "blake3:9cb648528806bbe19bda2ac1f640c09dff3c3f24fe2c570e5b833c3dc80eaeb0"
text = "下田的河口一带，四万十川的水势抵着海潮，在沙洲前激出一道白线，渔户门前的松枝还没撤掉。边补网边说话的女人们提起，御所那位去过京里的姬君，开春等不及风头稳住，就要亲自掌舵出河口去。摆渡的老船夫将竹篙往沙里一顿：“她七八岁就蹲在能岛滩上数帆别钱，收钱的还没点数完，她倒先报出了数。”渡口旁停着一艘小早，桅杆上系着根红白相间的绳子，正是缝制过所旗余下的边角。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a01_sakai_ship","hint"],null]']
src = "blake3:022bf06a22c286f923780b45f5053329f9f18d2a1f9a15a65dc31b14788e4a9d"
text = "1月7日过后，去下田栈桥见那位从堺来的船主；他至多候到4月15日。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a01_sakai_ship","news"],null]']
src = "blake3:6de17ed2a59b0df87e9d52756488cf929c2c13dd16c7337eced1678190c8591c"
text = "一条家的姬君在下田栈桥上，为着旗钱同堺来的船主费了半晌口舌，老舵手认出了她那面旗上的针脚。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a01_sakai_ship","text"],null]']
src = "blake3:c5cfe6656839d101fe4387bf27b01d507e0eb3616a7cd8a04201adac2a18e627"
text = "下田栈桥上，北风还吹得发硬。一艘打堺来的大商船吃水极深，舱里压着土佐的杉木和纸，专等南风一起，便绕足摺岬回航。船主是会合众底下的小商人，袖口早就磨亮了。他要找人护送过岬：黑潮在那处专把船往礁上推，宿毛湾外更有零星海贼。他打量一番我的小早，又抬眼看我：“这般小的船，浪头大些便望不见了。旗钱嘛……等到了堺，一文不——”“旗钱得先付。”我自袖中抖开那面过所旗，那是乳母阿濑从娘家带来的，“过岬算一程，进堺算一程，两程一并结清。熟客我们抹去零头，您是头一遭，零头照收。”船主身后原有个蹲在缆桩上剔牙的老舵手，这会儿也凑近过来，手指顺着旗边摸了一遭：“这针脚……阿濑家的？那年我在来岛的水道口领旗，也是这般锁的边。”船主扭头瞪他一眼，他又蹲回去剔牙了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a02_ashizuri","hint"],null]']
src = "blake3:f19bea52a0c61c9cc7057b095923176c9ab2baf35bdb29559142f847ef9a9e6d"
text = "绕过足摺岬，赶在5月底以前将商船护送进堺。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a02_ashizuri","news"],null]']
src = "blake3:47fe9d30131908687bb411a3901f9c12cfd0ac1133fbe9f9ee72ca1d80d78bb8"
text = "堺的码头传言，有艘土佐驶来的小早，在足摺岬下将一条大商船自礁线外拖了出来，金刚福寺的钟敲了一整夜。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a02_ashizuri","text"],null]']
src = "blake3:3b10a42a90611fb02bd8f4add9be1f4cbc664dcf70fa6f97feced3fd0af070f1"
text = "那一夜绕足摺岬，黑潮劲往东北推，商船被顶得直往臼碆的礁上迫去。我那几名桨手轮换了四遭，缠在舵柄上的麻绳磨得起了毛，崖顶金刚福寺的钟一响一响落下来。船主道，寺里僧人把那片海唤作“补陀落东门”。我的小早就在前头挑灯，生生把大船从礁线外头拽了过去。进了堺，会合众的库房顺海岸一字排开，查货的伙计执着账本一船接一船地对。卸到尾声，单剩一只钉得死紧的箱子，比旁的沉上一倍。船主压低嗓音：“这箱子，你权当没看见。到了平户，自有人认得它，是徽王要的硫磺。”伙计已走到近前，曲起指节叩了叩箱盖，问账上记着纸和木头，这一箱怎么敲着发闷。他手里那本账，已翻到了土佐这一船。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a03_uncle","hint"],null]']
src = "blake3:0eef40c87768bbe131e3203608ae9677245f25fa46d8800fe80ab5945d19c671"
text = "6月至8月中旬在堺停留，自博多驶来的船会带来长府的音信。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a03_uncle","news"],null]']
src = "blake3:fc91995e05761e3074565959bc57aa664a072890e6cdcc051cf6a750ec133038"
text = "堺的码头上纷纷传着，长府的大内殿已在寺中自尽，大内家就此覆灭，毛利家的旗都插到山口了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a03_uncle","text"],null]']
src = "blake3:7c15cba1cec54cebfb05af05eb3be4265b3b81a37f511f4092b5fdb56fcc72d8"
text = "从博多驶来的船泊进了堺，捎来长府的消息，也捎来一封信。信是舅舅大内义长数月前写给我的，人已不在了，信方才递到手里。封口压着大内家的菱纹印，舱顶漏了一宿梅雨，墨迹晕开了一角。信纸不长，起首说长府今年的梅子酸，腌了照样酸；当中一行写着：“听说你会挂能岛的旗。海上若还有一条往丰后去的路，替我留着。”末了又问土佐的鲣鱼几月最肥。博多的船头蹲在船板上拧袖子：“长福寺的和尚讲，大内殿去得很安静。毛利家的人连寺门都没跨进。丰后的船，我们在海上一条也不曾碰见。”我屈指算来，他提笔那日，我还在京里替弟弟磨墨。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a04_hirado","hint"],null]']
src = "blake3:0167f73831f05e3ff3914636ff5ef2e0456f6f875dba74d259c461020361dd62"
text = "9月底前前往平户，徽王的船尚停靠在松浦家的码头。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a04_hirado","news"],null]']
src = "blake3:4d2a22c2ec805e0c41aa2e54cb70edf77558d356513f3d4e57091d6772ee12f4"
text = "平户山坡上那位徽王，邀了土佐来的姬君登船吃酒，月港林家的人提着红灯笼，立在船舷边听着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a04_hirado","text"],null]']
src = "blake3:004dcc54ae54c9b9fb6f44018d4f2986b887d437e68c81e85a1b86f61d6d693f"
text = "平户松浦家的码头停满了唐船，山坡那座宅院正悬着“徽王”的旗号。王直听闻土佐来了个上过京、会挂能岛旗的姬君，便差人请我上船。登船前，我在栈桥上同松浦家收泊钱的缠磨了一刻，把三十文硬压到了二十二。船舷边立着提红纸灯笼的林晚灯，她是月港林家派来探王直风向的人；我们托她表哥的船通了两年信，今日才是头一遭照面。栈桥上那一刻教她全听了去，她笑着说，信里可只夸过我的字。王直先不问旗钱，倒是问起别的：“朝廷一会儿拿我当贼，一会儿又许我做官。姑娘既是公家的人——朝廷这话，有几成作数？”通事弥七在我们中间传话，手底绝不往纸上落：“要紧的话写不得。落了纸，便有人拿去对。”舱内桌上摊着一张五岛至舟山的针路图，酒早已斟好，谁也还没沾唇。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a05_farewell","hint"],null]']
src = "blake3:7188aac97a27197cd64305312775eb427c884b3485f74dbca316ee7df557bdff"
text = "10月到11月底待在平户，恰逢王直的船队拔锚返航舟山。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a05_farewell","news"],null]']
src = "blake3:6ba2fabaaac4937e9a40a55e7703164e2bc50c67cf11ff073f90da4b97af4115"
text = "那夜王直的大船起帆回舟山，在平户码头上立着的，有一条家的姬君，也有月港林家打灯笼的人。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a05_farewell","text"],null]']
src = "blake3:48e4aec769d2fe1fba68ee2c89e3904ad28246d4efaed0d31a89791961e4af1c"
text = "北风打前天刮起来的，火长说今夜就动身。平户港内，王直的大船正一艘接一艘地扬帆，预备回舟山的岑港去受抚。码头上燃着火把，松浦家的人远远站着。王直立在船头望着水，转身问我：“姑娘，今夜的潮水何时转？你道几时，我便几时行船。”他将那幅针路图卷了，没带走，递进弥七手里：“留着回来再用。”林晚灯手提红灯笼，立在栈桥尽头：“这灯我替他提到港口外。再远，便是妈祖的事了。”说罢，她把灯笼换到了另一只手里。我那面亲手写的旗正卷在小早舱内，“一条”这两个字，至今还不曾替哪艘船挂过。码头的石阶一阶接一阶地露出水面，眼下已现出第三级了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a06_funai","hint"],null]']
src = "blake3:22f3608841bf526fe5174dec466ede898ee9ee2cf486259626c0dc7662c3ad4b"
text = "腊月至来年6月，动身赴丰后府内见舅舅；身上备足五百金币以上，那头用得上。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a06_funai","news"],null]']
src = "blake3:0b68ff47dcc659805675d595eeebffa634eaeb053fdeb640f0e8d729e6608ce5"
text = "大友家那位从土佐来的外甥女，抬着自家受伤的水手，去府内的南蛮医院排起了队。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a06_funai","text"],null]']
src = "blake3:6384c217a4798aec3e06de1dfdd98dedb69ead7f4dbfd852ed5176c6d2fcbd65"
text = "舅舅大友宗麟治下的府内停着葡萄牙船，耶稣会的会院旁新开了一座医院，门前排起长长的队。阿尔梅达挽高袖子在替人剜疮，他原是做买卖的，把家底全数捐进了这里。我船上有几名水手在海上挂了伤，创口正发着热。他连我带来的货看也不看：“货先别提。你船上谁在发烧？抬进来，伤处要见光。”宗麟二十七八岁年纪，披一件南蛮斗篷，在码头上拦住我：“你这船上带了什么新鲜物件？”货堆上搁着一挺葡萄牙火绳枪，一旁立着写明价钱的木牌，他扫了一眼，说这东西他已经有了。换药的工夫，阿尔梅达随口提起，长府那头也曾有人送伤兵来，是大内家的，他们说丰后的船没来。我手里的碗晃了一下。舅舅在门边听见了，只留下一句：“长府的事……丰后自有丰后的难处。晴英会明白的。”他转过身走回码头，让人撬开一箱刚卸下来的南蛮玻璃器，一只一只举起来，迎着太阳细看。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a07_court_letter","hint"],null]']
src = "blake3:f1762325e1cb4a9193b36fba34dbd4cdaecd4d4e5999abf9f8e24e94f25fe5aa"
text = "1558年开春往后，京里的书信便会追到你跟前。想自个儿垫上一笔，得先攒足三千金币。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a07_court_letter","news"],null]']
src = "blake3:bb15883d3ad01f07bf7066f594e12606ef3640e7c1f0ed08c264678d50187119"
text = "堺那边的人讲，京中的山科大人四下修书讨钱，好办即位礼，竟连土佐一条家的姬君也接到一封。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a07_court_letter","text"],null]']
src = "blake3:73190acf31d8d17cab1e96703f92c6bb3a85dfbb8814a1102230703d58b394fd"
text = "几经转手才追上我的这封信，封皮已磨出了一层毛。山科言继才从骏河的今川家讨钱回来，满纸字迹又急又挤：“紫宸殿屋顶漏了三处，我正拿盆接着。钱，钱，钱——姬君倘若识得哪位肯出钱的殿下，替朝廷开一句口。”我通篇数下来，竟有十一个“钱”字。新天皇践祚好几个月了，即位礼至今仍办不起。他在信里顺带提了一句：本愿寺已许下一大笔，若是去迟，名字连末尾都排不上。信尾另有广桥保子用淡墨添的一行纤长女手：“你那年寄来的那首歌，我还留着。”随信还夹了张引见帖，一角折着约见的时辰。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a08_donation","hint"],null]']
src = "blake3:8fd472a77ab4f6773910a17e013d15566d7d7f0bc97e4c860b0dc6f5fefcf93f"
text = "1560年正月底前，须将募得的钱款送抵堺，交到言继的人手里。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a08_donation","news"],null]']
src = "blake3:6239013c655d85655682fd5b121be3242ba45ffe62c66e100b95f5430417b0d8"
text = "送往京里的钱箱在堺的纳屋町摆了一溜，山科大人蹲在一旁逐箱记着名字，属本愿寺的那口最大。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a08_donation","text"],null]']
src = "blake3:14b6ee9dc086bcfbafedcd666b4d689f848c2b9f03c16c7519a3ce100218ea2b"
text = "堺纳屋町的库房门外，顺次摆着一排钱箱，有毛利家的，也有本愿寺的，箱盖上俱贴着封条。山科言继亲自下到了堺，膝头摊开他那本日记，逐箱记下去。立在最前头的是本愿寺使者：“钱倒是一样的钱，可本愿寺那一箱，用了八个人才抬来。”我那一份搁在最边角，两个人便抬过来了。言继一路记到我身前，抬手将笔递过来：“某月某日，某家献钱若干——你说，这名字写谁？我这支笔正候着呢。”笔杆上仍余着他掌心的暖意。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a09_coronation","hint"],null]']
src = "blake3:5ad03b1009491f7dc7966c6cd4d7a9a6a648351d79fa50a0817461cba5718980"
text = "即位礼便在1560年2月、3月里，这两个月且留在堺。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a09_coronation","news"],null]']
src = "blake3:73ee2829975307c985b530287253f28bc7585cd83eee1ccdaa5bed80ced9fd6b"
text = "有从京里来的人讲，正亲町天皇的即位礼到底是办成了，花销大半是毛利家与本愿寺出的；那日紫宸殿前落了雪。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a09_coronation","text"],null]']
src = "blake3:b2fbb172625c812217ce73bcb75f1e8e1b3cec9579af8c1cf264281f0e5686c8"
text = "我自堺上京。即位礼那日落了一场晚雪，紫宸殿前的白砂上只铺了薄薄一层。我挤在建礼门外的人群里，隔着墙，只望得见一缕缕往上飘的香烟，听得见公卿踩雪的靴声。身旁有个卖炭的町人缩着脖颈低声嘀咕：“办这么一回即位礼，京里的炭价都涨了三成。”那张引见帖仍夹在言继的信中，约见的时辰早已过了。散场之际，一位老女房打门里出来，一眼便认出了我，把我从人堆里拉到廊檐下，塞给我一只金纸裹着的点心：“土佐来的那个孩子？晒成这般模样了。进来罢，廊下没有雪。……当年那张小几，还收着呢。”我随她走进廊下，点心外头的金纸上沾着雪水。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a10_wang_echo","hint"],null]']
src = "blake3:08e24634ec5c16407c39ab051ce9551c90e7b23ec342e0ed3473b3357d518720"
text = "你不必特意往哪处去，从平户来的船头自会把王直的下落报与你。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a10_wang_echo","text"],null]']
src = "blake3:bb2c89d83de9502271b170953cf832655dd4362725b916fe4a604f2f6272b1ac"
text = "从平户来的船头捎了一张抄录的告示，纸沿让海风吹得卷了边：王直在杭州官巷口遭斩，首级示众，余党各自散去。递过纸时，船头说道：“岑港的人全散了，唯独弥七还守在平户。”随纸同来的还有弥七一句口信，他依旧不肯落笔写字，由船头代为转达：“船主说：姑娘把潮看得准。”船头伸手来讨那张告示，我攥着没给，转口问他平户今岁生丝作什么价，白丝、黄丝、捻丝，逐样问过去。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a11_noshima","hint"],null]']
src = "blake3:bfa894e6dc7969bb3e8f5b9ff957fde533c45f9735fa82384dcbfe214aa0dfce"
text = "1561年3月之后前往能岛关所，武吉候你盖印；至迟1562年6月底。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a11_noshima","news"],null]']
src = "blake3:91f5f843b3be410d64b4f4274c639e1b0807b5b6452dd4ed80f918c2c3427c56"
text = "一条家的姬君在能岛的关所里，为一方石印同村上武吉争了一下午；这当口，对岸来岛的船正往门司驶去。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a11_noshima","text"],null]']
src = "blake3:6b7d189451231e0f5d3dfa00238224b299178f18b9555c957717578082883e4d"
text = "能岛极小，抬眼便望得到尽头；四围的潮水一日换四回向，漩涡紧贴着城脚打转。关所之中，村上武吉开口先问船：“几根桅杆？这一趟吃水几尺？”问罢，他才屈指叩了叩案上那摞尚未写字的旗，旗侧摆着一方石刻的印。望向窗外，对岸来岛的船一艘紧着一艘往西去：门司城下，舅舅宗麟的兵围着城，来岛村上则在替毛利运兵。来岛通康斜倚在门边道：“门司那边战事正紧，能岛还打算看几时的潮？”武吉并未理会他：“毛利给得多，我便挨毛利近些；大友给得多，我便向着大友。”他将石印推到我跟前，“你娘家是一条，奶娘家是村上。这一印盖向哪一方，今年你卖的旗钱便按哪一方记账，账房就在外头候着。”印泥盒也一并推了过来，盖子敞着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a12_forged_flags","hint"],null]']
src = "blake3:9274745a2ffc35ed71cec402c44d24856bda2eef2646bdaaf4c1c3bff5cc3535"
text = "一百二十天内，在海上胜一仗，紧缀住卖假旗的船。碰上海盗，先别忙着避让。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a12_forged_flags","news"],null]']
src = "blake3:af10247176c39759369ab44b3f6d40644cbcabe34f9131161c5d48d648593c26"
text = "在伊予滩上专卖假过所旗的那条船，叫一条家的小早拿住了，舱里头一箱假旗，外加一方木刻的印。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a12_forged_flags","text"],null]']
src = "blake3:93d5bb68a4d51fc73fcc44a7f8cb36aaff49c7c408d3e3ea34ffde62e1004f61"
text = "伊予滩上有人兜卖假过所旗：商船掏钱买了旗，才过海峡，转头又被卖旗的那伙人打劫了。我在海上追了半个多月，总算将那条船死死咬住。舱里放着一箱码得齐齐整整的假旗，连带一方木刻的印。木头印的边沿本该发毛，这一方却刻得比石头的真印还要精细。武吉早先传过话来，得连人带印一道押回能岛。那船主原是个被能岛关所逐出来的老账房，跪在甲板上道：“那方真的，同样出自我手。石料是大三岛的青石，刀是我自个儿磨的，刀口微往左偏……您拿去对着灯瞧，两方印里‘岛’字收尾那一笔，都缺着一个口子。”他把两手摊在膝头，指甲缝里的印泥怎么也洗不净。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a13_fudaraku","hint"],null]']
src = "blake3:3112f77f5f81adf71a7c799b00d98e9bd245c2de9591de4fc80131115cb16098"
text = "1565年11月到来年正月间，身在堺时，那智有艘船正要出海。若道德足六十、诗满四十，便能多出两种法子。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a13_fudaraku","news"],null]']
src = "blake3:1e545d509aea2ba438048e58fa5af326b47eb4c648822116bb3bcd2bf915ae37"
text = "听岸上的人讲，那智浜之宫又送出一条补陀落的渡海船，自始至终，旁侧都有条土佐的小早瞧着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a13_fudaraku","text"],null]']
src = "blake3:996723d45f0384081d075613a5c58fccabf4b697178376ff3f59149b5ad4ee9c"
text = "自堺出发，我沿着纪伊的海岸一路南行，到了那智山脚的浜之宫。补陀洛山寺前的沙滩上北风正紧，岸边停着一条小船，船身钉了座木箱似的窄屋，四角立着小鸟居，裹着白布。要赴南海观音净土的老僧进了屋，外面的人用钉子将门封死，我数到第十二颗便不再数了。屋里留着三十天的米与水，一盏灯，灯油也是三十天的分量。拖船会拉着它驶往纲切岛，到了那里再砍断绳索。隔着木板，里面的诵经声一直没有停歇。跟着他的小沙弥立在水边，脚浸在海里也不肯离去：“师父说，那边有观音的岛。……姬君，海上当真有那样的岛吗？”幼年在足摺岬，我曾听老人讲起过“补陀落东门”。拖船已经动了起来。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a14_kanju","hint"],null]']
src = "blake3:a08ee092851e33e473fb9f9d7dac454bd525a90a523242333b331bea6df5062c"
text = "1566年7月至9月在博多，长府外海的忌宫将举行祭礼。航海娴熟、诗达四十，届时皆有用处。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a14_kanju","news"],null]']
src = "blake3:ae0fff0e63726f749ba51fd4bf535e2c4969a304d29283832de7d37393eded33"
text = "听说忌宫的祭船在下关外海险些给潮掀翻，是一艘土佐的小早先一步稳住了船身。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:a14_kanju","text"],null]']
src = "blake3:c28e5771f03af30486285ec2c3f8ef768c45e8f609c70046ae97a9068fda8c09"
text = "离开博多一路向东，我绕到了长府外海。忌宫的祭礼船正在满珠、干珠两座小岛外围绕行，船首悬着白幡，岛上一律不准人上去。海面很是平缓，潮水却在两岛当间打转。神官回过头，往后头跟着的船扫了一眼：“船上的人，都莫要作声。”有个老渔夫划着小船贴到我近旁，压低声气说：“潮满珠在那边，潮干珠在这边。莫要用手指，指了要惹晦气的。”说罢，他自己倒抬起下巴往那边点了一点。绕至第二圈时，两岛之间的水流调了向，祭船的船首被推得往一旁偏去，满船白幡齐刷刷朝东边倒去。那道翻过来的水线，是我头一个瞧见的。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b01_iyo","hint"],null]']
src = "blake3:4dd1d895168b1ee65a8844c642a3508259df0f4b8504f7efa106fd5ba93e15e3"
text = "1568年下半年，伊予那一战的消息将传回下田；身在下田，听得总归最早。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b01_iyo","news"],null]']
src = "blake3:ca9c4b0fc5fa8e51275d0ec9347061ffd559a67bd161879631eb4d13e6d187db"
text = "下田渡口上都在传，御所的殿下在伊予打了败仗，退回来的船里，伤兵比箭还多。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b01_iyo","text"],null]']
src = "blake3:4abc58d83b0dece8181d3793950bdc2083e2b47fc59bc328aac28cca1f6d66cc"
text = "从伊予撤回来的船把下田渡口塞得满满的，伤兵躺在舱板上，箭杆还留着没拔。归来的足轻蹲在河滩上喝水，讲起年轻的殿下骑马冲在最前：“殿下带头往前冲，退也是头一个。毛利家的船刚一抵岸，我们就散了。”渡海去救援河野家的，是来岛村上的船只。渡口的老人们放轻了话音：“先代的殿下若还在，决不会这样打。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b02_sister","hint"],null]']
src = "blake3:6a3f87ab9ed746cf66417c5d51bef4443f2f3f4a1c40a8451983e3ec57035d21"
text = "1569年8月至岁末返回下田，东面沿岸有船将归。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b02_sister","news"],null]']
src = "blake3:db1d8df6cc142649aef00754bd2851f28287327f79b3ac65160c6fc114699143"
text = "听中村人讲，安艺家已经亡了，长宗我部的旗也插进了安艺；那位嫁过去的姬君，如今已被送回御所。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b02_sister","text"],null]']
src = "blake3:c6ca9af4434764b79631ca0457e025baa2d1843807216a26bd1fdbee763386dc"
text = "秋天，有只小船顺着东面的海岸驶回下田，船上载着我的妹妹，安艺国虎的妻子。国虎在城里自尽之前，先一步把她送回了一条家。她只随身带了两个侍女与一只梳妆匣，见着我，开口头一句先问：“姐姐，母亲的咳嗽可好些了？……我那边的事，容后再说。”就在同一日，一队打着七片酢浆草旗号的兵马从河对岸的大道经过。骑马走在最前头的那人，我认得他的面容：从前正月来中村拜年、让人笑作“姫若子”的那个少年，向来听别人讲得多，自己出声少。他在对岸勒马停了片刻，远远朝一条家的船俯首致意，一如拜年那回般客气。当年笑话过他的人里，原也有我一个。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b03_sozan","hint"],null]']
src = "blake3:cee0506005a47a0d59974c1d8d8a78705136d244de847f453b710ecf03ccc1db"
text = "1573年3月至10月间待在下田，会有人自中村顺流而下寻你。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b03_sozan","news"],null]']
src = "blake3:11693c42cf5488fe2a9166bd703771ac3eeb5b7cf67dfbbb82e170dd2291b560"
text = "据中村人讲，老家老土居宗珊叫御所的殿下亲手刃了，京都本家的内基大人也已赴土佐来了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b03_sozan","text"],null]']
src = "blake3:86012b0c476665bd6db1e13ad0053ebef70b6b8f2adf7c7279b3c87c2f99d961"
text = "入夜时分，一条小船自中村顺流而下，靠上了下田的栈桥。船上是土居宗珊家的老仆，怀中揽着一只黑漆文匣。数日前，家老宗珊向殿下进谏，当场遭殿下斩了；京都本家的内基大人已赶到中村，说是要替一条家做主。老仆跪伏在栈桥上：“家老吩咐过，这张纸呈给大姬君，莫给殿下。殿下瞧见了，会当成是在骂他。”匣中盛着一张泛黄的纸，以假名细细写着父亲的辞世。纸上压着宗珊手书的一行字：“并非狂疾。是他自己选的。”这二十四年来，家中人只道父亲是犯了狂疾。我就着老仆的灯笼读起那首歌，歌里写着：潮势要转了，舵交给了尚握不住它的手。那年弟弟才七岁。宗珊替父亲守了这张纸二十四年，最后却死在了那只手底下。父亲的字同我写的一样细，原来我的字是随他学的。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b04_exile","hint"],null]']
src = "blake3:e1560b316d1067a20648ceb5acdbe3b23ef05247d683f29f10e617ed1a6407d5"
text = "1574年2月到5月间，往府内码头去一趟，有自家人要在那处登岸。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b04_exile","news"],null]']
src = "blake3:6fe84dec1ffa0dc037682c11b883a0791d6fb3d168a828552d4bf8ca33ad46b8"
text = "一条家的姬君在府内码头迎她那落了发的弟弟下了船，大友那边，只打发了个管事过来。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b04_exile","text"],null]']
src = "blake3:87c757a20d588e6c5114fd926df1604d18b1876ed3b76be0f52780c25120930d"
text = "初春的府内码头，泊进一条借来的船，走下个戴斗笠的年轻和尚——那是我弟弟，昔日土佐一条家的当主，头刚剃过，泛青的头皮上还带着刀口。他娶的是宗麟舅舅的女儿，此番正是来投奔岳父。可舅舅眼下住在臼杵的岛城，打发到码头接人的不过是个小管事：“主公人在臼杵，说一条殿远来劳顿，且先在寺中歇息。”兼定袖子上一条家的藤纹已经给人绞去了，剪口连边都没锁。他上岸头一句话不是向我道谢，反倒问：“大姬君的船，何时能送我回去？”接着又说：“我仍是土佐一条家的当主。落了发也是。”绞掉的纹，断茬还毛着，像他。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b05_dom_paulo","hint"],null]']
src = "blake3:a17cde10767fcb7c9367121412353e340d26226ec6ca8c11617f58998b4a9629"
text = "1575年正月到7月间前往府内，兼定就在南蛮寺候着你。若只打算出钱，备足两千金币便是。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b05_dom_paulo","news"],null]']
src = "blake3:12fa927d5300d293e7d32d06e409a88295faef4b017d3e486e732d63d02d424d"
text = "在府内的南蛮寺跟前，土佐那位受过洗的一条殿展开一张河口图，同他姐姐一直吵到天黑。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b05_dom_paulo","text"],null]']
src = "blake3:badaf755b476544c292cccb607d315b14ec8339534f6295b66afe2dcf930974d"
text = "开春时在府内，兼定进了南蛮寺领洗，取了教名唐·保罗。他脖颈上垂着一串念珠，身上的僧衣却还没脱利索。他四下拼凑了数千兵马——幡多的老部下、伊予的法华津家，还有他岳父大友家的人——打算在宿毛靠岸，顺着四万十川杀回中村。他将亲手绘的一幅河口图铺到我眼前：“神父说过，天主会为我指一条返归土佐的道。大姬君，那条道便是你的船。”那图却绘反了，下田的沙洲被他画去了对岸。我提笔一划，把沙洲挪回原处。兼定凝神望着那一笔半晌，开口唤了我一声：“姐姐。”舅舅打臼杵托人传来的口信倒体面：“兵马我借与他了。至于船——土佐的水性，还是土佐人自己摸得透。”那串念珠悬在他胸前，分量倒比家纹还重。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b06_watari","hint"],null]']
src = "blake3:8eabe177ab4c7b10ecb4ac4c88d8f918a2a4c8cd0ffd6ef7a1f33aed84e7b945"
text = "1575年8月至10月间须守住下田河口，渡川那带即将动兵。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b06_watari","news"],null]']
src = "blake3:88ca01cca1a77bf800da03554a5807e683adf84fd4bb540322b12ac5a3083b49"
text = "下田一带都在传，四万十川渡川口交战那天，有艘一条家的小早打早到晚死死拦在河口白线上，寸步未退。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b06_watari","text"],null]']
src = "blake3:6c55fd2165565df27d4baa211efa8abf62784d481a2ab39e162650aa775909be"
text = "秋雨初歇，四万十川的水涨了起来，河道阔得宛如大海。弟弟将兵马排在西岸栗本城一带，东岸却横着一排七片酢浆草纹的旗帜，长宗我部麾下七千人正自上游压境而来。我的小早泊在下田河口，紧挨着那道沙洲的外沿。潮水正退，江水直往海里冲，两道水流相激，撞出一条白浪线。我舱内备着火绳枪，也留出了空当，既装得下兵卒，也抬得进伤员。弟弟冲着河面高喊：“姐姐，扼住河口！休叫敌船兜到后头去！”偏生在潮水落尽的当口，对岸兵马专挑沙洲水最浅处涉水过来。隔着一道河，我都能听清那边的足轻叫嚷：“紧跟那渔夫，水深才及腰！”那条暗道，唯独生在下田、长在下田的人才摸得清。沙洲依旧横在原处，看着沙洲的人却已换了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b07_watari_echo","hint"],null]']
src = "blake3:f9630072be8e308511f706145fae9edf0b4ccc1a9ee63d6a5eb311ef9282558f"
text = "渡川战后，自有脚夫把幡多的信儿送至船上，无须四处奔走。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b07_watari_echo","text"],null]']
src = "blake3:f61318ab8efa95e35c540dd575e67952059e9586db15ca4919f1d19ca0d7ec25"
text = "渡川这一仗打完，幡多田里的稻谷无人收割，倒伏着两家的旗杆。风声很快递到我跟前：弟弟领着几十名随从乘船遁往伊予宇和海的户岛，而中村御所大门上已经贴了长宗我部的封条。来报信的脚夫擦着额头汗珠说：“封条足足糊了两重，御所里豢养的猫儿都只得翻墙钻出来。”母亲移居到了足摺的一座小庵里，差人将一串铜环磨得锃亮的钥匙捎上我的船——那是中村御所的钥匙，说如今御所用不上了。她仅留下一句口信：“钥匙交予你。这门是开是闭，由你拿主意。”钥匙分毫不轻，所要开的却不再是同一扇门。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b08_kizugawa1","hint"],null]']
src = "blake3:522eeadce6f53847f4d45cd3817dd3a2f309bcc7fdfbb522481593cabd1d4720"
text = "1576年7月至8月中旬须抵堺，大阪湾即将开战。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b08_kizugawa1","news"],null]']
src = "blake3:805d17c962b95e834cf8ae767a05c7f6e2022ec748f68e949485541d3e9eb581"
text = "木津川口的大火足足烧了半宿，堺港的人都在讲，映着火光总见一艘土佐的小早来回穿梭。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b08_kizugawa1","text"],null]']
src = "blake3:9693176b7cd09f5ccf8025c027fd1965f4c6264ddfe62e04cd1b063d7488b76b"
text = "正值三伏，大阪湾上闷热异常。毛利家的运粮船队欲闯入木津川口，给被织田军围困的石山本愿寺送粮，押阵护航的是村上家数百艘小早；织田家的水军则死死截在河口外。堺港的埠头上，松脂与硫磺一日之内价格翻跳三遭，交战双方的买手都在抢货。我舱中囤了一筐焙烙，陶罐里塞满火药，引信露在外面——这是武吉差人送来的，还附了一句叮嘱：“第三排位置给你空着。焙烙掷出去便莫再回头望。”织田家驻在堺的采买也摸上了我的船，一双眼睛径直盯着我的松脂桶：“姬君这批松脂，织田家愿给双份价。战事一歇，拿在手照样是钱。”入夜潮水涨起，风向却逆着从河口往外倒灌。火器往前头抛，风势却往人脸上扑。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b09_yao_bikuni","hint"],null]']
src = "blake3:b6a52a8e369e6ca03b720da3521bc20145571fad84e9b40ccbc1135dd9915bd5"
text = "1576年9月过后前往日本海那侧的若狭小浜，须在1577年10月底前抵达。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b09_yao_bikuni","news"],null]']
src = "blake3:d9ca1de596ab6fda989dcb5600fae4fa36b91ade6c51e87742f9c6556ee9af3c"
text = "听说小浜镇上来了名戴龙纹戒指的番人，四下打探人鱼肉的下落，一条家的姬君竟同他攀谈了好一阵。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b09_yao_bikuni","text"],null]']
src = "blake3:9dd82d91226d4bdd94e95ff88a7329bef111ac92cda1f514ebaf96b47621af72"
text = "深秋的若狭小浜，日本海吹来的风已透着寒意。空印寺后山有一处石洞，相传那位食过人鱼肉、享寿八百载的比丘尼当年步入此洞，便未再现身，洞口还留着一株她栽下的白椿。打京里来的行商随口闲谈，说南蛮人在四条坊门起了一座三层高的寺院。镇上正有个番客四处打探“长生不老的肉”，日本话说得七零八落，指头上套着枚指环，刻着一条衔住自己尾巴的龙。他将我拦住：“人鱼的肉……或是血。小姐，你可晓得何处寻得到？我用金子买。”守在洞口的老尼正扫着满地枯叶，眼皮都不曾抬：“那比丘尼临进洞时留话说，活得太过长久，眼见着身边人都先走了。你当真还寻？”那番客充耳不闻，转头又问我：在你们神道当中，可有哪种血饮下便不会衰老？他指间那条龙仍死死衔着尾端，绕成一圈，又是一圈。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b10_togashima","hint"],null]']
src = "blake3:07bda4c1b331875d80246546151c9303bbfd96ea5df8f5a99f2111e0f0a9cece"
text = "1577年入冬至次年2月，宇和海那边的渔船会将户岛的信儿捎回下田。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b10_togashima","news"],null]']
src = "blake3:4a3c6b87bf01c24e2074e362dc7449b975f6e20eba988492142b867a2e5b3698"
text = "下田渡口都在议论，那位领过洗的一条殿夜半遭侍奉自己十来载的老臣挥刀砍伤，虽捡回一条性命，身子却再也起不来了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:b10_togashima","text"],null]']
src = "blake3:08d04a015a17bb14e2f920a25b34f014d3156a1e03d8685f3e2fed7c6ece8fbb"
text = "隆冬时节，一艘自宇和海归来的渔船将信儿带到了下田：滞留户岛的那位领过洗的一条殿，在夜里挨了近侍旧臣的刀，命虽算保住，人却从此瘫倒在床。岛上渔民把人抬进一间小庙里，庙内寻不见郎中，唯有这么个会诵南蛮经文的人守着。报信的渔夫蹲在船艏补着渔网，念叨道：“行刺的正是随侍了他十余年的老部下。他扑倒在地的当口，掌心还死死捏着那串念珠。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c01_iron_ships","hint"],null]']
src = "blake3:108cd9ff1b75ca3a83d4ebd08f1cae52f250674358a9c3f0c3046060c8834605"
text = "1578年11月中旬至岁末留在堺，九鬼家的巨舰正扼守木津川口。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c01_iron_ships","news"],null]']
src = "blake3:0348acd757f11ff766666f411670c9987c9aa1c75e76381575400175a57baf80"
text = "木津川口那六艘大船足足横亘了一整冬，听说有艘土佐的小早凑到码头边敲了敲那铁皮，直言里头是空的。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c01_iron_ships","text"],null]']
src = "blake3:04e1e90ad335f5bfbd5085d54a9c829729c2f69e22ab0d7c23eda78d76c62018"
text = "入冬时的大阪湾，九鬼嘉隆那六艘大安宅船拦在木津川口，船身比堺的佛寺高塔还高出一截。打奈良来的僧侣站在埠头上逢人便讲：“全铁铸的大船，火铳都打不透。我们寺中的日录里头都记了一笔。”却从未有人亲手摸过。堺城里的铁匠铺连轴转着锻打铁皮，说是九鬼家下的单，码头畔便码着高高一叠，片片铁板上皆留着铁锤印子。能岛的小早也再度现身，舱里照旧堆满一筐筐焙烙。武吉托人传话给我：“再火攻一遭，一如两年前。”我探手叩了叩那摞铁板，一旁九鬼家的造船匠人立时叫唤起来：“姬君使不得，这可是我家主公的船皮！”叩下去响声却发空。那铁板薄得很，无非裹在船帮外头的一层铁壳，并非整艘船皆由生铁铸就。然而巨舰上的大炮，射程却远胜抛掷的焙烙。船壳换作了生铁，船里坐着的依然是人。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c02_mimikawa","hint"],null]']
src = "blake3:b8e58e48af64e51affa664228202944e012e1f856ab5eca49a3236ef7a6f3e41"
text = "1579年1月初至4月底前往府内，胞妹阿喜多一家已安顿在彼处。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c02_mimikawa","news"],null]']
src = "blake3:3541ae62e5e37fb5734b0d7df50dd4f4ad990c877b36daa06c22fd319502fd7b"
text = "府内城中随处可见自耳川退下来的伤卒与遗孀，至于大友家那位领过洗的老殿下，听说早闭门不出了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c02_mimikawa","text"],null]']
src = "blake3:5f6b27f0336915ab4259f25061fa2cb2b921a873d4dd41ad1d1a909891bd08f0"
text = "经了耳川一败，府内城里满街尽是伤兵与寡妇。我的另一位妹婿田北镇周亦阵亡于日向。舅舅宗麟于去岁入夏时受洗，眼下深居简出，守在门外的老卒念叨：“耳川的河水全染赤了，淌了三日仍泛着红。”妹妹阿喜多本是伊东家的遗孀，打从伊东家倾覆，她便携着两个幼子避难到丰后，栖身于借来的宅舍中；大儿子在安土的神学校求学，听说还会拨弄南蛮的琴。落雪的夜里，阿喜多自一只旧木匣中捧出一沓从土佐递来的家信予我看。压在顶头那一封正是数年前我所写的，连我自己都早记不清了。她轻声道：“姐姐，朝东渡过这片海便是土佐罢？我住在这边，半夜总错觉听得着四万十川的水声。”那些我投寄罢便抛诸脑后的信笺，她却一纸不落地妥帖收存着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c03_yasuke","hint"],null]']
src = "blake3:5b2cca627ef2cdabb300f738748cf8d491d9bcf785e64d1e6a1b3457730eecd4"
text = "1581年3月至9月驻留堺港，自彼处进京观礼马揃。若通晓葡萄牙语，有桩话不妨当面一问。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c03_yasuke","news"],null]']
src = "blake3:a483e988b6b819019184885d6207fb14cf94f2d684c4b7e6f6a2d07bd7c4ca83"
text = "京师满城的人都凑去瞧信长麾下那位身量奇高的南蛮家臣，听闻他站在一棵柳树下，同一条家的姬君叙了半晌话。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c03_yasuke","text"],null]']
src = "blake3:c1a2a7e6bef2c3ec68e3d42e96310d3f17ab4f2093c3f906023e3b4e67527208"
text = "开春后，我打堺动身进京。京城里头人潮涌动，个个争相目睹随南蛮神父东渡而来的那个高大汉子：通体肤色乌亮，身长足足高出常人一头有余，信长替他赐名弥助，又赐下一口短刀及一处宅院。马揃大典当日，信长端坐鞍上都屡屡回首望他。待人群散尽，弥助在一株垂柳下唤住了我。他从神父口中得知，土佐一条家的海船常跑极远的水路。他掌心紧握着一封信札，乃托神学校的修士以葡萄牙文代书，寄往东非的基尔瓦——收信人名叫巴拉卡，是个金商之子，昔年曾将他从奴隶贩子手中赎救出来。“弥助这名字，是主公赐的。基尔瓦那位，唤的是我另一个名字。”他吐字极缓，非得把前一字咬实了方吐下一字，“这封信得跋涉许久。走上一年、两载，皆不要紧。他会等下去。”说罢他反问我：你的名讳是谁替你取的？素日里数我接话最利索，这回却硬生生半个字也接不上来。澪，意指隐没在水底的那道深槽水路。是父亲替我起的。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c04_embassy","hint"],null]']
src = "blake3:b60a559912e25dfbb8c560c74b8c31a3bcf79814ece85b9c42e2bfb8985c2e1b"
text = "1581年11月中旬至1582年2月19日期间抵长崎，黑船正候北风起航。备上一千金币或一幅日本沿海图尤佳。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c04_embassy","news"],null]']
src = "blake3:058041b52381db0ba5e92122aea8618c7546881d90d1c60efb741ad01edefe3b"
text = "听说长崎港的黑船候着北风那几日，一条家的姬君亲自上码头为伊东家的孩子送行，站在一溜标了名姓的木箱旁许久。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c04_embassy","text"],null]']
src = "blake3:efb76a1cfecd7ea2f2a7dc50f5c89dd0cbc541e47bd77c28b777d9eba429ead0"
text = "寒冬的长崎港，黑船停靠在海湾里静候北风。会院当中，四名十三四岁的少年郎正结结巴巴地诵着拉丁文。充当正使的伊东满所出身伊东家，论起来正是妹妹阿喜多夫家的宗亲；原定随行的本是阿喜多的儿子，只因人在安土求学，实在赶不及登程，方才改派了满所。少年们随身的行李木箱在埠头上列成一排，箱面皆题了名姓。满所一眼认出我折扇上的假名字迹，说是阿喜多夫人指点他习字写信时，使的便是这路字体——那还是幼时我手把手教与妹妹的。他仰起脸问我：“夫人提起过，您的海船闯过极远的去处。罗马……可比那儿还要远么？”范礼安正立在码头上调派铺位，铺位紧俏得很，他朝我投来一瞥：“船上每一张铺位，皆须用一桩从日本带回的故事来换。小姐可愿讲一个？”那孩子的木箱立在身侧，比他人还高。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c05_summons","hint"],null]']
src = "blake3:c61f6e98e5ef17010bb747d9ce4328e509db0e68fb3a06439de56ba946b03e54"
text = "1582年7月往后，京师那桩大火的信儿便会传遍四海，船泊在何处都能闻风。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c05_summons","text"],null]']
src = "blake3:4d5c341550fc9b29b86ed688e1bd983e5ff6bf886057a589a0eb0dc5ff08a0eb"
text = "京中本能寺那夜燃起的烈焰，消息辗转渡到海上时已近六月尽头。外头众说纷纭，有言信长已葬身火海，有言他早已由后门脱身，亦有人传那位高大身量的家臣落入明智部下手中又被放了。前来递信的船老大连连摆首：“京城传出的话，十句里头顶多信三分。”入夜，我在舱中展开那柄桧扇。扇骨上题着当年七夕夜里隔着白绢写下的和歌：银河此岸，银河彼岸。我仰首数着星宿，猛然间竟品出另一重意味——所谓银河彼岸，原不在天上，而在西方茫茫海面之上。平户酒肆中的南蛮领航员曾言，来岁盛夏木星与土星交会于双鱼宫，“亚速尔西面的海草届时会让开一道水路，老领航口口相传皆是如此”。手里的扇子收拢又摊开，回过神时，我已在腹中默默盘算起船期：果阿、好望角、里斯本。和歌虽是朝着天际写的，这把扇子却始终未离过海面。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c06_dark_sea","hint"],null]']
src = "blake3:d4966e71833bb373f9a0d4401b37403b4a5992ca27b5bcc760fbc7a869dbadc1"
text = "1583年4月至9月须抵亚速尔的安格拉，自日本起锚少说走大半年。传闻若想驶入西边海草丛，须携着苏醒的《翠玉录》。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c06_dark_sea","news"],null]']
src = "blake3:fc6bbe6e769f5a3fd706031a99dd7a25f70a86665945618b43e3c4c1248605e3"
text = "安格拉的港民都讲，圣克鲁斯侯爵攻占特塞拉那年盛夏，西边海草带外曾现身过一艘日本小船，船艏立着个持扇的女子。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c06_dark_sea","text"],null]']
src = "blake3:4493e3ff3d6d75e3030d9ca3c3478baf22c8b3e425ac8bd4a6f239ba0bd081b0"
text = "仲夏的安格拉，特塞拉岛港湾里头硝烟弥漫。圣克鲁斯侯爵统领的船队方在岛东抢滩，法国兵同唐·安东尼奥的部众正朝山中退避。我的座船漂洋过大半载才好容易泊到此地，藏身于一众西班牙巨舰投下的阴影之中。侯爵麾下的军官逐船颁令：“未得准许，无论何船皆不得西进。西面空无一物，什么也没有。”埠头上一名年迈的葡萄牙领航朝地啐了一口：“什么也没有？那每逢入夏往西去的船，究竟都驶往何处了？”朝西航行半日的水域，成片海草一层叠一层地浮上水面，海风骤歇，罗经盘里的磁针打起旋来。我将那柄桧扇摊开，摆在船艏罗经旁侧，月色洒下来，扇骨上的字迹泛着惨白。那磁针兜转良久，末了竟定定指向扇面所朝的方位，并非正北。当年七夕夜里隔着白绢递诗纸，同样是这般教人看不真切对面。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c07_after","hint"],null]']
src = "blake3:f89a8b5380c8f3b2a0133f4a0e58072b8becb49d1ddfba339054e408bdcaaca7"
text = "1583年10月之后，每逢靠岸总听人谈及亚速尔那年盛夏；雾障彼端倘有未尽之事，宜早了断。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c07_after","text"],null]']
src = "blake3:4004b42daa3f9f102a04d4dbc69fb6780fcda4ad3203d200bb75212b7b68894f"
text = "入秋后，一艘自里斯本返航的葡萄牙船驶入了我停泊的港湾。一众水手围坐在船艏闲谈起亚速尔来：说那年夏天，西面海面上密密麻麻尽是船影，海雾却浓得化不开，折返的人个个守口如瓶。当中一名缺了门牙的老水手接口道：“我们船长方驶抵海草边沿便下令调转船头，半句多余的话也没交代。”另有水手在兜售打里斯本捎来的玻璃珠子，手指拨弄着珠串一边搭腔：“雾没散？早散过了。无非看肯为谁散，不肯为谁散罢了。”他还道，折回的那几艘船，船艏皆平白多出一件物事，每家的还各不相同。那个盛夏，我终归没赶上。我将扇子平搁在膝头，静静听了一整晌午。去得了去不了，手头握着的，总归还是这一把扇子。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c08_kanesada_dies","hint"],null]']
src = "blake3:8828eb77451616464fb2c34d056590cd155e20009e6f474eec77ec6bc6bce936"
text = "1585年7月中旬至岁末返抵下田河口，宇和海的渔船将捎来讯息。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c08_kanesada_dies","news"],null]']
src = "blake3:72e679253e8d499935201e17341d8134074b34d14d8f63249ff21f01e5551333"
text = "下田渡口传遍了风声，土佐昔日的主君一条兼定已然作古，咽气时掌中仍紧握着一串南蛮念珠，口里喃喃的还是土佐乡音。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c08_kanesada_dies","text"],null]']
src = "blake3:0f09ff294b477ff80cf39a0a23269a47e0fd13f8bfd8558b3223f0661d0ce642"
text = "盛夏时节，秀吉统率大军渡海踏入四国，长宗我部随之归降。就在这月里，自宇和海归来的渔船递回凶信：避居户岛的兼定殁了，年方四十出头，岛上渔民按南蛮礼数替他竖起一座木十字架。传话的渔人道：“殿下撒手时，手里仍死死攥着念珠，嘴边咕哝的却全是土佐话。”我在下田河口亲手燃起一盏河灯，安放在那道沙洲之上，候着潮汐将它送出海去。一旁补网的老妪瞧在眼里，叹道：“趁着涨潮放灯，它是漂不走的。”那盏灯果真未漂远，就这么搁浅在沙洲上，孤零零亮至拂晓。灯火不肯离去，像极了他。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c09_edict","hint"],null]']
src = "blake3:315cb6096cd291798ff2ae46271752918d60cfbc75e815a90f5c66b615ffb313"
text = "1588年下半年往能岛关所去一趟。阿濑手缝的那面过所旗，始终贴身收好。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c09_edict","news"],null]']
src = "blake3:afc83cf3491fd9d128b4e98910682a8ff3a3799e9450a50e38d1bbaebc14d525"
text = "听说能岛关所门板上钉了关白的告示，一条家的姬君独自在空荡荡的关所内坐了整整一个晌午。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c09_edict","text"],null]']
src = "blake3:f4f5858d850279ae964b36f330d8dcfe054eb8822aff452251c465bb3784d407"
text = "夏末的能岛，关所门扉上头钉着一张崭新榜文：自此往后，海上严禁征索帆别钱，亦不准私售过所旗，敢违者俱以海贼论处。武吉早于前年奉命移镇筑前，这岛上唯余几名看守屋舍的老水手。武吉托人传来的口信犹在耳畔：“缴上去的旗，关白自会换发你一纸文书；一把火烧了的旗，大海自会替你记住。”老水手从关所屋檐下抱出那捆尚未卖出的旗帜，最顶上一面正盖着能岛的石印。他抬眼望我：“姬君，这旗算不得数了，船总还算数罢？”我袖袋里还贴身藏着阿濑当年密密缝就的那面过所旗，旗缘的线脚已被摩挲得发白。我朝着空空落落的关所念了一声：“旗钱，先付。”话一出口自己先忍俊不禁，老水手也陪着笑出声来。旗到底只是匹布，潮水可不是。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c10_epilogue","hint"],null]']
src = "blake3:38da86b10ac12fda12706a947e15aa475b4035be514f128f8321ccee61a7cf57"
text = "1590年8月过后，小田原开城的消息将传抵平户，且回平户候信。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio:c10_epilogue","text"],null]']
src = "blake3:e152b0e49189db3ddad8b4efd041f74b7f28e32d56b907b47d0f15465d896774"
text = "小田原开城的风声传至平户时，天下已归一统。年届五十的我坐在平户埠头边，双膝上搁着那柄桧扇——扇骨早被经年的海风吹拂得温润发亮，扇面纸也贴补过两遭。港湾里一群孩童正拿小船赛着玩，当中一个系着红白发绳的女童落了败，吵嚷着非要重赛一局，嗓音倒比得胜的那孩儿还亮堂。她心里咽不下这口气，蹬蹬跑近来瞪着我的扇面问：“婆婆，这扇上头写着甚么呀？”我顺手将扇子展开。这许多载光阴，里头那首和歌我在甲板上默读过，在潮汐畔默读过，在弟弟的河灯边也默读过，却从来不曾出声念诵。唯独这一回，我朗声吟了出来。歌里咏的乃是银河此岸与彼岸，当中横亘着一道无形的水路，有人伫立此端静候涨潮。女童听了，蹙起眉头寻思半晌，开口道：“那直游过去不就成了。”边上赢了的男童噗嗤笑她，她反脚便踹了过去。旗帜换了一茬又一茬，手边的扇子却唯独这一把。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_fan_left:f1_after","hint"],null]']
src = "blake3:bb6f94af76dba7fcd562a319c6f40c3f64f97cdba3732f3e55b92c2c0e6a67c5"
text = "1583年10月往后，返航途中进一回港即可。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_fan_left:f1_after","text"],null]']
src = "blake3:ad85eb98aa51250e7049ff9adecd6bd9e4652099f427ebc5d0d47b38c01f0784"
text = "入秋时，船穿出重雾，靠进了返程的头一座港口。缆绳还没系妥，我顺着旧习惯往左腰一按，手底却是一空。扇子早叫我亲手留在雾那边一根柱子脚下，扇骨朝里搁着。系的是条旧腰带，扇骨别了将近三十年的地方，磨出一道发亮的印迹，料子比旁处薄，指甲一刮就能分明。码头上正有人扯着亚速尔的那个夏天，说起一路西去的船，口风比我这亲历的还要热闹。舵手说，等回了平户，去町里另买一把，要堺地运来的，泥金扇面。我回道不必了。那首歌我全背得下来，半字未失，日后无非是再不能伸手掀开罢了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_fan_left:f2_epilogue","hint"],null]']
src = "blake3:a823d6a5dcce7e9983fed56b5c1c7d207182780b0297a64d3f54dcf01c7d5cf8"
text = "1590年8月之后，东边的风声会递来平户，人需留在平户。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_fan_left:f2_epilogue","text"],null]']
src = "blake3:5c3fc1204dcfda83f181ca73ac36e6773b89d11dce263ec97d07f9f687db4d53"
text = "小田原开城的风声递到平户时，天下已归于一家。五十岁的我坐在平户码头边，双手空空地搁在膝头，腰带上的那道印子经了这么些年，始终没有消褪。港湾里一帮孩子正划小船比试，有个系红白束发绳的女孩输了，吵着要重赛一局，嗓门比占先的那个还高。她心里不服，奔到我跟前，眼睛盯着我腰间：“婆婆，你这儿怎么有一条发白的印子？”我告诉她，从前这儿别过一把扇子，留在了极远的地方。她又追问扇面上写着什么。这么多年头，那首歌我在船上默诵过，在潮水边默诵过，也在弟弟的灯旁默诵过，偏从未念出过声。这一遭我开口念了。词里说的是银河的这头与那头，当中隔着一条无形的水道，有人在这边候潮。女孩听完，蹙着眉想了半晌，说道：“那游过去不就成了。”一旁赢了的男孩笑话她，挨了她一脚。旗换过好几面，歌自始至终只有这一首。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o1_cape","hint"],null]']
src = "blake3:5efc89ac1b546b93fb2aafd56af4568b0e3e56dfb1cc9a82da7d0a6f53bd00d6"
text = "1576年3月之后至1577年2月底之前，把船绕去足摺岬下的清水，上岬上的庵里走一趟。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o1_cape","news"],null]']
src = "blake3:2b3b0f1403ef15ffed094504b60b9e00c531ba20e866a3245e61d5312a5c8eb4"
text = "土佐清水的百姓传言，一条家的姬君把船停在足摺岬下，登崖去探望住在庵里的母亲。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o1_cape","text"],null]']
src = "blake3:498b7c5da133c41cb740d8aa3ecdd7f3e319947938bd0f9ffd6f1f33098660ec"
text = "入春后，我从下田绕行至足摺。母亲离开中村御所后，便栖身在金刚福寺下方的一座小庵中。庵背靠悬崖，崖底便是那股往南去的黑水。两名长宗我部家的足轻守在庵外，见了我的船旗，恭顺地让开通道，其中一人还顺手替我掀起门帘。母亲正跪在廊檐下采樒，篮中铺着一层青叶，指尖被汁液染得泛绿。她头上的布巾已旧，整个人较我记忆里瘦小了一圈。一见我面，她最先问起的却不是我，而是兼定：“户岛冷不冷？那边的人给不给他炭？”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o2_crosses","hint"],null]']
src = "blake3:5c04311b22661f77be84054a99982d27bae8440a8ad8c7059e4edfbf7825533c"
text = "1578年9月中旬过后，足摺那边会送来一封由人代笔的信。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o2_crosses","text"],null]']
src = "blake3:079fa330e14999c9dda1bbbc4178cc811024bc1049423f62dc5ea98c979e29e7"
text = "入秋时，母亲的信追到了我的船上。正文是母亲口述、庵里老尼代为誊录，末尾才见她自己写的几字。说是丰后那边来了人，言及义镇已在臼杵领洗，起了一个南蛮名字，与兼定一般无二。“一个是我弟弟，一个是我儿子，全归了那尊神去。独留我坐在阿弥陀佛前，竟成了阖家当中最后一个。”这一段，想是代笔的老尼心存忌惮，墨迹抖得不成样子。最末是母亲亲手落下的几个字：“他们的神收不收我？我又不稀罕。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o3_bead","hint"],null]']
src = "blake3:ac0e3880876e87509a6207dbbaab0c64768434ad4aa8d90ff8de6e45fd26885a"
text = "1580年3月之后至1581年岁末之前，抽空再去趟足摺的清水。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o3_bead","news"],null]']
src = "blake3:f05ef6c44f1848a01b59f984919ad4150e3d712e7f89f6d7498d4a54093cbd31"
text = "足摺打渔的人家说道，一条家的姬君又上了悬崖，在庵里歇了好几宿，船上的灯火整夜整夜地亮着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o3_bead","text"],null]']
src = "blake3:e88c8eb09fcbc1a1692bc5b291716ffbc661981c0b2778c24d8a57bc01b635d9"
text = "开春时我又往足摺去了一趟。母亲的咳疾越发深了，夜间只能坐着打盹。她指间拨弄着念珠，每次摸到那段空着的位置，都要顿一顿再接着拨，这么些年来一直如此。我伴在她侧旁，袖袋里藏着的那桩事已压在心头七年：宗珊临危前托人送来的那页纸，以及纸上那行“不是狂疾”。家里上下一口咬定了三十年的狂疾，母亲便默默念了三十年的佛，替一个心智迷乱、无力开口的人念着。窗格之外，金刚福寺的钟声恰好敲响了一声。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o4_bell","hint"],null]']
src = "blake3:a01ed253a393b067e71105eca88c0d58a22b016e60fdb6410055b998cb34a1b9"
text = "1586年2月之后至年关以前回到足摺的清水，庵中有人捎信来相请。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o4_bell","news"],null]']
src = "blake3:008ceb66c0634d587c614b44cb44c03778bae8929af4820ef8165f2d01366b43"
text = "足摺的渔民们在说，金刚福寺下方那座庵里的夫人故去了，她女儿乘坐的船在悬崖脚下整整停了七宿。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_cape:o4_bell","text"],null]']
src = "blake3:59d55f4791881e910eeef1ef395ff3e7b8b709de86ffa64df1fb3ecfd78fa9d7"
text = "自打兼定没了，母亲便罕有言辞。庵里的老尼捎信往平户，说夫人怕是熬不过这个冬日。我迎着凛冽北风赶了二十日海路，及至足摺，崖壁间的樒正开出白花。母亲卧在廊檐之下，面庞朝西，手掌紧紧攥住那串念珠，指节都泛出了白。老尼低声说她已三日念不出声，可双唇始终在微动。我跪到她枕畔，她睁开眼眸端详我许久，像是竭力去认一个身在极远处的人。恰在此时金刚福寺的钟声响起，她的嘴唇随之轻轻动了一下。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s1_return","hint"],null]']
src = "blake3:ab28e82756047bba9cc179fada30ac0d3a8312f23113e49de04d74d446e12ca7"
text = "1570年4月往后、1571年3月底以前，人在下田的话，阿濑有话想对你讲。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s1_return","news"],null]']
src = "blake3:3ab9fc2686a6cd70dda771b1d6503da2728ef89d46ea0e77a6e5431037a13401"
text = "听下田河口那边传，能岛来的那位乳母准备回岛去了，网棚里的家什摊在河滩上晾了整整一日。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s1_return","text"],null]']
src = "blake3:23d10b9401cfa9f218e83e86eb9d5d14164de745a8109fa424e87a778eca7b6f"
text = "开春后，阿濑清空了网棚，把旧网、梭子连同一只渔具箱全摊到河滩上日晒，箱底还压着一册泛黄的旗账。她年已五十八，右手早使不动船篙，织补渔网全凭左手。“我打算回能岛去。”她开口时平淡得像在说潮水何时转流，“村上捎来信，说番所旗账上头，下田那一栏至今悬空着。我回岛亲自填上。”待网晒透，她逐张折齐，手搭到最末一张时顿住：“姬君行船，送我一程吧。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s2_fuses","hint"],null]']
src = "blake3:1e63df6014c98aae3a7ab20012bb490d73fad89138de10e8cec9a6fdb3c6f263"
text = "1576年5月中旬，能岛将有书信寄来，执笔的是汐。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s2_fuses","text"],null]']
src = "blake3:55a90880afcf64d7ce3aea316f558fde4f375ff7825f19cd9a3d3e35976d6d69"
text = "五月间，能岛传来一封书信，字出汐手，说的全是阿濑的话。阿濑在番所里领着岛上女眷搓焙烙捻子，麻絮裹着硝一层层绞紧，松了烧得急，实了又点不燃。“单凭一只左手，我搓得仍比她们双手麻利。”信上说，武吉大人替姬君留出了第三排，“姬君排在第几排，我懒得管。唯独请姬君记牢：扔火前先拿舌尖舔湿指头，举高试过风头。”信尾附着汐自己添的一小行字：“娘说她也要去。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s3_last_oar","hint"],null]']
src = "blake3:d9cee6edeffd2357c42ed2508899be5c20c51be5f8728314818deabc3a4fb121"
text = "木津川口一战过后，赶在1576年年底之前回一趟能岛，身畔多备上五百金币。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s3_last_oar","news"],null]']
src = "blake3:114a75dcd18aa07f9f7b4e051c9484acd15f0d19e47f597278a30dddb8dfec91"
text = "能岛的人传言，木津川口那夜，番所的老阿濑独自划小早冲进火场捞人，半边身子都被烧伤了。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s3_last_oar","text"],null]']
src = "blake3:8d2ec07e66ecc0f56398a6ebb56747aabba32fe938544bdd9474c72a9bdc03de"
text = "木津川口那夜之后，我回了能岛。阿濑仰卧在番所里屋，右半身裹着一层浸过油的布，屋内弥漫着焦头发气味。守在床畔的阿松婆说，当晚河口火势起来，有艘小船翻沉，一船人悉数落进火光映照的江水里。阿濑当下解开一条小早独自划去——仅凭左手操桨，桨柄顶在胸口，一下一下往水里推。她拉上来三个，第四个才拽到半道，船畔的焙烙炸了。“她嘱咐谁也不准透给你，”阿松婆道，“她说那几个人都是交过旗钱的。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s4_needle","hint"],null]']
src = "blake3:2fa0f8d5e08937817074db75bd2370e96a589d17d5a519e036e8a2f239c6ae57"
text = "1577年春初，汐还会再寄信来。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_oar:s4_needle","text"],null]']
src = "blake3:7e770ca4053ae8691763dbc9e8afe155ecfeeefe262234a6292c3430db21a78b"
text = "入春时，汐捎来的信到了，短得胜过从前任何一封：娘走了。腊月里伤势已好大半，正月偏逢落雪，她定要上泊位看一回潮，回来后便再没起过身。咽气前，她解下领口别着的那根针让汐留好，言明是缝姬君那面过所旗的，“旗若没坏，针便不许丢”。信纸里还裹着一页抄录的番所旗账，最末那栏，执笔的老者已替她补妥：下田·濑。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p1_water","hint"],null]']
src = "blake3:cb64c1c0d27b820d75ba5bf64c9aa6bf68994e875d572110a37d54b751bca64c"
text = "1575年11月中旬往后，兼定会寄信过来，在哪个港口都能收到。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p1_water","text"],null]']
src = "blake3:1439ffd38439257bf6086f2a836d3a9305d72645d39eedf56a10384c20a1256e"
text = "渡川之后收到的头一封信，是兼定写来的。通篇使的假名，字体一个挨一个立得端直，偏是“姊上”二字依然朝右歪。渡川和中村他一概不提，径直从受洗那日落笔：神父举水往他顶上淋，水顺着青头皮溜进领口。“凉。我自小跌了不痛，折了手也不痛，那天水浇上头来，偏偏觉着凉了。姊上，原来我还是会觉着的。”信尾他说，住处近旁些许渔家孩童想学写字，问我可否顺道捎去一刀纸。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p2_confession","hint"],null]']
src = "blake3:5f256a84c133f734586009e8789fa866e437dd7f166a41a62e25a33a9a67ff5d"
text = "1577年3月至10月人在下田，兼定那边会遣船过来相请。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p2_confession","news"],null]']
src = "blake3:cee95bc23bfc91f454264150f658cd21651f8fe50e17bc64209f7f29ac73d890"
text = "下田传着话，讲户岛来了条小艇接一条家的姬君，说是那位受洗的殿下有事要当面细说。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p2_confession","text"],null]']
src = "blake3:95149b0fc74124a71ee9ff8617b25db9e1ba38db900330484bab4fd6bfb40a35"
text = "入春，一叶小船靠上下田栈桥，领船的禀报说一条殿邀姬君去一趟：“殿下称有要话得当面言明，写信讲不明白。”我去了。他落脚的地方有间小庙，改饰成了南蛮规制，门楣钉着个木十字，室内旧佛龛仍在，只是里头的佛像搬空了。兼定跪在十字下首，候我坐定才回过身：“我在神父前头告解过了。”头一桩提的是鹿，春日野那只小鹿。“神父不知鹿是什么。我讲了一整宿，他听懂了。”第二桩提的宗珊。一说到这名字，他把双掌平按在膝上，手背上的青筋一根根暴起。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p3_blade","hint"],null]']
src = "blake3:e6a7276fec1acef3c32d6faddb4eb96b4de0207073d5e136af3b39c275056b4f"
text = "1578年开春时，户岛会寄信过来。钱袋里备好三百金币，回信兴许用得着。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p3_blade","text"],null]']
src = "blake3:aa889624f8046547f1317e76b05e68711ddcdd445d13199402115eea8ea47e12"
text = "开春时户岛来了信，并非兼定亲笔，而是庙里那个会诵南蛮经的人代写的，字写得笨拙，事情倒交代得明白：殿下的刀口长好了，唯独左手举不动，腿脚也不灵便，日日叫人搀着坐到门槛外晒日头。砍他的那名旧臣并未逃远，就躲在对岸山中，渔家的年轻人想去捉拿，殿下拦着不许。“殿下道，那人追随他十几年，砍这刀是替宗珊大人砍的。”末了一行是兼定亲自补上的，字歪斜得极厉害，好似用拿不惯笔的手写的：“姊上莫来报仇。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p4_visitor","hint"],null]']
src = "blake3:d2128caaf149acdc6cc7d63888f8fc9cf59e7d2c6442abdd746495c3599e1fd0"
text = "1581年5月至10月若到府内卸货，南蛮寺的人便会寻到码头上。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p4_visitor","news"],null]']
src = "blake3:1943d0d20c041fec8ae53c00fcbaf70c98d1943f225702953bc5ec166ffd131c"
text = "府内有人传话，说南蛮的巡察使要前去探望受过洗的一条殿，一条家姬君的船恰也靠在码头。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p4_visitor","text"],null]']
src = "blake3:6f9b99d1f35d23200dd728e1a150622dfd0d858514905928f84cafdddd648a57"
text = "夏日里，我的船停在府内卸货，南蛮寺差人寻上码头，说是巡察使大人要往宇和海的户岛探望一位受了洗的老殿下，问我肯不肯开船去。那巡察使是个高挑的意大利人，身量比南蛮寺的门框还要冒出半个头，日本话只会说三两句，照面时先合掌，又跟着画个十字，教我一时间不知该还哪一桩礼。他道是听说那位唐·保罗在岛上教渔民孩童学字，“使他自己的字，非我等的字”。他很想过去看看。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p5_cross","hint"],null]']
src = "blake3:4e4914a6d2fcff19fda425ae7086d032b1ebe4a23a8f45f84165df8c637223c4"
text = "1585年9月至次年正月在下田，打那边起程往户岛去一回。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p5_cross","news"],null]']
src = "blake3:162abc9e6ba607e1420b6ee0e8423445895cbb41ca6227df33f3485fceab8ff1"
text = "下田渡口流传，一条家的姬君行船去祭了胞弟的坟冢，墓前竖着一座木十字。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_rw_paulo:p5_cross","text"],null]']
src = "blake3:3a391d592cb2a0b7e11f16b366f6f4938a462746a9e05b6b8f676b6ded422932"
text = "入秋转凉后，我去了趟户岛。渔家把兼定葬在小庙后方的山坡上，坟头立了座木十字，横木刻着数行字，都是他生前亲自写下、教人照样凿的：头一行南蛮字，我识不得；次行写着假名，是他的教名；最末是“一条兼定”。匠人临摹他的笔意雕刻，刻得颇本分，连他平日的习气也跟着刻了出来——个个字往右倾着，像顶着强风走路。坡脚有几个孩子在礁石滩晒网，当中一个望见我，跑上坡来，指点着木十字道：“殿下教的字。”"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_tosa_held:held","hint"],null]']
src = "blake3:c95b306110dcf3a79c3bb752354c3f23d432a0f2591b21f33dc9e43914dca7cb"
text = "1575年冬至来年3月，身在下田，便听得见幡多那头的风声。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_tosa_held:held","news"],null]']
src = "blake3:596c8041e9da0c37a822ae4ab93ac0799963fdfd8a8656abfd769ad1a137e07e"
text = "听幡多人讲，渡川战罢，一条殿重回中村的御所，四万十川上往来的，仍是一条家的渡船。"

[entries.'["stories/main/main_mio.toml",["chapters","main_mio_tosa_held:held","text"],null]']
src = "blake3:ab43b9bc83e96a227b4ddda4aef427c05fd01b2a84c9a941843d47f95925a755"
text = "渡川一战过后，四万十川上往来的，依然是一条家的渡船。中村御所门前再度悬起藤纹幔幕，殿下重又住回御所，侍女们忙着将蒙尘的屏风逐扇拭亮。撑渡的老船夫见人便说：“长宗我部的人退往渡川东边去了。这条河，仍旧是一条家的。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:flag_first","reply"],null]']
src = "blake3:300deaabf0012e5e17e992bacbc8ca94d3c434dadc8aebbac5799d9266a6b1ae"
text = "船东缠磨了足足半个时辰，打堺港的米价一路哭诉到家中老母染恙，末了仍只得乖乖将旗钱倾进我掌心。他尚在逐枚点数，我早开口报了总数：“少七文。”他只得将两只袖笼翻了个底朝天，这才好容易凑足。老舵工接过旗攀上高桅，替我将旗挂上了桅尖最顶处。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:flag_first","text"],null]']
src = "blake3:5b5524c1ad7ab0249350bee78fc9eeed57d1282a2d0e38df8165f2eb9b990a28"
text = "依能岛规矩：旗钱先付清，不付不开船"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:go_alone","reply"],null]']
src = "blake3:0b61f13398b43a4a146ae8ce28469cbe2fd26ef2e9fe2bb45784876d8afe7e32"
text = "我松了缆绳径直驶离。船东立在栈桥上高声唤我折返，嗓音教北风撕散了大半。驶出河口之际我回眸瞥了眼那艘大船，满载的杉木压得它吃水深及第三道漆线。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:go_alone","text"],null]']
src = "blake3:1a52e9ad102ef4a0b4257680e953079b48ef490872eef862fe338aa737a69fc3"
text = "推掉这桩买卖，独自驾小早先行去堺探行情"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:his_price","reply"],null]']
src = "blake3:a8033ae5c4302312c954e6461624e778e35a6761af14765f7738422e48de7f14"
text = "船东顿时乐得合不拢嘴，当下点出一半，余款立在一纸借据上，摁了枚油腻腻的手印。老舵工站在一侧直摇头：“姬君太心慈。日后行在内海，怕是要吃暗亏的。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a01_sakai_ship:his_price","text"],null]']
src = "blake3:88353ce62ee9c9c09049e30987ce46ed8db79cd3b5c91682108769cfbfe73308"
text = "依他开的价接单，先将船护送至堺再议"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:hide_crate","reply"],null]']
src = "blake3:7d45d5da934ba0b2fe58e46be930a2ff7aff40df25fb5108a052ff85bced0366"
text = "我吩咐水手将箱子同一捆杉木捆绑在一处，转而邀那伙计先去查验邻船载的纸货。待他折返叩了两下箱木，觉着回声一般沉闷，便起身离去。船东暗地里多往我手里塞了份钱，附耳低语：“待抵了平户，尽管报我名号。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:hide_crate","text"],null]']
src = "blake3:fddca6011cb87241ade9922bd80dfb8e50eddbe61ead31de596d9ea834be195c"
text = "帮船东将那箱硫磺遮掩过去，讨他一份人情"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:honest","reply"],null]']
src = "blake3:30a416ce8e5cc11ee2c549aa101141a1cfb0948a23386c04466398f42b816bd9"
text = "伙计掀撬开箱盖，露出满满一箱黄澄澄的硫磺，直呛得他咳嗽不止。船东被罚了一笔，朝我投来的目光恨不得把我推落海去。倒是会合众的账房先生将我这艘小船记在了心上，往账簿上新添了一笔，“一条”二字落得工整端方。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:honest","text"],null]']
src = "blake3:b7a02feb190f97a963e39188ebc3f29d56b8ab58e246f5f066c9e4ae69985a83"
text = "人船带货悉数交由会合众盘查，一箱不藏"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:sell_flags","reply"],null]']
src = "blake3:750d460fb674bbff690802a726ca74cbbe875e50c649c916d1c3b11c0f6a73db"
text = "候着驶入濑户内海的船只塞满了半座码头。我一面挨着一面卖出去，末了一面售与了个操着浓重博多口音的汉子，他意欲赊欠，教我一口回绝。进项分作两份收好，其中一份以纸包妥，封皮题上“能岛”二字。至于那只敲着发闷的箱子究竟如何过的关，我再不曾回首多望一眼。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a02_ashizuri:sell_flags","text"],null]']
src = "blake3:16275cbf88baccc6ac3973b20185af257a2a9b1c89aac8bcd938ec0d8b049d79"
text = "趁泊在堺港，将随船带来的数面能岛旗卖与要入内海的船"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:carry_letter","reply"],null]']
src = "blake3:22aefc1de969c30035d561d101c6f07868c8c64dbaeac487465fcb96420ee3d9"
text = "我依足宫中奉书的体例拟定草稿：起首三行尽是谦恭客套之辞，要的物事却一桩桩隐在客套底下，教人推辞不得。王直浏览到半途笑出声来，赞这手字迹远胜他船上火长所书，当即差人将火长唤来观摩。弥七接过信稿，言明这一纸书信由他亲自递到使者面前，绝不假他人之手。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:carry_letter","text"],null]']
src = "blake3:1a5126633a4e45d9af1796b08bbbd78879588627edff5059be21139ba8590b31"
text = "代王直拟一纸书稿，托胡宗宪派来的使者捎回"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:doubt","reply"],null]']
src = "blake3:1d123cfefee19d643dc3700a45b41aadaa9b4a08162cd20ab8b71e57ab3f5598"
text = "我将宫廷中的窘境细细说与他听：紫宸殿屋顶渗漏雨水，御所操办一桩即位大典尚须仰仗大名凑钱，公卿们捧着折扇登武家门第讨要米粮。王直听罢，将冷透的残酒倾回酒壶之中，吩咐弥七录下二字：“三成。”弥七依旧未动笔，仅微微颔首。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:doubt","text"],null]']
src = "blake3:7269e3188e8cb02b2a2340739d100655b398c03728a048d191f1ec06f4b6eb8f"
text = "实话实说：朝廷许下的话，仅三成算数"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:sell_flags","news"],null]']
src = "blake3:621959dd8e038d4934085930c3b18ced867f3c0d22c8560f2947ddb0c2126318"
text = "平户街头都在讲，王直船队每艘皆悬了一面能岛的旗帜，那旗钱全是由一条家的姬君收去的，半文钱也不曾松口让过。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:sell_flags","reply"],null]']
src = "blake3:f3c92d7075865fc533c2161578a52953b14aa605079478646aacacf30124883d"
text = "王直半句推辞也无，唤来一众火长列队领旗。及至轮到林晚灯，亦为自家的船讨了一面，硬生生压去了半成价码——我破例让了这一步，仅此一回。待到傍晚，一长列唐船的桅杆顶头皆招展着能岛的旗帜，打山坡高处俯瞰下去，一派整肃齐整。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a04_hirado:sell_flags","text"],null]']
src = "blake3:6d499c7d9c849e2ba7ea07f53fa7a31be103c74d6545a5c2687f0244b8093839"
text = "将能岛的旗卖予他船队，每船一面"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:give_flag","news"],null]']
src = "blake3:960c4a0d5515c48859a21f76fe449fbba456e4c954f0d601415982bdfb0fff7b"
text = "平户港内徽王船尾多了面写着“一条”的旗。听说那是土佐的姬君赠的，她自己都未曾悬过。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:give_flag","reply"],null]']
src = "blake3:6d846fd9ee6197b2de91eda70244a75e82b391c613456ee245206b68bdbbcc2b"
text = "王直接过旗帜，亲自攀上船尾系紧，连打两道死结，言道这是他船头一回挂日本公家的旗。大船离港时，火把照着那面旗渐行渐远，末了只余下一点微白。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:give_flag","text"],null]']
src = "blake3:54ffa8e846c481b2bbcde31b08bd15351b7571da72c4705c52a797326a514af7"
text = "赠他写着“一条”的旗，悬于船尾"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:urge_stay","news"],null]']
src = "blake3:359e74b85a4c49fd9e7758b7e9879a25db129c06a229060a51cb67a39ef36597"
text = "平户码头有人瞧见，徽王船上的帆才落半幅又重新拉起，延后了一日才开船。听说原是土佐那位姬君立在船头，硬是劝了半宿。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:urge_stay","reply"],null]']
src = "blake3:273f8c4303c760ce230beabdee8829a34791cfcad56bb58c316b922f30ccc185"
text = "王直于船头伫立了半个时辰，传令落下半帆。码头火把换过两轮，及至破晓，他又教人将帆升回原处。多留了一昼夜，次日入夜船队终究还是走了，临行前冲我拱了拱手。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:urge_stay","text"],null]']
src = "blake3:aa94cac01d2084e9d6bf1077b4ed49a454ec3774f785fe530521259fa736fc0e"
text = "面劝他暂留：候着宁波下一封信再动身"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:watch_tide","news"],null]']
src = "blake3:9d0adea08acdbd5928972275824b791d8e09b804d20822c90a923a2919e96315"
text = "平户港里王直大船扬帆返舟山那宿，一条家的姬君在码头守了一宿潮汐，黎明前她喊出一声，船队随即便起锚开拔。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:watch_tide","reply"],null]']
src = "blake3:d684e99ec5c0db2bd6883db20ba714d8344e74cc653f2e69de472c8f40b56264"
text = "我蜷在码头石阶上熬了一整宿，眼睁睁看着水线一寸寸降下去。快天明时潮水微滞，我高喊一句“转了，寅时二刻”，王直船队闻声起锚。直到末一条船驶出港外，方觉双腿发麻起身不得，还是林晚灯将灯笼倒到左手，腾出右手拽了我一把。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a05_farewell:watch_tide","text"],null]']
src = "blake3:d6d280338ee62ab0327e1e5517723331ac7f8e7741bbccb8dcbb2637daa1faa2"
text = "一语不发，为他船队守一宿潮水"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:arquebus","hint"],null]']
src = "blake3:c2ee710ddb3232acd743a8b3689240000905f3b87ed416484497c8de703821ee"
text = "这挺铁炮的价钱，眼下你尚拿不出。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:arquebus","reply"],null]']
src = "blake3:34f4cf1628980e2a8b8a4d97e31efcc9418afc4977991d6f137355d7894bdc44"
text = "葡萄牙水手教我填药、夹火绳，比划良久，末了干脆攥着我手指扣下去。头一枪把栈桥上的海鸥惊散了个净，耳中足足嗡鸣了一下午。宗麟在楼上抚掌，使人送了包南蛮金平糖过来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:arquebus","text"],null]']
src = "blake3:2309091ae9bfa99fcb8a3cb7728954c526e2bea3da0d92806a922a6846a5830f"
text = "向葡萄牙人购入那挺火绳枪"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:ask_uncle","reply"],null]']
src = "blake3:91a4d615d68882a1c422f5fbb102f2e5ea830a1ac51eb0ba9f665d70cdd53ea4"
text = "我按宫里规矩跪下发问，敬语叠着敬语，问的仍是那桩：船在何处。宗麟回答极快：“那年的船，差到别处去了。”他将身上那件南蛮天鹅绒披风卸下，赏给我船上烧得最凶的那名水手，并问他是哪里人氏，跟葡萄牙人学会歌谣没有。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:ask_uncle","text"],null]']
src = "blake3:92329d563ca4ef44987c2c2c100845f53709fa42299bc5c4eb92a2018f99cf75"
text = "当面问询舅舅：长府的船，缘何并未派出"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:donate","hint"],null]']
src = "blake3:130b7c6c1c9bbcfd33ef6ad2a9744d48dec7838d2498455a1cf6d2890e0391cb"
text = "你钱袋里的数，还付不起这笔药资。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:donate","reply"],null]']
src = "blake3:e98a35bb9d7b9a770fc1989449955e798a27c1fd8df57c56226612529c65eec1"
text = "水手们三日便退了高热，最先下床的那个立马去搭手烧水。阿尔梅达寻出本旧账册，翻过背面记下我名字；账册正面全是他昔日行商的货单，一行行皆被划去了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a06_funai:donate","text"],null]']
src = "blake3:54ca37d9a7c978e9dc564fe0e8cd867209b222c1a519b05c01f76c4b8cece6e2"
text = "将负伤水手送进医院，再添一笔药钱"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:mori_door","reply"],null]']
src = "blake3:83b3f38f0b5f3e86db113cc81da72c3483353ceed06f12ad59c9520e83eee9c5"
text = "能岛人替我将口信捎往吉田郡山，那头答复来得极快：“正合我意。”我回呈谢帖，通篇敬语层层累叠。经手传话的能岛人念罢直咂舌，道是吉田郡山那家，那年春上尚且在长府围着寺门呢。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:mori_door","text"],null]']
src = "blake3:0d144b67994f09002977960cfba6fcefe608b9f86d7e8379c0873031c7c964cf"
text = "借能岛的门路，代朝廷去恳请毛利家出资"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:otomo_door","reply"],null]']
src = "blake3:3958fb4fed348985a36bf5a61ca4f580c8e62ffa3f9ebc865e9d3188e496e622"
text = "宗麟满口答应，唯独开出一个条件：姓名须排在毛利之前。他言语间带着笑，目光却直勾勾盯着我，似在候我为长府辩解几句。我始终未作声。等返抵船上，那纸引见帖已捏皱了一角。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:otomo_door","text"],null]']
src = "blake3:bb768e410d564833d10c772d6b4234db44a1ca4c2e0cd44014957d265c2d3ec6"
text = "赴府内恳求舅舅：大友家总该在朝廷留个名姓"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:own_purse","hint"],null]']
src = "blake3:2bdbf2a99caa387e9e8108f388571d953b6b7757b01f6789c70dcf50a5b097a2"
text = "凭你手头的钱，还垫不出这一笔。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:own_purse","reply"],null]']
src = "blake3:bed4b71ae56620fc1db89a61743e7b605066f7f626d5e1440ee2e1e1657d1f38"
text = "我把钱封进一只漆箱，盖上写了“一条”。封箱之前又细点一遍，余下的零头另包作一小卷摆在舱板。那夜我坐在船板上理账，算来算去，算的无非是那两支未能置办的新橹。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a07_court_letter:own_purse","text"],null]']
src = "blake3:1a95c4b679b756c7fcb8734a636032a261dcc0d2769a7c233fb7ff195f931ef1"
text = "先动用自家积蓄垫付一笔，好教言继起个头"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:ichijo_name","hint"],null]']
src = "blake3:5950b7f8226f9f29ebb468012b725458216d3225b9b53db688f966a3ad2f3f32"
text = "这只箱中并未掺入你自掏的钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:ichijo_name","reply"],null]']
src = "blake3:3559e2753c1c54e29c8ae3e21508480cb552a63d4a70d8ae1fcddeeabe676379"
text = "我接过笔写下“土佐一条”四字，单字占了两格宽。言继捋须打量一番，未曾叫改，单道忒费墨汁。本愿寺使者探身嘀咕了句“土佐也有钱”，教言继一声干咳挡了回去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:ichijo_name","text"],null]']
src = "blake3:53a89b239ee06525610dd76b973f4ad257614843665e3da189ccb7d5ad51846d"
text = "入在土佐一条家名下，一文归于一文"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:mori_name","hint"],null]']
src = "blake3:ce7851f2b313cf1724807725f57a273fc1c3806d9ee90170eea8dde5beb3658c"
text = "你未曾替毛利家出过声。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:mori_name","reply"],null]']
src = "blake3:a9f73b8958cd9bdf7cc9bb3dbe89002ca549110635420ecd589af4365879888f"
text = "言继写罢“毛利”二字，侧旁补注一行小字：经土佐一条家。墨迹未干，本愿寺使者便已探身凑过眼来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:mori_name","text"],null]']
src = "blake3:e5fe60135ededb4d71f358927d173e91f9229317465f53ebd8dcbc36b1caf52a"
text = "入到毛利名下，教能岛的门路再宽一寸"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:no_name","reply"],null]']
src = "blake3:950bd1be5cc0620cfa89479653ced487b2b1215d57f0ea33696c5071488d010f"
text = "言继微怔，随即将本愿寺那行底下空出一格，片字未落。多年以后，我从旁人誊抄的他的日记里翻见那一页，方知那空格中竟补了一枚极小的“澪”字。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:no_name","text"],null]']
src = "blake3:bfd124c0539f531ef1b43ef7d9164e29dc5a2a4bdd701f57fbb610da939f2c63"
text = "教本愿寺排在首行，自家半字不落"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:otomo_name","hint"],null]']
src = "blake3:b0f96851445601081944e10963d65a09c0620130accebabd731e63e1e433cf02"
text = "丰后并未应承这笔钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:otomo_name","reply"],null]']
src = "blake3:f13402e56e84f826246dff048d0db33fa8665dac453703be41d0d955fb5245bf"
text = "言继顺着舅舅的主意，将大友排于毛利之前。本愿寺使者气得面皮发青，拽住衣袖要讲规矩。言继连眼皮也不抬，只道谁家的钱先抵堺便先记谁家，大友的箱子比本愿寺早到了三日。那行墨干得极慢，我便守在箱旁，一直等到墨面不再反光才起身离去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a08_donation:otomo_name","text"],null]']
src = "blake3:01b8bdc39997b3a5f83dbed237bf27f6c7e56d5642ee2df77aa86cc778b0b7b3"
text = "记于大友名下：既由舅舅出资，便该留个名姓"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:died","hint"],null]']
src = "blake3:9ffd174080344edf47bab252cad4aa8b59e336fe6655499e6e2a78d782b7fc3f"
text = "王直尚在人世，哪里用得着这炷香。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:died","reply"],null]']
src = "blake3:0959d993814009a93227538677f927c05995ec25d05edd29d729211fcca769db"
text = "我候至退潮时分，将那纸告示叠作一只小纸船，当中插上一炷香，顺船舷放入海里。纸船打着旋儿朝外漂去，香火一明一暗，刚漂过港外那条浪线便熄了。后来弥七闻知此事，托人捎话过来：船主原籍徽州，这香该朝西插才对。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:died","text"],null]']
src = "blake3:209de5020a7d232b5623c5b09cd801c03c60f1fcf031a7e8eaa7d22df0894e40"
text = "候着退潮，将告示叠作纸船，为他燃一炷香"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:lived","hint"],null]']
src = "blake3:b9fdcd3d3bbd05617b87f992679c9ae6c856b400b067a03247bf8336ac3485f5"
text = "宁波并无来函。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:lived","reply"],null]']
src = "blake3:8190e5d1e3eb00aee73a3f3fabfe84716f715c267fe65900b049375774e9c9ce"
text = "我依足宫廷书信体式作复，寒暄占去半幅纸，正事却只打听一桩：舟山的潮水，可与平户一般。信托付给赴宁波的船，船头问可要添上一句贺他受封的话，我回不必，他自个儿清楚。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a10_wang_echo:lived","text"],null]']
src = "blake3:828d6175a9097553f3d6e2863d9b017639b7e69b08d1195c1fdfea7af21e220c"
text = "收妥他的谢帖，修书一封寄往宁波"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:mediate","reply"],null]']
src = "blake3:b3bbf95fe19d87182a41452399574370b01656c77fbba91b26fe6fa94846783a"
text = "昔年宫中调处公卿争座次的那套章程，叫我全搬上了桌：谁先落座、谁先展扇，一桩一桩与这两名老海贼仔细分说。说到末了，通康忍俊不禁，言道朝廷那套规矩他半数未懂，惟独劝酒那句听真切了，抢着先擎了杯。武吉替我斟酒，直斟得溢出杯沿。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:mediate","text"],null]']
src = "blake3:ecc27b57547e813d91e4596e8a51e5446908b37d4e419d12d1a78a81f51949af"
text = "为能岛与来岛居中说项：此战内海谁家也不效命"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:noshima_seal","reply"],null]']
src = "blake3:7300396938bbaf44ad653d8acc38200814e48af47875db0da91beae37e85c495"
text = "落印那一刻，我使出了浑身气力。武吉吩咐记档，往后内海但凡悬这面旗的船只，概予放行。盖罢方觉掌心染满朱红印泥，浸在潮水里搓洗到第五遍，仍泛着一层浅粉。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:noshima_seal","text"],null]']
src = "blake3:60b24e18b30083aa34bc842ec208811c9fcb611ea5f48cd562af54da8cacd903"
text = "盖上能岛之印：售旗所得，能岛取大头"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:own_flag","reply"],null]']
src = "blake3:9206fe7328e93477e4d0c5408e6983f9ffb63135a7ddda402024d8b60b3a5aa6"
text = "我借过关所砚台，在空旗面上落笔写下“一条”两个大字，墨点溅上了袖口。武吉拿指节敲着那二字，一下下敲到墨干，才问我归途取哪条水道、吃水几尺。问罢，他嘱咐账房把我那条小早从“熟船”一页移去最末。通康在门边险些笑出声，扫了他一眼，到底没笑出来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a11_noshima:own_flag","text"],null]']
src = "blake3:98f8df1739538e1a275cd0522cf01d9d8e1c7fc494bc6d530527e21aef799f05"
text = "升一条家自家旗号：字由我亲手题写"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:burn_flags","news"],null]']
src = "blake3:fad825810abf8705e105ee6e085b3bd40741e136bafad2a4145dbadf66a31cb8"
text = "伊予滩上来往的人传言，一条家的小早捉住了倒卖假旗的船，当着船主之面焚毁了满箱假旗，至于人则放走了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:burn_flags","reply"],null]']
src = "blake3:fa845aeba5e6950b1c279dfca2700c82e546ebd419b8e2bf4d4601e843f5d240"
text = "烈火足足烧了小半个时辰。老账房蹲踞船舷旁盯看，呛人的烟熏得他眼皮直眨。那方木印我未焚毁，直接丢入海中，木头沉不下底，始终浮在船侧。待火势熄尽，他磕首拜了一拜，探手捞起木印，独自荡桨划小船离去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:burn_flags","text"],null]']
src = "blake3:17409082c90cef122ebcde2390b6c50cc2f82534e32f653dab3b9d40b34343fa"
text = "放人离去，当其面将假旗逐面焚尽"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:sell_source","reply"],null]']
src = "blake3:7296648b9a4b7c5dd9300c7f20a6d042e93fc1b982d50607cd5b7c4e4e6667bf"
text = "来岛家的人依我指出的地名，抄了老账房躲在岛影里的老窝。谢钱送来那日，盛钱的布囊绣着来岛家纹。武吉听闻后冷哼一声，整个月里关所的茶水都再未端来给我。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:sell_source","text"],null]']
src = "blake3:d302d1c9f4336809ef8baa9e8906ef972f741b12e4e815b8f89d66a1335f234f"
text = "将假旗出处卖予来岛村上，任由他们去收网"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:take_back","reply"],null]']
src = "blake3:704f36e5d235406296bf5f2a423244cf610f29c391f25ab80a10124fb048be87"
text = "武吉抄过假印在掌中掂量片刻，拔刀挥作两截，抛入潮水。老账房临被押走前，转头望了一眼那箱假旗，随即收押进岛牢。自那日往后，武吉同我攀谈不再称“姬君”，径直唤作“一条的”。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a12_forged_flags:take_back","text"],null]']
src = "blake3:263f413df76af9a0f6479635a0a6f19e19f741bc1d0247a838eaa2d735ccaea6"
text = "连人带假印一并押返能岛，交由武吉处置"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:ask_him","hint"],null]']
src = "blake3:5e648ccaa9cf41f3e1cbd94cd3fc9d9ca538934ba28ed41e0c6135bac4a816c6"
text = "那样的话，眼下你还说不出口。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:ask_him","news"],null]']
src = "blake3:405c493616ebe17d1f53a92b4ba1aa0710e39223f10083eceece0166a81447bc"
text = "浜之宫的乡人讲，渡海船尚未驶出纲切岛时，曾有一条土佐小早贴近船帮叩了几下木板，里头诵经声一顿，旋即又续着念了起来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:ask_him","reply"],null]']
src = "blake3:5cfbcc5a23fa6a67dcc5e1a7449e1e2f357d4e780eeff5fab2cbfcb561a5ad90"
text = "我驾着小早贴靠过去，抬手叩响船板。诵经声顿住片刻，舱内传出个极平和的嗓音：“要走。”随后经文续响，恰恰接上适才断掉的那句。我自木板上收回手。岸边，小沙弥双膝跪落下去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:ask_him","text"],null]']
src = "blake3:eda77bd698e182a900a783fcf660cb849408baf1c4452fcf0a7b0bc2bedca5bf"
text = "赶在出纲切岛前追上，隔着船板问他可还启程"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:follow","news"],null]']
src = "blake3:fd20b5713decb0906ca26fae71c9a46c13b0b25cb58f5d6a5d022a5c06c8dec7"
text = "浜之宫有人言道，一条土佐小早尾随补陀落渡海船驶出了纲切岛，足足跟满一宿方才返航。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:follow","reply"],null]']
src = "blake3:2cb0bc2a1c33acb5bbf1eaeb1e2a43912283157ab2572f1d3985f97e8082f5d1"
text = "绳索一断，那船并未随波南下，而是顺着黑潮转折的水路往东南去了。我不远不近地缀在后头跟了一宿，油灯的光亮了一整夜。天破晓时，它只余下一点影子，与浪头混在一处，前头空无一物。等我掉转船头回到浜之宫，正赶上午后那一潮。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:follow","text"],null]']
src = "blake3:2602ab0c28f6d7db0fc7fda0cf7662d86dee164f66a66926fe7ff27f77594f05"
text = "尾随那船走上一昼夜，瞧它究竟去向何处"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:write_name","hint"],null]']
src = "blake3:022d2ee43ddf6d93a3faaeb5eb7743e324eea8e286e77a991ce0e50789779b97"
text = "你的歌咏还托不住这般名号。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:write_name","news"],null]']
src = "blake3:9f996120dbe96a53f4891aa7f190d36a87a2bcde0dd2e207f87cb3cb0fe2bf1d"
text = "浜之宫补陀洛山寺有个小沙弥收着一张怀纸，说是土佐来的姬君替他师父写了首歌在上头。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:write_name","reply"],null]']
src = "blake3:7c7d508fd1bf84b50f3e075ee7bdabc9b5e816bdc91be437c1d62ebbf468f424"
text = "我将歌写进怀纸，递给小沙弥收好。他识不得几个字，反复问了我两遍老僧名字的写法，随后把纸贴在胸前，站在岸边一直等到拖船空着归来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a13_fudaraku:write_name","text"],null]']
src = "blake3:48640da1d1288c2d596d4b66384ba8abf5b516b2b6aff7f7cc8d601358ad5d6f"
text = "留在岸边，将老僧之名写入一首歌中"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:only_bow","news"],null]']
src = "blake3:e8f0ffa9c0393f777b84d4ee2a9e0420101077abb383f70e081411a64a4e1944"
text = "今年长府外海忌宫的祭船险些被潮水打翻，尾随在后遥遥行礼的一条土佐小早，拜罢便径直离开了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:only_bow","reply"],null]']
src = "blake3:5d50a9867674bb7e83a2c6fd5e74184957683804d05c5b151154fb0474744d23"
text = "我随祭船绕行三圈，拜罢便掉转船头。老渔夫摇船追来，喘着气说道：“这位姬君，倒知晓规矩。”说完从篓中摸出一条鲷鱼扔进我船里，权作谢礼。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:only_bow","text"],null]']
src = "blake3:0666cd51c35aa550511b5be993d2e2f54c4365fdf0edd7863f914c73c9f73c14"
text = "只于船上远远一拜，分毫不取"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:song","hint"],null]']
src = "blake3:0f5b88d436994c0e852726d066d96e6df294b8feef706b75e66324a88c4501de"
text = "你还作不出足以献祭海神的歌。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:song","news"],null]']
src = "blake3:800f33e6f41a1516f980df0e0799d44e6822f3110378c1ca78a888ea14a18091"
text = "长府外海忌宫行祭礼时，那条土佐小早上的姬君朝两座岛吟了一首歌，神官回赠了她一幅旧图。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:song","reply"],null]']
src = "blake3:3c82184371c9906a0ccb629052ca2bc57ffee72edd40e15a9d4251df2a30797f"
text = "轮到我献歌时，潮水正值转向，船底的水流一时东拉、一时西拽。那首歌我前一宿便已在船上琢磨妥当，专候潮转。我站上船头吟诵：　　满珠一颗，干珠一颗——　　潮转了，该我落子。　　神官听罢，问我是哪一家的。祭礼一散，他将社中旧藏的那幅两岛图临摹了一份赠我，说是海神的回礼。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:song","text"],null]']
src = "blake3:80309b1efbfc44f4af9862a919f410fbc0b0b212cd578c21ea8d8c419ddc018f"
text = "不动笔，只向海神献歌一首"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:steady_sketch","hint"],null]']
src = "blake3:422bb5cff80349886c5926585e22a923ce3093dc6c6e799f26192adc4b461de4"
text = "这两座岛的图样，已然归你所有。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:steady_sketch","reply"],null]']
src = "blake3:34044a91b5f2aa8a7179a27abf6f5137fe8d13592a3fb9c18c0f021ed9e3311a"
text = "我将小早横在祭船上流，以船身硬生生抗住翻涌而来的潮头，桨手们咬紧牙关顶了足足一炷香工夫。待水面平复，祭船重又列好阵势，我方取出记潮的炭笔，伏在船板上将两座岛与祭船逐笔勾勒出来。神官接过图样，举起来对着两座岛比照一番，准许我带走。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:a14_kanju:steady_sketch","text"],null]']
src = "blake3:5f02798de7f6ea9e1a40e087a8063fca39d78adccef2e9f2ef1f111f2e3833d5"
text = "先横船稳住祭船，再描下那两座岛"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:confront","reply"],null]']
src = "blake3:0033c5f190001e3a5e96b2eb43651dd19d75f9e347a83e73a5392c9f5da3127e"
text = "我更了宫里的衣裳赶赴中村。御所大厅中，弟弟坐在上座，内基大人坐在旁侧，两人互不搭理，视线也错开着。我照着礼数跪下，把那张纸推去他膝前，半句数落也无。兼定只看到第二行，手就抖得攥不住纸了。他问我：宗珊为何不早些呈给他看。我道：家老怕你以为是在骂你。他把手按在纸上压着膝头，压了许久，指节都泛了白。起身出门时，内基大人在廊下轻叹一声，再无别话。入夜后，御所派人到船上传话：殿下需将那纸誊抄一份自留，原件明早奉还。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:confront","text"],null]']
src = "blake3:325a560f85cd2e855fb7c7699f155dde069c1c2d532c7fd859e8662fdf8aafc6"
text = "前往中村，将这张纸摊呈到兼定眼前"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:into_fan","reply"],null]']
src = "blake3:ef44ae82c7eaf21c1570d61fb18f4375cc82276c486c080ab7e73bcb4e9a359a"
text = "我将那张纸叠得同扇骨一般细窄，夹进七夕那首歌的旁侧。老仆默默瞧着我折完，始终不曾作声。收好之后，他向我磕头请示，是否需去殿下处禀明一声。我说不必，家老既托付于我，便留在手边。他又叩首一次，独划空船返归中村，船头的灯笼渐渐缩成微光。那一宿我独坐栈桥之上，未曾入屋。潮水涌起，淹没最末一级石阶，继而退落，我始终不曾展扇。合拢的扇子比往日略厚了几分，再要展开时，指尖须多使一分力。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:into_fan","text"],null]']
src = "blake3:5b83670be13ddbaff6042e6550c04be5e4127d37a833abead229550e98c2bbd1"
text = "收起这份辞世，一语不发地夹进桧扇"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:to_uchimoto","reply"],null]']
src = "blake3:e6ccc91c24dea569d2eadb52988fe15d9d9d6916e08c7ac8b96d3317c0c1fb4b"
text = "我连夜前往中村，把文匣交予本家来的内基大人。他在偏殿就着一盏灯火读罢，叹息道本家早就怀疑先代并非狂疾。他吩咐人抄录一份收起，原件仍旧还我，叠得比我呈上时还要工整。抄件的墨尚未干，便已叫他锁进从京里带来的木箱。临行前他说：“这般看来，更容不得兼定继续执掌家业了。”我立在御所门外，听见里头弟弟砸东西的声响，摔了一件，又摔一件。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b03_sozan:to_uchimoto","text"],null]']
src = "blake3:fa621763d3fc338d6697cd0c38ca3f1adda3dc8904ccb9acab64d061962e4008"
text = "将辞世交予本家的内基，由京都一条家裁夺"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:give_crew","reply"],null]']
src = "blake3:19c321155f93dd80ec409690f6d8b70c39af07e61252b551ec26f87feec6306e"
text = "两名水夫，一个识得潮汛，一个善使长枪。我领他们跪拜认了新主。兼定不言谢字，只瞥了二人一眼。当夜他破天荒与我同席用饭，搁下碗筷后方才开口道：“使枪那人，手倒稳当。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:give_crew","text"],null]']
src = "blake3:4198483b27834fe2bd8c42a004aac796c4a44f272235c2643d79d245dc1652f0"
text = "将船中最得力的两名水夫留与他"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:go_home","reply"],null]']
src = "blake3:9dc590cd5879fd4b2544b1bf3c2210d052ebee5660f9e90797af2cd7fd818529"
text = "送他进了寺门我便动身。他只立在门里，并未送行。寺里小僧赶到码头，递来一包柿饼，说是殿下托带给中村母亲的，其余只字未提。归途舟上，我把那扇子开了又合、合了又开，掌心叫扇骨磨得发烫。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:go_home","text"],null]']
src = "blake3:36d5e003ca8dff92c52f3ba9a8f64aadcd514945b8955a0abe55ddc4d81e348c"
text = "不住下，返归中村陪伴母亲"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:speak_for_him","reply"],null]']
src = "blake3:dc707eb512d001722a898d5ab6c8d642a483b68b13fff86618059325a316c741"
text = "我在臼杵城中守礼恳请，自女儿的颜面谈及大友家的体统，对长府一事只字未提。宗麟听罢，赏了一座带院落的宅邸连同十来个下人，言明全看在女儿薄面上。回府内途间，管事低声告知我，主公这一整年头一回如此爽快地应承下来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b04_exile:speak_for_him","text"],null]']
src = "blake3:43310c49211926870f5cf56033dfc9c9457fc3cecb8823490a62cdd07d9d0f21"
text = "自府内赴臼杵拜见舅父，替弟弟求一所宅院与几名仆从"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:money_only","hint"],null]']
src = "blake3:36496dfa7ecaa780e503cad193d2ab4b326d44f5eeaef8db27b7d353807c4cef"
text = "你眼下拿不出这一袋钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:money_only","reply"],null]']
src = "blake3:5b035d9e5cf46679d1f6419c0607e02bf77de56822bae7577c1bad5ba3e634d8"
text = "我将钱袋置于念珠一侧。兼定凝视钱袋片刻，吐出“够了”二字，语声寒如井水。那张改绘过的图样，他并未许我携走。行至门边，我听见他吩咐属下将这袋钱拿去购置火药，自始至终不曾再提船的事。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:money_only","text"],null]']
src = "blake3:9f753b7165bb3356d1a1b29c6ab1f7ff10b856529a7dbf1f97af43c1d749c555"
text = "只出资财，不调船只"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:pledge","reply"],null]']
src = "blake3:5ae3d89acc8262ba2cea3ea50b5d1f3e38d7ccdad65facd0bc17ecedcd7ae917"
text = "我即刻将可调遣的船只逐一开列给他：几艘小早、几艘关船，归哪家船头统带，各载多少人手。兼定折起清单贴身收好，紧挨着那串念珠：“河口就托付姐姐了。”这声称呼脱口而出，熟稔得仿佛一贯如此。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:pledge","text"],null]']
src = "blake3:40075ea7a2b17971ed6fa0589f0ef1fb8f479b7b766baf851f359da5d2da2070"
text = "倾尽全队船只相搏：渡川口由我来封"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:refuse","reply"],null]']
src = "blake3:0a6e447be8ccb0cd92ea6f9cee8d8d86ac60fb8d6ed798c83d41d46d0bd982f4"
text = "兼定卷起那张改过的图纸，再未朝我投来一瞥。我步出门外时，邻院南蛮寺内正有人咏唱一曲我听不明白的歌，曲调徐缓，一句接一句地拔高，升到极处蓦地收住。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b05_dom_paulo:refuse","text"],null]']
src = "blake3:86c97697bcd5d3ccfb1ffd1b92407905ea57bed136296d5ee5c1f899d41cabf2"
text = "不允：一条家的家事，理应由一条家自行了断"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:find_brother","news"],null]']
src = "blake3:20ec5eb8b5993cfdc0c7f92724613d9d772113288b65bdb438ce327889940297"
text = "四万十川之战中，有人亲见一条家那位大姬君手持薙刀杀入西岸芦苇荡，硬是将殿下自乱军丛中拉上了船。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:find_brother","reply"],null]']
src = "blake3:375ae68c90c11742db79048259acb8cf3a0ffd3cdb16db08cc98ee85d9210aa2"
text = "我握着薙刀自西岸芦苇丛中杀入，在混战里瞥见那串念珠在他胸前晃荡，伸手猛地将他扯上船来。兼定瘫坐在舱底良久，头盔丢了，剃青的头皮上全是泥污。他开口道：“姐姐，若再战一场，我必能胜。”我将薙刀插回船舷：“那便再赌一局。”他怔了怔，随即笑起来，神情活脱脱是幼时下双六输棋那副模样。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:find_brother","text"],null]']
src = "blake3:7c3b725025b602c78f01993b8d195dcbc11dbf83a8a29efdab61d60673a6324b"
text = "杀入乱阵寻觅弟弟"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:rescue","news"],null]']
src = "blake3:e05509915d0e67a996ad2aa1705f42172817797df090273bbd3e4a463e57fbd4"
text = "四万十川战事刚歇，下田传开风声，说河口那条一条家的小早打捞落水者足足忙了一整日，敌我双方一并救起。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:rescue","reply"],null]']
src = "blake3:612700ea1888b7df5251ad47f29a9751ceaf3d73e9925c232cb34c276267691d"
text = "我驾船在下游往返梭巡，救上来的伤兵沿着甲板排成一列，一条家的与长宗我部家的皆在其中。我逐一替他们按压创口，顾不得拭去满手鲜血便转向下一位。其间有个长宗我部的年轻兵卒苏醒，瞧清船头旗号后挣扎着要往船外爬，叫我一把摁回原地。往后长宗我部家的人行至下田，每每提及这条船，总要微微颔首致意。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:rescue","text"],null]']
src = "blake3:d6eaed312ad2e205e285763006ebfd8b56606dfc2f641c2d3555e7da38f5ad46"
text = "留守下游救人：凡落水者，不论旗号"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:seal_mouth","reply"],null]']
src = "blake3:db041c868a19cf6facf34f674e8c6c827d64ae3ee9b46a27086e4f0dd8d1bb6b"
text = "我下令用缆绳把四条小早首尾拴作一排，横亘在那道白线上，船头齐齐向外。长宗我部绕道偷袭的船队冲了三遭，三遭都在绳阵前头横了船身，没能闯进半条。可河口守得严实，上游却鞭长莫及：对岸人马踏过了沙洲，西岸的旗帜一面接一面扑倒，我在船上干望着无计可施，掌心被缆绳勒得渗出了血。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b06_watari:seal_mouth","text"],null]']
src = "blake3:82f1815ded6ce5171b19adf72175386d53cdeb46147b3f96e83e5b69ed70b493"
text = "将几条小早首尾相连，横挡在河口白线处"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:fell","hint"],null]']
src = "blake3:0747759390d0dff4420407ffc16770a620795f0c9ebb0026622e2ceff812f1b4"
text = "一条家尚据守幡多，何须远避户岛。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:fell","reply"],null]']
src = "blake3:ad7616f037f260180512d4a42ba2261b9c7e551e90ccfa557940bd9ca1318cbc"
text = "我亲自操舵护送兼定抵达户岛。岛上唯有一处渔村和一间小庙，渡头不过几块堆砌的乱石。临登岸时，他将念珠缠绕腕间，回身嘱道：“待来年开春，再过来接我。”我应下好字。返航途间，怀中那串钥匙隔着衣料抵着胸口，硌了整整一路。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:fell","text"],null]']
src = "blake3:2e75e94f6c00310189ad55b42a81fb745a446aaa70412e6f236aa08c489c10dc"
text = "护送弟弟去伊予户岛，再折返迎接母亲"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:held","hint"],null]']
src = "blake3:b4916887ef6e6a3db594e6d1ac8ab6da19de90f1ffa395bf0179136238bb82c6"
text = "中村门扉之上，贴着的已是旁人家的封条。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:held","reply"],null]']
src = "blake3:6efa9c3ed694d300e461b9a4ddda0c7fd1a51a9a4043491ff86ca3cb9924c343"
text = "我怀揣那串钥匙踏遍幡多诸地。每至一处村落，便亲手将一条家的幔幕重悬门庭，若是挂斜了，便亲自登高扶正。村中老叟紧随在后默默计数，待走到第十几座村寨，有位老人忽而掩面落泪，言道当年先代也曾这般走过一遭。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b07_watari_echo:held","text"],null]']
src = "blake3:37a03a4ab28503be93af2696a46a4577e4ceaa088456243df65bcc1462d65401"
text = "重返中村，逐村逐寨清点尚且守住的地界"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:join_murakami","news"],null]']
src = "blake3:3ef2696de91c3c5b1f6f2b391ab45f005790aca08cf5aca857d2ef56b1c56836"
text = "木津川口大火烧了半宿，听说能岛掷往织田大船的焙烙中，有一整筐便是土佐那条小早扔过去的。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:join_murakami","reply"],null]']
src = "blake3:a9dc47973cbfc241b3426a8c27bad2f4a729117ae6f507f1ab54552fd3b23c06"
text = "我的小早紧随在第三列。焙烙接连扔上织田家的大船，陶罐一碰碎，烈火便贴着船板蹿上了帆面。我牢记武吉的嘱咐，头也不回。大火从河口一直烧过半夜，毛利的粮船借着火光一艘接一艘闯进了石山。天明返回堺时，我才发觉半边眉毛早已被火烤秃。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:join_murakami","text"],null]']
src = "blake3:1d5b39bee2a764b418d2c6dced8eb05a276408eeba3fa9629cc2cb6b4af1a8c7"
text = "随村上船队闯入河口，居于第三列"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:rescue","reply"],null]']
src = "blake3:9e463bc1a28352057d284f3e84d4e4ac89f20e327c48eb3ca2eda951b653f198"
text = "我在火光映照下往返穿梭了七遭。舱内横七竖八躺满浑身湿透的落水人，既有村上的水夫，亦有织田的足轻，挤作一团呛水咳嗽，彼此谁也没力气仇视谁。待第七趟返航，一名本愿寺的小僧蹲守船畔，挨个儿往众人嘴里灌喂米汤。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:rescue","text"],null]']
src = "blake3:56086ba3298c02a5bdad0a0fd6e3a9ed865736cea95b5bd199f5a3a70e6235bc"
text = "在河口水中打捞落水者，无论敌我"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:sell_oda","news"],null]']
src = "blake3:0570bb5d9d3eefe34f19145b73854ba0524ada7a0caf8e5b79adcbb88256af95"
text = "堺港流传着风声，木津川口起火那晚，土佐一条家的姬君将整船松脂售予织田家，自己立在码头观火。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:sell_oda","reply"],null]']
src = "blake3:c10d7bf52cb8496cd36ad809c707a77bab51f32aed59b330ee798e7083f5511c"
text = "买办立时结清货款，还另送了一匹堺地织造的缎子。当夜我立在堺的码头边遥望河口大火，烈焰将半边天际染得通红，早已分不清烧着的是谁家船舰。武吉的部众从我身旁径自走过，未打半声招呼。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b08_kizugawa1:sell_oda","text"],null]']
src = "blake3:abbf47696df1cc885ac8a29caad3be374fc865d3e8bb00bf2c269fd97388782b"
text = "将满船松脂转卖给织田方"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:misdirect","reply"],null]']
src = "blake3:0388436ff324cc77e2afa00e1a9e73b3f359b131339eb7054080b8510bafb632"
text = "我将越前一座渔村描摹得活灵活现：哪块礁石底下、哪年哪月，谁家渔网曾拖起半截鱼尾。其实那地方压根没有人鱼，唯有肥美的乌贼罢了。那异邦人逐字逐句录在纸上，当天便包船往北去了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:misdirect","text"],null]']
src = "blake3:a8b4a1263c53f150a64508fef4733d2bbc581b3f45530855d07183ce41e595f9"
text = "故意指条歧路：去越前海滨寻访人鱼"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:sell_tale","reply"],null]']
src = "blake3:66458c54d80a79732b00f5bf7b1a356a8f81237f602a9b30acd216820ed3ac05"
text = "他给钱极是爽利，每则传闻俱抄进一本袖珍册子，封面上同样印着那条龙纹。我说了七桩故事，便收了七次酬金。点算钱币时心头莫名有些发堵，说不清个中缘由，宛如鞋底钻进了一颗砂砾。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:sell_tale","text"],null]']
src = "blake3:2cf545b61cae3a6ddd2c3d0d62c0baf7059f54e0c72cc468ecd467a06a82889d"
text = "给她讲比丘尼的传说，一个故事换一份价钱"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:warn_nuns","reply"],null]']
src = "blake3:610c412538058bbb0a351dba62d0193114880b5e72860563c17c78d1ed8ee273"
text = "老尼斟了一碗苦茶与我，又派寺里的人轮流守住洞口，入夜也挑着灯。次日那外国人来了，在洞前立了许久，末了只摘下一片椿叶，夹入他的小册子里。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:b09_yao_bikuni:warn_nuns","text"],null]']
src = "blake3:0832407196b91e84f0db7da2f5c18a8de25313cb855971a47d5fc1c83ecbfe74"
text = "进寺提醒老尼，看顾好洞口的白椿"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:advise_stay","reply"],null]']
src = "blake3:23b62ad0df1361ccdd6866c2ed9e875977da68ee31c23c4cb9d299b7c5b6a02c"
text = "我将一块铁板扛上武吉的船，当面敲响给他听声，又将大船上的炮口逐一数与他听。武吉沉默良久，临阵时只派出一半船只前去。那一仗能岛终究还是败了，可返航的船，却比旁家多出半数。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:advise_stay","text"],null]']
src = "blake3:c25039afe4d5fbeba551cfa5c6630d4472f2a8f5f1ae0b64ef40da76ae9ab202"
text = "劝能岛这趟莫出海：大船的炮打得比焙烙远"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:night_raid","reply"],null]']
src = "blake3:3d075846ea8ecc0160ac9498fdf89dc1aeb6a35d4a51668a02e404fcca2506ba"
text = "我领着三条小早，紧贴大船船底潜行过去。近前才瞧真切，船舷高耸如城垣，焙烙得系在绳索上抡起来抛掷。掷到第四枚，一艘大船的帆着了火，火光将湾口照得通红。哪知天色方明，大船火炮齐发，村上的小早一艘接一艘向外漂去。及至回到堺，我带去的三条船，唯余两条。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:night_raid","text"],null]']
src = "blake3:3d7be3f1838994ee71cd9fc371677874d59ae2f3bb407731373424e037eb7465"
text = "随村上的小早，乘夜潜近大船"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:sell_iron","news"],null]']
src = "blake3:21721abb539116fb39a3be048e3b8103534c1423e401a5e018e0256187d9763b"
text = "堺里人皆传言，土佐一条家的姬君替织田家运了一船铁板去鸟羽，九鬼家的船匠还请她登大船瞧了一眼。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:sell_iron","reply"],null]']
src = "blake3:fd3083f3ff55b43a64ca7bcbd508fc480f62ab81ca3ee6544ae921a5d4170cda"
text = "九鬼家的船匠逐块查验铁板，每敲一声便细听一回，付过钱后，邀我登上大船观瞧。舱内幽暗一如库房，炮口列成一排朝外敞开，炮手们坐于炮旁捏饭团充饥。及至我下了船，能岛的人就立在码头上望过来，无一人作声。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c01_iron_ships:sell_iron","text"],null]']
src = "blake3:d434fba542bcc5dc18f6906e6f13980a147b1968b5d4d8cb79217dd083958522"
text = "替织田运一船铁板赴鸟羽"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:ask_home","hint"],null]']
src = "blake3:cf9166d3f0afef0e5764cf1e799b855d60e4f5651cd7aad390d1b99d44d69b0a"
text = "你晓得的葡萄牙话没几句。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:ask_home","reply"],null]']
src = "blake3:36e6a1ebb1ce8624278cbc71f52e11529e7e7fb6cfd58af64dadef2b0c2b5d2f"
text = "他闻得葡萄牙话，双目微亮，絮絮回了好长一串：一条宽阔的大河，一处售卖金沙的市集，还有个在井畔吟唱的女子。我仅听明白一半。言至末了，他按住腰畔那柄短刀说道：“此地亦是家。”那封信我收下了，拿油纸裹了三层。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:ask_home","text"],null]']
src = "blake3:5d2857013ba3895caf108b9306f675fffad76453dd4bd5b223e2e4530cb23ccf"
text = "接过信，再用葡萄牙话问他可想回家"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:one_word","reply"],null]']
src = "blake3:3940107230aa7ceb55fe2eff2e5ab5308b255ce2a4e20a3d0de1f43288eab7ea"
text = "我沾了些水，在船板上勾画与他看：两片沙洲之间夹着一道深水，行船循此而行方不致搁浅，这便唤作“澪”。他凝视良久，道出自己昔日的名姓，连念两回，我跟着学念，到第三遍方才念准。那封信，他后来另托付给了耶稣会的邮包。两个名字，我皆记牢了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:one_word","text"],null]']
src = "blake3:95e59f6854c13448581ce9797e2de8d68fa5969f9e77afb6561833493b0c07bb"
text = "不接那信，只跟他换一句话"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:take_letter","reply"],null]']
src = "blake3:c8c7bf785339dc437f1d5bc7463574bd72b558cc934dbdebb9f6e7758ccc8b30"
text = "我拿油纸将信裹了三层，塞进扇匣内，与扇子挨在一处。弥助俯身自怀里摸出一枚小铜铃，悬在我船头上，说他们那儿的人出海前都要挂一只保平安。铃音极细碎，随风便响，犹如有人在船首轻声细语。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c03_yasuke:take_letter","text"],null]']
src = "blake3:618475806c9f20c5e16b16c3c2cec5b470e103d0643c170736374e0aa62f5b00"
text = "接过信：往西去的船，我帮你寻"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:berth","hint"],null]']
src = "blake3:de122406add8b80954e59a86f0136d5ff10a7bc0b86b87e4a7a6c4ddbbab16e4"
text = "这处铺位的价钱，你眼下还出不起。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:berth","reply"],null]']
src = "blake3:1acdd18e9182eb4ea510fe2803fd468a3cd184bfc777f24fede36402ae17f7ba"
text = "我掏钱为少年们的通事买下一个铺位。范礼安于名单末处补添了一行小字。那位通事系平户出身，既通假名，亦识葡萄牙文字。日后听闻，此行途中满所的家书，尽是他代笔书就。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:berth","text"],null]']
src = "blake3:bac21974fa8adebd67d3946e3f08495b34835c7a47dbeb570b1ba24d2b7cfbab"
text = "出资于船上为少年们的通事谋一铺位"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:chart","hint"],null]']
src = "blake3:e6dd47d88d78777054b9d944febed0da4115745d829d7364a574e5276ab4615d"
text = "你手头尚无一张拿得出手的日本沿海图。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:chart","reply"],null]']
src = "blake3:11b53b91e205c62e6db81be0d7fc6763147ae7d76ef23a445e99f20ad1e9ff24"
text = "满所将海图展在木箱盖上，指尖自长崎一路向东移动，及至土佐方才略停。随后他卷起图收进自家箱笼，称要呈与教皇瞧瞧土佐所在。范礼安在一旁瞥了一眼，道罗马的地图上，日本不过一片叶子大小。满所顺手扣上箱盖：“那便叫他们见识见识叶子上的路。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:chart","text"],null]']
src = "blake3:112fe5bf78e88d38b97a6a8755e446f5af8b571a0e9e7c3c941f21add969ef0e"
text = "赠少年们一张日本沿海图，教罗马人见识这边的海"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:letter","news"],null]']
src = "blake3:66e09ba5979ada96fd7fc1a7fce520c4ce6b9020229b9b2e455025cc304b3c8a"
text = "长崎的人都在传，一条家的姬君赶在黑船开船前来送伊东家的孩子，还递了封未写收信人的信。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:letter","reply"],null]']
src = "blake3:e3fb94a04c1ccffb8ad05d4b7f5c7796dd0f9db62b9f5a6913f12f0e32d3aeb9"
text = "我修书一封，封缄处未留收信姓名，径直递与满所：“途中若遇值得之人，便交与他。”他双手捧信思忖良久，问何等人物才算值得。我回道你撞见自然知晓。他遂将信函藏入箱底，压在拉丁文课本之下。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c04_embassy:letter","text"],null]']
src = "blake3:72481f9f55bae3a7f144678821ad046fd0305226f93cd639c8e51be7a1f57867"
text = "托他们捎一封信赴罗马，收信人上船再定"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:close","reply"],null]']
src = "blake3:900e76aa95bd03b742e6c3faf2bd42b3642ab75648a13418f17dc1e456c1692a"
text = "我将扇子纳入匣中，缠了两道绳索。此去不过望上一眼。彼处若有人烟，我便顺手代为掩门，归来绝口不提。水手请示可要多备几桶淡水，我应道多带些，再捎一包下田的盐，逢着那边的人也好见礼。乳母往昔曾言，旁人家的门帘，撩起一角便足矣。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:close","text"],null]']
src = "blake3:7784f047d3d1367366153ca454884194af414867b6253f81f983949616d145e3"
text = "携扇西行：雾中有雾中人，莫去惊扰"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:hand","reply"],null]']
src = "blake3:3ccd4c48b2c58942bd0fd676606699df3d21aa045ffb41aa04f9f6086d99ed9f"
text = "一条家保不住土佐，能岛守不住内海，我留不住的物事，一双手亦数不尽。那片海终归需人看守。我前去瞧瞧是何人，看准了，便将扇子托付于他。临行前，我将扇骨上的歌另誊了一份，压在寄予母亲的家信中。倘若扇子送出便难复返，这首歌尚存于下田。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:hand","text"],null]']
src = "blake3:c2910fb995cc0d546cc7c2277bc165b6200dd15ed94593647e39be6476aa47e8"
text = "携扇西去：此事托付与守得住之人"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:open","reply"],null]']
src = "blake3:b674bab94a97363530e268cf0d3c27a11ad4041339c1f75f7befdca0f3110d66"
text = "我将扇子别入腰间，差人赴长崎探听去往果阿的船信：哪艘最先开拔，哪位船主愿捎带一条小早。水手问我西边究有何物。我答不知，正因不知才要去。海路皆由人行出，浓雾亦然，过往的船多了，它自会让道。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c05_summons:open","text"],null]']
src = "blake3:bc45e636688c1759be0438948683e48a1bd42d980de8fa8b888598a39fb25a18"
text = "携扇西去：教雾散开，海原该让所有的船走"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:cross","hint"],null]']
src = "blake3:8230b98c249607cf2a0bf601cef6da54d1f370b8d56419b736d903dd9bbe0831"
text = "你手中并无能令海草退让之物。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:cross","reply"],null]']
src = "blake3:710646537bb93d4a3a4991312d8f0bd3ca1caf0f3c6f728e32b75ce9ffb69454"
text = "我依着抄片上的那句话缓缓吟了一遍。起初海草纹丝不动，继而好似水下有人拨弄，层层向两侧退避，辟出一条仅容小早穿行的窄缝。我回首望去，安格拉的灯火正一盏接一盏熄灭。扇子上的歌依旧白着。船首驶入缝中。过去了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:cross","text"],null]']
src = "blake3:545017709e1b2b32e538401450b8f99f566763984ccbf76508f7d23f5044d900"
text = "照《翠玉录》抄片上那句话，驾船驶入海草"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:turn_back","reply"],null]']
src = "blake3:a3af6a6219a76d6c5c26bce98959e06768c9f09cafcfb12aca4faa2a064b51a9"
text = "我合起扇子，下令掉转船首。舵手暗舒一口长气，却没敢叫我听见。归途顺风起得迅疾，刹那便鼓满船帆，恍若有人于身后相推。我未曾回望。抵至安格拉，那位葡萄牙老领航立在码头问我见着了什么，我回他：海草。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:turn_back","text"],null]']
src = "blake3:3efa14513a799c4148ea74cb2a3500bc9115ae5db3be074eff470e64cc35f176"
text = "掉头返航：今年这片海，尚不属我"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:wait_fog","reply"],null]']
src = "blake3:084e9f2cc1718b7ed391fdba40eb29fb81ad1363243b0b1744780fcb09f15cb0"
text = "浓雾终究未散。唯半夜雾气淡薄的刹那，西边低空显出两颗挨近的亮星，一黄一白，恍若同根竿上挑着的两盏灯。我取炭笔将二星方位描在扇背，刚收笔，浓雾又合拢过来。天明之后，我便叫人掉转船头。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c06_dark_sea:wait_fog","text"],null]']
src = "blake3:ab410adb6ed958113b445a698bdb5a2596e9648b93ded89f140c0497c61a21bb"
text = "泊于海草旁候上一夜，看雾散不散"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:box_fan","reply"],null]']
src = "blake3:75a3c3d765b0f7365f8781b1657c85a4838b1d37f3e9810a3dfcb8a6a9776103"
text = "我将扇匣置于船舱底处，上头压了块压舱石。那一年我的船行得格外平稳，稳到水手们都打趣不像我驾的船。岁末启匣察看时，扇面墨迹丝毫未褪。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:box_fan","text"],null]']
src = "blake3:dcf774dac216372c983c0b5ecd9fd818e8402d3da500642a4a3be41f77d23846"
text = "把扇子收入匣中，一年之内不再开启"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:song","reply"],null]']
src = "blake3:87f7f95809b2211342e0d7fa7091e9aa1207b827452c1d86e183b00426aa2e0c"
text = "我熬着写了一宿，揉废的纸团堆了半舱。破晓时仅留下一句：雾里的岸，一如下田的沙洲，望得见，拢不去。我将其抄录在扇背最末一根扇骨旁，字迹挤作一团，不凑近灯火细辨实难认出。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:song","text"],null]']
src = "blake3:7b4cc74d97482f488e3068fa8a99317a0f9e3a700bc824c330213a89ef149a31"
text = "将此行写成一首歌，任谁问询皆不解释"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:tell_ushio","reply"],null]']
src = "blake3:8fac196cd6910ae9aa3a080adb171395618ad2506386d6cfd58d56a5aa2cda98"
text = "我将始末细细道来，汐却始终埋首织补渔网，手上未曾歇过。待我说罢，她只抬口一问：“彼处的潮水，几时转向？”我张口结舌，竟无言以对。她轻笑一声，将渔网一端抛与我：“既答不上，便再去走一遭。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c07_after:tell_ushio","text"],null]']
src = "blake3:e94fe6bc2a71c8577291103279202dc25d5e11fb6d151555facc773024a8ea7e"
text = "返归能岛，说与汐听"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:abroad","news"],null]']
src = "blake3:a77ffe8eda0a2380bfb17e324dca7132798e172589c93ad1a1a2e0b69cb3b345"
text = "据能岛的老水夫讲，关白贴出告示那日，一条家的姬君便将自家旗帜升上桅顶，径自南下了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:abroad","reply"],null]']
src = "blake3:e863742c367856f5df0acc281555419816966fc709fa4de9e5c4b3d208239503"
text = "我将一条家的旗升至桅顶，纤绳扯得绷紧。老水夫仰首望去：“内海里不准悬了。”我答道内海不准，海外总归使得。他们合力推船下水，直推到水漫膝头仍未肯松手。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:abroad","text"],null]']
src = "blake3:2c27a7fe2a4d1b37ce4f13e8f639086ec1370025eb2a1264c1c0e1a0ca9b528d"
text = "升起自家旗帜，远赴琉球与南洋"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:burn","news"],null]']
src = "blake3:da3f6978b75965aa9137d24d515850995c701dff484dec51c0ebdc080d06294e"
text = "听说能岛的关所贴了关白的告示，当日码头便焚起一堆旧旗，浓烟飘到来岛尚能望见。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:burn","reply"],null]']
src = "blake3:de51d8a0f683d3ac4efdb13ddca94857127937a561245841da0c73d89a0a47f7"
text = "烈火足足燃了一晌午，青烟漫卷至来岛尚能望见。老水夫们围立火旁，依次叙起自己头一回领旗是在何年、由谁代为升上桅杆。及至轮到我，我言那一面不在此堆之中，而在我袖内。众人听罢，无一人开口让我也投进火里。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:burn","text"],null]']
src = "blake3:261d2d354295b63ff94fa8f94c79e06a3f130b0000cdb2d8aa34b7b08d971a43"
text = "于能岛码头焚尽旧旗，一面不留"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:yield","hint"],null]']
src = "blake3:32d06aa5f3ddda4c47e4eba7304bb3668f6dd27f7881fb46b96065cb40a109c7"
text = "阿濑缝的那面旗，如今已不在你手头了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:yield","reply"],null]']
src = "blake3:d9137f4512b031c8c7759fef9bc45c1b2ea420f8e2d1b68909698179d54bceab"
text = "我将旗帜折作四叠，针脚敛入内里，递交奉行差人。他回赐一纸钤有朱印的文书，准许我的船在内海转运兵粮。文书簇新，墨气犹呛鼻。我将其塞入袖中，昔日藏旗之处换作一张硬纸，任凭如何塞法皆不熨帖。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c09_edict:yield","text"],null]']
src = "blake3:225c96da940ec476ca651a730dd6fe63b90d0639f0f2b0e677481a2cd6d4e27a"
text = "交出阿濑缝的那面旗，替新的天下效力"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:abroad","hint"],null]']
src = "blake3:143afbd374341521a6c1dd7531ce03ea6938cd08dddae8e8a09ab7d191b192e1"
text = "你尚未决意出海。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:abroad","reply"],null]']
src = "blake3:982c565e144c6392aa07cc2416d2ac92876ea3d652bfde8f35a4c2509f67ffb7"
text = "北风骤起那日清晨，我解开缆绳启航。桅顶一条家的旗帜被劲风扯得平直，船首直指琉球。在那霸港内，无人在意我的旗面钤着哪家大印，泊岸的唐人仅关切船舱可有土佐的纸张。再往南便是吕宋与暹罗，大海之上并无停止令，唯余风信与海潮。彼处潮汐同样一日四转，恰似能岛城脚下一般，独独转得迟缓些，慢得令人昏昏欲睡。途经宫古那夜，我将桧扇别在腰际，立于船头远眺西方天色。舵手请示航向何方。我道：“再来一局。”他咧嘴一笑，顺势将舵往南一扳。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:abroad","text"],null]']
src = "blake3:f6776c7636dc2e4adec4ad77dc5f566c4a4429e02249c51fb2f91494dda02209"
text = "趁北风起，悬一条家的旗出平户"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:flagless","hint"],null]']
src = "blake3:dfd71ea8dc91192cb6f4fa7b4db0b5367866f43f2985c9c052de5cab4222a0d0"
text = "你的旗帜已有了落处。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:flagless","reply"],null]']
src = "blake3:95844816db55b070fb0a05058d9d9494555204c2d600d899b8915154ec16d0f8"
text = "我将船上的旗杆拆了下来，劈去一半当柴烧，余下一半插在码头石阶侧畔量水。船虽不挂旗，仍旧照常出海，归来便泊于平户。码头的孩童们皆唤我看潮的婆婆，每逢黄昏便排成一列蹲在石阶上，瞧着水线一寸寸退去。其中那扎红白束发绳的女娃学得最快，性子也最不服输。有一日她问我，可否将扇子上的歌教给她。我便逐句传授了。她背诵时偏生不肯坐，非得立在石阶最底下一级，两脚泡在水里，念错便直跺脚，溅了我一身水渍。及至念对那一日，恰逢潮信转向，她自己倒未发觉，是我头一个瞧见的。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:flagless","text"],null]']
src = "blake3:9256c03285739eab61d7388e82a4a5a1a7fd1298ea0e4b1ae1e83d7b1b4a0032"
text = "不再挂旗：于平户教孩童辨潮"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:late_abroad","hint"],null]']
src = "blake3:903e475da146288627834dc4bd04e897671416ed28f548dace6d3a4fe2d691cb"
text = "停止令下来那天，你已然替自家的旗选好了去处。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:late_abroad","reply"],null]']
src = "blake3:245c4baf8786d3dab17b8bc03de5a8add69e61522e173d51aeecf631bf0fa5b3"
text = "未曾挂旗，我便出了平户往南行去。桅顶空着，海风照旧从上头吹过，老舵手说船上减了一面旗，走得倒还快些。出港之际，那个系红白束发绳的小姑娘一路追到了码头尽头，连鞋掉了一只也不顾得回头去捡，双手拢在唇边冲我呼喊：“下回准是我赢你！”我没回望，只抬手把扇子晃了晃。我七八岁时在能岛滩上跟收钱的人争着报数，多半也是这般冲人叫嚷的。待船绕过生月岛，再望回去已看不见码头了。我将扇子插回腰带，吩咐舵手往南。到下回，那孩子怕是真要赢过我了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:late_abroad","text"],null]']
src = "blake3:86bdb8ddffa6e39d7080ddfac4b9b7573ea6f294f6ae0e3e6adf8e3695675702"
text = "照旧走：不挂旗，一样能出海"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:service","hint"],null]']
src = "blake3:d75a5c4199d94db2861b204d59c7280b217ff6f46103dab31256890b95f59237"
text = "你并没有把那面旗交出去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:service","reply"],null]']
src = "blake3:bbc684464bd6d4b7ddd05870bdd40702ddbe27e212cdea6a508e6053f47c819a"
text = "我的船悬着朱印旗，在内海往返运送兵粮，从大坂至博多，一年跑上四趟。船里总有几个新来的船手，手上比心里急，舵扳得太重。那日过明石海峡，恰好赶上转潮，一个年轻船手死命往右压舵，压得整条船都歪斜起来。我没有责骂他，走上前，按住他的手连同舵柄一并往左挪了一寸。船体立刻就端正了。他回头看我，整张脸红到了耳根。我同他说，潮转之际莫要硬抗，随它推你一寸，你再还它一寸便是。后来他在舵柄上刻了一道浅浅的印痕，任谁问起也不肯道破缘由。扇子插在腰带中，扇骨顶着肋骨，一整个下午都硌得慌。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio:c10_epilogue:service","text"],null]']
src = "blake3:54f96541afd1c0d1d3abd8e968a76d352cfc959c0cad107f6571424bf8ab9f37"
text = "将扇子插在腰带间，去大坂教新天下的船手众认潮"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:belt","reply"],null]']
src = "blake3:00fb66555acfe51e7b12028777d7058619a8562a3134deb74d3b9255c0b5f434"
text = "舵手不知打哪处港口淘换来一条新腰带，叠得齐整，搁在我的箱盖上。我没换，照旧系着老一条。那道印子留在左腰处，年月长了，色泽比周遭浅了一截。夜深躺进船舱合不上眼，我就拿大拇指沿着那道印子慢慢摩挲，仿佛在抚一道将愈未愈的旧疤。摸着摸着，耳边便听见海潮转向了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:belt","text"],null]']
src = "blake3:099d3b28b57964719bd43b54c38ecd547ae5c71075b475bf7f164976910165f4"
text = "旧腰带照旧系着，印子留着便是"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:song","reply"],null]']
src = "blake3:3eda39ee0d0eb042b7911f59eb2bc0e9a36d154efbaff1f3d68fc0623199b21c"
text = "我依着记忆，一行一行往舱壁木板上誊写。木纹是横着长的，字迹便只好竖着挤在一处；写到银河那句时墨干了，又重研了一回。誊罢，我在最末侧边补上自己的半句：歌留在柱下，人回到潮边。次日舵手在那块板壁前驻足良久，转头问起末了添的那句是何意。我回说是写岔了的地方，不必理会。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:song","text"],null]']
src = "blake3:f1f971bc7e1802767940aa85619f70da711f6d28b4eecabbda2f378abb442d96"
text = "将那首歌誊上船舱板壁，旁人问起也不解说"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:tell_ushio","reply"],null]']
src = "blake3:7c719084df30bf6d2187db63e5744c2d921afe6700c17ee26be44d036c9cb20e"
text = "汐听罢，顺手将织梭往网眼上一别：“扇子送了外人，你倒还舍得。”我回道并非相送，是留着。她鼻子里轻哼一声，静了片刻，又问那根柱子面向哪方。我说朝东。她点点头，似是落了心，低下头继续补她的渔网。临动身时，她打网堆里拽出一段刚搓好的细绳丢给我：“腰间空落落的难看，权且拿这根系上。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f1_after:tell_ushio","text"],null]']
src = "blake3:ce7d411ad4aabb9047624e5dd4ce682da8a632de5e50dea00e99c4a5387471b4"
text = "返一趟能岛，将扇子的下落说与汐听"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:abroad","hint"],null]']
src = "blake3:b84d39f97dca62566a671e181809c6fd6de1bba017321c8f22d818b8a42699d0"
text = "停止令颁下那日，你并未言明要出海远去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:abroad","reply"],null]']
src = "blake3:33cc95e245e8394119d655b227724c043965e32261715f2b30407838e20c1b8e"
text = "北风乍起的清晨，我解开了缆绳。桅杆顶上一条家的旗帜迎风扯直，船头遥指琉球。进了那霸港口，没人盘问旗上钤的是哪家印鉴，泊在岸边的唐人光问我舱里带没带土佐的纸。再向南便是吕宋与暹罗，苍茫海上没有停止令，只认风向和潮汐。南边的海潮也一样一日转四回，同能岛城脚下并无两样，只是来得舒缓，缓得教人犯困。行过宫古那夜，我站在船头望着西边天际，手掌按在腰带那道印子上。舵手来问航向。我说：“再开一局。”他咧开嘴一笑，把舵朝南扳了过去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:abroad","text"],null]']
src = "blake3:31bbf395a68383e7faa7c529ffdcfde1ff49bfb58b39717b1f25f1a058b9b7d6"
text = "趁北风升起一条家的旗，离了平户向南去"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:flagless","hint"],null]']
src = "blake3:93b92259099fb4b9ea860fa86b7c03a432e6d3933f0afe40c4567b0479d378bb"
text = "在能岛时，你早替那面旗定下了去处。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:flagless","reply"],null]']
src = "blake3:45a0c5c6d9ef99839a796c145985b5593c092b5d081183faae031a5484e88ad5"
text = "我卸下船上的旗杆，一半劈了作柴烧，剩下一半栽在码头石阶旁测水深。船头不悬旗帜，仍旧照常出航，返航便停在平户。码头那帮孩子唤我作看潮婆婆，每逢黄昏便挨个蹲在石阶上，瞅着水位线一寸寸往下落。那位系红白束发绳的女孩悟性最好，性子也最要强。有日她缠着问，能否将那支歌传授于她。我便一句挨一句地教了。她背诵时不愿落座，偏要踏在最底下一级石阶上，双脚浸在海水里，一背差了便跺脚，水花溅了我满身。待她终于背得严丝合缝那日，海潮恰巧换了流向，她顾着念歌未曾留神，倒是我头一个望见。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:flagless","text"],null]']
src = "blake3:05de428aed6a6c4013f802cf316b99541259f5658088e7f945632ec9985a9a4d"
text = "就此收旗，留在平户领孩子们观潮"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:late_abroad","hint"],null]']
src = "blake3:a1d7628ed857a193ef35b563a35cb974f043eefde3253ae7f716b8f9b7340db9"
text = "那面旗归往何处，能岛那日便已决断。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:late_abroad","reply"],null]']
src = "blake3:b4c538588d73cc918d2bf55fc9e26554e405d88057c1e5fe20d7eb74eb134df2"
text = "我未曾挂旗便驶出了平户，一路往南。桅顶空着，风照常打那儿刮过，老舵手打趣说船上少了一面旗，跑起来反倒利索。离港的时候，那个系红白束发绳的女孩一直追到码头尽头，跑掉了一只鞋也不回身捡，双手拢在嘴边冲我高喊：“下回我赢你！”我没回头看，只将手举到半空摇了摇。我七八岁那年在能岛滩涂上，跟收钱的人争着报数时，大约也是这副朝人喊叫的模样。船过了生月岛，回望时已再不见码头的影踪。我放下手，按住腰带上那道印子，让舵手继续往南。下一遭，这孩子兴许真能赢过我。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:late_abroad","text"],null]']
src = "blake3:f738bd618ffe0791caeb5c411631031062b0ef4764038b6195ee4c042e9c5030"
text = "仍要启程，无旗亦出海"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:service","hint"],null]']
src = "blake3:31602b03c1758cc13c4f199454986016af0da2d695e6a98da930b580720e11b2"
text = "那面旗既未上缴，大坂的簿册上便不会有你的名姓。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:service","reply"],null]']
src = "blake3:441d0002c1a34dcd9f3ab9fc480ea39c364b4ffb045291046cd91f15a90ff283"
text = "我这船悬着朱印旗，在内海跑兵粮漕运，自大坂往返博多，一年走四趟。船上免不了有几个新招的船手，手头比心思快，扳舵下得太重。那日过明石海峡，正赶上海潮转向，有个后生船手把舵死命朝右压，压得船身都倾侧过去。我没作声斥责，走近去，连着他的手背与舵柄一道朝左轻扳了一寸。船身登时摆正。他回身瞅我，红晕直漫到耳根。我告诉他，潮转之际切莫硬碰，先顺势叫它推你一寸，再还它一寸便是。此后他在舵柄上浅浅划了一道记号，任谁询问都不肯道破。我看在眼里，也没多嘴，只伸手往自己左腰摸了一把。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_fan_left:f2_epilogue:service","text"],null]']
src = "blake3:723c736c860d787e15b7e1b47573149c386d9cd94926d06bd5f9545a671576b5"
text = "赴大坂去，教新天下的船手众识潮"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:bungo","reply"],null]']
src = "blake3:c06a5cb5f0447f088de0cf6d2f76f81b4644cdba84939a23a7b6ab9c29760274"
text = "我说舅舅身在府内，院落宽敞，住着比这儿暖和。母亲仔细将樒叶一片片理平：“义镇那边也有南蛮的寺，钟声可和这里不同。”她仰首望了望高崖上的寺院，“我留在当地，既能听见金刚福寺的钟，又能听见脚下的水声，足够了。”我不再多劝。临行时，她往我手里塞进一把樒枝，吩咐我插到船头。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:bungo","text"],null]']
src = "blake3:568724590b13a8a5d2968ab618ac1f27635de175f485b2ad7bb0c188fafddb10"
text = "接她登船，去府内投奔舅舅"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:rice","hint"],null]']
src = "blake3:0c03ba29e065bdaa792d0ca213a28eab71b9633fc643d1d8f29bc4f21192b30c"
text = "船头攒下的钱，眼下还置办不起这半舱米。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:rice","reply"],null]']
src = "blake3:edf8708c669473d585e90a08794c02acc141c4d9251f834024a1672e8eb45bec"
text = "我命水夫把半舱米扛上高崖。母亲并没拦阻，只吩咐卸到庵屋后头，免得遮挡佛前的通道。外边那两名足轻也跟着帮忙搬了几袋，放妥后只站在门槛外，不肯进屋喝口水。母亲道长宗我部家待她一向周全，按月送一趟米来，吃剩的她皆数转送给了寺里。“你运来的这些，我也一并转出去，”她说，“可别见怪。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:rice","text"],null]']
src = "blake3:e76d3df8c5b640d0cc8ef8b84eeec9aa6047dabb2453138092f1b02525e9eca0"
text = "从船上匀一半米送进庵中"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:vigil","reply"],null]']
src = "blake3:d7866022285d3fa39ba9d0e992724212e7636d72d94bcfaf894591d4f7ad985a"
text = "那晚我留在庵里过夜。母亲做晚课，我便跪在她身旁后头跟着念诵。崖底的水声一阵接一阵翻涌上来，把念佛声一次次压了下去。念到中途，她突然停住，侧耳倾听良久。我问她在听什么，她答道：“风。”说完又继续念下去。庵中灯油所剩无几，做完课便熄了盏，暗夜里她伸手摸了摸我的脑袋，仿佛我还只是个孩童。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o1_cape:vigil","text"],null]']
src = "blake3:37fe0d01d7c132b1cdf3611f34fc976a9db2fc52680d038fa6b241a68df71fad"
text = "歇上一宿，伴她把晚课做了"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:ledger","reply"],null]']
src = "blake3:10c7c86a7aae6b0dd45903bf0fecc4482e6d5ad9a71e2f75109c10b0a8fd5e4e"
text = "我回信道：弥陀收不收你，我可不敢妄言；不过你念佛念了这些载，佛要是不肯收，那便是佛欠你的账。算账我是行的，这笔账，我替你记下了。母亲寄回的信上唯独她自己的笔迹：“混说。”底下却另添了一个字：“记。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:ledger","text"],null]']
src = "blake3:4eca77c412829913dd272f0dd503432d01d6ecc365d3efd6b36d162ace0a2568"
text = "写信答复：佛若不收，算佛欠你的账"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:letter","reply"],null]']
src = "blake3:853634b8d6632b1cd983b6dc4f5759854cdc1121e00f994c52cda7ce7207aadd"
text = "我拣出兼定曾寄来的一封信抄给她，抄的便是那几行：他打小摔跌从不知疼，受洗那日水泼在额顶，破天荒觉出寒意。“母上若是探问，便道我如今怕冷了。”家书寄走两个月后，老尼代笔回信说：母亲看罢，已经叫人给他送了两捆炭过去。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:letter","text"],null]']
src = "blake3:e238686a70192cb38991e60428b76d5a2e562d980364522079afe16028718b8e"
text = "复信抄几句兼定的言语给她"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:visit","reply"],null]']
src = "blake3:8ea88f22cd0265ca0e748285e43b97ae361437ed39de8dd6c5584e753db59291"
text = "我并未写信作复，径直驾船驶往足摺。行至庵前，母亲恰坐在廊下翻晒经卷，见着我先是一怔：“回信呢？”我答称自己便是那封信。她听罢笑出声来，笑着笑着反倒呛咳不止，缓过气后才开口道：“你这副脾气，真像他。”至于她口中的他究竟指谁，我未曾深问。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o2_crosses:visit","text"],null]']
src = "blake3:8853182189f994e70522da71eb08fd924dceccdbc28b6261e75406d7c33d3bc2"
text = "省了回信，直开足摺去"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:quiet","reply"],null]']
src = "blake3:aef52b081ee2c687a04803e7a31ca7cbbc1adeb5eb88547809def42ea74911a7"
text = "我只字未提。趁母亲合眼安睡，我取出她的念珠从头拨起，一粒配一声，行至那处空位时，便极轻地替她补上第一百零八声。清早她醒来，发现念珠静静放在枕畔，却换了摆放的朝向，只看了我一眼，并未多问。那一桩事，我原原本本带回了自己的船上。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:quiet","text"],null]']
src = "blake3:e65a5d1fc0f122ed5de4c9c89fc8dc4e562ce9a0446ced37cb739586c831db8c"
text = "一字不吐，悄悄替她拨尽整串念珠"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:recite","reply"],null]']
src = "blake3:15f91887c19a5493ca1700c4c11d64c495d00a1bc8217b90b6e186fd09300de9"
text = "我将父亲留下的那首辞世念给她听，前前后后念了两遍。说到舵的那一句，我咬字最为缓慢。母亲听完，阖上双目坐了半晌：“到头来，他心坎里挂念的仍是船。”她原先并不晓得他写过这首歌。那一宿她没再念佛，只坐于孤灯底下，嘴唇一张一合。我倾身凑过去才听真切，她正一遍接一遍默诵那首歌，犹如在默背一本账簿。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:recite","text"],null]']
src = "blake3:86fac51c276908c0c7364f6dadfac6fdd2e464c67bf554ad062ee44793345904"
text = "诵父亲那首辞世给她听"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:tell","reply"],null]']
src = "blake3:9a8466def78110b39dd7bb47bd255025d8da58ec3ce59d320091619c739966a3"
text = "我还是讲出了口，语速极缓，一字一顿地吐露。母亲摩挲念珠的手骤然停住，目光却未投向我。静默许久，她才道：“我心知肚明。那一夜，他原是清醒的。”她自言曾从串上拆下一粒珠子，悄悄塞入他的砚池，“他平生都在那方砚台边落墨，总该留一声佛号陪他写字。”说罢她复又拨动念珠，行过那处空缺时，这一遭却未停顿：“敢情你也知道了。既如此，往后倒省得我独个儿记在心里。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o3_bead:tell","text"],null]']
src = "blake3:17c1ea036717d26c4832c503b9645cf8019483c50ba1b8315a78ba546a92a85e"
text = "向她道明：并非什么狂疾"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:hold","reply"],null]']
src = "blake3:df382e4f6fc44783ec87f20105bf5f57eddd32b9bb3ff35c1fb9b7e05795c753"
text = "我攥紧她的手掌，一字一句代她念诵，一声接着一声。刚刚念至第一百零七声，她的手陡然垂松。我停顿片刻，继续念完第一百零八声，直至念罢方才失声痛哭。身畔的老尼始终稳稳敲着小磬，节拍不曾错乱分毫。入殓之际，我将那串念珠安放进她的棺椁中，特把空缺的那一段朝上摆好。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:hold","text"],null]']
src = "blake3:6ff78fff88c8842bf71f3aee072f3cead7eefd17623d31d5b35566e7374bee06"
text = "执起她的手，代她把佛念完"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:sea","reply"],null]']
src = "blake3:27c155eb678c5e1059c375ed46eb9e431fefd4af35b27ae4c6b1f9187b49bc9a"
text = "丧事毕后，我携着那串念珠走至崖底，静候退潮。深黑的海水自西南奔涌而来，擦着崖脚折了个弯，转往东北流走。我将念珠轻轻平放到水面上，珠串并未沉底，而是顺着浪势漂移，很快拐过崖角没了踪影。老尼站在高崖上目送，叹道夫人平生未曾乘船远航，这一遭总算坐了一回。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:sea","text"],null]']
src = "blake3:a1c45f88e88c78cd7cf9bcdb229548ad5990795ba1193be4a30fbae8436bc264"
text = "将她的念珠放入崖下南去的水里"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:vigil","reply"],null]']
src = "blake3:52a08ec5e23518551fab684d94cf66656ad8ba2d697da5d91848e0d90a751f58"
text = "老尼转述夫人早年的叮嘱：身后不立碑，不邀宾客，骨灰半数归葬中村，另半数撒落悬崖之下。我依言操办妥当，守了七宿灵柩，每晚均独坐檐下倾听崖底的潮声。及至第七宿，水声竟与第一夜毫无二致。直那时我方才明白，这便是我母亲多年长夜里所听之声。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_cape:o4_bell:vigil","text"],null]']
src = "blake3:500c872001946a568a6b25fb852131febe77c10251732d540b8d883e8a6e2eb7"
text = "依老尼所传遗命料理，我只管守灵"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:row","reply"],null]']
src = "blake3:900bddfdde2015d06a644cc32f15ce307b69e88c046972faad33286d9937b398"
text = "我亲自扶舵，阿濑独坐船首，整段水路未曾回望一眼下田。行经宫洼濑户时恰逢急潮，她抬起左手向右方点了一点，我顺着她指的方向扳正舵柄，船贴着涡流边缘滑了过去。泊靠能岛之际，栈头岸畔齐齐立着一排老人，阿松婆当先站着。阿濑登岸谢绝了搀扶，独自步上栈桥，行至番所门前，转过身向我摆摆手，那神态仿佛在催我早些回去收钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:row","text"],null]']
src = "blake3:2d8e4b1c1ebf624f8b8f6f29df4495792c2ef218bfc0ab259c07fd4ce90188ac"
text = "由我亲自掌舵，送她回岛"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:stay","reply"],null]']
src = "blake3:ba659446dd2e35d201c449b4f6480720f89e61cfb0b768d2564d192137f68f7e"
text = "我说下田河口缺她不得。阿濑合上箱盖：“姬君这话，自己信得过吗？”我其实不信。河口有政所的人，有本地渔户，更有我调教出来的两个小船头。她道：“奶既然喂罢，血也该还给人了。”隔日我依旧送了她，一路上她未发一言，上岸前却将那只盛渔具的箱子留在了我的船舱里。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:stay","text"],null]']
src = "blake3:e47e36529424f043e4d38dca8667a42d23f422599415846cde287533274ff9ec"
text = "挽留她在下田"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:toll","hint"],null]']
src = "blake3:ca13eb1c501a6684141e4a59c8e151c11cf099c397de310b69b80a67a3cd8971"
text = "眼下你手头凑不出这串旗钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:toll","reply"],null]']
src = "blake3:0580a59648e8d0c96295ed172073ed379dc59c4709198e224a4d8b799450cbf6"
text = "我取来一串钱搁在她箱面上，说是自家这条船今年过能岛的旗钱，特地交与她。阿濑打量一回钱，又瞧瞧我，咧开嘴露出缺牙笑了：“一条家的姬君向村上的人缴旗钱，破天荒头一遭。”她随手将钱拢入怀中：“待回了岛，我给你记进账里。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s1_return:toll","text"],null]']
src = "blake3:64b363dd047ad5ef17174585a691d82b4da4b7967a0cec78088cd3a4e3ae8885"
text = "依能岛成规，付她一面旗的钱"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:allow","reply"],null]']
src = "blake3:17270b863d5df58a9c7e6fa1482a25f9baa6a46cc159b48ab5536b466684482f"
text = "我修书答复：执意要去，便上我船来，坐在舱内替我清点焙烙。我思忖着，人在我船上，至少总在视线里。汐来信告知，她娘听罢骂我把她视作数钱的小丫头，骂过了却又点首：“也罢。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:allow","text"],null]']
src = "blake3:6767551b3915e6b33c7ae8d7ac7c8605285aa2675f35cf5b4dcd85705c0f150c"
text = "回信：要去便上我的船"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:forbid","reply"],null]']
src = "blake3:a389e4f85942efa255cb899798457a1607cade32ab26b80416e2e94257649164"
text = "我回信交代汐，务必要看紧她娘，不准上船，搓罢捻子就回番所坐着。汐的回信寥寥一句：“我管不住。向来没管住过。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:forbid","text"],null]']
src = "blake3:ec17029ac99af578211f8fc9617b1847c569bc6af9dd69f3d567a63e128ab9ff"
text = "回信：不准她登船"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:ushio","reply"],null]']
src = "blake3:d9985c221533dc8c18d5879145e635b07bd93525a5acf233c80926ec47abc3da"
text = "我问汐作何打算。她的回信迟了许久方至：“娘年轻时在船上替人挡过一钩子，那回她也不曾顾谁应不应允。”信尾复有一句：“我会守在她身旁。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s2_fuses:ushio","text"],null]']
src = "blake3:2474b576141ab12386e6c5a0301b05f7ad85fcc759a75c2bc51378f524857bfc"
text = "回信问汐：你意下如何"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:ledger","reply"],null]']
src = "blake3:c1d5e4af0c40aeef33825e2e2090e98c1b3f02d7ccb3d2fff1068f34189e5f3d"
text = "我去了番所，请执笔的老者把这桩事登上去。老人说旗账向来只记账款，不录事由。我说那便只记账：那三人交过的旗钱，全记在阿濑名下。老人思索半晌，在下田一栏底下添写一笔：濑，收三人。阿濑苏醒后，我念给她听。她却说：“记少了一个，是四个。第四个也交过。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:ledger","text"],null]']
src = "blake3:489ce14ff368f5a2d30d5b9daf2e6e66c828d0c8387005d1f8ea7bf6fcf0066f"
text = "将她捞人一事录入番所旗账"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:medicine","hint"],null]']
src = "blake3:0af2bc9f5994c974f08d725278aad44eb121502dcf505033a270f4e0ec1892c3"
text = "延请堺的医家所费不菲，你此刻拿不出来。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:medicine","reply"],null]']
src = "blake3:473654acf2f4259d18ab4d9e5524ba31537ed4043e18d3b0f3194ac5ee8e292c"
text = "我连夜放船往堺去，把城中诊价最高的那位医家请上了船，随身还带了一箱药。医家看过伤势，摇了摇头，还是将药留下了，指点阿松婆换药的法子。阿濑睁眼望着那箱药：“这一箱价钱，足够买三面旗。”我回她旗我有的是。她把脸别向墙侧道：“姬君的钱，素来没使在正处。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:medicine","text"],null]']
src = "blake3:ac8db1acefd21df65491b4f712bb8b44db856e586a83bd645015ab528385ebee"
text = "星夜奔赴堺，延请顶好的医家"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:watch","reply"],null]']
src = "blake3:af6d6dba000dc6477ee4d3679d82fe3337c4bd2ea1f9ad9e6fb3d32bad0da4c3"
text = "我在番所里屋连守九日。阿濑醒转过两遭，第一回开口便问救起的三人活了几个，阿松婆答都保住了命。她点一点头，又闭目睡去。再醒过来时瞧见我，她眉头一拧：“姬君的船搁这儿泊了九日，旗钱谁去收？”我说无人收。她叹声：“真亏。”随后却笑起来，笑得牵动肺腑直咳嗽，咳罢才说腹中饥饿。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s3_last_oar:watch","text"],null]']
src = "blake3:fa5c4d87cd5a7fe1c8181d6ef1022e58a7f38a8b800a014bf4387d248d728410"
text = "留下来在岛上守着她"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:coins","hint"],null]']
src = "blake3:86f2c309c86f4b4e5f583b2af9a91bb7064b45940ea0aa4370d259d7c07bc9f5"
text = "连六文钱也掏不出来了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:coins","reply"],null]']
src = "blake3:9a0ef259abef5619c0fffe1256143cbff5a2d6848e43fbb45c6b964e8ea21f5f"
text = "我修书嘱咐汐，在棺材内放上六文钱，道是我交的。过三途川也得搭船，船家一样要收渡钱；阿濑一生尽收别人的钱，这一趟，合该有人替她掏这笔。汐回信讲，钱已经放好，安在她左手心里，右手原是攥不住的。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:coins","text"],null]']
src = "blake3:b0787fae9631f330a14e38857521801ad95d935453af308e2996bd1eb8e9aef6"
text = "嘱汐在棺内安放六文钱"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:needle","reply"],null]']
src = "blake3:18cf8b72bd44be6f42dfd46dd893abba67095b4b74bcac909074c83234473f5e"
text = "我重返能岛。阿濑安葬在岬角了望岩下方，坟头竖着一根旧篙。汐把那根针交还给我，针尖早已磨出亮光。我将它别到衣领上，位置正同阿濑从前所别一般。那日泊位外有艘路过的商船正等在门前候潮，番所里没见人出门。我自个儿解开缆绳划去，循着阿濑所授的门道，先察船身吃水，再看一眼舱口，随后报了旗号。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:needle","text"],null]']
src = "blake3:a97c0f1074a8e73dc9dde7b73b33f00b508a9e76aae2d94ec906c6314d11ccf6"
text = "往能岛一趟，将那根针别在领上"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:sew","reply"],null]']
src = "blake3:4c0418656bef536699ef0c2ebf39b80594dbffa1832464dd174ba191d5f6d06b"
text = "汐请人将针带到了我船上。入夜后，我把阿濑亲手缝就的那面过所旗展在舱板上，只见旗缘有一处磨损开了线。我依循她旧时的针脚缝缀，一针叠着一针，一直忙活了半夜。缝完的那一段显得比原本粗笨些，任谁一瞧便知出自两双不同的手。我没去拆。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_oar:s4_needle:sew","text"],null]']
src = "blake3:e6dfee33ac655f016a40c74af737ce6f858a081210ec35af903f8ec6d8be5cd7"
text = "拿那根针修补一趟旧旗"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:ask","reply"],null]']
src = "blake3:291d0e19dd22ca15288bca851b074d050833ef55a0b19865eadadba76022aea9"
text = "我寄信问他，撇开冷意，可曾有别的感觉。过了好长时日他才回信，纸上单列了一行行字，一如儿时清点行装：怕。痛。饿。念母上。念弥平次。末了一行写着：“念宗珊。”落笔写这名字时力道甚沉，墨汁透出纸面洇了厚厚一大块。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:ask","text"],null]']
src = "blake3:3ea542363e418c48704678e2f63838b68dd51979d4c03f2073ade783a03e1624"
text = "复信问他：除却觉得凉，还有别的吗"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:paper","hint"],null]']
src = "blake3:8667e029e69cf5f4a5a60c5f7b87d3771ddfbac57c88dfba434ddd6c54cee42b"
text = "手头银钱不够买这一刀纸和墨。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:paper","reply"],null]']
src = "blake3:d7a8668f6591652c1d6a94dd6b1e2cc058b8b4efd508ffbfebe0f3749fcc7728"
text = "我在堺买了刀杉原纸，再搭上一封墨、十支笔，央顺路的鲣船带去。他来信说，纸分给了七个娃娃，各得一叠，教着写自己的名字。有个孩子把“鱼”字涂画成一条真鱼，他没去改，反倒夸奖。“姊上早先也赞过我描的鱼。”我倒不记得曾赞过。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:paper","text"],null]']
src = "blake3:435a5b87ee1cc8ce5a48dd3f7debd5cf95443b152b7a122f5eb4a1e231fc0cdf"
text = "带去一刀杉原纸"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:scold","reply"],null]']
src = "blake3:f1b17e15270f2409932ba714ff0815bc73aafc70c578785d3d23a55695c1ddda"
text = "我落笔写了重话：渡川殁了那么多人，你偏去诵南蛮的经，念给谁听呢。信一寄出我便后悔。他回信倒极安稳：“念给亡故的人听，也念给姊上听。”他说每日替渡川两岸故去的人各诵一回，一条家的、长宗我部的，记不得全名，便直呼作“那边的人”。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p1_water:scold","text"],null]']
src = "blake3:40d28795a00338cbfa2a34152610513ef95870c8a30810dc36300370869e7a1a"
text = "写信责备他：渡川未远，便去念南蛮经"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:owe","reply"],null]']
src = "blake3:8ac78e47dffddc9ea0e90c7ef3227958bbdf31f9d401aafa96032874b547381f"
text = "我问他，神父道认过便一笔勾销么。兼定摇了摇头：“神父说，主已宽宥，人那头依旧欠着。”他提起宗珊昔日有位老仆还活在世上，眼下于中村渡口近旁乞食，他托人打听过，不曾找见。我晓得他说的是谁：正是那年夜里怀抱黑漆文匣跪在我栈桥上的老者。“姊上的船跑得远，劳烦替我上心。若寻到了，我向他磕头。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:owe","text"],null]']
src = "blake3:ad6710f6c46f406a8de8733aef6d44ffa015653b237d7028249db2026838ddd8"
text = "问他：神父道认了便算数？"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:scold","reply"],null]']
src = "blake3:d4f80af9eb597fdf263842d4f4cb40014b608d972a6acc1e188e34005c2aa505"
text = "我直言鹿归鹿、宗珊是人，你将两桩事并作一处提，宗珊泉下有知也不会应允。兼定听罢并不辩解：“正是。神父亦这般讲。伤鹿那回，彼时我懵懂不晓事；宗珊这一回，我是明白的。明知而犯，罪愆愈深。”道完他垂下头去，仿佛幼年写坏了一纸临帖，静候我唤他重写一遍。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:scold","text"],null]']
src = "blake3:96e1fce732935310bd5cea8da52b0f4c63c18f39a1741ddeb5138656f98d1b02"
text = "斥他：鹿归鹿，宗珊是人"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:shrine","reply"],null]']
src = "blake3:dfcd388a45118d52ebd3433000ec962556c749be94e9c58bd4e9bc509eada6dc"
text = "我未搭他的话头，站起身去挪那座空佛龛。木龛是樟木打的，沉坠得紧，我独自抬不动，兼定遂上前搭手抬起另一端。二人合力将它挪出屋外，安顿在屋檐下，他又折回拿了块布巾，细细揩净上面的积灰。“佛像送归寺院了，”他说道，“这只佛龛，母上派得上用场。”"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p2_confession:shrine","text"],null]']
src = "blake3:9dcc24cea73e62b1c773d00c823299f112e0f3a55d847685e69fef7923bfae4d"
text = "一言不发，搭手将空佛龛挪出屋外"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:doctor","hint"],null]']
src = "blake3:680f1caa6d2ed4246e120bf10918fa1f8de2cc65a65dba834e1d19bca0f7f1f9"
text = "此刻手头拿不出请人走一趟的钱。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:doctor","reply"],null]']
src = "blake3:3cd170b043e2299bf759a221e63e3ad6786f339fd58dc72b0ef8bfcecf21bf83"
text = "我修书一封送往府内的南蛮医院，恳请他们遣个通晓金疮刀伤的过去，费用由我担承。院方复信允诺，称会派一名日本修士，随运米船只同往。三月后兼定寄信来说，那修士已经登岛，给他重新敷了药，并指点岛民用沸水洗创。“姊上又代我破费了。”信笺末梢画着一艘小船，艉部题了个“澪”字。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:doctor","text"],null]']
src = "blake3:eac12d469f679f5e8c0a973369d22a2e7869b818dcc2d22fe8b824d1500a02b3"
text = "修书央府内南蛮医院派人前往"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:hunt","hint"],null]']
src = "blake3:da294e27ab1f9ce9d5e88651883e0eb5b5b5ec7a1102b42c1351eb8d4b00947f"
text = "应承下去的赏钱，此刻手头拿不出。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:hunt","reply"],null]']
src = "blake3:caa2772bfff13b24eeecc5f2683b5f05d8a46ef2271fec0f84dd5b9cdf06a415"
text = "我未依从他。我央请中村的故旧，出了一笔赏钱，遣人进山搜寻。搜了一整月才见着人，已断了气，吊在一株栗树上，脚下搁着他的佩刀，刀鞘还缠着一条家的旧藤纹。报信的人请问我，赏钱可还作数。我照付不误。这件差事，我瞒着没对兼定讲。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:hunt","text"],null]']
src = "blake3:fa00f386f7e1167af7b085b4b69f66e601ef060b5286f80bcb0fb3ad3457da2d"
text = "仍旧遣人入山寻访那人"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:obey","reply"],null]']
src = "blake3:2bd7998ce0a3899bfb21f79b9b3b089d7fd92f66fe759e487f2f3dc712b86660"
text = "我折好那封信收拢了，没遣人进山。夜里躺在船中合不上眼，起来看潮水，潮水依旧照时涨、照时退。我想起他小时折了腕子也不掉泪，才接好骨便又要爬树。而这一回，他偏不让人去拿砍他的人。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p3_blade:obey","text"],null]']
src = "blake3:e9b6e71ae97b99a79697f658a233bac290c83fc64d341ff52db37a6f66608474"
text = "依他所言，不去"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:carry","reply"],null]']
src = "blake3:477e170531fca38a6dabe7905c51b4f5d20c805dd35e36c39136a4d6b9150d24"
text = "船行了五天。登岸之日，兼定让人搀抬到岸旁，左手垂搭在膝头，举起右手画个歪斜的十字。巡察使屈膝跪下，同他说了好一阵话，用的是葡萄牙言语，兼定一句都听不明白，只是不住地点着头。孩子们站在后排，各人手捧一张纸，纸上写着自个儿的名字。巡察使一页页挨个审看，瞥见一个把“鱼”字写成一条鱼的，乐出了声。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:carry","text"],null]']
src = "blake3:223b45355ae9503156da8ce569bae405e773ea8a6864e2dc4e323f831e3f9f42"
text = "载他一程，不收渡资"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:charge","reply"],null]']
src = "blake3:adb36d2da4ecdd2415c680c673228deb95f7a3afd946ec69d572d5ad4345d2de"
text = "我按长崎南蛮船的价码报了船资，一文钱不肯少。巡察使的书记听得面色发绿，巡察使却乐了，打趣说日本的女船头比葡萄牙商人还要会盘算，传话照数付款。待船靠了岛，兼定知晓我收过钱，教人把他自己那份粮米折成铜钱贴补给我。我不收，他强塞，到底拗不过我，干脆差遣孩子们往我船里扔鱼干。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:charge","text"],null]']
src = "blake3:a2efb200eca531254905403c13d8ce136526fa66dfa23653f48576ad22ca967e"
text = "捎他去，按南蛮船价目收资"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:map","reply"],null]']
src = "blake3:269a1c351e7adb709615f0aea7493b7cc4835263ad0ebb4d11320afa7d3cbae7"
text = "我推说这季船要往堺去，脱不开身，只替他描了一幅赴岛的水路图：哪里伏着暗礁，哪里须待潮信。巡察使收折好图纸，纳进衣襟，言道定会在那位殿下前头代我带上一句。往后兼定来信告知，说巡察使是揣着一张女子绘就的图登岸的，标画得比神父们的海图更为准当。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p4_visitor:map","text"],null]']
src = "blake3:b7fb7ecd06ae78cf6a4fd2bad7ecd57563521b187603b44c7dec0ec233899d8d"
text = "不顺道载他，画份水路图相赠"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:dusk","reply"],null]']
src = "blake3:47a82807589fad0710d8e0129c6b4a064893caf255c583eb24fe06e8d993ae26"
text = "我在十字前头坐待到暮色合拢。孩子们叠完渔网归家去了。坡底燃起一星灯火，是那位会诵南蛮经的点的，他日日傍晚来点一次，点好便念上片刻经文，操的是土佐口音。我不解他口中念些什么，只辨出其间夹带着兼定的名字，两个名号都在里头，洗礼教名连着本名，挨肩儿一并念出。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:dusk","text"],null]']
src = "blake3:c6d96476a32c2babb4480599c7a0fcc45c63fa53e1ea5c32f805f5b57140619b"
text = "守在十字前直至天暮"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:rubbing","reply"],null]']
src = "blake3:8cc2ee67ef23b21e61c58722bd7cdcfd9a186cdb23a0182433a53c02cb7520c9"
text = "我同渔家讨借了纸墨，蹲身在十字前头拓下一份。墨汁调得薄了些，好几个字拓出来虚淡，独有那几道往右倾倒的笔画印得格外显眼。我将拓纸卷拢带走，开船直奔足摺。其时母亲已然下不得榻，我当她面摊开拓本，她盯看许久，挪出一根指头，循着“兼”字末笔那一捺，朝右顺势比划了一下。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:rubbing","text"],null]']
src = "blake3:36e29c493cbf65fa420c1b65f1626cf82d66bc631f0fb0b7f80592760be1ece1"
text = "拓印一张，捎往足摺呈给母亲"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:wind","reply"],null]']
src = "blake3:c94dc450b17d4b62dc614b367ce9f25c3cb3c35b03ee75b6ee4b8b48367f85c4"
text = "我在滩头捡树枝描了个四平八稳的“兼”字，教那孩子照样子摹。他接连画了三遭，三遭全向右歪斜。我问为何如此，他说殿下正是这么教的，殿下说字朝右倒，是因为风打左侧吹来。我将树枝放回他手里，便不再教了。"

[entries.'["stories/main/main_mio.toml",["choices","main_mio_rw_paulo:p5_cross:wind","text"],null]']
src = "blake3:9b5cb6a51b768a04fb733fdb6ba95997066afd8b37c6d301e353fc0af04cf1e7"
text = "在沙上画个端正的“兼”，教那孩子"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:a05_farewell","news"],null]']
src = "blake3:333e42ea607f4f7bc7bdd7a15c5827f5c233c26d464c3b0a6f2bfd87db7c0813"
text = "平户码头传言，王直的船队借着北风往舟山去了，岸边提着红灯笼相送的，正是从月港来的林家人。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:a06_funai","news"],null]']
src = "blake3:1ae9aa1d5a6fb0ef86e2082e56cc95eceb494f718ae9bfc9fc71b54856556c5d"
text = "府内那间南蛮医院开了门，才头一个月便接了百来个病人，连大友家的武士都赶着去排队。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:a13_fudaraku","news"],null]']
src = "blake3:feae1163fd1949298f7973336b0ee9d5492cce89883ff48d85cfbd13e58e8152"
text = "那智的浜之宫近来又送走了一艘补陀落渡海船，顶着北风行到纲切岛时，拖船将缆绳一刀砍断了。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:a14_kanju","news"],null]']
src = "blake3:399f0dd2d4f94f7b23a5089441bac26a72ad8505f98e47843d688a8d3cd07cd0"
text = "长府外海忌宫的祭船今年险些叫潮水掀翻，岛上依旧无人登临，祭礼却也照旧办妥了。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:b04_exile","news"],null]']
src = "blake3:383e730b01fd8d0eec08cd6588281223a665e39f63fc5f4d7bbccb5598e9fdfb"
text = "在府内码头上，有个戴斗笠登岸的年轻僧人被人认了出来——原是土佐那位一条殿。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:b06_watari","news"],null]']
src = "blake3:089abbc851bf5c7a2cee1dd32f0f762e02e3459e29e97cbe6ec52a43195c802c"
text = "四万十川那一战，长宗我部的兵马趁着退潮趟水渡过了河，河口沙洲上四处漂着两家的旗帜。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:b08_kizugawa1","news"],null]']
src = "blake3:fad4aedefaf3402ed0eb77089f38fc1b8d787d7fc9960b8f84e34c7d1a9fa788"
text = "堺的商人口中都在传，木津川口那一夜里，松脂价钱一天连涨三次；出钱买的是织田家，卖焙烙的是能岛。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:c01_iron_ships","news"],null]']
src = "blake3:f3a266f96203006a80d2e04007413083f15fc6f316c25508dc1181d3c39020bb"
text = "堺里的人都赶去看九鬼家的六条大船，传说是拿铁皮包起来的，铳打不穿——连奈良的和尚都这般说。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:c06_dark_sea","news"],null]']
src = "blake3:590ddb6b893482114d5663b2f34353b5e66119fc7f4ff0e16230228857510294"
text = "特塞拉岛的战事一了，亚速尔西面的洋面上布满了船影，还有人声称夜里瞧见海草泛着光。"

[entries.'["stories/main/main_mio.toml",["defaults","main_mio:c09_edict","news"],null]']
src = "blake3:d1079f4ff56e55164c79e16da8917f64a5cc3fe94c0c57a47d575ad0bfe9716e"
text = "关白颁了海贼停止令，能岛关所门板上钉起了告示，村上家卖了数十年的过所旗，打这以后便全作废了。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a01_sakai_ship:flag_first","news"],null]']
src = "blake3:63322a525ab14cd35818e399168d53e37013f5b4396da6aa5d0a6738fab65e97"
text = "下田栈桥那边有人讲，打堺来的船主只愿先缴一半旗钱，一条家的姬君咬牙应了下来，随即拿炭在船舷上记下了这笔账。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a02_ashizuri:hide_crate","news"],null]']
src = "blake3:7e7f69e9a7b9818093bc00a8ffb3c29fb734e053d5e9dd01b5d37afa8a9a0c20"
text = "在堺的码头上，查验货物的伙计终究撬开了土佐那艘船里的一箱硫磺。船主吃了罚，一条家的姬君也叫会合众记上了一笔。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a04_hirado:carry_letter","news"],null]']
src = "blake3:4b90940fc83605528fdc369c973f0a859d306ddab6c63af9484bcba066356630"
text = "平户的人议论，一条家的姬君替徽王草拟了封书信，措辞过于客套，弥七一边摇头一边把紧要的那几桩都撤换成了口信。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a04_hirado:doubt","news"],null]']
src = "blake3:76a77e4b34d147a965a28aca448da604240ce6ac4b5817a27677ab09a5e26b75"
text = "平户山坡上的徽王听了土佐来的姬君说起京城里的朝廷，听罢大笑几声，道是小姑娘家懂得什么大明的朝廷。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a05_farewell:urge_stay","news"],null]']
src = "blake3:41cdbad6689f4074c46934ccf1f61d22848d8875f5960974e33891826277d5f9"
text = "平户码头上有人瞧见，土佐的姬君拦在徽王船头劝说半宿，徽王拍了拍她的肩头道：大明的事，还得在大明了结。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a05_farewell:watch_tide","news"],null]']
src = "blake3:d699065d7283b82ddc030f908e2d17b6426ab55908b6f91fdad0d56687e6de0b"
text = "平户港中徽王的船队起锚那阵，打头的船在港道里擦着了沙。替他看潮水的土佐姬君算早了一刻，徽王却未加怪罪。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a06_funai:ask_uncle","news"],null]']
src = "blake3:a0d6308ec703a80969082b1d45b53b635766fd192566241dda09486f83f78b00"
text = "府内有人说，大友殿那位打土佐来的外甥女当面问起长府的事，口气太冲，惹得大友殿拂袖离席，可第二天还是差人送了伤药过来。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a07_court_letter:otomo_door","news"],null]']
src = "blake3:217b4700c1a455d0cf0d0e49e1007e3c71da4ef1d0b767eca91fa2998f702a13"
text = "府内的人道，土佐一条家的姬君替朝廷来筹钱，大友殿推说丰后的钱得留着买南蛮的炮，她只得空着手走了。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a11_noshima:mediate","news"],null]']
src = "blake3:e3d7e3507f53a24148e71b1c6b5bb0efc3d164e38b89791fd5fe2df618f29a40"
text = "能岛关所之中，一条家的姬君本欲替能岛与来岛居中调停，来岛通康却冷着脸回道：公家的姬君，且管好自家门里的事。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a12_forged_flags:sell_source","news"],null]']
src = "blake3:1100e8e5f1adb9c383f3b2bd7e1bf50c7de80b4795b6c2db4236968e2f02174c"
text = "伊予滩上的人传，一条家的姬君把假旗的来路卖与来岛，来岛压了她的价钱，转过背又把消息漏给了能岛。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a13_fudaraku:follow","news"],null]']
src = "blake3:3f301d8b297173a68385c3af20a98b3243655610ae039510f31e94928570aa41"
text = "浜之宫那边有人说，土佐的小早尾随渡海船驶出纲切岛，半夜海雾骤起，跟丢了那盏油灯，待天光放亮，海面上已空无一物。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:a14_kanju:steady_sketch","news"],null]']
src = "blake3:ef35f15918ed294b836f699091af39d84fdde5e80c2ad5a5c03bcd726e413d10"
text = "长府外海的人传道，土佐的小早替忌宫祭船扛住了海潮，船里收着的那幅两岛图却叫海浪打湿了半边，还是回到博多后靠着记忆描补齐全的。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b03_sozan:confront","news"],null]']
src = "blake3:d4dba35b47ab84e7e7c2741f558622790d0d4c9b3e0dff97179da5a6aba852f4"
text = "中村御所里头，大姬君同殿下争执起来，言辞失了分寸，殿下将一张旧纸甩还给她，随即唤人送客。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b04_exile:speak_for_him","news"],null]']
src = "blake3:a0cb9aa668a064bacd419aea727cbaf3ec7f8ec2b431134958c2adca4a86a56f"
text = "府内的人讲，土佐来的大姬君奔赴臼杵替落发的弟弟讨一处宅院，大友殿只肯给寺里一间屋子，说是宅子要留给打仗的人。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b06_watari:find_brother","news"],null]']
src = "blake3:b4f82f431cb3925507b2dcd4a977050d1ee8eda6a83150a810647630808644b9"
text = "四万十川战场上，一条家的大姬君拎着薙刀杀入西岸芦苇荡，终究没能冲到殿下跟前；殿下策马向西奔逃，临了回头望了她的船一眼。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b06_watari:rescue","news"],null]']
src = "blake3:c31d3b1b45a4d291839685a0a945cafeda93e0e019727b402da62494fe61f438"
text = "四万十川下游有条一条家的小早，接连捞了一整日落水的人，救上来的实在太多，船板上的血渍洗了三天才算冲净。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b06_watari:seal_mouth","news"],null]']
src = "blake3:91548cbbdfed7de7a1fba3b25971b49d314044ebee5b8feacfe1931097ac6659"
text = "四万十川口有人亲眼见到，一条家的小早拿缆绳横拦住河口，不料湍流挣断了其中一根，长宗我部的两艘船便趁隙从破口钻了过去。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b08_kizugawa1:join_murakami","news"],null]']
src = "blake3:3bd5ca107fe9d907d4156b24f4054eb994fc3430ba8de18386c033648e580f40"
text = "木津川口那一宿，一枚焙烙给风卷了回来，正砸在某条土佐小早的船舷边炸响，把半幅帆都烧毁了。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:b09_yao_bikuni:misdirect","news"],null]']
src = "blake3:5d734e13ff2f02536688224f9138dd6d2f45ff628c1de5f30805424e8061176f"
text = "小浜的人说，一条家的姬君给那个戴龙戒的外国人指了道假路，对方听罢笑了，道是她的谎比他们那边的修士编得更像样，末了照旧朝空印寺走去。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:c01_iron_ships:advise_stay","news"],null]']
src = "blake3:d3980d82852e5a6e75ddf4647c4097377f3e2bcd611e1fe8a9f92111da9cd897"
text = "堺里有人讲，土佐的姬君劝能岛这趟别出海，村上武吉只丢下一句：能岛的船，从不看人家的炮行事。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:c01_iron_ships:night_raid","news"],null]']
src = "blake3:6b578e90fc40a007fe736cd6e8128e6fb5bfe4332d8596cfb99ee8459ab5d514"
text = "木津川口那一宿，九鬼大船的炮火先响起来，一艘土佐小早没等摸到近前便被打退，船尾还挨了一记。"

[entries.'["stories/main/main_mio.toml",["failures","main_mio:c06_dark_sea:wait_fog","news"],null]']
src = "blake3:f5529c09c5c959f6b21c4837e8534d014c05d41654e3f512d82e0c2c45a33980"
text = "安格拉那边有人说，一艘日本小船在西面海草丛旁守了整夜，大雾经夜未散，待天色发白，它便调转船头折返了。"

[entries.'["stories/main/main_mio.toml",["objectives","main_mio:a02_ashizuri:0","text"],null]']
src = "blake3:85b92423ee2c5bde4407c81748ed5a0ce1575a6f21d944e4d08fce4efed8e432"
text = "护送商船平安进堺"

[entries.'["stories/main/main_mio.toml",["objectives","main_mio:a08_donation:0","text"],null]']
src = "blake3:2e2280de38cbd152dfc2eac9c61ee241b7c09dce69db9d68565ee6d213dc680f"
text = "将募来的钱送至堺，交与言继手下的人"

[entries.'["stories/main/main_mio.toml",["objectives","main_mio:a12_forged_flags:0","text"],null]']
src = "blake3:91acfbd4d761f44d3de4d50cbd0e2fba5535d0bfa0532033261a5afc7b82a3cd"
text = "在海上打胜一仗，拿住卖假旗的船"

[entries.'["stories/main/main_mio.toml",["objectives","main_mio:c04_embassy:0","text"],null]']
src = "blake3:bb7608301fbc61076a9b11e6da29ad00c2234eea606c81451c8b64894bb5f664"
text = "赶在黑船起航前抵达长崎"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a01_sakai_ship","news"],null]']
src = "blake3:db78460292a7e6dd53de82c6c39950ba013adf860281d31995c4fa82ed8261af"
text = "停在下田栈桥的那艘堺商船等耐不住，赶到宿毛改雇了别家的旗号绕岬而去，船主临行前还埋怨土佐姬君的架子太大。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a02_ashizuri","news"],null]']
src = "blake3:920980aab7260113e551550a683c2e3ff1f997876ec879b6a2448ded9a79eb13"
text = "堺的会合众传话，土佐那艘小早未曾将商船护送到头，船主只得在纪伊重雇了一面旗，入港时嘴里还在骂咧。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a04_hirado","news"],null]']
src = "blake3:72e36ab71c78857b43ab376f343d141659d8d1c74907c6b62d009da2ae55b055"
text = "平户的人道王直船队已开往五岛，土佐那条小早终究错过了，山坡那座宅院如今只留下看门的人。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a08_donation","news"],null]']
src = "blake3:7e35b2eda65a0267dfbb8d82d459646462e2d91b5a767cc4f48fe37a6b47dcae"
text = "堺的纳屋町那边说，解往京城的钱箱俱已启程，唯独土佐一条家这一份落了空，山科大人还特地在日记里叹了口气。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a11_noshima","news"],null]']
src = "blake3:bb48312adb1285a2e9c767d276a454d26ecc44e323597860047755988b10f84f"
text = "能岛关所道，一条家的姬君这一年未曾前来领印，她卖出去的旗，钱仍旧记在能岛名下。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:a12_forged_flags","news"],null]']
src = "blake3:f3770f25c56b01b3c97e6d96ce648220ef7ca49b73af2f5abbf9e43cf29251ef"
text = "伊予滩上卖假旗那条船，到头来是能岛自家的船前去拿下的。关所里的人说，一条家的姬君没赶上。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:b05_dom_paulo","news"],null]']
src = "blake3:ef6c4fce34cdb32ae1fa22243ce1f5efefe8fc080c49defcc8c4604fed24ccea"
text = "府内传言，受洗后的一条殿盼不来姐姐的船，便自行筹措船只渡海回土佐了。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:b09_yao_bikuni","news"],null]']
src = "blake3:ddbd33c7c144272fc9bd5b774b8f48ba2fbc23dc7936b71542235b606dd7577c"
text = "小浜那头有人讲，打探人鱼肉的那个外国人在若狭盘桓了整整一年，末了乘船朝北边去了。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:c03_yasuke","news"],null]']
src = "blake3:14ea3e2ef18c83c5d55c1b073b5d615b933334976b7337da12abeedc262d3d62"
text = "据堺里人讲，安土那位高个儿的南蛮随从曾托人四下探问一条家的船，却杳无音讯。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio:c04_embassy","news"],null]']
src = "blake3:737b59b1ff974c82eb133b6c9b7974b8122799c6eaa208e6b7d3e3142599bdc7"
text = "长崎的黑船乘着北风起航了，船上载着四名日本少年，据传是要远赴罗马拜谒教皇。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_cape:o1_cape","news"],null]']
src = "blake3:e091cd1079c2418ace36de979148687cd5e01fed6213a5c5b507f4d9cb6b57e5"
text = "足摺的打渔人家都在说，金刚福寺底下那间庵里的老尼，今年始终没盼到船来，反倒是长宗我部的足轻月月准时扛米上门。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_cape:o3_bead","news"],null]']
src = "blake3:76c66a5b665332cec77afefb2c704024ac372536bfa645f92d81e80a4753af82"
text = "足摺庵内的老尼谈及，夫人近两年咳嗽益发凶猛，时常枯坐檐下远眺海面，看上一阵再接着拨弄念珠。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_cape:o4_bell","news"],null]']
src = "blake3:ccddd665322f3af44d71a62cde1f1a9f957c99f1cc9c22f13496cb5c526a36d8"
text = "足摺的渔家传来话，金刚福寺下方小庵里的夫人已然故去，庵中老尼遵照她生前吩咐，并未替她立碑。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_oar:s1_return","news"],null]']
src = "blake3:3bf01992b7a411c7cac6e76a2d1f9853576add66d45ee2ac939c3c575fb7f16f"
text = "下田河口那边传着，打能岛来的那位乳母乘村上家的关船返岛去了，动身时没教任何人相送。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_oar:s3_last_oar","news"],null]']
src = "blake3:de3a99a6dc39b756862a298b11bc11971b7adc2e22dfee2ac4cdd7b7f4e98dd1"
text = "能岛上的人都在讲，老阿濑负了火伤后卧榻了一整个冬天，但凡神智清醒时，总念着问一条家姬君的船抵岸没有。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_paulo:p2_confession","news"],null]']
src = "blake3:895fd03f831efa5df8aaed1de28941db00aff1fa885ab284939665681a3989a7"
text = "下田渡口的人议论，那艘来迎姬君的小艇候了数日，终究放空返航了。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_paulo:p4_visitor","news"],null]']
src = "blake3:d384634dd0c316a0d578b041f507ee0b56af852136472169e9a4a94c1120a9f4"
text = "府内南蛮寺传出话来，讲巡察使另乘了他家的海船，前去探视那位受洗的一条殿。"

[entries.'["stories/main/main_mio.toml",["timeouts","main_mio_rw_paulo:p5_cross","news"],null]']
src = "blake3:bc156a11ecc7c60d762bf3eac7d87c350d63ce3ddcbf6888a884431481b4b932"
text = "宇和海一带渔民传说，那位领洗的一条殿墓前木十字上，刻下的字全向右倾，村童都跟着临摹。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a04_hirado:sulfur","text"],null]']
src = "blake3:25f30b092bdeba249d66faf1d0ff8813937d5eead4e7fbfb029c8fda7c4acaa2"
text = "平户松浦家的码头停满了唐船，半山坡那处宅院高悬着“徽王”旗号。王直手下的火长在码头边一眼便认出我来：堺那一箱硫磺，正是我帮着遮掩过去的。他免了我在栈桥缴泊钱，径直引我登船。船舷旁立着提红纸灯笼的林晚灯，她是月港林家打发来探看王直风向的人。此前我们借她表哥的船通了两载书信，今日方是头一遭谋面。她打量了一番火长，又望向我，张口先问起堺今年纸张的行市。王直早已替我斟好酒，案上铺开一张由五岛至舟山的针路图。通事弥七夹在我们当中传译，绝不落墨成字：“紧要的话莫写。一旦写了，便有人拿去对证。”王直暂不提旗钱，开口先问另一桩：“朝廷一时喊我作贼，一时又许我做官。姑娘既是公家的人——朝廷的话，到底几成作数？”火长侍立在他背后，脚畔正挨着舱口，堺那一箱就压在这条船的舱底。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a05_farewell:doubt","text"],null]']
src = "blake3:126caa36568c523e4b285f67f2853495cf8cf5ede48ee37ad9d93a584ca1e899"
text = "北风打前天便刮起来了，火长说今夜动身。平户港中，王直的大船一艘接着一艘升起风帆，正要回舟山的岑港受抚。码头上点起火把，松浦家的人远远避在一旁。王直在船首察看水色，瞧见我，先开了腔：“你说朝廷的话三成作数——我想了一个夏天，到底还是要赌那三成。姑娘，今夜的潮几时转？你说几时，我就几时起锚。”他把那幅针路图卷拢收好，却没带走，转手递给弥七：“回来再用。”我自家手书的那面旗尚卷在小早船舱内，“一条”二字，还没在任何船上悬过。林晚灯拎着红灯笼立在栈桥末梢：“这灯我替他提至港口外。再远些，便是妈祖的事了。”说罢她把灯笼倒换到了左手。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a09_coronation:paid","text"],null]']
src = "blake3:05b959d6ecb5a738b26790f865ce25a50e22aff2187af4978ff2c37638b27f2f"
text = "我从堺动身上京。即位礼那日下了场晚雪，紫宸殿前白砂上覆了一层薄白，公卿们的靴子踩过去，印出一串串黑迹。钱箱当中有一份乃是我经办的，此番我站定在女房队列的最后一排，正好望得见高御座的帐幔，香烟从帐缝里一缕缕散逸出来。挨着我的年轻女房轻拉了拉我袖口：“莫踮脚，帘子里面看得见。”待散场时，前排一位老女房回转头，一眼便认出了我，拉着我退到廊檐下，塞进我手里一只金纸裹的点心：“土佐来的那个孩子？晒成这般模样了。……当年那张小几，还妥妥收着呢。”站到廊下我这才猛然忆起言继信函里夹带的那张引见帖，只是约见的时辰早已错过了。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a10_wang_echo:v1_amnesty_letter","text"],null]']
src = "blake3:50f401fb16c751387f089595018c00d5475b01948ea052e0c1160074ac7800d1"
text = "一路追到我手上的，是一封从宁波递来的谢帖，用的红纸，折痕压得直挺挺的。王直已然受封，字迹乃是火长代笔，口吻比他本人周到得多：“姑娘替我写就的那几条，朝廷逐一都认下了。”信尾问道：土佐的潮水，这一年可还准确？伴随帖子同来的还有弥七的一句口信，他依旧不肯写字，由船头代为转达：“船主说：姑娘把潮看得准。”红纸平摊在舱板上，拿一块镇石压住，晾晒了整整一下午。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a10_wang_echo:v2_amnesty","text"],null]']
src = "blake3:534eeaa7b15ad3f7b3904ac4f3daa63f05e9e70f56836a75e0359454547ee5ef"
text = "追到我手头上的，是一封打宁波捎来的谢帖，一张红纸，折痕压得端端正正。王直既已受封，朝廷也准了互市，信是火长替他执笔的，比起他本尊客气得多。信里未曾提起官职，单单问了一句：土佐的潮，这一年可还灵准？随帖还带有弥七的一句口信，他照旧不肯着墨，托船头口传过来：“船主讲：姑娘的潮看得准。”我留那送帖的船头吃了一顿饭，拉着他问了一整晚宁波港的泊钱，一条唐船多少文，一条倭船多少文。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a10_wang_echo:v3_dead_flag","text"],null]']
src = "blake3:bd2c88fe80969cf5b6652f25f627f8844304fc4f56c0533f55e0ced60406035f"
text = "打平户过来的船头捎来一张誊抄的告示，纸角已被海风吹得卷起：王直在杭州官巷口处斩，首级示众，余党尽皆溃散。船头将纸递给我时言道：“岑港那边的人全散伙了，惟独弥七还留守在平户。”伴随告示同来的还有弥七一句口信，他一如从前不肯落笔，仍托船头转话：“船主说：姑娘看潮看得准。”抄本侧边空白处，抄写之人以小字附注了一行：岑港那艘大船燃起大火之际，船尾正悬着一面书有“一条”二字的旗。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a10_wang_echo:v4_dead_warned","text"],null]']
src = "blake3:964690d55877e56e8e9e1d6bc914cd5f92458b31fa81afda34b0e893e7fc43bc"
text = "自平户来的船头带来一纸抄下的告示，纸边让海风吹得卷起：王直在杭州官巷口被斩，首级示众，余党四下散去。伴随告示来的还有弥七一句口信，他照旧不肯写字，船头代为转述：“船主说：姑娘的潮看得准。当日真该听从姑娘，多候一封信。”船头又道，岑港的人马早已散尽，只余弥七还守在平户。告示末尾钤有官印，抄写之人竟连那方印也照样描摹了一个。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a11_noshima:ushio_friend","text"],null]']
src = "blake3:19ef3ddda6e71531581b8ab31657975e6557b6ef7f16a72e60783aabf55a0e63"
text = "能岛小到一眼便可望尽，四面潮水一天掉转四回，漩涡就在城墙根底下翻卷。关所底下泊着汐的关船，我踏进门前，正巧听见她在船首跟武吉手下的船头争辩潮汛：“你说申时转潮，那是大潮的日子。今日是小潮，得晚半个时辰，你看那根桩子，水位才到第二道绳呢。”她辩赢了，随后跟着我进到关所里，默立在我背后，一路上再没搭腔。村上武吉张口头一句便问船：“几根桅？此行吃水几尺？”问完这才叩了叩面前那叠未曾写字的旗，旗旁搁着一方石刻印章。窗外对岸，来岛的船一艘接一艘往西去：门司城下，舅舅宗麟的兵马围困着城池，来岛村上正在协助毛利运兵。来岛通康倚靠门边，问能岛还要看几时的潮水。武吉并未理会他：“毛利给得多，我便站近毛利些；大友给得多，我便偏向大友。”他把石印朝我手边一推。我刚探手去取印泥盒，汐在身后扯住我的衣袖，朝窗外她那条关船抬了抬下巴，接着摇了摇头。门外头，武吉的账房已把墨研好了。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a11_noshima:ushio_love","text"],null]']
src = "blake3:f8cc9426e62e0dbf4e851414c15c0aa79dbb7190a99b546d1642198b5d60acfc"
text = "能岛窄小，一抬眼便望见尽头，周遭海潮一日四番涨落调头，涡流就贴着城墙根打旋。关所底下系着汐的关船，缆绳挽的仍是阿濑当年教与我们的结式。汐随我踏进关所，立在门侧，距来岛通康不过两步之遥。村上武吉先开口打听的便是船：“几道桅？此番吃水几尺？”问罢，才屈指敲了敲案上那摞空白旗面，旁侧摆着一枚石雕印信。推窗外望，对岸来岛的船只正接连朝西驶去——门司城下，宗麟舅舅的兵马正围城猛攻，来岛村上则在替毛利运送军兵。通康嗤笑一声：“门司那边杀得火热，能岛还要观望几番潮汐？”武吉不予理会，只道：“毛利出价厚，我便贴近毛利；大友给得多，我便转向大友。”汐指间捻着半截缆索，随手挽成死结，目光仍落在绳头上，低声告知我，她那艘船的停泊钱已由自己缴予能岛，盖印的勾当莫算在里头。武吉听罢，方才将那枚石印推至我手边。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:a12_forged_flags:own_flag","text"],null]']
src = "blake3:0cb5d7bf5b4408b8e3f281a17d9e704915b5fa98d50f8b91db489b05351555d8"
text = "伊予滩一带竟有人兜售伪造的过所旗：过往商船破费买下旗帜，才驶出海峡，转身便遭卖旗贼人自家劫掠。我在海上追了半月有余，终将那贼船死死咬住。武吉事先便递了话来，要连人带印一并押解回能岛。底舱搜出一箱伪旗，压在最顶上那摞摹仿的正是我手书的“一条”二字，共十九面，笔迹远比我拙劣。那船主原是被能岛关所逐出的老账房，此刻伏跪甲板，指甲缝里残留的印泥怎么也洗刷不净，供道：“正主那方石印，亦是小人所刻。唯独您那二字的末笔收锋怎么也摹不像，描废的都压在箱底……”我先扯裂了一面假旗，方才朝下翻检，最底果真藏着一枚木雕私印，印缘光洁不起毛刺，刀工竟比石琢的真印还要精细几分。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b04_exile:asked_sorin","text"],null]']
src = "blake3:95d0463d50bf715b2b32e446fb5e9e6f0eb46368cdaaba4c2499fa1727fe1a4e"
text = "初春的府内码头，一艘赁来的船靠岸停稳，舱里步出个头戴斗笠的青年僧人——正是我那曾为土佐一条家当主的胞弟。他发茬刚落，青涩的头皮上还留着剃刀划破的血痕。他娶的是宗麟舅舅的闺女，此番特意前来投靠泰山。奈何舅舅眼下移居臼杵的岛城，仅遣了个小管事来岸边迎候：“主公身在臼杵，传话道一条殿舟车劳顿，暂且去寺中安歇。”那管事随即压低嗓音，转述了一句主公的原话：“又是那丫头？上次朝我讨一条船，今次又欲索何物？”兼定衣袖上一条家的藤纹已被人铰去，断口处尚未锁边。他踏上码头第一句不是致谢，反倒催问：“大姬君的船，何时能载我回乡？”袖口那截剪坏的纹样毛刺刺的，恰似他这般光景。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b05_dom_paulo:housed","text"],null]']
src = "blake3:061c4a51f9294e9164aeb6b68de479a32bb5f57620bc235a39cf9a958ba6b749"
text = "春日府内，舅舅拨赐的那座宅院里，兼定手下十余名随从正操练长枪，枪头挑得靶上的稻草人摇晃不止。兼定已去南蛮寺领了洗礼，受教名为唐·保罗，颈间悬一串念珠，身上那袭僧袍却还没彻头彻尾换脱。他纠集了幡多的旧部、伊予的法华津家以及岳父大友家的兵马，拼凑出数千之众，打算自宿毛抢滩登岸，顺着四万十川一路杀回中村。他在长廊下铺开一张亲手绘就的河口海图：“神父言道，天主自会赐予我一条归返土佐的坦途。大姬君，你的战船便是那条路。”那图却绘歪了，把下田的沙洲标到了对岸。我执起笔，将沙洲涂改回本该在的位置。兼定凝视着那落墨的一笔良久，方唤我一声：“姐姐。”舅舅自臼杵传来的口信冠冕堂皇：“兵丁我已借出。至于船只——土佐的海域，自是土佐人谙熟。”那串念珠垂在他胸前，仿佛比家纹还要压人。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b06_watari:crew","text"],null]']
src = "blake3:e8bccca97c692c6383ddab9a1c0619832beebb4c385366a66b30b95143df26e5"
text = "秋雨初歇，四万十川涨起大水，江面阔得似海。弟弟的人马在西岸栗本城一带排开阵势，我往年留给他的两名水夫伴其左右，其中一人正蹲身察看潮汐。对岸七片酢浆草纹旗列成一线，长宗我部的七千众正自上游压境而来。我的小早停泊于下田河口，紧挨在那道沙洲外缘。海潮正退，江流朝外奔泄，两股水势顶撞出一道白浪。弟弟隔河大喊：“姐姐，把河口封死！莫让敌船绕去后方！”潮落见底的一瞬，对岸兵马竟恰恰选在沙洲最浅处下水涉渡。隔着江面，我都能听真切那边的足轻叫嚷：“随那渔夫走，水仅及腰。”那条涉水小径，惟有在下田长大的人才识得。沙洲仍在旧地，看顾沙洲的人却换了面孔。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b06_watari:pledge","text"],null]']
src = "blake3:47b4ff9ec9d9856412298191dcea0da95cd74b3c3753ed495be0bde2eb2af51a"
text = "秋雨初歇，四万十川涨起大水，江面阔得似海。此番泊在河口的不只我一叶扁舟：我倾力押上的整支船队在白浪线外依次排开，弟弟麾下士卒自我的船上分批登岸，就在西岸栗本城周边布下阵势。对岸七片酢浆草纹旗列成一线，长宗我部的七千众正自上游压境而来。海潮正退，江流朝外奔泄，两股水势顶撞出一道白线。弟弟隔河大喊：“姐姐，把河口封死！莫让敌船绕去后方！”潮落见底的一瞬，对岸兵马竟恰恰选在沙洲最浅处下水涉渡。隔着江面，我都能听真切那边的足轻叫嚷：“随那渔夫走，水仅及腰。”那条涉水小径，惟有在下田长大的人才识得。沙洲仍在旧地，看顾沙洲的人却换了面孔。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b06_watari:refused","text"],null]']
src = "blake3:f21c33edee877725fc85b5fca7be432476409284761d086ebf4dd82f33cd3d57"
text = "我曾放言绝不出船，然而那日破晓，我终究还是将小早驶至河口。秋雨初歇，四万十川涨起大水，江面阔得似海。弟弟的人马在西岸栗本城一带排开阵势，对岸七片酢浆草纹旗列成一线，长宗我部的七千众正自上游压境而来。海潮正退，江流朝外奔泄，在沙洲外缘顶撞出一道白线。弟弟瞧见了我的座船，隔河大喊：“姐姐，把河口封死！莫让敌船绕去后方！”潮落见底的一瞬，对岸兵马竟恰恰选在沙洲最浅处下水涉渡。隔着江面，我都能听真切那边的足轻叫嚷：“随那渔夫走，水仅及腰。”那条涉水小径，惟有在下田长大的人才识得。沙洲仍在旧地，看顾沙洲的人却换了面孔。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b07_watari_echo:a_held_sealed","text"],null]']
src = "blake3:017d41d7792c3454581ac3bc14606c781096bd9391c84148b2327670ce8f1121"
text = "渡川一战过后，幡多的稻禾无人收割，田亩间横卧着两家的旗杆。渡川口那道白线上，我系的缆绳依然拴在两岸木桩上，无人去解。一路追送到我手头的消息总算不坏：长宗我部的人马退回了渡川东岸，中村御所门首照旧悬着一条家的幔幕。报信脚夫抹着汗言道：“幔幕是连夜重悬上去的，挂偏了也无暇去扶。”母亲已移居足摺一间小庵，托人把中村御所的一串钥匙捎来我船上，铜环摩挲得锃亮。她只留了一句话：“钥匙予你。门是掩是开，你自行定夺。”钥匙依旧沉手，要开的门却已不同。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b07_watari_echo:b_held","text"],null]']
src = "blake3:3b3c9bac8cfdd8fca92eca10737ccc1ce89e9ed4fb955d8dfeef6309b29dd9e0"
text = "渡川一战过后，幡多的稻禾无人收割，田亩间横卧着两家的旗杆。一路追送到我手头的消息总算不坏：长宗我部的人马退回了渡川东岸，中村御所门首照旧悬着一条家的幔幕。报信脚夫抹着汗言道：“幔幕是连夜重悬上去的，挂偏了也无暇去扶。”母亲已移居足摺一间小庵，托人把中村御所的一串钥匙捎来我船上，铜环摩挲得锃亮。她只留了一句话：“钥匙予你。门是掩是开，你自行定夺。”钥匙依旧沉手，要开的门却已不同。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b07_watari_echo:sealed","text"],null]']
src = "blake3:38f3e0663df63904ed6863b5d670a6731611a4538fd25159e97f0cfb29cc3c3c"
text = "渡川一战过后，幡多的稻禾无人收割，田亩间横卧着两家的旗杆。渡川口那道白线上，我系的缆绳依然拴在两岸木桩上，无人去解。一路追送到我手头的消息传来：弟弟领着数十随从乘船远遁伊予宇和海的户岛，中村御所门扉上已贴换长宗我部的封条。报信脚夫抹着汗言道：“封条糊了足足两重，御所里豢养的猫儿都是蹿墙出来的。”母亲已移居足摺一间小庵，托人把中村御所的一串钥匙捎来我船上，铜环摩挲得锃亮，言明御所那头用不着了。她只留了一句话：“钥匙予你。门是掩是开，你自行定夺。”钥匙依旧沉手，要开的门却已不同。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b09_yao_bikuni:rw_chidori_followed","text"],null]']
src = "blake3:03e7ba98ce8ea2bd6610b4b34a47c0b8122b0c4a3f1da2d1c31932e48c67e822"
text = "秋日的若狭小浜，日本海吹来的风已夹带寒意。空印寺后山有座幽洞，相传食过人鱼肉、寿达八百岁的比丘尼终究踏入洞中，再未现身，洞口留有她手植的白椿。京里来的行商顺嘴提起，南蛮人在四条坊门盖起了一座三层寺庙。镇上有个番客四下探询“不老的肉”，日本话吐得生涩断续，手指箍着一枚戒环，状如一条自咬其尾的龙。他拦住我道：“人鱼之肉……或人鱼之血。小姐，你可知何处有？我给金子。”守洞老尼扫着枯叶，头也未抬：“比丘尼步入时言道，活得太久，眼看着身边之人都走光了。你还要找么？”我忽而想起下田的千鸟，往年我顺着她的腰绳潜摸下水，过了七寻深处，海冷如刀割，独独攥在手心里的绳索尚温。那番客充耳不闻，复追问我：尔等神道之中，可有一种饮后不衰的血？他戒环上的龙衔住自己尾巴，盘绕一圈，复又一圈。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b09_yao_bikuni:rw_chidori_hauled","text"],null]']
src = "blake3:3a4b245322d0067a65c8ae7fd3d709a51bfd96bf307b577dc107e850aa730714"
text = "秋日的若狭小浜，日本海吹来的风已夹带寒意。空印寺后山有座幽洞，相传食过人鱼肉、寿达八百岁的比丘尼终究踏入洞中，再未现身，洞口留有她手植的白椿。京里来的行商顺嘴提起，南蛮人在四条坊门盖起了一座三层寺庙。镇上有个番客四下探询“不老的肉”，日本话吐得生涩断续，手指箍着一枚戒环，状如一条自咬其尾的龙。他拦住我道：“人鱼之肉……或人鱼之血。小姐，你可知何处有？我给金子。”守洞老尼扫着枯叶，头也未抬：“比丘尼步入时言道，活得太久，眼看着身边之人都走光了。你还要找么？”我忽而想起下田的千鸟，那年我死攥腰绳将她自七寻水底拉扯上来，她为此恼了我三日；时至今日她入海依然不肯系绳。那番客充耳不闻，复追问我：尔等神道之中，可有一种饮后不衰的血？他戒环上的龙衔住自己尾巴，盘绕一圈，复又一圈。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b09_yao_bikuni:rw_chidori_let_go","text"],null]']
src = "blake3:2580e6969081014e0378dd7b4caaa07435026c02190241b5cfbbbfa1652c1bfd"
text = "秋日的若狭小浜，日本海吹来的风已夹带寒意。空印寺后山有座幽洞，相传食过人鱼肉、寿达八百岁的比丘尼终究踏入洞中，再未现身，洞口留有她手植的白椿。京里来的行商顺嘴提起，南蛮人在四条坊门盖起了一座三层寺庙。镇上有个番客四下探询“不老的肉”，日本话吐得生涩断续，手指箍着一枚戒环，状如一条自咬其尾的龙。他拦住我道：“人鱼之肉……或人鱼之血。小姐，你可知何处有？我给金子。”守洞老尼扫着枯叶，头也未抬：“比丘尼步入时言道，活得太久，眼看着身边之人都走光了。你还要找么？”我忽而想起下田的千鸟，那年她从七寻水下浮出，口中喃喃言及水底藏着屋顶，话音落罢便哭了起来；此后便再也不曾潜往深处。那番客充耳不闻，复追问我：尔等神道之中，可有一种饮后不衰的血？他戒环上的龙衔住自己尾巴，盘绕一圈，复又一圈。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:b10_togashima:held","text"],null]']
src = "blake3:7524a3f2af1358069a3b51260bc36fa352d6c9430ea32ce3efc025074347db29"
text = "冬日里，中村传出的风声顺四万十川淌抵下田：御所中那位领过洗礼的一条殿，夜间遭潜入御所的旧臣挥刀劈伤，虽侥幸捡回性命，身子却再也起不得床。御所侍女连夜延请医官，大夫尚未寻见，倒先召来一名通晓南蛮经文之人。摆渡的老船翁叹道：“动刀的是随侍他十余载的老人。他仆地倒下时，五指仍死死捏着那串念珠。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c01_iron_ships:kizu1_murakami","text"],null]']
src = "blake3:5b03f7da30cf60b7bd869a4ba82faaa27d117ff1fa1fb1f742fb9571ca98af20"
text = "初冬大阪湾内，九鬼嘉隆麾下六艘大安宅船横亘于木津川口，势比堺的佛寺高塔更巍峨。奈良来的僧侣立在码头逢人便道：“铁铸之船，铳弹亦打不透，本寺日记悉数登载。”可谁也未曾触及实物。堺的铁匠铺日夜锤锻铁片，据传皆是九鬼家所定，岸畔便堆码着一叠，每片皆带锻打锤印。能岛的小早再度现身，舱中依旧满载一筐筐焙烙。武吉托人捎来一句：“第三排位置仍为你虚席以待。”我伸指叩了叩那垛铁板，九鬼家船匠在侧急呼：“姬君切莫触碰，此乃我家主公的船皮。”叩击声空洞发虚。铁板生得单薄，无非贴附船舷的一层外皮，全船并非整块生铁打造。然巨舰架设的火炮，确比手掷焙烙打得远。船皮纵为生铁，舱内坐着的依然是凡人。"

