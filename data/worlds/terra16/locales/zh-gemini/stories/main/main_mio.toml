src = "blake3:379512f75241253dc8772f72ea6b15f6257fd15e5cd18c2ec5fed05544e4232d"
text = "小田原开城的风声递到平户时，天下已归于一家。七月间，打罗马归来的少年们带回了一句口信——眼下他们已长成青年了：那封未署收信人的书信，已交与罗马码头上一位画船的人了。五十岁的我坐在平户码头边，双手空空地搁在膝头，腰带上的那道印子经了这么些年，始终没有消褪。港里有位系红白束发绳的女孩划小船输了，心里不服，奔到我跟前，眼睛盯着我腰间：“婆婆，你这儿怎么有一条发白的印子？”我告诉她，从前这儿别过一把扇子，留在了极远的地方。她又追问扇面上写着什么。这么多年头，那首歌我在船上默诵过，在潮水边默诵过，也在弟弟的灯旁默诵过，偏从未念出过声。这一遭我开口念了。词里说的是银河的这头与那头，当中隔着一条无形的水道，有人在这边候潮。女孩听完，蹙着眉想了半晌，说道：“那游过去不就成了。”一旁赢了的男孩笑话她，挨了她一脚。旗换过好几面，歌自始至终只有这一首。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o1_cape:held","text"],null]']
src = "blake3:ec4cf8bf8591adf26094d7a7abda03fe8ab75ba756ca6c2a238b7bcbf3ec896d"
text = "开春时，我自下田取道驶往足摺。幡多安然守住，中村御所门前也重挂起藤纹的幔幕，母亲却未曾搬回，依旧住在金刚福寺下的小庵中。庵后便是峭崖，崖底即那道南去的黑水。“御所内那么些人侍奉他，用不着我。”母亲正跪在廊檐下采樒，篮子里铺了一层青叶，指尖被汁水染得泛绿。她裹头的布巾旧了，整个人较我印象里清减了一圈。见了我，她开口先问的却不是我，而是兼定：“御所的炭可够烧？那孩子畏冷，偏生又不肯讲。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o2_crosses:amida","text"],null]']
src = "blake3:1170eb61f2dde5c114f0ed11b2a54a0d99ad58b9ca5154b05c81f5ae21de1111"
text = "入秋之际，母亲的家信追到了我的船上。正文是母亲口述、庵里老尼代写，唯独落款处才见她亲手落下的只言片语。说是丰后来了人传话，义镇也在臼杵受了洗，取了个南蛮名字，与兼定如出一辙。“一个是我的弟弟，一个是我的儿子，统统投向那尊神去了。只有我守在阿弥陀佛面前，竟成了满门里最后一个。”想来这段话令代笔的老尼颇感惶恐，笔锋战栗得厉害。最末才是母亲的真迹：“你那年说过，潮水不问船是谁家的。他们的神收不收我？我又不要。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o2_crosses:none","text"],null]']
src = "blake3:c27a17acae8a1c3edf7b5844e8181bab887d56cfd171c62acac5887ac798b3d6"
text = "入秋之际，母亲的信一路追到了船上。前段是母亲口述、庵中老尼执笔，末尾才添着她自己写的几字。说是丰后来了人，言称义镇在臼杵领了洗，起了个南蛮名字，恰似兼定从前那样。“一个是我弟弟，一个是我儿子，全去投奔那位神了。唯我坐在阿弥陀佛跟前，倒变成了阖家之中最后一个。”许是老尼不敢轻易落墨，这一句的字体抖得极凶。最后方是母亲亲笔所题的数语：“你当年说你答不上来。时至今日我也答不上来了。他们的神收不收我？我又不去稀罕。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o3_bead:box","text"],null]']
src = "blake3:a78c521d0d83b39c630996221e428aaee9de0e6993a4117689b3e36204857fb0"
text = "开春时我又动身去了一趟足摺。母亲咳嗽愈发沉重，夜里唯有坐着方能入睡。她捏着念珠一颗颗拨，拨过那片空出的位置总要顿一顿，继而再往后拨，这般过了好些年仍未改变。我陪伴在她身旁。父亲留下的砚箱我一直携在船中，砚池角边嵌着的那颗珠子原封不动；袖里掖着的那桩隐情却已沉甸甸压了七载：宗珊临死前托人递出的字纸，上头写着一行“不是狂疾”。族人整整言说了三十年的狂疾，母亲便静静念了三十年的佛，为那个乱了神智、再念不出半声的人代念。窗扇外面，金刚福寺的大钟敲响了一下。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o3_bead:box_fan","text"],null]']
src = "blake3:63a09cbda10914a1e77dcedf17f704a9085ce4a4e41c67a1ee4c8fe1c7953685"
text = "入春后我再度去了足摺。母亲的咳喘愈加沉重，入夜唯独倚坐着打盹。她缓缓拨转念珠，逢到那一格空位便停顿片刻，而后接着往下拨，长年累月皆是这般。我安坐于她身侧。父亲那只砚箱我始终随船带着，砚池棱角间嵌着的那颗珠子尚在原地；腰畔插着的桧扇当中夹有父亲的辞世，而宗珊所书那行“不是狂疾”正压在上面。族中上下谈及狂疾已历三十载，母亲亦默默诵佛三十载，替一个神思错乱、无法发声的人念着。窗扇外，金刚福寺的钟敲了一响。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o3_bead:fan","text"],null]']
src = "blake3:11b0510975a6d0e7ad4a9a101c6abbd9952540f05e28289d0752b50a9fa6d592"
text = "开春时我又往足摺去了。母亲咳得更加剧烈，夜晚只得坐着安歇。她轮指拨动念珠，一触及那段空缺处就略停一下，再复往前拨，这么些年头仍是老样。我挨着她坐定，腰间所佩桧扇内夹藏着父亲的辞世，宗珊写下的那行“不是狂疾”叠在最上，扇骨收拢在一处，比往昔厚实了许多。阖族言称狂疾凡三十年，母亲诵佛亦凡三十年，替那位乱了心性、吐不出字音的人虔诚念着。窗棂外头，金刚福寺传过一声钟鸣。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_cape:o4_bell:recited","text"],null]']
src = "blake3:c1e44e8936bcc1d2960831c131ed7a9bd3b8dc8eb6d242532cc57b95bb2a0906"
text = "自从兼定过世，母亲便绝少言语。庵内老尼传信至平户，只道夫人恐难挨过今冬。我驾船顶着北风走了二十日，赶到足摺之际，石崖间的樒正盛开白花。母亲仰卧在廊檐之下，脸面朝西，五指攥住念珠，攥得指节尽白。老尼轻声说她已三日没吐出音节，唯独唇瓣不停微动。我跪落她身旁，凑近耳畔辨听，这才发觉她诵的压根不是佛号，恰是父亲那首辞世，翻来覆去皆是写舵的那一句。此时金刚福寺钟声敲起，她稍顿了一下，旋即顺着钟声又接续下去。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_oar:s1_return:filled","text"],null]']
src = "blake3:fcb6d18b83cff07930922c8d26b480c25d3b079758122b8117610e6d5cc37b14"
text = "开春后，阿濑清空了网棚，把旧网、梭子连同一只渔具箱全摊到河滩上日晒，箱底压着一册泛黄的旗账，其中一页折了角。她年已五十八，右手早使不动船篙，织补渔网全凭左手。“我打算回能岛去。”她开口时平淡得像在说潮水何时转流，“村上捎来信，说番所旗账上头，下田那一栏这些年留的都是姬君笔迹。我回去，将它换成我自己的字。”待网晒透，她逐张折齐，手搭到最末一张时顿住：“姬君行船，送我一程吧。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_oar:s3_last_oar:murakami","text"],null]']
src = "blake3:55fd6b26fa505a2ff053e39283469345d2001c57d93a78692d2ee3ab7aa0e34d"
text = "木津川口那夜之后，我回了能岛。阿濑仰卧在番所里屋，右半身裹着一层浸过油的布，屋内弥漫着焦头发气味。当晚我的小早列在第三排，谨依武吉的吩咐，投出焙烙便未再回首。阿松婆说，恰在我身后的火光里，有艘小船翻沉，阿濑解开一条小早独自划去——仅凭左手操桨，桨柄顶在胸口，一下一下往水里推。她拉上来三个，第四个才拽到半道，船畔的焙烙炸了。“她嘱咐谁也不准透给你，”阿松婆道，“她说那几个人都是交过旗钱的。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_oar:s3_last_oar:murakami_allowed","text"],null]']
src = "blake3:de18568e6e6ec40b798c061c68aa42af767c606598ef0d8e7d8f89d37374e027"
text = "木津川口那夜之后，我回了能岛。阿濑仰卧在番所里屋，右半身裹着一层浸过油的布，屋内弥漫着焦头发气味。那一晚她原坐在我舱里替我清点焙烙，才点到半途便没了踪影。守在床畔的阿松婆说，待河口大火燃起，有艘小船倾覆，阿濑便趁那会儿解下我船尾系着的小早，独自划了过去——仅凭左手操桨，桨柄顶在胸口，一下一下往水里推。我依武吉的嘱咐未曾回望，半点没察觉她。她拉上来三个，第四个才拽到半道，船畔的焙烙炸了。“她说那几个人都是交过旗钱的。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_oar:s3_last_oar:oda","text"],null]']
src = "blake3:2f37c3d0ae01582e010c603e11067283c7e37644dfc3956bfc9bc356e3f118b3"
text = "木津川口那夜之后，我回了能岛。当夜我曾立在堺的埠头隔岸望火，我卖给织田家的松脂究竟烧着了谁家的船，自己也分不清楚。阿濑仰卧在番所里屋，右半身裹着一层浸过油的布，屋内弥漫着焦头发气味。阿松婆说，那一晚有艘小船翻沉，阿濑解开一条小早独自划去——仅凭左手操桨，桨柄顶在胸口，一下一下往水里推。她拉上来三个，第四个才拽到半道，船畔的焙烙炸了。阿松婆望着我道：“她说那几个人都是交过旗钱的。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_oar:s4_needle:filled","text"],null]']
src = "blake3:6af1e8bfccc5ffadb178096ff85b0cc7813aeade0220d15ec93dfe3952b16373"
text = "入春时，汐捎来的信到了，短得胜过从前任何一封：娘走了。腊月里伤势已好大半，正月偏逢落雪，她定要上泊位看一回潮，回来后便再没起过身。咽气前，她解下领口别着的那根针让汐留好，言明是缝姬君那面过所旗的，“旗若没坏，针便不许丢”。信纸里还裹着一页抄录的番所旗账，最末那栏仍是我当年落笔写下的几个字，墨迹久已淡褪，执笔的老者便紧挨着重描了一遍：下田·濑。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p1_water:ans_none","text"],null]']
src = "blake3:656aa64aa3ca5b36c471d234bf8b1fb140ecf90cbad6b545886deea69c6cc37d"
text = "渡川之后收到的头一封信，是兼定写来的。通篇使的假名，字体一个挨一个立得端直，偏是“姊上”二字依然朝右歪。他自受洗那日落笔：神父举水往他顶上淋，水顺着青头皮溜进领口。“凉。我自小跌了不痛，折了手也不痛，那天水浇上头来，偏偏觉着凉了。”复又写道：“昔年我问人故去后归往何处，姊上答不知。神父晓得，他讲与我听，我便信了。姊上，你莫要笑我。”信尾他说，住处近旁些许渔家孩童想学写字，问我可否顺道捎去一刀纸。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p1_water:ans_sea","text"],null]']
src = "blake3:4cdacf77e2e06f68651c37c112df1d3d1801d1b55185569333b6656848ffb2eb"
text = "渡川之后收到的头一封信，是兼定写来的。通篇使的假名，字体一个挨一个立得端直，偏是“姊上”二字依然朝右歪。他自受洗那日落笔：神父举水往他顶上淋，水顺着青头皮溜进领口。“凉。我自小跌了不痛，折了手也不痛，那天水浇上头来，偏偏觉着凉了。”又写道：“往年姊上言，人亡故后往海彼端去，乘船去不到。神父却道另有途路，不须舟楫。我已踏上那条路了。”信尾他说，住处近旁些许渔家孩童想学写字，问我可否顺道捎去一刀纸。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p1_water:ans_west","text"],null]']
src = "blake3:9944e3a5cf5b0d108292f1554c531033ce1885a35707eed99b2cdad29a74c04c"
text = "渡川之后收到的头一封信，是兼定写来的。通篇使的假名，字体一个挨一个立得端直，偏是“姊上”二字依然朝右歪。他自受洗那日落笔：神父举水往他顶上淋，水顺着青头皮溜进领口。“凉。我自小跌了不痛，折了手也不痛，那天水浇上头来，偏偏觉着凉了。”紧接着又写：“当年姊上讲，人死后向西行，唯有诵过佛的方肯收录。神父却说，不诵亦收，但凭心信。我忖度良久，择了毋须念诵的那一边。”信尾他说，住处近旁些许渔家孩童想学写字，问我可否顺道捎去一刀纸。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p2_confession:buried","text"],null]']
src = "blake3:343927ba8f89429b44d1aefea88b18457cd68b758b5e067b77d4109d1d77a442"
text = "入春，一叶小船靠上下田栈桥，领船的禀报说一条殿邀姬君去一趟：“殿下称有要话得当面言明，写信讲不明白。”我去了。他落脚的地方有间小庙，改饰成了南蛮规制，门楣钉着个木十字，室内旧佛龛仍在，只是里头的佛像搬空了。兼定跪在十字下首，候我坐定才回过身：“我在神父前头告解过了。”头一桩提的是春日野那只小鹿。“那年姊上命我合掌，我照合了，问鹿还痛不痛。神父讲，痛的是我自个儿，彼时我不晓得。”第二桩提的宗珊。一说到这名字，他把双掌平按在膝上，手背上的青筋一根根暴起。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p2_confession:confess","text"],null]']
src = "blake3:e576f585b860fb40404dc65fdd8704d78ac295b82e5680af6c46d8ee412c9abb"
text = "入春，一叶小船靠上下田栈桥，领船的禀报说一条殿邀姬君去一趟：“殿下称有要话得当面言明，写信讲不明白。”我去了。他落脚的地方有间小庙，改饰成了南蛮规制，门楣钉着个木十字，室内旧佛龛仍在，只是里头的佛像搬空了。兼定跪在十字下首，候我坐定才回过身：“我在神父前头告解过了。”头一桩提的是春日野那只小鹿。“昔年姊上按住我头颅教我认，我认了，心底实则空无一物。此番再认，心头才有了。”第二桩提的宗珊。一说到这名字，他把双掌平按在膝上，手背上的青筋一根根暴起。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p2_confession:hid","text"],null]']
src = "blake3:9c8448a8f8f9105222771a8308aa5149981db6bfc95f85b249b7a0151ff914dd"
text = "入春，一叶小船靠上下田栈桥，领船的禀报说一条殿邀姬君去一趟：“殿下称有要话得当面言明，写信讲不明白。”我去了。他落脚的地方有间小庙，改饰成了南蛮规制，门楣钉着个木十字，室内旧佛龛仍在，只是里头的佛像搬空了。兼定跪在十字下首，候我坐定才回过身：“我在神父前头告解过了。”头一桩提的是春日野那只小鹿。“当年姊上同弥平次将它曳入树林掩盖住。我立在一旁干看，那正是我欠下的头一笔。”第二桩提的宗珊。一说到这名字，他把双掌平按在膝上，手背上的青筋一根根暴起。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p3_blade:held","text"],null]']
src = "blake3:b2fb3b2f9d3bff57807f53fb43ae928fc1cf63b87437eb7c9637dabe6ea6d68d"
text = "开春时中村那边来了信，并非兼定亲笔，而是御所里一个会诵南蛮经的人代写的，字写得笨拙，事情倒交代得明白：殿下的刀口长好了，唯独左手举不动，腿脚也不灵便，日日叫人搀着坐到长廊下晒日头。砍他的那名旧臣并未逃远，就躲在中村北面的山中，家臣们想去捉拿，殿下拦着不许。“殿下道，那人追随他十几年，砍这刀是替宗珊大人砍的。”末了一行是兼定亲自补上的，字歪斜得极厉害，好似用拿不惯笔的手写的：“姊上莫来报仇。”"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p4_visitor:held","text"],null]']
src = "blake3:a22fffa6b956654a27bc701570227021ab786305bae1a9f5fa20c691e47e758c"
text = "夏日里，我的船停在府内卸货，南蛮寺差人寻上码头，说是巡察使大人要往土佐的中村探望一位受了洗的殿下，问我肯不肯开船去。那巡察使是个高挑的意大利人，身量比南蛮寺的门框还要冒出半个头，日本话只会说三两句，照面时先合掌，又跟着画个十字，教我一时间不知该还哪一桩礼。他道是听说那位唐·保罗在御所教家臣与渔民孩童学字，“使他自己的字，非我等的字”。他很想过去看看。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_rw_paulo:p5_cross:held","text"],null]']
src = "blake3:6abf7d768d7fff476e27609740d0d3920367f5e419f731ddb9b4cb3d41e53734"
text = "入秋转凉后，我去了趟中村。兼定葬在御所后方的寺旁，坟头立了座木十字，横木刻着数行字，都是他生前亲自写下、教人照样凿的：头一行南蛮字，我识不得；次行写着假名，是他的教名；最末是“一条兼定”。匠人临摹他的笔意雕刻，刻得颇本分，连他平日的习气也跟着刻了出来——个个字往右倾着，像顶着强风走路。渡口一侧有几个孩子在河滩晒网，当中一个望见我，奔过来，指点着木十字道：“殿下教的字。”"
