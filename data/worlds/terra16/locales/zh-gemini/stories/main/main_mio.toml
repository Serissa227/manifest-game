src = "blake3:9ff0d994a51cae4a3c76709fb8e3dfbae12b6c591704e596c6860255bd7f9025"
text = "初冬大阪湾内，九鬼嘉隆麾下六艘大安宅船横亘于木津川口，势比堺的佛寺高塔更巍峨。奈良来的僧侣立在码头逢人便道：“铁铸之船，铳弹亦打不透，本寺日记悉数登载。”可谁也未曾触及实物。堺的铁匠铺日夜锤锻铁片，据传皆是九鬼家所定，岸畔便堆码着一叠，每片皆带锻打锤印。能岛的小早再度现身，舱中依旧满载一筐筐焙烙。武吉央人捎来的言辞带着刺头：“两载前售卖松脂予织田之人，今次复又来凑此热闹么？”我伸指叩了叩那垛铁板，九鬼家船匠在侧急呼：“姬君切莫触碰，此乃我家主公的船皮。”叩击声空洞发虚。铁板生得单薄，无非贴附船舷的一层外皮，全船并非整块生铁打造。然巨舰架设的火炮，确比手掷焙烙打得远。船皮纵为生铁，舱内坐着的依然是凡人。"

