src = "blake3:f7c32fed5fc735ce5cd2c409196f006897a3183e839b128123cb25a9b0a1c37b"
text = "初冬大阪湾内，九鬼嘉隆麾下六艘大安宅船横亘于木津川口，势比堺的佛寺高塔更巍峨。奈良来的僧侣立在码头逢人便道：“铁铸之船，铳弹亦打不透，本寺日记悉数登载。”可谁也未曾触及实物。堺的铁匠铺日夜锤锻铁片，据传皆是九鬼家所定，岸畔便堆码着一叠，每片皆带锻打锤印。能岛的小早再度现身，舱中依旧满载一筐筐焙烙；船阵之中另有一条小早，舷木上划着一溜计较胜负的刻痕。武吉托人递来口信：“再举火焚它一回，一如两载前那般。”我伸指叩了叩那垛铁板，九鬼家船匠在侧急呼：“姬君切莫触碰，此乃我家主公的船皮。”叩击声空洞发虚。铁板生得单薄，无非贴附船舷的一层外皮。然巨舰架设的火炮，确比手掷焙烙打得远。船皮纵为生铁，舱内坐着的依然是凡人。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c02_mimikawa:hospital","text"],null]']
src = "blake3:67c04fdf76dc9a043ec5231fbb7fc12007955e81092ea563d240038c8a1a8c0c"
text = "耳川败绩之后的府内，全城尽是残卒与寡妇。往昔我曾护送水手前去就医的南蛮医院，眼下横七竖八挤满从耳川退归的伤患，门前那册旧账簿里仍留着我的名姓。另一位妹婿田北镇周已然阵亡于日向。宗麟舅舅去岁盛夏受洗入教，此刻闭门深居，府邸外守候的老卒叹息道：“耳川的水全染红了，连淌三日仍不见清。”小妹阿喜多乃伊东家的遗孀，携两个稚子避祸逃往丰后，栖身在一处借住的屋舍。飞雪之夜，她自一只陈年木匣中取出整叠土佐发来的家书递给我看。最面上一函竟是我数年前亲笔所寄，早已抛诸脑后。她低声道：“姐姐，朝东越海便是土佐罢？我身处此地，每每入夜总错觉听闻了四万十川的流水声。”那些我寄出便忘怀的书信，她竟一封未漏尽数珍藏。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c03_yasuke:v1_azuchi_murakami","text"],null]']
src = "blake3:e023327382a68a028fb926671c855683493f95e46f3174875444148599892d85"
text = "当我的船驶入大阪湾时，九鬼的巨舰已三年不曾进过湾口，内海依旧属于村上。开春后，我由堺起身前往安土。城下町的石阶上摩肩接踵，人群皆为一睹那位随南蛮神父东来的高大男子：浑身肌肤黑亮，身量拔出旁人整整一头还多，紧随信长队列步过石阶。信长替他取名弥助，赐下一柄短刀并一座宅院。众人散罢，弥助立在一棵柳树荫下将我叫住。他手头攥紧一封信函，是延请神学校修士用葡萄牙文拟就，收信人居于东非基尔瓦，乃一名金商之子，名叫巴拉卡，当年将他从奴隶贩子手里救拔而出。“弥助这般名姓，是主公起予我的。基尔瓦那位，喊的是我别一个名字。”他吐词迟缓，须将一个字安顿妥当才吐出下个字，“这封信得漂泊许久。行上一年、两年，都使得。他会等着。”接着他问及我：你的名字由谁所赐？往常我最喜抢白答话，此番竟一字也未吐出。澪，是指水面下看不见的那道水路。父亲给的。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c03_yasuke:v2_azuchi","text"],null]']
src = "blake3:e2a3c39e2a7e6ada2fef5b0a9476809ca9ed48ca49e1f32aae0ad24a603fde8e"
text = "开春后，我由堺起身前往安土。城下町的石阶上摩肩接踵，人群皆为一睹那位随南蛮神父东来的高大男子：浑身肌肤黑亮，身量拔出旁人整整一头还多，紧随信长队列步过石阶。信长替他取名弥助，赐下一柄短刀并一座宅院。众人散罢，弥助立在一棵柳树荫下将我叫住。他闻神父言及，土佐一条家的海船会远航去往极远之处。他手头攥紧一封信函，是延请神学校修士用葡萄牙文拟就，收信人居于东非基尔瓦，乃一名金商之子，名叫巴拉卡，当年将他从奴隶贩子手里救拔而出。“弥助这般名姓，是主公起予我的。基尔瓦那位，喊的是我别一个名字。”他吐词迟缓，须将一个字安顿妥当才吐出下个字，“这封信得漂泊许久。行上一年、两年，都使得。他会等着。”接着他问及我：你的名字由谁所赐？往常我最喜抢白答话，此番竟一字也未吐出。澪，是指水面下看不见的那道水路。父亲给的。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c03_yasuke:v3_murakami_holds","text"],null]']
src = "blake3:c814ade8cc4aa84c77e8f6c9b4b81d34c2ded365c8cbff3aa5f5460b72c1f558"
text = "当我的船驶入大阪湾时，九鬼的巨舰已三年不曾进过湾口，内海依旧属于村上。开春后，我由堺动身入京。京城百姓挤得水泄不通，皆为一睹那位随南蛮神父东来的高大男子：浑身肌肤黑亮，身量拔出旁人整整一头还多，信长替他取名弥助，赐下一柄短刀并一座宅院。众人散罢，弥助立在一棵柳树荫下将我叫住。他手头攥紧一封信函，是延请神学校修士用葡萄牙文拟就，收信人居于东非基尔瓦，乃一名金商之子，名叫巴拉卡，当年将他从奴隶贩子手里救拔而出。“弥助这般名姓，是主公起予我的。基尔瓦那位，喊的是我别一个名字。”他吐词迟缓，须将一个字安顿妥当才吐出下个字，“这封信得漂泊许久。行上一年、两年，都使得。他会等着。”接着他问及我：你的名字由谁所赐？往常我最喜抢白答话，此番竟一字也未吐出。澪，是指水面下看不见的那道水路。父亲给的。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c05_summons:a_poem_fudaraku","text"],null]']
src = "blake3:290a8b203c6305fa805f5db2032882c6f55f13390747e7d2a4deb7eb37633317"
text = "京城本能寺那夜燃起的火光，讯息传至海上时已是六月尽头。流言纷纭，或谓信长葬身火海，或谓他自后门遁去，亦有说那高个子家臣被明智手下擒获复又纵放。递信的船头连连摆首：“京城传出的风声，十成里头仅信三成。”入夜后我在船舱展开那柄桧扇。扇骨上题着往年七夕夜写下的歌，隔着白绢写着：银河这边，银河那边。夹在扇骨间的父亲辞世句也露了出来，父亲句中入的是舵，我句中写的是河，两首挨靠一处。我仰望数着繁星，陡然品出别一层深意——银河那边，原不在天上，而在西面的海隅。我蓦地想起那智那条封死木板的船向东南漂远之夜，原来自那时起，我便存了随它走的心思。平户酒馆的南蛮领航员曾谈及，来年夏天木星与土星合于双鱼宫，“亚速尔以西的海草会让出一条通途，老领航都是这般说的”。扇子合了又启，我惊觉自己已在心底推算起行船期程：果阿，好望角，里斯本。歌是朝天上题的，扇子却一直在海上。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c05_summons:father_poem","text"],null]']
src = "blake3:b833415031cce0554cab53e7322d14a5106d0c00f29d3028e716cc7643c231de"
text = "京里本能寺那夜的大火，风声传到海面已是六月底。世间说法不一，有说信长死于火中，有说他从后门遁走，也有人说那位高个子家臣被明智的人拿住又放了。报信的船头直摇头：“京里的话，十成里信三成便罢。”夜里我在船上展了那把桧扇。扇骨上是那年七夕夜里隔白绢所写的歌：银河这边，银河那边。夹在骨间的父亲辞世也显了出来，父亲的歌里写了舵，我的歌里写了河，两首挨得紧紧的。我仰脸数着星星，忽地读出别样意思——那银河彼端，不在天际，是在西边的大海上。平户酒馆里的南蛮领航员说过，明夏木星与土星将在双鱼宫相会，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇面一合又一开，我发觉自己暗暗在排算船期：果阿，好望角，里斯本。歌是朝天上写的，这扇子却一直留在海上。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c05_summons:fudaraku","text"],null]']
src = "blake3:0742174182576d300435e524ffb0b46dad9f5bbbf9233d1d190aeebd68360068"
text = "京里本能寺那夜的大火，风声传到海面已是六月底。世间说法不一，有说信长死于火中，有说他从后门遁走，也有人说那位高个子家臣被明智的人拿住又放了。报信的船头直摇头：“京里的话，十成里信三成便罢。”夜里我在船上展了那把桧扇。扇骨上是那年七夕夜里隔白绢所写的歌：银河这边，银河那边。我仰脸数着星星，忽地读出别样意思——银河彼端，不在天际，是在西边的大海上。我蓦然想起那智那艘钉死的船朝东南漂去的那一夜，原打那会儿起，我心里便想跟着去。平户酒馆里的南蛮领航员说过，明夏木星与土星将在双鱼宫相会，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇面一合又一开，我发觉自己暗暗在排算船期：果阿，好望角，里斯本。歌是朝天上写的，这扇子却一直留在海上。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c05_summons:rw_fire","text"],null]']
src = "blake3:5db6068dd6a214cb9cbc3255562b5797daf75ee46d7f04b086ee49692ad0607f"
text = "京里本能寺那夜的大火，风声传到海面已是六月底。世间说法不一，有说信长死于火中，有说他从后门遁走，也有人说那位高个子家臣被明智的人拿住又放了。报信的船头直摇头：“京里的话，十成里信三成便罢。”这让我追忆起那年上京北面那场火，雨还在落，火势却半分不减，雨滴砸进火里连声响都听不见。夜里我在船上展了那把桧扇。扇骨上是那年七夕夜里隔白绢所写的歌：银河这边，银河那边。我仰脸数着星星，忽地读出别样意思——银河彼端，不在天际，是在西边的大海上。平户酒馆里的南蛮领航员说过，明夏木星与土星将在双鱼宫相会，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇面一合又一开，我发觉自己暗暗在排算船期：果阿，好望角，里斯本。歌是朝天上写的，这扇子却一直留在海上。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c05_summons:yuki","text"],null]']
src = "blake3:01640eea080c1204c7569c928f7df6b2c3f802dcebc6dca127f07a191cac40f6"
text = "京里本能寺那夜的大火，风声传到海面已是六月底。世间说法不一，有说信长死于火中，有说他从后门遁走，也有人说那位高个子家臣被明智的人拿住又放了。报信的船头直摇头：“京里的话，十成里信三成便罢。”夜里我在船上展了那把桧扇。扇骨上是那年七夕夜里隔白绢所写的歌：银河这边，银河那边。骨面上另有一句非我所书，字迹清瘦而冷硬，顿笔处如刀锋。我仰脸数着星星，忽地读出别样意思——银河彼端，不在天际，是在西边的大海上。平户酒馆里的南蛮领航员说过，明夏木星与土星将在双鱼宫相会，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇面一合又一开，我发觉自己暗暗在排算船期：果阿，好望角，里斯本。歌是朝天上写的，这扇子却一直留在海上。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c06_dark_sea:a_dragon_fudaraku","text"],null]']
src = "blake3:d421a78453b3ad3f9f525f8f1b74ee389fb7abab14a811f6343a01ed7efa0456"
text = "盛夏的安格拉，特塞拉岛的港内烟气未散。圣克鲁斯侯爵的舰队才在岛东登岸，法国兵与唐·安东尼奥的人马便往山里撤了。我的船在大海上赶了大半年路才到此处，泊在一群西班牙大船的阴影里。港内有条船的桅顶挂着面旗，上头画了条咬住自己尾巴的龙，和小浜那枚戒指上的纹样一般无二。侯爵的军官挨船传令：“没有许可，任何船只休想往西。西边什么都没有。”码头上一名葡萄牙老领航啐了一声：“什么都没有？那每逢盛夏往西开的船，都到哪儿去了？”向西驶出半日，海草便一层叠一层浮上水面，风歇了，罗经的指针在盘心里乱打转。这片海和那智的海一样，正流向一个叫不出名字的所在。我把桧扇撑开，搁在船头的罗经边上。指针晃到最后，停在了扇子指着的方向，并非正北。当年七夕隔着白绢递歌纸，亦是这般看不见对面。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c06_dark_sea:dragon","text"],null]']
src = "blake3:db25b6c581782a87fb81030ffb7ecf9b6befdea9746178a649138495ae55a7b4"
text = "盛夏的安格拉，特塞拉岛的港内烟气未散。圣克鲁斯侯爵的舰队才在岛东登岸，法国兵与唐·安东尼奥的人马便往山里撤了。我的船在大海上赶了大半年路才到此处，泊在一群西班牙大船的阴影里。港内有条船的桅顶挂着面旗，上头画了条咬住自己尾巴的龙，和小浜那枚戒指上的纹样一般无二。侯爵的军官挨船传令：“没有许可，任何船只休想往西。西边什么都没有。”码头上一名葡萄牙老领航啐了一声：“什么都没有？那每逢盛夏往西开的船，都到哪儿去了？”向西驶出半日，海草便一层叠一层浮上水面，风歇了，罗经的指针在盘心里乱打转。我把桧扇撑开，搁在船头的罗经边上，月色将扇骨上的题歌照得泛白。指针晃到最后，停在了扇子指着的方向，并非正北。当年七夕隔着白绢递歌纸，亦是这般看不见对面。"

