src = "blake3:a535d1fb63b51d1f9f135896ac14354c63ead53f7fd0fe1a7748e0b5b18b099e"
text = "小田原开城的信儿传抵平户，天下复归一家。五十岁的我坐在平户码头上，膝头放着那把桧扇，扇骨叫海风日久磨得发亮，扇纸也糊补过两遭。幡多的门第依旧姓一条，兼定的儿子留守中村，每逢正月都要遣船来平户向我贺岁，船首悬着缀有藤纹的幔幕。港内一群孩子正赛小船玩，有个系红白束发绳的女娃输了局，嚷着非再比一次不可，嗓门倒比胜出的那个还响。她心下不服，跑过来瞧着我的扇子问道：“婆婆，扇子上写了什么？”我将扇面摊开。这许多年头，那首歌我在船头读过，在海潮旁读过，在弟弟那盏灯边读过，却从来不曾朗声诵出。今日这一回，我竟念出了口。歌里所吟的，是银河这头与那头，当间横隔着一道看不见的水路，有人立在此岸等潮。女娃听过后皱眉琢磨了半晌，说：“那直接游过去不就得了。”边上取胜的男孩嘲笑她，挨了她一脚。旗帜换过好几面，唯独这把扇子从头到尾就这一把。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio:c10_epilogue:v4_rome","text"],null]']
src = "blake3:d67c0f198b7dd53c79907c02ee6a9f21d255370c30385d11c85e300a21e6a1fa"
text = "小田原开城的信儿传抵平户，天下复归一家。七月间，那批自罗马归来的少年带回了一句话——现今他们皆已长成青年：当初那封未署收信人姓名的书信，交到了一名在罗马码头画船的人手里。五十岁的我坐在平户码头上，膝头放着那把桧扇，扇骨叫海风日久磨得发亮，扇纸也糊补过两遭。港里有个系红白束发绳的女娃赛小船输了，心中不服气，跑过来盯着我的扇子问道：“婆婆，扇子上写了什么？”我将扇面摊开。这许多年头，那首歌我在船头读过，在海潮旁读过，在弟弟那盏灯边读过，却从来不曾朗声诵出。今日这一回，我竟念出了口。歌里所吟的，是银河这头与那头，当间横隔着一道看不见的水路，有人立在此岸等潮。女娃听过后皱眉琢磨了半晌，说：“那直接游过去不就得了。”边上取胜的男孩嘲笑她，挨了她一脚。旗帜换过好几面，唯独这把扇子从头到尾就这一把。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_fan_left:f1_after:v1_verdict_close","text"],null]']
src = "blake3:440a2fd6c4ac6041245426ad1eaa2de8b456f3629a009f3d4377cbdca934b66e"
text = "入秋时，船穿出重雾，靠进了返程的头一座港口。那头的判词言明门扉即将阖拢，归途上船尾拖出的水痕随即被海草重新铺满，仿佛那道隙缝压根不曾裂开过。自此往后，再无船只能够驶抵那根柱前，柱脚下搁着的那把扇子，也只有柱子独自守望。缆绳还没系妥，我顺着旧习惯往左腰一按，手底却是一空。系的是条旧腰带，扇骨别了将近三十年的地方，磨出一道发亮的印迹，料子比旁处薄，指甲一刮就能分明。舵手说，等回了平户，去町里另买一把，要堺地运来的，泥金扇面。我回道不必了。那首歌我全背得下来，半字未失，日后无非是再不能伸手掀开罢了。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_fan_left:f1_after:v2_verdict_open","text"],null]']
src = "blake3:3cc8ff5e582eced5b2f506254a65bc13ee874643b4070a4d77eb5c47f8b6761a"
text = "入秋时，船穿出重雾，靠进了返程的头一座港口。金板之上所镌的乃是航道洞开，今后无论谁的船都能驶到彼处，去了，便都能望见律法柱脚边那把扇子。十王禁止人挪动它，瞧上一眼想来总是允准的。缆绳还没系妥，我顺着旧习惯往左腰一按，手底却是一空。系的是条旧腰带，扇骨别了将近三十年的地方，磨出一道发亮的印迹，料子比旁处薄，指甲一刮就能分明。港边酒馆里的酒客缠着我讲那面金板，我直说了半宿，至于扇子却连半个字也未吐露。那首歌我全背得下来，日后无非是再不能伸手掀开罢了。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_fan_left:f1_after:v3_council","text"],null]']
src = "blake3:e77ebab1e7efa30696c8ec9988493a556564bf67e098c4455d5df91295b9eab1"
text = "入秋时，船穿出重雾，靠进了返程的头一座港口。那场会最后把那片海交归了何人，我心里铭记得明明白白，往后任凭谁打听也不吐一字。缆绳还没系妥，我顺着旧习惯往左腰一按，手底却是一空。扇子早叫我亲手留在雾那边一根柱子脚下，扇骨朝里搁着。系的是条旧腰带，扇骨别了将近三十年的地方，磨出一道发亮的印迹，料子比旁处薄，指甲一刮就能分明。舵手说，等回了平户，去町里另买一把，要堺地运来的，泥金扇面。我回道不必了。那首歌我全背得下来，半字未失，日后无非是再不能伸手掀开罢了。"

[entries.'["stories/main/main_mio.toml",["variants","main_mio_fan_left:f2_epilogue:v1_nobunaga","text"],null]']
src = "blake3:b7c58c5d9f6005275f78706ef62481c5fee20cbbdcdb5208c23bef3d03b89661"
text = "安土的天下既定，小田原开城的信儿自安土递到了平户。五十岁的我坐在平户码头边，双手空空地搁在膝头，腰带上的那道印子经了这么些年，始终没有消褪。港湾里一帮孩子正划小船比试，有个系红白束发绳的女孩输了，吵着要重赛一局，嗓门比占先的那个还高。她心里不服，奔到我跟前，眼睛盯着我腰间：“婆婆，你这儿怎么有一条发白的印子？”我告诉她，从前这儿别过一把扇子，留在了极远的地方。她又追问扇面上写着什么。这么多年头，那首歌我在船上默诵过，在潮水边默诵过，也在弟弟的灯旁默诵过，偏从未念出过声。这一遭我开口念了。词里说的是银河的这头与那头，当中隔着一条无形的水道，有人在这边候潮。女孩听完，蹙着眉想了半晌，说道：“那游过去不就成了。”一旁赢了的男孩笑话她，挨了她一脚。旗换过好几面，歌自始至终只有这一首。"

