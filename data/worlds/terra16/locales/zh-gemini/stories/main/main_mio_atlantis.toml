src = "blake3:a59a9cccbd654376d297c909a5ade62d6b93115e981665a9b04464149a4d385b"
text = "会议依循古例开启。灯火一盏接一盏熄灭，待最后一盏灭尽，十位王早已披上深蓝长袍，坐定在漆黑之中。今夜他们所审的，乃是外头那个世界。来客居末席，我又是末席中最末的一位，手中紧攥着扇子，浑然不见其形。黑地里起了风，自神庙门缝间钻进来，吹得供台上的金杯叮叮当当地响。有人压低声音道，此乃不祥之兆。柱子那头传来伊斯梅妮的语声，并不高：“来客，只准一句。”过了片刻，柱子那头有人轻声哼起扇骨上那支歌的调子——正是她。她只学会了曲调。风势越吹越紧。我忽记起《古今集》序言里说，歌不用力气，便能撼动天地。十五岁在宫中背诵此句，只当是句好听的话。“该你了。”伊斯梅妮开口，“柱子听着呢。”手里虽看不见扇子，歌却还在。"
