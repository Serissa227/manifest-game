[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at1_fan_pillar","hint"],null]']
src = "blake3:1f045454791a0aae9277458607cb6581142db853fdc4d998193a5051c064ee6c"
text = "船若穿过西面的雾，便去彼处外港上岸；须赶在1583年底前。"

[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at1_fan_pillar","text"],null]']
src = "blake3:81fbebb9c97eae9e819646fa9dacf8a260d58a78c41add59e363cbf1906d52ca"
text = "外港镇上南腔北调，什么言语都有：码头边有人使着老派的葡萄牙话讨价还价，也有人诵着拉丁文的祷词，余下的我便全听不懂了。朝里望去，三重环墙一圈比一圈红，最内里那一重在日头下恍若烧熔的铜。船只准泊在外港，我是走着过桥的。波塞冬神庙中矗着根山铜柱，从顶到底刻满了字。柱前立着伊斯梅妮，不过十八九岁年纪，下巴抬得极高。“所为何来？——王的名号，先搁在一边。”我展开桧扇递到她眼前，扇骨上那几行细巧假名，写的是当年京都七夕的歌。她并不接，仅伸出一根手指将扇面拨翻过去，又拨了回来：“这上头的字迹似水。你们那边的律法，莫非写在水上不成？”“是写在天上。”我回道，“银河两岸的人一年方许相会一回，守了千余年，这便是律法。”我抬手欲指柱上刻字，却被她挡开手腕：“外头来的，别碰这柱子。”她自个儿寻出一行念与我听：携歌而至的客人，可在会议上陈言一句。她比起我初入宫时大不了几岁，神气倒是一样的倔强不肯低头。"

[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at2_council","hint"],null]']
src = "blake3:4b56ed57836b4336bdfc34290a42f6b7ece56b0c874ed9b2896d2821039a6f38"
text = "留在外港，静候十王开会；须在1583年年底前。和歌言灵修满四十，那一夜用得着。"

[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at2_council","text"],null]']
src = "blake3:3e965c4808ec40b91c76408b9d6e4c9a099891cdeeec4b5a6021f877db3fb027"
text = "会议依循古例开启。灯火一盏接一盏熄灭，待最后一盏灭尽，十位王早已披上深蓝长袍，坐定在漆黑之中。今夜他们所审的，乃是外头那个世界。来客居末席，我又是末席中最末的一位，手中紧攥着扇子，浑然不见其形。黑地里起了风，自神庙门缝间钻进来，吹得供台上的金杯叮叮当当地响。有人压低声音道，此乃不祥之兆。柱子那头传来伊斯梅妮的语声，并不高：“来客，只准一句。”风势越吹越紧。我忽记起《古今集》序言里说，歌不用力气，便能撼动天地。十五岁在宫中背诵此句，只当是句好听的话。“该你了。”伊斯梅妮开口，“柱子听着呢。”手里虽看不见扇子，歌却还在。"

[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at3_fudaraku_sea","hint"],null]']
src = "blake3:0fa48ffb54bdf03ffd12195879891ada45af62da28ffe62538d843d4ccccb9c5"
text = "散会后仍滞外港；须在1585年底前，拿定去留的主意。"

[entries.'["stories/main/main_mio_atlantis.toml",["chapters","main_mio_atlantis:at3_fudaraku_sea","text"],null]']
src = "blake3:21269c5c2886272e13eabe9e4e1debc55ab7cc356f0bd3407655cae035cc8273"
text = "会议散了。外港的船只逐一解缆，有的驶入雾中，有的往雾外去，傍晚时分都挤堵在运河口。伊斯梅妮送我至最外层的石阶，遥指东方：“从此往东，海便只是海，再无岸边。”我的小早系泊在码头上，扇子别在腰带里。那智那条钉死的船，缆绳在纲切岛斩断之后，所去的正如这般海域。伊斯梅妮说，幼时曾听一位漂泊而来的修士讲过一桩事：东方有个人，乘在一条钉死的船里漂到此地，住过些时日，又独自离去了，谁也不知去向。“修士说他动身那天，面是朝东的。”我未搭话。运河口的水波一浪接一浪推着船底。她复又问道：“你可还会再来？——先莫作答。答了，便成了律法。”钉子是从外头钉死的，门却是从里头打开的。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:pass_flag","hint"],null]']
src = "blake3:a85703a961492cab1916af198c233a943c78b2461fa315961881f55ea20cf21d"
text = "阿濑那面旗，如今已不在你的船上了。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:pass_flag","reply"],null]']
src = "blake3:cf862f7fd0ab763f15ec9075c9d09dcaad10021c59314416270025a9723136cd"
text = "我自怀中摸出过所旗，摊开在柱前的石板上。旗角早已磨得起了毛，旗边留着阿濑当年一针一线缝补的线脚，前前后后补过三次，用了三种颜色的线。伊斯梅妮蹲下身，拿指尖顺着那针脚抚过一圈。“内海之上若见此旗，无人敢拦船。”我道，“我们那边的律法，便是这面旗。”她扬起脸来看我：“原来外头的律法，是一针一线缝出来的。”待我伸手收旗，她按住旗角，又端详了片刻方才松开。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:pass_flag","text"],null]']
src = "blake3:7336abb569788cbd0798e9aa05f03a871cc4281f3abc6b22c7c738aa43ea5f9e"
text = "将阿濑的过所旗摊在柱前：此乃我们那方的律法"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:recite","reply"],null]']
src = "blake3:09d01eafddaef53c8f8b5e659ef717787e9eb9acd2ec805824b3d9f5807af82d"
text = "我并未撒手，仅将歌中之意逐句念给她听，念得极慢，宛如在码头上为不识字的船主宣读契约。伊斯梅妮听得颇为专注，嘴唇也跟着微动。待我念罢，她问：“那隔在银河两头的人，往后可曾相见？”我收拢扇子插回腰间，垂眼只看柱脚石缝。她静候了一阵，终究没再追问。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:recite","text"],null]']
src = "blake3:6aabc38665f8e0ee1181298e79f6a8243ed0933039ec9c4a5231d9c45ce6fe1a"
text = "手不离扇，只将歌意逐句念与她听"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:sing","hint"],null]']
src = "blake3:ad67b95b89b76e709924c7634524bba2b8249241900d4bcf7ac1d2f48560340a"
text = "你尚未拿定主意，可要让这把扇子脱手。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:sing","reply"],null]']
src = "blake3:2a3979dc511da56341bab7f4f54de6adb64418e4c6920d82813afab69c3c27ed"
text = "我将扇子递进她掌中，开口唱了一遍。从前在宫里，这支歌须得压着嗓音吟诵；到了此处我放开声唱，唱至半途嗓子劈了一下，也并未停歇。神庙之内一片静谧，柱上刻字泛着微光。一曲终了，伊斯梅妮将扇子合拢，双手奉还，扇骨朝向我这一侧。“曲调我记下了。”她言道，“辞藻改日再学，你总得多留些时日。”"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at1_fan_pillar:sing","text"],null]']
src = "blake3:422331d368e72dd8729ca84c9094903177b070b196c78e21ab6fd7fad17c1978"
text = "将扇子递与她，唱一遍扇骨所录之歌"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:calm_wind","hint"],null]']
src = "blake3:e26e6d5b5ed9bb9af29664a147941c13fa930ce108e05c5b4fb4b7ebe6849c13"
text = "你的歌，眼下还撼不动风。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:calm_wind","reply"],null]']
src = "blake3:f4eeab41300fccc8d7f93b68baa4fb23c35dacdc8aef87b263e4636ee0906011"
text = "许给我的那一句机会，我用来咏唱了一首歌。才吟起首句，风仍在门缝间呼啸；唱至第三句，供台上的金杯便息了声响。歌里的意思只此一句：银河那头的人尚未把话说尽，风啊，且先停歇一会。尾音落罢，神庙静得连我指甲刮擦扇骨之声都听得真切。黑暗中有人骤然倒吸一口凉气。天色放亮后，伊斯梅妮引我去看金板：判词一旁多出一行小字，写着外来的客人带来了一首令风止息的歌。她指着那行字道：“这一行是我刻的，字偏了些，莫要见笑。”"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:calm_wind","text"],null]']
src = "blake3:f72bab7e65d0db06c762137b2b72891fd0b885c35e467a585adad2a1e3d1389c"
text = "于黑暗中吟歌一首，令风止息"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:court_words","reply"],null]']
src = "blake3:bd42d14541107ca9590363dbed73edfbaaf07fd44dd68c68e1fcd5b908acee74"
text = "我依循御所里回禀的规矩，先行通名：“土佐一条家之女澪，谨禀诸位殿下——外间海上，有人为一面旗拔刀相向，亦有人为一首歌苦候一年，恳请诸位殿下一并记下。”语毕，我俯身伏地，额头距地面不过一寸。暗处静默了一瞬，十王之中不知是谁轻笑一声，赞这是今夜最体面的言语。伊斯梅妮在柱边录字时，笔锋停顿了两回。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:court_words","text"],null]']
src = "blake3:c8f2e6764d6ca53a00c46a3afd3f64ee87f036775a45e76350c0f000cd558a78"
text = "依宫中礼数答话：先报一条家名号，再述外海情状"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:open_fan","reply"],null]']
src = "blake3:b6723063596c76907b4aa373420550645fc503cb8ac17715ebeb7ee0bff46649"
text = "我一言不发，径直展开扇子。扇骨在暗夜里“啪”然作响，宛如船帆猛然兜满了风。风声似乎未变，又似乎已然不同，我也说不清楚。十王之中无一人作声。伊斯梅妮在柱侧写下：来客未发一言。待天亮后她将那行字念与我听，复说道：“缄口不言的来客，柱子记得最牢。”"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at2_council:open_fan","text"],null]']
src = "blake3:e28f257d25633e297c537d6e32686775fabb9693ddc270a9d137781258491a48"
text = "一言不发，只管展开扇子"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:follow_east","hint"],null]']
src = "blake3:bb651388b8331726375f61494116b25c2fa3a41399de676fc13d94e009b2c10f"
text = "当年那智那条船究竟漂向何方，你并未瞧真切。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:follow_east","reply"],null]']
src = "blake3:8bc2f1c3d4cdc4e302111a187c80c5d30e91ecbd3e7c99a652baba64d74b4dcb"
text = "我解开船缆，顺着她所指的方向行去。整整一天一夜，海面始终只是海：不见岛屿，不见飞鸟，甚至连海草也无半根，唯独水手们的言语越来越稀少。入夜半时，一名年轻水手问是否点灯。“点吧，”我回道，“挂去船尾。”我坐定在船头，将那智那一夜从头细想了一遍——那盏油灯是如何一寸一寸微弱下去的。次日黄昏，夕阳自船尾沉落，将船帆照得透亮，连帆上的补丁都瞧得一清二楚。我叫人调转船头。舵手问我：“瞧见什么了？”“够了，”我说，“都看明白了。”折返运河口时，伊斯梅妮仍坐在石阶上，什么也未多问，只递来一块干饼。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:follow_east","text"],null]']
src = "blake3:f93c67d29c11df927085b85eec02250a63e8f9b9ce51f30ba604f36e82289849"
text = "解缆驾小早，顺她所指往东再行一昼夜"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:go_home","reply"],null]']
src = "blake3:0365bd130327c0354d239cec5d2bb5190c26618d624cdb4bcbdd3e35cfa9c9f8"
text = "“那便不约了。”我说道。伊斯梅妮微微颔首，似是颇为称意：既无约定，便成不了律法，往后无论来与不来，皆不算背约。我纵身跃上小早，吩咐人撑离石阶。她立在阶上遥喊一句：“下回再来，仍须先道明来意。”扇子仍别在腰带里，硌在腰侧。我本想抽出来冲她挥上一挥，手已探到腰带，终究又缩了回来——若这一扬手，便如同立了约一般。运河口的水面平整如镜，将两岸铜墙映得分明。外港铜钟在身后敲响，我数至第七记，始终未曾回首。驶出迷雾后，舵手请问去向。“回平户。”我说，“风向既顺，便不必耽搁。”"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:go_home","text"],null]']
src = "blake3:00753312a9137153afad510565393ec4fb93188f04c1c55cdc1f606a603cd57d"
text = "不许归期，登船返平户"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:leave_fan","hint"],null]']
src = "blake3:bf1efc35a4f4655e6f62994b51b28a40aad1dcf8c648af0bc0996381f34cc93d"
text = "启程西来时你未决意将扇子托付于人，及至立在柱前，心中仍难舍弃。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:leave_fan","reply"],null]']
src = "blake3:97102db9561b972092f25253553275ec6c846a01b005a89dd7ce22b04be5a993"
text = "我转身折回神庙，将扇子合拢妥帖，安放在律法柱底座下，扇骨朝向里侧。伊斯梅妮跟在后头，静静看着，并未阻拦。“歌留在此间，”我说，“总比留在我身上长久。”她蹲下身子，把扇子往柱脚深处推了推，推到门缝风吹不着的地方。她问是否要在柱上刻录一笔，记明是何人所留。“不必了，”我道，“扇骨上原就题着名字。”送我返回运河口的一路，她始终缄默，及至石阶方才开口：“柱子底下的物事，便是十王也动不得。”腰间骤然轻了一块，回平户的整段航程中，我的手总不自觉去抚那个位置，摸到的却唯余腰带上一道磨得发亮的印痕。"

[entries.'["stories/main/main_mio_atlantis.toml",["choices","main_mio_atlantis:at3_fudaraku_sea:leave_fan","text"],null]']
src = "blake3:6300688e298f1ca4d8a74457607798d07414849df6b1c7cd8c011506776c62f5"
text = "返身回神庙，将扇子置留律法柱底"

[entries.'["stories/main/main_mio_atlantis.toml",["failures","main_mio_atlantis:at2_council:court_words","news"],null]']
src = "blake3:2eb3831bbdcd11c54b7e2c945317ed534851555dd7548a6c138d726536ca14f5"
text = "亚特兰蒂斯外港的坊间流传，十王会议那夜，来自日本的女船长依循宫中礼数通了家名，偏生后半句话叫一阵风给吹散了。"

[entries.'["stories/main/main_mio_atlantis.toml",["variants","main_mio_atlantis:at2_council:v1_verdict_close","text"],null]']
src = "blake3:a8251411a2a94ea968a394c616961619401e8f1d43a3f7cf1ddfd619ed28bde8"
text = "会议依循古例开启。灯火一盏接一盏熄灭，待最后一盏灭尽，十位王早已披上深蓝长袍，坐定在漆黑之中。今夜他们所审的，乃是外头那个世界。来客居末席，我又是末席中最末的一位，手中紧攥着扇子，浑然不见其形。黑地里起了风，自神庙门缝间钻进来，吹得供台上的金杯叮叮当当地响。有人压低声音道，此乃不祥之兆。柱子那头传来伊斯梅妮的语声，并不高：“来客，只准一句。”风势越吹越紧。我忽记起《古今集》序言里说，歌不用力气，便能撼动天地。十五岁在宫中背诵此句，只当是句好听的话。“该你了。”伊斯梅妮开口，“柱子听着呢。”手里虽看不见扇子，歌却还在。判词是天明之后方才落定的：门扉将闭。至于眼下，还轮到我这一句话。"

