src = "blake3:4c8bd6612aeedfcde0b11d4725604affb538a9f877d60092d98c7b69f085ee56"
text = "会议依循古例开启。灯火一盏接一盏熄灭，待最后一盏灭尽，十位王早已披上深蓝长袍，坐定在漆黑之中。今夜他们所审的，乃是外头那个世界。来客居末席，我又是末席中最末的一位，手中紧攥着扇子，浑然不见其形。黑地里起了风，自神庙门缝间钻进来，吹得供台上的金杯叮叮当当地响。有人压低声音道，此乃不祥之兆。柱子那头传来伊斯梅妮的语声，并不高：“来客，只准一句。”风势越吹越紧。我忽记起《古今集》序言里说，歌不用力气，便能撼动天地。十五岁在宫中背诵此句，只当是句好听的话。“该你了。”伊斯梅妮开口，“柱子听着呢。”手里虽看不见扇子，歌却还在。判词是天明之后方才落定的：航路将开。至于眼下，还轮到我这一句话。"

