[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_annual_exam_1554:event","text"],null]']
src = "blake3:fb5a2993d754d3739c77cf31a79e90aa0c1c7b1b7934844bea2bb8ce625c8bd1"
text = "秋考摆在讲读间里，一人一具矮几，放着笔、砚与一张鸟之子纸，上臈坐于正中帘前，逐个看着。要抄写的是《源氏》桐壶卷开头那段，自“いづれの御時にか”写起，抄满整页，墨汁不可晕开，字行不准歪斜。前头的见习接连起身，菖交完卷，上臈仅点了一下头。轮到我写时，砚里的墨磨得太稠，笔尖一蘸墨，便在纸边拖出一条细尾巴。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_annual_exam_1555:event","text"],null]']
src = "blake3:e4a973e6769a7f531c994a739d968bbd5faa943c43895f9261664c5bf2b9864b"
text = "讲读间的竹帘尽数垂落，室内仅留一灯。老女房捧炉居正中而坐，炉中埋了块燃透的炭，灰面压出五道细纹，云母片覆在其上。见习们依序跪坐，轮到谁，便取一幅白绢遮眼。白绢独此一条，前头已绕过六人，缚至我脑后时，仍残着别人的发油味，乃是山茶油。香炉递入掌中，尚温。左手承底，右手虚拢罩住炉口，依规只准吸三口。我俯低头去，鼻端先窜入的仍是那缕山茶油。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_annual_exam_1556:event","text"],null]']
src = "blake3:97ac9ad3a1cc2bf6e2d1ee53a36a5df9ab545e4798d3471ed84ca23b61d0fa50"
text = "结业考一共三场，每日一场。讲读间里矮几分成两列排开，上臈跟前摆着一只黑漆文匣，封条贴在匣口，是典侍国子大人封的，题目就在里头。我用的仍是三年前自土佐带来的那方砚，砚池里早已磨出个浅窝。上臈的手刚一挨着封条，廊下便响起一声轻咳：本家的侍从跪在门槛外，一张脸冻得发青，说是房通大人夜里又不好了。上臈的手便停在匣上，人未回头，等着我。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_contest_1554:event","text"],null]']
src = "blake3:cade38349e9bc431dc3a75c29bd5e27b0c1b86fbfd44da2cfb43672b26b52cf9"
text = "歌合摆在典侍国子大人的局里，左右两方隔着一张矮几对坐。做判者的老公卿生着白须，膝前摆了一叠短册。题目是时鸟。今年京中明明还无人听过它叫，局里的女孩子们倒早已写了半个月，写它月下啼，写它山外鸣。我被分到左方，对面便是菖，她的短册叠得齐齐整整，压在扇子下头。冷泉家的雪替右方诵歌，念到别人那首的第三句，眉梢轻轻一跳。我的歌排在第五番。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_contest_1555:event","text"],null]']
src = "blake3:69535baf123626fefd362bd7024187971a7fefa0a8910d39b7ccc6ff26c3169f"
text = "今岁歌合由三条西大人担纲评判。一早局里便颁下歌题：卯花。他还差女孺口传一语，女孺跪在门框旁一字不漏地背诵：“咏卯花之作，十首里有九首爱拿‘うき’二字作双关。今日但凡再以此字入句者，先输去半番。”满屋子的人闻言纷纷低头翻检手里的短册。唯独坐在我身畔的冷泉雪将短册反扣膝前，动也未动。我作的那首恰是用首句“うのはなの”去勾连次句的“うき”，前夜才想出的巧思，足足得意了整两日。清早宝镜寺的尼僧送来一捧卯花，供在讲读间的青瓷花瓶内，众人走过衣袖带风，总会拂落几瓣零星的白。短册须在掌灯前呈交。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_contest_1556:event","text"],null]']
src = "blake3:c36589b889fe018254d48e5651c9cf52f98d3bde414c1a23b2409845719b3bc2"
text = "末了一回歌合，不由上臈出题。每人交上三首，由着自己挑题，写在短册背面，判者念歌之前，先把题念出来。这话才传开，局里的人便都避到屏风后头去了。小督本想挑“饭”，叫上臈驳了回去，改作“稻”。菖早就拿定了主意，把题封进一只小纸包里，任谁来问也不说。冷泉雪说自己挑“无题”，有人笑她，她也并不分辩。汐替我磨着墨，问姬君打算挑什么，我只道还没想妥。实则早有个字在心底转着，只是进宫这三年，不曾听谁拿它作过题。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_enrollment_1554:event","text"],null]']
src = "blake3:4565f96ec657bf2727923178d24aad1e99cc5391f61cae7d0b2145ea7586480c"
text = "凛冽的北风封住了纪伊水道口，船只延误了好几日才得以靠上堺的码头。一条本家的大门并不显气派，门内白砂被耙出一道道整齐的细纹，我脚上的草鞋还裹着堺码头的泥污，在石阶上反复蹭净了才敢跨进门槛。汐早已换上侍女的小袖，怀抱包袱跟在我身侧，步子迈得比我还拘谨。保子大人隔着帘幕见我，先关切路上寒凉与否，又交代说入宫要等来年开春，眼下这些时日便安心住在本家，府里特意延请了一位老女房传授礼法：如何跪坐，如何呈扇，拜见上臈时头一句该讲什么。话音刚落，一册纸边翻毛的薄抄本便从帘底推了出来。“老女房已然讲完过一轮，”她说道，“你既晚到了，就从这一册补起。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_enrollment_1555:event","text"],null]']
src = "blake3:be84b5da164978384994e553d1ee9bc9b2f3824c08c078a1cd942b161f0ee2aa"
text = "新年过后重返宫局，屋里屏风仍旧是那几扇，门边却添了三张新铺的席子。新入局的三个见习年纪皆比我小些，一个缩着脖颈不敢抬头，一个竟将折扇倒握在手，还有个一进门便打听厨间在何处。老女房把这三人拨给了我与小督：“去年你们如何学的，今年便照样去教。”经她一提我才惊觉，自己如今跪坐时早已不必在心里默数时刻了。此刻门外恰有个宝镜寺的小尼探头探脑，打听土佐来的姬君可在屋里。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_enrollment_1556:event","text"],null]']
src = "blake3:889788e27711b04d9cbd61ddf5a5392ed50560da94c193e11e34c5caab7df57b"
text = "正月返局，在上臈门前伏地拜礼，双手向前一递，我自个儿先瞄见了：右边的袖口磨出了一圈毛边，线头翘起，宛似退潮后挂在礁石上的海带。这件小袖乃前年入宫时母亲手缝的，两年里跪过多少遍、研过多少回墨，尽记在这一圈儿上。母亲腊月寄信言，新衣已托付年贡船，偏生年贡船非待开春方入堺。上臈未曾留意我衣袖，只道今岁由三条西大人开讲宇治十帖，正月内谁先读毕三帖，谁便列席跟前。我将双手敛回膝头，右手掩在左手之下。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_graduation:event","text"],null]']
src = "blake3:2581795abe77bb7bba20f95f1ac3049d9275896b39e5ac02aaf5d45f43e98bd2"
text = "结业那日清晨，局里的屏风撤去了一半。夜雪把小庭覆得严实，梅枝上缀着一粒粒硬苞，一朵也未绽开。同局三年的人，过了今日便要散了。菖一桩桩数与我听：她留居宫中，上臈说过，开春便予她正式的女房名；小督开春随一位老女房下向越前，为那边的人家写一季的书信；冷泉雪留在京中，帮家里校勘一部歌稿；我和汐则回土佐，由下田出海。数罢，她探手替我将领口抚平：“离了京，也莫歪着衣领见人。”鞠千代进不来局里，央小女童带进半句话：“未、未时，小庭。”一屋子的人都笑起来。冷泉雪却没笑，用指尖在凝霜的窗纸上划了两个假名，随手又擦去一个。话便这么定下了：未时，梅树下头，谁都不许缺席。汐说由她先过去，将树下的雪踩结实了，省得谁滑倒。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_end_1554:event","text"],null]']
src = "blake3:b89fbdb843d8e2ade7ceba0eefa68fda7f4d0f6051fa658364a36d3a4edb2188"
text = "回局那日，与我同住屏风后的小督正在将晒透的衣裳叠入箱笼，一照面先问本家的饭可够吃，随后才提起：《空蝉》已讲罢了，三条西大人现下讲到《夕颜》。她翻出亲手抄记的讲义给我看，小字密密挤成一团，其余半幅净画了花。“夕颜开在夜间，我没守候到，”她说，“只好比着葫芦画下来。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_end_1555:event","text"],null]']
src = "blake3:d424137a7c2f6b2a420dbc37433d04817b889b0c0cfc695a0be991c4b0570bf4"
text = "踏进局门，檐底的风已透着凉意，拂得门柱新贴告示的一角不住翻掀。屏风背后堆着一夏天无人碰过的物件：我的筝罩着布，布面落了层浮尘，汐伸指一擦，指腹便黑了。告示是上臈刚写的，汐识字慢，逐字念道：“秋考，闻香，蒙眼，三种。”念罢她转脸瞧我：“蒙了眼还要辨香？这跟黑夜里摸着找船有何分别。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_end_1556:event","text"],null]']
src = "blake3:57bb054910b43ab2099ee6ac76ef30616a0d849f447828c7c9a984dc3bb448db"
text = "重回局里时，帘子已然换过。夏时的竹帘收了起来，悬起朽叶色的帘，边缘镶了一道深褐绢边，屋里登时暗下半分，人坐于帘下，面色也似染了一层秋意。上臈将结业考的日程贴在柱上：十一月初，假名、和歌、座次、闻香，逐项查验，但凡有一门没过，这三年便算白费。柱旁悬着值夜的木牌，我离京这阵子，牌上我名下添了四笔墨痕，是代我值夜的人画下的。内中有两道收锋极轻，瞧着像冷泉雪的手笔。我将木牌翻过来瞧了瞧背脊，上头空无一字。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_start_1554:event","text"],null]']
src = "blake3:2c630d91d2430227e39becedb4969a85c7f4662ab6a4666518fbbaf40ec65da3"
text = "局里放了半月假。土佐路遥回不去，我便回了一条本家。到家次日，家司启了书库，说是趁初秋的好日头晒书，一年只此一回，若耽误了，书全得让虫蛀空。廊下铺开一排竹席，侍女们捧着书箱来来往往，连兼定也被叫来帮手，他抱了一摞书跑得飞快，被家司一声喝住。房通大人在屏风后咳了咳，吩咐下来：书页只许翻，不许读，一旦读入神，便忘了给它翻面。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_start_1555:event","text"],null]']
src = "blake3:486b716a7bbd9535d8e6b0a930a9e3d49a78e5fa8226c832653a0909323a4e92"
text = "供物已在堂前摆了三日：一担新米，两匹素绢。今年正逢父亲七回忌，这些东西要送往中村的寺院。往常皆是政所派人，今年母亲却说，叫澪去。动身前，她捻着念珠，逐件再嘱咐一遍：米乃土佐今年头茬早稻，一粒不许漏洒；绢的折痕朝里，见着住持方能翻面。阿濑蹲在门边替老仆系担绳，头也不抬：“沿着河堤走，莫贪省力坐船。前日落过雨，四万十川眼下还浑着。”我蹲下身，把草鞋带子重新勒紧了一道。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_holiday_start_1556:event","text"],null]']
src = "blake3:aa77443314de8f3ef504eb5a57c7f49ae55a24242584583686844061d189482d"
text = "母亲的家书是在放假前三天递到的，篇幅比往岁都要简省：“今年回来，中村的粮账交你管。自己记，自己算，错一文，自己补。”上臈闻知此事，又往我的假中功课里加了一桩：《古今集》中的秋歌，日抄十张，回局时一并呈交。小督借去那封信读了两遍方才还我，道：“你母亲这寥寥数语，可是连半句回辩的空子都不留。”起程这天清晨，我将信叠得小小方方揣进怀中。汐在门口将草鞋带系了又松，直嫌京城的草鞋底薄，踏不惯下田河滩上的石子。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_midterm_1554:event","text"],null]']
src = "blake3:53087a2475175d1abecae2a3cf4815afd2f968d3a0c38276f4d9b76d55911d9b"
text = "局前小庭里的樱花已落了个精光，女孺才把残瓣扫拢成堆，风一卷又给吹散了。上臈早前交代过，花谢之时便是考较之期：礼席座次、敬语称谓，外加《古今集》里的春歌，点着谁的名谁便起身作答。晨起理妆时，小督凑近来探问我春歌背下几首，我摊开掌心比划了个五字，她却替我摁下去两根指头：“上臈专挑不常念的。”正说着，讲读间的拉门开了，菖已然端跪在首位。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_midterm_1555:event","text"],null]']
src = "blake3:aef5f351213a1801991c520affb16d758e33f07e4de5d3a0f084113cf7160a4f"
text = "期中大考考的是弹筝。讲读间正中仅设一面乐筝，众人挨个轮番抚弹，身侧香炉内点着一块香饼，说是为了助弹琴者定神。山科言继大人那日恰巧前来送药，被上臈邀留听曲，只谦逊地坐在末席，双膝间还架着一只药箱，腿脚稍有挪动，箱内药瓶便轻碰出细碎的脆响。前头三人依次奏完，皆称得上端庄中规。临到我上场，我将义甲套牢在指尖，顺势斜睨了眼身旁香炉：只见炉内香灰积得高高冒出尖来，侧面还裂开了一条细缝。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_midterm_1556:event","text"],null]']
src = "blake3:1de41fd6df4673d72a69fbb19c4e2506a8fc806336648f021a31901f2733af8e"
text = "抽考当日，讲读间隅角置着口竹筐，内里齐整码着十余尾干鲷，咸味不住往人鼻孔里钻。此乃远国某大名夫人献与典侍之物，随筐附信一封，礼数周全得过了分。上臈将原信念过一遍，令我等代典侍拟就回信：“对方送鲷，无非图谋一个官位。回信须谢得周到，同时一个字也不能许。”每人一封，写至她点头方罢，过不了关的，那筐鱼便没你的份。我平素极喜烤鲷，墨尚未研匀，口水已咽下两遭。小督早写完头一行，拿袖角掩着，低声嘀咕：“越是要回绝，越要写得让人不忍拿去烧。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_patron_1554:event","text"],null]']
src = "blake3:539af0d505abdf0e11c99ce47f0e0b7123cbe0a7f043c7b9784271034d7094c2"
text = "宝镜寺在佛堂前搭起施饿鬼棚，五色幡从棚檐悬垂下来，棚上排开一列列小碗饭，用以祭奠无人供奉的亡者。天刚亮，见习们便被领入寺中帮工，老女房分派活计：两人盛饭，两人挂幡，其余的人随尼僧念经，念到那一句，就朝棚下撒去一把米。住持是出身皇室的老尼，坐在帘子后头，只看得见一截袈裟边角。小督分派去盛饭，手一抖撒了半碗，她蹲下身一粒一粒捡回碗里，轻声道：“饿鬼不挑。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_patron_1555:event","text"],null]']
src = "blake3:9ecb26bd81edc1bb9ba97318c941b05ccbae48aa4463509e9c5a84634ee7d43d"
text = "日暮时分，局门前排开一溜素烧焙烙，各搁一束麻秆，专等入夜。老女房说，迎火的烟领着亡魂认路，烟一斜，人就拐进别人家了。小督蹲在末尾，拿手掌扇风：“我家先人一辈子没跨过这道宫门，烟不论朝哪儿飘，他们认得出吗？”我念及父亲。我九岁那年他殁在土佐，坟在中村。打中村到这道宫门，须顺四万十川出海，越内海，溯淀川而上，这一缕烟得飘多远？我将自己那束麻秆抽出，截短一寸再插实，盼它冒得直些。火尚未点，我先仰面辨起了风向。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_patron_1556:event","text"],null]']
src = "blake3:90060c063c2a1dffd9696a67f509684bd9d816ab090d93b33771c79e01f08b3f"
text = "局里守着一条旧例：盂兰盆夜里，见习们得替曾在这几间屋里当差、殁在宫里的女房点灯，一人一盏，从廊头直挂到廊尾。今年轮到我们第三年的人操办。老女房从柜底翻出一本旧簿子，纸边让虫蛀成了花边；那些蛀没了的名字，她说自己还记着，便逐个念给我听。最早那几位，是应仁那年的兵火里没逃出去的。总共二十七盏。名字题在灯笼背面，向着里头，说是写给亡者看，不写给活人看的。我托起第一盏，拿袖子拭去上头的灰。到了明年，替她们点灯的，就换作旁人了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_term_start_1554:event","text"],null]']
src = "blake3:79da1246ca81eff5d9401d97a1adf729899da8d9cff302e4c0a981ac1392c644"
text = "上巳节这日正式开讲。因本家尚在丧期，府中未曾陈设人偶，只在门前水渠里放流了几只纸人，任其随波漂去。我换上一身绯袴，跟着领路的女孺步入宫门，长廊木板揩拭得光可鉴人，我脚底一滑险些跌倒，多亏汐在身后拽住了袖角。讲读间内已跪着七八位见习，居于最上首的正是菖，衣袖平整得仿佛刀裁一般。上臈步入屋中却暂不开卷，只道宫中礼数先从双膝学起，一炷香里谁先动，便去廊下领罚。线香才刚燃起，我的脚背便发麻了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_term_start_1555:event","text"],null]']
src = "blake3:d436f2db2b5abf1d0a41a53b9140980bceec6902ccc62d778de0728671cbeaad"
text = "今年的讲读新换了典籍。三条西大人将一卷《伊势物语》摆在案头，言道《源氏》宛如漫漫长川，《伊势》则似断续溪流，一段配一首和歌，述的是某位男子由京城一路游历东国之事。他领读起首段，满屋的女孩便跟着轻声吟诵，诵至“初冠”二字时，菖身侧忽有人抿嘴偷笑一声。窗外梅枝绽开七八点寒蕊，清芳顺着窗隙渗入屋来。三条西大人轻抚长须宣布，今日讲到八桥为止。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_term_start_1556:event","text"],null]']
src = "blake3:ec1bdaf80aa13741082100d2bb4b25cb148698a11b2a3330c34b575be959e44b"
text = "讲读间的窗纸乃昨日新糊，白得刺目，满室浮动着生浆糊的甜气，几个小见习忍俊不住直吸鼻子。天光透过纸面，矮案上的旧墨痕条条毕现，我那方几角还印着一枚黑指印，乃初年秋考时落下的。三条西大人尚未莅临，小督挥扇驱赶一只歇在窗上的小蛾，扇骨不防一捅，新窗纸豁开个洞。她霎时煞白了脸。上臈入内瞥了眼那破洞，命人取过一张红纸，剪成一朵梅贴上去。三条西大人紧随进门，仰首望见那朵梅，轻笑一声，道今岁便自《桥姬》开讲。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_year_close_1554:event","text"],null]']
src = "blake3:b32577ac2ef6c407896107577e3b3b2fc13a7e99297b0ecb3ab3c23d2defe216"
text = "腊月二十，上臈收回这整年的功课簿，一本挨一本码在她文箱旁侧，堆得竟比砚屏还高。收罢簿子，局里的话头立刻转到年节礼数上：三条西大人那边送甚，山科大人那里送甚，典侍身边传话的女房又该送甚。小督扳着手指算账，说她家今年只置办得起一刀纸，尚须对半裁分，一半送先生，一半送先生的先生。汐站在门外跺着脚说，落雪了，堺来的船只怕要停了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_year_close_1555:event","text"],null]']
src = "blake3:89640ca4be991bc33cd58c49d6cc415507b87be63da6abbd945d2a7d7b861722"
text = "上臈传下话来，年前各见习须将整年的歌录成一册呈交，封皮题好年号与名姓。末了又添一句：“今岁改过元，十月往后便是弘治，写岔的领回去重订。”我清点了一番自己的歌：春日最多，盛夏半数写海，入冬仅得三首，另有一首系闻知严岛那仗的夜里所作，此刻也不知压在何处。小督在走廊下支起一张小案替人装订，纸捻穿三眼，订一本取半升米，局内女孩子们排成长溜。我执笔才落纸，先写了个“天”字，旋即醒悟有误，只得另抽一张新纸。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_academy_kyoto_court_year_close_1556:event","text"],null]']
src = "blake3:8ef6235a74705c6748f52c9360a3bb2acaa11522e15ce9c14507cbe58f64132c"
text = "屋檐下垂了一整排冰柱，长的足有一尺，日影一晒，便滴滴答答往石阶上淌水。今年收簿子照旧设在上臈局里，只是三年来头一遭，文箱侧畔的册簿没能堆高过砚屏：有两名见习秋间就辞宫返乡出嫁去了。本家那头正替兼定打点回土佐的行囊，我两头奔忙，袖袋里常揣着一根捆箱的绳索。上臈收到半途，抬眼道：“第三年的，最后交。”小见习们挨次上前，高高擎着簿册，手皆冻得赤红。我怀抱自己那一叠立在队尾，耳听檐冰一根接一根坠落。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_ase_1553:event","text"],null]']
src = "blake3:ea10746f1ae90a0bab7a5920d881aa37f093c99ddc6b3602cd321b29dde5c1d3"
text = "三月十二是阿濑的生辰。下田河口风里尚寒，天未亮她已照例蹲在栈桥上补网，只是梭子穿得比往常慢些。汐悄悄同我说，她娘满四十一了，自己却半个字没露。这几日正赶上退大潮，河口外礁石缝里能摸着拳头大的蝾螺。我和汐相视一眼，飞快把草鞋踢进了船底。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_ase_1554:event","text"],null]']
src = "blake3:2993d2f99486a3b04925e8982ce347729bc5c4a578c576ec3e3a852e1f20549a"
text = "三月十二，京都东山刚透出几星樱花影子。今儿是阿濑生辰，她远在土佐，我困在宫里局中，两人中间隔着纪伊水道和大半条南海路。堺开往土佐的盐船十日后启航，赶不上这趟，就得再等下月。汐蹲在廊下把攒的铜钱清点两遍，仰起脸问我：“姬君，京里有什么我娘用得着的物件？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_ase_1555:event","text"],null]']
src = "blake3:de972d90061669303519264df1bada7f49506e01be9452bf54e389c60a971368"
text = "这回阿濑的信抢先一步到了，三月初托堺的船带过来的。母亲去了中村，替她执笔的是下田老渡守，笔画细弱，字架却大，一行勉强塞下四五个字，字里行间全是阿濑的口吻：“生辰不必挂记。姬君在宫里，膝盖跪惯了不曾？汐的字可有长进？”信封里另夹着一撮晒干的海苔。汐捏着信反复看了几遍，嘴里嘀咕着她娘问遍了旁人，独独只字不提自己。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_ase_1556:event","text"],null]']
src = "blake3:07ea0fac62b8d9a9b7f402a63c82ec923ac1be0f95b5b60873945c9e3344c60d"
text = "三月十二，阿濑整四十四岁了。京中梅花已然凋零，柳条方抽出一抹新绿。堺的船夫带来下田那边的口信：阿濑那把竹网梭裂了口子，她拿麻线紧缠三道凑合着用，一发力便夹手。汐听了这话，垂着头扯起自己袖口：“我娘那只网梭，年头比我岁数还长。”往土佐去的盐船，过六天就要从堺解缆起锚了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_1553:event","text"],null]']
src = "blake3:6d7cd215ca1ba4f6a9015f83efa70641c31923c06753cdfa6512e297f4d912a9"
text = "六月二十一，我整十三岁。梅雨迟迟不肯歇，四万十川暴涨得一片浑黄，河口船只尽数系在木桩上。清早阿濑从渔户手里换得一尾鲷鱼，涂了盐架在炭火上细烤，焦香很快漫遍整间屋子。母亲则在佛前为我多诵了一卷经。远在京都的弟弟也捎了信来，五月末写的，在道上耽搁了二十余日，信封受潮发软，拆开单有一句：姊上，京城的鲷鱼不及家中可口。阿濑一面翻烤着鱼，一面说，十三岁的人了，该学着独自划船出河口啦。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_1554:event","text"],null]']
src = "blake3:53499e910e5f0991b6e0e6b6c193fc6c232c89197d42854b7560704457ed19eb"
text = "六月二十一，京都暑气憋闷得犹如蒸笼，连绵梅雨将局里的纸窗沤得绵软。此番是我头一回在京城过生辰。宫中向来只算正月添岁，无人记挂这日子；唯有汐上心，清早从厨下讨来一条小鲷鱼，悄悄烤熟，拿荷叶裹紧塞入我袖内。日暮时我请假返归一条本家，兼定正守在门首，双手藏在背后，局促半晌方才递出：原来是一张习字，“姊上”二字虽比去年写得宽大，却也比去年扭曲得更甚。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_1555:event","text"],null]']
src = "blake3:e698406da7688e5c925abe39462fc66a9689d562a5dd065ea1a8a74ae0da94e2"
text = "六月二十一，我满十五岁。五日前乃小督生辰，她推辞说寒门不兴过这个，我同汐凑足一升白米强塞过去，她当面便倾回一半，还嘴硬称此乃“预付”。今日轮到我的日子，局内照例无人记起；唯有冷泉家的雪午后递过一张短册，上头誊着我前日歌会败阵那首，墨笔改得密匝匝的，最末附着一行小字：抹去两个字，便成了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_1556:event","text"],null]']
src = "blake3:701b5d91dcc6a524c31c2fc252c8d713574a42d993d72355646dbcb9b8b1659b"
text = "六月二十一，年满十六。清晨管衣物的老女房帮我理发，梳至中途忽然住手，捻起发梢道：“已然十六了，蓄出这般长的头发，也该有人家来议亲了。”她语气欢喜，入我耳中却仿佛在议论一件早该装箱封存的器物。午间汐怀揣着一根鲣节回来，乃她娘托盐船带上的，坚硬得好似木棒，外圈仍缠着下田的草绳。“我娘交代，”汐将它塞入我掌中，“姬君生辰就啃这个，莫吃宫里的糕点。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_mother_1553:event","text"],null]']
src = "blake3:e64d58387803b8f47671c3370813f55eed4d9d9401621311f08ee21c753edc87"
text = "六月十二，母亲三十三岁。自打落发，她便严令家里不许办寿，言明出家之人只记忌日。大清早阿濑便将我推到门前：“姬君自个儿拿主意，可别供出是我唆使的。”母亲在商馆内室对着一叠粮账，指间念珠一颗接一颗地拨过。梅雨时节墨迹干得迟，她将写罢的账纸铺满桌面晾着。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_mother_1554:event","text"],null]']
src = "blake3:4c8076884f3b2d84cb88737b1e9eb5f17c5aa47555b2dba558f044d52d97f14c"
text = "六月十二，母亲生辰，人却在京都。典侍房中晾香，唤了我们几名见习前去辨认，我生平头一遭分出了伽罗与真南蛮，老女房打趣说我这鼻子是土佐海风吹灵醒的。不由想起母亲经箱旁常萦着一缕幽香，当年她领我认的头一味，便是丰后舅舅送来的沉香。去土佐的盐船，四日后便要起锚。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_mother_1555:event","text"],null]']
src = "blake3:7ca5d6f4c36465dc4c865c4c3b7a9801b0f7089fb87a5a31efa6db0ee475cf1e"
text = "这年母亲的信在生辰前便送到了。五月中旬落笔，一共三张信纸，前两页净写中村的米价，末一页方才提及己身：丰后舅舅差人捎来面南蛮小镜，比寻常铜镜亮堂得多，她对着端详了一回，见镜里自己齐肩的短发，随手便倒扣过去，搁进了佛龛背后。信尾问我：京城里的歌会，今年又输了几场。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_birthday_mio_mother_1556:event","text"],null]']
src = "blake3:52287b18b31c4d8aa50cc1c1c62384ad386786e499972e65be48c9fb20f22149"
text = "六月十二，母亲三十六岁。兼定如今十三了，字迹已有模有样，硬要拉着我合写一封家信给母亲：他起上句，我接下句，合成一首歌。他叼着笔杆苦思了半日，落纸竟是：中村的藤花，今年可曾开了。写罢自个儿先羞红了脸，嘟囔这哪像歌，倒像在问账。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_0:event","text"],null]']
src = "blake3:1620d255bc73fdc699ce0aba1dde2135f460c47c12399cf64700aca9e049e0a0"
text = "来京里满一个月了，本家延请了一位老女房，每日上午教我假名和宫中称谓，下午才放我出门。今日她叫我把这一个月学的东西全摊出来过目。我掀开箱子，里头一半是字帖，一半是从下田带来的木札，上头刻着去年记下的潮时与水深。老女房拈起一块木札来回端详，问这是什么符。门外的汐正忍着笑。离开讲还有二十来天，字帖得温习，那一箱木札再不去摸一摸，怕也要忘了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_1:event","text"],null]']
src = "blake3:b62091118da7188dca2cc6869f6a00728a703a61c275a904f483cba9fd3a1d83"
text = "梅雨下了近半月，局里的纸窗返潮，一摁一个坑。上臈令见习们呈上入宫以来的当值簿子。旁人簿里记的都是来客、赏赐同和歌，独我那本翻开，满页皆是数：耗了几张纸、燃了几块香饼、外借几把扇、哪一把尚未还回。上臈越翻眉头越皱，问我这是记账还是记事。一旁的小督伸长脖子瞧，低声道：“这一页，比米店掌柜的账目还要细。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_2:event","text"],null]']
src = "blake3:7d7b940a3440838cb87fc268472ebc08b7b4d8bfc6d595be9bba1c98119498ba"
text = "离秋考尚余半月，须当着上臈抄一页假名，抄的便是自己这一年写的歌。我把开春以来的歌稿铺了一地：写鸭川的、写局前小庭桔梗的、写土佐海面的。挑拣半晌，竟没一首拿得出手。冷泉雪从廊下走过，朝地上扫了一眼，收步用扇尖点着其中一张：“这首写海的，还算不差。”说完径自走了。等我追出去，她早拐过廊角了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_3:event","text"],null]']
src = "blake3:71465f8f0d4f33985c3ec540b4ca6b202e44daa042aa45095d73767cb22d740e"
text = "尚未出正月，局里的炭盆正旺。历道的贺茂家送来了今岁具注历，大月小月标得明白无误。我把潮记摊在膝头一对：去年秋天赶着推的下田潮时，沿用了往年的大小月，果真有三处对不上——我算成三十日的月，新历上只得二十九日，往后的满潮便整整挪后了一天。菖从屏风边绕过，瞥了一眼：“历道家的书，也拿来当歌枕使？”汐在旁磨墨，未吭声，鼻子里轻哼了一下。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_4:event","text"],null]']
src = "blake3:45030c4eeed35f4e4beb6da57aec7257334c4655d6a7c7cb6c452a7719a33d7e"
text = "一入梅，扇铺送来的空白扇面全返了潮，一叠叠摊在廊下阴晾。上臈将半年的扇面账丢给我：室町通的扇铺请我们局里题歌，一面扇子换米二升，写坏了要赔纸钱。账向来由我记，偏生三月那页多出一升米，寻不见来处。菖在帘后嗤道：“区区一升米，也值当翻找半日？”小督抱着一摞空白扇面打廊下过，停步往账页上瞄了一眼。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_5:event","text"],null]']
src = "blake3:20ac276c78eb28f4788c4ec162111ef8a0bf98cbc4d545ed610e0c95974aee66"
text = "重阳才过七八日，菊花上覆的绵早已收了，局内还浮着一股菊花酒的酸气。三条西大人把我那首菊歌发了回来，只在第三句边点了个墨点，余字皆无。暑里回过一趟土佐，来去皆坐船，归局才一月有余，句里还全是水声与舟楫，菊花倒像是顺手插进去的。再过四日便是秋考，蒙眼辨三种香，香还没闻上，我先对着自己这首歌犯了愁。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_6:event","text"],null]']
src = "blake3:62927fcdb5009804fbfb4bb22140b8cf78e92e019409a9e67c4fc47acf0bb9dd"
text = "岁末那几日，局中将旧年的屏风、几帐逐箱捆扎妥当，搬回土藏，好挪出空地陈设正月的。偏我捆的几箱里，次日便有一箱在廊下散了，绳头拖了一地。上臈并未责骂，只吩咐重捆。我蹲在箱畔细瞧那个散掉的结：原是阿濑教的拴船结，绑木箱时少绕了一圈。进京第三个年关，我这双手倒先把海忘了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_calendar_review_7:event","text"],null]']
src = "blake3:bc13515ea70bc6facb0c626e79d73dd397d1fe48c56796d74657a9383522f9a9"
text = "距我满十六岁尚余十日，梅雨绵绵，檐溜串成水线。汐从堺商人手中讨得一张行情单，皱皱巴巴的，米、盐、纸、铁，逐样录着上月的价钱。我将其与去秋抄记的旧单并排摊开：盐涨了，纸跌了，铁差得最多，奈何单上未注明何处的铁。汐蹲在一旁，拿指尖戳着那个“铁”字：“这一桩，须问船头。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_court_duty_failure:event","text"],null]']
src = "blake3:4c9bf459f5fd1b362cb49b312c37731fe704351caae07d8129e98ecc49b56d75"
text = "日影斜过西边，局中老女房将我唤至屏风背后。白日经我办的差使，她逐件摊开摆明：香盒绳结系成了男结，奉与典侍的怀纸折颠倒了一道，禀报之际竟把“おまな”唤作了“鱼”。她并不喝骂，仅拿扇骨在每宗错处轻点一记，点罢言道：“明晨之前，全数重来。”屏风外头隐约传出嗤笑，我耳音辨得出是哪位。我将袖口死死攥入掌心，端跪着一动未动。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_court_duty_success:event","text"],null]']
src = "blake3:84797d2d75fee7e8d0b60d4670c40e56c5c7cb5323dbc8a917faae4a29f77eac"
text = "今儿这一天的差事，竟半桩没被驳回。黄昏收整砚箱之际，老女房从我身后行过，略一驻足，拿扇骨在我递交的那张纸上轻点了一记，一句话没说便径自走了。同局里的见习凑近细看那张纸，端详半晌，瞧不出高明在哪儿。我自个儿门儿清：典侍要用的物件，赶在她开口头里，我早摆妥在她手边了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_00:event","text"],null]']
src = "blake3:72d4a6304fb4420663c6adae8c2c062ee7fbe685a254083651eb706af2fe0648"
text = "刚出正月的一个清早，政所的使者踏着白霜自中村赶到，把一封奉书交到阿濑手里。阿濑看都未看，转手塞给了我：“姬君念。”源康政大人的字写得一丝不苟：本家开春要用的物什——兼定的春衣、两捆幡多的桧板以及三十贯钱——得趁着这一阵西风赶紧装船运往堺。然而下田河口一入冬便浅得厉害，退潮之际沙洲露出灰扑扑的一道脊背，上个月方才有一条运米船搁死在上面，拖了两天方才拽下来。管船的老五郎正发着烧卧在家中，水夫们聚在栈桥上蹲着搓手，谁也不肯吐口几时开船。阿濑抱起胳膊瞧我：“读完了？那姬君说说，几时动身。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_01:event","text"],null]']
src = "blake3:6fd11aaa81cf6bc6d3f8ef2035db91118c10e27250c1ead24567e4e3f81375b7"
text = "刚过年没几日，能岛驶来一艘关船，下船的是个右眉缺了半截的汉子，自称替村上家司账，专程来收取阿濑去年一年在下田代收的帆别钱。阿濑搬出钱箱连同一捆木札，他逐枚清点过后，啪地将算筹掼在席子上：“短了三贯二百文。”阿濑脸色登时沉了下去，双唇紧抿作一线，半句辩解也无。汐缩在门后头扯我的衣袖。我摸透了阿濑的性子，她宁愿自己贴补这笔亏空，绝不肯开口向人求情。我把袖角从汐掌心抽回，走到钱箱前跪坐下来：“这本账，教我瞧瞧。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_02:event","text"],null]']
src = "blake3:dba00d6e5d774483b19d0533421833a9df3b0bd36d0f3fc669bdfd503c40e23b"
text = "刚开春，海水还透着骨头里的寒气，阿濑便摇橹带我出了河口，将船停靠在礁岩旁，一指那片幽黑的深水：“七寻深。底头趴着鲍鱼，摸一只上来。”我接连潜了三趟。头一回下到四寻，两耳似被铁锥狠扎；第二回抵至五寻，胸膛憋闷得发慌，四肢胡乱蹬水窜出了水面；第三回压根没游出礁石边，先灌了一大口咸水。阿濑坐在礁石上安然补网，眼皮也不抬：“水势并不恶，乱的是姬君的心。潜到水下还记挂着数自己离水面多远，能憋住气才叫怪事。”岸边晾网的渔村小儿全都盯着看，不知谁起了声口哨。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_03:event","text"],null]']
src = "blake3:dcf504d539280501f9f24523744e48936a04eaf429921aeba6fce99171f9ade4"
text = "刚入夏，下田河口的竞渡便定在了下月大潮那天。从能岛来的几条船，早早就泊进了河口。栈桥上晒网的孩子们说，船上有个能岛少年，每赢一场就在自家船板上刻一道，而今已刻到第十六道了。我去求阿濑准我也下场，她连网都不曾放下：“一条家的姬君，去跟渔家的小子抢水？”我缠了她三天，她才肯松口：退潮时，从东岸划到河心那块黑石头，再划回来，船不许被冲下去一个船身。“若过得了，我去跟渔家说，给你寻条船坐；若过不了，那天你便在岸上看。”退潮的水推着漂木直往外奔，急得像是有人在拽。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_04:event","text"],null]']
src = "blake3:0415c52a5542caeb66241431c35f1e40b789b3bebdc4232d3528f123717b5597"
text = "盛夏里，京都本家捎来信：兼冬大人任了关白，拜贺、谢礼与宅中用度，样样都要花钱，问土佐这边能否凑出一些；兼定的冬衣也该着手做了。母亲阅罢来信，将念珠缠上腕间，对着粮账静坐了一个下午，拨一粒，记一笔，拨至线结旁空出的那一截时，指头停得最久。今年幡多闹旱，政所连分派的米都不够，母亲名下的那份又减去了三成。到了傍晚，她打开衣箱，捧出一只桐木小匣，里头盛着当年外祖父给她的那段伽罗。“堺的商人后天便到。”她语声极慢，听来仿佛在说旁人的物件。“澪，你替我问问价钱。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_05:event","text"],null]']
src = "blake3:6697349d9be0422617a1dc8e1a991383293383b4d598f4ec5a50c9f9c791eb26"
text = "立冬前后，堺船捎来一封家书抵至下田，乃京都本家的广桥夫人致母亲的。书信中言，本家府邸空阔，兼定年少，身畔正缺自家人照应；若姬君肯允，年内整顿行装便可启程入京，她再托宫中姐妹斡旋，保举姬君入宫做女房的见习。信尾另附一句：且请姬君先赋一首歌、修一封信寄来，宫内须先品评笔墨，方再相看其人。母亲将信通读两遍，转手交予我：“下趟船五日后开拔。”案上是母亲的旧砚，墨条则是阿濑自堺商处讨来的。我铺平纸笺，墨研了复研，起头那一笔却悬在半空迟迟落不下纸。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_06:event","text"],null]']
src = "blake3:17be76efd3f761b7f6c8bcb93c142f50bc4a69d5afc1ee41b7c206f973d59cee"
text = "进本家的次日，天还没透亮，兼定就立在廊下候我，袖里藏着一只手炉，说是拿来给姊上暖手的，他自己鼻尖倒冻得通红。才十一岁的小人儿，迎面先板起脸行礼，行完了方露出笑。隔扇后头，房通大人连咳几声，拿京腔探问土佐的船可曾到，咳得急处，带出一句幡多话。家司跪在帘外回禀：中村运来的年贡米和我的行李同装在一条川船上，现下搁浅在淀川下游的江口。冬日水枯，船底磨着沙洲，船夫怎么也不肯走。离年关只剩个把月，本家欠着米屋与炭屋的账，年前全靠这船米去抵。家司禀完，暗暗瞥了我一眼。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_06:remedy","text"],null]']
src = "blake3:ff7f3ec280a32d8a00138495e442b3417fb54a676a9d54332e75abcd23c8b2f2"
text = "米船终究是到了，我心里却总觉着那七天是笔欠账。甫入腊月，我翻出阿濑在下田递给我的一方木札，上头刻着她叮嘱的几桩功课：每日观水一回、记下水位、打三种绳结，件件不得落下。京城不见海，唯有一条鸭川。我点清袖中的零碎钱，再望向窗外冻得惨白的河滩。汐凑在一旁道：“娘若晓得你进了京连河都不瞧，非得训你不可。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_07:event","text"],null]']
src = "blake3:d395da8c0b5b65eab451140fac93f31c3f700c061896240334af440098402b4e"
text = "入宫做见习才一个多月，我落脚的局里，老女房往我手里塞了个包袱。里头裹着一件旧唐衣，袖口金线已磨秃了。“送到上京土仓典了，换些木炭和灯油。”她压着嗓子叮嘱，“别说是局里的东西。”宫中寒酸，我在土佐就听说过，可真没料到窘迫至典当衣裳。正月尚未出头，局里火盆断炭两天了，典侍们夜间录日记，砚台结冻只得呵口气去化。我抱着包袱出外，汐跟在身后提醒：“铺子里的人瞧出你是宫中出来的，必定死压价钱。”土仓掌柜摸罢唐衣料子，朝我伸出两根手指。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_07:remedy","text"],null]']
src = "blake3:16462c41c64eae2c201a8ea3b0699fb3f2ff448c79aaf0258f39c7835891c1cf"
text = "炭火烧过十天，又将见底。老女房再不打发我出门，差使一并交由他人，我干坐在局里，活像一张未上弦的筝。汐瞧不过眼，重又提起那袭唐衣：“头回没办成，便再跑第二回。”局中众人言语依旧委婉，火盆也依旧冰凉。在下田同堺商讨价，对面皆是年年打交道的熟面孔；上京土仓掌柜与我素不相识，眼底只认得宫中来人好欺压。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_08:event","text"],null]']
src = "blake3:35e8f405608c50ac849884c637dd41381da5b0a43f3058756fbb74121bf3a725"
text = "二月初一那天，兼冬大人辞世了，不过二十六岁。那时发出去的讣告，直拖到将近入梅，回书才一封封从各国捎来：中村的政所，丰后舅舅那边，还有几家大名，连名号我都头一回听说。保子大人将信摊在帘子后头，竟一封也未拆完。她道：“这些全得回。回得不好，外头便要说一条家没人了。”本家还能提笔的，只剩下病中的房通大人。保子大人唤我坐近些，从信堆里抽出一张纸递过来：去年冬日我还在下田，兼冬大人起笔写给我却没写全的那一封。开头问着土佐的潮水：“听说那边的海，一天要涨两回？”往后全是空白。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_08:remedy","text"],null]']
src = "blake3:04805dab61d8f710a67cf56c47e03b42117b6b54dedbea90ac9874e63ca759c5"
text = "回书全都发出了。山科言继大人给房通大人诊完脉，吃茶时顺嘴提起：他在别家见过本家的回书，一板一眼，半首歌也没附，仿佛衙门里的公文。帘后的保子大人一声未吭，等送走了客，方才轻声道：“兼冬生前最怕被人说不懂规矩。”再过十日便是百日忌，供在佛前的短册却仍旧空着。我回了自己屋里，重又将那封问起海潮的残信摊开在眼前。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_09:event","text"],null]']
src = "blake3:9f70e657a55bb7c09e7ccc58bbc5adf4a43abcb6723b0a37372d3addc6016ccd"
text = "十四岁这日入夜，我宿在本家。兼冬大人的百日法事刚做完，廊下依旧悬着素帐。兼定交过那张习字却不肯离去，就坐在我门槛上剥枇杷，剥一颗递我一颗，问：“姊上往后要做什么？”前几天保子大人也问起过，言辞很是婉转：典侍国子大人看重我的笔迹，若肯留在宫内，再过几年便可充任正式的女房。土佐的信亦到了，母亲写了一首歌，道是中村已经插下稻秧；阿濑只托人捎来一句话：下田的那条小早还搁在船台上。兼定等着我开口。我含着一瓣枇杷，凝望着院中那口蓄满雨水的井。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_09:remedy","text"],null]']
src = "blake3:caf08f970bb8ad17d633648b8850ae3f2bd984aa93b0f605b2b2a33a52b0db32"
text = "信还在道上走着。十天功夫里，宫里的人又追问了我两回，我都答不上话。夜深睡不踏实，我将自土佐带来的那册潮记翻了出来——昔日阿濑在旁念诵、我年幼时用假名记下的，何月何日几时涨潮，字迹歪斜如虫爬。翻到末后才发觉空着几页：当年嫌记这个琐碎，半途停了笔。汐在屏风那头翻了个身，嘟囔道：“你空着那几页，海潮可没歇过。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_10:event","text"],null]']
src = "blake3:74632e49c799daa79ba2fc19beefda3f2b666e1bc50254c2d8151efcd336e09d"
text = "除夕飘着细雪。我怀抱一包书前往宝镜寺，打算讨问开春可否在经堂借个坐席读书。主事的老尼并未邀我入内，只将我引至廊下，先取出一本账册摊开：去岁灯油尚赊欠着大山崎的油屋，逢此年关，讨账的早已候在山门外头。“经堂点灯，全仰仗这油。”她语声极缓，“往年借读的，总归要纳一笔志。”我逐页翻过账簿，价码比下田高出一截。转眼望去，山门外果然立着个挑油担的汉子，一面跺脚驱寒，眼神却不住往院里打量。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_10:remedy","text"],null]']
src = "blake3:f8833c8b103b11c5d65870351e51d9f3bdd2918c440999e8420af366ee42027b"
text = "正月初十，经堂寒气逼人，连呵出的白雾都清晰可见。我坐在近门的末席，距灯盏太远，字迹模糊，只得将经卷凑到鼻端细看。老尼打身侧经过，念叨今岁油价又涨，大山崎的油屋初五便已登门。她眼皮未抬，我却晓得那话是冲着我来的。这席位原是房通大人一封信换来的，我既未出过一文，亦无从置喙。入夜归本家，脚下积雪咯吱作响。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_11:event","text"],null]']
src = "blake3:3e852a2f987d782e45963b8aea2c1f8662a24a1f220688e3865bbb8d658d074e"
text = "紫藤吐蕊时节，典侍国子大人的局里设了一场十炷香。香木斫成细粒，一炷接一炷传闻，过后再落笔写下香名。头六炷我全写对了。轮到第七炷，烟气刚入鼻息，我记起母亲经箱内那块伽罗，提笔便题。待到揭晓，执笔的女房念出：罗国。坐于我上首的那位上臈，啪地合拢折扇。我这一组原本领先一炷，偏生输在这一轮上。菖那一组胜了，她抚平袖口，未置一词。国子大人操着女房词打趣了句什么，合座发笑，我仅辨出半截，双颊却霎时发烫。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_11:remedy","text"],null]']
src = "blake3:4de3520d35132bb58702476e37fd5b59df98d74909b38f7355313b429bbd9bbb"
text = "母亲的覆书仍未寄达。香席再度设起，我身处邻局研墨，嗅着帘隙透进来的缕缕余烟，在心底逐炷暗猜，中了几回亦无人知晓。汐蹲在门边望风，压低嗓音道：“菖那屋的人今日又编排您，讲土佐人鼻孔里只辨得出鱼腥。”我搁定墨锭。当年母亲授我闻香便曾叮嘱，品香需敛神静听，急吼吼拿鼻子去抢是抢不着的。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_12:event","text"],null]']
src = "blake3:d1278f3719518a9e3ed694e5484ce6b93c499ab5dda58194fe58a57bc796fbe8"
text = "省亲回到下田不过数日，阿濑便将一只油纸包掷在我膝头：里头是能岛捎来的今岁旗账。何船于能岛纳过帆别钱、领走第几号过所旗，逐行大字录得一清二楚。当天晌午过后，河口驶进一艘堺船，桅尖挑着过所旗，旗面那个“上”字墨迹乌亮如新。船主跃上栈桥，嗓音亮堂地报出旗号：“二月已在能岛交讫，三贯文，分毫不差。”我前后翻检了两遭旗账，二月那几页偏无此船。阿濑坐在一旁织补渔网，手里梭子不停：“姬君，这一笔钱归你收。收错了，能岛那边丢的可是我的颜面。”今夏陶家与毛利家战事闹得正凶，内海旗号随之混乱，真旗假旗掺在一处挂。船主早已催促脚夫卸货了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_12:remedy","text"],null]']
src = "blake3:48bd2630a9214f3b667c80a2cde86065489e2fa5c65f2881f133de333dded696"
text = "十日草绳结绳已毕，绳结首尾相衔，逢到大潮那几日结扣系得尤其硕大。阿濑将草绳平展在栈桥木板上，逐个捏摸校验，指尖停在第七个结处：“这遭你贪睡误了时辰，绳结乃次晨补系的。”我低头不语。近几日河口外沙洲又见迁徙，政所差人来讨一份新测水深图，阿濑顺势将这桩差事推到我身上，随手递来半截木炭与一块刨光木板：“由你绘制。若舍得破费，不妨雇船出港实测；舍不得，今夜替我蹲守河口，细听潮信几时倒转。倘若描错半分，累得商船触沙，背骂名的依然是你。”海风正自河口直灌进来，吹得木板上细屑扑了我满脸。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_13:event","text"],null]']
src = "blake3:276bdbd9376d98d871901565fb3900f1aaf02cf924739155dad53671e4c5e0af"
text = "严岛战事的军报刚传入京都，本家老大人便一病不起。房通大人入夜咳喘不止，整条长廊皆可闻声，白昼隔着屏风议事，亦是言谈数句便得喘息歇气；神思倦怠之际，偶吐出几句幡多乡音，仍唤兼定作“坊”。山科言继大人前来切脉拟方，嘱咐须连服整月，方中药材一帖贵过一帖。管账老侍捧着簿册呈到我跟前，指节颤个不停：本家余粮仅敷吃到腊月，土佐年贡船须待开春方至，京里的药铺早已不肯再赊。兼定伫立廊下紧攥袖角，缄默无言。我已年满十五，在这宅邸之内，算得上顶门立户的大人了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_13:remedy","text"],null]']
src = "blake3:9926b437a9c69f75b48e76cd01e3c4476a3f2d8dfda0d7f95994a24dd05047d5"
text = "母亲的复信尚在途次，病药倒先断供了一日。言继大人风闻此事，拎着药匣亲自登门，一面拣药一面絮叨：“筹钱周转，无人比我更通透。朝廷拮据数十年，我也讨借了数十年。”他那药箱稍一摇晃便叮当作响，满腹皆是小瓷瓶。他声言要指点我一二：明日他须往某家土仓，替御所修筑之事筹款，叫我随行旁听他如何启齿；否则，亦可破费少许买下他那本记录各府借贷底细的旧账抄，抱回去自行参详。言罢他扎紧药纸，末了又问我晚饭吃了不曾。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_14:event","text"],null]']
src = "blake3:f2d9e71aa739fe6baf428f7a9da494879486538759c0e2b57865f196be96b298"
text = "腊月里还剩二十来日，局中的炭便已见了底。国子大人说，御所屋顶破漏了三处，修葺的银钱毫无着落，宫里准备往诸国大名处分送女房奉书，请各家献金，名录里就有丰后的大友家。保子大人隔着帘子，将这番话说得极轻：“大友家是你母亲的娘家。奉书交由国子来写，至于附在卷末的那首歌，若是外甥女亲笔，见字之人心里总归不同。”她歇了口气，又道：“写或不写，由你自己斟酌。”自京都走海路去往府内，少说也要二十来日，信抵府内时，那边多半已过了年。案上摊着一张淡红薄样纸，我磨了三回墨，仍是一个字也没写下。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_14:remedy","text"],null]']
src = "blake3:e93cbae33f1bb3d039af5229e33940ff242348c6725f0c4aa5df1e9bd94b545b"
text = "奉书寄出第十日，中村尚未传回音信，国子大人先唤了我过去。她将一沓往年向诸国讨要献金的旧奉书底稿摊到我眼前，皆出自数位典侍之手。“哪封讨成了钱，哪封落了空，我心里明镜似的。”她以指甲点着纸面，“你瞧得出来么？”局里炭盆将熄，手冻得几乎捏不住笔。她叫我二选其一：要么花钱买一刀好纸，照这几份底稿逐一和一首歌；要么今夜留下，替她将这一沓誊清。话毕，她把暖手炉朝我推了推，自己将双手缩进了袖筒。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_15:event","text"],null]']
src = "blake3:1635f36af2d1bd2bbab406dba0ae3acce304a65ef9baf9aee0bcfac86be6c427"
text = "房通大人将兼定唤到病榻前，足足叙了一下午的话。兼定步出时面色煞白，双眼却不见泪影，一脚踏进我屋里便推拢隔扇：“义父说，今年入冬之前，我必得回中村去。”他十三岁了，嗓子正开始变粗，开口一句便破一句。归返土佐的行李全交我操持：他的书箱、铠柜、一条家的旧文书，还有随侍上京的十来位家臣。打堺开船，穿纪伊水道，绕室户岬，贴着土佐海岸往西走，那是我和汐走过三回的航道。只是这一趟船上坐着土佐一条家的当主，若出了闪失，谁都赔不起。兼定将一张单子推至我跟前，头一行记着“鞠”：“这物也得捎上。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_15:remedy","text"],null]']
src = "blake3:7041b122e9332558bf86d39133e4e8aaa0057161c4ee8f9bd804f90e43969380"
text = "下田那边尚无回信，去信此刻怕才越过室户岬。汐倒先替她娘答了话：“船的事，问船。我娘准是这句。”她言明要么破费搭趟船跟看，要么去埠头替船夫扛货，人家方肯吐口。淀的川船日日顺水放往大坂，船夫们瞧见一名公家的姬君在岸边晃悠，个个绕道躲着。我在栈桥旁蹲守了一上午，望着一艘艘船吃水或深或浅地往下漂，脚底板踩的木板已被日头晒烫。兼定那张清单一径揣在襟怀里，那个“鞠”字已被汗水浸晕了少许。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_16:event","text"],null]']
src = "blake3:74bf3622ea815bbc9079f98d38bf0368df2e22f1fe512f8b3500d5a787856095"
text = "政所的源康政大人总算松了口：开春之后，下田河口那艘旧小早就归我管了。十八名水夫的名册递到手上，一半是阿濑从能岛唤来的老手，一半是幡多的渔家子弟，才头一日，两拨人便为谁来把舵争执起来。钱款也还没着落，政所只肯拨米与盐，水夫的工钱、修船的钉子，还有一路的关钱，统统得我自己设法。母亲指间捻着念珠，将一本空白账册搁在我跟前：“船上的账，打今日起记。”阿濑坐在栈桥上补着网，头也不抬：“姬君，先把人分派妥当。人分派不好，船便出不了河口。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_16:remedy","text"],null]']
src = "blake3:96a4ab0429ada90569e9f56a33a4c0feffea13f9d86fdc0b266b8edef08b5702"
text = "离去的那两人里，一个是渔户的长子，另一个熟稔修船的活计。秋风一日紧似一日，距回京的船期不过半月光景。母亲唤我到经箱前，指间捻着念珠道，那两家前年曾向一条家借过谷种，这份情分还在，该有的礼数亦不可少。阿濑说话则更干脆：“只管上他家门前坐着，坐到他肯出来见你。”两户人家皆在四万十川上游的村落里，往返一趟得耗去大半日。我将自己积攒的铜钱倾在几案上，清点了一遍，又重数一遍，忽觉身后的念珠声止住了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_critical_17:event","text"],null]']
src = "blake3:80ddd892c4dba14ffca0775ca6645376367b0a226e77ab3526c334e9e00bc9e3"
text = "动身离京定在岁末，恰是结业之后。保子大人替我将绯袴折好，收入一只旧衣箱中，言明便留在局里，日后谁入宫便给谁穿。国子大人在《御汤殿上日记》的底稿上先行记了一笔：土佐一条家的姬君近日辞去。三条西公条大人授完末了一回《源氏》，特意留我在席间多坐了片刻，问我抄录了三载的那册讲义可要一并带走。局里按旧例设了场饯行的小歌会，就摆在小庭院旁的廊下，咏的题是“扇”。我自袖中取出桧扇，扇骨上题的那首和歌原是去年七夕写的，墨迹已然发旧。雪坐在对面，膝头的短册仍是一片素白，严寒的天气，她手里的扇子却一下下摇得飞快。汐在廊下替我看守着行囊，隔不多久便探过头来张望一回。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_0:event","text"],null]']
src = "blake3:ef9cd0e380dc67c9fd30de588e5cc5327ce545d3e8a724f693985cc2b0b81832"
text = "二月河口仍冷，阿濑把我和汐唤进网棚底下，抄竹片在地上划出两道。“汐，补网。姬君，刮船底。”说的是那条借来练手的小船，正扣在沙滩上，船底爬满藤壶与海藻。汐急忙揽活说她去刮，阿濑把眼一横：“各干各的。刮利索了，三月潮水好，正好让你自己推下水。”她随手丢下一把磨亮的铁刮子在我脚边，回身缝网去了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_1:event","text"],null]']
src = "blake3:a9486c0b1b6ba989fc7c02592c20c304f4de74cb9606d733731f6554d7ba5c1c"
text = "盛夏时节，往堺去的船接连不断。我跟在阿濑身旁记了整夏的帆别钱，始终没摸透她开价的门道：同是四百石的船，一条收两百文，另一条却只要一百二十。这日散工，我总算在栈桥上截住她问个明白。阿濑正蹲着洗脚，闻言抬眼望我，倒像早候着我这一问。“你先道道，那两船差在何处。”河口蝉声噪得耳朵发疼。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_2:event","text"],null]']
src = "blake3:055c1edd94437e06155b5629f4c4ea21e3bee5cf3d9f5ed9e5522e75d7a1ed09"
text = "三月初，从堺过来的盐船给本家捎了封信，封皮上字大得出格，一看便是阿濑写的。信仅半页，假名一个紧挨一个，写叉了便涂成黑团：“姬君。临行说定，月月写一首歌给我瞧。满一月了，还不见影。汐捎来的口信倒有两遭。宫里事多，我晓得。歌须短些，字须大些，拣我识得的字写，不识得的别用。”信尾画了条小船，船艏高高翘着。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_3:event","text"],null]']
src = "blake3:ea04294f1f8fc86b48dfc6e5c3bdf8588fb287186cfae1bdc480b72daaca6cde"
text = "八月初，阿濑回了信，随信一并捎来一截打了七个死结的麻绳。上月我在信中夸嘴：随本家供物船往石清水去，淀川上两船缆绳纠缠在一块，船工抠了半晌解不开，我教人一刀砍断，船立马过了。阿濑信仅寥寥数行，落墨极重：“断缆是不得已的末着。好麻缆得搓半月，一刀下去，钱便算丢进河里了。解得开的人方有资格砍。这截绳，姬君自己解开，休想动刀。”绳梢上还粘着片鱼鳞。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_4:event","text"],null]']
src = "blake3:714b0a2ab1a3f2d0ba5bac609c1865663b3a286325b5065e3499f2efdd36d1cb"
text = "三月，阿濑寄来的信厚实了不少。去年秋间，有个常往本家送纸的堺商央我写封荐书，说是想到能岛置一面过所旗。我替他写了，他便持信去了下田。阿濑信中道：旗是发了，银钱却只入了一半，原约年底缴清，至今连人影也无。能岛那边追问荐主是谁，她只应：“人是我收的，账由我来垫。”捎信的盐船老大临行偷告予汐，她娘把原先留作冬衣的那匹布卖了。我翻出那份荐书底稿，盯着看了好久。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_5:event","text"],null]']
src = "blake3:9835a5f5358ffc300c5f737dc758ec28225f0a3d0ed507d8ef2ab3a80e539e19"
text = "八月初，盐船带了个小包裹，封皮上写着阿濑的字：“姬君之物，物归姬君。”拆开一瞧，原是只拳大葫芦，腰际缠着褪色麻绳，绳梢还拴着片红布。五岁那年我学凫水，阿濑把它缚在我腰间，我便搂着它在河口浮了一整夏。里头附信说：“汐那只我且收着。这只在网棚梁上挂了十年，连老鼠都不咬。姬君纵回下田也留不了几日，京里终是长居之处，人长大了，物件该自己保管。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ase_6:event","text"],null]']
src = "blake3:0a6751b05ded7b8a4af14c45a6f881de365fd8f274798827fbf347dc0944306e"
text = "三月，阿濑信中破天荒谈起明年正月：“政所已传下话，来年开春，船台上那条小早拨归姬君。”底下那行墨迹透纸背：“得立个约。出得海去，但凡我道潮信不对，姬君便不许开船，一回也不许。若依我，我替你编条束发绳；不依，你自个儿编去。”信背拿炭条勾了河口外几处礁石，一一标明满潮水深几尺。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_0:event","text"],null]']
src = "blake3:7bb519502a780fa1a614e808e0bd88c024845c2f175f3b0bbfd3cf5d32c45de3"
text = "三月，京都本家递来一封信。薄样纸叠作三折，字迹散散落落，高一行低一行，展开时还透着微弱熏香。执笔人是广桥保子，乃本家兼冬大人的夫人，我往常仅在母亲口中听说过她。信上道兼定在本家一切安好，只是夏初要换的单衣尚无着落；本家内外的大小事由她照应，土佐这头可否分担一桩：夏衣衣料，外加几条干鲣，兼定讲念着家里的吃食味了。末尾写着：“如有不便，容后再议，不必强为。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_1:event","text"],null]']
src = "blake3:af035e8c1314d1bd1f4a951e177a69f9b0ca21a680bdb406c3e3df9ea4dbb61f"
text = "八月间，保子大人的复信寄到了。前信里我头一次向她求教，问土佐来的姑娘想进宫学规矩，该打哪儿起头。她却不答这话，只在纸上先列了长长一串名姓：管局的老女房、典侍贴身的人、传话的杂掌，名字底下各坠着一样物事，无非扇子、纸、香。“宫里的门看着是敞着的，”她在信里写，“里头隔着重重门户，哪一扇都得先打点。这几笔账您先盘算盘算，算得过来了，咱们改日再谈后面的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_2:event","text"],null]']
src = "blake3:73780cbb44571c0c85aef687ca326dcd803e5d29517d6782a041dc6849f29ccf"
text = "除夕前一日，本家廊檐下已堆满待送的岁暮节礼。保子大人唤我至帘前，轻声交代：典侍国子大人代为引见一事，去岁信中早已议定，须拿土佐的纸张权作谢仪；纸早打中村运抵京中，一直收在土仓里。“待正月头一个吉日便要送入宫中，迟了，旁人要笑话一条家连声谢都忘了。”她话头微顿，“至于纸张如何裁切、怎样裹扎、面儿上题写什么，倒要请姬君拿个章程。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_3:event","text"],null]']
src = "blake3:7f97fbdfd5b1fb9bacc0b5c3dfcb2dc6745d8747acb1279d864ed17aa4532d53"
text = "兼冬大人故去后的头一个盂兰盆，一条殿中静寂得连檐下风铃声也听得真切。保子大人隔帘同我商议祭供之事。我说，下田人这几日都往河口放水灯船，好送亡魂归去，鸭川既有水流，不如也放一只。帘内静默了好半晌。“京中的体统，是在自家门前燃迎火、送火。”她声音极轻，“若灯船漂到哪片河滩上搁浅，教过路闲人拾去……这般失体面的事，还是免了为妙。”帘后响起一声合扇的轻响，她又补了半句：“只是，姬君倘若真有把握……”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_4:event","text"],null]']
src = "blake3:3e74ab80bee97fdf8aeebf1aef5ad6174b6f58d94ec211a3c69e96741ce86bf3"
text = "入春前，土佐的船误期一月方到，捎来二十连鲣节与数捆幡多楮纸。一条殿米柜早已见底，宫里年礼还赊欠着三处。保子大人把礼单摊于帘边，以扇骨点着三个名姓：“这三处的礼状由我来写，情面我替一条家圆过去。至于货物折换成钱……”她话音微停，“这一半，不知可否交由姬君？若办差了，便是我们两个一同丢脸。”话到“我们两个”，她自个儿先轻笑了一声，仿佛嫌这字眼说得不够雅驯。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_5:event","text"],null]']
src = "blake3:c82dc1d324348f3f0dda9844f49173333f4f9ae1ef084653607c314c32df6e08"
text = "启程回土佐省亲之前，保子大人唤我至一条殿，自帘下推出一只漆匣。匣中搁着数封陈信，笺纸已然泛黄，封皮题着“土佐”二字。“自兼冬大人遗物中检出来的。”她开口道，“信末的花押，姬君应认得罢。”我自是认得，那是父亲的手笔。保子大人未再多言，敛起手中折扇：“这几封信合该送回土佐。我收存了一载有余，迟迟拿不定该不该交予您……今日总算拿定主意了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_hirohashi_yasuko_6:event","text"],null]']
src = "blake3:72b7e913c34d831f2ee92c4091cfd7dba7a69b71e2b9e1c893ef9131f4b28509"
text = "弘治二年的春光里，房通大人的病势久未见起色，一条殿里众人言谈皆不觉放低了嗓音。保子大人探问我结业后的去处。我说，正月里便从下田出海。帘外半晌无人作答，只听得扇骨逐根合拢的轻响。“我嫁来一条家这些载，走过最远的地方，也不过是石清水山脚下罢了。”她道，“您出了海，行哪条航道，泊哪处港湾，能不能先说与我听？我待在这儿，好歹能按着日子遥想一想。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_0:event","text"],null]']
src = "blake3:fdd787ae8c2488bd7685d63e229436b6383ae8e830d58c9b28ab6673ac90a4d7"
text = "兼定从京里寄来的信，二月写的，三月初才送抵下田。纸是上好纸张，字却一个赛一个地斜歪，偏是“姊上”两字写得最大。他说房通大人教他识看奉书，他已明白一条家是怎样派差的，故此也要分派于我：“京里的事，归我。下田的船，归姊上。每月寄一回河口潮信，不准迟。”信尾画着个花押，重描了三遍，浓墨都透过了纸背。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_1:event","text"],null]']
src = "blake3:036ced6ef8681e7636d54971a627b34b6ae3eb7178b0e4b014ba0acc0f40dc3a"
text = "从京里寄来的信走了二十日，八月初才送到下田。兼定头一次写信问我事，开篇先絮叨了半页“我本来不必问”。细看才知，房通大人赏了他一笔零用，让他自个儿去扇铺定做一柄扇子。他把扇定了下来，回去一打听竟比旁家贵出三成，随行的侍从反倒帮着铺主圆话。“姊上收过帆别钱，晓得怎么跟人杀价。教教我，不准告诉母上。”信末这回没画花押，只落了个小小的“定”字。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_2:event","text"],null]']
src = "blake3:e571af5d4086b58070240155b94c3971ab68bb43f2f79064d8d2c14339a07384"
text = "兼定从一条殿送进局里的信，先在老女房案头搁了二十来日。他还记着腊月我动身进京那天应下的事：开春替他的新扇题一首歌。“房通大人说今年殿里的樱要早开，扇子总得赶在花前。姊上的歌呢？”底下又添了一行小字：“不许写鱼。”老女房交信时说道，这手字迹倒显出几分当主的气派。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_3:event","text"],null]']
src = "blake3:b5d4fd47a38ac22866bde438afea68fef725fd3c310f219912a28fa316c6581e"
text = "盂兰盆前，兼定又差人往局里递信。他说今秋要回中村看望母上，已去信叫下田的小早八月底来堺接人，船头要挂一条家的旗，“教堺的人都瞧瞧”。我读到这儿再坐不住了。八月底正是野分频发的时节，阿濑往年一到这月连河口都不许小船放出去。可信末偏写着：“这是当主决定的，姊上只管候船。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_4:event","text"],null]']
src = "blake3:70915ad7ed441912f2c4f3b6c01fc61da9b3f7854315b71582cd4a50c3b465db"
text = "兼定这回的字比以往哪封都端正，一看便知心里发虚。去年腊月我从局里借他一小块伽罗，原说好正月就还。他在一条殿陪几位公家少爷玩闻香，兴头上来竟把整块全烧了。“那块香是局里的，老女房若盘问起来，姊上也有份。”底下又补道：“故而这笔账算我们两个人的。我扛一半，剩下一半姊上自己想法子。”信纸边缘，还留着一圈被手指攥皱的痕。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_5:event","text"],null]']
src = "blake3:e48324392f1942b9cdf54398118b5e5024470d0816fceabb3df48e767d2853fd"
text = "兼定差人给局里送来一个小纸包，拆开看是片边缘磨得发白的蛤壳。我认得它：他六岁上京那年，我在下田海滩上拾过一只蛤，掰成两半，分他一半带着。附信写道：“我如今已是从三位了，文箱里还存着这物件，叫侍从翻到怕要笑话。还给姊上。”另一半壳就收在我的文箱里，拿出来一合，依旧严丝合缝。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_ichijo_kanesada_6:event","text"],null]']
src = "blake3:4861e43606f8af1d15173d1a61cf78e5cdbab766015819ee6ed3a914118de17c"
text = "自房通大人病倒之后，一条殿中便有人私下议起土佐来。兼定的书信正于此时寄至，字迹已不再歪斜，话音却仍是一派当主架势：“我若归中村，不搭堺商之船，单乘姊上的小早。由姊上掌舵。”其下空出一行，字形小了几分：“姊上出了海，日后不论抵何港口，均须先返下田一趟，好教我知晓。说定了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_0:event","text"],null]']
src = "blake3:732dd56620ec998be0ad520b89bd77d6ea6f6ea1c1a5d4c0d68dda12f34dd807"
text = "立春一过，母亲便唤我进下田的屋子，案上正摊着今岁粮账。她手指缓缓捻动念珠，不紧不慢道：中村政所要核账，下田新米需装船，阿濑脱不开身得守着河口，“家中差事，须得重理一遍”。言罢她推过一册薄簿至我手边：“下田至中村这段水路，今后便归你送账。船，可撑得起？”指尖的念珠就此停住，不再拨动。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_1:event","text"],null]']
src = "blake3:c6245b51f8ebd6cbc8b86e0b7437017956c43d95bdc8d6b62d814566df9a1d44"
text = "夏收早稻时节，我头遭向母亲请益账目之事。帆别钱向来记得分明，及至掀开粮账，同一庄户名下，今岁缴米较去年少了三袋，旁注却未记缘由。母亲不忙释疑，先吩咐我将这三年数额并列誊出。誊到半道，她拨弄念珠道：“短缺的谷米，有时叫洪水冲没了，有时叫人私下克扣了。你打算先往何处查寻？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_2:event","text"],null]']
src = "blake3:559eef0f4d2786c7e32b4f30a3b5f578803b57e186e4c057657496c8f8c01d14"
text = "二月从下田寄出的母亲来信，三月头里才送到局里。折得方方正正的信纸上沾着一丝沉香，正和她经箱里熏的一样。信前头只说下田梅花开了，阿濑去河口捞回一筐海苔，接着才谈起正经话：“动身前一晚你应过的，进宫头一回闻着的香，要写信回来说给我听。是什么香，作何气味，又教你想起了什么。我等着。”落款单写了一个“母”字。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_3:event","text"],null]']
src = "blake3:045c3e30708fe2fe432e394e66f2931ea54e81f651365e1adb086b3de8900941"
text = "盂兰盆前，土佐的船将母亲书信带到了本家。上月我曾写信说，幡多的米与其在堺卖得贱，不若装上川船运入京中，京中一斗米价快赶上中村两斗。母亲回信不长，细字一笔一顿：“淀川沿路皆是关卡，三好家的兵也守在河岸。你讲的价，是米铺门前的价，非船抵岸时的价。”信末又添一句：“既想得这般美，便亲去察看一番，回来报我实数。这回且莫寄歌来。”一旁的汐听我念到“且莫寄歌”，不由笑出声。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_4:event","text"],null]']
src = "blake3:0bc107f04f08c4882069414bc9709329a71a9b2e4e8d96c2e4dcb278cec31801"
text = "开春时，母亲信中夹来一页政所的账，誊抄得一笔不苟。源康政大人嫌京中开销过大：我与兼定在本家的米钱、布帛、送礼使费，岁岁增高。母亲在账页边用小字写下打算：中村那边的言语由她来担，政所的脸色由她去瞧；至于京里这头，令我自己起一本账，每逢月底封好捎回，买了何物、缘何支出，一文一文记分明。“你数钱利索，”她批道，“记账可不能只求快。”我忽然想起上月兼定打发人来局里拿走一刀杉原纸，说是拿去习字，钱也是打本家的用度里扣的。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_5:event","text"],null]']
src = "blake3:e4095d43cd85a2e769a41ce34c91054dfac2bdcbc23f107b320257f6e44b1a06"
text = "残暑未退，土佐的船捎来母亲的家书，还附有一只油纸包。拆开是块指节大小的香木，黝黑发亮，外层裹着张褪色的薄样，上头有教房公的手迹：“借本家。”母亲说，这是清点中村御所旧藏时翻检出来的，八十多年前教房公避乱下土佐，自京里本家带走此物，久久未还。“房通大人卧病，你替我送还回去。奉还时说些什么，你自己拿主意。”我将香木递到鼻端一嗅，历经八十年，竟仍余一线幽甜。再过些天，待局里放假，我便要归土佐了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_family_bond_mio_mother_6:event","text"],null]']
src = "blake3:89196da1ffedb4457ca36503c8457a58a64691d83475173af20ceba0523b482b"
text = "三月初，母亲的信递到了，比平日厚实许多。政所已经应允：明年正月，我可以出海。母亲不曾阻拦，只在信中列出三桩事，每行写一件：头一遭出海，先朝东走南海路去堺，勿往南航；每年盆前回中村一趟；船上的账，月月捎来。末后另夹一张薄纸，是她照老船头言语抄下的港名，自浦户、甲浦直抵阿波、纪伊，每个港旁皆空出一格，“潮水几时涨，你自己问去，自己填写”。那三行嘱咐我端详了好多遍，偏是头一行最长。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_bon_1553:event","text"],null]']
src = "blake3:f39720a52b5b281582d343fea027bc17935297a2945f3854711d967ddddc81d2"
text = "盂兰盆到了第三日，下田河口一早便有人在滩上扎精灵船。阿濑盘腿坐在网棚下，用麦秆同竹篾扎一只两尺长的小船，预备在舱里置茄子、瓜并一撮米。右手勒不紧绳，她便换作左手，嘴里叼着绳头。中村那头的风流踊过了渡口，顶着插满纸花的大笠，一面敲钲，一面唱着我听不太清的念佛调。阿濑连眼皮也不抬：“姬君想看踊就去看，莫站在这儿挡我的风。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_bon_1554:event","text"],null]']
src = "blake3:65a4f41d911b7843e383258b2b1d4297a289d48c02c9bf626189151b6fe4b3d8"
text = "盂兰盆这几日，各家公卿陆续向内里进献盆灯笼，廊檐下悬了长长一排，灯纸上绘着秋草与萤火。薄暮时，四条那头的风流踊挤到御所门外，笠上攒的纸花比人还高。我正替局里清点灯笼，汐从外头跑进来，往我手里塞了封信，说是下田的船泊了堺，经了三道转手才送到本家。信上的字大得不像话：“今年精灵船我独个儿扎。姬君那只也一并扎上，放两条鱼干。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_bon_1555:event","text"],null]']
src = "blake3:19c611817590c62ccc545bd26a4ba38493f494e338fccaecaa11c345cae75a54"
text = "阔别一年半回到下田，河口滩上仍旧是那股晒鱼味。盂兰盆末夜要点送火，阿濑照例去捡漂木，拢了一大抱，右肩忽然一沉，木头撒了一地。她骂了句濑户内的土话，蹲下身一根根拾，偏不让我插手。渡口那边，打中村来的年轻人正排练风流踊，听说我刚从京里归来，全围上来打听京都的踊是何模样，笠上插什么花，又唱些什么词。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_bon_1556:event","text"],null]']
src = "blake3:e4cce448070fa94c7b36a2f3075892ecb45a9ba809ce412adcb1770b8f6650e6"
text = "盂兰盆这日，本家的盆灯笼只挂起半数。房通大人病着，宅内连走路都踮轻了脚，风流踊的钲声亦远远绕开了一条殿的门。回土佐的行李我捆了一半，汐蹲在侧边盘算盘缠，数着数着忽地停了手：“娘那包针，去年盆里就只余三根了。补网一根，缝帆一根，还有一根别在领子上，谁都不许碰。”她把钱串塞进行李：“她不会张口要的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_choyo_1553:event","text"],null]']
src = "blake3:fc3c05e6a8eadd091003f798778758a9e6a230ff04e651134079597cface7786"
text = "重阳前一日，京里的来信到了。兼定那手字依旧向右倾，单一个“菊”字便占了小半张纸。他说本家染好了盖菊的绵，他悄悄藏了一片红的夹进信里：“姊上在土佐也给菊花盖上，明早取来拭脸，能长寿。母上那里，请姊上代我折一枝菊，摆在母上经箱旁。”信尾他绘了幅图，京都在上，土佐在下，当中牵出一条歪斜的线，旁注着“姊上的船走这里”。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_choyo_1554:event","text"],null]']
src = "blake3:1dc39a888cac966660a380fb9f5be50da773dc1499538b72394bb590cef785b6"
text = "兼冬大人殁后，本家不设重阳宴，只照例替庭里的菊花覆绵。宫里的讲究是白菊盖黄绵，黄菊盖红绵，红菊盖白绵，花同绵切忌一色。兼定自道既是土佐的当主，这等事毋须使唤下人，抱起一筐染好的绵便下了庭院。待我端灯过去看，他早盖完半畦了：白绵蒙着白菊，黄绵罩着黄菊，一朵朵配得整整齐齐。老女房在廊下干咳了一声。兼定脖子一梗：“土佐便是这般盖法。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_choyo_1555:event","text"],null]']
src = "blake3:bfb4b164f1cebc449cb6d636be08040834a20b7814dedeed3b91e3481958439e"
text = "重阳这日，本家照旧设了菊酒，盏底浮着两三片花瓣。兼定今年刚满十二，偏要效仿大人喝上一盏，刚咽下半口就呛红了脸面。酒散后，他拽着我进了自己屋，地上铺了一张他画的濑户内海图，海岛画得宛如一个个饭团，上头码着蒸栗子。“这一堆属毛利，那一堆属陶。”他捏住一颗栗子，“能岛的船站哪边？阿濑家的人站哪边？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_choyo_1556:event","text"],null]']
src = "blake3:0523a4d7ca95238ada168d3bc60c57fc405ef59d8d8f1acbbff5a3ca12e6ea55"
text = "今岁的菊花，兼定未教任何人插手，白菊覆黄绵，黄菊覆红绵，满畦丝毫不差。九日清晨，他将揭下的绵折成四方一小块，拿怀纸裹妥，言说要亲自捧到养父大人的病榻前。行至走廊转角，他猛地停住步子，回首问我：“姊上，待我返了土佐，往后谁替养父大人盖绵？”屋中忽地传出一阵咳嗽，煎药炉的气味早已压过了菊花清香。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_kajo_1553:event","text"],null]']
src = "blake3:b8c7036e47edfb072ed4ce259dcb89d7d5bdf07f820254ea9ec5abbd848598af"
text = "六月十六，嘉祥。天热得连狗都趴在船底下吐舌喘气。阿濑把这一季收缴的帆别钱倾倒在草席上，将钱串逐根拆开，只拣印着“嘉定”二字的宋钱。“京里的规矩，嘉祥这日用十六枚嘉定钱买十六样点心，吃了保一年不生病。”她眯着眼辨认钱文，挑出一枚，就往我掌心放一枚。凑到第十一枚时，钱堆里翻了个遍也再找不出第二枚。她推开剩下的钱：“尚差五枚，姬君自己想法子罢。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_kajo_1554:event","text"],null]']
src = "blake3:ccb0f2d432142a7ccc455cfadf2d713f9bd5962e729d78b59072e8e3e4af2af8"
text = "嘉祥这日，内里的御厨子所向各局分派点心，盘上覆着芭蕉叶，依着位次自上臈分至见习。待分到我们这一局只剩两盘，馒头还塌了一个。汐递来一只布包，说是下田的船夫顺路带到本家的。包口竟拿网线缝死，里头系着一串钱，我数了一遍：十六枚，枚枚印着“嘉定”。夹附的纸片上一行大字：“攒了一年才凑够。去买甜的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_kajo_1555:event","text"],null]']
src = "blake3:e3a482ea110d09185a9ab4fafedfb2711d48398bf3dcb9540612c643d10bfa33"
text = "今年嘉祥，我已不再是端着盘子跟在后头的那个，老女房把一局的点心全交由我分。分到末了一盘，汐清点后说短了一块，我说自己那份免了便是。下田的信恰巧当日送到，还是那手大字：“今年过河口的船少，嘉定钱一枚也未收着。京里钱多，姬君留神。八月接你的船，我叫能岛的船顺道去堺。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_kajo_1556:event","text"],null]']
src = "blake3:652bbabee973b4b674acb2f2282954a4942229ac9f5a7a108fcbe41b4380f0c8"
text = "今岁轮及我替上臈码放嘉祥的盘次，十六色点心，半点位次也容不得差错。下田来的信压在分发的点心盒下送入局中，字迹却并非阿濑所书——笔道纤细，一瞧便知出自渡守手笔。“阿濑道：嘉定钱今岁收得二十枚，余出四枚，候姬君归来亲手清点。阿濑道：归来莫带甜食。”末尾一行系渡守自行添注：“她手发酸，央我代写。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_moon8_1553:event","text"],null]']
src = "blake3:3033ea8315546b980fd5a6151d50342cafa8df93715cecc3e588ba1f28b6606b"
text = "八月十五这天，母亲让人把廊下的帘子尽数卷起。供台摆着十五枚煮芋头、一束芒草和一盘刚摘的毛豆。诵完一卷经，她也不拨念珠，只望向河口升起的月亮，吟出一首歌的上句，问我下句是什么。我脑中偏只晃着阿濑常说的“月亮圆了，大潮要来”。母亲等了片刻，道：“不急。月亮还悬着一整夜呢。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_moon8_1554:event","text"],null]']
src = "blake3:c99f9bae63e76f68286b9aecc795b84fa4ffbd3abaf8f48e5eb50c7864f1d597"
text = "离十五夜还有三天时，中村捎来了信。母亲写的假名依旧纤细，一行行斜斜垂落，宛若落雨。信中道今年稻禾倒伏了一大片，粮账得重新核算；又提起听丰后来人讲，舅舅的府内来了几名南蛮僧人，每逢日暮便敲钟。信尾附了一首歌的上句，言道同是一轮明月，照着两地的屋檐。这晚内里有月见歌会，我们这些见习只得待在局里，隔着帘子听声。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_moon8_1555:event","text"],null]']
src = "blake3:5959916bcef1366683ce22d171402921432ae8c94aad60bc0a45c78f3486d7ce"
text = "自下田返京不过十来日，母亲的信便紧追着到了，搭的是堺商的快船，比我乘的那艘还要疾些。信笺里包着一星香木，指甲盖大小，色泽宛若旧铜。“这是你舅舅从府内遣人送来的，听闻是从南蛮船上易来的物件。十五夜月下点上少许，嗅嗅像何物，写信告知我。”她半句嘱我保重的话也未写，唯独在信末多添了一行：今年粮账平了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_moon8_1556:event","text"],null]']
src = "blake3:a3389b3ff00cea85dfc914f80939102d29434cc80b1bfa90675f0d91d461f00f"
text = "归返土佐的这一月光景眨眼便近尾声，再过三日又得动身上京。十五夜里，母亲未让人设供台，自个儿捧出一盘芋头，坐于廊下拨弄念珠。拨到半途，她忽地住手，道山口那边今年竟连一封信也未寄来。待月轮升起，她侧首问我，今番可否由我先起上句，她来续下句。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_new_year_1553:event","text"],null]']
src = "blake3:ecf3bcef6b6bc0fd10beca5b3cddeca1a333dd548a5efabc0a8bf533a5afa8cc"
text = "正月初二，天未透亮，阿濑便将我从暖被中拽了出来。河口泊着的渔船皆插上了青松枝，船首各供着一小块镜饼，以祭船灵。她要去自个儿那条小舟上行乘初之仪，令我拎着盛酒竹筒随行。今日中村御所那边亦正喧闹，母亲早已嘱咐午前务须回去书写吉书，听闻冈丰城的少主也要登门贺岁。阿濑往掌心哈了口白气：“动笔迟些不妨事，潮水可不候人。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_new_year_1554:event","text"],null]']
src = "blake3:385be91bef623a1e997fb635b100ce0193e2c528820d81e5d6acfc95b7a5186d"
text = "头一年在京师度正月。本家的门松比中村瘦削不少，供奉的菱葩饼也薄得只有几片，听说内里今岁连节会都无力操持。初三日，汐捧着一只带着鱼腥味的包袱进屋，是下田的船岁前运抵堺的鲣节。箱底压着一张纸，上书阿濑的大字：“年关帆别钱已收齐，网也织补好了。初一清早，代我面向西边拜一拜，能岛就在那一头。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_new_year_1555:event","text"],null]']
src = "blake3:6a33659f0614da67661a6270a5a174c77729f6315df5c0886f16eb6793942f8c"
text = "土佐运来的年货在堺转装川船，直待正月初三方才抵入一条本家。阿濑附寄了一串以稻草绳捆扎的干鲷，随信还有张恳请下田寺僧代笔的便条，起首便道：“姬君，新春的鲷鱼须得亲手炙烤，休要坐等旁人伺候。”本家今岁的镜饼比去岁又缩水一圈，灶下唯余两位老妪，房通大人咳嗽了整冬，年节膳食却得均分给二十余人。书院那厢，家司已然摊开笺纸，正候着兼定与我落笔撰写今岁的吉书。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_new_year_1556:event","text"],null]']
src = "blake3:f646b034c69ab9ccf953d3a351d9d17461c36ac3d5aea06c98d92fe50affd521"
text = "弘治二年正月飘起了雪。土佐船只误了半月船期，直待初七方到，阿濑随船寄来两双新裁的足袋，一双大一双小——她仍当我还高出汐半个头去，殊不知今岁我俩早已一般高矮。灶下须烹七草粥，怎奈一冬米价飞涨，本家囊中羞涩无力上市采买菜蔬，家司搓着手试探问道，谁愿去鸭川沿岸雪地里寻挖水芹与荠菜。书院彼端，致近卫家、广桥家的岁礼尚待题署名目，整摞裹纸正堆叠案头。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tanabata_1553:event","text"],null]']
src = "blake3:5a92aa666c8dc05fd39cb9defa1ccb3907d28d1fb4f487e3412494adb496a537"
text = "七夕前两日，京都的家书送抵中村。十岁的兼定笔迹尚歪斜，满纸皆是本家乞巧奠的景象：星之座前陈设着琴与五色丝线，他获准坐于最末一席，梶叶上的歌是家司代为开的头。末尾一行字写得顶大：“姊上在土佐也拜星么？土佐的星辰可比京都多？”母亲命人在御所檐下置了一只盥，蓄满水，专等夜深映照星斗。阿濑坐于廊下补网，口里念着今晚潮水大，牵牛织女相隔的那条河怕也要跟着涨水。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tanabata_1554:event","text"],null]']
src = "blake3:645f1a2e3eaf66614cd75b53ee5d3eee0b97399919f37999e02c3b8b204e51f3"
text = "今岁本家正为兼冬大人守丧，乞巧奠既不设琴，亦不作乐，星之座上唯独供一盥清水、五色丝线并七片梶叶。房通大人咳嗽了一整个夏，卧榻难起，便命兼定带着六岁的内基前去拜星。兼定初担此任，宿前将要诵的歌熟背了二十遍，翌晨起身却仍忘却第三句，藏在廊柱背后迟迟不肯露面。家司在庭院里不住踱步，侍女们候着安放盥器，水却尚未汲来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tanabata_1555:event","text"],null]']
src = "blake3:4ed293cd1489d9f6444b0a5e006998219a22e1c952e82f14b14856049040941c"
text = "今岁兼定那份梶叶全出自己手。七枚叶片排开于星之座前，他寸步不离地守着，不许旁人触碰，单等我从宫中归来头一个过目。歌里竟有六个字对不上，“天の川”的“川”字更是歪歪斜斜划成三道线，他自己也心里有数，耳根泛红，嘴里却仍硬气：“只要牵牛星识得便罢了。”再过几日我便要乘船返土佐探亲，他挑出顶大的一片另行包妥，嘱我捎呈母亲。局里催我回转的使者，已来过两遭。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tanabata_1556:event","text"],null]']
src = "blake3:1a47ee1cc4dd3f4b73fc276798ca0f99b1928b89926eb2629439376b18ad5b0a"
text = "兼定今岁十三，身高已齐我眉梢，声音也渐趋沙哑。房通大人整夏未曾下榻，本家乞巧奠便由兼定主持，他坐于内基身前，身上袍服系房通大人早年旧衣改裁，衣袖尚长出好一截。拜星毕，他未似往岁般捧歌来与我看，只坐于廊下凝望那盥水。过了半晌方出声：“姊上，闻说腊月间，你便要从下田出海。”侍女们正撤收供品，五色线须分送各房。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tango_1553:event","text"],null]']
src = "blake3:cdfbbb325644c568ad235468e2088279fdd334fd2b312beae03f428f26f25fe7"
text = "端午前一日，母亲遣人自四万十川畔割来两捆菖蒲，堆置御所长廊下，登时满室弥漫着青涩草气。她欲亲手扎一只药玉悬于立柱：拿艾叶衬底，菖蒲裹住香料，下垂五色长缕。历年这营生皆归阿濑打理，偏巧阿濑一早便赶去了河口；而政所那厢又差人来催讨今月的粮账。母亲捻动着念珠，睇了睇菖蒲，又瞥一眼账匣，缓声道：“两桩都须今日办妥。”此时河滩之上，村里男童早已分作两阵，相互掷起石子来了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tango_1554:event","text"],null]']
src = "blake3:8a04d5316b9d40c31f9a3f5ef0c3842c4c84902654f5412a09523238fc882522"
text = "入京以来的头一遭端午，土佐船只捎来了母亲寄来的包袱：一枚小巧药玉，里头的菖蒲已然干枯泛黄，五色丝线却犹自鲜艳；随附一封家书，字里行间一如她开口般舒缓，垂询京里菖蒲几何一束，本家屋檐可有人葺，末尾叮嘱若室町香肆新到沉香，记取价钱。本家屋檐如今空荡荡的，管事言及今年正值服丧，加之手头拮据，菖蒲便省了不葺。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tango_1555:event","text"],null]']
src = "blake3:7b81a49488ac1dd56e096471be74b96553828ce274c45bb9b6a9f54ba4986c89"
text = "今岁母亲的包袱抵达甚早，端午尚有三日便送抵本家：一束采自四万十川畔的菖蒲根，洗刷得清清爽爽，顶长的一根竟长过我的手臂。信中道，闻听京里的姬君们逢端午爱比试根长，土佐水深，草根亦随之修长；若欲携去比试，须先行丈量一番，省得它在京里受委屈。局里的女孩们果然相约初五比根，菖说她家的根是从近江的池子里求来的。本家这头，管事却唤我去厨下帮着烧菖蒲汤。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_festival_festival_jp_tango_1556:event","text"],null]']
src = "blake3:623866626c66b58ef218ac827f48b941c349160e426c274a2c2f729e596e0614"
text = "才满十六岁生辰，次日便是端午。母亲捎来一只香囊，以菖蒲根研末调入丁子，据言乃舅舅从府内转赠的南蛮物件，十六岁的女儿家合该佩上一个。家书后半段嘱咐：兼定今岁已十三，倘若想去鸭川河原瞧印地，你务必替我拦住他。书信送达之日适逢初五，河原方向已喧声沸天，兼定正蹲在门首系着草鞋。偏生向晚我还须入宫，值我代典侍录写当日的御汤殿上日记。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_first_lose:event","text"],null]']
src = "blake3:c2b1816c4d86e9f00dc124bc9b21ffda12ddb7c2c37b589325d14d6b7d9c4f72"
text = "阿濑命我踏进河口外可没顶的深水处踩水，右手高举一页题了歌的怀纸，半滴水不准沾。汐蹲踞礁石之上替我报数。刚数到六十，双腿便渐觉沉重；数至九十，水波已淹及下颔，我心下一慌，双手登时胡乱扑水。怀纸坠入水里，墨迹刹那晕散，一首歌只余一团灰影。阿濑将我提上礁石，拾起那页湿纸端详道：“姬君这首歌，竟比姬君的腿还沉呢。”语罢她将湿纸平贴在石面上晾晒，转头唤汐继续她自己的数。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_first_sail:event","text"],null]']
src = "blake3:022ac60fe723a3624ec5e6b28484a42a21a06b120a9bfb967c2992c30c9b64eb"
text = "阿濑将小船推离沙滩，自己却留在没膝的浅水里没上船，只把橹柄塞进我手心：“到那根挂破斗笠的竹竿边，绕一圈回来。”竹竿立在沙洲外，看着不算远。我连摇了十几下，船头只顾原地打转，滩上拾贝的渔家孩子全笑开了。后来我学着她把腰往下一沉，橹在水里一推一扳，船身方才走直。正绕竹竿时，一阵海风横压过来，船猛地一倾，我两手死死攥紧橹柄。挨回岸边，阿濑只吐出一句：“回得来就行。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_first_scold:event","text"],null]']
src = "blake3:f3bd583405e5f67a0165a87de4fb4d6fdc07339767917f44b8d963bd82795897"
text = "有条伊予来的盐船驶进河口，船主蓄着花白胡须，阿濑说他跑下田已整整二十年。那日阿濑在网棚里补渔网，打发我独自前去收取。我立在小船船头，拿腔拿调学着京里来客的口气报出能岛旗号，末了又加一句：“速速缴来。”那老头怔了怔，反手把钱袋塞回怀中，掉转船头便撑出河口，钱既不付，旗也不领。等阿濑赶到栈桥上，那船风帆已缩成远点。她当着一众晒网人的面数落我：“旗是拿去卖的，并非赏赐人的！二十年的老主顾，叫姬君一嗓子吼没了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_first_stranger:event","text"],null]']
src = "blake3:723825adec62f2a1f6bf215ac908f1c63398f8ad73fa9456a96253a4bfa5e3e2"
text = "这还是我头一回写信给素不相识的人。收信的是堺的一家干鲣批发铺，名号是从往来船人口中听来的，只听说门前挂着蓝暖帘。信上问明三件事：土佐干鲣到堺是什么行情，哪个月份最好脱手，新晒的收不收。写毕却不敢糊封，另誊了一遍，特意把“土佐一条家”几字收小了写，免得人家错当成来讨钱的。转托给去堺的盐船时，船老大拿手掂了掂：“这么薄一张，问得出什么名堂？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_first_wage:event","text"],null]']
src = "blake3:a6f7845d84db8b0c82d4fbd51a745ab2bfc6f2113d30aaf8ee57009d2f8ecfe2"
text = "一昼下来收完七条船，阿濑在栈桥上把钱分作几落：一份归能岛，一份给划船的老水夫，一份呈交政所。末了她打自己那落里抽出十二文，拿草绳穿牢，搁到我面前的船板上：“你的。”我怔在当地，问她一条家的人也领工钱不成？她只道：“既上了船，便是船上的人。不稀罕，退我。”我忙不迭将钱捂严实。这串铜钱比预想的沉甸，一路行回家去，把腰带都坠得往下沉。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_home_start:letter_lin_wandeng","text"],null]']
src = "blake3:ca4da0934726561bc5dbcbacc17f95ccbaded141cec23e4379bfda3546c56651"
text = "汐把那张我写废的信稿翻了出来，问月港究竟在何处。去秋有条福船进河口避了三天风，船上一个福建少年过来缴帆别钱，铜钱是我点的。他看我手指利落，咧嘴笑起来，说他在月港天妃宫的表妹提着灯算灯油，比我还要快。照他讲，那表妹腰间总挂一盏小红灯笼，走到哪儿亮到哪儿；笑起来甜，扯起谎来嘴更甜，码头上谁家的船什么时候靠岸、装了什么货，她张口就来；偏偏怕鬼怕到骨子里，又硬要缠着人讲鬼故事。我听着不服气，连夜写了一封信烦他捎带过去，顺便打听五岛来船的动静，结尾添上一句：要比数钱，尽管来比。那船驶离快三个月了，回信却不见半点影儿。汐说唐土那般大，信八成是落进海里了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_0:event","text"],null]']
src = "blake3:86c84c8e6eced62cfd39b3321f3360e734a5474329c1e4a8670376231313a312"
text = "四月初头，有条打丰后驶来的盐船停靠下田，船头打怀里摸出只油纸包，说是从平户那头转过三道手捎来的。封面上几个汉字又大又歪：“土佐下田，收帆别钱的小姬君”。阿濑一瞧便笑出声：“必是去秋那条福船。”彼时那船在河口躲了三日风浪，船上有名福建少年，自称表妹在月港天妃宫提灯，我于是托他带信过去，打听五岛来船的行踪。其时那船缴付帆别钱，正是我替阿濑清点的铜钱。拆开回信满纸白话，连“已经”二字都误写成了“以经”。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_10:event","text"],null]']
src = "blake3:49314c0703bfb3341a85b0bab57dec7f1515a29d7e95d96403dd8d6e4cc86777"
text = "这还是我过了十六岁后收到的头一封信。京都盛夏酷热，廊下木板直烫脚底，房通大人的病体时好时坏，本家灶房整日煎着汤药。信是汐打堺船那头取回的，我照例先寻那个墨点，落于第三行末梢，比平日浅淡些。如今晚灯的笔迹已如社学先生般端整，满纸寻不出半个白字，我反倒生出几分怀念从前那个“以经”来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_11:event","text"],null]']
src = "blake3:b446240e7aa0e5e46898b9a1f9604f76691f2d9fd5dcc5308c57266caa70b03d"
text = "结业考已经过了，局里的人忙着卸屏风、点数衣箱，我的行囊也捆了一半。这封信送来时连封口都省了，只拿一根灯笼上解下的红线缠了三圈。投进本家的是一位面生的堺地商人，据说是平户某位船头央他捎来的，托人者执意不留姓氏。我凑到灯下寻了良久，总算在末行瞧见那点墨迹，点得格外沉重。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_1:event","text"],null]']
src = "blake3:fe8636f4c63c12e719ae7f3bb34235f5ec0f2c307bba6336e97d30d31a3d1eae"
text = "七月将尽，蝉声噪得整个河口仿佛发烫，自唐土寄来的第二封信总算到了。今番是搭府内商船过海，由舅舅府上的人顺道捎至宿毛，再转小船递来下田。拆信便觉纸面熏染着一股醇厚香火气息，母亲凑近轻嗅，辨出原是沉香碎末。信笺间还夹着一张描红仿纸，上头将“灯”字反复摹了二十遍，一笔比一笔见端方，最末那个字旁还添了盏歪斜的小灯笼。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_2:event","text"],null]']
src = "blake3:25f7c284c8e5753357608cf51b9a9b062df1dd41e4d6a12ea70fe6c8257f6020"
text = "转眼冬至将近，下田河口两岸的芦苇早枯作一片焦黄。这封信在路上辗转最久，封套上钤了三枚各异的墨印：一处是平户商行，一处是府内寺院，末后一枚我认得，正是宿毛的船宿。拆信展阅，头一行便写明我的信何日送达、附搭何船、船头何姓。母亲望着那串地名感叹：“这女孩儿比政所里的书记还要周详。”我案头还压着广桥夫人的书信，年前便要动身上京了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_3:event","text"],null]']
src = "blake3:8d6d648fe68b9f8b27ab521c25b54005e06ff8f61be2c7966cffa9815cd54210"
text = "京都的樱花开到七分，我在一条本家的廊下拆开信。这封信先寄到下田，阿濑托了堺的船头捎来，外面包着的油纸上是那船头的花押，里头才露出晚灯的笔迹。兼定打书房里跑出来，偏要瞧瞧唐土的字生得什么模样。他盯着纸面看了半晌，手指点着“束脩”二字问这算什么钱。我也答不上来，只好糊弄他说，那是给先生的饭钱。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_4:event","text"],null]']
src = "blake3:d8f12b322107f28b9d6ad2cde3c80f7bb8b5049e98aef1580f689833445cab60"
text = "嘉祥一过，京都暑气逼人，连枝头的蝉都嘶鸣得软绵绵的。这封信塞在堺商人孝敬本家的盆礼中，伴着一包干鲣节一道送来。信纸用的是社学里描红的粗纸，翻过来还有先生以朱笔点下的红圈。她的笔迹比去年周正许多，错字仅余一个，她自个儿画叉改了。我避到檐廊尽头的月见台上展信，汐侍立在旁替我摇扇生风。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_5:event","text"],null]']
src = "blake3:ae87c1a737ef2f147d076db40023c9594046a96ace385e0d26a82402c87a195a"
text = "京都降了今岁头一场霜，局前小院的枫叶铺了满地。这封来信的封口沾了一圈泛白的盐霜，拆开封皮，里头滑落一枚小巧的贝壳，壳背上用墨汁点着记号。信中交代，这贝壳产自五岛，墨点是她亲手做的记，今后但凡见了这记号才算她的亲笔，旁人假托的一概作罢。汐捏起贝壳凑近灯火端详片刻：“这是外海出的货色，濑户内可拾不着。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_6:event","text"],null]']
src = "blake3:9e1eb63b78e2f445bb7882d1c4d98803c7bc9841a597eacc37d0061f5d4ce9c1"
text = "今年开讲方才月余，课上读的是《伊势》，局里大伙开口闭口尽是“昔，男……”。这封信送到时，信封里还裹着一小包糖渍果脯，早已压瘪黏作一团，一角还生了层白毛。汐捻起来嗅了嗅，直叹可惜。我拣出未坏的那半块掰进嘴里含着，酸中泛甜，直沁入喉头。她的信拉得极长，正面写满不算，翻过去还在接续。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_7:event","text"],null]']
src = "blake3:a0889ae93af9b8d3fe32ee2d698224683b7d8b8e0c1df4fffa871d9b37853d65"
text = "距离七夕尚有五日，局中众人皆在苦练书法。乞巧奠的规矩是要将和歌题在梶叶上供奉星前，偏那叶片光滑，墨汁稍不留神便聚作一颗滚珠。汐自堺船伙计手中接过这封信，封口旁照例点着那个墨记。拆开一瞧是社学用的竹纸，正反两面写得密不透风，收尾处却七扭八歪缀了两个假名，正是我的闺名。末一字的弯钩写反了方向，看着恰似一尾掉头往回游的小鱼。我攥着信笺端详了半晌，连梶叶上刚写下的那一笔墨也早干透了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_8:event","text"],null]']
src = "blake3:705a89ead4565a0325cb2caf5258b9ed0868a3e7fb1a0d322b39d00fa8d24e65"
text = "到了闰十月，京里早晚皆须抱紧火盆取暖。此信自伏见的船宿辗转送来，封皮上一行挨一行写满了经手人：月港的船、五岛的酒铺、平户、博多、堺。信封内夹着半截撕碎的纸条，撕口参差不齐，只存半行字迹：“回执。澪四月的信，七月……”余下那半截不知流落何方。我凑在灯下端详良久，猛然想起母亲曾说起的勘合：大明颁发的船票一劈为二，唯有严丝合缝对得上，方准许进港。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_letter_9:event","text"],null]']
src = "blake3:85318c06c11802338dfc321b7290371cbfa5ec1784f2842a0dffb2f78cd6bb76"
text = "二月中，宝镜寺的白梅已然落尽，樱花却尚未吐蕊，京里只刮着料峭寒风。这遭寄来的信厚实不少，里头折着一页细账，晚灯的字迹一列列竖直排开：代写家书十七封，每封三文；替天妃宫誊录灯簿一本，得米一斗；末了一行墨迹尤新，显是后添上去的：“今年的船，清明后看风。”我独坐廊下凝视良久，房通大人房里正又熬起汤药，苦涩的药气一阵接一阵漫过来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_0:event","text"],null]']
src = "blake3:f9a602018d404fa408461b8c099cad78ff885cee870737deca40fe788c65d693"
text = "上巳节刚过，庭中桃花犹自盛放，保子大人身着素服坐在廊下，望人将昨日的纸人偶收归匣中。兼冬大人故去才月余，她开口比昔日愈发轻柔了。那天她召我到近前，道是丰后来的人述了一桩南蛮奇事：极西有座国度名唤英格兰，年少国君病死，王位落到了他姐姐手里。“女子登了大位，”她略一停顿，“据说有人心生不服，动过兵戈，并未成事。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_10:event","text"],null]']
src = "blake3:806460204238e7b5e9f12e95fb0463a1c88852a72e3b735ea9b36465154645ab"
text = "腊月初八，局中砚台积了一层薄冰，非得先呵气融化方好研墨。出身贺茂家的命妇贞子大人前来分送新年历本，落座烤手之际，闲话起丰后传来的趣闻：南蛮有位医者，将往后数百年光景撰作四句一首的诗偈，连篇累牍印成书册，市井争相购阅。“句中既不记年，亦不署月，”她以指甲轻叩手中历书，“若叫咱们贺茂家这般修历，早该逐出禁中去了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_11:event","text"],null]']
src = "blake3:b2ef55b6c963c3e97a7588b7e5b4d5b6091eccad704107a27bfab951737b24db"
text = "腊月中，丰后的使者押送年礼进京，奉与本家两桶府内的砂糖、一匹南蛮红呢。来人是舅舅跟前当差的，照面先赞了句“姬君长高了”，随后酌着酒谈起远事：南蛮人在极西的大陆兴兵交战，一处名唤智利的地方，当地人擒获了他们的总督，传闻竟将熔化的金子灌进他口中，问他可曾够了。屏风后头保子大人咳了一声，那使者方才换了话头。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_12:event","text"],null]']
src = "blake3:57550e6f19f42de93269a695adac4d8d35a823643c9b53df149f7afc7dfa5e6a"
text = "十月下旬，汐随本家仆从去伏见的船宿收炭，归来时鼻尖早冻得绯红。她绘声绘色说起，码头上遇着个搭堺船上来的唐人船工，蹲在炭包上同人闲聊：佛郎机人已与广东的海道官说妥，只要照数交税，便获准在广东海湾泊船做买卖。“禁了那许多年，竟就这般开了道口子。”汐把那人的腔调学得分毫不差，“那唐人话毕就笑，笑得活像咬了一口生柿子。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_1:event","text"],null]']
src = "blake3:4d24105b65b39797306ac7b63faf01b51581c587df6fc39a6cca9ef6a52583aa"
text = "三月下旬，藤花垂挂到了局前的屋檐下。母亲自下田捎来信札，前半幅叙的是田庄事务：今岁春雨丰沛，政所减免了两处庄户的租子。后半幅转述了舅舅从府内传来的消息：英格兰女王嫁给了西班牙国主的儿子。母亲落笔写道：“新郎比新妇年少十一岁。听说婚书上白纸黑字写明，他不得带英格兰人去打仗，也不得把英格兰的王位带走。”这一行，她写得格外工整。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_2:event","text"],null]']
src = "blake3:bfeb26d9a08f4fe94ac3a0f25a710d4e63cf321c352083db0d32ff51a241c3cd"
text = "九月眼看要尽，兼定打前院一路小跑进来，袴脚溅满泥星，说是堺的纸商来给本家送过冬用的纸，捎了桩远处的消息：极西之处有座叫非斯的城，土耳其人助一个失位的老王打了回去，入城那日杀了不少人。兼定说得眉眼飞扬，光“非斯”二字就读出三种音来。我问城在何方，他抬手朝西墙一指：“那头，很远很远。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_3:event","text"],null]']
src = "blake3:e41128e708923e1961f30fc50d4faf92cec7be2679193933b92042e5d6412134"
text = "正月二十，三条西公条大人在本家讲《源氏》，正说到《须磨》里那阵暴风雨，落雷打在廊檐上，光源氏在梦中为海龙王所召。老人家停下讲头，说起前些日子听大内家的人讲：天竺以西的海面，土耳其船队同葡萄牙人厮杀了一场，船折去一半，残存的又让暴风一路吹抵天竺岸边。“光源氏撞上风雨，自有神佛的深意。”公条大人捻着胡须，“至于那些人撞上风浪，倒不知是谁的意思。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_4:event","text"],null]']
src = "blake3:6c06225932b5fa802d4f78d791eccad7b87167639263413ea0bb29753d83cc34"
text = "七月中近了盂兰盆，下田河口左近人家都在门首捆扎迎魂火的松明。打土佐清水来的盐船进了河口，掌船的是加久见家的老船头，面皮晒得如同一块熏黑的鲣节。他立在栈桥上一面卸盐一面高声传话：唐土浙江一带打得不可开交，五峰船主手下上了岸，官兵四下焚船，连平户的商船都空着货舱逃回来了。阿濑原蹲在边上补网，耳听“烧船”二字，手中竹梭猛地一顿。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_5:event","text"],null]']
src = "blake3:900f414d53632fd90b232a874976c28ab596eab140eb4f74da47f276d8411962"
text = "闰十月末梢，汐捧着一纸家书走进屋，指节直打颤。信是阿濑托付河口代笔先生代写的，字迹虽出先生之手，口吻却活脱脱是阿濑本人，简短得如同她平日训人：十月初一，陶大人于严岛遭毛利突袭，人已没了。能岛战船未曾出港。来岛船只助了毛利。末句写道：“山口那头，姬君的舅舅往后艰难了。”汐诵毕，将信笺折作极小一团，死死攥进掌心。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_6:event","text"],null]']
src = "blake3:9dac24204a19b4dd9cd45657ae02cd84f01824fe5d28df7943621b0562af45d1"
text = "端午当日，局里廊檐下满悬菖蒲，众女房正拿菖蒲叶编结药玉。大炊御门家的菖手捧一张抄录的纸片，当众慢条斯理地念出声：据丰后南蛮人传言，西边诸侯在名唤奥格斯堡的城池订立盟约，各自领地内奉行何种教派，全凭领主作主。念罢，她叠妥纸张，睨向我：“澪大人的舅舅那一带，南蛮僧侣正多得紧呢。”语毕执扇遮口，满屋随即响起几声附和轻笑。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_7:event","text"],null]']
src = "blake3:4192e3cbcd8c69ea7a4ed646b37d582ff22e02d1245c79c101534c5edeb51ad8"
text = "六月初旬，暑气闷得人透不过气，山科言继大人登门为房通大人切脉，兼之辞行：待到秋凉，他得往骏河今川家走一遭，替朝廷讨些银钱。诊毕脉象，他在长廊摇扇说起丰后传来的事：南蛮顶大的皇帝，在一个叫布鲁塞尔的去处，当着满堂众人把大位让给亲儿，自个儿则进山里寺院清修。“生前让位，还办得起让位大典。”言继大人慨叹一句，“咱们禁中，怕是想让也拿不出这笔开销。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_8:event","text"],null]']
src = "blake3:6fea692768ca2830a2291013d58144432facadf474e7f0389fc9f822160a1516"
text = "抵京都尚不足一月，母亲的头封家书便搭着年货船送到。前半幅尽是琐碎叮咛：兼定的袴须放长一寸，入夜切莫任他苦读至三更。后半幅话锋忽转，提及丰后消息：据舅舅那头南蛮人讲，极西有岛国名曰英格兰，遣了三艘船北上，企图绕越冰封海域前往契丹，扬帆至今已逾半年，杳无音耗。末了母亲另附一语：封冻之海中的船，不知该凭何物辨认潮汐。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_news_9:event","text"],null]']
src = "blake3:cfdbeda93f08a3ac56d56d04e943528e2e2dab40c2498cb9a5f1c575729a0678"
text = "三月初旬，樱花已过盛期，宝镜寺老尼自相国寺法会归来，谈及诸禅僧都在议论唐土巨祸：去岁腊月，陕西一夜之间突发地动，山岳崩颓，河道壅塞，城垣倾作瓦砾土堆，亡者不可胜数，更有言高达八十万众。老尼口中述说，指间念珠捻动如飞。恰此时经堂外一阵风过，将残樱吹落门槛之内，我等竟无一人起身扫除。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_omen_0:event","text"],null]']
src = "blake3:7cee998fe6f6a139b4ee798cda274a1050ad749d7017cbd5021b21e798fd226b"
text = "入九月换了风向，阿濑总算松口让我去足摺。她向渔户借来小船，硬等了三天晴，天未亮便自下田河口摇桨出去。碰上阴天她绝不沾桨，我也从不问为什么。金刚福寺的老僧听说一条家的姬君来看海，领我进了库房，自经柜底下抽出一轴从那智辗转抄来的图记。纸上画着条小船，船身叫木板封死，独在船侧开出一道窄缝，桅上单挂一面帆，写满细密经文。“那智出过这样的船，本寺也出过。”老僧拿指甲点点那道缝，“进舱的人，全凭这儿递一碗水。”阿濑却只在库门外站着，一步也不肯跨进来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_omen_1:event","text"],null]']
src = "blake3:6ed9f6a653cfe17a55a8c575698e1bd4d19c5f8b2bf00bfe5224d7e3d7d27046"
text = "盂兰盆一过，本家厨下便来了个若狭的行商，挑着两担盐鲭，从小滨翻山赶了一昼夜进京。汐和他讲价，他一面点钱一面讲起小滨的旧事：往昔有个渔家闺女吃了人鱼的肉，自此不老，落了发，活到八百岁，如今仍在诸国走动。“上个月在朽木山道上有人撞见了，”他压低嗓音，“满头白发，脸庞却像十五六的姑娘，问路只问海在哪边。”汐笑他故事编得动听。他猛拍扁担起誓，说是他表兄亲眼见的。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_0:event","text"],null]']
src = "blake3:bf5e89b21aca15510d9cf06b9cef98961017dad97ce9bf65ed56c934ecd44b8f"
text = "二月里的河口寒气刺骨，冻得人手指直发僵。阿濑蹲在栈桥上翻捡她那口盛渔具的旧箱，摸出本麻绳扎紧的账册，纸页早已泛黄脆硬。册中另夹着一纸单折的页子：上头录着能岛征收帆别钱的流水账，船名、钱目齐全，每行尽头还缀着小符号，瞅着既似月牙，又像弯钩。“我爹当年记下的，”阿濑开口道，“那时我岁数还没你大。”说着她便想把那张纸插回册里，我伸手按住了她。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_1:event","text"],null]']
src = "blake3:621ff4c80694034d515793de37072670c3ce94b2298c11c2a78e7af4eb2774ad"
text = "五月连日落雨，四万十川发了水，将一根木桩冲上屋后河滩。渔人抬进院里，指着桩头烙印，说许是哪家的物什。母亲立在书房廊下瞧了半晌：“原是澪标。”本是替行船指路的桩子，反倒被水冲上了岸。问及渡守，他连连推说不是；上游两处村落也一口咬定不相干——谁若认下，便得掏钱重新栽回水里。那木桩就这么搁在廊下晾着，淌得满地泥水。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_2:event","text"],null]']
src = "blake3:c4b406fddd40a2491912217451d2b70a113a9c9005cf98e52de9a5c76fc23947"
text = "八月风紧，阿濑说野分怕是要起，喊我同她攀上屋顶压石块。我抱了石头爬到脊上，揭开一块晃动的木板，却见背面刻着花纹：七粒点连作一柄长勺，旁侧攒着一簇细密小点，刻槽里早嵌满了黑灰。那是北斗，还有昴星。不知何年的木匠蹲在屋顶，仰面照着天星刻下了这一片。阿濑扫了一眼：“行船的人认星，可不会刻到木板上头。”说着便催我赶紧将石头压实。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_3:event","text"],null]']
src = "blake3:86c7dbe6fb2281698119595a695b9006643b42a2384628157128d409614f274e"
text = "清晨鸟羽的船津便塞满了沿淀川北上的船只。我替局里来领堺捎来的纸张，恰在栈桥旁碰上鞠千代。他怀抱一卷鹿皮，正瞅着商贾称货。秤盘另一端压的竟是黄铜铸就的砝码，圆敦敦的，面上还浇铸着几个汉字。鞠千代压低嗓音道：“那、那个，比咱们的沉。”商贾闻言一笑，说是唐船带下的物件，打平户一路转手流到了堺。鞠千代顿时涨红了脸，往我背后缩了半步。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_4:event","text"],null]']
src = "blake3:271b2269943a3e6cd45643dea3c8ca9e95247b33c6a5303ee570ba5a25ef648d"
text = "宝镜寺经藏延请了一位经师修补蛀损的经卷，修裁下来的纸屑积了满满一竹筐。我去归还书册时，撞见小督正蹲在筐旁逐张拣选，挑出来的齐齐叠在膝头：有杉原，有鸟之子，甚至夹着一细条撒金箔的纸。经师的学徒说这筐须得担去纸屋重漉新纸；小督舍不得撒手，那徒弟张口便要三十文。小督抬眼瞥见我，压低声气道：“权当你没见着我。——可你若拿手砍价，便算见着了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_5:event","text"],null]']
src = "blake3:2348bac93916776a44c0f9155d0c0bf41d2fe9e8c5eee5f7af375f6f9cfdc214"
text = "八月连日放晴，广桥保子大人命人将文库藏书搬去晒台，逐册敞开晒蠹。满台皆是兼冬大人的旧藏。她跪在草席边缓缓翻拣书页，翻至一卷《古今集》时，指尖忽地凝住。天头地脚密密写满小楷，皆是兼冬大人的亲笔批注：哪首的字句当作何读法，哪首不合他心意，便划上一道细墨线。翻到末后数页，笔迹愈见浅淡颤抖。保子大人一言未发，只将那卷书轻轻移去了荫凉处。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_6:event","text"],null]']
src = "blake3:45226da7afa6960d7bfb8cbf76a2e427eacfcefe50c2213ae9a47c668cdefe51"
text = "典侍国子大人赴石清水八幡代参，带着我和两名女孺随行。船打鸟羽下淀川，冬日水浅，行至半途便搁在了浅滩上。船夫下水推船，泥里露着半截黑木头，原是一条沉船的船底，立桅用的方槽内塞着一缕头发和两枚铜钱。那东西我认得，是船灵，阿濑教过的。典侍举起扇子掩住了脸：“晦气物事，莫瞧。”船夫喊起号子，船这才一寸一寸往深处挪去。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_7:event","text"],null]']
src = "blake3:d6798451e6e259b101575712326deee27a055e45b0bdcc791f6d3a5949339ced"
text = "三条西公条大人的书房里，《源氏》刚讲到半截，外头来了名越后的青苧商，伏在廊下死活不肯起身。那人诉苦说渡琵琶湖时船缝渗了水，今年这批青苧泡坏了三成，眼看梅雨一落，余下的也保不住要发霉，恳请大人宽限今年的苧公事。公条大人拧着眉，拿折扇轻敲膝头：“此类事务，自去寻家里管事的。”偏巧管事的不在。商人又叩下头去。公条大人把目光转向我们，而我坐得离他最近。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_8:event","text"],null]']
src = "blake3:bdb10853e244e95d0fc777c8a0525f271bcbdd5fedfa1d49b12d519b4b31ddb5"
text = "山科言继大人在屋顶晒着药草，喊我上去搭手翻一翻。桔梗根、葛根还有紫苏铺了满屋顶，药味漫了整个院子。翻至檐角，席底下压着一只旧矢立，铜墨壶磕扁了一处，笔杆磨得发亮。言继大人拿起来吹落灰尘：“这是阿弥的。早年随我下地方讨钱，走过七八个国，后来死在了路上。”他笑了一笑，“日记里我替他记过一行，歌却一首也没写过。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rare_9:event","text"],null]']
src = "blake3:40ad68e20881cc5d2ae3431e5d1180512f9dd8b48267da2cd90f167f8f059df2"
text = "典侍国子大人托堺的商贾捎购了唐墨，货船本定今日泊进淀的船津，她放心不下旁人，便带着我一道候船。不料船误了时辰，天色沉黑了仍不见影。岸边众人突然纷纷仰首：夜空悬着颗怪星，身后曳着条白尾，看着比前几宿又伸长几分。船夫们议论那是扫帚星，现身好些天了，听堺来的人讲，此星一出海潮便乱了章法。典侍立在河畔望了许久，道是今夜的御汤殿上日记，少不得多添一笔。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase:n0","text"],null]']
src = "blake3:d49ecc463fef2071ca6a22983cb41bbdb0140892d073bb7ad04bb0e534965fc1"
text = "野分过去之后，网棚塌了一根梁，阿濑打发我爬上去拽下压顶的旧网。网底下埋着件物件，拿三层油纸裹着，既长且沉。我解开最外一层，露出截黑漆的柄，比寻常薙刀短了半截，柄尾缠的麻绳被手汗渍作褐色。刚揭第二层将见刀身，眼底还没瞧清，梯脚下头已立着阿濑：“放回去。”她说话声量不高，河口的风恰巧停了一瞬，叫我听了个一清二楚。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase:n1","text"],null]']
src = "blake3:ae13b13f4f7d7a00b53ae16afd9b81c89633bead6987016d0f06db19fcf83e5b"
text = "过了立冬，能岛那个右眉缺了半截的管账再度登门，来收今年的帆别钱。这回账目分文不差，他心里畅快，坐于栈桥上饮着阿濑烫热的酒，饮过两杯端起第三杯时，朝我招手：“姬君，你乳母那只肩膀，打探过没有？”我应说问过，她闭口不谈。他嘿嘿一声笑，压低了嗓门说：天文头几年，大内家的船驶来伊予海面，村上家一条小早陷在礁石群里，船上带着个十来岁的孩子，阿濑使刀替他挡了一记。“刀口架住了，铁钩没挡住，钩子是从背后过来的。”他仰面干了残酒，“那孩子如今就在能岛管着船坞。”我心头一动，想起母亲曾言，舅舅去年赴了山口，做了大内家的家主。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase_cane:n0","text"],null]']
src = "blake3:a3431de22c4892dc604ba23b40b561a84d81d8dfa5dae39805e9522c41181427"
text = "八月，自堺来的干鲍贩子再次压低阿德婆婆的价钱，压得比往年更狠。婆婆忍下没争，千鸟抿着唇，把干鲍一条接一条递过去。是夜，我悄摸上栈桥，一刀割断了他那船的缆绳。天明时商船横搁沙洲上，舱内灌了半舱水，堺商在河滩跺着脚大骂，咬住要一条家作赔。阿濑唤我们几个孩子到网棚下，手中攥着支撑船用的细竹，追问是谁干的。我还没来得及开口，汐先跪了下去：“我割的。”阿濑打量了汐一眼，目光又落到我袖口的麻屑上。她什么也未问，竹子劈落下来，一记接一记，全抽在汐的脊背上。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase_kyoto:n2","text"],null]']
src = "blake3:743591df2eac9f881fc8bff584b4fa2cf9cb5d90062358d3a0807b8caa9add87"
text = "盂兰盆一过，汐接到了她娘的家书，托河口那位代笔先生所写。汐读完把信纸塞到我手上，自去外头汲水，去了好大工夫还不见回。信中言明：能岛番所的老账房死了，村上家差人下到下田，要阿濑归岛填他的空缺，岛上认字、能算数且镇得住过路船主的人，如今所剩寥寥。“他们说我是村上的人，奶喂足了，总该回去了。”信到末了，代笔先生下笔也变得小心翼翼：“我还没应声。姬君身在京里，替我想上一想。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase_kyoto:n3","text"],null]']
src = "blake3:c9f2b4b32a61d50b70dd9e2573a3588d6b6733e39b809c444b3a0f73bb8e1921"
text = "入梅前后，能岛捎来了今年的旗账，阿濑照旧转寄一份到京中给我，说是免得我把数目忘了。我翻开最后一页。旧年那里总有“下田·濑”一行，记着她代收的帆别钱该拆几成；今年那一行没了踪影，空落落的，好似给人拿刀片刮过一般。汐探身瞧了一眼，脸色立刻沉下。阿濑的信里半分未提这茬，光唠叨今年河口的鲣鱼多，家家晒鲣节的门槛前头招满苍蝇。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_ase_oar:n0","text"],null]']
src = "blake3:a85986dece4cfee72270810b9f3785c568b10c5fcbbb0c99ee126d1b82275ed0"
text = "入了冬，阿濑寄来书信，这遭是她亲手落笔的，字个儿大，彼此挤挨着：“船台上泊的那条小早，我让船匠在舵板底下挖了个槽。梁上那件东西，已经放进去了。船上用得上的东西，就该呆在船上。”底下空出一行：“我的右手撑不动篙了。开春姬君出河口，我在栈桥上瞧着。撑不动篙的人，看得最分明。”信背画了幅下田的河口，栈桥尽头点了个点，旁注一个“我”。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_chidori:n0","text"],null]']
src = "blake3:b7af2410d762b602420fa5d97a79171ff255185d5f7000e3b804f6fc7fd6524d"
text = "十月里，海女们采完当年最末一茬鲍。阿德婆婆坐在小屋门首剖鲍，刀一下一下刮擦着贝壳。千鸟蹲在旁侧帮她穿串，我帮着千鸟递绳。婆婆闲聊起老辈的旧事：很早从前，西边海上打过一场大仗，落败那家中有个老尼，怀抱八岁的小天子往海里纵身一跃，跳前哄劝那孩子，说浪底下另有一座京城，胜过上头那座。千鸟手上停住了：“在几寻？”婆婆未答，刀刮得愈发响亮。千鸟重又问了一遍。婆婆才道：“小孩子打听这作甚。”千鸟便不作声了，垂头继续串鲍，一连串歪了两个。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_chidori_choice:n0","text"],null]']
src = "blake3:6e5f35406b5b1968eda93b5a4684519d7c1e70877f455a341653a3e237601bb1"
text = "入秋深了，千鸟的信递了过来，竟是她亲笔写的。替她带信的堺船船家在末尾附了一行字，说这姑娘逐字讨教写法，足足问了一整宿。信中提及，她爹托人自堺传话，在船坞给她议了一门亲，相手是个木匠，催她开春过去。“我不去。”她写道，“婆婆眼盲了，口哨传了给我，我留在河口。”末后另起一行：“你的船归来时，锚地的底，我先下去摸。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_chidori_dive:n0","text"],null]']
src = "blake3:d5dedf1643ffb7a55750ca0eeede08ec44f924d1c4a9b699b72fca2b741565e5"
text = "返抵下田的第三日，千鸟在栈桥堵住了我，手里提着两把剖鲍刀：“回来了便比一回。谁输了谁剖十个。”较之我离开那会儿，她晒得愈发黑了，肩头宽得像个后生，门牙那处缺角还在。我们划船驶向礁石外侧那片发黑的深水，阿德婆婆的木桶漂在水面。千鸟领头下潜，我随在后头。四寻，五寻，及至六寻，她又一次停住，一如那年，悬停在那里俯视下方。深处躺着一块白石头，距离不过一寻之外。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_chidori_eight:n0","text"],null]']
src = "blake3:dab93b710e90ccd80c71a0a9edcc24597ac352d733744ebf9397c9dde54953a9"
text = "待我重返下田，千鸟早候在栈桥上了。她颈间那根绳上多悬了一物：一枚白石头，正与她寄给我的那块成对。她不提较量，只道：“领你去瞧。”我俩摇橹去了足摺那头的一处海湾，那儿的海水幽黑发蓝，阿德婆婆向来严禁人靠近。千鸟往腰际系牢绳索，将另一端交到我手：“你守在七寻处。我往底下探一眼便回。”未容我应声，她已翻过船舷扎入水中。我紧随其后潜到七寻，她却仍在下沉，那腰绳正一圈接一圈从我掌心溜走。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_chidori_stone:n0","text"],null]']
src = "blake3:9d040dde61191447416d2680aad8c6bc7027f86f9c77e876ec21f7fdf3cdf5e2"
text = "岁末年关，千鸟的信随年货船进京，辗转过两次手方送入局中。拆开封口，先滚落一枚石子，拇指大小，白得润泽发亮，棱角早被磨平。这封信写得比过往任何一封都长，字迹依旧粗大，一个假名足占一节指头：言说今冬海水澄澈，她独个儿下了水，过六寻，又深一寻，终于触到了水底。“七寻底下的石子是白的，像你所说京里的白砂那般白。”末一行字写得极细：“底下尚有东西。我瞧见了，还要再往深处去。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_fire:n0","text"],null]']
src = "blake3:59c6cd19f5cb8192699d5800baa79ab28b6c76a1013589f9cd6b3d018c2ce1fc"
text = "同局见习中有个叫小弁的，比我年少一岁，家父是替宫中管灯油的地下官人，住处在上京北边，紧挤在两座寺院当间。这整整一冬，她都在忙着做一只洲浜：取桐木作台，以胡粉拌碎贝铺作沙滩，再把纸剪的松树逐株插牢，松枝间悬着她自家写的歌，一首配一张小短册。她打小没见过海。每回当值罢，总要来问我：土佐的沙滩是何色泽，落潮后石头上长着些什么，浪头扑上来又是何声响。她言七夕时要将它敬奉到乞巧奠的星之座前。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_fire:n1","text"],null]']
src = "blake3:da0e681f0d0920464775df607526341ec0f7f8ee62ee4573407b2f45c01b5926"
text = "那阵雨绵延至第三日傍晚。因小弁父亲抱恙，局里准她返家两日，她将那洲浜一并抱了回去，说是要在家里栽完末后几株松。我与汐去给她送药，抵至门前天色已墨黑。夜半时分，北面突响起钲声，街巷有人惊呼：丹波下来的兵马在寺后纵火，三好家的人自下京追赶过来了。烈焰自寺内窜起，先卷着屋檐，乘着风势往东南铺展，恍若一把猛然展开的扇。雨犹自下着，雨滴砸入火舌，滋地一响便销声匿迹，丝毫压它不住。浓烟团团翻涌，四下里东一股、西一股地蹿腾。小弁光着双脚伫立巷中，怀中空无一物。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_fire:n2","text"],null]']
src = "blake3:e45f2a5877f1e5583b3cbcf3d893768879b5b8409fea6f479ce7a1ae9c1cb40c"
text = "小弁此后再未返局。及至岁末年关，她托人捎来一信一小包。信里言明，家中已烧了个精光，父亲的病也不见起色，开春便要打发她投奔丹波的亲眷，跟一名乡野地头过活。“那座洲浜，原是要敬献给星辰瞻仰的。星辰兴许瞧见了罢，那一宿燃得那般通明。”小包之内裹着半片焦黑桐木，原是台子的一角，其上尚沾着些许胡粉，灰扑扑地发白，状若细沙。信末她落笔道：“这块残木，且劳你替我抛进大海罢。你有海。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_fire_tanabata:n0","text"],null]']
src = "blake3:1d0f8913d2546057c2c51bb4a931082dbf093f919ec985835166957ff4008d27"
text = "距七夕尚有些时日，上臈领着两名女房逐局查验欲供奉于星之座前的祭物：书于梶叶之歌、五色丝线、琴笛乐器，以及各府献来的时花。小弁手捧洲浜出来，置于廊下。上臈端详半晌，持扇在洲浜边缘轻点了点：“地下出身的人家，倒也做起洲浜来了。”她虽未言不准，却教人移至最末一席，紧挨着堆放杂物的橱柜。小弁伏跪在地纹丝未动，直待众人走远，方才伸手将一株被扇骨碰斜的纸松扶正。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada:n0","text"],null]']
src = "blake3:0f5cba65ec14666190a0ed9b57bee05ed723923235408642c8bc055846158ec1"
text = "进了夏，堺船带回一封京中来信，并非兼定亲笔，出自随他上京的老侍弥平次之手。他认字不多，央人代写的，通篇皆是请罪之言：殿下在一条殿庭院里攀松树，从两丈高的树枝跌落，左手腕折断了，正骨时未曾哭，接好后竟还要爬。“小人跟了殿下四年，没见殿下哭过一回。”母亲读到这里，放下信纸，拨动几颗念珠：“他走的那年，这孩子也未曾哭。”过了片刻又道：“这孩子心里是空的，往里头填什么都装得进去。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada_gosho:n0","text"],null]']
src = "blake3:e2e5f52a98f09f23eb7cc82dd36bfa42f1467edeaad765d83ea77160b731dae6"
text = "秋末，中村寄来了兼定就任御所以后的头一封来信，用的是政所的奉书纸，起首循例写了大段套话，写到第二页方显出他本来的口吻：他每日清早都往四万十川的渡口去，看弥平次撑船。弥平次的竹篙一下一下点在沙洲上，“诚如姊上所言，沙洲果真是往东挪移的。”信末他写道：家臣们都说他坐在父上坐过的位子上，颇像父上。“父上究竟是什么模样，我记不得了。姊上可还记得？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada_kyoto:n1","text"],null]']
src = "blake3:a22bcf64c56cb13f485b6d9aa71c024665429604f27cb20b9f28611e3a7d512c"
text = "入秋，房通大人病着去不得奈良，便遣兼定代往春日社献供。保子大人准了我三日假，嘱我同行照看。献完供物，神官领我们在春日野里漫步，鹿群成片卧在草间，见了人也不惊起。兼定落在后头，向弥平次讨了他背上的半弓。待我回头望去，箭已离弦。一头幼鹿侧倒在芒草丛中，腿还在踢蹬。兼定走上前蹲下，端详了半晌，像在看一件新到手的物件：“它的血，同人的一样红。”引路的神官脸色白得跟纸一般。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada_kyoto:n2","text"],null]']
src = "blake3:400f3c97853169e565dce590a1bbf773cd4d343c7705d3b301b81cbb508dea06"
text = "兼冬大人的周年法事办罢，一条殿里的素帐也撤了。过了几日，兼定遣人往局里送来一张纸，既无抬头，亦无落款，正面只端正写着一行字：“人死了去哪儿？”纸背另有略小的一行：“兄长去了哪儿。父上去了哪儿。那头鹿去了哪儿。”传话的小侍从禀道，殿下候着姊上的回音，今夜不睡。我捏着这张纸在局里坐了一下午，有老女房打旁走过，瞥了一眼，说小孩子家都问这些。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada_kyoto:n3","text"],null]']
src = "blake3:0d62175f4b58a23739e644d84a7f3294fa6f47dfd434cd698f47a330927d7ab6"
text = "夏末，中村遣来接当主回乡的人进了京，领头的是政所一名年轻诸大夫，后头跟着十余名家臣。末一个进门的是弥平次。他显见着老了一大截，背驼了，腰间不佩刀，拄着一根拿撑船竹篙改就的手杖。行至庭前，他随众人一道跪下，向廊上的兼定叩头，叩得同旁人一般深、一般久。再抬起脸，他咧嘴一笑，缺了两颗门牙：“殿下长高了。”兼定立在廊上未动。过了片刻，我看见他的眼泪滚落下来，一滴接着一滴，砸在廊板上。他自己抬手去摸，神情倒像摸到了旁人的物件。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_kanesada_sugoroku:n0","text"],null]']
src = "blake3:5d100ae3a8f24d576672801f846daa177e90fb6c33e7b2c74ea4536b869e3b22"
text = "梅雨时节，一条殿里闷湿得快生了霉，兼定派人请我回本家下双六。他投骰子素来不看点数，掷罢便推给我，叫我替他走棋。我连赢三盘，赢至末了一盘，他的棋子竟连一枚也未进门。我原候着他掀棋盘——换作我，早就掀了。他未摔，反倒浅笑了一下，将棋子一枚接一枚拾回匣中：“姊上赢了。”口气跟说今日落雨一般。一旁侍奉的小侍从悄悄瞄了他一眼，随即又垂下头去。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary:n0","text"],null]']
src = "blake3:9d0ca537c128b417dc6a1e37890584a7ce24389329fdd6c7aed869d868622f5c"
text = "梅雨刚落下来的头一宿，檐头的水声把我搅醒了。我起身去寻水喝，见持佛堂的纸门里透着灯光。母亲跪在阿弥陀像前念佛，念一声才拨一颗，慢得很。我在门外随着数，数到一百零七，她的手便停住了，停了半晌才重头拨起。次日她往仓里翻米，念珠就留在经箱上。我取起来再数了一遭：大珠两颗，小珠一百零七。线结旁空着一小截，那一段线叫手指捻得发亮。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary:n1","text"],null]']
src = "blake3:9d19f3101939679421af616d4d3a4c88c30f88f2ec012e4f1f5ee5005231cade"
text = "过了秋收，一位时众游行僧顺四万十川往下走，在下田渡口敲起钲，往过路人手里发念佛札。那木札一指宽、薄薄一片，印着六个字，不论你信与不信、身上洁净与否，伸手便递过来。打鱼人家排起长队去领，领完往怀里一揣，回去继续补网。母亲也去讨了一张。她接住札，却不曾挪步，站在僧人面前问：“人走的那阵心里乱着，一声也未曾念出，这札可还算数？”僧人敲响一下钲：“札既已经给了。”母亲重问了一遍。僧人又敲一声。排在后头的人纷纷低声嘀咕起来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary_box:n0","text"],null]']
src = "blake3:ca0f96bf3d2870d82588798bed48e19ee145f1d51f0405e38fa3d6ce1aa51d97"
text = "回京还不满一月，土佐来的船捎了一只油纸包，沉得远胜家信。拆开瞧，里面是只旧砚箱，黑漆磨褪处显出木纹，箱盖嵌着一枝螺钿藤花，少了两片叶子。母亲写的信只占两行：这是你父亲的砚箱；明年出海，带着。我揭起箱盖。里头的砚台是干的，笔架上搭着一支笔，笔头早磨秃了。砚池角落卡着颗木珠子，被指腹摩挲得透亮，大小正与母亲念珠上的一般。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary_box:n1","text"],null]']
src = "blake3:2aefc939c1ec41d4ca28bf47a8888bb49a8ca6a5e7a78711580316c4299387ba"
text = "第二封家信到得比船期还快，是母亲托一条急着赶回堺的鲣船带来的。信上的话更简短：“那只砚箱，你还是寄回来吧。出海的人，船上东西越少越好。”字迹显得极急，末了那个“好”字，女字旁刚写到一半，墨水往旁拖出一道细尾。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary_kyoto:n2","text"],null]']
src = "blake3:fc2ea3464ebfab2d5ea8d4c143862acb2e42433558c42af6f82384b5537854b5"
text = "九月底，母亲的信夹在中村的粮账里，一并递进了局中。账册是政所的书记抄录的，母亲在页边以小字逐笔加批：哪座庄子缓租，哪条船只改期。批至末一页，字骤然大了些，墨也重了，仿佛换过了一支笔：“近日夜里念佛，念着念着，仿佛听得见他在隔壁翻书页。我停住去听。听罢，那一声佛号便念不下去了。”这行字旁落了一道，并未涂掉，单只这一道，像是本想划去，到底没舍得。再往下，便续写今年的新米何时装船。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary_kyoto:n3","text"],null]']
src = "blake3:780f7eb016b36af3c867d4ef19dfe778330ed9148b16bb375ea8e9ab958929e2"
text = "未入夏时，母亲寄来的信比平日长些。丰后的舅舅差人来中村送年礼，来人谈起府内的事：城里有南蛮僧人讲经，有个受过洗的老渔夫当众哭出声来——他的爹娘和祖父母都不曾受洗，僧人便讲，那些人眼下全在火里，任谁也捞不出来。“义镇来信说，那些人的经讲得好。”母亲在信里写，“可一位神只收自己点过名的人，倒比弥陀小气。”写到此处又补了一句，墨色淡了：“不过弥陀收或不收，我也是听人讲的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_rw_rosary_room:n0","text"],null]']
src = "blake3:bbf8a64611fc32bdbe896e6fcbbb8328ef6874fd5495b513c4d87fbd1e725a08"
text = "入了夏，母亲来信头一回谈及兼定要返回中村的事。她已把御所里父亲旧日住过的那一间理了出来：拆掉积灰的帘子，重铺新席，经箱挪至持佛堂，墙皮上唯余一处钉孔，是往年挂刀的地方。“政所的人说，当主理当住这一间。我教人打扫了三日，扫完后，独自在里头坐了一整夜。”信的后半段她写：“那孩子心里是空的，归来之后，住进这间空屋子。我怕的正是这个。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_sail_toll_failure:event","text"],null]']
src = "blake3:666b3baaa23adeca25ca6541653db29c1f7d792cbe940c320a76c34b418393a3"
text = "暮色四合收工时，阿濑将白日里的木札铺上船板，挨块点检，数至半途却搁了手。札上明记七条船，钱袋里头却单有六条的进项。“漏了哪一条？”她问我。我绞尽脑汁也记不起。河口晚风刮得芦苇丛哗啦乱响，袋中铜钱拎着沉手，偏少掉那么一串。阿濑半句斥责也没有，叫我心里比挨骂更堵。她只交代，明儿潮信回转以前，须把那条船寻回来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_sail_toll_success:event","text"],null]']
src = "blake3:238eb772ce053bd52df2394edb8f7d583e21a2e81aac28ea4732d4d7adf68665"
text = "这日河口拢共进了九条船，条条缴清。临到收船，阿濑先点过木札，又清钱袋，一文不少。她一声不吭，自袋里摸出两枚铜钱，往我怀中一抛。我紧攥着那两枚钱，在栈桥上立了好半晌。恰有只晚归渔船摇进湾里，船头汉子冲这面扯着嗓门问：“阿濑家的，今儿收成几条？”不等阿濑接腔，我抢在她头里喊回去：“九条！”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_00:aground","text"],null]']
src = "blake3:10e46e6e59beb0e0cbea0a5895928067ed6f2cef79c4d22f605175cd9443b598"
text = "船首死死啃住了沙。我扳舵慢了半拍，船底“咯”的一响，整艘船猛地一斜，卡在沙脊上动弹不得。退潮的水正从船身两侧哗哗退去，船底吃得愈发沉实。水夫们齐刷刷回首瞧我。阿濑立在船首，纹丝不动，半句话也没说。岸边已有闲人朝这头指指点点。桧板还堆在船尾，若再这么耗下去，潮浪很快就要漫上来浸湿木料了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_01:muddled","text"],null]']
src = "blake3:f2292e814ca72c049097fc8974249cb2b9ead2a0b9ad082f1c3be88869aa6b37"
text = "四十来根木札，我才清点到第三十根便乱了阵脚，返身重数一遍，较方才又出入了两文。管账汉子嗤笑一声，举起算筹在席面上一敲：“姬君，账目不是这般核的。”他不再耽搁，催促阿濑把短缺的数目填平。阿濑回屋去，端出一个旧布包，里头全是她私下积攒的钱币，当场一文一文点给了对方。汐躲在门后瞧着，眼眶泛红。那艘关船当天午后便驶离了河口。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_02:choke","text"],null]']
src = "blake3:a2876bf0fa741e688f1e16ad283d33fd17fce71469529f88cc16db4808890bd0"
text = "第四遭下水，我心里默数着寻，刚到五寻，胸口猛地像被谁一把攥紧。慌乱中张口呛进一大口海水，手脚胡乱扑腾，眼里白茫茫一片。阿濑拽着我的头发把我拖出水面。我伏在礁石上直咳，涕泪一块儿往下掉。岸边晒网的渔家孩子又起哄似的吹了声口哨。阿濑立在旁边，自顾自拧干湿透的袖口，半个字也没吐。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_03:swept","text"],null]']
src = "blake3:c26d4814447ff56a5b319625311524709cfcd2996017f23fb7fd6cb6b9c3db5d"
text = "行至半道，退潮的急流死死扯住船头朝下游猛拽。我使尽气力扳桨，桨叶却半截拍打在水面，船身仍一个、两个船身地往后溜。连漂木擦着船帮流过都比我快上几分。多亏汐摇着渔船赶来，抛过缆绳将我拉回岸边。阿濑定定立在原地，目送我被拖上沙滩，一句也未开口。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_04:undersold","text"],null]']
src = "blake3:fcad7b40a52bd674371921691c678fc0790bb014f4f6dd29982758950fe491af"
text = "我摊开鲣节的账目，那堺商一眼未瞧，只问了一句：“姬君可识香？”我回说略懂一些。他含笑揭开桐木匣，拈起那截伽罗闻了一闻，便道这木头放得久了，香气已去了一半，只值这个价——他开出的数，连母亲说的半数都不到。我张了张口，一时却不知从何处驳起。母亲就在屏风后头坐着，指间念珠一颗接一颗地拨过去，始终不曾停下。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_setback_05:drafts","text"],null]']
src = "blake3:056b81fea7bf0cd2e7edcbda59b0cce013bd0b59ea7edf87e22a99f6ff18798c"
text = "第五天上，砚旁已摞起七张纸，张张都才写得半首。冬潮落笔成了春水，盐花也成了落梅，写下去，竟成了别人的歌。明天一早船便要走。隔壁母亲正诵着经，念珠响得一下一下，比往常慢。阿濑过来问了两趟信可写完，我两回都答快了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_ase_illness:n0","text"],null]']
src = "blake3:3db3db65a295604976d43230fd5b69d391c03e2706a0527dadd4243cc94946ef"
text = "二月的雨连着下了三日，下田河口的水冻得发青。阿濑依然领着我下水，命我屏住气潜到礁底，摸一块白石上来。直摸了三回，她才点点头。上岸时我留神到她换了手：平时都是右手划桨，今日却全改用左手。入夜她坐在灶旁补网，网梭走一针停一顿，右肩往上耸一耸，再缓缓垂下去。我问她肩头如何了，她眼皮也不抬：“潮水要换向了，姬君快去歇着。”汐躲在被窝里拽我袖角，悄声说阿娘早年在能岛伤过筋骨，逢着阴雨便抬不起臂膀，却问谁都不肯认。灶膛里的干柴噼啪爆响，阿濑又悄悄耸了耸肩。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_ase_illness:n1","text"],null]']
src = "blake3:ccfb1b6f7d97d98077f9df44174d74381e5823b90cc9d7b12e225bd504af1603"
text = "进京尚未满两月，土佐的家书便紧赶着送到了。母亲的笔迹照旧娟秀细密，说的却是阿濑：入冬后海风凛冽，她的右肩疼得连网梭也握不住，偏还瞒着不许人告知我。母亲去问过中村的医僧，说是要根治得去堺，那边有位专治金疮旧伤的医家，诊金一回就得百疋，药钱还得另算；偏巧下田开往堺的船，须等三月转了风向才能启航，如此一去一回，怕是到了盛夏也赶不回来。“你在京中，医家众多，帮我打听打听，可还有别的法子。”汐读完信，一声不响，将信纸折成四方小块，压在了砚台底下。那夜她替我铺床，被子铺歪了两次。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_ase_illness:n2","text"],null]']
src = "blake3:1ab6faac9846091dd7fdbd22c4b4b561f2c7190f4eaf864bd0cadb3a8cf88628"
text = "阿濑这只肩，就这么又硬熬过一个寒冬。汐接到下田捎来的口信，说是她阿娘撑渡船时一篙没踩稳，连人带竹篙栽进了水里，万幸跌在浅滩上。我去寻山科言继大人。他听罢来龙去脉，先拉过我的手腕切脉，言道病人不在眼前，权且拿我的脉象充作她的来瞧，说罢自己先笑出声。他开下的是一帖膏药，须用乳香、没药，皆是从南边海路几经辗转运来的货，在京里贵得惊人。“方子我不取分文，药材我却垫不起。”他铺开日记，“今日这桩事定要记上一笔：一条家的姬君来讨膏药，面色竟比病人还差。”我伸手摸了摸袖中那串原准备买伽罗的钱。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_ase_illness:n3","text"],null]']
src = "blake3:9cf7ad8bb6d61d334f749728ffa2bac6667077a4e09c766096fbae0b99753d97"
text = "岁暮前后，下田寄来阿濑的亲笔信，是写给汐与我二人的，仍是她那一手硕大的字迹，一行里只挤得进寥寥数个：“已下河口。闭气久过往年。肩头阴天仍痛，晴天无碍。姬君归来之日，先下水，再说话。”末了另附一行，乃是派给我的功课：每日清晨把脸埋进水盆憋气，数够一百方许抬头。汐念罢，把信纸往我怀中一塞，转身跑去舀水。这般时令，下田河口的水刺骨般寒，阿濑肩膀才见一丝起色，便急着下水去了。那日清早，我在水盆里才数到六十一。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_ase_illness:n4","text"],null]']
src = "blake3:6a782e55742e942c634a90f8d359b4584aefb29b9f64916a5d085b3bde0eff81"
text = "又过半月，阿濑再托人带进京一封信，这趟半字未提自己的肩。她说，来年我出海时，她打算往我的小早上多添两名老水夫，皆是从能岛过来的，早年曾随她一道收过帆别钱，年纪比她更长，一身都是伤病：一位少了两根手指，一到天寒断处便开裂；另一位逢着阴雨就觉腰间似有虫蚁啃噬。“小早上寻不见大夫。”信中写道，“京中大夫多，姬君学一门手艺回来。我把人交托给你，你休想给我退回来。”我将信纸铺在膝头，良久没动弹。廊檐下汐正替我整理衣裳，叠好一件，又抖散重叠。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_boat_nails:n0","text"],null]']
src = "blake3:b3a51cd52a5ce582374c0578b0555eec273c9e6b535833d70f05af0510dd3a27"
text = "端午前头，政所将一条旧小早拖上了下田的船台。去年秋天它在足摺外头遇了场大风，船底浸了水，政所的人便打发说拆了充柴火，剩些船钉还能卖几个钱。老船匠不依，蹲在船腹底下，拿铁钳一根挨一根地往外拔钉。那钉子扁身子、一头尖，早已锈成褐色疙瘩，他起出一根，就在草席上码一根。我在旁蹲看了一上午，他才开了口：“姬君眼利，替我挑挑哪几根裂了。裂钉挨着的船板，也一并得换。”草席上早码了两百多根，太阳晒得铁锈发烫。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_boat_nails:n1","text"],null]']
src = "blake3:781ea02d76c00bdfb73f800ae98035b391145ff1938f438b4844063a71af984f"
text = "五月里，母亲寄来的信中夹着张皱巴巴的纸，是老船匠央人画的：一具船底，一道炭笔拉出的黑线，由船尾朝前歪歪斜斜地走，停在个钉眼边上。母亲说，船台紧贴着河滩，开春一场大潮漫上来，船底在湿沙里泡了数日，退潮后又被太阳足足晒了半个月，才裂出这么一道。老船匠托人问我一嘴：是换整板，还是补一补？换板得要木头，打补又怕下水复裂。我把那纸铺平在局里的矮几上，拿镇纸压稳了四角。汐凑近来瞧，说这道缝倒像下田河口退潮时露出的沙脊。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_boat_nails:n2","text"],null]']
src = "blake3:60f16846120c91dd5914dcb7f61cec429554e445e868ef2982a84daef5168e2c"
text = "幡多深山里的山主递了信来，是政所那边转寄的：小早待换的船板，他山上有现成的桧木，放倒、锯板、顺着四万十川漂放下来，统共要这个数。价码写得颇重，后头又缀了一句，说今年买木头的人多，堺的商人已经来问过两回。政所拿不出钱，这一笔花不花、谁来花，母亲在转来的信尾添了四个字：“你自己定。”我翻出这一整年在局里当值攒下的钱，拿细绳串好，一挂一挂码在矮几上，点算了两回，瞧着像是差上一点，又像是正正好好。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_boat_nails:n3","text"],null]']
src = "blake3:7838f5a620b14618ef02c043e11ae4db824c3e545867b833273b9df61dc29605"
text = "入梅前，下田捎来的信统共没几行：小早的船底补周全了，钉也敲齐，独留船首那一根。老船匠说，那根他不肯打，专等姬君回来打。信封里夹着一幅他托人描的图，船首所在拿炭笔点了个黑点，旁边另绘一把锤子，画得比船身还大。母亲在末尾附了一笔：船台上晾久了，木料要走形，政所的人催得紧，说下水等不到入秋。我心里算过，再早也得九月才回得了土佐，算来小早在船台上已横了三年有余。图上那个黑点，倒像正盯着我看。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_court_sisters:n0","text"],null]']
src = "blake3:d15c4e9b17dad4387177330ba38f16821b5d79403f6d73269d23777973d29bd4"
text = "八朔那天，从堺来的船在下田码头卸下一只漆箱，绳结上系着一条本家的签条。箱子里码着本家女房退下来的旧小袖，红梅、萌黄、浅葱，一叠叠压得齐整，领口却都磨出了毛边。随箱的信是位女房写的，假名细弱得像蛛丝：“能改动的，改给姬君穿；实在改不动的，便在土佐换些米罢。”母亲把衣裳逐件抖开，迎着日头细看衬里，手里的念珠搁在膝上动也不动。“京里竟也紧到拿旧衣来换米了。”她说道。廊下的阿濑正低头补网，隔着网眼往这边斜了一眼：“这等料子挨着海水就毁，还是换米划算。”压在最底的那件，袖口绣着纤细的唐草，线头已断了好几处。母亲把针线盒挪到了我跟前。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_court_sisters:n1","text"],null]']
src = "blake3:7277d762554a49d0bf195fa82d0af0019122c90b0d6a3906c51f07eb8ffe7c03"
text = "一入秋，局里掌管衣物的老女房便唤人把三只衣箱抬到廊下，逐件摊开晾晒。宫中今年仍未拨下冬衣的料子，只好将这批旧袿拆散重拼，好凑出十月更衣时要穿的几身。老女房用扇骨逐个点名派活：“菖，你接表面，绣纹一丝也不许走样。小督，做下摆。土佐来的——缝衬里。”汐立在我背后，从头到尾没人唤她的名字。菖将自己的袖口理了三回才肯接针，小督则挨近我压低声儿算账：“光是一身衣裳费的线钱，就抵得上我家两天的口粮米。”我翻过分到手的衬里一瞧，那片红梅色挨着表层的萌黄，色调倒是相配，偏是接缝处的针眼儿一密一疏，瞧着叫人心里别扭。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_court_sisters:n2","text"],null]']
src = "blake3:f78b8a2373ec1edb08940985407f1b926b373e747c9b20d1078e1703048050e3"
text = "局里品相最好那件唐衣还质在室町的土仓里。土仓掌柜递话过来：五日内若还不去赎，便转手卖予他人。偏巧那几夜典侍点名要我守夜执笔，半步也抽不开身。何况唐衣赎回之后，领口的金线尚需修补，进献的日期就在下月。小督道她认得那位掌柜，晓得他贪杯，多添些利钱，通融宽限半月不算难事。菖正替人折着一件单衣，连头也没抬，只说那几夜她刚好得空，大可替我顶班。“替班是要记下人情的，”她不紧不慢添了句，“宫里头的人情，可比土仓的利钱金贵多了。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_court_sisters:n3","text"],null]']
src = "blake3:90ed4dc96ea3fd8171e7271675b258d93642424545d8db5e7fbb42be73d05956"
text = "暑热正浓时，局里方晒完虫干。老女房自文箱最底下抽出一本衣账，封面上题的墨迹已叫经年的手汗蹭得发灰。这几年陆续典当出去的旧衣，逐笔都录在册中：何年何月押入哪家土仓，折换了几斗米，哪一日赎归。大抵都已勾销，独余两行空着，是一袭浅葱色的袿与一条旧袴。老女房说今年的赏赐须到腊月初才放下来，这两件只好留待那时去赎。她将账簿推至我跟前，扇骨敲在空行上：“你算得清账，由你来理。”这一年我十六岁。这是她头一回在众人面前唤我“澪”，不再叫“土佐来的”。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_fudaraku:n0","text"],null]']
src = "blake3:98ac356be1f873daa299a46d7306d57f0b8c7f12c004a36073a90f2bc909cad5"
text = "七月里，加久见的老船头从清水传话回来，说是港里躲风的一艘熊野船上有人提起，那智的浜边近来又在打那种船——四壁钉得死死的，只留条缝，坐进去的僧人有去无回。我闻讯求了艘鲣船载我去清水。赶到时老船头正晒着渔网，见了我，将烟管往船帮上磕了两下：“姬君，那种船漂出那智后去了何处，谁也猜不透。”他抬手指了指足摺外头泛黑的海面，“行船人叫那股水作黑濑川，水势比四万十川还要猛上几分。小船一陷进去，不出三天便望不见山影了。”阿濑搭着后一班船追到港边，叉腰立在岸上：“七月的海风最爱作怪，足摺你是去不得的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_fudaraku:n1","text"],null]']
src = "blake3:a6961a405529df9806fdc464f4450c6d4100bc45c5bbb2e8d822e3f7acce8b89"
text = "京城的酷夏闷得教人喘不上气。宝镜寺门前来了一位熊野比丘尼，背负竹笈，上头悬着张褪了色的画图，专给过客讲那智的掌故，讲罢便讨要香钱。图里画着那智瀑布和浜边鸟居，海中浮一叶小船，四角各立着一道小门，上书发心、修行、菩提、涅槃。汐才看一眼就拽住我衣袖：“那是载死人的船，看它做甚。”我立在原地未走。图上的岸线描得歪歪斜斜，船头直朝正南，跟土佐的船头们提过的黑濑川怎么也对不上号。比丘尼见我盯得出神，咧嘴笑道：“姬君好眼力，这图是那智山里的人画下的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_fudaraku:n2","text"],null]']
src = "blake3:fa0f2ffa00c2da3a33daef51bbdac51861c98f0a2be2250b2e7d47fc25946fc6"
text = "那张图我始终记在心里。今夏打听得四条有座小庵，借住着个熊野出身的老先达，专给入山香客做向导，屋中收着打那智山上抄来的年代记。我便领着汐寻了去。老先达坐在佛龛跟前，十指生满念珠磨就的老茧，开口言明册子概不示外，除非肯献一份初穗。汐凑在我耳畔盘算：“这笔钱够买足一月的灯油了。”老先达闻声倒也不愠，反将册子往怀里敛了敛：“姬君想打听的，究竟是谁人渡的海，还是渡海后去了何处？若是前者，册中自载；至于后者，任谁也写不出半字。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_fudaraku:n3","text"],null]']
src = "blake3:8e8d1a95e4f89b1a02af951796e2111622d49e5e9ce833eccc87f30c9a69a750"
text = "六月间，我满了十六岁。在局里那架屏风后面，我铺开这些年攒下的零散纸张：有亲手绘的，有笔录的，有从他人口中抄得的，还有记着潮时的怀纸。我打算拼起一幅从堺直抵足摺的南海路图。甲浦、室津、浦户、须崎、下田、清水，挨着个儿向西描过去，及至足摺岬，笔锋却停住了。再往南去便是黑濑川，黑濑川以南，便是那些钉死的小船所赴之地。汐伏在门槛上盯了半晌，才开口道：“空着的那块，你预备添些什么？”雪恰从长廊走过，步子在门前略滞了滞，拿扇尖往岬南那片空纸一点：“这一块，倒最好看。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_kanesada_letters:n0","text"],null]']
src = "blake3:da1614de8fbbb63fbb3e8a0236baafe57932cd59c7fa9eba1eb151d27b643db9"
text = "四月里，堺的来船捎回一只油纸包，是京里的兼定寄给母亲的习字。十张纸上抄的全是《古今集》里的歌，墨汁浓得透亮，字迹却一味向右斜着，活像顶风赶路。末一张独写了“姊上”两个大字，左边的女字旁竟写得比右边还阔。母亲一张张翻看，指间拨着的念珠骤然一顿，半晌才开口：“他在本家，自有房通大人请的先生，倒是不缺人指点。”她把纸叠好，旋即又摊开，“可先生教的是京里的笔法。你也写一张捎去，挑土佐的纸。”兼定离家那年才六岁，我九岁。如今见了这副字，我倒再认不出是谁教出来的手笔了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_kanesada_letters:n1","text"],null]']
src = "blake3:fe6815125819c720aded0f7c20a698644d16e1ad4d44896025a94704d0ea25a7"
text = "我进京后的第三个月，母亲托堺船捎来的一册习字本才算送到，原是她依着《古今集》替兼定抄的。兼定如获至宝，每天清晨都在书斋里临上一页。那日我打门前经过，瞧他伏案临得正用心，纸上一行行竟写着：某村米三石二斗，某村欠五斗。我取过本子一翻，原是里头夹了一张粮账，装订时叫线头同歌缝在了一块儿。兼定登时耳根都红透了：“我还当是土佐那头的新写法！”他才十一岁，顶忌讳遭人取笑。听见廊下有侍女留神，他扭头狠狠剜去一眼，紧接着又转回脸来瞪我。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_kanesada_letters:n2","text"],null]']
src = "blake3:834d3f2ce6c45e6e7cde6c4381e37a44419413d69129b28372003cef89fb6073"
text = "四月里，母亲的信送到了：去年秋里托船捎回的兼定习字，一张都没收到。那船在甲浦遇上大风，船舱进水，捎带的东西泡烂了一半。兼定看罢信，一把将信纸攥作一团，又一点点揉展了。他十二岁了，一整年积下的三十来张字，原是要拿给母亲瞧的。“重新再写就是。”他嘴上答得干脆，声气到底发涩。本家的纸早就告罄，兼冬大人的周年法事才刚办罢，账面挪不出钱来。我去找汐想主意，她把包袱皮都翻遍了，摸索出几枚钱，顿了顿又缩手塞回去：“这几枚我自留着，往后去能岛挣一面旗使的。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_kanesada_letters:n3","text"],null]']
src = "blake3:bc67b570ca30d8050b5cca9892104e61234f074f4b64e502727afadbadb240de"
text = "房通大人入春便起不得身了。本家上下说话都放轻了声量，然而人人心里都明白，兼定早晚得回土佐去。政所的康政大人递了信来，探问当主回转中村以后，奉书上怎样署名、对家臣如何称呼。兼定捏着信来找我，十三岁的少年，个头快蹿到我耳畔。“在京里，旁人背地唤我‘土佐的’。等回了家，他们就要尊我一声御所。”他把“御所”二字在纸面写了又写，落笔重极了。“那姊上呢？姊上要怎么称呼我？”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_kanesada_letters:n4","text"],null]']
src = "blake3:41e4e35a4903d0bcd586de08175c3aab29931a199397a48766b4abb2ea74456e"
text = "那晚兼定没去安寝，抱了习字本坐在我屋子门前。月亮还没冒头，廊檐下黑沉沉的，他把本子翻到末页，纸上落着“姊上”两字，较比三年前寄到土佐那张端正了不少，独那个女字旁仍显大些。“等我回去了，姊上是不是就要出海？”我没搭腔。他把本子往我怀里一推：“那姊上每走过一地，便捎信回来。写假名，记那儿的潮水几时涨。假名我认得。”言罢他把头埋下去，用衣袖使劲揩着纸角，其实那儿干干净净，一丝墨痕也无。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_mother_accounts:n0","text"],null]']
src = "blake3:06cce59c2252eebc0d1fd24c76ff281987a857c8ca450fb9eea162eaacf06ac6"
text = "阳春三月，下田米仓方才启门，春雨却淅沥未歇。母亲跪坐在仓前檐下，膝头展开中村呈上的粮账，左手腕套着念珠，嘴里清点一袋，指间便拨过一珠。去秋入仓的新米，正月发往堺换回绢帛与纸张，另拨付了一批给加久见的船头，可账面数目与仓内实存总对不上——仓里硬生生少了四袋。看仓的老仆推说是鼠啮，母亲默然不应，只顾从头再数。重数到第三回，她收住手，将毛笔递予我：“澪，你眼尖手快。你来报数，我来核对。”账页上的字出自政所书记之手，一行紧挨着一行，进项与出项全混在一处。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_mother_accounts:n1","text"],null]']
src = "blake3:04efd270fad5bd6e8714d618b175cf23e3e56f0f9983fae98990ec548ee670ed"
text = "京城的桃花都谢尽了，母亲的家书方才赶到。信是正月底自中村寄出，在下田候了半月船期，又在堺滞留数日，拆封时信纸边角已然潮软。信是用假名写就，语调依旧缓和：中村上下皆安，唯独去秋四万十川发大水，下游七户庄户的稻田浸泡半月，年贡交不周全。政所的人执意照章催讨，母亲则盼宽限几日。信封里夹带一纸欠租清单，乃是她照政所册子誊录的，七户户名、田亩、应纳与欠额，条条分明。结尾道：“你在京中，距得远，反倒能看清眉目。”兼定凑上前来扫了一眼：“姊上，这里头的人我半个也不识得。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_mother_accounts:n2","text"],null]']
src = "blake3:a28b34ecfe3d47999c26beda3b9049918d770d886d404e896d3cc94f8185b441"
text = "自开春以来，京都一条本家的米缸渐渐露了底。按往年惯例，中村的粮米早该搭头班船运抵堺，再溯淀川进京；今岁船虽进了港，载米却仅及往昔七成。同船附来母亲家书：去秋七户佃租或免或缓，政所仓廪随之一空，须先保住中村御所，京里这边只得缩减运量。信中未曾明言的是，宫廷上巳的赏赐，本家家司已登门问过我两回。我把本家近半年的用度逐笔摊开：绢帛、灯油、延请教导兼定先生的谢礼、宫里赏钱……哪一桩都省不下来。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_mother_accounts:n3","text"],null]']
src = "blake3:fe9578f62b27eebe561b7de3ec493a488d84c07a2413a038dd41e5d0c43e111f"
text = "三月里，中村来信言道，康政大人嘱咐兼定明年便满十四岁，一条家近三年的粮账理应从头彻查一回：中村入库几何，下田发运几何，京城收讫多少、耗于何处，三边数额须首尾相衔。中村与下田的簿册握在母亲手中，京都这份则归我掌管——这三载本家开销，泰半由我手录，杂夹在当值日记的草稿间，有的题于怀纸背页，有的记在写废的歌笺上。我把它们悉数倾倒在榻上，堆攒成一小座山。兼定蹲在一侧乱翻，抽出一张背面留有歌会草稿的纸片，才念出两句便遭我夺了回去。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_mother_accounts:n4","text"],null]']
src = "blake3:b56e1be7ffd469c224cc6b533aae2a7cbe541029d6017d9eabea98f11d32b5c6"
text = "临近入夏，母亲又寄来一封书信，较平常厚实许多。她说康政大人已然查验过三方账册，数目大抵相符；待来日兼定回归中村，她便把一条家的家计全数交还予政所，己身只顾潜心寺里的事。信中逐件列明她这些年保管的文书：粮账九册，庄户名簿两册，借贷契书一匣。信末问及，交还当日本想附上一份京城账册，问我可否亲手誊录一份整洁的，要我的亲笔字。信纸边缘有一处晕开了水痕，似曾溅过水点，却又拿不准。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_river_claim:n0","text"],null]']
src = "blake3:623aab260663a8f4b3d9d73e0eaf48538c835c72c0b87104623795b9fc2b91e0"
text = "九月里，四万十川的渡口闹出了一桩事。宿毛来的客商托渡守把三捆楮皮摆过河去，隔天到对岸一瞧，货却没了影。客商攥住渡守的衣领，从河边一直骂进市集，扬言要告到政所去。那渡守平日好大嗓门，在河上一喊两岸都能听清，这下却急得只剩一句：“我摆过去了，就卸在栈桥旁！”可栈桥边空荡荡的，唯有一圈湿漉漉的印子。我和汐蹲在岸上盯着那圈印子看，河水正在涨潮，海水从河口倒灌进来，水面漂着的草叶正往上游去。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_river_claim:n1","text"],null]']
src = "blake3:c563a4c49ee5eb092708bd6c3359c05730e2da30b82ec6ea60bbda55202ec505"
text = "九月里京中的暑气还未散尽，中村寄来的家书里裹着一页抄件。去年遗失的三捆楮皮至今下落不明，货主再次找上门来。政所宽限了渡守几回，这回撂下话：十月底再交不出货，便扣下他的渡船作抵。母亲托政所的船番誊抄了去年九月那几日的泊船簿：逐一记着日期、时辰、船名、来处与停靠的栈桥，总共十一条船。信尾母亲代渡守问了一句：姬君去年在岸边望了许久，可看出什么端倪了？"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_river_claim:n2","text"],null]']
src = "blake3:024aca653edc25e558ddd6c57bfd3eae5f6c402ef60b32afe8785913c3f61c58"
text = "八月回土佐省亲那半月，我刚巧听说渡守把船押出去了——期限一至，他将渡船典给市集的米商，总算凑够钱赔付了货主。回京还不到半月，母亲的信便追到京里。原来那三捆楮皮终究在对岸盐仓里寻见了，是清水来的盐船拿岔了货，顺手捎了进去，只是寻到时已迟了数日。货主今年转去堺经营纸张生意，在京城四条也盘下了一间小铺。母亲信上写着，渡守如今替旁人撑船度日，一日工钱喂不饱一家老小；可货主那边咬死说，赔款既已收下，楮皮他便不认了。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_river_claim:n3","text"],null]']
src = "blake3:8c7237af55a0820179119c4e3912824050665233fe5f48ae7895f8b4539e1bc4"
text = "九月返归土佐，船才驶入下田河口，我一眼便瞧见渡口换了旁人。新渡守生得瘦削，说话细声细气，撑出一篙还要喘息半天。从前那位大嗓门的渡守正蹲在岸边修补渔网，见了我起身行礼，随即又蹲回地上。原是政所记挂着他丢过货，打去年起便把官渡转包给了米商的侄儿。纵使楮皮早已找回、账目也已两清，渡口却始终未归还于他。他将渔网往膝上一搁：“姬君，这条河我摆了整二十年，哪处藏着暗沙，闭着眼睛都摸得准。”河心处，新渡守那条船正被退潮冲得打横了身子。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_tosa_forge:n0","text"],null]']
src = "blake3:d0a4ef97d87066e9b168f580a0189e5f15842e879d531c90f97d123f7a820a89"
text = "梅雨连着下了十天，下田河口铁匠铺的炉火熄了。从幡多山里背炭下来的汉子咬死了说铁匠还欠他十二俵，铁匠却拍着铺子里的柱子叫冤，说只欠九俵——他不识字，收一俵炭就在柱子上刻一道口子，账全记在上面。偏偏柱子上的刀痕新旧叠在一处，有的叫烟熏黑了，有的还是他儿子拎着柴刀砍着玩的。两人在铺门前吵得不可开交，檐水顺着屋顶往下淌。铁匠瞥见我立在门边，粗着嗓门喊：“姬君识字，你来数！”我凑过去数了三遍，头一遍十一道，第二遍十三道，第三遍又成了十二道。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_tosa_forge:n1","text"],null]']
src = "blake3:b11cda7c96aedc1487029d322c87fd5a6d7b7f31b70840f0df54b18408dcc337"
text = "进了六月，京里的梅雨竟比土佐还要潮黏。从下田北上的船捎来铁匠的一块木片，上头拿炭条歪歪斜斜描着三样物事：一柄镰刀，一只桨环，还有一只锚爪；随木片同来的，是母亲替他代笔的话。铁匠说今年的炭仅够打其中一宗：要么先赶庄户秋收指望着的镰刀，要么先打政所那条小早要换的船具。两头都要紧，他请姬君定夺。信里还说，图是他凭记性画的，尺寸未必作准，能有个样子照着打才好。兼定伏在桌案上盯着那只锚爪瞧了半天，说倒像只螃蟹。"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_tosa_forge:n2","text"],null]']
src = "blake3:ef38e93f7a19c463c471b4f7250e63c464c800d7f7a8594a68bf5916001c6874"
text = "五月连绵的暴雨冲塌了幡多山里的炭窑，烧炭的一家逃下山来，今年是一俵炭也送不出了。母亲在信中说，铁匠无奈改烧松根，松根火苗窜得虽高，偏生一阵旺一阵衰，打出来的铁器脆的脆、软的软，气得他连骂了半月，整条街都听得真切。邻近山里固然还有别的炭窑，可人家与下田铁匠素不相识，不肯赊欠。信尾处，铁匠托母亲问一句：姬君在京里，可否想法子周旋一二。我把信念给兼定听，他把胸脯一挺：“我是当主。这就发一道奉书下去，教他们赊。”"

[entries.'["upbringing/families/mio_events.toml",["chapters","c9_mio_side_tosa_forge:n3","text"],null]']
src = "blake3:0249114a9ce4686052b9fb393c9e95cfe34000f64b2df78a214c67cf3263351c"
text = "六月里，从土佐出发的船在堺转手捎回一个稻草包，裹得密不透风，捆绳上还插着一根鸟羽。拆开来看，里头是只新打的桨环，黑沉沉的，内圈磨得滑亮，外沿却錾了一只歪嘴飞鸟——那是铁匠的记号。母亲的信上说，铁匠先送一只来给姬君过目，只等姬君说个成字，其余的锚爪和铰链便照样赶制，年底前全数交到下田。我将桨环套上腕子，沉得胳膊直往下坠。兼定拿过去掂了掂，说这玩意儿若拿来打人，一准很疼。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1554:event:catch_up","reply"],null]']
src = "blake3:e9e1b9ded4ff6f726ed11a5cf9a545ec493358f4202f760487ac77c99476ce9d"
text = "刚抄到半途，袖角便带翻了砚台，墨汁泼黑了半张纸。上臈一声未吭，只顺手推来一张新纸。我只得从头再誊，直跪得双膝全无知觉，落笔时窗外天色已晦。上臈接过纸张，望了望我的手，道：“稳了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1554:event:catch_up","text"],null]']
src = "blake3:bac8506231b1e6b6442a90d56093df685e1ada71225f5673b74ff7f737b04dd5"
text = "污了半页纸，讨张新纸重抄"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1554:event:prepare","reply"],null]']
src = "blake3:8fe3fe96db4b769637656daf6054c233b2c513baf8c0ad99acdcca62cd4f2818"
text = "我向广桥家借了字帖，一连三夜摹写《源氏》桐壶卷起首那段，灯油耗尽一盏又添一盏。及至考场，当着上臈的面抄完一页，她只挑出其中一处“む”的收笔过重。散场之后，局内倒有两位女房寻来，问我借那本字帖一用。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1554:event:prepare","text"],null]']
src = "blake3:788d9f31594e1cc7ebce00b356d2e512673231d63595d5bb371c457d004029d0"
text = "考前三晚把《桐壶》临熟"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1555:event:catch_up","reply"],null]']
src = "blake3:7bc82ea77971587eafd6798f269ebe32438ca1bcff0d7b9212e4a4880abc5c78"
text = "我将真南蛮错认作罗国，满室一时寂然。散席后，我央求授香的老女房留出那片残香，独自在讲读间嗅至掌灯时分，直嗅到合眼亦能辨明它烧到了几分。次日清晨，我跪在她的房门外，把三种香从头报了一遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1555:event:catch_up","text"],null]']
src = "blake3:cffa5b3035a8ef7a5e384fb57f455ac4748a13ee133df73f26e30344ac49804f"
text = "认岔了一味，留步重嗅"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1555:event:continue","text"],null]']
src = "blake3:946bcf8711184c9fc3391f3ed1cea70cbed1c144687e4e5b49fcb18fc2a3543a"
text = "虚掩炉口，嗅入头一息"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1555:event:prepare","reply"],null]']
src = "blake3:1aed1967a355b7d54c5763bc13c4e9681abd58a295849f086d59237e34958de7"
text = "我将三种香木各削下米粒大小一片，入夜在云母片上轮番炙熏，每味各闻十回，嗅到鼻息发木便出门吹吹风。考校当日蒙了眼，三样全数报准，连焚熏次序也分毫不差。老女房在名册上我名字旁画了个圈。那回蒙眼辨香，得圈者唯我一人，国子大人还特地命人把册子取去看了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1555:event:prepare","text"],null]']
src = "blake3:220f32c1da0d077340c01ddb591de7a3ba543ce775ce09c5a2f35704366e119b"
text = "夜间将三种香各嗅十回"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1556:event:catch_up","reply"],null]']
src = "blake3:f5bd8e6aaf1d87e7bd7436bae1c29e39f12b06592e2cc01685fa8a0fe9e354a2"
text = "房通大人沉疴转重，我在本家侍疾三宿，耽搁了头一场考校。回局之后，上臈仅言一句：“今夜补齐。”我独坐灯下做完三道题，墨磨了双回，直待窗外更鼓敲响第四遍方才搁笔。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1556:event:catch_up","text"],null]']
src = "blake3:2245bbb17b510a52f9d502b1a4fafc8cb1c86fb3006edfc7d0c1be4925271709"
text = "侍过病榻，连夜补试"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1556:event:continue","text"],null]']
src = "blake3:dbb1f9df3a0376277f86345c2d04d38369dd6870681376f1abc51c8326f311c8"
text = "向上臈俯首，留下赴试"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1556:event:prepare","reply"],null]']
src = "blake3:3377f31b8dec36871d25e6ccace49b2a433f05dbbe03521267d3c5db6d21c164"
text = "我把三年积存的字帖、歌稿并闻香笔记铺满一扇屏风前，打初入门学跪坐的规矩温习起。应考那日，上臈命的题是代宫里拟一通女房奉书，酬谢某位大名的献金。我落笔不算快，却一字未易。典侍阅毕，命人另誊一份留在局中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_annual_exam_1556:event:prepare","text"],null]']
src = "blake3:2d694589d5cf653b8133f6f2a8771e5c2f98545a671ce2725968ebda07ac08da"
text = "将三年积下的字帖歌稿重温一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1554:event:catch_up","reply"],null]']
src = "blake3:879fc4898842cf0ec51bddf890516cbff4f597fe9aa58b9f65088556d057ee76"
text = "临交歌稿的前一晚，我才察觉第二句与人犯了重意。只得把灯挪进屏风后，逐字逐句另琢磨，写坏的稿纸摞了一厚沓。直到头遍鸡啼才算落笔，两眼发涩险些睁不开，袖里揣着新写的歌稿就去赴了歌合。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1554:event:catch_up","text"],null]']
src = "blake3:f818fe270f85669dace8bcbf9fffb485c6f35638e6788b7c4777f7d61a91b176"
text = "与人撞了意，连夜重作"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1554:event:continue","text"],null]']
src = "blake3:283cf3c6a968953043ba550ae3cea14a34fb10d1595a1199bc0df771db3da673"
text = "等着念出第五番的短册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1554:event:prepare","reply"],null]']
src = "blake3:5044ca5d5f55ee2f215e89c074aa20a98dd447f12378733de295eb1dfb26e43a"
text = "我从《古今集》夏部里挑出所有咏时鸟的歌，悉数抄录下来逐首诵读。哪一首写时鸟尚未鸣啼，哪一首写它连叫两声，我心里全记清了。到了歌合当日，我的歌虽未取胜，判者唱罢却留了一句：“是读过书的。”这句评语日后被人誊在了歌合记的页边，旁侧还注了“土佐”二字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1554:event:prepare","text"],null]']
src = "blake3:23338c1c6c69451cbfcf3c9dfadc3cfbe284216a7417351c8c24478647be79fb"
text = "照着《古今》把时鸟歌抄一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1555:event:catch_up","reply"],null]']
src = "blake3:ffc67c0ec258e1fa800785fd245da4a2a592fe4523867e05afe1c26cceb42292"
text = "递交前雪瞧了眼我的稿子，拿笔管点住第二句：“多出这两字。”她划掉的恰恰是我最引以为傲的字眼。我独自闷气了半下午，黄昏时终究提笔改写，直改到第七稿，才觉那两字果真多余。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1555:event:catch_up","text"],null]']
src = "blake3:641d13c7607e1b3617d684e1844dd4af8444ed06c2d05479355c5edcb88dc6c8"
text = "遭雪删去两字，重作"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1555:event:continue","text"],null]']
src = "blake3:e1937c2f7a77e65d5861666362cd3f6b95b58323a4659b49668624be0f82faee"
text = "照原样呈交短册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1555:event:prepare","reply"],null]']
src = "blake3:842d564f882ec2ab2f6b9fca243df5b0a00875dd77ddeaff49b87c4c08313eea"
text = "三条西公条讲说《源氏》时曾提过，卯花须趁月色端详，那白净倒像一层积雪。我赴宝镜寺篱笆外伫立了两个夜晚，归来又翻出《万叶》古歌逐篇比读。歌合品评时我那首得了“持”，判词夸我把卯花与白雪剖别得清朗。当晚便有女房上门托我替她看歌。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1555:event:prepare","text"],null]']
src = "blake3:a0c4112682d3c8eb5e4ccaabd45998c7b00bc29ec9df721931c1abf1eb20e765"
text = "趁月色往宝镜寺赏卯花"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1556:event:catch_up","reply"],null]']
src = "blake3:d50a0e5c74004fe5f7b5f4b54ea63ef6138f9a8ac644ec648ed321b466fb9412"
text = "歌合定额三首，我在局里值夜执了一宿的笔，到头来只凑成两首。破晓前汐替我拨亮灯芯，宽慰说潮水还没转势，赶得上。末一首是赶去会场的廊下才收尾的，墨迹犹湿，便交了上去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1556:event:catch_up","text"],null]']
src = "blake3:74a5e3d2f5d065a5645d38ca7bf47ccf22db6caba0412aa18274d039d6d14177"
text = "夜里执笔完，补出第三首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1556:event:continue","text"],null]']
src = "blake3:34f81858a3fea9b7161fd511d73d2967ee32b3511d0c7a4bd7deae6a1d062036"
text = "在短册背面上写定那个字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1556:event:prepare","reply"],null]']
src = "blake3:78797e37562d1e8a5505083078360c0720fd8e4adb2cd6e596e65b9e0cdc9820"
text = "题目既由自己拣，我便择了“潮”。宫中罕见有人咏这个，我翻出旧集里寻得到的歌，一首接一首抄进小册，连沿海渔户的俗谣也录了几句。到了歌合那日，判者问起下田的潮水一天涨落几回，我照实答了，满座的人齐刷刷转过脸来看我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_contest_1556:event:prepare","text"],null]']
src = "blake3:c2f6fc5ff04025e1916ed75eb372d9fb7e1e9a4b655bdbb7cf2c8b66ce61d7c7"
text = "拟“潮”为题，翻遍旧集"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1554:event:catch_up","reply"],null]']
src = "blake3:0f6e8b7dff1416736dac9277b6846a655b9ed099d2e2906f061dbb7f20f85baa"
text = "船停在纪伊外海候风，整整滞留了九日。等踏进本家才晓得，请来授课的老女房早将跪坐与递扇的章程讲过了一回。我白日跟着学新课，入夜再把错过的条文逐一补全，膝头跪得青紫一片，全靠汐拿热水巾替我热敷。半月之后，老女房重验我行礼，竟是一回也没有喊停。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1554:event:catch_up","text"],null]']
src = "blake3:5cc594b2ab37939057f017f0d1389112795260315c24c55205c65fde6f2b82a2"
text = "耽搁九日，夜间挑灯补学"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1554:event:continue","text"],null]']
src = "blake3:6e7147053bc6638b422f3de9835eaa269481673dd5e847ba44a685aa869310f1"
text = "随老女房从头学起规矩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1554:event:prepare","reply"],null]']
src = "blake3:012a9c99befadbec6cc0326771e950d3cf6d071f2e2a35a5e242fa3c5fbde57c"
text = "保子大人借我一卷她年轻时手抄的宫中旧例：何时晨起，怎样递扇，应对上臈该用哪些措辞。我每日默记一段，到了第十日她当面考校，我一气儿对答如流。她便侧过脸去，对身旁的女官笑道：“土佐来的姬君，记性倒是出奇的好。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1554:event:prepare","text"],null]']
src = "blake3:a7cb0941bc1eecd22d10ed6cba0f0c22d4d897cefad3086e91d9f9c4ba73aea6"
text = "先把保子大人的旧例背熟"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1555:event:catch_up","reply"],null]']
src = "blake3:4f02bee997905cb7dd6d10ada6cd9f58ab2058030c3d530a37de031aee1c009d"
text = "去秋欠下宝镜寺的半卷经书尚未录完，住持特意捎信来催问。正月里众人四处贺岁，我却跪在经堂中埋首抄经，指头僵冷到捏不住毛笔，便塞进袖怀里捂暖了接着落墨。抄毕那日，住持收好经卷，还留我饮了一碗热腾腾的汤水。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1555:event:catch_up","text"],null]']
src = "blake3:611199ffe1a0652de2e91a48e2d6d7a672e4fcc7db9046477be57846e56c084a"
text = "抄完去岁拖欠的半卷经文"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1555:event:continue","text"],null]']
src = "blake3:d43c0471ad5ddd1e04d363732d31f10b23e975ffe02e72fe965353c486a3c15e"
text = "将近火盆的好位让予新人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1555:event:prepare","reply"],null]']
src = "blake3:cb7f862339af6e31a0d4a1a05d617d3608b3863466999e5172556e0a9374851a"
text = "局里新添了三位小姑娘，跪坐起来脚趾总暗自乱动，活脱脱像去年的我。我将去年攒下的礼数细则抄录三份，每人分了一卷。上臈瞧见后，命我在讲读间内先替她们演说一番。这么讲下来，我自己倒又从头至尾重新背熟了一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1555:event:prepare","text"],null]']
src = "blake3:565610350b058c679a7a7e51af1e59d3a57637dc204a85aee121ff637ae77faa"
text = "将去岁记下的规矩抄送新人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1556:event:catch_up","reply"],null]']
src = "blake3:107641ec93d318bdaeecf5720f468f4c76f84e4a9c39ca57e1c2bfbc54e9b482"
text = "袖口磨破了毛边，母亲捎来的新衣尚在途中。我借过汐的针线，入夜一针一针将毛茬藏入里侧，线脚斜了便拆，拆罢复缝，直改到第三遍方不露痕迹。次日入局，菖斜睨了一眼我的袖口，复低眉瞧瞧她自己的，默默把手缩进袖子里。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1556:event:catch_up","text"],null]']
src = "blake3:75fb36ff017728d50d199ee0be1a75ad05ec14ba98cad55641eaaca09bea058c"
text = "秉烛把磨毛的袖口缝牢"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1556:event:continue","text"],null]']
src = "blake3:9dceb4fe546225ccc1c0595b784d1d8c044285d60daf7689e9374b7766302942"
text = "掩着袖口，落座候示"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1556:event:prepare","reply"],null]']
src = "blake3:bc9370dfc1e2936d89a3b589fba80b191f84b675f05e7903716e58c875168846"
text = "返局首日，我便往三条西家借来讲义抄本，将今岁要论的宇治十帖抢先读毕三帖，生僻字悉数摘录在旧扇背面，展扇即见。小督拿去翻了翻，说这扇若拿去卖，少说抵得两斗米；转口又说才不卖，她要照样也抄一柄。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_enrollment_1556:event:prepare","text"],null]']
src = "blake3:d0f2211236dfba0aab38f104bec54f9e7ec899f5186964f15b6a9853d32529bb"
text = "先借讲义读通宇治十帖"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_graduation:event:catch_up","reply"],null]']
src = "blake3:0572eaa7e727f5405f6e71aa3fbf6a574b1b06623118010590b1f2a69477a28c"
text = "末了一日还轮到我值笔。别人都往小庭去了，我独留局里写完御汤殿上日记的最后一页，墨汁冻得滞涩，哈一口气才写一字。待搁笔出去，小庭里早已散净，唯独汐还立在梅树底下，鼻尖冻得通红，嘴上说再晚一刻便不等我了。可她脚畔的积雪，早踩实了整整一圈。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_graduation:event:catch_up","text"],null]']
src = "blake3:4568666082e209fe31d5c242b035fe057daaed81cbac7c0c64724519e439e785"
text = "留局写毕末页日记"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_graduation:event:continue","text"],null]']
src = "blake3:1fefc24bcbbac678d5fa222f7681ea005c102a45a59208145e6a409bd69d8d5f"
text = "去梅树底下赴约"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_graduation:event:prepare","reply"],null]']
src = "blake3:ad0577fb6b2a33e848d15a0066d70c4d08dfb57d4f8a12c80ab7c17aef096f6e"
text = "我将三年的和歌誊录成册，赶在末夜才装订好，呈给上臈。她翻至七夕那首停住，叫人请来典侍，当着小庭众人的面念了一遍。典侍未加评点，只阖上册子，在我于封皮写的“澪”字底下，添落一个极小的“标”字。小督贴在我身后轻声道，这下连名字也配齐了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_graduation:event:prepare","text"],null]']
src = "blake3:6d65a0704d38a61192b85adf26e0b22a5e7f5208bd7cc4e69cbab94c89eb252f"
text = "把三年歌册呈上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1554:event:catch_up","reply"],null]']
src = "blake3:f757dd7d24e21b376f1fd68262b9f33699eafba472a39809f764bcf8ddd186a2"
text = "我返本家晒书的那半月里，三条西大人的讲学未曾停过一日，已经由《空蝉》讲进了《夕颜》。我找局里的老女房借了抄本，夜里把灯芯剪短，一帖挨着一帖往后补。读至空蝉脱下薄衣遁走那一节，窗外秋虫嘶鸣不断，我掐着手背撑住不睡，天亮前总算将功课追齐了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1554:event:catch_up","text"],null]']
src = "blake3:06fdfa2d32242924a34775b93caa848ba3a64a5fff606878f36bf9a9bd81ffcf"
text = "连夜把落下的《源氏》补读完"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1554:event:continue","text"],null]']
src = "blake3:aef4ae757c4901c9544e39c3582428f671c10b740ffa286715561ee71a4a82eb"
text = "借小督的讲义来翻看"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1554:event:prepare","reply"],null]']
src = "blake3:ea6ac39ce82fbfcaf928703554d5ecc41b57c56d01da3c164bf87f7495913490"
text = "临回局的前一夜，我在本家将《夕颜》里的生僻字誊到一张小签上，塞进扇骨间。待到开讲，三条西大人开口问夕颜花是生在何等人家的墙头，满堂皆静默无声，我应道：“开在贫苦人家的板墙上。”大人举起扇子朝我点了一点。散课之后，女房们便排队来向我借那张小签。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1554:event:prepare","text"],null]']
src = "blake3:83ecef7cbe96b43dfb82c0e12c09ec0eb1df2476d779c4beaf8659f259b22791"
text = "依着校历先把下一帖温熟"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1555:event:catch_up","reply"],null]']
src = "blake3:f1d6d95fc074a9567e57a6577c8a4ae94bf36ec3dbf15f8a78e77df4dc903c2b"
text = "整个假期我未曾摸过一回筝，返局首日，指腹老茧退软，才拨弦便作痛。我将筝挪至檐廊下，迎着秋风打最缓的曲调练起，错一音便重头再来。及至日暮，指梢磨出了两颗水泡，那首曲子到底连贯着弹完了一遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1555:event:catch_up","text"],null]']
src = "blake3:5ce0ccbd5daa1f4bda6048964db191f0ef6f86f09f213877c70dab7e63defcde"
text = "捡回假里荒废的筝艺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1555:event:continue","text"],null]']
src = "blake3:f6f9a36a32ae8353bdc0bd0204819b0be3c0b84848846d8d4483859a62c900da"
text = "卸下行囊，先向上臈问安"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1555:event:prepare","reply"],null]']
src = "blake3:1736be5c24b61d0bbe178b4b87f793a3dba86c05bc37d0c37315e7590fe029d5"
text = "听闻今岁秋考须蒙眼辨三种香，返局当日我便去寻掌香女房，将伽罗、罗国、真南蛮的出处及气味逐一问透，记在怀纸上。入夜局中众人围拢来看那怀纸，菖亦在旁，阅毕仅抛下一句：“记得倒详尽。”次日，她自己也寻去了那位女房处。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1555:event:prepare","text"],null]']
src = "blake3:bef9a2d787c2db65ba929f29b7f08eecd9280dde15f168cedca4191f8a244a2f"
text = "先打探清楚秋考的三种香"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1556:event:catch_up","reply"],null]']
src = "blake3:e9cd62f09e891c6cf403248cbcb691bf7acf7174601e86121c4eabcdd2e53dc3"
text = "回土佐管账那阵子，局里轮到我四回值夜，都是旁人替了去的。回来头一桩事，便是一气补齐这四回，连着四晚替典侍执笔。到第四夜写“今日无事”时，笔尖一斜，墨在纸上洇成一朵花，只得整页重誊。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1556:event:catch_up","text"],null]']
src = "blake3:4e9067e4b1f1ef27d29f0649e2df560fd28463064b82791ad7fa6060e0a015bd"
text = "把夏时落下的值夜补足"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1556:event:continue","text"],null]']
src = "blake3:ff477e1c86b60ff4668f0a98c6e1c5aa57bdc0f72f9cbfc77078aa558b62b871"
text = "在朽叶色帘下敛膝跪坐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1556:event:prepare","reply"],null]']
src = "blake3:f524ff287efc949e580449d5b49c62140a3524c90405e26d4be06123c6fe5acb"
text = "眼下就剩最后一个学期。结业得考假名、和歌、座次与香这四样，我各备了一只小匣，入夜便取一只出来温习。帘子才换上枯叶的颜色，我便坐在帘底下品香、默诵和歌。小督瞧见我捧着香匣，凑近过来抽走一只，说这一匣由她考我，若错上一回，就赔给她一升米。到了月底，典侍点名要瞧那四只匣子，命我逐只捧去她案前揭开。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_end_1556:event:prepare","text"],null]']
src = "blake3:7e5b73503640c1e20f153475c6e3cd16907800dda1121a57f5ac5253be81c0df"
text = "为结业考的四门各备一匣"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1554:event:catch_up","reply"],null]']
src = "blake3:c5043179481bf42785d5d4ee9d6131cce82ece547521af27056674d3c4e695de"
text = "本家书库一年只开这一遭。一册册书摊开在长廊竹席上，我看着它们翻晒，趁翻过一轮的间隙，就把局里没写的假名字帖铺在膝头补抄。风掠过廊下，书页哗啦作响，我只得一只手按住书页，一只手压住字帖。直抄到日头西斜，字帖方才补完，衣膝上已沾了一层书里抖出的虫屑。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1554:event:catch_up","text"],null]']
src = "blake3:e043e1f0ed0b0f3143e5ba05397c09b8aa05f5b2f71c7777b007f1d5fe66d767"
text = "趁晒书的间隙补抄字帖"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1554:event:continue","text"],null]']
src = "blake3:e1f2db8a02ee98b6b1b7caf0604ca9e45465fb1ca09559b19639ddb6638cc15d"
text = "守在竹席旁替书翻面"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1554:event:prepare","reply"],null]']
src = "blake3:8a712e1f97c2f22b4f9a7daee2a2d6ee280a0a6728924a63cc0c132b609de807"
text = "我偏拣了房通大人那几只书箱来晒，从中翻出一部旧《源氏》，页边尽是细密的朱批。下学期要讲的那几帖，我坐在竹席边先读过一遍，也把批语抄在了怀纸上。房通大人隔着屏风听着我念，咳了两声：“那是我十六岁时写的，错了一半。”他叫我把这部批本带回局里用。老女房瞧见封面上的花押，打那以后同我说话都客气了些。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1554:event:prepare","text"],null]']
src = "blake3:94be155cac510c0e5d42a94a82e6408941354accd02fb5de48b0c34e1ca5384a"
text = "借晒书先读下学期的几帖"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1555:event:catch_up","reply"],null]']
src = "blake3:be6be26cc6559f1ee8d441416aaccc1b1c4def97ab0b5c0f5512df3eba378b77"
text = "一担新米加两匹素绢，由下田老仆挑在肩头，我尾随其后顺四万十川向上游行去。途中我将假里须交的十首和歌噙在嘴边反复斟酌，每经一处渡口便改一字。及至中村寺门前，十首总算全数凑齐。老仆歇担揩汗，直说姬君一路都在默诵经文。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1555:event:catch_up","text"],null]']
src = "blake3:410420a65e76599039f6b988ea0677b4cb913d91f3357c6eac4ce589b4a25720"
text = "赶路时顺道把欠歌推敲完"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1555:event:continue","text"],null]']
src = "blake3:ecbf595575e94b67f594cdd585ff4865b379f838a7cc131decf184887e84ca56"
text = "跟着挑担顺河岸往上走"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1555:event:prepare","reply"],null]']
src = "blake3:cea5b154aecd7d316a4aac4cc142521e137819bd6c4b2438ab8cb45f83560638"
text = "送供物前三日，我研了淡墨抄录一卷《般若心经》，悬腕落笔，丝毫不敢手颤，写罢随供物一并献上。寺中老僧摊开端详良久，称赞京城带回的字迹果真不同，遂将经卷置在本尊像前。此后半月，凡入寺进香的人总要近前瞧上一眼。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1555:event:prepare","text"],null]']
src = "blake3:8de192863b699ac055d303db838545354c83b872270236c24026b3ce4f62f2ec"
text = "先誊一卷经随供物送去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1556:event:catch_up","reply"],null]']
src = "blake3:b42992dd48fa441118983c7990b2ca50aa1c8236b449ee9333bd5c288053ef9c"
text = "母亲那摊粮账一铺开，足足占去半间屋。白日里我跟着掌仓的老仆赴下田米仓清点实数，入夜方得空理会局里派的假中功课：《古今集》秋歌，日日抄写十张。抄到第六日的十张半途，灯盏里的油熬干了，我便搬去廊下借着月色赶完，进屋时双腿早教蚊子叮出七八个疙瘩。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1556:event:catch_up","text"],null]']
src = "blake3:a00e4710593d076a73f29bb63674846614948bf07465f0e0bcf54d04794eb0e5"
text = "趁着月色抄清欠下的秋歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1556:event:continue","text"],null]']
src = "blake3:370609eea380cc694f75bf88664c5743b5b72c13a08c47808ddc0b7d7c27633e"
text = "贴身藏好母亲的信，沿淀川而下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1556:event:prepare","reply"],null]']
src = "blake3:98fa355aa32e84c5c3dccc02e2c4200ad3222c47ea67e6072f742918751000fc"
text = "刚回下田的首日，我便将今年打正月起的进项翻出来，一行一笔誊清，旁注上出自哪个庄子、晚交了几个月份。母亲端详许久，从柜底摸出一把旧算木塞进我手里。没过几日，政所的康政大人差人传话过来，说中村今年修堤的账，也想烦请姬君过一眼。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_holiday_start_1556:event:prepare","text"],null]']
src = "blake3:19659a74ddb6c7fe1e20d474ea55a300d2da14f639c62df86ab27b8ecfbc06a2"
text = "先将今年的进项誊抄一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1554:event:catch_up","reply"],null]']
src = "blake3:15c41c7e22d7b3f27c71452e5c00d232dd9038b6edf34c2de7b79abe5f8434b8"
text = "此番考较要背诵《古今集》中的春歌。前几日我陪着兼定往鸭川畔赏落樱，把温书一事抛到了脑后。临考前一宿，我将歌卷压于枕畔，背完一首便抽出来核对一眼，再悄悄塞回去。直到雄鸡啼鸣仍觉结巴生涩，偏巧次日上臈抽点出的那三首，我竟一首也未曾打顿。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1554:event:catch_up","text"],null]']
src = "blake3:c949112ff53036f6d259c89b7d7cbffb58abe7f443403433d0ac78144bb20804"
text = "考较前一晚赶着背春歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1554:event:continue","text"],null]']
src = "blake3:f70811dba3a742377a4e80d2b729d0d72468806fbb856fe20cfac43743d8e8bb"
text = "跪伏上臈身前候她点名"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1554:event:prepare","reply"],null]']
src = "blake3:4f8600b87f48275e2337738c1a3f63e7d1842e7b3a9fa29e614420343c5f9670"
text = "见了落樱，我便晓得考较近在眼前。我将这月余所学之座次、敬语与春歌，逐类誊录于短册之上，悬在屏风一角，晨昏各温习一回。及至考较当日，上臈询及典侍与内侍孰先落座，数我回得最为干脆。散场后，菖打我身畔经过，斜睨着我屏风上的短册盯瞧了许久。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1554:event:prepare","text"],null]']
src = "blake3:4c7dbd51728e57f28b1ca51c83f388c94941022c972b1f14819d675bbc4ad541"
text = "樱花初谢便将功课悬上屏风"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1555:event:catch_up","reply"],null]']
src = "blake3:88c71054ad70634ac6f13dad222030fc64745ef3002513431626667ae6c6f3fc"
text = "待我抚至第二乐段，侧旁香炉里的灰骤然倾塌了一大块，撒了满案，连筝面亦未能幸免。席间女房们俱垂首忍笑。我干脆住手停弦，拈起袖端将琴弦上的香灰逐根揩拭洁净，这才回到首段从新弹起。曲终之后，上臈半句评断也未落下，单单唤人把香炉撤换了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1555:event:catch_up","text"],null]']
src = "blake3:82131daf24c214f410b60eff6c80ad4c164d3e80266437b0a1dec21cf5818736"
text = "拂去香灰，从头重新奏起"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1555:event:continue","text"],null]']
src = "blake3:50952029691a8fd773796dbc7c6fcc1ef85ee472759aac882c5fb3104e4110a5"
text = "指尖拨响头一根弦"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1555:event:prepare","reply"],null]']
src = "blake3:f76e5d8ec14c54ac513d0da10565b1cb5e1e8109f3a143bf2a2892a1dc603b54"
text = "这支曲子我在局中苦练了十余日，练到合上双眼也能一把摸准第七根弦的位置。考校那日炉灰果真坍塌下来，直直跌落我手背之上，滚烫得我腕底一颤，可指腹并未停歇，硬是一路抚弹至尾音收束。那天山科言继大人恰在座中旁听，回府也不知同谁提起过这桩，隔日连外局的女房都在纷纷传道：土佐来的那位，香灰烫在手上竟也丝毫不乱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1555:event:prepare","text"],null]']
src = "blake3:42ee3de0a9113bd84c40abc2674e48cc86dd7f523632ecbd8dc9166cb0da7403"
text = "先将那支筝曲练熟至闭目"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1556:event:catch_up","reply"],null]']
src = "blake3:6c7c893c7f182c7db67a9a9d44c78e4709bf7c6e86f9e9b2f207f23ccd7c6d40"
text = "题目乃代某位典侍回复一通远国来信，答谢人家送来的一筐干鲷。头一遍交上，上臈说太硬，直如武家书状；第二遍又嫌过软，几近恋文。我返局后将两份并排摊开，逐句挑选，挑至半夜方动笔写第三遍。呈上后，上臈看完，把信折好收入了她的文箱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1556:event:catch_up","text"],null]']
src = "blake3:fea2867b057edd8db4f9482a52329af55136a20ac4d4d1741aff1ed945b984bc"
text = "斟酌回信至深更方动笔"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1556:event:continue","text"],null]']
src = "blake3:3594f827dce979b0f50d4ae0a690defbd12f06459a51ce0dc929afd51471fa07"
text = "展纸落笔，先起头稿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1556:event:prepare","reply"],null]']
src = "blake3:5b51f98bd00353d5c1fde8403359b92bafd58fdbce062e457d6d944ba48e0879"
text = "抽考前几日，我将母亲这几年来寄至的家书尽数翻检出来。她的信向来不见半个“请”字，读信者偏偏总肯照办。我摘录下她如何起头、如何收尾，夹入扇子里。及至下笔，前两遍依旧没过，写至第三遍时心中方有了底。上臈收去交与满室见习传看，赞说这方像宫里出去的信。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_midterm_1556:event:prepare","text"],null]']
src = "blake3:15e3ca803250b7ef93283b51f6d8574800119451ccc4c61c60def0078a3e8c00"
text = "先翻母信揣摩复札笔法"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1554:event:catch_up","reply"],null]']
src = "blake3:8bd7ad00a38753b13460a9f513f2804d9d2c33a58e68096fc647bf56103981f0"
text = "施饿鬼当日，宝镜寺佛堂挤满了各府的女眷，我帮尼僧端了整整一下午供饭，原本要抄的经文竟一字未写。入夜后，我借了寺中一隅灯火，总算将那卷经补抄妥当。停笔之时，东山方向敲响了第一声晨钟，佛堂外的施饿鬼棚尚未拆去，几只乌鸦正停在棚顶争食供饭。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1554:event:catch_up","text"],null]']
src = "blake3:2aad0ce8cf72ff8f70e6e4a316713e4953e3f0328b3474170786cc91cbe17851"
text = "借着寺里的灯补写经卷"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1554:event:continue","text"],null]']
src = "blake3:dd4941cbcb6c6b3f19b47932b7bb5b0d28e6ed88fd9cdc39ffde4b6ee8bfd581"
text = "也取来一只碗，跟着盛饭"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1554:event:prepare","reply"],null]']
src = "blake3:fca6f63735f8cff3a57ee4c0f20bedcd66397f568edd262178f176c26321a1c5"
text = "离施饿鬼还有几天，我先去寻了宝镜寺的老尼，把供饭怎么盛、幡如何挂、念到哪一句撒米，逐一问了个明白。等到了那日，几名新来的见习乱了手脚，我在旁轻声指点，竟一回错处也没出。住持全瞧在眼里，散场时便吩咐人包了一包炒豆递给我，说是赏那个没发慌的孩子。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1554:event:prepare","text"],null]']
src = "blake3:1e4a768cef8a3e2421ae01efe071006ce3cd48a06ffd94f5e23de163723a2a76"
text = "先把施饿鬼的规矩问明白"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1555:event:catch_up","reply"],null]']
src = "blake3:d2a14dbfd7cd5788609f9c7de0d9bfb6977e01949facaa32349a8c008856696e"
text = "局中迎火由见习们操持，麻秆须一束束捆扎妥当。那几日我正替兼定批改课业，捆到半路便撂开了手。盂兰盆前夕，我与汐蹲在廊檐下将余下二十束赶完，麻秆碎屑刺进指缝，汐一面替我逐根挑出，一面还数落我笨手笨脚。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1555:event:catch_up","text"],null]']
src = "blake3:3693067f7844bec4655a700ec68912951087e3b00d1166a0911c966f2caa08e0"
text = "赶夜把余下的麻秆捆齐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1555:event:continue","text"],null]']
src = "blake3:22610aba35e419c22b8a34d5332c5cc020e9d1be9b49e11488fdf7fc21206280"
text = "天一擦黑便点起这束麻秆"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1555:event:prepare","reply"],null]']
src = "blake3:bbbe4d8c802d0eb8734dd56327712ad373574302defe528a0532a09b2a519cd3"
text = "才入七月，我便去室町通采办麻秆，专拣笔直干爽的，吊在局后竹竿上风干。烧迎火那夜，别局的麻秆返了潮，半晌只见冒烟，独我们局一点即燃，火光映得整条游廊亮堂堂的。上臈隔帘望见，次日就把来年操办迎火的差事交给了我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1555:event:prepare","text"],null]']
src = "blake3:fc803d98f2085b6c3373c5fb765c37acbce7ff079a9e93667bfeac399fb4460a"
text = "提前备下晒透的麻秆"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1556:event:catch_up","reply"],null]']
src = "blake3:a2554206c6824da6d6da4d9ad68f3b9352d7af45648b2af107fb98c8f07b3081"
text = "点灯的名录由老女房口头报来、我动笔录，写到半途有人来叫，便漏下了三个名姓。入夜按着灯笼清点，才觉出短了三盏。我抱起灯笼逐个局打听，问到最末一位，原是早年病故的一位见习，旁人早忘了她姓甚名谁，单记得她一到夏景天总爱在廊下养一笼铃虫。我于是在灯笼上题了“养铃虫的人”，点亮了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1556:event:catch_up","text"],null]']
src = "blake3:d4b4726b39a9da504de61a70b88ed8a38d7bb5160f70feaa34f18cf129327c95"
text = "逐个局问全漏记的名字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1556:event:continue","text"],null]']
src = "blake3:2b42e893f352b4bb6c4adfe18deefaa0794f8d3fba5fd8b4e88b71ec9bc5f066"
text = "拂去头一盏的灰，题上名姓"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1556:event:prepare","reply"],null]']
src = "blake3:fcd7a34e012c08477de1f0141b43e949a14d299b2e663c8beba703e6edec53f6"
text = "末了一遭替亡者点灯，我赶早三天便将局里历年的名录誊出清本：谁哪年故去、生前在哪处当差，依着旧簿一笔笔理齐。点灯那夜，上臈接过去翻到末页，瞧见我在最末添了父亲的名讳，半句也没说，只教人多点一盏灯。那本清册打这以后便留在了局里，往后的见习皆照着它点灯。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_patron_1556:event:prepare","text"],null]']
src = "blake3:84c24880c27941a8aafdc0b146b99c1b9ec3cc2242eb0841d0b2ca3efa08bc4f"
text = "先将亡故者的名录誊清"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1554:event:catch_up","reply"],null]']
src = "blake3:44734e6928e312f46d7557f464fcf9a941b5274c8e6bfff5f45186cf8471a14d"
text = "头一课便是学跪坐。我在土佐向来是盘腿坐在船板上长大的，尚未熬过一炷香，双腿便麻木得起不了身，挨了罚在长廊下加跪半个时辰。入夜后我躲在屏风后头继续练，跪一阵，揉搓一阵，再接下去跪。汐在旁端详了半晌：“姬君这是在同谁置气？”我回道，同自己的膝盖。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1554:event:catch_up","text"],null]']
src = "blake3:2296dd4008d63d24f8214856623ad50ed6943453c05e6dea1123acdb02943974"
text = "入夜后避在屏风后继续跪"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1554:event:continue","text"],null]']
src = "blake3:280f8ec1f7f31335b50f90ed5d90e807bd7b239f6bbe25bd7ea1715c57c99cc1"
text = "硬咬牙熬满这一炷香"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1554:event:prepare","reply"],null]']
src = "blake3:0e2cac6ee984efdf4f88d0d48e952df92d3d9470c260a05f93d4333d83fd8f16"
text = "早在开讲前十日，我便恳请本家的老女房指点宫中的坐姿：双膝紧并，脚背平贴席面，起身时忌讳用手撑地。开讲当日，上臈命一众新晋见习排开跪定，逐一审视过来，行至我身前却停住步子，赞道：“土佐倒也有通晓礼数之人。”午后这番话便传遍了别处的局。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1554:event:prepare","text"],null]']
src = "blake3:88257ee6ca41382ba8cd81ba63d42ff74fd8a47f472a4837f7b860870769dfbf"
text = "趁开讲前先练熟跪坐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1555:event:catch_up","reply"],null]']
src = "blake3:99ae456954f3653b61c5e2ed1bd7d09e0ab28324c3652c68a35b8604c1bb8126"
text = "整个正月我都忙着代兼定应酬登门拜年的宾客，《伊势》竟连半页也未翻动。及至开讲首日，先生刚念出“从前有个男子”，满屋子人俱能随声接下，唯独我呆坐当地。散后我找菖去借抄本，她却申明三日内须得奉还，绝不许延误一日。于是我当值时把书页平铺于膝，入夜又挑灯照录，赶在第三日黄昏物归原主。菖接过抄本，专挑页脚一页一页翻检，细细寻看可留有折痕。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1555:event:catch_up","text"],null]']
src = "blake3:24d50502052e0d22a717ddafef577c76a2f03c54b6adff53b32ad9c6bff21d0a"
text = "补习此前耽误的《伊势》首数段"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1555:event:prepare","reply"],null]']
src = "blake3:61ef193516416b90452fd6c76a53fb7ad275373a9418cc744359cd36a837d487"
text = "闻说今岁改读《伊势》，我年前便将书中地名理出一纸清册：武藏野、隅田川、八桥、龙田川。哪处是原野，哪处属河川，我都依着打堺商那儿借来的古旧舆图逐一注明。开讲当日正说至八桥，先生发问杜若花该开在何等水滨，我索性展平了图卷，连菖都忍不住俯身凑来观瞧。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1555:event:prepare","text"],null]']
src = "blake3:ee86e4d4a4876b5725b2d31b8eeac8efeca14d9290244679af0e192fb273490f"
text = "先把《伊势》里的地名标上舆图"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1556:event:catch_up","reply"],null]']
src = "blake3:9509ef7f0288b21d845074fd1a0d38f4222fccf971fea76308e84c989b943cfd"
text = "正月间房通大人的病情复重，我在本家守了半月，局中功课积欠了一摞。开讲当日，窗纸新换，一室皆是浆糊气，我顶着满手墨渍捧出熬过三宿补完的字帖呈交。上臈翻过几页，言道字较去年沉稳，转手却抽出末后两张退还，叫我重写。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1556:event:catch_up","text"],null]']
src = "blake3:577903ae49900f5ea38bdd45bb546b83d67cd8704db0b9c596b020dc34d3a893"
text = "熬三个通宵补齐正月字帖"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1556:event:continue","text"],null]']
src = "blake3:86a2e41eb94a23fdf419ff9f87cfb8927903b35559585b1696d80c8c06fa20dd"
text = "掀开《桥姬》第一页"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1556:event:prepare","reply"],null]']
src = "blake3:ef6e744205fa895b73981c35679e163c2661ba811403108519725e4080e81534"
text = "最末一年开讲，我将全年须学、须考、须交的功课按月列在厚纸上，糊在新换的窗纸旁，浆糊尚湿润。小督凑近端详半晌：“一月才三十日，你倒排进三十五日的事，米都不够吃。”嘴上这么说，转身她却借了纸，依样替自个儿拟了一张。不出数日，局内半数见习的窗畔尽糊上了如此一张。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_term_start_1556:event:prepare","text"],null]']
src = "blake3:c33536c0dfa72ffe7409d006e5b6db19aff595c5304dee5d52621a78ce84de2b"
text = "按月排妥末一年的功课"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1554:event:catch_up","reply"],null]']
src = "blake3:cffcf469333c4cd67e9220ff70d7b70337a6700ca2fc4ed6e58db714d7f26007"
text = "收簿当日，我的功课簿尚差最末半册，十月秋考往后的几场都未及抄录。我一连两宿趴在案几上，将在讲读间记下的零散纸片逐张誊入簿内，墨汁冻得凝滞发稠，便把砚台架去手炉上温着。待缴簿时我落在了最末，上臈一言不发，只执朱笔在簿面轻勾了一笔。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1554:event:catch_up","text"],null]']
src = "blake3:ddf80f76237d9590c73c06131ae11edc1cd9c943691ccec4dd14aa0a9d4afaec"
text = "连赶两夜誊清欠下的半册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1554:event:continue","text"],null]']
src = "blake3:1d906588aea4fec9e32daede98faa213b771ba012bb0f0fea31d35bc7c7310b2"
text = "将功课簿呈至上臈案前"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1554:event:prepare","reply"],null]']
src = "blake3:f9f8d08d00bac6c91cd2e454fb9091e29d70fb52c422efc38bb903723d5e6d92"
text = "早在十月，我便修书寄回土佐，请下田驶出的船带一篓鲣节进京，另抄了数首和歌，权作裹在鲣节外的包纸。年礼递进三条西大人手中，他先揭开包纸吟过和歌，随后才端详鲣节，笑言土佐的海鱼也染了京中的墨气。开春过后，别局的女房纷纷来探听，那批鲣节究竟是搭哪条船运来的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1554:event:prepare","text"],null]']
src = "blake3:bd12c9dba966ee92d6e1b2e83996c59e7d4edd7e5c092f333e3a5b25f06827f5"
text = "提早托船将年礼捎来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1555:event:catch_up","reply"],null]']
src = "blake3:783f86bc43da1184b2d56a597d34bace1a65b374710473073022825dda1e6d2a"
text = "整年作的歌散落各处：怀纸、扇面、短册背页，更有首记在兼定习字纸的边角处。我将局中箱子翻检个底朝天，独独少却严岛消息传至那晚所赋的一首。末了竟从汐的针线笸箩底寻见，她正拿它垫着剪纸样。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1555:event:catch_up","text"],null]']
src = "blake3:e2286114ec9bbce5343fc4fe864acd7e345151a8f477a02b1fa10371af26272b"
text = "挨个翻箱把歌找全"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1555:event:continue","text"],null]']
src = "blake3:2744c2609578eca5997dbf8c4a01c7a8d4448bde3b5436744da36585e971b79d"
text = "这遭一笔落定弘治元年"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1555:event:prepare","reply"],null]']
src = "blake3:e7167f7ee0ec07a61e4631d4b86ce18740a8d107649ff8f99a37e3d001bda018"
text = "我打秋间便着意积攒纸张：香铺裹香木的薄样、扇铺裁落的边角，依色泽归成一摞摞。及至誊录，春歌配淡红，夏歌衬浅绿，秋日那几首则择灰白。册子呈上去，上臈翻阅两页，遂差人送呈广桥典侍过目。待册子发还时，秋歌那几页间夹着一片红叶。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1555:event:prepare","text"],null]']
src = "blake3:3dfc630fcf42cafdfff73d5534efb668af2b5c9d70b402e1ae6127ba8dabb327"
text = "打秋起便留好录歌的纸"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1556:event:catch_up","reply"],null]']
src = "blake3:534a4ee04e1e7bf659bbe37bc894ea37a262fb264a43911a7ddd6ec32163fc9e"
text = "收簿的前夜，屋檐冰柱化去一截，水打窗隙滴入文箱，末了一册功课簿就此洇了半册，墨痕晕作一片灰。但凡还认得的字，我逐行重描清楚；认不出的，便凭记性填补——鞠场记下的拍子、宝镜寺抄的经题、代人回的那几封信。描完末页，我朝手心呵了口气，在页脚另添一行：弘治二年冬，一条澪记。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1556:event:catch_up","text"],null]']
src = "blake3:6adbde0f23d633d3543dd0bfadc8fa92008505345543eb0d11c4a84f692a6604"
text = "将水洇的簿册重描清晰"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1556:event:continue","text"],null]']
src = "blake3:1efc070cd30a6b7f46321adbd0f01739c21975db7e440506fcd26f676186e1e1"
text = "抱起簿册退到队尾"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1556:event:prepare","reply"],null]']
src = "blake3:ea6070f84c21c8f24f65db16d1a8ac6495e07c847792bb0f58b826581a9f5056"
text = "赶在冰凌垂上檐角前，我已将三年的功课簿依岁序理齐，拿汐予的麻绳穿成一束，每册书衣皆题上年份与师长名姓。缴簿那日，上臈接过掂了掂分量，当着满堂见习的面解开麻绳，一册一册唱出封皮上的年岁。念及顶上那本，她揭开端详了片刻我十三岁那会儿写的字，不由笑了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_academy_kyoto_court_year_close_1556:event:prepare","text"],null]']
src = "blake3:a8b555e12c68f93f7dce19a6054d6dc8f3967721518e64407814b8c80eac9e6f"
text = "早早将三年的册簿穿订妥当"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1553:event:make","reply"],null]']
src = "blake3:36dc026c8a042511b96fe5e83f38566130fc554d4369b9cf9cbfebd2e0190d46"
text = "摸上来七个蝾螺，我们俩嘴唇都冻紫了。阿濑见我们浑身湿透，张口就骂：“谁让你们不等我就下水的？”嘴上骂着，手却把蝾螺搁到炭火上，烤得壳里汁水滋滋响。她挑了个顶大的，拿补网锥子挑出螺肉，头一个递到我嘴边：“姬君摸上来的，姬君先尝。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1553:event:make","text"],null]']
src = "blake3:0945e57e1e11d4a452bc853e7b99cad48037d088f80d4e04771cc26d0f5c6ac0"
text = "同汐下水去摸蝾螺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1553:event:remember","reply"],null]']
src = "blake3:a345356045604ce6c141dcb8fcf467527ebef03d5edb85208935e4679dd316cd"
text = "我没沾水，抱膝坐在一旁看她补网。梭子穿过去、勒紧、再穿过去，一个网眼喘一口气。我翻过木札，拿假名在背面记：阿濑四十一岁，半日补了一百二十个网眼，其间停手揉过两回右肩。她斜眼瞥过来：“记这些做什么？”我说记账。她鼻子里嗤了一声，倒也没撵我走。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1553:event:remember","text"],null]']
src = "blake3:51ee1af17b2e86f4b335472824d7aa83716665932f158ca00b03178ccef3446d"
text = "留栈桥上看她补网"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1554:event:make","reply"],null]']
src = "blake3:a030a46cca6c778644edfc92347921117c3eda6ff182dc7cc766ea469f8b88a8"
text = "我拉着汐走了半晌到嵯峨，拣了块巴掌大的青灰细砥石，磨起刀来刃口不起毛边。用油纸裹足三层，托盐船带去。五月初回信抵达，母亲落笔，话是阿濑的：“刀快手就懒。你们俩攒的钱，下回别这么乱花。”末尾母亲又附了一行小字：那块砥石，她收在枕边了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1554:event:make","text"],null]']
src = "blake3:5d6ba25d99db87b1ccb1c411c01ff290876eeb2a47899b57bf0b0fe9eb5fea62"
text = "到嵯峨选块好砥石"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1554:event:remember","reply"],null]']
src = "blake3:9fe8f60bfcb3e17bfaf71426d0ee37e899894f0d9fbdc83ab304f6d835de6be2"
text = "挑物件我不内行，算潮却拿手。屈指一算，下田河口眼下正该落潮，阿濑多半挽起袖子露着胳膊肘，蹲在沙洲上挖蛤呢。我拿假名把这句记进日记，又在旁侧勾出一道弯曲的河口。汐探头来看，指着那片沙洲嫌我画小了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1554:event:remember","text"],null]']
src = "blake3:0179a78d5048d06f11e1218d913f28900f919c85dccf1012fdd295319007c4a0"
text = "算算下田这会儿的潮"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1555:event:make","reply"],null]']
src = "blake3:d6fd5e9ab550ede128aa2b30efedc098751252c1aed8f6a9ce7e4c8c46092ec8"
text = "宫中冬日里人人怀揣温石。我拣出一块扁圆的，和汐找来局里裁剩的旧绢缝成布套，针脚走斜的是我手艺，细密扎实的归汐。回信中我单写了一句：清晨下水前，先揣进右怀里。五月盐船返航，带回阿濑的话：“正揣着呢。姬君的针脚，还是一样歪。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1555:event:make","text"],null]']
src = "blake3:3d24355b6dd5ca977499ba8e0bdb813eabfb52928ec41dce03178e5776ba0597"
text = "给温石缝只布套"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1555:event:remember","reply"],null]']
src = "blake3:28b194db402f77a4d0582f5fabd45f919f73f8b68c7f73be4d019fa4ec60722f"
text = "把海苔凑近鼻尖一嗅，便是下田河口落潮时的咸腥气，里头还裹着芦苇根的泥味。在宫里嗅了一整年香木，霎时被这一缕味儿扯回河口去。我在日记里写下半首歌，下句怎么也接不上，干脆夹进一片海苔在页间，权当了下句。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1555:event:remember","text"],null]']
src = "blake3:8f569bad41be6692b1d76998a41483a4f8e40dc6186b0720d09f64727fce795a"
text = "嗅着海苔念起河口"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1556:event:make","reply"],null]']
src = "blake3:ce55d5082ea61c2d593e5d622f0e5be1eb6937397dd8ba9afd4a05b5fa9bc455"
text = "我领着汐去三条的梳铺，央老匠人取黄杨木削一把网梭。老师傅平生未曾做过这物事，依着汐手指比划的样式，一连削废两把，直到第三把方才妥帖，梭背打磨得如同梳背般光润。四月底盐船捎回阿濑的口信：“新梭轻巧，手倒不酸了，偏生太滑溜，我又缠了圈麻绳。”汐听完笑出声，眼眶却红了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1556:event:make","text"],null]']
src = "blake3:e1270a9f53690b2b47356635266c90f8e6ce71de5d22c333f14e1cb6decd46ab"
text = "请梳匠削把黄杨网梭"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1556:event:remember","reply"],null]']
src = "blake3:d5379b4993a25a71b86b8c0b760695103be496a1a4149cf2bbbc2918c3e09482"
text = "当晚，汐倚着柱子讲起她娘早年在能岛随船队赶潮的旧事：自这条船纵身跃上另一条船，手从不搭船舷；有回跌落海中，刚一露头，竟先将手里攥的那捆缆绳高举过顶。这般事迹阿濑从未同我提起。我在日记上逐句誊记，写到“缆绳举过头顶”处，自个儿先笑了，汐见状也跟着笑起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_ase_1556:event:remember","text"],null]']
src = "blake3:9d6e56c8e5671b83e57945d39ff9e99c55b6e2e03d25040560c8f9987d195041"
text = "听汐说起她娘年轻那会儿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1553:event:make","reply"],null]']
src = "blake3:43f7d81aee785ff809bebcb5581ca69ca96f156366d6810f730da33dec6aac0a"
text = "到了第三日雨方歇，江水仍旧浑浊。不等阿濑应允，我便自行解了缆绳，一桨接一桨地划出沙洲之外。外头风浪远胜我料想，船首一连被拍偏三回，我都狠咬牙关掰了回来。及至返航，阿濑立在栈桥上，面色铁青得堪比锅底，数落了我整整一顿饭的工夫，骂完却把烤剩的鲷鱼头塞进我手里：“明儿个，我坐船尾。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1553:event:make","text"],null]']
src = "blake3:d4f3b26108a95653c7edced1e1b1626dba919e6afbf864c0e1d50978983e90dd"
text = "候雨歇，独自划出河口"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1553:event:remember","reply"],null]']
src = "blake3:89a77d1f63a53aeaa5e72615ad8603fec8b00f35e89d4866e0c960b22e93952a"
text = "我向母亲借来怀纸给兼定复信，冥思苦想了一整宿，凑成一首歌：下田的雨水汇入长河，河水奔涌进大海，海水早晚有朝一日涨到京都门前。母亲过目后，指点说第四句直白了些。我偏没改。阿濑凑过来问写的啥，我高声念与她听，她听罢直说不懂，嘴里还抱怨鱼都烤糊了，全怨我念叨得太久。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1553:event:remember","text"],null]']
src = "blake3:86d0211df30256dec1fef74cf047305873bfb11bd09d3c836d88527804f4f823"
text = "写一首歌回复弟弟"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1554:event:make","reply"],null]']
src = "blake3:1dd2da396318a327bb17aef41e137df1d1f45ada520bc7ed087749f448ecb0d8"
text = "我将那幅习字压进砚台底，冲着它暗自起誓：十四岁这一年，宫中歌会上的每一首，绝不落于大炊御门家下风。汐在一侧嚼着荷叶裹的鱼皮，打趣说姬君又同砚台置气了。那晚我掌灯抄录《古今集》，直抄到头遍鸡啼，中指侧磨出了一道深墨印。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1554:event:make","text"],null]']
src = "blake3:46a272a02af3ebd817f3568bc23b0e318219d698d1ef838cfda3d06a34dd3167"
text = "冲着砚台立下誓言"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1554:event:remember","reply"],null]']
src = "blake3:e0b2d357abc77c645262010fde105453d6dde72fbeecf709be229c7d2af65a23"
text = "我将荷叶冲净阴干，平整夹入日记本，叶脉纹理间尚隐约泛着鱼油的光泽。一旁记下：十四岁，京都，梅雨，汐烤的鱼咸了些，兼定写的“姊”字缺了一横。落笔后念与汐听，她顿时臊红脸辩称，盐是厨下撒的，怨不得她。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1554:event:remember","text"],null]']
src = "blake3:4cf2a8ea23962360bf62f49f14595c19bc4a503b3eb112f03dde20b733d61876"
text = "将荷叶夹进日记中"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1555:event:make","reply"],null]']
src = "blake3:621f818c42433bd4d88e9e5fdc8c32ec4df82337284cb392f501a30950626cf8"
text = "我攥紧短册径直寻去她的局中，说道：既改得精妙，不如再切磋一首，由你拟题。雪怔了半拍，口中应着“还好”，耳根却直红到鬓边。她出题“夏草”，我叼着笔杆苦思至暮色四合，写毕交去，这回她仅勾去一字。回程路上，汐瞧着我的步态，说活像刚要去寻人打架。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1555:event:make","text"],null]']
src = "blake3:a089c9c5ac137edd94e54a51261f92e9c7505f19d4ec9b33efa98f9b17e09312"
text = "持短册寻她再斗一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1555:event:remember","reply"],null]']
src = "blake3:c46c09441076e9f47f3897deca2ca647427df68f8b325dbe5fe7d918f9a1ff15"
text = "我终究没去寻她。入夜后在灯前摊开短册，逐字细辨她删去了何处：抹去的是“泪”与“空”二字，留存下来的字句，竟反倒更契合我原意。我循着默诵几回，记牢了便抄录进日记。睡在旁的汐翻了个身，含糊嘟囔道姬君念叨了整宿，害她梦中满眼都是“泪”和“空”。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1555:event:remember","text"],null]']
src = "blake3:4a06b7e38194dc022ba6b25881b213901c5c32aa2babb6e2df57006f29784c07"
text = "熟背她改过的那首歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1556:event:make","reply"],null]']
src = "blake3:eca18d9d35a31a50c41dcd7ccf5ddb6ab2383b023e920b467dcde7f5ea9b3966"
text = "我回过身去，冲老女房道：若有提亲的登门，烦他去下田河口寻我，我在船上。她捏着的梳子掉到榻上，半晌才弯腰拾起，埋怨一条家的姬君如何说得出这种话。我径自将长发拢至脑后，抽根细绳狠狠束紧，直勒得头皮隐隐作痛。门外汐轻轻咳嗽了一声，尾音拖得有些长。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1556:event:make","text"],null]']
src = "blake3:686b4cdb0a19c7d4abe0020e606892180822404e151c7bfa26d2f7477d170ca2"
text = "告与老女房我要出海"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1556:event:remember","reply"],null]']
src = "blake3:1813c6935e9fcc7b44128727e5cead88899353427825c68f8c23a813cc25dc5e"
text = "老女房的言辞我一概未搭理。临近傍晚，我拉着汐怀揣鲣节偷溜上后院廊顶，取小刀逐片削着嚼，双目直往南望。京都城中望不见海面，眼里唯有一重接一重的屋脊。汐估摸着说，下田眼下正涨潮呢。我将削出来的薄片排在瓦上，凑出河口的轮廓，她端详片刻，又说我把沙洲摆小了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_1556:event:remember","text"],null]']
src = "blake3:fb7ce8d91941469f57615650d23b7aaf91bfc23e36ce41539f7eb5d8d2763672"
text = "同汐爬上廊顶分吃鲣节"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1553:event:make","reply"],null]']
src = "blake3:4e3abd77e1fdbcf9d32fbd33cf4cd8000f24bb9b70254995b62800c324b53bec"
text = "我没敢提生辰二字，只蹲身在侧，将账页逐一移至窗下通风处，照着年月理齐。母亲望了我片刻，抽出一张递来：“这一页上的数目，你念与我听。”中间我念岔一处，她并不作声，只以笔尖轻点一下。傍晚时分，她从经箱底层摸出块香木，削了指甲屑大小一薄片，熏进我袖笼里：“府内的沉香，当年出嫁带来的。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1553:event:make","text"],null]']
src = "blake3:473daeb0cfa49ff9404e59eb37cc962026c10f4abbf210869d908a1f4fcbd5aa"
text = "帮她逐张把账页摊晾干"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1553:event:remember","reply"],null]']
src = "blake3:ce44f50855441dc2be2b4f5c3c147fceea5982274a4566e6a610431612dd4354"
text = "整个下午我都坐在门槛上，耳边是雨声，也是她的念珠声。她核账时一珠算作一笔，若差了一文钱，念珠便倒转回去重拨。雨势渐急，她搁下笔，望着院中紫阳花，轻声吟出半首歌的上句，却没再接下去。那半句我牢牢记下了，入夜后在日记里试着替她续写，一连改了三遍，总觉着不像她的手笔。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1553:event:remember","text"],null]']
src = "blake3:23b398bcdb8750cef1451cd2f094f0492a624da66a2a500e3f951cd8fd33ba9a"
text = "坐门槛旁听她拨念珠"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1554:event:make","reply"],null]']
src = "blake3:297ccae091b45f0b75f4faa77114ea46f2983fc549ec5938cd5d64fce7d97659"
text = "我替典侍抄了三日日记草稿，方才换得指甲大小的一片伽罗，用薄样纸裹妥，纸上附写一首歌，言及京都落雨也是这般气息。七月末母亲回信寄达，言辞一如既往地温和含蓄，独独末行写道：那片香实在舍不得焚，拿怀纸包严实压在佛前香炉底，每日早课前总要先嗅上一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1554:event:make","text"],null]']
src = "blake3:465ae14fab70f973a94f66cc054751cdee2001b1ee56311410bf6f14a8cd7e0a"
text = "讨一薄片伽罗捎给母亲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1554:event:remember","reply"],null]']
src = "blake3:3aa4fbf9014f4be7143c3702812cf4134034da718cd76f1bac8340baf1c49485"
text = "深夜局里众人都歇下后，我讨来一片最廉价的沉香，搁在云母片上炙熏。轻烟袅袅升起，正是母亲袖口沾着的那缕气息，里头还混着中村御所屋檐下的潮味。我合眼揣度她此刻拨到第几颗念珠，正想着，香已燃成灰。日记本上单写了一行：母亲三十四岁，京都落了一整日的雨。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1554:event:remember","text"],null]']
src = "blake3:cf9ba3814c85d65252896cf1efe9b7f06da8eb7befd218f95c4a268453067223"
text = "独自点一片沉香"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1555:event:make","reply"],null]']
src = "blake3:63a6656f74e824b816eef6cdab4dce20c1fd291f20b44ad15b4e296abdb9a955"
text = "我把这半年歌会所作的歌逐首誊录下来，胜过的列在前头，败阵的排在末后，败的几首旁侧，又批注上大炊御门家赢过我的那首。通共十九首，输掉七首。六月底交由盐船带走。母亲来信说，败阵的那几首反倒最合她心意，已誊在粮账末页，每算罢一笔账，总要先念上一首。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1555:event:make","text"],null]']
src = "blake3:bb8a86e3feb2a3dbab669388b4f3cfe948ffaa348510cea2c1c1e2a2866aea40"
text = "将今年的歌抄成一册寄去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1555:event:remember","reply"],null]']
src = "blake3:a2727f6b95633b1b050aed9a4a424512835bf10258fe18bfbd8f90a3faef57b2"
text = "我搁下信笺，取过局里那面铜镜。镜面颇有些磨花，映出的人影肤色晒得发黑，眉眼较去年更显利害。阿濑老说我的眉形随父亲，往日我总不肯信，对着镜子端详了半晌，仍瞧不出究竟像在何处，倒看出脸庞比去年长开了几分。晚间在日记里记下一笔：母亲三十五，在土佐照南蛮镜；我在京都照铜镜。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1555:event:remember","text"],null]']
src = "blake3:d51f615f0aea49857ed99fd86e1f4d85654c1c47cff60ca3998ad4133fe88eea"
text = "对铜镜打量片刻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1556:event:make","reply"],null]']
src = "blake3:b20114ae7b6e594dafc6330b0a2a6019c88ed0f529943143d3694ee8bf762af7"
text = "我顺手接了他的下句：开了也罢，没开也罢，待船靠岸，京里的人回去瞧。兼定挑剔我这下句太冗长，偏又指不出长在何处。姊弟俩一大一小的字迹，局促地挤在同张怀纸上。七月母亲回信，仅仅一行：藤花已谢，叶色犹青，候着你们二人。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1556:event:make","text"],null]']
src = "blake3:a5a63c9a455937b31e8875da509ece778ea6e564e82036453d6b1b532e7770a6"
text = "帮弟弟续完下句"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1556:event:remember","reply"],null]']
src = "blake3:b25479c103999262cadf0c5c45afd7dbea4a96779f8ddfbf7e00a4599a13f170"
text = "我没替他续，反将笔塞回他掌心：自个儿写完。他伏在榻上写完又撕、撕了再写，直熬到暮色四合才勉强拼出下句，言道藤花若未开，便候他归去再开。字虽歪斜，意境倒真切。他撕碎弃置的那几张纸，我逐张拾起抚平，压进自家日记底下。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_birthday_mio_mother_1556:event:remember","text"],null]']
src = "blake3:c6137bb4d4356c824f8ab3cee7a436d81f5d60ace2485639a1118c7500d98455"
text = "叫弟弟自己把这首写完"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_0:event:peer","reply"],null]']
src = "blake3:044181b666f9d6213afc11059316e13b9a8148b20d1dea4ad495dd0b4afe557b"
text = "我叫汐装老女房，自己当见习；她问上一句，我就拿宫里的言语对上一句。偏她把“姬君”咬成了能岛腔，我笑得接不上话，被她一扇子敲在脑门上。等对调过来由我当老女房，她回得磕磕绊绊，倒是一回顺过一回。到末了，我们俩说起话来都拖着京里的尾音，便是拌起嘴，也客客气气的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_0:event:peer","text"],null]']
src = "blake3:0caf5ff6595b3c70389e4296c4c2bfcf36f6c48c373cb3809705a1079c669090"
text = "同汐互考宫里称呼"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_0:event:revise","reply"],null]']
src = "blake3:0c56d3db7ba899a6763f8b8e68479f89d7b90c179a5ed01a61ad76e4e6888042"
text = "当夜，我将木札挨枕边排开，不看上头刻痕，单凭记性把下田河口描在纸上：何处是沙洲，大潮几寻，四万十川的水几时往海里涌。画罢翻出木札逐一比对，错了三处，连涨潮时辰都记迟了半刻。我用朱笔圈出谬误，铺纸重画了一遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_0:event:revise","text"],null]']
src = "blake3:1f03f38ca8fcb5e41ca29a1661c6f54467c4e3fc76667b8de8242df524644c83"
text = "依木札默绘下田潮势"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_1:event:peer","reply"],null]']
src = "blake3:90167be9b63aba6f21499c141f8a1592ceb399af7ca4f5f8cbf05004e053055c"
text = "小督说簿子写得好坏，先得看口齿像不像宫里人。她逐个教我女房词：豆腐唤作“白壁”，饭团叫“结”，钱字最忌直说，得称“御足”。“提钱的时候，眉眼要像在赏花。”我照着跟念，念岔一个，她便从我碟里拿走一块点心。及至雨停，她吃去了我五块点心，我倒记熟了二十来个名目。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_1:event:peer","text"],null]']
src = "blake3:d289d17284a197f9243d71047c4e23f00e0270679ed8255a6bea070b10a8782b"
text = "请小督教我女房词"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_1:event:revise","reply"],null]']
src = "blake3:6cb2acec84f63ef7b78c638ae71b687c130292e2048fa02335429770a8405b4a"
text = "我抱起簿子缩回屏风后头，伴着雨声逐笔覆算。纸实用了九十七张，账上却只录九十四张，短的三张原是替上臈抄歌时写坏的；香饼少了两块，细查才知是上月替别局代借而漏记回来。我另起一页，把借出、借入与用掉的分列三栏，月底一核，半张不差。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_1:event:revise","text"],null]']
src = "blake3:c3d9c25c28f30b2625adcae3efae6898720951bf9bd62ee674ac9de1f384e24e"
text = "将簿中数目重算一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_2:event:peer","reply"],null]']
src = "blake3:1af81eca8202d984b0aca6314a99b82b461129e383cf87eae626cf717e8eb4c6"
text = "我攥着那张歌稿去她局里，追问“不差”究好在何处。她偏不答，反诘我第三句的浪头为何朝岸上扑，不往深海退。我一条条拆解，她一条条批驳，直从傍晚争到掌灯。末了她抛下一句：“讲得倒比写得强。”也不知这算不算夸，回局一路，我脸颊一直是烫的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_2:event:peer","text"],null]']
src = "blake3:11ae219ca3a0fbe105dc1da69b394937dc6dcbb5965f9337d6c216c21bdc808f"
text = "携那首海歌去寻雪"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_2:event:revise","reply"],null]']
src = "blake3:2424cba2934aacfa1930555b44c0d3f81cec491508264d3382cca858c468bf8c"
text = "我将歌稿依月份排开，从三月读起。翻到盛夏那几首，才发觉自己兜来转去，满纸皆是土佐的浪同船；京里的物事，只写了桔梗与雨。那日傍晚我去局前小庭静坐了一个时辰，看露水一点点坠上桔梗，归来成了一首，通篇再无半个“海”字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_2:event:revise","text"],null]']
src = "blake3:ba5f1b032d3ef6790e4076d19cf4ea9e094e1de578edde6eb1a42d663a4a0e43"
text = "重读这一载歌稿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_3:event:peer","reply"],null]']
src = "blake3:363ba0a3f7e6bf7dd61bf1dad8c17758cfd4762ee4021756ef9e959eee53bef5"
text = "我把潮记推至菖面前，请她来挑。她倒真不客气：月龄跟潮时凭甚连在一处，历道原本只管吉凶。我从月轮说起，直说到河口的木桩，她驳一句，我顶一句，谁也不肯先收口。直辩到女官前来掌灯，她才把潮记推还：“满嘴乡下话，倒还算顺理。”翌晨一早，她打发侍女来借那页大潮日去瞧。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_3:event:peer","text"],null]']
src = "blake3:85314524e9b5c77578fbd05329212391cc7170a3f0c46b0ec9288625d11f645f"
text = "请菖来挑我的错处"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_3:event:revise","reply"],null]']
src = "blake3:55e58525b20c82609355bf155e064ac29737ee7db28a05082a9991417aeeed32"
text = "新历的大小月，我照着一日日往后推算。月亮过中天之后，下田还要等多久才满潮，我便依着阿濑教过的那个数屈指去算。改去三处差错，顺带把正月到三月的大潮日圈了出来。汐凑上前来瞧，说三月十五前后那一遭，河口的水能淹到船台的第二根桩。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_3:event:revise","text"],null]']
src = "blake3:32c53d70ed07d5286f7d52a73dfedcd8f4eabb607fd3c981e6a25775642806db"
text = "依新历重推潮时"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_4:event:peer","reply"],null]']
src = "blake3:8bcc618281ca1d5624e33cb36f5261c41a732425deb37515008b3c23a254353b"
text = "小督停在扇铺门前，先将米价报出，随后是纸价，半句不多。轮到我时，掌柜拿扇子掩着脸，只道记不清了。我便把交货的日期逐日念给他听，直念到三月那把双面扇，他才往柜台上拍了一记。归途中，小督说道：“你说话倒像在船上喊号子。”我答道，掌柜听见了便成。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_4:event:peer","text"],null]']
src = "blake3:624e78fc0cf82be4c3a29fc2c37ea55c5d5d209392fbaccb3539758b97c22e80"
text = "拉小督去扇铺对问"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_4:event:revise","reply"],null]']
src = "blake3:728ab5d3c795a7d45d2309981ed3604bf2d4ffd81046de7dda4abf87f99b0b35"
text = "我翻出扇铺每回交货留下的回条，一张张摊在榻上，按日期排成一串。三月那几纸里，唯独有张回条画着两个圈——原是把双面扇，扇铺多付了一升米，我却只记了一面的工钱。我在账页边补注一行，顺带立了个规矩：往后回条上画几个圈，账上便记几面。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_4:event:revise","text"],null]']
src = "blake3:1467dc88790e51238fa233079cd7502ffad36fac306576110e8f7bf0381814ce"
text = "理一遍扇铺的回条"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_5:event:peer","reply"],null]']
src = "blake3:9aa67b0c848e93b8fc52dbf1fb882363b21644074b63b69a4d591beba52b935c"
text = "听我念过两遍，雪并未说明那墨点的用意，只借过我的扇子，以指尖在扇面上虚虚写下一字，写罢合拢还我：“自己去想。”那一夜我守着空扇面琢磨了半宿，方才猜出个“晚”字。次日我拿去讲给她听，一口气说得她半句也插不上嘴。她直等我说完，才用扇骨朝歌稿上一点，恰好落在那墨点旁：“就是这里。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_5:event:peer","text"],null]']
src = "blake3:b82113cd0171806b851709b21c3e0e423176d0d43c05b53d8f7a444014eca4bd"
text = "念予雪听，讨教墨点"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_5:event:revise","reply"],null]']
src = "blake3:7012aff8645fb540a40dd14fab746c0efe2eb042afff910d04a1d4bef5aa6618"
text = "我移了个蒲团坐在小庭菊丛前，直坐到日影斜斜漫过廊柱。花瓣边已然焦黄，香气却比盛放时沉厚。我把第三句的“浪”字划去，换成降霜之前，菊花那一点不肯低头的色泽。改完低念一遍，船同潮都还在，只悄悄退去了歌的后头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_5:event:revise","text"],null]']
src = "blake3:84fd945e262716f94f88e7211a21bb813c328d6152a5149924f32e8f719fc86b"
text = "对菊丛重改第三句"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_6:event:peer","reply"],null]']
src = "blake3:44760dc0f4ff88babc331b43a60b29765949f8d58531224831c52c25e757d405"
text = "鞠千代前来送鞠庭的年礼，我拦住他，请他解我的结。他猛拽三回未能扯开，面颊先涨红了。我遂一面比画一面讲清：哪一圈吃力，哪一头一抽即松。起初讲急了他听不懂，我只得放慢语速，逐句来。第四回他一抽，结散了，他抬起头，结结巴巴道：“好、好似鞠落在脚背上，一下便停住了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_6:event:peer","text"],null]']
src = "blake3:339be385b9d33005fa0816bb83666e93cfec81bbabbcdde0989bfa9287b494e7"
text = "邀鞠千代试解这绳扣"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_6:event:revise","reply"],null]']
src = "blake3:be973e802e53ea10b4603717f136181fb1e11e74dad0f7e17d2a890dc31a2952"
text = "待局内众人睡下，我拆下一截旧帘绳，借着灯火一遍遍演练：拴船用的、吊水桶用的、即便遇了浪亦能拽开的。每打一个，便拿脚踩住狠命扯，扯散了便拆开重打。练至后半夜，十指冻得通红，绳结倒一回比一回吃得住力。天亮前，我将那箱几帐重行捆紧，结头朝外，谁来解皆是一抽就开。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_6:event:revise","text"],null]']
src = "blake3:2ca739d52b278f1e0d7d869fe694d9bb98a9ad85bfb017e8ef911603d480a5a3"
text = "夜间取帘绳重习绳结"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_7:event:peer","reply"],null]']
src = "blake3:5bcb969f3b6e9b1470849d42bada6c266998c08ee9e771174e7d90b383a46414"
text = "汐将手巾往头上一搭，效仿堺商人口吻，张口便压去三成。我搬出盐价、潮期兼船上水粮，逐条与她分辩。她不肯让，我也不肯让，屏风那边有人咳嗽了两回。讲到第五个来回，她一把扯下手巾：“行，这价我认了。”复压低声补道：“姬君讲价时，眼睛比歌会上还亮。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_7:event:peer","text"],null]']
src = "blake3:9aaa95731f640934daac654fa072f391fcc676ab106b28eaa8273eeffe3496b1"
text = "教汐装作堺商人杀价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_7:event:revise","reply"],null]']
src = "blake3:8d3779f9833418484ab67f1d66d1eb4fbfbc694a3060746ed74e06ba6ff64abc"
text = "我裁妥一幅长纸，竖着划出格子：首栏货名，次栏堺价，三栏土佐价，末栏留空，专留给自己想卖的价。铁那格亦先空置，侧旁注一句“问船头”。排到半夜，盐与米一涨一落，恰如两股潮错开。我执扇骨顺那两行一比划，心里先记下来年头一船该装何物。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_calendar_review_7:event:revise","text"],null]']
src = "blake3:79b605df4adf13e4a9f92b7f52dac8fc27997b9c97e8cc4d5129a5d3ebe8dd98"
text = "将两载行情并录作一表"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_failure:event:check","reply"],null]']
src = "blake3:4e74d714e98416bee07e5e9c595f60eedc45ce44e25719935fa10c05aa957ad2"
text = "那一宿我将白天做错的几宗挨个重理，绳结散开重打，怀纸展了再折，回禀的言辞对着灯火反复诵了十数遍，念到舌尖半点土佐腔调都不剩。汐倚着门框打盹，叫我生生念醒了两遭。天色破晓，老女房仅瞥过一眼，没夸好，也没再叫我重来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_failure:event:check","text"],null]']
src = "blake3:edb13f157f97b801a9173878a16c2f9c0166842820ae81c0ed541b01e9af855c"
text = "跪坐灯下重头再做一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_failure:event:help","reply"],null]']
src = "blake3:8d4aea18beb67c4d6b702477218588aacdd52752d7cbbb0a1c0bda1e7e6175f0"
text = "老女房长叹一声，终究将我唤至身畔。绳结当绕几圈、怀纸折角朝向何方、向典侍禀话该先垂首抑或先张口，她逐件做给我瞧，连是哪一代哪位上臈定下的规矩都报得上来。我取怀纸密密录满一面，她眼风扫着了，道：“字写得倒还像样。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_failure:event:help","text"],null]']
src = "blake3:cb1590976971284703b674cd5bc3c91863b12d67a41b119b5ed25cc8078f8817"
text = "恳请老女房逐件点拨指正"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_success:event:check","reply"],null]']
src = "blake3:72b710a4fdd544b1e991f9575bfb82f76aaff7b8a75aa7cc8a94263c66f14a48"
text = "我掩严局门，将白昼里每一步礼数再走一遍：迈门槛先跨哪只脚，落膝时袴褶如何拢齐，呈物之际袖口须遮住手腕几许。练至第三回，膝头倒不觉疼了，起身亦稳当不晃。菖恰好自门外廊下走过，步履略缓了半拍，随即便行过去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_success:event:check","text"],null]']
src = "blake3:19d8ac7bf8bf0f9d5b40a8fea64efe28f41fb09e9bb4d6b0d810133e76532620"
text = "回局将今日礼仪复演一回"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_success:event:help","reply"],null]']
src = "blake3:4642a8e7afa6703dbbc671b9bf812582ef6e3928f1eb228eeb11d112b1646f74"
text = "老女房扬眉望我：“全无错处的倒也来问？”话虽如此，她终究开了口：今日那来使出身武家，依规矩只配在中门外候传，我却将人请进了廊下，旁人未加挑剔，全赖那位上臈今日心情舒畅。临了她又点明三条武家使者的旧规，我回屋默录了两遍，妥帖压进砚箱底。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_court_duty_success:event:help","text"],null]']
src = "blake3:21caced05f5b8456f6c4715e3702b063fc5ef74dd673c32df7eec89139339d06"
text = "向老女房讨教尚欠何处"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:chidori","hint"],null]']
src = "blake3:683444547bd891cc233155b553e9b8ae6f04f51ac0622599971772b25bd11322"
text = "你跟千鸟还谈不上熟络。二月寒水刺骨，她没必要为你下海。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:chidori","reply"],null]']
src = "blake3:9aed548226de45f6c9e26f79d5375980be7584378d64af1c042baf23ff2d4088"
text = "千鸟听了，半句废话没有，褪下外衫便扎进了水里。二月间的海水冻得刺骨，她在沙洲一带时沉时浮，每露一回头，便打一声口哨，顺手往一处指点。我依着她指的方向在船首插竹竿标路，竹竿一路连成一条线，船便顺着这道线出了河口。等她爬上岸，嘴唇已冻得发紫，阿濑随手将自己的蓑衣抛了过去。日后河口一带的人提及这档事，个个都夸阿德家的丫头探水比大人还灵光，至于当时谁在掌舵，早没几个放在心上了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:chidori","text"],null]']
src = "blake3:5b47bc236c8d51db004b8d4ee502e1b82111b5902cf860ee40f1aa4b8712a187"
text = "请千鸟潜入水底探沙脊"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:steer","reply"],null]']
src = "blake3:cebda3361e2e8d6d9f155f4c150f4288e79f62400451f12c77a671643bcde3e3"
text = "我一把攥住舵柄，喊水夫将桧板全搬到船尾去，好叫船首抬起来。船底蹭过沙洲发出“沙沙”一声轻响，我顺势将舵向左一扳，贴着那条最深的水道溜了出去。阿濑立在船首一言不发，直到上了岸才开口：“手倒是稳，就是脸色发白。”不出几日，中村的政所上下都在传，下田出了位替人掌船的姬君。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:steer","text"],null]']
src = "blake3:8a506bf2c67989c9c7e11abd683d8481ec429c9f447a1188c2ca2c8ff08da04d"
text = "我亲自掌舵过沙洲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:wait","reply"],null]']
src = "blake3:67596b58af36db2a1c6c772d213fca5d80b9e65613048b61327229051b263245"
text = "我定下等大潮。这五日当中，我每日早晚两趟去沙洲旁瞧水势，眼看着潮水一日高过一日。及至第五天起船，船底连沙粒都未曾擦到。谁料西风才吹了三天便变了向，船进了纪伊水道，逆着风硬是熬了半月之久。后来兼定寄信来说，春衣送抵时，庭院里的梅花早已落尽，他还是套着去年的旧衣裳过的节。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_00:event:wait","text"],null]']
src = "blake3:a9d236c9a30f0742110d26bfc1cf84cfa04c4a55f0a6a3130c20da52af61333e"
text = "等五天后的大潮，稳妥出港"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:mother","reply"],null]']
src = "blake3:c6a89065ea7f4bc572c7dd73cd319dab644687833470164841fb255a6c43af09"
text = "我才数到半途便糊涂了，无奈只得跑去求母亲。母亲听罢原委，转了一圈念珠，自衣箱最底层取了三贯钱交付那管账人。阿濑抱回空箱子，一言未发。入夜后，我听见她在灶间同汐说：“欠夫人的，我还。”打那以后一整年里，她月月都往母亲的账箱上放几十文钱，母亲推拒不拿，她便径直搁在箱盖上。至于那三贯二百文究竟缺在哪一笔，再没人去深究。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:mother","text"],null]']
src = "blake3:d77b1df1626ef50dd0fb66faa0720dd14a0fdb3314e40b0dd1bc648c8f238918"
text = "去央母亲代阿濑垫上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:recount","reply"],null]']
src = "blake3:aab67089ad63f4d75ade51364e2fc315a0cd269fd6689e0fb65ec8c7b98865b3"
text = "四十余根木札，我依着船名摊开，逐根核对铜钱。查到第二十七根时，找出缘由了：冬月靠岸的那艘萨摩船交的是米，并非现钱，木札上刻着米的记号，钱箱内自然空着这一宗。三贯二百文，分毫不错。管账汉子默默拾回算筹，嘴里嘀咕了一句“姬君算得比我快”。阿濑背过身去修补渔网，耳根子却泛了红。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:recount","text"],null]']
src = "blake3:c81b80d9b3c8bbe30af409974417bbfec59eb48ad0430ef81437841b0952d2d3"
text = "将木札逐根重算一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:ushio","hint"],null]']
src = "blake3:f5163b68a3de6dbd761f278a508762e03aac25cb921acd206ac87807f9661246"
text = "汐缩在门后不愿露面。她同你尚不熟络，还不到肯为你帮腔的份上。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:ushio","reply"],null]']
src = "blake3:f099bc4b4614d791930cd9dca4710d1c541e453b54812db6dc969c0003cd70a6"
text = "我从门后把汐拉了出来，问她冬月里那艘萨摩船交了什么。她寻思片刻，眼睛一下子亮了：“是米！三袋米，我同我娘一道扛进仓去的，我肩上这会儿还留着印痕呢。”我们提着灯笼去到仓里，只见三袋米齐整整码在墙角，袋口缝着萨摩的记号。管账的汉子盯着米瞧了半晌，又望了望汐，将算筹拢了回去：“阿濑家的丫头，记性倒比账还准。”汐绷着脸不作声，直等他走远，这才抱住我蹦了起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_01:event:ushio","text"],null]']
src = "blake3:56749b5f9daf851aca9ce2483a99cef45753a1f68cc3245138504f92ae334300"
text = "问问汐：冬月那条萨摩船交了什么"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:calm","reply"],null]']
src = "blake3:d432a183cb3c434896f1efa8b1f2cdc855ae1cdddf51074efb8aee4cdab1816e"
text = "第四趟我闭紧双眼下潜，不再去计较几寻。海水一重深似一重地寒，寒透了某一层时，耳畔只听得见胸口搏动，愈发迟缓，再迟缓些。指尖触及岩石那瞬，我险些忘却还得浮回水面。将撬下的鲍鱼抛至阿濑足下，她斜眼一瞟：“个头太小。”入夜后她却烤熟了，完整地递给了我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:calm","text"],null]']
src = "blake3:36e91a92a9ae1155e79e5ceb6aed5dfada6f14b4690609cfd042b7fba0c033a6"
text = "闭紧眼睛，不再去数寻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:rope","reply"],null]']
src = "blake3:57f590b7da7179d4bb6f068dfdd8d045c8589b0f18c27c231479807ecada9e2f"
text = "我央求阿濑携我下潜。她取麻绳系在自己腰际，另一端套牢我手腕，径直将我扯到七寻深处的岩块旁。鲍鱼也是她撬下塞进我掌心的。等爬上岸，那帮渔家孩子哄笑我是个须得乳母牵引的姬君。我将鲍鱼退给阿濑，扬言下趟定要亲自去摸。她顺手把鲍鱼烤熟，独自嚼了个干净，半口也没留给我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:rope","text"],null]']
src = "blake3:7d613e018098c3dc2433ee2357a94ee20f273e7aff8c565aa1a3761cfad3111e"
text = "央阿濑拉着我一块潜下去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:shell","hint"],null]']
src = "blake3:dd71c96a5ac062c374c45508794bf3d4cb6e3aa381c66e9d926dadef244fbb0b"
text = "海女向来不领外人入水，除非你身上佩戴着她们所赠的信物。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:shell","reply"],null]']
src = "blake3:ad0e9b5517d91dc2cb4af8cd630c595688a3ac2084faf6fcb827773d077a4a2f"
text = "阿德婆婆瞧见我颈间挂的那枚鲍壳，半句多话也没问，径直唤千鸟带我下海。千鸟教导我出水时先吹一记长哨，待胸中积存的那口浊气吐尽，方才徐徐吸气。她握着我的手一并下沉，越过四寻、五寻，临到六寻处，她撤开手，朝深处指了一指，身子便定在原处不再往下。最末这一寻，是我独自探下去的。待我手攥鲍鱼浮出水来，她早已守在波面上，迎着我吹了声口哨，拖得比我还要长。往后阿德婆婆见人就夸，中村御所里出身的姬君，正是她家丫头领进海里的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_02:event:shell","text"],null]']
src = "blake3:2c5f1b764ca06f21baf370965f3bd90fb21224fbbd0174a91149580ed0263564"
text = "戴上千鸟赠的鲍壳去找她"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:boat_seat","reply"],null]']
src = "blake3:b9792a42b1f3d79c4431f164d6a4af53af461698435562ea0f72aebf90af0054"
text = "那块黑石头我终究没去闯，转头同阿濑说，先借旁人的船坐着，学熟了再自己动桨。阿濑斜睇我一眼，似是没料到我会这般回话：“既搭渔家的船，船主叫你作甚，你便作甚。”风声传开，渔家小子们碰见我便故意缩起脖子打趣，笑姬君畏水。话虽如此，竞渡当日我好歹是坐在船上的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:boat_seat","text"],null]']
src = "blake3:4a258674e2dc6066e2dc7e89ce42bd53ed26b5a308f50ac2387c3ebd5f4ee913"
text = "先求阿濑向渔家讨个船位"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:row","reply"],null]']
src = "blake3:ef64ac02dd843bcd6cea2e0c15f2a906b400ed211e7dc407562c22ca71ef1b9a"
text = "我将桨柄握短，桨叶深插进水里，一记一记朝斜上游划去，船头总对着黑石头上游那一面。待挨到石边，掌心已磨破了两处；回程顺着水势，走得倒是快。靠岸后，我拿漂木比着量过，船往下游只偏了半个船身。阿濑瞧见我手上的血泡，只吐出一个字：“丑。”便转身寻渔家去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:row","text"],null]']
src = "blake3:fd2c58d64fe204477912911fc648b5a2529d66ed3435471b27758d522513a3de"
text = "迎着退潮硬划过去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:ushio","hint"],null]']
src = "blake3:4d1d3b7ab39b612b4b4e91f01bb032a8152fc1e27910a429fd5025879426e6b8"
text = "汐躲在网棚下削船桨，任你唤她，只作未闻。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:ushio","reply"],null]']
src = "blake3:464749accce3f097971fa312186c3e413f2e23d6d968a14d90bd3eaa44992d5d"
text = "汐一听说，丢开刨子便跳上了船：“娘只交代不许叫水冲下去，又没说只准一个人划。”阿濑在岸上骂了一声，终归没拦。我们一前一后下桨，汐的桨吃水深，我便紧顺着她的劲头走，船头一径对着黑石头的上水。挨近石头时，汐伸手拍了一记石面，回脸冲我笑。靠岸之后，阿濑瞧瞧汐，又看看我，末了还是去寻了渔家。入夜后汐说：“竞渡那天你坐渔家的船，上头没我的座儿。你自己划，划得像今天这般便成了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_03:event:ushio","text"],null]']
src = "blake3:585105e747f3e514ac39316306bce45c00cda473bafbfcdb261bd55a47e55870"
text = "叫汐在前头领桨，两人合力划"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:abalone","hint"],null]']
src = "blake3:1d6e0ebfe9c2c0d1e1ad4064e3a8a81e1269489a5d3bed3c65cf31ca1cd3b1f2"
text = "海女屋里的干鲍，向来只肯托付给替她们同堺商议过价的人。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:abalone","reply"],null]']
src = "blake3:b55c2339162832e4618b2ba32100a903d021c92f8795b390523d1131cfdde311"
text = "我径直寻到阿德婆婆。矮屋房梁上悬着一溜晒透的干鲍，乌黑坚硬，宛如一串串陈旧皮带。婆婆听罢来意，唤千鸟攀高悉数摘下。堺商一见便眯起双目：京里年节送礼，此物可是按条论价的。我报出的价码较他去岁收购时高出三成，他咬牙盘算良久，到底点头吃下了。本家所需款项凑足，母亲的伽罗完好留在木匣中。余下的钱银我分文不差交予阿德婆婆，千鸟反复清点了三遭。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:abalone","text"],null]']
src = "blake3:22298ed789f16428e7ce43aae5899358e7814bd49952731d5f7140f2cefd658a"
text = "恳请千鸟家取出积攒的干鲍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:ase_sell","reply"],null]']
src = "blake3:4d86cfff26aca92f41a0c39762e448af974a66fe7cd81f96fe173cb78650a6e6"
text = "我与堺商刚搭两句话便慌了神，叫他一句“姬君懂香吗”堵得哑口无言。多亏阿濑替我接住话茬，总算勉强抬了些价钱，只是伽罗仍旧出了手。母亲点收钱款，轻手合拢已空的桐木匣，言道此物本就该在紧要处派上用场。那空匣子她并未弃置，一直摆在经箱侧畔。隔日，下田便传开了风声，说一条家的夫人开始变卖家当了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:ase_sell","text"],null]']
src = "blake3:136840537274176e100420d30125f89e4af09bb63d4be6f38dd814fefdc7125f"
text = "央请阿濑出面同堺商议价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:bonito","reply"],null]']
src = "blake3:c6aa632549d1e4400af71491dea1adeb4b2dd9e6aa1ed2a50c54534c4b652d47"
text = "我将下田、中村与堺三地的市价并排誊于纸面：伽罗一旦脱手便难复得；反观幡多今岁鲣鱼丰获，鲣节在下田价贱，运至堺却能翻上一倍有余。我借来母亲的念珠充作算珠，一粒一粒拨给她细看。母亲听罢，阖上桐木匣推返衣箱深处，随即便差阿濑赴渔家采买鲣节。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_04:event:bonito","text"],null]']
src = "blake3:95554eb2da8b6f108ebec221c9d0ec40518b2e9c8c2c731182cd429a1e860d65"
text = "另算一笔账：出鲣节，保香木"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:miotsukushi","hint"],null]']
src = "blake3:be6e23914387aeedc6896250475bb898426385eb0d1ca258e66f2ba45abe9c0b"
text = "这般寒彻的夜里，总得有肯伴你在船头熬冻至天明的人。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:miotsukushi","reply"],null]']
src = "blake3:ce0f60a38f65811b2083626a11d643a1691a72436e8152f99497d6b31a6d763f"
text = "汐半句也没问，半夜便将船撑到了栈桥下。我们在河口的雾气里候到天亮，水道两侧竖着一根根引路的木桩，行船的人唤它作澪标。汐说道：“你这名字，指的正是行船的那道深水。”古歌之中，“澪标”亦可念作“竭尽此身”。回去后，我将它填进了下句：河口的澪标立于潮中，这一身也愿交予京城。母亲读罢，嘴角牵动了一下：“好大的胆子。广桥夫人会笑的。”可她一字也没让我改。待我出了门，在门外听着的汐只道手冻僵了，要我替她搓搓。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:miotsukushi","text"],null]']
src = "blake3:a0c89175165c23ec88f1f6b284b0d10b6e2c80a370ea7d391470544c982e4480"
text = "趁天未晓，唤汐摇船载我去看澪标"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:mother_edit","reply"],null]']
src = "blake3:b6b9e0c5a621af52d5a3ad02c4a9fbf1ec50bcc6e1a12ecd3c854346803a2073"
text = "我连写了七张，却张张都不称心，最后只得捧到母亲跟前。她提朱笔改动了三处，又叫我按改过的另誊一遍。等我誊完，已赶不上那班船，信迟了半个月才发出去。广桥夫人的回信客气得很，唯独在末尾带了一句：下回还请用姬君自己的字。我将那一句折好，压进了砚台底下。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:mother_edit","text"],null]']
src = "blake3:2b5cbd75aa9a13faaa8ecac28b862c601d1b9b81bf4da19e779686ba96d78e67"
text = "央请母亲代为润改"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:winter_tide","reply"],null]']
src = "blake3:1aa7c6dfdc2cbad77ef8806c754a8c8c06f52d98f3e1ab0adca8f202179c8e91"
text = "我搁下毛笔，径赴河口独立了一整晨。落潮后露出的礁石凝着薄薄盐花，白得恍若寒霜；随即涨起的潮水一寸寸将其舐净，江河与大海在浓雾里融成一色，难辨界限。返家后我便将此景写进歌里，未曾套用半个典故。母亲过目罢，将纸笺凑近鼻端轻嗅，言道墨香里裹着海风味，无须改易，径直寄出罢。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_05:event:winter_tide","text"],null]']
src = "blake3:b8053cfeb556366f465b686c74ac6f0aaf96f461f8df5ab960d9cd7cdbcb9f30"
text = "落笔写眼底冬潮"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:defer","reply"],null]']
src = "blake3:3cc2eb4e7f3472d37289a151b9be3cbe1eb934844faed0f7488589bbb45b04ba"
text = "兼定拍着胸脯去央房通大人，请本家差人下江口。我留在府里，随保子大人跟前的老女房习练跪坐与敬语，魂儿早飘去河上了，膝头跪得酸麻也硬忍着不敢挪动。本家差去的人折腾七日，方把船拉回来。灶房里的人私下议论，土佐来的姬君，到头来也不过只会干等。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:defer","text"],null]']
src = "blake3:134663be6f9a217a66913b0c09329a4c107f6d0f4db3f326f5e7d8613d2ae6b5"
text = "托兼定去请本家帮忙，我留下补课"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:growth","reply"],null]']
src = "blake3:0ddaecfd54794d326b971a6a53f37bbd1ca2eaa79468311917702388297efb6a"
text = "我搭顺流川船赶赴江口，将半舱米分倒进两条小舟，自己抓起长篙。船夫说京里的姬君撑不来，我不理会他，只拿篙试探深槽，一篙一篙将船顶过沙嘴。船靠鸟羽时，我掌心尽是血泡，兼定怀里捧着手炉，在岸上直跺脚。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:growth","text"],null]']
src = "blake3:c2b2854a9085ff9bb7c757623f57bdb9d3b6e07ba283e8795998c41afc5b9cb9"
text = "去江口，亲自撑船过浅滩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:skill","reply"],null]']
src = "blake3:b4b826799037065c3110be4b6b927918fd8c14f1648f083717b4877c5ddda401"
text = "江口距海不远，潮水涌得上来。我屈指算定月龄：腊月十五夜里恰逢大潮，水位能把船底托起尺余。我叫船夫莫硬撑，挨到那晚三更，潮头一到，船便自行浮起，一口气滑过沙嘴。船夫挠着头叹道，在这河道上撑了二十载，竟从未想过借潮水走船。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:skill","text"],null]']
src = "blake3:67d109f2c1f9e3126c6c528211626b4388b992017773e9655e3232f3f51ef3d2"
text = "等腊月十五涨大潮托船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:standing","reply"],null]']
src = "blake3:0241fdca6af68261e88cc63e29779c7145868c50f0ffd1c016bb53de7f518513"
text = "我从袖中取出离下田时阿濑给的那面旧过所旗，叫本家仆人带赴江口，插到船尾。淀川的船夫多跑过内海，都认得旗心那个“上”字，谁也不敢拦阻，江口问丸还调来两艘小舟帮手拖拽。消息传进京里，本家女房们暗地议论：土佐来的姬君，连装行李的船都要挂海贼的旗。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:event:standing","text"],null]']
src = "blake3:a069b4e9ff9171c220047b341f8bb718ca000b15f44dcd7bf6f4525a4333ca52"
text = "悬起能岛的过所旗开道"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:remedy:pay","reply"],null]']
src = "blake3:40a9696ff04ca1d518ad70841c01cb2511633e2a2238416d7c3cd67c68ded4bc"
text = "我把零钱悉数掏给鸟羽岸上的老船夫，请他捎我走一遭淀川。他的船运柴，吃水深，逢着浅滩就得停下来瞧水纹。我跟着学看水色：水面泛细皱的底下淤着沙，色泽沉暗处才是深槽。一天跑下来，连木札背面也刻满了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:remedy:pay","text"],null]']
src = "blake3:ac6355d7412c7a1773b9673e302d29250cb684e8cb5dd095aef0e07dc0e5bbdc"
text = "雇个鸟羽老船夫带我走一趟"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:remedy:work","reply"],null]']
src = "blake3:19211a3dc7b819be898887469fa3683d832917b6c3b26df73f13cebbfaed4390"
text = "我遵着木札的规矩，每日趁天未亮赶至四条河原，拿炭条在河中一块青石上划下水痕。十指冻得不听使唤，汐就怀揣手炉陪我蹲守滩头。划够十道，我也摸出门道了：鸭川朝暮水位原不一样，北山只要下一场冻雨，次日水流便要漫过前头那道炭印。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_06:remedy:work","text"],null]']
src = "blake3:c21fb00f208239056d8ac3dbe830fe57debff902121c84ebbe77eb482c5db78d"
text = "按阿濑的木札每天去一趟鸭川"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:defer","reply"],null]']
src = "blake3:33225bbf214bdae1a367ff76346849b4dc4b99e511090c805ab333b4286f44e0"
text = "我不敢同掌柜争辩价钱，怀抱着包袱折返本家，转托兼定找家司挪借。兼定口头应得轻巧，一连跑了三遭才讨来些许，羞得满脸涨红。木炭虽买回来了，唐衣却原封还予老女房。她一声未吭，径直把包袱压进箱底。我亦未分辩，只将那唐衣的质地、金线模样并掌柜比出的两根指头，逐项记在怀纸上，折作小方纸塞入袖袋。翌日起，局中上下尽皆晓得，土佐的姬君连桩土仓典当都办不妥。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:defer","text"],null]']
src = "blake3:17fc58c018f7389399a4fff4707035e29604fae8cc6d0fa836cd4a5d36c9a99b"
text = "求兼定去向本家借钱"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:growth","reply"],null]']
src = "blake3:2639c30c280ed82a7d0788f88999a0a771c7872ee98393281faac8e1ca5ce466"
text = "我不曾点头，怀抱包袱一连又走了两间当铺。次家肯认衣料，末家只计金线，各自报出的价竟相差近半。我将三家数额逐一录上怀纸，折返头一家铺子摊开给掌柜瞧。他咂摸着嘴，终于多添了一根指头。置办齐炭与灯油带回局里，省下一点零头，我如数交还老女房。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:growth","text"],null]']
src = "blake3:850a005ac9e8ab1459cee37af7ceb4b2adbe8fa04f29316b34d6f35399e45b38"
text = "连跑三家土仓比对当价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:skill","reply"],null]']
src = "blake3:ac27e9034af186f76095f584a126f90d9e7c3597b3db62d118f7f784765a7807"
text = "我告诉他这唐衣是节会上穿过的，宫中衣物赎回仍要见人，若压塌了铺子的名声，往后谁还敢来当。掌柜说宫里的东西多半有去无回。我顺势同他约好：三个月里来赎，利钱照付；过期未赎，衣裳归他处置，当价却得现时先加。他捻须思忖半晌，总算加了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:skill","text"],null]']
src = "blake3:e878ca74c8d3e3de47372a2e6f261f0dde62117de4d9a79a84ae8953fe2455be"
text = "同掌柜讲价直到他加钱"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:standing","reply"],null]']
src = "blake3:6aeecda6366d0e21323c571e9e76924991aa2263e2af7c675f2ae5984eacfd79"
text = "我忆起为一条家运送木材进京的土佐商贾在三条有座铺面，便绕路过去说了来意。他认得我便是往日在下田收帆别钱的那个丫头，笑呵呵陪我去了土仓，没费几句口舌，当价便提了上来。没过几日，宫里传遍了话：一条家的姬君，在上京商贾里颇说得上话。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:event:standing","text"],null]']
src = "blake3:fbe86eb2503b3bbbb404b70d08c399acb24b6e4c557bf4f4659d8eaa8625d1f6"
text = "请土佐木材商替我作保"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:remedy:pay","reply"],null]']
src = "blake3:97d4cb70ba42cd44f2bf601d7558b11dd9023ff560496579f7f1663f014ef213"
text = "我掏出零花钱，请上京某家酒屋的老账房吃了顿饭。酒屋向来也做放贷，当价多少、利钱几何、何时算作过期，他酒杯不离口地讲，我一一记下。兴头上，他还学了一通公家来典当物件时如何端架子还价，惹得我笑个不住。回局里的路上，我将他授的几句压价话反覆默念了几遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:remedy:pay","text"],null]']
src = "blake3:0a13800f4d0ba91cdf6a6356ad888acd51ef10ca2b3f5f5ac354e3855b01af2e"
text = "请酒屋老账房教我算当价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:remedy:work","reply"],null]']
src = "blake3:71fc8618c6792c5c15fd19b0de405c9f6c945f0df9f245bd6975a1a51916a378"
text = "我去找老女房讨差，说不管什么活计都行。她叫我盘点局里的旧衣裳：哪件穿得，哪件该拆，哪件典得出价。箱底积灰呛得我直咳嗽，十天下来清出三箱。最后她交我一件旧单衣拿去典当，我同掌柜磨了足足半个时辰，多挣回些钱。她点了点头，随后便把下只包袱交给了我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_07:remedy:work","text"],null]']
src = "blake3:5696bdaa6189942342309832563223e6c3dbf6b3cde4e5d1995eeafdacc2ccee"
text = "帮老女房点检局里的旧衣"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:defer","reply"],null]']
src = "blake3:ff23d2fed7aa4bebba77b938dc166d7d5f3844eaa9927add8f8214815544f345"
text = "我唤来兼定，两人分摊着誊抄回书。他的字歪扭，誊一封须得重誊两封。落笔写到“兼”字，他停下来，说兄长曾手把手教过这字。我等着他掉泪，他却一滴也没落，将那张纸折妥收进怀里，换一张再写。我守着他抄到天明，回书是抄齐了，可统统只照底稿来，半首歌也没附上。宫里便传出闲话，说一条家的回书，字比纸还要薄。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:defer","text"],null]']
src = "blake3:e263a28c8af6d5f35ec7654308bb2ff3f15347d7c58972378d468c250fe23c80"
text = "与兼定分着誊抄，过后补课"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:growth","reply"],null]']
src = "blake3:c7694ee7bb546dcab06f4b4e79c4d4c7fc28cd5ab781bdeb66e6d37cb674710f"
text = "我坐下来，陪保子大人把信一封封往下读。丰后来信措辞粗豪，满纸尽是“可惜”；政所的信找不出半个错字，读来却透着冷意。读至夜半，她忽然停住，问我土佐的潮水是不是果真一日涨两回。我说是，早一回，晚一回。她隔着帘子轻“嗯”了声，没再多问。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:growth","text"],null]']
src = "blake3:4a37bc14cb41a475752dbf6dd05ed0ed7b5cba890880adbcec6b8909a00c63d3"
text = "陪保子大人逐封读完回书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:skill","reply"],null]']
src = "blake3:3397c120fce0f853373261daaaf268750af50936b657da50f461bb0badba9b39"
text = "我在信末留白处题了一首歌，答他问起的海潮：朝潮推船出，暮潮送船归，一日两番，都在等人。全用假名写成，前后写废了三张纸。保子大人看过，将信折妥，说百日那天拿去佛前供着；又嘱咐我，日后回书里要附的歌，也一并交由我起草。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:skill","text"],null]']
src = "blake3:06b8ccfa3aa64556321d1ce0f9f8a9da00c5ef2f61f38e58505edc0fc88f33b6"
text = "替那封未尽的信作首答歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:standing","reply"],null]']
src = "blake3:ff19c4d782d16956cd63ab6b3aa896617f53a30c368a1ca5930a17d86d872b33"
text = "兼冬大人在世时，向来开口便引旧例。我翻检本家的旧文书箱，找出房通大人那一辈回复各国吊书的底稿，依样照式地拟出来：与大名如何称呼，与寺社如何称呼，哪几封当附和歌。保子大人送去给房通大人过目，老人咳着说了一句：“宛如兼冬的手笔。”这话不知怎地竟传进了宫中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:event:standing","text"],null]']
src = "blake3:752487c0915f9183abf924c5e0ea92fd2b709aec6fc34185f16b5e8037f5b220"
text = "循本家旧例拟回书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:remedy:pay","reply"],null]']
src = "blake3:a57a6b5566f5210f545d62b6e4e0840489cc0bc2303ae1ede3d1fe29fa3a705b"
text = "我拿零用钱去纸铺买了一叠淡墨色的薄样，薄得迎光能映出指印。往后每夜题上一首，写给那位未曾见过大海的人——写潮汛，写风帆，写土佐的雨。写足十首时，连自己念着也觉出几分寂寥。我拣出其中一首呈给保子大人，她连剩下的也一并讨了去，道是一道烧与他。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:remedy:pay","text"],null]']
src = "blake3:0f6a9aa343129f1edcca4995faebb193c6fa3acee15ff2b70c5ace7412586994"
text = "买一叠薄样，重题短册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:remedy:work","reply"],null]']
src = "blake3:86e355bed3bce863e3997b22862a753be557dc39cc0faa46292f20fbab24e1bb"
text = "三条西大人闻知本家的事，嘱我将《源氏》里的《幻》帖抄录一遍，言道光源氏那一年所咏之歌，尽是写给故去之人的。我足足抄了十日，酸痛得腕子连饭碗都托不稳。老人家逐行看过，唯独圈出两首，命我仿照那般声调，替本家补撰一首附在回书末尾。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_08:remedy:work","text"],null]']
src = "blake3:76558904ee88bbe83185c78b48dc386131a1bf199d53cfaea412b822d6de49a3"
text = "依三条西大人吩咐抄《幻》帖"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:defer","reply"],null]']
src = "blake3:132297a7b12586d2de0e2b28fbfdd4118cb4ff52119dfde28a07033c9a30d6a9"
text = "我答说尚未拿定主意，得先问过母亲和阿濑。兼定撇嘴道，姊上往常从不如此迟疑。信件托给了正要下堺的人带走，往返一遭少说得耗一个月，保子大人那里，我只能请她多待几时。局中有人取笑我，人已十四岁了，自己想做什么还要寄信回家去问。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:defer","text"],null]']
src = "blake3:1fd2dcb494d648ecde6929e289c37939190ffce024efab6437c60a9aad74e741"
text = "写信问过土佐再作定夺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:growth","reply"],null]']
src = "blake3:01d75495131427a53fa69ac2fcce5dc80a75d0ee494eb0d0b73a1ac9fa1bb860"
text = "我当时未答。翌晨天刚破晓，我拉上兼定偷溜出后门，一路奔至桂川边，借了渡守系在柳树下的小舟。雨后水流湍急，我将桨塞进他手里，指点他逆水划行，自己稳在船尾压舵。兼定划得满头是汗，小舟却尽在水面上转圈。及至上岸，他浑身早已湿透，问我是不是就想做这个。我说是，我要一条自己的船。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:growth","text"],null]']
src = "blake3:a6dc44eb484a282926f05ca0034f4c1a371accdc68f579b67a4ef1b04b046e5a"
text = "带兼定去桂川划一趟船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:skill","reply"],null]']
src = "blake3:8b647caebcb7f250d847b6df5d5756392c326d31d75b3ec3e9283bd7f7d8b6ad"
text = "我借来本家的历本，逐页核算月龄，推算自堺返回土佐，哪几日乘顺潮、哪几日遇逆风。兼定见我写满了整张纸，便问写的是些什么。我答他，这便是我日后要过的光景，先行排定罢了。他探过头跟着数，直数到明年七夕便再接不上了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:skill","text"],null]']
src = "blake3:df36d252f492496de42a4e5789cf134bb134ba2f1fc01855e5dcc92cda3bc04a"
text = "算好回土佐的船期作答"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:standing","reply"],null]']
src = "blake3:39925063b5784791bf6bfaa0e8fa97928ba2529492ea5042a8d3317c0470c0b3"
text = "翌日我去回保子大人的话，隔着垂帘言明：我要带一条家的船出海，走南海路。帘后悄无声息了半晌，她才轻声回道，这番话她会一字不改转达国子大人。没过几天，局里的女房见了我便拿扇子掩住嘴，指点说是那个要出海的土佐姬君；亦有几人私下来问，海面上究竟是何光景。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:event:standing","text"],null]']
src = "blake3:4ad32599ca744858599b1037b4880f85c1cd1dd27ad19e7b716f45c4aacd5bfa"
text = "对着保子大人说要出海"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:remedy:pay","reply"],null]']
src = "blake3:4a2c9fff704357c0eb90fb324202dfa60ec8c780aa8fbb4461a57920b688f9ba"
text = "我拿零用钱上京里专卖历书的铺子买了一册新历，比对着上面的朔望，将潮记末尾空出来的几页逐日补齐。写至秋分那页，顺笔绘出小早的船帆，记清楚几时扬起、几时降下。汐凑过来看了许久，末了只吐出一句：“这条船，我替你掌舵。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:remedy:pay","text"],null]']
src = "blake3:ccfc5816ed941d20f2ee3727759bc5590f858729497c92b801823f56b2580de9"
text = "买一册新历把潮记补全"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:remedy:work","reply"],null]']
src = "blake3:42ac17b6fee196880111d95ad3d037094d6ea4d0a7e8c0a0273fcd320e406fad"
text = "山科言继大人要往堺去会几家商人，替朝廷讨些银钱，听说我懂算潮，便托我排个船期。我跑了两回鸟羽，摸清淀川的水势，复按潮记算准堺那头的涨落，仔细挑出三个日子。他看罢拍着膝盖，连带随身药箱都叮当响了一声，当即说就按这几日动身。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_09:remedy:work","text"],null]']
src = "blake3:17c02c4c42c700886646064eac870998b1195722b57b100e4a36e3158f02a45f"
text = "替山科大人排定下堺的船期"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:defer","reply"],null]']
src = "blake3:8a6a6805a311c3df97f0c359583a44c304dc047af7c31bda39708ddc7a5bc38e"
text = "我回转本家央求兼定，请房通大人致信宝镜寺。老人家抱恙在身，一纸书信断续写了三日方毕，兼定始终侍立榻前研墨。寺里读罢来信，席位固然腾了出来，老尼碰见我却仅淡淡行了一礼。年后我在经堂落座，身旁尼僧低声咬耳朵，道这位是凭着前关白的墨宝进来的。我权作耳旁风，径直铺开经卷。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:defer","text"],null]']
src = "blake3:e0793ff93a057f77339698568745a402f4a96c044fac2449f38da13e41f52f5e"
text = "央兼定请房通大人修书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:growth","reply"],null]']
src = "blake3:cb81469a70d40cf54a4ceef40af1269b58a0ca7debdf1ae5c69e372fca868094"
text = "我向老尼借来算木，蹲在廊下把整年的油账重新拨算了一回。账上斤两杂乱，既重记了三笔，又有一笔按冬价算了夏天的油。我将这几处一一圈出呈与老尼，随即跑出山门找那挑油汉子对账。他核过自家的底簿，面色登时青一阵白一阵。这么一来，欠款削去一截，省出的钱款恰好抵作我一年的志。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:growth","text"],null]']
src = "blake3:c93d788950bc09bfb6335464a0c56cfa6f4f540662262326cb7e28c0ad20ec47"
text = "帮寺里重核一遍油账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:skill","reply"],null]']
src = "blake3:669c7ec803f5ec54810d5baa20d15f0438fcfbc9f5bd3cfa7e8433e57ab1960c"
text = "我坦言囊中羞涩，好在笔下尚算端正。开春经堂法会少不得新抄的经卷，外雇抄手一卷须费多少，老尼心里明镜似的。我同她约好：按月交两卷，便抵我一载的志，余外多抄的须另备纸墨。起初她只肯按一卷算，直磨到廊沿积雪没过半寸，她方才松口。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:skill","text"],null]']
src = "blake3:2602612cf9e8e2278c9f9eb0da9e3172d4fcc04a99593dfe6c6678c3be64de4e"
text = "抄写经卷来抵志纳"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:standing","reply"],null]']
src = "blake3:c0e3dba0d4a80d6f9985d9b7602f8616dcb47798906f38de14cbb8fc87bedf19"
text = "能岛的船只向来替堺的商号载运荏胡麻，我便修书托人捎往堺，请熟识的油商开春先拨一桶油送至宝镜寺，仍按堺的价目结算。正月初四油桶便抬进了寺，算下来比大山崎廉价不少。老尼点收妥当，特地在经堂临窗处给我留了席位。寺中尼姑私下议论不休，好奇那位打土佐来的姬君，何以连堺的商贾都支使得动。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:event:standing","text"],null]']
src = "blake3:2dc59c3debcf487aab2bd427ae2bfcbee69f6a363c601fee7161c0940c73e069"
text = "托堺的油商代寺里供油"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:remedy:pay","reply"],null]']
src = "blake3:b9b19daba1567ceef6169a3232e7bda6e7afb14e7220f6f22fd1b5b8ef5e4b21"
text = "我兜着零钱去山门外守候那挑油汉。他索价比腊月更贵，我便依着寺中旧账同他理论：去年几月几斤作价几何，今岁缘何陡涨。拉扯了一刻钟，他总算松动些许，我买下一桶，亲手扛进经堂。老尼打量过那桶油，随即吩咐人将我的席位迁往灯旁。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:remedy:pay","text"],null]']
src = "blake3:e5913dd288662b2f381690c1fea6f5138e75c008dbbebd02af35da5051fccba6"
text = "自掏腰包买桶油送入寺中"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:remedy:work","reply"],null]']
src = "blake3:824caf4302f8c1debc3f97f37da4e10298f8b11e1ea98fc24071b2232918add5"
text = "我恳请老尼派桩差事给我。她将各处寺领庄园递来的年贡账簿交由我处置：好些庄子欠着租米，庄官的诉苦信一封比一封凄惶。我循着来信逐一作复，当宽限的宽限，该催缴的催缴，还代寺里与其中一名庄官讲定延至秋收。一连十日誊录账目，熬得双目昏花。老尼审过回函，一言未发，翌日在经堂里多点起一盏灯。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_10:remedy:work","text"],null]']
src = "blake3:8e5e247f2811a1ac5e8f5b572be85753d255bc10da77ad4b1623575577dcc1e7"
text = "替老尼理清寺领年贡账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:defer","reply"],null]']
src = "blake3:b59252fe008b7da8eb070df144cb0eb6b1e2b499a1cfec0d89abd025eb63b0ac"
text = "我暂且搁下香木，发了一封长信回土佐，叩问母亲伽罗与罗国究竟该如何辨别。闻香之艺本是母亲所授，她定然晓得我谬在何处。鱼雁往来动辄二十余日。这段时日局中聚香，再无人相邀。我独坐廊下听着邻室飘来的笑语，咬牙将《庭训》又誊抄了一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:defer","text"],null]']
src = "blake3:c6058352367624121e358ffe086d94d8bcf73c38c5b1e5f95b6f090854d937b6"
text = "修书恳请母亲指点以补拙"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:growth","reply"],null]']
src = "blake3:80fcb85d9c7b27c04fdd44aeda090a7ff31c318206ce8e5540ceac3ef0f172d6"
text = "我向执笔的女房讨来当日香会记，逐炷倒推：第六炷乃伽罗，甜韵尚悬于鼻端，第七炷递到眼前，我嗅出的分明是上一炷的余尾。入夜后，我令汐把伽罗与罗国隔一盏茶工夫交替焚熏，不准道破次序。起初几番尽数猜错，熬至半宿，罗国收尾那丝微苦，即便隔着伽罗的甘甜我也辨得清了，恰似落潮后礁石上留着的气味。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:growth","text"],null]']
src = "blake3:c29600ff9b63cb24be90f7d1e54a6343aac97aa44642cb70704c3ed59744103c"
text = "借来香会记，逐炷细细回想"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:skill","reply"],null]']
src = "blake3:90f019727365591d370f3610b60a7d1c509ca7d9096a833e555c65629cd76c81"
text = "国子大人定下罚则，败者须赋和歌一首。我落笔写道：误认罗国作伽罗，犹如错把暮潮当晨汐，舟楫早已离岸。国子大人闻之失笑，将短册遍传合座传阅。菖亦过目，抿紧唇角不语。及至散席，国子大人吩咐将我这首咏歌誊入当日的香会记。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:skill","text"],null]']
src = "blake3:dc6fcda7a6cfe66c45ac3964227a71d3bd3e129299f7a8e4e16552e2b482d1ad"
text = "依例受罚作一首认输歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:standing","reply"],null]']
src = "blake3:75e6ada361a3d77f3be4d7dbbe59671e5447ac0be6650adbaa0b53aa51bd86ee"
text = "我前去请教三条西大人。他翻出先父实隆卿遗留的一本香木手记，从罗国的产地源流谈起：南洋海外之邦，海船如何转运至堺，缘何与伽罗难以分辨。一席长谈占去整半日，我抄录了满满数纸。下次香会，我将其辑成短札缀于香会记末，国子大人披阅后，特地传与他局观览。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:event:standing","text"],null]']
src = "blake3:00113df01343e71b3f51d0155d7dcdd372881e6a4bd2807cfb9c15812aff9d86"
text = "向三条西大人讨教香木渊源"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:remedy:pay","reply"],null]']
src = "blake3:090ccfc2800ee3b92f6f0cbbb4c9fe15ceee12547b1fcee0284a172cde4c2afa"
text = "我动用私房零钱，在上京的唐物铺买来指甲大小的一片罗国，店家仔细裹了三重纸。我将其分作五份，每夕焚一片。汐嗅罢总脱口而出大白话，“恰似淋雨的柴禾”“仿佛底舱旮旯”，我便把她的土语改作和歌上句，自个儿再续下句。五夜下来竟凑齐五首，汐嘴上说一首也背不下，次日却把“底舱旮旯”那首吟给了当门的女孺听。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:remedy:pay","text"],null]']
src = "blake3:bbe86944fc4f4873fbf237d51d85098a9159fd731404f4d0958203df87edb4ef"
text = "往唐物铺买一片罗国细练"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:remedy:work","reply"],null]']
src = "blake3:7c1e3098b33b5b27d5d07df81ff7c08a06f916bf6603ec107112be8eb40b1580"
text = "我赴国子大人局中告罪，她对上次香会只字不提，单命我每日替局里整备香事：削香片，拭云母，将香炉积灰按平，再压出五道规整的灰纹。十日工夫，我指缝里尽数嵌满香灰。临到末日，她嘱我在香会记上代为题咏一首。落墨之后，她用女房词吐出一句评语，这回我字字听真切了，原是“还算过得去”。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_11:remedy:work","text"],null]']
src = "blake3:c51e2b1eea8299ea96ca1bc4f7e155e57266278a7d1fe1df6cfa3b750fe359fc"
text = "替国子大人的局备香十日"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:defer","reply"],null]']
src = "blake3:1bcb7205a663c6a312c35a9c5284cbb98a0702e38cede49526393cf4899cb781"
text = "我合拢旗账递还阿濑，推说辨认不出。她睨我一眼，接过账册亲自去同船主交涉。那船主打我身旁擦肩而过，扯着嘴角冷笑一声。待阿濑返身，往我掌心塞进一条草绳：“自今夜起，每涨一潮便系一个结。满十日，再来见我。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:defer","text"],null]']
src = "blake3:6d069e3251b3a2cbb923fef3743dc0d69621dcdf123e6fc76407386fd3455995"
text = "将旗账原封还给阿濑"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:growth","reply"],null]']
src = "blake3:980bef7ac4b78bdc5431231ce045e346fa5fe5ae943b5d3562995b5d073bb4e3"
text = "我爬上他那根桅杆，径自将旗卸了下来。口口声声说是二月悬起的旗帜，在海风里经春历夏，布边竟连一丝毛边也未起。我将旗高举给栈桥众人瞧看，船主正欲开口辩白，阿濑手中木梭倏然停住。三贯文即日照数补足，那面新旗我扣下了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:growth","text"],null]']
src = "blake3:81cd69f9bbd130b8ed95eb78a55c160a688d97ba688ed5cddcff860a3d21719e"
text = "攀上船桅解下那面旗"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:skill","reply"],null]']
src = "blake3:d18113694609e22cb46c715f330e43dd10f7cdcc7e45d0304518d1154dcaeb4d"
text = "我盘问他二月何日经过能岛。他脱口而出：十六，午时前后在番所纳的钱。我翻过旗账背面按日序推演潮汐：十六正值大潮，午时上下，能岛海峡水流汹涌如决堤，番所向例此辰绝不放行，哪怕村上家本家的小早也得系缆岸边候潮缓。“莫非您这条大船，是乘风飞渡急流的？”他面皮涨得紫红，憋了半晌方才咕哝，旗子是在堺向人转购的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:skill","text"],null]']
src = "blake3:0c257ac579f5344d7b33ddb98185beae2e4353629e20838d18557121799990fd"
text = "推算他过能岛那日的潮汛"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:standing","reply"],null]']
src = "blake3:db9e1c9d4f98fd1fb967dd1ffe34e2645f3274d122b488a3a4b2a3713e029cd6"
text = "我懒得与他争辩，径直朝栈桥那端高唤一声。织网、晒鱼干、修桨橹的七八名老水夫登时围拢过来，当中一人一眼认出船梢那块嵌补的旧板：“这船开春在宿毛湾搁过浅，压根未曾驶入内海。”船主环顾四下，无人肯替他帮腔，只得乖乖补齐钱款。自那日黄昏始，河口上下碰见我，皆改口尊称一声“下田的姬君”。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:event:standing","text"],null]']
src = "blake3:818e22a0a1a0b03a8d77e5948e860ed6a3c21ae810bf956a87b72d7589ee128d"
text = "唤码头老水手前来辨船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:remedy:pay","reply"],null]']
src = "blake3:a960f1767f548823ee98403d393d24f29d6366a2385494e7e688bfcfb261e4eb"
text = "我取出私蓄，雇来一位加久见出身的老船头。他在船尾荡篙，我手持系好丈量结的铅绳，逐段垂入水中探试。沙洲东移了半町，满潮几寻、退潮几寻，尽数刻画于木札之上。收船之际老船头赞道，我的测绳垂得笔直，强过政所那位画匠。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:remedy:pay","text"],null]']
src = "blake3:20910963a3b6a60cc1ed1c38be42fd76a1012ca5bc566b7f750cfcf1c327e027"
text = "掏钱雇老船头领我测水深"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:remedy:work","reply"],null]']
src = "blake3:a2168b797cde5f4dfea9d832671170680e097b63bb1c218440060646a9e01005"
text = "阿濑命我夜守河口，不许掌灯，专心听水。子夜涨潮时分，河水外涌的声响骤变，沉郁暗哑，宛如有人悄然合拢木门。我通宵未曾阖眼，破晓时向她禀报转潮时刻，误差不过一炷香工夫。她微微颔首，径自回屋补觉去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_12:remedy:work","text"],null]']
src = "blake3:3c9728d8ac2fb76e34fac1cac49b5c679ed6baa1ce6d168743416cbee5b612a0"
text = "代阿濑值守河口一宿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:defer","reply"],null]']
src = "blake3:7a2f17d64c9a0c0748a639f8dfa16c3d5c3aae053d9a86d1052a6ac03e14a200"
text = "我修书寄往中村，恳求母亲接济钱款。书信须先顺淀川而下，赴堺候船转递，待中村的钱送来，腊月早已过半。管事老侍一声不吭，转身便去典当了自家一件衣裳。我心知此事必将传遍本家：土佐来的姬君，遇事只晓得写信回家讨救。当晚，我把账册抱回局里，从头一页抄起。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:defer","text"],null]']
src = "blake3:026fe49d665bfa2ce6f223610dc392cc75763a8b1fc6f4d3409152fc4d3d53c0"
text = "修书返中村求助母亲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:growth","reply"],null]']
src = "blake3:1eef983b9b3c0f2a1b45d3cfc8a04d14933f38fdb92572acde191e62a1874b9f"
text = "我铺开账册熬了一宿，将可省之项逐笔勾画削减：新春酒筵一概裁撤，冬裳翻新旧衣顶替，炭火单供病榻房内那一盆。如此抠出的钱，恰够延请药石至腊月尽头。老侍望见满纸朱圈，长叹一声，感念家主昔年亦是这般理账的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:growth","text"],null]']
src = "blake3:5755696d8abdab4469546dbe7afc8d66440a786096faf65866c9105d880b9a55"
text = "重行裁定本家一应开销"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:skill","reply"],null]']
src = "blake3:14d9b94c1985c1e14eb46948ba486593f4849afd2e0a902653c170f7e852d16d"
text = "我领着汐登门药铺。坐堂掌柜起初断然回绝赊欠，我便点明开春土佐年贡船抵京，船载鲣节照京里行市分他三成；末了又添一句，言继大人开的方剂往后悉数在他铺中配取。掌柜咂摸着嘴筹算良久，终在赊账簿上落笔写下“一条殿”。归途之上汐打趣道，姬君方才议价那副腔调，简直与她娘亲训斥水手如出一辙。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:skill","text"],null]']
src = "blake3:fb0c8c92879b41d1ed6be9abe72090f74d5a7297840d54a985c6bd745b7a6f7d"
text = "赴药铺商议赊欠章程"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:standing","reply"],null]']
src = "blake3:82e8fdc97526828e303b6e8b74491464e0fc56a82e1d7918942ba4df0874c6c4"
text = "我致信往来幡多最勤的那位堺商，单钤一条家印信，约定来春年贡船全数交其承运。三日后其手下伙计便送来两贯铜钱与一匣上等野参，附带口信一桩：一条家姬君的手迹，他认得真切。药铺掌柜闻讯，主动将欠账期宽限至二月。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:event:standing","text"],null]']
src = "blake3:5eb39f2eb378c5ce36665f65b0b41a2de37e5306d00ff63565fb1842cbd4caae"
text = "凭一条家名头向堺商借贷"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:remedy:pay","reply"],null]']
src = "blake3:96d634613ba12243a325ae11f2da768c20fc220878e6f1a1666289b802d65672"
text = "我将积蓄码在他药匣盖上。他顿时眉花眼笑，塞来一册旧账抄，页边密密匝匝写满眉批：哪家息钱几分，何人易于通融，谁人见酒必醺。我挑灯通读一夜，翌日再去药铺，依他门道先夸方子精妙再谈钱，掌柜居然折让了一成。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:remedy:pay","text"],null]']
src = "blake3:35a3cd3f254dea1a1e7ccbba429fef0c4095c1087dcf83840ee507ff5772b03c"
text = "买下言继大人手头旧账抄"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:remedy:work","reply"],null]']
src = "blake3:581b32effb5d6baec8a4c1ca162fc9a3f5aeaab2bdbc954b7d7f9b6cac154fdc"
text = "土仓东家原是个胖和尚。言继大人先赠药，复又扯起京都趣闻，直说到第三桩笑话方才转入借钱正题。我在侧旁跪坐足足一个时辰，双腿酸麻得几乎直不起身。归程之中他考较我学到了什么，我答道只记得您开口之前足足喝了四杯茶。他抚掌大笑，称今夜定要将这句妙语录入日记。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_13:remedy:work","text"],null]']
src = "blake3:29830883d773d3da69ed49e9fa927f2ec5d48e3886578f5b690ed672178f4cdf"
text = "随言继大人前往土仓举债"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:defer","reply"],null]']
src = "blake3:3ab1b88bd1753c80667cdda07d771c6976982656f2fbc63644510bb7f21808f1"
text = "我不敢贸然动笔，先行寄信回中村，请教母亲该如何向舅舅开口。保子大人闻言只道了声“也好”，帘后便再无动静。次日国子大人的奉书先行发走，尾后附了旁人代拟的一首。局中人私下嚼舌：一条家的姬君，连自家舅舅也不敢求。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:defer","text"],null]']
src = "blake3:6a93b0c1218122334763ebde84627ffc66eb1af91c3060544f5ee93f094fd3a8"
text = "先修书问母亲的意思"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:growth","reply"],null]']
src = "blake3:a1bc879b068b5b5e3c96806869aa6c77ab4fdaac8c4bea6e14485e879ec8a12d"
text = "我不曾急着落笔写歌，先拣起纸来。淡红的太艳俗，看着像讨赏；素白的又像吊丧。挑到最后，定了张浅黄的，迎着亮处能透出几分梅枝暗影，又按母亲教过的法子熏上一缕梅花香，淡得须凑近纸面才嗅得出。国子大人取过去轻嗅了嗅，一言未发，只将她拟妥的奉书垫在了我这张下头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:growth","text"],null]']
src = "blake3:e7022c017cb1a5b8809d135dc9060b98f77c5301a8bda564d172a68054efb7a6"
text = "拣好纸熏香，配这封信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:skill","reply"],null]']
src = "blake3:0b07767ba4f5cf69bd0af1ac2f54fead1d48afcd1c543f150681197a6a0706a2"
text = "我写的是府内的海：南蛮船入港那日，京中屋檐正滴着漏雨，同一股春风吹拂两地。拟毕便呈与雪过目。她才扫了一眼，笔锋已点在纸上，抹去漏雨那半句：“只道春风吹着两处，足矣。”保子大人看过后将纸折妥，低声道，舅舅念及此处，定会想起他姐姐。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:skill","text"],null]']
src = "blake3:c54b241d992707f0f8a2633bb6268e71d2f67e409159c33623caea21a9ad02d7"
text = "写首歌附在奉书末尾"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:standing","reply"],null]']
src = "blake3:958a1c3ce9e5a182b0dc3159ba948103e2868c62b0a4e7eb2e54d91c3e243151"
text = "我检出《古今集》中寄往远方的几首，依着旧例吟成一首，并将典出逐条注于纸背。三条西公条大人阅罢，以扇骨轻叩纸背道：“这注文倒比歌还精妙。”此话当日便传遍了局中。此后宫里但凡往远国寄歌，女房们总要先行请教土佐的姬君。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:event:standing","text"],null]']
src = "blake3:8ef2fcd4f1f7876585f49b1590ded67b62687b20ecb944c6f6def0435ae6534a"
text = "仿《古今集》旧例起草"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:remedy:pay","reply"],null]']
src = "blake3:f018291a64748b2ab02bd9fe3ca02905688bd37568a72b65a4bbc001c9e229df"
text = "我购入一刀上等鸟子纸，逐封细读，逐封唱和。凡讨到钱的几封，歌辞皆短，只专言一物；未曾讨成的，通篇皆是天恩浩荡。和到第十首时，连我自己也摸出些门道。国子大人收过那沓纸，单抽出一首，言道这首留着下回再用。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:remedy:pay","text"],null]']
src = "blake3:657e09c7c82f886cefd66a4294dd7dae2d708c1d5d408e0404c109c243f2b6dc"
text = "购一刀纸，逐封和上一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:remedy:work","reply"],null]']
src = "blake3:27db61f0f71dcd0b15111ee6f3f3ba51ff6e09b8c8e596de7edfec2b6d162c8e"
text = "我在局中抄写至夜半，炭盆添过一回炭，旋即又灭了。底稿上的和歌一首首经手，好几首抄着抄着便背熟了。将近天明，国子大人过来察看，随手翻检几页，道是笔力尚稚嫩，难得一处未错，顺手将一件旧袿披上我肩头，转身离去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_14:remedy:work","text"],null]']
src = "blake3:98b8e574a65f2bae68bdfea47c148c7bfc9e508680985b33b3d3589f5091320f"
text = "留于局里誊完这沓"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:defer","reply"],null]']
src = "blake3:63b40b374ce27dcc17d4ad82fd23f8fcdc24744f53cb889594f955d779b01f4a"
text = "我寄信回下田，恳请阿濑上京来帮衬料理。信去半月，人来亦须半月。兼定熬不住性子，自个儿跑去询问家臣，家臣们私下嘀咕，姬君在宫中住久了，竟连船也不会寻了。他归来把这话原样学与我听，学罢又懊悔起来，提笔把单子上的“鞠”字抹去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:defer","text"],null]']
src = "blake3:df5ceea3eb1653ac8115ffb9cf3e8830768fbe76cfa73fedaa9ce3e6eadf3de7"
text = "修书请阿濑进京搭手"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:growth","reply"],null]']
src = "blake3:dd6ae2d521f3eaa4e01aa8058c92c5b91a5be66a77864de67cc5c4edbd7557bc"
text = "我在堺验看了三条船，单择了吃水最稳的一艘。书箱怕潮气，安置在舱中最高处；铠柜沉，坠在最底下当压舱；家臣则依轮班分坐两舷。船头听我说罢，开口问我是哪家的船头。兼定在一旁抢着回道：“是姊上！”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:growth","text"],null]']
src = "blake3:fd506da650ee73f84146a42843e1f2634add2bab1566f9bee00d4a9f089c50a8"
text = "往堺相船，安排舱位"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:skill","reply"],null]']
src = "blake3:24929c3d249c9614129b8cdbed25051426217ceed995c86aa4192b358179eaed"
text = "室户岬外海海流最为棘手，交秋又有野分袭扰。我翻出这几年在下田记下的潮时，逐日往后推算，躲开野分最烈的那一月，于九月内标出三个小潮且风势偏北的日期，抄成一张签条递予兼定。他将纸签夹进书箱：“等回了中村，我拿去给政所的人瞧瞧，就说是姊上算的。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:skill","text"],null]']
src = "blake3:9c6f2673afda609f7cf37da6afe3a3f8741fe8866e951add571581e10bbe7c42"
text = "拣定发船的日脚与潮时"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:standing","reply"],null]']
src = "blake3:a1f9609881040f59a09bbe1c25bfc1351162afb6caca4e6eb5193c27a8b26002"
text = "我修书去能岛，拜托阿濑同族之人拨条小早，由纪伊水道相随至室户岬。复信寥寥一句：“一条家的姬君开口，一径护到下田。”此信在堺的埠头传看了一圈，船行闻知这趟有村上家的船只伴航，船资立时减了两成。兼定将信反复端详，问我能岛的人缘何肯应承我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:event:standing","text"],null]']
src = "blake3:5ffb864629a50706b84047d2326597384c8a50048b59cbae807367ee85d5918c"
text = "托能岛遣船护送一程"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:remedy:pay","reply"],null]']
src = "blake3:e98e1a2ab301806726932fd9eb0ff7f5c479af7a00c4d1925306033ca87c6143"
text = "我自掏腰包包下川船一舱，自淀一径乘至大坂。起初船夫并不搭理我，后来看我始终随他察看水势，便指点我辨识淀川的浅滩，教我哪一截水落须换长篙。返程后我将沿途浅滩绘作一图，兼定瞧了，道是比他的习字还要工整。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:remedy:pay","text"],null]']
src = "blake3:76c76b8404493aa35439e039eb72984ec1ed2064e9c44381580c1397ff082ca2"
text = "雇条川船随行至大坂"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:remedy:work","reply"],null]']
src = "blake3:35929f2b70055f97894f6629ed0761954d46fb9daf413f6fafb2df1606ad99c7"
text = "我易了件旧小袖，在淀的埠头替船夫扛了三日货。直到第三日歇工，方有位老船夫肯同我搭腔：淀川涨水与否，瞧岸畔柳根便明。我将这话牢记心间。汐前来接我，瞥见我肩头勒出的红痕，半字未言，伸手替我把衣领翻整妥当。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_15:remedy:work","text"],null]']
src = "blake3:5e1cf55a072d81d994bab96ccc06c242353350c2cf27470b8c3e705b00573429"
text = "去淀的码头替船夫搬货"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:defer","reply"],null]']
src = "blake3:55dab44862da5fd82864ace09bb1090226b68c463d88ab8fc3049fb98c691033"
text = "我把花名册递给阿濑，将账簿交还母亲，推说自个儿尚无定计。阿濑仅用了一宿便把差事派定，掌舵的位子归了能岛人。幡多的渔家子弟当日便走了两个，临去前留下一句话：这船原是村上家的。母亲未多言，只把账簿重新推回到我案前，替我掀开了头一页。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:defer","text"],null]']
src = "blake3:0a0fdb5020d9199dcefa199d37e043a74673f14cd14f38f9acc6e0998b385d7b"
text = "托阿濑和母亲代为分派"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:growth","reply"],null]']
src = "blake3:963f003d1530aa4a507a7069e5c3e4310218a417f446fd8ac454d7baa5c8107f"
text = "我把十八人的口粮、工钱连同沿途关钱，逐项列了个明白。土佐的米贱，三袋里留一袋充作路上口粮，余下两袋运去堺卖掉，恰能抵了水夫的工钱；两袋盐倒不必卖，留下来腌鱼用，反正是堺那边的盐更便宜。中间缺的那一截银钱，替人捎带一趟货物便能补齐。母亲拨着念珠，从头到尾核了一遍，竟连一个数目也没改动。阿濑在一旁听罢，道：“比我年轻时还要精明。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:growth","text"],null]']
src = "blake3:bd3dc30bb3fdf06b8cd40fa93fa4419a5ef065e166619d02050cab559697ff78"
text = "细算米盐与工钱的账目"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:skill","reply"],null]']
src = "blake3:c5804d4807968ddfeb4f59065e2b46c11fb83bdaf8ad2f9ebdde0e343d92b51d"
text = "我将两拨人的领头分别唤到一旁说话。能岛的老手执意要掌舵，我便把舵让给他，只是进出港口的号子须交由幡多的人来喊；幡多那边的渔户想多讨一份工钱，我也应允，往后每靠一处港口，捎货的进项便分他们一成。这般一直谈到暮色四合，两边都盘算着自己得了便宜。次日在栈桥上碰了面，彼此望望，谁也没再提掌舵的争执。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:skill","text"],null]']
src = "blake3:4877032d8f2664f48cf8fb3c8b126d204164e0653452f100ea54d7d9152dce76"
text = "与两边的领头商定差事"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:standing","reply"],null]']
src = "blake3:8f8acc70459f17ad5bbd0d03c9865cc20dd558b21936815bc2d1bdbbeb6db644"
text = "我逐户走过河口的盐铺、米行与船具店，言明待开了春，我的船替他们捎货往堺去，脚钱先减半算。盐铺的老板娘头一个应承下来，说姬君向来在河口收帆别钱，从不曾差过一文。这一日跑下来，铁钉、缆绳连带两张新帆竟都赊上了账。到了次日，便有渔家的后生凑到栈桥边探问：一条家的姬君要立船行，还招不招人？"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:event:standing","text"],null]']
src = "blake3:02a77ac69d8a8d709075471131b05d796f97b6926434632f96a2b950952fe1cf"
text = "往下田的铺子赊些船具"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:remedy:pay","reply"],null]']
src = "blake3:f1622b0721e7098e0b8c6104dbd528daf2cff921891159106cb4740afd2c7c6f"
text = "我用纸包好银钱，又拎了两条烤鲷鱼，登了渔家的门。他父亲收下礼钱与鱼，话头却不肯松，反问我凭什么唤他儿子回去。我便将捎货分成的细账摊在他眼皮底下：一成利能分得几许，跑上几趟便够置一张新渔网。他瞧罢，转身把儿子唤了出来，道跟着姬君跑船，账目倒是分明。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:remedy:pay","text"],null]']
src = "blake3:6ce5493f892dfc4f987db1aa654a85ecf95b8895283d2aadb7cc68b904e0446e"
text = "备了礼钱登门相请"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:remedy:work","reply"],null]']
src = "blake3:5cf732bb4018b392df1e175c48cf5ba1b48e97f82e2d4e3d5a8f1d13c100f359"
text = "我便在他家门前的晒网场枯坐了两日。首日里无人理睬我；到了次日傍晚，那名会修船的出来收网，见我竟还在，便蹲下身抛了一句：掌舵的差事，他不服气。我答他，开春前舵位仍要重议，谁把船修整得妥帖，这舵便归了谁。他收妥渔网，隔日一早便出现在了栈桥边。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_16:remedy:work","text"],null]']
src = "blake3:4ee6b0fc8ef9a6d8a19e9e0034a2416885802018b550ca8b0b21e269086e481d"
text = "上他家门口坐等"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:defer","reply"],null]']
src = "blake3:6effc9038739cc1aef4f37f0a7639c3dac02fdaea3d63dcaee971a65cdcb572d"
text = "轮到我时，我将素白的短册搁在扇子一侧，说这一首留待海上再写妥。席间有人笑出声，雪却没有笑。散了席，她一直追到廊下，将她自己那张也还空着的短册塞入我掌心：“那这张一并带走。写成了，寄回来。”话音未落便掉头而去，裙摆拂过廊板，发出沙沙的声响。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:defer","text"],null]']
src = "blake3:a311b83d072f0b31257ac9a744650465bedb4d661abbb39592f12c362fb229ed"
text = "递上空白短册，只道等到海上再题"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:growth","reply"],null]']
src = "blake3:0fe26b61c5419b86dedf46d6e0ddace2e700bb893c7512c7429be02b20b55831"
text = "我合起手里的扇子，请雪先吟。她诵得极缓，咏的是入秋收进箱底的扇子，待盛夏重来时仍会被人忆起。念罢她垂下眼帘，耳根泛了红。满座的女房们俱未品出弦外之音，我却听真切了，将那首和歌一字不落记在心底，并未落笔。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:growth","text"],null]']
src = "blake3:d7cf6df4e0a28e79b02a70f8765cc972ab8c195d587977269319a7431d2fd344"
text = "敛扇在手，请雪先咏"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:skill","reply"],null]']
src = "blake3:02fd8c272fcaa8b426e86da736ec89a518582902e71454ac0acc205701a73cb6"
text = "我翻过扇骨，紧挨着去年旧作，另添了一首新歌：京都的潮虽看不见，却一样会回转。题罢递与雪，她执笔凝视许久，这番竟一字未改，仅在末梢轻轻圈了一点。廊下的汐轻咳一声，催说船期可不等人。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:skill","text"],null]']
src = "blake3:b398cd613ed228ba9b961a4b73aed07c1a1d1a5a37f39e176c86d9ef6b0c3e9b"
text = "于扇骨背面续题一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:standing","reply"],null]']
src = "blake3:24fefee053159a484e498bda7e9852518ad6cce283392c6af5ec3d6a813e88f9"
text = "公条大人看过扇子，濡墨在我的短册上题了一句，赞道这一首可录入他的歌册。满席立时静了下来。坐在末席的大炊御门家那位菖，将袖口整了三回，终是朝我端端正正行了一礼。及至过了年，宫里仍在传道：土佐的姬君离京时，公条大人曾亲笔替她题过字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_critical_17:event:standing","text"],null]']
src = "blake3:d53437834e806607d5925869d59d4f5204e7718b8e88c70b806de0083f50a9bb"
text = "请公条大人替短册题字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_0:event:honest","reply"],null]']
src = "blake3:84fb39224487aa09139063e37706ebe1131108b15a622bc2a3123400bd866624"
text = "刮到次日，手指已裂了口，船底却才弄出一半。我跑去网棚寻阿濑，直言按这势头准赶不上三月的潮，我独个儿干不完。阿濑手底下的针线不停：“干不完就明说干不完，休想私下使唤汐。”她抛来半块饭团，叫我明早天亮再来，她指点我从哪一块下手。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_0:event:honest","text"],null]']
src = "blake3:d64e5f6d99d4c59f3234d3cccd75dd8815155b7c6a80135223d51c9de8cbf886"
text = "直言一人刮不完"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_0:event:share","reply"],null]']
src = "blake3:10b402b47fa1978027d5c0d3af5bb145da1042ed2f4a0fdc2b5b7838d096a1fa"
text = "我在船底蹲着刮了四天，两根手指头叫藤壶壳拉出了口子。刮至船尾，摸着一道发松的缝隙，我便学船匠使槙皮塞实，又涂了油。阿濑走过来，曲起指节顺着船底敲了一周，偏在那道缝处停住，复敲了两记。“这儿谁塞的？”我答是我。她含糊嗯了声，隔日便捎来一副旧手甲给我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_0:event:share","text"],null]']
src = "blake3:c8eaf930fae25e55653133dbda40b0dc2cc8f54b65d3a1c85995b3ce66ea1e71"
text = "刮净船底并塞紧船缝"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_1:event:honest","reply"],null]']
src = "blake3:5b3f83c1ef5ac5da80eb245edbd8794ce78e189c2de3d2b9a966fba8349f2c94"
text = "我思忖半晌，照实回她瞧不出差在哪儿，在我眼里两条船一般模样。阿濑将脚从水里抽出来甩了两下：“看不出便认看不出，强过胡乱瞎猜。”她吩咐我明儿暂且别记账，只管站她背后盯着看：看船主的手、看吃水深浅、看舱口可贴了封条，看足三日再议。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_1:event:honest","text"],null]']
src = "blake3:c441e3a41f37ad8c20ec28957b4314ebc9c2143f40a08627503bb515a887de93"
text = "照实认看不出来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_1:event:share","reply"],null]']
src = "blake3:e21e8a9af378c097362863b64d55a32f3583e166a66f0b6a1b7923b4ca953f7b"
text = "我将那两条船前后过了一遍：头一条吃水深，舱口贴着封条，船主身上穿着新衣；另一条吃水浅，装的尽是空桶，原是回程。阿濑颔首：“满载重收，空船轻收。此外呢？”我答那条空船去年也来过。她咧嘴一乐：“熟客总要让些，来年他才还走这趟水路。”当夜，我把木札上的账目重排了一过。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_1:event:share","text"],null]']
src = "blake3:c7a7e7f28a7e6f4fc69f9b676199242625cb13b4e45fbe92dfbd507536cc7ffa"
text = "说出两船有何不同"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_2:event:honest","reply"],null]']
src = "blake3:72f3d2138026228a3cd1a5c6392a20522cfddaa6a6ffce7585f3f08be37be427"
text = "我回信认了这月没写成。正月本家日日迎客，宫里贺岁的礼数又得逐桩去学，入夜好容易拈起笔，落纸尽是敬语，全不像歌，实在不敢寄予她。只得下月补她两首。信纸短短一截，字却遵嘱写得极大，大得我瞧着都发臊。汐在旁磨墨，嘱我替她捎句话：京里的井水发甜，她喝不顺口。我也一并添上了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_2:event:honest","text"],null]']
src = "blake3:e2358b59121f4752d0ee3a8cbf550777d3b96244195752e331a0f15a49a24301"
text = "认了这月没能写成"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_2:event:share","reply"],null]']
src = "blake3:a8e497a3e7a09b1bff550b848a2f61f878f2bff7a2bbfdb8a5fce744d4872b2a"
text = "我把宫里习来的文雅字眼一概收起，专挑阿濑识得的假名，写京都早春：鸭川水淡，全无潮汐，岸边柳枝先吐了绿，仿佛不知大海在何方。易稿五回，才缩得像她要的短。汐读过，说她娘定能看懂，还免不了念与码头众人听。我折好歌纸，在外头也画了条小船，船头翘得比她那条还高。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_2:event:share","text"],null]']
src = "blake3:a95a9f42da40570b58c3c33e83e4e068dfac340fa2cf741d09364e948479ff02"
text = "拣她识得的字写首歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_3:event:honest","reply"],null]']
src = "blake3:f9f7a7a51803accbe60cb414810b9ee9663b8542024ea54fd9849c6b43b7fab0"
text = "我回信仍咬定那遭没砍错：后边柴船顺水急冲过来，再耽搁片刻，两船非撞碎不可。绳我收下了，待解开再论。搁笔前又添了句：下回动刀前，我先默数到十。汐瞧完直晃脑袋，断定她娘念至此处必拿网梭敲桌。我没理会，径自封了信口。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_3:event:honest","text"],null]']
src = "blake3:68d342fd7492fa5536fc1edff4b26d5638864fedfe1749d5ec5235d6d90ef5e8"
text = "回信仍咬定那遭该砍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_3:event:share","reply"],null]']
src = "blake3:1349fe8ca28f31d1632787df157c40ed3dd05db2d9f468656aedc298414c29e9"
text = "我没多辩。把那截绳子拢进袖管，趁当值空隙便摸出来拆，指甲生生劈了两次。直解到第五个结方悟出诀窍：原是一环扣一环勒死的，寻出最后套上的那一环，一抽便散。七个结尽数解开后，我复照旧样逐个系回，每道结旁系条小纸签，标上我猜的结名，寄返下田。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_3:event:share","text"],null]']
src = "blake3:5362583ac2037b9e01010d22747dd5476a399aa0e3fcc654a620e374bdf22efa"
text = "依她之言，不动刀解结"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_4:event:honest","reply"],null]']
src = "blake3:f456c59cb5198d2529473f5b72135172d1eecc66b0fc8890b132136bd0f4c902"
text = "我回信认了错：此人我统共只照过两面，图他纸送得勤快，便草率写了。荐书既落着我的名姓，欠款合该归我担。我另修书一封致往能岛，言明此旗尾款由一条澪偿付，待日后出海头一遭经过能岛，当面结清。落款时连写三遍，腕子方稳得不抖。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_4:event:honest","text"],null]']
src = "blake3:24b6fe0166dc7cc7277898c9c09b7d2c816477551b7ee4335010497ce24c57d2"
text = "认错荐人，尾款算我头上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_4:event:share","reply"],null]']
src = "blake3:157c5906a88a6276ea77c5bb88db7c1f9c5bbf7d42258b34af527eb5ea961095"
text = "我按荐书留的字号寻到他在三条的京店。掌柜推说东家远在堺，柜上现钱分文动不得。我一指货架上的杉原纸：现钱动不得，货总动得罢。他应允按进价拿纸相抵。我把纸扛回局里，正赶上诸位前辈抄日记缺纸，照市价让与她们，倒盈出四十文。银钱裹进纸包，连着掌柜钤了店印的收据，一道托盐船带返下田。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_4:event:share","text"],null]']
src = "blake3:e013e846a70dcf62d6a9f61d6497a548947b93499eb60ca5e51762ae5946a3ce"
text = "去他京店，索性拿纸抵账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_5:event:honest","reply"],null]']
src = "blake3:f90217b7f2ed0eed13f6f9ea2fe9debafb76f8431382c6c7353e265150f41988"
text = "我复信言明，这葫芦局里容不下。前几日老女房连汐的草鞋都一脚踢出了廊下，这只乡间葫芦若挂到柱上，撑不过三日也得遭弃。再过数日我便乘船返下田，到时揣在怀中捎回去，亲手悬回网棚大梁。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_5:event:honest","text"],null]']
src = "blake3:9415b447ba95eb272bb8f9034434096a9ed40e31c01edef2c4483e69b677b29a"
text = "说要揣回去挂回网棚梁上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_5:event:share","reply"],null]']
src = "blake3:0c5a34803a3b6658e7dcd60fd56326f4aa59babdbd38f94ed6859e614611eac5"
text = "当晚我把葫芦置于膝头，拟了首歌：写它昔年负我漂荡河口，今朝轻若一枚空贝，轻轻晃动，似仍有下田的水声。歌录于淡青薄纸之上，折作扁舟一叶，交盐船带还下田。至于葫芦，我径自悬在局中立柱上，老女房瞥见直蹙眉头，我只管装作不知。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_5:event:share","text"],null]']
src = "blake3:cea8dff86269161fa88ce93ff7442dbfe9f766874f9d36e2b457d56b7481426b"
text = "将葫芦写进一首歌里"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_6:event:honest","reply"],null]']
src = "blake3:49e4112a262d60966229573dfab07f136f85e0b99f942a99102b83b3804d1f29"
text = "我复信称此约仅应承一半：若她警示潮信不妥，我必停舟细听，只是听罢发船与否，须由我这船头决断。写至此处我搁笔良久，复补一句：倘我拿错了主意，凭你斥骂，当着众水手的面亦无妨。汐瞥见，直说她娘读罢此信非连夜赶来京城不可。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_6:event:honest","text"],null]']
src = "blake3:41a3ac928b71b7afed1a6bc935028ae50723954ec142a2f5ea5f21eead8a40d3"
text = "回说愿听劝，却不全依她"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_6:event:share","reply"],null]']
src = "blake3:46d6f3b601603ca9a6d2489ca029e56849c6ea2c2474d8946513a8214b5b2cc6"
text = "我回信应下了：她既道潮不对，我便绝不开船。那幅礁图我粘在文箱内盖上，每夜吹灯前默背一遭：何处涨潮水没几尺，退潮露头几何，哪两礁夹缝夜间航不得。熟记于心后，我凭记忆另绘一图，连同自个儿推算的本月潮候，一并寄回下田，央她对着河口逐块查验。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ase_6:event:share","text"],null]']
src = "blake3:a8a4607ad7b121d2f029c071dde8c25068384a672b0b164d662ac3b48228951c"
text = "应承下来，背熟礁图"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_0:event:honest","reply"],null]']
src = "blake3:8f80fbff094d0144f336ac22c285830e464e4c3378abd7fc1a17289f6325d5df"
text = "我翻看了母亲的粮账：今春中村的米借出去了半数，料子倒凑得出，干鲣却非得等鲣鱼季过去才晒得出来。我在回信里写，眼下只可以先送布料，干鲣需迟两个月，也不敢作保。信是我亲自写的，敬语对照查了三遍，到底还是错了一处，只好涂去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_0:event:honest","text"],null]']
src = "blake3:7e3fb64882303502ba1fff4271cd103669dac11299c5da623213ad97c26bc20c"
text = "覆信说今岁仅送得出料子"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_0:event:share","reply"],null]']
src = "blake3:d0ecbf1ec28fd2ec99ed2fca8af350f49b136c60f75aa3b896d96e858eb94c69"
text = "母亲备齐了料子，又打库里翻出去年留下的几块干鲣，我和阿濑使油纸将包袱严严包了三层，划小船递往河口外候风的堺船上。当日浪头猛，小船挨近大船时撞了两记，我攥着绳梯把包袱递上去，衣袖一直湿到肘弯。归途上阿濑放我掌橹，教我说递物时小船得顺浪靠泊，莫逆着浪顶。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_0:event:share","text"],null]']
src = "blake3:b2ab440ab499fce98580fa539ff7eb2247c2cde2be7faf5d6ad0bdc48b7b3a2a"
text = "随阿濑将货送上堺船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_1:event:honest","reply"],null]']
src = "blake3:cb7bd303ac448a3d02fc199962265a2c0ae13120c2e00696240d32e9d0d8202b"
text = "我把那串名姓摆在母亲的粮账旁，对着盘算了一整夜，复信便照实直写：这许多礼，土佐一条家今年实难凑齐。哪几样备得起、哪几样备不起，我分开列作两栏，半分不曾虚撑门面。封缄前我迟疑了许久，生怕她瞧过便断了音信，末了到底还是封了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_1:event:honest","text"],null]']
src = "blake3:04f901a02f7b32126388dd698755fdcb3f1dc40ca7155339b4caaab6b34d95c8"
text = "直陈一条家凑不齐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_1:event:share","reply"],null]']
src = "blake3:458d8c939d24b4506a22bce45a914e769d410f0d81562d65176f7879d4337212"
text = "我揣着那张名单，去下田的市集上挨家询价：土佐纸一束几何，京城贩来的扇子一把几何，至于香，唯独堺的商贾手里有货，托人打听出的价码高得骇人。我将数目一笔笔排在单子上，总账算下来，竟比母亲整年的私房还多出三成。末了，我另添一列：哪些物件可用土佐本地货抵顶，抵顶过后又省得下多少。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_1:event:share","text"],null]']
src = "blake3:c0c5ae2f17ab5b05576ae8bbbb8b62ab256e62bbd4cc8970f32a72efb5b1347d"
text = "去市集把这些礼问个价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_2:event:honest","reply"],null]']
src = "blake3:22d7505058a8a520eeebb9088a3fad97fff46cbbb339a6c370ff92ac9afaab9b"
text = "我据实回说，宫中送礼裹扎的法度我一窍不通：纸如何叠折，绳如何打结，正月的礼节该配何等色泽，母亲不曾教过，下田也无从打听。帘后静了片刻。保子大人随即便唤来一位老女房，命她当面演习一回：“只包这一回，姬君看仔细了。”我跪坐一侧，拿怀纸把每一道折痕细细摹下，掌心已沁出一层薄汗。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_2:event:honest","text"],null]']
src = "blake3:a41f6f79a3115dcfdc12a914a5883ec34850661ba852850ba725697d76c44849"
text = "直言不会宫里的裹扎规矩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_2:event:share","reply"],null]']
src = "blake3:de2a73ea7191a98921a17c9f57e9cb2faa7ea1341247bcd264f6a88f9a937f4b"
text = "我将幡多运来的纸迎着亮一张张细拣，选出最素净匀停的二十张。外头拿浅色檀纸裹了，挽上红白相间的纸捻，折缝间斜插一枝初绽的白梅——那是从本家庭院老树上折来的。保子大人隔帘端详了半晌，纤手探出帘隙，将梅枝微微拨正了些，随即便又缩了回去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_2:event:share","text"],null]']
src = "blake3:0255ff9f26f55a2bfa4efea73bb894d2a973847b149b23c61e060c0de538eaa5"
text = "为谢礼拣纸，配上一枝白梅"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_3:event:honest","reply"],null]']
src = "blake3:cac6da56356a7222f0552c62c17f84b7e1785d2c3d1893063ab680fc1243dcba"
text = "我直说，鸭川的水路我一回也未探过，灯船是否会搁在浅滩，实不敢打包票。帘后保子大人轻应了声“嗯”，倒似早料定我如此说。那夜一条殿照京里规矩燃起送火，我跪在廊下，只把下田的放灯歌于心内默念了一遍，并未出声。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_3:event:honest","text"],null]']
src = "blake3:5449f9951e6acc3358d7ee25c040a0735eabf579df8b32e8e55179fe05226244"
text = "坦言并无把握，不放了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_3:event:share","reply"],null]']
src = "blake3:c44d0f78852c48148f446079f1c7ef8c6b7f2dfabf10e6e6f3feba2cfd8a530b"
text = "傍晚我领着汐去鸭川渡口，先投三根麦秆试水势往哪头走，又向渡守打听夜里哪片浅滩易起回流。灯船拿竹篾编底，压稳两枚小石，放落水面，便顺着中流稳稳漂远。回来时一条殿的车停在堤畔，车帘揭开一线，很快又垂下。次日保子大人差人送来一匣点心，半句口信也无。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_3:event:share","text"],null]']
src = "blake3:950f3a009e0cc1675abfe444e23ce8d99fe83811f2ed69385ab80104cc13856a"
text = "往鸭川试放一只灯船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_4:event:honest","reply"],null]']
src = "blake3:5c254b72b497af579238dd13aa30853b274c5ff72bfe58bf5d89bb782e947549"
text = "我回道，女房见习的名头落不到商行账簿上去，铺家认的是一条殿的印信，我替代不得。保子大人并不动气，将礼单收拢，道既如此便劳烦家司出面。临退下时她唤住我，从帘隙递出三封礼状中最棘手的那一通，问我词句可还通顺。我默念了两遍，替她易了一字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_4:event:honest","text"],null]']
src = "blake3:d73bbdd40c4dc00f7c43a63996903fe4d4130e1370bdacde9a1ae9af9cfa74d4"
text = "明言我的名头担不住"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_4:event:share","reply"],null]']
src = "blake3:0c6783a5bc14653388bafe0db574d7a45319782221da84c4e180fb1f09cc0ceb"
text = "我将鲣节分作三等，先拿最次的去询价，探明室町通上几家干货行谁愿出钱，方才亮出上等货。有家铺子嫌土佐货腥气重，我说有腥味正因货新，对方俯首一嗅，果然加了两成价。卖得的钱用纸包妥送进帘中，保子大人逐枚数罢，抬眸道：“姬君点钱，倒比我盘算人情还要细心。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_4:event:share","text"],null]']
src = "blake3:743a6e778b63c4a6d99ff84778667cd38c75eac7e4665dc563d20a9c87eb0334"
text = "去室町通发卖鲣节"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_5:event:honest","reply"],null]']
src = "blake3:39a9b41e965394b81f2161c7a58e57da5c23376a7aefd72cad42e4af1828ba36"
text = "我答这几封信此刻拆不得，须得原封携回下田，由母亲亲自定夺。保子大人颔首，取一方紫色袱布将漆匣裹妥，打了个结，想了想又解开重系，缚得愈发严实。“行路水汽重，”她叮嘱道，“姬君务必贴身收好。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_5:event:honest","text"],null]']
src = "blake3:fd8d6f13a48b6e4d2523496711b2bbda84546941badf3bbf326fe650741088b1"
text = "原封不动带回予母亲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_5:event:share","reply"],null]']
src = "blake3:ab4cb0bb9bc4cfc8041fbc3ddacc05d50397139985dbb27ce6faa6cc8e4ec8c3"
text = "我就在帘前逐封读了信。信中大抵是年礼往来与米价，仅最末一封收尾处，父亲题了一首歌，言四万十川的雾比京中早来半月。我依着那首歌的韵，在怀纸上和作一首，写鸭川今年的雾气。保子大人隔帘讨去观看了许久，轻声问：“这一首，我代您抄录一份留存，可好？”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_5:event:share","text"],null]']
src = "blake3:3302471278272f05d681e61b3e81fa5dfc1d102108750386bc327d7b333dec74"
text = "当场展信，唱和一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_6:event:honest","reply"],null]']
src = "blake3:08ab7ecab96cbd5ff3398804fe7cd86ccd17aa4e7a58cb01304609832a56d325"
text = "我答，行船走哪一程全仰仗风向，何时回京我拿不准，贸然许诺无异空言。帘那边半晌悄然无声，随后保子大人低笑一声：“您倒不像在京里住满两年的人。京城人嘴上，是从不说做不到的。”她吩咐侍女捧出一碟干柿，说前途遥远，先垫垫再起身。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_6:event:honest","text"],null]']
src = "blake3:eeef58ae654d3d692762d9121f2c0398d00881c8415e99fc628d748b19eeb036"
text = "不作虚诺，归期实难定"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_6:event:share","reply"],null]']
src = "blake3:904251359c4934b48c7040f0c5a07abd22a6a6d5138dd70186401d992bed2c44"
text = "我向她借过砚台，在纸上绘出通途全程：自淀川顺流至堺，越纪淡海峡，再沿南海路西行；室户岬外海潮流最为湍急，非得候至转潮方好绕过。沿途每处泊港，我都一一注清了涨潮时辰。保子大人将图纸接入帘内，问我室户二字作何写法，是哪个“室”。我答是石室之“室”。她道这便记下了，只候我的书信自彼处寄来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_hirohashi_yasuko_6:event:share","text"],null]']
src = "blake3:047fe9ff3b9b37e104bc3a9d113b2256883478b9fe0951f0e8eb5aeaea36a8ad"
text = "绘下南海路，立约寄信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_0:event:honest","reply"],null]']
src = "blake3:fa495fff1c885ed946d40da6ecbec77fdb6719683d8ea5896547e6e7d0cfbefd"
text = "我覆信说，阿濑尚不准我独自划舟出河口，潮水我只辨得半数，这差遣承当不起。写罢恐他动气，复补上一笔：待我认熟了，再来领命。信缄封妥托付往堺去的船只，我立于栈桥之上，目送那船驶越沙洲方才转身离开。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_0:event:honest","text"],null]']
src = "blake3:4f94ab8c795825cbd61393979ff5d7a308323b667653de0460868ec0009df786"
text = "回说我还不可独自出船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_0:event:share","reply"],null]']
src = "blake3:d8d55f0410f8f65172f6be41ef18b9242ce2c6bb5fad9a00a5ec7369a88ba72e"
text = "我竟当了真。每日破晓前便同阿濑摇船去河口，盯着潮水何时回转，记一道在木札上。逢上阴天看不清水色，阿濑便让我探手入水试冷暖。一月下来刻满了两块木札，我依样誊成假名捎去京城，末了落款：“船奉行澪，谨上。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_0:event:share","text"],null]']
src = "blake3:b576dd1346dcb0823c8291bbbd64a20a379b12e7555188dd782673873bafb742"
text = "承下差事，记满一月潮信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_1:event:honest","reply"],null]']
src = "blake3:cad6f4dd42a7ac44aeee0ccb936008f6412d0be1e855e80c6524fceb28c91ed9"
text = "我在回信里实话实说：下田的鱼市行情我门儿清，京里扇铺的价码我却一窍不通，瞎出主意反倒害你多破费。只叮嘱他，往后进铺子先沉住气别搭腔，盯着铺主的手往哪把扇上引。这封信没几行，余下的半张纸我顺手裁了下来，攒着下回写。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_1:event:honest","text"],null]']
src = "blake3:4695e53d0cfb658936706cc19d5f41c682073ad437055a50ef1659e40c7cfec6"
text = "回说京里的行情我不懂"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_1:event:share","reply"],null]']
src = "blake3:8bd2e6a7f9f51490f1203db35c7078ba812756fcdcdb729a7108feb901ee2779"
text = "要教他，手里得先有实数。我拎了串鲣节去下田的市集，先挑三家铺子问起，留心记下谁先报出价、谁先松了口，让到第几回便咬死不再退。写信时我把这些一一列明，又把阿濑的老法子捎上：先探问旁人花了多少，再报自己的数。末了写上一笔：扇子的事，母上跟前我半个字也没提。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_1:event:share","text"],null]']
src = "blake3:026ad1b7bcd242ff36df0a2947b2938d3d0bcf03affb47adc9e94a2053594ccb"
text = "先去市集探价，再教他讲价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_2:event:honest","reply"],null]']
src = "blake3:0cb8cb764c230ef2fb61947ec32656ff086d83c8b2d5c132cbf8dc7caf8918bd"
text = "歌我凑得出，可这手字还摆不上扇面。一条殿里进出的净是善书的公卿，若是我题砸了，折的是他的体面。我只得把歌誊在短册上一并捎去，让他另请高明落笔。信差走后，我才猛地记起，竟忘了问他那首歌可合心意。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_2:event:honest","text"],null]']
src = "blake3:6046da9f2c42c053f45e08304f1f704984f459ee5d212233e33b5d1d2903acd3"
text = "只交歌，请旁人题扇面"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_2:event:share","reply"],null]']
src = "blake3:307de779f023ffd9df7bb4ecf16a0333a9b4b358989df12b3e6039a34650687a"
text = "我在局里熬了三宿，写废了七张怀纸。土佐的海写不得，鱼更提不得，末了只得写一条殿庭中那株樱：花尚在苞里，满枝早已鼓起花芽，倒像攒了一肚子话闷着不肯吐。扇子题妥，我托汐捎去一条殿。汐回来学舌，说兼定当着侍从把扇子展了又合、合了又展，半声也没吱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_2:event:share","text"],null]']
src = "blake3:d605077d34cbb1129d81cf1517a36409b520935a8baa664c89304ad7e1bfa955"
text = "依约替他的扇面题歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_3:event:honest","reply"],null]']
src = "blake3:0c03f0b86f51c57af901d88ca913fb03f9930ca78c084292ddf60b974f8dc6f2"
text = "我只短短回了数行：我人困在京里，望不见下田的天色，这船来得或来不得，我做不了主，得听阿濑的。只求他一件事：先把信递到阿濑手里，她点头说能行船，再动身。临封口时，我又将“只求”二字重重描了一遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_3:event:honest","text"],null]']
src = "blake3:bc7fbc08de8144abff000c3390c9a2eb0a778db2c8b731f63aedc1aa08259301"
text = "让他先问阿濑能否出船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_3:event:share","reply"],null]']
src = "blake3:3b22a7d1f52cd29b3d9ed5e89effa89ce16534c3d9cf78cc11d1d9c92fc5e1aa"
text = "干嘴皮劝不动他。我告了半日假，径直去一条殿寻管年贡船的杂掌，央求他调出近二十年土佐船往堺的旧帐。但凡八九月起锚的，延误的、中途折返的、一去无踪的，我逐笔誊录，又打听清各船曾泊在何处避风。回信里我附了张简图，把由良、甲浦几处能躲野分的港湾标得明白。末尾写：船可以来，等到九月下旬，旗插多大都随你。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_3:event:share","text"],null]']
src = "blake3:d2a3fab7b88681c2b9c0f8bbcc1ef1567c65dc78992f210bf9dec507bb28e96a"
text = "翻查旧船帐，去信劝阻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_4:event:honest","reply"],null]']
src = "blake3:676fbddddc123c2167e8cb7d55c4cdfc3f8c11845b8ccf393ff3573c18322552"
text = "另半数我今春着实凑不出，局里的工钱要捱到岁暮才发。香是我经手借出去的，老女房那边自去认错。跪了半个时辰，她只说下回借东西须先问过她。这些我在信中半句没提，只回给兼定：账先欠着。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_4:event:honest","text"],null]']
src = "blake3:04f57ddf9fdd3ca1c82687b3197597d6e94106716d1ebb19c3ef366e5ef22075"
text = "认下借香之事，钱先欠着"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_4:event:share","reply"],null]']
src = "blake3:c4bd77d77d2de0e64427e6efc17e754f0c1d281186b359d63c3a5dc5bdb1ef4b"
text = "我把他捎来的一半钱，凑上自己当值攒下的工钱，去室町通的香铺问伽罗的价。头一家开口高得吓人，我没还价，转身去了第二、第三家，这才折返头一家，只要指甲盖大小的一块，说是给局里补数的。铺主见我是女房装束，让了一成半。我把香包妥交回局里，老女房闻了闻，什么也没问。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_4:event:share","text"],null]']
src = "blake3:46e60d06486962cf7997eb285981116e2bd98d843a2cccb6d93bd2fe8cc695ec"
text = "上香铺讲价，补足伽罗"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_5:event:honest","reply"],null]']
src = "blake3:5bcb82978deddcd999a24fb3e7e2e1ea60088f85289278ec6875c0c6691b8deb"
text = "既已送出的物件，断没有收回的道理。我在信里直言：这半片壳归你，嫌累赘便自个儿丢进鸭川去，我可不代劳。小纸包原封不动退了回去，甚至捆纸的细绳也循着旧结重新系牢。汐埋怨我脾气太拗，我只说兼定骨子里比我更拗，他自会明白。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_5:event:honest","text"],null]']
src = "blake3:2ea931991ea06094f50793d5f0d9a0e387b27d39d774ba88a96e778bae4e9726"
text = "照原样退回那半片壳"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_5:event:share","reply"],null]']
src = "blake3:2f508591fab874a27a9ae85197e783c5105233a1faba6bdad44a1fe1a17bd8f4"
text = "我找局里的前辈借来绘贝用的金泥和细毫，在两片壳内各描了半幅图：一侧画下田河口，一侧画鸭川渡头，两半拼在一处，水流恰恰相通。整整描了两个夜晚，直到金泥耗尽方才罢手。属于他的那半我重新包妥送返一条殿，纸包上题了句话：位阶升得再高，文箱里总还匀得出个角落安放它。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_5:event:share","text"],null]']
src = "blake3:a1da4a2f8f09ec66edc8a01d99e083d063ccc5d41720fdc257acd70feaefd9a2"
text = "往贝壳内画上两处水景"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_6:event:honest","reply"],null]']
src = "blake3:d9d9702dbc09e567110f11d2bec86e996a08187874c0518752eecc1a606d7adf"
text = "我覆信说，掌舵我能接下，然日后每逢泊港便先返下田一节，着实应承不得，风若不朝土佐吹，我也唯能顺风而行。我能应下的，是每泊一港必寄书信一封。写毕思忖片刻，又依历书推算出下田今月的潮候，一并录在信末。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_6:event:honest","text"],null]']
src = "blake3:122469151ea9f2cfa39d8f626ea08b995d98f3575ae4080aaf29364731c8c6f1"
text = "单应下每港去信一封"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_6:event:share","reply"],null]']
src = "blake3:ae088f19afcb9a748ea07fe2e2e5c62304f4ebd2b13ef4422183c1e95a55714a"
text = "回书里我仅写了一个字：好。三月底土佐年贡船于堺卸尽米粮，我乞了三天假，带上汐赶往堺去，央求船头教我试一回舵。舵柄较橹沉重得多，扳转过去，船头需滞后半晌才肯扭转，必须先行一步拿定方向。头一回我扳迟了，船舷险险擦着别家的锚绳滑过，船头脱口骂了句粗话，连汐都听了个真切。第三天，他终究放我独掌一舵，将空船绕过住吉浅滩驶了回来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_ichijo_kanesada_6:event:share","text"],null]']
src = "blake3:f4a9bd0c1a7a586f98673acbbbd9121a77d7b6f1a8f32f686d5aa5fd52352bd3"
text = "应承掌舵，赴堺习操舵"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_0:event:honest","reply"],null]']
src = "blake3:60854d5c940c8c2a606400f1be93a9e9f868cad011717f18f1d990917c7e41bb"
text = "我直承下田往中村这一程自己仅走过半段，再溯流而上水势生疏，万一账簿掉进河里，实在担待不起。母亲微微颔首，将簿子收拢归位，另取来一张素纸，教我先把行过的那半段航道，何处暗藏浅滩、何处易生回水，逐一描摹出来呈她过目。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_0:event:honest","text"],null]']
src = "blake3:2a0be2e3ccdf8e4d9ecb222cb5d0aba385811c3ba22a407fb44fe7d8cee35894"
text = "坦言尚撑不到中村"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_0:event:share","reply"],null]']
src = "blake3:d18017e3daf5e8ba2045a70290cbfe9bce705fb8e8e0857c3b38a119f76f9c65"
text = "次日我将账簿包进油纸，独自操舟逆四万十川溯流而上。涨潮尚且顺溜，一落潮则一篙点下去仅进半尺。抵中村时夜色已浓，政所来人接过簿子，先打量我湿透的袖口，再掀开账册，竟分毫未沾水渍。返抵下田，母亲托起我的手掌，翻过来瞧瞧掌心的水泡，只说明日另换根轻细点的竹篙。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_0:event:share","text"],null]']
src = "blake3:0f4bc4e9bc00407a4a31747496ddd65b12b1c5a251d78d20e25c5342a2be76d3"
text = "领下送账差事，独撑前往"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_1:event:honest","reply"],null]']
src = "blake3:815df4126848d9d59798e027e295d1b41d72f1de55f56055139d2b697e6897a3"
text = "我坦白相告，三载数额齐列一处，瞧着便眼花缭乱，行次上下全搅混了。母亲并不笑话，只把那张抄纸折去半幅，单露今年与去年两列：“先比这两年。”那日我虽仅看透两行，她却额外指点了半个时辰。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_1:event:honest","text"],null]']
src = "blake3:4e03da22b85bf52a9be7a2a45f8c8aac20618f69dff60446150d79af56a4bc03"
text = "直言尚理不清三年账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_1:event:share","reply"],null]']
src = "blake3:9c8d36bc99500d618a59b6a30d0e3ceec8650657a0c7ef1b38ba70134bab3eb1"
text = "我随运粮牛车去了那座庄子，见临河一丘稻田曾遭水淹，稻根犹发黑。归途绕道下田市集，连询三家今岁米价，较去年涨了一成。回府后我在账页空白处批注：短三袋，因一丘田受淹；且米价腾贵，庄户家中也得吃饭。母亲阅罢未改一字，径将朱笔架回笔架。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_1:event:share","text"],null]']
src = "blake3:cac0c7941b545390f2a2b043ba1fefe8cb176c5cf81838c4745f26bc9c1bde15"
text = "往庄子与市集探明米价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_2:event:honest","reply"],null]']
src = "blake3:fd27bd198c70cecdd378b2dc7a3506e61620bfeb8ea65b9fff179e251c2cf878"
text = "局中只有上臈和典侍方才熏香，见习要到次年才学。我只隔着纸门闻过，喊不出名目，胡乱写去怕教母亲笑话——回信里便这般照实写了。从前的约我并未忘：待习了闻香，头一遭辨准的那一种，必先写与她。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_2:event:honest","text"],null]']
src = "blake3:86c7d452ccee68b216eeed306e22bde6e1fbaaeabf49cdb62a5ad0c23c39c11e"
text = "照实回说还叫不出名字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_2:event:share","reply"],null]']
src = "blake3:d9e3be1da24e50fee37e45d9a313c16a75f15e685233ea41bf71a16bac6cc7d9"
text = "入宫那日，上臈局里熏着一味香，甜中带苦，宛如雨后的杉林。我还不曾学过闻香，唤不出名字，索性写成一首歌：京里的香，闻着却是幡多的山。挑最好的一张怀纸誊好，角上画一枝杉，托往堺去的人带回土佐。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_2:event:share","text"],null]']
src = "blake3:984094474fc6b9a7c733968276c9cf2d98921188991779d0a1f0ebc8d4b13c89"
text = "将头一种香作歌寄回"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_3:event:honest","reply"],null]']
src = "blake3:79873f348dae3dc47af9ccc939eadd91aeeeca7fb04359b82df7e16f322c97f9"
text = "盆前局里要抄经、办供物，老女房半刻不肯放人。我如实去信母亲：这个月下不去淀津，实数一时拿不出来；可把米运入京中卖高价，我仍这般盘算，待秋凉亲眼看过再与她分说。封好信，我才觉出字句写得生硬，思量半晌，到底没拆开重改。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_3:event:honest","text"],null]']
src = "blake3:1f4ee25deb692abab332bb58db8f548cfebde0dad5663382912b3672b2c73367"
text = "直回说盆前离不得局"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_3:event:share","reply"],null]']
src = "blake3:d070972cf784b8f12bd3124abb535584e9296acb6fe7954d014608fe33add58d"
text = "我借了本家杂掌一顶市女笠，随他自淀津乘运米川船顺流下到枚方，又搭空船逆水折返。上行船只专拣贴岸的回流走，一篙撑去才进半个船身；逢一处关停一回船，缴钱、清点米袋。我把关数、钱数连同走了几个时辰一并记在怀纸上。回来一核算，原本的差价竟被关卡折耗去一大半。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_3:event:share","text"],null]']
src = "blake3:c1132dead6b9609da32ad484ab7063f3f34de8cbc4e3cb726a3646c2edde6089"
text = "随杂掌赴淀津察看川船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_4:event:honest","reply"],null]']
src = "blake3:0c70ab17b7cfd6336bd3f1b6e580fe18ba42655e3fe1f86fc18f9c5183048a22"
text = "新春局内行事接二连三，我连誊抄日记草稿都要熬到夜半。遂去信禀明母亲，今月账目难记周全，且将记得住的记下，待下月起再逐笔不落；复把兼定取的那刀纸补录进去，省得政所借此拿他做话柄。写罢清点，漏记的竟有七八日之多。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_4:event:honest","text"],null]']
src = "blake3:11514a801201c0be634a525f34fe5dde312e505a37569e27f7fe834dc3c101b0"
text = "禀说开春忙顾不上记账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_4:event:share","reply"],null]']
src = "blake3:52a6ecec94b23a1e58d512be1c97fc420b2c112caa4cdac2abfde28cc91c7e4c"
text = "我到下京问遍三家米铺行市，挑出最贱那家结成月账；送礼用的绢专等堺船抵岸那几日置办，便宜了两成。账册全用假名记着，兼定的纸、汐的草鞋、我用的墨，一笔一笔都在里头。月底封账前，我在末行补了一句：本月较上月省下的钱，够买三斗米。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_4:event:share","text"],null]']
src = "blake3:df3d6c2fe3e1e7aa2a02bacad77c25bc593e0efa129c5a804b71bb1b46d13867"
text = "接过京里的账册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_5:event:honest","reply"],null]']
src = "blake3:0facd545888b6d5df16a1632d045abcc578a7a81705b27805a508dd178272ce8"
text = "本家家司迎在廊前相拦，言及房通大人入夏以来咳疾甚剧，连日概不见客。我遂将香木依原样包入油纸，藏妥于经箱底层，致信禀明母亲：眼下无从奉还，此番回土佐亦不携走，暂锁在本家处，待入秋返京，大人能够起身坐定那日，我再亲手捧去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_5:event:honest","text"],null]']
src = "blake3:54bdf10d533f7f24fc3abd3f973996a3bba4a7927425817ccbb5fd49c51e35f0"
text = "候房通大人痊愈再还"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_5:event:share","reply"],null]']
src = "blake3:443df7a69ceee953eda4e0af96f811c6cd35c056c42d4a13273cd458b4638cdd"
text = "房通大人倚着胁息，命人切下米粒大的一片，放上云母片。细烟升起，他闭目闻了好半晌，说这是真南蛮，比他儿时闻过的还要沉静。我将薄样上的“借本家”奉给他看，吟了一首歌，说此香木在南边的海风里熟睡了八十年，回来竟还认得路。他眼皮未抬，仅道：“还得甚好。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_5:event:share","text"],null]']
src = "blake3:284a1b492dcc45e1ca8da32f399dba013035cd63176987fbc2b0f63739323020"
text = "携香木往房通病榻前"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_6:event:honest","reply"],null]']
src = "blake3:ab3259f9d066c8b6e30de3f5a04cf8c9e6d390438f5d3df25e7c916f255f58f6"
text = "我回信说，后两件皆应，唯头一件此刻应不下：船头朝向何处，得等我相过那年的风再定。搁笔前又添一句，堺我必会去，只不敢应承是在头一趟。那信折了三遭才封严实。汐在旁看着我折信，悄悄说：“夫人瞧见这句，怕要把念珠都拨断。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_6:event:honest","text"],null]']
src = "blake3:1413d3d0f5a22079998796d4e22180681d76ef476bdef661c485c53bf9759475"
text = "直回说头一桩应不下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_6:event:share","reply"],null]']
src = "blake3:ec74f4aa32b1b4fc1c2579e0c9b3bd8e411292fbb2a248b64d0717b4427c67eb"
text = "我在回书中将那三件事重誊一遍，每桩后各注一个“应”字。至于那张港单，我拿去请教年年替本家运米的堺船船头，他讲一个港，我便录一个港：甲浦门户窄狭，非待潮涨入不得；牟岐外海暗礁密布，退潮方见白浪翻卷；纪伊水道的潮汐一日四易，赶岔了便要被推返。纸上空格就此填满了一半。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_family_bond_mio_mother_6:event:share","text"],null]']
src = "blake3:8696a56471855eb36c16201c8a2f65a92450f8f3e939a3440a08cd05b19b87a1"
text = "承下三桩事，去打听港潮"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1553:event:help","reply"],null]']
src = "blake3:56badc26c543ee92505a5449945e5fb610a1e58042b0aeeab1f9ce0ed2918e34"
text = "我蹲下身替她扶住船骨，她勒一道绳，我便按住一道。船扎妥了，她往舱内塞进两条小鱼干，道是能岛那边过世的人好这一口。入夜后，小船随着退潮漂远，船头那盏豆灯摇摇晃晃，越过沙洲便没了踪影。阿濑立在原地一动不动，许久才说：“明年换你来扎。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1553:event:help","text"],null]']
src = "blake3:d4536ed718cf883bd3bdd8afa8fd892ee2eec401b111a2bcc7a5a38bd3d76685"
text = "帮阿濑一起扎精灵船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1553:event:learn","reply"],null]']
src = "blake3:9b33c4209337ef6eb80505c4d0b6c7c6c6722d9706fcf22163119f1e0b5d1331"
text = "我随在踊队后头一路走到渡口，借来鱼贩的木箱权作书案，用假名将唱词逐句抄下。念佛声后头掺着几句幡多土话，连问了三个人才写准。汗水滴上去，把纸洇湿了两块。归家重新誊清时，那个“踊”字的足字旁老是朝外飞撇，仿佛还想追着踊队去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1553:event:learn","text"],null]']
src = "blake3:56344076f45cbdbb96302453ad23199a6b21d8b5119dfa90fd51444eae404579"
text = "随踊队把唱词抄下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1554:event:help","reply"],null]']
src = "blake3:f77c33673f242c30bb1ac6779ed8bcb771d5805b46a98f3e05567354d41b68be"
text = "我在四条的铺子里拣了盏画着浪的小切子灯笼，同汐拿蜡纸包严实了，装进一只空茶箱，托返堺的船带下去。十月里，下田的船夫上本家送货，捎来阿濑一句话：灯笼没赶上今年的盆，她就悬在网棚底下，渔家的孩子日日来数上头画了几道浪。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1554:event:help","text"],null]']
src = "blake3:ca1a72374eb42dda5fda5bb5c49795b7a0a9167671ab764244fb952a5a33e822"
text = "捎一盏京里的灯笼回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1554:event:learn","reply"],null]']
src = "blake3:3b863dc380bfde3acb0d28ca57e73a8fbf550a5c304019ee92c04b0ad930247d"
text = "各家献来的灯笼都须挂一枚签，写明属于哪一家、哪一位。我蹲在廊下写了二十多张，近卫、三条西、广桥……家名里差上一笔，便是得罪人。轮到一条本家那一盏，我先洗净了笔才落墨。老女房走过来看了一眼，也不作声，将余下的空签全推到我面前。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1554:event:learn","text"],null]']
src = "blake3:aea24137852663a99fa644a03b849e413e1b8a8c8329ace1cbe04cefa30997de"
text = "替局里给盆灯笼写题签"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1555:event:help","reply"],null]']
src = "blake3:1c57120fab3738a6edc6b4243738564686e6da5b8a60075c3dacff90c650e8cc"
text = "我不管她让不让，抱起漂木便往滩上走，按能岛的规矩架成井字。阿濑跟在后头，嘴上说着“歪了”，手却替我扶住了最顶上那根。火点着了，河口水面泛起一片红光，对岸也燃起了火，一处连着一处，朝上游延伸过去。阿濑盯着火苗瞧了半晌，说：“姬君的胳膊长粗了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1555:event:help","text"],null]']
src = "blake3:b3279113c2253fa9b1b13b05623e9fed28198d092705bb62a742a1744d094e8e"
text = "帮阿濑把送火架起来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1555:event:learn","reply"],null]']
src = "blake3:0ec88f4ce66e41b463d169b932bedc512696037168eb732d342809e971846c24"
text = "我向渡守借了门板，把四条一带唱的踊歌逐句写成假名，字迹比在局里大出三倍，方便后排的人看清。年轻人照着唱，满口土佐腔把京里的词唱得七歪八扭。写至第二块门板，墨快用完了，我兑进海水接着磨，墨干以后，字边竟洇出一圈白盐。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1555:event:learn","text"],null]']
src = "blake3:3fb89c39c975323db6fb1af9dba24931e0a929fb488f2313daafb0eee9769005"
text = "把京里的踊歌写与渔家"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1556:event:help","reply"],null]']
src = "blake3:a8838f3463a720a29802212d46cd0c324e3278709f28a27f46e01d3950c3506d"
text = "我上针铺拣了一包粗细各异的针，补网的、缝帆的、缝衣的都有，拿蜡纸逐根隔开，掖进行李最里层。九月初抵了河口，阿濑接过来，迎着日光一根根察看针眼，看完仅说了一句：“京里的针，眼开得周正。”当夜她便用新针补起网来，领口上那根旧的照旧别着。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1556:event:help","text"],null]']
src = "blake3:6ff115cb7b597ddc2f6d4c1bf2348b97a7e3f2293ff3c7b229947105733cfaed"
text = "拣一包针带回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1556:event:learn","reply"],null]']
src = "blake3:9da1b48e62fab4bd0f035f8530b38365cd4f1458a6ecb33754d207c5f57c082c"
text = "宝镜寺的尼僧于盆里代人写经木：薄薄的小木片，一片抄一行经，再添上供养人名讳。木头吃墨极快，笔头一顿便是一团墨疙瘩。我跪在经堂里写了整个下午，末了一片写父亲的法名，落笔极缓，半个疙瘩也无。尼僧收走经木时，特地把那一片搁在了最顶上。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_bon_1556:event:learn","text"],null]']
src = "blake3:4f8dc7130e93a07dc3134087c229f7c9b741e12fb694d4753e8fd4b494247399"
text = "上宝镜寺写经木"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1553:event:help","reply"],null]']
src = "blake3:669176a2226c9b777c03d52cf4532bc6a084e5e8599c0631479222088c7f25ee"
text = "当夜我将红绵覆在中村御所篱下开得最盛的一枝黄菊上，天未亮便去揭取，露水濡湿了半截袖管。我连菊带绵摆在母亲的经箱旁，母亲问起是谁的心思，听说出自兼定，手里念珠顿了一顿。冬至前，兼定又捎来一行字：“姊上擦过没有？”那一行他落笔太狠，将纸都划破了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1553:event:help","text"],null]']
src = "blake3:10817ff2fffcb1685e597cd746ca48bf80d04965f56f1a101c1bd5560c7f972b"
text = "趁天未亮去中村折菊"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1553:event:learn","reply"],null]']
src = "blake3:0e6b24a41d2517708a2f9e9f3b053bb37dc55b298ffd932dad7d285b3044a4fe"
text = "我循着家里传下的《古今集》写本，把“菊”“露”“千代”几个字逐个写大，拿朱笔在旁点出落笔处，写了满满三张纸寄回京去。“菊”字下头的米，他每回都写成四点散沙，我单写了十遍，嘱他照样描红。末了又缀了一句：描完了寄回来，我要查验。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1553:event:learn","text"],null]']
src = "blake3:c43e7eb6cfa14828603b3a6a3276696bcd4e28c3ccba67144e32364bed555c2e"
text = "回信抄字帖教他"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1554:event:help","reply"],null]']
src = "blake3:82fe4fe2b8b0087fe6fe093a590ac938c6cebc45ed57b6cb188b3cd831eecfcc"
text = "我也不说他错了，提着灯跟在后头，声称也想习一习土佐的盖法，要他教我。他示范一朵，我便“失手”换一朵的绵色，换到最后一畦，连他自己也瞧明白了，耳根涨红得同红绵一般。翌日一早，他将一片吸足露水的白绵递来：“姊上先拭。”浓郁的菊香扑鼻，冲得我打了个喷嚏。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1554:event:help","text"],null]']
src = "blake3:1592b4c06c51829929b4575a1dc399f5f27fe6f4793c7b40743fefe1a6d9afc7"
text = "随他去学“土佐盖法”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1554:event:learn","reply"],null]']
src = "blake3:12f3c19ae490d2a6089975b75c8ff654c163c1680f2395a69d0a139d09d8b2f2"
text = "回到房里，我将盖绵的规矩逐条写进假名小册：几时该盖，几时该揭，什么颜色衬什么花，揭下的绵如何擦脸。写妥后夹进兼定的习字本。隔日他翻见了，鼻子里哼了一声，却还在白菊那一条下头，用他那手歪字添上一行：“土佐另有盖法。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1554:event:learn","text"],null]']
src = "blake3:a53794dc6f25d6256669840e992233faeec58abbb95b7aa6ee14c2a1f7c3562b"
text = "把盖绵的规矩写成小册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1555:event:help","reply"],null]']
src = "blake3:31c033c63b1ef815e070d95dca2403876d033dec5add291c9de4f7e39cf3e7af"
text = "我俯下身去，把能岛那颗栗子推到两堆当间的一条空水道上：“能岛的人先看潮水，再看谁给的钱多。”兼定不服气，说那不就是墙头草么。我拿过他的毛笔，在饭团之间画了几笔潮线，告诉他哪一道不出一个时辰就要改向。他盯着看了一阵，抓起一把栗子塞进我掌心：“姊上剥给我吃。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1555:event:help","text"],null]']
src = "blake3:ea32936e0d630abfea4bb9e3f16de0d311dde0021778f4116ca00637e631ef2a"
text = "陪他用栗子摆完海战"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1555:event:learn","reply"],null]']
src = "blake3:00b5c8b51c77c756513d54b70d365ed0c03c6f1dad6e22841d3b672d5ebb8898"
text = "我给他那些饭团逐一添上名字：严岛、能岛、来岛、因岛、大三岛，字收得极细，密密挤在诸岛之间的海面上。他探过脑门来瞧，说姊上的字小得像蚂蚁，偏偏没有一个歪的。待写到来岛，笔尖漏下一滴墨汁，正落在他画的海里。他说那是一条船，不许我擦掉。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1555:event:learn","text"],null]']
src = "blake3:8722dcf846680f64764195c04dcbb2ffbb9bc39940fd49137b6d1abde349f495"
text = "在海图上替他注明岛名"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1556:event:help","reply"],null]']
src = "blake3:2514a732e3f43521f08aca1dfdc407ac6535ddbba1650ac0f807838d1a4becfe"
text = "我伴他进去。房通大人睁开眼，兼定跪下将绵铺开，替老人擦了额头，手一颤，绵落在了被面上。老人笑出声来，又紧接着咳了半晌。出来后兼定步子迈得飞快，直到廊道尽头方停步，拿衣袖朝脸上一揩：“菊上的露水，冲眼睛。”我说可不是，我的眼也冲得慌。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1556:event:help","text"],null]']
src = "blake3:52039adc5e2763e007ce8f4e7fbcc8947fe491bd8d724ed4cf1f7ec52cb81863"
text = "伴他把绵送到病榻前"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1556:event:learn","reply"],null]']
src = "blake3:b2762c471effd5fc2d4990e433411ed99e16935279a6442435cb452d7bbda7e0"
text = "我说绵上理当系枚短册，便替他打《古今集》里拣出素性法师那一首：山路间沾一沾菊露，衣袖尚未干透，尘世已越过千年。使着宫中最细的那支笔，我接连写废了四张短册，“露”字收得太胖，“千”字那一横又拉得过长。直到第五张方才齐整干净。兼定逐句跟在后头念诵，念到第三遭舌头不打结了，这才肯将短册绑上去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_choyo_1556:event:learn","text"],null]']
src = "blake3:65e8dd3146f30ff6aae8882a5484f11580c780d983f864fe2e4ec67406544bb9"
text = "替他题写献菊短册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1553:event:help","reply"],null]']
src = "blake3:952836d1ab20056c4b8ef9e296d3d6feade897bcce5a5deb9700c0b9365380e8"
text = "我挨门逐户去打听，两枚永乐钱兑一枚嘉定。换至渡守处，他说手头那枚是祖上传下来的，不兴兑换，白送给了我。十六种点心置齐后，我分了一半予阿濑。她嫌甜腻，每样仅仅咬了一口，剩下的拿荷叶裹严，塞进装补网物件的筐里。翌晨我撞见她坐在网棚下，一边补网，一边却又拆开荷叶啃了一口。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1553:event:help","text"],null]']
src = "blake3:0fffeca707c69ebb3539303bb55eb4b39332161c56fb0e065a4a23801522f951"
text = "挨户兑换嘉定钱"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1553:event:learn","reply"],null]']
src = "blake3:bf4265a05fe03668d5adf1a4e044f4c2d3313c97be911fa675d8bfe982d3a626"
text = "十六色点心码在两只木盘中，我在每种前头立了一张小签，标明名目：葛饼、蒸羊羹、馒头、豆饼……写到第九张时，阿濑言道渔家娃儿不识字，写了也是白费功夫。我便把“馒头”二字描得圆滚滚、胖墩墩的，活脱脱就是馒头模样，孩子们一望见便笑了，纷纷指着那张签讨要那样。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1553:event:learn","text"],null]']
src = "blake3:fa941041f7175e2de3c3ed41d11041be18954a87c67541432769e0e09934ab8d"
text = "替每种点心写张小签"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1554:event:help","reply"],null]']
src = "blake3:411466acc60106f64f7c7c07ccd45072de52f0009d08a1f8e1c420fb8208ce67"
text = "那串钱我一枚也没舍得动，另上三条的市集买了卷细麻线，交由去堺的商船捎下去。入秋汐收到她娘托人带的口信，说那线补了网眼最密的那块，补完见谁都念叨京里的线不起毛。汐学着她娘的调门讲给我听，学了一半自己先笑起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1554:event:help","text"],null]']
src = "blake3:4eb0b3fe601214911ad2600678d20da08db4904a91694cffaf95589420f6a13d"
text = "捎回一卷京里的细麻线"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1554:event:learn","reply"],null]']
src = "blake3:da1ff8181974ddd2787ce916c375786a40b28d0c41c8331785ef6f928ed1900f"
text = "分派下的点心须得入账：哪局得了几盘，由谁领走，谁还未到。我将账单用假名抄出两份，一份交由老女房，一份留在局里。老女房拿扇骨戳着那个“馒”字，嫌食字旁撇得像个跪着的人，命我另抄。等抄到第三份，她便不作声了，把扇子揣回了袖中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1554:event:learn","text"],null]']
src = "blake3:af5ea38640897ad532c4ab2fbf16ab8d816b8f2f0bdcb117e47aa636f66ac298"
text = "誊抄分点心的账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1555:event:help","reply"],null]']
src = "blake3:0626296e7168c1e261c9d12f35bc0a9b466186c92ea4b3b743f8570d8bd5e137"
text = "我跑遍三条、四条的好几间钱铺。铺中人挑剔钱币比阿濑更甚，破损的、私铸的概不收受，嘉定钱倒肯对换，只是得另贴水。凑足十六枚，我拿麻线穿妥，八月乘船回了趟下田。阿濑接过来，择出一枚放进嘴里咬了咬：“京里的钱，原也是这个滋味。”她将那串钱悬在了网棚的柱子上。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1555:event:help","text"],null]']
src = "blake3:5961e414dca0f63e0672fc0ffe8ccb5bd3796f94e61fa5ce1e989211b4befb23"
text = "去钱铺凑够十六枚嘉定"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1555:event:learn","reply"],null]']
src = "blake3:027e4be9154b3775289599ba760d04302ec79493f7b590005f40993c457373fa"
text = "当夜我侍立在典侍案旁，代她将日间诸事起个底稿：嘉祥之日，各局分得几盘点心，哪位卿献了何物。女房词里，点心与年糕各有宫内的专称，若写成外头那套叫法，便显得生分外道。我翻检往岁旧册逐一核对，誊罢天色已明，砚台里的剩墨早结起一层皮。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1555:event:learn","text"],null]']
src = "blake3:0d74b132f1bb9f344c2a76833bb3b69770e1ae2ee9c9ee826d164fe802fcbc43"
text = "将嘉祥记入日记底稿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1556:event:help","reply"],null]']
src = "blake3:13679a3387e5919ea418be13f2d1da0797a155eab03ae758cca5b9f99972bb7d"
text = "我依了她的话，半点甜食也未买，央汐上市集捎回一罐梅干，让紫苏染得通红。九月里下了船，阿濑伸左手掀开罐盖，低头一闻，酸得眯缝起眼：“这东西好。”她当着我面含了一颗，又塞予渡守一颗，道是谢他替自己代笔写信。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1556:event:help","text"],null]']
src = "blake3:35e71f2e9f9cf8812ee0db9520b04e9b24498f8f03b00a3d42cd74abb2ed19bc"
text = "依她的话捎梅干回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1556:event:learn","reply"],null]']
src = "blake3:aaf6cf7423a64c8bbb44747510e3069fe712671e410bb6a9f54da2ae40f5d36f"
text = "我换了一支最粗的笔，一行仅排五个字，尽挑她认得的几十个假名来写，既不落汉字，也不用女房词。写罢提起来端详，活像幼时在木札上记帆别钱，一个数字占定一格。信末我写道：二十枚，回去我数，一枚都不准少。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_kajo_1556:event:learn","text"],null]']
src = "blake3:bf01f8cd92c4ce8b3f2682f95ed6e5b2d84da9bfa1db391ce1445ff5a93a6a85"
text = "写大字假名回信给她"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1553:event:help","reply"],null]']
src = "blake3:11b30c0ec7a221775283bb2192ea70b0e3c85327510feca51ea99c3935f7c1c8"
text = "我把芋头挨个摆端正，又跑去河边折了几枝芒草添上，草穗还湿漉漉的。母亲说，供月的芋头得剥掉半边皮，就像月亮只露半张脸。我们俩一直剥到半夜，手指头都黏住了。等她剥完最后一个，便拉过我的手，用自己的衣袖一根根擦拭干净。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1553:event:help","text"],null]']
src = "blake3:670babe7a4e919ce745d1a4cd9f2af7d67af2ce72176670e24bf56bfdf89374a"
text = "帮母亲剥起供月的芋头"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1553:event:learn","reply"],null]']
src = "blake3:692d8426fe93fe464f05be4f8b542888a6c4d7b8e2aa0a9b6a797c882c03a3e7"
text = "我进屋拿来怀纸与笔，先录下她的上句，底下一片空着待填下句。月色暗淡，母亲便唤人移来一盏灯，坐在一旁瞧我落笔。她嘱咐我，“月”字的最后一笔得收稳，可别甩出去，否则月亮便要跌进海里去。我一连写了七回，到第七回，那轮月亮总算稳稳悬住了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1553:event:learn","text"],null]']
src = "blake3:6c814de828f55c95bf98d585c4ec1be309bc0ba297ac0f21bcdc74851fdc6515"
text = "先录下母亲的上句"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1554:event:help","reply"],null]']
src = "blake3:146c9b2cf52f3ac958ac131a23547809ac0235bf2a822e3f722bbf75fb070678"
text = "我在局里摆了三个芋头作供——再多便要遭老女房数落了——望着月亮苦想了大半宿的下句，写在回信末尾寄往中村。入冬后母亲捎回只言片语：“下句已收，粘在粮账头一页了。”那页账的模样我闭眼也想得到：上端是她的上句，紧挨着我的下句，再往下便尽是稻谷的数额。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1554:event:help","text"],null]']
src = "blake3:09ab9c4bfe35c88fe024291727822ca07ad92885ebee01fcda7c5b74c7df08bb"
text = "凑出下句寄回中村"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1554:event:learn","reply"],null]']
src = "blake3:357ddf57a7c6362dfeb5c5a68a76116280d5a7c95792aebcd41bf4a335ef7283"
text = "歌会散场后，典侍收齐众人的怀纸，命我们几个见习各誊一份留底。我领到的几张是公卿所作，笔迹有的端庄、有的潦草，全得抄成清清爽爽的假名，半字不许变动。待誊到一位老卿的怀纸，字迹实在草得难辨，只得去请教广桥典侍。她端详半晌，也笑着摆手，让我照着模样描下来便是。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1554:event:learn","text"],null]']
src = "blake3:3de7ea09c6140fa76829ace642afe6f7f78052add835a58a52167360bba14c14"
text = "抄录月见歌会的歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1555:event:help","reply"],null]']
src = "blake3:5c7e8a4d9e6c814b96d73a1f8b55693c707848159b6f1cf280f9277257208263"
text = "十五夜当晚，我向局里借来香炉，在廊下隔着帘子烧了那星香木。初起烟气发苦，继而转甜，末了隐约透着几分下田退潮后海滩的气息。我据实回禀，连“像退潮后的滩”一句也一字未漏。母亲来信说，她替这香木取名为“潮干”，手边留着的那半片已收入经箱，待我归去再同嗅。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1555:event:help","text"],null]']
src = "blake3:f831cd47d72114d129672b81a1bf8d2b2fd93a328d374b56d12c63c4fab083c7"
text = "月下焚起那片香木"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1555:event:learn","reply"],null]']
src = "blake3:9c1bc661b78864bcce41d04d5b72b212560220ef06667a3c7e94593e58c1aa9a"
text = "我依着闻香的规矩替香木制了张签：上头先空出香名，下边依次记明出处、日子与赠者。纸签仅两指来宽，字迹既要纤小，又须一目了然。我先拿指甲大小的碎纸试笔，待墨汁不再洇散才敢往正签上落，写好便同香木一并装入锦袋。汐在一旁瞧着，打趣说姬君落笔比数钱慢多了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1555:event:learn","text"],null]']
src = "blake3:93d8eb8d32d0ae2fdb6ee64fe3b6968357a8a238c4d55cd22c073f7e133bd798"
text = "替香木制一张香签"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1556:event:help","reply"],null]']
src = "blake3:08ab32b54c07bce62bfaf8905da08bd3b6294ae08694e2b150c199092f3de551"
text = "我不慌着开口，靠着她坐定，动手帮她剥芋头。月影从河口缓缓移上御所的屋脊，她指间的念珠又一颗颗转起来，比往日慢了些。直等到天将放亮，我方才吟出上句，说的是潮退了终究还要再涨。她随口接了下句，嗓音极轻，我并未听真切。她道听不全倒也好，余下一半留着让我上京后再细想。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1556:event:help","text"],null]']
src = "blake3:bf47cf670f97c701a33e213ebe0c457b96a940031d8825cc850815d39de3b4ae"
text = "伴母亲坐至月落"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1556:event:learn","reply"],null]']
src = "blake3:b19a1452027dea5b960ced9a78801495b4c6a6ce27bb7a7a4511d4744c20ca2e"
text = "我起了上句，她便续了下句。我说该落到纸上才好，她唤人拿来平日抄经的料纸，纸质厚实，吃墨极深。我将上句书在右侧，她把下句题于左旁，当中留出一指宽的空当。她端详良久，言道我的笔力比她更沉，只是笔尖还不知收敛。那张纸经她叠好，压进了经箱最底层。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_moon8_1556:event:learn","text"],null]']
src = "blake3:aad37a84e3fe01888a658dbcfcb1a22900707f0a5481950cb6bb05848ec04613"
text = "将两人的歌合写一纸"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1553:event:help","reply"],null]']
src = "blake3:3da03e2eedb3d5f6183887e9f9ba3fec92f81f124e64d41eb339746c8d3b2fd7"
text = "我尾随她登了舟。竹筒盛的酒，船首、船尾与桅杆底座各酹一口，余下最后一口她递给我饮了，辛辣得教我连声咳嗽。她荡着橹在河口绕了一匝，复又把橹柄塞入我手，让我自行摇归岸边。我把船头摇得直打旋，她也不嗔怪，只蹲在船梢发笑。待泊岸时，朝阳方才露头，她说道：“今岁的船灵认得姬君啦。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1553:event:help","text"],null]']
src = "blake3:00fe8bdeab6c6948112820f35daef074e80a88006173edc267603195ab0d325a"
text = "随阿濑行乘初去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1553:event:learn","reply"],null]']
src = "blake3:637efa2f55fabf4134bf126704b50988993e521f22589da51db6d159bfec1feb"
text = "我终归还是先返了中村。吉书乃开岁头一回悬腕动笔，母亲展平奉书纸，命我书写以“春”字发端的吉庆之辞。十指冻得僵直，头一幅里的“春”字，最末一捺竟震颤作波折状。我将双手缩入襟怀焐暖了，重又写了三张。最末那张被母亲收存，言道拿去教政所诸人瞧瞧，一条家的姬君，笔骨原是端端正正的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1553:event:learn","text"],null]']
src = "blake3:0f5cff3faad4128441d2042a8497a816d45bfc41efe0933835017fb8be53a89c"
text = "先返中村书吉书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1554:event:help","reply"],null]']
src = "blake3:73c48667edabd0a897f3d99115c1c7f1ff301a64d861d0a9c3cce11912a5f7b8"
text = "正月初一业已过去，我便挑初四黎明未至时步入庭院，彼时严霜正将园石冻得泛白。我面朝西方肃立，汐立在身畔，学着她娘亲的派头拍了两下掌。三月末下田寄来复信，仍是寥寥一行大字：“心意已拜到。正月里头渔网一回也未曾破损。”汐读罢，将信笺叠成方寸小块，悄悄塞进了自家袖中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1554:event:help","text"],null]']
src = "blake3:a065ec8f4f84a82f20910dd05213743b51ff575d07ccd35201eb1c35df3343e8"
text = "向西边代阿濑拜一拜"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1554:event:learn","reply"],null]']
src = "blake3:da3041d1d8756b902723db29185d0347b95903f0a87df9a4adb1bebe35e7ec4d"
text = "本家的老女房嘱咐，贺状须使散书体：字迹不整排成行，只错落高下洒在纸面，宛若飘落水面的花瓣，却又须教阅信人一眼辨明起首所在。我代本家拟与广桥家的那一通贺状，直写了整整一上午：铺散开来，辨不清首尾；拘束收拢，又团挤作一处。直至午后，老女房方从中拣出一纸：“这一张，花瓣总算是浮上水面了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1554:event:learn","text"],null]']
src = "blake3:ab8791abb5b6cb78eab8493a545cd2e86e33c2dc3bf9b0a0ec61f1f4dfe4461d"
text = "习写女房的散书贺状"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1555:event:help","reply"],null]']
src = "blake3:67690c74d0864670e379d79ad0386a3132e1dbf7255c90071a99a2dc0b9f1940"
text = "我拿细绳捆住长袖，蹲在炭炉旁一条条翻炙鲷鱼。老妇起先不肯教姬君沾手烟火，后来索性坐在一侧教我刷酱。二十余份膳席，每份匀一小块，末了一块烤糊了，我便自行吃掉。回信时我据实相禀：鲷是自己烤的，焦了一块。待下田的船再来，已是桃花盛放时节，阿濑又请和尚带回一句：“烤焦的那块合该分与汐。等姬君回了下田，我在炉边教您怎么翻。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1555:event:help","text"],null]']
src = "blake3:163bcdf276ec60df4b3d5bf18ff5ead287ea30029d508b3357dec56f2e70b850"
text = "下厨炙鲷，均分众人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1555:event:learn","reply"],null]']
src = "blake3:02bcf11ddbdd7fafe29ba926614af7fd8b0ff2c54924487bfe54cabccdc50cc2"
text = "家司言本家写吉书自成章法：首题“天下太平”四字，下接自家写的歌，署名落在左下方，较歌行低出两格。我书写顺遂，兼定却犯难于那个“平”字，末笔长竖拖得太冗，纸幅盛不下。我教他落墨前先在纸背掐道印痕，悬针行至印处便收。他废去五张，及至第六回方总算收住笔势，旋即偷偷将纸团塞入我袖间。家司收过我们俩的纸，称许今岁笔迹甚有骨力。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1555:event:learn","text"],null]']
src = "blake3:91a82e7943c63c47495b2e0bf1937826cd0ce0abae95884d72367ad6bb3ee46a"
text = "循本家体例书吉书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1556:event:help","reply"],null]']
src = "blake3:4cf7b714a14300273a03d258951a41d56cfd6dedbfe5a597e828b0f011e9a2c2"
text = "我同汐各自换上新足袋，踏雪行至鸭川岸畔。荠菜深藏积雪之下，汐徒手扒刨，我折了一截竹枝撬挖，指节冻得通红，直到采满一篮方才返家。七草粥捧上案来，房通大人用过半碗，又命人续添了半碗。复信中我特意绘了两串雪地足迹。待四月下田回信寄至，言道阿濑竟将那张画纸钉在了补网棚的木柱上。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1556:event:help","text"],null]']
src = "blake3:89e34e15296f9a943d1ca7b701e97b74543acf856b422124bfea23cb43a9c746"
text = "着新足袋，往河滩采七草去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1556:event:learn","reply"],null]']
src = "blake3:f0e33868ea14572631ade6a2123e5dc97e4c901f329324a74e8181a6f5335963"
text = "包纸原是旧纸回用，经熨烫两度，边角早已起毛，毫端一落墨便晕开。家司提点我行笔须轻且疾，名目应落在折印偏上约一指处。我连书十余纸，手腕悬空得隐隐发酸，及至末了一张，化开的墨晕已缩得仅如米粒大小。家司遂将此张压在最上首，道先送近卫家，好教他们瞧瞧一条家的字迹。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_new_year_1556:event:learn","text"],null]']
src = "blake3:8e749490114434d178d537a33b97afd74bb4ae6c905b292689f5a4a8e9022c4f"
text = "代为年礼包纸题写名目"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1553:event:help","reply"],null]']
src = "blake3:b3e33ec1312df412fab9666e66d7ab759570a8164e3055541db4a983a6d2b456"
text = "我挨着母亲那只盥，多放了一只小碗，并供上一束五色线，权作兼定的席位。入夜后水面映着织女星，我连那小碗中的星影一并数过，写入复信：土佐的星辰并不比京都多，只是今岁多为你设了一座。月余后他再来信，劈头便是这句：“姊上替我摆的座，比京都任何人的都远。我告诉家司，他还不信呢。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1553:event:help","text"],null]']
src = "blake3:479f2f024ba085fd340b824cb1fac1ccc28430b5ffb427d5b4e9ea674345bba2"
text = "替兼定也设个星之座"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1553:event:learn","reply"],null]']
src = "blake3:358696dec2c0f2511288afd83d714d34a16078f44850a4fcc21de1119ca0392b"
text = "梶叶背面生着一层细茸，墨汁一触便四散开来。母亲教导我先以指甲轻划一道痕，再顺着叶脉走笔。接连写废四片叶子，直待第五片方将三十一音尽数排入，末一字紧挤在叶梢。思及叶片夹在信中寄抵京都恐早已枯萎，我另在纸上依样誊录一遍，一同封妥，托了驶往堺的船捎去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1553:event:learn","text"],null]']
src = "blake3:4bc4bbb7248ac85084e01353c4398cfbaad064e217b5ab81d5eeff5ae923e0a5"
text = "写一首梶叶歌回他"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1554:event:help","reply"],null]']
src = "blake3:b0dc49f5df3b8cd8e2753c9dff24530f7657c0b1987e9fe45c4f76f6e8796af7"
text = "我拽着兼定来到井畔，两人各提水桶一端，泼湿了半截袴。摆妥盥后，我凑在他耳旁逐句引着念，他随声诵读，至第三句竟自个儿顺畅接了下去。内基扯住他衣袖仿效行礼，险些一头栽进盥中。仪式散罢，兼定将自己那片梶叶塞入我手：“姊上留着吧。明年我自己背。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1554:event:help","text"],null]']
src = "blake3:2834453c21c127785a78bff303cc9f2c7ae2c80fab0e85bf88824ceecd652f1c"
text = "陪他汲水，在旁起头"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1554:event:learn","reply"],null]']
src = "blake3:763dacdb59f0ab19f674c79f7f4499d9b3ce3ab24d487dbd449f3e9e8e7191e9"
text = "梶叶次日便须撤去。家司准我先将七首歌抄录进本家记述年中行事的册页里。歌题是兼冬大人在世时拟就的旧题，落笔须摹他的笔意，长撇而轻收。待抄至第五首，我腕上染了墨迹，袖口亦黑了一片。家司翻检过后，言道这册子往后每逢七夕，便交由我来续写。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1554:event:learn","text"],null]']
src = "blake3:c13ab9dd3c802d9e24ac46f8b9bcd0f995b16b8289868d45fc111b6e2667abc6"
text = "将七首梶叶歌录入家册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1555:event:help","reply"],null]']
src = "blake3:e8b41d700cacce368c991e1ea2c0ffb0df6a5b4144a0a7b07f881ba35350bcbd"
text = "我跪坐于他身侧，并不代笔改动，唯独指出哪几字冗余。他叼着笔杆苦思到掌灯时分，删去两个，易了一字，余下三字却横竖割舍不下。局里第三遭来催，我只得动身。行至门首，他在身后高声嚷道：“姊上，宫里那头的歌，也莫让人轻易删改！”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1555:event:help","text"],null]']
src = "blake3:fc1bb99455d99e99f0dae317727d95ae89c00421dbed55c229ac644dd705dd1e"
text = "陪他把多余的字拣出来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1555:event:learn","reply"],null]']
src = "blake3:5256c3f5e3a05aa2abcf5ed3ffdadb7c5136bb4dc301bcdf5078749429fc54f7"
text = "我寻来一片鲜采的梶叶，依着他的歌句重抄一遍，“川”字规规矩矩落成三道竖笔。他探头端详了半晌，反嫌我字迹过于板正，失了他的神气。终了，两枚叶子一并裹进油纸：一叶出自他手，一叶由我代誊。母亲拆封后究竟先看哪一片，我们俩还为此打了赌。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1555:event:learn","text"],null]']
src = "blake3:15c39198152e7878a7fc410dd3d807a60adda1eb369bbee13d4a5ad22d308af1"
text = "代他另抄一叶捎回土佐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1556:event:help","reply"],null]']
src = "blake3:5f8b6937ad7e8ac7f4e0b60c9fa45d613dc7c2a2f696c3c41a0a197ff709ce93"
text = "我挨着他坐下，将五色线一缕缕理开，按房分拨。理到末尾余下一股紫线，他道留着罢。静了良久，他压低嗓音问，冬日里土佐的海可寒凉。我答道冷，舟中尤冷。他将那缕紫线缠上我的桧扇扇骨，足足绕了三圈：“出海时莫忘拜星。不论我身在何方，抬头望见的皆是同一颗。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1556:event:help","text"],null]']
src = "blake3:b86ad4ea76ac601f826bad044cdb928555352bfe7c0c3441730c4d1cdee92f2d"
text = "坐他身旁，将线分予各房"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1556:event:learn","reply"],null]']
src = "blake3:7309d135b3990d1fbc5b991fb95a145c57fb6e82ec22e5fd882a2d354e5e81c2"
text = "我摊开前年家司交托的年中行事册，将今岁七首歌逐一誊录，歌题沿用兼冬大人所立旧题，仅于题末注上一行小字：今年由兼定领拜。抄至末首时墨尽，我又重研了一回墨。见册尾尚余数页空白，我把笔递向兼定：“今年这一页，由你落款。”他伸手接过，于今岁那页底端题上己名，笔锋稳当，未曾颤动半毫。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tanabata_1556:event:learn","text"],null]']
src = "blake3:f0f5c9fce66594c166f282d30dc32f7d724fea2e6ae211c74b057436d834e237"
text = "录罢今岁家册，递笔于他"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1553:event:help","reply"],null]']
src = "blake3:f22d9a2040df61b51cf12aae2800a4899012a3416eb352118925b7687c52af95"
text = "我依循母亲指点，先以艾叶铺里，香料包于正中，复拿菖蒲叶逐层裹实。五色线我先后系错了两回，她并不点破，唯独停下拨弄念珠的手，静候我自行察觉。待悬上廊柱时，她探手将最短的那缕丝线顺直：“昔日在丰后府内，我幼时亦是这般悬挂的。”那一晚，她破例多说了一桩南蛮船的旧闻。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1553:event:help","text"],null]']
src = "blake3:3be90b1eee8b03cf19710df614cea7a374a7481971ff3b0125584e836d4c6431"
text = "代母亲扎制药玉"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1553:event:learn","reply"],null]']
src = "blake3:c264cec789fae20d50d807b396782d7a7f3553fba41c7a9094ef8627fa5a79ba"
text = "账上数字写汉字，庄户名姓写假名，行间切忌拥挤。母亲拨着念珠诵读，我亦步亦趋逐笔誊录。才抄至第三页，河滩上的呼哨喧闹愈逼愈近，飞石击落御所外墙，我腕间一颤，竟将“七”字误落成“十”。母亲眼皮也不曾朝墙外抬一下，只径直点住那墨字：“刮去，重抄。你走差一字，彼家便平白要多纳三斗粮。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1553:event:learn","text"],null]']
src = "blake3:e630dfcf3201a338d7dd07e2478c03efac39bc45bf2496500ee8170e01ebab71"
text = "代母亲誊抄今月粮账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1554:event:help","reply"],null]']
src = "blake3:5d75cd11e96841f77934f3b3bd19b93e3623bf7d094029448037e588b99de851"
text = "我同汐前往鸭川畔割回一束菖蒲，仅敷葺书院那一隅檐角。母亲所寄药玉悬于中柱之上，枯菖蒲余香已微，风一吹拂，五色线照旧轻扬。复信里我细述道：京里菖蒲六文一捆，檐下只葺了一角，药玉正挂在兼定日日经过之处。立秋前后母亲回信，竟如记账般罗列：药玉一，菖蒲一角，兼定一。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1554:event:help","text"],null]']
src = "blake3:852fba745a22315d4d2da24fb0a7bb0fbd5df3ab5cefbc94c9cfc87cee83fc1e"
text = "葺上檐角，悬母亲之药玉"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1554:event:learn","reply"],null]']
src = "blake3:5bb9d8ef3fc182c8e5c7f4cdd7c6e23800bed30b45f022577a4d7f9d62f0120f"
text = "我去了室町通探询三家香肆，归来摊开薄纸，择最细的笔将行价录成一纸清单：沉香各等次、每两几何钱，一铺占一行，价目齐齐归于行末，端正如母亲账簿上的算列。蝇头小字，笔尖略重便糊成墨团，写废了两张，直待第三张方敢纳入信封。汐瞧见了，打趣说这单子活像药铺开的方子。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1554:event:learn","text"],null]']
src = "blake3:beaed13542fb736d67c5bd995f2ecb5eee65025125737490a857f233855bd1d2"
text = "用细楷录一张香价单"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1555:event:help","reply"],null]']
src = "blake3:14ce54cb6c91f6eed31f07e1352331ca0146c052437b4be030747d9e754815c7"
text = "我将那束草根斩作数段，全数投入灶间大锅。水汽一腾，整座本家皆漫溢着四万十川的气息。房通大人濯足之后，特意遣人探问此菖蒲出自何地；兼定泡得双颊通红，直呼气味比京里的冲得多。回信中我只着一语：根未携去比，悉数下锅了。母亲的复函在我起程返土佐前赶到，信笺间夹着一枚晒干的菖蒲叶。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1555:event:help","text"],null]']
src = "blake3:cc7ef3e0b9f5b83be36f8a68e5e305622abe2a5b4cac3a32e25d9c0217eed55c"
text = "根全下锅，煮菖蒲汤"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1555:event:learn","reply"],null]']
src = "blake3:6f739b99592b2fe5f645a7e44878b416e1aa846fa2b9f0e03383c5d8310359f2"
text = "根合需附一首歌，题于短册之上，连同草根一并呈交判者。我量罢根长，计三尺二寸，歌字亦随长度而书，一行拖得既细且长。菖的草根虽逊我一寸，她的短册倒比我清丽得多，起承收笔干净利落，半点不显拖沓。退回屏风之后，我守着灯火将那行歌重新誊写了十遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1555:event:learn","text"],null]']
src = "blake3:76046f3b8900c285d89014baf1f22b2a8e2f5b0ad7bda9355a6e922e833b3d68"
text = "携根往比，题好短册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1556:event:help","reply"],null]']
src = "blake3:0767d77d20db48fc30ff82e9f3ffb52f794fe3d77b4e9e121bc99f4dfbcfb49e"
text = "我依着母亲的叮嘱，在门首将兼定拦了下来。他嘴上说只看一眼便回，我回敬他上回亦是这般托词。终归我编了两条菖蒲绳，在庭院里陪他较量谁摔打得更响亮，直打到草绳散架，鸭川那头的喧闹亦悄然停歇。回信我写明：兼定未往河原，掌心倒抽红了。母亲来函回道，她替我们俩多拨了整整一圈念珠。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1556:event:help","text"],null]']
src = "blake3:1bb1ee6d31c33aa2705407d487877271754f2954a8825a8bd75313c3fab57e29"
text = "拦下兼定，庭中打菖蒲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1556:event:learn","reply"],null]']
src = "blake3:10ae1ada3ec2ad9e6ef469990f30456f331cdf0b02dd14390141523f43906a1a"
text = "日记通篇以假名书写：粽子录作“ちまき”，各家呈献的菖蒲，何家几束，悉数登记明白。我在灯影下录满一页，典侍拿过翻阅，点出其中一字多了一笔，命我刮净重书。待重录的那页递上，她未再挑剔，直接纳入箱笼。我怀揣香囊步回本家，归途一路袖间尽染丁子余香。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_festival_festival_jp_tango_1556:event:learn","text"],null]']
src = "blake3:842d4fe5248447480a8a4446a4dbc66fff9f4c19744c127127f88f40d2ccf0ae"
text = "入宫记写这一日的日记"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_lose:event:ask","reply"],null]']
src = "blake3:b116120bae0ef5d95605835f30702473aacec053576bf38cd9399a26597bcf7f"
text = "我绞着湿透的衣袖请教她，双腿究竟如何踩踏方不至下沉。阿濑蹲下身子，双掌一前一后虚推几下：“好似摇橹一般，一推一扳，莫效青蛙乱蹬。手更不许动，手一动便知心里慌了。”次日我复入深水，手擎一页空白素纸，半字未题。直待汐数到一百一十，纸角方才润湿。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_lose:event:ask","text"],null]']
src = "blake3:07c609c1765c6b4e2f0d70e332fc8afdc82369059f09343d9e49b65c61154058"
text = "问她双腿怎踩方不沉"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_lose:event:reflect","reply"],null]']
src = "blake3:b407209e357dbb3180f3c1d7bb2e3daa1735e868f4e5172d014b6b8578bc99dc"
text = "入夜我将那张湿纸摊在灶畔烘干，墨色洇成一片，宛如退潮后的滩。我在纸侧另起一行，以假名记下沉没前的一瞬：腿乱蹬，手先松，人便慌。此后每回踏入水前，我皆先于心中默诵这三语。那张纸晾干后皱巴得好似鱼皮，被我夹进了歌稿中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_lose:event:reflect","text"],null]']
src = "blake3:3a618a98d8f67cd385821f71a02e2a1ca792e675a08a6b3c95e486a843a9413e"
text = "记下沉落时的那一刻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_sail:event:ask","reply"],null]']
src = "blake3:2db9efc6f8c859034f89e936001341dce065ec09d1df459fd0049153c5a4d841"
text = "我跃下船，紧追着问她方才遇上那阵横风，橹究竟该朝哪边扳。阿濑一把捉住我的手腕往下按：“风从哪头吹来，身子就朝哪头压。怕翻船便莫盯水面，只看竹竿。”我一路走一路念叨这几句，刚到家门前又折身跑回河口，央求她明早再放我出一回船。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_sail:event:ask","text"],null]']
src = "blake3:007695d80d7ea44c9604169a2cda5271a628ff367226506a8d513c9526e48a5f"
text = "问她横风来了怎么应对"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_sail:event:reflect","reply"],null]']
src = "blake3:67de3d8101e02e171cfed6fa981f7274be8f2af2f53ca0132e7e11dcf1bbc0c1"
text = "入夜后我在怀纸上绘出河口：沙洲、竹竿，连同我摇出去的那道七扭八歪的轨迹，横风从哪处压来，船在哪儿倾侧。那条线画得像极了喝醉的鳗鱼。旁侧用假名记着：头一回，独自一人，回来了。母亲路过瞥见，叮嘱我这张纸可别拿去垫砚台。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_sail:event:reflect","text"],null]']
src = "blake3:37b875869e03b0103a5952f3b50f5955d8ab09ea9da859c8402d1c25bd896342"
text = "描出绕竿而行的水路"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_scold:event:ask","reply"],null]']
src = "blake3:e390bb6caa089baa3cd43b81f0ffeb47027faf0323da82f67ea52524a4f91293"
text = "我向阿濑讨教见了船主该如何启齿。她道：“先问他这一程的风水，次问舱下运的何物，谈钱要留到最后。”说罢又打发我天天划出河口外，专等那条盐船回程。我连蹲了三日，第四天方见帆影露头。挨拢过去，我照话先问了风色。老头上下瞪我半晌，把一串钱撇进了我船里。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_scold:event:ask","text"],null]']
src = "blake3:adb14a449d1a84aeddc32447c2f4256018259fe41adc80d0e0d9d7cc3af0f67d"
text = "讨教对船主搭话的法子"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_scold:event:reflect","reply"],null]']
src = "blake3:a8e421882fde9e88653d461197c6f49738ee367b6e7bb4fb7d2b4f8093faad8c"
text = "当晚我提笔咏歌，吟的正是那片渐行渐远的船帆。起初两首字里行间尽是自辩，随手撕个粉碎。第三首单写老人的白须随风倒向河口，人似有回首之意，船却头也不回。拟定后我在纸背写下“速速”二字，连划三道抹去。此后每逢登船报旗号，头一句我总先道声“辛苦”。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_scold:event:reflect","text"],null]']
src = "blake3:2a2623c29345787a42532199f55de0a6e932d46eb5cbf3ce27436f9e4764d107"
text = "把远去的船帆咏进歌里"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_stranger:event:ask","reply"],null]']
src = "blake3:6632a42b639874891e8a4d8bd18d2b326b4e147d19fffc8a8539027ec6a06ac2"
text = "我去请教母亲，致信生人究竟该如何起头。母亲捻动念珠思忖片刻：“先报清自家名号，次说所求何事，收尾留一句便他回话的由头。”我找回原信底稿，在末后添了一行，问起堺今年雨水多不多。往后再写信，我决定不再誊抄第二遍了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_stranger:event:ask","text"],null]']
src = "blake3:f828dd0ff30571e352205245caf7fd9932ac7374abb62b5eae10bd1cc1f978fa"
text = "向母亲讨教给生人写信的章法"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_stranger:event:reflect","reply"],null]']
src = "blake3:116ec2b02fdf181a96cce030ff71d25d74427bf4ec91348b6a1f88975dc7d377"
text = "我将信稿留下一份夹入账簿，旁侧空出一栏，专等回音到了填入价码。我先估着写了个价，笔迹极小，底下又落个更大的数目，那是我心底盼着他能出的价。阿濑瞧见了，笑道你这是货还没卖出就先赚上了。此后一连三个月，只要有船打堺过来，我都得跑去栈桥打听一声。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_stranger:event:reflect","text"],null]']
src = "blake3:e6acc2aed2e182d45fec8c97d4e8de3bc49418ecf50ab7d837c0df407b4edc8a"
text = "留存下问价的信稿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_wage:event:ask","reply"],null]']
src = "blake3:4738ffce70b50950e757b70a70f96086d3d1e023e6baf9b9c89dc98bad681ed4"
text = "我紧追两步问她，如何才能多分几文。阿濑头也不回：“独自登船，独自讨价，独自插旗，自然就多。”我当即道那明日便让我独自上去。她刹住步子，转头盯住我看了半晌，嘱咐我先把今日那条盐船缘何短交五文琢磨透彻，再来找她讨这差事。我足足思量一宿，天刚亮便寻她去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_wage:event:ask","text"],null]']
src = "blake3:f2399abe03d123f4c4389acaee3bf30a307ccdc948cdd7bf76612dc97118fa22"
text = "追问如何才能多分工钱"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_wage:event:reflect","reply"],null]']
src = "blake3:615cda08f1dff93c2138ecc348f82ecb49f74ad90233d99ac204a8173611d3b4"
text = "回屋后我裁齐几张纸，订成一册小簿，头一页拿假名记清日子、船数，挣得十二文。底下另起一行：购烤鲷鱼一尾，费四文。余下八文重新穿回草绳，吊在衣架尖角上。那条鲷鱼是在河口摊子买的，被我啃得一根鱼刺也没留。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_first_wage:event:reflect","text"],null]']
src = "blake3:6c3cf8323c01388663ea0d62d801a9ecace3a963958ded8b4ac6a27012271b4a"
text = "拿小簿子录下头一笔账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_home_start:letter_lin_wandeng:practice_count","reply"],null]']
src = "blake3:4b49fea40af6217433106595c6feea683b7d6d4c1f6823b6c7c1ec073e8b4427"
text = "我偏不信他表妹算灯油能胜过我。当晚趁着夜深，我将阿濑的钱匣倾在席面上，一串串来回数着，直数到天色微明，匣子倒腾空了四趟。真要一较高下，输的决不会是我。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_home_start:letter_lin_wandeng:practice_count","text"],null]']
src = "blake3:f165ee35a7ea954bea61a72483ca530775ca07a00b537ffdbf81a3fa74c832d0"
text = "先把点钱的手练利索"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_home_start:letter_lin_wandeng:wait_reply","reply"],null]']
src = "blake3:2201672400a64143f10059144a13247ff0f09a45d1080ba3ef415d4ba5c4a024"
text = "唐船总要候着开春的风才回得来，阿濑说急也白急。我在柱子上刻了道痕，往后从西边来的船每过一条，便再添上一道。汐说照这般刻法，柱子可挨不到开春。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_0:event:keep","reply"],null]']
src = "blake3:8be64a4fc702ec9fd29fc706b90e99b4b6ab973b6343446e02d610fedf10e8f4"
text = "我将信纸连同那日清点过的一枚永乐钱一道收进文箱。帆别钱的数额，阿濑叮嘱过不可轻易漏给外人。唯独那“以经”二字教我牢记在心，夜深想起仍不住发笑：大海彼岸有个提灯的女娃，单为数钱一事，竟要同我比试高低。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_0:event:keep","text"],null]']
src = "blake3:353fbf0f6bfcce61d796cc7a676dc1a6e3457e8ed525a2f8affa38e5c05dfbd5"
text = "暂且收进文箱不回"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_0:event:reply","reply"],null]']
src = "blake3:a13a40554de3e92a3cd616368ae0d9b647caf42c411d71e489e7407b27a6ee7f"
text = "我照着阿濑的口吻，将一张帆收几文、几张帆起算，实实在在写明，末了又加一句：讲价无妨，先赢过我数钱再说。她不识假名，我通篇尽用汉字。阿濑虽劝唐人的信别写多，我到底把一首咏河口潮水的歌，拿汉字逐音拼了上去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_0:event:reply","text"],null]']
src = "blake3:df68305c30031a29fd83efaac60a037141448e601e63d81608294c130650f8a9"
text = "复信写明帆别钱的价码"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_10:event:keep","reply"],null]']
src = "blake3:62051caf1e2c1a2284f04d75e10dae544226da6f5393d216440f9c98e7f690f3"
text = "我将信笺收进这三年攒下的歌稿，恰巧夹在七夕那几张旁侧。一个在龙溪对联句，一个在京都咏和歌，倒都忙着同人争抢上下句。汐在旁瞅见，问起姬君因何发笑，我只推说没什么。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_10:event:keep","text"],null]']
src = "blake3:7b24563b15ebb9c74067228d97465aad3ebe28bc3841173920443dc6761aa550"
text = "把这封信收进歌稿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_10:event:reply","reply"],null]']
src = "blake3:15293daa00213db2544bced837f8089bc296045cbade495b2a31710e763c236b"
text = "回信里我将末后那场歌合讲与她听：题名由己自定，我选了“潮”字。输赢未提，单写了判者诵到我那一首时微顿片刻，满座顿时鸦雀无声。记起她曾说输了更该写出来，我便把旧年落败那首一并抄录过去，字句原封不动。至于她能念懂几句原不要紧，看在眼里总是会笑的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_10:event:reply","text"],null]']
src = "blake3:dae7452129cb4ff4a0a04efa24a52ff6e5e0e73690b11f49fc5058e83fbe69b6"
text = "写信说说末后一场歌合"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_11:event:keep","reply"],null]']
src = "blake3:045acb0c39f320e73b32d5b3b697060ac1812747887840610c21945bc79db73e"
text = "我将那根红线解下，仔细缠到桧扇最外侧的扇骨上，正绕足三圈，和她捆信的道数分毫不差。书信折小贴身揣进怀里，随同我的行装一同返归土佐。等出海那日，这把扇子自会插在我腰带上，那截红线亦然。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_11:event:keep","text"],null]']
src = "blake3:b6782650e21f781dd19785b8dadc0dcc5dc1644fe31ef4ec88dec4513ba6b0a7"
text = "将红线绕在扇骨上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_11:event:reply","reply"],null]']
src = "blake3:8014aa645f77d4f223ad22dab995be0d50a73babdb15231dbced3f1c482e457d"
text = "复信不过寥寥三行：正月自下田起航；哪日抵五岛，寻红灯笼便是；唤一声“灯”。落款旁画上一柄半展的桧扇。正要封缄时指尖一顿，复又启开补了一句：灯莫熄，候我。信交由汐的同族，搭能岛快船送去，比堺商人快得多。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_11:event:reply","text"],null]']
src = "blake3:bdd6858bad86faf8bd73dd145a31d8ea856a2e132b1293858bc866599ca0b057"
text = "写信约下五岛会面"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_1:event:keep","reply"],null]']
src = "blake3:6480531646f7c7541a02b87611dd2c3a5c27d83787794f50accd88b09e379598"
text = "我将那页描红仿纸黏在书案旁的立柱上。足足二十个“灯”字，开首几个斜得宛如遭风吹歪，越往后越见挺拔。母亲经过瞥见，夸赞这孩子腕下颇有气力。此后每逢抄写假名倦烦时，我便仰头望望那一排“灯”字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_1:event:keep","text"],null]']
src = "blake3:13301935cf3e30f3e8557839b43bee52e1995033e74ef23ba03033fd5d1676e3"
text = "将仿纸黏在书案旁"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_1:event:reply","reply"],null]']
src = "blake3:72f6757ebd1132eef9d75826ab4dc84a7ccba336652211e0bc5037dd25dff8b7"
text = "我在信里细数平日所习：母亲传授的假名和歌，阿濑教导的泅水观潮，外加帆别钱如何刻记于木札。写了半篇方记起她不通假名，只得单将“潮”字放大写开，旁侧绘出河口形状，涨潮划一道痕，落潮再划一道痕。末了嘱托她来年妈祖诞辰之际，也替下田的船只点起一盏灯。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_1:event:reply","text"],null]']
src = "blake3:35114ba8db16e76e7c6ad2aedcef16cbd9c3ee6c174bd30b75b6b12631411716"
text = "回信叙说所学的假名与潮水"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_2:event:keep","reply"],null]']
src = "blake3:cc1c67da65dd97e5ce168f6da2c43916ab6bde36f9c236652d404fdeedec4dd7"
text = "我未急着提笔回信，反倒把封套上那三枚墨印逐一摹进纸面，旁侧标清地名：平户、府内、宿毛。画罢打量，竟宛如一幅朝西延展的航海图，每枚印章便是一座泊港。母亲见了说，往后去了京都，这趟海路还得往东再接续一程。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_2:event:keep","text"],null]']
src = "blake3:ce83a07f866a8f1d2472ac41a397721730a895afd4f56d49f65cf3392d9b55aa"
text = "逐一摹下三枚墨印"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_2:event:reply","reply"],null]']
src = "blake3:2eb96034d61824af25cd05432d5b093b9f7f4e3ed0b214abed1a3fd109c8dd77"
text = "我在回信中告知她，腊月里自己要动身往京都去，寄居一条本家，此后书信尽寄“京都一条殿，澪”。思忖片刻，又依循她的法子拟了一纸回执夹入信内：哪日收妥，何人带到，信纸可曾受潮。她索要的新居处，我特意写了两遭，一遭用汉字写明，另画了一幅简图，打堺起顺着淀川一路描至京都。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_2:event:reply","text"],null]']
src = "blake3:47cf75f4a3af751ff11e495b20008790138f317f2f1adfcc2e89385e57420e28"
text = "回信告之开春要上京"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_3:event:keep","reply"],null]']
src = "blake3:95e019bf4403af19e6cddc987b761c71f2c911a99e3fb0ac202555a5c1211add"
text = "我挑着拣着把信念给兼定听，讲五岛的那段足足念了两回，说到旧衣裳却跳了过去。他听得两眼直放光，嚷着往后也要搭唐船去长长见识。念罢了，我将信收进从土佐带来的文箱，压在潮记底下，同先前在下田收到的那几封归在一处。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_3:event:keep","text"],null]']
src = "blake3:2765285af53909d285cb72c35234df3c0c3140351e16718fcb900bc60c3aa682"
text = "念给兼定听后再收好"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_3:event:reply","reply"],null]']
src = "blake3:abc8cec815e750c6097b7d557da3a1eb6f1a0ba61661b5f97deb54ee359f4355"
text = "我在回信里说，旧衣裳的事我权当不知，她要编瞎话，只管留着碰面时当面扯。倒是五岛的见闻，得等她回来细细说与我听：船行了几日，夜间辨哪颗星认路，那片海可比土佐的更蓝些。我挑了一枝京都的樱压平夹进信封，寄到她手里时多半只剩一抹褐影，但她一眼便能明白，京都眼下正值春日。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_3:event:reply","text"],null]']
src = "blake3:bc0c3ee3cc15840155481c09feea16ffb14cab03aa0cb604d90f2d0dd100d9fe"
text = "回信只问她五岛见闻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_4:event:keep","reply"],null]']
src = "blake3:e938252937a5c08512bef9f749be08413b3459d15bb307cac7147866ca81446e"
text = "我将那页描仿的粗纸垫在砚台底下压平，把上面的朱圈挨个点算了一遍，不多不少整十七个。汐问我数这东西作甚，我说留着比一比：瞧瞧等到秋考那日，宫里的上臈会在我写的假名旁画上几个圈。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_4:event:keep","text"],null]']
src = "blake3:cfae2fb07b57e823fce525453e1a959b5e5a7f2004acc072cc9c659116b78b7b"
text = "压平收好那张粗纸仿字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_4:event:reply","reply"],null]']
src = "blake3:73490a494ef8fa005d86cf30154b19fd0c1e5872dfcc877f35dd2c066d665e4b"
text = "我在回信里将宫中的课业逐件写与她听：跪坐多少刻纹丝不动，假名得连缀如一缕细线，《源氏》又讲到第几帖。宝镜寺里的抄经想来合她脾胃，我把尼僧传授的经题照抄了一行，下笔比往常还要谨严。信末我点明告诉她，五岛离京都虽遥远，距土佐却不算远，从下田出海向西直行便是。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_4:event:reply","text"],null]']
src = "blake3:2e9480ab421f8af404b1fb645cb1f87bb5a492187e7e0bfb2fc490e071c51608"
text = "回信细说宫中课业"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_5:event:keep","reply"],null]']
src = "blake3:150ee90c8101b0a7a2534fec8369722d0613569c63980e93bfca27334f882a4a"
text = "我将那枚贝壳放进母亲赐的旧香盒，紧挨着一小块用剩的伽罗。打那以后每逢来信，我头一件事便是寻那个墨点。五岛入夜后连成一线的船灯，我合上眼反复描摹了许久，终究还是想不透究竟绵延了多长。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_5:event:keep","text"],null]']
src = "blake3:a27747d842d9a70e74b7f979b76cd809539f77df846f64fe1406f504a90c1bf8"
text = "将贝壳收入香盒"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_5:event:reply","reply"],null]']
src = "blake3:d4425f5d706739f5bb54a2da28508f4a65272dec29b51dfcec123eea2b29e1e0"
text = "我也替自个儿立了个暗号：在信末描一把半展的桧扇，露三根扇骨，旁人决计摹不来。落笔妥当，我又顺手在旁题了一首短歌，吟道霜花落上京都的红枫，海盐凝在五岛寄来的书信。那枚贝壳被我穿了细线，系在文箱的钮上，每逢掀盖，便会轻叩出一点微响。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_5:event:reply","text"],null]']
src = "blake3:a31e9f67461b8bd60d75c066700de150fb5ac3adc4cf901d23701c3f3974c3a3"
text = "回信亦立个暗记"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_6:event:keep","reply"],null]']
src = "blake3:48b7a08d9316ec7875e22dbe71cffc31e1b12897fc1fad945f6608c497c43bd4"
text = "我将那张浸得油亮亮的果脯包纸展平，同信笺一道折好收进文箱。纸面尚带几分糖渍的黏腻，汐念叨入夏后恐要招惹蚂蚁，劝我丢弃，我偏舍不得扔。至于信里那句“你当没看见”，我倒果真权作未见，只暗自发笑了一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_6:event:keep","text"],null]']
src = "blake3:da32b233307432d5b81f80dd52bf1254f25855ed3a9b5dbbc1132b5b00c6e2e9"
text = "连同果脯纸一并收妥信件"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_6:event:reply","reply"],null]']
src = "blake3:3af2063a5f6f401cab2e26eaff1713d49cb86bf1dbfa066dd27494bcfc202964"
text = "我特意去讨教了山科大人府上的管事。他讲京里买卖俱用铜钱，银子须拿到堺的唐人铺面去秤，至于一两能换几斗米，得看哪一年、哪一季，去年秋后价码又往上涨了。我把打听来的数额写进回信，依着她的算法换算成“两”与“斗”，来回拨算三遍方敢落墨。信末我顺带提了一笔，果脯我吃了，拣完好的那半块入口，酸头里透着甜。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_6:event:reply","text"],null]']
src = "blake3:ce2a8982869b7b05331d30aeaac0028b7521b03490690d35cc4a26244aa3ea95"
text = "回信告知打听的银米价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_7:event:keep","reply"],null]']
src = "blake3:489f52aedd570af9343ec722fcf25b3810b80ba8a7c7b6091f088c1410812fd6"
text = "再过数日便要动身回土佐过盂兰盆，我将此信收入随行文箱，压在七夕歌稿的最上层。海船行经纪伊水道的几日里，一得空闲我便抽出来瞧那尾往回游的小鱼。汐打趣说姬君一封信竟端详了整整三日，我回她道，那条小鱼还没游到家呢。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_7:event:keep","text"],null]']
src = "blake3:ce308b87cde044948de3628754b8caeeccd459ec14fe0f7c67fddabc66e25a9a"
text = "携信返回下田"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_7:event:reply","reply"],null]']
src = "blake3:fa91531dd775914479757ee74f4a1617a8b2ceb492a83eef4dd28a2ecc42213c"
text = "我在回信中将自个儿的名字重抄了三回，一字更比一字大，末一个字的钩画还特用朱砂描亮，旁侧批注一行：鱼头朝这边。她信中探问七夕光景，我也据实相告：今岁在梶叶上题的那首和歌，写的是隔海相望的两人借同一颗星辰认路。想来她拆了信，八成又得蹲在天妃宫的灯影下依样描摹了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_7:event:reply","text"],null]']
src = "blake3:902467853ffd4cf46c13200efa9d56552b1edd511e4e8904c3d0212c31281fdb"
text = "指点她写正那一钩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_8:event:keep","reply"],null]']
src = "blake3:e5c3f5756d3074d2171a0f219b741fd8cf959c1dc67f06984199285e8a454d26"
text = "我将那半截纸条纳进香盒，同五岛的贝壳并排搁着。盒盖自此扣不严实了，我干脆搓了根纸捻捆扎起来。日后每逢新信送达，我总得先掏出这半张，核对撕口是否吻合，方肯启封。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_8:event:keep","text"],null]']
src = "blake3:e592b62de462ecf2dfc2a5d050d0be5c822aa63c09a231c3ca579560dd2198af"
text = "将半截回执纳入香盒"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_8:event:reply","reply"],null]']
src = "blake3:6c003e6fd93801a24893458b730abb21e1eb0f8fd87308a7b5b9e7b12be645c1"
text = "我也照样写了一纸回执：“灯九月的信，闰十月七日到京，封口完好。”落墨既毕，从正中一撕两半，自留画有桧扇的那半页，余下那半夹入回信寄出。一时手急把纸扯偏了，这反倒妥当，如此犬牙交错的裂口旁人决计摹仿不来。信末我再三叮嘱她，这半张务必收妥，倘若遗失，下遭寄来的信我便概不认账。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_8:event:reply","text"],null]']
src = "blake3:2f38dde8605fb9d7f6bb60e849ad310180f1c77b0f8c0fe810c930fac9a2d7ef"
text = "照样撕张回执寄与她"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_9:event:keep","reply"],null]']
src = "blake3:e49685de3f896bfba5ac8cf90d2c5b524abcac0d1416f7db1ac070572a1635f9"
text = "我将那张小账顺着旧折痕叠回原样，夹入本家的米账。每当替局中记衣账记到心烦意乱，便翻开这一页，瞧一眼那句“写哭了的不加钱”，总免不了噗嗤一乐，乐过之后又能耐着性子多记两行。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_9:event:keep","text"],null]']
src = "blake3:5e0afbe86f4ad109cdb8a4a82d7243804d1760816be3b28769e0271df2611a62"
text = "将她的小账夹入米账中"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_9:event:reply","reply"],null]']
src = "blake3:aeb8d4ef04f5dcd5d832ad599f7dce5de8f85772b21797d6a5fa87e5d5801357"
text = "我依着她的样式，亦竖列着记了一张单子：局内典当出去的三件小袖，今春赎回了一件；代美浓来的武士誊抄《古今》假名序一卷，挣得钱二百文，悉数贴补了房通大人的药钱。末行我特意学她，隔了一日方才添上一句：“船出了港，写信来。”末了在扇子记号旁侧又画了一面小帆，遥遥替她鼓劲。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_letter_9:event:reply","text"],null]']
src = "blake3:5a4a2b737b594087f43bc9eb047d30f8459797d2bc21c03a0eeb0420bd81adc2"
text = "依她样式回寄一纸账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_0:event:ask","reply"],null]']
src = "blake3:c8aa1b136d4bc52413b369b6b8bac6128a64938ad8c6cd6e49890363b0e30cb2"
text = "我问保子大人，这话是怎么传到京都来的。她自己也说不上来，只晓得先到了丰后。我便屈指替它细算：南蛮的船绕过天竺，趁着西南风到满剌加，再候着南风往北去，末了才进府内。拿季风一程一程对下来，原是每一段都恰巧遇上了头一阵好风，才走得这般快。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_0:event:ask","text"],null]']
src = "blake3:9718616c4f082494536934369e7bc98926cd9b7dfce9779ea4ad22df968e2959"
text = "问这话经了哪几条船传来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_0:event:compare","reply"],null]']
src = "blake3:a42f5aae5fb8c32a657c2c35661d12a4c06f140bcd31a3399e700abc34b2f608"
text = "当夜我向本家借来皇代记，挑灯挨个儿寻检：推古、皇极、持统、元明、元正、孝谦，当中皇极与孝谦各自即位两度，合起来便是六位女帝坐过八遭。最末那位距今已有七八百年光景。我将尊号一一誊在怀纸上，次日呈予保子大人过目，她端详半晌，只评了一句字迹写得太躁。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_0:event:compare","text"],null]']
src = "blake3:a3a681d224ad54f99be1d7127cd89db76ed6d1cb5b18fdbed083a3998b9dd82d"
text = "查皇代记清点本朝女帝"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_10:event:ask","reply"],null]']
src = "blake3:b1e002b5f24f245e0720e712351ae416e08dfb271d970b0d642a2af1d780869a"
text = "我嘱托汐向常来本家走动的书贾探价。他道本朝刊印之书多为佛经，手抄一部动辄数十日，雕版刷印不过数日之功，售价自然悬殊数倍。我暗自盘算一番：禁中歌集若也付梓售卖，本家一冬的买炭钱便有着落了。此话我唯独对汐吐露，她却横了我一眼：“姬君莫非想卖歌？”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_10:event:ask","text"],null]']
src = "blake3:31ae8e36261d3053238eecafa7c260854e01cc0d3f8876d995adb54925b75fb2"
text = "打听那等书册售价几何"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_10:event:compare","reply"],null]']
src = "blake3:8d6292b12fb1be27a96bb85a8859740506787b01d779516a9ca7bff5680f82bc"
text = "我怀揣贞子大人所赠历本登门土御门家。有春大人微眯双目听罢，自书架抽出一部占卜典籍指点与我：本朝占验之术，首推年月日时，次定吉凶方位，若连时日也不明示，在他看来便称不上占卜，充其量算作谣歌罢了。我将他口诵数条录下，同那南蛮人四句诗并列于一纸，一侧满满当当皆是日子，另一侧却空空如也。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_10:event:compare","text"],null]']
src = "blake3:8cab5e31d2b2844c76f0ab8e869650566e7ba0fd501f2fd617ec54940ed09d66"
text = "往土御门府上问询有春大人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_11:event:ask","reply"],null]']
src = "blake3:f7e10b1755c08ba09643c2d171503cf67818bc8f763f6bd8279de827ab949391"
text = "我紧追着使者追问，那些人拿住总督时心底可曾畏惧。他思忖半晌，道是听葡萄牙人说起，原是南蛮人率先抢占了人家的山河。我念及下田河口：假若哪日骤然开进一条大船，狂言四万十川自此归他，阿濑多半二话不说抄起船桨先拍过去，拍完了再盘问他是谁。使者闻言哈哈大笑，夸赞姬君这股脾气活脱脱肖似舅舅。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_11:event:ask","text"],null]']
src = "blake3:a3cf8402dfe386c8bb4c79feb0b3714bc734a331121d3b6a306232f569a64025"
text = "追问使者那边的人为何不惧"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_11:event:compare","reply"],null]']
src = "blake3:da6d90913bde576b07bc1d175b326875306662e3a01711a2c32d68afc72221af"
text = "我盘问使者，这话究竟是从何人口中听来的。他答称是府内一位葡萄牙船长的通事所言，通事系在满剌加听闻，而满剌加的人又是听西班牙人讲的。我拿笔在纸上一一列下，屈指一数竟过了四张嘴。行至灌金子那段，我特地在旁画了个小圈：话每过一张嘴，那金子怕就要多熔一分。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_11:event:compare","text"],null]']
src = "blake3:acf8a03dc9067fb0e84bd913418c29d384191799cfb13f5e2f4d18274ac0242d"
text = "追问使者这话出自谁口"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_12:event:ask","reply"],null]']
src = "blake3:05e0408892763fab0e329586084fb3ca81232b22eb0910fe43e6d8a7df168072"
text = "我问汐，口子既开在广东，南蛮的船驶来日本该走哪条路。她抄起火箸在火盆灰里勾画起来：沿着唐土的岸一路北上，夏天借南风横渡东海，先抵五岛、平户，再进丰后；返航则须等冬天的北风。画完，她顺手一掌将炉灰抹平，笑道阿濑早教导过，风不对头，什么船都是白搭。我依凭记忆将那条线描到纸上，逐段标明风向。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_12:event:ask","text"],null]']
src = "blake3:4f8e07b4b0402bed0e10da92b5fd09c2ca6f111b6e7ed4080b9ad9af40d4a130"
text = "问汐南蛮船赴日路线"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_12:event:compare","reply"],null]']
src = "blake3:76bff92de1a89d1ebdc7f1d291f78c213cf3cea2f9ef8df55c1711e158a58ad4"
text = "我将晚灯近两年的来信一封封摊铺在榻上，细细翻检她讲过的官与禁。她骂过巡检，骂过海道的官，却从没写过谁交了税便能上岸。那唐人船工那一笑，十有八九便笑在这里：佛郎机人能够谈得下来的事，月港的人反倒谈不下来。我提起笔，将这一条记在了文箱的盖子里头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_12:event:compare","text"],null]']
src = "blake3:f424d1c09adca1d35d27cfcbf4795c99ca647334e1dad6abc614d9688b86e6f5"
text = "拿唐人之言比对晚灯书信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_1:event:ask","reply"],null]']
src = "blake3:5224b4ec9d38c0c97cedc3ca7b5b9fadea8304e5b49247d6b289a408b98120ec"
text = "我写回信请教母亲：当年自丰后嫁过来那年，嫁妆是怎么入账的。她回信迟迟才到，只誊了张旧单子：衣箱十口，伽罗一段，铜钱五百贯，另加府内的一座仓，租息年年折作米送往中村。我照着此单替英格兰女王算账，算至“一个国”便顿住了笔：这笔资产，该记在谁的名下？"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_1:event:ask","text"],null]']
src = "blake3:409cebebefea8cbf665e107c79b388f21bfde6eee6547791dbb2016bef50cb9b"
text = "复信向母亲打听当年嫁妆细账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_1:event:compare","reply"],null]']
src = "blake3:e2e27034c587021b5c174203e27fdff8539d3d4fb8fcc61aa049fca4d4d087c0"
text = "我赴本家书库借来一册记叙婚仪的旧簿，由纳采送多少匹绢，一路翻到迎亲入哪道门庭。一条家嫁女，必先写明随嫁庄田归谁所有；南蛮那边的婚书，亦先定下那国归谁掌管。我把两桩事誊在同一页纸上，中间拉了道竖线。管库房的老家司见我誊得仔细，又顺手抱来两册。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_1:event:compare","text"],null]']
src = "blake3:26f8e315f2b0496b685d1ffc53478755b3be86140dbad3a97bb1bc617ddde3b5"
text = "找本家的旧时婚仪记录对照"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_2:event:ask","reply"],null]']
src = "blake3:0666a4596e16925afa788c7e63ba273613ac637e189f5eccdb94d6848e00f4dc"
text = "我问兼定，城门打开那日，城里人都在做些什么。他答不上话，我便讲与他听：卖饼的头一个关起铺子，井旁的桶顾不上收，孩子给人一把扯进屋里。说着说着，我自个儿倒先难受起来，仿佛下田的栈桥上再没剩半个人。兼定瞪眼瞧着我，说姊上又在编了。我直说是编的，可总有人正是这么过来的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_2:event:ask","text"],null]']
src = "blake3:f486923147a3a63ef7d377ff606612d66654a231ba3478c1c451bef9bd505c58"
text = "问兼定城里百姓如何过活"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_2:event:compare","reply"],null]']
src = "blake3:b7903aff608b537dd0cecbf3814b5d2b97060c9a0c5c9cb1e38da63ce6afa0e5"
text = "次日纸商上门结账，我留他多坐了片刻，打探此话源头。他答说是丰后船人讲起的，丰后人则听自葡萄牙人，至于葡萄牙人又是打何处听来，他便一无所知了。我将这传话的路数一节节录在纸上。兼定伏在案边屈指数了一遍，道是话传了这么远一遭，兴许那座城早就又易了主。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_2:event:compare","text"],null]']
src = "blake3:94a98214390d6846514ee0bb5ff55d86da61efed691c4a863fdc88c8fcbdab71"
text = "问纸商这消息打哪听来的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_3:event:ask","reply"],null]']
src = "blake3:937558e17a27af588cc8651f5965375f5dff0a08c1f1eebdeaf4648c58cdb2a4"
text = "散了课我就去找汐，问她打残的船只怎会被吹到对面的岸边。汐说帆裂了、舵坏了，船便只剩顺风漂这一条路，与土佐外海秋日里的大风一个样，阿濑管这叫“叫海牵着鼻子”。她拿起两根筷子在饭碗边比划给我看：船头冲这头，风从那头刮来。我照着她比划的样子，画了一张小图。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_3:event:ask","text"],null]']
src = "blake3:07adfd55393f8306f44f8b55bcc878c53d965eb54f509dcc2b1443e83c4f1592"
text = "问汐大风如何推船行走"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_3:event:compare","reply"],null]']
src = "blake3:397037fe21cbfc7726d5bfce85e246e114b3b6c5f0c49ae9f00a57657ddc02b8"
text = "我把《须磨》那一节重誊了一遍，紧挨着写下公条大人道出的海战。光源氏那场风暴里有梦境，有龙王遣来的使者，天一亮还有明石的船来接应他；土耳其人这场风暴里，尽是摧折的桅杆和归不去的家。两段字并排搁在案头，我端详了许久，蘸墨把“龙王”二字圈了起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_3:event:compare","text"],null]']
src = "blake3:c4cd7ef91e8caecb6dcd827cd6fece90d99e24b557344f019bcd031855dcc600"
text = "将两场风暴并列誊写下来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_4:event:ask","reply"],null]']
src = "blake3:fc6a51a2f35485193c12b338e167ae6d80dc8e416adcdf8b01f3e83043621197"
text = "老船头屈指替我细算：唐船既不到岸，堺地的生丝每斤怕要起价两成，市面铜钱亦将吃紧，咱们依帆别钱征上来的永乐钱只怕愈发金贵。我在木牌背面刻好他估的两成，转头又去寻在河口避风的堺商打听，堺商却摇头说两成还估少了。我将两家的数目一并刻留，只待入秋后再验谁说得准。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_4:event:ask","text"],null]']
src = "blake3:44522d6d218e3095da536fa59b84394ff2cfbd94d8604fe86bdcbf89ecedd630"
text = "问生丝与铜钱价码涨几成"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_4:event:compare","reply"],null]']
src = "blake3:fb924b98aeaf6e9a0fd39346a82de26838726254e5236b50457e2bd828fdeae2"
text = "我记起母亲提过，大内家遣往宁波的勘合船，数载前便已是末了一趟。遂去她房中找出那本手抄旧记，上头逐笔详列着那船自宁波载回几多典籍、几多铜钱。那条航道既绝，沧海之上往来奔走的，便只余五峰船主这等人物了。我将老船头所言附记在旧记末页，特意空留一行，以待往后新讯。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_4:event:compare","text"],null]']
src = "blake3:4aaeda1634772d58f7bf965ca541e68dc26da75ddd0241acb100d34f3857af80"
text = "翻阅母亲誊录的勘合船旧账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_5:event:ask","reply"],null]']
src = "blake3:896a2d79a676b4c7a3817b9c63fb6412adf6a5ee6baabd9ef2f1bb861e69598d"
text = "我一言不发，捱到汐身旁坐定，将她紧握的指头一根根轻轻掰松，那信纸早被掌汗洇得绵软。油灯芯烧得极短，我俩谁也不曾起身去剪。将熄未熄之际，我吟出一首歌的上句，道严岛海面上今宵连一豆渔火也无。汐默想了半晌，方才接续下句，声调磕绊：未曾出港的船只，本就不曾点灯。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_5:event:ask","text"],null]']
src = "blake3:200ec22d4b537713c75e31034ffa2b6b9f9ef61ed69b899210be04d4b64d4d98"
text = "伴着汐枯坐至灯熄"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_5:event:compare","reply"],null]']
src = "blake3:e8d58a1809e83af8172affaaef9c1d0605a4faa57f630158383ddd1e0b80336c"
text = "那几日京中传出的风声颇有几样：有人传村上水军全数助了毛利，亦有人言能岛压根连船缆也未解。我将听得的每一种说辞尽皆笔录，并注出传话之人：言继大人、堺的纸商、本家门房，还有阿濑。唯独阿濑把能岛同来岛分得丝毫不混，旁人张口闭口，村上不过就是村上。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_5:event:compare","text"],null]']
src = "blake3:6bbaf316f7355a612c7528274cd0d9dd0005959f940bec0e4836c6b64beb3ec1"
text = "将各方传闻逐一排比细看"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_6:event:ask","reply"],null]']
src = "blake3:7017dcf4fed08cc43840f503dda40c7f3f522c580ff5a9c152947fd53f884af4"
text = "我并未接她的笑，只问此信是乘谁家的船渡海来的。她怔了怔，翻转纸背，那背面录着讯息辗转经过的港口：里斯本、卧亚、满剌加……她读得磕绊，我遂逐一替她念出，又以扇骨在廊板上划出海岸线弧度，哪一程须候季风，哪一湾要绕岬角。划至丰后，菖合上折扇，吐出一句“澪大人倒像个船头”，这一回再无人发笑。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_6:event:ask","text"],null]']
src = "blake3:b8356f88b52fbc958b2a250cb2bba4e773e0ebc3f464f51f739e791ee5be2b8c"
text = "问菖这消息搭谁家船来的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_6:event:compare","reply"],null]']
src = "blake3:4a6bec5680420cd46b366af466e9d98a5d57b65a1691d41259cdcad19c3fc676"
text = "我记起本家老女房曾提过，我降生前四年，叡山僧兵同京中法华众大动干戈，烧毁大半个下京。南蛮那头由领主定夺教派，京城那一遭，却是谁家刀枪多谁作主。我将此两句落笔怀纸，入夜后递与兼定瞧，他默诵两回，将纸好生收入自家书箱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_6:event:compare","text"],null]']
src = "blake3:980c21ff1a1783a633b2639ca3915ac9b0bac3678aa6b372a7dc24e21e37aa54"
text = "拿京中法华之乱两相比较"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_7:event:ask","reply"],null]']
src = "blake3:459ab44071e71151164e33ccd181a12fb4addb1d8dde2e2841ee8e678f32f4b0"
text = "我便请教言继大人，本朝操办一回即位大礼究竟所费几何。他打袖袋摸出一纸旧账，原是当今主上践祚后筹措大礼的清单：绢帛几匹，禄米几石，诸国大名奉上几贯，尚且亏空几贯。自登极至礼成，前后竟延宕了整整十载。我将清单数目打头重算了一回，发觉比他原记的少算三贯。他一愕，自个儿复核一遍，这遭便闭口不语了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_7:event:ask","text"],null]']
src = "blake3:174ea3f0edd90044e414adf60330afc6c41bda2cea86011d07539131c64604c6"
text = "问办一回大典耗费几何"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_7:event:compare","reply"],null]']
src = "blake3:2b2f5c877a3b9ca641a555fd27f434fca4adbe8a155c724fd516e3a81ecb40bd"
text = "返室后我寻出本家所藏《愚管抄》，直翻至白河院数卷：辞去大位，退居院中，出口的话反倒比居位时更作数，鸟羽、后白河两院莫不如此。那南蛮皇帝入了深山寺院，未悉究竟是去诵经，抑或亦要隔山听政。我将此惑录于纸签夹入书页，候着公条大人前来授课时请教。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_7:event:compare","text"],null]']
src = "blake3:d505b072ecfbf6e701303b1e1f820da4fdf800cebf616d69e28c846ddbd7b4cb"
text = "翻检《愚管抄》寻让位先例"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_8:event:ask","reply"],null]']
src = "blake3:f5ca49e19076848f7bdd123a11baf31b7dc4b8f4df65b8f13f08fa41b2b8f1a1"
text = "我忖度不出冰封大海是何景致，只得回想冬日里的下田河口：枯苇披着一层白霜，船舷薄冰教船桨一磕便碎。三艘船径往白茫茫处驶去，舟中人入夜多半也要思乡。我遂咏成一首，上句吟霜，下句写望不见的彼岸，随手夹入覆母亲的家信。汐瞧过，说下句意境太寒，我却一字未易。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_8:event:ask","text"],null]']
src = "blake3:e5fa4e3312372c642b1774e61d81ecc2626fcef4c6733c7b979f30f69b43ec36"
text = "为冰海行舟赋歌一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_8:event:compare","reply"],null]']
src = "blake3:b417e4178f68f41ee1c7c48408e85bd95d400e88a762e4d36c6d76627f3aa4ac"
text = "闻说宝镜寺藏有一轴绘着五天竺的旧图，我央求尼僧容我一观。图卷极北画满连绵雪岭，岭外空空如也，画纸到那处便尽了。我跪在图前找寻半晌，寻不到英格兰，也寻不到契丹北面那片海。我便把图边摹写下来，在空出来的那一角添了三条小船，船头俱朝向纸外。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_8:event:compare","text"],null]']
src = "blake3:83ca6cacc08d2885f1eddc94ef5bd235ab6e812d308ae1c91cef569090daf061"
text = "往宝镜寺观览天竺古图"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_9:event:ask","reply"],null]']
src = "blake3:76091eb91774a5cffacf370cbf9bbdb40278469368c916bb60e97064974764b0"
text = "我记起下田老辈人讲过，先祖那代曾逢一回大震：海水先骤然退去，露出平素从未得见的暗礁，继而如高墙般倒卷扑回。我修书一封寄予阿濑，叩问大震既发，潮水退至何处便须奔避山巅，船只又当向外急划抑或拖上滩岸。信末更勾绘出河口沙洲地形，将记忆里每道水沟逐一标出，恳请她替我圈改错漏。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_9:event:ask","text"],null]']
src = "blake3:754350889d81a6176e764ddd386e1f808869095aca964c883e9258c4d810fc80"
text = "致信阿濑问询震后海象"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_9:event:compare","reply"],null]']
src = "blake3:775e34f7ad94174d9a12f9316e8e48337913efc5903ab4df7e17f3385c766ac5"
text = "我径入本家书库查检旧籍，寻出本朝历次大地动：正平年间土佐那一遭，明应年间东海道那一遭，均不过寥寥数语，无非哪座佛寺倾圮、哪个海港沦没。唯独唐土禅僧，竟能报出八十万之巨。我将两处记述并抄一纸，一端计点人命，一端计点伽蓝，端详良久，竟道不出哪一桩更令人心惊。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_news_9:event:compare","text"],null]']
src = "blake3:16041e7eab8278f4cc23f7bb789eb0392d32e8213ff2a87579b21b2a4b334091"
text = "翻查本朝地动旧录"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_0:event:question","reply"],null]']
src = "blake3:95377198f077c9b24eea6169a5f3198c742a54837e646b3ec53e0cc158e80dc7"
text = "我开口问老僧，帆面上写这些经，是念给谁听的。老僧答是给渡海之人。我将画卷倒转过来，迎着窗光细瞧：那一行行经文分明朝向画里的海岸，真坐进船舱抬头望，只能见着字的背面，个个都是反的。老僧把卷轴讨回去，左翻右看许久，方才开口：“是写给岸上送行的人看的。”说完他收卷好图记，绳结绕了两次方才系牢。跨出门槛时阿濑问我瞧见了什么，我半个字也没吐。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_0:event:question","text"],null]']
src = "blake3:651e1d60b8072c7b59beb9cf172f84e9ae1584df7b0359f9522130f932599f92"
text = "问他帆上经文写与何人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_0:event:record","reply"],null]']
src = "blake3:7027dd295b1e0bad9ed842bb28f9c5436e6354e532fe5093fadf4f54e8f22d30"
text = "向老僧借了砚台，我把那图记依样描摹一遍，连卷末的题跋也逐字录下：何年打那智传来、经何人之手转抄、寺中出过几位渡海的上人，无一遗漏。题跋皆是汉文，里头有几个字我不认得，便劳老僧逐个念给我听，我在旁使假名标出读音。临了又在尾端添上一行：天文廿二年秋，足摺金刚福寺，见。纸张折作四叠收进怀中，返程一路半点水都不敢叫它沾着。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_0:event:record","text"],null]']
src = "blake3:2a579c2e24ee766703811b10a7719d92f2c27a92b36a63230e069f2858e88767"
text = "照描图记，抄录全篇题跋"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_1:event:question","reply"],null]']
src = "blake3:d9a4b898e87181c1843e75e57a198ba2a605382de2aae3177e3d0251e7f79b79"
text = "我拿这话去请教山科言继大人。他手里正碾着药：“文安年间，倒确实有个白比丘尼打若狭进过京，闭着门，瞧一眼便得交钱。有一家的日记记她两百多岁，换一家又记作八百岁。”他手下停住，笑了一声，“同一个老尼，两处差着六百岁呢。”我问他那两家可写没写她的头发和脸。他想了想：“都写了，一头白发，脸生得嫩。”话落又垂头碾药，才动了两下，却自个儿停住了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_1:event:question","text"],null]']
src = "blake3:4f74f8837f6acad3a9e2ccbe37ece82155d120990c2c69801c75722051cdfd34"
text = "拿去请教言继大人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_1:event:record","reply"],null]']
src = "blake3:dbbe26d157bc5e230e63b0ee583b102ad6b53febebe9c3d0db81adb3ec2cbf6b"
text = "我请那行商再讲一遍，照他的口风一句句记上怀纸：开口的是小滨鲭鱼贩子，风声打他表兄处传来，撞见人的地界在朽木山道。连听来的年月、在何处厨下听的、鲭鱼几文一尾，一概记全。汐在旁嘀咕，道姬君记鱼贩子的闲话，比誊抄《古今集》都仔细。那张怀纸叫我夹进从土佐带来的潮记里，正贴着去年足摺的那一页。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_omen_1:event:record","text"],null]']
src = "blake3:902dfc9ed7ab3e6253ae893fc0bf20d30551e1307a43b017e3770f0bbd0381dd"
text = "依行商原话记下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_0:event:examine","reply"],null]']
src = "blake3:1d99e205091debe99e7cc59324a6f47d15c3b6f4452179e18dcbed444fea656e"
text = "阿濑盯了我半晌，方才道出那是潮讯。月牙弯角朝上作涨，朝下作落，钩子划了几笔，便指船只候了几个时辰才盼来潮水转向。她点指着其中一行：这艘船在来岛海峡口足足候了半日。我拿眼下下田的潮汐与之比对推算，直算至暮色落尽，终于算清能岛那头的潮比此地迟上几何，随即又把那些记号临摹进怀纸妥善收起。阿濑叹道：“你这姬君，盘算钱财跟算潮一个模子。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_0:event:examine","text"],null]']
src = "blake3:be12f2081b085e25b4d22c8feead666f8d4ca3641024497734f6e51b2fb4be8e"
text = "询问那些月牙记号为何意"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_0:event:leave","reply"],null]']
src = "blake3:f35cfebd48585e27f1141b402e4379e8f62a17b08828e20059ad4d15dcba278a"
text = "我循着旧折痕将那一页重新叠好，折至末一道时，方才留意到纸角留着一处指甲掐出的印记，力道深得透过纸背。阿濑重新扎妥账册，扣严箱盖，手掌贴在箱面上停驻了片刻。我没开口追问那印子究竟何人所留，只把它的模样暗记心底：是个歪斜的圆圈，缺着一角。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_0:event:leave","text"],null]']
src = "blake3:a2ec9ed4beb70be5a2185d99e0b248e9cf8f50a485d9a034e8c6c8dccaef10c1"
text = "依着原折痕帮她折好那页"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_1:event:examine","reply"],null]']
src = "blake3:a81349c31786fe3eba28c508de708588c6311cf6c5950e65b2c6443b9e3374e2"
text = "我先跑了一趟上游头一个村子，再去第二个，折回来才寻渡守。三处都舍不得出钱，偏生各家的船全得打那木桩旁经过。我便拿主意道：一条家出钉子，两村出人手，渡守出船，谁都不用认归自家。这般来回说到第三日，三家才都点了头。母亲听罢，拨过一颗念珠：“你舅舅在府内同南蛮人讨价还价，也是这般光景。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_1:event:examine","text"],null]']
src = "blake3:0ba342f47c381909b631ef665a374968ba23fe7e2893cd4dbc525e31ac67ac9b"
text = "往来三家替他们说合"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_1:event:leave","reply"],null]']
src = "blake3:7e4f5bf5b7b1569ba7a940c0ca6f8e0ad72670d44f6a9caf7cd2dea0b47cc483"
text = "我蹲到木桩旁，拿指甲刮去桩头泥垢。那烙印是一只圆圈里套着三横，周遭攀满白花花的藤壶，顶大的竟有指甲盖宽。母亲说，藤壶一载光景长不到这般个头。想来这桩子在水中立了有好几年了，不知归属何人，也不知它曾指着的那条水道，如今是否还在。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_1:event:leave","text"],null]']
src = "blake3:d7a10483b25cc0cb601a7cc5c14d8463929ba6df1e2189d03ddb589643f77738"
text = "蹲身细看桩头烙印"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_2:event:examine","reply"],null]']
src = "blake3:4a8a1908a1a37a0177669ad400023d87f130cbc511110c350fcafa5ea1077894"
text = "压妥了石块，我却没急着下去，只坐到屋脊上候着入夜。北斗最先现身，果真与木板所刻分毫不差；昴星却迟迟不肯出来，阿濑道非得挨到半夜以后。我在心底凑了一首歌：屋顶刻下的星辰不怕风刮走，天上悬着的那一把，反倒教云翳遮住。默念凑了五回方才顺口。及至下到地面吟给阿濑听，她嘴上说着不懂，末了却又喊我再念一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_2:event:examine","text"],null]']
src = "blake3:0a48213457c8eaa2ab5668e1a38a544a968b21475224d15d4f4a90cef48c519a"
text = "照这片星星咏一首歌"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_2:event:leave","reply"],null]']
src = "blake3:e86479092d2f672e4df29203d23cbc0e6c3d803f52fca71cc4612f42ee3fae0f"
text = "我把木板翻正盖回原位，再压上石块。指腹擦过那道刻槽时，觉着勺柄那头凿得格外深，恍如刻的人曾在那处停留良久。当晚大风果真骤起，我卧在被窝里细听，屋顶压着的石头却纹丝不动。打那以后每次仰望北斗，我的眼总会先去寻那截勺柄。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_2:event:leave","text"],null]']
src = "blake3:672fa0a7bdc4690178b1ba44c380d52841331592dd536b9f3971ad0f699dc360"
text = "将木板照旧覆回原处"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_3:event:examine","reply"],null]']
src = "blake3:16f2d207de05b5c0494c8d66a3e26a9ca71b9e4c5e82f33b9fe64b061ec032e5"
text = "那船头是个掉了门牙的老丈，屈着指头一处一处报与我听：打平户动身，先在赤间关候潮，绕过周防诸岛又得等，及至来岛，船只全堵在海峡外排着队等潮信转头，待明石外再等上一遭，这才算进了堺。“这一路啊，不是使劲摇橹，便是停船干等。”我将他念叨的地名与各自耽搁的时辰，逐笔录在怀纸上。鞠千代抱紧鹿皮立在一旁，竟听得连脸红都忘了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_3:event:examine","text"],null]']
src = "blake3:93531376e45347daad161e873956a2235a765e21e13b07936f361e8956472a38"
text = "问船头这砝码经由哪条海路"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_3:event:leave","reply"],null]']
src = "blake3:bafd87a896872fd5c784a6a3e4cc22e4923c71399464df0d998f9bea2628b219"
text = "商贾允我拎起来掂量一番。入手比眼瞧着更坠手，底部錾着一道细微印记，多半是某家商铺的戳记。正面铸着“十两”二字，反面另有一字，可惜磨损得仅余半边。鞠千代探头过来细看，看罢喃喃道：“鞠、鞠也该备上这号砝码，一上秤便晓得踢不踢得起来。”话刚出口他自个儿先呆住，复又缩回那卷鹿皮后头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_3:event:leave","text"],null]']
src = "blake3:cac7da0073df6d4f07083dface4101ad00ed8aecb28e276b0ee7e353bebd6f02"
text = "掂掂砝码分量，录下字迹"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_4:event:examine","reply"],null]']
src = "blake3:b086b4f341b64b37a59d1441de4e1b346a351adc813f5e2f0888076ee183d521"
text = "我先探问那学徒，纸屋收这整筐出价几何。他报二十五文。我便道不如作价二十文让与我们，还能替你省下挑担往返纸屋的半日脚程。他抓了抓头，改口二十四文。我又点破那条金箔纸原属经师，理当奉还，不该算入筐价。他思忖片刻，终究二十二文拍了板。小督点钱时指头飞快：“一首和歌才换三升米，你这一张巧嘴，抵得上五升。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_4:event:examine","text"],null]']
src = "blake3:c90c682a89ff59d5ecf0e06d3f7f007511dded29b921935bad24f1af965b1df5"
text = "帮她同那徒弟还价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_4:event:leave","reply"],null]']
src = "blake3:eac816b5849a0cb5dc59a4e0b0717d8e50ec4f80a3f33b42a734a65ad6eecf52"
text = "小督将拣出的纸片逐张摊进我掌心：杉原绵软，吃墨迅疾；鸟之子光洁，墨汁浮于表面；檀纸厚实，布满细密皱纹。“合上眼也得辨得清，”她道，“拆信的人指尖一搭纸面，便知寄信人家中仓廪有几许余粮。”我阖目摩挲了三回，到第三回竟无一差池。唯独那条缀金箔的纸，她径直折拢收起，未许我触碰。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_4:event:leave","text"],null]']
src = "blake3:07c8ebd7c458c8674157a493dc2b99d3f312535902cb9dadb6ade8eb8603e4aa"
text = "细摸各色纸张的差异"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_5:event:examine","reply"],null]']
src = "blake3:63e20527e03fe10ee37417fb459131aa14e8170f1debb044af76bac6a2851dbf"
text = "保子大人凝视了我片刻，只道：“改天罢。”次日却差人把那册书送来我房里，附着一张纸条，上头仅写“晒透再还”。我伏案抄录了三夜，抄至画了细线的几首，才看破他挑剔的缘由：措辞太满，一首里硬塞进两首的意绪。我随即找出自己去岁写的和歌，删掉了好些地方。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_5:event:examine","text"],null]']
src = "blake3:22d53b28cd446e02c3c0a964c3edefe98bcdfee66da843710b54e475ae248411"
text = "恳请容我誊录这些手批"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_5:event:leave","reply"],null]']
src = "blake3:0a94829a0c8017a82703c731fb01fe5a92e783d1ce2cd97d053ab583125443b2"
text = "我避开那一册未动，继续帮她翻晾余下的书卷。直晒到午后，方才察觉：每册书脊的装订线皆是新近换过，线结系法如出一辙，显是出自同一人手笔。保子大人见我盯着那线结出神，幽幽道：“他临走前，一册挨一册亲手换的。”说毕便垂下眼，仍旧翻页。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_5:event:leave","text"],null]']
src = "blake3:9edd9fb0f986dd487fdcee441e0e017b4c62a6edde5bd4595f95c4e1ce983421"
text = "帮着她翻完其余书册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_6:event:examine","reply"],null]']
src = "blake3:bd67605dafebaa00cadef4fbec9a3bda8786dbf35a559cd26a2e5d9cc622cc0e"
text = "船一脱浅，我就蹭到船尾，向那老船夫问个究竟。他指点我看：水皮上若飘着一条细纹，水势比旁处缓，底下便藏着浅滩；冬日辨水纹，夏日辨水色。往后一路到八幡，我挨个儿数着水面上的纹路，竟一处不差。典侍隔着帘子问我嘴里念叨什么，我回说在算钱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_6:event:examine","text"],null]']
src = "blake3:4c9122ec5e7cfb4dbaca7d888b0c926815636e82db75ad2c70b29f545117b69c"
text = "向船夫讨教怎么辨认浅滩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_6:event:leave","reply"],null]']
src = "blake3:3a4168a14388cfbeab7e4005bb7958448574041ac989645c1f2cb52f50da1e84"
text = "我把目光从那截船底移开，望向岸上：左首是一株歪柳，右首是一座小祠，祠前的石灯笼没了顶。待船行过去，我便在心里将这三样排了一回。折返时水涨上来些，沉船已经瞧不见了，可我一眼便认出了那株歪柳。典侍并未问我在瞧什么。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_6:event:leave","text"],null]']
src = "blake3:e77131d4fdd2c0b19886cdf209663045dea4ea2dec0e0b783c9ad49484b790c5"
text = "记下沉船现身的位置"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_7:event:examine","reply"],null]']
src = "blake3:e9929a4d95692fac4477281cd4a909799ac7a4f6177c3c106e224155de6b03a8"
text = "我请商人把泡坏的苧捆抬过来验看。说三成是多了，浸湿的不过压在底下那几捆，至多占两成。我同他说明，泡坏的两成缓到秋天，余下完好的照旧缴纳，再把书斋后头的廊子借他摊开晾苧。商人思量了半晌，点头应下。公条大人始终未曾作声，待商人走后，才翻开书卷：“方才讲到哪一句了？”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_7:event:examine","text"],null]']
src = "blake3:65818bde32beb8f0175f3f9060d2bc8257d54950f6898f807d3cd207e240129e"
text = "代大人同商人说合"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_7:event:leave","reply"],null]']
src = "blake3:3331ce1f862db9e1d31f23fde9fa3a302a9ac15034ef1b44f4a932d2236a7418"
text = "我跟出去细瞧了那几捆苧。水痕只印在下半截，一圈深套着一圈浅，好似海水退过三回。这等印子必得连泡数日、干透再湿方能留下，他却口口声声是一夜的工夫。我返身回书斋，一言未发。公条大人瞥了我一眼，似是看破我瞧出了门道，便接着讲他的《源氏》。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_7:event:leave","text"],null]']
src = "blake3:f191daf88c0b4b89dad99b4c213953abf68018b4b39dad358cbdfd9276b97731"
text = "上前查验浸湿的苧捆"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_8:event:examine","reply"],null]']
src = "blake3:f49a72a5247f4f2d82301301abb26cf103615ff3c347333f6f50583d1fac4603"
text = "墨壶里的墨早已干透，言继大人往里滴了几滴水化开。我拿起那支磨亮的笔，在一张包药的纸上落墨：行过七国的脚，如今停在哪片草下。写完又改了一字，将“草”换作了“云”。言继大人微眯着眼细看了两遍，从怀中取出日记本，在今日那一页补上一句：“一条姬作歌，为阿弥。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_8:event:examine","text"],null]']
src = "blake3:2a6abce0acd12023685a964e645bfde343fdcf9388046e9f157ba634c56d500c"
text = "用这矢立为阿弥赋歌一首"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_8:event:leave","reply"],null]']
src = "blake3:7d0f89555a3c9f037860bee4ca21885e2e05b880302d4f5d786dedb11701c570"
text = "我拉起袖襟把矢立揩拭干净。靠近笔头的下截有道斜凹的磨痕，正是大拇指常年摁住之处，位置偏在左侧。阿弥原是个左撇子。我将矢立递还给言继大人，顺口点破这事。他怔了片刻，抚掌大笑：“正是！连这茬我都漏记在日记里了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_8:event:leave","text"],null]']
src = "blake3:45cee77a7628937c1819b4cd44aa9d44fcaedec91209d0729c79279d812b2385"
text = "拭净矢立交还给大人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_9:event:examine","reply"],null]']
src = "blake3:c58126326cee31db2eccaa1a99bd4b1c2f268ed65cf1c445a494ad1cd0074bf0"
text = "货船总算靠岸，我扯住一名堺来的船工细问。据他说扫帚星挂上天那几晚，堺那边的海水涨得异乎寻常，落潮又极慢，其中两日甚至漫过了盐田。我央他按每夜光景逐一报清，录在纸上，旁侧再标明当晚星尾的指向与长短。回局里一对照，星尾明明逐夜拉长，潮势却高低无常，全不顺着星走。典侍问我比出个什么名堂，我答潮和那颗星并不相熟。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_9:event:examine","text"],null]']
src = "blake3:d98909af2aeb6f88d5955ca79a529e446d85c8fa65886cf6f34021fe4baedbc3"
text = "找堺来的船夫打听潮汐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_9:event:leave","reply"],null]']
src = "blake3:8e038d5f7db993aabad0691f3b8245df7add7e8b224c6018f8cf994fee7ec3f6"
text = "我没去盘问船工，只陪着典侍立在岸边。那颗星辰跟着满天繁星一道，绕着北辰缓缓旋移，挪过了对岸那株最高的榉树。它落于树梢哪一侧、在哪个时辰移过去的，我都记在心头。回去后典侍执笔写日记时问起，我答得丝毫不错。她望了我一眼，笔锋顿住：“你这双眼睛，留在宫里倒是屈才了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rare_9:event:leave","text"],null]']
src = "blake3:03c5f1cdcbefd118f5d938af3fdcbedac6905f74317885a1c0fcae3749daf3d3"
text = "伴着典侍看尽今夜星象"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:back","reply"],null]']
src = "blake3:6e8505d98a6f32d844fd675457401fe9e0923f987709b4eb87644ee6b0ac0a78"
text = "我按原次序把油纸一层层包严，照旧打好绳结，搁回梁上拿旧网重新压实。等我下梯，阿濑往梁上扫了一眼，一言不发地低下头续着补网。许久之后她方才出声：“船上的刀短，是为了不磕着桨。”此外再没多说半句。当夜她补网熬到深更，手里的梭子穿得比往常缓些。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:back","text"],null]']
src = "blake3:d05ea7c548a09c13d24836533aa0e941bc84c51970cd6eac7b4424386f803558"
text = "原样裹好放回原处"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:learn","reply"],null]']
src = "blake3:c5fd3dd389dddaf1b5c6439a1effe336febcf441df71c51a51de4bc4175cbadb"
text = "我怀抱那把刀下了梯，开口说要学。阿濑并不伸手，先拿眼盯着我：“学了做什么？”我回说护船。她这才接过去单手掂了掂，右肩往下一沉，随即转到左手：“在船上拔刀，先顾着脚底下的板，再盯对面的人。板一滑，先栽倒的是你自己。”她仅提点这么一句，便把刀收归梁上。打那以后每次登船，我都先往脚下瞧一眼。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:learn","text"],null]']
src = "blake3:7c7982c86a890d5b02a427541ebaf879a0e335b91cd29f8f4f52551098191275"
text = "抱刀下梯，求她教我"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:ushio","reply"],null]']
src = "blake3:e71b8af09875bca720bdd2cae4c3efe69b2fba410f78383bb1d69bab464b62ab"
text = "我把刀包回原样，跑去寻汐。河滩上她正刨着船板，听我讲完，手中的刨子一滞：“我娘的。”我又问可曾用过。汐吹散板上的刨花：“用过的刀，才包三层。”话落她又垂首使劲刨起来，碎木屑飞溅到了我脚面上。我明白问不出下文了，凡关乎她娘的底细，汐向来替她捂得严实。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n0:ushio","text"],null]']
src = "blake3:49c3c18c76d4706cad6f1556e0368800a59e1094cc5d8b238dda1ab0f1cb8997"
text = "去问汐：刀是谁的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:ask","reply"],null]']
src = "blake3:db6a5bfe353a309bc674da95a0737ff01b7df51dab57738f9cf9a414c79d46a2"
text = "当夜我还是问出了口。阿濑在灶旁烘烤网梭，火光晃亮了她半边面颊：“那厮的嘴巴，比他自己的眉毛还要短。”歇了一会儿她继续道：“船归哪家，干姬君何事。那年姬君的舅舅，只怕尚未断奶。”她将烤透的梭子拢进篮中，“交了旗钱的船，我护着；不交钱上来打的，我照砍。就这么一回事。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:ask","text"],null]']
src = "blake3:ceee40812f2309bea6190b0b7144d852def7dd74f491efb6fd69440eb14ead6b"
text = "当晚便问阿濑：可是大内的船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:keep","reply"],null]']
src = "blake3:d10df13c1c0f8353a9fa41ea67e92e559dc642ee1676b0d1daca36d5dc39528b"
text = "管账一走，我仍像往常那样随阿濑去河口收钱，只字未漏。不过每逢她腾手换撑篙时，我都抢先一步把篙接过来。她朝我瞧上一眼，便放开了手。大内的旧事，我同样没去问母亲。舅舅在山口掌着家业，阿濑的肩膀在下田发疼，这番话我不知该向谁说起。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:keep","text"],null]']
src = "blake3:e0acd16a1985565c40d4e37fd4aad793bd840db0710dd5e5177a3ee3292de8b1"
text = "不向阿濑提起，权当没听见"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:mother","reply"],null]']
src = "blake3:164f3aae1e8ac54515c34fbc6ce982ae0d890e9508f2866252349623f289c7ca"
text = "母亲正守在灯下抄经，听我道明原委，笔下全然未停：“我心里有数。阿濑入门那日就讲白了。”我追问那她缘何肯来。母亲直把这一行抄尽才缓声说：“她说，奶水是给孩子的，不是给哪一家的。”她抬手将写妥的一页挪到旁侧晾起，“这番话，切莫再去问她第二遍。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase:n1:mother","text"],null]']
src = "blake3:50c68cc1a50db789d450becf1a19e4ca85f00a570d458ec9fecfb1b0c00efe91"
text = "去问母亲可晓得这事"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:confess","reply"],null]']
src = "blake3:43c6a91523fd15c4ee7be800e3319cd89e33d4cee0cced5c9d17c52c1ceaad42"
text = "我扑上去，嚷是我割的。阿濑举起的竹子停在了半空：“我早知道。”她放下竹子，转身去找堺商了账，赔出去的是她自家攒下的帆别钱，半分不许我拿。晚间汐伏在席上，背上纵横着一道道红印，我拿姜膏替她擦拭。她疼得连连抽气，嘴里却道：“叫你认了，我这顿打算白挨了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:confess","text"],null]']
src = "blake3:15f3364a32c22053eeb6fc0bb0a71d4b6c864bb007f4569d3d52522e1c217cdc"
text = "走上前去认：是我割的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:shield","reply"],null]']
src = "blake3:04517d7c9430a03b05ab952dccc50e29e8e4c8445168a47427a8711413d6583f"
text = "我抢步挡到汐身前，竹子抽落我肩上，仅此一下。阿濑顿住手，凝望着我，看了好半晌，随即将细竹折作两半丢进河水里：“姬君的背，我打不得，这才打她。”那天她赔给堺商的钱，挪用的是她自己攒的帆别钱。夜里汐背朝我躺下，我听出她在被窝里发笑，笑得两肩一抖一抖。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:shield","text"],null]']
src = "blake3:9845039cc5f01d8e032b8e1f5014eb5c221a60d0125a54bb38a5564d88c1f738"
text = "迎到汐前头，替她挨下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:still","reply"],null]']
src = "blake3:d9f6a2b25955b1e6d868f599c417c859116dc32ddcb65929de4db050b6810400"
text = "我站在那儿没动。竹子连打了十下，汐半声没吭。打罢，阿濑将竹竿靠于柱旁，动身找堺商赔钱，用的全是她自己积攒的帆别钱。那晚我怎么也合不上眼，起身瞧见汐正坐到网棚下补渔网，脊梁挺得笔直。她头也不抬地开口：“姬君莫过来，我娘看着呢。”网棚另一端，阿濑亦坐着，手里也在补网。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_cane:n0:still","text"],null]']
src = "blake3:6dc9f64d81ccb0d37287e93667a612405af34785e1152a5afc421b06f0f41392"
text = "定在原处不动，看她挨完"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:go","reply"],null]']
src = "blake3:e6e559f012e6c831046ea22a87a1824d82ac732e03e2cac58f373e23fe4d9ae9"
text = "思量了一整宿，我写信回道：能岛原是她的本乡，番所的账目也唯她算得清爽，若该回去便回去，下田这片河口等我归来自己守着。信甫一寄出，汐连着几日不同我搭腔。隔了一个多月，阿濑寄来回音，仍出代笔先生之手，通篇只得一行：“姬君的意思，我明白了。我不回。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:go","text"],null]']
src = "blake3:5e9552e2b6124137788b9b440f9e127396049687a89bd84cbf4e2bd64690d39c"
text = "写信劝她回能岛去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:stay","reply"],null]']
src = "blake3:90f37668b5aa2e68066e4f38ccfad42e8451d6b0a45e8a8f43d75c27f1627111"
text = "我在回信里写，我尚且未学会认河口的沙洲，她一走，谁来训我。写完自觉很不要脸面，可还是没改。阿濑回信到得极快：“不用姬君央求。我打根上就不回。”汐读完，把信折整齐揣进怀里，那是她头一回把我的信收起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:stay","text"],null]']
src = "blake3:d05686d8c3b80c8083dc90eaefcee9c622139c46785c1d3b02aff452dd052626"
text = "去信求她留在下田"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:write","reply"],null]']
src = "blake3:6931660e961642588eb964e02987956ae2d0085ed71415539f0cc51774fc81ae"
text = "我按宫中起草奉书的体式，向能岛的村上家修书一封，署上一条家的名号：阿濑乃一条家姬君的乳母，在姬君未出海前，人须留在下田。言辞十分客气，骨子里的意思半寸不让。汐看过后道，她娘若晓得我代她应答了，准得骂人。果不其然，阿濑后来在信里将我数落了一通，数落罢又补了一句：“能岛那头，再没差人来过。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n2:write","text"],null]']
src = "blake3:d926479dec85fdc4f2b07949601dba314efd05151af990d3e5a3fdb043c14891"
text = "另致书村上家，代为回绝"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:ask","reply"],null]']
src = "blake3:63c4883d119f50d97a6a8abd6fffd62e70b096b4a9c2bdb07d6925617e0c0f9e"
text = "我寻着旗账上押着的花押，修书去问能岛番所，下田那一行究竟因何悬空。回函是由来岛那头的船顺道带至的，执笔之人我并不相识：“不归岛的人，便不算岛上的人。”我将这页信纸折妥收起，未曾拿给汐看，也瞒着没告知阿濑。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:ask","text"],null]']
src = "blake3:c67a07213f95e6517fb5ef524b25cc434a63dcc40f6a2acd90dc1b162f13bdb5"
text = "写信问能岛：那一行怎么空了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:fill","reply"],null]']
src = "blake3:19db6ca3f4265e04d35afeb1a8e4e282cd82ec136eabc3aa53d075ecec2f983c"
text = "我研好墨，在那段空处工整填回“下田·濑”，又按往岁的数额补上分成，将这本旗账寄返下田。阿濑的回函寥寥一句：“姬君的字落进村上的账里，算不得数。”然而汐说，她娘把那一页折了个角，藏进装渔具的旧箱子了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:fill","text"],null]']
src = "blake3:5e106b33fbc2a737d6578e1fe501fbc98cd9b547563fa1278a7f7996c245bdae"
text = "在空着的那一行替她补回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:quiet","reply"],null]']
src = "blake3:bf840a33524bcdac376676133d78970bdb9b861b74f630c0465ea7f98aab7ef9"
text = "既然阿濑避而不谈，我也便按下不问。回书当中，我专问鲣节晾了几日、蝇虫多寡、今岁行情较往年可好。汐倚在一侧瞧我落笔，待我写罢，她夺过笔管自行在末行添上一句，捂着不许我看。事后我方晓得，她落下的字是：“娘，姬君全看见了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_kyoto:n3:quiet","text"],null]']
src = "blake3:d7dde82ea234cd73ba3e378a547206904a7e2ea7d7234f269bfd458480132e32"
text = "依她所愿，单回鲣节的事"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:near","reply"],null]']
src = "blake3:3a6f038b12ce5b9fc48ada2fbe645c4c7f5e1b63e25b963b9721f8b51f806976"
text = "回信当中我依样绘了下田的河口，将她标出的那个点从栈桥头挪往栈桥最外端那根桩子上，旁侧注道：立在这里，我瞧得见。阿濑回书训我画得失准，那根桩子底下全是滑溜溜的青苔。可到了开春那天，她站着的偏生就是那根桩子。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:near","text"],null]']
src = "blake3:7ff5785fb73cceaeae4640b004055e5b14ef056f152e86dfc638cc6b99289b02"
text = "复信：那个点，请再挪近些"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:refuse","reply"],null]']
src = "blake3:0f0a60f9f2ef744c247dc445cfcb287e653349f49f17c6967181479efb7fb4f3"
text = "我写信回道，我的船只收旗钱，不拿来砍人，刀还是放归网棚的梁上去。阿濑没给我回信。及至后来我登船那日，撩开舵板看了一眼：槽确实挖好了，刀却没在其中，只横卧着一根新削的篙头，拿油纸裹得妥妥当当。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:refuse","text"],null]']
src = "blake3:a32c739380692f645509e8dd68195a2eba8b6374dfad158414a58a10d081d10d"
text = "回信：刀送回网棚，船上单要篙"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:take","reply"],null]']
src = "blake3:a4617e15bdc083addf15322776d98da07dfb76155ca4256e1e499927e248c50b"
text = "我复信仅写两行：物件收下了，没到非用不可的地步不拔它。栈桥头那个点，我出河口时必定会看。落笔后我在纸背同样画了条小早，船首朝外，舵板那处点了一个点。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_ase_oar:n0:take","text"],null]']
src = "blake3:a77ea9a0d5b1551387742f3d3892f4e19a18a91b6a541b60dc28631a7db32dbc"
text = "回信：那样东西我收着了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:depth","reply"],null]']
src = "blake3:cf3fdb831810b128e5d667f7fff08c3e284b5f94d48e818f8feee7bdcc67090b"
text = "我候到千鸟走开去挂鲍，凑近婆婆跟前又追问了一句。婆婆仰起脸看我，眼珠让海水泡得泛白：“公家的姬君也信这一套？”我答我只是想知道。她拿刀在围裙上抹了抹：“底下那座京城，去了的人从没谁回来讲过。七寻，八寻，哪个说得准。”嘴里吐出“七”字时，她往千鸟那头瞥了一眼。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:depth","text"],null]']
src = "blake3:39bc7f24446f1c7ce48d918c0579ab6d8b72364198b79dbe352650928b099727"
text = "代她再问婆婆一遍：有几寻"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:kyoto","reply"],null]']
src = "blake3:e8e10534af190821795f4ce03ae693eb61aaf7c66250654115d003bcf779077f"
text = "回程路上，我与千鸟说起京城：宫墙全用土夯成，屋顶铺的是桧皮，大路宽阔得容得下十辆牛车并排行。她听得极用心，听罢问道：“可有海吗？”我回没有。她说：“那还是底下那座好。”说完自个儿先笑起来，笑得直蹲在路边站不起身。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:kyoto","text"],null]']
src = "blake3:059f3a4c4aeb64dc746e2a36f4248f1230acf58d782edddcf96cc3a946dbf294"
text = "同她说说我要去的那个京城"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:race","reply"],null]']
src = "blake3:da0d328f4c6ef198fbe513de27855732d3ee6e34793ddaa52282dfc4cdef15e4"
text = "我提议明天下水较量一回，看谁潜得深。千鸟登时高兴得不行，称她让我三寻。次日我俩一前一后沉入水中，潜至六寻，她收住势头，在水里冲我摆手，示意我往上游。我向上浮时回头张望，她依旧悬在原地，仰首望向我，发丝在水波中散开，宛若一丛海草。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori:n0:race","text"],null]']
src = "blake3:30b2a735d43380dd835ab5ae2cf955b521f55b78fcacec881fe89b561397da07"
text = "约她明天入水，比谁潜更深"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:anchor","reply"],null]']
src = "blake3:a8a1a03cd47d8feb4add5e00bb558c6d4cfa408d4ccc3fafacd29bc5519df96e"
text = "我回信与她：好，就这么定。等开春我出河口，落锚前先鸣一声哨，你在水下听见，便拉三下绳。写罢，我拿出那枚白石头细看了一回，又包回红布里。这块石头，我得带上船。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:anchor","text"],null]']
src = "blake3:da4fe41581f4c75e19f40c6f55cd95ad929021fc6d722bcb3bd34a7d0d85e560"
text = "回信应下，把锚地托付给她"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:roll","reply"],null]']
src = "blake3:fce0827d0bb3cfdf41c8e18962dcc2c44c93e5fa6c32eb48673b5f1f9612c4d5"
text = "我自箱笼中翻出出海的水夫名册，于末行添上一笔：千鸟，下田河口，海女，司管锚地。这册子是要呈交政所的，故而我写得一笔不苟。信里我同她讲明，政所的簿册已有她名姓，往后照看锚地的工钱，一条家如数拨付。她回信倒不客气：“那我可得多要些。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:roll","text"],null]']
src = "blake3:2fbd83d92a073ffa9976660fadacd1df2aa4512551f78288b63a34f7d3e682f4"
text = "将她的名字补入出海名册"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:sakai","reply"],null]']
src = "blake3:54369dd119af3ea257c90e52793bdefddcafcc4d40327622a2bfd1738618ccd9"
text = "我劝她去堺走一遭：那木匠人品究竟如何，亲眼见过再拿主意，莫负了她爹一番托付。她回信极短：“看过了，便再难回头。”我盯着这几个字，猛地想起当年自己赴京，亦是不曾见过便动了身。于是我歇了口，未再多言。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_choice:n0:sakai","text"],null]']
src = "blake3:5d32c10f19115174831a488f023833445bc9a2503ec27c18ed3dbd710fefdc33"
text = "去信劝她先往堺探看再议"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:beside","reply"],null]']
src = "blake3:df0f52316bd8da3f4b281474f2979e8c452905360be24cb8e821d69d0f5c3320"
text = "我在六寻处稳住，与她并排悬在水中，一齐往下端详那块白石头。水里甚静，静得能听出自己心跳。她偏过头，在水里朝我笑了一笑，嘴角吐出一连串水泡。我俩一块儿浮出水面，未分输赢。上了船，她将一把剖鲍刀塞到我手：“算平手，一人剖五个。”剖到第三个时，她开口说：“底下那块石头，我迟早有一天要摸到。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:beside","text"],null]']
src = "blake3:adef5a48e250aa330074da9874ec8627782af64d1ef1a60659b3b1b2dd244db4"
text = "停在她身畔，陪着一道瞧"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:pull","reply"],null]']
src = "blake3:8a10d67bfedec66ac7d3afe584f1945cc752e9c311e7fd5017b66c6738bff8e5"
text = "我停在她身旁，抓住她手腕朝上扯。她挣动了一下，没挣脱，随我一同浮出了水。上船以后，她揉搓着手腕瞪向我：“拉我作甚？我又未曾憋不住。”我只说自己憋不住了。她嘴上不信，倒也未再多话，替我剖了十个鲍，说是她认输，因她是先上来的那一个。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:pull","text"],null]']
src = "blake3:7112b6e97dd8e19a4281304762908af7c24974c0e2afe9d8c1698042ec1c839e"
text = "拉紧她的手，一齐往上浮"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:seven","reply"],null]']
src = "blake3:223b63af405052a79171e0f8a06c4617f696d69d3f2ae89b3dcddf90797499b0"
text = "我自她身旁滑身沉下去，下潜一寻，冰冷得教双耳嗡的一响，指尖总算碰到了石头。石块光滑，比上头瞧见的更显素白。我攥着它朝上浮，经过她身侧时伸手欲拉，她没由我拉，尾随我一齐浮出了水，抢先吹响一记口哨，比我的拖得长。登上船，她盯着我手里的石头道：“你赢了。”那日她剖完了十个鲍，半句话也未讲。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_dive:n0:seven","text"],null]']
src = "blake3:680952fe4f5526bc8a77551310ebf98d68a0f84ac91dfa7db7d5e7c8ab3ae9ad"
text = "越过她，径自下去摸那白石"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:follow","reply"],null]']
src = "blake3:3a2976ec7ed6588e4ff9be4749a4410984316cf588d6bed2a1fa118bca35b30d"
text = "我攀着绳索往下潜，一过七寻，海水骤然寒如利刃。再沉几分，四下已漆黑一片，唯有握在手里的绳索还透着暖意。我触到她的脚踝，一把死死攥住。她止住下沉，在黑暗中回身摸上我的脸，怔了一瞬，随即拽着我往上浮。爬回船上，二人半晌皆无言语。许久，她才开口：“你怎么也跟下来了。”我道，因为你下去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:follow","text"],null]']
src = "blake3:01fdd0ff37bcf4fc12483442951e531eb274ea1237f6e8a43124f1fc9815f153"
text = "攀着绳索追下去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:haul","reply"],null]']
src = "blake3:5ee4005d827fc1b8cb3f8b87a4f655b5ef1aa5b4c075691e6fcb2afd19e72410"
text = "眼见绳子放到尽头，我猛地攥紧，奋力向上扯。水底的人挣动了两下，随即顺从地随着绳子升了上来。探出水面时，她鼻下挂着一道血迹，自个儿拿手背一擦：“只差一丝。”我追问差些什么。她不作声，坐在舱底喘息了好半晌，方吹出一声极短的口哨。归途上，她将腰绳一圈圈理顺盘好，极是齐整，口中却说，下回再不系了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:haul","text"],null]']
src = "blake3:1fa004b875535915cf17f0ace8894388c886d118fa4723366e38ff6acdae39aa"
text = "拉紧腰绳将她扯上来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:letgo","reply"],null]']
src = "blake3:4614863a99d343c467386c9c7ba70e29594ddbdcc9bf9e709f06a6a82a8fdf4e"
text = "我没有拉。绳索悉数滑出，指间唯余末尾那个结。我悬停在七寻深处，憋得胸口生疼，默默数着数，数到自个儿都乱了数。忽觉绳子一松，猛地往上一蹿，她自水底浮了上来，擦身而过时一把抓住我，携着我同往水面上浮。登船之后，她道：“底下面有屋顶。”话音未落便泣不成声，哭得宛若幼童。我什么也没多问。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_eight:n0:letgo","text"],null]']
src = "blake3:9bd1ddd9c9f785effe36f62a624c36d92898eea401e81aca5649fcee15b5f7db"
text = "松开手任由绳子放尽"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:seen","reply"],null]']
src = "blake3:21c7466fdb98f7413fda62062bc31e2d9b36b47028da9a62a623a3290ebc1487"
text = "我回信探问，水底究竟瞧见何物。她的回音足足迟了两月才至，信纸上未落一字，唯余一幅画：一条条横线，愈往下愈密，最末层画着几枚紧挨的方框，像极了屋顶。画纸右下角，她工工整整落了自己的名。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:seen","text"],null]']
src = "blake3:ac9278efc85581953e6da00ec285ee3dfd2f19ff95fc86a88dbf875f38fef7ae"
text = "去信探问水底见到了何物"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:stop","reply"],null]']
src = "blake3:ba4350850b35380ee93f54ec8d6ff546b160b5c03105085bfbb0fd71c8d01c9f"
text = "我提笔回信，只落一行，字号照着她的写得一般大：切莫再往下。搁笔又觉意犹未尽，复添一行：七寻之下已是极寒，你浮上来前，先吹口哨。随后我取块红布裹好那枚白石头，与桧扇一并收妥。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:stop","text"],null]']
src = "blake3:efd23a3f9d16e57c57903e2726c1b8718277e3cf692b6e7e12a16208a3787195"
text = "回信告诫切莫再往下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:wait","reply"],null]']
src = "blake3:26b2ec2cbe829f8018995986eb631ed7cbf3a970ecd1162aa61fda8091c6138d"
text = "我写道：待我九月归去，与你同下，不许你独个儿前去。写罢生恐她厌我管束太宽，又补上一句：我也想见识见识，你那石子是从何处摸来的。没几日便等来了回信，通篇唯有两个大字，比往常哪回都阔：好的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_chidori_stone:n0:wait","text"],null]']
src = "blake3:85def47a769978af8605a4b0c9f6a40687d9b5ff590fee7227ce288a931187f3"
text = "回信约好归去后同下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:shell","reply"],null]']
src = "blake3:b388298a1d9976036e9796cb3f9a9329df65973f43a4a010337085e2e42aeadd"
text = "我从行囊底层寻出一枚樱贝，是辞别下田那日在滩上顺手捡拾的，薄得几乎透亮。小弁手捧着它，在洲浜上连挪了三回位置，末了定在松树根下，正对着她那首咏浪的歌。她说这下子她的海便是真的了，总算有件物事真正来自海中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:shell","text"],null]']
src = "blake3:c7598df3098ac5d8ca9920fa8b242298a1a821beb80a1c814f846fa73aeb5ba9"
text = "赠她一枚自下田携来的樱贝"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:tell","reply"],null]']
src = "blake3:707b3c01b95c44bfe95ab71f1e85c1d52921c49d55d3a3216b431066990a2363"
text = "我便细说下田河口的模样：沙色发灰，湿水便黑；退潮时礁石覆着一层藤壶，踏上去极是扎脚；海浪扑来先是一记闷响，退去时沙沙作声，恍若有人扫地。小弁每听一句，便在洲浜上改作一处，将胡粉铺的沙抹暗一分，又剪了一圈细碎纸边充作浪花。她问藤壶如何做得，我道拿芝麻粒粘上去便是。她竟果真去厨下讨来一把芝麻。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:tell","text"],null]']
src = "blake3:45516d609fc93371dc1eb1dda815e99ba3633de76c7a84d3d1c099286e9bfd2c"
text = "逐桩逐件讲予她听"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:truth","reply"],null]']
src = "blake3:06bee331518974def4a957cf793df5e05b3de112b168ac258d2297fb28edb923"
text = "我实话实说：真正的大海并不这般洁净，滩上杂陈着死鱼、破网与船底刮落的藤壶，海风一刮尽是鱼腥气。小弁听罢，垂首凝望自个儿的洲浜良久，道：“那我便不做那样的海。”她一处未动，依旧留着白沙青松。次日，我见她于松枝添挂了一帧短册，上头写的，是一个平生未见海的人在遥想海。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n0:truth","text"],null]']
src = "blake3:f70c550e0bd7a5d3cb78ae17e3c46be9ebd8569d6812be429187465d654b658a"
text = "实言相告海并非如此"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:hold","reply"],null]']
src = "blake3:7caf47f5789355273cb4383709ee9bc9a1faf7b833584afbedb292493fefb3f3"
text = "小弁陡然转身朝屋门里扑去，我急忙伸臂死死抱住她，她蹬腿踢我，又张口啃咬我的手，浑身气力大得全不似个女孩儿。汐也上来帮手按住。当房梁轰然砸落时，她不再挣扎了，软绵绵靠在我怀中，直勾勾凝望着大火。火光映照着她的面容，一时泛红，一时发黑。破晓后雨犹未停，宅子只剩几根残柱，那洲浜连灰都分不出何处是了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:hold","text"],null]']
src = "blake3:0f88148a832dda1be420e79c26951490897b4fdd22b173c8046321c2f342578b"
text = "拉住小弁阻她冲回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:run","reply"],null]']
src = "blake3:ee478c1ad2887ce1e16da1d2aa9ff6a22979ecd9307e08608765b7c5fd921bb3"
text = "我拿衣袖蒙住头脸便往门内扎，汐在身后急喊。满屋浓烟滚滚，我摸索着触到那方桐木台面，已然烫手，纸剪的松枝早烧作一缕缕黑丝。我唯独抢出一帧短册，本是系在最矮那枝松桠上的，边缘已焦糊一圈。汐自门口一把将我拖出，我袖口已被火星烧穿一个窟窿。小弁接过短册瞧了一眼，并未落泪：“正是咏浪的那一首。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:run","text"],null]']
src = "blake3:8136aec76ddf4513b73c3d9705fa83b8875b15aefd1fd596c14b6de676ba1347"
text = "闯入火场抢救洲浜"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:water","reply"],null]']
src = "blake3:131c0bb41ee522439ff1058d82a1837de6db08fde1b6bb3000cf0ce68ae23d13"
text = "我同汐随巷邻排作一列，自佛寺井边接力传递水桶。一桶冷水浇下去，白烟腾起，火舌不过朝侧旁偏了一偏，旋即复燃。这般传到破晓，掌心水泡皆磨破了皮，火势方才自行歇止——盖因前院屋舍已然焚尽，再无物可烧。小弁自始至终坐在对街门槛上望着我等，既未帮着递过一桶水，亦不曾哭泣。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n1:water","text"],null]']
src = "blake3:85dbbf78b0e664ef6e4705e8b50cc03365097191ff2f97336b50bed5b849ba55"
text = "随邻里接力传水救火"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:keep","reply"],null]']
src = "blake3:886dba50084d6f3378aa7970733d1a32ce20f1147e1ce115f596f9b02f980a79"
text = "我未曾丢弃。那块焦桐被我用油纸裹妥，压在桧扇之下。汐道火焚之物留着怕是不祥。我说海中万千物事都有，不缺这一块木头；可我这处，唯独只有这一块。话出口，连我自个儿都怔了怔。那一宿我屡屡将油纸包拆开复又包拢，反复几回，满手皆蹭了胡粉。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:keep","text"],null]']
src = "blake3:b51050243e50e9b1503f77bab63144aefc5832a080d0342d7de76415fd09ce26"
text = "留下它收入行囊"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:promise","reply"],null]']
src = "blake3:3657237c0e1653be3d0337bb401822e04d4186bed9c12299587c839c2a0ce659"
text = "我回信应承：待扬帆首日，船过下田沙洲便抛入海中，抛时替她诵读那首咏浪的歌。信发出去后，我仍将那段木块安放于桧扇之侧。真到了那一日，这木头我多半还是舍不得抛的，但那首歌，我定然替她念出声来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:promise","text"],null]']
src = "blake3:0bc60130890d492cf6595f9a3ec5a86522e75c2e4f6bfaa99e6dfa01231fcda0"
text = "应她出海当日投入海中"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:road","reply"],null]']
src = "blake3:dc248c89ee7097509c6b2304e6ead387e96276add2edd42c62566969829ce27a"
text = "开春她启程那日，我向局里乞了半日假，早早往丹波口相候。她坐于牛车后厢，怀搂一只包袱，瞧见我来，便掀开布帘一角，并未下车。我将一枚樱贝从帘缝塞入，她接过握得死紧。直至牛车去远，我方忆起怀中仍揣着那片桐木，竟忘却归还，亦忘了问个明白，她究竟还要不要我掷入海中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire:n2:road","text"],null]']
src = "blake3:4f3457c3442e0ecec6f5ce809cdb1290edbdcd40841c3336fccbd1061682dfb5"
text = "往她出京的路口送别"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:move","reply"],null]']
src = "blake3:9300c675334dc5f11e8582a48e969743904f63cbab22d9532e4ddee05c604e9b"
text = "入夜之后，我与汐乘众人皆已歇息，悄悄将洲浜自柜旁搬往廊下悬灯之处，灯光一映，胡粉所铺的沙滩竟亮如真景。翌晨一早，老女房默不作声，复令人抬回原位。小弁瞧出端倪，问起是谁移动过。我答说是风。她闻言唇角一弯，那是那些时日里她头一回露笑。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:move","text"],null]']
src = "blake3:a08b2f182ad225bd32f06ec9f3a43ff9abc1b4166f4fa394656cfe999fdb1651"
text = "趁夜将它移至灯下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:protest","reply"],null]']
src = "blake3:9f563ec16c0fd6e754a79240da49687d350683d437ad4f3ad396be63a3af50c8"
text = "我追赶上去，跪在长廊上禀明，这只洲浜是局中几个见习一同做的，那沙也是我教她铺就。上臈止步，回身望了我一眼：“土佐的姬君也跟着一道做？那更须摆在末席，免得旁人闲话，说一条家的人与地下人家的女儿争座次。”说罢她径自走了。我跪在原处，只觉膝下的廊板冷冰冰的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:protest","text"],null]']
src = "blake3:1e27d3a3f8d019612124629754736130284c82adc0b004b4341f936ba750f62f"
text = "追上申明沙是我教她铺的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:sit","reply"],null]']
src = "blake3:e744d98d12a8db8e36a5d39be02e56d722f16f78549264deba7bdd541e953226"
text = "我就在柜旁伴着她坐了整整半日。她始终沉默不语，只将垂在松枝上的短册逐张理顺。理至末后一张，她轻声道：“天上星辰赏物，想来是不论座次的罢。”我应声说不论。她道那便好，继而又言：“待明年歌合，我再造一座更大的。”说着，她抱起洲浜返回局中，寻了一方旧绢覆在上面。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_fire_tanabata:n0:sit","text"],null]']
src = "blake3:d42b5e58614adf23b1f89cf6363377c91d853aa61970c98fd3fddb03f94125f5"
text = "伴她在末席旁坐了半日"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:pain","reply"],null]']
src = "blake3:329ea061bb97f23fe60ab7852c22eb7b85e844769f7aca07b9696bd346eb6c9e"
text = "我写给兼定一封短信：手腕折断便要喊疼，讲出口，大人才晓得该给你配多少药，同讲价是一个理。本以为他看后要笑话我。没想回信极快到了，一笔一画写得甚是工整：“姊上所言不差。可若是不疼，教我如何去说。”我将这纸拿给母亲瞧，她盯了良久，嘱我收妥。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:pain","text"],null]']
src = "blake3:07ef90645e4d07e1be4e64f4f0ac9dc3413acb3c06f6046b41b6dbaa1e379a13"
text = "去信教他：痛了就要说"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:salve","reply"],null]']
src = "blake3:043e3a529e9a552c105b1140dd7eaf4a57b993d3b2875a762004c52388b76a0c"
text = "阿濑听闻兼定摔了手，打灶房端出一盒她自个儿熬的姜膏，叮嘱我把用法写明：早晚各搽一回，揉到发暖。兼定回信称按法用了，也揉出热意，依然不疼。弥平次在信尾另加了一行：殿下揉药那阵，眼睛一直盯在自己那只手上，仿佛看着旁人的手。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:salve","text"],null]']
src = "blake3:a8026b36847c481cf29532931ea4dd9d76f949089bc4f4d31b4266863cdf1dd7"
text = "请阿濑熬一盒姜膏寄去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:yaheiji","reply"],null]']
src = "blake3:da8d1cb9f77604725911cfbce5421d776c1eed64fc523082ef72f85596409ae4"
text = "我另起一封信寄予弥平次，着代笔的人念给他听：殿下平时吃些什么、眠得安稳否、常同何人搭话。寄回的依旧满纸请罪，夹杂着几句我要的消息：殿下吃任何东西都夸好，躺倒即入睡，待人一律客气，从不与人争执。“小人宁愿殿下冲小人吵上一回。”我念到这一句，忽而忆起阿濑斥责我的模样。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada:n0:yaheiji","text"],null]']
src = "blake3:20820a7722a9d1a903a8e924ae86b208a73b80d54c1753045f513e0e5da9ef6d"
text = "另去信问弥平次：殿下平日如何"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:ask","reply"],null]']
src = "blake3:8aa5f8efb474630bad8a3f4669aa193ddce17502d1b4a23d9073fd6e281278ac"
text = "我写：父上是什么模样，纵使由我道出，你记得的也不过是我嘴里的模样。中村的老辈见过他，渡口的弥平次也见过，你自去打听，一人问一句，凑起来总比我说的准。兼定回信说，他问了七个人，七个人说的竟各不相同，有一个说父上爱笑，另有一个却说父上素来不笑。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:ask","text"],null]']
src = "blake3:2a39bf65b3fcdd2b73f57dc7f13955ac985646b093481a403be92fe001ae2f25"
text = "复信言明：你自己去问"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:bar","reply"],null]']
src = "blake3:759dc58483de59ee01c3b6b987a1ded30314ccc7125b041803417087f9dea9b9"
text = "我回信单讲沙洲：往东挪，乃因今岁四万十川的水涨得胜过往年，开春还要再挪，叫弥平次换根长些的篙。至于父上的事，我只字未写。兼定随后的来信里也不曾再问，只说弥平次换了长篙，撑得比原先稳当。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:bar","text"],null]']
src = "blake3:fd0b1d547ff5004de5b7e41d06cac9af35e534b9c0d67c459e8fc2502ec52c4e"
text = "复信仅谈沙洲一桩"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:tell","reply"],null]']
src = "blake3:788d0f7a6975345fac289137c5c017d6df3a6c8ee50491ea0c514381747ef4c2"
text = "我写道：父上个头不高，盛夏爱坐在河畔石块上瞧渔户拉网，网里鱼多，他比渔户还要快活；寒冬手冷，便把手揣进我的袖筒暖着。写至此处我停了笔，再往后的事，我记不大清，亦不想编造。兼定只回了一行：“揣袖子，我也记得。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_gosho:n0:tell","text"],null]']
src = "blake3:ca69084842b8a5c8cb4e38787a1390bbcbd27892efa970d4b60727f42d5d908d"
text = "复信写下我所记得的父亲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:bury","reply"],null]']
src = "blake3:7fcd79c961cd2837f15a18544d8dbbc1526eb7a5692bdf185914d47492a8e78a"
text = "我唤兼定随我一并挖坑。他掘得极专心，掌心磨出了泡也一声不吭，坑挖得比鹿身还深。覆土时我教他合掌，他合了，问我如此这般鹿便不疼了么。我说不知。神官后来还是追寻而来，弥平次抢在前头认了罪，称是自己放的箭。返京之后，他被打发回了土佐。动身前，他朝兼定磕了一个头，兼定照他的模样也回磕了一个。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:bury","text"],null]']
src = "blake3:765287a78d873594617fbcc2b6bd8b9d68eb32fa63842432813763c83993eb5e"
text = "留下来，同他一道把鹿埋了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:confess","reply"],null]']
src = "blake3:e6621a4110338aea4ca8e24cf840387dd403753d250c17e13e1cce9ef04952e4"
text = "我拽着兼定来到神官跟前，摁住他的头逼他认账。他倒认了，语气平得很：“是我射的。”神官却不敢接这句话。一条家的当主射了神鹿，风声传出去，奈良那头定要找本家算账。弥平次扑通一声跪倒在地，坚称箭是他射的，殿下年幼看岔了。神官点点头，收下了这番说辞。返京之后，弥平次便被遣回了土佐。兼定送他至门口，一字未言。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:confess","text"],null]']
src = "blake3:9e490e82935690a062a141a7e760e9614c54b5420604436772501e2b97095206"
text = "拉他到神官跟前，令他亲口认下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:hide","reply"],null]']
src = "blake3:0cebfbe9a993b6b543b7815671c99d1ee3ea358694ead2f6b4cebf2d0401860a"
text = "我同弥平次将鹿拖进杉林深处，捧了落叶盖严。兼定立在一旁瞧着，既不搭手，也不走开。次日奈良那边还是得了信，原是有个割草的孩童看见了地上的血迹。弥平次出面顶了下来，说是他射的。房通大人赔出一大笔银钱，本家的家司整整算了三日账。弥平次被遣回土佐那日，兼定正坐在廊下临帖，手里一笔也没停。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n1:hide","text"],null]']
src = "blake3:1ac9678e52072813233753386c2d2309a602a82d8d41b62304fe765e192603a8"
text = "先将鹿拖入林中，休教人瞧见"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:sea","reply"],null]']
src = "blake3:ba9aca76834f9ce285e26039b78d1b00adc5c9a3384d8cd0d38126d8758a19a9"
text = "我写：土佐的老辈人讲，人没了便往海那边去，往南，过了足摺还要更往南，是船去不到的所在。兼定回信追问，船既到不了，人又怎生过去。我说人用不着船。他又问，那姊上往后乘船去时，可还能瞧见他们。我未作答，只在回笺上绘了一幅图：画着足摺岬，岬南是一大片白。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:sea","text"],null]']
src = "blake3:10dadf950f4951ee2d9a02c2d5f5c237a30d50328ef4fba348f047ec48536476"
text = "复他：往海那端去，船到不了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:unknown","reply"],null]']
src = "blake3:3704ec63ab5e5d061ecbe0d94774676f0b681afc0635052745bb051f51db7f0d"
text = "我仅写了“不知道”三个字。写罢觉着太短，又补上一句：知晓的人都未曾回来言明。兼定的复信隔了三日方来，同样只有一行：“姊上竟也有不知晓的事。”待往后重逢，他再没问过这桩事。我总觉着，他怕是另寻旁人问去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:unknown","text"],null]']
src = "blake3:91ef1ebe457da3ab692485bc091d0430f064c56aa6776bd81def395a03cd230a"
text = "复他：我不知道"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:west","reply"],null]']
src = "blake3:141cdbaf6e692abb582a6893cf0e817c3235fe0c70cb7dd141d78f621d235a3e"
text = "我依着母亲教的写：人死后往西方去，阿弥陀佛在那头候着，念过佛的都肯收。写到鹿时，我停住笔想了片刻，落下一句：鹿也收。兼定的回信次日便到了：“得念过佛的才收。可鹿不会念。父上念过没有？”这一句我答不上，便没再回信。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n2:west","text"],null]']
src = "blake3:6ced58f9d6f278e4fafb1258646102ca76c6c35abb611681d00cc3a1983d85c6"
text = "复他：往西去，阿弥陀佛那处"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:let","reply"],null]']
src = "blake3:04e27964ef0ee0ac02156354a8446ddb8985e2abc279593ce10aa81cef45cbb6"
text = "我未动，家臣们亦未动。兼定立在廊上，泪水不住往下掉，他既不擦拭，也不作声，像是拿它全无办法。弥平次跪在庭院里，仰脸望着他，看着看着，自己也跟着哭了。保子大人打帘后走出来，将一方手帕搁在廊柱旁，随即又退了回去。日后兼定同我说，直到那日他才晓得，眼泪原是热的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:let","text"],null]']
src = "blake3:f4857b77f8a2d7546b4041ad496730966f202cbabd4ccf9ba1e95a5f8a17099d"
text = "什么都不作，任他哭去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:shield","reply"],null]']
src = "blake3:fce86bef3424af6386bd034aa29404ed16dd4bcc9207b28028c7ed29a0f5823c"
text = "我迈前一步，将兼定挡在身后，朝弥平次还了一礼，随口问起中村今岁稻子长势如何。弥平次答话慢，絮絮说了一大篇。我背后，兼定的气息一抽一抽的，却未发出半点声响。众家臣低着头听弥平次讲稻子。当夜兼定来寻我，问我他是不是病了。我说不是。他说那便好，一双眼睛却还红着。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:shield","text"],null]']
src = "blake3:58d588a71361850e37d6127aa2dccd15786fe3eb0a3a927245e48eded343ffba"
text = "站到他身前遮掩，勿教家臣瞧见"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:why","reply"],null]']
src = "blake3:8470cb4dd84494d0f7860351252b4dd86ff57101d957eb291aa5be1d557dafb1"
text = "入夜后我去问他缘何落泪。他想了半晌：“他没怪我。”停了一会儿又道：“他原该怪我的。”我说弥平次早就不怪了。兼定却摇头：“不怪，反比怪更沉重。”他把这句话写在习字纸上，写满一整张，字一个赛过一个端正。次日那页纸便寻不见了，我猜是他自己焚了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_kyoto:n3:why","text"],null]']
src = "blake3:b0681ef9e81d4d52c6b0aff5778416e417cb2d570ea417d0a4dd2a01e8a02fcf"
text = "入夜去问他：因何而哭"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:lose","reply"],null]']
src = "blake3:d7ffd86342606d22faf58c1dbe5e27389342a01b96ee956c2cc10388659fad24"
text = "下一局我有意走岔了两步，放他赢。他赢了，还是那一句，平淡得同讲今日落雨无异：“我赢了。”说罢接着捡棋子。我心里倒比输了还憋闷。回局里的路上，汐问我这是怎么了，我说我把一局棋输给了一个不在意胜负的人。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:lose","text"],null]']
src = "blake3:2f722d1d2658143326c53ab0ae88320aea02e805a1c5033580244b06914c82a4"
text = "下一局存心让与他赢"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:stake","reply"],null]']
src = "blake3:2a3e83aaea1055693d07b5992a68c9a442f6b3eb25de768a047a5f578b3e0aae"
text = "我说这局押物事，就押他那把新扇子。他想了想，点头应下。这一局他头一遭看了点数，瞧得极细，走一步都要思量半晌，到头来仍旧输了。他把扇子递过来，手悬在半空，迟迟未松。我说不要了。他将扇子揣回怀中，过了一阵才道：“原来输了是这般滋味。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:stake","text"],null]']
src = "blake3:6abcaa340aa7c5b5e1bbb1cd3b7c76d1df5d6a33719a98a0f1e08f450a8695c0"
text = "拿他的新扇作赌注，再弈一局"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:teach","reply"],null]']
src = "blake3:ff1523c0045fcd400a5c4561893854096e701155700f3fbb49dd3f8257ca1695"
text = "我将棋盘重又摆好，一步一步教他：掷出几点，挪哪一枚最划算，哪一枚又该留着去堵对家的门。他学得极快，学会了便依样去走，一步不差，赢了不笑，输了也不恼。我讲得嘴干舌燥，末了他却问我：“姊上，这个学会了，有什么用？”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_kanesada_sugoroku:n0:teach","text"],null]']
src = "blake3:20dc0a85ebd616772f9777616c438b9dcf3b9a4d9332f32bd9fd517a665f1c07"
text = "教他辨认点数，盘算行棋之道"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:ask","reply"],null]']
src = "blake3:cd9b430a2b9a1af7a8fd2bf047ecb4517fb2ccb8118145522920d885490e3b1e"
text = "母亲一回来，我便捧着念珠上前，说里头缺了一颗。她接过手，数也不数便绕回腕间：“借出去了。”我追问借与何人，她却径直翻开账簿，指着当日那一页道：“趁雨未住，仓中米粮须翻晒一遍，你去唤阿濑来。”整日里她再未提过念珠。入夜后我又摸去门外静听，她拨至那处，依然会顿上一顿。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:ask","text"],null]']
src = "blake3:4ff59cdd7931d4ba5c1be3e07dc72bd0cd470f127f726cdd09b52a46f364a308"
text = "候她归来，问明少掉的那颗去向"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:silent","reply"],null]']
src = "blake3:b611a0fa29841ff7d9969d9671869ab836ccf302762f9cd86ad8693fe514a44e"
text = "我依着旧样将念珠摆回经箱，连同穗子的朝向都一丝不差。阿濑在灶头瞅见了，不问我作何用，单叮嘱句夫人的物件莫乱碰。那失落的一颗究竟去往何处，我终究憋住没问。自此每回见母亲捻珠，我总由不得跟着默数，轮到那一处，她一滞，我也跟着一滞。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:silent","text"],null]']
src = "blake3:b322230133dcc15b5c2b12845a5a3bc356aaf0299109c738318bf5742688c12a"
text = "照旧归位，权当未曾数过"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:voice","reply"],null]']
src = "blake3:9d48ace41d59973938a600fe85a19daf3e9e75ef4b1d39663edf005aaa6cdef3"
text = "第二晚，她拨至一百零七，手刚一停，我便在门外接了句“南无阿弥陀佛”。门内没了声响。过了片刻，她又从头拨起，拨得比方才快了些。早间喝粥时，她多给我舀了半勺，昨夜的事半句没提。打那往后，她每逢在持佛堂念佛，纸门总会留出一道缝。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n0:voice","text"],null]']
src = "blake3:9f8bff66bb2f8c612b945f554abc41c2ce192e506326c7a7a33cd63257d5ceeb"
text = "夜里在门外代她接上那一声"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:away","reply"],null]']
src = "blake3:434e6fbdc1d897bbef0c77135df023f64df01f1fc0afe7191455d89129467741"
text = "我拉了拉母亲的衣袖，说后头的人还在等着。她望了我一眼，仿佛这才想起自己立在何处，向僧人垂了垂首，迈步走开了。走到河堤上，她将札翻过来瞧背面，背面上头什么都没有。“他们说札既给了便作数，”她道，“那是讲给活人听的。”说罢，她将札塞入袖中，此后便再没取出来过。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:away","text"],null]']
src = "blake3:15118206aab10625e1aae5b645c54020780ebd08b5768ebaab86b44a65ea0ca8"
text = "拽母亲离开人群"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:monk","reply"],null]']
src = "blake3:4b6d908423b7171708699f58b402986de433a720fedda3639bbe4fe8de2614cc"
text = "入暮时人已散去，僧人坐在渡船船首吃着干饭。我把母亲的话重问了一回。他待嘴里那口饭嚼完，才开了口：“念不出声来的人，有佛代他念。你娘问的并非这桩。”我问他那又是什么。他背起钲，下了船：“她要问的是，她自己还念不念得下去。”这话我没对母亲提起。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:monk","text"],null]']
src = "blake3:38f56421d66183707f6668590157d7484be8630f6304412911384ab6b1b0e90a"
text = "待众散去，独自去询僧人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:second","reply"],null]']
src = "blake3:a4f543553d28cb68200e337c301b121b10e00902db2aa0a194dff3855fa7e836"
text = "我挤上前去对僧人说，家中尚有一人不便亲至，想代他求上一张。那僧人打量我一眼，又望望母亲，半句不问缘由，径自箱中多抽了一片递与我。母亲将两枚木札并作一叠，拿怀纸裹严实，压进经箱最底下。归途上她始终缄默，直到行上河堤，才开口道那僧人的钲声敲得太急促。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary:n1:second","text"],null]']
src = "blake3:638b6f355e97872cda0c4c8f5877b164836fe4bb26653d29befb405a339cf3a0"
text = "替不在场的人多讨一札"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:ask","reply"],null]']
src = "blake3:d1009cb1187819a3d88f4b31523c66ca0cddab61f2a7ea41de199d09624e6cfc"
text = "我将珠子抠出，放在掌心里端详良久，又按了回去。回信上我单问了一句：砚池里头那颗珠子，是不是念珠上缺了的那一颗。信封妥后，复又拆开，在末尾添了一句：若是，我代她收着；若不是，只当我未曾问过。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:ask","text"],null]']
src = "blake3:c3eb33728aab60e21a497c2075fe5faf8d9641e52b0b0537116c7e010d2f2e7e"
text = "去信问母亲：可就是那一颗"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:keep","reply"],null]']
src = "blake3:c6f53d284cb53911aeb184cd2e72d635cb3e8b4fcee33a4816ff3d3714a47102"
text = "我未去碰那颗珠子，将笔重新搁上笔架，合拢箱盖，仍用母亲原先裹它那张油纸包紧，压在行囊最底下。入夜躺下却睡不着，又爬起身拆开端详了一遭。珠子照旧卡在那角上，塞得紧实，倒转过来也落不下来，仿佛是谁存心按进去的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:keep","text"],null]']
src = "blake3:30f2661a85f9d408b6ad167060c6af8490f5fdcc889eb0fb448b18fd18d1e7dc"
text = "让珠子留砚池里，照原样收妥"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:write","reply"],null]']
src = "blake3:fdd6e5b2a1715aad14ae4ed391d4f4541de34df4d03a23063d2fc1c1315e4575"
text = "我把那支秃笔泡软，研了墨，用它向母亲写回信。笔毫散开了，一笔下去便劈作三股，光“母上”二字就占去半张信纸。我没换笔，一封信足足写了一宿，搁笔时腕子酸得发颤。纸上落下的字粗笨得不像出自我手，汐看了说，倒像个男人的手笔。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n0:write","text"],null]']
src = "blake3:f65c83529960fd979771783d521f06dc0d06624a79c48c5034f6eac012e6f9b8"
text = "拿父亲的秃笔给母亲写回信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:all","reply"],null]']
src = "blake3:b954f4e62d423b74e06b4e6d652939f7c664171e1add3dfc7832b75fbe30976c"
text = "我回信称，砚箱已随行囊一并捆到船上，再拆出来怕要误了潮信。这话有一半是真的：行囊确已打包，船却尚未定下。信托人送走后，我掀开砚箱看了眼那颗珠子，旋即盖严。母亲之后未再写信来讨。开春她来栈桥送我，眼神在行李堆里寻了一周，落定在那只黑漆箱子上，便不再找了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:all","text"],null]']
src = "blake3:2527df8a16af71e16d8a86093d69ee0778ae7c85afe1df518794f91e7a37dd58"
text = "去信说：早已经装船了"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:back","reply"],null]']
src = "blake3:3ebbc518987c8efe2c245b5a1130b037e49a5f0280162ea7738d0d3ef191699b"
text = "我把砚箱照旧包妥，交给回土佐的船只带走，那珠子仍旧卡在砚池角上。信里我写道：砚箱退回，船舱腾出来的地方，用来装米。送船那日，我站在码头直目送船拐过弯去。汐问我为何不把那支笔留下，我说笔头早秃了，留着亦写不出字。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:back","text"],null]']
src = "blake3:b3c1d22df1891f908a7fddbff66602f76c21badb919f6175a7bd21e7d3f96e11"
text = "不动珠子，照原样寄回去"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:brush","reply"],null]']
src = "blake3:7bf7464b1a8b84846eca68ff9fb6e3d642b34314685bd6170ac607b1052eb51d"
text = "我将砚箱寄回去了，单把笔留了下来，拿一张怀纸细细卷好，插在桧扇一旁。信里照实写明：笔由我留着，余下都还给母亲。回音到时已是腊月，纸上仅有一句话：“那支笔，本来就是你的。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_box:n1:brush","text"],null]']
src = "blake3:416c457239865eda8be0d6721bb32ece22ed46daa409fee184169eac92e0d3f0"
text = "寄回砚箱，秃笔自己留着"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:ledger","reply"],null]']
src = "blake3:3568a9e6a9d5b1274d5526eeb09370b0ebd209eeec3800054754c092140b4688"
text = "我逐页校核粮账，将出入参差处以朱笔圈出来，注清原委，寄回中村。那一行字我全当未见。封信之前，又忍不住翻出母亲亲笔的那一页，用指腹沿着那道未曾划去的墨痕轻摸一遍。墨迹早干透了，摸上去平平整整。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:ledger","text"],null]']
src = "blake3:bcd521cf033e0d918b41b435a0d634322621f8e704dac768d77e5fd67bde0f40"
text = "只复粮账事宜，不提那行字"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:nun","reply"],null]']
src = "blake3:393f5c28f00723b70b81dd95dd020667b726091d7ab61eed9c0656b38070a307"
text = "宝镜寺的老尼听我把那一行念罢，先把手里的经卷收卷好了：“这儿是禅寺，不谈往生。”停了片刻才道，“这疑，倒是个好东西。不疑的人，纵然念上一万遍，也不过光凭嘴在念。”她嘱咐我回信切莫去劝，“一劝，她便不肯再同你说了。”我复信时单写了京中的天气和兼定的字，临尾添上一笔：那一行，我读过三遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:nun","text"],null]']
src = "blake3:11b6a9408a8c997dc16c5541f86b9dedf74b1efcc59069b6af848b728fa73c54"
text = "携此一行去向宝镜寺老尼求解"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:who","reply"],null]']
src = "blake3:22e66964fb68f9c205b525b5f5249630918b72f92382839e45af99d2c852de63"
text = "我在回信起首便直截发问：母亲于深夜闻得翻书声，究竟是谁。落笔后凝视那行字许久，终究未曾涂改。越一月后家书复至，粮账依旧夹附其中，页缘批注一笔不漏，唯独那一行的事只字未提。仅于信尾多了句：京里秋寒，夜里莫要读书至三更。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n2:who","text"],null]']
src = "blake3:15e6e0cd94c4d2811aae940cb791c3d0b83da361ea345c841aefbbfd8a3a859a"
text = "复信探问：所闻究竟何人"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:amida","reply"],null]']
src = "blake3:76fde9cadb11450df416869e159409b2c0e7230c97baa6655a2c2fa2f1ca5454"
text = "我从法然上人那一纸遗文里拣了几句抄给她：只管念便是，余事不用多想。写完觉着单抄这些不够，又补了自己的话：海潮不论船归谁家，涨起来一并托着。信寄走了，我才记起这原出自阿濑，并不是佛说的。母亲的回信只道：“这话阿濑也说过。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:amida","text"],null]']
src = "blake3:9e907e034c4adf60348f14b1c160a761707f37b8f1df75d77a92d836383c78a4"
text = "修书代弥陀分辩一言"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:brother","reply"],null]']
src = "blake3:d4d23a2abe21257b929080f2f256eeac422b3f35456e1e3e01a0ef862eaa7474"
text = "兼定读罢，问我火里是什么光景。我答不知。他接着又问，那父上在不在火里。我将信抽回来，说父上不曾受过南蛮的洗，本也用不着。他点一点头，像只问了一声明日落不落雨，转身便临帖去了。到了夜里，我把这桩事写进回信，写毕又划了去，末了单留一句：兼定的字比去年端正。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:brother","text"],null]']
src = "blake3:e6d291e2075f6ef0513cf7e3162c8b9dd19db56afe851b61bd824cda04291187"
text = "将此信递与兼定一阅"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:none","reply"],null]']
src = "blake3:466de91a69b181c4ad9ea0a41b46815ae6974766a6b4860f9c92e16bee486457"
text = "我据实写下：哪个神究竟收谁，我实在答不上来；我唯独算得清京里今月的米价，以及兼定每日临摹几张字帖。写完觉着口吻生硬了些，遂另缀一句：母亲念佛之时，我在京中亦随念一声，权作两个人的。这句写得极小，局促地挤在信纸边角，也不知她瞧见了不曾。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_kyoto:n3:none","text"],null]']
src = "blake3:fa90acdc10ee54fa2ba36029f033494087d3a195c7c6437c3156b93599b590bc"
text = "复信坦陈：此事我答不上来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:air","reply"],null]']
src = "blake3:b7a917ab44a058afd46e4746037246775af1609a64de0a148a519299eb5591a8"
text = "我回信劝她：屋子打扫停当就出来，休要闷在里头干坐。写罢觉着这话也管不着她，又补添一句：非坐不可，喊阿濑陪着。母亲来信回道，阿濑果然来了，嫌屋中气闷，将纸门尽数拉开，河上的风登时灌了进来，把经箱原先占着的那块印子上积的灰，吹了她满脸。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:air","text"],null]']
src = "blake3:272f96c23ba4da727d83035975d78c16f7af5767cd8fb92c3adc01df0fc4965e"
text = "去信劝她莫再独坐其中"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:cough","reply"],null]']
src = "blake3:e06d197adaa74d8af3b90e836ed3d4a8ef367fc6ebc5315e5755a18c48df2099"
text = "那间屋的事，我半句未提，只问她入夏过后还咳不咳、夜间能否入睡。她的回信同样避开我的问话不答，只道中村今岁梅子多，她腌了两坛，一坛留给兼定，另一坛为我留着。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:cough","text"],null]']
src = "blake3:69084d2b47e148399a705d9a9d50b7c781047e5733b218e25028bb57752529a6"
text = "去信单问她咳得怎样"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:fill","reply"],null]']
src = "blake3:2f30bba8d3d9d15371cb17d721c3ff87063603c863f22e359a7f40a35ab4b411"
text = "我回信提议，那间屋子莫教它空着，挂件东西进去，哪怕兼定写坏的习字也好，铺满一面墙。母亲复信说，她照办挂上了，挂的正是那年他寄回土佐的那张“姊上”，里头女字旁大得出奇，悬在钉孔正下方，恰巧遮得严实。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_rw_rosary_room:n0:fill","text"],null]']
src = "blake3:b87006a593dcdc177d8294eec664f0b1c1e586c6169dd55f176746e85602363f"
text = "回信：往那屋里挂件东西"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_failure:event:check","reply"],null]']
src = "blake3:153731b37c1043c738e55dd4c5eca8ea58b801e12dc7c45c85c36f85f29000a5"
text = "我将木札挨个摊列在船板上，铜钱成串码在一侧，打头重新清点。直至数到第三回方才查出，有条船纳的是劣质私铸钱，我竟按足色好钱登了账。我拣出那几枚攥进掌心，暗暗记牢它们边缘磨秃的触感。日后无论哪个船主敢往我手里塞这路钱，指腹一触便知底细。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_failure:event:check","text"],null]']
src = "blake3:581d18c74d095ddec0e592bf7bcefbcf03309c7344e8764e5482c4a600aa00ca"
text = "将木札与钱袋从头核对一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_failure:event:help","reply"],null]']
src = "blake3:cd2b4ba596426f45f00ac13804046b2f7de252c7c4da919d75fe8bed41fe47bb"
text = "阿濑抽来两片空木札，一片记船，一片记钱：“泊进一条船，这头划一道；落袋一串钱，那头划一道。收船时节两边若合不上数，谁也别想回去吃饭。”她在能岛向来如此记账，十几年不曾差错。我依着法子划了整晚，指肚上沾满了黑墨。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_failure:event:help","text"],null]']
src = "blake3:8f67238cb628a4795557c956fc48cd3aeef54bdfc6f8d15bd02a5e3abd0a90b3"
text = "讨教阿濑如何记这双边账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_success:event:check","reply"],null]']
src = "blake3:cdc0e7d8079f058a066c3b5dcfb508f4491ec5986a612ba321268fd22128e3d4"
text = "入夜我将木札摊开摆平，细算今日各船交了多少文、合几帆几文，顺带盘点哪条船杀价最刁、哪条最干脆。算到兴起，我在札背补上一笔：鲣船还价狠，米船干脆，伊予的船得先辨旗。往后再登船，挑干脆的先收。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_success:event:check","text"],null]']
src = "blake3:4b961a14236b8deee0229f30fd1b3d688cfa6847fc42d51e33be330798bb72c0"
text = "入夜把今日账目复算一遍"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_success:event:help","reply"],null]']
src = "blake3:4f9c621543b175e0a9dfd8fd19f2569451518031afac54e81dfbbed3af985542"
text = "阿濑把木札翻来覆去审了许久，指明一桩疏漏：九条船固然全数在列，偏偏谁交的现钱、谁拿米顶账，我浑然未分。“米得折算作钱，折合多少也得落笔，”她说道，“否则等挨到年底，你连自家究竟进项几何都糊涂。”说完她便指点我在木札背面另辟一栏，专门登记折价。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_sail_toll_success:event:help","text"],null]']
src = "blake3:dc2245eda5a85a6f131a679581a43e5fdf341c7040f500c807d093c806364b09"
text = "拿账请阿濑挑挑错漏"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_00:aground:goro","reply"],null]']
src = "blake3:2637ba5e3265e0d493977cba2b58e66f7efc85c7d42f65c555370948113ef819"
text = "船是阿濑候着下一次涨潮撑出河口的。入夜后，我掏出积攒的零钱沽了壶浊酒，拎着去叩老五郎的屋门。他热症才退，披着被褥抿了半壶，拾起一截树枝在泥地上勾勒出沙洲的走势：哪年朝东偏了些，哪年叫大水冲开了缺口，一桩桩仔细道来。其余那半壶他推辞不饮，说要收着，待到我亲手把船开出河口那日，再开封。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_00:aground:goro","text"],null]']
src = "blake3:b7cabc2696b2255b048eff850a570e4a13520243e0da41feaf1b35cb789a079a"
text = "拎一壶酒上门，请老五郎教我认沙洲"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_00:aground:push","reply"],null]']
src = "blake3:2ef84a1c1531281a1ca5e5072ac4b4c1490a393dd1b39e9334ec6feb04e7acac"
text = "我带头纵身跳进水里。潮水虽只漫到腰际，却寒得教人一口气喘不上来。水夫们微微发怔，随即也接连跳下，十余号人用肩膀抵住船舷，齐声喊着号子朝深处推去。使劲推到第三回，船终于挪动了。大伙湿淋淋地爬上船来，阿濑扔了块干布盖到我头上：“往后先把水看清了，再动手扳舵。”这一耽搁，船错后了一阵潮水方才启程，好在桧板连一块水渍都没沾。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_00:aground:push","text"],null]']
src = "blake3:cada3de5ac0dbbc96ef1d737ddd63ff9955eb503756c2fb3ffbaf83228be571a"
text = "跃入水中，同水夫一齐推船"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_01:muddled:night","reply"],null]']
src = "blake3:b7b4f17790c9b331108e7cd13b98d78e9be2efb387a670a85e71d57cc6e6d918"
text = "我掌起油灯，依着船名把木札在席上逐根摊开，熬到子夜，终究摸出了头绪：冬月里那条萨摩船交纳的是米，木札上面刻着米的记号。破晓时分，我将这一条明细抄在纸上，烦请下一艘驶往能岛的船代为捎去。过了三月，能岛那边差人来，将三贯二百文原样交还阿濑手中，末了带过一句话：那位查账的姬君，下回手脚别再这般迟钝。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_01:muddled:night","text"],null]']
src = "blake3:a717690deef53649c2175050866e4b3cfb1dd8899573ba07da507d0cc518d116"
text = "彻夜把账重头理过"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_01:muddled:pier","reply"],null]']
src = "blake3:d6bde1966464f79ee9abb7ce2a2a642959f0e91f6a278b3117e592a056e94021"
text = "我向阿濑担保，亏空由我来填。她压根没搭理我。翌日起我独自蹲守栈桥，来一艘船便收一笔钱。首日让人骂得躲去渔网后头偷偷擦脸；次日学乖了，懂得先唱旗号再唱数目；待到第三日，拢上来的钱竟富余出几文。入夜阿濑点完钱箱，指节磕磕箱盖：“明儿还归你去守。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_01:muddled:pier","text"],null]']
src = "blake3:dac2c4aae3f7f09efd5492439005e11d012907f6e41e99d906b85ae769d1c73d"
text = "到栈桥值守三日，一文一文挣回来"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_02:choke:again","reply"],null]']
src = "blake3:b5df0b443ed9fcd0cf61e14aec39d03611197240f87c351bbb2d962091dccfba"
text = "咳嗽一停，不等阿濑发话，我转身又扎进水里。这遭潜到六寻，水底石头近在手边，胸口却再度发紧，只得浮上来。阿濑盯了我半晌：“明儿再来，不许再数。”次日我收了数数的心思，还真触到了那石头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_02:choke:again","text"],null]']
src = "blake3:0f48bcfa9008caacb85df19edbb0767084af22834242a3b6adb3ce096278e0c1"
text = "喘匀了气，当日接着再下"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_02:choke:incense","reply"],null]']
src = "blake3:ec9f15cd4d959d0c0e1645ca65079a2b9044c2caffb7d06ac602c9b5f90ccd1d"
text = "母亲闻说我在礁石旁呛了水，并不曾责骂，只唤我进屋。屋中燃着一炷香，细烟几乎瞧不见影。她将香炉递到我手里，嘱咐我只管闻，既不许出声，也莫猛吸：“闻香得一缕一缕地听，正同你在水下闭气一样。气息一乱，香味便散了。”我连听了三炷，直等到第三炷才辨出是伽罗。半月后重又入水，七寻深的石头让我摸到了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_02:choke:incense","text"],null]']
src = "blake3:5974ba76cc0c6c32493c7840d9a806661776aade69d0cefef47f8ee704f2ecd8"
text = "去母亲屋里，跟着一炷香学匀气"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_03:swept:kneel","reply"],null]']
src = "blake3:afb2f290dacbb2ef4130cb4db23f86804902d9a1d5bfb10502764a98b0f2c4d5"
text = "我在她屋门前跪足一夜，膝下的沙粒愈跪愈透着寒气。翌晨她推门而出，只抛下一句：“既搭渔家的船，船主怎么吩咐，你便怎么做。”这事传进渔家小子耳里，往后撞见我，总学着我跪地的模样。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_03:swept:kneel","text"],null]']
src = "blake3:90c277df5d052a8a525e30bf653e9bf5b2765276c01ce60784e95e67da965d0f"
text = "去阿濑门外跪上一宿"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_03:swept:slack","reply"],null]']
src = "blake3:52f893775639763665bae7b9f749ada21e41bd96812898c07a0e1f1a116d6d62"
text = "次日我没急着下水，只坐在岸边盯紧那块黑石头。石脚下的白沫一阵少似一阵，直等沫子停歇、浮木打起旋儿，我方才推船。平潮统共不过一顿饭光景，我划拢跟前，伸手往黑石头上拍了一记便掉头往回划，刚划回来，潮水才重又流动起来。阿濑数落我偷懒，我回道，她只说了不许被冲下去，可没交代几时下水。她哼了一声，自去找渔家了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_03:swept:slack","text"],null]']
src = "blake3:b089a98cc20b7d252505ed6e97a785b0eb503a333dbd667b22bf616246525307"
text = "明日静候潮平那一瞬再试"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_04:undersold:ledger","reply"],null]']
src = "blake3:3e441a719a3f777fd8f7d669cbfe7cd4dfaf077916a801ae850767fa965d62ff"
text = "伽罗照他报的价出了手。那晚，母亲将中村的粮账摊开在我跟前：“家计论的不是一遭卖了什么，是整年里每一笔如何进、如何出。”她拨念珠的手极缓，差上一文便重头算起。窗外蝉噪搅得人发昏，点算到第二册，纸边在我的手指上割出一道口子。母亲递过一方素绢，让我裹上接着数。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_04:undersold:ledger","text"],null]']
src = "blake3:ad91576a3941edc84c6a2f2e8fe61ff8b455285c2a961a011bef560cf360ed1d"
text = "服软低头，回家随母亲学算账"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_04:undersold:pawn","reply"],null]']
src = "blake3:9ba50140960f1379a89489d1a63e6459b9a4322359948165e1677bf668e1431d"
text = "我言明绝不出让，唯作典押：以一年为期，明秋凑齐银钱赎回。他推说繁琐，我便点破，丰后大友家的伽罗寄放他手头一年，便是取出去示人也足显体面。他张口索要五成息钱，被我一分一厘磨减至三成。桐木匣落了他的封印，随他登了船。母亲在屏风后开口：“明岁入秋，由你亲去赎归。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_04:undersold:pawn","text"],null]']
src = "blake3:33f02a862c85f7b7b1cd9b63dd92c89fca17b458b1d78200cb465d491d62d350"
text = "不肯卖断，权且押他一年"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_05:drafts:danshi","reply"],null]']
src = "blake3:d66d223a3455fefcd0ba6031687d34298fd5e32526f6be1aa6c593e9fc80d63a"
text = "檀纸价昂，我把积攒的钱全数掏出，方换回两张。舍不得直接落笔，先拿旧纸将那首歌写了二十遍，每遍改动一字。直到第二十一遍，才誊上檀纸。母亲隔着灯火细瞧半晌，点头说这张寄得。船开时，墨迹尚未干透。余下那张，我收进了文箱最底下。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_05:drafts:danshi","text"],null]']
src = "blake3:6c994b6c55dbd2769e554eaf2996aeb88a56c34b9a0759eee41dc734b11a2a0d"
text = "上纸铺买两张檀纸重写"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_05:drafts:send_as_is","reply"],null]']
src = "blake3:33eb0ec2eb0041f9027e244fcd85ae9054c51eaa2f067195b75151c5edb27679"
text = "我把第七张上那半首续完，未再改动便装进信里。广桥夫人的回信来得极快，说字写得不错，歌还生嫩，却嫩得颇有意思——宫里正少个不怕写错的人。母亲读罢把信递还给我：“有点意思，这就够了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_setback_05:drafts:send_as_is","text"],null]']
src = "blake3:bdfda8c9068556dc2131085ee14935ae23751e5dd48aa61bdb418acda1a1d1a1"
text = "把写了一半的那首寄走"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n0:wait","reply"],null]']
src = "blake3:fed3fd7198d3b62e36f9b2c0bedcfce1fa95d8b31c96c7688e03aee556f09c3f"
text = "我没有再去追问阿濑，径直寻了母亲。母亲托人从中村街市请来位懂医道的老僧，在阿濑右肩头灸了三壮艾。阿濑把我和汐全撵到门外，不准偷看。艾草的烟气从门缝里透出来，我坐在廊上，硬是忍住没去趴门张望。等她推门出来，面色惨白，嘴上仍是那句：“姬君早该去睡了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n0:wait","text"],null]']
src = "blake3:02eeb99b6911945832d033fbc45de06a8fa310c34c5a55da93ba4e37d50365e6"
text = "请母亲延请医僧"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n0:work","reply"],null]']
src = "blake3:44fab00fe2f7979756cbc1f80b8053c4539eb0f048419e1d451c15b4fa85f720"
text = "次日清晨，我向灶房讨了一块老姜，拉着汐在石臼里捣成蓉，拌进米糠后用粗布裹紧，埋在灶灰里烘透。晚上阿濑补网，我绕到她背后，把热布包贴上她右肩。她嘴里骂着我多管闲事，身子却没往旁躲。等这一包凉透，立刻再换热的一包。熬到半夜，网梭来回走得畅快了许多。她这才嘀咕一声：“姜放得太重，熏眼睛。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:expert","reply"],null]']
src = "blake3:ffd24a2b057e3ce186ac3ea2c4cdee293f2b49fdf2c4782829e58c29a4a501c2"
text = "我将母亲信中所写病状逐条理出：阴雨加剧，天晴减轻；臂膀举不过肩，肩头既不红肿也不发热。这分明是陈伤受了寒，何必远去堺。我拟了一张方子：取陈艾叶煎汤，拿热布绞干敷肩，早晚各一回；不必下水的日子，把木桨悬在屋梁上，搭着手缓缓绕圈。末尾又嘱咐一句：切莫让她知晓是我所开，只推说是京里的医家。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:expert","text"],null]']
src = "blake3:f4d2bbbe27f2081844198ba7a1e2ea6f63ca2fdcedd9ce4b56ea87b43c77b961"
text = "按信中病症拟方"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:wait","reply"],null]']
src = "blake3:0aa6b43ee8674172f8e7ff93097ed09239fc5d728e1be84322c4850dc659902f"
text = "去还是不去堺，那百疋诊金花还是不花，我思量了一整宿，终究回信请母亲裁断：她日日在阿濑身畔，看得见那只肩膀的模样，我隔得太远看不着。信末我只多添一句，叮嘱阿濑开春切勿再下冷水。汐看过信，说她娘不会听劝的。我说，那便写上两遍。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:wait","text"],null]']
src = "blake3:4360a922297984e2442c1ab6d2244f245177f4597cd1844d4de9101c3eb045bb"
text = "请母亲决断是否去堺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:work","reply"],null]']
src = "blake3:084d1989c1d02544ba07505a9e2f4688d0033eefb75ba0ba4c6e6e0656ecfeca"
text = "我带着汐跑遍了下京三间药铺，又去请教本家常延请的医家。众人皆说须先问清症候：几时疼得厉害、手臂能抬多高、夜里能否安寝。第三家的老掌柜抓出一撮桂枝、一撮独活摊在纸上让我嗅，说寒湿入骨的旧伤少不得这两味药。我将所有问询一一抄录，连同各处药价一并寄回下田，好让母亲照单去问阿濑。我落笔抄写时，汐在桌旁压低声音，替她阿娘抢答了好几条。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n1:work","text"],null]']
src = "blake3:272ef972d64addfc1c44452a13912794fe896454b3c8dfbc521f934b5d312a0b"
text = "到下京药铺询症问价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n2:wait","reply"],null]']
src = "blake3:d4005bcbd8d11b7c7233a3e3e11821fd72769033a65303d963b550a2ae49a723"
text = "那挂钱我终究没舍得动，托付本家的杂掌去下京药铺，赊了一帖制好的膏药，挂在本家账上，捎回下田去。言继大人闻知此事，拿笔管轻敲着砚台道：“也好，也好。”转头就在日记里落下了一行字，我没瞧见写的是什么。汐把膏药仔细包妥，在油纸外描了条游鱼，说她娘认得这个记号。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n2:wait","text"],null]']
src = "blake3:193912773bf5dee9966f76c40f9bff71d93a022d3c7d2790be1f7b3629794d79"
text = "托杂掌买帖现成膏药"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n2:work","reply"],null]']
src = "blake3:16bdce204892df8512c42381bbce27e4a10dee0a706dff7a0a2f36afc845b1a2"
text = "我将那串铜钱整挂解下，搁在几案上。言继大人清点一遍，发觉还余出几文，顺手推了回来。他捣药时吩咐我在旁看着：乳香先烘软，没药磨得愈细愈佳，拌入麻油慢熬，直熬到滴在纸面上不化开方算火候到了。我看他做一步，便在怀纸上记一步。膏药盛进蛤壳封严实，搭从堺来的顺风船捎回下田。至于伽罗，明年再买罢。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n2:work","text"],null]']
src = "blake3:318b0c834cbbea90153a6153aa9fad7e6da974356051d76aca41eeb33f40fa05"
text = "把买伽罗的钱拿去抓药"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n3:wait","reply"],null]']
src = "blake3:4e20acdd66f25ed9631b043da8dd45623900492cf68448d7d9191bec72b4056b"
text = "这回的信我留给汐自己写。她磨蹭了整半下午，团掉三张信纸，终了只余下两行：“娘切勿逞强。姬君每日在盆中闭气，我替你数着呢。”我本想添上一句，她却一把抽走毛笔，说这是她家里的信。我没有争执，次日早起照常埋脸入盆，她在旁替我报数，数得比平日慢了许多。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n3:wait","text"],null]']
src = "blake3:b45cad6ae166682412c4fb73e084823d463f0e6c60101ef6dc95f4092677d167"
text = "交由汐亲自给娘回信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n3:work","reply"],null]']
src = "blake3:02aa6b41ce0fa58e20709f0795971d541c3b11049ffd3e65e7897129c25df10a"
text = "我修书一封，给阿濑立下规矩：下水前，先将炒烫的粗盐装入布袋，烘暖右肩，再抡起胳膊绕满三十圈；上岸后须即刻披上棉衣，在灶台边坐足一炷香功夫，严禁直接去补网。我将这些步骤画作小人儿，一动一图，生怕她嫌字密懒得读。汐在每幅小人旁皆添了一尾鱼。次日清晨，我在水盆里数到了八十。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n3:work","text"],null]']
src = "blake3:e638f01b18cd217257515a9f5162ecb63e1d040ec273fea49f2bd1b8e19d8acf"
text = "画份下水前暖肩图"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n4:wait","reply"],null]']
src = "blake3:6b72bce49b3a7fa9fb56fbd4e4bb5f64ded331ac8e6b67640dd2ce4264e1f715"
text = "我并未亲学，只恳请言继大人按方抓齐足用一年的膏药，装满了一只小箱。他边封箱边絮叨，膏药用完总有尽时，方子却能受用长久，前前后后劝过三回。我说船上的事，届时再图计较。写信与阿濑时，我只淡淡一句药已备齐。她此后未再回书。汐说，阿娘不回信，便是心下不快。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n4:wait","text"],null]']
src = "blake3:2f343c0ea8146d7a5475d7b2dd83fd8013f13ea1ad6b43a50d4bb5e3bca95a7e"
text = "请言继大人配足一年药"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n4:work","reply"],null]']
src = "blake3:65cfeacb11ddcab6bb6e7c97f2bf61907849a9e454245da72923e62266e22d65"
text = "我抱上一刀白纸去了山科家。言继大人听说我是为水夫求学配药，欢喜得多斟了一杯酒，从治冻疮裂口的油膏讲到治腰疾的艾灸，整半下午未歇一口气。我逐条记下，全用假名抄成一卷小册，封皮题着“船上药方”。他拿去翻看两眼，笑说假名写得这般端正，船上人只怕手脏不敢翻，又亲自在书末续补了三页。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_ase_illness:n4:work","text"],null]']
src = "blake3:ef17d78f5c3e318c4b385a462128df05f3101abd474a1b730b987a132a004c3b"
text = "往言继大人府上学配药"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n0:wait","reply"],null]']
src = "blake3:b0d10497ff63846b95c22dc9d6123a53202d0a905593155b38e7b11b0c8b25d3"
text = "这船留与不留，我作不得主，便去政所求见源康政大人。他听罢，言明船可以先搁着不拆，可钱是一文也拨不出来的。我回到船台，把话原样转与老船匠。他冷哼一声，随手将铁钳摔回草席上：“搁着便搁着，木头又不会自己跑了。”那天下午，他再没动手拔过一根钉。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n0:wait","text"],null]']
src = "blake3:d54a97d7b4b3e782a420fd01d5ba82a7303d930f31539e0d7b42c3539fddccae"
text = "请政所决断拆还是留"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n0:work","reply"],null]']
src = "blake3:1520951ae6d3df15f4ebc7916e088806bb923b2d600802a9aad12973b96576af"
text = "我与老船匠各守席子一头，把钉子逐根举起来对着日头端详。带裂的搁左边，打弯的放中间，还堪用的归右边，我在木札上记数：裂了四十一根，弯了七十三根。他按着裂钉的旧位，拿炭条在船底画圈，每画一个圈，就讲出一块板子的名目。待到日头偏西，船底的板子我已能叫出一半来了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n0:work","text"],null]']
src = "blake3:b0f6868c88f26f59b42479dd0466e4325785c9f648bcb2ff57eec7fb0c0da234"
text = "把裂钉逐根挑出记数"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:expert","reply"],null]']
src = "blake3:3649c0d43884dc6c88d6f09dd1c42fd9f5070e8376c95ce61357d8ea324db9ea"
text = "我对着那道黑线端详许久：裂口沿木纹延伸，抵住钉眼便止住了，并未波及船底居中的航板。分明是钉眼周遭的木头晒干缩水、硬生生扯裂的，整片板身尚算完好。我回信随附了一幅图样：只截换钉眼左右各一尺的板料，新钉挪开旧眼半寸再打。待信发出去，方才察觉掌心竟攥出了一手汗。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:expert","text"],null]']
src = "blake3:96dbc970f786eb6b8c76aac31258ad1bd026cd6d187e5b666378fd55d197b44c"
text = "察看裂纹走势，单换一截"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:wait","reply"],null]']
src = "blake3:d98efbb032aaac671b39518278893ff36cb2e8651829926258bfb761151deab9"
text = "那船我不过在草席边蹲着瞅过一上午，他却摸了一整辈子。我写信回去说，换还是补，仍请老船匠定夺，用钱的事烦母亲去同政所商量。信寄出去，倒像是把那道裂缝又推回了他手里，夜里躺下，眼前悬着的还是那根歪歪扭扭的黑线。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:wait","text"],null]']
src = "blake3:1e8baa8cb27405045f89bc547f8ab710735199289639172fa9958c93c52b6da8"
text = "交与船匠自行决断"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:work","reply"],null]']
src = "blake3:b235aa915a0162967f9a4751c49eb200d9e132ed9445fef1117cc29dd8370258"
text = "我趁替局里取物的工夫，抽空跑到堀川的木行，捧着那张纸向老掌柜讨教。他看罢说，裂成这般模样，整块抽换最安稳，随即将桧木板一丈作价多少、杉木又是多少，挨样报给我听。我把价目连同板料尺寸抄作一张清单，算清换一块须几钱、换三块须几钱，夹着原画一并寄返下田。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n1:work","text"],null]']
src = "blake3:9266131cdb9ad70c30ca698ef15d80113aad7fb2325116364550ecface4d3303"
text = "去堀川打听板料价钱"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n2:wait","reply"],null]']
src = "blake3:bdd1edf5640eecbabeed2e90647bbf80d52979e41b51351f81d7560b5c198410"
text = "我写信回去，说钱请政所另寻法子凑一凑，若实在周转不开，便改用廉价些的杉木。日后母亲捎信来，说政所果真定了杉木，老船匠嘴上没道好也没道歹，只在剖板时多推了一遍刨子。那几串钱被我重新纳回经箱里，指尖压着沉甸甸的，胸口反倒轻快不起来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n2:wait","text"],null]']
src = "blake3:68412cb53c438c52480cea4999dd9c150639d0827bb35b498ecbbc808b8674fb"
text = "交由政所改用杉木"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n2:work","reply"],null]']
src = "blake3:13d89bd94aa7b3bbafed0ddc728d777e55ccce149af1d16617f26210ec7daf91"
text = "我写信答复山主：桧木得要山阴面长的，木理细密，吃水不发胀；锯板的工钱归我出，木料放河则顺搭政所运米的筏子，不另计费。他回信仅肯让一成。我再修书一封，说堺的客商只要整根原木，剖剩的边角他卖不出去，我连边角一并收了。第二封回信送到，他松口让了两成。我把攒好的钱解下来，托人捎了回去。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n2:work","text"],null]']
src = "blake3:ba08b043cde573d2e7ac1fa2af5839e00a9ec81ddca20ba94d1ef68e69678a19"
text = "拿当值的钱同山主议价"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n3:wait","reply"],null]']
src = "blake3:88a27acdb3b8bacaed0f657cadf938eaf0bd53f5098d3fc3a5c24e6d48c6fc03"
text = "我写信回去说不用等我，护住木料要紧，先下水吧；那根钉，请老船匠代我打下。信发走一个多月，母亲来信告知，小早已经下了河口，吃水正稳，滴水不漏。我在局里把那几行字看了足足三遍，心口却偏生空出一块，怎么也填不实。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n3:wait","text"],null]']
src = "blake3:2502560c37790ff5c69859ad4db6516755b5ff8c2fa0badccaf600556a5851d4"
text = "请他们先下水，莫等我"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n3:work","reply"],null]']
src = "blake3:b8124746f3945b5c1570087bdff42d1451dbe5db54dcd83195b53bb534308f79"
text = "我写回信将下水诸事桩桩排妥：九月初我抵达下田，吉日托中村的阴阳师来择定；船台须先泼水润过一遍，省得木头干裂；另备滚木二十根、绳索两捆、水夫十八名、酒一桶。我又对照着那张图样，问明船首那根钉究竟该斜敲还是直敲。信尾落下一句：木料倘若走了形，待我归来同他一块儿刨。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_boat_nails:n3:work","text"],null]']
src = "blake3:009fbd7eaba64d24b62e57238cd7c38fc909e592d37c5b9d56d1170b961012ed"
text = "回信约定九月下水"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n0:wait","reply"],null]']
src = "blake3:82f677d9cf75018b793b0fccbcb0a1b085d90476e9eba640007af41353ff10c8"
text = "我说自己使不来针线，这箱衣裳还是拿去换米实在。母亲也不勉强，次日便唤了堺商来验货，整箱旧衣折算了十二袋米。趁那商人起身要走，我从箱底抽出那截绣着唐草的袖口，悄悄收进了自己的文箱。阿濑瞧在眼里，却半句也没说。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n0:wait","text"],null]']
src = "blake3:7869de680f61e23a760c11390cfb72bfd2e420c63269fb62cf1361ff41dddff6"
text = "留给母亲去换米"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n0:work","reply"],null]']
src = "blake3:4ba3b02abd8415eefc8f28d2e617c5c6490642fab5072b6aafb9f467a2643396"
text = "整整拆了三天线，指尖被针扎得满是红点。母亲坐在一旁指点：红梅衬萌黄原是早春的穿法，过了三月若还这般穿，京里人是要笑话的。袖口那圈唐草我顺着旧针脚去补，针眼歪了一处，便拆掉重补。改完后衣长短了一截，母亲拿来比量一番，说恰好合我的身量。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n0:work","text"],null]']
src = "blake3:423df3b3831a15e595dfb8810e9f56c99716bc15b82f06325d48eff11789f3bb"
text = "拆了旧衣，自己学着改一件"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:expert","reply"],null]']
src = "blake3:ab1e38060183fbe179dc405f3071cbbd339725af45c6a21864cd99aa0feeb13c"
text = "我将三箱拆散的衣片悉数摊在席子上，依着针眼的疏密逐片比对：针脚细密的是宫中老手缝制，稀疏的则是日后补缀上去的。统共算下来，那片萌黄表层原该搭浅葱色的衬里，先前的配法足足差了一季。老女房弯腰端详了好阵子，拿扇骨在那叠浅葱上轻叩两下：“往后拆线前，都先来问过你。”菖在一边把针敛回盒中，一声未吭。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:expert","text"],null]']
src = "blake3:1fc0ec281929313abe551fc974358e3d298b2a4f23d73d977938dc8b300a8d9f"
text = "顺着针眼重配衣片"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:wait","reply"],null]']
src = "blake3:dad0aae94dd578b7845e7e2c2a56e7c51b93da020a252b6f37b9571d2ba634eb"
text = "我包好衬里送回本家，托了保子大人跟前的侍女代劳。保子大人隔着帘幕应下，语声轻柔：“这点小事，不必急。”衣片直到十日后才送还局里，针脚固然匀净，老女房却一望便知并非出自我手。她未曾斥责，只顺手将我的名字从下回的派活单上勾去了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:wait","text"],null]']
src = "blake3:51491957016daf97224c599ea516968f2c0c48491ab375e6fbd78b6fe96d9cfa"
text = "求保子大人的侍女代缝"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:work","reply"],null]']
src = "blake3:0970e684a8333e2128a9d4153de222305c575d97b0de553888b78c8103a52426"
text = "我跪在廊下连缝了五日衬里，每罢一片，便按老女房立的规矩叠齐、领口朝北码放，候她过目。第三日她提起来一片迎着光一照，嫌针脚勒得太紧，令我拆掉重来。我依言拆了。到第五日她再没叫拆，只撂下一句话：“土佐的针，拉得倒也还算直。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n1:work","text"],null]']
src = "blake3:d63d28a435aea456c401e971afad2100eb9c417d079567d2cd9088ed08f7a587"
text = "依吩咐把衬里缝好"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n2:wait","reply"],null]']
src = "blake3:54a0407f9faf3791b294d91d39a998aa5a6ee97604109700e7f28cc907f64570"
text = "我转到屏风后头寻到菖，循着礼数跪下开口。她听罢，只答了句：“好，我记着。”那几夜我连跑了三回土仓，才将唐衣如愿赎出。只是随后的半个月里，菖每碰见我一次，便要挑出一处衣襟没抚平。我半句也不曾回嘴。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n2:wait","text"],null]']
src = "blake3:7da54788111ef95d62535291e8766bcbc9cabaa38a850e81006ea586ef629502"
text = "央请菖替我守这几夜"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n2:work","reply"],null]']
src = "blake3:adad6d0f22d1b153b4b79d3857b9d8cfb8792fa133d84eeefb778bf79beb2043"
text = "我取出积攒的钱交给小督，托她去同掌柜周旋。唐衣的赎期宽限下来，我便把领子带进值夜的屋里，每誊完一段日记，就凑着油灯缝补几针。典侍深更进来巡看，瞥见手边的针线，脚步微顿，却只字未问，反吩咐我把灯芯剪短些。还没到宽限的期限，唐衣便已赎回，领口那圈金线一根也未曾乱。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n2:work","text"],null]']
src = "blake3:8db9dc875c7e14c1d53b051113d3ddb922e3bcc863b12df48ea56015c7456f84"
text = "自掏利钱，守夜时补领"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n3:wait","reply"],null]']
src = "blake3:762b6676c6b5f4d8105c6b2249038b41fcd86ecc2e2e009cfead3ec5f790e724"
text = "我说道往后这本账该归菖管，她是要长留宫里的，我不留。老女房静静看了我半晌，把账簿转给了菖。菖接过去，先理平整了袖口，才掀开第一页。至于腊月那空着的两行，后来是谁去勾销的，我也没去打听。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n3:wait","text"],null]']
src = "blake3:a75c6e49b9fdd90b875b344e5f4a24d1e6250bf9423d299bdb6d80aaaa046d30"
text = "把衣账转交菖去理"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n3:work","reply"],null]']
src = "blake3:c3485a37dd62e83f0e1fc68b654f810144db3bbfb8e8cb84aad22db40eefe525"
text = "我把衣账从头至尾誊录了一遍，每件旧衣的色泽、纹样以及缝补过几处，皆写得明明白白。想到那件浅葱色的袿赎回后要赶着正月穿，我先度好它磨烂的袖口尺码，拿碎绸把唐草纹样试绣了两回，这才裁下新绸预备着。老女房查验过新誊的账册，在末页添了个记号：“腊月那两笔，留着等你来勾。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_court_sisters:n3:work","text"],null]']
src = "blake3:4d0ca97acd5b41f10c52d7b0d4d78568eebb779255225b369617b1d90af189be"
text = "把衣账逐行誊清"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n0:wait","reply"],null]']
src = "blake3:947aedae3e0eaf382d0ce3beccb970112957f388d8cc58f6351c6fefa600eba2"
text = "我到底没去足摺。过几日阿濑去了趟清水，回来却说熊野船早已开拔，船夫们先前说话本就吞吞吐吐，兴许只是哄吓小儿的虚言。我仍紧追着打听那道黑水的去处，她只丢下一句：“流到你够不着的地方去。”我默默将这话抄上怀纸，便不再多问。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n0:wait","text"],null]']
src = "blake3:ae1c31ead159e21face5d94528bea5fc0ac89c09b1a2cbed2c41394249817634"
text = "依阿濑的话，请她代问"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n0:work","reply"],null]']
src = "blake3:0d9399a7b856b84f16cac651f38738842e2972e04c3fe6dccdf8a91f5651efaf"
text = "我偏没依阿濑，次日清晨便坐了老船头的小船绕去足摺。崖顶风狂，人根本站不稳，我干脆伏在岩石上拿炭条往纸上画：岬角朝南探出，黑水打西南方斜斜撞来，绕过崖脚又折往东北。老船头立在身侧报一处，我便落一笔。回了下田，阿濑足足数落我半宿，逼着我交出画纸焚了。那纸被我藏进怀里，终究没拿出来。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n0:work","text"],null]']
src = "blake3:0a14a030b23abc9077428b34d46d3e8ee4edc4bed8372591af597b971a5a4363"
text = "登足摺岬，画下那股黑水"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:expert","reply"],null]']
src = "blake3:055750b119f50457ce527e98575873ad9c35c54ca2b86e9a48556a81b3487cdd"
text = "我借来比丘尼的画图，蹲在寺门前照样重描了一遍。土佐的船头提过，那智湾口原朝东南敞着，图上偏画成了正南；黑濑川自西南向东北掠过那智外海，船一出湾，便会被水势推着往东偏去。我把改好的岸线与那道海流指给比丘尼瞧，她抚着头巾琢磨半晌，道是山上的画师一辈子没出过海。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:expert","text"],null]']
src = "blake3:ab7a6988114b8e02b6330d08e7815abc24265785bc91eef1c95574a0ce1b6d85"
text = "照着潮势重改图上岸线"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:wait","reply"],null]']
src = "blake3:c0dbe17a6229a3cf5c94fa14c8578421cfdf43c802e50d586101ce16f20752f7"
text = "汐把我的手抓得极紧，我便随她回去了。回本家的路上她一直沉默，直到踏上长廊才开口：“跑海的人最忌直勾勾瞧那种船。”我再未提起那张图。只是夜里合眼躺下，眼前晃着的依旧是那四道门。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:wait","text"],null]']
src = "blake3:ce3304e9e4f53000053b55b6f2928c0f3e95f998a8ca7b517b968743adc6e0d3"
text = "同汐回去，不再盯那船看"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:work","reply"],null]']
src = "blake3:00b453d38bd3739f9b82616fbb21af2c7859740cce901b2315609c044ef94d76"
text = "我拿不出香钱，只得蹲在旁侧听比丘尼讲了三回，每一回描一处：先画瀑布与浜边，次画小船和四道门，末了再录下她口述的地名。汐候得烦闷，坐在台阶上数起过往的牛车。暮色四合前我收了笔，册页里那艘船的船首，正对着纸边之外。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n1:work","text"],null]']
src = "blake3:de0939625ad5b10e66866406d58febe7d1d22c1cc21d8444b1ae9dd260454123"
text = "将图临摹到自己册子里"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n2:wait","reply"],null]']
src = "blake3:3a2076ef2ff7cfdfb0c4e6e25d61f1c64f5aa6bd3a1ccc525e468ba505eab2cb"
text = "那份初穗我没供，回去便写了封信，托开往堺的船捎给足摺金刚福寺的老僧，问寺里可存着渡海的记载。信得先抵堺，再从南海路绕过去，少说也得一个多月。如今秋风都起了，回信却还没到。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n2:wait","text"],null]']
src = "blake3:c4167eb95370df508625221d9655380255f12ef0ca71d1de03995ffa8fb49cec"
text = "去信向金刚福寺打听"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n2:work","reply"],null]']
src = "blake3:92bccf8aba56c05f6959bfbefa6cebf6b52a5c157cc5b6aaaeebb6b7583232a4"
text = "我把钱搁到佛龛前头。老先达翻开书册逐行诵读：享禄四年的祐信，平日穿高木屐，人称足驮上人；天文十年的正庆；天文十四年的日誉。我听一句抄一句，每录一人便点一个小点在那智湾口。三颗点挨在一处，朝外便全是空白纸面。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n2:work","text"],null]']
src = "blake3:de760c9886fa248b5b68f4ccbf38a47eb3ecaa3e946e0e696262e50f4e406df7"
text = "奉上初穗，录下渡海人名"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n3:wait","reply"],null]']
src = "blake3:b18eed6a0bbe5a3c9a1c277c05ba962c6e8beb642a2cdd818749a90291026de9"
text = "我把未竟的图卷拢，拿纸捻系牢，压进衣箱最底下，又在纸捻上用假名写了上句，下句留待站上崖头再续。京里的纸画不出海来。汐凑手帮着按严箱盖，嘴里嘀咕了一句：“莫要等到忘了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n3:wait","text"],null]']
src = "blake3:eda1feea830101e7ba79c9743f7cde8d83931e3fb998af0afe7bcb3fee319e6c"
text = "收卷起画图，回土佐再续"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n3:work","reply"],null]']
src = "blake3:9f8f239d715fc2ba9bb944906c80c1a5fc4a0cd103d7ba4a56588b80263b4493"
text = "我将沿途诸港逐一勾勒扎实，港名侧旁皆注上潮时，足摺岬的崖壁尤画得工细。至于岬南那处，我半笔不落，独在纸隅用假名题了一行小字：待我去过。汐瞧罢，伸指在那片空纸上轻轻按了按，说道：“到时便由我掌舵。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_fudaraku:n3:work","text"],null]']
src = "blake3:2366c1fc8d7931f7d445bd7c8e9f7d28b6af64b9478f597594ec02b654cf1f40"
text = "只画到足摺为止，南边留白"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n0:wait","reply"],null]']
src = "blake3:18e28729704a2694ab14516315de8be93d7ba536cb8ac779e8c59ef3772d1102"
text = "我说母亲写的字胜过我，还是由母亲执笔。母亲并未推却，缓缓写了封长长的回信，末了空出一行，让我添上一句。我琢磨了半晌，提笔只写下“字歪了”三个字。写罢便后悔了，可堺船已经离岸了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n0:wait","text"],null]']
src = "blake3:c12ce36b31bac9272d4d3c46ec361b51104c7b5b5b4fc19c6d9077778a00ab97"
text = "还是请母亲写回信"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n0:work","reply"],null]']
src = "blake3:84ab21588cc560790764054cb8744761496be96772c018e16b47cb5a467824ff"
text = "我研了一下午的墨，写成一册手本：前半篇写伊吕波，后半篇抄他写过的那几首歌，字字立得笔直，旁侧用朱笔各画一道竖线，叫他照着线落笔。末页我也写了“姊上”，特意把女字旁收得极小。手本封好交予堺船，走上月余，才送得到京里。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n0:work","text"],null]']
src = "blake3:1c0dcc4f2e33ca7784af0c2f22a6685203399fabe7e68f99f92721b7d3121ef6"
text = "抄一册手本寄往京里"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:expert","reply"],null]']
src = "blake3:42254e8238cb4bebe443b6f6154f7dfbec1d4eedca3bb0a17886b64b53685e91"
text = "我将那页纸举到窗前细看。字是工整楷书，横画收笔总带个小钩，认得出是康政大人的手笔，政所的奉书我原见过无数回。想必是母亲装订本子时，错把他交来的粮账底稿混了进去。我把那页拆了出来，夹进写给母亲的回信中，没向兼定提起这字出自谁手。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:expert","text"],null]']
src = "blake3:f5402d2a69add6a71502b8044f2e6365971eacb4bbdaf902e91703158cedc288"
text = "认出那页字是谁写的"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:wait","reply"],null]']
src = "blake3:e3ba54019405896a207ec14073a351210b00ec4e1c2f5b2da0e8b45fb0bf4a33"
text = "我将那错页抽出，写了封信托船带回土佐，烦母亲重新补抄一页。船行往返总得两三个月，兼定只得越过那几首春歌接下去临。他嘴硬说不打紧，可每回翻到缺页的地方，手指总要顿上一顿。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:wait","text"],null]']
src = "blake3:811f1af562cad536f3fdc9ed5081e35d0c080a0c377e413e6c0b2939041f2bd8"
text = "去信请母亲重寄一页"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:work","reply"],null]']
src = "blake3:a62620f941657c83507b01f166319d94459ccaa5b4aade2b39c191e7019d4493"
text = "原本缺掉的那页正该是春歌。我凭着记忆将那几首一一默出，假名笔势相连，写罢反复数了三遍，果真一字未漏。兼定接过手，口里仍打趣“姊上的字带着股土佐味”，次日却照着临了整整一页，便是那处我写错后又重描的字，他竟也依样描了一回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n1:work","text"],null]']
src = "blake3:ed431a0cafc1e4b8c69aa2c0db47a6c20a9a3cf15a1cc6fd6473bf8647d835a9"
text = "把缺掉的那页春歌补写上"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n2:wait","reply"],null]']
src = "blake3:5b0423776f31aca1bcfe8817946de707896721afab3e50c389d4784b63a51fb0"
text = "我只得去恳求保子大人。她听罢缘由，抬起扇子遮住半面沉吟片刻，回说本家下月恰有人去土佐，纸张亦可以从库房匀些出来，“唯独这一份情面，日后可要记在心里。”兼定虽抄得草率了些，终究赶在使者启程前封缄妥当。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n2:wait","text"],null]']
src = "blake3:3c387210b2aa79f7203d413f46a54eca750d6e11c77252f93721a380127fa8d3"
text = "求保子大人捎回土佐"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n2:work","reply"],null]']
src = "blake3:8b190ea63a22f71472d7aef91ecd193af528422b150a9f124a215fad5a0bd5ff"
text = "我动用自己的体己钱去三条的纸铺，买回一叠杉原纸。兼定每晚落笔，我便在侧旁盯看，写偏了就打发他重抄。他急得摔过一次笔，可到底还是捡起来续写。不过半个月功夫写齐了三十张，我寻麻线替他订牢，封皮题上他的名字，交给了去土佐的船。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n2:work","text"],null]']
src = "blake3:4beef247cb57502d85a8467dacf5421e3e7a9734f02bac3499e40a3dd4721794"
text = "买来杉原纸，陪他重写"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n3:wait","reply"],null]']
src = "blake3:d1f14ee529bb1261d8e7294d9a28f218d3fde4113d94cd714d0ad449f1e69812"
text = "我说行文的规矩，等返了中村自有康政大人指授，总比我教得地道。兼定面色一沉，将信笺折妥揣进怀中。行至门边他又回转身：“那称谓的事，姊上也一并撒手？”我说哪能不管，怎么称呼都行。他再不作声，迈步出去时，步子落得比来时重了许多。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n3:wait","text"],null]']
src = "blake3:e5f893ab25eeba82cb9e9d13ad671a990e3a64f219cfc9662feccda7fd4511dc"
text = "规矩交由康政大人去教"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n3:work","reply"],null]']
src = "blake3:7e3498545f221d1249cd64b0768dc9daed803a5fbd16d9212eb670496d87d41a"
text = "我展开康政大人的来函，指与他瞧：宛名该落在何处，自家的名姓要低几分，待诸大夫当择哪一等敬词，对家老又该降上一等。他照着一封接一封试笔，直写到第五封，末尾的署名方才立稳，不再朝右倾了。我道，我仍旧唤你兼定。他轻哼了一声，顺手把这句话也抄在了草稿边角。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n3:work","text"],null]']
src = "blake3:3adf784c4f4b3d620b1d12303d37ced2b242f9bea5eecb734ff963f7861d0964"
text = "指点他写寄往政所的书札"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n4:wait","reply"],null]']
src = "blake3:3870c73292185251b1a066649c222064129a40075967bbc098f8ad1666d71371"
text = "我说道出海这事还早得很，眼下先将你自己的字架摆正了。他紧抿双唇起身，夹起习字本转身离去。次日他照旧来临帖，彼此皆绝口不提昨夜言语。至于那一页“姊上”，日后他究竟撕掉没有，我也无从知晓了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n4:wait","text"],null]']
src = "blake3:f4b768a44389f35be06217e7a679f4ca2e0e57e113fa4578116ad8052b42690b"
text = "道出海一事尚早"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n4:work","reply"],null]']
src = "blake3:8c5b823d171fe3ac6239ebb2bb716126b6d6a40f17b7777c296abb3235e2a4ad"
text = "我借着他拎来的灯光，在那页“姊上”底下写下：每至一港，一封信，记潮时。写罢把笔递过去，他紧挨着添了句：每封必复，字不许斜。两行墨迹挤作一处，他落笔比我还重。随后他替这页纸折了个角，说往后谁也不准撕。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_kanesada_letters:n4:work","text"],null]']
src = "blake3:e474462c8bb75ecaaf44a726cef783bf844e33af30f679a1c2334e870ba4f136"
text = "把约定记上他的习字本"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n0:wait","reply"],null]']
src = "blake3:d844195f0d30a586b5be51304c7f5c1e82cc8ea3bc1624426c9d20111f1d76c7"
text = "我未曾伸手接笔，只陪母亲跪在廊下，瞧她一珠接一珠地拨弄念珠。双膝发麻也纹丝不动，春雨敲打着仓檐，待她数满五遍，天色已然擦黑。末了，母亲在账脚添上一行小字：“鼠耗四袋。”看仓老仆顿时暗吁了口气。那四袋米绝非耗子偷食，我心中一清二楚；既然母亲合起了账册，我便不再多嘴。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n0:wait","text"],null]']
src = "blake3:63405c4a40bf89cc2184458993e8a4659190dad3b8498522841e8bd9cba291d1"
text = "由母亲慢慢去数"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n0:work","reply"],null]']
src = "blake3:7739c2fba2a0ed88eda9042407e46cbcc64a454bb38f2819be66fa9a4817aea9"
text = "我把账纸竖着剖开，左栏录稻米由哪个庄园入库，右栏记稻米装上哪条船，每袋米在两头皆留笔墨。直誊到暮色四合，左侧比右侧多出了四袋——正月装船那日，书记将那四袋划归“出”，实则根本未曾上船，至今仍压在仓角草席底下。母亲把两栏并列端详半晌，指尖拨回一颗念珠：“日后中村送来的账目，一概先交给你过目。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n0:work","text"],null]']
src = "blake3:9006e1475d51d7a1b42b88200ac5fb40403810dcd10c9d36e039c11da8a706c8"
text = "将进出分作两栏重誊"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:expert","reply"],null]']
src = "blake3:560c309688579b8df06a943fb5b0612392f8b3621faebc93a5ceb3a85cb7e438"
text = "我忽然记起下田米仓尚有另本账簿，去岁春间我曾在仓前朗声核过。单子上名列第三与第五的两户，去秋新米是直接担往河口仓交纳的，入在了下田名下，中村这头却漏了销账。两处一冲抵，七户实欠之数还不到清单半数。我将该记入下田那页的袋数逐一列明，注清年月与仓名。母亲捎来的回信仅有一句：“康政大人过目后，未再提催租之事。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:expert","text"],null]']
src = "blake3:aa5b8e6cc0925902eae54a42fff53f1509ea94f7626c559357a56211343ca976"
text = "取下田仓账逐户核对"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:wait","reply"],null]']
src = "blake3:a1253ccbb5591480fc6c7d9f642b5ec5a941942817e532176fe904051d84aabd"
text = "我濡墨写了三大张纸，算罢这笔又拨那笔，末了全一张张撕碎。田地如今荒成何样，庄户家中尚余几口，我身在京中一概不知。最终只回了一句：“田亩之事，母亲看得比我通透。”听说后来母亲将七户欠租尽数延至秋后，政所的人口头虽未异议，那笔欠账却在册面上硬生生悬了一整年。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:wait","text"],null]']
src = "blake3:27a7a728720e51721da6b4e69c83aecd1a1da9eb870b6951860e4600c5b543e5"
text = "回信称全凭母亲定夺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:work","reply"],null]']
src = "blake3:5484122a30941827f5a324f294ce522c53ec2df0d280b32adc2ad5f984b6418b"
text = "我顺着清单把七户水田一块块拆算：水浸半月的减租一半，浸泡数日的削去三成，未遭淹没的照例缴纳。每户免去几多，便在政所那一栏划一笔“免”，如是账尾双边总数才能平齐。算毕绘就一张清单，托往来堺的商船捎回。兼定在桌畔盯了一整夜，问减掉的米粮从何处填补。我一时被问住，半晌才道：明年再作计较。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n1:work","text"],null]']
src = "blake3:8332dd69f7ff952bd4a7bf4596ab691d3466e4f13d2e79918432f8ed6842de94"
text = "照受淹田亩核算减免"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n2:wait","reply"],null]']
src = "blake3:46bf69d43d4bab3ac6bbe0eef7808cf50f1f0c5c991e3415d45e732c362d7109"
text = "我把亏空核准，写成一封书信寄往中村，信上只列数目，不提筹措之法。苦候回信的那月间，我照旧入局当值，面容上丝毫不显窘迫。四月底新米运抵，竟比短缺之数多出两袋。同船捎来的还有母亲的一只空螺钿盒——原先盛在里头的出嫁珊瑚簪，已由她折卖给了堺的商贾。信中道，空盒留给你另装他物。衬在盒底的旧绢折得齐整端方，一如她往日叠衣裳的模样。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n2:wait","text"],null]']
src = "blake3:5ab13dda6ed375ac869bb9be0fd9360c1162e3c930001cd66b3a12a28a542f2f"
text = "修书请母亲筹措法子"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n2:work","reply"],null]']
src = "blake3:1e0c16b79bc80d78d34879fdd2adfd09e4a5baa0128b14ca17c2ecb06922aee7"
text = "我把这两载攒下的私房钱全倒在榻上，反复清点两遍，抽出一部分交予家司，先买米撑过三个月。随即将本家账册重誊：哪笔系中村拨来，哪笔系我自垫，条分缕析，代垫那一列另起一页，标明“待还”。家司捧着账簿端详良久，感叹宫里当值的女房里通晓算账的实属少见。汐站在门外轻声咕哝：“姬君，下回买团子的钱可没着落了。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n2:work","text"],null]']
src = "blake3:ba7f816c9188fac1ad732b7dd5ed0807203e05d55740a41f2f50c02fec9b068a"
text = "动用私蓄补齐缺口"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n3:wait","reply"],null]']
src = "blake3:c20201c6cec68132a3cf20d2927bbaa6c936959aad64583f1a6d1dbec2da3307"
text = "我未曾重誊，径直将那沓纸片扎捆妥当，原封不动寄返中村。心里直发痒，几番想拆绳重理，硬生生按捺住了——宫中今月当值排得密不透风，我曾应承典侍绝不出一丝纰漏。母亲的回音倒来得迅疾：“收到一捆乱纸，倒也能辨识。”至于康政大人有何言语，信中只字未提。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n3:wait","text"],null]']
src = "blake3:543bb5a093d6155f8d8a397d089c9f8a6756ad93d85f009184dad2eb12e527cd"
text = "把零散纸片原封寄中村"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n3:work","reply"],null]']
src = "blake3:3a576e700ae1c8cbe6122f50027cbb0baf21ec3c4d80a90ebe7ef450a6820d3c"
text = "我把杂乱纸片按月序理顺，逐页誊入新簿：每袋稻米，中村发出一笔，京都入库一笔，支用后再销一笔，三笔对得严丝合缝，方作完结。这般足足誊写半月，入夜赴局当值，白日归家抄账，腕子酸疼得连茶碗都端不稳。抄罢一核，三年间总计亏空一袋半，乃是前年一条小船在淀川倾覆所致。我在那一列旁侧注清时日与船夫姓名，一并寄发回乡。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n3:work","text"],null]']
src = "blake3:8bb43a98d212f589c722c305074c9b87124a6b9cfa4d29cfd7b490d76a52b14f"
text = "将三年京账重头誊清"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n4:wait","reply"],null]']
src = "blake3:c1b4983f8e442d6b28e34769774181cf7f8b922c0e44c48a20966a629aef46ae"
text = "我回书称，京中之账母亲手头俱全，全由母亲拿主意便是。书信发出后，我方才猛省竟忘却写上一句询问她身子可好。往后家计交割与否、移交当天又说了些什么，身在京都的我浑然不晓；唯独那封家书上晕开的浅浅水印，被我用指腹摩挲过好几回。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n4:wait","text"],null]']
src = "blake3:0a40d3298336b11342a3a5a6fb54cd0441c05421df3711a4aeb02fb1f31589b5"
text = "复信请母亲自行裁断"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n4:work","reply"],null]']
src = "blake3:49a69468fe2bfd470b5386da454e338b994209f8b5c2fdf64981941d130b3d9e"
text = "我将三年京账重又誊写一遍，这趟挑了宫中抄录日记的上好纸张，假名运笔一撇一捺毫不苟且，进、出、存三栏对齐得清清爽爽。落笔至末页，本意想在余白处添和歌一首，提笔又搁回砚台——最后这一页原该空给母亲。账册以紫线订妥，交由下行的船捎了回去。汐说我伏案理账时，比吟诗作歌更沉静。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_mother_accounts:n4:work","text"],null]']
src = "blake3:6eab5588fdc44d0c13f040336946a4f2f1abd0afdd9bbfa685ac6f3b04c99d66"
text = "用工整假名另誊一份"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n0:wait","reply"],null]']
src = "blake3:ab893a17c35ee951d9e52678307a9b4f72cd499aaea046c30892038f6fad4f97"
text = "阿濑上了一趟政所，回来只带回一句话：“货主认了死理。年底前，渡守寻不回货就得赔。”我想去政所提那圈湿印子，阿濑伸手按住我肩头：“姬君去说，政所也只拿它当孩童的玩笑话。”我抿紧嘴唇，在河岸上一直坐到天黑。渡守撑着空船往返摆了三趟，竟一声不吭。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n0:wait","text"],null]']
src = "blake3:99795fdcb1534951cef91d595fbc2d1780e87719ab94a848f5e372f3b0b87e42"
text = "托阿濑去替渡守说情"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n0:work","reply"],null]']
src = "blake3:c445b5ccbc0c629539966a151c712bb7cbae091ad827d6d11af61c4b0d8849b1"
text = "我屈指算了算，丢货那晚正是十七夜。挨到下月十七，我拽着汐守在渡口，一直等到了渡守所说摆船的时辰。潮水涨满之后，河面歇住不动，片刻又往海里退去。我丢进水里半截芦苇，眼看它先朝上流漂了一程，才缓缓调头，贴着对岸盐仓那一侧流走。汐困得直打哈欠：“楮皮还能长腿游走不成？”我说楮皮不能，船却能。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n0:work","text"],null]']
src = "blake3:548c528c387cce34c905c0eaba689edd988811679564cdd4081f48ec44394643"
text = "待下个十七夜来看潮"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:expert","reply"],null]']
src = "blake3:b9f0083922dc8ede37c4d5fbac1ca70922ef718bfd56301515bc8f5818ba3260"
text = "簿子上记明那晚正是十七夜。我按着下田的潮汐一算：戌时末满潮，亥时开始退潮。那十一条船里，唯有清水来的盐船是乘平潮进河并停过渡口栈桥的；退潮才起，它便要顺流贴着对岸赶返盐仓，离桥时天色正暗。我将潮时与船名细细写明寄回。入冬前母亲来信告知：盐仓里果真翻出了三捆楮皮，绳结仍是渡口的系法。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:expert","text"],null]']
src = "blake3:df1bc9f6715532bb1a7c3cde4eecb4fe3a3e67768f885ffd5b47552b008a90c4"
text = "依那晚的潮水推算船只"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:wait","reply"],null]']
src = "blake3:771df9a5fe54b54d85818581d517ec822ae18a67ea889232d76270e12a9b2387"
text = "十一条船的船名我看罢一遍，又把纸折好。隔着淀川，又隔着漫长的南海路，我眼里瞧得见墨字，却瞧不见那一夜的河水。我写回信请母亲将抄件转交加久见的老船头，他识得这带每一条船。信发出去后，我日日去打听打堺上来的人可有家书，问到后来，连门房杂役见我都直摇头。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:wait","text"],null]']
src = "blake3:7b3562853dd55446ad9f594953bfbe4255eee00af7e35bcca56b8ebf0a9f829b"
text = "请母亲托付老船头去查"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:work","reply"],null]']
src = "blake3:a82339192d0d69b54e20e8535d0cc55c66d2b9cd2dc4c0bc911bfe2c7f31eacb"
text = "那十一条船的去留，我挨个儿仔细查对：哪条入河逢涨潮，哪条出海赶退潮，哪条曾在渡口停靠。连看了三夜，圈定两条船：一条清水的盐船，一条中村的柴船，皆在那个时辰停过渡口栈桥。究竟是哪一条，单凭簿子却断不出。我只得把两船的名字写信寄回，信抵中村时，十月已然过半。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n1:work","text"],null]']
src = "blake3:9f3e1cc0e87f297978a38f23249a9e088d6b55388d516cc3b8b804429c618dba"
text = "逐条核对泊船的记录"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n2:wait","reply"],null]']
src = "blake3:cf2ddb9619e5416d90a0508680b521baf8ba4c53a91b57a3cb4c2b3fa5a7ac75"
text = "我本想亲去四条，转念想起局中的规矩，见习女房不得私自上街同商贾理论。于是我将事情的来龙去脉写成一封长信寄往中村，恳请母亲请政所出面周旋。候信那几日，我在局里研墨，研着研着便想起渡守那声亮堂的吼叫，手底下一圈又一圈地转，竟片刻没歇。后来母亲回书说，货主肯退还半数钱财，只是渡船依旧押在米商手中。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n2:wait","text"],null]']
src = "blake3:4faf4738a5eb01a445ef9d182552ef846c203778e7d7b98cdd462832a286722e"
text = "请母亲出面与货主理论"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n2:work","reply"],null]']
src = "blake3:2cd922e9e7ee6fe2d83a59b70346955eb6f8c4aee4a5c470cadeb8413d5bef6c"
text = "我先掏出积攒的体己钱，托往堺去的船捎给渡守，让他把渡船赎出来。随后带着汐径直寻到四条那家纸铺。货主起初赖账，推说楮皮在盐仓里闷久了早已发霉。我便将那一晚的潮候逐句说与他听：何时平潮，何时转退，盐船又是沿着哪道水路下去的。话才说到半截，他脸上的神色就变了。这趟先讨回半数，余下的，他答应年底结清。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n2:work","text"],null]']
src = "blake3:d48bbe23a5c6e15820d423547e7f4459be4e425fe4e3c33a6354dd6700490a0b"
text = "先代为垫钱，再赴四条追讨"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n3:wait","reply"],null]']
src = "blake3:80d14627ea643d6ade484dacc74d72a7207ec72696cd2198ab9e420050fca750"
text = "我将此事托付给母亲，月底便要启程回京，行囊尚且未收拾妥当。动身那日清晨，母亲转告我政所许诺待秋收后再做定夺。船驶出河口时，老渡守仍在岸上埋头补网，未曾抬眼。新渡守的渡船还在河心打着旋儿，我扶住船舷回望了许久，在怀纸上随手记下一首和歌的意绪：河上少了那一嗓子，竟连退潮都显得迟缓了。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n3:wait","text"],null]']
src = "blake3:016a8118f24e20dd06beacacfb1e7d388e0df44c4a6188a5b2b7c5f736861af8"
text = "请母亲去政所替他说情"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n3:work","reply"],null]']
src = "blake3:625759024ffb678f0cc29bc5dc0f196a4e65b3e88c18c823e4d5dddfd2000d12"
text = "我特意去政所请来康政大人到渡口一观。当日潮水在午后改向，老渡守与新渡守各驾一船，一齐从这岸起篙。我立在老渡守船头盯紧水面，吩咐他且慢，直等到水上的草叶彻底停稳，方才落篙。船笔直地划过河面，新渡守那船却被退潮生生带偏出半町去。康政大人当场便将渡口判还给他。老渡守在河心纵声一吼，两岸的行人全都回过头来张望。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_river_claim:n3:work","text"],null]']
src = "blake3:8e9eba91da3c607ba9d9586bb019a3460ef6c41e397e0032c02e0a9756f36475"
text = "同他摆一趟渡给政所瞧"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n0:wait","reply"],null]']
src = "blake3:b329c544859ae4367ce0731f87a0540442ec01b1bfb4e568aa43db7b924d623c"
text = "我顶着雨跑回家，请母亲差了个人过来。那人站在铺子里，听两边各执一词吵了足足半个时辰，末了拍板叫他们各退一步，折中算十俵半。铁匠嘴里咕哝着应了下来，烧炭的也点头认了，只是谁也不肯看谁一眼。我立在门边，自始至终没插半句嘴。归途上雨歇了，我心里却还在一遍遍默数：那根柱子上，究竟有几道。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n0:wait","text"],null]']
src = "blake3:2afdd08a4a4e7d83bc1680da6ac68174bdff173e94d7fa0effd03fdbd9bbe8f1"
text = "请母亲派人过来调解"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n0:work","reply"],null]']
src = "blake3:935119d36c107fff9f27dabf23d800eb4948026f0c9070c4d584f90236955cf6"
text = "我跟铁匠借来凿子，劈开一根樫木刨平，再从正中一剖为二。往后只要将两块拼齐，每背来一俵炭就照着合缝刻一刀，两面自然都留着印子。一半留在铺子里挂着，另一半交给烧炭的带回山去。木契刻成时，我手心早磨破了皮，接着又帮铁匠拉了一下午风箱，总算把炉火重又扇旺。那烧炭的捧着自己那半块端详了半晌：“这法子好，谁也赖不掉。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n0:work","text"],null]']
src = "blake3:dabfb5a7c1ab94105f0160240594e95c10d0924e463c8630dba79f61e38194bd"
text = "替他削副能合缝的木契"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:expert","reply"],null]']
src = "blake3:34152bb784a1410636d6d1ce4e25969fade927886807234ff2e954cf0bf042de"
text = "我找本家的木匠要来一块桧木，将镰刃和桨环削成一般厚薄，再并排放到一处比量：两件恰好能从同一根铁条上切下来，一炉火烧透了便能一并打成。木样上该从何处落锤，我也用刀痕标了个清楚——铁匠虽不识字，刀口却认得明明白白。木样随船带回，入秋后母亲来信告知，镰刀赶在收割前全数完工，炭还富余出两俵，船具大可慢慢再打。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:expert","text"],null]']
src = "blake3:bab096e519283362459d605c79787c892c2e0e6d8258db3503fa1304024ce62e"
text = "刻出能一炉打齐的木样"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:wait","reply"],null]']
src = "blake3:79ca106ddb8c629a20234d90110765d2c4d029b41d9a7f3d6cd23f750757e6bb"
text = "我对着木片上的图样端详再三，末了回信说，中村那边的事务母亲看得最清，镰刀与船具先打哪样，便由母亲定。母亲拍板先打镰刀。小早因缺了新锚爪替换，在下田的船台上白白歇了一整个冬天。我总惦记着那只形似螃蟹的锚爪，连夜里做梦都梦见它坠进了水里。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:wait","text"],null]']
src = "blake3:f0419652acc141b9360a23884b30cdb08efc39049c15dc361ad6c71aa2c53944"
text = "交给母亲替铁匠定夺"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:work","reply"],null]']
src = "blake3:d318112e1fb68232c9d3c344e90828f35a99dba7b3f104ab929a36c4e4bfa726"
text = "我在回信里交代先打镰刀，庄户等不得；至于船具的大小，由我来定。本家院子里放着一段旧樫木，我足足锯了一整个下午才锯断，胳膊抖得连凿子都握不稳，只得歇到次日再接着雕：桨环与锚爪各刻一只，全依小早的尺寸做成实大模样。兼定在旁帮我按着木头，使的劲头倒比我还足。木样捎回去后，铁匠托母亲传回来一句话：“刻出来的，可比画的强。”"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n1:work","text"],null]']
src = "blake3:e19f95589ecdecb15717f9abc0e7a297408a38da58564313c17df6671d95772a"
text = "照着原寸削出船具木样"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n2:wait","reply"],null]']
src = "blake3:d6c726c4ce9c71bb5e389e274c925de19ef765f301a8d533ebcb1f425dd92cb8"
text = "我没有阻拦他。兼定铺展纸笺，研了半晌的墨，一笔一画斟酌着写那道奉书，写到“炭”字时偏了笔势，便涂掉重新落墨。我立在案旁看着，好几次险些忍不住伸手接笔，到底还是忍住了。奉书随船送回中村，政所竟将御所冬天要烧的炭分出一半调拨给了铁匠。那年隆冬母亲来信提起，说御所的火盆比往常凉了不少。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n2:wait","text"],null]']
src = "blake3:b1aeabe3af02ec41a2765d2ac278fd806c29ccd5f32268692578403c0baca461"
text = "让兼定颁一道奉书"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n2:work","reply"],null]']
src = "blake3:f113020acb16cdfdaf95eb79611a51340c2afc605716848441d2c5d75950260d"
text = "我取出攒下的钱，立下一纸保单，请母亲转交别处山里的炭窑：下田铁匠这一年的炭，先记在一条澪的名下。接着我又去堀川的木行选了块樫木，足足刨了三日，做成风箱里鼓风的木板，四周特意留出贴毛皮的凹槽——松根火势难稳，送风正要匀实才行。活计做完，我两条手臂肿粗了一圈，汐用湿布替我敷了一整宿。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n2:work","text"],null]']
src = "blake3:76c937314a21a2c7191a16b798d28fc41cd9d91a088753c4b7b8835edca61447"
text = "出钱担保，再削风箱板"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n3:wait","reply"],null]']
src = "blake3:d3c83ec93b01c90c9c8aee3965d203b20b39764b96f5bd3d38280724ea643827"
text = "我写信回复，船具既归政所所有，理该由政所管船的人去查验，我在京城说成与不成都不算数。那只桨环留在了我手边，整个夏天都拿它压着歌稿。至于往后船具究竟交齐没有、交货时铁匠又说了些什么，信里一概未写。我只清清楚楚记得环上那只歪嘴的鸟，嘴是朝左边歪着的。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n3:wait","text"],null]']
src = "blake3:bcd90ba8e95ad678fbd59c0b9fc96a4e5ea24225fb358efc7d2bfcbcf28c639e"
text = "交由政所管船的人查验"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n3:work","reply"],null]']
src = "blake3:c74c62fc8a14f8a7a7c51661dfd372779c4ade192f43f0a1812c9c77c23e141c"
text = "我依着小早船桨的模样，削出一段恰好能卡进桨环的桨柄。抱去院子里，双手死死攥紧，一脚蹬住石灯笼，使尽浑身力气猛拧——桨柄被拧得吱吱直响，那铁环却纹丝不动。汐站在廊下看着，说姬君这般死拧，桨柄倒要先断了。我写回信只落了一个字：“成。”末了还在纸尾添画了一只歪嘴鸟。"

[entries.'["upbringing/families/mio_events.toml",["choices","c9_mio_side_tosa_forge:n3:work","text"],null]']
src = "blake3:bcb2013353e2313f6bb401c6bcbc4638e146a5a2d9a6c685b5a00045fb85ef36"
text = "削根桨柄来试这个环"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_2:event:honest:2","text"],null]']
src = "blake3:5d5b436b45859bf1d42358c5171acad8f5286eccac4c7a39cd828c997b887c8c"
text = "姬君。宫中正月礼节繁多，我料得着。不成便罢，拖一月不算赖账。两首我记在心里，届时若欠一首，我便乘船上京讨去。夜寒，让汐煮碗姜汤与你暖暖。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_2:event:share:2","text"],null]']
src = "blake3:c15bb4b616a17ca88e0d7775930bf6ab8f75bdfaf2c61ed06a1cd85b2483a34a"
text = "姬君。歌已收到。我连念两回，念到第二回时码头上下全围拢过来听。鸭川水是淡的，可别上那儿去学凫水。下月的歌照旧要。外头那船画差了，船头翘那般高，是要翻的。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_3:event:honest:2","text"],null]']
src = "blake3:64847e4351f257c173efc295e0a0993cdf026f7e444e95a6823feffb4a8090a7"
text = "姬君。信阅过了，我拿网梭敲过一回桌。数到十，行；数到十仍要砍，也行，这归船头拿主意。绳若解开，再来同我论砍或不砍。宫禁不比河口，莫将刀带进里头。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_3:event:share:2","text"],null]']
src = "blake3:6dd316eb08830b97c892d3cc84d7d61ba5341bb432e3c5ed8564e6c7471468d1"
text = "姬君。绳子捎回来了，七道结系得俱无差错，唯第五道略松，出海一着水便要散。结名猜错两处，能岛不作那般叫法，等你回来我细教。下趟寄你段浸过水的，湿缆才真难拆。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_4:event:honest:2","text"],null]']
src = "blake3:d434aa394ad6831c97d69bdfa83010aac57bafdad1e8363bba1d3be1cc275c3d"
text = "姬君。致能岛那信我递上去了。族中几位老者端详半晌，道一条家的姬君倒是认账。认账固然好，往后举荐之前多察看两遭，方是顶好的事。账我已填平，莫急。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_4:event:share:2","text"],null]']
src = "blake3:4c0da5290412d1e96727f7ea9b818442cdd1cdfe610289f5ac4267ad4949e709"
text = "姬君。款子已收到，还盈出四十文。余下的四十文替汐扯双草鞋罢，京中费鞋。冬衣之事原是那盐船老大长舌，往后他传的话只信一半便是。下遭再荐人，先教他把银钱码在案上。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_5:event:honest:2","text"],null]']
src = "blake3:9d3517c6438db620f90f55082378ae4d2418d5b046bf6f5de63eb447494a7ca6"
text = "姬君。既要捎回便捎回，梁上木钉原封未动。归来那日恰逢大潮，嘱船老大打沙洲北侧入河口，莫走捷径。宫人丢草鞋之事，姬君休要跟着动气。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_5:event:share:2","text"],null]']
src = "blake3:9cc72ce901a4ad90379faad42a5e4f43559e87cc3a3fc4c9809b3cfb167d9a75"
text = "姬君。歌接到了，折成小船模样，一时没敢拆，唯恐拆散了复原不了。端详三日方拆开朗读。读罢便塞上棚梁，恰在旧日搁葫芦之处。老鼠想来不咬纸吧。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_6:event:honest:2","text"],null]']
src = "blake3:ed6a34a824244fb267f3b1c10acc301a1840e3d224bbf2ce6d5fd0952338215b"
text = "姬君。半桩就半桩吧。听过之后由你决断，乃船头本分；你若断差了我斥责，乃乳母本分。两桩既撇清，我便不上京了。发绳照旧替你打，那股红线，我拿旧旗边拆下来编。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ase_6:event:share:2","text"],null]']
src = "blake3:a36ee74bdbbe3a0d96cb030253791b9568d5107379b005da771e4f264c4e526b"
text = "姬君。你寄来的海图，我摇橹沿着河口对了一整日。差了两处：乌贼礁标浅了一尺，北首那块落潮露头比你记的早些。余者全对。发绳已动手编着，特地放长三寸，你发长势快。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_hirohashi_yasuko_0:event:honest:2","text"],null]']
src = "blake3:1b1935e0714a05a29681a3aaf8d8434eb89f679aee96f583909dc701f88d3f3e"
text = "来信已悉。事先说破办不成的事，总胜过随口答应复又落空，像我这样的人，极怵后者。料子先来，干鲣不急，兼定那处我自会宽慰他。只是您的敬语……下回作书，先另起一页草稿给自己瞧一瞧。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_hirohashi_yasuko_0:event:share:2","text"],null]']
src = "blake3:a33d230d80fc8559b2377d52e563bb6917e70435904841dd5b44f42fbf8f50a4"
text = "包裹业已收到，油纸封得如此密实，料是防着海水沾湿。兼定解开干鲣，竟当着众仆的面啃了一口，恰教房通公撞见，却也未加责怪。我代他致谢。土佐海域相距这般遥远，寄送一趟物件须劳烦多少人力，我心内记着。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_hirohashi_yasuko_1:event:honest:2","text"],null]']
src = "blake3:a353f03b0ddd6b474cbdd833391f88ff7783062df859d0ed58fb84bf6ae92783"
text = "您既肯实言相告，我也便照实回话：这许多礼，本家同样凑不齐。宫里的人原都知情，谁也不点破罢了。送不起的那几宗，抵成一封字迹清隽的书信，有时反倒比一把扇子更顶用。您的字是写得好的，我瞧得出来。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_hirohashi_yasuko_1:event:share:2","text"],null]']
src = "blake3:b32aaf09d60f486ea833a83916cabe208b6ed3764c05e572d6c54b7d372308f0"
text = "礼单阅过了，您算账比我身边的人还细。以土佐纸顶替京纸，主意甚妥；宫里头写字费纸，合用之物才让人念着好。香就不必置办了，我手边尚有些旧存。您欠着的那一份，我也记下了，不急。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_0:event:honest:2","text"],null]']
src = "blake3:5810648eadc14af8a70313899e185c995497186cccab5205669fa513fc0392dc"
text = "姊上家书已收悉。力有未逮便罢，我不责怪。唯这差事我且虚位以待，不容旁人顶了去。房通大人曾言，当主派下之务，手下人办不成须得直言，姊上回得比诸位家司更为坦直。待你摸全了潮汛，再过来领。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_0:event:share:2","text"],null]']
src = "blake3:31fed90237b606ccd8a698da928929ad892fe1f29339a6bb09d62e3e9827eed5"
text = "两块木札上的潮信，我命人抄录成卷，呈予房通大人过目。大人问起何人所记，我回是一条家的船奉行。他笑起来，我板着脸没笑。姊上，来月照旧写来，字不妨再写小些，我认得全。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_1:event:honest:2","text"],null]']
src = "blake3:84bb2e50de5c970418247222adc5b59540923df11da36e86d3e0a94267a3c81f"
text = "姊上说不懂，那便是不懂罢。我又跑了一趟扇铺，照你教的闷声不言语，铺主反倒自己先开了口，报出的价钱比前次还低。侍从站在旁侧，脸都涨红了。扇子我到底没买，钱都留着，等姊上进京，我请你吃粽子。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_1:event:share:2","text"],null]']
src = "blake3:bdc8872b9b3deef906460b345fa9b1cebf91e2fd56eb518999d98c6c11ad1569"
text = "姊上的法子真管用。我把三家铺子的价码全摸透了，才折回第一家去谈，铺主直接让了两成，外带白送一只扇袋。回府后侍从竟跟家司邀功，说是他帮我压下的价，我没当面拆穿他，心里全记着账呢。姊上，你手里那串鲣节末了卖给谁家了？"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_2:event:honest:2","text"],null]']
src = "blake3:d5cf374f02658bb529402b7e6873d6bf032868fa2dd6739154ca4d234959d157"
text = "那首歌我托三条西家的人题上了扇面。花开那日，我独自在廊下展扇来看。房通大人打跟前走过，问是谁作的，我说是位不肯落笔的人。他听了没多追问。短册我已收进文箱——姊上的字，其实也没那么瞧不上眼。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_2:event:share:2","text"],null]']
src = "blake3:6cafd8bd6fbef9e111b4bf38f6236278b97b690981a55a91a87328200ada3365"
text = "房通大人借了我的扇子端详许久，问这歌出自谁手。我回说是姊上作的。他把扇子递还给我，嘱咐好生收着，莫拿去与人换物。这扇子我日日带在身边。姊上下次再写，海倒是能捎带提几句，只别写鱼便行。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_3:event:honest:2","text"],null]']
src = "blake3:004b4f9b72303769a2ce9d9262e2ae38598247f2dc762a87917178c824dd4018"
text = "阿濑回信咬死不让出船，措辞冲得很，竟说当主的旗泡进水里照样打湿。我为此生了两天闷气。过后听家司提起，那月土佐外海果真翻沉了两艘商船。今年不回去了。姊上，你早料到阿濑会这般回话，是不是？"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_3:event:share:2","text"],null]']
src = "blake3:6d3ba7d393ff593febc20865e5b9c44c26df7dbab95b9f72dda1b10ee9e4f8ca"
text = "姊上誊来的旧帐我都看过了，二十年间八月出堺的船，晚到的十一条，没回来的两条。我改了主意，不急于这一趟。等哪年九月下旬风歇了，我们一道坐船回去看母上，把最大那面旗插上。房通大人瞧过姊上的信，说一条家的女儿懂水，比懂歌还难得。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_4:event:honest:2","text"],null]']
src = "blake3:03159882a4b19d6fcf1c91f0cae6f75a7e1117664df2f56b6ba0b753a9135edf"
text = "姊上去顶罪认罚了？汐早全漏给我听，说你跪得双腿发麻，出来时步子都一瘸一拐的。我那半份钱照旧送进局里，姊上不要也得收下。今后一条殿里的香，我不点便是，少说这个月内再不碰了。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_4:event:share:2","text"],null]']
src = "blake3:d9636e2043f3219a13afeff234ff9610b636cd5ca08786a99c99370f3a7dc8de"
text = "听汐说姊上连跑了三家香铺，杀起价来比侍从还老道。余下的那点碎钱，我差人捎了两串团子，一串送姊上，一串给汐。香会我近来又赴了一次，这回没动旁人的香，光用鼻闻，倒也猜准了两种。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_5:event:honest:2","text"],null]']
src = "blake3:20d9ed635a74211e3be42380e2f0d84ef8fa5b9eb5edd61bbd3fb24affa7eda6"
text = "贝壳我终究没丢。鸭川水浅，扔进去底儿都看得清。我把它压回文箱最深处了，侍从摸不着。姊上信里的口气好凶，我只读过一遍便收妥，谁也没给看。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_5:event:share:2","text"],null]']
src = "blake3:673b47875fbc8dcae73c3f090ec7f06c4859318a968b8f759df20ef0e18aa5fc"
text = "壳内那幅金泥画，我凑着灯火端详了半宿，水流到壳沿便截断了，另半截留在了姊上那头。姊上日后回土佐时，劳你替我望一眼那片沙滩可还在。贝壳我留着了，往后若有人盘问，便统称是一条家的旧物。这话姊上可别往外漏。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_6:event:honest:2","text"],null]']
src = "blake3:d0895cd93b7b21427761cff68c0727306dbdd97e1f127787950950c8cf07f5fa"
text = "姊上不肯允诺，我原先原要动气的。细想下来，风势也不听我号令。那便定下每个港一封信，半封不能少。姊上信尾记下的下田潮时，我拿去同家司历书核对过，分毫不差。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_ichijo_kanesada_6:event:share:2","text"],null]']
src = "blake3:341de64c91846a0edcef58b48fd98f73302d2c22a86af6b3c17ae94e27f1a8b8"
text = "姊上既肯掌舵，我便不乘旁人的船。家司道小早太小，当主坐着有失体面，我回他体面在旗帜上，不在船上。姊上，我会晕船一事，船上的人不必知道。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_2:event:honest:2","text"],null]']
src = "blake3:46af92435c2ab871c2d58a73810b2e371c932eae4ba8501743c8d115e2f8c8c5"
text = "你不肯胡乱写来，甚好。香的名目，辨准了再讲；辨不准，宁可言不知。下田一应如常，粮账我已清至正月。你那双草鞋，阿濑替你晾在檐下，总不舍得收。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_2:event:share:2","text"],null]']
src = "blake3:a649e215f30ca32e3d116f27e7babee497cb9dae878696474750a4cc0b2a54fd"
text = "你寄来的歌，我读了三遍。甜中带着苦，又似杉林气味，八成是伽罗，或者罗国也未可知，隔得这般远，我也只得瞎猜。你说想起了幡多的山，我记起的却是出嫁那岁辞别府内时，船上也曾熏过这般香。不多说了，该拨念珠了。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_3:event:honest:2","text"],null]']
src = "blake3:04127da3e4575cc7ab37873db7bef0b4e96661c01203b050ad2439ae2252f5c9"
text = "盆前离不得局，本属分内，无须自辩。运米之事你仍作此想，我也仍执旧见，且先搁置。待秋风凉了再去查看，看明再论。日后争执时，笔迹须写得端正些，我方读得下去。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_3:event:share:2","text"],null]']
src = "blake3:7f3a15c781887626138fa0e22e7c32c2f0832c5d5a5755c5f256e72a2ea18c2b"
text = "你记下的关数，我照政所旧账对过，仅差一处，是去年新设的。米仍留在堺卖。不过你肯乘川船一关一关地去数，我在中村拨念珠时，也陪着你数了一遭。下回书信，写写淀川水是什么色泽，我没见过。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_4:event:honest:2","text"],null]']
src = "blake3:2b301c9f30cd62c817c88c96081ead2c0c02cd2b18117ecfb1fba440934be4b6"
text = "缺记的七八天，你照实写了出来，强似硬凑圆满。政所若问起，我便回说京里开春事冗。兼定那刀纸，你替他记在账上，他合该谢你；我亦在这边给他记了一笔，等回来教他自己抵还。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_4:event:share:2","text"],null]']
src = "blake3:c0ef9596b7b0e98d504c7f3b37e0643e49a30f78f1186006b4dca3b0b3088a52"
text = "账目收到了。米铺改得好，礼绢晚几日买，同样不失体统。政所那边我替你回护了两趟，他们看过你的账，反倒不出声了。只是“本月省下”那一行，不必写去给他们瞧。省得出，原就是分内该省的。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_5:event:honest:2","text"],null]']
src = "blake3:a28c591d742a32996ea7cc1c36fcadb101ad03f0169542736c9bcab5fbb21e35"
text = "卧病之人不见客，你收起来甚是。八十年都等得，不在乎这数月。只是锁在本家时，钥匙切莫交与兼定，他必会背人偷开来闻。待大人病体好些，你捧去奉还那日，替我也行一礼。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_5:event:share:2","text"],null]']
src = "blake3:2eee77cca58a1dee09f0eee06e3b98d33f9472e4ba4fdea7eb83f5240c564566"
text = "你作的那首歌，房通大人的家司誊了一通寄来中村。“回来还认得路”，这句我诵了三遍。香木既归原主，经箱中腾出一角，我放进一枝晒干的桔梗。下遭相见，须先教我嗅嗅你衣袖，看还沾不沾着那丝香气。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_6:event:honest:2","text"],null]']
src = "blake3:1b9040247a84de9527628f08fb99a9d3509ea2617c19a4ca358ecefd39bd87b3"
text = "你不肯应的那桩，我读了足足两遍，拨尽了一整串念珠。船头往哪去，你说要看风，便依你看风。只是那看风的人，也当回头瞧瞧岸上守着的人。后两件事既已应下，少了一件也不成。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_family_bond_mio_mother_6:event:share:2","text"],null]']
src = "blake3:18ee63286a8da61be0372263bcc1397459b59208f59c243a1922774b9855cc8e"
text = "港名填成了一半，余下一半留着你自己的船去填。甲浦那条，老船头认说是他忘却告知于我，你倒偏偏问出来了。三件事你既悉数应下，我也应你一件事：出海那日，我不去河口送行。我若去了，怕你忍不住回头。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_0:event:keep:0","text"],null]']
src = "blake3:e437ca01bd42af24e4c376858f67258a5cb74d892da2e6ce8af38be826e16df7"
text = "土佐的小姬君：表哥把你的信捎回来了。他说你们河口有个女孩子替大人数钱，手比算盘还利索。我数钱也不赖，不信下回再论。五岛来船那件事，我以经问明阿爹，咱家的福船要趁北风往北大年去，一去一回得大半年，五岛只得等到明年。米价一斗涨了二十文，阿母说天妃宫里的灯油钱断不能省，只能省旁的地方。你们那儿一张帆收几文钱？月港，林晚灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_0:event:reply:0","text"],null]']
src = "blake3:e4e1435f0a2c1b0fcbdb74ebc3b97796c62fec0dc0973883d488e27c8d861073"
text = "小姬君：表哥将你的信一路贴身揣着，到月港时全皱巴了。他说下田有位姬君点钱胜过阿爹的账房先生，一串钱拎起来抖一抖，即刻知晓缺了几文。我心里不服，才提笔回信。你问起五岛来的船，阿爹道那边的船主难缠，我以经记牢了，替你接着打听。今岁米价高，阿母的灯油钱都拖欠两月了。你们那儿一张帆收多少钱？快告诉我，下回阿爹过去才好跟你讨价。林晚灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_10:event:keep:0","text"],null]']
src = "blake3:ff3598bfe97b5a191423a7f0e5b28c9aac005003440a49454d8948d9a130c9e4"
text = "澪：我也满十六岁了。今年社学里修习联句和讲书，先生讲完一段，轮流教我们复述，我口齿太急，先生打趣说快虽快，倒像在码头上喊货价。斗茶我负了两局、胜了一局，胜的那回茶叶是许采替我择的。你那头想必也临近结业了吧？待你出了海，咱们的书信往来便用不着绕这么大远路。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_10:event:reply:0","text"],null]']
src = "blake3:516dbf16809f3345210c7509577f2d7dfc51a23a0091c66f58647573fa16a462"
text = "澪：在社学的最末一年了。先生新教起联句，由他拟出上句，我们挨个儿接对，数我对得最疾，陈栋回回都爱和我抢先。斗茶我也胜过一遭，许采偏说是撞大运。近来先生总盯着我执笔的手看好半天，我心头暗自忐忑，面上照旧带笑。你那边的歌合胜了没有？赢了要写来，输了更要写。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_11:event:keep:0","text"],null]']
src = "blake3:a663216e2afaec34193e5adfbee45e88cc80b5970c66d6255f046deb9c22ba10"
text = "澪：回执。来信已收悉，究竟哪日送到、何人经手，今番概不落笔，怕写了牵连他人。今夏官兵曾入港搜检，家中近况、社学诸事，且留待重逢再叙。正月我动身出海，你也定在正月。五岛一带海路我熟稔，你只管来，由我引路。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_11:event:reply:0","text"],null]']
src = "blake3:5db40a88df3d92997ddd6947e5cc51b9347d2116c60da7355e214c678e327f4f"
text = "澪：这一封便不提劳烦谁捎带的了。近来港内盘查甚严，今夏官兵连着来了两趟，翻箱倒柜，连天妃宫里的香炉都掀了盖察看。你约定正月从下田启航，我牢记于心，我也正是正月动身。抵五岛后，认准桅杆悬着红纸灯笼那条船，只消唤一声灯，我便下船相见。切莫认岔了，也别教旁人代你呼喊。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_1:event:keep:0","text"],null]']
src = "blake3:8b29985604b0e901f70686c2ff30722b4af324ad18c7f1c844a32f9cbb1dd2a0"
text = "小姬君：我也十三岁啦，三月廿三生辰，恰好与妈祖同日。此信是在天妃宫的油灯底下写就，故而沾了些香火味。阿母教我握笔登写灯簿，你瞧我练的“灯”字，可是一回强似一回？阿爹的针路簿常年锁在木箱内，钥匙拴在他腰际，我还是偷偷背熟了一半。妈祖生那日我拎灯绕境，逛了足足半个港口。烦你也替我向你们那儿的海神拜上一拜。晚灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_1:event:reply:0","text"],null]']
src = "blake3:3c52c67c9c28782406cd99cf9514dfef6298fe85dab45222dd9f7ebda7d9c088"
text = "小姬君：前头那封不知送到不曾，阿爹讲海上丢信比落货还常见，我索性再写一封。阿母教我记灯簿，哪户许愿几盏灯、赊欠几文油钱，半笔都不容错。阿爹不肯教我针路，我趁他打鼾时偷摸记下，去五岛行几更、绕哪几座岛，背得一清二楚。三月二十三绕境，我提灯领在最前头，脚底磨出两个水泡。你们姬君平日都学些什么？晚灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_2:event:keep:0","text"],null]']
src = "blake3:015fb7ded7c1ada5f2d11c1f0dca133b039b4eea19c73dc4e6e40b916acb827e"
text = "澪姬君：回执。来信一封，八月中旬收到，信纸未湿，封口齐整，船头姓蔡，脚钱我已代付。往后寄信于我，信面单写“月港天妃宫”即可，别添林字。浙江那头打仗正紧，外头传说是我们这方的人给倭带的路，官府查验船只极严。我一切安好，阿母也妥当，阿爹的船尚未归港。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_2:event:reply:0","text"],null]']
src = "blake3:4b09f2cad3381cf7218a29b217a97c586d7e22ed04f7c35996440a287da4ddd1"
text = "澪姬君：你托付府内的船捎来的信，八月十九送抵天妃宫，船头姓蔡，我特请他吃过一碗面线。日后封套上莫要题我名讳，单写“天妃宫灯油”便是。近来浙江闹倭，官府疑心月港的船只给倭寇引路，港内日日搜查船只。阿爹嘱我少写书信，我偏不依。你若改换住处，定要提前告知我新落脚点。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_3:event:keep:0","text"],null]']
src = "blake3:6ff7f94fa3a6ef977602266275b23ec9b64fc31fcc35b8d9360aa041c32f8950"
text = "澪：今年的船期落定了，南风一起，阿爹的福船往五岛去，我也一道走，这还是头一遭。家里的用度你莫笑话：货仓里积着去年的生丝，阿母的算盘拨得比你还响，我攒下的铜钱全拿去交了束脩。再过几日我便要去龙溪念书，身上套着二哥的旧衣。干嘛穿他的衣裳？你自个儿猜吧。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_3:event:reply:0","text"],null]']
src = "blake3:440f1364ea5f8064a1fd57e9b760732d16f34f951a9b65ff4bbd29703abda4a9"
text = "澪：信转寄去京都，也不晓得能不能寻着你。等四五月南风吹起，阿爹便带我去五岛了，他总算松了口！家中手头紧，去年的生丝积在仓里卖不脱，阿母连点灯的油钱都挪出来填窟窿。我存的那丁点钱都缴了束脩，过几日往龙溪读书去。二哥穿剩的那套旧衣，阿母连夜替我裁小了。你休问缘由，问了我也只拣假话应付你。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_4:event:keep:0","text"],null]']
src = "blake3:d96d53f232704c5ed9af284fb531560d7b91277c0337b87cb7d34f43fb6efc07"
text = "澪：我眼下每日卯时进社学，先生头一桩先盘问昨日行了何等善事，接着背诵《小学》，再演习作揖，晌午过后大伙踩着节拍吟诗。我嗓门亮，唱得最响亮，先生嫌调门太刺耳，叮嘱我往低里压，我自是听话压低了声。字我天天都在描，你瞧这封可还有白字？拢共就错了一个，我也涂改好了。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_4:event:reply:0","text"],null]']
src = "blake3:6be6d969ebc94ff1e5639fe41ef6cca5dd376273f83f07f076dbb097cbe193ab"
text = "澪：社学里的章程，清早先查德行，问昨日在家可曾尽孝，可曾撒谎。我天天回说没撒，先生便天天颔首，你说可笑不可笑。之后便是背书、学礼、歌诗，作揖得腰弯到瞧见自个儿的鞋尖才算。先生嫌我字难看，我只得日日描仿。下月我当真要动身去五岛了。你待在京都，离五岛是近还是远？灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_5:event:keep:0","text"],null]']
src = "blake3:4138d856d1c2bc3ce135b6af1967a9ca8f08841d4e799aacea66b4e228dd2dd8"
text = "澪：回执。你的信转到五岛落进我手里了，多亏平户一家酒铺捎带，掌柜抓了我两颗果脯算作脚钱。五岛的海水比月港更蓝，夜里船舷挤着船舷，灯火一盏牵一盏，热闹得宛如天妃宫赶庙会。当中停着一条大船，阿爹说连平户的大名都得礼让那船主三分，大伙管他叫老船主，我也只敢隔得远远地瞄上一眼。往后通书信，认准贝壳上的暗记。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_5:event:reply:0","text"],null]']
src = "blake3:00a0553f66da34d0b436e214ca4d82e2c1016276f4a77c1118e626c39f5b9474"
text = "澪：我真个踏足五岛了！港湾里泊的船多到数不过来，最大的那几条高高挂着旗，阿爹嘱咐我休直勾勾盯着瞧。在平户还撞见了佛郎机人的船，炮口黑黝黝的，比天妃宫的香炉还要阔大。你六月寄出的信，我在五岛便拆到了，反倒比在家里头更快些。下回只认贝壳上的这枚记号，没记号的俱非我手笔。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_6:event:keep:0","text"],null]']
src = "blake3:c5f12eaa12c6cf0851cf8edd572e071f69575932b2a782e523332aae082bda19"
text = "澪：年关尚未过去，阿爹便发愁不知何日才能出港，巡船死守着海门，即便南风吹起也动弹不得。家中吃食尚算宽裕，独独灯油价昂，阿母宁可省下一顿饭，也不肯教长明灯熄灭。我在社学里诸事如常，没人察觉异样，这句你只当没瞧见。果脯乃腊月里新鲜晾晒的，若在道上坏了也莫丢，搁日头下再晒晒照旧能食。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_6:event:reply:0","text"],null]']
src = "blake3:ac8a700d4c849eb30cf2abff6f640adc8be4e3359aede91c0b47e50a8e3d34bf"
text = "澪：今岁的船多半走不成了。官府咬定倭寇是从咱们港口出去的，眼下北边战事吃紧，巡船一天巡查两遭，阿爹的福船唯有一味泊在内港干等。家计仍旧紧巴，阿母狠心将天妃宫的灯火减了三盏，瞧得我心头直疼。常闻你们那头银子多，不知一两银子能换得几斗米？劳你帮我向宫中人打听打听，我也好心里有本账。果脯是我亲手晒的，莫见笑。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_7:event:keep:0","text"],null]']
src = "blake3:7d72ff4611211d45e2efb3705eb1b740c05a9b39d0e750fcdc9958c10c94f218"
text = "澪：三月间先生领我们徒步两日赴同安，旁听林老进士讲书。老人家七十四岁高龄了，谈及海上，直言朝廷的禁令恰如江堤，堵得越死，决口便越猛烈。陈栋在座下直撇嘴，我暗把这话记在掌心，归来净手时方懊恼未曾抄下来。你信末附的两个假名我也学着写了，倘若写反了休笑我。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_7:event:reply:0","text"],null]']
src = "blake3:0a8671d21fbbd47a097944da63bf3f3c9256c2ea5fe65937dc410cc5fe6c8722"
text = "澪：这季社学研习《孝经》，先生念一句，我等齐声跟一句，谁抢先抢快了便要罚站，我已挨了两回罚。近来港内纷纷传扬，广西来了个花白头发的女土官，率着狼兵赶赴江南打倭，人称“花瓦家”。我在天妃宫屋后抄起扁担学着比划了几下，偏教阿母撞见，罚我擦了整宿的灯罩。信末那两枚假名，我照着你前番来信描了十数遍，末了一笔仍旧拐岔了方向。待你们七夕拜星时，也顺道替我拜上一拜。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_8:event:keep:0","text"],null]']
src = "blake3:b4278356115f5721d57ba8c01e7f07c36993d39aaad3807f3561079f64ac69c8"
text = "澪：回执是我撕成两截的，剩下一半留在我手边，今后半张对不上的信切莫轻信。你四月所寄之信七月初便递到了，脚程比去年快些，如今连五岛酒铺的掌柜都认得你画的扇子了。七月间有几十个倭从浙江一路流窜至南京城下，官兵紧闭城门不敢出战，咱们港里足足笑了半月。笑罢之后，海面上的巡船陡然翻了一倍。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_8:event:reply:0","text"],null]']
src = "blake3:de9e88c01d4b2b19c679b32d4acd0f54024bcc3a05e11473b6896f0fdd7725f4"
text = "澪：你的书信是二哥自海沧接回来的，恰逢那天倾盆大雨，他紧捂在胸怀里，归家时唯独湿了一个角。沿途经手人等我皆一一录在封皮上，万一丢了也好寻觅。把回执一剖为二，原是学官府的勘合，官家藉此管船，我拿来管信。南京地界闹起倭患，竟一路打到城门底下了，阿爹叹气说今冬的船怕又走不成。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_9:event:keep:0","text"],null]']
src = "blake3:a953334a8533d2f159fa80182dccc5fee426141ab24bd1623aebff9168adc76d"
text = "澪：今岁家中的账，我也记一份给你过目。阿爹去冬把那条大福船押给了海沧牙行，手头唯余一条鸟船，盘算着清明后看风，究竟往五岛还是奔北大年，届时再定夺。我闲时在港口替船工的老婆们代写家书，一封三文，若写哭了也不另加钱。又替天妃宫抄灯簿，抄一本换得一斗米。这笔钱不拿去交束脩，全数交由阿母。灯。"

[entries.'["upbringing/families/mio_events.toml",["effects","c9_mio_letter_9:event:reply:0","text"],null]']
src = "blake3:1b213e160f3164cc10bf0e215eb50ebde3478230aa263ec75718f543c69e928d"
text = "澪：给你瞧瞧我的账。代写家书十七封，入账五十一文；抄灯簿一本，得米一斗；卖果脯却折了本，半数都填进了二哥的肚子。阿爹的船清明后起锚，若风正的话，五月便可抵五岛，我求他带我，他既不点头也不摇头。阿母说海沧新来的通判是个硬脾气，今岁的例钱恐要涨。你那头的账，也写来与我看看。灯。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_court_duty_failure:event:first","text"],null]']
src = "blake3:e4332d8aac855b7b6f6785a7ac99393e208b72ffc9015cf625f37edd8977ab3a"
text = "入宫头一回当值，我在局里奔忙整日：送香盒、研墨、替老女房卷御帘，依她所言停在那一格。天色擦黑时她截住我，将我办的差事逐桩算账——御帘多卷高两指，墨研太稠，回话又溜出一句土佐方言。“乡野来的姬君，”她合拢扇子，“宫里的帘子可不看海。”我双膝跪得发麻，面上滚烫，比在下田河口迎头挨一记浪还烫。她交代明早重来，一桩也不许缺。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_court_duty_failure:event:remembered","text"],null]']
src = "blake3:bcefdd3c6a69263cdbfc07bd5c8c61ec5f70ee6524a3b97f9f7b909a9f325a54"
text = "差事又遭打回了。这番纰漏算不上大：所赏绢帛少录一匹，日子写成了头一天。老女房连扇骨都懒待抬，径自将纸推回我面前：“上回你答应记牢了。”我辩道上回那一桩，此回可半分没错。她答宫里的差错从不排好队候着你，今儿这一桩，明儿又是另一桩。我低头收拾好纸张，新墨尚未干透，指头腹上蹭了一团乌黑。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_court_duty_success:event:first","text"],null]']
src = "blake3:478d94eb9d4522239096af636c264cf540ae9d8adb5c39ab118d9dab025ad764"
text = "头遭上值，我半点差池没出。御帘稳稳卷在当停的那格，递香盒时绳结正朝外头，回禀言辞也念得徐缓安稳——前宿我拿假名把回话抄录在怀纸上，塞在枕下，醒一回便温一回。老女房听毕，只丢下一句“下去吧”。步出局外，汐已等在长廊，问我可还好。我说人没骂我。汐道这便是称赞了，宫中褒奖人全这德行，跟她娘一个模子刻出来的。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_court_duty_success:event:remembered","text"],null]']
src = "blake3:4ec1147956cc4d66464b387274b7a32bea59654286c6ad79cfa187ec39ed9a80"
text = "上值的日子一久，局中诸务我闭了眼也能摸清门道：哪位上臈惯使哪尊香炉，哪日典侍该换夏装，外头使者前来求官又该请进哪间屋子候传。今日差使办得妥帖，妥帖到老女房连眼皮也懒得抬向我。散值时我盘了盘手头，这个月积攒的赏钱，足够给兼定买上一刀上好纸张练字。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_ase_oar:n0:lesson","text"],null]']
src = "blake3:179da31a2c09c3203e38283504fbccec7f52eefe510289a5df097d17dcecc304"
text = "入了冬，阿濑寄来书信，这遭是她亲手落笔的，字个儿大，彼此挤挨着：“船台上泊的那条小早，我让船匠在舵板底下挖了个槽。梁上那件东西，姬君瞧见过，也学过一句，已经放进去了。船上用得上的东西，就该呆在船上。”底下空出一行：“我的右手撑不动篙了。开春姬君出河口，我在栈桥上瞧着。撑不动篙的人，看得最分明。”信背画了幅下田的河口，栈桥尽头点了个点，旁注一个“我”。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_chidori_choice:n0:followed","text"],null]']
src = "blake3:388d66ef9a0e92c00386037343caf8b260fbb4ec60ab1a21da5e44b8f59a0de6"
text = "入秋深了，千鸟的信递了过来，竟是她亲笔写的。替她带信的堺船船家在末尾附了一行字，说这姑娘逐字讨教写法，足足问了一整宿。信中提及，她爹托人自堺传话，在船坞给她议了一门亲，相手是个木匠，催她开春过去。“我不去。”她写道，“那日你随我下水，我方知水底寒凉，有个人相伴便不冷了。婆婆眼盲了，口哨传了给我，我留在河口。”末后另起一行：“你的船归来时，锚地的底，我先下去摸。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_chidori_choice:n0:hauled","text"],null]']
src = "blake3:a994a5fbdacac2465fe23fe0e662b08a2eeba7fcddfe2972652e11f9f9d1a0c8"
text = "入秋深了，千鸟的信递了过来，竟是她亲笔写的。替她带信的堺船船家在末尾附了一行字，说这姑娘逐字讨教写法，足足问了一整宿。信首头一句便是：“那日你硬将我扯上来，我恼了你三日，第四天方想明白。”信中又言，她爹托人自堺传话，在船坞给她议了一门亲，相手是个木匠，催她开春过去。“我不去。婆婆眼盲了，口哨传了给我，我留在河口。”末后另起一行：“你的船归来时，锚地的底，我先下去摸。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_chidori_choice:n0:let_go","text"],null]']
src = "blake3:30159ccc103eb9c4195e10fcfe67fe3de9b7e016e83cfc5547e40d3729361cd4"
text = "入秋深了，千鸟的信递了过来，竟是她亲笔写的。替她带信的堺船船家在末尾附了一行字，说这姑娘逐字讨教写法，足足问了一整宿。信中提及，她爹托人自堺传话，在船坞给她议了一门亲，相手是个木匠，催她开春过去。“我不去。”她写道，“婆婆眼盲了，口哨传了给我，我留在河口。水底那座京城，我见过一回便足矣。”末后另起一行：“你的船归来时，锚地的底，我先下去摸。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_chidori_stone:n0:fire","text"],null]']
src = "blake3:52ade9871f8ae8de9f25e6e6599a85c963374c64895998eeeefc81750c5b17ab"
text = "岁末年关，千鸟的信随年货船进京，辗转过两次手方送入局中。拆开封口，先滚落一枚石子，拇指大小，白得润泽发亮，棱角早被磨平。我将它托在掌心，那夜在火旁烫落的一块疤痕，至今犹未褪尽。这封信写得比过往任何一封都长，字迹依旧粗大，一个假名足占一节指头：言说今冬海水澄澈，她独个儿下了水，过六寻，又深一寻，终于触到了水底。“七寻底下的石子是白的，像你所说京里的白砂那般白。”末一行字写得极细：“底下尚有东西。我瞧见了，还要再往深处去。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_chidori_stone:n0:noshima","text"],null]']
src = "blake3:81da7c6ccef0ae1effbe0e21c0d52d4e9e06cea3551148d5e0adee16d677dc2b"
text = "岁末年关，千鸟的信附着盐船抵至能岛。拆开封口，先滚落一枚石子，拇指大小，白得润泽发亮，棱角早被磨平；鹰丸拾起迎着日头端详了半晌，道是连砚石都不及这般洁白。这封信写得比过往任何一封都长，字迹依旧粗大，一个假名足占一节指头：言说今冬海水澄澈，她独个儿下了水，过六寻，又深一寻，终于触到了水底。“七寻底下的石子是白的，比你那边浅滩的贝壳还要白。”末一行字写得极细：“底下尚有东西。我瞧见了，还要再往深处去。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_fire:n2:page","text"],null]']
src = "blake3:410f65e10494ff59d5cb42cba83b680404b1e3211924bc672696c64b20ccfbef"
text = "小弁此后再未返局。及至岁末年关，她托人捎来一信一小包。信里言明，家中已烧了个精光，父亲的病也不见起色，开春便要打发她投奔丹波的亲眷，跟一名乡野地头过活。“那座洲浜，原是要敬献给星辰瞻仰的。星辰兴许瞧见了罢，那一宿燃得那般通明。”小包之内裹着半片焦黑桐木，原是台子的一角，另有那帧焦边的短册，她又还与了我。信末她落笔道：“这块残木，且劳你替我抛进大海罢。歌你留着。你有海。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_rosary_box:n0:noshima","text"],null]']
src = "blake3:9965d68ce477b847f24aa1e94ab3a5646ebc451f6bfe381efacac9f1b0f8f1ed"
text = "回到能岛尚不满一月，西行的盐船捎来一只油纸包，掂着比信重上许多。解开包，是一只陈旧砚箱，黑漆磨出了木纹，盖面嵌着一枝螺钿藤花，缺了两片叶子。母亲的信寥寥两行：这是你父亲的砚箱；明年出海，带着。我凑在通铺窗下掀了箱盖。砚台是干的，毛笔搁在笔架上，笔毫早已秃了。砚池边角卡着一颗木珠子，被手摩挲得光亮，与母亲念珠上的一般大。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_rw_rosary_box:n1:asked","text"],null]']
src = "blake3:812bc3ef2aef5f7e226e04f50e9926d7a1a8c64c5e56ac29ea451e091ee1e869"
text = "第二封家信来得比船期还赶，是母亲托了一条急着返堺的鲣船捎来的。珠子的事，她半个字也没回。信写得更短：“那只砚箱，你还是寄回来吧。出海的人，船上东西越少越好。”字下笔极急，最末那个“好”字，女字旁仅仅写了一半，墨迹拖出一线细尾巴。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_sail_toll_failure:event:first","text"],null]']
src = "blake3:95e5677285f7f96593126768d58976a57fa5e7025b4422efbbb80c4cd6697ca4"
text = "初次跟着阿濑登船收帆别钱，我脚跟还未站定，船主便嚷嚷开了。直到阿濑报出能岛的旗号，他才不大情愿地把钱掏出来。我蹲在舱口把船名往木札上写，才写到半截，船又晃了开去。等回到岸上再看，札上记的是“松丸”，船尾悬的却是“鹤丸”的旗，钱数也短记了一截。阿濑翻过木札，叩了叩背面：“姬君，船可不会等你把字写完。”"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_sail_toll_failure:event:remembered","text"],null]']
src = "blake3:86b2e2463e41c69f5ad49b077d6d8c3881eef171248589ac05400bdb125b5904"
text = "收帆别钱的日子长了，我自诩河口的船只再认不错。今日来了条伊予的船，旗色半旧，船主一口咬定上回交过了。我轻信这话，挥手放行。傍晚阿濑翻检前番的木札，上头压根没有他的船名。她冷言道，河口走船的人十个有九个自称缴过，唯有第十个才算实话。我立在栈桥边张望，那条船的帆早飘出了湾口。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_sail_toll_success:event:first","text"],null]']
src = "blake3:24da7963a6949e42e79cfe103ff9657d4bdf953ec94021a2c4a2c5113a441144"
text = "头一回随阿濑登船，我竟没写错半个字。她唱旗号，船主解囊，我就蹲在舱口，船名、几帆、几文，使假名一行挨一行填上木札，写得比在家里习字还板正。及至登岸，双腿仍打着颤，一半是船身摇晃，一半是心头快活。阿濑抽过木札瞧了一瞥：“写这般齐整，跑船的反倒认不清。”嘴上挑着刺，她还是将木札妥帖揣进了怀里。"

[entries.'["upbringing/families/mio_events.toml",["variants","c9_mio_sail_toll_success:event:remembered","text"],null]']
src = "blake3:58c3e831001ede0877c4a1c07bec3202e49943d863378114284684aee4da0d6c"
text = "河口进出的船只，我认得七七八八了：哪条是宿毛来的鲣船，哪条归堺商人的米船，哪条船主一闻能岛二字便立刻解囊。今日有个船主想短交半帆之数，推说那角小帆充不得帆。我拿手指指他那帆，说只要风认它是帆，我便认。他愣了半晌，哈哈笑着把钱凑足了。阿濑在小舟里听见这话，把脸转过去，模样倒像忍着笑。"
