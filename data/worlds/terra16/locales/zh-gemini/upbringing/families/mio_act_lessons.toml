generator = "gemini-4-hydrogen"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_caulk","description"],null]']
src = "blake3:d390335059e25a362e5afbdc4bb03bcbf14c527e01d272894690a4478125df97"
text = "撬下旧小早上腐朽的木板，量准尺寸，再逐块钉上新板。锤子落偏了，旁边的船匠听声便知，让我把钉拔出来重钉。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_go","description"],null]']
src = "blake3:60fa31e4607f3f8965933b8ae88c1e64bc1a803e8a9381d9b869592535c8c1ee"
text = "无论住持还是同屋的，找个肯陪着对坐的人便下一局碁。若输了，夜深时自己重摆一遍，细看是从哪一手先松下来的。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_go_kifu","description"],null]']
src = "blake3:d83b7b4cd34b6c81fe8e9044a4292bd10f2c88be2c9518d5897799e445cae811"
text = "借了册手抄旧碁谱，循着谱上落子逐手摆看。当中有一处墨迹晕开了，辨不出该走哪一路，我便试着拟出两般下法，各自演到终局。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_go_life","description"],null]']
src = "blake3:fa85c78ff1beddeef10d4a52da77d0b7c8a97f308daa977e1b966fbadef5da91"
text = "有人在纸面画出一角棋局出题：黑棋先走，可能做活。我对着巴掌宽的地方推算至暮色四合，才算通了一条路；出题人拿回去，盯了许久。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_hosho","description"],null]']
src = "blake3:0e5858da699e458d915ed92cb9026a78acf41340adab2ef21857b4dcf75e0368"
text = "女房在一旁口述，我铺纸执笔，代宫中誊写发往外地的奉书。假名字迹须连绵不断，行气要略微左倾，收尾那句成例套语半字也改不得。若是写废了，纸钱便要从我月钱里扣去。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_house_call","description"],null]']
src = "blake3:e8483d11bb43cf9cc4db05bf1095f1e42d02c6faabc4ebe9592dd3860ea355ea"
text = "背上药箱随山科大人出门看诊。他看诊极快，沿途反倒一直盘算宫里修屋顶还缺多少贯钱。病家有时只拿一包茶作诊金，我记了脉象，也顺手记下那包茶。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_hyakushu","description"],null]']
src = "blake3:163e36bf79fe6670cc984d124216e11242e7fc6d1896aa7fe05b659567b74895"
text = "按国子大人出的题，一月须咏满百首：春二十，夏十五，恋二十五，数目全由她定下。写至七十多首时，回头再读，我把前头写的改掉了一半。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_kagura","description"],null]']
src = "blake3:80bbad5c34ee46d9628bdd759087e82a091dab9c652a72dc6dab629714e9b152"
text = "祭所里的老巫女领着我摇铃、踩步，再将扇子从左手倒至右手。只要步子迟了半拍，铃音一与鼓点错拍，她便拿扇骨敲我的手背。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_kagura_lead","description"],null]']
src = "blake3:b8b8dbabc08741330c1e02786b23c00ebde8be758303e633357f77e73a0cdd4a"
text = "秋祭夜里，我在拜殿前领舞，身后随行着四个渔家姑娘。火光烤得脸庞发烫，跳至第二段，台下有人朝台上抛了一把米。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_keel","description"],null]']
src = "blake3:7aade1356ad3039193b34a479de4e1ce645dfbaf6de1a37296c41f9e53a840fe"
text = "新小早安放航木那日，我帮忙扶住一端，船匠扯起墨斗弹线。墨线一震，碎木屑抖落进我领口里，痒了一整日。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_kemari_asukai","description"],null]']
src = "blake3:a6c8b59b89938445c6e3d948b2fc74f79bab3e33852dffa31119dc71aa17f7a0"
text = "随鞠千代步入飞鸟井家的鞠场。场上的鞠以鹿皮缝制，踢起来声响沉闷。整个下午，我仅有一回把鞠踢上樱枝。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_kemari_ring","description"],null]']
src = "blake3:253196ef6fbf3d6ae91cef2b58408a6d88d3d4447b490a4f26660adf2e97c224"
text = "八个人依着鞠场四角的树站定，鞠由这脚递往那脚，落地前得喊上一声。我总归喊早了，鞠还悬在半空。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_koto_ensemble","description"],null]']
src = "blake3:67daeaae04753a0c437f38b3dacf743a37d222305d9eb84b6bc1870454543abe"
text = "与同住小局的伴儿合乐，筝须追随笙音。偏我指头快，老抢在笙前头半拍。一曲终了，对面人把笙往膝头一搁：“再来。”"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_koto_secret","description"],null]']
src = "blake3:a661c6c545718403e5dec42eb507613b4ac14f6fcdb44c3f7bf0509630b72f32"
text = "山科大人允诺教我一曲不外传的筝调，换我替他抄一个月日记。曲谱他不给，只当面弹过，我便把指法记在袖里的小纸上。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_kumiko","description"],null]']
src = "blake3:d1b206aca1cfd03f66910e1a8c8907b360cca32f352712b606caca705b9d9b3d"
text = "试玩组香：将五包香混在一处焚烧，辨认哪两包同出一味，答数写在香札上。十轮之中猜错了四回，其中一回是把沉香认作了伽罗。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_nobi_strait","description"],null]']
src = "blake3:96d4aa1c5fa6c5036b65dff8f9c1cf66f1d3d6f0b5946ad57cc55c4ff11cc59f"
text = "又四郎驾一条小早穿行鼻栗濑户，命我掌舵。流势最急的那一段，他的手始终扶在舵柄上，直到船驶出濑户口方才松开。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_oar_staff","description"],null]']
src = "blake3:8a0dc9889d065d20e32b85da636f3538d1e8d54221a91e0f0727a97f8e1b840f"
text = "阿濑不先授刀法，倒先拿船桨练手：横架格挡，直推向前，桨叶切莫对着自身。挥到四十余下，掌心水泡磨破了，她只叫换手再打。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_read_water","description"],null]']
src = "blake3:344361f96bd5062d3429c2f724814504f8a13024f5353e9b256e4e268b95c1fe"
text = "蹲在高处眺望海色：泛白的那片是浅滩，起细纹之处是风头将至，还得看海鸟往何方落去。每看岔一回便记下一笔，事后摊开潮时表逐一核对错处。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_reki","description"],null]']
src = "blake3:727efd9919241fc2178d4deb9b873d6349cf1f15423e578440f2c271edc25954"
text = "借得一册具注历，依着推算次月的朔望与潮时，算出的日期却与历本差了一日。土御门家的人看过，点出是我算漏了闰月。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_sechie","description"],null]']
src = "blake3:2c7dd57fe9a6984a75e064e19a8e585c08505f728322c61f091006d6adb625b8"
text = "节会当日在廊下听差：递送酒水、口传话语、记稳前后顺序。座次只要弄差一位，后边一整排都得跟着重挪。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_shrine_host","description"],null]']
src = "blake3:07a3075c32d7a00752413dc6d5b71f6628e900a0b872d6eb186f08504ede0da7"
text = "祭日替神主在鸟居下迎宾：渔家、船主、从堺来的商客，各有各的说辞。哪家奉了几升米，我顺手记下，入夜报与神主。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_tide_table","description"],null]']
src = "blake3:ae50ea2756edf4493bac506cbc05907fbadf5545107cd9806827503b7b212463"
text = "依着月龄推排出次月鼻栗、船折两地的潮时，制成一表，贴于存放潮表的木柜上。月末逐格对过，出错之处用朱笔勾圈，一连圈了九个。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_toll_ledger","description"],null]']
src = "blake3:8dc713a47592d726fcf5eb8359ba019a8a3b36adc5ae30e4d9ba34f68cfae0e6"
text = "将这一旬收下的帆别钱逐条清点：船名、帆数、合多少文。木札和账簿若对不上，我就往栈桥去问阿濑。她条条船都记得，偏记不住数。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_tsukinami","description"],null]']
src = "blake3:2b8197619bfd8ee1471ad057b1455c3a1216cdd2dd46ad8d585cf8e94b09fde2"
text = "伴着国子大人赴月次歌会，坐于最末一席，替众人研墨、收拢短册。待挨到我吟咏时，判者已在那儿打哈欠了。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_yusoku","description"],null]']
src = "blake3:d4c9efe4efbb339f6cdf182b449fa609453024bcf69732698f2828c59c9a5663"
text = "三条西大人讲授有职故实：服色、席次、何年因何改易旧制，逐条令我背熟。讲至半途，他忽问方才说到哪一桩，我答上来了，他只道正是这桩，便接着往下讲。"

[entries.'["upbringing/families/mio_act_lessons.toml",["activities","c9_mio_zen_tray","description"],null]']
src = "blake3:e5659da5a5c7ca1ee1bbed42670382d1e0cdde716868438d9eb1612ec9ecc484"
text = "习学端膳：双手捧定膳台穿行长廊，碗中汤水不可起半点波纹。至于几帐垂幔该悬几寸、偏向何方，亦都归在这一课里。"
