[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_00","text"],null]']
src = "blake3:0eea7ba6644a759390097e977a0f447597bdbc7a7b634c9d057cb0caf4f2a6f9"
text = "出船那日清晨，下田河口的芦苇上挂着一层霜。政所拨来的小早是条旧船，配了十八名水夫，我连半数人的名字都还唤不全，船舱里压着三袋米、两袋盐。阿濑用那条红白两色的绳子替我束发，系得太紧，我忍不住喊了一声，她却没松劲。母亲未曾到河口送行，托人捎来一张怀纸，上头单写了一首歌的上句，下句我还凑不出来。我将桧扇插进腰带，高声喊道起锚。船头一转，四万十川的水推着船往外漂去，比我预想中还要急。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_01","text"],null]']
src = "blake3:aa0fb2bce00f3d0a95c6888a7c0513bba0ece005aa63b3a577a83d55b0deecde"
text = "阿濑的肩伤终究是养好了。我托人跨海捎回来的药膏，她虽嫌味儿刺鼻，到底涂抹了整整一冬；岁末她又下了一趟河口，闭气竟比我还长，上岸头一句话便是骂水太凉。出船前一晚，她领了两个打能岛来的老水夫到我跟前，一个少两根指头，一个一逢阴天就喊腰疼。“这俩是我自小看着长大的。”她道，“往后他们听你差遣，你听潮水的。”她随即将一块盘得光亮的木札塞入我掌心，那是昔日在能岛收帆别钱所用的物事，背面刻着她的名字。我说不要，她道是借与你的，回头得还。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_02","text"],null]']
src = "blake3:c95de64ae6677f53fcb3f480738d683b5c9fad4456732ef2075cd249b64b8439"
text = "兼定动身返土佐的那年冬天，母亲将中村的粮册抱至政所，一簿接一簿交割清楚。遇上欠租的庄户，她在名下以朱笔批注减免数额，侧旁细注着哪一年遭了水患。源康政大人翻检至末一册时顿住了手：尾页留白处，母亲用假名题着一首歌，吟的是秋日垂首的稻穗。“此页不作账目。”母亲言道。退回居所后，她将那管写秃的毛笔递给我：“船上的账簿由你亲自登载，写差了再无人代你删改。”手指拨转过一圈念珠，她又添了一句：“歌亦如此。”"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_03","text"],null]']
src = "blake3:1f293798d6554f0ce6cc5d90c55607d53e80dd6e4c942f788afa3e74ce3c75df"
text = "兼定的字迹总算不再倾歪。他递给我的末一册字帖里，“姊上”二字竟比我写得还要方正。重回中村后，政所上下尽皆改称他为“御所大人”，他答腔极快，可一转过脸对着我，口中依旧喊着那声“姊上”。出船临行前，他往我手里塞了张纸条，上面罗列着宿毛、清水、下田几处港口，言称各港皆为一条家的船只留着泊位。“泊位归我照管，潮信归你录写。”我道你才十三岁年纪，能照应得了几个港口。他涨红了脸应道，管住一个便算一个。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_04","text"],null]']
src = "blake3:e16bc2d16071b2a1c45c55341753279827db58101b94ee3741d614b02b453bc6"
text = "那艘小早在下田的船台上躺足三年，船底旧钉生锈结了厚壳。老船匠一根接一根起下来，码在草席上，教我辨认哪几根裂了口。修船的桧木，还是我隔着海递了两封信，才从山主手里讨定下来的。下水这天，船匠扶稳船头最后一枚新钉，把锤子交到我手里：“姬君，这根归您敲。”我一锤砸偏，钉帽斜翘着。他说不拔了，就任它翘着，日后谁瞧见都知晓是谁的手笔。小早滑入河口，水花溅了岸上人满身。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_05","text"],null]']
src = "blake3:9e8c5d9389f7677f989d5532d7e069f61778ef9be93c99f625633a4283b74789"
text = "那年山里的炭窑被连日阴雨冲毁，铁匠只得改烧松根，炉火一阵高一阵低，锻坏的铁料堆了半屋子；后来用的木炭，是我在外头立下保单，一笔笔替他赊回来的。距出海还有十天，他把打造好的船具逐件摆在铺前：锚爪、桨环、舱门铰链，上头无一不錾着他的印记，是一只歪嘴鸟。“炭账清了，货也交齐。”他认不得字，请我在账页上代题一句。我写了半首歌，词意是炉火映着河口潮信。他听我念罢，嘟囔着说：“没听明白，不过好听。”"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_06","text"],null]']
src = "blake3:0d51fe1ddc4de04e1a0381e8815238b101f010433d7c6ccc6b9e2558f4d3a9df"
text = "金刚福寺的老僧曾向我展示一张来自那智的图录：一叶小舟，四壁钉得严实，仅留一道窄缝，舟上悬着满书经文的帆。老僧道，这般船只那智曾放过，足摺也曾放过，至于驶往何方，从来无人归来言说。我访遍了加久见的老船头与自堺前来的商客，皆言未曾见过那船泊向何处。启航前我将海图展平，由足摺岬向南划出一道线，画至一处便收了笔，留出那片空白。阿濑问为何不画到底，我道：“待我亲身去过再补。”她横了我一眼：“那便让它空一辈子罢。”"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_07","text"],null]']
src = "blake3:8c9a5308fe32e0523a6e1ae654f5f809e660b02ed9ee7ece9ad16fc980ab82c5"
text = "局中的旧衣裳，这两年一直由我随几位前辈料理：当拆的拆洗，当染的重染，质押在外的几件也陆陆续续赎回。最末两笔账，恰在离京之前划销干净。老女房翻检账簿，以扇骨轻点我写就的数目：“丝毫不差，倒像商贾家的女眷。”我回道一条家之人不卖衣裳，只卖旗。她笑出声来，从箱笼里抽出一件截短了袖口的小袖，往我行囊里塞：“海面上风烈，宫中的针脚，切莫让人看了笑话。”这件小袖，我出海当天便穿在了身上。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_08","text"],null]']
src = "blake3:47b052d8ca08af4cd384052e16dfa156ba23de96b1a16982aa7de7215cea8461"
text = "四万十川渡头昔日失过三捆楮皮，渡守被人指着脸骂足了一月。我检遍了靠泊底簿，方查明货物是搭错了船，被卸入对岸盐仓中。此前错赔与货主的钱款，我一笔一笔替渡守讨要回来，如今渡口又重归他掌管。出船这日，他撑着那条赎回的渡舟追至河口，船首堆着满满一筐香鱼干。“姬君一人吃不完这许多，分给众水夫罢！”他声如洪钟，叫整条河面都听得真切。我诵了两句歌致谢，他挠着脑袋划船折返，去出好远犹回首高呼：“归来之时，渡钱免收！”"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_09","text"],null]']
src = "blake3:2f51db36096a7e342bbc6ae5603f1607e7e4053acba729d0cbfc158d69dc5057"
text = "能岛寄来一封书信，出自阿濑宗族之人手笔，字迹极大，言辞却简短：小早上的十八人，尽听一条家的姬君调遣。随信还附来一面过所旗，旗正中绘着个大大的“上”字。出船那天，我命人将其悬于船艉。返乡这数月练船下来，几个水夫早不再唤我“姬君”，径直改称“船头”。我佯作未闻，双耳却烧热起来。阿濑立在栈桥上，望见那面旗迎风鼓满，只道了一句：“歪了。”她分明指着旗说，可我偏还是下意识挺直了腰背。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_10","text"],null]']
src = "blake3:87d9eb746b28dc58ddc33faebce3169a640fec96fa09c628d8d0f78071489381"
text = "我在下田将米盐市价反复打听了三遭，又托付自堺驶来的船只带回当地行情：土佐米价低廉，运至堺便能高出一成半；盐价则恰好相反。账簿首页，我以假名录下第一桩买卖：日期、货品、袋数、进价，外加心中拟好的卖价。母亲看过说字写得太密；阿濑看过道价定得太贪。临行前一日，有位堺商寻至河口，请我顺道代运一船纸张。我报出个价钱，他嫌昂贵；我随口再报一价，反倒比先前更高。他发愣良久，终究应承下来。"

[entries.'["upbringing/families/mio.toml",["endings","c9_mio_ending_11","text"],null]']
src = "blake3:99429dda55bfe556badc40fd8f415a2eb3b55f08ba25338af80a6b6e200ed372"
text = "自若狭前来的行商言道，小滨有位比丘尼因食人鱼肉得寿八百载，至今仍行脚各国。我将这桩传闻录在怀纸上，紧挨着当年于足摺听闻的补陀落船掌故。两桩事相隔半个日本，我却总疑心说的是同一片大海。出船那日，我未依母亲所嘱先向东赴堺，反教船艏转向正南，绕至足摺岬外海，在金刚福寺底下泊停片刻。海浪涌动，寺中撞响三声钟鸣。我面向南方海天吟诵一首歌，众水夫静默无言。阿濑说，那边空无一物。我答道，那便去瞧瞧这空无一物之处。"

[entries.'["upbringing/families/mio.toml",["paths","mio_path_1","description"],null]']
src = "blake3:7f6f9bb262e731bf4326d552937485ba233c023479f9e7e31ab8cf94b8069569"
text = "能岛老水夫同幡多渔家子弟挤在一条小早之上，尽听你发号施令。护卫堺的商船绕过足摺岬，于内海同海贼争夺航路。阿濑授与你的潮候须记得比旁人更精熟：双船接舷相搏的当口，海潮往何处流，战局便往何处倾。所需付出的，是掌上厚茧、周身伤痕，以及再也无缘上身的那条绯袴。"

[entries.'["upbringing/families/mio.toml",["paths","mio_path_2","description"],null]']
src = "blake3:aa51e11a7335fbc7261797c97501029640a795e53372e577ee95e8676eb4bc41"
text = "土佐的米、堺的纸、内海的盐，价钱隔过一道海便大相径庭。你点钱麻利，与堺商议价决不先松口，手上更执有能岛的过所旗，内海诸船主见旗方肯解囊。行此一途，小早舱内载满货物，账簿厚过歌稿。京中只怕有人要摇着折扇评说，一条家的姬君做起买卖来了。"

[entries.'["upbringing/families/mio.toml",["paths","mio_path_3","description"],null]']
src = "blake3:5c3ea314796252117f21b3a245b88b53a65eec65dec494299ae844ce36d866b1"
text = "宫中穷困得连漏雨殿顶都无力修葺。你怀揣女房奉书与一首歌，乘着自家小早奔赴各国大名城下：筹募修缮献金、代人周旋官爵，并引荐飞鸟井家的蹴鞠之艺。笔墨与歌辞便是你的门道。而代价是在他人厅堂之外久跪候见，倘若一言有失，折损的便是宫中颜面。"

[entries.'["upbringing/families/mio.toml",["paths","mio_path_4","description"],null]']
src = "blake3:6bc6eb7e0b3de254ae06b581e8c3ec438602de694b220ff3167924de23f5b3fb"
text = "足摺岬以南横着一道幽黑湍流，老船头唤作黑濑川，海图上那片水域向来空缺。听闻某些船只离港便没打算折返，舟中之人亦复如是。行此一途，须将潮水识到无人敢至的尽头，启航前还得依着方位踏一遍反闭步法。所付出的代价，兴许是此生再也返不回下田。"
