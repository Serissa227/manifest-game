[entries.'["upbringing/families/mio.toml",["activities","c9_mio_court_duty_1","description"],null]']
src = "blake3:19f2d9844ef8ff4d1d5fc8e5f4f30bcea7046852a90b8e9494804f04e85ed73f"
text = "在老女房的局中打下手：奉香盒、研墨，依分寸卷起御帘。敬语稍错一字便被喝止重来，一跪便是双腿酸麻。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_court_duty_2","description"],null]']
src = "blake3:9dd272c42f5cc16d299f4f452dd8b1f744b57382232ac815edcb519cfff3c7ae"
text = "值夜时，替典侍将《御汤殿上日记》的底稿誊清：当日茶饭、赏赐与访客，一概用假名录下。墨迹不可洇开，错一字便整纸重写。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_court_duty_3","description"],null]']
src = "blake3:23e739d0aaab0dde1ef24273380b3781ca539c858952dbad82464a39af83520f"
text = "代上臈筹办一场岁时仪典：定座次、筹备赏赐用的绢匹，还要打发来讨官位的使者。若有疏漏，受训斥的便是整个局。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_home_walk","description"],null]']
src = "blake3:ebc3e008716d6f7ecc7ac5878c4648e21a365ff21d6b4097100c684e23be0903"
text = "拣一人作伴，去下田的渡头、集市或是铁匠铺走一趟。河口泊的船改了旗号，市面上的鲣节起落了价；同行的人不同，眼中所见也跟着变。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_incense","description"],null]']
src = "blake3:ac92fe56872e37d4844b794999dc811ca9d1565a5fe01ab69b271efb3c57c584"
text = "习闻香之道：将香木切作米粒大小，置在云母片上细熏。伽罗、罗国或是真南蛮，但凡辨错一味，便得从头那一炷重闻。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_kemari","description"],null]']
src = "blake3:b8604dbf24694a755e0ef891f0013d8df921f757b45d241798344e52808ac2a3"
text = "鞠场四隅植着樱、柳、枫、松。循着飞鸟井家的法度练脚背接鞠，鞠不可坠地，袴脚亦须齐整，一场踢下来满身是汗。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_sail_toll_1","description"],null]']
src = "blake3:9eed8237ef5b39f06f4e0cd1a5e511653f346393b6fea4fe7b88aaedad9bfc14"
text = "随阿濑登临往来的船只，看她亮出能岛的名号、收妥帆别钱，我则执笔在木札上记下船名与钱额。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_sail_toll_2","description"],null]']
src = "blake3:b6ff6c441d73dce959c9d4b825775eab8f9a04c7031b189fde679996a42cf743"
text = "独自摇小舟贴近商船，验过过所旗，再按帆数计钱。船主若嫌索价高，便得谈到他肯解囊为止；但凡短收一文，回去少不了挨训。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_sail_toll_3","description"],null]']
src = "blake3:6a780728b7d05f23e4ce0b58ad60da49f2addaf784ebcafd4bad88975d770dcf"
text = "独守下田河口。每日十余艘船进出，谁纳了钱、谁还赊欠、谁悬着假旗，账目一应由我掌管。虽辛苦，进项却丰。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_sutra","description"],null]']
src = "blake3:c7f3bd0aca32dc4154e0b8197485dd75213fed8ab20e76023f7d6e1cd2ab9e85"
text = "于宝镜寺经堂内抄写经卷，并随众尼一同跪诵。行行墨字须写得匀停，笔锋不可颤抖，久跪下来双膝尽凉。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_temple_sutra","description"],null]']
src = "blake3:fd3bf5832c225e7b7b637d29b4469e16004c749229de4912789cbec6bdd2b539"
text = "每趟备几文束脩赴寺，随住持诵读并抄录《观音经》，一并记下诸家的忌日与法事。既长了学问与定性，手腕也随之练稳。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_tide_race","description"],null]']
src = "blake3:66d0ac37c2728ade60adf61639eadc60a8dbfacd74c56b71f4d0be03270717aa"
text = "于下田河口同渔家小舟竞渡。四万十川水势外涌，海潮向内倒灌，须先辨明哪一处水流回转。一趟划罢，掌心磨出了水泡。"

[entries.'["upbringing/families/mio.toml",["activities","c9_mio_water","description"],null]']
src = "blake3:5cd0177face318b1f2798ce1812db340dca21fdfbac485fd2da00528efba1390"
text = "阿濑领我去到河口外的礁石旁：闭气、踩水，潜入深处摸取海底石块。寒冬亦照常入水，爬上岸时冷得牙关直抖。"

