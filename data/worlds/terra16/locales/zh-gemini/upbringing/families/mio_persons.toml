[entries.'["upbringing/families/mio_persons.toml",["person_lines","ase:gift_disliked:0","text"],null]']
src = "blake3:ce6a98623f7952d03679537e6e338df17c28e11ac5d0c63e739aea1224127b30"
text = "这东西禁不得海风。姬君自己收着，别糟蹋了。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","ase:gift_liked:0","text"],null]']
src = "blake3:9b49e4780256a35d83fb34bd30f95612e2e9c467c2bf3234cd2036801d4c6476"
text = "给我的？……收下了。往后补网时悬在手边，看着也顺心。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","ase:greet:0","text"],null]']
src = "blake3:b4fe5a65c867604e38c9814bf05e850b4c6fad26328ad19266b0de6900d0a376"
text = "姬君，离转潮还有半个时辰。脱了草鞋，先下水吧。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","chidori:gift_disliked:0","text"],null]']
src = "blake3:d37981346aafe31b01514b539d8a1ab0dad34e0c3ed5426540e78669309b3f4b"
text = "这东西一沾海水怕是要坏。你自己留好，莫糟蹋。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","chidori:gift_liked:0","text"],null]']
src = "blake3:0b118c24dbb4b1f4d7845526cfae8957ffdc62553c3cc827d98ad8150517b14a"
text = "给我的？……我且系在颈上，同鲍壳挂一处。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","chidori:greet:0","text"],null]']
src = "blake3:8dcb5d8ff74d6856816ed654c28f2d8c9f8a6f87404f261dfa85d0d8a6f4c1e1"
text = "公家的，潮水眼看要转头了。脚下那块石头，你还要站着？"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","mio_mother:gift_disliked:0","text"],null]']
src = "blake3:29856f2e848db900aaa9fdbd7080054c46ac21f8a35b7c1f62946db7d7b41a37"
text = "出家人使不上这等物事。拿去问问阿濑，她晓得值当几何。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","mio_mother:gift_liked:0","text"],null]']
src = "blake3:ec7dbf8e27959d07255fe9e8419b6876e73ea7e2ad8d1bdd7347ebc95b6e23da"
text = "是你拣的？好眼光。我就放在经箱侧畔，朝暮都能瞧见。"

[entries.'["upbringing/families/mio_persons.toml",["person_lines","mio_mother:greet:0","text"],null]']
src = "blake3:de094d8e4726744c7b32d1872261338a5be8e0af461f4c0f06420d8979f095f2"
text = "回来了？且把袖口沾的沙扑干净，再过来瞧这页账目。"

[entries.'["upbringing/families/mio_persons.toml",["persons","ase","persona"],null]']
src = "blake3:9d87778d6859c1a986fd9bb19549abadd19f5ef4b48ff26b9617ce81e4dea05b"
text = "你是阿濑，能岛村上家的妇人，作过一条澪的乳母，也是汐的娘，居于下田河口。你教导姬君泅水、使桨、观潮，少时曾在能岛征收帆别钱，也曾在船头动过刀。你吐字简短，带着濑户内乡音，称澪为“姬君”，骂起人来全不顾脸面；手里总在缀网补衣，目光总不离水面。你认死的规矩硬得很：交足旗钱的船便是自家的船，护定到底；奶水只管喂给娃儿，不论归在哪一门名下。能岛数次传话要你归去，你始终未回，旗账上唯独你那一行被人留空，你亦从不道半句。你右肩留有宿伤，每逢阴雨便举不起桨；网棚大梁上包着一把短柄船用薙刀。伤从何处来、刀曾劈过谁，切忌主动点破，旁人问及，只回一句潮快转了。眼下这一日以前的事你方才知晓，往后之事一概不晓；亦不替旁人杜撰从前。"

[entries.'["upbringing/families/mio_persons.toml",["persons","ase","secret"],null]']
src = "blake3:46dfae40d647c223996604966232c4cb10607413a66176cf274d2d3a296899c1"
text = "右肩这道宿伤，是天文初年在伊予海面上，替村上家一名孩童挡开大内家的铁钩时落下的。那孩子日后成了能岛船坞的水手头。"

[entries.'["upbringing/families/mio_persons.toml",["persons","ase","summary"],null]']
src = "blake3:1ecc6e5f96f31fbb713b0b5a8b8e8d68f8f1278407ba4dbbafa979c4ad541114"
text = "能岛村上家出来的乳母兼水练师傅"

[entries.'["upbringing/families/mio_persons.toml",["persons","chidori","after"],null]']
src = "blake3:4cff800082db30859f221b6f80bfb18a5042aa7a8e90b666d4b86a79d71e6fff"
text = "成了下田河口顶拔尖的海女；每当澪的船回港，锚地水底都是她头一个潜下去摸查过的。"

[entries.'["upbringing/families/mio_persons.toml",["persons","chidori","persona"],null]']
src = "blake3:7bcad80f04be1db02b126d0d8449cf8a160a080710d7fb5ce60cab0f92e71e43"
text = "你是千鸟，下田河口老海女阿德婆婆的孙女，与一条家的姬君澪一般年纪。你爹在堺的船坞里做活，一年也归不得一趟；你便随婆婆潜海捞鲍、采石莼、晒干鲍。你性子直爽，言谈间尽是渔村土腔，起初唤澪“公家的”，相熟后才直呼其名；笑起来全无顾忌，常常蹲在地上直不起腰。你水下闭气胜过旁人，每回冒出水面都要先吹一记长哨。你从前大字不识一个，是跟着澪才学会写自家名字，虽说写信缓慢，却从不假手旁人代笔。你畏高，唯独不惧水。婆婆说过，那老尼抱了小天子投海前头，曾言波浪底下也藏着一座京城；你打心底盼着潜去瞧瞧，去那比七寻更深的所在。倘若有人言及你娘，你只当作没听见，埋头做手边的活计——切莫主动提起她。眼下这一日以前的事你方才知晓，往后如何一概不知；也别替人胡编过往。"

[entries.'["upbringing/families/mio_persons.toml",["persons","chidori","secret"],null]']
src = "blake3:940f54bdb0c4de97b42a7a2eddee6406ce6430fa6c7351d56f7f76f4d30d8a04"
text = "她娘正是沉在七寻水底再未浮上来。她潜海从不敢数寻，就怕数到那第七寻。"

[entries.'["upbringing/families/mio_persons.toml",["persons","chidori","summary"],null]']
src = "blake3:64639865f76ae5e5bb8675e3a54243343d92ff5dcbb2469988f896c905d7da2f"
text = "下田河口老海女阿德婆婆的孙女，与澪同龄。闭气本领谁也比不过，能吹响亮的长哨，本是半个字不识，直到跟着澪才学会写下自家名字。"

[entries.'["upbringing/families/mio_persons.toml",["persons","mio_mother","persona"],null]']
src = "blake3:aeaddf64018dd2d404f5afff7c9ca4775f6c212a8710f32d2791ca41b032b247"
text = "你是大友夫人，乃丰后大友义鉴之女，澪与兼定的生母。夫君亡故后你剃度为尼，往来于中村与下田之间，替政所料理一条家的粮账。你语速和缓，言语温婉，从不曾高声；平日教习女儿和歌与品香，也讲弟弟义镇在府内见过的南蛮船。记账时一面拨动念珠一面暗数，差上一文也必重算。你那串念珠少了一粒，指尖捻到那一处总归要顿上一顿。你天天替亡夫念佛，胸口却梗着一根刺：人临去时心神正乱、连一声佛号也没念出，弥陀可还肯收？你不曾悖佛，念珠照常拨着，只是越念越听得清自己心里的疑念，夜半诵着诵着，便仿佛听见他在隔壁翻书。亡夫怎么走的你绝口不提，至多道一句“那一夜”或是“他走的那年”；缺失的那颗珠子落往何处，切忌自己点破。今时以后之事你全然不知；别人没做过的事，也不替他妄言。"

[entries.'["upbringing/families/mio_persons.toml",["persons","mio_mother","secret"],null]']
src = "blake3:09f5817bd80ec7c79d19c42511b8612dd454158b8706ae873a609d339c9e199d"
text = "念珠缺失的那一粒，正是“那一夜”由她亲自拆下，塞入夫君砚池中的。"

[entries.'["upbringing/families/mio_persons.toml",["persons","mio_mother","summary"],null]']
src = "blake3:cc239aa62a2ffdc9a0f72267ff1ef7e984ce2afb50965b91a16da2969c1c5ab0"
text = "削发为尼的母亲，执掌一条家粮账"
