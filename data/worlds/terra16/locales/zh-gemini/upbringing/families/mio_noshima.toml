[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_06:event","text"],null]']
src = "blake3:d94e5a798b3104ad999eae8ee4ef0cd8ecc85beee003e15a9f42dbab96322904"
text = "刚上能岛的第二天，天还没透亮，又四郎就把几个新见习踹了起来，赶到泊位点名。念到我，他省去姬君二字，张嘴便是“土佐的小鬼”。按规矩，见习头一年得自带口粮。可我从中村运米和箱笼雇来的荷船，却死活泊在对岸大岛的宫洼浦不肯开——掌船的是个堺人，冬天没走过宫洼濑户，嫌水面翻得像开了锅，加多少钱也不肯摇过来。又四郎蹲在木桩上剔牙：“米不到，你便去和海鸥抢食。”鹰丸抱起胳膊站在一旁，就等着看我拿什么法子。草棚那口米缸见没见底，大伙儿心里都有数。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_06:remedy","text"],null]']
src = "blake3:09d7e5f0506e697d9edbc69e5a7f33bb302aaa2cfbdb50be37d225561097ec7c"
text = "米终究是运上了岸，可这七日总觉得是白白欠下的。我找出离下田时阿濑塞给我的那块木札，上头刻着她叮嘱的功课：每日看一回水、记下水位、打齐三种绳结，半点不许偷减。在能岛，海浪就在通铺的木板底下拍着，可头一年的见习严禁独自出泊位。我点清袖子里的散钱，顺势望了望岬头那块了望岩。鹰丸恰巧路过，斜眼瞥见木札：“这刀法是阿濑的。那你可逃不脱。”"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_07:event","text"],null]']
src = "blake3:9c8b9ff47699d23b9494fa5b488965d1aba56a824d7511a024c7a2ee9644dab5"
text = "开课还没几天，又四郎就往我脚边甩了一捆杂物：两幅补丁叠补丁的烂帆，一串起下来的铁锈钉，外加半桶炼过的鱼油。“拿去卖给停靠的行商，换回桐油跟麻丝。开了春要捻船缝，坞里如今半个铜子儿也掏不出。”早先在土佐我就听闻村上家靠收帆别钱进项阔绰，哪晓得自家船坞竟寒酸到变卖破帆。那条小早还搁在木墩上，船板缝咧着嘴，专等人去堵。我拽着这捆破烂下到海滩，鹰丸尾随在后头：“行商瞧你面生，准得狠压价钱。”才踏上头一条靠岸的商船，那船主搓了搓帆布，朝我竖起两根手指。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_07:remedy","text"],null]']
src = "blake3:f8a6a3bf4a407cb00d58664a1333cb8fbe1203e1a6a775a982a6eb5bc5f371d0"
text = "那点桐油耗了十日便见了底。又四郎从此再没支使我跑腿，差事尽数派给了旁人，留我一人干坐在草棚里，宛如一条卸了帆的空船。鹰丸瞧着碍眼，把那两幅旧帆重新拽出来丢到我跟前：“一趟没脱手，便再去跑一趟。”泊位上的人照旧唤我岸上的，小早的板缝照旧咧着口子。往年在下田跟堺商议价，对坐的皆是年年打交道的熟客；能岛门前歇脚的过路行商哪里认得我是谁，眼睛里只瞧见一个好欺生的新见习。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_08:event","text"],null]']
src = "blake3:d68c35c1c34b90332f631511467a851a5b071caa29c92c126f84bc58efb545b0"
text = "快入梅时，一艘西去的堺船在能岛门前候潮，捎来了兼定厚厚一封信。二月初一兼冬大人不在了，才二十六岁——这音信开春便传到过岛上，信里写的都是往后的事：各国的回书一封封递回本家，中村的政所，丰后舅舅那边，还有几家我连名字都没听过的大名，保子大人一封也未拆完；本家还能执笔的，只余下抱病的房通大人。兼定的字写得歪歪斜斜，最末一张纸却不是他的笔迹：那是去冬兼冬大人动笔写给我的，并未写完。起头一句问着土佐的潮：“听说那边的海，一日要涨两回？”往下便空在那里。旁侧有兼定添的一行小字：保子大人说，百日那天，佛前得供上一首歌。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_08:remedy","text"],null]']
src = "blake3:bdda5e01fedae68f3728121d9a06d641d872c227c5b312b9b2118159140a5df5"
text = "兼定又递来一封信。山科言继大人替房通大人诊过脉，吃茶时顺嘴提起：他在别家见着了本家的回书，板板正正，一首歌也没附，活脱脱是官府的公文。保子大人隔着帘子未曾搭腔。百日忌就在十天之后，佛前该供的短册依然空着，东行的船五日后方才有一艘。我坐在通铺窗下，把那张问潮的半截信重新摊开。外头正值涨潮，水头一下一下叩着地板底下的木桩。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_09:event","text"],null]']
src = "blake3:3595e924f64136f1d96c3b2404b06c3f7eec96c27c1496497fee00ae633014bb"
text = "我十四岁这天，又四郎破了例，给了半天假。傍晚，我坐到泊位的桩子上，鹰丸就蹲在旁边剥枇杷。枇杷是因岛来的见习打家里捎的，他剥出一个递给我一个，问道：“你以后打算做什么？”早上刚送来两封信。一封是京都的保子大人寄来的，言辞婉转：宫里的门还没合上，典侍国子大人仍记着我的字，若是肯回头，再过上几年照旧能做女房。另一封是母亲寄的，写了一首歌，道是中村的稻秧已经插下去了；阿濑只托人带了一句话：下田的小早还卧在船台上。鹰丸剥净了最后一个，等着我回话。我含着一瓣枇杷，望着濑户的水一圈接一圈打着旋。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_09:remedy","text"],null]']
src = "blake3:117449e4f5c5dba6ae0509cd719a4ad1722932af26b76f35523f947b304e5918"
text = "信还在半道上。这几日鹰丸又问过我两回，哪回我都答不上。夜里合不上眼，我把从土佐带来的那册潮记找出来翻看——里头是听阿濑口述、我小时候拿假名记下的下田河口潮水，写着哪月哪日几时起涨，字迹歪斜，活像虫爬。翻到后头才发觉还空着几页：那年嫌记潮繁琐，我到底没记完。地板底下的潮水正往上涌，一下接一下敲着木桩，倒像是在说，纸上空着的那几页，它可一日也不曾停歇。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_10:event","text"],null]']
src = "blake3:4a73c88685377c2f613b384989532132fc74b661bfa9e000c94d3615ba7985da"
text = "第二年开讲前，岛上夜长，通铺里又不许点灯。我本想趁这几日把木柜里的旧潮图誊抄一遍，偏偏整座岛入夜后，只有岩间的龙神祠还亮着——那盏灯是替过濑户的夜船照路的，通宵不灭。我抱了潮图去求扫祠的阿兼婆，她不让我进门，先递出一本账簿：去年的灯油钱还欠着大三岛油屋，才过年关，人家就将船泊在岬下催讨了。“祠里的灯，烧的可是实打实的油。”她慢条斯理地说，“往年借光的人，都少不得纳上一份。”我翻开那册账，上面记的油价比下田足足贵出一截。往岬下一望，果真泊着条小船，船头的汉子正跺脚取暖，一双眼睛直往祠里瞄。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_10:remedy","text"],null]']
src = "blake3:1d2cab1a4e23dc10e69b12eed705b306953917dee5a45ebf15dac588045d7dc3"
text = "入夜后，祠里冷得连自己呵出的气都清晰可见。我挑了离灯最远的门边坐着，潮图上的数怎么也辨不清，只得把纸凑近鼻尖。阿兼婆打我身旁经过，说起今年的油又涨了，前天大三岛的船又来过。她看都没往我这边看一眼，可我心里明白，这话正是冲我说的。这处地方本就是又四郎拿一句话换来的，我自己一文没出，话也没说过一句。往通铺回去的路上，岩缝里的风直往袖口里钻，冷得我直缩脖子。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_11:event","text"],null]']
src = "blake3:bb0cab73f34c45f9dffc2d909a5cee43942085d3c0362f4b2af0a737e83b5117"
text = "初夏集日，滩头泊着一排鱼贩小船，其中一条船的行商卖香木，社里按惯例讨来一包。十人围作一圈，闭上眼闻，一炷传过一炷，闻罢将名字写在木片上；分成两组比试，输的那组替下一首舟歌起头。头六炷我一炷都没写错。轮到第七炷，烟气刚入鼻，我便想起母亲经箱里的那块伽罗，提笔就写了上去。待到揭晓，行商念出声来：罗国。我们这组原本领先一炷，偏就折在这一炷上。鹰丸那组赢了，他将木片在手里抛了两下，笑着露出一口白牙：“公家的姬君，鼻子倒也有看错潮的时候。”一圈人全笑开了，我脸上一阵发烫。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_11:remedy","text"],null]']
src = "blake3:14d0a69b55240c380ae426e671fef913ef3b82a0c92a49505a7a9a6d6729fa55"
text = "母亲的回信迟迟未归。又逢集日，滩涂上复又袅起香烟，社里的伙计们一如往常围坐成圈，席间并无我的位置。我蹲在草棚里替又四郎磨刀，迎着风里散过来的幽烟，暗自一炷炷忖度香名，究竟猜中几筹，旁人也无从知晓。鹰丸打门前经过，顺口丢下一句话：“大伙儿都道你那天是思乡心切，才错把罗国当成了你娘的伽罗。”我随手把刀放定。母亲授我闻香时曾叮嘱过，品香讲究静气凝神地去“听”，只顾着拿鼻子去抢，那是抢不着什么的。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_13:event","text"],null]']
src = "blake3:c940a79e83f9e4eb86a08bf9dc9b0edcf567341842004b060378bb4ecd8bd196"
text = "严岛那一仗打完半个多月，岛上人人闭口不谈。那一夜又四郎就在海面上，回来只丢下一句“雨大”。偏巧赶在这当口，兼定寄了信来：房通大人病倒了，夜里咳得整条廊下都听得真切，人累极了，竟脱口用幡多土话唤他“坊”。山科言继大人开出药方，嘱咐连服一月，药价却一帖贵过一帖。掌家的老侍誊了一页账单随信附来：本家存米只够吃到腊月，土佐的年贡船须待开春方至，京城的药铺早已不肯再赊账。兼定在信尾写道：姊上，我该如何是好。我十五岁了。隔着这一片海，摊上这桩事，我也算得上是大人。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_13:remedy","text"],null]']
src = "blake3:7664f1c12ab99f4518e4dca87ce817ca244f39fc77cfa39607300cb2b41611b4"
text = "母亲的复信尚在半途，兼定又寄信言道，药已经断了一日。我攥着信纸在泊位边怔怔出神，又四郎从身后敲了我脑门一下：“论起钱粮营生，岛上比谁家都通透。来往船只哪条爽快掏钱、哪条须得哄着、哪条非吓唬不可，番所的老账房足足记了三十年。”他道要指点我几分：明日他赴对岸问丸处赊些开春填船缝用的桐油与麻丝，教我随行，瞧他如何张口；若不愿去，便出点钱将老账房那本录着各家船主性情的旧账抄买下，自个儿拿回去细琢磨。道罢他将橹往肩头一架，迈出两步又回过身：“吃过晚饭没有？”"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_14:event","text"],null]']
src = "blake3:246e004351c9dda1599a6d00c56ec9f361dcbf34a786e12469912fb8dbbccd0f"
text = "开讲之前，一封由保子大人寄来的信随堺船抵了能岛。说是御所屋顶漏了三处，修葺的银钱尚无着落，宫中打算向诸国大名颁送女房奉书恳请献金，名录上正有丰后的大友家。“奉书交由国子起草。你虽不在宫里，到底还是大友家的外甥女。随附在末的那首歌，若出自外甥女之手，读信之人心中分量总归不同。”她言道能岛的船西去府内，较之京城近便许多，故而奉书先寄往岛上，待我附了歌再行转递。信末唯有一句：写抑或不写，全凭你自定。奉书抄本与一纸淡红薄样纸摊展膝头，我在龙神祠的灯下研了三回墨，终究一字未曾落纸。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_14:remedy","text"],null]']
src = "blake3:232a08a0e863322b59f33857e4ec80949ed09003c08b94dbacbb8b3268c60ea2"
text = "奉书启程十日，中村犹无音信，保子大人的来信反倒先至。信中夹着一沓旧奉书的抄本，皆是历年宫里向诸国求取献金的底稿，出自数位典侍之手。“哪一封募得了银钱，哪一封落了空，国子胸中有数。”她在信上问道，“你瞧得出来么？”草棚内寒气透骨，手冻得几乎攥不住笔杆。我须择一桩来办：要么向泊岸的行商购一刀佳纸，依着这些底稿逐一唱和寄回；要么趁这几夜守在神祠灯下，把这一沓一字不差地誊录完。又四郎恰打门前走过，将一块破布裹着的热石头朝我脚边一踢，随即便把双手拢回了袖筒里。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_15:event","text"],null]']
src = "blake3:8a18c86bb9d33688e30b57c7c34b13540ecfdac18c426d5692b6e1e3a41a2261"
text = "兼定这封信写得极长。房通大人召他到病榻前谈了整整一下午：今年入冬以前，他便要回中村去。他如今十三岁，信里写嗓音正开始变粗，“说一句破一句，姊上听了定要发笑”。归返土佐的一应行装，他想托我替他张罗：书箱、铠柜、一条家的旧文书，外加随他赴京的十来个家臣。打堺开船，穿纪伊水道，绕出室户岬，顺着土佐的岸线一路向西——这条水路我一遭也未曾走过，只在能岛的潮图上一段段临摹过。这回乘船的可是土佐一条家的当主，万一出了岔子，任谁也赔不起。信末另附着一纸清单，起头第一行写着“鞠”：这一件也要带上。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_15:remedy","text"],null]']
src = "blake3:7d5622c076df06fd270d1869e5932cd47dd3cd91f406bbe0866a25bbc70cc725"
text = "下田那边迟迟不来回信，算算日子信使这会儿兴许刚过佐田岬。鹰丸听罢我的难处，只丢下一句：“船上的事，只管去问船。”他说要么破费买趟东行的船位，一路跟着盯人家怎么装舱；要么去泊位给船家搬运货物，人家的嘴才肯松动。泊位上的老船工见一个见习蹲在码头边，全都当我是来躲清闲的。我在栈桥边生生蹲了一上午，瞧着一条条深浅不一吃水的船穿梭濑户，脚踩着的木板叫太阳炙得烫脚。怀里还贴着兼定寄来的单子，上面那个“鞠”字已被汗气洇开了些许。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_16:event","text"],null]']
src = "blake3:792e4ab616a919ff02a928a8d6ecc7d812e436400ed1952ce868e85c430e55cf"
text = "最末一趟归省，船才擦上下田的栈桥，政所的源康政大人便拍了板：过了年开春，河口那条旧小早就拨到我名下。紧跟着送来的十八名水夫名册里，半数乃阿濑打能岛请来的老水手，里头有两人我在船坞打过照面，至今还笑话我头一年抛缆绳、连续三回把绳头甩进水里的丑态；另外半数是幡多本地的渔家后生，才照面第一日，两伙人就为着谁来掌舵吵翻了天。银钱更是全无着落：政所统共只批了米和盐，水夫的工银、修补船板的铁钉、沿途的关钱，一概得由我自己周转。母亲往我桌案摆了本空白账簿，手里捻着念珠转个不停：“船上的进出账，自今日起头记。”阿濑缩在栈桥上补渔网，眼皮也不掀一下：“姬君，先将人马归置妥当。人心不齐，船可出不去河口。”"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_16:remedy","text"],null]']
src = "blake3:9b4710d822a1e00b1b2d5c3068a75621e0925e34426ba5338e5ec5570d406bb2"
text = "赌气走掉的那两个，头一个是渔户的嫡长子，另一个偏又精于修船。秋风吹得一日硬似一日，返往能岛的船期眼见没剩几天，末一年的结业大考还悬在岛上等着我去应。母亲召我至经箱跟前，一边捻着佛珠一边提点：那两户前年曾向一条家借过谷种，这桩旧情面还在，只是该有的礼数亦不可废。阿濑的话倒挑得更直白：“径直往他家门坎上坐着，坐到他肯露面为止。”那两户人家全散在四万十川上游的村落里，跑个来回就得耗掉大半日工夫。我把这些年攒下的银钱哗啦倒在案几上，反复点过两遍，只听身后拨动念珠的声响登时停了。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_noshima_critical_17:event","text"],null]']
src = "blake3:7b7d3d36f153073624422b3264d118bf8a2e19d2ae0c5300a34bd59535aa965b"
text = "结业一过，岁末便是离岛的日子。又四郎将架上那支被我刨得太细的桨取下，说就留在船屋里，往后谁来便给谁使。收着潮表的木柜中，我三年的潮簿已经编好了号，同大永年间那些泛黄的挤在一处抽屉里。按社里的旧例，人要走总得办场小歌会，地点就在晒网的院子，网底下架一块旧船板权当案几，题出的是“扇”。我自袖中取出桧扇，扇骨上的歌是去年七夕在泊位旁写的，挨过海风，墨迹早已发灰。鹰丸坐在对面，膝头的短册还是一张白，大冷的天，手里那把破团扇倒扇得飞快。龙神祠的老神主坐在上首作判者，不论是谁的歌，他都要念上两遍。"

[entries.'["upbringing/families/mio_noshima.toml",["chapters","c9_mio_route_offer:event","text"],null]']
src = "blake3:ea3c6cb12959d1f1696d987bf2cccf69b6e134bd7740060785235e955aa1ec68"
text = "等北风吹起来，能岛的关船又一次靠上了下田栈桥。鹰丸抢先跳上岸，脚板还没踩实就冲我昂起下巴：“听说你要上京，进宫里学走路？”他比盛夏那会儿又黑了一层，手背尽是拉缆绳磨出的白道子。入夜阿濑在灶旁温起一壶酒，才将他捎的口信说完：能岛船坞的水手头开了年要收几个见习的孩子，辨潮、划橹、修小早，一学三年。“纵使不是船家子弟，只要村上家肯写引荐，照样收。”阿濑目光落在灶堂跳跃的火苗上，“姬君若有心思去，这封信我去讨。夫人那边，由我去回禀。”此刻广桥夫人的回函仍镇在母亲的砚台底下，信上说着：开春之后，宫里自有人等着品评我的字。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:defer","reply"],null]']
src = "blake3:d677105bc14c9719d6c8f41ed2fb8816f721afc233e83158fa08b90050d15a43"
text = "我自知过不了濑户，只好央求鹰丸代我去同又四郎通融。他横了我一眼，到底还是去了。我窝在草棚里跟老见习学结缆绳，十指勒得发青发紫，视线却老往海面上飘。又四郎硬生生拖到第七日才派船过去拖带，等米上岸，里头已沤潮了一袋。入夜后通铺里传来几声嘀咕：土佐来的姬君，到头来也就会个干等。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:defer","text"],null]']
src = "blake3:8c8cffe518205ba0a5fd4b597e8da9e48301407cb120e61bef850d1c2b93fdc5"
text = "托鹰丸向水手头求情，自己先学结缆"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:growth","reply"],null]']
src = "blake3:5cc84ce244b0a72d6ce9923e6dbf133dd6695c677c73bf3ee3b56a7107bf5ae4"
text = "我从泊位讨了条小早，掐着早潮刚歇的当口，独自摇船横穿濑户。米从荷船往小早里倒，每回只敢吃半舱水，来回折腾了整整四趟。末一趟潮水已经改了向，水流撞得船头直打横，我拿死力压住橹柄，才算贴着岬下的暗礁蹭回泊位。掌心磨出的血泡一碰便破了。鹰丸蹲下身把米袋清点了一遍，一袋不缺，半句没多说，起身走开了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:growth","text"],null]']
src = "blake3:56c1b9e17ef51539e4cde3fdb1c78ad545c89191f9115143e8d0cae400265127"
text = "借条小早，独自摇过去分装"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:skill","reply"],null]']
src = "blake3:104200c11dd763b67a34c181d4d78b195aa0f18096626396a69337f4eab11f5d"
text = "我照阿濑教过的法子掐算了一遍月龄：再熬四日便是小潮，届时濑户水流最缓，平潮能歇足小半个时辰。我便托过路的渔家往荷船传信：到了那天辰时末，见能岛岬头摇白布就开船。果不其然，布一挥动，荷船慢悠悠地滑了过来，船底下的水面平展得像铺了张席子。船头踏上岸一个劲抓头皮，叹道跑了二十年海路，还是头一遭有人替自己算准时辰。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:skill","text"],null]']
src = "blake3:0954459baf87041ec8b9b3027980df117c1c02dbce78803153166e6f1099ab8a"
text = "算准小潮平潮的当口，叫荷船跟着过"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:standing","reply"],null]']
src = "blake3:3b647b63e0a8c9ba08ed075d1a3adcdb1ff2fef40fa6039a91bf4d895f7991fc"
text = "我怀里揣上离下田时阿濑给的那面旧过所旗，径直下到岬底的番所求人。番所里坐着的老丈捏住旗角端详半晌，一眼认出缝在上面的印记，只问了我一句：“濑家奶大的那位姬君？”说完立刻调了两条小早，一前引一后拖，把荷船拉过了濑户。风声比米袋早一步传回泊位：土佐来的新见习，头一日便能请动番所的船。又四郎听罢，鼻子哼了一声，便把我的叫法从“土佐的小鬼”换成了“濑家的小鬼”。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:event:standing","text"],null]']
src = "blake3:d867e8177c100dd5df3497935ba915e2bbd805ef325f004e3d6526d9a8c705a8"
text = "揣着阿濑给的旧过所旗，去番所请船"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:remedy:pay","reply"],null]']
src = "blake3:3c84c52a791e60231446e09496b0ab4cdc5d9008db3b84033a468ae87eac7b81"
text = "我把散钱全数给了泊位上一个摇了一辈子橹的老船家，求他带我跑一趟濑户。他的船载着木柴，吃水深，每到转流之处便收桨，喊我低头看水。我照着他的法子学：水面泛细皱的，水底必藏着礁石；鼓起像一面镜子的，乃是暗流在底下翻身。一整日跑下来，木札的背面也叫我刻满了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:remedy:pay","text"],null]']
src = "blake3:3a845afc4ddbd25befe3b97e28dcdbca570c97fe68f55f76fa142d60a9788b4b"
text = "拿钱请岛上老船家带我跑趟濑户"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:remedy:work","reply"],null]']
src = "blake3:6a79e030987088983091672180403c42b566faae639f2f64954dc1a1b4aedd27"
text = "我照着木札上的功课，每日破晓前摸上岬头的了望岩，往石缝里插进一根竹签标出水位。海风冻得十指僵硬，守岩的老水夫匀了半件蓑衣给我披着。等石缝里插满十根竹签，里头的门道我看明白了：宫洼濑户的海水每日东进两遭、西退两遭，可日日总要错后些许，而那错后的工夫，恰巧就是月亮迟出来的一截。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_06:remedy:work","text"],null]']
src = "blake3:5bd11a5b8300774f3f2d16aa2e29dbb38d3c3519d17052b60cb6c8c26b1759d6"
text = "依阿濑留的木札，每日登了望岩标潮"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:defer","reply"],null]']
src = "blake3:9cdc748f983dbc98ccb55f6229051896f8ef8b405f7fee4a874e7f2765527e82"
text = "我胆怯没敢同船主还价，拽着那捆货折回草棚，改托鹰丸去向管账的老丈挪借点钱。他口上应着小事一桩，却折腾了三遭才讨来些许，整张脸憋得通红。桐油总算买回来了，那堆旧帆只得原封不动交还给又四郎。他半个字没吐，把帆卷巴卷巴塞回了船屋。我将帆布、锈钉还有船主伸出的那两根手指头，一笔一划全刻进了木札。次日整间通铺都传遍了：土佐来的姬君，竟连一桩小买卖也议不成。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:defer","text"],null]']
src = "blake3:3969e01742348dbf44639ece16f20c4ed0a3f410396d57b846bf041fec5b2803"
text = "央鹰丸找管账的老丈挪钱救急"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:growth","reply"],null]']
src = "blake3:9c2d5cf25ada4f080f54e28e5c4e7a6e396dca275c90ed5194435a4df7ce2e45"
text = "我没接他的话茬，拖着东西接连又踏上两条商船。第二家看中了帆布，第三家只愿收铁钉，各家报的数额竟差着小半截。我折了根炭条在船板上抄录下三家的行市，折回第一条船摆到那船主眼前。他嘬了嘬牙花子，到底又多竖起一根指头。桐油与麻丝如数换齐，手里还多出几文零钱，我分文未动交予又四郎。他眼皮都没抬，直接揣进了腰带里。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:growth","text"],null]']
src = "blake3:61b1ed51d99dd2bb705f74a41ebf4b6289d9b7e873cb8181a7f286eba5f80e40"
text = "跑足三条船比一比价"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:skill","reply"],null]']
src = "blake3:141b79c9492c8c0daa108afcc30b2806ffe42a96456ff4dd29b048d35c1c6e20"
text = "我同他讲：这布料乃是从村上家小早上卸下来的，早先挂过过所旗，东行的船家买去打补丁，将来穿濑户时番所的人一眼便认得出门道。那船主却死咬着破帆便是破帆。我干脆跟他立约：今日你先把价加上去，下趟你的船打能岛门前过，我包替你拣一个不必苦等的顺潮时辰。他捋着胡须盘算了半晌，终究松口添了价。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:skill","text"],null]']
src = "blake3:43baf9a275abfe4a246bca4e8aeffb5d622d4491353210ea16908d43b8e3775e"
text = "同船主磨到他松口添价"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:standing","reply"],null]']
src = "blake3:4decb3512f4dbf70605cbe92789c84fb4b055698be4cafec4c02bf0a1d8f9bdd"
text = "帮一条家往堺运木料的土佐船，每年开春例行要在能岛外头纳钱候潮。我赶去番所一打听，恰巧有这么一条泊在岬角底下。那船主一眼认出我就是当年在下田点收帆别钱的姑娘，笑眯眯地随我走到海滩上，没说上几句话，行市便给抬了起来。不出几日，泊位便传开了风声：土佐来的那个见习，在过路客商里竟说得上话。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:event:standing","text"],null]']
src = "blake3:796bc81fbc945f132b225a27d92ac2af1dc2e2067640597af3221186da2cad4c"
text = "请土佐运木船的船主替我作保"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:remedy:pay","reply"],null]']
src = "blake3:c35d841e00f9fdd337b397b9bb7d2bc0f531385a56d6ef15d1cedc902131a48d"
text = "我掏出攒下的散钱，买断了鱼贩小船上那位大婶一整桶杂鱼，请她教我做买卖。她辨铜钱时举到日头底下一枚枚照看，讲起价来比验钱更泼辣：先探来路，再挑毛病，压轴才肯报个底数；何时该让步、何时该抬腿走人，她一边称鱼一边指点，我一边听一边往心里记。讲得起劲时，她还学了个十足像，演了一遭过路公家人端着架子还价的派头，引得我直发笑。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:remedy:pay","text"],null]']
src = "blake3:29baa172d32d3c1149aa62e7ac8c0bdc5d69a2a320c76dceb1d93e704b0d11ad"
text = "买断鱼贩大婶一整桶杂鱼，请她教我议价"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:remedy:work","reply"],null]']
src = "blake3:724da54fc9f9c0b2ee8410f495de7293ab6b4a8ed3b29eaaea38d3e4cb2b8428"
text = "我走去央告又四郎，拣什么苦差使都行。他便指派我去盘点船屋里堆着的陈帆旧缆：哪幅尚能缝补，哪条合该拆散了捻麻絮，又有哪样还能换回几个钱。里头一股潮霉味冲得我连连呛咳，十日下来硬是清出了三大堆。末了他拨出一卷旧缆让我去卖，我与行商软磨硬泡了半个时辰，多挣回些微利钱。他点一下头，顺手把下一捆也抛给了我。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_07:remedy:work","text"],null]']
src = "blake3:298166be7874d20f0be868b375ce906a7b6566ecd6ac1e3f9d870c042fdebb60"
text = "替又四郎盘清船屋里的旧帆破缆"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:defer","reply"],null]']
src = "blake3:b2e86b70e144f989ae9ae0014940f7e3420c4a9fe8e05f9c2c922c90e1d21609"
text = "我单回了一封短信，只道岛上诸事安好，向本家请了安，又说歌待盂兰盆归家再作。封好信，我对着那张留白的纸枯坐半宿，终究没落下半个字。后来兼定写信来，说他独个儿抄回书一直抄到破晓，写到“兼”字时搁过一回笔，那是兄长把着手教他的字；歇完，仍接着誊。回书全照底稿抄罢，里头一首歌也没附。京中有人言道，一条家的回书，字比纸还要薄。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:defer","text"],null]']
src = "blake3:db608a358500c0f9c361fee98d2909d59f7e8b42663a906c1f5644fc3cba8cf4"
text = "先寄一封报平安的短笺，功课回头再补"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:growth","reply"],null]']
src = "blake3:5f1a7bd561079424b7285db116a1067405a641d884ac96f1ecb2f3b89bc29a39"
text = "我把信贴身揣着，爬上了望岩，从早潮一直守到晚潮。濑户的水朝东涌了一趟，又朝西退了一趟，岩下的海藻随波伏过去，再伏回来。入夜后我给保子大人复信，只挑这整日见着的写：海水如何回身，海鸟几时落下。她的回信隔了一个月才寄到，说都念与房通大人听了，老人家问了一句，土佐的潮水是不是也这般光景。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:growth","text"],null]']
src = "blake3:a511cc1578fb3edf1d0f18f291de0fab0aa8bdf61c1ede9395f36fefd4c1290f"
text = "把信揣怀里上了望岩，替他看一整天潮"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:skill","reply"],null]']
src = "blake3:f335af2c496decae1d986a385ec05133b8bea17ce40dd7d23bb0675f0a350636"
text = "我在那张信纸的留白处添了一首歌，回他问起的潮：早潮推船去，晚潮迎船归，一日两回，都在候人。歌用假名写的，废了三张纸，末了一张才算赶上东行的船。保子大人复信说，百日那天已经供在佛前了；还说往后本家回书里附的歌，我若是肯拟，尽管寄去给她。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:skill","text"],null]']
src = "blake3:06b8ccfa3aa64556321d1ce0f9f8a9da00c5ef2f61f38e58505edc0fc88f33b6"
text = "替那封未尽的信作首答歌"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:standing","reply"],null]']
src = "blake3:9dcf0cffc09213dfeeca8f07fe3dfce018a77f90e5acbf83f3796e8e9ac95a1a"
text = "兼冬大人生前张口闭口都是旧例。我依着母亲从前在下田教过的书札体例，替兼定草拟了几封回书底本：写给大名如何称呼，给寺社又如何称呼，哪几封少不了附歌，全都逐一标在旁侧，托船寄回去。保子大人捧去给房通大人过目，老人家咳嗽着开口：“倒像是兼冬的手笔。”这话后来随本家的信函，一直传回了中村。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:event:standing","text"],null]']
src = "blake3:7e28beb014fb3f9dc9ebb81446d3702a548beb78264082eecee790d74bfdb088"
text = "按母亲教过的书札体例，替兼定起草回书底稿"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:remedy:pay","reply"],null]']
src = "blake3:95c5ed25cf634b3550820b7e077539b44dbcf9543b08ad325562611d0ea4b4c2"
text = "我拿零用钱向泊岸的行商买了一叠淡墨色的薄样，迎着光连指纹都照得出来。每夜写一首，写给那个不曾见过海的人：海潮、船帆，还有濑户里的旋涡。待写到第十首，自己读来也觉得冷清。选出的那一首赶上了船，余下九首也一并缄了进去。保子大人回信说，这十首都悉数烧给他了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:remedy:pay","text"],null]']
src = "blake3:90e5c9e274e628421f724bf8686d047e528d3f72c0d74afaf3598fd3b6dcfe93"
text = "向行商买一叠薄样，重新写短册"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:remedy:work","reply"],null]']
src = "blake3:cbd1679e736de2d67debeaa2d88e5481c8bf7a97109c1b0f627f9c10883dd15b"
text = "鹰丸听说后，抱来一摞社里留下的旧潮图，叫我把每道朱线边上的歌一一抄录：“都是看错了潮的人写下的。既写给自己，也写给没回来的人。”我埋头抄了十天，手腕酸痛得端不起碗。抄到最末，我循着那个调子添了一首，赶上了东去的船。鹰丸看过，没说好，也没道不好，把那张潮图卷拢，系紧了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_08:remedy:work","text"],null]']
src = "blake3:b52928cd824dd7920c0f2570c78c5cb16c870637c1a0461c0ba8de080d1a53fd"
text = "帮鹰丸抄录社里潮图上的旧歌"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:defer","reply"],null]']
src = "blake3:a3908d8cbd73db849c847b1cf8b83e270eedf886ff43d83cffc721f6f16e34c0"
text = "我答还没拿定主意，得先问过母亲同阿濑。鹰丸撇了撇嘴，嘀咕岸上的人行事总少不了先请示家里。信是托南行的渔船带走的，这一去一回少说得半个月，保子大人那一头，我也只好请她先等些日子。通铺里有人取笑我，都十四岁了，还要寄信回家打听自己究竟想做什么。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:defer","text"],null]']
src = "blake3:1fd2dcb494d648ecde6929e289c37939190ffce024efab6437c60a9aad74e741"
text = "写信问过土佐再作定夺"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:growth","reply"],null]']
src = "blake3:82c317fc2d038c1ab42df768e5beeba8270357761cfc655911d52e2ebb58a530"
text = "我没作声。次日天刚破晓，海潮还没停，我便把鹰丸拽上了小早，自己操橹，打发他在船首盯紧礁石。濑户的水势正猛，船头给水顶得连连打旋。他转过头冲我大吼，我全当没听见，趁着一道回流斜着穿了过去。待靠上对岸，两人浑身早已透湿，他喘息着问我可是疯了。我答道没疯，我要一条自己的船。他怔了片刻，把头别了过去。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:growth","text"],null]']
src = "blake3:3f385f1730cc32b435d0ff9f55e02594fe1e5820627485c7f6e5504d674f68c9"
text = "拉上鹰丸划小早闯一回急潮"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:skill","reply"],null]']
src = "blake3:25980cabb8b238a71a721b9df23e490c7881fda9afef6c31fa2476128b2e8fd5"
text = "我从木柜翻出潮表，逐页算着月龄，推演从能岛驶出伊予滩、绕过佐田岬返回土佐，哪几日乘顺潮、哪几日遇逆风。鹰丸见我密密麻麻写满一页纸，问我记的什么。我答道，这是往后要过的光景，先列个谱。他探过头跟着数，才数到明年七夕便犯了难，嘴里咕哝：“你倒算得比我细致。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:skill","text"],null]']
src = "blake3:df36d252f492496de42a4e5789cf134bb134ba2f1fc01855e5dcc92cda3bc04a"
text = "算好回土佐的船期作答"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:standing","reply"],null]']
src = "blake3:1877bdb40ac324c7dc812ca8b3fb8b008fc591db2f97e49b4090a497cd7e1061"
text = "次日开课前，我当着满草棚的见习向又四郎开口：我要领一条家的船出海，走南海路。草棚里霎时静了半晌，他才呸掉嘴里的草根：“话放出来了，海是记着的。”我把这句话原原本本抄进给保子大人的回信里。没过几日，泊位上的人遇着我就笑，说那就是要出海的土佐姬君；也有刚来的小鬼偷摸凑来问，南海路究竟有多远。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:event:standing","text"],null]']
src = "blake3:2ac3c40eb5a347ca4782e37baf03d3db372d0670c3d5b14551b8d4defbdba99c"
text = "在又四郎面前直言要出海"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:remedy:pay","reply"],null]']
src = "blake3:3d8bbae1d9c93ecb43edf3f16f22abaaf22ff871704357436d4d134b40e5b5c0"
text = "我掏零钱向停靠的行商买了本新历，循着上头的朔望日期，将潮记末尾空下的几页逐日填满，补齐了下田的，又翻过纸背录上能岛的。填到秋分那一页，便顺手勾了小早的帆，记清楚几时该扯起、几时该落下。鹰丸探头盯着看许久，最后只丢下一句：“这船若缺摇橹的，算上我。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:remedy:pay","text"],null]']
src = "blake3:96774b937ff28f831bca8ae5a3f5d414ae6789531476a6cb10ee84b1a470486a"
text = "找行商买一本新历，把潮记补全"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:remedy:work","reply"],null]']
src = "blake3:9639c5a5b0c6f53a4705ac989e32157d1d81f34408d85eedccfa33219d937a01"
text = "又四郎要派一条关船押盐往堺去，听说我懂算潮，随手将排船期的活计抛给我：“算岔了，你自己下海推去。”我在了望岩上连蹲了两个清早，探明几处濑户转流的时辰，又按潮记推算准堺那边的潮汐，挑出三个日子。他端详许久，拿指甲在中间那日上掐了道印子：“就定这天。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_09:remedy:work","text"],null]']
src = "blake3:500d842248d7328cae1f7110f0df4797e69a020247edb7eb5c8005b7b7df94fd"
text = "替又四郎排出往堺的船期"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:defer","reply"],null]']
src = "blake3:7debdef7926f4db03ea15b31f2ea6f6b2c72b4e73f6663d914f41cfb47f91e23"
text = "我回草棚拜托鹰丸，请又四郎去阿兼婆跟前打声招呼。又四郎嘴里啐了句“多事”，脚下还是扛着橹走了一遭。阿兼婆顾着他的颜面，总算匀出一块地方，只是冲我冷淡地颔了颔首。入夜我在灯下铺开潮图，一旁过来添油的船家压低声音嘀咕，说我是仗着水手头开了金口才挤进来的。我权作耳旁风，自顾自把潮图抻平。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:defer","text"],null]']
src = "blake3:84f1e8619037558149ef79ac9f7813eb600fe3e94d7e737fbe051fc73b99492b"
text = "托鹰丸央求又四郎说情"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:growth","reply"],null]']
src = "blake3:aec87d7280977b7ea7e709ccabb9471bd54322bd410a94362137d40c8f095684"
text = "我讨来阿兼婆的算木，蹲在祠门外把整年的油账重新拨算了一遍。里头的斤两记法杂乱，三笔抄重了，另有一笔竟拿冬令的高价折了夏日的油钱。我逐一圈点出来递给她瞧，随后走下岬去，找那条船上的汉子当面对账。他低头翻着自家的账本，神色顿时青一阵白一阵。如此一来，欠账登时少去一大截，省下的银钱恰够顶我一冬的灯油。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:growth","text"],null]']
src = "blake3:6b1cbbc3accdd809063359d178c10aba7e9a3334eceb2ae1727d93850c0d53db"
text = "替祠里把油账重新算过"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:skill","reply"],null]']
src = "blake3:2871e766f456b60c3a50bb013c1e0615f729210f3da40a0a093b110097b6e702"
text = "我直说手头没钱，唯独一笔字还算体面。过往船只常来祠里求当月的潮时，外头雇人抄一份得花多少钱，阿兼婆心里门儿清。我便同她议定：每月抄出二十张潮时供到祠前，权作一冬的灯油钱，多出的另外贴补我纸墨。她起初硬是只肯认十张，我死磨硬泡，直熬到灯芯结出两回灯花，她才总算松了口。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:skill","text"],null]']
src = "blake3:108590ebd4a65383cf8f8e6aab7a1fbfdff3a302f3844689d1829d5a0ac752bd"
text = "抄写潮时来抵灯油钱"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:standing","reply"],null]']
src = "blake3:9008d7dd56e38fb65c09320e5029a1a273f045e417dfd07b32c8c79c5406cdec"
text = "能岛的船常替堺的商号运送荏胡麻。我写下一封信，托东行的关船捎去堺，请相熟的油商开春先拨一桶油送到龙神祠，油价就依堺那边的市价算。不消几日油便运到了，果然比大三岛便宜不少。阿兼婆收下油，当即把供台旁最避风的角落让给了我。这下岛上的船家都在私下打听，那个土佐来的见习，究竟哪来的门路，连堺的买卖人都请得动。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:event:standing","text"],null]']
src = "blake3:ee5407de7f2946faab6d07a7d0c0f817d6f555b8a33d64a161748423f6d2bbd0"
text = "托堺的油商往祠里送油"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:remedy:pay","reply"],null]']
src = "blake3:640224411d8bdd92c1154e91f6cf78dfebe729974f25bb94e2c02e21015ab616"
text = "我揣上零用钱，下到岬边守着那条油船。船家这回喊的价钱比年前又高出一头，我便照着祠里的旧账同他掰扯：去岁几月几斤作价几何，眼下凭什么水涨船高。来回拉锯了一刻钟，他总算松口让了些价。我买定一桶，独自扛上石阶。阿兼婆打量过油桶，抄起竹帚将灯下那片地扫得干干净净，冲我微抬了下巴。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:remedy:pay","text"],null]']
src = "blake3:92cd0e9cfd96cef05ad1771414aa38d9c7cf057b1d101753970d5419e1f9862c"
text = "自己买桶油送到祠里去"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:remedy:work","reply"],null]']
src = "blake3:6b4545b9c96e551a1dfc2d74984b20c1eb00b480eb982f3b1f116639294c5f41"
text = "我向阿兼婆求了件差使来做。她将船家献与龙神的初穗账交到我手上：哪户许了愿未还，哪户应下的鱼一延再延，簿子上记得一笔比一笔惨淡。我一家家登门去问，能宽限的放宽，该催讨的照催，又替祠里同一个老渔夫约妥，延到秋汛再还。十天跑下来，脚底磨起了泡。阿兼婆翻过账本，半个字也没说，第二天灯下便多了一张草垫。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_10:remedy:work","text"],null]']
src = "blake3:7025634f6abe19f2dddc583d9918970c7421bed643472f46e9325dd6e101bbea"
text = "替阿兼婆理清船家的初穗账"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:defer","reply"],null]']
src = "blake3:c60dce017f862c662039d09a3d30610fc21c62923f777d0a435d174d6564a792"
text = "我搁下香木不碰，另修了一封长信寄往土佐，向母亲细问伽罗与罗国究竟该如何辨别。闻香本是她一手传授，自然一眼能看出我差在何处。信件托付南下的渔船顺道捎去，往返少说也得耗上半月。这阵子集日到来，社里照旧聚众品香，却再无人喊我入席。我独坐在草棚门坎上，耳听滩边一阵阵欢声笑语，暗暗咬紧牙关，把潮表又从头默诵了一遍。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:defer","text"],null]']
src = "blake3:c6058352367624121e358ffe086d94d8bcf73c38c5b1e5f95b6f090854d937b6"
text = "修书恳请母亲指点以补拙"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:growth","reply"],null]']
src = "blake3:0c045dd3cddbf93b69db15331172addc3303397430298550ed37b9e0ed2cb97a"
text = "我找那行商要来剩下的香末，一炷挨着一炷细细回味：第六炷原是伽罗，那股甜意还粘在鼻息间，第七炷递到跟前时，我闻进鼻子的实则是上一炷的余韵。入夜后，我硬把鹰丸拽进船屋，命他每隔一盏茶工夫轮流点起伽罗与罗国让我嗅，且不准漏出口风说次序。他嘴上直嫌啰嗦，倒也老实陪我熬过了半宿。头几轮我猜得全盘皆错，及至后头，罗国尾调里掺着的那丝苦气，即便隔着伽罗的甜香我也辨得出了——恰如潮水退净后礁石上的味道。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:growth","text"],null]']
src = "blake3:be40d50dc4c8c10a51b4dabf462a7d616eefac9f67e5353eb648894538c390f7"
text = "讨来残余的香末，一炷炷回味细想"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:skill","reply"],null]']
src = "blake3:39c46521bf61b4f88b475ababa9f2e6490909f332e2b2114a6eb7591fb258d53"
text = "败下的一拨照例领唱舟歌，我随口改换了词句：误将罗国当作伽罗，恰如把晚潮错认作早潮，偏是船身已然驶出去了。滩涂上的众人起初一怔，随即爆出满场哄笑，连待在草棚里的又四郎听见了，都骂了声“小鬼头”，自个儿却也忍俊不禁。唯有鹰丸抿紧唇角没吭声。待人群散尽，他却抓起朱笔，将我那句词儿原样誊写到潮图上，落笔的地方，正挨着他从前看岔了的那道潮线。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:skill","text"],null]']
src = "blake3:84bea26bd769559f677671ac15474257c2cc2011e0e81966818017d47e051870"
text = "依约受罚，起头唱一首认输歌"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:standing","reply"],null]']
src = "blake3:2b921d4a630dd1fe4be4f382f92240a7cabe6d0ca58ea926652e923b5bff9dc0"
text = "我把母亲教过的香名逐一默在纸上：伽罗、罗国、真南蛮、真那贺、佐曾罗、寸门多罗。各从哪片海外的国而来，船如何运到堺，罗国又缘何与伽罗难辨，足足写满了三张纸。行商看过直咂嘴，说他贩香十年，竟是头一回晓得自己卖的货色有这许多名堂，执意要讨一份抄本带走。社里的人传看了一圈，待到下回集日，再没人敢胡乱写名字了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:event:standing","text"],null]']
src = "blake3:7a38e6eaa0380d57d439e313df27d5df43894e38127c4ccecda1bf8f55b595ba"
text = "默出母亲传授的六国香名"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:remedy:pay","reply"],null]']
src = "blake3:77c1e830ecac83a45c57c2c95aa085711fe66c8d7c6533bd8aa2c497c23afb1d"
text = "我掏出积攒的零用钱，向那条船上的行商买下指甲盖大的一片罗国，他仔细裹了三层纸递来。我回去将它均切作五份，每晚点起一份试香。鹰丸闻过总说些大白话，“像淋湿的柴禾”“像船舱底下”，我索性拿他这几句改作歌词的上句，再自己续出下句。五个夜里凑满五首，他嘴上嚷着一首也记不牢，翌晨却把那首“船舱底下”唱给了泊位上的小鬼们听。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:remedy:pay","text"],null]']
src = "blake3:e3c6a531e9425fdc379d1a9ce5dc58128b247821e011b390ebea99ca0c553256"
text = "找行商买片罗国回来练"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:remedy:work","reply"],null]']
src = "blake3:f10fa91c7755a8c375163af7c8389bf08ebf44755f77f1f390fd1c294a9c4da4"
text = "我上社里认了错，说定下回集日的香归我置办。从切香木、擦云母片，到把香炉里的灰抹平、再压出五道纹，一连十天，指甲缝里尽是灰。集日那天，香烟才刚升起，正轮到输家起头，鹰丸把舟歌的第一句让给了我。等我唱罢，他翻过手里的木片，道了一句：“这回倒还过得去。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_11:remedy:work","text"],null]']
src = "blake3:11211d9f19d884275d64e9bf1c477675b9a6d1ed911f5dd48098c82e3ca630d3"
text = "替社里筹备下个集日的香"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:defer","reply"],null]']
src = "blake3:9bf18ab7a2b3199b8a7e3d24039dee973956ecc385caae534428486395bd3775"
text = "我修书回中村，求母亲寄钱进京。信得先往南去，等中村的钱绕出室户岬送进京中，腊月也快过半了。兼定下一封信里说，管家的老侍一言未发，回身便拿自己一件衣裳去当了。我心里明白，这事定会在本家传开：土佐来的姬君，遇着事便只会往家里去信。当夜，我将那页账从头誊了一遍。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:defer","text"],null]']
src = "blake3:026fe49d665bfa2ce6f223610dc392cc75763a8b1fc6f4d3409152fc4d3d53c0"
text = "修书返中村求助母亲"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:growth","reply"],null]']
src = "blake3:fc1dca27bffc7e4792f263984008dae101ee7929ed8e1d75c994b5f5cd27c594"
text = "我把那页账铺在通铺地板上，整夜没合眼，将能省的逐笔圈了出来：正月的酒宴裁掉，冬衣改用旧的，炭火单烧病人屋里那一盆。省下来的钱，恰够把药吃到腊月底。我把圈妥的账目誊写清楚，紧赶着捎上往东去的关船。半个月后兼定回了信，说是老侍瞧着满页红圈叹了声气：老爷年轻时，也是这般记账的。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:growth","text"],null]']
src = "blake3:3d63940cd4638265a376110276fab69715c960bbe9880f6f7922d7081b252c49"
text = "依老侍抄来的账，重定各项开销"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:skill","reply"],null]']
src = "blake3:4f96a086db787516fade4db139d0e238e31fd187bf030f67c95dab40df17f595"
text = "次日有条堺船在能岛门前候潮，我随番所的人一道登了船，寻着船主同他说道：开春土佐的年贡船上有鲣节，分他三成，照京里的市价算；钱眼下就付，由他的船捎进京里本家，往后言继大人的方子全去他指的那家药铺抓。他咂着嘴盘算了半晌，在自家账簿上写下“一条殿”。鹰丸在船下等着我，说我讲价那股腔调，和阿濑骂水夫没半点两样。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:skill","text"],null]']
src = "blake3:830c461d0308c21a391ad001df4e6715ac6bad1c60a293281ff2034a19962ca1"
text = "向候潮的堺船谈妥预支"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:standing","reply"],null]']
src = "blake3:3d1201d2feef961eca09e1ddd66548954108a4eb36f4c26bda28941ab4e86e2d"
text = "我修书一封予常走幡多水路的堺商，只钤了一方一条家的印，言明开春的年贡船交由他包运，随即托东去的关船带走。不消十日，他手下伙计便将两贯钱与一包上等参送进了本家，顺带传话：一条家姬君的墨迹，他认得。兼定寄信来说，药铺掌柜闻得此事，主动把赊账期限展宽到了二月。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:event:standing","text"],null]']
src = "blake3:5eb39f2eb378c5ce36665f65b0b41a2de37e5306d00ff63565fb1842cbd4caae"
text = "凭一条家名头向堺商借贷"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:remedy:pay","reply"],null]']
src = "blake3:7407c628a81fbb9d81e9dbd5275758ce23016ced00b444d6d77f0893dfb0a0a2"
text = "我将积攒下来的钱搁在老账房桌案上。他顿时眉开眼笑，塞给我一册旧账抄，书页边角密密麻麻尽是批语：哪家船主性子好处，哪家须先赞他的船，哪家见了酒便醉。我熬了一夜通读毕，依他的门道往京城药铺修书，先赞过方子再提银钱。未过多时兼定寄信来，言道掌柜居然又让了一成。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:remedy:pay","text"],null]']
src = "blake3:81d1dfd392050ce06c4e4baeb2d04413dbe60334594330a9dcbf0081e9becec7"
text = "将番所老账房的旧账抄买下"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:remedy:work","reply"],null]']
src = "blake3:d87a6114e5daeba931bc091bf66ec5c9996102d2585b8311cfa43657eb7b878e"
text = "问丸的东家是个体态丰腴的老翁。又四郎先呈上一尾腌鲷，继而说起濑户海上的笑谈，待讲至第三桩方才启齿言及赊账。我陪在一旁跪坐足足一个时辰，双腿早已麻木得起身不得。归途中他考我记下了什么，我答说只记住您开口之前连饮了四碗茶。他咧开嘴笑一声，道是岸上来的小鬼，好歹说出了句像样的话。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_13:remedy:work","text"],null]']
src = "blake3:bc2bf35c6cce1c3c958e9fe87447a572c410cf85f93d389453caa398af054198"
text = "随又四郎赴问丸处赊货"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:defer","reply"],null]']
src = "blake3:5d86bb920e655f10b746d5718505d3ab1dbb01760fabb9d64307f818af03a7ac"
text = "我终是未敢落墨，先修书回中村请教母亲该如何向舅舅启齿。西去的航船却不候人，奉书便这般空留着后半页走了。保子大人随后的来信仅寥寥写了句“也好”，再未提及此事。日后听闻，附在奉书末尾的是旁人代作的一首。京中亦有人私下议论：一条家的姬君竟连自家舅舅也不敢开口相求。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:defer","text"],null]']
src = "blake3:6a93b0c1218122334763ebde84627ffc66eb1af91c3060544f5ee93f094fd3a8"
text = "先修书问母亲的意思"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:growth","reply"],null]']
src = "blake3:7a7edf4b095328e4058eff9a9a9bd222d370e5758272984e56f74ca2e8f6618f"
text = "我并不急于作歌，先自拣选纸张。淡红嫌太浓艳，似在讨赏；素白又仿若吊丧。最终从文箱底层寻出一页浅黄纸，迎光能透见几许梅枝暗影，又依着母亲从前教过的法子熏上一缕梅花香，淡得非得凑近纸面方才嗅得出来。这页纸连同奉书一齐装上了西去的船。日后保子大人来信言道，舅舅阅罢，独独将这一张留在了身畔。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:growth","text"],null]']
src = "blake3:e7022c017cb1a5b8809d135dc9060b98f77c5301a8bda564d172a68054efb7a6"
text = "拣好纸熏香，配这封信"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:skill","reply"],null]']
src = "blake3:b2b7270b244c4ffe83f59c42ceb3cb84fa4e979bdc4168605065b1409a6e7c6a"
text = "我吟咏府内的海面：南蛮船入港那日，京城屋檐正自漏雨，同一阵春风吹拂着两地。写罢递予鹰丸过目。他仅扫了一眼，提起笔便将漏雨那半句抹去：“只说春风吹拂两地，足矣。”我盯住他看了半晌，终究未曾改回原样。保子大人复信说，舅舅读完这首，会忆起他的姐姐。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:skill","text"],null]']
src = "blake3:c54b241d992707f0f8a2633bb6268e71d2f67e409159c33623caea21a9ad02d7"
text = "写首歌附在奉书末尾"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:standing","reply"],null]']
src = "blake3:c60898b97c0cf23427d923be55c65b5140f167bfc740d28e6359c81867751b01"
text = "我翻检出从下田携来的那本《古今集》，寻着寄往远国的几首旧作，循例起了首新歌，复将出处逐条细注于纸背，随奉书一并送上西行船只。保子大人复信说道，三条西公条大人阅过抄本，拿扇骨点着纸背称许：“注解比歌本身更佳。”此后宫中但凡再往远国寄歌，众女房俱要先问上一声：能岛那位姬君是如何讲的。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:event:standing","text"],null]']
src = "blake3:8ef2fcd4f1f7876585f49b1590ded67b62687b20ecb944c6f6def0435ae6534a"
text = "仿《古今集》旧例起草"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:remedy:pay","reply"],null]']
src = "blake3:1a66116413b8f0e986622aac4c657c571e2f734ffa91122c93a73ae720ae613f"
text = "我从行商处买下一刀上等鸟子纸，逐封细读，逐封唱和。凡是求得银钱的那几封，歌辞尽皆简短，单只说一件事物；未求到的，满篇无非天恩浩荡。待和至第十首，我自个儿也悟出门道来了。将那一沓寄还京里后，保子大人来信言道，国子从中抽出一首留了下来，道是留待下回再用。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:remedy:pay","text"],null]']
src = "blake3:657e09c7c82f886cefd66a4294dd7dae2d708c1d5d408e0404c109c243f2b6dc"
text = "购一刀纸，逐封和上一首"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:remedy:work","reply"],null]']
src = "blake3:d5fea9d163aca405d2e690606f2242919e75653e1d406e3663dd19a7ec8cd5c0"
text = "我在龙神祠灯下一直誊至半夜，灯油添过一回，海风亦将火苗吹矮了一回。底稿里的歌一首接一首过手，有几首抄着抄着便暗暗记熟了。破晓时分阿兼婆过来洒扫，瞥了一眼，道是笔锋尚稚嫩，好在全篇未曾抄错一处，说罢将她那件旧蓑衣往我肩头一披，径自去了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_14:remedy:work","text"],null]']
src = "blake3:fd8187325fb9691cf1cd4fbdfbefda44cf1abc5d40e70cffe496dfd83379046d"
text = "守着神祠的灯誊完这一沓"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:defer","reply"],null]']
src = "blake3:0381b367ae0a67feb6799a5952b805dd71d78c79cff92b07742db0f9d196b859"
text = "我修书送回下田，请阿濑进京代为料理。书信在途半个月，她动身去京又要耗去半个月。兼定哪里等得及，自己问起家臣，家臣们背地里便议论，说姬君在海岛上学了两年多行船，船舶上的事竟还要问乳母。他来信把这闲话原样学给我听，写罢又像是后悔了，末了将清单上那个“鞠”字划去了。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:defer","text"],null]']
src = "blake3:df5ceea3eb1653ac8115ffb9cf3e8830768fbe76cfa73fedaa9ce3e6eadf3de7"
text = "修书请阿濑进京搭手"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:growth","reply"],null]']
src = "blake3:5f416f03ed5721e1d3c44e6d1456032a88b64edf2837ee85337f06da92c63d4a"
text = "又四郎放我随押盐的关船跑了一趟堺。我在堺的码头相看了三条船，拣定吃水最平稳的那一艘。书箱最怕受潮，架在船舱当央最高处；铠柜重，正好沉进最底层压舱；随行家臣按轮值排坐左右两舷。我将绘好的装舱图交与船头，他打量我，问我是哪家船上的船头。我答道只是能岛的见习。他把图纸折齐整揣进怀里，应承到时候就照此办。事后兼定来信提起：那船头逢人便吹嘘，这舱可是由一条家的姊上亲定的。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:growth","text"],null]']
src = "blake3:f566f57f56cbef97ffeea7c76a31226ad04515063a9aee5a7b6de812d975c9e5"
text = "随押盐的关船往堺走一遭，选船定舱"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:skill","reply"],null]']
src = "blake3:8b713f4b1e2331da306ba8a7d5b0093497e1d0778832841f3bc695a17e4c3068"
text = "室户岬外头的海流最棘手，入秋又常起野分。我将这两年在能岛记的潮时，同阿濑教过我的下田潮候并排摊开，一日一日往后推演，避开野分刮得最烈的那一月，只在九月里圈出三个小潮又逢偏北风的日子，写上小签寄给了兼定。他回信说把纸签夹进了书箱里：“回了中村，我拿去给政所的人看，就道是姊上算出来的。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:skill","text"],null]']
src = "blake3:c5389b5563be3eca9e77b1332aceab3f11fc01ed4477ff5050ff88eefd0a788d"
text = "定下开船的日期与潮时"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:standing","reply"],null]']
src = "blake3:0795332e613544121e9ebc86d31768c3eb40e2f576849b9b6f1a53e6ed100990"
text = "我走去央求又四郎，劳他向番所打个招呼，拨一条小早自纪伊水道一路随护至室户岬。他听罢一声未吭，晾了足足两日方才吐出一句：“一条家的姬君开了口，直接护送至下田。”这句准话随着东行的货船很快在堺的码头传遍，船行听闻此番有村上家的船压阵，水脚钱直截减了两成。鹰丸闻讯当即请缨要去摇那条小早，反被又四郎抄起橹柄一记敲了回来。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:event:standing","text"],null]']
src = "blake3:5ffb864629a50706b84047d2326597384c8a50048b59cbae807367ee85d5918c"
text = "托能岛遣船护送一程"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:remedy:pay","reply"],null]']
src = "blake3:05b311f1afea05b513a111b28a738e4ccbdf7911f3d744e1fa4f57fc685e78d4"
text = "我自掏腰包买下东行盐船的一个舱位，由能岛直坐到了鞆浦。那船头起初对我爱答不理，后来瞧我成日死盯着他看水色，才松口教我辨认沿途候潮的港湾：哪一处务必抛锚等潮，哪一截落潮后得绕离浅滩。回岛后我把这一路的潮待港绘成图样寄给兼定，他来信打趣，说比他描的习字还齐整几分。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:remedy:pay","text"],null]']
src = "blake3:c996d5351298e9fd84bf8bbbeb33e63a2cbf9251b0e28a2bac12bc551b6ad40d"
text = "买舱搭乘东去的盐船，一路跟至鞆浦"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:remedy:work","reply"],null]']
src = "blake3:293239e17ce2489779caf6defda2a645dcc883667ef513315949cad9f4b0dd39"
text = "我套上件旧短褐，连着三日在泊位上替船家扛货。熬到第三天散工，才有一位老船工肯开口指点：船载得妥不妥当，全看吃水线跟不跟潮水走——涨潮时平稳，落潮时照旧稳当，这才叫配对了舱。我牢牢记进心里。鹰丸过来喊我开饭，瞟见我肩膀上勒出的一道道红痕，半字未提，只默默掰了一半饭团塞到我手里。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_15:remedy:work","text"],null]']
src = "blake3:b8c2e0a09eef3cbc62df389990538e98bfadc5c3b17afef43c603b17ee8c2ad9"
text = "去泊位上替船家搬货"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:defer","reply"],null]']
src = "blake3:c452b543ddd519f6e0829236591d89289b1362d7049d887d37f5b282070ee159"
text = "我把花名册推给阿濑，将空账簿退还母亲，只说眼下尚无主意。阿濑当夜便把人手摊派齐全，掌舵的活计给了能岛来的老人。幡多的渔家后生当天便甩袖走了两个，出门前丢下一句话：合着这船敢情是村上家的，姬君在能岛学了三年，倒学成了村上家的人。母亲一声未吭，把账簿重新推回到我桌前，单单翻开第一页。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:defer","text"],null]']
src = "blake3:0a0fdb5020d9199dcefa199d37e043a74673f14cd14f38f9acc6e0998b385d7b"
text = "托阿濑和母亲代为分派"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:growth","reply"],null]']
src = "blake3:9c05a485194ef073b1249a5a4bebe61ff203b674ec7fcd7c507825411eb19eff"
text = "我将十八名水手的口粮、工银并沿途过关的费用，逐项逐笔列上纸面。土佐米价贱，三袋米里只留一袋充作途中的吃食，余下两袋运到堺去出脱，恰好充抵水手的工钱；那两袋盐巴捂着不卖，留到船上腌鱼。单是穿能岛门前那笔关钱，我也依着番所的定例先行入账，半文钱都不指望赊赖。母亲捻着念珠自头至尾盘算了一遍，竟一个数也没动。阿濑在旁竖起耳朵听着，点头道：“比我那时候精打细算多了。”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:growth","text"],null]']
src = "blake3:bd3dc30bb3fdf06b8cd40fa93fa4419a5ef065e166619d02050cab559697ff78"
text = "细算米盐与工钱的账目"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:skill","reply"],null]']
src = "blake3:5282e72265d9def0242e1aad9fa6f56a975adfdcdb0c34ff471851f48b6164ff"
text = "我将两拨里为首的分别唤到一旁商议。能岛老水手争着要掌舵，我干脆将舵把许给他，只是进出港湾的号子须得由幡多弟兄来领喊——又四郎早先讲过，号子喊齐了，船上人手才不至打架。幡多渔家又嫌报酬单薄，我便应承每靠一处口岸，顺道搭货赚的脚钱分予他们一成。直磨到天黑，两下里倒都觉着自己占了上风。次日大伙在栈桥上照面，谁也没再多提半句掌舵的事。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:skill","text"],null]']
src = "blake3:4877032d8f2664f48cf8fb3c8b126d204164e0653452f100ea54d7d9152dce76"
text = "与两边的领头商定差事"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:standing","reply"],null]']
src = "blake3:8cbc09a564234fda27f5cd33a1747a2068f8b688a01f12e1b58d573e8f069231"
text = "我顺着河口挨家叩开盐铺、米行与船具店的门，跟店家商量：开了春我的船便替诸位捎带货物赴堺，水脚银钱先打个对折；穿内海时船头挂能岛的旗号，保管无人敢来刁难。盐铺的老板娘头一个爽快应承，夸道姬君从前在河口征收帆别钱，从未错漏过半文。奔波了一整天，铁钉、大缆连带两幅崭新的船帆全让我赊了回来。才隔一夜，栈桥边便挤来好些打探风声的渔家子弟：听说一条家的姬君要开办船行，还招不招水手？"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:event:standing","text"],null]']
src = "blake3:02a77ac69d8a8d709075471131b05d796f97b6926434632f96a2b950952fe1cf"
text = "往下田的铺子赊些船具"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:remedy:pay","reply"],null]']
src = "blake3:a94233b71608136a4e9e7877af68af1091d58a52174feec556c612ca4d797395"
text = "我包了一份礼钱，又提溜着两条烤鲷鱼，登上了那户渔家的门。他爹接了钱和鱼，嘴风却半点不松，反问我凭什么叫他儿子回头，毕竟船上握舵的又不是幡多本地人。我便把捎货分成的细账摊开给他算：一成水脚能进多少铜板，跑几趟便抵得上一面新网；再申明开春之前舵位还要重议，全凭各人本事定夺。他看毕把儿子唤出屋门，嘴里念叨着跟姬君跑船，至少账目清楚明白。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:remedy:pay","text"],null]']
src = "blake3:6ce5493f892dfc4f987db1aa654a85ecf95b8895283d2aadb7cc68b904e0446e"
text = "备了礼钱登门相请"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:remedy:work","reply"],null]']
src = "blake3:9bed4c01fd413cb4dded9ee793ac4ff2d9635827b56d2c12b2a30ef25412fdec"
text = "我在那户渔家院外的晒网场干坐了整整两日。头一天连个搭理我的人影都无；挨到次日黄昏，那个精于修船的后生出门收网，瞧见我竟还蹲守在那儿，便在旁蹲下身递了一句：掌舵的人选，他心下不服。我答他，能岛的船坞向来有个规矩，谁把船身修补得最牢靠，谁的话便顶用，开春前这舵由谁来掌还得重议。他默默收齐了网具，第三日清早便出现在栈桥边，手里拎着自家的木工凿子。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_16:remedy:work","text"],null]']
src = "blake3:4ee6b0fc8ef9a6d8a19e9e0034a2416885802018b550ca8b0b21e269086e481d"
text = "上他家门口坐等"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:defer","reply"],null]']
src = "blake3:095c18135ac4627fb8c7198af2a9e148468f07cbb712cd92a700cef2e2443a82"
text = "轮到我了，我把空白的短册搁在扇子侧旁，说这一首想留在海上写完。小鬼们笑了起来，鹰丸却没笑。散场以后他追到泊位，把自己那张也还白着的短册塞进我手里：“那这张也带上。写成了，捎回来。”话毕转身便走，草鞋踏在栈桥的木板上，咚咚作响。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:defer","text"],null]']
src = "blake3:a311b83d072f0b31257ac9a744650465bedb4d661abbb39592f12c362fb229ed"
text = "递上空白短册，只道等到海上再题"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:growth","reply"],null]']
src = "blake3:7a54806aa472023edb40db1a52529ade4b742e40604d3ee8d39fd083b0615a54"
text = "我将扇子合拢，请鹰丸先咏。他瞪了我一眼，口中念得极快，咏的是秋天收进船屋的团扇，等到了夏天，总有人会想起它。念罢，他低头去理那把破团扇的边，耳根红了。满院小鬼什么也没听出来，我却听出了意思，将那首歌一字一字揣在心里，没落到纸上。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:growth","text"],null]']
src = "blake3:0a018bf900b07c264e096a52f50afa18664a7da1364b4adb48accfb9245229a8"
text = "把扇子一合，请鹰丸先咏"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:skill","reply"],null]']
src = "blake3:99ff90deb753f962da9ff8f92f34d91e13052a088e3fba8b205e41804227a1e2"
text = "我翻过扇骨，紧挨着去年那一首，又写了首新的：岛上的潮一天转四回，船走了，它照旧转。写完递与鹰丸，他握着笔看了半晌，这遭一个字也没抹，只在末了点了个小小的圈。又四郎在草棚门口咳了一声，说是要收网了，天黑前不收拾完，谁也休想走。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:skill","text"],null]']
src = "blake3:b398cd613ed228ba9b961a4b73aed07c1a1d1a5a37f39e176c86d9ef6b0c3e9b"
text = "于扇骨背面续题一首"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:standing","reply"],null]']
src = "blake3:b5552b2028ca1897fc896149df6e1a4ec9d77a666df6dd5ef8117cd06e9330e6"
text = "老神主接过我的扇子细看了两遍，提笔在短册上题了一句，说这一首足以奉纳到龙神祠，和历年的船歌挂在一处。满院子登时静了下来。坐在末席的鹰丸摸出小刀，在他那块刻满道道的船板上，紧挨着我名字底下，端端正正又添了一道。开了年，过濑户的船家嘴里还在传：土佐的姬君走时，歌挂进了龙神祠。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_noshima_critical_17:event:standing","text"],null]']
src = "blake3:6c4f66815c0603da9db00995e0051733bc95bb836850ae0bace4d6712bee30e1"
text = "请老神主替短册题字"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_route_offer:event:kyoto","reply"],null]']
src = "blake3:8c9fb830ea37c7eb2e73f2518c05b59117cfa3d581bbd49ff43cb868b203bb38"
text = "我替阿濑满上杯中酒，说道京都那头早已去了回音，宫中又托付了门路，实在不好半途反悔。阿濑轻轻颔首，便不再多劝。鹰丸站在门外偷听了去，隔着糊纸木门冷哼一声：“宫里的长廊上，可没潮水供你去认。”次日他的船驶出河口，我在岬角站立良久，直望着那片船帆越缩越小，化成浪尖上一丁点白影。"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_route_offer:event:kyoto","text"],null]']
src = "blake3:cfd5584bf065ed0795fc19b21a82a36a11695ccb5039291d46d2ca75031df17a"
text = "依着原话，开了年如约上京"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_route_offer:event:noshima","reply"],null]']
src = "blake3:ceaf0468a99b045abc0a1f41bdfce0ebe07415f08d403541069121e0b60e6907"
text = "我端过母亲的砚台进了灶间，当着阿濑的面给广桥夫人写下第二封信：谢绝宫里的美意，自陈土佐的大海我还未曾认遍，不敢贸然先学宫里的走路。母亲看罢信纸，沉默半晌不作声，最后把念珠往腕上一缠：“写得比前一封强。”阿濑当晚就寻关船捎了口信。鹰丸扬帆离去那天，立在船头回身朝岸上大喊：“书信一到，水手头自会派船来接。宫洼濑户口，卡着平潮走——误了时辰可没人等！”"

[entries.'["upbringing/families/mio_noshima.toml",["choices","c9_mio_route_offer:event:noshima","text"],null]']
src = "blake3:2e84a3cb064f7d5df53fc0c64cdb0891fd65a1baa7df2d22ff6235d02271570c"
text = "央阿濑向村上家求一封引荐信"
