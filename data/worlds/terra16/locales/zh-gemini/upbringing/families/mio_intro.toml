[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:ase","text"],null]']
src = "blake3:4d86e789b36cea61279d34f93e7795b1a6d3211225009ab0047ab1f1a3d2c8e9"
text = "阿濑坐在网棚下补网，手里梭子翻飞，两眼却没离开过河口那道白线。我刚把三十六文倒进她钱匣，她便数落开来：人家怀里的钱，哪轮得到姬君去点数？早年宿毛有个多嘴的丫头，被船头一桨拍下水，捞起来少了两颗门牙，她娘守在栈桥上哭了半天……话才骂到半截，她起身去收竿子上的网，探出去的是左手。转回来，她往我手里塞进半块烤年糕，只夸了一个字：“快。”"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:estuary","text"],null]']
src = "blake3:d71f268fee9edcc2d78c52c45e7c4556c46adf58644c8fc749a8a131c71a3d3b"
text = "四万十川打中村一路流到下田，撞上外海，黄水和青水在沙洲外搅作一处。中村几处庄子的米顺流而下，都在这儿装船发往堺，好换回绢、纸与铜钱。过路船在河口外候潮，先要停在阿濑的栈桥前交帆别钱，进项都归能岛。进了冬，河口水位就浅，装船的脚夫蹲在缆桩上冲沙脊咒骂，说它今年又往东挪了地界。家里派得上用场的船满打满算只两条：老五郎运米的平底船，还有阿濑那条小船。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:kanesada","text"],null]']
src = "blake3:711f0683c4dcf5616252cc13da79f516fbcdbec8fef79d315343c95fda2d3e0b"
text = "兼定打京都本家寄来的信走了二十三天，行行字迹都朝右倾斜：“姊上：头一桩，本家的人清晨起得迟，我先起身，在廊下滑了两回。第二桩，房通大人嘱我问中村的米何时到，本家的米仅够吃到二月。第三桩还没想出来，想好了再写。兼定”我把信递给母亲，她只看了第二桩。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:mio","text"],null]']
src = "blake3:dca3a2d574de380e15197514af3a958a71b44194e25fd8cfbfd96d816ff3385c"
text = "河口外有条堺船候了两天潮，待船头下来缴帆别钱，钱袋还未倒净，我已开口报了数：“三帆，每帆十二文，三十六。您怀里那串不必往外掏，那是下回的。”船头听罢，将手从怀里收了回来。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:mother","text"],null]']
src = "blake3:9ea83de61bde77a8d22cd0ff85588e341cc7bf90c248e9d0f28f77e08ba7b762"
text = "母亲在书房里核对粮账，口中念过一笔，手下拨过一珠。那串黑檀念珠缺了一颗，每次拨到空档处，她的手总会停顿一下，才又接着走。我问开了年要学什么，她应道：“字。歌也要……”手下再拨过一颗，又说幡多那座庄子短报了两石，吩咐我明早替她读那一页。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:paper","text"],null]']
src = "blake3:b928d17748d027fefb8f841061cd21b6aa148fc94243df53e26baf8e335717f0"
text = "临睡前，母亲在我床铺那头贴了张纸，记法同她的粮账一般无二，一天一行：潮，字，潮，字，凫水。第六行空着，再往后写着一个“歇”。纸脚另记着一笔：每月初一，钱一串；替阿濑代收帆别钱，另行分账。分给几文倒没写。纸角还有一行，字迹比母亲的大出一圈，墨也浓重，是阿濑后添上的：“十六，船。”"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_home:ushio","text"],null]']
src = "blake3:afda884be51973182657f699930eae1d0f552b610ced027122adeb5845a334eb"
text = "汐蹲在灶门前生火。我提了句那条堺船明早便走，她拎起火钳往柴上一戳，一气说了下去：“走不成。这几日赶上小潮，水漫到栈桥第二道绳就止住了，那船吃水足有五尺，过沙洲非得到第三道不可，明早它还得蹲在外头喝风。”说完又跟了一句“我娘准这么讲”，低头继续往灶里塞柴。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:ayame","text"],null]']
src = "blake3:5b5b593bfd93affd3c4a033c5281688440d81d9b671597580f92faefce7e3dba"
text = "大炊御门家往本家送岁暮之礼，我站在隔扇后头偷瞧。随行的女儿跟我年岁相当。本家的小女房把回礼递过去，她刚接过手，便原样推还回去：“您递反了，有字的那面朝着自己。”小女房掉转过来重递一回，她这才收了，顺手理平左袖的袖口，问起小女房隔扇背后那一位，是不是土佐来的姬君。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:kikuchiyo","text"],null]']
src = "blake3:be73650905abbd94d0ce98cdf2222444bbcf6023fb2194f1b4c7c48d85ba6f32"
text = "飞鸟井家的围墙不算高，隔墙能听见鞠落在鞋面上的声响，我暗自数到四十多下才断掉。踮脚往里探，什么也还没瞅见，墙内先传来问话：“谁、谁在外头？”是个少年的声音。我不曾搭腔，沿墙根走开了。直到走到巷口，院墙里的鞠声才又响了起来。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:kineda","text"],null]']
src = "blake3:5e63f9a82a6b865d09e60e602533a4860f17f2c89ebfbecec506a8923f3bd61b"
text = "三条西家的土仓里满是霉纸气味，公条大人就坐在书堆当中，替我翻找《源氏》中的帚木。寻到后，他揭开书页讲了两句，抬头问道：“先前讲到哪儿了？”我回说是第三张背面，第五行。他没管行数，接过我的抄本，单把页边一条小注念出声来，说这一条记对了，接着便从帚木第一句重新讲起。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:kogo","text"],null]']
src = "blake3:b324c880ec5813f44c5fb975f4b36f382cf58074023ffbb15b5dba55fff596c3"
text = "室町通一家扇铺门外，有个身着见习衣裳的女孩蹲在檐下，正替铺里的小伙计代写书信，写罢一行便当场报价。我立在对街等本家买炭的下人，隔了一道街面也听得一清二楚：“这一句半升米。‘想你’两字另算。”小伙计数米才数了一半反起悔来，她手里的笔一收，那行字便没了下文。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:tokitsugu","text"],null]']
src = "blake3:84af49342d338e3ab4b31796f0217b2176eba5c35f0044563f6fa3b4b71d083b"
text = "山科大人拎着药箱来给房通大人送药，人还在小庭当中便先笑开了，问我今年土佐的鲣鱼几文一条，堺到下田的船钱涨没涨，每问一句，就往随身带着的那册日记上记上一句。我才答到第五样，他收笔一顿，说宫里那间漏雨的屋子，修屋的钱到如今还没凑足，又问起中村那处今年拿得出几贯。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:yasuko","text"],null]']
src = "blake3:5ff9207d83d1210f17801d1069f1cb3daf92a29642de91256033966bdc9ed29f"
text = "入夜后，保子大人先着人往我屋里的火盆添了炭，方才隔着帘子说话。她说姬君心里定在盘算，晚到了这些日子，老女房要见怪；不会，她已同老女房言明过了。她在宫里做典侍的姊妹国子，也托付妥了，开了春先瞧字。三条西大人家的书库，她去递过话，姬君径去借阅便是。至于姬君说话的腔调，也用不着慌，一样样缓缓来。我问这许多门路日后要还多少。帘子背后她先笑了一声，道是改日。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_kyoto:yuki","text"],null]']
src = "blake3:ea101fcb2c374a83e9df0e6bebc1f533f076c4a872441ac90aa2e7804be8740c"
text = "去宝镜寺抄经，入门先要在簿子上留名。我写：土佐一条家长女一条澪，抄《心经》一卷。一旁伸过来一管笔，直接把“土佐一条家长女”划去，那一笔划得笔直。“一条澪。”那女孩开口，“抄一卷。”再看她自己那一行，上头统共只有两个字：冷泉。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_noshima:bosun","text"],null]']
src = "blake3:7db84c08f899ac93cf331d8b36d5b5462b8af126c1c7a1010923d657259fef70"
text = "草棚柱子上钉了块木板，上头满是刻出来的道道，标的是这个月的潮时。又四郎用桨柄敲着板面，说连着五日都要天亮登船，第六日任你们自便，别丢了命就行。“读不懂这块板上潮时道道的，夜里别下水。下了水也莫喊，濑户里叫哑了嗓子也无人听见——就算我听见了，一样不去。”"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_noshima:ledger","text"],null]']
src = "blake3:5a83c3dc11c43fb37030fee19a2f77b8c07cd572e9d40cf15d447f73fd8c4a23"
text = "番所的老账房将我记入见习册子，口里问一句手下写一句：年岁几何，打哪儿来，会不会凫水，认不认得字。录到“认得”，他抬头瞅了我一眼，翻到册子后半，上面一行行全记着过往的船：几根桅，吃水几尺，纳了多少。他说识字的见习，往后这几页也算上一份。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_noshima:omatsu","text"],null]']
src = "blake3:0445bec26cac04aa176f893c6d2e5e1f30bfeccefdd933fc61b6fb9b74bf1a4a"
text = "晒网院里，有位老婆婆坐在网堆上补网，梭子被她磨得发亮。她也不问我打哪家来的，先把我的手拉过去，翻开手掌端详两眼：“公家的手。”说罢递来一只梭子，指给我网上破漏的那一格。就这一格我一直补到天色擦黑，她凑近看后随手拆掉，自己动手又补了一回。"

[entries.'["upbringing/families/mio_intro.toml",["chapters","intro_mio_noshima:takamaru","text"],null]']
src = "blake3:52fa726e1e53cb5a3271d311b303420692a979ffb485697a2bf13671c79b757f"
text = "鹰丸正在泊位上刮他那条小早的船底。一看见我，他先拿刮子敲了敲船板上那一排刻痕：第十七场那一道仍在，底下又多出三道新的，是同岛上的人比的。我问这三道赢了几场，他道：“两场半。”随后便说起宫洼濑户哪年烧过谁家的船、他爷爷那辈一条船收几百文，带着年份和船名，接连讲了好长一通，船底却连一半都还没刮完。"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:fee","reply"],null]']
src = "blake3:d37ce81ac690d70ecf06bb839735bbe951a510990e4b7f57909985318e2dc112"
text = "灶间那头传出阿濑的回话：“两文。嫌少去找你娘——找夫人讨去。”"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:fee","text"],null]']
src = "blake3:d70aece3046861276c35abedc5797a9f0c8a445eb5bb6e498d583b6eb52f2be9"
text = "“阿濑，究竟给几文？过一条船三文，一日五条就是十五文，我早替你盘算清了。”"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:sixth_day","reply"],null]']
src = "blake3:a3f0eeeef4266689ccf43a07f2277dbb5caedca5edeabc258f6dda45277fef0b"
text = "隔扇那一头，母亲拨过一粒念珠：“明早先把幡多那一页念了再说。”"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:sixth_day","text"],null]']
src = "blake3:27958acefeac4d18ff0140e26cfeeaa36efcaee848caae9cd84c24422daad7ff"
text = "“两天潮，两天字，母亲排得倒匀称。第六行我也排上潮，三比二。”"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:years","reply"],null]']
src = "blake3:803cd84c3371bbc2f330d52888ff077da1357de981ac7bf04ba89b33312253c8"
text = "汐在铺的另一头翻过身去：“纸上可没写出是谁的船。”"

[entries.'["upbringing/families/mio_intro.toml",["choices","intro_mio_home:paper:years","text"],null]']
src = "blake3:424f5986d7ce38650141f5da7d5439cd8fdcc7b65d896871e5433d33e26f12b9"
text = "“离十六还有四年……我是六月生的，算下来三年半。”"
