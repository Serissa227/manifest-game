[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_ase_1554:event","text"],null]']
src = "blake3:3a7ee3c584d4dc16b53bb0637c2b5fecd22e3c911e8f1050fd33e661df8d6bb4"
text = "三月十二，能岛石缝里的山樱才刚吐出一点花影。今儿是阿濑的生辰，她身在下田，我守在能岛的船屋，当间隔着佐田岬与大半片伊予滩。西行的盐船得过十日才来一班，赶不上这趟，就只能干等下月。补网的阿松婆听我提起，停住手里梭子问道：“这岛上头，可有什么阿濑用得着的物件？”她还念叨，年少时自己曾同阿濑争过同一把网梭。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_ase_1555:event","text"],null]']
src = "blake3:fa748e2323c0a5ca6b83d65ef0f486c552476b042a4f784787cd573d77ae18a0"
text = "这年的信倒是阿濑先寄来。三月初搭着下田过来的盐船送到岛上，因母亲去了中村，这回替她写信的是下田的老渡守。那老头落笔细瘦，字架却撑得极大，一行勉强容下四五个字，里头句句都是阿濑的话：“生辰不必惦记。姬君在岛上，掌心的水泡可磨破了？又四郎训人凶不凶？”信封里还挟着一小撮晒干的海苔。我把信纸来回翻看数遍，她将周遭问了个遍，独独不提自己半句。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_ase_1556:event","text"],null]']
src = "blake3:c7d9f5ae219db2f5381d68cfdf09beb8254bf96fb1df3a1cc165b7a93642d60f"
text = "三月十二，阿濑满四十四岁了。岛上山樱绽了半树，落瓣让海风卷进泊位，浮在小早的船舷旁。西去的船夫从下田带来口信：阿濑那把竹网梭裂了口子，她拿麻线绕了三道凑合着用，稍一用力便夹手。阿松婆听罢，自腰间拔出自己的网梭打量一番：“她手里那把，怕是比汐的年纪还老。”西行的盐船，再等六日便要拔锚。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_1554:event","text"],null]']
src = "blake3:f5fbbde0d6f6eb658e71757f40042f12543c2ce0e48e8891cb2687f088b721ae"
text = "六月二十一，梅雨里的能岛潮得像能拧出水来，通铺被褥整月未干。头一遭离家在外过生辰，岛上向来只算正月长岁，没人记挂这一日；谁知清早去泊位，我那条小早的船板上竟被谁用小刀刻了尾歪歪斜斜的鲷鱼。晌午灶下的婆婆又往我手里塞了尾竹皮包着的烤小鲷，只说是人托她烤的，问谁却闭口不吐。前些天西行的船还带来兼定一张习字，上头“姊上”二字比去年大了不少，也比去年歪得更厉害了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_1555:event","text"],null]']
src = "blake3:80d46850b934c306e6a3ea3bba8b429d111d45bf4f055e49dcb6d6fc51e034c6"
text = "六月二十一，我满十五了。岛上依旧无人记得，我也不曾作声。下午在草棚归拢潮表，鹰丸往我跟前丢来一张旧潮图。翻过面，正是前日歌合里我败给他的那首，上头拿社里画潮线的朱笔批得密密匝匝，末了坠着行小字：去掉两字便成。丢下纸他便往外走，跨出门槛前又回身撂下一句：“不是给你过生辰。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_1556:event","text"],null]']
src = "blake3:a71e935c2bd5a0b15a4d4f355b5c2c2d99b45cf936b63276bef7ad0fcc18438e"
text = "六月二十一，十六岁了。清早晒网的阿松婆给我梳拢头发，说岛上女子发髻得扎紧，免得被缆绳绞进去。梳到半道她停了手，捻着发尾笑道：“都十六了，蓄这么长一头青丝，早该有人来说亲了。”她嘴里说得高兴，落进我耳里却像在盘点一件待装进木箱的物事。晌午西去的盐船靠了泊位，船老大抛来一截鲣节，原是阿濑托人捎的，硬邦邦如一根木杖，外头捆着下田的草绳，带话道：“姬君生辰嚼这个，别啃岛上那些咸鱼干。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_mother_1554:event","text"],null]']
src = "blake3:6e40f750f3654e8e0e14c8d0e7379f0ddb0b5cf318dfa3ee23e816f2a0e07910"
text = "六月十二是母亲生辰，我人仍在能岛。逢集那日，卖香木的商船又泊了滩，社里照旧讨来一包香屑蒙眼辨味，我头一回把伽罗与真南蛮分辨清楚。香客咂嘴赞叹，说我这双鼻头怕是被海风吹透了灵气。我忽而想起母亲经箱旁常年萦绕的一缕烟香，她最早教我认得的，正是丰后舅父那边送来的沉香。往西行的盐船，再四日便开航。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_mother_1555:event","text"],null]']
src = "blake3:7d8fe5cb0dd1ed705a35b1c4a755c1ab5d8a7943348170a50b90866a4079bfce"
text = "这年母亲的家书赶在生辰前寄到。信写于五月中旬，共三页纸，头两页尽是中村的米粮行情，末一页方才言及自身：丰后舅父遣人送来一面南蛮小镜，比寻常铜镜照人透亮得多，她举镜一照，瞥见自己齐肩的断发，便将镜面覆扣过去，搁到佛龛后头。收尾处问我：今年岛上歌合，又败了几场。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_birthday_mio_mother_1556:event","text"],null]']
src = "blake3:a37e6a7813497eee3e2015a14720ae47d61299da0771552f9f6712ebe4f7e24c"
text = "六月十二，母亲满三十六岁。兼定今年十三，一手字已写得颇有章法，赶在这日子前头托船捎来一张怀纸：他拟好上句，要我续上下句，凑成一首歌，再由我转寄中村。那上句是他咬着笔杆想出来的，问的是：中村的藤花，今年开了没有。纸边还附着一行小字，说他自己写罢先红了脸，这哪里像歌，倒像问账。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ase_2:event","text"],null]']
src = "blake3:e06b7871cb2f32f519d5d64e38014b751b7bef4a1cb804f843f0de70005dad51"
text = "三月初，打伊予过来的一条盐船在能岛门前候潮，船老大把一封信递到了泊位上。信封上的字大得越出了格，确是阿濑的笔迹。信才半页，假名紧挨着假名，写错处径直涂黑：“姬君。临走时约妥的，每月写一首歌给我瞧。一个月过去，还不见有。岛上的人倒传过两回话，说姬君抛缆，绳头三回掉进水里。我晓得。歌得短些，字得大些，我识得的字你用，不识得的莫用。”末了画了条小船，船头高高翘着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ase_3:event","text"],null]']
src = "blake3:b49e7715a5c373d792b19e37410146cf292f8cce26b95aeb56b7e02fe0ec6673"
text = "八月初，阿濑的回信到了，连同信一起捎来的还有一截麻绳，挽着七个死结。上月我在信里吹嘘过：跟着船坞的小早往鹈岛外海起网，涨潮时把渔家一条网绳卷进了咱们橹脚，船夫折腾半天解不开，我让他索性拿刀砍了，船登时脱了困。阿濑的信仅寥寥数行，墨迹压得沉沉的：“砍缆是走投无路才使的法子。一条好缆，光搓麻便要半个月，一刀落下去，钱就进了海。解得开的人，方配动刀砍。这截绳子，姬君给我解开，不准用刀。”绳梢上还粘着一片鱼鳞。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ase_4:event","text"],null]']
src = "blake3:4966bb537ed3d36aa6d7f38d622289399a7d2d0416fca7853fc235be2d11cae1"
text = "三月里，阿濑寄来的信比平日厚实。去年秋里，有个堺来的纸商在能岛门前候了三日潮，跟我处熟了，央我向番所替他求个情，先赊一面过所旗。我去番所替他说了情，他便带着旗走了。阿濑在信里写道：番所当初只收下一半钱，原说定年底补足，直拖到今日仍不见人影。番所查起作保的人，先查到了我，再往上追到引我上岛的人，这笔账就记去了下田。她回过去的话就一句：“人是我荐的，钱我补。”带信的盐船老大临走前，悄悄同我说，阿濑把原先留着裁冬衣的那匹布卖了。我翻出那天替纸商拟的字据底稿，看了许久。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ase_5:event","text"],null]']
src = "blake3:5b32e8378d0c259cd95d68d945b8de24719b1702bd89112be1d70a0e337ad90f"
text = "正值盛夏酷暑，从下田来的船捎进一个小包裹，封外写着阿濑的字迹：“姬君的旧物，归还姬君。”拆开一看，里头是枚拳头大小的葫芦，葫芦腰间缠着几道褪了色的麻绳，绳尾还系片红布。五岁那年我学游水，阿濑便是拿它绑在我腰际，我搂着这葫芦在河口整整漂了一夏。信上说道：“汐那枚我代收着。你这一只在网棚梁上悬了十年之久，连耗子都懒得啃。姬君眼下都在能岛学泳急流了，自然早派不上用场。人长大了，旧物该自个儿收好。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ase_6:event","text"],null]']
src = "blake3:416816383545e5a693ffea6d1ac963f245c30102218e32fdf6c8a8ec3b35f6bc"
text = "三月，阿濑的信里头一次说起明年正月：“政所发了话，待明年开春，船台架上那条小早拨给姬君。”紧挨着下一行笔迹透背：“我要一个准话。往后出了海，只要我说潮候不对，姬君便不许行船，一次也别想。能岛的潮你认了两年，下田的潮你却还没摸全。肯答应，我替你编一条束发绳；不答应，你自己动手。”翻开信背，见她用木炭绘出河口外几座礁石，旁侧逐一标明涨潮时水会没过几尺。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ichijo_kanesada_2:event","text"],null]']
src = "blake3:e3b0f546ca1c59a5b7f6d8ee7383fd3db6648466981195f8d1ce6a9eb4353cdb"
text = "兼定托西行的堺船捎来书信，在能岛外候了两日潮水方才递入我手中，随信还捆着一柄素白新扇。去冬我致信告知改赴能岛时，曾在信末应承他开春为新扇题一首歌，他倒是牢牢记着。“房通大人言道，今年殿中樱花将早绽，折扇总须赶在花开之前。姊上的歌可备好了？”下头还添了一行小字：“莫写鱼。”番所老账房替我自船头取回信件，端详封皮半晌，赞道这手笔迹颇具几分家主气象。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ichijo_kanesada_3:event","text"],null]']
src = "blake3:2056441e09451abde1e1cb97aa061ba9960e438022e177c41e487a699293587e"
text = "盂兰盆节前，兼定又寄信来。言称今秋要回中村探望母上，已去信调遣下田的小早于八月末赴堺迎候，船艏要竖起一条家的旗号，“教堺地人等尽皆瞧瞧”。读至此处，我登时坐立难安。八月底向来是野分狂风最炽的时节，近来岛上老水夫日日仰观西南云色，又四郎连鹈岛都不肯放小早驶去。偏他信末落了一句：“此乃家主裁定，姊上静候船只便是。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ichijo_kanesada_4:event","text"],null]']
src = "blake3:d9f2f551946035812fccc5fd3372154dd3e0bdd93090a5de0d6e1fff426a4af1"
text = "兼定这回字迹写得比往常都要工整，一望便知心里发虚。去岁腊月他寄信诉冤，称一条殿里几位公卿公子聚众闻香，自己竟拿不出像样名香。我只得求恳看守祠堂的阿兼婆，自龙神祠祭香中借出一小片伽罗寄予他，约好正月归还。他兴头上来，竟将整块烧了个净光。“那香乃神明之物，阿兼婆若追查，姊上亦难辞其咎。”下文接道：“故而此账归咱俩共担。我出半数，余下一半由姊上筹措。”笺纸边缘，分明留着一圈指腹揉捏出的褶痕。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ichijo_kanesada_5:event","text"],null]']
src = "blake3:5c2bdda40b688b8b2a93107fa95ef90954b314209bb9ae9ff61c64ff131be443"
text = "兼定托西航船只送来一只小小纸包，拆开原是半片蛤壳，缘口早已摩挲泛白。我一眼认出：他六岁赴京那年，我在下田海滩拾得一只海蛤，对半剖开，将这半片交他带在身边。信内写道：“我如今已是位列从三位之人，文箱深处尚存此物，教侍从搜见岂不惹笑。归还姊上罢。”另半片一直安放在我装潮簿的木匣内，此刻取出拼合，竟是严丝合缝。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_ichijo_kanesada_6:event","text"],null]']
src = "blake3:4861e43606f8af1d15173d1a61cf78e5cdbab766015819ee6ed3a914118de17c"
text = "自房通大人病倒之后，一条殿中便有人私下议起土佐来。兼定的书信正于此时寄至，字迹已不再歪斜，话音却仍是一派当主架势：“我若归中村，不搭堺商之船，单乘姊上的小早。由姊上掌舵。”其下空出一行，字形小了几分：“姊上出了海，日后不论抵何港口，均须先返下田一趟，好教我知晓。说定了。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_mio_mother_2:event","text"],null]']
src = "blake3:d637ba2e7a2a73fcf6b969a8d2757816f005128e5b67a487a7713e75891e25a5"
text = "母亲的信二月自下田发出，远绕过佐田岬，三月初方抵能岛。信纸折得端方周正，幽幽浮着一丝沉香，正出自她经箱常熏的那一款。先提下田的梅已开了，阿濑去河口捞起一筐海苔，继而方言及正事：“临别当晚你答应过的，上岛嗅得的头一缕香，务必寄字来告知我。是何种香，怎样一番气息，又教你想起了什么。我等你的信。”末了仅单单落着一个“母”字。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_mio_mother_3:event","text"],null]']
src = "blake3:115551da3feecfa34e57d2c1a281a2d03020b8da01e075f5ae6153eeae6ed1f8"
text = "盂兰盆前夕，母亲的复信送抵能岛。上月我曾去信建言，与其将幡多的稻米在下田廉价脱手予堺地商贾，不若遣一条家自家船只经内海运往堺去，堺地一斗米价几近抵得中村两斗。母亲回函不长，清瘦的字迹一笔一顿：“内海航道沿途皆设关卡，你足下所踏那座岛屿便是一关。你所言米价，乃是粮铺门前的市价，并非船只靠岸后的实得。”信尾复又附上一句：“既盘算得如此精明，便亲身去清点一回，回来报我实数。此番，暂莫附寄和歌。”鹰丸立在一旁听我念及“你足下所踏那座岛屿”，不由扑哧笑出声来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_mio_mother_4:event","text"],null]']
src = "blake3:5d9f207ff6aa6d132555c2ca64f813d828ad70a6e3c2fa1c60ee735ec1be6fe6"
text = "新春伊始，母亲来信中夹寄一页政所账目，誊录得一丝不苟。源康政大人颇嫌府外开销过于浩繁：兼定在京都本家的粮米、衣物、酬酢之资，连同我在能岛的食米、赠与船坞的谢仪，年复一年水涨船高。母亲于账页侧边以细字写明安排：中村那边的闲话由她一力承当，政所的颜面亦由她去周旋；至于岛上这边，嘱我亲手立一本账册，每逢月末封缄寄回，何处支用、缘何破费，须得一文一毫分明登记。“你算钱快捷，”她写道，“理账却忌只图快捷。”我蓦然记起上月里，曾动用家中寄来的银钱，打鱼贩小舟上购了一把现成的樫木船桨——殊不知船坞规矩，桨本该由学徒亲手削制。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_mio_mother_5:event","text"],null]']
src = "blake3:ee3d7e9e4e8c9545ebd6eabb94985ad9d8cd22bbf31f51f7496ad0838617779f"
text = "暑热尚未散尽，土佐驶来的船只带到母亲书信，并附一只油纸包。拆视原是一枚指节大小的沉香木，乌黑油亮，外裹一张色泽黯淡的薄样纸，纸面尚存教房公手泽：“借于本家。”母亲言道，此乃清点中村御所陈年库藏时寻出的旧物，八十余载前教房公避祸南下土佐，自京都本家携出这一块，此后一直未曾归还。“房通大人正卧病在榻，由你代我奉还。你身处内海要道，赴京船只较下田为多。届时如何措辞交割，你自斟酌。”我将香木凑近鼻息一嗅，纵隔八十寒暑，犹存一缕甘甜清芬，竟压过了满岛浓重的鱼腥气。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_family_bond_mio_mother_6:event","text"],null]']
src = "blake3:89196da1ffedb4457ca36503c8457a58a64691d83475173af20ceba0523b482b"
text = "三月初，母亲的信递到了，比平日厚实许多。政所已经应允：明年正月，我可以出海。母亲不曾阻拦，只在信中列出三桩事，每行写一件：头一遭出海，先朝东走南海路去堺，勿往南航；每年盆前回中村一趟；船上的账，月月捎来。末后另夹一张薄纸，是她照老船头言语抄下的港名，自浦户、甲浦直抵阿波、纪伊，每个港旁皆空出一格，“潮水几时涨，你自己问去，自己填写”。那三行嘱咐我端详了好多遍，偏是头一行最长。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_10:event","text"],null]']
src = "blake3:74abae8a00e4a44007de2ceb1e319431f5055360ec619d4836d14675b4a64bee"
text = "这是我满十六岁后的头一封信。岛上的夏天热得礁石烫脚心，泊位上晒着的小早，船板缝里直往外渗油。信是由博多来的船夫送上来的，我先寻那个墨点，在第三行尾上，点得比往日淡些。晚灯的字如今跟社学先生一般端正，半个错字也挑拣不出，我倒有些想念那个“以经”了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_11:event","text"],null]']
src = "blake3:7793f5c7e3421d7a9d7206bd7affd6f9c30a0282f6b6a5d92e614f1e9c1bd8be"
text = "结业考已过，装潮表的木柜一格接一格腾空，我的行囊也束起了一半。这封信送到时压根没有封口，只拿一根从灯笼上拆下的红线绕了三道。信是一艘陌生的博多船递到泊位上的，船夫说是平户一名船头所托，托信的人不肯留名。我凑在灯下寻了半晌，墨点在末一行，落墨很重。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_3:event","text"],null]']
src = "blake3:92bd676039c7f9f2e77b02cc2113a03ec5efeac96c5e8949be5dfdb74f640050"
text = "岩缝里的山樱绽了七成，我在泊位上拆了这信。信是先抵的下田，由阿濑托来能岛的盐船转捎，外头油纸画着那船老大的花押，剥开方见晚灯的笔迹。鹰丸系完船探过头来，非要瞧瞧唐土文字是什么模样，端详半日，指着“束脩”问是哪一宗钱。我同样不晓得，只得敷衍说是给先生买饭的钱。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_4:event","text"],null]']
src = "blake3:b0725994ea9affbb4fc7a5307f9c263f3ce9dc408d6918999ca517ecfc735093"
text = "嘉祥刚过，岛上暑气蒸得礁石灼脚。这封信是一艘博多来的船泊在门前候潮时送登岸的，同捆干海带挤在一处。纸是社学里专供描仿的粗纸，翻过去还能见着先生拿朱笔勾的红圈。她这手字较去年规整许多，白字唯余一个，已被她自己划叉正过。我避去了望岩背阴那侧展开细看，海风吹拂着，替我一角一角掀动信纸。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_5:event","text"],null]']
src = "blake3:870d70da42c326b72a0fce023ad9f94d25e203cdbc533d785911413308bd2dca"
text = "能岛落了头一场霜，晒网院子铺了薄薄一层白。寄来的信封口粘着圈惨白盐斑，拆开竟滚出一只小贝，贝背点着点墨痕作记。信中说明，贝拾自五岛，墨记是她专用的暗号，日后见着这记号方是亲笔，旁的冒名顶替一概不作数。阿松婆举起小贝迎着日光瞧了瞧：“外海的物件，濑户里可拾不到。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_6:event","text"],null]']
src = "blake3:ba78d44e1fb4cae3351cfdef63ecd1e16781149a8028b83878f1ca1a1fa1200e"
text = "才开讲月余，今年新发的桨得自己刨，草棚里个个掌心都磨出了泡。这封信送到时，里头还塞了一小包糖渍果脯，压得扁平，黏成一团，一角已起了白毛。阿松婆拈起来嗅了嗅，说了声可惜。我掰下没坏的那半块含在口中，酸中带甜，直甜到喉底。信写得极长，正面写满，翻过背面又接着写。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_7:event","text"],null]']
src = "blake3:bf5178b45c41f35320a37b0abf5dececc9930b446b1973f6ce51071f9d695bf0"
text = "眼看就是七夕，泊位旁又要立青竹，见习们都蹲在船屋里，缝着各自的小旗。博多来的船在门前候潮，船夫把信递上泊位，封口旁仍旧点着那个墨点。拆开一看，是社学的竹纸，正反两面都写得满满当当，收尾处却歪歪斜斜地多出两个假名，正是我的名字。后头那字的钩拐反了方向，瞧着像一条往回游的鱼。我捏着信看了半晌，手头那面小旗的边仍未缝完。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_8:event","text"],null]']
src = "blake3:3f88b13906dcf83f1cc532902cdcd143d17c9ad18d853b74cf9795916daeaf58"
text = "进了闰十月，岛上的风越发硬了，通铺夜里冻得睡不踏实。这信是从博多一路倒换着送来的，封套上一行挨着一行，落满了经手者的名头：月港的船、五岛的酒铺、平户、博多，最末一行是番所老账房的手笔：某日某船递上。信中夹了半片撕开的纸条，茬口参差，仅剩半行字：“回执。澪四月的信，七月……”后半边不知去了哪里。我借着龙神祠的灯光瞧了好一阵，想起母亲说过的勘合：大明发的船票劈作两半，齿口对得上，才准入港。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_letter_9:event","text"],null]']
src = "blake3:81742cd2f0957b9009ccda2e6fb6d6a56944a1fef9fafff6fb4a6c49c489af61"
text = "二月中，岛上的山樱还没打花苞，坞里的小早新刷完一遍桐油，海风里尽是那股油味。这回的信厚实，里头夹了一张对折的小账，晚灯的字一列列竖着排：代写家书十七封，每封三文；替天妃宫抄灯簿一册，得米一斗；最末一行墨色还新，是过后添写的：“今年的船，清明后看风。”我坐在泊位的木桩上看了许久。打今年开讲起，又四郎交代让我带新来的见习。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_omen_1:event","text"],null]']
src = "blake3:ca3e0164a6a8e8f5c7fd715482d0147254b0ed8e9901ead7b3c784c24564a9de"
text = "盂兰盆过完，一艘北国来的廻船在宫洼濑户口等潮，船上有个水夫上岸讨水喝。他是若狭小滨人，蹲在泊位边嚼着饭团，讲起故乡传闻：从前有渔家女吃了人鱼肉，自此不老，落了发，一直活到八百岁，如今仍在诸国奔走。“上个月朽木的山道上就有人撞见了，”他放低声响，“满头白发，容貌却像十五六岁的姑娘，问路也只问哪头有海。”鹰丸在旁补网，嗤了一声，笑称北国人的嘴比濑户的潮还多弯绕。水夫拍着膝盖赌咒，说是自家表兄亲眼瞧见的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_ase_illness:n1","text"],null]']
src = "blake3:ee2d3708fa9f5ed877541238cea54863e4824cf58a3e3870d260cfa4d352bf2f"
text = "登能岛还没满一月，土佐的信便追着送来了。母亲的笔迹依旧细巧，字里行间却全是阿濑的事：入冬风紧，她那右肩如今连网梭都拿捏不住，偏还瞒着不叫人透风给我。母亲去寻过中村的医僧，说是要根治非得去堺，那边有专看金疮旧疾的名医，问一趟诊便要百疋，药费还得另出；可下田去堺的船，非得熬到三月风向转了才肯发，这一来一回，怕是入了夏也赶不回。“你既在岛上，水手船夫的伤痛见得多，替我打听打听，可还有别的门道。”我把信纸折成四方小块，压进潮簿底下。夜里卧在通铺上，耳朵底下潮水一遍遍拍着木板，我直翻腾到半夜。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_ase_illness:n2","text"],null]']
src = "blake3:09e5b8e9c48edba824bd42c477a3a86f43f9f4ef83fe3dd226b45b004c2a1b1f"
text = "阿濑那肩膀硬是又拖过一冬。下田来的船老大捎了话，说她撑渡船时一篙没撑牢，连人带篙栽进了水里，万幸落的是浅滩。我径直去草棚寻又四郎。他听罢原委，先攥过我的胳膊捏了捏，说正主不在眼前，只好拿我的权当她的看，说完自己先笑出声来。他告诉我岛上治金疮陈伤，用的是贴黑膏药，要乳香与没药，皆是打南边海上几经转运来的，路过的博多船上有卖，价钱高得吓人。“怎么熬，我教你；药材钱，我可替你垫不起。”我暗自摸了摸怀里攒下的那串帮工钱。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_ase_illness:n3","text"],null]']
src = "blake3:303a9ff818622bc5c3d903b5d5c884124a0787c76610034ef74a87ddfa0180bc"
text = "岁末年关，下田送来阿濑的信，依旧是她自个儿那一手大字，一行里塞不下几个：“下河口了。憋气胜过去年。肩头阴天还疼，晴天不疼。姬君回来那天，先下水，再叙话。”末后还有一行，是派给我的功课：潜进泊位底下，摸块白石上来，得手了才许写信。这季节宫洼的海水冷得刺骨，阿濑那肩膀才见好几分，便迫不及待下去了。那日清早，我在泊位底下连潜三趟，只带上来一块黑的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_ase_illness:n4","text"],null]']
src = "blake3:5086380e5fc1fc8b4de7dc35398c1769e52533ce1628c0271f4629d31dfe8088"
text = "过了半月，阿濑又托人带来一封信，这回只字没提她那肩膀。她说，明年我出海，她要往我的小早上添两个老水夫，都是能岛出身，从前跟她一块儿收过帆别钱，年岁比她还长，浑身都留着伤：一个缺了两根指头，天一冷断处就绽口子；一个赶上阴天便说腰里有虫爬。“小早上没大夫。”信上写道，“船坞里头伤病见得多，又四郎那儿存着几手老方子，姬君学一手回来。我把人托付给你了，你可别再交回来。”我把信纸铺在膝上，好半晌没动。晒网的院子里，阿松婆讲那两个老汉她都认得，后生时一个赛一个能喝。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_boat_nails:n1","text"],null]']
src = "blake3:4f541e0c405d3b216b9eca67850ffb0f357f82531d1f7b8d160cb97ca161c796"
text = "五月里，母亲来信夹了一张揉皱的纸，是下田的老船匠央人画的：纸上画着一条船底，一道歪斜的黑炭线自船尾往前延伸，停在一个钉眼旁。母亲说，船台挨着河滩，春日大潮涌上来，船底在湿沙中沤了几日，潮退后又让烈日曝晒半月，才裂开这般模样。老船匠托人捎话问我：究竟整块换板，还是将就补上？换板费料，修补又怕下水复裂。我把纸摊在船坞草棚的木墩上，取四颗船钉压牢四角。鹰丸凑近瞧了瞧，说这道缝生得像宫洼濑户退潮后露出的礁脊。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_boat_nails:n2","text"],null]']
src = "blake3:3d6c5a0c1534225aa46ac173a3a5862548df75facbb2967a89a6ad182bf34406"
text = "政所转来幡多山主的书信，说小早待换的船板他山中有现成桧木，连砍伐、剖板带顺着四万十川放流而下，总共要这个数。数目列得不小，末了还缀上一句，言道今年买木的人多，堺的商人已上门探问过两回。政所手里没钱，这笔钱出与不出、由谁来出，母亲只在转信末尾添了四字：“你自己定。”我翻出这一年在船坞做工攒下的钱，拿细绳串好，一串串码在通铺上点过两回，看着像是差了一点，又像是刚刚好。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_boat_nails:n3","text"],null]']
src = "blake3:45ad8425b9b55f77b3739faa51cfabd6b6d5b0cf78c8759d528d3a58cc2ef1e9"
text = "未入梅时，下田捎来的信寥寥数行：小早船底已补妥，钉也悉数打齐，单留船首一根。老船匠言明这根他不下手，专候姬君归来亲手钉入。信中另附一张他央人绘的图，船首处以炭笔点了黑点，旁侧画着柄锤子，比船身还大出许多。母亲在后头添注一句：船台停放日久，木料易走形，政所催着下水，说等不及秋日。我算了算，最早也得九月探亲方能返土佐，届时小早在船台上已搁足三年有余。这三年来，我在能岛船坞目送旁人的船一条接一条下了水。纸上那一点黑，直直地像是正望着我。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_fudaraku:n1","text"],null]']
src = "blake3:caa387e16b655f5f827432e1c709e7089de3b3a9cdec583097c7806f9395e026"
text = "将近盂兰盆时，一条从熊野过来的船停在能岛门前候潮。船上走下个熊野比丘尼，背着竹笈，笈上悬着一幅褪了色的图，在泊位边给等潮的船夫讲那智的事，讲罢便伸手讨香钱。画上绘着那智的瀑布、浜边的鸟居，海中一只小船，四角各立着一道小门，门上写着发心、修行、菩提、涅槃。阿松婆扫了一眼就扯我袖口：“那是死人坐的船，看它作甚。”我没走开。图上的海岸歪歪斜斜，船头直指正南，跟土佐船头嘴里的黑濑川总也对不上。比丘尼瞧我盯着不放，咧开嘴一笑：“姑娘好眼力，这图正是那智山上的人画的。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_fudaraku:n2","text"],null]']
src = "blake3:134b225732bd3afbdcaf63ffc75600fa5333e37c00cb57ed22f131c69a57307c"
text = "这幅图始终盘桓在我心头。今夏听人风闻，对岸大三岛有座小庵里暂住着位熊野的老先达，平日专给朝山的香客引路，手边竟藏着自那智山上抄录的年代记。恰逢社里放半日假，我央托番所的小早顺道渡我过去。老先达端坐佛龛跟前，几根手指尽是被念珠磨出的厚茧，开口便言此册绝不示于外人，除非奉上一份初穗。摆渡的老水夫凑到我耳畔算起账：“这笔钱，够添整整一月的灯油。”老先达听得分明却不着恼，反倒将书册朝怀中敛了敛：“姑娘打听的，究竟是谁人渡海，抑或他们漂往了何处？头一桩册上有载；后一桩，谁也写不出。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_fudaraku:n3","text"],null]']
src = "blake3:1c374832dbfefc241bee75c8ca2d786b697c4610bea9d08e64d661b9a8ab89a7"
text = "及至六月，我便满十六岁了。存放潮表的木柜中，属我的那一格已塞得满满当当。我将这几年积攒的纸片尽数摊铺在草棚泥地上：手绘的、手录的、自他人话头里誊抄的，外加零星记着潮汛时刻的怀纸。我打算拼凑出一幅从堺直抵足摺的南海航路图。甲浦、室津、浦户、须崎、下田、清水，循着西向一港连着一港仔细勾勒，及至画到足摺岬，笔锋却悬停纸面。再朝南便撞上黑濑川，更南面，正是那些钉死的船所去之处。又四郎打棚外经过，驻足凝望半晌才开口问：“空下那一片，你准备填什么？”尾随其后的鹰丸拎起桨柄，朝岬南那片留白虚点几下：“依我看，反倒是这块空白最顺眼。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_kanesada_letters:n1","text"],null]']
src = "blake3:d2b2b1067fc02ad57054dd99138114b6e3aa32cba6a102ec37724ffd91c7abcb"
text = "兼定的信随西行的堺船抵至能岛，夹附着两页他摹的字。去年母亲托船寄往京师的那册习字本，正月方到他手中，他视若珍宝，每日清晨临一页。可临至中段，纸上一行行却写着：某村米三石二斗，某村欠五斗。他在信里问：“姊上，这莫非土佐那边的新写法？侍从见了笑我，我瞪了他。”他才十一岁，最怕人笑。我对着他临的那两页瞧了半晌方才明白：原册里那一页本是粮账，是装订时错与歌缝到了一处。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_kanesada_letters:n2","text"],null]']
src = "blake3:9ed697a8f9a42cec3986a6dca425adb65797f014fda76fa1bf84becbe5a55ff4"
text = "四月间，母亲的信到了：去年秋天兼定托船带回中村的习字，一张也未收到。那条船在甲浦遭了风，舱里进水，捎带之物泡烂了一半。越过几日兼定的信亦至，自陈读完母信后，把信纸攥作一团，又一点点展平。他十二岁了，一年攒下的三十余张字，原是预备呈予母亲看的。“重写便是。”这几个字落笔极快，墨迹却洇开了一块。本家存纸早用完了，兼冬大人的周年法事甫毕，账上再支不出钱来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_kanesada_letters:n3","text"],null]']
src = "blake3:750dbd3226aa2abe01d09f9895a2a65a6daac017179d6abb109ffe7faa62aac1"
text = "房通大人自入春以后便起不来身了。兼定来信提及，本家众人说话皆压着嗓子，然而谁心里都明白，他早晚要回土佐。政所的康政大人致书问询，待当主返回中村后，奉书上的署名及对家臣的称谓当如何定下。兼定将原信照抄一份寄与我，十三岁的人，字迹已然沉稳。“在京里，旁人背地唤我‘土佐的’。归去之后，他们便要叫我御所。”他将“御所”二字写了一遍，又写一遍，写得极用力。“那姊上呢？姊上又要叫我什么？”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_kanesada_letters:n4","text"],null]']
src = "blake3:e939d4495e215f157862d79961dc0c31d6ff30b04ab11e1ec83254fe938b608e"
text = "下一封信接踵而至，夹着他习字本的末页，上头写着“姊上”二字，较三年前寄往土佐那张端正许多，唯独女字旁还是大了一点。他说这封信乃夜里坐在廊下所写，未曾睡下：“待我回去，姊上是不是便要出海了？那姊上每到一处，就捎信回来。用假名写，写那里的潮几时涨。我认得假名。”信纸边角叫他拿袖口擦得起了毛，那里其实并无半点墨。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_mother_accounts:n1","text"],null]']
src = "blake3:259eac4bf7733d0efebea8ed0783749ed989e38fb5430c869f8846accc5314ce"
text = "待岛上山樱开罢，母亲的家书方才送到。信是正月底自中村发的，在下田候了半月船，复绕过佐田岬走了几日，拆开时纸角已然潮软。信用假名写成，语调依然慢条斯理：中村一切安好，只是去年秋天四万十川涨水，下游七户庄户的田泡了半月，年贡交不齐。政所的人主张照旧催，母亲意在缓一缓。信后夹着一张欠租清单，系她照政所的账抄录，七户的名字、田亩、该交的、欠下的，一行行皆列得清楚。末尾一句：“你在岛上，隔得远，看得反倒清楚些。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_mother_accounts:n2","text"],null]']
src = "blake3:800a4f6d963dae95580920af2522e48608bd3cb988126fd1bf3f63962d821af8"
text = "入春以来，中村解送来的口粮米仅有往年的七成。按见习的规矩，打头一年起口粮便是自备，灶下的婆婆量米时提起我那只米袋掂了掂，没说话。随船的还有母亲的信：去年七户的租或减或缓，政所的仓里随之空了一块，须先紧着中村御所，京里兼定那头、岛上我这头，俱只能少送。信里未曾明言的是，船坞岁暮要收见习的谢礼，番所的老账房已来问过我两回。我将这半年的开销一笔一笔摊开：口粮、草鞋、灯油、给船坞的谢礼……哪一笔也省不下来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_mother_accounts:n3","text"],null]']
src = "blake3:554dc41f7a650639da2c95556094849496f1fbc0e5a24d96c306e2d3a92c4312"
text = "三月，中村来信，言及康政大人讲兼定明年便十四了，一条家这三年的粮账该从头理一遍：中村收了多少，下田运出多少，各处实收多少、用到何处，几处的数须得接得上。中村与下田的账在母亲手里，京里本家的在兼定的家司手里；另有一份在我手里——这三年一条家的米船、盐船过能岛，所缴帆别钱、所讨过所旗，番所叫我记，我便夹在潮簿中间记，有的落于怀纸背面，有的记在用过的歌笺上。我将它们全倒在通铺上，堆叠如一座小山。鹰丸蹲在一旁乱翻，翻出一张背面写着歌合草稿的，才念出两句便被我抢了回去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_mother_accounts:n4","text"],null]']
src = "blake3:253fbbf02a559a7f994a9b23c7d7872b02acffce0f21874b59aacd9d94076870"
text = "入夏前，母亲复来一信，较往常厚实。她说康政大人看过几处的账了，数目大致接得上；等兼定将来回了中村，她便将一条家的家计交还政所，自己只管寺里的事。信里一笔一笔列着她这几年经手的册子：粮账九册，庄户的名簿两册，借贷的契书一匣。末尾她问，交还那天欲附上一份能岛那边的过路账，我能不能写一份干净的，要我自己的字。信纸上有一处洇开了一点，像是落过水，细看又像不是。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_river_claim:n1","text"],null]']
src = "blake3:035a627dc1277f4f4a62d0616a29b671ede531491e89cb798f7c2e583066d408"
text = "九月里，岛上暑气尚未散尽，中村寄来的信中附了一纸抄件。去年遗失的三捆楮皮至今不见踪影，货主再度上门讨要，政所宽限了渡守几回，这趟把话挑明了：十月底再交不出货，便拿他的渡船抵账。母亲央求政所的船番，把去年九月那几日的泊船录抄出：何日何时、何船自何处来、系于哪座栈桥，共计十一条。我在能岛天天翻番所的过路簿，这账目一扫便明。信末母亲代渡守问了一句：姬君去年在岸边盯了那样久，可曾看出些端倪。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_river_claim:n2","text"],null]']
src = "blake3:cf6712600798e254fd6ad2c45bc617964488992b60083a2951ef9a146c771ebf"
text = "八月回土佐省亲的那半月，我只听说渡守的船已押了出去：限期一到，他把船押给市集米商，勉强凑够数目赔了货主。回岛尚不满半月，母亲的信便追着到了。那三捆楮皮终究在对岸盐仓里寻着了，是清水来的盐船认错了货，顺手搬了进去，可惜找着时已错过了几天。货主今年改往堺做纸生意，船走内海，十天半月总要在能岛外头停一回潮。母亲说渡守如今替人撑篙，一日挣的不够一家糊口；而货主那头把话说绝了：钱既收了便是收了，那楮皮他不要了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_river_claim:n3","text"],null]']
src = "blake3:8c7237af55a0820179119c4e3912824050665233fe5f48ae7895f8b4539e1bc4"
text = "九月返归土佐，船才驶入下田河口，我一眼便瞧见渡口换了旁人。新渡守生得瘦削，说话细声细气，撑出一篙还要喘息半天。从前那位大嗓门的渡守正蹲在岸边修补渔网，见了我起身行礼，随即又蹲回地上。原是政所记挂着他丢过货，打去年起便把官渡转包给了米商的侄儿。纵使楮皮早已找回、账目也已两清，渡口却始终未归还于他。他将渔网往膝上一搁：“姬君，这条河我摆了整二十年，哪处藏着暗沙，闭着眼睛都摸得准。”河心处，新渡守那条船正被退潮冲得打横了身子。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_tosa_forge:n1","text"],null]']
src = "blake3:e67b7ef96ad42e1f2d1e6f735857bf463f6848578fd3d62dec33d8a420266c91"
text = "六月里，岛上的梅雨比土佐还要湿黏，船屋板壁上浮出了一层白毛。下田过来的船带来了铁匠的一块木片，上头用炭条歪歪扭扭勾着三样物件：一把镰、一只桨环、一只锚爪；随木片一并捎来的，是母亲代他写下的话。今年的炭只够打上一样，要么先打庄户秋收使的镰，要么先打政所那条小早待换的船具。铁匠话里说两样都紧要，由姬君来定。他又讲，图全凭记性描下，大小未必准当，顶好有个样子照着打。鹰丸瞟了那锚爪一眼，说像只螃蟹，岛上的螃蟹都比这画得像。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_tosa_forge:n2","text"],null]']
src = "blake3:2ed3275776d40cd0290126e5277cf36ef15961bb43a9daf394c0cd82d2d3d872"
text = "五月连绵的暴雨冲塌了幡多山中的炭窑，炭户一家逃下山，今年怕是一俵炭都指望不上。母亲在信中说起，铁匠只得改烧松根，松根火苗窜得老高，却忽旺忽衰，锻出的铁器硬的发脆、软的发绵，叫他破口大骂了半个月，整条街巷无不听见。外乡山里虽还有炭窑，但与下田的铁匠素无交情，谁也不肯赊账。信末铁匠恳请母亲代问：姬君身在能岛，过往船只极多，能否设法通融一二。同船还有兼定的来信，他得知此事便昂起胸脯：“我既为当主，姊上只管开口，我发一道奉书勒令他们赊账便是。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_noshima_side_tosa_forge:n3","text"],null]']
src = "blake3:993408ded56de60443caac14d36bc9c5181433e3898b01038e08563e74a65401"
text = "六月里，下田的来船带了个扎得严严实实的草包，麻绳间别着一根鸟羽。拆开瞧，是只新出炉的桨环，铁色沉黑，内壁磨得锃亮，外沿还凿着只歪嘴鸟——那是铁匠的铭记。母亲附信言明，铁匠先送这一只请姬君过目，若姬君点头说行，其余锚爪与铰链便依样打造，赶在年底前全数交割到下田。我随手将桨环套上腕子，沉甸甸直往下坠。鹰丸接过去颠了颠分量，咧嘴说这东西拿来砸人准定疼得要命。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_ase_noshima:n2","text"],null]']
src = "blake3:6bbe2faad09093f0423146b30e501dfa73aec9a7b35bde610971d019e58ba579"
text = "番所的老账房死了，出殡那天，岛上的船一条也未出泊位。回程路上，番所一位老人叫住我，喊的是“濑家的小鬼”：“你乳母该回来了。”他说岛上认得字、会算、镇得住过路船主的人所剩无几，阿濑当年是数一数二的。“她不听我们的，她听你的。”晒网的阿松婆在院子里听见了，停下梭子往这边看。老人说完就走了，独留我一人站在晒网的竿子底下。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_ase_noshima:n3","text"],null]']
src = "blake3:31be292a6c4e842147e79ab8938a3cd5b126aefe7bea0f5214fe9d42884e8f11"
text = "入梅以前，番所里誊今年的旗账，又四郎叫我去帮着念船名。誊至最末一页，执笔老人笔尖顿了一顿，跳过一行，接续往下写。我认得那一行，往年的旗账上都有：“下田·濑”。我念到那里，老人开口：“不回岛的人，不算岛上的人。”又四郎倚在门口剔牙，剔到一半把牙签扔了：“那一年要不是她，我早沉下去喂了鱼。”老人头也不抬，接着写下一行。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_kanesada_noshima:n1","text"],null]']
src = "blake3:57d7c2615cb1a1d5699470f9f09954c1dfcb56f9e8fa5d88d420e13d5eb66c99"
text = "入秋时，有艘开往土佐的堺船停在门前候潮。船头蹲着个干瘦老头，一声不吭。鹰丸说他打听了两遍，一条家姬君住的是哪间通铺。来人是弥平次，先前随兼定上京的老侍。见了我，他先跪倒，而后才道出原委：殿下替房通大人前往奈良春日社献供，在春日野里用他的半弓射倒一头小鹿。“那箭是小人放的，”他说，“在神官跟前小人这么认，在姬君跟前也这么认。”话没说完，他眼光却总往船舱里瞟，他那张半弓正搁在里头，弓弦已经卸下。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_kanesada_noshima:n2","text"],null]']
src = "blake3:69b8a726793e577bd11230b1bebc8068cd907f6175885c32825dcc58573f1841"
text = "春初，兼冬大人的周年法事才罢，兼定的书信就搭着西行的船抵了能岛。封套里头只裹着单薄一页纸，没写抬头，也没署款，正面端正立着一行字：“人死了去哪儿？”翻过背面，还有一行小些的字：“兄长去了哪儿。父上去了哪儿。那头鹿去了哪儿。”带信的船家道，京里那位小殿下特意交代过要等回音，可船停在门前，只候这一潮。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_kanesada_noshima:n3","text"],null]']
src = "blake3:573d19e413d362acaa75b5e24a1f68e6594e2bc4b6ff60fee3979caf37c74df1"
text = "夏末，西去的盐船把兼定的信捎到了能岛。是他亲笔写的，写得极短。中村差人进京迎他回乡，领头的是诸大夫，后头随了十几个家臣，末一个迈进门的是弥平次。“他同旁人一道跪下，头叩得一般深，抬起脸说：殿下长高了。”写到此处，空出了一行。“姊上，我哭了。不知是为什么。眼泪原来是热的，从前我不晓得。”信纸上有一处洇开了，比一旁的字还要大。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_rosary_noshima:n2","text"],null]']
src = "blake3:eac29f2f69bf6ffa925e4c4778dc1449b27a4e9b4d954c84750da1dcaa49337d"
text = "九月底，西行的堺船在岛前候潮，顺道捎来母亲的家书，就夹在中村的粮账当中。账册由政所书记誊录，母亲在页边用小字一笔一划批注：哪座庄园缓租，哪条船只改期。写至末页，笔迹骤然放大了几分，墨色也重了：“近来夜间诵佛，念着念着，总似听见他在隔壁翻书。我便住了口细听。听罢，那一声佛号竟再也念不下去。”这行旁侧划了一道墨线，却未涂去。泊位下的海潮正往外退涌，我立在通铺窗畔，将这一行字足足看了四遍。"

[entries.'["upbringing/families/mio_noshima_life.toml",["chapters","c9_mio_rw_rosary_noshima:n3","text"],null]']
src = "blake3:2aaffe0a55956c27aa09121c226b23e9169416963a039661280cee6896dccf41"
text = "入夏前，母亲的来信比往日长了不少。丰后的舅舅派人到中村送年礼，来人谈起府内近事：南蛮僧人在城中讲经，有个受过洗的老渔夫当众痛哭，只因他双亲、祖父母皆未受洗，僧人道那些人如今全在火里，谁也捞不上来。“义镇来信说那些人的经讲得好，”母亲写道，“可一尊神只肯收他亲自点过名的人，比弥陀还要小气。”底下另添一句，墨色淡了些：“不过弥陀收不收，我原也是听人说的。”鹰丸就在旁侧拴缆，开口问我信中写着什么，教我脸色如此难看。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1554:event:make","reply"],null]']
src = "blake3:6e3360e08c5e3e3d76f46b2d60b680bf162d141d171d5029906faf95d7c64e14"
text = "赶集日泊岸的行商船里，正好有一艘专卖伊予砥石的。我同阿松婆蹲在舷边拣了许久，相中一块巴掌大的青灰细石，磨出的刃口利落不起毛。拿油纸裹了三层，便托盐船带了去。五月初回信寄到，是母亲的字迹，代传的却是阿濑的口吻：“刃快了，人手反倒偷懒。你跟阿松往后别胡乱花钱。”信尾母亲又加了一行小字：那块砥石，她收在枕边。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1554:event:make","text"],null]']
src = "blake3:9a2110d028507a0e1d59ffd72b4a5a2d515812fe1c287579e576c8e29a151f2d"
text = "往伊予商船上拣一块砥石"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1554:event:remember","reply"],null]']
src = "blake3:7350bf636f7cd1115813c8ea2f5ee5aaec0b330a2ef2647a59562c02a3ffe970"
text = "我素来不善拣货，唯独算潮拿手。按又四郎授的月龄推算，下田河口此时正该落潮，阿濑八成挽着袖子到肘弯，蹲在沙洲上摸蛤。我取过潮簿，用假名记下这句，顺手在旁勾了一道曲曲弯弯的河口。阿松婆探头瞧见，笑称阿濑幼时挖蛤，总爱挖过别人家的界去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1554:event:remember","text"],null]']
src = "blake3:0179a78d5048d06f11e1218d913f28900f919c85dccf1012fdd295319007c4a0"
text = "算算下田这会儿的潮"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1555:event:make","reply"],null]']
src = "blake3:424021ecc5209de07f171162de394f2953a9ff7eecc4a9262fed50215d264601"
text = "岛上那些老水夫冬日入水前，总爱在怀里揣一块烘暖的温石。我上滩涂拣了枚扁圆石头，拿船坞裁剩的旧帆布缝了个布袋，阿松婆帮着锁边——歪扭的针脚出自我手，细密的则是她补的。信上我仅落了一句：晨起下水之前，揣到右襟里去。五月盐船返航，带回阿濑的回话：“揣在怀里呢。只是姬君的针脚，依旧是歪的。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1555:event:make","text"],null]']
src = "blake3:3d24355b6dd5ca977499ba8e0bdb813eabfb52928ec41dce03178e5776ba0597"
text = "给温石缝只布套"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1555:event:remember","reply"],null]']
src = "blake3:2940cbe7cbd98538909eff1e52c745fe46f492253a0971b5481515044ee9804e"
text = "我将海苔凑近鼻端一嗅，正是下田河口落潮时的咸腥，还裹着芦苇根底的泥气。在岛上嗅了一整年的海味，与这股气息截然不同：能岛的海势急，下田的海性子慢。我在潮簿中写罢半首和歌，后半句一时续不上，干脆拈起一片海苔夹入那页，充作下句。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1555:event:remember","text"],null]']
src = "blake3:8f569bad41be6692b1d76998a41483a4f8e40dc6186b0720d09f64727fce795a"
text = "嗅着海苔念起河口"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1556:event:make","reply"],null]']
src = "blake3:0dce343fc114ec5525de67026a43ef6cd761028029a2f5412c7e612b90665eed"
text = "我央求船坞里的老船匠，拿刨船桨余下的樫木削一把网梭。他平时斫惯了大块船板，哪做过这等细巧物件，只得拿阿松婆的旧梭比着尺寸下手。连废了两块料，第三回才算削成，梭背打磨得宛如桨柄般溜滑。四月底盐船带回阿濑的口信：“新梭轻巧，使着不酸手。偏生太滑，我又绕了一圈麻绳。”阿松婆听我念到这儿，笑得手里网梭都落了地，俯身拾起时顺道揩了揩眼角。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1556:event:make","text"],null]']
src = "blake3:639bd68fdffce51230b84e81964089e2d62b80879d0cfeaf513f020aaf8c2220"
text = "请船匠削一把樫木网梭"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1556:event:remember","reply"],null]']
src = "blake3:cad1f91a019ce08e2713d8d652c347fb942f3de7fb22228dc9e4e2ccb684780b"
text = "那日黄昏，阿松婆坐在晾网的院落里，细说她同阿濑少时在岛上跑潮的光景：从这船纵身跃往那船，手从来不搭船舷；有一次失足栽进宫洼的湍流里，刚一露头，先顾着把攥在手里的那捆缆绳高举过顶。这般旧事，阿濑从不曾对我提起。我翻过潮簿背面逐句誊录，写到“缆绳高举过顶”时，自己先忍俊不禁笑出声来，阿松婆也随之笑开了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_ase_1556:event:remember","text"],null]']
src = "blake3:3a570023a0afaa30f3ba5176a9fd71ffff8c8dfe546c1bc5114e387c6d7a3b0a"
text = "听阿松婆讲阿濑年少往事"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1554:event:make","reply"],null]']
src = "blake3:d50109a8b0a60b16b1701685890e3a0e06790dae58fb149c943a71116dcbb9b1"
text = "我拿砚台压住那张习字，冲着它暗下话头：十四岁这年，不论社里的歌合，还是划小早过濑户，我绝不叫鹰丸赢去半场。晒网院子那头的阿松婆听见了，打趣说姬君又在同砚台斗嘴。入夜通铺吹了灯，我在暗地里把潮表打头背到底，直背到头遍鸡鸣，嘴唇都发了干。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1554:event:make","text"],null]']
src = "blake3:46a272a02af3ebd817f3568bc23b0e318219d698d1ef838cfda3d06a34dd3167"
text = "冲着砚台立下誓言"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1554:event:remember","reply"],null]']
src = "blake3:e7a2a5ad20d5c5f160f58511c392ff8bc9c22a3636361942668feebd46af0749"
text = "我把那张包鱼的竹皮洗净阴干，压入潮簿，皮上仍泛着层鱼油亮。侧旁记一笔：十四岁，能岛，梅雨，鲷鱼烤咸了，兼定写的“姊”字缺了一横，船板那尾鲷的眼珠刻偏了。记罢拿去泊位，对着那刻痕端详许久，终究没辨出是谁家的刀路。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1554:event:remember","text"],null]']
src = "blake3:f68675984246b9f516c4223582abc00c3137b968c320f62ddba82b4253e602f2"
text = "将包鱼的竹皮夹进潮簿"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1555:event:make","reply"],null]']
src = "blake3:a3d66e56ae0e9ee61c33b62ce80d4093e47342e078a8eb5588003ac95e883a3b"
text = "捏着潮图，我径直上泊位去寻他，说：改得好，那再比一首，题目由你来出。鹰丸先是一怔，嘴里说着“少来”，耳朵却一路红到了脖颈。他出了个“夏潮”，我坐在桩子上咬着笔杆，直想到天黑才写出来，到头来他只划去一个字。回通铺的路上，阿松婆说我走路那架势活像要去打架。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1555:event:make","text"],null]']
src = "blake3:9c851e1f2004bf65993d6369b4fb67e2399fae6ea93a2706325682b17eb6c7e8"
text = "拿潮图寻他重赛一首"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1555:event:remember","reply"],null]']
src = "blake3:7bb3e0b9457db4bb2c5530ecf65831984b083d79c7262197f89839b4b4bad912"
text = "我未曾去寻他，只趁天未亮摸上了望岩，摊平潮图逐字细看他勾去了什么：被删的是“泪”与“空”二字，留下的几句倒更契合我本意。我顺着低诵几遍，记熟了誊入潮簿。次日操小早，鹰丸在邻船问我可背会了。我回说没有。他鼻子里哼一声，手里划桨的劲道却沉过往日。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1555:event:remember","text"],null]']
src = "blake3:e59531b4145e4a98c24158e8294b5a6c26801bf1c16f246278afa53ac0284466"
text = "记熟他批改过的歌"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1556:event:make","reply"],null]']
src = "blake3:408c4372a897bb2c60ce7900e875096211bb8b59f9c37b7147dfb68ff048e61e"
text = "我回过身冲阿松婆道：真要有人来提亲，叫他去下田河口寻我，我就在船上。她手里梳子“啪”地落在席上，好半晌才拾起，嗔道一条家的姬君岂能说出这等话来，话音未落自己先忍俊不禁。我收拢长发挽在脑后，自个儿拿根细绳勒紧，扯得头皮作痛。院墙外头，鹰丸轻咳了一记，拖得倒有些长。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1556:event:make","text"],null]']
src = "blake3:4810f027c2736ff25923e3514b82d2640c9514fa4c264dd555fef89b766598c1"
text = "回阿松婆说我出海去"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1556:event:remember","reply"],null]']
src = "blake3:2b590b514435e9d60df547c113838e0d6aac8ba54670bedf73933bfd17dde1bc"
text = "我没搭理阿松婆的话头。日暮时揣上鲣节登去岬角了望岩，拿小刀削出一片片细嚼，顺道往南边远眺。能岛看得着海面，却望不见土佐，中间横亘着伊予的山影。鹰丸不知何时也跟了上来，摊手讨走一片，边嚼边说这会儿下田正涨潮呢。我把削落的薄片摆在岩石上，拼出个河口模样，他低头瞧了瞧，评道沙洲摆小了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_1556:event:remember","text"],null]']
src = "blake3:3612cc2ec703fd1c24ec0e5d79c0ffc9dc96e3be5d0b66771664a042d515147b"
text = "登上了望岩削鲣节"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1554:event:make","reply"],null]']
src = "blake3:7b7c20294d14d61c611bda8f5723339812dae0972ed090eb1a74c3caf2a62a05"
text = "香贩子可不肯白送。我帮他把满舱香木逐一分清品第，又替他核了一下午账目，方才换回指甲盖大小的一片伽罗。拿薄样纸裹妥，纸上题一首和歌，说海上夜雨亦作此香。七月末母亲复信寄至，措辞一如既往地含蓄委婉，唯独末行写道：那点香舍不得燃，拿怀纸包好压在佛前香炉底，每日早课前必先凑近嗅上一嗅。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1554:event:make","text"],null]']
src = "blake3:9a3749feb6e694fdd000d7cc40289d257e8c962a1b696a7ec0fc0c55886d7dc6"
text = "同香贩换一片伽罗寄母亲"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1554:event:remember","reply"],null]']
src = "blake3:d8ccec73f3ab1335807cf67782aacae50dbf25c8512cfcf04e160fd137266f1f"
text = "入夜通铺灭了灯火，我怀揣一片最贱价的沉香潜至龙神祠，凑着长明灯引燃，置在一枚蛤壳上静静熏烤。袅袅烟气散开，恰是母亲袖底常带的那缕气息，里头又夹着海风的咸涩。我合眼默想她此刻该拨到第几粒念珠，思量着，香便化作了灰。潮簿中仅留下一行：母亲三十四岁，能岛雨落终日。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1554:event:remember","text"],null]']
src = "blake3:cf9ba3814c85d65252896cf1efe9b7f06da8eb7befd218f95c4a268453067223"
text = "独自点一片沉香"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1555:event:make","reply"],null]']
src = "blake3:65d632e14ec5add9a7202a6499163b8889cd3c2af383e96d3b5b0ef2d34c559c"
text = "我将这半年来社中咏比过的和歌逐首誊清，胜出的列于前，败阵的殿于后，败歌旁再附抄赢我的那一首。总计十九首，败了七首，其中四首败在鹰丸手下。六月末托盐船捎走。母亲回信讲，恰是落败的那几首最合她心意，特意抄在粮账末页，每核毕一笔账目，便先吟咏一回。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1555:event:make","text"],null]']
src = "blake3:bb8a86e3feb2a3dbab669388b4f3cfe948ffaa348510cea2c1c1e2a2866aea40"
text = "将今年的歌抄成一册寄去"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1555:event:remember","reply"],null]']
src = "blake3:85d5accc67b5d9c75c487e1e73941da92a1596bf841c61c4d5040966ded366ad"
text = "放下信笺，我踱到泊位边蹲下。平潮时海面静如明镜，映出的人影黝黑，眼神倒比去年更显凛冽。阿濑总说我眉宇肖似父亲，往日我不以为然，今儿临水端详半晌，仍辨不出究竟像在何处，只觉这张面孔较去年舒展了几分。潮水一动，水影便散碎了。入夜在潮簿落笔：母亲三十五，于土佐照南蛮镜；我在能岛照海水。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1555:event:remember","text"],null]']
src = "blake3:8fa62f11950a8df4962186a8765d99a99f0b50dc7774428393b6c1f32772a05b"
text = "俯身照一会儿平潮水面"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1556:event:make","reply"],null]']
src = "blake3:a6df73027658571e9a58d490288b06dab128dec6c1181270963ff9fd22da303f"
text = "我替他续了下句：开了也好，未开也罢，待船靠岸，海上的人便回去看。他字大，我的字缩在他下头，看着一大一小。封好怀纸寄往中村，顺手另誊一份回京，兼定捎信来嫌我这下句太拖沓，真要他挑又说不出长在何处。到了七月，母亲回了一行字：藤花早谢了，叶子倒还青着，等你们两个。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1556:event:make","text"],null]']
src = "blake3:a5a63c9a455937b31e8875da509ece778ea6e564e82036453d6b1b532e7770a6"
text = "帮弟弟续完下句"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1556:event:remember","reply"],null]']
src = "blake3:49dcb384cd65960a70e3a8977ce7c6ea4691c5fe852d68af281a668b2280c8af"
text = "我没往下接，把怀纸照原样寄回京中，信里单写了四个字：自己写完。过了半月，他又寄来一张，说是写了撕、撕了写，直到天黑才凑成下句：藤花若还没开，便等他回去再开。字写得歪斜，意思倒不差。他连撕掉的那几张也一并寄了来，说是给姊上瞧瞧他有多用功。我逐张抚平，压在自己的潮簿底下。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_birthday_mio_mother_1556:event:remember","text"],null]']
src = "blake3:c6137bb4d4356c824f8ab3cee7a436d81f5d60ace2485639a1118c7500d98455"
text = "叫弟弟自己把这首写完"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_2:event:honest","reply"],null]']
src = "blake3:7edf82dacc2f1aa70e0a05d891fa99b4df2e2482a5226b69bc97218339fc5189"
text = "我回信告之，这月没写成。头一月岛上规矩多，样样得学，通铺夜里还不准点油灯，我只得天没亮就爬去岬头的了望岩落笔，可写出来满纸全是潮时，全无歌样，不敢寄去。下个月补作两首。信很短，字依着她嘱咐放得极大，大到我自己看着都发窘。鹰丸蹲在侧旁瞧，叫我代他添上一句：今年他还没输过。我给写上了，末了另注一行小字：这话是他自己说的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_2:event:honest","text"],null]']
src = "blake3:e2358b59121f4752d0ee3a8cbf550777d3b96244195752e331a0f15a49a24301"
text = "认了这月没能写成"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_2:event:share","reply"],null]']
src = "blake3:4ff922434ecb008a7b2528880f39989afac61c894341c9952db23fb043995f3d"
text = "我把母亲教的那些雅字全搁下，只拿阿濑认得的假名，写能岛的早春：宫洼濑户一日里翻腾四回潮水，石崖上的松树却不管海潮往哪头涌，尽往同一个方向歪着。易稿五遍，才减短成她要的尺寸。晒网的阿松婆不认字，听我念罢，倒说她认得阿濑，两人幼时就在这院子里头一块儿晒网。我把歌折好，封外也画了条小船，船头翘得比她的还要高出几分。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_2:event:share","text"],null]']
src = "blake3:a95a9f42da40570b58c3c33e83e4e068dfac340fa2cf741d09364e948479ff02"
text = "拣她识得的字写首歌"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_3:event:honest","reply"],null]']
src = "blake3:8253d18b103d5549f2449f758757b6af5d6c9df11c9a88e4e58bd2eaba0553f5"
text = "我去信回道，那一回我依然觉着砍得有理：潮水正架着船往礁石上撞，但凡多耽搁片刻，船连同渔网全得撞烂。绳子先收下了，待我解完再议。末了又添上一行：下回挥刀前，我先数到十。鹰丸扫见这句直摇头，说阿濑瞧见这话，非拿网梭拍桌子不可。我还是把信封了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_3:event:honest","text"],null]']
src = "blake3:68d342fd7492fa5536fc1edff4b26d5638864fedfe1749d5ec5235d6d90ef5e8"
text = "回信仍咬定那遭该砍"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_3:event:share","reply"],null]']
src = "blake3:d92bc7ae96afd7a1e0a190830d9a9ba92b28ae5cb330b60e2306931a24c69c2d"
text = "我没再争辩。那截绳索贴身揣在我怀里，逢着候潮的空隙就摸出来拆解，指甲生生劈断了两回。解至第五个结，总算叫我摸出些门道：这串结是一环套一环勒死的，唯独找准末了一道套上的绳圈，一抽便泄了劲。又四郎经过时斜眼瞥了下，随口点出三个结的名头，其余四个他说岛上没见过这等打法。待七个结尽数拆开，我照着原样一个个重新系好，每个结旁各绑一张小纸条，写上我猜的名目，寄回了下田。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_3:event:share","text"],null]']
src = "blake3:5362583ac2037b9e01010d22747dd5476a399aa0e3fcc654a620e374bdf22efa"
text = "依她之言，不动刀解结"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_4:event:honest","reply"],null]']
src = "blake3:7929afdb731532ff44fd6728eb439aa986015f8e42a32cbb9f2d3de87ad7d46e"
text = "我上番所把这事认下了：那人我前后只见过三天，觉着他说话利落，便替他帮了腔。人是我保的，这笔账合该记在我头上，不该算到下田身上。我托老账房在簿子上把名字改过来，余下的钱归到一条澪名下，待我出了海，头一遭路过能岛就当面结清。他让我在名字底下按个指印，我按下去时手劲太重，印子糊作了一团。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_4:event:honest","text"],null]']
src = "blake3:45436c2026d29bb3833e5e2b5add4e0d28c87c43aaf130aea5c2e9fddac46ec1"
text = "认下保错了人，欠款记我名下"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_4:event:share","reply"],null]']
src = "blake3:1fc842074c46472f69f3c610732cfb88bf303d8e8140c63f7778f56816ec62cb"
text = "我按字据上的字号，逐日去番所翻阅过船簿子，守了半个月，果真叫我候着他家一条船在门前等潮。船头推说东家身在堺，一文现钱也动不得。我抬手直指舱里的杉原纸：钱挪不得，纸总挪得。他终于松口肯拿纸抵账，价钱按进价算。我把纸搬上岸，正碰上番所老账房记账缺纸，依市价转卖给他，竟还余出四十文来。铜钱用纸包严实，连着船头摁了指印的收条，一并托盐船带去了下田。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_4:event:share","text"],null]']
src = "blake3:070fdc391b342148c113763053705c4b06bad857adfbf522aaa06e0f86505f45"
text = "候他家的船过濑户，取纸抵账"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_5:event:honest","reply"],null]']
src = "blake3:4da6f764970bbdfcfdbd06d7914f270081c58c7273a46ddaffbbe6d6821173e5"
text = "我在信里回道，这葫芦在岛上存不住。通铺上原就没有只归谁一人的东西，前阵子我的草鞋还叫人穿去了伯方岛；救人那堂课上，又四郎又说过，抱着葫芦的人进不得急流。待下趟放假回下田，我便把它揣进怀里捎回去，亲手挂回网棚梁上。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_5:event:honest","text"],null]']
src = "blake3:9415b447ba95eb272bb8f9034434096a9ed40e31c01edef2c4483e69b677b29a"
text = "说要揣回去挂回网棚梁上"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_5:event:share","reply"],null]']
src = "blake3:0d329844a3df5c6ab1d997c6223f8f27915ecfd1febabdc328b8b540e9cb571d"
text = "那夜通铺灭了灯，我把葫芦放在膝头，摸黑在心里凑了一首歌：说它当年驮我漂过河口，眼下轻得跟只空贝壳似的，晃一晃，里头还响着下田的水声。等到天亮，我将词写在一张薄纸上，折作一条小船，托盐船捎回下田去。至于那葫芦，我挂在通铺头顶的钉子上。新来的见习打听那是什么，鹰丸代我回道：“她的老师傅。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_5:event:share","text"],null]']
src = "blake3:cea8dff86269161fa88ce93ff7442dbfe9f766874f9d36e2b457d56b7481426b"
text = "将葫芦写进一首歌里"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_6:event:honest","reply"],null]']
src = "blake3:a862ed7e38aff18e20d24a3a4687dce8a077aee83de67aff606b4662bb81dcc7"
text = "我回信说道，这桩约定我只应一半：她言潮势不妥，我必住手细听，听毕究竟出不出船，由我这船头拿主意。写至此处我停笔良久，又添上一行：倘若是我断错了，尽由你骂，当着水夫们的面亦无妨。鹰丸看过便断言，阿濑读罢这信，保准连夜搭船赶赴能岛。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_6:event:honest","text"],null]']
src = "blake3:41a3ac928b71b7afed1a6bc935028ae50723954ec142a2f5ea5f21eead8a40d3"
text = "回说愿听劝，却不全依她"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_6:event:share","reply"],null]']
src = "blake3:f4ec752b49909c382a20106e766e704ef94af969fc71e2189ec4a4fc19a21afd"
text = "我回信应下此约：只要她说潮水不妥，我便不出船。那幅礁石图被我粘进潮簿封皮内页，每夜熄灯后都在暗处默记一遍：哪块礁涨潮没过几尺，退潮又冒头多少，哪两块当间夜航切不可闯。既已背熟，我凭记忆另绘一纸，又按又四郎教的月龄法推演出下田本月的潮时，随信寄回，请她临着河口一块一块查对。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ase_6:event:share","text"],null]']
src = "blake3:a8a4607ad7b121d2f029c071dde8c25068384a672b0b164d662ac3b48228951c"
text = "应承下来，背熟礁图"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:honest","reply"],null]']
src = "blake3:e125911a2cf64925487b7f244ae3f908150801a4888d1cdd390ee8906622f774"
text = "和歌我自能作，只是这手字尚登不得扇面。一条殿中往来皆是精于翰墨的公卿，若写砸了，折损的是他的颜面。我将歌另誊于一张短册之上，把素扇原封裹好一并寄还，由他另请高明落笔。直至船驶离宫洼，我方才省起，竟忘在信里问他可中意这首和歌。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:honest","text"],null]']
src = "blake3:6046da9f2c42c053f45e08304f1f704984f459ee5d212233e33b5d1d2903acd3"
text = "只交歌，请旁人题扇面"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:share","reply"],null]']
src = "blake3:cea982a8dec3e47ec03932cca64e1ec4f4e02209f04111b7fc0fb9daa064f4ff"
text = "我在了望岩上磨了三个清晨，废掉七张怀纸。既不能写海，更莫提写鱼，末了只得咏了岩隙间一株山樱：花尚未放，枝桠先已饱胀花苞，被海风吹折得偏往一侧，恍若满腹言语强忍不吐。在扇面题毕，我拿油纸密密包了三层，托东航的船只带返京都。日后听闻，兼定当着众侍从将那柄折扇展开又拢起，拢起又展开，始终一言未发。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:share","text"],null]']
src = "blake3:d605077d34cbb1129d81cf1517a36409b520935a8baa664c89304ad7e1bfa955"
text = "依约替他的扇面题歌"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:honest","reply"],null]']
src = "blake3:d313c1bc047cf637dfa05c574e18f0c915e38f177c2aa77fdb46da87ab2a6f56"
text = "复信我仅寥寥写了几行：我人居能岛，看不见下田天色，船只来与不来，我算不得数，总得问过阿濑。只求他一事：书信先寄往阿濑处，她言可发船再行启程。封笺前，我将“只求”二字又加粗描了一遍。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:honest","text"],null]']
src = "blake3:bc7fbc08de8144abff000c3390c9a2eb0a778db2c8b731f63aedc1aa08259301"
text = "让他先问阿濑能否出船"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:share","reply"],null]']
src = "blake3:c2e9e0e8ae58431650d30a9670f09f04109fca7f758174d656eef50a7fb27035"
text = "凭空相劝决计拦不住他。我央了番所老账房调出近二十年的过船簿，凡八九月行经濑户的船只，延误的、中途返航的、一去不复返的，逐条摘录在案；复又请教跑惯南海航路的老水夫，打探土佐至堺一线上何处堪避风浪。回信中我附绘一幅小图，标明由良、甲浦等几处可避野分的良港。末了写道：船尽可前来，改在九月下旬，旗帜竖得再大亦无妨。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:share","text"],null]']
src = "blake3:5389165f3601444bd16410ec3014c408e38371f9630c11bceacf1232a8fc49c2"
text = "查翻番所旧账去信劝止"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:honest","reply"],null]']
src = "blake3:ea44c8f5c1cc4e8ddd11f16b58d93e5d86a52e2da5fc114501f3ba3818a3702b"
text = "我应摊那半数，今春实在周转不开，岛上工钱须待年底方才结清。既是我借出的香，阿兼婆那边便由我独自担承。我在龙神祠阶前跪满半个时辰，直到涨潮的水沫漫湿膝头，她方才开口，只嘱咐下趟挪借神物须先禀明神明。此节我在回信里只字未露，仅写予兼定一句：这笔账暂且赊着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:honest","text"],null]']
src = "blake3:04f57ddf9fdd3ca1c82687b3197597d6e94106716d1ebb19c3ef366e5ef22075"
text = "认下借香之事，钱先欠着"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:share","reply"],null]']
src = "blake3:9879ff07d849aaa1000100e234135d059078a88ed9c94808066a35d0813fc5f4"
text = "赶集那日，卖香木的商船如期泊了岸。我将兼定寄来的半份银钱与自己积攒的工银凑作一处，上前询价伽罗。头番开口，货主喊价高得离谱。我也不急着讲价，只蹲在泊位旁瞧他兜售整日，直熬到暮色四合、潮势将变，他急着抢过濑户时，方才走近讨要指甲大小一块，言明是奉还龙神之物。他见我是船坞见习，便少收了一成半。我将香裹妥献回祠内，阿兼婆凑鼻一嗅，一言未发。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:share","text"],null]']
src = "blake3:bf0a31e7bc1eaa992ed4d698ffe7ef3040d1de7299f22bf09490593b5b50a44f"
text = "同卖香木的行商讨价"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:honest","reply"],null]']
src = "blake3:c7a8bb55d0cfea219c631b81bcbf4c93d6dfb257f10b37fae494561469080056"
text = "既已赠人之物，岂有收回之理。我在回笺里写道：这半边贝壳属你所有，厌弃了便丢入鸭川，我绝不代劳。随即把纸包原封递还，连那根纸捻也按原样打结系紧。鹰丸在旁瞧见我系绳，言道我心肠未免太硬；我回他兼定性子比我更倔，他自会明白。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:honest","text"],null]']
src = "blake3:2ea931991ea06094f50793d5f0d9a0e387b27d39d774ba88a96e778bae4e9726"
text = "照原样退回那半片壳"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:share","reply"],null]']
src = "blake3:1d983ef2fcec64f8d4cfe32466e1ae039b59e0c48d80afcf84c6f355c28b8d30"
text = "我向社中借来画潮水线的朱笔，在两片贝壳内壁分别描出半幅水景：一侧是下田河口，一侧是我日日对望的宫洼濑户。流水自河口奔涌而出，绕经佐田岬汇入内海，一路东流直抵他那处的淀川——双壳合拢，水脉便首尾相贯。足足绘了两个清晨，直画到朱墨告罄方才收笔。他那半片我重新裹妥，托东去商船送返一条殿，封纸上落笔道：即便官阶再升，文箱之中总还腾得出一方角落安放此物。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:share","text"],null]']
src = "blake3:a1da4a2f8f09ec66edc8a01d99e083d063ccc5d41720fdc257acd70feaefd9a2"
text = "往贝壳内画上两处水景"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:honest","reply"],null]']
src = "blake3:0419d9d179bd1ec747f24e28ef4f0340d5c449968aaaaa95062e8d4f6d1fdee6"
text = "我回信说，舵我能掌，但日后每到一港便先回下田，这桩我应不下；风不朝土佐吹的时候，我也只能顺风而行。我能应下的，是每抵一港写一封信。写完想想，又依又四郎教的月龄推了推下田这月的潮水，记在信末。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:honest","text"],null]']
src = "blake3:122469151ea9f2cfa39d8f626ea08b995d98f3575ae4080aaf29364731c8c6f1"
text = "单应下每港去信一封"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:share","reply"],null]']
src = "blake3:8a32262380c6888a68909eb301c773304221ab1f681eca523daa83b0f410f89c"
text = "回信上我单写了一个字：好。小早只用摇橹，大船方挂舵。我缠着又四郎磨了好几天，他才松口准我跟村上家的关船走一趟濑户。舵柄比橹沉重，扳过去，船首得过好半晌才肯转向，人须得先一步算好朝哪边走。头一回我扳迟了，船身擦着渔家的网桩掠过，船头骂出一句粗话，连底舱的见习都听了个明白。第三天，他竟放手叫我一人掌舵，把空船绕着鹈岛开回了泊位。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:share","text"],null]']
src = "blake3:bc847fa8f807723c4e87e1ec3ef0c75fd5997c98c59967a6fae6c3070d22c940"
text = "应下掌舵，登关船学操舵"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_2:event:honest","reply"],null]']
src = "blake3:e2e6d8a65e22d50c48cb70f2d7da6a340845ea706cf9d899ba3b9eb0f7c3d8a9"
text = "龙神祠里的熏香向来只有清扫祠堂的阿兼婆燃起，我仅隔着石隙凑巧嗅过一遭，实在辨不出名目，胡乱编派反恐遭母亲取笑——复信里我如实这般禀明，末了诚实多缀一句：上岛闻着的头一味其实乃是鱼油。昔日约定断未敢忘：待来日确切认准了哪一种香，定头一个写信告知她。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_2:event:honest","text"],null]']
src = "blake3:86c7d452ccee68b216eeed306e22bde6e1fbaaeabf49cdb62a5ad0c23c39c11e"
text = "照实回说还叫不出名字"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_2:event:share","reply"],null]']
src = "blake3:ced6033a20e943968d069db3eab1034e74ffb55af06f4de63114415d8c022eb0"
text = "登岛那日，迎面撞来的是船坞里熬鱼油、拌桐油的气味，把人呛出了眼泪；直到次日傍晚打岩间的龙神祠走过，才嗅见一缕香，让海风吹得仅余细细一线，甜里透苦，仿佛雨后的杉林。我不曾学过闻香，道不出它的名目，便只拿它作了一首歌：海上的香，闻来却是幡多的山。歌誊在我最好的一张怀纸上，纸角描了一枝杉，托西行的盐船带回土佐。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_2:event:share","text"],null]']
src = "blake3:984094474fc6b9a7c733968276c9cf2d98921188991779d0a1f0ebc8d4b13c89"
text = "将头一种香作歌寄回"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_3:event:honest","reply"],null]']
src = "blake3:4fae0f916a974ef48dcba3669a01bc7ad90404fc16a21daee7bed333e907452f"
text = "节前船坞忙于修葺船体、晾晒渔网，又四郎紧盯着不放半个见习离泊。我据实向母亲回禀：本月抽不开身去核查关卡，一时呈不出确数；然则遣自家船运粮赴堺售以高价之议，我仍执旧见，待盆假过后返岛再与她细辩。封好信缄，方觉措辞未免过分生硬，迟疑片刻，终究未拆封涂改。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_3:event:honest","text"],null]']
src = "blake3:18e25030bcd04bfbe093b4de3550e25bb4452e98ce0d7f097c92ec3092c110b3"
text = "坦言盆前无法离岛"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_3:event:share","reply"],null]']
src = "blake3:a4b9d846ff5958135d36c58a2a9db9df959f94a9b9faad06bb4bf3bf307b7c46"
text = "我恳请又四郎准我登番所的小早操桨。凡东行的运米船只皆须于岛门前候潮，番所役人靠帮查验旗号、清点帆数、征缴过关银钱，我便坐于船艉逐一登记：此船发自伊予，前路已闯过多少关卡，赴堺尚须经几处，各关抽税几成，又在哪些濑户口候潮、动辄滞留几日。足足划了半月桨，掌心磨起两排血泡。归来核算一遍，原指望的差价竟叫税钱与候潮耗费的口粮吞蚀去大半。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_3:event:share","text"],null]']
src = "blake3:3c2e25e8d8a3b66e9316c26eb328de9ce594b5ec11643a8ca57ca68258be69e2"
text = "随番所小早清点关钱"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_4:event:honest","reply"],null]']
src = "blake3:f25fa4b5da27f16c716f9b4706427b5d3265d935ff2133237a6bf3cf3c475d29"
text = "初春船坞正忙着替小早填塞船缝，整日干活下来，十指扎满槙皮毛刺，连潮簿我都得熬至深更方能录毕。我致信向母亲坦言，今月账目难免疏漏，权且把记得真切的先行登录，自下月起定必逐笔无遗；末了还将那支木桨补入账内，省得政所借机挑剔。合卷一算，中间断档未记的竟有七八日之多。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_4:event:honest","text"],null]']
src = "blake3:11514a801201c0be634a525f34fe5dde312e505a37569e27f7fe834dc3c101b0"
text = "禀说开春忙顾不上记账"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_4:event:share","reply"],null]']
src = "blake3:15d20e9783421467f209f6d65c50014bb7ac2c04440400a86267e601cea92063"
text = "我接连打探了三艘泊岸售粮的小舟，择了米价最低廉那家立了月账；予船坞的谢礼亦改在堺船停靠岛门候潮的那几日置办，足足省下两成花销。账册全用假名誊写，食米、草鞋、墨锭，乃至那支樫木桨，件件宗宗列在纸面。月底封册时，我在末行添上一句：本月较上月省下之钱，足可买得三斗米。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_4:event:share","text"],null]']
src = "blake3:fbe2f69f12b4dd483b1aa16f2000c607573baec963621cb8f8f65c54ec9d50d1"
text = "接管岛上的账册"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_5:event:honest","reply"],null]']
src = "blake3:ef718987e1331039c3ddedc357fdceccec44830679ff29b3be140be3cfe37c6d"
text = "兼定前阵来信曾提，房通大人入夏后咳嗽加剧，一概谢绝见客。值此光景送还，也不过锁入本家库房罢了。我复将香木按原样裹入油纸，藏进盛放潮簿的木匣最底格，随后回禀母亲：眼下不便归还，且由我妥为看管，待兼定去信言明大人已能起身端坐，我再拣一艘最安稳的船只寄还。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_5:event:honest","text"],null]']
src = "blake3:54bdf10d533f7f24fc3abd3f973996a3bba4a7927425817ccbb5fd49c51e35f0"
text = "候房通大人痊愈再还"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_5:event:share","reply"],null]']
src = "blake3:c3a846be2d383506c32765645bad31ec6d59b70b19a1d68a82f774278d74c5d8"
text = "我查阅番所过船簿，择定一艘最稳当的堺船，其船头行此水路二十载未曾失手。将香木拿油纸细裹三道，外层复套入一截竹筒，筒内附塞和歌一首：香木在南国海风里沉眠八十载，归途犹识旧径。另附信函予兼定，托他亲手呈至房通大人枕畔，代为诵读。交出竹筒那日，我立在泊位目送那道船帆隐没在鹈岛之外。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_5:event:share","text"],null]']
src = "blake3:92f97c338720ed05ac8d0dd3652048d0c5aec1114d54c6e8cb862df17ab05d73"
text = "附和歌托兼定奉至榻前"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_6:event:honest","reply"],null]']
src = "blake3:0f6fc4d5217386bbdd5f01eaffcf2a8f7506e7a36794cd12723bc72257a19b94"
text = "我回信说，后两件都应承，头一件眼下应不得：船头朝向哪边，得等我见过那年的风再定。临末又补上一句，堺我定会去，只不敢应是头一遭。信封了三回方才封妥。又四郎在草棚门口看着，哼了一声：“写给娘的信，才封得这般费劲。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_6:event:honest","text"],null]']
src = "blake3:1413d3d0f5a22079998796d4e22180681d76ef476bdef661c485c53bf9759475"
text = "直回说头一桩应不下"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_6:event:share","reply"],null]']
src = "blake3:587b2af0cbcf6f40880886dceee0ecb81ed4bdf7fc739081334e8b6c3c846fc0"
text = "我在复信里把三件事誊抄一遍，每件后头添一个“应”。那张写着港名的纸，我拿去问岛上走过南海路的老水夫，又趁阿波来的船在门前候潮，登船去问船头。他们念一个港，我记一个港：甲浦口窄，非等涨潮进不去；牟岐外头藏有暗礁，落潮时望得见白浪；纪伊水道的潮一日转四回，转差了就得被推回。纸上的空格填满了一半。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_family_bond_mio_mother_6:event:share","text"],null]']
src = "blake3:8696a56471855eb36c16201c8a2f65a92450f8f3e939a3440a08cd05b19b87a1"
text = "承下三桩事，去打听港潮"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_10:event:keep","reply"],null]']
src = "blake3:ab0c3c4ecada7b01bbbb0a1cd69af780ebf81a3f2ccf1d91605e0426c32d1580"
text = "我将信收进这三载攒下的歌稿里，恰恰夹在那首“归”的边上。一个在龙溪凑联句，一个在能岛答和歌，俱在同旁人争那上下句。鹰丸瞅见了，问我独自笑什么，我只答没什么。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_10:event:keep","text"],null]']
src = "blake3:7b24563b15ebb9c74067228d97465aad3ebe28bc3841173920443dc6761aa550"
text = "把这封信收进歌稿"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_10:event:reply","reply"],null]']
src = "blake3:e2169e1be176df89f6151c2799d18c0ae560be204360f11a405f70aa2a177a3a"
text = "我将末一回歌合写给了她：题作“归”，判者是龙神祠的老神主。输赢倒没写，单写他念到我那一首时咳了一声，满棚子的人都笑起来，我的脸直烫到耳根。记起她说过输了更该写，我便把旧日输掉的那首也抄上去，一字未改。她看得懂几句倒不要紧，她自会笑的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_10:event:reply","text"],null]']
src = "blake3:734a241c9316fc033fe9fcf50167f0f1efd56550855574e49b35183475a9d587"
text = "回信写最末一回歌合"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_11:event:keep","reply"],null]']
src = "blake3:169ec373bd71b8a3f2ef169191b10ed0565306d04801d8c56a5b6ed55f7211c8"
text = "我将那缕红线解下来，绕在桧扇最外边的扇骨上，缠足了三圈，正合她缠信时的道数。信折成小小一叠揣在怀中，随我的行装一并离岛回土佐。到了出海那一天，扇子自会插在我的腰带里，红线也同在。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_11:event:keep","text"],null]']
src = "blake3:b6782650e21f781dd19785b8dadc0dcc5dc1644fe31ef4ec88dec4513ba6b0a7"
text = "将红线绕在扇骨上"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_11:event:reply","reply"],null]']
src = "blake3:aa9d7704433d07bee833e801c414314ec6171c251241da5534602b3cd0a01b1a"
text = "回信我只落了三行：正月由下田出海；哪日抵了五岛，寻红灯笼；叫一声“灯”。末了描了一把半展的桧扇。封信口时手顿了顿，又拆开，补了一句：灯别灭，等我。信交与番所，搭村上家往西走的船，船上悬着过所旗，沿途无人敢拦。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_11:event:reply","text"],null]']
src = "blake3:bdd6858bad86faf8bd73dd145a31d8ea856a2e132b1293858bc866599ca0b057"
text = "写信约下五岛会面"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_3:event:keep","reply"],null]']
src = "blake3:782e343ee59ea5f31fd1476def3fe7f1076743ce9b5909d9c347612dcbe0fb6d"
text = "阿松婆正晒着网，我将信拣着段落念与她听：五岛那截连读了两遍，提及旧衣裳那段便越了过去。她听得不住咂嘴，言道年轻时自己跟船去过五岛一回，那处的海蓝得发黑。待读完了，我把信收进放潮簿的木匣里，与下田收到的那几封搁作一处。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_3:event:keep","text"],null]']
src = "blake3:5d26e33f2fd6d8919b14886b4801c5e693b837d6006a2769752d65e99f8f6f87"
text = "读与阿松婆听后再收好"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_3:event:reply","reply"],null]']
src = "blake3:0b479ce7ff0805750e4e6fc6f542ae2ebc5b60b6abae9121921702b377ea75f8"
text = "我回信言明，旧衣的缘由我偏不追问，她若要编瞎话，攒着等碰了面当面编。只是五岛的见闻，回来须得从头细说：海船走了几日，夜间望哪颗星辨向，那处的潮汐可也同宫洼濑户一般一日四翻。信里我拈了一片压扁的山樱花瓣夹进去，寄到她手里想来只余一道枯褐印迹，但她必能认出，能岛正逢春时。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_3:event:reply","text"],null]']
src = "blake3:bc0c3ee3cc15840155481c09feea16ffb14cab03aa0cb604d90f2d0dd100d9fe"
text = "回信只问她五岛见闻"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_4:event:keep","reply"],null]']
src = "blake3:dbe410697b38213553dc07a07fdc8b263080e442a86fbdd91c454781699bba88"
text = "我把那张描仿用的粗纸垫在潮簿底下压展，逐一清点上面的朱圈，数完恰是十七个。鹰丸问我数它何用，我回说且比一比：待到秋日大考，又四郎能给我的潮簿圈上几个。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_4:event:keep","text"],null]']
src = "blake3:cfae2fb07b57e823fce525453e1a959b5e5a7f2004acc072cc9c659116b78b7b"
text = "压平收好那张粗纸仿字"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_4:event:reply","reply"],null]']
src = "blake3:f07ca6bdd4621e397037ddc633aabdfeda2f5dab1f70cd52c83d9fd105d28fda"
text = "我在回信里把岛上的功课逐项写与她知：破晓前入水，迎着急流泅至对岸礁石再返程；识岛屿，辨暗礁，看准潮头往何处翻卷；一根缆绳要打七样结，来迟的人替大伙儿解缆。末后还把又四郎传授的潮诀工工整整誊了一句，比平日下笔还规矩些。收尾告知她，五岛到能岛不算远，自博多向东驶进内海，直行便至。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_4:event:reply","text"],null]']
src = "blake3:ec0cb9f86dc105d53cbc8829e23b7cfe5dd46817257b9a9a18e094def5d6e5f9"
text = "回信说说岛上课业"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_5:event:keep","reply"],null]']
src = "blake3:79b1269cb0d906629004008eca226d24f55a03ac70af6ef1414168e000780bf7"
text = "我将这枚贝壳妥善安进母亲赐的旧香盒，挨着那块用剩的沉香碎放好。此后但凡接信，头一眼必先寻那个墨点。五岛入夜时连缀一线的船灯，我合目揣摩良久，终究想象不出能延出多长，想来该比能岛门前候潮的船队还长吧。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_5:event:keep","text"],null]']
src = "blake3:a27747d842d9a70e74b7f979b76cd809539f77df846f64fe1406f504a90c1bf8"
text = "将贝壳收入香盒"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_5:event:reply","reply"],null]']
src = "blake3:581517c1305e3a6c40673765087e5f4bb38fd8312a5023049d23fb6a09e64651"
text = "我替自己也择了个暗记：信末勾一柄半展的桧扇，露三根扇骨，叫谁都描不像。勾罢，顺手在旁侧题了一首短歌，写白霜凝在能岛晒网的院中，海盐结于五岛寄来的书信上。那枚贝壳我穿了根细线，系在潮簿木匣的匣钮处，每回开匣便轻碰一响。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_5:event:reply","text"],null]']
src = "blake3:a31e9f67461b8bd60d75c066700de150fb5ac3adc4cf901d23701c3f3974c3a3"
text = "回信亦立个暗记"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_6:event:keep","reply"],null]']
src = "blake3:9570dade8c9d9346f07d45b0165d8f0a3b5ec576a95a4485e69154782c8785f6"
text = "我将那张油浸浸的果脯包纸抹平，同信叠作一处，收进放潮簿的木匣里。纸上还带着糖的黏劲，蚂蚁不曾招来，通铺地板缝里的螃蟹倒先来过一遭。阿松婆叫我扔了，我没丢。那句“你当没看见”，我便真作没看见，只暗自在心里笑了一阵。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_6:event:keep","text"],null]']
src = "blake3:da32b233307432d5b81f80dd52bf1254f25855ed3a9b5dbbc1132b5b00c6e2e9"
text = "连同果脯纸一并收妥信件"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_6:event:reply","reply"],null]']
src = "blake3:4227c5af576fc8821585dc3efba971639f0ca98f1251a73cc80807fd4c7891cb"
text = "我跑去请教番所的老账房。他答称内海行商多使铜钱，白银需往博多或堺的唐人处兑称，一两能折几斗米全看年景与时节，去年入秋又涨了几分。过境的博多船倒有用碎银抵缴帆别钱的，说着他还取来小秤，当场示范如何过秤。我把探听来的行情写回信里，循着她惯用的法子折算成“两”与“斗”，反复核了三遍方才落笔。末尾告知她，果脯我吃过了，挑着没坏的那半块，酸中透甜。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_6:event:reply","text"],null]']
src = "blake3:ce2a8982869b7b05331d30aeaac0028b7521b03490690d35cc4a26244aa3ea95"
text = "回信告知打听的银米价"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_7:event:keep","reply"],null]']
src = "blake3:f3101b04d0663bc5424b5ef17143df5cc013eb5bdd5b8d886f47ae6d7e0ea45f"
text = "这封信我夹进了潮簿里，压在七夕那一页，拿油纸裹了双层，连下水时也带在身上。候潮得空了，便取出来瞧那条往回游的鱼。鹰丸说一封信叫我看了三天，我回说那条鱼还没游到家。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_7:event:keep","text"],null]']
src = "blake3:886256a8468ef9201201989583209e5084a087f7b826ad850677cbba40460c0a"
text = "将信夹入潮簿，带在身上"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_7:event:reply","reply"],null]']
src = "blake3:070daa77bd10785ca6defe8cbdfb97393ddae7b9759f98a779d6548cf5d30f7d"
text = "写回信时，我将自己的名字连写了三遍，一个比一个大，末了一笔的弯钩特意拿社里标潮线的朱笔描过，旁注一句：鱼头朝这边。她信中打听七夕，我也据实写清：岛上不用诗笺，只在竹枝上挂小旗，求一年里船出海不翻；我自己那面旗的背面题了一首歌，说是隔海的两个人借着同一颗星辨方向。她若收着了，想来又要在天妃宫的灯影下依样描摹。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_7:event:reply","text"],null]']
src = "blake3:902467853ffd4cf46c13200efa9d56552b1edd511e4e8904c3d0212c31281fdb"
text = "指点她写正那一钩"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_8:event:keep","reply"],null]']
src = "blake3:a65d6347a99eb15f1e8383ddbfd7f030fbd76cf296ab33233051b506f5d04cfa"
text = "我将那半片纸藏进香盒里，紧挨着五岛的贝壳。打这起香盒的盖子便合不拢，我干脆抽根细麻绳捆住，打的正是阿濑教过的那种结。此后但凡有信来，我都先掏出这半片，比着撕口能合上了，才动手拆封。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_8:event:keep","text"],null]']
src = "blake3:e592b62de462ecf2dfc2a5d050d0be5c822aa63c09a231c3ca579560dd2198af"
text = "将半截回执纳入香盒"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_8:event:reply","reply"],null]']
src = "blake3:a0fa74088cf6ec06dbbbd9d98289238c81ae2a681f0fbaee3f5354e56a80c376"
text = "我也照样写了张回执：“灯九月的信，闰十月七日到能岛，封口完好。”落笔罢从正中扯成两片，自个儿留着画有桧扇的那半边，余下一半裹进回信里。手急扯斜了些，反倒强，这般歪扭的茬口旁人休想仿出来。末了我又嘱咐她，那半片务必要收好，若弄丢了，下趟来的信我可不认账。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_8:event:reply","text"],null]']
src = "blake3:2f38dde8605fb9d7f6bb60e849ad310180f1c77b0f8c0fe810c930fac9a2d7ef"
text = "照样撕张回执寄与她"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_9:event:keep","reply"],null]']
src = "blake3:0063e67091349d309afea8d47168e7a459254857688e0d8c6f4335e47e5e4c18"
text = "我顺着原折痕将小账叠妥，夹入潮簿当中。每逢背潮表背得心烦，便翻出这一页来，瞄一眼那句“写哭了的不加钱”，总压不住想笑，笑过又能多记下两行。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_9:event:keep","text"],null]']
src = "blake3:73a9a8f4e00b0fa09824981388ea1169853c9dc0ae108934383ce27ce907c9cd"
text = "把她那张小账夹入潮簿"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_9:event:reply","reply"],null]']
src = "blake3:9a984e07ec3b36d1527c1c63a052d308d4d3ac98b04a0ac38f442a142d8bf6ed"
text = "我依着她的式样，同样竖着写了一张：替番所抄过路簿，每月得米三升；替过往船家抄录过所旗的字据十二张，每张两文；替候潮的船家报平潮时辰，挣赏钱二十文，尽数补贴了口粮。最末一行也学她，搁了一日才补上：“船出了港，写信来。”我又在扇子记号旁添了面小帆，替她加把劲。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_letter_9:event:reply","text"],null]']
src = "blake3:5a4a2b737b594087f43bc9eb047d30f8459797d2bc21c03a0eeb0420bd81adc2"
text = "依她样式回寄一纸账"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_omen_1:event:question","reply"],null]']
src = "blake3:7d1d94efd4471c5df9ea92802a2f4451c05ea08ff66923f6f1aa11e70ce254ce"
text = "我带着这桩传闻去问岩间龙神祠的老神主。他彼时正往祠前石缝里插新纸垂：“若狭的白比丘尼，早年入过京，闭着门户，想瞧一眼得先付钱。有户人家的日记写她两百来岁，别家却写八百岁。”他将纸垂抚直，笑了笑，“同是那一个老尼，两家竟差出六百岁。”我追问两家可曾记下她的发色与面容。他思忖片刻：“倒都写了，白发，嫩脸。”话毕便转身扫起祠前落叶，才扫了两下，自己却停住不动。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_omen_1:event:question","text"],null]']
src = "blake3:6b98a5249ee770b8dda9db8f7b952f37b98dff41af7f9e811ab3ecee7fce21d0"
text = "拿去请教龙神祠老神主"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_omen_1:event:record","reply"],null]']
src = "blake3:0dcd15f88aa1f1546ecb0bcb924657215630e50f03798455c920c733b16cd07b"
text = "我央他重述一遍，依着他的腔调逐句录在怀纸上：传话的是小滨来的水夫，由他表兄口中听得，表兄则是在朽木山道上撞见的。顺带写明哪日、在哪条船旁听来，他那艘船候的又是哪一股潮。鹰丸探头瞟了一眼，取笑说头回见我记潮表这般仔细。这页怀纸后来让我夹进了从土佐带来的潮记里，紧挨着去年足摺那张。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_omen_1:event:record","text"],null]']
src = "blake3:a4345d2bec4dc31b1a3583bdfee474bb03c09c65a16888bb4a87727c2a60d81d"
text = "按水夫原话记下来"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:expert","reply"],null]']
src = "blake3:bd5cd5b3f06f1cdb6358385e4e2a5b8496ad748b290ebb11ee0fba0925aaec86"
text = "母亲来信里写的，我逐项理了一遍：阴雨天沉，放晴就轻；手抬不过肩去，肩头既不肿，也不热。这是旧伤着了寒，犯不着去堺。我拟了一张方子：拿陈艾叶熬汤，热布拧干了敷肩，早晚各一次；赶上不下水的日子，把桨悬在梁上，把手搭上去慢慢转。临了添上一笔：莫叫她晓得是我开的，只说是能岛船坞的老法子。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:expert","text"],null]']
src = "blake3:f4d2bbbe27f2081844198ba7a1e2ea6f63ca2fdcedd9ce4b56ea87b43c77b961"
text = "按信中病症拟方"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:wait","reply"],null]']
src = "blake3:ec6c3f88ec09b48b3638741a44190644d7af45c312110b058a63e0e7c1c696a0"
text = "究竟去不去堺、舍不舍得那百疋诊金，我思量了一宿，到底回信让母亲拿主意：阿濑就在她眼皮底下，那肩膀是个甚么光景，我隔着海看不真切。信末我只多添一句，叮嘱阿濑开春后莫再往冷水里钻。阿松婆听见了，说阿濑才不会听劝。我说，那便写上两遍。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:wait","text"],null]']
src = "blake3:4360a922297984e2442c1ab6d2244f245177f4597cd1844d4de9101c3eb045bb"
text = "请母亲决断是否去堺"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:work","reply"],null]']
src = "blake3:e62b042a5c1ec003875e1e6cf38870db4786ef200bda1a2f3a87e87a69aa64e3"
text = "我寻了船坞里几位肩带旧疾的老水夫，又去灶房问了婆婆。几个人开口头一桩都是查问根底：甚么天气犯得凶、手能举多高、夜间可合得上眼。守望岩的老汉解下蓑衣，亮出肩头给我看，说海上熬出来的宿伤，少不得烫热的盐袋，还得佐一味叫独活的草根，靠泊的鱼贩船上就有得卖。我把这些盘问逐条录在纸上，连带草根的行市一并寄去下田，请母亲照单去问阿濑。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n1:work","text"],null]']
src = "blake3:e21aad552bb0f50b775789c47085f985a7833245723a5c03e0995a4840425b19"
text = "向船坞里的老水夫打听"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n2:wait","reply"],null]']
src = "blake3:d07b6978c78419c779adbf3733e8c3cfc1eb285c0648dfa9f1ef220d218c8cf1"
text = "怀里那串钱我没舍得花，另托往堺去的船家在堺的药肆赊了一帖现成膏药，账记在一条家名下，待返程时带回下田。又四郎闻讯，拿木桨柄叩着船帮道：“也好，也好。”说罢转身走向泊位，此后绝口不提熬药一事。包扎膏药前，我在油纸上勾了条鱼，阿濑认得这记号。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n2:wait","text"],null]']
src = "blake3:bbb31ec3eb9587404be1996dafb5b45520264ab26a532b9a1ad595e30cbec298"
text = "托过路船带现成膏药"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n2:work","reply"],null]']
src = "blake3:1fbf55a947a60d08025d54353443f1f053655fa7aeb5d53b8abb4d770fd96fd3"
text = "我解下整串铜钱，同又四郎一道守在门前等博多船趁潮停靠。他登船还完价，点过我的钱，多出几文又推回我手里。熬膏那日他唤我在旁候着：乳香先炙软，没药碾得越细密越好，一并搅进麻油里慢熬，直到挑一滴落在纸上不散不洇方算火候到了。我瞧一眼，就在潮簿背面抄录一道。药膏盛进蛤壳封严实，托了往西走的船寄回下田。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n2:work","text"],null]']
src = "blake3:c6973e3fd13023393acbeb19fa79c33ac6eb7e4ec3f73176e6c2a34db15e5236"
text = "掏出攒下的帮工钱换药"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n3:wait","reply"],null]']
src = "blake3:54f8d3601e7c314356cd1f75437b9007bdacdeb80e9d2439ff0bc2c1abd2af23"
text = "回信我总共只落了两行：“阿濑莫逞能。我在岛上日日下水，石子还没摸着白的。”本想再补句叮嘱，提了笔却又搁下——劝她的话，她向来只当耳旁风。隔天清早我照常潜入水底，阿松婆守在泊位旁替我数数，数得格外慢。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n3:wait","text"],null]']
src = "blake3:66d722f3d1aa0e9e876d922b2786eb43ed88f731b4fb1939d8c2ed20b0eb959c"
text = "只回她一句：我也日日下水"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n3:work","reply"],null]']
src = "blake3:421ad3a7055e8b6a42abb1e93c69a7d6025dfc93b461eba6b96729014c2c0a58"
text = "我去信给阿濑定下规矩：下水前头，须得先将炒烫的粗盐装入布囊，捂热右肩，再甩开胳膊绕满三十圈；起水就得披上棉袄，守在灶火旁歇够一炷香，不准径自跑去补网。这是岛上老水夫冬日入水的成例，我依样绘作小人图，一桩动作画一幅，省得她嫌字密不瞧。次日一早，我在泊位水底摸着了一块白石头。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n3:work","text"],null]']
src = "blake3:e638f01b18cd217257515a9f5162ecb63e1d040ec273fea49f2bd1b8e19d8acf"
text = "画份下水前暖肩图"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n4:wait","reply"],null]']
src = "blake3:02af17ae4eed83e43bbad3ba8965561e0d256ade083640f15c96a0b853f69e32"
text = "我没去学，只托又四郎依方配齐够使一年的膏药，满满盛进一只小木箱。他一面封箱一面絮叨，道药总有耗尽的时日，方子却用不完，连着念了三遭。我说船上的事，届时再讲。去信给阿濑时，我仅提了一句药已备妥。她此后没再回信。阿松婆说，阿濑不回信，便是不痛快了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n4:wait","text"],null]']
src = "blake3:3bdfe3f313c44b530e5ad0ac54b548c5cc687d854d3e3d998af886c172c8ac21"
text = "请又四郎配足一年的药"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n4:work","reply"],null]']
src = "blake3:41cecaa4a880e9ef531d655bb45528ec6e1403c33e2d8e5826e4142b9561bc5d"
text = "我抱了整刀纸上草棚寻又四郎。他一听是替老水夫备药，难得话密了些，打治冻裂的猪油膏一直讲到熨腰的盐袋，整个下午没停嘴。我逐样记妥，拿假名抄成一小本册子，封皮题上“船上药方”。他捧过翻了几页，说字写得这样端正，船上人怕沾污了不敢翻，又叫我在末后添了三页，全是他自个儿摔出来的伤。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_ase_illness:n4:work","text"],null]']
src = "blake3:948eeb59f3f871e34b886a00a8c472f6578c23022bf3aef87580766b23758093"
text = "向又四郎学船上的药方"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:expert","reply"],null]']
src = "blake3:0bb8f7eb4b94b5cdbc645bc9aa6286cebacff853066e780cf579178624c4230e"
text = "我盯着那道线细看半晌：裂纹顺着木纹蔓延，抵至钉眼便收住了，未曾波及船底正中的航板。这分明是钉眼四周木头晒干收缩硬生生挣开的，整块板子并无大碍。坞里架着的那条小早恰有一处相同的裂口，老匠正是照此法修补的。我回信附上一张图样：仅裁换钉眼左右各一尺的板面，新钉避开旧眼半寸另打。待信寄出，方觉手心早叫汗浸湿了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:expert","text"],null]']
src = "blake3:96dbc970f786eb6b8c76aac31258ad1bd026cd6d187e5b666378fd55d197b44c"
text = "察看裂纹走势，单换一截"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:wait","reply"],null]']
src = "blake3:9e7eb44d10e1c5db99f4022963eced744401dd7911f7a43ff55885eb731ae811"
text = "下田那条船我只在草席边蹲着看过半日，老船匠却摸了它一辈子。我在回信里写明，究竟换板抑或修补全凭他拿主意，钱的事劳母亲去与政所分说。信刚寄出，心里却又像是把那道裂口推还给了他，入夜卧在通铺之上，眼前晃着的仍是那道歪斜黑线。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:wait","text"],null]']
src = "blake3:1e8baa8cb27405045f89bc547f8ab710735199289639172fa9958c93c52b6da8"
text = "交与船匠自行决断"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:work","reply"],null]']
src = "blake3:ec00707fd87f8a8442d03b0eee55c7d68f55f2b3c01791509513a38a353e2729"
text = "我拿着那张纸去请教船坞里的老船匠。他言道裂成这等光景，整块撤换最稳妥，随即将一丈桧木板几何、杉木几何，伊予山里产的较土佐山里来的价差几成，桩桩件件报予我听。我将板材尺寸与价钱逐一抄录成单，算清换一块、换三块各需几钱，连同那幅图画一并寄返下田。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n1:work","text"],null]']
src = "blake3:6d6bf10eeb59d9900c912fdf4dcbb2af763c93b7c3eda966ab2a44cfdbf4505f"
text = "向坞里船匠打听板材价钱"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n2:wait","reply"],null]']
src = "blake3:ff24d51b80016eb265e883c373b4ebb7a9b6c7bb017c0ae4525d54212a1e7680"
text = "我写信回去，说钱的事还请政所另寻办法，实在拮据便改用便宜的杉木。日后母亲捎信来说，政所果真挑了杉木，老船匠没说好，也没说不好，只是剖板时多推了一遍刨子。那几串钱被我收回装潮簿的木匣，摸着沉甸甸的，心里却半点也轻不起来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n2:wait","text"],null]']
src = "blake3:68412cb53c438c52480cea4999dd9c150639d0827bb35b498ecbbc808b8674fb"
text = "交由政所改用杉木"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n2:work","reply"],null]']
src = "blake3:598b84990ecffacdb56e6223e6b0afd435e71be1e80750182b86c86b7a91b8be"
text = "这一年在坞里习得的门道全用上了。我复信山主：桧木须挑山阴所生，木纹细密方才吃水不胀；剖板的工钱由我担待，放木入河则顺搭政所运米的木筏，不再另付运费。他回书仅肯让一成。我复又去信，点明堺的商人只要整根，剖余的边角他断难脱手，我愿连边角一并收下。第二封回函抵岛，价钱让了两成。我解下攒下的钱，托人捎了回去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n2:work","text"],null]']
src = "blake3:8889b224ff0d4510f20fed7423ffb195c65b6de2ff1ea5fcd8fea4b282aecbd8"
text = "拿帮工攒的钱找山主讲价"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n3:wait","reply"],null]']
src = "blake3:fa33c447050ef0feb8118b17c7bd532618611fb412075e956599f221f3106acb"
text = "我回书言明不必候我，木头要紧，尽早下水；那根钉，烦请老船匠代我钉上。信去月余，母亲来函报信，言小早已顺利入了河口，吃水正好，滴水不漏。我在船坞草棚里将这几行看了三遍，心里却有一处空着，怎么也填不严实。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n3:wait","text"],null]']
src = "blake3:2502560c37790ff5c69859ad4db6516755b5ff8c2fa0badccaf600556a5851d4"
text = "请他们先下水，莫等我"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n3:work","reply"],null]']
src = "blake3:2d0b2022ce73b35309ce23ab6d519752613b4fe18efd02131c9ea203af007a1b"
text = "我回信将下水诸事一件件排定：九月初我抵下田，吉日请中村的阴阳师择定；船台先浇一遍水，免得木头干裂；备齐滚木二十根、绳子两捆、水夫十八人、酒一桶。船首那根钉宜斜打抑或直打，我先问过坞里的老船匠，按他所授绘于图边。信末写明：木头倘若走形，我归去同他一起刨。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_boat_nails:n3:work","text"],null]']
src = "blake3:009fbd7eaba64d24b62e57238cd7c38fc909e592d37c5b9d56d1170b961012ed"
text = "回信约定九月下水"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:expert","reply"],null]']
src = "blake3:7c0cc8aa9b2d9089a7c62483b40567b637b426dc9f7aafd56ca9bc3fba7e0a94"
text = "我借来比丘尼的图，蹲在泊位旁比照着重画。土佐的船头说过，那智的湾口原朝东南敞着，图上却画作了朝南；那智外海又有黑濑川打西南往东北冲过，船才一出湾，便会叫它推着朝东去。我把改妥的岸线和那道水流指给比丘尼看，她抚着头巾寻思了半晌，说山上的画师一辈子没出过海。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:expert","text"],null]']
src = "blake3:ab7a6988114b8e02b6330d08e7815abc24265785bc91eef1c95574a0ce1b6d85"
text = "照着潮势重改图上岸线"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:wait","reply"],null]']
src = "blake3:8b66d14a1fc2c0bc8770d316d080c3e3192d69279c8cb9171ccac6e0fae185ec"
text = "阿松婆拉我拉得死紧，我便随她转身走了。这一路回晒网的院子，她半声未吭，直到坐定拾起渔网才开口：“跑海的人最忌讳直勾勾盯那种船看。”我没再接茬提那卷画。入了夜躺倒在通铺上，一合眼，眼前晃的仍是那四道小门。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:wait","text"],null]']
src = "blake3:ec6a341c9bc1e4b6721991eaf2a72ae149cdca9840574a4b613077621b24e1b4"
text = "随阿松婆一道走，不再看那船"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:work","reply"],null]']
src = "blake3:3f2f3b764305bb35204e8e74fd8abf41e32ee9ce0e9dc469657a2f2b545239f8"
text = "手头拿不出香火钱，我只得蹲在边上听比丘尼连讲了三回，每回照着勾一处：首遍绘瀑布和浜边，次遍描舟身与四门，末遍则专记她口中报出的地名。阿松婆在旁等得心烦，干脆坐上系缆桩枯数过往的船帆。直等到平潮将至我才收笔，册页上那叶小船的船首，正对着纸缘外头。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n1:work","text"],null]']
src = "blake3:de0939625ad5b10e66866406d58febe7d1d22c1cc21d8444b1ae9dd260454123"
text = "将图临摹到自己册子里"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n2:wait","reply"],null]']
src = "blake3:c6ffed444431b273abcbceca7e906112cd793cb48e80221c18546cdd01c71c01"
text = "我终究没交那份初穗，回岛后提笔写就一信，托西行海船捎往足摺的金刚福寺，向寺里老僧打探可曾留有渡海的旧记。这封信得兜过佐田岬，复经宿毛折入幡多，算下来少说耗时一月有余。转眼秋风已起，回音却仍无踪影。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n2:wait","text"],null]']
src = "blake3:c4167eb95370df508625221d9655380255f12ef0ca71d1de03995ffa8fb49cec"
text = "去信向金刚福寺打听"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n2:work","reply"],null]']
src = "blake3:92bccf8aba56c05f6959bfbefa6cebf6b52a5c157cc5b6aaaeebb6b7583232a4"
text = "我把钱搁到佛龛前头。老先达翻开书册逐行诵读：享禄四年的祐信，平日穿高木屐，人称足驮上人；天文十年的正庆；天文十四年的日誉。我听一句抄一句，每录一人便点一个小点在那智湾口。三颗点挨在一处，朝外便全是空白纸面。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n2:work","text"],null]']
src = "blake3:de760c9886fa248b5b68f4ccbf38a47eb3ecaa3e946e0e696262e50f4e406df7"
text = "奉上初穗，录下渡海人名"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n3:wait","reply"],null]']
src = "blake3:64d1e99082c816e0c41e21a2556621e70916264b0d0aa95b874320db5852a447"
text = "我将半成的图卷收拢，以纸捻扎牢，压入木柜属我的那一格最底层，又在纸捻上用假名题好上句，下句待站上崖头再补。这岛上画得了内海，终究画不出土佐以南的大海。鹰丸顺手替我合严柜门，嘴里嘀咕道：“可别搁到忘了。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n3:wait","text"],null]']
src = "blake3:eda1feea830101e7ba79c9743f7cde8d83931e3fb998af0afe7bcb3fee319e6c"
text = "收卷起画图，回土佐再续"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n3:work","reply"],null]']
src = "blake3:4748401815adc889321de41bbe95c4c60d675c0ccc9c5a6f9895ef4ae3c10419"
text = "我把沿途港湾一一勾实，各处潮汛紧挨港名标注，唯独足摺岬的山崖描摹得最为精细。岬南大片海面我却一笔未落，只管在纸隅用假名题了一行蝇头小字：待我亲至。又四郎审视过后，单落下一句：“留白甚好。胡乱画错的潮线，远比空着更害人。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_fudaraku:n3:work","text"],null]']
src = "blake3:2366c1fc8d7931f7d445bd7c8e9f7d28b6af64b9478f597594ec02b654cf1f40"
text = "只画到足摺为止，南边留白"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:expert","reply"],null]']
src = "blake3:f70bae02e291041ede2fded0f9709a4a8e9bee6a17c815041c2b2bb0b49faf4e"
text = "我将他临的那页举向日头细看。纵使摹得再走样，横画收笔处那一点小钩仍在，分明是康政大人的手迹，政所的奉书我在下田不知见过多少回。多半是母亲订本子时，误把他送来的粮账草稿混了进去。我写信嘱咐兼定将原本那页拆下，夹进覆母亲的回信里，只道是装订错了，未曾点破那是谁的字。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:expert","text"],null]']
src = "blake3:f5402d2a69add6a71502b8044f2e6365971eacb4bbdaf902e91703158cedc288"
text = "认出那页字是谁写的"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:wait","reply"],null]']
src = "blake3:90d24f327c684a6c670acf8392ac9c9860eb03d85c03bc59399ad4b4a1be3051"
text = "我托船寄信返土佐，请母亲另写一页寄去京里。信绕过佐田岬，再循南海路往返，一来一回动辄两三月，兼定只得空着那几首春歌接续往下临。他来信口称不在乎，可信尾却问了两回，那页何时能到。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:wait","text"],null]']
src = "blake3:811f1af562cad536f3fdc9ed5081e35d0c080a0c377e413e6c0b2939041f2bd8"
text = "去信请母亲重寄一页"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:work","reply"],null]']
src = "blake3:2b77723612b72b3db47ac8a506b684312cb2d3ff552f34f6768ee63283a951bb"
text = "所缺的那页本该是春歌。我仗着记忆将那几首默写出来，假名一笔连着一笔，写完数了三遍，一字未漏，遂托东行之船送入京里。兼定回信，嘴上说“姊上的字一股鱼腥味”，末尾却又说已照着临了整整一页，连我写错又描过的那一处也照样描了下来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n1:work","text"],null]']
src = "blake3:ed431a0cafc1e4b8c69aa2c0db47a6c20a9a3cf15a1cc6fd6473bf8647d835a9"
text = "把缺掉的那页春歌补写上"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n2:wait","reply"],null]']
src = "blake3:8c1df5cddbc589304827e6d8c9e6ed3c62a3abce444ac54c16f56230f270ae85"
text = "我修书去求本家的家司。他回札客客气气，言道下个月本家恰有人赴土佐，纸亦可从库房拨些许，“只是这份情面，姬君来日要记得。”兼定抄得略显潦草，总算赶在使者动身前封好了。我身在岛上，隔着一片内海，一张也未看着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n2:wait","text"],null]']
src = "blake3:b9d23d0a37c48f552f8e31e3fc47c4bd835d4367c100cfa6020789ce2066e5d9"
text = "求本家家司拨纸带回"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n2:work","reply"],null]']
src = "blake3:4fe94eec1f3645bea69e902c7637223c2d0c29b03f3c930e97aca0187b4da868"
text = "我拿帮工攒下的钱，候着东行的纸船在门前停潮，上船买下一叠杉原纸，托船家顺路送进一条殿。信里与兼定约好：每写完十张，先寄来由我过目，写歪了便重写。他回信骂我比先生还要凶，十张一回，寄了三回。及至第三回的字，我挑不出半分毛病，遂于信尾批注：可寄予母亲了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n2:work","text"],null]']
src = "blake3:a8560b381eda2b1d130fef66850212f775bfba045bf83bfab2d089cff681984f"
text = "买杉原纸，约每十张寄一回"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n3:wait","reply"],null]']
src = "blake3:87696f60439639076806a8458308e3446c36371f345cb896ee0320a1d0c8410f"
text = "我回信言明书札规矩，回了中村自有康政大人指教，比我教得准。兼定隔了很久方回信，纸上寥寥一行：“那称呼的事，姊上也不管？”我答他：管，叫什么都行。这一句他未再回复，及至下封信抵岛，笔下所谈已是别的事了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n3:wait","text"],null]']
src = "blake3:e5f893ab25eeba82cb9e9d13ad671a990e3a64f219cfc9662feccda7fd4511dc"
text = "规矩交由康政大人去教"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n3:work","reply"],null]']
src = "blake3:352ee59b09a12ca536c04f7f4fb58b91a7a03dfd05fa5c30d38eb5fe6d522899"
text = "我照着康政大人的来信，替他拟了五封书札的样子：宛名写于何处，自己名字落得多低，给诸大夫用哪一等敬语，给家老又降一等，每一封旁皆以朱笔注上道理。他一封接一封仿着写，写至第五封寄回来，末尾署名终不再往右倾倒。我在回信里写道，我还叫你兼定。他下一封信的留白处，也写着这同一句话。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n3:work","text"],null]']
src = "blake3:fb4f896cc12531c1315dfe2f29a316691261d0778fa190021803bfd382bc428f"
text = "拟几封书札样子寄给他"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n4:wait","reply"],null]']
src = "blake3:81ee1d5088e8e3fea2a8aa311a585e20f17e567ebf40d4b759b477f143b36b3f"
text = "我回信说出海的事尚早，先把你自己的字写正。那一页“姊上”，我原样夹进信中还给了他。他的下一封信照常说习字，说房通大人的药，彼此皆未再提那天夜里的话。至于那一页他后来撕没撕，我便不知道了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n4:wait","text"],null]']
src = "blake3:f4b768a44389f35be06217e7a679f4ca2e0e57e113fa4578116ad8052b42690b"
text = "道出海一事尚早"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n4:work","reply"],null]']
src = "blake3:954eefd2f35cd71e5309799c7a04e72c066d4eaa69ba028d5cc9e6b65bf1e430"
text = "我在那页“姊上”底下写：每到一港，一封信，记潮时。落笔后寄回京里，请他续上他的。及至寄回来时，侧旁多了一行：每封必回，字不许歪。两行字挤在一页之上，他那行比我的还要用力。他又在那一页折了个角，言明往后谁也不许撕。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_kanesada_letters:n4:work","text"],null]']
src = "blake3:8714d7022efd82f410ae7052978a76b4970abf89b6af43676e66d848b9f59742"
text = "将约定写进他寄来的那一页"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:expert","reply"],null]']
src = "blake3:560c309688579b8df06a943fb5b0612392f8b3621faebc93a5ceb3a85cb7e438"
text = "我忽然记起下田米仓尚有另本账簿，去岁春间我曾在仓前朗声核过。单子上名列第三与第五的两户，去秋新米是直接担往河口仓交纳的，入在了下田名下，中村这头却漏了销账。两处一冲抵，七户实欠之数还不到清单半数。我将该记入下田那页的袋数逐一列明，注清年月与仓名。母亲捎来的回信仅有一句：“康政大人过目后，未再提催租之事。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:expert","text"],null]']
src = "blake3:aa5b8e6cc0925902eae54a42fff53f1509ea94f7626c559357a56211343ca976"
text = "取下田仓账逐户核对"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:wait","reply"],null]']
src = "blake3:76ee6ece2f1afec6b8d39ddeae59caa24302654e1cd98b6306b8a7aae2add642"
text = "我提笔写了三张纸，算这算那，终究一张张撕作碎片。田如今成了何等模样，庄户家里尚剩几口人，我在岛上一概看不见。末了只回了一句：“田的事，母亲看得比我清楚。”后来听说母亲将七户的欠租一律缓到秋后，政所的人嘴上没说什么，那笔账却在册子上悬了一整年。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:wait","text"],null]']
src = "blake3:27a7a728720e51721da6b4e69c83aecd1a1da9eb870b6951860e4600c5b543e5"
text = "回信称全凭母亲定夺"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:work","reply"],null]']
src = "blake3:f80c384d89b121e267710e405877fe477fe39b0b140b66e50c1b17ad833d74fa"
text = "我依着清单将七户的田一块块折算：淹了半月的减半，淹了几日的减三成，没淹的照旧。每一户减下多少，便在政所那一边注一笔“免”，账尾两头的总数方能相合。算罢写成一张表，托往西去的船带回。番所老账房在旁看了一晚上，问减下来的米从何处补。我被他问住了，半晌方说：明年再说。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n1:work","text"],null]']
src = "blake3:8332dd69f7ff952bd4a7bf4596ab691d3466e4f13d2e79918432f8ed6842de94"
text = "照受淹田亩核算减免"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n2:wait","reply"],null]']
src = "blake3:cfd82f412297d03a23bfd204495eabdbfd3ce2bfbbcba0aa7e7210630c60d55e"
text = "我将缺口算清楚，写成一封信寄返中村，只写数，不写办法。候信的那一月间，我照旧下水、划船，脸上丝毫不露。四月底米运抵了，比缺的还多出两袋。随船同来的还有母亲的一只空螺钿盒——盒里那对出嫁时带来的珊瑚簪，已叫她卖给了堺的商人。信里说，盒子留给你装别的。衬底的旧绢叠得齐齐整整，仍是她收拾东西的样子。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n2:wait","text"],null]']
src = "blake3:5ab13dda6ed375ac869bb9be0fd9360c1162e3c930001cd66b3a12a28a542f2f"
text = "修书请母亲筹措法子"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n2:work","reply"],null]']
src = "blake3:f90867115baa1668144dd851fd6d6d5da74bd9c7a21ab2316c8440916730dd7e"
text = "我将这两年帮工攒下的钱倒于通铺数了两遍，拨出一份赴靠岸的米船上买米，先顶上三月。旋又重抄岛上的账：哪一笔是中村送来的，哪一笔是我垫付的，分开记开，垫的那一栏另起一页，标明“待还”。老账房捧着账看了半晌，说见习里会记账的不多。阿松婆在旁小声嘀咕：“姬君，下回买鲷鱼的钱没咯。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n2:work","text"],null]']
src = "blake3:ba7f816c9188fac1ad732b7dd5ed0807203e05d55740a41f2f50c02fec9b068a"
text = "动用私蓄补齐缺口"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n3:wait","reply"],null]']
src = "blake3:641bd86dd92ef3ab448b78f40a2b0b6d5c0dfa24773dedfbbb1bfc7902bcc146"
text = "我没重抄，将那一堆纸片扎成一捆，原样寄还中村。几回手痒想解绳再理，终归忍住了——今岁开讲后还得带新来的见习，又四郎放过话，新人在急流里呛了水，尽算我的。母亲回信来得很快：“收到一捆乱纸，倒也看得懂。”至于康政大人怎么说，信里没写。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n3:wait","text"],null]']
src = "blake3:543bb5a093d6155f8d8a397d089c9f8a6756ad93d85f009184dad2eb12e527cd"
text = "把零散纸片原封寄中村"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n3:work","reply"],null]']
src = "blake3:5aca19aa1fe9dfe8667cb8c3960df823cd7fa03566376cfb8390de0fe133edad"
text = "我将纸片按月份排好，逐张誊入新册子：一条家的每一条船，过濑户记一笔，缴钱记一笔，讨旗记一笔，三笔接得上，方算一趟。抄了半个月，白天下水划船，天不亮便在了望岩上抄账，手腕酸得端不住饭碗。抄完一数，三年竟差了一趟，原是前年一条盐船趁夜过了濑户，没停番所。我在那一行旁注上日子与船老大的名字，一并寄了回去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n3:work","text"],null]']
src = "blake3:7d93e2e11b891e095a022fa061dbeab91a44cdd5ecf51b468922c96b65d944a5"
text = "将三年过路账重抄一遍"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n4:wait","reply"],null]']
src = "blake3:b64559039d2cfb795fe9112f4603d1870755b13cebbcbbd0771e5b6a66232ab7"
text = "我回信说，岛上的账母亲那里俱全，由母亲定夺便是。信既寄出，我方想起未曾写一句问她身子安好与否。后来家计交没交、交的那天说了什么，我在岛上一概不知；唯独那封信上洇开的一小块，被我拿指头摸过好几回。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n4:wait","text"],null]']
src = "blake3:0a40d3298336b11342a3a5a6fb54cd0441c05421df3711a4aeb02fb1f31589b5"
text = "复信请母亲自行裁断"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n4:work","reply"],null]']
src = "blake3:3644f384471ca6caf60db81fb48b514efd55be60c61cba5012558136c4005c96"
text = "我将三年的过路账再誊一遍，这回用鱼贩船上买来的最好一叠纸，假名写得一笔不苟，船名、缴钱、讨旗三栏排得齐齐整整。写到末页，原想在尾端添一首歌，提笔复又放下了——末页该留给母亲。册子用麻线订妥，托往西去的船捎了回去。阿松婆说我抄账的时候，比写歌还静气。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_mother_accounts:n4:work","text"],null]']
src = "blake3:6eab5588fdc44d0c13f040336946a4f2f1abd0afdd9bbfa685ac6f3b04c99d66"
text = "用工整假名另誊一份"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:expert","reply"],null]']
src = "blake3:b9f0083922dc8ede37c4d5fbac1ca70922ef718bfd56301515bc8f5818ba3260"
text = "簿子上记明那晚正是十七夜。我按着下田的潮汐一算：戌时末满潮，亥时开始退潮。那十一条船里，唯有清水来的盐船是乘平潮进河并停过渡口栈桥的；退潮才起，它便要顺流贴着对岸赶返盐仓，离桥时天色正暗。我将潮时与船名细细写明寄回。入冬前母亲来信告知：盐仓里果真翻出了三捆楮皮，绳结仍是渡口的系法。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:expert","text"],null]']
src = "blake3:df1bc9f6715532bb1a7c3cde4eecb4fe3a3e67768f885ffd5b47552b008a90c4"
text = "依那晚的潮水推算船只"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:wait","reply"],null]']
src = "blake3:ab2588e0f180b167df94a3ddc03712a9fbd5be882e5e565f10a7d1044020b733"
text = "将那十一条船名从头阅罢，我把纸折好。中间隔着伊予滩与佐田岬，纸面墨迹分明，可那夜河水如何走，我却望不见。回信里我请母亲把抄件递给加久见的老船头，过往船只他都认得。信发走后，我每日跑去番所打听西行船只可有捎来回音，问得老账房一见我进门就直摇头。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:wait","text"],null]']
src = "blake3:7b3562853dd55446ad9f594953bfbe4255eee00af7e35bcca56b8ebf0a9f829b"
text = "请母亲托付老船头去查"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:work","reply"],null]']
src = "blake3:2d69c1de761ec4d03899bdcc570ebdb813c4e11bb61129e57fd09163db58f987"
text = "十一条船，我一笔一笔核过去：哪条进河赶上涨潮，哪条出河正逢退潮，哪条在渡口泊过。连查了三个早晨，筛出两条来——清水来的一条盐船，中村的一条柴船，都在那个时辰停过渡口的栈桥。可单凭记录，实在辨不出究竟是哪一条。我把两个船名写进信里寄回，待信抵中村，十月已然过半。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n1:work","text"],null]']
src = "blake3:9f3e1cc0e87f297978a38f23249a9e088d6b55388d516cc3b8b804429c618dba"
text = "逐条核对泊船的记录"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n2:wait","reply"],null]']
src = "blake3:f45c45b52ae74d6e9aa7a560d92b06228404f81b4f573d9ebe5404c2b526b8ec"
text = "我原想登他的船去理论，转念又记起岛上规矩：见习不得私下与过路船主争执，番所的公事归番所管。于是将前因后果写成一封长信寄回中村，请母亲央求政所出面。盼回音的那阵子，我常在船坞里磨刨刀，磨着磨着便想起渡守那一声，手下划着圈，竟一下不曾停过。后来母亲回信说，货主肯退回一半，只是渡船仍押在米商手里。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n2:wait","text"],null]']
src = "blake3:4faf4738a5eb01a445ef9d182552ef846c203778e7d7b98cdd462832a286722e"
text = "请母亲出面与货主理论"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n2:work","reply"],null]']
src = "blake3:dea25b27ca2eff8b1748ed7c7eb500328064c45faecfab962bba191454e6f34c"
text = "我先取出自己积攒的钱，托西行船只捎给渡守，让他先把渡船赎回。之后便每日到番所查过路簿，守着货主的纸船在岛前停潮。他起初赖账，推说楮皮在盐仓里闷久了，早生了霉。我立在他船头上，将那夜水势一桩桩拆开来讲：何时涨满，何时转退，盐船又是顺哪道水路下去的。听到一半他便变了脸色，况且番所的人正站在船舷边等着点他的帆。这一趟先追回一半，余下的，他允诺年底再过濑户时结清。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n2:work","text"],null]']
src = "blake3:6c8414879c9471f2b08be11dfb715a91425b29fad4ef116820bf441a093fe9ea"
text = "先把钱垫上，再去他船头讨"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n3:wait","reply"],null]']
src = "blake3:096f485cf945ae251c0b28b287fc4537ec364fef67b6c424d5ca5f322b4128bd"
text = "我将此事托付给母亲，月底便要赶回能岛应付最后一回考核，行装尚且没收拾妥当。动身那早，母亲告知政所已应允秋收后再作计较。船出河口之际，老渡守正蹲在岸边补网，头也不曾抬。新渡守的船在河心直打转，我扶着船舷回望了许久，随手在怀纸上记下一首歌的意趣：河面少了那一嗓子，连落潮都显得慢了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n3:wait","text"],null]']
src = "blake3:016a8118f24e20dd06beacacfb1e7d388e0df44c4a6188a5b2b7c5f736861af8"
text = "请母亲去政所替他说情"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n3:work","reply"],null]']
src = "blake3:83d12a79966be9b4f38e349ff16e8b36cfcae3564a042a7976544fb9c75a0fc2"
text = "我赴政所请动康政大人亲往渡口一观。那日午后转潮，老渡守与新渡守各驾一船，一齐从这边岸口离岸。我立在老渡守船头盯紧水面，吩咐他先忍着，直待漂浮的草叶止住不动，才喝一声下篙——在能岛候了三年平潮，这当口我合上眼也辨得清。船笔直切过河面，新渡守那条却被退潮带偏了半町远。康政大人当即把渡口归还于他。他在河心放声一吼，两岸行人皆转过头来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_river_claim:n3:work","text"],null]']
src = "blake3:8e9eba91da3c607ba9d9586bb019a3460ef6c41e397e0032c02e0a9756f36475"
text = "同他摆一趟渡给政所瞧"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:expert","reply"],null]']
src = "blake3:9897764929fc3393dc52e08a24ef92ca42f3b843c777c603aa3f6ae9ced40256"
text = "我找坞里的老船匠讨了块桧木废料，削出等厚的镰刃与桨环。刻完并排放着一比：两样恰能从同一根铁条上分截，一炉透火就能一并打出来。我在木样上特地划出落锤的印子——铁匠不识字，刀痕总归认得。木样顺船寄走后，入秋时母亲回信报称，镰赶在开割前便打齐了，炭竟还富余两俵，船具尽可徐徐打造。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:expert","text"],null]']
src = "blake3:bab096e519283362459d605c79787c892c2e0e6d8258db3503fa1304024ce62e"
text = "刻出能一炉打齐的木样"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:wait","reply"],null]']
src = "blake3:243a019124525265dd27730bdea98104fe71ec5731f932ff6fdb6fa3854de519"
text = "我把那木片翻来覆去端详了几遍，终究回信交由母亲作主——中村那头的轻重，母亲心里更有数。母亲定下了先打镰。缺了新锚爪，那条小早只得在下田的船台上又趴了一个冬天。我心里一直挂念那只活像螃蟹的锚爪，夜里竟梦见它栽进了宫洼的急流当中。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:wait","text"],null]']
src = "blake3:f0419652acc141b9360a23884b30cdb08efc39049c15dc361ad6c71aa2c53944"
text = "交给母亲替铁匠定夺"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:work","reply"],null]']
src = "blake3:4c09e0a9cea9d6e75de0be6d7a6e74d4cb34db6e04c081bd4354672d552a87df"
text = "我回信叫先打镰，庄户的农时误不得，船具的尺码由我来拿主意。坞里正架着小早，桨环与锚爪全摆在眼前。讨来一截旧樫木，光是锯开就耗掉大半日，两条手臂直打颤，连凿子都攥不稳，只得歇到次日再动工，对着实物照足尺寸一一削成实样。鹰丸嘴上讥我手脚慢，手底下却替我按着木料，比我自己使的劲还足。木样捎回去后，铁匠托母亲转话回来：“刻得倒比画的强。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n1:work","text"],null]']
src = "blake3:f0ab8046e91424698b85fb94b142f381c02f3e6c12b6270eb4c505e1da7b0cf0"
text = "依着坞里小早的尺寸刻木样"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n2:wait","reply"],null]']
src = "blake3:83319fe0e1575fbd29e42d80ef0c19fcb1460742a394ad907eae8969038eb93f"
text = "我并未阻拦，回信只简短落下一句：那便有劳当主下奉书了。后来他信里自述，自己摊开纸张研了半晌墨，一笔一画郑重撰写那道奉书，“炭”字却写偏了，只好涂抹掉重来。奉书乘船送抵中村后，政所竟将御所过冬的炭硬分去一半予铁匠。入冬母亲再来信时，说御所里的炭盆比往岁冷清了些。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n2:wait","text"],null]']
src = "blake3:5639bb73cbcf7580cf019f198df0fce7d03495ea1a02332dd5856d82d1282e00"
text = "请兼定发一道奉书"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n2:work","reply"],null]']
src = "blake3:595d65ac710f5993dea1c234d43380bff4e8c632292b207ce7b877f50db5b432"
text = "我取了手头攒下的钱，另立一份保结，托母亲转交外山炭窑：下田铁匠今年的用炭，先一并记在一条澪名下。接着又从坞里讨来一块樫木，接连刨了三日，做出风箱用的推风板，四沿特地留好镶毛皮的槽口——松根火候浮躁，鼓风最忌不匀。活计做完，两条胳膊肿了一大圈，阿松婆守着给我敷了一宿的湿布。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n2:work","text"],null]']
src = "blake3:76c937314a21a2c7191a16b798d28fc41cd9d91a088753c4b7b8835edca61447"
text = "出钱担保，再削风箱板"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n3:wait","reply"],null]']
src = "blake3:5f87c13bbc0b9af61cb0298a59a21bdef58696323695ba601dc3ca8491764945"
text = "我在回信里写明，船具既属政所，理当由政所管船的人去查验，我在岛上说行说不行都不作数。桨环留在了我手边，一整个夏天都拿它镇着潮图。后来船具交全没有、交货时铁匠说过什么，信里一字未提。唯独那只歪嘴的鸟我还记得，嘴是朝左边歪着的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n3:wait","text"],null]']
src = "blake3:bcd90ba8e95ad678fbd59c0b9fc96a4e5ea24225fb358efc7d2bfcbcf28c639e"
text = "交由政所管船的人查验"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n3:work","reply"],null]']
src = "blake3:a8cde1720673b694b53083b8c9901929068b8171d1284dadf980fc85a8f707ad"
text = "我比照小早的船桨削出一段木柄，恰能严丝合缝卡进桨环。抱去泊位上，双手死攥着木柄，双脚蹬住系缆木桩，憋足浑身气力猛拧——木柄都吱吱作响了，铁环却纹丝不动。鹰丸蹲在一旁桩头上旁观，笑话我再这么拧下去，木柄准先折断。我回信单写了一个“成”字，末尾又随手添了只歪嘴鸟。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_noshima_side_tosa_forge:n3:work","text"],null]']
src = "blake3:bcb2013353e2313f6bb401c6bcbc4638e146a5a2d9a6c685b5a00045fb85ef36"
text = "削根桨柄来试这个环"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:go","reply"],null]']
src = "blake3:b3b8ae9b49511e2cf5ce928b753e6028e664cbcfa2c42097d595992be4431555"
text = "我照老人的意思写了信，写得很长：岛上的账、番所的灯、阿松婆的梭子。写完念给阿松婆听，她听到一半便说：“她不会回的。”月余以后阿濑的回信到了，代笔先生所写，只有一行：“姬君在岛上，替我看着就行。我不回。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:go","text"],null]']
src = "blake3:12efcf8bfb8157c8b2af1d837daf6d5ab1173f006cb8dc5b30d68648e8bfbf44"
text = "写信劝阿濑归岛"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:osama","reply"],null]']
src = "blake3:e6265a423c39d04a781e8f08d4103886e5c7110dc0701053a585c0fa784724a7"
text = "阿松婆把梭子插回网眼：“当年岛上有人说，喂旁人家孩子的女人，奶是卖钱的。阿濑听见了，没吵，次日便抱着刚满月的汐，上了去土佐的船。”她把网抖开，“她那个人，话不说第二遍，路也不走回头。”我没写信，只在潮簿背面记了一行：阿濑不走回头路。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:osama","text"],null]']
src = "blake3:1fbcdeec77d707b191b623b3f9f21b21797f7472dbaec72d00bbf4d284611ad1"
text = "先去问阿松婆：阿濑当年为何走"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:stay","reply"],null]']
src = "blake3:d65c52bf4c80ccfefb5b4ca401aa7b83480fd67329679482a7dcd2fe88f8fe0e"
text = "我追上去，跟老人说：阿濑的奶喂的是一条家的姬君，姬君一日未出海，她便还在下田。老人回头看了我良久，说濑家的小鬼，口气跟她一个样。这话不知如何传回了下田。阿濑来信骂我多嘴，骂完了，信尾却画了一条船头翘得很高的小船。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n2:stay","text"],null]']
src = "blake3:741634a8d60315fc4463012608a6ae7258eab02c6d12d377a0a52eaf737ff662"
text = "追上前告知老人：阿濑留在下田"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:ask","reply"],null]']
src = "blake3:2548ae0d9b95c213e440d7cf70a141c600a46052610e7a41b8afed34701e65c9"
text = "我跪在案边求他写回去。老人搁下笔：“你拿什么换？”我说拿我这两年的潮簿。他端详我一会儿，没要潮簿，也没写，只是把那一行空着，不让后面的字挤上去。又四郎后来跟我说，空着，便是还留着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:ask","text"],null]']
src = "blake3:2473e3f64b2646b9928b4b212ed1b84d59f4696c993f4fd843304fad8345d3c2"
text = "央求老人把那一行补回"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:fill","reply"],null]']
src = "blake3:beb75d8a4a30da8818c107212107f94133e7dcde37e581f37836581d0573f091"
text = "趁夜里番所没人，我摸进去，在那一行空处写回“下田·濑”。字写得很小，墨研得太淡。次日老人翻到那一页，看了良久，没刮，也没骂人。又四郎当着我的面跟他说，那几个字是他写的。老人道：“你认得几个字。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:fill","text"],null]']
src = "blake3:756975cc61c0cb14979e7fb01b997479940b5a062ad579e1b0f40e141f060eb4"
text = "趁夜深无人，亲手补上"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:tell","reply"],null]']
src = "blake3:f20d3ad8141c691313d806b2bcaf239f6659e622f1f1d4d50fdc63d885fb693a"
text = "我照实写信告诉阿濑：番所誊旗账，跳过了下田那一行。回信来得极快：“跳过就跳过。我的名字在姬君的小早上，不在他们的账上。”信纸背面画着一条小早，船尾写着一个小小的“濑”字。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_ase_noshima:n3:tell","text"],null]']
src = "blake3:309449708f04217793512e20b6f74ea07dd55b30718087d18e368ffd064989e8"
text = "如实修书告知阿濑"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:bury","reply"],null]']
src = "blake3:25572eb9357bff91c15c7718f3c7a9b50f30f20e2eb57cb471c0eb8c1cd77bfc"
text = "转潮还要一个时辰。我领着弥平次去龙神祠，跟扫祠的阿兼婆讨来一盏灯，为那头鹿点上。弥平次合掌拜了良久，嘴里反复念的并非经文，而是兼定的名字。阿兼婆问是替谁点，我说为一头鹿。她瞧瞧我，没再多嘴，只往灯里添了半勺油。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:bury","text"],null]']
src = "blake3:81362664544fe97e2650d7f238724cb49905263f5ca0547eac72197a3b1615b3"
text = "陪他去龙神祠，为那头鹿点盏灯"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:confess","reply"],null]']
src = "blake3:a567cb5598f785ee1490d8f6a7f883d167570f84ff35947396a50a900a2f1ebe"
text = "我当着弥平次的面给兼定写信：自己射的就得认，休教老人家替你担着。信托东去的船捎去。过了一个多月回信才到，只一句：“认过了。神官不收。”彼时弥平次早回了土佐，还是下田来信说起，我才知他在中村渡口撑船。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:confess","text"],null]']
src = "blake3:4f108b7f99a66f9884d854f8d0fc0e94b015a3f95cc20a49cf33092b3e363442"
text = "去信叫兼定自己认下"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:hide","reply"],null]']
src = "blake3:e2dd6110588968e1c28adcff2b7e9d780700b2b43ac6147efc2e0b6a25e1b4ac"
text = "我道，既认下了便认到底，殿下的声名要紧。弥平次磕了个头，仿佛早料定我会这么说。潮水一转，船要启航，他挪回船头蹲着。鹰丸在一旁望了我一眼，未发一语。当夜我在潮簿上记这一潮，几时转、朝哪方走，写得格外详尽。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n1:hide","text"],null]']
src = "blake3:efe1f345b29d130c9fe082d6005e57b188a78b4a104f97904aaed20a9d00fd57"
text = "劝他照旧认下去，莫再提起"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:sea","reply"],null]']
src = "blake3:fc72077a346935a7bef7e372b9ce9a12c945609571a7f825ac145c695818bd43"
text = "我写道：老水夫讲，人死后都去海那边，一路向南，过了足摺还要往南，是船驶不到的所在。兼定来信问，船驶不到，人怎去得。我答说人不乘船。他又问，那姊上往后坐船去，可还能看见他们。我不曾回答，只在信纸上画了张图：一座足摺岬，岬南尽是大片空白。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:sea","text"],null]']
src = "blake3:10dadf950f4951ee2d9a02c2d5f5c237a30d50328ef4fba348f047ec48536476"
text = "复他：往海那端去，船到不了"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:unknown","reply"],null]']
src = "blake3:9601dc0b5b835033c9c7b23a81967b8827177bbe4d4488025148050167b15ec7"
text = "我仅落了三个字：不知道。写罢嫌太短，补上一句：晓得的人从没回来讲过。他的复信隔月有余才寄到，亦只有一行：“姊上也有不知道的事。”自那之后，他信中再未提起这桩。我总觉着，他是问旁人去了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:unknown","text"],null]']
src = "blake3:91ef1ebe457da3ab692485bc091d0430f064c56aa6776bd81def395a03cd230a"
text = "复他：我不知道"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:west","reply"],null]']
src = "blake3:3b17af4b6c71d1f604cc5b5fbd63245257c977271589f0772e801310d23de61c"
text = "我伏在泊位桩子上写：人死后皆往西去，阿弥陀佛在彼处候着，念过佛的都收。写到鹿时我停了笔，想了想，添一句：鹿也收。下一班东来的船带回他的信：“念过佛的才收。那鹿念不了。父上念了没有？”这话我答不上来，便没再回。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n2:west","text"],null]']
src = "blake3:6ced58f9d6f278e4fafb1258646102ca76c6c35abb611681d00cc3a1983d85c6"
text = "复他：往西去，阿弥陀佛那处"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:let","reply"],null]']
src = "blake3:6e75e14db01dd6c5c8093e84b1391bc5927918a5e4a09a36734ea1b34a5ca754"
text = "我复信只落了一行：哭了便哭了，眼泪是热的，往后也还会热。写罢觉着不像做姊姊的话，倒像阿濑的口气。兼定再寄信来时说，他把我那行字贴在文箱盖内里，家臣看见了问起是什么，他回说是潮时。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:let","text"],null]']
src = "blake3:182963e573227338a716ae4f003bace251b97ffeb582f28b017cdc3c33034980"
text = "复信：哭了便哭了"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:shield","reply"],null]']
src = "blake3:27c6d8d45c54b5581b4d88dd5bb3d14fae7bf37a27491b0dfd1c722f068bbe98"
text = "我另给弥平次修了一封信，托中村的人念给他听：谢过他这些年，鹿的事，一条家欠他一回。兼定落泪的事，我信中未提半句。后来听闻弥平次央人将信念了三遍，念罢道，姬君的字他认不得，可认得那个“欠”字。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:shield","text"],null]']
src = "blake3:2c1db9baad4c693eaf1417695fd6fe31a16c01fcd15e397ac11e44a3ad8336ca"
text = "另修一信，谢过弥平次"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:why","reply"],null]']
src = "blake3:2b51f5859faf084d874e6a1f17ce75cdc75e060539429655bfc6ac39a36bf3f5"
text = "我回信问他为何落泪。他斟酌许久才复信：“他没怪我。他原该怪我的。”底下再落一行：“不怪，比怪还要重。”这三句话写得一句端正过一句，末一句方正得直如奉书上的字。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_kanesada_noshima:n3:why","text"],null]']
src = "blake3:027babf3fe749609d2187ef62f09fc2dc3b366b6c898d0f91ade7ebe3c241213"
text = "回信问他：缘何如此"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:ledger","reply"],null]']
src = "blake3:a05e46b9292f3946da79c99b95293f6c00b6a2f3373e738895434562e9554cbd"
text = "我将粮账逐页核对一遍，把进出对不上的地方用朱笔圈出，注明原委，托东去的船只带回中村。那行字我只字未提。封缄前，我又翻出那一页，拿指腹顺着那道未涂掉的墨线轻抚了一回。纸页叫海风熏得微潮，墨痕抚上去平平整整。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:ledger","text"],null]']
src = "blake3:bcd521cf033e0d918b41b435a0d634322621f8e704dac768d77e5fd67bde0f40"
text = "只复粮账事宜，不提那行字"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:nun","reply"],null]']
src = "blake3:85cd3d39c6821c46a63705fd8d64f5bcc91d30a43ccf0807660a02f7e721a3eb"
text = "阿松婆不认得字，我逐字念给她听。她手里的梭子并未歇下：“沉进海里的人，连尸身都打捞不到，岛上没人问佛肯不肯收，问了也无处求答。”她顺手勒紧一个网结，“半夜听见声响，只当他回家取东西。取完了，他自然会走。”回信时我没敢原样转述，只写道：岛上的老人家讲，既听见了，便由他听着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:nun","text"],null]']
src = "blake3:dfb0992a62f58201b536f0bb42f643ae73e317ab3f7b2b385a04e8241526fcb1"
text = "念与补网的阿松婆听"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:who","reply"],null]']
src = "blake3:4a5f857285cbc4ca2b4567140b1c185afa4ca81956326bc514f5c14877e46d15"
text = "回信起首我便直接问道：母亲夜里听见翻书的，究竟是谁。写完后盯着这一行望了许久，终究没改。过了一个多月，母亲的回音搭着东来的盐船到了，粮账照旧附在里头，眉批一笔不缺，唯独那一行半个字未提。信尾只多出一句：岛上风劲，夜间莫坐在泊位上。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n2:who","text"],null]']
src = "blake3:15e6e0cd94c4d2811aae940cb791c3d0b83da361ea345c841aefbbfd8a3a859a"
text = "复信探问：所闻究竟何人"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:amida","reply"],null]']
src = "blake3:c8b0a0ac4090da8fcad01c44eb51ac7ac8275417d6a0a8b9ba5adc2d1120c568"
text = "我将法然上人那纸遗文中的几句默写给她：只管念去，余者不必多想。默罢犹觉单薄，另添了一句自己的话：海潮从不问船是谁家的，涨起来便一齐托着。信寄走后，我才猛省这原是阿濑的言语，不是佛的话。母亲回信只道：“这话阿濑也讲过。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:amida","text"],null]']
src = "blake3:9e907e034c4adf60348f14b1c160a761707f37b8f1df75d77a92d836383c78a4"
text = "修书代弥陀分辩一言"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:island","reply"],null]']
src = "blake3:cb899631378f815c76033ae18ed7fc3c75099574025cc3f23b905f39648b10f8"
text = "鹰丸听罢，把手里的缆绳往木桩上一甩：“淹死在海里的人，龙神收着。哪家的神都不用点名。”他话讲得理直气壮，简直像龙神是他舅舅一般。我回信照原话抄了上去，推说是岛上一个小子讲的。母亲回信里头一遭见着个笑字：“这孩子的舅舅，倒比义镇大方得多。”"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:island","text"],null]']
src = "blake3:f5962792dcb3bdf07a0c4e910618754e733db43a511cf54131fc0ca7cdc5304a"
text = "念给鹰丸听，听他如何回话"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:none","reply"],null]']
src = "blake3:5c8b074c781418cc5ec1bb370e3dea380eaa06196c0e3b16825f8adf0cb5f93d"
text = "我如实写道：哪尊神收留谁，我答不出；我唯独算得清这一季过濑户的船有几多条，帆别钱又收上几成。写完觉着语气太僵，便又添一句：母亲诵念时，我在岛上也跟着念一声，算作两人的份。这句字迹极小，紧挤在信纸一角，不知她瞧见了没有。"

[entries.'["upbringing/families/mio_noshima_life.toml",["choices","c9_mio_rw_rosary_noshima:n3:none","text"],null]']
src = "blake3:fa90acdc10ee54fa2ba36029f033494087d3a195c7c6437c3156b93599b590bc"
text = "复信坦陈：此事我答不上来"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_2:event:honest:2","text"],null]']
src = "blake3:720b1a771b955c75547ce927cc2c381d56cf7dd43f414162d007fb7be1b160bb"
text = "姬君。头一月岛上事多规矩重，我猜得着。写不出便罢了，缺这一个月不算你赖账。可下月那两首我记实了，真要少上一首，我便搭船去能岛找你讨。鹰丸那小子敢说没输过，让他把船板掀翻过来给你瞧瞧。通铺夜半冷，莫挨着门边那头睡。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_2:event:share:2","text"],null]']
src = "blake3:2ba6bf3c8f7d05750c4ff2d6501a1b6e932ea5a95316f3291e3a3b5806fc725e"
text = "姬君。歌收下了。我念了两遍，念第二遍时码头上的人全围过来听。宫洼那潮翻得太急，先莫下去，坐在岩头瞧着便是。下个月的照旧要。你那船画得不对劲，船头翘那么老高，是要翻船的。阿松竟还活着？替我问一声好，就说网梭我还在使着。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_3:event:honest:2","text"],null]']
src = "blake3:f50b10b6fad3df716f9cfc123b144437afb2d329a273afc83c86946387e31916"
text = "姬君。信读过了，桌案我也拿网梭重重拍了一记。先数到十，准了；数到十仍非砍不可，也由你，这原是船头的决断。把那串绳结解利索，再上我跟前讲砍与不砍。岛上汉子腰畔都挎着刀，姬君切莫学他们遇事便先拔刀。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_3:event:share:2","text"],null]']
src = "blake3:5dbe380c4b240d93f6fd5be57cafbda0f8c14bf858c60a7fb4111248f4e10763"
text = "姬君。绳索寄到了，七个结系得全对，只第五个松垮些，到了海上一沾水便要松散。名字也标错了两样。又四郎倒敢说余下四个是我胡诌的？他小的时候解不开我打的结，还哭鼻涕跑去找他娘呢。下回给你寄一截浸过水的，湿绳子才叫难拆。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_4:event:honest:2","text"],null]']
src = "blake3:faaefa3130fd7d9860c628dbd54e3e127b2d99e60529ddb4f9d41b32dfe4598f"
text = "姬君。番所那老头让人带了话来，道是一条家的姬君倒肯认账。肯认账固然好，作保之前先多瞧他两遭，却更好。钱我已补足了，不用急。你摁下的那个指印，叫他们莫涂掉。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_4:event:share:2","text"],null]']
src = "blake3:1ec0465663f201a52092ef2d9b4dc8f4eecb6e3b6d23dd6603abd73fa4104996"
text = "姬君。钱我收下了，还多出四十文。这四十文拿来给汐买双草鞋，她那双又磨破了。冬衣的事，是盐船上的老大多了嘴，日后他带的话，你只听一半便是。下回再替人作保，先让他把钱搁在船板上。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_5:event:honest:2","text"],null]']
src = "blake3:0fa83bde93593ea781cb4cd837868d9edb00bc91d802300367f689434670ea05"
text = "姬君。想拿回来便拿回来，梁上那枚钉子我原样留着没拔。动身归来那日若逢大潮，嘱咐船老大绕打沙洲北侧进河口，切勿抄小道。岛上哪个混小子穿走了你的草鞋，姬君直管套走他的穿去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_5:event:share:2","text"],null]']
src = "blake3:9cc72ce901a4ad90379faad42a5e4f43559e87cc3a3fc4c9809b3cfb167d9a75"
text = "姬君。歌接到了，折成小船模样，一时没敢拆，唯恐拆散了复原不了。端详三日方拆开朗读。读罢便塞上棚梁，恰在旧日搁葫芦之处。老鼠想来不咬纸吧。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_6:event:honest:2","text"],null]']
src = "blake3:31fea8e699b50dcd7b6461a88417698c6204d822b3a1d00d8daa9e917a70e9c6"
text = "姬君。半截便半截罢。听清了再拿主意，这归船头管；拿错了主意挨我骂，这归乳母管。两码事既划得明白，我便不去能岛折腾了。发绳仍照常编着，里头那股红绳，我是拆了旧旗边角搓的。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ase_6:event:share:2","text"],null]']
src = "blake3:96a4013187d75edac6650c0fe26876d115c1ba936390f6a795089dae851208f3"
text = "姬君。你重画的那幅图，我摇橹在河口比对着瞧了足足一日。有两处失准：乌贼礁标浅了一尺，北头那块退潮时露头早过你所写的时辰。潮时倒是推算得分毫不差，又四郎没白教你。发绳已编起头了，特特多放了三寸余量，你发长生得快。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:honest:2","text"],null]']
src = "blake3:90aca6de13f176fc4740535688c3d8998de76d2bc89c14b4af374a534117756f"
text = "歌已请三条西家的人代书于扇面。樱绽那日，我独在廊下展扇细看。房通大人恰巧行过，问出自何人之手，我答是一位不肯落墨的人所作。他便不再追问。那张短册我已收妥在文箱之中——姊上的手书，其实远不似自谦那般难入眼。扇子此番沿途未曾受潮，姊上裹得甚是周全。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_2:event:share:2","text"],null]']
src = "blake3:4652a7414843ccd780eeb6ab8b9c3c7ed7e4428204a6bb5e2337c5cc06e408b2"
text = "房通大人借过我的折扇端详许久，问这首和歌系何人所作。我回禀说是我姊上，如今正在能岛学荡橹。他将扇子递还给我，嘱咐妥善珍藏，切莫拿去与人相易。这扇我日日佩于身边。姊上下回作歌，不妨略写些海色，只消不写鱼便罢。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:honest:2","text"],null]']
src = "blake3:004b4f9b72303769a2ce9d9262e2ae38598247f2dc762a87917178c824dd4018"
text = "阿濑回信咬死不让出船，措辞冲得很，竟说当主的旗泡进水里照样打湿。我为此生了两天闷气。过后听家司提起，那月土佐外海果真翻沉了两艘商船。今年不回去了。姊上，你早料到阿濑会这般回话，是不是？"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_3:event:share:2","text"],null]']
src = "blake3:6d2d0981ddcc0c5653ffd6d969d9ee54f0a09639c196cf08145cf1fb99a444c4"
text = "姊上誊来的旧账我细阅过了，二十载间八月起锚的船，延期的凡十一艘，未归者两艘。我已回心转意，不急于这一时。且待哪年九月末风浪平息，我俩同舟南归省视母上，船头定挑最大那面旗号。房通大人阅过姊上的书信，叹称一条家女儿通晓水性，实比精熟和歌更为可贵。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:honest:2","text"],null]']
src = "blake3:89185d8d0326985dd4d2c5031852249763b59c461956198f3ea3d5d961448341"
text = "姊上独自担下了？从岛上赴京的舟子已将话传进家司耳中，说你跪在祠前直待潮水上岸。我该出那半份银钱照常遣人奉上，姊上肯不肯收都须收下。此后一条殿里的香，我不再焚了，少说这一个月绝不碰它。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_4:event:share:2","text"],null]']
src = "blake3:7af28876f75fbdfd4ed83054679deb12532c36195b6aca000b084f7a31836978"
text = "姊上信中言及同香客讨价，直磨到人家快要开船。余下那丁点零头，我差人买了两串团子，自己吃去一串，另一串恐路上馊坏，便单将竹签寄与姊上。香会我又赴了一趟，这回没耗旁人的香，纯凭鼻嗅，竟也猜中两味。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:honest:2","text"],null]']
src = "blake3:20d9ed635a74211e3be42380e2f0d84ef8fa5b9eb5edd61bbd3fb24affa7eda6"
text = "贝壳我终究没丢。鸭川水浅，扔进去底儿都看得清。我把它压回文箱最深处了，侍从摸不着。姊上信里的口气好凶，我只读过一遍便收妥，谁也没给看。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_5:event:share:2","text"],null]']
src = "blake3:76f2d7497208448dfbdb3380917539393b368c1ad39e89d07d75461257c1cb0c"
text = "贝壳内里的朱墨山水，我凑在灯下端详了半宿，水流淌到壳缘便截然而止，只因另半幅在姊上那头。姊上言水势东行直通淀川，我特遣侍从前往淀津察看，那处江水浑浊不堪，全不似姊上笔下清澄。这半片壳我且收下，日后倘有人问及，只推说是一条家的传世旧物。此话姊上切勿传扬出去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:honest:2","text"],null]']
src = "blake3:d0895cd93b7b21427761cff68c0727306dbdd97e1f127787950950c8cf07f5fa"
text = "姊上不肯允诺，我原先原要动气的。细想下来，风势也不听我号令。那便定下每个港一封信，半封不能少。姊上信尾记下的下田潮时，我拿去同家司历书核对过，分毫不差。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_ichijo_kanesada_6:event:share:2","text"],null]']
src = "blake3:341de64c91846a0edcef58b48fd98f73302d2c22a86af6b3c17ae94e27f1a8b8"
text = "姊上既肯掌舵，我便不乘旁人的船。家司道小早太小，当主坐着有失体面，我回他体面在旗帜上，不在船上。姊上，我会晕船一事，船上的人不必知道。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_2:event:honest:2","text"],null]']
src = "blake3:d60343aaaef3ec64b53b5d2a521a19289566d293527432a6939c5e8f3f6b2d3a"
text = "你不肯胡乱下笔，这样极妥。香的名色，闻真切了再说；拿不准，宁可坦承不知。鱼油倒也算一种味，我且记在心上了。下田凡事照旧，粮账我已核到正月。你旧时那双草鞋，阿濑替你晒在廊檐下，至今没舍得收起来。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_2:event:share:2","text"],null]']
src = "blake3:e439a46867b4d7662ffebaa3214143f1d019995fd93071c99d686ba84bd2fd6e"
text = "你作的那首歌，我一连吟诵了三遍。甜意里掺着苦气，又肖似杉林，十有八九是寺社常见点烧的沉香碎，岛上神主想来舍不得点上等货色。写鱼油那句我也读到了，读过竟追忆起出嫁那年作别府内时，船舱内亦是这般味道。不多说了，手头念珠该拨起来了。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_3:event:honest:2","text"],null]']
src = "blake3:643d03c3fc0137998c5b81fb1d675325da1d4dc01869b346e8bf7e5e77c17dac"
text = "盆前抽身不得，本在情理之中，无须多作分辩。卖米一事你既执一端，我亦守旧意，姑且按下不表。待返岛后再行查数，核清之后再议。争辩之时，字迹须得端正几分，我方才读得下去。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_3:event:share:2","text"],null]']
src = "blake3:34df33437cdf58458be34e47172ef30523c7061e232010d3c0f58e3f708a6b56"
text = "你抄录的关卡数，我对照政所旧账核验过，仅漏了一处，乃去岁新设。稻米仍旧留在下田销售。只是见你甘愿荡着小早逐关勘查，我在中村捻动念珠时，心里亦随你一处一处默数了一遭。下番去信，且说说宫洼的潮水作何色泽，我平生未曾见过。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_4:event:honest:2","text"],null]']
src = "blake3:b9c738b6da6a481dc20b2497a5b969b5b406991529774c0eb27f95a48a49def6"
text = "缺记那七八日，你既照实禀明，总强过生拼硬凑。政所倘若查问，我自以岛上初春事务繁冗推搪。那把船桨，你既已入账，便由你亲手使唤至折断；我此处亦另留一笔存照，待你扬帆出海之日，倒要瞧瞧它可仍在船中。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_4:event:share:2","text"],null]']
src = "blake3:ee265ee9cc1520d8a17cd1ace14b4382ab6c6038c4e72305030a2edf6ede4c9b"
text = "账册已悉。换购米商甚是精明，谢礼迟数日置备亦不失体统。政所那头我已替你挡回两遭，众人验看你所记细账，反倒缄口无言。唯独“本月省下”那一行，无须呈予他们过目。既能省下，便原是分内当省之数。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_5:event:honest:2","text"],null]']
src = "blake3:066d1d0c7bc5980d6a3e7b1bfbaffa1a0b35d807ffc63349bf03bcbf2adacda3"
text = "病中既不便会客，留于你处原是妥当。八十余年俱已蹉跎，岂在乎这数月之期。唯念岛上湿气甚重，油纸外不妨再加裹一层，切忌教它沾染海水咸气。待大人略见起色，遣送之际，代我也附写一行问安礼数。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_5:event:share:2","text"],null]']
src = "blake3:93c56c034ae4e1869c4738f769158986463721cf15681000c1caaf397da55858"
text = "你所赋那首和歌，房通大人府上家司特抄录一份送来中村。兼定来信言及，大人命人削下米粒许大一小块焚着，阖目静嗅良久，末了只道一句“还得恰当”。你词中“归途犹识旧径”一句，我反复吟咏了三遍。如今经箱中既腾出空位，我便置入一枝干桔梗。待下回重逢，须先教我嗅嗅你的衣袖，瞧瞧可还萦着大海气息。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_6:event:honest:2","text"],null]']
src = "blake3:1b9040247a84de9527628f08fb99a9d3509ea2617c19a4ca358ecefd39bd87b3"
text = "你不肯应的那桩，我读了足足两遍，拨尽了一整串念珠。船头往哪去，你说要看风，便依你看风。只是那看风的人，也当回头瞧瞧岸上守着的人。后两件事既已应下，少了一件也不成。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_family_bond_mio_mother_6:event:share:2","text"],null]']
src = "blake3:18ee63286a8da61be0372263bcc1397459b59208f59c243a1922774b9855cc8e"
text = "港名填成了一半，余下一半留着你自己的船去填。甲浦那条，老船头认说是他忘却告知于我，你倒偏偏问出来了。三件事你既悉数应下，我也应你一件事：出海那日，我不去河口送行。我若去了，怕你忍不住回头。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_10:event:keep:0","text"],null]']
src = "blake3:ff3598bfe97b5a191423a7f0e5b28c9aac005003440a49454d8948d9a130c9e4"
text = "澪：我也满十六岁了。今年社学里修习联句和讲书，先生讲完一段，轮流教我们复述，我口齿太急，先生打趣说快虽快，倒像在码头上喊货价。斗茶我负了两局、胜了一局，胜的那回茶叶是许采替我择的。你那头想必也临近结业了吧？待你出了海，咱们的书信往来便用不着绕这么大远路。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_10:event:reply:0","text"],null]']
src = "blake3:516dbf16809f3345210c7509577f2d7dfc51a23a0091c66f58647573fa16a462"
text = "澪：在社学的最末一年了。先生新教起联句，由他拟出上句，我们挨个儿接对，数我对得最疾，陈栋回回都爱和我抢先。斗茶我也胜过一遭，许采偏说是撞大运。近来先生总盯着我执笔的手看好半天，我心头暗自忐忑，面上照旧带笑。你那边的歌合胜了没有？赢了要写来，输了更要写。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_11:event:keep:0","text"],null]']
src = "blake3:a663216e2afaec34193e5adfbee45e88cc80b5970c66d6255f046deb9c22ba10"
text = "澪：回执。来信已收悉，究竟哪日送到、何人经手，今番概不落笔，怕写了牵连他人。今夏官兵曾入港搜检，家中近况、社学诸事，且留待重逢再叙。正月我动身出海，你也定在正月。五岛一带海路我熟稔，你只管来，由我引路。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_11:event:reply:0","text"],null]']
src = "blake3:5db40a88df3d92997ddd6947e5cc51b9347d2116c60da7355e214c678e327f4f"
text = "澪：这一封便不提劳烦谁捎带的了。近来港内盘查甚严，今夏官兵连着来了两趟，翻箱倒柜，连天妃宫里的香炉都掀了盖察看。你约定正月从下田启航，我牢记于心，我也正是正月动身。抵五岛后，认准桅杆悬着红纸灯笼那条船，只消唤一声灯，我便下船相见。切莫认岔了，也别教旁人代你呼喊。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_3:event:keep:0","text"],null]']
src = "blake3:b717fcbdb26f40850d94c46c8e66e91c9a40e285c888327f5d1e19c4f7beb825"
text = "澪：今岁行船的期日定下了，只待南风一动，阿爹那艘福船便放洋去五岛，我也随行，生平头一遭。家计窘迫你可莫笑：仓房里搁着去年的生丝，阿母打算盘比你还要精明，我攒下的钱全拿去交了束脩。再过几日我便往龙溪求学，身上套着二哥的旧衣裳。为何偏穿他的？你自己猜去。信是投去能岛的，表哥讲那是个海贼窝子，你千万留神别给人拐跑了。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_3:event:reply:0","text"],null]']
src = "blake3:a568473873b3774ad92adcc2563a1721ca1be531e079af09af8fa0cf489105b5"
text = "澪：你原先说去京都，随后又改称能岛，我两地各投了一封，也不晓得哪封先落到你手里。待四五月南风吹起，阿爹便带我往五岛去，他可算应允了！家中手头拮据，去岁生丝还堆在仓里脱不了手，阿母连夜里点油灯的钱都抠出来凑数。我私下积攒的一点钱全缴了束脩，不日便入龙溪读书。二哥那套旧衣，阿母熬夜替我裁小了。缘由你莫要问，问了我亦只有撒谎。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_4:event:keep:0","text"],null]']
src = "blake3:d96d53f232704c5ed9af284fb531560d7b91277c0337b87cb7d34f43fb6efc07"
text = "澪：我眼下每日卯时进社学，先生头一桩先盘问昨日行了何等善事，接着背诵《小学》，再演习作揖，晌午过后大伙踩着节拍吟诗。我嗓门亮，唱得最响亮，先生嫌调门太刺耳，叮嘱我往低里压，我自是听话压低了声。字我天天都在描，你瞧这封可还有白字？拢共就错了一个，我也涂改好了。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_4:event:reply:0","text"],null]']
src = "blake3:d1f16e99ea6b2265b3582b018de7a7e1486d2abdd39ebdabc011147b4adad8d3"
text = "澪：社学立的规矩怪得很，清晨先查问德行，昨儿在家孝不孝顺、曾否撒谎。我日日答不曾撒谎，先生日日颔首，你说好笑不可笑。接着便是背书、演礼、歌诗，行揖礼须折腰到望见自个儿鞋头才罢。先生嫌我字丑，我便一日不落描着写。下月我当真要去五岛了。你在能岛，离五岛究竟远不远？灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_5:event:keep:0","text"],null]']
src = "blake3:4138d856d1c2bc3ce135b6af1967a9ca8f08841d4e799aacea66b4e228dd2dd8"
text = "澪：回执。你的信转到五岛落进我手里了，多亏平户一家酒铺捎带，掌柜抓了我两颗果脯算作脚钱。五岛的海水比月港更蓝，夜里船舷挤着船舷，灯火一盏牵一盏，热闹得宛如天妃宫赶庙会。当中停着一条大船，阿爹说连平户的大名都得礼让那船主三分，大伙管他叫老船主，我也只敢隔得远远地瞄上一眼。往后通书信，认准贝壳上的暗记。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_5:event:reply:0","text"],null]']
src = "blake3:00a0553f66da34d0b436e214ca4d82e2c1016276f4a77c1118e626c39f5b9474"
text = "澪：我真个踏足五岛了！港湾里泊的船多到数不过来，最大的那几条高高挂着旗，阿爹嘱咐我休直勾勾盯着瞧。在平户还撞见了佛郎机人的船，炮口黑黝黝的，比天妃宫的香炉还要阔大。你六月寄出的信，我在五岛便拆到了，反倒比在家里头更快些。下回只认贝壳上的这枚记号，没记号的俱非我手笔。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_6:event:keep:0","text"],null]']
src = "blake3:c5f12eaa12c6cf0851cf8edd572e071f69575932b2a782e523332aae082bda19"
text = "澪：年关尚未过去，阿爹便发愁不知何日才能出港，巡船死守着海门，即便南风吹起也动弹不得。家中吃食尚算宽裕，独独灯油价昂，阿母宁可省下一顿饭，也不肯教长明灯熄灭。我在社学里诸事如常，没人察觉异样，这句你只当没瞧见。果脯乃腊月里新鲜晾晒的，若在道上坏了也莫丢，搁日头下再晒晒照旧能食。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_6:event:reply:0","text"],null]']
src = "blake3:a265a8f27fa8f0f58df424cf03cb2581484b21e8dc55ff243aad0985ff600c62"
text = "澪：今岁船是走不成了。官府咬定倭寇自咱们这港里出去的，北边战事正烈，巡船一日巡两遭，阿爹的福船唯能靠在内港干等。家里花销依旧紧巴，阿母将天妃宫的灯减了三盏，看得我直发疼。闻道你们那处银两宽裕，一两银子可抵得几斗米？劳你探问下岛上掌账收钱的，我也好盘算。果脯是我亲自晒制的，莫笑话。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_7:event:keep:0","text"],null]']
src = "blake3:7d72ff4611211d45e2efb3705eb1b740c05a9b39d0e750fcdc9958c10c94f218"
text = "澪：三月间先生领我们徒步两日赴同安，旁听林老进士讲书。老人家七十四岁高龄了，谈及海上，直言朝廷的禁令恰如江堤，堵得越死，决口便越猛烈。陈栋在座下直撇嘴，我暗把这话记在掌心，归来净手时方懊恼未曾抄下来。你信末附的两个假名我也学着写了，倘若写反了休笑我。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_7:event:reply:0","text"],null]']
src = "blake3:0a8671d21fbbd47a097944da63bf3f3c9256c2ea5fe65937dc410cc5fe6c8722"
text = "澪：这季社学研习《孝经》，先生念一句，我等齐声跟一句，谁抢先抢快了便要罚站，我已挨了两回罚。近来港内纷纷传扬，广西来了个花白头发的女土官，率着狼兵赶赴江南打倭，人称“花瓦家”。我在天妃宫屋后抄起扁担学着比划了几下，偏教阿母撞见，罚我擦了整宿的灯罩。信末那两枚假名，我照着你前番来信描了十数遍，末了一笔仍旧拐岔了方向。待你们七夕拜星时，也顺道替我拜上一拜。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_8:event:keep:0","text"],null]']
src = "blake3:b4278356115f5721d57ba8c01e7f07c36993d39aaad3807f3561079f64ac69c8"
text = "澪：回执是我撕成两截的，剩下一半留在我手边，今后半张对不上的信切莫轻信。你四月所寄之信七月初便递到了，脚程比去年快些，如今连五岛酒铺的掌柜都认得你画的扇子了。七月间有几十个倭从浙江一路流窜至南京城下，官兵紧闭城门不敢出战，咱们港里足足笑了半月。笑罢之后，海面上的巡船陡然翻了一倍。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_8:event:reply:0","text"],null]']
src = "blake3:de9e88c01d4b2b19c679b32d4acd0f54024bcc3a05e11473b6896f0fdd7725f4"
text = "澪：你的书信是二哥自海沧接回来的，恰逢那天倾盆大雨，他紧捂在胸怀里，归家时唯独湿了一个角。沿途经手人等我皆一一录在封皮上，万一丢了也好寻觅。把回执一剖为二，原是学官府的勘合，官家藉此管船，我拿来管信。南京地界闹起倭患，竟一路打到城门底下了，阿爹叹气说今冬的船怕又走不成。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_9:event:keep:0","text"],null]']
src = "blake3:a953334a8533d2f159fa80182dccc5fee426141ab24bd1623aebff9168adc76d"
text = "澪：今岁家中的账，我也记一份给你过目。阿爹去冬把那条大福船押给了海沧牙行，手头唯余一条鸟船，盘算着清明后看风，究竟往五岛还是奔北大年，届时再定夺。我闲时在港口替船工的老婆们代写家书，一封三文，若写哭了也不另加钱。又替天妃宫抄灯簿，抄一本换得一斗米。这笔钱不拿去交束脩，全数交由阿母。灯。"

[entries.'["upbringing/families/mio_noshima_life.toml",["effects","c9_mio_noshima_letter_9:event:reply:0","text"],null]']
src = "blake3:1b213e160f3164cc10bf0e215eb50ebde3478230aa263ec75718f543c69e928d"
text = "澪：给你瞧瞧我的账。代写家书十七封，入账五十一文；抄灯簿一本，得米一斗；卖果脯却折了本，半数都填进了二哥的肚子。阿爹的船清明后起锚，若风正的话，五月便可抵五岛，我求他带我，他既不点头也不摇头。阿母说海沧新来的通判是个硬脾气，今岁的例钱恐要涨。你那头的账，也写来与我看看。灯。"
