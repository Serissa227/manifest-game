[entries.'["upbringing/families/mio_growth.toml",["activities","c9_mio_kobaya_helm","description"],null]']
src = "blake3:84450277d6cf06fceebfecd7e0c54b2e72953958406a772429e3fc9b07b6112f"
text = "立在阿濑那条小早的船尾把舵喊号。八支橹随号子起落，顺风便升起一面小帆。号子但凡早一拍或迟一拍，船就在河口打起转来。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_chidori_home:farewell","text"],null]']
src = "blake3:5d8cbb3efa924a9ba2f93e56f93f62fb179ac9a6dfcd9e14c59e2c0db1091bac"
text = "我将赴京的消息，是汐透给千鸟的。这日千鸟在栈桥上拦住我的去路，打怀里掏出一块平展的白石，上头拿烧黑的木炭歪斜写了两个假名，一大一小，正是我的名姓。“我练下的。”她道，“你进京之后，只管寄信来。我自己读，不劳旁人念。”石面上的字迹磨糊了一角，她拿衣袖胡乱拭了拭，谁知越拭越发模糊。我将白石揣进衣襟里，觉着竟比母亲赠的那一串钱还要坠手。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_chidori_home:hut","text"],null]']
src = "blake3:63bd5e8da541c94d9e2ca604727ccdc60bbbced516ae46fcc3e8a36c98fb412b"
text = "七月里，千鸟头一遭随婆婆们去外海潜鲍鱼。我在岸边苦等到日头落西，才见她们归来，个个冻得嘴唇泛青紫，一头钻进礁石背后那间茅草小屋里，围住火塘烘烤身子。千鸟朝我招手叫我进屋。屋中弥漫着海腥与松枝焦糊的气味，老海女们一面烤火、一面咒骂今年水寒，手底下还将鲍鱼逐一剖净、裁作长条，搭上竹竿晾晒。阿德婆婆道，这般晒成的干鲍，京里的公家最爱逢年过节拿去作礼，堺的商客收购出价也高，偏生岁岁都要往死里压价。其间有个老海女无意提起千鸟的娘，满屋霎时寂静无声，独剩火堆噼啪作响。千鸟自顾将剖妥的鲍肉挂上竹竿，仿佛半句不曾入耳。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_chidori_home:kana","text"],null]']
src = "blake3:3f271e5bbfc39beabdb463d68209a6441e677401075978b776fc692aacf65bd2"
text = "三月里，打堺来的船捎回一封千鸟她爹的信。阿德婆婆和千鸟都识不得字，祖孙俩一齐捧着信上栈桥来寻我。信上没几句话：船坞活计忙，今年归不得，工钱托船头捎了一串回来，嘱咐千鸟莫下深水。我念罢了，阿德婆婆点点头，道这跟去岁写的原无两样。千鸟却蹲在原地不肯走，拣了根树枝在沙地里划拉：“回信，我想自己写。”她划了好一阵，画出的道道谁也认不出是什么。不远处汐正在补渔网，眼皮也没往这边抬一下。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_chidori_letters:first","text"],null]']
src = "blake3:d45fa86e5b32dfa6465d58d8191925ac376fd73e053ff15c7f52e7b6f6e6ebe0"
text = "五月间，有封信随堺的商船入了京，再几经两手转递，方才送进局里。信纸正是我从前赠与千鸟的怀纸，叠得齐齐整整，字迹却大得稀奇，一个假名便占去半页。展开一瞧，画幅竟比字数还多：河口只拉出一道弧线，沙洲画得活像条鱼，鱼腹朝东偏出一截，旁侧点缀着些许小黑点，多半指代渔舟。纸末画着一只圆圈，圈中立着个小人，小人侧旁题着一个五字。汐凑近身瞧了良久，指点那尾鱼道：“那处沙洲果真东移了。定是开春汛水冲刷的。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_chidori_letters:second","text"],null]']
src = "blake3:e48bc61b91cca73ca5751cf998639784dc2499a27a3b498394d7fc4c71bb6d0e"
text = "入春不久，千鸟的第二封来信寄到。这一遭字句多、图画少，假名紧密相挨，宛若退潮后攀附在礁石上的藤壶。信中说阿德婆婆自入冬便不再下海，终日坐守茅屋门槛剖鲍；又讲今年堺的商船到港极早；再道汐的娘近来又咒走了一名企图赖掉帆别钱的船主。信纸末了另起一行，独悬一字，写得比余字都硕大有力：七。旁侧空白无画。汐扫过一眼，问这七指代何物。我答说，想来是七寻。汐蹙眉道：“七寻深的水，寒得教人骨髓生痛。她潜下去作甚？”我未作声，只将信纸折严实，压入了枕底。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_first_outing:outing","text"],null]']
src = "blake3:ca3f32eabf01665d51fca03035c4fd6df6f61aae7a4c5154f97bba31271fafd0"
text = "获准独自出门后，逢上头一个大退潮的清晨，天还没亮透，汐便早早绑好草鞋，千鸟也背着她的空竹篓候在了门外。我们借着落潮涉过沙洲，河水刚没过脚腕，冰得人直抽冷气。踩上对岸，松林里飘着一股松脂气味，海风扫过，松针沙沙作响。千鸟遥指礁石底处一个黑漆漆的洞口，说潮水再消些便能往里钻。汐又抬手指着山巅那座坍塌了半边的烽台，说从前拿它防海贼的，说完自己倒先乐了。三人并排立在松林边，一时谁也没有抬脚。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:drill","text"],null]']
src = "blake3:d63f72c364b2c2ac0994d993c5d00f5a08a06cbb402edc32c82ad80e7eea25a4"
text = "离八朔还有半月，阿濑立在栈桥头看我们练船。潮一退，河心那块黑石头底下便往外翻白沫。老三在前头划得又急又猛，我在船尾摇橹，船头总爱往左偏；每偏一回，岸上的阿濑就干咳一声。一直练到日落，她唤我过去，半句话也没说，只掰开我的手瞧了瞧，掌心的泡已破过两遭。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:helm","text"],null]']
src = "blake3:3c4729c9194bb17f23ea88e0139ad91ed4fd1d8b8253f184565e2f82128e1f41"
text = "竞渡结束后的第三日，阿濑领我走到栈桥尽里头。水边系着一条小早，船板漆黑，舷侧凿着能岛的印记，正是她当年从岛上撑来此处的，寻常谁也不准沾手。“八支橹，”她开口道，“渔家那帮小子坐两舷，你立在船尾。号子归你喊，舵也归你把。要是一声喊岔了，他们可不会提点你，只顾把桨划乱。”说着，她将一根摩挲得油亮的舵柄塞进我掌心，木头竟带着余温，仿佛才刚被人攥在手里。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:lost","text"],null]']
src = "blake3:bdc08bceb02850998678c6bfa8495e1a53403f5b2a9dd6997705b64038f90194"
text = "只差那么一点。距黑石头尚有十来个船身远，潮水骤然落下去，船头顿时斜了。我急着扳橹，下手过重，船底顿在沙脊上磨出一记闷响，犹如水下有物狠狠啃了一口。待大伙儿把船推离浅沙，其余各船早绕过了石头。驶回东岸时，我们落在了末位。底板裂开一道细缝，河水正一丝一缕往船舱里沁。岸边忽地响起一声口哨，原是夏日里在船板上刻记号的那个能岛少年，正蹲在晒网架上，笑露一排白牙。笑罢，他自腰间抽出一小束槙皮，抛到我脚前：“嵌缝得使这玩意儿，休要拿你们公家的纸去糊。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:notice","text"],null]']
src = "blake3:232813ea8a6bec9643f23137a6c6fab61140d30a04800fb08a79e0d55c5e9e5f"
text = "夏日那几回竞渡，我皆是搭在旁人船上划桨，快慢全凭船主一言而定。八月将尽，渔村的老汉们蹲在栈桥上商议八朔的章程：朔日潮势汹涌，下田本浦依着旧例在河口赛一回，每船两人，自东岸出发，兜过河心的黑石折返，头名便将新米敬献给河口的水神祠；外浦的船只许观战，不得入列。我在旁听了个真切，转身便去寻阿濑：“我要单领一条船。”阿濑搁下手里织补了一半的渔网，定定瞧了我良久，才道那条平日练手的小船可借与我，至于前橹寻何人搭手，由我自己去请。“还余三旬功夫，”她道，“每旬都须下河口去操练，直练到掌上的水泡破了再生、生了又破才罢。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:race","text"],null]']
src = "blake3:91627e72e0d23df647432c5bea56d43e254098dacab0c6dc450a1d60e4d3e7df"
text = "八朔清晨天色未明，河口两岸早站满了人。七条船在东岸一字摆开，鼓声方响，七支前橹齐齐拍进水里。初段顺溜，谁也不慢；逼近黑石头时，退潮正猛，河心水流高高拱起，好似一匹绷紧的布。老三在前头扯嗓子喊：“姬君，往哪边？”争河心那道深水，路程最捷，也最易被潮水推出去；贴着南岸绕，那边藏着一股回流，行得慢，胜在稳当。岸上阿濑抱起双臂，一动不动。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:winter","text"],null]']
src = "blake3:517d42087fff544d9415bcb744874e4102b90745d741ae54bb9fb4c9edcb847d"
text = "冬至前后的大潮，乃是一岁之中退势最烈之时。天犹漆黑，河口沙洲便整片袒露出来，活似一头搁浅的大鲸。阿濑引我到栈桥最深处，岸边拴着一条小早，船板乌黑，舷边镂着能岛的印记。“八支橹，渔家小子分坐两舷，你立船尾。”她叮嘱道，“打这儿驶出河口，绕过沙洲尖折返。若能顺当回来，往后这船便归你驱使。”船上已坐着渔家的孩子们，个个冷得缩紧脖颈，只等我发话。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_hassaku_race:winter_lost","text"],null]']
src = "blake3:1caddbddd558c8fe8ed5974b30c602e74a4864880f42bbe5b10ab939cee4fae0"
text = "号子刚喊到第五声，打头两支橹先乱了节拍，船身一打横，退潮的水势立时顶了上来，推着小早直往沙洲去。渔家孩子们吓慌了，有的叫姬君，有的喊阿濑。全靠阿濑纵上船尾，伸手抢过舵柄，船这才直了过来。靠回栈桥，众人都不作声。阿濑把缆绳系牢，背朝我站了会儿：“等你从京里回来，再说。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_newcomer:family","text"],null]']
src = "blake3:250ca863e614e4ea1c8eeff785790907f5724cbf0b428736933ae56a79eb482e"
text = "我看完潮回来，屋里已经挤得转不开身。阿濑这屋本就窄小，母亲带来的三只账箱又占去半面墙，黑檀念珠就挂在箱角上。汐正把炭盆往门边推，阿濑一脚又给踢了回去。母亲指了指我铺头那张纸，在“字”字旁边添下个“早”。阿濑在灶台边插话：“早上？早上是看潮的时候。潮水不等人。”母亲头也没抬：“字也不等人。”两人都住了口，一齐转眼看我。门边的汐冲我直挤眼睛。兼定从京里寄来的信还压在砚台底下呢，他在信里诉苦，说本家的人早上都起得晚。"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_newcomer:purse","text"],null]']
src = "blake3:35829cb30cba913a7f5dc60edcdce35cac684cb37f269678732582f58d7be1f0"
text = "进了中旬，母亲唤我到账箱跟前，打袖中摸出一串细麻绳穿好的铜钱，搁在我掌心里：“买了何物、付了何人，自己入账。”钱串压手，比我想象的还重。汐打门缝里探进半张脸，两眼直勾勾盯着那根麻绳。门外正补渔网的阿濑隔门扔进一句话：“排到第六行时，别忘了给潮留出半日。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_newcomer:shore","text"],null]']
src = "blake3:0dc986409a049fea862efeed595a76376b6e5584e23a850975893b42df4f3a82"
text = "到了下旬，阿濑头一遭放我独自出门，只叮嘱了两句：别越过沙洲，别下水里去。我顺着河口往东行。潮退后露出一大片礁石，块块都挂满海藻，踩上去直打滑。才走到第三块大礁石旁，就听那头传来哨声：先是一声长调，又是一声长调，乍听似海鸟鸣叫，音律却明明白白出自人口。我攀上石顶张望，下方水洼里蹲着个与我一般高的女孩，一头硬发活像晒透的海草，正一把把扯着石缝里的石莼往竹篓里塞。她仰脸撞见我，又吹响一声，这回是对着我吹的。“公家的？”她开口道，“你踩的那块石，潮水一回头便要没顶了。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_ushio_home:goes","text"],null]']
src = "blake3:929a55bc18276dc6221acdfb25c0b89476463592d7856e1cc0106d3441fc591b"
text = "打从要上京的消息传开，汐连着好几天没同我说话。冬月里的一晚，我瞧见阿濑凑在灯下缝一件素色小袖，针脚细密又笔直，袖子比我的短出一截。“给汐的。”阿濑连眼皮也不抬，“侍女的衣裳。宫中规矩她半点不懂，我教不来，须得你母亲去教。”汐打外头走了进来，把个扎紧的包袱往我铺边一丢，里头硬邦邦的，装着一卷缆绳。“我识得路，也识得潮，”她说道，“宫里头那些，学得来便学，学不来，好歹还能替你挡上一挡。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_ushio_home:knots","text"],null]']
src = "blake3:ef3ca2843da7844b21c1af8049fe6c5fc57c48fbaefef398c81b899ea87f4de3"
text = "能岛的关船在河口停了一宿。水夫们隔着栈桥朝汐直喊“收帆别钱的丫头”，话音落处，满船哄笑。汐半句没呛回去。入夜后她偏不肯躺下，只坐在铺边借着月色死命打结——捡根旧缆绳，打一个，拉死，再叠着打一个，攒得跟拳头一般硬实。自小同铺睡到大，她把脊梁背朝我，我就摸准她是动了气。我蹭到她身侧坐定，她眼皮也不抬，手里又勒紧一扣：“早晚我要竖一面自家旗号。不挂村上家的，是我自己挣来的。但凡撞见的，都得乖乖让水。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_ushio_home:stars","text"],null]']
src = "blake3:6dfb5b213436fd4c18e9616f69c4ae24003bd89762faa6a0d4ba3009e72b8695"
text = "五月入夜闷热得紧，汐拽着我爬上了屋脊。干茅草扎人，我们偏就这么躺着；屋底下阿濑正扯着鼾，河口水声阵阵，忽远忽近。汐扬起手臂捏起拳头，直指北边天际：“能岛的老船头不用星盘，使的便是这个。”她说北天那颗定住不移的星，岛上管它叫子之星，子正是正北；几个拳头叠起才够得着星位，便知晓船驶进了多北的水面。她一拳、两拳地数与我听，数至半途却顿住了：“往后我若能把船开得足够远，这颗星怕是要低落进海里去了。”"

[entries.'["upbringing/families/mio_growth.toml",["chapters","c9_mio_ushio_home:storm","text"],null]']
src = "blake3:9baab2bebfdee730689a03fc04318fcccdefc06d9d5f8d43eea84fabc5ae5570"
text = "九月末尾骤起狂风。天未擦黑，河口潮水已漫过栈桥第三根木桩，停泊的渔船艘艘相撞，发出沉闷的咚咚声。阿濑正欲去加固缆绳，手刚抬起，脸色倏地煞白，右肩沉沉垂落，连桨柄都握不住。“汐，姬君，”她咬着牙根吩咐，“缆绳堆在网棚里。”疾风挟着冷雨横劈在人脸上。那几个渔家孩子已经赶到栈桥头立着，单等有人主事，指点先系哪一条船。汐瞧着我，我也回瞧着她。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:drawing","reply"],null]']
src = "blake3:b48a91df2a6862c784c39233a2f9cdadf8f7713723790dc4805f059d1f3fe15d"
text = "我告诉她，若遇着写不出的字句便用画的：河口潮信涨到何处、沙洲移往哪边、阿德婆婆双目如何，尽数描在纸上。千鸟琢磨了半晌，开口问：“那你也须画京里的景致。京中有没有海？”我答说没有，京城里只有河。她顿觉扫兴，叹一声，那画河也罢。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:drawing","text"],null]']
src = "blake3:14651257e474911290b8ae8f542c17d5a4707f43a6196bf97ee06c916010a1eb"
text = "约定每封信上皆画一幅河口"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:paper","reply"],null]']
src = "blake3:85168f3ea4cca65402924ff5b651a5abf669bec8d391b808a3c27c13c4ecd7dd"
text = "我返屋取了一叠怀纸，又翻出半截磨秃的墨锭，一并交到她手心。她捧在手里不知该搁何处，思忖片刻，塞进了装剖鲍小刀的皮鞘中。“回信便写在这纸上，”我叮嘱道，“写坏了也不准扯破。”她答说自己决不会写错，她会一笔一划慢慢写。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:paper","text"],null]']
src = "blake3:eddfcc76cccd6ce5782ec8f6bdced1b8435510395205981ddce0f39e923566ff"
text = "将母亲给的怀纸匀她一叠"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:slow","reply"],null]']
src = "blake3:05ef574f17a82454d67f173cf9e200ca1d93004835b517b6f28d9dae5c578dad"
text = "我同她细说，一封书信从京里递到下田，中途要倒换三趟船只，耗上月余光阴，赶上运气不佳还得寄丢。千鸟闻言点头，说既然如此便不干等，仍旧该潜鲍时潜鲍、该晒网时晒网，信到了便读，没到便作罢。这话她说得极平淡，可转过身举步欲走时，却又回眸添上一句：“若寄丢了，你便重写一封。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:farewell:slow","text"],null]']
src = "blake3:d87fddf416a62ca39d213a627824f1e77bb4d1ba2030b3023ea448665351db8a"
text = "告诫她京中寄信迟缓，莫要苦等"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:bargain","reply"],null]']
src = "blake3:4f55024b0b75213f514d4b221db827d3e80da1eb82e338cccd432c986f05d365"
text = "次日堺商前来收货，我挨着阿德婆婆坐下，替她们点算数目。那商人一开口便挑拣今年鲍小、煞价收购。我便答道，今年鲍小，干货自然减了成数，京里年节下采买的人家却半点不会少。他打量我一眼，目光又落到我袖缘的家纹上，到底把价钱往上提了一成。待人走后，老海女们执意往我手里塞一条干鲍，我推辞不收，千鸟便顺手将它穿在自己颈间那条细绳旁：“权且寄我这儿。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:bargain","text"],null]']
src = "blake3:0ad448bf46d9668a4510c2c7e55559b3d9d9519339193631c434bee52c3a91a9"
text = "替她们去同堺商理论干鲍价钱"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:dive","reply"],null]']
src = "blake3:c56fc0923e58aae35a2ce57acbbca65709fdbb9d32e90fffcadb3c69a8b4a9d5"
text = "次日我将长发死死束紧，跟着她一道下海。她在前引路，我在后随行，潜至四寻深处，她回首觑我一眼，抬手指指水面，示意我先上去。我浮出波面吹了一记长哨，这一遭倒真吹响了。随后她破水而出，也长啸一声，声气比我的更绵长。我俩伏在木桶沿上喘匀气息，她开口道：“下次潜到五寻。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:dive","text"],null]']
src = "blake3:d5e4fe6d39ff9a24f46754500b6599c8289156cc676a3e6d3b8fe1d4a4bf2e3c"
text = "次日里随她潜一回水"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:listen","reply"],null]']
src = "blake3:b16cab901086681a96c8fccdaff1fa487027ac21753654cc3044db6c83b0ad94"
text = "老海女们谈起足摺外海的景象：海水浓黑，水势比江河还湍急，朝南驶出的船少有回还。从前有一年，金刚福寺那头有人乘一叶四壁钉牢的小舟出海，舟上竖起一面满绘经文的布帆，岸上众人一路诵经相送。正当我听得出神，千鸟在身侧微碰我的臂膀：“她们岁岁都要说这一段。说罢了，也就散场回家了。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:hut:listen","text"],null]']
src = "blake3:27e6a601ddecec76ee7bca8105f93a50f76116e049b9bd171f075b462840bb62"
text = "围坐火旁，听老海女叙说南边海域"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:name","reply"],null]']
src = "blake3:83d7f0d5d115354b3a4c3a2928881bd9db9faef64f1d8f35de2501abc6d3ce10"
text = "我替她在沙地上写出那三个假名：一道弯，一道拐，再加个小鸟脚印似的字。她依样描着，划斜了便抹平重来。潮头漫上来一回、冲散一回，她就往高坡上挪一挪步子，继续划。直到日头西斜，她总算在干沙地上写出自己的名姓——虽则歪歪斜斜，到底认得清了。她盯了半晌，才抬手从颈间解下一枚穿孔的鲍壳，塞进我掌心：“往后你下水，带在身上。婆婆见了认得。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:name","text"],null]']
src = "blake3:c9e4208ebcdf46608cc8add9dc770c4df7adea8a833fb5a72f7e7264549c73f8"
text = "先教她写自己的名字"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:with_ushio","reply"],null]']
src = "blake3:b513941c07e76491abe0938a2fb727c4c2bedee8e03992e4be94c5cc1236cfe2"
text = "我往汐那边招了招手。汐将网往地上一掷，起身道：“我去收网。”可那一张网明明才补到半截。待她走远了，我只得回过头继续教千鸟。千鸟学得机灵，临到天黑便能写出自己的名字了，又解下脖颈上挂着的一枚穿孔鲍壳递给我，教我往后下水带着。归家途中，我瞥见汐正坐在网棚下，握着根树枝在地上描着什么，一听见我步履声，抬脚便将沙土碾平了。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:with_ushio","text"],null]']
src = "blake3:a19703b10198668fd8e2d300c81c3d6800ad46fc2ef7865eca08301a48a9198a"
text = "叫上汐一块儿来学"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:write_for","reply"],null]']
src = "blake3:06c346eb1ff6a07447ee99f70d7cf48c42c2185b82633810f8117bad1a14916a"
text = "我依着她的意思落笔：婆婆眼目大不如前了，今年的鲍鱼由我下水去潜，钱已收妥，勿念。写毕念与她听，她一字一句地跟着点头。末了她问道：“我的名字在哪一处？”我指给她瞧。她盯着那三个字看了半日，伸指轻轻一碰，墨迹未干，晕花了一小块。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_home:kana:write_for","text"],null]']
src = "blake3:291cce3cfa74cf950543c29b8d4e054244eec525c35b394d36520b90ae5879bd"
text = "代她写完回信，再念给她听"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:river","reply"],null]']
src = "blake3:0e5043c9d1a7a4ec64eead11a05621324d1e5a55d86205a51983b74e431d6b85"
text = "我描出鸭川的模样：浅流乱石，盛夏河滩上有人搭起纳凉坐床。顺手又勾了宝镜寺的飞檐，添上局里那株老梅树。画罢却觉京里并无甚可写之景，便在纸尾另画了处下田河口，画幅比先前诸景都大上一圈。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:river","text"],null]']
src = "blake3:0baf56b1a5f44c3e0671dfda496e7f32afba77f7f8331a6cd773e69077f1f51e"
text = "绘一幅京中之河寄回去"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:teach","reply"],null]']
src = "blake3:2ce2278c5cfd4f437bbe56d30ff94cef98532547b5816ae0384cc78f2cde4aa3"
text = "我将一首短歌写得斗大，每个假名侧旁配画一件她熟识的物事：水井、灶炉、舟楫、鱼儿。抄罢清点，一张怀纸仅容得下十字，只得再誊一纸。待到封缄寄出，信函比来时厚出足足一倍。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:teach","text"],null]']
src = "blake3:4d38ad91c71d3593de0d720d6ed066f2a8a4ad274b1b60d7b03dbccd5d6515ae"
text = "将新习的歌写大字寄给她"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:ushio_line","reply"],null]']
src = "blake3:d9490252c650e7e5feacb027e8479efeb3a27cfed3728e077f8f3a4eb84434c9"
text = "我效法千鸟的笔法，写起大字，顺道描了河。将京中的鸭川拉成一道细墨线，宫禁高墙圈作方框，框内点上两个小人，一是我，一是汐。落毕，我将毫笔递予汐。汐推却不接，让我代笔。我问写何言语，她沉吟良久：“告与千鸟，我娘发泼骂人之际，教她避得远远的。”我依言写下。待要封缄前，汐突地把信笺抽回，亲笔在末梢添了一整行字，写完便把笔往桌上一掷，双耳红透到颈根。我也识趣，没探头去看她添了什么。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:first:ushio_line","text"],null]']
src = "blake3:3c8a24657bd9ef4f7d504c5ad42c31746ca5d8890919ae5edbaec2129c8d326b"
text = "回信时，教汐也捎上一句话"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:ask","reply"],null]']
src = "blake3:70ae876ce7f177f1684d6a2007e5297fde6037c61259a5bb38c654c08e71f55d"
text = "我在回信末了探问：那个七，莫非指七寻？她却不曾作答。后来寄抵的信笺一角，只画着一只飞鸟，双翼张得极舒展。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:ask","text"],null]']
src = "blake3:d7cc4166d8ec9ff341559bdd6128a5d9ff751f5d6c241209bf8a14407d19d50b"
text = "于回信末了问她：七是何意"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:keep","reply"],null]']
src = "blake3:7399d7c84d3a94735cc66bfa6b7c69c2db1a36045d9439f301ce848f07dcdf98"
text = "书信往返实在迟缓，有些言语且待夏间回到下田再与她面谈。我提剪刀裁下那个“七”，细心夹入《伊势物语》书页间。汐撞见了，问道好端端的剪人家信纸作甚。我只道，留存着。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:keep","text"],null]']
src = "blake3:da7fe87b139e18cee1de55de38c8885cc740f501ecee295d602a58cc532c0b29"
text = "将那个“七”字裁下收妥"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:summer","reply"],null]']
src = "blake3:b73aeb3f1cbf4e344e9068f1c947649de95555ea6be1acec0d3bb2e3457ab09c"
text = "我落笔写：待盛夏回去较量，输家自罚剖十个鲍。写讫仍嫌未足，遂在末尾也独起一行写上：七寻水下寒彻骨，浮上水面时，记得长吹一哨。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_chidori_letters:second:summer","text"],null]']
src = "blake3:4546f38d39f8faf0d8f870d950376112148518739c9c43dd745916cb855a7e2a"
text = "回信约她：盛夏归去比试一番"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:beacon","reply"],null]']
src = "blake3:56731b69b668b0d04e816dbb15080651cd629f5cb559638ec91fbf1741a9c3a1"
text = "烽台已塌掉一半，石缝里钻出野蔷薇。从高处往下望，四万十川一道黄水直插进海里，于河口铺散开去，同青色的海水绞在一处，好比两股尚未拧拢的绳索。汐说，这样看着，潮水往哪边奔流，一眼就全明白了。千鸟畏高没随上来，只坐在半山腰等我们。下山时我回望了一眼，烽台石面上凿着半行字迹，被风蚀得认不全了。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:beacon","text"],null]']
src = "blake3:6d0ecf801e915e7b562cd79d2194ee1dad68e73027fc9ad33be43240197a870f"
text = "攀上山顶那旧烽台"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:cave","reply"],null]']
src = "blake3:fa4fadf4579223d28570e0d07c06f2616205e5877655d9be2f8822f943aa84cc"
text = "洞口低矮，须弓着身子钻入。洞内回荡的水声和外头不一样，嗡嗡作响，像是极远的地方有人在说话。千鸟领在最前，汐断在最后，将我夹在当中，约定谁也不准往回瞧。摸到洞穴尽头，岩壁上印着一道又一道白痕，千鸟道那是年年大潮淹过留下的印记。最高的那一道，竟越过我的头顶。往外撤时潮水已然起涨，我们一路小跑才奔出洞来。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:cave","text"],null]']
src = "blake3:c3247386f73dd95d660ff56f35310eb3bf7d5added63e69dbf4224ed9e437a7a"
text = "等潮落透，去钻那石洞"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:pines","reply"],null]']
src = "blake3:aba11a3516e2ccc9e00e4f4f97a524d9a00da10f81f4cdc80e2a8e046ec3e13b"
text = "松根底下的草叶千鸟样样都叫得出名：这株熬水治腹痛，那株只合鹿啃食。她说婆婆眼神越发差了，草如今都归她来采。我紧随在后，把她念出的名称逐一录上怀纸，刚写到第十样，纸页却叫松脂粘了个正着。归途中，汐一把夺过那张纸瞧了半晌，开口道：“你纸上记的到底是草，还是记着千鸟？”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_first_outing:outing:pines","text"],null]']
src = "blake3:9afcf45d5a1ea0af82064b90245ea4df601688f30a8c3662a2571362e926998a"
text = "钻入松林，随千鸟识草"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:ask","reply"],null]']
src = "blake3:6c453a66c230712259193666c0b280cf9ae60796ae289a8941b7295044faa9f9"
text = "阿濑冲黑石头方向努了努嘴：“石后头那片水。水流先在彼处兜圈子，兜足了方才回转。它打转那当口，船最顺溜，也最容易叫它一把扯过去。”言罢便径自去了。次日我在岸边蹲足一整个清晨，专数黑石头后头的漩涡，正数到第十一个，潮水果然回头了。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:ask","text"],null]']
src = "blake3:ca66693d8c1fef3f1211a0e6177b252038dbf9e91237fd1c6b4455e636630fe7"
text = "向阿濑打听：河心哪处水先转"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:race_kids","reply"],null]']
src = "blake3:16c22e1bcf818df2d2276240680f7dc9819a85bcaa05168183ff402769ea25f8"
text = "我们同渔家的两条船比试了一回，输掉整整一个船身。往回划时，他们在后头高声叫道：“姬君，八朔那日可莫哭鼻子！”我没搭理，也没回头，单把橹柄又往短里握了握。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:race_kids","text"],null]']
src = "blake3:c7a577464023c5e75e9941d0b5246b3474e5dac91e2b1b2160669b78f8b36e1c"
text = "先同渔家小子们比上一场"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:watch","reply"],null]']
src = "blake3:dccce470feb08428e97a8ca7e660194ab1ac04b9b67ee63b331e5563cb553a73"
text = "我将船交托给前橹，独自登岸，坐于晒网竹架底下一动不动地瞧了整日。涨潮之际，水皮上的纹路一重接一重朝上游推涌；落潮则恰恰相反。唯独逼近黑石那截水域，水纹每每先乱而后整。我取出怀纸描摹那片紊乱的所在，一连画了七张，竟无两张雷同。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:drill:watch","text"],null]']
src = "blake3:b511617cf66994507428d1282fb22aa25996b07074733f4c239df62005156f9c"
text = "登岸盯看整日水流"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:chant","reply"],null]']
src = "blake3:0ce545c42d70f6a28b9634320e0b244f4e7123eee51ac0594976a9294b825060"
text = "我立船尾发号，众人分坐两舷扳橹。首日我喊得太急，八支橹竟绞成一团；次日又拖沓得太慢，小船只在河口原地转圈。第三日老三终于按捺不住，代我领唱了一遍，我这才豁然领悟：号子非是喊与人听，乃是喊与水听的。水流助推时起号，水势卸力时便收声。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:chant","text"],null]']
src = "blake3:9cf283c8c78c63422b28def4f2dbfc2696d5eea8c62b39620a524eef32d27f4c"
text = "先去学渔家的号子"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:paint","reply"],null]']
src = "blake3:9619c6b12b4aa05bbb67a16fda71cfcb412095bf6c2bad2473c1c6316f64e0da"
text = "我并不急着下水，先把小早扣翻过来，刮去藤壶，堵好隙缝，重新髹了一遍新漆。刷至船尾，忽见舵柄底面刻着个细小的“濑”字，刻痕极深，字边已摩挲得圆滑。我没有去问阿濑，只在漆刷走过时，特意绕开了那一处。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:paint","text"],null]']
src = "blake3:f4aae76d97917a12b6143af3bb5404f6af2da6b50c41c5b456ad86ccc588f673"
text = "先把船底重刷一层新漆"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:ushio_bow","reply"],null]']
src = "blake3:c04c3dc62d173270714f0a4cc9299ab62523e23d78797ee91071ca9a3224cb35"
text = "汐坐到最前头，回首睇了我一眼：“你喊你的号，我划我的桨。他们眼中只认我，不认你。”头一日果然如此，八个人齐齐随她的桨势走。第二日，我把号子改了拍子，反过来迁就她的桨落声去喊，船立时便走直了。岸上的阿濑道：“这方才像条船。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:helm:ushio_bow","text"],null]']
src = "blake3:541bdc20bfa6c618a56fa503bb45fef84fcb01e497b2f0397bb88b6a985dcb9e"
text = "请汐来坐前橹头"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:apologize","reply"],null]']
src = "blake3:a5c0e5fbedc41fc5af956f3d9d4ef1b3b0fa79002688e9718832fb3c369e11ff"
text = "我跪坐于阿濑屋内，言明船底是我刮损的，全不干前橹的事。阿濑低头补网，许久不曾抬眼，直到结完一个网眼方道：“船破尚可修补，你若怪罪到前橹头上，便再无可补救。”她动手卷起渔网：“冬至那日的大潮，再予你一次机会。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:apologize","text"],null]']
src = "blake3:f31b4811ca33b41c5c2dabe45770ab7e7d50ae28fea5c211f77ba3ba197e1abc"
text = "赴阿濑屋中赔不是"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:mend","reply"],null]']
src = "blake3:e2417d057cb96af86df3f931a7efdc2cfee1be300910e77dd4945e1e6d190dd0"
text = "大伙儿齐力将船拽上沙滩翻扣过来，把槙皮塞入裂隙，拿锤子一寸寸敲打瓷实，而后抹油封口。直修到暮色四合，前橹先行离去，我独个儿留下来又重敲了一轮。次日阿濑前来查验，屈起指节循着旧缝轻叩一圈，罢后说道：“冬至那日的大潮，再予你一回。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:mend","text"],null]']
src = "blake3:6943db55cf408208528f5fe42b230184e38e64e397a975a2b87725caed8b0843"
text = "同前橹合力拖拽上岸，亲手修补"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:shout","reply"],null]']
src = "blake3:6ef0baf991aa8c7e566104e4e19c677c9bf22dc3542cd6acce61f3219b03471f"
text = "“待明年！”我朝晒网架高声道，“明年八朔，你也下场来，咱们比试一场！”他先是一怔，旋即笑得更欢：“外浦的不准下场，你莫非不知？”我便回说那我上能岛寻你去。岸边众人闻言皆笑，只是这回笑声里夹着几声拍手。阿濑立在人群末尾注视着我，一言不发，往后再未提起那条船的旧账。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:lost:shout","text"],null]']
src = "blake3:d6aa67a0432f0194909898a3ef26ca958bba6e2634f1c6578ca33c50920f5c90"
text = "朝那能岛少年叫阵：来岁再比"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:boy","reply"],null]']
src = "blake3:6ac9ee6fa3aa45ec12c577a965b8db79f6126dc2a63f50e3652a058ab4d0629a"
text = "老三生在渔户家，排行第三，夏间竞渡曾坐在我邻近那条船上，划起桨来跟拼命似的。我立在他家门外请他做前橹，他登时笑得合不拢嘴，笑罢反问管不管饭。我答管饭。他便痛快应下。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:boy","text"],null]']
src = "blake3:b82cadd7dd5004d3d58071f526c556326d0fc457a396a575cba059e2704cbcd5"
text = "去寻渔家的老三"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:chidori","reply"],null]']
src = "blake3:2ae85d0316e004bcd209684cb1dc7bc09f4a22fb1a05e5c797c560dda2d41cbd"
text = "千鸟推说自己唯擅泅水，不谙划船。我便道潜水之人气息绵长，划至后半程定不会喘。她思忖片刻，将竹篓往礁石上一搁：“这便应你了。先说好，万一船翻了，我凫水比你利索，定是先爬上岸去；至于回不回头捞你，全凭我彼时心意。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:chidori","text"],null]']
src = "blake3:9f723e2ab19b4b5c38ef37cd6a33beef5ab52a8d6760efd642d84c72a6ebb0ff"
text = "去请千鸟坐前橹"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:ushio","reply"],null]']
src = "blake3:6ab86ad38b7a4a06beaefca41a85726000e2da10de32f44d1517f651c74c9ae5"
text = "汐彼时正蹲在网棚下削制木桨，听罢我来意，随手搁下刨子：“前橹？我划了十年船，你倒叫我坐前头与你卖力气？”我答那便换你去船尾掌舵。她盘算一番，重又抄起刨子：“罢了，前头便前头。若是舵把歪了，仔细我回头骂你。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:notice:ushio","text"],null]']
src = "blake3:d54f306c48e61f36d64325081bff32a66f8ca47dd348f36a3f7c34da8060ba6c"
text = "去请汐坐前橹"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:deep","reply"],null]']
src = "blake3:13e9c3b9f47a3db8ab4f1e5541ae945784dbba28bb6aef133d8ba0d4f34bba28"
text = "我重重扳橹，船首一头扎进河心。急潮在船底死命撕扯，拽得船板不住震颤，我目不转睛盯住黑石头后的漩涡，候它旋至第三转——便是此刻！小船借着涡流一把甩过巨石，好似背地里得人助推。返程之时，后方众船尚在同潮水苦战，我们已头一个触及东岸木桩，岸边欢呼四起。阿濑照旧抱着胳膊立在原处，可我分明看见她嘴角牵动了一下。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:deep","text"],null]']
src = "blake3:24d00cbbfeccc75c15e93f8058b8ab1afde76c35366e842e0a54b9fcc629f98d"
text = "争抢河心深水道"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:eddy","reply"],null]']
src = "blake3:b53557abb9a890d8c6949bf4a4f7fe33477eef07ff6bf3e38c87782bb6bd2ec9"
text = "我将舵往南岸一摆，船头随即探入那股回流，水势霎时柔和下来，恰似水下有人稳稳托着船腹。别家船只全在河心与退潮硬顶，我们唯贴着岸边，一桨接一桨，虽不疾，却无一桨落空。兜过黑石头时尚居第三，及至重返东岸，竟已拔得头筹。几位老渔夫感叹，在这道回流里行了一世渔船，从未料到还能用来争先。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:eddy","text"],null]']
src = "blake3:97759720b77b674acb440e8b4d639394e5190e9cd2ae98c6c1a62ae9d1005def"
text = "顺南岸回流行船"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:steady","reply"],null]']
src = "blake3:27e1f9d0b6ae09fd3064ac6383508270fca774399838f5b27b455bd58a61348f"
text = "我不曾去争抢。小船稳稳缀在第三条船尾后，兜过黑石，返回东岸，位列第四。岸上无一人呼喝我名，亦无一人嗤笑。阿濑行至近前，伸手摩挲船底，继而低首端详我掌心：“船未磕损，人也未丢分。”她略作停顿，“冬至那日的大潮，再予你一回。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:race:steady","text"],null]']
src = "blake3:a94e740b956b1cfb61d7db87282ec077852c7f9b32025a91cc1a19453ffe2f21"
text = "不争先，尾随稳稳划毕"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:decline","reply"],null]']
src = "blake3:47bbd76b19ac63874a74ef7c3ce5deaba7b62a3324c618ebaf486f412a4227d4"
text = "我立在栈桥上，望着黑黝黝的河口看了许久，道：“等我从京里回来。”阿濑没有多劝，顺手将缆绳又缠上一圈，系紧了：“它等得起。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:steer","reply"],null]']
src = "blake3:f717035efbb596fc43511e8f8cd1b727403dbf34faa83e9cb68a39c60fbd19b0"
text = "头一声喊出口时，喉咙还打着颤；第二声便定住了。小早顺着退潮滑出去，沙洲尖上的水翻着白花，我往外推舵，船头擦着白沫拐了过去。靠回栈桥，渔家孩子们一个个甩着手叫冷。阿濑接住缆绳系好，拍拍船帮：“归你了。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:steer","text"],null]']
src = "blake3:6daf037a6a59ef700e2adb2eb793ea24ff83cc34b5f9c349a262ec6f98005903"
text = "跨上船尾，喊起号子出河口"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:ushio","hint"],null]']
src = "blake3:42977812ac0f9b96972b9c11d716e0c146a60cc68f3b541891c8d564cf0eced8"
text = "这几日汐不大搭理你。这么冷的清晨，你喊不动她。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:ushio","reply"],null]']
src = "blake3:42b4ba57712e80e896f6ac5efc8cb227ddb865f2aac609ba7c3be6afbc233524"
text = "汐坐去最前头，半句话没讲，先落了桨。八支橹应着她的桨走，我追着八支橹喊号，一前一后，竟像一个人划着一般。拐过沙洲尖那会儿，她朝后望了我一眼，嘴唇冻得乌紫，眼里却带着笑。靠回栈桥，阿濑瞧瞧汐，再瞧瞧我：“两个人的船，一样是船。归你们了。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter:ushio","text"],null]']
src = "blake3:6074664c5110d07a0840dd55c0ddc300d10527c974d692e96fc75ada78e1ad69"
text = "请汐坐去前头领桨"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter_lost:accept","reply"],null]']
src = "blake3:b9856372791d9a856c14696a9039a1eec852a5ae0a2e5fa6a6e6b70b60d2f0d0"
text = "我将缆绳一匝一匝盘匀，挂回桩上，理得比她往日还要齐整。阿濑瞟上一眼，什么也没说。隔天清早，舵柄上便多出一层新油。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter_lost:accept","text"],null]']
src = "blake3:0db90542eda1e9576fe23f8ad1a06bf5c82e4ae1cfd9c8b83b019bae1015b93a"
text = "认下来，帮她将缆绳收妥"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter_lost:again","reply"],null]']
src = "blake3:3f5bbdcee8c89c878403bcaf7729a0b049f88c4ff2c32cf37352a2303ebd927b"
text = "阿濑摇了摇头：“潮过去了，便是过去了。”停了停，她又补上一句，“下回大潮，你人在京里。到那会儿去瞧瞧京里的河，等回来讲给我听，它同这儿的潮水有什么两样。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_hassaku_race:winter_lost:again","text"],null]']
src = "blake3:192bfd0fd8270089d685680c79a4249a89ed0cbd6e8eb108fb3cc3b5f7069b9b"
text = "央她明早再准一回"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:both","reply"],null]']
src = "blake3:8bb7ee8ac450b89e169d208127bb78276e21a02f79d793d4f1caf36e19319efb"
text = "母亲同阿濑彼此望了一眼，谁也没说行，谁也没说不行。头三天里我两边来回地跑，鞋底带的沙粒落进砚台，墨里便咯吱作响。到了第四天清早，母亲把砚台移到面向河口的那扇窗下：“放这儿近些。”阿濑隔着窗子喊道：“潮水回头了！”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:both","text"],null]']
src = "blake3:216476735d31a4a19d4727f2adefd6daac6d3b766d52a33d79e8a2ffc1bc941a"
text = "趁潮落去河口，涨潮再回来研墨"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:ink","reply"],null]']
src = "blake3:0a5c44604caf00bdefc5382dcc13cdae037aa65f3386b145ef0f70e1005e3244"
text = "阿濑哼了一声，将蓑衣挂回墙上。母亲为我研墨，墨条在砚池里绕了一圈又一圈，她说墨须磨到能映出人影，字才站得住。我写完三张假名，窗外传来汐踏过沙地跑远的声响。及至写第四张，手腕已不再发颤。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:ink","text"],null]']
src = "blake3:2e36f8f5a14b00812eded02e35e9423f82e1e190bbe08a7f5a95a8144675e60a"
text = "早起听母亲的，先将字写好"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:tide","reply"],null]']
src = "blake3:1496eae1c9dfcd30e5a454cdd723d0569af5f34340619ceb2066322b028531ce"
text = "母亲一笔划掉纸上的“早”字，换成了“晚”：“那就掌灯写。”次日天还没透亮，阿濑便把我的被褥掀了，门口的汐早蹲着绑好了草鞋。三人踩了一路霜走到栈桥时，河水还黑沉沉的。阿濑交代，今日单看一桩：先往回涌的是哪一道水。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:family:tide","text"],null]']
src = "blake3:732edeebf780be371636215950b555e581edd687e1a6540c193d9e667b15ba44"
text = "早起听阿濑的，下河口看潮"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:blank","reply"],null]']
src = "blake3:9275cf0ba797754df48417ab028a6660b04dbfea91a64f034629c52a4be2e85e"
text = "第六行我只填了半日，余下半日留白。母亲问空着做什么。我回说尚无主意，想空出来留给眼下还不知晓的事。她盯了我一会儿，将笔递还过来：“那就往空处写上‘不知道’，日后回来再补。”门外头的汐一下笑出声来。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:blank","text"],null]']
src = "blake3:df6c398b0d4ff406cb6a8f208c01de2cb319072e4568ce849e35ca5f7c4b6e89"
text = "空出一格不作安排"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:ledger","reply"],null]']
src = "blake3:0e54ee4d77e0aaf9525f4bb135df6155ff3d68577d7dcfd52649dd8cbeeb8dc0"
text = "我在纸页顶头写下一行小字：今日领钱一串，花销零文。母亲看了一眼，指尖拨过一粒念珠：“账打零文起笔，不错。”头一个第六日我把日程填得严严实实，半刻喘息都没留。母亲取过笔，在那行尾上添了个“歇”字。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:ledger","text"],null]']
src = "blake3:33e5d7aff998dd96230bc72e52e1707bf9db3aa3a393b303b74ebe731d6930db"
text = "先将钱数落到纸头"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:share","reply"],null]']
src = "blake3:74f9db00943202983bb685cff8b61eef4940cfb187eb9905abc3d2661da95792"
text = "我自麻绳上解下几文，拽着汐跑去集市，挑了块烤得焦香发黄的米饼，当场掰作两半。汐嘴里说着“我又不是姬君，哪里用得着你请”，接饼的手倒伸得利索。回来后，我在纸头添了一笔：米饼一块，二人分食。母亲看了去，倒没多言，只低声将“二人分食”四字念叨了一遍。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:purse:share","text"],null]']
src = "blake3:a766ce0b2a25dca49db9e48e3990d0b767833b569988a9f22e233529450e9ea4"
text = "抽下几文钱，买块米饼给汐"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:seabed","reply"],null]']
src = "blake3:b3addb55a6b2b2b00366ed1ab1d8908593d96b46a979b5468264f37eece3118f"
text = "她名叫千鸟，随河口的老海女阿德婆婆一道过活，父亲则在堺的船坞做活。我打听水底下究竟是个什么模样，她想了好一阵，吐出一句：“冷，接着发亮，往后又冷。”我没听明白。她便将一块湿淋淋的石块塞到我手心，石背上正吸附着一只小海螺：“这物件，便是底下的模样。”我把海螺揣回屋里，搁在砚台旁。半夜它竟自己爬跑了，次日才在墙根寻见。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:seabed","text"],null]']
src = "blake3:3425a6f78f338eb9b058052bd367d2a87d47faf1f591bf36b63ed7e7e9a3bdb1"
text = "打听水底下的光景"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:ushio","reply"],null]']
src = "blake3:9c1072494fb59573bdeea5b9017d348a8cf3ca48ff79b1c9c95dbefc7c954d56"
text = "她名叫千鸟，说自己认得汐，就是“阿濑家那个凶丫头”。我拉扯着她回到栈桥，正碰上汐在晒网，她俩隔着渔网眼彼此直勾勾瞪了半晌。汐先开口：“你家婆婆的鲍鱼，去年还短我娘一只。”千鸟立刻回嘴：“你娘手里的秤，去年不也短了我婆婆一两。”说完，两人倒一块儿笑起来。唯有我立在当中，觉得自己仿佛什么也不晓得。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:ushio","text"],null]']
src = "blake3:5977bfa11bd9c3f1cba4cb8006889d781cd3d0eb6638f0337079d00dfaae02c1"
text = "拽她回栈桥见见汐"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:whistle","reply"],null]']
src = "blake3:d6997a16927a268bcbeab65bde90ba1ca1d0d490e8a522a0dcffd9bb808f3d0b"
text = "她名叫千鸟，正是河口老海女阿德婆婆的孙女。她说这哨音可不是吹着解闷的：入水憋足的那一口气，浮上来时断不能一口吐尽，须得打牙缝间缓缓放出去，吹出了声响，胸口才不至于疼。她教我撮紧嘴唇学吹，我连试了十来回，尽是噗噗漏气的动静。她笑得直蹲在水洼里起不来身，笑罢，又老老实实吹出完整一声让我听。潮水转头时，她一把拽着我跃下礁石，脚程比我利索多了。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_newcomer:shore:whistle","text"],null]']
src = "blake3:1a2d9b473651125030dea8a616030191e28c65d25ff9197fcdc5abe16b2358e2"
text = "问她这口哨如何吹响"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:bow","reply"],null]']
src = "blake3:1c3da5009ef23741fb0072d425740d22a3a455c7665f56125b018036f20b07cb"
text = "母亲打量了汐半晌，而后立起身，亲手把汐的指掌压在草席上：“指尖并拢，额头离手一寸。”汐弯腰拜下，一条脊背挺得跟桅杆无二。母亲说架势太硬直，宫里的人见着还当你是要打架。汐咬住唇角，耐着性子再拜。那夜她实打实拜足了三十遍，我便在旁作陪跟着同拜。末了那遍落定，母亲才算松口：“行了。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:bow","text"],null]']
src = "blake3:fa246af2b642d20ee44cf7c41dbab72fd6bcf6728b8e650669ebcff72978e393"
text = "拽她往母亲房里演习礼数"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:promise","reply"],null]']
src = "blake3:95148df872f12a5b3f7c48fcd03707986dd119744850948239d05724379262b6"
text = "汐从鼻腔哼出一声：“谁欺负谁还说不定呢。”嘴硬归嘴硬，她却拎起那件小袖，在身前仔细比了比尺寸，复又叠得方正，压在包袱最下层。睡下时她拿脊梁朝向我，到了半夜偏翻转身来，把额角抵在我肩头，正似幼时打雷夜里那副光景。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:promise","text"],null]']
src = "blake3:48de2f679c483b736ba2ee6840c031005515956a10f1912b8325520c670d0396"
text = "先说准了：往后到了京城，谁也休想欺负你"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:warn","reply"],null]']
src = "blake3:2509d4b5043350e43209e0775e957a2d6effb57d15492b2d1ee91e350683fad9"
text = "汐劈手将包袱抢回怀里捂紧：“你当我是专程为你去的不成？”她言道能岛的叔父曾提过，京城多有往来各国的船主，她要去见识那些人究竟如何求得过所旗。说罢，她又悄悄添上一言，声气低微下去：“顺便看顾着你。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:goes:warn","text"],null]']
src = "blake3:01276a4757a3dbc1ccfbc8037bb3741cac0a2144fb30062160b1246d36bb4dd9"
text = "劝她宫中日子苦，不去也罢"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:tie","reply"],null]']
src = "blake3:c494d8c069bcf20684cce5724635a2911243b72a337de15eaf2f6960313c52ab"
text = "我拣起绳子另一端，照她的法子绕圈、穿孔、收紧。她嫌我手上没劲儿，结打得虚，解开重教；拆到第五回，才耐着性子指点：哪样结专用来拴船，潮水再猛也挣不脱；哪样结一拽即散，原是留给自家逃生的退路。天将破晓，整根绳子打得满满当当，她拎起那串沉甸甸的结套到我颈间。“难看死了，”她嘴上嫌弃，“明儿就拆。”可直到次日，她也没动手拆。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:tie","text"],null]']
src = "blake3:b94662a0ddec1e153d2516107f12a8c5f66013acf703749c0cc89f9baf454de8"
text = "陪着她一块打，打到破晓"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:untie","reply"],null]']
src = "blake3:d4292571ce9031426f601a7a2b0c698d8209295c8f4e4a5a02c78b081518e9a4"
text = "我劈手夺过绳子，拿指甲挨个儿抠。实在勒得太实，才拆到第三个，我指甲盖便掀劈了。汐拿眼瞪我：“好端端的解它作甚？”“拆松了，明儿才好接着用嘛。”她盯住我伤着的手指，忽地笑出声来，取回绳头轻轻一拽，余下的结顿时散了个干净。敢情她打的全是活扣。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:untie","text"],null]']
src = "blake3:2201ce151d4b4a0c7a60c68db287b3e9cb98e54e8282c714be64d8458162629c"
text = "将她打死的结逐个拆开"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:write","reply"],null]']
src = "blake3:4f5b8b6a72c2b2c31aed507876ecd4646878d2ddd19f78dc92f1b02a9db752cb"
text = "汐的手顿了顿。过了半晌，她将绳子往被铺上一丢：“我自己的旗，我自己来写。”说罢，她便背过身去躺下了。我原当她是恼了，谁知半夜醒来，她的手却搭在我的被面上，和儿时一般。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:knots:write","text"],null]']
src = "blake3:af07563582392f6735e0678b92d1e7ea98375f38abc7bbb06a59c9efb2a0cbf7"
text = "说：往后那旗上的字，我替你写"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:fist","reply"],null]']
src = "blake3:ea81287e10d06068ec28459b719bb2aa4ca0f6ed54489ede8a372680e125284c"
text = "我的拳头本就比她小一圈，量出来的数目总多出一个。她捏住我腕子往高处抬，叮嘱臂肘得抻直了，眼珠也别眨。我俩反反复复地量，直量到星斗都斜了。下屋顶那会儿，她压低嗓门嘱咐：“千万瞒着阿濑，她总念叨，姑娘家夜里不困觉往后长不高个儿。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:fist","text"],null]']
src = "blake3:002ca8cd8a2bb70309027709c9bcf7f621a3cd583c6d5b2ff5691fc869be7031"
text = "也学她拿拳头去量星"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:poem","reply"],null]']
src = "blake3:ee4f8d5409ae279e3372a13f5ce40f57042427c43387f3354802ecb4c3124399"
text = "我先吟了上句，道北天那颗星宛如一枚钉子，把青天牢牢钉在海上。汐朝我飞个白眼：“曲子还能充作针路？”待我接念下句，她倒静下来，直听到末尾才出声：“再诵一遍。”我又念了遍与她。她道：“钉子那句，换作缆桩。”我改过来一听，果真顺耳了些。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:poem","text"],null]']
src = "blake3:f91bfdf5e431e62857392b2496b9ec80494ace37e4444d5bc6ad24665afe15bb"
text = "替那星子编首短歌"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:why","reply"],null]']
src = "blake3:ca5a63e61269dbe08723d86d68d7c0414ad2c86bff2752b4393bfa58b1c4ad9a"
text = "汐默然不答，过了半晌才朝底下比了比：“阿濑的肩膀。但凡阴雨天，她入夜便疼得翻身，她一动静，我就警醒。”我倒压根没听见过阿濑翻身。汐道：“你睡得死沉，打小这般。”那夜我俩没再赏星。回到屋里，我把自个儿的被子折好，垫在了阿濑右肩头下头。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:stars:why","text"],null]']
src = "blake3:8c97fefff38ffbe4b67a0f90d3249162d15843175eb595378ad5397b1c328b2e"
text = "问她缘何入夜偏睡不着"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:ase","reply"],null]']
src = "blake3:7bbb9cf4ecddb735062cfad4b05c6db4e73c451f492688cd125336d0e7b64c7a"
text = "我架着阿濑回到屋里，拿热盐包给她敷在肩上。她骂我多管闲事，硬要自己出去，被我按住没让动弹。等我再奔回栈桥，汐领着孩子们已拴妥了大半，偏偏最外边那条小船断了缆，船底朝天漂出了河口。天亮之后，阿濑盯着那根空出来的桩子没作声，只把盐包又往肩头压了压。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:ase","text"],null]']
src = "blake3:01c71719c173769474c5e1a876c9d19f29071bda2f167442ca0f1c02855b7f9e"
text = "先搀着阿濑退回屋去"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:command","reply"],null]']
src = "blake3:549ebcd165051136b9a8abfefea2dc7d5b165cc1e75f36dcbdcbb0177ccd6b54"
text = "我站定在栈桥前头，顺着船只大小逐艘发令：大船占先，牢牢系上石桩；小船拖扯上岸，底朝天倒扣着。汐紧跟其后缠绳打结，她收紧一处，我便点破下一条。喊到后来咽喉干哑出不得声，便直接拿手指点。天光放晴风浪止息，河口浮着折桨与碎席片，咱们的船却一条未少。渔家孩子们归家后传言，说姬君发号子时，气势比阿濑还厉害。"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:command","text"],null]']
src = "blake3:744cadab1d5febef7f06c57a43defd42d4c6cf1de073ade6b620712b7845343f"
text = "我负责发号，汐动手系结"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:follow","reply"],null]']
src = "blake3:87e09b0df48d4d7028ad0879ad3915e6ba1071eb8deef14de4390a30382bad04"
text = "“归你发号。”我道。汐怔了瞬息，旋即放声吼开，嘴里带着濑户内的乡音，语速既急且快，渔家孩子们竟句句听得真切。我随她一并拽粗缆、压船舷、递绳索，掌心蹭破了皮也未曾声张。晨光微露时，她歪坐在濡湿的渔网堆上，沉默许久，方低低道：“原是我喊出来的号子，他们也肯听令。”"

[entries.'["upbringing/families/mio_growth.toml",["choices","c9_mio_ushio_home:storm:follow","text"],null]']
src = "blake3:b6ab8be88a6fed11acdc274aeee53e4e01c1cec86be0eb951957f452b58c586e"
text = "交由汐来发号，我听她调遣"

[entries.'["upbringing/families/mio_growth.toml",["effects","c9_mio_chidori_letters:first:river:2","text"],null]']
src = "blake3:57bfa03e039fd9c7c5001d6af81b37ccfac7aff7e744dac893b5de04d5bbdc26"
text = "澪：河口沙洲朝东挪移。婆婆眼疾更重了，鲍鱼皆归我潜取。我已潜至五寻。堺的客商仍要煞价，我依你教的话术回了，他到底松口抬了些许。汐的娘日日在栈桥上骂街，身板硬朗着呢，你且告与汐。我的名字可写得进益了些，你瞧。千鸟。"

[entries.'["upbringing/families/mio_growth.toml",["effects","c9_mio_chidori_letters:first:teach:2","text"],null]']
src = "blake3:57bfa03e039fd9c7c5001d6af81b37ccfac7aff7e744dac893b5de04d5bbdc26"
text = "澪：河口沙洲朝东挪移。婆婆眼疾更重了，鲍鱼皆归我潜取。我已潜至五寻。堺的客商仍要煞价，我依你教的话术回了，他到底松口抬了些许。汐的娘日日在栈桥上骂街，身板硬朗着呢，你且告与汐。我的名字可写得进益了些，你瞧。千鸟。"

