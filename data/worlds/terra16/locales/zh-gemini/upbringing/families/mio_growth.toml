text = "澪：河口沙洲朝东挪移。婆婆眼疾更重了，鲍鱼皆归我潜取。我已潜至五寻。堺的客商仍要煞价，我依你教的话术回了，他到底松口抬了些许。汐的娘日日在栈桥上骂街，身板硬朗着呢，你且告与汐。我的名字可写得进益了些，你瞧。千鸟。"

[entries.'["upbringing/families/mio_growth.toml",["effects","c9_mio_chidori_letters:second:ask:2","text"],null]']
src = "blake3:bf65a14e8ff87b2894358d4a671d00e23038e1133e2ff7d5c36273194dc98998"
text = "澪：婆婆再不下海了，全由我独个潜。堺船来得早，干鲍卖上了好价钱。汐的娘把个存心赖账的船主活活骂哭。今夏你归不归来？若是回来咱俩便比一场，瞧谁先探到水底。七。千鸟。"

[entries.'["upbringing/families/mio_growth.toml",["effects","c9_mio_chidori_letters:second:keep:2","text"],null]']
src = "blake3:bf65a14e8ff87b2894358d4a671d00e23038e1133e2ff7d5c36273194dc98998"
text = "澪：婆婆再不下海了，全由我独个潜。堺船来得早，干鲍卖上了好价钱。汐的娘把个存心赖账的船主活活骂哭。今夏你归不归来？若是回来咱俩便比一场，瞧谁先探到水底。七。千鸟。"

[entries.'["upbringing/families/mio_growth.toml",["effects","c9_mio_chidori_letters:second:summer:1","text"],null]']
src = "blake3:bf65a14e8ff87b2894358d4a671d00e23038e1133e2ff7d5c36273194dc98998"
text = "澪：婆婆再不下海了，全由我独个潜。堺船来得早，干鲍卖上了好价钱。汐的娘把个存心赖账的船主活活骂哭。今夏你归不归来？若是回来咱俩便比一场，瞧谁先探到水底。七。千鸟。"

[entries.'["upbringing/families/mio_growth.toml",["variants","c9_mio_hassaku_race:drill:v_chidori","text"],null]']
src = "blake3:b33a06d744a54182b52fd242143bd9b040dd29fd16af1c8bca18d8ba555ff311"
text = "离八朔还有半月，阿濑立在栈桥头督看我们练船。千鸟挥桨好似伸手往水里捞物，每一下皆扎实，唯独划至河心，她总按捺不住低头窥探水底乱石，船速随之一滞。我出声催她，她却说水底游过一条鲈鱼，竟比我手臂还长。岸上的阿濑登时咳了一声。及至日暮收船，阿濑唤我过去，掰开手掌瞧了瞧，水泡已然破过两遭。"

[entries.'["upbringing/families/mio_growth.toml",["variants","c9_mio_hassaku_race:drill:v_ushio","text"],null]']
src = "blake3:b5128b2f4bd1289f7f82d31d2e931f28578f0581f32878b8e8e3c53cb2981e0c"
text = "距八朔尚有半月，阿濑立在栈桥头看我们操练。汐坐前头划桨，入水既深且稳，偏生不愿依我号子，节拍每每抢先半拍，船首总朝左歪。船一歪，岸上的阿濑便咳一声，汐闻声就回头狠瞪我一眼。一直练到日沉西山，阿濑招手唤我上前，掰开我手心瞧了瞧，泡早破过两遭。她转而要查汐的手，汐却将双手负在身后，硬是不让看。"

[entries.'["upbringing/families/mio_growth.toml",["variants","c9_mio_hassaku_race:race:v_chidori","text"],null]']
src = "blake3:504fc8e77f7f171c809aba230a3d283d903a41a72576e33795cbc0a05cda2380"
text = "八朔黎明时分天未亮透，河口两岸已挤满观潮的人。七条船在东岸一字摆开，鼓声一作，七支前橹齐刷刷砸入水里。初段借着顺水，条条不慢；行至黑石头近前，退潮正烈，河心水流高高隆起，紧绷宛如一匹扯足的布。千鸟从船首回过头，满脸尽是水花：“往哪头去？”争河心深水道，途程最捷，也最易叫退潮推出去；贴着南岸行，那儿有一股回流，慢些，胜在稳当。岸边阿濑抱臂立定，纹丝不动。"

[entries.'["upbringing/families/mio_growth.toml",["variants","c9_mio_hassaku_race:race:v_ushio","text"],null]']
src = "blake3:e2ee559d0b846fd166aaa0d23f7faa34cf032e828e02c24519bfda0d3eb7a6cd"
text = "八朔当日天未破晓，河口两岸早站满了人群。七条船于东岸列成一排，鼓点甫落，七支前橹齐齐劈入水中。头一程顺水而行，谁都疾飞；临近黑石头时，外退的潮势正猛，河心水流鼓胀而起，恰似一匹绷紧的布。汐在船首头也不回地大喝：“往哪边？快拿主意！”抢河心那道深水，路程最近，却极易被潮推出去；贴着南岸绕，那边另有道回流，虽慢，胜在稳妥。岸上阿濑抱紧双臂，一动不动。"
