generator = "gemini-4-hydrogen"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_1","desc"],null]']
src = "blake3:4f85cf26490805222572a733129d13c397178a75cdcba841c8fa224d152aecce"
text = "阿濑拜托能岛的小早带你三周：先绕足摺岬，回下田添水，再往东去浦户。收尾赛一场桨。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_2","desc"],null]']
src = "blake3:09acd1432a94040bd714d13466d8d5e318f9b0d9b98bd2a7843e24683da3ddd2"
text = "新米随船送去堺，跟船走四周：到了堺卸米、装上回程货，末周得认清舱里的货物与成色。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_3","desc"],null]']
src = "blake3:b1b99d4ec73b1af0e72aa47edf9a2285323146fbf5bbc1c6ffa2627dd5f800d6"
text = "向学里告两周假，乘上能岛的小早，在堺港外护商船进港，收尾要赛一回桨。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_4","desc"],null]']
src = "blake3:42a05e55af55b98f2dcfa31577f7e90be2c6e5c345aa020e7c3c50f5330976df"
text = "初夏时节，能岛的小早又在堺港外护航，随船走两周，最后一周要比桨。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_5","desc"],null]']
src = "blake3:b1f40e4cff807982a01f09f0c800577200583f5da7b7461f620f1e7fb93e25d7"
text = "第三个初夏了，依旧护船两周。堺港外候着入港的船只一年比一年密，临了也要比一比桨。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_6a","desc"],null]']
src = "blake3:aaccfde336812e7cbb3acb9d8ab79a4e48e9ec482209f867971de72118a9e954"
text = "回乡偏逢上刮野分，海里出不得船，便随小早沿四万十川溯流划行两周，末了同别船比快。"

[entries.'["upbringing/voyages/mio.toml",["act_voyages","mio_voyage_6b","desc"],null]']
src = "blake3:faae75976ffc18d72d948f7497c3f13dc775737fbc42a2494704e9310d7e4eee"
text = "九月回乡，野分才歇，河口沙脊移了位。随小早持竿一处处探水深，末周同别家船赛一程。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_1:0:mio_voyage_1_leg1_deck","hint"],null]']
src = "blake3:29dddddeaf97eb5b395eb5c8795e654015a198dd71f304bcffbe88e0a34b766f"
text = "船正绕过足摺岬，岬角下大浪翻涌。倚着舱板喘口气，寻个人说说话。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_1:1:mio_voyage_1_leg2_deck","hint"],null]']
src = "blake3:3ec4d4b97c89abddfee620e7308cd040f546a71f48acb3f6e1bd55952df1fe43"
text = "停在下田河口外候潮。得了闲便歇脚，顺手递些吃食给水夫。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_1:1:mio_voyage_1_leg2_dock","hint"],null]']
src = "blake3:0ab7c63cfba6a1c8e272079cee5f4c7fa2ecbedb9f0251e08efc9b52f744eb3e"
text = "靠回自家栈桥添水。帮着扛几包米盐，听听过往船只带到的消息。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_1:2:mio_voyage_1_leg3_deck","hint"],null]']
src = "blake3:861e0aaf681c3b206f27a19c514bdcba30f1386a7da7aa3bf8d373a8123e1487"
text = "进到浦户湾里，湾口虽窄，里面水倒平缓。在甲板上歇着，和阿濑讲几句话。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_1:2:mio_voyage_1_leg3_dock","hint"],null]']
src = "blake3:cd014d13948b6a9e9fe94881432354b5cbcf55098d2fe1b6f75b2dc2f448b926"
text = "浦户湾的码头上，米包盐包搬来搬去。去扛包能挣工钱，也能听点消息。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:0:mio_voyage_2_leg1_deck","hint"],null]']
src = "blake3:52130b3e41435585190e9a38267e9ea668d04eac5d6bfea47661035ae4a31203"
text = "米包压实了船舱，船泊在河口外等风。坐上米包歇一歇，顺道和船家闲谈。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:1:mio_voyage_2_leg2_deck","hint"],null]']
src = "blake3:c01a20acc4819660b5d3527c6d69340a3f4f2c69fd676255269490d7795680c0"
text = "船停在堺港外候着卸米。可以在甲板上躺会儿，或把物件送出去。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:1:mio_voyage_2_leg2_dock","hint"],null]']
src = "blake3:5e678e32fb4219145f892d149093c1dfaedf580400323bfcd4c0416e71318fd7"
text = "米包正一包包搬进岸上仓房。搭手去扛能挣工钱，来往传的消息也多。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:2:mio_voyage_2_leg3_deck","hint"],null]']
src = "blake3:aabb99ec60cacc6a6b214af0c21529a7ff5e0a933e2bd493ce847ceb09402b4c"
text = "米已卸净，船舱改载纸张与铜钱。趁着空当歇一歇，找人聊几句。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:2:mio_voyage_2_leg3_dock","hint"],null]']
src = "blake3:cb62d52dd17ac744046b945bfd549ed14d690908bf39e919c1c65dad3cbf3818"
text = "上回程货时，码头上哪里的口音都听得到。去扛几包货、问点事都行。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_2:3:mio_voyage_2_leg4_deck","hint"],null]']
src = "blake3:bd0556ebe0476690c348f963d3077b83573f6bef5fc16635ae2bb84349399f7f"
text = "归途船吃水变浅，眼看就到下田河口。趁这最后几天歇歇，顺便把礼送了。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_3:0:mio_voyage_3_leg1_deck","hint"],null]']
src = "blake3:3eabed8e750c20c358fb5ee69382b322b6c1ddc66b2ad108cb25720622039fce"
text = "小早紧靠着一艘堺船，伴它一路入港。轮到换班便歇下，跟水夫搭几句话。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_3:0:mio_voyage_3_leg1_dock","hint"],null]']
src = "blake3:ff2f621ea1de71c139e18b30ad9d894855fccbadc830a4f3306ec0741dab0057"
text = "护送来的船在此卸货。帮着搬一搬挣几文钱，顺道打听市价。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_3:1:mio_voyage_3_leg2_deck","hint"],null]']
src = "blake3:d5cf045fa793fc9b889f6b745b4064a86e2466493a9c35111587e52f10f59bd8"
text = "小早停在堺港外候下一批船。得闲时既能补一觉，也能寻人聊两句。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_3:1:mio_voyage_3_leg2_dock","hint"],null]']
src = "blake3:253ddc99a93843cfb9ed457dfc6d6d3b7622d9c6b5156a4e8db6aefb828784c5"
text = "缴了帆别钱的船主在岸上歇着，正话多。一旁也有货包缺人扛。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_4:0:mio_voyage_4_leg1_deck","hint"],null]']
src = "blake3:315308711c730aa1d585a2c76f55395a25d9e5ce23b46f0e8b88a0dcdeeaf333"
text = "南风一起，小早每日要往返护送两趟船。偷空喘口气，找人说几句。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_4:0:mio_voyage_4_leg1_dock","hint"],null]']
src = "blake3:7b4d47f6ccbd9b445ede97119c805322b61539b5ceb2a96e3402936c2b8cc99f"
text = "岸边堆着才卸下来的木料。抬一根算一根工钱，码头的消息也好问。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_4:1:mio_voyage_4_leg2_deck","hint"],null]']
src = "blake3:ba1ec4716fd92e549e0599661e03ad57a6105e9d31ba4053f8a10acfd6f1adb1"
text = "湿缆绳搭在船舷，换下班的人正打盹。正好一块儿歇息，或寻谁聊聊。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_4:1:mio_voyage_4_leg2_dock","hint"],null]']
src = "blake3:2f6298a6f0e176fccdbbfc2a7203bce41f69eb638ed718421cb980a588c00e02"
text = "商号遣了伙计上码头盘货。搭把手搬运，顺便听他们说说近日的价码。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_5:0:mio_voyage_5_leg1_deck","hint"],null]']
src = "blake3:254a29cc6479e611173a28ba448f813429de6a02862d64f98808831edc34e671"
text = "护的是一艘大船，小早须围着它划行。歇桨的工夫喘口气，凑一块聊聊。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_5:0:mio_voyage_5_leg1_dock","hint"],null]']
src = "blake3:f04862935f36cdb77c3ef85d82baeb59370556acf631234385319ac8eda033a7"
text = "码头上有人吆喝叫搬夫，按包给钱。歇手时能听旁人讲些外头的事。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_5:1:mio_voyage_5_leg2_deck","hint"],null]']
src = "blake3:66cabde4553004bf0093054811b48a067af54d2c7a8d36e4cfe12fc4c6f2f2d2"
text = "末了一段路，小早系在堺港木桩旁。整顿行装前先喘口气，顺便送份礼。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_5:1:mio_voyage_5_leg2_dock","hint"],null]']
src = "blake3:608ea9d9c0f1653694db037db156c025662a51348806f5574dd0674376e196aa"
text = "天快黑时码头最乱哄哄。还能再扛几包货，顺耳听听这一季的风声。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6a:0:mio_voyage_6a_leg1_deck","hint"],null]']
src = "blake3:65ce99b2c93635bdb975977474bc29b1d2b3e8dddf5f17fc14df352448a80a27"
text = "逆流而上，夹岸皆是竹林，水势较海里稳当。乏了就歇脚、寻人聊几句。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6a:1:mio_voyage_6a_leg2_deck","hint"],null]']
src = "blake3:d961ae73b6177c6817a008331f7c12474d03aa788a9bf938aab30dbc7b211448"
text = "退回河口里下锚躲风。抛稳锚便可歇着，也可趁机把东西送人。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6a:1:mio_voyage_6a_leg2_dock","hint"],null]']
src = "blake3:3ee23e940ede7ade57e4acb104a33769fa2d9293bc1887c3871e6d92d00871c5"
text = "回到下田栈桥头。帮着扛包赚几文钱，顺道听过往船只带来什么话。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6b:0:mio_voyage_6b_leg1_deck","hint"],null]']
src = "blake3:fbb208278f4f3ee79952535793bf55c0a70eeef5cfa14bf71a07ee40499936b0"
text = "小早在河口拿竿子一点点探水，沙脊较上月东移了些。换班空当歇着扯闲话。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6b:1:mio_voyage_6b_leg2_deck","hint"],null]']
src = "blake3:979fbe06440012f7850b0915b01473d0ad0bd9953b983924b5aa57f5bd8353c1"
text = "探明的水道都竖起竹标，小早返至栈桥旁抛锚。得以歇息，也可送些东西。"

[entries.'["upbringing/voyages/mio.toml",["voyage_places","mio_voyage_6b:1:mio_voyage_6b_leg2_dock","hint"],null]']
src = "blake3:ee5ffa21db38bb9dd10329e7f2e1f8f5e78d72dbdd3cf662ed701fdf502388e7"
text = "栈桥边有人候潮上货。过去帮着扛几包，也顺便听一听外面的消息。"
