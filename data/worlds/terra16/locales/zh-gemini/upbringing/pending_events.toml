[entries.'["upbringing/pending_events.toml",["chapters","c10_contest_japanese_placeholder:event","text"],null]']
src = "blake3:c7e5bb845c5d8d6f33261af2e43a39e1bea1207c1ac39352f2c7f3f3cb2ff2d2"
text = "赛前我们在幔幕外候场，我站在第三位，掌心渗汗，只在膝上反复揩擦。对面领头那少年豁了门牙，拿折扇不住敲打手背，敲得人心里直发毛。幕边挤满看客，里头有背着娃娃的妇人，娃娃一啼她便往外挪半步。白眉老判官开场只吩咐了一句：“输了的，不许当场哭。”待到散场天色已暗，赢家输家全挤在幕口寻草鞋，不知谁错套了旁人的，嚷嚷了半晌。"

[entries.'["upbringing/pending_events.toml",["chapters","c10_festival_japanese_placeholder:event","text"],null]']
src = "blake3:020cb70fccdafdf0cc1ae3bfa6904443e028be587c5040ecb21cb2a2b173f1e2"
text = "临出门时，灶下的老婆婆替我把一串铜钱拴在腰间，打了个死结：“只许花一半。”街上行人足足比往常多出两倍，木屐踢踏着一路响到神社鸟居底下。甘酒的甜香漫了半条街，卖饴的老汉拿两根竹签绞扯麦芽糖，直绞到发白才递去给孩子。我捏着钱串在各色摊位间来回踱了三趟，末了只拣一枚土铃，系在袖口上。归途上铃铛响个不停，老婆婆隔了半条街就听见声响，早早立在门前候我。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_classroom_placeholder:event","text"],null]']
src = "blake3:abc9a13d0aa13b4ab7bfeadf6a29048cbf2dd4f200fe11213760cd9d54b1370c"
text = "早课未启，讲读间的火盆仅添了三块炭，宫中连炭火也得省着用。各人的砚台依家格摆开，贴着炭盆的是菖那一方，偏远些的几方，墨面已凝了层薄冰。广桥保子先生入内一瞥，动手将砚台逐一移开，改按今晨进门的先后重新排定。菖低声道这般乱了座次。先生只管把自个儿的手炉朝末座推了过去：“炭不认门第。墨冻住了，假名就写不软。”这天我到得早，砚台紧挨炭火，研出的墨尚带一缕热气。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_dock_placeholder:event","text"],null]']
src = "blake3:4f69fa04f4c64a4e16e0c0cf5937159b59905ae06401df9de159d501b25230a9"
text = "暮色里的鸭川浅得能看清河床卵石，摆渡的老艄公顶着一顶缺边斗笠，蹲在船头嚼炒豆。汐立在岸边凝神望了水色半晌：“上游浑了。北山下过雨，入夜前准涨。”老艄公打趣她：“河道又非大海，哪来的潮。”汐并不争辩，径自把渡船缆绳往高处的木桩挪拴了一档。未及一个时辰，河水已没过第三级石阶。老艄公赤脚去追冲走的木屐，回来也不作声，抓了一把炒豆塞进汐掌心，余下的分了我一半。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_dorm_placeholder:event","text"],null]']
src = "blake3:a2d83673e0cc3fe07efecc67e72d2ffefeba1c247240190513c328d936190216"
text = "夜半转醒，屏风彼端仍透出一线微光。小督趴在文机前修书，灯芯挑得仅有豆粒大小。见我探出头来，她竖起一根指头：“嘘——一合灯油比一升米还金贵，莫教上臈嗅见油烟。”她托我扶稳屏风一角，好将亮光遮严。书信寄与何人，她不提，我亦不问，只闻笔锋在纸面游走得既轻且快。落罢末行，她吹熄油灯，在暗处低声道：“明儿早饭，我那份腌萝卜让给你。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_garden_placeholder:event","text"],null]']
src = "blake3:d43f9f3a034a0a694f8049b83fc72695c38e9848b9464abdce2fa7cc047997a6"
text = "萩花盛放得正零乱时，一只鞠越过矮墙跌进局前小院，打落了好些露珠。门外紧跟着探进鞠千代的脸，涨红直漫到耳根：“对、对不住……”我顺手将鞠掷还，却掷偏了。他不假思索地抬脚兜住，那鞠便在他脚背上一颠一落，他低声默数着，一路数到十二。直到数罢方觉我正瞧着他，鞠登时滚落在地，人也缩回门外去了，独留一句“谢、谢谢”飘入庭中。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_lesson_placeholder:event","text"],null]']
src = "blake3:22cfac4185a9d002b5531fcbe767e477ba24c9fe148ea3bb427fea24848cf118"
text = "散课之后众人俱去，山科言继先生独独唤住我：“来得正巧！随从讨药钱去了，你来替我研墨。”他在讲读间一隅铺开日记，随笔随念：清凉殿屋顶复又漏雨，修缮银钱尚无着落；某家送来鲷鱼一尾。记至此处，他抬眼教我讲讲今日做过何事，需一桩一桩道来。我言及晨起将茶碗磕出一道裂隙，他居然一一记下，末了还顺道替我把了一回脉，道是手凉，入夜宜饮些姜汤。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_library_placeholder:event","text"],null]']
src = "blake3:1715a7c5189bb069a2e0723f7c1f95470db29cefa13570ceb29bdef812bbf76b"
text = "三条西家的书库终年照不进日光，书箱里压着驱虫干草，才掀盖便直呛鼻腔。公条先生举起一册《源氏》迎向窗亮，书页间一个小孔透出光来，竟一连穿破七八页。“虫子也知读书，偏拣《夕颜》这一帖啃。”他全不查校底本，合目念出遭蛀蚀的那几个字，命我写在窄纸条上，逐页粘于孔洞背面。补到第五页时我笔迹写斜了，他眯着眼端详半晌：“斜便斜罢，总比虫子写得强。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_market_placeholder:event","text"],null]']
src = "blake3:b66ccfe713f2bb5b29fe1535e9783188b351e3e6759293ba284d07c61f6b4c17"
text = "室町通的扇铺中，菖将两柄桧扇并列铺开，一根挨一根数着扇骨，足足数了半个时辰。铺主是个指头沾满胡粉的老者，倚着木柱已打了两回盹。菖突然偏过头问我：“你瞧，哪一柄？”她向来不问旁人意见的。我点向左边那把。她凝视良久，付钱买了右首那柄，临出铺门前却顺带把左边那把的价钱也问了，记在怀纸上，折作极小一叠，妥帖收进袖袋。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_roof_placeholder:event","text"],null]']
src = "blake3:1b43edf63ded248ef4cc8df9545c0cb71a653076d783fd6640c242ff73730d65"
text = "九月十三夜，月见台上唯余冷泉雪一人。她在怀纸上题下一句，随即抹去两字，适逢一阵风起，那纸片自栏杆飘落，恰停在我足边。纸面只留“月影浸”三字，余下俱已涂黑。我拾起递还，她接过手，思忖了好片刻方才开口：“……瞧见了？”我答只瞧见三个字。她将怀纸折成细条收入袖中，道了声：“倒还好。”明月当空清照，她耳廓泛红倒映得一清二楚。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_kyoto_court_shrine_placeholder:event","text"],null]']
src = "blake3:da237fb332dda84599b73ffc449f6c47e3a311ebd13242d501829b3e55ddac2c"
text = "守门的老尼单眼蒙了层白翳，却能听脚步声辨出踏入佛堂的是何人。那日我捧着抄毕的经卷进殿，她连头也未抬：“今月的步子比上月轻巧些。只是你踩着门槛了。”她言道，踩门槛无异于踩本尊头顶，须退出重进。我退回廊庑之下，老实重跨了一回。她方才拨动念珠，朝我掌中搁了一枚供过的栗子，道下回再来，她依然听得出分毫。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_annual_exam_1554:event","text"],null]']
src = "blake3:01d5a2fda4ba32cbdcd83b7b085c3b24ce91bd27f011beb3a8c0b225cb14598b"
text = "秋考乃是操小早横渡宫洼濑户。一舟乘四名见习，又四郎立在岬头高处，手执一面旗：旗一落，便是转潮前末了一刻。我踞左舷第二桨，鹰丸居船尾掌橹呼号。行至濑户正中，水势骤然自船底涌起，船头猛地一偏，径直朝鹈岛礁石拐去。“左舷停！右舷死命划！”我将木桨垂直插入水中，震得腕骨生麻。船头一寸寸扳正回来，紧擦着礁石掠过，近得连礁上的海螺都数得清。靠岸之后，鹰丸甩着手腕道：“左舷那记停桨，算你一份。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_annual_exam_1555:event","text"],null]']
src = "blake3:2deb38f2352be7452ec32afcf7a564a9e357d23697dbd78ab3576e92d254b08d"
text = "秋考择在无月之夜。又四郎将所有灯笼尽数收进草棚，只留下一句：“渡过海峡，去对岸松树底下摸一块石头回来。目不能视，便用耳听。”两人共乘一艘小早，鹰丸与我分派在两条船上。海峡中黑得像倒扣的锅，我阖上眼睑，辨出左首水声比右首湍急，便顺势往右压桨。待摸着石头返航时，北面起了风，雨点打在桨叶上噼啪作响。又四郎催我们回通铺歇息，自家却未入屋。翌日至过午他方归来，浑身衣衫湿透，仅言一句：“雨大。”随即在簿子上替我画了个圆圈。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_annual_exam_1556:event","text"],null]']
src = "blake3:a951c488a7875361d2d3dd99f27fb4b93d132224e3855c5fc34b0c8200e6d7b1"
text = "结业考那日，又四郎将我送到鹈岛外头，自个儿摇着小舟离去，独抛下一句：“潮在午时前后折转，你自个儿掂量。”海面横着一条细纹，一侧水色发青，另一侧浊浑，正是两股潮顶在一起的地方。我守候那条细纹缓缓东移，直等它越过礁石影子，方才起橹贴边而行。入港之时，鹰丸同几名新见习俱候在泊位边。我将小船靠稳，甩缆套桩。又四郎自簿子间抬起眼皮，询我何时起橹。我如实报了时辰。他望了望石阶水痕，拈起炭条在簿上录定，末了于旁侧添注二字：带回。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_classroom_placeholder:event","text"],null]']
src = "blake3:14270df4dd168b23f3b282b73fe6837887c2e3fcb7433367aca31beca325b9ae"
text = "梅雨时节，草棚顶漏出一处破口，雨水正滴在悬潮图的木板上。又四郎抛给我一捆茅草：“小鬼，屋漏同船渗一个理，先寻它打哪儿进水。”我攀上棚顶拨开湿草，里头窝着一只海鸥的旧巢，茅草正是教它一根根衔松的。巢内并无鸥卵，我到底未惊动它，只在其周遭填实了一圈。次日授课时，漏水处挪到了又四郎常坐的那块石墩正上方。他取来一只缺口碗接水，半句责骂也无。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_contest_1554:event","text"],null]']
src = "blake3:6a9e53080e977290249dd3df571d7592e0446dfda09d271a73a11b24eceed8aa"
text = "又四郎拟的歌题乃是个“浪”字，题下另附一行小注：寄舟恋，一条久候不至的船。草棚内登时静了下来，几名见习叼着笔管发怔，谁也不曾有过立在岸边盼船的光景。鹰丸头一个交卷，念出来却是：岸上之人点着浪头，数到一千，那船犹在来岛彼端候潮。众人打趣他作恋歌亦不忘算潮时。他卷起歌纸：“船不来，总归有个缘由。”我所作写的是岸畔一级石阶，潮浪打湿一回，日头又晒干一回。又四郎听罢沉吟半晌，末了单评了一句：“湿的那一回，写得贴切。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_contest_1555:event","text"],null]']
src = "blake3:a25549ce9d6f2d5c8f37afa0388b41678b2d5015a500c685f0be28cd844fc695"
text = "岛外恰有艘驶往堺的商船停泊候潮，船上搭着一位云游的连歌师，又四郎便邀他登岸，充作第二回歌合的判者。今次题面为“渡”。老人微阖双目逐首细听，听到我这一篇，颔首复又摇头：“上句颇佳，下句却慢了半拍，船都抵岸方才焦心。”及至听完鹰丸所作，照旧摇头：“下句不俗，上句太迫。”他将两张纸并置案头，拿指节比量一番：“你们俩的，凑起来才是一首。”草棚中有少年吹响口哨。鹰丸一把抓回纸笺，塞入潮表柜最底层。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_contest_1556:event","text"],null]']
src = "blake3:3511cf6b9a674370b2eec7bd85885fa93e5317d9eeab83b1e528032eded26cc9"
text = "末了一回歌合，题目题在草棚柱子之上：归。底端又四郎添了三个歪斜的字：寄舟恋。延请的判者是龙神祠老神主，每张歌笺他皆诵读两遍，待至第二遍方微眯双目。鹰丸那一首咏潮水折转三回，归帆犹未现出岬角，呈交时墨迹未干，袖口竟抹黑了一块。我则写岸上之人每逢日暮便行至空木桩前，解开缆绳，复又系紧。老神主吟毕我那篇，轻咳一声：“解了再系的那位，系得太勤了，待到归船靠岸，木桩怕都磨细了。”棚内笑声四起，我双颊顿时发烫。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_dock_placeholder:event","text"],null]']
src = "blake3:1dc0725bae17fb6a273554fb1df4a7c67783ef84988f023d0edc7d637d4ea394"
text = "退潮竟退得比我料想的还要狠。晨起去到泊位一瞧，我拴的那条小早正被缆绳悬吊着，船头高翘半空，船底搁在烂泥里。鹰丸蹲踞木桩发笑：“新来的，缆绳要给潮留余地。”他用桨柄叩了叩桩上一圈雪白的藤壶：“潮涨至此，你自个儿丈量。”待我动手解缆，他早抽出小刀，在船板我姓名下方刻了一道记号。“这也作数？”“作数。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_dorm_placeholder:event","text"],null]']
src = "blake3:9aa068c71a1348bbcd01cb6fd8afa0d870be272905c573035976c875e8837ad7"
text = "通铺地板之下便是大海。夜半满潮之际，潮水隔板一下下拍打作响，卧在门旁那个爱磨牙的大个子陡然嚎叫一声——原是一只螃蟹自板缝钻出，死死钳住了他脚趾。满屋人摸黑寻觅火镰，那蟹早缩进不知谁的草鞋里去了。靠窗的老见习呵欠连天地道：“它比你们还准时，潮水一满便登门串访。”我将草鞋倒拎着晃了晃，螃蟹啪嗒跌回地板，横爬着又溜进了那道缝隙。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_enrollment_1554:event","text"],null]']
src = "blake3:47eeff702f7dd7e5a67fa79d9be5256a9b672eca7819798babacb9e1f6a97292"
text = "渡船泊在宫洼濑户口耗了小半个时辰，船夫将木橹搁在膝头，言说候潮。对岸的能岛近在咫尺，连岩上松树亦清晰可辨，中间海峡却似沸腾的汤锅，涡流一圈接一圈打旋。蓦地旋涡平息，船夫撑橹一划，三两下便贴岸靠稳。石阶上蹲着个精瘦黝黑的汉子，不急着接我的荐信，开口先问：“方才泊船不前，所候何事？”“候潮。”“等的是哪一刻？”我一时语塞。“平潮。记牢了，小鬼。”他这才接过信函，朝船屋方向扬了扬下巴。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_enrollment_1555:event","text"],null]']
src = "blake3:11dd815d0fb2446d4bb7f4731f056fa094c9c1f07fea13df435c5ae789947c23"
text = "我紧盯岩脚底下的海藻：原先齐齐倾往西面的那一簇，此刻正徐徐立直。“快平潮了。”船夫斜睨我一眼，将木橹自膝上端起。此番是第二回渡海返抵能岛，同舟还乘着两名新来的见习，面色惨青，其中一个搂紧包袱不住朝船舷外探头。石阶上又四郎依旧蹲守着，见我登岸只问一句：“去年误记的那一页，可改过来了？”我自怀中抽出潮簿，那个折角犹存，下方已添录三行新记的潮时。他略一点头，回身去吼那两名新人了。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_enrollment_1556:event","text"],null]']
src = "blake3:48daf5bb044b5ddc1f26a0d4b8675f98324057ba29def9b7e55441213505e9fd"
text = "第三回渡海，行至宫洼濑户口，船夫未将橹担上膝头，反把橹柄交到我手里：“这片水道你走了两年，今日由你定夺几时发船。”满船目光全落在我身上，船舱里两名头年的见习亦探出头来。我并不看海藻，单凭耳听：涡流声响由怒号转作喘息，复化为一下下的轻拍。我发力一撑橹，船头斜切入流，趁着末了那一股回流稳稳擦靠石阶。又四郎照常蹲在原处点算人头，数及我时顿了一顿：“靠歪了半尺。末一年了，小鬼，剩下这半尺，今年替我补齐。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_garden_placeholder:event","text"],null]']
src = "blake3:66e0e31d86b7d6b16ec768c7570b92f469228d21ad4961e0748934a3abd27d73"
text = "晾网院落一角，补网的阿松婆将竹网梭穿引得极快，口中默念“一目、二目”，数至第十便换口气。她递给我一片破网，我打出的网结大小不匀，活像教海浪揉搓过一般。阿松婆眯目瞧了瞧，倒未令我拆线：“鱼又不认字。”那片网次日随渔船出海了。待到傍晚归网，恰有一尾鲷鱼卡在我补的那处歪眼里，鱼尾尚在甩动。阿松婆拎起那鱼，冲我晃了一晃。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_graduation:event","text"],null]']
src = "blake3:67dbf81f1093813e4ff6e00365c7837286fe556aa26173e0ba08b22a86da8f1e"
text = "末了一日，院中渔网尽数悬晾出来，一张紧挨一张，岬头吹来的海风将网眼吹得鼓胀饱满。入夜前须得收齐，众人便立在网阵底下，谁也不肯先离去。我领带的那个小鬼将我传授的缆结打了一遍示我看，系毕眼巴巴候我首肯。又四郎步出草棚，往我掌心塞进一面村上家的过所旗，旗边都已脱了线：“行船出洋，逢着我们的船，先悬此旗，后报名字。谁敢问你索过路钱，便是问我讨。”鹰丸一路只顾收网，拿脊背对着众人。及至收拢末一张，他行上前来，朝我怀中抛来一块木片，表面密密麻麻刻满道痕，每一笔我都认得。“收着，旧账尚未了。待你有了自个儿的坐船，便回这院里，再较量一场。”言罢他掉头去拽渔网，耳根红透至脖颈。我将木片同旗帜裹作一处，朝他背影呼道：“一言为定，就在此地。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_end_1554:event","text"],null]']
src = "blake3:32c71577775a31509beddec9caa5a7cbc68449da1a945cd45a402d860a4cf5ac"
text = "小舟方一靠岸，我便将家中嘱我捎来的一束新稻穗呈至又四郎面前，酬谢他这半载照拂——八朔之日谢人，乃是岸上的礼数。他捻住稻穗掂了掂分量：“岛上不种稻，这物事教谁吃去？”转脸却将它悬在了岩间龙神祠门首，稻穗低垂，正对着海面。另行裹好的一小份炒芝麻，我塞进了鹰丸手里。他口里咕哝“岸上的物事”，手早揣入怀中去了。夜深通铺吹熄灯火，黑暗中忽闻谁人咀嚼得咯吱乱响。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_end_1555:event","text"],null]']
src = "blake3:65872c6038381f4ddd76af43e3e7a02f6248fb361cd414d6c56d5c5d0346b0a5"
text = "八朔此日重返能岛，岛中正兴互赠节礼。我拎着家里备好的一包干柿跃上岸头，鹰丸早已候在泊位旁，手提一尾稻草捆扎的腌鲷，鱼体覆着白花花的盐霜，径直朝我怀里一塞：“八朔贺礼。去年你那份我不曾回礼，权记账上，今天两清。”鱼尾尚沥着盐水，沾了我一袖。又四郎自草棚探出半个身子，打量那条大鱼：“哟，这般肥硕一尾，你阿娘可晓得？”鹰丸不作答，拧身去拴船，后颈晒褪了一层皮。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_end_1556:event","text"],null]']
src = "blake3:cff1d3dd0079145e48ad2fb99c2807903f8a505908cd0896947b3834520fde7f"
text = "八朔这日返岛，船身尚未停稳，我便抄起了缆绳。初年学抛缆时，绳头抛了三回尽数坠入水里，教鹰丸取笑了整整一夏。这番我腕间发力一抖，绳环于半空撑开，不偏不倚套牢泊位木桩，随即顺势一收，舟身便贴靠岸边。岸上数名头年的见习齐声“哇”地惊呼。鹰丸衔着一根野草自桩畔起身，审视一番绳结，抬脚轻踹了踹：“岸上的，今岁八朔节礼莫送了，这一抛，抵了。”又四郎倚在草棚门边轻哼一声，权当夸过了。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_start_1554:event","text"],null]']
src = "blake3:1f46c6c4a6b75ecf9a91c6856a422fdc0f2b71479ea00c58ed99ab3f321db44e"
text = "泊位边塞满了候潮的人群。盂兰盆长假将至，见习们各自回村跳踊，一条船挤载七八人，吃水压得船舷离海仅余一巴掌高。又四郎逐个敲脑门清点人数：“八朔当日归队。迟到一日，先代众人挨个解一遍缆。”枯候潮水之余，不知谁挑头攀比哪村的踊更好看，一名因岛来的少年当即在舱板上舞将起来，掌一击，脚一跺，整条船随之摇晃。我亦被推搡上前，偏只会本乡那一小段，旋了两圈，左右脚便拌在一处。一船人笑作一团，恰逢平潮也至。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_start_1555:event","text"],null]']
src = "blake3:01a09273367f2ae0096169c0a9c87486abe0c6f8152356a10f62b08cc34d5f96"
text = "盂兰盆长假临近，今岁我可学乖了。去岁回村，跳踊直跳至后半夜，草鞋底尽数磨穿，我赤足舞到天明，回岛时脚心尚带着血痂。启程前一日，我从靠岸的鱼贩小舟上多购了两双草鞋，用麻绳串起悬于包袱外侧。鹰丸见了嗤笑：“是回村跳踊，还是出外行脚？”又四郎倒伸手捏了捏鞋底厚度，自船屋寻出一卷旧帆布条，教我绑在鞋后跟：“跳到天亮，磨的是这里。”天色初现微光，渡船即须趁平潮解缆，我将那两双草鞋往包袱上复又勒紧了一道。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_holiday_start_1556:event","text"],null]']
src = "blake3:49e4ee70584a6cceebae3fddf3b6199e6394b191fb241060931c40acf040578c"
text = "休假前夜，岛上人在海滩点起送火，送的是这些年折在急流里没能回来的人。麻秆成束插在沙地上，海风压着火苗贴着地面窜。明早我便乘船归乡，在能岛看这把火，这是末一回了。众人渐渐散去，鹰丸也叫他娘唤回了家，滩头只剩我与又四郎。他蹲在最临水的那束火旁，拿根树枝拨弄余烬，始终不发一言。末了一点火星在沙上泛红一闪，灭了。他起身拍去膝上的沙土：“走吧。明天的船，莫误了。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_lesson_placeholder:event","text"],null]']
src = "blake3:5db339f732b29fd858f02866d3407fef1d64ec3eadf95d1ddcac7b32f101b979"
text = "散了课，众人凑在草棚外的石块上嚼饭团。我手里那只包了颗梅干，还是从家里捎来的末一颗。鹰丸斜眼瞥见，把自己的饭团往我掌心一塞：“换。梅干酸倒牙，你吃了又得苦着脸过半天。”他那只只擦了粗盐，咸得直发苦。他三口两口吞下我的饭团，吐出梅核，指头一弹，飞进海里老远。又四郎在背后出声了：“朝海里乱吐东西，水底那位可是要记账的。”鹰丸抬起的手悬在半空，寻思片刻，冲着海面合掌拜了拜：“就这么一颗核，记轻些吧。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_library_placeholder:event","text"],null]']
src = "blake3:59585a5a96f0871b938093feaca9a67e3bbe179e375bc4134b82fab851403573"
text = "盛潮表的木柜里满是樟脑味，一年分装一个抽屉。末底那格受了潮气，发胀卡死，我拿一枚船钉慢慢撬开，里头是一叠纸边泛黄的旧潮表，年号仍写着大永。翻至六月那页，夹了朵压扁的浜木绵，雪白的花瓣早已褪作茶色，印痕不偏不倚遮住了一个潮时。我俯身凑近细辨，方才认出底下所记的数，较之今年的表竟差了半刻。推回抽屉前，我依原样把干花夹妥，那一页动也不敢动。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_market_placeholder:event","text"],null]']
src = "blake3:c2cb0c1f5575e644d7c27ab93b1b29ffed6a2896a5f7084160a01b36b300e957"
text = "卖鱼的小船才刚泊岸，立在船头的大婶便放开喉咙叫卖，嗓音尖过岬头的海鸥。我数出几文钱想买那尾小鲷，她把铜钱逐枚捻起来迎着日光细瞧，验到第三枚，咂了下嘴：“缺了角的私铸钱，不收。”我袋里已空无他钱。她将小鲷抛回木桶，转手从舱底摸出两条巴掌长短的虾虎鱼，草绳一穿，套上我腕子。那枚缺角的钱也随之弹回我这儿：“留着抛与龙神吧，神不挑。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_midterm_1554:event","text"],null]']
src = "blake3:e0860ef4b2ae2f9128fc1315e9715894c3b689546b223fe3d093957af44d0011"
text = "春考就在岬头的了望岩上摆开。又四郎扬起下巴朝海面一点：“那座岛。”“鹈岛。”“后头那座。”“伯方。”晨雾未消，远些的岛影叠作一团淡灰，辨到第五座，我便有些拿不准了。他不追问，改指脚下：“底下这股水流朝哪边去？”水面波澜不兴，看不出半分动静。我死盯着瞧了半晌，才见一截浮木慢悠悠横过身来，打了个旋儿，径直往东漂去。“东边。”“几时改流？”“等它再打个旋儿。”他轻哼一声，提刀在木牌上划了道印子，也不点破是对是错。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_midterm_1555:event","text"],null]']
src = "blake3:eab0bdcfd295c108794d0abf338d12712a897fcfd53194a2df01ad503bfa9b79"
text = "草棚泥地上划着“十九夜”三字。又四郎命大伙儿推算这一日宫洼濑户何时涨满潮。隔一夜潮迟小半个时辰，这口诀人人倒背如流，可从朔日逐日算至十九，十名见习竟算出了六种时辰。我取根草绳，一夜系一个结，一结往后推一格，算到末了，恰好落在巳时末。鹰丸算的是午时初，得意地冲我挑了下眉。又四郎一言不发，只带众人到泊位旁坐等。潮水漫过最高那级石阶时，日头正悬在巳午交替处。鹰丸回了船屋，默默在船板上刻了半道。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_midterm_1556:event","text"],null]']
src = "blake3:06b9cb8caa07a8f37b727da8ab190ab750432f11c4d5b4b9f948ed49d844d7cb"
text = "春考之时，单人单驾一条小早，不准配桨手，仅用一支橹。又四郎坐在岸边，背朝海峡闭目听着：“谁家橹声散了，我耳朵里听得清。”潮信方转，海面冒出连串小漩涡。我拿腰抵住橹柄，一推一拉间，船首总向礁石那头歪去，便借着水涡旋来的势头硬扳回来。对岸石上，鹰丸早已立定，抱臂等着，腰间小刀也已出鞘。待我的船头磕上石阶，他思忖片刻，在自己名下添了一道刻痕：“你比我去年快。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_patron_1554:event","text"],null]']
src = "blake3:c675585f95fa427058c814db8232ff1f7165f777e2e5ee578bc4dd00817c30d3"
text = "又四郎打后山伐了一竿青竹，立在小早泊位旁。岛上逢七夕，竹梢不挂诗笺，改系小旗：每人一面，巴掌大小的旧帆布，各自添上印记，祈愿岁内出海平安不覆。我向灶下阿婆讨了针线，四边缝得歪斜不说，画小船时还把桨画多了一支。鹰丸那面旗上未画船只，单用炭条涂了一溜短道。“画的什么？”“今年胜过的场次。”海风自濑户那头吹来，一树小旗猎猎作响，我那面随风一卷，恰恰覆住了他那排短杠。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_patron_1555:event","text"],null]']
src = "blake3:d3adcbf6e68452445a11a4fe5e1b7187d0d38dd32339e54bda8ba50040be3fd3"
text = "入暮时分，一众见习挤上岬头的了望岩，争看谁头一个找着织女星。天色尚泛青灰，西天低空率先冒出一颗泛红的星子，新入学的孩子雀跃大喊：“织女！”又四郎连头也不抬：“织女星发白，也不至于贴地那么低。”众人慌忙转向东边搜寻。我记起开春辨星那会儿他提过，七夕前后，天一黑织女便悬在正顶，于是仰首望去：穹顶正中一点素白微光，细若针孔。我指尖才抬过去，鹰丸也恰好抬手，两根指头险些撞在一处。他连忙缩回手，嘴硬说是他先瞧见的，一双眼睛却始终望着海面不敢转过来。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_patron_1556:event","text"],null]']
src = "blake3:693fcbd9bbc0d69db02fa6d628233c3970960b2609d89f4d084223c15ffb9c52"
text = "七夕这夜，泊位旁又竖起一竿青竹，枝桠间挂的仍旧是祈求一年行船无恙的小旗，一人一面。前两年，高处几枝总由老见习踏着木箱上去系，这回又四郎却将整捆旗子塞到我怀里：“你去系。结若松了，翻了船唯你是问。”我踏上鹰丸垫好的木箱，逐面系上水手结，抽紧后又狠扯两下试稳。底下几个新来的昂着脑袋帮着数：十一、十二……最末一面正是我自己的，旧帆布浆洗得泛白，上头那条小船仍是多画了一支桨。鹰丸在下方扶紧木箱小声嘟囔：“手艺倒练稳当了。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_roof_placeholder:event","text"],null]']
src = "blake3:57c02a47df4d2d3ed849aef8fc86553e0abaf64c1882e50a47c1341ca6eeafca"
text = "了望岩上风势劲急，值守的老水夫披裹蓑衣打着盹，法螺贝横在膝头。我代他望海，忽见伯方岛那方显出一角白帆，桅上光秃秃的，全无旗号。我伸手推醒老人，他眯缝着眼望了许久，方才举起法螺贝贴到唇边，呜——下方泊位里的小早随即一艘接一艘篙撑出海。来船在急流口降下半面风帆，缓缓歇住船势。待黄昏它重又绕过岬头时，桅梢已添了一面村上家的旗帜，叫海风绷得啪啪直响。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_shrine_placeholder:event","text"],null]']
src = "blake3:d9d8bd8ff544493a9a18db432da3d2a585413fbc6450da2581791abf9ff5d186"
text = "龙神祠嵌在两块巨岩缝隙间，窄小的供台仅容得下一只素土酒杯。大潮那日，海潮直漫至台基底下，看守庙宇洒扫的阿兼婆倚着竹帚立在高岩上，瞧潮浪一下接一下舔舐台脚。我正欲上前将土杯移高几寸，却叫她举起竹帚挡住：“莫碰，龙神自己来取。”土杯摇晃两下，果真被迎面一浪卷入水中，杯中清酒顿时在水面漾开一抹浮光。阿兼婆这才打怀里另摸出一只新杯，注满酒摆回台面，口中低声祷念几句，末了一句清晰落入耳中：“这一季出海的船，也劳神君看顾。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_term_start_1554:event","text"],null]']
src = "blake3:c11774436910362fc33304034e5772e84b133466cab29cd93c828ef05e23797b"
text = "开课首日，小早依旧朝天扣在船坞木墩上，经了一冬日晒，船板缝隙裂得能嵌进指甲。又四郎领着众人不入草棚，只打发大家钻进船腹底下，曲起指节叩击木板。“声音闷的，烂了。清脆的，尚能用。”我叩至第三块，耳力仍辨不出高下。身侧的鹰丸已敲过半面船底，握炭条在腐板上圈了七个印子，偏头瞧我：“你这头竟连个圈也寻不着？”又四郎俯身蹲落，朝我刚敲过的那块木板一叩，咚的一声，沉闷发钝。他并未呵斥，只顺手将炭条塞回我掌心。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_term_start_1555:event","text"],null]']
src = "blake3:22e8fc22dd6dc8571edd628abb55a6837ec5b5e6fae25366723aad13d36326d4"
text = "草棚地面横卧一束新制的樫木船桨，木屑刨花气犹自清新。又四郎逐个分派一支：“旧桨劈去引火。新桨各自上手修整，刨到趁手才算完。”我抓起一试，桨柄比先前的粗壮整整一圈，五指合不拢。忙活了半日，掌心磨出两颗水泡，柄身总算瘦下些许。鹰丸早已完工，桨叶上亦刻好了自家印记，探头看我手里那支：“削得这样细，过急潮非折了不可。”他径自拿过我的推刨，独独在桨柄中段留出约一指宽未曾削动：“握这处便是，切莫再刨了。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_term_start_1556:event","text"],null]']
src = "blake3:ca40a3f84d68f9e079a3bcae5aedbe75d1006220287930ee621c0bf63ab9b69f"
text = "开课第一天，又四郎领来个新生推至我面前，人只及我肩高，脚蹬一双新编的草鞋：“归你了。教不出来，唯你是问。”这小鬼初来便误了时辰，依规矩得替全班解开缆绳。满棚绳索结法杂乱，他拆到第三条眼圈便泛了红。我俯蹲身侧，未曾代劳，单将他指头按去绳端：“寻着压在最底的那一股，往外一抽。”他照办试抽，绳结应声松脱。棚内又四郎正讲授急潮，语速着意放得极慢。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_year_close_1554:event","text"],null]']
src = "blake3:064145bac1c5987fe58a2eb773e52f0fa63e3fe242a90c28660629167d9ac665"
text = "晒网小院里架起一张挨一张的渔网，日光透过网孔筛落地面，铺开满地细碎方格。时近岁暮收簿，众人一边修补网眼，一边挨次呈上全年的潮汐簿。又四郎端坐木柜前逐本查验。翻进我那册，他指头停在一张浸过海水发皱的纸页：乃是秋考前夜所记，潮时错出半刻，事后才用炭笔涂改过。他沾了点唾沫，将那页纸折了个角，归入顶格抽屉。“明春头一课，单讲这一页。”我指尖一颤，手里的竹梭直直戳进了网眼中。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_year_close_1555:event","text"],null]']
src = "blake3:ce27b3e6ad9a3d1daade5d3ccf12bea35c167bb73b76dd088d116413d3bccbf4"
text = "岁暮这日免了课业，全班簇拥着一条拖上滩头的旧小早忙活。船底板缝宽得能容指头，又四郎教众人将槙树皮捶打出的木絮嵌进去，再抡木槌逐下砸实：“直到槌头能往回弹，才算填足了分寸。”鹰丸蹲在一旁清点船钉，数一枚便骂一声锈蚀。我起下船梢一块腐板，见板面横着两道斜斜歪歪的刻痕，倒像是幼童握刀随手划下的。又四郎探手接过木板，拿拇指腹在划痕上摩挲片刻，又给摆回原位：“这块不换。修别处去。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_academy_noshima_boat_school_year_close_1556:event","text"],null]']
src = "blake3:87e220a0fb2e8eff753b5f9de825c228545e2fd46ad670aec59f994f55ab1b82"
text = "岁暮清簿，装潮表的木柜逐格腾空，陈年潮图铺了满草棚地面。依社中定例，但凡辨岔的潮线皆须朱笔勾出，旁侧注下看错之人的姓名。鹰丸拣出一张旧图，边角那道红线恰是我两载前看走眼的一处。他提笔濡饱朱墨，在旁一笔一画落上我的名字，端正得胜过他写自家名姓之时。“这般一来，往后新来的小鬼便晓得此地极易失算。”落笔罢，他折叠图纸塞进末底那层木格，又压上一枚石块：“你犯的错，权且留给这座岛了。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_kyoto_court_letters_placeholder:event","text"],null]']
src = "blake3:07a86a12a7607b3ead6abad2d0edb44ca0b26b7191ac64e1f431235c8e01508a"
text = "歌社较艺，菖嫌笔迹太好认，品评时难免有失公允，主张此番一概改用左手书写。一屋子人扭着手腕落笔，鞠千代才写罢一字便搁笔拭汗，袖口溅得墨迹斑斑。倒是小督以左手写出，字架依然清秀雅致，引得菖频频侧目。收拢歌笺逐首吟诵，拔得头筹那首字迹最为歪丑，询及作者却无一人答腔。我却一眼认出那纸笔路：满场之中，独独某人写“の”字时，末笔总爱盘成系缆结般的圆圈。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_kyoto_court_practice_placeholder:event","text"],null]']
src = "blake3:9f8cae5509190a0632b70b765b3dcb255f6b85a389cd5c16e5545b4761faba0d"
text = "这趟携器物前来的是鞠千代。他怀抱一只盛贝的贝桶，桶底接榫处崩开了一道缝，一张脸涨得比桶身朱漆还要通红：“踢、踢鞠那会儿……碰、碰裂的。”小督煮好一碗米糊，边往缝隙里填抹，边肉痛嘀咕：“单这一碗米，够我家煮两顿稀粥了。”菖在旁嫌她抹得凹凸不平，拈了根竹片细细刮匀。米糊须得晾上大半日方干，其间接缝少不得有人压住。鞠千代自告奋勇担下这差事，按着按着便倚在桶沿合眼打起瞌睡，十指却半点未曾松懈。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_kyoto_court_song_placeholder:event","text"],null]']
src = "blake3:3f41fd5509143d444b612e4c7f43c9e08503b384464ccc7be484ef24597e9ffa"
text = "这一回数汐最为缄默。挨到她点曲时，她缄口半晌，末了才道：“单会船上唱的。”她开口哼的是濑户内海摇橹调，曲声粗犷，文辞亦俚俗，掌心却随节拍叩击板廊，一推一挽，俨然行桨之势。冷泉雪率先应和，指尖轻轻叩节；菖虽蹙紧眉头，手指亦暗自于膝头打起拍子。待唱至第三叠，连邻室局里的侍女也忍不住探头扒着竹帘偷觑。待散席时，我双掌已拍得通红，耳畔仍余那节拍回响不绝。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_noshima_boat_school_letters_placeholder:event","text"],null]']
src = "blake3:4ddf5511e6f7438b66e6fb03ecac98792ed7f9f3d7eb1c10ba701f6ba0b8f7f1"
text = "月末斗歌，品评之人竟换作了又四郎。他假名认不全，便嘱众人逐首诵与他听，自个儿合眼静听，那神态活脱脱立在船首辨水声一般。鹰丸那首吟罢，他微微颔首：“利落，宛如落潮。”及至轮到我，许是念急了，第三句上气息险些岔断。又四郎目不曾睁：“第三句呛水了。重来。”我只得重诵一遍，刻意放缓语速，在该处匀稳换了口气。他既不赞好，亦不挑刺，仅抬臂虚挥一下，宛若放行一条船驶出潮口。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_noshima_boat_school_practice_placeholder:event","text"],null]']
src = "blake3:2b7a54170de5ef2388c9180d1586a2384e728d9538aed769d322ff94e3ca2f8d"
text = "潮滩湿沙间犹冒着细泡，我一铲下去掘出只拳头般大小的文蛤，两扇贝壳紧闭，分明尚活。如此硕大的一对，持去配贝教旁人怎生比得过。鹰丸凑近打量一眼，顺手打我掌中取走：“活物不作数。规矩是捡，不是抓。”他在泥沙上摁出个浅洼，将文蛤搁回其间。两人蹲守着瞧，只见那蛤缓缓伸出一截白舌似的肉足，一耸一耸钻回沙底。此时潮水已漫过脚面，远端有人吆喝收贝。鹰丸直起身，顺脚在沙面踏下一道印记。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_club_noshima_boat_school_song_placeholder:event","text"],null]']
src = "blake3:629d1a51454a2fe546f67fb840989a94c9f2f943869827495de0978829312a07"
text = "阴雨连绵，行商货船未能泊岸，大伙只得蜷在船屋里操练。先前讨得的那包香木尚余碎块一枚，众人谁也断不准可算沉香。鹰丸道名既带个沉字，投入水中立见分晓，说着汲了桶海水径直丢了进去。谁料那碎木不浮也不沉，单悬在半桶水间缓缓打旋。一屋子人面面相觑，偏谁也不甘先开腔服软。终究是我先起了舟歌头一句，鹰丸怔了半拍，旋即续唱次句，敞开嗓门一吼，直把屋檐外的雨声也压了下去。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_family_graduation_mio:event","text"],null]']
src = "blake3:1ddd8af5e0519d3156a2e028af7baa02908bcf62c5a0e0d310460ae311d59da2"
text = "返抵下田时，已入正月。河口诸船皆插上了松枝，我那条小早系在栈桥最外端，艏部摆着一小块镜饼，乃汐趁天未亮便供上去的，言道船灵亦须过年。母亲在房内将行船账簿复检了一遍：大米三俵，海盐两俵，十八名水夫的姓名一页录不尽，直写进次页。她执朱笔于首页底端补上一行“正月朔日起”，搁笔回架，指尖拨过一粒念珠。阿濑蹲在门槛边叠那面过所旗，刚折作四叠，嫌边角未齐，摊开复叠。兼定早我数日归返中村，遣人捎来一纸字迹，“海上安稳”四字写得方正妥帖，唯独落款微洇了些许墨渍。宫中那柄见习扇已被我纳入登船衣箱，怀间只贴身藏了桧扇。汐在栈桥那头高呼潮汛将转，阿濑连头也不抬：“随它转去。镜饼尚供在船头，今日任谁也休想解缆。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_cave_placeholder:event","text"],null]']
src = "blake3:894af615ce25023cc6492188dbb6e3424db57d77fb48af51c770590200b5b848"
text = "洞口方圆一丈内，暑热陡然消散，凉森森教人臂上冒出鸡皮疙瘩。一名酒屋小伙计正将两坛酒瓮塞入石罅，自个儿拿草鞋垫头酣睡，前额压出几道席纹。我走近的足音惊醒了他，他翻身蹿起，先探手护住酒瓮，再望向我：“千万别告诉柳屋的掌柜，他当我还赶在道上呢。”他解释盛夏酒水经晒便酸，藏在此处寒气里头，三日亦不走味，掌柜蒙在鼓里，他却门儿清。临了，他拔出其中一瓮的木塞凑我鼻前嗅过，又急忙按回，塞得斜斜歪歪。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_herbs_placeholder:event","text"],null]']
src = "blake3:9c617fa3d7c697d262f53171e28b0a91b83a68266e187a222fd8e5718bb55f2f"
text = "药圃篱笆破了个缺口，一只花母鸡趁隙钻入，正埋头在紫苏田垄里乱刨泥土。撵鸡的小沙弥赤着双足，僧袍衣摆塞进腰带，跑一步溜一滑。我打反方向绕前拦堵，那鸡扑腾双翅直撞入我怀中，狠啄了我手背一下。小沙弥呼哧带喘抱过鸡去，临转身摘了一枝薄荷塞入我手：“捻碎了抹上，不会肿。”我依言揉碎敷好，手背顿觉一片清凉，那只鸡犹在他臂弯里咕咕絮聒不休。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_market_placeholder:event","text"],null]']
src = "blake3:ab00ec79ad86415315fb729b5d8f608662ab3ddb1ca69b59feee14cfa81e5876"
text = "两处书摊之间让出一片空地，一名熊野比丘尼将画轴悬于竹竿，借着隔壁摊位灯光，持细竹签指点画中地狱逐处开讲。述至赛之河原那段，图中幼童正逐块堆砌石塔，青鬼舞动铁棒前来推搡，听讲的孩子们吓得缩作一团。有个梳着振分发的女童扯住阿娘衣袖，定要追问岸旁那位执锡杖的僧人是谁。比丘尼手中竹签停在画上：“那是地藏。石堆推垮多少遭，他都来接。”女童闻言方才松手。我挤在后排观望，袖边叫书摊上的灯油蹭乌了一块。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_path_placeholder:event","text"],null]']
src = "blake3:b17811b0e22887c076b32753103a15f704130a8030352ab350f1da260c34a5f0"
text = "绕过北山参道一道山角，一伙野猴正踞在路旁石垣之上。我才刚歇步，其中一只半大的便纵身跃下，一把夺过我头顶斗笠扣在自个儿脑袋上，偏生还戴得歪斜。后头走上来位负薪的樵夫，腰畔悬着砍柴刀，见状丝毫不怒，反打怀里掏出枚栗子朝石垣抛去。那猴即刻弃笠逐栗。樵夫拾起斗笠掸落浮尘，重新替我戴稳：“这群畜生与我面熟，一颗栗子过一回路。”"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_relic_placeholder:event","text"],null]']
src = "blake3:64297bd4d30393ebe37d6a44cdb40f9f2ed36066c19cb60cee1197e11ed1c352"
text = "旧庭院石阶上铺晒着成片布匹，深靛与浅葱相间，逐级垂铺而下，远瞧真似一道水往下淌。我正欲迈步上去，下方忽有人出声拦阻：“莫踩！”原是邻家染坊的女子，十指已蓝得发黑。她言说那烧剩的石块极吸日暖，晾干布匹比搭竹竿快出整倍。及至斜阳西垂，她抛予我一端布角，两人隔开数级石阶一抖再一折，布间粉尘扑面扬起，裹着一股淡淡的蓼草酸气。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_academy_shore_placeholder:event","text"],null]']
src = "blake3:1c56102e28e28a9e70a8bad3d08031186b9829573ce9795908c3c47776ebfe7d"
text = "浅滩上头，卖心太的老头将木桶半浸在河水里镇着，桶侧拴了根草绳，省得叫水流冲跑。我叫了一碗，他抄起木筒一推，透亮的心太一条条溜进碗中，淋上一勺醋，点一点芥子。我蹲在石头上吃，一只红蜻蜓停到碗沿，翅上还缀着水珠。老头拍拍木桶说：“鸭川的水，比井水凉三分。”我连碗底剩的醋也喝了个精光。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_cave_placeholder:event","text"],null]']
src = "blake3:f061d26eb64ee46f7a8fa32d90db06bf1190a28cde420d1034cadde42307fb2b"
text = "石洞口旁的礁石边，有个海女刚冒出水面，牙缝里挤出一股气，吹出好长好细的一声哨。浦里人都唤她阿凪，额间绑的白布上绘着个五角记号，说是避海里的东西用的。她在背风处拢起一小堆火，焙着冻成青紫的手，瞧见我目光落在洞口上，便搭话道：“往年那洞口极好摸龙虾，眼下龙虾都另寻去处了。”她用两根树枝从火里夹出个烤得张了口的海螺，搁在我眼前的石块上，烫得我两只手轮着倒腾。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_herbs_placeholder:event","text"],null]']
src = "blake3:4a40a41b013b1e3c51c91445e9ed1bc4d2ee3bfddf4f8ba83175d69c6f13da31"
text = "刚落过雨的潮边松林，松针铺叠得又松又厚。一位背着竹耙的老婆婆正在林中搂松针，要带回去烧火。她叫阿留，驼着背好似老松根，眼神却利，耙齿往沙土里一扒拉，滚出颗圆滚滚的白东西。“松露，雨后两天才长，迟了就老了。”她教我看沙面上那一丁点儿微凸的印子，我摸索了好一阵才抠出一颗，她早攒了半兜。临走前，她拿松针把我那颗也裹好了，塞进我手里。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_market_placeholder:event","text"],null]']
src = "blake3:c65148400715cfe751fd82afb316f4a44f27c7b9d9c5e717f29b94dc6a6536a9"
text = "渡口的夜摊挑着松明，烤鱿鱼的焦香一缕缕飘散过来。摊尾坐着位盲眼琵琶法师，随行的小童正替他捧碗。他弹的是《平家》里头坛之浦那一节，唱至幼帝被人抱着沉海，摊前好几个人都停下了筷子。一名醉酒的船夫往碗中丢下一枚永乐钱，嚷嚷着太晦气，吵着要听热闹的。法师没换曲目，只把琴弦拨轻了几分，仍旧接着往下唱。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_path_placeholder:event","text"],null]']
src = "blake3:d2b091ae424226066e4299406916270673a565823dcaa1766e8cf7da69a23887"
text = "上山寺的山道行至半途，雷雨说下就下。我奔到山门屋檐下避雨，那里先蹲了一位顶柴捆的妇人，正拧着头巾上的雨水，嘴里还嚼着杨梅。“打个赌吧，”她说道，“寺中晚钟撞到第三下，雨就歇。”钟声响起来，一下，接着两下，雨丝果真稀疏了；第三下的余响尚在山谷里荡着，日头便已从云缝间透了出来。她甩落手上的杨梅汁：“我赢啦。下回若在山门底下碰上，替我顶一段柴。”说罢顶上柴捆就走，一路将杨梅核吐在石阶上。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_relic_placeholder:event","text"],null]']
src = "blake3:69a42446b58d8c751e512ce57d26eaec8aed858b07857dfc94f41e5bab8970fd"
text = "岬角上风刮得紧，我刚挨着烽台石基落座，揭开竹皮包着的饭团，一只鸢便斜刺里俯冲下来，爪尖一掠，饭团已不见影，手心只剩下零星几粒米。旁边割茅草的老汉弥平笑得腰都直不起来，他左手只留着三根指头，攥镰刀却极稳当。“岬上的鸢只认饭团，哪认什么人。”他说自己年轻时也吃过这亏，连遭抢了三趟才学会背过风去吃。边说边从腰间袋子里摸出两只干柿，朝我抛了一个过来。"

[entries.'["upbringing/pending_events.toml",["chapters","c9_outing_japanese_home_shore_placeholder:event","text"],null]']
src = "blake3:751ace762a49ce88b28c8c9789893ad83bc1063a551996e0dbf507445abb9564"
text = "“船蛆顶怵火。”船匠源六将一条渔船扣翻过来搁上木墩，擎着松明一寸一寸地烤船底，沙滩上浮起呛人的白烟。按他说，烤过这一遭，船木便能多用一年。他口里叼了根草茎，叫浓烟呛得眼泪直淌也不挪窝。瞧见我站在旁边干看，他把另一支松明塞了过来：“稳住了别抖，烤焦了可算你的。”我举得手臂酸沉，他凑身上前闻了闻那片船板，鼻端嗯了一声，吐掉熏黑的草茎，另换一根新的衔住。"

