[entries.'["upbringing/common_events.toml",["chapters","c8_school_club_ayame_kogo:event","text"],null]']
src = "blake3:e2e54cd9abc0242111c2c485460806a77211f14c341733ffacaf79cc1742eb06"
text = "闻香会开场前，菖依着香谱的次序把香材逐包码齐，连纸包的折角也对齐了边。小督偏凭自己闻过的去处来记：这一味曾在哪位女房的袖上嗅过，那一味是寺里正月焚的。菖说这等记法不入流。临到比试，菖闻岔了一味，小督在案下用指尖悄悄写了个字。菖只当没瞧见，答对了，会散后塞给小督一小包好香，只说是多出来的。"

[entries.'["upbringing/common_events.toml",["chapters","c8_school_club_ushio_reizei_yuki:event","text"],null]']
src = "blake3:633e5b3cb907b80d99610c56f7b2e74a0a257c152db3cc1af94d8aa8b4e4e865"
text = "汐替歌会抄清稿，落笔错了一个假名，雪拿朱笔圈出好大一个圈。汐望了雪的歌一眼，说她写的那片浦口，潮水一落便满是礁石，真有船驶进去非搁浅不可。雪当场没作声。次日她的歌改了一个字；汐的誊稿上也不再见红圈，错处只留一道指甲摁下的浅痕，不凑到跟前看不出来。"

[entries.'["upbringing/common_events.toml",["chapters","c8_school_contest_ushio_reizei_yuki:event","text"],null]']
src = "blake3:ff630611812f38f4e343ec2c7915fef6df25accaf68d8200bb15f439cfe5fce4"
text = "玩贝覆那日，两人被分在同一边。雪认的是壳内所画《源氏》哪一帖，汐看的却是贝壳合缝处的纹路，说这跟辨船板原是一理。轮到最后一对，两扇壳里画的是同一帖，汐偏说纹路搭不上。雪不听劝，翻开来一瞧，果真配不成对，这一边输了半局。散局后雪怨她合该早些言语。汐道：“我说了三遍，你是一遍也没听。”"

[entries.'["upbringing/common_events.toml",["chapters","c8_school_festival_ushio_reizei_yuki:event","text"],null]']
src = "blake3:0a7b5fdd5f574ee94b9413982f765a31c7277623fcb100989218099f370df1d4"
text = "嘉祥这一日，点心依着家格分发。汐立在侍女那一列，轮到她时盒底仅剩几块碎点心。雪从自己那份里拣出最端正的一块，搁上汐的托盘边，说是素来不爱豆馅。汐却记得分明，前日雪一连吃了三个。她道过谢，顺手把那几块碎的推过去：“这几块也是豆馅。”雪朝她瞪了一眼，拈起一块，吃了。"

[entries.'["upbringing/common_events.toml",["chapters","c8_school_walk_ushio_reizei_yuki:event","text"],null]']
src = "blake3:5169b1a9f9017d0f884d6661dc459c317b5d56cb41c12f5a563b01deda874980"
text = "天色暗得早，雪要回冷泉家，听说下京一带有散兵抢掠。汐说自己也凑巧往那边去认认路。雪道你连东南西北都得问旁人，认什么路。汐不搭话，一路总走在靠街的那一边，袖筒里始终攥着件东西。直到门前，雪才看明白那是一柄短刀，刀柄上缠着的绳索打着船上的结。"
