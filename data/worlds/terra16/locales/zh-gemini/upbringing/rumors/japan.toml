[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_ase_sakai_fans_supply","text"],null]']
src = "blake3:8638da88ce39a886043c1648a84fc17969aff664112340480103a9ec30b87836"
text = "阿濑对着个堺船头骂道：堺里扇子多得无人要，竟拿扇子来抵帆别钱。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_ase_shimizu_pirates","text"],null]']
src = "blake3:7f5fd1c944f22df9209609e17fe717c7fb8a2d78b646a35c5ea1a562485ea636"
text = "阿濑道，野分一过去，足摺外海就总有不挂旗号的船出来捞翻船的货。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_atsuta_cloth_supply","text"],null]']
src = "blake3:ba12da0f803f40605ff762fefab0898748e8bdf0662bbf8cedfc121ecd60f449"
text = "打尾张上京的商贾说，热田棉布织得极多，织户正压着价往外卖。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_chidori_shimizu_fish_supply","text"],null]']
src = "blake3:6d02c464b2cf2377592be4bf390f35d8f5bb512d10ab92b6d78f6676d4e04f61"
text = "千鸟讲，清水那儿网网都起得满，海滩上晒的鱼干却无人来收。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_funai_books_demand","text"],null]']
src = "blake3:8c9528091c231b9144e099fa3ebf5c689b493623e096c46b888453e43c8f2e4d"
text = "丰后船头讲，府内各寺正收书，汉籍尤其肯要。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_funai_ironware_demand","text"],null]']
src = "blake3:a826f7091e2896830d7227f53b43f4f9d7a5480578bb74be544b7900c95243b5"
text = "打丰后来的船头说，府内铁锅销得紧，带几口去不愁脱不了手。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_funai_raw_silk_demand","text"],null]']
src = "blake3:eb88c4d5252ea15429ef4ce96f3018fe41d46d39f8ae5d59352e6aed5bb30f77"
text = "丰后来的船只传话，府内商贾四处采买生丝，有多少收多少。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_hakata_books_demand","text"],null]']
src = "blake3:35f090f33bcc89c5cd2071dc651547155eaf83af1d5b40d7c9e94897d0530986"
text = "自博多返程的船家讲，博多眼下缺书，唐本更缺。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_hakata_copper_supply","text"],null]']
src = "blake3:44c1a0d14553a563b671fa6e14ccc700be3c47d980688d78a5d3de2210b08233"
text = "博多商船在岛下缴帆别钱，船头讲今年博多精铜颇多。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_hirado_raw_silk_demand","text"],null]']
src = "blake3:7a4fee4e853f0e880ac7d26dd5f9a68368a7d9de0bfaeca89116a05e6a912770"
text = "堺码头的唐物商言，平户缺生丝，近两年明国船去得少了。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_hirado_silver_supply","text"],null]']
src = "blake3:5ca8b42a09ff82976c0d645bf1f08047bb861bf40250a0c8ad227556470c28ef"
text = "打西边绕过来的船说，平户银子多，换什么货都直接付银子。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_kagoshima_camphor_supply","text"],null]']
src = "blake3:9a8ea4d03d249db144078c6e09609f9e673270fa1bf19aa928c2675be4de931c"
text = "萨摩船上一股樟脑味，水夫道鹿儿岛熬樟脑的人多，都压在仓里。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_kagoshima_copper_cash_demand","text"],null]']
src = "blake3:849514e7ffde46176fdf55e25cbd8bce13fea29cb8ca585a44dc0419c10ec9a8"
text = "萨摩船的船头冲栈桥上打听可有铜钱，说鹿儿岛正缺钱用。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_kagoshima_sulfur_supply","text"],null]']
src = "blake3:b1d95f2397eb10e2fadc983e625289fcf9ddafdf030193b3e34f1d258725ecb6"
text = "萨摩船水夫讲，鹿儿岛今岁出产的硫磺多，价钱压得很低。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_kogo_sakai_ink_demand","text"],null]']
src = "blake3:e274f88a99db08d019f3d13947cfbdd082b31c5158bcd186aeabeb76fa5704d8"
text = "小督代人写信时道，堺的墨已断货，徽墨还得托唐船捎带。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_cloth_demand","text"],null]']
src = "blake3:300b6c3f9e612ae6dbfb147f729e2cd9c1cdba3728f6480ff0eb8f18be6ba972"
text = "能岛的人过来对帆别钱的账，顺嘴提起岛上缺棉布，冬衣还没着落。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_ironware_demand","text"],null]']
src = "blake3:4850925c41ddcdba03a2acdce1316abd178dad114b2714c2d0997bd137c92771"
text = "能岛过来的船家道，毛利家的船这一年在内海查得极严，岛上缺铁钉。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_pirates","text"],null]']
src = "blake3:e44cbc5c9000e84f874ad0ee14cc81f6d68757f8e214ea5aaed116e4fb4c657b"
text = "又四郎交代，严岛那仗过后岛边水路不太平，入夜莫单船出去。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_rice_demand","text"],null]']
src = "blake3:4b9dea0d840c56cda3d503ef4a6d164d787d4854b317500dccb7408fa9ca950d"
text = "前来收帆别钱的能岛人嘟囔，岛上米不够吃，打正月起就掺麦子了。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_salt_supply","text"],null]']
src = "blake3:140e9d78875d924fba9ec692462067823ef47de68e6c7a82210a0f153f557b80"
text = "能岛来的船家言，今夏岛上晒的盐多，价钱比往年贱。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_noshima_sulfur_demand","text"],null]']
src = "blake3:8325782f16540a26f7ca329a829f583a8249cba8c3327551a1728d5d310e5973"
text = "能岛来的人四处打听硫磺，说近来岛上用得多。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_obama_kombu_demand","text"],null]']
src = "blake3:ef13989053194d781450e42d2869cb176ad0a10e1f3bb378a1cd7c9c02d1a8a2"
text = "若狭过来的鱼贩道，今岁小浜的昆布迟迟未到，料理人正四处寻。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_agarwood_demand","text"],null]']
src = "blake3:77382dc185db867a841eb49410337ad0c352594597b4f3bfe7b47a80f06223c8"
text = "堺香铺伙计随船来收账，讲沉香已经断货，露一点就被抢光。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_beeswax_demand","text"],null]']
src = "blake3:b901b7a90ad401ee07e6a9bcc690379cac35453b962cf15d168a9e7459e501f4"
text = "堺码头蜡烛铺的伙计言，铺中蜂蜡眼看耗尽，谁有货尽管拿去卖。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_books_supply","text"],null]']
src = "blake3:f46bb15ccee8cfb665517c44f71340f2c2518fdad1d6ed66db4e7d1008d4a909"
text = "室町通的书商道，堺新印刻一批书，运上京来把价钱压得很低。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_charcoal_supply","text"],null]']
src = "blake3:47e4daa80021f58d1e0e4efa1d99cd8707520dedd3e58571e6762153fbe3d7a5"
text = "堺船伙计讲，入秋后堺的炭行囤了好些炭，炭价正往下落。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_copper_cash_demand","text"],null]']
src = "blake3:0926608c774b02cf7217acf18d8523e885f20b5236c00be8190fd2ed1ad88abc"
text = "堺的商人在栈桥边埋怨，堺市面好铜钱少，收钱时还得细挑。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_deerskin_demand","text"],null]']
src = "blake3:b5c275dabc896dcb1e3c61aad9f823b036561bb4813fd73598d05cbad8727849"
text = "堺的皮匠托船头带问，土佐山中可有鹿皮，若有便收。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_gunpowder_demand","text"],null]']
src = "blake3:7960fa2d93e47c65820519adb00438d6767e40ae38cd62e513a72c70fd614760"
text = "栈桥上的人讲，这一年堺的火药缺得厉害，各家都在四下收。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_ironware_supply","text"],null]']
src = "blake3:9547a72c939bc488e67184f1ebb33d4cbbed22d81516ea242473ac2f4859f68f"
text = "候潮的堺船头说，堺里锻冶町打出的铁锅多，去堺买便宜不少。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_lacquerware_supply","text"],null]']
src = "blake3:b600faf591220a9e21b3bf7557c733b11e4650d0265f66fdb70360782ad142a1"
text = "堺船卸下几箱漆碗，船头言今岁堺的漆器铺造多了。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_lead_demand","text"],null]']
src = "blake3:c0f50f6b91b43b2442cc61a28fa2bab3bd0603fa339a2e4b165fec93a7868b34"
text = "老五郎道，近两年堺的铳铺愈开愈多，铅刚一到岸就让人抢走。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_paper_demand","text"],null]']
src = "blake3:89e3e3c0231a9b1539a5a3f0c258d5375dc0c7b7b8183f543ddfbba675ae19c0"
text = "老五郎从堺回来讲，堺的纸铺专收土佐纸，有多少要多少。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_planks_demand","text"],null]']
src = "blake3:bead94e1ed9f034ddd352f2c663e16a26de5a13f83467f165dc6743d2e03180d"
text = "堺船的船匠问下田可有杉板，说堺的船坞木板快续不上了。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_swords_supply","text"],null]']
src = "blake3:9a3b3632ea2f65c8634a23595374be52f120fcc682a2aa6a42ff9d84dc7c1de6"
text = "本家家司言，今年堺的刀铺打得多，刀价已见松动。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_timber_demand","text"],null]']
src = "blake3:fcb4b020e5f4dd4f1af043773a818b0589a1852acb8ef1ae60945c5bc3168f38"
text = "堺的木材商托船头带信：趁冬天把下田木头运去，好卖。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_sakai_tung_oil_demand","text"],null]']
src = "blake3:21e6f67a54901fbb1d8cc4e0f458a9e09a2ef7cbc43109bda74d2b40564db146"
text = "堺船水夫道，堺的伞铺缺桐油，自梅雨前便断了货。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_shimizu_cloth_demand","text"],null]']
src = "blake3:c32f0062842ce3d002c5c2ca75b5b2c94d6808666c81c5a31f95221d080a4724"
text = "清水的海女托人带话，想换些棉布，上岸好拿来裹身。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_shimizu_ironware_demand","text"],null]']
src = "blake3:04fee1735a0cd875671ecac3447686a29233ef5c07db0173c5c3e0510310207f"
text = "能岛船头讲，土佐清水那边正缺铁器，锄头一卸上岸就卖光。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_shimizu_rice_demand","text"],null]']
src = "blake3:34bd12e26b06619c1a9d8df8efc07983d82948f0b805b0271eae7768a4204b9d"
text = "鲣船上的人说，这一汛清水人都出海去了，米不够吃，四处买。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_shimizu_rope_supply","text"],null]']
src = "blake3:74d7556d698a1fb48ed97cb94964902d6d65537e989ca07504054c5ca0492c3e"
text = "自清水来的渔船说，今冬那边搓的缆绳多，堆在海滩没人收。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_takamaru_sakai_arquebus_supply","text"],null]']
src = "blake3:54e90b01467406429e36c40c936ac83e0de71eb3c8c246e2e93a42eb1d171e82"
text = "鹰丸道，这两年堺的铁炮打得多，能岛也想换上几挺。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_urado_cloth_demand","text"],null]']
src = "blake3:f3e4bceb9165f9866ef21dc025aeb764466329ce46ad5b7e5993876de75ca2ad"
text = "浦户来卖木头的人说，那边棉布紧缺，过冬衣裳多半仍穿麻的。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_urado_ironware_demand","text"],null]']
src = "blake3:40ea83e9e15b8f415600d7223125d182c31fee1b4a00cd3575b4554be7cf3626"
text = "运新米往浦户的船家回来讲，那地方铁锅与锄头都缺。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_urado_rice_supply","text"],null]']
src = "blake3:d9cc1bbbf7a54856aee7b7295a91ed23ed295134dd26ffc5a2b98dce67ea1a0e"
text = "浦户码头上的米商讲，今岁浦户米多，价钱比下田便宜。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_urado_timber_supply","text"],null]']
src = "blake3:ff70eacec7eed9b4b275230e27d2b6446231a8ebd521ae7278515c2813a41a84"
text = "自浦户归来的船家道，本山家从山里放出的木头多，浦户木料贱。"

[entries.'["upbringing/rumors/japan.toml",["act_rumors","rumor_ushio_noshima_rope_supply","text"],null]']
src = "blake3:198c633bec04e78deb2d4f60b3b09e4572e28d9240938aa8370c6bb95b63d46d"
text = "汐说能岛今年搓了太多缆绳，正往外卖。“我娘定会这么说。”"
