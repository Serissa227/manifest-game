[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_0:event","text"],null]']
src = "blake3:71d2a72f1b1da268b9a998146d0ca3603145c467a2e584e6beb5b5d49b7ad988"
text = "渡口的老艄公差我去拴渡船。我绕着木桩缠了三圈、打了个死结，拍净手刚要走，背后响起他一声咳：眼下正落潮，天黑前水还得涨回来一尺多，缆绳绷成这样，半夜船头非被拖进水里不可。说罢，他蹲下身，拿脚尖点出泥滩上昨日水到过的位置。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_1:event","text"],null]']
src = "blake3:649588d3fea99d93fd2d416d1043848503810537a5d8ccfd8d2cb533a757c4eb"
text = "下田的河口外横着一道浅滩，涨潮时藏在水底，落潮便露出条黄白色的沙脊。年年秋汛一过，沙脊总要移位，去年还走得通的水道，今年说不定就搁浅。今日有条运木料的船打算出海，船头托人探水，老船头塞给我一根带刻度的竹竿，叫我跟他上小船。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_2:event","text"],null]']
src = "blake3:b4c3107ae8eb578c2eab66b798e129f01105ad816d3c205c864290ae0869bc6f"
text = "一艘小早歪着靠上岸，朝左舷倾侧，活像个醉汉。水夫头掀开船板一看，底舱的压舱石滚作一团全挤在左侧——准是昨夜返航撞上潮水转向，横流一推，石头滑偏了位。他说得趁涨潮把船托起来时重摆，搁在硬泥滩上搬动，船底非叫石头压裂不可。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_3:event","text"],null]']
src = "blake3:d644b1dd082c07d23633d8d685b39c43a6ff0cda5312b855ef4342ae847808e3"
text = "海峡口的岩壁上凿着一排横道，深浅不一，有几道半掩在藤壶底下。船头说这是几辈人刻下的潮记：水退至哪一道，急流便要转向；转向之前若硬闯，船会被顶回来撞上暗礁。今日我们的船抵着逆流在湾里等了半个上午，船头派我盯紧岩壁，水一沾第三道就喊他。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_4:event","text"],null]']
src = "blake3:dcb713d5317a6480eacd7523d8a9452ff7c476dbb933add995e157f1aa64fb1d"
text = "一条外地商船在关口落了帆，船主不肯交帆别钱，高举一张纸说是免状，盖着上头的印，写明今年往来免征。收钱的老水夫眯眼瞧了半晌，他不识几个字，干脆把纸塞过来让我念。船主只顾连声催：潮水马上要退了，再耽搁，他的船便得在关口搁一宿。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_00_5:event","text"],null]']
src = "blake3:62e56bc223de01bb3182caa936a07329d6dbaf6cc7493df007cd835cde129a76"
text = "新修好的船明早便要下水。船匠趁今日落潮、船还搁在滑道上，唤我钻到舷边去看楫孔：每个孔里都嵌着根硬木楫柱，摇楫全靠它撑着。当中有一根是新削的，木色发白，船匠说新木见了水会涨，此刻嵌得过紧，下水后必裂。他递给我一柄小刨子，还有一截白蜡。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_0:event","text"],null]']
src = "blake3:a2f1a7a4d78220a49058a9d1d1def5994c8ba159601aed33e4d8239d7871d621"
text = "秋收过后，庄户们把年贡米一袋袋挑进政所的院子。老书记坐在廊下，面前摆一只木斗、一本账，量一斗便在账上划一道。偏巧今年有个庄户嚷起来，说政所的斗比村里的大，一袋米平白量少了两升。老书记不慌不忙，自柜里另取出一只斗，斗沿上烙着一个印。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_1:event","text"],null]']
src = "blake3:f8727a968b4e97a22814b29b89409659458238fadaf98a2438c6642a83911cf3"
text = "港町的纸铺新卸了一船美浓纸，杉原纸一束叠一束码到了梁底。掌柜对着摊在柜台上的赊账簿直叹气：扇屋、连歌师还有山上的寺，先前都说准了盆节前结清，如今秋风吹起来了，钱仍没见着影。账上朱笔墨笔混在一块，有的一笔账拆成三回还，有的干脆只记个屋号。掌柜道：“该先去催哪一户，你帮我理个眉目出来。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_2:event","text"],null]']
src = "blake3:027ab988c1e9894d8f2eccf3810c78ee434ac40eaaca7b4226968052d7ce7822"
text = "码头船台上，一条货船侧身晾着船底，船大工头领拎着木槌一路敲击船板，哪里声音发闷就在哪里弹一道墨线。修整七日后，他交来的工钱单上开着十二工、船钉二百、槙肌三把。船主蹲在船头掰起指头，说他明明只见过九个人上工。双方嗓门越抬越高，问丸的番头将单子塞进我手里，叫我先算个明白。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_3:event","text"],null]']
src = "blake3:1d24a324b5fe4fddfad01188465cbc022e88ad70a005dc99e29a60450c2e631c"
text = "秋收一过，庄里的人挑着米俵进了町，在米屋门前排作一溜。米屋主人抓一把倒在掌心吹了吹，白米间夹杂着红褐的大唐米，还有不少碎粒。上米和大唐米差着价钱，庄户却咬死全是一丘田里出的。米俵堆得高过我的头顶，主人叫我先把这批米分出等次再去上斗。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_4:event","text"],null]']
src = "blake3:e4d85ed7552c893215ddd4e394542dd416da09ce542ef6646ec097ec22e4788a"
text = "市集里的盐摊紧挨着鱼摊。盐俵打濑户内的盐田运来，沿途滴着苦卤，抵市时俵底早已结起一层白霜。盐商声称买进时每俵足量，眼下上斗一量却短了一截，便疑心是挑夫半道偷了盐。挑夫们蹲在一旁不吭声，脚背上沾满湿漉漉的盐粒。盐商把账本递给我，教我算准究竟少了多少，又该不该扣挑夫的钱。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_01_5:event","text"],null]']
src = "blake3:0c0234bad344e84171a4722ca318ffd51be4743256311700c1d5dce001ddcf25"
text = "钱屋柜台上摊了一堆铜钱串，麻绳穿着，一串作价百文。来换钱的客人高声嚷着，说他那串满打满算才九十几枚，里头还掺着磨得看不清字样的私铸钱。伙计回称九十七枚当百文是町里的老例，破钱另算也是规矩。两边各拿规矩压人，柜面上的铜钱被拨弄得哗啦响。钱屋主人冲我招手，让我把这几串从头数过。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_0:event","text"],null]']
src = "blake3:f7c569d55355a6f9a65b35b362a348c656dc23b8bb812e9be1836ff0f8cc0b33"
text = "在宅邸的廊下拾到一张假名便笺，薄样纸叠成细长的结，解开来看仅得三行散写的字，墨色由浓化淡，宛如雨脚斜斜落下。既无落款，也不见收件人名字，单写着：昨夜的月，可曾看见。管事道不能任它压在无人认领的匣子里，叫我认出这是谁写给谁的。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_1:event","text"],null]']
src = "blake3:97bf698b7f19132147ea3fbf602d677a1e86f3196412af7c6da954bea51efc15"
text = "右笔房送来一摞旧文书，要分门别类收入箱中。同是越前的奉书纸，有的整张竖写，有的横着对折写两面，有的裁作窄条，外头还裹着一层白纸，封口处画了个墨钩。右笔先生道：“瞧折法便知是谁写给谁、是正经事还是闲话。先学会看纸，再学看字。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_2:event","text"],null]']
src = "blake3:c8e39b870e9aacefeaf3054d99ddc0f006ddcf55964bf6faa03e9ac98a71a53f"
text = "主人打算把来年歌会的宾客名册誊一份清稿，送给主持的宗匠。名册里每个名字前皆冠着官位，从五位下某某守、正六位上某某介，半笔也错不得。我抄到第二页，才察觉把从字漏写了一笔，守字那点也偏出了框外。半面纸已经写满，墨色将干未干，右笔先生恰巧正望向别处。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_3:event","text"],null]']
src = "blake3:5313227dd3316d5fe6eebd71ddd3217918e09871407854120d7e72b65dfdae7e"
text = "库房里翻出一口百年前的旧日记箱，乃这户人家的先祖所写，纸边教蠹虫啃出了花边似的缺口。主人想抄存一份副本，可册里的字写得古怪：国字时而框内作玉，时而作或，时而又成方框里套着八方二字，另有好几个字翻遍字书也寻不着影儿。翻至某年正月，先祖记着“大雪，鹤来”，底下的字迹便被水渍洇化了。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_4:event","text"],null]']
src = "blake3:4a5ca2db149d2d5460dfdd7d42a535b5d4026df04b92e323b27417034433fd20"
text = "寺里新收了几个孩子来学写字，最小的一个刚满六岁，坐直了尚够不着桌面。纸张金贵，和尚递给我一摞写过的旧纸，背面尚能落墨，嘱我分给他们每人一份，再各人替写一张字帖。孩子们扒着桌沿瞧我，当中有个挂鼻涕的抓起笔便往纸上戳，墨星溅上邻座衣袖，两个娃儿眼瞧着都要哭了。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_02_5:event","text"],null]']
src = "blake3:66dfd237134aca64d06a373f554cc179008ab5f23c6ca216dadead704478daaf"
text = "梅雨刚过，土用的日头把廊板晒得发烫，宅里便张罗着晒书。十余只书箱从库房抬了出来，经卷、歌集、旧日记连同账簿，一箱叠着一箱。管事说一日断晒不完，得定个先后：哪些该先见日头，哪些只宜摊在背阴处吹风，哪些晒久了容易卷边。廊下已拉起绳索，几个仆役站在一旁，候着我定夺先启哪只箱子。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_0:event","text"],null]']
src = "blake3:a1592647268754c00cd39d5ce7d5030dcbf57c2a58687e8987c778f16d07b9d3"
text = "局里的老女房整夜咳个不停，天亮前将我唤到枕畔：今宵御汤殿上的宿直本轮着她，她身子撑不住，须由我去顶替。替班的规矩繁多——灯油自哪格取用，敲响几下更鼓前去添油，帘内倘若唤人，该跪在哪根柱子旁应诺，全得赶在天黑前打听明白。她喘息着嘱咐：“莫慌，心慌了便去瞧壁板上的番帐。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_1:event","text"],null]']
src = "blake3:47259cd4c1274b09b90f433e13d5d2672ca92aa8ffff0f37937dcf6ce4640762"
text = "早膳撤下来后，御汤殿板架前头堆起了叠叠器皿：朱漆的高杯，缺过一角又用生漆补缀的悬盘，还有只用一回便得砸碎的素烧土器。各件皆有固定的格位，格畔粘着日久褪色的纸签。掌管器皿的老仕丁耳背得紧，不管问及何事，口头全答“在那里”，手腕却朝着三个去处指。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_2:event","text"],null]']
src = "blake3:86564f10ed9899ae49ecee18a16f978c24535cba36d9875afac24810dc090a69"
text = "明日御前设了歌会，老女房得穿戴齐整，偏她衣箱内只余一套齐全的袿，其余尽是借来、拆改过的旧衣。衣架上搭着五重色泽，由内至外该按浅往深走，抑或从深往浅配，全得依着当季的名目。老女房平展双臂立于屏风前，候我将单衣捧过去：“先里后外，手指别碰着衣襟正面。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_3:event","text"],null]']
src = "blake3:d114cc3afa999a9bb62a2923a417844e04aa85af4d7b014ffdfcec86015c0a53"
text = "午后有人急匆匆来递信，说明日连歌会上，某家少将要列在某家中将上首。传话的小女童说得火烧眉毛，局里的老女房却记得分明，这两家的位次本是倒过来的。席次差上一毫，明儿就有人要当场甩袖子走人。话要传回去改，得先查明白是哪一环出了岔子——究竟是落笔的写歪了，还是传话的念走了样。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_4:event","text"],null]']
src = "blake3:9cf1d4dfeb458af880a28bcda1dba1d6263130aafb907b3ff651a4cdd03b5e60"
text = "地方大名遣使送来进物，厚纸名簿上写得明白：太刀一腰，马一匹，鸟目五百疋，干鲷一折。可廊檐下搁着的，却唯有一只木箱、几串铜钱并一捆鱼干，那马和太刀早已折算成钱了。老女房打发我捧着名簿去廊下清点一回，辨明何者为实物、何者作“代”，好落进今日的日记里。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_03_5:event","text"],null]']
src = "blake3:34a9a07f3dd2d8e139ecc4800bed4da001a2c434b7ca108be54e700340b71283"
text = "外头有使者登门，也不知是远国守护家遣来的，还是近江那处派下的，传信的自己也含糊。覆书须由女房以假名拟就，单是宛名那个“殿”字最难拿捏：落笔端楷，是看重；行笔作草，是平待；写成细瘦的假名“との”，便是把人看低一等了。老女房已将墨研匀，正候我先开口定夺，这一位该用哪般笔法。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_0:event","text"],null]']
src = "blake3:71c8eaecca9c7d573fbab62d3948a951c6fa0ddf9d3644abcf0528dec5d8b9ea"
text = "月次的连歌会上，我跪在执笔背后研墨、递怀纸。吟至第十余句时，座中一位宾客续了句诗，里头偏又带个“露”字——三句前才刚使过。执笔提着笔尖悬在纸面，迟迟不落。依式目之规，同词隔得这般近断不可重出，奈何吐句的是座上贵客，满席人只当未曾入耳。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_1:event","text"],null]']
src = "blake3:cb61a7fd8dee4747c95dbcb02455b8b58a66e9ccdc5223341f8b168b3385b040"
text = "局里借进一帙古歌抄本，派我照录一份副本。才写到半途，却见同一首咏叹，此本落款是古时一位女歌人，别本却署着“读人不知”。旧本历年久矣，纸页满是虫孔，作者名偏生紧挨着破洞，墨痕缺去大半。新本上该署何人名氏，断不能依我私意裁夺。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_2:event","text"],null]']
src = "blake3:a587c61c4c5854dc0be88e9996c3d540bbbe709c2ce2dd8720e51c7483103f48"
text = "和汉联句席间，但凡汉句须得押韵，一巡下来皆须归入同部。今日定的是“东”部，有位宾客对出的诗句，韵脚偏落在“冬”字上。“冬”与“东”读音虽无二致，然按《聚分韵略》之分，“冬”字另占一部。席上有人颔首，亦有人蹙眉，执笔偏过脸来瞧我，大抵是探我辨出没有。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_3:event","text"],null]']
src = "blake3:46b4251eef4c74259b526894c08a4f5bd90a17395001543e485ade33af2d5e70"
text = "欲寄人一首和歌。辞章既就，难处反在纸笺：当令合用何色薄样，叠作几重，折成何式，又该系于哪一枝花木之上。掀开局里的纸箱，红梅、浅葱、萌黄、白，一叠叠皆只存下浅浅几张，宫里拮据置不起新纸，耗一张便短一张。老女房言道，纸色若搭错了，歌辞纵然妙绝，收信人迎面一瞥也要先蹙眉。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_4:event","text"],null]']
src = "blake3:0c774b8165e46062c0eb03bd2ca8fe337c0a3cd8ffe5ccb9841dc2f69528b1ce"
text = "半月前，月次歌会的歌题便已散了下去。今日偏巧有两位缺席，一个病了风寒，一个下乡催收领地的年贡。好在两人的歌都托人带到，只是送来的纸样不同：一张怀纸折得工整方正，另一张却草草写在一枚短册上。依例，开讲前须得将众人的怀纸照着官阶从低往高理成一叠，呈给读师。可这两张不曾到场之人的歌，究竟该夹在何处、又该如何唱念，总得有个章法才行。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_04_5:event","text"],null]']
src = "blake3:fb89954008e29483637a6a3f786ff2207931f63304d49a67b8ddb45cc0b7eb7b"
text = "眼看距七夕只剩三天，教歌的老先生抱来一叠染就的杉原纸，青、黄、赤、白、紫五色俱全，铺在案前，嘱我裁作一尺二寸长的短册，留待七夕夜里供宾客题咏。他说宫中乞巧奠既供五色丝，这短册便也照此配色。我点过客人的名帖，共计二十三位，五色各分五条，原本恰多出两条富余，偏偏青纸边沿带着一道水渍，刚裁到第四条便断了茬。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_0:event","text"],null]']
src = "blake3:2fd663348bb20f0133c302ebfb4cb6db17c2e8397de6c49a73ebcd9d3392349b"
text = "司香的老尼将劈开沉香后余下的碎末摊在白纸上，细碎如米粒，至大者亦不过指甲盖般大小。她令我依着木色深浅分作十包，逐包折妥，在纸角标上编号，日后闻香好凭号取用。刚分至第七包，我瞧见有两粒色泽一般无二，俯身细嗅，一粒透着甜意，另一粒却有些呛鼻发辣。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_1:event","text"],null]']
src = "blake3:3a4e41818c74708cd5ff2812cede0c0d1776585e215eb168d95b5ab7bb804d61"
text = "香铺的老掌柜预备合制一炉“梅花”，将方子录在长条纸上，差我往后屋支取香料：沉香八两，丁子二两，甲香一两，白檀一分，麝香二分。后屋陶罐上的纸签早褪了色，唯独甲香罐里盛着两种物件——一种是薄片似的螺盖，另一种却乌黑油润。可方子上明明白白只署了一个名字。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_2:event","text"],null]']
src = "blake3:423bf37e84f001d0341800861e87d9491d42eda96356626a90a73b11e79122ae"
text = "闻香会刚散，宾客前脚离席，老女房便嘱我整理香具。漆盘上列着三只闻香炉，香灰面上仍拢着纤细压纹，探手一触炉壁，犹带着温热。她吩咐炉温未退时断不能收进桐箱，否则余热闷在盒中，下回启盖全是一股焦糊气。可外头天色已沉，这屋子傍晚还要腾给旁人使唤，我手捧第一只炉，一时竟拿不准得候上几刻。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_3:event","text"],null]']
src = "blake3:b9dfe5b178e03286791232bca7bb174201dd3628990506913098b87157c3e2f4"
text = "香箱里平白多出了一块木头。师傅启箱查点，十二包香木原该对应十二块，案头却赫然列着十三块；其中一块呈深褐色，木理与侧畔沉香无甚两样。既无纸包，亦缺名签，竟谁也记不清是谁放进去的。师傅说香箱内绝不容许来历不明之物，命我将其拣出来，偏我端详来端详去，怎么也辨不出哪一块才是多余的。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_4:event","text"],null]']
src = "blake3:3303f361bc2f0931f4b03aa7fdb953cbb64de00bac8302a447a605f180d27b88"
text = "十炷香散了场，客人们写下答案的小纸条散了一案。每闻过一炷，客人在纸上记“一”“二”“三”或“客”，执笔的女房得按炷次理顺，一并誊入香记。我拣起一张瞧，背面写的炷次遭茶水洇花了，只稀约看出是浓墨落笔，笔画微向右斜。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_05_5:event","text"],null]']
src = "blake3:bdadfb19507bb1e5c925064754097f5b2ab399c2329cd0b1c0d0f40b561b4340"
text = "连着九天阴雨，今早总算放晴。管库老僧推开香库门，积了好几日的闷潮扑面而来，墙角丁子罐上早已生了一层白毛。他把罐子逐一抱到廊下，吩咐我将香材摊开晾一晾。只是檐外日头毒辣，沉香晒久了怕要走油，不晒却又难得干透。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_0:event","text"],null]']
src = "blake3:6aa7095790c98ef0976775b08c2b74b5d548af51d634f267a914013a357cdcfb"
text = "主人家要在后院新辟一片鞠场，园丁已将四角树木栽好：东北一株樱，东南一株柳，西南一株枫，西北一株松。授鞠的师范绕场走完一遭，停在柳树下直摇头，说这株栽得太靠里，鞠踢起来要挂上枝条。园丁颇不服气，称自己原是拿尺子量过的。两人齐齐望向我，要我再去复量一回树距。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_1:event","text"],null]']
src = "blake3:f2f40a27341d0b52bcdaa209eaea54f4ebcc570ce3948c896d620adcb5605e73"
text = "蹴鞠踢至半途忽然飘起阵雨，众人纷纷躲入廊下，独那只白鞠掉进了场心水洼。拾起来已沉手得很，鹿皮吸足了雨水，腰际那圈缝线都泡胀发鼓。司鞠的老鞠足将鞠交到我手上，叮嘱今日由我负责晾干。我怀里抱着它，只见鞠面白粉叫雨水冲秃一块，透出底下黄褐皮色。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_2:event","text"],null]']
src = "blake3:b6ef2ce944942903d7f8ce66850a10468f6832fc34da559792969c710a99ac48"
text = "今日鞠场来了三个初学的小孩，顶小的年方八岁，正是主人家的侄儿。论尊卑，他理当占住松树下最要紧的位子，偏生他连鞠也接不稳，每逢鞠飞近前便抱头闪避，连累身畔众人跟着四处奔救。师范朝我暗递眼色，示意想法子将他调开，却又万不可教主人家误以为嫌弃自家子侄。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_3:event","text"],null]']
src = "blake3:b78c2f69a9e131c20aaaaeacf580f95c7b41924a8f41f1d83558f601c6075954"
text = "有位客官踢得起劲，一脚将鞠兜得高过松梢，那鞠在半空连翻数个跟头，径直朝场外坠去。依规矩原该由近旁之人去接，偏生离得最近那位正低头系鞋带。我隔着远，纵使拔腿也赶不及，呆立着不动又显得全无眼色。场边围观的众人皆引颈望了过来。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_4:event","text"],null]']
src = "blake3:28986f4bfdc308701ac241b30803f179da6b78700f1118307972a49652b8c5f0"
text = "鞠庭内踢到第三十余记，我右脚方一扬起，鞠沓系带“啪”地绷断，整只沓松垮垮挂在脚背乱晃。此刻鞠正悬在半空，上座众客皆仰首盯鞠，尚无人留意到我。规矩摆在那儿，只要鞠未坠地，谁也不许歇脚；可照这架势再踢一脚，鞠沓准要甩飞出去。场畔老庭役早已将手探入袖中，摸出了一截物件。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_06_5:event","text"],null]']
src = "blake3:3fd5a58334cddc9792f807458f999ee052fb0c90dc70e571adb7b62a9d5167f2"
text = "散场了。上座众人依次起身，师匠随手将鞠收归锦袋，此时沙面残留着圈圈足迹，樱树底踩塌出一道浅窝，枫枝上还悬着片踢落的残叶。鞠庭规矩摆着：客官未步出中门前，场内严禁任何人俯身清扫；待客一跨过门槛，则须于一炷香工夫内将地面耙平，宛如无人踏足过一般。而手头的竹耙统共才两把。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_0:event","text"],null]']
src = "blake3:cd27e7df8fb5b14d9081ee7abfe6bf51a416f732cc8ce1aa8c0ab5d8c264b6ca"
text = "一夜大风过后，寺中药园的竹篱塌了半边，插在畦头的名札斜的斜、倒的倒，有几块还吹进了水沟。上头的墨字倒还辨得清：十药、当药、紫苏、桔梗、芹。照管药园的老僧蹲在畦旁，将拾回的名札摊在膝头，一块块拭去泥污：“但凡插岔了一块，煎药的人便要抓错一把。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_1:event","text"],null]']
src = "blake3:3291cf2120bb4619997f7174aca44e377b21483fefb8fe1ea7acbc71f7d6b8c2"
text = "天连阴了三天，乳母的左腕又肿了起来。她年轻时曾摔在石阶上，从那会儿落下的旧伤，赶上变天就疼，握不住杵。今日原该由她替庵里捣一臼艾绒，眼下臼和杵都摆好了，她坐在廊下，拿右手托着左手，嘴上还道：“不碍事，您去玩您的。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_2:event","text"],null]']
src = "blake3:c1088cd5a2886d661392d46527c2b3b5974085560c41e0a66f2b862f756b6840"
text = "打山下送完经往回赶，半道猛地下起急雨，众人奔进庵门时，通身上下全湿透了。最小的小尼唇色发紫，上下牙直磕，怀里还死抱住经匣不肯松手。能换的衣裳只够分给一半人，灶膛里的火才刚点着，烟便往回倒灌。里间传出庵主的话音：“经匣搁下，先顾着人。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_3:event","text"],null]']
src = "blake3:09917fa94e5c5c18873084ff4699476722b1d387c923d7f614320136ee74edb5"
text = "庵堂后门那口大水缸整整一夏未刷，内壁滑腻得如同涂了油，舀一瓢举到光亮处瞧，水里有细细的孑孓正打着滚。前两日厨下的老尼闹过一趟肚子，说是吃瓜吃坏了。庵主并不提瓜的事，单吩咐人将水淘干、把缸底的积泥倒净：“今日刷洗净了，明日才准再挑水。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_4:event","text"],null]']
src = "blake3:b7a7f524340c9280d1cfeae240a385e5cb2499dd2f4dba549e8ab45d6b8cdd04"
text = "庵门外传来呼喊。石阶上坐着个背柴的小姑娘，膝头蹭破好大一块，鲜血混着泥土糊在一处，柴捆歪斜在身旁。她说下坡时踩滑了青苔，一路溜下来，又说这柴丢不得，丢了归家要挨骂。庵主不在，厨下的老尼朝我看过来：“我烧水去，你先过去瞧瞧。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_07_5:event","text"],null]']
src = "blake3:2632158bf46e06a27d22ad8ca0c01493e60dc9ed9c14bf63c53a2c87111ddf3e"
text = "庵里收留了个发热的游方僧，安顿在经堂后的小屋里，已经烧了两天。药是庵主开的，一日煎三遍，入夜还得有人守着，替他换额上的湿布。厨下的柱子上挂着轮值木牌，偏是子时到寅时那一格空着——那会儿最冷，人也最困，谁都装作没瞧见。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_0:event","text"],null]']
src = "blake3:f9eba80cf997edd99082edea6242de98ad6357a805701737081b52f3118fef2a"
text = "开山忌那日，庵里从山上的本寺借来一领七条袈裟，金线绣成田相格，庵主披在身上，满堂都映亮了。今日该送还了。我把袈裟铺在洁净的席子上，逐格细瞧，瞧到左下角，见一道缝线绽开了寸许，旁侧还粘着一滴烛泪，硬得宛如一粒米。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_1:event","text"],null]']
src = "blake3:69009f2efe6991fd71f03f0c81f8d96ef5c258a525966a9e59d7d20266fdf4cc"
text = "山下人家送来件旧小袖，袖口磨破了，托庵里修补好，好给家里老太太过冬穿。补妥后，案上留下一小堆零头：两寸见方的浅葱绢、几条红绸边，还有一截拆下的旧里子。老尼说这些不归庵里，也不算人家的：“你看着处置。”旁边的小尼扒在案沿，两眼直盯着那几条红绸。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_2:event","text"],null]']
src = "blake3:0527bc8651855a09a08c83606f0631ecf95c8494c72204fc3e2d4cb7e2e74cbf"
text = "庵中合用的针线盒是桐木打的，上层插针，中层搁线，最底下放着两把握剪与几只皮指贯。逢月底便要清点一回。今日掀盖一瞧，原本该有二十一根针的针插上只剩十九根，空出的两个针眼紧挨在一处。老尼脸色沉了下来：“针落进席子里，比掉进井里还要人性命。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_3:event","text"],null]']
src = "blake3:74b23428947c44545b8c022c3fb9284c2ce87b7a0beccc7c02513382b688610f"
text = "社务所的油壶已然见底。运送荏胡麻油的船让风阻在对岸，少说还得耽搁七八日。神前御灯一夜也断不得，分拨到缝针房的油，仅够一盏灯熬至亥时。祭礼前待换的新户帐还差着半幅，三个来搭手的妇人都夸自己眼力好，个个想坐在灯旁。禰宜的妻子晃了晃油壶，听着里头残余的那点水声说：“这灯，得排个班用了。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_4:event","text"],null]']
src = "blake3:6f282f27f8bf490520aebc7628924a31605ff0cde6dc9859bf1268b6bf7a9ccd"
text = "四月朔日换下来的绵衣，叠齐收进了社务所后头的唐柜。偏生梅雨连绵下了半个月，檐下的地面都是湿软的。今日天放晴，老巫女掀开柜盖，顿时一股霉味扑面而来：顶上那件守夜人穿的布子，肩头起了几点灰绿霉斑，底下的绵入小袖尚摸不出潮气。她拧起眉道，若再闷上半月，满柜衣裳都得搬出去晒。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_08_5:event","text"],null]']
src = "blake3:3c571de8f2c76fa9abd135f7a7a4c25bce268322ff8ef5d883ccd0ad96c005d5"
text = "社里来了位打京城南下的连歌师，要在神前设一席法乐连歌。过河时渡船颠了一晃，他的书袋落了水，捞上来时底缝全裂开了，里头的连歌式目湿透了半本。他将纸页一张张铺在廊下晾，口里直念叨：“这只袋子跟了我二十年。”他三日后便要起身往西去，问社中可有识得针线的人。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_0:event","text"],null]']
src = "blake3:1967aac68dd3f81add43e508f60e26ae0a19026245394f296a5a84eb1be648a2"
text = "晒网的老渔人谈起，他少时曾在南边的岬外瞧见过补陀落舟：小船上搭着屋，四面拿板钉死，四角各自立座小鸟居，屋里的和尚仅带了几日的米与灯油。引船曳着它到外海松开绳子，船起先朝南漂，外海大潮一推，旋即又折向东去。他拿竹竿在沙地划出一道印：“正是去那儿，观音的净土。再未回来过。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_1:event","text"],null]']
src = "blake3:a91c24377589ddff833d46aab660e51e67ff16adfb8d6f14d059b2df68dcac66"
text = "浦里的船头拿来一册传抄海路，从兵库一路写到赤间关，每个津名下方皆注有去下一处的里数与该停靠哪边的岸。抄本曾被雨水洇透，牛窗和鞆之间有行字独剩下一个“津”字，里数倒还分明：七里。他说这一段入夜最难走，岛多且潮急，偏偏缺的正是它，要我拿个主意。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_2:event","text"],null]']
src = "blake3:4e72432b444b8956ce6155bd05b9c4aa06af7caf3ec90ef7db75dafef291f24d"
text = "浜边松林里立着块旧石碑，半截陷在沙中。顶上刻着一个梵字，底下几行被海风蚀得几近辨不清。村中老人讲，这是明应大浪过后立的——当年浪头一直扑到石脚下，碑底下的人家一户未留。可如今石脚下又添了三间新屋，屋主却说，是老人们记岔了。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_3:event","text"],null]']
src = "blake3:8f9204323773e360ddee9d060c5840300111fff27136ae5b4bd4a83aa277497d"
text = "市集上都在传，北面礁石上有人撞见了人鱼：长发垂着，生着一张人脸，半夜哭起来宛如婴孩。卖鱼干的说是盐贩告诉他的，盐贩说是从渔家小子听来的，渔家小子又说是隔壁浦的阿叔亲眼所见。话越传人越多，那人鱼也离镇子越近，到今早，已有人说它游进港里了。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_4:event","text"],null]']
src = "blake3:6fbfc43e8e53dacd568eaec7d8c480f0264884d8257447ceeff03567d3584e6e"
text = "山寺里藏着一卷开山僧人的缘起，记着他当年搭遣明船过海，自宁波带回一部佛经。寺中有两份抄本，一份写永享四年，另一份却写永享五年，边上都注着“岁在壬子”。新来的小沙弥想把缘起重抄一份挂去讲堂，去问住持该依哪本，住持说自己也拿不准，叫我们去翻检。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_daily_09_5:event","text"],null]']
src = "blake3:35bd55796f389d389e21a19acd3ea439e1484d8539f0d049b8214f810799c3f2"
text = "渔人在海上寻鲷鱼礁，全凭“山当”：山寺钟楼对齐岬角那株老松，再叫东面小岛露出半幅，船底正对着礁石。今年开春寺里重修钟楼，往后移了十来步，渔人连下三日网，回回空网而归。老船头蹲在寺门前，仰望新钟楼，叹道：“它一挪，海里的礁也跟着挪了。”"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_00:event","text"],null]']
src = "blake3:7a4de3bd8df75675ecc6a2a093969510b4d19a2182892166ea410b855bff2319"
text = "正月初三，进物还在一担接着一担往门内挑。今年添了一对稻草捆着的鲷鱼，鱼鳞还挂着海盐，挑夫说是浦口渔户凑份送来的，却不肯报姓氏。老书役翻着名簿直皱眉：连个名字都没留，回礼往哪家送？廊下寒重，他把手炉朝我这边挪了挪，名簿也一并推了过来。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_01:event","text"],null]']
src = "blake3:d7a6e5be8e40415e5dcc528eb34f13df26db0a619017fa8718f61d3f297b2e43"
text = "正月初七的河滩比往年喧闹，近邻几户妇人都挎篮子来了，你摘一把我采一把，菜叶混在一块儿，全倒进灶旁的竹匾。老婆婆说供到前头去的那一碗，七样都得择最嫩的，少一样都不行，若拿萝卜叶去顶数，要叫人笑话的。竹匾里繁缕和佛座缠成一团，早分不出哪根是谁家采的了。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_02:event","text"],null]']
src = "blake3:a83f6d33b5ca9e47e40091662136918257d7bc114afe103c4a9dc779f3672814"
text = "正月十五，北风从河口直灌进来，火堆尚未点燃，纸屑先被卷得满滩乱飞。守火的老汉嘴里念叨着骂人，叫人搬石头压住。各户送来的旧物比往年杂：断弦的弓、裂口的木碗、褪色的护符，还夹着一只缺耳土偶。老汉说有些物事烧得，有些烧不得，倘若烧错了，神明那边没法交代。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_03:event","text"],null]']
src = "blake3:80db2494f1775d6452dc0fa54d1205f9734bc9e4aa6426272ae9341a5fd36b10"
text = "三月三日的河水尚带着寒意，行祓除的人散去后，岸边满是被踏扁的艾草饼叶子。借来的祓具盛在竹篮里待还，社中老祢宜打发了个小童来取，小童立在篮旁迟迟不肯伸手，说是爷爷叮嘱过，须瞧着物件一样样交进他手里才作数。篮中土器短了一只，究竟顺水漂了还是磕碎了，谁也说不清。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_04:event","text"],null]']
src = "blake3:e0a1fea0f5d581315575f3e66ebbc989586a97c26df2886a95761e4112881a2a"
text = "五月初四，梅雨落了整日，菖蒲叶尖坠满水珠，才一抖便溻湿半边袖子。门前排着各处来讨菖蒲的人，有的要挂檐下，有的要垫在枕头底下，还有别家的孩子专讨最长的一根去同人比根。廊上堆着扎好的束子，数一数，似乎不大够分。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_05:event","text"],null]']
src = "blake3:8ea81fd979e309deb0dca8bd18039a12b6a6aeaac094784a4aae15c31f0720ec"
text = "六月十六日，暑气压在屋檐头上，蝉鸣一声紧似一声。点心铺的伙计迟了半个时辰才赶到，满头大汗，说半道上让人挤翻了一盒，捡回来的只有大半。管事的老女房掀开漆盒，眉头顿时锁紧：数目是不够的，可人一个也少分不得。几个孩童扒在门框边，盯着盒子直咽口水。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_06:event","text"],null]']
src = "blake3:e813aa80e8852fe2d690fec011f5269776002ef2b8c216abf23771c873639ab2"
text = "七夕前头连落了两日雨，五色纸受了潮，一张粘着一张，勉强揭开时黄纸上都拓印了青纸的颜色。老先生摊开手掌叹气，说今年的纸笺得重新挑过。院子里的梶树倒是长得好，叶子大过巴掌，几个孩子攀在枝上摘，采下来的有的破了洞，有的沾着虫屎。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_07:event","text"],null]']
src = "blake3:00e898ff8177e98d3deb9c334fee5fefe902b56208cda728d5253f8681150206"
text = "七月里接连几日大太阳，竹竿上晾着的踊衣褪了色，原来的绯红晒作淡粉。头人说今年踊组要从河边一直跳到寺门口，衣裳一件也少不得。可抱来的包袱里，有两件的家纹被虫蛀了，辨不出是哪一家的；还有一顶花笠，笠沿断成了两截。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_08:event","text"],null]']
src = "blake3:33593cbc2606d87c4767a2cb574fe3b2a7549c740e53cec67da6f56f5c88dc92"
text = "八月初一，秋老虎犹未退去，门房长凳上坐满了等回单的来人，个个抄着斗笠扇风。今岁稻子熟得迟，送礼的人家大半改送扇与纸，折扇一把把摞在案上，扇面绘的俱是秋草，乍看大同小异。右笔先生腾不出手，抽出叠空白回单搁到我手边。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_09:event","text"],null]']
src = "blake3:8521ed12f13cd3fdb4a9981ae5b8b9fa86d460a87a6f64fb07ad17a80023948d"
text = "八月十五，傍晚起了云，东边的天灰蒙蒙的，教人看不出月亮肯不肯露脸。扫庭的老仆照旧把廊下扫了三遍，几案搬出来又搬回去，说等云散了再摆也来得及。芒草在瓶里垂着头，芋头已经煮熟，盖在竹笼底下冒热气。不料赴约赏月的客人早到了一位，站在门口，不知该往哪儿落座。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_10:event","text"],null]']
src = "blake3:6187e972897254c63528680f02f1506ab5fab4d71a597d238bf14cf51e2a5a2e"
text = "没到九月初九，夜里就落了霜。老僧送来的菊枝，花瓣冻伤了半数，边沿焦卷发褐。他倒说冻过的花香气愈浓，只是样子不好看，拿不到前头供奉。盖丝绵得拣开得恰到好处的，盛极的花撑不到明早便散了。案上排着一溜瓶子，高矮参差，哪一枝插进哪一只里，怎么看都不大对味。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_11:event","text"],null]']
src = "blake3:468b952af925f544ec488efefda7b21af6d52d5195d02544c5e4d224ca62c812"
text = "九月十三薄暮，廊檐下排开十来只白木折敷，带泥的栗子与毛豆一筐接一筐抬进院来。前月十五夜敬献芋头，这番改用栗子与毛豆，故而世人亦唤作栗名月、豆名月。掌膳的老女房交代，每只折敷盛十三颗栗、十三荚豆，敬月的那一份须安在最东端，余下的依着位次往后顺排。说话间月亮刚自山背探出头，边上仍欠着一小角。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_12:event","text"],null]']
src = "blake3:0d46cb5072718d301d0dcaaed0a18450c9dcfb6524bbafd1ed2bd747547e629b"
text = "立春前日一早，神社的老祢宜便给前来搭手的孩童逐个分派竹扫帚。拜殿前的石板隙间塞满积叶与宿灰，入夜要在此处撒炒豆，若清不净，豆粒滚入缝隙便摸不出了。祢宜交代扫院自有规矩：须由内向外扫，扫帚头扫不得从人脚背掠过，聚拢的尘叶亦不准倾倒在东北隅——那方乃是鬼祟来路。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_13:event","text"],null]']
src = "blake3:5264258da35ef190466b961c6f409d3e3a1cc6ed65be4ddfd8246ebe026166ab"
text = "十月首个亥日，馆内膳房自午后便忙活开了。女房们将研细的豆粉、芝麻与赤小豆分别掺入糯米里，团成红白黑三色小饼，逐个码入漆盘。依例须赶在亥时分送至值守人手中——都道吃了这饼，一整个冬日便不染疾、不长冻疮。递送的名录正贴在梁柱上，尊卑先后列得明白，偏偏常有临时换班的变故。"

[entries.'["upbringing/pools/japanese.toml",["chapters","c9_pool_japanese_festival_14:event","text"],null]']
src = "blake3:0233b442f21a208f14e378b880a3149d95301d57278b8f401c0cba7b7eb73870"
text = "离月中歌会还有三日，这回轮值此处拟题。出题的老先生将两道歌题拟于一纸——“寄松祝”“旅宿梦”——命我依样分抄数十张小笺，折叠妥当后系上枝条，逐户登门递送。笔迹须端严，题目更是半字错不得；笺纸折法大有讲究，奉与尊长和平辈的结扣各异。几案那头摆着的枝条方自院中折来，断口处尚湿润着。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_0:event:assist","reply"],null]']
src = "blake3:ccdf4eb3f5b0a31d92dc05777dcccc5104e04d3dc04794f6060fdc73adab0b69"
text = "艄公拆了我的死结，拿臂膀比量着教我：木桩到船头之间留一臂半余绳，再瞄准泥滩那道湿印，“潮水漫到那儿，绳就该刚好绷紧。”他又教我改打一扯即开的活结。傍晚我再去看时，潮水不多不少正淹到湿印上，船头安稳浮着，缆绳不松也不紧。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_0:event:assist","text"],null]']
src = "blake3:82f431d4305a0c57c89e78b8a13cff7267abbbf72e4159093eb37483fe45568e"
text = "请老艄公教留绳"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_0:event:check","reply"],null]']
src = "blake3:7dfc95dc958745fbb01fd110aad164f257de77f9476734a54c2b8829ea4657a0"
text = "我先瞅瞅木桩上的水痕，又屈指算日子——今日初八，潮差浅，涨满顶多一尺。于是我放出一臂多余绳，挽了个一拉就散的活结，顺手在桩上划道浅痕记下这会儿的水位。半夜起身去探，水才漫过刻痕一掌宽，船头安稳浮在水面。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_0:event:check","text"],null]']
src = "blake3:d4c854be19e781a3f0877ae41b1781d9ec79403525df9dd1c86a6ec7e821a79c"
text = "算着潮差自己留绳"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_1:event:assist","reply"],null]']
src = "blake3:abe2ecadf5605d72660bb5f4ada7f2e88a150b70b83b39fc95b48c1bfc667717"
text = "老船头撑着小船，吩咐我将竹竿一下下插进水里，他报数，我便在木片上刻一道。“水底的沙是活的，”他讲，“你看水面——哪处起细浪，底下的水就浅。”探到第三十竿，总算找到条比去年靠北的深水道，他让我在岸旁松树上系一缕红布。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_1:event:assist","text"],null]']
src = "blake3:d42dacf134df6e3338658ffc6e74fd0322b75640bb098d9522fff1261d519a4e"
text = "随老船头去探水"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_1:event:check","reply"],null]']
src = "blake3:f25158109a0f7b9c09a01f0ca6fe6cdce3efa9a5ea0f3ac65f8698be9728da19"
text = "我先掐算时辰：今日满潮要到午后，退水前满打满算仅有一个时辰能过。我独自划起小船，贴着起细浪的水边逐竿插探，一竿一记，描出条朝北拐弯的深水线。运木船赶在满潮时驶出河口，船底离沙脊只差两拳空当。船头立在船尾上冲我连连摆手。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_1:event:check","text"],null]']
src = "blake3:ea6f0a348603ca0ec0364b4c8111d1b9a03b6cf5713ae255bc4ee4f8cec9626b"
text = "算准满潮独自探"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_2:event:assist","reply"],null]']
src = "blake3:b814c47c8ef33ca85df59ea02010254f2e3a012c7602b2aae955ac44b27cb261"
text = "水夫头立在舱口，逐块把石头递进来，边递边告诉我放哪儿：“大的贴紧龙骨，小的塞缝，两边一般沉。”每摆几块，他就让我爬上岸看船身正不正。潮水漫到船腰时，小早晃了两晃，端正了。他从舱底摸出块扁石头塞给我，说这块归我压纸写字用。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_2:event:assist","text"],null]']
src = "blake3:ebc656005625a106a6ac4a933f9b37acfe37f570e27f3e951c608ddeae5df9a2"
text = "依水夫头的法子摆石"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_2:event:check","reply"],null]']
src = "blake3:18a62b92cb2da5e2bc97555a55e6765172fa732c78ceb4a8d9a61e5aeab4ab96"
text = "我等到潮水将船底托离泥滩方才下舱，先把石头全搬回中间，再一左一右对着往外铺。每码一层，便抬头瞄一眼船头和桅杆是不是对齐岸上那棵树。末尾几块小石楔进肋材缝里，拿麻绳捆牢——下回再遇潮水转向，它们便滑不动了。水夫头扶住船舷晃了晃，稳稳当当。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_2:event:check","text"],null]']
src = "blake3:9b3ab082d17ff8384e0697c977c6840b0c14ac11a133a2b576a4bd54de120dfb"
text = "候涨潮浮船再摆石"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_3:event:assist","reply"],null]']
src = "blake3:89ce63eb7edc45fcf6148ff5062d4f777ae3d2fdf728614ce9f4192505db2465"
text = "船头陪我坐在舷边，手指岩壁教我辨认：“深的那排管大潮，浅的是小潮。今日初三是大潮，看深的。”他又让我丢片木屑入水，看它往哪边漂、漂多快。木屑停住打住时，海浪不偏不倚正碰到第三道深痕。我喊了一声，橹手们齐齐发力摇了起来。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_3:event:assist","text"],null]']
src = "blake3:0e9e945a52dd2aaf67a3f10311420ba656d4f333ce40da0515d4298aba43e99a"
text = "请船头教认潮记"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_3:event:check","reply"],null]']
src = "blake3:60fc3e72d5abe37370a53846e767c7572fac9092d56703618478a275ce2977bd"
text = "我先数日子：二十三是小潮，该盯浅的那排。我往水里丢片木屑，木屑漂得渐渐慢下来，礁边的海藻也从一味朝东伏倒变成笔直竖着。水刚舔到第三道浅痕，我开口喊了一声。船穿出海峡口，回头望去，刚才停船之处又翻起白浪，急流早换到另一边去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_3:event:check","text"],null]']
src = "blake3:695d7570b56bdb665ba76574b16b0dda3ac15d0c9c661c33fc2fda64e1af9a5b"
text = "自己数日子看潮记"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_4:event:assist","reply"],null]']
src = "blake3:ad6ef78285fca0c5596a9bacf35914ec6b3268adc1d9c5344b327f85b7b60e9c"
text = "老水夫提点我先查日子、再辨印、末了数帆：“免状上写几张帆，便只免几张。”纸上明写一帆，那船却挂着双帆。他又抬眼望望岸边礁石上的水线：“潮水尚有小半个时辰才退，慌什么，让他把多出那张帆的钱交了。”船主嘴里骂骂咧咧，到底掏出了钱。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_4:event:assist","text"],null]']
src = "blake3:889aae569fbd553dbf516adce7d27215f2fe01c816e258e545a56f69d61eaac7"
text = "邀老水夫同看免状"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_4:event:check","reply"],null]']
src = "blake3:ee0e0342a6e6637b9c04c685099a3d3687fada6a9caf5c3573649a84376a4507"
text = "我先去瞧水：礁石水线距最低的藤壶尚有两拃，离落潮少说还有小半个时辰，船主催得太虚张声势了。再翻看纸面：日子是今年的，印也对得上，写着的却是“一帆”。我指着他船上第二张帆，请他把这一帆的钱补上。他望天又看水，晓得唬不住人，数钱递给了老水夫。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_4:event:check","text"],null]']
src = "blake3:f61e6bf9bb0b588bc4e4e1e8ea4a0e206ca68c0b38a864a95c3d302879f12aa1"
text = "先看潮水再核免状"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_5:event:assist","reply"],null]']
src = "blake3:821d727a30862dc21e692b16002440f84fce0f6cf9ccc83f5313446b27752606"
text = "船匠捏着我手腕，教我把楫柱刨下薄薄一层，再擦上蜡：“留一张纸那般厚的缝，水一泡就刚好。”他让我将耳朵贴在船板上，自己从另一头敲，专听哪个孔回声发闷——发闷便是里头有水汽，须晾干。他还叮嘱，明早满潮在卯时，错过了船就推不下去。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_5:event:assist","text"],null]']
src = "blake3:3b07d81a7e806b0e947a64331bfa23ac6af949a27becc59d33eb58a9183be2d9"
text = "请船匠教削楫柱"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_5:event:check","reply"],null]']
src = "blake3:cd222415201d61171a73a1bfd060760d844c4d95ed669670cd7aec3f214a1425"
text = "我一个孔一个孔摸遍过去，新削那根刨掉一纸厚，打足了蜡；寻出有个孔底摸着发潮，塞团干麻吸去水汽。收工前我又到滑道尽头望了望水，算出明早满潮在卯时前后，跟船匠说寅时末就得叫人来推。第二天船下了水，楫一根根试摇，半点不涩。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_00_5:event:check","text"],null]']
src = "blake3:e1fb778fec65d746077ba2601d01442b382c3eebee4454fab9ead1401f2e7652"
text = "自己摸遍楫孔"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_0:event:assist","reply"],null]']
src = "blake3:5abc54c3c3c317535894c876e29ffb8e9b8d53b4adc3a03983628baa3c5b12a9"
text = "老书记让我把两只斗并排放好，各量满一斗米，再倒进同一只升里计数。烙印那只果然多出小半升。“村里的斗只村里使，交年贡用这只。”他教我在账上分两栏：一栏记庄户按村斗报来的数，一栏记政所斗实量的数，差多少夹写当中。庄户瞧过账，不嚷了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_0:event:assist","text"],null]']
src = "blake3:f8dd3db2721232da2b7bb6cef4d1830667e599f1e6fe6a496cf08643d66e2665"
text = "随老书记并斗量米"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_0:event:check","reply"],null]']
src = "blake3:b0652e70384994ffecefd57d747f8231c54706caee85e900a19e23d6ead23703"
text = "我把庄户的村斗和政所印斗各自满量十回，均出每斗差多少，写成一行。账上开两栏：左边记庄户报来的，右边记实量的，每袋米两边各落一笔，差数单列，底下合个总数。总数和庄户叫屈的两升仅差几合，他自个儿倒挠起头来。老书记拿过那页账，端详了很久。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_0:event:check","text"],null]']
src = "blake3:3aa5e56a561812a19cc4ab0be23ffb237b005da78108df5f93fb31342941550c"
text = "两斗各量十回入账"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_1:event:assist","reply"],null]']
src = "blake3:049ca53e313f16dc8d15c405d3c8764ec15d6924a55460b97dbd7828e3f8179d"
text = "老番头教我将赊账挨户誊上细长的纸条，照原定的结账日排在柜台面，过了期的便拨往左首。他一边挪一边念叨：“和尚跑不了，寺里欠的先不急；连歌师下月要去骏河，得先找他。”我将纸条挪来挪去，直到排到第三回才算全无差错。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_1:event:assist","text"],null]']
src = "blake3:220a0d147d5f11b72a3055cb2986127649f36311990c520e32af1d4d0092881d"
text = "找老番头学排账"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_1:event:check","reply"],null]']
src = "blake3:1f0cd0adae5256a822b9ff2f85fffcad6488ff423ca5620f3eebbbfc79bfe26a"
text = "我将赊账簿从头逐页翻到底，替每户单开一栏：何日赊出几束、还过几回、余欠多少文，左面记赊、右面记收，两边一相减，欠数便落在下头。理清一看，扇屋其实早还清了，原是掌柜少登了一笔。掌柜直拍额头，提朱笔将扇屋那一栏划去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_1:event:check","text"],null]']
src = "blake3:5611b12730197bae7c5f275e3af45a6e46a2d5e622b41c7a5a3af197dafd57f4"
text = "分户立栏，赊收相抵"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_2:event:assist","reply"],null]']
src = "blake3:6aff6c2ab3bcea67d7de1475b689ac276f268286bcb754e3c1685ea4f5c962ce"
text = "番头领着我逐日去查上工的人手：头天四个，动手拆旧板；第三天来了个锯木的，才干了半天。他指点我做足一日算一工，做半日便算半工，船钉与槙肌另列一行，别同工钱混在一处。算下来合共十工半，两边的嗓门都低了下去。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_2:event:assist","text"],null]']
src = "blake3:c36e394e441060db1c55e3c903655372705572e260faf4ed8d766c1625efeaac"
text = "随番头逐日查工"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_2:event:check","reply"],null]']
src = "blake3:ac3f3201c1378c4e79ea5d4b1e0bc22b3715b1b0fee57550951d009d8f61296f"
text = "我将七日的活计按天排开，人头乘上天数，半日的折半，合得十工半；船钉照铁匠铺的票据单算，槙肌则是我钻到船台底下一数，三把里头还有一把半没用过。船主付了十一工的工钱，头领扛回余下的槙肌，道是留着补下回的船。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_2:event:check","text"],null]']
src = "blake3:4b31eaba7507bc48fd1d9fbff7836a2a89159eda36eec8b529ae92b2f83ee580"
text = "按日计工，料钱单开"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_3:event:assist","reply"],null]']
src = "blake3:9ab6f669b07b2d68c0f7ad808d29280b3a24e8b0a0155298950201d392e45bef"
text = "米屋主人教我摊开一张草席，每俵抽一枡倒上去，红粒偏多的拨去一边，碎粒偏多的拨去另一边。他说道一捧里十粒红了三粒便算次等，往账册那一俵名下画个三角，莫管庄户脸色。初时我数得眼花，及至数完第五俵，手指一搭便能分出红白。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_3:event:assist","text"],null]']
src = "blake3:95c24b8f028a4fd0a46d5f560860606ea171964fbed65a2aad40a6a317510a35"
text = "随主人学着分米等"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_3:event:check","reply"],null]']
src = "blake3:7511b7c841a6280d43f4592ab236f25b0859c23a4f022ee986c5a242f410fbae"
text = "我替每一俵编好号，抽样倾到席上分成上、中、次三等，录下斗数和折价，再照庄户名字汇总，谁家交了几斗上米、几斗次米，一行行写得明白。账目交给庄户看时，有一户低着脑袋，把混得最凶的那两俵挑回去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_3:event:check","text"],null]']
src = "blake3:87f5266e38c1d577c8829fef9c760ae0e3752c39d17ba57f2b45f41092856f26"
text = "编号抽验，定等登账"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_4:event:assist","reply"],null]']
src = "blake3:d0631b5829d8738696312b49ddb42963a4e54b4d82021602c4c85be3294becae"
text = "邻摊卖海带的婆婆年轻时跑过盐贩，她教我看俵底的湿印：苦卤滴落得越多，盐自然化得越多，全叫路上的天时收走了，怪不着挑夫。她让我把每俵短少的斗数抄成一行，旁头添上走了几天、下没下雨。誊完一对照，走得最慢的那一担缺得最多，偏生那几天下了雨。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_4:event:assist","text"],null]']
src = "blake3:1c6e2e96021cf93085db64cf092a2814c2626bbe9a8a1dafee495f9b26c1f847"
text = "找邻摊婆婆验俵底"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_4:event:check","reply"],null]']
src = "blake3:fdee8f51bbbc6385875ee9a78d6bddc2f193d9dad9a3c604f9f639d9c17da6af"
text = "我将进货斗数、到货斗数、路上的日子及晴雨列作一张表，算出晴天一日化几合、雨天一日化几合，再照这个数去核对每一担。十担里九担都对得上，单有一担缺得太离谱。那名挑夫被唤出来，红着脸从扁担头上解下一只小布包。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_4:event:check","text"],null]']
src = "blake3:9348a8bf539bdb15380449ca6261df525c508a61067587b88eb1cdf8c93d6bdf"
text = "依晴雨算清损耗"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_5:event:assist","reply"],null]']
src = "blake3:dc02e063bc4f285fabea1d299067bb0baa967c015e6d7df8577e9d9a40174c19"
text = "钱屋主人教我撰钱：字口清晰的永乐钱放一堆，宋钱放一堆，缺边的、火烧的、私铸的鐚钱单另放一堆，照町里的行价折算。他捏起一枚薄得几乎透光的钱，说这种两枚才顶一枚。我将三堆细细点清记在纸上，客人那串折下来实得八十六文。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_5:event:assist","text"],null]']
src = "blake3:8c8e95259b52431d7d2cbb16e7014c10d995b9803c8e9c5396636dfc94ef8cb4"
text = "随主人学撰钱法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_5:event:check","reply"],null]']
src = "blake3:e9eb0585e4ba9a2d60fa3a00d737f519b075dae2574902bd78ec8ce96a624179"
text = "我解开每一串，十枚一摞码在柜面上，好钱、残钱、鐚钱分开记数，再照九十七当百的规矩把好钱一串串重新串上，破钱按折价另列一行。末了一合总，客人那串短少的三枚原是麻绳结松了，半路散掉的。客人摸了摸袖子，果真从袖底抖出两枚来。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_01_5:event:check","text"],null]']
src = "blake3:e68a57b1155c9a783dd5236d72227e46631a1290fbd24d28e9280b80067342d7"
text = "拆串分钱，按摞清点"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_0:event:assist","reply"],null]']
src = "blake3:c52858720a51a496f43277a1368c99da36679e34cb333f80c7e70c89644c3e87"
text = "老女房将便笺凑到灯下教我辨字：起笔圆润，连绵处气脉不断，是学过流派的手笔；月字用假名写，看见二字却偏留着汉字，写字的人好卖弄。她让我照样描了三遍，描到第三遍，我猛然看出这手字与西厢一位侍从抄的歌一模一样。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_0:event:assist","text"],null]']
src = "blake3:dee99f4b98ecd76bfefdd0c203413ca32ebd6c463cc646b306f7b83a9ab9d70c"
text = "随老女房学辨笔迹"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_0:event:check","reply"],null]']
src = "blake3:48e099b463f789d52a8b9c768e4b1544f5a9ca6adf763f4da24de2b889660b29"
text = "我将府里几位常写假名之人留下的字稿逐张摊开，比起笔，比连笔，比假名收尾的那一勾，挑出最像的两张，又依折纸法子剔去一张。那是西厢一位年轻侍从的笔迹。我把便笺照旧结好，搁到他的书箱上，一句也没多言。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_0:event:check","text"],null]']
src = "blake3:45bfb70d23711dfef2d0b839d1971f92cc88889f5e930f05c440d2f626cb6281"
text = "核对字稿，辨出笔迹"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_1:event:assist","reply"],null]']
src = "blake3:3373cf1b0a0a733f2b8c87f84183a393ca4f613bafd6e12256da8cdab71ae776"
text = "右笔先生将三种折法一字排开：整张竖写的竖纸是郑重书状，横折的折纸多半是目录和礼单，裁窄的切纸则是急事短信。他教我掂量包纸的厚薄，厚的给身份高的人。我把一摞旧文书理成三堆，分错的两张他抽出来，叫我将折痕抚平再细看一遍。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_1:event:assist","text"],null]']
src = "blake3:dafc22ef1e7b8ce13cb289b40cbc3767a26847d02a7ae745c3ae3259c71c500b"
text = "请右笔先生授折法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_1:event:check","reply"],null]']
src = "blake3:584ce1537b86e586412321445b29a803fd55e8851bacc93cba3a1431a52b90e1"
text = "我先依折法分出几堆，再查日付写在哪一行、宛名比正文高还是低、落款底下有没有花押，三样合着定下每封信的分量。内有一封横折的折纸，宛名写得比正文还高，我便将它从礼单那堆捡出来，归进书状里。右笔先生翻开瞧了一眼，把它压在了最上头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_1:event:check","text"],null]']
src = "blake3:701b4a45509638221520b64aeebaa4c0713ed2ded8b93485914afadf5e07fb5c"
text = "依折法与宛名归类"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_2:event:assist","reply"],null]']
src = "blake3:447d4e6261648b40d69f6e6ce3c03758de03ba50da663abdaef584ba12824ce8"
text = "右笔先生没开口骂人，只翻出一册旧名册让我对照着看，叮嘱我落笔抄官位前先在心里念过一遍，逢着位、守、介几个字便收住笔锋。他道，写错一处官位，比写差旁人的名姓还让人记恨。我另起一张纸重抄那一页，每抄罢一行便拿指甲在原稿上压出一道印子，直抄至末行，手腕已经酸得发紧。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_2:event:assist","text"],null]']
src = "blake3:c7b290821cf7dc22f286fedb12ffaf7e622843ecd69c6219bd5e6b342255e843"
text = "依先生的法子重抄"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_2:event:check","reply"],null]']
src = "blake3:7f838d102dc279366574802666a7e89f46a0cc221ca459a1e7cc82b3fffe68b3"
text = "我将原稿与清稿并排摊在案上，顺着行往下念，一共核了三遍：头遍单看位阶，二遍单看官名，末遍单看姓名。这么细查下来，除了我少写的那一笔，连原稿自个儿也把某位客人的介错写成了助。我在旁粘了张小纸签标明，没敢径自涂改。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_2:event:check","text"],null]']
src = "blake3:a56c45b7f32d919cd3d94f7de846f6899b7b6e40174d5f4f5dc9c6b0093acfed"
text = "分三遍读，逐字核校"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_3:event:assist","reply"],null]']
src = "blake3:b00726f89e7ed1926018edccbfab9a2675b04557155e31db6080c8ec406d8a5e"
text = "寺里的老僧替我捎来一册手抄字样，异体字逐个排开，侧旁标注着正字。他教导我，遇上不识的字先察偏旁，再推上下文意，实在认不出便依样描摹下来，切莫乱猜。我把日记里不认识的字全描在一张纸上，合计二十三个，老僧认出了十九个，余下四个连他也皱起了眉头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_3:event:assist","text"],null]']
src = "blake3:a1cd8d338d42ffd4a6e7d528407611e03ed644f10d50b1acd727c1b72ea783f7"
text = "托老僧带字样来"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_3:event:check","reply"],null]']
src = "blake3:161836132f9b5fbe9c2e99e27c4536cde7c99f02bc8f6ec1e70f8c0a244ede1a"
text = "我替日记里的每个异体字各裁了一张小签，记明它出在何年何日、前后是何文句。只要同一个字露面三回以上，便能由上下文推出它究竟是谁。方框套八方的那个叫我推了出来，还有个像鸟爪似的字总紧跟在雨字后头，原是止字的古体。主人将我的小签一并收进了日记箱。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_3:event:check","text"],null]']
src = "blake3:7bb48290530c37f8368ea29eed219bcb99c209ae0011556115b836148e1d5546"
text = "制字签，依前后文推"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_4:event:assist","reply"],null]']
src = "blake3:d9c3abb069b774713b4ba4a916c67f4082d3505b5066b12d4e637c25b5f1ece1"
text = "和尚教我照孩子的手掌分纸：手小的给裁窄条，已会握笔的才给整张。字帖他要我从伊吕波歌打头的三个假名写起，字写大，落笔慢，一画一顿。我写一字，孩子们跟着描一字。那挂鼻涕的小孩描歪了，和尚握着他的手描齐，转头又握住我的手，要我也重摹一遍。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_4:event:assist","text"],null]']
src = "blake3:22c7b44c4ca4ce283f26091489fd166a707a05da6dce6838b1b571409b2acaf9"
text = "随和尚学写字帖"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_4:event:check","reply"],null]']
src = "blake3:9c5914322c5a43bf73d5d0b8f00fdfda6d6274fd1247fadf97367ee642997c74"
text = "我将旧纸依大小归类理齐，空白背面朝上叠好，每页纸角题上孩子的名字。字帖写的是《实语教》起首那句“山高故不贵”，正楷写大，侧旁注上假名，费坏两张纸方才写成。孩子们伏案照描，我挨个儿巡过去，瞧谁将笔杆握反了。最年幼的那一个描罢，把纸高高举起，给门外的母亲瞧。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_4:event:check","text"],null]']
src = "blake3:ef71fbe7b89a872cadb58ca1a4fcc5647f42e1b3b301ba1c640ce44c6df43cef"
text = "自写字帖，分纸教描"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_5:event:assist","reply"],null]']
src = "blake3:f64cdf671c272f2df35c4647895bfcf77bf1c2e8b71e35813c5bb683d8d71907"
text = "掌管书库的老仆教我先打开潮气最重的那箱：经卷切忌烈日直晒，只在屋檐下通通风；歌集纸质单薄，晒上半个时辰便得翻面；账簿纸厚，大可搁到午后。他又教我边晒边在箱单上记明，哪册曝过了，哪册叫虫咬损了几页。黄昏收书之际，我手里记下的蛀页足有七处。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_5:event:assist","text"],null]']
src = "blake3:b15bdf4c0e982874ac68eabfab8779d6410158e380d8b07a1c84d108e400b2cc"
text = "向老仆学晒书先后"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_5:event:check","reply"],null]']
src = "blake3:45371b1926f2fae41d7b7aa0fcfe109a48a3f049720ceab1478c2303ebc62b89"
text = "我先将每只木箱逐一掀开嗅过，霉气重的先行曝晒，再依纸张薄厚排开：薄纸留给晨间，厚纸摆在晌午，经卷连同施了颜料的绘卷统统只搁檐下阴凉处。我抄好次序粘上廊柱，书箱便照单逐只搬出。傍晚收箱，所有书页无一卷边，倒爬出来十来条蠹虫，晒得只往缝隙里钻。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_02_5:event:check","text"],null]']
src = "blake3:11495ac341c5c0f446a96ac59524ee107b0f043af0c8ed6a6515d73e0259bf41"
text = "嗅潮气，依薄厚排序"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_0:event:assist","reply"],null]']
src = "blake3:433d617a50408ef485153065d05f3517de124cb80e9e725965d0ab3e615f570a"
text = "老女房勉力支起身子，拉过我的手臂权作灯台比划起来：添油之际身躯须偏开，别遮了帘内的亮光；若听里面呼唤，先轻声应一句，再屈膝挪过去，决计不准起身行走。她押着我在屋里来回膝行了五遍，直磨得双膝发红，方才颔首放行。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_0:event:assist","text"],null]']
src = "blake3:8ff40b9303a8933817ef9f03a7887abe0c4ab3af6da4a2c9a78e3a9157d21174"
text = "请老女房先行指点"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_0:event:check","reply"],null]']
src = "blake3:a57304749f755d986cea5055ef4a79ea969e30e6112e29fee76183a7debfd68c"
text = "我将番帐上的更次抄进扇骨内侧，每添过一回油，便拿指甲在扇骨上掐出一道印痕。掐足三道之时东边天色已发白，接班的人揉着睡眼到了。我将灯芯修平交付于她，退身出门时，脚下没踩响过半块地板。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_0:event:check","text"],null]']
src = "blake3:a62dac6b0125b07e9bafdafb3443bb92100f01e51941c53e06ba1696da58f272"
text = "自依番帐值守到明"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_1:event:assist","reply"],null]']
src = "blake3:61b8949cdb079a2a09300a89d6d5dc2499b4165de1e007203293d2f56b1f3844"
text = "老仕丁将器物逐件翻过来指给我看：底足皆用朱漆点有小记号，一点放顶层，两点放中层，修补过漆的那几只统统挨着最边上放，省得磕碰。他语声极缓：“碗，口朝下；盖，跟着碗。”我依言摆过一遍，他抬指节敲了敲我摆歪的那只。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_1:event:assist","text"],null]']
src = "blake3:b47c13e2cbf8d2d7cd839454872f9ccf77c01a2bb842689b8185e910ead98e87"
text = "随老仕丁学着归置"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_1:event:check","reply"],null]']
src = "blake3:f1a5eb88961a798c2064e6c833b0fb157bb2a5efce14aa92b5becd075a39619b"
text = "我先将土器碎渣敛进竹篓，随即从最宽大的悬盘理起，循汁、菜、饭的次序往上码放，盖面朝内，碗沿扣下。前来核点之人进屋时，我退到门侧跪候，直待她数完方才站起。她在簿册上勾了一笔，言语半句也无。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_1:event:check","text"],null]']
src = "blake3:834741892cec6e45da652133e540e72276e5499b61a873706c85914604b1d423"
text = "照纸签逐件摆回"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_2:event:assist","reply"],null]']
src = "blake3:6aca78822b416479f581ac716bd80aee5e2f08e7ad898c6d1911f5e09342cef4"
text = "老女房口报一件名目，我便顺手递过去一件：单衣、五层袿、打衣、表着。她嘱我拿指腹把每件的袖口略微搓捻一下，记熟手底下的厚薄，轻薄者是夏衣，厚实的留待冬日。递岔一回，她即刻将衣衫退回，我折好再递，如此周折到第三回方才不错。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_2:event:assist","text"],null]']
src = "blake3:820b034ca7a9817e6b4aa74c3b1a250571540336bb701ba537a158e8c79649de"
text = "依老女房所唤逐件递送"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_2:event:check","reply"],null]']
src = "blake3:30b58aab87819eb2be83ccfe6ac39d0d5a8df2cdbac492d5ac5ff39491460946"
text = "我将五件袿铺在席上排开，把袖口拢在一处比色，深浅相拗的那件移至最里层，叫最外那件的袖缘仅微露一线。递衣之际我跪在她背后，双手托起领口，候她举臂方往肩上送。系定末一条衣带，她略略抬袖一试，五重袖边一道未乱。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_2:event:check","text"],null]']
src = "blake3:b0e187a031c502991d31f445ee190c515e0cdd2b4b5e684b258de93b644c1a74"
text = "自排五重衣的次序"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_3:event:assist","reply"],null]']
src = "blake3:eaa31321c753b8ee5e7de688e24b1d95808a1a44a53111363dd426ededba131f"
text = "我跟在老女房后头过去，路上她把说话的先后教给我：头一句先谢人家跑这一趟辛劳，接着再道“听闻如此，兴许是我们这边记岔了”，末了才亮出旧记。等她话头一落，我在她身后半步跪定，双手捧着书册，待她伸手再递过去。对面那位脸色由绷转缓，不过一盏茶的光景。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_3:event:assist","text"],null]']
src = "blake3:073e5f6c191276d0c88eb0eb7a825dacfe1c2e85639720e6c89fdc753984e16c"
text = "随老女房一道去说清"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_3:event:check","reply"],null]']
src = "blake3:166c4f485ea74434a6040cdb9256ab916e69146aa6b4f2f3f0730355218d4f9d"
text = "我一页页翻检旧记，寻到这两家同席的那一年，指着那行小字夹进纸签，捧到传信人跟前。我不挑破是谁弄错了，只将书页掉转过来朝向她，请她亲眼一瞧。她低头看完，涨红了脸赔个礼，转身回去改了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_3:event:check","text"],null]']
src = "blake3:4a608c8286c5038a502de39656c8ee7a2580fa96c8723beaeeabc1de8ab45e6f"
text = "翻检旧记找先例"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_4:event:assist","reply"],null]']
src = "blake3:85eef0d88b4a96f58008a611ea41653c65e5d7da8cdbf1f11098e96a9cdda808"
text = "老女房在帘内落座，我立在廊下，她隔帘唱一项，我照单答一项。唱至“马一匹”时，我回了句没有马，她低声提点：“报马代，莫言没有。”那来使听在耳里，暗暗喘匀了气。点验毕，她嘱咐我将“代”字写小些，紧贴在原项的右下角。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_4:event:assist","text"],null]']
src = "blake3:be3b1f75f9d4c370d99b5e44eac01082919653f7024d2a6ca8164f6dc34a783c"
text = "请老女房隔帘照看"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_4:event:check","reply"],null]']
src = "blake3:e0f17b6894ec2f7a32ac57737a584943e76826efefead2608230e88e57b93986"
text = "我让使者启开木箱，将物件逐一排在廊板上，钱串拆散了细数，每足百文便拿纸捻束紧一道。点讫，我在名簿每项侧畔落个小点，“代”字另用朱笔圈住。直到见我核验停当，那使者才敢把贴地的额头抬起来。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_4:event:check","text"],null]']
src = "blake3:302edb2b297d23a3a0e8aa021846dd9e71c04ab2a6209a21e02dfcbb6cfeef16"
text = "下廊去逐件核清"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_5:event:assist","reply"],null]']
src = "blake3:d3efbd7d02f2b59cae0f52756f31714a75a47976e465c97cd60e4f42a0351454"
text = "老女房攥住我腕子领着落墨：楷书的“殿”须顿笔，草书的讲究牵连，假名那路则要纤细轻淡。她罚我三样各临十遍，再从中拣出最顺眼的一字。等我挑好呈上去，她端详一番却道“使劲太猛，倒似讨债”，于是又补写了五遍。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_5:event:assist","text"],null]']
src = "blake3:f789f5498be989f7fae1711a953522bb7ea347a783e431c4d6b29ee50e43309b"
text = "请老女房逐笔指教"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_5:event:check","reply"],null]']
src = "blake3:1e51b20a000381879189a1daec93e6519e360d3e8791f040bc5973a7d8766361"
text = "我先打听明白这使者隶属哪一家、其主家眼下是何等身份，再检出旧岁予同家的复函底本，依着昔年分寸，将“殿”字工工整整落上纸面。老女房过目后，顺手把笔搁回笔架，并未再提笔添改。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_03_5:event:check","text"],null]']
src = "blake3:3956b75b3bdb0f489027986825def925f9c310bb93c8b76f4b22ac3c97021892"
text = "依来者身份定写法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_0:event:assist","reply"],null]']
src = "blake3:d9ede27e52ea17e138b8c7bec277a975ce6e9927c749fbab5428af874fcb5316"
text = "席散之后，执笔摊开怀纸，拿竹签逐句点与我认：何词归秋，须连几句；何词一座仅容现一回；何者必得隔开五句方能复见。他令我将这轮百韵从头理过一遍，挑出来的重出毛病，我觅出两桩，他却指出了三桩。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_0:event:assist","text"],null]']
src = "blake3:ee1a90e202146d131205f0fe39f04671518f6217eed5eafefc05bb8d3316bc8b"
text = "席散后请执笔授式目"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_0:event:check","reply"],null]']
src = "blake3:affe68cac91085228fdca33530f7e7108c6427b2a9103a483a2cfc3e46b79a12"
text = "待那句吟罢，我凑到执笔耳畔，压低嗓音点出三句前的那一句。他头也不回，只将笔尖在砚边一舔，朗声道：“这一句，还请再斟酌斟酌。”那客人略作思量，便换了字眼。满座竟无一人往我这处望。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_0:event:check","text"],null]']
src = "blake3:b9c3519a2a2d5eab8f4cbc091d1b9cb0abfcb413ae1247126c4f576e53ce0a29"
text = "低声提点执笔重出"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_1:event:assist","reply"],null]']
src = "blake3:9c7513a65bc18a3de2ccba1845b9d9e3ea10535bef6b23fa22ea307e5ee2f0fd"
text = "老女房听罢我吟诵那首，反问道：“你听这声气，像是谁的手笔？”我一时辨不出。她便把那位女歌人另三首诵与我听，才至第三首，我便觉出一般无二的收尾，尾句总要微敛着往回一勾。她颔首允了，着我照那女歌人之名落款。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_1:event:assist","text"],null]']
src = "blake3:f3a0127bc8ccf9ebf2463426c032e9434d63d6931ce4af9e7f64395319957813"
text = "诵与老女房听，请她定夺"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_1:event:check","reply"],null]']
src = "blake3:25502e70fe44b2a05dc3a22c1bba545310c200d81dbc8d453f7e76a453371524"
text = "我循着年份更早的旧本落了名，又于名氏右侧改用更细的笔批上“一本作读人不知”，字号不及正文一半。录完此首，我低声吟咏了两遭，愈发觉着这声口正是妇人语调。两帙原本相应的页间，我各别了一枚纸签，随新抄本一并缴回。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_1:event:check","text"],null]']
src = "blake3:5ad3333bbafcf182494e2bcd77f3091c8ab310e682dd76322122a65aa3164ce6"
text = "依旧本落款并注异文"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_2:event:assist","reply"],null]']
src = "blake3:d65d240c00e0af5951810378d010504f7ed7c519a319030d0d639fb61f25159b"
text = "执笔将韵书摊平于膝头，逐字指点与我细辨：读声相同的，未必同属一门；同处一部的，口音亦未必一般。他着我将今日现过的汉句末字抄作一列，再挨个去书卷里查索部目。待翻检至末一字，暮色早已沉了，油灯芯上都结了灯花。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_2:event:assist","text"],null]']
src = "blake3:9bd2e13599229c8e3cad89cbb6161739efd5203a1243c439f7ab7b1ff8864e99"
text = "请执笔授韵部之别"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_2:event:check","reply"],null]']
src = "blake3:e9e19e894ddbd1cc531b0bcdfa95da291a333d039142ff107e048e67af1f7a6c"
text = "我将《聚分韵略》掀至那一部，拿指尖抵住该字所在的那一行，轻手将书推至执笔肘边。执笔瞥过，便向吟诗的客人欠了欠身：“此一字，怕是借了邻家韵脚。”那客朗笑一声，随口易了一字。我阖上书页，掌心早沁满了汗。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_2:event:check","text"],null]']
src = "blake3:21120654957bd7c89af9dcc17396c2bf30af1af0632a345c19d127fed87c0485"
text = "翻检韵书指出出韵"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_3:event:assist","reply"],null]']
src = "blake3:f494fcccbe584f82af73b8a061a71da5fce814fb43660ddc8d52330aee10cd7a"
text = "老女房将我拣出的几张薄纸逐一叠好，迎着窗光细看，嫌这张太亮，那张太闷，末了仅留一深一浅两张。她复授我折结文之法：先对折成细长条，再挽个不紧的结，既须松活得便于解开，又不可松垮到自行散脱。我一连折毁了两张废纸，直待第三张她方才首肯。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_3:event:assist","text"],null]']
src = "blake3:16b2e8f4628d17f0f1efcdd7957539458240fbd21a553109b27f3333190c1da7"
text = "请老女房代为配色"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_3:event:check","reply"],null]']
src = "blake3:7474414ea6c807e6371526b426a1bd8dd054c8262f7ba4a6718f52d7542950a1"
text = "我移步廊下打量过庭前树木，回来择了张贴近叶色的纸衬底，面子上再罩一页清浅的，叫双层纸边微错出一线光景。歌写于表层，折成细长结文，缚在刚折下的一小枝树梢间。跑腿的小童双手托着出门，枝头叶片一路轻轻颤晃。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_3:event:check","text"],null]']
src = "blake3:dedb365fd1eb16ebddfeb5a5f9fea6d0f417cd1edcb5307c745f2b1944863c33"
text = "依时令自配纸色"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_4:event:assist","reply"],null]']
src = "blake3:0d74893742cbfd67755883ca605e75371c3ab74ee275d1bdb38d71dce2081c43"
text = "读师将一叠怀纸展开如扇，逐张指与我看：这张是从五位，那张是正四位；叠纸要循着品级由卑而尊，唱念亦然。哪怕人未至，席位却不能空着，原是“人不在，歌在”的规矩。他先教我理顺一遍，随后又拨乱了重来，直到第二回，我才算是没出差错。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_4:event:assist","text"],null]']
src = "blake3:d2988eaebde8fe43d1b660fabc86b0ab08d4de4aaf99d7a97385fb51c2c79d3b"
text = "请教读师该如何排"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_4:event:check","reply"],null]']
src = "blake3:18b91cf6d9f7582dba1810078ff5b62db6159222ba8acacc018ee3fed7883ab8"
text = "我将那几张未到场者的歌纸单挑出来，顺着纸上所署的官位，一视同仁地嵌进到场众人的那一叠里，既不置顶，也不压底。排定之后，又在各自纸背悄悄掖起个小角。待读师理纸时指尖触到折痕，便会压低声音知会讲师：这一首的歌主未在席上。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_4:event:check","text"],null]']
src = "blake3:cd474cd279e481bfd4bc4fc28ceef85931578a59251341916d771291e61a3b8d"
text = "照官位将留稿插进叠里"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_5:event:assist","reply"],null]']
src = "blake3:25748f3d75cb4b281921655d3682c945cac4cbf644cd421b886ceefb726dd816"
text = "老先生翻过那张断了的青纸，点着水渍说道，把这一角往窄里裁，专留给咏“天河”的客人——天河本就窄嘛。他按稳竹尺，小刀一气推到底，切口利落干净。我依样试着裁了三条，直裁到第三条边缘才算不起毛。他在旁瞧着，口中轻声吟一首咏天河的古歌，又叮嘱我将歌题用淡墨写上短册背面。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_5:event:assist","text"],null]']
src = "blake3:6bc559a3fdbdca316b03e6876d2d6b7deed64c55071cee4d4252f35561f1d5ee"
text = "请教老先生怎样裁"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_5:event:check","reply"],null]']
src = "blake3:6c3ed17dccddece9824c0be72decbf443d6b99d2a59bd2b9ad475819b456379c"
text = "我暂且按住小刀未动，先将七个歌题录在废纸上：星合、天河、鹊桥、梶叶、乞巧、七夕月、晓别。青配天河，白衬晓别，最明艳的赤色便留给乞巧；那截断了的青纸细细修作两条窄笺，正好分给题“鹊桥”的两位客人。老先生拈起一条瞧了瞧背面小字，也不作声，随手将它插回竹筒里去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_04_5:event:check","text"],null]']
src = "blake3:122fe5d84ad60dc12d0e2823884b9aa0cb7bdad38457cfd9ad3d156c1dfdc6db"
text = "照歌题自个儿配色"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_0:event:assist","reply"],null]']
src = "blake3:c0e4b47a2c64b0e66ad81b939d58e0b8fb380af2bbaedccb3b8f09d70e8919d9"
text = "老尼拈起香筯夹住那两粒碎屑，置在指腹轻捻几下，分别送至鼻端敛息细辨。她道那带辣意的一粒贴近树皮，含油既少，气味便冲；甜的那粒则是木芯所出。她教我也照这般捻过、屏息、再闻，反复三回，我总算分辨清楚。末了，辣的那粒被她归入了第十包。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_0:event:assist","text"],null]']
src = "blake3:34d34b409e8367316e88d0b528af03d6b3173990c9d4514dcde5d0b7dfde082c"
text = "请老尼嗅过再分"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_0:event:check","reply"],null]']
src = "blake3:1b7dbdf199098de1d5c68afe5c67287ef8fe4540416741a7c56a5a3e705f284c"
text = "我并未惊动老尼，径自将十包碎屑逐一拈于指尖轻捻，嗅定后再归回原处。带甜的、发辣的、微带焦苦的，尽数在纸面分作三列排开。第七包里那粒辣的拨入第十包，第九包中也捡出一粒甜的放归第三包。待号数落齐，老尼进屋来，单拆了第三包一闻，随即又照原样折妥。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_0:event:check","text"],null]']
src = "blake3:a472b94e6b80e31c0e2a54c5803ff0653cc694f07629b868dbe092067bca3a15"
text = "先捻再嗅，自行分包"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_1:event:assist","reply"],null]']
src = "blake3:4cff42ce2d9d67f75a1b989705e0693ea47e7de8b125fdf4d4ab7fe1ba7ed2d0"
text = "掌柜把两样各自掂了掂，说薄螺盖乃生甲香，黑亮的是兑了酒与蜜煮过的；方子里单写“甲香”，向来只用煮过的那种。他拿生的那块递来一闻，腥味直冲鼻腔，活像退潮后的滩涂。我称足一两黑的，他在方子边角添上一个“制”字，说往后任谁来取料都不至于岔错。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_1:event:assist","text"],null]']
src = "blake3:4524a758b2ea44b511b84abac364972089f7224b4560108213e14369a170730e"
text = "捧着两样去问掌柜"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_1:event:check","reply"],null]']
src = "blake3:553198df4f1b3338078d78735b05eb8b399ff4459eaa2b2dac749d950a65c52b"
text = "我各自拈取少许置于掌心搓暖了细嗅：薄片透出一股浓重海腥，黑的那种却把腥气敛住了，唯余些许清甜。合香所用，断不能要那海腥气。于是我称足一两黑的，又另寻一只空罐把生甲香倒进去，顺手拿炭条在罐口描了个“生”字。掌柜点料时瞥见那新罐，一声未吭，顺手将它搁上了货架最末一层。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_1:event:check","text"],null]']
src = "blake3:1cd2563de79f8b4cc95b9ba7589c1d9852e7865cc0cc9918b328f8f73fd272d3"
text = "自个儿搓热嗅过再称"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_2:event:assist","reply"],null]']
src = "blake3:b569cd42164755e99f1956708abc7f08b25a3ddcf920db98a258310163404876"
text = "老女房将香炉凑到我耳畔，令我细听。香灰底下的炭团未熄，隔一阵便有一丝极微弱的轻响。她说直听不见声息，再拿手背贴壁默数十下，确认凉透方许入箱。我俩并肩坐定，她逐一教我拈出银叶，以软纸拭去上头沾的油渍。待到第三只炉里彻底静下来，屋宇外头早已掌上灯了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_2:event:assist","text"],null]']
src = "blake3:3609e17b9cd9a0c531140f7b3fdd2fb44bfc32c1da505adfb70d25f4b44ba614"
text = "请教老女房怎么听炉"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_2:event:check","reply"],null]']
src = "blake3:6d51c962d7fade880208d6c30215a2e412df3aecb1101c60448b8513009a9950"
text = "我将三只香炉移至檐下通风处，不动灰面，先拈出银叶拭净收进小盒。而后隔上片刻，便拿手背探一探炉壁：第一只已凉，第二只犹带微暖，第三只倒近乎烫手，大抵是它的炭团偏大些。凉透的那只先收进了箱，余下两只延到末了。待老女房回来时，箱子已码上了架，她揭开一只闻了闻，又照原样合住。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_2:event:check","text"],null]']
src = "blake3:bf6407ec6e2ce987abfd1fcfb1cffe7b93060304327aace008c67b5bfc1e16cc"
text = "手背试温，自己来收"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_3:event:assist","reply"],null]']
src = "blake3:775fe2c7ee886ff846d1390e7a5dc1048227cca3e635b62c9806b50f4593dcdd"
text = "师傅捧过一碗清水，将那十三块木头逐一投进水里。内中十二块皆缓缓沉入碗底，独留一块飘在水面打旋。他说沉香因脂膏沉重，方才得名；这漂浮的货色，是有人涂漆作假冒充的。他教我拿指甲轻刮那块木背，果不其然，漆层底下露出的全是白生生的寻常木质。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_3:event:assist","text"],null]']
src = "blake3:effe1558cd5e3b5169a679cbb4106124083d21fd7460f0c76b27e8f3a1945978"
text = "请教师傅怎么辨木"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_3:event:check","text"],null]']
src = "blake3:a6c5fd054d9fadfbdd5100d787ca47788b99be1472df48443f598674f3680885"
text = "刮末烤香，亲自来闻"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_4:event:assist","reply"],null]']
src = "blake3:a0350ef5ba57794a6e94a5eeafa2d836b0f359897c142121e1e15f38efd0574a"
text = "女房拈过纸条迎着窗光细看片刻，言道墨色深浓者是她拿新笔蘸墨写的前几炷，自第六炷往后墨迹便渐淡了；复又点着右斜的笔势，说是末座那位老翁的笔迹，因他手腕微颤所致。两相印证，这一张合该归在第四炷。她将纸条交还于我，嘱我嵌进叠中，整整十张，果真一张未短。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_4:event:assist","text"],null]']
src = "blake3:525f69960767dc3413c8d1f08cdc35987f54f1d04db2e713bd093aec4170b58e"
text = "请执笔女房来辨认"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_4:event:check","reply"],null]']
src = "blake3:d5fde9b23a5043c9aa3c765a45a9f997e0f6adc4bdfffc665cacbc9bd6f48174"
text = "我将同一位宾客的十张纸条尽数拣出，依墨色由浓至淡排作一行。那张洇花的墨痕浓得发亮，摆在第三张与第五张之间恰能接续。誊录香记时，我循着出香次第将十炷气味于心中再过了一遍，随后细数那位客人的作答：十炷猜中七炷。女房审过香记，在其名下画了个小圈，称今日独他得了头奖。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_4:event:check","text"],null]']
src = "blake3:7e088aa5766e60d93d10735ddbe4144f2e3007422a84d12fd70f705f4ddbda3a"
text = "对照墨色自己理"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_5:event:assist","reply"],null]']
src = "blake3:e2f5f258481632ed2b0ec6dd3f5ce04b3bd55a2648f5405fae99bf33b1e16977"
text = "老僧在廊下阴凉处架起竹匾，离地一尺，嘱咐香材只可风干，切忌日晒。他教我把丁子一颗颗剥去白毛，生得深的那几颗干脆丢入炉中烧掉。沉香拿新白纸包妥，外面再裹一层，收进炭筐边的桐箱。我忙到中午才停手，指甲缝里满是丁子的辛辣气。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_5:event:assist","text"],null]']
src = "blake3:5874574df2970a3fe822232e2da20569d902667ec792809437cfd845203e0ebe"
text = "学老僧那般摊晾"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_5:event:check","reply"],null]']
src = "blake3:a778a1e19a4ce2eac5cb8a2234050c9802fac6917fbc2e1c4904726965c6b2d4"
text = "我将香材分作三拨：丁子、桂皮这类质硬的，铺在廊下当风处；沉香与白檀用纸包妥，移入阴凉里间；至于麝香和龙脑，锁回小匣半点风也不教透。生了白毛的丁子单独拣进一只碗，留待老僧察看。他翻拣出几颗尚能用的，余下的全倾进了炉灰。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_05_5:event:check","text"],null]']
src = "blake3:af7184345ca4248fc7255106d555a93a90141c5a85117376f55210df2350314c"
text = "按香性分开晾放"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_0:event:assist","reply"],null]']
src = "blake3:6bafb0fb2fa2762727a24212f9a7cdf3d3d25e4fabd8ce993066e057eb24b64b"
text = "师范压根不使尺。他先面向樱树行了一礼，讲懸木乃此场之主，入场前少不得拜会，随即便打树根起脚，口中默数着一步步量到柳树。他唤我尾随其后踏着他的足印走，嘱咐步幅务必齐整，半点偷懒迈短不得。这般步量下来，柳树果真靠里了半步。园丁抹了把汗，转身取铁锹去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_0:event:assist","text"],null]']
src = "blake3:824bf96c58f6e7270771b2f029392566b4c2361108adc96ee0c89470cfc08748"
text = "跟着师范迈步去量"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_0:event:check","reply"],null]']
src = "blake3:2b2dab52313477641901ba016bf8eb210bddfa6b4f0c536a0a5956cede9df4c9"
text = "依鞠道规矩，四株懸木原该等距。我寻了根长麻绳，先牵四边，再斜拉两条对角：四边相去无几，对角却短出了一截，正是柳树往里缩了。我又从柳树下起步跑向场心，纵身一探，指尖竟触到了低垂的柳梢；换去枫树下跑同样步数，连片叶子也摸不着。园丁登时哑了口，师范则卷起麻绳，顺手挂回腰间。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_0:event:check","text"],null]']
src = "blake3:686e7d7ccd483a1536ef8f1baf124627b31da62f0396abda003f4ac2fc115049"
text = "牵绳量对角，自己试看"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_1:event:assist","reply"],null]']
src = "blake3:13d0c81c011ff4803322bc72f1ab8fa6ef453923d5d44af9664c64151303d7f6"
text = "老鞠足先嘱我拭干袖口再递，说捧鞠须用双手，切忌单手提拎，更不准打旁人头顶越过。他顺缝口拨开一指宽的隙，朝里填进一捧干麦粒，道是鞠皮边收水边缩，腹中若无物顶着，晒干就塌成面饼了。随后他吩咐我把鞠悬在背阴屋檐下，每隔半个时辰调换一次朝向，万不可见日头。我翻来覆去转足了七遍，指腹触上去总算不黏腻了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_1:event:assist","text"],null]']
src = "blake3:50e6554025aaab7f8e9342ba67ce24064899fff672818f211da47d67ba0811cd"
text = "请老鞠足指点晾法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_1:event:check","reply"],null]']
src = "blake3:b4d4cb3802fa62351cccf847e71c98916715fa7dc27da32b5e2ba353c7aaf1f7"
text = "我记着制鞠人曾言鞠皮最忌暴晒，便觅来细绳，将鞠挂在仓房北檐底下，下方放一只空盆承水。隔不多时就去用指尖探按一回，哪侧按着偏软，便把哪侧转去朝外。临近傍晚，鞠皮已干硬七成，圆样亦毫发无损。老鞠足拿去朝空中轻颠一记，再接住时声音已然清脆。他将鞠抛来给我，我使脚背连颠十下，半下不曾落地，这才双手奉还。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_1:event:check","text"],null]']
src = "blake3:d634d88c9bb1d44b38ce34ab2062978dad01b176eadfe66b078c53796daf5747"
text = "自己寻背阴处挂起"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_2:event:assist","reply"],null]']
src = "blake3:b6999d8d09c73ed23d07ced3ea5ba9273fffa3bc1e8054f704690a198614674b"
text = "师范踱步过去，先向那幼童施了一礼，方道松荫下的位子须得连守整局，甚耗气力，请若君暂屈驾去柳下替他照应片刻鞠路。那孩子听闻是替师范效力，立刻挺起胸膛去了。师范随即示意我去松下补缺，顺口压低声音提点：调位须先圆好由头，位子名义上仍归他，权当暂借一遭。我镇守松下，一整局下来双腿半刻未得歇。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_2:event:assist","text"],null]']
src = "blake3:9e3a94de950a8a84f55c6db71a63f02421db8bbba3d986f67dff0e0aa71e60d5"
text = "请师范过去开口"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_2:event:check","reply"],null]']
src = "blake3:2750cead173c5bf44ce765e1e330869cd306a1ac40521fbbae633d04ad5a1b17"
text = "我走到那孩子身旁，讲柳树底下坠鞠最频、最难周全，问他可有胆量去守。他听罢拍起胸脯便应了。他一动身，松下出了空，我便在松、柳二树间来回奔跑，凡他够不着的鞠全由我接应。待他在柳下头一回把鞠稳稳接住，四周齐声叫好，廊下的主人家也含笑颔首。散场之际，师范塞给那孩子一只小号的练习鞠。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_2:event:check","text"],null]']
src = "blake3:85a92c6fe5e169ef918e900e00050cfc2553e95478f683362f05d0b651442310"
text = "寻个由头哄他挪位"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_3:event:assist","reply"],null]']
src = "blake3:c207170f7902d8c28347b80619afde3294e6ce6c2d2cbfe8ebffc44c3bc1237b"
text = "那鞠终归还是砸了地。散场后师范唤我到枫树下，拿折扇在沙面划出八个圆圈，讲明鞠一走高，左右两席须得齐动，一人上前追接，一人补实空缺；哪怕是上座踢出了界，亦归下座跑去兜底，半句怨言不得。接着他抛鞠、我走位，反复练足二十遭，我方才不再迈错步子。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_3:event:assist","text"],null]']
src = "blake3:28de61bbdba0f932047323231e4bf3d44f2dcb93b93021813fce02442131724a"
text = "事后向师范请教补位"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_3:event:check","reply"],null]']
src = "blake3:f5ae9212e2d20cb703c484fe9df858179427b730c4547eafc95563830702272e"
text = "我并未盲目追向鞠落之处，而是斜刺里跨步填上那系鞋带者的空当，先把他的防区兜住。那鞠恰好擦着松枝坠下，经枝叶一阻，不偏不倚跌到我身前，我抬右脚背轻巧一挑，便将它送回场心。对面那位客人当即鼓掌大笑，方才弯腰系带之人这才抬起头，涨红了脸向我欠身致意。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_3:event:check","text"],null]']
src = "blake3:b9898002e6a5e81143a9c4c7bdc5eb91d15533bcaeb0fb0d199071b19831c652"
text = "抢先斜插去补住空位"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_4:event:assist","reply"],null]']
src = "blake3:1422c21d1214b0dfa3027bf1bab280381ae78ddc0f6706858ddea71d677c333b"
text = "庭役单膝跪在柳荫底下，拿备用带子绕过我脚踝兜了两圈：“先压后挑，结口朝外，踢起来才不磨脚。”他替我绑妥一只，令我自己系另一只，见我动作生疏，便按住沓跟耐心候着。待要重返鞠场，我一时急忘了先向上座欠身行礼，他立在身后轻咳一声提点，我连忙补行了一礼。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_4:event:assist","text"],null]']
src = "blake3:979c44fc827454420ad2d3a314fe9fcfacd029cd94a22604ec0c70c067bf7d39"
text = "请庭役代为系带"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_4:event:check","reply"],null]']
src = "blake3:b0ce388dc7cd17ccae05e4c80031ad2be5ac8aca8a49ee1984b1ba9e0f352a06"
text = "我将鞠传予下家，趁着那一记去势顺步退入松树后，先向上座欠身施礼，方才蹲下换带。备带取的亦是浅葱色，与先前断掉的那根无二——色泽原是按段位规制定的，错用了少不得挨训。刚打妥两个结，鞠恰巧兜回我这侧，我扬脚稳稳承住，口中清喝一声“呀——”。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_4:event:check","text"],null]']
src = "blake3:edc456e38719bcae9fec12b2e531ccd31ca872fa4a1d6dfbf4204369f524b67d"
text = "依规矩退场换带"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_5:event:assist","reply"],null]']
src = "blake3:40c97926ba000938481732213ca93dff2f36cd78d5f07e18f94e096568446911"
text = "庭役递过另一把竹耙与我，嘱咐我缀在他身后半步：“倒退着步子，耙齿朝己身这边牵。”他梳一道，我跟一道，间或回首审视我耙出的沙痕，拿耙背顺手压平我漏却的一只脚印。方才客人在中门叙别之际，我险些便俯下腰去，全亏他使耙柄轻点拦住。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_5:event:assist","text"],null]']
src = "blake3:a4c3f68efa238c7018e4abd54d4c622c0ad936b0cd99eaf58f736e3d15363ccc"
text = "随庭役学着耙沙"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_5:event:check","reply"],null]']
src = "blake3:2e5c075a4ba2621c7c68a5fbbb6d9b684ac26a0c6803acc5f61e97beb7c6ad5e"
text = "我立定柳树底下纹丝不动，直待末一位客官的衣摆隐出中门，方才抄起竹耙，打樱树那一隅起手朝外倒退着梳理，半步不踏回已整过的沙面。浅坑填实，乱印逐道抚平；至于枫枝头那片悬叶，我踮起脚尖捻下揣入袖笼，免得它坠污了沙地。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_06_5:event:check","text"],null]']
src = "blake3:e1347c5c6b1db133b5795870cce022ebe96b8f2e57edc7345f02c96a199a54f2"
text = "待客过门再耙平"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_0:event:assist","reply"],null]']
src = "blake3:ec7466fe0a8fc18db25d0777845bac6d4571c4feb885806646350f58383ab1a1"
text = "老僧拽着我的袖口，一畦挨一畦领着走：“先闻味，再翻看叶背，花要放到末了才看。”他让我捻碎一片十药，那股腥气直往鼻子里冲，熏得我直皱鼻尖。他笑起来，说记牢这味儿，一辈子都不会认岔。行到水畔那两丛芹前，我才伸出手，便叫他按住；他自己拔起一株，拿给我看根上的节。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_0:event:assist","text"],null]']
src = "blake3:c43575dc271ff28e3bf5bc579325b52c90b694b92a240831c65a46648f9705d6"
text = "随老僧逐畦辨认"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_0:event:check","reply"],null]']
src = "blake3:280c637f7e884c7d834ef715260e9642dabec37bee41db6c8872e0518280036f"
text = "我逐畦蹲下身细认。捻片叶子闻一闻，发腥的便是十药；拿舌尖舔一点叶梢，苦得舌头发麻的是当药。就数水旁那两丛芹最难辨，其中一丛茎上生着紫斑，我没敢把“芹”插上去，先空着指给老僧看。老僧拔起一棵瞧了根，点头道：那是毒芹，牛吃了都得倒。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_0:event:check","text"],null]']
src = "blake3:a080087c007aa2b8304d78ca2ee950a0dc1f27604ec9604a3a545f89f93743aa"
text = "自己辨叶把名札插回去"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_1:event:assist","reply"],null]']
src = "blake3:a58c0f5c47243446ed89cb887065abed513b8f05e8f9dba1f22c6ba83a325094"
text = "庵主听说后，从柜中拿出一包晒干的接骨木叶，吩咐我煎作浓汁，趁热把布浸进去：“绞到不滴水再往上敷，一凉便换。”瞧我接连换了三遍，她又教我捣艾的手法，说手腕莫使死力硬按，须由着杵借它自身往下坠的力道。乳母在旁瞧着，口里只是不住地说使不得、使不得。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_1:event:assist","text"],null]']
src = "blake3:65e3df4d1137e407e954d9dd728c446dc1a987bcdd75c7ae00cff34ec4711b2e"
text = "请庵主指点如何敷药"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_1:event:check","reply"],null]']
src = "blake3:79443672977c1ac35785989d7879d33067b3e31f0c43ed37c4f5be600a474054"
text = "我接过杵，先把艾捣得叶脉碎尽成绒，筛过一遍，再接着捣。歇手的工夫走去灶旁，将一块老姜研成泥，拌入少许米醋，拿布包好敷到她手腕上。乳母“哎哟”一叫，先是说凉，过得片刻又说暖了，左手便不再往袖里缩。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_1:event:check","text"],null]']
src = "blake3:d9b1df6a158a0b6dbfbfd5adcd364d7d3207f543bb8aaac068194c2a5fea0cf2"
text = "把艾草捣碎，替她敷好姜泥"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_2:event:assist","reply"],null]']
src = "blake3:4b872a8a9cdee352ba674872d903a37f2533f5de6fef6d351f9bb47a90080dc7"
text = "庵主走出来，将每个人的手心一一摸过，碰见最凉的，便吩咐我先顾那一个。她教我姜得切片、莫切丝：“丝煮烂了，辣气也就散光了。”又令我往汤里调进一勺葛粉，搅得透亮再盛。我端了碗逐个送去，送至小尼跟前，她两手合捧住碗，再不发抖了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_2:event:assist","text"],null]']
src = "blake3:9a63100730507e5032c0b4f021026878050be81e763ec3d74fb919add7a33cb5"
text = "依庵主嘱咐煮姜汤"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_2:event:check","reply"],null]']
src = "blake3:55fecd79264c03f823b54afe445c290b311707e703dc4c8e264bc5631408b68d"
text = "我接过经匣置于高处，剥下小尼那身湿衣，取干布由头到脚揉搓，直搓得皮肤泛红，便裹上我那件备着替换的单衣，推去灶前。又切了把姜，同葛粉一并下锅搅匀，熬得浓稠了，先盛一碗给她，再分与其余人。至于我自己，是排到最后才换衣的。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_2:event:check","text"],null]']
src = "blake3:f7ac8ed274032ddf2a4fc2db4ffc86ca5bc1b57fcbbe04eca02d8a09d5d0c015"
text = "先给最小的换身衣裳"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_3:event:assist","reply"],null]']
src = "blake3:c52059b9a0c4acd9f11241c327061297c811ccbea167f54cea6e43652c80061a"
text = "庵主先拦住我不让刷，叫拿木勺将缸底的泥刮出来，倒在菜畦旁：“这泥肥，莫糟蹋了。”随后教我只使灶灰，用不得河沙，沙会把缸釉刮花，花了的地方日后反倒更易生苔。等我刷罢，她将手探进去摸了一遭，在一处仍发滑的地方叩了叩，我便又打那里重新刷起。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_3:event:assist","text"],null]']
src = "blake3:529008359e655882c06065d486bf3f3621da5a334c3203468e20d71eabd2b4ba"
text = "向庵主请教刷洗之法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_3:event:check","reply"],null]']
src = "blake3:a89775425b92c7ecda3b38ddf86602f7c2f4f9babf30f2897f81b1f4342a5dda"
text = "我先将缸放倒，拿棕刷蘸了灶灰绕着圈细刷，直刷到指甲缝全黑、缸壁摸着发涩，方才用清水冲干净。缸口迎着日头晒了一下午，傍晚挑来新水灌满，投进两块烧透的松炭。次日一早舀起一瓢迎光细看，水清得连瓢底的木纹都看得真切。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_3:event:check","text"],null]']
src = "blake3:715eebda5da72ac22acee778580e88b31b666f80e272e0401a38f1997f53e72c"
text = "刷净水缸晒干，再放炭"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_4:event:assist","reply"],null]']
src = "blake3:dcdf96eb81a1d37eff8891b6fb15ec19cf900c7b0b49467b3933ac0bbdfa20c8"
text = "老尼端出热水，嘱我凉到手指探得进去再用：“泥得轻沾，擦不得，一擦口子越发不成样。”她领我去墙脚认过艾草，掐下嫩梢揉出汁水敷上，又教我拿布条斜着绕裹，一匝压半匝。头一遍我缠得过紧，伤了的人直抽气，老尼便解开布条，叫我再缠一遍。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_4:event:assist","text"],null]']
src = "blake3:4e302ed1f39069c5f66bbb25d315289fbeca8af1a75a9bb310136526a87436a5"
text = "向老尼学裹伤"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_4:event:check","reply"],null]']
src = "blake3:5646a7f9275a4c7d91e68fd29ca42f5de3907ee7ec96738fafd6acdeffc5036e"
text = "我先取来温水和洁净布巾，将伤口上的泥一点点蘸净；遇着嵌进里头的砂粒，便拿挑刺的竹镊子夹出来。受伤那人咬紧了牙，半声没吭。我又到墙根下掐了把嫩艾，嚼烂敷好，外头缠一层白布，特地在伤口旁侧打结，省得一动就磨着。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_4:event:check","text"],null]']
src = "blake3:c34e0f48f3c6275042d147f55775adaeaaf7135eaf733f01463e5d8ec211b368"
text = "先洗净伤处，再敷些嫩艾"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_5:event:assist","reply"],null]']
src = "blake3:8cccd3a1e0afce68618661f85726230a18b30c69837e5304f7fe138eba316780"
text = "老尼叮嘱我，头一遭守这一班别硬撑，她就歇在隔壁，敲两声板壁便会过来。她先教我听病人的呼吸声：若又急又浅就添床被，见了汗便撤下；药罐盖得斜搁着留道缝，“闷在里头煎，药苦得实在咽不下。”丑时我敲过两回板壁，两回她都过来了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_5:event:assist","text"],null]']
src = "blake3:aaf2f7063fca51abf8e51e3b9a9ee587d0b8cd7113fa6161f4e8f5a3768eda18"
text = "劳烦老尼在隔壁照看"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_5:event:check","reply"],null]']
src = "blake3:1a18c435591b2169a4c4f9420740bc47cc3007464c50e30509daadf08aff11c6"
text = "那一格我应了下来。入夜守在炭盆旁煎第三服药，紧盯着药汁色泽，刚转作琥珀色便端离火头，连滤两遍。湿布每隔一炷香重换一回，顺手探一探病人的额头和手心。过了丑时烧退下些许，我翻过木牌在背面记清时辰，天亮交予庵主。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_07_5:event:check","text"],null]']
src = "blake3:bb8e9e1dfb66c494b04e0c6d6e5c946dc62d665a0593df08c767baae236380df"
text = "最冷的那班由我来守"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_0:event:assist","reply"],null]']
src = "blake3:d42905b76165ec1b4f36e5ef0ddee56b2119f8dff520544f1e375e6a3f57101b"
text = "庵主将袈裟移到窗下，拿指甲沿着开线处摸了一遭：“本寺的物件，补得比原样还鲜亮，同样是失礼。”她要我循着原来的针距缝补，拣旧些的丝，宁可色淡，切忌发亮。烛泪则教我拿浸过井水的凉布压片刻，等蜡一脆，指甲一弹便掉。折起来时，一半她折，一半我折。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_0:event:assist","text"],null]']
src = "blake3:bce7412b04b4228c4cfd9b11cdbf036e68017fd766e4797f87925c10a2c0377e"
text = "请庵主过目后再行修补"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_0:event:check","reply"],null]']
src = "blake3:aa8937a9f37c17da576b171d502735351dfa6eb54c69c24148a383fc83358b2b"
text = "我先拿钝刀背剔去烛泪，垫一张吸水纸，隔着布用火熨斗烫过，余蜡全洇进纸里，半点印子都没留下。脱线的地方拆到两头牢实处，换上同色丝线，数着原来的针脚一针针走过去。收折时沿着田相的格子一格压一格叠齐，裹进袱纱里，另附一张纸写明补过哪里。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_0:event:check","text"],null]']
src = "blake3:46877f7e594a71e5e3bf7d371024832c6aec989009eb93a7bec6491417288148"
text = "先把针脚补妥再奉还"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_1:event:assist","reply"],null]']
src = "blake3:a66f52bd7615a439161022b3b20d91f605183db6e1b2350baa24957865d6c5f8"
text = "老尼逐块摊开余布，指给我看：绢织得细，留下来补绢衣；绸边软和，给孩童做带子；里子厚实，拿来垫在补丁底下。“布头得记清是谁家的，下回他家再拿衣裳来补，先使他家的布。”她吩咐我在每卷布头上别张小纸条，写明衣裳主人的名号。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_1:event:assist","text"],null]']
src = "blake3:47860d48b452870cbc49440f9be3f0d78ff687c79426869e406b01ce755ed7fc"
text = "请老尼教我怎么分余布"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_1:event:check","reply"],null]']
src = "blake3:2381ffecfc4651d9527eafa38ee9e19e541c9c7276e843e8ac709e58652371f4"
text = "我照着颜色和大小把余布分门别类，剪得四四方方。挑最大的一块缝成只小巾着，拿一截布边穿在袋口作抽绳，连同补好的衣裳一道送还，交代是拿来装药丸的。零碎布头卷成捆扎紧，放进老尼的零布笼；厚里子则留下，等下回垫在补丁下头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_1:event:check","text"],null]']
src = "blake3:97816443f9c1838bf21d9e4ed4f2fe9f1b8732b3e9bdf3ea266c816eaa3dbfc7"
text = "理好余布，缝只小袋"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_2:event:assist","reply"],null]']
src = "blake3:b7786cf3b81cd65e88a00a81309194c23bf1b0394655ce981319add9d99796ae"
text = "老尼并不急着乱找，先查问前一个动盒子的是谁、在何处缝的。得知是在廊下，她去药柜里取来一块慈石，拿线吊着，贴着席面缓缓拖过去。慈石在门槛边“嗒”地一蹦，吸上来一根。余下那根她让我自个儿拖，我拖过半道长廊才寻着。点清之后，她教我往后每缝罢一回就数一回针。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_2:event:assist","text"],null]']
src = "blake3:abf5f752b244f4b31055eacdc2191693034811aca9c0330ac458764db22d28fd"
text = "请老尼教我寻针的法子"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_2:event:check","reply"],null]']
src = "blake3:f8338a87b28191a4b752eb8c6fd55afc593e03fe7ba4c254d330821e03adc1b7"
text = "我将盒里物件逐一拿出，摆在白布上，针按粗细排开，线照颜色归拢，复点数了两遍，果真短了两根细针。随后拉严纸门使屋里暗下来，端盏油灯贴着席面一寸一寸细照，借着针尖反光才好看得清。一根卡在门槛缝中，另一根别在件补了一半的衣领上。我在盒盖内侧添了行字：针二十一，用完插回。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_2:event:check","text"],null]']
src = "blake3:8f39376b549e2e8ed244c35e1b5c8c63fd3abb26a8ec16e68c8c5c66c741f244"
text = "盘点针线，挑灯找针"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_3:event:assist","reply"],null]']
src = "blake3:d07bdefcd7bc1a8fcb3e95df1c24e39d3f84b14d500072bd8a309ce3cc310d3f"
text = "禰宜的妻子用炭条在木板上划出三栏：打天亮到午后靠窗缝直边，不动灯；掌灯之后专做神纹那几针，谁觉眼花便先退下。她派我坐到灯影边缘去锁户帐的下摆，瞄了两眼，嫌我针脚一长一短，拆掉三寸叫我重缝。熬到亥时灯熄，那三寸恰好缝齐。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_3:event:assist","text"],null]']
src = "blake3:c972df25ee45a24dddd40c250876c657213cd532d01ac602f65c96ec5012f842"
text = "请禰宜的妻子来排班"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_3:event:check","reply"],null]']
src = "blake3:fdefcccfa48dc71c9f4feb34a820c8a63303d04ff2b70c44517c5a2d0d64e716"
text = "我把待缝的活计拆开算清：四丈直边使粗针，大白天移到廊下去做；户帐当中那块神纹最耗眼神，留给有灯的两个时辰，由我亲自来绣。妇人们轮流在窗下赶直边，我守着那盏灯，一针接一针将纹样的弧线走圆。灯油恰好耗尽在最后一针。那块排班木板我挂上了柱子，下回还用得着。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_3:event:check","text"],null]']
src = "blake3:b3a44d27665db90faec771b38ac980350ad782f78b8fbac5b397ea242f018496"
text = "排定班次，灯下细活交我"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_4:event:assist","reply"],null]']
src = "blake3:f1f64778c59797d22d7000e94a20846c1c1294ef990efcd948410e3a557d5836"
text = "老巫女坐在廊下指点，我跪在柜旁动手。她教我先往柜底铺一层捣碎的炭，再垫张涩纸，衣裳依着厚薄叠起，厚的压在下头。待我补那布子肩头的霉斑，她伸手捏了捏，说缝绵衣切忌一路走直针，得隔一寸回一针，里头的绵才不往下坠。我将线拆了重缝，她方才点头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_4:event:assist","text"],null]']
src = "blake3:2a83e58d4ccdbddb4df0ce60e227932392a14219105acd70eb9f188a68a762db"
text = "随老巫女学装柜"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_4:event:check","reply"],null]']
src = "blake3:378421a5ca72d849586fcaf64e1174628626fda6dad2e97d316fdb1a4e2d7fb5"
text = "我拆开生霉的那块领口，抽出绵絮拿去晒，布料使米汤水搓净再晾干。缝回去时我顺着绵絮走向，一寸一行压紧线，免得它在柜中结成疙瘩。柜底铺炭、垫涩纸，各层衣物之间夹上白纸，柜盖内侧由我记下从上到下各是哪件、哪日收的。老巫女看过那张单子，说明年开柜不用再翻找了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_4:event:check","text"],null]']
src = "blake3:28bd16fd869eb2575f1cc83828ef9afef9045ceb7b0734b4f4e4f1519bf9e4ac"
text = "拆洗霉处，由我装柜"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_5:event:assist","reply"],null]']
src = "blake3:ee78cf5b22c4c25a70ef85452a3845f7f31f6ac72b0c2be6b3b99d6d9af49f89"
text = "禰宜的妻子打余布筐里挑出块旧幡改的麻布，又裁了半幅褪色的紬做袋面，说这两样料子不心疼。她比量过连歌师那几册书的宽窄，一剪子裁下去，多余边角收回筐内。我缝两条侧缝，她缝底角，底角足足缝了三层。连歌师拎起袋子抖了一抖，说比他旧的还轻巧些。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_5:event:assist","text"],null]']
src = "blake3:c2bfff360229f29bfc92ab0c8e83c2b7994ac0debd17224dbd99e52530ad91bd"
text = "请禰宜的妻子裁一裁布"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_5:event:check","reply"],null]']
src = "blake3:16f3ad6f61f6b7d6c039247d21f9b6983ab9b124f6a9e9d79af61734edcd85ef"
text = "我先量他的书：最厚那本式目有两指宽，外加三本薄的歌稿。余布筐里有块旧幡改的麻布颇结实，拿来做里子；袋面拣半幅褪色的紬，经磨又不显脏。底缝我走了双道回针，袋口多加一片盖布，并钉上两根带子。连歌师将袋子挂上肩，来回踱了几步，说书装在里头不晃荡了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_08_5:event:check","text"],null]']
src = "blake3:fa88db96b43e910dcb937020c10a0eca3fe05f77ddd8805ccb2ccb2df3da97c1"
text = "量书选布，由我来缝"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_0:event:assist","reply"],null]']
src = "blake3:7d92b702fae2fd8fdf501539675b74b239981218254b35effc235dfde088d0bd"
text = "岬寺的和尚晓得补陀落舟是从哪片浜动身的，他先在纸上绘出岬角与那片浜。我依着老渔人所讲，添上引船松绳的所在，再追问他那日日头在哪个方向、船行了多久才瞧不见。和尚把潮路画作一条向东拐的弧线，我在弧线侧旁注下一行：日出后约摸一个时辰，船过了小岛。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_0:event:assist","text"],null]']
src = "blake3:7242369fdf1d24450776377e77e5fcd5251f1b1b0055d8278605ebfa556f082e"
text = "请岬寺的和尚搭手画"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_0:event:check","reply"],null]']
src = "blake3:505915deb088705ef91839aced5c2f8e33097ae12ab601c0759cb043162ef1c9"
text = "我问得极仔细：松绳时日头落在哪侧肩膀上，船过了哪一座小岛，多少工夫才缩成个黑点。老渔人越讲越缓，手指在半空里比画。我在纸上绘出岬角、他立脚的那块礁、松绳的位置，再顺他说的方向画潮路，往东一弯。他盯着那道弯瞧了半晌，把拐弯处向外拨了一指宽。这张纸被我折好收进了怀里。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_0:event:check","text"],null]']
src = "blake3:9840bc5f507658d85e0abaa7e0425fa23f865061e2d1f019b693049285aab935"
text = "顺他说的绘出潮路"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_1:event:assist","reply"],null]']
src = "blake3:f6071b4c2d3ab9658bf599fd406368bb75f8ae3d326b54d6def69e444c41251c"
text = "老船头盘起腿坐着，闭上眼将那段海路打牛窗向西背了一遍：先过哪座岛，岸上有座白崖，崖底两棵松，那便是要靠泊的津。我顺着他念的在纸上勾画岛和崖，念至“七里”时他睁开眼，说津名他一时也记不真切了，便照山的样子画上吧。我将白崖与两棵松绘得一清二楚。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_1:event:assist","text"],null]']
src = "blake3:4abdb2834903c91f22817d49b0d780bd0ea49b4859cbd119caa5b05902ac3c49"
text = "请老船头把海路念一遍"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_1:event:check","reply"],null]']
src = "blake3:cc10f049645595f778ff4fe63ff5a6c6685d5bb58ae1d6d794161937759f74a1"
text = "我寻了三个跑过濑户内海的水手打听。当中两人各报了不同的名字，第三人仅记得岸上有座白崖。我拿抄本写的七里去比对，打牛窗起算，量得上的正是头一个名字；第二个却要多出两里。我将两个名字一并填进那行的空处，量得上的写大字，另一个写小字，旁边再添座白崖。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_1:event:check","text"],null]']
src = "blake3:cd5986c5826582d2d62358286804271bf0549ca5e51a2e8766860275609dc1be"
text = "问清了水手，补上岸名"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_2:event:assist","reply"],null]']
src = "blake3:18051ded434af3712a4dbd92031e3c0ed702ece6982f1db2e669b606dba89aa7"
text = "寺里僧人蹲下身，用指腹顺着那个梵字摹了一遍，说这是阿弥陀佛的种子字，这碑是立来超度溺水亡人的供养碑。底下年号借着斜阳一照，方才认出是明应七年八月。我牵着绳子，从碑脚一步步往海边丈量；他念一句，我在纸上记一笔，末了在图上勾出了浪头打到的那道线。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_2:event:assist","text"],null]']
src = "blake3:cd431691a11a06311ee8e339fb2a079c634e3a045aea15e74133013c7a728c46"
text = "请和尚来辨认碑文"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_2:event:check","reply"],null]']
src = "blake3:1fb993d7f8a9b4094dfcc9b741232106ea0cdb89b1663871b0cea246d325c595"
text = "我打井边提来一桶水，浇在碑面上。石纹吃足了水，刻痕显出深色，那几行字立时浮了出来：明应七年八月，紧跟着是“溺死者”三字和一个数目。我再从碑脚往海边步步丈量，一直量到浪打不到的地界，在图上画下一条线。那三间新屋，全都落在了线下面。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_2:event:check","text"],null]']
src = "blake3:57a9b2a2d0e58a35d9d464e3c0437e967297881c4e3fc679c24f19bee9714ce6"
text = "浇水显字，步量浪线"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_3:event:assist","reply"],null]']
src = "blake3:df815acbcf11165ef8a51a43a3b142767f12c0b82a324eb649d1a80f16276659"
text = "渔家老婆婆领我挨户去问，这一带哪家的门她都熟。从卖鱼干的问到盐贩，再问到渔家小子，每问过一处，她就教我在纸上点个点。一直追到隔壁浦，那阿叔却说只闻叫声，未见其面。老婆婆低头瞧纸上连成串的点，开口道：“瞧见没，它是一路顺着人嘴走过来的。”"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_3:event:assist","text"],null]']
src = "blake3:10f4645330a6fdaab2cd9d56b609c02ff8928d5840d910e0c67f5b082348a6ab"
text = "随渔家老婆婆逐户打听"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_3:event:check","reply"],null]']
src = "blake3:073e902b4a22074ea5ea0a0275dbcfd0facf08a3f5bf2a4b0909247eb7f55f6a"
text = "我先找卖鱼干的打听，每问一人，便追问是从谁口中听来、那人又是在何处看见。一路问到第五个，是隔壁浦一位早起收网的阿叔。他说天还未亮时，礁上有团黑影，浮着些头发似的东西，叫了一声便沉入水里。我把五人口中的地点全标在纸上，越往后的点离港越近，起头那一个，正落在北边那块礁上。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_3:event:check","text"],null]']
src = "blake3:a3748b739bf195b1c801a891cd7fcc42758062bd4f00440cb7ac95c89e87bde9"
text = "顺着传言寻最先看见的人"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_4:event:assist","reply"],null]']
src = "blake3:68626add7bd1cb367aeef4c8414fad69cd03f3f46e810b464cc90b251abfcf15"
text = "住持从经柜底翻出一册年号表，纸页已发脆了。我顺着表一行行往回查，查到永享四年，果真是壬子。住持又点出缘起里“翌春着宁波”一句，解释船是四年秋天从兵库解缆的，抵达彼岸已是次年。他教我在缘起旁画出船行的路线：自兵库出发，经博多、五岛，再横渡大海到宁波。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_4:event:assist","text"],null]']
src = "blake3:fec241e840cf363c791849c1eec0d55be126979b82451ae6e6f87eee6ec17060"
text = "请住持找出年号表"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_4:event:check","reply"],null]']
src = "blake3:819c1a35e50cd871700e8cf61a7f487ed094a80e5f2b573421ccead245888175"
text = "我照六十个干支一年年往回推：打今年起，每六十年一轮，推到壬子那年，正是永享四年。再读一遍缘起，见有“翌春着宁波”一句，船原是四年启程、五年抵岸，两份抄本原都没写错。我在纸上勾出那道航线，自兵库出港，过博多、五岛，越过大海，在宁波一端标上“五年春”。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_4:event:check","text"],null]']
src = "blake3:68d401f90a8104abe50c470defdd67a2e2d5904fe26c81b0bd47153a9e94ab3b"
text = "推算干支，绘出航路"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_5:event:assist","reply"],null]']
src = "blake3:08b24a90be4e23ebe0984eae1658c46d2270256be032513bb7fb49e27ec920c0"
text = "老船头领我登船，划到他凭老手感认得的那片水面，抛下一根坠着石头的绳，触到礁石才住手。他教我坐去船尾望向岸边，钟楼、老松、小岛，三样怎么都凑不成一线。他叫我记下此刻钟楼偏在老松哪一侧，我在纸上斜斜画下一道线，他说下回便照这道线认位。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_5:event:assist","text"],null]']
src = "blake3:bebef53da7705a43dfd3d2bf3c279e1655e9c458ef2354fd007b4d4b06ff4f5f"
text = "跟老船头乘船去瞧"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_5:event:check","reply"],null]']
src = "blake3:e2fb5353f1d560ce6cccf4f021b13c76085990eda0d559f7559c6a4b8fb4f510"
text = "我先请船头在礁上放个浮标，随后登上钟楼，拿一根竹竿立在栏边，一端瞄准浮标，一端去寻岸上能对准的物事。老松既对不上了，再往西看，岬角上一块凸出的黑岩恰落在线上。我在钟楼柱上刻下一道新印，又在纸上画出交在礁上的两条线，递给了老船头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_daily_09_5:event:check","text"],null]']
src = "blake3:2064c880966e82330b78b0db9ac83eeeccc73ee6977b186143895d7d3f60a023"
text = "登钟楼，另定山当"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_00:event:assist","reply"],null]']
src = "blake3:431fe9437be0faf4bff4126d450c7ba10cca90bfdf26f564fa5a0a543405d3e5"
text = "老书役报一件，我记一行：干鲷十尾，某家；昆布二束，某家。他叮嘱回礼不可厚过原礼，也不可薄了，重了像施舍，轻了显怠慢。记到一篓没插木牌的炭时，他教我在簿边圈个小记号，待打听出是哪家所送再补填，赶正月十五前定要回礼过去。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_00:event:assist","text"],null]']
src = "blake3:f79c73c5d05a2fb1ee7a4b537812a31d1c91ca33a58805b7ab2e7d437c299eb0"
text = "请老书役报，我来记簿"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_00:event:check","reply"],null]']
src = "blake3:e259470eb3d7c38c52bf473157c0eb965fdfb88f505277c74ce3be4993eadb64"
text = "我先点酒樽，再点鱼干，末了拆开纸包数刀数。一包檀纸少了两张，夹层里却多出一把扇，扇骨上题着送礼人的姓名，原是两份礼并作一包送了。我把扇子另起一行记下，回礼也分作两份。老书役翻罢名簿，只道了声“好”，便将印盒推到我手边。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_00:event:check","text"],null]']
src = "blake3:a94627af4110b702f1908e98dd5d5e9d7f459474ac8e3aa924e64fade0292963"
text = "依名簿逐一清点"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_01:event:assist","reply"],null]']
src = "blake3:5f096a9443a887d6a43ff672b2eedf2ae091ba8f0ac9838c6192cefae96de304"
text = "老婆婆拈起一样，念出一声：芹、荠、御形、繁缕、佛座、菘、萝卜。她教我按这首歌谣的顺序在白木盘上摆开，供奉时也依这个序次。我将佛座和繁缕摆反了一回，她也不恼，只顺手把两样调了个位置，一面剁菜一面低声哼唱，词句听不真切。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_01:event:assist","text"],null]']
src = "blake3:87e9bb0aa089d33b838459c9d7af6bdb6294d7756d085d068777545459405e07"
text = "随老婆婆逐样辨认"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_01:event:check","reply"],null]']
src = "blake3:ff09f38546ca7834e5a5d3c66f8477ba6a8c1154bcd23d5000887432d9ba99db"
text = "我将竹匾里的菜叶摊散，逐棵拣选：带锯齿的叶掐断闻一闻，味冲的丢掉，紫根的也丢掉。七样各挑最嫩的三株，依歌谣次序摆上白木盘，菘与萝卜还留着带泥的小根。端去前头时，管事的妇人掀开盖布瞥了一眼，当即吩咐人照这个样式再摆一盘。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_01:event:check","text"],null]']
src = "blake3:daeeb3987d4a8a6596df190262972346cf620c416bba8b97a8e5c0e93c21fea0"
text = "亲手拣净，依歌排开"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_02:event:assist","reply"],null]']
src = "blake3:7eeb40a6de3da73f1ad768ca4a0b67c034680dbd717acdea5611b2b07a4cdee5"
text = "老汉指点着柴堆讲：青竹须先劈条口子，省得烧起来炸响。别家神社的护符要拣出，送回原处去还。我依言一层层码上去，码到字纸时他抬手拦住，从里头抽出一张写着人名的，教我双手递还那户人家，只说是夹错了，莫多问半句。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_02:event:assist","text"],null]']
src = "blake3:17582f055ebe9965af159d946442fc83a6b6bff092c56264cbf2f366bc5bf283"
text = "依老汉指点分层码柴"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_02:event:check","reply"],null]']
src = "blake3:cdf4c72a1724007f824927152cf0bdfd051c8f50baa231ef3dac141aaef87fdf"
text = "我把送来的物事摊开逐件清点：刻家纹的扇骨拆下另置，铁钉从木碗中起出，别家神社的护符收进布袋，待过了十五送还。字纸抖散开，将夹在当中的一张借据挑出，折妥还给送来的人。点火之后，柴堆塌得极齐整，纸灰直飞上对岸的松树梢头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_02:event:check","text"],null]']
src = "blake3:3a80728ffd2cba4b00788e903c05a24da2e3a7c43eb0b789a7de790b00d718eb"
text = "自行挑拣，分层码齐"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_03:event:assist","reply"],null]']
src = "blake3:f7e2badeca4d8cdc4a61220c5c2a8e335e24ebbffad6330c0bac3e125f816f2f"
text = "管事的教我，麻丝须浸在清水里轻轻摆荡，万不可拧，一拧便断；白木台子拿干布顺着木纹拭净。谢礼则是拿两张白纸折成纸包，盛米在内，正面朝上递过去。祢宜伸手接下那刻，我依着管事的吩咐退开半步垂下头，掌心早已攥出一层汗。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_03:event:assist","text"],null]']
src = "blake3:c953bca3a781fb4b5802edd879f580e10504b1e1a5422c641940417fab022565"
text = "照着学洗麻丝、包谢礼"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_03:event:check","reply"],null]']
src = "blake3:51e803c063d217b937ca2f8337294d8f630d5953b77d8f8b9eca27138141f567"
text = "我将麻丝逐根捋顺晾上竹竿，白木台子也擦得半点水渍不留。土器挨个点清后，为着短缺的那一只，我在谢礼里另添了份米，夹进一张纸条，上书“土器缺一，乞恕”。老祢宜瞧罢纸条笑了一声，随手折好揣进袖中。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_03:event:check","text"],null]']
src = "blake3:88633de9ac5aa003c2b29368f4c18e8cf766092a27676317a63e43b3862ab53d"
text = "自行洗净、清点后归还"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_04:event:assist","reply"],null]']
src = "blake3:375e38a33193897a025aa22125639eb13cc248d2cc832153e36ce5cf00a56702"
text = "老汉教我数着扎：五根菖蒲配两根艾，草绳绕足三道，结打在背面。分送的次序他掰着手指念与我听：先神前，再长辈的屋，再各处檐下，末了才轮到门房和马厩。马厩那束我挂歪了，他踮起脚替我扶正，说马也是要过节的。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_04:event:assist","text"],null]']
src = "blake3:072106d5cfab608504425f0f07fe992b17978dd1e6e4302f2d8cc5ceb8f231c7"
text = "随老汉学捆束和次序"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_04:event:check","reply"],null]']
src = "blake3:688525efaa6c2f1583bdd49c9781261316a6d731c8ee04e9ed56349d286bb36d"
text = "我依着长短将束子分作三堆：最齐整的送神前和长辈屋里，中等的挂各处檐下，短的留给门房和马厩。盘算下来尚缺两束，我便拾起散叶又扎了两小束，只挂在自家屋里。至于来讨根的孩子，我从散叶里拣了条根须最长的给他，他一把攥紧就跑了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_04:event:check","text"],null]']
src = "blake3:fa2a322e3dce736f6b27cd322bfa837fa236552ad87b4a6f7f42963ccd8f2265"
text = "自行扎束，依先后分派"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_05:event:assist","reply"],null]']
src = "blake3:4cc0c7176dc8cbc1b159a0b4a4ab16a064f08c54401eb385e4c60d2f5878c1f5"
text = "老女房教我把怀纸斜着对折，点心码进折角里，大的压底、小的居上，十六个正好包成一个三角。她说递出去时折口朝自己，给人的是平整那面。我包到第七份时掌心出汗，把纸都洇软了，她拿扇子替我扇了几下。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_05:event:assist","text"],null]']
src = "blake3:c7525cbd71cb54058a773297248a30734d6df76ddc0f14f81f20a9ee1bc37c22"
text = "依老女房教的裹怀纸"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_05:event:check","reply"],null]']
src = "blake3:c083147bd0db779e1e29c34241dff2754388c96db00bd81031d16ed1d27ab06a"
text = "我把点心倒在白纸上逐样数清，按人头分成一小堆一小堆。不够的那几份，便取晒干的栗子和炒豆凑满十六，凑数的先留给自己与身边人。当值者的那份拿碟子盖妥，碟上压张写明姓名的纸条。分罢盒底还剩两个碎的，我拿去给了门口的小孩子。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_05:event:check","text"],null]']
src = "blake3:74f369ec5712f5692a1dc9fdb50a9816b02171453af92ea2d6a1949e657f0ef0"
text = "自行清点，十六凑一份"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_06:event:assist","reply"],null]']
src = "blake3:7a9bfb8235f590f227e493ef11275c7b43f2092f1ea6f35a5cac05a0e895de9e"
text = "老先生说五色要照青赤黄白黑的次序叠，供在星前时也这么排。他教我把纸迎着窗光照，看清纸纹再下刀，一刀到底，中途不许停顿。我裁坏了三张，他没让扔，压在砚台底下，说留着练字。梶叶他让我拿井水洗，洗完背面朝上晾着。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_06:event:assist","text"],null]']
src = "blake3:f6051d65c04b60a517f97a2866d5652932d8c961b7d5a260616ab91e739b0c42"
text = "请老先生领着裁纸"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_06:event:check","reply"],null]']
src = "blake3:eddf7253907f189895c7113ece5a121f76a8a3a23ed9d2301ca412865a5801b0"
text = "我将纸张逐一揭开，染了色的单独拣出，余下的举向窗光看清纹路再行裁剪。裁妥的照青赤黄白黑叠作五摞，每摞顶上压一枚洗净的梶叶。末了我在白纸那摞最底背着人，拿假名试写了半句歌，随手又一刀裁去。老先生翻检一番，抽出一张黄纸端详片刻裁边，复又放回，转身研墨去了。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_06:event:check","text"],null]']
src = "blake3:31c846e4da251d4d57ad917216194196299dc0ae5b899fbdf9a729b1a423467a"
text = "自行裁笺，五色理齐"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_07:event:assist","reply"],null]']
src = "blake3:fbd36d3ddecfe35d12265b78cc3f7ad44d33232f5b6754ac470376d923685816"
text = "老板娘教我先拣同色的线，针脚藏进布纹里，从外头瞧不出来。家纹那块补歪不得，补歪了主家会觉得受了轻慢。我缝完一道袖口，她看了看，拆掉一半令我重来，说针要走得匀称，像起踊的步子一样。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_07:event:assist","text"],null]']
src = "blake3:0e202a083ddc5445ae54657c4f72523b55b15f67d27d42b3d7e5d61b0f21ff9a"
text = "随老板娘学针法"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_07:event:check","reply"],null]']
src = "blake3:4a9e3576c053891269de7b453a0b5699828b9b5915489eee5d58a51a86cf5188"
text = "我把衣裳按家纹分开，蛀了纹的那两件，翻出头人的名册，比着领口尺寸与布料认出是谁家的。花笠断了的檐沿拿竹篾夹住，缠牢麻线，再将掉落的纸花一朵朵粘回去。送还时依家纹分好包，每包上放一把晒干的艾，免得再生虫。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_07:event:check","text"],null]']
src = "blake3:5c7d95c161ad3ec68c1a1bba077bf24525775cfcb43caf71d5d3f89db4eba57b"
text = "自行修缀，辨纹归还"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_08:event:assist","reply"],null]']
src = "blake3:eba925b520cfda79477bb75e0af5c9005252e03ba2c111cebdd04ab7ec251e54"
text = "先生念道：八月朔日，扇一柄，纸五帖，收讫，谨言。他提点我，收下之物须写在前头，致谢之辞落在后头，颠倒过来便似讨赏一般。我写到第三张时纸边蹭了墨，他令我另写一张，把弄脏的那张折起来塞进了自家袖口。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_08:event:assist","text"],null]']
src = "blake3:4aa26caef937cd65b62ac71c7d41a0670efb38abf0672d175c514ddc1e2d1421"
text = "请先生口念，由我抄录"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_08:event:check","reply"],null]']
src = "blake3:e91a5a668f724b2a6bbed44c3cc9ebc2b582ff80498978b8a761837bd0a47f9c"
text = "我将礼物同来人一一对上，画着秋草的扇子，按扇骨刻字分清是谁家的。回单写妥，依来人到门的先后递出去，每张皆请对方验看一遍再走。送新稻来的那一家，我在回单末尾多写了一句：“稻穗挂在檐下，已经黄了。”来人看了，笑着揣进了怀里。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_08:event:check","text"],null]']
src = "blake3:caefedf5abfdc5b377635a022e0cb154d8b51f23926c9830770a92c7ca083b27"
text = "自行对照礼品开回单"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_09:event:assist","reply"],null]']
src = "blake3:5f118c6b696aa1b33286409507329d4e4a5244d40a799d0499cc2bdf1cf25188"
text = "老仆教我立在廊下，屈身蹲到坐着时的高度，再望东边那棵松树。他说宾客是坐着望月的，若站着定位置，届时准教屋檐挡住；上首坐垫正对月亮，下首略错开些，才好教后边的人也瞧得见。我依他所言挪动了三回几案，最末一回，他方才点了点头。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_09:event:assist","text"],null]']
src = "blake3:e44ca0d78a70e397f50e45ed13e8a17e7a0cfb7f33fea490c056f5a3ab24f795"
text = "随老仆一道择定坐位"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_09:event:check","reply"],null]']
src = "blake3:c2ca7b08ef3a657494ffc62044e2df5ccbed90aed0771cded37b1ed58f7ec6e5"
text = "我搬了只坐垫，从廊下这端逐一坐到那端，每坐一处便抬眼望一回松梢。月出时最好的方位让予上首，我把芒草瓶挪往侧边，免得挡住后排。芋头依人数分装成盘，多出的一盘端去给了守门的。待月亮升上来时，我坐在最末的垫子上，恰巧看见它从松针缝里钻出来。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_09:event:check","text"],null]']
src = "blake3:b44fab5b216d703ed9cd3b536bdda6f2d428fac2f6db603b2b6aae3b02f76ec1"
text = "自行勘验，排定座次"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_10:event:assist","reply"],null]']
src = "blake3:d9149d618fe75feeb3a793a7e820d129e470b3772bd47a0f8603e11c5e6b88af"
text = "老僧教道，长枝入高瓶，短枝入矮瓶，送去前头的花瓣须朝上舒展，垂着头的留屋里自看。敷丝绵下手要轻，仿佛给熟睡的小儿盖被。偏我手重压塌了一朵的花心，老僧把它掐下来，顺手泡进我面前的茶碗里。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_10:event:assist","text"],null]']
src = "blake3:65e6bb8d35c29527b3ed69d3506b46aa7550758753ca5b5afde151ca9e9773bd"
text = "讨教老僧如何插瓶"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_10:event:check","reply"],null]']
src = "blake3:0de0c98da56607a2e213f419fba950cadedfd0dd246d34cb437c26c090daf5a2"
text = "我依着花色和绽放的深浅将菊枝分作几堆，开在火候上的留作敷绵，受了冻的修去坏瓣，插进屋内的瓶中。献到前头的那一枝，我用双手捧牢，端端正正摆好朝上。挑了与花瓣异色的丝绵，一朵朵轻掩上去。临黑前再巡视一趟，见风吹掉了一团，便拾起来重新罩妥。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_10:event:check","text"],null]']
src = "blake3:537c146899833179e6b694ee2902d211ccfc5e754459b6221f05b0728209b860"
text = "独自拣枝，敷妥丝绵"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_11:event:assist","reply"],null]']
src = "blake3:c4e68174361e74cf57bc1bf54f53e1be525bec14a82e30884a09e026a57e06b9"
text = "老女房拈了颗栗子凑到灯前照看：“生虫眼的，翻过背面藏着也不成，月神瞧得清清楚楚。”她点清一盘，我便效仿着点一盘，直到第三盘方才记牢：敬月的栗子必须尖端朝上，分与人食用的才不拘摆法。她轻轻拍了拍我的手背，顺势往我掌心塞来一颗熟栗。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_11:event:assist","text"],null]']
src = "blake3:668e8af57321258d1dc71d30277f5cf42fbf80fca0aa6c2cd405f5e87382b0f3"
text = "随老女房学着分盘"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_11:event:check","reply"],null]']
src = "blake3:aaca469e421e27cfbd1282fdd521ea37d1e7546131149390902df9cba5ae3065"
text = "我由最东头动起手来：先安置敬月那份，栗尖一律冲上，豆荚亦朝同一边顺着放；待客的折敷顺座次依次往西排开，主家的那盘压在末尾，分量也最薄。排罢末盘，恰剩三枚带虫眼的栗子，我便顺手抄进袖兜，留着自个儿剥着吃。老女房踱过来巡视一匝，竟一盘都不曾改动。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_11:event:check","text"],null]']
src = "blake3:d023ecb91a2410fa4723033aa06583768592676fb03abca7f2db7945072f8529"
text = "独自依座次排盘"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_12:event:assist","reply"],null]']
src = "blake3:422b796e1e6c33a05b7253d80986f16a7932f9e3e46a10b6d9be06c5c76603c2"
text = "祢宜攥住我的手腕，领着将扫帚梢压低：“扫帚举不得过膝，尘土扬起来会犯着神前。”他引我打拜殿石阶一路扫出鸟居，逢着转弯总要歇脚，吩咐先瞧清脚边无人走动。清扫既毕，他端起一捧枯叶倾入西侧水沟：“每年倒灰的方隅都有变动，来年动手前先来问我。”"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_12:event:assist","text"],null]']
src = "blake3:0422c250ae2e466c35e906eecc01f6a023f9e17122524419aa2760c9b92db8db"
text = "随祢宜由内向外清扫"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_12:event:check","reply"],null]']
src = "blake3:477a7f72739aca57b90e6d1da5e986b3387c5b33773d4efcf3023d9cd0cf626b"
text = "我先打听妥今年宜忌的方位，牢记哪边犯忌动土、哪边准许倾灰。随即便由拜殿深处动扫，避开方才安放的豆升，一路清出鸟居之外，将枯叶尽数倒进今岁合宜的沟渠里。祢宜正站在石阶上清点豆升，数毕冲我颔了颔首，将最末一升递进我怀里捧着。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_12:event:check","text"],null]']
src = "blake3:6d5914d0093261d077702a72913616a49b480a3424f8d6298a9a547a77d0fdc7"
text = "先探明方位再独自扫"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_13:event:assist","reply"],null]']
src = "blake3:5c29f12dab62057883ffa6dabd5575d7d6e0fa9133a00bbfa1458d755b7a20fc"
text = "管膳的老侍女念罢名录，我便捧着漆盘随她身后逐室分发。走到宿卫值房门前，她叮嘱我须膝行而入，搁稳盘子再后退半步：“饼乃主家所赐，你不过是个差遣，莫占了饼的尊位。”回程道上，她塞给我一只黑饼，浓重的芝麻香直冲鼻端。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_13:event:assist","text"],null]']
src = "blake3:1f78cae0ff75bebd31f43ec800c3340558092332323e06382c3240731774760f"
text = "随老女官逐屋分送"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_13:event:check","reply"],null]']
src = "blake3:d48b2487716197d05f0cd8cce4787fe24fe91a8c08b23fb2fa66ee6090c5762e"
text = "我挨个探明了今宵换班的底细：两人对调了差事，一人因病告假，柱上名录的顺序自得随之挪动。依着改定后的次序逐个码盘，各用一方小布裹妥，布角齐齐朝向一侧。亥时鼓声一落，头一盘已送入值宿房中，待末一盘交到看门的老卫士掌心时，那饼犹带着温热。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_13:event:check","text"],null]']
src = "blake3:32de4720abe5109b338f488e294c205aa4b53d552a8574d30395b93b7ed5fc06"
text = "探明换班后再分送"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_14:event:assist","reply"],null]']
src = "blake3:a9bddd1f641780b341adf8ec107abc3dd3fa0fc70b7f6dc2b8902fc23c1c7a69"
text = "老先生于我身旁落座，先指点折法：小笺须直折三叠，再斜折一角，结头冲上的送与尊长，冲下的留给平辈。落笔时我不慎写错了个“宿”字，他不准我涂改，命我整纸重写：“歌会上若带出别字，比作坏诗句还要失礼。”待二十份尽数抄毕，他从中拣出笔致最齐整的一张，指定送到年岁最长的那一户。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_14:event:assist","text"],null]']
src = "blake3:490443d9efd545fb87ff15a27ca1899caeb2695a92722570f2f03e2ab879adee"
text = "随老先生习折笺"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_14:event:check","reply"],null]']
src = "blake3:df1f76e3d8639ab6a6d5df83864db991f4cef2a050fd2a0a5607bbc9ca43eabd"
text = "动墨前我先将题目诵读了三遍，每抄竣一纸，必与底稿并拢核对字架。折妥的小笺依收题人家的长幼分作两堆，结头朝上与朝下各成一摞，临缚枝条前又逐户点了一回数目——但凡短了一张，便要耽误人家居月作不成歌。待送到最末一户，天色刚擦黑，那家主人接过枝条，头一句便赞字写得好。"

[entries.'["upbringing/pools/japanese.toml",["choices","c9_pool_japanese_festival_14:event:check","text"],null]']
src = "blake3:21f262d7ce564d83975252d17441a60f51d13d508b0cbbb8a7edf8c52a56a527"
text = "独自抄妥分辈递送"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_0:event:assisted","text"],null]']
src = "blake3:9612e0f71cf408ef1b23f638f85aab17ff595f44e027c17576800646d9500bcd"
text = "宿夜刚落过雨，整片泥滩湿成一块。老艄公教我看滩头的湿印，我一踏上岸便去寻，可潮水退下的印子和雨水冲出的痕混在一处，压根辨不清。艄公坐在棚下织补鱼网，眼皮都不抬一下：自个儿琢磨去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_0:event:checked","text"],null]']
src = "blake3:7626dafc7dda9c166dc78776f4f2bad91ef4987778ad54deb27fde7ef51efb34"
text = "今日十五大潮，晴空没有半片云，渡船还多载了两头牛，船身比往常吃水更深。老艄公这回没跟着——上次我独自留的余绳，半夜去查不差毫厘。木桩上我上回划的那道痕，眼下还高出水面好一截。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_0:event:first","text"],null]']
src = "blake3:8c0e7a1bc11f30fefb147f0a623c93ccbf790cf74f0064d0adcd7737ef35f116"
text = "末一趟渡船靠了岸，搭客散尽，老艄公抄起湿透的缆绳朝我怀里一抛，丢下一句拴好。那是我头一天在渡口搭手。浸了整日江水的缆绳沉得出奇，粗得一只手攥不拢。系船的木桩上勒满旧绳磨出的深浅沟道，一圈套着一圈。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_1:event:assisted","text"],null]']
src = "blake3:08939adfc7fdad7138864853187cc8b5a6e71dcc1b2133d004805ca5ec5c2b6f"
text = "前几日一场大雨，把下田河口的水搅得黄浊不堪。系红布条的那棵松树还在，先前老船头带我探出的深水道却不见踪影，整片沙脊倒像往南移了过去。这回老船头不上船，只坐在岸边编草鞋：竹竿你拿着。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_1:event:checked","text"],null]']
src = "blake3:cb9dab636c8213177af1997fa54b6e7c5ab9decc2c4e64b4d7919f12632e1b0a"
text = "今日要出河口的是一条盐船，船体比上次送出海的木料船大，吃水足足深出一尺。船主听说探水的竟是个孩子，脸拉了下来。天阴沉着，海风顺口子灌进来，浪头一拨接一拨压过沙脊，水面上的细浪全被打乱了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_1:event:first","text"],null]']
src = "blake3:c5930a41f38850d3b25ea1774eaec354e91a5047dee56f316289abfe4eee6e74"
text = "稻生泽川在下田汇入大海。青绿的河水撞上湛蓝的海水，交界处滚出一道白线。每逢落潮，河口外便露出条长长的沙脊，歇满海鸟。岸边的老船头见我脸生，遥指沙脊道：船折在这里的，可比折在外海的多得多。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_2:event:assisted","text"],null]']
src = "blake3:696070f502fed6d268f1ea614cd1f6bace9397fd57f68512aaa569c33029632f"
text = "那条小早竟然又歪着折回来了。上回是水夫头递石、我来码，今日他手掌叫缆绳勒伤，裹着布条坐在岸上，只用下巴指点。底舱比上回乱得多：有块大石头裂作两半，碎块死死卡在肋材之间撬不出来。潮水才刚开始涨，泥滩上的螃蟹纷纷缩进洞去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_2:event:checked","text"],null]']
src = "blake3:03771469148e819d1ca08168f00b52dd1ce97373893c276cb27bd37f51bca149"
text = "我上回用麻绳捆在肋材缝里的那几块石头，一块也没动；这回滚偏的是新添的那几块——船主前几天多装了货，随手加了石头进舱，没人捆扎。水夫头抱胳膊在岸上看着，说这回船上的货卸不得，得连货带石一并摆平。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_2:event:first","text"],null]']
src = "blake3:f4c9df38a71e60baa1fdb27e99554a56c31bbfa44f421ddbf79e9255467f4048"
text = "舱盖才一掀开，一股咸腥混着陈木霉味冲上来。我头一遭顺梯子下到小早的底舱，踩着冰冷的石头，有的竟比我脑袋还大。水夫头探身在舱口发话：船发歪，是石头跑了位；石头缘何跑偏，你先想。我抓紧湿滑的肋材，听见船壳外潮水一下下拍打着。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_3:event:assisted","text"],null]']
src = "blake3:25a8c799dff9ec738548213f82eb752116167bd9aa90df2e1e6dfca278568db0"
text = "船在海峡口泊下，船头却在船尾跟人争价钱，半点顾不上我——上回他还肯坐在我身旁一道道指着教。岩壁上的刻痕叫海藻遮去大半，我趴在船舷上瞅了半天，实在找不出哪排是浅的。日头已经偏西，再错过这趟转流，整船人都得在湾里熬夜。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_3:event:checked","text"],null]']
src = "blake3:5484e6d6bacc6762872af3f35784a2e334b7a5a345aa9b2965231d872c464d35"
text = "今日海峡口漫起大雾，岩壁只剩一团影子，刻痕一道也辨不清。偏生船头上回见我一个人看准了转流时辰，这回把喊人的差事全撇给我，还让个新上船的橹手跟着学。那新橹手问我怎么办，我也正发愁想问谁去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_3:event:first","text"],null]']
src = "blake3:f5db9b77d2b6262dbfe08a59b2738edf7209ac4cd40e9147cfb6cea43c5300da"
text = "还没到海峡口，前头水声早像开了锅似的轰响，船头喝一声“停”，橹手们刷地把橹提出水面。我头一回走这条水路，扒着船舷看，前方海面一半平得像镜子，另一半却在打转，漩涡里绞着断枝。船头指指旁边的岩壁：别看水，看那上面的道道。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_4:event:assisted","text"],null]']
src = "blake3:6943df9548fa66553a83901d1820c82103b1e337ea4bed22e5a2944554c675ef"
text = "驶来的是条小渔船，免状却写得极体面，纸是上好纸，字也漂亮，偏是边角泡过水又晒干，印泥洇散了半边。老水夫在关口另一头忙着收钱，没像上回挨着我一句句教，隔空喊了句“你看着办”。船老大嚷着潮一转他就得走。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_4:event:checked","text"],null]']
src = "blake3:4506f5caaee2077d328f3917b5cedccafb142dd080a02ae163aaf31d0bd5f506"
text = "上回我看出那张免状漏写了一帆，水夫们中间早传开了，今日船刚靠岸，船主便点名要那个识字的来查验。他的文书干干净净，帆数也对得上，可日子却落在去年腊月——跨了年还作不作数，谁也拿不准。落潮的水声已经顺风响起来了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_4:event:first","text"],null]']
src = "blake3:724d3abed6e01dbadb48d3a7e52d08e19c88f58e082c6e132219637537c5729f"
text = "老水夫腰上悬着串铜钱，手里执根竹竿，船一贴近关口，便拿竹竿叩打船帮，点算挂了多少张帆。一帆收几何，他心里门儿清，不用拨算盘。我跟在他身后转了一上午，愣是没看出门道。快到晌午，一条外地船靠过来，船主没掏钱囊，先摸出一张折得四四方方的纸。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_5:event:assisted","text"],null]']
src = "blake3:e5815d3fdecaf9b496d162935fc1517c0a60907ca32f42faa966d1dc5c0fb95e"
text = "滑道上这条船比上回那条老得多，楫孔早磨成了椭圆，楫柱稍一用力便晃。船匠在旁边的船上赶活计，没空再握着我的手教，只把小刨子和蜡留在滑道边。明早的满潮虽比上回晚些，可头顶的云压得很低，看着像是夜里要下雨。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_5:event:checked","text"],null]']
src = "blake3:9c2a50fd1cd3821a5b2556413517a391a17b59610a90cf6314c0bb3533c74f62"
text = "上回我独自修好的楫孔，下水后一根都没裂，这回船匠便把整条船的楫孔全交给了我，还派他小徒弟来打下手。小徒弟手脚太快，没等我话说完，就把一根楫柱削短了半寸。离明早的满潮，只剩这一宿的工夫。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_00_5:event:first","text"],null]']
src = "blake3:90c3a9df710509b26bcef065bc415303b629c6d41e587264432ddf6c0ffcb8aa"
text = "船稳架在滑道上，底下垫着圆木，船匠们在船身上爬高伏低，东敲敲，西摸摸。我头一遭进船坞，只认得出船头船尾，舷边那一排小孔作什么用场，盯了半晌也没瞧明白。一个老船匠见我发愣，朝我招了招手。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_0:event:assisted","text"],null]']
src = "blake3:406b9ae832345a69ef4cfb38d2bfa8e913a50d0943aa0051f062d29e4f579f98"
text = "今番排队交年贡米的庄户比上回多，从政所门口一直甩到河边。老书记坐在廊下跟庄头说话，耳朵却竖着听刮斗的声音；量与记全交给了我，并斗、分栏，是他上回授的法子。队列里有个新来的佃户背着袋米，袋口草绳打了七八个结，急得怎么也解不开。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_0:event:checked","text"],null]']
src = "blake3:e9f7446f91c04aec8d21905d74344eba007d3afdbe169e261734a850b6ff47bf"
text = "上回我分两栏记的那本账，经老书记拿给主事的人看过，今年量米的差事便整个落到了我肩上。可今年来了个邻村庄户，带着他们村自己的斗，咬定这只斗是寺里烙过印的，大小与政所那只一般。两只斗并肩摆在一处，瞧着确实差不多。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_0:event:first","text"],null]']
src = "blake3:27bb8d90933b2f6c2a2c503fb7e575d3b9c06731ae9157279d4ac698baf021ab"
text = "政所院子里堆着米袋，草绳扎口，一袋袋码得比人还高，空气里飘满新米和稻草的气味。那是我头一年跟着看收年贡米。老书记案上的账本翻开一半，笔搁在砚台上。我蹲在他身旁看他量米，一斗复一斗，刮板沿着斗口一抹，冒出来的米粒落回袋子里。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_1:event:assisted","text"],null]']
src = "blake3:c9cf47303cfcb469fa04ee7d8df1d9cc89b015330955eed13157d6e507c8676a"
text = "转眼又到岁暮，纸铺这本赊账簿比上回足厚出一指。前番还教我排纸条的老番头，这回倒把纸条往我手边一推，自个儿躲去后屋烤火盆，隔着纸门喊了声：“连歌师那家可别漏下。”纸条上的屋号我多半已认得了，独有一户新来的笔屋，账旁画了圆圈当记号。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_1:event:checked","text"],null]']
src = "blake3:48b64d661468667516644c7eb78475afdac5de9b62e1174a90b53fa8e054cbd6"
text = "自打我帮纸铺摸清了各户欠数，掌柜便见谁都讲。这回他干脆把积了三年的旧账簿一并搬出来，扬起的灰扑得我满脸都是。最底下一本里头，有笔账是用假名记的，赊与川对岸的老婆婆，十张奉书纸，旁头批着三个字：不必催。掌柜咳了一声，说那一笔你且别算进去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_1:event:first","text"],null]']
src = "blake3:0dd23f72e7825b9496877ac04560922e52c6ec3da874d2057d6419cb5279f239"
text = "头一次进纸铺的账房，是被掌柜从门口硬拉进去的。他说店里伙计全不识数，唯独我刚在寺里学过几日算术。柜台搁满纸样，楮皮气味直往鼻子里钻；赊账簿的边角早就卷得同干海带一般，刚掀开头一页，同一行里竟挤了三个人的笔迹。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_2:event:assisted","text"],null]']
src = "blake3:5ef50c9a652bc76dda30fab6e1c1de78c053d5895c4f15b636aa396b14ec1c3f"
text = "梅雨刚停，船台上又抬起一条漏水的船。番头在码头那头点货，隔着人远远冲我扬了下巴，意思是叫我照那回查工的章法自个儿来。船大工的头领早认得我，咧开嘴道：“今年工钱涨了，每工加十文，你可休拿旧价压我。”他手里的木槌还在往下滴水。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_2:event:checked","text"],null]']
src = "blake3:d1bd34dba268c5663c8e1fea6cc62a5eb07a79ba9ac3372f7614d6e342f3651c"
text = "上番我算出的那笔工钱，船大工头领至今还记着，怨我连他那半日工都要抠出来。这回修的是船舵，他咬定舵算精细活，一工要抵两工算。船主不肯认，两人双双将我唤去船台底下。拆下的舵板正躺在沙地里，裂隙中还塞着发黑的旧槙肌。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_2:event:first","text"],null]']
src = "blake3:60d028a783b53abfb0dddc1bcea27c9e45afcf4f2f7cc3f7a4d48452ee84f2e0"
text = "船大工的工钱单递到我手里那会儿，我连一工算什么都不懂。头领笑话我，说一个人从天明做到天黑便是一工，包不包饭另论。那单子写在一片刨落的薄木片上，字迹七歪八扭，船钉数目旁头还画着钉子，大钉画长，小钉画短。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_3:event:assisted","text"],null]']
src = "blake3:8b7d4aef4085ddc33abc30eb721a742ca7dbd1ccc8078df458d9b0684b755c51"
text = "今年雨水偏多，庄户送来的米潮乎乎的，好几俵一拆开便能闻见霉味。米屋主人将木枡塞进我手里，丢下一句席子仍用去年那张，自个儿陪庄头吃茶说话去了。门口站着个认得我的老庄户，笑着说：“今年可别把我家的米全归到次等里。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_3:event:checked","text"],null]']
src = "blake3:0e688316a765d6543700149caf40ea7fcb20cb8608ff9277f7fae44d3e516472"
text = "去年我将庄户的混米逐俵分了等次，有一户从此交米前总先自己过一遍筛。今年他家的米白得发亮，反倒是个新来的庄户，米俵底下暗垫着一层砂子，一枡倒上去，砂粒沙沙地滚落席面。米屋主人瞧着我，一声未吭。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_3:event:first","text"],null]']
src = "blake3:e09d892f2b7b01d2ec7ddb8d15ce4666f7611ac52f18bfb1cb69a9aed0839278"
text = "头一回帮米屋收米，我原以为米皆一般。主人抓了两把搁进我双掌中：左边粒粒饱满，右边搀着细窄的红粒。“这叫大唐米，耐旱，价贱，”他说道，“庄户最爱往好米里掺。”我将两把米凑到眼前细瞧，那些红粒的尖儿就像一根根小刺。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_4:event:assisted","text"],null]']
src = "blake3:0493a94f724e04874473081a3945b6d6426f474d4c86e17fccab07a2ce6f3bc8"
text = "入了梅，盐摊的生意便清淡了，盐俵搁在棚底下过一夜就软塌塌的。卖海带的婆婆见我又立到盐摊前，手脚利落地将海带卷收进木箱，冲我摆手：“今天可顾不上帮你，我得上寺里去。”盐商又在跟新来的挑夫争吵，吵的仍旧是少了多少。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_4:event:checked","text"],null]']
src = "blake3:bdb247d213b60fa975659ce9f07d2d7d3b40472b0aa2cbe31ce46e6805158e40"
text = "自从将盐在路上的损耗算清楚，盐商便不再动辄克扣挑夫的钱，挑夫们见了我也都会点一点头。这回出了另一桩事：盐商从外处买进一批便宜盐，白得扎眼，一舔却发苦，一量又比账面上多。他将账本连同一小包盐一并推到我手边。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_4:event:first","text"],null]']
src = "blake3:cc4602da0678afa1c7e3931eed6869d89df8ba1165e06d73357e87d15dcb1ba5"
text = "我伸舌头舔了舔盐俵上的白霜，登时苦得直咧嘴。盐商哈哈大笑，说那就是苦卤，从盐田一路滴过来，滴掉的尽是钱。他指着棚下一溜盐俵道：“哪一俵不比出盐田时轻，可到底轻多少，我卖了二十年盐也没算准过。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_5:event:assisted","text"],null]']
src = "blake3:abb343b8a17aec2a1c346a4f3b90a308092cefbeb65dd65a54f978ddf1d4beb1"
text = "年底来换钱的人挤满了钱屋，门口的雪早被踩成了稀泥。钱屋主人在里间同位从堺来的商人谈大宗兑换，仅隔着帘子说了一句：“撰钱你已学过，外头托给你了。”柜台上递来的头一串就不对劲，钱孔里竟塞着一撮稻草，将串撑得满满当当。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_5:event:checked","text"],null]']
src = "blake3:e84145f68d2fd57cd3eef4ffef0d9a146f21b8d6e263482e27dbaf349b103fbb"
text = "上回我将一堆钱串拆开重清，客人挨个儿道谢，伙计倒嫌我多事，说拆串太费工夫。这回伙计捧来一只木箱，里头装着一位旅人寄存的钱，说定的一贯，串数却对不上，而旅人明早就要乘船走。箱底压着一张字条，写了个我从没见过的钱名。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_01_5:event:first","text"],null]']
src = "blake3:1064a3d9565ff675edccfa81385ac45871e25111b3307fac256b1de95eb3df79"
text = "我从未摸过这许多铜钱。在钱屋柜台里头，钱串沉甸甸的，麻绳在掌心勒出一道红印。主人说一串值百文，我细数下来却只有九十七枚。当他算错了，我指给他瞧，他反倒笑出声来，还叫伙计也过来听听我这句话。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_0:event:assisted","text"],null]']
src = "blake3:f11ca4e14e8db4fbf8e0b7eae152c656766abd4cb2fa13ba2bb326ea6e8c74ac"
text = "又一张没名字的便笺，这回夹在借来的歌集里头，纸上还熏着浅浅的沉香。我捧去请老女房看，她只摆摆手，说这种纸她年轻时早见多了，你自己瞧吧，又添了一句：“看出来了也不必说与我听。”便笺上只剩一首短歌的上句，下句被人用指甲划了一道。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_0:event:checked","text"],null]']
src = "blake3:d78634b4936e02f812cad073c2c98ac634653d63f66d4ddf90167892fb92cb73"
text = "自那张便笺寻回主人以后，管事便将宅里所有无名的纸片全往我这里送：没写完的歌、算错的米账、孩童画的马。今儿这张写在扇面上，扇骨断了两根，字迹出自一位女子，写给住在桥边的人。可宅里哪有谁住在桥边。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_0:event:first","text"],null]']
src = "blake3:8f0d8d3429344487238410197097ea412af81afcf3cc6eb4eef2449079a381ab"
text = "散写的假名便笺我从没见过，乍瞧去只觉满纸蚯蚓在爬。字迹一会高一会低，行与行挤在一处，有的地方浓得发黑，有的却淡得几乎辨不清。管事攥着它在廊下兜转了半天，问遍侍从，谁都摇头。他一扭身看见我，顺手便将便笺塞进我手里。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_1:event:assisted","text"],null]']
src = "blake3:ca0498b092b906148bee1220f4aac7131e7207c7128f2cab3763b6b2f21a4d65"
text = "春天晒书之前，右笔房得把去年的文书从头理一遍。这回右笔先生没再把折法逐张摊给我瞧，只管在一旁慢慢磨墨，墨条转得很匀。我拿起一封切纸，边沿裁得斜斜歪歪，还带着齿痕，似是谁情急之下用牙咬开的。先生头也不抬：“那封你猜一猜。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_1:event:checked","text"],null]']
src = "blake3:02513b86b2f5713139baaafd1fc568f695486dd1b3bf43d1895116cd60f69dd7"
text = "上回我将一摞旧文书依折法理得清清楚楚，右笔先生拿去呈给主人过目，归来时多了一包干柿子，说是赏我的。这回送来的是一只漆盒，里头尽是结文，细细的纸绳打着结，有好几种结法我从未见过。先生说这些不必拆，只看结便够了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_1:event:first","text"],null]']
src = "blake3:d3c514c022b9b4664d855b806407a89e1eb5c1f5054543ac22da4cc8c0c601bc"
text = "头一回进右笔房时，我以为写字的地方无非笔墨罢了。屋里却堆满纸张：竖着的、横着的、折成扇子宽的、裁作手指长的。右笔先生随手抽出两封给我，问哪一封更紧要。我捡了字多的那封，他摇了摇头，把另一封外头的包纸揭开给我瞧。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_2:event:assisted","text"],null]']
src = "blake3:c29392d66f916feecd224dae05f63b7b7bd883804c3e438993dfa516a9f22bb1"
text = "离歌会还有一个月，名册里又新添了四位客人，得补抄进清稿。上回右笔先生还指点我默念停笔，这回却径直将笔砚推到我面前，独自去院中赏梅了。新添的客人里有位新近升了官，册上留着的还是旧时位阶，墨迹旁不知谁拿小字补了一句“听说”，却没写明听何人说的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_2:event:checked","text"],null]']
src = "blake3:ef1721adea0bbbc7adb9b345191d2dabc00ffb9c83cae9be485fcfa0e8d81ed4"
text = "上回我在原稿里挑出一处错漏，右笔先生把这事当作趣闻说与宗匠听，宗匠复信时还特地问候了那眼尖的孩子。这回递过来的是宗匠门下的名录，二十来个名字密密挤在一页纸上，官位全作草体，光一个位字便绕得乱麻一般。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_2:event:first","text"],null]']
src = "blake3:38d259693a9b1ef6e2b5e810de71c37fee895249bb11f0c2504a0594d8bf503f"
text = "替人誊录的头一日，我把纸铺展得平平整整，笔锋饱蘸浓墨，生怕写到半途没了墨。右笔先生瞥了一眼，教我把笔毫上的墨刮去半数。他道，抄录官位之人手须稳、心须冷，正与从一字之差，隔的便是半辈子的升迁。我攥着笔杆，半晌落不下纸去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_3:event:assisted","text"],null]']
src = "blake3:bf1df50088fe27aae3560de6e9f8b861a36523be6219e78fb1b60a33a1ad60f7"
text = "旧日记抄至第三册，先祖的字迹越发散乱，仿佛人老了手腕发颤。案头还摊着那册字样，老僧却托人递话过来，说寺中正做法事抽不开身，随信夹了张便条：“不识的字先留空，莫乱猜。”偏巧便条上那个猜字，写得也是个异体。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_3:event:checked","text"],null]']
src = "blake3:d0e1cc9c048a4d85af8f13223443223e62109a1802610e5b06f02c07cb234a9e"
text = "我攒下的那叠字签叫主人拿去给来访的一位公家瞧，那人借了三天才送还。这回日记里忽然冒出数行全不像先祖手笔的字，点画端正，墨色尚新，夹在两页旧纸当中。那几行记的是某年某月售出一块田地，买主的名字却教重墨涂了个干净。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_3:event:first","text"],null]']
src = "blake3:d00ff5aeb11d361e31f969ac570748da96277e6022034bc3bfbee0e2a4d9dd33"
text = "那箱旧日记才揭开，扑面的陈霉气便呛得我直咳。纸页枯黄得似深秋银杏，手指略一触碰便沙沙作响，字竖着一行行排下来，单看认得，连成句却念不通。翻到其中一页，先祖还在页旁画了只小小的鹤，歪着脖子，倒像是闲来随手画着解闷的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_4:event:assisted","text"],null]']
src = "blake3:cf788b1e7751274e75d0da39d7d49d6a2a4e37935e2929067b440fc428f583d9"
text = "雨季里寺中又新添了两个孩子，其一是渔户出身，掌心满是渔网绳索磨出的硬茧。上回和尚还握着我的手教写字帖，这回他却在本堂里诵经，经声隔着糊纸拉门一阵阵透过来。孩子们挤着向我讨纸，旧纸却只剩薄薄一叠，内里数张背面还密密写着旁人的账目。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_4:event:checked","text"],null]']
src = "blake3:56e26aa9f7dfd23348808310c60ed66637febfa0e298ac838a80b10a93416816"
text = "同一张字帖，孩子们摹了整整一月，纸面都叫笔尖蹭起了毛。今日和尚说起，有位童子的父亲登门道谢，送来一篓萝卜，道孩子归家后还在灶灰上划字给他看。新近送来的一批孩子里，有个女孩一笔一画写得比我当年初学还稳当，只是闭口不肯言语。和尚又将一摞旧纸塞到了我手里。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_4:event:first","text"],null]']
src = "blake3:92a6f7981c83d6ffb71b8f1446fc6cf1a7af7eff45228562f08fb1b739d44d7c"
text = "头一遭被派去教导幼童，我心里比他们还要发紧。和尚将我推上前头，道你字写得好，你来。六七双眼睛一齐盯住我，我攥着墨条磨得使劲过猛，墨汁反倒溅上了自家手背，孩子们登时笑作一团，年纪最小的那个乐得从坐垫上翻滚了下去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_5:event:assisted","text"],null]']
src = "blake3:5ae1957a9464721c5e601951b8337d945d83130489ce077c888747c08225f9ac"
text = "今岁晒书那日，天刚亮便闷热得慌，阴云沉沉压着屋脊。管书库的老仆偏巧受派往寺里还经，动身前托门前童子递话：“天色要变，切莫先开经箱。”可主人一早便交代下来，有客后天要来借那部歌集，今日无论如何得晒一晒。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_5:event:checked","text"],null]']
src = "blake3:8e9e21fcc1131a0733edf38d4664343b5095658b8915d50eace59dd161d657e4"
text = "去年我拟定贴在廊柱上的晒书次序，直到今年犹未揭去，纸面已晒得泛白。管事吩咐今岁照旧，然库房新添了两只箱子，是从一位已故连歌师宅中收买来的，扣着生锈的铁锁。才揭开盖，潮气里裹着一缕淡香扑了出来，里头的书页竟粘作了一整块。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_02_5:event:first","text"],null]']
src = "blake3:8d99faddcbd91f56e118eaa140514228c2a6bf65ffcc3a4ae931ea0180f8f947"
text = "头一年帮着曝书，我原当不过是将书搬出院子晒晒日头。才抱起一轴经卷往庭院正中跑去，廊下的管事高喝一声，惊得我险些脱手摔了经轴。他道经卷用纸最忌直晒，晒过了头会发脆，稍一展开便碎成片片。我怀抱经卷立于太阳底下，脊背登时沁出了一层汗。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_0:event:assisted","text"],null]']
src = "blake3:adb9e2a21e530513071f6723d0e774968931bf321f262b25d57325cac1223139"
text = "老女房今夜气色好转了些，却仍叫我去代她的班。上回我把添油的时辰记岔了，还是她披衣起来，隔着帘幕低声唤我醒来的；她道出过一遭差错的人，下回眼睛才睁得开。临走前她往我手里塞了条打着三个结的细绳：一结是子刻，一结是丑刻，一结是寅刻。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_0:event:checked","text"],null]']
src = "blake3:058ddad465a8997d32eee2f68934b5864e1c6cc028b9c5636be8c526b7ea8718"
text = "这回病倒的是对面局里的年轻女房，托人来央我去顶她的番。上回我独个儿值到天明，隔日老女房仅淡淡吐了句“灯没灭”，从她嘴里出来，这已算夸赞了。北廊风疾，灯油只余小半壶；番帐上她那一栏被墨涂改过两遍，究竟该子刻添油抑或丑刻，只得靠我凑近烛火自个儿去辨。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_0:event:first","text"],null]']
src = "blake3:578347f812b6d391fbd0987050a5d5a2770ff2f5e683cc751b06681bbe0d8804"
text = "番帐糊在台盘所的木壁上，墨迹一层叠着一层，谁抱病、谁归乡省亲，俱用蝇头小字挤在格旁。我还是头回替人宿直，寻了半晌才觅着老女房的名姓，名后注着“子刻添灯，丑刻收残具”。长廊尽头的夜风打破损的板门缝隙钻了进来，烛焰一歪，我忙不迭抬袖去挡。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_1:event:assisted","text"],null]']
src = "blake3:65c9422423d33a678fcf563b40dc40c6037d154953228070587cd9ff69181251"
text = "管器皿的老仕丁今朝早早立在板架之侧，瞧见我进来，抬下颌朝顶上一层点了一点——那里新添了几张纸签，字迹写得硕大，仿佛专替辨不清旧签之人备的。上回我把两只高杯搁岔了格子，正是他一声不响地替我挪了回来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_1:event:checked","text"],null]']
src = "blake3:381836df9ce58655e49d0d7d8c0fa4b757f665d97ba546323dc0721102cc20a2"
text = "昨夜有宾客赴席，撤下来的器皿远多过往常，素烧土器摔了满地碎碴，悬盘上尚沾着残酒渍痕。前番我逐件归回原格，御厨子所来点验时一件不差，那位向来锁着眉的女官往我这边多瞄了一眼。新近进来的小女童跟在我背后，候着瞧我先拎哪一件。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_1:event:first","text"],null]']
src = "blake3:2e2eacc17b6351620fcae4e1a54bc91080601a63fd9c7eb5a4509760b84e29d5"
text = "头一回受差收拾御膳器皿，我捧着只盖碗立在板架前，偏寻不着它该进的格子。纸签上的字迹叫油烟熏黑了半截，写的是“御汁”抑或“御汤”，着实辨不清。背后的女房不住地催，说再耽搁一刻，御厨子所的人便要过来点验了。碗盖在我掌心微微磕碰了一下，那记轻响立时教满屋静了下来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_2:event:assisted","text"],null]']
src = "blake3:30aab1020803182a23a770e2814a8ac095d04c4432e2aaa7df3d3b018bc4ab9b"
text = "今番老女房先将五件袿照次序平铺于席上，每件领畔都压着一枚小纸条，上头是她手书的假名，墨迹尚湿。上回我把二层与四层弄倒了，还是她立在镜前逐件脱卸下来，重头教我替她穿妥，膝前滑落了一地衣带。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_2:event:checked","text"],null]']
src = "blake3:bfab08d37c8bfb4b2279378e44de06391db347fdfeafb747d5ac39e1a5812eb8"
text = "借来的那一领袿，色泽较原配略深了几分，搁在第三层，会把上下两重俱压得发暗。上回五层袿我由里及外排得一丝不乱，老女房对着铜镜端详了良久，赞袖口那几道边“像水一样”。这回她却不发一言，径将那件衣裳往我怀中一推。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_2:event:first","text"],null]']
src = "blake3:2e4c492a16b8ff47fba5597ad4975a418c676e2354b2bf9bf360893f6e13adcf"
text = "我初时当袿只要色泽鲜亮便够，抱了一叠衣衫立在屏风后头，越瞧越似晒在屋檐下的一堆叶子。老女房叹了口气：“这一套叫什么，你说说？”我支吾着答不上来。她拈起袖缘探出的那一重重细边示我看：紧要的便是这几道丝线，叠岔了一条，满座之人都瞧得明白。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_3:event:assisted","text"],null]']
src = "blake3:2768debdb05e19ab5b4ed61f92647c7402e556149fa7bcf48edd6d433d2b5e06"
text = "传信的人又登门问起席次，老女房端坐未动，手里笔不停歇，顺手将那册旧记往我这边一推：“上回我检的是哪一页，你要是还记着，就自个儿去回话。”前次全是她替我张的口，没费几句话便将传差的事拧了回来，我不过在旁托着书罢了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_3:event:checked","text"],null]']
src = "blake3:826bd2a3d630d46f1f37542d2b34ac5cbc9fa153dbecef540537bc5051d98737"
text = "有个怀里抱着虫蛀旧录的侍女径直找上我来，言明她家主上只认“先例”二字，旁的说辞一概不入耳——为了席次，她连老女房都绕过去了。前一回便是我从旧记中搜出先例，把错乱的位次正了过来，次日两位大人入座时，面色都平平淡淡的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_3:event:first","text"],null]']
src = "blake3:c9aac1ecc0da9b0b019c4d2e3cf0448a5c7cc387ec14411b4ea8b63839a50be2"
text = "传信的往我掌心塞了张折起的纸条，上面勾着几枚圆圈，圈内填着官职，彼此拿线牵着。彼时我还不谙席次之数，端详半晌，只辨出顶头那一圈写着“大臣”。老女房接过一看，眉头立时蹙起：“这图里头，有个圈占错了位子。”说完却不肯点破是哪一个。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_4:event:assisted","text"],null]']
src = "blake3:da9a3ed3f645ccac3ad578c27b11db1e9b330f0ce415acc84f7e88275ea6dbf1"
text = "押送进物的来使还跪在廊尽头，老女房先塞给我一束细竹签，嘱咐每点清一串便往盘中投一根，末了只核竹签，莫信手指头。前一回我将钱串点岔了一串，她令我从头再数，自个儿却转过身去吃茶，直待我点准了才回过头来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_4:event:checked","text"],null]']
src = "blake3:a6198aaf88ea80a58f25f911d7d84c30eea3ff13e4d4f79c129695f2a2411f9e"
text = "这趟送进物的使者是个年轻武士，晒得面皮黑黝，口音极重，边报数边揩汗，眼皮不敢抬一下。他嘴里报的数，竟与名簿差着一百疋。前次我将“代”字与实物析得明明白白，落进日记的那几行，老女房一字未动；故而这一遭，她干脆把名簿径直递到了我手上。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_4:event:first","text"],null]']
src = "blake3:60ab791cd11019e12de8d1103c9aef4cfe449b3e44c034cf1514aebfdc99a912"
text = "头一遭捧着名簿去廊下点收进物。递礼的使者伏在廊尾候着，盼人收妥好回去复命；我手里那本名簿比臂膀还长，字迹是武家风骨，锋棱硬似刀斫。对着“鸟目”二字我端详了半晌，方忆起那是铜钱的雅号——钱心那方孔，可不就似鸟雀的眼珠么。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_5:event:assisted","text"],null]']
src = "blake3:2cf3f14b0b81645fc44af40ef48f1cd2311a6cb064f702a53db574123b8a328b"
text = "门外又候着讨复信的使者。老女房迟迟未沾墨，反倒先朝砚屏上贴了三种“殿”字，纸墨早已泛黄，瞧着像是陈年留下的范本，专供新来的人参看。前一回我将宛名写成草书，便是她执刀片将那一隅纸面轻刮下去，改填作楷书，刮薄了的那块竟透着亮。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_5:event:checked","text"],null]']
src = "blake3:1b2039f9408140d525076503ce8b1d0f779db61b8d05136009a0b529f5b9e9b4"
text = "门外候着位僧人，代他家住持求一纸覆书。前次我替老女房拟定的宛名，信送出去后并无退还——在宫里，这便算得是上佳的音信了。只是出家人的称谓自有一格，全凭那座寺的寺格而定，我只得重把旧信匣拖了出来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_03_5:event:first","text"],null]']
src = "blake3:0db676becfeb2236034b2d50360e70d200764740141a5c4adfddf11832aeca0a"
text = "老女房在废纸上排着写了三个“殿”字：一笔楷书，一笔草书，一笔游丝般的假名，摊在眼前教我辨。我彼时还当写字只求落纸成文便算了事，岂料同是一个意思，送至人前，受者的面色能差出老远。她把笔递过来：“先识得清，再学着下笔。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_0:event:assisted","text"],null]']
src = "blake3:9e63a8d95b4276747fd818aed58c85bf0d161458a71727a377bb384b547be2a4"
text = "开席前，执笔递与我一张纸条，罗列着当令最易犯重的几个字眼：露、霜、月、花。前一回那重出之词我并未听出端倪，幸而宗匠自行住口，打趣道“这露水下得频了些”，客人才肯改句；待散了席，执笔倒也未曾责怪我。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_0:event:checked","text"],null]']
src = "blake3:9f0f57a19233eceaf0e02323cb1bb1fa2046da182b263c9c6dd5e04f4b1d6d99"
text = "又逢月次的连歌会。执笔方落座，便将那册式目小抄暗暗拨到我膝前，压在砚台下边。前次正是我在他耳畔细声点破了重出的字眼，他顺着诵句的空当，婉请吟诗者易了一字，满座上下皆无人觉着难堪。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_0:event:first","text"],null]']
src = "blake3:164988dc6675c14bbdcba56459fa7e4cba00192493a6ac4c925a866ddc71064e"
text = "一回百韵得写足四张怀纸，每纸两面都要填满，每逢新句吐出，执笔必先朗诵一回方才落墨。头遭跪在他身后默数句数，正数着，忽听句中嵌了个“霜”字，心口不由一紧——前头似乎早已使过。我哪敢作声，唯死死攥住了袖口。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_1:event:assisted","text"],null]']
src = "blake3:64e9dd48dac7eedad3ee1b28663403300f4efc9a632fdf958e4efc2187ee1228"
text = "这一卷和歌，未落墨前我必先逐首轻吟一回，凡诵过的，侧旁便用极细的笔锋点个微点。前次落款抵牾的那一首，便是老女房听我读过，复将那女歌人的另三首吟与我听，方才替我定下的署名。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_1:event:checked","text"],null]']
src = "blake3:6056ce823d45ff5c6112b4ff1b07dfb28535b5093eda5c1c88d3dc42ecc77c02"
text = "今番要录的本子愈发古旧，乃自别家暂借，主家特特嘱过：纵是一字亦不准擅改，但有存疑，唯许附注于侧。前一回我在那首署名分歧的歌旁添了行细字“一本作读人不知”，呈缴时老女房掀至该页，唇角似微微牵了一牵。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_1:event:first","text"],null]']
src = "blake3:646de6257a067a737583eabd01702fbfc8c8aa429c798d7636d6e9cd3ae99111"
text = "所用皆是薄脆楮纸，每纸录六首，首前先署作者，空一格方抄歌辞。局里头一遭派我誊写和歌，我原当人名只需照抄即可，待抄至第三张，却撞见同一首在两部书里分属二名，一为名重之歌人，一却仅书“读人不知”。笔锋正悬在那一格上头，墨汁滴了下来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_2:event:assisted","text"],null]']
src = "blake3:351716e42ba5148605821b5042621413f094c2c15bb416683d86ee877571df46"
text = "我刚落座便掀开那册《聚分韵略》，页畔那道甲痕仍在，纸页早发软了。前一回“冬”“东”二字我未能听破，散席后执笔捧着韵书逐页翻检示我，及至“冬”部，便是他拿指甲掐下的这道印记。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_2:event:checked","text"],null]']
src = "blake3:e87c455bc75a36b36d2b188dc1df5be2a4cfe599c77c01c43c5ce83bb4eb2a87"
text = "这回联句改押“支”部，那一部收字浩繁得紧，目光掠过去，活像面对着一整堵密格墙。前次“冬”“东”相混，正是由我抢先检出韵书那一页，执笔依之作了更易，散席后那位客人还特意打听是谁找出来的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_2:event:first","text"],null]']
src = "blake3:1f3c4e9c8fbe504adc0f54f123e2360b5055d8ae8257ad63bee896609d175cf0"
text = "和句尚且入耳能懂，一转到汉句，满席人皆低声诵字，听着活似寺僧捻动念珠。那是我头一遭列席和汉联句之会。执笔案侧搁着一册翻毛了边的《聚分韵略》。当日限押“东”部，有人对出的句尾落在“冬”字上，我耳中只听出两音无异，全然不觉有何不妥。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_3:event:assisted","text"],null]']
src = "blake3:3ae1c4cb3706e3b03b6aaf591ee10c504a8e59038e4999f6b387c8ab94a58ef2"
text = "老女房挨在侧旁缝补针线，手里活计不停：“你先自个儿挑，定妥了再拿来过目。”纸箱便摆在我膝际，箱盖早替我揭开着。前次是她代我择的纸，将两层薄样并立窗前，引我看日影穿纸时，下层底色如何隐隐透出面纸来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_3:event:checked","text"],null]']
src = "blake3:6d42407fa04e56c6e90ac8d27f398c5dc014dcda87628dc651f7ab29d38d2e3f"
text = "此番要寄的是首赔不是的歌，选纸愈发棘手：浓艳了嫌轻佻，素净了又类吊唁。前一回我自配的双色薄样，人家复函时竟用了一般无二的叠法，老女房道这便是回了个礼。眼下箱中堪用的独余三张，我逐张拈起审视，又逐张搁回原处。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_3:event:first","text"],null]']
src = "blake3:0a447632313925326c003e870849147c099a7e3a15c6b03a33cacdb0b0a2027e"
text = "替人拣选寄歌用的纸，我择了最入眼的那张薄样，老女房接过迎着窗亮一照，开口问道：“庭外的林木，这几日是何等颜色？”窗外树影我每日见着，何曾料到它与信纸能有瓜葛。她将纸放归箱内，把纸箱又推返我跟前，令我重择一回。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_4:event:assisted","text"],null]']
src = "blake3:c692fbd355f94a11c754375fd4fe4e81b331edfed1bce8e9c2c9930628c89ee5"
text = "月次歌会的怀纸刚一送齐，读师也未等我伸手，先将众人的官位抄上小笺，由小及大列作一排，拿镇纸压在怀纸侧畔。上一回我不小心把一位缺席者的怀纸插得过前，全靠他在开讲前一刻暗暗抽出，归回原位。这回他却只是在一旁瞧着我理。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_4:event:checked","text"],null]']
src = "blake3:ab0f3a12af20036c0e5d66632024b51590a8c0e8c43c62ccf846aa21ff5b7eb4"
text = "今番歌会告假的人越发多了，攒下三张留稿。内中一张纸角曾沾了雨水，墨痕微微洇散，读师拈在手中迎着灯光端详半晌，这才交到我手里。上一回我把未到之人的怀纸安在了正经位次上，讲师唱到那首时，合座的人竟都向着虚席微微欠身。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_4:event:first","text"],null]']
src = "blake3:5b8de3b22385d1a440f4c36eea84ed2a1073577dc8ac90cd4a0442eba4f486d7"
text = "几案上摞着十来张怀纸，右上角皆书着歌题，左下角则落着官职与姓名。读师头一回教我按身份理顺，我对着那许多官名发了半天愣，孰高孰低，仅认得一半。叠底压着两张未到场者的，墨迹比余下的都旧，瞧着倒像许多天前便已落笔。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_5:event:assisted","text"],null]']
src = "blake3:5fc2341231dae1ceb1d30807c63d66dc3c5043c1c3a9528cf70ced8a28eec43d"
text = "今年的用纸换成了新漉的料子，较去年厚实，下刀得使两道力方切得透。老先生坐在廊下陪早到的宾客叙话，只偶一回头瞥上一眼，没再按着竹尺教我推刀。来客又添了几位，名帖里有个我素未见过的名姓，旁边注着“远来之客，题自择”。我手里捏着一条未题字的赤纸，倒拿不定该为他留哪一种色。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_5:event:checked","text"],null]']
src = "blake3:a9abfdbed317aaa98e536a384e62adadcff780f6147a936ad660d2a45e43a072"
text = "染坊交来的黄纸走了色，染得近乎土褐，与白纸并排一搁，瞧着平白像放旧了十年。老先生把整箱纸交到我手上时竟未察觉，此刻早已去院中摘梶叶了——想去年我按歌题配出的纸色，还曾有客人特特打听过是谁裁的呢。宾客申时便要登门，再往染坊跑一趟是绝计赶不及了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_04_5:event:first","text"],null]']
src = "blake3:31cd99c6e3c3f50b045cb4c4ee3df065278f6bfec4a9a96695b1cfb43ed88dc1"
text = "教歌的老先生曾言，短册若是裁歪了斜，歌句再佳也免不了像醉汉歪站着。五色纸叠在一处，散出浅浅的染料气味。紫纸最金贵，他特地嘱咐我先动别的颜色，待手稳了再裁紫的。我头一遭替人裁七夕短册，刚按稳竹尺，刀刃才推至半途，底下的纸便跟着溜了出去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_0:event:assisted","text"],null]']
src = "blake3:a697c0781e91a3ca1501744dee86a6ed79635efdea521acbd395666b83f66214"
text = "今日老尼取来的碎屑色泽发灰，恍若落了灰的木炭。她说这是去年雨季受潮的那块，劈开后香气尽往里缩，要编号须得先晾过，便是捻着也闻不出门道——上回她教我捻香，指腹的香味整整两日才散。我将碎末铺在竹匾上，搁去背阴的窗畔，可标号的纸签已写了半数。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_0:event:checked","text"],null]']
src = "blake3:7e987c41b9ca52493ec5614dc46fe1eee6d18a24ba49e52394c6345b4e61cdd4"
text = "上回那十包碎屑是我亲自理出的，老尼拿了第三包去赴闻香会，用完没退回来。今日她重劈了一块新木，碎末比上回多出一倍，色泽却浅淡得多，嗅着仅余微微木气。她道这是商客自南边捎来的，价钱少一半，香气也少一半。我拈起一粒打量，暗忖着它究竟够不够格编进号里。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_0:event:first","text"],null]']
src = "blake3:0b9fe61b943de17c05e76cce88b54ae0c455d50cecb2891f8bad1eb98e90f4c5"
text = "香室里虽未焚香，气息却暖融融的，梁下悬着一溜桐木小匣，匣口俱贴着纸签。老尼初带我入门时便说，香木贵比黄金，便是碎屑也断不可扫弃，须得逐粒收进纸包、写了编号才算妥当存下。她交予我一双竹香筯，箸尖细如绣针，我试着夹了三遭，竟一粒也没夹起。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_1:event:assisted","text"],null]']
src = "blake3:a534f2f694c1460775eed9d95f9ca44efd48c8dd6c228649b1c12b2f454e8322"
text = "后屋门板上仍钉着那长条香方，上回掌柜添注的“制”字依旧清晰。今日要配的乃是“黑方”，方中多出一味薰陆，可罐底竟只余小半，过秤一称，短了一钱有余。此时掌柜正在前铺应酬一位武家来客，隔着布帘飘进来的谈吐，恰巧说到价钱上头。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_1:event:checked","text"],null]']
src = "blake3:727170d7d7db15a7efbf350727ad8df3f1b252064282ef0ce67d03d297f68728"
text = "前番我拨开的那罐生甲香，掌柜一直搁着没动。今日他叫我领“侍从”一料的香材，方子是徒弟抄录的，笔迹潦草，白檀的分量竟写成了“二两”，反比沉香还多。若真照这个分量去调，满炉怕是全剩白檀的木气了。偏巧那徒弟已经回乡，无从问起。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_1:event:first","text"],null]']
src = "blake3:ea5fefdae2c3179ad6be1fa6975fd1d17cc5bb160d0bb94a0783f68e90ad2784"
text = "香铺后屋既仄狭又幽暗，一排排陶罐列在木架上，罐口俱拿油纸严严扎紧。我初来取料，解开一罐，丁子那股辛辣气直蹿鼻梁，险些把眼泪逼出来。掌柜交我一杆小秤并一张方子，嘱咐麝香最为贵重，挑取时须敛声屏气，万不可对着罐口打喷嚏。谁知我才刚松开麝香罐的扎绳，鼻尖竟痒了起来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_2:event:assisted","text"],null]']
src = "blake3:abf9cd927de623758c98574e55c52fd381705d36a2eb228e5b137f2a8505e32d"
text = "今日的香会散场早，日头尚斜斜透入屋内，照得漆盘熠熠生光。老女房言日光晒着的香炉散温慢，吩咐我搬往阴凉处——想上回她伴我听炉中微响，竟一直枯坐到掌灯时分。我才将第一只挪开，长廊下便有人唤她，她当即起身离去，只留了两只香炉，并一句“别急”。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_2:event:checked","text"],null]']
src = "blake3:b22ffc912f02ec15b9ca58042f53a988a6669ee1026f3d4e1397bbcfdb055eb0"
text = "此番使的乃是一位贵客自携的青瓷香炉，正经唐物，釉色薄得仿佛能透光。上回我归置的香具，老女房开启查验过，虽则未置一词，但这瓷炉散热原比陶炉快，亦极忌骤冷骤热。长廊外风势正疾，我方端着它朝檐下迈出一步，随即便刹住了手。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_2:event:first","text"],null]']
src = "blake3:94d6f493d76c0509b82d904951f37c48cf9daaa43f98fe7f5d900b68b5f3ca87"
text = "我屈膝守在屏风后头，瞧着众宾客依次将香炉捧至鼻端，左手承底，右手虚拢炉口，闻定便落笔写下香名。那是我头一遭替闻香会打下手。散席后老女房把香炉交予我，道是香会末了一桩差事便是等，直待炉凉透才算真正散场。我双手托着那只炉，反倒觉着自己掌心比炉壁更发烫。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_3:event:assisted","text"],null]']
src = "blake3:cbb5e64d8f30183944d827e36b54e08f9b27e724f6edc9845b8b62a7c799d6e5"
text = "师傅递来一块真沉香，教我照样拿水试一试，一如上回他凭一碗水替我辨出假木那般。谁知投入水中，那木块竟飘浮着久久不沉。师傅见状笑了，道这一块含油寡薄，本是浅层之木，原不是沉不下去便定属赝品。我怔怔瞅着碗里打转的木块，掌心反倒沁出汗来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_3:event:checked","text"],null]']
src = "blake3:4cc131ae18a5ccfccac69cb6d6cdcd231f2774c4dcc1f16e9a393f5840b474c3"
text = "前番那块充数的假木是我炙香试出来的，师傅留了它在案头压纸。不想今日香箱中竟又多出物件，此番是一小包褐色香粉，封纸上书着“伽罗”二字，显非师傅的手笔。他道伽罗何曾有碾作粉末的道理？我端着那纸包行至窗边，拆既不敢，丢亦不能。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_3:event:first","text"],null]']
src = "blake3:d3e6fe8beffb7a4ba123eaac4d65200b5caf7094f9c3f4fd5861b96e26bffed7"
text = "香箱由桐木制就，四角包铜。师傅特许我推开箱盖，盖面滑启时悄无声息，立时飘出一缕清冽甜香。内里整齐列着十二个纸包，各题着香名，或摘自古歌辞句，或单标一个地名。师傅叮嘱，每块香木各有渊源，何人所赠、何年所劈，皆须铭记于心。我手捧其中一包，连喘息都不自觉放轻了些。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_4:event:assisted","text"],null]']
src = "blake3:84bdee4fde10e49fce893d6e96d49117c6b180e4ee36204d4f3dce9ef2869dac"
text = "今日香会用的是借来的旧笔，墨色打头到尾一般浅淡，前番女房靠墨迹替我认纸条的法子便使不灵了。纸条上的笔迹一个更比一个潦草，偏生客中有两位是父子，字体像极了，连写“客”字那一捺都往同一边甩去。女房此时已出门送客了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_4:event:checked","text"],null]']
src = "blake3:43f8e6c2e34ace1d74806afa36d9543dcb5382cd380ed4dfa2dca2409acadf73"
text = "手头这一叠纸条皆未落本名，只署着各自的雅号，诸如“初雁”、“岩根”之类，我竟一个也对不上人头。女房递过纸条时顺口提起，前番我整理的那册香记，她已装匣封妥，寄交一位远在越前的老香人了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_4:event:first","text"],null]']
src = "blake3:ff7b59dddf6ab2900b43a9a88e859e02201be46079cec660bc3c6c2a6e12468a"
text = "执笔女房将一幅长纸展在小几上，告我这便是香记：顶端记明时日与香名，下首一行行留待添上宾客姓名及所猜答案。香记须得传诸后世，故而一笔亦不可涂抹，若排错了次序，唯有整幅作废重抄。我头一遭替她打下手，研墨时手腕直打颤，连砚台沿上都飞溅了好些墨点。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_5:event:assisted","text"],null]']
src = "blake3:5b4760d356e549b804f550660e84d50bc4804d1b0db50b6c0947919bb76f47f5"
text = "今年的雨来得迟，直到七月初才住，库中倒未生霉，桐箱盖却受潮胀死，推不动分毫。老僧操起木槌轻敲了几记，箱盖仍卡得牢牢的。他说硬撬恐会劈裂，不开又怕沉香一直闷着。上回还是他领着我逐颗摘净丁子，这回却把木槌递给了我。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_5:event:checked","text"],null]']
src = "blake3:1567d7f53ac9da528beed1a0d15c690b5fc7cda3d6779cdc6cc8188d87a9b7ca"
text = "上回香材是我按类分开晾的，老僧夸那年库里没损半样东西。今年雨霁后他去山下末寺做法事，临行托人传话与我，嘱咐将龙脑匣挪个去处。谁知我把香库翻找了个遍，始终不见那匣子的踪影，唯独瞧见梁上新添了一道水渍。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_05_5:event:first","text"],null]']
src = "blake3:bee414f2f51bc098a1989a72cc11dd73a5260f33c4bc222d507927b20cfec8a5"
text = "梅雨连绵了好些日子，老僧每日一早总要推开香库，拿手掌贴着墙板试潮，再凑到屋角闻一闻。他说香材不怕落雨，就怕雨歇后的闷热，库里一返潮，最先坏的定是最金贵的那几样。我头一回学着他去嗅屋角，满鼻只有一股霉木味，实在分不清哪只罐子出了事。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_0:event:assisted","text"],null]']
src = "blake3:7a96d64f5cd9bb6301433e9a66856de001f6b683e2bb7604fd7e487c00beded8"
text = "那株柳树今春抽了新枝，比去年长出一大截，低垂着几乎扫到场心。主人家却舍不得剪，说是垂丝才好看。上回还是师范带我一步步丈量的树距，这回他派我去向主人家开口；只是他向来话冲，主人家眼下又在气头上，这番话少不得换个婉转法子递过去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_0:event:checked","text"],null]']
src = "blake3:53d25633d95b9a69e46e2bbb8b672558c4281210fbea41b7a55b61d5180372cb"
text = "上回四棵树的间距原是我拉绳校出的，园丁也依样挪栽妥当。今日另有外家鞠场的客人前来观场，他向师范讨了腰间那根麻绳，亲手量过一回，点头说四边俱准，唯独西北栽松不合他家的法度，他家须得把松树种在东北。师范立在一侧听罢，神色立时暗了下来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_0:event:first","text"],null]']
src = "blake3:7c5f70b614ee0c8a0da1a29b4fc3b2649fcb054113e0fa2366925004d2b83648"
text = "鞠场地面平展如席，上头匀匀铺着层细沙，我头回踏上去，脚底沙沙作响。四角各植一树，师范告知这四棵唤作“懸木”，鞠踢高了即便触及枝叶再坠下，也不算落地。我仰脸望向那株松，松枝探入场内，活像一只手悬在半空，正等着托住什么。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_1:event:assisted","text"],null]']
src = "blake3:7bb1fd8b2f242ea87e5b5e432e99cb5e556260cbbef53fd7d7f0c95d10758c4d"
text = "今日急雨骤至，一连淋湿了两只鞠，一只白鞠，另一只是熏黑的旧鞠。老鞠足说黑鞠外皮经烟火熏制过，虽不畏水，偏怕干风吹出裂纹。上回他教过往湿鞠腹内灌干麦粒，无奈我手头仅余一捧，背阴檐下偏也只腾得出挂一只的空档。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_1:event:checked","text"],null]']
src = "blake3:000decf94342691ed469f4e235d94d44e8ee7985de08dbfcb72f3b6ddcd56258"
text = "有个孩童一脚把白鞠踹进了池塘。上回它沾水，还是我吊在仓房北檐下阴干的，之后耐着踢了一整夏；这回打捞起来，腰间那圈马皮缝线竟崩断了两针，水正打裂口里往外直洇。我捧起鞠，指尖头一个触到的便是那两道断线。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_1:event:first","text"],null]']
src = "blake3:0e3e34c7b79dee501258b0b01a3e1dd91052fba6c6c2a2a2df5ab0b82b53923c"
text = "老鞠足将一只真鞠搁进我掌心。这物件比预想的轻巧，表层覆着白粉，按下去微微一陷，松指随即弹回原样。老鞠足道，制一只鞠得费两张鹿皮，缝合时腹内填满大麦以定圆型，而后再逐粒倒净，功夫要耗上好几日。他叮嘱鞠最忌水，遇雨须先抢鞠，次及救人。我原当是句玩笑，他神色却半点不曾松动。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_2:event:assisted","text"],null]']
src = "blake3:ebe3226fe2b35bacedda3203229380df040c84cddedeef26d0769a660b2d6f58"
text = "主人家的侄儿今年满九岁了，接鞠比从前稳当了些，偏不再肯往柳下站，一门心思要回松树底下——上回还是师范出面周旋，才劝得他挪去柳下的。偏巧今日来了位来头更大的贵客，亦是初学，正呆立在松下无所适从。场中两双眼一齐望向我，师范却在场子那头忙着指点他人。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_2:event:checked","text"],null]']
src = "blake3:ccc78d78fe31bbb3ac21f0b6ac12d2eff9a3a2844c7d98ca89c24c3d1ae18df0"
text = "上回我哄着那小子挪去柳树下，打那以后他跟我熟稔起来，每回见着总缠着陪练。今日他领来一位表妹，亦跃跃欲试想进场，无奈主家家规森严，女眷一概不许下场。小姑娘只得拘在场边，双手攥紧袖口，眼珠滴溜溜跟着半空的鞠打转。那孩子拽住我衣角，央我帮她寻个法子。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_2:event:first","text"],null]']
src = "blake3:ece1d308d64f8ae1b38f96c8f890a4e8ad864b757f41e61e63494886f99e8f9c"
text = "八人各守一方，师范逐一点定站位，哪棵树下该立谁，首要论出身，其次才论脚法。我是新来乍到，被派在最末一席，紧挨枫树，斜垂的枝叶恰好遮住半边视野。身旁有个年长些的孩子压低嗓门告诉我，占末位的跑动最苦，旁人踢歪了的鞠尽往这块儿落。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_3:event:assisted","text"],null]']
src = "blake3:9dc6eaf77b5d20f3e45030c355fd337ff5b10629631586c981945fb3c1af34fe"
text = "今日把鞠踢飞的竟是我自己。脚面不慎一溜，鞠斜斜窜上柳梢，让细枝一弹更朝外蹦去。上回师范在沙面划八个圈，单讲了如何替旁人补位，却不曾交代踢飞鞠者该当如何。对面原本候着接鞠的是位年长客官，腿脚迟缓，我若撒手不去追，他少不得要当众奔出好远一截。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_3:event:checked","text"],null]']
src = "blake3:a62b3f2dca74b28bb21cfe1166f794ec77316b9736006959e5e6233a69f97f9b"
text = "今日场内多半是生客，乃邻家鞠会邀来的人手，补位章法与我等大异：他们不思填补空当，净一味朝鞠飞去的方向扎堆。上回我斜插补救那记高鞠，师范事后曾在人前夸过一回。果不其然，头一记高鞠方才窜起，便有三个人撞作一处，那鞠不偏不倚坠在我脚畔。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_3:event:first","text"],null]']
src = "blake3:08028bc40a5ca8602f3ee30a6e9263c49311997a234219a22200edf9ad3e85f0"
text = "鞠不住在头顶盘旋，我双眼死死咬着它，双脚却频频慢了半拍——这到底是我头一遭下场踢足整局。师范说过，漂亮的一记传鞠，应当高出人头一截、又矮过树梢一截，好让下家接得从容体面。踢得冲天是卖弄，贴地则是刁难。偏我踢出的头一脚，鞠擦着自己鼻尖便直直掉了下来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_4:event:assisted","text"],null]']
src = "blake3:88543d299b48c7e7120bc9ebdc98ba0cba4c4a457faa36fdee28d1c940eca151"
text = "鞠沓系带竟又断了。上回劳烦庭役跪于树荫替我拴好，系罢还轻拍我脚背，嘱咐下趟得自己动手。今日他正立在场边聚拢落叶，闻声竹耙半悬，仅朝我微扬下巴示意；我那条备带原已悬在柳树低桠上，是他清晨早早替我挂妥的。眼见着鞠正朝我这边坠落。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_4:event:checked","text"],null]']
src = "blake3:08746b7c21a1083e4c1ec8ae3e0d9bfa981aec8dafa5fb7724f06215f5404b04"
text = "带子又断了，这遭是左脚。上回我自行退至松后换带，半脚未误，庭役事后便往我鞠袋里多塞了两根备带。偏生今日鞠袋搁在场边石头上，当中隔着半个鞠庭；上座又坐着登门的客官，规矩比往日更严出一层，那鞠却正朝我头顶坠落下来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_4:event:first","text"],null]']
src = "blake3:bf92dce29b9173e7803eb93e7747696b17c183dac5ed572fe43902ee02b10995"
text = "新领的鞠沓皮子尚硬，系带勒得脚背发红，才踢至第二十下，右脚带子便打沓眼处绷断了。我头一遭碰见这状况，立时僵在原处，下家连忙替我多挡了一脚，鞠在他脚背颠了两颠，仍旧朝我送来。上座有人忍不住笑出声，师匠却仅是合拢折扇，静静望着我。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_5:event:assisted","text"],null]']
src = "blake3:024ac2bffda0ddcfd2752b54c0e27d98724823371f33c0a46d3ba206e5331cdc"
text = "庭役被叫往前院挪搬膳台，一趟趟从廊下穿梭，竹耙便靠在柳树旁——上回就是他指点我退着步、朝己身拉耙齿的。众客刚迈出中门，场中脚印偏比上回还要杂乱：今日添了两位新学的，在沙里跌了好几跤。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_5:event:checked","text"],null]']
src = "blake3:854bf38b25bbb9d3ec339e2d320a56b6455ed2e451a46cdb47d868b5125340fb"
text = "踢至半截天降阵急雨，沙土湿润，竹耙一拖便滚成硬块；偏偏众客聚在廊下观雨兴致正浓，半晌不往中门去。上回全是我独自将鞠庭打理平整，师匠步出时驻足打量了沙面一眼，只字未发，径直把锦袋交由我捧回。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_06_5:event:first","text"],null]']
src = "blake3:d746b05eac3dd9c4359ca0f1f9ab3a664a67779510964b4648b7ddf18e30390e"
text = "踢在兴头原不觉察，散局一望才见满场踩得零乱，独我自己的印迹最杂，在松树底绕了好几圈。宾客正于廊下穿鞋，谈笑间往中门行去，我头一回留步收场，抄起竹耙正待下场，肩头忽地被一只手压住了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_0:event:assisted","text"],null]']
src = "blake3:f6fca0d16869971a880bdfd68264871c2a3db5b632a468dc68ba11d7d0094c1a"
text = "几块名札昨夜让野猪拱翻了，畦边的泥里满是蹄印。墙那头的经堂里，老僧正替施主念回向，木鱼声一下一下透过来；他早起只撂下一句话：晌午前插好。上回他牵着我一畦挨一畦地认，教我先闻，再去看叶背。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_0:event:checked","text"],null]']
src = "blake3:1cd006a3ceeab52a4d916adbdf1d653bb903a7e6910c3dbb74646c9468a771cb"
text = "药园里的名札又乱了套，这回是小沙弥们追猫，把一排全踩倒了。上回风吹散了名札，都是我独自插回去的，老僧依着我插的抓了一个月药，半点差错没出。偏偏今日被踏倒的是新栽那畦，苗才两寸高，叶子还没长出模样来，名札上的墨也给踩得糊成一片。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_0:event:first","text"],null]']
src = "blake3:8955147cee549b35f253020e4016b5f10925b16ce40b832b6690b1794cfe9f1a"
text = "寺中药园的畦头插着一片片削薄的木札，上头墨书着药名，有的叫雨水洗褪得仅余半个字。头一日老僧领我入园，便叫我将歪斜的扶正。扶到第五块，我留意到紧挨着的两畦竟都插着“紫苏”，叶片一般起皱，边上也一般生着锯齿。正在井畔汲水的老僧回过头来说：“其中一畦是荏，榨油用的。你辨得出么？”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_1:event:assisted","text"],null]']
src = "blake3:714010bf61f16f9bc20f79d4a6e345548b086ed028e984bf9f8ae5b48cfe3419"
text = "乳母那旧伤又发作了。前回庵主教过我，将接骨木叶煎了，拿布浸着热敷，一凉便换。今日庵主就在后院菜畦里拔萝卜，唤一声就能听见；乳母倚着廊柱坐着，左手搭在膝上，臼里的艾只捣了一半，杵还横在臼口上。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_1:event:checked","text"],null]']
src = "blake3:e96e820edddae44e9dcbde5bb11f3791c931854dd598f405faa65445c55d9d70"
text = "入了梅，乳母的手腕又犯起疼来。前次我代她捣好艾绒、敷上姜泥，她见人便夸，念叨了半个月。今日庵主要用的艾绒比上回多出一倍，后天施灸，山下要来二十来个人；乳母偏一早就将臼挪去了廊下，捋起袖子，硬是不准我再沾手。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_1:event:first","text"],null]']
src = "blake3:d9d1deb0c667b8e024a3a1f0b404fb6974e2a4c6f659df9933a58be3ecb72c58"
text = "乳母在臼前坐着捣艾，才捣了十来下，杵就从左手滑脱，“咚”地磕上了臼沿。她急忙伸右手去扶，额头沁出一层汗，脸色白得像张纸，我从未见她疼成这模样。事后老尼才同我说起，她左腕上那道泛白的疤，原是我还被她抱在怀里时，她在石阶上失脚滑了一跤，为了护我拿手撑地才落下的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_2:event:assisted","text"],null]']
src = "blake3:88f6234237c72bd85552bc0353cad58ee80549850b851174e0c97b751eb8b4dd"
text = "又让雨淋了一回。本堂敞着门，望得见庵主曲着背，正往打湿的经卷里一页页夹吸水纸；小尼们在灶前挤作一堆，已经有人打起喷嚏来。上回便是她逐个摸过每个人的掌心，嘱咐我先顾谁，姜得切片，切不得丝。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_2:event:checked","text"],null]']
src = "blake3:03b1e6e0ee826a59c43f810f3c7856bce075948e2fac05466c6db3992af1adff"
text = "骤雨又落了下来，好些人浑身滴着水跑进庵门。上回我先替年纪最小的换了衣衫，又煮了一锅姜葛汤，事后庵主便将灶旁那口小锅专拨给了我。今日淋了雨的里头，添了两位从山下来进香的老妪，一个咳得连腰都直不起来，另一个却说宁肯受冻，也不肯在生人面前更衣。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_2:event:first","text"],null]']
src = "blake3:35aef82598ac25c2c7b985099442ff579fd40fdeb686e9d2c52cf0ca59be86e7"
text = "冒着骤雨一路跑回庵门，我尽顾着拧自己的袖子，雨水哗哗淌了一地。待回过头，才看见小尼缩在门槛边上，胸口抱着经匣，嘴唇白中透紫。庵主从里间走出来，望了我一眼，又望向她，一声没吭，把一叠干布放进我怀中。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_3:event:assisted","text"],null]']
src = "blake3:57f3e168c75395c2063fedc632c731ca2b7aa175365de91f9a3274552fb65d29"
text = "这口水缸又到该刷洗的时候了。上回庵主蹲在缸沿教我，洗缸使灶灰莫用沙，缸底的泥则倒去菜畦里。今日她在佛前换供花，隔一道纸门，都能听见剪刀咔嚓咔嚓地响；水缸已然放倒在地上，棕刷跟一桶灶灰就搁在侧旁，仿佛早有人替我备妥了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_3:event:checked","text"],null]']
src = "blake3:650be2f1dc5294a5addc878f0228b75287d0945452e8be25e29f6629b85087ee"
text = "才掀开缸盖，便见缸底沉着只泡胀的老鼠，不知哪夜落进去的，昨日挑的水全得泼了。上回这口缸原是我亲手刷的，晒透了才去挑水，还投进两块松炭；整整一夏，厨下再没谁闹过肚子，老尼见着人便说是炭的功劳。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_3:event:first","text"],null]']
src = "blake3:44e5ffbd43ee1205242fecedd1695ab45bfcbcffd3d38976eb0bc67c01a10d2d"
text = "我挑着水桶来到后门，桶才搁稳，便瞥见缸面漂着一层薄薄的绿膜，底下正有东西一晃一晃的。我只当是鱼，探手一捞，抓上来的竟是一把滑溜溜的青苔。厨下的老尼正捂着肚子从茅房那头回来，瞧见我手里的东西，脸色登时变了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_4:event:assisted","text"],null]']
src = "blake3:31dd939aee5ce025d493bc55f4a9db420928051fc5e90fcda0b6906ef901d757"
text = "庵门外又有人在叫疼。上回还是老尼教我沾泥、认艾草，把布条斜着缠上去；今日她正在厨下蒸饭，蒸笼里的白气直往窗外冒，她隔着窗喊了句“你先看着”。门外是个背柴的孩子，小腿上破了道长口子，还在往外渗着血。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_4:event:checked","text"],null]']
src = "blake3:8258e99ea1fd7c0f43f39bbf326de6541d2cb229e67aa996a9bda2d90acd79c9"
text = "山道上又有人摔着了。上回是我独自替人把伤口洗净、敷上嫩艾，隔了七八天，那人特地绕路过来谢我，伤处收口收得平整妥帖。今日来的是位进香的老婆婆，额角磕破了，血顺着眉毛直往下淌，她儿子背着她，急得话都说不连贯。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_4:event:first","text"],null]']
src = "blake3:c3aa016f977f1a8940612dd71142535cd2d35647e5e81e9b0cdee77403f04c96"
text = "一名挑货的老货郎在山道拐弯处连人带担跌了一跤，手掌整片蹭掉了皮，还扎着几根松针。他坐上庵门槛，把手摊在膝前：“小师父，庵里头可有止血用的东西？”我既不是师父，也向来没替谁裹过伤。厨下正剥豆子的老尼听见了，将豆筐往边上一推，朝我努了努嘴。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_5:event:assisted","text"],null]']
src = "blake3:b234b9850204c5ee7b8d99612241b20a2c41dd2d03267acc21a3995716cd294c"
text = "轮值的木牌又挂上了。上回老尼隔着板壁照看着我，教我听辨病人的气息，连药罐盖子都要斜搁着留一道缝。今日隔壁屋里也躺着个病人，归她照料，板壁那边时而传来咳嗽声，时而是她低声念经的动静；子时那一格眼下还空着。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_5:event:checked","text"],null]']
src = "blake3:1faf2ca6266617b6bfb71db64f4dbbff1223525781df41587ab3374df6baf510"
text = "庵里又收进病人来。上回子时至寅时那一班是我守下来的，药不曾熬糊，湿布也未断过；庵主翻过木牌，看了我记在背面的时辰，说比她自己记的还要细密。这回病了两个，共住一间小屋，一个要热敷，一个得冷敷，方子也不相同，两口药罐紧挨着，同架在一个炭盆上。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_07_5:event:first","text"],null]']
src = "blake3:5a8874e7a0c1f5d2788820cfa460a406e26e8e7ee30794d7e8257273e2935240"
text = "轮值牌的子时那格里，不知被谁顺手写上了我的名字。病着的是山下送来的一个烧炭人，唇皮干裂，不住说着胡话，才喊过冷，转头又叫起热来。我坐在炭盆旁，听着药罐咕嘟作响，既拿不准几时该撤下火来，又摸不清该先换湿布还是先喂水，手里的扇子倒越扇越乱。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_0:event:assisted","text"],null]']
src = "blake3:8a2ddd0cecb6213231349748f2f7d0dad26cdf2ed6b3a1fb4042d1d2f43b0da7"
text = "袈裟在席子上铺开，我一块一块数到第十四块，又瞧见一处线松了。前次庵主坐在窗下教我，补本寺的物件不可比原先亮，丝线宁可旧些；偏她今日一早就上山去本寺议事，傍晚才得回来，还袈裟的时辰却定在午后。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_0:event:checked","text"],null]']
src = "blake3:0c2a16ffe6637a6e5ad623a16ea35199408483eb995c4ded008e4a56e29e77d9"
text = "庵里又向本寺借了袈裟，这回是素色无纹的五条，拿去给新剃度的小尼披着拜师。上回那领七条，是我补妥了针脚、用袱纱裹好送还的，本寺的知客僧展开看过，回道“比借走时还要齐整”。这回袈裟拿回来，肩头一根系绳已经断了，断头已被谁系成了死结。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_0:event:first","text"],null]']
src = "blake3:2a8d7316a3ecc17efd0b02202564279be8740e4414f9c137e110b436aa12523c"
text = "借来的袈裟裹在一块紫袱纱里。送来时，本寺的小僧当着庵主的面点过数：七条，二十一块，两根系绳，还回去也须照原样再点一遍。眼下轮到我去送还，经手这等差事我还是头一遭。才把袱纱解开，一阵沉香味便散了出来，左下角却偏翘着一截线头。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_1:event:assisted","text"],null]']
src = "blake3:80254d350c37d11930263a5e0ac3e1f25137ba81f89acafe3f7d7e399a515013"
text = "案头又堆起了余布。上回老尼曾经逐块摊开指点我：绢留着补绢衣，绸边给孩童做带，布头别上纸条写清是谁家的。今日她在廊下替新来的小尼剃发，剃刀刮得沙沙作响，一时腾不出手；那半开着盖的零布笼就搁在我脚旁，里头早已塞得快满了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_1:event:checked","text"],null]']
src = "blake3:5de84a6277dbc6bd6e87599fb1d3fde05d97cb02ea7002d5a7f5ab70f90cc2bd"
text = "又补妥一件小袖，这回是庵主自个儿的，衣襟让香火烫出个洞。上回那户人家得了小巾着，老太太用来装了一冬药丸，开春还托人捎来一篮蕨菜。这回余下的布角是灰褐色的粗麻，硬邦邦的，做什么都不体面，小尼们只看了一眼便走开了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_1:event:first","text"],null]']
src = "blake3:c1fe51c1235f49c2b1e4f7d99c449d46983e73ad077ac7a1a495b5306ff79721"
text = "那件小袖补罢，我将剪剩的布角拢成一团，刚想扫进灶膛，老尼伸手一把摁住我的腕子。她从里头拣出块拇指大的浅葱绢，吹落浮灰，铺在膝上抚平：“单这一块，也够补个虫眼了。”案头零碎还剩着一小堆，她朝我看过来，等我自己动手收拾。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_2:event:assisted","text"],null]']
src = "blake3:41a355e4cdf04c2bd3968f77ec21243422dad3d21a4328c909dda88947448a4c"
text = "针线盒又到清点的时候了。上回老尼用线拴着慈石贴席拖找，叮嘱我每缝完一回就数一回针。今日她领着小尼们下山化缘去了；盒子摊在席面上，针插上偏又空出两个孔，那块慈石虽还收在药柜第三格，药柜钥匙却叫她带下了山。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_2:event:checked","text"],null]']
src = "blake3:7431f5f34829fe78605cde796e82e37ecc1d7b08728e60d82ce10d2e87fd2a97"
text = "又逢月底清点。上回我将针逐根数清，还在盒盖里头写下“针二十一，用完插回”，打那以后一月有余，众人用罢倒都插回了原位。这回短的偏又是两根，且是最细的绣针，后日便要替本寺的幡补绣金线，去山下的针铺一趟得走半天。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_2:event:first","text"],null]']
src = "blake3:eab35f1472d1bf700d0c29153f57d66381b954a3fe5cc749815c6f1c29451fe1"
text = "月底轮到我来清点针线盒。盖子刚一掀，线轴便骨碌碌滚了满地，红的、白的、柿色的，直滚进席缝里。手忙脚乱一一捡回，再去点针插上的针，头遍数出十九根，复数一遍又是二十根。老尼立在旁侧瞧着，开口问我：“究竟有几根？”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_3:event:assisted","text"],null]']
src = "blake3:c344c581c0da95018a2376e1b464ecd93262add15867be2efeb77f95874e122d"
text = "油壶又一次见了底。上回全靠禰宜的妻子拿炭条排班，我只在旁递线、剪线头。这回她回娘家帮手插秧，走前把那块三栏木板塞给我，吩咐“照着来”。可缝针房里换了人手：老阿婆眼睛越发不济，新来的小巫女手脚麻利却毛躁。木板上那三栏，竟像哪一栏也安顿不下她们。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_3:event:checked","text"],null]']
src = "blake3:cc6feea223e252fa8f9ca708485ff9acbbede21e581710b10fe68927f68ece8c"
text = "又撞上灯油短缺。上回的班是我排的，那块木板至今悬在缝针房柱子上，一角已被油烟熏黄。这回要赶制神轿上的垂布，虽比户帐窄，针脚却细密得多。妇人们一跨进门便先盯那块板，似是等我往上再添一栏。灯芯早已被我剪短了半分，可拎起油壶一晃，里头仍是只有一点点声响。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_3:event:first","text"],null]']
src = "blake3:ff1d81f7bb057099e4276ed62422725a20722dd9a0412a3061523add7232b82d"
text = "才头一回被叫进缝针房搭手，便遇上灯油不够。屋里就一盏灯，三个妇人团团围着，各自膝上摊着一角户帐，谁都不肯往后挪。外头天早黑透了，神前的御灯亮亮堂堂的，这边灯芯却一蹿一蹿，看着撑不到亥时。禰宜的妻子立在门口望了我一眼，那神情分明是在问：你看该怎么办。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_4:event:assisted","text"],null]']
src = "blake3:8c974fb0f49131c111323296fe50e04ff7506503e920150adb5f95bc8d275249"
text = "柜底铺着的那层炭是去年留下的，摸着潮乎乎的，一捻便散。去年老巫女坐在廊下一件一件教我叠，今年她得帮着操持卯月祭礼，仅抽空过来瞥了一眼，嘱咐我先别急着往里头放。她立在柜旁闭眼盘算了半晌，像是在数还余着几包新炭。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_4:event:checked","text"],null]']
src = "blake3:be2a074114beb27bff97006468d8eeb5589db09ae4e90c9925b0bf3d17e569e9"
text = "今岁开柜时，去年由我装好的那只唐柜里头衣物干干爽爽，柜盖内侧那张单子墨迹也仍认得清。偏生靠墙那只没人照管的柜子，掀盖一看，压底的两件绵入小袖让老鼠咬出了窟窿，绵絮扯得满柜都是。老巫女直叹气，说连耗子都晓得哪只柜里暖和。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_4:event:first","text"],null]']
src = "blake3:f52286fbfec0bb72fd7d55f04ac18b14a9e4d70d7599e2636eb20ab64ec675bd"
text = "本以为冬衣叠齐收进柜里便算了事，老巫女却把每件衣裳都抖开，迎着日光翻检，但凡袖口磨薄之处、露绵之处，皆用指甲掐个印记。她道衣物进了柜，要等到十月朔日才再见天，当中梅雨那一个月最是难熬。我抱着一摞布子立在柜旁，等她交代下句。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_5:event:assisted","text"],null]']
src = "blake3:356e969ced020a1938bfbb66de57a576d949ba2908904f0e40171d57292dc275"
text = "又有远客讨一只书袋。上回替连歌师缝时，布全由禰宜的妻子裁好，我只搭手缝了侧边。这回来的是一位行脚医僧，负着一摞写满药方的册子，嘱咐袋里需隔出几格，药方绝不可同药包混在一处。禰宜的妻子正忙于打点祭礼供物，径直把余布筐推到我跟前说：“上回你看过我是怎么裁的。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_5:event:checked","text"],null]']
src = "blake3:7dbfe7d6486786dd0f41b98abb57a3a4310b71fb2c90e02a7b7699375fae0375"
text = "社里新住进位往九州去的琵琶法师。他扶着廊柱坐下来，说路上撞见过那位连歌师，连歌师肩背的书袋正是本社所缝，还夸那袋子过了两条河水都不曾浸湿。他自己的谱本拿油纸裹着，边角早磨起了毛。他问能不能也替他缝上一只，得让他伸手一摸便认得出哪头是袋口。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_08_5:event:first","text"],null]']
src = "blake3:9d0b04fa5af7e51f36bd7a98bd690d747cc862daf564ba96a50c84d1aba7eeb6"
text = "连歌师的书袋破得只余下一圈边，摊在廊下，一旁晾着一页页湿纸，纸上字迹被水洇作片片淡墨。他讲起话来不疾不徐，每句话结尾都像在候人接茬。我还不曾替外人缝过东西，掀开门口余布筐的盖子瞅了一眼，又瞅了瞅他那几册书，一时不晓得该先取尺还是先拿剪。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_0:event:assisted","text"],null]']
src = "blake3:3dbffc348657261440e9ecf69505efce23305cb30349e934d1769fa983654680"
text = "老渔人扛来块木船板，说是十余年前从北面浦里冲上来的，板上仍钉着半截鸟居的木头，海潮把它送回岸了；可船板究竟漂了几年、循着哪条路回返，谁也道不明。上回岬寺的和尚替我绘的那张潮路，尚贴在墙上，早让海风吹卷了边。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_0:event:checked","text"],null]']
src = "blake3:724c96e375596d51ed09c24858e4357163401c6cbf346e6bd63af5f5a12f905a"
text = "另有个渔人听了老渔人的话直摆手，说他祖父当年瞥见的船一路往南漂，压根儿没朝东拐过。偏巧上回我顺着老渔人话绘的那条潮路，既朝东画了个弯，还曾由他改宽过一指。两个老头在渔网旁吵了起来，一个比划一个跺脚，齐声要我取出那张纸来评个理。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_0:event:first","text"],null]']
src = "blake3:b192c8194c80c7005544321949d3c296983ef8141adac35513524121095599cf"
text = "老渔人手上补着网，聊起补陀落舟时口吻平淡，像在说哪日起了东风。他说那班和尚是自己存心要去的，岸旁众人敲钟相送，没一个落泪。我问船终归漂往何处，他停住手里的梭子，朝南边海面望了良久，开口道：“你若真想知道，便把我讲的路记下来。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_1:event:assisted","text"],null]']
src = "blake3:225cc727df09cdba4ec71f650213ca58251389ae6a0cf9d303b9a0fef0bfb87c"
text = "这回海路上短的换作另一处，在鞆往西去，墨被蠹虫蛀去半个字，残余的一边既像“三”又像“王”。上回那行空处还是老船头念着让我依山貌画上去的，白崖、两棵松，至今仍在纸上。老船头说他也没走过这般远，再往西去的海路，总得问常跑博多的人。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_1:event:checked","text"],null]']
src = "blake3:d1906e5ecae1aca66683a5328a002afe23498e8dfb006e4a86e2ab23d025c981"
text = "船头说那年入秋依着我补写的岸名行船，夜间果真泊进了白崖底下——牛窗和鞆之间那行，便是我问过三个水手补全的。这回他又翻到另页，鞆往西有行字被虫蛀得只剩半字，里数犹在：五里。他把抄本推过来，一声未吭，只往那半个字上点了点。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_1:event:first","text"],null]']
src = "blake3:57cbcb52596a62780e172bee9deabc5b1a683f41e6ce6472c3df9ecc93697ea7"
text = "船头摊开的那本海路，纸虽粗糙，字迹却写得急促，一行一个津名，底下小字标着里数，有的还添了个歪歪扭扭的山样。他说这是他师父年少时边走边录下的，后头又叫人抄了数遍。我还是头一遭见这等物件，顺行往下细瞧，望到牛窗和鞆当中那行，墨迹洇作一团，单剩一个“津”字浮在纸面。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_2:event:assisted","text"],null]']
src = "blake3:2f47a3715329b970871fec906bac3931227862e1a3f41175e198236e725965bb"
text = "今年开春浜上刮了场大风，松林那块碑朝海面斜了几分，底座下的沙被吹走一层，新露出一截，上面竟还有行更小的字。上回是寺里和尚趁夕阳认的年号，我在旁记步数；可这几日他进山讲经去了，一时下不来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_2:event:checked","text"],null]']
src = "blake3:1316a8d6bbf948829e448d55a8f02c795b843709ed2779bdb227d6c30bbacfd0"
text = "今日再到松林，碑面不知叫谁涂了层泥，仿佛怕人再读似的。上回我泼水显出明应七年的年号，又量出浪及的那道线，收进了图里。新屋主人正站在门边瞧我，手里攥着把扫帚，既不出声，也不挪步。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_2:event:first","text"],null]']
src = "blake3:d9ccda0839694e00d928ecb9992446c6ca0615728230449546eda18867dc0d07"
text = "往常打松林经过，只当那是块大石头，孩子们还绕到它背后藏过猫猫。今日听老人们提起明应年的大浪，我才头一回蹲下细瞧：顶上那个字宛如一朵卷起的火苗，下面几行只余浅浅的刻沟，指尖摸得着，眼却看不真切。海风穿过松林，沙沙作响。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_3:event:assisted","text"],null]']
src = "blake3:a04c8d8213a63d2d00156eae58b723108494cde51b03b9a0d3eada60e1748685"
text = "这回人鱼的传言从南面起了，说月夜里有人见它坐在船帮上梳头。上回渔家老婆婆带我沿路问出来的那串点，我还收着，头一个点正落在北面礁石上。老婆婆这几日搭儿子的船去了对岸的浦，托孙子过来带话：“先去打听是谁头一个说‘梳头’的。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_3:event:checked","text"],null]']
src = "blake3:bee8bf851e8c341fa7f67ccbaa58971afbcef8e95a779170765d74ec33c4b467"
text = "卖鱼干的一见我便招手：“你上回画的那张纸，借我给客人瞧瞧。”镇上如今回传着，人鱼这事是“上回那个孩子查出来的”，说得煞有介事，连人鱼有几尺长都报得出来。其实我顺着五张嘴一路追到北边那块礁，那位阿叔也只说瞥见一团黑影罢了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_3:event:first","text"],null]']
src = "blake3:6d69642000415464910e7ebf89390c596f1436736641249bb35a93da501f0c41"
text = "人鱼的传闻，是我站在市集的鱼干摊前听来的。卖鱼干的讲得神采飞扬，旁边买鱼干的妇人捂着嘴，一时喊怕，一时又追问头发究竟多长。我问他可是亲眼所见，他忙摆手说哪能呢，是盐贩传给他的。那盐贩此刻就在三个摊子开外，正弯腰往筐里装盐。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_4:event:assisted","text"],null]']
src = "blake3:daddf91294740b15a806bc6babc1673e66abd09f8b7c1bf7441eb9f1924f2cd6"
text = "寺里二代和尚也曾渡海，那卷缘起上只留着“岁次乙卯”，年号几字被水浸没了。上回多亏住持翻出年号表，我才查到了永享四年。住持说记得比开山晚了数十年，可年号表上那几十年间，年号一连换了好几个。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_4:event:checked","text"],null]']
src = "blake3:9df0734e04ffb32ce9712857ef69582ea98872fa7f80531c52836fb1162527a2"
text = "从别寺借来的一卷缘起，记的同样是遣明船，写着“宝德三年辛未”，只是附的航路画错了，五岛竟画到了博多东面。讲堂里新挂的缘起旁，就贴着我上回推完干支后画的那条海路，从兵库直通宁波。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_4:event:first","text"],null]']
src = "blake3:08bb134d8492938e2062607c4eaf59745da0f5fa50f1eb297fa55b6ecd3f8263"
text = "经藏里漫着樟木和陈纸的气味。小沙弥踮起脚，自架顶取下两卷缘起，吹去积灰，在案上并排摊开。一样的字句，一样的船图，独独年份差了一数。他抬脸问我：“你说，是哪个先生抄错了？”我俯身凑近那两个字，一个“四”，一个“五”。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_5:event:assisted","text"],null]']
src = "blake3:15f6f39bd8bdf47d45d811c49b9419053ca594f338c1371e14cb888d1e41c2bc"
text = "寺后那株大杉今夏叫雷劈断了半截，打海上望去矮了一头，渔人们借它找的那片礁也就落了空。上回老船头摇船带我到礁上，画出那道斜线；这回他说自己目力已衰，望不清远处的树影，问我可否替他跑一趟。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_5:event:checked","text"],null]']
src = "blake3:6c6fe23814779080955de43675304a2e5744f4f90d0253148dd1fe85e4dab832"
text = "连隔壁浦的渔人也找过来了。上回我在钟楼柱上刻下的那道痕，近海渔人都传开了，按着下网，鲷鱼便能入网。他们要找的礁石偏在东边，原是拿寺里塔尖作准。只是他们指的那座塔尖，从海这边望过去，偏巧叫新钟楼的屋檐遮去了一半。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_daily_09_5:event:first","text"],null]']
src = "blake3:f9f721bb221d518e40b356b26d60feef539a68ab0cb85086cc77983b4eac6069"
text = "“海上没有路，可岸上的东西挪不动。”老船头讲，山峰、大树、寺里的钟楼，两两对成一线，船就钉死在海面一个点上，这就叫山当。他年轻时师父授给他，他又授给儿子，可儿子去年出海没回来。如今钟楼一移，他守了一辈子的那个点竟寻不见了。他望着我道：“你眼睛好，帮我看看。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_00:event:assisted","text"],null]']
src = "blake3:4b5bca79669df09da0e422f02c77b0330f91434294ef1d6b3c2ad4128b8f6a48"
text = "今年廊下摆的酒樽由三樽增到了五樽，纸也换成了更洁白的檀纸。老书役仍旧守在火盆旁，去年旧簿压在新簿底下，纸上还留着他拿指甲替我划掉错字的痕；只是今年他不念了，反问我打算先点哪宗。我望向那排樽口系着的红签，想起去年把两家的签贴颠倒的事，耳根先烫了起来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_00:event:checked","text"],null]']
src = "blake3:24b44cb5919ae6276642341369fb9fddd34e1cf875ecca1f0f9958dd5888e76b"
text = "“今年你来。”老书役把名簿与印盒一并摆到我跟前，自己裹紧棉袍坐去檐下晒太阳——去年那本名簿，他从头到尾翻检一遍，总共只改过我一个字。廊下的进物摆开两排，其中一篓炭的木牌叫雪水洇黑了，字迹残了一半，看去既像“浦”，又似“满”。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_00:event:first","text"],null]']
src = "blake3:bed9a8a790f2278dad213e5ececc1811edc98a3942e862fa7cef4a0f1f8b3fce"
text = "正月里的廊下打早起便堆得满满当当：成捆的干鲷、一束束昆布、两樽系着红签的酒、几刀杉原纸，外加一篓炭，篓口插着送礼人家的木牌。掌名簿的老书役头一遭唤我坐去他身侧，将簿子摊在膝头，说收了何物、何人所赠、当回何礼，皆须一笔笔记明，正月若差了一笔，旁人能记挂一整年。他把笔递给我，砚台里的墨尚没研开。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_01:event:assisted","text"],null]']
src = "blake3:95c5982756bdce9190a9aa2290284daab7952aea65c8116e5d6b4fa34a659f15"
text = "河滩的霜比去年更重，七草贴地生着，须得拿手指拨开才瞧得见。老婆婆腰弯得更深了，只走到堤上便不肯下来，把篮子挂到我臂弯里：“你去，采回来我看。”去年她蹲在身旁带我一棵棵认，那棵被她丢进河里的毒芹，我还记得根呈紫色。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_01:event:checked","text"],null]']
src = "blake3:8ac94fd92ec0bc7ce5018df9b1ca70b35ea9a1ecece3378262ae6167fd68706f"
text = "今年的七草是隔壁孩子们采来的，满满一篮倒在竹匾上，还沾着河滩的霜水。老婆婆坐在灶门前烧火，头都不抬，把竹匾往我这头一推——去年供上去的那碗粥，菜是我拣的，她一句也没挑剔。篮底混着几株陌生的草，叶缘带着锯齿，掐开有股刺鼻的气味。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_01:event:first","text"],null]']
src = "blake3:ba1cc65a84aa0930ff3b84fb8e4b28db3c7a4909477ce8ab3602c6c74cbf33c4"
text = "七草这日天还未亮，灶下的老婆婆便唤我到河滩去。残霜未化，石缝间钻出一丛丛嫩叶，她蹲下身逐株指认：这是芹，那是荠，毛茸茸那一团是御形。篮子须装齐七样，熬成粥先供奉上去，再分与众人吃。我拔起一株像芹的草，她一把夺过去，掐断根嗅了嗅，随手抛进了河里。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_02:event:assisted","text"],null]']
src = "blake3:1b4d7973180010d9bd85cb037e1bbe99d85757fe353b1934c2e0b41187650e93"
text = "今年送物过来的人家比去年多出几户，河滩上堆得几乎无处落脚。守火的老汉坐在火堆旁的石块上，手里攥着一串烤年糕的竹枝，拿朝柴堆一扬下巴：“哪层放什么，去年都跟你说过了。今年我只管吃年糕。”有个孩子捧着一捆字纸立在旁侧，不知该往哪儿放。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_02:event:checked","text"],null]']
src = "blake3:2f32f0397e20777f13caa5931bef6599dbd333245c1bc1e685b5b71f4390e8c6"
text = "守火的老汉逢人便夸，去年那堆火点着后，纸灰飘得高过松树梢，准是分柴的人码得周全。今年他干脆省事，把分拣的差事全丢给我，自己跑去替人串年糕。柴堆旁添了几把送来烧掉的旧扇，扇面绘着金银云纹，扇骨上还刻着人家的纹。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_02:event:first","text"],null]']
src = "blake3:41653d8c07bf7b5f95dd03931b62ea9b749d09891c4b6a01cb75a503e0dabc21"
text = "小正月这天，河滩上的柴堆已垒得一人多高。各家将门松、注连绳连同写坏的字纸一捆捆搬来，守火的老汉叫我帮手分拣：青竹垫底，干松枝居中，字纸铺在最顶上，燃起来才好往天上飞。他讲字纸飘得越高，写字的人今年字越长进。我抱起一捆字纸，里头竟夹着一件折得方方正正的东西。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_03:event:assisted","text"],null]']
src = "blake3:a18949203124dec4ff361bdf680551ae11c91a85073d7c87ecc85ea8e0e79810"
text = "社里的石阶落满了桃花瓣，脚下打滑，我拎着篮子一步一稳往上走。老祢宜坐在拜殿廊下，微眯着眼瞧我把物件逐样摆出，问道：“去年管事的教你洗麻、包米，可还记得几分？”篮中白木台子沾了道泥印，我方才竟未曾看见。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_03:event:checked","text"],null]']
src = "blake3:d79f468a3f8c10fc64bf255cb820fc56668124583b4b5a5df0bbddd7c6695b51"
text = "老祢宜一早就立在鸟居底下候着，身后跟着的小童抽高了半个头，手里捧着一枝桃花。去年我将祓具洗净送还时，老祢宜回赠的也是这么一枝桃花，说难得有人把麻丝捋得这般顺溜。这回我篮里多带了块土器碎片，是打河畔草丛里拾来的，边上还留着半枚朱红的指印。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_03:event:first","text"],null]']
src = "blake3:e400dad8122328962f243a0b95888150a84e90fe3e63c0c4fe6916acba400fb5"
text = "上巳这日，河畔的祓除做完，形代俱已顺水漂远，借来的家什却仍摊在岸边草席上：一对白木台子，几柄绕着麻丝的祓串，外加一摞余下的土器。这些是从社里暂借，须得当天送回。管事的交代说，要洗净晾透、数目对得上，还得包些米充作谢意。我拾起一柄祓串，湿漉漉的麻丝顿时缠在了手指上。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_04:event:assisted","text"],null]']
src = "blake3:cf883fe20256e99f20c4734d7404e2c4270f6a25503b60af3bc5245d25adfaf6"
text = "今年的菖蒲生得愈发肥壮，根部还带着泥。老汉在河对岸新包了片沼田，这边割罢还得撑船过去，扎不了几束就得动身。去年他领着我挨家去送，我抱着跟在后头，袖子叫叶边划破了好几道口子；今年他单把一张写满人家的纸条塞给我，字歪歪扭扭的，是他托人代写的。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_04:event:checked","text"],null]']
src = "blake3:7a1cb76217b245a9170833df2631c7afe3e85c0c6032c38ae9b4d1cfb5a777dc"
text = "老汉一迈进院门便把挑担卸下：“去年经你手分派的，没一户再上门讨第二趟。今年还归你。”言罢自顾自蹲去井沿磨镰刀了。院中添了几担邻村新送来的，叶片窄些，香气也淡。厨下的女人悄悄拽住我袖角，交代这两样切莫混在一处送。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_04:event:first","text"],null]']
src = "blake3:c696296cf66281e5987cc216b097894b9af54ae641c0e24d69b3877685fe2117"
text = "端午前一日，庄户老汉挑进两大担菖蒲，叶子比我还高，满院皆是清苦气味。他与厨下的女人坐在檐下扎束：五根菖蒲配两根艾，拿稻草绳捆牢。扎妥的须分送到各处挂在檐下，先送哪户、送几束，皆有讲究。老汉往我手里塞了一捆，叮嘱道：“留神叶边，割手。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_05:event:assisted","text"],null]']
src = "blake3:39276edfd482c1f74d62f03bb114af025e29431ffa8ca401f06f0ee69f59117e"
text = "老女房屋里添了两个新来的小童，一左一右挤在漆盒旁。她把两人推到我跟前：“去年我怎么拆你的纸包，你就怎么拆他们的。”说完摇着扇子歇去了。今岁漆盒里的点心换了花样，多出一种染作粉红的饼，小童们问那是什么做的，我也答不上来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_05:event:checked","text"],null]']
src = "blake3:4abdb35e8e615cfef3390a8cda273b567135bcd247e9666274d3d0041c34d9a2"
text = "守门的老人一照面便冲我笑，说去年那份嘉祥点心盖着碟子给他留到半夜，糖皮竟也没化。今年点心铺换了个新伙计，挑来的盒子比去年少一格，问起来他支支吾吾，只说掌柜吩咐的就是这数。老女房看看盒子又看看我，把一整叠怀纸递了过来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_05:event:first","text"],null]']
src = "blake3:d8bb7d256f45e1e78f177d44cd1567a44b41cfc6c52a02d22b8e37a37fd3efe7"
text = "嘉祥这天一早，点心铺的伙计挑来两只漆盒，盒里一格格码齐了小点心：馒头、羊羹、炒豆、米果。管事的老女房说规矩是每人十六个，用怀纸包好，一个不多、一个不少。盒子既按人头订下，当值的人不在也得留出一份。天热得紧，点心的糖皮已经发软，她忙催我赶紧数。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_06:event:assisted","text"],null]']
src = "blake3:7cfb3619da30da08ca44267bd4f5fe8c7acc83f90be49f619e190dc76a22ec03"
text = "五色纸备得比去年整多出一倍，说是今年来写歌的人多，连隔壁的小孩子都要一张。老先生把竹尺和小刀摆在案上，这回没再握我的手腕，径自坐到窗边研墨，研一会儿便抬头看我一眼。他砚台底下压着的，仍是我去年裁坏的那几张纸，背面早已写满了他练的字。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_06:event:checked","text"],null]']
src = "blake3:e5b6c63567527566e3aab5e3fb6dd72875efce78ce541518df47864eaf245c0f"
text = "老先生今年要去邻寺讲书，乞巧奠那夜才赶得回来。临走他把纸、刀、尺连同一张开列着宾客名字的单子一并交给我，说去年那几摞笺边齐得像刀切的豆腐，今年照样就行。单子上新添了几个名字，其中一人名旁画了个小圈，注着那人只要白纸。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_06:event:first","text"],null]']
src = "blake3:0cc5ac1815c1d4307d92db0a2843ff6ae2faeb2eb632a5d1e3e946afb8316ff8"
text = "七夕前三天，教书法的老先生把一叠五色纸搬到我屋里：青、赤、黄、白、黑，每色二十张。乞巧奠那夜要写歌供在星前，纸得先裁好，梶叶亦要提前采来洗净。他取出一把小刀和一根竹尺，说裁纸要顺着纸纹，逆着裁边会起毛。我比着竹尺下了第一刀，纸边弯成了一条小蛇。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_07:event:assisted","text"],null]']
src = "blake3:95b20ebe137f81c49a005e6b072c05e0b5ab018e38d9c758268063fac022062e"
text = "今年的包袱愈发沉了，头人说去年看踊的人全要入组，衣裳不够穿，连旧帐子都拆了改衣。老板娘铺里接了寺中一批法衣，白天只能抽空过来。她把十余枚穿好线的针一排插在笸箩边，指着最顶上那件道：“去年你缝歪的那道袖口，跳踊那夜可是让人一眼瞧出来了。”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_07:event:checked","text"],null]']
src = "blake3:27dea34a9b92d4eb73c496d9d5de3eafbf094758ca78805b07ed2b43367272ba"
text = "头人一进门就把包袱搁在我屋里，说去年跳到寺门口那夜，补过的衣裳没有一件绽线，今年还托给我。老板娘只隔着窗喊了一声：“针脚藏进布纹里。”包袱最底下压着一件小小的帷子，袖子短得勉强及肘，不知是哪家孩子今年头一回上场。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_07:event:first","text"],null]']
src = "blake3:3b3b9f626446c251f0192a8bf62cdfc7e1238c01351b9f157f19acdf6118ac37"
text = "盂兰盆前数日，町里踊组的头人抱进一大包衣裳：尽是去年跳风流踊穿过的帷子、头巾与花笠，有的撕裂了袖口，有的花笠上的纸花掉了一半。针线铺的老板娘坐在门首，将针线笸箩往我跟前一推，说须赶在十五前尽数补妥，还要照着衣领家纹送还各家。我抖开其中一件帷子，霉味夹杂着去年的旧汗味登时扑了出来。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_08:event:assisted","text"],null]']
src = "blake3:d221f35de20ddef6cc503fe6fb58ed643f5ca700d2a2c42aa055e19306ef1436"
text = "今年送礼的人家里多了几户新面孔，门房打听后说是今年才搬来町里的。右笔先生正赶着替主家誊一卷书状，笔一刻停不得，便不像去年那样立在我背后一字一字念，只隔着案子口授。他说新来的人家，回单头一句要写得格外周到，人家第一年登门，看的就是这一张纸。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_08:event:checked","text"],null]']
src = "blake3:d134e90e11f9df89304dcc6ebcc5867af8e21bfc8ba0f56c4a2d36ef16c7914d"
text = "町里有家铺子，竟把我去年写的回单裱了起来，挂在柜台后头给客人看。右笔先生听说后，今年连印盒也交给了我，自己去后头清点礼物。门口有个送礼的小厮等得不耐烦，说他主家要的是两张：一张交回主家，一张留底。这个规矩，先生从没跟我提过。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_08:event:first","text"],null]']
src = "blake3:a76c9e6909be30d316005580fe4f6ddd8a45e310f2bd9497be977c9c855ae63d"
text = "八朔这天，送礼的人一拨拨上门：一把扇子，几帖好纸，一束新熟的稻穗，还有一家送来一尾在篓里扑腾的鲈鱼。来人放下礼，都在门口候着领一张回单带回去交差。右笔先生把砚台推到我面前，说回单要写明收到何物、哪一天收的，末尾谢一句，字不可潦草，也不能写得太过客气。我刚提起笔，篓里那尾鲈鱼猛地又扑腾了一下。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_09:event:assisted","text"],null]']
src = "blake3:d47aeba0d2e4234afa512ddf044f6b740503137d493f4f51497f6b867d026edc"
text = "东边那棵松今年多长出一根横枝，恰巧横在月亮要过的地方。老仆搬来梯子想锯，又舍不得，扶着梯子立在树下发愁。去年是他领着我在院子里来回踱步，寻出月亮刚过松梢的那一处；今年他把剪芒草的剪子递给我，说位置你再挑一回罢，我老了，眼睛跟不上月亮了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_09:event:checked","text"],null]']
src = "blake3:d15dc97057516885ad2940c059506d0ed429205e99fc0c5b0ed60038b8b5423a"
text = "院里新铺了片白砂，主人道是月光映上去好看。老仆把扫帚往墙边一靠，说去年月亮恰悬在松梢，客人们夸赞了一宿，今岁场地还是全听我拿主意，他只管去煮芋头。我坐到廊下试看一番，月光打白砂上反上来，映得坐在那儿的人面色发白。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_09:event:first","text"],null]']
src = "blake3:3d3c2292e3cfaa614a6507c29d716d16840e1ee678654929f679495493e81f9d"
text = "十五夜前一天，扫庭的老仆领着我在院子里走来走去，说月亮打东边那棵松后头出来，要挑一处它刚过松梢就看得见的地方摆几案。芋头要煮熟装盘，芒草要剪得一般高，坐垫怎么摆、谁坐上首，样样都得事先排妥。他在廊下木板上用指头划了几道，回头问我：“你说摆这儿，还是摆那儿？”"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_10:event:assisted","text"],null]']
src = "blake3:e72a934849171ba846556e03b44ffe6de321be140496882b4cbe4d24b8ba629c"
text = "老僧推来的菊枝里添了种细瓣菊，花型散开如同理乱的丝线，据说是与别寺换来的新株，统共只抽了三枝。记得去年他还逐枝点拨我配瓶，敷丝绵时也扶着我的手，唯恐捏坏花心；今年他单把这三枝另搁在一旁，只叫我自己琢磨安顿何处。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_10:event:checked","text"],null]']
src = "blake3:62cf42df87bf7a7db5b699ecd8cf7fa1be9f99097d5e9c169edeee531a94c772"
text = "今岁菊枝少了些，车上倒多出个小布裹，里头是老僧特地给我留的丝绵，染成浅黄与淡紫两色。他道是去年我掩过的那几朵，次日清晨吸足了寒露，大人们拿去揩脸都赞香；今年理枝分花他全撒了手，自个儿坐在廊檐下的石阶上吃茶去了。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_10:event:first","text"],null]']
src = "blake3:461294a18af475fe2774a6362161d3a39d6b8f4b65f900ade2742b9601ec7885"
text = "重阳前一日，寺里莳菊的老僧拉来一车花枝，黄白紫三色交杂，叶间犹带露水。插瓶的、敬献前头的、备着敷绵的，须一一拣开。老僧叮嘱今宵要把丝绵罩在花朵上，明晨揭了来拭面，绵色定要与花色岔开。他撩起盖车的草帘子，问我打哪一枝挑起。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_11:event:assisted","text"],null]']
src = "blake3:83d12a29b3ae2f0cfa5e2ae8310b33396c9af84558e2c9e924afe81615de8e58"
text = "筐中栗果比去岁饱满，只是好些毛豆荚叫连日阴雨沤软了。去年贴身手教我摆盘的老女房，今番只在廊柱旁剥着栗壳，每剥出仁便往我手里送一颗，道是今年由我先动手，她单瞧着便罢。敬月那盘安在东首，这规矩我未曾忘，偏偏座次改了——今年多来两位宾客，折敷短了数，还得往库房再取。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_11:event:checked","text"],null]']
src = "blake3:2ef1ed9b9a3e91aeedbd2c22f8881cd0b2448f3b15c466b4ec4804cb6f5488e5"
text = "掌膳的记着去年折敷乃是我独力排妥的，今岁便径直把座次单交到我手上。单上涂去一人名姓，又添了两个新客，墨迹犹带湿意。山里庄户刚纳来的栗子颗颗油亮，偏是毛豆短了一整筐，听说在道上淋了雨霉烂了。按十三数一盘配齐，怎么算都凑不够数。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_11:event:first","text"],null]']
src = "blake3:312f1759d48e620e7c5adf4b6a6921c13720441189dffe0acbb578d3ebd54b43"
text = "前月十五夜里，我尚只闲坐廊下赏月；今逢十三夜，却被唤到膳房后院，面前堆着一筐带土的栗果与一大捆毛豆。盆里洗栗的水寒得指节发红。一旁帮手的人念叨，既祭了十五夜，这十三夜万不可缺，若只拜单回月，老辈人是要撇嘴摇头的，因而今夜一盘也少不得。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_12:event:assisted","text"],null]']
src = "blake3:8e7fc24741ef34eaa770e34ab7dbe74d038d8e40f75abe900c817ca5a18b1022"
text = "朔风吹了一宿，拜殿前铺满松针，石缝间结了层薄冰，扫帚稍一触碰便咔嚓作响地裂碎。祢宜留在殿内一升一升地量着待撒的炒豆，实在脱不开身，无法如去年般扶腕指点，唯隔着格子门往外张望，冲我高声叮嘱：碎冰碴子也须清干净，免得豆子磕在冰面上蹦到外头去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_12:event:checked","text"],null]']
src = "blake3:963a6b6ae73c1d9b27f99ffbeaa17700817c5025f99f7a8616a17d077e886b4b"
text = "这回祢宜发扫帚时不复问我打哪头下手，径直把两个年幼些的孩童拨归我管，说是去岁整座庭院由我一人清净的，今年便由我领着他俩做。偏一个挥得飞快，尘灰漫天扬起；另一个则蹲在石缝前抠弄枯叶，半晌挪不动寸步。眼看离撒豆仅剩半日工夫，鸟居外头还积着前日未融的残雪。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_12:event:first","text"],null]']
src = "blake3:be92d359754539e808681891886202b28a83bbdafaf89bcf1186c1f5561307fa"
text = "节分天色未明，寒霜冻得神社石板一片惨白，递到我手上的竹扫帚竟比人还高出半截。搭手的尽是近邻子弟，里头还有人攥着隔年剩的炒豆，背着人偷往嘴里塞。老祢宜挨个分完扫帚，轮到我时问道：晓得打哪一边扫起么？我摇了摇头。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_13:event:assisted","text"],null]']
src = "blake3:e900b31436feba58fdaada86d756e4bdb1b32d9195a4dc406f72cf7785283069"
text = "旧年领我逐屋递饼的老侍女，今岁玄猪未到便卧了风寒，病在下房里起不了身，只央人带口信嘱咐：名录贴在柱上，切莫送岔了。膳房较去年多制了一盘饼，说是这回值守的人手添了；偏偏柱上那张名录经炉烟熏炙得泛黄，内里有好几个名姓已模糊难辨。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_13:event:checked","text"],null]']
src = "blake3:bacd82a2dcc5363b27f27ecf20b7c545429a7c8e23fea0fa849301bb19561426"
text = "檐外正落着入冬初阵寒雨，长廊湿滑不堪，漆盘端在掌间直往外溜。去岁我重排过的分送顺序竟毫厘未差，今年掌膳的索性将名录独交与我保管。谁料名录上新添了名刚入府的侍从，上下却无人说得准他究竟该序在谁先。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_13:event:first","text"],null]']
src = "blake3:17cdd5b05207fe1be65a4031b7f9b230949ce4d33468fa9429a75bea5364f942"
text = "十月亥日向晚，我立在膳房门首，瞧着女房们将三色米饼团得大小一般无二，十指裹着一层厚厚的豆粉，白得如同裹了面套。忽然有人挥手唤我入内，硬往怀里塞进一只漆盘：“今夜差使紧缺，你也帮着去递。”盘上饼团尚冒热气，接过手我才发觉，自个儿压根不晓得头一步该往哪间屋去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_14:event:assisted","text"],null]']
src = "blake3:4dda07db5ce586aa89f3caa8413290b41e9225349b0bde119b944bed35ac6cec"
text = "本月老先生往别处赴会去了，临行只在几案留下一纸：上书两道歌题，下头描了枚小巧结样，侧旁小字注明“长辈”——正是前月他贴身手把手教我的折法。纸角压着段缀叶的枝条。我屈指点算今番赴约的户数，较上月平添了两家。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_14:event:checked","text"],null]']
src = "blake3:9c9409a231524764fb5dd4d02891c4afbb8571a7b90ba28967d20913c143052f"
text = "歌会的题纸这番又落进我手头。前月我独揽抄录与分送，居然无一错字，今月老先生便连拟题的重担也分派半副过来——两题之中，他择一道，余下一道由我拟定。我枯对着一张素纸呆坐半个时辰，砚池里的墨汁几近干涸。门外早有人过来催问，题笺何时能递过去。"

[entries.'["upbringing/pools/japanese.toml",["variants","c9_pool_japanese_festival_14:event:first","text"],null]']
src = "blake3:d126ecc29bea157864e507815f668fe88a6349f5580829a42a41cf4cfaac3d8f"
text = "唤我去替歌会抄题那日，书桌上摊了一叠裁就的窄笺，比掌心尚且狭小，侧旁置着一碟新研的墨汁。拟题的老先生口头报出题面，我一时走神，没听真切究竟是“旅宿梦”还是“旅宿暮”，偏又怯着不敢再问，执笔呆僵在原处。他望了我一眼，索性把原稿挪到我面前。"
