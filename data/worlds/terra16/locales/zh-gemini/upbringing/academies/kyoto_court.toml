[entries.'["upbringing/academies/kyoto_court.toml",["academy_clubs","kyoto_court:0","synopsis"],null]']
src = "blake3:21e37a011652a67932fc5f920fddec068ced8b0545d1d87473b53184165bc179"
text = "因“雨后的梅香”这半句歌，两位社友争了足有三天，各自说是自己最先想出来的。收尾时，两份草稿并排誊入社簿，两个名字当中隔了一指宽的空处。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_clubs","kyoto_court:1","synopsis"],null]']
src = "blake3:b307c6d2139bdec572df0858c937203cefcbe518955d9dbabb1de8f25dce715c"
text = "社中立过规矩：东西弄损了，不许藏掖，须带过来大伙儿一齐修补。汐崩断了筝弦，打上个死结犹嫌松；菖熏焦了一块香饼，袖口捋理了三回才肯取出来；小督那只画糊了的贝，教冷泉雪暗中描回了旧样。补完之后，各人抽取一片拆开的贝，另一半落到谁手里，谁就是搭档，一并去赛贝覆。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_clubs","kyoto_court:2","synopsis"],null]']
src = "blake3:05475b82a9732db385c6a5393c30f041d3fd4124024d790bfb2c8abe2f7084a7"
text = "小歌会原不设领唱，每次总由最静默的那人来选曲。轮到鞠千代，他拣了最短小的一首，轻细得须凑过去才听得见；等他唱罢，大伙儿依旧点头称好。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_handbook","kyoto_court:0","text"],null]']
src = "blake3:6951dcdd5c9615cfa38c521d7b608f109406e088f36ce83b38a0acdd04efbd47"
text = "公家女儿十三四岁便托进宫中，随女房学着礼法跟和歌，也学如何在长廊上不作声响地行步。宝镜寺是历代皇女出家的尼寺，见习的女孩常上那儿抄经、闻香——抄经得蘸淡墨，腕子须得悬起来，抄不够半页就发酸了。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_handbook","kyoto_court:1","text"],null]']
src = "blake3:646640228aded23a65d1c2df96a2e0e28782d67358491e7241ab5fb738b42add"
text = "家里央托了宫里的一位故人，方才替你把见习的名字挂上。名头虽挂上了，门第的高低、袖色的深浅，宫里头依旧辨得一清二楚。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_handbook","kyoto_court:2","text"],null]']
src = "blake3:473be16f6c2feb8d102f7540d18b3eafc3f24f8bf6f5af21c207e6511567076f"
text = "迟到的人莫急着踏进门，先在门槛外头跪着研一砚墨，待上臈点头应允，方许进去落座。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_handbook","kyoto_court:3","text"],null]']
src = "blake3:3c62fbd4dd336d93be8cd8c947453342411f10224dff62e6a63e819692b7a74e"
text = "女房只动袖口与口舌。真动起手脚的两人得隔着屏风坐下，各自作十首赔罪的歌，把弄坏的物件自行修妥，十天之内不准进社。"

[entries.'["upbringing/academies/kyoto_court.toml",["academy_handbook","kyoto_court:4","text"],null]']
src = "blake3:fbc5fbf32b16a3e7aebc2752b8b89c6aca25b653930e4a32a71a5c621ca55f76"
text = "夜间没回小局，翌日上臈便会问起：“昨夜歇在谁家的屋檐下？”纵是照实回禀，照旧得关十天不许出门。唯有求医、避兵火而在外留宿的，方不问罚。"

[entries.'["upbringing/academies/kyoto_court.toml",["activities","kyoto_court_course_self_study","description"],null]']
src = "blake3:f6a987701a5f3ee1aeb0105e98b698739f20f3616800bf24faf834e8a88800db"
text = "上臈不在身边，无人替你圈出写斜的字迹；趁着小局的灯火，自己将白日里的假名重临一回，又翻上几页才读到一半的《源氏》。"

[entries.'["upbringing/academies/kyoto_court.toml",["notes","note_1ddb309974cd0ef2","text"],null]']
src = "blake3:e063ac4003b49fc8e374403cf294ef310e5e5410fae84d8541d0eb2917f5e394"
text = "临到末了一日，小庭里落了层薄霜。众人约好来日再见，可没人道明是哪一年。有人将折作细条的和歌塞入他人袖口，被塞的那人只装作没有察觉，那只胳膊却一整天都没敢摆动。"

[entries.'["upbringing/academies/kyoto_court.toml",["notes","note_f680a6deb6790571","text"],null]']
src = "blake3:7109ab91ee88b801afb067abd1497c0f83033aa032c3ac899a92fa48f9e4335f"
text = "课期顺着宫中的年中行事走：开春方才正式开课，盂兰盆前后各自返家，秋末还要考校一回。1554年初入京的见习，先寄居在亲戚家里补课。城中一旦发生兵乱，抑或家里出了事端，课期说改也就改了。"
