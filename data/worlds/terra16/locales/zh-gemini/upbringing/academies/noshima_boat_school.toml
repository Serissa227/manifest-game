[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_clubs","noshima_boat_school:0","synopsis"],null]']
src = "blake3:95f55ff26b505dae46e00a157ce5c522df5b3d986f9c92f85104d73f2396965c"
text = "鹰丸拿朱笔将自己认错的那道潮线记在潮图上，一旁题了首歌，好给后头的见习者提个醒。社里每月就是拿这类歌比个高下。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_clubs","noshima_boat_school:1","synopsis"],null]']
src = "blake3:ee94b37c6803fcd46b819baf9f7246949c84ecddede5d04b5e1e20a94f6af9fd"
text = "退了潮下滩拾贝，回来两两凑成一对，配不齐的当即认输。鹰丸将每回胜负都刻在船板上，谁输给他，名字下面便添一道。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_clubs","noshima_boat_school:2","synopsis"],null]']
src = "blake3:52b2ee13ebc28f8f0fd145fdb623c8e9acb922c2572e5a165e1e8ce54261598e"
text = "逢上集日，几个人一路唱着舟歌，沿滩走过一排停泊的小船。有条船上的行商在卖香木，他们讨来一包，闭上眼细闻，猜是沉香还是白檀。猜不准的那位，下一首舟歌归他起调。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_handbook","noshima_boat_school:0","text"],null]']
src = "blake3:6305090fab7e094b61a65b444e704c7d2c49b2d4304b6d3efa3eb61659ec0b51"
text = "能岛坐落在伊予和安艺相夹的急流海峡里，村上家的船坞招收船家子弟做见习。从京都过来，得先赶到堺搭船，沿内海一路往西走上好几天。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_handbook","noshima_boat_school:1","text"],null]']
src = "blake3:ce6b4ed8730a8ba7a7bc8c7c3e6720b3e94e6bddf21f27ccb362cf2e96489bad"
text = "非船家出身的孩子，家里只要托人向村上家引荐，照样能够随船见习。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_handbook","noshima_boat_school:2","text"],null]']
src = "blake3:ebfd4cb5bfeec743c3cc81958b6354dae38e692f1c978506435e5ad2e455b2d4"
text = "来迟了的先给全班解一遍缆绳，解完了方许进棚听讲。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_handbook","noshima_boat_school:3","text"],null]']
src = "blake3:6157c51bc25b33df3918c1d0dd18b0b933c8a177b9f596bb86257a7295d2849a"
text = "船上不准动拳脚。打架的两人合划一艘小早出去一整天，十天内不准入社。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["academy_handbook","noshima_boat_school:4","text"],null]']
src = "blake3:befe31768612519981d5620a328440b0773acf1812f35a0865e0d09bde006f11"
text = "夜里不回通铺的，次日得向水手头说清去向，十日不许离岛。若是替人去请医师，或遇上风浪避险，则不罚。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["activities","noshima_boat_school_course_self_study","description"],null]']
src = "blake3:76045b7d3b300f075b961dac619353f8de93efd7cb584632e9efe8844e91f224"
text = "没水手头在一旁催喝，自己去木柜里抽出潮表，坐上岬头的了望岩，对着海峡逐处辨岛、数礁、看潮头往哪方翻。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["notes","note_272238e759988f39","text"],null]']
src = "blake3:3e60b833306046f8afd4dcb572b657106785134525a48b0169082c0fa7fceaeb"
text = "开春出船前开课，七夕一过便是盂兰盆，见习者趁这阵空当放长假，八朔当天归岛；入秋则考核一整年的功课。赶上大风浪，或家里有事，课就顺延。"

[entries.'["upbringing/academies/noshima_boat_school.toml",["notes","note_ef7fac7f45dd6c4b","text"],null]']
src = "blake3:2ac7c35e4ec0910c505092181ff9517136fb1aa3ec411e25c9c9df5ced76fb29"
text = "一院子都晾着网，天黑前还得收下来，大伙便在网底下约好往后再见。鹰丸朝你抛来一块刻满道道的木片：“这片你收好。账还没完，下回换我划赢你。”话刚说完便扭头收网去了，耳朵红红的。"
