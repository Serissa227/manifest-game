# 第二套中文 zh-CN-x-gemini；由 locale-import 生成，请勿手改。
generator = "gemini-4-hydrogen"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_accounts","desc"],null]']
src = "blake3:591a295c11319a55e116325e7fb2220948c532794e6ff3d3c93d0ff916dfee13"
text = "傍着母亲核这一季的粮账，几升几合都得对得齐整。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_boat","desc"],null]']
src = "blake3:2cb0390252dbf45aabad2b646fddfc1187b44c718f4397847f9cf729f6c59635"
text = "趁落潮把自家小舟拽上滩涂，刮净蛎壳再填好船缝，满身泥汗。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_court","desc"],null]']
src = "blake3:fd7e75aad16d1acdfac00894436425860982370755c8694da9590671e96dc4f6"
text = "在广桥家的局中端茶递文书，敬语但凡错个字就得重说。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_diary","desc"],null]']
src = "blake3:664a23a6e86aac35e2d9fa980d1bee8fe5fb7969d2c3bec2bf70fd304692f748"
text = "代当值女房誊录御汤殿上的日记，进献和来客一样都不落。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_errand","desc"],null]']
src = "blake3:09dd809a9d51ff0b4d102c6998ce91c1f1f3fc3fafe1e0738e27dcb9ac56b5dc"
text = "替局中去室町通买纸买线香，跑这一趟能领几文赏。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_flag_toll","desc"],null]']
src = "blake3:454cceda2fb7b2d546137aed1e3eacf405bad0d81f4fb96a632d907ff6dcd5db"
text = "随阿濑守在栈桥上替过路船只数帆、记船名，分几文脚钱。"

[entries.'["upbringing/act/mio.toml",["act_duties","mio_duty_nets","desc"],null]']
src = "blake3:fa113b2ce39282ace0793d93986b61765b89bad9fcf5d928e7392c3de79aedaf"
text = "把渔网摊在晒网院里补好破洞，番所按张付给几文。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ase::0","text"],0]']
src = "blake3:a5dbc4b7dbb9a72201011183094d4b38f77816aac1b817afe4098563b799665c"
text = "姬君，离落潮还得半个时辰呢，今儿莫往沙洲那头走。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ase::1","text"],1]']
src = "blake3:0148be9382b6f694e9c522e27eb940cfa779e30ea5175f28a2a5017e505bbef7"
text = "又光着脚？当年汐也这副模样，脚底叫蛎壳拉了一道口。草鞋就在网棚里。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ase::2","text"],2]']
src = "blake3:0ebb78556b639ec13dfc12ff1c72b28cc5fa62a8e1659e0ae4ace6cb3d4a51b1"
text = "嗯，篮里备着饭团，取两个去，分汐一个，别站着吃。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ase::3","text"],3]']
src = "blake3:1dd103daedc959cf185ec3fa2c4de4df5d509e1b075576e4a7c483b61c2f3573"
text = "午后刮南风，船都得早回港。姬君若想上船，一过未时就别去了。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ase::4","text"],4]']
src = "blake3:3ada46325392b178e5b7b2eaf265f6ea9f574212da31746c3af435609cf4ce18"
text = "当年宿毛的船正是这种天出的海……罢了，把手伸来，替我绕一绕这团线。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ayame::0","text"],0]']
src = "blake3:dfe795ec6cf947dd699b5984cbdc6564507cf2754e55c916b7ba6c39318bf3b5"
text = "乡下来的姬君，您这袖口叠反了。应先折左边，再折右边。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ayame::1","text"],1]']
src = "blake3:e96558062e00424a543dcf5f56176c0ae9566e707fecfd09ba041b9111982239"
text = "失礼了。您这行礼时腰弯深了半寸，那是敬上臈的礼数，并非给我的。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ayame::2","text"],2]']
src = "blake3:67ead13eea77bac656061c36015059eba8a0e0589b0c2c181e6b453c0eb36435"
text = "您走路步声太重。在廊下听不到足音，方才合规矩。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ayame::3","text"],3]']
src = "blake3:d262fb1e0d7e0a1f5a5bfbea8170f7a15fe393a37d9b7da0e03ec557ac3c3ba3"
text = "怀纸露出个角来。……拢好了，手搁回膝上，不许再碰。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:c8_noshima_bosun::0","text"],0]']
src = "blake3:60ecd6dbefa37a087f89a7cb3275b0322d9cf6f3320795c3b11e98fce3c00b2a"
text = "来了，小鬼。听，潮头还没转呢，再熬一炷香。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:c8_noshima_bosun::1","text"],1]']
src = "blake3:c8904f05ee2569ffc0d46c6457cf7bc61f252f2005fdfc4eabfb3b36e56e7fc0"
text = "脚下站稳。从船上栽进水里的，我可只捞一次。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:c8_noshima_bosun::2","text"],2]']
src = "blake3:bb122d4dd7e95f069683ede88fafe2830bf6508c24065f32c3ac9cde1f8bea09"
text = "手上的泡磨破了？破了才好，往后就不起了。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:c8_noshima_bosun::3","text"],3]']
src = "blake3:6d8e9cb6971e11f49f01b7660c53ca48174603f7714c9121bfc07d250a8f2a8c"
text = "少作声。……听见没，水声变调了。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:chidori::0","text"],0]']
src = "blake3:5f1206502063af6d78ff669900b17e7b8beaa242845a71ce5fde97c3629fe5ac"
text = "公家的！今天潜到六寻，再多一寻，摸到一只鲍，没捡。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:chidori::1","text"],1]']
src = "blake3:26def7280cce7b34a77b4d6aae13d3fca5c3032b0bd28f117093ab1392d7ca67"
text = "你身上尽是墨味儿。你写字那地方，看得到海吗？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:chidori::2","text"],2]']
src = "blake3:2b37a603b326d963f58ac5d54478b71f89688a7fcf39e749e9bc90b593828ca5"
text = "公家的，你脚旁那石头下藏着只章鱼呢。……逗你玩的。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:chidori::3","text"],3]']
src = "blake3:d8878379dbb9463f2ca0ec05c89bf34ae49c49fd792558711b29fac3b6297a67"
text = "婆婆不许我数几寻。你会数？那数给我听，到六就打住。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_kuniko::0","text"],0]']
src = "blake3:bc1fb6ff9eb5701b5f63af172b46a69efe88e0e95b288f3186fb43e23c40fd93"
text = "一条家的，字可带来了？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_kuniko::1","text"],1]']
src = "blake3:48e6b58bc30a9ba46fbff0cb1a2f9a4cebda00e1f3105a895b3dde1c4920c3b5"
text = "先论字，再论人。今天只看字。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_kuniko::2","text"],2]']
src = "blake3:eb2339b62373c98989676b6b4c2603eab087efb0e10a19df4726de87f795a38b"
text = "退到那头去，上臈要打这儿过。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_kuniko::3","text"],3]']
src = "blake3:c8dbfe88aa410b02bdd880b61538a44cc1372d1bc87eed4c09f112aa0a9a8dad"
text = "嗯，今日这墨研得倒是匀净。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_yasuko::0","text"],0]']
src = "blake3:8ffb95293b2c6896b8ab9566e73b2da3487d9723d77342ac1ecfb6d9da9f007d"
text = "姬君过来啦。外边风寒，快暖暖手，宫中之事不打紧，一件件慢慢办。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_yasuko::1","text"],1]']
src = "blake3:68b5fedbe3f71633b455fa8d8290d2387516e2747adeeb61e04fd3b6e92173fd"
text = "国子那头我已嘱托过，姬君尽管安心写字，旁的容后再议。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_yasuko::2","text"],2]']
src = "blake3:3e840fabf4d45f35e07446a845d0927b0464d1f899c698412a38fb1f051cbdb9"
text = "炭火还足么？我着人再送一筐来，可不能冻坏姬君执笔的手。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:hirohashi_yasuko::3","text"],3]']
src = "blake3:55c4df7a7ef7e2b9e1266103f6a3472dd36e64f7b5530817be86c87df4c4f91e"
text = "淀川近来水势大，土佐的信怕是要迟上几日，姬君莫苦等，改日——"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ichijo_kanesada::0","text"],0]']
src = "blake3:321f90ed2bd409c539779373d4f68c3f945f944dcb1edd80a5ce986b033de749"
text = "姊上。头一桩，母亲唤你。第二桩，我今儿临了三张帖。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ichijo_kanesada::1","text"],1]']
src = "blake3:36f1d46c3a408e4ba44f5c06dd5d3ee8e0660b3ab7ef5369e34eeb7619b66f14"
text = "姊上，海的那头是什么地方？……再往那头呢？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ichijo_kanesada::2","text"],2]']
src = "blake3:e26b6b38abfbf428753877073e9ba472c8e47cfe7734db76fea3d5344b261d93"
text = "是。弥平次催我回去读书了。姊上这是往哪儿去？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ichijo_kanesada::3","text"],3]']
src = "blake3:3e5dabd15d19def434e503b5584575338a78cf6a586d739b8514a5613f712cf2"
text = "姊上，头一桩，今日风大得很。第二桩……容我想妥了再讲。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kikuchiyo::0","text"],0]']
src = "blake3:c3095b5777cbbceb80a460b3ab35560535f61b9a2f83eef1850bee8aa8786127"
text = "一、一条大人。今儿的鞠……掉下三次，全、全怨风太大。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kikuchiyo::1","text"],1]']
src = "blake3:aa7a455aba91a6cf5aa1979025e0aa8bc4a1b3e6dced99f25bb89406664674fa"
text = "你、你把那个字写差了，是‘鞠’不是‘菊’。……我又脱口说出来了。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kikuchiyo::2","text"],2]']
src = "blake3:8f16d8ca735ad85ce6f85eec11eccd4d9c344f0789be0a12ae73789af4229dea"
text = "鞠场四角种着樱、柳、枫、松四棵树，鞠自樱枝落下顶好看，从松上——"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kikuchiyo::3","text"],3]']
src = "blake3:c10cf6d8eada27d913719d25325994bda6c4af7c879f89cfef369d4026a55422"
text = "莫、莫站那头，鞠会飞过去的。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kogo::0","text"],0]']
src = "blake3:7576c4dabea68dcbb3028cf3d99797531295e7ab3bb762be4bfc822ba96c73c5"
text = "学生，瞧字一眼一升，讲话不收钱，您请说吧。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kogo::1","text"],1]']
src = "blake3:b54187999003253160bb875620f5f787b1ba49ebf3e850207d63cd45b916a397"
text = "米价又高了。我娘说若再涨，我的字就得论斗来卖。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kogo::2","text"],2]']
src = "blake3:dd7d8d7929793499dcf7666110d7a67c3408bad4daae1c628fc57fcff6b9c068"
text = "一升一首，改稿另算钱。学生中意哪样？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:kogo::3","text"],3]']
src = "blake3:d899cdd4f2db5ed6ac46b7fbd6f7a8fa82ecc2b71d86b4e29e566b145de2dee8"
text = "今日我心气顺，不收钱。瞧一眼白瞧，瞧第二眼照常收。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:mio_mother::0","text"],0]']
src = "blake3:cf35cfaa573a3266a9779a66b49ca1f47bdb0e212ffba17ce4b7617c61b97b03"
text = "回来啦？先把这一页念来听听。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:mio_mother::1","text"],1]']
src = "blake3:e9008653483b37027dc48d2f35828ffab2ca5552fb1f5daa2dbd0de2a54b982c"
text = "他离开那年，也是这般天色……米价你记好了么？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:mio_mother::2","text"],2]']
src = "blake3:39a97e4d5fc58414fd58990f06ad1345d2a6b1b2a8ae01495b1f0b73abb462c0"
text = "坐吧。先莫开口，细闻一闻，炉里燃的是何种香。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:mio_mother::3","text"],3]']
src = "blake3:765433bfc03d5ac5b11bf0c0342c5d0c9b23ed36b1f41217609123a8d9918521"
text = "账目短了一文。莫慌，再重念一回，我仔细听着。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:reizei_yuki::0","text"],0]']
src = "blake3:0468e7c22e855932785af2f331835408ccade8e9d8112402bd8043577928b218"
text = "土佐来的那位。讲个‘梅雨’便够，何必说连着下了几天的雨。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:reizei_yuki::1","text"],1]']
src = "blake3:c8d32c33e5f16bdffe690f04d85df2348c5f439e7252f1e5034714a55aeb39e4"
text = "你昨日那首，后两句裁去，前两句我先替你留着。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:reizei_yuki::2","text"],2]']
src = "blake3:a0f7a328e0f0567d4b2372a6b6effec30963afa9e1e84fb45ff5005e96f499b9"
text = "话太繁了，拣一句说。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:reizei_yuki::3","text"],3]']
src = "blake3:a42bba088533d8b7d3fc0589a81f6101f3c7754b68fead17f2b72771e2eada8a"
text = "秋风。……足矣，往后的不必再讲。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:sanjonishi_kineda::0","text"],0]']
src = "blake3:546c677fc1a25acf1c0c3f9de960fc5d3330828a16d746bd3609593a75497ef6"
text = "来啦？方才说到哪一句了？……不管怎样，先请坐。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:sanjonishi_kineda::1","text"],1]']
src = "blake3:24a3b0b87e25ed58b7827e461fbf674067210d6a808b60445c8add3971919464"
text = "读至哪一帖了？‘夕颜’？那便打‘夕颜’的注看起罢。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:sanjonishi_kineda::2","text"],2]']
src = "blake3:e764c0928e6f6ab9bca7faf04911ae9e1d46618d7b7ce930c83798da707412a2"
text = "你那条注誊得甚好。至于歌嘛，气太盛了。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:sanjonishi_kineda::3","text"],3]']
src = "blake3:2a5bca99e7e0a7467390daeaa028e9baf96c386a72612777cf2f01045cfff894"
text = "人老不济事，说着说着便忘。你帮我留个心，记着讲到哪句。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:takamaru::0","text"],0]']
src = "blake3:2113c28cb62be2f961f0ee17fb43f83dcd999c37cf65d25e84f1678561038da7"
text = "岸上的，来了啊？上一回你输了两个船身，我可记着呢。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:takamaru::1","text"],1]']
src = "blake3:2d2b47e0b1b4853fdd397d88810c4a3d4f7b9a6234efb6a8c6a0fa68667aff8c"
text = "鼻栗濑户今儿流急。我爷爷那会，一天在那收过五条船的钱，一条三百文。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:takamaru::2","text"],2]']
src = "blake3:7c8de48d2018da6f2efc47b33bde0549a6cf9b419b234a78a8e9f76c3ba0c450"
text = "桨握反啦。……罢了，这回便只算你一半。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:takamaru::3","text"],3]']
src = "blake3:6473a29dde2dcc9c0b6ec5824604009f090174cd7f66cda2887c82b44da45797"
text = "今天十一条小早出港，十一条都回来了。就数你那条最末。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ushio::0","text"],0]']
src = "blake3:e639b428a4274f7118644dc9d6b844a097d0f91ac6406faca7b6de3669d25e41"
text = "姬君。……是娘亲让我来的。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ushio::1","text"],1]']
src = "blake3:91d2075a0e45d35815fb5170b458b4c06b36dfc362648e5816bd8206c18c161e"
text = "今日小潮，得申时才转流，你莫信他们的，水才到第二道绳。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ushio::2","text"],2]']
src = "blake3:0d823f51568c7849c805840acc25e6d8f1da80b6e1a990533954526187866e42"
text = "娘亲说了，出门须带着手巾。拿着罢，这可不是我送的。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:ushio::3","text"],3]']
src = "blake3:fc032f47421ebc6203a91a3c6facc979daf4657c6267a8c19db3096759b85a52"
text = "……请姬君先走吧，我随后跟着。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:yamashina_tokitsugu::0","text"],0]']
src = "blake3:28db6e8d494ecb0ff80a8223bf2ed5539fdf8356caace895a0b8b5a091f7ab3b"
text = "哈哈，原是一条家的姬君！今日见了你，我可得记进日记里。"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:yamashina_tokitsugu::1","text"],1]']
src = "blake3:e5aa67ecf276e4efdb45e858a399f3774fd7212b916244f73695c10b35625efb"
text = "宫里修个屋顶又短三十贯。你说，这钱打哪儿凑去？哈哈！"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:yamashina_tokitsugu::2","text"],2]']
src = "blake3:74547006c0c491fd1ee1f81ec64bc6aa206d192e7cc08778ac2da7a2c09b8257"
text = "昨日替人看病，诊金收了一包茶。日记里是该记病，还是记茶？"

[entries.'["upbringing/act/mio.toml",["act_greetings","mio:yamashina_tokitsugu::3","text"],3]']
src = "blake3:029813b0e692e0988ec40692cfd46083d1d9ec0d13a0cf38d4edc28037fbecd4"
text = "你来得真巧，我正待出门去讨钱呢。替我拿住这卷，莫给压皱了。"
