generator = "gemini-4-hydrogen"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_1","description"],null]']
src = "blake3:81716f1527a6c6267cdf47073ad45242f611674655736f6d0bef16b76803b772"
text = "入夜随出港的船家望星，哪颗星坠入海中便起锚；返航后把星位同船上货数一并记上簿册。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_2","description"],null]']
src = "blake3:fb55e80b16a44f6b1d50314cf1119f4986d81b81fa6f5c936d2885dd120fcf5f"
text = "把阿濑家留下的刀谱逐页抄明白，循着谱上记的步数去沙滩上走，错一步就得重头数过。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_3","description"],null]']
src = "blake3:d84c73dd5fc8b9849bb3146373a6edf7ea8989257492c8d0ff34aa2da690c552"
text = "细翻一条家传世的旧家记：往年逢节怎样行礼、送何礼物、耗费多少，礼仪与账目一同抄下。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_4","description"],null]']
src = "blake3:dfc68a958d4f33fc65ad245295a23b7ca3603006c7e28ca80de11da8ea956a2a"
text = "在社前代为向参拜者引路、答话：先称呼，再询来意，末了把神主的话转达明白，半句次序也乱不得。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_5","description"],null]']
src = "blake3:2d9d4bc638f6abcc1233b608f6f038ce714641073b486f77a8c3087fc415033e"
text = "为送客的小早把舵：遇上浪头需稳住船身；船中坐着客人，抵岸时先请客人离船上岸，再去拴缆。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_6","description"],null]']
src = "blake3:a6d7c4a86f4b6d44f98c746741cc44bd36512b6e92feadc739543cd2d01b45f6"
text = "带几名水性好的孩子潜下水去寻一只丢掉的锚：谁先潜、谁在船上数气、寻见了先莫作声——锚是哪家的，尚未问明白。"

[entries.'["upbringing/u04_unlocks.toml",["activities","u04_unlock_mio_7","description"],null]']
src = "blake3:7bc3d7b06382a6b874d9d33b4701ffa10981bd0eb6150a948aabc2328704b6e9"
text = "陪着上岸歇气的海女围火坐下，听她们讲起潮底下的旧事，随后逐句复讲回去，漏下的部分由她们笑着补齐。"
