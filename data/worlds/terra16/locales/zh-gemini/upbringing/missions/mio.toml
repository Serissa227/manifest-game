# 第二套中文 zh-CN-x-gemini；由 locale-import 生成，请勿手改。
generator = "gemini-4-hydrogen"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_01","text"],null]']
src = "blake3:5abfd29314c1646f3cef0791d5f8cd658f89f417856099d04f7fd351c3727326"
text = "今月随我上船两趟，去收帆别钱。木札自己动手削，削歪了可记不住数。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_02","text"],null]']
src = "blake3:19f5e8ba2647d5492a191b80a828c47a7ef52d999b216e94a077e7fda54aa1f0"
text = "书房里那本帖，今月内临完。……米价可曾记了？"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_03","text"],null]']
src = "blake3:0b585d9d51a535f0759882307eecadc452848c4a75508879aa5176ff34f00c91"
text = "开春便要下水。船底蛎壳刮它两遍，净了再登船，我教你看海图。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_04","text"],null]']
src = "blake3:7819e47611b3a96f2c310eec7dfd9d0ef36ecc0a36f7faa644287b4c95cf856f"
text = "趁鲣船尚未回来，你也学着记账。那几户的米，再替我核对一遍。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_05","text"],null]']
src = "blake3:c0495ddabd70ecf273846f6e79c6844f5b5f9a2fb08fa0340821ba8ee416b36b"
text = "五月里潮势大。这月每日来码头观潮，直看到我应一声“嗯”为止。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_06","text"],null]']
src = "blake3:388db533715314559d0d9ae4aad488e9319f067a19fdbeb0802505d28dcdd375"
text = "十二是夫人的生辰。用你自己挣来的钱买件东西，别动夫人给的。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_07","text"],null]']
src = "blake3:37490f69c1faff9ca47c00f5c950acd8910388326e8911966bf623b3380a1cd3"
text = "京里捎信来问你的歌。礼与歌皆升一档，写成了先念给我听听。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_08","text"],null]']
src = "blake3:9adddd0327a7a531171240b2c74ba07c547561f6238627e3d84d5aa6d931facc"
text = "风汛将至，船底那几道缝日日盯着些，麻絮沤烂了便换。宿毛那年……去吧。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_09","text"],null]']
src = "blake3:ccf69ca48232f5d9c940c8462dc02224ef723e7911b0b84c57eb0f4ab14a97df"
text = "旧家记你先替我念着，读至何处便记至何处。……那一年的不必读。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_10","text"],null]']
src = "blake3:cf26dace57ee5eb80efee34e15bf7c8ed61eab2409585a57a917fc642327010e"
text = "栈桥装运年贡米正缺人手。去上五回工，工钱自个儿收好，莫放进夫人账箱。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_11","text"],null]']
src = "blake3:f380d383f8a46e617af99f84c8ba83c80c93209f4740a99ee83202546ed65cb1"
text = "京里要看你的笔迹。写坏的废纸莫丢，拿来给我瞧瞧。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1553_12","text"],null]']
src = "blake3:6dc39e60a74ca7a9e0f81d39cdd4f68300b0c0009726430ab58ab9e1d8411bbc"
text = "开年便要动身了。走前随船守一夜更，瞧瞧你可熬得住。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_01","text"],null]']
src = "blake3:cb19f8c47f2cf611af62032c72ae0fd76597c2ca0123aff80ca7673cb907f09c"
text = "抵达京中先寄信回来，字写大些。把砚箱留下。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_02","text"],null]']
src = "blake3:08a41184ce2b71e3d5c0ce82abfe6c07c22964eb5817eb6da0a1624766cb79ff"
text = "宫中之事急不得，逐件来。先换一册假名帖；其次，局里的奉茶也学着些。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_02_n","text"],null]']
src = "blake3:649752266b855e4cc6d03a0d54203e7c78fd46c609a2d7fd0d5872d9655840dd"
text = "小鬼，先把船坞里的桨摸熟了。打下月起，上小早。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_03","text"],null]']
src = "blake3:5660ec39c574efb19fec8206d7f64d6aeccd0bd39480028708438743a31283e9"
text = "字我过目了。从下月起，把歌递来我看。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_03_n","text"],null]']
src = "blake3:9a03fd8142f055e0ebc695755ac54262dbb229f1f8073888abddee25e6b7673a"
text = "岸上的，月底比试一场。差几个船身，我如实记下。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_04","text"],null]']
src = "blake3:c03956717e032af28d62f01ebcbe58d8de16007c0723549791e1123c75a7aff3"
text = "座次那几条，今月内与我背熟。……方才讲到哪一句了？"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_04_n","text"],null]']
src = "blake3:8f9137de45c140c844c20c46e435529d118b24dff42904aee2029f0d9fe9b485"
text = "二十日考校认潮。留神听，潮声一变便记下，记不住的休来应考。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_05","text"],null]']
src = "blake3:2fd564dc8b7a9069d42630c42166ff85d2e841c618cdf6c1bfe8b009fac64532"
text = "鸭川渡口正缺人卸货。家母来信说京中米贵，手里莫闲着。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_05_n","text"],null]']
src = "blake3:e64abecb43f815b1468c7e964aad56932a663f79630801c91ce705ee24749294"
text = "晒网院子里人手不够。我祖父那辈，见习的每日要补二十张网。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_06","text"],null]']
src = "blake3:a5cc9f48fae2b2c09e48990ed3658093191253e024bbdb559dd86513dd19bf6a"
text = "初十与十四的鞠会，你也报上名。鞠自樱枝落下顶好接，若是从松枝——"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_06_n","text"],null]']
src = "blake3:eba621c7bf442cd805aa94c874657decbfb50be6cec3a0cf16ba9c974d255e5a"
text = "梅雨时节网烂得快。去晒网、补网，做足三回。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_07","text"],null]']
src = "blake3:a0e018e9e4a4494d95c9c07c7d988055c737a650438211b341b7cf701f4ab478"
text = "哈哈，药柜钥匙可捏在我手里！今月起随我认药，至于诊金，日后再说。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_07_n","text"],null]']
src = "blake3:8f3b523b7569bf2be734eb38a33c154a1fe852e7e89300f8be6a53216b4f3537"
text = "船坞新来的船匠骂人凶得很。你去给他填缝，填满一条船便算你一半。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_08","text"],null]']
src = "blake3:0296484b7109db603e19482519acb94ed0822eb282a5a62b1c10b5da133f45ce"
text = "七夕这几日局中来客多，劳烦姬君了，奉茶之余顺道把人认一认，不急。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_08_n","text"],null]']
src = "blake3:b293462a6632a50204a0935313eebc8055d14f0583e142b43108d5a0e08665d1"
text = "盂兰盆前莫下海。先把手上水泡养好了再来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_09","text"],null]']
src = "blake3:646bc069c1eac777524431e8fcc1922f45003ef99376b8f37dd9e758218b1eac"
text = "你那几首被我删去半数。月底以前，另拿二十首过来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_09_n","text"],null]']
src = "blake3:3d3e42c7749b4b628a4c11f903e5e10f75f23bf16c6bc46b54e8f520fe18d1ee"
text = "八朔回岛那日，今年收过钱的船，我一艘艘说与你听，仔细记着。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_10","text"],null]']
src = "blake3:8efb471719c24900c3d5a81d26e691a94ea2334dc13509eb83d645b1706f487f"
text = "节会缺人当差。……方才说到哪儿了？对了，节会，由你去吧。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_10_n","text"],null]']
src = "blake3:19ac560c0551dfe66d7bf2da06d8ac861559d3edc46430b525db20b8ea9a5dc4"
text = "月底考驶过急潮。你握舵还不够稳当，这月天天握着练。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_11","text"],null]']
src = "blake3:637947077fcd18c0507e0d14aca7eba3ad7319d3aaa4f9c53a230e9caaa1a6d4"
text = "学生，代笔的活计我接不完，匀你几件。每件三升，抄坏了另算。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_11_n","text"],null]']
src = "blake3:bc431b95a9d20b09b75400593c7d8778781d4dd369a1bcd6146bb38217f2a09c"
text = "打下月起夜里值更，本轮不上见习的。你若能轮上，便算你赢一场。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_12","text"],null]']
src = "blake3:4d83e22027db5765a143774723e87a861c05133dca9095a3daede37c5df285d8"
text = "恕我失礼，岁末节会之上，您的袖口我可不想再代为整理第二遍了。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1554_12_n","text"],null]']
src = "blake3:3597252d20dc86c27763553f7a28fc0a6e84db8da2130f18898928eb0cdeba12"
text = "岁暮晒网收簿。网既补齐，簿子上记你一笔。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_01","text"],null]']
src = "blake3:dd59bb132823f623d2373b7abf93ff8cf02bf9a701bd0814cdfdf29093e732b0"
text = "正月各处走动，姬君两手空空不好看，带两三件小物便够，改日我替您还礼。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_01_n","text"],null]']
src = "blake3:08a7631768caaf3a9b92c9af8ef2aa75126ae87376f616948cc16bda2f506bb6"
text = "背潮表？我九岁早背完了。你背至第几页了，报个数来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_02","text"],null]']
src = "blake3:1f204e13a7c05c722b2456d71590646609daed8e5e36bcbea36b2263348e4189"
text = "月次歌会少个研墨的人。带上你的字，坐末席去。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_02_n","text"],null]']
src = "blake3:55126364108b226c26ce3dbfd91908c47c99a89477ceefd7f25953bdb6446d28"
text = "换上新桨了。夜里仰望北斗辨方位，认错一回，便扛一回桨。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_03","text"],null]']
src = "blake3:a60ebc293c644f6251383bc680b6d028fa979194fda76221080b49348e2f326b"
text = "鞠、鞠场少了一个人。八人轮流踢，缺一个，鞠便、便要落地了。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_03_n","text"],null]']
src = "blake3:caee484024907ee398fce3dfed1f11360d07a5eac8ab95b91ccb6cd327334d54"
text = "那艘旧小早的舵柄裂了。你去削，削好我来试，不成再重削。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_04","text"],null]']
src = "blake3:44e80264a04e867e48cd280551359dec9247418e235f524ba3070a9a7e2bf8f8"
text = "春日病人多，诊金也多，多半是一包茶！哈哈。今月跟我识二十味药。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_04_n","text"],null]']
src = "blake3:4ca82f23ba429f681b61ebadb4b27e5dc9d054aa455e5085bbe38aa8eff14ddd"
text = "二十日考校推潮时。先把月龄翻熟了再来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_05","text"],null]']
src = "blake3:b24b8f5e1f411041bfe996d6501e10c7f56378c1d8a854f197785a012000e7f1"
text = "你这几日咳嗽。我娘说，发咳的人夜里休点灯写字。躺着罢。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_05_n","text"],null]']
src = "blake3:f650ca8b6d6e0441fc1aa8fa1c9f62e0c9b41ad9161606b715a320ee3f1ea685"
text = "鼻栗那边今年过往船多，番所缺个跑腿的。可要去？"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_06","text"],null]']
src = "blake3:c42bfeb54e0a38b32bd05c5a4f9a0cbc1bf75e01c4ad0f06ce3cbcabdacf31e1"
text = "代我抄一沓恋歌，字迹要像女子写的，越像越好。每首半升，月底结。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_06_n","text"],null]']
src = "blake3:19cfd535b37639d19f2eb23729624bd4eea19a88de48e0fcac01ae0230c2d05f"
text = "今月学急流救人。入水前先把绳子拴在腰上，由我拽着。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_07","text"],null]']
src = "blake3:a76e738aeab8aeb1050f279e6d83dc427adfb7a68e7b87978456f76c1b69c6a8"
text = "“夕颜”讲毕。礼法那几条且背牢，下回我问……问什么来着。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_07_n","text"],null]']
src = "blake3:3145b6332e79eb931e147d446752da3f57404a39b42e9bb30ddf8fea184a6c5a"
text = "在了望岩上，我能先望见第几艘船出岛影。你来比试比试。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_08","text"],null]']
src = "blake3:1f3d7c8f34331678c4c78552067d0638598d500a5c0ef53b96cf447c6a7ebaf6"
text = "初四的贝覆，还请您坐我对面。按规矩，输家得替赢家收拾贝壳。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_08_n","text"],null]']
src = "blake3:d53d8c787b4b17d2d32960f249f0788f0b9ed496ef223ed8437288037c919064"
text = "盂兰盆回村，踊得跳至天亮。动身回来前，把村里听闻的事跟我讲讲。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_09","text"],null]']
src = "blake3:3dce1fc7c4f41c77f746bb41d05d7ccebdbb319beffc58735d376a4fd9b1add3"
text = "姬君归来了，土佐都安好？局里的日记攒了一叠，逐件慢慢抄，莫急。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_09_n","text"],null]']
src = "blake3:b90d8a2c6882668a44a789f5777f26c26b0ae4a7e7b8ebb531edbe338cdbb710"
text = "岁暮要修旧小早，船匠只要会铺航木的。你可会做？"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_10","text"],null]']
src = "blake3:c99a54bb5a1ab87d62fe5e0425ada0f1035fbc199c4373b43631e7f16dfe0389"
text = "初四闻香会，我拿一包茶押你前三。这事我定要写进日记里。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_10_n","text"],null]']
src = "blake3:1ab8f84ba0135ff1601025718188ceb2a01cb36c29317f1621b0cd69a0070d43"
text = "十五日夜里过海峡，莫点灯。潮声你须听得出来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_11","text"],null]']
src = "blake3:1143f18d580362d89387d4a1a044075869a419757a2f64b9c20223ef1ce2c84b"
text = "凑齐二十首再拿来，不够数的不看。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_11_n","text"],null]']
src = "blake3:3d21141d4ddd815ad87b0217f3befd73b823913a2c50fe44df4664bdf593b478"
text = "第二十场了，今番比试潮时表，瞧谁的格子错得少。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_12","text"],null]']
src = "blake3:dbf5c8472e08c7f0e35322e719fd04e5fc6da56457e89e33042b4f1d83fdb211"
text = "腊月有船回土佐。我娘爱吃京里的饴糖，由你挑选，钱我出一半。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1555_12_n","text"],null]']
src = "blake3:a528bd15040b83f06664c1f14f452031131a68fafb83af1da00a575b9b67dc7f"
text = "岁暮要修一艘旧小早，网也得晾晒。两处都用人，你且先管网。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_01","text"],null]']
src = "blake3:f0021f71ad3a994aa398a4d6e49158460cd68e4c41092d071b9cd1e5ea0cf9f5"
text = "开年后，宝镜寺那边托我问问，姬君可愿常去读经。……肯，那便好。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_01_n","text"],null]']
src = "blake3:de6f94d690dc49a84e53adcd5a1497d00e15d61f3d0d2d3b6ee639485e0118e0"
text = "末了一年。这一趟赛谁先过鼻栗，输家请全番所吃酒。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_02","text"],null]']
src = "blake3:e5e86a0dfb3916775da86bf8f5361e5a7a94fbb319805a17b19f3d350cbb21e2"
text = "开春时，飞、飞鸟井家的鞠场准外人进一遭。你、你脚底下可得快些。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_02_n","text"],null]']
src = "blake3:1fc068b570b6011932e0e7874ac2f4c29223e817ced786f0ea13eb5c23938e60"
text = "番所里的阿松婆染了病。往鱼贩船上拣些东西，莫空手去探望。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_03","text"],null]']
src = "blake3:faac2daadd0bd16d04b4a685d17603dbf5108638e6293cf01d9b3b925ed9e65c"
text = "米价又见涨了。来陪我说话罢，陪话不要你的钱，这个月不收。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_03_n","text"],null]']
src = "blake3:b920f000776bed27b078d039ed8323ed63f37a9e7e8251822d2eca792e9aca55"
text = "开春该你领新人了。……新来的当中有个在哭，你去同他讲罢，我说不来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_04","text"],null]']
src = "blake3:49438ce29e0480cb0a0250d08f2edb284afa55dae4d7e3aad7317a22e98e188e"
text = "月见台上寒气重，带件衣裳！打今夜起，星宿和方位由你代我记下，我只管看。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_04_n","text"],null]']
src = "blake3:1c3b5d21ac2811ebdc36c4151c23c4e268fd244fa6c5b898b8a2506ced00d9e5"
text = "二十日单身摇橹渡过海峡。这一月手莫离橹。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_05","text"],null]']
src = "blake3:7eef31fdf61d0278789d832fcff3a79c0a5f37ebebecbc51db0e1d3a5cfa809b"
text = "末了一回歌会定在下月。多余的删去，留下的带来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_05_n","text"],null]']
src = "blake3:0d0b70915754e01719c70548f0a136b03dee71d165aac2363db52316f38bc6c1"
text = "那本潮表背到末一页了么？我可是背到了，第三十一页。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_06","text"],null]']
src = "blake3:66025d0a50540476fa744ba09cb4de5906f1ab948ddf34f3e0f59780ae947a37"
text = "我人老了，口耳相传的这些总要递给一人。……递给谁来着。先由你来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_06_n","text"],null]']
src = "blake3:377ea8263dd45ceb64f680a9b5060599ebfccbfebbb3904605c18651e472f226"
text = "鼻栗濑户，末一趟领你过去。舵全由你掌，我不插手。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_07","text"],null]']
src = "blake3:67a244cff80b92c06050d65c20044797a2bcfb36c9ad92d11a97a96376f63193"
text = "节会前的这一个月，请您每日移步局里。您且看着，只管挑我的错处。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_07_n","text"],null]']
src = "blake3:887236a32a629240b2966444a725a3a11802bc0fb3b9e286716c6bcfd67d1c40"
text = "今年七夕的小旗交给你来系。绳索往鱼贩船上买去，钱由你出。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_08","text"],null]']
src = "blake3:8260150e15eaf192e72ebd6f3dd7cb314becb117ad19602270856037e93ac947"
text = "你动身回土佐那天，我送至淀川。这几日少动笔，多睡些。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_08_n","text"],null]']
src = "blake3:bb764f24d23b21896bfbd5fd0a6212c9e7c806d9158f372cf57bec22c53d105b"
text = "送火须守到最后一星火灭。回土佐以前，先睡饱了再动身。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_09","text"],null]']
src = "blake3:84cf090c5c83d5e17167afb8d60b44a83c450c321f72b1af770f0d24a2ef3195"
text = "可算回来了？船底下又生满了。刮上三遍，刮净了领你出河口。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_10","text"],null]']
src = "blake3:abed12466c753dd8a524acad07a76f3d462a9ae22127b1ed45ebef6b98d64040"
text = "宫里的歌会，这一遭给你留的不再是末席。把字拿来。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_10_n","text"],null]']
src = "blake3:33b74942e29b44c72329a5b23c248590ea24b75b537aa6a5a90fa8325894d0a7"
text = "八朔那日是我抛的缆绳。这回换你抛，若抛不上桩，便算我赢。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_11","text"],null]']
src = "blake3:2ac75a4e4bd928be7b5b5083152d10e210e27ec2f14a824f482ae882606ffe0c"
text = "二日要考讲读。由我出题……出什么来着。你只管将《源氏》的注背熟。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_11_n","text"],null]']
src = "blake3:c266a3a8b48e6b2097f092f9938cb6f7b9649b6307c3f62f5be510688656a918"
text = "二日结业考，认准潮线，独自把船带回港里。若带不回来，明年再考。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_12","text"],null]']
src = "blake3:60b357705d1cb78357e7b30c2753535600305321401c8d280e174a3678e56533"
text = "姬君将要动身了。国子那头、三条西大人那头，行前各处去辞别一番，日后便难相见了。"

[entries.'["upbringing/missions/mio.toml",["missions","mio_m1556_12_n","text"],null]']
src = "blake3:647b802b59ded00e42ee4b4df36f1fd46b21d8485bc9c1def40b4c5e997a45e8"
text = "潮图角上要添上你的名字。……就写在我旁侧，写小些。"
