[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_bon","customs"],null]']
src = "blake3:588f1c89f5bc8cf1ff1cc4657281902ed6b925734175babe1bfde1ae65ea2b73"
text = "到了盂兰盆夜里，街当心亮起灯笼，大家站成一圈，一人领唱，众人随声应和，边舞边绕着走。离乡在外的客立在人群外头，猛然听见一声熟惯的乡音，脚底不由自主就随着步点转进了圈中。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_bon","date_note"],null]']
src = "blake3:1e27d2a601262aa108395a08dc09974856c24355cbbd2130cddf80285c89fe62"
text = "按宣明历，七月十五正逢盂兰盆会：当空满月，也是灯笼燃得最旺的一宿。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_bon","gift_custom"],null]']
src = "blake3:ee1ccf50a9243379eef0518d056c79bea6a7fa673130bde3f76e098657d1c72b"
text = "或是一盏纸灯笼、一捆素面，又或是捎给守着先人灵位那户人家的几个新瓜。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_choyo","customs"],null]']
src = "blake3:7eaed81f5210493a3ae83e6318b7ac5cb88d2c40f7309b96422a05674d5c0305"
text = "九月九日，大家到篱笆旁摘菊写歌。大人把一片花瓣浮在酒中，孩子的盏里只添清茶，却争先恐后地比谁的花瓣先沉底。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_choyo","date_note"],null]']
src = "blake3:403113d40a7344aab7179057d9b66150947b6b7527c388f8cbccfa19e78df30b"
text = "重阳落在宣明历九月的第九日；九本属阳数，双九同聚一日，故而被视为全年阳气极盛的一天。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_choyo","gift_custom"],null]']
src = "blake3:349f6029fd098d1816cdc4fd325db10fffb8ba3508fc45172a3cc6c7a19b27e1"
text = "一枝初放的菊花，或是头晚覆在花上吸饱了露水的丝绵：据说用它来擦拭面颊，可以添寿。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_gencho","customs"],null]']
src = "blake3:f35bff5f8613ae8168d87752c7c9eb5b04c68686d4268d65c46921ebbb53e05d"
text = "宫中女房磨细豆粉、揉捏出红白黑三色亥子饼，一盘盘送给当值的人。传言吃了这亥子饼，一整个冬天都不会害病，也不生冻疮。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_gencho","date_note"],null]']
src = "blake3:f78b469936758c34dd53ce32248da053ff2b0a803ae676ffac0652e4952ab09e"
text = "定在十月首个逢亥之日，依干支推算，不论月相圆缺。1555年适逢闰十月，那年便照前一个十月来算。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_gencho","gift_custom"],null]']
src = "blake3:668b7e214d7b395d8dcb68ccea6afd00f4a33198baaa2e3cb03fbca7be95e255"
text = "取方小布裹好一块亥子饼，连布带饼一并赠予对方。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_hassaku","customs"],null]']
src = "blake3:8cc4a9dd845d3e4f5997c7a8b85296e392f84a1203d024c3b42a79a8f0c6dfcf"
text = "八月一日那天，大家提着礼穿过半座京城，上门答谢素常关照自己的人。礼里总会另包一小份分给同辈，只说是讨点运气，收下的人口头上推让着，手上倒已经接住了。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_hassaku","date_note"],null]']
src = "blake3:369ff5cefe45795972166cdf7e6f3c472a13dabd3a55e7a822b93fa5ce4d236a"
text = "照宣明历算，八月初一是朔日，新稻才刚成熟；要是赶上稻子熟得晚的年景，人们便改送纸张与扇子。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_hassaku","gift_custom"],null]']
src = "blake3:cf50337b7379b44b684700e6a128c40eab2fc5dd4babfcb634ac20f17d35b11d"
text = "初熟的头茬稻穗，或是一把扇、几帖好纸，恭恭敬敬献给平日照应过自己的人。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_herbs","customs"],null]']
src = "blake3:800c1cc6c20734bb563c68338f3654c5d5d9e29262db10181aab91bb23f9d64f"
text = "天刚蒙蒙亮，女孩们提着篮去河滩采摘七种嫩菜，嘴里一边数着芹、荠、鼠曲草的名目；谁认错了菜叶，身旁的伴儿就笑着帮她拣掉。回来后把菜剁碎熬成粥，大家围成一圈分吃。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_herbs","date_note"],null]']
src = "blake3:c7a3623c3cf10af8c7c299f5830dca244e82e2f79a2649a562efde6d6912441f"
text = "宣明历的正月初七，即元日往后第六天，此时河滩上的嫩菜才刚探出芽来。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_herbs","gift_custom"],null]']
src = "blake3:e5d32e8cbc84d5fdab903b6f8606efc14bd8b1dee89f598dd5cc88046610314d"
text = "一把洗得水灵的嫩菜，或者一碗扣着盖、专等迟来人喝的热粥。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_kajo","customs"],null]']
src = "blake3:96733c9497eb5ba5ee34006c12e02595d5958778ac68565202921b5704c291f0"
text = "六月十六日这天，点心铺外排起长队。家里将点心逐份分妥，碰上值夜的女房或看门的老人不在，就拿碟子扣着留下一份，等他们散了值来取。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_kajo","date_note"],null]']
src = "blake3:cfed973ff06a1edf0b60006456b5342680e85f41efb91ae8230edbcf381cbc6a"
text = "按宣明历推算，六月十六日正值一年里暑气极盛之际，点心留不过天明。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_kajo","gift_custom"],null]']
src = "blake3:6590a42c8e7a09684a384dd0926741f0875ea1ed0b49775e0463ac4a9723ee8e"
text = "用怀纸包上正正十六块小点心，不多亦不少；手里若无点心，便数出十六份干果代替。分送同屋之人，也送与当值的。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_mogi","customs"],null]']
src = "blake3:4a47554443b6dc25084862fe6601f7939c1a22ea687dceebefa34e4b15cd6323"
text = "家里人替快要行裳着的女孩穿戴好新衣，请一位品望兼备的长者来为她系上裳腰。同龄的伙伴一人送了一把练字扇，哪怕上头的字写得歪歪斜斜，她也一把接一把揣进了袖袋。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_mogi","date_note"],null]']
src = "blake3:58a1d5fe724d3674907978ce7a0e316565523843ecf539af10eadec0d7ad9463"
text = "吉日由各户托人卜算后自定，只邀亲近熟识之人赴席。这算是一家一户的喜庆，并非整个京都共度的节令。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_mogi","gift_custom"],null]']
src = "blake3:15a20b95dbf37ee40761b742cfef9d845d41566033f8247720f277f95ebe4441"
text = "一把亲自写上字的扇，外加几枚小点心。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_monthly_poetry","customs"],null]']
src = "blake3:466411789dd067e6bca69be0c75e3908da9e94f9a0d12573124878e94a80217a"
text = "每月大伙轮番出题，同窗们不管写出好句还是改糟的句子，一并录在歌簿里。到了月底重翻歌簿，总有人望着自己改坏的那句，乐得话都接不上。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_monthly_poetry","date_note"],null]']
src = "blake3:6efd23317a5fd3f4cecb0d78e5949be39d57c479d8e3b3025d359a731085a019"
text = "照宣明历每月十五聚会一回，哪怕碰上闰月也不耽误。该谁出题，便得早几天将题写在折妥的小纸笺上，绑在一截树枝上，挨家挨户传过去。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_monthly_poetry","gift_custom"],null]']
src = "blake3:9673fecb79b73cb40669868eb828d88c4752ce6f1a625674bb007748b645270c"
text = "一纸手抄的诗篇，里头夹着片压干的花瓣。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon8","customs"],null]']
src = "blake3:b883091e0b306d963aa4f6fa0a36258d3eafa0d5b1c1cddfdc3a315965c9fb35"
text = "八月十五这天，把小案挪到廊边，在月光下摆上芋头和芒草作供。诗笺只写半截，特意空出下半边好教别人接续；下句要是续得巧，满座都会静上一静。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon8","date_note"],null]']
src = "blake3:3c00fcd0712435ac4218ed8a410f3d178877fe879005aa9d3ce8522eac8a3e8f"
text = "依宣明历定在八月十五满月之夜；若遇上天阴，大伙便望向云层背后透出的一团淡光赋歌。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon8","gift_custom"],null]']
src = "blake3:2e1030e7c8144d770c932d924e256108244837b1a7384b89580c6f257096c1fe"
text = "一盘煮透的芋头，一枝带穗的芒草，或是一首独留上句的歌。受礼的人只管致谢，下句原不催着即刻和回。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon9","customs"],null]']
src = "blake3:56fbedff12aca87ba0f8930d25e4825208017e214fa696f4514b314c7e8c5976"
text = "到了九月十三再赏月，这一回月盘还差了一小角。上回没讲完的话，便留在那缺着的一角里，讲与不讲都由得自己。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon9","date_note"],null]']
src = "blake3:00f3134d6fea3cba7f697517cfc76f17f697b3a8f67ad95bb5e1c0a4abedb697"
text = "宣明历记作九月十三夜，距八月十五夜约摸隔了一个月，月亮要再等两日才得圆满。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_moon9","gift_custom"],null]']
src = "blake3:90839da8337855216cb09371626a16599962f627df1e84bfc62e0694e8be1368"
text = "一小篮新栗子与毛豆，或是顺着上月那首续写下去的歌。无需立时应和，道声谢也就够了。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_new_year","customs"],null]']
src = "blake3:b3067b0366410375e8be70aa81b92a7ae36b23b88d8bda7bd47d060bcf64769f"
text = "正月的京都，街角常有穿红衣、蒙白布的人，把一张张懸想文别在梅枝上兜售。那实则是照恋文样式写成的祈缘护符；买的人口口声声只说是替家里求的，藏入袖袋后，一路脚步走得比平常都要快。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_new_year","date_note"],null]']
src = "blake3:f6c92951b9226f6886060afaf64a47611413e8f5e646fa8a3088843a8940ea7a"
text = "正月初一依宣明历而定。因按月亮圆缺排定，对应到公历的日子岁岁不同；譬如1553年有闰正月，1555年又遇闰十月。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_new_year","gift_custom"],null]']
src = "blake3:075acf41cff9dd8d3849255dfc10b1a58d22b2d2d5520dc5149c8650970af08f"
text = "一块圆年糕加上一把折扇，扇骨间系着一首新年和歌。收下的人道声谢便是，不用当面作答。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_sagicho","customs"],null]']
src = "blake3:3c8b3c6c975447df4d114828d0a8e94a7df2b53bb9888d66830a2e358a19df05"
text = "正月十五这日，大家把门松、旧护符同写废的字纸聚在河滩上，架起火来烧。大人拿竹枝串了年糕炙烤，小孩则轮班看守着火堆旁的余烬，任谁也不准踩熄。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_sagicho","date_note"],null]']
src = "blake3:a617dc403d8765f8304e803166d8da1d4009fb71ed2152511b2db10da1217186"
text = "照宣明历来看，正月十五称作小正月，这夜恰逢月圆，比起元日来要安静些。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_sagicho","gift_custom"],null]']
src = "blake3:6e2679c7657a1299f683e0f84a7e3b5fbd791f666656f5cde73f06448c339877"
text = "从火堆旁烤至微焦的一块年糕，顺手递与身旁最近的人；传闻吃下这口，一整年都不会染病。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_setsubun","customs"],null]']
src = "blake3:1c295ae8492481eb95b2bd6268ab2b6d4330d747ad21952dd6cf052a033fe655"
text = "立春前夕，家人往门外撒着炒熟的豆子，高喊鬼出去、福进来。门槛外要先打扫干净，将要出远门的人也须择好方位才肯上路；等这些讲究行过，一大家子才围拢吃饭。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_setsubun","date_note"],null]']
src = "blake3:0b8722fc8ae44739b20c5c85b03ba584511644227a8375c27efab15529d7ab28"
text = "系宣明历中立春的前一天。此日依节气推算，与月相无关，故而岁岁都在公历二月六日。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_setsubun","gift_custom"],null]']
src = "blake3:930b2a9d028b288a2e7b17ead76b3c91b61284d4db53077a4c0d55c6e222a9e2"
text = "一小包炒豆子，数准了对方岁数再多加一粒，另随附一张写有祝愿的小纸笺。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_shangsi","customs"],null]']
src = "blake3:f26ef3ba1275c97999d3f74ccd2131934f550ca9eb41de8484084f05dbe4fb7c"
text = "到了三月三日，人们拿纸剪出称作形代的小人，往上面吐一口气，在周身擦拭一遍，便放到河里顺水漂走。孩子们顺着河岸跑着盯看小人在哪处拐弯搁了浅，说厄运也就留在那儿了。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_shangsi","date_note"],null]']
src = "blake3:e92355d95df8a6c7b4809eaf31b433e4a8e2c54de3ca08ca70f0e00a6542d398"
text = "三月三日为上巳，河水方才回暖，恰是下水行祓除的好时节。因1553年有闰正月，当年的上巳就挪到了四月下旬。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_shangsi","gift_custom"],null]']
src = "blake3:3e5ac556601797ec51fb8689c12a1f3df7e7797a6846a56b55071c78b42cfce0"
text = "一枝待放的桃花，或者几块拌入艾草捣出青色的饼。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tanabata","customs"],null]']
src = "blake3:7fd9f61d7eb20ecaf2e2c44de3476fbac8578e0ad78bbabf1bc33cff1e045580"
text = "庭院里摆好瓜果祭拜星宿，梶叶上写满和歌。人们铺开一匹白绢权当银河，隔绢相对而坐，这叫作流之座；一首和歌沿白绢两边传过去，对面送来的回句一到，正巧对得上，这边的姑娘立刻举起袖子遮住了脸。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tanabata","date_note"],null]']
src = "blake3:e0b87ced64e602581f5ebc6220fc0859dad5cfb43e69abf1c2fc99fb6c9b9860"
text = "七月七日，宫内循往例举行乞巧奠。依宣明历推算，当晚夜空悬着半弯上弦月。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tanabata","gift_custom"],null]']
src = "blake3:67be6cc694879d301c4e51adb2a2fb3d91cda3d0302c0b2fa097ee86b9f77453"
text = "题在梶叶上的一首和歌，几股五色丝线，或者一枚穿好线的针。收礼人道声谢即可，无需立时答复。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tango","customs"],null]']
src = "blake3:82bde002ebb085b5ff1ece93c3f3fed7fd6c2e3e79936f609b67bff3d65b10d5"
text = "门檐下垂挂着菖蒲与艾草，屋里漫着股清苦的草香。学徒把这味道往练习簿里记，这一页写冲鼻，翻过页又改成好似雨后的井边，改来删去，终究还是写不准。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tango","date_note"],null]']
src = "blake3:248c2049108b47eb3719ec3d65ab419b86b9f08d8950c5e4502e13126ad97aa0"
text = "五月初五正值梅雨时节前后，割下菖蒲挂在门檐下最是应时。因1555年适逢闰十月，故而1556年的端午较前一年推迟了十八日。"

[entries.'["upbringing/festivals_japanese.toml",["festivals","festival_jp_tango","gift_custom"],null]']
src = "blake3:2f08d6b3702edf8773ab34c93fe7ddf16a4055c8679d7757a664741745771afa"
text = "一串竹叶包成的粽子，或拿菖蒲与艾草捆成圆球的药玉，缀上五色丝线悬在帘边驱邪。"
