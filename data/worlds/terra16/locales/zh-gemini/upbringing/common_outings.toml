[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_cave","hint"],null]']
src = "blake3:7d8f9abde7f7ef907354b16d929e7ecb25aa756f5fb688ee15f9a5968add8416"
text = "城外山腹间有处浅洞，相传旧时曾有修行者在此闭关。梅雨一过，洞底积了水，石壁上的水痕高过人头；往里迈出几步便一片漆黑，唯闻水滴作响。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_herbs","hint"],null]']
src = "blake3:c29a2e1d5e11843e18db5d63924c6b17b2f4c849a3525e26b57859e2a9477a5f"
text = "寺后药圃栽了一畦当归，沟边却另抽出一株，叶片生得更细。管园的老僧耳背，问及此事，他仅连连摆手：“一家的，一家的。”这株暂且莫动。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_market","hint"],null]']
src = "blake3:26287c382c6422f1eecd9a73281c9454d3667ff65f0dce22c8804b0b1f1d42b8"
text = "入夜后，四条一带的书摊陆续亮起灯火。有摊主抱出一部“渡海来的宋版”，索价高得骇人。邻摊替人抄经的书生瞥见扉页上的朱印，一声未响，只管垂首翻看自己的账册。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_path","hint"],null]']
src = "blake3:38617602dbcd0906830389b9c82e03baafe663c60792f8b07dbd3b25c2e8e53e"
text = "北山参道半路被人横了一根竹竿，说是寺社新立的关卡，每过一趟须交十文。然而参道口卖一服一钱茶的老婆婆，从未说过设有此关。前后皆有香客往来，暂勿独自同他争执。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_relic","hint"],null]']
src = "blake3:c2907c88777956c7d788b9b45c41d1ff3f407146baef18c9fe7c14d97e0605db"
text = "应仁年间遭火焚毁的一座府邸，如今独余庭中石阶与一方斜倾的立石。石面刻有半首和歌，余下几句早已被青苔蚀没。近旁居民相传，那是昔年避难的姬君动身前亲手留下的。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_academy:outing_japanese_academy_shore","hint"],null]']
src = "blake3:7f5bee6b32834df968754973808b4d5c6c4125cd1ae014b796596fe29d645599"
text = "夏汛过后木桥被毁，鸭川浅滩暂且扯起一道渡索，好让渡船拽着来往。绳索擦在块尖石棱上，早磨毛了长长一截。船家口称尚能支撑数日，岸畔捉香鱼的孩童却未必认同。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_cave","hint"],null]']
src = "blake3:8f9df7a55e4cf6101df88a070ec64868388e52dd49de4a145e5125dbb0b70661"
text = "那处石洞唯逢大退潮方显出洞门，四壁水迹漫过人头。里面伸手不见五指，水滴声间夹着阵阵宛若人语的低响。阵阵寒风自内向外涌出——彼端定然另有出口。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_herbs","hint"],null]']
src = "blake3:24d66abf4703fbe8fec115fe844215a8f750b56a4ad0f8f964bebeda12a0632c"
text = "潮退后的沙地松根旁，长出一蓬酷似浜防风的草。偏生它缩在背阴潮湿处，叶背泛白，断茎还透着一股刺鼻异味。且慢动手挖它。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_market","hint"],null]']
src = "blake3:2134c2708666a8877d024f6388f2bd117aca1f9743de5eea816e510bfbfe7d30"
text = "渡口每至入夜方始喧闹。有个外乡人摆摊售卖一块“南海来的沉香”，号称仅削少许便能满室生香。摆渡的老翁斜睨一眼，暗自嘟囔：正经沉香他在寺庙礼佛处见识过一回，并非这般模样。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_path","hint"],null]']
src = "blake3:e112be68422caf97774fca58537536c570d09c89914d49d94771c205c7be6a72"
text = "通往山寺的小道半途立着一尊石地藏，有个汉子蹲守在旁，声称寺中立了新规，凡过往行人皆须缴付香钱。前后俱有赶路者，无人愿出头与他独自纠缠。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_relic","hint"],null]']
src = "blake3:8d23110ff6382b2c8cfbc3d4b8197520262463124c7d1d695b2ab3f5877ec10c"
text = "岬角上的旧烽台早已荒废不举火。石座刻有半行字迹，尚可辨出“火”字与“八月”。村人皆言此处昔年专候海贼船现身便燃起狼烟，然则那几字的语意，却不似在示警。"

[entries.'["upbringing/common_outings.toml",["nodes","map_japanese_home:outing_japanese_home_shore","hint"],null]']
src = "blake3:6c7b68086a5f05f838196bdb04a0a7cddd9781cbe4333e3fcf1ba71edf81a9b3"
text = "沙滩上几条渔船翻扣着船底，船匠正忙着往板缝里填塞槙皮。浅滩边一叶小舟的系绳已磨得仅余数股，群童正为改打何种绳结争执不下——再不拴牢，涨潮便要漂走。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_first","text"],null]']
src = "blake3:7d8f9abde7f7ef907354b16d929e7ecb25aa756f5fb688ee15f9a5968add8416"
text = "城外山腹间有处浅洞，相传旧时曾有修行者在此闭关。梅雨一过，洞底积了水，石壁上的水痕高过人头；往里迈出几步便一片漆黑，唯闻水滴作响。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_revisit","text"],null]']
src = "blake3:bf6bb2f26751afc31e27cd616a24578df3355dae0598062d3eb5b0942a72da46"
text = "这一遭点亮蜂蜡蜡烛，亦可随擅长绘图的同行者入内。洞腹分作两条岔路：左侧愈行愈矮；右首石坎留有一片烟熏乌迹，看模样常有人在彼处掌灯。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_solve","text"],null]']
src = "blake3:f81e141985838abecb945ae294d6b22fde6c36051392cfd75651270f2b1e5e53"
text = "沿右侧岔道行至尽头，现出一眼细泉，岩壁雕着一尊小巧的不动明王，龛前供奉的鲜花犹新。绘好的洞图送还寺中，左道随即便以石块封堵；至于右道，却无人提起封堵之事。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_first","text"],null]']
src = "blake3:c29a2e1d5e11843e18db5d63924c6b17b2f4c849a3525e26b57859e2a9477a5f"
text = "寺后药圃栽了一畦当归，沟边却另抽出一株，叶片生得更细。管园的老僧耳背，问及此事，他仅连连摆手：“一家的，一家的。”这株暂且莫动。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_revisit","text"],null]']
src = "blake3:6d793c0c50f8ad514aa32beb12e914c76106076777856de1ed68bc096e70a2aa"
text = "再访时备上笔盒，或邀熟稔药草的伙伴同行。将叶片、花伞与根茎逐一比对：当归之根乃实心；沟畔那株剖开根茎后，内里竟隔成一格格空腔。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_solve","text"],null]']
src = "blake3:fc2c59709a9e335ad6f9503a4e838f07f9ce91eadab051a06f931c4a786809d9"
text = "原是毒芹。倘若掺入当归送入城中药铺，定会闹出人命。此番老僧听明了缘由，亲手将之连根拔除，又于畦旁立起一道竹签，题字曰：“此沟勿采。”"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_first","text"],null]']
src = "blake3:26287c382c6422f1eecd9a73281c9454d3667ff65f0dce22c8804b0b1f1d42b8"
text = "入夜后，四条一带的书摊陆续亮起灯火。有摊主抱出一部“渡海来的宋版”，索价高得骇人。邻摊替人抄经的书生瞥见扉页上的朱印，一声未响，只管垂首翻看自己的账册。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_revisit","text"],null]']
src = "blake3:8bec98d4dec7c5336c95328cb3f6280e0afaf82b51134d4f087d9acefbfc9d2c"
text = "翌夜重返，袖中暗藏小天平，也可邀口齿伶俐的同行者作陪。宋版纸质轻薄，整叠本该分量较轻；眼前这部却格外压手，用的原是本地楮纸，乃依宋本重刻。同伴与摊主闲话良久，套出这册书竟出自某座曾遭劫掠的公家藏书库。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_solve","text"],null]']
src = "blake3:61d384ea3c148aca2e002a93b7d37099ed373285e9cd5f03775f12b88d502afd"
text = "书生账册果真录有那枚朱印，系上京一户穷得无力修葺屋顶的公家所有。此书终被赎回，摊主未能获利，你倒收到一封字迹清秀的谢帖。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_first","text"],null]']
src = "blake3:38617602dbcd0906830389b9c82e03baafe663c60792f8b07dbd3b25c2e8e53e"
text = "北山参道半路被人横了一根竹竿，说是寺社新立的关卡，每过一趟须交十文。然而参道口卖一服一钱茶的老婆婆，从未说过设有此关。前后皆有香客往来，暂勿独自同他争执。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_revisit","text"],null]']
src = "blake3:281dc849b006659f22fdb1d9149fc5ffb2df6fdbc33b01e1ac5cea843370b7ff"
text = "重登参道时携上牵星板，或约熟谙天象的伙伴同往。待暮色降临初星乍现，测准北辰方位，改道另一条散落人家的沟谷折返城中，顺道将横竿拦路之状告知了茶摊婆婆。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_solve","text"],null]']
src = "blake3:e1b79c44c60fb1605e920e6c2c3d4454019096682f8d3159c3f29aaa98390da6"
text = "婆婆闻言当即破口大骂：原来是山下懒汉，假冒寺里的名号。次日那根竹竿便没了踪影。沟谷里的偏径，连同至哪株老杉处折弯，悉数抄录进了小册。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_first","text"],null]']
src = "blake3:c2907c88777956c7d788b9b45c41d1ff3f407146baef18c9fe7c14d97e0605db"
text = "应仁年间遭火焚毁的一座府邸，如今独余庭中石阶与一方斜倾的立石。石面刻有半首和歌，余下几句早已被青苔蚀没。近旁居民相传，那是昔年避难的姬君动身前亲手留下的。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_revisit","text"],null]']
src = "blake3:3c1e959b44cfec4964e82afff87923737d971033cefb2cd32b5682093f021f9f"
text = "再度造访时怀揣墨匣，也可邀来一位善书的同伴。剔除青苔拓印一份：前半首笔致圆融老到，后半首却出自另一人之手，刀痕既浅且急。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_solve","text"],null]']
src = "blake3:c775cf8b17cdfe6cf6d71601ec70c999b13fa832651c9ef1e6ab572917ab8348"
text = "前半首原出《古今集》旧咏，后半截则是他人续改之辞，改作苦候一名永不归返之人。刻字者究系何人，无从考证。拓本转交予看守庭院的老者，那方石块依旧矗立原地。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_first","text"],null]']
src = "blake3:7f5bee6b32834df968754973808b4d5c6c4125cd1ae014b796596fe29d645599"
text = "夏汛过后木桥被毁，鸭川浅滩暂且扯起一道渡索，好让渡船拽着来往。绳索擦在块尖石棱上，早磨毛了长长一截。船家口称尚能支撑数日，岸畔捉香鱼的孩童却未必认同。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_revisit","text"],null]']
src = "blake3:7c63fb6f65e0b6489a42b1d3c0ad6ddec4ba72cda4169c21110cea1d3cfff48d"
text = "备好缝帆掌皮重回河滩，或请精熟绳结的伙伴协助。将起毛的损段重新编接牢靠，紧挨石棱那面再垫裹几层旧麻布。渡船复行水上，绳索再无吱嘎摩擦之声。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_solve","text"],null]']
src = "blake3:f0fd28e7bb52e3b7a1c90b1d0c490961e8e8dc04848e59ab62df3e0ad8a39756"
text = "船家移开渡索另择方位系稳，自此再磨不着石头。他称日后你过河一概免收渡钱——在京里，这比空口道谢实惠得多。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_first","text"],null]']
src = "blake3:8f9df7a55e4cf6101df88a070ec64868388e52dd49de4a145e5125dbb0b70661"
text = "那处石洞唯逢大退潮方显出洞门，四壁水迹漫过人头。里面伸手不见五指，水滴声间夹着阵阵宛若人语的低响。阵阵寒风自内向外涌出——彼端定然另有出口。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_revisit","text"],null]']
src = "blake3:9df9c0ea91a92098e3208e8b8117e099cfcf8250d027042d2065225e612dff0e"
text = "此行举着蜂蜡蜡烛入洞，也可紧随擅长绘图的伙伴身后。循着烛焰倾折之向摸索前行，辨明一道及腰石坎与坎后分岔；趁潮信未至前，将洞穴图样绘至第二处岔口方止。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_solve","text"],null]']
src = "blake3:1bb6a09420142f864b2e937d6213ec480588232840b9d6808af1e8907f310542"
text = "彼端洞口原隐于松林下方的崖隙间，所谓低语实乃海风穿缝而过。绘就的洞图交予渔村老者，他在洞外竖起木牌警示：涨潮前一个时辰，严禁入内。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_first","text"],null]']
src = "blake3:24d66abf4703fbe8fec115fe844215a8f750b56a4ad0f8f964bebeda12a0632c"
text = "潮退后的沙地松根旁，长出一蓬酷似浜防风的草。偏生它缩在背阴潮湿处，叶背泛白，断茎还透着一股刺鼻异味。且慢动手挖它。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_revisit","text"],null]']
src = "blake3:88c1445ecd81e8db5e236e89ce476d1f58c8fe8ec229b85631abf1e329b06e7a"
text = "次日重临，携妥笔盒，或邀熟知药性的同伴共往。将叶、茎、根逐一对照，差别立时分明：真品浜防风唯见于向阳沙砾之上，根部呈黄白色且绵长。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_solve","text"],null]']
src = "blake3:bd2d4b48a3b3291f1aa204f4587c501a81ec3861ab239d1cc84713de50b6ad2f"
text = "向阳沙地那簇方是浜防风，取根煎汤能发汗祛风寒；至于背阴那丛，连海边放养的牛都绕道走。那两张画页，后来收进了村里药婆的药方堆中。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_first","text"],null]']
src = "blake3:2134c2708666a8877d024f6388f2bd117aca1f9743de5eea816e510bfbfe7d30"
text = "渡口每至入夜方始喧闹。有个外乡人摆摊售卖一块“南海来的沉香”，号称仅削少许便能满室生香。摆渡的老翁斜睨一眼，暗自嘟囔：正经沉香他在寺庙礼佛处见识过一回，并非这般模样。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_revisit","text"],null]']
src = "blake3:1ab373f8e348466871fe46669aa884ad78a6dc3fb0a1b0b3bf0bc356e3df0d1c"
text = "次夜再往，身畔藏妥小天平，也可邀精于讨价的伙伴同去。真沉香油重木密，入水必沉；此块与等大松木同置天平两端，竟几乎持平，投入水桶亦漂浮打旋。追问数声，外乡人自行漏了口风：乃松木浸油充数。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_solve","text"],null]']
src = "blake3:4e45841d09efafbe88cdacfcf460bae21d3790f0681931b9e90787bfcd5ef019"
text = "老翁将那截木料钉上渡口木柱，下方题字一行：“南海来的沉香，会浮。”外乡人连夜赶乘末班渡船溜走，全渡口拿这事笑谈了好几日。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_first","text"],null]']
src = "blake3:e112be68422caf97774fca58537536c570d09c89914d49d94771c205c7be6a72"
text = "通往山寺的小道半途立着一尊石地藏，有个汉子蹲守在旁，声称寺中立了新规，凡过往行人皆须缴付香钱。前后俱有赶路者，无人愿出头与他独自纠缠。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_revisit","text"],null]']
src = "blake3:20d43316c4b44d73f4cd575e1a5b1e090ad978e4f469a983124540151a15a140"
text = "再行此道时，携上牵星板，或约熟谙潮汐的伙伴同行。测算月轮距海平尚余几指，推得今夜落潮时辰——潮水退尽，寺后海崖底自会露出一条小径，可避开地藏而行。返村之后，便将此情告知了寺中僧人。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_solve","text"],null]']
src = "blake3:066952117ce27f42bfb04a9256fb0e1a15fe1478500666d58d80b4a477dc996e"
text = "僧人闻言失笑：本寺素无收过路钱之规。翌日，地藏身侧便竖起一方木牌。那条唯逢退潮方现的崖底小径，连带何时可通、何时须避，悉数录进了小册。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_first","text"],null]']
src = "blake3:8d23110ff6382b2c8cfbc3d4b8197520262463124c7d1d695b2ab3f5877ec10c"
text = "岬角上的旧烽台早已荒废不举火。石座刻有半行字迹，尚可辨出“火”字与“八月”。村人皆言此处昔年专候海贼船现身便燃起狼烟，然则那几字的语意，却不似在示警。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_revisit","text"],null]']
src = "blake3:baa0fdbab73c0d600e6bc22bb4c4fd5b780604838655e1af3cda95b79b2d0571"
text = "重上岬角时，怀中揣好墨匣，或邀一位善书的同伴同往。拂去表面盐霜，沾水拓印一幅，刻痕深浅顿时清晰：深处乃昔年旧刻，浅浮那几笔，原是日后孩童持石子胡乱划下的。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_solve","text"],null]']
src = "blake3:84b23292aaf1e541349637b4a9490ec8252c10557985cdee64c46af6082efbd5"
text = "拼全的一句实为“为海上不归之人燃此火”。原非示警用的烽烟，而是专为未归船只长明的引灯。那年盂兰盆，村里复有人高举火把登上了岬角。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_first","text"],null]']
src = "blake3:6c7b68086a5f05f838196bdb04a0a7cddd9781cbe4333e3fcf1ba71edf81a9b3"
text = "沙滩上几条渔船翻扣着船底，船匠正忙着往板缝里填塞槙皮。浅滩边一叶小舟的系绳已磨得仅余数股，群童正为改打何种绳结争执不下——再不拴牢，涨潮便要漂走。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_revisit","text"],null]']
src = "blake3:cd3ec666e5f922fd84714da190c97a95956ee4823471663244c54e05756e4692"
text = "次日携着缝帆掌皮折返，亦可呼唤精于索具的伙伴同行。剪去受损一截，将两端绳股逐根编接复原，外层再严实裹上一道旧麻布防护。方才争吵的群童停了嘴，纷纷蹲在一旁细看。"

[entries.'["upbringing/common_outings.toml",["outing_steps","map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_solve","text"],null]']
src = "blake3:958b048a6f6a338b31bb48e9c08d764deaf3c2f22e0ebb16bf611ec05f8f33c6"
text = "趁着潮水未涨，众人合力将小舟拖上沙滩，系稳在老松树上。船主归来摩挲着那段接头，探问出自谁人所授，不等你应声，已转身拿来一串晒好的鲣鱼干。"
