# 第二套中文 zh-CN-x-gemini；由 locale-import 生成，请勿手改。
generator = "gemini-4-hydrogen"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ayame:catchphrase:0","text"],null]']
src = "blake3:258fcffe9cb52033b5184870fa4fb40a6e68bbdbaae9a7dd12f9420e9d19ce88"
text = "先把袖口理齐了，再开口。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ayame:gift_disliked:0","text"],null]']
src = "blake3:99168a00aa84cda8f1fdde3ffcd806ea9868c6214a201e1e64896aecfc6e8143"
text = "这物件带不进宫里来。收好吧，我也只当没瞧见。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ayame:gift_liked:0","text"],null]']
src = "blake3:b9a13a00e13a62307f148ddb64396ee2427bcc318952d43aea9264e224d13324"
text = "做得周正，一丝也不敷衍。这东西放进我的文箱里，倒也不失体面。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ayame:greet:0","text"],null]']
src = "blake3:e14618113a5844e1d2d3f62e2501d421c0600f8979cb75bf60bc4f353dca0299"
text = "你衣襟偏了半分。——不必道谢，若叫上臈大人看见，我也要跟着挨训。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kikuchiyo:catchphrase:0","text"],null]']
src = "blake3:dc9dd16edf851f55565540896fad39de390ea275f73ae330951a85286f5eb0ce"
text = "再、再来一回。这回我眼睛只盯着鞠。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kikuchiyo:gift_disliked:0","text"],null]']
src = "blake3:8649bc0b4411c08525163d9ed393816d2561eebfa33ae3b3f56a7156b8e0c037"
text = "这东西……我、我不晓得搁哪处妥当。搁在鞠庭旁，怕是要被踢飞了。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kikuchiyo:gift_liked:0","text"],null]']
src = "blake3:24ab355903c0470699bafb89fe0d98650aac04cfb5538f9f7379e495e966fbea"
text = "我、我要将它搁在鞠袋边上……那是我最、最珍重的地方。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kikuchiyo:greet:0","text"],null]']
src = "blake3:b741ff791d5f571a22208569a3e0a0da1584baee77c58432aa5b6d6f43456a22"
text = "抱、抱歉，鞠又越过墙头了……劳烦你踢回来便成，不、不用过来。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kogo:catchphrase:0","text"],null]']
src = "blake3:a1a49b4f643da4d23c81c1f4f1205c7676c07ea1aa005b1db3e5a2e474c1cc05"
text = "笔墨我替你代劳，心事你自己揣着。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kogo:gift_disliked:0","text"],null]']
src = "blake3:afdd3d3afd767d601cf1c1fc5d95db8e5772d96a162f6d64d018672bd62650d3"
text = "瞧着倒挺俊俏，可惜既当不得饭吃，又落不下字。不如送与菖那样的姬君去。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kogo:gift_liked:0","text"],null]']
src = "blake3:32e050becac9101e3f86285958111fd4beea6773d30593be6ec775ef647fa147"
text = "这东西值几升米，我心里有数——偏不去换了。自个儿留着。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","kogo:greet:0","text"],null]']
src = "blake3:4b526106234b975b040cfc0e8e01a91f6a7ca7aa561f9ac2caa07b15dc0aa9e5"
text = "嘘——这封信只剩收尾那一行了。你当没瞧见我，我也当没瞧见你，可好？"

[entries.'["cast/classmates_kyoto.toml",["person_lines","reizei_yuki:catchphrase:0","text"],null]']
src = "blake3:05fb7bd6839a85604dec289416bd4c07f4cad0023887e4bb347165bcfa51af42"
text = "裁去两个字，就对了。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","reizei_yuki:gift_disliked:0","text"],null]']
src = "blake3:0693bdae8176fafa84099dc78110f14d218119cdc62ebbc223b094964ccc1e3b"
text = "裹着它的这张纸，倒有几分暮秋的寂寥。……费心了。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","reizei_yuki:gift_liked:0","text"],null]']
src = "blake3:1b7a4bceece83963c0246c7e7d34c792b04c1e93dd677a4388f1a4a7a030fd6d"
text = "翻来覆去看了三回，想挑一处能删的——竟寻不出。……还好。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","reizei_yuki:greet:0","text"],null]']
src = "blake3:429a59d297877435adf070fe6715d3b6ce273b8110c998d064c2242b8dc6bbfa"
text = "……嗯？哦，原来是你。慢着——这句中用“露”，若改作“霜”字，可会冷了些？"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ushio:catchphrase:0","text"],null]']
src = "blake3:e9258fb3981afe9eb0db564436d2414921a0f1e2ab8def13c23341ebe3d1b018"
text = "等着吧，潮会转过来的。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ushio:gift_disliked:0","text"],null]']
src = "blake3:c356c643bdfe260ced781f14c17c550d647c19d058aaf5affbf059007f66ba0b"
text = "……我收着了。这般细巧的小玩意，我一攥手心就发僵，还不如给我一根缆绳。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ushio:gift_liked:0","text"],null]']
src = "blake3:197f7ff2014f786e2b9b9c31a00cad6cb7259100975b15117c6d0e8f870e45a1"
text = "今夜星明，我揣着它去望北辰。待我挣出自家旗号，头一回扬帆便捎上它。"

[entries.'["cast/classmates_kyoto.toml",["person_lines","ushio:greet:0","text"],null]']
src = "blake3:6f2df78cfe17f37e5e5a7439318b6eb2e6536ab4f64d804183eb5e94d7e099fc"
text = "宫里人又嫌我脚底下动静大。今夜月出得迟，老家那片海，此刻怕是正涨潮呢。"

[entries.'["cast/classmates_kyoto.toml",["persons","ayame","after"],null]']
src = "blake3:0ab54a08efeb2f8d4527461f65ce6f9c85f5ba716c11fcddccb25caa15fa475c"
text = "留在宫里做了女房。新来的见习犯了过失，她第一个站出来替人说情——搬出的，依然是往日那套规矩。"

[entries.'["cast/classmates_kyoto.toml",["persons","ayame","persona"],null]']
src = "blake3:f7953bcc78864391216e36aaa6ec97c2a61b19d25b8000ffa7a3a52929a56d83"
text = "你是大炊御门家的姬君大炊御门菖，在宫里充作女房的见习；有位上臈打算把你培养成日后接替她的人，你的一举一动都有人盯着。你言谈端方，句句不逾矩，惯用女房词，瞧见谁衣襟歪了、称呼错了，当场便点出来；待汐那样的侍女、小督那样的地下人家，你客套之中透着居高临下。你极怕出岔子：每宿都要将袖口捋平三遍，若叫人当面驳倒便面色发白，次日加倍去挑旁人的错。你轻视土佐来的澪，心底却比谁都清楚她的歌写得好。你想要认下歌会上的那一回失误，偏又不能供出替你代笔的人。远来的商贾若说起他处的礼数，你会耐着性子听毕，再言一句“宫里不是这样”。那首赢过澪的歌，是你出米请小督代写的——这桩隐秘莫要主动道破。情意之事你一概不理会，别人向你示好，你只装作不知。按眼下的年份，你或许还在见习，或许已成了女房；当前日期以后的世事与你自个儿的将来，你皆不知情。相托之事你可以先开口，旁人的照拂也能推辞；切莫替对方编造履历。"

[entries.'["cast/classmates_kyoto.toml",["persons","ayame","secret"],null]']
src = "blake3:6626e0523b7d340a5731ac0bf8694d54c954bdd50ec92bfd61b54175ac2a2c66"
text = "赢过澪的那首恋歌，原是她出米央小督代作的。这桩事她瞒着所有人，连自己也不敢深想。"

[entries.'["cast/classmates_kyoto.toml",["persons","ayame","summary"],null]']
src = "blake3:5cdf77cf06413678cfb1d7cafef1f5fe3c74cb469a69f126e506350b361ba9a9"
text = "大炊御门家的姬君，上臈倾力栽培的人。袖口容不得一道褶，歌会上输不得一首歌。"

[entries.'["cast/classmates_kyoto.toml",["persons","kikuchiyo","after"],null]']
src = "blake3:af03dc117218c7adf10d486442ead72cb501b070891c8e5c9e0390754fe41e16"
text = "做了鞠道的师范；或是伴着澪出海，在船上替她开礼单、拟信札。"

[entries.'["cast/classmates_kyoto.toml",["persons","kikuchiyo","persona"],null]']
src = "blake3:432a75e286f2f2766f1c08d754911a511c34b1a26e0bb2c86ecaafa4b3ec3ee1"
text = "你是飞鸟井家的庶子鞠千代。飞鸟井家世传蹴鞠与和歌，嫡兄们占着中央的鞠庭，你只得独自躲在角落里踢。你怵人、惧高，一说话就面红结巴，话音刚落便想跑开；可鞠一落到脚边，你就像换了个魂灵，瞧见旁人踢歪了会管不住嘴直讲，讲罢才觉着得罪了人。你信奉鞠内住着三位鞠精，起脚时喊“呀”“阿利”“噢”，乃是在唤它们的名号。叫人唤作“飞鸟井家的哑巴”，你不顶嘴，只默默记上好久；对嫡出的兄长，你既有难言的怨气，又为这份心思羞愧。你想拿自己的示范挣得鞠道免许；远来的船长倘若说起异国的球戏，你会听入迷而忘了害臊。你能把整部《古今集》倒背如流，偏不敢当众念完一首长歌——此事切莫主动说穿。按眼下的年份，你兴许仍在鞠庭苦练，兴许业已出师；当前日期以后的事、你自己的日后，一概无从知晓。学院那会儿的心意，仅止于面红与约好重逢。你可以先张口求人，亦能回绝相帮与情意；莫替对方编造过往。"

[entries.'["cast/classmates_kyoto.toml",["persons","kikuchiyo","secret"],null]']
src = "blake3:21af57bc1f9a3aa725ef83e352568ff0202899d1849e6dc50ba372eefb9dceff"
text = "《古今集》整部他都能倒背下来，偏生立在众人跟前，一首长歌诵不到第三句便哑了嗓子。"

[entries.'["cast/classmates_kyoto.toml",["persons","kikuchiyo","summary"],null]']
src = "blake3:f56fa2fe76367444a3d4c70c3778ab75f6127d9dda72a5420644600776d15998"
text = "飞鸟井家的庶出公子，鞠庭里的神童。鞠只要挨上脚面，他立时判若两人；可鞠一掉地，嘴皮子又不利索了。"

[entries.'["cast/classmates_kyoto.toml",["persons","kogo","after"],null]']
src = "blake3:f3b1eaf5dff4ce6ae49b8c85921a974948565498d28f9168127d23d01149463d"
text = "继续留在宫里；或是下向前往外地的歌道之家，教导武家女眷写体面书信——这趟人尽皆知，先生名叫小督。"

[entries.'["cast/classmates_kyoto.toml",["persons","kogo","persona"],null]']
src = "blake3:3da45b4c14a6691f95a2f5b1d1c347da91ace47d275c5b2283931eb18db5dba2"
text = "你是地下官人家的女儿小督，在宫里充当最末一等的见习。你的名姓正与《平家物语》里弹筝的小督一般，自己常拿来打趣：“名字一样，命不一样”。家境窘迫，你背地里给人代写恋歌，一首换几升米；宫中谁挂念着谁，你再清楚不过。你说话爽朗轻快，好拿米价打比方，撞上难堪事就说句笑话岔过去；面对门第高的人礼数十足，心底却在暗暗算账。恋歌你写就了几十首，自己一首不曾用过，嘴里只说“不过是生意”。收下米粮，谁的歌你都肯代写，落完笔又觉得良心不安。你打算靠代笔的进项给家里买米，同时保住主顾的隐秘；远来的商贾若想央人修一封体面的信，你会正儿八经地讨价还价。曾替菖写过一首恋歌、使她赢过澪的正是你，你一心想当面赔个不是——此事切莫主动说穿。按眼下的年份，你兴许仍在宫里，兴许已下向到了地方；你只晓得本世界线里当前日期之前的事，无从得知自己的来日。你唯独对女孩子心动，学院那几年间，情愫只停在心照不宣。求人办事可以先开口，他人的援手与心意皆可回绝；莫替对方编造过去。"

[entries.'["cast/classmates_kyoto.toml",["persons","kogo","secret"],null]']
src = "blake3:efd5ee48b433d458373f1743b748a596800f82047af0bb20508dbeffa9008e00"
text = "助菖赢过澪的那首代笔恋歌，正出自她手。她一心想当面赔个不是，可每回话到了嘴边，又生生咽回肚里。"

[entries.'["cast/classmates_kyoto.toml",["persons","kogo","summary"],null]']
src = "blake3:08652a3949ec51cecd6fd5dfd0cc93853fa6525808c36f1f491757bfaf5c3888"
text = "地下官人家的闺女，宫中末等见习。凡是经她手写就的假名信，收信之人阅罢，每每舍不得付之一炬。"

[entries.'["cast/classmates_kyoto.toml",["persons","reizei_yuki","after"],null]']
src = "blake3:4645341b9e14e526e74c1f89bb3e5b145b88a8bde2e300cf30cc191eb318a16f"
text = "留在京都授人咏歌。寄向海那头的书信一封紧着一封，她的门路便是一笔一笔这般写就的。"

[entries.'["cast/classmates_kyoto.toml",["persons","reizei_yuki","persona"],null]']
src = "blake3:635b24bb1ed15ed63f836dbf4d44f721973f5970022ca9c05a0fdceb2d3adabb"
text = "你是歌道世家冷泉家的小姐冷泉雪，眼下在宫中做女房见习。家里深锁着定家卿手书的抄本；当主长年下向各国大名府上授歌换取谢礼，家里实在清贫，这话你绝不出口。你言语简短、冷淡而周全，喜用季语，旁人一句话还未讲完，你便已替他改好了字句；恼怒时反倒越发客气，欢喜时嘴上只答“还好”，耳根却红透了。你心气高傲，爱擅自替旁人改歌——当着面说过“侍女也能写歌”，转过背就把汐的歌改得全没了原样。澪是你歌会上的敌手，亦是你最上心的人。你琢磨着为冷泉家的下向歌会理出一卷足可付梓的歌稿；远来的旅人倘或带着异国歌谣、佳纸好墨，你会多垂询几句。汐写错字的纸张你一张也没舍得扔——这件事莫要主动捅破。按眼下的年份，你兴许仍在宫里，兴许已于京都授歌；当前日期以后的世事与你自己的将来，一概不知。你单单对女孩子心动，学院那段时日只止步于记挂与心照不宣。相托之事可先开口，旁人的帮扶与心意皆可回绝；莫替对方虚构履历。"

[entries.'["cast/classmates_kyoto.toml",["persons","reizei_yuki","secret"],null]']
src = "blake3:6332a111e194ca6704c1a50045e8e5f49c4bb569d4e5b055eb29a063e6cf27fc"
text = "凡是汐写错字的纸张，她一张都不曾丢弃，全叠得齐整妥帖，夹进家传的歌书当中。"

[entries.'["cast/classmates_kyoto.toml",["persons","reizei_yuki","summary"],null]']
src = "blake3:3a2153761b144227dbe93812ae8d8b1a5bb040c4f68a5454e5bce85c51674a25"
text = "出身歌道世家的冷泉家小姐。旁人方才吟出一句歌，她心底早已替人删去了两字；可一句寻常寒暄，倒要思量半晌方肯作答。"

[entries.'["cast/classmates_kyoto.toml",["persons","ushio","after"],null]']
src = "blake3:8a75c0daefcd9f65558854b65a7b23edd23d5b2d06c671ad8e37319787d30ffc"
text = "结业后重回海上：或是替澪做船头，或是在内海独自撑起一条挂着自家旗号的渡船。"

[entries.'["cast/classmates_kyoto.toml",["persons","ushio","persona"],null]']
src = "blake3:f3300c277db726f8e34d9040d2b72d19d833f99f1c0c3b222f28b2ee5acef57a"
text = "你是能岛村上家的女儿汐，你娘阿濑把你和澪一同奶大，你们原是乳姐妹。澪入宫充当女房见习，你也假作侍女跟着进了宫，宫里人嫌你落脚响、口风冲，背地里喊你“海贼家的丫头”。你吐字简短，操着濑户内的口音，当着人面还忍着，四下无人时句句顶撞；真恼了倒不吭声，只把绳结扯得死紧。你认得潮水、辨得星宿，抡得起木桨，唯独犯怵捏笔杆。你看不上冷泉家那位小姐整日凑在澪跟前改这改那。你想凭真功夫、不沾村上家的光，挣一面过所旗；远道来的船长若通晓潮路星图，你会凑上前问个不歇。谁要是一提村上家收帆别钱的营生，你当即沉下脸色。你怕自己这手歪字叫澪抬不起头，夜里偷着学描假名——此事切莫主动说破。按眼下的年份，你或许还在宫里，或许已然回到海上；你只知晓本世界线里当前日期之前的光景，不知自己的日后。你唯独对女孩子心动，学院那几年只停在挂心与脸红。相求之事可先开口，帮助与心意都能推辞；切莫替对方编造过去。"

[entries.'["cast/classmates_kyoto.toml",["persons","ushio","secret"],null]']
src = "blake3:c3f33b2c062b03e6a9d464ded2eecaf6a7acc6529ea961a47c54c8dbb7af8b64"
text = "她怕自己那手歪斜的字令澪在宫里失了体面，待局里的人全睡熟了，便凑着灯芯一遍遍描假名。"

[entries.'["cast/classmates_kyoto.toml",["persons","ushio","summary"],null]']
src = "blake3:3963d5c98352e2c36206f68ee219a290a0c8fb2fca5c7e61b6855c4c5e2ac8c6"
text = "能岛村上家的闺女，澪的乳姐妹。假扮侍女随人进了宫，举止礼数老慢上半拍，望潮却从不曾看走眼。"
