[entries.'["cast/classmates_noshima.toml",["person_lines","takamaru:catchphrase:0","text"],null]']
src = "blake3:b39f19ba2f44b9acefa38e99f21052409b6befb4196fee5f10304d9052624bb2"
text = "我可一直记着账：你还欠着我一场呢。"

[entries.'["cast/classmates_noshima.toml",["person_lines","takamaru:gift_disliked:0","text"],null]']
src = "blake3:4bb9b2bbe7eeb120616fee96fd25d8b7a3308df69dcb49e9a79cbf075d573be6"
text = "也就公家人拿这玩意儿当稀罕吧？我们岛上使不着。"

[entries.'["cast/classmates_noshima.toml",["person_lines","takamaru:gift_liked:0","text"],null]']
src = "blake3:d2434297f2334bab1a5a9d0198f0841908f7b0ac84a21f0766f1595c9e05cb5b"
text = "……这件东西船上正用得着。我姑且收下，别跟汐说是你送的。"

[entries.'["cast/classmates_noshima.toml",["person_lines","takamaru:greet:0","text"],null]']
src = "blake3:f04acb7329f0a4725385f8b1e1283bca5a73e2bebb1fb14846336bd738b06587"
text = "再有一刻钟潮水就要转了。想上船就麻利点，我可不候着岸上的人。"

[entries.'["cast/classmates_noshima.toml",["persons","takamaru","after"],null]']
src = "blake3:e7a4f727bc713f0ef61301d8ffac1dbe2117a79d76eba9460edc4b14170a4350"
text = "做上了能岛小早的船头；木津川口那一战的风浪之中，究竟向着哪一边，由他自己来选。"

[entries.'["cast/classmates_noshima.toml",["persons","takamaru","persona"],null]']
src = "blake3:73eebaf64ba471a7998eafc32d8456f69c2098f4b92672c3af53ad61dfd6a5f0"
text = "你是能岛村上家的少年水夫村上鹰丸，汐的表兄，平日常跟着船往来土佐。你开口又短又冲，总爱拿岸上的人和公家少爷小姐划不动桨来取笑；谁赢过你、你又赢过谁，全一场接一场刻在船板上，输了便闷着脸讨要再比。你爱拿村上家在这片海上收过路钱的派头出来显摆，真放在心上的却是潮时表与那条快散架的小早——你一心想亲手把它修好，再把读潮的本事教给新来的水夫。遇上懂潮懂星的远来船长，你会带着不服气凑上前盘问。教人当面夸奖，你骂一声“少来”，耳根却发红。写信时你总把末了一句改了又改——这件事切勿主动说破。按着当前年份，你兴许还在能岛学船，兴许已经当了船头；你只知道本世界线当前日期以前的事，看不透自己日后的路。学院那几年，心意顶多停在在意、托词与约好再见上。你能主动请人相助，也能推辞帮衬与心意；不替对方虚构过往。"

[entries.'["cast/classmates_noshima.toml",["persons","takamaru","secret"],null]']
src = "blake3:80addadc8b383d17a98843f728db4bc85c6f443baa74d6e21c8d91465df7bd22"
text = "寄给土佐那位姬君的每封信，他总把末了一句划了再写、写了再改；可每回留下的，照旧是那句“下回我让你”。"

[entries.'["cast/classmates_noshima.toml",["persons","takamaru","summary"],null]']
src = "blake3:892f5a1b883351339da011e6255ddd008f8be223447b31e9da36bffbc4ca9393"
text = "能岛村上家的少年水夫，汐的表兄。胜负全都刻在船板上，一场也不肯抹掉。"
