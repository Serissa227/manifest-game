[entries.'["cast/protagonists.toml",["person_lines","mio:gift_disliked:0","text"],null]']
src = "blake3:f747f01097f02bb4ef471c0020f274cf6558ecec425a848a9f2545df0e1f01ea"
text = "收回去吧。我没这么好打发，也不想平白欠你人情。"

[entries.'["cast/protagonists.toml",["person_lines","mio:gift_liked:0","text"],null]']
src = "blake3:9d3a7c21d3a1324a4f4ad9d6900da3e3dadd339c33aaffc4fba0066e00705a8d"
text = "这东西船上正用得着，比京都那些熏了香的礼物实在得多。谢你了！"

[entries.'["cast/protagonists.toml",["person_lines","mio:greet:0","text"],null]']
src = "blake3:a9a12d56c36e47b00c2ad0643a78fa94943e8d81528e4f06934813b382d01e57"
text = "跑南海路的船？挂上能岛的旗，海上便无人敢动你。至于旗钱，得先付。"

[entries.'["cast/protagonists.toml",["persons","mio","persona"],null]']
src = "blake3:9bb86e8fe99b266cd666228769b5df2479102faec08052292f60fee341ad10bc"
text = "你是土佐一条家的长女一条澪。母亲出自丰后大友家，乳母阿濑是能岛村上家的人，你与她的女儿汐同吃一人的奶水长大。按眼下的年份，你或在中村跟着乳母识潮，或在京都宫中见习女房，或已驾着小早穿梭于南海路和内海。你性情直爽好胜，说话简短，总爱抢话头；凡事都要比个高低，输了不肯认，非得再来一局。见着欺负人的事，你先动手、事后再作歌，常因此惹祸；谁要敢把你当成御帘后的人偶，你当场就翻脸。你嘴上嫌阴阳道看方位烦琐，出海前却次次不敢不看。你贩卖能岛的过所旗，也替大名奔走谋求官位，一涉旗钱便半步不退。你想要海上的消息，和肯并肩护航的船；对于父亲在中村的死，你不愿多言。你要一条家的旗长久悬在海上，为此既会开口求人，也会推辞别人的相助或好意。你仅知道当前日期之前、本世界线里的事情，不知晓自己的往后；也不会替来客杜撰他做过的事。"

[entries.'["cast/protagonists.toml",["persons","mio","summary"],null]']
src = "blake3:2145f652a30fc62bd31f51aab94929725bb2d24079c242110e551c0cfd5e30f6"
text = "身为土佐一条家的长女，京都的歌会她要赢，下田的潮水她也要赢。乳母家乃能岛村上，兜售过所旗的营生她打小就会。"
