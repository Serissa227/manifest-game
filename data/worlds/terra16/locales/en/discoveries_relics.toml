# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.mark_sacro_catino]
name = "Record of the Sacro Catino"
lore = "The Genoese say this six-sided green dish was carved from a single emerald and held the Last Supper. Since 1327 it may not be pawned or carried a step outside the sacristy. Anyone who wants to draw it must first win over the cathedral chapter."

[discoveries.mark_solomon_table]
name = "Traces of Solomon's Table"
lore = "Legend says Solomon’s Table once lay hidden in the Cave of Hercules beneath Toledo. In 1546 the archbishop sent men down. All they would agree on when they came back up was that there were marks cut into the rock, and soon afterward the entrance was sealed again."

[discoveries.mark_montezuma_emeralds]
name = "Record of the Five Emeralds"
lore = "Gómara’s new book describes the five emeralds: a rose, a horn, a fish with golden eyes, a little bell with a pearl for its clapper, and a cup on a golden foot. Since the storm off Algiers in 1541, they have lain somewhere on this seabed."

[discoveries.mark_tide_jewels]
name = "Record of the Tide Jewels"
lore = "Off Shimonoseki lie two small islands, one holding the jewel that raises the tide and the other the jewel that lowers it, gifts of the sea god. They belong to the sacred precinct of Imi Shrine and no one may set foot on them. You may only follow the festival boats and pay your respects from the water."

[discoveries.mark_imperial_seal]
name = "Impression of the Imperial Seal"
lore = "Since Ligdan Khan’s death, the Chakhar court still keeps a jade seal handed down from the Yuan. The herders say a goat that would not graze for three days pawed it out of the ground. Everyone calls it the heirloom seal of the Qin. If you are granted an impression, count the characters: the Qin seal had eight."

[discoveries.mark_solomon_seal]
name = "Combined Record of Solomon's Seal"
lore = "The drawing of the fisherman’s lead seal and the line over the gate at Great Zimbabwe that even learned Moors cannot read are each a riddle on their own. Laid side by side, the strokes join up. They say this is the ring by which Solomon commanded the jinn."

[discoveries.mark_emerald_buddha]
name = "Reverent Record of the Emerald Buddha"
lore = "In 1434 lightning struck a stupa at Chiang Rai, the plaster fell away, and this green Buddha was revealed inside. It now sits at Luang Prabang, and after 1564 it goes with the king to Vientiane. Only with the sangha’s consent may you sit before it and draw it."

[discoveries.relic_marinus_chart]
name = "Clue to a Marinus Chart Fragment"
lore = "Marinus of Tyre once drew the whole world. The original is long lost and survives only as a name in Ptolemy’s pages. Ask around in his home city and you may learn whose hands the surviving leaves have passed into."

[discoveries.relic_corvo_fragments]
name = "Account of Corvo Statue Fragments"
lore = "The story goes that the king’s men took the horseman apart and shipped home only the head, the right arm and the horse’s head, which went into the royal wardrobe. Where the pieces went after that, nobody at court can say. On the island, people still remember which way the arm was pointing."

[discoveries.relic_soapstone_birds]
name = "Observation of the Soapstone Birds"
lore = "Inside the hilltop enclosure, birds carved from soapstone perch on top of stone pillars. Their feet end not in talons but in five toes, like a person’s. The elders who keep them say they watch over this land for the ancestors, and you may go closer only when the elders allow it."

[discoveries.relic_pharos_blocks]
name = "Drawing of Pharos Masonry"
lore = "Dive at the foot of the fortress and you find a granite block still cut with sockets for iron clamps, and another carved with half a fold of drapery. Draw them one by one and fit them together against Strabo’s description. Whether they add up to a lighthouse is a matter of patience."

[discoveries.record_bottle_seal]
name = "Drawing of a Bottle's Lead Seal"
lore = "An old fisherman of Julfar says his father’s net once dragged up a copper bottle with Solomon’s seal pressed into the lead. His father never dared open it and threw it back, though not before copying the seal. The fisherman has also heard that a line of writing in a stone city far to the south is its other half."

