# Divers compare the newly printed shapes; the offshore clue area is uncertain and yields only a drawing.
# The court's position is provisional; L17 grants an impression, never possession or proof of the ancient seal's identity.
# Compare the bottle seal drawing with the stone inscription; joining the traditions is an explicit game extension.
