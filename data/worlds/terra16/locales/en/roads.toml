# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[roads.road_seville_toledo]
lore = "North from Seville the road climbs the Sierra Morena, olive groves thinning to scrub. Past the pass, water costs more than wine."
via = ["Sierra Morena pass"]

[roads.road_antwerp_augsburg]
lore = "At the Rhine crossing near Cologne, ferrymen charge by the head, and the line of wagons runs from dawn to dusk."
via = ["Cologne", "Rhine crossing"]

[roads.road_venice_augsburg]
lore = "The snow line on the Brenner moves every year. Spring melt washes out the cliff path, and one autumn storm can seal the pass."
via = ["Brenner Pass"]

[roads.road_augsburg_nuremberg]
lore = "The mills at Donauwörth run day and night, loading grain and blades onto carts bound north."
via = ["Donauworth"]

[roads.road_nuremberg_prague]
lore = "Old drivers call the road Charles IV built the Golden Road. When winter shuts the pass, only the couriers’ horses stay in the stables."
via = ["Bohemian mountain pass"]

[roads.road_danzig_krakow]
lore = "Salt from Wieliczka drifts down the Vistula to Danzig beside grain barges and timber rafts. The merchants follow the water."
via = ["Vistula trade route"]

[roads.road_narva_moscow]
lore = "Past Narva the road turns east into the conifer forest. At the Novgorod market, furs always arrive before the silver."
via = ["Novgorod"]

[roads.road_varna_targoviste]
lore = "Past the Ruse crossing, Danube boatmen set their days by the flood. Miss one and you wait on the bank for half a month."
via = ["Ruse crossing"]

[roads.road_alexandria_cairo]
lore = "The Delta’s channels crisscross like a net. Boatmen call out which branch will carry a loaded barge through."
via = ["Nile Delta"]

[roads.road_cairo_suez]
lore = "Pack trains travel by night and rest by the wells. Waterskins slap against the camels’ flanks, and their bells carry for miles."
via = ["Desert pack route"]

[roads.road_beirut_aleppo]
lore = "Below the walls of Homs, oil sellers and silk dealers crowd one lane, and their haggling drowns out the camel bells."
via = ["Homs"]

[roads.road_aleppo_baghdad]
lore = "Heading south along the Euphrates, the wells at Rahba taste of salt and bitterness. Fill every goatskin before you leave them behind."
via = ["Euphrates valley", "Rahba"]

[roads.road_baghdad_basra]
lore = "The pack road between the two rivers runs through reed beds where buffalo wade. Fishermen paddle their baskets straight to the inn doors."
via = ["Mesopotamian riverside pack route"]

[roads.road_hormuz_port_isfahan]
lore = "Cargo is transferred across to the mainland and climbs past Lar and Shiraz toward the plateau. The packs hold silk, and silver too."
via = ["Transfer to the mainland", "Lar", "Shiraz"]

[roads.road_fez_timbuktu]
lore = "Sijilmasa is the last walled town on the southern road. Beyond it, salt is stacked like stone houses, and caravans carry months of water."
via = ["Sijilmasa", "Taghaza", "Walata"]

[roads.road_sofala_great_zimbabwe_city]
lore = "The Manica highlands are wet, and the trails are slick as oiled leather. Porters wrap the gold dust in cloth and stop every few steps."
via = ["Manica highlands"]

[roads.road_khambhat_agra]
lore = "Khambhat cloth goes to Ahmedabad for dyeing, then rides north with Rajasthan’s camel trains. At night the inns echo with men counting."
via = ["Ahmedabad", "Rajasthan trade route"]

[roads.road_bhatkal_vijayanagara_city]
lore = "Pepper climbs from Bhatkal over the Western Ghats. By the time the porters reach the pass, their shirts still smell of it."
via = ["Western Ghats pass"]

[roads.road_ayutthaya_port_chiang_mai]
lore = "Boats go upriver to Phitsanulok, then the road climbs through the hills to Chiang Mai. Hill people bring honey in bamboo tubes to trade for salt and iron."
via = ["Phitsanulok", "Mountain pass"]

[roads.road_ningbo_nanjing]
lore = "Ships from Ningbo change to smaller boats at Hangzhou and take the canals on to Nanjing. The boatmen complain the load is heavy and the locks are slow."
via = ["Hangzhou", "Transfer to canal boats"]

[roads.road_nanjing_beijing]
lore = "The Grand Canal runs north through the locks at Huai’an, and at Linqing the grain barges crowd together. From Nanjing to Beijing the trip takes two months."
via = ["Grand Canal", "Huai'an", "Linqing"]

[roads.road_tianjin_beijing]
lore = "Grain comes off the barges at Tianjin, goes onto carts, and reaches Beijing in five days. At the Tongzhou granaries the stacks rise higher than the walls."
via = ["Tongzhou canal granaries"]

[roads.road_guangzhou_jingdezhen]
lore = "Guangzhou cargo crosses Dayu Ridge on porters’ shoulders, then drops onto the Gan River. On Poyang Lake the wind can tip a loaded boat."
via = ["Dayu Ridge", "Gan River", "Poyang Lake"]

[roads.road_sakai_kyoto]
lore = "Sakai merchants ride boats upriver on the Yodo, and at Fushimi the boatmen stack bamboo fish baskets higher than their heads."
via = ["Yodo River and Fushimi"]

[roads.road_busan_seoul]
lore = "Crates from Busan travel north on the Yeongnam Great Road. Past Joryeong Pass, roadside taverns pour rice wine and serve pickles."
via = ["Yeongnam Great Road", "Joryeong Pass"]

[roads.road_beijing_shanhaiguan]
lore = "Post horses leave Beijing, change at Tongzhou, and pass Jizhou on the way to Shanhaiguan. Beacon towers stand every few miles."
via = ["Tongzhou", "Jizhou"]

[roads.road_shanhaiguan_ningyuan]
lore = "East of Shanhaiguan the road enters the Liaoxi corridor. The sea wind comes in from the east, and the post flags always stream west."
via = ["Liaoxi corridor"]

[roads.road_ningyuan_jinzhou_west]
lore = "Four days northeast of Ningyuan, the sand road near Tashan swallows wheels, and drivers climb down to push."
via = ["Tashan"]

[roads.road_jinzhou_west_guangning]
lore = "The Daling River rises fast in spring. Anyone crossing watches the clouds upstream, and waits when they hang low."
via = ["Daling River"]

[roads.road_guangning_liaoyang]
lore = "From Guangning east to Liaoyang, the Liao River crossing has few boats. In winter carts are dragged over the ice, and only in spring does the ferry run."
via = ["Liao River crossing"]

[roads.road_liaoyang_shenyang]
lore = "The post road from Liaoyang to Shenyang runs between two rivers. The morning fog is thick, and hoofbeats arrive before the riders do."
via = ["Post road between the Taizi and Hun rivers"]

[roads.road_shenyang_fushun]
lore = "Two days east of Shenyang, charcoal kilns smoke along the Hun River valley, and the kiln hands’ calls echo from the hollows."
via = ["Hun River valley"]

[roads.road_fushun_hetu_ala]
lore = "East past Fushun Pass, the Suzi River valley narrows to a single cart’s width. The guards call the roll each day, and no one without a seal passes."
via = ["Fushun Pass", "Suzi River"]

[roads.road_shenyang_kaiyuan]
lore = "North from Shenyang the road passes Tieling, where the horse market runs three days straight and the dealers shout louder than the horses neigh."
via = ["Tieling"]

[roads.road_kaiyuan_yehe_city]
lore = "At the Kaiyuan frontier market, furs trade for cloth and cloth for salt. An interpreter speaks three tongues, and he keeps the accounts in his head."
via = ["Haixi frontier market"]

[roads.road_lushun_jinzhou_liaodong]
lore = "The post road from Lushun to Jinzhou follows the coast, where the wind is strong enough to carry a hat clean into the sea."
via = ["Southern Liaodong post road"]

[roads.road_jinzhou_liaodong_liaoyang]
lore = "North from Jinzhou the road passes Gaizhou and Haizhou before Liaoyang. Gaizhou’s well water tastes of alkali, and Haizhou’s sugar works fill the night with sweetness."
via = ["Gaizhou", "Haizhou"]

[roads.road_seoul_uiju]
lore = "The road runs north past Pyongyang and Anju to the Yalu crossing, where travelers wait for the water to drop. The ferrymen know the day before anyone else."
via = ["Pyongyang", "Anju", "Yalu crossing"]

[roads.road_veracruz_tenochtitlan]
lore = "Cargo comes ashore, climbs the stone steps at Cempoala, crosses the slopes above Xalapa, and reaches the Puebla market. The porters on the mountain say little and keep their heads down."
via = ["Cempoala", "Xalapa", "Puebla"]

[roads.road_tumbes_cusco]
lore = "The Andean pack road runs south through Quito and Cajamarca. Cusco is three months away, and the llama trains stop three times a day."
via = ["Quito", "Cajamarca", "Andean pack route"]

[roads.road_arica_potosi]
lore = "From the coast, the road climbs past Tacna onto the high plateau. At night the cold is so hard the mules refuse to move."
via = ["Tacna", "Highland pass"]

[roads.road_nombre_de_dios_panama]
lore = "Five days across the isthmus on the royal road. The packs change to fresh mules halfway, and the silver chests change hands three times."
via = ["Camino Real across the isthmus", "Transfer to pack animals"]

[roads.road_chiang_mai_luang_prabang]
lore = "North from Chiang Mai, bamboo rafts spin in the rapids at the mountain crossing. The raftmen sing as they count the depth of the water."
via = ["Mountain river crossing"]

[roads.road_luang_prabang_vientiane]
lore = "Down the Mekong bank road to Vientiane, the river is too wide to see across. When the temple bells ring, the ferries stop."
via = ["Mekong bank route"]

[roads.road_porto_lisbon]
lore = "From Porto the road follows the river south past Coimbra, where students in black gowns argue loudly as they cross the bridges."
via = ["Coimbra"]

[roads.road_rome_civitavecchia]
lore = "The stones of the Via Aurelia are worn bright by carts. Drivers point to old milestones by the road and say they were there long before them."
via = ["Via Aurelia"]

[roads.road_florence_livorno]
lore = "Wool carts leave Florence, pass Pisa on the way to the sea, and their wheels still carry Tuscan mud."
via = ["Pisa"]

[roads.road_paris_le_havre]
lore = "Wine and cloth from Paris travel the Seine trade route to Rouen, then go aboard ship for the sea. At Rouen’s quays there are more lanterns at night than by day."
via = ["Rouen", "Seine trade route"]

[roads.road_prague_vienna]
lore = "South from Prague over the hills near Jihlava, carriage bells ring all the way to the gates of Vienna."
via = ["Jihlava"]

[roads.road_fez_sale]
lore = "From Fez to Sale the road crosses the Sebou plain, where the wheat stands higher than the wheels and villages spread olives to dry on the road."
via = ["Sebou plain"]

[roads.road_obama_kyoto]
lore = "Fish from Obama travels over the hills in pack boxes along the Mackerel Road. At Kumagawa post town, salt mackerel hangs from every eave."
via = ["Kumagawa post town", "Mackerel Road"]

[roads.road_jingdezhen_nanjing]
lore = "Jingdezhen porcelain goes by boat across Poyang Lake and onto the Yangtze, with straw packed between the bowls."
via = ["Poyang Lake", "Yangtze"]

[roads.road_yuegang_zhangzhou_city]
via = []
lore = "Leave Yuegang and follow the Jiulong upstream; Zhangzhou is a day away. The cargo boats grind slowly against the current, while the porters on the bank take the shortcuts and often arrive ahead of them."

[roads.road_campeche_merida_city]
via = []
lore = "Northeast out of Campeche, five days through thorny scrub, with water only from village wells and the ponds under the limestone. Old people say the Maya laid a white limestone causeway beneath this road, and in full sun it is blinding."

[roads.road_mocha_zabid_city]
via = []
lore = "North from Mocha, three days across the sands and sorghum fields of the Tihama. The camel trains travel by night and rest under the date palms once the sun is up, waiting for the cool."

[roads.road_callao_chincha]
via = []
lore = "South along the Inca coastal highway, white sand and river-valley cornfields trade places for six days. The way stations by the road still have keepers who change the pack animals and pass on messages, and the Spaniards use them as before."
