# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.line_heracles]
name = "Pillars of Heracles"
lore = "The ancients said Heracles set a pillar on each shore of the strait with a warning for sailors: Non plus ultra, nothing further. At sixteen the emperor Charles struck out the first word and took what was left as his motto: Plus ultra, further still."

[discoveries.line_corvo_rider]
name = "Westward Rider of Corvo"
lore = "The old people of the island say a stone horseman once stood on the summit with his right arm pointing west. In 1529 the island’s lord had men lowered down the cliff on ropes to take a wax impression of the letters on the pedestal. Nobody could read them."

[discoveries.line_cape_good_hope]
name = "Cape of Good Hope Landmark"
lore = "Dias rounded it in 1488 and called it the Cape of Storms. King João II found that ill-omened and renamed it the Cape of Good Hope, since past it lay the hope of India. Sailors still use both names, depending on the weather."

[discoveries.line_cape_horn]
name = "Southern Cape, later Cape Horn"
lore = "A storm once drove Hoces, of Loaísa’s fleet, south of the strait, and the men aboard said they saw where the land ends. Beyond that there is only ocean, with waves rolling in from the west and not a single rock to break them."

[discoveries.line_north_cape]
name = "North Cape"
lore = "In summer the sun never sets here, and in winter it never rises. English ships searching for a northern road to Cathay passed this cliff and named it the North Cape. What the Sámi fishermen call it, they never asked."

[discoveries.line_equator]
name = "Equator Crossing"
lore = "Past this line the Pole Star sinks into the sea, and pilots take their latitude from the noon sun instead. By old custom the crew drags out everyone crossing for the first time and soaks them head to toe in seawater."

[discoveries.line_tordesillas]
name = "Tordesillas Meridian"
lore = "In 1494 two kings agreed to draw a line 370 leagues west of Cape Verde: west of it for Castile, east of it for Portugal. The line is plain on the chart and nowhere on the sea, and the people on this coast have never heard of either king."

[discoveries.line_zaragoza]
name = "Zaragoza Counter-Meridian"
lore = "In 1529 the emperor Charles, short of money, sold his claim to the Moluccas to Portugal for 350,000 ducats, and the two crowns drew another line at Zaragoza. Nobody can measure longitude properly, so where the line actually falls depends on whose chart you are reading."

[discoveries.line_old_dragon]
name = "Old Dragon's Head Coast"
lore = "The Great Wall comes running down from the Yan Mountains and stops dead on the sand at the edge of the Bohai Sea. The old soldiers of the pass say the low-tide nights are the worst: horses can walk around the end of the wall on the wet sand."

[discoveries.line_liaodong_wall]
name = "Liaodong Frontier Wall"
lore = "Most of the Liaodong frontier wall is rammed earth, and in places it is no more than a ditch and a row of stakes. Beyond it lie the forests of the Jianzhou Jurchens. On market days below Fushun Pass, ginseng and sable change hands here for cloth, salt and iron pots."

[discoveries.line_bosphorus]
name = "Bosphorus Strait"
lore = "The Black Sea pours south through here, and the surface current runs so fast that ships heading north have to creep along in the back eddies near shore. Every autumn the bonito come down with the current, and nets line both banks side by side."

[discoveries.line_malacca]
name = "Strait of Malacca"
lore = "Tomé Pires wrote that whoever is lord of Malacca has his hands on the throat of Venice. The strait is thick with shoals, and when the monsoon turns, every ship in the harbor weighs anchor at once."

[discoveries.line_magellan]
name = "Strait of Magellan"
lore = "Magellan’s fleet felt its way through this maze of channels for thirty-eight days. At night fires burned all along the southern shore, lit by the people who live there, and that is how the Land of Fire got its name."

[discoveries.line_sound]
name = "The Sound"
lore = "Every ship entering or leaving the Baltic must strike sail at Helsingør and go ashore to pay. The guns of Krogen castle cover the narrowest point of the strait, and Helsingborg on the far shore flies the Danish flag too. Both banks belong to the king, and there is no slipping past."

[discoveries.line_torres]
name = "Waterway later called Torres Strait"
lore = "Reefs and islets split these waters into a hundred channels. The islanders sail outrigger canoes between the shores to the north and south, trading turtle shell and pearl shell for hulls carved at the river mouths of New Guinea."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Ancient authors called the two shores pillars; this coordinate is a northern observation point.
# The name dates to 1616; earlier observation is an explicit exploration extension.
# No border is cut into the sea; the approximate meridian does not imply local communities accepted the treaty.
# The complete later stone sea-fort is not placed in 1553; the coast is marked pending later construction events.
# The European name is later; early observation is a game extension of waters already known to island navigators.
