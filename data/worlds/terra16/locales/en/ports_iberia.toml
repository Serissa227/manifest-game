# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.bilbao]
name = "Bilbao"
lore = "On the quays at the mouth of the Nervión, one berth loads iron bars and the next loads wool bales. The mule trains carrying the wool stretch all the way back to the Castilian plateau."
river = "Nervion"

[ports.seville]
name = "Seville"
lore = "The Casa de la Contratación stands by the river, and every ship back from the Indies must declare its cargo here while the clerks’ pens scratch without pause. Seagoing vessels work up the Guadalquivir, their masts swaying above the orange groves."
river = "Guadalquivir"

[ports.cadiz]
name = "Cadiz"
lore = "Ships that draw too much water to cross the bar at the river mouth anchor in Cádiz bay, and their cargo is ferried to Seville in small boats."

[ports.tarifa]
name = "Tarifa"
lore = "The easterly and westerly winds of the strait collide right outside Tarifa’s walls. Fishermen crouch at the wall’s foot and watch the clouds, venturing out only when wind and tide both agree."

[ports.malaga]
name = "Malaga"
lore = "Grapes from the hills are dried to raisins, olives pressed to oil, and Granada’s silk comes down in bundles on muleback. The smell on the quay is sweet and heavy."

[ports.porto]
name = "Porto"
# lore 原注：before the later fortified port trade takes shape.
lore = "Flat-bottomed rabelo boats loaded with wine casks drift down the Douro, the boatmen gripping the long steering oar without easing for a moment. At the Porto quay the casks are rolled aboard seagoing ships for England and Flanders."
river = "Douro"

[ports.lisbon]
name = "Lisbon"
lore = "India House clerks squat by the heaps on the riverbank and count pepper sack by sack. Farther downstream the shavings lie ankle-deep in the yards, and the sailmakers stitch against the calendar: next season’s fleet to India sails in spring."
river = "Tagus"
