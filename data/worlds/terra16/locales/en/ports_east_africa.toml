# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.sofala]
name = "Sofala"
lore = "Beside the old Swahili market the Portuguese have raised a fort. Gold comes down the inland roads, and local traders weigh it out bag by bag."

[ports.mozambique_island]
name = "Mozambique Island"
lore = "A small island lying across the channel, where fleets that have rounded the Cape catch their breath: waiting for wind, taking on water, caulking leaks. The threshold of the island chapel is worn bright by sailors waiting on the weather."

[ports.kilwa]
name = "Kilwa Kisiwani"
lore = "The old court of coral stone is not what it was, and a corner of the palace dome has fallen in, but merchants of the Indian Ocean still come and the roads to the interior still run."

[ports.zanzibar]
name = "Zanzibar"
lore = "When the monsoon turns, merchant ships lie at the island port waiting for the wind. Ivory from the mainland and the island’s own rice are loaded together. The island’s petty king pays tribute to the Portuguese every year, and not with a pleasant face."

[ports.mombasa]
name = "Mombasa"
lore = "The Portuguese have sacked Mombasa more than once, burning houses and looting warehouses; a few months later the market opens as usual, and the sultan still sits on his own throne."

[ports.malindi]
name = "Malindi"
lore = "Malindi is the Portuguese’s friend, an alliance that stiffens the backs of the town’s merchants and annoys the people of Mombasa. The local sultan still governs for himself."

[ports.pate]
name = "Pate"
lore = "Shallow channels wind among the islands around the stone town of Pate; big ships cannot enter, and small sailboats slip through on the tide. The cloth woven here is sold up and down the coast."

[ports.mogadishu]
name = "Mogadishu"
lore = "Beside the white stone mosque a row of weavers’ shops stand open to the street, shuttles flying back and forth. The finished cloth is rolled and shipped to the far side of the Red Sea and to Egypt."

[ports.zeila]
name = "Zeila"
lore = "The port at the mouth of the Red Sea. The war is over, but the broken walls are not mended and there are more new graves than new houses; the camel trains still go up into the Adal interior, and ivory and gold still come out."

[ports.massawa]
name = "Massawa"
lore = "A port on a little coral island, where the priests, envoys and merchants of the highlands must come to reach the sea. Ottoman warships sweep past on the Red Sea now and then, and the islanders are quick to tell which flag has come to trade."
