# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.venice]
name = "Venice"
lore = "The glass furnaces of Murano, the printing shops and the Arsenal each keep their own rules and give way to no one. At the Rialto bridge the day’s prices are shouted out and settled."

[ports.corfu]
name = "Corfu"
lore = "Olive groves run down to the water, and a Venetian fortress squats on the headland. Every galley entering or leaving the Adriatic passes under its guns."

[ports.candia]
name = "Candia"
lore = "Cretan sweet wine, called malmsey, is rolled in barrel by barrel through the gates of Candia and goes to sea beneath the thick walls the Venetians built."

[ports.famagusta]
name = "Famagusta"
lore = "There are more churches inside the walls than anyone can count, many of them half empty now; the quay loads Cyprus cotton and sugar."

[ports.ragusa_port]
name = "Ragusa"
lore = "Someone in the council chamber at Ragusa is always revising a document: tribute for the Sultan, smiles for Venice, ships for Spain. The little republic has lived for centuries on such drafts."

[ports.chios]
name = "Chios"
lore = "In the south of the island the mastic trees are slashed, and the white resin falls like tears. The Giustiniani company controls the trade, and the Sultan’s men arrive on time every year for the tribute."

[ports.istanbul]
name = "Istanbul"
lore = "Timber is heaped like hills in the Golden Horn yards. Under the vaults of the great market each street sells one thing, and grain, iron and cloth arrive from every corner of the empire; if you want something, ask the guild first."

[ports.smyrna]
name = "Smyrna"
lore = "A line of lighters floats in Smyrna bay, loaded with figs, raisins, and the alum no dyehouse can do without."

[ports.rhodes]
name = "Rhodes"
lore = "Since the Knights left the island in 1522, the stone houses along the Street of the Knights still stand, coats of arms above the doors, but the people living in them are the Sultan’s officials and sailors."

[ports.beirut]
name = "Beirut"
lore = "Raw silk reeled in the Lebanese mountains comes down on muleback into the warehouses by the sea, and the Aleppo caravans’ manifests are brought here to be checked."
