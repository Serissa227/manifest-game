# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[sites.site_wonder_naruto]
name = "Naruto Whirlpools"
lore = "Between Awaji and Shikoku runs a narrow channel, and at the flood the current rushes like a bolting horse. The first thing children in the fishing villages learn is how to tell the hour of the tide."

[sites.site_wonder_mosken]
name = "Moskstraumen"
lore = "Lofoten villages hang their cod on drying racks that stretch down to the water’s edge. When the tide turns, the low roar carries across a whole island, and grandparents use it to scare children who will not come in to supper."

[sites.site_wonder_cape]
name = "Seas off the Cape of Good Hope"
lore = "Tens of miles off the cape, clumps of kelp begin to drift by, and seals and flightless black-backed birds crowd the water. Old sailors take one look and tighten the rigging: the storm is just ahead."

[sites.site_wonder_table_mountain]
name = "Table Mountain"
lore = "A stream runs down from the foot of the mountain into the bay, and passing ships fill their water casks here. The Khoikhoi herders ashore will mostly part with a sheep only for iron or copper, and hardly glance at anything else."

[sites.site_wonder_fuji]
name = "Mount Fuji"
lore = "Only one short month of summer is fit for climbing. Above the middle slopes it is all loose volcanic ash, a step up and half a step back, and a pilgrim wears out three pairs of straw sandals on one trip."

[sites.site_wonder_kilimanjaro]
name = "Snow of Kilimanjaro"
lore = "By day the summit mostly hides in cloud, showing a line of white only at dawn. Caravan guides use it as a signpost: keep the snow mountain in sight, and a few days on you reach the market where ivory is traded."

[sites.site_wonder_vesuvius]
name = "Mount Vesuvius"
lore = "The crater at the summit has a bite out of it, as if someone had taken a mouthful. Seen from the sea, the gap sits against the sky like a notch, and boatmen in the Bay of Naples say that when it lines up with the bow, you are in the channel at the mouth of the bay."

[sites.site_wonder_galapagos]
name = "Galapagos Islands"
lore = "The black rock ashore is too hot to stand on, prickly pears grow taller than a man, and sea lions lie on the beach too lazy to move for you. The currents inshore shift without warning, and an anchored ship can be dragged in the night."

[sites.site_wonder_amazon]
name = "Fresh Waters at the Amazon Mouth"
lore = "Orellana’s men drifted down the river for months and came back saying there were women archers on the banks, and that is how the river got the name Amazon. The mouth is too wide to see across, and at flood the tide drives a wall of water back upstream with a roar you can hear miles off."

[sites.site_wonder_great_barrier]
name = "Outer Great Barrier Reef"
lore = "On low-tide nights, rows of torches flare across the reef flats as islanders wade the shallows spearing fish and gathering shellfish. Hold a torch low over the water and the fish crowd toward it; the children follow with baskets."

[sites.site_wonder_krakatoa]
name = "Krakatoa"
lore = "Pepper ships from Banten often drop anchor in the lee of this mountain island and wait for the tide to slacken before moving on. No one lives there, only flocks of sea birds."

[sites.site_wonder_etna]
name = "Mount Etna"
lore = "In summer mule trains carry snow down the mountain, pack it in straw and haul it to Catania and Messina, where townspeople chill their wine and fruit with it. The vineyards at its foot grow thick on years of volcanic ash."

[sites.site_wonder_mosi_oa_tunya]
name = "Mosi-oa-Tunya Falls"
# The name Mosi-oa-Tunya ("the smoke that thunders") comes from the 19th-century Kololo; the lore describes the falls without presenting it as a 16th-century local name.
lore = "As you approach, first comes a roar like thunder, and the ground trembles underfoot; then the cloud that never disperses; last, the mist that soaks you all the way in. Guides tell the porters to wrap the loads against damp."

[sites.site_line_heracles]
name = "Pillars of Heracles"
lore = "The Rock of Gibraltar faces the mountains of Africa across a narrow channel. When the east wind blows, ships coming in from the Atlantic are held outside the strait, and the wait can run to a fortnight."

[sites.site_line_cape_good_hope]
name = "Cape of Good Hope Landmark"
lore = "White surf breaks all year on the reefs at the foot of the cape. Pilots treat it as a boundary: past this point the chart is turned to a new sheet, and the bow swings east."

[sites.site_line_cape_horn]
name = "Southern Cape, later Cape Horn"
lore = "Bare black rock at the far southern end, with few clear days in a year. A ship coming round from the open ocean has its pilot swing a day wider to the south rather than hug the shore; overhead there are only albatrosses, and the grass on the rock lies flat, combed by the wind."

[sites.site_line_north_cape]
name = "North Cape"
lore = "A flat-topped black cliff drops straight into the cold sea. The wind on top is too hard for even a dwarf birch to stand, and moss lies flat against the stone. Ships bound east take their last bearing on the headland here; beyond it there is nothing left to steer by."

[sites.site_line_old_dragon]
name = "Old Dragon's Head Coast"
lore = "The Great Wall’s easternmost stretch runs all the way down to the water. At high tide the stone that juts into the sea sits in the surf like a dragon’s head, and fishermen call it Old Dragon’s Head; at ebb, only wet sand lies below it. At the water’s edge stand just a single pass and a beacon tower."

[sites.site_line_liaodong_wall]
name = "Liaodong Frontier Wall"
lore = "The beacon towers of Liaodong each keep watch on the next. Brushwood and small guns are kept on top; at an alarm they fire and raise smoke, and the signal passes from tower to tower until, within half a day, the commander at Guangning has the news."

[sites.site_line_bosphorus]
name = "Bosphorus Strait"
lore = "The surface water rushes south, while a salty undercurrent creeps north along the bottom. Fishermen have long known it: sink the net deeper, and the fish ride that hidden current into the Black Sea."

[sites.site_line_malacca]
name = "Strait of Malacca"
lore = "Both shores are mangroves and mud, and at high tide you cannot tell shore from sea. Only the local pilots keep the hidden shoals firmly in their heads."

[sites.site_line_magellan]
name = "Strait of Magellan"
lore = "The channel twists and twists again between snow-streaked mountains. In a headwind ships duck into a cove and tie up to old trees on the shore, waiting for the wind to change."

[sites.site_line_sound]
name = "The Sound"
lore = "Ships waiting for a fair wind lie in a line at anchor off Helsingør, Dutch salt ships, Danzig grain ships, Lübeck herring boats, bow to stern, each waiting for the tax collector to come aboard and count the cargo."

[sites.site_line_torres]
name = "Waterway later called Torres Strait"
lore = "Old island sailors fold the channels into songs, each song a route. A stranger who wants to get through safely needs someone willing to teach the tune."

[sites.site_ruin_giza_pyramids]
name = "Pyramids of Giza"
lore = "Three stone mountains stand on the sand of the Nile’s west bank, visible from Cairo’s walls. Storytellers say they are the tombs of pharaohs; pilgrims say they are the granaries where Joseph stored grain."

[sites.site_ruin_tulum]
name = "Seaward Walls of Tulum"
lore = "Coasting skippers say a fire lit at night in a window of the clifftop temple points straight at the one gap in the reef where a boat can get in."

[sites.site_ruin_rapa_nui]
name = "Rapa Nui Moai"
lore = "The whole island is a lump of volcanic rock in the open ocean, with no harbor and surf pounding black reefs. On the hillside lie many statues never raised, abandoned half carved."

[sites.site_ruin_nan_madol]
name = "Nan Madol"
lore = "The channels float a boat only at high tide; at low tide only mud is left. The stone platforms stand shoulder to shoulder, their walls taller than a man, and a stranger’s boat must first get leave to enter, then wait for someone to show the way."

[sites.site_genoa_lanterna]
name = "Lanterna of Genoa"
lore = "Rebuilt in 1543, the lighthouse stands on a rock at the harbor’s western end and burns oil lamps at night. Incoming ships steer by it, and the harbor pilots say it is more dependable than the church bells."

[sites.site_alexandria_qaitbay]
name = "Citadel of Qaitbay"
lore = "The sea fort raised between 1477 and 1479 on Sultan Qaitbay’s order, using stone from the fallen Pharos lighthouse. Every ship into Alexandria passes under its guns."

[sites.site_lisbon_belem]
name = "Tower of Belem"
lore = "A stone tower raised course by course between 1514 and 1519 at the mouth of the Tagus, carved with ropes and crosses. For outbound ships it is the last of Portugal they see."

[sites.site_cabo_sao_vicente]
name = "Cape Saint Vincent"
lore = "Sheer cliffs drop straight into the sea, with a small friary on top. Ships’ chaplains tell how the saint’s body was brought here guarded by ravens. Past the cape, you turn north for Lisbon or east for Cádiz."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# The volcanic island marks the strait; the catastrophe of 1883 is not brought forward.
# Ancient authors called the two shores pillars; this coordinate is a northern observation point.
# The name dates to 1616; earlier observation is an explicit exploration extension.
# The complete later stone sea-fort is not placed in 1553; the coast is marked pending later construction events.
# The European name is later; early observation is a game extension of waters already known to island navigators.
# Further original notes: currents kept distinct from monsters; Kilimanjaro known locally long before European reports; the 1631 Vesuvius eruption is not brought forward; local sea knowledge predates European charts and visitors; the later foreign name of Mosi-oa-Tunya is not used; the Cape of Good Hope is a voyage stage, not an ocean boundary; North Cape is not claimed as the northernmost point; the Liaodong marker is one observation site; Cape Saint Vincent is shown without a later lighthouse.
