# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.sanguo_jiajing]
name = "Romance of the Three Kingdoms (Jiajing edition)"
lore = "The twenty-four-volume Jiajing printing, from the oath in the peach garden to the empire reunited under Jin. If anyone aboard can read, the whole hold stays up past midnight once he reaches the east wind at Red Cliffs."

[items.shuihu_jiajing]
name = "Water Margin (Jiajing printing tradition)"
lore = "A hundred and eight outlaws gather at Liangshan Marsh. Bookshops were printing it by the Jiajing years, and one collector’s catalog credits Shi Nai’an’s text, arranged by Luo Guanzhong. Sailors’ favorite part is Zhang Shun, the White Streak in the Waves, fighting underwater."

[items.xixiang_yuejia]
name = "Romance of the Western Chamber (Yue family edition)"
lore = "The Yue family of Beijing printed it fully illustrated, pictures above and text below on every page, with Zhang leaping the wall and Hongniang carrying letters as if alive. Daughters who read it keep one eye out for their elders."

[items.jiandeng_xinhua_ms]
name = "Qu You: New Tales Told While Trimming the Wick"
lore = "Qu You’s tales of ghosts and uncanny love were denounced to the throne in the Zhengtong years and spread all the faster for it, as far as Korea and Japan. Best not to read “The Peony Lantern” aloud at night."

[items.jiandeng_yuhua]
name = "Li Changqi: Further Tales Told While Trimming the Wick"
lore = "Li Changqi, who rose to provincial administration commissioner, read Qu You’s book and could not resist writing one of his own in more ornate prose. Readers love to set the two side by side, and each has its partisans."

[items.qingping_hangzhou]
name = "Tales from the Qingping Mountain Hall"
lore = "The Hangzhou collector Hong Pian printed storytellers’ scripts as Sixty Stories, keeping every “now it is told” and “listen, my audience” intact. Read aloud in a ship’s hold, they are far livelier than read alone."

[items.chuanxilu_ganzhou]
name = "Wang Shouren: Instructions for Practical Living (first printing)"
lore = "While Wang Yangming was putting down bandits around Ganzhou, his disciple Xue Kan printed his teacher’s conversations in three chapters. “To know and not to act is not yet to know”: scholars who reach that line often shut the book and go for a walk."

[items.sishu_ms]
name = "Zhu Xi: Collected Commentaries on the Four Books (Ming copy)"
lore = "Zhu Xi’s commentary is the answer key of the examination hall. This school copy has been thumbed black at the corners by generations of students, and someone has noted in the margin which line came up two years ago."

[items.sanzijing_ms]
name = "Three Character Classic"
lore = "“Men at their birth are by nature good”: three characters to a line, the first book village children sway back and forth reciting. Tradition credits Wang Yinglin in the last years of the Song, though no one can be sure."

[items.baijiaxing_ms]
name = "Hundred Family Surnames"
lore = "“Zhao, Qian, Sun, Li, Zhou, Wu, Zheng, Wang”: Zhao comes first because it was the Song imperial house. Children learn the surnames early, so that one day they can read who a letter is meant for."

[items.qianziwen_ms]
name = "Thousand Character Classic"
lore = "A thousand characters without a single repeat, opening with “Heaven and earth, dark and yellow.” Calligraphers practice on it, and clerks number crates and ledgers by it: heaven first, earth second, all the way down."

[items.lienvzhuan_ms]
name = "Liu Xiang: Biographies of Exemplary Women (Ming copy)"
lore = "Liu Xiang sorts the women of antiquity into seven chapters, from model mothers through the quick-tongued to the vicious. Some girls in the family schoolroom come away remembering chastity; others remember only the ones who could out-argue anyone."

[items.yuefu_ms]
name = "Guo Maoqian: Collection of Music Bureau Poems (manuscript)"
lore = "Guo Maoqian’s hundred chapters of Music Bureau songs, from temple hymns to village tunes. Once the one reader aboard begins “Click-click, and again click-click, Mulan weaves at the door,” the whole hold joins in."

[items.ming_yitongzhi]
name = "Comprehensive Gazetteer of the Great Ming"
lore = "Ninety chapters printed by the palace in the Tianshun years, covering the land and products of the two capitals and thirteen provinces, with Korea, Japan, Malacca and other foreign lands at the end. Merchants who read those last chapters often find the official far lands farther off than the ones they have seen."

[items.xiyang_chaogong_ms]
name = "Huang Shengzeng: Records of Western Ocean Tribute"
lore = "The Suzhou scholar Huang Shengzeng took the compass bearings, customs and tribute goods from earlier voyage accounts and arranged them country by country in three chapters. Scholars still copy it from one another."

[items.shilin_ming]
name = "Shilin Guangji (Ming edition)"
lore = "A household encyclopedia handed down since Song and Yuan times: astronomy, arithmetic, etiquette, drinking games, backgammon, even the proper form for an invitation. Bookshops have recut it again and again; there is no telling how many times over this copy was made."

[items.wujing_ms]
name = "Seven Military Classics (Ming manuscript)"
lore = "Sunzi, Wuzi, the Six Secret Teachings, the Three Strategies… the seven military classics fixed under the Song are still set for the Ming military examinations. A cadet has filled this copy’s margins with notes, one of which reads, “At sea, perhaps not.”"

[items.pipa_ms]
name = "Gao Ming: The Lute (Ming manuscript)"
lore = "Cai Bojie goes to the capital for the examinations and never comes back; Zhao Wuniang lives on husks, sells her hair to bury his parents, and sets out with her lute to find him. When a troupe reaches the husk-eating scene, someone in the crowd is always wiping their eyes."

[items.xingcha_ms]
name = "Fei Xin: Overall Survey of the Star Raft"
lore = "Fei Xin, a soldier who sailed four times with Zheng He, wrote up more than forty lands in two chapters: Champa’s elephants, Bengal’s cloth, the stone-built town of Mogadishu. Old sailors telling tales of the eunuch admiral like to check them against it."

[items.yingya_sheng]
name = "Ma Huan: Overall Survey of the Ocean's Shores (Zhang Sheng abridgement)"
lore = "Ma Huan was the Arabic interpreter aboard Zheng He’s ships and recorded the ways of twenty countries. Zhang Sheng found the original too plain and polished it into an elegant printed abridgment: smoother to read, with many details cut away."

[items.lijing_reprint]
name = "Tale of the Lychee Mirror (1566 reprint)"
lore = "Chen San disguises himself as a mirror polisher and sells himself into the Huang household, all for a lychee Wuniang tossed from her balcony, while the maid Yichun carries messages between them. The Quanzhou and Chaozhou songs are printed together, and this edition calls itself a reprint of something older."

[items.taiping_ms]
name = "Extensive Records of the Taiping Era (collector's manuscript)"
lore = "Five hundred chapters compiled under the Song, whose printing blocks were locked away in the palace almost at once, so the book survives only in copies. Collectors lend it to one another, and young readers who find Huang Chonggu, the woman who served as an official in men’s clothes, tend to read her story twice."

[items.fenshu_macheng]
name = "Li Zhi: A Book to Burn"
lore = "Li Zhi printed it by Dragon Lake in Macheng, said its words deserved to be burned and thrown away, and named it exactly that. Scholars curse it and fight over copies."

[items.xiyou_shidetang]
name = "Journey to the West (Shidetang edition)"
lore = "A rumored manuscript: a hundred chapters of the monk Tripitaka’s pilgrimage west, guarded by a monkey born from stone through eighty-one ordeals, one after another. The copy names no author; every bookseller in Nanjing wants to print it, and none has seen it whole."

[items.tiangong_print]
name = "Song Yingxing: Exploitation of the Works of Nature"
lore = "A rumored manuscript: a book of all the crafts by a provincial graduate from Jiangxi, illustrating rice farming, silk reeling, porcelain firing, coin casting and shipbuilding. Those who claim to have seen it say no book is more practical."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Astronomy, calculation, etiquette and games meet in a practical encyclopedia; about 1500 represents its Ming printing tradition pending edition identification.
# One hundred chapters join the trials of the pilgrimage; the original imprint names no author, whatever later attributions may say. Here it is a rumored manuscript, bringing the historical 1592 version into this world early, outside the printed book trade.
# Fields, looms and furnaces each have their processes, inviting merchants to compare the illustrated crafts with workshops they know. Here it is a rumored manuscript, bringing the historical 1637 version into this world early, outside the printed book trade.
# Original notes: a 1540 catalog records Water Margin, precise edition unidentified; Jiandeng Xinhua given as manuscript because of Ming calls to suppress it; Yuhua printed about 1433; school primers dated about 1500 as representative copies, traditional authorship of the Three Character Classic not asserted; Xiyang Chaogong printing history uncertain; the 1566 Lychee Mirror is the only dated edition used.
