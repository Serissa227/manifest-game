# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.hatsuhana_tea_caddy]
name = "Hatsuhana tea caddy"
lore = "One of the three great shouldered caddies of the realm, said to have been named by Ashikaga Yoshimasa for the first blossom of spring. A piece like this never sits in a shop; you must be introduced by a tea master and glimpse it across a silk cloth at a gathering."

[items.nitta_tea_caddy]
name = "Nitta tea caddy"
lore = "Its name is said to come from Nitta Yoshisada, an owner of long ago. It has changed hands so often since that no two tea hosts tell its history quite the same way."

[items.narashiba_tea_caddy]
name = "Narashiba tea caddy"
lore = "The name comes from an old poem about the oak brushwood of a hunting field: we grow no closer, yet the longing only deepens. In Japanese, “longing” sounds just like “deep,” and its glaze is a deep amber."

[items.tsukumo_caddy]
name = "Tsukumo Nasu tea caddy"
lore = "A small eggplant-shaped caddy whose name borrows the white hair of “a hundred years less one” from the Tales of Ise. Others say Murata Jukō paid ninety-nine strings of cash for it. Which came first, the name or the price, tea men still argue."

[items.yohen_tenmoku]
name = "Yohen Tenmoku tea bowl"
lore = "A black-glazed bowl from the Jian kilns, its interior scattered with spots ringed in blue light that shift color as the lamp moves. The shogun’s connoisseurs ranked it above every other tenmoku, a thing found nowhere else in the world."

[items.tea_bamboo_scoop]
name = "Named bamboo tea scoop"
lore = "The bamboo node falls right at the middle of the handle, every stroke of the carving knife still clear. The tea master who carved it gave it a poetic name, brushed on its bamboo case in ink now faded."

[items.jingdezhen_blue_white]
name = "Jingdezhen blue-and-white bowl"
lore = "Blue-and-white of the Jiajing years, painted with imported Muslim blue that leans toward violet. Merchants stack the bowls into columns, packed tight with straw between each one, before loading them aboard."

[items.xuande_censer]
name = "Censer bearing a Xuande mark"
lore = "The six-character Xuande mark on its base has been copied by more founders than ever cast the originals. Connoisseurs ignore the mark and look at the bronze, which should have the color of a ripe chestnut shell."

[items.yongle_fragment]
name = "Yongle Encyclopedia fragment"
lore = "Red-ruled columns of large, careful script on leaves far bigger than any ordinary book. The whole encyclopedia is locked away in the palace, where outsiders never see so much as its index, and the seller is vague about how these pages got out."

[items.venice_glass_cup]
name = "Venetian glass cup"
lore = "Murano “crystal” glass, so thin the light passes straight through, rings clear when flicked with a fingernail. A ship’s master will leave a whole space of cargo empty sooner than skimp on the three layers of soft cloth around it."

[items.flemish_tapestry]
name = "Flemish tapestry panel"
lore = "A Brussels hanging woven with a stag hunt, heavier folded than a grown man. On the day the estate was inventoried, it took two people pulling at either end to spread it out."

[items.durer_rhinoceros]
name = "Dürer's Rhinoceros print"
lore = "Dürer never saw the rhinoceros; he cut the block from a letter and a rough sketch. Its plated hide and the little horn on its back have been all of Europe’s idea of a rhinoceros ever since."

[items.leonardo_note]
name = "Leaf after Leonardo's notes"
lore = "The writing runs backward and reads properly only in a mirror. After Leonardo’s death his notebooks passed to his pupil Melzi; how this leaf wandered out of that house is a trail to follow back one stop at a time."

[items.gutenberg_leaf]
name = "Leaf from a Gutenberg Bible"
lore = "Forty-two lines to a column, two columns to a page, the red initials painted in by hand afterward. Nearly a century has passed since it came off the press at Mainz, and the ink is still glossy black."

[items.persian_carpet]
name = "Persian carpet"
lore = "A carpet from Tabriz with hundreds of knots to the inch. A collector ignores the pattern at first and crouches to turn up the corners: where it has been mended, the knots sit looser."

[items.iznik_tile]
name = "Iznik tile"
lore = "An Iznik tile, its blues and greens on white as bright as the day they were glazed. This one was taken down when a mosque was repaired, and old mortar still clings to its back."

[items.mughal_miniature]
name = "Mughal miniature painting"
lore = "Humayun brought two painters from Persia, and the Mughal workshop opened its doors. On a sheet no bigger than a palm, every hunter, horse, and serrated leaf is perfectly clear."

[items.kongo_raffia]
name = "Kongo raffia textile"
lore = "Kongo weavers turn raffia palm fiber into cloth with a pile like velvet, its geometric patterns joined square by square. Back home, small squares of raffia cloth pass as money."

[items.ethiopian_hand_cross]
name = "Ethiopian hand cross"
lore = "Ethiopian priests carry crosses like this one, and the faithful come forward to kiss it and ask a blessing. Its pierced lattice nests layer within layer, and the handle shines from years of holding."

[items.swahili_coffee_pot]
name = "Swahili brass coffee pot"
lore = "A brass pot with a spout curved like a bird’s beak and a body chased with fine flowers. The ship’s master says he traded for it from the Yemen side. Few people on this coast drink coffee yet; the pot has arrived ahead of them."

[items.mexica_feather_crown]
name = "Mexica feather headdress study piece"
lore = "Mexica featherworkers bind long quetzal plumes one by one to a frame of reeds. This one was made the old way as a teaching piece, so that students can see how each layer of feathers is laid."

[items.gold_llama]
name = "Andean gold llama"
lore = "A gold llama no bigger than a palm, standing straight on all four legs. Highland people offered such figures for the increase of their herds. How this one came down the mountains, onto a ship, and here, only those who passed it along know."

[items.maya_jade_mask]
name = "Maya jade-mask study piece"
lore = "A face pieced together from fragments of green stone, its eyes inlaid in shell and obsidian. This is a craftsman’s model for teaching apprentices the mosaic. The true masks never leave the places where they belong."

[items.chimu_gold_cup]
name = "Chimu gold cup"
lore = "Chimu goldsmiths hammered gold thinner than paper, then tapped out the design bit by bit. When the Inca conquered the Chimu, they carried the goldsmiths off to Cuzco wholesale."

[items.ivory_saltcellar]
name = "Ivory saltcellar"
lore = "Carved to a pattern brought by Portuguese customers: a foreigner in a hat stands on the lid, while beasts of the carver’s own country circle the base."

[items.unicorn_horn]
name = "Supposed unicorn horn"
lore = "A long spiral horn said to sweat at the touch of poisoned wine. An appraiser from the north, though, says he has seen a fish wearing just such a horn on Olaus Magnus’s sea chart."

