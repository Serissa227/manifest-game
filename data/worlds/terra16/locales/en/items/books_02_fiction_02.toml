# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.palmerin_salamanca]
name = "Palmerin de Oliva"
lore = "Palmerín is a baby left beneath an olive tree who grows up to search for his parents; booksellers know that pages who finish one volume will pester for the next."

[items.teodor_zaragoza]
name = "The Story of the Maiden Teodor (Zaragoza edition)"
lore = "The slave girl Teodor answers the king’s learned men one after another until none has a question left. This edition was printed in Zaragoza by Juana Millán, and the masters at the colleges find it hard to read with a straight face."

[items.sappho_aldine]
name = "Sappho: Ode to Aphrodite (in the Aldine rhetoricians)"
lore = "The whole of the ode to Aphrodite lies hidden in Dionysius’s quotations on composition; anyone who wants Sappho must first get through a long argument about the arrangement of words."

[items.lazarillo_antwerp]
name = "Lazarillo de Tormes (Antwerp edition)"
lore = "Nucio’s slim book follows hunger behind respectable doors; it is so hard on the clergy that readers laugh aloud while priests frown."

[items.stampa_venice]
name = "Gaspara Stampa: Rime"
lore = "After Gaspara’s death her sister Cassandra gathers her love poems for the press; Venetian readers hear in them a woman speaking to the man who wronged her, as though the voice had not yet faded."

[items.sappho_estienne]
name = "Sappho: Fragments (Estienne's Anacreon appendix)"
lore = "Estienne has added two poems of Sappho at the back of his Anacreon: beside the Hymn to Aphrodite there is now a second, “He seems to me a god.” Readers who knew only one fight to borrow it."

[items.labe_lyon]
name = "Louise Labe: Works"
lore = "Louise Labé, a Lyon ropemaker’s wife, is said to ride and fence; readers of French often pick one of her elegies or sonnets to read aloud to friends."

[items.heptameron_paris]
name = "Marguerite de Navarre: Heptameron"
lore = "Floods wash out the bridge, and a company of men and women stranded in an abbey take turns telling stories; after each one they fall to arguing over fidelity and honor, and the quarrels run longer than the tales."

[items.diana_valencia]
name = "Montemayor: Seven Books of Diana"
lore = "The shepherds’ and shepherdesses’ heartaches tangle together, with a woman in man’s dress among them; Mey’s new printing sells out quickly in Valencia, and court readers whisper about whom the book is meant to portray."

[items.araucana_madrid]
name = "Ercilla: La Araucana (Part I)"
lore = "Ercilla fought in Chile himself, and his poem makes the Araucanian chiefs more heroic than the Spaniards; the first part breaks off with the fighting at its height, and readers must wait for him to go on."

[items.lusiads_lisbon]
name = "Camoes: The Lusiads"
lore = "Da Gama’s voyage to India is interleaved with the squabbles of Venus and Bacchus on Olympus; old pilots who have rounded the Cape always scribble something in the margin at the passage about Adamastor."

[items.franco_terze]
name = "Veronica Franco: Terze Rime"
lore = "Veronica Franco is one of Venice’s celebrated courtesans, and her verses, written to lovers and rivals alike, are always proper and never servile; readers use them to practice how to answer back with measure."

[items.tasso_ferrara]
name = "Tasso: Jerusalem Delivered"
lore = "Clorinda takes the field in armor and Erminia slips out of the city gate at night disguised as a warrior; when these two passages are read at a banquet, the whole table lowers its cups."

[items.faust_frankfurt]
name = "The History of Doctor Faustus"
lore = "Doctor Faustus pledges his soul to the devil for twenty-four years of learning and flights through heaven and earth. The title page calls it a warning; in the taverns people care only about his travels and how he tricked the pope."

[items.faerie_london]
name = "Spenser: The Faerie Queene (Books I–III)"
lore = "The lady Britomart puts on armor and every knight takes her for a man; this volume holds only the first three books, and the poet promises there is more to come."

[items.arcadia_london]
name = "Sidney: Arcadia"
lore = "A prince disguises himself as a shepherd and another as a woman warrior, none of them able to say what they feel, and the pasture is full of endless mistaken identities; travelers home from the sea recognize themselves in the characters’ hesitation."
