# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.lascaris_milan]
name = "Lascaris: Erotemata"
lore = "The first book printed entirely in Greek type. Question by question, it walks beginners through endings and declensions; anyone hoping to read Aldus’s Homer has to get past it first."

[items.nebrija_grammar]
name = "Nebrija: Grammar of the Castilian Language"
lore = "Nebrija broke Castilian speech into rules and dedicated them to Queen Isabella, writing in the preface that language has always been the companion of empire. Interpreters use it to teach newcomers how Castilian words change."

[items.calepino_reggio]
name = "Calepino: Dictionary"
lore = "The Augustinian friar Calepino’s Latin dictionary, each word followed by quotations from the ancients. This edition is Latin only; later printers keep adding languages until the book swells beyond carrying."

[items.alcala_granada]
name = "Pedro de Alcala: Easy Art of Learning Arabic"
lore = "After Granada fell to the Catholic Monarchs, Friar Pedro de Alcalá spelled out the city’s spoken Arabic in Castilian letters so priests could follow a confession. Across the sea in North Africa, the accent shifts again."

[items.melaka_vocabulary_ms]
name = "Chinese-Malay Vocabulary of the Melaka Bureau"
lore = "Translators at the Ming bureau of foreign languages recorded Malay words under heaven, earth, birds and beasts, clothing and more, each sounded out in Chinese characters. Read them aloud in Malacca and you will be laughed at nine times in ten."

[items.riben_kaolue]
name = "Xue Jun: Brief Study of Japan, with Vocabulary"
lore = "The year rival Japanese tribute missions came to blows in Ningbo, Xue Jun of Dinghai wrote this book. Its appended word list gives more than three hundred and sixty Japanese words sounded out in Chinese characters, and merchants practice a few before they make port."

[items.hunmong_jahoe]
name = "Choe Sejin: Hunmong Jahoe"
lore = "More than three thousand everyday characters, each glossed with its sound and meaning in Korean script and grouped under heaven and earth, plants, food and clothing. Choe Sejin of the Office of Interpreters compiled it for children, and young interpreters build on it too."

[items.nogeoldae_translation]
name = "Choe Sejin: Translated Nogeoldae"
lore = "Three Goryeo merchants drive horses to Beijing with ginseng and ramie cloth, finding inns, feeding animals, haggling and testing silver along the way, every line a lesson in trade. Choe Sejin marked the reading of each Chinese character in Korean script."

[items.shahidi_ms]
name = "Shahidi: Tuhfe-i Shahidi"
lore = "Shahidi Dede of the Mevlevi lodge set more than a thousand Persian words into rhyming Turkish couplets that stick after a few recitations. Students who have it by heart find Rumi’s Masnavi far less daunting."

[items.ajurrumiyya_ms]
name = "Al-Ajurrumiyya"
lore = "Ibn Ajurrum of Fez wrote a grammar short enough to copy in an afternoon and long enough to take a child a year to memorize. From the Maghrib to the Swahili coast, schoolrooms ring with children chanting it in unison."

[items.pigafetta_vocabulary]
name = "Pigafetta: Malay Vocabulary (extract from the voyage)"
lore = "Pigafetta sailed with Magellan’s fleet to the Moluccas and jotted down some four hundred Malay words as an Italian ear heard them. Once there, you will still need someone to say each one for you."

[items.molina_mexico]
name = "Molina: Castilian-Nahuatl Dictionary"
lore = "The Franciscan Molina grew up in Mexico and speaks Nahuatl like a native. Juan Pablos printed his dictionary in Mexico City, the first dictionary printed in the New World."

[items.trithemius_polygraphia]
name = "Trithemius: Polygraphia"
lore = "The first printed book of ciphers. Its tables swap each letter for a Latin word, so the message reads like a prayer; recite it to strangers and none will guess it gives the day the cargo ship sails."

[items.oliveira_lisbon]
name = "Oliveira: Grammar of the Portuguese Language"
lore = "The speech of every Lisbon street, set down as a grammar for the first time. Oliveira listens closely to how each sound is made, and a harbor interpreter who has read him can hear at once where a foreign sailor’s Portuguese goes astray."

[items.barros_cartinha]
name = "Joao de Barros: Primer"
lore = "Barros’s little primer: first the alphabet and spelling, then the Creed and the Ten Commandments. Priests bound for India pack a few in their chests and teach children from them letter by letter."

