# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.kangin_ms]
name = "Kanginshu"
lore = "A hermit monk within sight of Mount Fuji gathered these 311 short songs, arranged by season and by love. “Why so solemn? Life is a dream, so go wild!” is the one young people aboard love to hum."

[items.teikin_ms]
name = "Teikin Orai"
lore = "From the first month to the twelfth, twenty-five letters back and forth, packed with words for clothes, food, tools, armor and medicines. Temple children copy them out, and once they know them, writing home or keeping accounts comes easily."

[items.ise_ms]
name = "Tales of Ise"
lore = "“Once there was a man”: more than a hundred short episodes begin that way, each turning on a poem. The daughters of court families know best the one where he journeys east and makes a poem of the irises at Yatsuhashi."

[items.heike_kakuichi]
name = "Tale of the Heike (Kakuichi tradition)"
lore = "“The bell of the Gion temple tolls the impermanence of all things.” When the blind lute priest begins, the audience knows the Heike will end at Dan-no-ura. Listeners who know the Inland Sea hold their breath when the tide turns."

[items.otogi_urashima]
name = "Urashima Taro (Muromachi tale tradition)"
lore = "Urashima saves a turtle and is welcomed into the Dragon Palace for three years; back on the shore, seven hundred have passed. He opens the jeweled box and there is only a wisp of white smoke. Fishing-village elders always end by warning children not to open boxes they are given."

[items.tsukuba_ms]
name = "Shinsen Tsukubashu"
lore = "Sōgi and his fellows compiled this anthology of linked verse. One stanza leaves a thought half finished; the next catches it and turns it somewhere new. Read enough of it and you can answer when someone tosses out an opening line at a banquet."

[items.analects_shohei]
name = "Collected Explanations of the Analects (Shohei edition)"
lore = "Printed at Sakai in 1364 by the lay Buddhist Dōyū, the first Analects ever printed in Japan, with He Yan’s collected commentary set among the lines. Zen monks of the Five Mountains and wealthy Sakai merchant houses keep it with care."

[items.torikaebaya_ms]
name = "The Changelings"
lore = "A brother raised as a daughter becomes a lady-in-waiting at court; his sister, raised as a son, takes office as a courtier. Court readers gasp and laugh and keep asking when the two will finally switch back."

[items.kojiki_ms]
name = "Kojiki"
lore = "The tales of the age of the gods, recited by Hieda no Are and written down by Ō no Yasumaro. Yamasachihiko goes to the sea god’s palace for a lost fishhook and returns with the jewels that raise and lower the tide; at this point shrine people lower their voices."

[items.genji_ms]
name = "The Tale of Genji"
lore = "Fifty-four chapters in which Murasaki Shikibu follows the shining Genji and the women he loved. Court libraries lend it out chapter by chapter, so a set is often missing a few, and to grasp the feeling behind a single poem you must first know how people at court speak."

[items.kokin_ms]
name = "Kokin Wakashu"
lore = "The first imperial poetry anthology, compiled by Ki no Tsurayuki and others at Emperor Daigo’s command. Anyone can copy the poems, but the secret readings of the Kokin Denju pass only from master to disciple; Sōgi himself received them from Tō no Tsuneyori."

[items.geumo_ms]
name = "Kim Sisup: New Tales of Mount Geumo"
lore = "Five tales Kim Sisup wrote as a recluse on Mount Geumo near Gyeongju, modeled on Qu You’s ghost stories but full of Korean ghosts and a Dragon Palace banquet. Readers hear in every line a gifted man who refused to serve the throne."

[items.haedong_print]
name = "Sin Sukchu: Record of the Eastern Countries"
lore = "Sin Sukchu went to Japan with an embassy as a young man and later wrote this: maps of Japan’s provinces and Ryukyu, the lineages of island lords, down to how many meals a Japanese envoy should be served. Anyone sent across the sea studies it before leaving."

[items.sinjeung_print]
name = "Revised Survey of the Geography of the Eastern Kingdom"
lore = "Every county of Joseon’s eight provinces, with its mountains, products, post stations, pavilions and famous sites, and the revised edition adds a good deal of new poetry. A buyer going ashore can learn from it what the towns behind the port produce."

[items.samgang_vernacular]
name = "Illustrated Conduct of the Three Bonds (Korean glossed edition)"
lore = "Filial sons, loyal subjects and virtuous wives, each with a picture and a short account; under King Seongjong, Korean script was added so women and children who cannot read Chinese can follow. Villagers gather round the pictures and sometimes sigh over the hardships of the people in them."

[items.juseo_ms]
name = "Yi Hwang: Selected Letters of Zhu Xi (compilation manuscript)"
lore = "Yi Hwang, known as Toegye, chose the most searching passages from Zhu Xi’s vast correspondence and annotated them himself. The draft still passes from disciple to disciple by hand; it has not been printed."

