# Alexander's story becomes a prelude to Malay court genealogies; about 1500 is provisional pending firmer evidence for early versions.
# Melaka's rise, fall and remembered figures become a dynastic narrative shaped by later compilers of earlier memories. Here it is a rumored manuscript, bringing the historical 1612 version into this world early, outside the printed book trade.
