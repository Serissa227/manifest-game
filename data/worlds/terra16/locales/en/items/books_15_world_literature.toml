# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.panchatantra_sanskrit]
name = "Panchatantra (Sanskrit recension)"
lore = "The monkey and the crocodile, the lion and the hare: five books of fables a Brahmin is said to have written to teach three dull princes. The same stories are still recognizable in Arabic, Persian or Latin, so merchants without a common tongue can share the joke."

[items.kathasarit_ms]
name = "Somadeva: Ocean of the Streams of Stories"
lore = "Somadeva of Kashmir wrote this “ocean” of stories for his queen, more than twenty thousand verses long. Again and again a merchant sails, is shipwrecked, washes up on an island and finds his loved ones once more."

[items.pasai_ms]
name = "Chronicle of the Kings of Pasai"
lore = "Merah Silu saw an ant as big as a cat by the sea and named the place Samudera; later he was taught the faith in a dream and became Pasai’s first sultan. That is how the dynasty’s memory twines with dreams and legend."

[items.hamzah_ms]
name = "Hikayat Amir Hamzah (Malay recension)"
lore = "They say that on the night before the Portuguese attacked Malacca, the young warriors asked the sultan for a book to stiffen their courage, and he sent them this hero’s tale. Hamza’s campaigns and adventures are read aloud night after night in Malay courts."

[items.iskandar_ms]
name = "Hikayat Iskandar Zulkarnain"
lore = "Malay royal houses trace their blood to Iskandar, the two-horned Alexander. Reading this romance at court is like reading the first page of the family tree."

[items.nagarakretagama_ms]
name = "Prapanca: Nagarakretagama"
lore = "Prapanca, poet of the Majapahit court, followed the king on his progress through East Java and wrote it on palm leaves, listing the dependencies from Sumatra to the Moluccas. Those who sail the islands can use it to ask after old ties."

[items.jinakalamali_ms]
name = "Jinakala Mali"
lore = "In Chiang Mai the elder Ratanapañña wrote in Pali of how the Dhamma came to Lanna, where the Emerald Buddha came from and which cities have enshrined it. The monks expound it to those who come to learn."

[items.kebra_ms]
name = "Kebra Nagast"
lore = "The Queen of Sheba visits Solomon and bears him Menelik, who brings the Ark of the Covenant home to Aksum. Ethiopia’s kings and monks hold it as the foundation of the royal line and read it with deep solemnity."

[items.fetha_ms]
name = "Fetha Nagast"
lore = "The Coptic jurist Ibn al-Assal’s code, rendered into Ge’ez in the fifteenth century: the first part on the Church, the second on marriage, sales and royal law. Ethiopian judges cite it, and a foreigner needs a cleric to explain it article by article."

[items.vienna_codex]
name = "Codex Vindobonensis (Mixtec pictorial book)"
lore = "A folding screen of deerskin painted with the origins of the Mixtec lords: Nine Wind descends from the sky, and the first ancestors are born from a tree at Apoala. It is said to have crossed to Spain among Cortés’s gifts in 1519, and it has changed hands several times since."

[items.mendoza_codex]
name = "Codex Mendoza"
lore = "Viceroy Mendoza had Mexico City’s painters make it for the emperor: the conquests of the Mexica kings, the tribute of each town, what a child should learn at each age, with Spanish notes that do not always say what the painters meant. The ship carrying it to Spain, they say, was taken by French privateers."

[items.popol_vuh_ms]
name = "Popol Vuh (K'iche' manuscript)"
lore = "K’iche’ nobles have written down their ancestors’ sacred book again in Latin letters: the gods fail to make people from mud and then from wood, and at last make them from maize; twin heroes defeat the lords of Xibalba on their own ball court."

[items.sejarah_ms]
name = "Malay Annals"
lore = "A rumored manuscript: an old minister at the Johor court is said to be gathering the origins of Malacca’s royal house, the loyalty of Hang Tuah and the night the city fell into a single book. No one has seen it whole."

[items.chilam_chumayel]
name = "Books of Chilam Balam (Chumayel tradition)"
lore = "A rumored manuscript: in the villages of Yucatán, people are said to copy a Maya book in Latin letters named for the jaguar prophet Chilam Balam, with its katun count, calendar, prophecies and the wanderings of the ancestors, generation after generation."

[items.kilwa_ms]
name = "Kilwa Chronicle"
lore = "Ali ibn al-Hasan, a prince of Shiraz, sailed south and bought the island of Kilwa for enough cloth to encircle it. The sultans’ genealogy begins with that bargain."

