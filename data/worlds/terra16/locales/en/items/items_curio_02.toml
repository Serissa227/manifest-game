# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.ambergris_lump]
name = "Ambergris lump"
lore = "A grayish lump, soft as wax under the thumbnail, with a sea smell that is hard to name. Two scent dealers argued over whether it was genuine from the noon prayer until sunset."

[items.paradise_specimen]
name = "Bird-of-paradise trade skin"
lore = "The skins come out of New Guinea with no feet. Pigafetta recorded the story that these birds spend their whole lives aloft and never land. A naturalist turned this one over and found the cut."

[items.dodo_feather]
name = "Dodo feather of an early voyage"
lore = "From a big flightless bird on the island of Mauritius, too fat to hurry. An early ship brought this gray feather home, and with every telling the bird grows larger."

[items.hanno_portrait]
name = "Portrait of Hanno the elephant"
lore = "In 1514 the king of Portugal sent Pope Leo X a white elephant, and all Rome turned out to see it. Hanno died two years later. Raphael’s circle painted his portrait, and this is a copy of it."

[items.giraffe_qilin]
name = "Giraffe pictured as a qilin"
lore = "In 1414 envoys from Bengal brought a giraffe to the Ming court, and everyone hailed it as a qilin. The painting carries Shen Du’s hymn of praise, in a hand even more upright than the giraffe."

[items.moneychanger_copy]
name = "Copy of The Money Changer and His Wife"
lore = "A copy of Matsys’s painting of 1514: the husband weighs coins while his wife turns the pages of her prayer book, her eyes drifting to the scales. Lieve’s father insists the couple are her grandparents. Nobody believes him, and he does not care."

[items.corvo_fragment]
name = "Supposed Corvo statue fragment"
lore = "On little Corvo, out in the western Azores, there is said to stand a stone horseman pointing west. The sailor selling this chip swears it was knocked off one of the hooves."

[items.gold_fish]
name = "American gold fish figure"
lore = "A little gold fish cast by the lost-wax method, every scale lifted, a tiny ring held in its mouth. Goldsmiths by the sea cast what they see every day."

[items.gold_bird]
name = "American gold bird figure"
lore = "The gold bird’s wings are so thin they tremble at a touch. Before handing over the box, the craftsman shows the collector where to hold it, where to set it down, and where never to touch."

[items.gold_disk]
name = "Andean worked gold disk"
lore = "A disk beaten out stroke by stroke by an Andean goldsmith. Under the noon sun it shows nothing; tilt it to a low light and the whole face is covered in fine hammer marks."

[items.longquan_celadon]
name = "Longquan celadon dish"
lore = "Longquan glaze the color of a spring pond. A ring left by the kiln support marks the underside, and experts read the kiln from it. In Persia, people believe such a dish will crack by itself if poisoned food is set on it."

[items.zhangzhou_bowl]
name = "Zhangzhou export bowl"
lore = "A Zhangzhou export bowl, coarse sand stuck to its foot and its painting hasty. But it is cheap, and a single ship can carry tens of thousands. This one comes from an early trial firing."

[items.blue_white_flask]
name = "Blue-and-white flask"
lore = "The flat round body packs easily, but the long slender neck breaks just as easily. The merchant winds the neck in turn after turn of straw rope, as if giving it a scarf."

[items.murano_mirror]
name = "Murano mirror"
lore = "Backed with tin and quicksilver, it shows a face far more clearly than any bronze mirror. The dealer points out the little bubbles at the edge first. The backing fears damp, so at sea it travels wrapped tight in oilcloth."

[items.murano_beaker]
name = "Murano thread-glass beaker"
lore = "Threads of white glass spiral through the clear walls, a Murano technique barely a generation old. The packer counts the feet again after every layer of wrapping, for fear of losing one."

[items.murano_bottle]
name = "Murano scent bottle"
lore = "A bottle no bigger than a thumb, its ground-glass stopper fitted perfectly. Travelers unstop it only on the day they make port, unwilling to let the scent drift away in the hold."

[items.sandalwood_piece]
name = "Sandalwood specimen"
lore = "Only a freshly cut face releases the scent. The dealer keeps two columns in his ledger: one for where the seller says it came from, one for where his own nose says."

[items.agarwood_piece]
name = "Agarwood specimen"
lore = "The more resin, the heavier the wood, and the best pieces sink in water. At an incense gathering a few shavings are warmed on a silver leaf and passed around to smell before anyone ranks them."

[items.camphorwood_piece]
name = "Camphorwood specimen"
lore = "Clothes kept in camphorwood stay free of moths, and ship’s chest makers love it. The master hands the apprentice an offcut: smell it, then study the grain, until you know it with your eyes shut."

[items.roc_feather]
name = "Supposed roc feather"
lore = "The roc of the stories can carry off an elephant. This feather is long enough to serve as an oar, though up close it looks rather like a palm frond."

[items.fallen_stone]
name = "Supposed fallen stone"
lore = "The seller says it fell into a wheat field after a streak of fire and was still hot when picked up. The scholar is in no hurry to believe; first the stone is weighed, then the blackened crust at the break is studied."

[items.ancient_coin]
name = "Ancient coin"
lore = "A Roman silver coin, the emperor’s profile worn down to the line of a nose. Fulvio drew the faces in his Illustrium imagines from coins like this; only someone who can read the broken legend will know which emperor it is."

[items.horse_market_edict]
name = "Horse-market edict certificate"
lore = "A court patent issued to the chiefs of the Jurchen tribes; without one, no one may bring tribute to the capital or trade at the horse markets. Each patent is a source of wealth, bought, sold, and fought over among the tribes more fiercely than horses."

[items.venice_voyage_concession]
name = "Venetian voyage concession"
lore = "Each year the Venetian Senate auctions off the voyages of the state galleys, and the winning bidders sell space aboard. This slip is one such share, and whoever holds it pays a little less duty at the customs house."

