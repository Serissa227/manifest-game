# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.sacrobosco_ferrara]
name = "Sacrobosco: On the Sphere"
lore = "A schoolbook three centuries old, first printed at Ferrara. It opens with two circles, the equator and the ecliptic, which apprentices trace in the margins until they climb on deck and find no circles drawn in the sky."

[items.regiomontanus_nuremberg]
name = "Regiomontanus: Ephemerides"
lore = "Printed at Nuremberg, its tables of sun and moon run from 1475 to 1506 and have long expired. Apprentices practice on them anyway, extending the columns into later years in the margins and scraping off the mistakes."

[items.zacuto_leiria]
name = "Zacuto: Almanach Perpetuum"
lore = "The almanac of the Jewish astronomer Zacuto, printed at Leiria. Take the noon height of the sun, look it up against the declination tables, and there is your latitude. Pilots’ figures crowd the margins, worked and struck out and worked again."

[items.regimento_munich]
name = "Regiment of the Astrolabe and Quadrant (Munich version)"
lore = "A few thin leaves that tell you how to find latitude: the astrolabe by day, the quadrant on the Pole Star by night. It carries no date and no printer’s name, and old pilots keep their copies stitched inside a chest lid, lent to no one."

[items.stoeffler_oppenheim]
name = "Stoeffler: Construction and Use of the Astrolabe"
lore = "The brass-founder wants to know how the plate is cut, the observer how the scale is read. This Oppenheim print seats both at one table, where they can argue half an hour over a single engraved line."

[items.garcie_poitiers]
name = "Pierre Garcie: Great Rutter"
lore = "A rutter printed at Poitiers: tide times, the mud and sand a sounding lead brings up, and the Laws of Oleron at the back. Old helmsmen on the Atlantic coast thumb it more often than they unroll a chart."

[items.faleiro_seville]
name = "Faleiro: Treatise on the Sphere and Navigation"
lore = "The author’s brother was once Magellan’s partner. The book covers the heavens, and why a compass sometimes fails to point true north; apprentices who reach the chapter on variation often shut it and go to the rail to look at the compass again."

[items.nunes_lisbon]
name = "Pedro Nunes: Treatise on the Sphere"
lore = "Nunes’s annotated Sphere, with his own new argument bound behind: hold one compass bearing all the way and the ship’s track bends into a curve. An apprentice puzzled over it all night, then asked the helmsman, who said the ship follows the compass and doesn’t care whether it bends."

[items.copernicus_nuremberg]
name = "Copernicus: On the Revolutions of the Heavenly Spheres"
lore = "Printed at Nuremberg, this one puts the sun in the middle. Calendar-makers frown first and then pull out the old tables to check them line by line; observers at sea say little, since their measured altitudes still have to be matched against the old tables."

[items.medina_valladolid]
name = "Pedro de Medina: Art of Navigation"
lore = "Printed at Valladolid, it takes the sphere, the compass and the chart in one run. Pilots preparing for their examination fold corners and score lines at the hard parts, and by the day they sit it, the book is more marks than print."

[items.sufi_ms]
name = "Al-Sufi: Book of the Fixed Stars"
lore = "Al-Sufi wrote it for the court at Shiraz nearly six hundred years ago, and this copy is a copy of copies. Each constellation has its figure, with the Arabic star name beside it; many of the names sailors now take for granted come from pages like these."

[items.ibn_majid_ms]
name = "Ibn Majid: Book of Useful Principles and Rules of Navigation"
lore = "How many fingers high a star stands, which month the monsoon turns, on which day a given harbor should be entered: pilot families have copied it out generation after generation. The old pilots say the book covers the beginning, and the rest you learn on a ship."

[items.mahri_ms]
name = "Al-Mahri: Al-Umda al-Mahriyya"
lore = "Sulaiman al-Mahri, a pilot of Shihr, wrote it for those who sail after him: which guide stars to watch and how to go eastward. Each copyist adds a note in the margin at every new port, and the book has grown half again as thick as the original."

[items.piri_ms]
name = "Piri Reis: Book of Navigation (revised manuscript)"
lore = "Piri Reis’s revised copy for Suleiman holds over two hundred harbor plans, each marked with anchorages, fresh water and reefs. A captain who has sailed the Aegean will find a bay or two drawn more clearly than he remembers it."

[items.shunfeng_ms]
name = "Fair Winds for Escort (Sailing Directions)"
lore = "Compass bearings, watch counts and star-sighting rhymes pass down the ships from one generation to the next; whenever a master proves a new course, he adds a line. The copies thicken as they travel, and nobody knows who wrote the oldest pages anymore."

[items.tycho_copenhagen]
name = "Tycho Brahe: On the New Star"
lore = "In 1572 a new star appeared in the sky, bright enough to see by day. Tycho set down its measured positions one by one, and observers at sea who read him go back through the altitudes in their own notes."

[items.waghenaer_leiden]
name = "Waghenaer: Mirror of Navigation"
lore = "Coastal profiles, charts and sailing directions in one volume, printed at Leiden. A North Sea captain turning to the page on the sandbanks discovers that knowing the shoals need not rest wholly on an old pilot’s memory."

[items.palacio_mexico]
name = "Garcia de Palacio: Nautical Instruction"
lore = "A manual printed in Mexico City on shipbuilding, instruments and the talk of the foredeck. Shipyard apprentices in the Indies used to wait for a Seville ship to bring them books; now the printer down the street can turn one out."

