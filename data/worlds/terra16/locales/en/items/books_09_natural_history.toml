# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.oviedo_toledo]
name = "Oviedo: Summary of the Natural History of the Indies"
lore = "Oviedo spent years in Darién, and he writes of the pineapple’s scent, how to sleep in a hammock, and the bats that bite sleepers for their blood. A slim volume, written for the emperor’s eyes."

[items.acosta_seville]
name = "Acosta: Natural and Moral History of the Indies"
lore = "The Jesuit Acosta reports that the torrid zone is nothing like the uninhabitable furnace of the ancients, and when the Andes passes left him retching, he wrote that down too."

[items.pliny_venice]
name = "Pliny the Elder: Natural History"
lore = "Thirty-seven books, from the stars down to gemstones. Scholars crowd the margins beside the moon’s pull on the tides and the monsoon route to India; sailors say Pliny’s sea is not the one they know."

[items.qazwini_ms]
name = "Al-Qazwini: Wonders of Creation"
lore = "Stars, islands and sea creatures each get their entry, and later copies add bright paintings. On the isle of Waq-waq the trees bear human heads; sailors shake their heads at that, then ask to hear it again."

[items.damiri_ms]
name = "Al-Damiri: Lives of Animals"
lore = "The animals run in alphabetical order, and each entry settles whether it may be eaten, what it means to dream of it, and what the poets have made of it. Cairo’s scholars cite it; its storytellers raid it."

[items.albert_rome]
name = "Albert the Great: On Animals"
lore = "Albert the Great comments on Aristotle’s animals and adds what he learned by asking fishermen and falconers. Friars teaching from the Roman printing hold it up against whatever lies on the fish stall."

[items.bartholomew_english]
name = "Bartholomaeus Anglicus: On the Properties of Things (English edition)"
lore = "Trevisa’s English translation, printed by Wynkyn de Worde and said to be the first book printed on paper made in England. Nineteen books run from the angels to colors and smells, and English merchants treat it as the place to look anything up."

[items.carta_marina_venice]
name = "Olaus Magnus: Carta Marina"
lore = "Nine woodblocks make up this great map of the North: whales the size of islands off Norway, a serpent coiled round a ship, the Lofoten whirlpool turning. You still need the lead line to sound the depths, but nobody looks away quickly."

[items.shanhaijing_daozang]
name = "Classic of Mountains and Seas (Zhengtong Daoist Canon text)"
lore = "The Classic as preserved in the Daoist Canon, with Guo Pu’s notes between the lines. Nine-tailed foxes, the feathered people, the folk with holes through their chests: scholars smile as they read, while seafarers quietly memorize a few of the country names."

[items.yiyu_guangxin]
name = "Illustrated Record of Foreign Regions"
lore = "A Guangxin printing of more than a hundred and sixty lands, each with a portrait and a few lines of notes. The faces are the compilers’ idea of distant peoples; show them to the people themselves and most will laugh."

[items.haiyu_print]
name = "Huang Zhong: Words on the Seas"
lore = "Retired to Nanhai, Huang Zhong listened to pilots and foreign merchants and sorted their tales into customs, products, perilous passages and sea marvels. Passengers open it first to the dangerous stretch they have sailed themselves."

[items.gesner_zurich]
name = "Gesner: History of Animals (Volume I)"
lore = "In Zurich, Gesner weighs old books, letters from correspondents and his own eyes to make a volume of four-footed beasts, Dürer’s rhinoceros among them. The volumes on birds, fish and serpents are still on their way."

[items.rondelet_lyon]
name = "Rondelet: On Marine Fishes"
lore = "Rondelet, a Montpellier physician, dissected fish beyond counting and drew them so true a fisherman knows each at a glance. Yet the sea monk and the sea bishop are in here too, and a ship’s surgeon reaching those pages always asks: who actually saw one?"

[items.olaus_rome]
name = "Olaus Magnus: History of the Northern Peoples"
lore = "From exile in Rome, the archbishop of Uppsala wrote his homeland into twenty-two books: hunters on skis, markets on the ice, sea serpents wrapped round ships. Travelers heading north pack it, and in Bergen they ask which parts are true."

[items.munster_basel]
name = "Munster: Cosmographia"
lore = "Münster fits the whole world into one great German book, with a woodcut for city after city and monsters swimming across the sea maps. The Basel press revises it nearly every year and still sells out."
