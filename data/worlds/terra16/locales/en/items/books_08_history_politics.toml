# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.schedel_nuremberg]
name = "Schedel: Nuremberg Chronicle"
lore = "More than eighteen hundred woodcuts run from the Creation to the Last Judgment. Look closely and you will catch the same city view printed again under another town’s name."

[items.vergil_inventors]
name = "Polydore Vergil: On the Inventors of Things"
lore = "Who first raised a sail, struck a coin, wrote a law? Polydore Vergil combed the ancients for an answer to each. When a dinner argument turns to who thought of something first, some scholar always reaches for this book."

[items.ocampo_zamora]
name = "The Four Parts of the Chronicle of Spain"
lore = "Alfonso the Wise ordered this history of Spain, and the emperor’s chronicler Ocampo saw it through the press at Zamora. It opens with Hercules raising his pillars at the Strait and founding cities, and Castilian gentlemen love to hunt through it for their own roots."

[items.tongjian_ms]
name = "Outline and Details of the Comprehensive Mirror (Ming copy)"
lore = "Large characters give the outline, small ones the details: Zhu Xi recast thirteen centuries of history so that every entry passes judgment. This copy bears no date, only the red-ink marks of generations of schoolmasters."

[items.castiglione_venice]
name = "Castiglione: Book of the Courtier"
lore = "Four evenings of talk at the court of Urbino: how to ride, jest and play the lute without ever seeming to try. Travelers bound for their first audience tend to arrive with the corners of this book worn soft."

[items.erasmus_prince]
name = "Erasmus: Education of a Christian Prince"
lore = "Erasmus wrote it for the sixteen-year-old Charles: a prince should be a father to his people, and war the very last resort. The Roman Index of 1559 banned his works wholesale."

[items.machiavelli_rome]
name = "Machiavelli: The Prince"
lore = "In Machiavelli’s lifetime it passed only from hand to hand among Florentine friends; Blado printed it in Rome a few years after his death. In 1559 the same city’s Index put it on the banned list."

[items.siete_seville]
name = "The Seven Partitions"
lore = "Alfonso the Wise divided his code into seven parts, and the second has a whole title on war at sea: what the admiral, the captains and the sailors each owe. More than two centuries on, Castilian judges still cite it."

[items.consulate_barcelona]
name = "Book of the Consulate of the Sea"
lore = "Whose cargo went over the side in the storm, when the freight comes due, who bears the loss on a shared hull: when Mediterranean shipowners take a quarrel to the sea consuls, this is the book the judges open."

[items.manueline_lisbon]
name = "Manueline Ordinances (definitive edition)"
lore = "King Manuel’s ordinances in their settled form, five books running from officials’ duties to punishments. The clerks at the Lisbon customs house keep it open on the desk and fill out your clearance papers exactly as it prescribes."

[items.khalil_ms]
name = "Mukhtasar Khalil"
lore = "Khalil pressed Maliki law into sentences so spare that no one reads them without a teacher’s commentary. From Fez to Timbuktu students memorize it line by line, and caravan contracts are settled by it."

[items.ming_law_ms]
name = "Great Ming Code (copy of the Hongwu recension)"
lore = "The Hongwu recension of 1397, four hundred and sixty articles. Even coastal boatmen who cannot read have heard someone recite the one against slipping abroad or putting to sea in defiance of the ban."

[items.ming_huidian_print]
name = "Collected Statutes of the Great Ming (Zhengde edition)"
lore = "How often each country may bring tribute, at which port its envoys land, how many may travel on to the capital: all of it has precedent here. Before an interpreter handles a foreign merchant’s formalities, he turns to the chapters on the Ministry of Rites."

[items.melaka_laut_ms]
name = "Maritime Laws of Melaka"
lore = "Once a ship leaves the shore, its master is king at sea: that is the root of the Melaka sea laws. They set out the helmsman’s place, the pilot’s and the division of the holds, and every port’s copy adds rules of its own."

[items.goseibai_ms]
name = "Goseibai Shikimoku"
lore = "Hōjō Yasutoki’s fifty-one articles were drawn up to settle warriors’ land suits. In the temples children copy them for handwriting practice and learn along the way that land held for twenty years stays with its holder."

[items.index_rome]
name = "Roman Index of Prohibited Books"
lore = "Paul IV’s list is unusually harsh; even Erasmus is banned entire. Booksellers go down it line by line, and a book that sat by the door yesterday is today something to ask about quietly in the back room."

[items.index_valladolid]
name = "Valladolid Index of Prohibited Books"
lore = "Inquisitor General Valdés issued this Spanish list, and it does not match Rome’s. Anyone with a Lazarillo at home who reaches this page quietly pushes that book a little deeper into hiding."

[items.jixiao_ms]
name = "Qi Jiguang: New Treatise on Military Efficiency (early manuscript)"
lore = "Qi Jiguang’s drafts from his training camps in Zhejiang: how to form the mandarin-duck formation, how wolf-brush spear, rattan shield and long spear cover one another, how to read the flags and drums. Not yet cut for print, it passes from officer to officer by hand."

[items.chouhai_print]
name = "Zheng Ruozeng: Illustrated Compendium of Maritime Defence"
lore = "Zheng Ruozeng, on Hu Zongxian’s staff, mapped the coast from Guangdong to Liaodong, marking which inlets give anchorage and which channels the wokou raiders favor. Headlands every boatman knows appear here as beacon posts."

[items.shenqi_print]
name = "Zhao Shizhen: Register of Firearms"
lore = "A rumored manuscript: drawings of the Rumi musket and the thunderbolt gun, barrels, locks and all, said to be firearm methods a minor official in the capital learned from an envoy out of the far west. No bookshop has ever seen it in print."

[items.montaigne_bordeaux]
name = "Montaigne: Essays (Books I–II)"
lore = "In his tower library near Bordeaux, Montaigne writes about himself, and about the Brazilians brought to Rouen. Everyone, he says, calls barbarous whatever is not his own custom."

[items.agrippa_vanitate]
name = "Agrippa: On the Uncertainty and Vanity of the Sciences"
lore = "Agrippa takes every branch of learning to task in turn, his own long-cherished occult studies included, and readers laugh and wince at once. The Roman Index of 1559 banned his works."

[items.jinno_ms]
name = "Kitabatake Chikafusa: Chronicle of the Direct Descent of Divine Sovereigns"
lore = "“Great Japan is the land of the gods.” Kitabatake Chikafusa wrote that opening line in a castle in Hitachi in the middle of a war, to explain the line of succession to the Southern Court’s boy emperor. Courtiers and temples still copy it."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# The Song historical outline remains in Ming classrooms; about 1500 represents this kind of later copy rather than the work's composition.
# These shipboard rules distinguish master, pilot and cargo spaces; their layered compilation makes about 1500 a catalog anchor rather than an exact date.
# Drawings and explanations compare firearm designs, inviting craftsmen to consider their place in existing drills. Here it is a rumored manuscript, bringing the historical 1598 version into this world early, outside the printed book trade.
