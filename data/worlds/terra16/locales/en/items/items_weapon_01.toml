# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.toledo_rapier]
name = "Toledo rapier"
lore = "Toledo steel, a long slender blade, a guard of looping iron rings. Fencing-school apprentices learn first to protect the sword hand; once their fingers are safe, they may start boasting about the edge."

[items.damascus_sabre]
name = "Damascened sabre"
lore = "The watered pattern on the blade looks like wind across dunes. Every seller swears it came from Damascus; where the smith really worked, only the sword knows."

[items.ottoman_yatagan]
name = "Ottoman yatagan"
lore = "The blade curves in, then sweeps out again, like a pen stroke left unfinished. The one the palace workshop made for the sultan has a scabbard crusted with gold and gems; this one’s is plain copper, and the edge is every bit as keen."

[items.mamluk_sword]
name = "Mamluk sword"
lore = "A straight sword from an old Mamluk soldier, the scabbard fitted later. The seller can talk all afternoon about whom it cut down; the wear on the blade says less, and says it more honestly."

[items.venetian_cinquedea]
name = "Venetian cinquedea"
lore = "Five fingers wide at the hilt and tapering to the point, hence its name. Venetians wear it across the small of the back under the coat, because by the Rialto the crowd is too thick to draw anything longer."

[items.german_greatsword]
name = "German two-handed sword"
lore = "A two-handed sword taller than a man, carried on the shoulder on the march. Veterans teach recruits the recovery first: the swing is easy, but finish it off balance and you are the next one down."

[items.swiss_halberd]
name = "Swiss halberd"
lore = "Axe blade, hook, and spike on a single pole; when the Swiss form their square, it is a forest of iron. At sea it is another matter, since one swing beside the rail is likeliest to catch a shipmate."

[items.scots_broadsword]
name = "Scots broad sword"
lore = "A broadsword out of the Scottish Highlands, its guard arms sloping forward and ending in four-leaved rings. The smith says the pattern was already old in his grandfather’s day."

[items.bizen_tachi]
name = "Bizen tachi"
lore = "An Osafune blade from Bizen, remounted several times over, the steel itself unchanged. Take off the hilt and there is a signature on the tang, half eaten by rust, for a knowing dealer to puzzle out against the light."

[items.wakizashi]
name = "Wakizashi"
lore = "A hand shorter than the long sword, so it can be drawn even in the cramped space below deck. Samurai who travel by ship have the scabbard mouth tightened, because a blade sliding loose in a heavy sea draws blood."

[items.mio_naginata]
name = "Nurse's naginata"
lore = "Ase taught Mio the naginata with the footwork of the sculling oar: front foot planted, hips riding the tide. Two places on the shaft are worn bright, the high one where Ase always held it, and the low one, as far up as a small Mio could reach."

[items.ming_yanlingdao]
name = "Ming yanlingdao"
lore = "A gently curved blade whose point lifts like a wild goose’s feather. Coastal garrison soldiers heft one before taking it from the armory, and hang it at the waist only when the curve and weight suit the hand."

[items.qi_long_sword]
name = "Qi army long sword"
lore = "The long sword Qi Jiguang learned from the wokou, long in the blade and long in the grip, held in both hands. In Qi’s army, though, swordwork is only half of it; the other half is the squad, where even the bravest guards the man beside him."

[items.sea_spirit_kris]
name = "Seven-wave kris, Sea Spirit"
lore = "Seven waves in the blade, like the swells rolling in off Ternate one after another. The household calls it Sea Spirit, and Kaicili lays a hand on its hilt only when making a promise."

[items.parang]
name = "Parang"
lore = "A broad, heavy-headed blade for cutting paths and vines in the forest. In port it keeps busy too: one stroke parts a rotten lashing on the ship’s timbers."

[items.swahili_short_sword]
name = "Swahili short sword"
lore = "A short sword Swahili merchants belt on beneath the robe, where no one sees it from one day to the next. The Mombasa wind carries salt all year, and three days without oil leaves the blade spotted with rust."

[items.omani_dagger]
name = "Omani curved dagger"
lore = "The curved dagger an Omani wears at the center of the belt is part of being dressed; going out without it is like going out bareheaded. This one’s sheath is plain silver with little ornament."

[items.ix_obsidian_knife]
name = "Ix's obsidian knife"
lore = "Obsidian ground thinner than steel, quick through a cacao pod or a cotton thread, and chipped by a single knock. Ix keeps it in a soft cloth pouch her mother sewed, and always wipes it clean before putting it back."

[items.mexica_macua]
name = "Mexica macuahuitl"
lore = "A wooden club edged on both sides with obsidian blades sharp enough to shave a lock of hair. The stone chips easily, and every missing blade means a trip back to an old stoneworker who knows obsidian."

[items.atlatl]
name = "Atlatl"
lore = "A short wooden handle with a hook at the end that seats the butt of the dart, as if the arm had grown another joint. The thrower checks that hook and dart fit before working the distance out step by step."

[items.inca_star_mace]
name = "Andean star-headed mace"
lore = "A star-shaped bronze head on a hardwood haft. Escorts on the mountain roads give the head a shake every morning before setting out: if the joint works loose, the first swing sends it flying."

[items.benandanti_fennel]
name = "Benandanti fennel bundle"
lore = "The good walkers of Friuli say that on Ember Day nights their spirits leave their bodies with fennel stalks in hand to fight witches armed with sorghum in the fields. This bundle still smells sweet when dry, and carrying it steadies the feet on a night road."

[items.hayreddin_sabre]
name = "Sabre attributed to Hayreddin"
lore = "An old Algiers sailor stood up the moment he saw the guard and swore he had seen this sword aboard Barbarossa’s ship when he was young. Whether it is truly that one, he cannot say for certain. The rest must be asked of those still living."

[items.old_commander_sword]
name = "Old commander's sword"
lore = "The old commander rarely drew it. What Noël remembers best is the commander laying it flat on the table and saying, “Put the sword down first. Then you can apologize.”"

[items.schiavona]
name = "Venetian schiavona"
lore = "The doge’s guard is largely Dalmatian, and their broadswords wrap the whole hand in crossing iron bars. This one is an early form, with only a few bars."

[items.seki_katana]
name = "Seki katana"
lore = "Seki in Mino makes blades for use, not show: easy to sharpen, slow to chip under hard knocks. Seki has smiths aplenty, and they take orders from great houses and still sell to the ronin who guard merchant trains."

[items.ming_changdao]
name = "Ming long-bladed sword pattern"
lore = "A long, narrow blade on a long grip; from a distance it looks like a slender shoot of grain. Ming soldiers drill cuts and thrusts with it in both hands, and in camp they simply call it the long sword."

[items.east_african_spear]
name = "East African spear"
lore = "The head was forged by a Kilwa smith, the shaft shaped by the caravan’s carpenter. Before heading inland the leader shakes every spear in turn and replaces any loose shaft on the spot; the sharpest head is useless on a broken shaft."

[items.maya_wood_club]
name = "Maya inset-stone club"
lore = "A hardwood club set with rows of flint blades. Canoe escorts wrap each blade in cotton before they board, because a chip knocked off in a rough crossing cannot be replaced on that shore."

[items.practice_sword]
name = "Fencing-school wooden sword"
lore = "A fencing-school sword of wood, matched to a real blade in length and weight. Beginners drill the same footwork against a post every day until sweat polishes the grip."

[items.boarding_axe]
name = "Boarding axe"
lore = "An axe blade on one side and a spike on the other. Day to day it cuts fouled lines; in a boarding action it hacks through netting. Before sailing the bosun raps the head on the deck to hear whether the wedge is loose."

[items.watch_staff]
name = "Night-watch staff"
lore = "When an Antwerp apprentice takes a turn on night watch, this staff goes along the streets, tapping at each door to call the hour. It can strike a blow, but mostly it tells the sleeping city that someone is awake tonight."

[items.indian_katar]
name = "Indian katar"
lore = "The grip runs crosswise between two side bars, so fist and blade form one straight line and the thrust lands like a punch. The masters drill the recovery: whatever goes out must come back, or the wrist breaks first."

[items.persian_shamshir]
name = "Persian curved sword"
lore = "A blade curved like a new moon, narrowing to a needle point. A Qazvin dealer balances it across two fingers and prices it on steel and heft alone; if anyone says some shah once carried it, he laughs."

[items.javanese_spear]
name = "Javanese short spear"
lore = "The head is shaped like a small kris, and the shaft is short enough to stow in a little island boat. Its cover is woven palm leaf, and rain does not trouble it."

[items.river_boathook]
name = "Ferry boathook"
lore = "An iron hook on a long bamboo pole that the ferryman uses to catch lines, push off the bank, and haul back drifting boats. Only when someone creeps aboard at night does it swing around and serve as a spear."

[items.toledo_rapier_master]
name = "Toledo rapier — masterwork"
lore = "A late work by an old Toledo smith, unsigned save for a small stamp at the base of the blade. It bends into a half circle and springs back true. Swords like this never hang in a shop; they change hands in swordsmen’s wills."

[items.bizen_tachi_master]
name = "Bizen tachi — masterwork"
lore = "Forged late in life by a master of Bizen, the temper line a run of clove blossoms rising and falling in perfect order. The family will not sell it; it leaves the house only as a gift at a daughter’s wedding or an heir’s succession."

[items.damascus_sabre_master]
name = "Damascened sabre — masterwork"
lore = "Here the watering is as fine as light on silk, and the edge parts a hair blown across it. It has changed owners several times between Damascus and Cairo, always by will or through a quiet broker."

[items.schiavona_master]
name = "Venetian schiavona — masterwork"
lore = "The guard’s bars cross closer than usual, caging the whole hand without weighing it down, and the pommel is plain bronze. An old Dalmatian guardsman left it to his son, who in turn entrusted it to someone else."

