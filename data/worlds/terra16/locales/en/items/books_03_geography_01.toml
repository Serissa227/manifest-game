# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.columbus_barcelona]
name = "Columbus: Letter on the First Voyage"
lore = "Columbus’s letter to the king’s treasurer, written on the voyage home, is thin as a handbill and reprinted city after city; the Cuba and Hispaniola it describes become new names on European desks."

[items.vespucci_mundus]
name = "Vespucci: Mundus Novus"
lore = "This Latin letter to a Medici patron calls the land across the southern sea a “new world,” and tells of its unfamiliar stars and of people who wear no clothes."

[items.paesi_vicenza]
name = "Paesi Novamente Retrovati"
lore = "Cadamosto’s Guinea voyages and the Portuguese reports from India are bound into one volume, so a merchant hunting for news of prices no longer has to search the whole quay for a man just off the boat."

[items.varthema_rome]
name = "Varthema: Itinerary"
lore = "Varthema passed as a Muslim and went to Mecca, Aden and Calicut and on to the Spice Islands; the journey is long and the marvels many, and a merchant reading it must separate the names of goods from the tall tales."

[items.martyr_alcala]
name = "Peter Martyr: Decades of the New World (first three decades)"
lore = "Peter Martyr listens at court to returned navigators and turns their stories into Latin letters for his friends in the Church; he never set foot in the New World, and every shore in the book was seen by someone else."

[items.enciso_seville]
name = "Enciso: Suma de Geographia"
lore = "The front is solar declination tables and the method for taking latitude, the rest runs on through distant coasts and harbors; Enciso served as a magistrate in the Indies himself, so some of the roads are ones he has walked."

[items.diaz_venice]
name = "Juan Diaz: Account of Grijalva's Voyage"
lore = "The priest aboard Grijalva’s ship records the stone towers of Cozumel and the towns along the Yucatán coast, all fresh and strange, though the customs are seen through a stranger’s eyes."

[items.cortes_seville]
name = "Cortes: Second Letter of Relation"
lore = "In Cortés’s letter to the emperor the lake city, its markets and its temples are set down in clear detail; when he comes to the fighting in the city, every line can be seen defending his own conduct."

[items.pigafetta_paris]
name = "Pigafetta: First Voyage Around the World (French abridgement)"
lore = "A survivor of Magellan’s fleet, Pigafetta tells his tale in this French abridgement printed at Paris; when captains reach the pages about chewing leather and drinking foul water on the Pacific, they frown harder than at the giants and monsters."

[items.barbosa_ms]
name = "The Book of Duarte Barbosa"
lore = "Barbosa served as a clerk at Cannanore and learned Malayalam; this manuscript passes among the king’s officials in India, and its figures for each port’s coins, weights and prices are all things a man can put to use."

[items.pires_ms]
name = "Tome Pires: Suma Oriental"
lore = "Pires wrote this account of the trade at Malacca and Cochin, and it still moves only in handwritten copies; anyone planning to do business at Malacca copies out the chapters on duties and monsoons first."

[items.schoner_nuremberg]
name = "Schoner: Luculentissima Description of the World"
lore = "This slim booklet accompanies a globe and explains how land and sea lie on the sphere; a mapmaker opens it and picks holes in the world he carries in his head."

[items.alvares_lisbon]
name = "Alvares: True Account of the Land of Prester John"
lore = "Alvares lived in Ethiopia six years with the embassy, and his book records rock-hewn churches, a court in tents and the roads of the highlands; travelers from the Red Sea hold it against the tales of Prester John."

[items.ramusio_venice]
name = "Ramusio: Navigations and Voyages (Volume I)"
lore = "Ramusio has gathered scattered African and Asian travel accounts into one Italian volume; the same port looks three different ways in three writers’ hands, and travelers flip back and forth to compare."

[items.mandeville_ms]
name = "The Travels of Mandeville (Old French manuscript)"
lore = "The pilgrim road is described in careful detail, and after that come dog-headed men, one-eyed giants and a fountain of youth. A traveler carrying this old French manuscript should not take every page for a signpost."
