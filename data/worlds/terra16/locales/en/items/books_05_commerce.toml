# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.gemma_antwerp]
name = "Gemma Frisius: Principles of Astronomy and Cosmography"
lore = "Tucked into Frisius’s introduction to the heavens is an idea: carry a clock that keeps good time, compare it with local noon, and you have your longitude. Clockmakers shake their heads; the first lurch of the ship will throw it off."

[items.almanach_ulm]
name = "Stoeffler and Pflaum: Almanach Nova"
lore = "This Ulm almanac reckoned that in 1524 the planets would gather in Pisces and bring a great flood. Whole towns panicked, some built arks and some moved uphill, and the rain that year was no worse than usual. These days people take it down mostly for a laugh."

[items.pacioli_venice]
name = "Pacioli: Summa of Arithmetic, Geometry and Proportions"
lore = "Debit on one side, credit on the other, every entry matched by its other half. Pacioli’s great volume is thick enough to need both hands, and counting-house apprentices who open it at the bookkeeping chapters do not put it down."

[items.treviso_print]
name = "Treviso Arithmetic"
lore = "The first arithmetic ever sent to press, it teaches reckoning with pen rather than counters. Its sums are all partnerships and price conversions; work through them before you buy a hold of cargo and you will lose less."

[items.borghi_venice]
name = "Piero Borghi: Arithmetic"
lore = "Fineness of gold and silver, exchange between coins, barter for goods: all become exercises. Venetian counting-house clerks keep a copy in the drawer, its corners scrawled with what each coin fetched that day."

[items.mercatantie_florence]
name = "Book of Merchandise and Customs of Countries"
lore = "Every port has its own weights and its own way of paying. This Florentine merchants’ book lists goods, weights and customs place by place, and its first piece of advice is always the same: ask which pound they mean before you talk price."

[items.nicolas_lisbon]
name = "Gaspar Nicolas: Practical Arithmetic"
lore = "A practical arithmetic in Portuguese, whose sums are quintals of pepper and discounts on bills of exchange. Factors bound for India read it like a first look at the books they will keep there."

[items.ries_lines]
name = "Adam Ries: Reckoning on the Lines"
lore = "Written in German, with no Latin required. Counters are pushed across a lined board, and a burgher’s son who practices for a month or two can close the shop’s accounts."

[items.ympyn_dutch]
name = "Ympyn: New Instruction in Bookkeeping (Dutch edition)"
lore = "A Dutch edition published by a merchant’s widow for her late husband. Its model ledgers are ruled in the Italian manner, column by column, and a copy often lies open on an Antwerp clerk’s desk."

[items.cardano_ars]
name = "Cardano: Ars Magna"
lore = "A great book on cubic and quartic equations, hard going for an ordinary clerk and good for many long nights for a lover of numbers. Tartaglia tells anyone who will listen that Cardano cheated him of the solution."

[items.wujing_reprint]
name = "Wu Jing: Complete Classified Methods of the Nine Chapters (reprint)"
lore = "Land, interest and goods conversions are sorted into chapters of worked problems, abacus rhymes included. Counting rooms in Jiangnan check a new venture by old methods handed down from their forebears."

[items.euclid_ratdolt]
name = "Euclid: Elements (Ratdolt edition)"
lore = "Ratdolt’s Venice printing, the first Elements in print, sets its diagrams in the margins where the eye can’t miss them. The carpenter who measures ship timber and the pilot who reads a chart’s scale both start at Book One, Proposition One."

[items.apian_landshut]
name = "Apian: Cosmographic Book"
lore = "Paper discs are pasted into the pages and turn on pins, so an astronomy problem becomes a desk exercise. A good apprentice who reaches the last disc looks up and asks how on earth one finds longitude."

[items.agricola_basel]
name = "Agricola: De Re Metallica"
lore = "Woodcuts show every shaft, furnace, water wheel and bellows, plainly enough for an outsider. A metal dealer turns to a page, carries it to a workshop, and asks why this step should cost so much."

[items.qabus_ms]
name = "Qabusnama"
lore = "An old Persian prince’s advice to his son, running from how to treat a friend to how to run a trade, copied out for nearly five hundred years. Anyone far from home who opens it will stop at some line or other."
