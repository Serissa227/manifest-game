# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.hortus_mainz]
name = "Hortus Sanitatis"
lore = "A big Mainz folio that gathers herbs, beasts and minerals together, with more little woodcuts than anyone can get through. A ship’s doctor must read it with a sharp eye: which entries are real medicine, and which are marvels copied for centuries."

[items.brunschwig_strasbourg]
name = "Brunschwig: Art of Distillation"
lore = "Furnace, pot and coil are drawn piece by piece, so a coppersmith can hammer out a copy. The ship’s doctor turns to a different page: how to bottle a medicinal water so that it survives a long voyage."

[items.dioscorides_aldine]
name = "Dioscorides: Materia Medica (Greek edition)"
lore = "The Greek text from Aldus’s press at Venice keeps every ancient drug name. Apothecaries in new ports still cry their wares under the old names, and a ship’s doctor who reads Greek can tell on the spot whether it is the real thing or just another herb with the same name."

[items.dioscorides_ruel]
name = "Dioscorides: Materia Medica (Ruel's Latin translation)"
lore = "Ruel’s new Latin translation lies on the medical school’s desks. An apothecary’s apprentice reads it with a bag of unidentified seeds at his elbow and matches them one by one against the descriptions."

[items.dioscorides_mattioli]
name = "Dioscorides: Materia Medica (Mattioli's Italian commentary)"
lore = "Mattioli annotates the old text entry by entry in Italian, matching its herbs against what actually grows on Tuscan hillsides. Where he disagrees he says so bluntly, and the apothecary reading him nods and frowns in turn."

[items.avicenna_milan]
name = "Avicenna: Canon of Medicine (Latin edition)"
lore = "A medical-school textbook thick enough to sleep on, five books from the pulse to the prescription, printed at Milan early on. A doctor carries it ashore, and however complete the rules, the touch still has to be his own."

[items.hutten_mainz]
name = "Hutten: On Guaiac and the French Disease"
lore = "The knight-writer Hutten caught the French disease himself, took a course of guaiac, declared himself cured, and wrote the whole business down. Merchants in the wood trade gained a fine sales pitch from it, but whether the cure works is not something to take from the seller."

[items.fracastoro_verona]
name = "Fracastoro: Syphilis"
lore = "In this Latin poem the shepherd Syphilus offends the sun god, falls ill, and is saved at last by guaiac wood from the Americas. A ship’s doctor reads it for the verse, not for a recipe; sixteen years later the author wrote On Contagion, and that is the book about how the sickness spreads."

[items.fuchs_basel]
name = "Fuchs: History of Plants"
lore = "A great herbal printed at Basel, with leaf, flower and root drawn plant by plant so clearly that an apothecary’s apprentice can know them. New crops from across the sea, maize among them, have found a place on its pages; at the back the draftsmen and woodcutters are given portraits of their own, rare in those days."

[items.vesalius_basel]
name = "Vesalius: On the Fabric of the Human Body"
lore = "Great anatomical plates printed at Basel: muscle peeled back layer by layer, a skeleton leaning on a wall as if lost in thought. Surgeons hold them against the wounds they have sawn and stitched, and begin to suspect that a few of their masters’ lessons were wrong."

[items.yishu_sakai]
name = "Xiong Zongli: Complete Medical Writings (Sakai reprint)"
lore = "A medical compendium from the Jianyang presses, carried across the sea to Sakai and cut again for reprinting. A physician who reads Chinese checks its prescriptions against the medicine chest ingredient by ingredient: this one aboard, that one to be bought ashore."

[items.jiuhuang_reprint]
name = "Zhu Su: Herbal for Famine Relief (Jiajing reprint)"
lore = "Prince Zhu Su, a son of the Hongwu Emperor, planted wild greens throughout his Kaifeng garden and drew them one by one: this leaf must be rinsed, that root boiled through. Men landing on a strange shore, reading it, learn what it costs to mistake a plant."

[items.ibn_baytar_ms]
name = "Ibn al-Baytar: Compendium of Simple Drugs and Foods"
lore = "Ibn al-Baytar of Málaga compiled it at Damascus over three hundred years ago, and copyists have carried it down ever since. One drug goes by different names in Cairo, Baghdad and the Maghreb, and he sets them side by side; drug merchants use it to settle their accounts."

[items.dodoens_antwerp]
name = "Dodoens: Cruydeboeck"
lore = "Dodoens writes of plants in Dutch rather than Latin, and for the first time an Antwerp apothecary’s apprentice can look up a herb on his own. The spices and barks newly landed on the quay at last have a book to be checked against."

[items.orta_goa]
name = "Garcia de Orta: Colloquies on the Drugs of India"
lore = "Orta, a physician at Goa, writes his book as a dialogue: one speaker quotes the old authorities, the other tells what he has seen, and the drugs in the old books often don’t match those the Indians sell. A buyer fresh from Europe, reading it, learns that knowing only the European names will make him a mark."

[items.bencao_ms]
name = "Li Shizhen: Compendium of Materia Medica (completed manuscript)"
lore = "Li Shizhen of Qizhou took twenty-seven years to bring his manuscript to its final form. No print shop has agreed to cut it yet, so readers borrow a few chapters to copy, and its corrections of confused drug names are already going around among physicians."
