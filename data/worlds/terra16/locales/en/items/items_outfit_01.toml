# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.flemish_lace_dress]
name = "Flemish lace-trimmed gown"
lore = "A finger’s width of openwork edging at collar and cuffs, picked out stitch by stitch by Bruges lacemakers. Fine enough for a family banquet without anyone calling it showy."

[items.venice_carnival_dress]
name = "Venetian carnival dress and mask"
lore = "The mask rides at the top of the chest in its own silk wrapping. Behind it no one knows the face, but the moment the wearer speaks, the accent gives the game away."

[items.spanish_knight_coat]
name = "Spanish knight's coat"
lore = "Black wool, cleanly cut, the safest choice for an audience with someone important. At sea, though, every fleck of dried spray leaves a white rim that has to be sponged away."

[items.portuguese_cape]
name = "Portuguese voyager's cape"
lore = "A heavy wool cape. While the fleet waits for the wind at Belém, sailors roll it up for a pillow on the quay; in port, the first chore is brushing the salt out of the nap."

[items.english_doublet]
name = "English doublet"
lore = "The London tailor left a little extra room across the shoulders and fewer points to tie. A merchant’s apprentice can haul account chests in it without unlacing every time."

[items.ottoman_kaftan]
name = "Ottoman kaftan"
lore = "Bursa silk woven with pomegranates, proper dress for an audience at court. The true robe of honor, though, is one the palace bestows; no purchase counts, however costly."

[items.moroccan_cloak]
name = "Moroccan cloak"
lore = "A hooded cloak of coarse wool. On cold mornings in Safi travelers wrap up until only their eyes show; by the midday market they have the hem hitched up into their belts."

[items.arab_robe_turban]
name = "Arabian robe and headcloth"
lore = "A loose, airy robe and a headcloth whose tail pulls up over nose and mouth. Unloading on the quay at Jeddah, the first thing is to roll the sleeves past the elbow."

[items.swahili_white_robe]
name = "Swahili white robe"
lore = "White cotton that dries within the hour in the Mombasa sea breeze. Before calling at a merchant’s house, the wearer stands at the door smoothing the folds again and again."

[items.gujarat_printed_coat]
name = "Gujarati printed coat"
lore = "Cambay prints travel the whole Indian Ocean in merchants’ holds, and this coat was cut from them. The collar has been mended once, and carefully: it is worn every day."

[items.mughal_brocade]
name = "Mughal brocade robe"
lore = "Gold-shot brocade that blazes through a court ceremony. Once aboard, its owner folds it into the bottom of a chest and gets back into old cotton."

[items.malay_sarong]
name = "Malay wax-resist sarong"
lore = "The pattern is drawn in wax before the cloth goes into the dye, so the waxed lines stay pale. A Malacca cloth dealer calls it an old Javanese design; how old, only a grandmother who has woven all her life can say."

[items.ming_round_robe]
name = "Ming round-collared robe"
lore = "A plain round-collared robe; a scholar straightens the collar before stepping out. No rank badge, no embroidery, nothing an official could call presumptuous."

[items.flying_fish_robe]
name = "Flying-fish robe"
lore = "The flying-fish pattern is an emperor’s gift, worn through the palace gates by the Embroidered Uniform Guard. Putting it on without a decree of bestowal is a crime under the code, so how this one came to hand must be explained in person."

[items.fujian_work_clothes]
name = "Fujian fisher's working clothes"
lore = "Short jacket, short trousers, cuffs that stop at the forearm so they stay dry hauling nets. Sun and sea wind have stiffened the cloth, and putting it on brings back the little boat moored at home."

[items.kosode]
name = "Japanese kosode"
lore = "A plain kosode with every stitch hidden inside. When the old folks teach a child to dress, the first lesson is left panel over right; the other way around is how the dead are dressed."

[items.jinbaori]
name = "Jinbaori"
lore = "A sleeveless surcoat worn over armor, the family crest dyed across the back. Ashore it cuts a fine figure in the wind; aboard, the hem must be tied down or the first gust will take it over the side."

[items.domaru]
name = "Do-maru armor"
lore = "Lacquered scales laced together with silk cord. After rain it must be dried at once, because rotten lacing means the armor falls apart; an old warrior would sooner pay for new cord than for fresh lacquer."

[items.nanban_armor]
name = "Nanban-style cuirass"
lore = "A breastplate off a Portuguese ship, remounted by a Japanese armorer with local skirts and sleeves. There is a dent in the chest the seller says was a proof shot. It did not go through."

[items.korean_robe]
name = "Korean scholar's robe"
lore = "A Korean scholar crossing the sea to study keeps robe and hat in perfect order. A small pocket sewn inside the wide sleeve holds a letter from home, already read many times."

[items.ryukyu_bingata]
name = "Ryukyuan patterned robe"
lore = "A Naha dyer brushes paste through a stencil and lays in one color at a time: birds and waves, the island’s everyday motifs. Modest by the standards of the court at Shuri, but the kind of pattern that never tires the eye on a long voyage."

[items.jurchen_sable]
name = "Jurchen sable coat"
lore = "Sable traded at the Fushun horse market and sewn into a long coat. The furrier turns it inside out to show the stitching, because in a Liaodong winter the cold is not the worst of it; the wind through a seam is."

[items.maya_huipil]
name = "Maya huipil"
lore = "A white cotton huipil with a band of hometown patterns across the chest. Anyone along the coast can read from the weave which town the wearer comes from, and conversations start there."

[items.mexica_feather_cape]
name = "Mexica feather cape"
lore = "Quetzal and hummingbird feathers tied one by one onto a cotton net, so the color flips from green to blue as the wearer turns. Feathers hate damp; it is stored on dry cloth, well away from the sea air."

[items.inca_tunic]
name = "Andean woven tunic"
lore = "Tiny squares packed edge to edge, each with a meaning, a full year’s weaving in one garment. When a foreigner buys one and wears it, the old people of Cuzco only smile: the standing woven into those squares cannot be bought."

[items.wallachian_robe]
name = "Wallachian noble's robe"
lore = "A dragon with its tail coiled about its own neck is stitched at the collar, in a fashion more than a century old. It hung in a house whose doors open only after dark, and the cloth has not aged at all. Neither, it seems, has its wearer."

[items.atlantis_blue_robe]
name = "Deep-blue robe of Atlantis"
lore = "The Critias tells how the ten kings put out every fire around the temple, dressed in the most beautiful dark blue robes, and sat in judgment by the embers of the sacrifice. This robe was made from that passage, as blue as a moonless sea."

[items.italian_leather_parasol]
name = "Italian rider's leather parasol"
lore = "A rider’s parasol of stout leather, tough enough to turn hail and worth a ducat at the very least. Damp from the road gets trapped in the hide, so at the inn it stands open all night before it is folded."

[items.venice_silk_parasol]
name = "Venetian silk parasol"
lore = "Plain silk, light and shady. The color was chosen with care, since no one dares copy the umbrella carried over the doge or the pope in procession."

[items.goa_large_parasol]
name = "Large Goa parasol"
lore = "The Portuguese of Goa walk the streets with someone behind them holding a parasol big enough to shade two. The bearer is hired by the day, and the bigger the parasol, the grander the employer looks."

