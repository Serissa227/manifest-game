# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.pearl_earrings]
name = "Pearl earrings"
lore = "Bahrain pearls are judged only in daylight. One good pearl is easy to buy; a pair that matches in size, color, and glow means sorting through hundreds."

[items.emerald_ring]
name = "Emerald ring"
lore = "The stone came out of the New Granada highlands and found its way to a goldsmith’s bench in Seville. Hold it to the light and the fine flaws inside drift like waterweed."

[items.fatima_hand]
name = "Hand-shaped pendant"
lore = "A small silver hand, fingers together, worn at the breast against the evil eye. North African women call it simply “five,” and touch it quietly whenever someone praises their child."

[items.christopher_badge]
name = "Saint Christopher badge"
lore = "The giant who carried a child across the river. The old saying goes that whoever looks on Saint Christopher in the morning will not die a sudden death that day, which is why sailors pin him to their hat brims."

[items.anne_rosary]
name = "Saint Anne rosary"
lore = "Saint Anne was the Virgin’s mother, and women praying for a safe birth reach for her beads first. The boxwood has been rubbed to a shine by many anxious fingers."

[items.mazu_charm]
name = "Mazu keepsake"
lore = "Family members fetch it from the Mazu temple and stitch it inside a sailor’s collar. Old hands say that in a gale you call her “Mazu,” never by her court title. Call her Mazu and she comes at once, her hair still down."

[items.omishima_amulet]
name = "Omishima keepsake"
lore = "The great shrine on Omishima belongs to the god of sea-going warriors, and Murakami crews pay their respects there before they sail. The little bag is stitched so tight that seawater cannot work it loose."

[items.ambergris_pouch]
name = "Ambergris scent pouch"
lore = "Only a fingernail’s worth of ambergris is sewn inside, yet worn close it scents a whole season. Dealers test it with a hot needle: the real thing sweats oil, while a fake cut with wax only smokes."

[items.paradise_feather]
name = "Bird-of-paradise feather ornament"
lore = "Long golden plumes bound into a spray for a turban, flickering like a flame with every step. Moluccan traders call them feathers of the “birds of God,” which they say are born in the sky and live there."

[items.jade_ear_spool]
name = "Jade ear ornaments"
lore = "Drum-shaped jade ear spools are an old fashion, kept now mostly in scholars’ cabinets. The carver boxes the pair in separate compartments: one knock together and the chips will never match again."

[items.ivory_comb]
name = "Ivory comb"
lore = "The ivory walked out of the interior with a caravan and became a comb in a Mombasa workshop. Two broken teeth are bound with fine brass wire; its owner would not hear of replacing it."

[items.hanse_signet]
name = "Hanseatic merchant's signet"
lore = "The bezel bears no coat of arms, only a merchant’s mark of strokes and crosses that Hanseatic traders press into the wax on bales and letters. In Bergen or the London Steelyard, it counts for more than a signature."

[items.fugger_coin_chain]
name = "Fugger counting-house coin chain"
lore = "An old piece from the Fugger counting house in Antwerp: a few gold coins, pierced and strung on a chain. The clerks say Fugger money never sits idle. These few are the only ones ever allowed to retire."

[items.murano_rosary]
name = "Murano glass rosary"
lore = "Venice’s rosary makers keep a guild of their own. Each glass bead is wound by hand over a lamp flame, and held to the light, no two reds are quite the same."

[items.eastern_pearl]
name = "Eastern pearl"
lore = "Jurchen divers take mussels from the cold Songhua River and trade the pearls at the horse markets for cloth and salt. Eastern pearls run small, but any jeweler in Beijing knows their cool luster at a glance."

[items.korean_jade]
name = "Korean jade pendant"
lore = "Joseon officials wear jade at the waist to court, and the steadier the stride, the more evenly it chimes. This is a small private piece; its cord has been replaced three times."

[items.silver_cross]
name = "Silver cross"
lore = "A small cross from a Seville silversmith, perhaps worked from Potosí silver. Travelers keep it in the same leather wallet as their letters from home."

[items.garlic_braid]
name = "Garlic braid"
lore = "A braid of garlic hung over the door in winter. Old folk from Silesia to Wallachia agree that the restless dead cannot bear the smell. The living are not always fond of it either."

[items.mio_pass_flag]
name = "Mio's passage flag"
lore = "A Murakami pass flag from Noshima. Other ships pay toll money for one; Mio’s came from her wet nurse’s own family, and no one on the Inland Sea stops a boat that flies it."

[items.mutapa_bracelet]
name = "Mutapa gift bracelet"
lore = "A gold bracelet from the king of Mutapa, heavy and plainly worked. Baraka can tell its weight with his eyes shut, but what he repeats more often is what was said at court the day it was given."

[items.solomon_seal_ring]
name = "Seal-of-Solomon talisman ring"
lore = "A six-pointed star on the bezel, ringed with tiny script. In the stories Solomon commanded the jinn with his seal. This ring asks only that the jinn keep their distance."

[items.dragon_order_badge]
name = "Order of the Dragon badge"
lore = "A dragon with its tail coiled around its own neck, a red cross showing through the split in its back. The Order of the Dragon ought to be long dissolved, yet at the night court someone still pins it on."

[items.granada_key]
name = "Key of Granada"
lore = "The door key Tariq’s grandmother carried out of the old house in the Albaicín. The iron is worn bright from handling. The door is still there across the sea, opened now by someone else."

[items.noel_red_ribbon]
name = "Noel's red ribbon"
lore = "The red ribbon tied to the sword hilt on the day of the knighting. At that roll call, seventy-seven names were read, and only one voice answered."

[items.tianfei_lantern]
name = "Tianfei temple lantern"
lore = "Wandeng’s mother has tended the lamps and incense of the Tianfei temple for half her life, and she asked the goddess for this little red paper lantern. Wandeng will dare almost anything except letting it go out."

[items.canopus_pendant]
name = "Canopus astrolabe pendant"
lore = "A brass astrolabe small enough to close a fist around, the mark for Canopus worn brightest of all. Najma was born on the morning it rose. On the back: “One finger off, a hundred miles off.”"

[items.exchange_earring]
name = "Exchange coin earring"
lore = "The first gold coin Lieve’s father changed for her beside the Bourse, later made into an earring. She remembers its fineness and weight more clearly than the weather that day."

[items.fede_ring]
name = "Fede ring"
lore = "Two hands clasp on the bezel, the pattern given at a betrothal. A line is engraved inside the band, where only the wearer will ever read it."

[items.silk_hairpin]
name = "Silk-flower hairpin"
lore = "The little flower on the pin is cut petal by petal from silk scraps and pasted together. At the spring temple fair, the girls compete over whose flowers look most alive."

[items.court_fan]
name = "Court apprentice's fan"
lore = "A fan of thin cypress slats, carried by every lady at court. Apprentices first learn how to hide a face behind it and how to pass a folded note. The slats stay bare until the girl writes her first poem worth praising."

