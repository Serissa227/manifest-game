# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.homer_iliad_aldine]
name = "Homer: Iliad (Aldine edition)"
lore = "An Aldine octavo whose Greek type, all loops and ligatures, looks at first glance like a scribe’s hand. The very first word is “wrath,” and every student of Greek learns to say it on the first day."

[items.homer_odyssey_aldine]
name = "Homer: Odyssey (Aldine edition)"
lore = "Hardly anyone aboard can read the Greek, yet everyone has heard of the man who had himself lashed to the mast to hear the Sirens sing. A passenger reads a passage aloud, and the sailors answer with their own version."

[items.hesiod_aldine]
name = "Hesiod: Works and Days"
lore = "“Praise a small ship, but put your cargo in a large one,” the old poet advises—though by his own account he crossed the sea only once, over the narrow strait from Aulis to Euboea. Captains never tire of laughing at him for it."

[items.aratus_aldine]
name = "Aratus: Phaenomena (Greek text)"
lore = "After the constellations come the weather signs: a ring around the moon, a heron flying in from the sea with harsh cries—both mean a storm is coming. Priests like to point out that Saint Paul quoted a line of this poem in Athens."

[items.ptolemy_strasbourg]
name = "Ptolemy: Geography (Strasbourg edition)"
lore = "The first part holds Ptolemy’s twenty-seven ancient maps, where the Indian Ocean is a sea shut in by land; the second adds twenty new ones, and Portuguese ships have long since sailed around a shore that was never there."

[items.strabo_aldine]
name = "Strabo: Geography"
lore = "Seventeen books of Greek, from Iberia to Egypt. Strabo remarks that, were the Atlantic not so wide, one could sail from Iberia to India along a single parallel—and now everyone knows there is a whole new world in the way."

[items.herodotus_aldine]
name = "Herodotus: Histories (Aldine edition)"
lore = "Phoenicians sent by Pharaoh Necho sailed around Libya and reported that the sun had been on their right hand. Herodotus wrote it down, then added that he did not believe it. Every ship that rounds the Cape of Good Hope now sees the sun riding in the north."

[items.plutarch_giunta]
name = "Plutarch: Parallel Lives"
lore = "Pompey, carrying grain to Rome, refused to wait out a storm and told his helmsman: “To sail is necessary; to live is not.” Shipowners love to quote it. Sailors just roll their eyes."

[items.virgil_aldine]
name = "Virgil: Aeneid (Aldine edition)"
lore = "The first book set entirely in italic type, small enough to slip into a sleeve. Schoolboys memorize Dido’s lament; helmsmen remember only Palinurus, who dozed off at the tiller one night and fell into the sea."

[items.ovid_metamorphoses_rome]
name = "Ovid: Metamorphoses"
lore = "Every painter’s workshop has a battered copy. Sailors remember only the tale of Ceyx, drowned at sea, and his wife turned into a kingfisher: the calm days in the dead of winter, they say, are the days she sits on her nest."

[items.ovid_heroides_rome]
name = "Ovid: Heroides"
lore = "The first letter is Penelope’s, to a husband long overdue from the sea: “Don’t write back—come home yourself.” Women waiting in harbor towns often linger a long time over that line."

[items.lucian_aldine]
name = "Lucian: True History"
lore = "The author confesses at the start that the only true thing in his book is that he is lying. Then a whirlwind lifts his ship to the moon, and a whale swallows it whole. Captains who have read it just smile at the next tall tale they hear."

[items.apuleius_seville]
name = "Apuleius: The Golden Ass (Spanish translation)"
lore = "Lucius steals a witch’s ointment hoping to turn into a bird and becomes a donkey instead. In Cortegana’s Castilian, readers laugh at every beating the donkey takes, then sigh over Psyche and her lamp."

[items.aristotle_aldine]
name = "Aristotle: Works (Aldine five-volume edition)"
lore = "Five folio volumes that took Aldus four years to complete. Padua’s professors lecture from them; why the sea is salt and where the winds come from were argued over long ago in the Meteorology, and the students are still at it."

[items.periploi_basel]
name = "Arrian and Hanno: Collected Periploi"
lore = "Three ancient voyages in one volume: the Black Sea coast, the Red Sea ports on the road to India, and the Carthaginian Hanno’s run down the coast of Africa. The most worn pages are Hanno’s: three hairy “women” whom the interpreters called gorillas."

[items.vegetius_ms]
name = "Vegetius: Epitome of Military Science (manuscript)"
lore = "A fifteenth-century Latin copy, its ink faded to brown. Book Four, on war at sea, declares the sea “closed” from mid-November to early March. Any captain who has sailed in winter can only smile grimly at that."

[items.plato_ficino]
name = "Plato: Dialogues (Ficino's Latin translation)"
lore = "Ficino put the whole of Plato into Latin, and nearly every scholar in Florence owns a copy. The hardest part to set down is the Critias: the drowned island beyond the Pillars, the gods assembling to judge it—and there the text simply stops."

[items.plato_aldine]
name = "Plato: Dialogues (Aldine Greek edition)"
lore = "Readers with Greek check it word by word against Ficino’s Latin. The Egyptian priests told Solon the island was larger than Libya and Asia together—and since news of the New World arrived, people keep turning back to that page."

[items.athenaeus_aldine]
name = "Athenaeus: Deipnosophistae"
lore = "Fifteen books of dinner talk—how to cook a fish, how to mix the wine—running on for pages. Shipwrights turn straight to Book Five: Syracuse’s great ship, with gardens and baths aboard, so big that only Alexandria could berth it, so the king gave it away."

[items.philostratus_aldine]
name = "Philostratus: Life of Apollonius of Tyana"
lore = "Apollonius of Tyana walks all the way to India to talk with the Brahmans. Night readers, though, keep turning back to Corinth, where a wedding feast’s gold and silver vanish at a word from him, and the bride stands revealed as a lamia who feeds on young blood."
