# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.herbal_draught]
name = "Herbal draught"
lore = "A gourd of decoction brewed to the apothecary’s recipe. The ship’s surgeon tastes it, winces, and nods: bitter enough to prove nobody skimped on the herbs."

[items.lemon_juice]
name = "Lemon juice"
lore = "Lemon juice in a small cask, a little measured out to every hand each day on a long voyage. Old sailors swear by it once the gums start to bleed. Why it works, nobody can say."

[items.coffee_cup]
name = "Coffee"
lore = "Yemeni Sufis drink it to keep their night vigils, and Cairo clerks to finish the accounts. One small cup chases sleep away, though tomorrow’s weariness will still arrive in full."

[items.tea_leaves]
name = "Tea"
lore = "A packet of pan-fired green tea, too precious to brew at sea. Ashore, boil a kettle, and once a guest catches the scent, talk of business comes easily."

[items.hot_cacao]
name = "Hot cacao"
lore = "Poured from a height until a thick head of foam rises in the cup. The Maya take their cacao with chili and no sugar, and the first sip always gives a stranger pause."

[items.candied_fruit]
name = "Candied fruit"
lore = "Candied orange peel and quince packed in a little jar. Open one at sea on Christmas, give everyone a piece, and home feels a little nearer."

[items.crew_spirit]
name = "Strong spirit"
lore = "The cask keeper measures with a pewter cup, one apiece, no more and no less. The cup poured after a storm is remembered longer than the wages."

[items.holy_water]
name = "Holy water"
lore = "Water blessed by a priest, carried in a small flask. Sailors sprinkle it on the bow and the foot of the mast so that nothing unclean can come aboard in the night."

[items.fair_wind_paper]
name = "Fair-wind paper charm"
lore = "A charm for fair wind, drawn in cinnabar on yellow paper. Burn it as you clear the harbor and scatter the ash on the sea. If the wind really does come around, the crew will talk of nothing else for days."

[items.wind_clearing_paper]
name = "Storm-clearing paper charm"
lore = "Paste it to the mast and pray the heavens call off the gale. Once it is up, you still reef the sails and batten the hatches."

[items.mist_incense]
name = "Mist incense"
lore = "The incense seller claims that, once lit, it will hide a ship in the mist. It adds not a wisp of fog, but in fog that is already there, your ship does become harder to find."

[items.stargazing_candle]
name = "Stargazer's candle"
lore = "The shade has only a narrow slit, just enough for the light to fall on the logbook. A stargazer fears nothing more than a bright flame close by; one dazzle and the faint stars are lost for the night."

[items.mermaid_flesh]
name = "Mermaid flesh of legend"
lore = "In Wakasa they say the Yao Bikuni ate mermaid flesh as a girl and still looked young at eight hundred. This portion will not stop anyone from aging, but shared among the crew, it drives the sickness out of the ship."

[items.garlic_portion]
name = "Garlic portion"
lore = "Fierce raw, gentle once stewed into soup. Northern travelers keep a couple of heads in their pockets: food when hungry, and courage when the road passes a graveyard at night."

[items.hot_tea]
name = "Hot tea"
lore = "On a foggy night, what the helmsman on watch wants most in his hands is a cup of tea hot enough to burn the fingers."

[items.ginger_slice]
name = "Ginger slices"
lore = "Thin slices of dried ginger, one tucked in the cheek against seasickness. Malabar ginger sells all the way to Venice, so the crew ration their own."

[items.rose_water]
name = "Rose water"
lore = "Rose water from Kashan in a slender-necked sprinkler. A host shakes a few drops over a guest’s hands, and the whole room fills with a garden in May."

[items.mint_infusion]
name = "Mint infusion"
lore = "Mint picked fresh in the courtyard and steeped in boiling water. When bargaining stalls, the host rises to pour another round, and as the cool scent rises, the talk softens."

[items.rice_cake]
name = "Rice cake"
lore = "Rice cakes handed round as the club meeting breaks up, their edges lightly scorched. They won’t keep two days, so they are best eaten while everyone is still together."

[items.beeswax_candle]
name = "Beeswax candle"
lore = "Beeswax costs far more than tallow, but it burns without black smoke and smells faintly of honey. Copyists gladly pay for it, since a page dusted with soot has to be copied again."

[items.incense_paper]
name = "Scented ritual paper"
lore = "Neatly folded scented paper, burned by the ship’s incense keeper whenever offerings are made to Mazu. The ash is gathered into a small porcelain jar and carried back to the temple at the next port."

[items.travel_rations]
name = "Travel ration"
lore = "Two hard biscuits, a strip of salt cod, and a wedge of hard cheese, wrapped in oilcloth: enough for two days on the road ashore. Provisions for the whole crew are another matter."

[items.plum_sweet]
name = "Plum sweet"
lore = "A sweet boiled down from sour plums. Schoolboys slip one into their mouths just before the teacher calls on them to recite, and they pucker so hard they forget to be nervous."

[items.clove_sachet]
name = "Clove sachet"
lore = "A little bag sewn by hand at the incense circle and stuffed with clove buds. Those who leave Ternate tuck it at the bottom of their sea chest, and every time they lift the lid, it is harvest season again."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# A wish for favorable wind becomes a small, single-use sailing aid in this world.
# A story's blend offers a slight aid in existing mist in this world without creating weather.
# The Yao Bikuni tale speaks of agelessness; this world grants no longer life and currently expresses only bounded crew disease protection.
# Garlic belongs in food, while later revenant folklore circulates early in this world.
