# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.chart_mediterranean]
name = "Mediterranean portolan chart"
lore = "Rhumb lines fan out across the vellum from a handful of compass roses. Every coastal name is written facing inland, the great ports in red ink and the small coves in black."

[items.chart_north_sea]
name = "North Sea sailing chart"
lore = "On a North Sea chart the sandbanks outnumber the land. The margins list what the tallow in the sounding lead brought up: fine sand, broken shell, black mud. In fog, that is how you know where you are."

[items.chart_baltic]
name = "Baltic sailing chart"
lore = "Entering the Baltic means paying the Danish king’s toll at the Sound, and the chart draws Helsingør, where it is collected, unusually large. A note in the margin: Don’t come in winter. The sea freezes."

[items.chart_atlantic_isles]
name = "Atlantic islands chart"
lore = "Madeira, the Canaries, and the Azores are strung across the sheet with wide blank water between them. The way home is not the way out; first you swing far to the northwest to find the wind that will carry you back."

[items.chart_guinea]
name = "Guinea sailing chart"
lore = "The coastline grows crowded around the castle at Elmina, river mouth after river mouth. A small note in the margin: past Cape Palmas the wind can die without warning, so carry plenty of water."

[items.chart_cape_route]
name = "Cape route chart"
lore = "Dias called it the Cape of Storms; his king renamed it the Cape of Good Hope. Beside Cape Agulhas the chart notes that here the compass needle points true north."

[items.chart_arabian]
name = "Arabian Sea rahmani extract"
lore = "Not a drawing at all but page after page of rhymed sailing verse: when to weigh anchor, how many fingers high a given star should stand, and which seabirds mean the coast is near."

[items.chart_red_sea]
name = "Red Sea sailing chart"
lore = "Coral reefs line both shores of the Red Sea, so the ships on this chart sail by day and must find an anchorage before dark. At the strait’s mouth is written its name: the Gate of Tears."

[items.chart_persian_gulf]
name = "Persian Gulf sailing chart"
lore = "Hormuz guards the mouth of the Gulf, and the pearl banks of Bahrain lie at its heart. Beside Bahrain is a note: there are sweet springs on the seabed, and divers bring the fresh water up in skins."

[items.chart_east_africa]
name = "East African coastal chart"
lore = "From Mogadishu to Sofala, each coastal city is labeled in Arabic script. In the margin are the names of the two monsoons: the northeast wind is the kaskazi, the southwest the kusi."

[items.chart_india]
name = "India sailing chart"
lore = "The Malabar coast is a string of pepper ports, Calicut and Cochin among them. The chart warns that once the southwest monsoon arrives, these harbors are as good as shut: no ship gets in, and none gets out."

[items.chart_malacca]
name = "Strait of Malacca chart"
lore = "Malacca is where the two monsoons meet. Ships from the east wait here for the southwest wind, ships from the west for the northeast, which is why the chart draws the anchorage larger than the city."

[items.chart_south_china]
name = "South China Sea chart"
lore = "Compass courses run line after line, each bearing named by the Chinese needle. By the Seven Isles Sea someone has drawn a small circle and added the old warning: fear the Seven Isles going one way, and Pulo Condore coming back."

[items.chart_japan]
name = "Japanese coastal chart"
lore = "Bōnotsu, Hakata, Hirado, and Sakai are circled in vermilion. The kana notes beside several anchorages are in different hands; this chart has passed through more than one skipper’s keeping."

[items.chart_ryukyu]
name = "Ryukyu passage chart"
lore = "From Fuzhou to Naha the island names follow one another like beads on a string. Which channel to take between them, though, depends on the day’s wind, however smooth the chart’s lines may look."

[items.chart_caribbean]
name = "Caribbean coastal chart"
lore = "Hispaniola, Cuba, and Jamaica, their reefs marked with tiny crosses. In the margin is a word borrowed from the Taíno, huracán, and a warning: in August and September, if the sky turns yellow, run for harbor."

[items.chart_mexico_gulf]
name = "Gulf of Mexico chart"
lore = "Across from Veracruz, the islet of San Juan de Ulúa is drawn with great care, for ships moor there to iron rings set in its wall. A margin note warns that when the winter northers blow, even the harbor is not safe."

[items.chart_pacific_return]
name = "Pacific return-route chart"
lore = "Leave Cebu, work northeast until you find the westerlies, then run before them all the way to the American coast. Before 1565 no ship had ever made it back across this ocean; to own this chart, you must wait for the voyage that does."

[items.chart_moluccas]
name = "Moluccas chart"
lore = "The volcanic islands of Ternate and Tidore face each other across a narrow strait, and the chart draws their peaks more carefully than their shores. In these islands, knowing the mountains means knowing the way."

[items.chart_peru]
name = "Peruvian coastal chart"
lore = "North with the current, south against the wind: a ship from Panama to Lima can spend two or three months on the way. A few margin lines come from the raft pilots: in fog, watch which way the seabirds fly and you will know where the shore lies."

[items.mercator_chart]
name = "Mercator world chart"
lore = "The world chart Mercator printed at Duisburg in 1569. Hold a single compass bearing and you follow a straight line across it. The farther north you look, though, the wider the land is stretched, and old captains shake their heads at it."

[items.piri_map]
name = "Piri Reis map extract"
lore = "A copy of the Atlantic corner of the world map Piri Reis drew at Gallipoli in 1513. In his margin notes he says he worked from some twenty older charts, one of them Columbus’s, others from “the time of Alexander.”"

[items.cantino_map]
name = "Cantino planisphere study copy"
lore = "In 1502 Cantino paid twelve ducats to smuggle the original out of Lisbon for the Duke of Ferrara. A single line on it cuts the world in two. How this copy came to be here, the seller will not say."

[items.zhenghe_chart]
name = "Zheng He route-chart copy"
lore = "The treasure fleet’s compass routes, handed down in manuscript from one generation of helmsmen to the next. The long scroll runs from the Longjiang docks at Nanjing all the way to Hormuz, with star-altitude readings for every open-sea crossing."

[items.kangnido_map]
name = "Kangnido map study copy"
lore = "A study copy of the world map drawn in Joseon in 1402. Korea looms nearly as large as India, yet far to the west the tip of Africa and the Mediterranean are already there."

[items.wen_star_chart]
name = "Wen Xingcha's star-crossing chart"
lore = "Wen Xingcha’s grandfather was a helmsman with the treasure fleet and left her these star-crossing charts; the tiny notes in the margins are hers, added over decades. The last sheet ends in a nameless sea, labeled “West of the Western Ocean.”"

[items.chart_iberian_coast]
name = "Iberian coastal chart"
lore = "Every river mouth with fresh water between Cape Finisterre and Cape St. Vincent is marked. Most new captains start with this chart. Round Cape St. Vincent and you are in another sea."

[items.chart_bay_bengal]
name = "Bay of Bengal sailing chart"
lore = "The channels at the mouth of the Ganges shift every year, and several sandbanks on this chart have been struck out and redrawn. A margin note warns that in the months when the monsoon turns, great spinning storms rise in the bay."

[items.chart_japan_inland]
name = "Japanese Inland Sea tide chart"
lore = "The Inland Sea’s tide turns four times a day, and every strait on this chart is marked with the hour it changes. Beside the Kurushima passage someone has written: Without a Murakami flag, don’t try it."

[items.chart_mozambique]
name = "Mozambique Channel chart"
lore = "Currents in the channel run fast and tangled, and the reefs are stippled thick across the sheet. Beside Mozambique Island there is only a short note: Take on water. Wait for wind."

