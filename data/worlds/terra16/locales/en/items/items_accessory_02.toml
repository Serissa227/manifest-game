# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.linen_handkerchief]
name = "Plain linen handkerchief"
lore = "Plain linen with no embroidery, only initials stitched in white at one corner. In a counting house it wipes pens, wraps coins, and mops brows, and an ink stain just means another wash."

[items.counting_tokens]
name = "Counting-token pouch"
lore = "Nuremberg brass counters, pushed back and forth across a ruled reckoning cloth. At day’s end the apprentice counts every one back into the pouch. If one is missing, the day’s sums start over."

[items.school_ink_case]
name = "Community-school ink case"
lore = "A schoolboy’s ink case, one compartment for the inkstick and one for the wiping rag. The teacher likes to say that a pupil with black cuffs rarely writes a clean page."

[items.page_sash]
name = "Page's sash"
lore = "A page’s sash is dyed in the household’s colors, so anyone can see which house the child serves. Before fencing practice the tassels get tucked away; let an opponent grab one and the bout is lost."

[items.azhar_pen_case]
name = "Al-Azhar student's pen case"
lore = "A brass pen case with its owner’s name chased into the lid. Inside lie five trimmed reed pens. The fifth is for whichever classmate forgot theirs."

[items.giri_writing_pouch]
name = "Giri student's writing pouch"
lore = "Every student on the hill at Giri carries one, its batik pattern telling you which island they hail from. Even on a trip down to the port at Gresik, the reed pens and a half-copied commentary come along."

[items.hermetic_gold_ring]
name = "Hermetic gold ring"
lore = "A rayed disk is chased on the bezel. In Agrippa’s scheme gold answers to the Sun, which rules the heart and the first day of the week. Of the seven, it is the easiest to recognize and the hardest to wear unnoticed."

[items.hermetic_silver_ring]
name = "Hermetic silver ring"
lore = "A crescent moon on the bezel. Silver answers to the Moon, and the Moon governs the tides, so anyone studying this art aboard ship chooses silver first."

[items.hermetic_mercury_ring]
name = "Hermetic sealed mercury ring"
lore = "A drop of quicksilver is sealed inside the hollow band, and you can hear it run whenever the hand turns. Quicksilver answers to Mercury, the swiftest planet in the sky."

[items.hermetic_copper_ring]
name = "Hermetic copper ring"
lore = "Copper answers to Venus. Cyprus gave the world its copper, and Venus came ashore from the waves off Cyprus; the occult books are full of links forged in just this way."

[items.hermetic_iron_ring]
name = "Hermetic iron ring"
lore = "Iron answers to Mars, the reddish planet. The hammer marks are left on purpose; students say the war god’s metal should never be polished too bright."

[items.hermetic_tin_ring]
name = "Hermetic tin ring"
lore = "Tin answers to Jupiter. Students like to joke that the king of the gods got the softest metal of the seven. Worn long enough, the band bends itself to fit the finger."

[items.hermetic_lead_ring]
name = "Hermetic lead ring"
lore = "Lead answers to Saturn, the slowest and most distant planet, which takes thirty years to circle the heavens. The ring is surprisingly heavy, and they say its wearer grows given to brooding."

[items.zodiac_aries_token]
name = "Aries zodiac token"
lore = "A ram looking back over its shoulder. The almanac starts its year here: at the spring equinox, the sun steps into this sign."

[items.zodiac_taurus_token]
name = "Taurus zodiac token"
lore = "Seven tiny stars are pricked into the bull’s shoulder. Hesiod says that when they sink into the sea, it is time to haul the boat ashore."

[items.zodiac_gemini_token]
name = "Gemini zodiac token"
lore = "Twin brothers shoulder to shoulder. Sailors say that when two blue flames light the masthead in a storm, the twins have come to guard the ship. A single flame is a bad sign."

[items.zodiac_cancer_token]
name = "Cancer zodiac token"
lore = "The faintest of the twelve signs, with a misty knot of stars at its center that the Greeks called the Manger. Apprentices hunting for it the first time always assume their eyes are tired."

[items.zodiac_leo_token]
name = "Leo zodiac token"
lore = "Copernicus named the bright star in the lion’s heart Regulus, “the little king.” The midsummer sun lodges in this sign, and apprentices swear the token gets hot to the touch."

[items.zodiac_virgo_token]
name = "Virgo zodiac token"
lore = "The maiden holds an ear of wheat, and her brightest star is named Spica for it. The sun enters this sign just before harvest, when farmers and astrologers alike are watching."

[items.zodiac_libra_token]
name = "Libra zodiac token"
lore = "The only one of the twelve that is not a living thing. At the autumn equinox, day and night weigh the same, and the sun sits squarely on the scales."

[items.zodiac_scorpio_token]
name = "Scorpio zodiac token"
lore = "The scorpion’s heart is a red star, the one the Chinese call the Great Fire. The story goes that the scorpion stung the hunter Orion to death, and so the two never share the night sky."

[items.zodiac_sagittarius_token]
name = "Sagittarius zodiac token"
lore = "The centaur archer draws his bow, the arrow aimed squarely at the scorpion’s red heart. The Milky Way runs widest and brightest here."

[items.zodiac_capricorn_token]
name = "Capricorn zodiac token"
lore = "A goat in front and a fish behind. At the winter solstice the sun reaches this sign and turns north again, which is why the southern tropic bears its name."

[items.zodiac_aquarius_token]
name = "Aquarius zodiac token"
lore = "The water bearer tips his jar southward, straight into the mouth of the Southern Fish, where Fomalhaut shines alone."

[items.zodiac_pisces_token]
name = "Pisces zodiac token"
lore = "Two fish tied tail to tail by a single cord, one swimming north and one swimming west. This is the last of the twelve; after it, the circle comes back around to the Ram."

[items.apprentice_seal]
name = "Counting-house apprentice's mark"
lore = "A little brass stamp bearing an apprentice’s initials, pressed beside every ledger line they copy. When a sum goes wrong, the master knows at once whom to ask."

[items.sailmakers_palm]
name = "Sailmaker's palm"
lore = "A leather strap around the back of the hand and a pitted iron plate in the palm for driving the needle. Heavy canvas is stiff as board; without one, a day’s work leaves a palm full of blisters."

[items.carved_buckle]
name = "Carved wooden buckle"
lore = "A buckle carved for practice in the woodshop, its one curve pared again and again. On the back, the maker’s name is scratched in two tiny characters with the knife point."

[items.clove_brooch]
name = "Clove-flower brooch"
lore = "A silver pin shaped like a clove bud, hardly bigger than the real spice. Ternatans abroad wear it so they can spot one another at a glance in a foreign port."

[items.friendship_knot]
name = "Companions' knotted cord"
lore = "Each companion ties half, and only together do the halves make one knot. When their ships part, each keeps a length of cord, to be joined again at the next meeting."

