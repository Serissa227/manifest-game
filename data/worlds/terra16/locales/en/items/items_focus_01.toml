# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.hermetic_staff]
name = "Hermetic serpent staff"
lore = "Two serpents climb the wooden staff toward a pair of small wings at its head. Teachers of the Hermetic art use it as a pointer, tapping the diagram as they explain that what is below is like what is above."

[items.dee_obsidian_mirror]
name = "Obsidian mirror attributed to Dee"
lore = "The Mexica ground obsidian into mirrors whose reflections seem to hang behind smoke. The seller claims this one passed through the hands of Dr. Dee in England. Whether that is true has to be traced back one owner at a time."

[items.crystal_sphere]
name = "Rock-crystal sphere"
lore = "A sphere ground from a single piece of rock crystal, a whole winter’s work. Stare into it long enough and you will see what you want to see. Captains point out that this makes it the exact opposite of a ship’s log."

[items.talisman_shirt]
name = "Ottoman talismanic shirt"
lore = "Covered from collar to hem in minute script and grids of squares, which they say could only be begun at an hour chosen by the stars. Ottoman princes wore such shirts beneath their armor into battle."

[items.shikigami_paper]
name = "Shikigami paper figure"
lore = "White paper cut in the shape of a person. In the stories an onmyōji breathes on it and it runs his errands. Students practice their spells on it, and how many steps the paper figure manages depends on how far their study has come."

[items.longhu_talisman]
name = "Longhu ritual paper"
lore = "A talisman from the Celestial Master’s mansion on Mount Longhu, its cinnabar strokes drawn in one unbroken motion. Those who seek one paste a copy over the door at home and carry another inside their robes when they travel."

[items.yamabushi_conch]
name = "Yamabushi conch trumpet"
lore = "Yamabushi blow it to call to one another in the mountains, and the sound carries over two ridges. When fishermen on the shore hear it, they know the mountain ascetics are coming down."

[items.shaman_bells]
name = "Jurchen ritual bells"
lore = "A belt of bronze bells a Jurchen shaman ties on for the spirit dance; with every turn the whole room rings. The old shamans say the bells show the spirits the way."

[items.shaman_mirror]
name = "Jurchen ritual mirror"
lore = "A shaman wears bronze mirrors on chest and back, said to reveal evil spirits and turn aside blades and arrows. The rim of this one has been worn thin over several generations."

[items.ix_pyrite_mirror]
name = "Ix's temple pyrite mirror"
lore = "A small mirror pieced from plates of pyrite, once kept in Ixchel’s temple on Cozumel. As the pilgrims grew fewer every year, the old women who tend the shrine gave it to Ix to keep."

[items.sufi_beads]
name = "Sufi prayer beads"
lore = "Ninety-nine wooden beads, one for each of the Beautiful Names of God. Sufi disciples recite through the night, the beads passing one by one through their fingers until the heart grows still."

[items.solomon_bottle]
name = "Sealed brass bottle"
lore = "The brass bottle is stoppered with lead stamped with Solomon’s seal, just like the one the fisherman hauled up in his net in the Thousand and One Nights. The old man selling it has one piece of advice: on the night of the new moon, don’t keep it by your pillow."

[items.sky_stone_charm]
name = "Fallen-stone charm"
lore = "A small pendant ground from a stone that fell from the sky, black with a glint of iron. The shepherd who found it speaks of a streak of fire that night. The scholar would rather know why it pulls at a needle."

[items.holy_water_vial]
name = "Holy-water vessel"
lore = "A small pewter holy-water flask with a rosary wound around its neck. The priest carries it whenever he goes out to bless a new ship or to calm a household troubled in the night."

[items.oud]
name = "Oud"
lore = "The neck has no frets, so every note must be found by the fingers alone. The player plucks with an eagle quill, and at the first note, people along the quay begin drifting closer."

[items.koto]
name = "Koto"
lore = "Thirteen strings, each raised on its own movable bridge. A girl learning the koto starts with tuning, and only when every string is true will her teacher let her play a whole passage through."

[items.lute]
name = "Lute"
lore = "A pear-shaped body with a back like a slice of melon. Sea air slackens gut strings overnight, so a traveler’s lute case always holds a spare coil."

[items.reed_flute]
name = "Reed flute"
lore = "A short flute cut from reed, its voice a little husky. Students bring it to their gatherings, and it is light enough to tuck into any corner of a boat."

[items.zheng]
name = "Small teaching zheng"
lore = "A small teaching zheng, half the length of an ordinary one. The faint scratches on its soundboard mark every place where a pupil went wrong and started over."

[items.ney]
name = "Ney flute"
lore = "Rumi opens the Masnavi with it: “Listen to the reed, how it tells its tale, lamenting separation.” What a beginner gets out of it is mostly wind."

[items.small_drum]
name = "Small hand drum"
lore = "A little goatskin drum that tucks under the arm. When a rehearsal loses the beat, one stroke brings everyone back together. A damp head sounds dull and must be warmed slowly by the fire."

[items.rebec]
name = "Rebec"
lore = "Three strings, a pear-shaped body, and a bow. Street fiddlers play only short tunes, and for anyone who stops to listen, they play one more."

[items.bamboo_flute]
name = "Bamboo flute"
lore = "A thin membrane over one hole gives the bamboo flute its bright buzz. A child back from the night watch doesn’t dare play out loud and only breathes a few soft notes."

[items.buni_talisman_leaves]
name = "Leaves after al-Buni's talisman texts"
lore = "Loose leaves copied with squares of letters, every cell filled. The copyist traced them from an older short treatise; who holds that original now, no one can say for sure."

[items.bistami_letter_board]
name = "Study board after al-Bistami's letter writings"
lore = "A wooden board where arrangements of letters are sketched in charcoal, wiped away, and drawn again. Students use what al-Bistami wrote in Bursa only to practice careful reading, and would not dare to use it for anything else."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Paired serpents from older images become a study staff without claiming a deity's relic.
# The Mexican obsidian is grounded in the object; the uncertain link to Dee is bridged by this world's provenance story.
# A paper form from onmyodo tales becomes a bounded study medium in this world.
# The fisherman and the imprisoned spirit belong to an old tale; this world leaves a seal to investigate.
# A copyist preserves short letter diagrams rather than moving the later compilation wholesale into this age; this study leaf's witness still needs checking.
# Further original notes: devotional objects are kept as cultural objects that teach no occult power; Ix carries a portable mirror and the story never takes a sanctuary's sacred object; the al-Buni witness date still needs checking.
# Crystal sphere: the original note said its images invite thought but cannot replace a voyage record (a study object only).
# Fallen-stone charm: the original note said the finder remembers a light in the sky and the stone's origin is left for a scholar to examine (meteoric origin unconfirmed).
# Ritual mirror: the original note said an outside collector should first ask its keeper's wishes.
