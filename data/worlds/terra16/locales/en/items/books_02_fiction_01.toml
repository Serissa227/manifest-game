# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.amadis_zaragoza]
name = "Amadis of Gaul"
lore = "Amadís rides out for Oriana’s sake, from the Firm Island to the ends of the sea, and the book passes from bookstall to ship’s cabin; young pages who read it start talking as if they were swearing an oath."

[items.esplandian_seville]
name = "The Exploits of Esplandian"
lore = "In the book California is an island west across the ocean, where Queen Calafia leads a band of women warriors whose weapons are all of gold. Sailors have since written the name on real charts, though they never found the golden armor."

[items.tirant_valencia]
name = "Tirant lo Blanc"
lore = "Tirant rises from plain knight to commander at Constantinople, and sieges, sea fights and court repartee crowd the thick volume; old Mediterranean sailors read it mainly to quarrel over whether the naval battles ring true."

[items.celestina_burgos]
name = "Celestina"
lore = "The sixteen-act version printed at Burgos; the go-between Celestina’s errands and schemes leave readers wary of sweet words ever after."

[items.carcel_seville]
name = "The Prison of Love"
lore = "Leriano loves Laureola to the point of ruin, and the letters in the book grow longer each time; even readers fluent in courtly speech reach the last page without finding any way to save him."

[items.cancioneiro_lisbon]
name = "Cancioneiro Geral"
lore = "Courtly exchanges and mocking verses from the Lisbon court are gathered in one great volume, and merchants’ children practice from it how to take up a line tossed across a banquet table and cap it neatly."

[items.orlando_ferrara]
name = "Ariosto: Orlando Furioso"
lore = "The forty-canto first version printed at Ferrara. The woman knight Bradamante takes the field with her sword, Orlando goes mad, and Astolfo rides a hippogriff to the moon; every night someone at the inn is eager to tell it."

[items.morgante_florence]
name = "Pulci: Morgante"
lore = "The Florentine Pulci jokes his way through the tale of the giant Morgante; one of his devils declares that the sea beyond the Pillars of Hercules can be sailed, and would-be voyagers love that passage best."

[items.hypnerotomachia_aldine]
name = "Hypnerotomachia Poliphili (Aldine edition)"
lore = "Poliphilo wanders in a dream through ruins and gardens in search of his Polia, and the pages are set with strange Greek, Latin and Hebrew lettering; a collector patient enough to read on will count it the most distinguished of gifts."

[items.decameron_print]
name = "Boccaccio: Decameron"
lore = "In a plague year ten young people retreat to the countryside and tell a tale each day, many of them about merchants’ shipwrecks and schemes; when Savonarola’s followers burned the “vanities,” copies went onto the fire."

[items.dante_aldine]
name = "Dante: Divine Comedy (Aldine edition)"
lore = "In the Inferno Ulysses urges his companions past the Pillars of Hercules toward the southern stars, and goes down at last beneath a mountain. Sailors always stop reading at that page."

[items.narrenschiff_basel]
name = "Brant: Ship of Fools"
lore = "A hundred-odd fools crowd aboard a ship bound for Fools’ Land; among the woodcut misers, defaulters and braggarts, merchants and captains can spot a few familiar faces."

[items.mariken_antwerp]
name = "Mariken of Nijmegen"
lore = "Mariken of Nijmegen is lured off by the devil to learn the seven arts and lives with him for years in Antwerp, until a play put on by a chamber of rhetoric makes her weep for her sins."

[items.erasmus_folly_paris]
name = "Erasmus: Praise of Folly"
lore = "Folly herself mounts the stage to praise herself, mocking theologians, clerics and kings as she goes; readers laugh until they blush. Dorp of Louvain wrote to reproach the author, and Erasmus wrote back in his own defense."

[items.erasmus_colloquia_basel]
name = "Erasmus: Colloquies (first issue)"
lore = "Froben’s first issue of 1518 is only a little handbook for schoolboys to practice Latin conversation, without the “Shipwreck” added later; in 1526 the Paris theologians condemned it as unfit for young readers."

[items.utopia_louvain]
name = "More: Utopia"
lore = "A sailor just back from far voyages tells More, in an Antwerp garden, of an island where everyone eats from the same store and gold is used only for chamber pots and slaves’ fetters."

[items.pantagruel_lyon]
name = "Rabelais: Pantagruel"
lore = "Rabelais’s giant Pantagruel eats, drinks and boasts, yet knows more than his tutors; laughter fills the study, and in 1533 the Sorbonne theologians condemned the book as obscene."
