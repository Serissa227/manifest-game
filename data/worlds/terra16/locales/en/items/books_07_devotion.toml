# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.imitation_augsburg]
name = "The Imitation of Christ"
lore = "An old Augsburg printing small enough to tuck inside a coat, its chapters only a few pages long. However cramped the cabin or dim the lamp, there is room for a chapter before the night watch."

[items.legenda_ms]
name = "The Golden Legend (Latin manuscript)"
lore = "An old monastery copy that follows the saints day by day through the feasts. The page for Saint Nicholas, on the sixth of December, is darkest with grease along the edge, from sailors’ fingers at prayer."

[items.hours_paris]
name = "Book of Hours (Paris printing)"
lore = "A Paris press turned out these books of hours by the batch, their margins framing strawberries, hounds and palm-sized saints. There is no church bell at sea, so sailors turn to the next prayer by the sandglass."

[items.christine_treasure]
name = "Christine de Pizan: Book of the Three Virtues"
lore = "Advice for women of every rank, with a chapter on how a princess runs her household, how a merchant’s wife keeps the books, and how a country woman gets through the year. Those left behind to mind the shop while their husbands are at sea read it most closely."

[items.christine_city]
name = "Christine de Pizan: City of Ladies (English translation)"
lore = "The English version raises a city block by block, its bricks the deeds of learned women: poetesses, prophetesses, queens. When someone asks what a girl wants with books, a reader who knows it can answer with an example or two."

[items.vives_antwerp]
name = "Vives: Education of a Christian Woman"
lore = "Vives is stern about what a girl may read, and romances like Amadís are condemned as poison. A girl who reads them in secret, coming to this page, will probably close the book and hide the other one deeper."

[items.agrippa_women]
name = "Agrippa: On the Nobility and Excellence of Women"
lore = "The young Agrippa gave an oration at Dole in praise of women, going so far as to rank them above men, and it reached print at Antwerp twenty years later. His name is forever linked with the occult, so copies mostly change hands in private."

[items.abutsu_ms]
name = "Abutsu-ni: Counsel for the Garden (The Nurse's Letter)"
lore = "The poet Abutsu-ni, of the Kamakura age, wrote to her daughter on the eve of court service: how to form the characters, compose a poem, match the colors of a robe, and when to swallow half a sentence. Court ladies have copied the letter down the generations as the first lesson of service."

[items.bruto_antwerp]
name = "Bruto: Education of a Noble Girl"
lore = "Plantin’s new edition sets Italian and French side by side, handy for a noble girl married into a foreign household. Its maxims on upbringing, read in one language and put into the other, make ready practice for both."

[items.teresa_salamanca]
name = "Collected Works of Teresa of Avila"
lore = "Teresa of Avila wrote for her nuns, and Luis de León edited the books for the press at Salamanca. The prose is plain; she says God walks among the pots and pans. Travelers carry it and read half a page at a time."

[items.ruggieri_zhaoqing]
name = "Michele Ruggieri: True Record of the Lord of Heaven"
lore = "At Zhaoqing, Ruggieri set out his faith in Chinese, at first in a monk’s robe and borrowing many Buddhist words. Interpreters reading the passages on the translated terms often pause to weigh it: is this translation, or accommodation?"

[items.zohar_mantua]
name = "Zohar (Mantua edition)"
lore = "From 1558 a Mantua press issued this Aramaic book of hidden meanings, on letters and divine names, volume by volume. Many rabbis shook their heads: such things were meant to be handed down by mouth, not sold across a counter."

[items.bomberg_bible]
name = "Bomberg: Rabbinic Bible"
lore = "Bomberg, a Christian printer at Venice, puts the scripture in the middle of the page and the rabbis’ commentaries around it on every side. Scholars scattered across distant ports can argue over the very same lines."

[items.quran_paganini]
name = "Quran (Paganini Arabic printing)"
lore = "An Arabic Quran printed at Venice, with many errors in the setting. It is said that no one in Ottoman lands would buy it and nearly the whole run has vanished, so even this one copy is a rare find."

[items.quran_bibliander]
name = "Quran (Bibliander's Latin edition)"
lore = "Basel’s council jailed the printer Oporinus over this Latin Quran, and only after Luther spoke up could it go to press. The translation is four hundred years old and paraphrases freely, so a reader must weigh it for himself."
