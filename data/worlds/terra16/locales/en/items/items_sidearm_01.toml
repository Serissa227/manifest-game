# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.wheellock_pistol]
name = "Wheellock pistol"
lore = "Wind the spring and a steel wheel grinds sparks from a lump of pyrite, no match needed. Riders tie the little spanner to their belts, because without it the pistol is just a length of iron."

[items.matchlock]
name = "Matchlock arquebus"
lore = "The match smolders slowly at one end, and a sentry on the walls trims it several times a night. In rain the pan cover stays under a cupped hand; damp powder means a pull of the trigger and a wisp of smoke."

[items.tanegashima]
name = "Tanegashima matchlock"
lore = "The Portuguese brought firearms to Tanegashima in 1543, and barely ten years later the smiths of Sakai and Negoro build them better than the original. Gunners keep tinkering as they shoot, improving the pan and the loading drill alike."

[items.bird_gun]
name = "Ming bird gun"
lore = "A long, slender barrel, said to be accurate enough to bring down a bird, hence the name. In camp the gunners load step by step on command, not one step out of place. Accuracy comes from drill, not from a name."

[items.three_eye_gun]
name = "Three-barrel hand cannon"
lore = "Three barrels bound together and fired in turn, and once they are empty the whole thing makes a decent club. Before setting out, the old hands of the northern garrisons run an iron rod through each bore."

[items.ottoman_long_gun]
name = "Ottoman long gun"
lore = "Stood on end, the barrel reaches a man’s chin; it shoots best rested on a wall or a ship’s rail. Before turning around with it on a crowded ferry, look first at who is standing beside you."

[items.crossbow]
name = "Crossbow"
lore = "A steel bow that only a windlass can span. The bowyer hands it over with a leather pouch holding two coiled spare strings and one piece of advice: the string is worth more than the bow, so keep it out of the rain."

[items.throwing_knife]
name = "Throwing knife"
lore = "Market performers often grind the edges dull; what sticks the knife in the board is the point and the wrist. When practicing for real, nobody stands behind the target."

[items.blowpipe]
name = "Blowpipe"
lore = "A pipe taller than its owner, with slim darts kept in a dry bamboo joint and tufted with kapok. Forest hunters say a damp dart warps, and a warped dart flies wide."

[items.shuriken]
name = "Small throwing iron"
lore = "A palm-sized plate of iron with four sharpened points. Nobody has ever seen the secret throwing arts of the storytellers written down; this is a practice piece, though the marks it has left in the post are real enough."

[items.parrying_dagger]
name = "Parrying dagger"
lore = "A dagger for the left hand with a broad guard, made for turning the other blade aside. The fencing master is forever scolding students for a hasty left: “It dances with the right hand. It does not go picking fights of its own.”"

[items.short_matchlock]
name = "Short matchlock"
lore = "A cut-down barrel that hangs from the belt without getting in the way. But a ship is all powder and tar, so the lit match lives under a brass cap, and the bosun swears at the first whiff of smoke."

[items.small_crossbow]
name = "Small crossbow"
lore = "The small crossbow Venetian merchants keep to guard their goods, light enough to span by hand. It will not shoot far, but it is plenty to scare off a canal thief; a proper hunting crossbow needs a foot in the stirrup to cock."

[items.sleeve_arrow]
name = "Sleeve dart case"
lore = "A brass tube strapped to the forearm; press the spring and a short dart flies from the cuff. Escort-agency men tell lively stories about them, but few have seen one in earnest. This one was built from the stories, for practice."

[items.small_kris]
name = "Small Malay kris"
lore = "A small kris slipped inside the sash, out of sight once the jacket falls closed. In someone else’s port, ask first whether blades are allowed past the gate; in some sultans’ palaces even a prince leaves his at the door."

[items.rigging_knife]
name = "Rigging knife"
lore = "A thick back and a rounded point, so a rolling deck never drives it into its owner. The first thing a sailor learns: edge always outward, and cut away from yourself."

[items.quillon_dagger]
name = "Quillon dagger"
lore = "The ends of the cross guard are rounded from handling; it has plainly had more than one owner. The leatherworker gave it a new sheath but left the nick in the guard alone. That, he said, is its history, and no one should polish it away."

[items.parrying_dagger_master]
name = "Parrying dagger — masterwork"
lore = "A left-hand dagger by an old Toledo smith, its guard cut with slots that can trap an opponent’s point. Fencing masters leave daggers like this only to their best student, or name them in a will."

[items.tanegashima_master]
name = "Tanegashima matchlock — masterwork"
lore = "The work of a master gunsmith of Sakai, the family crest inlaid in silver wire, the pan cover sliding open at a touch yet tight against rain. Guns like this never reach the market; they come as a lord’s reward, or through a long chain of favors."

[items.crossbow_master]
name = "Crossbow — masterwork"
lore = "A Nuremberg bowyer’s lifetime of skill: flowers chased into the steel bow, a windlass that turns almost silently. A huntsman’s will carried it from one castle to another."
