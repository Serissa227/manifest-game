# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.portuguese_astrolabe]
name = "Portuguese mariner's astrolabe"
lore = "A heavy brass ring cut away to a few spokes so the wind can pass through. The pilot hangs it from a thumb and waits for the instant the ship rolls level to read the height of the sun."

[items.kamal_board]
name = "Kamal board"
lore = "A small board threaded on a knotted cord, each knot the height of the Pole Star at some port, handed down from teacher to pupil. Hold the cord in the teeth, push the board out until star and horizon touch its two edges, and the knot tells how far home is."

[items.quadrant]
name = "Quadrant"
lore = "A quarter circle of wood with degrees along the arc and a plumb line hanging from the corner. Every roll of the ship sets the line swinging, and the reading goes into the book only once it settles."

[items.cross_staff]
name = "Cross-staff"
lore = "A long staff with a sliding crosspiece: set the end against the eye and move the crosspiece until one tip touches the sun and the other the horizon. Old northern pilots stared at the sun this way for years, and many have a bad eye to show for it."

[items.water_compass]
name = "Floating compass"
lore = "A bowl of clear water with a magnetized needle floating on top. Aboard a Fujian junk the compass master guards it, and everyone else tiptoes past: when the water trembles, so does the needle."

[items.dry_compass]
name = "Dry compass"
lore = "The needle rides a pivot in a little wooden box painted with the thirty-two winds. Captains keep it well away from nails and cannon, because iron nearby muddles it."

[items.sounding_lead]
name = "Sounding lead"
lore = "The bottom of the lead is hollowed and packed with tallow. Haul it up and see what clings: sand, mud, or broken shell. An old North Sea pilot rubs it between finger and thumb and can tell you where the ship is."

[items.half_hour_glass]
name = "Half-hour sandglass"
lore = "It runs out every half hour. The ship’s boy turns it and sings a line of prayer to mark the time, and eight turns make a watch. In damp weather the sand drags, and the watch keeps a private correction."

[items.nuremberg_watch]
name = "Nuremberg portable clock"
lore = "Nuremberg makers shrank the clock until it fits in a pocket, round as an egg. Losing a quarter hour a day is nothing unusual: too soon to find longitude at sea with it, but fine for knowing when dinner is due."

[items.majid_astrolabe]
name = "Astrolabe attributed to Ibn Majid"
lore = "Ibn Majid’s name is cut into the back, and the rim shines from generations of pilots’ hands. It has passed from teacher to pupil many times over, and Najma is asking her way down the line, name by name, to learn whose hands last took it to sea."

[items.behaim_globe]
name = "Behaim globe study copy"
lore = "A study copy of the Nuremberg globe of 1492. Sail west from Europe and a single ocean brings you to Japan and Cathay, with nothing in between. Every student’s first question is where the New World went."

[items.midd_elburg_spyglass]
name = "Middelburg spyglass"
lore = "In a Middelburg spectacle shop, two lenses set at either end of a leather tube bring the weathercock on a distant church tower right up to the eye. The grinder spoiled more glass than anyone counted to make this one, and the shop has no other."

[items.chart_case]
name = "Chart case"
lore = "Two boards and a few straps with the rolled charts between them. A chart fresh from a damp hold is laid flat on deck and weighted until it dries before anyone sets dividers to it."

[items.plotting_dividers]
name = "Chart dividers"
lore = "Two brass legs, one planted on the departure, the other walking toward landfall. An apprentice riddles scrap paper with pinholes before letting the points touch a real chart, which costs more than a year of apprentice wages."

[items.nocturnal_dial]
name = "Nocturnal dial"
lore = "Hold it up at night, sight the Pole Star through the hole in the center, swing the arm onto the Guards of the Little Bear, and read the hour. When clouds roll in, it stays in its pouch."

[items.hour_glass]
name = "One-hour sandglass"
lore = "It runs out every hour. A schoolroom uses it to divide the reading turns, a counting house to time a clerk’s work. As the neck wears wider the sand runs faster, so once a year the old master checks it against the church bells."

[items.tide_staff]
name = "Tide staff"
lore = "A marked post stands at the ferry landing. Every day the ferryman notes on a board beside it how high the tide came, and after a year that board says which days run high and which days no boat should cross, more reliably than any old-timer."

[items.abacus]
name = "Merchant's abacus"
lore = "Two beads above the bar, five below. The shopkeeper clacks through the sums while the apprentice copies them into the ledger. At closing the apprentice pushes every bead home, so tomorrow’s accounts start from nothing."

[items.balance_weights]
name = "Small balance and weights"
lore = "An Antwerp silversmith checks the weights against the city standard before weighing anything a customer brings in. However bright the silver, the pan decides what it weighs."

[items.ship_model]
name = "Sail-training model"
lore = "A ship in miniature whose yards rise, fall, and swing at a tug of the line. Boatmen’s children learn the order of taking in sail on the floor at home; the wind teaches them the rest once they are at sea."

[items.portuguese_astrolabe_master]
name = "Portuguese mariner's astrolabe — masterwork"
lore = "The work of a Lisbon founder who never signed it. The scale is so fine it must be read up close, and the rim bears the initials of each owner in turn. Astrolabes like this never reach a shop; they turn up in a pilot’s estate, or through a friend who knows of one."

[items.sounding_lead_master]
name = "Sounding lead — masterwork"
lore = "Evenly cast, with a deep tallow cup and a brass-lined eye for the line. Every fathom of the line carries its own scrap of leather or cloth, so the depth can be read by touch in the dark. An old pilot leaves a lead like this only to an apprentice."

[items.abacus_master]
name = "Merchant's abacus — masterwork"
lore = "A rosewood frame with beads worn silky, so they barely click. It is the heirloom of an old trading house, never sold, changing hands only when a family divides its property or entrusts it to someone."

[items.chart_case_master]
name = "Chart case — masterwork"
lore = "Oiled teak boards and Moroccan goatskin straps; closed, it keeps out even the sea fog. When an old captain died, it went to the next holder by the terms of the will."

[items.quadrant_master]
name = "Quadrant — masterwork"
lore = "Boxwood, with the scale inlaid in silver wire that reads clearly by a single lamp. The plumb line is twisted silk and never tangles in the wind. The maker left no name, only a small star cut into the back."

