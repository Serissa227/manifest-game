# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.marco_venice]
name = "The Travels of Marco Polo (Italian edition)"
lore = "The book’s Cathay, Quinsay and Zaitun are all old names; travelers back from Asia open it and often pencil the present names in the margins."

[items.staden_marburg]
name = "Hans Staden: True History"
lore = "Hans Staden was taken captive by the Tupinambá in Brazil and nearly ended up on their table; woodcuts carried his story across Germany, and the pages on the cannibal feasts are always the most thumbed."

[items.seydi_mirror_ms]
name = "Seydi Ali Reis: Mirror of Countries"
lore = "Seydi Ali’s fleet was scattered by storm and Portuguese guns, and he had to bring his men home from India overland to Istanbul; the rulers, scholars and dangerous roads met on the way are all set down in this book."

[items.guicciardini_antwerp]
name = "Guicciardini: Description of the Low Countries"
lore = "Guicciardini is a Florentine who lived many years in Antwerp; his book goes through the towns one by one, with their trades and the rules of the exchange, and a newly arrived merchant turns its pages looking for a way in."

[items.mercator_duisburg]
name = "Mercator: World Map (bound sheets)"
lore = "Mercator’s great world map comes as eighteen sheets, here bound into a volume that can be leafed through; the rhumb lines are drawn straight, but how far it is still has to be worked out by the pilot himself."

[items.cruz_evora]
name = "Gaspar da Cruz: Treatise on China"
lore = "A book printed at Évora devoted to China: walls, prisons and marriage customs, down to how people eat with two little sticks. Travelers back from the East like to check it against what they saw."

[items.ortelius_antwerp]
name = "Ortelius: Theatrum Orbis Terrarum"
lore = "Dozens of maps of one size are bound into a single book, so that a turn of the page takes you from Portugal to Japan, and no one has to spread mismatched loose sheets across the whole room."

[items.escalante_seville]
name = "Escalante: Discourse on Portuguese Navigation to the East"
lore = "This little book on the Portuguese voyages east actually prints Chinese characters on its pages; readers in Seville have never seen such a thing and have to ask an interpreter."

[items.mendoza_rome]
name = "Mendoza: History of the Great Kingdom of China"
lore = "Mendoza never went to China; the book is put together from the reports of envoys, merchants and missionaries, and anyone planning to go must sort out for himself, item by item, what was seen and what was only heard."

[items.hakluyt_london]
name = "Hakluyt: Principal Navigations"
lore = "English captains’ voyage reports, old charters and merchants’ letters are gathered into one thick volume, and merchants from the North Sea turn first to the routes their countrymen have sailed."

[items.ricci_zhaoqing]
name = "Matteo Ricci: Map of the Mountains, Seas and Lands"
lore = "Matteo Ricci’s Chinese world map, drawn at Zhaoqing, sets seas and lands no one had heard of beside the familiar names; the prefect Wang Pan had it cut in blocks and gave most prints to officials he knew, so outsiders rarely see one."

[items.guangyutu_print]
name = "Luo Hongxian: Guang Yutu"
lore = "Every page is ruled into squares, one square to a hundred li, with towns and passes marked by signs, so a finger counting squares gives the distance; readers on the Fujian coast also like to turn to the maps of foreign lands at the back."

[items.pinto_lisbon]
name = "Fernao Mendes Pinto: Peregrination"
lore = "Pinto claims twenty-one years of wandering in the East, thirteen times taken captive and seventeen times sold; what you hold is a manuscript copied from hand to hand, and no printed edition is yet to be had in the shops."

[items.cieza_seville]
name = "Cieza de Leon: Chronicle of Peru (Part I)"
lore = "Cieza walked the length of the Andes, and this new book records the Inca highways, waystations and towns, and the customs of the mountain people; travelers bound for Peru pack it and check it station by station."

[items.shuyu_ms]
name = "Yan Congjian: Comprehensive Records of Foreign Lands"
lore = "Old archives, envoys’ reports and overseas hearsay are made into an account of foreign lands by Yan Congjian; finished in the second year of Wanli, it circulates only in copies among his former colleagues at the Messenger Office."

