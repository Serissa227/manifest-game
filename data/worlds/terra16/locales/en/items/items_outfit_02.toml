# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.ming_oilpaper_umbrella]
name = "Ming oil-paper umbrella"
lore = "Bamboo ribs and oiled paper; when it tears, paste on another sheet. Anyone may carry one in the rain, but walk through the city gate under it on a sunny day and the guards will look twice, since sunshades belong to men of rank."

[items.ming_silk_parasol]
name = "Ming rank-marked silk parasol"
lore = "Silk gauze, its finial, color, and number of tiers all fixed by rank in the Collected Statutes of the Great Ming. Whose it was, and by what right it passed to another, someone will have to explain face to face."

[items.kyoto_long_parasol]
name = "Kyoto long-handled parasol"
lore = "Raised on its long handle, it shades a companion too. On Kyoto’s narrow wooden bridges, when two parasols meet, one must tilt aside to let the other pass, and the first to yield is usually the better-mannered."

[items.white_parasol_bag]
name = "White parasol cover"
lore = "A plain-looking white bag for a parasol, yet like the felt saddle cover it is an honor used only with the shogun’s leave. Who granted this one is a story still to be told."

[items.malay_payung]
name = "Malay plain payung"
lore = "A plain parasol, neither white nor yellow, for in the Malay kingdoms those colors belong to royalty. A newcomer in port asks what color and how many tiers are proper here before opening it."

[items.pegu_palm_parasol]
name = "Pegu palm-leaf parasol"
lore = "A broad parasol of woven palm leaf; in the Pegu market every seller of dried fish and betel has one. When the rain stops it is turned to the wind, and the seams dry in no time."

[items.velvet_face_mask]
name = "English velvet face mask"
lore = "A black velvet mask lined with silk, held in place by a button gripped between the teeth. Englishwomen wear it on horseback against the sun, and travelers who burn easily have taken up the habit."

[items.travel_veil]
name = "Travel veil"
lore = "A thin layer of gauze drawn over nose and mouth when the dust blows. Inside a host’s door it is rearranged to suit the house, and what is proper in Aden is not what is proper in Cairo."

[items.wide_brim_hat]
name = "Broad-brimmed hat"
lore = "A brim wide enough to shade both shoulders and a cord tied snug under the chin, so no sea wind can take it. Lose the hat over the side and the day’s shade goes with it."

[items.covered_litter]
name = "Covered litter"
lore = "The litter’s canopy folds away, and the bearers set it up again on arrival. Only the cloth, the bamboo frame, and a travel pass come along; the litter itself can be hired in any city."

[items.covered_carriage]
name = "Covered-carriage fittings"
lore = "A roll of canvas and a few bent hoops turn any carriage into a covered one against sun and rain. The heavy frame waits in a harbor storehouse; only the light parts travel."

[items.ship_awning]
name = "Shipboard awning"
lore = "Canvas spread over the deck, lashed tight yet ready to come down with one pull. Shade makes a crew drowsy, and the captain’s favorite saying is that someone under the awning still has to watch the sea."

[items.oiled_sailor_coat]
name = "Oiled sailor's coat"
lore = "Linen soaked in linseed oil until it stands stiff, so spray just slides off. It keeps the sea out but the sweat in, and the clothes underneath come off for washing the moment the ship makes port."

[items.academy_plain_coat]
name = "Academy plain-cloth coat"
lore = "The plain, hard-wearing coat Antwerp merchants’ children wear to lessons. The cuffs are sewn on separately and come off for washing when they pick up ink, so none of it ends up smeared in the ledgers."

[items.court_apprentice_kosode]
name = "Court apprentice's kosode"
lore = "The plain kosode and scarlet trousers of a girl in training at court. How to walk the corridors, where to kneel, how to gather the sleeves: all learned in this, over and over. The embroidery is only begun; the rest is hers to add in time."

[items.school_child_robe]
name = "Community-school pupil's robe"
lore = "The blue cotton robe of a community-school pupil. The mother turned up a deep hem when she sewed it, so when the child shoots up she can let out a few stitches and get another year from it."

[items.page_training_coat]
name = "Page's practice coat"
lore = "A page’s practice coat from a marquis’s household, with thick leather sewn at the elbows. Mornings are for learning to bow and to hand over a cup; afternoons, footwork with the fencing master. Fall often enough and the elbows go first."

[items.azhar_student_robe]
name = "Al-Azhar student's robe"
lore = "Students at al-Azhar sit cross-legged under the colonnade through a whole morning’s lesson. Each robe is sewn at home and no two match: the school cares nothing for what a student wears, only whether the text is learned by heart."

[items.giri_student_sarong]
name = "Giri student's sarong"
lore = "Giri sits on a hill outside Gresik, and its students climb the path up and down every day. A light sarong never tangles the stride; in the rains each student keeps two, one to wear and one drying under the eaves."

[items.padua_scholar_gown]
name = "Paduan scholar's gown"
lore = "A Paduan student’s black gown, too familiar to replace even when worn thin. The inner pocket at the chest is frayed from borrowed books: carried off, returned, carried off again."

[items.seamstress_apron]
name = "Needleworker's apron"
lore = "Little pockets all over it for thread ends, thimble, and pincushion. Before the shop closes the head seamstress counts the needles and no one leaves until every one is found, because a needle in a customer’s clothes chest would be the end of the shop’s good name."

[items.shipwright_apron]
name = "Shipwright's leather apron"
lore = "Thick cowhide caked layer on layer with sawdust and pine resin, until it can stand up by itself in a corner. More than once it has stopped an adze that slipped."

[items.desert_travel_wrap]
name = "Desert travel wrap"
lore = "Two layers, one light and one heavy: the thin for the noon sun, the thick for the cold night. Heat and cold change fast on the sand road, but what matters more is keeping close to the guide who remembers every well."

[items.indian_cotton_tunic]
name = "Indian cotton tunic"
lore = "Fine Calicut cotton that dries in half a day. There is a yellow mark on the front that will never wash out, turmeric from the ship’s cook, and by now it feels like an old friend."

[items.swahili_work_wrap]
name = "Swahili working wrap"
lore = "A porter’s wrap, knotted at the waist and done. The knot goes at the side, never up by the shoulder, where a crate corner can catch it and drag the whole cloth off."

[items.andean_wool_mantle]
name = "Andean wool mantle"
lore = "An alpaca mantle carried down from the mountains, just as welcome on a cool night by the sea. All four corners wore through once, and the weaver went round them again with heavier yarn."

[items.maya_cotton_mantle]
name = "Maya cotton mantle"
lore = "Rolled tight before boarding and tucked beside the cacao sacks to stay dry. When the canoe touches shore it is shaken out and put on for the call on the town’s headman."

[items.korean_winter_coat]
name = "Korean padded travel robe"
lore = "The padding is quilted into little squares so it never bunches, however far the road. After a sea crossing it needs a full day of sun, or the damp stays in the cotton and wearing it in winter is like wearing wet snow."

[items.persian_travel_coat]
name = "Persian travel coat"
lore = "The hem carries the dust of every caravanserai from Isfahan to Hormuz, a different color at each stop. The letters in the sleeve are spotless; they are for relatives far away and worth more than the coat."

[items.harbor_rain_cape]
name = "Harbor straw rain cape"
lore = "Layer upon layer of straw, and the rain runs straight off. The dock boy who goes to school hangs it in the porch before stepping in, and it drips a puddle onto the boards."

