# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.hafiz_ms]
name = "Hafiz: Divan"
lore = "Beneath Hafiz’s wine, roses and beloveds lies a longing for God. When people cannot make up their minds, they open his Divan at random and see what the first line says."

[items.rumi_ms]
name = "Rumi: Masnavi"
lore = "“Listen to the reed as it tells its tale, lamenting separation.” In the lodges of Konya the dervishes recite Rumi’s six books, story nested within story, each pointing the way back to God."

[items.attar_ms]
name = "Attar: Conference of the Birds"
lore = "The hoopoe leads the birds in search of the Simurgh, across seven valleys, until only thirty birds remain, and at journey’s end they find that what they sought was themselves. In Persian, “thirty birds” is si murgh."

[items.nizami_ms]
name = "Nizami: Khamsa"
lore = "Five long poems, among them Khusraw and Shirin, Layla and Majnun and the Seven Beauties, ending with Alexander. He enters the Land of Darkness for the Water of Life, but it is his guide Khidr who drinks; long-distance travelers love that part best."

[items.jami_ms]
name = "Jami: Seven Thrones"
lore = "The seven poems Jami of Herat wrote in his later years, known as the Seven Thrones. Yusuf and Zulaykha is the favorite, and painters love the scene where the ladies of Egypt, staring at Yusuf, cut their hands instead of their fruit."

[items.saadi_gulistan]
name = "Saadi: Gulistan"
lore = "Prose and verse Saadi wrote after years of wandering, with stories of kings, merchants and dervishes. From Istanbul to Delhi, a child learning Persian most likely starts with this book."

[items.suhayli_ms]
name = "Kashifi: Lights of Canopus"
lore = "Kashifi retold Kalila and Dimna in lavish Persian: two jackals at the lion king’s court, one urging caution, the other stirring up trouble. Courtiers read it and recognize their colleagues on every page."

[items.tutinama_ms]
name = "Nakhshabi: Tales of a Parrot"
lore = "The merchant has sailed, his wife longs each night to slip out to her lover, and the parrot keeps her home with a story until dawn: fifty-two nights, fifty-two tales. In seafaring merchants’ households, the laughter is a little uneasy."

[items.masudi_ms]
name = "Al-Masudi: Meadows of Gold"
lore = "Al-Masudi traveled to India and down the East African coast, and wove the tales of sailors from Siraf and Oman into his history, news of Chinese ports among them. Readers follow the names of men and harbors to trace how each story traveled."

[items.antara_ms]
name = "Romance of Antar"
lore = "Antar, son of an enslaved mother, wins his freedom and his beloved Abla with his sword and his verses. Coffeehouse storytellers spin it out over dozens of nights, and when he rides into battle the listeners pound the tables."

[items.dhat_himma_ms]
name = "Romance of Princess Dhat al-Himma"
lore = "The warrior princess Dhat al-Himma leads armies against the Byzantines in a tale long enough to last a storyteller the whole winter. Among the listeners by the lamp are girls quietly clenching their fists."

[items.dede_ms]
name = "Book of Dede Korkut"
lore = "Twelve tales of the Oghuz, each closed with a blessing from the old bard Dede Korkut on his kopuz. The copies are only a few decades old; the stories are older than the Ottoman house."

[items.nights_ms]
name = "The Thousand and One Nights (Syrian manuscript tradition)"
lore = "Each night Shahrazad tells a story and leaves it hanging, with tales nested inside tales. The Syrian copies disagree on what they contain, and some break off after two hundred-odd nights."

[items.shahnameh_tahmasp]
name = "Firdawsi: Shahnameh (Shah Tahmasp manuscript)"
lore = "Shah Tahmasp’s court painters in Tabriz spent more than a decade on this Shahnameh: over two hundred and fifty paintings, pages thick with gold and lapis. For an outsider, a single glimpse is an extraordinary favor."

[items.leo_ms]
name = "Leo Africanus: Description of Africa (Italian manuscript)"
lore = "Al-Hasan of Fez, seized by corsairs and baptized in Rome by Pope Leo X, wrote of the North African cities he knew in Italian. Anyone who has lived in Fez recognizes in his markets and bathhouses details only a resident could have written."

[items.idrisi_ms]
name = "Al-Idrisi: The Pleasure of the Traveller"
lore = "King Roger of Sicily commissioned this geography from al-Idrisi, dividing the world into seven climes and seventy sectional maps, with the days’ journey between towns. Readers measure the old distances against today’s trade routes."

[items.battuta_ms]
name = "Ibn Battuta: Travels"
lore = "Ibn Battuta of Tangier traveled for nearly thirty years, then dictated it all in Fez to Ibn Juzayy: Mecca to Delhi, the Maldives to Zaitun. His fellow Maghribis read him and wonder how much of it to believe."

[items.khaldun_ms]
name = "Ibn Khaldun: Muqaddimah"
lore = "Ibn Khaldun wrote it shut away in a remote fortress: dynasties rise on the solidarity of a group and spend it within three or four generations. Merchants who have traveled through several realms can always supply examples of their own."

[items.ibn_iyas_ms]
name = "Ibn Iyas: Wonders of the Ages"
lore = "Ibn Iyas of Cairo recorded his city day by day: the price of bread, the plague, the Ottoman army marching in, the last Mamluk sultan hanged at Bab Zuwayla. This is what great events sound like inside a single city."

