# Attributed to Balinus, the Arabic work links creation and hidden properties; the ninth-century date is a conventional anchor, not a secure date for this copy.
# The first 353 quatrains invite competing readings; revealing the next event's date on this world's timeline is a game extension of their claimed insight.
