# 对应中文同名分片的英文显示覆盖；每件仅覆盖 name 与 lore。

[items.ficino_florence]
name = "Ficino: Three Books on Life"
lore = "Ficino’s advice on a scholar’s health: late nights drain the spirits and melancholy belongs to Saturn, so take the sun, play the lyre, breathe sweet scents and drink a little good wine. The third book reaches higher, teaching how to draw life from the stars."

[items.pico_rome]
name = "Pico: Nine Hundred Theses"
lore = "At twenty-three, Pico posted nine hundred theses in Rome and offered to pay the travel costs of anyone who came to debate him. The debate never took place; in 1487 the pope banned the whole book, and scholars pass it around only in private."

[items.lazzarelli_paris]
name = "Lazzarelli: Crater of Hermes"
lore = "A dialogue in Hermes’ name on how a man may make gods with words, bound at the back of Lefèvre’s Hermetic collection printed in Paris. Readers usually start with Ficino’s Pimander and turn to this afterward."

[items.reuchlin_verbo]
name = "Reuchlin: On the Wonder-Working Word"
lore = "Reuchlin seats a philosopher, a Jewish scholar and himself together to talk about the names of God: set one more Hebrew letter into the four of the Divine Name, he argues, and you have the holy name of Jesus. Readers come away with learning and reverence."

[items.reuchlin_cabalistica]
name = "Reuchlin: On the Art of the Kabbalah"
lore = "Dedicated to Pope Leo X, the dialogue has a Jewish sage explain the Kabbalah to a Pythagorean and a Muslim: the Kabbalah as Reuchlin, a Christian, understood it. He wrote it in the years he spent in court keeping Hebrew books from the fire."

[items.trithemius_steganographia]
name = "Trithemius: Steganographia (manuscript)"
lore = "On its surface it is a book of spells for summoning angels to carry messages; those who know can see a cipher hidden in the names. One of the abbot’s letters gave the secret away, and the manuscript has been sought and copied ever since, but never printed."

[items.agrippa_occulta]
name = "Agrippa: Three Books of Occult Philosophy"
lore = "Its three books move from the hidden virtues of herbs and stones, to numbers and stars, to angels and divine names, and students of the occult treat it as their master text. Once the Roman Index of 1559 banned its author, copies grew harder to find."

[items.secretum_ms]
name = "Secret of Secrets (Latin manuscript)"
lore = "It claims to be Aristotle’s private letter to Alexander: how to rule, how to stay healthy, how to read a man by his face. Few books were copied more often in the Middle Ages, and more than one reader has long doubted the name on it."

[items.hermetica_ficino]
name = "Corpus Hermeticum (Ficino's Latin translation)"
lore = "Old Cosimo de’ Medici had Ficino set Plato aside and translate Hermes first, for the Egyptian sage was thought to be as ancient as Moses. In learned circles it is read and reread, and the words matter far more than the binding."

[items.hermetica_greek]
name = "Corpus Hermeticum (first Greek edition)"
lore = "Turnèbe’s Paris press prints the Greek at last, and readers raised on Ficino’s Latin can check it word by word. A few lines, it turns out, never meant what they had memorized."

[items.alchemia_nuremberg]
name = "De Alchemia (including the Emerald Tablet)"
lore = "Petreius of Nuremberg gathered a stack of alchemical treatises into one volume, and the Emerald Tablet’s dozen-odd lines sit among them. “That which is below is like that which is above”: apprentices copy it onto the wall and puzzle over it for years."

[items.bensira_constantinople]
name = "Alphabet of Ben Sira"
lore = "A small Hebrew book in which young Ben Sira trades sharp answers with the king of Babylon, telling along the way of Lilith, Adam’s first wife. The old folk say the amulets bearing three angels’ names that hang over childbeds come from this very story."

[items.molitor_reutlingen]
name = "Molitor: On Witches and Female Soothsayers"
lore = "Archduke Sigismund of Tyrol sits down with Molitor and another learned man to debate: can witches really ride a forked stick into the sky? The woodcuts show them flying, though the conclusion calls it mostly the devil’s illusion. The women accused are flesh-and-blood neighbors."

[items.spina_venice]
name = "Spina: On Witches"
lore = "The Dominican Spina insists that witches truly fly by night to their gatherings. On paper it is a scholars’ dispute; in the mountain villages it becomes trial after trial, and a reader learns how an accusation is built, one sentence at a time."

[items.hoki_ms]
name = "Hoki Naiden (Onmyodo manuscript)"
lore = "A secret book of Onmyōdō attributed to Abe no Seimei. It opens with the origins of Gozu Tennō, then turns to the Konjin deity, directional taboos and the lucky and unlucky days of the almanac. Diviner households copy it among themselves; outsiders rarely glimpse it."

[items.yuanhai_ming]
name = "Yuanhai Ziping (Ming printing)"
lore = "Year, month, day and hour of birth become eight characters, and from them a whole life’s fortune is read: the old method of Xu Ziping’s school. Bookshops sell it everywhere, and a street fortune-teller’s stall usually has a dog-eared copy weighed down under a stone."

[items.creation_ms]
name = "Secret of Creation"
lore = "An Arabic book in the name of Balinus, whom the Greeks called Apollonius of Tyana. He tells of a crypt beneath a statue of Hermes where an old man sat holding a tablet of emerald, and the words on that tablet are copied at the end."

[items.solomon_key_ms]
name = "Key of Solomon (Latin manuscript)"
lore = "A ritual book under King Solomon’s name: how to purify yourself, choose the hour, draw the protective pentacles. Every copy adds or drops something, no two alike, and whoever copies one keeps it well away from the priest."

[items.voynich_ms]
name = "Unidentified Herbal and Astral Manuscript (Voynich Manuscript)"
lore = "Leaf after leaf of vellum filled with letters nobody can read, beside plants nobody can name, star wheels, and women bathing in pools. Who wrote it, and for whom, no one can say."

[items.nostradamus_lyon]
name = "Nostradamus: Prophecies (first edition)"
lore = "The first Lyon printing holds 353 quatrains, and everyone argues over which verse foretells what. Read it through and you will know the day the next great event falls."

[items.porta_naples]
name = "Della Porta: Natural Magic (four-book edition)"
lore = "Young della Porta of Naples crammed four books with the camera obscura, grafted fruit trees and curious recipes of every kind. Readers want to try each page in the kitchen the moment they reach it."

[items.weyer_basel]
name = "Weyer: On the Deceptions of Demons"
lore = "Weyer, physician to the Duke of Cleves, argues that most so-called witches are women who are ill, old or terrified. They need a doctor, not a pyre."

[items.dee_antwerp]
name = "John Dee: Hieroglyphic Monad"
lore = "Dee claimed he wrote it in Antwerp in twelve days: one sign built from moon, sun, cross and Aries, which unfolds into astronomy, alchemy and theology. Readers go slowly and argue for a long time."

[items.bodin_paris]
name = "Bodin: On the Demon-Mania of Witches"
lore = "The great jurist Bodin wrote it to refute Weyer, urging the harshest penalties and the loosest standards of proof in witch trials. Read it to see how an accusation is hammered, step by step, into a verdict."

[items.scot_london]
name = "Reginald Scot: Discoverie of Witchcraft"
lore = "Scot, a Kentish squire, takes market-fair conjuring apart trick by trick: how the coin vanishes, how the bodkin seems to pierce a forehead without a drop of blood. Most so-called witches, he says, are poor old women."

