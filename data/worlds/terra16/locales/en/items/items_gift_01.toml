# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.embroidered_kerchief]
name = "Hand-embroidered kerchief"
lore = "Little flowers from needlework class, the left one a size bigger than the right. Whoever receives it can count the stitches unpicked and redone over several evenings."

[items.copied_poem]
name = "Hand-copied poem"
lore = "Only the opening lines are copied out, and the closing lines are left blank. The poem is finished only when the one who receives it writes the answer."

[items.blended_incense]
name = "Hand-blended incense"
lore = "The first incense cake blended at the incense circle, its recipe written on the outside of the paper packet, with an honest note about the batch that burned."

[items.braided_cord]
name = "Hand-braided cord"
lore = "Two strands of silk braided into one cord, each color chosen by a different friend. Deciding who would tie the final knot took them half the afternoon."

[items.carved_boat]
name = "Hand-carved little boat"
lore = "Offcuts from the woodshop whittled into a little boat, the name of a port carved on its sail. That is where they will meet next time."

[items.tea_packet]
name = "Hand-roasted tea packet"
lore = "A small packet roasted by hand in the tea workshop, the firing steadier than last time. On the seal: Pour off the first steeping. The second one is for you."

[items.sugar_figs]
name = "Homemade candied figs"
lore = "Figs simmered in sugar in the kitchen and packed in a small box. Written on the lid in charcoal: Hot weather. Eat within three days."

[items.embroidered_pouch]
name = "Embroidered scent bag"
lore = "The drawstring was redone twice before it ended up in the recipient’s favorite color. The pinch of incense inside was wheedled out of the incense circle."

[items.calligraphy_fan]
name = "Hand-lettered folding fan"
lore = "A dozen sheets were ruined before the brush ever touched the fan. On the one finally given, the last stroke of the character for “wind” sweeps out extra long."

[items.wooden_gull]
name = "Carved wooden gull"
lore = "A wooden gull with its wings folded close, set on a base carved wide and flat so it stays upright on a rolling cabin table."

[items.shell_bracelet]
name = "Shell bracelet"
lore = "Small shells picked up on the beach, each ground smooth at the edge before being strung on cotton thread. It sits on the wrist without a scratch."

[items.reed_bookmark]
name = "Reed-leaf bookmark"
lore = "Pressed reed leaves cut into narrow strips, one for each member of the reading circle. Ever since, the circle’s books have had far fewer folded corners."

[items.painted_tile]
name = "Hand-painted tile"
lore = "An apprentice’s first tile from the workshop: a single tulip, with a little bubble on one petal from the firing. Keep it, said the master. Everyone’s first tile looks like that."

[items.ink_landscape]
name = "Small ink landscape"
lore = "A practice sheet from the painting circle with nothing on it but a ferry landing and two trees. The friend who receives it knows the place at once: where they waited for the boat together last time."

[items.miniature_portrait]
name = "Hand-painted miniature portrait"
lore = "A friend’s laughing face on a sheet the size of a palm. Asked beforehand, the friend set only one condition: don’t make the nose too big."

[items.woven_band]
name = "Handwoven band"
lore = "The colors of the band were picked from family clothes, a stripe of red from a mother’s, a stripe of blue from a grandmother’s. Tying it on is like setting out with the whole household."

[items.lace_edging]
name = "Handmade openwork edging"
lore = "A needlework apprentice spent a month at the bobbins to make this short length of edging. How to sew it onto a collar is left to the friend who receives it."

[items.quill_case]
name = "Handmade quill case"
lore = "A length of wood hollowed out into a quill case, its cap snug. The outside is carved with the name of the friend who is always borrowing pens. Now there is no excuse."

[items.rose_sweets]
name = "Rose sweets"
lore = "Sweets cooked from rose petals, the scent deliberately toned down by the kitchen so that first-timers don’t feel they are eating perfume."

[items.sesame_cakes]
name = "Sesame cakes"
lore = "Sesame cakes left over after the work shift. The baker picks out the roundest one first and wraps it for whoever comes late."

[items.clove_honey]
name = "Clove honey pot"
lore = "Cloves steeped in honey and sealed in a little clay pot, wound with straw cord against knocks. A slip of paper tied at the neck carries a greeting."

[items.poetry_scroll]
name = "Shared-verse roll"
lore = "Several friends took turns adding a verse, some in neat hands and some in scrawls. Rolled up at the end, it seems to hold that night’s laughter as well."

[items.debate_notes]
name = "Debate-circle notes"
lore = "What the notes record is not who won the debate but one thing the other side said, which after three days of thinking still seems to have something to it."

[items.star_sketch]
name = "Hand-drawn star sketch"
lore = "The stargazing circle drew one night’s sky on a single sheet, leaving blank the corner the clouds hid. Beside the blank someone has written: We’ll fill this in next time."

[items.carved_chessman]
name = "Hand-carved chess piece"
lore = "The old chess set had lost a knight, so someone carved a new one to match. It is a little smaller than the rest, but nobody at the board has ever complained."

[items.painted_shell]
name = "Painted seashell"
lore = "A stretch of coast is painted inside the shell, palms and a dugout canoe. The friend who got it says that held to the ear, it plays the sound of the ebbing tide."

[items.cotton_doll]
name = "Cotton-cloth doll"
lore = "A little doll stitched from dressmaking scraps, its skirt cut from the border of an old sari. Giving it means telling once more whose cloth it used to be."

[items.woven_basket]
name = "Handwoven basket"
lore = "A little basket from craft class, just big enough for a few letters. The handle is woven double, because a basket for letters must never let them fall."

[items.leather_bookwrap]
name = "Hand-sewn book wrap"
lore = "A leatherworking apprentice measured the spine before taking a single stitch and left a long thong, so it ties around the book however thick it grows."

[items.scented_soap]
name = "Handmade scented soap"
lore = "A small cake of olive oil soap, left to cure on the workshop shelf for a full month. Its scent is fainter than the shop kind, and whoever uses it says that is just right."

[items.wax_flower]
name = "Beeswax flower"
lore = "A small rose shaped from leftover beeswax in the wax workshop. Its maker gives strict instructions to keep it somewhere cool. The last one melted into a puddle on a windowsill."

[items.painted_kite]
name = "Hand-painted kite"
lore = "A paper kite painted as a carp. It was test-flown outside the walls first and took a tumble; the knot from that day is still on the reel."

[items.sea_song_sheet]
name = "Companions' sea-song sheet"
lore = "The music circle wrote down a sea song they had all sung together. One line has a circle drawn beside it and a note: Nobody can reach this."

[items.pressed_flower]
name = "Pressed-flower letter"
lore = "A fallen blossom picked up on a walk and pressed between two sheets of paper. The flowers still on the branch were left to bloom."

[items.cloth_ball]
name = "Sewn cloth ball"
lore = "Scraps packed in just firmly enough that it doesn’t sting the foot. After evening lessons everyone forms a circle in the yard, competing to keep it off the ground the longest."

[items.carved_spoon]
name = "Hand-carved wooden spoon"
lore = "A wooden spoon carved by a kitchen helper, its edge sanded round. Three were spoiled in practice; this is the fourth."

[items.travel_letter_case]
name = "Family-letter sleeve"
lore = "Close stitching keeps the corners of letters from home from fraying. A line of tiny writing is hidden in the lining, visible only when the letter is drawn out."

[items.cacao_gift]
name = "Hand-blended cacao gift"
lore = "Cacao blended to a friend’s home recipe, the chili measured out to the pinch. On the paper wrapper are the instructions: Whip up the foam first, then drink."

[items.carved_seal]
name = "Hand-carved personal seal"
lore = "The first seal from carving class, bearing only a name, its strokes still a little crooked. Once it is given, when and where to stamp it is up to its new owner."

[items.apprentice_notebook]
name = "Hand-bound blank notebook"
lore = "A binding apprentice sewed the blank gatherings firmly together and left the cover bare. What goes on the first page is left to whoever receives it."
