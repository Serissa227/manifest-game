# 对应中文同名分片，仅覆盖显示字段；数字、出处与引用沿用原文。

[items.emerald_mark_genoa]
name = "Emerald record: Genoa's basin"
lore = "The green six-sided dish in the sacristy of Genoa’s cathedral, said to be the basin of the Last Supper. On a feast day the chapter allowed it to be drawn and weighed. The dish went back under lock; only this paper left the room."

[items.emerald_mark_toledo]
name = "Emerald record: Solomon's table"
lore = "In 1546 the archbishop sent men down into the Cave of Hercules at Toledo, and they came back speaking only of rushing water and a cold wind. The marks on this page were drawn from memory by an old man who went down that day. No one saw Solomon’s table. The marks are real."

[items.emerald_mark_cortes]
name = "Emerald record: five carved stones"
lore = "Gómara’s book of 1552 describes five carved stones: a rose, a horn, a fish with golden eyes, a little bell with a pearl for its clapper, and a cup on a golden foot. In 1541 they went down with the emperor’s fleet off Algiers. One side of this sheet copies the five stones from the book; the other records what the divers felt for on that seabed."

[items.emerald_mark_tides]
name = "Emerald record: the tide jewels"
lore = "Manju and Kanju, the two islands off Shimonoseki, are sacred ground of the Imi Shrine, and no one may land. They were sketched from a festival boat while the worshipers bowed from the water. The legend says the sea god once gave two jewels: one to call the tide in, one to send it out."

[items.emerald_mark_seal]
name = "Emerald record: imperial seal impression"
lore = "The Qin seal carved from the He jade burned with the last emperor of Later Tang, or so the histories say. On the steppe they say it passed to the Yuan and rests now in the Chahar khan’s tent. The khan allowed a single impression: the paper may go, the seal stays."

[items.emerald_mark_solomon]
name = "Emerald record: seal and inscription"
lore = "Two rubbings laid side by side: one from the lead seal on a copper flask a fisherman netted, one from the line over the stone gate of Great Zimbabwe that Barros said even learned Moorish merchants could not read. Only together do they show the same hand cut both."

[items.emerald_mark_buddha]
name = "Emerald record: the Emerald Buddha"
lore = "They call it the Emerald Buddha, though it is a single piece of green jade. The monks of Luang Prabang allowed the time of one incense stick before it to set down how it looks. The page holds words and no picture; the image stays where it is."

[items.tabula_smaragdina]
name = "Emerald Tablet transcript"
lore = "The Emerald Tablet runs barely a dozen lines, and no two copies quite agree. This scrap of Latin breaks off at “that which is below is like that which is above,” and in the margin, in a different ink, someone has asked: which above, and which below?"

[items.straits_order_roll]
name = "Straits order roll"
lore = "The roll of the Strait order: seventy-seven names, each followed by a mark. A cross for the dead, a circle for the living, a blank where no one knows. In every port Noël opens it, hoping to turn one blank into a circle."

[items.commander_journal]
name = "Old commander's journal"
lore = "The old commander’s journal, its last pages written aboard a ship sailing west. The margins are full of unfinished business: a round of drinks owed to one man, a promise to visit another’s children. Noël is copying them out one by one, meaning to settle each in the commander’s place."

[items.majid_hidden_route]
name = "Hidden route attributed to Ibn Majid"
lore = "A few lines in Ibn Majid’s route poems rhyme awkwardly, and any pilot who knows the craft can tell a route lies hidden there, never spelled out. The other half of the verse lives in someone else’s memory; first find the old master who inherited it."

[items.star_crossing_original]
name = "Original star-crossing notes"
lore = "The star sightings Wen Xingcha’s grandfather wrote in his own hand on the treasure fleet’s voyages, fingers and angles crammed onto every page, with corrections in red ink along the edges. The last page points beyond the Western Ocean. Anyone can copy the chart; these notes exist only once."

[items.imperial_seal_rubbing]
name = "Imperial seal impression"
lore = "A sheet stamped in red with the imperial seal and bearing a single promise: those who helped will not be forgotten. The seal is genuine; how genuine the promise is depends on how the war in Liaodong ends. However large the red seal, the realm it speaks for belongs to someone else."

[items.afo_seeds]
name = "Afo clove seeds"
lore = "Seeds gathered beneath Afo, the old clove tree on the slopes of Ternate, wrapped in a banana leaf. The old people say a spirit lives in the tree, and Kaicili promised it that these few would sprout in other soil."

[items.maya_inheritance_codex]
name = "Maya family codex"
lore = "Bark paper folded like a screen, one fold to a generation: who married whom, which cacao grove belongs to which family, what was promised to the next town. There are no spells in it, only names, and the friars would burn it all the same. Ix has been trusted to keep it hidden."

[items.kongo_royal_letter]
name = "Letter from Kongo's king"
lore = "A letter from the king of Kongo written in Portuguese, this copy made by his secretary and sealed with a cross in the wax. It asks one thing only: that no more traders be allowed to carry his people onto ships. The bearer is charged to deliver it by hand, where the letter says."

[items.legend_ship_plan]
name = "Legendary vessel plans"
lore = "Refit plans for a zabra: lean hull, sails and oars, and at the bow a boarding bridge with an iron beak, the device the Romans called the raven. The drawing is densest where bridge meets bow, and a shipwright will have to check it joint by joint."

[items.emerald_auction_page]
name = "Auction leaf pointing to the Emerald Tablet"
lore = "An old manuscript leaf sold at auction in the Istanbul bedesten. The marginal note mentions the Emerald Tablet, but it is not in the main copyist’s hand. Whoever added that note is the one to find."

[items.atlantis_translation]
name = "Atlantis comparison notes"
lore = "Ficino’s Latin and the Aldine Greek copied out line by line in two columns. Wherever they disagree, the scholar has circled the passage in red. If the answer to where Atlantis lies is anywhere, it is inside those red circles."

[items.old_teacher_letter]
name = "Former teacher's introduction"
lore = "A letter of introduction from a former teacher, setting out plainly what the student has studied and how well. It ends with a single line: “As for the rest, please see for yourself.”"

[items.shipwright_receipt]
name = "Shipwright's handover record"
lore = "The record the shipwright wrote on the day the plans changed hands, with three witnesses signed on the back. The plans were later scattered and some sheets lost; to make them whole, those three must first be found, one by one."

[items.liaodong_dispatch]
name = "Liaodong courier's dispatch"
lore = "A secret dispatch sealed in a wax ball, due at a camp in Liaodong by an agreed day. Arrive a day late and its news is old news. The war does not wait."

[items.academy_testimonial]
name = "Academy testimonial"
lore = "The certificate the teachers sign on the last day, each skill learned written out in turn and the school’s seal at the foot. Which road comes next is not on the page; that is the holder’s to choose."

[items.island_safeconduct]
name = "Island passage token"
lore = "A wooden tally carved with the marks of two chiefs, issued only once they had come to terms. With it no island harbor will turn the boat away, but whoever leads the boat must remember every condition that was promised."

[items.court_invitation]
name = "Court introduction slip"
lore = "A letter of introduction in the flowing hand of the palace ladies. Mio folds the appointed hour into one corner so as not to forget it. The palace waits for no one, and the Ichijō name will not excuse a late arrival."

[items.divers_witness]
name = "Diver's testimony"
lore = "An Algiers diver’s drawing of the wreck site: where the reef lies, where the sand, which rib of the hull has something pinned beneath it. He will go down again, provided someone outfits the rope, the weights, and the boat anew."

