# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.fall_ensisheim]
name = "Ensisheim Thunderstone"
lore = "In November 1492 a black stone crashed into a wheat field outside Ensisheim, and only one boy saw it fall. Maximilian declared it a sign from heaven and had it hung in the church, chained up so it could not fly off again."

[discoveries.fall_crema]
name = "Memory of the Crema Stone Rain"
lore = "In September 1511 stones rained on the fields outside Crema, in the middle of a war. Old farmers still turn up scorched black pieces with the plow, and Cardano wrote that more than a thousand fell that day."

[discoveries.fall_libyan_glass]
name = "Glass of the Great Sand Sea"
lore = "Between the dunes of the Great Sand Sea lie pieces of pale yellow-green glass that glow like set honey against the light. Egyptian craftsmen once carved scarabs from it. The camel drivers say the sun melted the sand here."

[discoveries.fall_moldavite]
name = "Green Glass of the Vltava Region"
lore = "Farmers plowing the Vltava valley often turn up shards of dark green glass, wrinkled like crumpled paper, some nearly black and some pale as spring moss. Some string them on a cord around a child’s neck to keep evil away."

