[auctions.goa_leilao]
name = "Rua Direita auction"
lore = "There’s an auction on the Rua Direita every morning, but these three days in January are the big ones: the ships for Lisbon are about to sail, and anyone going home turns their goods into gems to sew inside their clothes. Criers weave through the crowd holding up the lots, calling bids in Portuguese, Konkani, and Persian; ladies watch from behind balcony blinds and send their maids down with offers."

[auctions.goa_leilao.lots.emerald_ring]
after_loss = "Green stone from the mountains of New Granada, carried halfway round the world to Goa—where the princes pay more for it than Seville’s nobles ever would. Vikram says someone at the court of Vijayanagara will love it. If someone else wins it, ask the clerk who; do them a favor, then borrow it to wear a few days or trade for it."

[auctions.goa_leilao.lots.pearl_earrings]
after_loss = "A pair of Bahrain pearls matched in size, color, and luster—the kind a whole pearling season might yield once. A lady on the Rua Direita who never shows her face lowered notes from her balcony in a little basket: three bids, each higher than the last. If you lose them, the clerk has the buyer’s name; do them a service, then talk about trading for them or borrowing them for one occasion."

[auctions.goa_leilao.lots.jingdezhen_blue_white]
after_loss = "A pair of deer looking back over their shoulders in the well of the bowl, painted far more finely than the usual export ware. João Fernandes says he’s seen porcelain by the shipload, and one this free of kiln flaws turns up maybe twice a ship—then he raised the bid himself. If someone else buys it, the clerk knows the buyer; do them a service, then borrow it to look your fill, or trade for it."

[auctions.goa_leilao.lots.longquan_celadon]
after_loss = "A dish handed down three generations in an old Hormuz merchant family, sold only now that the house has fallen on hard times. Karim knows the family; when he bid, he couldn’t meet the eyes of their old steward across the room. If it goes elsewhere, the clerk has the buyer’s name; get something done for them, then talk trade or loan."

[auctions.goa_leilao.lots.blue_white_flask]
after_loss = "Queen Catherine in Lisbon collects rarities from the East, and every nobleman sailing home in January wants something to present. Several asked around at the preview: the Queen has no flask of this shape yet. If someone else wins it, the clerk knows who; do the buyer a service, then trade for it or borrow it to look at."

[auctions.goa_leilao.lots.persian_carpet]
after_loss = "A Persian carpet by way of Hormuz; laid in a Goan nobleman’s hall, it makes everyone who comes in walk softly. Karim has worked out it would fetch twice as much in Lisbon—and won’t bid a coin more for it, because the sea’s risks belong in the sum too. If someone else buys it, the clerk knows the buyer; help them once, and you can ask about a loan or a trade."

[auctions.goa_leilao.lots.hafiz_ms]
after_loss = "The Deccan sultans love Persian verse, and a scribe from the Bijapur court came all the way down from the hills to buy. Yasmin found a poem about Shiraz, read it twice, and kept her hand flat on the page. If you lose, the clerk has the buyer’s name; do them a service, then borrow it to copy or trade for it."

[auctions.goa_leilao.lots.small_kris]
after_loss = "Sailors from Malacca say a kris knows its master and grows restless in new hands—you’d better speak kindly to it first. Vikram smiled at that and bid anyway. If someone else wins it, ask the clerk who; get something done for them, and you can borrow it for a while or trade for it."

[auctions.goa_leilao.lots.indian_katar]
after_loss = "A punch dagger with a Vijayanagara palace guard’s pattern chased into the grip. Vikram says a blade like this has no business hanging on a Portuguese wall—and then he matched every raise. If it goes to someone else, the clerk knows the buyer; do them a service, then talk trade or loan."

[auctions.goa_leilao.lots.sandalwood_piece]
after_loss = "A whole log of old Mysore sandalwood, dark and close-grained and heavy in the hand. A steward from a temple across the river wants it for a new seat for the god—his temple moved there from the island some years ago. If someone else buys it, the clerk knows the buyer; do them a service, then trade for it or ask them to spare you a length."

[auctions.goa_leilao.lots.agarwood_piece]
after_loss = "Agarwood from Champa, so rich in resin it’s nearly black. João Fernandes says a Japanese lord will pay a chest of silver for good incense wood, and he means to ship it there; Yasmin took one breath of it and has matched him raise for raise ever since. If it goes elsewhere, the clerk has the buyer’s name; do them a service, then trade for it or beg a sliver to burn."

[auctions.goa_leilao.lots.quadrant]
after_loss = "An ordinary brass quadrant, its scale polished bright by daily use. Karim says his old pilot has no need of one, but the young men aboard must learn, and he wants to buy them this. If you lose, the clerk has the name; do the buyer a favor, then borrow it for a few lessons or trade for it."

[auctions.goa_leilao.lots.ambergris_lump]
after_loss = "Said to have been picked up by fishermen on the Somali coast at low tide. Karim knows that beach and says its fishermen don’t find a piece this size in a year. If someone else wins it, the clerk knows who; do them a service, then trade for it or borrow it for a perfumer to test."

[auctions.goa_leilao.lots.roc_feather]
after_loss = "Marco Polo writes that the Great Khan’s envoys brought back a roc’s feather ninety spans long from a great southern island. The seller points to this one: same island. João Fernandes measured it, called it a dozen spans at least, and raised with a grin. If someone else buys it, the clerk has the name; do them a service, then trade for it or borrow it to show around."
fake_note = "It’s a raffia leaf from Madagascar, and you can still see black lacquer brushed along the veins. The mat it came wrapped in is woven the Kilwa way—keep it; it will tell you which ship brought it."

[auctions.goa_leilao.lots.fallen_stone]
after_loss = "The seller says it fell in a Deccan rice field and the villagers worshipped it for years—there’s still turmeric in the cracks. A Jesuit from St. Paul’s College wants it to teach his students about the heavens; Vikram says it’s someone’s god and has no business on this table. If someone else wins it, the clerk knows them; do them a service, then trade for it or borrow it to have it looked at."

[auctions.goa_leilao.lots.mughal_miniature]
after_loss = "Every leaf on the plane tree in this picture is edged in gold, and Yasmin knows the manner—someone trained in the Tabriz workshop. Vikram has his eye on the horse; he says whoever drew those legs knows more than most horse dealers. If you lose, the clerk has the buyer’s name; do them a service, then borrow it to copy or trade for it."

[auctions.goa_leilao.bidders.vikram]
mood_lines = ["Judges a jewel like a horse: hands first, price last", "Haggles with the crier by finger-squeeze under a sleeve"]

[auctions.goa_leilao.bidders.yasmin]
mood_lines = ["Three rows back, she can name where the incense grew", "Sits up straight the moment a Persian manuscript appears"]

[auctions.goa_leilao.bidders.karim]
mood_lines = ["Finds out what the Portuguese want before deciding what he wants", "Fattest purse in the room, slowest hand"]

[auctions.goa_leilao.bidders.joao_fernandes]
mood_lines = ["Swears in Hokkien and raises again", "A flick of his new sleeve—another bid"]

