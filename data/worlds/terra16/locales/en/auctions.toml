# 拍卖显示覆盖：拍品按 item、出价人按 person、特别场按 item 对应，不能覆盖数字。

[auctions.venice_incanto]
name = "State-galley voyage leasing"
lore = "A Senate clerk reads out this year’s routes and sailing dates, and patricians in black gowns bid on each in turn; only when the cargo space is settled do the Murano glass and the booksellers’ Aldines come out. The floor is crowded with German factors from the Fondaco, Greek mercenaries, and agents sent to fight for one more berth."

[auctions.venice_incanto.lots.venice_voyage_concession]
after_loss = "The duties it saves are worth more than the reserve, and the Fondaco’s German factors fight over this berth every year. If the hammer falls for someone else, ask the clerk who won—winners are always short of men to escort cargo. Make one run for them, and the berth can be traded or lent."

[auctions.venice_incanto.lots.murano_mirror]
after_loss = "It shows every line on a face—Venetian ladies say it’s less forgiving than a confessor. Tommaso spent half the preview pulling faces in it. If you lose, the clerk will name the buyer; do that buyer a favor, and the mirror can be traded for or borrowed a few days."

[auctions.venice_incanto.lots.venice_glass_cup]
after_loss = "So thin it might be a single breath; pour wine in and you see the wine, not the glass. Tommaso bid “for a gentleman who prefers not to appear”—truth or a line from a play, no one could tell. The clerk will close his ledger and say, “The buyer’s name is here. Do him a service, sir, and the cup can be discussed.”"

[auctions.venice_incanto.lots.murano_beaker]
after_loss = "How the white threads get inside the glass, Murano’s glassmakers will take to their graves; merchants from the north want one so their own furnace men can puzzle over it. If the hammer isn’t yours, the clerk knows whose house it went to—run an errand for them, and there’s room to talk."

[auctions.venice_incanto.lots.murano_bottle]
after_loss = "The stopper fits so close, the perfumers say, that not even its owner’s secrets leak out. Several of the city’s famous courtesans sent someone to bid. If you lose, don’t fret—the clerk’s ledger has the buyer. Settle some small worry of theirs, and you can ask to trade or borrow."

[auctions.venice_incanto.lots.homer_iliad_aldine]
after_loss = "An Aldine pocket edition—slip it in a sleeve and read it at sea. Theodoros insists it’s his ancestors’ poetry and simply must bid; how much Homeric Greek he can actually read, nobody dares ask. If someone else buys it, the clerk has the name. Do them a service, and they may lend it till you finish, or swap it for another book."

[auctions.venice_incanto.lots.homer_odyssey_aldine]
after_loss = "The sailors’ favorite: ten years adrift, and he still finds his way home. Tommaso calls Odysseus the first great actor—dressed as a beggar, only his old dog knew him. If the hammer falls elsewhere, get the buyer’s address from the clerk, help them out once, then ask to borrow or trade."

[auctions.venice_incanto.lots.pacioli_venice]
after_loss = "The counting-house apprentice’s bible: line up debit against credit and you know who’s lying. Alvise lingered a long time over the bookkeeping part—not every account he keeps is in ducats. If someone else wins it, the clerk has the name; see one matter through for them, and the book can be borrowed or traded for."

[auctions.venice_incanto.lots.portuguese_astrolabe]
after_loss = "A Portuguese pilot ran up a tavern debt at the Rialto and paid it off with this. Pieter circled it all morning, wanting to copy the scale back to Antwerp. If you miss it, ask the clerk who bought it; do that person a favor, then borrow it for a few sightings, or trade for it outright."

[auctions.venice_incanto.lots.schiavona_master]
after_loss = "The Dalmatians of the Doge’s guard carry this broadsword; this one is a master’s work, its guard shaped for a hand that holds reins. Theodoros looks at it the way he looks at a good horse. If it lands with someone else, the clerk will tell you who; do them a favor, and the sword can be traded or lent for a while."

[auctions.venice_incanto.lots.lute]
after_loss = "Made in Venice by a German luthier from Füssen; his label is still glued inside the belly. One pluck and Tommaso couldn’t move from the spot—just what the troupe needs, he says. If you lose, the clerk can trace the buyer; get a job done for them, and the lute can be traded for or borrowed for a season."

[auctions.venice_incanto.lots.flemish_tapestry]
after_loss = "A Brussels stag hunt, hauled all the way over the Alps. Stewards from several Grand Canal palaces stood measuring their halls in their heads. If someone else takes it, the clerk knows whose wall it’s bound for; do that household a service, then talk exchange or loan."

[auctions.venice_incanto.lots.unicorn_horn]
after_loss = "They say it sweats near poison; the apothecaries would shave it to powder and sell it weight for weight against gold. Someone whispered that St. Mark’s treasury keeps one just like it. If it goes to another bidder, the clerk has the name; do them a favor, and the horn can be traded for, or borrowed to have it examined."
fake_note = "It’s the tusk of a northern whale; Icelandic fishermen trade them for nails and flour. The oilcloth it came in bears a Hanseatic merchant’s wax seal—keep it. That seal leads to whoever sold it south."

[auctions.venice_incanto.lots.xuande_censer]
after_loss = "A Ming bronze censer is a rare sight in Venice; this one changed hands all the way from Lisbon, and no one in the city can read every character on its base. A Fondaco factor says his masters in Augsburg asked for it by name. If someone else buys it, ask the clerk who; do them a service, then talk about trading for it or borrowing it to study."

[auctions.venice_incanto.lots.fallen_stone]
after_loss = "The seller swears it came down in the stone shower over Crema in 1511—scorched black on one face, like pig iron on the other. Several gentlemen who keep furnaces came to touch it, and one never left. If it goes elsewhere, the clerk has the buyer’s address; do them a service, and the stone can be traded for or borrowed to weigh."

[auctions.venice_incanto.lots.toledo_rapier_master]
after_loss = "Toledo steel, edged by a master’s own hand; bend the blade and it springs back true. Young nobles learning the Spanish style stood three deep around it at the preview. If you miss it, the clerk will give you the winner’s name; do them a favor, and the sword can be traded or lent for a few bouts at the fencing hall."

[auctions.venice_incanto.bidders.tommaso]
mood_lines = ["Pleads poverty, raises first", "Glances at Alvise before every raise"]

[auctions.venice_incanto.bidders.theodoros]
mood_lines = ["Recites his lineage before each raise", "Shakes out his old cloak and lets others go first"]

[auctions.venice_incanto.bidders.alvise]
mood_lines = ["Watching the bidders, not the lots", "Writes a name on the back of his catalog"]

[auctions.venice_incanto.bidders.pieter]
mood_lines = ["Still sketching a scale on his cuff, bid forgotten", "Long past his travel money, hand still up"]

[auctions.venice_incanto.specials.legend_ship_plan]
story_hook = "The handover sheet the old Ribeira shipwright left behind says it plainly: the Jackdaw’s refit plans were carried off to Venice. And at the back of this year’s sale catalog, sure enough, sits an unsigned roll of ship drawings."
after_loss = "Men from the Arsenal and Alvise both went over that roll twice at the preview. If the hammer falls elsewhere, get the buyer’s address from the clerk; do what they ask of you, and the original can be traded back—or, if they won’t part with it, get their leave for your shipwright to copy it."

[auctions.istanbul_bedesten]
name = "Bedesten auction"
lore = "The bedesten’s iron doors open only a few hours a day. Brokers carry each lot up and down beneath the domes, crying the last bid as they go; an old merchant behind his counter lifts one finger, and that’s a raise. Palace buyers, the bailo’s secretary, and shipwrights from the Arsenal all squeeze into the same aisle."

[auctions.istanbul_bedesten.lots.ottoman_yatagan]
after_loss = "A double-curved short blade; the brass at the scabbard mouth is engraved with its owner’s name—a Janissary veteran who never came back from Hungary. His old comrades pooled their money to buy it back. If someone else wins, the broker remembers whose hands it went into; do that person a service, and the blade can be traded or lent for a while."

[auctions.istanbul_bedesten.lots.damascus_sabre_master]
after_loss = "The pattern in the steel runs like water and grows clearer the more it’s polished; a line of verse is chased along the spine. A palace buyer claims some pasha asked for it by name, and he raises without blinking. If it goes to another, the broker knows which house took it; get something done for that household, and you can ask to trade or borrow."

[auctions.istanbul_bedesten.lots.persian_carpet]
after_loss = "Woven in Tabriz and carried here after a war or two; the broker skates right past how. Yasmin crouched to look at the knots on the back and said nothing at all. If someone else buys it, ask the broker who; help them once, then see about a trade or a loan."

[auctions.istanbul_bedesten.lots.iznik_tile]
after_loss = "Palace building works take most of what the Iznik kilns can fire, so a loose tile is hard to come by. One of Sinan’s foremen came to look and gauged the glaze with his thumbnail. If it goes to another house, the broker knows where; do the buyer a favor, then talk trade or loan."

[auctions.istanbul_bedesten.lots.kamal_board]
after_loss = "Taken off a captured Indian Ocean ship; the knots on its cord are star heights kept by one family of pilots for generations. Hasan says anyone who can read those knots is worth more than the board. If someone else buys it, the broker knows them; do them a small favor, and they’ll lend it or trade it."

[auctions.istanbul_bedesten.lots.quadrant_master]
after_loss = "Seized from a captured Spanish galley; a master cut its scale degree by degree, and the plumb line still wears its old owner’s red thread. Hasan says the Arsenal’s pilots could use it and means to follow every raise. If it goes elsewhere, the broker knows who took it; get something done for them, and you can borrow it for a few sightings or trade for it."

[auctions.istanbul_bedesten.lots.oud]
after_loss = "Left by an old musician of the Galata lodge; his fingernails wore a shallow groove into the soundboard. Süleyman Çelebi says it deserves the poems he’s just written. If someone else wins it, the broker knows whose house it’s in; do the owner a favor, and borrowing or trading for it is easy enough."

[auctions.istanbul_bedesten.lots.hafiz_ms]
after_loss = "Persians tell fortunes with Hafiz: hold a question in your heart, open the book at random, and the verse you land on is your answer. Süleyman Çelebi tried it once, went pale, and has sat in the front row ever since. If you lose, the broker remembers the buyer; do them a service, then borrow it to copy a few ghazals, or trade for the whole book."

[auctions.istanbul_bedesten.lots.shahnameh_tahmasp]
after_loss = "Shah Tahmasp’s painters labored on this great volume for over a decade; word is it slipped out of the Tabriz palace in wartime. Yasmin turned the leaves and stopped at one: she knows whose hand painted that horse. If someone else takes it, the broker knows where it went; do the owner a real service before you ask to see it, or bring something weighty to trade."

[auctions.istanbul_bedesten.lots.piri_ms]
after_loss = "Anchorages, fresh water, and hidden reefs crowd the margins of every harbor plan—a copy of the version Piri Reis presented to the Sultan. Hasan wants it kept at the Arsenal; Alvise wants it sent home to Venice. At the preview they eyed each other across the table, very politely. If you lose, the broker knows the buyer; help them once, then borrow it to check a few harbor plans, or trade for it."

[auctions.istanbul_bedesten.lots.talisman_shirt]
after_loss = "Verses and number squares cover it from collar to hem, without a single correction. Officers about to march with the army came asking the price; Süleyman Çelebi leaned in to study the hand and could name the palace calligrapher who wrote it. If it goes to someone else, the broker remembers who; do that person a good turn, and you can borrow it for a closer look or trade for it."

[auctions.istanbul_bedesten.lots.silver_cross]
after_loss = "A little cross by a Seville silversmith, taken from a captured Spanish sailor. A Franciscan friar from Galata scraped money together to buy it back and keep it for the sailor’s mother. If someone else wins it, the broker knows them; do them a favor, then talk about trading for it or borrowing it."

[auctions.istanbul_bedesten.lots.ambergris_lump]
after_loss = "The harem’s perfumery sent someone; their incense is short of exactly this. Yasmin touched it with a heated needle, breathed it in for a long time, and said nothing. If someone else buys it, the broker remembers who; get a thing done for the owner, and you can trade for it or borrow it to show a perfumer."

[auctions.istanbul_bedesten.lots.roc_feather]
after_loss = "The seller says it came from the Isle of the Moon, far to the south—the very sort of feather shed by the roc that carries off elephants in Sindbad’s tales. A storyteller wants to borrow it to hold up when he reaches the roc. If it ends up with someone else, the broker knows where; help the owner once, and trading or borrowing is easy to arrange."
fake_note = "It’s a young raffia-palm frond, dried, oiled, split into strands, and glued back together to pass for a feather. The rush mat it came bound in is Mocha weaving—keep it; that mat will lead you to the seller."

[auctions.istanbul_bedesten.lots.dee_obsidian_mirror]
after_loss = "A Mexica obsidian mirror—how it drifted to Istanbul no one can say, and the seller swears it sat in Dr. Dee’s study in England. A student of the court astrologer stared into it for ages and said the smoke inside was moving. If someone else buys it, the broker knows them; do them a service, then talk trade or loan."

[auctions.istanbul_bedesten.lots.rose_water]
after_loss = "Kashan rose water, a case of twelve flasks with every wax seal intact. Families with weddings coming up bid hardest—the more you sprinkle at the feast, the better your house looks. If someone else buys it, the broker remembers who; help that household with something, and getting a few flasks in trade isn’t hard."

[auctions.istanbul_bedesten.bidders.hasan]
mood_lines = ["Sizing up the lot like a keel timber", "Bidding Arsenal money, noting every raise"]

[auctions.istanbul_bedesten.bidders.alvise]
mood_lines = ["Asks the reserve in Venetian-accented Turkish", "His hand stalls midair whenever Hasan bids"]

[auctions.istanbul_bedesten.bidders.suleyman_celebi]
mood_lines = ["Murmuring a couplet from the manuscript, deaf to the crier", "Points out a copyist’s slip aloud, then quietly raises"]

[auctions.istanbul_bedesten.bidders.yasmin]
mood_lines = ["Studying one tiny painted figure as if she knew them", "Hears “from Shiraz” and pushes the price up"]

[auctions.istanbul_bedesten.specials.emerald_auction_page]
story_hook = "A copyist who works for the Hermetic circle tells you quietly that an old manuscript leaf, its margins crowded with lines from the Emerald Tablet, will change hands at the bedesten this season. He knows the hand in those notes—another copyist’s."
after_loss = "Süleyman Çelebi and Yasmin both had their eyes on that leaf, though not on the same part: he on the script, she on the margins. If the hammer falls elsewhere, press the broker for the buyer’s address; do what the buyer asks, and the leaf itself can be traded for—or ask for a copy and their word that you may keep digging."

[auctions.antwerp_vrijdagmarkt]
name = "Friday Market public auction"
lore = "The secondhand market for old clothes and furniture moved onto this little square in 1549. When a household’s estate is wound up, the books, clocks, and astrolabes go on the block alongside the bed curtains. Merchants come for bargains, cabinet collectors come for marvels, and each crowd thinks the other mad; the appraiser walks between them, finding fault with everything."

[auctions.antwerp_vrijdagmarkt.lots.nuremberg_watch]
after_loss = "A Nuremberg clock that ticks on your chest; nobody minds if it loses a quarter hour a day—wear it into the Bourse and heads turn. A few newly rich spice traders are fighting over it. If someone else gets it, ask the auctioneer for the name; run an errand for them, then borrow it to look at the works, or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.portuguese_astrolabe_master]
after_loss = "A Lisbon master’s astrolabe, cleared out of the house of a Portuguese factor who died in Antwerp. Aisling says her ship badly needs a good one; Pieter only wants to copy its scale into his drawings. They quarreled over it at the preview. If it goes elsewhere, the auctioneer knows to whom; get something done for that buyer, and a trade or loan can be discussed."

[auctions.antwerp_vrijdagmarkt.lots.behaim_globe]
after_loss = "Copied from the old Nuremberg globe: no New World on the ocean yet, and Japan sits a short sail west of Europe. Pieter says seeing how sure people once were teaches more than ten new maps. If someone else buys it, the auctioneer has the name; do them a service, then borrow it for a few days or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.pacioli_venice]
after_loss = "The margins of this copy are full of its late owner’s notes—a bankrupt merchant recording, entry by entry, how his books went wrong. The young factors from the Bourse want it badly; they say the notes are worth more than the text. If someone else takes it, the auctioneer knows them; do them a favor, then borrow it to finish the notes, or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.medina_valladolid]
after_loss = "Everyone sitting the pilot’s exam in Seville has to grind through this one, and this copy has a sheet tucked inside where its last owner wrote down the examiners’ favorite questions. Aisling found the sheet and laughed out loud. If you lose, ask the auctioneer who won; get something done for them, and they may lend you the book and the sheet to copy, or trade them."

[auctions.antwerp_vrijdagmarkt.lots.durer_rhinoceros]
after_loss = "Dürer’s armor-plated rhinoceros, the beast all of Europe now believes in. Yasmin studied it a long while and said it was beautifully cut—by someone who had clearly never seen a rhinoceros. If someone else takes it, the auctioneer knows where it went; do the buyer a service, then borrow it for your wall a while, or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.moneychanger_copy]
after_loss = "Every moneychanger in town wants one behind his counter, like a patron saint of the trade. The scales in it are painted so exactly that someone has actually checked them against real weights. If someone else buys it, the auctioneer knows them; help them once, then borrow it to copy or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.flemish_tapestry]
after_loss = "Antwerp has no shortage of tapestries, but one of the hunters in this one wears the old master weaver’s own face, and everyone in the trade spotted it at once. A Spanish grandee’s agent has sent someone too. If it goes elsewhere, the auctioneer knows where; do the buyer a service, and you can ask to borrow or trade."

[auctions.antwerp_vrijdagmarkt.lots.balance_weights]
after_loss = "An old silversmith’s estate; every weight carries the city assay master’s stamp, not one missing. Small traders want it to catch customers who cheat at the scales—and a few want it to cheat with. If someone else wins, ask the auctioneer who; do them a favor, then trade for it or borrow it a few days."

[auctions.antwerp_vrijdagmarkt.lots.chart_case_master]
after_loss = "A master’s chart case: waxed hide over oak boards, and it floats if it goes overboard. Aisling says her charts have been soaked in seawater three times, and she means to have this one. If you lose, the auctioneer has the buyer’s name; get something done for them, then talk exchange or loan."

[auctions.antwerp_vrijdagmarkt.lots.german_greatsword]
after_loss = "A two-hander for clearing the front of a pike block; the men who carried it drew double pay. Kaspar hefted it and said that when he was young, standing behind blades like this, he was never afraid—then said nothing more. If it goes elsewhere, get the buyer’s name from the auctioneer; do them a favor, and the sword can be traded or lent for some practice."

[auctions.antwerp_vrijdagmarkt.lots.herbal_draught]
after_loss = "A gourd of herbal draught from a Portuguese ship’s surgeon’s estate; the recipe label is in Chinese characters no one here can read. The town apothecaries are bidding so they can taste out what’s in it. If someone else buys it, the auctioneer knows them; do them a small favor, and they’ll spare you a swallow or trade it for something."

[auctions.antwerp_vrijdagmarkt.lots.unicorn_horn]
after_loss = "One cabinet collector says he has everything but a unicorn horn, and without it the whole cabinet looks shabby. The appraiser glanced at it and kept his opinion to himself. If someone else buys it, the auctioneer knows who; do the buyer a service, then talk about trading for it or borrowing it for a closer look."
fake_note = "It’s ivory turned on a lathe; you can still feel the tool marks in the grooves, and the joins are smoothed over with white wax. The canvas wrap carries a forwarding agent’s bale mark—keep it; that mark will run the dealer down."

[auctions.antwerp_vrijdagmarkt.lots.fallen_stone]
after_loss = "The seller says it was chipped off the thunderstone that hangs in the church at Ensisheim—heaven knows how many pieces have been knocked off it these past decades. A clerk at the auction house borrowed a balance and weighed it twice; the two weighings differed by a hair. If it goes to someone else, the auctioneer knows where; do the buyer a service, then trade for it or borrow it for another weighing."

[auctions.antwerp_vrijdagmarkt.lots.corvo_fragment]
after_loss = "Supposedly knocked off the stone horseman on Corvo, the one pointing west. Aisling’s first question was, “Pointing where, exactly?” Pieter was already working out how to draw that stretch of sea. If someone else takes it, the auctioneer knows them; do them a service, then borrow it to study or trade for it."

[auctions.antwerp_vrijdagmarkt.lots.ancient_coin]
after_loss = "A Roman silver coin, half its legend worn away—just enough left to guess the emperor. Pieter says Master Ortelius collects old coins and would talk of nothing else for days. If it ends up with someone else, the auctioneer knows who; do the owner a favor, then borrow it to take a rubbing, or trade for it."

[auctions.antwerp_vrijdagmarkt.bidders.pieter]
mood_lines = ["Checks a note in Ortelius’s hand, then raises again", "Lost in a chart, misses his turn to bid"]

[auctions.antwerp_vrijdagmarkt.bidders.aisling]
mood_lines = ["One look from her, and a rival pulls his hand back", "Outbids Pieter out of sheer contrariness"]

[auctions.antwerp_vrijdagmarkt.bidders.kaspar]
mood_lines = ["Arms folded; looks up only when steel comes out", "Bids like loading powder: one measure, never more"]

[auctions.antwerp_vrijdagmarkt.bidders.yasmin]
mood_lines = ["Asks who painted it before she’ll bid", "Purse sewn into her sleeve; she turns away to reach it"]

[auctions.seville_almoneda]
name = "West Indies estate auction"
lore = "The House of Trade’s clerk first reads out each dead man’s name, birthplace, and will, then cries his effects, shipped home from the Indies, one by one. The money goes to his family, so there are always a woman or two in black in the front row, watching every bid. With the fleet just in, the courtyard is packed with company agents, pilots, and men asking after gold."

[auctions.seville_almoneda.lots.gold_llama]
after_loss = "Most Peruvian gold goes into the melting pot the day it lands; this llama standing whole on the table is a lucky survivor. Konrad is pricing its weight; Ana de la Cruz is studying the smith’s hand. If someone else wins it, the clerk has the name; do them a service, then talk about trading for it or borrowing it to study."

[auctions.seville_almoneda.lots.chimu_gold_cup]
after_loss = "A gold cup thin enough to let light through, ringed with seabirds beaten into the metal. A cathedral priest wants it to remake into a chalice, while Konrad says that at the price of gold, the reserve is already cheap. If you lose, the clerk has the buyer’s address; do them a favor, and the cup can be traded or lent for a look."

[auctions.seville_almoneda.lots.gold_fish]
after_loss = "The dead man’s will leaves the little gold fish to his daughter in Castile. The clerk paused there—the daughter died two years ago. Ana couldn’t take her eyes off the tiny ring in its mouth. If someone else buys it, ask the clerk who; do them a service, then talk trade or loan."

[auctions.seville_almoneda.lots.gold_bird]
after_loss = "Wings so thin a breath sets them trembling, and not one bent on the crossing. Ana de la Cruz says goldsmiths of her grandmother’s generation made birds like this, and hardly anyone can now. If it goes elsewhere, the clerk knows the buyer; get something done for them, then borrow it for a closer look, or trade for it."

[auctions.seville_almoneda.lots.ivory_saltcellar]
after_loss = "A Portuguese man in a hat stands on the lid, his nose carved sharper than life, and the room laughed for a good while. A duke’s steward wants it for his master’s table. If someone else buys it, the clerk has the name; see a matter through for them, then talk exchange or loan."

[auctions.seville_almoneda.lots.cacao_gift]
after_loss = "A packet of cacao the dead man wrapped himself, brewing instructions on the paper—meant, it seems, as a gift for home, and never given. Ana de la Cruz sniffed it and said the chili was just right, like home. If someone else buys it, the clerk knows them; help them once, then trade for it or ask them to spare you a cup."

[auctions.seville_almoneda.lots.chart_caribbean]
after_loss = "The dead man piloted the Caribbean for twenty years, and in several places this chart disagrees with the House of Trade’s master chart—which is exactly why pilots want it. Tomás de Mendoza spent a whole afternoon of the preview checking it against his own notebook. If you lose, the clerk has the buyer’s name; get something done for them, then borrow it to compare or trade for it."

[auctions.seville_almoneda.lots.chart_mexico_gulf]
after_loss = "It marks where a ship can still shelter when the winter northers blow, every spot learned at the cost of a ship. Konrad wants to buy it and lock it in a chest: one less anchorage the other houses know means one day sooner for his cargo. If someone else wins it, get the buyer’s address from the clerk; do them a favor, then talk loan or trade."

[auctions.seville_almoneda.lots.chart_peru]
after_loss = "From Panama to Lima it’s wind and current against you all the way, yet this chart shows a shortcut hugging the coast, supposedly traded from the raft pilots. Tomás de Mendoza stared at that line a long time and said he’d believe it when he’d sailed it. If someone else buys it, the clerk has the name; do them a service, then ask to borrow it to copy, or trade for it."

[auctions.seville_almoneda.lots.cortes_seville]
after_loss = "A report to the Emperor, with the city, the lake, and the causeways vivid on the page. The Crown stopped its printing years ago, so old copies grow dearer every year. Ana de la Cruz reached the pages on Tenochtitlan, closed the book, and bid again. If you lose, the clerk has the buyer’s name; do them a service, and they may lend it till you finish, or trade it."

[auctions.seville_almoneda.lots.atlatl]
after_loss = "A Mexica warrior’s spear-thrower, a gaping serpent carved along the shaft. Kaspar tried a couple of throws at the air and said it loads faster than an arquebus—it just won’t get through a breastplate. If someone else wins it, the clerk knows them; get something done for them, then borrow it for practice or trade for it."

[auctions.seville_almoneda.lots.parrying_dagger_master]
after_loss = "A left-hand parrying dagger with two blade-catching slots in the guard—a master’s work. Seville’s fencing masters say good rapiers are everywhere in this town, but a left hand worthy of one is hard to find. Kaspar turned it over and over, studying those slots, and said nothing. If it goes elsewhere, the clerk knows who; do the buyer a service, and borrowing or trading is easy to discuss."

[auctions.seville_almoneda.lots.roc_feather]
after_loss = "In his will, the dead man calls it “the most valuable thing I own,” bought from a Portuguese sailor back from the East. Ana de la Cruz rubbed the quill between her fingers, her mouth twitched, and she didn’t bid. If someone else buys it, the clerk has the name; help them once, then talk about trading for it or borrowing it."
fake_note = "The quill is a whittled leaf stalk and the vanes are strips of palm leaf stuck back with fish glue; soak it and it falls apart. The estate inventory records that he bought it in Cape Verde, and from whom—start there."

[auctions.seville_almoneda.lots.unicorn_horn]
after_loss = "The dead man took it to the Indies against poison and stirred his wine with it before every meal—in the end he died of a fever. Two of the city’s apothecaries got into a row over it in the front row. If it goes to someone else, ask the clerk who; do them a service, then trade for it or borrow it to have it examined."
fake_note = "Three lengths of ivory pieced together, the seams filled with beeswax and chalk; dip it in warm water and the joins show. The estate inventory says whom he bought it from in Cartagena, and for how much—start with that man."

[auctions.seville_almoneda.lots.corvo_fragment]
after_loss = "Every pilot who works the Azores has heard of the stone horseman on Corvo pointing west—and when it was raised, who knew what lay west? Konrad’s eyes lit up at that; he asked whether it points to gold. If someone else wins it, the clerk knows them; do them a service, then borrow it for a good look or trade for it."

[auctions.seville_almoneda.lots.leonardo_note]
after_loss = "The dead man soldiered in Milan as a youth; this mirror-written page rode in his prayer book to the New World and came back with his effects. An Italian sculptor in the King’s service sent a man to bid, and Ana de la Cruz spent ages reading it in a mirror. If someone else wins it, the clerk has the address; do them a service, then talk loan or trade."

[auctions.seville_almoneda.bidders.konrad]
mood_lines = ["Hasn’t lowered his hand since the gold came out", "“You do take Augsburg bills?”"]

[auctions.seville_almoneda.bidders.ana_cruz]
