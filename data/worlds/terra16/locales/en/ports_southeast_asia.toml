# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.pegu]
name = "Pegu"
lore = "The Toungoo king’s capital lies far up the river, a full day’s run on the tide from the estuary mouth. The gilded top of the Shwemawdaw pagoda shows from a long way off, and they say sailors look at it first and their own cargo second."
river = "Bago"

[ports.ayutthaya_port]
name = "Ayutthaya"
lore = "Ayutthaya sits on an island in the Chao Phraya, and the riverbanks outside hold Portuguese, Chinese, Persians and Malays, each in a street of their own. Seagoing ships draw too much water and must shift to small boats downstream to be rowed up."
river = "Chao Phraya"

[ports.pattani]
name = "Patani"
lore = "Every few years the Sultan of Patani sends Siam a pair of gold and silver flowers, perfectly courteous, and remains master in his own house. Chinese, Malay and Siamese merchants each hold a stretch of the shore."
river = "Pattani"

[ports.malacca]
name = "Malacca"
lore = "The Portuguese fortress was raised on the site of the old sultan’s palace, its stone walls pressing on the river mouth. The trade of the strait still depends on Gujaratis, Javanese, Chinese and every sort of shipowner, hauled in boat by boat."

[ports.johor_port]
name = "Johor Lama"
lore = "The court on the Johor River is the heir of the old sultans of Melaka, its royal town built on piles along the bank. Sea-people steer small boats to patrol for the court, and the routes Melaka failed to hold they take up one by one."
river = "Johor"

[ports.aceh_port]
name = "Aceh"
lore = "The Sultan of Aceh ships pepper straight to the Red Sea, bypassing the Portuguese toll post at Melaka. Ships for Jeddah line up in the harbor, and every master keeps an eye on the sea for Portuguese galleys."

[ports.banten_port]
name = "Banten"
lore = "A rising Muslim port at the western tip of Java, with the sultan’s palace gate opening on the quay. All day long people weigh pepper in the square, and nearly every ship from the strait loads a hold here."

[ports.jepara]
name = "Jepara"
lore = "The queen of Jepara has teak ships built one after another, bound for the Straits and the Spice Islands; the wind blows sawdust from the yards all over the streets."

[ports.gresik]
name = "Gresik"
lore = "Sacks of rice are stacked on the quay waiting to go to the Spice Islands in exchange for cloves. The religious lord of Giri is close by, with students from all over the islands, and ships often carry scholars going home."

[ports.makassar]
name = "Makassar"
lore = "Along the Gowa king’s waterfront the market has no empty stall from dawn to dusk, and rice, sandalwood and cloves are haggled over in the same street. Malay merchants who fled after the fall of Melaka have settled here, and their counting-houses and prayer places went up quickly."

[ports.brunei_port]
name = "Brunei"
lore = "Brunei’s royal city is built on the river, its houses on stilts and its streets waterways. Camphor and aloeswood from the forest are paddled all the way to the palace steps in small boats."
river = "Brunei"

[ports.tondo]
name = "Tondo"
lore = "At Tondo on the north bank of the Pasig mouth, the rajah’s village is stacked with porcelain bowls and iron pots left by Chinese merchants, who take away gold and wax."
river = "Pasig"

[ports.cebu]
name = "Cebu"
lore = "The old port of the Rajah of Cebu. Magellan raised a cross here and died on the island of Mactan across the water; now Legazpi’s men have landed and built a three-cornered wooden fort on the beach."

[ports.manila]
name = "Manila"
lore = "The Spaniards have driven out Rajah Sulayman and are building a new city over his old stockade on the south bank of the Pasig, the old palisade’s stumps still buried under the foundations. Chinese junks are already running down here on the north wind."

[ports.ternate_port]
name = "Ternate"
lore = "Clove trees climb the volcano slope row on row. The sultan’s merchants measure by the basket, and what is sold to whom is the sultan’s word; the Portuguese fort is only one of several powers on the island."

[ports.tidore_port]
name = "Tidore"
lore = "Tidore and Ternate face each other across a narrow strait, two volcanoes watching one another and two sultans watching one another. Whoever’s clove ship reaches harbor first, the visiting Europeans salute first."

[ports.ambon]
name = "Ambon"
lore = "The villages around Ambon Bay have long dealt in cloves, with boats coming and going and everyone haggling. Only after the Portuguese were driven from Ternate did they build a new stone fort here."

[ports.banda_neira]
name = "Banda Neira"
lore = "There is no king on the Banda islands; the nutmeg trade is settled by a council of elders. A ship that wants a cargo must first come ashore and sit before the elders, bargaining with one house after another."

[ports.lifau]
name = "Lifau"
lore = "Timor’s lords have sandalwood split into lengths, dried, and carried to the shore to wait for ships. When a vessel leaves harbor the whole deck smells sweet, and sailors say it is the smell of burning silver."

[ports.hoi_an]
name = "Hoi An"
lore = "The town at the mouth of the Thu Bồn, the southern edge of the Lê realm, with old Cham country farther south. Chinese and other seafaring merchants’ ships pass up and down the river, and the inns lodge people speaking several languages at once."
river = "Thu Bon"

