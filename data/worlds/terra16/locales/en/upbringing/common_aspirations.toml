# A6：显示覆盖，仅含文字。

[notes."note_1c996ef9e5fa72f8"]
"text" = "Aspirations from fourteen"

[notes."note_24d4fbd218013a6b"]
"text" = "From fourteen, your family will talk with you about three paths in plain view; one more stays hidden until you have lived enough to find it. You can finish school without choosing. How much money you carry to sea depends on how your family has fared over the years. Changing your mind costs nothing: every road you have walked stays with you."
