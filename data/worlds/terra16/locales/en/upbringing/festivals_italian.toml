# A6：显示覆盖，仅含文字。

[festivals."festival_it_carnival"]
"name" = "Venetian carnival"
"customs" = "At the Venetian carnival masked figures pass one another along the canal, knowing a voice before a face. On a small campo by the water a wooden stage goes up for a farce, and the clown in the hooked-nose leather mask has the crowd tossing fruit stones into the canal."
"gift_custom" = "A small mask, or a slip of paper painted with half a face and the other half left for the receiver to finish."
"date_note" = "It moves with Easter each year. The wildest night is Fat Tuesday, before Lent: from tomorrow no meat, so tonight the table must be cleared."

[festivals."festival_it_ascension"]
"name" = "Ascension and the marriage to the sea"
"customs" = "The Doge’s gilded state barge goes out through the mouth of the lagoon, and he drops a ring into the water: “We wed thee, sea.” On the shore apprentices crowd around model boats, and whoever can name every stay and halyard first wins a bag of almond sweets."
"gift_custom" = "A little boat you carved yourself, a red thread wound around its mast."
"date_note" = "On the fortieth day counting Easter as the first, always a Thursday, so it moves with Easter. The sea-wedding is held on this day, and the barge waits for fair weather before leaving the lagoon."

[festivals."festival_it_john"]
"name" = "Florentine Saint John’s feast"
"customs" = "On the patron’s feast the shop shutters are left half down and business can wait. By day the young men play ball in the piazza, giving no ground, barefoot when a shoe goes flying; after dark fireworks rise over the river and the whole embankment stands gaping at the sky."
"gift_custom" = "An almond biscuit, and a flask of cold water kept back for a teammate who has been running."
"date_note" = "In Florence’s own almanac it is 24 June, the feast of Saint John the Baptist, patron of the city, and every guild marches. On the calendar here it is ten days later, 4 July."

[festivals."festival_it_palio_july"]
"name" = "Sienese summer horse race"
"customs" = "The children ride wooden horses and charge with long poles at iron rings hung from a cord; whoever spears one is carried around the alley on friends’ shoulders. The real riders have their own ground: the piazza is strewn with yellow earth, and when the horses pass the dust rises over everyone’s heads."
"gift_custom" = "A small embroidered pennant in your district’s colors for a teammate."
"date_note" = "The district elders settle the day among themselves, always at the height of summer; once the drummers take to the streets the whole city knows the race is near."

[festivals."festival_it_palio_august"]
"name" = "Sienese August horse race"
"customs" = "Every district comes with its own flag and colors, and the boys shout themselves hoarse; yet when a rider leans hard around a corner against the wall, even the children from the rival district cannot help cheering."
"gift_custom" = "A narrow ribbon in your team’s colors, swapped for the other side’s and pinned to a sleeve."
"date_note" = "The race is run the day after the Assumption, the horses pouring in at the city gate and straight through the streets to the cathedral door."

[festivals."festival_it_christmas"]
"name" = "Italian Christmas"
"customs" = "On Christmas Eve the workshops close before dark and the master rakes the last coal in the forge into a glow. The apprentice from another town is kept for supper, and a lamp is lit in the window so, they say, the family far away can see it."
"gift_custom" = "A slab of hard honey cake studded with candied fruit and nuts, with a good wish copied onto a slip of paper."
"date_note" = "The Italians’ almanac still counts this as 25 December of last year; here the new year has already begun."
