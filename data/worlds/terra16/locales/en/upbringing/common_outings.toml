[nodes."map_japanese_home:outing_japanese_home_herbs"]
"name" = "Pines by the tide line"
"hint" = "Where the tide has drawn back, a clump of what looks like beach silvertop has come up among the pine roots. But it has chosen the damp shade, its leaves are pale underneath, and a snapped stem gives off a sharp, wrong smell. Leave it in the ground for now."

[nodes."map_japanese_home:outing_japanese_home_cave"]
"name" = "Low-tide cave"
"hint" = "The cave mouth shows only at the lowest tides, and the water line on its walls is higher than your head. Inside it is black, full of dripping, and now and then something like a voice murmuring. A cool draft blows outward. There must be another opening."

[nodes."map_japanese_home:outing_japanese_home_relic"]
"name" = "The old beacon"
"hint" = "No one has lit the beacon on the headland in years. Half a line is cut into its base; you can make out “fire” and “eighth month.” The village says this is where smoke went up when pirate ships were sighted, but the carving doesn’t read like a warning."

[nodes."map_japanese_home:outing_japanese_home_market"]
"name" = "Night stalls at the ferry"
"hint" = "The ferry landing comes alive after dark. A stranger at one stall is selling a block of “aloeswood from the southern seas”—one shaving, he says, will scent a whole room. The old ferryman glances over and mutters that he saw real aloeswood once, on a temple altar, and it didn’t look like that."

[nodes."map_japanese_home:outing_japanese_home_shore"]
"name" = "Boat-mending beach"
"hint" = "Fishing boats lie belly-up on the sand while a boatwright packs their seams with cypress bark. Out in the shallows a skiff’s mooring line is worn down to a few strands, and the children are shouting about which knot to tie. When the tide comes in, the skiff will go with it."

[nodes."map_japanese_home:outing_japanese_home_path"]
"name" = "Path to the mountain temple"
"hint" = "Halfway up the temple path stands a stone Jizō, and a man squatting beside it says the temple has a new rule: everyone who passes pays incense money. There are travelers ahead and behind, and nobody wants to take him on alone."

[nodes."map_japanese_academy:outing_japanese_academy_herbs"]
"name" = "Herb beds behind the temple"
"hint" = "Behind the temple there is a bed of angelica, but in the ditch beside it grows one plant with finer leaves. The old monk who tends the garden is hard of hearing; when you ask, he just waves a hand: “Same family, same family.” Don’t touch that one yet."

[nodes."map_japanese_academy:outing_japanese_academy_cave"]
"name" = "Hillside cave"
"hint" = "In the hillside outside the city is a shallow cave where, they say, a mountain ascetic once shut himself away. After the rainy season water pools on the floor and the stain on the walls stands higher than a person. A few steps in, it is pitch black but for the dripping."

[nodes."map_japanese_academy:outing_japanese_academy_relic"]
"name" = "Steps of a ruined garden"
"hint" = "All that’s left of a mansion burned in the Ōnin war are the garden steps and a leaning standing stone. Half a waka is carved into it; moss has eaten the rest. The neighbors say a young lady cut it there before she fled the fires."

[nodes."map_japanese_academy:outing_japanese_academy_market"]
"name" = "Book stalls at dusk"
"hint" = "At dusk the book stalls around Shijō light their lamps. One seller holds up a “Song edition, brought across the sea,” at a frightening price. The sutra copyist at the next stall glances at the red seal on the first leaf, says nothing, and starts paging through his own ledger."

[nodes."map_japanese_academy:outing_japanese_academy_shore"]
"name" = "Kamo River shallows"
"hint" = "A summer flood took the wooden bridge, so a rope has been strung across the Kamo shallows and the ferry hauls itself along it. Where the rope rubs a sharp rock it has frayed badly. The ferryman says it’ll hold a few more days. The boys catching sweetfish along the bank don’t think so."

[nodes."map_japanese_academy:outing_japanese_academy_path"]
"name" = "Kitayama pilgrim road"
"hint" = "On the Kitayama pilgrim road, someone has laid a bamboo pole across the way and calls it a new toll barrier set by the temple: ten coins to pass. But the old woman selling penny-a-cup tea at the foot of the road has never mentioned any barrier. There are other pilgrims about; don’t take him on by yourself."

[nodes."map_northern_home:outing_northern_home_herbs"]
"name" = "Willow embankment"
"hint" = "The willows on the embankment are cut back every year, and at their feet spreads a drift of white flower heads. The neighbor woman calls it elder and says no cough syrup is complete without it. But this clump comes only to your waist, and a crushed leaf gives off a smell like a goat pen. Leave it be for now."

[nodes."map_northern_home:outing_northern_home_cave"]
"name" = "Old brick kiln"
"hint" = "The brick kiln on the river flats has stood idle for years, its arched tunnel half drowned in rainwater, the water line on its walls higher than a child’s head. When the wind crosses it, the kiln hums, like someone talking into an empty jar."

[nodes."map_northern_home:outing_northern_home_relic"]
"name" = "Disused sluice"
"hint" = "The sluice was given up long ago; the water runs through a newer cut beside it. Moss has eaten most of the line carved into the stone lintel, leaving only “…west wind rises…” The village says it is a curse from the men who drowned building the sluice: go near the gate on a west-wind day and your house will suffer."

[nodes."map_northern_home:outing_northern_home_market"]
"name" = "Riverside dusk market"
"hint" = "At dusk the riverbank lights its lanterns, and herring sellers, linen sellers, and beer sellers shout over one another. One stall hangs a necklace of amber beads, fished out of the Baltic after a storm, the seller swears, at a price that makes you flinch. The scrivener at the next table, who writes letters for hire, glances over and opens his ledger."

[nodes."map_northern_home:outing_northern_home_shore"]
"name" = "Towboat inlet"
"hint" = "The river has only just thawed, and floes still drift down in ones and twos. On the dike the towing horses blow and rest, and in the inlet a little flat-bottomed boat’s mooring line is chafed to a skin where it passes the stake. The children ashore argue, red in the face, over which knot to tie. When the next big floe arrives, the boat will be gone."

[nodes."map_northern_home:outing_northern_home_path"]
"name" = "Bell-tower slope"
"hint" = "The village’s bell tower stands on a mound, and the shortcut home runs up its back slope. Today a stranger sits at the foot of it, saying the church has set a new “bell-ringing fee”: two small coins a head to go up. Nobody has ever paid anything on this path, but people coming home from market are strung out ahead and behind, and none of them wants to be the first to argue."

[nodes."map_northern_academy:outing_northern_academy_herbs"]
"name" = "Linden grove"
"hint" = "Spring has come, and the school cook sends the apprentices into the linden grove to cut wild garlic for the first green soup. A carpet of leaves lies under the trees, but one patch has broad leaves that rise in pairs from the root, clasping the stem, with a string of tiny white bells beside them. The cook plants her fists on her hips: “Cut the wrong one and it’s on you.”"

[nodes."map_northern_academy:outing_northern_academy_cave"]
"name" = "Old cellar"
"hint" = "The cellar of an old warehouse beside the school has stood empty for years, with a damp line higher than a person’s knee. Passing at night, you can hear a muffled rumble inside, like barrels rolling. Your classmates swear it’s the cooper who drowned there, still moving stock."

[nodes."map_northern_academy:outing_northern_academy_relic"]
"name" = "Abandoned garden wall"
"hint" = "Only half a wall is left of the abandoned garden. Set into its foot is a stone scored with a close row of bars and half a line of lettering, of which you can make out “…ell.” The old folks say a giant once measured his height here. But the bars are far too even to be idle scratches."

[nodes."map_northern_academy:outing_northern_academy_market"]
"name" = "Bookshop alley"
"hint" = "The narrow alley behind the bookshops sells books by day and, after dark, whatever comes to hand. One seller holds up a folio Euclid printed in Venice, a Padua professor’s own copy, he says, and he asks a year’s school fees for it. The bookbinder from the next stall passes, rubs his thumb over a patch on the binding’s corner, gives the seller a long look, and walks on without a word."

[nodes."map_northern_academy:outing_northern_academy_shore"]
"name" = "Old landing"
"hint" = "The old landing’s piles have been soaked black by the river. At the iron ring on the end, the school’s ferry skiff is tied by a line worn to a few strands where it bends around the iron. The wind will turn by evening and the water will rise, but the old ferryman crossed over at dawn and has not come back. The porter is blocking a pupil who means to row himself across, the two of them red in the face, and neither has looked down at the line."

[nodes."map_northern_academy:outing_northern_academy_path"]
"name" = "Country chapel"
"hint" = "Outside the town stands a small chapel with an old altarpiece, and on Sundays the farm women walk in for the service. The causeway to the door runs between flooded ditches, one person wide, and today a man planted in the middle of it calls himself the sexton’s helper and says you must pay “candle money” to pass. Dark cloud is piling up in the west, the old people and children are anxious to get inside before the rain, and two old women are already fishing out coins."

[nodes."map_iberian_home:outing_iberian_home_herbs"]
"name" = "Olive path"
"hint" = "It is olive harvest, nets spread under the trees and mules plodding down the track with full baskets. Along the path grows a row of glossy shrubs that all look like bay, and the old woman next door always pinches a few leaves for her fish stew. But on some of them the leaves are long and narrow, set three to a whorl around the branch, and snapping a stalk releases no scent at all. Leave them alone for now."

[nodes."map_iberian_home:outing_iberian_home_cave"]
"name" = "Tidal rock cave"
"hint" = "A cave under the cliff shows its mouth only at the lowest tides, and the water line on its walls is higher than a head. On the rising tide a long hollow note comes out of it, like someone blowing a conch. The fishing village’s children call it the Moorish girl’s horn and say an enchanted girl is trapped inside; not one of them dares go in."

[nodes."map_iberian_home:outing_iberian_home_relic"]
"name" = "Abandoned lookout"
"hint" = "On a headland stands the old lookout tower, its top long since fallen in. A stone by the door bears half a line of curling script that is not Latin. The village says it is a curse left by the Moors when they buried their treasure: dig beneath the tower and you turn to stone. Several spots at the foot of the wall have indeed been torn up by pickaxes."

[nodes."map_iberian_home:outing_iberian_home_market"]
"name" = "Bridge market"
"hint" = "The market under the bridge is loud from dawn to dark, with salt-fish sellers, potters, and secondhand-boot dealers all jammed together. One stall shows half a sack of dark red grains. Cochineal from New Spain, the seller murmurs, which dyers fight over, and he’s asking only half the usual price. A dyer’s boy lays a pinch of his own shop’s cochineal on a kerchief beside the stall’s, holds the two up to the light, whistles through his teeth, and bolts for the far end of the bridge, forgetting the kerchief."

[nodes."map_iberian_home:outing_iberian_home_shore"]
"name" = "Slipway shore"
"hint" = "The slipway runs slantwise into the water, and the air is thick with pitch, wood shavings, and oakum. A skiff is being winched up the ways, its hauling line chafed to a few strands on a burr at the block. The grown-ups are all far off hammering planks. Only a new apprentice minds the winch; he has seen the damage and doesn’t dare say so, and keeps turning the handle slowly, eyes fixed on the block."

[nodes."map_iberian_home:outing_iberian_home_path"]
"name" = "Hillside chapel"
"hint" = "The hillside chapel keeps an old oak Madonna, and in summer people climb up from all around to keep their vows. At a bend where the path squeezes down to a single person’s width, a young man squats with a tin box, collecting a “road levy” for the chapel’s lamp. Those who don’t pay, he says, won’t get the Madonna’s protection on the way down. A line of people carrying offerings has backed up behind him, none of them willing to miss the hour of their vow, and a few are already fumbling for their purses."

[nodes."map_iberian_academy:outing_iberian_academy_herbs"]
"name" = "Grove by the herb garden"
"hint" = "At the edge of the wood beyond the herb garden, the master has sent the pupils to gather comfrey to pound into a poultice for a classmate’s broken arm. Two clumps grow there, equally broad-leaved, both like long green tongues, though one looks a shade grayer. The master stands with his hands behind his back and his eyes on yours."

[nodes."map_iberian_academy:outing_iberian_academy_cave"]
"name" = "Limestone entrance"
"hint" = "At the foot of the hill behind the school, a limestone cave mouth hangs with ferns, and inside, a green line of moss crawls along the wall. After every rain a bell sounds from within, one stroke after a long wait: dong… dong. The people down in the valley say a buried church is ringing."

[nodes."map_iberian_academy:outing_iberian_academy_relic"]
"name" = "Old embankment breach"
"hint" = "A great breach has opened in the old embankment, and water spills out to make a reed marsh. Set among the dike stones beside it is an oblong slab with half a line of lettering, mostly caked in mud. The families nearby say it is the grave marker of a bride drowned at the breach, and on full-moon nights you can hear her combing her hair."

[nodes."map_iberian_academy:outing_iberian_academy_market"]
"name" = "Evening bookstall"
"hint" = "Oil lamps burn along the evening bookstalls, where the seller weighs out loose old pages by the pound for people who want to wrap fish or sweets. In the pile of scrap, a parchment leaf painted with herbs shows through, its red and blue ink still bright. The seller rests one hand on the scale pan and, with the other, nudges the weight outward."

[nodes."map_iberian_academy:outing_iberian_academy_shore"]
"name" = "Tide-measuring steps"
"hint" = "Numbers are cut into the steps, one by one, for old pilots to measure the tide by. A small fishing boat is tied at the lowest step on a short line, taut as a bowstring. Today is a spring tide, and none of the children playing nearby sees anything wrong; only the old man drying nets on the steps keeps shaking his head."

[nodes."map_iberian_academy:outing_iberian_academy_path"]
"name" = "Vineyard chapel"
"hint" = "A small chapel with an old well stands on top of the vineyard slope. At harvest, families carry baskets up and down the path. Today a man at the junction calls himself the tithe collector and reaches into each basket for a handful of purple grapes, the chapel’s share, he says. A basket is a day’s work, and nobody wants to give it away."

[nodes."map_italian_home:outing_italian_home_herbs"]
"name" = "Poplars on the dike"
"hint" = "Beside the drainage ditch behind the dike grows a feathery clump much like the wild fennel the kitchen stuffs into fish. But its stalk is spattered with purple, and a crushed leaf smells like a mouse’s nest. Don’t pick it yet."

[nodes."map_italian_home:outing_italian_home_cave"]
"name" = "The dead furnace house"
"hint" = "At the edge of the island stands an old furnace house with half its roof burned in. High tides flood the hearth and have left a white ring of salt crust on the brick, climbing almost to the rafters. Inside it is black, and every so often a low ooo—ooo comes out, like someone humming, while cold air seeps through the cracks in the brick."

[nodes."map_italian_home:outing_italian_home_relic"]
"name" = "Lighthouse stump on the mudflat"
"hint" = "On a mud island by the channel stands the brick stump of a lighthouse, crusted with barnacles and weed. Half a line of Latin is cut into its foundation stone, and beside it a row of little bars. The old islanders say a hermit once lit a lamp here to guide boats, but the bars look less like praise than like bookkeeping."

[nodes."map_italian_home:outing_italian_home_market"]
"name" = "Dusk market on the glass quay"
"hint" = "The dusk market sprawls along the canal: bead sellers, goblet sellers, and ash sellers shoulder to shoulder. A stranger guards a few sacks and calls out “good ash from Syria,” fixed price. It’s the same ash your family’s furnace melts down, but his sacks feel wrong in the hand—too heavy."

[nodes."map_italian_home:outing_italian_home_shore"]
"name" = "Shallows among the poles"
"hint" = "As the tide goes out, the lagoon shallows bare a field of black mooring poles. A flat-bottomed skiff’s line is looped around one of them, and the rough bark has chafed it down to two strands. A ring of children squats in the mud, each with a different idea about the knot and none able to convince the others, but when the tide comes the skiff will drift into the channel."

[nodes."map_italian_home:outing_italian_home_path"]
"name" = "The friary landing"
"hint" = "At the landing for the friary on the island, a boatman lays his pole across the way and says the path over the shallows is closed; the only way over is his boat, two small coins a head. The landing is packed with people hurrying to Vespers, the bell is nearly due, and some are already reaching for their purses."

[nodes."map_italian_academy:outing_italian_academy_herbs"]
"name" = "The dyers’ back garden"
"hint" = "The dyers’ back garden is meant to hold two rows of madder, waiting to be dug up and boiled for red cloth. Both rows grow their leaves in whorls of six or seven and look identical, yet the dyer’s wife is worried: cloth boiled from the right-hand row always comes out dull gray-yellow, never red, and she cannot see what has gone wrong."

[nodes."map_italian_academy:outing_italian_academy_cave"]
"name" = "The annealing tunnel"
"hint" = "Behind the workshop runs a disused annealing tunnel, its brick arch so low you must stoop. At night a thin ting—ting often comes out of it, like a fingernail flicked against a goblet. On the arch wall the stokers have drawn a high-water line in red ochre, chest high, with years scrawled beside it, and a cold draft crawls out along the floor."

[nodes."map_italian_academy:outing_italian_academy_relic"]
"name" = "The old pier stone"
"hint" = "A new stone bridge now crosses the narrow canal, but the old pier stays in the water: a thick stone column, half submerged, its inscription eaten by moss and salt down to scraps. The boatmen say a Roman general threw a bridge across here in a single night. Yet the letters on the column look, to your eye, like the ones on gravestones."

[nodes."map_italian_academy:outing_italian_academy_market"]
"name" = "Scrap-paper stall on Printers’ Row"
"hint" = "At the end of Printers’ Row a scrap-paper stall sells waste paper by the pound for pastry shops and fishmongers to wrap goods in. The stallkeeper drops a crumpled stack on his scale and shouts “eight pounds.” In the pile you spot half a page of Greek with corrections in red in the margin—the hand of the Greek corrector at the printing house."

[nodes."map_italian_academy:outing_italian_academy_shore"]
"name" = "The ferry landing stage"
"hint" = "Beside the landing stage the flat-bottomed passenger barge sits idle. A gust last night tore a rent in its little square sail, and the boatman says he won’t cast off today, even with a fair wind. The crowd on the stage—porters, a man hugging a crate of glass—grumbles loudly."

[nodes."map_italian_academy:outing_italian_academy_path"]
"name" = "The convent orchard gate"
"hint" = "Outside the convent orchard’s small gate, a man in a rough brown robe blocks the path, saying he begs for the convent and everyone passing must give a coin for the Madonna’s lamp oil. But the robe is too short, showing a pair of tar-stained sailor’s boots. The farm women with vegetable baskets drop their coins into his palm one by one, and you stand gripping yours, staring at the boots."

[nodes."map_arabian_home:outing_arabian_home_herbs"]
"name" = "By the channel in the date garden"
"hint" = "A vine trails along the irrigation channel in the date garden, hung with fist-sized yellow globes like unripe melons. The children scramble to pick them. The old gardener shouts “Don’t touch!” from across the garden and doesn’t say why."

[nodes."map_arabian_home:outing_arabian_home_cave"]
"name" = "The dry-spring cave"
"hint" = "In the foothills is a cave whose spring dried up long ago, a bundle of dead reeds and broken twigs wedged in a crack by its mouth, higher than a man’s head, left there by a flood. Only dry sand lies on the floor, yet from deep inside comes the sound of running water, and a cool wind that smells of wet clay. The village children say jinn are washing laundry in there."

[nodes."map_arabian_home:outing_arabian_home_relic"]
"name" = "The ruined well platform"
"hint" = "On the sand beyond the village stands a ruined well platform, its rim cut with half a line of Kufic that wind and grit have worn to a few strokes. Camel drivers spit as they pass and say the well once “swallowed a man.” Yet the opening strokes look like “In the name of God, the Compassionate, the Merciful,” and curses don’t begin that way."

[nodes."map_arabian_home:outing_arabian_home_market"]
"name" = "Pearl stalls by lamplight"
"hint" = "After dark the souq lights a row of oil lamps, and the pearl dealers squat on felts with small copper trays before them. A stranger cradles a pearl the size of a thumb pad in his palm and says divers fetched it from the Bahrain banks this summer, at a price that makes you flinch. The old pearl assessor beside him squints, says nothing, and tucks his own little scale a little further into his sleeve."

[nodes."map_arabian_home:outing_arabian_home_shore"]
"name" = "The shipwrights’ beach"
"hint" = "A half-built boat sits on the beach with its ribs pointing at the sky. Its planks are sewn together, stitch after stitch, with cord twisted from coconut husk. On last night’s tide one seam at the bow chafed through, and the gap between the planks has opened a finger’s width. The shipwright’s young son is spinning in circles while the other boys shout advice."

[nodes."map_arabian_home:outing_arabian_home_path"]
"name" = "The rest shelter on the cliff road"
"hint" = "On the coastal cliff road stands a stone rest shelter, with a pool beside it for camel drivers and travelers to drink from. Today a man sits by the pool with a copper cup before him, saying the shaykh has made a new rule: one coin a cup. Camel drivers with throats like dust curse him a little and drop their coins into the cup anyway."

[nodes."map_arabian_academy:outing_arabian_academy_herbs"]
"name" = "The infirmary’s herb garden"
"hint" = "In a corner of the infirmary’s herb garden grows a tree nobody can name, with feathery leaves. A captain home from Malabar gave the seed about ten years ago, and nobody thought to ask what it was. The gardener says at night it folds its leaves shut in pairs, as if asleep. The old physician strokes his beard: what we cannot name, we neither prescribe nor swallow."

[nodes."map_arabian_academy:outing_arabian_academy_cave"]
"name" = "The harbor storehouse vault"
"hint" = "Under the harbor storehouse is a stone-vaulted cellar, normally locked, today with its lock broken. A skin of gray silt lies along the stairs, printed with crab tracks left when the tide crept up, and out of the darkness comes the sound of people talking low. The storehouse hand bars the way: don’t go, it’s the old harbor-master’s ghost down there counting sacks, and how else would the grain always go moldy?"

[nodes."map_arabian_academy:outing_arabian_academy_relic"]
"name" = "The bridge over the dry channel"
"hint" = "Over an irrigation channel long dry outside the city lies a single-arched stone bridge, its parapet bearing half a line of writing that wind and grit have blurred. The old men going to market say Dhū l-Qarnayn, the Two-Horned, raised it in a night; a man who could wall off Gog and Magog in iron can manage a bridge. But the letters sit in neat rows, plainly cut by a person, chisel stroke by chisel stroke."

[nodes."map_arabian_academy:outing_arabian_academy_market"]
"name" = "Copyists’ stalls by night"
"hint" = "The copyists’ stalls are lit for the night, each with a row of little porcelain dishes: gold dust, cinnabar, malachite green. One dish is a deep blue, glinting with gold on top, which the stallkeeper swears is pure lapis from Badakhshan, ground for three months to yield this small pinch, three dinars a mithqal. He will only scoop from the surface, with a little spoon. The illuminator at the next stall purses his lips and quietly covers his own pinch of blue."

[nodes."map_arabian_academy:outing_arabian_academy_shore"]
"name" = "The sail-trial inlet"
"hint" = "The inlet by the shipyard is where new sails are tried in the wind. Today a new sail takes the wind, and the halyard rubs at the pulley until a thin wisp of smoke curls off it, and the apprentices hurriedly let go. They all talk at once—the rope is too thick, the wheel is crooked—and the master has gone to the harbor office and won’t be back until evening."

[nodes."map_arabian_academy:outing_arabian_academy_path"]
"name" = "The road to the night lesson"
"hint" = "The teaching lodge outside the city sits at the end of a stony slope, and students often hurry up after sunset for the night lesson. At the foot of the slope a man squats with a lantern and says there are wolves and thieves in the hills tonight and you need him to guide you, two copper coins a head. A few students reach for their purses while glancing back at the sky; the lesson is nearly due."

[nodes."map_north_african_home:outing_north_african_home_herbs"]
"name" = "The track along the orchard wall"
"hint" = "Along the track beside the pomegranate orchard’s low wall stands a white flower spike taller than a man, its fist-sized bulb half out of the soil like a giant onion. Every child who sees it wants to dig it up for grandmother’s stew. But it has no leaves at all, and the orchard keeper shouts from afar: leave that alone."

[nodes."map_north_african_home:outing_north_african_home_cave"]
"name" = "Washerwomen’s spring cave"
"hint" = "Water runs out of a black mouth in the rock at the foot of the hill, and the women beating laundry at the stone trough beside it never go inside. From within come bursts of clanging, as if someone were hammering a copper basin. The jinn in the spring is scouring his pots, they say, and nobody goes near after sunset."

[nodes."map_north_african_home:outing_north_african_home_relic"]
"name" = "Old aqueduct arch"
"hint" = "Of the old water channel in the Hamma valley only one half-fallen arch remains, and half a line is cut into its keystone. The children say the Spanish emperor’s army camped in the valley twelve years ago and buried its pay under the arch before it left. After every rain someone turns up with a shovel to dig. But the few letters that remain don’t look like a code."

[nodes."map_north_african_home:outing_north_african_home_market"]
"name" = "Candle-makers’ alley"
"hint" = "The alley of the candle-makers smells of beeswax from dawn to dusk. A stranger hangs a gleaming lamp from a hook at the front of his stall and calls it solid silver, unloaded from an Indian ship, at a frightening price. The scribe at the next stall, who writes out contracts for hire, glances at the lettering around its rim, says nothing, and starts paging through his ledger."

[nodes."map_north_african_home:outing_north_african_home_shore"]
"name" = "Mouth of the dyers’ channel"
"hint" = "The dyers’ drain empties into the bay, and indigo and madder-red run out over the shallows in long threads, as if someone had knocked over a dish of pigments. A small skiff is tied to a post at the outfall, its line worn to a few strands, while a huddle of children shout themselves red arguing over which knot to tie. The tide has begun to rise."

[nodes."map_north_african_home:outing_north_african_home_path"]
"name" = "Hillside lodge"
"hint" = "On the stony track up to the hillside lodge, a man sitting under a carob tree calls himself the lodge’s steward and says everyone who climbs this year must pay lamp-oil money. There are water-carriers and a goatherd on the path too, and none of them wants to be the first to argue."

[nodes."map_north_african_academy:outing_north_african_academy_herbs"]
"name" = "Herb-garden hedge"
"hint" = "Two clumps of long, narrow, glossy-leaved shrubs twine along the herb garden’s hedge, as if poured from one mold. The kitchen boy comes every day to pick bay leaves for the stew, and this week he has been picking fast without looking. The old apothecary who tends the garden is out on a call, and only the bees are humming."

[nodes."map_north_african_academy:outing_north_african_academy_cave"]
"name" = "Old cistern"
"hint" = "Behind the student lodgings an old cistern lets its stone steps run down into black water, and a white crust of salt on the steps crunches underfoot. The boys in your room bet on who dares go down with a lamp. Every so often, from below, comes one clear note, like a small bronze bell struck once."

[nodes."map_north_african_academy:outing_north_african_academy_relic"]
"name" = "Broken stone in the olive grove"
"hint" = "Half a stone slab stands in an olive grove outside the city, with half a line of Latin letters on it. The treasure-hunters’ guild says it’s a Roman marker for buried gold and comes to dig beside it every spring, turning the soil over and over. The grove’s owner pays to have the holes filled every year."

[nodes."map_north_african_academy:outing_north_african_academy_market"]
"name" = "Paper sellers at dusk"
"hint" = "When the lamps are lit, the paper sellers’ stalls glow one by one. A porter squats under a lamp selling a bundle of old letters by the pound, fished out of a wreck across the sea, he says, and the paper still smells of salt. The letter-reader at the next stall, who reads and writes for people who can’t read, leafs through his ledger, looks again at the knot in the string around the bundle, and says nothing."

[nodes."map_north_african_academy:outing_north_african_academy_shore"]
"name" = "Water steps"
"hint" = "After a night of spring rain the river has climbed to the fifth step. A plank footbridge hangs beside the stairs, its main rope worn on an iron ring down to a fraction of a strand. A few children are shouting about what knot to tie, and on the far bank a little girl with a board of dough on her head is about to step onto the bridge. You call her back and send her around by the stone bridge downstream, to the neighborhood oven."

[nodes."map_north_african_academy:outing_north_african_academy_path"]
"name" = "Copyists’ rest stop"
"hint" = "On the hillside is a little shelter where copyists rest, and students climb up with their book boxes to copy under the olive trees. Halfway there a man sits on a big stone in the middle of the stony path and says that by order of the new sultan everyone must pay a copper coin to pass. He holds a paper up high but won’t let anyone step close enough to read it. A few copyists with book boxes have stopped in front of the stone, looking at one another, and nobody has reached for a coin."

[nodes."map_east_african_home:outing_east_african_home_herbs"]
"name" = "Coastal thicket"
"hint" = "Two vines twine under the thicket, with heart-shaped leaves nearly identical. Last month a child dug up one kind and boiled it for hours; it was so harsh it numbed his tongue, and he lay on his mat for two days. The old grandmother chewing betel has driven every child out of the thicket and forbidden both kinds."

[nodes."map_east_african_home:outing_east_african_home_cave"]
"name" = "Coral cave"
"hint" = "Under a low cliff behind the old house foundations is a cave in the coral rock, its mouth too neat to be natural. At spring tides a deep “whoo…” comes from inside, like someone blowing across an empty jar, and bats pour out in a cloud. The water line on the walls is higher than a man’s head. The children say an old ghost of the island is sighing, and nobody goes near after dark."

[nodes."map_east_african_home:outing_east_african_home_relic"]
"name" = "Old house foundation"
"hint" = "Of the old house on the island only a ring of coral-stone footings is left, and half a line is cut into the threshold stone, worn shallow by salt. The old men say it was the home of the first sultan, who came from Shiraz. But the way the few words are written doesn’t look like something written for a sultan."

[nodes."map_east_african_home:outing_east_african_home_market"]
"name" = "Sea-breeze market"
"hint" = "When the sea breeze rises, the lamps of the evening market are lit. A stranger lays out a curved tusk—prime ivory from beyond Sofala, he says, sold by weight. The scribe who keeps the stallholders’ accounts glances at a ring worn bright near the tip, mutters half a sentence, and opens his ledger."

[nodes."map_east_african_home:outing_east_african_home_shore"]
"name" = "Canoe beach"
"hint" = "A row of dugout canoes lies on the sand at low tide, and under the coconut palms several women sit rolling coconut husk fiber into rope against their thighs. In the shallows a small canoe’s mooring line is worn on the coral down to a few strands, and the children are quarreling over which knot to tie while the tide begins to turn."

[nodes."map_east_african_home:outing_east_african_home_path"]
"name" = "Well on the caravan road"
"hint" = "On the road inland, a well stands under an old baobab, and travelers water their animals here. Today a man sits at the well-head claiming to be the chief’s tax collector, saying everyone who passes must pay a string of cowries. The porters carrying ivory mutter behind him, and none of them wants to speak first."

[nodes."map_east_african_academy:outing_east_african_academy_herbs"]
"name" = "Nile garden"
"hint" = "In the garden on the Nile island, watermelon vines cover half the slope. Among them grow a few small round melons the size of an egg, mottled yellow-green, with deeper-cut leaves, so like their neighbors and yet not. The gardener’s donkey walks past and would rather go hungry than bend its head to them."

[nodes."map_east_african_academy:outing_east_african_academy_cave"]
"name" = "Old reservoir vault"
"hint" = "At the foot of the Muqattam hills lies a dry old reservoir, brick vault after brick vault. The schoolboys say that if you whisper a word at the entrance, something answers from the depths, but it sounds like someone else mimicking you. Dry gray weed hangs from the entrance vault and crumbles at a touch."

[nodes."map_east_african_academy:outing_east_african_academy_relic"]
"name" = "Canal inscription"
"hint" = "Beside the old canal at the edge of the city stands a broken half-stele with half a line of writing. Everyone along the canal says General Amr set it up when he dug the canal. At last year’s dredging, two vegetable-growers argued under it about whose stretch was whose and nearly came to blows."

[nodes."map_east_african_academy:outing_east_african_academy_market"]
"name" = "Lamplit paper market"
"hint" = "The paper market fills with people once the lamps are lit. A porter at one stall is hawking a ream of fine paper, just unloaded from a ship from over the sea, three crescents pressed into its laid lines, at half the usual price. The copyist at the next stall, who keeps the accounts of a student lodging, leans over to hold a sheet up to the lamp and check the watermark, says nothing, lays his pen across the inkstone, and opens his ledger."

[nodes."map_east_african_academy:outing_east_african_academy_shore"]
"name" = "Beside the river gauge"
"hint" = "The steps beside the river gauge run down into the Nile, and in flood season the water can climb several fingers in a night. A small ferry boat is tied beside them, its line stretched straight and fraying on the stone edge. A few children argue whether the line should be pulled tight or let slack. Nobody knows, and the river has risen another finger."

[nodes."map_east_african_academy:outing_east_african_academy_path"]
"name" = "Scholar’s country house"
"hint" = "Out of the city toward the desert’s edge, at the end of the field banks, stands a scholar’s retreat where the teachers of the school often go to spend the night and lecture. Halfway there a man sitting by a canal sluice calls himself the road watcher and says that from this year everyone passing owes night-watch money, a copper coin each. Farmhands coming home and a water-seller with his donkey happen by, and all slow down, glancing at him, waiting to see who will pay first."

[nodes."map_chinese_home:outing_chinese_home_herbs"]
"name" = "Banyans on the levee"
"hint" = "Old banyans on the levee trail their aerial roots, and one is wrapped in a vine of yellow flowers that looks at first like honeysuckle. But the woman who sells fresh herbs below the levee once said there’s a vine that will cut your guts in two. Leave this one alone for now."

[nodes."map_chinese_home:outing_chinese_home_cave"]
"name" = "Tide-rock hollow"
"hint" = "Under the rocks by the sea is a hole that shows only at low tide, with a water line higher than a grown man. The adults forbid children to go in—smugglers used to hide goods there, they say—which only makes everyone want to look."

[nodes."map_chinese_home:outing_chinese_home_relic"]
"name" = "Foundations of the old stockade"
"hint" = "Only a ring of foundation stones is left of the old stockade behind the village, with half a stele set into the base of the wall. The old folks say Song loyalists built it against the Mongols. Yet among the few characters you can read is the word for Japanese raiders."

[nodes."map_chinese_home:outing_chinese_home_market"]
"name" = "Estuary night market"
"hint" = "When the tide drops, the boats tie up at the river mouth and the night market strings out its lanterns. One stall has a child’s silver longevity lock hanging up—traded off a Japanese ship, the seller says, a full two taels. The Tianfei temple’s bookkeeper walks by and stares at the characters engraved on it for a long time."

[nodes."map_chinese_home:outing_chinese_home_shore"]
"name" = "Net-menders’ sandbar"
"hint" = "Nets are spread to dry all over the sandbar, and the women mend them, laughing as they work. In the shallows a sampan’s line is nearly chafed through, and a few children argue over whether a fisherman’s knot or a boatman’s knot is right, none of them giving an inch."

[nodes."map_chinese_home:outing_chinese_home_path"]
"name" = "Old trail to the hill temple"
"hint" = "The old trail to the hill temple crosses a stone bridge, and a man at the end of it calls himself a temple steward: three coins each for “bridge repairs.” Everyone knows the village paid to fix that bridge last year. There are people around; don’t argue with him on your own."

[nodes."map_chinese_academy:outing_chinese_academy_herbs"]
"name" = "The school’s herb garden"
"hint" = "The Double Fifth is coming, and the teacher sends the pupils to cut sweet flag for the doorways. But by the pond grow two clumps of sword-shaped leaves, identical except that one has bloomed purple and one hasn’t. Hands clasped behind his back, the teacher says only: “Work it out.”"

[nodes."map_chinese_academy:outing_chinese_academy_cave"]
"name" = "Cave under the cliff"
"hint" = "The cliff outside the city is covered in inscriptions left by earlier visitors, and at its foot is a shallow cave. From the dark at the back comes a breeze that chills the nape of your neck. Your classmates all say it runs clear through the mountain, but none of them has ever gone in."

[nodes."map_chinese_academy:outing_chinese_academy_relic"]
"name" = "Inscription on the broken bridge"
"hint" = "Outside the city stands a stone bridge broken off halfway, with two great characters on the pillar at its head. Everyone says Master Zhu wrote them himself when he governed Zhangzhou. But a line of small characters at the foot of the pillar lies under a thick coat of moss."

[nodes."map_chinese_academy:outing_chinese_academy_market"]
"name" = "Lamplit book market"
"hint" = "At a book stall in the lantern market, a man is selling a handwritten book of compass courses—straight off Zheng He’s treasure ships, he says, and it’s two taels of silver. The hired copyist at the next stall turns a couple of pages and frowns: he has seen this handwriting somewhere."

[nodes."map_chinese_academy:outing_chinese_academy_shore"]
"name" = "Tide-watching steps"
"hint" = "Stone steps run down into the river, and on spring-tide days the sea pushes upstream and swallows three of them within two hours. A small boat is tied at the bottom, its line half worn through on a sharp edge of stone. The owner is nowhere in sight, and the tide is coming."

[nodes."map_chinese_academy:outing_chinese_academy_path"]
"name" = "Hill behind the Tianfei temple"
"hint" = "The path up the hill behind the Tianfei temple leads to a lookout over the sea. A man sitting on a rock halfway says you must pay incense money to go up, and waves a paper stamped with a red seal. The seal is crooked."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_herbs"]
"name" = "Seaside pines"
"hint" = "The sea wind has bent every pine the same way, and mugwort grows thick at the edge of the grove. But in one patch the undersides of the leaves are green instead of silver-white. Pick the wrong plant for an old person’s moxa and it just smokes black."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_cave"]
"name" = "Low-tide grotto"
"hint" = "At low tide a grotto opens under the reef, its water line above your head. Each time a wave draws back, a long sigh comes out of the dark. The women gathering shellfish say a dragon sleeps in there."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_relic"]
"name" = "Foot of the old fort wall"
"hint" = "Half the old fort wall has fallen, and a carved stone is set into its base, the writing scoured by the sea wind down to half a line. The village says it’s a warding stone laid when the fort was built, carved with a curse. But what’s left looks more like names."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_market"]
"name" = "Interpreters’ evening market"
"hint" = "At the evening market, Japanese merchants, local interpreters, and peddlers with shoulder poles crowd together, talking in several languages at once. One stall lays out a bolt of figured satin—a full bolt of Chinese satin, the seller says, off a big ship from across the water. The interpreter who writes contracts looks at an ink mark on the corner and starts paging through his ledger."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_shore"]
"name" = "Oar-trial cove"
"hint" = "The cove is flat as a mirror, and every mended boat is brought here first to try its oars. One small boat has brand-new oars and a mooring line worn to a few strands, and a knot of children argue, louder and louder, about how to splice it."

[nodes."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_path"]
"name" = "Sacred grove on the hill"
"hint" = "Partway up the hill is a grove nobody ever cuts, with a cairn of stones before it; women whose men are at sea come here to pray for them. Today a stranger sits on the path and says you must pay to pass. No one has ever charged anything here."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_herbs"]
"name" = "Herb slope"
"hint" = "On the slope grows a plant with three leaflets to a stem—pinellia, the teacher says, whose tuber clears phlegm. Beside it grows another whose leaflets spread like the ribs of an umbrella. One raw bite numbs your tongue for hours, and at a school for interpreters that’s worse than a caning."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_cave"]
"name" = "Grotto forecourt"
"hint" = "An old flagstone court lies before the grotto, as if someone once held rites here. In the dark inside is a pool of water, full in the morning and much lower half a day later. Your classmates say it’s a well that goes down to the dragon palace."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_relic"]
"name" = "The envoys’ old stone terrace"
"hint" = "A pavilion for receiving guests once stood on this stone terrace by the sea. It fell long ago, but lines are still carved into the terrace. At school they say it’s an oath left by a foreign envoy, yet up close the writing is plainly in two different hands."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_market"]
"name" = "Paper-and-ink stalls at dusk"
"hint" = "At a paper-and-ink stall in the evening, the seller presents a few sticks of ink—Huizhou tribute ink, he says, carried all the way from Ming, at an outrageous price. The old servant who buys the school’s paper hefts one, shakes his head, and can’t say what’s wrong."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_shore"]
"name" = "Sail-watch pier"
"hint" = "The end of the pier is the place to watch for sails, and families wait there when a boat is due home. A small sampan for ferrying people ashore is tied to a stone post, its line rubbed nearly through where it wraps the post. One more swell and it will part."

[nodes."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_path"]
"name" = "Path around the hill shrine"
"hint" = "Outside the hilltop shrine a path winds around the slope. Outsiders may not enter the shrine itself, but anyone may walk the path. Today, though, someone has stretched a straw rope across it, claiming this too is sacred ground: leave a handful of rice to pass."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_herbs"]
"name" = "Spice-garden edge"
"hint" = "A vine winds up the clove tree at the edge of the garden, and at its foot half a tuber pushes out of the earth, the very image of the purple yam steamed on the hearth. Every year before the rains the herbalist next door says the same thing: at the garden’s edge, be sure before you dig. Leave it alone for now."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_cave"]
"name" = "Stream-mouth cave"
"hint" = "At the foot of the hill the stream turns into a black cave mouth, and the rainy-season water line on the wall is chest high. From inside comes a steady “tick… tick…” like a fingernail flicking stone. The grown-ups say only: don’t ask. That’s the cave’s keeper counting heads."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_relic"]
"name" = "The old boat blocks"
"hint" = "A row of black wooden blocks, each thick as a man’s waist, stands on the river bend; the villagers say they are what’s left of “the ungrateful son’s great ship.” Beside them a stone bears half a line of curls and hooks that nobody can read, and children love to scratch their own names next to it with a fingernail."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_market"]
"name" = "Floating dusk market"
"hint" = "At dusk the vegetable boats and betel boats all squeeze into the river bend, paddle against paddle. On one sampan lies a small heap of white crystals. Barus camphor, the boatman says, and a lump costs a measure of pepper. The old man on the next boat, who weighs spices for a living, leans over, sniffs, pulls his hand back, and says nothing."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_shore"]
"name" = "Low-tide boat beach"
"hint" = "The tide has gone out and a few small boats lie tilted on the mud. The line of the outermost one is frayed halfway through; a water buffalo has just been by to lick the salt off it. The children are red in the face arguing over which knot will mend it, and the tide is an hour from turning."

[nodes."map_southeast_asian_home:outing_southeast_asian_home_path"]
"name" = "Wishing banyan slope"
"hint" = "A man squats in the middle of the path up to the old banyan on the slope and says that anyone who wants to make a wish must leave a handful of sticky rice as an offering. The old people on the hill have never mentioned any such rule. Porters keep coming up the slope in knots of three and four, and however loud he talks he won’t dare lay a hand on anyone; you needn’t face him down by yourself."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_herbs"]
"name" = "Bamboo path"
"hint" = "In the bamboo grove behind the school one clump has flowered, and the ground beneath it is strewn with grains so thick they can’t be swept up. The old women say bamboo flowering is a bad omen, a sign of famine, but a classmate has pocketed a handful to cook. Don’t eat it yet, and don’t throw it away."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_cave"]
"name" = "Shallow limestone cave"
"hint" = "The little stream at the foot of the hill runs up to the cliff and vanishes, leaving a black crack with a mud line above head height. Each time the water goes down there is a long “glug.” Your classmates say a naga lies coiled beneath the hill and drinks the stream a mouthful at a time."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_relic"]
"name" = "Old brick platform"
"hint" = "Deep in the grove stands a red-brick platform split open by banyan roots, which the villagers call the bed a giant once slept on. A stone slab caps its edge, with a row of small mossy notches that children use as hopscotch squares, and the brick joints are scratched all over with lines drawn with pebbles."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_market"]
"name" = "Lamplit paper stalls"
"hint" = "When the lamps are lit, the paper sellers’ stalls line the bank under their palm-leaf awnings. One of them is selling a bundle of “fine Fujian paper” by weight at a frightening price, thick and smooth to the touch. The old man at the next stall, who writes letters home for sailors, holds a sheet up to the lamp and mutters something to himself."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_shore"]
"name" = "Paddle-testing bend"
"hint" = "The river bend runs slow, so every newly carved paddle and new boat is brought here to be tried. One small boat’s outrigger float has come loose, its lashing half chafed through, and the float cocks sideways with one end dug into the water. A few children argue over whether to lash it with rattan or coir rope, neither giving way, while the boat rocks in the shallows."

[nodes."map_southeast_asian_academy:outing_southeast_asian_academy_path"]
"name" = "Hill teaching circle"
"hint" = "The teaching ground sits in a ring of old trees on the hilltop. A mat is spread across the foot of the steps with a betel box on it, and the man sitting there says new pupils must “offer a quid” before they go up. He says it so smoothly it sounds rehearsed. Porters are climbing behind you; don’t argue with him alone."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_herbs"]
"name" = "Forest herb plot"
"hint" = "The little plot at the edge of the forest belongs to the woman next door, and it’s planted with chaya, whose young leaves make the best soup. Beside it has come up a bush that looks almost the same, its leaves cut into fingers like theirs, but with a fine fuzz over the stems. She doesn’t even look up. If you don’t know it, don’t pick it, she says. Leave it alone for now."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_cave"]
"name" = "Cenote entrance"
"hint" = "In the forest lies a natural well, stone steps leading down, fig roots hanging over the rim, the water shining far below. Something down there is knocking: tock… tock… and a pause, and tock again. The adults won’t let children come alone. It is the rain god Chaak’s well, they say, and he is working in it."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_relic"]
"name" = "Old stone platform"
"hint" = "In the forest behind the village stands a fern-covered stone platform. Half a slab leans at its edge, carved with small squares like a row of little faces, and in the gaps some child has drawn grimacing faces in charcoal. The old people say a king of long ago sat here to watch the sea. But those squares don’t look like they say anything about a king."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_market"]
"name" = "Cacao dusk market"
"hint" = "At dusk the cacao sellers light little cookfires along the village road. One of them slaps a bulging sack: first-grade beans from the Bay of Honduras, he says, each worth two of anyone else’s. The village scribe, who keeps the accounts, counts them out in piles of twenty, and as he counts his brow begins to knit."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_shore"]
"name" = "Canoe shallows"
"hint" = "Several dugout canoes are tied up in the shallows by the mangroves, their lines looped around prop roots crusted with sharp oyster shells. On one of them the henequen rope has been sawed down to a few strands, and some children are quarreling about how to splice it with the tide almost on them."

[nodes."map_mesoamerican_home:outing_mesoamerican_home_path"]
"name" = "Slope path below the old temple"
"hint" = "Nobody has worshipped at the old temple on the slope for years, but the path that winds around it is walked daily. Today a stranger stands in the middle, claims he collects road tribute for the encomendero—twenty cacao beans a head—and waves a sheet of bark paper with a red seal. Villagers bound for the fields are strung out along the slope below, so there’s no need to take him on alone."

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_herbs"]
"name" = "Friary orchard"
"hint" = "In the friary orchard the sour orange and pomegranate trees stand in tidy rows, but by the wall grows one black-barked tree whose trunk weeps dark resin and whose leaves shine as if lacquered. A little boy who leaned on it yesterday has a patch of blisters up his arm today."

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_cave"]
"name" = "Small well grotto"
"hint" = "In the grotto behind the forecourt is a small well, and whenever the bell rings it hums back, a low note, as though someone beneath the water were answering. The younger children say a person who won’t go to sleep lives in the well. The mouth of the grotto is low; you have to stoop to enter."

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_relic"]
"name" = "Courtyard of broken stelae"
"hint" = "The back court of the friary is paved with stones of every size, some still showing carved edges. The kitchen doorstep is a slab broken across, its face stamped with rows of small squares worn so shallow that they show only when rain pools in them. The friar calls them marks of a false god. The old woman who sweeps says they are “days.”"

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_market"]
"name" = "Paper and thread stalls"
"hint" = "At the little market outside the friary, a thread seller’s stall is hung with skeins of red. Dyed with cochineal, the seller says, redder than blood, thirty cacao beans a skein. The midwife who teaches you weaving walks by, rolls a strand between her fingers, holds it up to the sun, glances at the jar of water at the seller’s feet, and says nothing."

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_shore"]
"name" = "Canoe landing at the creek fork"
"hint" = "One end of the creek fork opens to the sea. A sudden squall in the night has ripped a gash in a canoe’s cotton sail, and the owner needs it to put out at dawn. A knot of children stand around arguing about what needle and thread to use, and none can talk the others round."

[nodes."map_mesoamerican_academy:outing_mesoamerican_academy_path"]
"name" = "Old forest path"
"hint" = "An old path runs through the woods behind the friary to a stone outlook with a view of the sea. Today a man stands in the middle of it and says the path has been enclosed by the encomendero: ten cacao beans a head to pass, and he holds up a paper with a wax seal. He holds it high, yet he never looks at it. Two men with loads of firewood are heading the same way not far behind you, so you needn’t have it out with him alone."

[nodes."map_andean_home:outing_andean_home_herbs"]
"name" = "Valley thicket"
"hint" = "Under the huarango trees on the riverbank grow two clumps that both look like the wild mint the village herb woman boils for stomachaches. Lean close to one and it smells nothing like mint, only heavy and fishy. The old llama tethered under the tree will graze only the other. Pick nothing yet, and taste nothing."

[nodes."map_andean_home:outing_andean_home_cave"]
"name" = "Dry-valley grotto"
"hint" = "At the dry valley’s end the cave mouth is caked with cracked mud, and the mud line stands above your head, left by some flood from the hills that nobody can date. From inside come two notes, one high and one low, like someone far off playing panpipes. A cool wind is blowing out."

[nodes."map_andean_home:outing_andean_home_relic"]
"name" = "Old storehouse base"
"hint" = "Only the stone footings of a row of old storehouses remain on the slope. On the doorsill of the highest one is a line of small pits, the other half of the line worn smooth. The old folks say this is where the Inca’s raft fleet was counted before it put to sea. But however you count these pits, they don’t look like a fleet."

[nodes."map_andean_home:outing_andean_home_market"]
"name" = "Cotton dusk market"
"hint" = "The dusk market’s oil lamps come on one by one, and a man holds up a string of red spondylus beads. They drifted in from islands beyond the sunset, he says, and the price makes you wince. At the next stall the cord-keeper doesn’t look up. His fingers run slowly down a cord and stop at one place."

[nodes."map_andean_home:outing_andean_home_shore"]
"name" = "Raft-yard inlet"
"hint" = "In the shallow inlet a little reed boat is tied to a rock, its line rubbed down to a few strands where it scrapes the stone. The children on the beach have split into two camps, one shouting for a “llama-hoof knot,” the other for a “gull-foot knot,” red in the face. And the tide is coming up."

[nodes."map_andean_home:outing_andean_home_path"]
"name" = "Mountain road stop"
"hint" = "Beside the cairn at the pass a man bars the way. Every traveler must add a stone and also pay a copper coin of “mountain money,” he says, by the mountain’s own rule. Llama drivers are strung out ahead and behind, and not one of them wants to go up against him alone."

[nodes."map_andean_academy:outing_andean_academy_herbs"]
"name" = "Herb-garden slope"
"hint" = "Every plant on the herb slope has a stake beside it, wrapped with a bit of knotted cord as its label: two knots for fever, three for washing wounds. Last night goats broke in and kicked a row of stakes crooked, and some cords have wound around the wrong ones. A classmate with a fever is lying in bed waiting for medicine. Don’t brew anything yet."

[nodes."map_andean_academy:outing_andean_academy_cave"]
"name" = "Storehouse chamber"
"hint" = "Halfway up the slope stands an old storehouse, half cut into the hill, with water stains on the stone beside its doorway, out of reach overhead. From inside comes a soft tick, tick, tick, like someone counting in the dark, while a cool wind breathes out in gusts. The older pupils say it is the old keeper’s ghost, taking stock."

[nodes."map_andean_academy:outing_andean_academy_relic"]
"name" = "Carved stone by the channel"
"hint" = "A waist-high stone stands by the irrigation channel, carved with a row of small pictures: a gull, a lizard, a star, a footprint, and then the rest is worn away. The children say they are the marks of the Inca raft fleet’s captains, and that the copper chair lies buried under the stone. The old man who walks the channel just shakes his head."

[nodes."map_andean_academy:outing_andean_academy_market"]
"name" = "Quipu market"
"hint" = "At the little market a man sets out a small stool with a gleaming copper top. It was cut from the copper chair brought back from the western islands, he says, and the price takes your breath away. The cord-keeper among the cords takes up a cord and feels along it knot by knot, frowning harder and harder."

[nodes."map_andean_academy:outing_andean_academy_shore"]
"name" = "Raft-binding shore"
"hint" = "The school’s practice raft sits half afloat at the shore, nine balsa logs held together by a few fiber lashings. One of them has worn thin as thread against the edge of a log. The old raft master, whose eyes are failing, dozes nearby, and a few classmates argue over whether to add a lashing or replace it. The water is creeping up."

[nodes."map_andean_academy:outing_andean_academy_path"]
"name" = "Sea-view mountain platform"
"hint" = "On the mountain trail to the lookout a man sits on the steps and says you must pay a copper coin to go up and see the sea. As proof he holds out a cord thick with knots, and nobody there can read it. A few other people have come up to watch the fog, both above and below him on the steps; better not to face him alone."

[nodes."map_indian_home:outing_indian_home_herbs"]
"name" = "Estuary grove"
"hint" = "Every morning the children come to the estuary grove to snap neem twigs and chew them soft for brushing their teeth. This morning one boy snapped a twig from a newly grown sapling whose leaves looked just like neem. After two bites he spat, and soon he was squatting at its roots, clutching his stomach. Nobody break another twig."

[nodes."map_indian_home:outing_indian_home_cave"]
"name" = "Tidal hollow"
"hint" = "Under the rocks at the river mouth is a small hollow that shows only at the lowest tides, its walls crusted with salt lines, one above another, the highest past a grown man’s shoulder. The children say someone drums inside, and when the drum sounds the tide is on its way. Right now it is quiet in there, with only a cool draft blowing out."

[nodes."map_indian_home:outing_indian_home_relic"]
"name" = "Old warehouse platform"
"hint" = "All that remains of the warehouse is a high platform, and on its threshold stone is half a line of old lettering, the rest eaten away by salt. The village says it was a pirates’ storehouse and the carving lists the loot. But the letters don’t look like a count at all."

[nodes."map_indian_home:outing_indian_home_market"]
"name" = "Pearl merchants at dusk"
"hint" = "Oil lamps are lit in the dusk market, and a stranger holds up a pearl the size of a pigeon’s egg. He pulled it, he says, from the sea beyond Hormuz, after killing the sea serpent that guarded it. The old loan-note writer at the next stall glances at it, turns to a page in his ledger, and says nothing."

[nodes."map_indian_home:outing_indian_home_shore"]
"name" = "Tide-measuring beach"
"hint" = "A tide post stands on the beach, scored with notches the fishermen add year by year. Beside it a small boat’s coir line is worn down to a few strands, and the children are squabbling over which knot to tie. The tide is rising, and the fishermen like to say it comes in faster here than a horse can run."

[nodes."map_indian_home:outing_indian_home_path"]
"name" = "Hill-road shrine"
"hint" = "Halfway up the hill road stands a small shrine, and a man sitting by its steps says every passer-by must pay one cowrie of “lamp-oil money,” or the shrine’s lamp will go out. Travelers going up and down stand around in twos and threes, watching from a distance, and nobody wants to be the first to speak up."

[nodes."map_indian_academy:outing_indian_academy_herbs"]
"name" = "Dye garden"
"hint" = "In the dye garden behind the workshop the pupils cut a bundle of indigo and set it fermenting in the vat. The dyer circles it, sniffing, and frowns: only gray-brown water, no blue foam rising. Two clumps in the garden have almost identical leaves. The dyer points to the leftover bundle: find what doesn’t belong in it yourselves."

[nodes."map_indian_academy:outing_indian_academy_cave"]
"name" = "Old well vault"
"hint" = "Steps descend level by level into an old stepwell of the city, and on the walls of its vaulted chamber the rainy-season water marks stack up, the highest out of reach. In the dark depths someone keeps haggling in a low voice, “Eight—no, nine…” again and again, and nobody answers. A cool draft blows out of the vault."

[nodes."map_indian_academy:outing_indian_academy_relic"]
"name" = "Pillar by the old channel"
"hint" = "The old channel has silted up into a shallow ditch where cattle graze, and beside it stands a stone pillar, half buried in mud, carved with half a line of lettering. The children say this is where the roc dropped an elephant, and the huge bones dug out of the ditch prove it. The old folks only smile."

[nodes."map_indian_academy:outing_indian_academy_market"]
"name" = "Ledger-paper stalls"
"hint" = "At the ledger-paper stalls in the night market, old account books are sold by the pound. They were fished out of a ship that sank off Diu, says the seller, and the paper still tastes of brine. The ink seller at the next stall takes a glance at the red-cloth covers, then gets up to riffle through his own book of credit."

[nodes."map_indian_academy:outing_indian_academy_shore"]
"name" = "Test-boat inlet"
"hint" = "At the shipyard a newly sewn little boat has been floated in the shallow inlet for a trial and tied to a post. Its planks are stitched together with coir thread, but its mooring line is rubbing through against the post. The apprentices looking on argue over whether to tie a fisherman’s knot or a shipwright’s, each side sure it is right, and nobody looks at the line itself."

[nodes."map_indian_academy:outing_indian_academy_path"]
"name" = "Hillside retreat"
"hint" = "On the trail up to the hillside retreat a man bars the way, saying each pilgrim must pay a cowrie of “meal money” to feed the ascetics above. He holds a begging bowl so bright and clean that it has plainly never begged for anything. Pilgrims are walking in groups above and below; don’t confront him on your own."

[outing_steps."map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_first"]
"name" = "Something under the pines"
"text" = "Where the tide has drawn back, a clump of what looks like beach silvertop has come up among the pine roots. But it has chosen the damp shade, its leaves are pale underneath, and a snapped stem gives off a sharp, wrong smell. Leave it in the ground for now."

[outing_steps."map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_revisit"]
"name" = "Leaf, stem, root"
"text" = "A day later you go back with a pen case, or with a friend who knows herbs. Set leaf against leaf, stem against stem, root against root, and the difference shows: true silvertop grows only on open, sunlit sand, and its root is long and pale yellow."

[outing_steps."map_japanese_home:outing_japanese_home_herbs:outing_japanese_home_herbs_solve"]
"name" = "The silvertop and its double"
"text" = "The clump on the sunny sand is the real silvertop; boil the root and it sweats out a chill. The one in the shade even the grazing cattle walk around. Both drawings end up tucked among the village herb woman’s recipes."

[outing_steps."map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_first"]
"name" = "Murmurs in the dark"
"text" = "The cave mouth shows only at the lowest tides, and the water line on its walls is higher than your head. Inside it is black, full of dripping, and now and then something like a voice murmuring. A cool draft blows outward. There must be another opening."

[outing_steps."map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_revisit"]
"name" = "Follow the draft"
"text" = "This time you go in with a lit beeswax candle, or behind a friend who can draw a chart. Following the way the flame leans, you find a waist-high ledge with a fork beyond it, and you map as far as the second fork before the tide comes back."

[outing_steps."map_japanese_home:outing_japanese_home_cave:outing_japanese_home_cave_solve"]
"name" = "The other mouth"
"text" = "The far end opens in a cleft under the pines, and the murmuring is only wind through the rock. You give the chart to an old fisherman, who sets a board at the entrance: nobody goes in during the two hours before high tide."

[outing_steps."map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_first"]
"name" = "Half a line of carving"
"text" = "No one has lit the beacon on the headland in years. Half a line is cut into its base; you can make out “fire” and “eighth month.” The village says this is where smoke went up when pirate ships were sighted, but the carving doesn’t read like a warning."

[outing_steps."map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_revisit"]
"name" = "Taking a rubbing"
"text" = "You climb the headland again with an ink case tucked in your clothes, or with a friend who writes a good hand. Brush off the salt crust, wet the paper, and the rubbing sorts deep from shallow: the deep strokes are the old carving, the faint ones just children scratching with pebbles."

[outing_steps."map_japanese_home:outing_japanese_home_relic:outing_japanese_home_relic_solve"]
"name" = "The whole line"
"text" = "Pieced together, the line reads: “This fire burns for those who did not come home from the sea.” It was never an alarm. It was a light for the boats that didn’t return. That Obon, someone from the village carries a torch up the headland again."

[outing_steps."map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_first"]
"name" = "Aloeswood from the southern seas"
"text" = "The ferry landing comes alive after dark. A stranger at one stall is selling a block of “aloeswood from the southern seas”—one shaving, he says, will scent a whole room. The old ferryman glances over and mutters that he saw real aloeswood once, on a temple altar, and it didn’t look like that."

[outing_steps."map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_revisit"]
"name" = "Scale and bucket"
"text" = "The next night you go back with a small balance, or with a friend who can haggle. Real aloeswood is so dense with resin that it sinks. This block balances evenly against a piece of pine the same size, and in the water bucket it bobs and spins. A few more questions and the stranger lets it slip: it’s pine soaked in oil."

[outing_steps."map_japanese_home:outing_japanese_home_market:outing_japanese_home_market_solve"]
"name" = "Aloeswood that floats"
"text" = "The ferryman nails the block to a post at the landing and writes beneath it: “Aloeswood from the southern seas. Floats.” The stranger takes the last ferry out that night, and the landing laughs about it for days."

[outing_steps."map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_first"]
"name" = "A chafed mooring line"
"text" = "Fishing boats lie belly-up on the sand while a boatwright packs their seams with cypress bark. Out in the shallows a skiff’s mooring line is worn down to a few strands, and the children are shouting about which knot to tie. When the tide comes in, the skiff will go with it."

[outing_steps."map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_revisit"]
"name" = "Splicing"
"text" = "The next day you come back with a sailmaker’s palm, or with a friend who knows rigging. Cut out the worn section, weave the strands back together one by one, and wrap the splice in old hemp cloth. The quarreling children fall quiet and crouch to watch."

[outing_steps."map_japanese_home:outing_japanese_home_shore:outing_japanese_home_shore_solve"]
"name" = "Hauled ashore"
"text" = "Before the tide turns, everyone hauls the skiff up the beach and ties it to an old pine. The owner comes back, runs a thumb over the splice, asks who taught you—and before you can answer, goes off to fetch a string of dried bonito."

[outing_steps."map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_first"]
"name" = "The man by the Jizō"
"text" = "Halfway up the temple path stands a stone Jizō, and a man squatting beside it says the temple has a new rule: everyone who passes pays incense money. There are travelers ahead and behind, and nobody wants to take him on alone."

[outing_steps."map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_revisit"]
"name" = "Reading the moon"
"text" = "The next time, you bring a kamal board, or a friend who reads the tides. Measure how many fingers the moon stands above the sea and work out when the tide will ebb—at low water a path opens along the foot of the cliffs behind the temple, well clear of the Jizō. Back in the village, you tell one of the monks."

[outing_steps."map_japanese_home:outing_japanese_home_path:outing_japanese_home_path_solve"]
"name" = "Mapping the cliff path"
"text" = "The monk laughs: the temple has never charged a toll. The next day a wooden sign stands beside the Jizō. The cliff path that appears only at low tide goes into your notebook, along with when it can be walked and when it can’t."

[outing_steps."map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_first"]
"name" = "One by the ditch"
"text" = "Behind the temple there is a bed of angelica, but in the ditch beside it grows one plant with finer leaves. The old monk who tends the garden is hard of hearing; when you ask, he just waves a hand: “Same family, same family.” Don’t touch that one yet."

[outing_steps."map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_revisit"]
"name" = "The split root"
"text" = "Next time you bring a pen case, or a friend who knows herbs. Compare leaf, flower head, and root one at a time: angelica’s root is solid, but split the rootstock of the plant in the ditch and it is hollow inside, partitioned like a row of tiny rooms."

[outing_steps."map_japanese_academy:outing_japanese_academy_herbs:outing_japanese_academy_herbs_solve"]
"name" = "Pulling the water hemlock"
"text" = "It’s water hemlock. Mixed in with the angelica and sold to a city apothecary, it would kill someone. This time the old monk hears you. He pulls it up root and all, then plants a bamboo tag beside the bed: “Gather nothing from this ditch.”"

[outing_steps."map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_first"]
"name" = "The ascetic’s grotto"
"text" = "In the hillside outside the city is a shallow cave where, they say, a mountain ascetic once shut himself away. After the rainy season water pools on the floor and the stain on the walls stands higher than a person. A few steps in, it is pitch black but for the dripping."

[outing_steps."map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_revisit"]
"name" = "Two branches"
"text" = "This time you go in with a beeswax candle, or behind a friend who can draw a chart. The cave splits in two. The left branch sinks lower and lower; on a ledge in the right one is a patch of soot, as if someone often lights a lamp there."

[outing_steps."map_japanese_academy:outing_japanese_academy_cave:outing_japanese_academy_cave_solve"]
"name" = "Fudō at the end"
"text" = "The right branch ends at a trickling spring with a small Fudō Myōō carved into the rock, and the flowers before him are fresh. You hand the chart to the temple. They wall off the left branch with stones; no one suggests closing the right."

[outing_steps."map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_first"]
"name" = "Half a poem"
"text" = "All that’s left of a mansion burned in the Ōnin war are the garden steps and a leaning standing stone. Half a waka is carved into it; moss has eaten the rest. The neighbors say a young lady cut it there before she fled the fires."

[outing_steps."map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_revisit"]
"name" = "Under the moss"
"text" = "You return with an ink case, or with a friend who writes a fine hand. Scrape away the moss and take a rubbing: the first half is assured and flowing, but the second is another hand entirely, cut shallow and fast."

[outing_steps."map_japanese_academy:outing_japanese_academy_relic:outing_japanese_academy_relic_solve"]
"name" = "The answering lines"
"text" = "The first half is an old poem from the Kokinshū; someone else finished it and turned it into a poem about waiting for a person who will not come back. No one can say who. You give the rubbing to the old man who keeps the garden, and the stone stays where it stands."

[outing_steps."map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_first"]
"name" = "A “Song edition from across the sea”"
"text" = "At dusk the book stalls around Shijō light their lamps. One seller holds up a “Song edition, brought across the sea,” at a frightening price. The sutra copyist at the next stall glances at the red seal on the first leaf, says nothing, and starts paging through his own ledger."

[outing_steps."map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_revisit"]
"name" = "Weighing the paper"
"text" = "A night later you go back with a small balance up your sleeve, or with a friend who can talk to anyone. Song printers used thin paper, and a stack should weigh far less; this one is heavy local mulberry paper—a Japanese recut of a Song original. Your friend chats with the seller long enough to learn the book came out of a court family’s library that was looted."

[outing_steps."map_japanese_academy:outing_japanese_academy_market:outing_japanese_academy_market_solve"]
"name" = "Home to its shelf"
"text" = "The copyist’s ledger has the seal: a court family in the upper city too poor to mend its own roof. The book is bought back, the seller makes nothing on it, and you receive a thank-you note in an exquisite hand."

[outing_steps."map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_first"]
"name" = "A fraying ferry rope"
"text" = "A summer flood took the wooden bridge, so a rope has been strung across the Kamo shallows and the ferry hauls itself along it. Where the rope rubs a sharp rock it has frayed badly. The ferryman says it’ll hold a few more days. The boys catching sweetfish along the bank don’t think so."

[outing_steps."map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_revisit"]
"name" = "Splicing the ferry rope"
"text" = "You go back to the river with a sailmaker’s palm, or with a friend who knows rope. Splice the frayed stretch and wrap old hemp cloth around the side that touches the rock. The next time the ferry crosses, the rope stops creaking."

[outing_steps."map_japanese_academy:outing_japanese_academy_shore:outing_japanese_academy_shore_solve"]
"name" = "A steady crossing"
"text" = "The ferryman reties the rope at an angle where the rock can’t reach it. From now on, he says, you ride free. In the capital, that’s worth more than thanks."

[outing_steps."map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_first"]
"name" = "A pole across the road"
"text" = "On the Kitayama pilgrim road, someone has laid a bamboo pole across the way and calls it a new toll barrier set by the temple: ten coins to pass. But the old woman selling penny-a-cup tea at the foot of the road has never mentioned any barrier. There are other pilgrims about; don’t take him on by yourself."

[outing_steps."map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_revisit"]
"name" = "Waiting for the stars"
"text" = "You go up the road again with a kamal board, or with a friend who reads the sky. When the first stars come out, take a sighting on the pole star and loop back to the city through a valley with houses in it. Then you tell the tea woman about the pole."

[outing_steps."map_japanese_academy:outing_japanese_academy_path:outing_japanese_academy_path_solve"]
"name" = "The way home, written down"
"text" = "The tea woman starts cursing at once: that’s a layabout from down the hill, borrowing the temple’s name. The next day the pole is gone. The valley path goes into your notebook, down to which old cedar to turn at."

[outing_steps."map_northern_home:outing_northern_home_herbs:outing_northern_home_herbs_first"]
"name" = "A waist-high elder"
"text" = "The willows on the embankment are cut back every year, and at their feet spreads a drift of white flower heads. The neighbor woman calls it elder and says no cough syrup is complete without it. But this clump comes only to your waist, and a crushed leaf gives off a smell like a goat pen. Leave it be for now."

[outing_steps."map_northern_home:outing_northern_home_herbs:outing_northern_home_herbs_revisit"]
"name" = "Wood or weed"
"text" = "The next day you go back with a pen case, or with a friend who knows herbs. True elder has a woody stem with a soft white pith and five or seven leaflets to a leaf. This clump has a green stem that dies back every winter, nine or eleven leaflets in tidy rows, and flower heads tinged with pink."

[outing_steps."map_northern_home:outing_northern_home_herbs:outing_northern_home_herbs_solve"]
"name" = "Dwarf elder"
"text" = "It is dwarf elder, and its berries will clean a person out entirely. You show the drawing to the old woman, who slaps her thigh: so that was why every child who drank her syrup last year went running for the privy. A ring of sharpened willow stakes goes up around the clump."

[outing_steps."map_northern_home:outing_northern_home_cave:outing_northern_home_cave_first"]
"name" = "A hum in the kiln’s belly"
"text" = "The brick kiln on the river flats has stood idle for years, its arched tunnel half drowned in rainwater, the water line on its walls higher than a child’s head. When the wind crosses it, the kiln hums, like someone talking into an empty jar."

[outing_steps."map_northern_home:outing_northern_home_cave:outing_northern_home_cave_revisit"]
"name" = "A row of flues"
"text" = "This time you carry a beeswax candle, or let a friend who can draw a chart go first. The flame leans steadily inward and shows a half-collapsed ledge with a neat row of flue holes behind it. You chart the kiln as far as the ledge and draw a charcoal line along the wall wherever the water has reached."

[outing_steps."map_northern_home:outing_northern_home_cave:outing_northern_home_cave_solve"]
"name" = "The chimney’s voice"
"text" = "The hum is wind funneling down the chimney and swirling through the flues. You give the chart to the brickmaker by the river. He studies the ledge and says the ground behind it stays dry all summer and would hold peat nicely, but after heavy rain nobody sets a foot past the mouth. The children keep coming all the same, to shout into the entrance and listen to the kiln hum back."

[outing_steps."map_northern_home:outing_northern_home_relic:outing_northern_home_relic_first"]
"name" = "Words on the lintel"
"text" = "The sluice was given up long ago; the water runs through a newer cut beside it. Moss has eaten most of the line carved into the stone lintel, leaving only “…west wind rises…” The village says it is a curse from the men who drowned building the sluice: go near the gate on a west-wind day and your house will suffer."

[outing_steps."map_northern_home:outing_northern_home_relic:outing_northern_home_relic_revisit"]
"name" = "The whole line under the moss"
"text" = "You go back with an ink case, or with a friend who writes a good hand. Brush off the moss, lay damp paper over the stone, and pat it down with a dabber. The letters run deeper and farther than you guessed: a whole line, with the mason’s hammer mark at its end, and the tone is curt, more like orders than a curse."

[outing_steps."map_northern_home:outing_northern_home_relic:outing_northern_home_relic_solve"]
"name" = "The gatekeeper’s rule"
"text" = "The whole line reads: “When the west wind rises, shut this gate; when the wind drops and the water falls, open it.” No curse, only the builder’s rule for the gatekeeper: a west wind shoves the sea up the river mouth, and a gate left open lets salt water into the fields. You give the rubbing to the man who minds the new sluice. He copies the line onto a plank and nails it to his own gatepost; the old stone stays where it is, free to grow all the moss it likes."

[outing_steps."map_northern_home:outing_northern_home_market:outing_northern_home_market_first"]
"name" = "Amber fished from the sea"
"text" = "At dusk the riverbank lights its lanterns, and herring sellers, linen sellers, and beer sellers shout over one another. One stall hangs a necklace of amber beads, fished out of the Baltic after a storm, the seller swears, at a price that makes you flinch. The scrivener at the next table, who writes letters for hire, glances over and opens his ledger."

[outing_steps."map_northern_home:outing_northern_home_market:outing_northern_home_market_revisit"]
"name" = "The weight of the necklace"
"text" = "The next evening you return with a small balance, or with a friend who can haggle. On the scale the necklace weighs exactly what the scrivener’s ledger records. A few more questions, from you or from your friend, and the seller’s Baltic storm stops adding up; he lets slip that the necklace came out of nothing grander than a pawnshop’s back door."

[outing_steps."map_northern_home:outing_northern_home_market:outing_northern_home_market_solve"]
"name" = "The necklace goes home"
"text" = "The scrivener finds the page: the necklace belongs to a dockside widow who pledged it to pay for her husband’s funeral, and a pawnshop boy sold it out the back door before her time was up. When the amber comes back into her hand, she holds it closed in her palm for a long while. The seller loses what he paid for it, gets nothing for his trouble, and never mentions Baltic storms again."

[outing_steps."map_northern_home:outing_northern_home_shore:outing_northern_home_shore_first"]
"name" = "A line after the thaw"
"text" = "The river has only just thawed, and floes still drift down in ones and twos. On the dike the towing horses blow and rest, and in the inlet a little flat-bottomed boat’s mooring line is chafed to a skin where it passes the stake. The children ashore argue, red in the face, over which knot to tie. When the next big floe arrives, the boat will be gone."

[outing_steps."map_northern_home:outing_northern_home_shore:outing_northern_home_shore_revisit"]
"name" = "An eye splice"
"text" = "The next day you return with a sailmaker’s palm, or with a friend who knows rope. Cut away the chafed stretch, unlay the end into three strands, and tuck them back into the line one by one, rapping each tuck tight with a mallet. Floes knock hollowly against the stake, one after another, and you never look up. What you end with is a plump eye wrapped in tarred twine, dropped over the post."

[outing_steps."map_northern_home:outing_northern_home_shore:outing_northern_home_shore_solve"]
"name" = "Not even the horse"
"text" = "Before the floes can jam the mouth of the inlet, everyone hauls the boat ashore, rolls it onto logs, and ties it to an old willow stump. The owner, an eel-trap mender, hitches the line to the towing horse and makes it lean back hard against the rope. The eye does not budge. He pats the horse’s neck and nods at you."

[outing_steps."map_northern_home:outing_northern_home_path:outing_northern_home_path_first"]
"name" = "A man at the foot of the slope"
"text" = "The village’s bell tower stands on a mound, and the shortcut home runs up its back slope. Today a stranger sits at the foot of it, saying the church has set a new “bell-ringing fee”: two small coins a head to go up. Nobody has ever paid anything on this path, but people coming home from market are strung out ahead and behind, and none of them wants to be the first to argue."

[outing_steps."map_northern_home:outing_northern_home_path:outing_northern_home_path_revisit"]
"name" = "By the pole star"
"text" = "You come back with a kamal board, or with a friend who reads sky and water. When dusk falls, take a sighting on the pole star from the field bank beside the mound: home lies due north of the tower. Follow the crooked willows along the banks, skirt the ditch, and you are in the village without ever passing the man. Go straight to the sexton who rings the bells."

[outing_steps."map_northern_home:outing_northern_home_path:outing_northern_home_path_solve"]
"name" = "The path along the banks"
"text" = "The sexton shakes his head: the parish pays for its own bells, and there is no such fee. The next day two farmers with spades stand at the foot of the slope, and the man has vanished. The path along the field banks goes into your notebook, with which willow to turn at and which ditch is easy to cross only once it freezes."

[outing_steps."map_northern_academy:outing_northern_academy_herbs:outing_northern_academy_herbs_first"]
"name" = "The spring green soup"
"text" = "Spring has come, and the school cook sends the apprentices into the linden grove to cut wild garlic for the first green soup. A carpet of leaves lies under the trees, but one patch has broad leaves that rise in pairs from the root, clasping the stem, with a string of tiny white bells beside them. The cook plants her fists on her hips: “Cut the wrong one and it’s on you.”"

[outing_steps."map_northern_academy:outing_northern_academy_herbs:outing_northern_academy_herbs_revisit"]
"name" = "Let the nose decide"
"text" = "After lessons you go back with a pen case, or with a friend who can tell one herb from another. Crush one leaf from each patch. One reeks of garlic enough to make you wince, each leaf on its own stalk. The other has no smell at all, its two leaves wrapped around each other and rising from a single stem."

[outing_steps."map_northern_academy:outing_northern_academy_herbs:outing_northern_academy_herbs_solve"]
"name" = "Not in the soup"
"text" = "The one that smells of garlic is wild garlic. The scentless pair is lily of the valley, which makes the heart race and the lips turn blue. Your basket makes the cleanest pot of soup of the year, and the cook thrusts the first bowl into your hands: “At last, somebody in this school who uses a nose.”"

[outing_steps."map_northern_academy:outing_northern_academy_cave:outing_northern_academy_cave_first"]
"name" = "Barrels rolling underground"
"text" = "The cellar of an old warehouse beside the school has stood empty for years, with a damp line higher than a person’s knee. Passing at night, you can hear a muffled rumble inside, like barrels rolling. Your classmates swear it’s the cooper who drowned there, still moving stock."

[outing_steps."map_northern_academy:outing_northern_academy_cave:outing_northern_academy_cave_revisit"]
"name" = "Arches and an iron grate"
"text" = "This time you go down with a beeswax candle, or behind a friend who can draw a chart. The flame leans toward the far end in gusts, lighting a row of brick arches and a stone sill above ankle height. Beyond the sill the floor is wet, and at the foot of the wall a drain opening is covered by a rusted iron grate, with a breath of river smell coming through it."

[outing_steps."map_northern_academy:outing_northern_academy_cave:outing_northern_academy_cave_solve"]
"name" = "The flap at high water"
"text" = "The rolling barrels are only the wooden flap behind the grate, shoved by the water to slap against the brick each time the river rises. You hand the chart in at school, and the steward drives an iron spike into the brick as a mark: once the water passes it, nobody goes down. Nobody mentions the cooper again."

[outing_steps."map_northern_academy:outing_northern_academy_relic:outing_northern_academy_relic_first"]
"name" = "A row of bars at the wall’s foot"
"text" = "Only half a wall is left of the abandoned garden. Set into its foot is a stone scored with a close row of bars and half a line of lettering, of which you can make out “…ell.” The old folks say a giant once measured his height here. But the bars are far too even to be idle scratches."

[outing_steps."map_northern_academy:outing_northern_academy_relic:outing_northern_academy_relic_revisit"]
"name" = "Deep cuts and shallow ones"
"text" = "You return with an ink case, or with a friend who writes a fine hand. Scrape off the dirt and take a rubbing. The bars come in two kinds: deep and evenly spaced, as if cut against a rule, and shallow crooked ones, each beside a letter and a year, cut by children measuring their height."

[outing_steps."map_northern_academy:outing_northern_academy_relic:outing_northern_academy_relic_solve"]
"name" = "The cloth hall’s standard"
"text" = "The missing words complete the line: “This is the true ell.” It was the cloth hall’s standard measure, where a dispute over a bolt of cloth was settled by laying it against this stone. You hand the rubbing to the old man who keeps the garden. He is quiet a while, then points to the lowest shallow mark: “That one’s me.”"

[outing_steps."map_northern_academy:outing_northern_academy_market:outing_northern_academy_market_first"]
"name" = "A Euclid from Venice"
"text" = "The narrow alley behind the bookshops sells books by day and, after dark, whatever comes to hand. One seller holds up a folio Euclid printed in Venice, a Padua professor’s own copy, he says, and he asks a year’s school fees for it. The bookbinder from the next stall passes, rubs his thumb over a patch on the binding’s corner, gives the seller a long look, and walks on without a word."

[outing_steps."map_northern_academy:outing_northern_academy_market:outing_northern_academy_market_revisit"]
"name" = "A few leaves light"
"text" = "The following night you return with a small balance, or with a friend who can talk anyone around. A clean copy of the same edition sits in the bookshop, and set against it on the scale the stall’s volume comes up a few leaves light. Open it and the title leaf has been sliced out in one neat cut, the professor’s ownership stamp gone with it. The seller’s story starts to tangle."

[outing_steps."map_northern_academy:outing_northern_academy_market:outing_northern_academy_market_solve"]
"name" = "The green thread"
"text" = "The binder is fetched and, turning the spine to the lamp, he laughs: the green silk under the corner patch is his own stitching from last winter. The book belongs to a young journeyman at a printing house down the street, who saved two winters to buy it and brought it in for a mended corner; it sat on the binder’s bench waiting to be collected until the seller lifted it. The guild takes the seller’s stall token and bars him from the alley for three months, and the binder, working from memory, draws the missing title leaf anew."

[outing_steps."map_northern_academy:outing_northern_academy_shore:outing_northern_academy_shore_first"]
"name" = "A line on the iron ring"
"text" = "The old landing’s piles have been soaked black by the river. At the iron ring on the end, the school’s ferry skiff is tied by a line worn to a few strands where it bends around the iron. The wind will turn by evening and the water will rise, but the old ferryman crossed over at dawn and has not come back. The porter is blocking a pupil who means to row himself across, the two of them red in the face, and neither has looked down at the line."

[outing_steps."map_northern_academy:outing_northern_academy_shore:outing_northern_academy_shore_revisit"]
"name" = "A jacket of old leather"
"text" = "A day later you return with a sailmaker’s palm, or with a friend who has handled plenty of rope. Cut out the worn stretch, splice it, and sew a jacket of old cowhide where the line bends around the ring. The porter has hauled in yesterday’s would-be oarsman and set him to passing you needle and thread, and he does it more earnestly than anyone."

[outing_steps."map_northern_academy:outing_northern_academy_shore:outing_northern_academy_shore_solve"]
"name" = "A notch in the post"
"text" = "The wind does turn at dusk, and the river climbs over the two lowest steps, but the skiff only sways a little. The old ferryman comes back and scolds the porter and the pupil together. Then he cuts a notch for you in one of the landing’s posts with his knife. Everyone who has ever helped at this landing has one."

[outing_steps."map_northern_academy:outing_northern_academy_path:outing_northern_academy_path_first"]
"name" = "A man on the causeway"
"text" = "Outside the town stands a small chapel with an old altarpiece, and on Sundays the farm women walk in for the service. The causeway to the door runs between flooded ditches, one person wide, and today a man planted in the middle of it calls himself the sexton’s helper and says you must pay “candle money” to pass. Dark cloud is piling up in the west, the old people and children are anxious to get inside before the rain, and two old women are already fishing out coins."

[outing_steps."map_northern_academy:outing_northern_academy_path:outing_northern_academy_path_revisit"]
"name" = "While the water falls"
"text" = "You return with a kamal board, or with a friend who knows how the river rises and falls. Measure how high the moon stands and work out when the river will be lowest. As the water drops, a path of broken brick appears on the bank behind the chapel, leading around to the side door."

[outing_steps."map_northern_academy:outing_northern_academy_path:outing_northern_academy_path_solve"]
"name" = "The brick path"
"text" = "The sexton hears you out, sets his candle back in its stick, and calls over the farm boy splitting wood by the door, murmuring a few words. The boy shoulders his axe and plants himself on the causeway, and the man takes one look at the axe and turns away. The chapel’s candles are paid for by the parish women in turn. The broken-brick path goes into your notebook: it can be walked for an hour after the water falls, and not a minute longer."

[outing_steps."map_iberian_home:outing_iberian_home_herbs:outing_iberian_home_herbs_first"]
"name" = "The “bay” by the path"
"text" = "It is olive harvest, nets spread under the trees and mules plodding down the track with full baskets. Along the path grows a row of glossy shrubs that all look like bay, and the old woman next door always pinches a few leaves for her fish stew. But on some of them the leaves are long and narrow, set three to a whorl around the branch, and snapping a stalk releases no scent at all. Leave them alone for now."

[outing_steps."map_iberian_home:outing_iberian_home_herbs:outing_iberian_home_herbs_revisit"]
"name" = "Scent and sap"
"text" = "You go back with a pen case, or an herb-wise friend. Crush a leaf from each. Real bay fills your hands with a sharp, spicy smell, but the other has almost no scent, and the broken stalk weeps a drop of white sap that leaves your fingertip faintly numb. Anyone who knows plants will tell you that sap on the mouth numbs the lips for hours."

[outing_steps."map_iberian_home:outing_iberian_home_herbs:outing_iberian_home_herbs_solve"]
"name" = "Oleander"
"text" = "The scentless one with the white sap is oleander. Old people say a man once skewered meat on its twigs to roast, and his whole family lay in bed for three days. The old woman turns over every leaf in the bunch by her stove, then drags you through the grove to learn them, and won’t put a leaf in the pot until you have."

[outing_steps."map_iberian_home:outing_iberian_home_cave:outing_iberian_home_cave_first"]
"name" = "The Moorish girl’s horn"
"text" = "A cave under the cliff shows its mouth only at the lowest tides, and the water line on its walls is higher than a head. On the rising tide a long hollow note comes out of it, like someone blowing a conch. The fishing village’s children call it the Moorish girl’s horn and say an enchanted girl is trapped inside; not one of them dares go in."

[outing_steps."map_iberian_home:outing_iberian_home_cave:outing_iberian_home_cave_revisit"]
"name" = "The slit overhead"
"text" = "This time you go in with a beeswax candle, or following a friend who can draw a chart. The flame leans toward the roof, where a narrow slit has worn the rock glassy; underfoot a ledge bars the way, and the low ground beyond it fills first on the flood. You chart the cave as far as the ledge and mark the spot beneath the slit."

[outing_steps."map_iberian_home:outing_iberian_home_cave:outing_iberian_home_cave_solve"]
"name" = "The slit that blows"
"text" = "On the flood the water shoves the air in the cave up through that slit, and what comes out is the horn. You give the chart to the net-mending woman, who says only this: once the water covers the second rock at the mouth, not a step inside. As for the girl, the children no longer fear her; they squat on the rocks and bet shells on when the next blast will come, and the loser mends the winner’s net."

[outing_steps."map_iberian_home:outing_iberian_home_relic:outing_iberian_home_relic_first"]
"name" = "The “spell” at the tower’s foot"
"text" = "On a headland stands the old lookout tower, its top long since fallen in. A stone by the door bears half a line of curling script that is not Latin. The village says it is a curse left by the Moors when they buried their treasure: dig beneath the tower and you turn to stone. Several spots at the foot of the wall have indeed been torn up by pickaxes."

[outing_steps."map_iberian_home:outing_iberian_home_relic:outing_iberian_home_relic_revisit"]
"name" = "Carved and dug"
"text" = "You climb again with an ink case, or with a friend with a fine hand. Take the script down stroke by stroke: the deep cuts are tidy, the work of the stonemason, while the shallow ones beside them are pickaxe tips and children’s pebbles and have nothing to do with it. Fill in the worn strokes along the grooves and the half line slowly comes clear."

[outing_steps."map_iberian_home:outing_iberian_home_relic:outing_iberian_home_relic_solve"]
"name" = "Keeping watch for fishermen"
"text" = "The mason’s whole line reads: “Finished on St. Peter’s Day. This tower keeps watch for the fishermen.” No curse, no treasure, only a tower that stayed awake for people asleep. You give the rubbing to the village priest, the children fill in the holes at the wall’s foot, and wild mint comes up beneath the tower again."

[outing_steps."map_iberian_home:outing_iberian_home_market:outing_iberian_home_market_first"]
"name" = "Half a sack of cochineal"
"text" = "The market under the bridge is loud from dawn to dark, with salt-fish sellers, potters, and secondhand-boot dealers all jammed together. One stall shows half a sack of dark red grains. Cochineal from New Spain, the seller murmurs, which dyers fight over, and he’s asking only half the usual price. A dyer’s boy lays a pinch of his own shop’s cochineal on a kerchief beside the stall’s, holds the two up to the light, whistles through his teeth, and bolts for the far end of the bridge, forgetting the kerchief."

[outing_steps."map_iberian_home:outing_iberian_home_market:outing_iberian_home_market_revisit"]
"name" = "A fifth too heavy"
"text" = "The following evening you come back with a small balance, or with a friend good at beating down prices. The boy’s forgotten pinch gives you a standard to measure against: a pinch of the same size from the sack weighs nearly a fifth more, and rolling the grains between your fingers turns up something hard. The mouth of the sack has been unpicked and sewn up again, with a scrap of red thread still caught in the seam. The seller’s patter gets faster and faster."

[outing_steps."map_iberian_home:outing_iberian_home_market:outing_iberian_home_market_solve"]
"name" = "The dyer knows his goods"
"text" = "The boy comes panting back with his master. The dyer knows the red thread at the sack’s mouth at a glance, crushes a grain, and his fingertip turns deep red: his own goods, gone missing off a cart two days ago. Once the shot is sifted out, the sack is a third short. The seller pays up, and the dyer gives you a scrap of cloth he has just dyed."

[outing_steps."map_iberian_home:outing_iberian_home_shore:outing_iberian_home_shore_first"]
"name" = "The hauling line on the ways"
"text" = "The slipway runs slantwise into the water, and the air is thick with pitch, wood shavings, and oakum. A skiff is being winched up the ways, its hauling line chafed to a few strands on a burr at the block. The grown-ups are all far off hammering planks. Only a new apprentice minds the winch; he has seen the damage and doesn’t dare say so, and keeps turning the handle slowly, eyes fixed on the block."

[outing_steps."map_iberian_home:outing_iberian_home_shore:outing_iberian_home_shore_revisit"]
"name" = "A long splice"
"text" = "You return with a sailmaker’s palm on your hand, or with a friend who has seen a lot of rigging. Cut out the damaged length and weave the strands of the two ends through each other one by one, making a long splice that stays as thick as the rope around it; then bind it in pitch-soaked twine so it will take the water and still run through the block."

[outing_steps."map_iberian_home:outing_iberian_home_shore:outing_iberian_home_shore_solve"]
"name" = "Up the ways"
"text" = "The skiff creeps up the ways an inch at a time, and the splice slides through the block without catching. The head shipwright stops hammering, weighs the rope in his hand, and writes on the transom in charcoal: “New splice. Leave it.”"

[outing_steps."map_iberian_home:outing_iberian_home_path:outing_iberian_home_path_first"]
"name" = "The tin box on the path"
"text" = "The hillside chapel keeps an old oak Madonna, and in summer people climb up from all around to keep their vows. At a bend where the path squeezes down to a single person’s width, a young man squats with a tin box, collecting a “road levy” for the chapel’s lamp. Those who don’t pay, he says, won’t get the Madonna’s protection on the way down. A line of people carrying offerings has backed up behind him, none of them willing to miss the hour of their vow, and a few are already fumbling for their purses."

[outing_steps."map_iberian_home:outing_iberian_home_path:outing_iberian_home_path_revisit"]
"name" = "Up along the stone wall"
"text" = "You go up again with a kamal board, or with a friend who knows stars and tides. As the light fades, work out the pole star’s height, find the shepherds’ track on the far side of the ridge, and feel your way up along the dry-stone wall without passing the young man. At the chapel door, you go and tell the old hermit."

[outing_steps."map_iberian_home:outing_iberian_home_path:outing_iberian_home_path_solve"]
"name" = "The shepherds’ wall"
"text" = "The old hermit listens, walks down the hill leaning on his stick, and takes the tin box out of the young man’s hands. It is his own nephew. He doesn’t shout; he simply raps the boy three times on the backside with his stick in front of half the hillside. The shepherds’ track goes into your notebook, with which stretch of wall to follow and at which boundary stone to turn downhill."

[outing_steps."map_iberian_academy:outing_iberian_academy_herbs:outing_iberian_academy_herbs_first"]
"name" = "Two clumps of tongues"
"text" = "At the edge of the wood beyond the herb garden, the master has sent the pupils to gather comfrey to pound into a poultice for a classmate’s broken arm. Two clumps grow there, equally broad-leaved, both like long green tongues, though one looks a shade grayer. The master stands with his hands behind his back and his eyes on yours."

[outing_steps."map_iberian_academy:outing_iberian_academy_herbs:outing_iberian_academy_herbs_revisit"]
"name" = "Rub the leaves"
"text" = "After class you go back with a pen case, or with a friend who can name plants on sight. Rub a leaf from each clump: one is rough as a cat’s tongue, its stalk running down the stem in a narrow wing; the other is soft as a hare’s ear, white-fuzzed underneath, with rounded little teeth along the edge."

[outing_steps."map_iberian_academy:outing_iberian_academy_herbs:outing_iberian_academy_herbs_solve"]
"name" = "Thimble flower"
"text" = "The soft one is foxglove, which the Portuguese call “thimble flower,” bearing purple bells next year, and eating it sets the heart pounding like a drum. The rough one is the bone-knitting comfrey. The hurt classmate gets the poultice, and the master pins your two drawings side by side on the garden door, with a single word beneath: “Touch.”"

[outing_steps."map_iberian_academy:outing_iberian_academy_cave:outing_iberian_academy_cave_first"]
"name" = "A bell underground"
"text" = "At the foot of the hill behind the school, a limestone cave mouth hangs with ferns, and inside, a green line of moss crawls along the wall. After every rain a bell sounds from within, one stroke after a long wait: dong… dong. The people down in the valley say a buried church is ringing."

[outing_steps."map_iberian_academy:outing_iberian_academy_cave:outing_iberian_academy_cave_revisit"]
"name" = "The cave breathes"
"text" = "This time you take a beeswax candle, or bring a friend who can draw a chart. The flame leans in, then out, as if the cave were breathing. Farther on, a row of gray-white stone columns hangs from the roof, and past a ledge at the back, in the dark, a single drop falls: dong."

[outing_steps."map_iberian_academy:outing_iberian_academy_cave:outing_iberian_academy_cave_solve"]
"name" = "A bell made of stone"
"text" = "The bell is water dripping from the roof onto a hollow stalagmite, and no two of them ring alike. The chart goes back to school, where the master flicks the loudest column with a fingernail: “No church down there, but it keeps better pitch than ours.” After that, whenever it rains, some pupil slips away to listen."

[outing_steps."map_iberian_academy:outing_iberian_academy_relic:outing_iberian_academy_relic_first"]
"name" = "The drowned bride"
"text" = "A great breach has opened in the old embankment, and water spills out to make a reed marsh. Set among the dike stones beside it is an oblong slab with half a line of lettering, mostly caked in mud. The families nearby say it is the grave marker of a bride drowned at the breach, and on full-moon nights you can hear her combing her hair."

[outing_steps."map_iberian_academy:outing_iberian_academy_relic:outing_iberian_academy_relic_revisit"]
"name" = "Letters under mud"
"text" = "You come back with an ink case, or with a friend who writes a neat, even hand. Scrape off the mud, lay damp paper over the slab, and take a rubbing. The letters are old Latin capitals, cut steadily one by one; the crooked shallow scratches around the break were added later by visitors and children."

[outing_steps."map_iberian_academy:outing_iberian_academy_relic:outing_iberian_academy_relic_solve"]
"name" = "Sixty years"
"text" = "You take the rubbing to a master at the school who reads the old letters, and he reads it out: “To my dearest wife, who lived sixty years. May the earth lie lightly on her.” No bride, no drowning, only a man who set up a stone for the wife he grew old with. The rubbing goes up on the school wall, and when the grandmothers of the neighborhood hear of it, several reach for their handkerchiefs."

[outing_steps."map_iberian_academy:outing_iberian_academy_market:outing_iberian_academy_market_first"]
"name" = "Old leaves sold by the pound"
"text" = "Oil lamps burn along the evening bookstalls, where the seller weighs out loose old pages by the pound for people who want to wrap fish or sweets. In the pile of scrap, a parchment leaf painted with herbs shows through, its red and blue ink still bright. The seller rests one hand on the scale pan and, with the other, nudges the weight outward."

[outing_steps."map_iberian_academy:outing_iberian_academy_market:outing_iberian_academy_market_revisit"]
"name" = "Wax under the pan"
"text" = "The next night you return with your own small balance, or with a friend who has the gift of the gab. His scale reads a full pound, but on your balance the same pile comes to only thirteen of the sixteen ounces, a full three short; when you turn his pan over, there is a lump of wax stuck underneath. Cornered, he hands over the pile at honest weight."

[outing_steps."map_iberian_academy:outing_iberian_academy_market:outing_iberian_academy_market_solve"]
"name" = "The herbal goes to school"
"text" = "Back at school, one of the old masters turns the leaves over for a long while and says they belong to an Arabic herbal copied two hundred years ago, with plants of the Mediterranean shore. That same evening he buys the whole crate off the stall and has the pupils tuck the pages into new books one by one, with orders that not one is ever to wrap a fish again."

[outing_steps."map_iberian_academy:outing_iberian_academy_shore:outing_iberian_academy_shore_first"]
"name" = "A short line before the tide"
"text" = "Numbers are cut into the steps, one by one, for old pilots to measure the tide by. A small fishing boat is tied at the lowest step on a short line, taut as a bowstring. Today is a spring tide, and none of the children playing nearby sees anything wrong; only the old man drying nets on the steps keeps shaking his head."

[outing_steps."map_iberian_academy:outing_iberian_academy_shore:outing_iberian_academy_shore_revisit"]
"name" = "Longer, and a running loop"
"text" = "The next day you bring a sailmaker’s palm, or a friend who can work rope. Count how many steps the water will climb today and let the line out far enough for the boat to float up with it; rig the end as a running loop on the iron ring, and wrap the stretch that chafes with scraps of old leather."

[outing_steps."map_iberian_academy:outing_iberian_academy_shore:outing_iberian_academy_shore_solve"]
"name" = "A boat among the numbers"
"text" = "As the spring tide surges up, the boat rises inch by inch with it, the line sliding on the ring and never going taut. The old net-drier raps the seventh step with his stick: “That’s how the old pilots taught their apprentices.” Then he shows you the marks on the stone: which is the spring-equinox flood, which the autumn’s."

[outing_steps."map_iberian_academy:outing_iberian_academy_path:outing_iberian_academy_path_first"]
"name" = "A hand in the basket"
"text" = "A small chapel with an old well stands on top of the vineyard slope. At harvest, families carry baskets up and down the path. Today a man at the junction calls himself the tithe collector and reaches into each basket for a handful of purple grapes, the chapel’s share, he says. A basket is a day’s work, and nobody wants to give it away."

[outing_steps."map_iberian_academy:outing_iberian_academy_path:outing_iberian_academy_path_revisit"]
"name" = "Stakes in the salt marsh"
"text" = "Back you go with a kamal board, or with a friend who reads the tide. Measure how high the moon has climbed to work out when the estuary will ebb: as the water goes out, a row of timber stakes shows in the salt marsh below the slope, an old path laid by someone long ago that runs straight to the river ferry, nowhere near the man at the junction. At the bottom you go and tell the parish priest."

[outing_steps."map_iberian_academy:outing_iberian_academy_path:outing_iberian_academy_path_solve"]
"name" = "The stake path"
"text" = "The priest hears you out and does nothing more than write a line in the parish book, which he reads aloud before the whole congregation on Sunday: the chapel never takes anything on the harvest path, and the tithe is collected by the parish after the season. The man at the junction is never seen again. The stake path through the marsh goes into your notebook: walkable for an hour and a half after the ebb, with a note of which stakes have worked loose."

[outing_steps."map_italian_home:outing_italian_home_herbs:outing_italian_home_herbs_first"]
"name" = "Fennel by the ditch"
"text" = "Beside the drainage ditch behind the dike grows a feathery clump much like the wild fennel the kitchen stuffs into fish. But its stalk is spattered with purple, and a crushed leaf smells like a mouse’s nest. Don’t pick it yet."

[outing_steps."map_italian_home:outing_italian_home_herbs:outing_italian_home_herbs_revisit"]
"name" = "A handful from the hearth"
"text" = "The next evening you come back with a pen case in your coat, or with a friend who knows herbs beside you. You have brought a handful of real fennel from the kitchen hearth, and you lay it beside the ditch plant and draw the two, stalk by stalk. Real fennel has a green, ridged stalk and smells of anise candy; the ditch plant’s stalk is smooth, without a single ridge, flecked with purple as if someone had flicked a wet pen at it."

[outing_steps."map_italian_home:outing_italian_home_herbs:outing_italian_home_herbs_solve"]
"name" = "Hemlock"
"text" = "It’s hemlock, the very thing the Athenians gave Socrates to drink. The island’s old apothecary studies your drawing, digs the plant out root and all with an iron spade, seals it in a clay jar, and has it rowed out to open water and tipped in. The kitchen’s fish get only the real fennel from the hearth now."

[outing_steps."map_italian_home:outing_italian_home_cave:outing_italian_home_cave_first"]
"name" = "A moan from the hearth"
"text" = "At the edge of the island stands an old furnace house with half its roof burned in. High tides flood the hearth and have left a white ring of salt crust on the brick, climbing almost to the rafters. Inside it is black, and every so often a low ooo—ooo comes out, like someone humming, while cold air seeps through the cracks in the brick."

[outing_steps."map_italian_home:outing_italian_home_cave:outing_italian_home_cave_revisit"]
"name" = "Glass drips in the candlelight"
"text" = "This time you go in with a lit beeswax candle, or behind a friend who can draw a chart. The light picks out cooled drips of glass clinging to the hearth wall, blue and green like strings of stars. Behind the hearth is a chest-high brick ledge, and past it a flue slants up into the dark. You map the first stretch before the tide turns."

[outing_steps."map_italian_home:outing_italian_home_cave:outing_italian_home_cave_solve"]
"name" = "The song of the flue"
"text" = "The flue climbs to the broken chimney at the island’s edge, and the wind pouring into it is the moan you heard. You take the chart home to your father, who studies it for a long while and says this was a furnace of his forefathers, where he sneaked in as a boy to blow his first lopsided bottle. The hearth mouth is bricked up halfway, and the other half left open."

[outing_steps."map_italian_home:outing_italian_home_relic:outing_italian_home_relic_first"]
"name" = "Half a line and a row of bars"
"text" = "On a mud island by the channel stands the brick stump of a lighthouse, crusted with barnacles and weed. Half a line of Latin is cut into its foundation stone, and beside it a row of little bars. The old islanders say a hermit once lit a lamp here to guide boats, but the bars look less like praise than like bookkeeping."

[outing_steps."map_italian_home:outing_italian_home_relic:outing_italian_home_relic_revisit"]
"name" = "Scraping off the barnacles"
"text" = "Two days later, at low tide, you cross to the mud island with an ink case, or with a friend who writes a careful hand. Scrape off the barnacles, wet the paper, and take a rubbing: beside every bar is a Roman numeral, some deep and some shallow, plainly added in different years by different hands."

[outing_steps."map_italian_home:outing_italian_home_relic:outing_italian_home_relic_solve"]
"name" = "The flood ledger"
"text" = "The bars and numerals add up: each bar is a flood, and the numeral beside it is how high the water climbed the stone that year—the whole foundation is a ledger of high water kept by generations of island families. The half line of Latin is only the mark of the mason who laid the stump. The old islander listens, then still insists the hermit left it. The accounts matter less to him than the better story."

[outing_steps."map_italian_home:outing_italian_home_market:outing_italian_home_market_first"]
"name" = "“Good ash from Syria”"
"text" = "The dusk market sprawls along the canal: bead sellers, goblet sellers, and ash sellers shoulder to shoulder. A stranger guards a few sacks and calls out “good ash from Syria,” fixed price. It’s the same ash your family’s furnace melts down, but his sacks feel wrong in the hand—too heavy."

[outing_steps."map_italian_home:outing_italian_home_market:outing_italian_home_market_revisit"]
"name" = "The same measuring cup"
"text" = "You go back the next evening with a small balance up your sleeve, or with a friend who can talk anyone around. Fill the little cup your family measures ash with and set it on the pan: a cupful of his weighs far more than the real stuff. You say nothing and calmly turn the balance toward his sacks. Sweat breaks out on his forehead, his explanations tangle, and he mutters it out himself: Lido sand, half and half."

[outing_steps."map_italian_home:outing_italian_home_market:outing_italian_home_market_solve"]
"name" = "Ash cut with sand"
"text" = "A warden of the glassmakers’ guild is fetched and tips the sacks onto his own big scale on the spot. The stranger’s stall is shut down, and the sand goes back to the beach. That night your father rubs a pinch of the sample ash between his fingers, turning it under the lamp, and says only: “Next time we buy ash, we weigh first.”"

[outing_steps."map_italian_home:outing_italian_home_shore:outing_italian_home_shore_first"]
"name" = "A chafed mooring line"
"text" = "As the tide goes out, the lagoon shallows bare a field of black mooring poles. A flat-bottomed skiff’s line is looped around one of them, and the rough bark has chafed it down to two strands. A ring of children squats in the mud, each with a different idea about the knot and none able to convince the others, but when the tide comes the skiff will drift into the channel."

[outing_steps."map_italian_home:outing_italian_home_shore:outing_italian_home_shore_revisit"]
"name" = "Three strands, tucked"
"text" = "A day later, at low water, you return with the sailmaker’s palm on your hand, or with a friend who knows rigging to lend a hand. Cut away the chafed length and tuck the three strands back into one another, hauling each pass tight, then wrap the splice in a scrap of oiled canvas. The children have stopped arguing; they watch with their chins on their knees."

[outing_steps."map_italian_home:outing_italian_home_shore:outing_italian_home_shore_solve"]
"name" = "Hauled up the mud"
"text" = "Before the water reaches the foot of the poles, everyone hauls the skiff across the mud with a chant, and the new line goes three turns around the pole. The owner, an old clam digger, braces a foot against the post and heaves on the splice with both hands. It doesn’t budge. He says the splice’s name in lagoon dialect, and a child promptly tugs his sleeve: teach me."

[outing_steps."map_italian_home:outing_italian_home_path:outing_italian_home_path_first"]
"name" = "The boatman at the landing"
"text" = "At the landing for the friary on the island, a boatman lays his pole across the way and says the path over the shallows is closed; the only way over is his boat, two small coins a head. The landing is packed with people hurrying to Vespers, the bell is nearly due, and some are already reaching for their purses."

[outing_steps."map_italian_home:outing_italian_home_path:outing_italian_home_path_revisit"]
"name" = "Waterlines on the post"
"text" = "Next time you bring a kamal board, or a friend who reads the tides. Old waterlines are cut into the landing posts, each one marking how low a spring ebb has fallen. Count the moon’s age, take its height, and hold the answer up against the post: tonight the water will drop below the lowest mark, and a hard sandbar will show through the shallows, straight to the friary’s back door, with no need for anyone’s boat."

[outing_steps."map_italian_home:outing_italian_home_path:outing_italian_home_path_solve"]
"name" = "The sandbar, written down"
"text" = "The porter friar hears you out and bursts out laughing: the friary has never closed a path, and its own skiff carries people for free once the Vespers bell rings. The boatman is poling somewhere else the next day. You write down in your notebook the hours the sandbar can be walked and the hours it can’t, and the friar leans over to look. Thirty years at that door, he says, and nobody has ever put that road into writing."

[outing_steps."map_italian_academy:outing_italian_academy_herbs:outing_italian_academy_herbs_first"]
"name" = "The row that won’t turn red"
"text" = "The dyers’ back garden is meant to hold two rows of madder, waiting to be dug up and boiled for red cloth. Both rows grow their leaves in whorls of six or seven and look identical, yet the dyer’s wife is worried: cloth boiled from the right-hand row always comes out dull gray-yellow, never red, and she cannot see what has gone wrong."

[outing_steps."map_italian_academy:outing_italian_academy_herbs:outing_italian_academy_herbs_revisit"]
"name" = "A scratch on paper"
"text" = "This time you bring your pen case, or a friend who knows herbs. Draw each row on its own sheet, then scrape a root from each and drag it across paper: one leaves a bright orange-red streak, the other only a gray-white smear. Pinch a leaf and run your hand down a stem, and the right-hand row’s tiny barbs hook the whole of your sleeve."

[outing_steps."map_italian_academy:outing_italian_academy_herbs:outing_italian_academy_herbs_solve"]
"name" = "Madder and the goose’s weed"
"text" = "The right-hand row is cleavers, a weed geese adore, so it is pulled up root and all and carried off to the dyer’s geese. The madder is kept for seed, and your two drawings are pinned beside the dye vat. When the apothecary hears, he turns up to buy madder root; boiled, he says, it helps pass the little stones in the kidneys."

[outing_steps."map_italian_academy:outing_italian_academy_cave:outing_italian_academy_cave_first"]
"name" = "Chiming in the night"
"text" = "Behind the workshop runs a disused annealing tunnel, its brick arch so low you must stoop. At night a thin ting—ting often comes out of it, like a fingernail flicked against a goblet. On the arch wall the stokers have drawn a high-water line in red ochre, chest high, with years scrawled beside it, and a cold draft crawls out along the floor."

[outing_steps."map_italian_academy:outing_italian_academy_cave:outing_italian_academy_cave_revisit"]
"name" = "Counting the arches"
"text" = "On the second visit you carry a beeswax candle, or let a friend who can draw charts lead and count the arches one by one. The flame leans right, toward a small opening in the wall that someone has half bricked up, and the ting—ting is coming from behind it."

[outing_steps."map_italian_academy:outing_italian_academy_cave:outing_italian_academy_cave_solve"]
"name" = "The hanging stems"
"text" = "Squeeze through the gap and you are in a small room full of rejects. From the ceiling dozens of cracked goblet stems hang on wire, knocking together in the draft. Some apprentice years ago must have strung them up for fun. The master hears about it, curses the “little rascal,” and has no one take them down."

[outing_steps."map_italian_academy:outing_italian_academy_relic:outing_italian_academy_relic_first"]
"name" = "The general’s bridge"
"text" = "A new stone bridge now crosses the narrow canal, but the old pier stays in the water: a thick stone column, half submerged, its inscription eaten by moss and salt down to scraps. The boatmen say a Roman general threw a bridge across here in a single night. Yet the letters on the column look, to your eye, like the ones on gravestones."

[outing_steps."map_italian_academy:outing_italian_academy_relic:outing_italian_academy_relic_revisit"]
"name" = "A rubbing at low water"
"text" = "You come back on a day of low water with an ink case under your arm, or with a friend who reads old letters. Scrub the column and take a rubbing of four whole lines: stiff, square Roman capitals, easily told apart from the shallow scratches later hands left in one corner."

[outing_steps."map_italian_academy:outing_italian_academy_relic:outing_italian_academy_relic_solve"]
"name" = "Clodia the salt seller"
"text" = "It is no general. The stone says: “To the spirits of the dead. Clodia Pia, a salt seller, lived forty years. Her husband set up this stone.” Someone long ago reused a gravestone as a bridge pier. You take a second rubbing, so there are two: one goes to the printing house’s book of inscriptions, the other stays in the little shrine at the bridgehead, so passing boatmen know who sleeps beneath."

[outing_steps."map_italian_academy:outing_italian_academy_market:outing_italian_academy_market_first"]
"name" = "Paper by the pound"
"text" = "At the end of Printers’ Row a scrap-paper stall sells waste paper by the pound for pastry shops and fishmongers to wrap goods in. The stallkeeper drops a crumpled stack on his scale and shouts “eight pounds.” In the pile you spot half a page of Greek with corrections in red in the margin—the hand of the Greek corrector at the printing house."

[outing_steps."map_italian_academy:outing_italian_academy_market:outing_italian_academy_market_revisit"]
"name" = "A pound and a half short"
"text" = "Another evening you slip the small balance into your sleeve, or bring a friend with the gift of the gab, and make for the stall. Split the stack and weigh it in portions on the balance, and it comes to six and a half pounds—his weights have been hollowed out. You keep chatting idly as you weigh, asking where the paper came from, and the stallkeeper lets slip that a printing-house hand sold him the bundle yesterday as “spoiled sheets.”"

[outing_steps."map_italian_academy:outing_italian_academy_market:outing_italian_academy_market_solve"]
"name" = "The lost corrections"
"text" = "You buy the whole bundle, and inside are a dozen red-penciled proof sheets, the corrector’s revisions to a Greek anthology, which he thought lost in his move. He sits on a step clutching the pages and reads them through from the top before he remembers to thank you. The shop hand is dismissed; the stallkeeper, grudgingly, pays back the pound and a half he shorted you."

[outing_steps."map_italian_academy:outing_italian_academy_shore:outing_italian_academy_shore_first"]
"name" = "The torn sail"
"text" = "Beside the landing stage the flat-bottomed passenger barge sits idle. A gust last night tore a rent in its little square sail, and the boatman says he won’t cast off today, even with a fair wind. The crowd on the stage—porters, a man hugging a crate of glass—grumbles loudly."

[outing_steps."map_italian_academy:outing_italian_academy_shore:outing_italian_academy_shore_revisit"]
"name" = "Sewing the sail"
"text" = "The next day you arrive with the sailmaker’s palm strapped on, or with a friend who knows rigging. Line up the two sides of the tear and sew with a heavy needle and waxed thread, stitches close together, then add a reinforcing tape along the edge. The man with the glass crate comes over too, holding the canvas taut with both hands."

[outing_steps."map_italian_academy:outing_italian_academy_shore:outing_italian_academy_shore_solve"]
"name" = "The crossing"
"text" = "By evening the sail is patched, and the barge wobbles across with a full load, nobody wetting a shoe. The boatman draws a small anchor in charcoal beside the patch and says that every year he mends the sail, he will follow these stitches."

[outing_steps."map_italian_academy:outing_italian_academy_path:outing_italian_academy_path_first"]
"name" = "The robe that’s too short"
"text" = "Outside the convent orchard’s small gate, a man in a rough brown robe blocks the path, saying he begs for the convent and everyone passing must give a coin for the Madonna’s lamp oil. But the robe is too short, showing a pair of tar-stained sailor’s boots. The farm women with vegetable baskets drop their coins into his palm one by one, and you stand gripping yours, staring at the boots."

[outing_steps."map_italian_academy:outing_italian_academy_path:outing_italian_academy_path_revisit"]
"name" = "The ditch run dry"
"text" = "Another time you come with the kamal board around your neck, or with a friend who grew up on the quays and knows the water. The false friar is swearing to the farm women that he came by the sisters’ lamp-oil skiff, down the ditch on this morning’s tide. You hold the kamal up to the thin moon still sinking at the edge of the sky, a narrow sliver, and it is spring-tide weather: that ditch ran dry to its bed before dawn and won’t float so much as a plank until noon. Then you look down at his boots, the shafts plastered with black harbor mud."

[outing_steps."map_italian_academy:outing_italian_academy_path:outing_italian_academy_path_solve"]
"name" = "Coppers in the boot"
"text" = "A lay sister weeding among the pear trees straightens up, hears you out over the low hedge, and laughs. Good people give the lamp oil freely, she says, and the friar who begs for the sisters has been laid up for a week; his robe was stolen off the line two days ago. The man in the short one is a drunk from the docks. The farm women strip it off him between them, then turn his boots upside down, and their coppers drop to the ground one by one. You wash the robe at the well, and she hands you a basket to cover it for the walk back to the friar."

[outing_steps."map_arabian_home:outing_arabian_home_herbs:outing_arabian_home_herbs_first"]
"name" = "Yellow globes on the channel bank"
"text" = "A vine trails along the irrigation channel in the date garden, hung with fist-sized yellow globes like unripe melons. The children scramble to pick them. The old gardener shouts “Don’t touch!” from across the garden and doesn’t say why."

[outing_steps."map_arabian_home:outing_arabian_home_herbs:outing_arabian_home_herbs_revisit"]
"name" = "Cut one open"
"text" = "On the second visit you tuck a pen case into your clothes, or bring along a friend who knows herbs. Cut one open, hold it to the sun, and draw it stroke by stroke: a melon’s seeds are flat and its flesh soft, but this one’s flesh is dry and white, the seeds packed tight, and the bitterness stings your nose. You know that smell. The apothecary in town hangs a string of the same dried fruit from his rafters; his boy calls it handal and says it is a violent purge, a single slice already too much."

[outing_steps."map_arabian_home:outing_arabian_home_herbs:outing_arabian_home_herbs_solve"]
"name" = "Not a melon"
"text" = "The old gardener leans over, looks, and nods: it is handal. He pins your drawing by the garden gate with one line beneath: “Yellow is not melon.” The vine is dug up, dried, and sold to the apothecary in town. Used right, the old man says, it is medicine; used wrong, poison, and the difference is a pinch."

[outing_steps."map_arabian_home:outing_arabian_home_cave:outing_arabian_home_cave_first"]
"name" = "Water in a dry cave"
"text" = "In the foothills is a cave whose spring dried up long ago, a bundle of dead reeds and broken twigs wedged in a crack by its mouth, higher than a man’s head, left there by a flood. Only dry sand lies on the floor, yet from deep inside comes the sound of running water, and a cool wind that smells of wet clay. The village children say jinn are washing laundry in there."

[outing_steps."map_arabian_home:outing_arabian_home_cave:outing_arabian_home_cave_revisit"]
"name" = "Chisel marks in the candlelight"
"text" = "Next time a beeswax candle burns in your hand, or a friend who can draw charts leads the way. The light shows neat chisel marks all over the walls and hand-cut steps leading down to a vertical shaft. You draw and count as you go, and by the nineteenth step you are sure: this is no natural cave. Somebody dug it."

[outing_steps."map_arabian_home:outing_arabian_home_cave:outing_arabian_home_cave_solve"]
"name" = "The mouth of the falaj"
"text" = "You take the chart to the old man who keeps the water channels. He draws a line on the ground from it: this is the underground falaj his grandfather’s generation dug, and the water still runs beneath the ledge, but a shaft midway has silted up. Before winter the whole village goes down to dig it out, and the garden channels sound with water again."

[outing_steps."map_arabian_home:outing_arabian_home_relic:outing_arabian_home_relic_first"]
"name" = "Half a line on the rim"
"text" = "On the sand beyond the village stands a ruined well platform, its rim cut with half a line of Kufic that wind and grit have worn to a few strokes. Camel drivers spit as they pass and say the well once “swallowed a man.” Yet the opening strokes look like “In the name of God, the Compassionate, the Merciful,” and curses don’t begin that way."

[outing_steps."map_arabian_home:outing_arabian_home_relic:outing_arabian_home_relic_revisit"]
"name" = "Letters from damp paper"
"text" = "This time you bring an ink case, or a friend with a good hand, and crouch at the well rim. Lay damp paper on the stone and pat it gently, and the strokes come up: the deep ones are the old carving, the shallow ones are crosses scratched by passing drivers with the points of their knives, dozens in a row."

[outing_steps."map_arabian_home:outing_arabian_home_relic:outing_arabian_home_relic_solve"]
"name" = "A well for the thirsty"
"text" = "“In the name of God. This well was dug for thirsty travelers and their beasts. Whoever drinks, recite the Opening for the one who dug it.” So it was no man-eater but a gift, and the drivers’ crosses are marks each made when he drank. The elders have the sand cleared from around the platform and ring the mouth with stones so that no one else falls in."

[outing_steps."map_arabian_home:outing_arabian_home_market:outing_arabian_home_market_first"]
"name" = "“Fresh from the Bahrain banks”"
"text" = "After dark the souq lights a row of oil lamps, and the pearl dealers squat on felts with small copper trays before them. A stranger cradles a pearl the size of a thumb pad in his palm and says divers fetched it from the Bahrain banks this summer, at a price that makes you flinch. The old pearl assessor beside him squints, says nothing, and tucks his own little scale a little further into his sleeve."

[outing_steps."map_arabian_home:outing_arabian_home_market:outing_arabian_home_market_revisit"]
"name" = "Too light"
"text" = "Two nights later you go back with a small balance in your pocket, or with a friend who knows how to bargain. The pearl on the pan is too light; a true one that size would sit far heavier. Turn it under the lamp and there is a pinpoint scar on the surface, left by the blowpipe. The stranger’s face changes and he spills the truth himself: hollow glass filled with wax, Frankish goods, swapped off a ship from across the sea."

[outing_steps."map_arabian_home:outing_arabian_home_market:outing_arabian_home_market_solve"]
"name" = "A hollow pearl"
"text" = "The old assessor claps the pearl onto a flagstone, and it bursts into bright glass shards. The market elder fines the stranger a day’s stall fee, and an apology drink is set before you. As a favor the assessor shows you a trick: rub a true pearl lightly on your teeth, and it feels faintly gritty, like fine sand."

[outing_steps."map_arabian_home:outing_arabian_home_shore:outing_arabian_home_shore_first"]
"name" = "A popped seam"
"text" = "A half-built boat sits on the beach with its ribs pointing at the sky. Its planks are sewn together, stitch after stitch, with cord twisted from coconut husk. On last night’s tide one seam at the bow chafed through, and the gap between the planks has opened a finger’s width. The shipwright’s young son is spinning in circles while the other boys shout advice."

[outing_steps."map_arabian_home:outing_arabian_home_shore:outing_arabian_home_shore_revisit"]
"name" = "Unpick and re-sew"
"text" = "The day after, you are back on the beach with the palm strapped to your hand, or with a friend who knows lashing. Unpick the broken stitching, thread fresh coir cord through the same holes the old way, and haul each stitch tight with the palm braced against the pull. Then pack the seam with cotton and smear on putty kneaded from lime and fish oil."

[outing_steps."map_arabian_home:outing_arabian_home_shore:outing_arabian_home_shore_solve"]
"name" = "The end of the first rope"
"text" = "Before the tide the stitches are drawn taut and the seam closes so tight a fingernail won’t go in. The shipwright runs a hand over it, says neither good nor bad, and snips a short length of the stitching cord into your palm: “Keep it. You never throw away a rope end from a first boat.”"

[outing_steps."map_arabian_home:outing_arabian_home_path:outing_arabian_home_path_first"]
"name" = "The man with the copper cup"
"text" = "On the coastal cliff road stands a stone rest shelter, with a pool beside it for camel drivers and travelers to drink from. Today a man sits by the pool with a copper cup before him, saying the shaykh has made a new rule: one coin a cup. Camel drivers with throats like dust curse him a little and drop their coins into the cup anyway."

[outing_steps."map_arabian_home:outing_arabian_home_path:outing_arabian_home_path_revisit"]
"name" = "The cliff foot at ebb"
"text" = "Next time you carry a kamal board, or take along a friend who reads the tides. Along the foot of the shelter wall, old fishermen have drawn a row of waterlines in charcoal, each with a crescent moon beside it. Take the moon’s height, then see which crescent tonight’s moon matches, and you know the water will bottom out around sunset. The sand at the foot of the cliffs will show then, and walking along it you reach the next village’s cistern in under half an hour, with no need to buy water here."

[outing_steps."map_arabian_home:outing_arabian_home_path:outing_arabian_home_path_solve"]
"name" = "The beach road and the cistern"
"text" = "The village elder’s face darkens as he listens: the pool is charity water given by the forefathers, and no one has the right to charge for it, least of all in the shaykh’s name. He sentences the man on the spot to carry water to the shelter for a month and give it free to every traveler. The low-tide beach route goes into your notebook as a drawing, and the next village’s cistern gets a circle."

[outing_steps."map_arabian_academy:outing_arabian_academy_herbs:outing_arabian_academy_herbs_first"]
"name" = "Leaves that fold at night"
"text" = "In a corner of the infirmary’s herb garden grows a tree nobody can name, with feathery leaves. A captain home from Malabar gave the seed about ten years ago, and nobody thought to ask what it was. The gardener says at night it folds its leaves shut in pairs, as if asleep. The old physician strokes his beard: what we cannot name, we neither prescribe nor swallow."

[outing_steps."map_arabian_academy:outing_arabian_academy_herbs:outing_arabian_academy_herbs_revisit"]
"name" = "Evening leaves"
"text" = "A few days later you are back, with a pen case or with a friend who knows herbs. Wait by the tree at dusk and draw the leaves one by one, checking them against the plates copied in the herbal. You split open a young pod and the sourness hits your nose, the very smell of the dried pod pressed between the herbal’s pages. Hold the two together and the leaf and the pod match."

[outing_steps."map_arabian_academy:outing_arabian_academy_herbs:outing_arabian_academy_herbs_solve"]
"name" = "The date of India"
"text" = "It is tamarind, which the Arabs call tamr hindī, “the date of India.” The sour pulp in the pods, mixed with water, is what sailors drink to bring down a fever. The old physician takes a taste on the spot, grimaces, pronounces it “nicely sour,” and orders three more planted beside it. Your drawing is copied into the garden’s register."

[outing_steps."map_arabian_academy:outing_arabian_academy_cave:outing_arabian_academy_cave_first"]
"name" = "Voices in the vault"
"text" = "Under the harbor storehouse is a stone-vaulted cellar, normally locked, today with its lock broken. A skin of gray silt lies along the stairs, printed with crab tracks left when the tide crept up, and out of the darkness comes the sound of people talking low. The storehouse hand bars the way: don’t go, it’s the old harbor-master’s ghost down there counting sacks, and how else would the grain always go moldy?"

[outing_steps."map_arabian_academy:outing_arabian_academy_cave:outing_arabian_academy_cave_revisit"]
"name" = "Counting the chambers"
"text" = "You go down with a beeswax candle, or let a friend who can draw charts go first. The cellar runs in three connected chambers, their brick arches scratched with old tally marks. In the innermost one an iron grate is set in the floor, and from beyond it comes the sound of water moving in and out."

[outing_steps."map_arabian_academy:outing_arabian_academy_cave:outing_arabian_academy_cave_solve"]
"name" = "The sound of the tide"
"text" = "Beneath the grate is a stone conduit open to the harbor, and when the tide rises the water drives air back and forth through it with a sound like talk. The damp seeps in, and that is why the grain molds. The keeper raises the plinths a hand’s breadth and cuts a small vent window in the vault. The hands say they have talked the old harbor-master’s ghost into leaving, but everyone knows it was the tide they dealt with."

[outing_steps."map_arabian_academy:outing_arabian_academy_relic:outing_arabian_academy_relic_first"]
"name" = "The Two-Horned One’s bridge"
"text" = "Over an irrigation channel long dry outside the city lies a single-arched stone bridge, its parapet bearing half a line of writing that wind and grit have blurred. The old men going to market say Dhū l-Qarnayn, the Two-Horned, raised it in a night; a man who could wall off Gog and Magog in iron can manage a bridge. But the letters sit in neat rows, plainly cut by a person, chisel stroke by chisel stroke."

[outing_steps."map_arabian_academy:outing_arabian_academy_relic:outing_arabian_academy_relic_revisit"]
"name" = "Inking the parapet"
"text" = "You come again with the ink case in hand, or with a friend who writes a handsome hand. Brush the sand off the parapet and lay paper over it for three lines of rubbing: tidy thuluth script, ending in a year that works out to more than two hundred years ago."

[outing_steps."map_arabian_academy:outing_arabian_academy_relic:outing_arabian_academy_relic_solve"]
"name" = "The cotton spinner"
"text" = "You spread the rubbing on the school’s table and read it out letter by letter: “Fāṭima the spinner saved twenty years of wages to build this bridge, so the village children could reach school in flood season.” No Two-Horned One at all. The master takes it and reads it twice, has each student copy it out, then adds one more line at the end: a prayer for her."

[outing_steps."map_arabian_academy:outing_arabian_academy_market:outing_arabian_academy_market_first"]
"name" = "Lapis blue"
"text" = "The copyists’ stalls are lit for the night, each with a row of little porcelain dishes: gold dust, cinnabar, malachite green. One dish is a deep blue, glinting with gold on top, which the stallkeeper swears is pure lapis from Badakhshan, ground for three months to yield this small pinch, three dinars a mithqal. He will only scoop from the surface, with a little spoon. The illuminator at the next stall purses his lips and quietly covers his own pinch of blue."

[outing_steps."map_arabian_academy:outing_arabian_academy_market:outing_arabian_academy_market_revisit"]
"name" = "A spoonful from the bottom"
"text" = "You return the next night with the small balance at your belt, or with a friend who can talk anyone around. You skip the spoonful the stallkeeper has ready and dig your own down to the bottom of the dish, then set it on one pan against the illuminator’s true blue on the other. Level spoon for level spoon, the stall’s side sinks, and the powder is greener and has no gold in it. The stallkeeper insists that Badakhshan ore runs dark and light, and the longer he insists, the more his story slides toward a broker: the stuff was pressed on him, and he was cheated too."

[outing_steps."map_arabian_academy:outing_arabian_academy_market:outing_arabian_academy_market_solve"]
"name" = "Blue at half a dinar"
"text" = "The market inspector is sent for, rubs a pinch from the bottom of the dish between his fingers, and sees it at once: a thin cover of lapis over a bed of azurite. He fines no one. He takes a stick of charcoal and writes on the stall board, “Blue mixed with azurite, half a dinar a mithqal,” and orders the stallkeeper to leave it up until closing. By night the whole dish has gone at that price to the mosque school, for the children to border their copybooks; a greener blue is good enough for that. The illuminator slips you a fine brush loaded with true lapis and lets you write a single letter."

[outing_steps."map_arabian_academy:outing_arabian_academy_shore:outing_arabian_academy_shore_first"]
"name" = "A smoking halyard"
"text" = "The inlet by the shipyard is where new sails are tried in the wind. Today a new sail takes the wind, and the halyard rubs at the pulley until a thin wisp of smoke curls off it, and the apprentices hurriedly let go. They all talk at once—the rope is too thick, the wheel is crooked—and the master has gone to the harbor office and won’t be back until evening."

[outing_steps."map_arabian_academy:outing_arabian_academy_shore:outing_arabian_academy_shore_revisit"]
"name" = "Finding the rub"
"text" = "Next morning you hurry over wearing the sailmaker’s palm, or bring a friend who knows rigging. One person eases the halyard while you run your hand along it inch by inch: the rub isn’t at the wheel but where the rope grazes the wooden cheek of the block, because it was reeved the wrong way. Unreeve it, pass it through again with the palm against the strain, and bind a scrap of old leather around the worn stretch."

[outing_steps."map_arabian_academy:outing_arabian_academy_shore:outing_arabian_academy_shore_solve"]
"name" = "Taking the wind steadily"
"text" = "The sail goes up again and fills with wind, and the halyard slides through the block without a sound. The master comes back at dusk, turns the rope over and over, finds no fault, and calls over the youngest apprentice, pointing at you: “Remember. That’s how it’s reeved.”"

[outing_steps."map_arabian_academy:outing_arabian_academy_path:outing_arabian_academy_path_first"]
"name" = "The man with the lantern"
"text" = "The teaching lodge outside the city sits at the end of a stony slope, and students often hurry up after sunset for the night lesson. At the foot of the slope a man squats with a lantern and says there are wolves and thieves in the hills tonight and you need him to guide you, two copper coins a head. A few students reach for their purses while glancing back at the sky; the lesson is nearly due."

[outing_steps."map_arabian_academy:outing_arabian_academy_path:outing_arabian_academy_path_revisit"]
"name" = "The dry streambed and the pole star"
"text" = "You set out at dusk with the kamal board in hand, or with a friend who reads tides and moon phases. After sunset wait for the pole star to come out, take its height above the horizon, and follow the line of the dry streambed, where the bed is flat and free of stones. Then look up at the moon: a first-quarter moon sets around midnight, so the way home from the lesson will be lit."

[outing_steps."map_arabian_academy:outing_arabian_academy_path:outing_arabian_academy_path_solve"]
"name" = "The night road, noted"
"text" = "At the lodge the old shaykh hears you out and sighs: the night lesson has never cost anyone a coin, and no one has ever been asked to hire a guide. The man with the lantern is a porter from the town who gambled away his pay. The next day a stone lamp is set at the foot of the slope. Back at the academy you draw the dry streambed route into your notebook and add a line beside it: first-quarter moon, sets at midnight."

[outing_steps."map_north_african_home:outing_north_african_home_herbs:outing_north_african_home_herbs_first"]
"name" = "A white spike with no leaves"
"text" = "Along the track beside the pomegranate orchard’s low wall stands a white flower spike taller than a man, its fist-sized bulb half out of the soil like a giant onion. Every child who sees it wants to dig it up for grandmother’s stew. But it has no leaves at all, and the orchard keeper shouts from afar: leave that alone."

[outing_steps."map_north_african_home:outing_north_african_home_herbs:outing_north_african_home_herbs_revisit"]
"name" = "Peeling the scales"
"text" = "You wait for the cool of evening and go back, pen case in your bag or a friend who knows herbs at your side. Dig out the half-buried bulb and peel back its scales: unlike an onion’s they are slimy, they itch on the skin, the taste is harsh and bitter, and the inner ones show a tinge of red. Over the low wall the orchard keeper leans out and shouts: the red-scaled kind is what we poison rats with, what are you doing touching it!"

[outing_steps."map_north_african_home:outing_north_african_home_herbs:outing_north_african_home_herbs_solve"]
"name" = "Sea squill"
"text" = "It is sea squill, which people in Fez call ʿunṣul. Apothecaries steep it in honey and vinegar and boil it into a cough syrup; the red-scaled kind, ground and mixed into dough, drops rats where they stand. Poisonous and useful both, the orchard keeper says, which is why children aren’t allowed near it. An old herbalist borrows your drawing to copy."

[outing_steps."map_north_african_home:outing_north_african_home_cave:outing_north_african_home_cave_first"]
"name" = "The copper basin"
"text" = "Water runs out of a black mouth in the rock at the foot of the hill, and the women beating laundry at the stone trough beside it never go inside. From within come bursts of clanging, as if someone were hammering a copper basin. The jinn in the spring is scouring his pots, they say, and nobody goes near after sunset."

[outing_steps."map_north_african_home:outing_north_african_home_cave:outing_north_african_home_cave_revisit"]
"name" = "The flame at the ledge"
"text" = "This time you go in with a beeswax candle, or behind a friend who can draw a chart. The flame leans toward the entrance the whole way. You come to a waist-high ledge; beyond it the floor falls away, and the clanging rises from down there. You stop at the ledge and chart what you can see."

[outing_steps."map_north_african_home:outing_north_african_home_cave:outing_north_african_home_cave_solve"]
"name" = "A line in charcoal"
"text" = "The clanging is water dripping into a natural stone basin beyond the ledge. After the first autumn rain the water climbs over the ledge and the spring runs fast and muddy out of the mouth, so that nobody can stand at the trough. You give the chart to the old man who looks after the spring, and he draws a charcoal line on the archway: when the water reaches it, the washing stops."

[outing_steps."map_north_african_home:outing_north_african_home_relic:outing_north_african_home_relic_first"]
"name" = "The writing on the keystone"
"text" = "Of the old water channel in the Hamma valley only one half-fallen arch remains, and half a line is cut into its keystone. The children say the Spanish emperor’s army camped in the valley twelve years ago and buried its pay under the arch before it left. After every rain someone turns up with a shovel to dig. But the few letters that remain don’t look like a code."

[outing_steps."map_north_african_home:outing_north_african_home_relic:outing_north_african_home_relic_revisit"]
"name" = "Deep cuts and shallow scratches"
"text" = "You return with an ink case, or with a friend who writes a good hand. Wash the keystone, press damp paper to it, and take a rubbing. The deep, even strokes are the old carving, careful in every line; the shallow crooked ones are arrows treasure-diggers scratched with nails, all pointing at the foot of the arch."

[outing_steps."map_north_african_home:outing_north_african_home_relic:outing_north_african_home_relic_solve"]
"name" = "The grain-seller’s water"
"text" = "The missing words turn out to be a dedication: this channel and arch were raised for thirsty travelers by a grain-seller, who cut a little grain measure beside his name as his mark. You give the rubbing to the old man who tends the channel, and he hangs it on the mosque wall. The treasure-diggers still come, but nobody digs at the foot of the arch anymore."

[outing_steps."map_north_african_home:outing_north_african_home_market:outing_north_african_home_market_first"]
"name" = "A “silver lamp off an Indian ship”"
"text" = "The alley of the candle-makers smells of beeswax from dawn to dusk. A stranger hangs a gleaming lamp from a hook at the front of his stall and calls it solid silver, unloaded from an Indian ship, at a frightening price. The scribe at the next stall, who writes out contracts for hire, glances at the lettering around its rim, says nothing, and starts paging through his ledger."

[outing_steps."map_north_african_home:outing_north_african_home_market:outing_north_african_home_market_revisit"]
"name" = "Weighing the lamp"
"text" = "Next evening, as the stalls light up, you walk back into the alley with a small balance and weights wrapped in cloth and tucked inside your robe, or with a friend who can haggle at your back. On the scale the lamp weighs far less than a silver one that size would: it’s silvered brass. Your friend chats the seller into admitting he “borrowed” it from the niche of a Sufi lodge outside the city. The page the scribe has found carries a copy of exactly the same lettering."

[outing_steps."map_north_african_home:outing_north_african_home_market:outing_north_african_home_market_solve"]
"name" = "Back in its niche"
"text" = "The ledger says a weaver gave the lamp to the lodge when his son recovered, and the rim is cut with his name. An old coppersmith from the next stall leans over, looks, and says he cut those letters himself. The seller’s hands shake so badly he can’t hold the lamp, so you carry it back to its niche for him. That night every candle-maker in the alley sends a candle."

[outing_steps."map_north_african_home:outing_north_african_home_shore:outing_north_african_home_shore_first"]
"name" = "Dyed shallows"
"text" = "The dyers’ drain empties into the bay, and indigo and madder-red run out over the shallows in long threads, as if someone had knocked over a dish of pigments. A small skiff is tied to a post at the outfall, its line worn to a few strands, while a huddle of children shout themselves red arguing over which knot to tie. The tide has begun to rise."

[outing_steps."map_north_african_home:outing_north_african_home_shore:outing_north_african_home_shore_revisit"]
"name" = "A splice wrapped in blue"
"text" = "At first light you walk back along the dye run with a sailmaker’s palm on your hand, or with a friend who knows rigging at your side. Cut out the chafed stretch, weave the three strands back together, and bind the splice with scrap hemp thread from the dye works, so that it wears a ring of blue. The arguing children squat at the water’s edge watching, their fingers dyed blue to the knuckle."

[outing_steps."map_north_african_home:outing_north_african_home_shore:outing_north_african_home_shore_solve"]
"name" = "Hauled to the dyers’ door"
"text" = "With the tide coming in, everyone hauls the skiff up the steps in front of the dye works and ties it to a cloth-drying frame. The master dyer comes out, runs a thumb over the splice, fetches a freshly dyed indigo scarf, and winds it around your neck. “The wind is strong out there.”"

[outing_steps."map_north_african_home:outing_north_african_home_path:outing_north_african_home_path_first"]
"name" = "“Lamp-oil money” under the carob"
"text" = "On the stony track up to the hillside lodge, a man sitting under a carob tree calls himself the lodge’s steward and says everyone who climbs this year must pay lamp-oil money. There are water-carriers and a goatherd on the path too, and none of them wants to be the first to argue."

[outing_steps."map_north_african_home:outing_north_african_home_path:outing_north_african_home_path_revisit"]
"name" = "The goat track under the pole star"
"text" = "A few days later you climb again with a kamal board, or with a friend who reads stars and tides. At first dusk the pole star shows; you take its height with the board, fix true north, and work out which way the lodge’s back door lies. You note the carob tree and a white boulder, follow the goatherds’ track around to that door, and tell the old doorkeeper what happened on the path."

[outing_steps."map_north_african_home:outing_north_african_home_path:outing_north_african_home_path_solve"]
"name" = "The back way"
"text" = "The old doorkeeper thumps his stick on the ground: the lamp oil is donated by the faithful, and the lodge has never charged anyone anything. The next day the spot under the carob is empty. The back path goes into your notebook, with its ditches and the stretch where you feel along the wall at night."

[outing_steps."map_north_african_academy:outing_north_african_academy_herbs:outing_north_african_academy_herbs_first"]
"name" = "Glossy leaves"
"text" = "Two clumps of long, narrow, glossy-leaved shrubs twine along the herb garden’s hedge, as if poured from one mold. The kitchen boy comes every day to pick bay leaves for the stew, and this week he has been picking fast without looking. The old apothecary who tends the garden is out on a call, and only the bees are humming."

[outing_steps."map_north_african_academy:outing_north_african_academy_herbs:outing_north_african_academy_herbs_revisit"]
"name" = "Crush and see"
"text" = "You come back with a pen case, or with a friend who knows herbs. Draw leaf and twig of each and compare. One clump gives off a clean fragrance when crushed, with raised veins and leaves set singly along the branch; the other has no scent at all, its leaves in whorls of three around the stem, and pink buds at the tips."

[outing_steps."map_north_african_academy:outing_north_african_academy_herbs:outing_north_african_academy_herbs_solve"]
"name" = "Red wool on the branch"
"text" = "The fragrant one is bay; the one with leaves in threes is oleander, and they say a handful of its leaves can kill a mule. The kitchen boy thinks back and decides yesterday’s picking came from the clump by the door: bay, praise God. When the old apothecary gets home he ties a loop of red wool around the oleander branches so that everyone will know."

[outing_steps."map_north_african_academy:outing_north_african_academy_cave:outing_north_african_academy_cave_first"]
"name" = "The bell in the cistern"
"text" = "Behind the student lodgings an old cistern lets its stone steps run down into black water, and a white crust of salt on the steps crunches underfoot. The boys in your room bet on who dares go down with a lamp. Every so often, from below, comes one clear note, like a small bronze bell struck once."

[outing_steps."map_north_african_academy:outing_north_african_academy_cave:outing_north_african_academy_cave_revisit"]
"name" = "The flame sinks"
"text" = "This time you go down with a beeswax candle, or behind a friend who can draw a chart. In its light a row of brick arches stands out of the water, which has fallen to the foot of the third arch and left a narrow ledge. Far at the back you can just make out a tilted old sluice gate with a bronze ring swinging faintly on it. Farther in, at the fifth arch, the flame sinks an inch at a time. The air is thin, and it’s time to stop."

[outing_steps."map_north_african_academy:outing_north_african_academy_cave:outing_north_african_academy_cave_solve"]
"name" = "Before the fifth arch"
"text" = "The note is a loose bronze ring on the sluice gate: wind slips in through a crack from the silted culvert and shoves it against the doorframe, and the same crack leaks the foul air that starves the flame. You give the chart to the lodge’s old servant, who says the cistern once held the lodge’s water and let it out to the river through that gate, until the culvert silted up and nobody touched the gate again. He lashes the ring down with a leather thong and sets a small oil lamp in a niche at the fifth arch: go down at spring cleaning, he says, and when the lamp dims, come out."

[outing_steps."map_north_african_academy:outing_north_african_academy_relic:outing_north_african_academy_relic_first"]
"name" = "The treasure hunters’ target"
"text" = "Half a stone slab stands in an olive grove outside the city, with half a line of Latin letters on it. The treasure-hunters’ guild says it’s a Roman marker for buried gold and comes to dig beside it every spring, turning the soil over and over. The grove’s owner pays to have the holes filled every year."

[outing_steps."map_north_african_academy:outing_north_african_academy_relic:outing_north_african_academy_relic_revisit"]
"name" = "Like a page of accounts"
"text" = "After class you make another trip with an ink case on your back, or with a friend whose handwriting is good. The rubbing shows how the letters are laid out: two letters alone at the top, a line of name in the middle, a string of numbers at the bottom. It looks less like a map than like a page of accounts."

[outing_steps."map_north_african_academy:outing_north_african_academy_relic:outing_north_african_academy_relic_solve"]
"name" = "A man of thirty-five"
"text" = "An old bookseller who learned Latin during his years as a captive bends over the rubbing and reads it out: a man’s name and the words “rests here, aged thirty-five.” It’s a Roman gravestone, not a treasure marker. The grove’s owner takes the rubbing and forbids digging beside the stone from then on; the treasure-hunters grumble and dig another hole in the next field."

[outing_steps."map_north_african_academy:outing_north_african_academy_market:outing_north_african_academy_market_first"]
"name" = "Old letters by the pound"
"text" = "When the lamps are lit, the paper sellers’ stalls glow one by one. A porter squats under a lamp selling a bundle of old letters by the pound, fished out of a wreck across the sea, he says, and the paper still smells of salt. The letter-reader at the next stall, who reads and writes for people who can’t read, leafs through his ledger, looks again at the knot in the string around the bundle, and says nothing."

[outing_steps."map_north_african_academy:outing_north_african_academy_market:outing_north_african_academy_market_revisit"]
"name" = "Heavier than scrap"
"text" = "The night you return to the paper market you carry a small balance and weights in a leather pouch, or bring a friend who can bargain. The bundle weighs far more than scrap paper of that thickness. Your friend keeps the porter talking until he admits he picked it up in a corner of the inn by the city gate; there never was a wreck. The letter-reader’s ledger, open to one page, matches the knot and the number of letters."

[outing_steps."map_north_african_academy:outing_north_african_academy_market:outing_north_african_academy_market_solve"]
"name" = "The silver bracelet in the letters"
"text" = "The letters are from a son working in Alexandria to his mother. The post carrier lost them, and a small silver bracelet is wrapped up inside the bundle. The letter-reader has read that mother’s mail to her for years, and he leads the porter to her door that same night; the porter takes his reward and doesn’t once look up on the way. The old woman holds the bracelet in her fist a long while before she lets anyone read the letters."

[outing_steps."map_north_african_academy:outing_north_african_academy_shore:outing_north_african_academy_shore_first"]
"name" = "Steps in the rising water"
"text" = "After a night of spring rain the river has climbed to the fifth step. A plank footbridge hangs beside the stairs, its main rope worn on an iron ring down to a fraction of a strand. A few children are shouting about what knot to tie, and on the far bank a little girl with a board of dough on her head is about to step onto the bridge. You call her back and send her around by the stone bridge downstream, to the neighborhood oven."

[outing_steps."map_north_african_academy:outing_north_african_academy_shore:outing_north_african_academy_shore_revisit"]
"name" = "Sheepskin in the ring"
"text" = "By the next day the rain has stopped and the water has fallen back, and you return to the steps with a sailmaker’s palm, or with a friend who knows rigging. Cut out the worn section, splice in a new length, and pad the iron ring with sheepskin so it can’t chafe again. A pole lies across the bridgehead and passersby go around; the children crowd close to watch your hands."

[outing_steps."map_north_african_academy:outing_north_african_academy_shore:outing_north_african_academy_shore_solve"]
"name" = "The first loaf"
"text" = "The pole comes down. The first to cross is the girl with the dough board, who stamps twice in the middle of the bridge on purpose and grins back at you. That evening she presses half of the first hot loaf from the oven into your hands."

[outing_steps."map_north_african_academy:outing_north_african_academy_path:outing_north_african_academy_path_first"]
"name" = "The order nobody may read"
"text" = "On the hillside is a little shelter where copyists rest, and students climb up with their book boxes to copy under the olive trees. Halfway there a man sits on a big stone in the middle of the stony path and says that by order of the new sultan everyone must pay a copper coin to pass. He holds a paper up high but won’t let anyone step close enough to read it. A few copyists with book boxes have stopped in front of the stone, looking at one another, and nobody has reached for a coin."

[outing_steps."map_north_african_academy:outing_north_african_academy_path:outing_north_african_academy_path_revisit"]
"name" = "Down behind the lanterns"
"text" = "You return with a kamal board, or with a friend who can read stars and tides. When the pole star comes out after dark, take its height, fix on the lamp of the minaret on the next hill, and go down by another track behind the copyists’ lanterns, never passing the man on his stone. In town you tell the old copyist who looks after the shelter."

[outing_steps."map_north_african_academy:outing_north_african_academy_path:outing_north_african_academy_path_solve"]
"name" = "The night way down"
"text" = "The old copyist sighs. He has read the new sultan’s orders, and there is no road toll in them. “Besides, who ever heard of a government order nobody may read?” The next day the stone is empty. The night track down goes into your notebook, with its stairs and the stretch where you keep to the left."

[outing_steps."map_east_african_home:outing_east_african_home_herbs:outing_east_african_home_herbs_first"]
"name" = "Two yam vines"
"text" = "Two vines twine under the thicket, with heart-shaped leaves nearly identical. Last month a child dug up one kind and boiled it for hours; it was so harsh it numbed his tongue, and he lay on his mat for two days. The old grandmother chewing betel has driven every child out of the thicket and forbidden both kinds."

[outing_steps."map_east_african_home:outing_east_african_home_herbs:outing_east_african_home_herbs_revisit"]
"name" = "Thorns on the stem"
"text" = "The second time you bring a pen case, or a friend who knows herbs. Draw stem, leaf stalk, and tuber of each and compare. One vine has a smooth stem and a long, slender white tuber; the other is armed with fine prickles, and its tuber turns yellow soon after it’s cut."

[outing_steps."map_east_african_home:outing_east_african_home_herbs:outing_east_african_home_herbs_solve"]
"name" = "Famine food"
"text" = "The prickly one is bitter yam, and eaten raw or half-cooked it will lay you out for days. But chopped fine, soaked three nights in the mangrove creek, and boiled through in fresh water, it feeds a family in a hungry year. The grandmother rolls up your drawing and slides it into the clay jar under her eaves: this one is for the year with no rice."

[outing_steps."map_east_african_home:outing_east_african_home_cave:outing_east_african_home_cave_first"]
"name" = "The moan in the cave"
"text" = "Under a low cliff behind the old house foundations is a cave in the coral rock, its mouth too neat to be natural. At spring tides a deep “whoo…” comes from inside, like someone blowing across an empty jar, and bats pour out in a cloud. The water line on the walls is higher than a man’s head. The children say an old ghost of the island is sighing, and nobody goes near after dark."

[outing_steps."map_east_african_home:outing_east_african_home_cave:outing_east_african_home_cave_revisit"]
"name" = "Chisel marks"
"text" = "You go back at low tide, holding a beeswax candle or following a friend who can draw a chart. By its light the walls are covered in neat chisel marks: square blocks of coral have been cut away one by one, leaving terraces like stairs. It’s a quarry. Farther in, a knee-high ledge crosses the floor, and beyond it the roof grows thinner and the flame rises and falls."

[outing_steps."map_east_african_home:outing_east_african_home_cave:outing_east_african_home_cave_solve"]
"name" = "Stop at the line"
"text" = "The moaning is the tide forcing its way up through a crack underground and pushing the air out of a small hole in the roof. You give the chart to the old stonemason who builds houses, and he cuts a line across the ledge: past this, the roof can’t be trusted. The stone for the island’s great mosque, he says, was cut right here."

[outing_steps."map_east_african_home:outing_east_african_home_relic:outing_east_african_home_relic_first"]
"name" = "Writing on the threshold"
"text" = "Of the old house on the island only a ring of coral-stone footings is left, and half a line is cut into the threshold stone, worn shallow by salt. The old men say it was the home of the first sultan, who came from Shiraz. But the way the few words are written doesn’t look like something written for a sultan."

[outing_steps."map_east_african_home:outing_east_african_home_relic:outing_east_african_home_relic_revisit"]
"name" = "Brushing out the ink"
"text" = "You go again with an ink case over your shoulder, or with a friend who has a fine hand. The salt has worn the letters too shallow for a rubbing, so you brush on a thin coat of ink and wipe the stone with a wet cloth. The ink stays in the cuts, and the other half of the line shows up at once, with a small ship mark at the end."

[outing_steps."map_east_african_home:outing_east_african_home_relic:outing_east_african_home_relic_solve"]
"name" = "The gold-weigher’s widow"
"text" = "The full line reads: “This house was built by a gold-weigher’s widow; may God protect those who go to sea.” No sultan lived here after all, only a widow whose husband weighed gold. The old men argue all afternoon and finally give ground by half a step: “Then the sultan’s gold was weighed in her house.”"

[outing_steps."map_east_african_home:outing_east_african_home_market:outing_east_african_home_market_first"]
"name" = "An “inland tusk”"
"text" = "When the sea breeze rises, the lamps of the evening market are lit. A stranger lays out a curved tusk—prime ivory from beyond Sofala, he says, sold by weight. The scribe who keeps the stallholders’ accounts glances at a ring worn bright near the tip, mutters half a sentence, and opens his ledger."

[outing_steps."map_east_african_home:outing_east_african_home_market:outing_east_african_home_market_revisit"]
"name" = "Far too light"
"text" = "Next evening, just as the breeze comes up, you walk back to the stall with a small balance and weights, or with a friend who can bargain. The tusk weighs less than half what he claimed. Your friend squats beside him and talks until he owns up: it’s hollow, and was already hollow when he bought it. The scribe’s ledger has an entry: the ferry horn, made of ivory, mouthpiece worn bright, vanished overnight three years ago."

[outing_steps."map_east_african_home:outing_east_african_home_market:outing_east_african_home_market_solve"]
"name" = "The ferry horn sounds again"
"text" = "The horn goes back to the ferry landing. The old ferryman blows it across the strait, and the boatman on the far side casts off at once. It’s the horn his father blew, he says. The trader slips away that night in a small boat; at dawn the long note sounds over the strait again."

[outing_steps."map_east_african_home:outing_east_african_home_shore:outing_east_african_home_shore_first"]
"name" = "A frayed coir line"
"text" = "A row of dugout canoes lies on the sand at low tide, and under the coconut palms several women sit rolling coconut husk fiber into rope against their thighs. In the shallows a small canoe’s mooring line is worn on the coral down to a few strands, and the children are quarreling over which knot to tie while the tide begins to turn."

[outing_steps."map_east_african_home:outing_east_african_home_shore:outing_east_african_home_shore_revisit"]
"name" = "Staggering the strands"
"text" = "Next day at low tide you are back on the sand with a sailmaker’s palm on your hand, or with a friend who knows rigging beside you. Coconut fiber is coarse and springy, so the three strands must be staggered when you weave them or the splice won’t bite; then bind it with fine cord left over from the women’s work. They stop rolling and crane their necks to watch."

[outing_steps."map_east_african_home:outing_east_african_home_shore:outing_east_african_home_shore_solve"]
"name" = "A coil of new rope"
"text" = "Before the tide comes in, everyone drags the canoe up to high ground and ties it to a palm trunk. The owner runs a thumb over the new splice, says nothing, and walks off. The next day one of the women puts a coil of freshly twisted rope in your hands: “A sailor can always use this.”"

[outing_steps."map_east_african_home:outing_east_african_home_path:outing_east_african_home_path_first"]
"name" = "A “cowrie tax” at the well"
"text" = "On the road inland, a well stands under an old baobab, and travelers water their animals here. Today a man sits at the well-head claiming to be the chief’s tax collector, saying everyone who passes must pay a string of cowries. The porters carrying ivory mutter behind him, and none of them wants to speak first."

[outing_steps."map_east_african_home:outing_east_african_home_path:outing_east_african_home_path_revisit"]
"name" = "Three trees under the Southern Cross"
"text" = "Next trip you bring a kamal board, or a friend who reads stars and tides. At night by the well, take the height of the Southern Cross, fix the bearing toward the sea, and note the three marker trees along the way. Before dawn you go down with the porters, never passing the man’s post. Back in the village, you tell the elder who looks after the road."

[outing_steps."map_east_african_home:outing_east_african_home_path:outing_east_african_home_path_solve"]
"name" = "A ladle of water"
"text" = "The elder shakes his head. The chief has never set a tax; the one rule on this road is that whoever drinks from the well leaves a ladle for the next traveler. The next day the well-head is empty. The star’s height and the three trees go into your notebook, with the well drawn beside them."

[outing_steps."map_east_african_academy:outing_east_african_academy_herbs:outing_east_african_academy_herbs_first"]
"name" = "A small round melon in the vines"
"text" = "In the garden on the Nile island, watermelon vines cover half the slope. Among them grow a few small round melons the size of an egg, mottled yellow-green, with deeper-cut leaves, so like their neighbors and yet not. The gardener’s donkey walks past and would rather go hungry than bend its head to them."

[outing_steps."map_east_african_academy:outing_east_african_academy_herbs:outing_east_african_academy_herbs_revisit"]
"name" = "Rough leaf, dry flesh"
"text" = "After class you go back with a pen case, or bring along a friend who knows plants. Draw leaf, stem, and fruit of each and compare. Watermelon leaves are smooth, but these are rough and clinging; cut one open and there is no red pulp, only dry white fluff and a bitterness that hits the nose."

[outing_steps."map_east_african_academy:outing_east_african_academy_herbs:outing_east_african_academy_herbs_solve"]
"name" = "Bitter apple"
"text" = "It is colocynth, which the apothecaries call handhal; ground into powder, a pinch will leave a man unable to stand, yet physicians use it against serious illness. The gardener picks them, dries them, and takes them to the hospital in the city, coming back with two sacks of good seed. Your drawing is pinned to a post of his melon shed."

[outing_steps."map_east_african_academy:outing_east_african_academy_cave:outing_east_african_academy_cave_first"]
"name" = "A voice not yours"
"text" = "At the foot of the Muqattam hills lies a dry old reservoir, brick vault after brick vault. The schoolboys say that if you whisper a word at the entrance, something answers from the depths, but it sounds like someone else mimicking you. Dry gray weed hangs from the entrance vault and crumbles at a touch."

[outing_steps."map_east_african_academy:outing_east_african_academy_cave:outing_east_african_academy_cave_revisit"]
"name" = "The seventh arch"
"text" = "On the next visit you carry in a beeswax candle, or let a friend who can draw a chart lead the way. In the light the rows of brick arches look like ribs. You say a word at the entrance and the echo does come back from the deepest arch, a beat late. At the seventh arch you stop: a ledge crosses the floor, and the silt beyond it could be any depth."

[outing_steps."map_east_african_academy:outing_east_african_academy_cave:outing_east_african_academy_cave_solve"]
"name" = "Words carried back by the roof"
"text" = "The vaults pass the words along one by one, which is why the echo comes back a beat late. Beyond the seventh arch lies the silted-up channel that once fed the reservoir. You give the chart to the old man who watches the place, and he writes in lime on the entrance arch: “Stop at the seventh.” His father’s generation of masons, he adds, used this echo to pass words between crews working at either end."

[outing_steps."map_east_african_academy:outing_east_african_academy_relic:outing_east_african_academy_relic_first"]
"name" = "Whose stretch"
"text" = "Beside the old canal at the edge of the city stands a broken half-stele with half a line of writing. Everyone along the canal says General Amr set it up when he dug the canal. At last year’s dredging, two vegetable-growers argued under it about whose stretch was whose and nearly came to blows."

[outing_steps."map_east_african_academy:outing_east_african_academy_relic:outing_east_african_academy_relic_revisit"]
"name" = "A list of sections"
"text" = "On your next visit you bring an ink case, or a friend with beautiful handwriting. Wash the stele and take a rubbing: the paper shows no praise of a ruler, only rows of numbers, each row ending in a village name, like a list for dividing land."

[outing_steps."map_east_african_academy:outing_east_african_academy_relic:outing_east_african_academy_relic_solve"]
"name" = "The old cubit is longer"
"text" = "The restored text is a notice for cleaning the canal: it is divided into sections, each village cleans its own, and the boundaries are measured in “old cubits.” The old cubit is a finger longer than today’s, and after an afternoon of measuring with it the two families discover that each has been cleaning part of the other’s stretch. That evening the two old men share a flatbread."

[outing_steps."map_east_african_academy:outing_east_african_academy_market:outing_east_african_academy_market_first"]
"name" = "“Fine paper from over the sea”"
"text" = "The paper market fills with people once the lamps are lit. A porter at one stall is hawking a ream of fine paper, just unloaded from a ship from over the sea, three crescents pressed into its laid lines, at half the usual price. The copyist at the next stall, who keeps the accounts of a student lodging, leans over to hold a sheet up to the lamp and check the watermark, says nothing, lays his pen across the inkstone, and opens his ledger."

[outing_steps."map_east_african_academy:outing_east_african_academy_market:outing_east_african_academy_market_revisit"]
"name" = "Nine pounds four ounces"
"text" = "When the lamps are lit again you go back to the market, bringing a small balance and weights, or a friend who is good at haggling. The ream goes on the scale: nine pounds four ounces, not an ounce off. Your friend squats beside the porter and talks from prices to cousins until it comes out that he carries loads for the paper dealer: the lodging paid for two reams but only one arrived, and the porter kept the other. The copyist’s ledger says it plainly: two reams, nine pounds four ounces each."

[outing_steps."map_east_african_academy:outing_east_african_academy_market:outing_east_african_academy_market_solve"]
"name" = "Paper back to the lodging"
"text" = "The ream is carried back to the student lodging, and the copyist writes out a receipt on the spot for the porter to press his thumb to. That night each of the poor students is handed ten sheets, and one of them is too awed to write; he holds a sheet up to the lamp and studies the three crescents."

[outing_steps."map_east_african_academy:outing_east_african_academy_shore:outing_east_african_academy_shore_first"]
"name" = "A line the flood pulls tight"
"text" = "The steps beside the river gauge run down into the Nile, and in flood season the water can climb several fingers in a night. A small ferry boat is tied beside them, its line stretched straight and fraying on the stone edge. A few children argue whether the line should be pulled tight or let slack. Nobody knows, and the river has risen another finger."

[outing_steps."map_east_african_academy:outing_east_african_academy_shore:outing_east_african_academy_shore_revisit"]
"name" = "The sliding ring"
"text" = "Next morning you go down the steps with a sailmaker’s palm in your pocket, or take along a friend who knows rigging. Cut out the frayed stretch and weave it back, then loop the line’s end through an iron ring that slides up and down a wooden post. The old keeper of the gauge watches from a distance and shifts his reed pen to the other hand."

[outing_steps."map_east_african_academy:outing_east_african_academy_shore:outing_east_african_academy_shore_solve"]
"name" = "The Nile doesn’t argue"
"text" = "In the night the water climbs two more fingers, the ring creeps up the post, and the boat rises with the river, its line slack and bearing no strain. Next morning, when he has recorded the level, the keeper of the gauge says: “The Nile doesn’t argue with anything pulled tight.”"

[outing_steps."map_east_african_academy:outing_east_african_academy_path:outing_east_african_academy_path_first"]
"name" = "“Night-watch money”"
"text" = "Out of the city toward the desert’s edge, at the end of the field banks, stands a scholar’s retreat where the teachers of the school often go to spend the night and lecture. Halfway there a man sitting by a canal sluice calls himself the road watcher and says that from this year everyone passing owes night-watch money, a copper coin each. Farmhands coming home and a water-seller with his donkey happen by, and all slow down, glancing at him, waiting to see who will pay first."

[outing_steps."map_east_african_academy:outing_east_african_academy_path:outing_east_african_academy_path_revisit"]
"name" = "Stars over the dry canal"
"text" = "You go back with a kamal board, or with a friend who reads the stars and the water. After dark, take the pole star’s height from a high bank and follow the dry canal the water-sellers’ donkeys use, round the sluice and on to the retreat’s back gate. You sleep the night in the woodshed, and next morning you tell the old servant who keeps the gate."

[outing_steps."map_east_african_academy:outing_east_african_academy_path:outing_east_african_academy_path_solve"]
"name" = "The polished stone"
"text" = "The old servant laughs aloud. The master has lived here thirty years and never hired a night-watchman; even the dogs on the road are his own. He sends two young pupils to the sluice, but the man is long gone, leaving only a stone worn smooth by sitting. The dry-canal detour goes into your notebook, with a note to switch to the wooden bridge upstream when the water is high."

[outing_steps."map_chinese_home:outing_chinese_home_herbs:outing_chinese_home_herbs_first"]
"name" = "A yellow vine on the banyan"
"text" = "Old banyans on the levee trail their aerial roots, and one is wrapped in a vine of yellow flowers that looks at first like honeysuckle. But the woman who sells fresh herbs below the levee once said there’s a vine that will cut your guts in two. Leave this one alone for now."

[outing_steps."map_chinese_home:outing_chinese_home_herbs:outing_chinese_home_herbs_revisit"]
"name" = "Flowers in pairs"
"text" = "The second time you bring a pen case, or a friend who knows the herb stalls. Compare flower, leaf, and vine and the trick shows: honeysuckle blooms in pairs, some white and some gold, while every flower on this vine is yellow, crowded together in bunches."

[outing_steps."map_chinese_home:outing_chinese_home_herbs:outing_chinese_home_herbs_solve"]
"name" = "Heartbreak grass"
"text" = "It’s heartbreak grass. You show the drawing to the herb woman; she nods and pins it to the bamboo pole of her stall, so anyone who comes for honeysuckle sees this first."

[outing_steps."map_chinese_home:outing_chinese_home_cave:outing_chinese_home_cave_first"]
"name" = "The smugglers’ hole"
"text" = "Under the rocks by the sea is a hole that shows only at low tide, with a water line higher than a grown man. The adults forbid children to go in—smugglers used to hide goods there, they say—which only makes everyone want to look."

[outing_steps."map_chinese_home:outing_chinese_home_cave:outing_chinese_home_cave_revisit"]
"name" = "Niches in the candlelight"
"text" = "This time you go in holding a beeswax candle, or with a friend who can draw a chart leading the way. Niches have been cut into the rock to hold goods, long since empty; past a ledge in the floor, the low ground floods every time the tide comes in."

[outing_steps."map_chinese_home:outing_chinese_home_cave:outing_chinese_home_cave_solve"]
"name" = "Marking the flood line"
"text" = "You chart the cave as far as the ledge and cut a mark at the entrance: when the water reaches here, get out. No smuggled goods, though—just a copper coin worn blank in one niche, dropped by who knows whom."

[outing_steps."map_chinese_home:outing_chinese_home_relic:outing_chinese_home_relic_first"]
"name" = "A broken stele in the wall"
"text" = "Only a ring of foundation stones is left of the old stockade behind the village, with half a stele set into the base of the wall. The old folks say Song loyalists built it against the Mongols. Yet among the few characters you can read is the word for Japanese raiders."

[outing_steps."map_chinese_home:outing_chinese_home_relic:outing_chinese_home_relic_revisit"]
"name" = "A rubbing of the stele"
"text" = "You go back with an ink case, or with a friend who writes a handsome hand. Wash the stone and take a rubbing, and a list of names and numbers floats up on the paper—plus, in one corner, a turtle some child scratched in later."

[outing_steps."map_chinese_home:outing_chinese_home_relic:outing_chinese_home_relic_solve"]
"name" = "The names on the stone"
"text" = "The reign name is Hongwu. The families of the district pooled rice and lime to wall themselves in against Japanese raiders, and every measure of rice and load of lime is recorded. The elders study the rubbing, go on insisting it was the Song loyalists—and hang it in the ancestral hall anyway."

[outing_steps."map_chinese_home:outing_chinese_home_market:outing_chinese_home_market_first"]
"name" = "A silver lock, “full weight”"
"text" = "When the tide drops, the boats tie up at the river mouth and the night market strings out its lanterns. One stall has a child’s silver longevity lock hanging up—traded off a Japanese ship, the seller says, a full two taels. The Tianfei temple’s bookkeeper walks by and stares at the characters engraved on it for a long time."

[outing_steps."map_chinese_home:outing_chinese_home_market:outing_chinese_home_market_revisit"]
"name" = "The scale tells"
"text" = "The next night you go back with a small balance at your belt, or with a friend who can bargain. Two taels, he said; it weighs one tael six. Your friend keeps him talking until he lets it slip: he got it out the back door of a pawnshop, and there was never any Japanese ship."

[outing_steps."map_chinese_home:outing_chinese_home_market:outing_chinese_home_market_solve"]
"name" = "The lock goes home"
"text" = "The temple’s offering ledger has the engraved name: a fishing family by the river, who made a vow at the temple when their baby was a month old. The lock is redeemed, and the grandmother turns up with a basket of oysters she won’t let you refuse."

[outing_steps."map_chinese_home:outing_chinese_home_shore:outing_chinese_home_shore_first"]
"name" = "A line about to part"
"text" = "Nets are spread to dry all over the sandbar, and the women mend them, laughing as they work. In the shallows a sampan’s line is nearly chafed through, and a few children argue over whether a fisherman’s knot or a boatman’s knot is right, none of them giving an inch."

[outing_steps."map_chinese_home:outing_chinese_home_shore:outing_chinese_home_shore_revisit"]
"name" = "Cut, splice, bind"
"text" = "The next day you come back with a sailmaker’s palm, or with a friend who knows rigging. Cut out the chafed length, splice it, and bind it tight with hemp twine left over from the nets. The women stop their netting shuttles to watch, nodding."

[outing_steps."map_chinese_home:outing_chinese_home_shore:outing_chinese_home_shore_solve"]
"name" = "Up on the bar"
"text" = "Before the tide comes in, everyone drags the sampan onto the bar and ties it to a stake. The owner, an old fisherman with a limp, doesn’t thank you. Instead he teaches you a knot he has tied for decades: “This one won’t slip in any wind.”"

[outing_steps."map_chinese_home:outing_chinese_home_path:outing_chinese_home_path_first"]
"name" = "“Bridge money”"
"text" = "The old trail to the hill temple crosses a stone bridge, and a man at the end of it calls himself a temple steward: three coins each for “bridge repairs.” Everyone knows the village paid to fix that bridge last year. There are people around; don’t argue with him on your own."

[outing_steps."map_chinese_home:outing_chinese_home_path:outing_chinese_home_path_revisit"]
"name" = "The mudflat way"
"text" = "You come back with a kamal board, or with a friend who reads the tide. The fishermen have a saying: when the moon crosses the top of the sky, the tide turns. Keep the kamal on the moon, time the ebb, and the mudflats below the hill become a road—no bridge needed. Back home, you tell the old abbot."

[outing_steps."map_chinese_home:outing_chinese_home_path:outing_chinese_home_path_solve"]
"name" = "The flats on paper"
"text" = "The abbot sends two water-carrying monks down the hill, and the man at the bridge takes off like a shot. The low-tide route across the flats goes into your notebook, along with the days to stay off it and the stretch where the mud swallows your feet."

[outing_steps."map_chinese_academy:outing_chinese_academy_herbs:outing_chinese_academy_herbs_first"]
"name" = "Two clumps of sword leaves"
"text" = "The Double Fifth is coming, and the teacher sends the pupils to cut sweet flag for the doorways. But by the pond grow two clumps of sword-shaped leaves, identical except that one has bloomed purple and one hasn’t. Hands clasped behind his back, the teacher says only: “Work it out.”"

[outing_steps."map_chinese_academy:outing_chinese_academy_herbs:outing_chinese_academy_herbs_revisit"]
"name" = "Crush a leaf"
"text" = "After lessons you go back with a pen case, or with a friend who knows herbs. Compare leaves and rootstocks, then crush one leaf from each: one clump smells sharp and spicy and has a raised rib down the middle; the other smells only of grass, its blade flat."

[outing_steps."map_chinese_academy:outing_chinese_academy_herbs:outing_chinese_academy_herbs_solve"]
"name" = "The right sweet flag"
"text" = "The fragrant one with the rib is sweet flag; the purple-flowered one is iris, whose root will empty you out from both ends. On the Double Fifth, the sweet flag over the school door is the bunch you cut. The teacher glances at it, says nothing, and adds an extra red circle to your copybook."

[outing_steps."map_chinese_academy:outing_chinese_academy_cave:outing_chinese_academy_cave_first"]
"name" = "Wind from the back of the cave"
"text" = "The cliff outside the city is covered in inscriptions left by earlier visitors, and at its foot is a shallow cave. From the dark at the back comes a breeze that chills the nape of your neck. Your classmates all say it runs clear through the mountain, but none of them has ever gone in."

[outing_steps."map_chinese_academy:outing_chinese_academy_cave:outing_chinese_academy_cave_revisit"]
"name" = "Sideways past the ledge"
"text" = "This time you inch in by the light of a beeswax candle, or behind a friend who can draw a chart. The flame leans outward the whole way; the passage narrows until, at a ledge, you have to turn sideways to squeeze through."

[outing_steps."map_chinese_academy:outing_chinese_academy_cave:outing_chinese_academy_cave_solve"]
"name" = "A slit of sky"
"text" = "Beyond the ledge a fissure runs straight up to the summit, showing only a thin line of sky. That’s where the wind pours in; the cave doesn’t go through the mountain at all. The chart goes up on the classroom wall, and the classmate who lost the bet buys you a bowl of sticky rice cakes."

[outing_steps."map_chinese_academy:outing_chinese_academy_relic:outing_chinese_academy_relic_first"]
"name" = "Zhu Xi’s own hand?"
"text" = "Outside the city stands a stone bridge broken off halfway, with two great characters on the pillar at its head. Everyone says Master Zhu wrote them himself when he governed Zhangzhou. But a line of small characters at the foot of the pillar lies under a thick coat of moss."

[outing_steps."map_chinese_academy:outing_chinese_academy_relic:outing_chinese_academy_relic_revisit"]
"name" = "Under the moss"
"text" = "After school you go back with an ink case, or with a friend who writes a good hand. Scrub off the moss and take a rubbing of the small line too. The great characters are weighty and powerful and do look right; the small ones are in another style entirely, and cut shallower."

[outing_steps."map_chinese_academy:outing_chinese_academy_relic:outing_chinese_academy_relic_solve"]
"name" = "The signature"
"text" = "The small line is a signature: a county school instructor who “respectfully copied Master Zhu’s surviving brushwork.” The hand is Zhu Xi’s; the carving came later. You bring the rubbing to the elder raising money for the bridge. He thinks it over and says: then all the more reason to fix it."

[outing_steps."map_chinese_academy:outing_chinese_academy_market:outing_chinese_academy_market_first"]
"name" = "The treasure fleet’s rutter"
"text" = "At a book stall in the lantern market, a man is selling a handwritten book of compass courses—straight off Zheng He’s treasure ships, he says, and it’s two taels of silver. The hired copyist at the next stall turns a couple of pages and frowns: he has seen this handwriting somewhere."

[outing_steps."map_chinese_academy:outing_chinese_academy_market:outing_chinese_academy_market_revisit"]
"name" = "Weight against weight"
"text" = "The next night you go back with your own small balance, or with a friend who can bargain. Set his weights against yours and they come up a tenth light. Your friend uses that to haggle, and somewhere in the haggling he admits he “borrowed” the book from a ship’s compass master."

[outing_steps."map_chinese_academy:outing_chinese_academy_market:outing_chinese_academy_market_solve"]
"name" = "The rutter goes home"
"text" = "The copyist’s ledger has it: last month he made a fair copy of this rutter for a compass master from Haicang. The book goes back, and the compass master turns to the last page and shows you a course added in red ink. All he says is: “This one isn’t in any book.”"

[outing_steps."map_chinese_academy:outing_chinese_academy_shore:outing_chinese_academy_shore_first"]
"name" = "A line on a sharp edge"
"text" = "Stone steps run down into the river, and on spring-tide days the sea pushes upstream and swallows three of them within two hours. A small boat is tied at the bottom, its line half worn through on a sharp edge of stone. The owner is nowhere in sight, and the tide is coming."

[outing_steps."map_chinese_academy:outing_chinese_academy_shore:outing_chinese_academy_shore_revisit"]
"name" = "A better hitch"
"text" = "You come back with a sailmaker’s palm, or call over a friend who knows lines. Splice the worn section, re-tie it so it clears the edge, and pad the spot where it touches stone with a scrap of old sacking."

[outing_steps."map_chinese_academy:outing_chinese_academy_shore:outing_chinese_academy_shore_solve"]
"name" = "Steady on the flood"
"text" = "When the tide surges in, the boat only rocks twice. The owner, a firewood seller, comes back, sees the new splice, and stands there staring. The next morning there’s a load of dry firewood at the school gate, no name attached."

[outing_steps."map_chinese_academy:outing_chinese_academy_path:outing_chinese_academy_path_first"]
"name" = "“Incense money” with a crooked seal"
"text" = "The path up the hill behind the Tianfei temple leads to a lookout over the sea. A man sitting on a rock halfway says you must pay incense money to go up, and waves a paper stamped with a red seal. The seal is crooked."

[outing_steps."map_chinese_academy:outing_chinese_academy_path:outing_chinese_academy_path_revisit"]
"name" = "Down by the pole star"
"text" = "You climb again with a kamal board, or with a friend who reads sky and tide. Wait on the lookout until the stars appear, take your bearing from the pole star, and go down the far side by the path the net-drying families use. Then you tell the temple’s Daoist priest."

[outing_steps."map_chinese_academy:outing_chinese_academy_path:outing_chinese_academy_path_solve"]
"name" = "Another way down"
"text" = "The priest says the temple has never collected money on the hill; that paper is an old talisman with the writing changed. The next day the rock halfway up is empty. The other path down goes into your notebook: where it’s steep, and where you can see the fishing lights at night."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_herbs:outing_korean_ryukyuan_home_herbs_first"]
"name" = "The underside of a leaf"
"text" = "The sea wind has bent every pine the same way, and mugwort grows thick at the edge of the grove. But in one patch the undersides of the leaves are green instead of silver-white. Pick the wrong plant for an old person’s moxa and it just smokes black."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_herbs:outing_korean_ryukyuan_home_herbs_revisit"]
"name" = "Crush and smell"
"text" = "A few days later you go back with a pen case, or with a friend who knows herbs. Compare both faces of both leaves, then crush one of each: real mugwort smells strong enough to make your eyes water; the other just smells green."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_herbs:outing_korean_ryukyuan_home_herbs_solve"]
"name" = "Moxa wool"
"text" = "The silver-backed, sharp-smelling one is mugwort; dried and rubbed, it gives up the soft wool that moxa is made of. The other patch is wild chrysanthemum—leave it to the bees. You bring the moxa to the old neighbor who coughed all winter, and he says this year’s burns more evenly than ever."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_cave:outing_korean_ryukyuan_home_cave_first"]
"name" = "The grotto sighs"
"text" = "At low tide a grotto opens under the reef, its water line above your head. Each time a wave draws back, a long sigh comes out of the dark. The women gathering shellfish say a dragon sleeps in there."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_cave:outing_korean_ryukyuan_home_cave_revisit"]
"name" = "The flame leans in and out"
"text" = "At the next low spring tide you go in with a beeswax candle, or close behind a friend who can draw a chart. The flame leans inward, then outward, then inward again. Deep inside is a ledge, and past it a narrow crack that runs through to the far side of the reef."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_cave:outing_korean_ryukyuan_home_cave_solve"]
"name" = "The dragon’s breathing"
"text" = "Waves push into the crack and squeeze back out, and that is the sigh. You chart the grotto as far as the ledge and give the map to the shellfish gatherers: when the sighing quickens, get out. They laugh and say the dragon is still a dragon—now they just know when it breathes."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_relic:outing_korean_ryukyuan_home_relic_first"]
"name" = "The “warding stone”"
"text" = "Half the old fort wall has fallen, and a carved stone is set into its base, the writing scoured by the sea wind down to half a line. The village says it’s a warding stone laid when the fort was built, carved with a curse. But what’s left looks more like names."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_relic:outing_korean_ryukyuan_home_relic_revisit"]
"name" = "A wet-paper rubbing"
"text" = "You come back with an ink case, or with a friend who writes a good hand. A wet-paper rubbing brings out one name after another, each followed by a village. It’s no curse. It’s a list of the people who came to build the wall."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_relic:outing_korean_ryukyuan_home_relic_solve"]
"name" = "The builders’ roll"
"text" = "The elders carry the rubbing from house to house and pick out the great-grandfathers of several families. The stone stays in the wall, but from then on someone always wipes the moss off it in passing."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_market:outing_korean_ryukyuan_home_market_first"]
"name" = "“Chinese satin”"
"text" = "At the evening market, Japanese merchants, local interpreters, and peddlers with shoulder poles crowd together, talking in several languages at once. One stall lays out a bolt of figured satin—a full bolt of Chinese satin, the seller says, off a big ship from across the water. The interpreter who writes contracts looks at an ink mark on the corner and starts paging through his ledger."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_market:outing_korean_ryukyuan_home_market_revisit"]
"name" = "What a bolt should weigh"
"text" = "The next evening you go back with a small balance, or with a friend who can bargain. He swears it’s a full bolt, but it weighs a third short—someone has already cut a length from it. Your friend trades words with him until it comes out that the satin was “collected” from the bottom of somebody’s chest."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_market:outing_korean_ryukyuan_home_market_solve"]
"name" = "Back to the chest"
"text" = "The interpreter’s ledger has it: the satin was part of a dowry when an old boat captain married off his daughter, and the missing length became the bride’s sleeves. The bolt goes back to his house. Running a thumb over the ink mark, he says that day was the proudest of his life."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_shore:outing_korean_ryukyuan_home_shore_first"]
"name" = "New oars, old line"
"text" = "The cove is flat as a mirror, and every mended boat is brought here first to try its oars. One small boat has brand-new oars and a mooring line worn to a few strands, and a knot of children argue, louder and louder, about how to splice it."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_shore:outing_korean_ryukyuan_home_shore_revisit"]
"name" = "Strand by strand"
"text" = "The next day you return with a sailmaker’s palm, or with a friend who knows rope. Cut out the rotten piece, weave the strands back one at a time, and bind the splice in old sailcloth. One by one the quarreling children edge over to learn."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_shore:outing_korean_ryukyuan_home_shore_solve"]
"name" = "The first stroke"
"text" = "With the line fixed, the owner lets you take the first stroke. The boat circles the cove and comes back to its mooring with the new splice holding firm. The old oar-maker on the shore slaps the gunwale: this one’s ready for open water."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_path:outing_korean_ryukyuan_home_path_first"]
"name" = "A stranger before the grove"
"text" = "Partway up the hill is a grove nobody ever cuts, with a cairn of stones before it; women whose men are at sea come here to pray for them. Today a stranger sits on the path and says you must pay to pass. No one has ever charged anything here."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_path:outing_korean_ryukyuan_home_path_revisit"]
"name" = "Around the hill by starlight"
"text" = "You go up again with a kamal board, or with a friend who reads sky and tide. Before full dark, fix the height of the pole star and follow the woodcutters’ trail along the ridge back to the village, never passing the man at all. As soon as you’re home, you tell the old woman who leads the rites."

[outing_steps."map_korean_ryukyuan_home:outing_korean_ryukyuan_home_path:outing_korean_ryukyuan_home_path_solve"]
"name" = "The ridge trail"
"text" = "The next day the old woman climbs the hill with a few others, and the stranger is long gone. The ridge trail goes into your notebook: where the pole star shows, and which pine to turn down at."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_herbs:outing_korean_ryukyuan_academy_herbs_first"]
"name" = "Three leaflets and an umbrella"
"text" = "On the slope grows a plant with three leaflets to a stem—pinellia, the teacher says, whose tuber clears phlegm. Beside it grows another whose leaflets spread like the ribs of an umbrella. One raw bite numbs your tongue for hours, and at a school for interpreters that’s worse than a caning."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_herbs:outing_korean_ryukyuan_academy_herbs_revisit"]
"name" = "Digging up the tubers"
"text" = "After class you go back with a pen case, or with a friend who knows herbs. Compare leaf and tuber one by one: pinellia’s tuber is small and round as a bead; the other is big and flat, ringed with tiny buds."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_herbs:outing_korean_ryukyuan_academy_herbs_solve"]
"name" = "Each in its place"
"text" = "The pinellia goes to the teacher, to be steeped in ginger juice before it’s fit for medicine; nobody touches it raw. The other is jack-in-the-pulpit—medicine too, but fiercer. The teacher pins the two drawings side by side on a classroom pillar."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_cave:outing_korean_ryukyuan_academy_cave_first"]
"name" = "A well that rises and falls"
"text" = "An old flagstone court lies before the grotto, as if someone once held rites here. In the dark inside is a pool of water, full in the morning and much lower half a day later. Your classmates say it’s a well that goes down to the dragon palace."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_cave:outing_korean_ryukyuan_academy_cave_revisit"]
"name" = "Light on the water"
"text" = "This time you carry a beeswax candle to the water’s edge, or follow a friend who can draw a chart. Hold the light over the pool and you see a slanting crack in the bottom, faint daylight beyond it, and seaweed drifting."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_cave:outing_korean_ryukyuan_academy_cave_solve"]
"name" = "The sea inside the hill"
"text" = "The crack runs to the sea: high tide, full pool; low tide, shallow pool. The “dragon well” is just a finger of the sea reaching into the hill. You hand the chart in at school, and the teacher says: whether there’s a dragon palace, who can say—but keep your feet out of that well."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_relic:outing_korean_ryukyuan_academy_relic_first"]
"name" = "Two hands"
"text" = "A pavilion for receiving guests once stood on this stone terrace by the sea. It fell long ago, but lines are still carved into the terrace. At school they say it’s an oath left by a foreign envoy, yet up close the writing is plainly in two different hands."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_relic:outing_korean_ryukyuan_academy_relic_revisit"]
"name" = "Rubbing the terrace"
"text" = "You go back with an ink case, or with a friend who writes a good hand. Take a rubbing of the terrace: one side is loose and sprawling, as if written after wine; the other is neat and careful, stroke by stroke, as if answering the first."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_relic:outing_korean_ryukyuan_academy_relic_solve"]
"name" = "Poem and reply"
"text" = "It’s two poems: one the envoy wrote as he left, and one a local interpreter wrote in reply on the same rhymes. There’s no oath at all. But when the old teacher sees the interpreter’s name, he laughs: it’s his own teacher’s teacher."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_market:outing_korean_ryukyuan_academy_market_first"]
"name" = "“Huizhou tribute ink”"
"text" = "At a paper-and-ink stall in the evening, the seller presents a few sticks of ink—Huizhou tribute ink, he says, carried all the way from Ming, at an outrageous price. The old servant who buys the school’s paper hefts one, shakes his head, and can’t say what’s wrong."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_market:outing_korean_ryukyuan_academy_market_revisit"]
"name" = "Weighing the ink"
"text" = "The next evening you go back with a small balance in your sleeve, or with a friend who can talk anyone around. Good ink is fine soot and heavy glue, far heavier than a block of wood its size; these sticks are oddly light. Your friend circles the question until the seller admits they come from a workshop at the edge of town."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_market:outing_korean_ryukyuan_academy_market_solve"]
"name" = "The ink shop at the edge of town"
"text" = "Following the seller’s trail, you find the ink-maker: a widow whose late husband learned the craft from an inkmaker out of Ming. Her ink isn’t from Huizhou, but it writes glossy and black. From then on the school buys its practice ink straight from her at a fair price, and she carves a tiny plum blossom on every stick."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_shore:outing_korean_ryukyuan_academy_shore_first"]
"name" = "A line worn deep"
"text" = "The end of the pier is the place to watch for sails, and families wait there when a boat is due home. A small sampan for ferrying people ashore is tied to a stone post, its line rubbed nearly through where it wraps the post. One more swell and it will part."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_shore:outing_korean_ryukyuan_academy_shore_revisit"]
"name" = "Where it wraps the post"
"text" = "You come back with a sailmaker’s palm, or with a friend who knows rope. Cut out the damaged stretch, splice it, and wrap old sailcloth where it turns around the post. The waiting women glance back at you, then turn to the sea again."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_shore:outing_korean_ryukyuan_academy_shore_solve"]
"name" = "A sail comes in"
"text" = "Toward evening a sail appears. The sampan casts off to bring the crew ashore and comes back with its line drawn in snug. The sailor who steps onto the pier doesn’t know you, but his daughter does: you’re the one who fixed the rope."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_path:outing_korean_ryukyuan_academy_path_first"]
"name" = "A straw rope across the path"
"text" = "Outside the hilltop shrine a path winds around the slope. Outsiders may not enter the shrine itself, but anyone may walk the path. Today, though, someone has stretched a straw rope across it, claiming this too is sacred ground: leave a handful of rice to pass."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_path:outing_korean_ryukyuan_academy_path_revisit"]
"name" = "Around with the tide"
"text" = "You come back with a kamal board, or with a friend who reads the tide. Work out how high the moon will stand when the tide is farthest out, then go around the hill by the beach it uncovers, never touching the rope. Back at school, you tell the keeper of the rites."

[outing_steps."map_korean_ryukyuan_academy:outing_korean_ryukyuan_academy_path:outing_korean_ryukyuan_academy_path_solve"]
"name" = "The path is open again"
"text" = "The keeper of the rites says the shrine has never taken rice, and certainly never roped off the path. The straw rope is pulled down and used to tie firewood. The beach route that opens and closes with the tide goes into your notebook, with the moon’s height drawn beside it."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_herbs:outing_southeast_asian_home_herbs_first"]
"name" = "A vine up the clove tree"
"text" = "A vine winds up the clove tree at the edge of the garden, and at its foot half a tuber pushes out of the earth, the very image of the purple yam steamed on the hearth. Every year before the rains the herbalist next door says the same thing: at the garden’s edge, be sure before you dig. Leave it alone for now."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_herbs:outing_southeast_asian_home_herbs_revisit"]
"name" = "Winged stem, thorned stem"
"text" = "You come back with a pen case, or with a friend who knows herbs. Follow the vine inch by inch. The yam trained on the rack behind the kitchen is the real one: a four-winged stem and a single heart-shaped leaf at each joint. This vine has fine thorns on the stem and its leaves in threes. Slice the tuber and the surface weeps a sticky yellow juice that itches wherever it touches."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_herbs:outing_southeast_asian_home_herbs_solve"]
"name" = "A yam that needs days in the stream"
"text" = "It’s poison yam. Eaten raw it brings dizziness and vomiting; it has to be sliced, rubbed with ash and left in running water for days before anyone dares eat it, and only in famine years does anyone bother. You draw this vine and the yam vine from behind the kitchen on one page, and the herbalist, after a look, scores a charcoal line on the trunk the poison one climbs."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_cave:outing_southeast_asian_home_cave_first"]
"name" = "Ticking in the dark"
"text" = "At the foot of the hill the stream turns into a black cave mouth, and the rainy-season water line on the wall is chest high. From inside comes a steady “tick… tick…” like a fingernail flicking stone. The grown-ups say only: don’t ask. That’s the cave’s keeper counting heads."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_cave:outing_southeast_asian_home_cave_revisit"]
"name" = "A bamboo ladder on the ledge"
"text" = "This time you go in with a beeswax candle, or behind a friend who can draw a chart. The light climbs the roof and finds it plastered with small swifts; the ticking is how they find their way in the dark. A bamboo ladder leans against the ledge, its rungs polished by hands."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_cave:outing_southeast_asian_home_cave_solve"]
"name" = "What counts heads"
"text" = "The ladder belongs to the swift-nest gatherers. Your chart ends at the ledge: once the water passes the third rung, no one goes in. The old keeper nails it to the tree at the mouth and says what counts heads in there isn’t a ghost. It’s the flood."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_relic:outing_southeast_asian_home_relic_first"]
"name" = "Half a line of old script"
"text" = "A row of black wooden blocks, each thick as a man’s waist, stands on the river bend; the villagers say they are what’s left of “the ungrateful son’s great ship.” Beside them a stone bears half a line of curls and hooks that nobody can read, and children love to scratch their own names next to it with a fingernail."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_relic:outing_southeast_asian_home_relic_revisit"]
"name" = "Old cuts, fingernail scratches"
"text" = "You return with an ink case, or bring along a friend with a fine hand. Brush off the mud and take a rubbing, and the deep strokes part company with the children’s scratches. Among the old cuts is one word that the shipwright who tends the blocks knows at a glance. He reads it aloud: “Mother.”"

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_relic:outing_southeast_asian_home_relic_solve"]
"name" = "Set down for a mother"
"text" = "The whole line reads at last: a son set down these blocks for his mother so she could sit at her door and watch the boats go out and come back. Parents still frighten children with the tale of the ship turned to stone, but now someone adds: that ship was never here."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_market:outing_southeast_asian_home_market_first"]
"name" = "Camphor from Barus"
"text" = "At dusk the vegetable boats and betel boats all squeeze into the river bend, paddle against paddle. On one sampan lies a small heap of white crystals. Barus camphor, the boatman says, and a lump costs a measure of pepper. The old man on the next boat, who weighs spices for a living, leans over, sniffs, pulls his hand back, and says nothing."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_market:outing_southeast_asian_home_market_revisit"]
"name" = "Weigh it, float it"
"text" = "The next evening you come back with a small balance, or with a friend who can haggle. Real camphor is light and, dropped in a bowl of water, floats and skitters about; these lumps weigh far too much and sink straight to the bottom. Your friend gets the boatman talking about candle prices, and he preens and lets it slip: leftover wax mixed with rice flour."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_market:outing_southeast_asian_home_market_solve"]
"name" = "Camphor made of wax"
"text" = "The old weigher knows him: the second son of the candle shop upriver. He makes the boy refund every sale, boat by boat, and for each boat repaid he takes back one lump of “camphor.” When the sampan paddles off, its hold is heaped with wax again, not a lump missing, and the boy’s purse is empty."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_shore:outing_southeast_asian_home_shore_first"]
"name" = "A line licked ragged"
"text" = "The tide has gone out and a few small boats lie tilted on the mud. The line of the outermost one is frayed halfway through; a water buffalo has just been by to lick the salt off it. The children are red in the face arguing over which knot will mend it, and the tide is an hour from turning."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_shore:outing_southeast_asian_home_shore_revisit"]
"name" = "Coir, strand by strand"
"text" = "The next day you come with a sailmaker’s palm, or with a friend who knows rigging. Cut out the licked stretch, tuck the coir strands back one by one, and wrap the splice in fiber. The buffalo wanders over again, and the children shoo it off with a shout."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_shore:outing_southeast_asian_home_shore_solve"]
"name" = "A twist of salt"
"text" = "The tide creeps in, the boat lifts, and the line takes the strain and holds without a shiver. The owner, a hunchbacked old man who boils sea salt, doesn’t say thank you. He presses a twist of salt into your hand: “Thanks melt away. This keeps.”"

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_path:outing_southeast_asian_home_path_first"]
"name" = "A toll in offerings"
"text" = "A man squats in the middle of the path up to the old banyan on the slope and says that anyone who wants to make a wish must leave a handful of sticky rice as an offering. The old people on the hill have never mentioned any such rule. Porters keep coming up the slope in knots of three and four, and however loud he talks he won’t dare lay a hand on anyone; you needn’t face him down by yourself."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_path:outing_southeast_asian_home_path_revisit"]
"name" = "The ray in the southern sky"
"text" = "You climb again with a kamal board, or with a friend who reads tide and sky. At dusk, wait for the stars of the southern sky to settle into the shape sailors call the ray, measure how high it stands, and take the woodcutters’ trail along the ridge down the far side, never passing the man at all. Back in the village you tell the old woman who keeps the tree."

[outing_steps."map_southeast_asian_home:outing_southeast_asian_home_path:outing_southeast_asian_home_path_solve"]
"name" = "The woodcutters’ trail"
"text" = "The tree’s keeper hears you out, takes up her stick and sets off up the hill, and the man who blocked the path has vanished without a trace. The woodcutters’ ridge trail goes into your notebook: where to take your sighting, and to turn down beside the boulder shaped like a buffalo’s back."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_herbs:outing_southeast_asian_academy_herbs_first"]
"name" = "The bamboo in flower"
"text" = "In the bamboo grove behind the school one clump has flowered, and the ground beneath it is strewn with grains so thick they can’t be swept up. The old women say bamboo flowering is a bad omen, a sign of famine, but a classmate has pocketed a handful to cook. Don’t eat it yet, and don’t throw it away."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_herbs:outing_southeast_asian_academy_herbs_revisit"]
"name" = "Rice and bamboo rice"
"text" = "Next time you bring a pen case, or a friend who knows herbs. Lay the bamboo grains beside rice: they are thicker, with a deep groove and a pointed husk, and smell of sweet green bamboo with nothing bitter or numbing in it. You boil a little pot, and everyone takes just one mouthful."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_herbs:outing_southeast_asian_academy_herbs_solve"]
"name" = "Bamboo rice and rats"
"text" = "It’s bamboo rice, faintly sweet and fit to eat. The old women’s warning has something behind it, too: when bamboo flowers, field rats come, and where rats come, granaries suffer. The school moves its rice jars up onto the raised floor, slips an upturned clay bowl over each post, and plugs the rat holes in the grove one by one with mud."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_cave:outing_southeast_asian_academy_cave_first"]
"name" = "The cave that swallows a stream"
"text" = "The little stream at the foot of the hill runs up to the cliff and vanishes, leaving a black crack with a mud line above head height. Each time the water goes down there is a long “glug.” Your classmates say a naga lies coiled beneath the hill and drinks the stream a mouthful at a time."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_cave:outing_southeast_asian_academy_cave_revisit"]
"name" = "The leaf boats go first"
"text" = "You come back holding a beeswax candle, or following a friend who can draw a chart. In the light the stream slides down a slanting slot beneath a narrow ledge. The children’s folded banana-leaf boats go in one after another, and not one of them floats back."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_cave:outing_southeast_asian_academy_cave_solve"]
"name" = "The spring behind the hill"
"text" = "Around the back of the hill, beside the spring where the water comes out, a soaked leaf boat is bobbing. The stream simply passes through the belly of the hill. Your chart ends at the ledge with a line added beside it: once the water passes the second mud line, stay out. Your classmates still say it’s the naga drinking, but nobody throws stones in anymore."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_relic:outing_southeast_asian_academy_relic_first"]
"name" = "The giant’s bed"
"text" = "Deep in the grove stands a red-brick platform split open by banyan roots, which the villagers call the bed a giant once slept on. A stone slab caps its edge, with a row of small mossy notches that children use as hopscotch squares, and the brick joints are scratched all over with lines drawn with pebbles."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_relic:outing_southeast_asian_academy_relic_revisit"]
"name" = "Notches along the edge"
"text" = "You go back with an ink case on your shoulder, or with a friend who has a clerk’s hand. Scrape off the moss and take a rubbing, and the children’s scribbles fall away, leaving the old cuts: along the stone slab runs a tidy row of small notches, and beside each notch stands a sign, a month."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_relic:outing_southeast_asian_academy_relic_solve"]
"name" = "A calendar of winds"
"text" = "The signs read out as a table of winds: which month the east wind rises, which month the west wind comes, which month the sea falls still. The platform was a harbor official’s wind calendar, so seafarers could count their days against the notches. The old fisherman who lives at the edge of the grove holds your rubbing against his own tally stick and says the village runs a good half month behind the stone."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_market:outing_southeast_asian_academy_market_first"]
"name" = "“Fine paper from Fujian”"
"text" = "When the lamps are lit, the paper sellers’ stalls line the bank under their palm-leaf awnings. One of them is selling a bundle of “fine Fujian paper” by weight at a frightening price, thick and smooth to the touch. The old man at the next stall, who writes letters home for sailors, holds a sheet up to the lamp and mutters something to himself."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_market:outing_southeast_asian_academy_market_revisit"]
"name" = "A drop of ink"
"text" = "A night later you come back with a small balance, or with a friend who can talk anyone around. A bundle of honest paper of the same size weighs far less than this one. The old man drips a drop of ink on a sheet, and the bead rolls about on top and won’t soak in. Your friend chats the seller up until it comes out that the pulp was loaded with white clay to make it weigh."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_market:outing_southeast_asian_academy_market_solve"]
"name" = "By the sheet, not by the pound"
"text" = "The seller bluffs for a while, then hands back the extra he took. The old man has a cousin upriver who makes his own paper by beating tree bark: thin, rough, and thirsty for ink. From then on the school buys its paper from him, counted out sheet by sheet, and nobody pays by the pound."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_shore:outing_southeast_asian_academy_shore_first"]
"name" = "A loosened outrigger"
"text" = "The river bend runs slow, so every newly carved paddle and new boat is brought here to be tried. One small boat’s outrigger float has come loose, its lashing half chafed through, and the float cocks sideways with one end dug into the water. A few children argue over whether to lash it with rattan or coir rope, neither giving way, while the boat rocks in the shallows."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_shore:outing_southeast_asian_academy_shore_revisit"]
"name" = "Rattan in a cross lashing"
"text" = "The next day you arrive with a sailmaker’s palm on your hand, or with a companion who knows rigging at your elbow. Strip off the chafed lashing, then bind the float to its two cross-poles with rattan in a tight cross, each turn pressed over the last, and finish with a tucked knot. The two loudest arguers each seize an end of the rattan and haul it taut for you."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_shore:outing_southeast_asian_academy_shore_solve"]
"name" = "“Not bad”"
"text" = "The boat goes in; one stroke and the float rides true, the hull slicing the water steadily. The owner, a ferryman’s daughter a few years younger than you, walks three times around the boat, shoves the float with her hand, and when it doesn’t budge says, reluctantly, “Not bad.”"

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_path:outing_southeast_asian_academy_path_first"]
"name" = "The betel box on the mat"
"text" = "The teaching ground sits in a ring of old trees on the hilltop. A mat is spread across the foot of the steps with a betel box on it, and the man sitting there says new pupils must “offer a quid” before they go up. He says it so smoothly it sounds rehearsed. Porters are climbing behind you; don’t argue with him alone."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_path:outing_southeast_asian_academy_path_revisit"]
"name" = "Herons going home"
"text" = "You return with a kamal board, or with a friend who reads sky and water. At dusk the herons stream into the bamboo to roost; you take the height of the first bright star, follow the line the birds fly, and find a path the water-carriers use, which skirts the mat altogether. At the top, the first thing you do is tell the teacher."

[outing_steps."map_southeast_asian_academy:outing_southeast_asian_academy_path:outing_southeast_asian_academy_path_solve"]
"name" = "No fee for a lesson"
"text" = "The teacher laughs out loud: lessons here have never cost anything, and the man is a pupil sent away years ago who wanted a quid of betel to chew. The next day the mat is gone. The water-carriers’ path goes into your notebook, along with the hour when the herons fly."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_herbs:outing_mesoamerican_home_herbs_first"]
"name" = "Another bush beside the chaya"
"text" = "The little plot at the edge of the forest belongs to the woman next door, and it’s planted with chaya, whose young leaves make the best soup. Beside it has come up a bush that looks almost the same, its leaves cut into fingers like theirs, but with a fine fuzz over the stems. She doesn’t even look up. If you don’t know it, don’t pick it, she says. Leave it alone for now."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_herbs:outing_mesoamerican_home_herbs_revisit"]
"name" = "Fuzz on the stem"
"text" = "You go back with your pen case, or bring a friend who knows herbs along. Compare leaf, stem, and sap one by one: chaya’s stem is smooth and weeps white milk when snapped, while the fuzz on this bush is really fine stinging bristles. Nudge them with a grass stalk, brush a fingertip across, and a patch of red welts rises on the spot."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_herbs:outing_mesoamerican_home_herbs_solve"]
"name" = "Boiled through, then eaten"
"text" = "The stinging bush is pulled up and burned. The woman next door picks a handful of the real chaya and boils it a full quarter hour before it reaches the table. “Raw, it poisons. Remember that.” Then she ties a loop of cotton thread around the stem of every chaya plant, so that anyone sent to pick will know."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_cave:outing_mesoamerican_home_cave_first"]
"name" = "Knocking from the well"
"text" = "In the forest lies a natural well, stone steps leading down, fig roots hanging over the rim, the water shining far below. Something down there is knocking: tock… tock… and a pause, and tock again. The adults won’t let children come alone. It is the rain god Chaak’s well, they say, and he is working in it."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_cave:outing_mesoamerican_home_cave_revisit"]
"name" = "The green line on the steps"
"text" = "This time you go down with a beeswax candle, or behind a friend who can draw a chart. In the light the steps turn green with slime from the twelfth step on, and below that they are slick. A thread-thin fig root hangs to the water, a bead swelling at its tip, and each drop falls onto a thin slab of stone. Tock."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_cave:outing_mesoamerican_home_cave_solve"]
"name" = "The twelfth step"
"text" = "The knocking turns out to be beads of water dripping from the fig root onto the thin slab, at such uneven intervals that it sounds like someone at work. Your chart stops at the twelfth step, with a charcoal line drawn beside it: children go no lower. The elders still say the well is Chaak’s, and before going down you should say a quiet word to it. You do, and the knocking sounds a little less frightening."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_relic:outing_mesoamerican_home_relic_first"]
"name" = "Half a line of squares"
"text" = "In the forest behind the village stands a fern-covered stone platform. Half a slab leans at its edge, carved with small squares like a row of little faces, and in the gaps some child has drawn grimacing faces in charcoal. The old people say a king of long ago sat here to watch the sea. But those squares don’t look like they say anything about a king."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_relic:outing_mesoamerican_home_relic_revisit"]
"name" = "Two village names"
"text" = "You return with an ink case, or with a friend who writes a good hand. Wash the stone and take a rubbing; the charcoal faces wipe off, leaving two village names among the squares with a string of dots and bars between them, a number. The village headman says there is another half-slab standing at the salt flats down the coast."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_relic:outing_mesoamerican_home_relic_solve"]
"name" = "The line, joined"
"text" = "You carry the rubbing to the salt flats and set it beside the half-slab there, and the two fit into one full line: the two villages share these salt pans, and the stone is their witness. Each New Year people from both sides walk the boundary and wipe their halves clean. No king at all. “No wonder,” the old people say, scratching their heads, “we always had to wipe the stones together.”"

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_market:outing_mesoamerican_home_market_first"]
"name" = "Good beans from the Bay of Honduras"
"text" = "At dusk the cacao sellers light little cookfires along the village road. One of them slaps a bulging sack: first-grade beans from the Bay of Honduras, he says, each worth two of anyone else’s. The village scribe, who keeps the accounts, counts them out in piles of twenty, and as he counts his brow begins to knit."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_market:outing_mesoamerican_home_market_revisit"]
"name" = "Twenty beans on the scale"
"text" = "The following evening you go again with a small balance, or with a friend who knows how to bargain. Twenty of his beans sit heavier than twenty of your own, and when you pinch one, the husk cracks and inside is a pellet of packed clay under a dusting of cacao. Your friend circles the price with him until it comes out that at least three beans in ten are fake."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_market:outing_mesoamerican_home_market_solve"]
"name" = "Beans with clay hearts"
"text" = "The seller goes red and says an upriver dealer palmed the sack off on him. The scribe makes him pour it all out on a mat, set the sound beans aside, and smash each clay bean on a stone before the onlookers. The next day a small wooden sign hangs over his stall: beans here may be squeezed before you buy."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_shore:outing_mesoamerican_home_shore_first"]
"name" = "A line frayed on oyster shells"
"text" = "Several dugout canoes are tied up in the shallows by the mangroves, their lines looped around prop roots crusted with sharp oyster shells. On one of them the henequen rope has been sawed down to a few strands, and some children are quarreling about how to splice it with the tide almost on them."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_shore:outing_mesoamerican_home_shore_revisit"]
"name" = "Tie it somewhere else"
"text" = "This time you have brought a sailmaker’s palm, or someone who knows rigging to lend a hand. Follow the line to the stretch the oyster shells have worn thin and cut it out, then tuck the henequen strands of the two ends back together and bind the splice with twisted palm fiber. The children scramble to pass you fibers, each trying to be quickest. The loop moves to a root with no oyster shells on it."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_shore:outing_mesoamerican_home_shore_solve"]
"name" = "Tomorrow, the steering paddle"
"text" = "The tide climbs the prop roots and the canoe floats up and pulls the loop taut, but it holds fast on the clean root without a creak. The owner, a salt carrier, comes back, runs his thumb over the splice and doesn’t thank you. He just says that tomorrow you can cross the channel with him and take the steering paddle for a stretch."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_path:outing_mesoamerican_home_path_first"]
"name" = "A man who says he collects tribute"
"text" = "Nobody has worshipped at the old temple on the slope for years, but the path that winds around it is walked daily. Today a stranger stands in the middle, claims he collects road tribute for the encomendero—twenty cacao beans a head—and waves a sheet of bark paper with a red seal. Villagers bound for the fields are strung out along the slope below, so there’s no need to take him on alone."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_path:outing_mesoamerican_home_path_revisit"]
"name" = "Counting the Pleiades"
"text" = "You climb the slope again at night with a kamal board around your neck, or with a friend who reads stars and tides. Wait until the Pleiades climb overhead, measure their height to judge the hour, then take the path the beekeepers have worn around the man, and you are home before dawn. In the village you tell the old man who keeps the ground around the temple."

[outing_steps."map_mesoamerican_home:outing_mesoamerican_home_path:outing_mesoamerican_home_path_solve"]
"name" = "The beekeepers’ trail"
"text" = "The old man gives a short laugh: tribute is collected in town, before the scribe, never on a path. He takes two men up the slope, and the self-styled collector is long gone, his bark-paper “warrant” stuffed into a crack between stones. The beekeepers’ trail goes into your notebook: which stretches are thick with bees, and which tree gives shade enough to rest."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_herbs:outing_mesoamerican_academy_herbs_first"]
"name" = "The black tree by the wall"
"text" = "In the friary orchard the sour orange and pomegranate trees stand in tidy rows, but by the wall grows one black-barked tree whose trunk weeps dark resin and whose leaves shine as if lacquered. A little boy who leaned on it yesterday has a patch of blisters up his arm today."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_herbs:outing_mesoamerican_academy_herbs_revisit"]
"name" = "Bark and leaf"
"text" = "Pen case in hand, or a friend who knows herbs at your side, you come back. Compare bark, leaf, and resin: the black resin dries into a tarry crust and stains a knife dark. Beside it stands another old tree whose reddish-brown bark peels off in thin sheets, like skin after too much sun."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_herbs:outing_mesoamerican_academy_herbs_solve"]
"name" = "The cure at the poison’s foot"
"text" = "The black one is poisonwood, and touching it blisters the skin. The red-barked tree is its neighbor, and the old man who keeps the orchard says the two always grow side by side: the cure stands at the poison’s foot. A wash made from the red bark, laid on the boy overnight, takes the blisters down. The friar has stones piled around the black tree and whitewashed."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_cave:outing_mesoamerican_academy_cave_first"]
"name" = "The well that answers the bell"
"text" = "In the grotto behind the forecourt is a small well, and whenever the bell rings it hums back, a low note, as though someone beneath the water were answering. The younger children say a person who won’t go to sleep lives in the well. The mouth of the grotto is low; you have to stoop to enter."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_cave:outing_mesoamerican_academy_cave_revisit"]
"name" = "The flame shivers with the bell"
"text" = "You climb down again with a beeswax candle alight, or with a friend who can draw a chart leading the way. When the bell tolls, the flame trembles and rings spread across the water. Overhead is a rounded vault, and under it a ledge, beyond which steps run down to the water, the lower half green with moss."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_cave:outing_mesoamerican_academy_cave_solve"]
"name" = "The well that gives the pitch"
"text" = "When the bell stops, the hum hangs under the vault for half a breath more: the sound slips into the dome and bounces over the water until it settles into one low note. Your chart ends at the ledge with a line scrawled beside it: steps only to the ninth, slippery below. The choirboys find that a hum at the water’s edge comes back thick and long, and from then on they come here to find their pitch before singing practice."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_relic:outing_mesoamerican_academy_relic_first"]
"name" = "Squares on the doorstep"
"text" = "The back court of the friary is paved with stones of every size, some still showing carved edges. The kitchen doorstep is a slab broken across, its face stamped with rows of small squares worn so shallow that they show only when rain pools in them. The friar calls them marks of a false god. The old woman who sweeps says they are “days.”"

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_relic:outing_mesoamerican_academy_relic_revisit"]
"name" = "A row of days"
"text" = "You come back with the ink case under your arm, or with a friend whose handwriting is good. Before the kitchen fire is lit, wash the doorstep and take a rubbing: the squares hold numbers, day names, and beside them a shape like a hill and a hand together. A young assistant at the friary who knows the old script glances at it and holds up five fingers."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_relic:outing_mesoamerican_academy_relic_solve"]
"name" = "Five"
"text" = "The assistant reads it out: the squares say “five,” with the mark of a small hill beside it, and together they are the old name of the town, T’ho, the place of five. Everyone knows the friary stands on the old town, but this is the first time anyone has seen it write its own name. The rubbing goes up on the kitchen wall, and the doorstep is left for feet as before."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_market:outing_mesoamerican_academy_market_first"]
"name" = "“Cochineal red”"
"text" = "At the little market outside the friary, a thread seller’s stall is hung with skeins of red. Dyed with cochineal, the seller says, redder than blood, thirty cacao beans a skein. The midwife who teaches you weaving walks by, rolls a strand between her fingers, holds it up to the sun, glances at the jar of water at the seller’s feet, and says nothing."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_market:outing_mesoamerican_academy_market_revisit"]
"name" = "What a skein should weigh"
"text" = "The next day you go back with the balance at your belt, or with a friend who can wear down a price. A skein of his thread comes down much heavier than the same length of good thread, and when he turns away you dip one strand into his jar of water, which at once blooms purple. Your friend keeps him talking price until he lets it slip: cheap dyewood, soaked in mud to add weight."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_market:outing_mesoamerican_academy_market_solve"]
"name" = "A red that doesn’t wash out"
"text" = "The seller goes red and has to reprice everything at dyewood rates. The midwife buys up the rest for her pupils to practice braiding, then digs a small skein of real cochineal from the bottom of her own chest and tells you to wash it in water. The water stays clear and the thread stays red."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_shore:outing_mesoamerican_academy_shore_first"]
"name" = "A torn sail"
"text" = "One end of the creek fork opens to the sea. A sudden squall in the night has ripped a gash in a canoe’s cotton sail, and the owner needs it to put out at dawn. A knot of children stand around arguing about what needle and thread to use, and none can talk the others round."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_shore:outing_mesoamerican_academy_shore_revisit"]
"name" = "A maguey spine for a needle"
"text" = "You go back to the fork wearing a sailmaker’s palm, or with someone who knows rigging beside you. A maguey spine with a twist of its own fiber still attached makes needle and thread in one; the thick cotton won’t let it through, so you push it with the palm, stitch by stitch, with the patch cut three fingers wider than the tear."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_shore:outing_mesoamerican_academy_shore_solve"]
"name" = "The dawn land breeze"
"text" = "At first light the land breeze comes off the forest. The canoe raises its mended sail, which fills tight, and with its bow lifting slides out of the fork. The owner calls something back, but the wind scatters the words; all you can see is his finger pointing at the patch."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_path:outing_mesoamerican_academy_path_first"]
"name" = "A paper with a wax seal"
"text" = "An old path runs through the woods behind the friary to a stone outlook with a view of the sea. Today a man stands in the middle of it and says the path has been enclosed by the encomendero: ten cacao beans a head to pass, and he holds up a paper with a wax seal. He holds it high, yet he never looks at it. Two men with loads of firewood are heading the same way not far behind you, so you needn’t have it out with him alone."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_path:outing_mesoamerican_academy_path_revisit"]
"name" = "Where Venus rises"
"text" = "You go back into the woods with the kamal board at your waist, or with a friend who reads sky and tide. In the small hours Venus lights up in the east; measure its height above the horizon, follow that bearing to a trail the lime burners use, and slip around the man back to the friary. First thing in the morning, you tell the friar who teaches the pupils."

[outing_steps."map_mesoamerican_academy:outing_mesoamerican_academy_path:outing_mesoamerican_academy_path_solve"]
"name" = "A page of the catechism"
"text" = "The friar sends someone up the path. The man with the paper has slipped away, and only the paper is left, blown into the brush: a page of the catechism with a blob of wax pressed on it. The friar slips it into a book and says that the day he lectures on what a warrant is, he’ll use it as his example. The lime burners’ trail goes into your notebook: where the sea shows through the trees, and which cracks in the rock seep water."

[outing_steps."map_andean_home:outing_andean_home_herbs:outing_andean_home_herbs_first"]
"name" = "Two clumps like mint"
"text" = "Under the huarango trees on the riverbank grow two clumps that both look like the wild mint the village herb woman boils for stomachaches. Lean close to one and it smells nothing like mint, only heavy and fishy. The old llama tethered under the tree will graze only the other. Pick nothing yet, and taste nothing."

[outing_steps."map_andean_home:outing_andean_home_herbs:outing_andean_home_herbs_revisit"]
"name" = "Square stem, round stem"
"text" = "You go back with the pen case slung on your shoulder, or with a friend who knows herbs. Pinch a leaf from each clump and rub it in your palm, snap a bit of stem from each, and draw as you sniff. The mint’s stem is square when you squeeze it, its leaf edge finely toothed. The other stem is round and thick as a little finger, and when you snap it a heavy, stale stink comes out."

[outing_steps."map_andean_home:outing_andean_home_herbs:outing_andean_home_herbs_solve"]
"name" = "The red knot"
"text" = "The round-stemmed clump is thorn apple, chamico in the valley speech, and two mouthfuls would have you raving. The herb woman looks over your drawings, pulls a strand of red wool from her belt and knots it around the stalk. Red knot means hands off, she tells the children crowding round. The old llama tethered under the tree snorts, as if it agreed."

[outing_steps."map_andean_home:outing_andean_home_cave:outing_andean_home_cave_first"]
"name" = "Two notes from the dark"
"text" = "At the dry valley’s end the cave mouth is caked with cracked mud, and the mud line stands above your head, left by some flood from the hills that nobody can date. From inside come two notes, one high and one low, like someone far off playing panpipes. A cool wind is blowing out."

[outing_steps."map_andean_home:outing_andean_home_cave:outing_andean_home_cave_revisit"]
"name" = "Following the notes"
"text" = "By the old custom you spill a few drops of chicha on the ground before going in. Then light a beeswax candle, or let a friend who can draw a chart lead. You wind a strand of llama-wool yarn around a fingertip, and its loose end streams back toward the mouth the whole way as the two notes swell. At a chest-high ledge you find two narrow cracks in the roof, with the wind sucking and blowing through them. You chart the cave as far as the ledge and go no deeper."

[outing_steps."map_andean_home:outing_andean_home_cave:outing_andean_home_cave_solve"]
"name" = "The cave breathes"
"text" = "The llama herder hears you out and says the cave breathes out in the afternoon and in at nightfall, so the cracks sing only in the afternoon and go quiet at dusk. You hand the chart to the village. In the rainy season the children are still kept out, but in the afternoon they may crouch at the mouth and listen."

[outing_steps."map_andean_home:outing_andean_home_relic:outing_andean_home_relic_first"]
"name" = "Pits in the doorsill"
"text" = "Only the stone footings of a row of old storehouses remain on the slope. On the doorsill of the highest one is a line of small pits, the other half of the line worn smooth. The old folks say this is where the Inca’s raft fleet was counted before it put to sea. But however you count these pits, they don’t look like a fleet."

[outing_steps."map_andean_home:outing_andean_home_relic:outing_andean_home_relic_revisit"]
"name" = "Deep and shallow"
"text" = "You come back with an ink case, or with a friend who writes a good hand. Lay damp paper on the stone and pat out the pits one by one. The deep ones sit in three places, left, middle and right, evenly spaced, with the right-hand place left empty; the shallow, wobbly ones were added for fun by herd children with a sharp stone. Strike those out and what remains is the old carving."

[outing_steps."map_andean_home:outing_andean_home_relic:outing_andean_home_relic_solve"]
"name" = "The count of a storehouse"
"text" = "Read the pits the way a cord is read, by place value: three on the left, two in the middle, none on the right. That makes three hundred twenty baskets of maize. It was never a fleet; it was the stock of this storehouse. You hand the rubbing to the old cord-keeper who minds the site. He rolls it up and slips it into the cord store, and leaves the stone on its doorsill for the children to keep guessing at."

[outing_steps."map_andean_home:outing_andean_home_market:outing_andean_home_market_first"]
"name" = "Beads from beyond the sunset"
"text" = "The dusk market’s oil lamps come on one by one, and a man holds up a string of red spondylus beads. They drifted in from islands beyond the sunset, he says, and the price makes you wince. At the next stall the cord-keeper doesn’t look up. His fingers run slowly down a cord and stop at one place."

[outing_steps."map_andean_home:outing_andean_home_market:outing_andean_home_market_revisit"]
"name" = "The scale meets the knots"
"text" = "The next evening you return with a small balance, or with a friend who can talk anyone round. The string goes on the scale, and its weight is exactly the number tied into the cord-keeper’s knots, not a bead off. Your friend probes with one easy question after another, until the man gives in: he picked it up on the beach after a big surf. There is no island in the west."

[outing_steps."map_andean_home:outing_andean_home_market:outing_andean_home_market_solve"]
"name" = "One more knot"
"text" = "The cord-keeper ties a new knot in the cord as a receipt for the return, and sends someone to carry the beads to a raft-maker’s house. The woman there winds them around her wrist and says, after a while, that the surf had flipped her little raft that day and she cried all night. The finder gets a sack of toasted maize for his trouble and takes himself off."

[outing_steps."map_andean_home:outing_andean_home_shore:outing_andean_home_shore_first"]
"name" = "A frayed mooring"
"text" = "In the shallow inlet a little reed boat is tied to a rock, its line rubbed down to a few strands where it scrapes the stone. The children on the beach have split into two camps, one shouting for a “llama-hoof knot,” the other for a “gull-foot knot,” red in the face. And the tide is coming up."

[outing_steps."map_andean_home:outing_andean_home_shore:outing_andean_home_shore_revisit"]
"name" = "Splice and wrap"
"text" = "The next day you come back with a sailmaker’s palm strapped on, or failing that, a friend who knows rigging. Cut out the chafed stretch, lay the strands back together one by one, and wrap a strip of wet hide around the part that touches stone. Neither camp says a word. Neither knot was right; the line needed a splice."

[outing_steps."map_andean_home:outing_andean_home_shore:outing_andean_home_shore_solve"]
"name" = "Hauled to where they can see it"
"text" = "Before the tide comes in, the children haul the boat over rolling logs, chanting, and park it at the feet of the grown-ups drying fish at the raft yard. The owner, an old man who twists cordage, runs a thumb over the splice. He doesn’t praise you; he just presses a small coil of fresh-twisted fiber cord into your hand: for practice, until you can tie it with your eyes shut."

[outing_steps."map_andean_home:outing_andean_home_path:outing_andean_home_path_first"]
"name" = "“Mountain money” at the cairn"
"text" = "Beside the cairn at the pass a man bars the way. Every traveler must add a stone and also pay a copper coin of “mountain money,” he says, by the mountain’s own rule. Llama drivers are strung out ahead and behind, and not one of them wants to go up against him alone."

[outing_steps."map_andean_home:outing_andean_home_path:outing_andean_home_path_revisit"]
"name" = "Reading the Cross"
"text" = "You climb again with a kamal board, or with a friend who reads the tides and the sky. After dark, measure how high the Southern Cross stands, chakana the herders call it, and judge the hour of the night. Its angle points to a herders’ path that winds around the cairn and down to the rest-house on the slope. Once there, you tell the keeper."

[outing_steps."map_andean_home:outing_andean_home_path:outing_andean_home_path_solve"]
"name" = "No such rule"
"text" = "The rest-house keeper snatches a staff from beside the door and strides toward the pass, muttering the elders’ three sayings: don’t steal, don’t lie, don’t be lazy. The man has vanished, leaving only a few fresh stones on the cairn. The herders’ path goes into your notebook, down to the third cairn where you turn."

[outing_steps."map_andean_academy:outing_andean_academy_herbs:outing_andean_academy_herbs_first"]
"name" = "Tags out of place"
"text" = "Every plant on the herb slope has a stake beside it, wrapped with a bit of knotted cord as its label: two knots for fever, three for washing wounds. Last night goats broke in and kicked a row of stakes crooked, and some cords have wound around the wrong ones. A classmate with a fever is lying in bed waiting for medicine. Don’t brew anything yet."

[outing_steps."map_andean_academy:outing_andean_academy_herbs:outing_andean_academy_herbs_revisit"]
"name" = "Touch and sniff"
"text" = "After lessons you come back with a pen case, or with a friend who knows herbs. Draw the two narrow-leaved shrubs side by side and note every trait. One feels sticky and smells of resin when crushed. The other is smooth, and its bark tastes bitter. The knots on the tags do not match what the leaves feel like."

[outing_steps."map_andean_academy:outing_andean_academy_herbs:outing_andean_academy_herbs_solve"]
"name" = "Feel first, then trust the cord"
"text" = "The sticky one is chilca, good only for washing wounds and rubbing sprains. The smooth one is willow, and only its bark boiled in water brings a fever down. Had you brewed by the two knots on the crooked stake, your feverish classmate would have drunk resin water. You set the stakes upright one by one. The old man who keeps the garden eyes your resin-smeared fingers and grunts: feel first, then trust the cord."

[outing_steps."map_andean_academy:outing_andean_academy_cave:outing_andean_academy_cave_first"]
"name" = "Counting in the dark"
"text" = "Halfway up the slope stands an old storehouse, half cut into the hill, with water stains on the stone beside its doorway, out of reach overhead. From inside comes a soft tick, tick, tick, like someone counting in the dark, while a cool wind breathes out in gusts. The older pupils say it is the old keeper’s ghost, taking stock."

[outing_steps."map_andean_academy:outing_andean_academy_cave:outing_andean_academy_cave_revisit"]
"name" = "Cords on every wall"
"text" = "You go in holding a beeswax candle, or following a friend who can draw a chart. The flame leans outward and lights pegs on every wall, each hung with strings of old knotted cord, and when the wind stirs they knock their knots together. At the back, a knee-high ledge marks where the floor has slumped into wet earth. Nobody goes past the ledge; the chart stops there, and the deeper part is left to the grown-ups."

[outing_steps."map_andean_academy:outing_andean_academy_cave:outing_andean_academy_cave_solve"]
"name" = "The counting wind"
"text" = "The wind pours down from a stone-lined shaft in the roof, left by the storehouse builders to keep the goods from going damp. The “counting” is the knots at the cord ends knocking in the draft. You give the chart to the teacher who keeps the cord store. After that the older pupils stop talking about ghosts and call it the “counting wind.”"

[outing_steps."map_andean_academy:outing_andean_academy_relic:outing_andean_academy_relic_first"]
"name" = "A row of family marks"
"text" = "A waist-high stone stands by the irrigation channel, carved with a row of small pictures: a gull, a lizard, a star, a footprint, and then the rest is worn away. The children say they are the marks of the Inca raft fleet’s captains, and that the copper chair lies buried under the stone. The old man who walks the channel just shakes his head."

[outing_steps."map_andean_academy:outing_andean_academy_relic:outing_andean_academy_relic_revisit"]
"name" = "A rubbing, house by house"
"text" = "The second time you bring an ink case tucked in your clothes, or a friend with a lovely hand, and take a rubbing of the stone. The deep pictures have gone black with age; the shallow strokes were added later by children. You carry the rubbing along the channel, house by house. The gull is the raft-makers’ mark, the lizard the weavers’, the star the potters’. Only the footprint draws a grin and no answer; ask the old channel keeper, they say."

[outing_steps."map_andean_academy:outing_andean_academy_relic:outing_andean_academy_relic_solve"]
"name" = "The order of the water"
"text" = "They aren’t captains’ marks at all. They are the order in which families draw water: the gull family on the first day, the lizard on the second, the star not until noon of the third. The last mark, the footprint, is the channel keeper himself; when his turn comes, the sluice shuts. Two households have squabbled over turns for years, and the old keeper holds your rubbing against their claims until they fall silent. He keeps the rubbing, the stone stays by the channel, and people still tell the one about the copper chair."

[outing_steps."map_andean_academy:outing_andean_academy_market:outing_andean_academy_market_first"]
"name" = "A piece of the copper chair"
"text" = "At the little market a man sets out a small stool with a gleaming copper top. It was cut from the copper chair brought back from the western islands, he says, and the price takes your breath away. The cord-keeper among the cords takes up a cord and feels along it knot by knot, frowning harder and harder."

[outing_steps."map_andean_academy:outing_andean_academy_market:outing_andean_academy_market_revisit"]
"name" = "Solid, or sheathed"
"text" = "The second night you come back with a small balance at your belt, or with a friend who loves to haggle. A solid copper stool this size ought to drag your hand down; this one on the scale weighs a third of that. It is a wooden core wrapped in copper sheet. Your friend gets him talking, and the man scratches his head and admits: no western island, he borrowed it last month for a feast day."

[outing_steps."map_andean_academy:outing_andean_academy_market:outing_andean_academy_market_solve"]
"name" = "Back to its owner"
"text" = "The cord-keeper’s cords say it plainly: this is the old headman’s seat of honor, lent to a distant cousin at the feast and never returned. When it is carried back, the cord-keeper unties the cord that recorded the loan and hands it to the headman as the receipt. The headman plops down on the stool, grumbles that it wobbles and that someone has rubbed off its shine, and keeps grumbling while he sends for a bowl of hot maize porridge for you."

[outing_steps."map_andean_academy:outing_andean_academy_shore:outing_andean_academy_shore_first"]
"name" = "A lashing worn thin"
"text" = "The school’s practice raft sits half afloat at the shore, nine balsa logs held together by a few fiber lashings. One of them has worn thin as thread against the edge of a log. The old raft master, whose eyes are failing, dozes nearby, and a few classmates argue over whether to add a lashing or replace it. The water is creeping up."

[outing_steps."map_andean_academy:outing_andean_academy_shore:outing_andean_academy_shore_revisit"]
"name" = "Lashing by feel"
"text" = "You return with a sailmaker’s palm on your hand, or with a friend who knows cordage. Slack off the worn lashing and bind in fresh-twisted cord, turn upon turn, pulling each one tight. After the seventh turn, tuck the end into the gap between two logs and pad it with a piece of wet hide. At every turn you test the tension with your fingertips."

[outing_steps."map_andean_academy:outing_andean_academy_shore:outing_andean_academy_shore_solve"]
"name" = "The old master’s hand"
"text" = "The old master wakes, asks nothing, and runs his hand along every lashing. At yours he stops for a long moment, then pulls your hand down on it. “Feel that. That’s a lashing.” He goes on to find two more worn ones and tells you to tie a knot in each as a marker, to be replaced later."

[outing_steps."map_andean_academy:outing_andean_academy_path:outing_andean_academy_path_first"]
"name" = "The “toll man” with a cord"
"text" = "On the mountain trail to the lookout a man sits on the steps and says you must pay a copper coin to go up and see the sea. As proof he holds out a cord thick with knots, and nobody there can read it. A few other people have come up to watch the fog, both above and below him on the steps; better not to face him alone."

[outing_steps."map_andean_academy:outing_andean_academy_path:outing_andean_academy_path_revisit"]
"name" = "Waiting for the fog to lift"
"text" = "On your next climb you carry a kamal board, or take a friend who reads tide and weather. Wait on the lookout until the evening fog thins, take your bearings from the sea and the first stars, and spot a herders’ path that follows a dry gully down. At the bottom, you go to the old fisherwoman who tends the lookout and tell her about the cord."

[outing_steps."map_andean_academy:outing_andean_academy_path:outing_andean_academy_path_solve"]
"name" = "A cord you can read"
"text" = "The fisherwoman takes the cord, feels it knot by knot, and laughs out loud: some warrant that is, just a household’s count of its llamas. Nobody has ever charged to look at the sea from up there; whoever wants the view gets it free. The next day the steps are empty. The gully path goes into your notebook, along with when the fog comes in and when the sea shows."

[outing_steps."map_indian_home:outing_indian_home_herbs:outing_indian_home_herbs_first"]
"name" = "A young tree like neem"
"text" = "Every morning the children come to the estuary grove to snap neem twigs and chew them soft for brushing their teeth. This morning one boy snapped a twig from a newly grown sapling whose leaves looked just like neem. After two bites he spat, and soon he was squatting at its roots, clutching his stomach. Nobody break another twig."

[outing_steps."map_indian_home:outing_indian_home_herbs:outing_indian_home_herbs_revisit"]
"name" = "One fork, two forks"
"text" = "The next morning you go back with a pen case tucked away, or take along a friend who knows herbs. Draw the two leaves side by side. Neem leaflets sit in a single row along one stalk, each edged with fine teeth. This tree’s stalk forks again, so each leaf looks like a feather grown out of a feather, and its branches carry pale yellow round fruits."

[outing_steps."map_indian_home:outing_indian_home_herbs:outing_indian_home_herbs_solve"]
"name" = "A ring of whitewash"
"text" = "It is a chinaberry, neem’s distant cousin. Its fruit is poison, though its dried leaves do keep moths out of clothes chests. The old woman who lives by the grove looks over your drawing, first goes to the boy still squatting at the roots and gets half a bowl of salt water into him, and when he has retched and come round she fetches half a bucket of lime wash and paints a white ring around the trunk: this one isn’t for breaking. The next day the children come for their neem twigs as usual, and every one of them walks around the ring."

[outing_steps."map_indian_home:outing_indian_home_cave:outing_indian_home_cave_first"]
"name" = "The drum in the rock"
"text" = "Under the rocks at the river mouth is a small hollow that shows only at the lowest tides, its walls crusted with salt lines, one above another, the highest past a grown man’s shoulder. The children say someone drums inside, and when the drum sounds the tide is on its way. Right now it is quiet in there, with only a cool draft blowing out."

[outing_steps."map_indian_home:outing_indian_home_cave:outing_indian_home_cave_revisit"]
"name" = "Before the tide"
"text" = "At the lowest tide you step in with a beeswax candle held high, or let a friend who can draw a chart lead the way. The hollow is not deep: a shoulder-high ledge, a pool in the low ground behind it, a thin crack in the roof. The chart stops at the ledge, and you back out to the mouth to wait. Sure enough, the sound of water draws near, and from deep inside comes one dull boom, like a drum."

[outing_steps."map_indian_home:outing_indian_home_cave:outing_indian_home_cave_solve"]
"name" = "The drum before the tide"
"text" = "The tide pours into the low ground and squeezes the air out through the crack in the roof; that bang is the drum. You hand the chart to an old fisherman, who nods. The tide here comes fast, he says. When the drum sounds, throw down whatever you’re holding and run for the bank. From then on, when the children hear it, they run for the bank instead of into the cave."

[outing_steps."map_indian_home:outing_indian_home_relic:outing_indian_home_relic_first"]
"name" = "Half a line on the sill"
"text" = "All that remains of the warehouse is a high platform, and on its threshold stone is half a line of old lettering, the rest eaten away by salt. The village says it was a pirates’ storehouse and the carving lists the loot. But the letters don’t look like a count at all."

[outing_steps."map_indian_home:outing_indian_home_relic:outing_indian_home_relic_revisit"]
"name" = "Letters under the salt"
"text" = "The next day you go back with an ink case on your back, or with a friend who writes a fine hand. Brush off the salt crust, press damp paper to the stone and pat out a rubbing. The deep letters are upright and even, as if cut by a hired mason; the shallow scratches are children’s doing, done with shells. Set those aside and the deep half-line runs together into a sentence."

[outing_steps."map_indian_home:outing_indian_home_relic:outing_indian_home_relic_solve"]
"name" = "A granary for the lean years"
"text" = "It reads: “Built for those who have no grain in the lean years.” It was a charity granary, and there were never any pirates. You give the rubbing to the old bookkeeper, who tucks it into his ledger chest and says the stone stays on its threshold. The next time famine comes, he will read the line aloud to the whole street."

[outing_steps."map_indian_home:outing_indian_home_market:outing_indian_home_market_first"]
"name" = "A pearl from beyond Hormuz"
"text" = "Oil lamps are lit in the dusk market, and a stranger holds up a pearl the size of a pigeon’s egg. He pulled it, he says, from the sea beyond Hormuz, after killing the sea serpent that guarded it. The old loan-note writer at the next stall glances at it, turns to a page in his ledger, and says nothing."

[outing_steps."map_indian_home:outing_indian_home_market:outing_indian_home_market_revisit"]
"name" = "Weighing by the seed"
"text" = "Back at the market you carry a small balance up your sleeve, or bring a friend who can bargain. Pearl dealers weigh with red abrus seeds, and the stranger’s bag of seeds has been scraped of its red skin, so each one is light. On your own weights the pearl comes to nine seeds, exactly what the old man’s ledger records, not the twelve he boasted. Your friend asks which pearl bank it came from, and he can’t name a single place."

[outing_steps."map_indian_home:outing_indian_home_market:outing_indian_home_market_solve"]
"name" = "The pearl goes back"
"text" = "The ledger says a pearl-stringer’s family pledged this pearl to a moneylender, and the term hasn’t run out. The stranger is the moneylender’s man, sent to sell it early. Before the whole market the old man reads the loan note aloud, then writes out a receipt for the pearl’s return, and it goes back into the stringer’s daughter’s hand. She grips it, says nothing, and tugs her head-cloth a little lower."

[outing_steps."map_indian_home:outing_indian_home_shore:outing_indian_home_shore_first"]
"name" = "A worn coir line"
"text" = "A tide post stands on the beach, scored with notches the fishermen add year by year. Beside it a small boat’s coir line is worn down to a few strands, and the children are squabbling over which knot to tie. The tide is rising, and the fishermen like to say it comes in faster here than a horse can run."

[outing_steps."map_indian_home:outing_indian_home_shore:outing_indian_home_shore_revisit"]
"name" = "Splicing coir"
"text" = "Next day, after the ebb, you come back wearing a sailmaker’s palm, or bringing a friend who knows rigging. Coir is coarse and rasps your hands, so the palm has to push the needle through. Cut out the worn stretch, splice the two ends together, and wrap the join in a strip of oiled husk. The children stop squabbling and crouch to watch."

[outing_steps."map_indian_home:outing_indian_home_shore:outing_indian_home_shore_solve"]
"name" = "Above the tide line"
"text" = "Before the tide front arrives, everyone hauls the boat up the sand, chanting, and ties it to the post above the notch marked highest tide. The owner, a salt-pan worker, rolls the splice between thumb and finger and says nothing. He takes one more turn of the mooring line around the post, and only then speaks: “Come again at dawn. The tide doesn’t wait.”"

[outing_steps."map_indian_home:outing_indian_home_path:outing_indian_home_path_first"]
"name" = "“Lamp-oil money”"
"text" = "Halfway up the hill road stands a small shrine, and a man sitting by its steps says every passer-by must pay one cowrie of “lamp-oil money,” or the shrine’s lamp will go out. Travelers going up and down stand around in twos and threes, watching from a distance, and nobody wants to be the first to speak up."

[outing_steps."map_indian_home:outing_indian_home_path:outing_indian_home_path_revisit"]
"name" = "Reading the pole star"
"text" = "A few days later you walk the road again with a kamal board, or with a friend who reads both tides and stars. At night, take the height of the Pole Star and you can tell the ridge runs north to south. Follow it to a path worn by cowherds, which loops around the shrine past a well and comes out behind it. You find the shrine’s old keeper and tell him."

[outing_steps."map_indian_home:outing_indian_home_path:outing_indian_home_path_solve"]
"name" = "No toll for the lamp"
"text" = "The old keeper sets his oil jar on the ground. The lamp burns on oil the village brings, he says, and it has never asked a passer-by for so much as a cowrie. He limps to the steps with his stick and finds the man long gone, leaving only half an eaten flatbread. The cowherds’ path and the well beside it go into your notebook."

[outing_steps."map_indian_academy:outing_indian_academy_herbs:outing_indian_academy_herbs_first"]
"name" = "A vat that won’t turn blue"
"text" = "In the dye garden behind the workshop the pupils cut a bundle of indigo and set it fermenting in the vat. The dyer circles it, sniffing, and frowns: only gray-brown water, no blue foam rising. Two clumps in the garden have almost identical leaves. The dyer points to the leftover bundle: find what doesn’t belong in it yourselves."

[outing_steps."map_indian_academy:outing_indian_academy_herbs:outing_indian_academy_herbs_revisit"]
"name" = "Look at the pods"
"text" = "On your second visit you bring a pen case, or a friend who knows herbs. Draw leaf, flower and pod. The indigo’s pods are slender and slightly curved, hanging down; the other plant’s are flat and straight, pointing up. Rub one leaf from each on white cloth, and one leaves a blue-green stain, the other a dirty brown."

[outing_steps."map_indian_academy:outing_indian_academy_herbs:outing_indian_academy_herbs_solve"]
"name" = "The vat doesn’t lie"
"text" = "What got in was wild indigo, also called fish-poison, which when crushed and thrown into a pond will stun the fish and never dye anything blue. The dyer pours the whole vat out at the roots of a tree and has you cut a fresh bundle. Next day a coppery scum floats on the vat. He hauls out a cloth and shakes it open: yellow-green at first, then, in the wind, turning blue. He glances at you. A vat doesn’t lie."

[outing_steps."map_indian_academy:outing_indian_academy_cave:outing_indian_academy_cave_first"]
"name" = "Haggling in the well"
"text" = "Steps descend level by level into an old stepwell of the city, and on the walls of its vaulted chamber the rainy-season water marks stack up, the highest out of reach. In the dark depths someone keeps haggling in a low voice, “Eight—no, nine…” again and again, and nobody answers. A cool draft blows out of the vault."

[outing_steps."map_indian_academy:outing_indian_academy_cave:outing_indian_academy_cave_revisit"]
"name" = "Following the voice"
"text" = "You descend step by step with a beeswax candle, or with a friend who can draw a chart walking ahead. The lower you go, the colder the back of your neck gets: the wind is pouring down from overhead, not rising off the water. At the far end of the vault is a waist-high ledge, and above it a narrow square opening in the wall, which is where the haggling drifts down from. You chart the vault only as far as the ledge; nobody explores the water below."

[outing_steps."map_indian_academy:outing_indian_academy_cave:outing_indian_academy_cave_solve"]
"name" = "The bazaar overhead"
"text" = "The opening leads to a long-disused air shaft whose mouth lies beneath the grain market’s stalls. Sellers’ and buyers’ haggling has been falling down it into the vault for who knows how many years. You hand the finished chart to the old man who minds the well. He lays a board over the shaft mouth and bores a small hole in it: “Anyone who wants to learn bargaining can lie here and listen.”"

[outing_steps."map_indian_academy:outing_indian_academy_relic:outing_indian_academy_relic_first"]
"name" = "A pillar half sunk in silt"
"text" = "The old channel has silted up into a shallow ditch where cattle graze, and beside it stands a stone pillar, half buried in mud, carved with half a line of lettering. The children say this is where the roc dropped an elephant, and the huge bones dug out of the ditch prove it. The old folks only smile."

[outing_steps."map_indian_academy:outing_indian_academy_relic:outing_indian_academy_relic_revisit"]
"name" = "Dig, then rub"
"text" = "You come again with your ink case ready, or with a friend who can read and write. First dig the silt from the pillar’s foot to uncover the buried half. Shut in mud all these years, its letters still look freshly cut, tidy work by a hired mason. The upper half has been worn shallow by weather, with the cowherds’ children’s idle scratches laid over it, and you have to pick those apart stroke by stroke. Rubbed and set together, the two halves make a whole sentence."

[outing_steps."map_indian_academy:outing_indian_academy_relic:outing_indian_academy_relic_solve"]
"name" = "The sea once came this far"
"text" = "You give the rubbing to the old clerk who paces the shoreline once a year. Holding it up to the sun, he reads it out: “The tide reaches here; boats may be tied.” It was a mooring post, from the days when the sea came this far. Now the sea has withdrawn miles away and the channel is dead. He sighs: the next generation will have to sell its cloth from a farther quay. The pillar stays where it stands."

[outing_steps."map_indian_academy:outing_indian_academy_market:outing_indian_academy_market_first"]
"name" = "Red account books by the pound"
"text" = "At the ledger-paper stalls in the night market, old account books are sold by the pound. They were fished out of a ship that sank off Diu, says the seller, and the paper still tastes of brine. The ink seller at the next stall takes a glance at the red-cloth covers, then gets up to riffle through his own book of credit."

[outing_steps."map_indian_academy:outing_indian_academy_market:outing_indian_academy_market_revisit"]
"name" = "Two sets of weights"
"text" = "Two nights later you return with a small balance, or with a friend who knows how to bargain. Your friend, chatting idly, notices that the seller keeps two sets of weights: the set he buys scrap with is heavier by a seventh than the set he sells with. Put them on your balance and they don’t match, and the smile freezes on his face."

[outing_steps."map_indian_academy:outing_indian_academy_market:outing_indian_academy_market_solve"]
"name" = "The red books go home"
"text" = "The ink seller’s credit book shows that the red volumes belonged to a widow from the next street, who had sold her late husband’s old accounts as scrap by the pound. The old man who keeps order in the market rules by guild custom: a sale made with false weights does not stand. He writes out a receipt for the return, and the books go back into the widow’s hands. She opens one and finds loan notes tucked inside, never collected, and as she turns them her fingers slow and stop. The seller packs up his stall that very night."

[outing_steps."map_indian_academy:outing_indian_academy_shore:outing_indian_academy_shore_first"]
"name" = "A mooring about to part"
"text" = "At the shipyard a newly sewn little boat has been floated in the shallow inlet for a trial and tied to a post. Its planks are stitched together with coir thread, but its mooring line is rubbing through against the post. The apprentices looking on argue over whether to tie a fisherman’s knot or a shipwright’s, each side sure it is right, and nobody looks at the line itself."

[outing_steps."map_indian_academy:outing_indian_academy_shore:outing_indian_academy_shore_revisit"]
"name" = "Cut and splice"
"text" = "Back at the inlet you bring a sailmaker’s palm, or a friend who knows ropework. Snip out the chafed length, splice the ends together, and bind the join tight with the same coir thread that stitches the planks. The yard master puts down his chisel, comes over, and gives the splice a hard yank."

[outing_steps."map_indian_academy:outing_indian_academy_shore:outing_indian_academy_shore_solve"]
"name" = "It held"
"text" = "The splice doesn’t give. While the tide is still far down the estuary, the master has the boat dragged up the slip and the water bailed out. He has you crouch down and shows you the coir stitches along the plank seams: “This one, and this one, all of them have to pull as hard as your splice.” Then he rummages in his tool chest and tosses you an old awl."

[outing_steps."map_indian_academy:outing_indian_academy_path:outing_indian_academy_path_first"]
"name" = "“Meal money” on the way"
"text" = "On the trail up to the hillside retreat a man bars the way, saying each pilgrim must pay a cowrie of “meal money” to feed the ascetics above. He holds a begging bowl so bright and clean that it has plainly never begged for anything. Pilgrims are walking in groups above and below; don’t confront him on your own."

[outing_steps."map_indian_academy:outing_indian_academy_path:outing_indian_academy_path_revisit"]
"name" = "The three banyans"
"text" = "You head up the hill again with a kamal board slung from your shoulder, or with a friend versed in tides and stars for company. When the first star shows at dusk, take the Pole Star’s height and note the three old banyans along the way, then follow the gully the water-carriers use, around the man, all the way to the retreat. There you tell the old ascetic who keeps it."

[outing_steps."map_indian_academy:outing_indian_academy_path:outing_indian_academy_path_solve"]
"name" = "A place that takes no money"
"text" = "The old ascetic hears you out and asks mildly, “A toll? Nobody up here has touched money in decades.” He goes to look, leaning on his staff. The path is empty except for that strangely bright begging bowl, left by a rock. The gully route goes into your notebook, with the three banyans and the big rock halfway up where you can rest."

[notes."note_04b00731975e0eb8"]
"text" = "Beach silvertop on the sand"

[notes."note_032e6c7fd6d2366b"]
"text" = "The pines break the sea wind for the village, and the sand beneath them bakes in the sun. Your pen case comes home unused. The grove’s puzzle pays off only once, but every later visit still sharpens your eye."

[notes."note_63e452db5aac3f81"]
"text" = "The seaweed gatherer"

[notes."note_1eb9d07b6158fddd"]
"text" = "The voice that wants a ladle"

[notes."note_6c242efece7ca00f"]
"text" = "On foggy nights, the seaweed woman says, a voice out on the water calls to borrow a ladle. Lend it one and it bails the sea into your boat, scoop by scoop—so every boat on this coast carries a ladle with the bottom knocked out."

[notes."note_471f8bec985ad0a0"]
"text" = "You can get in only on the few spring-tide days each month. A candle you light still comes home with you. The cave gives up its secret once; after that, each visit is just for nerve."

[notes."note_f53cfd95cedd61fd"]
"text" = "A potsherd between the stones"

[notes."note_a78ab1f59b12f630"]
"text" = "The empty boat at Obon"

[notes."note_4b288e78c90cdb22"]
"text" = "The old boatman says that on the nights of Obon an empty boat drifts in below the beacon and comes alongside asking for a ladle. Don’t answer. Point your bow at it and pole straight through, and it comes apart into mist."

[notes."note_18868b01ea202d9f"]
"text" = "The headland is so windy you have to weigh the paper down with stones. The ink case is never used up. The line needs reading only once; on later climbs, just look at the sea."

[notes."note_a72431caf46ed52e"]
"text" = "The old ferryman"

[notes."note_158b35169c02b116"]
"text" = "After dark the dried-fish sellers, sandal makers, and sake vendors all crowd onto the landing. Your balance comes home with you. The swindle can be exposed only once, but each visit trains your eye a little more."

[notes."note_4d70a6457aeb6368"]
"text" = "The boatwright caulking seams"

[notes."note_067adb7cca891d45"]
"text" = "The beach smells of wood shavings, seaweed, and drying fish. The palm won’t wear out. You save the skiff only once; after that, come back to learn from the boatwright."

[notes."note_1d9f8bbbc50723eb"]
"text" = "A young monk out begging"

[notes."note_e6ea95c71e97bed2"]
"text" = "The “incense money” man"

[notes."note_af2ed739d1b174b9"]
"text" = "The path is steep, and looking back you can see the whole bay. The kamal board is never used up. Once you know the way, it stays known; later walks build your legs and your nerve."

[notes."note_fc5978b79a0816f8"]
"text" = "Angelica in white bloom"

[notes."note_3eb01f5ec9987124"]
"text" = "Half of what the temple grows stays with the monks; the rest goes to apothecaries in the city. The pen case comes home with you. The bed needs sorting out only once—after that, drop by and help the old monk with his garden."

[notes."note_2a6e66b4439540fb"]
"text" = "An Ōhara woman with firewood"

[notes."note_6b0eec9a0a6aec88"]
"text" = "A Yodo boatman’s tale of the western sea"

[notes."note_c6e31b7dd40bcb7c"]
"text" = "A boatman up from the Yodo River rests at the cave mouth and talks about the western sea. The Heike who drowned at Dan-no-ura, he says, still drift in the fog asking passing boats for a ladle. If you give one, knock the bottom out first, or they’ll fill your boat scoop by scoop."

[notes."note_e4cd5cf3f2a470ea"]
"text" = "The cave isn’t deep, but the floor stays wet long after the rains. The candle is still yours once it’s lit. The cave needs exploring only once; later, come back just to listen to the dripping."

[notes."note_8779bf8dd567bead"]
"text" = "A roof-tile end in the steps"

[notes."note_829feb077bbce2d0"]
"text" = "A biwa priest sings of Dan-no-ura"

[notes."note_4b6eee081172363d"]
"text" = "At the foot of the steps a blind biwa priest plays the eleventh book of the Heike, singing of the child emperor going into the sea. As the listeners drift off, a salt seller from the Inland Sea adds that the drowned are still out in the western fog, asking passing boats for a ladle."

[notes."note_30597f865910c130"]
"text" = "The garden has lain abandoned for nearly eighty years, but the steps are the same ones. The ink case is never used up. The poem needs reading only once; later, sit on the steps and learn poems by heart."

[notes."note_2489619cc43136a8"]
"text" = "The sutra copyist"

[notes."note_bba91f822ae82a10"]
"text" = "Most books in the capital are hand copies; printed ones are scarce, and recuts of Song editions scarcer still. Your balance is never used up. The affair is settled once, but the stalls are always worth a browse."

[notes."note_2b1ebfffb03b4b6d"]
"text" = "Boys catching sweetfish"

[notes."note_aa4ad3acaf47a893"]
"text" = "The Kamo runs shallow, and a single flood can move half its banks. The palm comes home with you. The rope needs fixing only once; later, come learn knots from the ferryman."

[notes."note_64a8cdd8ae025483"]
"text" = "The penny-a-cup tea woman"

[notes."note_190aef5c8147e7b7"]
"text" = "The man with the bamboo pole"

[notes."note_fd8c4cfc83404e2d"]
"text" = "The cedars along the road are older than the temple. The kamal board comes home with you. Learn the way once and it’s yours; later walks are for your legs and your spirits."

[notes."note_838aca7543bdca3f"]
"text" = "Dwarf elder at the dike foot"

[notes."note_f07493fb294b7afe"]
"text" = "The cut willow switches go to the village’s basket weavers and fish-trap makers. Your pen case comes through unspent. The old woman sets this particular quiz only once; next time she will be pointing at some other plant."

[notes."note_eee4e9e2e0c0303c"]
"text" = "Children picking cinders"

[notes."note_fd2a5c634a305c34"]
"text" = "The great serpent off Norway"

[notes."note_dcc170dad0ae67eb"]
"text" = "A bargeman who has worked his way upriver shelters in the kiln mouth and pulls out a Venetian-printed chart of the northern seas: off Norway, a huge serpent coils around a whole ship. Sailors in Bergen told him, he says, that it lives in caves along the shore and slips out on clear summer nights to carry off calves, and that the picture draws it small."

[notes."note_a5e38dcdd8fb6b57"]
"text" = "The kiln was built on the flats so its bricks could float to town. The candle you lit goes home whole. Once the riddle is solved it stays solved; next time you come only to hear the kiln sing."

[notes."note_56e49c3d79f50a12"]
"text" = "A rusted gate ring"

[notes."note_51578722fe7470b3"]
"text" = "A serpent taller than a mast"

[notes."note_a4c5ac7454567c17"]
"text" = "A Norwegian stockfish dealer, leading a mule loaded with dried cod in from the coast, rests under the trees by the old sluice. The great serpent, he says, can stand straight up out of the sea at night, taller than a mast, with eyes red as live coals, and lift a man off the deck in one bite. That is why, sailing close to shore up there after dark, you bang on pot lids."

[notes."note_f8ad1a7cfecf2bfd"]
"text" = "Since the sluice was abandoned, the ground beside it has gone to turnips and cabbages, and ivy has swallowed the pier. The ink case is not used up. The line gives up its meaning only the first time; when you pass later, note which way the wind sits and guess whether the new sluice will be shut today."

[notes."note_c98aec4fa9c7d523"]
"text" = "The scrivener"

[notes."note_a2f0e029903a8894"]
"text" = "Herring barrels, rolls of linen, and beer casks line the bank, and after dark the moored barges light their lamps and let them shiver on the water. The balance goes back in your bag unharmed. The necklace business happens only once; from then on, every stallkeeper wipes his scale before you reach his table."

[notes."note_7d133cad3a42a3c9"]
"text" = "The eel-trap mender"

[notes."note_63405afb4a41da68"]
"text" = "In the spring flood the river runs fast and brown, and ice gnaws grooves into the stakes. The palm is still yours afterward. The boat needs saving only the once; if you pass again, the old fisherman will gladly teach you to mend eel traps."

[notes."note_99172ed427abc8d1"]
"text" = "A woman with milk pails"

[notes."note_b909479646ef23e2"]
"text" = "The “bell-ringing fee” man"

[notes."note_316b21bb5aae17f6"]
"text" = "Earlier generations heaped the mound up basket by basket to stay above the floods, and the village huddles all around it. The kamal board is not used up. Once you know the way home, you know it; later walks are just something to do after supper."

[notes."note_ec78afa5ec469bca"]
"text" = "Wild garlic under the trees"

[notes."note_0e46a0c4de40cc2a"]
"text" = "When the lindens bloom, the whole grove drones with bees and half the school comes to pick blossom for tea. The pen case comes back as it went. Telling the two apart matters only the first time; every spring after, the cook will still call your name when there is garlic to cut."

[notes."note_133b0b2a5209866a"]
"text" = "The warehouse’s old porter"

[notes."note_66ed521b084be0dd"]
"text" = "The apprentice’s serpent"

[notes."note_d9f1014d1c007127"]
"text" = "A printer’s apprentice, down in the cellar for a roll of paper, shows you a proof of a woodcut he has just cut: off Norway, a great serpent wound around a ship. Bergen sailors say it sleeps by day in caves along the shore, he tells you, and they never speak its name on deck for fear the cave will hear."

[notes."note_08ab15cc3d7d24ac"]
"text" = "The cellar never freezes in winter and stays cool in summer; it once held beer and pickled herring and now holds only a few moldy straw pallets. The candle you carried down is still yours when you come up. The cellar gives up its mystery only once, but on rainy days it makes a fine place to hide from lessons."

[notes."note_89a7ca241efa0251"]
"text" = "Dog roses over the wall"

[notes."note_6fb75f82526bdf36"]
"text" = "The serpent of the Bergen kontor"

[notes."note_4617e70e7c5f05a9"]
"text" = "The old man who keeps the garden served as an apprentice at the Hanse kontor in Bergen when he was young. New boys got smoked and soused their first year, he says, and the older apprentices told them about the great serpent: lying in the wharf-side bunks at night, you really could hear something rubbing against the piles. Whether that was a prank, he has never said."

[notes."note_5266525f6744863d"]
"text" = "The garden has gone wild, but the cherry trees still fruit each year, and the birds eat better than the people. The ink case is not used up. The stone gives up its meaning only the once; when you come again, see whether you have grown."

[notes."note_305611c8f1750818"]
"text" = "The bookbinder"

[notes."note_a9061a9392e0e35c"]
"text" = "The alley is so narrow that two people can barely pass, and the oil lamps under the eaves grow dimmer one after another. The balance comes out of it unmarked. With the affair settled, you will know by the heft of a book in your hand when it is short of leaves."

[notes."note_1a75271207b4721c"]
"text" = "The old ferryman"

[notes."note_6bac11a871901de5"]
"text" = "The posts are covered in notches, the oldest bleached white by the river, and nobody can say who cut them. The palm is yours to keep, none the thinner. The skiff can be saved only the once; when you come again, you can help the old ferryman scrape the hull."

[notes."note_0334215bf50f451f"]
"text" = "An old woman on her way to service"

[notes."note_0199569d318088a8"]
"text" = "The “candle money” man"

[notes."note_396bfdc508b1fc81"]
"text" = "The river runs right behind the chapel, yet the little well in front gives water sweeter than the river’s. The kamal board is not used up. The way around is learned in one go; another time, come at low water and pick pebbles off the bank."

[notes."note_64d5ee67271f5750"]
"text" = "Oleander along the track"

[notes."note_84a3662c299d09ab"]
"text" = "The pickers work under the trees all winter, and the stone mill at the oil press turns day and night. The pen case goes home as it came. The old woman teaches these two shrubs only once; after that she will always have some other leaf to send you for."

[notes."note_2c25747d9e626be4"]
"text" = "The net-mending woman"

[notes."note_b8a00b12d0017f88"]
"text" = "The Triton of a Lisbon cave"

[notes."note_66b313986e76ba5b"]
"text" = "A young man from the village who studies Latin at the friary says Old Pliny wrote that Lisbon once sent envoys to the emperor to report a Triton in a sea cave, blowing a conch. The book doesn’t say which cave. The fishermen are quite sure it was theirs."

[notes."note_8403a836192a5567"]
"text" = "The mouth faces southwest, and in the evening the swell slaps again and again on the reef shelf before it. The candle goes back in your pocket. The cave gives up its secret only once; next time you come to sit on the rocks with the children and wait for the horn."

[notes."note_a8187ee253b6b58a"]
"text" = "A wild fig in the masonry"

[notes."note_dc6e8b3a8bd87e7a"]
"text" = "The sea-man who boards ships"

[notes."note_f541921a92e68295"]
"text" = "The old watchman who once manned this tower says that off Cadiz there is a “sea-man” who climbs aboard ships at night, and whichever side he sits on sinks. Everyone who watches the sea knows it: if a ship leans for no reason in the dark, the sailors don’t check the sails first. They look along the rail for a shadow."

[notes."note_bf9f0c4257ca889e"]
"text" = "The tower stands on a sheltered crest, and when the wind drops you can hear nets being slapped dry in the fishing village below. The ink case is not used up, and it survives the climb in one piece. The line need be read only once; when you come again, watch the sea and count passing ships on the tower’s behalf."

[notes."note_6a40b842ca7b93a3"]
"text" = "The dyer’s boy"

[notes."note_ce3574649473914c"]
"text" = "Carts and mules rumble over the bridge and drown the hawkers, but it is cool under the piers and the stalls stay open all year. The balance goes back inside your jacket, none the worse. The case is closed after this one time, and from then on you can tell by the heft of a sack whether something is off."

[notes."note_ca07da8690b86188"]
"text" = "The caulker"

[notes."note_d7dbb931d42bcb02"]
"text" = "The slipway is never empty, and before a launch the beach is stacked with split oak planks. The palm comes through without a scratch. Once the skiff is up the ways, that is the end of the matter; on later visits you can squat nearby and watch the caulkers work."

[notes."note_44efe4520bebb966"]
"text" = "A woman climbing to keep a vow"

[notes."note_1a5e1994f601e17d"]
"text" = "The “road levy” collector"

[notes."note_655071b27062108c"]
"text" = "The slope is thick with cork oaks and rockrose, and in summer smells of hot resin. The kamal board comes down unbroken. Once you have learned the other way up it stays learned; on later climbs, you might bring the chapel a little lamp oil."

[notes."note_b9b26fe581f67079"]
"text" = "Comfrey at the wood’s edge"

[notes."note_a23ee1fda434d3f0"]
"text" = "The wood begins just beyond the garden wall, and the masters know every plant in it, though they don’t always say. The pen case goes back in your satchel untouched. The master will not quiz you on these two again; next time he points at some other roadside weed."

[notes."note_9245615ce2e7109e"]
"text" = "A girl herding goats at the mouth"

[notes."note_3849fa9131d22b14"]
"text" = "The Triton in two manuscripts"

[notes."note_9314871e622158c6"]
"text" = "The master brings out two copies of Old Pliny and has the pupils compare the same passage. In one, Lisbon’s envoys both saw and heard a Triton blowing a conch in a cave; in the other, they only heard. A scribe’s hand slips, he says, and a sea-god shrinks by half: “Mind your own hands when you grow up.”"

[notes."note_7b512ab1b1d9691f"]
"text" = "The mouth faces north and breathes cool air even in high summer, and after rain it smells of wet stone and goats. The candle is still yours after it is lit. The mystery is settled with one solving, though on later rainy days it is no bad idea to come back and listen for the bell."

[notes."note_816667aab2f4d749"]
"text" = "Reeds at the breach"

[notes."note_7d725e2ac840e62f"]
"text" = "The Nereid washed ashore"

[notes."note_7d4397025e892815"]
"text" = "An old fisherman from the river mouth says that when his grandfather was young, a great tide went out and left the body of a scaled woman on the sand, and the whole shore smelled of it. Old Pliny mentions such creatures too, he says: “What’s in books is in books. The smell was real.”"

[notes."note_de49c5ded857a9d5"]
"text" = "The reed flats beyond the breach belong to the waterbirds, and in spring they are full of eggs. The ink case hasn’t lost a drop. Once the slab is read it is read; when you come again, brush the mud off it as a courtesy."

[notes."note_226ba1d15f0ebe90"]
"text" = "The seller with a hand on the scale"

[notes."note_22c4c0521539096e"]
"text" = "The lamps stand shoulder to shoulder, and the sellers can tell at a glance who is there to read and who is there to wrap fish. The balance goes back in your pack as it came. The matter is done, but a rummage through the scrap pile on a later night may still turn up something good."

[notes."note_398cdf70095cef07"]
"text" = "The old man drying nets"

[notes."note_57bed9ea9f4977ee"]
"text" = "The marks on the steps were recut by pilot after pilot, and the oldest have long since worn smooth. The palm comes home as it went. The mooring needs setting right only once; when you come again, you might practice reckoning the tide against the marks."

[notes."note_068bfd6697af264d"]
"text" = "A woman with a grape basket"

[notes."note_ca0fbe9c0c96eb16"]
"text" = "The self-styled tithe collector"

[notes."note_89ac7c80e9510bc8"]
"text" = "At harvest the slope is full of purple juice and bees, and even the chapel steps are sticky underfoot. The kamal board goes home with you again. Learning the way once is enough; after that, you come to help pick a few bunches."

[notes."note_eff0dbe3c9d8f9b3"]
"text" = "White umbels in the ditch"

[notes."note_c94d50acefc1957d"]
"text" = "Island families planted the poplars as a windbreak, and whenever a gust runs down the dike the pale undersides of the leaves flash silver. The pen case comes home with you. One lesson is all this ditch has to give, but every walk along the dike sharpens your eye."

[notes."note_5afe02b9570c254d"]
"text" = "A boy picking up cullet"

[notes."note_08f7fbd230fd8bd1"]
"text" = "The Greek passenger’s sirens"

[notes."note_3b59b1b70419ea88"]
"text" = "A Greek passenger on the ferry hears there is singing in the furnace house and laughs, then tells the old story: in a strait far to the south, sirens sit on the rocks and sing, and Odysseus had his men seal their ears with wax while he was bound to the mast to hear it out. For his own part, he says, he would never have had the heart to stop his ears."

[notes."note_ddd91e6afe2a8017"]
"text" = "Several generations of hands fired these bricks, and their edges still wear a skin of blue-green glaze. A candle you have lit still comes home with you. The flue needs mapping only once; next time, sift the ashes, where glass beads dropped long ago keep turning up."

[notes."note_286a71a489227e1f"]
"text" = "Bars on the foundation stone"

[notes."note_6b430c9863e7a1d3"]
"text" = "The oarsman’s siren ditty"

[notes."note_fe3fe2ff14fed588"]
"text" = "An oarsman just back from Corfu leans against the stump to rest and hums a galley tune about the sirens, whose song makes a man forget the road home. Odysseus’s crew stopped their ears with beeswax, and Odysseus, lashed to the mast, begged to be freed while nobody paid him any mind. Oarsmen love that verse, he says; it keeps the stroke."

[notes."note_45c0ee881dc5d99f"]
"text" = "Nothing lives on the mud island but gulls, shore crabs, and the smell of rotting weed. Your ink case is none the poorer. The stone needs reading just once; whenever another flood climbs the foundation, one more bar will be cut beside the others."

[notes."note_5c3e3381f523a549"]
"text" = "The woman stringing rosary beads"

[notes."note_8c26c9cb554218c1"]
"text" = "Lantern light breaks into pieces on the canal, and every stall has something to sell, though nobody will name the true price first. Wipe the balance and tuck it back in your sleeve; it never wears out. The swindle needs exposing only once, and the next time you walk the market the ash sellers steer around you."

[notes."note_ce520a30a492a566"]
"text" = "The old clam digger"

[notes."note_26adf175828efc20"]
"text" = "Every pole was driven decades ago, and each row points down some channel. The palm comes home with you, and the skiff can be saved only once. Which mud will hold your weight and which will swallow your foot, the old clam digger will teach, if you ask."

[notes."note_b0da0bdfa0fa7d3d"]
"text" = "A lay brother with a vegetable basket"

[notes."note_600474b0a0a37326"]
"text" = "The boatman with his pole across the path"

[notes."note_31d7916563a5a085"]
"text" = "Cypresses stand in rows on the island, and the friary bell carries a long way over the water. The kamal board is never used up. Once you know the sandbar, it stays known; crossing again is just a stretch of the legs and a listen to the bell."

[notes."note_5602c651f3696e0e"]
"text" = "The dyer’s wife"

[notes."note_8494f7d9078ef622"]
"text" = "The garden runs down to the canal, and cloth in red, blue, and yellow hangs from poles, snapping like a row of flags. You carry the pen case home just as you brought it, and this lesson counts only once; the dyer’s wife says next time she will teach you woad and weld."

[notes."note_70968f892015913d"]
"text" = "The night stoker"

[notes."note_a25ab31ed23ebfda"]
"text" = "The corrector reads of the sirens"

[notes."note_417b552873875f02"]
"text" = "The Greek corrector from the printing house hears the apprentices fretting over the sounds in the tunnel and takes a manuscript from the shelf to read to them. The sirens sit in a meadow and sing that they know everything that happens on the earth; but in the grass around them, he reads, lies a great heap of rotting men’s bones, the skin still shriveling on them. For a while after that no apprentice looks toward the tunnel."

[notes."note_857cd3aa1b02fa86"]
"text" = "The tunnel stays mild all year, like a furnace that went out long ago and hasn’t quite forgotten. The candle goes back in your bag, lit or not, and the tunnel needs mapping only once; on quiet nights the brickwork still carries the chime of those hanging stems."

[notes."note_f71e4e007b2396b5"]
"text" = "Scratches on the corner"

[notes."note_2bb8f7f16a6ab958"]
"text" = "The ferryman’s saying"

[notes."note_a2cea4a239a3fd0d"]
"text" = "The ferryman poles across the canal mumbling the same old saying: “Wax in the ears, rope around the body, and you can pass the rocks that sing.” The students press him on what song it is. He grins and says that’s in the Greeks’ books, he only poles the boat, and no song was ever sung for him."

[notes."note_9ee7eacd72627db8"]
"text" = "The water is shallow at the foot of the bridge, and at low tide you can see broken pottery under the pier. The ink case is yours again at day’s end, and Clodia’s lesson counts only once; in the little shrine at the bridgehead, someone often leaves her a flower."

[notes."note_d91d4dccd05c00fb"]
"text" = "The scrap-paper seller"

[notes."note_51d98506d4c35922"]
"text" = "The smell of ink never leaves Printers’ Row, and the soles of your shoes pick up gray dust from spilled type. The balance is back in your sleeve. The matter is settled once, but who knows what the scrap heaps will give up another day."

[notes."note_587021620e3b0c28"]
"text" = "The passenger with the glass crate"

[notes."note_a0b4be4d6dcd1027"]
"text" = "The posts of the stage are cut with names, left by people with nothing to do while they waited for the boat. The palm goes back on its peg. The sail is mended for you only once, but every year when the boatman mends it he goes over the little charcoal anchor beside the patch."

[notes."note_85ead7bc4139bff2"]
"text" = "A farm woman with her vegetables"

[notes."note_3421aa366500f48f"]
"text" = "The “friar” in the short robe"

[notes."note_8ffeba6516cc1812"]
"text" = "The nuns grafted these trees one by one, and the pears are said to be the sweetest on the island. The kamal board goes home as it came, and the false friar is dealt with for you only once. When the fruit falls, a row of ripe pears is piled along the outer wall for anyone passing to take."

[notes."note_a06efd4fb0683010"]
"text" = "The vine with yellow globes"

[notes."note_fd4d6d7adf20394e"]
"text" = "The date palms grow so thick they shade the sky, and channel water chatters among their roots all year, so the garden stays far cooler than the road. Not a drop of ink is gone from the pen case, and this vine is settled for good. A hollowed-out handal husk hangs from a nail on the garden gate and rattles in the wind, and the children go around when they hear it."

[notes."note_50a43b10e322a036"]
"text" = "The keeper of the channels"

[notes."note_a56600dfd4bff5e1"]
"text" = "The storyteller’s fisherman and jinni"

[notes."note_cd86e16075c2dd4d"]
"text" = "A storyteller who works the villages rests at the cave mouth, hears the children talking of jinn at their washing, and tells of a fisherman who hauled up net after empty net until he landed a copper jar sealed with the seal of Solomon, peace be upon him. He pulled the stopper, blue smoke poured out, and a jinni stood up taller than a date palm. The children jeer at the fisherman for meddling, and then not one of them leaves."

[notes."note_a818e7822b96244f"]
"text" = "The mouth faces away from the sun, and inside it is several degrees cooler than the road. The candle is still yours once lit. The channel is traced for you only once; after that, a sit on the steps beats standing in the sun."

[notes."note_a481f22485edc71f"]
"text" = "Knife-cross marks on the rim"

[notes."note_7bb66fef46701e83"]
"text" = "The water carrier’s jinni in the jar"

[notes."note_257a4989cb566290"]
"text" = "The old water carrier sets down his yoke and tells the children at the well rim: when the fisherman broke Solomon’s seal on the jar, the jinni rose up and swore to kill him. The fisherman kept calm and said such a giant could never fit in so small a jar. Piqued, the jinni turned to smoke and poured back in, and the fisherman pressed the stopper home and threatened to throw the jar back into the sea. The children laugh, and then every one of them glances down the well."

[notes."note_dbf60cd372b96b95"]
"text" = "The platform is out of the wind, and a few dry date fronds always lie in its hollows. The ink case doesn’t wear out. Once you have made out the writing, that is done for good, but the crosses on the rim keep being added, each one a person who drank here."

[notes."note_83f70cc625e60494"]
"text" = "The old pearl assessor"

[notes."note_b02278665338ad2e"]
"text" = "The lamps burn fish oil, and its fishy sweetness is shot through with frankincense. A quick wipe and the balance is ready for the next stall. The fraud is exposed just the once, but after that no one at the pearl stalls dares try a hollow bead on you."

[notes."note_bfd5a9802028406d"]
"text" = "The shipwright’s young son"

[notes."note_7697b6b1dce11c66"]
"text" = "Coconut husks lie drying in rows on the sand, waiting to be beaten into fiber. The palm doesn’t wear out, and the seam is mended just once. Twisting cord takes a strong grip; the boys are happy to teach you, though a weak hand won’t twist it tight."

[notes."note_4117a0c0fc153b46"]
"text" = "A camel driver at rest"

[notes."note_9dcb71d5e891888c"]
"text" = "The man guarding the copper cup"

[notes."note_3be9aad2f6534e6a"]
"text" = "In the shade of the shelter wall a clump of mint grows, seeded by travelers who rested here. The kamal board comes through without a scratch. The beach route counts for you only once; the water in the shelter, though, is free again."

[notes."note_b65917faf93c8ce4"]
"text" = "The tree that folds its leaves"

[notes."note_d8c40f41ebbd81a0"]
"text" = "The garden grows mint, rue, and a row of roses, and the dried petals all go into the dispensary cupboards. The pen case stays in your bag, none the worse. This one tree needs identifying only once; the gardener says that when the rains come he will show you how to shade a seedling."

[notes."note_7988ea116d6f02d3"]
"text" = "The storehouse hand"

[notes."note_e0cf7bac8b099de4"]
"text" = "The porter and the sealed jar"

[notes."note_d8acd81eb8cf1299"]
"text" = "A porter sits on a sack catching his breath and, to bolster the people going down, tells what became of the jinni shut in a copper jar under Solomon’s seal: four hundred years in the dark. At first he swore to make rich whoever let him out, and every hundred years with no one coming he raised the offer; when the fourth hundred ran out and still nobody came, he turned and swore to kill whoever pulled the stopper. That, says the porter, is why you never open a jar of unknown origin."

[notes."note_25c9836d8c4143f4"]
"text" = "The vault stays cool all year, sacks are stacked higher than a man, and rats stroll along the top as if they owned the place. Snuffed out, the candle goes back in your pack. The vault needs mapping only once; next time down, the hands may let you mark sacks with a stick of charcoal."

[notes."note_2476b783502c9c03"]
"text" = "The inscription on the parapet"

[notes."note_0f8a5ecc8463235d"]
"text" = "A tale read on the bridge steps"

[notes."note_73ce5e1f9c48c73a"]
"text" = "A student copyist sits on the bridge steps reading from a manuscript in the last of the light. Pressed by his friends about the bridge’s origins, he reads them the second half of the tale of the fisherman and the jinni: the jinni, shrunk back into his jar, begs and swears by the name of God; the fisherman pulls the stopper a second time and follows him to a lake, where the net comes up full of fish in four colors. He drops his voice for the oath, and his friends shrink into their collars, then demand it again in chorus."

[notes."note_9cffe313fd720a9c"]
"text" = "The channel floor has dried into cracked plates, and tufts of camel thorn grow from the cracks. The ink case will outlast a hundred rubbings. You need to make out the inscription only the once; the stretch of parapet rubbed bright by children’s sleeves now has someone leaning over it every day, reading the letters."

[notes."note_7f164fec4234ac4d"]
"text" = "The illuminator who covered his paints"

[notes."note_9c868cfee0997fb0"]
"text" = "Flecks of gold leaf drift in the lamplight over the stalls, and every copyist’s cuff is stained with ink. The balance goes back on your belt, none the worse, and this affair counts only once. You know now to dig down to the bottom of a dish, and no stallkeeper will dare show you only the top."

[notes."note_cefbd457acf0bf6a"]
"text" = "An apprentice with tar-black hands"

[notes."note_68960b4a009023bc"]
"text" = "The water in the inlet is green, new coils of hemp line are stacked along the bank, and the air is thick with tar. The palm has hardly a mark on it. This halyard is set right for you only once. A few apprentices squat by a coil of hemp, haggling over half a bucket of tar for an end of rope."

[notes."note_cda7a3358c6ef830"]
"text" = "A student heading home with a lantern"

[notes."note_01b77cf80de86e54"]
"text" = "The lantern-for-hire man"

[notes."note_13d2e97f382c8a85"]
"text" = "The acacias along the slope rustle in the night wind as if people were whispering. The kamal board still hangs around your neck. Once you know this night road you know it for good; later walks are practice for your nerve."

[notes."note_5eb8fa2c1cabdadd"]
"text" = "The half-buried bulb"

[notes."note_1654314ff3c573b9"]
"text" = "Pomegranate branches lean over the wall, and ripe fruits split and spill red seeds on the ground while bees hum above them. A pen case doesn’t wear out. One lesson is all this plant needs. Along the foot of the wall lie small lumps of dough the keeper has set out for the rats, and the children all know to walk around them."

[notes."note_1892ab418bfa13e1"]
"text" = "The women beating laundry"

[notes."note_7a7e0eb478a5d9f0"]
"text" = "A sea beast at the spring"

[notes."note_6d575ff1497d4fd0"]
"text" = "A traveling paper-seller waters his mule at the spring and opens a copy of al-Qazwini’s Wonders of Creation: in the painting a great fish has trees on its back, and sailors who take it for an island light a cooking fire, and the heat sends it under. The washerwomen laugh and ask whether the spring comes out of the fish’s belly too."

[notes."note_04f0f85f6a224941"]
"text" = "The mouth stays cool all year, and at high-summer noon the women crowd in to wash. You light the candle all the way in and carry it home whole. The cave’s secret counts only the first time; after that, just check the water line for the women."

[notes."note_c634a02d825bacb1"]
"text" = "A clay pipe in the channel bed"

[notes."note_5659e5dbea4e612a"]
"text" = "The treasure-digger’s old book"

[notes."note_7e2a78eda6e5485d"]
"text" = "A treasure-digger resting under the arch pulls out a dog-eared Wonders of Creation and taps a page: a great fish carries an island on its back, and islands mean gold, it says so right there. You lean in. The painting shows a few trees and a fire the sailors have lit, and not a glint of gold."

[notes."note_f5f40d4751722a4b"]
"text" = "When the figs ripen, the whole valley smells sweet and fills with wasps. The ink case goes back into your sleeve as full as it came out. The line counts only the first time you read it; later, come and eat a fig in the shade of the arch."

[notes."note_e595407dad7fbdb4"]
"text" = "The contract scribe"

[notes."note_ee827a66b9184bac"]
"text" = "The alley is so narrow that two men carrying a chest can’t pass, and at dusk every stall lights up and the whole lane glows gold. The balance hangs at your belt again with every weight accounted for. You settle this business a single time; after that, sellers glance at the scale on your belt before they name a price."

[notes."note_4a16cd1632164abe"]
"text" = "The apprentice at the vats"

[notes."note_40228319eb2212ef"]
"text" = "The water at the outfall changes color day to day, and when red cloth is being dyed, half the bay runs red. The palm comes off your hand stained with indigo and none the worse. Saving the skiff settles the account for good; after that, the dyers will teach you to tell a few of their dyes apart."

[notes."note_9e6aafc11c021cc5"]
"text" = "A goatherd boy"

[notes."note_2e081727a12859a3"]
"text" = "The “lamp-oil” collector"

[notes."note_f0246011e650d66c"]
"text" = "The wind on the slope smells of thyme, and the roadside stones are hot to the touch. The kamal board has hung at your belt all the way, its cord unbroken. You need to learn this track only once; later climbs build your legs and give you a rest at the lodge door."

[notes."note_f9d2e5acb59468fd"]
"text" = "Bay leaves on the hedge"

[notes."note_ea391b75d2eee878"]
"text" = "Beyond the hedge runs a little ditch, and in spring the frogs are too loud for sleeping. The pen case goes back into your book bag as it came. You need to tell these two clumps apart only once; after that, the old apothecary will teach you other herbs."

[notes."note_33f658284f3e98a8"]
"text" = "The lodge’s old servant with a lantern"

[notes."note_61bdf9820bb22f2a"]
"text" = "The sea beast copied in the dormitory"

[notes."note_9d49e976206b595c"]
"text" = "A page of al-Qazwini’s Wonders of Creation is being passed around the dormitory: a great fish floats on the sea with trees on its back, and sailors climb up carrying cooking pots. The younger boys declare that the bell in the cistern is that same fish turning over under the water. An older student raps the speaker on the head with the book: it was written to teach you about the world, not to frighten people."

[notes."note_7998a02ba7e4471b"]
"text" = "The mouth of the cistern stays cool all year, and noon in summer is the best time to be there. The candle you lit below goes back into your bag as good as new. The cistern gives up its secret only once; after that, just lean over and listen for the bell."

[notes."note_fff126e27a4b63ea"]
"text" = "Brick fragments by the holes"

[notes."note_bae0948198eede8a"]
"text" = "The mule driver from Safi"

[notes."note_f797c3d4a4316a1c"]
"text" = "A mule driver says an old sailor at Safi, on the Atlantic coast, told him of a cook off Mogador who set his pot on a tree-covered “island”; the soup had barely boiled when the island went under, and pot, bowl, and supper all went to the fish. The diggers nearby double over laughing: at least what they dig is earth, not fish. The mule driver ignores them and leads his mule away."

[notes."note_64188c95a4e915f3"]
"text" = "Cicadas make your ears hum in the olive grove, and the shade under the trees is the coolest place outside the city. The ink case weighs the same going down as coming up. The stone needs reading only once; later, rest a while and see where the treasure-hunters dug this year."

[notes."note_df3754f363ccc9ec"]
"text" = "The letter-reader at the next stall"

[notes."note_45367ad510491b6c"]
"text" = "The paper market comes alive after dark, and the street smells of pulp, glue, and ink. The balance goes back into its pouch with every weight in place. Once the matter is settled, the reward is paid only that one time; from then on you’ll catch yourself hefting every bundle you pass."

[notes."note_ab69c74531dc8426"]
"text" = "The girl with the dough board"

[notes."note_bd908fcf651b28c8"]
"text" = "In spring the river runs fast and muddy, and the moss on the steps is so slick that everyone drawing water stands on the same one. The palm slips off in one piece, its stitching whole. You repair the bridge only once; later, sit on the steps and count the people crossing."

[notes."note_d1997e688821f6c6"]
"text" = "A copyist with a book box"

[notes."note_b4ad0762b3c524b0"]
"text" = "The man collecting for the “new order”"

[notes."note_9f76e18f333c7452"]
"text" = "The shelter holds only a low table, a jar of cool water, and the clean smell of olive branches overhead. The kamal board goes back into the book box with every knot still tight. Learn the way home once and it’s yours; later, you can copy a page before heading down."

[notes."note_7b92678e575b591a"]
"text" = "Yam vines under the trees"

[notes."note_39f962609f567c30"]
"text" = "The thicket borders the mangrove flats; at high tide it smells of salt mud, and the mosquitoes are thick. Not a pen is missing from the case at day’s end. Telling these two vines apart is a one-time job; later, the grandmother will take you out to learn other wild greens."

[notes."note_f0ff2b6c80a5986d"]
"text" = "The old stonemason"

[notes."note_e7e57ca72c3d892d"]
"text" = "A merchant from Aden on the roc"

[notes."note_9de88e450b56bb27"]
"text" = "A merchant back from Aden rests outside the cave and tells Sindbad’s tale: the roc’s egg is as big as a mosque dome, and the bird can lift an elephant in one claw. Bats stream out of the cave mouth; the children count them with their heads tipped back and, halfway through, start shouting that those are the little rocs. The merchant just laughs."

[notes."note_c6c1d2d60e2cd2d6"]
"text" = "The cave faces the sea, and when the tide goes out the rocks are covered in tiny crabs and oyster shells that will cut a careless foot. Even after the long walk in, the candle is as long as when you went in. The cave’s secret counts once; later, check the roof for new cracks for the mason."

[notes."note_990e89f233444206"]
"text" = "Cowries under the threshold"

[notes."note_f08b2c98605e0f17"]
"text" = "The captain’s giant egg"

[notes."note_0297fd41fde892f5"]
"text" = "An old captain says that on the big island to the south he saw an eggshell that could hold a whole bucketful of water, and people used it as a jar. They told him it was an egg laid by the roc of Sindbad’s tales. He won’t swear to it; he only says that jar fetched three bolts of cloth on the quay."

[notes."note_a58ed28b7495c61c"]
"text" = "A coconut palm grows in the yard the footings enclose, and ripe nuts land on the stones with a thump. Rinse the brush, close the lid, and the ink case is as full as before. What you gain from reading the line comes only once; later visits are for sitting on the threshold."

[notes."note_09fbd917f199f818"]
"text" = "The stall scribe"

[notes."note_087a3e8009327254"]
"text" = "The market sits on the sand beside the ferry landing, coconut-oil lamps in a long row that all sway when the wind picks up. A little sand clings to the balance, and a puff clears it. The reward for this bargain comes only once; after that, when ivory is weighed you’ll know what a tusk should be."

[notes."note_ab682ef2e2174f2e"]
"text" = "The rope-rolling women"

[notes."note_0fa72017e2a1d5b3"]
"text" = "Fish dry on the sand, flies swarm, and heaps of coconut husks lie under the trees waiting to be soaked. Husk dust clings to the palm, and a shake clears it. You save the canoe only once; later, the women will teach you to roll rope."

[notes."note_68119ddf2b24a65f"]
"text" = "The ivory porters"

[notes."note_b7fb3a3d7e4e6efd"]
"text" = "The man collecting a cowrie “tax”"

[notes."note_753205f1c6b16d3e"]
"text" = "The baobab by the well is older than the village, and a child can hide in its hollow trunk. The kamal board has taken no harm from a night of star-sights. One walk is enough to know the road; later walks are for your legs and for company with the porters."

[notes."note_fd3a5ffadf8e8771"]
"text" = "Round melons under the vines"

[notes."note_f5b8062a1cca58b4"]
"text" = "In the evening the cool wind on the island smells of henna blossom, and the melon-watcher’s boy lies on the shed roof counting stars. You tuck the pen case back under your arm, none the worse. Sorting the two melons pays off only the first time; later, the gardener will cut you a slice of the real thing."

[notes."note_d5307a0cf9edf0e9"]
"text" = "The reservoir’s old watchman"

[notes."note_77a3bd7d34176f17"]
"text" = "The storyteller’s roc"

[notes."note_200a28df6ce5000a"]
"text" = "On the open ground before the reservoir a storyteller tells of Sindbad’s second voyage: the white “hill” on the island turns out, up close, to be a roc’s egg, and Sindbad unwinds his turban and ties himself to the bird’s claw to be carried away. The children turn and look at the row of brick arches and whisper, “Is that roof half an egg?” The storyteller grins and holds out his bowl."

[notes."note_d49199702a9b53ee"]
"text" = "The mouth of the reservoir faces the hills, and in winter it’s warmer inside than out. The flame swayed under the arches for hours, and the candle is no shorter for it. The old reservoir pays out only on your first visit; later, try counting how long the echo takes."

[notes."note_210e0ce461e7ee36"]
"text" = "Flood marks at the foot of the stele"

[notes."note_adaee4894e469933"]
"text" = "The peddler’s roc feather"

[notes."note_c7ceb02f0eed92cf"]
"text" = "A peddler beside the canal sticks an ostrich plume in his donkey’s saddle and tells passing strangers it’s a feather of the roc, one silver coin. A student weighs it in his hand and asks why it’s so light, when a roc’s feather should be heavy as an oar. The peddler thinks it over: “That’s the lightest one it ever dropped.”"

[notes."note_5b89ae5f11a28563"]
"text" = "The vegetable plots along the canal lie in rows, and when the water is let in the whole field flashes. The rubbing done, the case closes on the same ink it opened with. Once the stele is read, there is nothing more to gain from it; later, come see whether the water is shared out fairly."

[notes."note_553909994afc3174"]
"text" = "The lodging’s copyist"

[notes."note_41ad27a80ca1863b"]
"text" = "The lamplit paper market stays open until midnight, a narrow lane of paper, pen, and ink sellers where even porters turn sideways to pass. Wipe the balance and slip it back into your sleeve; it’s none the worse. Only the first time earns anything; after that, paper dealers are careful when they call out their counts."

[notes."note_28fd3341e7faad82"]
"text" = "The keeper of the river gauge"

[notes."note_44e86c9969390315"]
"text" = "The gauge is a graduated stone column standing in a well; someone climbs down each dawn to read it, and criers shout the figure through the city. The palm gets wet and dries stiff, but it’s still yours. The boat can be saved only this once; later, come and learn to read the scale from the old man."

[notes."note_17e932f71ae83136"]
"text" = "A water-seller with a donkey"

[notes."note_1878eb93105249de"]
"text" = "The self-styled road watcher"

[notes."note_0e86e938eae668a6"]
"text" = "In the retreat’s yard stands an old sycamore fig said to have been planted by the master’s master, with a row of low stools in its shade. The kamal board goes back up your sleeve untouched. The first time you get through is the one that counts; later walks end in the master’s yard and a night of lectures."

[notes."note_6d8bab73206abdcc"]
"text" = "The yellow-flowered vine"

[notes."note_ccbed9f92e74c785"]
"text" = "Earlier generations planted these banyans to hold the levee, and their roots grip the mud harder than stone. The pen case is never used up. One look is enough to know this vine; on later visits the herb woman will teach you others."

[notes."note_54338f7e0da9e771"]
"text" = "Children gathering sea snails"

[notes."note_83edee6256f31b9a"]
"text" = "A city rising from the sea"

[notes."note_dc173ce031e061e2"]
"text" = "The children gathering snails say that on noons between spring and summer a city rises over the open sea—towers, banners, ships—and is gone with one gust. The village tutor calls it the breath of the shen, and quotes the Shiji: “By the sea, the shen’s breath takes the shape of towers.”"

[notes."note_4549b9eadd1ec17e"]
"text" = "The mouth faces west, and the evening sun reaches ten feet inside. The candle is still yours after you light it. The cave’s puzzle counts once; afterward, come back and watch the tide for the snail-gathering children."

[notes."note_a9f1dcd5eaca72bd"]
"text" = "Porcelain shards by the wall"

[notes."note_16411d71e630eaba"]
"text" = "A fleet seen from the watchtower"

[notes."note_4efa7f4e177be82b"]
"text" = "An old soldier who once stood watch here says that as a young man he saw a whole fleet coming in from the sea, masts thick as a forest, and beat the gong in terror. By the time the village came running with blades and spears, the fleet was melting away into the haze. Ever since, people have called it the breath of the shen."

[notes."note_c50059a4324e9135"]
"text" = "The ground inside the foundations grows taro and beans now; no one needs to guard the wall. The ink case comes home with you. The stele needs reading only once; later, take a few rubbings for practice."

[notes."note_a50d408a5b1ea64e"]
"text" = "The temple bookkeeper"

[notes."note_4de32134435a6745"]
"text" = "Foreign goods, dried seafood, sugar, cloth—the night market has everything except officials. Your balance is never used up. The case closes once, and after that no crooked scale gets past you."

[notes."note_2bae910f52d765ac"]
"text" = "The net-mending women"

[notes."note_01489981a738bae0"]
"text" = "At high tide the bar shrinks by half, so the net-drying families have to time their gathering. The palm won’t wear out. You save the sampan only once; later, come learn net-mending from the women."

[notes."note_0bea92624022fda8"]
"text" = "A woman carrying incense uphill"

[notes."note_73d8ec796d77382a"]
"text" = "The “bridge money” man"

[notes."note_82625ed12251ce8c"]
"text" = "The old trail is paved with flagstones worn glossy by centuries of feet. The kamal board is never used up. You need to learn the way only once; walking it later is good for your legs."

[notes."note_6c1eb5eb523af791"]
"text" = "Sword leaves by the pond"

[notes."note_b35b95ec29d8f002"]
"text" = "The herb garden is small, mostly what the teacher uses himself: mint, perilla, a few chrysanthemums. The pen case comes home with you. You need to tell these two apart only once; later, the teacher will quiz you on others."

[notes."note_2e2097427a6e1a59"]
"text" = "A scholar copying inscriptions"

[notes."note_d3f00425f0602e2b"]
"text" = "The teacher on sea markets"

[notes."note_43f53326c5a5ae9e"]
"text" = "The schoolmaster says towers of shen breath are already in the Shiji’s Treatise on the Celestial Offices, and that Shen Kuo of the Song saw a “sea market” off Dengzhou. Some blamed dragons and shen; Shen Kuo had his doubts. Then he adds: believe what you like, but learn the text by heart."

[notes."note_14420da2e3cb5dac"]
"text" = "Some of the inscriptions on the cliff are older than the school. The candle is still yours after you light it. The cave needs exploring only once; later, come copy the writing on the rock."

[notes."note_a195f24a3cc9ddad"]
"text" = "Bridge stones in the riverbed"

[notes."note_efb3ee589439f756"]
"text" = "The sea market an old boatman saw"

[notes."note_cce5c106740bca3d"]
"text" = "The old boatman who poles under the bridge says that in his seagoing years he saw a sea market far offshore: a city hanging above the waves, its gate open, people coming and going. He fell ill the day he got back to port, and he has kept to the river ever since."

[notes."note_de03b256df074bd1"]
"text" = "No two people in town agree on the year the bridge broke. The ink case comes home with you. The line needs reading only once; later, come and copy the great characters from the pillar."

[notes."note_0d5978f15be678cf"]
"text" = "The hired copyist"

[notes."note_fc48b214037fee04"]
"text" = "Most of the town’s booksellers stock up from Jianyang, and once the lamps are lit the stalls fill half a street. Your balance is never used up. The matter is settled once; after that, nobody shortchanges you on a book."

[notes."note_be99254c0c59c4af"]
"text" = "The firewood seller"

[notes."note_2c2c923f1fa571e0"]
"text" = "Every step has tide marks and years scratched into it; the highest, the old folks say, is from the year of the great flood. The palm comes home with you. You save the boat only once; later, sit on the steps and watch the tide."

[notes."note_0b83e519f364c6a3"]
"text" = "The temple keeper with lamp oil"

[notes."note_d11fb3da8c0e9529"]
"text" = "The man with the forged seal"

[notes."note_f3d0fd4edf5689d8"]
"text" = "From the lookout you can see the boats heading out, and fishermen’s wives often wait for them here. The kamal board comes home with you. Once is enough to learn the way; later, come up and wait for the stars."

[notes."note_7fe236d3fe8eb1b2"]
"text" = "Mugwort at the grove’s edge"

[notes."note_c6185ff3d4da1378"]
"text" = "The sand under the pines is soft and silent underfoot. The pen case comes home with you. You need to sort out this patch only once; after that, each visit makes your gathering hands surer."

[notes."note_2353792e4de087ef"]
"text" = "The shellfish gatherers"

[notes."note_58ba7258b343a5c6"]
"text" = "The king who became a sea dragon"

[notes."note_d6098470c1528a3c"]
"text" = "An old sailor says a king of Silla vowed on his deathbed to become a dragon and guard the eastern sea against raiders. He lies beneath a great rock out in the water, and to this day fishing boats ease their oars when they pass it."

[notes."note_85d58e1322bd55a9"]
"text" = "The mouth shows only on the lowest tides; the rest of the time there’s just a ring of white surf. The candle comes home with you. The grotto’s secret counts once; later, come sit on the reef and listen to the waves."

[notes."note_ebe940352e11df77"]
"text" = "An arrowhead under the wall"

[notes."note_6bdcc5295b0bbe05"]
"text" = "The lady sung back from the sea"

[notes."note_a67e132023a61151"]
"text" = "An old man drying nets by the wall tells it: long ago a sea dragon snatched a lady from the shore, and on an old man’s advice the people gathered and sang, beating the bank with sticks, until the dragon gave her back. Her clothes carried a scent found nowhere in the human world."

[notes."note_b1cbe14398b1c914"]
"text" = "The wall was built of beach stones, and every gap is home to tiny crabs. The ink case comes home with you. The stone needs reading only once; later, help the elders make out other inscriptions."

[notes."note_99ca4e2912e71e86"]
"text" = "The contract writer"

[notes."note_91e573a778650086"]
"text" = "The market sits between the docks and the government offices, and its lamps come on one by one as night falls. Your balance is never used up. The matter is settled once; with each later visit, your ear grows more used to all the languages."

[notes."note_68e40699d8770558"]
"text" = "The old oar-maker"

[notes."note_d73ed7b2ae9872cb"]
"text" = "A reef guards the mouth of the cove, so however rough it is outside, the water within stays low. The palm won’t wear out. You help with the boat only once; later, borrow it to practice rowing."

[notes."note_3e1ae7e5ad446b4a"]
"text" = "A woman going up to pray"

[notes."note_e687bb4c2e47b5ba"]
"text" = "The stranger who wants paying"

[notes."note_6fd2b54fab90d3ff"]
"text" = "The grove is quiet except on feast days, when there are drums. The kamal board comes home with you. You need to learn the way home only once; later visits are for your legs, and for a quiet mind."

[notes."note_61d2c7e3bcfd84a8"]
"text" = "Pinellia on the slope"

[notes."note_9b348c0c7e153314"]
"text" = "The slope faces south and is the first to green in spring. The pen case comes home with you. You need to tell these apart only once; after that, the teacher will send you out to gather."

[notes."note_61f42c784b795ca4"]
"text" = "The grotto’s old keeper"

[notes."note_835dfc8377d09aa1"]
"text" = "A red light over the ship"

[notes."note_afb422a792466460"]
"text" = "The old teacher says he read it in a book by a Ming envoy: in the thirteenth year of Jiajing, the envoy’s ship was sailing home from Ryukyu when a night storm snapped its mast. Everyone aboard cried out to Tianfei, and suddenly a red light like a lantern settled on the ship, and they all shouted: Tianfei has come, we’re saved."

[notes."note_7b844838565e8351"]
"text" = "Moss grows between the flagstones, and they’re treacherous in the rain. The candle comes home with you. You need to see the “well” for what it is only once; later, come practice your pronunciation in the grotto—the echo will catch your mistakes."

[notes."note_944bc1fd9348135a"]
"text" = "Old tiles beneath the terrace"

[notes."note_c1a6c0f57521b63d"]
"text" = "The young dragon who made it rain"

[notes."note_8a5f54876aae0135"]
"text" = "The school’s old handyman tells it: the son of the Dragon King of the Western Sea lived with a monk as his disciple. In a year of drought the monk asked him for rain, and he sent it without Heaven’s leave. Heaven sent thunder to strike him down, but the monk hid him under the bed and pointed at the pear tree in the yard—and the thunder struck the pear tree."

[notes."note_f36dfa8b3d06b01a"]
"text" = "The terrace faces the open sea, and from it you can see the whole channel into port. The ink case comes home with you. The poems need reading only once; later, try writing a reply of your own."

[notes."note_5b2473c9f2d0fa3e"]
"text" = "The old servant weighing ink"

[notes."note_0ab7dd7bad073a47"]
"text" = "The paper-and-ink stalls set up only in the evening, and when school lets out, students are always the first to crowd around. Your balance is never used up. The matter is settled once; after that, you can tell good ink from bad by its heft."

[notes."note_cf0137064b35b9fa"]
"text" = "The women watching for sails"

[notes."note_36342605550fe516"]
"text" = "The stone posts are grooved by years of rope, and the oldest is said to have stood for decades before the school was built. The palm comes home with you. You help the sampan only once; later, come keep the others company watching for sails."

[notes."note_d07ee8fe966a5651"]
"text" = "An old woman sweeping the path"

[notes."note_21ec1487e9ec4774"]
"text" = "The man with the straw rope"

[notes."note_002d539056e46d20"]
"text" = "From the path you can see the old trees inside the shrine, but no one takes a step farther in. The kamal board comes home with you. Learning the way once is enough; later, come back and wait for the moon."

[notes."note_c04a480b4597d35d"]
"text" = "The thorned vine on the clove tree"

[notes."note_3c94b319fd073855"]
"text" = "A ring of wild vines is left standing around the clove garden, supposedly as feed for the birds. The pen case comes home as it left. The poison yam counts once; on later visits there are other vines at the edge waiting to be named."

[notes."note_16b51ff262b8a7ed"]
"text" = "The old nest gatherer"

[notes."note_8402b1dd9485b62c"]
"text" = "The navel of the sea"

[notes."note_dc2d495702bc7b14"]
"text" = "An old helmsman squats at the cave mouth chewing betel, listening to the stream pour itself into the dark, and says it sounds like the navel of the sea. Far out in the southern ocean, he says, the water spins down a great drain beside a tree that touches the sky, with birds in it big enough to carry off a buffalo. A giant crab lies under the drain, and as it breathes in and out, the tide rises and falls."

[notes."note_508b17f02b14de01"]
"text" = "For half the year the water at the mouth runs brown. A candle you light here is still yours to take home. The cave pays out only once; after that, sit at the mouth and keep the old man company while he whittles new rungs."

[notes."note_c07a68d30a1bb52e"]
"text" = "A wooden peg in the crack"

[notes."note_15621615b65e47b2"]
"text" = "The ship that turned to stone"

[notes."note_db4e1e1e1fe650fb"]
"text" = "A woman washing clothes at the landing tells it: a poor boy went to sea and came home rich, with a fine wife and a shipful of goods, and on the quay he would not know his own ragged old mother. She wept and called on heaven; a wind came up, and the ship, people and cargo together, turned to stone. It still lies in the shallows downstream."

[notes."note_ea1b6e6d8f400517"]
"text" = "Decades of tide have blackened the blocks, but the ironwood is still red at the heart. The ink case comes home with you. Once the line is read it stays read; later, come and watch the shipwright run a new hull down the slip."

[notes."note_371933099f66fd43"]
"text" = "The old spice weigher"

[notes."note_47d8bd4a0c143bc8"]
"text" = "The boats tie up in the same spots every night, and a single one will sell you greens, betel, dried fish and clay pots. Your balance comes home with you. The swindle can be exposed only once, but after that your nose catches a false scent before your eyes do."

[notes."note_6863cff2afd3cb82"]
"text" = "The boy leading a buffalo to drink"

[notes."note_d779580db58a65ce"]
"text" = "The flat is riddled with crab holes, so you shuffle barefoot. The palm goes back in your bag without a mark on it. You save the line only once; after that, come back and learn the signs of the tide from the salt boiler."

[notes."note_3112e5162e136922"]
"text" = "A woman with a bamboo basket"

[notes."note_cdc389b95f8ac580"]
"text" = "The man who wants sticky rice"

[notes."note_20302ad6f4b70263"]
"text" = "The banyan’s aerial roots hang to the ground, and cloth strips tied to them over the decades have been washed colorless by the rains. The kamal board is never used up. Learning the way counts once; on later climbs, count how many new strips have appeared."

[notes."note_3fa5141fc3bcb0a5"]
"text" = "Rat holes under the clump"

[notes."note_e61901ffa4498af4"]
"text" = "A bamboo clump flowers once in several decades and dies when it’s done. The pen case goes back in your bag, lid shut. You sort this out only once; later, come back and learn the shoots, which are sweet and which are too bitter."

[notes."note_882ebff691027bd9"]
"text" = "Children with leaf boats"

[notes."note_c4a60c2c2b2fb354"]
"text" = "The naga beneath the hill"

[notes."note_0fd06c74f2c597ca"]
"text" = "A salt peddler says that when the naga under the hill turns over, the ground shivers and the well water stays muddy for three days. In the old days people left bowls of steamed sticky rice at the cave mouth to beg it to sleep sounder. Fewer people leave them now, though the ground doesn’t seem to shake any more than it did."

[notes."note_477e6e162217c01e"]
"text" = "The stones at the mouth are worn slick, and sandals slip on them. Snuff the candle and it goes back in your bag as it came. The cave counts once; after that, come and fold leaf boats with the children."

[notes."note_f19f7533981c072d"]
"text" = "A square-holed coin in the brick joint"

[notes."note_ec78ea79896dde15"]
"text" = "The serpent that eats the moon"

[notes."note_32d01689ff02678a"]
"text" = "A boatman from the Visayas, resting on the platform, tells the old saying of his islands: an eclipse is a great serpent swallowing the moon, so everyone beats pots, basins and rice mortars until the din makes it spit the moon back out. He grins. The method, he says, has never once failed."

[notes."note_770da784ab88043d"]
"text" = "The bricks were fired centuries ago and still carry the kiln workers’ fingerprints. The ink case is never used up. The months need working out only once; later, whitewash the notches so the old fisherman can see them."

[notes."note_586f95f45f1ea7d4"]
"text" = "The sailors’ letter-writer"

[notes."note_dc9cb5471b6d31ac"]
"text" = "The stall lamps burn coconut oil and the smoke stings the eyes, but buyers put up with it to see what they’re getting. The balance goes back up your sleeve. The matter is settled once; after that, you can judge any sheet by holding it to a lamp."

[notes."note_dc115fbc3b9aab5a"]
"text" = "The ferryman’s daughter"

[notes."note_83280dde8a980887"]
"text" = "The bend is full of people trying paddles, and wood shavings float on the water. The palm comes home looking new. You save the boat only once; after that you may borrow it to practice, but you must ask the girl first."

[notes."note_cfc2c98072a8dc69"]
"text" = "Porters resting halfway"

[notes."note_ad22375fb5a2949b"]
"text" = "The man minding the betel box"

[notes."note_12ab33e21003ee7f"]
"text" = "The trees are older than the school buildings, and their roots coil into a ring of natural seats. The kamal board goes up the hill and comes down again, none the worse. Only the first climb counts; later you can come early and claim the seat nearest the roots."

[notes."note_fdbe9d24a1d3a630"]
"text" = "The stinging bush by the plot"

[notes."note_48e02006b7fc74bc"]
"text" = "The plot is ringed with loose stones to keep out peccaries. The pen case is never used up. You need to know this bush only once; after that, the woman next door always has a fresh handful of leaves and wants every name."

[notes."note_8768f23561f86fe4"]
"text" = "Women drawing water"

[notes."note_e2984be947e68df7"]
"text" = "Four roads under the earth"

[notes."note_163e61ac7c049e6f"]
"text" = "Resting at the well, a K’iche’ trader from the southern highlands tells an old story of his people: roads run beneath the earth to Xibalba, forking at the entrance into red, black, white and yellow, and take the wrong one and you never come back. The old woman drawing water hears him out and says only: this well belongs to the rain god. It is nobody’s house of the dead."

[notes."note_bd8b9b4c8adabb33"]
"text" = "The stones of the rim are blackened by generations of hands. When the flame goes out, the candle is still in your hand. The well gives up its secret once; after that, come and haul a bucket up for the women."

[notes."note_1e9a8a39904398c5"]
"text" = "An obsidian flake in the ferns"

[notes."note_a870a54c3ad361a8"]
"text" = "Raised in a single night"

[notes."note_c03d2ce785f53ffc"]
"text" = "The old people tell how a dwarf once hatched from an egg tended by an old woman. The king, annoyed at the sight of him, ordered him to raise a stone platform in a single night, and before dawn it stood finished. Then the king had hard nuts smashed on the dwarf’s head and he came to no harm; when it was the king’s turn to try, his own skull cracked first."

[notes."note_3918c74ccfc77875"]
"text" = "Ferns fill the cracks, and when the rains come the moss covers the squares completely. Not a drop of ink is gone from the case. The line needs reading only once; after that, come and carry a bucket of clean water for the elders when they scrub the stones."

[notes."note_f6392bcc69095c2d"]
"text" = "The old scribe who counts beans"

[notes."note_c426deb1a49c01fe"]
"text" = "Here cacao is both a drink and money: twenty beans make a small pile, four hundred a large one, and everything is priced by the pile. The balance goes back in its pouch after weighing the beans. The trick counts only the first time you catch it; after that, your fingers can tell a good bean from a bad one."

[notes."note_ddc9e2d78a8763b3"]
"text" = "The woman shucking oysters"

[notes."note_5e3ae6257d638b45"]
"text" = "When the tide goes out the shallows show a wide crust of white salt that crunches underfoot. The palm shows not a scuff. Only the first splice counts; after that, come back and learn to read the wind from the salt carrier."

[notes."note_5bd807566cec91e4"]
"text" = "A man with a log hive on his shoulder"

[notes."note_538bbd1f028aebe3"]
"text" = "The stranger who collects road tribute"

[notes."note_7f58f7aa16ae1ed9"]
"text" = "Orange lichen grows on the path stones, and after rain they are slick. The kamal board goes back inside your shirt. Learning the way once is enough; later, go along with the beekeeper and watch him cut the honey."

[notes."note_88f1995d6e180135"]
"text" = "The red-barked tree beside the poisonwood"

[notes."note_696df73fde7a1991"]
"text" = "When the sour orange blooms the whole forecourt smells of it, and bees outnumber pupils. The pen case still shuts as snugly as before. You need to know this tree only once; after that, you can borrow the friar’s sketchbook of plants to leaf through."

[notes."note_ad2e94298e3563b1"]
"text" = "The boy who draws water"

[notes."note_865e5a3d8827dfea"]
"text" = "Those thrown into the well"

[notes."note_675b395350184861"]
"text" = "An old salt trader who delivers to the friary says that in the old city to the east there is a great round well, and in years of drought people used to throw gifts and people into it to beg for rain. Some say those thrown in don’t die, only vanish, and that at noon a rope was lowered to pull up any still awake and ask them whom they had met below."

[notes."note_cdd59e62c2debd4b"]
"text" = "The grotto is a stone pit the builders left when they put up the friary, and the well was sunk when they struck water. A candle you light here can be lit again next time. You need to understand the well only once; later, hum along with the choir."

[notes."note_b48eafc363c2f76f"]
"text" = "Worn-shallow marks on the doorstep"

[notes."note_1e3d333effb9b711"]
"text" = "The white road that glows"

[notes."note_8ebf924bda0cf48d"]
"text" = "Porters who walk between Mérida and Izamal, off to the east, say the white stone roads running out of the old town glow faintly at night, and that travelers on them often see a torch ahead that vanishes when they draw near. Their rule: don’t chase the torch. Count the stones under your feet instead."

[notes."note_e4f5779e4383eec9"]
"text" = "Most of these stones were hauled in from the ruins of the old town, and the sweeping woman could find the lettered ones with her eyes shut. The ink case is back in your bag as good as before. The doorstep needs reading only once; later, come and help her sort the rubble into piles by pattern."

[notes."note_f56dffd30de6be0d"]
"text" = "The midwife who teaches weaving"

[notes."note_24f5d8edf1b5dcd3"]
"text" = "The market sets up in the shade outside the friary, thread sellers, bark-paper sellers and honey sellers each on their own mat. The balance is never used up. Only the first swindle you expose counts; after that, a jar of water will tell you what any red is worth."

[notes."note_257105c6e1a5e6e8"]
"text" = "The woman who weaves sailcloth"

[notes."note_75fb953d4b8b4bec"]
"text" = "Mangrove seedlings stand thick in the mud of the fork, a green sheet at low tide. The palm comes home unworn. You mend the sail only once; later, come and learn the diagonal weave of sailcloth from the weaver."

[notes."note_43902aaf7f4bd873"]
"text" = "A lime burner"

[notes."note_ae429235eb933b6b"]
"text" = "The man holding up the paper"

[notes."note_f6bb9253ec67b2fc"]
"text" = "Black pits left by the lime burners dot the woods, bare of grass and soft underfoot. The kamal board is still yours afterward. Finding your way along this path counts once; later, set out early and catch the sea before sunrise."

[notes."note_c058b08fa90304b1"]
"text" = "Wild mint on the riverbank"

[notes."note_69b70cf1b18714f5"]
"text" = "The huarango shade is the coolest spot on the riverbank, and llamas and the children who herd them both drift in. Your pen case goes home as it came. The two clumps need sorting out only once; after that, visits just train your eye."

[notes."note_befea90dc67d9acb"]
"text" = "The llama herder"

[notes."note_7cfc22751f4ab66b"]
"text" = "A raft family’s tale of far islands"

[notes."note_2a1bd2e74e5fe56b"]
"text" = "An elder from a raft-making family rests at the cave mouth, husking roasted maize as he talks. His forebears went west with the Inca’s raft fleet, he says, and drifted a long time before they reached two islands. They came home with dark-skinned captives and a copper chair. The tale has passed through several generations and he won’t swear to it. Nobody has been back since, so nobody can check."

[notes."note_b70442fa0b827bc7"]
"text" = "The mouth opens on a dry riverbed that gets only a few rains a year, and each one comes down as a flash flood. A candle burned inside isn’t counted as spent. The cave’s secret counts only the first time; after that you are just here to hear the wind."

[notes."note_c12a8dc1f468cec2"]
"text" = "A spindle whorl beside the footings"

[notes."note_9bf1cf22bdb98961"]
"text" = "The voyage a cord-keeper remembers"

[notes."note_7755fdf3b44f045d"]
"text" = "The old cord-keeper who minds the storehouses fingers a worn cord at his belt. An ancestor of his, he says, kept a cord only for voyages: a big knot for an island, small knots for captives, and at the end one copper-colored knot for a chair. That cord rotted long ago, but the tale outlived it. The Inca’s raft fleet drifted west a long time and reached two islands, and it came back with dark-skinned captives and a copper chair. No one has sailed there since."

[notes."note_460cdbe7e7fca722"]
"text" = "The old storehouses were built where the wind blows hardest, to keep the grain dry. Your ink case goes home untouched. The carving needs reading only once; after that, sit on the footings and watch the sun slide into the valley."

[notes."note_a3088bbcb3697a8e"]
"text" = "The cord-keeper at the next stall"

[notes."note_04d7225cb18cde1c"]
"text" = "Hanks of cotton thread hang from poles, and the evening breeze turns them into a row of small waterfalls. The balance goes back up your sleeve unharmed. This business counts only the first time; afterward you can tell a false count by touch."

[notes."note_a91ea1d6517b68ea"]
"text" = "The old cord-twister"

[notes."note_b08c2a6cf5041d0c"]
"text" = "Balsa logs are stacked in the raft yard and dried fish hang in rows, and the sea wind smells of salt and fish. The palm comes off as good as it went on. The little boat is saved only the first time; later, try twisting a strand or two of cord yourself."

[notes."note_d7f2a0ab68414fda"]
"text" = "The llama driver"

[notes."note_76d5be10a030e916"]
"text" = "The “mountain money” man"

[notes."note_d3f7947833b5b634"]
"text" = "The wind is fierce at the pass, and every traveler adds a stone, so the cairn grows taller each year. The kamal board goes back into your pack. A mountain road you have walked once you don’t forget; later climbs are for the sunrise."

[notes."note_0c908fcd6ae65849"]
"text" = "The sticky shrub"

[notes."note_2cf4d8a183d45de1"]
"text" = "The garden grows medicines for what raft hands suffer most: fevers, sprains, cuts, sunburn. Your pen case is none the worse. The tangled stakes need sorting only once; later, the old gardener may pull out a few stakes on purpose to quiz you."

[notes."note_3ac2ee7360938960"]
"text" = "A pupil fetching old cords"

[notes."note_e9668dce3ea1db16"]
"text" = "The old pilot on the western islands"

[notes."note_ac86ed4b498e5845"]
"text" = "An old pilot squats at the cave mouth mending a sail and talks about the western sea. His forebears went west with the Inca’s raft fleet, he says, gone for months, and found two islands. They hauled home some dark-skinned captives and a copper chair. He has never been there, and never met anyone who has; the tale has passed through the mouths of several generations. No one has sailed that way since. The wind’s wrong, he says. Or maybe the nerve is."

[notes."note_c9fe4c35b63055ec"]
"text" = "The doorway faces the sea, and in the afternoon the fog creeps right up to the threshold. A candle you carry in comes out with you; it is not spent. The chamber needs exploring only once, but later you can help the old teacher dust the cords."

[notes."note_d7378a59c0a7994f"]
"text" = "Old notches on the sluice board"

[notes."note_dfe4f43a812f7248"]
"text" = "The copper chair on a child’s slate"

[notes."note_8384663383440b0b"]
"text" = "A boy who has just learned his Castilian letters squats by the stone, taking down on a slate what his grandfather tells: that their forebears put to sea with the Inca’s raft fleet, sailed on west to two islands, and brought home some dark-skinned captives and a copper chair. He gets stuck on how to spell “copper.” Nobody has been to those islands since, says the grandfather, and the tale just goes on being told. No hurry, take your time."

[notes."note_fdb23b520000e04e"]
"text" = "The channel runs full only in the rainy season; the rest of the year the water is shared out in turns. Your ink case comes home with you, none the worse. The stone needs reading only once; later, come and see whose turn the water has reached."

[notes."note_892ac041caf6b931"]
"text" = "The cord-keeper among the cords"

[notes."note_c36908ce3cec6b7c"]
"text" = "Few coins change hands at the quipu market; people barter, and every deal is sealed with a knot. Your balance doesn’t wear with use. This business is cleared up in one go; afterward you will know what is solid just by hefting it."

[notes."note_7ca47980bf33cbdc"]
"text" = "The dozing raft master"

[notes."note_1a4491fc9980dce7"]
"text" = "A practice raft must go from the school’s beach into the surf, and every lashing has to survive the pounding. The palm won’t wear out, so keep it for next time. You mend this raft only once; later, learn from the old master how to “see” a rope with your hands."

[notes."note_6ba26e0e0c8f917c"]
"text" = "The old man drying seaweed"

[notes."note_873150103ed38d52"]
"text" = "The man with the “knotted warrant”"

[notes."note_3dbd6398a4130d83"]
"text" = "The steps to the lookout date from the Inca’s time, each one so narrow that only a single llama can climb at a time. Your kamal board is never used up; it goes back down the mountain with you. One climb teaches you the steps; later you come up for the sea, and for the fog."

[notes."note_b1d215da007dab68"]
"text" = "Neem by the estuary"

[notes."note_be8abc201c9d8db6"]
"text" = "The grove breaks the salt wind for the village, and when the tide drops in the morning its roots are riddled with tiny crab holes. Your pen case goes home unspent. The two trees need telling apart only once; after that, the old woman may ask you to look over her trees."

[notes."note_ce4fe71b9e7223d0"]
"text" = "The women digging razor clams"

[notes."note_ce7f22082b798fd0"]
"text" = "The leaf at the pearl stall"

[notes."note_55b859accbee62fe"]
"text" = "Tucked inside the lid of a pearl merchant’s tray is a Persian painted leaf: a roc flying over the sea with an elephant in its claws. The merchant says it came from Hormuz, and that the tale is in the Thousand and One Nights and in al-Qazwini’s book too. A child asks whether one could be caught in the harbor here. He shakes his head: you’d have to sail very, very far."

[notes."note_8559dad2d942b1bd"]
"text" = "The mouth faces the estuary mudflats, and at the lowest tides the ground underfoot is slick. A beeswax candle burned here isn’t counted as spent. The hollow gives up its secret once; after that you come to train your nerve, and your ears."

[notes."note_302a7109c496b4e0"]
"text" = "An old weight on the platform"

[notes."note_f91bb39b65c61e43"]
"text" = "The boatman on the roc"

[notes."note_cb837f3ce16c8a7e"]
"text" = "A boatman resting by the platform says he once saw a Persian painting at an inn in Hormuz: a roc flying over the sea with an elephant in its claws, like a sparrow carrying a grain of rice. The people at the inn said the storytellers tell that one every day. The boatman has never seen such a bird, and doesn’t care to; if one exists, it’s far out at sea, and he has no plans to go."

[notes."note_750eab9173ea59db"]
"text" = "The platform stands alone in the sea wind, and the air tastes of salt night and day. Your ink case is good for the next trip, too. The half-line needs reading only once; later, come back and practice on the old letters."

[notes."note_8706c72bbd901bb9"]
"text" = "The old loan-note writer"

[notes."note_0d9cb6174a4bbfe0"]
"text" = "Pearls, carnelian, indigo cloth and spices are sold by the grain and by the pound under lamplight, and the air is salt, damp and sweet with sandalwood. Your balance comes through intact. The matter is settled once; after that, you’ll size up a pearl at a glance."

[notes."note_c8236b5b9aab583b"]
"text" = "The salt-pan worker"

[notes."note_c7e6341eb279ea81"]
"text" = "The mud on this beach is gray, and the deeper you wade the harder it is to pull a foot free. Shake the sand off the palm and it hangs at your belt as before. The skiff is rescued only once; later, come and listen to the salt-pan worker talk about the tides."

[notes."note_db995eba847aac7e"]
"text" = "The cowherd coming down"

[notes."note_d73484989b78449b"]
"text" = "The “lamp-oil money” man"

[notes."note_aac5162c1fffec4c"]
"text" = "Thorn scrub lines the road, and at night fireflies blink among it like scattered lamps. The kamal board takes no harm; you carry it back down. Learn the road once and it’s yours; later you can simply sit awhile before the shrine."

[notes."note_98f7c251625fccf9"]
"text" = "Indigo by the garden wall"

[notes."note_4e464d66ec8c6839"]
"text" = "Indigo is one of Cambay’s great exports; the garden is cut several times a year, and the ditch behind the workshop runs blue all season. Your pen case isn’t used up. The two clumps need telling apart only once; after that, the dyer will let you try reading the color of the vat."

[notes."note_e573aa1e6423d480"]
"text" = "A water-carrier resting on the well platform"

[notes."note_ff3fad5bcc801a4a"]
"text" = "The roc on a sweet wrapper"

[notes."note_cf29cf54938f7b64"]
"text" = "A sweet seller by the well wraps a customer’s sweets in a torn page, a Persian painting: the roc’s wings blot out half the sky, and the elephant in its claws is shrunk to the size of a cat. The page came out of an old book from Hormuz, he says. Someone asks where one could catch such a bird. He hands over the sweets: first you need a ship that can go far, and the bird lives only out of sight of land."

[notes."note_6dda746920dfe71e"]
"text" = "Down in the well it is so cool in summer that the season seems to change, and the moss on the steps has been worn glossy by countless feet. A candle you light is still yours when you climb back up. The well needs exploring only once; later you can lie on the board and listen to the haggling."

[notes."note_b04df54abdfc4495"]
"text" = "A huge bone in the ditch"

[notes."note_e24555f0ab2a6fd1"]
"text" = "The old clerk on the roc"

[notes."note_20bce7373ce77aa5"]
"text" = "The old clerk reads Persian, and says the manuscript came from Hormuz. In it he saw a painting: an elephant gripped in a roc’s claws, its four legs kicking at the air, and beside it a caption in small script taken from al-Qazwini’s book. The children press him: where is that bird now? A bird that’s written in a book is in the book, he says. If you want a real one, you’d have to take a ship to the edge of the sky."

[notes."note_e822713c7c99c4d9"]
"text" = "Only reeds and cow dung remain along the channel, and the wind carries the smell of silt. The ink you use isn’t counted as spent. The line needs reading only once; later, walk the old channel and see how far the sea has gone."

[notes."note_92303e83f33285d8"]
"text" = "The ink seller"

[notes."note_5980da68743c7b28"]
"text" = "The stalls sit outside the ferry warehouses, and the air under the lamps smells of old paper, fresh ink and paste. Keep the balance; you’ll want it again. One reckoning is enough; after that, no stall’s weights will fool your hand."

[notes."note_4d158820cff1ab35"]
"text" = "The shipwright with his chisel"

[notes."note_4f0bd66c34a4695a"]
"text" = "The yard is stacked with teak planks and coils of coir, and the air smells of wood shavings and fish oil. The palm goes back inside your shirt, no worse for wear. This boat’s trouble is solved only once; later, come and watch the master sew a hull."

[notes."note_3a833edd16432f40"]
"text" = "The water-carrier on the hill"

[notes."note_56bf5d14baec635a"]
"text" = "The man with the shiny bowl"

[notes."note_1311620d2d362d03"]
"text" = "At dusk the hillside smells of sandalwood and cooking smoke, and the ascetics’ bell comes down the slope one stroke at a time. The kamal board isn’t used up; it hangs from your shoulder again on the way down. After one climb the path is in your legs; later you come up for the climb, and for the bell."
