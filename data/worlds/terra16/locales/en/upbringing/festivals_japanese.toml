# A6：显示覆盖，仅含文字。

[festivals."festival_jp_new_year"]
"name" = "Japanese New Year"
"customs" = "At New Year, sellers in red with white cloths over their faces hawk kesōbumi on the street corners of Kyoto, charms for a good match written to look like love letters, one sheet to each plum branch. Buyers always say it is for a relative, then tuck it deep in a sleeve and walk home faster than usual."
"gift_custom" = "A round rice cake and a folding fan, a New Year poem tied to the ribs. The receiver need only say thank you; no answer is owed on the spot."
"date_note" = "The first of the first month, worked out by the Senmyō calendar. It moves with the moon, so it falls on a different solar date each year; 1553 has a leap first month and 1555 a leap tenth."

[festivals."festival_jp_herbs"]
"name" = "Seven herbs"
"customs" = "At first light the girls go down to the riverbank with baskets to pick seven kinds of young greens, murmuring water dropwort, shepherd’s purse, cudweed; a leaf picked by mistake is laughed out of the basket by a friend. Back home it is all chopped and boiled into a porridge that everyone eats together."
"gift_custom" = "A bunch of washed greens, or a bowl of hot porridge kept under a lid for someone who is late."
"date_note" = "The seventh of the first month in the Senmyō reckoning, six days after New Year, just as the first greens show on the riverbank."

[festivals."festival_jp_sagicho"]
"name" = "Sagichō at Little New Year"
"customs" = "On the fifteenth, door pines, old charms and spoiled calligraphy are piled on the riverbank and set alight. Rice cakes are skewered on bamboo to toast in it, and the children take turns guarding the embers so that no one tramples them out."
"gift_custom" = "A rice cake toasted brown at the bonfire and handed to whoever stands nearest; eat one and you won’t fall ill all year, they say."
"date_note" = "By the Senmyō calendar it is the fifteenth of the first month, the Little New Year, with the moon at the full and everything quieter than on the first."

[festivals."festival_jp_shangsi"]
"name" = "Third-month purification"
"customs" = "On the third of the third month paper figures called katashiro are stroked over the body, breathed on, and set on running water. The children run along the bank after them and watch where each one runs aground; the misfortune stays there, they say."
"gift_custom" = "A spray of peach in bud, or a few rice cakes pounded green with mugwort."
"date_note" = "The third of the third month, the day of purification, when the river has just warmed enough to wade in. In 1553, with its leap first month, the day slips to late April."

[festivals."festival_jp_tango"]
"name" = "Tango with sweet flag"
"customs" = "Sweet flag and mugwort hang from the eaves and the whole house smells clean and bitter. The apprentice sets the scent down in a practice book—“sharp” on one page, “like a well-side after rain” on the next—and never gets it quite right."
"gift_custom" = "Rice dumplings wrapped in bamboo leaf, or a kusudama ball of sweet flag and mugwort hung by the blinds on five-colored threads against ill luck."
"date_note" = "The fifth of the fifth month, around the start of the rains, just in time to cut sweet flag for the eaves. After the leap tenth month of 1555 the festival comes eighteen days later in 1556 than it did the year before."

[festivals."festival_jp_kajo"]
"name" = "Kajō"
"customs" = "On the sixteenth of the sixth month there is a line at the confectioner’s door. At home the sweets are shared out one by one, and when the night-duty ladies-in-waiting or the old gatekeepers are away, their portions are left under a dish until they come off watch."
"gift_custom" = "Sixteen little sweets wrapped in paper, no more and no fewer; if there are no sweets, dried fruit counted out in sixteen portions. Give them to those who share your room and to those on duty."
"date_note" = "The sixteenth of the sixth month, as the Senmyō calendar counts it, in the worst of the summer heat, when sweets will not keep overnight."

[festivals."festival_jp_tanabata"]
"name" = "Tanabata court observance"
"customs" = "Fruit is laid out in the courtyard for the stars and kaji leaves fill with poems. A length of white silk is spread out as the River of Heaven, and people sit facing across it in the nagare-no-za; a poem passes along the silk from one side to the other, and when the reply that comes back fits it perfectly, a girl on the near side hides her face in her sleeve."
"gift_custom" = "A poem on a kaji leaf, a few strands of five-colored silk, or a threaded needle. The receiver need only say thanks; no answer is wanted on the spot."
"date_note" = "The seventh of the seventh month, when the court keeps the kikkōden, the offering that asks the stars for skill. By the Senmyō calendar the moon that night is a waxing half-moon."

[festivals."festival_jp_bon"]
"name" = "Bon and furyū dancing"
"customs" = "On the night of Bon lanterns are lit in the middle of the street and people form rings, one voice starting a line and the rest answering as they dance around. Someone far from home stands at the edge, hears a line sung in the accent of home, and finds their feet have already carried them into the circle."
"gift_custom" = "A paper lantern, a bundle of thin noodles, or a few new melons for a house keeping vigil before its ancestors’ tablets."
"date_note" = "The Bon rites fall on the fifteenth of the seventh month by the Senmyō calendar: full moon, and the night the lanterns burn brightest."

[festivals."festival_jp_hassaku"]
"name" = "Hassaku"
"customs" = "On the first of the eighth month people walk half across Kyoto with gifts to thank those who have looked after them. A smaller one is wrapped for a friend of the same age, “to share some luck,” and the friend waves it away while already taking it."
"gift_custom" = "Ears of the first ripe rice, or a fan and a few quires of good paper, presented with proper ceremony to someone who has looked after you."
"date_note" = "The first of the eighth month by the Senmyō calendar, the day of the new moon, when the new rice is just ripe; in a year when it ripens late, people give fans and paper instead."

[festivals."festival_jp_moon8"]
"name" = "Fifteenth-night moon viewing"
"customs" = "On the fifteenth of the eighth month the writing table is carried out to the veranda, with taro and pampas grass set before the moon. Everyone leaves a gap on the poem slip for another hand to finish the line, and when the finish is good, the whole company is briefly silent."
"gift_custom" = "A dish of boiled taro, a plumed stem of pampas grass, or a poem with only its first half written. The receiver need only say thanks; the second half can wait."
"date_note" = "The night of the fifteenth of the eighth month by the Senmyō calendar, at the full moon; if the sky is overcast, people write to the faint glow behind the cloud."

[festivals."festival_jp_choyo"]
"name" = "Chōyō"
"customs" = "On the ninth of the ninth month people pick chrysanthemums at the hedge and write poems. The grown-ups float a petal in their wine; the children’s cups hold only clear tea, and they argue over whose petal sinks first."
"gift_custom" = "A spray of chrysanthemum just opened, or a pad of silk floss laid over the flowers overnight: it drinks up the dew, and wiping the face with it is said to add years to your life."
"date_note" = "The ninth day of the ninth month by the Senmyō calendar, the double-nine: nine is a yang number, and two of them in one date make the day of fullest yang."

[festivals."festival_jp_moon9"]
"name" = "Thirteenth-night moon viewing"
"customs" = "On the thirteenth of the ninth month the moon is viewed again, this time lacking one small edge. What was left unsaid last month can stay in that missing edge, said or unsaid."
"gift_custom" = "A small basket of new chestnuts and green soybeans, or a poem that carries on from last month’s. No reply on the spot; a word of thanks is enough."
"date_note" = "The night of the thirteenth of the ninth month by the Senmyō calendar, about a month after the eighth-month viewing, with the moon two days short of full."

[festivals."festival_jp_setsubun"]
"name" = "Setsubun"
"customs" = "On the eve of spring the household throws roasted beans out the door, shouting, “Demons out, luck in!” The threshold is swept first, and anyone planning a journey picks a direction before setting off; only then does the family sit down to eat."
"gift_custom" = "A small bag of roasted beans, counted as the receiver’s age plus one, with a good wish written on a slip of paper."
"date_note" = "The day before the first day of spring in the Senmyō calendar. It follows the solar terms, not the moon, and so falls on 6 February every year."

[festivals."festival_jp_gencho"]
"name" = "Gencho"
"customs" = "The court ladies grind bean flour and shape the boar cakes, red, white and black, and carry them around on trays to everyone on duty. Eat one, they say, and you will have no sickness all winter, nor chilblains."
"gift_custom" = "A boar cake wrapped in a small square of cloth, the cloth given along with the cake."
"date_note" = "The first Boar day of the tenth month, counted by the sexagenary day cycle rather than the moon. In 1555, which has a leap tenth month, it is the first of the two tenth months that counts."

[festivals."festival_jp_monthly_poetry"]
"name" = "Monthly poetry gathering"
"customs" = "Each month someone sets the theme, and the class keeps both the good lines and the ones spoiled in revision in the poetry book. When it is opened at month’s end, some are left speechless with laughter at their own ruined line."
"gift_custom" = "A page of verse copied in your own hand with a pressed petal slipped in."
"date_note" = "By the Senmyō calendar the gathering meets on the fifteenth of every month, leap months included. Whoever sets the theme writes it on a folded slip, ties it to a twig and sends it to each household a few days ahead."

[festivals."festival_jp_mogi"]
"name" = "A household mogi observance"
"customs" = "The family lays out the new garments for a girl about to take the mogi, and a respected elder is asked to tie the cord of her train. Friends her age each bring a fan lettered in practice calligraphy, the characters wobbling, and she tucks them one by one into her sleeve."
"gift_custom" = "A fan lettered in your own hand, with a few small sweets."
"date_note" = "Each family has a day chosen by divination and invites only its own people. It is a household celebration, not a holiday kept throughout Kyoto."
