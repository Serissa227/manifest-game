[chapters."c8_school_festival_ushio_reizei_yuki:event"]
"title" = "What was left in the box"
"text" = "On Kajō day the sweets go out by rank. Ushio stands with the maids, and by her turn there are only crumbs at the bottom of the box. Yuki picks the neatest cake from her own share and sets it beside Ushio’s tray; she has never cared for bean paste, she says. Ushio distinctly remembers her eating three the day before yesterday. She thanks her and slides the broken pieces across. “These are bean paste too.” Yuki glares at her, picks one up, and eats it."

[chapters."c8_school_club_ushio_reizei_yuki:event"]
"title" = "A fingernail crease"
"text" = "Ushio is making fair copies for the poetry meeting and gets one kana wrong; Yuki circles it in vermilion, an enormous circle. Ushio glances at Yuki’s poem and remarks that the inlet in it is solid rock at low tide, and any boat that tried it would run aground. Yuki says nothing at the time. The next day her poem has one word changed. And Ushio’s copies get no more red circles, only a faint crease pressed with a fingernail beside each mistake, invisible unless you lean close."

[chapters."c8_school_walk_ushio_reizei_yuki:event"]
"title" = "The street side"
"text" = "Dark comes early, and Yuki has to get home to the Reizei house; there’s talk of stray soldiers looting in the lower city. Ushio says she happens to be going that way, to learn the streets. Yuki points out that Ushio can’t tell north from south without asking. Ushio doesn’t answer. The whole way she keeps to the street side, one hand closed on something in her sleeve. Only at the gate does Yuki see what it is: a short knife, its grip wrapped in cord and tied off with a sailor’s knot."

[chapters."c8_school_contest_ushio_reizei_yuki:event"]
"title" = "Three times"
"text" = "At the shell-matching game the two of them are on the same side. Yuki goes by which chapter of Genji is painted inside each shell; Ushio goes by the grain along the hinge, the same way you match ship planks, she says. On the last pair both shells show the same chapter, but Ushio says the grain is wrong. Yuki won’t listen, plays them, and they don’t match; their side loses half the round. Afterward Yuki complains that Ushio should have spoken up sooner. “I said it three times,” says Ushio. “You didn’t hear it once.”"

[chapters."c8_school_festival_ines_costa_sophie_lemaire:event"]
"title" = "Missing a leg"
"text" = "On Saint Nicholas’s Eve the girls set their shoes by the hearth for sweets. Sophie doesn’t; that isn’t done in Lille, she says. Inês knows perfectly well that children in Lille put out their shoes like anyone else, and lets it go. Next morning there’s a little honey-cake man in Sophie’s desk with one leg missing. Inês says she got hungry on the way over and ate it herself."

[chapters."c8_school_club_ines_costa_sophie_lemaire:event"]
"title" = "The pasted strip"
"text" = "In the society’s book they take turns, one line each. Sophie’s line sits empty for three days; Inês can’t wait and writes one for her, and it’s good. At the next meeting a strip of paper has been pasted over it, with Sophie’s own line on it, and hers isn’t as good. Inês holds the book up to the window for a long while and says the one underneath is obviously better. “But it was my line,” says Sophie. Inês doesn’t argue. She just makes a small mark beside the strip."

[chapters."c8_school_walk_ines_costa_sophie_lemaire:event"]
"title" = "A water-stained book"
"text" = "As the Friday Market packs up, Sophie leafs through a volume of Marot at a secondhand stall three times, then puts it back. Inês points out the water stains on the corner and haggles the price down by half; it’s for the society, she says. The book then spends a week in Inês’s satchel, since society books, she explains, have to be read by her first. When it finally reaches Sophie, there’s a sheet tucked inside with a copy of the poem Sophie lingered over longest."

[chapters."c8_school_contest_ines_costa_sophie_lemaire:event"]
"title" = "A motto for a name"
"text" = "Girls can’t join the chambers of rhetoric, so they hold a refrain contest of their own. Entries must be signed. Sophie flatly refuses to put her name down; Inês badly wants the judges to know who wrote it. In the end they follow the chambers’ old custom and sign with a motto instead, which takes them until midnight to agree on: “One line for whoever isn’t here.” They place third. Inês says it doesn’t matter, and kicks three stones into the gutter on the way home."

[chapters."c8_school_festival_rania_zahra:event"]
"title" = "A leaf on the palm"
"text" = "On the night before Eid the girls paint one another’s hands with henna. Rania does Zahra’s, and Zahra recites hadith and finds fault at the same time: that leaf is crooked, this vine is common, it looks like something off a market stall. Rania tells her to hush and hold still. The next morning Zahra keeps her hands tucked in her sleeves, but when she raises them at prayer everyone sees the leaf in her palm, the one Rania took the most care over."

[chapters."c8_school_club_rania_zahra:event"]
"title" = "The boatman’s uncle"
"text" = "Rania works a bit of dockside talk into her sailing poem: off Aden there’s a reef that moves at night. Zahra wants the source. Some boatman, says Rania; who remembers his name? Zahra won’t have it: who told whom, and who told them, every link written out, or the line goes. That night Rania makes three trips to the waterfront and comes back to write a chain of names in the margin. The last one reads “the boatman’s uncle.”"

[chapters."c8_school_walk_rania_zahra:event"]
"title" = "One sheet short"
"text" = "Rania spends half an hour working on the paper seller, from the rough edges of his sheets to the fact that her father knows his cousin, and gets two coppers off. Zahra waits the whole time, leaning in the doorway. When Rania comes out, Zahra tells her he gave her one sheet short; she counted from where she stood. Rania turns to go back and have it out with him, then stops. “Why didn’t you say so?” Zahra looks off down the street. “I wanted to hear how long you could keep talking.”"

[chapters."c8_school_contest_rania_zahra:event"]
"title" = "A star with two names"
"text" = "At the pilots’ star questions they are partners. The question concerns a star in the southern sky. Rania knows it by the name sailors use, from the sailing poems; Zahra knows it by its name in books, from her grandfather’s star tables. They argue in fierce whispers and neither will give way. With time running out, Rania gives both names at once and slips in a rhyme for good measure. The old pilot judging laughs and counts it right. “That doesn’t mean you won,” says Zahra."

[chapters."c8_school_festival_xu_cai_xiao_man:event"]
"title" = "A shadow like an oar"
"text" = "On the night of Qixi the girls float needles on bowls of water and read the shadows underneath. Xu Cai’s is a fine, thin line; like a writing brush, says the aunt, a scholar’s fate. Xiao Man’s is thick and crooked, and someone laughs that it looks like an oar. Xiao Man doesn’t mind. “Oars are good. An oar puts food on the table.” Xu Cai glares at the girl who laughed, then tips out her own bowl and says that, come to think of it, hers looked like an oar too."

[chapters."c8_school_club_xu_cai_xiao_man:event"]
"title" = "Golden Dog"
"text" = "Xiao Man wants to learn to write her family boat’s name so she can paint it on the bow. The boat is called Golden Dog. Xu Cai frowns and writes it as Brocade Gull instead; that’s more refined, she says. Xiao Man crumples the paper. “My grandfather named that boat. A dog guards the house, and so does the boat.” Red-faced, Xu Cai writes “Golden Dog” on a fresh sheet and has her trace it stroke by stroke. Three days later two big lopsided characters appear on the bow. Xu Cai, passing the quay, stops to look at them for a long time."

[chapters."c8_school_walk_xu_cai_xiao_man:event"]
"title" = "Counting a third time"
"text" = "On Lantern Festival night the girls walk the bridges, and Xu Cai has put on a new pair of embroidered shoes for it. After the second bridge her steps get shorter. She won’t say anything, and Xiao Man doesn’t ask. She only complains that the crowd ahead is too thick, insists on sitting by the rail to count the lantern reflections in the water, and whenever she loses count, starts over. By the third count Xu Cai finally laughs out loud, and quietly treads down the backs of her shoes."

[chapters."c8_school_contest_xu_cai_xiao_man:event"]
"title" = "A hint of salt"
"text" = "At the tea contest Xu Cai can recite the tea classics word for word but keeps falling just short on the leaves. Xiao Man knows nothing about tea and tastes only the water: this bowl is well water, that one is river water with a hint of salt, drawn at high tide. With one judging leaves and the other water, they beat an old licentiate from town. He won’t accept it and demands to know what books Xiao Man has read. “Never read any,” she says. “I’ve drunk plenty.” Xu Cai laughs so hard she spills tea down her front."

[chapters."c8_school_festival_xochitl_ines_solis:event"]
"title" = "The crooked feather"
"text" = "Before the feast of Saint Francis the friars want the forecourt decorated. Xochitl brings a small bundle of feathers from home and glue boiled from orchid root, to make a hummingbird. Inés insists on helping, gets glue all over her hands, and sets a blue feather crooked; it won’t come up again. Xochitl calls her clumsy and says that one feather would have bought her mother two hens. When the hummingbird goes up, the crooked feather is still there. Held up to the light, says Xochitl, it almost looks like it’s flying."

[chapters."c8_school_club_xochitl_ines_solis:event"]
"title" = "What the city was called"
"text" = "They are teaching each other their languages. Inés asks Xochitl the Nahuatl word for home and writes it down, spelled so badly that Xochitl shakes her head: say it like that and her grandmother will think she’s being cursed. Nettled, Inés asks what this city used to be called. Xochitl opens her mouth and finds she doesn’t know. Mérida was a Maya place, and she is a stranger here too. So they go to the kitchen and ask the old cook. “T’ho,” the woman says, and each writes it down in her own spelling, neither willing to concede the other’s is better."

[chapters."c8_school_walk_xochitl_ines_solis:event"]
"title" = "What a feather worker earns"
"text" = "On the way home Inés suddenly asks: how much does a feather worker earn in a year? How long does it take to learn? Can a woman run her own workshop? Xochitl assumes she is making a curiosity of poor people’s lives again, and says coldly that Inés’s family has plenty of land. Inés doesn’t smile. “Just tell me.” Xochitl studies her a long moment, then talks all the way from the market to Inés’s door, down to how many hours the glue has to boil."

[chapters."c8_school_contest_xochitl_ines_solis:event"]
"title" = "Whose honey"
"text" = "At the cacao-and-honey contest Xochitl names where three kinds of beans were grown by smell alone; on her mother’s side, cacao beans are money. Inés recognizes only one honey, and blurts out that it’s “from our tribute.” Xochitl’s face closes, and she doesn’t speak to her for the rest of the contest. Afterward Inés catches up with her. She went and asked: the honey came from the villagers’ stingless bees, and she should have said it was theirs. Only then does Xochitl break her last cacao cake in half and give her a piece."

[chapters."c8_school_club_diego_lorenzo:event"]
"title" = "Not a word to anyone"
"text" = "At fencing practice Diego announces to everyone that Lorenzo’s footwork looks like a man dodging donkeys in the market. That afternoon, in Latin, Diego gets a declension wrong, and Lorenzo calmly repeats the mistake back word for word, down to Diego’s pleased-with-himself tone. The room roars. Diego goes scarlet. Before dawn the next day he is knocking on Lorenzo’s door. “You teach me declensions, I teach you footwork, and not a word to anyone.”"

[chapters."c8_school_festival_diego_lorenzo:event"]
"title" = "Another name for the night"
"text" = "On Saint John’s Eve the pages compete to see who can leap the bonfire highest. Diego makes the best jump of the night, turns, sees Lorenzo hanging back in the dark, and mocks him for a coward. Lorenzo says his grandmother had another name for this night, and shuts his mouth the moment it’s out. Diego stares for a second, then rounds on the pages crowding in to hear. “What are you gawking at? Go fetch more wood!” All evening he stands in front of Lorenzo, between him and the firelight."

[chapters."c8_school_club_musa_yaqub:event"]
"title" = "Valued at Musa’s word"
"text" = "Musa owes Yaqub three silver coins and pays him with one ancient coin, green with corrosion, dug, he says, out of a Roman cellar and worth ten silver pieces at least. Yaqub drops it on the table and listens. Copper. They argue until dark. Finally Yaqub writes in the ledger: “One ancient coin, valued as Musa says. Balance owing, as Yaqub says.” Musa stares at the entry for a long time and says it is a very ungracious way to keep accounts."

[chapters."c8_school_walk_musa_yaqub:event"]
"title" = "One more lamp"
"text" = "Musa has got hold of a treasure book, every page in code, and drags Yaqub into the back room of the goldsmith’s shop to puzzle it out line by line. As the light fades Musa reads faster and faster and cracks more and more jokes. Yaqub says nothing. He gets up and lights the lamp, and then a second one. Only then does Musa slow down, though he can’t resist a dig: “You goldsmiths certainly don’t spare the oil.” “You need good light,” says Yaqub, “to judge silver.”"

[chapters."c8_school_contest_salih_ilhan:event"]
"title" = "A finger’s rise"
"text" = "The contest asks for the level of the Nile. Salih’s figure and Ilhan’s are one mark apart, and Ilhan declares on the spot that Yemenis have never seen a real river and can’t read one. Salih doesn’t argue; he takes him back to the gauge on Roda Island to look again. One of them read it at dawn and the other in the afternoon, and in half a day the river had risen a finger’s breadth. From then on the contest sheet has a column for the hour. Ilhan won’t admit a thing, but he is the one who ruled the column."

[chapters."c8_school_walk_salih_ilhan:event"]
"title" = "A seat held with a book"
"text" = "The lecture is full before dawn. Salih has to read to his blind old teacher first, so he is always the last to arrive. Yet every time, there’s an empty place by the pillar with one of Ilhan’s books lying on it. When Salih asks, Ilhan says he took it on a whim; it was meant for his servant. Ilhan’s servant has never once set foot inside al-Azhar."

[chapters."c8_school_contest_raja_muda_daeng:event"]
"title" = "You say where"
"text" = "At kora-kora drill Raja Muda stands in the bow giving orders, each longer than the last, and the paddlers fall further and further out of time. Daeng, at the steering oar, can’t stand it; he calls out a Bugis paddling chant, and every blade in the boat comes together at once. Raja whips around and glares. “Who commands this boat?” “You say where we go,” says Daeng. “I say how we get there.” They win that day. Ashore, Raja tells everyone it was his command that did it, and Daeng doesn’t contradict him."

[chapters."c8_school_festival_raja_muda_daeng:event"]
"title" = "When the tide comes in"
"text" = "Under the full moon on the night of Eid, they trade pantun. Raja Muda has several ready, every line about palaces and forefathers. When Daeng’s turn comes he sings just four lines: the first two about the tide rising at the river mouth, the last two about someone waiting for a boat when the tide comes in. Everyone laughs at how short the sailor’s song is. Raja forgets the verse he had prepared. After a pause, all he sings back, softly, is a single line: when the tide comes in, I’ll be there."

[chapters."c8_school_club_mathijs_jan:event"]
"title" = "The cut line"
"text" = "Mathijs’s speech is too long to fit the page Jan is setting, and Jan frowns and suggests cutting a line; it makes sense without it. Mathijs doesn’t speak to him all afternoon. It was the line he loved most in the whole play. So Jan sets a long dash in its place. In rehearsal, when Mathijs reaches the dash he stops for one breath, and the whole room goes quiet. He never mentions the line again, and Jan never finds out what it said."

[chapters."c8_school_walk_mathijs_jan:event"]
"title" = "The long way round"
"text" = "After work they walk back together. Jan starts telling the old joke about the compositor who set a whole page of prayers upside down; it’s the third time. Mathijs doesn’t say he’s heard it. Instead he steers them toward the farther bridge, so Jan will have time to finish. Halfway through, Jan laughs so hard he loses his breath and never does get to the end. At home Mathijs writes the joke into his play for a simple-minded character, and leaves the punch line blank there too."

[chapters."c8_school_contest_kabir_shadia:event"]
"title" = "You pick the wind"
"text" = "Kabir loses the lateen-sail race and insists the wind shifted halfway, so it doesn’t count. Shadia laughs at what a bad loser he is. “Fine, again. This time you pick the wind.” Kabir picks a wind he has calculated down to the last point, and loses again. He sits on the gunwale and says nothing for a long while. Shadia tosses him the waterskin. “Third time, we swap boats.”"

[chapters."c8_school_walk_kabir_shadia:event"]
"title" = "The dark side of the room"
"text" = "Shadia has been made to copy out star names in the library as punishment, and she is fuming. At the next shelf Kabir has spent nearly an hour hunting for a book of sailing directions. Shadia tells him it’s at the other end. He knows, he says; the light’s better here. She stares at him. “This side faces away from the window.” Kabir’s ears go red. He tucks the book under his arm, sits down across from her to help her copy, gets two star names wrong, and refuses to admit it."

[chapters."c8_school_club_huang_dun_suma:event"]
"title" = "Prices first"
"text" = "Huang Dun sends a letter south on a trading junk, its pages covered in drawings of Yuegang pastries, asking what there is good to eat in Java. Half a year later Suma’s reply arrives. She isn’t telling him about food yet. First, what do printed cottons sell for where he lives? Pinned to the end is a small swatch of batik and a note: answer well, and she’ll tell him this time next year. Huang Dun tucks the swatch into his account book and starts asking everyone he meets about the price of cloth."

[chapters."c8_school_festival_huang_dun_suma:event"]
"title" = "The moldy mooncakes"
"text" = "Before Mid-Autumn, Huang Dun sends a box of mooncakes south by ship. He chose his own favorite, red bean, and somehow kept from eating a single one before sealing the box. Months later Suma’s reply arrives: the mooncakes grew fur, and she fed them to the cats on the quay. Below that, in very small writing: the box is sturdy, so she kept it. Huang Dun puzzles over the letter for ages, unable to see why anyone would keep an empty box, then goes off to ask when the next ship leaves for Java."

[chapters."c8_school_club_ayame_kogo:event"]
"title" = "A word under the table"
"text" = "Before the incense gathering, Ayame lays out her woods in the order of the incense manual, every paper fold squared to its neighbor. Kogo remembers hers by where she has smelled them: this one on some lady-in-waiting’s sleeve, that one burning at a temple at New Year. Ayame calls that a vulgar way to learn. During the contest Ayame misjudges one, and under the table Kogo traces a single character with her fingertip. Ayame pretends not to see, answers correctly, and afterward presses a small packet of fine incense on Kogo. It was left over, she says."

[chapters."c8_school_festival_ursula_lieve:event"]
"title" = "Forty-one apiece"
"text" = "Before Saint Nicholas’s day the school is folding paper sweet boxes for the children at the girls’ orphanage. Ursula and Lieve bet on who can fold more; the loser buys a whole plate of honey cake. They fold from midafternoon until the lamps are lit, count three times, and get forty-one apiece every time. Ursula wants another recount. Lieve says it will still be a tie. There’s one sheet left, so they fold the last box together, and neither will let it be counted as hers."

[chapters."c8_school_club_zubayda_amina:event"]
"title" = "Labels as big as a shop sign"
"text" = "Zubayda rearranges every book in the shop by size and the color of its spine, so that customers will want to pay the moment they walk in. Amina can’t find the volume she is supposed to be copying and spends the whole morning hunting for it, blaming her sister’s meddling. Zubayda, offended, writes out a row of little labels and sticks them on the shelves. Amina peers at them from very close for a long time. “Too small. Do them again.” Grumbling, Zubayda writes them out again in letters as big as a shop sign, and only then does Amina nod."

[chapters."c8_school_contest_wati_nyai_gama:event"]
"title" = "Top layer, bottom layer"
"text" = "At the spice contest Wati can tell by smell which of the Banda islands a bag of nutmeg came from, and even guess how old the trees were. Nyai Gama’s nose isn’t as keen, but she remembers what every bag sold for. On the last bag they fall out. Wati says it is good Banda stock; Nyai Gama says the price is wrong, so something must be mixed in. They open it: the top layer is Banda nutmeg, and underneath is cheap long nutmeg from farther east. Each was half right, so the judges give them half a point apiece."

[chapters."c8_dock_work_success:event"]
"title" = "Know the line ends"
"text" = "You tie a loop of colored yarn on the rope end of every bundle in the warehouse: red for the ship, blue for the shed. The porters no longer have to bellow “Stop! Which bundle?” every few minutes."

[chapters."c8_dock_work_failure:event"]
"title" = "Know the line ends"
"text" = "You count the same stack of cargo twice and write it down as two. The foreman crouches beside you and counts it again without a harsh word, and most of that day’s pay is docked in the book."

[chapters."c8_tavern_job_success:event"]
"title" = "A bowl for the late return"
"text" = "You get every diner’s restrictions right at the long table: no meat for the one keeping a fast day, only bread for the one who cannot abide eggs. When a sailor stumbles in late that night, a bowl of hot soup has been kept back for him."

[chapters."c8_tavern_job_failure:event"]
"title" = "A bowl for the late return"
"text" = "The fish goes to the man who ordered roast, and his face drops. The keeper smooths it over with a smile and swaps the plates. The tip from that table is gone, a small sum, but you won’t forget the table number again."

[chapters."c8_countinghouse_job_success:event"]
"title" = "The error above"
"text" = "The coin missing at the foot of the page was hiding in the line above, where a freight charge had been entered as payment for goods. You note down where the sum came from, and only then does the clerk pick up his pen to sign."

[chapters."c8_countinghouse_job_failure:event"]
"title" = "The error above"
"text" = "You enter a debt as cash paid, and it is only the date that gives you away when the page is rechecked. The clerk pushes it back across the desk: copy the whole page again, and no new accounts for you today."

[chapters."c8_fishing_job_success:event"]
"title" = "Before the tide turns"
"text" = "You have the net mended before the tide goes out. When the boat comes in, everyone aboard has hands free for the baskets, and nobody is squatting in the stern picking at tangles."

[chapters."c8_fishing_job_failure:event"]
"title" = "Before the tide turns"
"text" = "The tide turns an hour earlier than the old fisherman reckoned, and the boatowner hauls in the net and heads for harbor. The hold is short of fish, but everyone steps ashore safe."

[chapters."c8_shipyard_job_success:event"]
"title" = "With the grain"
"text" = "The shaving curls off in one unbroken ribbon. The old master says nothing and slides the next plank toward you, which in a shipyard is as good as praise."

[chapters."c8_shipyard_job_failure:event"]
"title" = "With the grain"
"text" = "You push the plane against the grain and the surface tears into splinters. The master takes it out of your hands and runs it the right way once so you can see. Fixing the board takes half a day."

[chapters."c8_copyist_job_success:event"]
"title" = "Keep the correction"
"text" = "Where the manuscript gives two different readings, you copy both into the margin and choose neither. Whoever borrows the book will know exactly which page to go and check."

[chapters."c8_copyist_job_failure:event"]
"title" = "Keep the correction"
"text" = "You skip a whole line. The proofreader runs a fingertip down the page and stops dead at the gap. The spoiled sheet stays on your desk for practice and will never reach the customer."

[chapters."c8_printing_job_success:event"]
"title" = "The reversed letter"
"text" = "On the first proof sheet you spot the one reversed letter at a glance. The master leans in, picks it out with a bodkin, turns it round and pulls another proof. The hundreds of sheets that follow are not wasted."

[chapters."c8_printing_job_failure:event"]
"title" = "The reversed letter"
"text" = "Too much ink, and the small letters run into blots. You and the master wash the forme clean, let it dry, and start again from the first proof."

[chapters."c8_apothecary_job_success:event"]
"title" = "Two similar labels"
"text" = "Two herbs with nearly the same name leave you unsure, so you ask the apothecary, then paste a label on each before sorting them into separate drawers. He praises you for asking, not for knowing."

[chapters."c8_apothecary_job_failure:event"]
"title" = "Two similar labels"
"text" = "The label is vague, and the apothecary pushes the whole basket aside to be checked before anything is used. Luckily nothing has reached a patient’s bowl."

[chapters."c8_guard_job_success:event"]
"title" = "Light on the latch"
"text" = "Your patrol lantern falls on a door whose latch hangs half loose. You don’t touch it yourself; you wake the householder and watch him fasten it before you walk on."

[chapters."c8_guard_job_failure:event"]
"title" = "Light on the latch"
"text" = "You mistake the tread of men hauling cargo for thieves and dash up with your lantern, startling the porters. The older watchman comes, sorts it out, and has you write down again how to tell the two apart by their steps."

[chapters."c8_interpreter_job_success:event"]
"title" = "Two senses of a sentence"
"text" = "The two sides in the souk speak their own tongues, and some forms of address leave you unsure, so you ask about each one: should the white-bearded man be called “Shaykh” or “Hajji”? Only when both nod do you put pen to paper."

[chapters."c8_interpreter_job_failure:event"]
"title" = "Two senses of a sentence"
"text" = "You hear the delivery date as the loading date, and it is only when you repeat it back that the other side catches the slip. The two parties have to draw the agreement up again, and the spoiled sheet is crumpled and thrown on the brazier."

[chapters."c8_sanctuary_job_success:event"]
"title" = "Space beside the candles"
"text" = "You ask the old keeper of the place which way people are to come in and go out before setting the candle stands and water bowls in corners where nobody will bump them. The keeper gives a stand a push to see if it wobbles, and nods."

[chapters."c8_sanctuary_job_failure:event"]
"title" = "Space beside the candles"
"text" = "You pile the candle stands and brooms by the entrance while sweeping, and visitors have to squeeze in sideways. The old keeper says nothing, shows you how to leave a clear path, and you set it all out again."

[chapters."c8_smuggling_job_success:event"]
"title" = "The unsealed parcel"
"text" = "Just before the handover you feel that the seal has worked loose, and you don’t hide it. You say so to the other party’s face before passing the parcel on. The few coppers you earn go into your little notebook, one entry at a time."

[chapters."c8_smuggling_job_failure:event"]
"title" = "The unsealed parcel"
"text" = "The men at the checkpoint ask and ask again, and your answers don’t add up. A grown-up comes to take you home. Nearly all your pay is held back, and that is the end of this errand."

[chapters."c8_woodworking_job_success:event"]
"title" = "A boat from an offcut"
"text" = "You sort the leftover wood into piles by grain, the straight pieces against the wall and the twisted ones on the floor. The old master passes by, picks a scrap from the smallest pile, and says it will do for a model ship’s rudder."

[chapters."c8_woodworking_job_failure:event"]
"title" = "A boat from an offcut"
"text" = "The tenon is pared too thin, and the master calls a halt to the assembly. The trial piece is kept for you to compare; the cracked one he refuses to sell."

[chapters."c8_kitchen_job_success:event"]
"title" = "A pinch less salt"
"text" = "You taste the soup before salting it and add only half a pinch. The cook takes a sip from the ladle, nods, and adds nothing more. The thin crust at the bottom of the pot you scrape out, moisten with a little broth and carry to the dog lying on the doorstep."

[chapters."c8_kitchen_job_failure:event"]
"title" = "A pinch less salt"
"text" = "The fire is too fierce and the pot scorches, and the whole kitchen smells of it. You damp the flames and change pots, and for the rest of the day you are allowed only to chop and wash."

[chapters."c8_weaving_job_success:event"]
"title" = "Where the thread joins"
"text" = "The new thread and the old are joined, the ends tucked into the weave so that even against the window light you cannot find the join. The old weaver gives it two gentle tugs, and nothing moves. She hands the shuttle back to you."

[chapters."c8_weaving_job_failure:event"]
"title" = "Where the thread joins"
"text" = "Halfway through unpicking you find a warp thread missing, and have to take the rows back one by one to find where. The extra hours are counted as practice, nothing more."

[chapters."c8_omen_chart_serpent:event"]
"title" = "Coils at the chart edge"
"text" = "In the margin of the chart a dark shape lies coiled in loops, scale by scale, as if it might slither off the page. The copyist calls it a distant sailor’s report and adds two words beside it: some say."

[chapters."c8_omen_letters_square:event"]
"title" = "Letters in a square"
"text" = "On a sheet of old paper the letters are laid out in a grid of squares. The teacher doesn’t say what it is, only asks the pupils to find the square that was copied wrong. Its owner folds it away without a word about what it is for."

[chapters."c8_omen_ghost_light:event"]
"title" = "A light across the water"
"text" = "Across the water a light flickers on and off, not like any fisherman’s lamp. An elder beside you starts a Ningbo tale of a woman who walks out of the night carrying a peony lantern. The elder has barely begun when the mist thins, and all that is left on the far bank is the shape of a window."

[chapters."c8_omen_poem_slip:event"]
"title" = "A slip inside the anthology"
"text" = "Tucked inside the anthology is a small slip with only half a line on it, its creases far older than the ink. The teacher studies it for a long time, puts it aside in a box of its own, and says some lines can be read only when their time comes."

[chapters."c8_omen_well_echo:event"]
"title" = "An echo beside the well"
"text" = "The echo at the well always comes back a beat behind the voice. The old keeper tells of a road that runs down under the earth, then warns the children not to go past the stone rim."

[chapters."c8_omen_wind_knots:event"]
"title" = "Knots left tied"
"text" = "A sailor from the north lays a cord with three knots in a wooden box and asks the apprentices only to mend its loose lid. The lid is mended, the cord goes back as it was, and nobody is told to untie it."

[chapters."c8_omen_sea_navel:event"]
"title" = "The unseen sea navel"
"text" = "The boatowner swirls a bowl of water and says that far out at sea there is a navel in the ocean where all the water drains away. A pupil asks if he has seen it himself. He laughs and admits he heard it on another crew’s boat."

[chapters."c8_omen_island_cord:event"]
"title" = "A cord recording islands"
"text" = "A length of faded red wool cord hangs from a broken wall. An old man runs his thumb along it and stops at two thick knots, and tells of two islands far away. The young listener writes down the story and the teller’s name too. Where those islands lie, no one will know until a ship has been there."

