# A6：显示覆盖，仅含文字。

[festivals."festival_ib_epiphany"]
"name" = "Epiphany"
"customs" = "On the night before, children set their shoes on the windowsill and wake to find hazelnuts or a twist of sugar inside. In the street three men dressed as kings ride slowly by on mules, with a long tail of singing children behind them."
"gift_custom" = "A dish of almond sweets left by the door for the children who come singing about the three kings."
"date_note" = "Local almanacs date it 6 January. The calendar here runs ten days ahead of theirs, so it falls on the sixteenth."

[festivals."festival_ib_carnival"]
"name" = "Carnival"
"customs" = "Before Lent anyone may go out masked. Behind a paper mask old friends change their voices, and whether you recognize them depends on whether you care to. Eggshells filled with scented water fly at the street corners; when the crowd thins, everyone crouches to sweep up the paper flowers together."
"gift_custom" = "A little mask you pasted together yourself, with an unsigned verse slip tucked inside."
"date_note" = "The eve of Ash Wednesday, so it moves with Easter. Add ten days to the date in local almanacs to get the one on the calendar here."

[festivals."festival_ib_holy_week"]
"name" = "Holy Week"
"customs" = "In the chapel yard the brotherhood men stitch pointed hoods and polish silver candlesticks until midnight. Even the quiet children are given work: handing out candles, counting wicks, carrying water to the men who bear the statues."
"gift_custom" = "A white candle, or a bowl of chickpeas stewed with salt cod, no meat in it. Give it and leave; nothing is owed back."
"date_note" = "It begins on Palm Sunday and moves with Easter. Local almanacs lag ten days behind the calendar here."

[festivals."festival_ib_corpus"]
"name" = "Corpus Christi"
"customs" = "The streets are strewn with herbs and petals for the procession. The children’s favorite is the Tarasca, a great dragon of paper and cloth with men pushing it from inside; when its tail swings, the front row screams and ducks back. After the procession the students of the college set up a disputation in the cloister."
"gift_custom" = "A pinch of petals left over from the procession road, pressed inside the neatest lettering slip you have."
"date_note" = "The Thursday sixty days after Easter, so it travels with Easter. The date here is ten days past the local almanac’s."

[festivals."festival_ib_anthony"]
"name" = "Saint Anthony’s feast"
"customs" = "Lisbon people treat Saint Anthony as one of their own and speak of him like a neighbor’s boy who made good. During the feast paper lamps hang at the alley mouths and charcoal braziers are carried out to the doors to grill the day’s fish; apprentices from far away are pulled to the table and soon find their bowls heaped."
"gift_custom" = "A loaf blessed at the church, broken and shared, with a seat kept at the table for an apprentice who has just arrived."
"date_note" = "Local almanacs date it 13 June, and Lisbon lights its lamps the evening before. On the calendar here, ten days on, it falls on the twenty-third."

[festivals."festival_ib_john_eve"]
"name" = "Saint John’s Eve"
"customs" = "Bonfires line the shore, one after another, and the young people jump them hand in hand. An old sailor says that on Saint John’s morning a ship drifts in from the sea, and its helmsman sings so that the wind drops and the fish rise; ask him to teach you the song and he answers, “I sing it only to those who sail with me.”"
"gift_custom" = "A lopsided wreath, or half a sailing song copied out, the other half left blank."
"date_note" = "The shore folk light the Saint John’s Eve bonfires on the night of 23 June by their own almanac, which the calendar here counts as the night of 3 July."

[festivals."festival_ib_dead"]
"name" = "Days of remembrance"
"customs" = "After All Saints the families go up to the graves and set a small oil lamp on each. At supper an empty chair is left at the table, and the old people tell the jokes the dead used to make, laughing before they reach the end. All night the church bell tolls slowly for the souls in purgatory."
"gift_custom" = "A small round loaf, which is what children go door to door asking for on this day, and a hand topping up someone’s lamp oil."
"date_note" = "Local almanacs keep All Saints on 1 November and remember the dead the day after. On the calendar here, ten days on, it starts on the eleventh."

[festivals."festival_ib_martin"]
"name" = "Saint Martin’s feast"
"customs" = "When the late-autumn fair packs up, the first cask of new wine is broached and chestnuts roast on the coals; neighbors stand around eating them with soot on their lips. The old folk say Saint Martin cut his cloak in half for a beggar, so on this day an extra bowl is always filled and carried out the door."
"gift_custom" = "A packet of dried figs, or a cloth pouch with its seams mended."
"date_note" = "The chestnut sellers set up on 11 November by the local almanac; on the calendar here that morning is the twenty-first."

[festivals."festival_ib_christmas"]
"name" = "Christmas"
"customs" = "After midnight Mass the neighbors go from house to house with lamps, singing carols. At a house whose ship has not come home they knock once more and bring the wife a pot of hot soup."
"gift_custom" = "A piece of honey-and-almond cake, or woolen wristlets knitted thick."
"date_note" = "Local almanacs date it 25 December. The calendar here is ten days ahead, so Christmas lands on 4 January—in truth still the old year’s Christmas."
