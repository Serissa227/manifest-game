# A6：显示覆盖，仅含文字。

[notes."note_9c9f3a67bdd2883e"]
"text" = "Registration at the forecourt comes in January; the rainy season is a long break when the children go home to help; lessons resume in October after St. Francis’ day, and the books close before Christmas. Newcomers in early 1554 lodge and catch up first; fevers of the wet season or family trouble can move any date."

[notes."note_7d2f4abba17c5a5d"]
"text" = "On the last day everyone stands by the stone cross in the forecourt and promises to meet again. Xochitl presses a small feather into every hand and says she will disown anyone who loses it; Balam bets, there and then, on who will own a fleet first within three years. One of them quietly works the feather into a braid, tucked behind the ear. Whether that is friendship or something with no name yet can wait until they meet again."

