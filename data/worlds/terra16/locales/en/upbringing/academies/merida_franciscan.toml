[academy_clubs."merida_franciscan:0"]
"name" = "Labels in Two Tongues"
"synopsis" = "Xochitl weaves the basket, fast and slightly crooked, picking at her own mistakes as she goes, while Inés writes two lines on each little label, one in Spanish and one in the Nahuatl Xochitl taught her. The basket is a gift for an old woman who once helped them."

[academy_clubs."merida_franciscan:1"]
"name" = "Three Bowls Under Cloth"
"synopsis" = "On market day the old woman at the cacao stall sets out three bowls under cloth, and everyone takes a blindfolded turn at guessing what is inside: cacao beans, honey from the stingless bees, or maize soaked in lime water. Xochitl haggles even with her eyes shut. Balam, a cacao merchant’s son, gets two of three wrong and swears the bowls are at fault. Kan Pech referees and makes anyone who hedges say it again. It is practice for the cacao-and-honey contest in the market."

[academy_handbook."merida_franciscan:0"]
"text" = "The friary’s Latin classroom takes only boys. Girls sit in the forecourt for the catechism, learn healing at home from their elders, and get their letters in private from an assistant. Finishing the course makes no one a friar."

[academy_handbook."merida_franciscan:1"]
"text" = "To enter the forecourt your family must first find a go-between and settle what standing you will study in, and under whom. Connections only open the gate; the friary’s rules—fast days, roll call, prayers—stay as they are."

[academy_handbook."merida_franciscan:2"]
"text" = "Late? Sweep the arcade clean for the friar before you go in to lessons."

[academy_handbook."merida_franciscan:3"]
"text" = "Throw a punch in the forecourt and the two who fought kneel side by side at the stone cross until a Hail Mary has been said. Whatever they broke they mend, and for ten days they keep away from the clubs."

[academy_handbook."merida_franciscan:4"]
"text" = "At dawn the friar counts the hammocks. Whoever’s is empty must say where the night was spent, then stays in for ten days. Going for the midwife or a healer, or fleeing fever or storm, is not punished."
