[activities."merida_franciscan_course_self_study"]
"name" = "Identifying herbs on the courtyard bench"
"description" = "With no midwife at hand, the student sets several herbs out in separate small bowls, sits on the bench in the front courtyard to name and note each one, and resets the bowls whenever a guess is wrong; learning is slow, but no one hurries the student along."
