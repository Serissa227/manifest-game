[academy_clubs."busan_interpreters:0"]
"name" = "One Letter, Two Translations"
"synopsis" = "Every ten days they take an old letter from the Japan House files. Kim Munyeong translates it word by word; Yun Haeri translates it again in the writer’s own voice. Both go up side by side on the wall, and everyone votes with beans for the one closer to the original."

[academy_clubs."busan_interpreters:1"]
"name" = "Whispers at the Japan House Gate"
"synopsis" = "When Japanese traders haggle at the gate, the students take turns standing by and quietly passing words between the two sides. Afterward they argue over who dropped a sentence and who slipped in one of his own."

[academy_handbook."busan_interpreters:0"]
"text" = "The Sayeogwon is in Hanseong. Interpreter families in Busan teach their children at home from its textbooks; sitting the interpreters’ examination in the capital takes travel money and connections. Girls may study alongside, but the examination is closed to women."

[academy_handbook."busan_interpreters:1"]
"text" = "A child from outside the interpreter families needs an interpreter to stand surety before taking a seat in this room."

[academy_handbook."busan_interpreters:2"]
"text" = "Latecomers recite a passage of the Nogeoldae under the eaves before they may come in."

[academy_handbook."busan_interpreters:3"]
"text" = "Classmates who quarrel sit facing each other copying the Lesser Learning, and are kept out of the circles for ten days."

[academy_handbook."busan_interpreters:4"]
"text" = "Anyone out overnight must report where he went and stays home for ten days. Fetching a physician or hiding from raiders is not punished."
