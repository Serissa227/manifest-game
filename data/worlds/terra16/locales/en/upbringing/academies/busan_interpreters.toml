# A6：显示覆盖，仅含文字。

[notes."note_d3be75ab022c4965"]
"text" = "The school keeps the Korean almanac: lessons start once the New Year month is over, Dano is a day off, the hottest weeks of the sixth month are a break, and translation tests come in autumn. 1555 is an examination year in Hanseong—and the year raiders strike the southern coast."

[notes."note_1df34ee08e7a2617"]
"text" = "On the last day, under the persimmon tree, you all agree: whether you end up in Hanseong or at the Japan House, if you ever recognize a friend’s hand on a letter, you add one line of plain talk at the end."

