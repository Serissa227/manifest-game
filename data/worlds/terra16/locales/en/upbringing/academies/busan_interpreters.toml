# U03：免费自习的英文课名与说明（11-03 按地区写好）。
[activities."busan_interpreters_course_self_study"]
"name" = "Reading old translations under the persimmon tree"
"description" = "With no interpreter at hand, the student takes an old diplomatic letter that a senior once translated, reads it aloud under the persimmon tree, and writes a line in each language wherever the two versions do not match; no tuition is charged, but progress is slow."
