# A6：显示覆盖，仅含文字。

[notes."note_cc8f6ba8cc46dfc0"]
"text" = "The school keeps the teachers’ timetable: lessons, examinations, contests and the long break, which falls in Ramadan. In early 1554, with fighting in the city, students lodge elsewhere and make up lessons; regular teaching resumes once things settle. If trouble comes at home, the teacher will bend the schedule."

[notes."note_1281c20af0dd11f9"]
"text" = "The water runs and runs in the courtyard pool. Musa says any quay will do for meeting again; Nala says wherever there’s an oud, you’ll find her. Someone says nothing at all and keeps looking down at the water."

