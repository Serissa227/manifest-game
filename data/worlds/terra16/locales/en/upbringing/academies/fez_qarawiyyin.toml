[activities."fez_qarawiyyin_course_self_study"]
"name" = "Reciting lessons by the Stone Court pool"
"description" = "With no teacher by the pool in the Stone Court, the student recites the day’s lecture from the beginning and jots in the corner of the page whatever will not come back; gains are modest, but it is not tiring."
