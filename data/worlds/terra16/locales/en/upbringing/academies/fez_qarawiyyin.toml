[academy_clubs."fez_qarawiyyin:0"]
"name" = "The Weight of a Witness’s Word"
"synopsis" = "A silver coin of doubtful origin lies on the table. Musa wants to trace where it came from; Yaqub weighs it first. Each checks the other’s proof, and neither asks you to judge."

[academy_clubs."fez_qarawiyyin:1"]
"name" = "The Snapped String"
"synopsis" = "It is Nala’s turn to bring something broken: an oud with a snapped string. Yaqub, eyes shut, restrings it by ear and misses by a hair three times running. An old musician from the Andalusian quarter wanders past, turns the peg half a turn, and the note comes true. With the oud mended, everyone picks partners, one to play and one to set the beat on a frame drum, so they are in time for the school display."

[academy_clubs."fez_qarawiyyin:2"]
"name" = "Verse on the Roof"
"synopsis" = "A few climb to the flat roof of the lodgings and, under the moon, take turns opening a verse; whoever’s turn it is begins. What gets recited tonight is up to whoever has said the least all week."

[academy_handbook."fez_qarawiyyin:0"]
"text" = "Qarawiyyin gives students a room to sleep in, but no meals; poor students live on bread given in charity. Girls mostly read at home with their elders, or listen from behind a curtain outside the gallery. If soldiers take the city and it changes hands, students who run for cover and make up their lessons elsewhere are not counted absent."

[academy_handbook."fez_qarawiyyin:1"]
"text" = "The elders of the family settle it. Depending on the household’s standing, a child is taught at home by a tutor or sent to sit in on lessons under the school gallery."

[academy_handbook."fez_qarawiyyin:2"]
"text" = "Come late and you stand in the gallery through the first passage, then stay after the lecture and square away the volumes in the manuscript room’s cedar cabinets, one by one."

[academy_handbook."fez_qarawiyyin:3"]
"text" = "Two who fight go back to their own cells for the night. Next morning they stand before the lecture circle by the pillar and each tells the whole circle what happened, and neither may cut in on the other. Whatever got broken, they find a way to mend; for ten days there is no place for them in the clubs."

[academy_handbook."fez_qarawiyyin:4"]
"text" = "Away from the lodgings overnight? At dawn the keeper of the cells is waiting at the door, and you tell him exactly where you slept; from then on, leave your name with the doorkeeper before you go out. For the next ten days the door opens inward only. Fetching a physician or hiding from soldiers is not punished."
