# A6：显示覆盖，仅含文字。

[notes."note_e308286e311debab"]
"text" = "Term, examinations and the long break follow the moon, so each comes about eleven days sooner than last year, and Ramadan arrives a little earlier every year. In early 1554 the new pupils lodge at the teacher’s house and catch up first; unrest in the city or trouble at home can shift the lessons."

[notes."note_4228c0bdba21e0c9"]
"text" = "Water from the fountain splashes onto the steps. Idriss presses a page he has copied into your hand and says the mistakes are his to answer for. Khadija marks a small dot in the blank of her map: when the caravans are back, she will fill in a name there."

