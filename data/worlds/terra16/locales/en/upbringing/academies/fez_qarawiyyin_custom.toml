[academy_clubs."fez_qarawiyyin_custom:0"]
"name" = "Whose Voice Is in the Travel Notes"
"synopsis" = "Whatever a returning caravan says, Idriss writes down as plain fact. Khadija taps the margin with her pen: this line was seen, that one was heard on the road. Write them apart."

[academy_clubs."fez_qarawiyyin_custom:1"]
"name" = "Afternoons of Mending"
"synopsis" = "Each afternoon someone brings in something broken: Idriss’s ink-blotted copy, Khadija’s crooked route map, and you must bring a piece of your own. Nobody may mend their own; you mend someone else’s. Then you pair off, one playing the oud while the other keeps the beat on the lid of the teacher’s book chest, and a missed beat means trading places."

[academy_clubs."fez_qarawiyyin_custom:2"]
"name" = "Night Songs by the Fountain"
"synopsis" = "By the fountain in the teacher’s courtyard, someone starts a line each night and the rest pick it up. Whoever talks least chooses the song, which usually means Idriss. He names one title and no more, and Khadija starts it off in a caravan driver’s drawl."

[academy_handbook."fez_qarawiyyin_custom:0"]
"text" = "You lodge with a teacher near Qarawiyyin, study with your own small circle in his reception room, and slip into the mosque when you can to hear the great lectures. A girl finds a teacher only through her family’s connections."

[academy_handbook."fez_qarawiyyin_custom:1"]
"text" = "Your family settles who you are and picks your teacher first. However wide the connections, the lecture circle keeps its old rules: girls may listen only from behind the curtain in the side gallery, or at home."

[academy_handbook."fez_qarawiyyin_custom:2"]
"text" = "Late? First do the duty you missed in the teacher’s house: sweep the fallen orange blossom in the courtyard into a basket and carry it to the kitchen, where it will be distilled into flower water."

[academy_handbook."fez_qarawiyyin_custom:3"]
"text" = "A brawl in the teacher’s house shames the teacher. He does not ask who struck first; each tells him what happened, and then the two carry one basket between them to the Attarine spice lane to buy his spices for the week, one holding the basket and the other keeping the tally, swapping halfway. Whatever was broken they mend with money pooled between them. No clubs for ten days."

[academy_handbook."fez_qarawiyyin_custom:4"]
"text" = "If you don’t come back to the teacher’s house at night, say where you were, and tell his family before you next go out. No leaving the house for ten days. Fetching a doctor, or ducking out of the way when the city is in an uproar, doesn’t count."
