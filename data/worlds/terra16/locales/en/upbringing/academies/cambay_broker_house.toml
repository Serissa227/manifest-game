# A6：显示覆盖，仅含文字。

[notes."note_5ca4c7d7e2c1abbd"]
"text" = "The counting room keeps the trading houses’ calendar: students are taken on early in the year and lessons begin around the twentieth of January; for the first twenty days of July, when the rains are heaviest, there is a break and pupils go home to mind the family warehouse; examinations come in November, and the books close with the trading houses at year’s end. Family business or unrest in the city pushes the lessons back."

[notes."note_f12dfd06cb47af32"]
"text" = "On the last day, under the neem tree, Tara tears three sheets from an account book and says each of you will write a bill of exchange: payable on sight, one meal, the port of payment left blank. Wherever you next meet, that is where it gets cashed. Naran finds three things wrong with the wording, signs anyway, and tucks his into his belt. Friends or something more—nobody asks."

