[academy_clubs."cambay_broker_house:0"]
"name" = "Beads and Bills"
"synopsis" = "Naran prices by the count and Tara sorts by color, and the first time they did it in front of a buyer they ended up arguing. They learned: Naran gives the number, Tara explains the shades, and the bill carries both lines."

[academy_clubs."cambay_broker_house:1"]
"name" = "The Crooked String of Beads"
"synopsis" = "Someone at the bead-cutters’ lane laughed at Tara’s crooked string of beads, so she carries it back to the counting room, and Naran spreads out the bill with the interest written wrong. Everyone helps set both right. Then each picks a partner, one to show the goods and one to recite a ghazal, and they greet the guests who come to the school display."

[academy_handbook."cambay_broker_house:0"]
"text" = "Cambay’s brokers take apprentices into their own counting rooms: mornings spent on scales and cloth samples, afternoons trailing a client through a haggle. Most come from merchant and bead-cutter families, and no one is admitted without an introduction."

[academy_handbook."cambay_broker_house:1"]
"text" = "If your family has an old tie to some brokerage, ask its elder for a letter of introduction. The letter opens the door and no more: your birth and your household’s rules count exactly as before."

[academy_handbook."cambay_broker_house:2"]
"text" = "Whoever misses the opening of the counting room spends that day scouring the scales and weights, and sits down only once they shine."

[academy_handbook."cambay_broker_house:3"]
"text" = "Fighting in the counting room means sorting the scattered samples back out one by one, paying full price for anything broken, and finding the club’s door shut to both of you for ten days."

[academy_handbook."cambay_broker_house:4"]
"text" = "Stay out overnight and the next day your master asks you to your face where you slept; answer fully, and you still stay home for ten days. Fetching a doctor or sheltering from trouble does not count."
