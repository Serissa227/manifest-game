[academy_clubs."antwerp_laurel:0"]
"name" = "The Half-Page Circle"
"synopsis" = "The rhetoric chambers won’t admit girls, so they hold their own refrain contests in Inês’s notebook. Each page is half filled, the other half left for whoever answers. No one asks which church a poem was written for."

[academy_clubs."antwerp_laurel:1"]
"name" = "The Wooden Bird in the Yard"
"synopsis" = "Every year the shooting guilds aim at the wooden popinjay while the girls look on. Ursula borrowed a small bow and hung a wooden bird in the yard. She keeps score, and every miss costs you a verse of a song."

[academy_handbook."antwerp_laurel:0"]
"text" = "In 1554 you learn from tutors and at an older girls’ school in town. Peeter Heyns and his wife open De Lauwerboom in August 1555, the same year Plantin’s press starts printing. The rhetoric chambers take no girls, so the girls run a poetry circle of their own."

[academy_handbook."antwerp_laurel:1"]
"text" = "A girl from outside the merchant and noble houses can still get a place if her family finds a sponsor and the fees. Boys are never admitted."

[academy_handbook."antwerp_laurel:2"]
"text" = "Latecomers stay after class and trim a bundle of quills for the master."

[academy_handbook."antwerp_laurel:3"]
"text" = "Girls who come to blows sit at opposite ends of the long table and write each other an apology in French. No poetry circle or archery for ten days."

[academy_handbook."antwerp_laurel:4"]
"text" = "Stay out all night and you must say where you were; you won’t be let out for ten days. Fetching a physician or taking shelter from trouble doesn’t count against you."
