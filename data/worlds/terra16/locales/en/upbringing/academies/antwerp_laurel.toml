# A6：显示覆盖，仅含文字。

[notes."note_4f4c75dad18c4225"]
"text" = "In 1554 lessons are at an older girls’ school in town; in autumn 1555 you move to the newly opened De Lauwerboom. The year keeps the old rhythm of Low Countries schools: classes from October, examinations at the end of June, and summers spent helping in the family shop."

[notes."note_8583c07e901d89be"]
"text" = "On the last day of 1556 everyone says goodbye under the laurel in the yard and promises to meet again. Some say “See you next year.” Someone says only “Remember to write,” then looks away."

