[academy_clubs."shipboard_zabid:0"]
"name" = "Notes in a Manuscript Margin"
"synopsis" = "Rania wants to scratch out the note Zahra wrote in a margin, which she finds too sharp; Zahra says to check the source first. They spend half the night over the manuscripts, and in the end both opinions stay side by side in the margin."

[academy_clubs."shipboard_zabid:1"]
"name" = "Practice Runs in the Cove"
"synopsis" = "Every ten days they take the dhow on a short run from the cove. Kabir takes the star heights, Abdullah dives to check the hull, Shadia grabs the tiller. Nobody gives way, so everyone ends up learning someone else’s job."

[academy_clubs."shipboard_zabid:2"]
"name" = "Refrains Under the Date Palms"
"synopsis" = "At night in the courtyard they sing ghazals, and the refrain is started by whoever is usually quiet. Rania holds back from grabbing it; Zahra frowns, yet is the first to hum along."

[academy_handbook."shipboard_zabid:0"]
"text" = "Piloting is learned from a master, and you count as a pilot only when a shipowner will hire you; no official issues a license. Girls can sit in the courtyard of a woman scholar in Zabid, who teaches routes and landmarks. Nasher Pasha’s new college south of town is still going up, wall by wall."

[academy_handbook."shipboard_zabid:1"]
"text" = "What you are here, and who teaches you, was settled by what happened at home. A favor can open one door; inside it, all of Zabid’s old rules still hold."

[academy_handbook."shipboard_zabid:2"]
"text" = "The tide waits for no one, so latecomers bail the pilot’s bilge until he says enough."

[academy_handbook."shipboard_zabid:3"]
"text" = "Pupils who come to blows get no hearing about who was right. The master sets them side by side to bail out the leaky old dhow and caulk its seams, and neither speaks until it is done. For ten days after, the clubs have no place for either."

[academy_handbook."shipboard_zabid:4"]
"text" = "Not back on your mat by night, and the master hears where you were; then ten days without leaving the courtyard, and no touching the boats in the cove. Fetching a physician in the dark, or being pinned aboard someone else’s boat by a squall, is forgiven."
