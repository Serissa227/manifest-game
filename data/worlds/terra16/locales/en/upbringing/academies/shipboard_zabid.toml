# A6：显示覆盖，仅含文字。

[notes."note_7a53b20786d743a7"]
"text" = "The school keeps the Hijri calendar, so every date falls some ten days earlier than the year before: in 1554 lessons open in mid-September, examinations come at the end of July, and the long break is Ramadan in August. When the monsoon turns or a sailing date moves, lessons give way to the ship, and to trouble at home too."

[notes."note_25b3b3a24f668693"]
"text" = "On the last day everyone agrees, in the courtyard under the date palms: each year, when the northeast monsoon sets in, whoever reaches a port first leaves a chalk mark on the quay steps. Some agree laughing, and some agree very quietly."

