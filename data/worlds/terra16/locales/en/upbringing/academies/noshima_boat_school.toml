[academy_clubs."noshima_boat_school:0"]
"name" = "Leave the Mistake on the Tide Chart"
"synopsis" = "Takamaru marks the tide line he once misread in red ink and writes a verse beside it as a warning for the next apprentice. Each month the circle sets such verses against one another."

[academy_clubs."noshima_boat_school:1"]
"name" = "Shell-Matching on the Ebb Flats"
"synopsis" = "After the tide goes out they comb the flats for shells, then match them in pairs, and whoever can’t match one concedes on the spot. Takamaru carves every result into his boat’s planks, and each loss to him adds a notch under the loser’s name."

[academy_clubs."noshima_boat_school:2"]
"name" = "Boat Songs and Incense"
"synopsis" = "On market days they stroll the shore past a row of boats pulled up along it, singing boat songs. A peddler on one of them sells incense wood; they beg a packet off him, shut their eyes, and sniff: aloeswood or sandalwood? Whoever guesses wrong has to start the next song."

[academy_handbook."noshima_boat_school:0"]
"text" = "Noshima sits in the racing straits between Iyo and Aki, and the Murakami boatyard takes children from seafaring families as apprentices. From Kyoto you take ship at Sakai and sail west through the Inland Sea for several days."

[academy_handbook."noshima_boat_school:1"]
"text" = "A child from outside the boat families can still be introduced to the Murakami through a family friend and learn aboard."

[academy_handbook."noshima_boat_school:2"]
"text" = "Latecomers cast off every boat’s mooring line before they may sit down in the shed."

[academy_handbook."noshima_boat_school:3"]
"text" = "No fists aboard. The two who fought row one kobaya out together for a whole day, then stay out of the clubs for ten days."

[academy_handbook."noshima_boat_school:4"]
"text" = "Missing from your bunk overnight means explaining yourself to the bosun in the morning, then no leaving the island for ten days. Fetching a healer or sheltering from a storm is no offense."
