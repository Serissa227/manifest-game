[notes."note_272238e759988f39"]
"text" = "Lessons start before the spring voyages; after Tanabata comes Bon, when the apprentices take a long break and return on Hassaku; the year’s work is tested in autumn. High seas or trouble at home push lessons back."

[notes."note_ef7fac7f45dd6c4b"]
"text" = "Nets hang across the whole yard, to be taken in before dark, and under them you all promise to meet again. Takamaru tosses you a wooden tally scored with notches: “Keep this. The count isn’t settled, and next time I’m the one who wins.” Then he turns to the nets, ears red."

