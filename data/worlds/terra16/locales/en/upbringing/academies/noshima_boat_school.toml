[activities."noshima_boat_school_course_self_study"]
"name" = "Memorizing tide tables on the lookout rock"
"description" = "With no bosun bellowing at your side, you pull the tide tables from the wooden chest yourself, sit out on the lookout rock on the headland, and work along the strait one spot at a time, naming the islands, counting the reefs, and watching which way the tide race runs."
