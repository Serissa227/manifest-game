[academy_clubs."lubeck_countinghouse:0"]
"name" = "One Sack Short, or One Entry Too Many"
"synopsis" = "Hinrik counts the sacks in the storehouse, muttering his tally rhyme, while Greta checks the slips line by line. One sack short, or one entry too many? They each count again, and finally admit that without the other’s kind of care the sum would be wrong."

[academy_clubs."lubeck_countinghouse:1"]
"name" = "Only on Measured Ice"
"synopsis" = "Once the Trave freezes, the apprentices make the river their training ground. Hinrik crouches and raps the ice with his knuckles, judging its thickness by the sound; Greta chips a small hole and lowers a lead-weighted cord, calls out a figure, and he writes it down. Then, with straw rope bound around their soles, they walk the measured line once through. On the day of the ice walking race, they mean to race along that same line."

[academy_handbook."lubeck_countinghouse:0"]
"text" = "The Katharineum opened in 1531 in the old Franciscan friary and takes only burghers’ sons; girls learn to read ledgers at home in merchant households. Apprentices at the Bergen trading post must endure smoking and ducking “games” to be admitted; Lübeck boys know of them only from sailors back in port."

[academy_handbook."lubeck_countinghouse:1"]
"text" = "A family friendship among the merchants can get you a stool in a countinghouse and a seat at the back of the Latin lessons; the Katharineum’s rolls will never carry your name."

[academy_handbook."lubeck_countinghouse:2"]
"text" = "Late? Copy out a page of the day’s ship arrivals at the door, and sit down when it is full."

[academy_handbook."lubeck_countinghouse:3"]
"text" = "No fists in the countinghouse. Whoever throws one recopies every ink-spattered or scrambled ledger sheet, page by page, and stays out of the clubs for ten days."

[academy_handbook."lubeck_countinghouse:4"]
"text" = "Each morning the master goes through the night-bolt book. Anyone who was out all night must say whose roof they slept under, then stay in for ten days. Fetching a physician, or sheltering from fire or storm, goes unrecorded."
