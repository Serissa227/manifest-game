# A6：显示覆盖，仅含文字。

[notes."note_2458c2d12a06f46e"]
"text" = "The year follows the old rule of the town’s Latin school: registration in January, a long break after the summer examinations, lessons again from October, and a noisy school feast around St. Nicholas’ day in early December. Newcomers in early 1554 lodge and catch up first; when the Trave freezes or a family ship sails, lessons shift."

[notes."note_fc2ad1ede91e7658"]
"text" = "On the last day everyone promises to meet again in the cloister yard. Greta turns an old tally sheet over and has everyone sign the back, saying nobody will wriggle out of the reckoning next time. Hinrik studies the sheet for a long while before he signs. The signatures are all bold and easy except one, tucked into the far corner and small as if it hoped not to be seen; Greta notices, asks nothing, and folds the sheet into her ledger pouch with the small name on the inside."

