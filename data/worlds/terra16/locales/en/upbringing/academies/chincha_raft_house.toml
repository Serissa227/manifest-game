[activities."chincha_raft_house_course_self_study"]
"name" = "Counting knots on the landing beach"
"description" = "With no priest at hand, the student takes an old cord to the beach where the rafts land, counts every knot, and then names what each one records against the cargo list; progress is modest, and it does not strain the head."
