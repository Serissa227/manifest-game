[academy_visits."chincha_raft_house:0"]
"note" = "You sit in the last row of the hall in Cusco, listening to Father Cuéllar read. Garcilaso, your own age, shifts over beside you with a Latin primer open on his knee and nods hello."

[academy_clubs."chincha_raft_house:0"]
"name" = "Letters Beside the Knots"
"synopsis" = "Mayta ties the raft cargo into a cord, and Sisa copies the same cargo out in letters. When the two do not agree, neither says “mine is right”: both records are kept, and they go back to count the goods again."

[academy_clubs."chincha_raft_house:1"]
"name" = "The Knot That Tightens"
"synopsis" = "Mayta lays a cord pulled into a dead knot out by the rafts, and nobody dares touch it. Sisa brings a spondylus bracelet with a crack. Everyone takes a turn picking at the knot and patching the bracelet; then each picks a partner, and at the school display they race to tell cacao from honey."

[academy_handbook."chincha_raft_house:0"]
"text" = "Most days you learn in the household of a Chincha raft trader: knots, rafts, the weather off the coast. If your family can find a way to send you to Cusco, you may also sit in on Father Juan de Cuéllar’s readings, where a boy your own age whom you know, Garcilaso, sits beside you."

[academy_handbook."chincha_raft_house:1"]
"text" = "Where you are taught, and as whose child, depends on what befalls your family and what it arranges. Even with a good connection, a raft trader’s child at Cusco sits at the back of the hall and only listens."

[academy_handbook."chincha_raft_house:2"]
"text" = "Not there when the lesson starts? You straighten the tangled cords in the cord house that same day, and only then is there a seat for you."

[academy_handbook."chincha_raft_house:3"]
"text" = "Fight on the raft beach and the two of you haul a raft up the sand together for a whole day; the clubs then stay closed to you for ten days."

[academy_handbook."chincha_raft_house:4"]
"text" = "Not back in the house by night? At first light you go to the household elders and account for where you were, then stay in for ten days. Going for a healer, or being pinned at sea by a storm, does not count."
