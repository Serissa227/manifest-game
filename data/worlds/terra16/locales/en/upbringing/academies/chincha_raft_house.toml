# A6：显示覆盖，仅含文字。

[notes."note_cec255278e5d1d87"]
"text" = "The year’s lessons follow the rhythm of the coast: they open early in the year, classmates race boats in May, the home festival falls in late June, July is a break for running the family’s errands, and the year ends with examinations and the putting away of the cords. Unrest or trouble at home pushes the dates back."

[notes."note_d81bcdbe22689197"]
"text" = "On the last day, in the cotton-drying yard, Mayta cuts a knotted cord into lengths and gives everyone one, so that they can match them up when they meet again. Miss someone, he says, and you tie another knot in yours. Sisa calls that bad luck, then ties her length around her wrist anyway."

