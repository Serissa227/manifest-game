# U03：免费自习的英文课名与说明（11-03 按地区写好）。
[activities."tondo_house_school_course_self_study"]
"name" = "Counting boat flags at the river landing"
"description" = "With no teacher about, the student sits alone at the landing where Fujian junks are moored, counts each boat that comes into port, notes the flags that can be recognized, and saves the rest to ask when the boats return; there is no fee."
