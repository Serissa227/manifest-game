[academy_clubs."tondo_house_school:0"]
"name" = "Two Different Routes"
"synopsis" = "Lakan wants the familiar route; Amihan wants a port nobody has been to. Squatting on the riverbank, they scratch charts with a stick and argue the two routes in pantun, verse answering verse, until the tide comes in. Every verse has to end on a cove that both routes could put into."

[academy_clubs."tondo_house_school:1"]
"name" = "The River-Mouth Paddling Club"
"synopsis" = "At high tide the two paddle a small boat out of the river mouth, Lakan steering and Amihan reading the color of the water. If it capsizes they carry it ashore together and bail it out; who won can wait."

[academy_clubs."tondo_house_school:2"]
"name" = "The Spice-Sniffing Circle"
"synopsis" = "One shuts their eyes and is led through the river-mouth market by the other, then must name each pinch of spice put under their nose: cloves, pepper, cinnamon. Every miss means carrying the other’s load for a day."

[academy_handbook."tondo_house_school:0"]
"text" = "The datu takes his own children, those of his kin and those of his trading partners into a stilt house by the river: Malay letters, accounts on the abacus, reading the shore and the wind. Boys and girls alike come, and it is all knowledge for dealing with Fujian junks and Brunei cargo ships."

[academy_handbook."tondo_house_school:1"]
"text" = "You got into this stilt house on the word of one of the datu’s kin. Who sits near the front and who by the door is still settled by birth, and a recommendation changes nothing there."

[academy_handbook."tondo_house_school:2"]
"text" = "Miss the gong that opens lessons and you go split the firewood under the house and stack it by the ladder."

[academy_handbook."tondo_house_school:3"]
"text" = "Two who come to blows are sent upriver and back in the elder’s own boat, paddling together against the current; if the strokes don’t match, they start over. Hours in one boat settle most quarrels. No clubs for ten days."

[academy_handbook."tondo_house_school:4"]
"text" = "Away from the house overnight, and at dawn you must tell a kin elder where you were; then you may not go down the ladder for ten days. Seeking a healer, or kept at the river mouth overnight by wind and waves, is excused."
