# A6：显示覆盖，仅含文字。

[notes."note_8b1c743d8f4d8616"]
"text" = "Lessons follow the wind: they open under the northeast monsoon, break up for home when the southwest monsoon brings the rains, and the assessment comes when the northeast wind returns. If a boat comes to grief at the river mouth, or trouble falls on a household, the datu says a word and lessons stop."

[notes."note_2a5824f1334e6d0c"]
"text" = "On the last day everyone shares a bamboo tube of coconut water under the palms and agrees: whoever first recognizes another’s pennant in some port hoists one in reply. Lakan swears to embroider a pennant bigger than anyone’s; Amihan says nothing and carries off the empty tube."

