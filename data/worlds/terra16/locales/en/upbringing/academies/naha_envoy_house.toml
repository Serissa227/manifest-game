[academy_clubs."naha_envoy_house:0"]
"name" = "Names on the Sail"
"synopsis" = "A practice sail hangs at the stern of the training boat. Kinjō writes the port names on it and Mae adds the readings beside them, so crewmates of different accents can read off the same route."

[academy_clubs."naha_envoy_house:1"]
"name" = "Linked Verse for the Envoy Ship"
"synopsis" = "Whenever an envoy ship sails, the circle writes linked verse to see it off: Kinjō sets the first line, Mae answers with the next, and they fill a sheet. She copies it out like a family letter and sends it aboard with the cargo."

[academy_handbook."naha_envoy_house:0"]
"text" = "Boys in the envoy’s household study the textbooks and lecture notes that earlier students brought home from Nanjing, the margins still full of other hands’ notes, and hope to be chosen for the academy themselves one day. Girls are taught in the same house, or under a noro priestess."

[academy_handbook."naha_envoy_house:1"]
"text" = "Which room you study in, and in what standing, depends on what befalls your family and how they arrange things. However well a girl reads, only boys are chosen for Nanjing."

[academy_handbook."naha_envoy_house:2"]
"text" = "Latecomers go through the full ritual of entering at the door before they may sit down to the lesson."

[academy_handbook."naha_envoy_house:3"]
"text" = "No fighting in the envoy’s house. The two who fought sweep the banyan yard and scrub the front gallery where guests are received, side by side, and keep out of the circles for ten days."

[academy_handbook."naha_envoy_house:4"]
"text" = "Stay out overnight and you explain yourself to the noro, then keep to the house for ten days. Fetching a healer or sheltering from a storm is no offense."
