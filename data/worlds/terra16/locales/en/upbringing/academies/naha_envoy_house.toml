# A6：显示覆盖，仅含文字。

[notes."note_6518cdc34a13e676"]
"text" = "The household school keeps Naha’s old calendar: lessons open in spring, classmates race dragon boats as summer begins, and on the fourth of the fifth month the whole harbor takes to the water. High summer is a break for family errands, examinations come in autumn, and the books close at year’s end. When an envoy ship comes or goes, or trouble hits the family, the schedule moves."

[notes."note_eab1f72c2b5b0078"]
"text" = "The banyan’s hanging roots brush your shoulders as you all promise, on the last day, to meet again beneath it. Kinjō folds a little map of islands and springs into your hand: “If it goes wrong, steer by this.” Mae takes a knotted blade of silver grass from her sleeve, ties it to the strap of your pack, and says only, “Next time.”"

