[academy_clubs."bilbao_whaling_yard:0"]
"name" = "The Lamp at the End of the Breakwater"
"synopsis" = "On nights when a ship is overdue, Martin fixes the lamp bracket at the end of the breakwater and Elene works out how much whale oil it will burn. They take turns watching until dawn, arguing the whole time over how high to hang it."

[academy_clubs."bilbao_whaling_yard:1"]
"name" = "Tilting at Rings on Mules"
"synopsis" = "On feast days the townsfolk ride at the ring on horseback. The yard children can’t borrow horses, so they borrow the mules that haul timber. Martin has fallen off three times already; Elene beats a drum at the side to keep his time."

[academy_handbook."bilbao_whaling_yard:0"]
"text" = "Bilbao’s shipyards and whaling families take children on to learn the trade: knots, weather signs, ship repair, barrel hoops. No one this young sails with the whalers to Newfoundland, let alone touches a harpoon."

[academy_handbook."bilbao_whaling_yard:1"]
"text" = "Other children need a shipowner or an old harpooner to vouch for them before the yard will take them. A sponsor opens the gate; the rules aboard stay the same."

[academy_handbook."bilbao_whaling_yard:2"]
"text" = "Late? You haul timber all morning before you sit down for lessons."

[academy_handbook."bilbao_whaling_yard:3"]
"text" = "No fists in the yard. Two who fight spend a day working at the cooper’s together and stay out of the clubs for ten days."

[academy_handbook."bilbao_whaling_yard:4"]
"text" = "Spend a night away from the yard and you explain where in the morning, then stay in for ten days. Running for a physician or helping save a boat is no offense."
