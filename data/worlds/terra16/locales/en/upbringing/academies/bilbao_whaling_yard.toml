# A6：显示覆盖，仅含文字。

[notes."note_6638d4623aa68501"]
"text" = "The yard’s year follows the whaling fleet: tests come just before it sails in early summer, summers go to salting cod and helping the coopers, and lessons start in October. By year’s end everyone is watching for the ships home from Newfoundland."

[notes."note_10af41ffb7f393df"]
"text" = "On the last day, in the sail-drying yard, everyone agrees that whoever first ships out for Newfoundland will send word home with a returning crew. Elene presses a little packet of herbs on each of you—for frostbite, she says."

