[academy_clubs."antwerp_printing_rhetoric:0"]
"name" = "The Script With One Line Blank"
"synopsis" = "Mathijs borrows old scripts from De Violieren and has everyone write refrains on the blank backs. He always leaves the last line for Jan, and Jan only ever marks it with a pause."

[academy_clubs."antwerp_printing_rhetoric:1"]
"name" = "Crossbows Below the Ramparts"
"synopsis" = "In the afternoons the apprentices practice the crossbow below the ramparts, where the old guildsmen grumble about shaky hands. Jan can’t span the bow, so he stands by and sings out the count."

[academy_handbook."antwerp_printing_rhetoric:0"]
"text" = "Plantin’s press opens only in 1555; until then you copy and run errands for a bookseller. Girls don’t join the guilds. Most help read proofs at home—Plantin’s own daughters start at four or five—or go to the poetry circle the girls run themselves."

[academy_handbook."antwerp_printing_rhetoric:1"]
"text" = "A boy from outside the craft and burgher families can still be taken on if someone pays his apprentice’s bond. The guild’s rules don’t bend an inch for it."

[academy_handbook."antwerp_printing_rhetoric:2"]
"text" = "A late apprentice sweeps up the lead filings before he may touch a type case."

[academy_handbook."antwerp_printing_rhetoric:3"]
"text" = "Two who fight in the shop reset whatever forme got knocked over, together. No rhetoric chamber or crossbow range for ten days."

[academy_handbook."antwerp_printing_rhetoric:4"]
"text" = "Sleep anywhere but the workshop and you answer to the master for it, then stay indoors for ten days. Fetching a physician or fleeing a fire is no offense."
