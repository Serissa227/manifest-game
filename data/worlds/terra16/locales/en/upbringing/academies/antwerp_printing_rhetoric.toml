# A6：显示覆盖，仅含文字。

[notes."note_bcf09117dc48ca60"]
"text" = "An apprentice’s year runs on the book fairs: lessons start in autumn, tests come in early summer, and summers go to packing crates and delivering proofs. From 1555 you move to Plantin’s press—the same lessons, with type and ink added."

[notes."note_77f4be2074091ad5"]
"text" = "On the last day of 1556 Jan and Mathijs see you off in the drying yard. Nobody admits to missing anyone. They only agree that whoever first prints a book of his own will send for the other two."

