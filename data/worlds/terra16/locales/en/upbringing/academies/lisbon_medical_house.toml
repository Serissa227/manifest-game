[academy_visits."lisbon_medical_house:0"]
"note" = "To sit in at Coimbra, your family must first book passage toward the mouth of the Mondego or hire a mule cart for the road; once the lectures are done you are back in Lisbon, and the daily round at the physician’s house carries on as before."

[academy_clubs."lisbon_medical_house:0"]
"name" = "When in Doubt, Don’t Guess"
"synopsis" = "Any herb Duarte and Beatriz are unsure of goes into an empty basket to wait for the master’s return. If a label has one wrong letter, they copy it out fresh rather than scratch it over and bluff."

[academy_clubs."lisbon_medical_house:1"]
"name" = "The Pestle Keeps the Beat"
"synopsis" = "The physician’s yard has no drum, so Beatriz squats by the herb bed pounding cinnamon, one stroke to a beat, her voice louder than the pestle: “Steady—now!” Duarte rides the master’s gray mare past the fig tree with a drying pole in his fist, eyes half shut. Two rings in ten; the other eight stay dangling from the branch. For the feast-day tilting at rings, that is the beat they mean to ride to."

[academy_handbook."lisbon_medical_house:0"]
"text" = "The university moved to Coimbra in 1537, leaving Lisbon its physicians’ medicine chests. Boys spend their days in a doctor’s house learning the remedies and keeping case notes; only families with connections can send them to sit in at Coimbra. A few years earns no degree, but it is enough to know a cure, question a patient, and tend the sick."

[academy_handbook."lisbon_medical_house:1"]
"text" = "If your family knows a physician or a master at the university, a word from them can get you through the door. Inside, the rules of the trade bend for no one: patients do not wait, and neither may an apprentice."

[academy_handbook."lisbon_medical_house:2"]
"text" = "The jars are the master’s pride. Late? Wipe every one on the shelf before you may sit down to lessons."

[academy_handbook."lisbon_medical_house:3"]
"text" = "No fighting in the consulting room. Two who brawl copy out thirty recipes, pay for whatever jar they broke, and stay out of the clubs for ten days."

[academy_handbook."lisbon_medical_house:4"]
"text" = "Spending the night away to fetch a surgeon and save a life, or to flee plague or fire, is no offense. Any other night out, you tell the master at first light where you slept, then stay in the dispensary for ten days."
