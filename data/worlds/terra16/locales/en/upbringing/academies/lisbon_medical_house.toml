# A6：显示覆盖，仅含文字。

[notes."note_324cb69a30c74b10"]
"text" = "The house keeps the fever calendar. New pupils register in January; summer brings the most patients, so after the examinations everyone is sent home on a long break to help; lessons resume the week before St. Luke’s day in October. Newcomers in early 1554 begin with catch-up work. A plague in the city or trouble at home can push everything back."

[notes."note_765f5ece3035f338"]
"text" = "On the last day everyone promises to meet again by the herb beds. Duarte draws a leaf on the back of each hand—whoever can’t name the plant next time pays for dinner—and Beatriz throws open the window to let the air in. The leaves wash off in a day, but the window stays open until dark; some take it for a friend’s kindness, and some quietly keep it in mind for later."

