[activities."golden_horn_yard_course_self_study"]
"name" = "Measuring timber by the lumber stacks"
"description" = "With no master at hand, the apprentice takes an old rule and measures each length of timber in the open yard, noting the sizes in a small notebook and measuring again whenever a figure is off; progress is slow, but less sawdust settles on the clothes."
