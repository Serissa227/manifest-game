[academy_clubs."golden_horn_yard:0"]
"name" = "A Leaking Seam"
"synopsis" = "A seam in the hull is weeping. Selim wants the whole plank replaced; Leyla chalks the leaking stretch first and says half a plank will do. Both agree the saved wages should go to timber that is really needed."

[academy_clubs."golden_horn_yard:1"]
"name" = "Mallets in Time"
"synopsis" = "Selim brings a stool leg with a split tenon, Leyla a pulley that has seized, and the rule is to swap: Leyla cuts the tenon while Selim keeps his hands in his lap and beats time with a mallet, not one blow off; when he takes the pulley apart, she beats time for him. Keep the beat steady and you won’t fall behind when the musicians play together that evening."

[academy_handbook."golden_horn_yard:0"]
"text" = "Arsenal apprentices stand on the slipways beside the master shipwrights, hands full of sawdust and pitch; they are a different breed from the pages studying at the palace’s Enderun school. Girls do not go onto the slipways, but can start in a household workshop that takes arsenal work, or by copying papers for the counting-house."

[academy_handbook."golden_horn_yard:1"]
"text" = "First comes whose child you are, then where you learn: whatever has happened to your family sets your road. A connection can push one door open, but the city’s old rules do not give an inch."

[academy_handbook."golden_horn_yard:2"]
"text" = "Shavings don’t walk off on their own. Latecomers sweep the slipway shavings into heaps and haul them out of the yard, basket by basket."

[academy_handbook."golden_horn_yard:3"]
"text" = "A mallet doesn’t pick sides, so a fight on the slipway is no small thing. The master pulls the two apart to cool off, each gives an account, and then the pair make good what was damaged, as it was before. For ten days neither of them touches club work."

[academy_handbook."golden_horn_yard:4"]
"text" = "An empty bed in the loft is something the master sees at first light. Tell him to his face where you were; from now on, even for an errand to the Tahtakale market, make sure he knows before you go. For ten days you do not cross his threshold. Fetching a physician, or keeping clear when trouble breaks out in the streets, is not punished."
