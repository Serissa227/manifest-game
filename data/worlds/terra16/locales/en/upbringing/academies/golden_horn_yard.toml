# A6：显示覆盖，仅含文字。

[notes."note_a202412bc1a7a3d4"]
"text" = "The arsenal keeps the Muslim lunar calendar: in 1554 lessons begin in mid-September, examinations fall at the end of July and the long break comes in August; every year after, each date moves about ten days earlier. Early 1554 is spent lodging with the master and catching up. When the fleet must be fitted out for a campaign, or something happens at home, the schedule gives way."

[notes."note_2b26f660bbadeffd"]
"text" = "On the last day the sawdust by the timber stacks has not yet been swept. Selim says he would know the plank he trimmed on any ship that goes down the ways. Leyla says then his name belongs on the launch list, and she will write it herself. She does not look up, but her pen stops for a moment."

