# U03：免费自习的英文课名与说明（11-03 按地区写好）。
[activities."zhangzhou_shexue_course_self_study"]
"name" = "Self-study under the longan tree"
"description" = "With the master out of earshot, you take the books he has taught out under the longan tree, read them over a few times and trace a few lines; it costs no tuition, the learning comes slower, and it hardly tires you."
