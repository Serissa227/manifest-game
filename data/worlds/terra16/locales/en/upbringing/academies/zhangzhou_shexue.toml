[academy_clubs."zhangzhou_shexue:0"]
"name" = "The Poetry Book No One Will Lend"
"synopsis" = "The circle has a poetry book nobody is allowed to borrow. Xu Cai fills in the words page by page, and Xiao Man adds boat names and wind directions in the margins. That is how the circle learns that a single page can hold a sea route."

[academy_clubs."zhangzhou_shexue:1"]
"name" = "Dragon-Boat Practice on the Jiulong"
"synopsis" = "A month before the Dragon Boat Festival, a few classmates practice rowing at a small landing on the Jiulong River. Huang Dun sits amidships as ballast, Chen Dong calls the stroke, and Zhou Yan perches in the bow with a book, finishing his page even as the spray soaks it."

[academy_clubs."zhangzhou_shexue:2"]
"name" = "The Tea-Tasting Club"
"synopsis" = "After school they stroll the market, each paying a few coppers for a pinch of tea, then pit the teas against each other under the eaves behind the Tianfei temple. Huang Dun names the tea shop after one sniff; Xiao Man judges by the color of the liquor alone. Whoever loses buys everyone a bowl of thin-noodle soup."

[academy_handbook."zhangzhou_shexue:0"]
"text" = "Longxi’s community school takes only boys under fifteen. The schoolroom stands beside the Tianfei temple, where the master teaches reading and writing, bows and courtesies, and accounts. Girls cannot go in; their families must find another way, or they listen through the window. Pupils who turn fifteen go on reading privately at the master’s house."

[academy_handbook."zhangzhou_shexue:1"]
"text" = "If your family is on good terms with the master or the lineage elders, a word from them can get you in. Once inside, the school’s rules do not loosen by a single line."

[academy_handbook."zhangzhou_shexue:2"]
"text" = "Come late and you are in the schoolroom before dawn the next day, sweeping and grinding ink, ready when the master walks in."

[academy_handbook."zhangzhou_shexue:3"]
"text" = "When classmates come to blows, the master neither beats nor scolds them. He sits them side by side to copy out a chapter of the Analects between them, one line each in turn, and a single wrong character means starting over; broken desks they mend themselves. For ten days they keep out of the clubs."

[academy_handbook."zhangzhou_shexue:4"]
"text" = "Not back in the side room overnight, and at dawn you kneel before the master for the length of an incense stick, then report exactly where you went; you do not step outside the school gate for ten days. Fetching a physician or hiding from a pirate alarm is not punished."
