# A6：显示覆盖，仅含文字。

[notes."note_d9d15bd74214f8ef"]
"text" = "The school keeps the court’s almanac: enrollment before New Year, lessons after the Lantern Festival, a holiday at Dragon Boat, a break in the summer heat, examinations in autumn and the roll closed at year’s end. When the alarm gong sounds for pirates, or a typhoon bears down, or something happens at home, the master shuts his book and sends the pupils home."

[notes."note_8cd87a650fbf4f1d"]
"text" = "On the last day everyone agrees under the longan tree that on every Dragon Boat day they will come back to the Tianfei temple to watch the races. Zhou Yan jots the date in the margin of his book on the spot, and Huang Dun declares that whoever stays away pays the crew’s dues for the year."

