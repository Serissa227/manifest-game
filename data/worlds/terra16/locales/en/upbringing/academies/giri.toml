# A6：显示覆盖，仅含文字。

[notes."note_9a2e75852b73c839"]
"text" = "Giri keeps time by the moon: Mawlid and Ramadan arrive about ten days sooner each year. During the long break pupils cross the sea and help with family business at home. Unrest in the islands, or something at home, moves the schedule."

[notes."note_d79a0ff858a772a7"]
"text" = "Under the old banyan, its hanging roots brushing your shoulders, everyone agrees: whoever reaches home first will send word on the next boat. Suma laughs and says the price of carrying a letter must be settled first. Wati says nothing and puts a single nutmeg in your palm."

