[academy_clubs."giri:0"]
"name" = "A Boat of One’s Own"
"synopsis" = "Raja wants to line the practice boats up as a fleet and sail in formation. Daeng says no: first every boat must row out alone and come home alone; formations come after. They argue in pantun, the first two lines about the boats and the last two about who answers whom."

[academy_clubs."giri:1"]
"name" = "Afternoons Mending Sail"
"synopsis" = "Daeng’s oar has a crack down it, so Nyai Gama lashes it tight with rattan and mentions the price of the rattan. Suma’s indigo-stained sail hem has worn through, and Daeng stitches it without a word, calling it even. Nyai Gama’s pepper contract has gone moldy in the damp; Suma copies it out clause by clause, and one wrong figure means starting over. Then oar and sail go aboard the practice korakora, ready for the race."

[academy_clubs."giri:2"]
"name" = "Hawkers’ Tunes"
"synopsis" = "In Gresik’s market the pepper sellers sing their prices to a tune in three beats and the cloth sellers to one in two. A few of them stroll the rows, listening, and when they reach the jetty the one who has said least picks a tune and the rest hum along."

[academy_handbook."giri:0"]
"text" = "Sunan Prapen presides over the hill of Giri, and sons from the Moluccas, Ambon and Borneo cross the sea to study. Boys lodge on the hill and attend the lectures; girls learn from women teachers in family schoolrooms, trading houses and song circles."

[academy_handbook."giri:1"]
"text" = "With a family connection, a girl can sit in on the women teachers’ lessons, but never in the open hall where the boys listen."

[academy_handbook."giri:2"]
"text" = "The well at the foot of the hill is still waiting: latecomers carry one extra load of water up to the hill."

[academy_handbook."giri:3"]
"text" = "The women teachers call the two who came to blows into the palm-leaf store and hand them a loose bundle of leaves to rethread in page order, each telling their side as they work; one wrong leaf and they start over. What was broken they put right together, and club business waits ten days. They say that on this hill you may quarrel with your mouth and nothing else."

[academy_handbook."giri:4"]
"text" = "Not back on the hill by night? Tell the women teachers where you were. Next time, get one of the boys from the jetty to carry word up before you go. No leaving the hill for ten days. Calling a physician, or sheltering from a storm or from trouble, is not punished."
