[activities."giri_course_self_study"]
"name" = "Copying palm-leaf texts under the banyan"
"description" = "With the woman teacher out of the room, the student lays an old palm leaf across the knees, copies it beneath the aerial roots of a banyan, and scrapes away each wrong letter with a knife point before rewriting it; progress is slow, but it is not strenuous."
