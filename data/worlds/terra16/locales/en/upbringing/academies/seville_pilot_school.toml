# U03：免费自习的英文课名与说明（11-03 按地区写好）。
[activities."seville_pilot_school_course_self_study"]
"name" = "Checking old charts in the chart room"
"description" = "With no master at hand, the student takes an old chart from the chart room, checks it point by point against courses logged at sea, and writes the cause of any error in the corner of the sheet; progress is slow, and each chart gains a line of small notes."
