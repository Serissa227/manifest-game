[academy_clubs."seville_pilot_school:0"]
"name" = "A Chart Corrected Together"
"synopsis" = "Each meeting, Pedro and Leonor argue over the same chart: he trusts his scale, she trusts the sounding line. When it’s settled they each correct one stroke, and a visitor to the chart shop can tell whose hand is whose."

[academy_clubs."seville_pilot_school:1"]
"name" = "Rings and Vihuelas"
"synopsis" = "On the riverbank someone plays the vihuela while someone else practices tilting at a ring from a hired old horse. Leonor plays and watches Pedro’s lance: “Lower. Lower still.” Whenever he takes the ring, she fumbles a few notes."

[academy_handbook."seville_pilot_school:0"]
"text" = "The Casa’s chair of cosmography has lectured since 1553. A pupil who finishes too young gets only an apprentice’s certificate; a full pilot’s license takes years at sea besides. Girls can learn at home, or in a chart shop, picking up the craft as they copy charts."

[academy_handbook."seville_pilot_school:1"]
"text" = "Your family settles first in what capacity you study and under which master. However wide the connections, the Casa’s examiners will not license a girl as a pilot."

[academy_handbook."seville_pilot_school:2"]
"text" = "Latecomers are stopped at the door with a sum (how high will the sun stand at noon today?) and come in only once they get it right."

[academy_handbook."seville_pilot_school:3"]
"text" = "No fighting in the Casa’s yard. The two who came to blows copy a chart together and keep out of the clubs for ten days."

[academy_handbook."seville_pilot_school:4"]
"text" = "Not back at the boarding house by night? Account for it to the landlord and the master, then stay in for ten days. Going for a physician, or getting out when the river climbs over the doorstep, is no offense."
