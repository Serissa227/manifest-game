# A6：显示覆盖，仅含文字。

[notes."note_d831b62863e85c75"]
"text" = "The chair keeps its own calendar: examinations at the end of June, a long break in the July heat, lessons from October. New pupils in early 1554 board and catch up first. When a fleet is loading to sail or coming in, the Casa is in an uproar and lessons have to give way. Trouble at home can shift the dates too."

[notes."note_5aa5474a019ae2a1"]
"text" = "The oranges have just turned gold, and on the last afternoon you all sit beneath them in the courtyard. Pedro sets a small astrolabe he has calibrated on the stone bench and lets everyone take a turn; Leonor draws a shoal in the corner of your chart and writes beside it, “Come back and correct me.”"

