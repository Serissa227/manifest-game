# A6：显示覆盖，仅含文字。

[notes."note_f680a6deb6790571"]
"text" = "Lessons follow the court’s round of observances: regular teaching begins in spring, everyone goes home around the Bon festival, and the year’s test comes in late autumn. Apprentices who reach the capital in early 1554 lodge with relatives and catch up first. If fighting breaks out in the city, or trouble comes at home, the calendar changes at once."

[notes."note_1ddb309974cd0ef2"]
"text" = "On the last day frost lies thin on the little garden. Everyone promises to meet again, though no one names a year. Someone slips a poem, folded to a narrow strip, up another’s sleeve; the other pretends not to notice, then keeps that arm still all day."

