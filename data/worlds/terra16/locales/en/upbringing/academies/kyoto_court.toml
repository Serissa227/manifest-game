[academy_clubs."kyoto_court:0"]
"name" = "A Name on the Poem Slip"
"synopsis" = "Two members spent three days arguing over the half-line about plum fragrance after rain, each swearing to have thought of it first. In the end both drafts were copied side by side into the club book, with a finger’s width of blank paper between the two names."

[academy_clubs."kyoto_court:1"]
"name" = "The Koto with a Snapped String"
"synopsis" = "The club has a rule: whatever you break, you don’t hide it—you bring it, and everyone mends it together. Ushio’s koto has a snapped string, which she knots tighter than it needs; Ayame brings a scorched incense cake, after straightening her sleeve three times; Kogo’s shell, its painted scene smeared, is quietly touched up by Reizei Yuki. Then each draws half of a split shell, and whoever holds the matching half is partner for the shell-matching contest."

[academy_clubs."kyoto_court:2"]
"name" = "Whose Turn to Choose"
"synopsis" = "The song circle has no leader; each time the quietest member chooses the tune. When it was Kikuchiyo’s turn he picked the shortest one and sang it so softly you had to lean in to hear—and when it ended, everyone nodded anyway."

[academy_handbook."kyoto_court:0"]
"text" = "Court nobles’ daughters enter service at thirteen or fourteen and learn etiquette and verse from the court ladies—and how to cross a long corridor without a sound. Hōkyōji is a convent long headed by imperial princesses, where the apprentices copy sutras and learn to judge incense. The ink is pale and the wrist is held in the air, and half a page is enough to make the hand ache."

[academy_handbook."kyoto_court:1"]
"text" = "Your family leaned on an old acquaintance at court to get your name onto the apprentices’ list. The name opens the door; rank, and the color of every sleeve, are still sorted out inside as strictly as ever."

[academy_handbook."kyoto_court:2"]
"text" = "Late? Don’t rush in. Kneel outside the sill and grind ink on an inkstone until a senior lady nods; only then may you take your seat."

[academy_handbook."kyoto_court:3"]
"text" = "A court lady fights with sleeves and tongue, never hands. Two who actually come to blows sit on either side of a screen, each composing ten penitent poems, mend whatever they broke, and stay out of the circles for ten days."

[academy_handbook."kyoto_court:4"]
"text" = "Stay out all night and the senior lady asks, “Under whose eaves did you sleep?” Even a truthful answer costs ten days indoors. Seeking a physician or fleeing a burning street costs nothing."
