# A6：显示覆盖，仅含文字。

[notes."note_a86b3e255350aff1"]
"text" = "The house keeps Seville’s year: names called and entered in the roll in January, examinations at the end of June, a long break through the July and August heat, lessons reopening in October as usual. If a hurried letter comes from Barcelona, or trouble breaks out in the city, the steward says a word and the timetable is redrawn."

[notes."note_ebe7136fa0b48075"]
"text" = "On the last day everyone promises to meet again beside the fountain in the tiled courtyard—no city, no year, only that whoever arrives first waits. Some clap a shoulder and say “See you,” and some swallow what they meant to say."

