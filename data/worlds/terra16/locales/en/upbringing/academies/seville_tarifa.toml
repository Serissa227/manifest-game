[academy_clubs."seville_tarifa:0"]
"name" = "Beyond the Blade’s Point"
"synopsis" = "Diego thinks Lorenzo slow with a blade; Lorenzo laughs that Diego can’t get through a single Latin maxim. They trade lessons, footwork for turns of phrase, and end up with a two-man display that borrows from both."

[academy_clubs."seville_tarifa:1"]
"name" = "Ring-Tilting in the Back Yard"
"synopsis" = "An iron ring hangs from a wooden frame in the back yard, and everyone takes a turn riding the house’s old horse at it. Someone strums a vihuela under the gallery, and whoever misses spends the afternoon tuning its strings."

[academy_handbook."seville_tarifa:0"]
"text" = "The marquis has gone to Barcelona as viceroy of Catalonia, and the steward minds the Seville house. It takes sons of noble families and pages, who have their lessons under the gallery. Maids and girls who want to listen in need a family connection."

[academy_handbook."seville_tarifa:1"]
"text" = "A maid or girl with a family connection may sit in the last row under the gallery. However well she listens, her name never reaches the pages’ roll."

[academy_handbook."seville_tarifa:2"]
"text" = "Come running after the roll has been called and the steward marks it down; after supper you polish the gallery candlesticks, one by one."

[academy_handbook."seville_tarifa:3"]
"text" = "Two pages who come to blows get blunted practice foils from the steward and must settle it in the gallery under his eye; whoever breaks the rules first loses. Neither may attend a club for ten days."

[academy_handbook."seville_tarifa:4"]
"text" = "Stay out all night and the steward wants to hear, face to face, where you were. Then the back gate is bolted: ten days without leaving the house, and the courtyard tiles are yours to scrub. A page sent to fetch a physician, or caught in trouble in the city, is let off."
