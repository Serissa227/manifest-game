[academy_clubs."murano_workshop:0"]
"name" = "Even Shards Have Colors"
"synopsis" = "Piero wants to hide every cracked cup; Marietta numbers the shards one by one and drags them to the circle to argue it out: did the fire do it, or the batch? After a winter of quarreling, the two of them finally pull the same batch of colors out of the furnace twice."

[academy_clubs."murano_workshop:1"]
"name" = "Across the Lagoon Without Breaking a Cup"
"synopsis" = "A crate of empty cups goes in the boat, and the crossing only counts if every cup reaches the far shore whole. Piero keeps jumping the beat and the cups jangle the whole way; Marietta sits in the bow counting waves and muttering the regatta calls."

[academy_handbook."murano_workshop:0"]
"text" = "Murano’s glass masters take guild families’ sons as apprentices, and Paolo Manuzio’s press takes in pupils to learn Latin and correct proofs. A daughter who wants the trade mostly gets in through her own family’s workshop."

[academy_handbook."murano_workshop:1"]
"text" = "A family acquaintance at a workshop or at the press can vouch for you and get you through the door. Birth and guild rules don’t bend for it."

[academy_handbook."murano_workshop:2"]
"text" = "Late? You feed the furnace a basket of wood before you’re allowed to touch a blowpipe."

[academy_handbook."murano_workshop:3"]
"text" = "Fire and glass don’t mix with shoving. Two who come to blows sweep up the shards together and split the cost of the spoiled batch, then stay out of the clubs for ten days."

[academy_handbook."murano_workshop:4"]
"text" = "Stay out a night and you account for it to the master’s face, then keep indoors for ten days. Fetching a priest or a physician, or taking shelter from the high water, is no offense."
