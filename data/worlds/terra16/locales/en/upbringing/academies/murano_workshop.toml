# A6：显示覆盖，仅含文字。

[notes."note_1835ed93fa95e678"]
"text" = "Here the year follows the furnace: examinations at the end of June, the fires banked in July and the apprentices sent home to help, lessons beginning again when the furnace is lit in October. New apprentices who arrive in early 1554 lodge with the master and catch up first. If trouble hits the family or the lagoon floods, the dates are set anew."

[notes."note_8c70d4ff9a6d085d"]
"text" = "Broken glass crunches underfoot in the yard behind the furnace as you all stand in a ring and pass a once-cracked cup from hand to hand. The deal: whoever first fires a batch that doesn’t crack sends everyone else a cup. Piero swears it will be him. Marietta says nothing and presses a freshly polished lens into your hand."

