[activities."murano_workshop_course_self_study"]
"name" = "Grinding glass edges in the cullet yard"
"description" = "With no master watching at the furnace mouth, the apprentice takes a shard of cullet and grinds off its rough edge on the yard stone until a face can be seen in it; progress is slow, but there are fewer cuts on the hands."
