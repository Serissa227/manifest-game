[academy_clubs."cairo_azhar:0"]
"name" = "Who Writes Down the Water Level"
"synopsis" = "At the gauge on Roda Island the club takes turns crouching to read it and write the figures down. Salih and Ilhan once quarreled over a reading one mark apart; now one reads the gauge and the other checks it. Zubayda and Amina keep a separate catalog of which manuscript records which year’s flood."

[academy_clubs."cairo_azhar:1"]
"name" = "The Cracked Board"
"synopsis" = "Ilhan’s bao board has split along a seam and lies on the mat by the pillar for days, tripping everyone who passes. Zubayda comes over with a crookedly bound booklet, and everyone lends a hand until both are mended. Only then does each pick a partner for a game of bao at the school display."

[academy_clubs."cairo_azhar:2"]
"name" = "Songs at the Goldsmith’s Door"
"synopsis" = "When the goldsmiths’ street closes for the night, the club sits down at a shop door and sings. No one grabs the lead: each time, someone who is usually quiet picks the song. Afterward they take turns drawing a streak on the touchstone to judge the gold."

[academy_handbook."cairo_azhar:0"]
"text" = "Al-Azhar lodges its students by homeland, and the Jabarti quarter takes boys from Zeila and the Horn of Africa. The shaykh sits against a pillar of the arcade and teaches one passage at a time; the seats there are for boys. Girls study in bookseller households or with a woman scholar, a few listening from beyond the arcade, and they lodge elsewhere."

[academy_handbook."cairo_azhar:1"]
"text" = "Your family must first find a way in, and settle in what capacity and under which shaykh you will study. Connections open the door; the arcade’s old rules still bind you."

[academy_handbook."cairo_azhar:2"]
"text" = "Come late to the arcade and you lay out the shaykh’s cushion and fill his lamp before you may sit."

[academy_handbook."cairo_azhar:3"]
"text" = "Blows in the arcade are serious. The two are separated to sit in silence, must give an account before everyone and pay for whatever was broken, and keep out of the clubs for ten days."

[academy_handbook."cairo_azhar:4"]
"text" = "Spend a night away from your lodging and you explain yourself to the elders of your homeland the next day, then stay in for ten days. Fetching a doctor or taking refuge from danger is not punished."
