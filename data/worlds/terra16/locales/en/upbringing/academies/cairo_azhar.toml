# A6：显示覆盖，仅含文字。

[notes."note_6dc73b8be04f9c89"]
"text" = "The arcade’s year follows the moon: students report early in the year, the Prophet’s birthday falls in February, examinations come just before Ramadan, the long break is Ramadan itself, and everyone returns after the feast. Newcomers in early 1554 lodge and catch up first; the pilgrimage season or trouble at home can shift the lessons."

[notes."note_ce1e22661fff03de"]
"text" = "On the last day everyone in the courtyard writes the name of their hometown on one sheet of paper. They agree that whoever’s ship first reaches a classmate’s home port goes down to that quay and waits there until the classmate arrives. Everyone swallows a few things they might have said, to keep for the meeting. Zubayda folds the sheet and says she will keep it for them all."

