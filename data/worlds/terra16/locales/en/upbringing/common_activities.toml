[activities."lesson_navigation"]
"name" = "Navigation"
"description" = "From the quay, the teacher points out headlands, towers and steeples and has you learn them as landmarks, then drills you on knots and wind. Mostly standing and listening; not hard work."

[activities."lesson_astronomy"]
"name" = "Astronomy"
"description" = "By day you learn the stars on paper; by night you climb onto the roof and hunt for them one by one. Expect to yawn through the next morning’s lesson."

[activities."lesson_accounts"]
"name" = "Arithmetic and accounts"
"description" = "A basket of eggs, three bolts of cloth, two sales on credit: every problem comes from the market, and it has to end as two pages that balance to the last coin. Hard on the head, easy on the back."

[activities."lesson_languages"]
"name" = "Languages"
"description" = "Pick a language someone in town can teach, and start with the letters and cargo lists that come in on the ships. The vocabulary is endless, until the first time a stranger understands you."

[activities."lesson_sword"]
"name" = "Sword and arms"
"description" = "You learn whatever the local master teaches: the Spanish sword, the Italian, the Japanese blade, the Fujian staff or the Ottoman saber. Lesson one is pulling your blow. Wooden swords still leave bruises."

[activities."lesson_firearms"]
"name" = "Firearms lesson"
"description" = "The master checks every match before it reaches your hand, and you drill the loading order (powder, ball, priming) until a single slip sends you back to the start. Your ears ring long after class."

[activities."lesson_etiquette"]
"name" = "Etiquette lesson"
"description" = "The same greeting changes for an elder, a merchant, an official: different titles, a different place to stand. A day of holding yourself just so leaves your back sorer than your legs."

[activities."lesson_medicine"]
"name" = "Medicine and herbs"
"description" = "Out on the hillside with the teacher, you sort look-alike leaves into separate piles and label anything you’re unsure of. No tasting. You come home with green hands and tired feet."

[activities."lesson_drawing"]
"name" = "Drawing lesson"
"description" = "Fix two marks on shore for scale and draw the coastline stretch by stretch. Any line you made up, the teacher spots at a glance and has you rub out. Numb legs, tired eyes."

[activities."lesson_shipbuilding"]
"name" = "Shipbuilding lesson"
"description" = "Down under the slipway, you feel the grain, measure the ribs and watch the old hands drive oakum into the seams and pour on pitch. Sawdust down your collar, pitch on your hands for three days."

[activities."lesson_music_poetry"]
"name" = "Music and poetry"
"description" = "Keep time to the strings, and learn where a song takes its breath and how one line answers the last. When your turn comes, hear the other person out first."

[activities."lesson_calligraphy"]
"name" = "Calligraphy lesson"
"description" = "The stroke you always get wrong, the teacher has you write a hundred times more, and anything you copy gets checked against the original word by word. Sore wrist, quieter mind."

[activities."lesson_devotional"]
"name" = "Local religious instruction"
"description" = "With the local priest, imam or temple teacher, you memorize scripture, learn the holy days and how to receive those who come to pray. This class teaches devotion, not magic."

[activities."lesson_arcana"]
"name" = "Reading arcane traditions"
"description" = "Only after your awakening will anyone tell you about the art handed down in the family: whose hands it passed through, what it can do, and what it must never touch."

[activities."dock_work"]
"name" = "Junior porter"
"description" = "Count the bales before they go on your shoulder, and shout for a hand with the heavy ones. Paid at day’s end; the ache arrives at night. Wrench your back and the whole stint is wasted."
"tier_name" = "Junior porter"

[activities."dock_work_tier2"]
"name" = "Master of a gangplank"
"description" = "Count the bales before they go on your shoulder, and shout for a hand with the heavy ones. Paid at day’s end; the ache arrives at night. Wrench your back and the whole stint is wasted."
"tier_name" = "Master of a gangplank"

[activities."dock_work_steady"]
"name" = "Built to last"
"description" = "The old porters teach you to shift a load and pace your breathing, so you last until the bell without wrecking your back. A little less pay; a sturdier frame."
"tier_name" = "Built to last"

[activities."dock_work_initiative"]
"name" = "The heavy pieces"
"description" = "Anchors, gun barrels, full wine casks: whatever the others won’t touch. Far better pay, but you buy your own back strap, and one slip lands on your feet."
"tier_name" = "The heavy pieces"

[activities."tavern_job"]
"name" = "Plate carrier"
"description" = "Wipe tables, carry soup, learn the regulars’ names and favorite benches. The key to the wine casks hangs at the landlady’s belt. When a table goes over, get behind the counter."
"tier_name" = "Plate carrier"

[activities."tavern_job_tier2"]
"name" = "Your own long table"
"description" = "Wipe tables, carry soup, learn the regulars’ names and favorite benches. The key to the wine casks hangs at the landlady’s belt. When a table goes over, get behind the counter."
"tier_name" = "Your own long table"

[activities."tavern_job_steady"]
"name" = "The listening corner"
"description" = "Sit in the corner with the old sailors, hear their routes and their stories, and learn to keep a conversation going. Less than you’d make running plates, but a better tongue and a better ear."
"tier_name" = "The listening corner"

[activities."tavern_job_initiative"]
"name" = "Running the room"
"description" = "On feast nights you run the room for the landlady: a house full of sailors, quarrels and tabs, held together by your smile. Big tips, and broken crockery comes out of your wages."
"tier_name" = "Running the room"

[activities."countinghouse_job"]
"name" = "Daybook copyist"
"description" = "Start on the small books, where one missing coin means tracing the entry it slipped from. A whole day on the bench, fingers numb from the counters, and a mistake shows on the master’s face before it shows in the ledger."
"tier_name" = "Daybook copyist"

[activities."countinghouse_job_tier2"]
"name" = "Keeper of a cashbox"
"description" = "Start on the small books, where one missing coin means tracing the entry it slipped from. A whole day on the bench, fingers numb from the counters, and a mistake shows on the master’s face before it shows in the ledger."
"tier_name" = "Keeper of a cashbox"

[activities."countinghouse_job_steady"]
"name" = "The auditor"
"description" = "You check the books, first page to last, flicking counters until midnight. No great bonus; sharp eyes and quick fingers."
"tier_name" = "The auditor"

[activities."countinghouse_job_initiative"]
"name" = "At the bargaining"
"description" = "Go down to the quay with the master to inspect goods, beat down prices and sign. Close a deal and the reward is handsome; botch one and you pay your own cart fare."
"tier_name" = "At the bargaining"

[activities."fishing_job"]
"name" = "Nets on the beach"
"description" = "Out before dawn. When the net comes in, watch your neighbor’s feet so the line doesn’t take anyone over the side. The catch is shared ashore, and the cuts on your hands take days of salt water to toughen."
"tier_name" = "Nets on the beach"

[activities."fishing_job_tier2"]
"name" = "Aboard the boat"
"description" = "Out before dawn. When the net comes in, watch your neighbor’s feet so the line doesn’t take anyone over the side. The catch is shared ashore, and the cuts on your hands take days of salt water to toughen."
"tier_name" = "Aboard the boat"

[activities."fishing_job_steady"]
"name" = "Reader of water"
"description" = "No more brute hauling. The old fisherman teaches you to read the water’s color, catch the turn of the tide and remember which reef hides fish. A smaller share, but the sea starts to know you."
"tier_name" = "Reader of water"

[activities."fishing_job_initiative"]
"name" = "Winter night trawl"
"description" = "Haul the big net on winter nights, hands cracked with cold and still holding on. An extra share of fish, but you buy your own oiled coat and gloves."
"tier_name" = "Winter night trawl"

[activities."shipyard_job"]
"name" = "Nail fetcher"
"description" = "You start by fetching nails and planing boards, crawling into the hull behind the master. Once he nods, you get to check a seam on your own. Hammers find fingers often."
"tier_name" = "Nail fetcher"

[activities."shipyard_job_tier2"]
"name" = "Assigned to a hull"
"description" = "You start by fetching nails and planing boards, crawling into the hull behind the master. Once he nods, you get to check a seam on your own. Hammers find fingers often."
"tier_name" = "Assigned to a hull"

[activities."shipyard_job_steady"]
"name" = "The heavy crew"
"description" = "Sawing, carrying, winching timber up the slipway: every hard job, no exceptions. Modest pay; strength that grows by the day."
"tier_name" = "The heavy crew"

[activities."shipyard_job_initiative"]
"name" = "A strake to answer for"
"description" = "The master hands you a stretch of hull, and the timber list, the schedule and the caulking all answer to you. Good pay, and if it fails inspection you buy the oakum to do it again."
"tier_name" = "A strake to answer for"

[activities."copyist_job"]
"name" = "Short deeds"
"description" = "Contracts, registers, merchants’ letters: check every name and every figure. Leave a gap for any word you can’t read and ask before you fill it. By candlelight past midnight, your eyes start to sting."
"tier_name" = "Short deeds"

[activities."copyist_job_tier2"]
"name" = "Whole books"
"description" = "Contracts, registers, merchants’ letters: check every name and every figure. Leave a gap for any word you can’t read and ask before you fill it. By candlelight past midnight, your eyes start to sting."
"tier_name" = "Whole books"

[activities."copyist_job_steady"]
"name" = "Patience at the desk"
"description" = "Take the long jobs: the same book a third time over, and not one letter allowed to wander. Not much money; a steadier temper."
"tier_name" = "Patience at the desk"

[activities."copyist_job_initiative"]
"name" = "The worm-eaten copies"
"description" = "Take the old manuscripts nobody else will touch, with wormholes, faded ink and unfamiliar scripts to look up as you go. Better money; you buy your own good paper and ink."
"tier_name" = "The worm-eaten copies"

[activities."printing_job"]
"name" = "Sorting type"
"description" = "Pick the backward letters out of the type case and set them line by line, keeping the spoiled sheet to correct the next forme. Ink on your face, and every pull on the press lever leaves you sweating."
"tier_name" = "Sorting type"

[activities."printing_job_tier2"]
"name" = "Setting a whole forme"
"description" = "Pick the backward letters out of the type case and set them line by line, keeping the spoiled sheet to correct the next forme. Ink on your face, and every pull on the press lever leaves you sweating."
"tier_name" = "Setting a whole forme"

[activities."printing_job_steady"]
"name" = "Quick fingers"
"description" = "All day at the type case, picking and setting, until your fingers know every compartment. A few coins less; faster hands every day."
"tier_name" = "Quick fingers"

[activities."printing_job_initiative"]
"name" = "Reading proofs"
"description" = "Sit down to read proofs, where no foreign word, figure or name may slip past. Better pay, and if an error you missed spoils a run, the paper is on you."
"tier_name" = "Reading proofs"

[activities."apothecary_job"]
"name" = "At the mortar"
"description" = "Weigh, label, sweep up the dregs, and listen while the master questions the sick. You may not prescribe. Mix up one ingredient and you’ll be reciting the whole cabinet again."
"tier_name" = "At the mortar"

[activities."apothecary_job_tier2"]
"name" = "Filling prescriptions"
"description" = "Weigh, label, sweep up the dregs, and listen while the master questions the sick. You may not prescribe. Mix up one ingredient and you’ll be reciting the whole cabinet again."
"tier_name" = "Filling prescriptions"

[activities."apothecary_job_steady"]
"name" = "Checking the stock"
"description" = "You check the deliveries, telling the genuine packet from the one padded with sawdust by a sniff and a pinch. Smaller earnings; a keener eye and nose."
"tier_name" = "Checking the stock"

[activities."apothecary_job_initiative"]
"name" = "House calls"
"description" = "Carry the medicine chest on the master’s rounds: many patients, long walks home in the dark. Better pay; you restock whatever you use."
"tier_name" = "House calls"

[activities."guard_job"]
"name" = "Riding with the cart"
"description" = "By day you ride out of town beside the master and a cart of goods, eyes on the brush along the road. If trouble comes, you shout for help first and leave the heroics alone. A day of it leaves blisters."
"tier_name" = "Riding with the cart"

[activities."guard_job_tier2"]
"name" = "Standing a watch"
"description" = "By day you ride out of town beside the master and a cart of goods, eyes on the brush along the road. If trouble comes, you shout for help first and leave the heroics alone. A day of it leaves blisters."
"tier_name" = "Standing a watch"

[activities."guard_job_steady"]
"name" = "Holding the post"
"description" = "Hold a warehouse door or a stretch of night road. No fighting, no dozing, just lasting till dawn. Less pay; more nerve and more patience."
"tier_name" = "Holding the post"

[activities."guard_job_initiative"]
"name" = "The long road"
"description" = "Take the long escort jobs with the master: mountain passes, ferry landings, empty beaches. Good money, and you mend your own scabbard and leather."
"tier_name" = "The long road"

[activities."interpreter_job"]
"name" = "Go-between"
"description" = "Stand between two people haggling, say back what each one means, then check the goods and the numbers. One wrong word can sink the deal. By evening your throat is raw."
"tier_name" = "Go-between"

[activities."interpreter_job_tier2"]
"name" = "At the table"
"description" = "Stand between two people haggling, say back what each one means, then check the goods and the numbers. One wrong word can sink the deal. By evening your throat is raw."
"tier_name" = "At the table"

[activities."interpreter_job_steady"]
"name" = "The word book"
"description" = "Every trade name, measure and turn of phrase you hear goes into your word book, page against page. Modest earnings; a growing hoard of words."
"tier_name" = "The word book"

[activities."interpreter_job_initiative"]
"name" = "The hard table"
"description" = "Take the table where nobody will give an inch. Make the hard words bearable and the soft ones firm enough. Good money; when your voice goes, the honey for your throat is your own expense."
"tier_name" = "The hard table"

[activities."sanctuary_job"]
"name" = "Sweeping the yard"
"description" = "Sweep the courtyard, copy names into the register, look after those who come in to pray. Every birth and every quarrel in town finds its way to you here."
"tier_name" = "Sweeping the yard"

[activities."sanctuary_job_tier2"]
"name" = "Lamp oil and the register"
"description" = "Sweep the courtyard, copy names into the register, look after those who come in to pray. Every birth and every quarrel in town finds its way to you here."
"tier_name" = "Lamp oil and the register"

[activities."sanctuary_job_steady"]
"name" = "The night vigil"
"description" = "Keep the night vigil: trim the lamps, sit in silence, wait for the first bell or the first call to prayer. Hardly any money; a quieter heart."
"tier_name" = "The night vigil"

[activities."sanctuary_job_initiative"]
"name" = "Running the feast"
"description" = "Take the messiest jobs before a feast: borrowing benches, seating guests, counting out the alms grain. Better tips, worn-out legs, and any missing candles come out of your purse."
"tier_name" = "Running the feast"

[activities."smuggling_job"]
"name" = "Sealed letters"
"description" = "Carry a sealed cargo letter to the right hands, and don’t ask what it says. The pay is good. If the watch stops and questions you, you can tell the truth, but then the errands end for good."
"tier_name" = "Sealed letters"

[activities."smuggling_job_tier2"]
"name" = "Learning the signals"
"description" = "Carry a sealed cargo letter to the right hands, and don’t ask what it says. The pay is good. If the watch stops and questions you, you can tell the truth, but then the errands end for good."
"tier_name" = "Learning the signals"

[activities."smuggling_job_steady"]
"name" = "Just run"
"description" = "Just deliver: alleys, rooftops, mudflats at low tide. Hand it over and go, and never ask what it is. A smaller cut, quicker feet, and less chance of getting caught."
"tier_name" = "Just run"

[activities."smuggling_job_initiative"]
"name" = "Night pickups"
"description" = "Go out with the shipmaster at night to meet the cargo, talking your way past watchmen and brokers. The best money, but you front the bribes, and if it goes wrong, nobody knows you."
"tier_name" = "Night pickups"

[activities."woodworking_job"]
"name" = "Planing offcuts"
"description" = "Even offcuts get planed with the grain, and after every wrong cut the master takes the piece to see where your hand pressed too hard. Sweet-smelling shavings, thickening calluses."
"tier_name" = "Planing offcuts"

[activities."woodworking_job_tier2"]
"name" = "Your first chest"
"description" = "Even offcuts get planed with the grain, and after every wrong cut the master takes the piece to see where your hand pressed too hard. Sweet-smelling shavings, thickening calluses."
"tier_name" = "Your first chest"

[activities."woodworking_job_steady"]
"name" = "The timber store"
"description" = "Look after timber and tools: which boards need drying in the shade, which plane needs sharpening, all chalked on the wall. Less than the carvers make; a workshop in good order."
"tier_name" = "The timber store"

[activities."woodworking_job_initiative"]
"name" = "Fine carving"
"description" = "Take the fine work, figureheads and lattice for cabin doors, where one slip means starting the piece over. Good money; buy your own good chisels."
"tier_name" = "Fine carving"

[activities."kitchen_job"]
"name" = "Peeling and washing"
"description" = "Remember who at each table won’t eat what, and set a portion aside for whoever comes in late. A day at the hearth leaves you soaked in sweat, and the odd burn or nick is part of the job."
"tier_name" = "Peeling and washing"

[activities."kitchen_job_tier2"]
"name" = "Minding a hearth"
"description" = "Remember who at each table won’t eat what, and set a portion aside for whoever comes in late. A day at the hearth leaves you soaked in sweat, and the odd burn or nick is part of the job."
"tier_name" = "Minding a hearth"

[activities."kitchen_job_steady"]
"name" = "All day at the fire"
"description" = "From lighting the fire before dawn to the last bowl of soup, smoke and heat and no complaining. Ordinary wages; you come out able to take anything."
"tier_name" = "All day at the fire"

[activities."kitchen_job_initiative"]
"name" = "A feast table"
"description" = "Plan a whole feast-day table for the cook: the marketing, the dishes and the order they go out are all yours. Better money, and anything bought wrong comes out of your wages."
"tier_name" = "A feast table"

[activities."weaving_job"]
"name" = "Tying threads"
"description" = "You start by tying broken threads and learn to mend so the patch holds when the cloth is pulled. The loom clacks all day, and your shoulders stiffen."
"tier_name" = "Tying threads"

[activities."weaving_job_tier2"]
"name" = "At the loom"
"description" = "You start by tying broken threads and learn to mend so the patch holds when the cloth is pulled. The loom clacks all day, and your shoulders stiffen."
"tier_name" = "At the loom"

[activities."weaving_job_steady"]
"name" = "The yarn store"
"description" = "Run the yarn store: sort skeins, match colors, note which batch took the dye evenly. Less pay; a roomful of thread that never tangles in your hands."
"tier_name" = "The yarn store"

[activities."weaving_job_initiative"]
"name" = "Patterned work"
"description" = "Take the seat at the drawloom for the hardest patterns, where one wrong pass costs half a day of unpicking. Good money; spoiled yarn is yours to pay for."
"tier_name" = "Patterned work"

[activities."practice_voyage"]
"name" = "Training voyage"
"description" = "Your mentor takes you out in a small boat: cast off, tack into the wind, round the mark, bring her back alongside. The boat is borrowed and goes back when you land. In a chop, expect to be sick over the side."

[activities."stargazing"]
"name" = "Stargazing night"
"description" = "The two of you measure the stars separately, no peeking, and compare at dawn. If the numbers disagree, you’re up another night."

[activities."night_patrol"]
"name" = "Night patrol"
"description" = "Only with the grown-ups’ leave: go round in pairs checking lamps and bolts. If you hear a sound you can’t explain, note the hour and the direction, and don’t go looking for it alone."

[activities."gathering"]
"name" = "Tracking and gathering"
"description" = "Into the woods to read tracks and gather the common herbs. If you meet an animal you don’t know, back slowly to the path. Never run. Thorns leave your legs striped red."

[activities."excursion"]
"name" = "Nearby excursion"
"description" = "Choose a place nearby: a cave, a ruined tower, a night market. The first visit rarely tells you much. Come back with the right tool or the right friend, and the puzzle changes shape."

[activities."conditioning"]
"name" = "Conditioning"
"description" = "Run the seawall and carry water uphill at your own pace, and stop when you can’t catch your breath. Next morning, the stairs are torture."

[activities."riding_practice"]
"name" = "Riding practice"
"description" = "Groom the horse and check the girth and stirrups before you mount to practice turns. Horses know a lazy rider. A fall mostly hurts your pride."

[activities."swimming_diving"]
"name" = "Swimming and diving"
"description" = "Breath-holding and diving, only in the shallows you agreed on, with a friend watching from shore. One noseful of seawater and you never forget it."

[activities."visit"]
"name" = "Visiting"
"description" = "Bring the small gift you promised and let your host tell you what the day has been about. Not tiring, though if you stay long you may end up shelling beans."

[activities."play_friends"]
"name" = "Play with friends"
"description" = "Hopscotch, knucklebones, races along the quay. Winning and losing take turns, and whoever looks silly gets laughed at by everyone, themselves included. You come home muddy."

[activities."letter_writing"]
"name" = "Letter writing"
"description" = "Write, seal it with wax, and hand it to the next trading ship going the right way. When the reply comes depends on the sailings. Some letters take half a year."

[activities."banquet"]
"name" = "A feast and conversation"
"description" = "At table, leave an opening for the friend who doesn’t say much, and help clear the dishes afterward. What tires is your face, from smiling all evening."

[activities."market_stroll"]
"name" = "Market stroll"
"description" = "Compare the prices of needles, ribbons and trinkets, and note which would suit whom. Whatever you can’t afford yet, you keep in mind for later."

[activities."festival_visit"]
"name" = "Joining a festival"
"description" = "Get your festival clothes and gifts ready the way your town does it, and go out into the crowd. You’re bound to run into classmates, each with plans of their own."

[activities."poetry_circle"]
"name" = "Poetry circle"
"description" = "Members take turns adding a line, and an unfinished one waits for whoever comes next. Before a contest, members choose their own partners, and they may not choose you."

[activities."music_circle"]
"name" = "Song and ensemble"
"description" = "Practice until everyone can hear everyone else’s beat, then decide who leads. The one who’s off key is usually the loudest."

[activities."astronomy_circle"]
"name" = "Stargazing circle"
"description" = "Take turns keeping the observation log, and save a spot for whoever arrives late. The night wind on the roof is cold, so bring something warm."

[activities."knotting_club"]
"name" = "Knotwork circle"
"description" = "Two colors of cord come together, and you agree on the finish before you start. Fingers rub red; a botched braid comes apart again, and the cord doesn’t mind."

[activities."painting_circle"]
"name" = "Drawing and lettering circle"
"description" = "One draws the lines and another lays the color, and how dark one patch should be can be argued until sundown."

[activities."fencing_circle"]
"name" = "Fencing circle"
"description" = "When a bout stops, check your partner for injuries before anyone writes down the result. There isn’t enough padding to go round, so you take turns."

[activities."debate_circle"]
"name" = "Debating circle"
"description" = "Argue over what drives the tides, whose accounts are right, how a word in an old book should be read. Bring evidence. Nobody argues whose god is truer."

[activities."embroidery_workshop"]
"name" = "Embroidery workshop"
"description" = "Choose a pattern and a cloth, and stitch something small enough to give away. Pricked fingers come with it, and crooked work gets unpicked and redone."

[activities."incense_circle"]
"name" = "Incense workshop"
"description" = "Grind the aromatics fine, weigh them out pinch by pinch and press them into small cakes. Get the proportions wrong and the whole room coughs."

[activities."tea_workshop"]
"name" = "Tea workshop"
"description" = "Roast the leaves slowly in the pan, judging the heat by nose and palm, then wrap the finished tea in small packets to give away."

[activities."wax_workshop"]
"name" = "Wax flowers and candles"
"description" = "Melt the beeswax, shape petals and dip wicks to finish wax flowers or festival candles before the feast. Too hot and it slumps, too cool and it cracks, so there’s no hurrying it."

[activities."free_roam"]
"name" = "Free time"
"description" = "Pick a spot around the academy, whether the library, the dock, the market or the roof, and go see who’s there and what they’re doing."

[activities."after_market"]
"name" = "After-school market"
"description" = "After class, ask whether a friend is free for a turn around the market and a pastry fresh from the pan. They may say no. If they say yes, it’s simply an afternoon between friends."

[activities."after_lantern"]
"name" = "After-school lanterns"
"description" = "Ask a friend out to see the lanterns at dusk, and don’t lose each other in the crush. Whether they come depends on their mood and their homework."

[activities."after_shore"]
"name" = "After-school shore"
"description" = "After school, invite a friend down to the shore to hunt shells and watch the boats come in. Your shoes always come back wet. Whether they come is up to them."

[activities."after_bookshop"]
"name" = "After-school bookshop"
"description" = "Invite a friend to the bookshop to browse; whoever finds something good first reads a bit aloud. The bookseller glares at you for reading without buying, but only glares."

[activities."after_fair"]
"name" = "After-school fair"
"description" = "Ask a friend to the fair for jugglers, a fortune slip and a stick of candy. Going together doesn’t have to mean anything special."

[activities."after_launch"]
"name" = "After-school launch"
"description" = "Word is a ship goes into the water at the yard today, so ask a friend to come watch. The lines slip, the hull slides in, and the whole shore cheers. If they’re busy, there’s always another launch."

[activities."read_book"]
"name" = "Read a book"
"description" = "Choose a book you own and can read the language of, and see it through to the end. Every book you finish goes into your reading list."

[activities."rest"]
"name" = "Rest"
"description" = "Do nothing at all: a hot meal, a long sleep, or a friend telling you some small thing about their day."

[activities."town_stay"]
"name" = "A stay in a nearby town"
"description" = "A few days in the next town: a different bed, different food, someone else’s market. It costs a little in fares, and you come back lighter."

[activities."dorm_talk"]
"name" = "Dormitory conversation"
"description" = "Whispering after lights-out about home, the teachers’ odd habits, tomorrow’s test. Somebody always falls asleep mid-sentence."

[activities."lesson_languages_lang_arabic"]
"name" = "Languages · Arabic"
"description" = "Pick a language someone in town can teach, and start with the letters and cargo lists that come in on the ships. The vocabulary is endless, until the first time a stranger understands you."

