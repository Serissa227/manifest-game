[activities."craft_embroidered_kerchief"]
"name" = "Embroider a kerchief"
"description" = "You need a plain linen handkerchief of your own and a sailmaker’s palm to drive the needle. A palm that pushes through sailcloth won’t wear out on linen."

[activities."craft_embroidered_pouch"]
"name" = "Sew a scent bag"
"description" = "Cut a plain linen handkerchief into a small bag and thread a drawstring through the mouth. The sailmaker’s palm goes back in your pocket afterward."

[activities."craft_travel_letter_case"]
"name" = "Sew a letter sleeve"
"description" = "Fold a plain linen handkerchief and sew it into a sleeve, stitches close so the paper’s corners won’t wear through. Put the sailmaker’s palm away when you’re done."

[activities."craft_copied_poem"]
"name" = "Copy out a poem"
"description" = "You need one sheet of unused scented ritual paper. Brush and ink come out of the community-school ink case, which goes home with you."

[activities."craft_poetry_scroll"]
"name" = "Roll up a round of verses"
"description" = "Several of you take turns adding lines to one sheet of unused scented paper. The ink case goes round the circle and ends up back with you."

[activities."craft_blended_incense"]
"name" = "Blend an incense cake"
"description" = "You need a piece of sandalwood, weighed out grain by grain on the small balance. The balance and its weights stay yours."

[activities."craft_braided_cord"]
"name" = "Braid a cord"
"description" = "Draw fibers from a Kongo raffia textile and braid them in two strands, pulling tight with a sailmaker’s palm to save your hand. The palm won’t wear."

[activities."craft_friendship_knot"]
"name" = "Tie a companions’ knot"
"description" = "Raffia fiber again. You tie your own half and leave the other for the person you give it to. The sailmaker’s palm goes back in the bag."

[activities."craft_carved_boat"]
"name" = "Carve a little boat"
"description" = "One piece of camphorwood, its proportions marked out with chart dividers before the knife goes in. The dividers go back in their case."
"tier_name" = "Planing offcuts"

[activities."craft_wooden_gull"]
"name" = "Carve a wooden gull"
"description" = "Carve the gull from camphorwood, matching the wings with the dividers, and keep the base wide. Dividers only measure, so they never wear down."
"tier_name" = "Planing offcuts"

[activities."craft_tea_packet"]
"name" = "Roast a packet of tea"
"description" = "You need a packet of your own tea, with each panful measured on the small balance. Wipe the balance clean and put it back in its box."

[activities."craft_sugar_figs"]
"name" = "Candy a box of figs"
"description" = "A jar of candied fruit gives you the syrup base, and the small balance weighs the sugar; a pinch too much and it cloys. The balance is put away after."
"tier_name" = "Peeling and washing"

[activities."craft_calligraphy_fan"]
"name" = "Letter a fan"
"description" = "You need a blank court apprentice’s fan, with brush and ink from the community-school ink case. The case comes back just as it went."

[activities."craft_star_sketch"]
"name" = "Draw a night of stars"
"description" = "One sheet of unused scented paper. Take each star’s height with the kamal board before you mark it. The board stays tucked in your coat and comes home with you."

[activities."craft_woven_basket"]
"name" = "Weave a little basket"
"description" = "Unravel a Kongo raffia textile and weave round on round, pressing each one firm with the sailmaker’s palm, which is no worse for it."
"tier_name" = "Tying threads"

[activities."craft_wax_flower"]
"name" = "Shape a wax flower"
"description" = "Melt down a beeswax candle of your own for the petals, weighing each one’s share on the small balance. The wax wipes right off the balance."

[activities."craft_sea_song_sheet"]
"name" = "Write down the sea songs"
"description" = "One sheet of unused scented paper, brush and ink from the community-school ink case, and a roomful of off-key voices. The ink case goes home with you."

[activities."craft_reed_bookmark"]
"name" = "Make a reed-leaf bookmark"
"description" = "Back a pressed reed leaf with a sheet of unused scented paper and write the name with a reed pen from the al-Azhar pen case. All five pens go home with you."
"tier_name" = "Short deeds"

[crafts."craft_embroidered_kerchief"]
"name" = "Embroider a kerchief"
"failure" = "You pulled the thread too tight and the cloth puckered. Unpick it and start over; the handkerchief itself is fine."
"note" = "You need a plain linen handkerchief of your own and a sailmaker’s palm to drive the needle. A palm that pushes through sailcloth won’t wear out on linen."

[crafts."craft_embroidered_pouch"]
"name" = "Sew a scent bag"
"failure" = "You turned it right side out and found the flowers on the inside. Unpick and sew again; not an inch of linen wasted."
"note" = "Cut a plain linen handkerchief into a small bag and thread a drawstring through the mouth. The sailmaker’s palm goes back in your pocket afterward."

[crafts."craft_travel_letter_case"]
"name" = "Sew a letter sleeve"
"failure" = "You measured wrong and the letter won’t go in. The stitches come out and the cloth survives. Next time, hold the letter against it first."
"note" = "Fold a plain linen handkerchief and sew it into a sleeve, stitches close so the paper’s corners won’t wear through. Put the sailmaker’s palm away when you’re done."

[crafts."craft_copied_poem"]
"name" = "Copy out a poem"
"failure" = "The ink was ground too thin; one test stroke on the edge of the inkstone told you so. The paper is untouched. Grind it again."
"note" = "You need one sheet of unused scented ritual paper. Brush and ink come out of the community-school ink case, which goes home with you."

[crafts."craft_poetry_scroll"]
"name" = "Roll up a round of verses"
"failure" = "When your turn came your mind went blank, and everyone drifted off laughing. The paper is still empty; finish another day."
"note" = "Several of you take turns adding lines to one sheet of unused scented paper. The ink case goes round the circle and ends up back with you."

[crafts."craft_blended_incense"]
"name" = "Blend an incense cake"
"failure" = "The pinch you test-burned set everyone coughing: the proportions are off. The sandalwood is untouched. Write down what you used and halve it next time."
"note" = "You need a piece of sandalwood, weighed out grain by grain on the small balance. The balance and its weights stay yours."

[crafts."craft_braided_cord"]
"name" = "Braid a cord"
"failure" = "Halfway through, the two strands snarled into a knot. Patiently you work it loose; not a fiber broken."
"note" = "Draw fibers from a Kongo raffia textile and braid them in two strands, pulling tight with a sailmaker’s palm to save your hand. The palm won’t wear."

[crafts."craft_friendship_knot"]
"name" = "Tie a companions’ knot"
"failure" = "You finished your half too tight, and the loop left for the other person is too small to take the cord. Untie it and start again; the fiber is still good."
"note" = "Raffia fiber again. You tie your own half and leave the other for the person you give it to. The sailmaker’s palm goes back in the bag."

[crafts."craft_carved_boat"]
"name" = "Carve a little boat"
"failure" = "Before the first cut you check with the dividers and find the hull you drew is wider on one side. Rub it out and draw again; the camphorwood is still whole."
"note" = "One piece of camphorwood, its proportions marked out with chart dividers before the knife goes in. The dividers go back in their case."

[crafts."craft_wooden_gull"]
"name" = "Carve a wooden gull"
"failure" = "You tried the wings on an offcut first, and they snapped as soon as they got thin. You haven’t dared touch the camphorwood. A few more days of practice."
"note" = "Carve the gull from camphorwood, matching the wings with the dividers, and keep the base wide. Dividers only measure, so they never wear down."

[crafts."craft_tea_packet"]
"name" = "Roast a packet of tea"
"failure" = "The moment the pan got hot you panicked and took the leaves off half done. Spread them out to cool and try again with steadier nerves."
"note" = "You need a packet of your own tea, with each panful measured on the small balance. Wipe the balance clean and put it back in its box."

[crafts."craft_sugar_figs"]
"name" = "Candy a box of figs"
"failure" = "The syrup boiled too long and set into one hard lump. The candied fruit in the jar is untouched; next time, low heat and patience."
"note" = "A jar of candied fruit gives you the syrup base, and the small balance weighs the sugar; a pinch too much and it cloys. The balance is put away after."

[crafts."craft_calligraphy_fan"]
"name" = "Letter a fan"
"failure" = "A dozen tries on scrap paper and that one stroke still won’t open out, so the fan stays folded."
"note" = "You need a blank court apprentice’s fan, with brush and ink from the community-school ink case. The case comes back just as it went."

[crafts."craft_star_sketch"]
"name" = "Draw a night of stars"
"failure" = "Clouds rolled in and the stars vanished halfway through. The paper goes back in the box to wait for a clear night."
"note" = "One sheet of unused scented paper. Take each star’s height with the kamal board before you mark it. The board stays tucked in your coat and comes home with you."

[crafts."craft_woven_basket"]
"name" = "Weave a little basket"
"failure" = "The bottom was woven too loose and caves in when you lift it. Pull it apart and straighten the fibers; they’ll do again."
"note" = "Unravel a Kongo raffia textile and weave round on round, pressing each one firm with the sailmaker’s palm, which is no worse for it."

[crafts."craft_wax_flower"]
"name" = "Shape a wax flower"
"failure" = "The wax was too hot and the petals slumped into a puddle. Let it cool and knead it back into a lump."
"note" = "Melt down a beeswax candle of your own for the petals, weighing each one’s share on the small balance. The wax wipes right off the balance."

[crafts."craft_sea_song_sheet"]
"name" = "Write down the sea songs"
"failure" = "Everyone sang it a different way, and nobody recognized what you wrote. The sheet is still blank; get the song agreed first."
"note" = "One sheet of unused scented paper, brush and ink from the community-school ink case, and a roomful of off-key voices. The ink case goes home with you."

[crafts."craft_reed_bookmark"]
"name" = "Make a reed-leaf bookmark"
"failure" = "The reed pen was cut too blunt and the name you wrote on the leaf blotted. Luckily you tried the leaf first; the backing paper is untouched."
"note" = "Back a pressed reed leaf with a sheet of unused scented paper and write the name with a reed pen from the al-Azhar pen case. All five pens go home with you."
