# A6：显示覆盖，仅含文字。

[festivals."festival_io_eid"]
"name" = "Eid al-Fitr"
"customs" = "When the new moon shows, drums on the quay carry the news. On Eid morning people put on starched white robes and pray on the shore, then go calling house to house, coconut rice scenting half the street; the traveler off a visiting ship is pulled through the nearest door and served the first ladle of rice."
"gift_custom" = "A sweet cake, a freshly plaited palm-leaf fan or a line of verse copied out; the cake comes wrapped in the giver’s own waist-cloth, and the cloth stays with the receiver."
"date_note" = "The first of Shawwal, the tenth Hijri month. The crescent must be seen with the eye, and under cloud one port may keep it a day or two after another. Once it shows, the quay fills that same evening, and the feast counts from that sunset."

[festivals."festival_io_sacrifice"]
"name" = "Eid al-Adha"
"customs" = "After the prayer coastal households lead a goat out and slaughter it in the yard. The rope is first put into a child’s hands, and when the goat bolts the child is hauled across the yard while the grown-ups laugh. How the meat is divided is each house’s own habit, but a family short of grain always gets a share."
"gift_custom" = "A parcel of stewed goat, or a cloth bag of dry provisions for a traveler about to set out."
"date_note" = "The tenth of Dhu al-Hijja, the day the pilgrims at Mina, outside Mecca, cast their stones and make their own sacrifice. The crescent is seen earlier in some ports than others, so the feast can shift a day or two; from the sunset before, the whetting of knives sounds from every yard."

[festivals."festival_io_mawlid"]
"name" = "Mawlid"
"customs" = "The teacher sits his pupils down before the seaside mosque, and the old night-watch fisherman blows a conch to say the lamps may be lit. Each child holds an oil lamp, and when the wind gusts the little flames sway all the way along the sand."
"gift_custom" = "A clay oil lamp pinched into the shape of a little boat, or a small packet of honeyed coconut strips."
"date_note" = "The twelfth of the third Hijri month. The conch sounds at the sunset before; the coast is often overcast, and when the crescent comes late the conch and the lamps are a day or two late."

[festivals."festival_swahili_new_year"]
"name" = "Swahili new year"
"customs" = "Every house carries last year’s hearth ash down to the sea in baskets, then strikes a new fire before dawn with flint and steel and takes the children into the water to wash the old year off. The sea is still cold, and the children shriek and run for the sand."
"gift_custom" = "A packet of parched rice and a seashell with a few pebbles in it; each pebble is a promise for this year, to be tipped out and counted on the same day next year."
"date_note" = "The old coastal calendar puts the new year in late July. Each port’s elders count in their own way, so Kilwa may have finished while Mombasa waits a few days more."

[festivals."festival_monsoon"]
"name" = "Monsoon departure observance"
"customs" = "Shipowners squat on the quay wetting a finger to test the wind and saying only one word: wait. Children bring letters and packets of provisions down to the boats and beg the helmsmen to carry them to far-off relatives. When the wind steadies, a drum sounds and every lateen sail in the harbor goes up together."
"gift_custom" = "A packet of dates and parched rice, and a knotted cord tied around the voyager’s wrist, so that you will still know each other at a glance when they come back."
"date_note" = "Ships sail only when the monsoon has settled, around mid-November. Each port’s shipowners watch their own wind, so the blessing of the sea does not fall on the same day everywhere."
