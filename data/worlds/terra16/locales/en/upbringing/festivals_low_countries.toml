# A6：显示覆盖，仅含文字。

[festivals."festival_lo_epiphany"]
"name" = "King of the bean"
"customs" = "A cake is cut and handed around, and whoever bites on the dried bean is bean king for the night. The king puts on a paper crown and may command only jokes and songs; when the cup goes up the whole table cries, “The king drinks!”"
"gift_custom" = "A honey cake cut blind, so that not even the cutter knows which slice hides the bean."
"date_note" = "Epiphany, the day of the Three Kings, stands at 6 January in the local almanacs; by the calendar here it comes on the sixteenth."

[festivals."festival_lo_valentine"]
"name" = "Saint Valentine’s day"
"customs" = "On the fourteenth of February classmates write their names on slips and draw lots to be one another’s Valentine for the year. The short notes passed to a Valentine go unsigned, and a guess about the writer need never be spoken aloud."
"gift_custom" = "A four-line poem copied on a scrap of paper, rolled up and tied with a narrow length of ribbon."
"date_note" = "The local almanacs keep 14 February, the day birds are said to choose their mates; by the calendar here it is the twenty-fourth."

[festivals."festival_lo_carnival"]
"name" = "Low Countries carnival"
"customs" = "In the days before Lent the students stage a little play of their own: borrowed false beards, coats worn inside out, the smallest in the class as king. Nobody has learned the lines, and halfway through the performers are the first to break into laughter, so that the audience is a bigger mess than the stage."
"gift_custom" = "A few flowers cut from colored paper, and a hot waffle shared at the edge of the stage when the play is over."
"date_note" = "The last days before Ash Wednesday, moving each year with Easter; after them, meat, eggs and milk are given up."

[festivals."festival_lo_may"]
"name" = "May Day"
"customs" = "Early on the first of May friends go into the woods together to gather flowering branches wet with dew. Wash your face in May dew, they say, and you will grow lovely; the wettest sprigs are carried home and set in each friend’s window."
"gift_custom" = "A small bunch of wildflowers, with a pressed petal from last year slipped into a note."
"date_note" = "The dew is gathered on 1 May by the local almanac, and on the eleventh by the calendar here."

[festivals."festival_lo_john"]
"name" = "Northern Saint John’s Eve"
"customs" = "On the eve of midsummer a bonfire turns the river orange, and the archers’ guild sets up its wooden bird on a pole for the shooting. The young people sit along the bank and sing, and at the line that matters most a voice stops and leaves the rest to the firelight."
"gift_custom" = "A wreath woven from riverside flowers, hung on a branch and kept for whoever comes late."
"date_note" = "The archers’ guild fixes its shooting for the eve of the Baptist’s feast, the night of 23 June by the almanac; the calendar here has it on 3 July."

[festivals."festival_lo_procession"]
"name" = "Antwerp Marian procession"
"customs" = "The painters’ workshops and the neighbors race to finish banners, and the smell of paint drifts half down the street. Girls crowd at one window pointing out the marchers below—those are the sawyers’ guild, those the fishmongers."
"gift_custom" = "A small hand-painted picture, the Virgin’s blue robe done with the most care."
"date_note" = "A few days after the feast of the Assumption. Which guild marches first and which parish follows is argued over for weeks before the order is settled."

[festivals."festival_lo_luke"]
"name" = "Saint Luke’s feast"
"customs" = "The painters’ guild hangs its finest work at the guildhall door. The apprentices glance past the masterpieces to the sketches they are hiding behind their backs, and quietly turn the spoiled ones face down."
"gift_custom" = "A small wooden panel with a test of color on it and the name of the pigment on the back, or a sketch left half finished."
"date_note" = "The painters’ guild keeps its patron saint on 18 October by the almanac; the calendar here counts the twenty-eighth."

[festivals."festival_lo_martin"]
"name" = "Northern Saint Martin’s feast"
"customs" = "The last of the autumn fruit is shared out by lamplight. Children go from door to door with lanterns singing for Saint Martin, begging apples and nuts, and are paid even when they are flat."
"gift_custom" = "A handful of hazelnuts, a piece of gingerbread or a glove with its thumb mended."
"date_note" = "Saint Martin’s Day sits on 11 November in the almanac, when the new wine is broached and the winter slaughter begins; converted to the calendar here, it is the twenty-first."

[festivals."festival_lo_nicholas"]
"name" = "Saint Nicholas’s feast"
"customs" = "On Saint Nicholas’s Eve the children put their shoes by the hearth with a handful of hay for the saint’s horse. Someone taps at the window and says he has only come to ask the way; once the children are asleep, there is gingerbread in the shoes."
"gift_custom" = "A carved boat no bigger than a thumb, or a wax flower, slipped into a child’s shoe."
"date_note" = "The almanac puts the saint’s day on 6 December, with the gifts delivered the night before; by the calendar here the shoes go out on the evening of the fifteenth and the feast is the sixteenth."

[festivals."festival_lo_rhetoric"]
"name" = "Rhetoric contest day"
"customs" = "The schoolgirls hold a verse contest in their own small courtyard, drawing themes from slips of paper, and whoever draws the love refrain blushes first. The great contest between the towns’ chambers of rhetoric comes around only once in many years, and the girls mostly cannot get in, so this small courtyard is their whole stage."
"gift_custom" = "Your proudest refrain copied onto a narrow slip, traded for the other’s and kept."
"date_note" = "Each chamber chooses its own day, usually in summer, and sends around the theme a few weeks ahead; one who sends it late is laughed at."
