# A6：显示覆盖，仅含文字。

[festivals."festival_ma_new_year"]
"name" = "Maya New Year"
"customs" = "On the first day of the year every house replaces its old pots, hearthstones and brooms and carries the old ones outside the village to throw away. Before sunset debts of maize and borrowed fishing nets are settled face to face and noted on bark paper, so the year can begin clean."
"gift_custom" = "A handful of cacao beans in a newly woven basket: the basket is this year’s, and so are the beans."
"date_note" = "The Haab turns once in 365 days and has no leap day, while the Spaniards’ year gains one every four years, so against the dates on the calendar here it falls a day earlier every four years: in 1556 the new year is on 22 July."

[festivals."festival_ma_wayeb"]
"name" = "The five Wayeb days"
"customs" = "The five nameless days are unlucky and no one sets out on a journey. The men sit before the house mending nets, the women keep close to the old people and children; no one washes their hair or takes up a knife, and even loud voices are lowered, for fear of disturbing what ought not to be disturbed."
"gift_custom" = "A small jar of honey and a ball of twine for mending nets."
"date_note" = "These five days close the Haab year and slip earlier along with the new year; against the dates on the calendar here, in 1556 they begin on 17 July."

[festivals."festival_ma_ixchel"]
"name" = "Ix Chel pilgrimage season"
"customs" = "On the beach at Cozumel the canoes come in one after another, and women from far away step ashore with a hand to the small of the back, carrying their prayers for healing and safe keeping. The island children run down to bring them jars of clean water to wash their feet."
"gift_custom" = "A small bundle of herbs for the sick, or a gourd filled with clean water."
"date_note" = "Each village’s priests announce from the Haab when the pilgrimage season begins. Women bound for Cozumel set out together by canoe on the day agreed."

[festivals."festival_ma_cacao"]
"name" = "Cacao observance in Muan"
"customs" = "The grove owners lay out the year’s first beans in the shade and invite the neighbors to taste; the old people say the day belongs to Ek Chuah, god of merchants and cacao. Apprentices sit at the edge of the mat sorting: this one has soured, that one is ripe, a mark on the bark paper for each bean they pick, and a note of who brought honey."
"gift_custom" = "A few of the best beans wrapped in bark paper, with a small gourd cup for whipping the drink to a froth."
"date_note" = "The growers agree among themselves which day in the month of Muan to honor the cacao groves, and not every grove keeps it on the same day."

[festivals."festival_ma_bees"]
"name" = "Bee-keepers’ observance"
"customs" = "In the yard the keepers repair their hives, which are hollowed logs with both ends daubed with clay and a single small hole left. Companions help carry the empty jars; before anyone lays a hand on them, the keeper explains what must not be touched or said: the queen’s cells, and any lie told beside the hive."
"gift_custom" = "A jar of new honey sealed with wax and stamped with the keeper’s own mark."
"date_note" = "Bee-keepers begin preparing a month ahead, and the feast falls in the Haab month of Tzec. Each village keeps it on the day its own priest sets."

[festivals."festival_mexica_flowers"]
"name" = "Mexica flower observance"
"customs" = "In the old days this day meant rows of flowers, drums and singing all night in the plaza. Now the plaza belongs to the Spanish friars, and a few old households shut their doors, set the flowers by the hearth and sing under their breath; the children lie at the crack of the door listening, learning one line at a time."
"gift_custom" = "A bunch of marigolds, a shell painted with colored patterns, or an answering song sung to the receiver."
"date_note" = "The flower feast comes in the rainy season, before the maize ripens. Each household picks its day by the season the elders remember, so not all keep it on the same day."
