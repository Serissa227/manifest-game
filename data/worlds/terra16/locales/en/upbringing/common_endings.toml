# A6：显示覆盖，仅含文字。

[endings."ending_far_voyager"]
"title" = "The young voyager"
"text" = "Nobody asks for a perfect score at the pier. When the sail first fills, what you learned and what you forgot weigh the same, and all that is left is the way the bow points. Wherever it goes, you learn there."

[endings."ending_blank_chart"]
"title" = "The blank on the chart"
"text" = "The chart still has a few places with no name on it. Your satchel is thick with sketches: a tide line, a headland, a lopsided tree. You have learned to get the ground at your feet right before you ask what lies far away."

[endings."ending_abacus_scales"]
"title" = "Abacus and scales"
"text" = "The figures in the ledger finally match the goods in the warehouse. People will trust you with an important business letter because every sum through your hands is written down, and you have never fudged a penny."

[endings."ending_academy_pride"]
"title" = "The academy’s pride"
"text" = "Your teacher’s recommendation never uses the word “gifted”. It describes you coming back, again and again, to correct your work. On the day you leave, a classmate slips a half-read book into your trunk and says to send it back once you’ve finished."

[endings."ending_harbor_favorite"]
"title" = "A familiar face in the harbor"
"text" = "What the people seeing you off remember are small things: a bowl of soup set aside, a night watch kept for someone else. The wind scatters their goodbyes, but your name stays on the lips of everyone who knows you."

[endings."ending_unknown_poet"]
"title" = "The unknown poet"
"text" = "The poems never won a crowded hall’s applause, but their corners have gone soft from handling. Someone read them when no one was watching, and left a blank line on the last page for your next letter."

[endings."ending_sword_oath"]
"title" = "Sword and oath"
"text" = "You have learned where to stop a blade, and not to give your word lightly. When you sheathe the sword for the last time, you can count the promises you made far more easily than the bouts you won."

[endings."ending_nightwalker"]
"title" = "The nightwalker"
"text" = "A lamp never lights the whole road, but some of the sounds in the dark are no longer strangers. The accounts you cannot explain you keep on a page of their own, neither struck out nor fully believed, until the day you can check them."

[endings."ending_grey_trader"]
"title" = "The trader in the margins"
"text" = "In the ledger margins sit a few entries with no origin written beside them, only a small circle. You know now that leaving out one sentence can buy a smooth road, and that someone will come to collect on it sooner or later."

[endings."ending_healing_hands"]
"title" = "Healing hands"
"text" = "You know the names of the herbs by heart, but the moment you will never forget is the one when your teacher said stop. The packets of medicine you carry away are small, and each one is labeled with where its herbs were gathered."

[endings."ending_shipyard_child"]
"title" = "A child of the shipyard"
"text" = "The mortises in old timber taught you patience long before any book did. On launch day an old shipwright runs a thumb along a seam in the planking and says that this one is your work."

[endings."ending_star_apprentice"]
"title" = "Apprentice of the stars"
"text" = "Your observing book holds clear nights and pages left empty by cloud. You have come to see that writing down “saw nothing” is an honest entry too."

[endings."ending_society_novice"]
"title" = "A society’s new member"
"text" = "The people inside promised you no secret knowledge, only a small thing to look after. At the first meeting you arrived a quarter of an hour early, and began learning to live up to the name."

[endings."ending_failed_scholar"]
"title" = "The unsuccessful examinee"
"text" = "The red circles on your exam paper have not even faded and the day of sailing is here. You did not get the title, and you lost some face, but you picked up your bundle and boarded anyway, the practice sheets from the retake pressed at the very bottom."

[endings."ending_dreamer"]
"title" = "The dreamer"
"text" = "Whenever someone asks what you will be, your answer is a little different. A few blank sheets lie at the bottom of your bag, enough to write down each new plan on the road."

[endings."ending_hearty_eater"]
"title" = "A hearty appetite"
"text" = "The farewell sweets are gone in no time, and your purse is nearly as empty. The cook wraps an extra ration and presses it on you, with a warning to keep it for the ship this time and not finish it on the way."

[endings."ending_two_promises"]
"title" = "A promise between two"
"text" = "By the end of the goodbyes only one thing is left to say: see you again. The two of you each pocket a small token, and what comes next is left for the day you truly meet."

[endings."ending_many_friends"]
"title" = "Friends in many places"
"text" = "You have a pouch full of addresses in half a dozen different hands, some neat, some scrawled, one on a pastry wrapper. Each name belongs to someone with a life of their own, so the letters ahead will have to be answered in turn, honestly."

[endings."ending_solitary"]
"title" = "The solitary traveler"
"text" = "Nobody comes to see you off with a fuss. You board alone, spread your blanket, and leave a little room beside your berth for the companions you have yet to meet. The roads you learned to walk lie behind you all the same."

[endings."ending_copyist"]
"title" = "The copyist"
"text" = "The margins are crowded with questions, and the copying stopped being about schoolwork long ago. The heaviest thing in your luggage is paper, the kind that is still waiting for someone to talk it over with."
