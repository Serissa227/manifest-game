# A6：显示覆盖，仅含文字。

[festivals."festival_kr_new_year"]
"name" = "New Year"
"customs" = "At dawn you put on new clothes and make the New Year bow, and the elders answer, “Eat more rice this year and cause less trouble.” In the afternoon classmates throw the yut sticks around the board, and the loser is sent to fetch the year’s first bucket from the well, cracking the ice with a dipper if it has frozen over."
"gift_custom" = "A towel with its edges neatly hemmed, or a bowl of hot rice-cake soup carried to an elder."
"date_note" = "New Year’s Day follows the calendar sent from the Ming court. In Joseon the Office of Astronomy works the figures again and prints almanacs for every province."

[festivals."festival_kr_bridge"]
"name" = "First full moon and bridge walking"
"customs" = "At first light you crack chestnuts and walnuts between your teeth, so the year’s boils are crushed before they ever start. When the moon rises everyone crosses the bridge as many times as their age, so that their legs stay sound all year; the old ones puff, and the children want to slip away after three crossings."
"gift_custom" = "A packet of shelled chestnuts and walnuts, shared out as you walk the bridge."
"date_note" = "The fifteenth of the first month, the first full moon of the year. Before dark everyone scrambles up high to greet it, for whoever sees the moon first will have luck all year."

[festivals."festival_kr_dano"]
"name" = "Dano swings"
"customs" = "Girls wash their hair in water boiled with sweet flag and swing beneath the big trees to see who flies highest, skirts flaring, while the boys below pretend to study the sky. On the riverbank the young men wrestle, and the winner leads home an ox."
"gift_custom" = "A little jar of sweet-flag hair rinse, or a sachet stitched with mugwort leaves."
"date_note" = "The fifth day of the fifth month. The rice has just been planted out, the fields need no work, and there are a few days to rest."

[festivals."festival_kr_harvest"]
"name" = "Chuseok"
"customs" = "Rice cakes of the new grain are steamed on beds of pine needles, and lifting the lid fills the yard with the smell of pine. By day families climb the hill to clear the weeds from their ancestors’ graves, and at night the girls join hands and circle singing under the moon until the dew has soaked their hems."
"gift_custom" = "A few rice cakes knotted into the corner of a cloth for the family who tends the grave next to yours up the hill; the two plots touch, so the weeding is done together."
"date_note" = "The fifteenth of the eighth month. The new grain has just been threshed and the moon is at its fullest; the farmers say Heaven has tipped them well."

[festivals."festival_kr_dragon"]
"name" = "Ryukyuan dragon boats"
"customs" = "In Naha harbor several dragon boats lie side by side on the water; a gun fires, the paddlers dig in together and the drums in the bows beat faster and faster. The embankment is packed with people praying for a year of safe voyages and full holds, and the losing boat will be teased for the whole year."
"gift_custom" = "A strip of red cloth wound around the grip of a paddler’s paddle to keep the stroke steady."
"date_note" = "The fourth day of the fifth month, one day before the Ming Dragon Boat Festival, and Naha’s own day."

[festivals."festival_kr_priestess"]
"name" = "Noro observance"
"customs" = "The noro, crowned with grass and dressed in white, offer new rice ears and sacred wine in the utaki grove. Men must wait outside the sacred ground and may not so much as peer in; afterward the whole village shares the food beyond the trees, and even the dogs get a bone."
"gift_custom" = "A sheaf of rice ears, or a rice cake that has stood before the gods, shared out to the village when the rite is over."
"date_note" = "After the rice harvest in the sixth month the noro watch the sky and choose a lucky day to give thanks at the utaki; the villagers wait for word from her."
