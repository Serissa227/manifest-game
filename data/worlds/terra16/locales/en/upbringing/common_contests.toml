[poem_texts."contest_waka:theme"]
"text" = "Love, by way of a boat: a ship that’s late, and someone on the shore"

[poem_texts."contest_waka:hint:0"]
"text" = "Five, seven, five, seven, seven: count the kana, not the gloss. Shift the scene at line three and close on a promise."

[poem_texts."contest_waka:line:0"]
"text" = "First line, the sky: ＿"

[poem_texts."contest_waka:line:0:option:0"]
"text" = "spring wind (はるのかぜ)"

[poem_texts."contest_waka:line:0:option:1"]
"text" = "the color of blossoms (はなのいろ)"

[poem_texts."contest_waka:line:0:option:2"]
"text" = "the haze rises (かすみたつ)"

[poem_texts."contest_waka:line:0:option:3"]
"text" = "birdsong (とりのこえ)"

[poem_texts."contest_waka:line:0:option:4"]
"text" = "the spring sea (はるのうみ)"

[poem_texts."contest_waka:line:0:option:5"]
"text" = "young grass (わかいくさ)"

[poem_texts."contest_waka:line:0:option:6"]
"text" = "the sound of rain (あめのおと)"

[poem_texts."contest_waka:line:0:option:7"]
"text" = "the mountain’s shadow (やまのかげ)"

[poem_texts."contest_waka:line:0:option:8"]
"text" = "a snowy morning (ゆきのあさ)"

[poem_texts."contest_waka:line:0:option:9"]
"text" = "moonlight (つきあかり)"

[poem_texts."contest_waka:line:1"]
"text" = "Second, the waiting: ＿"

[poem_texts."contest_waka:line:1:option:0"]
"text" = "someone waiting for a boat (ふねをまつひと)"

[poem_texts."contest_waka:line:1:option:1"]
"text" = "a voice asking the waves (なみにとうこえ)"

[poem_texts."contest_waka:line:1:option:2"]
"text" = "a light left on the shore (きしにのこるひ)"

[poem_texts."contest_waka:line:1:option:3"]
"text" = "a night spent listening to the wind (かぜをきくよる)"

[poem_texts."contest_waka:line:1:option:4"]
"text" = "rain falling on a sleeve (そでにふるあめ)"

[poem_texts."contest_waka:line:1:option:5"]
"text" = "birds flying home (かえりゆくとり)"

[poem_texts."contest_waka:line:1:option:6"]
"text" = "you, standing at the window (まどにたつきみ)"

[poem_texts."contest_waka:line:1:option:7"]
"text" = "a garden waiting for autumn (あきをまつにわ)"

[poem_texts."contest_waka:line:1:option:8"]
"text" = "the day of crossing the bridge (はしをわたるひ)"

[poem_texts."contest_waka:line:1:option:9"]
"text" = "counting the stars (ほしをかぞえて)"

[poem_texts."contest_waka:line:2"]
"text" = "Third, the turn: ＿"

[poem_texts."contest_waka:line:2:option:0"]
"text" = "the autumn moon (あきのつき)"

[poem_texts."contest_waka:line:2:option:1"]
"text" = "on the red maple leaves (もみじばに)"

[poem_texts."contest_waka:line:2:option:2"]
"text" = "chrysanthemums (きくのはな)"

[poem_texts."contest_waka:line:2:option:3"]
"text" = "treading fallen leaves (おちばふむ)"

[poem_texts."contest_waka:line:2:option:4"]
"text" = "river mist (かわのきり)"

[poem_texts."contest_waka:line:2:option:5"]
"text" = "the shore pines (はまのまつ)"

[poem_texts."contest_waka:line:2:option:6"]
"text" = "the road of the tide (しおのみち)"

[poem_texts."contest_waka:line:2:option:7"]
"text" = "as many as the stars (ほしのかず)"

[poem_texts."contest_waka:line:2:option:8"]
"text" = "a boat’s wake (ふねのあと)"

[poem_texts."contest_waka:line:2:option:9"]
"text" = "the winter sea (ふゆのうみ)"

[poem_texts."contest_waka:line:3"]
"text" = "Fourth, the heart: ＿"

[poem_texts."contest_waka:line:3:option:0"]
"text" = "a window waiting for snow (ゆきをまつまど)"

[poem_texts."contest_waka:line:3:option:1"]
"text" = "a lane waiting for a friend (ともをまつみち)"

[poem_texts."contest_waka:line:3:option:2"]
"text" = "leaving only a voice behind (こえをのこして)"

[poem_texts."contest_waka:line:3:option:3"]
"text" = "someone watching the moon (つきをみるひと)"

[poem_texts."contest_waka:line:3:option:4"]
"text" = "if I set it down on paper (かみにつづれば)"

[poem_texts."contest_waka:line:3:option:5"]
"text" = "the boat hasn’t come yet (ふねはまだこぬ)"

[poem_texts."contest_waka:line:3:option:6"]
"text" = "reading your letter (きみのふみよむ)"

[poem_texts."contest_waka:line:3:option:7"]
"text" = "a light mirrored in the water (みずにうつるひ)"

[poem_texts."contest_waka:line:3:option:8"]
"text" = "even when the night is past (よるをこえても)"

[poem_texts."contest_waka:line:3:option:9"]
"text" = "sharing a single dream (ゆめをわけあう)"

[poem_texts."contest_waka:line:4"]
"text" = "Last, a promise: ＿"

[poem_texts."contest_waka:line:4:option:0"]
"text" = "let’s wait for tomorrow (あしたをまとう)"

[poem_texts."contest_waka:line:4:option:1"]
"text" = "we will meet here again (ここでまたあう)"

[poem_texts."contest_waka:line:4:option:2"]
"text" = "let the wind carry it (かぜにたくそう)"

[poem_texts."contest_waka:line:4:option:3"]
"text" = "let’s go home together (ともにかえろう)"

[poem_texts."contest_waka:line:4:option:4"]
"text" = "counting the waves (なみをかぞえる)"

[poem_texts."contest_waka:line:4:option:5"]
"text" = "looking up at the sky (そらをみあげる)"

[poem_texts."contest_waka:line:4:option:6"]
"text" = "I’ll fold the letter (ふみをたたもう)"

[poem_texts."contest_waka:line:4:option:7"]
"text" = "I’ll hand you the flowers (はなをわたそう)"

[poem_texts."contest_waka:line:4:option:8"]
"text" = "asking the stars (ほしにたずねる)"

[poem_texts."contest_waka:line:4:option:9"]
"text" = "remembering this sea (うみをおぼえる)"

[poem_texts."contest_lushi:theme"]
"text" = "Seeing a friend off to sea, a couplet for each season"

[poem_texts."contest_lushi:hint:0"]
"text" = "One couplet per season: spring, summer, autumn, winter. The rhymes on the even lines (zhong, kong, tong, feng) are written for you, all in the Dong rhyme."

