[identify_texts."contest_tea:sample:sample_tea_0:clue:0"]
"text" = "Pale yellow in the cup; the first sip is green and fresh, like a tea garden after rain."

[identify_texts."contest_tea:sample:sample_tea_1:clue:0"]
"text" = "Amber-dark in the cup, with a roasted smell that goes straight up the nose and a sweetness that comes slowly after."

[identify_texts."contest_tea:sample:sample_tea_2:clue:0"]
"text" = "The aroma is gone almost as soon as the water hits it, and the paper wrapper bears a ring of damp."

[identify_texts."contest_tea:answer:answer_tea_light"]
