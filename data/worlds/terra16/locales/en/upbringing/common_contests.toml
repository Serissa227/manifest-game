[identify_texts."contest_pearls:sample:sample_pearls_0:clue:0"]
"text" = "A soft, moonlike luster; rub it gently against a tooth and it feels faintly gritty."

[identify_texts."contest_pearls:sample:sample_pearls_1:clue:0"]
"text" = "A grayish lump, oddly light. Touch it with a hot needle and a thread of smoke rises, smelling of the sea and warm wood."

[identify_texts."contest_pearls:sample:sample_pearls_2:clue:0"]
"text" = "Bright and perfectly even, slick against the tooth, with a melted rim around the drill hole."

[identify_texts."contest_pearls:answer:answer_pearls_pearl"]
