[debate_texts."contest_scholastic:topic"]
"text" = "Two pilots put the same shoal twenty leagues apart. Whose goes on the chart?"

[debate_texts."contest_scholastic:round:0"]
"text" = "The old pilot has run the Indies route for thirty years without a slip. Naturally we trust him."

[debate_texts."contest_scholastic:round:1"]
"text" = "And the young one put an entire island in the wrong place last year."

[debate_texts."contest_scholastic:round:2"]
"text" = "The old pilot drew that shoal in his own log, down to the color of the water."

[debate_texts."contest_scholastic:card:card_scholastic_0"]
"text" = "Open the old pilot’s log: four days running, he never once took the sun."

[debate_texts."contest_scholastic:card:card_scholastic_1"]
"text" = "Point to another reef he drew, one that later ships sailed straight across."

[debate_texts."contest_scholastic:card:card_scholastic_2"]
"text" = "One mistake proves one mistake. Judge this reading by how this reading was taken."

[debate_texts."contest_scholastic:card:card_scholastic_3"]
"text" = "Ask each pilot for the day and hour of his latitude sighting."

[debate_texts."contest_scholastic:card:card_scholastic_4"]
"text" = "Name a pilot just as seasoned who ran just as hard aground."

[debate_texts."contest_scholastic:card:card_scholastic_5"]
"text" = "Settle the rule first: positions come from measurement, not from seniority."

[debate_texts."contest_shexue:topic"]
"text" = "A ship is three months overdue. Write her off, or keep waiting?"

[debate_texts."contest_shexue:round:0"]
"text" = "The monsoon’s come and gone and she’s not back. Nine times in ten that means she sank. Book the loss."

[debate_texts."contest_shexue:round:1"]
"text" = "Last year the Fuxing was three months late too, and she never came back—crew, cargo, nothing."

[debate_texts."contest_shexue:round:2"]
"text" = "The owner saw it with his own eyes: she left port riding too low, packed to the gunwales."

[debate_texts."contest_shexue:card:card_shexue_0"]
"text" = "Produce the word of a captain from the same fleet: he saw her at Luzon."

[debate_texts."contest_shexue:card:card_shexue_1"]
"text" = "Name a ship loaded just as heavy that came home safe."

[debate_texts."contest_shexue:card:card_shexue_2"]
"text" = "Sort out the routes first: Siam and Luzon sail on different winds and keep different calendars."

[debate_texts."contest_shexue:card:card_shexue_3"]
"text" = "Go through the trading house’s ship book and see when the rest of her fleet came in."

[debate_texts."contest_shexue:card:card_shexue_4"]
"text" = "Name a ship that ran half a year late and still made it home."

[debate_texts."contest_shexue:card:card_shexue_5"]
"text" = "A loss needs proof before it goes in the books. Without proof, she is only “not yet back.”"

[debate_texts."contest_star_question:topic"]
"text" = "Two nights, two Pole Star readings a finger apart. A wrong star, or a ship that moved?"

[debate_texts."contest_star_question:round:0"]
"text" = "The Pole Star doesn’t move. If your two readings differ, you picked the wrong star."

[debate_texts."contest_star_question:round:1"]
"text" = "Just last season an apprentice took one of the Calves for the Pole Star and was off by two whole fingers."

[debate_texts."contest_star_question:round:2"]
"text" = "I watched you take it. On the second night you held the board crooked."

[debate_texts."contest_star_question:card:card_star_question_0"]
"text" = "Open the log: between the two nights, the ship ran north before a fair wind for a full day."

[debate_texts."contest_star_question:card:card_star_question_1"]
"text" = "Cite the old pilot’s reading from that same night: within half a finger of mine."

[debate_texts."contest_star_question:card:card_star_question_2"]
"text" = "The same star climbs as you sail north. That extra finger is exactly the distance the ship has run."

[debate_texts."contest_star_question:card:card_star_question_3"]
"text" = "Measure again in front of everyone and let them all see which star it is."

[debate_texts."contest_star_question:card:card_star_question_4"]
"text" = "When the Calves were mistaken last time, the error was two fingers. A wrong star doesn’t miss by only one."

[debate_texts."contest_star_question:card:card_star_question_5"]
"text" = "Agree on this first: the Pole Star stands still only for someone standing still. Move the ship, and its height moves too."

[debate_texts."contest_madrasa:topic"]
"text" = "Two witnesses disagree on the price. Does the sale still stand?"

[debate_texts."contest_madrasa:round:0"]
"text" = "The witnesses name two different prices, so both of them are lying."

[debate_texts."contest_madrasa:round:1"]
"text" = "Just last month in the market, two witnesses rehearsed their story beforehand and matched word for word."

[debate_texts."contest_madrasa:round:2"]
"text" = "I heard the seller say it myself: he was paid only half."

[debate_texts."contest_madrasa:card:card_madrasa_0"]
"text" = "Question the witnesses separately: who else was there, and how was the money counted?"

[debate_texts."contest_madrasa:card:card_madrasa_1"]
"text" = "Bring up what the seller told others elsewhere: that he’d been paid in full."

[debate_texts."contest_madrasa:card:card_madrasa_2"]
"text" = "Small differences around a shared core: that is how real witnesses sound."

[debate_texts."contest_madrasa:card:card_madrasa_3"]
"text" = "Bring out the day’s accounts and check the scale, the purse and the change, one by one."

[debate_texts."contest_madrasa:card:card_madrasa_4"]
"text" = "Cite the old case where word-perfect testimony turned out to be memorized."

[debate_texts."contest_madrasa:card:card_madrasa_5"]
"text" = "First separate two things: the price agreed and the money paid can honestly be different numbers."

[race_texts."contest_ice_race:leg:0"]
"text" = "At the horn a dozen of you scramble onto the lake ice, straw rope wound round your shoes, loose snow crunching underfoot."

[race_texts."contest_ice_race:leg:0:option:race_ice_race_0_0"]
"text" = "Short steps, stay behind the pack"

[race_texts."contest_ice_race:leg:0:option:race_ice_race_0_1"]
"text" = "Cut straight across the black ice in the middle"

[race_texts."contest_ice_race:leg:0:option:race_ice_race_0_2"]
"text" = "Run the snowy margin along the shore"

[race_texts."contest_ice_race:leg:1"]
"text" = "Rounding the reed bed, someone ahead goes down, and the ice gives a sharp crack."

[race_texts."contest_ice_race:leg:1:option:race_ice_race_1_0"]
"text" = "Stop and listen for where the crack came from"

[race_texts."contest_ice_race:leg:1:option:race_ice_race_1_1"]
"text" = "Dart past the fallen runner while they’re still down"

[race_texts."contest_ice_race:leg:1:option:race_ice_race_1_2"]
"text" = "Swing wide and step along the reed roots"

[race_texts."contest_ice_race:leg:2"]
"text" = "The finish is a bonfire on the shore, and the last stretch of ice is wet and slick."

[race_texts."contest_ice_race:leg:2:option:race_ice_race_2_0"]
"text" = "Slow down and shuffle in sideways"

[race_texts."contest_ice_race:leg:2:option:race_ice_race_2_1"]
"text" = "Throw out your arms and slide all the way to the fire"

[race_texts."contest_ice_race:leg:2:option:race_ice_race_2_2"]
"text" = "Run in the footprints of the one ahead"

[race_texts."contest_venetian_race:leg:0"]
"text" = "The signal gun goes off and the skiffs burst out between the starting posts; every window along the canal is crowded with heads."

[race_texts."contest_venetian_race:leg:0:option:race_venetian_race_0_0"]
"text" = "Plant your feet and keep the strokes even"

[race_texts."contest_venetian_race:leg:0:option:race_venetian_race_0_1"]
"text" = "Cut into midstream ahead of the others"

[race_texts."contest_venetian_race:leg:0:option:race_venetian_race_0_2"]
"text" = "Hug the palace steps, where the water lies flat"

[race_texts."contest_venetian_race:leg:1"]
"text" = "Ahead is the turning post, a single pole in mid-canal that every boat must round before heading back."

[race_texts."contest_venetian_race:leg:1:option:race_venetian_race_1_0"]
"text" = "Ease off early and take the turn wide"

[race_texts."contest_venetian_race:leg:1:option:race_venetian_race_1_1"]
"text" = "Whip round tight against the pole, oars nearly clashing"

[race_texts."contest_venetian_race:leg:1:option:race_venetian_race_1_2"]
"text" = "Shadow the leader and wait for the inside lane"

[race_texts."contest_venetian_race:leg:2"]
"text" = "Home against the tide, with the prize pennants at the finish already in sight."

[race_texts."contest_venetian_race:leg:2:option:race_venetian_race_2_0"]
"text" = "Hold your place and don’t race anyone"

[race_texts."contest_venetian_race:leg:2:option:race_venetian_race_2_1"]
"text" = "Shout the stroke and empty yourself on the last twenty"

[race_texts."contest_venetian_race:leg:2:option:race_venetian_race_2_2"]
"text" = "Ride the wake of a passing barge"

[race_texts."contest_dragon_boat:leg:0"]
"text" = "The gong cracks, the dragon’s head dips, and twenty paddles hit the water at once."

[race_texts."contest_dragon_boat:leg:0:option:race_dragon_boat_0_0"]
"text" = "Follow the drum, not a stroke early"

[race_texts."contest_dragon_boat:leg:0:option:race_dragon_boat_0_1"]
"text" = "Call for a faster drum and bury them at the start"

[race_texts."contest_dragon_boat:leg:0:option:race_dragon_boat_0_2"]
"text" = "Angle the bow a little out of their wash"

[race_texts."contest_dragon_boat:leg:1"]
"text" = "Midstream the current runs hard, and the next boat’s dragon tail swings toward you."

[race_texts."contest_dragon_boat:leg:1:option:race_dragon_boat_1_0"]
"text" = "Hold the steering oar and let it pass"

[race_texts."contest_dragon_boat:leg:1:option:race_dragon_boat_1_1"]
"text" = "Shoulder through and see who flinches first"

[race_texts."contest_dragon_boat:leg:1:option:race_dragon_boat_1_2"]
"text" = "Give up half a length downstream, then chase"

[race_texts."contest_dragon_boat:leg:2"]
"text" = "The finish pole flies a red sash, and the winning boat must send someone leaning out from the bow to snatch it."

[race_texts."contest_dragon_boat:leg:2:option:race_dragon_boat_2_0"]
"text" = "Send the steadiest hand forward; everyone else keeps her level"

[race_texts."contest_dragon_boat:leg:2:option:race_dragon_boat_2_1"]
"text" = "Lunge for the sash yourself"

[race_texts."contest_dragon_boat:leg:2:option:race_dragon_boat_2_2"]
"text" = "Roar together through the last ten strokes"

[race_texts."contest_dhow_race:leg:0"]
"text" = "The land breeze carries the little boats out of the bay together, gunwale to gunwale."

[race_texts."contest_dhow_race:leg:0:option:race_dhow_race_0_0"]
"text" = "Half sail, and read the wind first"

[race_texts."contest_dhow_race:leg:0:option:race_dhow_race_0_1"]
"text" = "Full sail to steal the weather side"

[race_texts."contest_dhow_race:leg:0:option:race_dhow_race_0_2"]
"text" = "Run along the reef, where the wind holds steadier"

[race_texts."contest_dhow_race:leg:1"]
"text" = "Time to come about. The long yard has to swing round the mast to the other side; be slow and she falls broadside."

[race_texts."contest_dhow_race:leg:1:option:race_dhow_race_1_0"]
"text" = "Spill the wind first and change sides once she’s steady"

[race_texts."contest_dhow_race:leg:1:option:race_dhow_race_1_1"]
"text" = "Keep the sail full and heave the yard across on one shout"

[race_texts."contest_dhow_race:leg:1:option:race_dhow_race_1_2"]
"text" = "Run on a little and turn where there’s more water"

[race_texts."contest_dhow_race:leg:2"]
"text" = "The last run is downwind. People on shore hold up torches, and the finish is by the fire."

[race_texts."contest_dhow_race:leg:2:option:race_dhow_race_2_0"]
"text" = "Shorten sail so the bow doesn’t bury itself in a wave"

[race_texts."contest_dhow_race:leg:2:option:race_dhow_race_2_1"]
"text" = "Full sail, and let her surf with her bow in the air"

[race_texts."contest_dhow_race:leg:2:option:race_dhow_race_2_2"]
"text" = "Angle across and let the swell push you"

[race_texts."contest_korakora:leg:0"]
"text" = "The gong sounds, paddlers on both sides strike up the chant, and the outriggers slap the water white."

[race_texts."contest_korakora:leg:0:option:race_korakora_0_0"]
"text" = "Paddle to the gong, every stroke in time"

[race_texts."contest_korakora:leg:0:option:race_korakora_0_1"]
"text" = "Have the drummer double the beat"

[race_texts."contest_korakora:leg:0:option:race_korakora_0_2"]
"text" = "Ease off a little to keep clear of the other outriggers"

[race_texts."contest_korakora:leg:1"]
"text" = "The gap through the coral is narrow; only one boat can get through at a time."

[race_texts."contest_korakora:leg:1:option:race_korakora_1_0"]
"text" = "Let them through first, then give chase"

[race_texts."contest_korakora:leg:1:option:race_korakora_1_1"]
"text" = "Force the gap with your outrigger scraping coral"

[race_texts."contest_korakora:leg:1:option:race_korakora_1_2"]
"text" = "Go round the outside of the reef through deeper water"

[race_texts."contest_korakora:leg:2"]
"text" = "The finish is inside the bay, where an elder on the beach holds a banner high."

[race_texts."contest_korakora:leg:2:option:race_korakora_2_0"]
"text" = "Keep formation and come in steady"

[race_texts."contest_korakora:leg:2:option:race_korakora_2_1"]
"text" = "Switch to short, fast strokes and paddle till your lungs give out"

[race_texts."contest_korakora:leg:2:option:race_korakora_2_2"]
"text" = "Let the incoming tide carry you in"

[race_texts."contest_canoe_race:leg:0"]
"text" = "The conch blows, the dugouts are shoved off the sand, and everyone fights for the first wave."

[race_texts."contest_canoe_race:leg:0:option:race_canoe_race_0_0"]
"text" = "Let this wave pass, then paddle out"

[race_texts."contest_canoe_race:leg:0:option:race_canoe_race_0_1"]
"text" = "Drive straight through the breaking wave"

[race_texts."contest_canoe_race:leg:0:option:race_canoe_race_0_2"]
"text" = "Take the wave at an angle and slip out sideways"

[race_texts."contest_canoe_race:leg:1"]
"text" = "Into the mangrove channel, roots crisscrossing under the surface; the bow could snag at any moment."

[race_texts."contest_canoe_race:leg:1:option:race_canoe_race_1_0"]
"text" = "Slow down and feel ahead with your paddle"

[race_texts."contest_canoe_race:leg:1:option:race_canoe_race_1_1"]
"text" = "Take the narrowest shortcut"

[race_texts."contest_canoe_race:leg:1:option:race_canoe_race_1_2"]
"text" = "Follow the tide down the main channel"

[race_texts."contest_canoe_race:leg:2"]
"text" = "Out of the mangroves lies the finishing beach, with children on the sand shouting names."

[race_texts."contest_canoe_race:leg:2:option:race_canoe_race_2_0"]
"text" = "Paddle in steadily and ground her on the sand"

[race_texts."contest_canoe_race:leg:2:option:race_canoe_race_2_1"]
"text" = "Jump out and run the canoe up the beach"

[race_texts."contest_canoe_race:leg:2:option:race_canoe_race_2_2"]
"text" = "Catch the last wave in"

[identify_texts."contest_incense:sample:sample_incense_0:clue:0"]
"text" = "A cool, clean wood scent that lingers, like a temple sutra chest when the lid comes up."

[identify_texts."contest_incense:sample:sample_incense_1:clue:0"]
"text" = "Warm it and a deep, bittersweet, resinous smell rises. The old ladies-in-waiting call it the king of incense."

[identify_texts."contest_incense:sample:sample_incense_2:clue:0"]
"text" = "Sweet and floating on top, like a petal just crushed between the fingers: less like wood than like a garden."

