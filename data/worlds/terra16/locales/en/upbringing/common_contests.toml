[identify_texts."contest_cacao:sample:sample_cacao_0:clue:0"]
"text" = "Crack the dry shell and the bean inside is bitter and fragrant. In the market, it spends like money."

[identify_texts."contest_cacao:sample:sample_cacao_1:clue:0"]
"text" = "Thick enough to draw into threads, sweet with a hint of flowers: the work of the forest’s stingless bees."

[identify_texts."contest_cacao:sample:sample_cacao_2:clue:0"]
"text" = "Pale kernels. Soak them in lime water and grind them, and you can smell hot flatbread."

[identify_texts."contest_cacao:answer:answer_cacao_cacao"]
