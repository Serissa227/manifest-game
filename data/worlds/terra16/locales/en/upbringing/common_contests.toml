[identify_texts."contest_lantern_riddle:sample:sample_lantern_riddle_0:clue:0"]
"text" = "A sickle on the third, a mirror on the fifteenth; no smith ever hammers it, yet it changes shape all month."

[identify_texts."contest_lantern_riddle:sample:sample_lantern_riddle_1:clue:0"]
"text" = "It has no feet yet walks ten thousand miles, but only gets up when the wind calls. Lay it down and it’s a roll of cloth."

[identify_texts."contest_lantern_riddle:sample:sample_lantern_riddle_2:clue:0"]
"text" = "Born all black, it makes white paper speak plainly; the more it’s ground, the shorter it gets, and the longer the words."

