[identify_texts."contest_spices:sample:sample_spices_0:clue:0"]
"text" = "Shaped like a tiny nail with a round head. Pinch it and the oil comes out, sweet enough to numb your tongue."

[identify_texts."contest_spices:sample:sample_spices_1:clue:0"]
"text" = "Like a small bird’s egg; cut it open and the inside is marbled brown and cream."

[identify_texts."contest_spices:sample:sample_spices_2:clue:0"]
"text" = "Little black wrinkled balls; bite one and the heat goes straight up your nose."

[identify_texts."contest_spices:answer:answer_spices_clove"]
