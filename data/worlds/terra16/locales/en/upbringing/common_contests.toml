[identify_texts."contest_gold:sample:sample_gold_0:clue:0"]
"text" = "Heavier in the hand than it looks, and it leaves a warm yellow streak on the touchstone."

[identify_texts."contest_gold:sample:sample_gold_1:clue:0"]
"text" = "Bright white metal, gone black wherever it has sat a long time."

[identify_texts."contest_gold:sample:sample_gold_2:clue:0"]
"text" = "A bright yellow that feels light in the hand, with a film of green where it’s old."

[identify_texts."contest_gold:answer:answer_gold_gold"]
