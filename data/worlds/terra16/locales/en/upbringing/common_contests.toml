[notes."note_072063d8b8c7ce76"]
"text" = "At a poetry match the Left and the Right put up poems in pairs. The judge calls each bout on the spot and writes a verdict with reasons; a sharp verdict sometimes outlives both poems."

[notes."note_3b2b78ed3b363c5f"]
"text" = "The schoolmaster chalks up the last three characters of all eight lines, and the students supply the first two to make a five-character regulated poem. Today only imagery and rhyme count; tones can wait till next year. The best line gets a red circle from his brush and goes up on the wall."

[notes."note_28b083bcaae4ed91"]
"text" = "Every couplet of a ghazal must come home to the same rhyme and the same refrain. The old woman teacher in Zabid listens with her eyes shut, and the poem whose refrain falls most naturally gets copied into her own notebook."

[notes."note_1b0e89e734b3ced2"]
"text" = "Pantun go back and forth: one side sings four lines and the other answers at once on the same rhymes. The first two lines sound like idle talk; by the third, everyone knows who you mean. Laughter, then a hush: that’s a win."

[notes."note_010b8a4ecc88e8d8"]
"text" = "The chambers of rhetoric won’t take girls, so the girls hold their own contest. Every stanza ends on the same refrain, and the prize goes to whoever makes it sound new each time. The judge is an old schoolmistress who has written refrains all her life."

[notes."note_a94b2bc9026597b4"]
"text" = "Nobody writes verse down on the Kilwa quay: one side throws out a line and the other catches it on the spot. The old sailors perched on upturned boats are the judges; get them slapping their knees and you’ve won."

[notes."note_960215edcf2b69e3"]
"text" = "Cherry, willow, maple and pine mark the four corners of the court. Eight players loft the deerskin ball off the tops of their feet, calling “Ari!” and “Yaa!” on the beat. A man of the Asukai house keeps count, and when the ball drops, the whole court hears the thud."

[notes."note_370f635cc5ffee26"]
"text" = "The Saint Sebastian guild nails a wooden popinjay to the top of a tall pole, and the youngsters draw, aim and loose to the old archers’ drumbeat. Whoever brings the bird down walks a lap wearing the guild’s silver chain. Misses only bury themselves in the straw; all you lose is face."

[notes."note_a0afbe0eb8c1f324"]
"text" = "A small iron ring hangs by a thread from a wooden frame in the back courtyard. Once the horse is running, the lance goes forward on the third stride. Thread the ring and the maids in the gallery toss down ribbons; miss, and the grooms will laugh about it for a week. The practice lances are wood, with the tips rounded off."

[notes."note_6993f503c8686f75"]
"text" = "An old musician from the Andalusian quarter sets the beat on a frame drum, and the students take turns carrying a passage of the nawba on the oud. Fall half a beat behind and the whole piece sags. Keep up, and tonight you’ll have a seat among the wedding musicians."

[notes."note_b2cac9d26a5a6678"]
"text" = "The solid rubber ball is heavy and lively, and you may only strike it with your hips. Old men at the edge of the court clap out the rhythm, and every time the ball hits the ground, the other side scores. Thick deerskin is bound around your waist, so a bad hit costs you nothing but a coat of dust."

[notes."note_604ccb41d8e0cd89"]
"text" = "Master Mal Lara presides while two students face off for three rounds in Castilian. He weighs only whose evidence is solid and whose reasoning holds; questions of theology belong next door with the friars. The loser copies out a page of Cicero for the winner."

[notes."note_1f0b5b8f1f2739f5"]
"text" = "The rules are old Master Lin’s: first what you saw yourself, then what you heard from others, and only last what you guess. Answers that lean on gods or Buddhas don’t count. Three rounds; the master slaps the table to call the winner, and the loser grinds ink for the whole hall for a day."

[notes."note_d551b6dcc7aaadb2"]
"text" = "At night on deck, the old pilot sits by the tiller and sets the question, and two apprentices answer in turn. The only witnesses allowed are the stars, the kamal and the rutter verses. Answer “God knows,” and the old man nods: “He does. I’m asking you.”"

[notes."note_a5d911fc705cde7b"]
"text" = "The old master sits against a pillar of the Qarawiyyin with the students in a half circle. The questions are about sales, testimony and reckoning, never whose faith is truer. Answer with your evidence and your reasons; say only “because it is so,” and he’ll tell you to come back tomorrow."
