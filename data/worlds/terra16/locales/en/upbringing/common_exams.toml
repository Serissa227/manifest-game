# A6：显示覆盖，仅含文字。

[exams."exam_pilot"]
"name" = "Pilot apprentice’s final test"
"description" = "The page bears your master’s own stamp and says you know the stars and can tell one landmark from another. At the quay it carries no weight. The official pilot’s license has a gate of its own: birth counts, and so do years of service, and you may apply only once you come of age."

[exams."exam_merchant"]
"name" = "Merchant apprentice’s final test"
"description" = "The countinghouse master signs your book and writes that you are a seasoned apprentice. The paper counts only among your teachers. A seat in a merchants’ company or a place in a guild depends on your family and your years in trade, and you must seek it yourself once you come of age."

[exams."exam_sword"]
"name" = "Sword-school final trial"
"description" = "Beside your name in the book your master has added the words “fit to bear a sword”. No official will ever read that line. To enter a swordmasters’ guild you need the right birth and the years behind you, and that waits until you come of age."

[exams."exam_interpreter"]
"name" = "Preliminary interpreters’ examination"
"description" = "The old interpreter puts his mark beside your name, which means you may now follow along and translate. The magistrates’ roll of interpreters has no such entry, and no guild looks at it. Those places wait until you come of age and have some standing behind you, and birth is weighed too."

[exams."exam_society"]
"name" = "Society initiation trial"
"description" = "The people inside add your name to their roll, and that is all. Degrees and guild places lie outside their reach, and they will not speak for you there. Those depend on your birth and your years, and you must go after them yourself once you come of age."

[exams."exam_captain"]
"name" = "The captain’s examination"
"description" = "This paper from your teachers is enough for your classmates to call you captain, and no more. To be captain on the official books you would need a degree, a guild standing and a pilot’s license, each weighed by birth and years of service, and none of them before you come of age."

[exams."exam_kyoto_court"]
"name" = "Waka and annual court observances"
"description" = "Your book records the court ladies’ opinion: your verse and your grasp of the year’s observances are in good order. The abbess of Hōkyōji adds a line of recommendation. Rank and office are the court’s to give, and they are conferred separately."

[exams."exam_antwerp_laurel"]
"name" = "French business letters and refrain verse"
"description" = "Your book now holds the recommendation of the teacher at De Lauwerboom, copied out line by line, and anyone who opens it can see what you have learned. A guild place or a post in the city is not on that page and must be sought some other way."

[exams."exam_shipboard_zabid"]
"name" = "Star questions and the pilot’s final test"
"description" = "Your star book records how many stars you know and which landmarks you can tell apart, with the old pilot’s signature beneath. Whether a shipowner will hire you is settled at sea."

[exams."exam_zhangzhou_shexue"]
"name" = "Community-school discussion and letters"
"description" = "“Teachable”, the schoolmaster writes beside your name, and he adds a note of recommendation. It says what you have read and what sort of family letter you can write. Degrees are won in the county examination hall, and a school note cannot stand in for a post in the magistrate’s office."

[exams."exam_merida_franciscan"]
"name" = "Bilingual herb records"
"description" = "Both names of every herb are set down in your herb book, and the friar adds a recommendation at the back. The book says which plants you know, not what you may become: the friars’ order takes its own vows, and a post under the crown needs its own petition."

[exams."exam_seville_tarifa"]
"name" = "Rhetoric and household etiquette"
"description" = "The steward writes your report and the rhetoric master adds a letter of recommendation, saying your speech holds together and your manners are sound. A degree has to be sat for at a university, and an office under the crown needs someone at court to speak for you; the letter does neither."

[exams."exam_fez_qarawiyyin"]
"name" = "Textual study and a teacher’s recommendation"
"description" = "The letter of recommendation your teacher gives you lists the books you studied under him, a record of what you have read and nothing more. A teaching chair is filled by the college’s elders and a judge’s seat by the court; this paper decides neither."

[exams."exam_giri"]
"name" = "Archipelago letters and oral route examination"
"description" = "On the flyleaf of the trading letters you copied is the Giri teacher’s recommendation, and a shipowner from Maluku who opens the book will see at once what you have learned. Posts and titles in the harbor towns go to whoever the people who run the port choose, and no page can write that."

[exams."exam_cairo_azhar"]
"name" = "Questions and river-gauge records"
"description" = "The register holds what the teacher has written about you, and a separate letter of recommendation is yours to carry home. It shows you studied seriously. Back home, a teaching chair needs a local master willing to take you in, and the judges’ seats are filled by men sent from Istanbul."

[exams."exam_seville_pilot_school"]
"name" = "Chart checking and stellar altitude"
"description" = "The cosmographer writes his notes on the chart you checked and adds a page of recommendation. It is an apprentice’s credential only. A full pilot’s license needs enough years served at sea, and then the Casa’s examination."

[exams."exam_murano_workshop"]
"name" = "Glass-color samples and bilingual proofs"
"description" = "The old master signs the back of the test piece you fired, and the printer’s shop adds a recommendation. It can show which colors you can mix and what sort of bilingual proof you can read; it will not get you into the guild, nor make anyone in a workshop call you master."

[exams."exam_lisbon_medical_house"]
"name" = "Herb identification and Latin reading"
"description" = "The physician’s recommendation says only that you know your medicines and can ask a patient the right questions. It cannot stand in for a medical degree at Coimbra, and it licenses no one to practice."

[exams."exam_lubeck_countinghouse"]
"name" = "Cargo accounts and distant-port letters"
"description" = "The countinghouse master signs the last page of your cargo book and writes a recommendation. It shows you can keep accounts. It is not membership in a merchants’ guild, and it makes you no regular hand at any trading station."

[exams."exam_bilbao_whaling_yard"]
"name" = "Line repair and coastal observation"
"description" = "The old harpooner marks the line you spliced, and the yard master writes a recommendation. It vouches for your craft. It is no leave to sail, still less a harpooner’s standing; that takes years and a shipowner’s nod."

[exams."exam_golden_horn_yard"]
"name" = "Seam samples and timber accounts"
"description" = "The master on the slipway cuts a mark into your sample joint and writes a recommendation. It vouches only for your craft and your timber accounts. A place in the craftsmen’s guild needs the old masters’ nod, and a post at the arsenal is handed down by the authorities; this paper opens neither door."

[exams."exam_fez_qarawiyyin_custom"]
"name" = "Tracing reports and checking manuscripts"
"description" = "Your teacher annotates the copy you checked and adds a recommendation saying you will chase a thing to its root. The right to transmit texts still needs the teacher to recite them to you in person; a teaching chair or an office lies further off."

[exams."exam_cambay_broker_house"]
"name" = "Bead grading and explaining bills"
"description" = "The old broker tips the beads you graded back into their box and writes your name and a recommendation in his book. In Cambay’s trade that is a good word to have. It is not membership in the brokers’ body."

[exams."exam_busan_interpreters"]
"name" = "Chinese–Japanese letters and forms of address"
"description" = "The old interpreter folds the letter you translated, presses a small seal into the fold and adds a recommendation. Sitting the Sayeogwon examination is up to you, and the interpreter’s office waits until the government calls your name. This paper stands in for neither."

[exams."exam_naha_envoy_house"]
"name" = "Envoy documents and route recitation"
"description" = "Who is chosen to go to Nanjing, and who is given an office, is settled by a selection of its own. All the envoys’ household can give you is the old envoy’s signature in the margin of your draft, and a line of recommendation."

[exams."exam_tondo_house_school"]
"name" = "Trading agreements and hospitality"
"description" = "An elder of the datu’s kin adds your name to a draft agreement and praises you in front of the visitors, which counts as the recommendation. It is the household’s approval only. Rank and office pass by inheritance and appointment."

[exams."exam_chincha_raft_house"]
"name" = "Raft-cargo quipu and bilingual records"
"description" = "An old raft-trader ties one more knot into the cord you made, as a signature. If you sat in on the lectures at Cuzco, the priest there adds a page of recommendation, tucked beside the cord. Offices and rank are not tied into any knot; the authorities appoint to them."

[exams."exam_noshima_boat_school"]
"name" = "Tide lines and returning to port"
"description" = "The Murakami house’s old boat captain enters your name in the roll of apprentices and adds a page of recommendation. It shows you know the waterways. A captain’s standing or a place in the fleet depends on years served and the lord’s appointment."

[exams."exam_antwerp_printing_rhetoric"]
"name" = "Proofreading and dramatic recitation"
"description" = "Your corrections stand in red on the proof, and the printer and an elder of the chamber of rhetoric each write a line of recommendation. The guild’s roll does not carry your name, and when the chamber sets its seats for a performance, you are not yet in the count."

[notes."note_3fc47bd7feece7d2"]
"text" = "Not knowing the hidden arts will not hold you back: if your name at sea, in trade, in learning and in company adds up to enough, you can still pass."

[notes."note_0c4a71488f7553e9"]
"text" = "The senior lady-in-waiting spreads out the poem you composed for the verse contest, asks you a few questions about the order and etiquette of the year’s court observances, and writes her recommendation only once she is satisfied."

[notes."note_f4dc689a4808a634"]
"text" = "The teacher reads through the business letters you wrote, then has you recite a refrain verse aloud, listening to your phrasing and tone, before she puts her recommendation in writing."

[notes."note_eea0ba03248208aa"]
"text" = "The old pilot has you name stars on deck and fires a string of star questions at you, then leafs through the route book you corrected, and signs only when he is satisfied."

[notes."note_ce7561baee28e3b0"]
"text" = "The master reads over the family letters you wrote, quizzes you on linked verse of the kind the school’s poetry circle writes, and asks you a few questions in person before he writes his comment."

[notes."note_a3142161d2067d39"]
"text" = "The friar turns the pages of your bilingual herb book and asks you both names of each plant, one by one. An old healer from the household is called in to listen; she can tell at once whether you have the virtues right."

[notes."note_ede39438922eb16c"]
"text" = "The master sets a thesis and has you argue it on the spot, while the steward stands by and watches how you bow, stand and come and go. Only when both nod can the recommendation be written."

[notes."note_820c03aa878c8bd1"]
"text" = "Your teacher has you read and expound a passage before your fellow students, then take three rounds of his questions. He can tell from your voice how steady your answers are."

[notes."note_e485375641dcb7b7"]
"text" = "Your teacher makes you recite a route aloud, where the reefs lie and where the tide changes, and stops you at every slip. Then the teacher reads the trading letters you wrote, and only after that passes judgment."

[notes."note_7625931df37fb92d"]
"text" = "The teacher goes through your record of the Nile’s levels, quizzing you on the readings date by date, then tests you on star heights and the calendar. Only when you have finished answering does the teacher put a mark in the register."

[notes."note_79e6f1aa5db5eebd"]
"text" = "The master points to places on the chart you checked and asks why you changed them, then has you take a star-height measurement again in the courtyard, in front of him."

[notes."note_b20485e78e5e682e"]
"text" = "The master holds your colored test pieces up to the window light, and the printer has you proofread a sheet of Latin set beside the Venetian vernacular."

[notes."note_1be1adf14b4ea389"]
"text" = "The physician sets a row of herbs before you and has you give the name and use of each, then makes you read a passage of Latin herbal aloud to hear whether you truly follow it."

[notes."note_ed3aa2410e3ed8cf"]
"text" = "The master pulls out a page of cargo accounts for you to check on the spot, then dictates a letter bound for a far port for you to take down, and has you read it back to him."

[notes."note_3719215a74718313"]
"text" = "The old harpooner hands you a worn length of rope to mend before his eyes, then walks you to the quay and asks when the tide will turn and which way the wind will shift."

[notes."note_2a2ada2665ee9663"]
"text" = "The master twists and raps the sample joint you made, then hands you a timber account to work out again."

[notes."note_83361429ab69c92d"]
"text" = "Your teacher turns the pages of the manuscript you collated, points to a few variant readings, and asks which chain of report each came from. He nods only when you can name the source."

[notes."note_69150fbac73c7b9c"]
"text" = "The old broker pours a handful of beads into your palm and has you sort them by grade, then makes you explain to a customer who cannot read how a bill of exchange is cashed."

[notes."note_ebcba376022ded07"]
"text" = "The old interpreter gives you a Chinese letter to put into Japanese, then a Japanese one to put back, and picks over every form of address to see whether you used it rightly."

[notes."note_e66b646f2c218114"]
"text" = "The old envoy listens as you read out the tribute envoy’s courtesies from the document, then recite a route to Fuzhou, correcting every error on the spot."

[notes."note_805652c6436cbd34"]
"text" = "An elder plays a merchant from far away and bargains with you, watching how you word the agreement, how you offer betel, and what you say to a guest."

[notes."note_cfdfd25d1d7876bf"]
"text" = "An old man lays a cord thick with knots before you and has you read out the count of a raft’s cargo, and then read out the bill written in Spanish. The two have to agree."

[notes."note_2d003f24bf571c41"]
"text" = "The old captain takes you out of harbor, has you name the reefs and landmarks along the tide line, then lets you bring the boat back yourself. He says nothing all the way; he only watches."

[notes."note_017601779fded710"]
"text" = "The printer pushes a proof full of errors across to you to correct on the spot, and an elder of the chamber has you speak a passage of the play to hear where you break your phrases."

