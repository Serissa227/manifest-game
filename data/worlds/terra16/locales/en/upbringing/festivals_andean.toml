# A6：显示覆盖，仅含文字。

[festivals."festival_sun"]
"name" = "Inca sun observance"
"customs" = "At dawn on the winter solstice, mountain families stand facing east to wait for the sun, the children huddled inside their mothers’ shawls, and flick a few drops of chicha onto the ground for it. The old people remember Cuzco: three days with no fire lit anywhere in the city, and the Inca standing barefoot in the square, lifting a gold cup to the sunrise."
"gift_custom" = "A belt from your own loom, or a bag of toasted maize to share with whoever is waiting for the sunrise beside you."
"date_note" = "In the Andes the winter solstice comes in June, when the southern days are shortest. Cuzco’s priests once fixed the day by watching which pair of stone pillars on the ridge the sun set between, so it did not always fall on the same date."
