# A6：显示覆盖，仅含文字。

[festivals."festival_se_eid"]
"name" = "Eid al-Fitr"
"customs" = "On Eid morning the drum sounds from the mosque and families go to prayer in new sarongs. On the way home they stop first to ask forgiveness of their elders, so that whatever lies between them is cleared before the meal. On the table are diamond-shaped rice cakes cooked in palm-leaf pouches, and any guest from afar is shown to the seat of honor and handed the first cake."
"gift_custom" = "A small packet of coconut sweets, a braided cord or a few copied lines of verse, offered as small festival courtesies and nothing more."
"date_note" = "The date is reckoned by the Hijri calendar, but the fast ends only when the moon shows itself: the sea is hazy and the crescent thin, and the watchers on the shore wait until midnight, so ports may differ by a day or two. The night-before drumming starts at the previous sunset."

[festivals."festival_se_mawlid"]
"name" = "Mawlid"
"customs" = "Teachers and students prepare lamps and candles and recite poems in praise of the Prophet through the night. Gamelan sounds before the great mosque at Demak, the gongs deep and slow, and people come from all the villages around, by boat and carrying their children, to sit on mats and listen until dawn."
"gift_custom" = "A cake of sticky rice dyed yellow and a small bamboo tube of well water for the throats of those reciting through the night."
"date_note" = "The twelfth of the third Hijri month, which the Javanese call Mulud. The gamelan sounds its first gong at the sunset before, and the islands sight the crescent at different times, so the feast may differ by a day or two."

[festivals."festival_se_court"]
"name" = "Archipelago court gathering"
"customs" = "On the water before the palace the kora-kora boats chase one another, dozens of paddles biting at once, the gongs in their bows louder than the surf. The crowd shouts from under the coconut palms, and children hold up little boats woven of palm leaf, waiting to give them to the winning rowers."
"gift_custom" = "A small packet of cloves, a little boat woven of palm leaf, or a quid of betel kept for the winning rowers to chew."
"date_note" = "The datu or sultan chooses the day. The messenger boats carry word from island to island, so the islands do not all keep the feast together but a few days apart."

[festivals."festival_se_songkran"]
"name" = "Songkran"
"customs" = "At dawn people pour a ladle of scented water over their elders’ hands for a blessing, then heap sand stupas at the temple a handful at a time and stick paper flags in them. By afternoon the young are splashing one another down the street with buckets, and not even a passing merchant escapes."
"gift_custom" = "A string of jasmine flowers, a little box of scented powder and a bowl of water with petals floating in it."
"date_note" = "Songkran is the Siamese New Year, kept on the day the court astrologers reckon the sun enters Aries, some twenty days after the date in European almanacs; the day can differ by a day or two from place to place."

[festivals."festival_se_lights"]
"name" = "Floating-lantern gathering"
"customs" = "On the full-moon night the river is covered with little boats folded from banana leaves, each with incense and a candle, the tiny flames drifting off downstream. People crouch on the bank watching to see whether their own boat sinks or goes out first; that, they say, is the year’s ill luck leaving."
"gift_custom" = "A banana-leaf lantern boat folded by hand, with a slender candle and a few small flowers set inside."
"date_note" = "Lanterns are floated on the full-moon night of the twelfth month of the Siamese calendar; each place picks its day by the moon it sees."

[festivals."festival_se_pantun"]
"name" = "Pantun exchange night"
"customs" = "Two sides trade pantun across the courtyard, the first two lines painting a scene of gulls, coconut palms and the rising tide, and the last two revealing the heart. Whoever cannot answer drinks a bowl of coconut water as forfeit, and the losing side is hooted at by the other."
"gift_custom" = "A pantun left for the other to answer, a packet of betel or a coconut-shell ladle of your own carving."
"date_note" = "The night has no fixed date; the elders of the households choose a moonlit evening after the harvest."
