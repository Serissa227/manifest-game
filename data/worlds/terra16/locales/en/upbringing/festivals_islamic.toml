# A6：显示覆盖，仅含文字。

[festivals."festival_is_eid"]
"name" = "Eid al-Fitr"
"customs" = "After the morning prayer everyone, big and small, is in a new robe, and neighbors go from door to door with the greeting of the feast. The stalls sell out of pastries stuffed with date paste, and each house vies to set an extra bowl for a guest from far away."
"gift_custom" = "Sugared almonds, a silk handkerchief with an embroidered edge or a few lines of verse copied out neatly; who sent it, everyone pretends not to know."
"date_note" = "The first of the tenth Hijri month. At dusk on the twenty-ninth of Ramadan men climb to the rooftops to look for the crescent: seen, the lamps are lit that same evening and the feast is tomorrow; lost in cloud, the fast runs one day more."

[festivals."festival_is_sacrifice"]
"name" = "Eid al-Adha"
"customs" = "After the prayer the men of the house lead the sheep out into the yard, say the words and only then make the cut. The meat is divided in three: for the household, for relatives, for the poor. Children are sent running with the portions and come back with their pockets stuffed with sweets from every door."
"gift_custom" = "A piece of grilled mutton wrapped in flatbread, or a bag of dry provisions for someone on the road."
"date_note" = "The tenth of the twelfth Hijri month, some seventy days after the feast of breaking the fast. The crescent is sighted early in one city and late in another, so the feast may differ by a day or two; from the sunset before, people sit up with lamps."

[festivals."festival_is_mawlid"]
"name" = "Mawlid"
"customs" = "In Fez the schools give the children wax flowers, white wax pinched into petals with a wick buried in the heart, and the child must cup a hand around the flame all the way home. That night teachers and students sit under the arcade, lighting lamps one by one and chanting praise-songs until the small hours."
"gift_custom" = "A wax flower and a page of praise-poetry copied out clearly, in the same paper bag."
"date_note" = "The twelfth of the third Hijri month. The festival night begins with the sunset before: the lamps are lit then and stay lit till dawn. Cities sight the crescent differently, so the day may shift by one or two."

[festivals."festival_ramadan"]
"name" = "Beginning of Ramadan"
"customs" = "On the first night of the fast neighbors pass hot soup and dates over the low walls, and a house with no one cooking finds three or four bowls waiting at its door. When the sunset gun fires, the street goes suddenly quiet but for spoons on bowls. Small children need not keep the whole day; they are looked after at home and praised if they last until noon."
"gift_custom" = "A packet of dates, a small jar of lamp oil and a flask of clean water."
"date_note" = "Ramadan begins on the first of the ninth Hijri month, once someone has sworn to having seen the crescent; cities may differ by a day or two. The first night’s prayers are said at the sunset before the fast begins."

[festivals."festival_hajj"]
"name" = "Hajj season"
"customs" = "The pilgrim caravan left town weeks ago and by now should be at Mecca. Those who saw it off had pressed letters into the travelers’ hands, asking them to inquire after some relative not heard from for years, and now they go down to the gate every few days to ask for news. Classmates who stay behind wipe the desks of those who have gone and keep their places, each with a freshly cut pen laid on it."
"gift_custom" = "A packet of dates left on an empty desk for its owner’s return, or a book cover you stitched yourself, for the pilgrim to wrap the book worn soft on the road."
"date_note" = "Around the eighth of the twelfth Hijri month the pilgrims begin the rites at Mecca, and the tenth is the feast of sacrifice; the caravan itself set out weeks before. The Hijri day runs from the sunset before, and those left behind light a lamp at the gate that evening. Sightings of the crescent vary, so towns may differ by a day or two."

[festivals."festival_miraj"]
"name" = "Night of the ascent"
"customs" = "On the Night of the Ascent a shaykh at the Azhar tells by lamplight how the Prophet journeyed by night and rose through the heavens. The students sit cross-legged all along the arcade, and at the passage through the seven heavens a lamp tilts in a back-row student’s hand and drips oil onto the mat, unnoticed. Afterward the apprentices climb ladders to light the lamps at the street corners so people can see their way home."
"gift_custom" = "A sweet to share, and a slim candle to light during the prayers."
"date_note" = "The night of the twenty-seventh of the seventh Hijri month, which begins at sunset on the twenty-sixth. Cities that sight the crescent a day apart will keep it a day apart."

[festivals."festival_nowruz"]
"name" = "Nowruz"
"customs" = "In the days before the equinox the courtyard is swept, the pool water changed and wheat set to sprout in a bowl. At the moment of the equinox the whole family sits down in new clothes and waits for the eldest to speak the first blessing; the students at the school take out a blank notebook and leave its first page empty for the new year."
"gift_custom" = "A freshly copied poem and a dish of sweets made with honey and rose water."
"date_note" = "It falls on the spring equinox. The sky-watchers of each city do their own sums, so one counts the new year a day early and another a day late, and a single road can separate two New Years."

[festivals."festival_hidirellez"]
"name" = "Hıdırellez"
"customs" = "On the first settled sunny day of early May people carry rugs and braziers down to the meadow by the river. The children write wishes on little paper scrolls and tie them to a rose branch, and nobody may peek. The old people say that today Hızır and İlyas meet on earth, and the grass turns green overnight wherever they have walked."
"gift_custom" = "A branch just coming into flower, and a meal laid out on the grass to share."
"date_note" = "Around the start of May. Country elders each count it their own way, and the villages by the river often begin a few days before those in the hills."

[festivals."festival_mesir"]
"name" = "Manisa mesir gathering"
"customs" = "From high on the mosque in Manisa someone scatters handfuls of spice paste wrapped in paper over the square, and every hand in the crowd reaches up while the children are hoisted onto shoulders to grab. The paste is said to hold forty-one spices; the apothecary copies the list and pins it by his door, warning that one small spoonful is enough and more will upset the belly."
"gift_custom" = "A small paper packet of the paste and a flask of clear water to wash it down."
"date_note" = "Around the spring equinox. The people of Manisa settle the day by old custom, and when strangers ask they say only, “You’ll know when it comes.”"

[festivals."festival_fire_wednesday"]
"name" = "Fire night before Nowruz"
"customs" = "A little heap of brushwood is lit in the yard and the children leap the fire one by one, chanting, “Take my yellow and give me your red.” When the flames die, friends take turns opening a book of Hafez and reading whatever line falls open, as an omen for the new year; a small lamp is left burning in the yard."
"gift_custom" = "The line you drew, copied on a slip of paper, folded and slipped into a companion’s book."
"date_note" = "It falls on the eve of the last Wednesday of the old year, which is to say a Tuesday night, and so follows the equinox."
