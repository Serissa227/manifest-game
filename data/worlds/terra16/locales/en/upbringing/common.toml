# A6：显示覆盖，仅含文字。

[notes."note_d838a87e6bb8dbc9"]
"text" = "Shared upbringing rules"

[notes."note_805a9e9b61c2f895"]
"text" = "A hundred points of an aptitude or ability make one grade, up to grade ten. Conduct swings between 0 and 100. Fortune is fixed by the day you were born, and no lesson changes it. Arcana stays hidden until it awakens, and ordinary lessons cannot train it."

[notes."note_48f7ef792ba72769"]
"text" = "Classmates can become friends or rivals, or feel something they cannot quite name. Even past sixteen, so long as they are still at the academy, nothing between them is settled."

[notes."note_4cfed13f98787633"]
"text" = "Home lessons in 1553, the academy from 1554 to 1556, the sea in 1557. Each of you grows a year older on your own birthday; finishing school makes no one an adult any sooner."

[notes."note_bda9962ce91ea458"]
"text" = "Naval command"

[notes."note_c6d5cfe03b91e8c6"]
"text" = "Scored out of 1,000: gunnery and command weigh three tenths each, seamanship and arms two tenths each. Whom the gunners obey and which way the ship turns decide most of a sea fight."

[notes."note_0d35f2ce7b11adfd"]
"text" = "Commerce"

[notes."note_dce91f5ec8b4b49f"]
"text" = "Scored out of 1,000: trade and numeracy weigh three tenths each, stewardship and eloquence two tenths each. Keep the books straight, name the price, and win over the person across the table."

[notes."note_47627a4f93873a6f"]
"text" = "Scholarship"

[notes."note_cd538028b5789030"]
"text" = "Scored out of 1,000: learning weighs four tenths; intellect, astronomy and medicine two tenths each. How many books you carry in your head, and what your hands can do with them, is tallied here."

[notes."note_e81da266a9a1cfcb"]
"text" = "Social skill"

[notes."note_cb06a012144a215f"]
"text" = "Scored out of 1,000: etiquette and eloquence weigh three tenths each, charm and sensibility two tenths each. Enough to get through a palace gate and to hold your seat at a merchants’ table."

[notes."note_cfc672f0954714bb"]
"text" = "Occult knowledge"

[notes."note_c69e72bff713ee5e"]
"text" = "Scored out of 1,000: arcana weighs four tenths; resolve, learning and perception two tenths each. Until it awakens, this line stays blank."
