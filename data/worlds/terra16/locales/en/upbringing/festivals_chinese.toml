# A6：显示覆盖，仅含文字。

[festivals."festival_cn_new_year"]
"name" = "Spring Festival"
"customs" = "Firecrackers go off before dawn on New Year’s morning; the family bows to the ancestors first, then to the elders. Scholars who can’t face a day of calls send servants round with their visiting cards, and by noon the gatehouse has a stack of everyone else’s."
"gift_custom" = "Visitors bring a box of New Year cakes—northerners call their millet ones “year-after-year cakes”—and elders give each child a string of coppers to spend on firecrackers and sugar."
"date_note" = "The first day of the first month, worked out year by year from the Ming court’s own Datong calendar rather than the later lunar calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_lantern"]
"name" = "Lantern Festival"
"customs" = "The lantern market runs for several nights, and the turtle-mountain lanterns and spinning horse lamps make the streets bright as day. Women and girls go out together in white silk jackets to walk the bridges—cross them tonight, they say, and your back and legs won’t ache all year."
"gift_custom" = "A lantern you pasted together yourself, or a packet of sticky-rice yuanxiao. Pin a riddle to the lantern; whoever guesses it wins the prize."
"date_note" = "The fifteenth of the first month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_flowers"]
"name" = "Flower festival"
"customs" = "The fifteenth of the second month is the flowers’ birthday. In Hangzhou they pair it with the Mid-Autumn moon—“flower morning, moon evening.” People walk out of the city to see the blossoms, and children chase kites along the field ridges."
"gift_custom" = "A sprig of apricot blossom just opening, new leaves and all; the more refined add a short poem."
"date_note" = "The fifteenth of the second month, though some places keep the twelfth. Worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_shangsi"]
"name" = "Shangsi"
"customs" = "On the third of the third month people go down to the water to wash the winter away. Cups float down a winding stream, and whoever a cup stops in front of must make a poem—the young ones drink only water. In Hangzhou men and women alike tuck a shepherd’s-purse flower into their hair: “Wear shepherd’s purse in spring, and the peach and plum hang their heads.”"
"gift_custom" = "A sprig of shepherd’s purse, or a poem written by the stream—no need to say who it was written for."
"date_note" = "The third of the third month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_mazu"]
"name" = "Mazu’s birthday"
"customs" = "Tianfei’s birthday. The fishing boats stay in, a stage goes up in front of her temple, and the opera for her runs from midday deep into the night. Children squeeze up to the front, waiting for the offering buns to be handed round."
"gift_custom" = "Ask a pinch of incense ash from Tianfei’s temple, sew it into a little red pouch, and hang it round the neck of someone about to sail."
"date_note" = "The twenty-third of the third month. In 1553, a year with a leap third month, the birthday is still kept in the first of the two. Dates are worked out from the Ming court’s Datong calendar; 1555 has a leap eleventh month."

[festivals."festival_cn_duanwu"]
"name" = "Dragon Boat Festival"
"customs" = "Mugwort and sweet flag go up over the door, children get five-colored threads tied round their wrists, and the grown-ups sip realgar wine. In the south the dragon boats race and both banks crowd to the water at the first drumbeat; in Beijing little girls are dressed up with pomegranate flowers in their hair, and the days are called the Daughters’ Festival."
"gift_custom" = "Zongzi wrapped in bamboo leaves and tied with colored thread; girls sew sachets of mugwort and angelica root for a friend to pin to a collar."
"date_note" = "The fifth of the fifth month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_qixi"]
"name" = "Qixi"
"customs" = "At night melons and fruit are laid out in the courtyard and girls thread seven-eyed needles by moonlight; in the morning they look to see whether a spider has spun a web over the melons. Northern girls set a bowl of water in the noon sun and float an embroidery needle on it: if its shadow on the bottom looks like a flower or a cloud, they’ve been granted skill—if it looks as thick as a washing bat, everyone laughs."
"gift_custom" = "A handkerchief or sachet you embroidered yourself. Whatever the stitching is like, the one who receives it notices, and says nothing."
"date_note" = "The seventh of the seventh month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_ghost"]
"name" = "Zhongyuan"
"customs" = "The temples hold the Ullambana rites, and at night lamps are set floating on the water to light the way for ghosts with no one to feed them. At home new rice and the first melons are laid out for the ancestors to taste. Children are told not to linger by the river after dark."
"gift_custom" = "A jar of lamp oil or a few measures of rice for the temple—for your own ancestors, and for the ghosts nobody remembers."
"date_note" = "The fifteenth of the seventh month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_midautumn"]
"name" = "Mid-Autumn"
"customs" = "An incense table goes out in the courtyard for the moon, with mooncakes and fruit. After the bows the cakes are cut and shared, and a piece is kept back for whoever is away from home. In Hangzhou people carry picnic boxes onto boats and watch the moon over West Lake until dawn."
"gift_custom" = "Friends and relatives trade mooncakes—round, for reunion—with a few pomegranates fresh off the tree."
"date_note" = "The fifteenth of the eighth month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_chongyang"]
"name" = "Double Ninth"
"customs" = "On the ninth of the ninth month people climb a hill with dogwood tied to their sleeves and drink chrysanthemum wine against bad luck. In Beijing they eat flower cakes studded with jujubes and chestnuts, and married daughters are fetched home to share them—fetch one late, and her mother scolds while the daughter sulks."
"gift_custom" = "A pot of chrysanthemums or a slice of flower cake. For an elder, pick the pot with the truest yellow."
"date_note" = "The ninth of the ninth month, worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."

[festivals."festival_cn_qingming"]
"name" = "Qingming"
"customs" = "Families clear the weeds from the graves, add fresh earth, burn paper money and weigh down a few more sheets on top of the mound, so anyone passing knows this grave is remembered. On the way home they stroll in the new grass, willow sprigs go up over the eaves, and the girls take turns on the courtyard swing."
"gift_custom" = "A letter to whoever couldn’t come home: the family graves are swept, and the willow is up over the door again this year."
"date_note" = "Qingming is one of the twenty-four solar terms. It follows the sun, not the moon, so it lands around the fifth of April every year."

[festivals."festival_cn_solstice"]
"name" = "Winter solstice"
"customs" = "“Winter Solstice is as big as New Year”: the ancestors first, then visits to wish everyone a good winter. A plum branch with eighty-one blank petals goes up on the window, and each morning one petal is touched with rouge. When the whole branch is red, the cold is over."
"gift_custom" = "Southern households roll sweet rice balls and northern ones wrap wontons, and either way a bowl goes next door."
"date_note" = "The solstice is a solar term and follows the sun, so it falls around December 22 every year. The lunar calendar is built so that its eleventh month always contains it."

[festivals."festival_cn_eve"]
"name" = "Lunar New Year’s Eve"
"customs" = "New door gods and peachwood charms go up on the gate, and a pan of pine and cypress branches crackles in the courtyard until the whole house smells of cypress. The family sits up to see the year out; the children never make it to midnight and fall asleep against whoever is nearest."
"gift_custom" = "After the year-end meal everyone folds dumplings, one with a silver coin hidden inside—whoever bites it in the morning has a lucky year. Parcels for relatives far away should have gone out on a boat back in the twelfth month."
"date_note" = "The last day of the twelfth month—the twenty-ninth, when the month is short. Worked out year by year from the Ming court’s Datong calendar (leap third month in 1553, leap eleventh month in 1555)."
