# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.suez]
name = "Suez"
lore = "Shipyards stand in rows on a beach where nothing grows, and the timber has to be carried across the desert from the Nile before it arrives. Every caravan from Cairo brings cables and iron nails."

[ports.jeddah]
name = "Jeddah"
lore = "When the pilgrimage season comes, Jeddah’s lanes fill with every accent: Javanese, Indians, Moroccans, all bound for Mecca. Merchants take advantage of the pilgrims’ stay and fill their courtyards with pepper and cloth."

[ports.mocha]
name = "Mocha"
lore = "Coffee from the Yemeni highlands comes down to the coast day after day on camelback. The smell of roasting beans hangs thick on the Mocha quay as sack after sack is loaded for Jeddah and Suez."

[ports.aden]
name = "Aden"
lore = "Aden lies in the mouth of an extinct volcano, the black rock around it hot to the touch. The Ottoman garrison sits in forts on the cliff face, and merchants swap goods and wait for the wind during the few weeks when the monsoon turns."

[ports.dhofar]
name = "Zafar, Dhofar"
lore = "Frankincense resin comes down from the foothills in pale yellow tears, heaped in the storehouses of Zafar. The local lord pays tribute to Hormuz, but the affairs of the port are still settled by his own people."

[ports.muscat]
name = "Muscat"
lore = "Muscat’s deep bay is ringed with black rock, and a Portuguese fort commands the mouth. The garrison’s dates, water and mutton all come from Omani merchants inland, and the merchants name the price."

[ports.julfar]
name = "Julfar"
lore = "Old Julfar’s walls have come down in several places and sand has run over half a street; children drive goats in and out through the gaps. Farther north around Ras al-Khaimah, pilots and pearl traders still keep to their old trades."

[ports.hormuz_port]
name = "Hormuz"
lore = "Not a blade of grass grows on the island, and the ground is a crust of salt; fresh water must be brought from the mainland boatload by boatload. The king still lives in his palace, but every ship entering or leaving the harbor must first give its name to the men in the Portuguese fort."

[ports.bahrain]
name = "Bahrain"
lore = "Pearl oysters carpet the shoals off Bahrain. In summer the divers go down on one breath, a tortoiseshell clip on the nose and a rope at the waist. Whom the pearl tax goes to depends on who holds power at Hormuz this year."

[ports.basra]
name = "Basra"
lore = "The Ottomans took Basra only in 1546. Date palms line both banks of the Shatt al-Arab as far as the eye can see, and river boats drift down with the current, to shift their cargo here to seagoing ships bound out of the Gulf."
river = "Shatt al-Arab"
