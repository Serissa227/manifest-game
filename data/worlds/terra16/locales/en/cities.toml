# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[cities.paris]
name = "Paris"
lore = "The king’s city on the Seine, its Left Bank a jumble of colleges and bookshops; the moment a barge of grain or a barge of paper ties up, workshop hands crowd the quay to unload it."

[cities.toledo]
name = "Toledo"
lore = "The old royal city, almost circled by the Tagus, forges blades and weaves woolens; old people say Solomon’s Table lies deep in the caves that run beneath the cellars."

[cities.rome]
name = "Rome"
lore = "Grain barges crowd the Tiber one behind another; masons digging foundations strike half a column every few days, for the pope’s city stands on top of an older one."

[cities.florence]
name = "Florence"
lore = "Duke Cosimo’s capital. The dyers along the Arno turn the river a dozen colors, and wool and silk still put bread on the city’s tables."

[cities.augsburg]
name = "Augsburg"
lore = "The great counting-houses of the Fuggers and Welsers stand here; mines, loans and the mule trains over the Alps all settle their accounts in a few rooms."

[cities.nuremberg]
name = "Nuremberg"
lore = "In this imperial city brassworkers hammer astrolabes at one end of the street, gunsmiths grind barrels at the other, and around the corner the printing shops never stop setting type."

[cities.vienna]
name = "Vienna"
lore = "Danube barges unload army grain and powder here; the sultan’s host besieged the city in 1529, and its walls have been strengthened every year since."

[cities.prague]
name = "Prague"
lore = "The Bohemian royal city on the Vltava, its stone bridge joining castle and Old Town; glass and silver from the hills change hands here."

[cities.krakow]
name = "Krakow"
lore = "The royal city on the upper Vistula. Salt from Wieliczka comes in by the cartload, grain boats drift downriver toward Danzig, and university students haggle with stallholders in the market square."

[cities.moscow]
name = "Moscow"
lore = "A city of timber on the Moskva, the tsar’s capital since 1547; furs and beeswax from the northern forests pile up in the warehouses, and the whole town smells of pine resin."

[cities.targoviste]
name = "Targoviste"
lore = "Wallachia’s court sits in this small town on the plain, an old tower left by earlier princes standing by its walls; in the taverns, the moment a drunk mentions the Impaler, the next table sets down its cups."

[cities.cairo]
name = "Cairo"
lore = "An Ottoman governor sits on the Nile, but the old city’s ways have not changed: scholars at al-Azhar lecture as ever, the coppersmiths’ hammering drowns the camel bells, and caravans still file in from the Red Sea."

[cities.aleppo]
name = "Aleppo"
lore = "A caravan city deep in Syria. Its vaulted stone bazaars run on out of sight; camel trains arrive from Mesopotamia and Anatolia and turn around for the ports on the coast."

[cities.baghdad]
name = "Baghdad"
lore = "It fell to the Ottomans in 1534. The old city on the Tigris has long since lost its former glory, but the post roads still meet here and the ferrymen are never idle."

[cities.isfahan]
name = "Isfahan"
lore = "A Safavid market city on the Zayandeh River, where carpets, glazed tiles and silk still change hands in the bazaar beside the old Friday Mosque."

[cities.fez]
name = "Fez"
lore = "The Saadians took Fez in 1549, and some in the city still quietly miss the old Wattasid kings; at the Qarawiyyin, lectures go on as always."

[cities.timbuktu]
name = "Timbuktu"
lore = "A sand city near the bend of the Niger. Camel trains unload Saharan salt and carry off gold, while scribes copy page by page in the back lanes; people say no other goods pay as well as books."

[cities.great_zimbabwe_city]
name = "Great Zimbabwe, Old City"
lore = "The old royal city within its stone walls has long stood quiet, and herders drive cattle past the high walls; at markets nearby, people still trade gold and ivory for cloth and glass beads brought up from the coast."

[cities.agra]
name = "Agra"
lore = "The city on the Yamuna now obeys the Sur dynasty; whether the exiled Humayun will ever return is a question the bazaar asks only in lowered voices."

[cities.vijayanagara_city]
name = "Vijayanagara"
lore = "In the stone bazaars of the royal city the jewel stalls stand shoulder to shoulder; the warhorses, though, must be hauled over the mountains from the western ports, at frightening prices."

[cities.chiang_mai]
name = "Chiang Mai"
lore = "The great stupa still shows the gap an earthquake tore in its crown, and the niche that held the Emerald Buddha stands empty; in 1552 the Buddha was taken away to Luang Prabang."

[cities.beijing]
name = "Beijing"
lore = "The capital eats what the Grand Canal brings. At Tongzhou the grain barges lie hull to hull, and the city’s hundreds of thousands of mouths, and the pay of the border garrisons, depend on them."

[cities.nanjing]
name = "Nanjing"
lore = "The southern capital keeps all its ministries but not its emperor; the clatter of the imperial looms, the bookshops of Sanshan Street and the endless river traffic hold up market after great market."

[cities.jingdezhen]
name = "Jingdezhen"
lore = "Smoke from the imperial and private kilns turns the sky over the Chang River gray, and at night the firing flames redden half the water; boats loaded with porcelain drift downstream toward the inland waterways and the seaports."

[cities.kyoto]
name = "Kyoto"
lore = "Court nobles and temples share the city, while the shogun Ashikaga Yoshiteru and Miyoshi Nagayoshi contend for real power in the capital, and the townsmen wall in their own blocks for safety."

[cities.seoul]
name = "Hanseong"
lore = "When the bell tower tolls, offices and shops open together; post horses leave from here and run up the length of the peninsula to Uiju on the Yalu."

[cities.uiju]
name = "Uiju"
lore = "Officers at the Yalu crossing search every embassy and every load of goods; without a travel pass, no one crosses the river."

[cities.hetu_ala]
name = "Hetu Ala"
lore = "A hill town on the Suzi River, where hunters bring in sable and ginseng and traders come and go along forest paths with news from the frontier."

[cities.fushun]
name = "Fushun"
lore = "At the Fushun Pass horse market, Jianzhou traders exchange sable and ginseng for cloth and plow oxen; iron pots and ironware leave only after officials have counted them."

[cities.kaiyuan]
name = "Kaiyuan"
lore = "The horse market outside Kaiyuan opens on days the officials set: Haixi Jurchens lead in their horses, Ming merchants wait with cloth and grain, and the bargaining goes on across the rails."

[cities.shenyang]
name = "Shenyang"
lore = "The garrison town of Shenyang on the north bank of the Hun River, where the Liaodong post roads fork and soldiers and peddlers crowd the same street."

[cities.liaoyang]
name = "Liaoyang"
lore = "Liaodong’s yamens, granaries and post stations crowd into Liaoyang; Shenyang lies north, the road to the coast south, and the army’s grain and supplies are shared out from here."

[cities.guangning]
name = "Guangning"
lore = "A garrison town where western and eastern Liaodong meet; the flagpole before the general’s yamen stands taller than any roof in town, and at the horse market outside, soldiers look on while every animal is inspected before a sale."

[cities.yehe_city]
name = "Yehe City"
lore = "A hill fort on the Yehe River, with unbroken forest beyond its earth walls; ginseng, sable and timber are loaded here for the markets at Kaiyuan and Fushun."

[cities.tenochtitlan]
name = "Mexico City, Tenochtitlan"
lore = "Rebuilt after 1521 on the ruins of the old city in the lake, it is now the capital of New Spain; Nahua quarters and Spanish squares face each other across the canals."

[cities.cusco]
name = "Cusco"
lore = "Spanish houses and churches now rise on the stone walls of the old Inca capital; the Inca court that will not submit keeps to the forests of Vilcabamba, far away."

[cities.potosi]
name = "Potosi"
lore = "Silver was found in the Cerro Rico in 1545, and within a few years a mining town sprang up below it; mule trains and Indian miners come and go day and night."

[cities.ningyuan]
name = "Ningyuan"
lore = "A garrison town in the Liaoxi corridor. Half its grain comes overland, half by way of Juehua Island out in the sea; when the water freezes in winter, the men on the walls sleep badly."

[cities.jinzhou_west]
name = "Jinzhou"
lore = "A garrison town midway along the Liaoxi corridor, where farms and post stations by the Xiaoling River feed the soldiers passing through."

[cities.jinzhou_liaodong]
name = "Jinzhou, Liaodong"
lore = "A garrison town at the southern tip of the Liaodong peninsula; its post road runs north to Liaoyang and south to Lüshun harbor, where most ships for Dengzhou across the strait set sail."

[cities.luang_prabang]
name = "Luang Prabang"
lore = "In 1552 King Setthathirath brought the Emerald Buddha here from Chiang Mai, enshrining it in the royal city where the Nam Khan meets the Mekong."

[cities.vientiane]
name = "Vientiane"
lore = "A plains town on the middle Mekong, where monks chant beneath the old stupa outside the walls and benzoin and sticklac from the upland forests are loaded at the landings for the voyage south."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# The Jianzhou site follows the shifted Liaodong campaign, without moving the chronology of Korea or Japan.
# The Haixi Jurchen fortified centre trades forest goods within the shifted campaign chronology.
# Silver working grew after 1545 and is active in 1553; the draft's 1538 opening date is not used.
# The corridor garrison connects to Juehua's supplies within the shifted campaign.
# The Mekong town will receive the court and image in 1564; those events are not moved into 1553.

[cities.zhangzhou_city]
name = "Zhangzhou"
lore = "The prefectural city upriver on the Jiulong. Overseas goods from Yuegang change into small boats here, and when the longans ripen the whole street smells sweet; beside the Tianfei temple, schoolboys drone out their lessons from first light."

[cities.merida_city]
name = "Merida (Yucatan)"
lore = "The new town’s church and friary are built from stones pulled down from old Maya platforms. Spanish houses ring the plaza, beyond them stand Maya thatched huts and cornfields, and tribute cotton and beeswax move toward Campeche in a steady stream."

[cities.zabid_city]
name = "Zabid"
lore = "Yemen has Ottoman governors now, but Zabid’s lecture chairs are unchanged: in the red-brick colleges Shafi’i scholars teach the law and the arithmetic of dividing an inheritance, and from morning till night someone is reciting under the date palms."

[cities.chincha]
name = "Chincha"
lore = "On the dry coast south of Lima, canals bring water down from the hills to cotton fields and chili plots. The raft merchants’ yards back onto the beach, balsa rafts drawn up in rows to dry; the town empties a little each year, but the quipu accounts are still being tied, cord by cord."
