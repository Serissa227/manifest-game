# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.wonder_naruto]
name = "Naruto Whirlpools"
lore = "When the tide turns in the Naruto strait, the water twists into whirlpools, and fishing boats and pilots alike wait for slack water before they dare cross."

[discoveries.wonder_mosken]
name = "Moskstraumen"
# lore 原注：currents remain distinct from monsters.
lore = "Travelers tell of the tidal race between the Lofoten isles as an abyss that swallows ships, and Olaus Magnus drew it on his sea chart; local fishermen simply reckon the hour of slack water and row past."

[discoveries.wonder_cape]
name = "Seas off the Cape of Good Hope"
lore = "Cold and warm currents collide off the cape, the wind veers without warning, and the swells come rolling in from the southwest. Old captains never hurry a rounding; they would sooner circle in the open sea and wait for a decent day."

[discoveries.wonder_table_mountain]
name = "Table Mountain"
lore = "The summit is flat as a tabletop, and when the southeaster blows, cloud spills over its edge like a white cloth; sailors know the cloth before they see any land."

[discoveries.wonder_fuji]
name = "Mount Fuji"
lore = "The snow-capped cone stands alone above the clouds, and pilgrims in white climb it in files; a ship at sea that catches that speck of white knows Suruga Bay is not far."

[discoveries.wonder_kilimanjaro]
name = "Snow of Kilimanjaro"
# lore 原注：known to local guides long before later European reports.
lore = "Snow lies on the summit of a mountain near the equator; the people at its foot have always known it, and merchants at Mombasa have heard of a white-topped mountain far to the west."

[discoveries.wonder_vesuvius]
name = "Mount Vesuvius"
# lore 原注：without bringing the disaster of 1631 forward.
lore = "The eruption that killed the elder Pliny is written in old books; now vines cover the slopes, and people still make their homes at the mountain’s foot."

[discoveries.wonder_galapagos]
name = "Galapagos Islands"
lore = "In 1535 Bishop Berlanga’s ship drifted here becalmed: giant tortoises and sea iguanas sprawl on black volcanic rock, and the whole island offers hardly a drink of fresh water."

[discoveries.wonder_amazon]
name = "Fresh Waters at the Amazon Mouth"
lore = "Long before any shore appears, the sea turns yellow and fresh; driftwood and floating mats of weed slide past the hull, and a bucket hauled up is sweet enough to drink."

[discoveries.wonder_sargasso]
name = "Sargasso Sea"
lore = "Clumps of yellow-green weed drift past the hull, and Columbus’s sailors cheered, thinking land was near; for days it kept coming, and beneath it the water stayed bottomless."

[discoveries.wonder_icebergs]
name = "Labrador Icebergs"
# lore 原注：this is a seasonal observation area, not a fixed iceberg.
lore = "As spring turns to summer the cold current pushes icebergs to the edge of the Grand Banks fishing grounds; in the fog the boats hear the ice crack before they see it, and no one can say where it will lie this year."

[discoveries.wonder_aurora]
name = "Aurora over the Northern Sea"
lore = "In the long night green and red curtains hang from the sky, now bunched together, now shaken out into threads; northern fishermen say the dead are walking home with their lanterns."

[discoveries.wonder_great_barrier]
name = "Outer Great Barrier Reef"
# lore 原注：known to local seafarers before European charts.
lore = "Reef ridges run on as a boundary of shallows; island fishermen know the channels through them, while strangers’ ships see only a line of white breakers."

[discoveries.wonder_krakatoa]
name = "Krakatoa"
lore = "A lone volcanic island stands in the Sunda Strait, its mountain a dark shape on the water; ships running between Java and Sumatra see the black cone from afar and take it as the mark to change helm."

[discoveries.wonder_etna]
name = "Mount Etna"
lore = "The snow-topped mountain of eastern Sicily wears a thread of smoke by day and now and then a red glow by night; seamen see it from the better part of a day away and take their bearing on it."

[discoveries.wonder_mosi_oa_tunya]
name = "Mosi-oa-Tunya Falls"
# lore 原注：the later foreign name is not used.
lore = "The Zambezi throws itself over a cliff and the spray climbs higher than the rim, visible from miles away; the people there call it “the smoke that thunders.”"

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Weed drifts past the hull; the marked coordinate is an observation centre in a broad region.
# The volcanic island marks the strait; the catastrophe of 1883 is not brought forward.
