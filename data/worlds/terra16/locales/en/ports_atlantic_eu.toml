# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.london]
name = "London"
lore = "On the Thames quays, bales of wool and rolls of broadcloth are piled higher than a man. Seagoing ships wait on the tide downstream, sometimes half a day, while barges bring the cargo up in relays."
river = "Thames"

[ports.bristol]
name = "Bristol"
lore = "The tide on the Avon rises and falls so far that at ebb the whole harbor’s shipping sits on the mud. Irish hides and cloth, and the ships that probe westward into the ocean, all start out from this narrow river."
river = "Avon"

[ports.plymouth]
name = "Plymouth"
lore = "A bay at the western mouth of the Channel, where merchantmen come in for water and sail repairs. Ingots of Cornish tin stack up before the warehouses, waiting to be shipped on."

[ports.galway]
name = "Galway"
lore = "A dozen merchant families run the town, trading with the Irish lords and haggling with wine merchants from Spain. They say a prayer is cut into the west gate: “From the fury of the O’Flahertys, good Lord, deliver us.”"

[ports.antwerp]
name = "Antwerp"
lore = "Under the arcades of the Bourse the noise runs from morning to night: German copper, Netherlandish cloth and Lisbon pepper are all given a price here by shouting. Latin over the door reads: for the use of merchants of every nation and tongue."
river = "Scheldt"

[ports.amsterdam]
name = "Amsterdam"
lore = "Warehouses stand shoulder to shoulder along the IJ, full of rye from the Baltic. Most of the ships at the quay have just come home from Danzig, their decks still smelling of pine tar."

[ports.flushing]
name = "Flushing"
lore = "A harbor at the mouth of the Scheldt, where every ship bound for Antwerp must first be checked. The pilot boats put out at first light to meet the big ships and guide them around the sandbars."

[ports.dieppe]
name = "Dieppe"
lore = "Dieppe shipowners fish at sea and also sail as far as Guinea and Brazil. The chartmakers by the quay turn what sailors tell them of coasts into colored maps, so handsome that captains hesitate to take them aboard."

[ports.le_havre]
name = "Le Havre"
lore = "A harbor the king ordered cut in 1517, its piles and stonework still raw. Silt from the Seine mouth has left the old harbor’s quay steps standing on dry mud, and the big ships that can no longer get in now lie here."

[ports.saint_malo]
name = "Saint-Malo"
lore = "The whole town is shut inside its stone walls, with the sea slapping the foot of them at high tide. Each spring the shipmasters sail for the Newfoundland cod grounds and come back in autumn with salted fish for the towns of Brittany."

[ports.nantes]
name = "Nantes"
lore = "Wine, salt and grain come down the Loire and are shifted at Nantes from flat river boats to seagoing ships. The two kinds of vessel lie jammed along the quay, and the porters shout in two different accents."
river = "Loire"

[ports.la_rochelle]
name = "La Rochelle"
lore = "Dazzling white salt pans and cellars full of casks keep this port alive. The psalms sung in the churches are no longer the same ones, and greetings between neighbors grow shorter each year."

[ports.bordeaux]
name = "Bordeaux"
lore = "The Garonne makes a great bend below the town, and casks of wine line the bank for a long way, waiting to be loaded onto barges and carried out to sea by the Gironde."
river = "Garonne"

# Original Amsterdam note ("still a Habsburg port, not yet a republic") kept for authors only.
