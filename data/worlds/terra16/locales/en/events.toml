# 英文覆盖：寰宇的行情事件（对应同目录上两级的 events.toml）。格式：[events.<key>] 覆盖 name、description。
# S01（2026-11-10）：寰宇的新文案本来只写中文；events.toml 是六份基础配置之一，基础配置的英文覆盖必须逐字段闭合
#（manifest-data --test terra16_base），所以这里照原文补了简短的英文。别的 S01 文案（奇遇）没有英文覆盖，缺译回退中文。

[events.monsoon_late]
name = "The Monsoon Comes Late"
description = "The southwest monsoon arrived more than a month late. Fields along the Indian coast have cracked, and pepper vines, indigo and cinnamon groves have all yielded poorly."

[events.monsoon_gales]
name = "Monsoon Gales"
description = "This season the monsoon came early and hard; of every ten ships that put out, two or three limp home dismasted. The old pilots say it is time to close the sea."

[events.typhoon_run]
name = "A Run of Typhoons"
description = "Since the start of summer one great wind has followed another across the southern sea. Fishermen have hauled their boats up the beach, and merchants draw lots at the temple to learn when they may sail."

[events.storm_year]
name = "A Year of Storms"
description = "The island elders say the seabirds came home too early this year. From the Lesser Antilles to the Florida Straits, not one month has been quiet."

[events.locust_swarm]
name = "Locust Swarm"
description = "Where the locusts have passed, only stalks are left standing. Grain prices change by the day, and even hemp and cotton have been gnawed to rags."

[events.pepper_blight]
name = "Poor Pepper Harvest"
description = "The pepper vines in the hills have set little fruit this year. Buyers waited half a month on the quay and saw barely a third of the usual crop."

[events.silkworm_blight]
name = "The Spring Silk Fails"
description = "A late frost killed the mulberry buds, and silk-rearing households tipped their trays of worms into the river. This year there is only half the usual new silk."

[events.sugar_bumper]
name = "A Bumper Sugar Year"
description = "The cane stands thick and sweet this year. The oxen at the mills work day and night, and sugar loaves are stacked to the rafters."

[events.herring_run]
name = "The Herring Run"
description = "The herring shoals came early and thick this year, and the boats return with water lapping at the gunwales. There are not enough barrels, and coopers ask double wages."

[events.kiln_sealed]
name = "The Kilns Go Cold"
description = "The imperial factory is rushing an urgent court order, and every master firer in the private kilns has been called away. Most kilns in town stand sealed; the porcelain dealers have only two words: no stock."

[events.treasure_fleet]
name = "The Silver Fleet Arrives"
description = "The Indies fleet has entered the river. Chests of silver roll to the House of Trade by the cartload; sailors, creditors and merchants of every nation crowd the streets, and everything finds an eager buyer."

[events.spice_fleet_home]
name = "The Spice Ships Come Home"
description = "The great ships from India have entered the Tagus, and the India House has kept its doors open for days. Pepper is sold by the heap, and every buyer is waiting for a lower price."

[events.tribute_ships]
name = "Tribute Ships in Port"
description = "The envoys’ ships have come in, and the maritime trade officials are busy checking the tribute. The goods they carry may be sold outside the hostel, and merchants from the whole countryside have hurried in."

[events.nanban_ship]
name = "A Nanban Ship in Port"
description = "A great black ship has dropped anchor, crewed by men with red hair and high noses. Raw silk, guns and glassware are laid out one by one, and the buyers of every house hurry to the port overnight."

[events.pilgrim_market]
name = "The Pilgrim Season Market"
description = "Pilgrims have gathered at the port from every quarter. Those waiting for ships, those waiting for caravans and those trading along the way have packed the market tight."

[events.brabant_fair]
name = "The Brabant Fair"
description = "The fair has opened. English cloth, South German copper and Portuguese spices all change hands in these few weeks, and even the stables in town are full of merchants."

[events.baltic_grain_rush]
name = "The Rush for Northern Grain"
description = "News of failed harvests in the south has arrived, and grain ships sail into port one after another. Lines form at the granary doors, and the dealers change their prices three times a day."

[events.sea_ban_tightened]
name = "The Sea Ban Tightens"
description = "The coastal patrol has added warships, and notices are posted at every port: duties on foreign goods are doubled, and ships without a license will be seized. The brokers’ doors stand quiet."

[events.plague_closure]
name = "Plague Closes the Port"
description = "Plague has broken out in the city. The health officers have sealed the quays, and arriving ships must wait at anchor to be inspected. Seven shops in ten are shut, and no one has the heart to buy."

[events.crown_default]
name = "The Crown Suspends Payment"
description = "The royal treasurer has announced that loans falling due will not be paid in coin but converted into annuities. The great lending houses are short of money overnight, and interest rises everywhere."
