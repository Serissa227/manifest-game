# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.bergen]
name = "Bergen"
lore = "The timber houses on the Bryggen quays are stacked with stockfish from the north, hard enough to rap like boards. The Hanseatic offices allow no fire, and the apprentices keep the books in the cold."

[ports.copenhagen]
name = "Copenhagen"
lore = "Every ship passing the Sound pays toll at Helsingør, where a clerk counts hulls through his window. The money keeps the royal yards at Copenhagen running, and most of the keels standing on the slips are the king’s warships."

[ports.stockholm]
name = "Stockholm"
lore = "The town is squeezed onto a few small islands at the outlet of Lake Mälaren, its lanes too narrow for two carts to pass. Copper ingots, iron bars and timber from the mining country flow out through it into the Baltic."

[ports.lubeck]
name = "Lubeck"
lore = "The Trave links one red-brick warehouse after another to the Baltic. Lübeck’s councilmen sit in the shadow of the brick churches and settle the year’s prices for the whole Hanse."
river = "Trave"

[ports.hamburg]
name = "Hamburg"
lore = "A port on the Elbe, where grain and beer come downriver from inland and are shifted to North Sea ships. Hamburg beer is famous far and wide, and the casks on the quay are stacked as high as masts."
river = "Elbe"

[ports.danzig]
name = "Danzig"
lore = "Vistula grain boats unload at Granary Island, where rows of tall brick stores hold Polish rye. The Dutch watch the prices here most closely: when the market moves, the price of bread in Amsterdam follows."
river = "Motlawa, Vistula system"

[ports.riga]
name = "Riga"
lore = "After the spring flood the Daugava is covered with rafts bringing flax and hemp from inland. The raftsmen go ashore to drink, while the Hanseatic storekeepers count bundles along the bank and will not give one more than is due."
river = "Daugava"

[ports.narva]
name = "Narva"
lore = "The Narva is so narrow that a shout carries to the far bank: Hermann Castle on this side, Ivangorod on that, gun muzzle to gun muzzle. Merchants cross to trade with the sentries of both sides watching."
river = "Narva"

[ports.st_nicholas]
name = "St Nicholas Anchorage"
lore = "The bells of St Nicholas Monastery carry across the anchorage at the mouth of the Northern Dvina. Monks and fishermen dry cod on the shore, and in the few weeks of summer navigation Muscovite merchants float furs and beeswax down the river and wait on the bank for ships."
river = "Northern Dvina mouth"

[ports.arkhangelsk]
name = "Arkhangelsk"
lore = "Beside the monastery at the mouth of the Northern Dvina, the new timber walls still smell of resin. In the short summer English and Netherlandish ships fill the bay to trade for furs, hemp and tar, and leave at the first cold."
river = "Northern Dvina"

[ports.hafnarfjordur]
name = "Hafnarfjordur"
lore = "A small bay in Iceland, with cod hung out to dry along the shore and sulfur brought in barrel by barrel from the volcanic country; whale tusks come round from the north wrapped in hides. Hamburg men and Englishmen have fought for years over its berths."
