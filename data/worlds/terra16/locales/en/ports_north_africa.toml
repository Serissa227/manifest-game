# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.tangier]
name = "Tangier"
lore = "A strait port the Portuguese have held for over eighty years. By day the sentries on the wall watch Moroccan herdsmen drive in sheep to sell; by night they watch the same men’s torches."

[ports.ceuta]
name = "Ceuta"
lore = "The castle of Ceuta stares across the strait; timber and grain come by ship from Iberia, and the Moroccan markets fill the gaps. Half the garrison’s bread is ground from wheat grown on the far shore."

[ports.mazagan]
name = "Mazagan"
lore = "The Portuguese bastions are new and the walls thick and low, closing in a small patch of ground. Beyond them lies nothing but Moroccan fields, and when the garrison is besieged it lives on what the great underground cistern holds."

[ports.oran]
name = "Oran"
lore = "The Spanish garrison is cooped up in the harbor fort and must buy its grain from the tribes outside, through a layer of local brokers. The soldiers have swords and cannon; what they lack is bread."

[ports.tripoli_port]
name = "Tripoli"
lore = "In 1551 Tripoli was lost by the Knights, and an Ottoman flag went up on the wall. The castle the Knights built still stands in the old town, now held by the Sultan’s troops."

[ports.algiers]
name = "Algiers"
lore = "Galleys lie mast to mast behind the mole. Of the ships that return, some carry cargo in their holds and some carry captives in chains, waiting to be ransomed. Andalusian exiles live in the lanes, speaking with the accent of Granada."

[ports.tunis]
name = "Tunis"
lore = "The Hafsid king still lives in the city, but La Goulette, the gate to the sea, flies the Spanish flag. When the king passes through the sea gate, he first has to read the Spanish commander’s face."

[ports.sale]
name = "Sale"
lore = "The bar at the mouth of the Bou Regreg is shallow, and deep-draft ships cannot cross; they watch small boats carry the wool and hides out trip after trip. Every year a few ships that refuse to believe it end up aground on the bar."
river = "Bou Regreg"

[ports.tetouan]
name = "Tetouan"
lore = "Tetouan was rebuilt by those who fled Granada, and its white houses, courtyard orange trees and fountains are copied from the homes they remember. The Martil river is shallow, so goods are shifted to small boats at its mouth."
river = "Martil"

[ports.alexandria]
name = "Alexandria"
lore = "The ancient lighthouse fell long ago and a fortress stands on the spot, so ships find the harbor at night by the fire on its walls. Cargo from the Nile reaches the sea by canal and pack road, and the warehouses smell of pepper and rust."
