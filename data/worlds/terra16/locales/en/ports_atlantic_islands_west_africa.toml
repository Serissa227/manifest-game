# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.funchal]
name = "Funchal"
lore = "Madeira’s slopes are cut into terraces, and channels lead mountain water to the sugar mills’ wheels. Most of the sugar goes north to Antwerp."

[ports.angra]
name = "Angra do Heroismo"
lore = "On Terceira in the Azores, ships wait all year in the sheltered bay for fleets to come. Big ships back from India and the Indies take on water here, put off their sick, and wait for the escort warships."

[ports.ribeira_grande]
name = "Ribeira Grande"
lore = "A small town in a valley of Santiago, where the ships bound for Guinea and those bound for Europe part ways. Cloth and ivory from the coast, and people in chains, change hands here and go on."

[ports.sao_tome]
name = "Sao Tome"
lore = "The furnaces of the island’s sugar mills never go out, and the work of pressing cane by day and boiling sugar by night falls mostly on people seized from the mainland. When a sugar ship clears the harbor, the sweet scorched smell hangs in her hold long after."

[ports.elmina]
name = "Elmina"
lore = "The white fort by the sea is the Portuguese trading post. Local traders bring gold down from the interior and weigh it out against cloth and brass basins; the fort’s guns, however big, cannot reach the forest behind it."

[ports.las_palmas]
name = "Las Palmas"
lore = "Ships bound for the Indies stop here for water and sail repairs before daring the open ocean. Cane fields run one into the next along the foot of the hills, and the creak of the pressing mills carries down to the shore."

[ports.ughaton]
name = "Ughoton"
lore = "The Benin king’s trading station sits on a creek, where ivory and brass bracelets are sent down in crate after crate. Anyone who wants an audience changes boats here, goes upriver, then walks some way before reaching the royal city."
river = "Ovia, Benin river system"

[ports.mpinda]
name = "Mpinda"
lore = "A small port on the south bank of the Congo mouth, with a church built by Portuguese priests. Ivory, copper and captives come down the pack road from the interior, and cloth and shell money go back."
river = "Congo"

[ports.luanda]
name = "Luanda Anchorage"
lore = "A long sandy island lies across the front of the bay. Its people dredge small snail shells from the shallows and polish them for money, which passing merchants buy with cloth and ironware."
