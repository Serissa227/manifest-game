# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.maize]
name = "Maize"
description = "Maize grows taller than a man in the fields of the Americas and is ground into meal for flat cakes; Spanish ships have long since carried seed across the Atlantic, and some farmers on the Iberian field edges are trying it."

[goods.potato]
name = "Potatoes"
description = "Andean farmers grow these tubers, freezing and drying them into chuño that keeps for years; few Europeans have yet seen one."

[goods.coffee]
name = "Coffee Beans"
description = "Coffee is grown in the Yemeni hills and shipped out of the Red Sea ports; Sufis drink it to stay awake through their night recitations, and coffeehouses are springing up in Cairo and Istanbul."

[goods.vanilla]
name = "Vanilla Pods"
description = "The Totonacs gather long black vanilla pods in the forests of the Gulf coast; crushed into a cup of cacao, they perfume the whole drink."

[goods.cochineal]
name = "Cochineal"
description = "Powdery white insects cling to cactus pads; scraped off, dried and crushed they yield a deep red, and among the goods shipped from New Spain only silver ranks above them."

[goods.dyewood]
name = "Red Dyewood"
description = "Sappanwood and brazilwood both split to a red heart, and their shavings steeped in water dye cloth red; a master dyer needs only to look at a pinch and smell it to tell whether it is from the South Seas or from Brazil."

[goods.mahogany]
name = "West Indian Hardwood"
description = "Felled Caribbean and Central American hardwoods are floated down the rivers in rafts, and once polished their red-brown grain shines like satin; shipwrights and chest makers alike scramble for them."

[goods.flax]
name = "Flax"
description = "Flax fields in blue bloom are cut and left to rot in ponds, and the fibers drawn out are woven into fine linen and sailcloth; even worn-out linen ends up pulped for paper."

[goods.hemp]
name = "Hemp Fibre"
description = "Coarse hemp fiber is twisted strand by strand into cable and woven into canvas; the walls of every rigger’s shop hang with coils of it, and no harbor can do without this plain cargo."

[goods.quinine]
name = "Medicinal Willow Bark"
description = "Willow bark is stripped from the riverbanks and dried, then chopped by the apothecary and brewed against fever and aching joints; the physicians say the recipe has been in the Materia Medica for ages."

[goods.gold_ore]
name = "Gold-bearing Ore"
description = "Gold dust is washed from West African riverbeds and gold-bearing rock is cut from southern African pits, and local caravans hand it on stage by stage toward the coast."

[goods.silver_ore]
name = "Silver Ore"
description = "The silver mountain of Potosí has been worked since 1545, its ore carried down by mule trains; Iwami in Japan is famed for silver too, and the shafts at both go deeper every year."

[goods.gems]
name = "Uncut Gems"
description = "Stones dug from the mines of India and Ceylon look dull and gray; merchants weigh them on small scales and hold them to the light, grading them before they go off to be cut and polished."

[goods.quartz_sand]
name = "Silica Sand"
description = "Glassmakers pick only clean white silica sand and mix it with plant ash shipped from the Levant to melt a clear glass."

[goods.star_crystal]
name = "Sky-fallen Stone"
description = "In 1492 a great black stone fell in a field at Ensisheim and was carried into the church; collectors treasure the green glass stones of Bohemia as well."

[goods.whale_oil]
name = "Whale Oil"
description = "Each summer Basque whalers sail to the bays of Labrador, render blubber in great cauldrons on shore, and ship the oil home in casks for Europe’s lamps."

[goods.kaolin]
name = "Porcelain Clay"
description = "White earth dug from the Gaoling hills is first pounded, then washed, then blended before the potter may take it to the wheel; in Jingdezhen they say that with the wrong clay the hottest kiln fire is wasted."

[goods.relics]
name = "Antiquities"
description = "Old coins and broken inscriptions turned up by Roman and Athenian plowmen only gain a price in a collector’s hands; one that can be traced to a named city or tomb fetches a good deal more."

# 商品类别沿用原始内部键，仅覆盖显示名称。
[categories]
"原料" = "Raw Materials"
"嗜好品" = "Indulgences"
"奢侈品" = "Luxuries"
"矿产" = "Minerals"
"粮食" = "Food"
