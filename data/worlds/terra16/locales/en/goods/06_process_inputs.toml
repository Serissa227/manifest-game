# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.paper]
name = "Paper"
description = "Italian mills pound rags to pulp and lift crisp white sheets from the vat; East Asian paper is made from bamboo and bark fiber, soft yet tough. Venetian bookshops and Jiangnan printers alike order from the mills in advance."

[goods.lacquer]
name = "Raw Lacquer"
description = "Cut a lacquer tree and a grayish sap runs out that blackens in the air; it raises an itching rash on bare skin, so tappers keep their hands wrapped, and the lacquerer will not touch it until it has been strained and sunned."

[goods.charcoal]
name = "Charcoal"
description = "Charcoal burners stack wood in a round mound, cover it with earth and let it smolder for days, watching it day and night; iron furnaces and powder works both depend on what comes out."

[goods.calamine]
name = "Calamine"
description = "Zinc-bearing ore baked with copper in a closed furnace turns the copper into golden brass; the brassworkers of Aachen and Nuremberg cannot do without it."

[goods.lead_ore]
name = "Lead Ore"
description = "Shiny gray lead ore breaks under the hammer into little cubes; smelted into lead, it serves for shot and helps the silver refiner draw silver out of the dross."

[goods.lead]
name = "Lead"
description = "Gray-white lead ingots, heavy in the hand, go to the smelting yards to help refine silver by cupellation, and to the print shops, where they are melted into the alloy for type."

[goods.olives]
name = "Olives"
description = "Olives from Mediterranean groves are cured for the table or pressed for cooking oil, lamp oil and soap; once winter comes, the millstones in the oil presses never stop turning."

