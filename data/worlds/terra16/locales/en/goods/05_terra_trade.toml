# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.cloves]
name = "Cloves"
description = "Clove trees in the Moluccas scent whole hillsides when they flower, and the dried buds go off in small bags along the island trade routes to Malacca, then scatter to the ports of the Indian Ocean."

[goods.nutmeg]
name = "Nutmeg"
description = "When a Banda nutmeg fruit splits open, a red lace of mace wraps a hard kernel; distant merchants want both, and price each separately."

[goods.cinnamon]
name = "Cinnamon"
description = "Ceylon’s peelers strip the inner bark of the cinnamon tree into long slivers that curl into rolls as they dry; on the Colombo quays the sweet sharp smell drowns out the fish."

[goods.ginger]
name = "Ginger"
description = "The ginger fields of India and Ming China are dug when the season comes; fresh root goes to the table and dried root goes aboard ship, where a sailor chews a slice in the wind to warm himself."

[goods.saffron]
name = "Saffron"
description = "Each saffron flower yields just three red threads, picked at dawn, teased out by hand and dried; a pound takes tens of thousands of blossoms, so how could it be cheap?"

[goods.frankincense]
name = "Frankincense"
description = "Cut a slit in the bark of a Dhofar frankincense tree and white resin seeps out slowly, setting into tears; churches burn it and apothecaries use it too."

[goods.sandalwood]
name = "Sandalwood"
description = "Timorese sandalwood is felled, stripped to its yellow-brown heartwood and shipped out through the ports of Southeast Asia; the fragrant timber of southern India has its own buyers."

[goods.camphor]
name = "Camphor"
description = "Sumatran barus camphor and the camphor of Fujian and Kyushu each have their own coolness; seasoned spice dealers open the bundle and sniff, never trusting the wrapping cloth alone."

[goods.musk]
name = "Musk"
description = "Musk pods come from the males of a mountain deer, the mouth of the hide cinched shut with thread and the packets passed from hand to hand; the smell is overpowering, and one packet costs more than several chests of ordinary goods."

[goods.ivory]
name = "Ivory"
description = "Tusks are carried one by one from inland Africa to the coast, where carvers cut them into saints, combs and chess pieces and inlay workers set slivers into wooden boxes."

[goods.ebony]
name = "Ebony"
description = "Ebony felled on the East African coast has a pale outer layer and a heart as black as lacquer; carpenters make inlay, pen cases and instrument necks from it."

[goods.ambergris]
name = "Ambergris"
description = "A fisherman picks up a gray, waxy lump on the beach that others would call rubbish, and the spice merchant offers its weight in gold; no one dares promise a supply of ambergris."

[goods.narwhal]
name = "Unicorn Horn (Narwhal Tusk)"
description = "A long spiral horn brought south by northern merchants; ground to powder it is said to defeat any poison, and princes pay fortunes for it, though some northern sailors whisper it comes from a tusked whale of the Arctic seas."

[goods.rice]
name = "Rice"
description = "Paddy from the fields is loaded on boats, floated downriver and then sent on by sea; when a neighboring port has a lean year, it often relies on rice from Siam and Bengal to fill the gap."

[goods.olive_oil]
name = "Olive Oil"
description = "Stone mills crush the olives, and the first pressing runs pale green and clear into clay jars; one jar serves for frying fish on the hearth and for burning in the lamp."

[goods.horses]
name = "Warhorses"
description = "Arabian horses are shipped from Hormuz to India, and the official pastures of Jeju raise Korea’s warhorses; one horse takes the berth space of several men and needs tending all day long."

[goods.copper]
name = "Refined Copper"
description = "Ore is melted into copper that smokes green and poured into molds to set as bright red cakes; gunfounders cast cannon from it and brass shops mix it with calamine."

[goods.tin]
name = "Tin"
description = "Tin sand is washed from Malay riverbanks and Cornish pits and smelted on the spot into silvery ingots; mixed with copper, it casts bells and cannon alike."

[goods.mercury]
name = "Mercury"
description = "Many of the Almadén miners are convicts, and their hands shake and their teeth loosen; the mercury refined there is poured into leather bags, sealed tight and shipped to silver mines elsewhere to extract the metal."

[goods.alum]
name = "Alum"
description = "In the pope’s mines at Tolfa and the pits of Asia Minor, white rock is calcined and steeped until it crystallizes into alum; dyers need it to make color bite into cloth, and tanners cannot do without it either."

[goods.mastic]
name = "Chios Mastic"
description = "Villages in southern Chios cut the bark of the trees for this resin, which leaves a clean taste when chewed; it is quite a different thing from Arabian frankincense."

[goods.emerald]
name = "Emeralds"
description = "Green stones are dug from the hills around Chivor in New Granada, deep as new leaves, and muleteers haul them over the mountains to Caribbean ports."

[goods.jade]
name = "Jade"
description = "Mesoamerican craftsmen value green jade above gold; white jade from Khotan crosses the deserts by camel train and ends up in the workshops of Ming China."

[goods.obsidian]
name = "Obsidian"
description = "Obsidian flakes into blades thinner and sharper than a razor; Mesoamerica’s knives, arrowheads and ritual vessels depend on it, and cities trade it among themselves."

[goods.feathers]
name = "Precious Feathers"
description = "Nahua featherworkers glue the long tail plumes of the quetzal into headdresses one by one; birds-of-paradise plumes from New Guinea are sold on by hand after hand through the neighboring islands."

[goods.cowries]
name = "Cowries"
description = "Maldivian islanders spread cowrie shells on the beach to dry and ship them out by the shipload; in Bengal and inland Africa, a string of shells is a sum of money."

[goods.pitch]
name = "Tar and Pitch"
description = "Northerners pile pine in earth kilns and let it smolder until black, sticky tar runs out; the whole Bergen waterfront stinks of it, and hulls and cables owe their lives to it."

[goods.carpets]
name = "Carpets"
description = "At their looms Safavid and Ottoman weavers count knots under their breath, dozens to the inch, and a single carpet can take most of a year; a Kashan silk carpet, once finished, is usually crated and sent to a palace."

[goods.calico]
name = "Printed Cotton"
description = "A wooden block dipped in dye is pressed to the cloth while wax or mud covers the parts meant to resist; Indian printed cotton stays bright through wash after wash, and buyers in every Asian port know it for that."

[goods.lacquerware]
name = "Lacquerware"
description = "A coat of lacquer on a wooden core, left to dry, then another; Japanese lacquerers sprinkle gold powder to draw their designs and Ming craftsmen carve layer upon layer of cloud scrolls."

[goods.swords]
name = "Swords"
description = "The trade says a Toledo blade will bend into a bow, a Sakai sword will cut through a copper coin, and a Damascus blade carries a pattern like water; whether a piece is genuine is judged by its edge and the maker’s mark."

[goods.arquebus]
name = "Matchlock Arquebuses"
description = "In Europe the matchlock has long been standard army kit; since the Portuguese brought the first ones to Japan in 1543, smiths there have been copying them."

[goods.ginseng]
name = "Ginseng"
description = "A fine root must be wrapped in moss the day it is dug and hurried to the horse market, for waiting cuts its price; the gatherers of Korea and the Jurchen lands spend months at a time in the mountains."

[goods.sable]
name = "Sable Pelts"
description = "In deep winter hunters trudge through the snow setting traps, and a good sable pelt must be glossy and unmarked; sables from Jianzhou, Yehe and Rus often change hands at frontier markets such as Kaiyuan."

[goods.beeswax]
name = "Beeswax"
description = "The Maya of Yucatán keep stingless bees, and in the forests of Rus men climb trees for wild combs; the wax rendered from them becomes candles, sealing wax and casting patterns."

[goods.orichalcum]
name = "Orichalcum"
description = "Plato’s Critias describes the orichalcum of Atlantis as once prized second only to gold; no ordinary ore merchant has seen it."

