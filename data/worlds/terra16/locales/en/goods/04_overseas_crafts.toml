# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.rum]
name = "Grape Brandy"
description = "A copper still full of wine drips out well under half its volume in strong spirit; merchants stow the wax-sealed little casks in the hold, and no one thinks of them more than the sailors."

[goods.chocolate]
name = "Prepared Cacao"
description = "Ground cacao paste is stirred into hot water and whipped to a froth; the kitchens of New Spain found it too bitter and added cane sugar."

[goods.cigars]
name = "Tobacco Rolls"
description = "Caribbean islanders wrap tobacco leaf in dry palm husk and roll it into thick tubes to smoke from one lit end; the spare ones are tied twenty to a bundle. Captains dread fire in the hold but cannot stop what the crew puts in their mouths."

[goods.gold_ingot]
name = "Gold Ingots"
description = "Washed gold dust is melted into molds and cast into finger-thick bars, each one sealed; easy to carry and easy to weigh, they are the form long-distance caravans and goldsmiths trust."

[goods.silver_ingot]
name = "Silver Ingots"
description = "Silver ore is smelted and cupelled until a bright white cake of metal remains in the furnace, then cast into ingots and stamped; this is how silver from Potosi and Japan finds its way to every market."

[goods.jewelry]
name = "Jewellery"
description = "One ruby may hang from a Venetian lady’s ear or be pinned to a nobleman’s turban in Delhi; the goldsmith always asks about his customer’s dress and custom before he starts work."

[goods.scarlet_cloth]
name = "Scarlet Woollen Cloth"
description = "Thick woolen cloth of fine fleece is dipped in red dye and mordanted again and again until it takes a deep red like pomegranate seeds; rich householders and Church dignitaries love it best."

[goods.sailcloth]
name = "Sailcloth"
description = "Hemp is woven dense and stiff enough to withstand ten days of storm; before sailing a ship always stows an extra roll, because wind tears and sails must be mended."

[goods.rope]
name = "Rope"
description = "The rope-maker walks backward, twisting hemp strands into a long cable as he goes, then brushes it with tar to keep the water out; the ropewalk is a shed as long as an alley, one end of the cable in his hands and the other still hooked to the spinning wheel."

[goods.medicine]
name = "Apothecary Preparations"
description = "On the apothecary’s shelves, sealed jars and sharp-smelling packets are stacked layer upon layer; the druggist weighs by the book and mixes his infusions and salves."

[goods.brass]
name = "Brass"
description = "Instrument makers engrave scales on brass, and shops cast door knockers and candlesticks from it; it shines like gold at a fraction of the price."

[goods.glass]
name = "Glass"
description = "The glass furnaces of Murano burn day and night and blow cups so thin that light passes through; Venice does not let its craftsmen leave the island freely, for fear the secrets get out."

[goods.instruments]
name = "Navigational Instruments"
description = "Craftsmen in Lisbon and Nuremberg engrave hair-fine scales into brass discs; pilots measure stars with them and take their heading from the compass needle, where a mistake of one mark is twenty miles."

[goods.crystal_lamp]
name = "Murano Glass Lamp"
description = "A bell-shaped glass shade sits in a brass frame; when the oil is lit the light breaks into a golden scatter that falls just on the captain’s open ledger."

[goods.porcelain]
name = "Porcelain"
description = "Blue-and-white plates change hands in ports across Asia, each wrapped in straw and packed in a crate; Portuguese merchant ships carry the finest of them all the way home to Lisbon."

[goods.books]
name = "Books and Manuscripts"
description = "Printed sheets and copyists’ vellum volumes stack up in the warehouse; damp is a book’s worst enemy, so the bookseller wraps them in layer after layer of oilcloth before he lets them into the hold."

# 商品类别沿用原始内部键，仅覆盖显示名称。
[categories]
"加工品" = "Manufactures"
"奢侈品" = "Luxuries"
