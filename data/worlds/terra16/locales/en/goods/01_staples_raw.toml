# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.grain]
name = "Grain"
description = "Granaries line the Danzig waterfront shoulder to shoulder while Dutch ships wait to load; the wheat fields of inland Iberia feed the coastal towns and the fleets that put out from them."

[goods.timber]
name = "Timber"
description = "Masts must be straight old Baltic pine and frames must be oak; logs are lashed into rafts and floated down to the river mouths, then shipped on to the yards of western Europe."

[goods.cotton]
name = "Cotton"
description = "When the bolls split in Gujarat and Bengal the fields turn white; women spin the fiber into thread under the eaves, weavers make it into cloth, and ship after ship carries it across the Indian Ocean."

[goods.sugarcane]
name = "Sugar Cane"
description = "The sugar mills of Madeira and coastal Brazil depend on cane, and most of the hands in the fields and mill houses are enslaved, some seized along the coast, others shipped from Africa."

[goods.iron_ore]
name = "Iron Ore"
description = "Swedish miners hack black iron ore out of the mountainside; beside Japanese mountain streams, smiths wash heaps of iron sand, and each is carted to its own furnace."

[goods.copper_ore]
name = "Copper Ore"
description = "Peacock-green copper ore is carted from central Europe and Sweden into the smelting yards and cast into ingots, which big houses such as the Fuggers then ship on to every market."

[goods.wool]
name = "Wool"
description = "Castile’s flocks climb to the hills and come down again twice a year, and their wool is shipped from Bilbao; English wool goes to weavers at home and in the Low Countries."

[goods.cocoons]
name = "Silkworm Cocoons"
description = "White cocoons lie piled like hillocks in the silk rooms and must be softened in hot water and reeled into thread before they ever reach a loom; Jiangnan and Italy work the same way."

[goods.tea]
name = "Tea"
description = "Ming tea is shipped all over East Asia, pot after pot in the teahouses; in Europe, people have at most heard travelers gossip about this scalding drink of leaves."

[goods.spice]
name = "Black Pepper"
description = "Pepper from Calicut and Sumatra is dried, bagged and carried over the Indian Ocean, some of it to the Red Sea, some to Lisbon, where the king’s storehouse takes its share."

[goods.fish]
name = "Dried and Salted Fish"
description = "Bergen stockfish is hard as kindling and has to be beaten soft with a mallet before it goes in the pot; salted fish from the Grand Banks fills the holds of North Atlantic sailors."

[goods.salt]
name = "Salt"
description = "In the Setúbal salt pans the workers let the summer sun turn seawater into a white sheet, which they sell to the fish-curing ports; in Ming China salt is a state monopoly, and a merchant without a salt certificate cannot move a single sack."

[goods.fur]
name = "Furs"
description = "Pelts from the northern forests are counted by the piece in Muscovite warehouses and bundled off south and toward Liaodong; the colder the winter, the thicker the fur and the higher the price. Sable is a costlier trade of its own."

[goods.grapes]
name = "Grapes"
description = "Grapes picked in September are carried in baskets to the wine press; the rest are laid on rooftops to dry into raisins or steeped in sugar syrup."

[goods.cocoa]
name = "Cacao Beans"
description = "In Mesoamerica cacao beans are whipped into a thick, foaming drink, and also pass as money: everyone in the market knows how many beans a turkey costs."

[goods.tobacco]
name = "Tobacco Leaves"
description = "Peoples of the Americas roll and light these leaves to smoke them, and use them in offerings and cures; sailors from across the ocean have picked up the habit, but few in European ports will buy them."

[goods.amber]
name = "Amber"
description = "After a Baltic storm, fishermen gather honey-colored amber from the beach the next morning; it goes through Danzig to be polished into prayer beads and jewelry."

[goods.pearl]
name = "Pearls"
description = "Divers in the Persian Gulf hold their breath to the seabed and bring up pearls that leave through Hormuz; the river pearls of Liaodong show up only in frontier markets and tribute lists."

[goods.coral]
name = "Red Coral"
description = "Mediterranean fishermen drag cross-shaped wooden frames over the seabed to bring up branches of red coral; merchants string it into beads, and buyers as far off as the Indian Ocean scramble for them."

[goods.sulfur]
name = "Sulphur"
description = "The sulfur pits beside the volcanoes of Sicily and Japan stain the miners’ faces yellow; powder makers pound it together with saltpeter and charcoal into black powder."

[goods.saltpeter]
name = "Saltpetre"
description = "Indian saltpeter earth is leached and boiled down to gray-white crystals, and saltpeter works operate elsewhere too. Magistrates and garrisons alike keep their eyes on where this ingredient of gunpowder goes."

[goods.herbs]
name = "Medicinal Herbs"
description = "Dried herb bunches hang from the apothecary’s beams, and the assistants wrap and seal them by the herbal; Indian aromatics and East Asian medicines travel their own trade routes."

[goods.indigo]
name = "Indigo"
description = "Cut indigo plants rot in stone vats and the dark sludge is dried into cakes; a dyer’s fingers stay stained blue for months."

# 商品类别沿用原始内部键，仅覆盖显示名称。
[categories]
"原料" = "Raw Materials"
"嗜好品" = "Indulgences"
