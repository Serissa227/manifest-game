# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[goods.yarn]
name = "Cotton Yarn"
description = "Spinning wheels hum and the slivers of cotton are drawn out into fine thread, skein after skein for the weavers; Gujarat’s yarn and cloth have long been sold across the sea."

[goods.cloth]
name = "Cotton Cloth"
description = "Indian cotton cloth passes almost as currency in the ports of Asia; in Jiangnan the looms clack in every household, and the plain everyday cloth they turn out piles up in the drapers’ shops."

[goods.garments]
name = "Garments"
description = "The same bolt of cloth becomes a close-waisted doublet in Venice, a wide-sleeved gown in Ming China, and in Istanbul a long robe you can sit cross-legged in."

[goods.pig_iron]
name = "Pig Iron"
description = "Ore and charcoal burn white-hot in the furnace, the iron runs into channels of sand and sets in clumsy blocks; to become tools it must still go to a smith."

[goods.ironware]
name = "Iron Tools and Pots"
description = "Iron pots, plowshares and hoe blades go fastest at the frontier markets; the court fears such iron will turn into blades and arrowheads and keeps a tight grip on what is sent to Mongol and Jurchen lands."

[goods.cannon]
name = "Cannon"
description = "In the Venetian Arsenal and the Ottoman foundries, copper and tin are melted to a golden-red liquid and poured into clay molds; once cool, it is a heavy bronze gun."

[goods.raw_silk]
name = "Raw Silk"
description = "Reelers sit beside their pans of hot water drawing out the filaments one by one; bales of raw silk from Jiangnan and Persia travel the longest trade routes."

[goods.silk]
name = "Silk"
description = "Satin from Jiangnan, velvet from Italy, patterned silk from Persia, each with its own pedigree of designs; wearer and giver alike can tell at a glance where a piece came from."

[goods.brocade]
name = "Brocade"
description = "Colored silk threaded with gold and silver wire, a few inches a day on the loom; only courts and the very rich can afford the patterns that come off it."

[goods.sugar]
name = "Cane Sugar"
description = "Cane juice is boiled down pan after pan and poured into conical clay molds to set; sugar from Madeira and Brazil leaves the mills in this form for the markets of the Atlantic."

[goods.candy]
name = "Candied Fruit"
description = "The confectioner at the apothecary’s steeps apricots, orange peel and young ginger in syrup and packs them into little boxes; no distinguished guest’s table is without a dish."

[goods.planks]
name = "Planks"
description = "One sawyer stands above the pit and one below, and between them they pull a log apart into even boards; hulls, cargo chests and quay decking all depend on them."

[goods.furniture]
name = "Furniture"
description = "Carpenters bind boards with iron corners and nail them into chests, cupboards, tables and chairs; in the port warehouses the first to sell out are the stout chests that will not crush or rot in the rain."

[goods.gunpowder]
name = "Gunpowder"
description = "Saltpeter, sulfur and charcoal are ground into a bag of black powder that a breath of damp can ruin; the buyer takes a pinch and sets it alight to see whether it flashes fast enough."

[goods.wine]
name = "Wine"
description = "Autumn grapes are trodden for their juice and left to ferment in oak casks; wine for sea goes aboard cask and all, and every sailor keeps count of the barrels."

