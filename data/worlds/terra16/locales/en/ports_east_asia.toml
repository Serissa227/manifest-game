# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.guangzhou]
name = "Guangzhou"
lore = "At Guangzhou the court’s maritime ban turns into a set of labels: tribute ships, licensed brokers, brokerage houses. Porcelain from the inland kilns comes over the Meiling pass and down the Pearl River, crate after crate stacked in the brokers’ back courtyards."
river = "Pearl River"

[ports.yuegang]
name = "Yuegang"
lore = "At Yuegang, on the Jiulong estuary, the court says there are no seagoing ships, yet whenever the north wind rises every sail in the harbor leans toward the southern seas."
river = "Jiulong River, southern channel"

[ports.fuzhou]
name = "Fuzhou"
lore = "Outside Fuzhou the Hospitality Station receives the tribute envoys from Ryukyu, and private traders crowd its gate to learn the going prices. Cargo boats come down the Min River through the hills, and the two kinds of visitor follow two sets of rules."
river = "Min"

[ports.ningbo]
name = "Ningbo"
lore = "Ningbo’s maritime customs office has been quiet for years, but the riverside warehouses refuse to close. Word of pirate raids comes three times a day and people lower their voices in the streets; eastern Zhejiang’s lacquerware and silks still flow out along the canals."
river = "Yong"

[ports.tianjin]
name = "Tianjin"
lore = "The Hai River meets the Grand Canal at Tianjin, where southern tribute grain changes boats for the run north to the capital. Seagoing ships draw too much water and anchor outside the river mouth, with lighters bringing the cargo in."
river = "Hai"

[ports.dengzhou]
name = "Dengzhou"
lore = "The walls of the Penglai water fortress reach out into the sea, with the Miaodao islands facing them. Grain ships and troop ships bound across to Liaodong mostly wait here for a wind, and the incense never stops burning at the Empress of Heaven temple on Miaodao."

[ports.lushun]
name = "Lushun"
lore = "The military harbor at the southern tip of the Liaodong peninsula. Ships from Dengzhou tie up here and troops, grain and fodder go on by land toward Jinzhou. The mouth is narrow and the water deep inside, so a single battery can seal the entrance."

[ports.juehua]
name = "Juehua Island"
lore = "Juehua island lies not far from Ningyuan, its grain stores standing side by side. In winter the sea freezes and the porters simply walk the grain across the ice; in summer the shore rings with the knocking of shipwrights."

[ports.shanhaiguan]
name = "Shanhaiguan Coast"
lore = "The Great Wall plunges into the sea here, and cargo from both sides of the pass is inspected. Merchants say crossing it is like standing trial, and the officers who check the goods are more thorough than pirates."

[ports.niuzhuang]
name = "Niuzhuang"
lore = "A market town beside an old channel of the Liao, where grain, salt and beans change hands. In winter the river freezes solid and carts cross on the ice; in summer the sandbars at the mouth shift every year, and boatmen sound the water with poles before they anchor."
river = "Old Liao channel"

[ports.pidao]
name = "Pi Island"
lore = "A bare island off the mouth of the Yalu, with a sheltered pool of water behind it. Ships on the Liaodong sea road run here in a gale; only a few families who gather seaweed live on it, and their huts fill up with strangers."

[ports.macao]
name = "Macao"
lore = "The southernmost sand spit of Xiangshan county, water on three sides, with a few fishermen’s huts and a small temple to Mazu. They say Portuguese merchants once dried a sea-soaked cargo here, put up sheds, and would not leave."

[ports.shuangyu]
name = "Shuangyu Ruins"
lore = "In 1548 Zhu Wan’s troops choked the harbor mouth at Shuangyu with timber and stone, and the burned pilings stand black on the tidal flats. The scattered sea merchants have not gone far; at night, lights still move between the islands."

[ports.busan]
name = "Busan"
lore = "Korean officials stand at the gate of the Japanese quarter at Busan, calling the roll of those who go in and out and weighing every load. Horses shipped from Jeju are tethered at the pier, and Japanese buyers circle them, checking teeth one by one."

[ports.naha]
name = "Naha"
lore = "Reefs ring the harbor and leave only a narrow channel, through which tribute ships, Fujian junks and the transshipment vessels bound for the southern seas all squeeze in. The royal castle of Shuri sits high above and sees every sail."

[ports.kagoshima]
name = "Kagoshima"
lore = "Sakurajima smokes across the bay from the Shimazu castle town. Ryukyuan ships bring sugar and southern-sea goods, and foreign sea merchants sometimes turn into the bay."

[ports.hirado]
name = "Hirado"
lore = "The Matsura anchorage, where Portuguese carracks have called a few times and lain offshore. Whether a deal is made depends first on the Matsura retainers and then on getting the story straight with the Chinese sea merchants in town."

[ports.yokoseura]
name = "Yokoseura"
lore = "A small bay in the Omura domain, narrow at the mouth but deep, where a big ship can come in and lie steady. A hill on the shore has pines bent sideways by the wind, and from its top every sail entering or leaving is in view."

[ports.nagasaki]
name = "Nagasaki"
lore = "A small fishing village under the Nagasaki family, a few thatched huts at the foot of the hills. The bay is long and thin, like a finger probing into the land, deep and calm, with only fishing boats in it."

[ports.hakata]
name = "Hakata"
lore = "Every household in Hakata still takes orders from the Ōuchi, yet people keep asking after the Ōtomo of Bungo: whoever’s banner goes up next will be the one they pay."

[ports.funai]
name = "Funai"
lore = "Otomo Yoshishige’s castle town, where missionaries and merchants both find lodging. Yoshishige will look at anything and commit to nothing. Sea routes lead to the other ports of Bungo, and small boats come and go full every day."

[ports.noshima]
name = "Noshima"
lore = "The Murakami know every race and hidden current of the Inland Sea. A passing ship flies their flag, pays the toll and gets a pilot through; one that refuses will most likely never clear the first rapids."

[ports.shimoda_tosa]
name = "Shimoda, Tosa"
lore = "Shimoda, at the mouth of the Shimanto, is the outport of the Ichijo at Nakamura. The courtier lords in the castle town hold poetry gatherings in the Kyoto manner, while the boatmen downriver just carry timber and paper out to sea."
river = "Shimanto"

[ports.urado]
name = "Urado"
lore = "Urado Bay belongs for now to the Motoyama, a narrow mouth guarding the inner bay. Campfires burn on the northern ridge every night, said to be Chosokabe men from Oko Castle, and the Motoyama retainers sleep badly."

[ports.shimizu_tosa]
name = "Shimizu, Tosa"
lore = "The sea off Shimizu is full of reefs and rough water, and bonito boats leave harbor in flocks. Kagumi ships ply the Hata coast, nominally serving the Ichijo of Nakamura as their lords."

[ports.obama]
name = "Obama"
lore = "The mackerel Kyoto eats at festivals is salted at Obama: rubbed with salt, slung on a pole, and carried over the hills at a trot in a single night, which is how the Mackerel Road got its name. The Takeda who hold Obama are only distant kin of the Takeda of Kai."

[ports.sakai]
name = "Sakai"
lore = "Moats ring the streets of Sakai, and the merchant councillors settle their own affairs and take no orders from the warriors. In the lanes the gunsmiths’ hammers and the printers’ block-cutting chisels answer one another."

[ports.atsuta]
name = "Atsuta"
lore = "Before the gates of Atsuta Shrine, worshippers and traders crowd the same street. The harbor belongs to the Oda lands of Owari, and townsfolk say the young head of that house cares little for rules."

[ports.tsushima]
name = "Izuhara, Tsushima"
lore = "The So of Izuhara control the trade with Korea, and whose ship may go to Busan depends entirely on the permit the clan has stamped. The currents in the strait are treacherous, but a single wrong character on the paperwork is worse."

[ports.matsumae]
name = "Matsumae"
lore = "Matsumae is the last Japanese foothold in the north. Kakizaki traders bring rice, iron pots and lacquer bowls to swap with the Ainu for dried salmon, sea-otter pelts and hawk feathers; the price is whatever the Japanese scales say."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# The supply island off Ningyuan handles military stores within the shifted campaign timeline.
# A Korean offshore island in 1553; its Dongjiang activation in 1567 belongs to the shifted Liaodong timeline.
# The private trading station destroyed in 1548 awaits reconstruction; its precise site needs review.
# In 1553 the port remains within the Ouchi sphere, before later Otomo expansion.
