# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.barcelona]
name = "Barcelona"
lore = "The old maritime court stands right by the quay, and when merchants fight over payment their voices drown out the gulls. Catalan cloth and wool travel the Mediterranean east and west."

[ports.valencia]
name = "Valencia"
lore = "Rice paddies run one into another outside the city, fed by channels the Moors left. Every Thursday the elders of the water court sit at the cathedral door and judge the farmers’ quarrels over water. The rice and the city’s silks go east together by ship."

[ports.naples]
name = "Naples"
lore = "A city so full of people there is no room to turn, where the bakers’ ovens are lit before dawn. The viceroy feeds it on wheat from the hinterland and grain shipped in, and if the grain ships are three days late there will be trouble in the streets."

[ports.palermo]
name = "Palermo"
lore = "Sicilian wheat and raw silk are brought to Palermo first and shipped out from there. The old palace was left by the Norman kings, and under its arcades you can still see the patterns of Arab craftsmen."

[ports.messina]
name = "Messina"
lore = "The currents in the Strait of Messina change several times a day, with Calabria just across and the whirlpool of Charybdis of the old tales said to lie nearby. Strait pilots know best which hour is safe to cross and which is better spent waiting in harbor."

[ports.malta]
name = "Malta, Birgu"
lore = "The Knights Hospitaller have their seat at Birgu, their inns and infirmaries crammed into the narrow lanes of the old town. Across the Grand Harbor, Mount Sciberras is still a bare slope of rock without a single tree."

[ports.marseille]
name = "Marseille"
lore = "On the Old Port quay, Provençal wine barrels and Levant cargo bales jostle together, and the smells of pepper, fish and wine run into one. Fishwives sit on the stone steps crying their wares from first light, and captains have to pick their way around them."

[ports.toulon]
name = "Toulon"
lore = "Toulon’s deep bay is sheltered from the wind and ideal for ship repair. Ten years ago the Sultan’s fleet wintered here; the townsfolk moved out to the villages, and all winter the cathedral rang with the call to prayer."

[ports.genoa]
name = "Genoa"
lore = "The harbor is narrow, with the mountains pressing right down to the sea. In the counting-room of the Bank of St George sit the men who decide which shipowner gets a loan, with merchants queuing outside; ships returning from the old overseas possessions crowd the same bay."

[ports.livorno]
name = "Livorno"
lore = "The Medici duke is enlarging the harbor at Livorno, pushing the new mole into the sea stone by stone, and lime dust from the works blows across the decks. The port is still land of the Duchy of Florence."

[ports.civitavecchia]
name = "Civitavecchia"
lore = "The sea gate of Rome, where the Pope’s grain ships come alongside. Alum quarried in the Tolfa hills arrives by the cartload and is shipped to dyers everywhere, and the papal coffers swell on this white stone."
