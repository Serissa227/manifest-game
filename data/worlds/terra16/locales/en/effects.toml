# 英文覆盖：组合事件的效果词表（对应 data/effects.toml）。
# 格式：[effects.<效果 key>] 可覆盖 name（情报界面与英文提示词中的显示名）、description（英文提示词里给模型看的说明）。
# 效果的边界与数值不在这里改。

[effects.good_supply]
name = "Supply of a good (everywhere)"
description = "A good becomes more or less plentiful at every place that makes it, e.g. a bumper harvest, a year of blight, a mine collapse."

[effects.good_demand]
name = "Demand for a good (everywhere)"
description = "Demand for a good shifts everywhere, e.g. a new fashion, a decree against it, a fast or festival season."

[effects.supply_shift]
name = "Local supply of a good"
description = "Output of one good at one place changes, e.g. a newly found vein, a workshop fire, a herring run."

[effects.demand_shift]
name = "Local demand for a good"
description = "One place wants more or less of one good, e.g. a shipyard short of mast timber, a garrison buying powder."

[effects.popularity]
name = "Local fashion"
description = "A good comes into fashion at one place and fetches higher prices for as long as it lasts."

[effects.location_supply]
name = "Local production"
description = "Output of every good at one place changes, e.g. a great fire, a plague year, a new market opening."

[effects.location_demand]
name = "Local consumption"
description = "Consumption of every good at one place changes, e.g. a festival, a quarantine, a tide of pilgrims."

[effects.region_storm]
name = "Storms at sea"
description = "The chance of storms in a sea region changes; above 1 is rougher water, below 1 is calmer."

[effects.region_pirates]
name = "Pirates at sea"
description = "The chance of pirates in a sea region changes; above 1 is more dangerous, below 1 is quieter."

[effects.relation_shift]
name = "Relations between nations"
description = "The standing between two nations changes once; whether diplomatic status changes still follows the rules."

[effects.faction_tax]
name = "Tariffs"
description = "The trade tax in a nation’s ports changes; above 1 raises it, below 1 lowers it."

[effects.development]
name = "Port development"
description = "A port’s development changes once, e.g. new quays, a harbor rebuilt after a fire, an earthquake."

[effects.interest_shift]
name = "Bank interest"
description = "Loan interest at banks everywhere changes, e.g. credit tightens or a silver fleet comes in."

[effects.industry_efficiency]
name = "Workshop efficiency"
description = "Workshop output per hand changes everywhere, e.g. a new technique spreads or a guild walks out."

[effects.colony_output]
name = "Colony output"
description = "Output of one producing building in a colony (all of them if building is all) changes, e.g. good rains, locusts, a thinning vein, new craftsmen."

[effects.colony_morale]
name = "Colony morale"
description = "A colony’s morale changes once, e.g. a festival, letters from home, rumors of fever, a quarrel with the overseer."

[effects.colony_growth]
name = "Colony immigration"
description = "A colony’s population growth and immigration change, e.g. famine at home sends settlers over, or word of plague on the crossing keeps them away."

[effects.site_claim]
name = "Nation claims a colony site"
description = "A nation plants its flag first on an unclaimed colony site (once; only the nation–site pairs listed may be used)."

[effects.discovery_rumor]
name = "Rumor of a discovery"
description = "Sailors pass on word of a discovery, and the player learns its rough sea region (once; the fog is not lifted)."

[effects.export_ban]
name = "Export ban"
description = "A nation bans taking a good out of its ports: it cannot be bought there, though local use goes on, e.g. grain in a famine, saltpeter in wartime."

[effects.import_tariff]
name = "Import tariff"
description = "A nation taxes a good brought in: the trade tax on selling it in that nation’s ports is multiplied, e.g. to shield home weavers."

[effects.export_tariff]
name = "Export duty"
description = "A nation taxes a good taken out: the trade tax on buying it in that nation’s ports is multiplied, e.g. when foreign merchants carry off a specialty."

[effects.subsidy]
name = "Production subsidy"
description = "The authorities subsidize making a good at one place and output rises, e.g. land-clearing grants or mine tax relief."
