# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.animal_dodo]
name = "Mauritian Dodo"
lore = "A plump gray bird with stubby, useless wings ambles through the island woods and never steps aside for people. Nothing on this island has ever given it cause to."

[discoveries.animal_great_auk]
name = "Great Auks"
lore = "In 1534 Cartier’s men landed on this rock and filled two boats in under half an hour, and each ship salted down five or six barrels besides. The birds are as big as geese, cannot fly, and cannot run far either."

[discoveries.animal_manatee]
name = "Manatee"
lore = "Columbus wrote in his log that three mermaids rose from these waters, “not as beautiful as they are painted, though their faces are somewhat human.” The Taíno fishermen call it manatí and say it is gentler than a cow."

[discoveries.animal_bird_of_paradise]
name = "Bird of Paradise"
lore = "The king of Bacan sent two of these skins to the Spanish emperor, saying the birds come from paradise and never touch the ground, which is why they have no feet. The hunters of New Guinea find that very funny. They cut the feet off when they skin them."

[discoveries.animal_komodo]
name = "Komodo Monitor"
lore = "The islanders call it ora: a lizard longer than a man, flicking a forked tongue as it walks the dry grass slopes. A deer it bites may get away at first, but within days it always falls. The ora only has to follow."

[discoveries.animal_giraffe]
name = "Giraffe"
lore = "More than a century ago, envoys from Malindi brought one of these to Beijing, where the whole court hailed it as a qilin and scholars vied to write odes. Out here beyond Malindi’s walls it cares for none of that, and only stretches for the tender leaves at the tops of the acacias."

[discoveries.animal_giant_squid]
name = "Arms of a Giant Squid"
lore = "An arm thicker than a man’s leg drifts off the Norwegian coast, its suckers as wide as silver coins. Icelandic sailors say it is only one finger of the hafgufa. When the whole beast surfaces, men mistake it for an island."

[discoveries.animal_narwhal]
name = "Narwhal"
lore = "Off Greenland a mottled whale lifts a spiral tusk above the water and sinks again. So this is where the unicorn horn comes from, the kind southern courts buy for its weight in gold. The northern merchants have always kept quiet about it."

[discoveries.animal_galapagos_tortoise]
name = "Galapagos Giant Tortoise"
lore = "The tortoises here are big enough to carry a man, the front of the shell arched high like a saddle. They plod along chewing cactus, and when someone comes close they only pull their necks back into their shells."

[discoveries.animal_magellanic_penguin]
name = "Penguins of the Magellan Strait"
lore = "Pigafetta called them geese: black and white, unable to fly, with feathers so short they had to be skinned instead of plucked. On land they waddle. In the water they are quick as fish."

[discoveries.animal_llama]
name = "Andean Llama"
lore = "The Spaniards call it the sheep of this land, yet it carries loads over mountains where there are no roads. Pile on too much and it lies down, and no beating will get it up again. The herders of Cuzco say the animal knows its limits better than the men who drive it."

[discoveries.animal_vampire_bat]
name = "Vampire Bat"
lore = "Oviedo says the bats of the isthmus pick out sleeping men and bite their toes and the tips of their noses; a man wakes in a bed full of blood without having felt a thing. When someone by the fire starts whispering about revenants back home, the old soldiers just tell him to wrap his feet before he sleeps."

[discoveries.animal_turkey]
name = "Turkey"
lore = "In Yucatán courtyards, Maya women scatter corn for a big bird with a dangling red wattle. It crossed to Europe long ago, but nobody there can agree where it came from. Some call it the Indian fowl, others the Turkey cock."

