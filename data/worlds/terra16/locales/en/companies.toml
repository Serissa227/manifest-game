# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[companies.fugger]
name = "Fugger Company"
persona = "The Augsburg house’s counting-room in Antwerp, dealing in copper, silver and loans to princes. Its books are kept to the last penny and no loan is ever repaid short; when a price runs too high it keeps its money in the chest and waits for the market to fall back, and it dislikes crowding into a port where everyone is fighting over the same cargo."

[companies.welser]
name = "Welser Company"
persona = "Another great Augsburg house. Its Venezuelan concession is long over, but having tasted overseas profit it cannot let go; once the counting-room sees the price of sugar, cochineal or copper rise three weeks running, the next ship is diverted to load it."

[companies.mendes_nasi]
name = "Mendes–Nasi Network"
persona = "The family’s business runs from Iberia through Italy and into Ottoman lands, and now the Istanbul branch gathers in the cargo. They have known too many people who had to leave at a moment’s notice, so they would rather earn a tenth less than leave a partner without a way out. A cargo whose price has shot up too fast is left alone for now, and a quay full of red-eyed buyers is a quay they steer around."

[companies.gresham]
name = "Gresham's Agency"
persona = "The English Crown’s agent in Antwerp, who raises loans, handles exchange and sells English cloth. He watches the exchange rate like a sentry, and a shilling’s movement goes into a letter to London that same night; a price that has run too high he takes for one that must come down again, and he will not chase it. What the other houses are doing hardly concerns him."

[companies.genoese_seville]
name = "Genoese Merchants of Seville"
persona = "Genoese living in Seville, who advance money to the Crown one day and stake a shipload of silver and sugar for their partners the next. Where a route is plainly paying, they pool their money, and the longer they watch it the bolder the stake."

[companies.casa_da_india]
name = "Casa da India"
persona = "The Crown’s India House on the Tagus: the king holds the spice monopoly, and the sailing routes and the division of cargo are settled here. Its royal factory in Antwerp closed in 1549 and the business has come home to Lisbon; it prices by the rate posted before it and does not guess at the market."

[companies.venetian_muda]
name = "Venetian Spice Convoys"
persona = "Venice’s spice convoys sail on schedule under galley escort; their owners and shippers are mostly old families of long acquaintance, and their contracts run longer than a prayer. When prices burn hot the counting-room pushes the buying onto the next convoy and signs only after the price has come down."

[companies.steelyard]
name = "Hanseatic Steelyard"
persona = "The Hanseatic compound behind its high wall by the Thames, a yard full of German merchants who keep to themselves and lock the gates at night. They live on volume, old privileges and dependable return freight, packing their holds with grain, timber and flax; when the market climbs too high they stop buying, and restock only once it has settled back to the old rate."

[companies.gujarati_merchants]
name = "Gujarati Merchants of Khambhat"
persona = "Gujarati merchants of Khambhat, their ships piled with cotton cloth and indigo, selling in the Red Sea at one end and Malacca at the other, and coming home with pepper, cloves and metals. The moment Red Sea buyers raise their bids another hull goes down the slip, and wherever a rival fleet sails they will not be left behind."

[companies.marakkayar]
name = "Coromandel Marakkayar Merchants"
persona = "Tamil Muslim sea merchants of the Coromandel coast, a few small vessels working the Bay of Bengal with cloth and rice as their staples. When the monsoon turns they probe a neighboring port for new buyers, and once they have the measure of one they follow the trade."

[companies.fujian_merchants]
name = "Yuegang Fujian Merchants"
persona = "Fujian sea merchants of Yuegang. The officials forbid going to sea, yet every year they sail when the north wind rises, relying on kinsmen, gentry favors and a chart that skirts the patrol posts. They know silk, porcelain and sugar prices and are bold, but would rather go the long way round than quarrel over a port."

[companies.sakai_naya]
name = "Sakai Naya Merchants"
persona = "The Naya merchants of Sakai, whose seaside warehouses run into rows of storerooms, whose regular customers are daimyo and temples, and who hear the smithies’ news before anyone else. They read silver, sword and matchlock prices best: a price that has shot too high they leave alone until it falls back, then buy in bulk, and for a safe large order they will contest with their rivals to the end."

[companies.hakata_merchants]
name = "Hakata Merchants"
persona = "Hakata merchants keep to the old sea lanes: copper and sulfur go out, raw silk comes back, and generations of them have known the anchorages along the Ming coast. When a Kyushu lord reaches for his sword, the ships lie off at an island in the outer roads to watch the wind, and come in only once the heat has gone out of the port."

[companies.ryukyu_royal]
name = "Ryukyu Royal Merchants"
persona = "The royal merchant ships of Naha make several tribute voyages a year to Fuzhou and carry goods on to Malacca and Siam. Sulfur from the islands is their ready capital, traded for sappanwood, camphor and goods from Ming China; the accounts are simple and prices follow the old precedents."

[companies.hadrami]
name = "Hadrami Merchants"
persona = "Hadrami sea merchants settled at Julfar, whose frankincense, pearls and spices move on kinsmen’s ledgers, countrymen’s ships and old pilots who read the stars by night. They partner only with people they trust, and do not rush in when prices rise or fall."

[companies.swahili_gold]
name = "Swahili Gold Merchants"
persona = "Gold merchants of Kilwa, who take gold and ivory from visitors out of the interior with one hand and pass cloth to the coastal cloth traders with the other. Their boats are sewn wooden hulls that carry little on any trip, so a shipload of gold goes out in three runs, and no single wreck can ruin the house."
