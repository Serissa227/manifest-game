# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.wreck_santa_maria]
name = "Lost Site of Santa Maria"
lore = "On Christmas night in 1492, Columbus’s flagship ran aground on this reef; her timbers were taken to build the fort of La Navidad, and no one ashore can say any longer where the rest of the hull went down."

[discoveries.wreck_flor_de_la_mar]
name = "Lost Site of Flor de la Mar"
lore = "In 1511 Albuquerque sailed home laden with the spoils of Malacca, and his flagship, the Flor de la Mar, broke in two in a storm off Sumatra; they say the gold and silver still lie on the seabed."

[discoveries.wreck_treasure_fleet]
name = "Treasure-Fleet Timbers off Ceylon"
lore = "Fishermen off Ceylon now and then net rotten giant timbers and shards of blue-and-white porcelain; the old men say they were left by the great Ming treasure ships that passed this way more than a century ago."

[discoveries.wreck_aztec_cargo]
name = "Azores Treasure-Cargo Clue"
lore = "In 1523 the treasure Cortés sent home to Spain was seized on the way by the French corsair Fleury; sailors say one straggling ship went down with its gold off the Azores."

