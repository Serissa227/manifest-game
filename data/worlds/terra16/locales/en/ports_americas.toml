# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.santo_domingo]
name = "Santo Domingo"
lore = "A stone town at the mouth of the Ozama, with sugar stacked in the warehouses and tobacco drying on the quay. War and plague have left most of the native villages beyond the walls as little more than names."
river = "Ozama"

[ports.san_juan]
name = "San Juan"
lore = "Gun batteries guard the eastern door of the Caribbean, and passing ships come into the bay for water, new cable and a mended rudder. The gunners have more idle time than the merchants do, and every tavern knows them."

[ports.havana]
name = "Havana"
lore = "The bay is deep and still, and homeward ships wait here until the fleet is complete before running the strait together. While they wait, the sound of caulking mallets goes on from dawn to dusk."

[ports.santiago_cuba]
name = "Santiago de Cuba"
lore = "The old capital in the east sits on a bay with a narrow mouth and a wide belly. Copper ore from the hills, and baskets of cassava and tobacco, are loaded here."

[ports.veracruz]
name = "Veracruz"
lore = "Big ships shelter in the lee of San Juan de Ulúa, and cargo is ferried ashore in lighters, trip after trip. The town itself still stands by the Antigua river, where the mosquitoes outnumber the people."

[ports.campeche]
name = "Campeche"
lore = "The Spaniards’ new town sits against an old Maya village. Wax is being weighed on one side and dyewood bundled on the other, and the bargaining between them depends on one interpreter who speaks both tongues."

[ports.cozumel]
name = "Cozumel"
lore = "Maya pilgrims used to paddle across the sea to honor the goddess Ix Chel on this island. The island is thinly peopled now, but the few canoe-trading families who stayed still know the old channels along the coast."

[ports.nombre_de_dios]
name = "Nombre de Dios"
lore = "Mule trains bring silver bars over the isthmus from Panama and unload them under sheds here. In the rains the road turns to slop, the silver sits for weeks, and the guards count the days in the tavern."

[ports.panama]
name = "Panama Viejo"
lore = "The old city on the Pacific shore. Cargo is lashed into bundles and mule teams are led out the gate to climb the isthmus toward the northern coast; the muleteers’ shouts are the first sound of the day."

[ports.cartagena]
name = "Cartagena"
lore = "Gold from the New Granadan interior gathers here. Now and then a shopkeeper takes an emerald from a drawer, says it came down from the mountains, and tells you to name your price."

[ports.callao]
name = "Callao"
lore = "Lima’s outer port, half a day from the city. Balsa rafts from the northern coast meet Spanish ships bound for Panama in the bay, and the route to the isthmus begins here."

[ports.arica]
name = "Arica"
lore = "Silver from Potosí comes down the Andes on llamas and mules, then crosses the desert to this small port. Wells are few, and when a caravan rests or hurries depends on whether the next well has water."

[ports.acapulco]
name = "Acapulco"
lore = "A deep bay with hills on three sides; the ocean swell cannot get in, and the water lies still as a pond. Pilots say among themselves that whoever finds a wind home across the western ocean will make this the finest harbor in the world."

[ports.st_augustine]
name = "St Augustine"
lore = "Timucua villages string along the tidal creeks, dugout canoes tied at their doors. The water beyond the sandbar is shallow, so big ships anchor far out and feel their way in by boat."

[ports.salvador]
name = "Salvador"
lore = "The governor’s seat, founded in 1549, looks out on All Saints’ Bay. The town is in two parts, offices on the cliff and wharves below; outside it, burned-over slopes are planted with cane and the first sugar mills are already turning."

[ports.olinda]
name = "Olinda"
lore = "Sugar chests come down from the hills of Olinda and drift along the lagoon channels to Recife. The anchorage behind the reef is calm, and the larger ships take on their loads there."

[ports.sao_vicente]
name = "Sao Vicente"
lore = "The first Portuguese settlement in Brazil grew up on this island. A steep road climbs from the shore onto the plateau, and beyond it lies an interior with no visible end."

[ports.rio_de_janeiro]
name = "Rio de Janeiro Bay"
lore = "Tupinambá villages are scattered along both shores of Guanabara Bay. French ships come every year to trade knives, axes and mirrors for brazilwood, and sail off on the first fair wind once they are full."

[ports.buenos_aires]
name = "Buenos Aires Anchorage"
lore = "Querandí tents stand along the riverbank. The horses Mendoza left behind long ago wandered off and now run in herds across the plain, too wild for anyone to catch."

[ports.valparaiso]
name = "Valparaiso"
lore = "The seaport of Santiago, with small houses clinging to the hillside around a curved bay. Dried beef and tallow are shipped from here, north to Lima."

[ports.concepcion]
name = "Concepcion, Penco"
lore = "A colonial town raised on Penco Bay only in 1550, with the war just beyond its palisade. At night the watch dozes with its eyes open."

[ports.st_johns]
name = "St John's"
lore = "A narrow harbor that fills each summer with Portuguese, Basque, Breton and English fishing boats, mast against mast. By old custom the first captain to arrive is fishing admiral for the season."

[ports.red_bay]
name = "Red Bay"
lore = "Basque whalers build their try-works ashore, and black smoke from the rendering drifts over half the bay. Before winter the casks are full and the ships gone, leaving a row of empty ovens."

[ports.tadoussac]
name = "Tadoussac"
lore = "Each summer the Innu gather at the mouth of the Saguenay, and European ships arrive then to trade iron kettles and cloth for beaver pelts. When the ships leave, only campfires remain."
river = "Saguenay mouth"

[ports.tumbes]
name = "Tumbes"
lore = "Raft traders pole their balsa rafts back and forth between the river mouth and the bay; the stone-paved road ashore runs south to join the Andean network."
river = "Tumbes"
