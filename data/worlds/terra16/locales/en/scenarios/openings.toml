# 剧本公开文字集中在此；当前草稿检查不支持含ships字段的独立剧本译文。
[scenario_labels.mio_1553]
name = "Fan of the Tides · 1553"
description = "Nakamura, Tosa, 1553. Four years ago Mio’s father died here, and no one will say quite how. Her ten-year-old brother has been taken to the head family in Kyoto, and retainers run Nakamura in his name. Mio is learning the tides with her nurse at the river mouth at Shimoda; next spring she too goes up to the capital, to train as a lady-in-waiting at court. In January 1557 she puts to sea from Shimoda."

[scenario_labels.lieve_1553]
name = "Her Father's Ledger · 1553"
description = "Antwerp, 1553. Over the door of the Exchange is a dedication to merchants of every nation and every tongue. Twelve-year-old Lieve sits at her father’s changing table, and once a coin has passed through her hands she never forgets its fineness or its price. Next year she starts at a girls’ French school. Three years on, the Spanish crown’s bills start being paid later and later. In January 1557 she sails with her father’s ledger."

[scenario_labels.najma_1553]
name = "The Star Road · 1553"
description = "Julfar, 1553. At the bottom of her mother’s dowry chest lie the sailing poems of Najma’s great-grandfather, Ibn Mājid, and her father’s pearling boats are waiting for the season. The sea at their door is restless: last year an Ottoman fleet besieged Hormuz and failed, and the Portuguese check their passes more strictly every year. From next year Najma learns her trade aboard a pilot family’s ship, then rides the winter monsoon to Zabid in Yemen. In January 1557 she sails on the northeast monsoon."

[scenario_labels.lin_wandeng_1553]
name = "The Unfading Lantern · 1553"
description = "Yuegang, Zhangzhou, 1553. The court insists there is not a single seagoing ship here, yet more than ten thousand households live off the sea. The Lin family’s junks sail to Goto, Pattani and Malacca; to the officials they are bandits, to the neighbors they are merchants. On Mazu’s birthday this year Wandeng is chosen to carry the lantern, while to the north, pirates are pouring into Zhejiang and Jiangnan. In January 1557 she puts to sea in the last niaochuan the family has left."

[scenario_labels.ix_nikte_1553]
name = "Island of the Moon · 1553"
description = "Cozumel, 1553. Fewer pilgrims come to Ix Chel’s sanctuary every year. An ordinance issued the year before last forbids night dancing and divining with scattered maize, and half of her mother’s craft is now against the law. Her father’s canoes still run between Xicalango and the Bay of Honduras with salt, cacao and cotton cloth. Next year she travels with them to Mérida, to learn the catechism in the friary courtyard. In January 1557 she returns to the island and puts to sea."

[scenario_labels.noel_1553]
name = "Chain and Ribbon · 1553"
description = "Tarifa, 1553, at the southern tip of mainland Europe. The roll is called in the castle: seventy-seven names, and only nine of them still living. Left at the castle gate at the age of three, Noël was taken in by the old commander, who has never said where the child came from. From next year: lodgings in the marquis’s house in Seville and lessons in cosmography. In January 1557, the sword, the red ribbon and the open sea."

[scenario_labels.tariq_1553]
name = "Two Shores · 1553"
description = "Algiers, 1553. Tariq was born in the Albaicín of Granada and crossed the sea with his family at three; his grandmother still carries the key to the old house. Every time Salah Rais’s fleet puts out, it comes back with plundered goods, and with plundered people. Next January Tariq marches with the army to Fez and stays on to study at the Qarawiyyin. In January 1557 he has a galiot of his own."

[scenario_labels.kaicili_1553]
name = "Crown of Cloves · 1553"
description = "Ternate, 1553. The clove trees are heavy with buds, and the Portuguese fort stands by the shore. Kaicili’s father, Sultan Hairun, deals warily with the Portuguese inside their fort and listens to the Qur’an recited in his own palace. His mother is a daughter of the Sultan of Tidore, the island across the strait: enemy country, and his mother’s home. Next year he sails by kora-kora to Java to study at Giri near Gresik. In January 1557 he comes home to Ternate."

[scenario_labels.baraka_1553]
name = "River of Gold · 1553"
description = "Kilwa, 1553. This was once the richest port in East Africa; nearly fifty years ago the Portuguese sacked it, and now it is a small city-state on someone else’s books. Baraka’s father, Salim, trades with Sofala and the gold markets inland, and this year takes his son along with the caravan for the first time. Baraka also reads a Portuguese book with a chapter on Kilwa, and it gets things wrong. Next year he rides the monsoon north to Cairo and al-Azhar. In January 1557 he sails home on the northeast monsoon and puts to sea."

[scenario_labels.plus_ultra]
name = "Further Beyond · Custom Captain"
description = "1553: pick one of twelve beginnings, from an orphan pilot’s apprentice in Seville to a glassmaker’s child on Murano or an interpreter’s child in Busan. Choose your own name, gender, looks and birthday. Spend a year at home and three at school or under a master, and in January 1557 set sail for whatever lies further beyond."

[scenario_labels.free_1557]
name = "Free Sailing · 1557"
description = "From New Year’s Day 1553 the world runs on its own for four years: crowns change hands, fortunes are lost, ships fail to come home. On January 1, 1557, you take command of a ship on the Lisbon waterfront. There are no childhood or school years; you decide your captain’s name, looks and past, and every course from there on."
