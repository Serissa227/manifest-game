# B9：从C12英文标签导出，严格剧本的普通显示覆盖。
name = "Crown of Cloves · 1553"
description = "Ternate, 1553. The clove trees are heavy with buds, and the Portuguese fort stands by the shore. Kaicili’s father, Sultan Hairun, deals warily with the Portuguese inside their fort and listens to the Qur’an recited in his own palace. His mother is a daughter of the Sultan of Tidore, the island across the strait: enemy country, and his mother’s home. Next year he sails by kora-kora to Java to study at Giri near Gresik. In January 1557 he comes home to Ternate."
