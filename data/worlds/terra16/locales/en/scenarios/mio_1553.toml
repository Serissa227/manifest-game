# B9：从C12英文标签导出，严格剧本的普通显示覆盖。
name = "Fan of the Tides · 1553"
description = "Nakamura, Tosa, 1553. Four years ago Mio’s father died here, and no one will say quite how. Her ten-year-old brother has been taken to the head family in Kyoto, and retainers run Nakamura in his name. Mio is learning the tides with her nurse at the river mouth at Shimoda; next spring she too goes up to the capital, to train as a lady-in-waiting at court. In January 1557 she puts to sea from Shimoda."
