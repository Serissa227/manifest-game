# 出处呢（bond_zahra）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_zahra]
name = "Zahra: Your Source?"

[tracks.bond_zahra.chapters.c1]
title = "Your Source?"
text = "The lecture was over and the old lady had gone back inside, but the other students were still crowded around. Someone asked how the pilot families recite their verse, so I gave them a line of my great-grandfather’s, the one that says how many fingers high the northern star should stand once you clear Aden. When I finished, a head came up from behind a stack of books. It was a girl even skinnier than me, a manuscript copy open across her knees, its edges yellowed, tiny writing packed between the lines. Her name was Zahra; her family were scholars in Zabid. “That line you just quoted. You got two words wrong.” She read the two words out one at a time, as if she was afraid I might miss them. The others laughed. I said that was how I had learned it as a child. She pinned the line in her copy with a fingernail. “Your source?” “Ibn Mājid’s own manuscript,” I said. “It’s in my mother’s dowry chest.” She went still, her nail still pressed to the page, the fingertip turning white. “Then I want to see it.”"

[tracks.bond_zahra.chapters.c1.choices.show_manuscript]
text = "Promise to bring the manuscript next time, and argue the two words once she’s seen it."
reply = "My mother let me take the page out for one afternoon, wrapped in two layers of cloth. Zahra wouldn’t look at it in the corridor. She took me to her family’s library and washed her hands before she untied the cloth. She studied that page all afternoon, then laid her copy, the page, and the copy my mother had written out for me side by side and went through them word against word. When the sun was low she looked up. “Those two words. Your mother copied them wrong.” I said that every sailor sings it the way my mother wrote it. She said singing is singing and writing is writing. We argued until her family’s servant came in to light the lamps, the page lying between us, both our hands kept a span away from it."

[tracks.bond_zahra.chapters.c1.choices.quote_back]
text = "Catch her in a slip from her own recitation, and ask which book that line came from."
reply = "In the lecture earlier she had recited a chain of transmission and put two of the transmitters in the wrong order. I remembered exactly where. I borrowed her tone. “And that line, which book did you get it from?” Her face went red all at once. She carried her copy over to the old lady’s shelves and searched for the better part of an hour, and when she found it, I was right. She shoved the book back into its place, hard. “This one’s yours.” Then she turned and left, fast, the end of her headscarf catching on the door frame."

[tracks.bond_zahra.chapters.c2]
title = "Notes as Fine as Needles"
text = "The old lady had us hand in an exercise on the meaning of a hadith. When mine came back there were four lines of criticism in the margin, the writing as fine as needle points, one fault per line, and the last one went after my punctuation. I didn’t need to ask. It was Zahra. I didn’t go to the old lady. I carried my sailing verse over to Zahra’s desk. “Do the same to these.” She showed no mercy at all. The first fault was a rhyme, the second the spelling of a star name. At the third, her pen stopped. “Zām. The dictionaries don’t give it that meaning. It’s a mistake.” “On a ship, one watch is one zām. The whole Red Sea says it that way.” “The books don’t write it that way.” “That’s how the sea gets sailed.” She was talking about books; I was talking about the sea. In the end we each made a fair copy to keep. Hers had my writing in the margins and mine had hers, and neither of us rubbed anything out."

[tracks.bond_zahra.chapters.c2.choices.trade_pages]
text = "Make a pact: swap exercises once a month and mark each other’s mistakes."
hint = "She sets down her pen. “Once through a sailor’s homework is plenty.” She doesn’t think of you as someone to trade work with yet."
reply = "The first month she found twenty mistakes in mine and I found three in hers. I circled the three and handed it back, expecting her to say they didn’t count. She frowned at the three circles and said nothing for a while. Then: “Three is still wrong.” The second month I went through her exercise from start to finish and found only one. I circled it, and beside my circle she wrote a single word: “Granted.”"

[tracks.bond_zahra.chapters.c2.choices.sea_vs_book]
text = "Take her down to the docks to hear how sailors use the word “zām.”"
reply = "Zahra had never been down to the docks. On the steps she held her sleeve over her nose against the smell of fish. We asked three sailors. The first said a zām was one watch. The second said an eighth of a day and a night. The third, an old helmsman from Somalia, said that with a fair wind, one zām is how long it takes for an island to rise out of the sea. Zahra wrote down every word. Back at her desk she added a line in the margin of her book: “Sailors use it three ways.” Then she handed me the pen. “That line, you can count as your source.”"

[tracks.bond_zahra.chapters.b1]
title = "Who Asks the Question"
text = "The old lady’s lectures had a custom: once a month one student put a question to her in front of everyone, and if it was a good one, the whole room wrote it down. This month, when it came time to choose, Zahra gave me a push forward. “Let her go first.” I knew she was waiting to catch me out, so I picked the hardest passage on purpose, the hadith about the wind: that the wind is the breath of God, bringing mercy and bringing punishment, that one must never curse it but ask for the good it carries. “When sailors meet a head wind,” I asked, “which good should they ask for?” The book lay open before the old lady, and she was halfway through her answer, beads moving through her fingers, when Zahra’s hand went up. She didn’t ask about the book. She turned and asked me. “How do you actually read the wind at sea?” Someone in the back whispered at her to ask something that mattered. Zahra didn’t turn around. “Understanding it is what matters.” The old lady’s beads stopped. She looked at me."

[tracks.bond_zahra.chapters.b1.choices.answer_her]
text = "In front of everyone, explain to her exactly how I read the wind at sea."
hint = "You’ve barely started when the corner of her mouth turns down, as if she expects you to lord the sea over her. Explain now and she’ll only sneer."
reply = "I started with the sail: how it fills for a fair wind, how it fills for a wind on the beam. Then the sea: which way the wave crests lean, how long the foam trails. Last, how to watch the stars drift at night and know how many fingers the wind has pushed the ship off course. When I finished the room was quiet for a moment. The old lady nodded. “From now on, when we come to this passage, we’ll borrow your ship.” Zahra wrote a line in the margin of her book. I leaned over to look. It was my name, with a line drawn under it."

[tracks.bond_zahra.chapters.b1.choices.ask_her_back]
text = "Don’t answer yet. Ask her back: what do the books say?"
reply = "Zahra recited it straight through without missing a single transmitter. I followed with what ships do, she added what the books say, and with the two side by side the old lady listened so long she forgot to put the books away. The servant looked in at the door three times. When the lecture broke up, the students went to name who had asked best that day, as usual. Zahra shut her book. “No first place today.”"

[tracks.bond_zahra.chapters.b2]
title = "Facing Mecca at the New College"
text = "South of town in Zabid a new college was going up. The walls stood head high, and the builders had fallen to arguing over which way the prayer niche should face. The old lady sent Zahra to the books. She shut herself in the library for three days and came out clutching a sheet of reckoning with a direction worked out. I happened to be ashore that week. At night I sighted my kamal on the northern star to fix true north, measured how far to swing west, and came out one finger off from her. “The figures in the books have been checked by one generation after another,” she said. “The star is tonight’s,” I said. The builders looked at her, looked at me, and went to squat by the wall and brew coffee. We stretched a cord between us, one end pegged in the ground and the other in her fist, and stood there from dusk into dark, waiting for the stars. The cord was pulled taut, and when the wind caught it, it hummed. “One finger off,” I said, “and you’re a hundred miles off.” She gripped the cord harder."

[tracks.bond_zahra.chapters.b2.choices.check_both]
text = "Once the stars are out, measure it again together until the book’s figures and the stars agree."
hint = "She holds the cord in a death grip and won’t even glance at your kamal. Admitting in front of a sailor that a book can be wrong is more than she can do yet."
reply = "When the stars came out we measured once, then worked her reckoning through again step by step. By midnight we had it. The figures were right, every one. The mistake was in the map she had copied them from, which put Zabid a good way east of where it belongs. She turned the map over and back again, then pressed it flat on her knees. “So a source can be wrong too.” The builders had long since gone home, and her family’s old servant was dozing outside the wall with his lantern. She didn’t leave. She spread the hem of her robe and sat down under the half-built wall, and I sat next to her, the cord still stretched along the ground. That night she asked me the names of a dozen stars, and wrote each one down as I gave it."

[tracks.bond_zahra.chapters.b2.choices.give_way]
text = "Give way: build it to her book’s direction, and just record the star readings on the side."
reply = "The prayer niche went up facing the way she had worked out. I copied that night’s readings onto a scrap of paper and tucked it under a brick at the building site without telling her. A month later she came to find me holding that scrap, plaster dust on one corner. “The builders gave me this. I want to work your readings through again.”"

[tracks.bond_zahra.chapters.a1]
title = "My Name Among Her Sources"
text = "The old lady had each of us expound a passage and then write out where it came from: who we heard it from, who that person heard it from, one name after another, all the way back to the Prophet’s companions. “However well you expound it,” the old lady said, “without a source, you made it up.” When Zahra’s turn came she took the hadith about the wind, and went into it in more detail than the old lady ever had, right down to how a sail fills. When she finished she bent to write her sources, name after name, down to the old lady, and then added one more line in smaller writing: on reading the wind at sea, heard from… and then my name. The ink wasn’t dry when she pushed the page across to me, her eyes on something else. “Look it over,” she said. “Tell me if anything’s wrong.” I looked. The last letter of my name was missing its two dots. She was still waiting for me to speak, a finger holding down the corner of the page, and the color had already reached her ears."

[tracks.bond_zahra.chapters.a1.choices.hold_her_pen]
text = "Take her pen and write my own name neatly beside her line."
hint = "You reach for the pen and she draws it back against her chest. You aren’t close enough yet to write side by side on one page."
reply = "I took the pen and wrote my name beside her line, stroke by stroke, the two dots at the end placed exactly. With the two names next to each other, anyone could see what she had left out. Her hand was fine, mine was heavy. She looked at them for a long while, so long the old lady cleared her throat. “Your writing is even worse than mine.” But she folded the page and slipped it into her sleeve, and she didn’t make me rub anything out."

[tracks.bond_zahra.chapters.a1.choices.cite_her_too]
text = "When my turn comes, put her name in the sources for my own passage."
hint = "The pen is already inked, and you set it down again. Writing her into your sources is a step the two of you haven’t reached."
reply = "First I took her pen, added the two dots to the end of my name, and pushed the page back. When my turn came, my passage was a line from the sailing verse about the monsoon. Writing out my sources, I put down my great-grandfather and my mother, then added a line: on the meaning of the word, heard from Zahra. She saw it and raised an eyebrow. “I never taught you a single word of that.” “You’re the one who caught ‘zām,’” I said. “You get the credit.” She glared at me, then laughed. Two years in that lecture room, and it was the first time I had ever seen her laugh there."

[tracks.bond_zahra.chapters.a1.choices.only_fix]
text = "Just tell her the name is wrong, two dots missing, and say nothing else."
reply = "“The last letter is missing two dots.” She pulled the page back, inked the pen, and added them, pressing so hard they spread into two little black blots. “You even find fault with your own name.” “Sources have to be exact.” She said nothing more. She bent to blow on the two blots, the corners of her mouth turned up, red from her ears down into her headscarf."

[tracks.bond_zahra.chapters.a2]
title = "The License to Transmit"
text = "On the day of the licenses the lecture room was packed: Zabid’s scholars at the front, students and merchants come to watch at the back, and Rania in the very last row. The old lady examined us one at a time, on chains of transmission, on meanings, on which passage seems to contradict which. Zahra and I knelt before her side by side. Zahra answered without a single slip. When my turn came she didn’t answer one word for me. “The wind,” the old lady said. “From the beginning.” It was the hadith about the wind. I opened my mouth and the first word stuck in my throat, and the whole room waited. Zahra’s hands rested on her knees, her sleeves hanging down. Under her sleeve, her fingertip tapped the mat three times, one heavy and two light: the beat of that passage’s first word. The rest followed on its own. The old lady placed two licenses in our hands. Only once we were outside did Zahra laugh. “That pause of yours was longer than a dead calm at sea.” And she pushed a piece of paper, folded into a small square, into my hand."

[tracks.bond_zahra.chapters.a2.choices.keep_note]
text = "Unfold the paper there and then, see what she wrote, and keep it."
hint = "You hold the folded paper but don’t dare open it. You can’t tell how much weight it carries, and you aren’t close enough yet to find out."
reply = "On the paper was something I had said at last month’s disputation: “The wind can’t read.” Underneath, in Zahra’s hand: Worth taking, three parts in ten. Beside that, in smaller writing, she had noted the date and who was present, like a proper citation. “I thought about it for three days,” she said. “There’s something to it.” “Only three parts?” “Three is plenty. Say something else worth hearing and I’ll add more.” I folded the paper and put it in with my license."
effects = [{}, {}, {}, { title = "The License to Transmit" }]

[tracks.bond_zahra.chapters.a2.choices.thank_her_tap]
text = "Keep the paper, and tell her I heard those three taps under her sleeve."
hint = "You want to mention the taps under her sleeve, and the words die in your mouth. You aren’t close enough yet to say that to her face."
reply = "“Those three taps under your sleeve,” I said. “I heard them.” She stopped dead in the middle of the steps, and the people coming out behind us had to go around her on both sides. A long time later she said, “I didn’t tap anything.” But she took my hand, turned the palm up, and tapped it three times with her fingertip, one heavy and two light, the same word. Then she drew her hand back into her sleeve and went down the steps ahead of me. I didn’t unfold the paper until I got home. It was something I had said at a disputation, and under it she had written: three parts worth taking."
effects = [{}, {}, {}, { title = "The License to Transmit" }, {}]

[tracks.bond_zahra.chapters.a2.choices.you_cheated]
text = "Laugh at her: you cheated under your sleeve."
reply = "“You cheated,” I said. “If the old lady had seen, she’d have taken both licenses back.” Zahra didn’t even blush. “You were the source. You’re the one who asked about that passage in the lecture. I kept it for you and gave it back. That isn’t cheating.” She tucked her license into the front of her robe and plucked the folded paper back out from between my fingers. “Cheats don’t get to read it.” She went down the steps without looking back."

[tracks.bond_zahra.chapters.s]
title = "You Keep the Sea, I Keep the Books"
text = "The northeast monsoon had set in, and early in the new year I would sail with it. Zahra would stay in the old lady’s lecture room; in a few more years she would be teaching her own. The evening before I left, she spread a sheet across her desk. It was a route for books: who in Jeddah would receive them for her, who in Aden would send them on, which booksellers in Hormuz could be trusted and which in Cambay could not. Every port had names after it, and every name had a note of where that person came from. The bottom line was her own name, written larger than usual. “The books travel through these places,” she said. “Whatever port you’re in, ask these people.” I picked up the sheet and read it through. “You keep the books, and I’ll keep the sea.” She scraped her pen on the edge of the inkstone. “Whatever you hear at sea, mark who told it to you. Don’t come back with a pile of stories from nowhere and expect me to swallow them.”"

[tracks.bond_zahra.chapters.s.choices.promise]
text = "Agree that however much we disagree, each of us reads the other’s letters to the end before writing a word of criticism."
hint = "Reading each other’s letters to the end, however much you disagree—that’s a promise for life. Your friendship can’t weather that many quarrels yet—or you’ve already promised a lifetime of arguing to someone else."
reply = "“Read the whole letter before marking it,” I said. “Even if you disagree with the first line.” “Then I’ll mark every inch of yours.” “Then any book you send me goes aboard and gets one soaking in seawater before it comes back.” At last she laughed out loud, laughed so hard she knocked the inkstone askew, and ink ran onto the edge of the route sheet. She went at it with her sleeve and only made it blacker, so she gave up, picked up her pen, and wrote beside the blot: “On this day, agreed with Najma: read the letter through before marking it.” Then another line: “Witness: this ink.” She folded the sheet in four and handed it to me, then pulled the thinnest book off her shelf, its margins already dense with her notes. “The first one. Finish it on the way, and at your first port, write and argue with me point by point.” I asked what happened if I couldn’t win the argument. “Then you concede,” she said. “And you still write.”"
effects = [{}, {}, { title = "You Keep the Sea, I Keep the Books" }, {}, {}, {}]

[tracks.bond_zahra.chapters.s.choices.heart]
text = "Write a line in the margin of her route meant only for her, in trade for one from her in the margin of my verse."
hint = "The pen hangs over the margin a long time and not a word comes. Either you haven’t come that far together, or you have already written such a line to someone else."
reply = "I took my roll of sailing verse from my bag, turned to the last page, and pushed it across to her, and drew her route sheet over to me. She understood and didn’t ask a thing. With the desk between us we bent our heads and wrote one line each: mine in the margin between Jeddah and Aden, hers beside the last line of my verse. I wrote slowly, she wrote fast, and when she was done she rolled up my verse and kept a tight hold on it. When I finished she folded the route in half and pressed it into my hand, and I passed her the roll. Neither of us looked. Outside, the call to prayer began. She reached out and took my hand and held it hard, her knuckles going white. We sat like that until the call had finished. When she let go she said, “Read it once you’re aboard. And no marking it.”"
effects = [{}, {}, {}, {}, { title = "You Keep the Sea, I Keep the Books" }, {}, {}]

[tracks.bond_zahra.chapters.s.choices.own]
text = "Agree to find fault with each other for life. Whoever runs out of faults to find loses."
reply = "“You’ll lose first,” Zahra said. “You make too many mistakes. I couldn’t find them all in a lifetime.” “Then spend a lifetime looking.” “Then I accept.” She took the route sheet and drew two strokes next to her name at the bottom, one for her and one for me. “One mark for every fault. Whoever stops marking first loses.” Then she added a mark to her own stroke right away: in what I had just said, I had rushed the words “a lifetime.” That counted."

[tracks.reunion_zahra]
name = "Zahra: A Book with Wide Margins"

[tracks.reunion_zahra.chapters.reunion]
title = "A Book with Wide Margins"
text = "In 1564 I came back to Mocha. My ship had barely tied up when a student came asking my name. He said he was from Zabid, and he led me to a lecture room in the mosque by the harbor. Zahra sat at its head. She could grant licenses of her own now. Her students came from Taiz, from Sana’a, from Hadramawt, row after row of them reaching to the door, and a boy at the front was stumbling through a chain of transmission. “Slow down,” she told him. “The transmitters aren’t going anywhere.” She saw me. Her eyebrows moved, and she didn’t stop. She let the boy finish, let three more students ask their questions, and only then beckoned me over. She handed me a book. It was the sailing verse and the stories I had sent home from port after port over the years, copied out by her students and bound, with margins left wide on all four sides, so wide they were almost a second book. The margins were crowded with her writing, item after item, every place she disagreed with me. She hadn’t thrown away a single page. “So this time,” she asked, smiling, “where did you hear all this?”"

[tracks.reunion_zahra.chapters.reunion.default]
effects = [{ text = "Najma, your ship did not come to Mocha. The harbor office says you took the southern route this year. I have noted it: one source, secondhand. All the sailing verse and stories you have sent over the years, I had my students copy out and bind into one book, with wide margins all around. In the margins are the places I disagree with you, four hundred and twelve of them. I counted. I am sending it all to you now; don’t complain about the weight. On page thirty you write that the salt mountain at Hormuz sings. I asked three merchants from Hormuz. One said it does. Two said you had too much coffee that day. On page fifty-seven I checked your star height the way you taught me, and you were right. I wrote “Granted” in the margin. That is the only one. I grant licenses myself now. My students come from Taiz, from Sana’a, from Hadramawt, and if they get one word wrong, I send them back to the beginning. Behind my back they call me Needle-Tip. I heard them, and I didn’t punish them. When you reply, answer point by point, and no picking and choosing. Where you can’t refute me, write that down too. Write “Granted.” — Zahra" }, {}]

[tracks.reunion_zahra.chapters.reunion.choices.friend]
text = "Take the book and answer her criticisms in the margins, one by one."
reply = "I borrowed a low table from behind her lecture seat and started answering from the first page. She said I had written the depth off Socotra too shallow; I answered that it was measured in the dry season. She said I had written a star’s name in sailors’ slang; I answered that sailors get home alive on that slang. I answered one, she read it, then marked it again under my answer, the writing getting smaller and smaller. The first day I got to page ten, the second to page thirty, and by the evening of the third even the margins of the last page were full, three layers of writing stacked up: hers, mine, then hers again. She closed the book and weighed it in her hand. “Find another one.” The next day she actually did, its margins wider still, two names already written on the title page with a finger’s width left between them. “That finger’s width,” she said, “is for the next argument.”"
effects = [{}, {}, {}, { title = "A Book with Wide Margins" }]

[tracks.reunion_zahra.chapters.reunion.choices.rival]
text = "Tell her margins aren’t enough: for the stories I’ve heard at sea, she can’t fault a single source."
reply = "“Can’t fault them?” Zahra called back the students who were getting up to leave. “You tell them, these people listen, and I’ll fault them right here.” I told ten stories: the whale oil at Zanzibar, the salt mountain at Hormuz, a widow in Cambay who took the helm in her husband’s place. After each one she asked who had told it, who that person had heard it from, in which port, in what year. In nine of the ten she found the flaw: one had passed through three mouths, another came from a man who had never seen it himself. The students sat there with their mouths open. The tenth was a night of phosphorescence I had seen with my own eyes off the Maldives, with no one else there, only me. She questioned me a long while and could not produce a second witness. She set down her pen. “That one, I concede.” The students burst out laughing. She glared at them, then turned back to me. “Next year, bring ten more.”"
effects = [{}, {}, {}, { title = "A Book with Wide Margins" }]

[tracks.reunion_zahra.chapters.reunion.choices.love]
text = "Turn to the last page and write a line in the margin meant only for her."
hint = "The pen hovers over the last page a long time. What you couldn’t say back then, you can’t put down now."
reply = "I turned to the last page. There was a finger’s width of margin left. I wrote one line, very small, and pushed the book back to her. Zahra bent over that one line and stayed bent over it until the students at the front began to whisper. She closed the book and held it down on her knees. “This line has no source.” “I’m the source.” She stood and told her students the lecture was over for the day. When the last of them was out the door, she pulled me into the shadow of the pillar behind her lecture seat and kissed me. Her fingers rested on my wrist and tapped three times, one heavy and two light. “That line I wrote on your verse that year,” she said, “did you read it once you were aboard?” “I did.” “Then now we’re even.”"
effects = [{}, {}, {}, { title = "A Book with Wide Margins" }]

[tracks.reunion_zahra.chapters.reunion.variants.with_rania]
text = "In 1564 I came back to Mocha. My ship had barely tied up when a student came asking my name. He said he was from Zabid, and he led me to a lecture room in the mosque by the harbor. Zahra sat at its head. She could grant licenses of her own now. Her students came from Taiz, from Sana’a, from Hadramawt, row after row of them reaching to the door. Beside her seat stood a stack of new books, the cords around them still smelling of the sea, brought for her by the owner of a book ship on the Red Sea. When she mentioned that owner, all Zahra said was, “She picks better books than she used to,” and she said it without the least bit of bite. The boy at the front was stumbling through a chain of transmission. “Slow down,” she told him. “The transmitters aren’t going anywhere.” When he had finished, she beckoned me over and handed me a book. It was the sailing verse and the stories I had sent home from port after port over the years, copied out by her students and bound, with wide margins on all four sides, and the margins were crowded with every place she disagreed with me. She hadn’t thrown away a single page. “So this time,” she asked, smiling, “where did you hear all this?”"
