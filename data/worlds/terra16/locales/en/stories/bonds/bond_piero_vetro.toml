# C7 重写（2026-10-11，Claude Opus）：stories/bonds/bond_piero_vetro.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 的 keep_gull / look_at_his_finger 第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个、重逢三个落点的第 4 个是 memory；重逢 default 的第 1 个效果是 letter。

[tracks.bond_piero_vetro]
name = "Piero Vetro: Even Shards Have Colors"

[tracks.bond_piero_vetro.chapters.c1]
title = "Even Shards Have Colors"
text = "The furnace had to be cleared of slag three times a day. The other apprentices shoveled up the spoiled cups, the snapped bottle necks, the drips of glass on the floor, carried the baskets down to the water, and tipped them into the lagoon with a crash. Piero didn’t shovel. He squatted on the stone floor by the furnace and picked the pieces up one at a time: green into one wooden box, amber into another, milk-white into a third, a row of boxes lined up at his feet. “Sorting your junk by color now?” I rapped his box with the shovel handle. He didn’t take offense. He fished two pieces out of the green box and held them up to my face. The same green, but one crack ran dead straight and the other wandered like a worm’s trail. “Even a crack has something to tell us,” he said. “Straight means it cooled too fast coming out of the furnace. Curved means sand got into the batch. Dump them all in the water together and next time you still won’t know what went wrong.” The apprentice with the shovel yelled at him to move. He put the two pieces back, left the lid open, and reached for the next one."

[tracks.bond_piero_vetro.chapters.c1.choices.help_sort]
text = "Crouch down, help him sort, and ask which box is the best."
reply = "I sorted by color; he read the cracks. Halfway through he pushed over the box nearest the wall. The pieces inside were almost black, glass cooked far too long, not one of them letting light through. “My first batch in this workshop. All ruined.” I asked what anyone would keep a color like that for; nobody would even put it in a window. He snapped the lid shut. “You keep it so you know how far you’ve come.”"

[tracks.bond_piero_vetro.chapters.c1.choices.laugh_more]
text = "Keep teasing: fill a whole room and the master will charge you rent."
reply = "He snatched up a shard and drew back his arm to throw it at me. I ducked, and what landed in my lap was a sugared almond. He had a fistful of them in his pocket and popped one in his own mouth. “Blow glass all day and all you taste is furnace ash. A person needs something sweet.” When work let out he split the almonds with me, half and half. The shards he kept to himself."

[tracks.bond_piero_vetro.chapters.c2]
title = "Cups Dumped in the Lagoon at Night"
text = "The master sent me down to the landing one night to fetch a sack of soda ash for the morning. The moon was bright, and the lagoon lay as flat as a gather of glass nobody had blown yet. Someone was crouched at the far end of the landing with a basket, lifting out a cup, looking at it, dropping it in the water—plunk—and reaching for the next. It was Piero. The basket held everything he had blown that day, twenty-odd cups, and every one of them was cracked. The glass for that batch had been bought on credit from the furnace owner, with the master standing surety, and the cost was coming out of Piero’s wages. I had done the sum for him: he’d still be paying it off next spring. He heard my footsteps and spun around, and his grip slipped. The basket tipped and nearly slid into the water, cups and all. I lunged and caught the rim. “Throwing the basket in too?” He didn’t thank me. He hugged the basket back against his chest and stared at me. “You didn’t see anything.” Seven cups were left in the bottom."

[tracks.bond_piero_vetro.chapters.c2.choices.hide_and_study]
text = "Help him hide the last seven, and find out tomorrow why they cracked."
hint = "He pulled the basket in tighter. You don’t know each other well enough yet for him to let you touch it, let alone cover for him with the master."
reply = "The seven cups went under the woodpile. It took us three days. We tried another blowpipe, we checked the batch, and in the end he went along the bricks at the mouth of the furnace inch by inch with the back of his hand: the half by the window ran cooler than the rest. “The heat’s uneven,” he said. “And my spot is the cold one.” He laid the seven cups out on a plank in order of their cracks, straightest to most crooked, then squatted there looking at them a long while. “Well. That batch wasn’t burned for nothing.”"

[tracks.bond_piero_vetro.chapters.c2.choices.tell_master]
text = "Tell him to go to the master first thing and own up."
reply = "“Own up and they still dock my pay.” “Throw them away and they still dock your pay,” I said. “Plus you get to feel guilty.” He went first thing the next morning. Through two doors I could hear the master yelling at him for a solid hour, until his voice went hoarse and he threw out, “Fine, it comes out of your wages a bit at a time.” Piero came out with furnace ash still in his hair and his face lighter than I’d seen it in days. “Getting yelled at beats throwing things in the lagoon. Every cup that sinks, something in you sinks with it.”"

[tracks.bond_piero_vetro.chapters.b1]
title = "The Thinnest Goblet"
text = "The master set us a contest: every apprentice would blow one goblet, and whoever made the thinnest got two extra days’ wages that month. I finished mine first, the walls so thin I was pleased with myself—and not long after it went into the annealing oven there was a crack, and it split clean in two at the waist. Somebody laughed. I turned and glared, and the laughing got louder. Piero’s came out of the oven last. The master held it up to the window, and the afternoon light went straight through it and laid a faint ring on the floor; you could see a single fine thread of air inside the glass. The whole room pounded the tables and cheered, and the master nodded then and there. “Now that is a goblet.” Piero stepped up to take it, still saying “Thank you, master,” but when his fingers closed on the stem they stopped, and his thumb rubbed once across the joint and back. I was standing close. I saw it: a crack there, as fine as a hair."

[tracks.bond_piero_vetro.chapters.b1.choices.keep_quiet_together]
text = "Say nothing. Once the crowd is gone, look at that crack with him."
hint = "He’s just won and the whole room is slapping his back. Walk up now and he’ll think you’ve come to expose him."
reply = "Once everyone had cleared out I cornered him behind the annealing oven. First he told me my eyes were annoyingly sharp, argued for a bit, and then brought the goblet out anyway. We spent the afternoon holding it to the window and worked out that the glass had gone half a breath too cold when he joined the stem, so the two pieces never fused through. Near dark he dug out an empty box, set the goblet inside very gently, and wrote on the lid in charcoal: WON AND CRACKED. “This box,” he said, pressing the lid down, “is just between you and me.”"

[tracks.bond_piero_vetro.chapters.b1.choices.learn_breath]
text = "Concede, and ask him how to breathe when blowing thin."
reply = "“I blow, I breathe, I blow. Watch.” He taught me properly, and on the third demonstration he burst out laughing and dropped his voice. “Mine cracked too, you know. In the stem.” I told him I’d seen. He glared at me and laughed again. By evening I had learned to split one breath into three, and he was leaving a little extra thickness in every stem he blew. “Thin is for the master to look at. Thick is for the people who drink out of it.”"

[tracks.bond_piero_vetro.chapters.b2]
title = "Money for the Batch"
text = "The furnace owner’s steward turned up right on the noon bell with a note in his hand. It had Piero’s name on it, that batch of glass, a sum, and a line underneath: pay in full by the end of the month, or he doesn’t touch the furnace again. Piero turned out every pocket he had—copper, a few small silver coins, even the fistful of sugared almonds, all spilled on the table. However he counted it, it came to half. The steward swept the half into his purse but left the note behind, weighted under an empty cup. “I’ll be back at month’s end.” The furnace was still lit. Piero sat down at its mouth, took the shards out of a box one at a time, and tossed them into the fire, watching each one soften, slump into a single drop, and lose whatever color it had been. “If I can’t blow glass,” he said, without taking his eyes off the fire, “what else am I good for?”"

[tracks.bond_piero_vetro.chapters.b2.choices.lend_wages]
text = "Lend him the wages I’ve saved. No interest."
hint = "He glanced at your purse and turned back to the fire. He won’t owe a classmate money yet. You’ll have to be closer before he lets that purse anywhere near him."
reply = "I put my purse on his knee. He pushed it back once, and I put it back again. “It’s a loan, not a gift. You pay back every last coin.” Only then did he take it, and he ran after the steward with it and came back with the note torn in two. A few days later he pressed a small cup into my hand, thick-walled, its rim a little crooked. “First one I blew with your money.” He flicked it with a fingernail, and it rang clear. “It didn’t crack.”"

[tracks.bond_piero_vetro.chapters.b2.choices.night_shifts]
text = "Work the night shifts with him and watch the heat so he can take on more."
reply = "Nobody fought over the night shifts, and they paid a tenth more. He blew; I watched the fire. When the flame at the mouth went white I fed it wood, and when it went red I opened the draft. We worked twenty-six nights that month, and when the last batch was done the sum on the note came out to exactly nothing. Toward dawn that day he fell asleep against the brick wall by the furnace with the blowpipe still in his hand. I didn’t wake him. I kept the fire on my own and watched it go from white to red."

[tracks.bond_piero_vetro.chapters.a1]
title = "The Day of the Marriage to the Sea"
text = "On Ascension Day the Doge’s golden barge came out from San Marco, so bright it hurt to look at, dozens of oars dropping together and lifting together. Boats packed the lagoon gunwale to gunwale. Nobody could row and nobody wanted to; everyone was waiting to watch the Doge throw the ring into the sea. Piero had borrowed a leaky little boat from somewhere, squeezed us into the crush, and bailed with a wooden scoop the whole way. Once we were in, he tossed the scoop aside and took a shard out of his pocket. Trumpets sounded from the barge. He didn’t turn around. He held the shard up to the sun, squinting one eye, tilting it. “Hold out your hand.” I did. The light came through the shard and dropped a little patch of blue on the back of my hand, the size of a fingernail, rimmed in white. All around us people were shouting; the ring must have gone under by then. “See that?” he said. “That’s the color of the sea.”"

[tracks.bond_piero_vetro.chapters.a1.choices.hold_the_blue]
text = "Keep my hand there under the blue until the barge goes home."
hint = "Holding out a hand is easy. Leaving it there is something else. You two aren’t that close yet—before long he’ll put the shard back in his pocket."
reply = "So he held it. The barge turned for home and he held it; half the boats around us drifted away and he was still holding it, his arm trembling, then switching hands and holding it some more. The blue wobbled on my hand, and every time it wobbled he adjusted the angle and found it again. Only when the barge was in harbor and the trumpets were far off did he lower the shard and shake out his arm. “Next Ascension Day, we borrow this boat again.” I told him the boat leaked. “Then we bail again.”"

[tracks.bond_piero_vetro.chapters.a1.choices.keep_the_debt]
text = "Promise him I’ll never mention the money for that batch to anyone."
hint = "He isn’t ready to lay that batch out in the open with you. Say this now and he’ll take it for pity."
reply = "He lowered the shard a little, and the blue slid off my hand. “You never mentioned it anyway.” “And I won’t,” I said. “Not until you want to bring it up yourself.” He thought about that. “When that debt’s settled on my side too, I’ll take you out on the Doge’s barge.” I said nobody gets on the Doge’s barge. He raised the shard again, and the blue came back where it had been. “Then I’ll blow you a golden one.”"

[tracks.bond_piero_vetro.chapters.a1.choices.which_color]
text = "Ask him which batch the shard came from."
reply = "“No batch.” He turned it over to show me the back, worn smooth and round, long past cutting anyone. “It’s the first cup I ever blew. I was five and standing on a stool, and it dropped off the pipe onto the floor. I’ve kept it ten years.” I said he was only fifteen; ten years was nothing to brag about. “When you’re fifteen, ten years is a whole life.” He tucked it back in his pocket. “And I’m not done keeping it.”"

[tracks.bond_piero_vetro.chapters.a2]
title = "A Gull Carved from the Window"
text = "Every day at noon a gull landed on the sill outside the furnace-room window to beg for bread. It was missing a toe on its left foot, and the apprentices called it Hobble. That day Piero pushed a cloth bundle across to me. Inside was a wooden gull, wings folded, neck tucked in, and its left foot—I counted—was missing a toe as well. “Shards cut. You can’t give them to people,” he said. “So I copied him in wood.” He turned the gull over. The base was wide and flat and planed smooth. “When you’re on a ship someday and the table rolls, this won’t fall over.” While he talked I noticed a strip of cloth wound around his left forefinger, a little dried red soaked through it. I asked what happened, and he whipped the hand behind his back. “There was a knot in the wood. The knife hit it and swerved.” Outside the window Hobble was back, head cocked, watching us."

[tracks.bond_piero_vetro.chapters.a2.choices.keep_gull]
text = "Take it, and tell him it looks more like Hobble than Hobble does."
hint = "His hand came forward, then drew back half an inch. You aren’t close enough yet for him to dare put a thing like this in your hands."
reply = "“The one outside is real,” he argued, because he had to argue. “The real one flies off. This one won’t.” Then he ducked his head and busied himself with his shard boxes, very seriously, putting a green piece in the amber box, taking it out, putting it back in. His ears had gone red right down to the lobes."
effects = [{ }, { }, { }, { title = "A Gull Carved from the Window" }]

[tracks.bond_piero_vetro.chapters.a2.choices.look_at_his_finger]
text = "Take it, then take his bandaged hand and look at it."
hint = "You reached for his bandaged hand and stopped halfway. Taking his hand now would be too soon."
reply = "His hand flinched in mine, then went still. The cloth was wound crooked, tied off in the knot you make when you hold one end in your teeth. “Carving’s more dangerous than glass,” he said. “Then stop carving.” He didn’t take his hand back. He kept his eyes on Hobble outside the window. “Depends who I’m carving for.”"
effects = [{ }, { }, { }, { title = "A Gull Carved from the Window" }, { }]

[tracks.bond_piero_vetro.chapters.a2.choices.feed_real_gull]
text = "Feed the real gull some bread to thank it for sitting for him."
reply = "We tore half a loaf into pieces and pushed the window open. Hobble snatched the biggest piece, beat its wings once, and was gone so fast it didn’t leave a shadow. Piero leaned out over the sill and called after the empty sky, “See? The real one flies off.” I set the wooden gull on the sill, beak pointed out. “This one can keep watch here for me. I’ll come and get it the day I leave.” He said it would be keeping watch for months. I said it was made of wood. It could wait."

[tracks.bond_piero_vetro.chapters.s]
title = "Send the Failures Too"
text = "The ship I’d signed onto would leave in spring, heading east—Corfu first, then wherever the wind said. Piero would finish his apprenticeship next year and be minding a furnace on Murano, and he’d hardly set foot off the island from one year to the next. Weeks before the ship sailed he came down to the landing with a wooden box in his arms. On the lid, in crooked charcoal letters: WON AND CRACKED. “Take it.” He shoved it at me. “Whatever you see out at sea that came out wrong, send it here. Don’t just pick the good stuff. Anyone can make the good stuff.” “Most of what goes wrong at sea is ships.” “Then send pieces of ship.” He said it as if it were obvious. “A bit of plank will do. I can tell how it split.” The box wasn’t heavy. When I shook it, it rattled, and one note rang out sharper than the rest, like a goblet stem."

[tracks.bond_piero_vetro.chapters.s.choices.promise]
text = "Agree to send him everything, good and bad, a box for a box."
hint = "He kept his grip on the box. A promise like this lasts a lifetime—either you aren’t close enough to make it, or you’ve already made it to someone else."
reply = "“A box for a box,” I said. “And you don’t get to send only the good ones either.” Piero counted on his fingers: how many times a year I could send, how many boxes a year he could fill. The further he got, the deeper he frowned. “Then I’ll need to make a lot more boxes. And find someone to give me the wood.” “Get it from me. Broken wood is the one thing the sea never runs out of.” He laughed and held out his little finger. I looked at it: the cut from carving the gull had healed into a thin white line. We hooked fingers right there on the landing. A porter unloading cargo glanced over, shook his head, and walked off. Even after we’d sworn it he didn’t let go. He had one more thing to say. “Wrap the broken ones properly. If a shard breaks again on the way here, I can’t see how it cracked the first time.”"
effects = [{ }, { }, { title = "Send the Failures Too" }, { }, { }, { }]

[tracks.bond_piero_vetro.chapters.s.choices.heart]
text = "Say when I come back grown, I want to see him blow a bowl that won’t crack, with words inside."
hint = "A sentence inside the bowl—you mean to say it, but the shards in the box rattle and push the words back down. Your heart hasn’t reached that heat yet—or you’ve already said such words to someone else."
reply = "He froze, holding the box, and didn’t move for a long moment. “What words?” “I’ll tell you when the bowl’s done.” “Big bowls are the hardest,” he said slowly. “The bigger they are, the easier they crack, and you can’t mend them.” He looked down at the charcoal letters on the lid for a long while before he spoke. “Then I’ll need years of practice.” “And I’ll be gone for years.” The day the ship sailed he came. He stood at the foot of the gangplank, didn’t say a word, and reached out and squeezed my hand once. His palm was all calluses from the furnace, and hot. He didn’t let go right away; he pressed something into my palm first, and only then turned and walked off. I didn’t open my hand until the ship was out of the lagoon. It was the blue shard from Ascension Day, its edges worn round."
effects = [{ }, { }, { }, { }, { title = "Send the Failures Too" }, { }, { }]

[tracks.bond_piero_vetro.chapters.s.choices.own]
text = "Bet him: when we meet again, first to blow a big bowl without a crack wins."
reply = "“How are you going to blow glass at sea?” He glared at me. “Light a furnace on a ship and the captain throws you overboard first.” “There’s fire on ships. The cook’s stove, the smith’s forge, lamps at night.” He laughed so hard he doubled over and had to hold on to a mooring post, and the box nearly went in the water before he grabbed it. When he’d laughed himself out, he thumped the box into my arms. “You’re on. Loser pays the winner’s glass money for a year.” “Can you even save up a year’s glass money?” “That’s why I’m not going to lose.” He stuck out his chin. “My bowl goes here, yours—if you still remember how to breathe by then—goes next to it, and the master taps them. Whichever goes dull first loses.” He held out his hand and we slapped palms so loud the porters turned around."

[tracks.reunion_piero_vetro]
name = "Piero Vetro: More and More Boxes"

[tracks.reunion_piero_vetro.chapters.reunion]
title = "More and More Boxes"
text = "Six years later I came back to Murano. The furnace was the same furnace; the gull begging on the sill was a different gull. Piero had finished his apprenticeship and ran a furnace mouth of his own. The whole back wall of the workshop was nailed with shelves, and the shelves were all wooden boxes, arranged by color: milk-white to amber, amber to green, green to nearly black. The oldest, most battered one sat dead center. He had that box in his hands right now, showing two shards to a new apprentice of twelve or thirteen. “Straight means it cooled too fast; curved means there was sand in the batch—” The same lines as back then, not a word changed. The apprentice saw me first and nudged him with an elbow. He turned around, blinked twice, and the first thing out of his mouth was: “Did you bring the shards?” I dug a cloth bundle out of my baggage: broken pottery I had picked up on the beaches of a good many ports over the years, glazed and unglazed, some with half a pattern left. He took it in both hands, cupped, as if it were a bag of gold."

[tracks.reunion_piero_vetro.chapters.reunion.default]
effects = [{ text = "If this letter catches up with you, it means the road from Murano to the sea is shorter than I thought. You didn’t come back. My guess is the wind was wrong, or the ship was wrong—anyway, it won’t have been you. There’s a little shard folded into this letter, from a batch I ruined the spring you left, the very week you sailed. Look at the crack. Curved. Sand in the batch. All the sand was bad that year; my hands were fine. It took me years to be sure enough to write that down, and now you have to back me up. There are forty-one boxes on the workshop wall now. The oldest is still dead center, and the new apprentices learn their cracks from it. There’s a different gull at the window, with all its toes. It’s meaner than the old one; it takes your fingers along with the bread. The glass money was paid off long ago, and the furnace owner’s steward even nods to me now. Whatever you see out at sea that came out wrong, keep sending it. Don’t bother with the good stuff; the world is full of it. Some year when the wind is right and the ship is right too, come home. Next to the old box in the middle of the wall, I haven’t put anything else. —Piero, Murano" }, { }]

[tracks.reunion_piero_vetro.chapters.reunion.choices.friend]
text = "Stay and help him fit the shards from the sea into the boxes on the wall."
reply = "When the workshop closed for the day we spread the bundle out on the long table. The new apprentice couldn’t bear to leave; Piero sent him off to light the lamps, and he crept back and crouched by the table to watch. Broken pottery isn’t glass; its cracks follow other rules. Piero picked up a piece with a blue flower on it, turned it this way and that for a long time, and gave up. “I can’t read this one. You tell me.” I told him it had been cargo packed at the very bottom of a hold: in heavy seas the layers press down on one another, and the bottom cracks first. He listened, wrote it on a slip of paper, and tucked the paper under the shard. We sorted until midnight, and the wall gained a new box. On the lid he wrote in charcoal: FROM THE SEA. Then he stepped back two paces to look, and moved it from the corner to the middle of the wall, right beside the old box. “This one,” he said, patting the apprentice on the head, “is for teaching your bunch.” The apprentice was already asleep with his head on the table."
effects = [{ }, { }, { }, { title = "More and More Boxes" }]

[tracks.reunion_piero_vetro.chapters.reunion.choices.rival]
text = "Challenge him: fire up the furnace tomorrow, first big bowl without a crack wins."
reply = "Before dawn the next day the furnace was roaring. Word went around that someone had challenged the master to a bowl contest, and the apprentices stopped working to hang in the doorway and watch. He was the one who shouted out the stakes: a year’s glass money, paid by whoever lost. Big bowls eat breath. All these years at sea I had blown nothing but a few lamp chimneys, and my first bowl went lopsided halfway through. The second came out round at last—and out of the annealing oven with two cracks in the rim. His was a size bigger, round as a full moon, with one crack in the base so fine you had to carry it to the window to see it. “A draw,” he said. “You’ve got one fewer.” “One crack is still cracked. Cracked is a draw.” “What about the year’s glass money?” “Draws don’t pay.” We argued from noon until evening while the apprentice yawned beside us, and the furnace went out, and neither of us gave an inch. In the end he set the two bowls side by side in a new box on the wall and wrote on the lid: A DRAW. NEXT TIME, WE’LL SEE."
effects = [{ }, { }, { }, { title = "More and More Boxes" }]

[tracks.reunion_piero_vetro.chapters.reunion.choices.love]
text = "Stay after the furnace goes out and watch him blow the bowl with words in it."
hint = "He holds the bundle of shards in both hands, eyes only on them. You never said what should have gone in that bowl, and now, with a whole wall of boxes between you, you still don’t."
reply = "The apprentices had all gone home, and the only light in the workshop was a little red in the firebox. He climbed on a stool and pulled the cloth off the top shelf: underneath was a stack of bowls, big and small, every one of them cracked. “All the ones from these years,” he said. “Every one was meant to hold those words.” He stirred the fire up again, picked out the clearest gather of glass, and without a word blew for a long, long time. By the time the bowl came out of the furnace it was nearly dawn. It wasn’t big, and its walls were thick, and there wasn’t a single crack in it. He waited until it had cooled all the way in the annealing oven before he lifted it out and handed it to me, then turned his back to tend the fire. A line of small letters was cut into the base, so shallow you had to hold it to the light to see it. I read it, then read it again. “Aren’t you going to read it out?” “Took me six years to get it right,” he said with his back to me. “Say it out loud and it’s worth nothing.” I set the bowl down on the long table and walked over. When he turned around, the firelight was on his face and on the pale scar across his left forefinger. He kissed me, very lightly, as if afraid of cracking something. Later that bowl went to sea with me and sat beside the wooden gull. However hard the ship rolled, neither of them ever fell."
effects = [{ }, { }, { }, { title = "More and More Boxes" }]

[tracks.reunion_piero_vetro.chapters.reunion.variants.bet_kept]
text = "Six years later I came back to Murano. The furnace was the same furnace; the gull begging on the sill was a different gull. Piero had finished his apprenticeship and ran a furnace mouth of his own. The whole back wall of the workshop was nailed with shelves full of wooden boxes, arranged by color, the oldest and most battered dead center. He had that box in his hands, teaching a new apprentice to read cracks with the same lines as back then. The apprentice saw me first and nudged him with an elbow. He turned around, looked me up and down, and the first thing out of his mouth was: “Where’s the bowl?” I said the bowl wasn’t done yet; the shards would have to do for now. I dug a cloth bundle out of my baggage, broken pottery from the beaches of a good many ports. He took it in both hands, as if it were a bag of gold, and still had to get his dig in. “Shards accepted. That year of glass money is still on the books.”"

[tracks.reunion_piero_vetro.chapters.reunion.variants.blue_shard]
text = "Six years later I came back to Murano. The furnace was the same furnace; the gull begging on the sill was a different gull. Piero had finished his apprenticeship and ran a furnace mouth of his own. The whole back wall of the workshop was lined with wooden boxes in order of color, the oldest and most battered dead center; on the top shelf sat something else, draped in cloth, its shape impossible to make out. He had the old box in his hands, teaching a new apprentice to read cracks with the same lines as back then. The apprentice saw me first and nudged him with an elbow. He turned around and stopped mid-sentence. His eyes went to my hands first, then flicked up to the top shelf and away. “Did you bring the shards?” I passed him a cloth bundle of broken pottery picked up on beaches over the years. The blue one I hadn’t put in. I still carried it next to my skin."

[tracks.reunion_piero_vetro.chapters.reunion.variants.box_on_sill]
text = "Six years later I came back to Murano. The furnace was the same furnace; the gull begging on the sill was a different gull. Piero had finished his apprenticeship and ran a furnace mouth of his own. The whole back wall of the workshop was lined with wooden boxes in order of color, the oldest and most battered dead center. I recognized the box beside it—the one I had left on the windowsill the spring I sailed. The old charcoal letters on the lid had been rubbed out, and new ones written: LEFT BEHIND. He had the old box in his hands, teaching a new apprentice to read cracks with the same lines as back then. The apprentice saw me first and nudged him with an elbow. He turned around and looked at me for a long time, then jerked his chin at that box. “This time, are you taking it?” I didn’t answer. First I dug a cloth bundle out of my baggage, broken pottery picked up on beaches over the years. He took it in both hands, cupped, as if it were a bag of gold."
