# 杯底的口述（bond_leyla_fincan）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_leyla_fincan]
name = "Leyla Fincan: Orders Dictated Over Coffee"

[tracks.bond_leyla_fincan.chapters.c1]
title = "Orders Dictated Over Coffee"
text = "When the arsenal stopped for the midday break, an old shipwright squatted down at the coffee stall and rattled off his order in one breath. “Twelve compass timbers, two keel knees, frames from the third station on, two fingers narrower at each—” He ran faster than the Bosphorus current. Leyla’s reed pen chased him for three lines and fell behind. She banged her cup down on the table. “Finish your coffee before you fight—the words aren’t written down yet.” The old man took a sip and kept going. She rapped the table with the pen. “What wood is a compass timber? And since when does a keel have knees?” I had grown up picking shavings off the floor under the slipways, and I couldn’t stand it. The words were out before I thought. “Compass timber is oak that grows crooked on its own—that’s what frames are made of. The knee is the piece where the keel meets the stem.” Leyla shot me a look, as if I had no business butting in. The next moment she pushed her cup across to me, the order sheet pinned under it, a brown ring soaking into the paper. “You read it out. I’ll write.”"

[tracks.bond_leyla_fincan.chapters.c1.choices.teach_terms]
text = "Read her the shipyard words one by one, and have her teach me to write them."
reply = "That afternoon I gave her twelve words: compass timber, keel knee, frame, stem, bulwark… She wrote each one down, then took my hand in hers and taught me to write my own name. My strokes leaned every which way, like a mast after a storm, and she laughed so hard she slopped half a cup of coffee across the order sheet. “Wonderful,” she said, dabbing at it with her sleeve and only spreading it further. “A cup ring, and now a whole puddle.” The sheet went off to the timber yard all the same. The two brown stains never came out."

[tracks.bond_leyla_fincan.chapters.c1.choices.slow_the_shipwright]
text = "Stop the old shipwright and ask him to give the sizes again, slowly."
reply = "The old man set down his cup. “A girl at a coffee stall writes a few words, and now she needs waiting on?” But for all his grumbling, the second time he gave the numbers one at a time, and even paused while she dipped her pen. Leyla wrote it all out, blew it dry, and handed it over. Once he had wandered off with his hands behind his back, she wrinkled her nose and pulled a face at him, then turned around and pulled one at me."

[tracks.bond_leyla_fincan.chapters.c2]
title = "The Cooper Who Would Not Pay"
text = "A cooper on the Kasımpaşa docks had bought coffee beans from Leyla’s family on credit for three months. When the day came to settle, he waved the receipt and said it read two sacks, not five. Leyla had written that receipt, and in her hurry the stroke had trailed off: you could read it as a two, or as a five. Below the number was her mother’s stamp, a wooden seal worn round at the edges. Behind the stall Leyla crushed the receipt into a ball, then smoothed it out again bit by bit, her eyes rimmed red. “I wrote a five. I know what I wrote.” She tore off her apron to go. Her mother caught her sleeve and said it was only three sacks; let it go, you can’t win a shouting match with the dock people. Leyla shook her off and turned to me. “You’ve heard coopers brag on the slipways your whole life. Are you coming with me or not?”"

[tracks.bond_leyla_fincan.chapters.c2.choices.go_with_her]
text = "Go with her to the docks and check the receipt against the cooper’s own books."
hint = "She asked if you were coming, but the moment it means an outsider poring over the family’s accounts, she tucks the receipt away. “Never mind. I’ll go myself.”"
reply = "The cooper’s apprentice used to shave barrel hoops for us on the slipways. I handed him a sesame cake, and three sentences later I had it: the shop had taken in five sacks that month, and the empty sacks were still piled against the back wall. The cooper went red, then white, counted out the money, and slapped it on the table. Back at the stall, Leyla traced the number on that receipt over and over, until the ink shone as if it had been carved into the paper."

[tracks.bond_leyla_fincan.chapters.c2.choices.write_new_receipt]
text = "Talk her into going back to the stall to work out a receipt no cooper can dodge."
reply = "We tried things behind the stall for half the afternoon, and what we came up with was clumsy: write the amount once in figures, then again in words after it—“five sacks exactly.” The next day she started doing it on every receipt. She wrote everything twice until her wrist ached, cursing the cooper the whole time. One curse, one “exactly.”"

[tracks.bond_leyla_fincan.chapters.b1]
title = "Reed Pen and Siyakat"
text = "The arsenal clerk had too little to do, so he set a low table outside the storehouse and read off a list of timber coming in and going out, to see which of the apprentices could take it down fastest and cleanest. The shipwrights egged it on and shoved Leyla forward too. “The girl from the coffee stall writes fast—let her have a go!” She wrote in siyakat, every number shrunk to a little hook, and finished first. She clamped the reed pen in her teeth and jutted her chin at me. I plodded on to the last line. The clerk laid the two sheets side by side. “Seven oak logs. You’ve written seventy.” “I wrote seven!” “This hook is seventy.” He paid her no more attention and gave the win to me. The prize was a cup of coffee, from Leyla’s family’s stall as it happened. She went and fetched it, set it down in front of me hard enough to slop out half, the reed pen still between her teeth, bitten flat."

[tracks.bond_leyla_fincan.chapters.b1.choices.share_the_cup]
text = "Push the prize cup back in front of her, and split it between us."
hint = "She has just lost and is chewing on her pen in a sulk. Push the cup at her now and she’ll think you’re gloating."
reply = "She snorted, but she sat down, took a big swallow, and only pushed the cup back when half of it was gone. “Next time I’ll write slower,” she said. “And don’t think you’ll win either.” On her way out she shoved the bitten-flat reed pen into my hand. “Take it. Next time we race, we swap pens.”"

[tracks.bond_leyla_fincan.chapters.b1.choices.learn_siyakat]
text = "Ask her to teach me siyakat, so next time we can have a fair race."
reply = "She taught fast and fierce, and no hook or bend was allowed to lean. The marks for “seven” and “seventy” she made me write fifty times, reading each one aloud as I went. Somewhere past thirty she collapsed laughing across the table. “Seven, seventy, seven, seventy… it sounds like I’m swearing at you.”"

[tracks.bond_leyla_fincan.chapters.b2]
title = "The New Coffeehouse"
text = "After the spring the whole city was talking: a coffeehouse had opened in Tahtakale, run by two men from Syria, people said—one from Aleppo, one from Damascus. It had benches, it had a chessboard, and in the evenings someone read poetry. Half the shipwrights went over there when the arsenal let out, and the crowd at Leyla’s stall thinned. She dragged me along to see it. We sat in the farthest corner. She didn’t drink a drop; her eyes were fixed on the slate behind the counter, where the owner kept his accounts in chalk—who owed how many cups, written plainly where anyone could see, so regulars glanced at their own names as they came in. All the way back she kicked stones, and she didn’t say a word until we reached the water’s edge. “Our stall needs a board with writing on it too. Who owes how much, up where everybody can see. Then let’s see who has the nerve to skip out.”"

[tracks.bond_leyla_fincan.chapters.b2.choices.buy_two_cups]
text = "Spend my saved wages on two cups at the new place, so she can study the slate."
hint = "She pushes your purse back at you. “Fretting over some new coffeehouse, and you paying for it? I do have some pride.”"
reply = "We made those two cups last the whole afternoon. She copied the slate’s columns onto her palm one square at a time—whose name went on top, which column the money went in—until one hand was full. Two weeks later a wooden board went up at Leyla’s stall, and the first line on it was me: “Slipway apprentice, owes one cup.” I said I was the one who paid for both. “You paid,” she said, “and you owe. Both.”"

[tracks.bond_leyla_fincan.chapters.b2.choices.hang_a_board]
text = "Go back and nail up a board for writing on at her mother’s stall."
reply = "The board was an offcut I picked up on the slipways, and my hammer slipped while I nailed it, so it went up crooked. Leyla stood on a stool to write the first line while her mother craned up at it from below and asked what it said. “It says who still owes us money.” Her mother nodded, then pointed at the very top. “And those words?” “That’s the name of our stall.”"

[tracks.bond_leyla_fincan.chapters.a1]
title = "Her Mother’s Signature"
text = "After the stall closed I went back for a plane I had left behind and found Leyla crouched by the brazier, writing the same name on one sheet after another. Finished scraps lay all over the floor, curling at the edges in the heat. I picked one up. I couldn’t read all of it, only enough to see that every sheet was the same. “My mother’s name.” She didn’t look up. “She can’t read. The signature on the stall’s license—I held her hand and walked her through it, stroke by stroke. She traced it all winter.” She weighted a finished sheet under a brick and pulled out a fresh one. “The market inspector is coming next month to check the licenses. If he tells my mother to sign one more right in front of him…” She stopped there. The reed pen kept scratching across the paper. In the brazier a coal split with a sharp crack."

[tracks.bond_leyla_fincan.chapters.a1.choices.sit_till_done]
text = "Nudge the brazier toward her and stay until the last sheet is done."
hint = "She sweeps the scraps behind her. “Go home. There’s nothing to see here.” You aren’t close enough yet to sit up with her through this."
reply = "One of us wrote and the other squared the finished sheets into a stack. Around midnight the coals were nearly out and her hands were too cold to hold the pen, so I took them in mine and rubbed them. She didn’t pull away. When they were warm she wrote one more sheet, then asked out of nowhere, “Are you coming tomorrow?” I said I was. She folded the last sheet into a tiny square and tucked it into my cuff."

[tracks.bond_leyla_fincan.chapters.a1.choices.keep_her_secret]
text = "Promise to keep this to myself, and help her mother find a mark she can draw."
hint = "Telling you was as far as she can go. Stepping into her mother’s affairs—you two aren’t there yet."
reply = "The mark we came up with for her mother was a boat: one curved stroke for the hull, one for the mast, a triangle for the sail. Three strokes and done. Her mother practiced behind the stall for three days, and by the third the sail on her boat was full of wind. On the day the inspector came she signed the name she had traced so long, added a little boat after it, and her hand didn’t shake at all. Leyla stood beside her holding a cup of coffee the whole time, until it went cold."

[tracks.bond_leyla_fincan.chapters.a1.choices.ask_first_time]
text = "Ask her: the first time your mother signed her own name, did she smile?"
reply = "“She cried,” said Leyla. “Then she pushed the pen back into my hand and told me to teach her again.” She bent down and picked up the scraps from the floor one at a time, slowly, and never once let me see her face."

[tracks.bond_leyla_fincan.chapters.a2]
title = "Charcoal Words on the Lid"
text = "One evening in June, Leyla stood in the doorway of the slipway shed holding a small wooden box. It was an old one that had once held coffee beans, and a burnt, roasted smell still seeped from the seams. “Sugared figs. My mother made them. They’re for you.” Across the lid, in charcoal, ran a line of writing, the strokes thick in one place and thin in the next, one hook bent the wrong way: “Hot weather. Eat within three days.” I read it aloud. She watched me the whole time, and only when I had finished did she say, “My mother wrote that herself. First time ever. She didn’t trace it from anything of mine.” She said it as if it were nothing, but the fingers of one hand kept drumming on the doorframe, hard enough to shake loose splinters. “Three days,” she added. “If they go bad after that, don’t you dare say she made them wrong.”"

[tracks.bond_leyla_fincan.chapters.a2.choices.keep_the_lid]
text = "Take the figs, and tell her I’m keeping the lid for that line of writing."
hint = "This is the first thing her mother ever wrote on her own. It weighs too much; you two aren’t close enough yet for you to take it."
reply = "Within three days I had eaten every last fig, but the lid I wiped clean and stood on the shelf by my bed, the charcoal words facing out. When Leyla heard, she came over to call me an idiot. “A scrap of board, and you treat it like a license?” Then she told me her mother had laughed so hard at the news she slapped her knees, and said next time she would write something longer."
effects = [{}, {}, {}, { title = "Charcoal Words on the Lid" }]

[tracks.bond_leyla_fincan.chapters.a2.choices.write_back]
text = "Take the figs, and write a line back to her mother on the underside of the lid."
hint = "You lift the pen and set it down again. Writing a line back under her mother’s words—you two aren’t that close yet, and you couldn’t find the words if you were."
reply = "I pulled the reed pen from behind her ear and wrote on the underside of the lid: “Very sweet. Three days—I promise.” The letters still leaned, but every stroke was there. Leyla took the lid and started home, then turned around halfway and came back, out of breath, to stand in the doorway. “Then next time, you write a line for me too.” She ran off before I could answer."
effects = [{}, {}, {}, { title = "Charcoal Words on the Lid" }, {}]

[tracks.bond_leyla_fincan.chapters.a2.choices.share_now]
text = "Open it on the spot and give her half—it takes two to finish in three days."
reply = "We sat side by side on the threshold of the shed, popping them into our mouths one after another, syrup running down our fingers. Halfway through she licked her fingers and asked, “Can you taste my mother’s hand in them?” I said I could, and that they were sweeter than the coffee at the stall. She jabbed me with her elbow."

[tracks.bond_leyla_fincan.chapters.s]
title = "The Last Line of the Receipt"
text = "At the end of the year the arsenal assigned its apprentices to ships. My name went down under a merchantman bound for Alexandria; I would sail in the spring. When word reached the coffee stall, Leyla said nothing at all. She poured for the shipwrights and kept her accounts as always. At closing she pushed a receipt across to me. My name stood at the top, not one stroke crooked. In the amount column: “one cup.” Below that ran a list of dates, line after line, counting from the cup ring on that order sheet in the spring we met. The last line had only been started; the rest of it was bare. “I’m staying,” she said. “I’ll write receipts for the little workshops on the docks, the kind nobody can wriggle out of. Before you go—” she turned the reed pen around and held it out to me, shaft first, “this line is yours to write.”"

[tracks.bond_leyla_fincan.chapters.s.choices.promise]
text = "On the last line, write: every time I make port, I settle up at her stall first."
hint = "She holds the pen out to you, and you can’t bring it down. This line is for life, and what you share can’t carry that entry yet—or you’ve already written the same entry into someone else’s ledger."
reply = "I wrote slowly, and she watched without hurrying me once. “Every time I make port, I settle up here first.” When I finished I turned the paper toward her. Leyla read it through, then ran a fingernail under the word “first,” as if afraid I might someday pretend not to see it. She folded the receipt in half, pressed it flat, slid it into the pocket at the front of her apron, and patted it twice through the cloth. “I’ll keep this one for you,” she said. “Where your ship puts in is none of my business. But the day it comes back to the Golden Horn, if you don’t come here first—” she picked up her long-cold coffee and drained it in one go, “that’s skipping out on a debt. And nobody on the Golden Horn has dared skip out on mine yet.” Behind the stall her mother had heard every word. She shook her head, smiling, and dropped another coal into the brazier."
effects = [{}, {}, { title = "The Last Line of the Receipt" }, {}, {}, {}]

[tracks.bond_leyla_fincan.chapters.s.choices.heart]
text = "Leave the last line unwritten, and say I’ll come back to fill it in once we’re grown."
hint = "You want to say, “Leave it—I’ll come back and fill it in when we’re grown,” but your mouth opens and closes again. What you feel can’t fill that line yet—or those words are already promised to someone else."
reply = "I handed the reed pen back and said we should leave that line for now; when we were both grown, I would come back and fill it in. Leyla looked at me for a long time, long enough for the fire in the brazier to sink a little lower. She didn’t ask how long she would have to wait, or what I meant to write; she only twirled the reed pen once between her fingers. She folded the receipt in half, then in half again, into a small square, took my hand, laid it in my palm, and closed my fingers over it one by one. Her fingertips rested in my palm a moment before she drew them back. I held that little square of paper so tight my knuckles went white. “Then you have to come back,” she said. “I never forget a debt.” That day I walked a long way before I looked back. She was still standing by the stall, her apron strings lifting in the wind off the sea."
effects = [{}, {}, {}, {}, { title = "The Last Line of the Receipt" }, {}, {}]

[tracks.bond_leyla_fincan.chapters.s.choices.own]
text = "Agree we’ll each keep our own books, and see who gets a shop of their own first."
reply = "“Me,” said Leyla, without even thinking. “You’ll be at sea. You won’t even have a table.” I said a table on a ship is still a table; the purser’s is nailed to the deck, and no wave can tip it over. She said a nailed-down table isn’t a shop, it belongs to the ship. We argued from shops to doors and windows, and from doors and windows to what letters the sign should use, until her mother came out with the brazier and shooed us off. “If you want to fight, go fight on the docks. I’m closing up.” For all her shooing, she topped up both our cups with another half. Leyla grabbed the pen, wrote the word “wager” on the receipt’s last line, and slapped the paper against my chest. “Hold on to that. Loser buys a year of coffee, and not one day short.”"

[tracks.reunion_leyla_fincan]
name = "Leyla Fincan: The Writing Desk by the Stall"

[tracks.reunion_leyla_fincan.chapters.reunion]
title = "The Writing Desk by the Stall"
text = "In 1562 my ship came into the Golden Horn. The coffee stall by the arsenal gate was still there, and next to it now stood a writing desk, one leg short and propped on two bricks. Three or four hands from the small workshops stood in line in front of it, order slips in their fists, waiting to have receipts written. Leyla sat behind the desk, listening and writing at once. When she finished a sheet she turned it around. “Read it back. If it’s right, put your thumbprint on it.” Her mother brewed coffee behind her, and at her elbow, pinned under a board, lay a license with the signature written neat and square. Leyla looked up, saw me, and her pen stopped. She tucked the reed pen behind her ear, fished a receipt folded many times over out of her apron, its corners worn soft, and smoothed it open on the desk. “That cup you owe me,” she said. “I haven’t worked out the interest yet.”"

[tracks.reunion_leyla_fincan.chapters.reunion.default]
effects = [{ text = "Receipt. Payer: the slipway apprentice. Amount: one cup, outstanding. My mother says a receipt can’t be just those few words, so I’ll keep going. Your ship didn’t come into the Golden Horn this year. Some people on the docks say you got held up in Alexandria; some say you went somewhere farther. I don’t believe any of them. I believe the harbor’s ship lists, and you aren’t on them. There’s a writing desk next to the stall now. One leg is short, so it stands on two bricks. I write receipts for eleven little workshops on the docks, and that cooper from Kasımpaşa is one of them. He pays faster than anybody now—scared, I suppose, that I’ll put his name up on the board. My mother hasn’t needed me to guide her name for a long time. She writes slower than I do, but neater, and the inspector has been twice without finding a thing wrong. Over in Tahtakale two more coffeehouses have opened. The shipwrights went and sat in them and came back saying the people there talk too fancy to order timber. The cup you owe me is still earning interest, a tenth a year, compounded. I’m not hounding you. But the day you come back, come here first. Don’t make me hear from somebody else that you’re in port. —Leyla. P.S. I wrote this receipt three times. I ruined the first two. Drink your coffee, then read it. I’ll be waiting." }, {}]

[tracks.reunion_leyla_fincan.chapters.reunion.choices.friend]
text = "Settle that cup on the spot, interest and all, and agree to come here first every time I make port."
reply = "She worked out the interest with her reed pen on the back of the receipt: six years, a tenth a year, compounded. It came to a whole pot. I said that was no way to reckon a cup of coffee. She said it was exactly how the Golden Horn reckoned it, and if I didn’t like it I could take it up with the market inspector. I drank that pot from afternoon until dark. In between, she wrote seven more receipts for the hands in line, and after every one she came back to top up my cup. When it was fully dark she drew a check mark on the old receipt, pressing so hard the nib tore the paper a little. Then she pulled out a fresh sheet, wrote my name at the top, and in the amount column: “Next time.” She pushed the new receipt across to me. “Every time you make port, come to this desk first. You don’t have to write this one. I’ve written it for you.”"
effects = [{}, {}, {}, { title = "The Writing Desk by the Stall" }]

[tracks.reunion_leyla_fincan.chapters.reunion.choices.love]
text = "Tell her that this time I want to wait until the stall closes, to say something to her alone."
hint = "The worn receipt lies open on the table. You never wrote that last line back then, and today, with her pen tucked right there behind her ear, you still can’t write it."
reply = "She gave me one look, asked nothing, and bent to the next receipt. By the time the sun had sunk behind the hills at Eyüp, the last workshop hand had pressed his thumbprint and gone. Her mother carried the brazier inside and let the door curtain fall behind her. Leyla squared up the papers on the desk one by one, stood the reed pen back in its cup, wiped the desk clean, and only then sat down across from me. “Now you’re the only customer left. Go on.” I told her everything I had wanted to say all those years at sea, every bit of it in the wrong order, and she didn’t interrupt once. When I was done, she smoothed the old receipt flat, picked up the pen, and on the last line wrote her own name. Then she set the pen down, leaned across the desk, and kissed me. “Paid in full,” she said against the corner of my mouth. “From now on, we start a new book.”"
effects = [{}, {}, {}, { title = "The Writing Desk by the Stall" }]

[tracks.reunion_leyla_fincan.chapters.reunion.variants.v1_romance]
text = "In 1562 my ship came into the Golden Horn. The coffee stall by the arsenal gate was still there, and next to it now stood a writing desk, one leg short and propped on two bricks. Three or four hands from the small workshops stood in line in front of it, order slips in their fists, waiting to have receipts written. Leyla sat behind the desk, listening and writing at once. When she finished a sheet she turned it around. “Read it back. If it’s right, put your thumbprint on it.” Her mother brewed coffee behind her, a license at her elbow with the signature written neat and square. I joined the end of the line. When my turn came I took out the receipt folded into a small square, laid it on her desk, and opened it one fold at a time. Its corners were worn soft, and the last line was still unwritten. Leyla stared at it for a good while before she tucked the reed pen behind her ear. “You still have it. That cup you owe me—I haven’t worked out the interest yet.”"

[tracks.reunion_leyla_fincan.chapters.reunion.variants.v2_own]
text = "In 1562 my ship came into the Golden Horn. The coffee stall by the arsenal gate was still there, and next to it now stood a writing desk, one leg short and propped on two bricks. Three or four hands from the small workshops stood in line in front of it, order slips in their fists, waiting to have receipts written. Leyla sat behind the desk, listening and writing at once. When she finished a sheet she turned it around. “Read it back. If it’s right, put your thumbprint on it.” She looked up, saw me, and her pen stopped. Then she tucked the reed pen behind her ear and slapped both hands down on the desk, twice. “See this? A desk. Mine. I got there first.” I pulled the receipt out of my coat and slapped it on the desk; the word “wager” was still there on the last line. She barely glanced at it. “A year of coffee—you’ve lost. And that cup you owe me, I haven’t worked out the interest yet.”"

[tracks.reunion_leyla_fincan.chapters.reunion.variants.v3_parted]
text = "In 1562 my ship came into the Golden Horn. The coffee stall by the arsenal gate was still there, and next to it now stood a writing desk, one leg short and propped on two bricks. Three or four hands from the small workshops stood in line in front of it, order slips in their fists, waiting to have receipts written. Leyla sat behind the desk, listening and writing at once. When she finished a sheet she turned it around. “Read it back. If it’s right, put your thumbprint on it.” She looked up, saw me, and her pen stopped. She didn’t get up. She reached under the slate the stall kept its accounts on and drew out a receipt, pressed flat under there for six years and gone yellow, its last line still unwritten. “The day you sailed, I didn’t come down to the docks.” She laid the receipt on the desk. “But I didn’t forget the account. That cup you owe me—I haven’t worked out the interest yet.”"
