# 演女角的人（bond_mathijs）与大会的原稿（reunion_mathijs）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 专名：Mathijs Peeters、Lieve de Clercq、Jan、Plantin、De Violieren（the Violieren）、the Laurel、the Grote Markt、the Bourse、the Scheldt、Ghent、Goa、Landjuweel。
# 口头禅：马蒂斯 “Shh. It’s only a play. Don’t take it seriously.”（与人设卡英文一致，全文件只在 b2 用一次）。

[tracks.bond_mathijs]
name = "Mathijs Peeters: The Boy Who Played the Heroines"

[tracks.bond_mathijs.chapters.c1]
title = "The Boy Who Played the Heroines"
text = "The Violieren had put up a stage on the Grote Markt for a morality play. When Dame Prudence made her entrance, skirts sweeping the boards, and spoke her first line, the whole square went quiet, down to the waffle sellers. The herring boy beside me stood there gaping. “A voice like that, she’s somebody’s daughter, for sure.” “A boy,” I said. “His Adam’s apple is hidden under the neckerchief, and he breathes half a beat deeper than a woman does. One copper says so.” When the play was over, the lady stepped into the wings and pulled off her wig. Underneath was short hair, wet with sweat. The herring boy swore and paid up. I hadn’t even pocketed the coin before that boy came through the crowd with the wig in his hand, cocked his head at me, and played back my whole haggle with the herring boy from the top, right down to the way I rapped my nail on the herring barrel when I said “one.” The crowd nearly fell over laughing. My face was burning, but I still had to keep the books. “Not bad. Worth half a ticket.” He draped the wig over his arm and dropped Dame Prudence’s curtsy. “Mathijs Peeters, of the Violieren. Madam’s account can be settled next time.”"

[tracks.bond_mathijs.chapters.c1.choices.bet_my_father]
text = "Bet another copper he can’t do my father counting coins at the exchange table."
reply = "He followed me back to the exchange table by the Bourse and stood behind my father for a quarter of an hour. Then the show began: lick the thumb, roll the silver, squint one eye at the daylight, mutter “Florins, stuivers, this one’s been clipped.” My father turned around, stared for a long moment, then slapped the table and cheered. I had lost a copper. Mathijs took it, flicked it with his thumb, and it landed back in my palm. “Call it a ticket. Next time, come see me play the widow.”"

[tracks.bond_mathijs.chapters.c1.choices.split_winnings]
text = "Give him half my winnings, as the price of my seat."
reply = "“Half a copper?” He clapped the wig back on his head and was Dame Prudence again, voice pinched high. “Madam accepts. Keep the change.” A copper doesn’t break in two, so I opened my ledger and wrote him a line: Owed to the Violieren, half a copper. He leaned in to read it and insisted I add “plus interest.” I laughed so hard I nearly dropped the ledger in the herring barrel."

[tracks.bond_mathijs.chapters.c2]
title = "Lines in Debit and Credit"
text = "Under the arcade of the Bourse, by the time Mathijs started his eleventh lap, I had counted every one for him. “The Prodigal Son runs over four hundred lines, and a hundred and sixty of them are mine.” He slapped his script against a pillar. “The day before yesterday I had forty by heart. Yesterday, thirty. The harder I learn, the further back I go. Tell me, Mistress Bookkeeper, what do you call that?” “A loss.” I turned my ledger to a fresh page and ruled a line down the middle. “Learning lines is just like keeping books. Left column, what the others say. Right column, what you answer. Line against line. If they don’t match, it’s an error.” I laid out a page for him. He held it and studied it a long while, lips moving, then suddenly looked up. “You money-changing people—I bet you even fall in love in debit and credit.” The moment it was out, he went still himself. His eyes slid toward the street where the bindery was, and then he laughed and pinched his voice into mine. “Left column, what the others say—” “Right column, what you owe.” I put the pen in his hand."

[tracks.bond_mathijs.chapters.c2.choices.ledger_lines]
text = "Lay out the whole play in debit and credit, and have him learn it column by column."
hint = "He still thinks I came to laugh at him. He won’t hand me the whole script."
reply = "In three days I filled eleven pages, the left column in black ink, the right in red, with a little cross beside every line he had missed twice. On the fourth day he went on stage and got all hundred and sixty lines right. At the curtain call he bowed toward the spot where I stood, deeper than he bowed to the row of aldermen, and as he straightened he mouthed one word at me: “Balanced.”"

[tracks.bond_mathijs.chapters.c2.choices.read_the_other]
text = "Read the other parts for him, and let him play to me."
reply = "I read the Prodigal’s father, and I read him like a man quoting exchange rates: “My son, you have come home. At today’s prices, the fortune you squandered converts to…” Mathijs laughed so hard he slid down the pillar to the ground and said that if anyone played it like that, every father in town would ask for his money back. But that afternoon he got the hardest speech in the play, the repentance, by heart, without dropping a word."

[tracks.bond_mathijs.chapters.b1]
title = "The Stolen Refrain"
text = "On St. Luke’s Day the hall of the painters’ guild was hung with new pictures, and the Violieren held their refrain contest there. When it came to old Van Heerst, one of the chamber’s senior rhetoricians, he cleared his throat and read out a refrain: “Every star I counted owes the dawn an answer.” The hall roared its approval. Beside me, Mathijs stood bolt upright, his face gone as white as the powder he wore on stage. “That’s mine.” He kept his voice very low. “I wrote it this morning, in the arcade. I read it to him once and asked if the rhyme held.” He gave a laugh that was worse than crying. “Who’s going to believe a boy who plays the women?” I would. At a quarter past eight that morning, just after the Bourse clock struck, I had been at the other end of the arcade checking bills of exchange, and I heard him read that line, cough twice, read it again, and change “owes” to “owes the dawn.” Up on the platform Van Heerst was bowing, and there was a spot of ink on the fingers that held the slip of paper."

[tracks.bond_mathijs.chapters.b1.choices.testify]
text = "Say out loud when and where he wrote it, down to the two coughs."
hint = "He doesn’t yet believe I’d cross an old rhetorician for him. Before I can stand, he’s caught my sleeve."
reply = "I climbed onto a bench and called it out like a price on the Bourse floor. “A quarter past eight. Third pillar of the arcade. Read twice, two coughs, two words changed in between. Master Van Heerst, where were you at a quarter past eight this morning?” The old rhetorician opened his mouth and found nothing in it. The dean wrote the refrain back under Mathijs’s name then and there. All the way home Mathijs did me standing on the bench calling numbers, and when he got to “two coughs” he coughed twice for real. He coughed so convincingly that the waffle seller thought he’d caught a chill and pressed a waffle on him."

[tracks.bond_mathijs.chapters.b1.choices.write_better]
text = "After the contest, tell him quietly: write a better one, and read it himself next time."
reply = "He sat up all night and the next day handed me a line that was better than the one they stole. But he wouldn’t let go of the paper. “However good it is, they’ll steal it again.” Then write one only you can read aloud, I told him. In Dame Prudence’s voice. Whoever steals it gives himself away the moment he opens his mouth. He blinked, then pinched his voice up and read it on the spot, so well that the baker across the street put his head out to look."

[tracks.bond_mathijs.chapters.b2]
title = "The Page for Jan"
text = "Master Plantin had only just hung out the sign for his printing house that year, and I had been twice already to order ruled paper for my father’s books. Somehow Mathijs heard about it. He cornered me at the exchange table with a page folded in four. “Next time you go to the printing house, take this to Jan. Say it’s a proof of a playbill, and ask whether it’ll fit on one sheet.” He said it fast, like a speech he had learned by heart. When he got to “ask,” he snatched the page back. A corner of the fold had come loose, and the back of the sheet was turned toward me. Jan’s name was written on it, and crossed out; written again, crossed out again, until the ink had spread into a little blot. He saw me looking. In two quick moves he crushed the page into a ball, raised one finger to his lips, and his eyes crinkled, and he was on stage again. “Shh. It’s only a play. Don’t take it seriously.” At the far end of the counter my father called for me to count out a bag of stuivers. Mathijs didn’t leave. He stood there waiting for my answer, the ball of paper still in his fist."

[tracks.bond_mathijs.chapters.b2.choices.fold_it_back]
text = "Smooth the paper flat, fold it back along its creases, and tuck it into his pocket. Ask nothing."
hint = "He’s gripping it too hard. He won’t let me touch this page yet."
reply = "He let me smooth the page out on the counter and fold it back along its four old creases, and I slid it into the pocket of his doublet and gave it two pats. He looked at me for a long time. This once he didn’t put on anyone’s voice. He only said, “You keep your accounts far too well.” He carried that page around for a long time afterward. He never sent it, and he never threw it away."

[tracks.bond_mathijs.chapters.b2.choices.bet_a_year]
text = "Bet him that within a year, he’ll deliver it himself."
reply = "“How much?” His eyes lit up for a moment. “One gold coin.” He pressed his fist to his chest and thought for a long time, then said he didn’t dare stake even half a gold coin; he’d sooner lose right now. “Losing still costs you,” I said, and held out my hand. He rummaged in his sleeve for a long time and came up with a brass button that had fallen off a costume, and laid it in my palm as solemnly as if it were a gold coin. “Hold this as my stake.” I put the button in the cash box, in the same compartment as the proper pledges."

[tracks.bond_mathijs.chapters.a1]
title = "A Play Without a Name"
text = "In the first month of the year the canals froze, and the brazier behind the exchange table burned high. Mathijs came in hugging a roll of manuscript tied with string, sat down across from me, and didn’t quote a single line, which was rare. “I’ve written a play. My own. No women’s parts for me, and no name on it.” He pushed the roll across. “The back compartment of your family’s strongbox has the best lock in town. Keep it locked up for me. It’s safer there than at the chamber. Those people would steal your cough if you left it lying around.” I untied the string and turned one page. There were two people in the play. One of them kept wanting to say something to the other. In the first act it went unsaid; in the second it came halfway out and was swallowed; by the fourth act it still hadn’t been said. “Don’t read it!” He snatched the manuscript back and pressed it to his chest, his face redder than the coals. “You have to buy a ticket to read a play, Mistress Bookkeeper. Just lock it up for me.” A coal in the brazier collapsed. He didn’t reach for the poker; his eyes stayed on the lock of the strongbox."

[tracks.bond_mathijs.chapters.a1.choices.lock_it_away]
text = "Agree to keep it: in the strongbox’s innermost compartment, with the only key on me."
hint = "He’s clutching the manuscript to him. He doesn’t trust me enough yet to lock it in someone else’s strongbox."
reply = "I locked the manuscript in the innermost compartment of the strongbox, dangled the key in front of his nose, and hung it back around my own neck. “If I die,” he said, “burn it.” “If you die,” I said, “I’ll have it printed. Three stuivers a copy, and we split the profit sixty-forty.” He chased me two streets in a fury, all the way to the fish market, where he stopped, out of breath, and in a mourning widow’s wail called me the blackest-hearted moneylender in Antwerp."

[tracks.bond_mathijs.chapters.a1.choices.last_scene]
text = "Ask him: in the last act, does the one in the play ever say it?"
reply = "“I haven’t written that far.” He held the manuscript tighter, like a cat that might catch cold. “I’ll write it when I’ve worked it out.” I told him to let me know when he had, so I could tell him how many gold coins the line was worth. He glared at me. “It’s beyond price.” Then he was the first to laugh. He tucked the manuscript inside his doublet and did the buttons up one by one to his chin before he would go out the door."

[tracks.bond_mathijs.chapters.a2]
title = "The Cotton Doll"
text = "On the twelfth of October I turned sixteen. Early that morning Mathijs set a cloth bundle down on the exchange table and unwrapped it: a cotton doll no bigger than my hand. The doll sat behind a tiny exchange table nailed together from leftover scenery laths, holding a brass button for a gold coin. Its eyebrows were two stitches of black thread, slanted together in a frown. I knew whose frown that was at a glance. “Scraps from the costumes.” He turned up the doll’s skirt to show me the hem, a narrow band of gold thread on red. “This bit is the edge of an old sari. It came out of the costume chest the Portuguese merchants gave the chamber. Cloth your mother’s people brought here. It suits you.” Before I could say a word he had the doll up on the edge of the counter, licked his thumb and rolled a coin just the way I do. “One stuiver, two stuivers—sir, this one’s been clipped.” He made the doll look ready to start shouting at the customer any second. In the back room my father burst out laughing."

[tracks.bond_mathijs.chapters.a2.choices.keep_doll]
text = "Keep the doll, and set it beside the ledger on the exchange table."
hint = "It’s too generous a gift. As things stand between us, I couldn’t accept it with a clear conscience."
reply = "I set the doll to the left of the ledger, facing the customers. Everyone who came to change money that day looked at the doll, then at me, then at the doll again, and laughed. My father laughed all day long and counted every payment twice. In the evening Mathijs came by, crouched down to look the doll in the eye for a good while, and said that in his next play he would be a money-changer’s daughter. Would I let him play her after me? Certainly, I said—at one stuiver a performance."
effects = [{}, {}, {}, { title = "The Cotton Doll" }]

[tracks.bond_mathijs.chapters.a2.choices.pay_for_it]
text = "Laugh and say I only take gifts I can account for, and insist on paying for the cloth."
reply = "He named a price. “Three gold coins. That sari came all the way from Goa.” I bargained him down, he pushed it back up, and we went at it across the counter for an hour, until passing customers stopped to listen. In the end we settled on one copper. I dug it out from the very bottom of the cash box, and it was the same coin I had won from the herring boy on the Grote Markt that year. He held it up to the light, tucked it inside his doublet, and then tucked the doll back in too. “I’ll keep the copper. The doll can sit on the costume chest for now. Come and claim it the day you learn to take a present for free.”"

[tracks.bond_mathijs.chapters.s]
title = "A Seat in the Front Row"
text = "A thin frost covered the stone steps outside the Laurel. Mathijs had been waiting there for who knows how long, the tip of his nose red with cold. The moment I came out, he drew a stiff card from inside his coat and presented it with both hands, like a letter from a king. It was a ticket, drawn by him: a border of violets, the words “Front Row” in flourished script across the middle, and a line of small print at the bottom. Play: to be decided. Author: to be decided. Date: to be decided. “Three things undecided,” I said. “At current rates this ticket is worth nothing.” “Which is why I’m letting you have it cheap.” He rubbed his hands together. “I don’t want to spend my whole life acting out other people’s hearts. I’m going to write my own play and get it on the stage at the great rhetoric festival, even if it takes ten years.” He pushed the ticket a little further into my hand. “When that day comes, the front row needs someone who keeps better accounts than I do. Otherwise I’ll lose count of how many lines I fluff.” He shifted his feet. Where he had been standing so long, the frost on the step had melted into a little patch."

[tracks.bond_mathijs.chapters.s.choices.promise]
text = "Make it a promise: the day his play is staged, I’ll be in the front row, every performance."
hint = "For a promise like this, we aren’t close enough yet. Or else the one promise a person makes in a lifetime has already left my lips, to someone else."
reply = "I turned the ticket over and wrote on the back: “Be it agreed: on the day a play by Mathijs Peeters is staged, Lieve of the house of de Clercq shall sit in the front row, at every performance, never late, never leaving early. Forfeit for breach: one gold coin.” I signed it and handed him the pen. He signed with a great flourish; the tail of “Peeters” ran right off the edge of the card. He slipped the ticket into my ledger, at the page that holds the year’s closing balance, and pressed it flat before he let go. “This ticket may not be resold.” “May not be resold.” “Or pledged against a debt.” “Not even with interest?” He gave me a withering look. I shut the ledger and snapped its brass clasp. Suddenly he was the notary from the door of the Bourse, clearing his throat, drawing the words out: “This agreement is executed in a single copy, to be held by the front row—” Halfway through he broke up laughing, and between us we trampled the frost into a mess of footprints."
effects = [{}, {}, { title = "A Seat in the Front Row" }, {}, {}]

[tracks.bond_mathijs.chapters.s.choices.own]
text = "Bet him a gold coin: within five years he’ll sign his own name at the festival."
reply = "“What are we betting?” he asked. “One gold coin. Five years. If you put your own name on a play at the festival, I lose. If you don’t, you lose.” “And if I lose, what do I pay with? I don’t even have half a gold coin.” “You tell me.” He thought it over, then folded the ticket and tucked it back inside his own coat. “If I lose, I’ll play the widow for you for the rest of my life. Any day your books come out at a loss, I’ll put on mourning, come to your exchange table and weep until your customers pay you extra interest.” Done, I said, and held out my hand. He took it. His hand was cold as well water, and once he had it he didn’t let go, but used the handshake to pump me up and down three times and announced in Dame Prudence’s voice, “The wager stands! No backing out!” The porter put his head out to scold us for the noise. We ran down the steps, and halfway down Mathijs turned back and dropped the porter a widow’s curtsy."

[tracks.reunion_mathijs]
name = "Mathijs Peeters: The Manuscript at the Landjuweel"

[tracks.reunion_mathijs.chapters.reunion]
title = "The Manuscript at the Landjuweel"
text = "In August of 1561 Antwerp held the Landjuweel. The chambers of rhetoric of every town came marching in, and the pageant wagons were packed from the Grote Markt all the way to the Scheldt. The Violieren were the hosts, and the whole city was hung with violet cloth. The bench in the middle of the front row had been kept for me, and someone had chalked a word on its seat: Bookkeeper. The herald announced only “A new play by the Violieren” and gave no author’s name. But before the curtain, Mathijs had pushed a manuscript into my hands from backstage, and for the first time the cover bore a name: Mathijs Peeters. The same two people were in the play, and the line was put off from one act to the next, until in the fifth act, at last, it was spoken. The audience was so still you could hear the ships’ bells on the river. When it was over, Mathijs came running out from backstage, powder still on his face, one painted eyebrow smudged, and stood in front of me catching his breath. “Well?” he said. “Do the books balance?”"

[tracks.reunion_mathijs.chapters.reunion.default]
effects = [{ text = "Lieve, you didn’t come. I kept the front-row bench empty until the fifth act, with “Bookkeeper” chalked on the seat, and then a fat rhetorician from Ghent sat himself down on it, and at the end he walked out with the word printed in white across the seat of his breeches. The house laughed harder at that than at the play. Put that one on your account. The play is done. The herald didn’t give the author’s name, but I wrote it on the cover of the manuscript, Mathijs Peeters, every letter. Master Plantin took the manuscript and says he’ll print three hundred copies. I’m sending you one with this letter, the first of the first batch. On the flyleaf I wrote “For the one in the front row.” Nobody but you has a right to those words. The fat man doesn’t count. The one in the play says it in the end. What he says, you can turn to the fifth act and read for yourself; I won’t recite it in a letter. I can’t do it on paper, you know that. I need a stage. When you keep your books at sea, save a page for me. Whenever you come back to Antwerp, I’ll put on the play for you again on the Grote Markt, for you alone, no ticket required. —That last part is true. It isn’t a play. Mathijs, Antwerp, September 1561." }, {}]

[tracks.reunion_mathijs.chapters.reunion.choices.friend]
text = "Sit with him on the steps of the printing house’s drying yard and hear the line the play never said."
reply = "We walked from the Grote Markt all the way to the back yard of Plantin’s printing house. The drying lines were hung full of festival playbills waiting to be bound tomorrow, turning one by one in the night wind. He sat down on the steps and scrubbed at the powder on his face with his sleeve, which only smeared it worse. “That line in the play—what they heard on stage was the revised one. The original I’ve never read to anyone.” “Now?” “Swear first. No writing it in your books. No betting on it. No trading it for interest.” I raised my right hand and swore. He leaned close, dropped his voice very low, and said it. It was a short line, shorter than the one on stage, without a rhyme, and he didn’t put on anyone’s voice to say it. I didn’t answer, and he didn’t ask me to. We sat side by side and watched the playbills on the line turn over, and turn back. Near dawn the old man who kept the yard came to take the paper in. Mathijs stood up, brushed the dust off his breeches, and bowed to me. Dame Prudence lifts her hem when she bows; the widow presses a hand to her heart. This bow had neither. He just bent at the waist, and straightened up again."
effects = [{}, {}, {}, { title = "The Manuscript at the Landjuweel" }]

[tracks.reunion_mathijs.chapters.reunion.choices.to_the_press]
text = "First thing next morning, take the signed manuscript to Plantin’s press to be printed."
reply = "Before it was light the next morning I was knocking at the door of Plantin’s printing house with the manuscript under my arm. Master Plantin put on his spectacles and read twenty pages, then asked who the author was. I pointed to the cover. He read twenty pages more and said he would print three hundred. The festival wasn’t over yet, and the chambers from out of town would all want a copy before they left. I haggled on Mathijs’s behalf: paper, typesetting, binding, one item at a time, until Master Plantin took off his spectacles and laughed and said he had never seen anyone drive so hard a bargain for someone else. Ten days later the first batch came off the press. Mathijs stood in the doorway of the printing house and took the first copy, opened it to the flyleaf, dipped the pen, botched a letter because his hand was shaking, and wrote it again: “For the one in the front row.” Below it he signed Mathijs Peeters. He shoved the book into my arms and walked off, and a dozen paces down the street he spun around and shouted, “A tenth of the sales are yours!” “A fifth,” I said. He stood in the middle of the street and haggled with me for a quarter of an hour."
effects = [{}, {}, {}, { title = "The Manuscript at the Landjuweel" }]

[tracks.reunion_mathijs.chapters.reunion.variants.mutual]
text = "In August of 1561 Antwerp held the Landjuweel. The chambers of rhetoric of every town came marching in, and the pageant wagons were packed from the Grote Markt all the way to the Scheldt. The Violieren were the hosts, and the whole city was hung with violet cloth. The bench in the middle of the front row had been kept for me, and someone had chalked a word on its seat: Bookkeeper. The herald announced only “A new play by the Violieren” and gave no author’s name. But before the curtain, Mathijs had pushed a manuscript into my hands from backstage, and for the first time the cover bore a name: Mathijs Peeters. The same two people were in the play. In the fifth act, at last, the line was spoken, and the audience was so still you could hear the ships’ bells on the river. When it was over and the seats had emptied, one typesetter from the printing house was still sitting in the second row and hadn’t gotten up. Mathijs came running out from backstage, powder still on his face. First he looked toward the second row. Only then did he come and stand in front of me, catching his breath. “Well?” he said. “Do the books balance?”"
