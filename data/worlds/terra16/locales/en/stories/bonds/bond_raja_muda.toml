# 拉惹·穆达：下半句（bond_raja_muda / reunion_raja_muda）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段。
# C7 重写，2026-10-12，Claude（Opus），与中文稿同一轮写完。专名：Raja Muda、Kaicili、Daeng、Sunan Prapen、Giri、Gresik、Jepara、Johor、Malacca、Aceh、Ternate、Queen Kalinyamat。

[tracks.bond_raja_muda]
name = "Raja Muda: The Second Half of the Verse"

[tracks.bond_raja_muda.chapters.c1]
title = "A Very Long Title"
text = "On my first day, Sunan Prapen sits on the mat in the hall of recitation and has the new princes give their names one by one. When it’s Raja Muda’s turn he stands and starts from the court of Johor, title after title, all the way back to the old sultan of Malacca. It takes as long as a cup of tea, and at the end he adds, “By rights, Malacca should be ours.” The master listens with his eyes closed, then says, “Good. Sit.” When it’s my turn I stand up and say, “Kaicili,” and sit back down. Raja Muda gives a short, cold laugh. It isn’t loud, but the whole room turns to look at me. The master points to a bench by the wall and tells the two of us to share it. One end is higher than the other; sit on it and you slide. Raja Muda picks a few chips of wood off the floor, bends down, and wedges his end level. Once he’s settled, he nudges the last chip over to my side with the toe of his sandal, eyes fixed straight ahead. “The Prince of Ternate doesn’t carry a single title. Did you drop them on the way?”"

[tracks.bond_raja_muda.chapters.c1.choices.full_title]
text = "Stand up and recite every title of Ternate, down to the last word."
reply = "I stand up again and start from the volcano of Ternate, go on through the clove gardens, back to my grandfather’s grandfather, without stopping for breath. Halfway through, someone in the back row snorts. The master opens his eyes and laughs too. “Both Your Highnesses, be quiet.” After the lesson Raja Muda follows me out and doesn’t speak until we’re on the steps. “So you can recite too.” He says it fast, as if he doesn’t want anyone to overhear. I tell him I can, I just can’t be bothered most days. He grunts. This time there’s no cold laugh."

[tracks.bond_raja_muda.chapters.c1.choices.just_name]
text = "Skip the titles, wedge my end with that chip, and sit down."
reply = "I pick up the chip, crouch, and push it under the leg of the bench. I press down. It holds. I sit and open my book. Raja Muda waits for me to answer back, and waits, and nothing comes. I can’t tell you much of what the master taught that afternoon. What I remember is Raja Muda glancing sideways at my end of the bench the whole time, at that chip of wood, like a problem he had never been set before. When lessons let out he stands, pulls the chip from under his own end, holds it against mine, and pushes it back in."

[tracks.bond_raja_muda.chapters.c2]
title = "The Second Half of the Verse"
text = "May the twentieth is the day the school holds its contests, and the pantun singing runs all the way to a final. The rule is that whoever sets the verse writes the first half on a palm leaf and reads it out, and the other has to answer with the second half on the spot. Mine is two lines of opening image: “A clove falls into the ebbing water; the water runs out past the reef and still it floats.” For the line endings I picked the two hardest rhymes in Malay. It took me half the night to find them. When I finish, there isn’t a sound from the floor. My opponent scratches his head and steps down. The judge lifts the garland and has just begun, “This time—” when someone stands up at the end of a bench. “The second half hasn’t been answered yet. Hold the garland.” Raja Muda doesn’t look at the judge. He looks at me, and answers word by word: “The ship sails far and never looks back; someone on shore remembers the sail.” Both rhymes land. Not a word out of place. My two lines were about a clove. His are about someone who doesn’t look back, lighter than mine, and further away. The room goes so quiet you can hear the tide outside. We stare at each other across the crowd, both of us stuck where we stand."

[tracks.bond_raja_muda.chapters.c2.choices.share_the_garland]
text = "In front of everyone, tear the winner’s garland in half and hand him one end."
hint = "He just beat you in front of the whole school. Hand him a garland now and he’ll take it as an insult."
reply = "The judge hangs the garland on me anyway. I pull the string of jasmine apart in the middle, keep one half in my fist, and walk over to hold out the other. Raja Muda doesn’t take it. His hand comes up and stops in midair, and people on the floor start to whoop. After a long moment he takes it and puts it on himself, crooked, and doesn’t straighten it. On his way out he passes me. “Next time I set the first half. Let’s see if you can answer it.” The torn end of his garland drops petals all the way to the school gate."

[tracks.bond_raja_muda.chapters.c2.choices.ask_tiebreak]
text = "Ask the judges for one more round."
reply = "The judges agree. This time he sets and I answer, then I set and he answers, and we both stumble through. One rhyme goes crooked; the other barely holds. The judges huddle for a long while and finally call it a draw. Coming off the floor, Raja Muda brushes past me and says under his breath, “You picked those rhymes that hard on purpose.” I say, “You answered them, didn’t you?” He breaks stride for a step. He doesn’t turn around. The skin behind his ears has gone red."

[tracks.bond_raja_muda.chapters.b1]
title = "The Lost Knight"
text = "Once autumn comes, we start playing chess together. The school has only one old set, carved ivory, half the pieces chipped. Raja Muda plays like a king: he won’t give up a single piece, and every move begins with guarding his king, until the pieces around it stand like a city wall. One day he gets up too fast, his sleeve catches the board, and a white knight bounces onto the floor and rolls straight into a crack between the boards. We get down to look. The gap is too narrow for a finger. All we can see is a little white down there. He takes a betel nut from the box at his waist and sets it on the knight’s square. “That’s the knight.” In that game I trade a pawn for his rook, then push another pawn all the way to the end and checkmate him. He stares at the board for a long time, at the pawn, then at his own king, walled in so tightly it can’t move a step. He looks up at me. “You’d trade a pawn for a king?”"

[tracks.bond_raja_muda.chapters.b1.choices.teach_sacrifice]
text = "Play him again and show him, move by move, when to give a piece up."
hint = "He just lost to a pawn. Try to teach him chess now and he’ll knock the board over."
reply = "In the second game I talk as I play. That rook of yours is just a wall for your king; take the wall down and the road opens. He doesn’t say anything. He listens. Halfway through, he really does push a rook under my knight’s nose. Seven moves later he checkmates me. He picks up the betel nut that stood in for the knight, weighs it in his palm, and pops it into his mouth. “This knight did well today.” Two chews in, he frowns and spits it out. It’s been sitting on the board all afternoon and gone dry as wood."

[tracks.bond_raja_muda.chapters.b1.choices.find_the_knight]
text = "Get down on the floor and try to dig the knight out of the crack."
reply = "I borrow an iron skewer from the kitchen and lie flat on the floor, prying. Half an hour goes by. The knight doesn’t come up; I only manage to push it further down. Raja Muda stands and watches at first, then crouches, and finally he’s lying on the floor too, cheek to the boards, peering into the gap. “Leave it,” he says. “Let it watch us play from down there.” He gets up, brushes the dust off his knees, and sets the betel nut dead center on its square, as carefully as if it were a real knight."

[tracks.bond_raja_muda.chapters.b2]
title = "Berths for the Envoy"
text = "Early in the year the court of Johor sends an envoy to Gresik. He needs passage to Aceh to ask for help, and Raja Muda is told to find him a berth. Every shipowner on the quay hears whose errand it is and shakes his head: an exiled court might pay its passage money any year now, or never, and if you run into a Portuguese patrol on the way you could lose the ship besides. He spends three days going up and down the quay and comes back each evening with mud on the hem of his robe. On the fourth morning he’s waiting for me at the door of the hall, holding a berth contract with the name line still empty. He’s gripped it so long the edges have gone fuzzy. “Ships from Ternate,” he says. “Your word carries.” His chin is still up when he says it, but he’s looking at the tree by the door, not at me. I ask how many berths. “One. The envoy, and one chest.” He pauses, then adds, “The chest matters more than the man.”"

[tracks.bond_raja_muda.chapters.b2.choices.vouch_as_prince]
text = "Stand surety for him with my family’s shipmaster, as the Prince of Ternate."
hint = "He’s holding that contract in a death grip. Asking a prince from another court to vouch for him is more than his pride can take yet."
reply = "I take him to my family’s shipmaster and open with, “Kaicili of Ternate stands surety for him.” The shipmaster agrees at once, and the empty line on the contract is filled in on the spot. The envoy has his berth, and I feel sour all day. I hate leaning on a title to push people around, and today the person I pushed was one of our own. That evening Raja Muda comes to find me. He doesn’t come in; he stays out on the veranda. “I could see it. You didn’t like that.” He presses the copy of the contract into my hand. “What I owe you this time, I’ll pay back in my own name. No titles.”"

[tracks.bond_raja_muda.chapters.b2.choices.door_to_door]
text = "Go from shipowner to shipowner with him, neither of us giving our names."
reply = "We start at the east end of the quay. I don’t say who I am and he doesn’t say who he is. We only say there’s one man and one chest that need to get to Aceh, fare paid up front. The first six shake their heads. The seventh is a Bugis shipowner squatting in his bow, mending a sail. He looks the two of us up and down. “Men who don’t give their names, I trust.” Raja Muda pays the deposit, then stands on the quay a long while holding the contract. The shipowner gets half his sail mended, and Raja Muda is still standing there. “So it works without them,” he says."

[tracks.bond_raja_muda.chapters.a1]
title = "The Full Moon After the Feast"
text = "Two weeks after the Eid feast, the moon is full again. Everyone from the school goes down to the beach to swap pantuns, in little knots around the fires. Raja Muda and I sit on a log the sea has thrown up, a little way off from the fire. We trade verses back and forth, his first half and my answer, my first half and his, until most of the people around the fires have drifted off, and still nobody has won. He stops and draws a line in the sand with his heel, then smooths it away. “You know what?” he says. “I envy Daeng.” Daeng is the Bugis boy at our school who steers other men’s boats and wants only one thing: a boat of his own. “He lives for one boat. I carry a whole city on my back. It’s been lost forty-five years. It wasn’t ours anymore by the time I was born.” The moonlight lies on the water all the way out past the reef. When he says this his chin isn’t up. He’s facing the sea, and his voice is much lower than when he sings."

[tracks.bond_raja_muda.chapters.a1.choices.back_to_back]
text = "Sit back to back with him, sing his second half first, and let him answer my first."
hint = "Lean over now and he’d only shift away. You don’t know each other well enough to sit back to back."
reply = "I slide to the other end of the log and sit with my back against his, and I start by singing the two lines he answered in the final that year. His back goes stiff for a moment, then slowly eases, and he answers with my first half, backward, every rhyme scrambled. We keep going like that, line after line, until the moon leans west and neither of us can make out what we’re singing anymore. “Today doesn’t count,” he says. “No winner.” I say all right. Until the moon goes down into the sea, his back never leaves mine."

[tracks.bond_raja_muda.chapters.a1.choices.carry_the_city]
text = "Promise him that when he goes to take the city back, my ship is one of them."
hint = "You open your mouth and stop. A promise that heavy isn’t yours to make yet."
reply = "“Then I’ll owe you even more,” he says. I say, “Owe me without your titles.” He stares, then laughs out loud. It’s the first time I’ve seen him laugh like that, not stiff, not cold, the way a fifteen-year-old ought to laugh. He holds out his hand and I take it, just for a moment. “Then I’d better learn to build ships,” he says. “Or when the day comes, yours will be the only one.”"

[tracks.bond_raja_muda.chapters.a1.choices.ask_daeng]
text = "Ask him what he envies in Daeng: the boat, or living only for himself."
reply = "“Both,” he says. “And I have neither.” He scoops up a handful of sand, squeezes it, and lets it run out between his fingers, a little at a time. When it’s gone he takes another handful. I don’t ask anything more. Over by the fire someone forgets the words halfway through a verse and the whole crowd bursts out laughing. He laughs once with them, short, and goes back to the sand."

[tracks.bond_raja_muda.chapters.a2]
title = "The Knight Carved to Replace It"
text = "The white knight has lain under the floorboards for two years. In September, Raja Muda disappears for several days running as soon as lessons end, and comes back with rags wrapped around his fingers. One evening he calls me to the hall of recitation, takes a newly carved knight out of his sleeve, and sets it where the betel nut used to stand. It’s ebony, a size smaller than the white knight still on the board, and the wrong color besides, but the mane is cut lock by lock, clean and sharp, and he’s even carved the bridle at its mouth. “It’s small,” he says, “but I carved it.” He leans hard on the “I.” Then he puts out two fingers and pushes the knight from his side across the middle of the board, all the way to me, and leaves his fingers resting on its back."

[tracks.bond_raja_muda.chapters.a2.choices.keep_knight]
text = "Take the knight, and tell him from now on it plays on my side."
hint = "It’s too much to accept. Your hand goes out and comes back. You don’t know each other well enough yet to take it."
reply = "“Then my side is short a knight,” he says. I tell him he can have the first three moves. He gives a cold laugh, sets up the pieces one by one, and does take three moves. Near the end of the game, his rook could plainly take my ebony knight. His hand hangs over the board a moment, and he plays something else. I win. He puts the pieces back in the box and leaves only the ebony knight out, pushing it over to my hand. “Keep it safe. Don’t let it fall through a crack again.”"
effects = [{}, {}, {}, { title = "The Knight Carved to Replace It" }]

[tracks.bond_raja_muda.chapters.a2.choices.hold_his_hand]
text = "Take the knight, and take his knife-calloused hand along with it."
hint = "You reach out and stop halfway. You haven’t come far enough yet to hold on like that."
reply = "I close my hand over the knight, and over the fingers he still has resting on it. Where the rags were wrapped, a new callus has formed, hard to the touch, and beside it a knife cut that hasn’t healed. He doesn’t pull away. After a long while he says quietly, “A prince shouldn’t have calluses like these.” I say, “A prince who carves knights does.” He turns his face to the window, but his hand stays in mine until someone comes in to light the lamp."
effects = [{}, {}, {}, { title = "The Knight Carved to Replace It" }, {}]

[tracks.bond_raja_muda.chapters.a2.choices.set_it_back]
text = "Push the knight back to his side and tell him he’ll lose without it."
reply = "I push the knight back to his side. He pushes it over again. I push it back. On the third round the ebony knight wobbles on the center line and nearly topples, and we both reach out at once to steady it. He pulls his hand away with a grunt. “Then it stays in the middle. Whoever wins, keeps it.” All that autumn it stands on the center line for a dozen games or more, his one day, mine the next."

[tracks.bond_raja_muda.chapters.s]
title = "Another Verse Beneath the Gate"
text = "In December a letter comes from the court of Johor calling him home. His ship sails at the end of the month, a whole season before mine leaves for Ternate. On the morning it sails I’m on the quay checking cargo for my family when he comes looking for me. He doesn’t say anything. He opens his hand, and on his palm lie two palm leaves side by side. On each, cut with the point of a knife, is the same pantun, first half only: “The tide climbs the steps of the old city; how many steps there are, no one has counted.” The lower half of each leaf is bare, with two fine lines scored across it, waiting for someone to write there. He presses one into my hand and tucks the other back inside his shirt. “The day Malacca comes back,” he says, “we finish it together, beneath the city gate.” When he gets to “comes back,” his voice drops, so soft it’s as if he’s afraid of waking something. Someone at the far end of the gangplank calls his name. He doesn’t turn."

[tracks.bond_raja_muda.chapters.s.choices.promise]
text = "Agree: the day Malacca is retaken, we’ll finish a verse beneath its gate."
hint = "This is a promise you can’t make now. Either you two haven’t come that far, or you’ve already said these words to someone else."
reply = "I tell him yes. The day Malacca comes back, beneath the gate, I’ll answer. Raja Muda nods as if he knew I’d say it, then pulls a third palm leaf from his sleeve and presses it into my other hand. Another first half, cut more roughly than the other two, as if he made it last night in a hurry: “Under the clove tree, someone waits for a ship, counting the tide in and the tide out.” “This one’s yours,” he says. “Your family’s cloves, your shore. Yours has to be finished too.” I ask where my gate is, then. He thinks about it. “Does Ternate have a gate?” “There’s a fort. The Portuguese built it.” “That one, then.” He says it perfectly seriously, and I can’t help laughing. He laughs too, and puts a hand on my shoulder, pressing down hard, like setting a piece on the board. “Two verses,” he says. “You don’t get to owe me either one.”"
effects = [{}, {}, { title = "Another Verse Beneath the Gate" }, {}, {}, {}]

[tracks.bond_raja_muda.chapters.s.choices.heart]
text = "Cut my second half on the back of his leaf, fold it, and say he can open it when we meet as grown men."
hint = "The knife point rests on the back of the leaf, but the answering line won’t carve. Your heart hasn’t caught up—or you’ve already given an answering line like this to someone else."
reply = "I ask for the leaf he keeps inside his shirt, borrow the shipmaster’s little knife, turn my back, and cut my second half into the back of the leaf. I go slowly. I spoil one word and cut it again beside the first. When it’s done I fold the leaf in half, press the crease down again and again, and hand it back. “When we’re both grown,” I say, “the next time we meet. That’s when you can open it.” He takes it and doesn’t open it, doesn’t ask what it says. He only holds it, tighter and tighter, until the ribs of the leaf snap one by one with tiny cracks. “And if Malacca still hasn’t come back by then?” “Open it anyway.” He looks up and studies my face the way he studies a move many turns ahead. Someone calls him again from the gangplank. All at once he steps in and hugs me, hard, his chin knocking against my shoulder so that it hurts. Then he lets go, turns, and walks up the gangplank without looking back. He keeps the leaf in his fist the whole way and never puts it away."
effects = [{}, {}, {}, {}, { title = "Another Verse Beneath the Gate" }, {}, {}]

[tracks.bond_raja_muda.chapters.s.choices.own]
text = "Agree to settle it beneath the gate when we’re grown: whoever loses is crowned first."
reply = "“Whoever loses is crowned first?” He says it back to himself and frowns. “Then I don’t want to win.” He thinks a moment more. “I don’t want to lose either.” I say then we’ll just have to keep drawing, until we’re both old and neither throne ever comes around to us. “You wish.” He shoves the palm leaf inside his shirt. “Ternate’s throne won’t wait that long for you, and Johor’s won’t wait for me.” He gives a cold laugh and holds up his palm. I slap it, a crack so loud a few porters on the quay turn to look. There’s a callus on his palm from the carving knife, hard enough that it jars my hand. “Beneath the gate,” he says. “Chess and pantun both.” He’s halfway up the gangplank when he turns and shouts back, “And you don’t throw a single game!”"

[tracks.reunion_raja_muda]
name = "Raja Muda: The Gate That Did Not Open"

[tracks.reunion_raja_muda.chapters.reunion]
title = "The Gate That Did Not Open"
text = "Jepara harbor is full of ships that have come back, some with their masts snapped short, some with scorch marks still black along the rails. Last autumn Queen Kalinyamat sent her fleet against Malacca. It held the city under siege for three months and pulled back before spring. The queen herself never sailed with it, and the city gate never opened for anyone. I find Raja Muda at the far end of the quay, sitting on a wreck run aground. He’s still wearing a leather coat sewn with iron plates; he’s been back all this time and never taken it off. He has grown terribly thin, nothing left of his face but the eyes. When he sees me, the eyes know me first. The rest of him doesn’t move. I climb onto the wreck and sit down beside him. He takes an oilcloth bundle from inside his coat and unwraps it, layer by layer. Inside is the palm leaf, broken now into five or six pieces, the edges worn round. He lays the pieces out on his knee one by one and fits them together until the two lines read whole again: “The tide climbs the steps of the old city; how many steps there are, no one has counted.” He keeps a finger on the most broken corner and looks up at me. “The gate didn’t open. Do we still finish it?”"

[tracks.reunion_raja_muda.chapters.reunion.default]
effects = [{ text = "Kaicili— The fleet is back. We sailed from Jepara last autumn. The queen gave ships, gave money, and did not come herself. We held Malacca under siege three months, and the gate did not open a single day. I stood under those walls to the end, until the Portuguese on the ramparts knew my face. Back in Jepara I waited half a year for you on the quay and went to look at every ship that came in from the east. You did not come. I suppose your ship is somewhere else, carrying cloves for someone, or for yourself. That is as it should be. My leaf has broken into six pieces. I keep them wrapped in oilcloth and have not lost one. Since the gate did not open, I will not put it together. I will wait for you to come and do it. Yours must still be whole. Look at it for me and tell me how many steps the tide has climbed on your side. This goes with a Bugis boat; its master says he knows the quay at Ternate. At the end I have cut a new one for you. You know the rule, only the first half: “On the ebbing sand there are footprints; before the tide comes in you can still count the rows.” The other two lines are yours. Don’t make me wait until every step has been counted. —Raja Muda, written at Jepara" }, {}]

[tracks.reunion_raja_muda.chapters.reunion.choices.friend]
text = "Sit down on the wreck and finish the pantun, without waiting for the gate."
reply = "I don’t think about the gate. I look at the broken pieces on his knee and say the second half aloud: “The tide goes out and comes back in; on the shore someone is always waiting for a ship.” There’s no gate in those two lines, only someone sitting on a quay, waiting for a ship. Raja Muda doesn’t say anything. He gathers the pieces back into the oilcloth one at a time, slowly, and has to pinch twice before he can pick up the smallest corner. When it’s wrapped he puts it back inside his coat and presses his hand flat over it. “This one doesn’t count for winning or losing,” he says. “It counts for the two of us.” At last he starts on the laces of his coat, but his fingers won’t cooperate, and after a while I reach over and help. When the coat comes off there are two deep red welts pressed into his shoulders. That evening we each eat a bowl of coconut rice on the Jepara quay. He eats slowly, and when he’s done he says tomorrow he’d like to come and see my ship."
effects = [{}, {}, {}, { title = "The Gate That Did Not Open" }]

[tracks.reunion_raja_muda.chapters.reunion.choices.rival]
text = "Tell him the gate didn’t open, so we don’t finish it; we settle it next time, beneath the gate."
reply = "“No,” I say. “The gate didn’t open, so this one doesn’t count. Keep it. Next time we’re under that gate, we see who answers first.” Raja Muda stares at me, and the dead ash in his eyes slowly catches. He wraps up the pieces, grips the rail, and gets to his feet, a little unsteady. “Next time,” he says, “I won’t let the queen pay for everything and send all the ships alone. I’ll go back and ask Johor for ships. If they won’t give them, I’ll build my own.” As he works at the laces of his coat he counts off where they lost this time: the supply ships came too late, the fleet was moored too tight and a single fire took a whole stretch of it, the people inside the walls got their relief and the people outside got nothing. He counts fast and hard, the way he used to count every one of my mistakes across the chessboard. When the coat is off he holds out his hand. I slap it. His palm is rough as deck planking, hard with rope burn. “When the time comes, bring your ship,” he says. “Race me. We’ll see whose ship ties up first at the quay below the walls.”"
effects = [{}, {}, {}, { title = "The Gate That Did Not Open" }]

[tracks.reunion_raja_muda.chapters.reunion.choices.love]
text = "Tell him the gate didn’t open but my ship is still here, and ask if he’ll come with me."
hint = "He keeps a finger on the most broken corner, waiting for your answer. You carved nothing on the back of that leaf back then, and sitting on this wreck today, you still can’t carve those words."
reply = "“The gate didn’t open,” I say. “My ship is still here. Will you come with me?” Raja Muda looks at me for a long time, so long that the tide below the quay drops a little. He doesn’t answer. He bends his head and turns the pieces on his knee over, one by one. On the back of the largest, one corner is still folded, the crease gone black with sweat and seawater. Nineteen years, and never opened. “We said, open it when we meet as grown men,” he says. “I kept waiting to see you, so I kept it shut.” He opens it. My second half is there, crooked, the spoiled word still beside the good one. He reads it once, and his voice goes hoarse. Then he undoes the laces of his coat one after another and drops it on the wreck. “I’ve carried that city my whole life,” he says. “Can I put it down for one day?” That night, on my ship, after the lamp in the cabin goes out, he kisses me. His lips are cracked and taste of sea salt. Near dawn he wakes once, reaches out, finds the leaf still there by the pillow, and goes back to sleep."
effects = [{}, {}, {}, { title = "The Gate That Did Not Open" }]

[tracks.reunion_raja_muda.chapters.reunion.variants.with_daeng]
text = "Jepara harbor is full of ships that have come back, some with their masts snapped short, some with scorch marks still black along the rails. Last autumn Queen Kalinyamat sent her fleet against Malacca. It held the city under siege for three months and pulled back before spring. The queen herself never sailed with it, and the city gate never opened for anyone. I find Raja Muda at the far end of the quay, sitting on a wreck run aground, still in his leather coat sewn with iron plates, so thin there’s nothing left of his face but the eyes. At the other end of the quay lies a Bugis boat whose master was at Giri with him. It has been tied up there since the fleet came back, not unloading, not leaving. When Raja Muda sees me, those eyes know me first. The rest of him doesn’t move. I climb onto the wreck and sit down beside him. He takes an oilcloth bundle from inside his coat. Inside is the palm leaf, broken now into five or six pieces. He lays them out on his knee and fits together the two lines: “The tide climbs the steps of the old city; how many steps there are, no one has counted.” He keeps a finger on the most broken corner and looks up at me. “The gate didn’t open. Do we still finish it?”"
