# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_lakan_pula.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应（a2 两个收下选项第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个、重逢三个落点第 4 个是 memory；重逢 default 第 1 个是 letter）。

[tracks.bond_lakan_pula]
name = "Lakan Pula: The Price Outside the Feast"

[tracks.bond_lakan_pula.chapters.c1]
title = "The Price Outside the Feast"
text = "The master of a Fujian junk had come to dine at the datu’s house, and the gong in the longhouse had sounded three times. When he asked about beeswax, the elders were still trading courtesies, but Lakan was already on his feet, naming a price in round numbers, quick and loud. The shipmaster broke a corner off a cake of wax, bit it, and nodded with a smile; the whole table of elders nodded with him, and Lakan’s uncle reached across the mats to clap him on the back. After the feast I followed him down to the riverbank. The rowers who carried wax for his family were stacking cakes on a bamboo raft. Their leader heard the price and slammed the cake in his hand down on the raft. “That price won’t cover what we eat in three days of rowing.” Lakan went red to the ears, chin still up. “My uncle says when Tondo names a price, even the river has to honor it.” “The river honors it.” The rower drove his pole into the mud. “Our arms don’t.” I was still holding a cake of wax I had pocketed at the feast. Around its edge ran a ring of tooth marks, where the shipmaster had tested the goods."

[tracks.bond_lakan_pula.chapters.c1.choices.walk_to_rowers]
text = "Drag him back to the river and ask each rower: how many days of rowing, how many meals?"
reply = "Lakan stumbled over his questions, and the first rower only held up three fingers. By the fourth, the rowers were talking over one another: two days upriver to collect the wax, a day waiting for the goods, a day back with the current; two meals a day, and there had better be fish in them. On the way home he wrote the total on his palm three times, slower each time. “So that’s how much one trip eats,” he muttered, and closed the hand into a fist."

[tracks.bond_lakan_pula.chapters.c1.choices.laugh_at_him]
text = "Push the bitten wax cake at him: “The datu’s price. Have a taste.”"
reply = "He glared at the ring of tooth marks, snatched the cake and came after me. I ran twice around the longhouse, he chased me twice around, and in the end we both crouched under a pillar, panting. He looked at the cake in his hand and laughed first. Then he actually bit it, and spat into the river. “Bitter and sticky. And that shipmaster bit it like it was bread.” He wiped his mouth. “Tomorrow I’m going down to the river to work it out again.”"

[tracks.bond_lakan_pula.chapters.c2]
title = "Shares Notched in Bamboo"
text = "The southwest wind had risen, and the Fujian junks were leaving. Our teacher at the datu’s school carried in a bundle of freshly split bamboo tallies and announced the day’s lesson: dividing the shares. Everyone on this run got a tally, and every notch cut in it counted as one share. “Three for the datu’s house, one for each rower,” the teacher said. “That’s the old rule.” Lakan grabbed the knife first and set its point against the first tally. Then he stopped. The rowers squatting under the eaves were all watching him. Suddenly he turned and held the hilt out to the oldest of them. “Hear the boatmen first.” The old rower looked at the knife, then at the teacher, and wiped his hands on his knees twice before he took it. He cut one notch in his own tally, waited a long while, then cut a second, and closed his fist around the stick. Only then did Lakan take the knife back and cut the datu’s three, fast. The teacher watched all of it without a word, then opened his chest and waited for my bundle."

[tracks.bond_lakan_pula.chapters.c2.choices.hand_over_your_stick]
text = "Hand my bundle of tallies to the rowers too, and let them cut first."
hint = "Lakan still thinks you came to watch him make a fool of himself. Hand your tallies over now and he’ll think you’re mocking him."
reply = "The old rower grinned at me, showing the gap in his front teeth, and set to work. This time he cut deeper than he had for Lakan; a chip of bamboo flew off and struck the back of my hand. One after another the other rowers crowded in. Lakan stood beside me with his arms folded and said under his breath, “You got that from me.” I said I had. He turned his face away, but he couldn’t keep the corners of his mouth down."

[tracks.bond_lakan_pula.chapters.c2.choices.follow_old_rule]
text = "Follow the school’s old rule: three full shares for the datu’s house first."
reply = "I cut them by the rule, three, one, one, and handed them into the teacher’s chest. Lakan glanced at me and didn’t argue. The next day, when the teacher opened the chest to go over our work, I saw that in Lakan’s bundle one of the three notches on the datu’s tally had been shaved flat. It had been done with care. All you could feel was a little roughness."

[tracks.bond_lakan_pula.chapters.b1]
title = "The Chipped Blue-and-White Bowl"
text = "The year’s examination was held at the stalls along the riverbank: everyone got the same measure of gold dust to trade for porcelain, and whoever came back with the most won. Lakan came back with a whole stack of blue-and-white bowls, so tall he had to steady it with his chin. I managed five. Lin Hui, who taught us porcelain, was a Fujian woman the school had hired, hardly older than we were, and she haggled with a smile that never left her face. She picked up the top bowl of Lakan’s stack, tapped it with a fingernail and tilted her head to listen. “That’s the price they give the datu’s house. They won’t give it twice.” Lakan’s swagger drained away. He turned the bowls over one by one, and at the very bottom found one with a chip out of its rim, turned inward, invisible in the middle of a stack. The seller had known exactly how it would go: a boy of the datu’s family would never check the goods in front of a crowd. He held that bowl up to the sun and studied it a long while, then turned to me. “Those five of yours. How did you pick them?”"

[tracks.bond_lakan_pula.chapters.b1.choices.redo_with_own_name]
text = "Ask him to try again tomorrow, each of us with our own gold dust, without naming his family."
hint = "He’s just lost face and he’s still smarting. Ask him for a rematch now and he’ll take it as a jab."
reply = "The next day he put on old clothes and trailed after me, and not once did he say “my uncle.” He came back with half as many bowls, and not a chip among them. He set them out on his mat and counted them twice, then fished the chipped bowl out from under his bed and pushed it into my hands. “For rinsing your brushes. Put this one on my account.”"

[tracks.bond_lakan_pula.chapters.b1.choices.learn_the_glaze]
text = "Take the loss, and ask Lin Hui to teach us to read glazes and foot rims."
reply = "Lin Hui set the chipped bowl and one of mine upside down side by side and turned their feet to the light so we could compare: thin clay glows, patched glaze looks dull. Lakan was the most diligent of anyone, going down the row tapping each bowl with a fingernail to hear it ring. When Lin Hui named a price at the end, he even asked one more question on my behalf: “If we take all five, can you come down a little?”"

[tracks.bond_lakan_pula.chapters.b2]
title = "Who Rows for Whom"
text = "When the northeast monsoon set in, the river mouth filled with sails again. Lakan’s uncle was sending a balangay to Mindoro for cargo, and every rower he picked was a neighbor in debt to the family. On a pillar of the longhouse hung a wooden board with the debtors’ names cut into it, one after another. The name at the bottom was the newest; the cut wood was still pale. In front of a roomful of people Lakan talked back to his uncle. The uncle didn’t take offense. He laughed. “You want rowers who don’t owe us? Then pay for them yourself.” At dusk Lakan came looking for me. He emptied a little pouch of gold dust onto the mat, pushed it into small heaps with a sliver of bamboo, and counted it three times. It came out the same every time. “Enough to hire two,” he said. “What about the other ten?”"

[tracks.bond_lakan_pula.chapters.b2.choices.pool_your_gold]
text = "Pour my share of gold dust in too, enough for four rowers who owe nothing."
hint = "He won’t yet let a classmate pay for his family’s business. Pour out your gold and he’ll bag up every grain and hand it back."
reply = "Pushed together, the two heaps came to exactly four. Four isn’t many, and when the boat went out through the river mouth Lakan sat on the front bench and rowed the whole way himself. Half a month later the boat came back. He jumped ashore, came straight to me and held out both hands, palms up: covered in blisters, a few already rubbed raw. “Look,” he said, his eyes bright. “Four men on this trip were paid wages.”"

[tracks.bond_lakan_pula.chapters.b2.choices.turn_it_into_shifts]
text = "Offer him a middle way: the debtors row in shifts, and this trip’s work pays down what they owe."
reply = "We split the trip into three shifts, each tallied by the work done, each knocking a stretch off the board. His uncle listened with narrowed eyes and, to our surprise, nodded. Early the next morning Lakan stood under the pillar and read the names on the board aloud, one by one, to the men on the shifts, marking a shift for each. When he reached the newest name at the bottom, his voice went quiet."

[tracks.bond_lakan_pula.chapters.a1]
title = "Night Tide at the River Mouth"
text = "The tide was coming in that night when I came upon Lakan at the river mouth. He was sitting on the hull of an upturned boat, whittling a broken oar, curls of shavings dropping one after another. He didn’t look up. “My uncle’s boats are never short of rowers. Do you know why? Because they all owe us.” The knife paused. “When I was small I thought those men played in the water with me because they wanted to. I’d throw stones in the river and they’d dive down and fetch them. Then one day I saw an old rower’s daughter being led away to pay off his debt. She looked back once. She looked at me.” The tide crept up and licked the gunwale. He gathered the shavings into a fistful, scattered them on the water, and watched them spin away upstream. “A boat rowed like that—I don’t want one.”"

[tracks.bond_lakan_pula.chapters.a1.choices.hold_the_oar]
text = "Reach out and steady the broken oar for him, and stay until the tide goes out."
hint = "Tonight he doesn’t want anyone that close. Once you know each other better, he’ll let you hold the oar."
reply = "One stroke of his knife went wide and the blade came within a hair of my fingers. I didn’t let go, and he didn’t tell me to; he only carved more slowly. By the time the tide went out, the oar had begun to take some kind of shape. He stood up and brushed off the shavings. “Come here again tomorrow.” Then he left first. A few steps on, he looked back."

[tracks.bond_lakan_pula.chapters.a1.choices.return_the_tablet]
text = "Promise him that before we leave the school, I’ll help him take down the debt board on the pillar."
hint = "This is too big. He doesn’t yet see you as someone who can carry it with him. Get closer first, and he’ll let you promise."
reply = "He looked up at me for a long time, the knife still in his hand. “We’d have to talk my uncle round first,” he said. “That could take a lifetime.” I said then it would take a lifetime. He stared, then laughed out loud, so loud a water bird burst out from under the boat. He cut a notch into the broken oar with his knife. “Today counts as day one. One notch for every day we keep at it.”"

[tracks.bond_lakan_pula.chapters.a1.choices.ask_his_ship]
text = "Ask him what kind of boat he wants someday."
reply = "“A boat where every rower is paid.” He thought, then added, “A small one would do.” He drew it in the wet sand with the broken oar: the prow tipped up too high, the oars on one side longer than the other. I said a boat like that would only spin in circles. He said then it would spin until he’d saved enough to get the oars matched. The tide washed in and took a corner of the stern with it."

[tracks.bond_lakan_pula.chapters.a2]
title = "A Spoon Carved from a Broken Oar"
text = "Lakan had carved the broken oar into wooden spoons. The first three had all split, and he laid them out on his mat one by one to show me, cracks up, like a row of soldiers who had lost the battle. The wood was too old, he said; the grain was twisted, and if the knife strayed at all, it split right along it. The fourth he kept behind his back. Its rim was worn smooth and round, and the handle still bore an old waterline from the oar. He held it out with his eyes on the doorway. “This was the last oar from that boat. The old rower says it worked the Pasig for thirty years.” I took it. It was heavier than it looked, and the bowl was as smooth as a river pebble. He added, his voice dropping, “If you think it’s ugly, call it something I owe you.”"

[tracks.bond_lakan_pula.chapters.a2.choices.take_all_four]
text = "Take the fourth, and ask for the three cracked ones as well."
hint = "This is too much to accept yet. You aren’t that close, and if you took it now he’d only regret having offered it."
reply = "“Greedy,” he grumbled, but his hands were already hunting for twine. He tied the three cracked spoons into a bundle and shoved it at me, tied so tight the handles dug into one another. I said I’d eat every meal with a spoon he had carved from now on, and hang the cracked three on the wall by turns. He turned and walked off, bumped the doorframe on his way out, and went red right down to his neck."
effects = [{}, {}, {}, { title = "A Spoon Carved from a Broken Oar" }]

[tracks.bond_lakan_pula.chapters.a2.choices.sit_by_him_at_feast]
text = "Accept the spoon, and say that at the next feast I’ll sit beside him and eat with it."
hint = "You’d need to be closer before you could say that. Say it today and he’ll think you’re only being polite."
reply = "He didn’t answer, only grunted. At the next feast in the datu’s house, the place beside him stayed empty all evening; whoever tried to sit there, he said it was taken. When I came in, the whole room watched me walk between them and sit down. I took the wooden spoon out of my shirt. He glanced down at it, then moved the best piece of fish from the platter into my bowl."
effects = [{}, {}, {}, { title = "A Spoon Carved from a Broken Oar" }, {}]

[tracks.bond_lakan_pula.chapters.a2.choices.too_good_to_use]
text = "Tell him the spoon is too fine; I couldn’t bear to use it."
reply = "“A spoon is for eating.” He pressed it into my palm. “If you can’t bear to use it, don’t take it.” He turned to the hearth, ladled out a bowl of soup and set it down in front of me. There was nothing for it but to drink it in front of him, a spoonful at a time. He watched the whole while, and only at the last mouthful did he say, “It doesn’t leak.”"

[tracks.bond_lakan_pula.chapters.s]
title = "In His Own Name"
text = "At the end of the year Lakan drew up the shares with the rowers on the family’s behalf for the first time. The tablet lay on the longhouse table, and the name meant to go on it was his uncle’s. He took the knife and cut his own name instead, stroke by stroke, deep. His uncle stood watching in the doorway, neither coming in nor leaving. When Lakan was done he set the knife down on the table, and his hand was still shaking. He caught me looking at it and laughed first. “Heavy knife.” The rowers came up one by one and pressed their handprints beneath the name. I was to sail with a ship in the spring. He walked me to the riverbank with the tablet under his arm and said nothing the whole way. At the water’s edge he finally spoke. “From now on, if you want to know whose boat is the fairest in Tondo, you’ll know when you come back.” The tide ran in and out around our feet. He raised the tablet before my eyes, his name turned toward me, and waited for me to say something."

[tracks.bond_lakan_pula.chapters.s.choices.promise]
text = "Promise: when we’re grown, we’ll sail a boat together where every rower is paid."
hint = "Whatever goes on that tally stands for life. What you two share can’t be carved there yet—or you’ve already set down a lifelong account like this with someone else."
reply = "I said that when we were both grown, we would sail a boat together, from Tondo to Mindoro, a tally for every rower, and wages paid the moment the notches were full. Lakan heard me out, and for once he didn’t start with a string of fine words. He stared down at his own name on the tablet and didn’t move for a long while. Then he took hold of one corner and wrenched. The wood snapped with a crack and left a ragged break. He pressed the broken-off corner into my hand and tucked the rest back under his arm. “That’s your pledge,” he said. “I don’t own anything worth giving. This is the first thing I ever cut with my own name. A promise with a corner missing—let’s see if you dare not come.” I held the bit of wood tight, its broken edge digging into my palm. He had already turned his back to me and stood at the water’s edge. After a while he said, “When the time comes, I’ll steer and you keep the books. Any price I can’t make add up, that’s yours.”"
effects = [{}, {}, { title = "In His Own Name" }, {}, {}, {}]

[tracks.bond_lakan_pula.chapters.s.choices.heart]
text = "Tell him that when we’re grown and I come back to Tondo, I’ll have a question to ask him face to face."
hint = "The tide goes out and comes back, and the question you meant to save for when you’re grown still doesn’t surface. Your hearts aren’t that close yet—or you’ve already saved those words for someone else."
reply = "I said that when we were both grown and I came back to Tondo, I would have something to ask him face to face. Not now. Lakan froze. The hand holding the tablet slowly came down. Twice he opened his mouth. The first time nothing came out. The second time he said, “Then I won’t tell you yet how I’ll answer.” After that he didn’t look at me. He looked at the river. So did I. On the Pasig the sails came down one by one, and in the longhouses across the water the lamps came on one by one, and we stood shoulder to shoulder and watched them, from the first to the last. When it was fully dark, the back of his hand brushed the back of mine. Just once, and quickly gone, as if by accident. He shifted the tablet to his other arm and cleared his throat. “The tide’s turning.” I said it was. We stood a while longer before we started back."
effects = [{}, {}, {}, {}, { title = "In His Own Name" }, {}, {}]

[tracks.bond_lakan_pula.chapters.s.choices.own]
text = "Make a bet: once we’re grown, we race at the Tondo docks to see whose boat fills first."
reply = "“What’s the stake?” He clamped the tablet under his arm, eyebrows already up. I said a feast. He snorted. “My family throws a feast every day.” He thought it over and held out his hand. “A boat. The loser pays a whole season’s wages for every rower on the winner’s boat.” “Your family’s boat, or yours?” “Mine.” He answered fast, then stopped short, as if he had never heard that word come out of his own mouth before. We slapped hands on the riverbank, loud enough to send two egrets up off the water. Then we turned, one toward the longhouse, one toward the docks. A dozen steps on I looked back, and so did he, and we both pretended to be looking at something else."

[tracks.reunion_lakan_pula]
name = "Lakan Pula: New Oars at the River Mouth"

[tracks.reunion_lakan_pula.chapters.reunion]
title = "New Oars at the River Mouth"
text = "Seven years on, my ship came back to Tondo. Lakan’s boat lay at the mouth of the Pasig, freshly painted, but carrying half the oars it used to. He wasn’t aboard. He was sitting cross-legged in the shade outside the feast in a ring of rowers, dividing the shares one tally to a man, the knife turning easily in his hand. I called across the crowd, “Lakan, the feast is inside. You’re sitting in the wrong place.” He looked up, his hand opened, and a bundle of tallies scattered across the ground. He was thinner, his cheekbones showing, but his laugh hadn’t changed; you could hear it a dozen paces off. He didn’t stop for the tallies. He stepped over them and seized my arm. “You’re just in time. There’s a price I can’t make add up.” Behind him the rowers picked up the tallies one at a time, and with each one they glanced at me. From the prow of his boat hung a share tablet, blackened by sun and rain, the name on it still legible."

[tracks.reunion_lakan_pula.chapters.reunion.default]
effects = [{ text = "You didn’t come back this year. The master of a Fujian junk says your ship is wintering in the south, so I’m sending this with him. He asked what I was writing. I said, accounts. Accounts first, then. This year, for the first time, I signed shares with the rowers for a boat of my own, in my own name. Not for the family, not for my uncle. Eleven men, eleven tallies. At the head of each I cut the mark of an oar, and at the foot the names, theirs on the left, mine on the right. Three of them can’t cut letters, so they pressed their hands, and the handprints are bigger than the writing. My uncle died last year. That board on the pillar, I took it down and burned it. It took half a morning. The wood was harder than I thought. The boat is smaller now, half the oars it had, and every rower draws wages, so I go over the sums three times before each trip out of the river mouth. When they won’t add up, I think: if you were here, you’d laugh at me first and then do the sums for me. There’s a price right now I can’t make add up. I’m saving it for when you come back. With the wood left over from that broken oar I whittled a new tally. It has your name on it and hangs at the prow. The rowers asked whose share it was. I told them it belongs to the one who hasn’t come back yet. Lakan. P.S. The boatmen say the northeast wind is coming early this year. When you come home, catch it." }, {}]

[tracks.reunion_lakan_pula.chapters.reunion.choices.friend]
text = "Sit and listen while he finishes the shares, then eat with him somewhere there’s no show to put on."
reply = "I found a stone in the shade and sat down. He was slow about it. Every tally went to the rower first, and only when the rower had cut his notch did Lakan cut his own; if he cut one wrong, he shaved it off in front of everyone and started again. By the time they finished it was dark. He didn’t throw a feast. He built a fire on the riverbank, grilled a few fish, and fed me and the rowers. The fish were a little burnt. He tore his apart with his fingers and mentioned that his uncle had died the year before. “That board on the pillar,” he said. “I took it down and burned it in front of the lot of them. Took half a morning to burn through. That wood’s hard.” He said it as plainly as quoting a price. An old rower by the fire put another stick on and said nothing. When we’d eaten, he tossed the fish bones into the river and asked me, “That price I can’t make add up—will you come back tomorrow and help me with it?” I said I would. He nodded, lay back on the sand and looked up at the sky, and after a long while said, “Seven years, and you haven’t changed a bit.”"
effects = [{}, {}, {}, { title = "New Oars at the River Mouth" }]

[tracks.reunion_lakan_pula.chapters.reunion.choices.rival]
text = "Bet him on this season: whose boat fills up with beeswax first."
reply = "He slapped his thigh, and half the tallies he’d just gathered went flying again. “I’ve been waiting for you to say that!” That season every dock in Tondo knew there were two boats at the river mouth out to beat each other. He took his rowers upriver for wax before dawn; I went to Mindoro to catch the goods the Fujian junks wanted. He undercut my prices, I bid up his, and once we met at the same wax-gatherer’s door and both started talking at once, and the poor man shut the door on us. When the monsoon was about to turn, the two boats lay side by side at the river mouth to be weighed. Mine was half a boatload of beeswax short. He won a jar of wine and carried it once around the docks, telling everyone he met. When he’d made the round he came back to my boat, set the jar on the gunwale, poured two bowls and pushed one at me. “Half a jar. Save the other half; next season you win it back.” I drank. It was strong. He squinted at me. “That half boatload—you didn’t fall short on purpose, did you?” I said I hadn’t. He said good, or there’d be no fun in winning."
effects = [{}, {}, {}, { title = "New Oars at the River Mouth" }]

[tracks.reunion_lakan_pula.chapters.reunion.choices.love]
text = "Put the spoon carved from the broken oar back in his palm, and tell him I’m in no hurry to leave this time."
hint = "The words went unsaid back then, and they won’t come now either. He only laughs, and stoops to gather the tallies off the ground."
reply = "The rowers drifted off, and the two of us were alone in the shade. I took the spoon from my shirt. Seven years of use had worn its rim rounder than ever. I put it in his palm and said, “That question from back then—I’ve come back to ask it. And this time I’m in no hurry to leave.” He looked down at the spoon and ran his thumb around its rim, twice. Then he closed his hand around the spoon and my hand together and held on hard, knuckles white. “I’ve been carving spoons for seven years,” he said, his voice a little rough. “The spoiled ones fill half a room. All for this day.” Before I could say anything he leaned in and kissed me, quickly, as if afraid I’d pull away. I didn’t. He kissed me again, slower this time. That night the tide came in at the river mouth and climbed the stone steps. We sat on his boat listening to the water slap against the hull, again and again, far into the night, and neither of us went back to the longhouse."
effects = [{}, {}, {}, { title = "New Oars at the River Mouth" }]

[tracks.reunion_lakan_pula.chapters.reunion.variants.v1_promise]
text = "Seven years on, my ship came back to Tondo. Lakan’s boat lay at the mouth of the Pasig, freshly painted, but carrying half the oars it used to. He wasn’t aboard. He was sitting cross-legged in the shade outside the feast in a ring of rowers, dividing the shares one tally to a man, the knife turning easily in his hand. I called across the crowd, “Lakan, the feast is inside. You’re sitting in the wrong place.” He looked up, his hand opened, and a bundle of tallies scattered across the ground. He was thinner, his cheekbones showing, but his laugh hadn’t changed; you could hear it a dozen paces off. He didn’t stop for the tallies. He stepped over them and seized my arm. “You’re just in time. There’s a price I can’t make add up.” Behind him the rowers picked up the tallies one at a time, and with each one they glanced at me. From the prow of his boat hung that share tablet, a corner missing, the break long since worn smooth. The piece I carried would fit it exactly."

[tracks.reunion_lakan_pula.chapters.reunion.variants.v2_own]
text = "Seven years on, my ship came back to Tondo. Lakan’s boat lay at the mouth of the Pasig, freshly painted, but carrying half the oars it used to. He wasn’t aboard. He was sitting cross-legged in the shade outside the feast in a ring of rowers, dividing the shares one tally to a man, the knife turning easily in his hand. I called across the crowd, “Lakan, the feast is inside. You’re sitting in the wrong place.” He looked up, his hand opened, and a bundle of tallies scattered across the ground. He was thinner, his cheekbones showing, but his laugh hadn’t changed; you could hear it a dozen paces off. He didn’t stop for the tallies. He stepped over them and seized my arm. “You’re just in time. There’s a price I can’t make add up.” Then, lower: “And let’s be clear—that handshake on the riverbank still stands. My boat is this one, right here.” Behind him the rowers picked up the tallies one at a time, and with each one they glanced at me. From the prow of his boat hung a share tablet, blackened by sun and rain, the name on it still legible."
