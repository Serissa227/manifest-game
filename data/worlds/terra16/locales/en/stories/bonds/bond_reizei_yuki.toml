# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_reizei_yuki.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# C21b 审读后（2026-11-12）：好感方向改了、或手册点名删掉的原句所在的章，英文整章删掉回退中文：bond_reizei_yuki.b1、bond_reizei_yuki.b2、bond_reizei_yuki.a2。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上、又新加了选项与变体，照“缺译回退中文”（整章未译可回退）整章删掉，待照新中文重译：bond_reizei_yuki.s。重逢一章是轨道里唯一的一章，删了就不算“整章未译”，所以保留，只补新加的变体与选项、改掉与新中文对不上的几条（见各条上方注释）。
# 回忆标题与来信按 effects 的下标对应（a2 两个收下选项第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个、重逢三个落点第 4 个是 memory；重逢 default 第 1 个是 letter）。

[tracks.bond_reizei_yuki]
name = "Reizei Yuki: The Half She Struck Out"

[tracks.bond_reizei_yuki.chapters.c1]
title = "The Half She Struck Out"
text = "I had been in the capital less than a month when the ladies held a small poetry gathering in their quarters. The topic was “The Sea in Spring.” I filled my poem slip edge to edge: the Tosa surf, the boats at Shimoda, the whole beach of shells the ebb tide leaves behind. I couldn’t bear to lose a word of it. The slip was passed to the Reizei daughter. She gave it one look, picked up her brush, and struck out the second half, one stroke and then another, clean through. Only then did she hand it back. “Cut this line, and the rest can finally be heard.” The whole room hid their laughter behind their sleeves. Someone whispered, “The princess from Tosa ships her poems in by the boatload.” I gripped the slip so hard my nails dented the edge, and very nearly tore it up on the spot. That night I looked at it by the lamp. The second half lay under the ink bars. The first half stood on the paper by itself, a line of surf, a line of boat, and with all that clutter gone, you could almost hear the water. I turned the wick up, and the longer I looked, the angrier I got. She was right."

[tracks.bond_reizei_yuki.chapters.c1.choices.rewrite_defiant]
text = "Rewrite it the next day, put back the half she cut, and lay it in front of her."
reply = "I wrote the struck half back in word for word, added a line for good measure, ground the ink thick and black, and spread it out right under her nose. She read it from top to bottom, picked up her brush, and struck it out again, faster this time. Then she wrote three small words in the margin: “Still too much.” I stamped on the floorboards so hard every lady down the gallery turned to look. She didn’t raise her eyes, but the corner of her mouth twitched, as if a smile were coming, and she pressed it back down."

[tracks.bond_reizei_yuki.chapters.c1.choices.ask_why]
text = "Go to her rooms and make her say exactly what was wrong with the half she cut."
reply = "She had me kneel across from her and talked for a good quarter of an hour, each remark sharper than the last. Shells don’t belong in a poem. You don’t count boats one by one. “The whole beach” sounds like a fishwife crying her wares. At the end she turned the slip over and rapped it with a knuckle. “Your sea is too loud. The sea is loud enough already. It doesn’t need you shouting for it.” I wrote down every word and went home and revised it three times. When I handed in the third, she looked at it a long while, lifted her brush, and set it down again."

[tracks.bond_reizei_yuki.chapters.c2]
title = "A Water-Stained Kokinshū"
text = "The copy of the Kokinshū I brought up from Tosa had been soaked by a wave on the voyage. Once it dried, every page puckered, and it rustled when you turned the leaves. I carried it to Yuki to argue over the very first poem, the one about spring arriving before the year is out: should that spring count as last year’s or this year’s? She opened it and frowned harder than the paper was creased. “Did someone fish this out of the sea?” “It came over the sea. So did my reading.” She let that pass and wrote a line in tiny characters in the margin. I pointed at the text and argued back, and she wrote another. We went from early afternoon until the attendant came to light the lamps, topped up the inkstone twice, and neither of us gave an inch. When the lamp was lit she closed the book, opened it again, and on the back of my page wrote out my reading too, neat as print. Then she set her brush on the rest. “We go on tomorrow.”"

[tracks.bond_reizei_yuki.chapters.c2.choices.come_back_tomorrow]
text = "Promise to come back tomorrow, and leave the water-stained book with her."
hint = "She still takes you for a country princess who came to pick a fight. She won’t let that crumpled book spend a night on her desk."
reply = "The next day the book came back wrapped in plain silk. Every margin had new notes in her small hand, some arguing with me, some arguing with the ancients. Halfway through there was a page with only three words on it, “Here you’re right,” written so small I had to hold it under the lamp to read it. I took it to her and asked if she’d written it on the wrong page. She folded the silk and pushed it back into my arms. “Ask again and I’ll cross it out.”"

[tracks.bond_reizei_yuki.chapters.c2.choices.concede]
text = "Admit defeat, and beg to borrow her afternoon’s notes to copy."
reply = "“Too early to give up,” she said, and pushed the book across anyway. I copied until midnight, and somewhere in the middle my brush stopped: in one place she had put a poem of Tsurayuki’s under someone else’s name. The next day I laid that page in front of her without a word. She glanced down, and her ears went red first, then the rest of her face. She spent the whole afternoon behind her fan and didn’t say another thing to me."

[tracks.bond_reizei_yuki.chapters.a1]
title = "Across the Silk River"
text = "On the seventh night of the seventh month, the palace held the Tanabata festival. Offerings were set out in the garden, with a bronze basin full of water to catch the stars. Inside, the ladies sat in two rows with a long length of white silk hung between them for the River of Heaven. You wrote a poem on paper and slid it under the silk; whoever caught it on the other side wrote a reply and slid it back. They call it the flowing seat. I slid mine across and knelt there waiting. The lamps were on the far side, and they threw a row of bowed shadows onto the silk. The paper came back. I knew that hand: thin, hard, each stroke finished like a blade. Not one word of my poem had been struck. She had only added a line after it, so lightly it was like someone across the River of Heaven answering softly. From under the silk came a whisper, pitched very low. “Don’t read it out.” I looked up. The shadow facing mine still had its head bowed, brush still in hand. The lady beside me leaned over. “Who wrote it?” I folded the paper and tucked it under my knee. “I’m not telling.”"

[tracks.bond_reizei_yuki.chapters.a1.choices.write_only_for_her]
text = "Write another, meant only for her on the far side of the silk."
hint = "A poem for her alone, on the far side of the silk? You lift the brush and set it down again. You aren’t close enough yet; push a poem like that across and she’ll push it straight back."
reply = "I wrote slowly, a line and then a line struck out, until only two were left, and slid them across. This time the reply was slow to come. When the paper came back, the last character was still wet, and it left a smudge of black on my finger. After the gathering broke up she passed close by me without breaking step and said, very low, “Tonight’s poems. Nobody else sees them.”"

[tracks.bond_reizei_yuki.chapters.a1.choices.keep_her_line]
text = "Copy her line onto my fan and take it to show her the next day."
hint = "It’s too soon between you. If her words turn up on your fan, she’ll think you’re making fun of her."
reply = "The next day I opened the fan and held it out. When she saw her own line between the ribs, the fan went up over her face in a flash. “You’ve made my handwriting ugly.” All the same, her hand came out and took the fan, turned it over, and added another line on the back before she gave it back. The ink on that side was darker than on the front."

[tracks.bond_reizei_yuki.chapters.a1.choices.ask_mercy]
text = "Catch up with her after the gathering and ask why she didn’t strike a single word tonight."
reply = "“No cutting at Tanabata.” She didn’t turn her head. “It’s one night a year.” I followed a few steps behind and was just starting to feel pleased with myself when she added, “Your fourth line could still be better.” She walked on. I stood in the gallery and went through the poem in my head once more. The fourth line could still be better."

[tracks.reunion_reizei_yuki]
name = "Reizei Yuki: A Page for the Traveler"

[tracks.reunion_reizei_yuki.chapters.reunion]
title = "A Page for the Traveler"
text = "Seven years later my ship put in at Sakai, and I went up to the capital by road, to the Reizei house. Yuki was teaching in the inner room. Five or six girls knelt in a row, a poem slip in front of each. She drew a line through one child’s poem, and the girl bit her lip, eyes going red. Yuki looked up, saw me, and her brush stopped in midair. She sent the pupils off, and only when the last child was out the door did she speak. “You’re as brown as a deckhand.” She took a book down from the shelf. It was the manuscript she had been editing the year I left, printed now, with her name on the cover, the three characters larger than she used to write them. She turned the pages one by one to the very last. There was no poem on it, only a small line in the corner: For the one who comes from far away. She handed me the brush. A loop of old thread was wound around its shaft. “The poems from the sea. Let me hear them.”"

[tracks.reunion_reizei_yuki.chapters.reunion.default]
effects = [{ text = "You did not come to Kyoto this year. I asked the Sakai merchants twice which sea your ship was in. They gave me two different answers, so I stopped asking. The manuscript is printed. The printers cut my name too small, and I made them cut it again. On the last page I let them put no poem, only a line in the corner, for the one who comes from far away. No one came from far away this year, so the page stays as it is for now. I have pupils, five of them, all better behaved than you were and all worse poets. One child filled her slip edge to edge, and I struck out half of it, and she cried all afternoon. I did not apologize. The next day she brought a new one, and the first half could stand on its own. I thought of you that day. The palace still keeps Tanabata, and at the flowing seat I still sit in the same row. The people on the other side of the silk have changed several times. They all answer very politely. Not one of them dares to disagree. If you write poems at sea, send the good ones and I will cut them for you. The poor ones I will put away, so I can laugh at you to your face when you come back. This year’s poem is not good. I did not strike anything out. It is enclosed. Reizei Yuki. P.S. Send the bad poems too." }, {}]

[tracks.reunion_reizei_yuki.chapters.reunion.choices.friend]
text = "Write a sea poem on that page, and ask her to finish the second half."
reply = "I wrote the first half: wind rising at night, the sail full, the whole ship groaning. I read it over. Still loud. She took the brush, struck out none of my words, and wrote the second half after it. Hers began after the wind dropped: the ship still moving, the sound of water sliding along under the hull. I read it and couldn’t speak for a while. Seven years at sea, more than a hundred poems about it, and not one of them had caught that sound. “This page belongs to both of us.” She wrote our two names side by side at the foot of it, hers on the left, mine on the right, then went over one stroke of mine. “Your hand is still too sloppy. I’ve fixed it for you.” In the evening her pupils came back for their lesson, and she turned the page to show them and said this was her poetry friend. One child asked which half the teacher had written. She said, “Guess.”"

effects = [{}, {}, {}, { title = "A Page for the Traveler" }]

[tracks.reunion_reizei_yuki.chapters.reunion.choices.rival]
text = "Leave the page unwritten for now, and challenge her to a contest before a judge."
reply = "I handed the brush back. “Not this page. Not yet. At a contest, in front of a judge.” She looked at me a moment and suddenly laughed. “You still want to fight.” She folded down the corner of the page, neatly, and pressed the crease flat with her nail. “Ten years, then. Counting from the year you left the capital. Not one day less.” “That’s three more years.” “Three more years,” she said. “Long enough for you to make the sea quiet.” She closed the book and put it back on the highest shelf, where it was the only book. At the gate she added, “I’ve already decided on the judge. If you lose, don’t stamp your feet in public.” I said if I lost I’d go stamp on my own deck. She thought about it and said that would count."

effects = [{}, {}, {}, { title = "A Page for the Traveler" }]

[tracks.reunion_reizei_yuki.chapters.reunion.choices.love]
text = "Write a poem on that page for her alone, then ask for the answer to my letter."
hint = "What you couldn’t say back then, you still can’t say today. You write a poem about the sea and hand the brush back to her."
reply = "I wrote on that page, and there wasn’t a single wave in it. I wrote Tanabata night, and the shadow on the far side of the silk with its head bowed. When I’d finished I didn’t read it over. I pushed the book across to her. She read it for a long time. Then she stood, took a letter from a lacquer box on the shelf, its cover worn soft, my handwriting on it: Elder Sister. The seal had never been broken. “We said not until that day.” She opened it. Inside was the hand I’d had at sixteen, and as she read, her eyes went red. When she finished she drew another sheet from the bottom of the box and handed it to me, the paper gone yellow. “My answer. I wrote it that same year.” It was a single line of poetry. I read it aloud before I knew what it answered: the poem I slid under the white silk that Tanabata night. That night she had added only one line. This was the next, and she had waited eight years to pass it across. That night in the Reizei gallery, the lamps in the garden went out one by one. She called me “Middle Sister,” and before I could answer, she kissed me."

effects = [{}, {}, {}, { title = "A Page for the Traveler" }]

[tracks.reunion_reizei_yuki.chapters.reunion.variants.with_ushio]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. Yuki was teaching in the inner room, five or six girls kneeling in a row. Each had a poem slip in front of her. Yuki struck a line through one child’s poem, and the child bit her lip, eyes going red. Yuki looked up and saw me, her brush stopped in midair, and she sent the students out. “Brown as a boatman.” A letter from Tosa lay weighted on the desk, the hand a little crooked. She saw me looking and pushed it under a book, halfway. She took down the printed collection and turned to the last page. No poem on it, only a small line in the corner: for the one who comes from far away. She handed me the brush. “Bring me a sea poem.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.lied]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. Yuki was teaching in the inner room, five or six girls kneeling in a row. She looked up and saw me, and her brush didn’t stop until she had finished striking through the child’s poem; then she sent the students out. “Brown as a boatman.” She took down the printed collection and turned to the last page, the small line in the corner: for the one who comes from far away. She didn’t hand me the brush. “Sakai merchants talk,” she said. “Which year, which month, whose ships carried how many letters addressed to an elder sister: they remember better than I do. On that sheet you wrote one.” She shut the book. “The seat at the Nagare-no-za. I took it away the year before last. The mat stays empty; the ladies ask about it every year, and I can’t be bothered to answer.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.seat_removed]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. Yuki was teaching in the inner room, five or six girls kneeling in a row. She looked up, finished striking through the child’s poem, and only then sent the students out. “Brown as a boatman.” She took down the printed collection and turned to the last page; the small line in the corner had been struck through. “That year I asked you a number. You wrote back about something else, and the blank came back to me as it was.” She shut the book. “The seat at the Nagare-no-za, I took it away that year.” She handed me the brush. “Bring me a sea poem.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.stayed]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. Yuki was teaching in the inner room, five or six girls kneeling in a row. Each had a poem slip in front of her, cut from old paper with someone else’s writing on the back. Yuki looked up, her brush stopped in midair, and she sent them out. “Brown as a boatman.” She took down a stitched stack of pages with no cover. “The printers say next year. They said next year the year before last too.” She turned to the last page. No poem on it, only a small line in the corner: for the one who comes from far away. She handed me the brush, an old thread wound round its handle. “Bring me a sea poem.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.silent]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. The gatekeeper said the young mistress had gone down to Okō in Tosa the year before last, taught the Chōsokabe ladies for two years, and come back this spring. Yuki was teaching in the inner room; she saw me, her brush stopped, and she sent the students out. “Ichijō-dono.” That was what she called me, and what she had written in her letters these two years. “Okō rice is good rice.” She took down the printed collection, her name on the cover, and turned to the last page: for the one who comes from far away. She handed me the brush. “Bring me a sea poem.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.told]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. The gatekeeper said the young mistress had come back from Okō the year before last, after two years teaching the Chōsokabe ladies. Yuki saw me from the inner room, her brush stopped, and she sent the students out. “Ichijō-dono.” That was how her letters had begun these two years. She took down the printed collection and turned to the last page: the small line, for the one who comes from far away, was still there, and the blank beside it held a poem written at Okō. She handed me the brush. “Bring me a sea poem. Write it on another sheet.”"

[tracks.reunion_reizei_yuki.chapters.reunion.variants.went]
text = "Seven years later my ship put in at Sakai and I went up to Kyoto overland, to the Reizei house. The gatekeeper said the young mistress had gone down to Okō in Tosa, taught there two years, and come back this spring. A sack of Okō rice sat on her desk, tied with straw. She saw me and sent the students out. “Brown as a boatman. The Okō ladies asked about you, in more detail than their master did.” She took down the printed collection and turned to the last page: for the one who comes from far away. She handed me the brush. “Bring me a sea poem.”"
