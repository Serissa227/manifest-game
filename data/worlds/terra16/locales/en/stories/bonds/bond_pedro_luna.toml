# 佩德罗·卢纳：纬度不看姓氏（bond_pedro_luna）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_pedro_luna]
name = "Pedro Luna: Latitude Ignores Surnames"

[tracks.bond_pedro_luna.chapters.c1]
title = "Latitude Ignores Surnames"
text = "Just before noon our master at the House of Trade led us down to the bank of the Guadalquivir and handed each of us a borrowed astrolabe to take the height of the sun. Mine had been given to the school by the convent, its brass rubbed bright by the friars’ hands. The moment the sun stood highest, a student in a velvet doublet called out his reading first and loudest. The master was about to nod when an apprentice with brass filings on his fingers reached over, took the boy’s astrolabe, and pressed his thumb on one mark of the scale. “Half a degree off. This mark’s worn flat.” “My family has piloted for three generations.” The apprentice handed it back. “Latitude ignores surnames.” The master cleared his throat and told us all to measure again. When my turn came, the apprentice took my astrolabe too, looked at the face, turned it over, and ran his finger down every mark before he gave it back. Only later did I learn his name: Pedro Luna, apprentice in an astrolabe workshop in Triana."

[tracks.bond_pedro_luna.chapters.c1.choices.let_him_check]
text = "Hand him the astrolabe and ask him to teach me to spot a worn mark."
reply = "He was painstaking about it: run a fingernail lightly along the lines, and wherever the nail doesn’t catch, the mark is worn flat. He made me go all the way around with my eyes shut, and every time I missed one I started over. When we were done he handed it back. “Yours is better than the velvet one.” I said the convent had given it. He nodded and touched the scale once more. “Then that friar knows more than three generations of them.”"

[tracks.bond_pedro_luna.chapters.c1.choices.race_him]
text = "Refuse to be outdone, and race him to the latitude of Seville."
reply = "The master put up a copper coin as the prize. I was faster by a few moments; he was closer by half a degree. The master weighed the coin in his hand, thought it over, and gave it to Pedro. Pedro spun it once on his thumb and flicked it into my lap. “Speed counts for something. Next time be a little faster, and a little closer.” I closed my hand around the coin. It was still warm."

[tracks.bond_pedro_luna.chapters.c2]
title = "His Hand Shook"
text = "The workshop in Triana stood behind the potters’ kilns, and when the door opened the whole room smelled of brass filings and rosin. Pedro sat me across the bench and had me hold down a brass plate that hadn’t been graduated yet. “Don’t move. Breathe quietly, too.” He worked down the straightedge one mark at a time, and after each stroke he scraped it with a fingernail and listened to the faint ring. He was somewhere past the fortieth mark when his master pushed aside the curtain, a freshly mended quadrant in hand. “In a couple of years you’ll be done with your apprenticeship. When the fleet sails, you sail with it. The pilots’ instruments need someone to keep them true at sea.” “Yes, master,” Pedro answered at once. But the graver slipped on the brass and cut a slanting line that ran two marks into one. His master turned to go. Pedro stared at the slanted line, the point hanging in the air, his face yellower than the brass. My hands stayed flat on the plate. I didn’t dare move them."

[tracks.bond_pedro_luna.chapters.c2.choices.steady_the_plate]
text = "Keep the plate steady, ask nothing, and wait until his hand is still."
hint = "He slides the plate out from under your hands and turns away to hone the graver. He won’t let you see him like this—not yet."
reply = "I said nothing and kept both hands on the plate. The only sound in the room was the tapping from over by the kilns. After a long while he set the point back at the end of that slanted line, took a breath, and cut the next mark, straighter than any before it. When we packed up he wrapped the plate in cloth, layer after layer, without looking up. “You didn’t see anything today.” “I only saw the scale.” His hands paused on the cloth, then tied one more knot."

[tracks.bond_pedro_luna.chapters.c2.choices.volunteer]
text = "Call his master back and offer to sail in his place."
reply = "His master turned around, looked me up and down, and laughed. “You’re a pupil of the House of Trade. A berth from this workshop isn’t yours to take.” The curtain dropped. Pedro gave me a look, and whatever was in it, I didn’t understand at the time. He moved the graver to his left hand and wiped his right on his apron again and again."

[tracks.bond_pedro_luna.chapters.b1]
title = "The Shadow of the Giralda"
text = "The master set the problem in the square in front of the cathedral: take the sun’s height with a quadrant, pace off the Giralda’s shadow, and work out how tall the tower was. I measured once, did my sums, and sat on the steps to wait. Pedro measured three times. Each time he marked the tip of the shadow with an X in charcoal on the paving, then paced from the foot of the tower step by step, and if he drifted off line he went back and started over. A water seller’s mule walked over his X twice, and twice he drew it again. When the sun was sinking west, the master brought out the old records of the cathedral masons and compared: Pedro was off by a hand’s breadth, I was off by an arm’s length. “A hand beats an arm,” the master said, shutting the book, and gave it to Pedro. Pedro showed no trace of triumph. He took my working out of my hands, crouched on the steps, and studied it for a long time, tapping one line of figures after another. “Which step did you do faster?” he asked. “I walked that shadow three times. You walked it once.”"

[tracks.bond_pedro_luna.chapters.b1.choices.teach_him_speed]
text = "Teach him the step I do fast, in trade for the step he does right."
hint = "He holds his sheet tight, as if you’d come to steal his place. Your way of doing it isn’t something he can hear yet."
reply = "I showed him how to measure the shadow with a cord knotted at even lengths, so he wouldn’t have to pace it; he showed me how to measure three times, throw out the highest and lowest, and keep the one in the middle. We measured in the square all afternoon. The bells in the tower rang twice, and the paving was covered in charcoal X’s. In the end our two figures came out exactly the same. Pedro snapped his charcoal in half and pushed one piece into my hand. “Call this one a draw.”"

[tracks.bond_pedro_luna.chapters.b1.choices.no_rematch]
text = "Concede, and go copy down his three-pass method."
reply = "From memory I wrote out his method of measuring three times, a full page of it, and the next day I brought it to show him. He circled the places I’d copied wrong, and in the margin he wrote one small line: “Your first try was nearly right, actually.” The letters stood like the marks on a scale, every stroke separate, not one of them joined."

[tracks.bond_pedro_luna.chapters.b2]
title = "Where the River Meets the Sea"
text = "Pedro’s master sent him down the river on a caravel to try out a new compass at the mouth, and I went along to help. For the first two days the river lay as flat as polished brass, and Pedro talked compasses the whole way. When he got to stroking the needle with the lodestone, he took hold of my hand to show me. “Always one direction. Rub it back and forth and you’ve wasted your time.” Past Bonanza the banks suddenly fell away behind us and the river opened so wide there was no seeing the edge of it. Ahead was the sea. The first swell rolled in; the bow rose and came crashing down. Pedro stopped talking. He curled up against the rail with the compass in his arms, his face white as paper. His lips moved a few times without a sound. The needle spun wildly against his chest, faster than the waves. The captain shouted from aft, “Has the needle settled? Give me a reading!” Pedro gripped the rim of the compass until his knuckles went white. He shook his head once, and then again."

[tracks.bond_pedro_luna.chapters.b2.choices.take_the_compass]
text = "Take the compass and test it for him, let him lean on my back, and tell no one."
hint = "He clutches the compass and twists away toward the rail. He won’t let you see him like this—not yet."
reply = "I pried his fingers off the rim and took the compass. As he’d taught me on the way down, I waited for the bow to drop before reading the needle, and called each reading back to the captain. Pedro sat on the deck with his back against mine, and I could feel the shaking in it ease bit by bit. All the way home he leaned on me and said nothing. Only when we were inside the city gate did he speak. “You were the one who tested the compass today.” “You were the one who made it.” He didn’t answer. He pushed the compass into my arms."

[tracks.bond_pedro_luna.chapters.b2.choices.talk_him_through]
text = "Crouch beside him, read the marks aloud, and keep his eyes off the sea."
reply = "I crouched down and read into his ear: “One point west of north. Coming back. North. Due north.” His eyes followed my voice down onto the card and stopped looking past the bow. Somewhere past the twentieth reading his hands stopped shaking, and he called a reading himself, the same one I’d said. On the way back up the river he kept his eyes on the water. Then, out of nowhere: “The scale is nicer to look at than the sea.”"

[tracks.bond_pedro_luna.chapters.a1]
title = "Stars from the Roof Terrace"
text = "The school’s observing terrace sat on the roof of the House of Trade, and at night the wind came off the river smelling of pitch. The master wanted us to record when Sirius crossed the meridian. I was halfway through when the scratching of the pen beside me stopped. Pedro had set his old astrolabe on the parapet, and his fingers went around the scale on the back of it, once, and again. “I’m afraid of the sea,” he said. “Always have been.” I didn’t answer. He didn’t look at me either. He was staring toward the river mouth, where it was too dark to see anything. “My father cut astrolabes, and so do I. All my life I’ll be cutting things for other people to carry to sea, and I can’t even get past the river mouth.” His fingernail caught in one of the lines. “If my master found out, I’m afraid he’d throw me out. Who’d take an astrolabe aboard if it was cut by someone who’s afraid of the sea?” The stars came out one after another. He didn’t record a single one."

[tracks.bond_pedro_luna.chapters.a1.choices.just_watch]
text = "Put my astrolabe down too, and just watch the stars with him."
hint = "He turns his face toward the river mouth, shoulders stiff. You two aren’t close enough yet to keep a silence together."
reply = "I set my astrolabe down beside his. The two of them lay side by side on the parapet, and neither of us touched them again. Around midnight he raised a hand toward a very bright star low in the west. “That one. When I was little, I thought it was my mother.” Then he turned his face away. I could see him smiling, though his eyes were wet. The wind was cold, and at some point our shoulders had come to rest against each other. He didn’t move away. Neither did I."

[tracks.bond_pedro_luna.chapters.a1.choices.keep_secret]
text = "Promise to keep it from his master until he’s ready to tell it himself."
hint = "He glances at you and swallows the rest of what he meant to say. This is a weight you two haven’t come far enough to share yet."
reply = "“That day might never come,” he said. “Then I’ll keep it forever.” He turned and looked at me for a good while, and then he laughed. “You even measure your lies to the degree.” He picked his astrolabe back up and added one star in the corner of my record sheet—the one I’d missed a moment ago."

[tracks.bond_pedro_luna.chapters.a1.choices.what_scares]
text = "Ask him: is it the sea he fears, or the places at sea he can’t see?"
reply = "He thought about it so long that Sirius slid a finger’s width to the west. “The places where you can’t see land,” he said. “Where the scale doesn’t line up with anything.” “Then you’re the one who most ought to sail. What a ship lacks is someone who can make the scale line up with something.” “Nonsense,” he snapped, grabbing his astrolabe back, and he started recording stars, fast and fierce, without missing one."

[tracks.bond_pedro_luna.chapters.a2]
title = "The First Seal"
text = "Once a year the workshop held a class in seal cutting, teaching the apprentices to carve letters backward in boxwood. Everyone else cut their own name. Pedro worked on his for three days, wouldn’t show it to anyone when it was done, and carried it clenched in his fist all the way to the door of the lecture room before he opened his hand. It was a small wooden seal, and the name on its face was mine. The strokes leaned a little, the last one ended too abruptly, and the cut edges were still rough. “From now on, the charts you draw and the figures you take should carry your own seal.” He said it fast, as if he’d rehearsed it many times on the way. “I’ve mixed the ink too. It’s in the second drawer at the workshop.” He set the seal in my palm and folded my fingers over it one by one. The brass dust on his fingers brushed the back of my hand and tickled. “When to use it, and where,” he said, “that’s up to you.”"

[tracks.bond_pedro_luna.chapters.a2.choices.stamp_first]
text = "Accept it, and stamp it first on the corner of his scale table."
hint = "He holds the seal out, then draws his hand back half an inch. It’s too heavy a thing, and you two aren’t close enough yet to take it."
reply = "I went back with him to the workshop, took the ink from the second drawer, and pressed the seal once in the lower right corner of the scale table spread on his bench. He leaned in and studied the mark. “The very first stamp, and you put it on my work. You really know how to pick.” He never used that table to check a scale again. He folded it in four and put it away in the top drawer, beside the pair of dividers his father had left him."
effects = [{}, {}, {}, { title = "The First Seal" }]

[tracks.bond_pedro_luna.chapters.a2.choices.stamp_his_hand]
text = "Accept it, take his hand, and stamp the back of it."
hint = "The moment you touch his wrist, he snatches his hand away. You two haven’t come to that yet."
reply = "I took his hand, inked the seal, and pressed it once on the back. The red mark sat on his skin among the brass filings: my name. He stared down at it, and the tips of his ears slowly went red. “Now I’ll never wash it off.” He didn’t wash his hands all day. That evening his master scolded him for dirty hands, and he tucked them into his sleeves and still didn’t wash."
effects = [{}, {}, {}, { title = "The First Seal" }, {}]

[tracks.bond_pedro_luna.chapters.a2.choices.crooked]
text = "Tell him the strokes are crooked and ask for a new one."
reply = "“The crooked ones are how you know I cut it.” He pressed the seal deeper into my palm. “Anyone can cut a straight one.” So I kept it. He said nothing more, but the corner of his mouth stayed turned up all afternoon. Even when his graver fell on the floor, he was smiling as he picked it up."

[tracks.bond_pedro_luna.chapters.s]
title = "Recalibrate When You Return"
text = "On the first day of December the clerk at the House of Trade handed me my papers for a training berth: I would board in the spring. The papers gave the ship’s name and the captain’s, and at the bottom one small line: instruments to be supplied by the bearer. That evening Pedro was waiting at the workshop door with a leather case in his arms. Inside was an astrolabe, its brass freshly polished, the scale on the back as fine as hairs. “I spent a month calibrating it,” he said. “Every mark checked three times.” He didn’t hand it over right away. First his fingers went over the whole thing, from the ring at the top down to the last mark of the scale, as if he were checking that final degree, or saying goodbye to it. “When you’re back from a long run,” he said at last, laying it in my hands, “bring it to me first to be recalibrated. The damp at sea is hard on brass. It drifts.” The forge light turned half his face red. Whether he would come down to the quay in the spring, he never said."

[tracks.bond_pedro_luna.chapters.s.choices.promise]
text = "Promise him: every time I’m back, the astrolabe goes to his bench first."
hint = "Bringing it back to be recalibrated after every voyage is a promise for life. Your friendship isn’t true to that last degree yet—or you’ve already promised someone else you’d go to them first."
reply = "“Every voyage,” I said. “Wherever I come back from, I cross the river to Triana before I go anywhere else.” Pedro took the strap of the case back from me, tied a knot, then undid it and tied it again. “I won’t accept it out of true, mind you. If you drop it, soak it, use it to crack walnuts—” “Then you’ll fix it.” “Then I’ll fix it.” He tied the strap once more, hard this time. “Then you’ll have to keep coming back.” “Then you’ll have to keep waiting here.” He looked up at me as if the words had tripped him, then bent his head and tied the strap a third time. When he was done he patted the case, pushed it back into my arms, turned, and went into the workshop. From beside the forge came the sound of a file, stroke after stroke, quicker than usual. The day I sailed in the spring, I looked back from the deck. Someone was standing on the Triana bank holding something, too far off for me to tell if it was a file."
effects = [{}, {}, { title = "Recalibrate When You Return" }, {}, {}, {}]

[tracks.bond_pedro_luna.chapters.s.choices.heart]
text = "Tell him that when I’m grown and back, besides the astrolabe, there’s something I’ll need him to check."
hint = "You watch his hands on the astrolabe, and the words come up and go back down—either it isn’t time yet, or you’ve already promised them to someone else."
reply = "“Check what?” “If I say it now, it won’t come out true,” I said. “When we’re both grown, I’ll say it the day I come back.” Pedro’s hand stopped on the astrolabe and didn’t move. Something cracked in the forge before he spoke, his voice lighter than a graver’s touch. “Those words, then… I’ll keep a mark open for them.” He picked up his finest graver from the bench and, on the back of the astrolabe, out on the outer rim where the scale doesn’t reach, he cut one short line. “Right here. When you come back, see if it’s still there.” When I left, he walked me to the workshop door, reached out, and took my hand for a moment. He held it hard. The calluses on his fingers pressed into my palm, the way he’d hold a graver. Then he let go and stepped back. “Go on. Don’t get it wet.”"
effects = [{}, {}, {}, {}, { title = "Recalibrate When You Return" }, {}, {}]

[tracks.bond_pedro_luna.chapters.s.choices.own]
text = "Make him a bet: when we meet again, we see whose reading is truer."
reply = "“You’ll be measuring at sea every day, and I’ll be on land,” he said. “You’ve got the advantage.” “Then come aboard and race me.” His face went white for an instant, and his hand found the file at his belt. After a moment he laughed and put out his hand. “You’re on. Loser polishes the winner’s astrolabe for a year.” We shook on it at the workshop door. He still didn’t trust it, and with his file he scratched two short bars inside the case, one for me, one for him. “Each win, the winner adds a stroke. And no sneaking in extras.” Before he went inside he added, “The noon sun again, on the riverbank. Just like the first time.” I was a long way down the street when I looked back. He was still in the doorway, holding the file up against the sun, as if measuring how far off noon was."

[tracks.reunion_pedro_luna]
name = "Pedro Luna: A New Astrolabe in the Workshop"

[tracks.reunion_pedro_luna.chapters.reunion]
title = "A New Astrolabe in the Workshop"
text = "In 1562 I came back to Seville. My baggage was still on the quay when I crossed the bridge to Triana. The workshop door had a fresh coat of paint, and over it hung a small wooden board carved with Pedro’s name. He had finished his apprenticeship. As I walked in, a young woman was on her way out with a quadrant in her arms, calling over her shoulder, “The thirty-seventh degree—measure it again yourself tomorrow!” It was Isabel, the examiner’s granddaughter, who used to hide at the back of our lecture room and listen in; by the look of it she was a regular here now. She swept past me in a rush. In the middle of the bench sat a new astrolabe, with a line of small letters cut on the back: Pedro Luna made me. The first one he had ever signed. Pedro was still frowning at the door, but when he saw me the frown went out of his face. He took my astrolabe, five years at sea, turned it over, held it to the window and squinted at it, then pressed his thumb on one mark of the scale. “A degree and a half out.” He looked up. “How did you ever make it back alive these past few years?”"

[tracks.reunion_pedro_luna.chapters.reunion.default]
effects = [{ text = "I’m sending this with someone headed for your ship. I hear you didn’t come back to Seville this year. The workshop door has a new coat of paint, and my name hangs over it now. I’ve finished my apprenticeship, and the first astrolabe I made, I signed. On the back it says “Pedro Luna made me.” When I got to the word “made,” my hand still shook a little. You’d have laughed. Isabel, the examiner’s granddaughter, the one who used to listen in from the back of our lecture room and drew coastlines better than anyone, comes by to borrow instruments and argue with me about the thirty-seventh degree. Three years now, and we still haven’t finished. She says my scales are stiff, I say her coastlines run wild. If you were here, you’d take her side for sure. I’m enclosing a scale table drawn after your astrolabe, one mark to a degree. The damp at sea is hard on brass, and after all these years I’d guess yours is at least a degree out. Don’t go at it with a file yourself. You can’t fix it; I know you’ll try. Everything’s the same here: the forge at daybreak, the sun at noon, carving at night until the lamp runs dry. I still haven’t been back to the river mouth. Beside the last mark on the table I wrote a few words. Turn it over and you’ll see them: Waiting for you to come back and recalibrate. Pedro" }, {}]

[tracks.reunion_pedro_luna.chapters.reunion.choices.friend]
text = "Stay, and finish calibrating the old astrolabe with him."
reply = "That day the workshop put its shutters up early. Pedro lit two lamps, took my astrolabe apart, and laid the brass plates out one by one on a piece of felt. He calibrated while I read him the figures I’d kept these years: where a storm had come up, where the noon sun had stood strangely low, the night I spent taking the pole star over and over where no land could be seen. After each stretch he nudged the scale a little, and the degree and a half came back bit by bit. Around midnight the last pin was tapped home. He held the astrolabe up to the lamp and suddenly went quiet. “What is it?” “The sea this thing has crossed with you,” he said, “is farther than I’ll go in my whole life.” He put it back in my hands, then pushed his signed one over and set it beside it. “Next time you sail, take both. When you’re back, we calibrate them together.”"
effects = [{}, {}, {}, { title = "A New Astrolabe in the Workshop" }]

[tracks.reunion_pedro_luna.chapters.reunion.choices.rival]
text = "Challenge him: noon tomorrow on the riverbank, whose reading is truer."
reply = "At noon the next day a ring of new pupils from the House of Trade gathered on the riverbank. Word had gone around that the newly qualified craftsman from the astrolabe workshop was taking on someone back from five years at sea, and even an orange seller set down his baskets to watch. The moment the sun stood highest, I called my reading first; Pedro was a few moments slower, and half a degree truer. Exactly like that day under the Giralda. We looked at each other and burst out laughing at the same time. The apprentices hollered to know who’d won. Pedro tucked his astrolabe under his arm. “Nobody. We’ll go again next year.” Walking off beside me, he lowered his voice. “Those few moments you’re faster by can save a life at sea. My half a degree is only any use on land.” Then he put on a stern face again. “If you’re still half a degree behind me next year, I won’t go easy.”"
effects = [{}, {}, {}, { title = "A New Astrolabe in the Workshop" }]

[tracks.reunion_pedro_luna.chapters.reunion.choices.love]
text = "Ask him to come on my next voyage: I’ll watch the sea for him, he’ll watch the scale for me."
hint = "You look at the old astrolabe, and there are words on your lips—unsaid back then, and still unsayable now."
reply = "Pedro didn’t answer right away. He turned my old astrolabe over, and his thumb found the short line on the outer rim of the back. Five years, and it was still there, worn bright by the sea wind. “Places where you can’t see land,” he said. “I’m still afraid of them.” “I know.” “Out there I might not be able to say a word. I might curl up against the rail with the compass, the way I did that year at the river mouth.” “Then I’ll call the readings for you. You just watch the scale.” He was quiet a long time. Outside someone was crying for scrap brass, the voice fading and coming back. Then he reached over and took my hand, as hard as he had that day at the workshop door, except that this time he didn’t let go. “With you there,” he said, “there’ll always be one mark that lines up.” He leaned in and kissed me. His lips were a little dry and tasted of rosin. Afterward he didn’t pull away. He rested his forehead against mine and said quietly, “You still haven’t said those words, you know.”"
effects = [{}, {}, {}, { title = "A New Astrolabe in the Workshop" }]

[tracks.reunion_pedro_luna.chapters.reunion.variants.kept_a_mark]
text = "In 1562 I came back to Seville. My baggage was still on the quay when I crossed the bridge to Triana. The workshop door had a fresh coat of paint, and over it hung a small wooden board carved with Pedro’s name. He had finished his apprenticeship. As I walked in, a young woman was on her way out with a quadrant in her arms, calling over her shoulder, “The thirty-seventh degree—measure it again yourself tomorrow!” It was Isabel, the examiner’s granddaughter, who used to hide at the back of our lecture room and listen in; by the look of it she was a regular here now. In the middle of the bench sat a new astrolabe, with a line of small letters cut on the back: Pedro Luna made me. When Pedro saw me, the file in his hand dropped onto the bench. He took my astrolabe, five years at sea, and didn’t look at the face. He turned it over first, and his thumb found the short line on the outer rim and rested there a moment. He said nothing. Only then did he turn it back, hold it to the window, and squint. “A degree and a half out.” His voice was a little hoarse. “How did you ever make it back alive these past few years?”"

[tracks.reunion_pedro_luna.chapters.reunion.variants.the_wager]
text = "In 1562 I came back to Seville. My baggage was still on the quay when I crossed the bridge to Triana. The workshop door had a fresh coat of paint, and over it hung a small wooden board carved with Pedro’s name. He had finished his apprenticeship. As I walked in, a young woman was on her way out with a quadrant in her arms, calling over her shoulder, “The thirty-seventh degree—measure it again yourself tomorrow!” It was Isabel, the examiner’s granddaughter, who used to hide at the back of our lecture room and listen in; by the look of it she was a regular here now. In the middle of the bench sat a new astrolabe, with a line of small letters cut on the back: Pedro Luna made me. The first thing Pedro said when he saw me was, “The bet still stands, right? I’ve been down on the riverbank at noon every day for years.” He took my astrolabe, five years at sea, held it to the window, squinted, and pressed his thumb on one mark of the scale. The smugness drained out of his face. “A degree and a half out.” He looked up. “How did you ever make it back alive these past few years?”"
