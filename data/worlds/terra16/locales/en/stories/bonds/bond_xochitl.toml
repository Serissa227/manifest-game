# 霍奇特尔：大十倍（bond_xochitl / reunion_xochitl）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C7 重写，2026-10-12，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 专名：Xochitl、Ix Nikte'、María（学校名册上的名字）、Inés、Ana de la Cruz、Mérida、San Cristóbal、Cozumel、Mexico City、Tenochtitlan、
#       Montejo、Molina、Gaspar Antonio Chi、Xicalango、Veracruz、Texcoco、San Juan。嬷嬷照人物覆盖层译作 duenna。
# 那瓦特语：诺克纽 = nocniuh，诺克纽钦 = nocniuhtzin（与人物覆盖层的称呼一致）。Ix Nikte' 的喉塞撇号照专名写法用直撇号，其余用弯的。
# 口头禅：“What’s this? Mexico City’s is ten times bigger.”——只在 c1 正文用一次；a2、s own 与重逢换说法呼应。

[tracks.bond_xochitl]
name = "Xochitl: Ten Times Bigger"

[tracks.bond_xochitl.chapters.c1]
title = "Ten Times Bigger"
text = "When catechism let out, the girls crowded onto the steps of the convent forecourt to wait for someone from home. One girl with her hair in Nahua braids stood on the very top step, pointed out the gate at the great plaza, and told the little crowd around her, “What’s this? Mexico City’s is ten times bigger.” In her other hand she was clutching a green feather so hard the quill had bent. Someone asked where it came from. She said she’d snatched it from a parrot seller at the bird market, paused, and corrected herself: “Fine. Found it.” I had only just come from Cozumel, and I still tripped over the “María” they had put on the register for me. I said the temples on Cozumel were older than every church in Mérida put together. The steps went quiet. She looked down at me from the top step and narrowed her eyes. “Country girl?” “Island girl.” She glared at me, and I glared back. The duenna rang the bell at the gate twice. She didn’t move, and neither did I."

[tracks.bond_xochitl.chapters.c1.choices.how_many_streets]
text = "Ask her: how many streets does the market in Mexico City have, exactly?"
reply = "“Twenty,” she said, without missing a beat. Before I could open my mouth she changed it: “Thirty.” I just looked at her, so she made it forty, and then went red at her own number and started smoothing the green feather against her palm. “Lots, anyway. More than you could walk in a day.” I said all right, I believed her. She gave me a suspicious sidelong look, as if she couldn’t decide whether to be pleased, and on her way down the steps she made a point of walking around me."

[tracks.bond_xochitl.chapters.c1.choices.brag_back]
text = "Brag back: my family’s canoe has put in at more ports than she has streets."
reply = "She wouldn’t have it, so we counted them off one by one—her streets in Mexico City, my landings along the coast, from Xicalango all the way to the river mouths in the Gulf of Honduras. By the time the sun was slanting, neither of us would stop first. At last she lifted her chin. “And do any of those ports of yours have a feather market?” I thought about it and said no. She was smug about it for the rest of the evening, and even turned around outside the convent gate to wave the feather at me."

[tracks.bond_xochitl.chapters.c2]
title = "The Light in a Feather"
text = "Xochitl’s family lived in the San Cristóbal quarter on the west side of town, and their courtyard was lined with drying trays. Her mother had taken on a job sorting a whole basket of feathers by grade, and Xochitl caught me at the convent gate. “Your hands aren’t busy, are they? Come help.” She said it like she was doing me a favor. I sorted by size, big ones here, small ones there, and went fast. She watched for a while until she couldn’t stand it, then picked a hummingbird feather out of my pile, held it up to the sun by the quill, and turned it slowly. From one side it was green, like a leaf after rain. A little turn and it went purple. Another, and it glowed red as a coal. “What good is size?” she said. “My mother’s whole craft is setting every feather at the angle where it shines brightest. Set it a little crooked and it’s a dead feather.” Her mother coughed inside the house. Xochitl lowered her voice, dropped the feather back in the basket, and added, “Even people in Mexico City can’t always do that.”"

[tracks.bond_xochitl.chapters.c2.choices.sort_by_light]
text = "Ask her to teach me to sort by light, and stay until the basket is done."
hint = "She pulls the basket a little closer to her side. She isn’t ready to let a Maya girl from the island touch her mother’s feathers."
reply = "She refused at first, then gave in and taught me with her fingers around my wrist: which way the quill points, which side you look from, where in the turn you stop. We sorted from midafternoon until sunset, and the shadow of the courtyard wall crept from one side to the other. At the end there was a small pinch of feathers whose color I couldn’t settle no matter how I turned them, so I tried them one at a time until it was nearly dark. She tied that pinch with thread and pressed it into my hand. “Those were the hardest. You sorted them, so you keep them.” Her mother came out to bring in the trays, glanced at what I was holding, and gave Xochitl a nod."

[tracks.bond_xochitl.chapters.c2.choices.ask_her_mother]
text = "Ask her who taught her mother the craft."
reply = "“My grandmother.” Her hands kept moving. “And Grandmother learned from hers, and on back, all the way to when Mexico City was still called Tenochtitlan.” She said the old name so softly I almost missed it, and her eyes flicked toward the courtyard wall. Then she was loud again, waving a feather at me. “So don’t sort them any old way. Plenty in this basket were put by in Grandmother’s day. They’re older than you are.”"

[tracks.bond_xochitl.chapters.b1]
title = "The Torn Sleeve"
text = "The Sunday market was packed. I was haggling at a salt stall when I heard jeering. Three or four Spanish boys had made a ring, and in the middle of it stood Xochitl with a skein of cotton thread she’d just bought. The ringleader had her by the sleeve and was yanking it. “Dance for us, Indian girl.” She went off like a powder keg and threw the thread down. “My father marched into Yucatán with Montejo himself!” The boys only laughed harder. The sleeve gave with a loud rip, torn open from the shoulder, and the band her mother had embroidered drooped loose. One of them jerked his chin my way. “Look, there’s another one over there.” Every day in the convent forecourt Xochitl liked to go on about the “country Maya,” about how her family was different from us. To these boys, there was no difference at all. She had heard it too. She stood there gripping the torn sleeve, all the swagger gone out of her face, like a bird somebody had plucked in the street."

[tracks.bond_xochitl.chapters.b1.choices.stand_beside]
text = "Walk over, stand beside her, and run them off in Castilian."
hint = "She sees you first and turns her face away at once. She still doesn’t want a Maya girl seeing her like this."
reply = "I set my bag of salt on the ground, went and stood next to her, and in the Castilian I’d learned at the convent asked the ringleader, spacing out every word, whether his father knew he spent Sundays tearing girls’ sleeves in the market, and whether I should ask the friars to find out. They swore a little and scattered. Xochitl didn’t say thank you. She bent to pick up her thread and took a long time about it; the skein was already gray with dirt. “They can’t tell me from you,” she said to the thread. “Then they’re blind.” Only then did she look up. Her eyes were red, but one corner of her mouth twitched upward."

[tracks.bond_xochitl.chapters.b1.choices.mend_sleeve]
text = "Say nothing, wait for them to leave, then crouch down and sew up her sleeve."
reply = "I borrowed a needle from the old woman at the salt stall and pulled the thread from Xochitl’s own skein. My stitches were thick and crooked, and the mended tear looked like a centipede crawling across her shoulder. Xochitl stared down at it for a long time. “So this is the best Maya needlework can do.” But for a whole month afterward she wore that huipil to catechism with the centipede on her shoulder. When anyone laughed, she tipped her face up and said, “I like it this way.”"

[tracks.bond_xochitl.chapters.b2]
title = "Molina’s Dictionary"
text = "In 1555 a new book arrived at the convent. Gaspar Antonio Chi brought it back from Mexico City: a Nahuatl dictionary fresh off the press, compiled by the Franciscan Fray Molina, Castilian on one side and Nahuatl on the other, thick as a brick. The friars passed it around the forecourt, and someone called Xochitl over to read a few words. She kept her hands behind her back. “I don’t need a dictionary. I was born knowing it.” That day I stayed late helping air out the convent’s books. As I went along the cloister, I saw someone crouched behind a pillar with that brick open on her knees, reading by moonlight one word at a time, slowly, her lips moving. It was Xochitl. She heard my footsteps and snapped the book shut, looked up, saw it was me, and slowly opened it again. In the moonlight I couldn’t tell if she was blushing. She kept her eyes on the page. “How do you say ‘friend’ in your language?”"

[tracks.bond_xochitl.chapters.b2.choices.trade_the_word]
text = "Tell her the Maya word for “friend” and trade it for the Nahuatl one."
hint = "She hugs the book to her chest and says you’ve got the wrong person. She doesn’t want you knowing she sneaks looks at the dictionary."
reply = "I told her the Maya word. She said it after me three times, and only the third time did it stop sounding like a prayer. When it was her turn she hesitated a long while before she said, “Nocniuh.” Mine came out sounding like a sneeze, and she laughed out loud, then clapped a hand over her mouth so she wouldn’t wake the friars. “That word,” she said, “I only say to people who matter. Don’t go throwing it around.” Then she shoved the brick into my arms, hitched up her skirt, and ran. She was at the far end of the cloister before she remembered to turn around. “Give it back to the friar for me tomorrow!”"

[tracks.bond_xochitl.chapters.b2.choices.pretend_not_see]
text = "Pretend I didn’t see, and go around by the other end of the cloister."
reply = "The next day she stopped me in the forecourt, looking anywhere but at me, and said very stiffly, “That dictionary has a lot of mistakes in it.” I said then she should go help Molina fix them. She blinked, then burst out laughing. “He’s in Mexico City. Where am I supposed to find him?” When she was done laughing she put her hands behind her back and added under her breath, “Page three hundred twelve. One of the words is printed backward.”"

[tracks.bond_xochitl.chapters.a1]
title = "The Cenote"
text = "An hour’s walk east of town there was a cenote. Part of the cave roof had fallen in, and sunlight dropped straight through the hole onto the water, which was deep blue and had no bottom you could see. Island children grow up soaking in water like that. The moment we reached the mouth of the cave I pulled off my overdress, climbed down the tree roots, pushed off the ledge, and jumped. The cold made me gasp. I came up, wiped my face, and called for her to come down. Xochitl stood on the ledge above without moving, her face as white as the convent wall. “Come on down.” “I can watch from here.” “It’s cooler in the water.” Her hands had bunched her skirt into creases. It took her a long while to get it out: “I’m scared of deep water. I always have been.” Then, quickly: “The lake in Mexico City is shallow. It only comes up to your waist. Who needs to swim?” The cave wall threw “shallow” back at us, and it sounded surer of itself than she did. I swam to the foot of the ledge and held my hand up to her."

[tracks.bond_xochitl.chapters.a1.choices.hold_her_hand]
text = "Take her hand and help her ease her feet into the water, a little at a time."
hint = "She draws back half a step. You aren’t close enough yet for her to put her hand in yours."
reply = "She crouched down and gave me her hand, and gripped so hard her nails dug into the back of mine. Her toes touched the water first and she hissed; then her insteps, her ankles. And there she sat on the ledge, both feet in the deep blue, refusing to go an inch farther. I held onto the rock and stayed in the water beside her. My hand ached from her grip, and I didn’t pull it away. The patch of sunlight moved from the roof to the cave wall. She was watching her feet turn pale and far away under the water when she said, out of nowhere, “You Maya have some nerve.” The cave carried it around several times before it gave it back."

[tracks.bond_xochitl.chapters.a1.choices.never_been]
text = "Ask her quietly: have you ever really seen the lake in Mexico City?"
hint = "Her “shallow” is still ringing off the cave walls. That question would cut too close; your friendship can’t take it yet."
reply = "She said nothing. She watched the water, where the patch of light from the roof was trembling. It was so long that I thought she wasn’t going to answer at all. Then she said, “No. Not once.” She told me she was born on the march. In the years her father was fighting his way into Yucatán with Montejo, her mother carried her on her back. The streets of Mexico City, the lake, the markets—all of it was her mother’s telling. Then she buried her face in her knees, and her shoulders started to shake. I climbed out onto the ledge and sat beside her, dripping, without a word, and waited for her to lift her head on her own."

[tracks.bond_xochitl.chapters.a1.choices.swim_for_her]
text = "Don’t push her to come in. Dive to the deepest part and see what’s down there for her."
reply = "I took a deep breath and dove. The blue turned black and my ears ached with the pressure, and only when my hand found a cold stone did I start back up. When I broke the surface, Xochitl was lying flat on the ledge with tears all over her face, shouting my island name—Ix Nikte'. I had no idea when she’d learned it. “There’s nothing down there,” I panted. “Just a rock.” “You lunatic!” She scrubbed at her face. “You Maya are all lunatics.” And then she was the first one laughing."

[tracks.bond_xochitl.chapters.a2]
title = "A Drawstring Changed Twice"
text = "When Xochitl pushed the little pouch into my hands, she looked off to one side, as if it were too hot to hold. It was no bigger than my palm, coarse cotton, with a hummingbird stitched on it, and the hummingbird’s body was laid with real feathers—scraps left over from her mother’s work, overlapped one by one, so that when you turned it in the sun it went from green to purple. The drawstring was blue. I had seen this pouch twice in her courtyard: last month on a red string, a few days ago on a yellow one. She had never once asked me what color I liked. Inside was a pinch of copal; held under my nose, it smelled of pine resin and smoke. “That old man who sells incense at the market,” she said. “I wore him down for three days.” She stopped. “Take it, noc—” She swallowed the rest and said instead, “Just take it, and don’t ask so many questions.”"

[tracks.bond_xochitl.chapters.a2.choices.take_pouch]
text = "Take the pouch, and ask her how she knew I liked this blue."
hint = "She closes her fist around the pouch again. It’s too heavy a thing, and you aren’t close enough yet for her to hand it over."
reply = "“In the cenote,” she said, “that’s the blue you kept looking at. Coming up and going down.” Then she turned on her heel and left, braids swinging high, and only after a dozen steps did she turn around and shout, “Don’t wear it on the outside! If anyone sees one of my hummingbird’s wings is crooked, I’ll never live it down!” I looked. The left wing was a little crooked. I wore it on the outside."
effects = [{}, {}, {}, { title = "A Drawstring Changed Twice" }]

[tracks.bond_xochitl.chapters.a2.choices.say_nocniuh]
text = "Take the pouch, and finish the word for her: “Nocniuh.”"
hint = "The word reaches your lips and you swallow it. It’s too soon to call her that."
reply = "She froze. The red started at her ears and climbed, little by little, all the way to her forehead. At last she managed, “You’re saying it wrong.” “Then teach me again.” “…Nocniuh.” “Nocniuh.” “Still wrong. Again.” I said it again, and again. She corrected me every time, until in the end she stopped correcting and just kept asking me to say it. Only when the convent bell rang did she pull the pouch’s drawstring tight for me, and tie it off in a hard knot."
effects = [{}, {}, {}, {}, { title = "A Drawstring Changed Twice" }]

[tracks.bond_xochitl.chapters.a2.choices.mexico_has_better]
text = "Tease her: is Mexico City’s pouch ten times bigger too?"
reply = "She glared at me and grabbed for it. I held it high out of reach. She tried twice and couldn’t get it, dropped her hand, and sniffed. “Mexico City doesn’t have one as good as this.” “Why not?” “Because I made this one.” Then she couldn’t keep a straight face and laughed out loud, and while I was laughing too she snatched the pouch right back. “You can have it when you stop making fun of me.”"

[tracks.bond_xochitl.chapters.s]
title = "Two Roads"
text = "Once December came, the convent rules grew tighter by the day. The new custodian had posted a whole list of them: girls were to go straight home after lessons and not linger in the forecourt; there was a roll call at Sunday Mass, and anyone who missed it spent a night on her knees in the cloister saying prayers. As soon as school let out I would be going home to Cozumel. Xochitl asked me to meet her under the ceiba outside the convent wall, and then, when she came, said nothing; she just squatted and scratched at the dirt with a twig. After a good while she told me she wanted to go to Mexico City and learn the trade in a featherwork shop—her cousin Ana kept one there. “But I can’t go yet.” I asked her why. She tossed the twig away and didn’t answer. Then she took a hummingbird feather out of her blouse, laid it on my palm, and held my wrist so I would turn it toward the sun: green, purple, red like fire. “When you go back to Cozumel,” she said, “bring me the colors of the sea. I want to see how many colors that sea of yours can really make.”"

[tracks.bond_xochitl.chapters.s.choices.promise]
text = "Make a pact: I bring her the sea’s colors, she tells me what home looks like from the workshop."
hint = "You only get to make a promise like this once. You could bring her the sea’s colors, but your friendship isn’t that deep yet—or you’ve already spent that once on someone else."
reply = "I said yes: every time I went to sea I would watch what color it was, note it down, and bring it to her. “Noting it isn’t enough,” she said at once. “You have to bring things. Shells, fish scales, anything you can hold up to the sun and turn.” “And you?” She thought a moment. “I’ll tell you about the workshop. What the feather paintings show, what the lake in the city is like, how much is left of the home my grandmother talked about. I’ll go look for you, and when I’ve seen it properly I’ll tell you every piece.” “Then you have to write.” “Then you have to come often. Cozumel is a long way from Mexico City.” “It is.” “Then I’ll wait for you.” She pressed the feather down into my palm. “However far it is.” She stood and brushed the dirt from her skirt, then squatted again, and in the scratched-up dirt she drew a long line with the twig, a circle at one end for Cozumel and a square at the other for Mexico City. “From here,” she tapped the circle, “to here. Remember it.”"
effects = [{}, {}, {}, {}, { title = "Two Roads" }, {}]

[tracks.bond_xochitl.chapters.s.choices.heart]
text = "Promise that when we meet again as grown women, I’ll say one thing to her face, in Nahuatl."
hint = "The words come right to your lips, but either you haven’t come that far together, or the one pact of your life is already promised to someone else."
reply = "The twig in her hand stopped. “What words?” “Not now,” I said. “When we’re grown and we see each other again, I’ll say it to your face.” “You don’t even speak Nahuatl.” “I’ll learn.” She stared at me and said nothing for a long while. I had seen that face of hers a few times—caught out, wanting to blow up and unable to—but this time it was different. She reached over and took the hand that held the feather, so the feather lay pressed between our palms. “Then I’ll learn something in Maya,” she said. “And I won’t tell you what. When the time comes, we’ll see who gets hers right.” The convent bell rang for evening, and the duenna called from the gate. We stood outside the wall until long after the bell had stopped, until it was dark, and she never let go of my hand. “If you say it wrong,” she said at last, “it doesn’t count.”"
effects = [{}, {}, {}, {}, {}, { title = "Two Roads" }, {}]

[tracks.bond_xochitl.chapters.s.choices.own]
text = "Make a bet: she takes her workshop, I take my sea, and in ten years we see who gives in first."
reply = "“Ten years?” She weighed the twig in her hand. “In ten years the pictures I make in Mexico City will be hanging in the viceroy’s palace.” “In ten years my canoe will be a real ship, loading cargo at Veracruz.” “The workshops in Mexico City,” she said, “are ten times bigger than your sea.” “The sea doesn’t have an edge.” That stopped her for a moment, then her eyes lit up. “Then ten times ten times bigger.” We went on matching each other under the ceiba, point after point, until we forgot what we were arguing about and just laughed. I said ten years was too long. “Then give in sooner,” she said. Finally she tucked the hummingbird feather into my hair. “That stays with you as a pledge. If you’ve given in by the time ten years are up, bring it back to me.”"

[tracks.reunion_xochitl]
name = "Xochitl: The Workshop Door"

[tracks.reunion_xochitl.chapters.reunion]
title = "The Workshop Door"
text = "In 1563 I came to Mexico City. It was even bigger than Xochitl had bragged all those years ago: the causeways ran across the lake right into the city, the canals were jammed with canoes, and you could walk all day without reaching the end. I asked three people in the lanes around San Juan before I found Ana de la Cruz’s featherwork shop. The door was open and the room was full of light, with half-finished pictures hung on the walls. Xochitl sat at the long table by the window, teaching a child of seven or eight to read feathers. She held the child’s wrist and had him turn a hummingbird feather toward the window. “This side, green. Turn it again—stop. That’s where it’s brightest. Remember that angle.” The child asked whether everyone in Mexico City could do this. “Not always,” she said, and looked up and saw me. She put down the feather, wiped her hands on her apron, and without a word led me into the back room. On the wall hung a feather picture: a hummingbird on a flowering branch, turning from green to purple in the light. “My first one of my own. Work for the shop only gets my cousin’s seal. I made this one at night, so it isn’t the shop’s.” Behind it a sheet of heavy paper served as a title page. In the lower right corner, where the signature goes, her name was written in Nahuatl, and beside it was an empty space."

[tracks.reunion_xochitl.chapters.reunion.variants.with_ines]
text = "In 1563 I came to Mexico City. It was even bigger than Xochitl had bragged all those years ago: the causeways ran across the lake right into the city, the canals were jammed with canoes, and you could walk all day without reaching the end. I asked three people in the lanes around San Juan before I found Ana de la Cruz’s featherwork shop. Xochitl sat at the long table by the window, holding a child’s wrist so he would turn a hummingbird feather toward the light. “This side, green. Turn it again—stop. Remember that angle.” At another table sat Inés, down from Mérida, writing Castilian labels on the backs of the pictures. Xochitl saw me and tipped her chin that way. “She came with me.” She said it proudly. Then she put down the feather and led me into the back room. On the wall hung a feather picture: a hummingbird on a flowering branch, turning from green to purple in the light. “My first one of my own. I made it at night, so it isn’t the shop’s.” Behind it a sheet of heavy paper served as a title page. In the lower right corner, where the signature goes, her name was written in Nahuatl, with a line of Castilian beneath it, and beside them was still an empty space."

[tracks.reunion_xochitl.chapters.reunion.default]
effects = [{ text = "Ix Nikte': The people at the workshop say a ship’s captain from the island came around San Juan this year asking after the featherwork shop—and asked “Where’s Xochitl?” and not “Where’s Ana?” Who else would have asked it that way? And of course those were the days my cousin and I had gone to Texcoco to buy feathers, and when we got back your ship was gone. I was so angry I knocked over a whole box of feather scraps, and Ana scolded me for half a day. Here is some news: I made it to Mexico City. The city is huge. Bigger than I ever bragged to you, I can’t count how many times bigger, and I’ve stopped counting. The lake is shallow. I’ve been in it, up to my knees, and I didn’t cry. I made my first picture, a hummingbird. On the title page, where the signature goes, I wrote my name, and there’s an empty space beside it. Guess who it’s for. There’s a hummingbird feather in this letter. Turn it toward the sun: from this side it’s green. From another angle it’s a different color. Which one, I’ll tell you to your face when you come. Next time, write first, and say which month you’ll arrive, so I can wait at the workshop door. I don’t want to knock over another box of feathers. —Xochitl" }, {}]

[tracks.reunion_xochitl.chapters.reunion.choices.friend]
text = "Write my Maya name beside her signature."
reply = "She handed me the pen, already inked. In the empty space I wrote Ix Nikte', and the mark at the end came out a little shaky. She leaned in and looked for a long time at my name and hers side by side on one page, one in her grandmother’s letters and one in my island’s. “This one,” she said, “isn’t for sale.” Ana called for her from the front room. She answered and didn’t move. That evening she shut up the workshop and walked me out of the city along a causeway to the lakeshore. The lake was shallow, gold and red under the setting sun. She took off her shoes, gathered her skirt, and waded in step by step, to her shins, to her knees. She stood in the water and looked back at me. “I’m not afraid of the water now. Shallow counts.” I took off my shoes and waded in beside her, and from my blouse I took a sliver of conch shell from Cozumel, so thin the light came through it, and set it in her palm. She turned it this way and that against the sunset. “So this is the color of the sea?” “One of them.” “Then the rest,” she said, closing her hand around the shell, “you bring me next time, one at a time.”"
effects = [{}, {}, {}, { title = "The Workshop Door" }]

[tracks.reunion_xochitl.chapters.reunion.choices.love]
text = "Say the Nahuatl words I have kept for seven years, to her face."
hint = "There’s a blank beside her signature. Under the silk-cotton tree you never promised her those Nahuatl words, and seven years on they’re still caught under your tongue."
reply = "She held out the pen, and I didn’t take it. I looked at her and said the words: “Nocniuhtzin.” For seven years I had said it aboard ship, to the sea, to the sails, until the crew thought I was praying. Xochitl’s hand, still holding out the pen, stopped in midair. Then her tears fell, one by one, onto her apron. “You’re still saying it wrong,” she said, in a voice I didn’t recognize. “Then teach me again.” “Not anymore,” she said. “First you listen to the Maya I learned.” And she said it. She said it slowly, and the little catch of breath in the middle wasn’t quite in the right place. I laughed, and she laughed, crying and laughing at once. Then she came to me, took my face in her hands, and kissed me. In the front room Ana was haggling with a buyer; out on the canal someone was calling for a boat; on every wall the feathers changed color, one by one, in the light. When she let me go, her face was still wet. She picked up the pen and beside her Nahuatl name wrote mine, slowly. When she finished she pressed the pen into my hand. “Now you write mine. The way your island writes it.”"
effects = [{}, {}, {}, { title = "The Workshop Door" }]
