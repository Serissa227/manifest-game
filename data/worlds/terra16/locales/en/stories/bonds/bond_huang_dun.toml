# 黄墩：最后一块点心 / 开海后的饭桌（bond_huang_dun、reunion_huang_dun）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、回忆标题、来信、变体），玩法字段一律不写。
# 2026-10-12 C7 重写，与中文同一轮写完；美式拼写、弯引号。“林兄”译作 Brother Lin。来信里的三个错字在英文里换成三个拼错的词（tabel、crue、seet）。

[tracks.bond_huang_dun]
name = "Huang Dun: The Last Cake"

[tracks.bond_huang_dun.chapters.c1]
title = "The Last Cake"
text = "Between lessons at the community school, with the teacher off drinking his tea, the room plays at matching couplets. The youngest Cai boy can’t find a match for “Yuegang tide” and gets stood by the door, his face screwed up like salted greens left in the sun. Huang Dun fishes a mung-bean cake out of a paper bag and pops it into the boy’s mouth. “Even if the sky falls, we eat first. Quit crying—next time you can match one for me.” The Cai boy nods hard around the cake, tears still hanging off his chin. I’m holding a rice cake my mother pushed on me this morning, and I lean over. “Ah Dun, aren’t you having any?” “Already ate.” He slaps his belly so it booms. He stuffs the bag up his sleeve; its mouth hangs open, and there isn’t a crumb left inside. This morning, passing the cake shop at the corner, I saw him out front counting his coppers twice over. They came to one cake. He catches me looking and folds his cuff over. “What are you staring at, Brother Lin? Want some? All gone.”"

[tracks.bond_huang_dun.chapters.c1.choices.bring_two]
text = "Bring two mung-bean cakes tomorrow, one big, one small, and let him pick first"
reply = "Next day I set two mung-bean cakes on his desk. “You pick.” He takes the big one, thinks, swaps it for the small one, swaps back, and finally breaks both in half. “Half each. That’s fair.” We squat in the corridor and eat them, and he licks his fingers and looks me up and down. “Brother Lin, you’re all right. Just too skinny. Tomorrow I’m bringing dried tofu.”"

[tracks.bond_huang_dun.chapters.c1.choices.say_full]
text = "Lie that I’ve eaten too, and push my rice cake at him"
reply = "“I’ve eaten too. I’m stuffed.” I shove my rice cake into his hand. He won’t take it; he squints at my stomach. “That’s no Yuegang lie. When a Yuegang man lies, his belly puffs out first.” He breaks the cake and forces the bigger half back on me. “Liars need to eat more, or their brains slow down.” His own half is gone in one bite, and then he picks the crumbs off the desk one by one and eats those too."

[tracks.bond_huang_dun.chapters.c2]
title = "Count the Meals First"
text = "In early summer the teacher writes a sum up on the board: “One ship, Yuegang to Luzon, seventy days there and back, twenty crew. What does one voyage cost?” Then, lowering his voice: “This question doesn’t leave the room.” The whole class laughs; every family here has a share in some ship or other. My classmates start their first line with cargo—so many piculs of sapanwood, so many of pepper, so many catties of raw silk. Huang Dun’s first line reads: “Rice. Twenty men, seventy days, a pint and a half a day each.” I lean over and laugh at him. “Ah Dun, even when you cost a ship you start with food.” He puts down his brush and points at the board. “Read it properly. Seventy days. Leave out one day’s rice and that’s twenty men going hungry. Hungry men don’t pull on the oars, and when the wind comes they’re slow getting the sail in. Carry all the cargo you like—if the ship doesn’t get there, it’s for nothing.” He says it too loudly, and the teacher coughs up front. Huang Dun ducks his head and adds another line to his draft: “Pickles.”"

[tracks.bond_huang_dun.chapters.c2.choices.redo_meals]
text = "Redo the whole account with him: everyone’s food first, then the cargo"
hint = "He balls up his draft and stuffs it in his sleeve. You don’t know each other well yet, and he’s afraid you’ll keep laughing."
reply = "We follow his draft and start with food, line by line: rice, pickles, firewood, fresh water, then cargo, and profit last of all. When we total it, our voyage costs a tenth more than anyone else’s. We hand it in and the class laughs at how dear we’ve made it. The teacher goes over it twice, marks it “Excellent,” and writes a small line underneath: “With no food aboard, cargo is not cargo.” Huang Dun is so pleased with himself that the moment lessons end he drags me down to the harbor mouth for noodle soup, a bowl each. When he pays, he says, “This bowl goes on the next voyage’s costs.”"

[tracks.bond_huang_dun.chapters.c2.choices.tease_glutton]
text = "Laugh at him for thinking about food even when he’s costing a voyage"
reply = "“Are you costing the ship’s voyage,” I ask, “or your own snack money?” He doesn’t mind at all; he tucks his brush behind his ear. “What’s wrong with thinking about food? A man is iron, and rice is steel.” He hands the draft in anyway and gets a “Fair.” After class he pulls a packet of roasted peanuts out of his sleeve and pushes it at me. “You talk too much. Eat more. With your mouth full, you won’t have time.”"

[tracks.bond_huang_dun.chapters.b1]
title = "He Doesn’t Hide When He Loses"
text = "In autumn the school holds an abacus contest. The teacher reads a sum, we all flick beads, and whoever calls the right answer first takes the point. The last one: “Thirty shi of rice at five qian a shi, freight plus one. How much silver?” I call “sixteen taels five qian.” Huang Dun calls “sixteen taels.” The teacher says I’m right. That settles the standings: I’m first, he’s sixth. Afterward the losers all steer clear of the winner, but he plants himself right across from me with his scratch paper. “Brother Lin, show me where I went wrong. I did it three times and got sixteen every time.” His paper says: “Freight plus one—one tael more.” I tell him “plus one” means one tenth more. He glares. “When my father haggles with a shipmaster, ‘plus one’ means one tael extra. Where’s the tenth come from?” We copy both workings side by side on one sheet. Both hold up; the only difference is a single word the question left out. He stares at the sum a long time, then suddenly laughs. “This question’s more muddled than I am.”"

[tracks.bond_huang_dun.chapters.b1.choices.ask_teacher]
text = "Take the sheet and go with him to ask the teacher what the question meant"
reply = "The teacher reads the question through twice, strokes his beard, and admits a word was left out—“tenth.” Huang Dun asks whether the standings will change. The teacher says no; it was a contest, and it was decided on the spot. Huang Dun thinks it over. “Fine, leave them. Fix the question, that’s enough, so next year nobody gets cheated like me.” The teacher really does write the missing word in under the sum. Outside, Huang Dun digs a sesame candy out of his sleeve and breaks off most of it for me. “You came along to ask. That’s a real friend.”"

[tracks.bond_huang_dun.chapters.b1.choices.rematch_abacus]
text = "Challenge him to another round, and this time we set the questions ourselves"
reply = "Every question he sets is about food. “How many oysters in a catty?” “How many strands in a bowl of noodles?” “Ten rice dumplings split three ways—who gets the one left over?” I can’t answer a single one. He calls out the answers as he flicks the beads, and winning isn’t enough: he uses the abacus as a clapper and rattles out a whole nanyin tune, loud enough that the teacher next door sticks his head out. As for that last question, he says the leftover dumpling goes to whoever set it."

[tracks.bond_huang_dun.chapters.b2]
title = "The Ship Didn’t Come Back"
text = "That summer the news reaches the docks first: raiders caught the Huang ship off Wuyu, stripped the cargo, and burned her half through. All that drifted home was one plank with “Huang” carved in it. Not one of the crew came back. Huang Dun misses lessons that afternoon. At dusk he’s standing at our door holding a rice cake, crushed to powder in his fist, the crumbs sifting through his fingers. He doesn’t eat it. “Brother Lin,” he says, hoarse, “you know more characters than me. Help me ask around.” I expect him to ask about the cargo, the ship, how much his family has left. The first thing out of his mouth is: “Is Ah Fu still alive?” Ah Fu poled for the Huang ship—nineteen years old, a finger missing on his left hand, always bringing Huang Dun a bag of dried sweet potato back from every voyage. “Ah Fu can’t write,” Huang Dun says. “If he’s alive, he can’t send a letter home. Someone has to go asking.” Then he looks down at the crumbs in his hand, as if he’s only just remembered what he’s holding."

[tracks.bond_huang_dun.chapters.b2.choices.write_letters]
text = "Light a lamp and help him write inquiry letters to every harbor, one after another"
hint = "He whisks the paper behind his back and says he can manage. His hand is shaking, and he isn’t ready to let you see that."
reply = "We light an oil lamp and write from Zhangzhou to Quanzhou, from Nan’ao to Jinmen, one letter for every place a ship puts in: “Ah Fu, crewman of the Huang house, nineteen, one finger missing on the left hand. Whoever sees him, please write to the Huangs at Yuegang.” He dictates and I write, and by the seventeenth letter the roosters are crowing. He folds the last one and seals it with rice paste, and only then opens his hand and eats the crushed cake, bit by bit, very slowly."

[tracks.bond_huang_dun.chapters.b2.choices.ghost_story]
text = "Tell him a ghost story to take his mind off it"
reply = "I tell him about the drowned ghost off Wuyu that hunts for a stand-in at night and grabs swimmers by the ankle. Halfway through I’ve given myself gooseflesh, and he grabs me by the collar. “You’re telling me this now?” He’s still cursing me when the tears come, and he cries until his whole face is wet. When he’s done he wipes it on his sleeve. “That’s better. You tell it horribly.” That night he sits at the lamp and writes the letters himself, leaving the wrong characters uncorrected. He writes five."

[tracks.bond_huang_dun.chapters.a1]
title = "The Night Porter"
text = "After the new year, word goes around the docks of a “sack ghost”: in the dead of night a shadow carries sacks, trip after trip, without a sound, and is gone by daybreak. I’m more afraid of ghosts than anything, and the more scared I am, the more I want to look. So one night I go out with a handful of salt in my fist, because people say salt drives ghosts off. A sugar boat has just tied up behind the warehouse, torches jammed into the pilings. The shadow comes down the gangplank with a sack of sugar on its shoulder and steps into the light. It’s Huang Dun. He’s stripped to the waist, with a cloth folded over his shoulder, worn shiny, the skin under it rubbed raw. The foreman yells from the side, “Huang boy! Forty sacks to go, done by daybreak, a copper a sack!” His family’s ship is gone and the debt to the cargo owners isn’t paid, and nobody at school knows he pays it off here at night, a sack at a time. “Got it,” he grunts back, turns, sees me, and freezes. The sack slides on his shoulder and he catches it with a hand. “Brother Lin…” he finally gets out. “What are you doing on the docks at midnight?” The salt in my fist has gone damp."

[tracks.bond_huang_dun.chapters.a1.choices.carry_too]
text = "Say nothing, shoulder another sack, and haul with him until dawn"
reply = "I stuff the salt in my pocket and heave up a sack. The first one nearly flattens me. He swears at me for showing off, then shifts the sack on my shoulder. “Here, against the bone. Walk with your hips, not your neck.” At dawn we sit on the stone steps of the dock while he counts his coppers. “Built like you are, you can’t carry many.” “Nine.” I hold up nine fingers. He counts out nine coppers and pushes them at me. I won’t take them, so he forces them into my palm. “A friend takes his share. Turn it down and you’re looking down on me.”"

[tracks.bond_huang_dun.chapters.a1.choices.look_away]
text = "Pretend I never saw, walk off, and leave a bowl of savory congee on his desk tomorrow"
reply = "I turn and go, and don’t look back all the way home. Early next morning I bring a bowl of savory congee from our kitchen, with dried shrimp in it, set it on his desk, and go back to my own seat to recite. He comes in, looks at the congee, looks at me, and slurps it to the bottom. After lessons he stops me at the door. “Brother Lin. Thanks.” “For what?” “The congee.” “What congee?” He blinks, then bursts out laughing. It’s the first time I’ve heard him laugh since his family’s ship was lost."

[tracks.bond_huang_dun.chapters.a2]
title = "A Packet of Sesame Cakes"
text = "The school closes for good at year’s end, the recitations in the hall get thinner by the day, and everyone is planning what comes after. The cloth on Huang Dun’s shoulder has been replaced with a new one. He hasn’t mentioned hauling sacks again, and I haven’t asked. Today after lessons he shoves an oilpaper packet into my arms—heavy, and still warm. “Sesame cakes. My mother made them,” he says. “You should always have something to eat when you go out.” I weigh it in my hands. “This many? I couldn’t finish them by New Year.” “They’re not all for you.” He counts on his fingers. “Meet someone hungry on the road, give him one. Someone turns up after, give him another.” He stops there and scratches the back of his head. “But keep enough for yourself. You always give the good stuff away and you’re thin as a bamboo pole.” The hemp string is wound twice around the packet, and the knot is big and clumsy. Anyone could tell he tied it himself."

[tracks.bond_huang_dun.chapters.a2.choices.take_cakes]
text = "Take the cakes, open them right there, and eat one in front of him"
hint = "You reach for the string and he slaps a hand over the packet. “Eat them at home!” Opening his cakes in front of him is more than the two of you are ready for."
reply = "I undo the string on the spot, grab a cake, and bite in, scattering sesame down my front. The pastry is flaky, and the sugar and lard inside are still soft. He watches me chew, more nervous than I am. “Good, right? My mother made them. She says the ones in the shops are a swindle.” I tell him they’re good. That cheers him right up, and he slaps me on the back so hard I nearly drop the cake. “Next time you go out, come by our house and take some. My mother makes them a whole basket at a time.”"
effects = [{}, {}, {}, { title = "A Packet of Sesame Cakes" }]

[tracks.bond_huang_dun.chapters.a2.choices.split_cakes]
text = "Count out half right there and push it back to him"
reply = "I open the packet, count out half, and push it back. He shrinks away. “Who gives back half a present?” “A friend does,” I say. He glares at his half and mutters something, but in the end he takes it. “Then this half is a loan.” He pulls a brush out of his sleeve and actually writes on the oilpaper: “Owed to Brother Lin: six sesame cakes.” He laughs at it before I do."

[tracks.bond_huang_dun.chapters.a2.variants.known]
text = "The school closes for good at year’s end, the recitations in the hall get thinner by the day, and everyone is planning what comes after. Since what happened in the seventh month, Huang Dun has been dodging me for days. Today after lessons he finally blocks my way at the door. He opens his mouth—“Lin…”—and sticks there, going red in the face, until at last he gives up. “Forget it. I’m still calling you Brother Lin. I’m used to it.” Then he shoves an oilpaper packet into my arms—heavy, and still warm. “Sesame cakes. My mother made them. You should always have something to eat when you go out.” I weigh it in my hands. “This many? I couldn’t finish them by New Year.” “They’re not all for you.” He counts on his fingers. “Meet someone hungry on the road, give them one. Someone turns up after, give them another.” He stops there and scratches the back of his head. “But keep enough for yourself. You always give the good stuff away and you’re thin as a bamboo pole.” The hemp string is wound twice around the packet, and the knot is big and clumsy. Anyone could tell he tied it himself."

[tracks.bond_huang_dun.chapters.s]
title = "Mind Your Own Ships"
text = "In the twelfth month the north wind snaps the flags along the docks. A notice on the school gate says there will be no lessons come spring. Huang Dun is shipping out with his uncle. His family has one ship left, so old the planks are crusted with barnacles, and today she sails for Nan’ao. He stands by the gangplank holding an oilpaper packet, gripping it tight. “My uncle says from now on I keep the ship’s accounts,” he says. “First line, I’m still writing food.” I tell him if he dares leave out the food, I’ll chase him from Yuegang to Nan’ao to give him an earful. He laughs, then stops laughing, and looks at the ship, and then at me. “Brother Lin, next time we meet, we have a contest. Loser picks the snacks.” “Isn’t picking the snacks the winner’s job?” “Loser picks,” he says, very serious. “Losing feels bad. You pick something you like to eat, and then you’re fine.” Someone on the ship calls his name. He doesn’t move. He’s waiting for my answer."

[tracks.bond_huang_dun.chapters.s.choices.promise]
text = "Promise that the day his ship comes home, we lay a table on the Yuegang docks and seat the crew first"
hint = "A promise like this can be made only once in a life. Either the two of you haven’t come that far yet, or you’ve already given these words to someone else. This time all you can say is fair winds."
reply = "“Done.” He wipes his hand on his jacket and slaps my palm. “The day the ship comes back, we lay a table on the docks. First bowl goes to Ah Fu—if he’s come back. If he hasn’t, he still gets a bowl and chopsticks.” I ask who’s paying for this feast. “Me.” “With what money?” “I’ll have it by then.” He slaps the side of the old ship, and a dried barnacle falls off. “Loyalty talks loudest on a full stomach. Anything said on an empty one doesn’t count. That table is where I keep my word.” Someone on deck calls again. He jumps onto the gangplank, gets halfway, and turns. “You mind your family’s ships too! If you’re late, you pick the snacks!” I tell him only the loser picks. He’s already ducked into the hold, and I only hear him yelling from inside: “Then lose!”"
effects = [{}, {}, {}, {}, { title = "Mind Your Own Ships" }, {}]

[tracks.bond_huang_dun.chapters.s.choices.own]
text = "No promises: he minds his ship, I mind our family’s niaochuan, and we eat together when we meet"
reply = "“Let’s not make any promises,” I say. “You mind your ship, I’ll mind our niaochuan. We all have to eat. When we run into each other, we eat together.” He thinks about it and nods, looking almost relieved. “Fair enough. If I make a promise I’m afraid I can’t pay it off. My father made one years ago and he’s still paying.” He pushes the oilpaper packet at me: roasted peanuts, still warm. “For the road. Don’t share them. This time they’re just for you.” I tell him I don’t sail till spring. “Then save them for the boat.” He steps onto the gangplank and slips, and the men on deck roar. He gets his footing, turns, waves, and points at the peanuts, mouthing don’t share. When his ship clears the harbor mouth, I shell one. The peanuts that winter were roasted a little too dark."
effects = [{}, {}, {}, { title = "Mind Your Own Ships" }, {}]

[tracks.bond_huang_dun.chapters.s.variants.known]
text = "In the twelfth month the north wind snaps the flags along the docks. A notice on the school gate says there will be no lessons come spring. Huang Dun is shipping out with his uncle. His family has one ship left, so old the planks are crusted with barnacles, and today she sails for Nan’ao. He stands by the gangplank holding an oilpaper packet, gripping it tight. “My uncle says from now on I keep the ship’s accounts,” he says. “First line, I’m still writing food.” I tell him if he dares leave out the food, I’ll chase him from Yuegang to Nan’ao to give him an earful. He laughs, then stops laughing, and looks at the ship, and then at me. “Wandeng.” The moment it’s out he goes red, and gruffly adds, “Doesn’t roll off the tongue. Next time we meet, we have a contest. Loser picks the snacks.” “Isn’t picking the snacks the winner’s job?” “Loser picks,” he says, very serious. “Losing feels bad. You pick something you like to eat, and then you’re fine.” Someone on the ship calls his name. He doesn’t move. He’s waiting for my answer."

[tracks.reunion_huang_dun]
name = "Huang Dun: Supper After the Sea Opened"

[tracks.reunion_huang_dun.chapters.reunion]
title = "Supper After the Sea Opened"
text = "In the third year of the open sea, Yuegang has more sails than anyone can count. My anchor has barely gone down when someone at the far end of the dock bellows “Brother Lin!” Only one man in all Yuegang calls me that. Huang Dun is rounder than ever, in a shipowner’s silk jacket with soy sauce on the cuff. His ship came in from Luzon yesterday and is moored right alongside—new planking, the “Huang” on her bow freshly painted. He has laid one long table on the dock. When I start over, he puts out an arm and holds me back. “Wait.” Then he calls his crew by name, one at a time: one name, one man seated, a bowl in his hands, and only then the next. The first to sit is a lean, sunburned man with a finger missing on his left hand. “Ah Fu,” Huang Dun says. “Found him in Luzon. The raiders sold him over there, and he poled boats for other men for thirteen years.” Ah Fu nods to me and holds his bowl without a word. Once every man has a bowl, Huang Dun brings his own over and knocks it against mine so hard the soup slops out. “First line in the ship’s accounts is still food.”"

[tracks.reunion_huang_dun.chapters.reunion.default]
effects = [{ text = "Brother Lin— The ship came back, and Ah Fu came back too. I found Ah Fu in Luzon. He’s thinner, and his left hand is still missing that finger, so I knew him straight off. He says they sold him to Luzon that year and he poled boats for the foreigners, and he cut one mark a year on a plank—thirteen marks. I laid a tabel on the docks, the crue sat first, and I saved you a seet, and you didn’t come. The food went cold. We’ll heat it up next time. The ship’s accounts still start with food, so don’t worry. Rice is dear this year, so I laid in ten days extra. If your family’s ship passes Yuegang, write first and I’ll have my mother make a basket of sesame cakes. Loser picks the snacks—that still stands. —Huang Dun. P.S. The Cai boy read this over and says there are three mistakes in it. I looked and looked and can’t find them. You pick them out." }, {}]

[tracks.reunion_huang_dun.chapters.reunion.choices.swear]
text = "Swear brotherhood with him in front of the whole crew, bowing toward the Tianfei temple"
reply = "“Ah Dun,” I say, “let’s swear brotherhood.” He blinks, then slaps the table and stands up. “Let’s!” Then, lower: “Swearing means drinking, and I can’t hold my drink.” He drinks three bowls, and his face goes as red as the turtle cakes on an altar. The crew shift the table to clear a patch of ground. We kneel facing the Tianfei temple. There’s no incense, so Ah Fu fetches three stubs of mooring rope from the ship and lights them, and the smoke stings worse than incense. Huang Dun knocks his head on the ground so hard it thuds, and when he gets up there’s a grain of rice stuck to his forehead. “From now on,” he says, holding me by the shoulder, his tongue already thick, “your ship and my ship are one family’s ships. We split the food bill.” I ask who keeps the accounts. “Me. First line, food.” He drops back onto his stool and stuffs a rice cake in his mouth. “Eat first. Talk after.”"
effects = [{}, {}, {}, { title = "Supper After the Sea Opened" }]

[tracks.reunion_huang_dun.chapters.reunion.choices.just_eat]
text = "Leave the brotherhood out of it—just sit down and eat, and stay until the last man leaves"
reply = "I don’t bring up swearing brotherhood. I sit down and eat. Oyster omelet, braised noodles, five-spice rolls, one plate after another. As the crew fill up they pat their bellies and go back aboard to sleep, and Ah Fu gives me a little bow on his way. By dark it’s just the two of us at the table, and he’s still calling the cook for more. “Sworn or not, it’s all the same,” he says, picking his teeth. “Share one table and you’re brothers.” “Then what am I?” He sets down his toothpick and looks me over seriously. “You’re the one who eats fastest. You were the same at school. One mung-bean cake, and before I could even see it, you’d swallowed it.” I tell him that cake was the one he gave the Cai boy. “Oh,” he says, and fills my bowl again. “Then you still owe me one.”"
effects = [{}, {}, {}, { title = "Supper After the Sea Opened" }]

[tracks.reunion_huang_dun.chapters.reunion.variants.both]
text = "In the third year of the open sea, Yuegang has more sails than anyone can count. My anchor has barely gone down when someone at the far end of the dock bellows, “Wandeng!” Every man at the table turns to look; somebody whistles, somebody bangs on the table and hoots. Huang Dun, rounder than ever in a shipowner’s silk jacket, glares them down. “What are you hooting at? We were at school together, and she took first place at the abacus!” The hooting dies. The table is spread with an indigo batik cloth printed with a row of little boats, its creases folded sharp and square. I ask where he got it. “A batik workshop in Gresik.” He fingers the corner, gently. “The woman who runs it says you can’t hurry a dyer’s hands. Next year I’d better get there early.” Then he calls his crew by name, one at a time: one name, one man seated, a bowl in his hands, and only then the next. The first to sit is a lean, sunburned man with a finger missing on his left hand. “Ah Fu,” Huang Dun says. “Found him in Luzon. The raiders sold him over there, and he poled boats for other men for thirteen years.” Ah Fu nods to me and holds his bowl without a word. Once every man has a bowl, Huang Dun brings his own over and knocks it against mine so hard the soup slops out. “First line in the ship’s accounts is still food.”"

