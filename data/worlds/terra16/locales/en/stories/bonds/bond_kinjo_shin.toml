# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_kinjo_shin.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应（a2 find_stars 第 4 个、his_words 第 5 个；s 的 promise 与 heart 第 6 个、own 第 4 个；
# 重逢三个落点第 4 个是 memory；重逢 default 第 1 个是 letter）。

[tracks.bond_kinjo_shin]
name = "Kinjō Shin: Every Island by Name"

[tracks.bond_kinjo_shin.chapters.c1]
title = "Every Island by Name"
text = "In the schoolroom at Kumemura, the interpreter who taught us asked which islands lay on the way to Fuzhou. I said Kerama, Kume Island, and then Fuzhou. Someone in the back row snorted. It was Kinjō Shin. He stood up and, without looking at any paper, rattled it off in one breath: “Naha. Kerama, which the Chinese call Horse-Teeth Hill. Tonaki. Aguni…” Farther west came a few reefs where nobody lives, and he gave even the nicknames the sailors had for them, all the way to the Five Tigers Gate at the mouth of the Min. The teacher nodded and went back to his book. After class Shin pushed a hand-copied list of islands across to me, its edges worn soft. “The small ones count too. Some of them are too small to hold a village, but when the wind turns hard, they’ll keep a ship for the night. Learn the island first, then the flag.” I ran my eye down the list. The line under Aguni was inked darker than any other: Kume Island. When he’d recited it, he had paused for a breath after Aguni and gone straight on to the reefs."

[tracks.bond_kinjo_shin.chapters.c1.choices.recite_all]
text = "Go through the list with him, from Naha all the way to the Five Tigers Gate."
reply = "I got four wrong. When I said Tokashiki for Tonaki, he cut in at once: “Tokashiki is inside Kerama. Different island.” When I said Dongshan for Dongyong, he cut in again. By the end, every time I opened my mouth his finger was already on the next line. When we finished, he folded the list in four. “You’re quicker than the little clerk who came to learn last year.” I asked whether the island he’d skipped was Kume. He tucked the list into his sleeve. “Another time.”"

[tracks.bond_kinjo_shin.chapters.c1.choices.ask_skipped]
text = "Ask him why, after Aguni, he jumped right over Kume Island."
reply = "Something crossed his face. “I didn’t skip it.” “You stopped for a breath.” He said nothing more. He turned the list face down on the desk and kept his palm on it. Outside, someone was shouting to haul the boats in; they shouted twice. After a long while he spoke, very low. “There’s a light on that island. I don’t want to talk about it.” Then he got up and left, and forgot the list on the desk. The next day I gave it back. He took it without a word and slipped it between the pages of a book."

[tracks.bond_kinjo_shin.chapters.c2]
title = "Legs of the Route He’d Only Heard"
text = "In summer they hauled the tribute ship up the beach to scrape her hull, and the quay was littered with broken shell. Kinjō Shin crouched beside her, reciting his list again. I asked him, “How much of this route have you sailed yourself?” He stopped halfway through. “I went to Fuzhou once last year, on my father’s ship.” “Then you’ve sailed all of it.” “Sailed it, yes. I didn’t see all of it.” He took out his brush and ink, spread the list on his knee, and went leg by leg, asking himself: Did we pass this by day or by night? Was I on deck or down in the hold? One question, one mark. What he had seen with his own eyes got a circle; what someone had told him got a dot. When he was done the page was all dots, and only three circles: Kerama to Tonaki, Tonaki to Aguni, Dongyong to the Five Tigers Gate. I thought he’d be angry. Instead he laid the brush down. “Should have split them like this from the start. Take what you heard for what you saw, and sooner or later something goes wrong.”"

[tracks.bond_kinjo_shin.chapters.c2.choices.mark_mine]
text = "Do what he did: sort the legs I know into circles and dots."
hint = "Circles and dots are how his family keeps its routes. You aren’t close enough yet to add a stroke to his list."
reply = "I could only draw one circle: Naha to Kerama, on one of my family’s boats when I was little. He looked at it. “That counts.” Then he looked at his own list. Naha to Kerama, he’d marked with a dot. “We left harbor at night.” He laid my list beside his and weighed them both down with a stone, and counted twice. “Four circles.” He pressed a thumbnail into each of the four. “Once we’re at sea, we turn the dots into circles, one leg at a time.”"

[tracks.bond_kinjo_shin.chapters.c2.choices.quiz_him]
text = "Test him: for the legs marked with dots, who told him?"
reply = "He named them dot by dot and never stumbled once. “Aguni to Kume Island, old Kana at the bow. The reefs to the west, Mausi at the helm. Past Dongyong, it was Chen, the navigator from Kumemura.” When he finished, he wrote a small character beside each dot: the name of the man who’d told him. “Names have to be learned too.” He blew the ink dry. “When I need to ask, I have to know whose door to knock on.”"

[tracks.bond_kinjo_shin.chapters.b1]
title = "The Missed Stop"
text = "In autumn the school held a contest in reciting the route. The teacher kept a fistful of scoring slips, and for every mistake he cut a notch in the slip with that student’s name. I finished ahead of Kinjō Shin, fast, and it felt smooth even to me. The teacher picked up my slip and cut a notch. Shin spoke up beside me. “On the lee side of Aguni the ship anchors for a night to wait for wind. You left out that stop.” That was the rule, and I owned it. Then it was his turn, and he didn’t miss a word, except that when he reached Kume Island the three syllables ran together, so fast they seemed to slip off his tongue. As he sat down I raised my hand. “Kume Island. He slurred it.” The room went quiet. Shin looked at me, then stood and said to the teacher, “Slurred. Mark me one.” The teacher cut a notch in his slip too and laid the two side by side on the desk: the same length, one notch each."

[tracks.bond_kinjo_shin.chapters.b1.choices.recite_again]
text = "After class, go through the whole route with him once more, no score kept."
reply = "We sat on the steps at the school’s back door, one of us taking the odd islands, the other the even. At Aguni I got in first: “Anchor for a night. Wait for wind.” He went on to Kume Island and said it slowly, every syllable clear, then said it again. By the time we finished it was dark. “The route’s clearer today than yesterday,” he said. “Because your pronunciation is clearer,” I said. He shook his head. “Because your stop is back in.”"

[tracks.bond_kinjo_shin.chapters.b1.choices.rematch]
text = "Challenge him to another round next month, backward, from the Five Tigers Gate home to Naha."
reply = "The next month we recited it backward, and Kinjō Shin got every island right. I missed two, and my slip gained two more notches. After class he bought me a bowl of fish congee at the edge of Kumemura. He barely touched his own and just watched me eat. “Do you know what someone reciting backward fears most?” I shook my head. “Getting to the end and forgetting which harbor he sailed from.” With that, he reached over, took my bowl, and finished the last mouthful himself."

[tracks.bond_kinjo_shin.chapters.b2]
title = "The Light He Mistook"
text = "In the sixth month, word came down from the castle that the old king was gone. All of Naha changed into plain mourning clothes, no gongs sounded in the market, and the tribute ship in the harbor sat half unloaded, going nowhere. Kinjō Shin hadn’t said a word in days. One night he knocked on my door and, without any explanation, led me all the way out to the end of the harbor’s stone breakwater. A lamp burned there, steady in the wind. He watched it for a long time. “The year before last, I went to Fuzhou on my father’s ship,” he said. “After Aguni it was night, and I was on deck, watching for lights. A light came up off the port side, and I called out: Kume Island’s light, to port. The helm was already halfway over before old Kana threw his weight against it.” He stopped. “It was a fishing fire. It was moving, and I didn’t see.” Water slapped against the foot of the wall, again and again. “Since then I say every island’s name three times.”"

[tracks.bond_kinjo_shin.chapters.b2.choices.not_shame]
text = "Tell him: he got it wrong once, and that’s why no one reads a light better now."
hint = "He has never told anyone this. You aren’t close enough yet; whatever you say now won’t reach him."
reply = "He didn’t turn around. He kept watching the lamp at the end of the wall. “My father said that too,” he said. “I didn’t believe him.” The wind dropped for a moment, and the flame stood straight up. “What you say,” he said at last, “I believe half of.” I told him half was enough. He bowed his head and laughed, very briefly. On the way back he walked on the seaward side and counted the harbor lights one by one. At the eleventh he said, “None of these move.”"

[tracks.bond_kinjo_shin.chapters.b2.choices.teach_light]
text = "Ask him to teach me how to tell a fishing fire from an island light."
reply = "He went through it the way he recited in class. “A fishing fire flickers; an island light doesn’t. A fishing fire burns yellow; an island light runs white. A fishing fire wanders. Watch it for three breaths, and it will have moved.” He had me fix my eyes on a light beyond the harbor. By the third breath it had shifted a finger’s width to the right. “All of this,” he said, “I learned by getting it wrong once.” He said it flatly, and then went through all three again from the start."

[tracks.bond_kinjo_shin.chapters.a1]
title = "No Island Names Today"
text = "In spring we heard the new king had taken the throne. The mourning clothes came off all over town, and the tribute ship in the harbor started taking on cargo again. Kinjō Shin asked me out past the harbor to the reef that only shows at low tide. On the way he said, “No island names today.” Seaweed lay drying on the rocks in sheets, so brittle it crackled underfoot. We picked a flat stretch and sat. The moment I sat down, my hand went up and pointed west. “Kerama’s that way, and a bit farther round is Tonaki—” I stopped halfway. Shin looked at me, I looked at him, and we both burst out laughing, so loudly a crab scuttled sideways out of a crack in the rock. When he was done laughing he peeled a strip of dried seaweed off the stone and turned it between his fingers. “See? I said no test. You’re the one testing yourself.”"

[tracks.bond_kinjo_shin.chapters.a1.choices.far_place]
text = "Take turns naming one place neither of us can get to yet."
reply = "He didn’t even have to think. “The walls of Fuzhou. Last time we got as far as the mouth of the Min, and my father wouldn’t let me into the city.” When it was my turn, I thought for a while and said Malacca, in the south, where they say the harbor is hot all year round. He snapped his seaweed in two. “Then I’ll go to Fuzhou first and come back and tell you about it.” “Then I’ll go south first,” I said, “and come back and tell you.” He laid one half on my knee, as if we’d signed something."

[tracks.bond_kinjo_shin.chapters.a1.choices.no_names]
text = "Really don’t say a single island name. Just sit with him until sundown."
hint = "Sit this close to him till dark now, and nerves will have him quizzing you on islands. You aren’t close enough yet."
reply = "Neither of us spoke again. The tide crept in, wetting the edges of the reef. The sun went down in the west, and as it slipped behind the islands of Kerama he quietly said the name of one, then laughed at himself. “Habit.” I said it was all right. Just that one. He folded the strip of seaweed very small and pressed it into my hand, then got up to look at the water and said, with his back to me, “Low tide again tomorrow.”"

[tracks.bond_kinjo_shin.chapters.a2]
title = "A Plain Star Chart"
text = "In autumn Kinjō Shin gave me a star chart. It was drawn on a scrap of paper left over from the schoolroom, and it was as plain as could be: a dozen or so stars in the northern sky, joined into the few lines that sailors use. At the bottom, in small characters, he had written: Don’t mistake a light the way I did. But he hadn’t marked which two stars were easiest to confuse. I turned the chart over and over. He sat across from me, brush still in hand. “Which two?” I asked. “Find them yourself,” he said. “Find them, and I’ll circle them. Then it’s finished.” I searched a long time. He didn’t hurry me, only reached over now and then to trim the lamp wick brighter. Out the window, the tribute ship was loaded to the second tier, a lamp still burning at her hatch. He glanced at it, then back down at me."

[tracks.bond_kinjo_shin.chapters.a2.choices.find_stars]
text = "Right in front of him, point out the two stars easiest to mix up."
hint = "He’s still drawing this chart in his head. Once you’re closer, he’ll bring it out."
reply = "I pointed to the North Star, then to the bright one beside it, the Emperor Star. He leaned in and looked for a long time, as if afraid I had guessed, and made me explain how to tell them apart. I said the North Star doesn’t move all night, and the Emperor Star circles it. Only then did he set brush to paper and circle each of them. “You’ll get it wrong too, once you’re at sea,” he said. “Getting it wrong once is enough.” I said, “Then that one time of yours can count for me.” His brush stopped on the paper and a drop of ink spread. He stared for a good while before he laughed, then blew the chart dry and handed it to me."
effects = [{}, {}, {}, { title = "A Plain Star Chart" }]

[tracks.bond_kinjo_shin.chapters.a2.choices.his_words]
text = "Point to the line at the bottom: I’ll carry these words with me."
hint = "Say that now, and he’ll take the chart back and draw it again. You aren’t that close yet."
reply = "He reached over with the brush to strike the line out, saying the writing was ugly. I held the paper down. His hand stopped under mine. He didn’t pull it back, and he didn’t move it either. The wick gave a little crack. After a while he said, “Then carry it. Don’t lose it.” With his other hand he circled the two stars, crooked circles, nothing like his usual hand."
effects = [{}, {}, {}, {}, { title = "A Plain Star Chart" }]

[tracks.bond_kinjo_shin.chapters.a2.choices.ask_copy]
text = "Ask him to draw another one, to keep for himself."
reply = "“I don’t need one,” he said. “I could find those two stars with my eyes shut.” But the next day he cut another sheet and stayed up all night drawing. When he brought it to show me, there were shadows under his eyes, and it was neater than the one he’d given me, every one of the dozen stars in place. Only the line at the bottom was missing. I asked why he hadn’t written it. “That line was for you.”"

[tracks.bond_kinjo_shin.chapters.s]
title = "Which Tide It Was"
text = "Late in the year the school closed. The tribute ship in the harbor was fully loaded, and everyone on the quay was saying that this voyage would also carry home to Fuzhou the few dozen Chinese rescued that autumn from a pirate ship. Kinjō Shin was going as an apprentice to the ship’s clerks, on this very sailing. In spring I would take another ship south. He called me out onto the harbor breakwater and handed me a slip of paper with a single line on it: Thirty-fifth year of Jiajing, eleventh month, nineteenth day. Naha. Ebb tide. North wind. “Start every letter like that,” he said. “Year, month, day, where you are, what tide, what wind, and leave nothing out. Letters travel slowly. Let one come half a year late; open it, and you’ll still know which tide it was.” The lamp at the end of the wall was already lit. He watched me put the slip away, then added, “Use a nickname for an island, and I won’t write back.”"

[tracks.bond_kinjo_shin.chapters.s.choices.promise]
text = "Promise to date every letter in full, and to name the island where the ship lies."
hint = "A promise like this takes knowing someone better than you know the islands. You haven’t come that far yet; or else you’ve already made your one promise to someone else, and tonight all you can do is wish each other fair winds."
reply = "I said yes. He said at once, “Full island names. No nicknames.” I said, “Then you’ll have to teach me the full names first.” He thought about it. “Then we’ll have to go through them again.” So we stood on the breakwater and started from Naha. The wind was cold. He said one, and I said it after him. At Aguni I said: anchor for a night, wait for wind. He nodded and went on to Kume Island and said it clearly, without a pause, without rushing. We went all the way to the Five Tigers Gate, and the lamp at the end of the wall was still burning. He took another slip from his sleeve: the opening of a letter, the space for the date left open, and below it only the word Naha. “This one you fill in, once your ship has anchored.” I put the two slips together and tucked them away. He turned to go, took a few steps, and looked back. “Get an island name wrong and I’ll still write back. But I’ll circle it.”"
effects = [{}, {}, {}, {}, {}, { title = "Which Tide It Was" }, {}]

[tracks.bond_kinjo_shin.chapters.s.choices.heart]
text = "Tell him that when we’re grown and my ship comes home, I want him to be the first to know it."
hint = "Asking him to be the first to know your ship—you can’t say that yet. You haven’t come that far, or your one promise of a lifetime already belongs to someone else."
reply = "He glanced at me, then out past the harbor. “I know a ship better than I know an island.” I said good. Then I said that when that day came I would have something to ask him, and that I wouldn’t ask it now. He didn’t press. The wind tipped the flame at the end of the wall, and it straightened again. After a long time he reached out and took my hand and held it tight; his palm was cold. “I’ve learned the island, and I’ve learned the flag,” he said. “The person comes after.” His voice was much softer than when he recited islands. “When you come back and ask, I’ll answer.” We stood like that until the men on the tribute ship pulled in the gangplank and called for him. He let go, walked a few steps, and looked back once, at me, not at the lamp."
effects = [{}, {}, {}, {}, {}, { title = "Which Tide It Was" }, {}]

[tracks.bond_kinjo_shin.chapters.s.choices.own]
text = "Race him: who will be first to see the whole route to Fuzhou firsthand."
reply = "“Me,” he said right away. “I’m on the next tribute ship, this one.” I said then I wouldn’t crowd onto his ship; I’d get there another way. He frowned. “There’s only one way to Fuzhou.” I said that was only because his list had only one. He stared at me a while, then pulled out his list, full of circles and dots, started a new line at the very bottom, and wrote both our names, leaving an empty box after each. “Whoever turns all the dots into circles first writes the date in the box,” he said. “The race ends under the gate of Fuzhou.” We slapped hands on it right there on the breakwater. His grip was stronger than I expected; my palm stung. He walked off shaking out his hand and never looked back, but when he reached the land end of the wall he raised the list and waved it."
effects = [{}, {}, {}, { title = "Which Tide It Was" }, {}]

[tracks.reunion_kinjo_shin]
name = "Kinjō Shin: New Papers in Naha"

[tracks.reunion_kinjo_shin.chapters.reunion]
title = "New Papers in Naha"
text = "Six years later my ship came into Naha. A tribute ship lay at the quay taking on cargo, and two people stood at the foot of her gangplank. The taller one was Kinjō Shin, in a clerk’s robes, holding a sheaf of papers. He didn’t hand them over yet. First he asked the young apprentice in front of him, “Where to?” “Fuzhou.” “Through which mouth?” “The Five Tigers Gate.” “And after Aguni?” “Anchor for a night. Wait for wind.” Only then did he give him the papers. Nearby an old sailor was telling someone that last year an envoy ship had run out of water among the western reefs, and that they had followed Kinjō Shin’s table of island water sources and dug out a spring on the second reef. My ship was lowering sail. Shin looked up, and the first thing he saw was the flag at the masthead. He stared at it for a good while before his gaze came down, to the bow, to me. The brush in his hand fell to the ground."

[tracks.reunion_kinjo_shin.chapters.reunion.default]
effects = [{ text = "Forty-first year of Jiajing, eleventh month, third day. Naha. Ebb tide. North wind rising. Your ship didn’t come in this year. I’m sending this south with whatever ships are going, to ask after you from port to port. I don’t know which tide will bring it to you, which is why the date is written in full: open it and you’ll know. Business first. The tribute ship came back safely; in Fuzhou everything is as it was. There’s a new cove at Dongyong where a ship can anchor this year, and I’ve entered it. Three more islands in the water table: a well on the north side of Tonaki that the tide doesn’t reach; on the lee side of Aguni, a spring in a crack in the rock, a long walk for every bucket; and on the second reef to the west, the spring they dug out last year still has water this year. The apprentice I’m training is quicker than I was. When he gets an island name wrong I still correct it, one name at a time. He says Kume Island very clearly. At night on the ship, when I see a light, I still count three breaths, and only then call the bearing. Every letter you’ve sent these years I’ve put in order by date. The few where you used nicknames for islands, I circled, and wrote back anyway. I would know your ship." }, {}]

[tracks.reunion_kinjo_shin.chapters.reunion.choices.water_table]
text = "Help him add the islands and springs I’ve seen these years to his water table."
reply = "He spread the water table out on a cargo crate. It was a thick book, one island to a page, the island’s name at the top, the full name, never a nickname. For every island I gave him, he asked three questions: Which side of the island is the spring on? Does the tide reach it? How far do you walk for a bucket? Anything I couldn’t answer, he didn’t write a word of. We added seven islands that afternoon. For the farthest I only knew what the people there called it, and he spent longest on that one, asking twice whether its water was salt or sweet. When he was done he wrote my name at the foot of each of the seven pages, stroke by careful stroke, and the date after it: year, month, day, tide, wind, nothing left out. “Whoever finds water there from now on,” he said, blowing on the ink, “will know who wrote it down first.” I told him to write my name smaller. He ignored me and traced over it again, darker than the island names."
effects = [{}, {}, {}, { title = "New Papers in Naha" }]

[tracks.reunion_kinjo_shin.chapters.reunion.choices.who_first]
text = "Ask him: has he seen the whole route to Fuzhou with his own eyes yet?"
reply = "“All of it.” He spread the old list out on a cargo crate. It was nearly worn through at the folds, and every dot on it had been traced over into a circle; the last one he’d closed sat right beside Kume Island. “A year before you.” He said it evenly, but his eyes were bright. “Call it your loss.” I said I’d gone another way, a long loop south and back, much farther than his. He said distance didn’t count; only the road to Fuzhou counted. I said that was only because Fuzhou was the only place on his list. We argued from the quay to the edge of Kumemura and from Kumemura back to the quay, until it was dark and neither of us would give in. In the end he turned the list over, started a fresh line on the back, wrote “Next leg,” and asked what we were racing for this time. I said whoever got back to this quay first. He thought it over, wrote it down, and left two boxes after it."
effects = [{}, {}, {}, { title = "New Papers in Naha" }]

[tracks.reunion_kinjo_shin.chapters.reunion.choices.first_ship]
text = "Tell him: we agreed back then. The first ship he knows has to be mine."
hint = "Those words were never agreed between you. What he knew today was only a flag."
reply = "He bent to pick up his brush and didn’t answer right away. The apprentice had gone off with the papers, and the two of us were alone at the foot of the gangplank. “I knew it a long time ago,” he said. “Your ship was still off Kerama when I saw that flag. I told myself, a flag can be mistaken.” He slid the brush back into his sleeve. “So I waited. Waited for you to come and stand at the bow.” I said that, back then, I had told him I’d have something to ask. He nodded. “I remember. And I told you that when you came back and asked, I’d answer.” He took my hand the way he had on the breakwater that year, only this time his palm was warm. “No need to look twice this time.” People streamed past along the quay, and he didn’t let go. I leaned in and kissed him. He froze for a moment, red to the ears, but he didn’t pull away; he bowed his head and kissed me back, much slower. That night he didn’t go back to the tribute ship. We sat at the bow of my ship and watched the harbor lights come on. He counted them one by one, and at the last one he said, “None of them move.”"
effects = [{}, {}, {}, { title = "New Papers in Naha" }]

[tracks.reunion_kinjo_shin.chapters.reunion.variants.v1_promise]
text = "Six years later my ship came into Naha. A tribute ship lay at the quay taking on cargo, and two people stood at the foot of her gangplank. The taller one was Kinjō Shin, in a clerk’s robes, holding a sheaf of papers. He didn’t hand them over yet. First he asked the young apprentice in front of him, “Where to?” “Fuzhou.” “Through which mouth?” “The Five Tigers Gate.” “And after Aguni?” “Anchor for a night. Wait for wind.” Only then did he hand the papers over, and all that was left in his hands was a bundle of old letters tied with hemp cord, every one headed with year, month, day, tide and wind: the letters I had sent him from everywhere these years. Nearby an old sailor was telling someone that last year an envoy ship had run out of water among the western reefs, and that they had dug out a spring by following Kinjō Shin’s table of island water sources. My ship was lowering sail. Shin looked up, and the first thing he saw was the flag at the masthead. He stared at it for a good while before his gaze came down, to the bow, to me. The brush in his hand fell to the ground, but he kept a tight hold on the letters."

[tracks.reunion_kinjo_shin.chapters.reunion.variants.v2_own]
text = "Six years later my ship came into Naha. A tribute ship lay at the quay taking on cargo, and two people stood at the foot of her gangplank. The taller one was Kinjō Shin, in a clerk’s robes, holding a sheaf of papers. He didn’t hand them over yet. First he asked the young apprentice in front of him, “Where to?” “Fuzhou.” “Through which mouth?” “The Five Tigers Gate.” “And after Aguni?” “Anchor for a night. Wait for wind.” Only then did he give him the papers. Nearby an old sailor was telling someone that last year an envoy ship had run out of water among the western reefs, and that they had followed Kinjō Shin’s table of island water sources and dug out a spring on the second reef. My ship was lowering sail. Shin looked up and saw the flag at the masthead first, and only then me. The brush slipped from his hand; he left it where it fell. He reached into his robe, pulled out an old list gone soft as cloth, and held it up toward my bow."
