# 哈米德（bond_hamid / reunion_hamid）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、见闻、选项、回复、提示、变体、回忆标题、来信），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完；美式拼写、弯引号。口头禅原句“You have your sea; I have my tide.”只在 C1 出现一次。

[tracks.bond_hamid]
name = "Hamid: You Have Your Sea"

[tracks.bond_hamid.chapters.c1]
title = "Another Name"
text = "There is a well in the middle of the Jabarti courtyard, and on its rim sits a chipped water jar that belongs to whoever is drawing water. I’m crouched there washing my feet when one of the older students bellows across the arcade: “Karim’s brother! Over here!” A tall, thin boy gets up from the shade and answers, “Coming.” Halfway across he adds, very quietly, “…Hamid.” So quietly that only the water jar could have heard. I stand up, shaking water off my feet, and use the voice I learned calling prices in the Kilwa fish market: “Everyone! This is Hamid, from Mogadishu, and they say he can reckon the monsoon!” Every head in the courtyard turns. Hamid glares at me and drops his voice even lower: “You have your sea; I have my tide.” The older student is interested now, and asks him when this year’s ships leave Aden for the south. Hamid tells him—which days the wind will swirl, which day no sane captain leaves port—in more detail than the man asking ever knew. The student slaps his knee. “Karim’s brother knows it better than Karim!” Hamid says nothing and bends to pick up the water jar."
news = "At the well in Cairo’s Jabarti quarter, a student from Kilwa hollered a Mogadishu boy’s name across the courtyard like he was selling fish, and every head turned."

[tracks.bond_hamid.chapters.c1.choices.introduce_again]
text = "Grab the jar and announce it again, louder: his name is Hamid."
reply = "I take the jar out of his hands and set it down hard on the rim of the well. “Once more: his name is Hamid. The next man who gets it wrong, I’ll throw this jar of water over him myself.” The older students roar, and somebody starts mimicking my Kilwa accent. Hamid goes red right down to his collar and finally manages, “So in Kilwa, whoever shouts loudest wins?” But that evening, from the arcade, I hear him strike up a conversation with a new boy from Zeila, and the first thing he says is, “I’m Hamid.”"

[tracks.bond_hamid.chapters.c1.choices.needle_him]
text = "Needle him, Kilwa style: Mogadishu ships wait for wind till their beards go gray."
reply = "“What good is reckoning the monsoon? Mogadishu ships sit waiting for wind until the captain’s beard goes gray.” Hamid sets the jar down. “At least Kilwa ships never wait. They drift wherever the wind pushes them, all the way down to Sofala.” We argue from the well to the arcade, from the noon prayer to the afternoon one. By the end he’s squatting on the ground drawing wind directions and I’m drawing the route my family’s ships take beside his, and when we compare them, we’ve both been talking about the same northeast wind. He scuffs the drawings out with his foot. “We’ll finish this tomorrow.”"

[tracks.bond_hamid.chapters.c2]
title = "Counting from Nawruz"
text = "After the afternoon prayer, Hamid spreads a sheet of paper over my bed and pins the corners down with my shoes. It’s ruled into boxes, one number in each. “The pilots of the Indian Ocean count their days from Nawruz,” he says. “Which day you leave Aden, which day you round Cape Guardafui, which day you ought to see the white walls of Mogadishu—it’s all counted.” He hesitates. “I made this one myself. I didn’t copy my brother’s.” He’ll always beat me at books, but I learned to count in the Kilwa fish market. I run my finger down the boxes, and halfway down it stops: right below day ninety-six comes day ninety-eight. I don’t say anything. Hamid sees where my finger is. His face closes. He reaches to roll the sheet up, stops halfway, and stares at that box for a long time. “…You’re sure you counted right?” “I’ve never short-changed anybody on fish.” He doesn’t laugh. He spreads the sheet flat again."
news = "There’s a Mogadishu student in Cairo’s Jabarti quarter who drew up his own monsoon table, counted day by day from Nawruz, he says. He won’t lend it to anybody."

[tracks.bond_hamid.chapters.c2.choices.count_days]
text = "Light a lamp and recount it with him, day by day from Nawruz."
hint = "The table is spread out, but his hand stays over that one box. You two aren’t close enough yet for him to hunt down his mistake with you watching."
reply = "We light an oil lamp. He reads out the days, and I lay date pits on the bed frame, one for each. Around midnight we find it: he’d logged one stretch of the voyage as a full month, pushed every day after it down a box, then tried to make it up at day ninety-seven, and in his hurry he’d lost the day altogether. He fixes the box. He doesn’t thank me. All he says is, “You Kilwa people can count, I’ll give you that.” Next morning there’s a sheet of paper by my pillow: a fair copy of the whole table, with his name in the bottom right corner."

[tracks.bond_hamid.chapters.c2.choices.bet_date]
text = "Bet him on the day this year’s first southbound ship clears the Red Sea."
reply = "I go by what the pepper sellers in Khan al-Khalili are muttering; he goes by his table. We write both dates on one scrap of paper and tuck it under the water jar by the well. When word from the Bab el-Mandeb finally reaches Cairo, he’s off by two days and I’m off by eleven. “I don’t want money,” he says. “Then what?” “Say it: Mogadishu people can count.” I say it in front of half the courtyard. He nods and takes the scrap of paper away, and never once mentions that the box on his table still hasn’t been fixed."

[tracks.bond_hamid.chapters.b1]
title = "A Line of His Own"
text = "After the lecture, the old teacher of reckoning keeps a few of us back and sets a problem on the sand boards: a bale of pepper shipped from Jeddah to Cairo, through so many tolls, so many taxes, so much lost to damp on the way—what should it sell for in Khan al-Khalili? We all bend over our boards and trace figures in the sand, then call out our answers one by one. Mine isn’t far off. Hamid is the last to answer, and the old man shakes his head. “Short by a good deal.” Hamid stares at his board, and it bursts out of him: “My brother would never get this wrong—” He stops halfway, stunned at himself. Someone in the back row snorts. The teacher doesn’t laugh. He taps Hamid’s board with a reed. “I don’t know your brother. Whose line is this?” Hamid’s mouth stays open. The figures on his board straggle across the sand, and the last one is half wiped away by his sleeve."
news = "In the reckoning class at al-Azhar in Cairo, a Mogadishu student came up well short on a pepper price and brought his brother into it on the spot. The back row laughed about it for days."

[tracks.bond_hamid.chapters.b1.choices.cover_brother]
text = "Put a hand on his board before he finishes: forget your brother, work your own line."
reply = "I lay my hand on the edge of his board. “Leave your brother out of it. Work your own line.” He gives me a look I’ll remember for three days. Then he bends over, smooths the sand flat, and starts again from Jeddah. At the second toll station he stops: he never wrote down the transit fee at all. He adds it, calls out the new figure, and the teacher nods. Hamid lifts his head, and this time there’s no brother in it. “This line is mine. Getting it wrong was mine, and so is getting it right.”"

[tracks.bond_hamid.chapters.b1.choices.own_mistake]
text = "Tell him I botched a sum too, in Khan al-Khalili, far worse than his."
reply = "“That’s nothing,” I say. “My first month in Cairo I bought a copper tray in Khan al-Khalili. Haggled for an hour, got thirty off, and was so pleased with myself I bought the stall keeper a cup of cane juice. Got it home, gave it a scratch—tin with a skin of copper.” I do the stall keeper for them, stroking his beard and calling me “my child.” The back row finds someone new to laugh at. Hamid laughs too, then says, “You’re just trying to make me feel better.” “I am. Will you take it?” He thinks it over. “I’ll take it. Let me see that tray.”"

[tracks.bond_hamid.chapters.b2]
title = "A Month Too Early"
text = "The letter from home comes in at dusk with a caravan from Suez. Hamid opens it in the arcade, reads it, reads it again, and climbs up onto the roof. Around midnight I go up after him. The Jabarti roofs are flat enough to sleep on. He’s sitting near the edge with the letter on his knees, a broken tile holding it down. “My brother wrote it.” He hands it to me and points to the last few lines. Karim writes in a wide hand: “I’ve kept you a berth on the ship for the day you named, and she’ll wait for you at Aden. The old pilot says the wind won’t have turned by then. I didn’t argue with him—you did the reckoning, so your word stands.” Hamid says he converted his Nawruz day count into the months of the Hijri calendar to write home, and got the conversion wrong. Not by a day. By a whole month. He picks up the tile and puts it down again. “Don’t tell anyone.” A little later he asks, “How am I supposed to answer this?”"
news = "The doorkeeper of Cairo’s Jabarti quarter says a Mogadishu student got a letter from home at dusk, read it twice, and went straight up to the roof without a word. Didn’t even come down for supper."

[tracks.bond_hamid.chapters.b2.choices.write_back]
text = "Draft the reply for him by moonlight: give the right date, say nothing of the mistake."
hint = "He asked, but he keeps the pen gripped in his own hand. You two aren’t close enough yet for him to let you write it."
reply = "I write by moonlight while he watches. “Brother: there has been a change to the sailing date…” There I stop. He takes the pen from me and adds a line underneath, in very small letters: “I counted wrong.” “I thought you didn’t want to mention it.” “If it’s written down,” he says, handing the pen back, “I won’t do it again.” He folds the letter in three, slides it back under the broken tile, and sits there until the minaret calls the dawn prayer."

[tracks.bond_hamid.chapters.b2.choices.laugh_it_off]
text = "Tell him a joke: my grandfather once got the hajj wrong by a whole year."
reply = "“When my grandfather was young he went on the hajj and lost count of the months on the way. He reached Jeddah just as everyone was coming home from Mecca. So he settled in at Jeddah and waited for the next one.” Hamid bursts out laughing. “And then?” “And then he became the best day-counter of any Kilwa man in Jeddah. A whole year with nothing to do—he learned everything. Lesson one: count the days first, talk after.” “Then I’ll learn it too.” He folds the letter, climbs down from the roof, lights a lamp and writes his reply himself. It takes him a long time, and he crosses out more than he keeps."

[tracks.bond_hamid.chapters.a1]
title = "Liongo’s Brother"
text = "One spring evening we sit on the steps outside the wall of al-Azhar, splitting a sesame cake from Khan al-Khalili. Hamid breaks it very carefully, holds the halves side by side, and pushes the bigger one to me. “Baraka,” he says, “if I never get to be a captain, does that mean I’ve lost to my brother?” I chew and don’t answer right away. Last month Karim’s ship put in at Aden, and every East African trader in Cairo who ran into Hamid opened with “How’s your brother?” Each time he answered, “Well,” and then went quiet. “You’re asking me?” I say. “My grandfather’s favorite hero never even got to sit on the throne.” “Who?” “Liongo.” Hamid sets his half of the cake on his knee, forgets to eat it, and waits for the rest."
news = "On the steps outside the wall of al-Azhar in Cairo you’ll often find two East African students sharing a sesame cake. One talks till dark; the other forgets to eat."

[tracks.bond_hamid.chapters.a1.choices.tell_liongo]
text = "Tell the whole tale of Liongo, right to the end: kneeling at the well, bow still drawn."
reply = "I tell him how Liongo’s mother wasn’t the chief wife, so the throne went to his brother. How he was thrown in prison and his mother sent him a loaf of bread with a file baked into it, and he asked for horns and drums to be played outside, and sang at the top of his voice until the song drowned out the rasp of the file on his chains. How in the end he died kneeling by the well with his bow still drawn, and for three days nobody in town dared go for water. When I finish, Hamid says, “That’s a bad ending.” “It is. But from Pate to Kilwa, everyone sings Liongo’s songs. And can you tell me the king’s name? When the storytellers mention him, he’s only ever ‘Liongo’s brother.’” Hamid thinks for a long time, then eats the rest of his cake. “Then I’d better get a name of my own.”"

[tracks.bond_hamid.chapters.a1.choices.show_path]
text = "Skip the story and drag him to the gatehouse to see his market map."
reply = "The map is pinned to the wall of the lodging quarter’s gatehouse. He drew it two years ago for the new boys: from al-Azhar to Khan al-Khalili, which lane is shorter, which coppersmith won’t cheat you, which water seller’s water came up from the Nile that morning. Now it’s covered in other people’s marks. Someone has drawn a star. Someone has written “pricey” beside a spice stall. In one corner a boy from Zeila has scrawled “thank you.” Hamid stands in front of it for a long time. “I forgot I ever drew this.” “A dozen people didn’t,” I say. “The one who opens the road doesn’t have to be the captain.” He reaches up and adds a word in front of “pricey”: “very.”"

[tracks.bond_hamid.chapters.a2]
title = "The Carved Boat That Went Wrong"
text = "Once autumn comes, Hamid spends every evening in the arcade whittling, and whenever I come near he covers the work with his sleeve. One day after the afternoon prayer he shoves a piece of wood into my hands. “It went wrong. Use it for kindling.” It’s a boat. Mast, gunwales, even the coir cord that stitches the planks together—all carved. Only the bow is off: the knife slipped and took out a big chunk. But he didn’t throw it away. He carved a gull into the gap, wings folded, perched right on the prow. “I meant to do one of our big family ships,” he says. “Halfway through I thought, why make it so big? I’m not trying to see whose is longer, mine or my brother’s.” “And the gull?” “It’s a patch.” He looks away. “There’s something carved on the bottom. Don’t look.” Naturally, I turn it over."
news = "In the arcade of Cairo’s Jabarti quarter, that Mogadishu student spent the whole autumn whittling. The shavings they swept up would fill a basket."

[tracks.bond_hamid.chapters.a2.choices.read_name]
text = "Read the name on the bottom out loud, and ask him what the boat is called."
hint = "The moment you turn the boat over, his hand comes down over the bottom. You’re not close enough yet for him to hear you read that name aloud."
reply = "His name is cut deep into the bottom: Hamid. “Hamid,” I read. “What’s the boat called?” “That,” he says. “Same as me.” “So now there are two Hamids on the sea.” “One’s plenty.” He pushes the boat back into my arms. “You keep the other one. Don’t lose it. If you do, I’ll carve another and put your name on the bottom, and it can soak in seawater every day.”"
effects = [{}, {}, {}, { title = "The Carved Boat That Went Wrong" }]

[tracks.bond_hamid.chapters.a2.choices.compare_boats]
text = "Tease him: take it and measure it against Karim’s big ship."
reply = "The words are barely out before Hamid snatches the boat back and holds it behind him. I’m about to apologize when he laughs first. “Fine, let’s measure. Mine has a gull. Does his?” But he doesn’t give it back. He tucks it inside his own robe. “I’ll hold on to it for now. Come and get it when that mouth of yours has grown a latch.” He claps me on the shoulder. “Before the sea fills it up for you.”"

[tracks.bond_hamid.chapters.s]
title = "You Have Your Sea"
text = "In December word comes up from Suez: the northeast wind has settled, and the ships south from Aden leave this month. Half the Jabarti quarter empties overnight. Hamid has one more chest than he came with, full of the monsoon tables he’s drawn up over three years, one roll for each year, tied with hemp cord. My things won’t fit, so I spend an afternoon haggling in Khan al-Khalili and come back with an old leather bag. On the last night we sit by the well again. The chipped water jar is where it always was. “You go back to Kilwa, I go back to Mogadishu,” Hamid says. “Lamu, Pate, Malindi in between. A whole sea.” “Plus the Kilwa accent you Mogadishu people can’t stand.” “No sea is wide enough to keep that out,” he says. “I’d hear you from half a coast away.” He turns the jar a half circle so the chip faces me. “Go on, then. How do we reckon it from here?”"
news = "Cairo’s Jabarti quarter is half empty this month, with all the East African students racing the northeast wind home. They say the Mogadishu boy’s chest is packed with nothing but monsoon tables."

[tracks.bond_hamid.chapters.s.choices.promise]
text = "Promise: every year before the northeast wind, a letter with your reckoned sailing day."
hint = "The one promise a lifetime allows, you’ve already given to someone else. Tonight all you can wish him is a fair wind."
reply = "“One letter a year,” I say. “Before the northeast wind comes, you write me the sailing day you’ve reckoned, and I’ll write you mine. Whoever’s closer gets to write first the next year.” Hamid considers it. “The loser should write first. That’s fairer.” “Then you’ll be writing first a lot.” He ignores me, takes a sheet of paper from inside his robe, and makes me recite my address in Kilwa. I do. He frowns as he writes, then turns the paper around. “You can’t even say the name of your own street right.” He spells it out again letter by letter, the way he fills in his monsoon tables, and his spelling beats my pronunciation. Toward dawn he shoulders his chest. At the gate of the lodging quarter he turns back. “I’ll write first. Don’t think that means I’m conceding.” “Then what does it mean?” “That I’m the only one who can get your address right.”"
effects = [{}, {}, {}, {}, { title = "You Have Your Sea" }, {}]

[tracks.bond_hamid.chapters.s.choices.own]
text = "Make it a race: who first owns a ship that isn’t the family’s."
reply = "“Letters are dull,” I say. “Let’s race. Whoever gets a ship of his own first. Not the family’s—one you paid for and named yourself.” Hamid’s eyes light up, brighter than the day he first got a monsoon right. He holds out his hand. “Then we’ll see whose tide comes in first.” I take it. His palm is all calluses from whittling. “The sea’s big enough,” I say. “Plenty of room for us to take our time.” “No time to take.” He lets go. “I’m five months older. I get a head start.” At dawn he leaves with his chest on his shoulder, and on his way out sets the chipped jar back on the rim of the well. He doesn’t look back. At the end of the lane he raises one hand and waves it, as if to say: just you wait."
effects = [{}, {}, {}, { title = "You Have Your Sea" }, {}]

[tracks.reunion_hamid]
name = "Hamid: His Own Name on the Door"

[tracks.reunion_hamid.chapters.reunion]
title = "His Own Name on the Door"
text = "The lanes of Mogadishu’s old town are narrow, and the white walls on either side are hot to the touch. At the harbor I ask for Hamid’s place, and the porter doesn’t ask which Hamid—he just points up a lane. At the end of it is a freshly painted door, and nailed over it a wooden board, the knife marks still crisp: THE HOUSE OF HAMID. Not “of such-and-such family,” not “son of so-and-so.” Just his name. Inside, someone is settling up with a porter; the voice is as quiet as ever, but the figures come quick and exact. I’m about to knock when a man on a donkey comes up the lane, reins in at the door and calls inside: “Hamid! You check the frankincense this evening—I can’t get away.” It’s Karim. He rides off without another word, the donkey kicking up a trail of white dust. Hamid comes out with a stack of ledgers in his arms, sees me, stops short—then dumps the whole stack into my arms. “Perfect timing. My monsoon ledgers for the last few years. Go through them from the start and see if I got anything wrong.”"
news = "There’s a new trading house in Mogadishu’s old town with Hamid’s own name carved over the door. The porters at the harbor say even his brother Karim calls him by name when he passes now."

[tracks.reunion_hamid.chapters.reunion.default]
effects = [{ text = "Baraka: The house is open, and it’s my name over the door. I carved the board myself, and this time it didn’t go wrong. The day before yesterday my brother passed the door and called out to me. He called me “Hamid,” and nothing in front of it. Just that once. I wrote it down, and now I’m writing it to you. This year’s sailing days are at the back, counted from Nawruz. I counted every one of them twice. Check them yourself, and if you find a mistake, write and tell me: one day off and I’ll stand you a dinner; a month off and I’ll feed you for a year. And if a Kilwa man can’t find a single one, he’ll just have to admit it—Mogadishu people can count. Hamid, at Mogadishu." }, {}]

[tracks.reunion_hamid.chapters.reunion.choices.check_ledger]
text = "Sit down and check his monsoon ledgers, cover to cover."
reply = "I spend two afternoons in his shop. One ledger a year, five in the stack. He pulls out the first two. “Those I kept for my brother. They don’t count.” That leaves three, and each begins on Nawruz, one box per day: the wind, which ship sailed, which ship came in how many days late, and why. His hand is smaller than it was in Cairo, and steadier. In the second ledger I find one: a ship bound for Hormuz, and on the return leg he’s logged a day too many. I put my finger on the box. He leans in and stares at the box, lips moving as he counts those days over again, and only then picks up his pen and corrects it. “First one in three years.” “Fewer than me,” I say. “I can find three a year in my own books.” He takes me to dinner: mutton and rice, and tea with cardamom. Halfway through, Karim pushes the curtain aside, finds himself a seat, helps himself to a piece of mutton and says to me, “This little brother of mine counts better than I do these days.” Hamid doesn’t look up. He just slides the teapot across to his brother."
effects = [{}, {}, {}, { title = "His Own Name on the Door" }]

[tracks.reunion_hamid.chapters.reunion.choices.race_south]
text = "Leave the ledgers for later and challenge him: sail at dawn, first ship to Lamu wins."
reply = "“The ledgers can wait,” I say. “We sail at dawn and race. First one to Lamu.” Hamid tosses the ledgers back through the door. “Your ship draws too much water. You’ll have to go around the Bajuni shoals by the open sea.” “Then I’ll go around. I’ve got the wind.” “The wind belongs to everybody.” Before first light the next day, the two ships leave Mogadishu within a stone’s throw of each other. He hugs the coast and threads the gaps in the reef; I chase him on the open sea for three days, and it’s noon on the fourth before I sight the dunes of Lamu. He’s already sitting on the harbor steps with a basket of coconuts at his feet, two of them already opened. “Half a day late.” He hands me one. “The tide’s on my side this year.” “And next year?” “Next year, do your own reckoning. Come back when you get it right.”"
effects = [{}, {}, {}, { title = "His Own Name on the Door" }]

[tracks.reunion_hamid.chapters.reunion.variants.v1_promise]
text = "For five years his letter came every year before the northeast wind, the sailing day on the first line, and not once did he misspell my address. This year’s had one extra line: “Come to Mogadishu. I have something to show you.” At the harbor I ask for Hamid’s place, and the porter doesn’t ask which Hamid—he just points up a lane. At the end of it is a freshly painted door with a wooden board nailed above it: THE HOUSE OF HAMID. Just his name. I’m about to knock when a man on a donkey reins in at the door and calls inside: “Hamid! You check the frankincense this evening.” It’s Karim. He rides off, the donkey kicking up a trail of white dust. Hamid comes out with a stack of ledgers in his arms, and isn’t the least surprised to see me. “I reckoned you’d get here today. Was I right?” He dumps the ledgers into my arms. “My monsoon ledgers for the last few years. Go through them from the start.”"

[tracks.reunion_hamid.chapters.reunion.variants.v2_own]
text = "We had a race on: who would be first to own a ship. When my ship tied up at Mogadishu, I had a whole speech of boasting ready. I ask at the harbor for Hamid’s place, and the porter doesn’t ask which Hamid—he just points up a lane. At the end of it is a freshly painted door with a board nailed above it: THE HOUSE OF HAMID. I’m about to knock when a man on a donkey reins in at the door and calls inside: “Hamid! You check the frankincense this evening.” It’s Karim. He rides off without another word. Hamid comes out with a stack of ledgers in his arms and glances first at the harbor behind me. “You got your ship first. I got my door first.” He shoves the ledgers at me. “Call it even. If you don’t like it, check my monsoon ledgers for the last few years and find something wrong.”"
