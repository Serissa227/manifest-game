[tracks.reunion_amihan_dagat.chapters.reunion.variants.v2_promised]
text = "The water that rainy season was higher than anyone remembered. When my ship came into the river mouth, the stilt houses stood half drowned, and the old notches on the bamboo posts were all underwater. A flat-bottomed boat cut across between two rows of houses, its two floats skimming the surface, a board let down from its side to rest on someone’s windowsill. It was Amihan poling. She was darker from the sun, with a new scar on her arm. When she saw it was me she drove the pole into the water. “You said you’d ride the first run. The first run left long ago—seven people brought out.” She shoved the board toward me. “This run counts as yours. Get in! As for the name on the step—once the water goes down, stand on it and I’ll say it for you.” I jumped into her boat and we took people off house by house. Old people walked aboard on that board. A child clutching a chicken refused to let go of it, so Amihan took the chicken too. Near dark, I pointed down a narrow gap between two rows of houses. “Cut through here. It’s quicker.” She gave it one look. “That one closed long ago. The flood two years back brought down a tree across it.” She knocked the pole against the side. “Half the channels you remember have moved. I’ll draw them for you again.”"

[tracks.reunion_amihan_dagat.chapters.reunion.variants.v3_own]
text = "The water that rainy season was higher than anyone remembered. When my ship came into the river mouth, the stilt houses stood half drowned, and the old notches on the bamboo posts were all underwater. A flat-bottomed boat cut across between two rows of houses, its two floats skimming the surface, a board let down from its side to rest on someone’s windowsill. It was Amihan poling. She was darker from the sun, with a new scar on her arm. When she recognized me, the first thing she looked at was my ship, bow to stern. “Count the years. I was first.” She swung up her pole. “We’ll settle the hull scraping later. Come and lend a hand!” I jumped into her boat and we took people off house by house. Old people walked aboard on that board. A child clutching a chicken refused to let go of it, so Amihan took the chicken too. Near dark, I pointed down a narrow gap between two rows of houses. “Cut through here. It’s quicker.” She gave it one look. “That one closed long ago. The flood two years back brought down a tree across it.” She knocked the pole against the side. “Half the channels you remember have moved. I’ll draw them for you again.”"
