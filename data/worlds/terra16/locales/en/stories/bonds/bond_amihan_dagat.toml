# C7 羁绊线（2026-10-11，Claude Opus 重写）：stories/bonds/bond_amihan_dagat.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 fly_kite 第 4 个、keep_kite 第 5 个；s promise 与 heart 第 6 个、own 第 4 个；
#   reunion 三个选项第 4 个是 memory；reunion default 第 1 个是 letter。
# 街名的译法：早潮巷 Early Tide Lane、螃蟹门 Crab Gate、歪脖子 Crooked Neck。主角不写性别（不用 he/she 指“我”）。

[tracks.bond_amihan_dagat]
name = "Amihan: Street Names Made by the Tide"

[tracks.bond_amihan_dagat.chapters.c1]
title = "Street Names Made by the Tide"
text = "The datu’s household sent me with a letter for a Chinese shipowner down at the river mouth. The map they gave me was perfectly clear: over two bamboo bridges, turn left, third row of stilt houses. But under the second bridge there was nothing but a ditch of black mud, and to the left there was no path at all—only bamboo posts driven into the mud, their feet crawling with tiny crabs. I was standing at the edge with the letter in my hand when a little boat slid out from between the posts. The girl poling it was barefoot. She looked at my map, then at my shoes. “The one you want is Early Tide Lane.” She tapped the mud with her pole. “Right now it’s mud. In an hour it’ll be a lane. Get in and wait.” I got in. Her name was Amihan; her family built boats. We sat in the boat waiting for the water while she pointed out the notches cut into the posts and named them one by one: this one was Crab Gate, that one Crooked Neck, and the one farther in with three notches was only any use in a flood year. The water came up a finger’s width at a time. First the crabs went under, then the notches. By the time I looked up, the dead end had joined into a street, and people on both sides were lowering baskets from their windows. Amihan pushed us off with one stroke of the pole. “This channel opens only at high tide.”"

[tracks.bond_amihan_dagat.chapters.c1.choices.learn_names]
text = "Carve each name she calls out into the strip of bamboo I carry."
reply = "I cut the names into the bamboo with my knife, one stroke every time the boat rocked. Amihan leaned over to look and laughed so hard she slapped the gunwale. “Crab Gate. Not Crabs Gate.” I went to shave it off and start over, but she put her hand on mine. “Leave it. At low tide that’s exactly what it is—crabs, a whole nest of them.” By the time the letter was delivered, there were seven names on the strip. One of them was wrong, and she said that one was the most accurate."

[tracks.bond_amihan_dagat.chapters.c1.choices.bet_mud]
text = "Bet her I can walk across the mud without waiting for the tide."
reply = "“What’s the stake?” “You name it.” I jumped out. On the second step I sank to the knee; on the third I couldn’t pull my foot free. Amihan laughed so hard she nearly lost her oar, and only when she was done laughing did she hold it out so I could grab the blade and haul myself back aboard. “I’ve decided the stake.” She knocked on the hull with the end of her pole. “This bottom. You scrape it for a month.” I sat in the bow picking mud off my legs as the water closed over the two holes I’d left."

[tracks.bond_amihan_dagat.chapters.c2]
title = "The Low Floors Flood First"
text = "Once the southwest wind set in, the rain never stopped. The day after the first big storm, Amihan called to me from the schoolhouse door. “Can you pole a boat? Come even if you can’t. You’re poling for me.” She went house by house, cutting this year’s water mark into the bamboo posts, and for every notch she made a mark on a palm leaf. She wanted to know whose floor would flood first. The little knife she used was her father’s, its handle wrapped in fishing line, and she cut quick and shallow—deeper cuts hurt the posts, she said. I poled and watched her leaf, and when I counted the houses around the bend, one was missing. “What about the old woman in the bend?” Amihan’s knife stopped in midair. We both knew that house: half a story lower than its neighbors, standing on its own, one old woman living there alone. “She flooded last year.” Amihan bit her lip and turned the leaf over, then back again. “How could I have missed her?” Rain drummed on the boat’s awning. Over by the bend the water had already turned yellow."

[tracks.bond_amihan_dagat.chapters.c2.choices.mark_post]
text = "Keep cutting with her, house after house, and add the one in the bend."
hint = "She slides the knife back into her belt. Those notches are her family’s craft, and you’re not close enough yet to touch them."
reply = "We went house to house until dark, and the last post was the old woman’s in the bend. Amihan turned the knife around and held it out to me, handle first. “You do it.” I just stared at it. “The notches are our family’s craft. Nobody outside the family touches them.” She pressed the knife into my hand. “Today’s an exception. Shallow.” When I was done she brought the torch close and looked. “A little crooked. Next rainy season, when the water comes, we’ll see if you got it right.”"

[tracks.bond_amihan_dagat.chapters.c2.choices.carry_jar]
text = "First, get the old woman’s rice jar up into the loft."
reply = "We poled straight to the old woman’s door; the water was already over the sill. The jar was heavier than I’d guessed. She and I took a side each and worked it up the ladder one rung at a time, and the moment it was settled, the bottom of the ladder was underwater. Amihan stayed in the boat the whole time, holding on to the doorframe, and said nothing. On the way back she turned the palm leaf over and cut the old woman’s name on the first line. She cut it deep."

[tracks.bond_amihan_dagat.chapters.b1]
title = "When the Shortcut Closes"
text = "When the rains were over, the river mouth held its usual boat race: from the ferry landing out to the deep water where the Chinese ships moored, and the first to touch a hull won. I had my shortcut picked out already—straight through the mangroves, a good piece shorter. The first stretch really was faster; looking back, I could see Amihan swinging wide along the main channel. Farther in, the water went shallow all at once. The hull gave a crack and jammed between two mangrove roots arching out of the water, and I could go neither forward nor back. A shout went up in the distance. Amihan had touched the hull. A while later she rowed back in, dripping sweat, wedged her oar into the gap between the roots and heaved. My boat rocked twice and slid back into the water. “That shortcut belongs to the ebb,” she panted. “It’s the fifth day after the full moon. At this hour the water in there only comes to your ankles.” “How do you know it’s the fifth day?” “I count.” She held up her fingers. “From the night of the full moon, the tide comes a little later every day. Keep count and you always know when it’ll be there.” The root that had caught me was left with a fresh white scar."

[tracks.bond_amihan_dagat.chapters.b1.choices.ask_count]
text = "Ask her to teach me how to count the tides from the full moon."
reply = "She tapped on the gunwale with her knuckle—one tap for each day, an hour named with every tap. On the back of my bamboo strip I kept track of how much later the tide came each day, one notch a day, working down the strip. On the ninth day I lost count and wanted to scrape it all off and start again. Amihan stopped me. “Leave the mistake. Next time you go into those trees, the roots will tell you which day you got wrong.”"

[tracks.bond_amihan_dagat.chapters.b1.choices.rematch]
text = "Challenge her to race again next month. This time I’ll wait for the tide."
reply = "“Done.” Her eyes lit up. “Double the stake. Two months of hull-scraping.” The next month I waited for the tide to come all the way in before I went into the trees, and I didn’t touch a single root the whole way through—and I still lost by half a boat length. This time she didn’t laugh. She jumped into my boat, gripped the shaft of my oar, then measured it against her own. “You waited right. Your oar’s too short, and your hands are slow.” The next day she came over with a freshly whittled oar on her shoulder, shavings still clinging to the blade."

[tracks.bond_amihan_dagat.chapters.b2]
title = "The Rolled-Up Map"
text = "That spring a Chinese junk dropped anchor outside the river mouth and sent word asking for someone who knew the channels to bring her in. Amihan’s father saw the messenger to the door, all courtesy, and would not budge an inch. “The channels are how this family eats.” That night Amihan called me to her family’s boat shed. It smelled of tung oil. She climbed up the boat frame and brought down a roll of oiled paper from the rafters. “I used to keep it under the floorboards of my little boat. Too damp in the rains, so I moved it up here.” She crouched and unrolled one corner only, holding the rest down with her palm. On the paper was the river mouth: channel after channel, small writing and numbers beside them—some of the names were her father’s, some were her own. “My father doesn’t know this exists.” She pointed at a bend. “Here, I’ve got it as waist-deep. But last low tide it looked shallower, and I can’t be sure.” The lamp flickered, and she drew the corner a little closer to her chest. “Nobody gets this map. I only want to know whether I drew it right.”"

[tracks.bond_amihan_dagat.chapters.b2.choices.check_depth]
text = "Promise to tell no one, and pole out with her before dawn to sound that spot."
hint = "She tucks the roll of paper a little farther behind her back. It isn’t time to let you look closely yet."
reply = "It was still dark when we set out. Down went the bamboo pole and up it came, and she pinched the wet line with her fingernail. Three soundings, and all three agreed: a finger shallower than her map. Amihan crouched in the bow and corrected the number by the first gray light. “One finger off, and that junk would be sitting in the mud.” As she rolled the paper back up, she said, “You’re the second person who’s seen it.” I asked who the first was. She tapped her own forehead with the roll."

[tracks.bond_amihan_dagat.chapters.b2.choices.urge_share]
text = "Urge her to let the junk’s pilot glance at it, before the ship runs aground."
reply = "Her face went cold at once. The paper was rolled up, pushed back onto the rafters, and the lamp blown out. “You don’t understand.” In the dark I heard her climb down the frame. Two days later she was waiting for me outside the schoolhouse, a coil of wet rope over her shoulder. “That junk came in,” she said. “I stood in her bow and called the depths, one stretch at a time, all the way in. The map stayed in the rafters. Nobody saw it.”"

[tracks.bond_amihan_dagat.chapters.a1]
title = "The Boat She Wants to Build"
text = "The northeast wind had been blowing for over a month, and the mud at the river mouth had dried pale. After lessons Amihan crouched under the mango tree, drawing a boat in the sand with a stick. It was flat-bottomed, with a float reaching out on either side, wider and lower than anything her family had ever built. “The year of the big flood,” she said without looking up, “people around the bend sat on their roofs for two days. Keeled boats couldn’t get in. The water between the stilt houses was too shallow and the posts too close together.” She drew a few crossways lines in the hull. “Flat bottom, shallow draft. Two floats, so even if someone climbs up one side it won’t tip.” She handed me the stick. “Find what’s wrong with it. If you can’t, you squat here till dark.” I walked once around the boat in the sand. At the empty space by the stern she wrote a few letters, rubbed them out, and wrote them again. “It’ll be called Amihan,” she said. “The dry-season wind is the steadiest. It doesn’t change direction all season. A boat that saves people has to be like that.” The wind came down from the north, and a fine skin of sand drifted along the boat’s edge."

[tracks.bond_amihan_dagat.chapters.a1.choices.find_fault]
text = "Point out that the sides are too low; fully loaded, she’ll ship water."
reply = "She crouched and studied it a long time, then used the stick to raise each side by a hand’s width—and stopped. “But I made them low so old people could step in over the side.” We frowned at the new line together. In the end it was she who cut a gap in the side and drew a board that could swing down: shut while sailing, lowered for a rescue, like a step. Beside it she wrote one word: gangboard."

[tracks.bond_amihan_dagat.chapters.a1.choices.hold_lantern]
text = "Find no fault. Just hold the lamp for her until she’s drawn the last rib."
hint = "She doesn’t like anyone hovering while she draws a boat. You’re not close enough yet to stay with her until dark."
reply = "When it got dark I lit the lamp and held it over her shoulder. She drew a rib; I moved a step. The oil burned out, so I ran to the kitchen and came back with a coconut shell full of coals. The red glow lit a patch of sand no bigger than a hand, so she lay flat on her stomach and drew in that. When she finished the last rib she sat up, sand all over her face and hair. “Come back tomorrow. Tomorrow I draw the floats.” I said I would. She added, “If you don’t come, I’ll draw them crooked.”"

[tracks.bond_amihan_dagat.chapters.a2]
title = "The Kite with the Channels on It"
text = "A few days before the southwest wind was due, Amihan was waiting outside the schoolhouse with something wrapped in banana leaves, longer than her arm. It was a kite. The bamboo frame was whittled impossibly thin, and the paper was covered in winding lines with small writing beside them: Early Tide Lane, Crab Gate, Crooked Neck, a few names I’d never heard, and a few numbers. It took me a long while to see what it was: the stretch of water from the ferry landing to her family’s boat shed, every deep spot and shallow one marked, in more detail than her father ever gave out loud. In one corner she had added a fish. “Maps can’t be given away.” Amihan wound the kite string twice around her finger. “But anybody can fly a kite, right? Flying a kite isn’t piloting.” She pushed the spool into my hand. “Once you’ve gone to sea—when you’re coming home and you see a kite from the deck, you’ll know which way to come in.”"

[tracks.bond_amihan_dagat.chapters.a2.choices.fly_kite]
text = "Fly the kite right here at the river mouth."
hint = "She hasn’t finished painting this kite. You’ll have to be a little closer before she puts it in your hands."
reply = "The wind at the river mouth was strong, and the moment I let go the kite shot up, the painted channels trembling against the sky. I didn’t know how to work the line and kept pulling it tighter, until Amihan reached around from behind, took the spool, and let out half a turn. “Give it some slack, like waiting for the tide. Pull too hard and it fights you.” When we reeled it in it was nearly dark. With her thumbnail she pressed a few marks into the frame: today’s date."
effects = [{ }, { }, { }, { title = "The Kite with the Channels on It" }]

[tracks.bond_amihan_dagat.chapters.a2.choices.keep_kite]
text = "Take it, and tell her every high tide will remind me of this shortcut and who drew it."
hint = "That kind of thing can’t be said out loud yet."
reply = "Amihan turned her face away and gave the string a hard yank that made the frame creak. “Don’t say things like that.” After a moment she turned back and pointed at one thin line on the paper. “This shortcut only opens on the third day after the full moon. Any other day you go in there, you get stuck on the roots. You’d better remember.” Then she walked off. A dozen steps away she turned around and shouted one more thing: “The third day!”"
effects = [{ }, { }, { }, { }, { title = "The Kite with the Channels on It" }]

[tracks.bond_amihan_dagat.chapters.a2.choices.too_precious]
text = "Tell her something this precious is hers to keep."
reply = "Amihan thought about it and wrapped the kite back in its banana leaves. “Fair enough. I’ll hang it in our boat shed. Nobody would ever think to look.” I thought that was the end of it. The next day she pushed a little one into my hands, no bigger than my palm, with a single curve painted on it and three words: Early Tide Lane. “This one doesn’t matter,” she said. “This one you can have.”"

[tracks.bond_amihan_dagat.chapters.s]
title = "A Place to Come Ashore"
text = "The northeast wind had risen again, and the water at the river mouth ran clearer every day. Amihan heard from her father that I was shipping out, and she didn’t come to lessons that afternoon. At dusk she was waiting for me under the boat shed. On the side facing the water, a few stone steps ran down into the river. “I looked for days.” She crouched on the steps. “At low tide the quay is all mud. At high tide the ferry landing goes under. Only here—” she patted the step beside her, “—at high tide there’s still one step showing, and at low tide there’s still one. Whenever you come back, there’ll be a step to stand on.” I counted. Four steps were above the water, and the top one wore a coat of green moss. “If we’re going to meet again, it’s here,” she said. “Send word by some ship before you come back, so I can work out the tide.” The north wind pushed into the shed, and the fishing net hanging from the rafters slapped against a post, again and again."

[tracks.bond_amihan_dagat.chapters.s.choices.promise]
text = "Promise that on the day her rescue boat is launched, I’ll come back and ride the first run."
hint = "A promise like this takes a deeper bond to make, and a lifetime allows only one. This time, all you can do is shake hands."
reply = "“That’ll be years. The timber has to season, the money has to be saved, and my father hasn’t said yes.” “I’ll wait.” Amihan looked at me a long while. Then she drew the knife she used for water marks from her belt and began to cut into the top step. Stone is harder than bamboo, and she cut slowly, stroke by stroke, until there was a name I had never seen. I asked which lane it was. “No lane.” She put the knife away. “It’s this step’s name. Only the two of us will know how to say it.” She wouldn’t tell me how it was pronounced. On the day the boat was launched, she said, I would stand right here, she would row over to fetch me, and she’d tell me then. The tide came in over the three steps below. The step with the name on it stayed above the water."
effects = [{}, {}, {}, {}, {}, { title = "A Place to Come Ashore" }, {}]

[tracks.bond_amihan_dagat.chapters.s.choices.heart]
text = "Tell her that when we’re grown and I come home, she’s the first one I want to see."
hint = "Those words won’t come yet. The two of you haven’t gotten that far."
reply = "Amihan went still, and stayed that way so long that the water rose another half step and covered her feet, and she didn’t move them. “The water isn’t up yet,” she said at last, very low. “What’s your hurry? When you come back, stand on this step, and I’ll give you my answer. Not a day sooner.” She stood, brushed the moss off her knees, reached out, and took my hand—quickly, her fingers gritty with tung oil and sand—then let go and turned her back to coil a rope, which only got more tangled until it ended in a hard knot. “Go home. The wind’s coming up.” She didn’t turn around. I climbed up the bank. When I looked back, she was still standing on the top step, one hand gripping the other."
effects = [{}, {}, {}, {}, {}, { title = "A Place to Come Ashore" }, {}]

[tracks.bond_amihan_dagat.chapters.s.choices.own]
text = "Promise another race: who gets a boat of their own first."
reply = "Amihan sprang up from the step, held out her hand, and we slapped palms with a crack. “Loser scrapes hulls for a year.” “Whose hulls?” “The winner’s.” She jumped off the steps into the shed and came out with a knotted cord and a lump of charcoal—her father’s measuring cord, one knot to a cubit—and started measuring the timber stacked against the wall, one length after another, marking each number on a post in charcoal. I stood on the steps a long time and she never once looked around, counting knots under her breath, until I was leaving and she called through the wall of the shed: “One year! Don’t forget!” Early the next morning I heard she’d asked her father for a patch of ground by the boatyard, saying she meant to start building on her own, timber on credit."
effects = [{}, {}, {}, { title = "A Place to Come Ashore" }, {}]

[tracks.reunion_amihan_dagat]
name = "Amihan: The Channels Keep Moving"

[tracks.reunion_amihan_dagat.chapters.reunion]
title = "The Channels Keep Moving"
text = "The water that rainy season was higher than anyone remembered. When my ship came into the river mouth, the stilt houses stood half drowned, and the old notches on the bamboo posts were all underwater. A flat-bottomed boat cut across between two rows of houses, its two floats skimming the surface, a board let down from its side to rest on someone’s windowsill. The person poling it swung the pole up at me. “Don’t just gawk! Come and lend a hand!” It was Amihan. She was darker from the sun, with a new scar on her arm, and her voice when she shouted hadn’t changed a bit. I jumped into her boat and we took people off house by house. Old people walked aboard on that board. A child clutching a chicken refused to let go of it, so Amihan took the chicken too. When the boat was full we ferried them to the upper floor of the Chinese shipowner’s house, unloaded, and went back. Near dark, I pointed down a narrow gap between two rows of houses. “Cut through here. It’s quicker.” Amihan gave it one look. “That one closed long ago. The flood two years back brought down a tree, and it’s lying across it with all the mud piled up behind.” She knocked the pole against the side. “Half the channels you remember have moved. I’ll draw them for you again.”"

[tracks.reunion_amihan_dagat.chapters.reunion.default]
effects = [{ text = "The letter was written on kite paper, folded in four, tough enough not to mind the damp. “The boat’s launched, and she’s called Amihan. The first run into the bend brought out seven people, and a baby just three days old—its mother carried it aboard across the gangboard. The gangboard works. I’m sending you a newly drawn map of the channels. The flood two years ago brought a tree down across Early Tide Lane, and that way is dead now; Crab Gate has moved two posts south. Whatever you remember from before, don’t use it, or you’ll stick on the roots for sure. This one’s drawn on kite paper. Wherever you are, you can fly it and take a look. Next time you’re coming, have a ship carry word ahead, and I’ll reckon the tide for you. —Amihan”" }, {}]

[tracks.reunion_amihan_dagat.chapters.reunion.choices.redraw]
text = "Redraw the shifted channels with her, and mark the new moorings."
reply = "The rain kept on, so we drew in the boat shed. She called out, I drew; when I drew it wrong, she rapped my knuckles with the charcoal. The new map had seven moorings on it that the old one didn’t—places where a small boat could tie up in a flood and people could climb onto a roof—and she told me, one by one, whose posts were the soundest. We drew until the rain stopped and the sky went pale. She made two copies, rolled one up and pushed it at me, and nailed the other with bamboo pegs to the outermost post of the shed, facing the river. “My father will shout.” She patted the nailed sheet. “Let him. Last year two people drowned in the bend because whoever was poling didn’t know that channel had moved.” Early the next morning three boatmen were already standing in front of the post, copying it stroke by stroke onto their own strips of bamboo."
effects = [{ }, { }, { }, { title = "The Channels Keep Moving" }]

[tracks.reunion_amihan_dagat.chapters.reunion.choices.stay_on_boat]
text = "Don’t go back to the ship tonight. Stay in her boat shed and finish what I started saying years ago."
hint = "Words like these need to have been begun years ago on the stone steps, and a heart ready for them, before they can be said today."
reply = "That night I didn’t go back to my ship. A single lamp burned in the boat shed, and the rain on the palm thatch sounded like someone scattering rice by the handful. I said again what I had said on the stone steps all those years ago, and this time I left off “when we’re both grown.” Amihan listened, whittling a wedge for one of the floats the whole time, and only put it down after the last cut. “I guessed you’d say it again,” she said. “I was waiting for the tide.” She sat down beside me and leaned her head on my shoulder; her hair smelled of tung oil. Outside, the water climbed one step and then another, over the stone stairs, until only the top step was left above it. She took my hand. “It’s reached this step. Here’s my answer.” Then she turned her face to mine and kissed me."
effects = [{ }, { }, { }, { title = "The Channels Keep Moving" }]

[tracks.reunion_amihan_dagat.chapters.reunion.choices.race_again]
text = "Once the rain stops, race her again: her rescue boat against my skiff."
reply = "The day after the rain stopped, word got around the river mouth that we were racing, and the rooftops filled with people come to watch. Same course as always, ferry landing to deep water. Her flat-bottomed boat was as clumsy as a door, and she was two lengths behind at the start. I led the whole way, reached the mouth of the mangroves, and went straight in without a thought—and stuck again, on a root that hadn’t been there before. By the time I’d pried myself loose she had swung wide and won, and was sitting in her bow wringing out her shirt. She hoisted her oar onto her shoulder. “All those years at sea, and you still haven’t learned to wait for the water.” She hopped into my boat to look at the root and pressed a mark into it with her thumbnail. “That one’s yours. Next time you’re back, see how thick it’s grown.”"
effects = [{ }, { }, { }, { title = "The Channels Keep Moving" }]

