# 金文永：先学道歉（bond_kim_munyeong）与重逢（reunion_kim_munyeong）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_kim_munyeong]
name = "Kim Munyeong: Learn the Apology First"

[tracks.bond_kim_munyeong.chapters.c1]
title = "Learn the Apology First"
text = "On the first day at the interpreters’ school I expected to learn how to greet the merchants from Tsushima, the big hearty greeting you could use the moment you stepped through the Japan House gate. Instead Kim Munyeong slid two slips of paper under the inkstone, one in Korean and one in Japanese. Both were apologies. “Anyone can learn a greeting in three days.” He spoke slowly, letting the words out one at a time. “Learn these early. Then when you really hurt someone, you’ll have more to say than ‘I don’t understand.’” I thought it was a gloomy way to begin, but I read the Japanese slip aloud to him anyway. He shook his head. “Too light. Like you stepped on his foot.” I put more weight on it. “Too heavy. Like you’re about to throw yourself down a well.” He turned the slip around and set a dot of ink under one word. “Come down hard here, then pull back. The listener shouldn’t have to guess how sorry you are. You put the weight in yourself.” Outside, over by the Japan House, a fishmonger was bawling his wares, and what he was shouting was that big hearty greeting."

[tracks.bond_kim_munyeong.chapters.c1.choices.practice_apology]
text = "Read both slips five times each, leaning on his ink dot."
reply = "By the third time my tongue was tripping. By the fifth he nodded. “That one, a Tsushima man would believe.” I asked how he could tell. He folded the two slips together and tucked them into my sleeve. “I’ve been apologized to a hundred times at the Japan House. I believed three.” I asked who the three were. He said that was the next lesson. Today’s was over."

[tracks.bond_kim_munyeong.chapters.c1.choices.ask_greeting]
text = "Insist on the big greeting first. Apologies can wait."
reply = "He didn’t argue. He taught me the greeting, down to the little drawl a Tsushima accent puts on the end. When he was done he said, “Now you can open a conversation. You can’t close one.” The next day at the Japan House I got an old merchant’s name wrong. His face went dark, and I stood there with my mouth open and nothing in it but the greeting. Munyeong stepped up from behind me and apologized for me, with the line from the slip, landing squarely on the ink dot."

[tracks.bond_kim_munyeong.chapters.c2]
title = "One Level of Respect Short"
text = "A wooden board hung by the Japan House gate with the hours the Tsushima men could come and go, bleached pale by the sea wind. Inside, an old merchant from Tsushima was looking over the reply we had brought. I said something offhand as I handed it to him, and his face closed. He put the letter down on the desk and would not take it. I had no idea what I’d done. Munyeong, standing beside me, didn’t smooth it over. He only said under his breath, “You were one level short. You spoke to him as if he were your equal.” The old man spoke again, mumbling, half of it swallowed. Everyone in the room was waiting for Munyeong to translate. Instead he bowed slightly to the old man. “Say it again, please—word for word.” The old man blinked, and then he really did say it again, every word clear this time. Munyeong heard him out and turned to me. “He says when the young don’t know their manners, it’s whoever brought them who failed to teach them.” A pause. “That one’s aimed at me.” He tipped his chin toward the gate. “Out. Start again from the board.”"

[tracks.bond_kim_munyeong.chapters.c2.choices.go_back]
text = "Walk back to the board with him, come in again, and say it right to the old man’s face."
hint = "“Your mistake. You go back.” He doesn’t think of you yet as someone worth walking that far with."
reply = "I came in again from the board, bowed, and lifted my speech one level. The old man heard me out, nodded, and said something I couldn’t follow. Munyeong put it into Korean for me: “A young one who comes back is rarer than one who gets it right.” Outside the gate he pulled a stub of charcoal from inside his cuff and wrote a few words on the lining. I asked what he was writing. “What he said.” He turned the cuff back down. “I’d never heard anyone put it that way either.”"

[tracks.bond_kim_munyeong.chapters.c2.choices.ask_why]
text = "Stop him first and make him explain exactly where I went wrong."
reply = "He stood under the board and lectured for a quarter of an hour: which ending should go up a step, which verb should be swapped out, how you speak to an equal and how you speak to an elder. When he’d finished he said, “It’s too late to go back now.” We went in anyway. The old man’s seat was empty, and our letter lay on his desk where he’d left it, unopened. Munyeong picked it up and checked the date on it. “Next time, a quarter of an hour sooner.”"

[tracks.bond_kim_munyeong.chapters.b1]
title = "Who Remembers It Right"
text = "In the autumn the school held an interpreting contest. The teacher brought in a merchant from the Japan House to say a few lines of haggling, and the two of us had to put them into Korean on the spot, each on our own sheet. I handed mine in first. It read smoothly; the teacher read it out and the other students nodded along. Kim Munyeong was a good while behind me, and his version stumbled. In one place he had drawn a circle, and beside it in small characters: “Could be ‘let us discuss it again,’ could be ‘I won’t sell.’ Not clear from what he said.” The teacher ruled me quicker and him more accurate. I leaned over and laid the two sheets side by side. Where the merchant had been vague, I had written, “Push the price any lower and I won’t sell.” Munyeong had written down only the half sentence the man actually said. “He never said ‘won’t sell.’” Munyeong put his finger on my line. “You made up his mind for him.” “That’s what he meant.” “How do you know?” He looked at me and waited, as if it were a real question that needed a real answer."

[tracks.bond_kim_munyeong.chapters.b1.choices.mark_mine]
text = "Do it his way: strike out the “won’t sell” I put in the merchant’s mouth."
reply = "I struck out “and I won’t sell” and left only “push the price any lower…” My version came up a good deal shorter, and dry as a husk. “Dry is what he said,” Munyeong told me. I said what he said sounded terrible. He squared the two sheets and flattened them under a paperweight. “Terrible, but it’s his. It isn’t yours.” The next day the teacher pinned our two sheets together and hung them on the schoolroom wall."

[tracks.bond_kim_munyeong.chapters.b1.choices.defend_mine]
text = "Stand by my version: the meaning held, and the merchant himself can settle it."
reply = "We chased the merchant down at the Japan House gate and asked him to listen to both sheets. He laughed and said both were right. That was exactly what he’d meant; he just hadn’t wanted to say it flat out in front of the teacher. Munyeong stood there stunned. After a while he traced over the circle on his sheet and added a line beside it in small characters: “Asked the man who said it. ‘Won’t sell.’” Next time, he said, he would circle one place fewer."

[tracks.bond_kim_munyeong.chapters.b2]
title = "Rumors in the Eulmyo Year"
text = "Late in the fifth month the news came up the coast from the west: more than seventy ships off Dalyang in Jeolla, the town burned, fighting for days. The story changed every day in the streets. Some said the ships came from Tsushima; others said not one Tsushima ship had been there. On the third day men from the Dongnae office walked into the Japan House and took several Tsushima merchants back to the office to be questioned in the hall, and Kim Munyeong was sent for to interpret. The official pounded the desk and said a sentence; the merchants, heads bowed, answered with one. During a pause the clerk at the official’s elbow leaned over and murmured to Munyeong: make it harsher, let them know who they’re dealing with. A moment later an old merchant had someone slip him a note begging him to make it softer. Munyeong folded the note into his sleeve without reading it. “He gets it back when we’re done.” He found me sitting by the threshold and spoke even more slowly than usual. “Come sit beside me. Write down what both sides say, line by line, exactly as they say it. And what I put across, write that down too.” He pushed a stack of paper and a brush toward me, and his fingers stayed pressed on the corner of the sheets a moment before he let go."

[tracks.bond_kim_munyeong.chapters.b2.choices.take_notes]
text = "Sit beside him and take down both sides word for word, changing nothing."
hint = "He’ll only let someone he trusts sit on that bench in the hall. You’re not close enough yet."
reply = "The questioning went on for four hours. I filled seven sheets and my wrist ached. The merchants were sent back to the Japan House, and the official had nothing more to say. Outside the Dongnae office Munyeong leaned against the wall, his hands shaking so badly he couldn’t tie the strings of his cuffs. “There was one line I almost softened.” It was the official’s question about where the Tsushima ships had gone. I found the fifth sheet and showed him: I had taken that line down as it was said, and he had put it across as it was said. He studied the page for a long time. “The words are here. That’s enough.”"

[tracks.bond_kim_munyeong.chapters.b2.choices.ask_soften]
text = "Quietly urge him to tone down the official’s threats before somebody gets hurt."
reply = "He shook his head and said only, “As spoken.” He put the official’s words across exactly as they were. The old merchant went white and stayed down on the floor a long time without raising his head. The questioning ran until dark, the merchants were sent back to the Japan House, and nothing came of it. On the way home Munyeong said, “A soft version saves him today. Tomorrow the official asks again from my soft version, and his answers won’t match.”"

[tracks.bond_kim_munyeong.chapters.a1]
title = "The Line That Needs No Translation"
text = "After the new year there was more business at the Japan House, and Munyeong was often called in to check accounts, with me along to take notes. He was also going through the old Japan House ledgers; there was a payment in there, he said, that had been mistranslated years ago, and sooner or later he would set it straight. That day, when the last entry was settled, the sun was already low, and we walked home along the shore outside the Japan House. The tide had gone a long way out, and the rocks stood up one after another, draped in dark green weed. He was walking ahead of me. All at once he stopped on a rock, turned around, and said something in Japanese, very short, very quiet. I caught half of it. I knew the word for “tomorrow.” The rest I didn’t. “You needn’t write that one down,” he said. “It was for you. It doesn’t need translating for anyone else.” He jumped down off the rock and landed in a tide pool, soaking the hem of his trousers, and didn’t even look down. I waited for him to go on. He only looked out across the water. Tsushima was somewhere in the haze. You couldn’t see it today."

[tracks.bond_kim_munyeong.chapters.a1.choices.ask_meaning]
text = "Ask him what the Japanese line meant."
reply = "He thought about it, as if choosing the most exact word between two languages. “It’s what Tsushima people say when they part. It means: I’ll still be here tomorrow.” I said tomorrow, then. He laughed, quick and short, and turned his face back to the sea. “That’s what I meant.” All the way home he taught me the line, one sound at a time."

[tracks.bond_kim_munyeong.chapters.a1.choices.say_again]
text = "Don’t ask what it means. Borrow his own habit and ask for the line again, exactly as he said it."
hint = "Press him for the exact words now and he’ll tell you it was business. You’re not that close yet."
reply = "He stopped short, as if he had never expected to hear that request in my voice. Then he laughed and said it again, slower than before. I still only understood half. “The other half,” he said, “you can hear when you’ve learned enough.” He picked his way back over the rocks more slowly than he had come, as though he were waiting for me to commit that half to memory."

[tracks.bond_kim_munyeong.chapters.a2]
title = "A Landscape on a Failed Draft"
text = "In the autumn Munyeong asked me to the study behind the school. He drew four sheets out from under his bedding and laid them on the desk one by one. The edges of the first three were worn fuzzy. “A Tsushima merchant’s mother, writing to her son here in Busan,” he said. “He’s learning Korean. He wanted to hear what his mother sounds like in our language.” He pointed at the first three. “The meaning is right. The voice is wrong. His mother doesn’t talk like this.” I asked what was wrong with it. He took his time answering. “She scolds him, and halfway through the scolding she softens. When I translate it, it comes out all scolding or all softness.” He turned the third sheet over. On the back was an ink painting, a few pale strokes: the sea off Busan, and far out, a gray shadow that was Tsushima. The ink had bled into the grain of the paper. “I painted it when I couldn’t go on.” He pushed it across to me. “It’s yours. Don’t read the writing on the other side.” The fourth sheet stayed under his hand. He didn’t pick it up."

[tracks.bond_kim_munyeong.chapters.a2.choices.take_painting]
text = "Take the painting, and ask him to read me the fourth draft under his hand."
hint = "He’s still holding the fourth sheet down. You’re not close enough for him to read it to you."
reply = "He read very slowly. When he reached the line where the mother warns her son not to drink cold well water once autumn sets in, he stopped, and stayed stopped so long that the night drum outside sounded once. I said that line was right. “How do you know?” I said I could hear her voice in it. He didn’t answer. He picked up his brush and set a small dot of ink beside that line, just like the one on the slip from our first lesson."
effects = [{}, {}, {}, { title = "A Landscape on a Failed Draft" }]

[tracks.bond_kim_munyeong.chapters.a2.choices.keep_both]
text = "Take the painting and the failed draft on its back together, and tell him I want both sides."
hint = "Say you want both sides now and he’ll take the painting back. You’re not close enough yet."
reply = "“What’s worth looking at on the failed side?” I said his handwriting was on it. He opened his mouth, found nothing to argue with, and looked down, smiling. From beside the brush rest he took a small seal and pressed it into the corner of the painting. Vermilion, very small: his name. “Then both sides are mine.” His ears went red before he had finished saying it."
effects = [{}, {}, {}, {}, { title = "A Landscape on a Failed Draft" }]

[tracks.bond_kim_munyeong.chapters.a2.choices.help_translate]
text = "Push the painting back and sit down to work through a fifth draft with him."
reply = "We worked by lamplight until past midnight and argued over a single verb ending for the better part of an hour. He still wasn’t satisfied. But early the next morning he gave the fifth draft to the Tsushima merchant, and came back saying, “If I keep revising, the man’s son will be grown.” The painting was still lying at the corner of the desk. Neither of us had remembered to put it away."

[tracks.bond_kim_munyeong.chapters.s]
title = "Ask First, Don’t Guess"
text = "The twelfth-month wind blew all the way from the Japan House to the school door and set the drafts hung under the eaves rattling. The teacher had collected the last of our papers; from tomorrow the school was finished. I was going to sea. Munyeong was staying in Busan, to take a seat in the interpreters’ room. He was smoothing out the papers in my pack one by one, and when he came to the old slip with the two apologies on it he paused, then tucked it back in. “When you write,” he said, “a letter takes a month to cross the water. If you read a line that sounds wrong to you, don’t guess what I meant. And don’t guess and then get angry. Write and ask.” “One question is two months, there and back.” “Then wait two months.” He tied off the cord on my pack and pulled it tight. “Two months is shorter than a lifetime of guessing wrong.” Across the water the haze thinned a little. The shadow of Tsushima showed, and then the clouds swallowed it again."

[tracks.bond_kim_munyeong.chapters.s.choices.promise]
text = "Write “if there’s a misunderstanding, ask; don’t guess” on a fresh sheet, and ask him to sign it."
hint = "A promise like this takes two signatures. Either you two aren’t close enough to sign it yet, or you’ve already given your one promise of a lifetime to someone else. This time, leave an address."
reply = "I wrote it out on a clean sheet, and my characters came out crooked. He took the brush and signed his name underneath. Then he thought a moment and signed my name next to it, stroke by stroke, neater than his own. I asked what it meant, him signing for me. “A promise between two people takes two signatures.” He folded the sheet in half and in half again and tucked it into my innermost pocket. “It means I’ve agreed on your behalf ahead of time. When you get where you’re going, sign it again in your reply, and I’ll check the hand.” I said he even had to check that. “Of course. That’s how I’ll be earning my living.” He copied out a second sheet the same way, signed it, and put it inside his own coat. On the day the ship sailed he stood on the quay and didn’t wave. He only pressed his hand flat over the place where the paper was."
effects = [{}, {}, {}, {}, {}, { title = "Ask First, Don’t Guess" }, {}]

[tracks.bond_kim_munyeong.chapters.s.choices.heart]
text = "Tell him: the other half of what he said on the rocks, I want to come back and hear when we’re grown."
hint = "The words circle between two languages and won’t come out in either. You haven’t come that far, or the one promise you get in life has already been given away."
reply = "The knot slid loose in his hands. He didn’t look at me. He looked at the sea, for a long time. “Then you’ll have to come back to hear it.” “I’ll come back.” “I’ll have to work out how to say that half first.” His voice was slower than ever. “If I say it wrong, there’s no second time.” He reached out his hand and stopped halfway, as if waiting for someone to finish translating the gesture for him. I took it. His hand was cold, and there was ink on his knuckles. “This,” he said, “doesn’t need translating.” We stood like that until the wind lifted the corner of a draft under the eaves again; then he let go and bent to hold it down. Once it was held, he stayed crouched there and said, “I won’t come to the quay the day you sail. If I did, I wouldn’t be able to keep from saying that other half.”"
effects = [{}, {}, {}, {}, {}, { title = "Ask First, Don’t Guess" }, {}]

[tracks.bond_kim_munyeong.chapters.s.choices.own]
text = "Make him a wager: who learns a third language first."
reply = "“I already know Chinese.” He said it without a shred of modesty. Then he’s a step ahead, I said. He thought for a moment, pulled out the old slip with the two apologies, turned it over and wrote a line in literary Chinese on the back, and handed it to me. “Then I’ll wait for you in the third language. From now on we write our letters in Chinese, and see who catches the other’s mistakes first.” I asked what catching one mistake was worth. “One round.” He ruled two columns on the back of the slip, his name at the head of one, the other left for me. “Whoever loses buys the first meal back in Busan.” Then he added, “Miswritten characters don’t count. Missing a level of courtesy does.” That slip went aboard ship with me. Both columns were empty."
effects = [{}, {}, {}, { title = "Ask First, Don’t Guess" }, {}]

[tracks.reunion_kim_munyeong]
name = "Kim Munyeong: Sit Down After the Last Word"

[tracks.reunion_kim_munyeong.chapters.reunion]
title = "Sit Down After the Last Word"
text = "Six years later I walked into the Japan House at Busan again. The door of the interpreters’ room stood open. Kim Munyeong sat behind an old desk, a merchant from Tsushima on his left, a clerk from the Dongnae office on his right, a document spread between them. He was thinner than before, and he still spoke just as slowly. The merchant said a sentence and he turned it into Korean; the clerk asked a question and he turned it back into Japanese. Once the clerk was vague, and Munyeong raised a hand. “That line—plainly, if you would.” He waited until the clerk had said it plainly before going on. He saw me in the doorway. His eyes rested on me a moment, then went back to the document. I waited at the door. The last line was the clerk’s: “This payment is settled in full.” Munyeong put it across, watched the merchant press his thumbprint to the page, and only then laid down his brush. It was a mistranslated payment in the old Japan House accounts. He had started chasing it the year he was an apprentice, and it had taken him eight years. He got up and poured two bowls of water, pushed one toward me, and held his own without drinking. “Today,” he said, “I don’t have to hurry to be anyone else’s voice. Sit down. I’d like to take my time and talk about myself.”"

[tracks.reunion_kim_munyeong.chapters.reunion.default]
effects = [{ text = "The Korean copy is on top and the Japanese below. They say the same thing; read whichever suits you. That payment in the old Japan House accounts was settled this spring. The fault was one word: years ago the interpreter put the Tsushima man’s word for “discount” into Korean as “debt,” and a merchant house on the Tsushima side paid out for years what it never owed. I sat both sides down at one desk and translated the whole thing again to their faces, and both sides apologized, using the two lines from our first lesson, with not one ink dot landed light. The old head of that house said something afterward I had never heard before. I wrote it inside my cuff; I’ll tell you when I see you. These days I’m the last one in the interpreters’ room to put out the lamp. If you hear anywhere of a slow-spoken interpreter in Busan, that’s me. If any line in this letter reads wrong to you, don’t guess. Write and ask. I’ll wait two months. Munyeong" }, {}]

[tracks.reunion_kim_munyeong.chapters.reunion.choices.his_own_voice]
text = "Sit down and listen to him tell these years in his own voice."
reply = "He told me he had been to Tsushima twice, and once waited half a month in the rain at the harbor there for a ship. He told me the Dongnae office had gone through three magistrates, and all three had complained he was too slow. He told me the Tsushima merchant who was learning Korean had gone home in the end and sent back a bundle of dried kelp, saying his mother wanted Munyeong to have it. Halfway through he laughed at himself. “All these years speaking for other people, and when it’s my turn, I stammer.” I said there was no hurry. He drained his bowl and poured another. “No. Not this time.” From under the desk he drew out a cloth bundle: the letters I had sent him, every one with a small ink dot in the corner, his mark that he had read it. Where something had puzzled him, a slip was tucked in beside it with his question. “Today I ask them, one at a time.”"
effects = [{}, {}, {}, { title = "Sit Down After the Last Word" }]

[tracks.reunion_kim_munyeong.chapters.reunion.choices.contest]
text = "Challenge him to a match: a Japan House merchant sets the passage, and we see who renders it truer."
reply = "The Tsushima merchant was happy to oblige and rattled off a long passage salted with cheerful insults. I finished first; Munyeong finished after me, with one place circled. The merchant heard both, slapped his knees and called it a draw, and said either of us was better than the interpreter he’d brought. Munyeong said he had let me have that one. I said he never let anyone have anything. He folded the sheet with the circle on it and tucked it inside his cuff. “This time I did. I understood the circled part. I left it out on purpose.” I asked why. “If I’d written it, you’d have lost.” He emptied his bowl in one swallow. “I didn’t want to beat you today. Next time.” As he left, the merchant asked which of us he should send for the next time he had papers to put across. Munyeong said, “If you want it fast, this one. If you want it right, me.”"
effects = [{}, {}, {}, { title = "Sit Down After the Last Word" }]

[tracks.reunion_kim_munyeong.chapters.reunion.choices.the_other_half]
text = "Ask him for the other half of what he said on the rocks that day."
hint = "You never made that promise back then, and today the other half is still his to keep."
reply = "He set his bowl down, and it knocked once against the desk. Then he said it, in Korean, not put into Japanese, with no detour. I understood it, every word. When he had finished, he drew a breath as if he’d surprised himself. “I’ve been getting that ready for six years. I was afraid of saying it wrong, so I rehearsed it more times than I can count. I prepared so long that when it finally came out, it came out as fast as something learned by rote.” I said slow down, then, and start over. He looked at me, and this time he didn’t smile. He said it again, as slowly as if he were checking a draft, an ink dot under every word. On the last word he reached over, moved aside the bowl of water I hadn’t touched, and took my hand."
effects = [{}, {}, {}, { title = "Sit Down After the Last Word" }]
