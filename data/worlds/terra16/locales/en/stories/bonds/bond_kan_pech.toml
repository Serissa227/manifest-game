# 坎·佩奇（bond_kan_pech / reunion_kan_pech）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C7 重写，2026-10-12，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 专名：Kan Pech、Ix Nikte'（照人物覆盖层的写法）、María（学校名册上的名字）、Mérida、Campeche、Cozumel、Maní；玛雅日名照修士的拼法（Kan、Imix、Akbal、Mac）。
# 口头禅：坎 “You’ve got the day wrong.”——只在 c2 正文用一次；s 的 promise 回复换说法呼应，来信里不照搬。

[tracks.bond_kan_pech]
name = "Kan Pech: A Day Counted Two Ways"

[tracks.bond_kan_pech.chapters.c1]
title = "A Day Counted Two Ways"
text = "I ran into the forecourt of the friars’ school with a bundle of beeswax I’d traded for my mother, and the catechism had already stopped. Under the colonnade sat Kan of the Pech, one of the noble boys from the inner school who learned Latin; the friars had put him in charge of our roll. He didn’t look up. “You’re late. I’ve written it down—today’s date, both ways of counting.” The roll had the friars’ date, a month and a number. His Latin primer lay open on his knee, its margins crammed with tiny writing, one day to a line, each line in two halves—one by the count of two hundred sixty days, one by the count of three hundred sixty-five—all spelled out in his new letters. Today’s line was half finished: the second half already read “month of Mac,” but the first got only as far as “5 Can.” He stared at the C, then wrote a K beside it. “The friars say these two letters make the same sound.” Finally he looked at me. “But Can means four. My grandfather would read this and think today is five-four.” His pen hung over the page. “Written like this—would he still know it?”"
news = "The forecourt of the friars’ school in Mérida has a new keeper of the roll, a boy of the Pech. He marks down every latecomer, and if a name is off by one letter, he fixes it on the spot."

[tracks.bond_kan_pech.chapters.c1.choices.both_ways]
text = "Ask him to keep the C and the K side by side, and cross out neither."
reply = "“Then keep them both,” I said. “Write the C for the friars and the K for your grandfather.” Frowning, he started half a sheet at the back of the primer and wrote the day twice, once Can and once Kan, with a small note underneath: different sounds. “If the friars ask,” he said, “it’s penmanship practice.” “Then you practice very hard.” He didn’t smile. He tucked the sheet back into the primer. A little later he pulled it out again and pushed it over to me to look at once more—this time to check whether his letters were straight."

[tracks.bond_kan_pech.chapters.c1.choices.correct_him]
text = "Point out his slip: he’s spelled the month Mac wrong; the old folks on Cozumel don’t say it like that."
reply = "“Mac is wrong,” I said, pointing at the line. “The old folks on our island say it heavier. The end of it is hard.” His face shut like a door. “That is how the Pech say it. Your island says it crooked.” We got louder and louder until a friar came down the cloister toward us. Kan shot to his feet and, in his prayer voice, recited the whole Our Father straight through, louder than anyone in the inner school. The friar nodded and moved on. Kan sat back down and closed his primer. A long while later he said, very quietly, “The way your island says it… is right too.”"

[tracks.bond_kan_pech.chapters.c2]
title = "One Day Off"
text = "The rains were late that year, and the forecourt lessons moved under the cloister. Kan brought a sheet of paper he’d copied out for his uncle, who drove mules for the Spaniards in town and couldn’t keep the old calendar in his head; when to go home to the village to pray for rain, he took from this sheet. “Read it,” Kan said. “If you can read it, my uncle can.” I read down line by line until I reached the fifth: “Uuc…” “You’ve got the day wrong.” The corner of his mouth moved first, as if he might laugh. “That’s uac. Six. You read seven.” I leaned in. The tail on his a was curled too short; it looked exactly like a u. His laugh stopped halfway by itself. He took the paper back and stared at the line. “If my uncle read it your way, he’d get home a day late. The rain prayers don’t wait for latecomers.” Water dripped off the eaves in strings. With his fingernail he scored a mark under the a, hard enough to rough up the paper."
news = "Under the cloister at the friars’ school in Mérida, the Pech boy who never smiles nearly laughed out loud the other day, when a girl from Cozumel misread a line of his."

[tracks.bond_kan_pech.chapters.c2.choices.list_sounds]
text = "Make a list with him of every pair of letters that’s easy to mix up."
hint = "He folded the paper and took it away: this is his family’s business, and you two aren’t that close yet."
reply = "We sat under the cloister till dark listing the letters that get confused, one pair at a time: a and u, c and k, the backward c the friars invented, and the sounds no letter could spell, so the friars just wrote one letter twice. Nineteen pairs in all. On the first line he wrote uac and uuc, with my name beside them. “For whoever copies this later,” he said. “When they see this line, they’ll know someone tripped here.” He folded the list and slid it into his sleeve. “This is more use than the primer. Don’t let the friars see it.”"

[tracks.bond_kan_pech.chapters.c2.choices.read_again]
text = "Take the sheet back and read it again from the top, not one word wrong."
reply = "I took the paper back and started from the first line, my finger pressing each word as I went. Not one mistake this time. Kan didn’t praise me. He only nodded once, then wrote another line on the back, smaller than before. “Read this.” By the third word I was stuck—it was an old way of saying things only his family’s elders used; nobody on our island talks like that. I guessed at the sound. He corrected me, and this time he really laughed, his shoulders shaking. “You Cozumel people have more nerve than letters.”"

[tracks.bond_kan_pech.chapters.b1]
title = "The Books Aren’t His Alone"
text = "That fall a Spanish scribe from the town hall came to the Pech house, hat in hand, all courtesy. He had heard the household kept old books from its forefathers, he said, and wondered if he might borrow them—“only to look.” Kan stood just inside the threshold, his back straighter than it ever was for the friars. “The books aren’t all mine. What the family has written down, I can’t give on my own.” The scribe smiled and said he would come another time. The moment he was gone I grabbed Kan’s arm. “Hide them all. Somewhere he’ll never find them. Hide as many as you can.” Kan looked at me without answering and went into the back courtyard. I waited until the sun was low before he came out, holding a single page. “The elders say you may copy this one. The rest, they still have to think about.” “Think about what?” “What to keep,” he said. “That’s our family’s rule: first ask the books’ owners, then talk about hiding.” The page showed the days for praying for rain, dots and bars in a column, the ink gone gray, an old crease down the middle."
news = "A Spanish scribe from the town hall in Mérida wanted to borrow the Pech family’s old books. The Pech boy said he had to ask the elders first, and the scribe went home empty-handed."

[tracks.bond_kan_pech.chapters.b1.choices.copy_permitted]
text = "Copy only the page they allowed, not one stroke more."
reply = "I copied all afternoon, and even folded my sheet along the same old crease. Kan held it up to the window and found two faults: one dot drawn too small, one bar drawn too short—and a short bar turns a five into a four. I fixed them. He looked a long time more and said, “My grandfather would be pleased with this.” He rolled up my copy and tied it with a cotton thread. “Take it back to Cozumel and leave it with your mother. Not with you. You lose things.”"

[tracks.bond_kan_pech.chapters.b1.choices.ask_elders]
text = "Ask him to take me to the elder, to ask face to face what else I may copy."
reply = "Kan stood at the door to the back courtyard for a long moment, as if weighing whether bringing a forecourt child inside broke the rules, and then led me in anyway. The old man sat in a hammock and looked at me for a long while. “Who is your mother?” The midwife on Cozumel, I told him; she had caught half the children on the island. The old man nodded and told Kan to bring another page. Outside, Kan walked fast and didn’t turn around until the front gate. “It took me three days of asking to get one page. They listen to you more than me.”"

[tracks.bond_kan_pech.chapters.b2]
title = "The Pages Inside the Primer"
text = "In 1555 the friars started checking our books. One lesson that year was on the saints’ days, and the forecourt children were called into the inner school and packed into the back rows. The friar walked between the desks as he talked, and when he reached Kan he picked up his Latin primer and flipped through a couple of pages. “Father,” Kan said, his voice steady, “my handwriting is poor. It will offend your eyes.” From where I sat, just behind Kan and to one side, I saw a corner of thin folded paper between the leaves, covered in his cramped little writing, one day to a line, each line in two halves. The back of Kan’s neck went white. The friar turned no more pages. He shut the primer and set it on the desk. “Stay after the lesson. I want a closer look at this.” “Yes, Father.” The friar turned and pointed his stick at the saints painted on the wall, Saint Andrew, Saint Thomas, naming them one by one. Kan named them with him, his voice never shaking, one hand flat on the primer, not moving."
news = "The friars at the Mérida school have been checking books a lot this year. The forecourt children hug their primers in class, afraid someone will find the boats they drew in the back."

[tracks.bond_kan_pech.chapters.b2.choices.distract]
text = "Stand up and ask the friar: if the saints’ days never move, why does Easter move every year?"
hint = "All you can see is the back of his neck going white; you can’t guess why those pages matter so much. You aren’t that close yet."
reply = "I stood and asked, very respectfully, “Father, the saints’ days stay put every year. Why does Easter move?” The friar’s eyes lit up. He drew a moon on a board with a stick of charcoal and went from the moon to the equinox, from the equinox to the bishops at Nicaea, half an hour without a breath. He didn’t hear the bell. When he finished he dusted off his hands and walked out. Kan tucked the primer inside his shirt and followed me all the way to the corner without a word. There he said, “I owe you one.” “Noted,” I said. “Both ways of counting.”"

[tracks.bond_kan_pech.chapters.b2.choices.swap_books]
text = "While the friar points at the paintings, swap my primer for his."
reply = "While the friar’s stick was on Saint Thomas, I slid my primer under Kan’s hand and pulled his away, under my knee. After the lesson the friar picked up the book on Kan’s desk and went through it cover to cover. Nothing—except, on the last page, a canoe. He frowned and tossed it back on the desk. “A Latin scholar, drawing boats.” Kan bowed his head and took the blame. Outside, he swapped the primers back and leafed through mine. “Your book is far too clean. Anyone can see you never study.” Only then did he laugh, and the hand holding his primer shook."

[tracks.bond_kan_pech.chapters.a1]
title = "The Story Left Unfinished"
text = "In early spring Kan took me out of the city, most of a day on foot, to the village where the old Pech folk lived. Under a kapok tree at the edge of it lived the oldest of the Pech elders. His eyes had clouded over, but when he told of the forefathers he never got a name wrong. “I’m here to listen and write it down,” Kan said. “You’re here because you copy fast.” I spread paper on my knee and wet my pen. The old man began with the first of the Pech: where they came from, which well they settled beside. At one point he stopped. There was nothing but the creak of the hammock ropes. He turned his face toward where I sat. I put down my pen. The old man went on, and what he told next was something else. On the way back it was nearly dark. Kan was walking ahead when he suddenly asked, “A whole day for half a page. Do you feel you came for nothing?”"
news = "In a village outside Mérida, the oldest of the Pech elders lives under a kapok tree. He’s gone blind, but he can still name every one of his forefathers without a slip."

[tracks.bond_kan_pech.chapters.a1.choices.not_wasted]
text = "Tell him the part the elder wouldn’t let me write taught me where to stop."
reply = "“Not for nothing,” I said. “The part he wouldn’t let me write—I heard him decide not to tell it. Next time someone trusts me with something, I’ll know where to put the pen down.” Kan didn’t answer. He walked on a good way, then stopped, took his copybook from inside his shirt, and in the last of the light wrote a line on the first page, in Latin letters. “Whoever opens this from now on reads your words first.” “Then you have to write who said them.” He added another line. I leaned over to see: Ix Nikte'. Of the María on the school roll, he hadn’t written a single letter."

[tracks.bond_kan_pech.chapters.a1.choices.ask_one_thing]
text = "Ask him to tell me one thing that can be told. Just one."
reply = "Kan thought for so long I decided he wasn’t going to answer. Then he told me about his great-grandfather: one year, gathering salt on the beach up north, the old man saw clouds sitting on the sea that neither moved nor broke up. He counted them. Four. The next day the clouds came closer, and under them was wood. His great-grandfather didn’t run. He crouched beside the salt heap and drew them, one by one. Kan told it slowly, a sentence at a time, as if copying it onto a page. When he was done he said, “That one can be told. The drawing is still at home.”"

[tracks.bond_kan_pech.chapters.a2]
title = "Books Kept in Two Places"
text = "In the rainy season Kan called me into the back courtyard of the Pech house, where two identical stacks of copies sat on the ground. “Keep a thing in only one place,” he said, “and it’s like carrying a ship’s whole supply of fresh water in one cask. The cask leaks, and everyone aboard goes thirsty.” The elders talked it over for three nights and decided: one stack stays in Mérida, one goes away—to Cozumel, to the midwife’s house. Kan wrapped the stack that was leaving in oilcloth, set a new notebook on top, and pushed both toward me. There wasn’t a word in the notebook. He had covered it himself in bark paper and sewn it with blue cotton thread, the stitches very close. “The books are my family’s,” he said. “The notebook is yours. Write something down too.” The oilcloth bundle was heavy. Before I could reach for it, he added, “The elders say that if you take this, and someday it falls to you to hand it on, you hand on the Pech name with it.”"
news = "The Pech boy has been binding notebooks at school in Mérida this year, the stitching close and even. The friars praise his neat hands, but he won’t give a single one away."

[tracks.bond_kan_pech.chapters.a2.choices.take_copy]
text = "Take the bundle and the notebook: if I ever hand them on, the Pech name goes with them."
hint = "He has pushed the bundle toward you, but his hand hasn’t left the oilcloth. He isn’t ready to trust you with this yet."
reply = "I picked up the bundle and tucked the notebook inside my shirt. “If I ever hand this on, the Pech name goes with it. If a single letter’s missing, come and find me.” Kan nodded, then pulled the notebook back out of my shirt, opened it to the first page, and wet his pen. “The name matters more than the books,” he said as he wrote. “Burn a book, and if someone remembers, it can be copied again. Lose a name, and it’s gone.” What he wrote was today’s date, both ways: first the friars’ year, month, and day, then 12 Imix. He blew the ink dry and stuffed the notebook back inside my shirt."
effects = [{}, {}, {}, { title = "Books Kept in Two Places" }]

[tracks.bond_kan_pech.chapters.a2.choices.hide_together]
text = "Leave it for now; help him hide the stack that stays inside a wall of the house."
reply = "“The one that’s leaving can wait,” I said. “Hide the one that stays first.” We waited until midnight, pried three stones out of the wall behind the kitchen, wrapped the copies in three layers of oilcloth, pushed them in, mixed plaster, and smoothed it over. Kan smoothed it more carefully than any mason and pressed it flat with his palm. “Only the two of us know about this.” “And the wall.” “Walls don’t talk.” He wiped the plaster off his hands onto his trousers. “Friars do.” He kept the new notebook, and said I could come for it when I knew what I wanted to write."

[tracks.bond_kan_pech.chapters.s]
title = "Names Don’t Burn"
text = "In December I waited on the beach at Campeche while my family’s canoe was loaded. School was over. Kan was staying in Mérida to clerk for the Spaniards at the town hall, copying land deeds and lawsuits. He had ridden two days on a mule to see me off, and since the loading wasn’t done when he arrived, he stood by and helped count the paddles. He counted them twice. When the loading was done, he drew a sheet of paper from his sleeve, folded square. “Which houses have the books—it’s all on here.” I unfolded it. Nowhere did it say “valuable.” It didn’t even say “book.” Each line named one household: whose elder remembered the days to pray for rain, whose wife remembered the forefathers’ names, whose wall held whose memories. The last line was Cozumel, the midwife’s house, with half the line left empty after it. “The friars want books,” Kan said. “What I’ve written down is people.” The sea wind lifted a corner of the paper, and he reached out and held it down."
news = "On the beach at Campeche, a canoe bound for Cozumel was loading, and a young scribe from Mérida stood beside it all afternoon, helping count the paddles."

[tracks.bond_kan_pech.chapters.s.choices.promise]
text = "Promise him: whenever he sends word, my boat comes for the books, no questions."
hint = "Either the two of you haven’t come far enough for a promise like this, or your one promise of a lifetime is already made to someone else. Today all you can offer is to carry a letter for him."
reply = "“Whenever you send word,” I said, “my boat will come for the books. I won’t ask why, and I won’t ask where they’re going.” Kan looked at me a long time. “I hope that day never comes.” “Then I’ll wait for it not to come.” He didn’t smile. He folded the paper in four, crouched, and slipped it into a gap in the canoe’s side planking, then pushed it in with a finger until nothing showed. “The man I send won’t be able to write,” he said. “He’ll say one thing: the day has come. When you hear that, you sail.” “Which day? Counted which way?” He stood and brushed the sand from his knees. “Count it wrong, it doesn’t matter. Just let the boat come.” It was the first time I ever heard him say a wrong day didn’t matter. When the canoe pulled away he was still standing there, not waving, his lips moving. Counting paddles, I guessed."
effects = [{}, {}, {}, {}, { title = "Names Don’t Burn" }, {}]

[tracks.bond_kan_pech.chapters.s.choices.own]
text = "Go our own ways: he guards the books, I go to sea, and we write."
reply = "“You guard your books, I’ll sail my sea,” I said. “If anything happens, write.” “Letters should have both dates,” he said. “How long will one letter take you, then?” “Scribes write fast.” I folded the paper the way it had been folded and put it inside my shirt. Then he asked how many days a letter took from Cozumel to Mérida. Six with a fair wind, I said; without one, ask the sky. “Then I’ll count ten.” He nodded, as if entering the number in some ledger. Before the canoe went into the water I said, “Next year, on the day I was late for your roll, I’ll put you down on the island as not late, for once.” He opened his mouth—probably to tell me what that day was called the other way—and in the end corrected nothing. “Good,” was all he said. When the canoe left the shore I looked back. He was crouched on the sand, writing with one finger—one line, then another beside it. A wave came up and smoothed both away."
effects = [{}, {}, {}, { title = "Names Don’t Burn" }, {}]

[tracks.reunion_kan_pech]
name = "Kan Pech: The Boat Before the Fire"

[tracks.reunion_kan_pech.chapters.reunion]
title = "The Boat Before the Fire"
text = "In June of 1562 the news from Maní got worse every day: the friars were going village to village searching for old books, questioning every household, and when the questions got no answers they hung people up by the arms and asked again. On the dock at Cozumel, people kept their voices low. That was when Kan came. He was thinner, dressed in a scribe’s black, with two porters behind him carrying three chests: the copies the elders had chosen and allowed to be sent away, a few pages from each household. He didn’t say anything else first. He counted people: one boat owner, six paddlers, me. Then he counted again from the start, and only then crouched and sealed the lids tight. “Where to?” I asked. “First, somewhere children can still be taught to read,” he said. “South. The villages the friars can’t reach more than once a year. As long as there are children who can read, the books have readers.” He looked up at the sky. “The five nameless days at the end of the year are coming. We have to go before then.”"
news = "A scribe from Mérida has turned up on the dock at Cozumel with three chests sealed tight. He asks every boat owner whether they’re going south, and won’t say a word about what’s inside."

[tracks.reunion_kan_pech.chapters.reunion.default]
effects = [{ text = "Ix Nikte': Today is the eighth of July, 2 Akbal. Akbal is night, and the elders say no one goes out on such a day. I went out anyway. I went to Cozumel and waited, but your boat never came in. I gave two of the chests to a salt trader heading south. He can’t read and doesn’t know what’s in them, which is best. The third I couldn’t carry, so it went back into the wall at home. Over in Maní the friars have piled up everything they took from the villages in one place. I did not go to look. Tomorrow the five nameless days at the end of the year begin, and every door in the village is already shut. The households on the paper I gave you—I copied them out again and tucked the list into the chests that went south. Books can be copied again. Of the names, I have not lost one. If your boat comes back, don’t look for me in Mérida. Wait on the beach at Campeche. I will know. Kan Pech, written at Mérida. Date checked twice." }, {}]

[tracks.reunion_kan_pech.chapters.reunion.choices.swear_brothers]
text = "Swear kinship with him by the boat: my boat will guard these books and his name together."
reply = "“Kan,” I said, “let’s swear ourselves kin. From now on my boat guards these books and your name together.” He frowned. “Maya don’t make sworn kin that way.” “Then we’ll do it the Cozumel way.” Cozumel had no such way; I was making it up. I drew the little knife I use for splitting cacao pods, cut a lock of my hair, and handed him the knife. He looked at me a moment, then cut a lock of his own, shorter than mine, the end as even as if he’d measured it. We threw both into the sea under the bow. They turned twice, wouldn’t sink, and drifted off. “Does it count if they float away?” “It counts. The sea remembers.” He nodded, took his copybook out of his shirt, turned to the last page, and wrote the day—one count, then the other. “Recorded. Both of them.” Then he counted the people on the boat once more, and this time he counted me in."
effects = [{}, {}, {}, { title = "The Boat Before the Fire" }]

[tracks.reunion_kan_pech.chapters.reunion.choices.just_sail]
text = "Say nothing more and take the boat out that same day, as fast as she’ll go."
reply = "“Get aboard,” I said. “The rest can wait till we’re underway.” We left Cozumel that afternoon and followed the coast south. For three days Kan sat on the chests and said nothing, wouldn’t budge, ate his meals sitting on them. When I got up at night to check the sail, he was still sitting there, both hands on the lids. On the morning of the fourth day he suddenly said, “Thank you.” I waited for more. Then: “Your sail is set crooked.” “Then you do it.” He actually did. He took hold of the sheet and hauled it exactly the way the book said, and set it more crooked than I had; the sail spilled its wind and the bow swung toward shore. The paddlers laughed so hard they nearly lost their paddles. Kan kept a straight face and tried again, and this time it was true. He handed me back the sheet and sat down on the chests again. “Put it down. Day four: learned one thing.”"
effects = [{}, {}, {}, { title = "The Boat Before the Fire" }]

[tracks.reunion_kan_pech.chapters.reunion.variants.v1_promise]
text = "In June of 1562 the news from Maní got worse every day: the friars were going village to village searching for old books, questioning every household, and when the questions got no answers they hung people up by the arms and asked again. A salt trader from Mérida found me on the dock, explained nothing, and said one thing: “Kan Pech says the day has come.” That same day I had the boat hauled out and her bottom scraped. On the ninth day Kan came himself, thinner, dressed in a scribe’s black, with two porters behind him carrying three chests. He didn’t say anything else first. He counted people: one boat owner, six paddlers, me. Then he counted again from the start, and only then sealed the lids. “Where to?” I asked. “First, somewhere children can still be taught to read. South. The villages the friars can’t reach more than once a year.” He glanced at the freshly scraped hull. “You didn’t ask why.” “We agreed I wouldn’t.”"

[tracks.reunion_kan_pech.chapters.reunion.variants.v2_own]
text = "Over the years Kan’s letters came two or three a year, each with both dates on the first line, and often only one piece of news below: which elder had died, and that the name had been written down. The one that came in June of 1562 said only: “I am coming to Cozumel. Don’t ask.” He arrived three days after it, thinner, dressed in a scribe’s black, with two porters behind him carrying three chests. Over in Maní the friars were searching the villages for old books, and when the questions got no answers they hung people up by the arms and asked again. He didn’t say anything else first. He counted people: one boat owner, six paddlers, me. Then he counted again from the start, and only then sealed the lids. “Where to?” “First, somewhere children can still be taught to read. South, to the villages the friars can’t reach more than once a year.” He looked up at the sky. “The five nameless days at the end of the year are coming.”"
