# C7 羁绊线重写（2026-10-11，Claude Opus）：stories/bonds/bond_aisha.toml 的英文显示覆盖；按轨道、章节、选项的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应（a2 两个带赠礼的选项、s 三个选项、重逢两个选项里的 memory；重逢 default 第 1 个效果是来信）。

[tracks.bond_aisha]
name = "Aisha: Let the Children Read"

[tracks.bond_aisha.chapters.c1]
title = "Let the Children Read"
text = "Spring had come, and the soldiers from Algiers were still quartered in the city. Every time I opened my mouth, somebody down the lane pulled a shutter closed—I’d picked up my accent on the Algiers waterfront as a boy, and it wasn’t going anywhere. I walked my two little sisters to Aisha’s door with a whole speech ready for when she asked what my father did for a living. She didn’t ask. She crouched down until she was the same height as the youngest. “What’s your name?” I answered for her. Aisha raised one hand without taking her eyes off the child. “Let her say it.” My little sister hung on to my sleeve and worked herself up to it for a long moment, then rattled off her name, her father’s and her grandfather’s in one breath, nearly ran out of air on the last one, and turned bright red. Not one of the girls in the room laughed. Only then did Aisha stand up and look at me. She took a slate and a stub of chalk from beside the wall and pushed them into my hands. “You hold it. She writes.”"

[tracks.bond_aisha.chapters.c1.choices.hold_slate]
text = "Crouch down, hold the slate steady for my sister, and keep my mouth shut."
reply = "The first letter came out crooked three times, and the chalk snapped. I kept my hand on the edge of the slate and didn’t move it once, and kept my mouth shut too—harder for me than a whole night on watch at the bow. Aisha watched for a while, then picked up the broken bit of chalk and put it back in my palm. “Holding the slate is harder than writing on it.” She turned away to see to another child, and added over her shoulder, “Come and hold it again next time.”"

[tracks.bond_aisha.chapters.c1.choices.recite_poem]
text = "Recite one of my grandmother’s Andalusian poems to make the girls laugh."
reply = "I stood up and gave them my grandmother’s poem about the river Genil, in her voice, with her hand gestures. Three lines in, my head went empty and a line was gone. Aisha didn’t even look up. She carried on from where I’d stopped, word for word—her family knew that poem too. The girls dissolved into giggles, my little sister loudest of all. “Your grandmother taught it right,” said Aisha. “You’re the one who mixed it up.” Getting corrected in front of everyone didn’t sting the way I expected. On the walk home I said the line I’d dropped three times over."

[tracks.bond_aisha.chapters.c2]
title = "Two Mornings a Week"
text = "The weaver’s daughter had missed three days in a row. Aisha sent to ask, and word came back that her mother wanted her at home winding thread—she wouldn’t be coming anymore. “Come with me,” Aisha said. “You know how to talk.” The house was behind the dyers’ street, a spinning wheel in the yard and a basket of thread half wound at the mother’s feet, the loose end trailing over the rim. The mother’s foot never stopped on the treadle, and she never looked up. “Will reading put bread on the table? One more basket from her is one more flatbread for us.” I opened my mouth to answer, but Aisha spoke first, her voice perfectly level. “When she winds the thread, who keeps the count?” The wheel slowed, and stopped. The mother looked down at the basket. Its rim was notched all the way around, one notch to a basket, until the notches ran together and even she couldn’t count them anymore."

[tracks.bond_aisha.chapters.c2.choices.count_wages]
text = "Work out for the mother how much more a weaver who can keep accounts earns in a year."
hint = "That sum isn’t yours to speak up about—Aisha doesn’t trust you with her pupils’ families yet."
reply = "I counted it out on my fingers: what the thread merchants shave off at the scales, the change they short you, and by the end of a year it added up to two baskets of good wool. The mother didn’t believe me and made me do it again. I did, and the number stayed put. She stared at the notches on the basket rim a long time. “Two mornings a week. Not one more.” On the way back Aisha walked ahead of me. “You did the sums. I did the talking.” She glanced back at me. “That works.”"

[tracks.bond_aisha.chapters.c2.choices.play_oud]
text = "Borrow the neighbor’s oud first and soften the room with a tune."
reply = "The neighbor’s oud was badly slack, and it took me ages to tune it. The mother laughed, and her hands wound the thread in time; she even hummed a line or two. But the moment the tune stopped and school came up again, she shook her head. Aisha thanked her and led me out. The next evening she brought the oud back and said, as if in passing, “Two mornings.” I asked how she’d talked the woman into it. “Went back,” she said, “and sat winding thread with her all afternoon.”"

[tracks.bond_aisha.chapters.b1]
title = "Where the Books Came From"
text = "In September the Saadians took Fez back, and the soldiers from Algiers pulled out overnight. The city beat drums in the streets, and anyone who heard an accent like mine turned around for a second look. I walked with my head down lower than ever. My father’s ship came in from sea with a crate of books—leftovers from the cargo, he said. I carried it across half the city and set it down in the middle of Aisha’s courtyard like a grand gift. She opened the top book. On the flyleaf, one line: Valencia, Miguel Qasim. The ink still looked fresh. “Your family’s ships only take cargo. I know.” She kept her fingertip on the line. “But there’s a person written on this page.” “Books are cargo,” I said. She didn’t argue. She opened the second book, and the third, and every flyleaf had a name. When she was done she closed the lid and kept her hand on it. “My girls need them, so I’ll keep them. You may borrow the book—the next girl is waiting.” She looked up. “These names. Can you remember them?”"

[tracks.bond_aisha.chapters.b1.choices.copy_owners]
text = "Copy out every former owner’s name on a list and give it to her."
reply = "I borrowed her pen, sat on the step and copied the flyleaves of all eleven books one by one: name, city, sometimes a year. She nailed the list to the wall. The next morning, before lessons, she had the girls read it aloud, one name each. I stood in the doorway listening to them stumble through it. The seventh was a woman’s name, and I went outside."

[tracks.bond_aisha.chapters.b1.choices.take_crate_back]
text = "Say I’ll carry the whole crate back and return it once the owners are found."
reply = "I bent to lift the crate, and she put one hand flat on the lid. “My girls need books today.” She’d keep the originals and give each back when its owner turned up; for the children she’d make copies. Then and there she lifted the books out one by one and stacked them on the windowsill. I carried the empty crate back across half the city. Full of books, it hadn’t felt like much. Empty, it dug into my shoulder the whole way."

[tracks.bond_aisha.chapters.b2]
title = "The Girl Who Stopped Coming"
text = "The girl from the second row had been gone ten days. “Ten days,” Aisha said. “I went and asked at her house.” Her father was a sailor; his ship had been taken in the Strait by a ship out of Algiers. They’d let the men go, but his wages were gone and the rent couldn’t be paid. Aisha told me all this while sharpening a pen. She didn’t look at me, and there was no blame in any of it. When the pen was done, she asked, “When the cargo’s gone, what do the men on board eat?” I had no answer. The next day I asked around the inn outside the walls where the Algiers merchants lodged. The captain who took that ship was a name I knew—he ate at our house every Eid and once gave me a little knife. On my way back into the city I went by the family’s door. A board was nailed to it, crooked, listing the months of rent owed, and on the last line, the date they had to be out by. I stood in front of it and read the numbers twice."

[tracks.bond_aisha.chapters.b2.choices.pay_rent]
text = "Pay the family’s rent for three months out of my own allowance, and leave no name."
hint = "She hasn’t asked you about this—she won’t have you think she’s collecting debts for her pupils."
reply = "The landlord beamed as he took the money and told the whole street the minute my back was turned. By the next day Aisha knew. She didn’t thank me. She only said, “She came today. Front row.” I said the money came from my father’s ships. She refilled my tea. “All the more reason to spend it like this.” I pulled the board off the door myself. The nail had rusted into the wood, and it took me three tries."

[tracks.bond_aisha.chapters.b2.choices.write_father]
text = "Write to my father and ask what became of the men on that ship."
reply = "I filled three sheets. Only when I’d finished did it strike me that in all my years running with my father’s ships I had never once asked how many people were aboard the ships we took, or where they went afterward. A letter takes a month. Aisha read it through and corrected one misspelled word with her pen, and left the rest alone. “Send it.” She folded it and handed it back. “When the answer comes, read it to me.”"

[tracks.bond_aisha.chapters.a1]
title = "A Line Through the Lattice"
text = "In spring I brought my sister to her lesson and got there early. Aisha was outside sprinkling water to lay the dust. She stopped when she saw me. “The day before yesterday one of the teachers from the Qarawiyyin came to borrow a book,” she said. “He asked who I was copying the notes for.” She set the jar down and spoke slowly, as if testing whether the words would hold. “One day I want to teach from a proper chair. Not just in my own house, teaching the neighbors’ daughters.” She didn’t say the rest. She went inside. I waited at the door. The window had a wooden lattice carved into rows of little stars, and voices slipped out through the gaps. She was teaching a poem—the one my grandmother used to say, the one I could never get all the way through. “Tariq recited this line once,” she said. “Who remembers the next?” Nobody answered. My little sister whispered, “He doesn’t remember either.” The whole room laughed."

[tracks.bond_aisha.chapters.a1.choices.wait_outside]
text = "Wait until the lesson’s over, then go in and just say my sister read well today."
reply = "I waited until the last girl was out the door before I went in, and said only that my sister had read well today. Aisha looked at the patch of dirt outside the door, trodden flat by my feet, and didn’t call me on it. She poured me a glass of mint tea. “What I said this morning—forget I said it.” I finished the tea and set the glass back on the tray. “I heard it. I’ll remember.” She didn’t answer. She picked up the tray and carried it into the back room, the two glasses chiming against each other all the way."

[tracks.bond_aisha.chapters.a1.choices.finish_line]
text = "Say the next line through the lattice."
hint = "The line sticks in your throat—you don’t yet have the nerve to speak to her through a window."
reply = "I said the next line through the lattice, louder than I meant to. For a moment the room went quiet, then the girls burst out laughing, and my sister’s voice rose shrillest of all. “It’s him!” Aisha didn’t look up, but her pen stopped for a beat before it went on. When the lesson was over she stood in the doorway and looked at me. “Next time, don’t answer from outside.” She stepped aside and left half the doorway open. “Come in and answer.”"

[tracks.bond_aisha.chapters.a2]
title = "The Embroidered Pouch"
text = "In June my father wrote telling me to come back to Algiers and sail with the ships for the summer—I was sixteen, high time I went to sea. I went to Aisha’s to say goodbye. She heard me out without a word, then drew a small bag from the bottom of her sewing basket: dark blue cloth, with a pomegranate blossom embroidered on the front, the stitches so close you couldn’t see the cloth beneath. “It’s for pens,” she said. “Plunder won’t fit.” I reached for it, and she didn’t let go. “Don’t go.” It was the first time she had ever asked me for anything. I hesitated, then laughed and gave her the line I’d been saying in Algiers for years. “Cargo, never people.” “Then when you come back,” she said, “tell me whose cargo you took this time.” She didn’t argue anymore. The drawstring was loose, so she bent her head and tied it for me, knotted it, and tugged it twice to see that it would hold."

[tracks.bond_aisha.chapters.a2.choices.promise_report]
text = "Promise to tell her every last thing about the voyage when I’m back."
hint = "You’re not close enough for this yet—when she says “Don’t go,” you don’t know how to answer."
reply = "“Not one word left out,” she said. “How many on the other ship, how many crew, how many passengers. All of it.” I said I would and tucked the pouch inside my shirt. With that she stopped looking at me and went to wipe the slates, scrubbing hard. At the end of the lane I looked back, and her door was still open a crack."
effects = [{}, {}, {}, { title = "The Embroidered Pouch" }]

[tracks.bond_aisha.chapters.a2.choices.stay_summer]
text = "Skip the voyage this summer and stay in Fez hauling books and mending benches for her pupils."
hint = "Staying a whole summer for her—it’s too soon to say that, and she wouldn’t let you."
reply = "I wrote to my father that there were examinations at school and I couldn’t get away. He wrote back two pages of abuse. Aisha knew there were no examinations and never asked a thing. But from that day on, when lessons were done, she poured one extra glass of tea and set it beside whatever bench I was halfway through mending. I mended seven benches that summer. The pouch hung at my belt every day, with two actual pens inside."
effects = [{}, {}, {}, {}, { title = "The Embroidered Pouch" }]

[tracks.bond_aisha.chapters.a2.choices.joke_away]
text = "Tell a joke and change the subject."
reply = "I told a joke from the Algiers docks and gave it everything, hand gestures and all. She heard me through to the last line without smiling, then put the pouch back in her sewing basket and closed the lid. “Take care on the road.” I left early that day."

[tracks.bond_aisha.chapters.s]
title = "Grandmother’s Key"
text = "At the end of the year the Qarawiyyin let out, and the caravan back to Algiers was set for the end of the month. Aisha’s family and mine had each kept the door key to our old house in Granada. Ours my grandmother had pushed into my bag three years before: “A boy going off to study should carry it.” Theirs was locked in her father’s book chest. Let’s each take a rubbing, she said. We spread paper in her courtyard and rubbed with charcoal. She worked carefully, every nick in the teeth showing; I hurried, and one corner of my sheet crumpled. “Your door was in the Albaicín?” she asked. “Grandmother says it was behind an orange tree.” “Ours was on the slope under the palace.” She laid the two rubbings side by side on the windowsill to dry and weighed them down with two pebbles. “The doors have been gone a long time.” The wind lifted the corners of the paper and let them fall again. “The keys are still here.”"

[tracks.bond_aisha.chapters.s.choices.promise]
text = "Trade rubbings, and promise a book for her pupils every time I make port, its flyleaf saying where it came from."
hint = "You’ve already made your one lifelong promise to someone else—this rubbing you can only keep as a memento."
reply = "I handed her mine, and she handed me hers. She slipped mine into the thickest of her father’s books and pressed it flat. “Every time you make port, one book,” she said. “Write it on the flyleaf: which ship it came off, whose it was before.” “And if I buy it honestly?” “Then write which bookstall, and what you paid.” She’d already pulled a sheet toward her and was writing a list: first books for learning letters, then arithmetic, then poetry. At the seventh title she stopped, thought, and added one more for my little sister. “Don’t keep them waiting too long for the first one.” I folded her rubbing in four and slid it into the pomegranate pouch. It fit exactly. She filled half the sheet and pushed it at me before the ink was dry, and told me to have it by heart before I reached the coast."
effects = [{}, {}, {}, {}, { title = "Grandmother’s Key" }, {}]

[tracks.bond_aisha.chapters.s.choices.heart]
text = "Wrap my rubbing in the pouch she embroidered and ask her to keep it for me till we meet again."
hint = "She won’t keep the pouch for you—you two aren’t there yet, or else your promise already belongs to someone else."
reply = "I folded the rubbing, slid it into the pomegranate pouch, and tied the drawstring the way she had that day—one knot, two tugs to see it would hold—and handed it back to her. “Keep this for me,” I said. “Give it back next time we meet.” She looked at the pouch, then at me, and went red to the tips of her ears. “I’ll keep it,” she said. “But you’re not to write and ask how it’s doing.” “Then I’ll ask how the key’s doing.” At last she laughed out loud. She tucked the pouch into her sleeve and pressed her own rubbing into my hand. “You take this one. It’s my family’s door—don’t lose it.” She walked me to the end of the lane, and the back of her hand brushed mine, and was gone again just as quickly."
effects = [{}, {}, {}, {}, { title = "Grandmother’s Key" }, {}]

[tracks.bond_aisha.chapters.s.choices.own]
text = "Keep my own rubbing, and each go our way: she stays in Fez, I go to sea, and nobody promises anything."
reply = "“That’s just as well,” she said with a nod, and peeled my rubbing off the windowsill. “No counting the days till a ship comes in.” She took a pen and wrote a line on the back, blew on it till it was dry, and only then folded it and gave it to me. I didn’t look at it there. Once the caravan was through the city gate, I opened it on the camel’s back. It was the last line of that poem. All these years I’d recited it, and somewhere in the second half it always fell apart on me; I had never once made it to the end. I turned the rubbing over, teeth of the key up, the line of verse face down, and pressed it into the book I carried with me."
effects = [{}, {}, {}, { title = "Grandmother’s Key" }, {}]

[tracks.reunion_aisha]
name = "Aisha: The Names Added Since"

[tracks.reunion_aisha.chapters.reunion]
title = "The Names Added Since"
text = "I brought a crate of books from Algiers, more than ten days overland to Fez. Aisha had her own teaching chair now, in a side room of a college in the Andalusian quarter. Her pupils weren’t only the neighbors’ daughters now: two weavers’ wives sat at the back with slates on their knees. I opened the crate. Every flyleaf said where the book had come from. She chose first, and handed one back to me. “Too hard. Wait till they’re two years older.” She led me over to the wall. The list of the old owners from that first crate was nailed there, the paper gone yellow. Valencia, Miguel Qasim—and after it, a line in fresh ink: Book returned. Further down there were three lines like that. “Ten years of looking, and I’ve found three.” She put the book she’d rejected into my hands. “What we agreed that summer—you still owe me. All these years, whose cargo have you been taking?”"

[tracks.reunion_aisha.chapters.reunion.default]
effects = [{ text = "Tariq—The chair is open, in a side room of a college in the Andalusian quarter. Twenty-one pupils. The oldest is two years older than my mother; the first day she held her slate upside down, and the second day she turned it the right way herself. I’m enclosing a book list, easiest first, hardest at the end—don’t buy the wrong ones. Three more names on the wall have been found, and their books have gone home. Miguel Qasim was the first. He’s in Rabat. He wrote back to say he read that book three times as a boy. What you owe me from that summer is still on my books. I keep a gap on the shelf, and there is always someone waiting their turn—this time, the one I’m waiting for is you. —Aisha" }, {}]

[tracks.reunion_aisha.chapters.reunion.choices.give_books]
text = "Hand the crate over to her lessons, and promise her a new load every year."
reply = "I went through the years ship by ship: whom I’d taken, whom I’d let go, which crews I’d later ransomed out of Algiers. She heard it all without saying whether it was good or bad. Then she had her pupils sit down, and in front of them she read out each flyleaf, where every book had come from. When she reached one that had come off my father’s ship, she didn’t pause; she read it as clearly as the rest. After the lesson she took down the list of old owners and added a line at the very bottom: This year’s books, from Tariq. “A load every year.” She nailed the list back up. “There’s a line of readers behind this lot—don’t be late.” I asked what the penalty was if I was. She thought about it. “You hold the slates.”"
effects = [{}, {}, {}, { title = "The Names Added Since" }]

[tracks.reunion_aisha.chapters.reunion.choices.the_key]
text = "Take out the rubbing she gave me, and ask whether she’s still keeping mine."
hint = "What you said back then never went that far, and she won’t be the first to say it today."
reply = "First I answered her: whom I’d taken, whom I’d let go, how many I’d ransomed, not one number left out. Then I took the rubbing out of my shirt. Eight years, and the folds had worn white. She looked at it a long time, then turned and took a dark blue pouch from a box beneath the lectern. The pomegranate blossom had faded; the knot at the neck was the same one. “You never once wrote to ask how it was doing,” she said. “You kept your word.” She undid the knot and laid the two rubbings side by side on the lectern. “The keys haven’t opened a door in years.” “Then are you still keeping it?” She took my hand and held it a long time before she let go, her eyes on the two sheets of paper. “When the lesson’s over,” she said, “come and walk me home.”"
effects = [{}, {}, {}, { title = "The Names Added Since" }]
