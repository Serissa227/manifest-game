# 乌尔苏拉（bond_ursula / reunion_ursula）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、变体、回忆标题、来信），玩法字段一律不写。
# 2026-10-12 C7 重写，与中文同一轮写完；美式拼写、弯引号。口头禅原句 “I didn’t lose. The books aren’t closed yet.” 只在 C1 出现一次。

[tracks.bond_ursula]
name = "Ursula: The Account Isn’t Settled"

[tracks.bond_ursula.chapters.c1]
title = "Nuremberg Counters"
text = "The schoolmaster chalks a problem on the slate: a bill of exchange from Lyon, three hundred écus, each écu worth sixty-five groats. How many Flemish pounds? Ursula tips her bag of Nuremberg counters onto the reckoning cloth with a clatter of brass, slides a few about, and shoots up her hand. “Eight hundred twelve pounds, ten shillings!” I’m still dividing by two hundred forty in my head, one breath behind. “Eighty-one pounds, five shillings.” The master writes both answers side by side. I see it at once: her very first counter went down one line too high, every counter after it followed, and her answer is ten times too big. “The problem was unclear,” Ursula says. “It didn’t say which écu.” The master says a Lyon bill only knows one kind. Then she says, “In Augsburg, this is how we reckon it.” The master gives it to me. Ursula stops talking. She picks her counters up one at a time and drops them back in the bag, thirty-one of them, not one left behind, and then she lifts her chin at me. “I didn’t lose. The books aren’t closed yet.”"

[tracks.bond_ursula.chapters.c1.choices.bet_next]
text = "Bet her on the next problem, for a piece of her family’s gingerbread."
reply = "“Fine. What are you putting up?” I tell her that if I lose, she can copy from my answer book for a day. The next problem is the London rate, and this time her hand goes up first, every counter on the right line. I concede and push my book over. She pushes it straight back without looking. “Who’d want to copy yours? You bet the wrong thing.” So no gingerbread either. In the margin of my book I write: “First problem, me. Second, her. Gingerbread, none.” She leans over, reads it, and sniffs. “Write what you like. I’ll get that first one back from you.”"

[tracks.bond_ursula.chapters.c1.choices.show_your_work]
text = "Slide your working across and let her find which line she got wrong."
reply = "I turn my scrap of working over and push it to her, eighty-one pounds five shillings at the bottom. She won’t take it. After a while she pulls it over anyway and runs her finger down my figures, place by place, and at the very first line she stops and goes red to the ears. She doesn’t say a word, just pushes the paper back. Next morning there’s a counter on my desk, the brass rubbed shiny, the imperial orb stamped on it worn down to a ring. It’s the oldest of her thirty-one. From then on her bag holds thirty."

[tracks.bond_ursula.chapters.c2]
title = "Gingerbread After Tattling"
text = "When the Exchange bell strikes eleven, the pepper price goes up on the board. In French class I note today’s figure in the margin of my book: twenty-two groats a pound, up one from last week. Ursula sits behind me and to the left. She raises her hand. “Master, Lieve is copying down prices from the Exchange.” The master has me write out the verb “to be” twenty times. Six persons, six lines a time, a hundred twenty lines, and the bell strikes twelve before I’m done. After class Ursula is waiting by the door with a piece of gingerbread on her palm, a thin wafer stuck to its underside, sent from Nuremberg by her family. The whole school knows she never shares her gingerbread. Not even the master has had a taste. She shoves it into my hand. “Don’t take it as an apology. You copy so slowly I got hungry just watching.” Then she glances at my fingers, rubbed red from copying, and looks away."

[tracks.bond_ursula.chapters.c2.choices.split_it]
text = "Take the gingerbread, break it, and give her half."
hint = "Her hand is still stiff around the gingerbread. She’s only just told on you, and she can’t bring herself to share it with you."
reply = "I break it in two and hand back the bigger half. She takes it and stares at it. “You’d keep accounts on a piece of gingerbread.” “The bigger half’s yours,” I say. “The one who told did more of the work.” She glares, then bites. We stand in the doorway and finish it, crumbs all over the step, and two sparrows come for them. All the way till we part, the tattling never comes up."

[tracks.bond_ursula.chapters.c2.choices.refuse_it]
text = "Turn it down: you only take what can be reckoned."
reply = "“One piece of gingerbread,” I say, “doesn’t cover a hundred twenty lines.” Ursula thinks it over. “Then reckon it. Twenty times through the verb. What each one’s worth, divide it out yourself. It all comes to one piece of gingerbread.” She leaves it on my desk and walks off. I copy out the last line with it sitting in front of me, then finish it in three bites. It’s sweet."

[tracks.bond_ursula.chapters.b1]
title = "The Wooden Bird in the Yard"
text = "Every year the archers’ guild shoots at a wooden bird on a pole below the city wall, and whoever brings it down is king for a year. Girls stand behind the rope and watch, and then they go home. In the first week of the autumn term, Ursula borrows a small bow from her cousin, plants a pole in the school yard, and hangs a wooden bird at the top that she painted red herself. “In Augsburg we have rules for shooting the bird,” she says. “Miss once, sing a verse. I keep score.” I miss three times and sing three verses, loud enough that the porter puts his head out. Then it’s her turn, and her first arrow grazes the pole and lands in the neighbor’s cabbages. “The wind shifted,” she says at once. “That one doesn’t count.” All through my third verse I was watching the weathercock on the roof across the way. “It turned once in a quarter of an hour,” I say, “and that was before my first shot. Your wind is the same wind I had three times.” Ursula grips the bow, and slowly turns red."

[tracks.bond_ursula.chapters.b1.choices.make_her_sing]
text = "They’re her own rules. Make her sing a verse."
hint = "Her fingers are hooked on the string, knuckles white. You two aren’t close enough for this. Push her now and she’ll smash the bow."
reply = "“Your rules,” I say. “Sing.” She glares at me for a long time, and then she sings: an Augsburg nursery song about a goose crossing a river. The tune ends up on the far bank, and the porter laughs in the gateway until he coughs. When she’s done she shoves the bow into my hands. “I’ll pay you back for that verse.” “I’ll be waiting,” I say. “Interest by the month.”"

[tracks.bond_ursula.chapters.b1.choices.call_it_wind]
text = "Let her off: that arrow belongs to the wind."
reply = "“The wind’s,” I say. “That one doesn’t go on the board.” Ursula eyes me for a good while. “When you’re this generous, you’re keeping some account.” I say I’m not. She doesn’t believe me, gives me another look, and only then nocks her second arrow. It takes the bird square in the wing and chips off a flake of red paint. She turns her head and lifts her chin at me."

[tracks.bond_ursula.chapters.b2]
title = "A Bad Debt in Her Name"
text = "Ursula comes on a Saturday afternoon with an old ledger under her arm, its leather cover rubbed fuzzy. She opens it to a dog-eared page and pushes it in front of me. Her name is written at the top. The account was opened in 1549, when she was nine, and it holds a single entry: four thousand two hundred ducats, advanced to the Spanish Crown. Not a copper of it has come back. “I found it going through the old books at home,” she says. “The money my father advanced to the Crown is booked under my name.” She has brought a bundle of vouchers too, tied with twine. “In all Antwerp, you’re the only one I trust to reckon straight. Check it for me.” She runs the sum on the reckoning cloth first. She moves the counters very slowly, and each time one slides, her lips move, as if she were saying no."

[tracks.bond_ursula.chapters.b2.choices.verify_with_her]
text = "Go through every voucher with her and circle the ones she never signed."
hint = "She’s pressing the page to her chest and won’t let go. She doesn’t trust you yet to keep this out of the Exchange."
reply = "There are seventeen vouchers. We check them until dark and go through two candles. Fourteen carry her father’s signature. Three are signed “Ursula” at the bottom, in round, careful letters, every stroke traced, too neat for any nine-year-old. I circle those three in charcoal. She looks at the circles for a long time without speaking, and finally says, “Those three, I haven’t accepted. Not yet.” Then she gives a crooked little smile at herself, takes the charcoal from my hand, and puts a small cross beside each circle."

[tracks.bond_ursula.chapters.b2.choices.tell_her_father]
text = "Tell her to take the page straight to her father and ask."
reply = "“Ask him,” I say. “It’s your name on it. You have every right to ask.” Ursula doesn’t come back until the next afternoon, eyes red, nose red. “He said I’d understand when I’m grown.” She folds the page in four, then once more, and stuffs it into her counter bag and ties the mouth tight. “How much more grown?” she asks me. I don’t have an answer."

[tracks.bond_ursula.chapters.a1]
title = "A Bet on the Crown Paying"
text = "The new king hasn’t been on the throne half a year, and everyone at the Exchange is working out whether the Spanish Crown can still pay. Under the inkwell on my family’s exchange table sits one of the Crown’s bills, nine hundred ducats, four months overdue. Every morning Father slides it out, looks at it, and slides it back. Ursula comes to find me and starts with, “He’s still advancing.” Last week her father put up more for the Crown, more than the sum on the bad-debt page. “I told him. He won’t listen to me.” We sit in the arcade of the Exchange, four languages squabbling around our feet. She turns a counter over and over between her fingers, and on the seventh turn she stops. “Let’s bet. Before Christmas, does the Crown pay or not?”"

[tracks.bond_ursula.chapters.a1.choices.bet_no]
text = "Bet it won’t pay, for new stakes: whichever house falls first, the other comes running."
hint = "She’s closed her fist around the counter. You aren’t close enough yet to put up stakes like that."
reply = "When I finish naming the stakes, the counter stops between Ursula’s fingers. She looks at me a while, then holds out her hand and claps it against mine. Her palm is cold. “Done.” She puts the counter back in the bag and adds, “It’s the first time I’ve ever hoped to lose a bet.”"

[tracks.bond_ursula.chapters.a1.choices.refuse_bet]
text = "Don’t bet on this. You only bet on what can be reckoned."
reply = "Before I’m done saying it, Ursula pushes her counters over. “Then reckon it.” On the stone bench of the arcade I lay out, line by line, what her father has advanced these past years and what the Crown has paid back. When I take one from the other, the column that’s left runs to the edge of the bench. Ursula goes white. She gathers the counters up one by one. “Then we won’t bet.”"

[tracks.bond_ursula.chapters.a2]
title = "A Knight One Size Smaller"
text = "During afternoon study at the Laurel school, Ursula sets a wooden horse on my desk. Her family has a chess set brought from Augsburg, and when they moved house they lost a black knight. She spent the summer carving a new one from the one that was left, and her left thumb is still wrapped in a strip of cloth. The new knight is a size smaller than the old one. Back on her family’s board, it looks like a foal trotting after a horse. “It doesn’t suit our set,” she says. “Last time I saw yours, it was missing one too.” She says it offhandedly, looking out at the yard. But every strand of the mane is carved. I count them: twenty-three. “It’s pearwood,” she adds. “In Augsburg we only carve chessmen from pearwood. If it’s too small for you, never mind.”"

[tracks.bond_ursula.chapters.a2.choices.keep_knight]
text = "Keep the knight, and tell her you’ll beat her with it next game."
hint = "She carved it all summer, and her thumb is still bandaged. You aren’t close enough yet for her to trust it to your hands."
reply = "I close my hand around the little knight. “Next game, I’ll beat you with this.” “You can’t,” Ursula says. “Then I’ll put it on account.” At last she turns back from the window, and laughs. “Fine. One more line on the books.” That night I wipe out the empty slot in our chess box at home and set the knight in it. It’s a size too small, and the lid still shuts."
effects = [{}, {}, {}, { title = "A Knight One Size Smaller" }]

[tracks.bond_ursula.chapters.a2.choices.pay_for_it]
text = "You only accept gifts with a price. Ask her what the knight is worth."
reply = "I ask her to name a price. Ursula doesn’t blink. “One gold florin.” “For wood?” “For a summer’s work.” I haggle. She won’t give. We go from a florin down to six stivers and back up to eight, and we’re still at it half an hour later when the porter comes to lock up. The final price is one game of chess, her playing white, her moving first. Until the game is played, she holds the knight as security."

[tracks.bond_ursula.chapters.s]
title = "Two Counting Houses"
text = "In December the Laurel school has only a few days of lessons left. Ursula sets her counter bag on my desk and draws out a folded sheet of account paper. “In the spring my family’s house goes over to doing business for the Genoese,” she says. “Running their bills, taking a commission. I’m not going over with it. I want a counting house with my own name on the door.” “Your father agrees?” “He doesn’t know yet.” She smooths the sheet flat. “You’re going to sea in the spring. I know.” A line down the middle divides the page into two columns. At the head of the left one is written “Ursula,” at the head of the right, “Lieve de Clercq,” and below them there isn’t a single line. She dips the pen and lays it across the page between them. “The first entry. Who writes it?”"

[tracks.bond_ursula.chapters.s.choices.promise]
text = "Agree that every big account, from now on, goes to the other to check for errors."
hint = "She holds out the pen, and your hand won’t come down. Either you two haven’t come far enough for a promise like this, or the one promise a life allows, you’ve already made to someone else."
reply = "“Every big account from now on,” I say, “before we close it, goes to the other one to find the errors. Yours to me, mine to you.” Ursula holds the pen a while, thinking, then writes the first entry straight across both columns: “Errors checked both ways, no fee, ever.” She writes slowly, and the ink of the last word spreads a little. “No fee?” I say. “Is that how your family does business in Augsburg?” “Nobody in Augsburg does business like this.” She hands me the pen. “It’s the worst deal I’ve ever made. Sign.” I sign at the foot of the right column and she signs at the foot of the left. She folds the sheet, folds it again, tips a few counters out of her bag, tucks the paper in, and drops the counters back one by one. “Check hard,” she says. “If you cover for me on a single line, the deal’s void.” “Same for you.” “I never cover for anybody.” She ties the bag shut. “When you’re at sea, don’t fill your first letter with waves. Send your books.”"
effects = [{}, {}, { title = "Two Counting Houses" }, {}, {}]

[tracks.bond_ursula.chapters.s.choices.own]
text = "Agree to meet in ten years and see whose counting house is bigger."
reply = "“Ten years,” I say. Ursula’s eyes light up, brighter than for any sum she ever got right. “Bigger how?” “By the books. Whoever has more pass through her hands in a year.” “Borrowed money doesn’t count.” “Borrowed money doesn’t count.” In the left column she writes: “December 1566. Compare books.” Underneath she adds: “The loser keeps the winner’s books for a year.” Then she pushes the pen at me. “Sign.” I sign, and so does she. She holds out her hand and I clap mine against it. There’s a hard ridge of callus across her palm, worn there by years of pushing counters. “If you drown at sea,” she says, “that counts as a loss.” “If the name on your door isn’t your own, that counts as yours.” She sniffs and tucks the sheet into her counter bag. “Then get ready to keep my books.”"

[tracks.reunion_ursula]
name = "Ursula: A Door Bearing Her Own Name"

[tracks.reunion_ursula.chapters.reunion]
title = "A Door Bearing Her Own Name"
text = "In 1561 I come back to Antwerp. Ursula’s family house has moved to a narrow street behind the Exchange, the shop front half what it was. The Genoese have squeezed them hard these past years. When the Crown stopped paying in ’57, not a copper of her father’s advances came back, and an agent of the Genoese even came to the door with a copy of the debt booked in her name. She sits at the last table at the back, sleeves rolled to the elbow, her counters laid out in three columns on the cloth. Against the table leg leans an oak signboard, the letters cut but not yet painted: her own name, and after it, Counting House. The counting house doesn’t exist yet. She looks up, sees me, starts, doesn’t get up, and pushes a ledger across the table. “Find the errors. Then you can sit.”"

[tracks.reunion_ursula.chapters.reunion.default]
effects = [{ text = "Lieve: You didn’t come back, so by the rules of bookkeeping, I’m entering it. 1557: the Crown stops paying. My father’s advances, recovered: nothing. 1558: the Genoese agent comes to the door with the page that has my name on it and wants me to acknowledge it. I don’t. Their notary is still running around over it. The original of that page is locked in my own chest, and the key hangs around my neck. I don’t take it off to wash. 1559: Father wants my name on the contract to run bills for the Genoese. I won’t sign, and he moves my desk into the storeroom. 1560: in the storeroom I keep books for three cloth merchants, and more passes through my hands in a year than through the whole house. 1561: the sign is carved. Oak, unpainted, leaning against my table leg. It goes up the day I open, next year. Of your books these years at sea I’ve seen not one line, so I don’t know what to write in your column. Come back and report it yourself. In Augsburg we don’t accept an account without vouchers, and we don’t in Antwerp either. Ursula. Between you and me: unsettled." }, {}]

[tracks.reunion_ursula.chapters.reunion.choices.friend]
text = "Check her ledger cover to cover, then help her hang the sign."
reply = "She never said I could sit, so I read standing up. It’s the ledger she keeps for three cloth merchants: fourteen thousand pounds through her hands in a year, more than her father’s house took this year. I find two errors. In one, the Antwerp–Lisbon rate is copied a place off. In the other, she’s taken too small a commission. The first she owns with one look and corrects. The second she won’t. “I took less on purpose. That house is a widow’s.” “Then book it as a discount, not as commission.” We argue over that one line until dark and the clerk lights the lamp, and in the end she changes it to “discount” and tells me I’m a busybody. Then we carry the sign to the door and try it against the frame. I hold it while she stands on a stool and drives in two nails, hangs it, and crosses the street to look at it for a long while. It’s not too crooked. “This one,” she says, “I’ll put down to your account.” Then she takes it down again and leans it back against the table leg. “It goes up the day I open. The nails stay.” When I leave, the two nails are still in the doorframe."
effects = [{}, {}, {}, { title = "A Door Bearing Her Own Name" }]

[tracks.reunion_ursula.chapters.reunion.choices.rival]
text = "Ask her: the sign is carved and the house isn’t open. Is that a loss?"
reply = "Ursula hears me out, pushes her counters aside, and looks up at me, carefully, the way she’d look at a bill of doubtful origin. “Counting from the December I left the Laurel school, ten years. There are five left.” She gets up, lifts the sign from beside the table leg, and holds it against her, the oak edge digging into her arm. “If I can’t open in five years, I’ll keep your books for a year, every line of them.” “I have a lot of books.” “Then I’d better open.” She goes on, “The last time the Genoese came to the door, I hid this sign behind the cupboard, so they wouldn’t see it and laugh. I’m not hiding it anymore.” She sets it back, facing the door, the first thing anyone coming in will see. “Come back in five years and look.” I don’t sit, and I don’t check her ledger either. I put on my hat and go. I’m at the corner when she shouts after me: “Five years!”"
effects = [{}, {}, {}, { title = "A Door Bearing Her Own Name" }]

[tracks.reunion_ursula.chapters.reunion.variants.v1_promise]
text = "In these four years Ursula has sent me two big ledgers to check, and I sent back a list. Her reply was one line: “The third one doesn’t count. You misread it.” In 1561 I come back to Antwerp. Her family house has moved to a narrow street behind the Exchange, the shop front half what it was. When the Crown stopped paying in ’57, not a copper of her father’s advances came back, and an agent of the Genoese even came to the door about the debt in her name. She sits at the back table, her counters in three columns. Against the table leg leans an oak sign, unpainted: her own name, and after it, Counting House. She sees me, doesn’t get up, and pushes a ledger across. “Old terms. No fee. Find the errors, then you can sit.”"

[tracks.reunion_ursula.chapters.reunion.variants.v2_own]
text = "Five years left until the year we agreed to compare books. In 1561 I come back to Antwerp, and the first thing I do is go and see how big Ursula’s counting house has grown. Her family house has moved to a narrow street behind the Exchange, the shop front half what it was. When the Crown stopped paying in ’57, not a copper of her father’s advances came back, and an agent of the Genoese even came to the door about the debt in her name. She sits at the back table, her counters in three columns. Against the table leg leans an oak sign, unpainted: her own name, and after it, Counting House. The counting house itself doesn’t exist yet. She sees me, and her chin goes up before anything else. She pushes a ledger across. “Find the errors, then you can sit. If you can’t find any, stand.”"
