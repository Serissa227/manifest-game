# 村上鹰丸：下田的潮（bond_takamaru）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# C21b 审读后（2026-11-12）：好感方向改了、或手册点名删掉的原句所在的章，英文整章删掉回退中文：bond_takamaru.b1、bond_takamaru.a2。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上、又新加了选项与变体，照“缺译回退中文”（整章未译可回退）整章删掉，待照新中文重译：bond_takamaru.s。重逢一章是轨道里唯一的一章，删了就不算“整章未译”，所以保留，只补新加的变体与选项、改掉与新中文对不上的几条（见各条上方注释）。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_takamaru]
name = "Murakami Takamaru: The Tide at Shimoda"

[tracks.bond_takamaru.chapters.c1]
title = "The Tide at Shimoda"
text = "Where the Shimanto River reaches Shimoda it runs head-on into the incoming tide, and the race boats fight it out in that churned brown water. It took me three days of pestering before my nurse Ase put me in a fisherman’s skiff, and she told the owner twice not to let the young lady fall in. When the drum sounded I pulled for all I was worth, half my strokes slapping the surface. One boat up ahead didn’t keep to the middle. It slanted off toward a darker stretch of water by the left bank and in no time had left everyone behind. I chased it to the end and still finished two boat lengths short. Its rower ran ashore, hopped up onto the bow, burned red-brown by the sun and all white teeth. “Court princesses can’t pull an oar.” The fishermen on the bank laughed along. He drew a knife from his belt and cut a notch into the plank of his own boat. A whole row of notches was already there, long and short. “Seventeen.” I wrung out my soaking sleeve so the water splashed at his feet and pointed at the new notch. “That one. Carve my name next to it, in full.” “Losers get their names on it too?” “Who you lost to, by how many lengths—that all gets written down. I don’t accept a ledger kept halfway.”"

[tracks.bond_takamaru.chapters.c1.choices.carve_my_name]
text = "Make him carve my name beside that notch, every stroke of it."
reply = "He grumbled that court names had too many strokes, but he carved it. The three drops of water in “Mio” came out as three gouges, and the right half of the character wandered into the seam between planks. He shoved the knife back in his belt. “The day you beat me, you can carve your own.” “Then wait for it.” “I’ll wait. Just don’t cry when it comes.” Ase called from the bank for me to come and change. When I looked back from a long way off, he was still crouched by the boat, picking at the crooked character with his finger."

[tracks.bond_takamaru.chapters.c1.choices.ask_shortcut]
text = "Ask him how he spotted that line along the left bank."
reply = "He stopped short; he hadn’t expected the loser’s first question to be that. He pulled me down to squat at the water’s edge and pointed to a dark band running across the river. “That’s where the tide turns. The river pushes out, the sea pushes in, and where neither wins the water goes slack. A boat on that line does half the work.” I stared a long while before I saw the band was moving, darker, then lighter, then darker. “See it?” “I see it.” He stood and slapped the mud off his knees. “For a court princess, you’ve got eyes.”"

[tracks.bond_takamaru.chapters.c2]
title = "The Broken Kobaya"
text = "Ushio dragged someone over to meet me: her cousin from Noshima, spending the autumn with an uncle in Shimoda. One look and I knew him, the boy who had notched his plank on race day. His name was Murakami Takamaru. The three of us stood around a kobaya on the riverbank that was close to falling apart. The hull had a split wide enough for two fingers. Takamaru tossed me a cloth bag. “You hand me nails. Don’t touch anything else.” The nails inside were all different lengths. I tipped them out onto a plank and laid them in a row from shortest to longest, twenty-three of them, and asked, “Which of these goes straight through the hull?” He crouched, weighed each one in his hand, picked out the two longest, and flung them into the sea. “Then which one were you going to use?” He didn’t answer. He rolled under the boat and braced his back against the planking. “Hold the crack shut! When I push up, you push down. Don’t let go.” Outside, Ushio rapped twice on the gunwale. “This boat has to carry three. It can’t spare a single board.”"

[tracks.bond_takamaru.chapters.c2.choices.press_the_crack]
text = "Throw my whole weight on the crack and hold it till he says stop."
hint = "His hand shoots out from under the hull and waves you off. “This is no place for a princess to play.” He doesn’t count you as a hand yet."
reply = "I lay across the planks with both hands on the crack and my knees against a rib. Each time he heaved up from below, I bore down from above, while Ushio drove nails from outside. Half an hour went by. My hands went so numb they hardly felt like mine, and I still didn’t let go. At last he called “Stop!” and crawled out, his face covered in sawdust, squinting at me. “Not a bad grip.” He fished a nail out of the bag, the straightest and brightest of the lot, and pressed it into my palm. “Keep that. I couldn’t bring myself to use it.”"

[tracks.bond_takamaru.chapters.c2.choices.sort_nails]
text = "Keep sorting his nails by length, not one out of place."
reply = "I measured every one against the others: long on the left, short on the right, bent ones in a pile of their own. He glanced out from under the hull. “Lined up like a gift list at court.” But all that afternoon, when he wanted a nail he only called “Fifth” or “Ninth,” and he never once looked around. When we stopped at dusk, Ushio counted what was left. I hadn’t handed him a single wrong one."

[tracks.bond_takamaru.chapters.b2]
title = "Two Letters a Year"
text = "After I went up to the capital, Takamaru sent two letters a year. They traveled on Noshima boats bound for Sakai, and from Sakai on to Kyoto. He wrote on leftover ship’s ledger paper, and you could still see someone else’s figures on the back. He wrote only about tides and boats: which kobaya had capsized in the Kurushima channel, though everyone was fished out; how the spring tide had turned early this year, a good part of an hour earlier than last; how he’d got a new oar, heavier than the old one. Not a word asking about life at court. Every letter ended with the same line: “Next time I’ll let you win.” The day the second letter came, I unfolded it by the lamp and was about to put it away when the light shone through from behind and showed a fuzzy patch under that last line. I held the letter up to the flame and tilted it. The paper there had been scraped with a knife, more than once, until it was almost worn through. Something else had been written there first, and not a stroke of it could be made out. The girl who shared my room asked what I was smiling at. I told her the tide at Noshima had turned early this year."

[tracks.bond_takamaru.chapters.b2.choices.ask_what_was_there]
text = "Write back and ask what was scraped off that last line."
hint = "You lift the brush and set it down again. You two aren’t close enough for a question like that—you write the reply and tear it up."
reply = "That was the only thing I asked in my reply. Half a year passed before he answered, all tides and boats as usual; he wrote about steering through the Kurushima race for the first time. The last line was still “Next time I’ll let you win.” I held it to the lamp. Underneath, he had scraped harder than before, so hard there was a small hole, and he had patched it from behind with a scrap of sailcloth. I kept that letter under my commentary on Genji, pressed in with all the etiquette the court ladies were teaching me."

[tracks.bond_takamaru.chapters.b2.choices.write_tides_back]
text = "Write back only about Kyoto, and end with “Next time, don’t bother letting me.”"
reply = "I wrote the way he did: how many times the Kamo River rose this year, how many days the palace pond stayed frozen, which nobleman’s ox cart sank in the mud and how many men it took to push it out. For the last line I wrote: “Next time, don’t bother letting me.” This one he answered fast, in under two months. The paper held a single line: “Then come home and race.” He had pressed so hard the ink soaked through to the back."

[tracks.bond_takamaru.chapters.a1]
title = "The Second Race"
text = "For Obon I took leave and went home to Tosa. My second day in Shimoda there was another race at the river mouth, and Takamaru was back from Noshima too. Same boat, with another whole row of notches on the plank. I borrowed a skiff from a fishing family. Before the drum I didn’t watch the other boats, only the color of the water. The dark band by the left bank was still there, shifted a little from two years before. At the drum I made for it. The moment my oar went in, the boat moved as if someone had shoved it from below. Somebody behind me was shouting. I didn’t look back. I pulled straight to shore, and my bow hit the stone steps first. Takamaru came in half a length behind. He landed without a word, yanked the cloth off his head, balled it up and threw it. It hit me square in the chest, and he turned away to steady his boat. Someone on the bank asked, “Who won?” He looked around and pointed at me, arm out straight. Then he said to me, “I keep the ledger, you know. You still owe me one.” “I won. How do I owe you?” “Win one, you race another. Noshima rules.”"

[tracks.bond_takamaru.chapters.a1.choices.keep_his_headband]
text = "Wipe my face with his headcloth, and don’t give it back."
hint = "You’re clutching the cloth and about to speak when he reaches over, takes it back, and turns to tie up his boat. You two aren’t at the point where you can get away with that."
reply = "I wiped the sweat off my face, folded the cloth into a small square, and tucked it into my sleeve. He held out his hand for it; I didn’t give it to him. He held out his hand again, looked at me, and drew it back. That night they floated the Obon lanterns, one after another down the Shimanto toward the sea. He stood next to me without a word, and stayed even after the lanterns had drifted out of sight. Only when Ase came to fetch me did he speak. “That cloth smells of fish.” “I know.” “…And you’re keeping it anyway.”"

[tracks.bond_takamaru.chapters.a1.choices.carve_it_yourself]
text = "Go to his boat, borrow his knife, and carve this race into the plank myself."
hint = "You start toward his boat, and he steps sideways to block the plank. He won’t let you touch that ledger yet."
reply = "He didn’t stop me. He handed over the knife, hilt first. At the end of the row I cut one notch, and beside it the character for my name. I had no control of the blade; it came out even more crooked than the one he’d carved for me two years before. He kept his eyes on the notch. “First race I’ve lost since number seventeen.” A pause. “That’s ugly carving.” But he blew the shavings out of the notch with his sleeve, and kept blowing long after they were gone."

[tracks.bond_takamaru.chapters.a1.choices.tell_shortcut]
text = "Tell him he’s the one who taught me to see that line."
reply = "He finished tying up and straightened. “Then I lost to myself. Doesn’t count.” “It counts.” “Losing to someone I taught—how does that count?” “My bow hit the shore first. So it counts.” He frowned over it a while, then held up one finger and bent it halfway down. “Then it counts for half.” On the bank, the fisherman who’d lent me the skiff slapped his thigh and cackled. He laughed too, and waggled that half finger in front of my face."

[tracks.reunion_takamaru]
name = "Murakami Takamaru: After Kizugawaguchi"

[tracks.reunion_takamaru.chapters.reunion]
title = "After Kizugawaguchi"
text = "In the summer of the fourth year of Tenshō, there was a battle at the mouth of the Kizu River. The news reached Sakai before the boats did: the Murakami kobaya had thrown fire pots one after another onto the Oda warships, the river mouth burned until past midnight, and by the light of it the supply boats got through to the Ishiyama Honganji. Half a month after the fighting, the wharves of Sakai were packed with Noshima boats. I went down them one by one and found that kobaya at the innermost jetty. Several new boards had been fitted into its side, raw and pale between the old ones, and the old ones still bore scorch marks. Takamaru sat in the bow, making tally marks on a slip of wood with charcoal. He looked up, saw me, froze, and didn’t get up. I didn’t start by asking how much they’d won. I climbed aboard and asked how many had gone out on his boat. Eleven, he said. Nine came back. I asked their names one by one and checked each against the slip in his hand. When we were done, he took a soft-creased sheet of paper from his jacket: his own copy of the tide table, covered in channels added since, the Kizu River mouth drawn thickest of all. “Added these over the years.” He tapped that stretch. “The account’s still open. Where’s that race you owe me?”"

[tracks.reunion_takamaru.chapters.reunion.default]
effects = [{ text = "Mio: I hear you didn’t make it to Sakai this year. Before the fleet heads home to Noshima, I’m sending this letter on a boat bound for Tosa, and a board with it. The board comes off my kobaya. At Kizugawaguchi the side took a hit and three boards burned black; this is one of the ones we replaced. Look at the notches on it. The last one I cut on the night of the thirteenth of the seventh month, for the Oda ships we burned. That one isn’t between you and me, but I wanted you to see it. The line written next to it is mine too: the race you owe is still owed. Eleven went out, nine came back. One of them could sing the fishing songs; one owed me thirty coppers. The singer beat the drum for me at the Shimoda race the year before last. I’ve let the thirty coppers go. I still carry the tide table. I’ve added three new channels at the Kizu mouth, and I’ll draw them for you when you come. You copied the Kurushima stretch back then, and you’ve likely forgotten it. Doesn’t matter if you have; I’ll draw it again. You’re at sea, letters are hard to get to you, and who knows when this one will reach your hands. Next time I’ll let you win. Takamaru" }, {}]

[tracks.reunion_takamaru.chapters.reunion.choices.friend]
text = "Sit down in his bow, hear the whole battle out, and agree to look out for each other at sea."
hint = "That year on the headland, I said Noshima had picked the wrong side."
reply = "I sat down in the bow. He laid the slip of wood across his knee and told it from the beginning: how they crept up on the Oda ships on the night tide, how the men in the bows lit the fire pots and hurled them, the clay shells smashing on the decks and the flames leaping up all at once. When he got to the moment of the throw, his hand began to shake on his knee, shaking charcoal dust off the slip. He stopped and pinned it down with his other hand. “More came back,” he said, “than I thought would.” I had a jar of sake brought down from shore, and with no cups we passed it back and forth by the mouth. He told me about the two who didn’t come back: one could sing the fishing songs, one owed him thirty coppers. I said I’d pay the thirty for the man, and he told me court people had no idea how things were done—who pays a dead man’s debts? Near dawn we settled it: from now on, when my ship came through the Inland Sea it would fly a white cloth at the mouth of the Noshima channel, and when he saw it he’d come out to lead the way; when his boats ran short of provisions in Sakai or Tosa, they could buy on credit in my name. He wrote that on the slip too, under the nine names."
effects = [{}, {}, {}, { title = "After Kizugawaguchi" }]

[tracks.reunion_takamaru.chapters.reunion.choices.rival]
text = "Dig up the race that’s still owed: tomorrow at first light, outside Sakai harbor."
reply = "At first light the next day we lined up outside Sakai harbor, four rowers each. A crowd came out on the Noshima boats to watch; some bet on him, some on me. Mine was a launch borrowed off a merchant ship, my rowers hired on the wharf that morning, and we were half a stroke slow off the mark. I did what I’d always done and read the water first. The tide in Osaka Bay isn’t the tide at the Shimanto mouth, and it took me a good while to find the line. I chased him to the end and came in half a length short. He ran ashore, crouched by his plank, drew his knife, and cut a fresh notch at the very end of the row. When it was done he rubbed it with his thumb and didn’t look up. “This one, I waited twenty years for.” “And the next one?” “The next one,” he said, standing, “waits till your hired men learn to row.” The Noshima sailors roared. The handful who had bet on me were hanging their heads, so I untied my purse and covered their losses, four hundred and twenty coppers, counted out faster than their own purser could. Takamaru watched from the side and said that for a court princess, I lost money very graciously."
effects = [{}, {}, {}, { title = "After Kizugawaguchi" }]

[tracks.reunion_takamaru.chapters.reunion.choices.love]
text = "Ask him what he scraped off the last line of all those letters."
hint = "Needs: you tied the cloth to his mast back then, and heart 24."
reply = "He started with the race at the Shimoda river mouth: I'd won by half a length, and he had it down as half, not one. Then I asked him what he'd scraped off the last line of all those letters. He drew a stroke on the slip of wood, then another. “Just ‘next time I’ll let you win.’ What was under it, I’ve forgotten myself.” Then: “Never did let you.” That night he walked me back to the inn by the wharf. At the door he stopped, and so did I. The lamp was lit inside; the landlady put her head out, looked, and pulled it back in. He took the linen cloth from his jacket. One corner was scorched, from the Kizugawaguchi night. “I took the one off the mast,” he said, and put it in my hand. “Your mast is taller. Tie it there.” He didn’t come in. Early the next morning his boat went home to Noshima and mine went west. Leaving the harbor the two hulls passed close, and I saw the row of notches on his plank: beside the last one, a new half-notch."
effects = [{}, {}, {}, { title = "After Kizugawaguchi" }]

[tracks.reunion_takamaru.chapters.reunion.variants.v1_still_unraced]
text = "In the summer of the fourth year of Tenshō, there was a battle at the mouth of the Kizu River. The news reached Sakai before the boats did: the Murakami kobaya had thrown fire pots one after another onto the Oda warships, the river mouth burned until past midnight, and by the light of it the supply boats got through to the Ishiyama Honganji. Half a month after the fighting, the wharves of Sakai were packed with Noshima boats. I went down them one by one and found that kobaya at the innermost jetty. Several new boards had been fitted into its side, raw and pale between the old ones, and the old ones still bore scorch marks. Takamaru sat in the bow, making tally marks on a slip of wood with charcoal. He looked up, saw me, froze, and didn’t get up. I didn’t start by asking how much they’d won. I climbed aboard and asked how many had gone out on his boat. Eleven, he said. Nine came back. I asked their names one by one and checked each against the slip in his hand. When we were done, he got up, walked to the stern, and tapped an old board with the toe of his foot. The two characters were still there: not yet raced. Twenty years of hands passing over them had worn the cuts smooth and shiny. “Ten years turned into twenty,” he said. “The account’s still open.”"

[tracks.reunion_takamaru.chapters.reunion.variants.v2_rope_in_the_fold]
text = "In the summer of the fourth year of Tenshō, there was a battle at the mouth of the Kizu River. The news reached Sakai before the boats did: the Murakami kobaya had thrown fire pots one after another onto the Oda warships, and by the light of the burning the supply boats got through to the Ishiyama Honganji. Half a month after the fighting, the wharves of Sakai were packed with Noshima boats. I went down them one by one and found that kobaya at the innermost jetty, new boards fitted into its side, the old ones still scorched. On the short mast hung a square of linen gone gray, one corner burned, still tied with the knot I'd tied. Takamaru sat in the bow over his slip of wood, and the charcoal stopped. I climbed aboard and asked how many had gone out on his boat. Eleven, he said. Nine came back. I asked their names one by one. When we were done he took out his own copy of the tide table and pointed at the Kizu mouth. “The account’s still open.”"

[tracks.reunion_takamaru.chapters.reunion.variants.v3_only_tides]
text = "In the summer of the fourth year of Tenshō, there was a battle at the mouth of the Kizu River, and the Murakami kobaya burned the Oda fleet. Half a month later I found that kobaya at the innermost jetty in Sakai, new boards in its side. Takamaru’s letters had never stopped, two a year: tides, boats, which channel’s rocks had been renamed. The last line, ‘next time I’ll let you win,’ had stopped appearing years ago, and the bottom of each page was clean, with no scraping. He was in the bow over his slip of wood. He saw me, stood, and asked how deep my ship drew, which channel I’d come by, whether I’d put in at Hyōgo. I asked how many had gone out on his boat. Eleven, nine back. I asked their names, and he gave them one by one, then said: “Your sails want replacing. Sailcloth’s cheap in Sakai this year.” The flag on his boat was the one the Mōri had given them."

[tracks.reunion_takamaru.chapters.reunion.variants.v0_itsukushima]
text = "In the summer of the fourth year of Tenshō, there was a battle at the mouth of the Kizu River; the Murakami kobaya burned the Oda fleet and the supply boats reached the Ishiyama Honganji. Half a month later I found that kobaya at the innermost jetty in Sakai, new boards in its side. Takamaru sat in the bow over his slip of wood. He saw me and spoke first: “Mōri ships. We picked the right side this time. Did you work that out?” Not a tenth of the toll had been let go, he said. I asked how many had gone out on his boat. Eleven, nine back. He gave the names fast and turned the slip over. “Shore girl, if you’re in Sakai for business, don’t come looking for anyone on this jetty.”"
