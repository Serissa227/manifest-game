# 借来的灯（bond_marietta_filo）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_marietta_filo]
name = "Marietta Filo: A Borrowed Lamp"

[tracks.bond_marietta_filo.chapters.c1]
title = "A Borrowed Lamp"
text = "Once the stall was packed up, the Filo family’s bead stand went dark, except for one oil lamp burning behind it. The lamp belonged to the old woman who sold fish next door. Marietta borrowed it every night, had it back before dawn, and bought the oil herself. Her foot worked a little grinding wheel smeared with wet sand, and between her fingers was a lens ground halfway. I had brought her a lump of glass from the furnace side, a chunk the master meant to throw back in the pot because it ran a little green. It was clear as well water. She held it up to the lamp and squinted at it with one eye for a long time, then handed me the half-ground lens. “Take a look.” I leaned into the light. Everything was fog; even her fingers looked swollen. “Can’t see a thing,” I said. “Waste of grinding.” She took the lens back, pressed it to the wheel, and gave the treadle one push. “One more turn on the wheel. Don’t be so quick to say you can’t see.” The sand hissed. The wick spat a spark, and she didn’t even look up."

[tracks.bond_marietta_filo.chapters.c1.choices.bring_more_glass]
text = "Promise her a piece of every good batch from the furnace."
reply = "“That glass is your father’s,” she said without looking up. “A few scraps aren’t worth a beating.” I told her my father couldn’t count the scraps around his own furnace. She let it drop. The next evening I tucked a clear lump into her bead basket. That night the borrowed lamp behind the stall burned until the cock crowed, and the old woman next door came asking for it twice."

[tracks.bond_marietta_filo.chapters.c1.choices.try_the_wheel]
text = "Copy her and work the wheel for one turn."
reply = "I pushed the treadle too hard. The wheel jerked, the lens shot out of my fingers, and with a plop it was in the canal. I just stood there. Marietta stared at the water, then laughed so hard she sprawled across the stall and knocked the bead basket over. When she could breathe again she wiped her eyes. “Come back tomorrow. I’ll show you how to pedal. Slow foot, then the hands can be quick.”"

[tracks.bond_marietta_filo.chapters.c2]
title = "The Old Proofreader’s Eyes"
text = "The spectacle makers of Venice had a guild, and nobody outside it was allowed to sell lenses, least of all a girl from a bead stall. But at the Aldine press there was an old proofreader who had corrected Greek all his life, and lately he missed mistakes even with the proofs pressed to his nose. Marietta ground him a pair of reading lenses, threaded them onto a string of glass beads, and sent them over as a rosary. I crossed the lagoon with her and waited by the door of the press. The old man untied the string, set the lenses on his nose, picked up a proof sheet crowded with Greek letters, and held it to the window. Suddenly he laughed. “This letter. I haven’t seen it clearly in ten years.” He put his finger on a curly little character and read it aloud, then read it again. Marietta stayed by the door and didn’t go in. She was gripping the empty string of beads so tight they clicked. On the boat home she threaded the beads back on one at a time and said only one thing: “He read it out.”"

[tracks.bond_marietta_filo.chapters.c2.choices.smuggle_lenses]
text = "From now on, hide her lenses in beads and carry them to the press."
hint = "She doesn’t trust me yet with anything that could bring the guild down on her."
reply = "I made three trips. The first two times the old proofreader just took the beads and nodded at me. The third time he pulled a worn book off the shelf, its spine rubbed white, and pushed it into my arms. “For her.” Back on Murano, Marietta opened it. On the flyleaf, in ink: “For one who sees clearly.” She wedged the book under her grinding wheel and said now it wouldn’t wobble."

[tracks.bond_marietta_filo.chapters.c2.choices.wait_with_her]
text = "Wait behind the stall with her for him to collect the next pair."
reply = "We waited four evenings. On the fifth he came. The old proofreader said nothing at all, set two silver coins on the stall, picked up the wrapped lenses and left. Marietta turned the coins over and over and rubbed them on her apron. “That’s the first money I’ve ever made from a lens.” She didn’t put the coins in the family cashbox. She slipped them into her shoe."

[tracks.bond_marietta_filo.chapters.b1]
title = "Streaks in the Glass"
text = "A batch of cups cracked a few days out of the kiln, and the master smashed every one with a hammer. He spread the pieces on a long board, chalked a number under each, and told the apprentices to say which firing each had come from. Marietta wasn’t an apprentice. She was hanging on the workshop windowsill watching. The moment the master turned his back, I hauled her in through the window. “Let’s race,” I said. “You read the streaks, I’ll read the color.” She pushed up her sleeves. “Loser hauls cullet for a day.” She held each shard to the window light, one look apiece. I went by color: green going yellow was the third firing, gray was the fifth. At the end she had eleven right and I had nine, but there were two she got wrong that I got right. She bit her lip and glared at those two as if she could stare them back into the fifth firing. The master looked the board over with his hands behind his back, then took a small piece of milk glass from his coat, the prize for whoever named the most. He looked at her, looked at me, and snapped it in two."

[tracks.bond_marietta_filo.chapters.b1.choices.write_her_number]
text = "Under the two I got right, chalk her number too."
hint = "She’s still smarting over those two. Hand her the credit now and she’ll think I pity her."
reply = "I chalked her number under those two pieces, side by side with mine. She saw it, didn’t say thank you, and walked off. Three days later, where a button had gone missing from my jacket, there was a bead of milk-white glass, ground round and bright, sewn on tight."

[tracks.bond_marietta_filo.chapters.b1.choices.learn_streaks]
text = "Ask her to teach me to read the streaks in glass."
reply = "She picked up a shard, held it to the sky, and had me follow her fingertip. “Streaks leaning left mean the kiln wasn’t hot enough. Thin and crowded means the blower was in a hurry.” She glanced at me. “Like you.” I shot back that a hurried blower is a fast one. She ignored me. I practiced all afternoon, and that night when I shut my eyes, all I saw were lines leaning left."

[tracks.bond_marietta_filo.chapters.b2]
title = "Her Father’s Mark"
text = "A bookseller from Padua ordered a dozen lenses, to be made up into six pairs of spectacles. Marietta ground them for two weeks, borrowing the lamp at night and minding the stall by day. She fitted the twelve lenses into horn frames, wrapped each pair in soft cloth, and laid them one by one in a wooden case. On the morning they were due, her father took the family’s copper stamp out of the cupboard, heated it over the brazier, and pressed it into each horn frame. A hiss, a curl of scorched smell. Once, and again, six times. His hand was steady. When he was done he shut the case. “The guild recognizes this.” Then he carried the case out the door. Marietta had stood by the grinding wheel the whole time, still holding the soft cloth. When the door closed, she picked a spoiled lens off the bench and held it up to the window for a long time. “I ground them,” she said. “He signed them.” She set the lens back down and reached for the copper stamp still hot on the rim of the brazier. Her fingertips barely touched it before she pulled them back."

[tracks.bond_marietta_filo.chapters.b2.choices.carve_her_mark]
text = "Carve her a little stamp of her own, hidden under the wheel."
hint = "She doesn’t trust me enough yet to say this out loud. She won’t let me carve her a stamp."
reply = "I found a piece of boxwood and carved for three nights. It came out a cat with one eye squinted shut, exactly how she looks at a lens. She turned it over and over. “It’s hideous.” She didn’t give it back. At the next delivery the horn frames still carried her father’s scorched mark. But on the rim of the lens right beside it was a tiny cat, scratched with a needle point to match the stamp, so small you had to bring it to the tip of your nose to see it."

[tracks.bond_marietta_filo.chapters.b2.choices.talk_to_father]
text = "Go with her to her father and set straight who ground those lenses."
reply = "When her father came home we were waiting in the doorway. Marietta said a sentence, I added one, too sharply, and she pinched me from behind. He didn’t say a word. He drank two bowls of wine, head down, before he spoke. “The guild recognizes my mark.” Then he went to bed. But all that night there was the sound of something being dragged around the house. In the morning the grinding wheel stood under the south window, the brightest in the house."

[tracks.bond_marietta_filo.chapters.a1]
title = "Dusk on the Lagoon"
text = "Carnival was almost over. Everyone on the island had rowed across the lagoon to Venice for the last night of it, and Murano had gone quiet. Marietta pulled me down onto the landing below the bell tower of San Donato, our legs dangling over the water. From her apron she took a lens she had just finished. Scratched into its rim with a needle point was a tiny squinting cat. “Look at the far shore.” I raised the lens to my eye. The bell tower across the water jumped several steps closer. I could count the joints in the brick, and see a line of washing hung out below it, one shirt with a hole in the sleeve. I yelped and nearly fell off the landing. She laughed beside me. “Can you see now?” I turned the lens slowly toward her. First there was water, then her apron, her hands, then her face, one eye squinted, waiting for my answer, close enough to see a speck of glass dust caught in her lashes."

[tracks.bond_marietta_filo.chapters.a1.choices.look_at_her]
text = "Keep the lens up and say, “I can see now.”"
hint = "We’re not close enough for me to stare at her like this. I turn the lens back to the far shore."
reply = "She reached over and took the lens away from my eye. “You’re looking the wrong way.” For once I didn’t argue. She looked down at the lens for a while, then put it in my palm. Her fingers rested there a moment, and she didn’t take it back. The bell in the tower struck, and struck again, before she said her legs had gone numb."

[tracks.bond_marietta_filo.chapters.a1.choices.keep_the_mark]
text = "Promise to keep the cat on the lens a secret until she’s ready."
hint = "She isn’t ready to trust me with that cat yet."
reply = "“When I have a workbench of my own,” she said, “the very first lens gets this cat, right in the middle, and nobody presses any other stamp on it.” I said that first lens had better be sold to me. She squinted one eye at me. “It’ll cost you.” “How much?” “Three years of getting yelled at by the furnace.”"

[tracks.bond_marietta_filo.chapters.a1.choices.first_lens]
text = "Ask her who got the very first lens she ever finished."
reply = "“My grandmother.” She swung her legs over the water. “Her eyes had gone long before. She put them on and looked at me for ages, and then she started crying. She said, so that’s what you look like.” Marietta laughed at herself. “I was nine. It was all lopsided. She wore it till the day she died.”"

[tracks.bond_marietta_filo.chapters.a2]
title = "Lace from Burano"
text = "Marietta had an aunt on Burano who had sat in her doorway making lace her whole life. This summer, every day after the stall closed, Marietta rowed over to learn, and came back with her fingertips full of needle pricks. On the first day of autumn she came to the workshop, shoved a paper parcel into my hands, and turned straight around to watch the furnace. Inside was a short length of lace edging, white thread, one little round flower after another. A few stitches were pulled crooked; anyone could tell a beginner had made it. “How long did this take?” I asked. “A summer.” She kept her back to me. I turned it over and over and found it in one corner: a tiny cat, worked into the thread, one eye squinted shut. “This time it’s thread,” she said, staring into the mouth of the furnace. “There’s no room on thread for my father’s stamp.” The fire roared in the furnace. Her ears had gone red from the heat. Or maybe not from the heat."

[tracks.bond_marietta_filo.chapters.a2.choices.take_lace]
text = "Take the lace and say it’ll go on the collar I wear to sea."
hint = "It weighs too much, this little strip of lace. We’re not close enough yet for me to reach out and take it."
reply = "“Sea wind is salty,” she said. “It’ll rot the thread inside a year.” I said if it rotted, I’d come back for her to mend it. At last she turned around, looked down at the lace in my hands, and smiled. “Then you’ll have to come back often. I charge for every mend.”"
effects = [{}, {}, {}, { title = "Lace from Burano" }]

[tracks.bond_marietta_filo.chapters.a2.choices.kiss_the_cat]
text = "Take the lace and touch the little cat in the corner."
hint = "My finger stops in midair. It isn’t time yet to touch that cat."
reply = "The moment my fingertip touched the cat, she turned and saw. She stared at my finger, and red climbed all the way down her neck. “It’s squinting one eye. It’s looking at you.” Before the words were out she had run from the workshop, leaving the door wide open, and the furnace draft came roaring in."
effects = [{}, {}, {}, { title = "Lace from Burano" }, {}]

[tracks.bond_marietta_filo.chapters.a2.choices.where_is_mark]
text = "Pretend I can’t find her mark and make her show me."
reply = "I said I couldn’t find it. She turned around, grabbed my finger, and pressed it to the corner. “Here.” I said it was too small, I couldn’t see it. She didn’t let go. She ran my fingertip over the cat twice, back and forth. “If you can feel it, that’s enough. Eyes are for lenses.”"

[tracks.bond_marietta_filo.chapters.s]
title = "A Workbench of Her Own"
text = "In spring I was to ship out on a vessel bound for Alexandria to see something of the world. Marietta was staying on Murano. One December evening she came down to the quay with a wooden case in her arms. In it was everything she had saved for: a grinding stone, a packet of fine sand, and a scribing needle tipped with diamond, all bought bit by bit with the small change from selling lenses. “All I need now is a workbench,” she said. “I’m going to fight for one of my own. Even if it’s in the kitchen. Even if it’s jammed up against the stove.” Then she took my hand and put a lens in my palm. It was cool, ground perfectly even, and scratched into its rim was the squinting cat. Only the cat. No mark of her father’s. “This is the first one,” she said. “You hold on to it.” Down the quay someone was coiling a mooring line. I closed my hand around the lens, and my palm slowly warmed it through."

[tracks.bond_marietta_filo.chapters.s.choices.promise]
text = "Agree: the day she has her own bench, I’ll come back and buy the first pair."
hint = "The lens burns in my palm. Either we aren’t close enough yet for a promise like this, or I’ve already said these words to someone else."
reply = "“Then you pay full price,” she said at once. “Not a copper less. Giving discounts to old schoolmates is my father’s way.” I said I’d pay double. “Absolutely not.” She put on a stern face. “The guild audits us. Charge the price of two pairs for one, and they’ll call it false accounts and strike my mark off the roll.” We haggled for ages over a pair of spectacles that hadn’t been ground yet, and settled it: full price, not a copper more, not a copper less, counted out face to face. She tore a corner off the paper her sand came in and scratched the price into it with her needle, then handed it to me as a receipt. The paper was too soft. The needle tore straight through, and only half a number was left. “Good enough,” she said. “As long as you can read it.” The day my ship sailed, she stood at the foot of the San Donato bell tower holding a lens up toward the deck. The torn scrap rode in my pack all the way to Alexandria."
effects = [{}, {}, { title = "A Workbench of Her Own" }, {}, {}, {}]

[tracks.bond_marietta_filo.chapters.s.choices.heart]
text = "Say that when we’re grown I’ll come back, and she can tell me why I got this lens first."
hint = "The words stick in my throat. Either my heart hasn’t come this far yet, or I’ve already given my lifelong promise to someone else."
reply = "She didn’t answer right away. Along the quay the lanterns came on one by one, and the lagoon broke into scraps of light. “By then,” she said, “I’ll have ground a better one.” She reached out and closed her hand over mine, lens and all, and held on hard. The rim of the lens pressed into both our palms, and the cat lay right across the lines of my hand. I wanted to say something more. She squinted one eye at me, the way she looks at glass that isn’t finished yet. “Not so fast. Anything you say now, I can’t make out.” So we just stood there. A sailor coiling rope walked past and whistled, and she still didn’t let go. Only when someone from her house called her in to supper did she pull her hand away and wipe it on her apron, and then, for no reason she could have given, wipe it again. “When you sail in spring,” she said, “I’ll watch from under the bell tower.”"
effects = [{}, {}, {}, {}, { title = "A Workbench of Her Own" }, {}, {}]

[tracks.bond_marietta_filo.chapters.s.choices.own]
text = "Make a bet: I find the best glass at sea, she grinds the best lenses here, and we see who’s famous first."
reply = "“Me,” she said, without even thinking. “You won’t have a furnace at sea.” I said ships have lamps. “Using a lamp for a furnace?” She called me an idiot and laughed until she had to hold her sides, then stuffed the lens into my pocket. “Keep it. When the time comes, you can show people and they’ll know I was better than you even back then.” The day I boarded in spring, she gave me a shove at the gangplank that nearly sent me off the edge."

[tracks.reunion_marietta_filo]
name = "Marietta Filo: Her Own Mark"

[tracks.reunion_marietta_filo.chapters.reunion]
title = "Her Own Mark"
text = "Five years went by before I came back to Murano. The Filo bead stall was still in its old spot, but her younger brother was minding it now. “Over there,” he said, pointing toward the canal. “She doesn’t do the stall with us anymore.” Marietta had rented a small room on the canal. There was no sign over the door, and a row of lenses sat on the windowsill in the sun. By the window stood a workbench scored all over with sand, stacked with box after box of lenses, and on the rim of every one was the squinting cat. Nailed to the wall was a letter signed with seven names, each more crooked than the last, written to the guild by the old proofreaders of the Aldine press: everything they had worn on their noses all these years had been ground by this girl. The guild had recognized her mark in the end. When she saw me she didn’t get up. First she picked up a lens fresh off the wheel and held it in front of my eyes. “Can you see now?”"

[tracks.reunion_marietta_filo.chapters.reunion.default]
effects = [{ text = "Read this as if I were across the bench from you. I can’t write pretty things, so make do. This year the guild recognized my mark. It was the old proofreaders at the press who wrote the letter, seven of them, each signature more crooked than the last. They said they wrote it wearing the spectacles I ground, so the guild could see: if your letters still aren’t straight with these on, that’s your hand’s fault, not your eyes’. I’ve rented a room on the canal and I have a workbench of my own. Not in the kitchen. Better than the kitchen. The grinding wheel came from my father. He carried it over on his back, set it down, and left without a word; the next day he brought a sack of fine sand. You didn’t come back. People tell me your ship is somewhere else. That’s all right. There’s always more glass at sea than on an island. With this letter is a small lens, the best I ground this year, with the cat on its rim. If you still can’t see clearly through it, your eyes need spectacles. Come and see me. Full price. — Marietta, of the Filo family. P.S. My aunt wants to know when you’re coming to Burano to eat clams. I said you’re busy. She said busy people still have to eat." }, {}]

[tracks.reunion_marietta_filo.chapters.reunion.variants.v1_romance]
text = "Five years went by before I came back to Murano. The Filo bead stall was still in its old spot, but her younger brother was minding it now. “Over there,” he said, pointing toward the canal. “She doesn’t do the stall with us anymore.” Marietta had rented a small room on the canal, with a row of lenses on the windowsill in the sun. By the window stood a workbench stacked with box after box of lenses, and on the rim of every one was the squinting cat. Nailed to the wall was a letter signed with seven crooked names, written to the guild by the old proofreaders of the Aldine press. The guild had recognized her mark in the end. When she saw me, her scribing needle stopped. She didn’t get up. She opened a drawer and felt around at the very back, and came out with a lens thinner than any in the boxes, the cat on its rim cut especially fine. “I said I’d grind a better one.” She held it in front of my eyes. “Can you see now?”"

[tracks.reunion_marietta_filo.chapters.reunion.variants.v2_promise]
text = "Five years went by before I came back to Murano. The Filo bead stall was still in its old spot, but her younger brother was minding it now. “Over there,” he said, pointing toward the canal. “She doesn’t do the stall with us anymore.” Marietta had rented a small room on the canal, with a row of lenses on the windowsill in the sun. By the window stood a workbench stacked with box after box of lenses, and on the rim of every one was the squinting cat. Nailed to the wall was a letter signed with seven crooked names, written to the guild by the old proofreaders of the Aldine press. The guild had recognized her mark in the end. On one corner of the bench, set apart, lay a pair of horn-rimmed spectacles with a slip of paper under them: “Ordered. Full price.” When she saw me she didn’t get up. First she picked up a lens fresh off the wheel and held it in front of my eyes. “Can you see now? That pair’s yours. The price hasn’t gone up.”"

[tracks.reunion_marietta_filo.chapters.reunion.variants.v3_own]
text = "Five years went by before I came back to Murano. The Filo bead stall was still in its old spot, but her younger brother was minding it now. “Over there,” he said, pointing toward the canal. “She doesn’t do the stall with us anymore.” Marietta had rented a small room on the canal, with a row of lenses on the windowsill in the sun. By the window stood a workbench stacked with box after box of lenses, and on the rim of every one was the squinting cat. Nailed to the wall was a letter signed with seven crooked names, written to the guild by the old proofreaders of the Aldine press. The guild had recognized her mark in the end. When she saw me she didn’t get up. First she jerked her chin at the letter on the wall. “I got famous first.” Then she picked up a lens fresh off the wheel and held it in front of my eyes. “What about you? Can you see now?”"

[tracks.reunion_marietta_filo.chapters.reunion.choices.friend]
text = "Buy the first pair she ever sells under her own mark, at full price."
reply = "I untied my purse and counted the coins out on the workbench one by one. She wouldn’t let me count short and wouldn’t let me count over. At the last coin she put her hand down on it. “That’s enough.” Her hands shook as she took the money, shook so hard two coppers rolled onto the floor, and she crouched to pick them up and stayed down there a long while. When she stood, she gathered the coins together, opened the drawer of the workbench, pushed them to the very back, and laid a soft cloth over them. “This lot I’m not spending.” She fitted the spectacles for me then and there: horn frames, with a single stamp on them, the squinting cat. She had me put them on and look out the window. Across the canal a boatman was cursing someone out, and I could see the scrap of greens between his teeth. Toward evening she locked up and pulled me into a boat for Burano. Her aunt was still in her doorway making lace. She saw us, didn’t ask a thing, got up, and put a big pot of clams on the stove. The three of us ate around the pot until dark, shells piled across the table. Her aunt squinted at me a long while and said she wouldn’t have known me. Marietta said that meant her aunt needed spectacles, and she’d grind her a pair tomorrow, no charge."
effects = [{}, {}, {}, { title = "Her Own Mark" }]

[tracks.reunion_marietta_filo.chapters.reunion.choices.love]
text = "Say I’m in no hurry to leave this time, and want to sit by her bench a few days."
hint = "What I didn’t say back then, I still can’t say now, even across a workbench."
reply = "She didn’t answer. She got up, dragged a stool out of the corner, wiped it with her sleeve, wiped it again with the soft cloth, and set it by the workbench, right against her own. “Sit.” I sat. She went on grinding, the wheel turning under her foot, not fast, not slow. I watched her grind all afternoon. Now and then she held a lens up to the window with one eye squinted, then passed it to me. If I said I could see, she nodded and put it in a box. If I said I couldn’t, she went on grinding. When it got dark she stopped and wiped the sand off the wheel. “From now on, this stool is only for you.” I asked what happened if a customer came. “Customers stand.” She leaned over and kissed me. There was a little glass dust on her lips, rough, like the wind off the lagoon. I didn’t dare move, in case I knocked the lens with only a cat on it off the edge of the bench. She laughed at me. “Things that are finished properly don’t break so easily.”"
effects = [{}, {}, {}, { title = "Her Own Mark" }]
