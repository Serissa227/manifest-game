# C7 羁绊线重写（2026-10-12，Claude Opus）：stories/bonds/bond_khadija_rihla.toml 的英文显示覆盖；按轨道、章节、选项的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应（a2 两个带赠礼的选项、s 三个选项、重逢两个选项里的 memory；重逢 default 第 1 个效果是来信）。

[tracks.bond_khadija_rihla]
name = "Khadija: Place Names in the Margin"

[tracks.bond_khadija_rihla.chapters.c1]
title = "Place Names in the Margin"
text = "In spring the teacher lectured on the roads south: out of the city, over the Atlas, down to Sijilmasa, then twenty-odd days farther to a place where they dig salt. Behind the curtain, Khadija had a sheet of paper pinned under her knee, and every time the teacher named a place she added a stroke in the margin, a circle for a town, a wiggle for a river. Just as he got to the salt place he broke into a coughing fit, and she missed it. That spot on the paper stayed bare, no bigger than a fingernail. After the lecture I leaned in by the curtain. “Taghaza. That’s what the camel drivers call it. There’s nothing out there but salt. You can leave it.” Her pen didn’t move. “Who told you that?” “A camel driver at the inn.” “Which inn? Which driver?” She folded the paper and tucked it into her sleeve. “Somebody has to dig the salt. Blank on the map doesn’t mean nobody lives there.” She was already up and heading out. Two steps on, she looked back. “Well? If he leaves with a caravan in the morning, those three syllables will only ever be your say-so.”"

[tracks.bond_khadija_rihla.chapters.c1.choices.go_ask]
text = "Go with her to the inn, find the camel driver, and have him say it to our faces."
reply = "Ali the camel driver was squatting by his animal, patching a saddle. Each time we asked, he said it again. The first time it sounded like “Taghaza.” The second time his tongue curled and it came out as something else. The third time he laughed and said it was the salt pit, whatever you called it. Khadija wrote all three beside that little spot, and under them, in tiny letters: as told by Ali, camel driver. “Anyone who turns to this page from now on,” she said, holding it up for Ali to see, “will know who to come and find.” Ali was delighted, and asked if she wanted to put his camel down too."

[tracks.bond_khadija_rihla.chapters.c1.choices.own_spelling]
text = "Insist my spelling is right; there’s no need to go all that way."
reply = "She didn’t argue. She spread the paper on the doorstep and split the little spot down the middle: mine on the left, and on the right her guess from the teacher’s accent. “You write yours, I’ll write mine. We’ll find someone who’s been there and check.” The next day she stopped a salt merchant unloading by the city gate. He squinted at the page a long while, said we were both wrong, and pronounced it a third way. She wrote the third one in the middle. The merchant walked off shaking his head, and the two of us leaned against the gateway laughing until we couldn’t stand up straight."

[tracks.bond_khadija_rihla.chapters.c2]
title = "Wells and Resting Places"
text = "Come summer, the inn by the city gate went more than ten days without a single caravan from the south. Every day after the lecture Khadija went around to check, then came back and spread her map across the salt sacks in her family’s storehouse. I took the charcoal and drew a straight line from Fez to Sijilmasa. “Shortest way.” She burst out laughing, took the charcoal back, and dotted three points along my line. “Wells.” Then two little squares. “Places to rest. There’s shade, and someone selling dates.” She traced the route again through those points, and the line bent, swung off behind the mountains, and came back. “A caravan isn’t a pen. It can’t go from one end to the other in one stroke. People need water, and so do camels.” Before she’d finished, someone outside shouted that the southern caravan was in. We squeezed into the storehouse doorway. Two fewer camels came back through the gate than had gone out in spring. The drivers’ lips were split and bleeding, and none of them said a word before they found water. The charcoal in Khadija’s hand had stopped on the second well."

[tracks.bond_khadija_rihla.chapters.c2.choices.ask_caravan]
text = "Once they’ve drunk their fill, go with her and ask whether those wells hold water this year."
hint = "The drivers only talk to people they know, and the one she brings along to ask has to be someone she trusts—you two aren’t there yet."
reply = "The lead driver looked at the map for a long time, then put his finger on the second point. “That one’s dry.” He said they’d dug there all afternoon and brought up nothing but damp sand, and the two camels went down not long after. Khadija drew a cross through the point and wrote beside it: summer 1554, dry, per the lead driver. She asked how far to the next well. He held up four fingers. She kept the charcoal clenched in her fist the whole way home. “Roads change,” she said. “If the map doesn’t change with them, it walks people straight to a dry well.”"

[tracks.bond_khadija_rihla.chapters.c2.choices.draw_camels]
text = "While she runs out after the caravan, draw a few camels beside her winding road."
reply = "I drew three. The legs came out too short and the necks too thick. Khadija came back, leaned in, and looked. “Your camels look like dogs.” I reached out to rub them off, and she pushed my hand away. “Leave them. With those there, anyone can see at a glance it’s a caravan road and not some alley in town.” When I came by the next day, there was a line of small writing beside the three “dogs”: drawn by, and then my name."

[tracks.bond_khadija_rihla.chapters.b1]
title = "The Misplaced Well"
text = "When the Saadians took the city, the lectures stopped for half a month. On the day they started again, the teacher set us an exercise. He would read out a traveler’s own account of the road from Fez south to an oasis—how many days, which wells, where to ford the river—and we were to draw it and bring the maps up to compare. One came from our side of the curtain and one from hers. The teacher held the two maps side by side up to the window and studied them for a long time. He tapped mine with the end of his pen. “You’ve left out a well, and that’s where travelers rest. Go your way, and on the third night you have no water and sleep on rocks.” Then he tapped Khadija’s. “You’ve gone half a day out of your way. There’s no bend like this in the account.” Her voice came through the curtain, not the least bit chastened. “The account doesn’t say to go straight, either.” Several people laughed. After the lecture the two maps lay side by side on the windowsill, one short a well, one with a bend too many. Before I could leave, she called to me through the curtain. “That well you left out—did you not hear it, or did you think it didn’t matter?”"

[tracks.bond_khadija_rihla.chapters.b1.choices.merge_maps]
text = "Combine the two maps into one and hang it at the inn for the next person heading south."
reply = "We spent the afternoon at her storehouse door putting them together: her resting places, my road, and that bend sketched in as a dotted line for now. The map hadn’t been up at the inn two days before a merchant bound for the Tafilalt asked the price, and paid three silver coins. Khadija laid the coins in a row on her palm and looked at them a long time without putting them in her purse. “That’s the first time anyone’s actually taken one of my maps and walked it.” She pushed one coin across to me. “Half that road is yours.”"

[tracks.bond_khadija_rihla.chapters.b1.choices.argue_detour]
text = "Argue with her: why take a detour the account never mentions?"
reply = "“Because there’s a bandits’ nest there,” she said. “Every driver goes around it.” I said the account didn’t say a word about that. “Whoever tells the road doesn’t like to admit he was scared.” We went to ask at the inn. The third driver we asked gave a start, dropped his voice, and said nobody used that pass—two years back a caravan had lost half its goods there. Khadija didn’t say anything more. When she got home she drew the bend a little bolder and wrote beside it: all the drivers go around; the one who told me wouldn’t give his name."

[tracks.bond_khadija_rihla.chapters.b2]
title = "The Key to the Storehouse"
text = "Three lectures in a row, her place behind the curtain was empty. Before the fourth, I saw her on the way there: a leather cord showed under her headscarf, and on it hung an iron key long enough to bar a door. She walked as far as the dyers’ street, stopped, and turned back. I followed her all the way to the storehouse by the city gate. The door stood open, the salt sacks were stacked to the rafters, and her father wasn’t behind the counter. “He’s sick,” she said, her back to me as she unlocked a chest. “Over a month now. My uncle says the storehouse can’t be left unminded, and the lectures can get along fine without me.” She lifted the key off her neck and gripped it until her knuckles went white. “I’ve been afraid of this day since I was little. Afraid that one day they’d say it: stop your studying, come home and count salt sacks.” She turned around. “Today they said it.”"

[tracks.bond_khadija_rihla.chapters.b2.choices.cover_store]
text = "Mind the storehouse for her a few afternoons so she can go to the lectures."
hint = "She has the key clenched tight—you’re not close enough yet for her to let an outsider into her family’s storehouse."
reply = "I counted salt sacks for three afternoons. I got it wrong the first two times, and the third time I got the count right but booked one sack to her uncle. Every day after the lecture she ran all the way back, stood in front of the stacked sacks, and went through every place name the teacher had mentioned, down to the line where he’d coughed. “There. That way, two of us heard it.” She hung the key back around her neck. “Coming tomorrow?” I said I was. Her uncle stuck his head around the door, looked at me, then at her, and left without a word."

[tracks.bond_khadija_rihla.chapters.b2.choices.talk_to_father]
text = "Urge her to go home and have it out with her father: she wants to study."
reply = "She stood by her father’s bed a long time before she spoke. I waited in the courtyard and heard only a fit of coughing, then one sentence: “We’ll talk when I’m better.” She came out with the key still in her fist. “He didn’t say yes, and he didn’t say no.” She hung the key around her neck again. “At least it’s been said out loud.” That month she came to the lectures every other day, and on the days she came, the first thing she did was find me and fill in the place names she’d missed."

[tracks.bond_khadija_rihla.chapters.a1]
title = "The First Station Outside the Gate"
text = "In spring her father was back on his feet, sitting in the sun at the storehouse door and minding the goods for her half the day. Khadija spread her map in front of me and walked her finger outward from Fez. “Ali told me this one. That salt merchant told me this one. This is the traveler the teacher read out.” She paused. “All of it somebody else’s walking. Two years on this map, and I haven’t taken one step of it.” She pointed to a dot outside the gate: the first stop on the road to Sefrou, a well and a carob tree, where caravans water their camels for the first time after leaving the city. “Out in the morning, back before dark. One day is enough. My father said yes, as long as I’m back before dark.” She laid a fresh sheet beside the map, without a single mark on it. “This stretch, I want to draw myself.”"

[tracks.bond_khadija_rihla.chapters.a1.choices.count_distance]
text = "Help her work out the distance and the hours both ways, and leave before dawn the next day."
reply = "We worked it out the way a caravan would: how many paces to a mile, at the well before noon, how long to rest, and turn for home before the sun started down. The next day we made it back through the gate before dark. Her heels were rubbed raw and her shoes were stained with blood, but the fresh sheet was crammed with detail: where the ditch ran, which rock looked like a camel’s head, how many arm-lengths the well rope was. She sat at the storehouse door dressing her feet and never once took her eyes off that sheet. “This stretch is mine,” she said. “Nobody told it to me.”"

[tracks.bond_khadija_rihla.chapters.a1.choices.walk_back_slow]
text = "Walk her to the well, then dawdle on the way back and wait for the moon."
hint = "Keeping her outside the walls until dark would set her family’s tongues wagging—she won’t agree to it yet."
reply = "On the way back I said my legs were sore, and we stopped to rest three times. She saw through it and didn’t say so; when I rested, she rested. It was the night of the full moon. The sun had barely set when the moon came up over the hills, and the city gate was still a long way off. By moonlight she traced the road on her new sheet twice. I asked why twice. “Once going, once coming back.” I asked what she’d add to the second one. At the end of the second line she drew a small circle. “The moon.” She folded the sheet. “And I’m not telling you why.”"

[tracks.bond_khadija_rihla.chapters.a2]
title = "The Letter Case for the Road"
text = "In autumn it was settled that I would go to sea. Khadija sent word for me to come by the storehouse. From behind the salt sacks she brought out a leather case: camel hide, double-stitched at all four corners, and when you snapped the lid shut and turned it every which way, nothing inside so much as shifted. “It’s what caravans carry letters in. A camel can jolt it the whole way and the letters won’t even get a dog-ear,” she said. “Took me all summer to sew. I broke five needles.” Inside lay a map. Fez sat at the center, with roads drawn all around it, south, east, down to the sea, and beside every road the name of whoever had described it. But the outermost ring had not one stroke on it, just bare paper. I asked why she hadn’t drawn that ring. “There are people out there.” She smoothed the map flat. “I just haven’t been, and nobody’s told me about it yet. The blank is kept for whoever goes.”"

[tracks.bond_khadija_rihla.chapters.a2.choices.take_case]
text = "Take the case, and promise to draw each place I travel through and send it back to her."
hint = "She keeps the case hugged to her chest—you aren’t close enough yet for her to put it in your hands."
reply = "“Be clear about it,” she said. “Which parts you heard from someone, and which parts you saw yourself.” I said it would all be things I saw myself. “Good.” She picked up her pen and drew a tiny footprint at the end of the road to the sea. “Every place you see, I’ll add one here.” She rolled the map up and tucked it into her sleeve, snapped the empty case shut, and pushed it toward me, then added, “Send it back full. And don’t make me put one in the wrong place.”"
effects = [{}, {}, {}, { title = "The Letter Case for the Road" }]

[tracks.bond_khadija_rihla.chapters.a2.choices.my_name_there]
text = "Ask her: could she put my name in that outer ring, ahead of time?"
hint = "Ask that now and she’ll only think you’re making fun of her map."
reply = "“No.” She answered fast. “That’s for people who haven’t gone yet. Write a name there and it turns into somewhere they’ve been.” She held the pen and thought for a while, then drew a very small figure at the edge of the outer ring, one leg lifted, as if about to step off. “This, I can do.” She didn’t look up. “Someone about to go.” She rolled the map up and kept it, closed the empty case, and held it out in both hands. Halfway across, her fingertips touched the back of my hand, and she didn’t pull them away."
effects = [{}, {}, {}, {}, { title = "The Letter Case for the Road" }]

[tracks.bond_khadija_rihla.chapters.a2.choices.correct_map]
text = "Point to a fork on the map that’s all crammed together, and ask her to make it clear first."
reply = "She leaned in. The fork was drawn too tight; you couldn’t tell east from south. “You’re quick enough at finding mistakes.” She added a stroke and wrote a tiny word on the eastern branch. When she’d finished, she didn’t hand the case over. She shut the lid and hugged it to her chest. “Let me go over every other fork first. Then it’ll be some use out there.”"

[tracks.bond_khadija_rihla.chapters.s]
title = "Don’t Walk It All for Me"
text = "In the last month of the year, the lectures at the Qarawiyyin broke up. A mule train left for the coast in two days, and I was going with it to join a ship. Khadija’s family caravan would head south in spring, and her father had agreed: she would go along, minding the goods and recording the road. She came to see me off, bringing the map, spread it out in the gateway, and weighed down the corners with two pebbles. “Let’s settle one thing first. The roads you send me, I’ll draw. The roads I walk, I’ll send to you. But what you send, I won’t count as places I’ve been, and what I send, don’t you count it as places you’ve been.” “If it’s all on one map, how do we tell them apart?” “You use your mark, and I’ll use mine.” She pressed the charcoal into my hand. “Don’t walk it all for me.” Wind blew in through the gate, one pebble rolled away, and she put her foot on the corner of the paper."

[tracks.bond_khadija_rihla.chapters.s.choices.promise]
text = "Promise to draw a map of what I see with my own eyes at every port, and send it to her."
hint = "The one promise of a lifetime is already given to someone else—this time, all you can leave is your address."
reply = "“A map can be wrong,” she said, “but it can’t be made up. If you haven’t been somewhere, leave it undrawn. Don’t fill it in for it.” Beside Fez she drew a little ship, and under it wrote my address, more neatly than any place name on the map. “That’s your mark. Footprints are mine.” She picked up the pebble that had rolled away and set it on the little ship. “From now on this map has ships and footprints, and each belongs to whoever made it.” I asked what happened if one day both marks landed on the same spot. She thought about it. “Then we buy someone who lives there a meal and let them judge who got there first.” Out beyond the gate, the mule bells rang for the second time. She rolled up the map, then unrolled it again and wrote a line beside the little ship: the last month of 1556, at the city gate."
effects = [{}, {}, {}, {}, {}, { title = "Don’t Walk It All for Me" }, {}]

[tracks.bond_khadija_rihla.chapters.s.choices.heart]
text = "Tell her: that outermost ring on the map—once we’re both grown, we’ll go there together."
hint = "The words keep circling and won’t come out—you two haven’t come that far yet."
reply = "She crouched there and looked at me for a long time, long enough that the muleteer outside the gate bellowed for me twice. “That ring is very big.” “Then we’ll walk a long time.” She didn’t laugh, and she didn’t say yes. She bent and blew the charcoal dust off the map, then blew again, though the paper had long been clean. She put down the charcoal, took my hand, turned the palm up, and with her fingertip drew a road on it, from my wrist to the base of my middle finger, and stopped. “As far as here,” she said. “The rest we’ll draw when you come back, when we’re both old enough.” She let go, stood up, brushed the dust off her robe, and glanced once more at the little figure with the lifted leg in the outer ring. She looked at it for a while, and left it as it was."
effects = [{}, {}, {}, {}, {}, { title = "Don’t Walk It All for Me" }, {}]

[tracks.bond_khadija_rihla.chapters.s.choices.own]
text = "Each our own way: she goes by land, I go by sea—see whose map reaches the other first."
reply = "“Land is slow,” she said, “but every step stays a step.” “The sea is fast.” “It also sinks.” We both laughed. She turned the map over and drew two lines on the back, one from Fez going south and one from Fez going north to the sea, with the whole sheet between them. “Race you.” She tucked the charcoal behind her ear. “Whoever’s line reaches the other’s first wins, and the loser buys mint sherbet at the best place in town, with plenty of sugar.” I asked what if they never met in our whole lives. “Then you owe me for life.” She picked up the pebble that had rolled away and pressed it into my hand. “Take this. When you get to the sea, throw it in, and your line has its start.” She rolled up the map and set off toward the caravan. At the corner she turned and waved the roll of paper at me."
effects = [{}, {}, {}, { title = "Don’t Walk It All for Me" }, {}]

[tracks.reunion_khadija_rihla]
name = "Khadija: A Map with Footprints"

[tracks.reunion_khadija_rihla.chapters.reunion]
title = "A Map with Footprints"
text = "Seven years on, the storehouse by the city gate had a new door, and the key still hung around Khadija’s neck. She sat behind a table made of stacked salt sacks, with a camel driver just back in town standing in front of her, writing down each answer as she asked. “How many days to the Tafilalt? Which wells have water? Did you walk this yourself, or did someone tell you?” Her itinerary book was half full, and every stretch ended with a name. Her map had doubled in size. A string of little footprints ran down the southern road all the way to the Tafilalt, with a short stretch going east as well. I spread the sea charts I had drawn over the years beside her map. She shifted them until the edges met: her desert, my coast. Between them lay a wide stretch, from her last footprint to my last port. “There are people there.” She tapped that blank with her fingernail. “It’s just that neither of us has been yet.”"

[tracks.reunion_khadija_rihla.chapters.reunion.default]
effects = [{ text = "I’m sending this with a salt merchant bound for Tangier; he says he can get it into the hands of someone on a ship. I don’t entirely believe him, but I’m writing anyway. I made it to the Tafilalt. Counting from the city gate, I drew seventeen footprints along the way. The ninth is that dry well—it has water again. Next to the old cross I added a line: spring 1561, water, I drank it myself. The itinerary is half a book now, and every stretch has the name of whoever told it. Ali’s name shows up six times, and he says from now on he wants paying. I’m enclosing a map of the part I walked. Every footprint on it is real; I didn’t add a single extra. Your sea I still haven’t touched. It’s waiting for your mark. All those places on the map nobody has drawn yet—out where you are, are there people? —Khadija" }, {}]

[tracks.reunion_khadija_rihla.chapters.reunion.choices.join_maps]
text = "Piece the two maps together with her, and write “to be visited” where neither of us has been."
reply = "We worked on the salt sacks until dark, with paste she’d borrowed from the bookshop next door. On the paper the coast met the edge of the desert, the seam a finger’s width crooked, and she wouldn’t redo it. “Crooked’s fine. The land wasn’t cut with scissors either.” For the wide stretch in the middle she had me write, and I wrote “to be visited,” too big, so she added a line in small letters beside it: whoever gets there first comes back and tells the other. When it came to signing, she wrote her name first, then handed me the pen. Then she opened the itinerary and copied out everyone who had ever told her a road: Ali the camel driver, the salt merchant at the city gate, the driver who wouldn’t give his name—for him she wrote “a camel driver.” The names filled half a page, more names than roads. “This one hangs at the storehouse door.” She blew the ink dry. “Anyone going south, anyone going to sea, can come and look.”"
effects = [{}, {}, {}, { title = "A Map with Footprints" }]

[tracks.reunion_khadija_rihla.chapters.reunion.choices.outer_ring]
text = "Bring up the outermost ring we talked about that year: now let’s go, together."
hint = "That year in the gateway, the words were never said; so today, nobody is waiting in the outer ring of her map."
reply = "Her pen stopped. “Seven years,” she said. “I’ve waited seven years for that.” She turned the map to its very edge. The little figure with one leg lifted, about to step off, was still there, and beside it was another, just as small, with its leg lifted too, the two of them side by side, one in darker ink and one in lighter. I asked what year she’d added the second. “The winter you went to sea.” She didn’t look at me. “I regretted it the moment I drew it, and couldn’t bring myself to scrape it off.” Outside the storehouse door a driver called for her to check his accounts. She answered, and didn’t move. She took my hand and turned the palm up, the way she had that year in the gateway, and drew upward from the wrist with her fingertip. At the base of my middle finger she didn’t stop. She drew all the way to the tip. “We start from here.”"
effects = [{}, {}, {}, { title = "A Map with Footprints" }]
