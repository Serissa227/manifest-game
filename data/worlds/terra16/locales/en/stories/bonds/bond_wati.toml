# 瓦蒂（bond_wati / reunion_wati）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、变体、回忆标题、来信），玩法字段一律不写。
# 2026-10-12 C7 重写，与中文同一轮写完；美式拼写、弯引号。口头禅原句只在 C1 出现一次。

[tracks.bond_wati]
name = "Wati: One More Island"

[tracks.bond_wati.chapters.c1]
title = "One More Island"
text = "At Giri the teacher had us copy out the islands of the Moluccas and Banda and learn them by heart, one after another. When my turn came I rattled them off in a single breath: Ternate, Tidore, Moti, Makian, Bacan; Neira, Lonthor, Ai, Run, Rozengain. Then I rolled up my paper and waited for the teacher to nod. A girl in the back row, her skin burned dark and glossy by the sun, put up her hand. “There’s one more.” She meant Pisang, north of Banda, where only three households live. I laughed and said an island that small hardly needed learning. She looked at me, not angry at all, and spoke slowly. “Go and ask those three households whether they think they’re small.” The teacher cleared his throat and moved on: the cloves and nutmeg of these islands, who ought to set their price? Someone said the Portuguese at Malacca. Someone said each island’s sultan. The girl put up her hand again and said, one word at a time, “Let the one who grows the tree name the price.” The teacher didn’t say she was right, and he didn’t say she was wrong. Only after class did I learn her name: Wati, daughter of an elder of Banda."

[tracks.bond_wati.chapters.c1.choices.recite_again]
text = "Ask her to say the whole list again, slowly enough that I can keep every island."
reply = "She really did start again from the top, pausing a breath at each island like someone tallying cargo on a wharf. At Pisang she added one thing: “The nutmeg there smells the best. The trees are old, and nobody has the heart to cut them.” I wrote “the best” in the margin. She glanced at it and nodded. “So princes can listen too.” I told her not to call me that. She thought about it. “Get through the list once without a mistake, and I’ll call you something else.”"

[tracks.bond_wati.chapters.c1.choices.defend_list]
text = "Say the teacher’s list doesn’t have that island, and I only learn what’s on the list."
reply = "“Then put it on.” She took my paper, borrowed my pen, and at the very bottom wrote “Pisang,” very small, every stroke careful, neater than the teacher’s hand. She gave the paper back, thought a moment, then took it again and added a line: “Three households, eleven people.” She handed the pen back. “Learn that too.”"

[tracks.bond_wati.chapters.c2]
title = "The Weight of the Cloves"
text = "A clove boat from Ternate tied up at the Gresik wharf. Wati’s uncle was taking in cargo at his warehouse, and he had her work the scale. She was quick. Basket after basket went up on the hook, and she called out the weights in an even voice, faster than the clerk could write. The boat caught the wind and left that same evening. Next morning I went to the warehouse to return a book and found her staring at the steelyard. The beam was ebony, set with a row of brass stars. She scraped one of them with her thumbnail, and when she looked up her face was white. “I read it one notch backward,” she said. “The whole boat. Every basket logged a tenth short.” The clerk said the money was paid and the boat was gone, and that this sort of thing happened on the wharf every day. Wati ignored him. She turned the ledger back to yesterday’s page, pressed her finger on the boat owner’s name, and turned to me. “Those are people from your island.”"

[tracks.bond_wati.chapters.c2.choices.send_word]
text = "Tell her my family’s boat sails for Ternate next month; I’ll carry the shortfall back."
hint = "She shut the ledger without looking at you. She isn’t ready to let a prince clean up a sum she got wrong."
reply = "She went home and came back with a cloth bag, emptied it onto the scale pan, and counted the coins out to me one by one. She counted them three times. I weighed the bag in my hand and said it was too much. “The extra is interest,” she said. “They waited a month for nothing.” She tied the bag shut with a knot that wasn’t coming undone and pressed her thumb on it. “When you get to Ternate, don’t tell them who made the mistake. I’ll tell them myself.”"

[tracks.bond_wati.chapters.c2.choices.check_the_scale]
text = "Help her test the steelyard again, one brass star at a time."
reply = "We borrowed the warehouse weights and started from the lightest star, and we didn’t finish until dark. When we did, it turned out the steelyard had been half a notch off all along, and the notch she’d misread sat right on the crooked spot. The clerk let out a breath. “Then it isn’t your fault.” Wati laid the beam across her knees, took out a little knife, and cut the crooked notch a line deeper. “Then we owe them all the more.”"

[tracks.bond_wati.chapters.b1]
title = "The Shadow-Play Screen"
text = "At Giri, Wati learned the shadow play. She cut five puppets from buffalo hide, so thin the light came through them, with handles ground from horn, and in the school courtyard she stretched a white screen between bamboo poles. The one who works the puppets sits behind the screen; someone has to hold the lamp in front, and she picked me. “Hold it steady,” she said. “If the lamp shakes, the shadows shiver.” At the first rehearsal my arm gave out halfway through. The coconut-oil lamp wobbled, and the king and his minister on the screen both broke into a fit of the shakes. The children who’d come to watch rolled on the ground laughing; one of them started jiggling his legs like a puppet. I wanted to laugh too, and leaned around to look at her. Wati wasn’t laughing. A hand came out from behind the screen and pressed the lamp back into my grip. “Again. This time watch the shadows, not me.”"

[tracks.bond_wati.chapters.b1.choices.hold_steady]
text = "Hold it again, eyes only on the shadows, all the way to the end of the play."
hint = "She took the lamp back out of your hands. She doesn’t trust a prince with the light for a whole play yet."
reply = "I braced my elbow on my knee and kept my eyes on nothing but the shadows. When the little deer fled into the forest with the hunter behind it, the courtyard went completely silent; when it was over, the smallest child was in tears over the poor deer. Wati came out from behind the screen with lamp soot in her hair. “That’s the steadiest lamp I’ve ever seen.” She paused, then added, “Steadier than my uncle’s scale.”"

[tracks.bond_wati.chapters.b1.choices.carve_a_puppet]
text = "Say I want to cut a puppet too, and play a prince of Ternate."
reply = "She lent me a piece of hide and a carving knife. I worked on it for three nights. My prince came out with a big head, a flat body, and two very long arms. Wati held it up to the lamp and studied it for a long time. “It’s a crab.” The next day she really did put it in the play, as a prince who could only walk sideways. The children laughed for three days, and whenever they saw me, they walked sideways."

[tracks.bond_wati.chapters.b2]
title = "The Portuguese Contract"
text = "A Portuguese trader from Malacca stopped over in Gresik with a contract he wanted carried to Banda on any boat headed that way, for the elders to put their marks on: for the next five years, all the nutmeg and mace from their groves would be sold to him alone, at the price written on the page. He read it aloud in the warehouse, very fast, then dropped it on the table for anyone who cared to copy it. Wati copied it. Back at school she went over it line by line, and the longer she read, the darker her face got. She said she had to write to the elders on the island and get the letter there ahead of his boat. But her Malay script was crooked, and her spelling worse. She pushed her copy of the contract across to me and set a stone on it. “You’re a prince. They’ll trust your hand.” I said I was just a student. “A letter from the son of the Sultan of Ternate,” she said slowly, “the elders will read twice.”"

[tracks.bond_wati.chapters.b2.choices.write_letter]
text = "Write the letter for her, working out item by item what the contract costs the growers."
hint = "She drew the contract back toward herself. The island’s business is not something she’ll hand to a prince from another island yet."
reply = "We set the contract’s prices against what the Gresik wharf had paid these last two years, line by line, and wrote until midnight. When it was done she read it back to me, even slower than usual, and under every number she drew a line with a stick of charcoal. At the end she added a sentence in her island’s speech and wouldn’t let me see it. “This letter,” she said as she folded it, “is the growers setting their own price.”"

[tracks.bond_wati.chapters.b2.choices.ask_the_trader]
text = "Go with her to find the Portuguese trader and have every clause explained."
reply = "The trader was drinking palm wine under an awning on the wharf. When he saw us coming, he smiled and read the whole thing over again. Wati asked him about it one clause at a time. Five years counted from which day? The price by whose scale? What happens in a bad harvest? He talked faster and faster, and at the bad-harvest clause he set his cup down and said that was a question for the governor in Malacca. On the walk back she said, “The faster he talks, the less sure he is.”"

[tracks.bond_wati.chapters.a1]
title = "An Apology in the Shadow Play"
text = "The school held a festival, and a row of coconut-oil lamps was lit across the courtyard. Wati had a new play, and she sat me down on a mat out front. “No lamp for you this time. You sit here and watch.” In the play there was a man with a scale, its beam set with brass stars. He weighed a boatload of clove growers’ cargo, read it one notch backward, and only found out after the boat was gone. So he shouldered a bag of money and paddled a little boat from island to island, apologizing house by house. On every island he got thrown out once and then called back in for a meal. The audience doubled over laughing at the muddled scale man who couldn’t even count brass stars. I didn’t laugh. The scale on the screen was the very image of the one in her uncle’s warehouse. When it was over she crouched behind the screen packing the puppets into a wooden chest, one after another, and held the last one for a long time. “I wrote the lines,” she said. “But I still never made it to those islands.”"

[tracks.bond_wati.chapters.a1.choices.take_play_to_ternate]
text = "Promise her I’ll take this play to Ternate someday and perform it for the clove growers."
hint = "She closed the lid of the chest. She hasn’t settled on whose hands this play should go to, and they aren’t yours yet."
reply = "Wati pushed the scale man into my hands. “Then you keep him for me until then.” His face was carved crooked, and his nose was a good bit longer than any other puppet’s. I said he was ugly. “People who come to apologize always are.” She latched the chest. “When you play it in Ternate, find someone with a steady hand to hold your lamp.”"

[tracks.bond_wati.chapters.a1.choices.say_already_paid]
text = "Tell her the missing tenth reached them, delivered house by house by my family’s men."
reply = "She stood still a long time. The puppet in her hand drooped, and its shadow fell across the screen. “Then do they know who got it wrong?” I said they did; the boat owner had not forgotten: a girl in Gresik, the quickest at sums, who read one notch backward. She laughed, and somewhere in the laughing her eyes went red, and she took her sleeve to the soot on the lamp glass and rubbed at it for a long while."

[tracks.bond_wati.chapters.a2]
title = "An Island Painted in a Shell"
text = "Wati had asked the fishing families at the wharf to save her a big seashell, white and gleaming inside. With the fine brush left over from carving puppets, dipped in red earth and indigo, she painted the inside of it for more than a month. The day it was finished, she set it in my palm. Inside was Banda: a smoking volcano in the middle, a nutmeg grove at its foot with the fruit split open to show the red mace; on the sea a kora-kora with two rows of rowers, every oar painted on one by one. “Hold it to your ear,” she said, “and you’ll hear the tide going out at Banda.” I did, and heard the hum of wind inside a shell. She reached out her little finger and touched a speck at the rim, smaller than a sesame seed. “That one is Pisang.”"

[tracks.bond_wati.chapters.a2.choices.keep_shell]
text = "Accept the shell, and tell her I’ll remember that little island’s name all my life."
hint = "She closed the shell inside her own hand. You aren’t close enough yet to take a gift this heavy."
reply = "“Then tell me what it’s called.” She was testing me. “Pisang,” I said. “Three households.” She asked which side it was on, and I pointed north of the volcano in the shell. She nodded and pressed the shell back into my palm. “This time I don’t have to add it to your list for you.”"
effects = [{}, {}, {}, { title = "An Island Painted in a Shell" }]

[tracks.bond_wati.chapters.a2.choices.paint_ternate]
text = "Say I’ll paint one too, Ternate’s volcano, and give it to her in return."
reply = "It took me five days. My Gamalama came out round and squat, like a rice bowl turned upside down. Wati turned the shell over and back again. “I’ve seen the volcano at Ternate. It’s fiercer than this.” She took her own shell back. But the next day at school I saw the two shells side by side on her desk, volcano facing volcano."

[tracks.bond_wati.chapters.s]
title = "Back to Banda"
text = "Once the December west wind rose, the boats bound for the Moluccas lined up along the Gresik wharf. I would leave for Ternate in the spring; Wati was going this month. All she had was a wooden chest with her puppets and the rolled-up white screen. She said going home had little to do with homesickness. “The elders are still fighting over that contract. Someone on the island has to read it out to the growers, one clause at a time.” The day before she sailed, she handed me an old sheet of paper. It was the one I’d learned the islands from three years before, slipped out of my book chest at some point without my noticing, frayed at the edges, its creases worn pale. The last line was the little island’s name, and the ink was fresh. “When you come to Banda someday,” she said, “go to this island first.” I said Neira would be more on the way. She didn’t answer. She just smoothed down the corner of the paper and waited for me to take it back."

[tracks.bond_wati.chapters.s.choices.promise]
text = "Promise our letters will tell the islands in the islanders’ own words; in Banda, that small island first."
hint = "She folded the list over and over and didn’t wait for the rest. A promise for a whole life: either you two aren’t close enough to make it, or you’ve already said these words to someone else."
reply = "“From now on, when we write,” I said, “we tell what happens on the islands the way the islanders tell it. Whose trees bore how much, who asked what price, in their own words. And if I come to Banda, the first place I go is Pisang.” Wati thought about that. “Then you’ll have to learn how they talk. Pisang doesn’t talk like Neira. They don’t even say ‘nutmeg’ the same way.” “Then teach me.” “One island at a time.” She dug a stick of charcoal out of her chest, wrote the first word on the back of the island list, said it aloud, and had me say it after her. I got it wrong; she shook her head. I tried again; she shook her head again. The boatmen on the wharf were shouting for the loading to start, and she was still waiting for me to get it right. On the fifth try she finally nodded and pushed the charcoal into my hand. “Next time I see you, I’ll test you. Don’t forget a single word.” She didn’t look back when she boarded. As the boat cleared the sandbar, a corner of the white screen poked out of the chest and puffed in the wind."
effects = [{}, {}, { title = "Back to Banda" }, {}, {}]

[tracks.bond_wati.chapters.s.choices.own]
text = "Agree that my cloves and her nutmeg won’t be haggled over until the growers have named their price."
reply = "“From now on, my cloves and your nutmeg,” I said, “whoever comes to buy, the growers name their price first, and only then do we talk.” Wati wound the cord of her baggage once around her hand. “Then the two of us will have the hardest trade there is.” “The hard ones are the ones worth doing.” “You’ve played too much chess. You always pick the square that’s hardest to reach.” She laughed, bent to open her chest, and dug out a roll of paper: the lines of the scale man’s play, written out one by one, the margins thick with corrections. She rolled it tight and tucked it into the very bottom of my baggage. “In Ternate,” she said, “if anyone asks about that boatload of cloves, read them this. Read it slowly. I rewrote those lines a lot of times.”"

[tracks.reunion_wati]
name = "Wati: The Island Council Table"

[tracks.reunion_wati.chapters.reunion]
title = "The Island Council Table"
text = "In 1562 my ship tied up at Banda Neira. Across the harbor the volcano trailed a thread of smoke, and the shore smelled sharp with drying mace. Wati was waiting on the wharf, browner and thinner than before, and she still talked slowly. “The cargo can wait till tomorrow.” She didn’t take me to the warehouse. She led me to a great tree where the elders’ council table stood, its top a single plank worn smooth by elbows. “Sit down first,” she said. “Listen first.” The growers stood up one by one: how much fruit they’d brought in this year, what the Portuguese had offered, whether the Banten boats had come, whom they wanted to sell to and whom they didn’t. One old man went on especially long, starting from the first tree his father planted. Several times I nearly broke in about my routes, how much my ship could carry, and each time Wati lifted her eyes at me from the far end of the table. The sun was low when the last man sat down. The elder nodded to me, and only then did I stand and say what my ship could do. At the far end of the table, Wati gave me the faintest smile."


[tracks.reunion_wati.chapters.reunion.default]
effects = [{ text = "Kaicili, you didn’t come. The west wind came and went, and I met three Ternate boats at the Neira wharf, and you weren’t on any of them. I don’t blame you. The sea is big. Here’s this year, in the islanders’ own words. That five-year contract has run out, and the elders didn’t put their marks on another. Old Hasan of Lonthor says, “The Portuguese scale has a bent beam.” I’m copying that for you exactly as he said it. Ai had a thin harvest this year and asked a high price, and nobody beat them down. I hung up a white screen on the wharf and played for the children. The scale man’s play, I’ve done eleven times. Once there was a sailor from Ternate in the audience. He didn’t say a word afterward, but the next day he brought me a little packet of cloves. The island list is at the back. It’s a fresh copy; you know what the old one looks like. At the very bottom I’ve added one more: a sandbar that only shows at low tide, where an old couple lives and grows seven trees. They say they don’t count as an island. I told them they do. When you come to Banda, go to Pisang first, and then to this one. I’ve written the name down. You won’t know how to say it. When you come, I’ll teach you. Wati, Banda Neira." }, {}]

[tracks.reunion_wati.chapters.reunion.choices.friend]
text = "Right there at the council table, book my first cargo of nutmeg at the growers’ own price."
reply = "I read the old man’s price back aloud. It was well above what the Portuguese paid. Behind me my first mate coughed. I nodded anyway and asked the elder to write the deal down. The table went quiet for a moment, and then someone slapped the plank and someone laughed. The old man came around, took my hand in both of his, and shook it for a long time. I understood only half of what he said. Wati supplied the other half: “He says he’s grown trees for forty years, and this is the first time anyone has bought at the figure he named.” After the meeting we sat on the stone steps of the wharf and watched them carry the cargo onto my ship, sack after sack, the mace red as live coals. Wati held the ledger and weighed each sack as it went by, reading the brass stars on the beam very slowly, and not one of them backward. “This is the first cargo out of Banda,” she said, “where the growers set the price themselves.” “Whether I lost on it, I’ll work out back in Ternate.” “Go ahead.” She handed me the ledger. “If you get the sum wrong, I’ll put it in a play.”"
effects = [{}, {}, {}, { title = "The Island Council Table" }]

[tracks.reunion_wati.chapters.reunion.choices.bring_the_play]
text = "After the meeting, bring up the scale man’s shadow play: I want to take it to Ternate."
reply = "When the council broke up, I told Wati about the play: I wanted to take it back to Ternate and put it on for the clove growers. She looked at me a while. “You remembered.” That night she hung the white screen under the elders’ great tree and lit the coconut-oil lamp, and once again I held it. The scale man had the same crooked face and long nose. The island children crowded the front; the grown-ups stood at the back chewing betel and laughing at the scale man who couldn’t count his brass stars. When the scale man shouldered his money bag and paddled off to apologize, an old man at the back stood up. These days, he said, he came down on Ternate boats, bringing sago to trade for nutmeg. When he was young he’d worked a clove boat, and one year at Gresik they weighed the cargo, and only when they got home did they find every man aboard had been paid a tenth short. Later the money came back, house by house. He asked who had made this play. Wati stood up behind the screen, and the lamp threw her shadow across the cloth, far bigger than any puppet. “I made it. That notch was mine. I read it backward.” The old man looked at her a long time, then waved his hand and sat back down. “The play isn’t over. Finish it.” I held the lamp steady."
effects = [{}, {}, {}, { title = "The Island Council Table" }]

[tracks.reunion_wati.chapters.reunion.variants.v1_promise]
text = "These past years Wati’s letters reached Ternate every year on the west wind, written in the islanders’ own words: whose trees bore how much, who asked what price, not a word changed. At the end there was always one new word for me to practice. In 1562 my ship reached Banda, and instead of putting in at Neira, I went around to Pisang first. The three households had become five. An old woman heard me greet her in the speech of Pisang, stared a moment, and went inside to fetch someone. Wati came out of the house with a cluster of fresh-picked nutmeg still in her hand. “You said it right.” She brought me back to Neira, to a great tree where the elders’ council table stood, worn smooth by elbows. “Sit down first,” she said. “Listen first.” The growers stood up one by one and talked all afternoon. I held my tongue about my routes, and only when the last man sat down did I stand and say what my ship could do. At the far end of the table, she gave me the faintest smile."

[tracks.reunion_wati.chapters.reunion.variants.v2_own]
text = "We had made a pact: my cloves and her nutmeg, no haggling until the growers named their price. And these past years she had been the hardest trader I knew. Twice my ship ran into hers at Ambon, and both times she had already gotten the price out of the growers’ own mouths. In 1562 my ship reached Banda Neira. She was waiting on the wharf, and the first thing she said was, “How much money did you bring this year? If it isn’t enough, don’t sit at that table.” She led me to a great tree where the elders’ council table stood, its top worn smooth by elbows. “Sit down first. Listen first.” The growers stood up one by one and talked all afternoon. I held my tongue about my routes, and only when the last man sat down did I stand and say what my ship could do. At the far end of the table Wati gave me the faintest smile, like a chess player whose opponent has finally made the move."
