# C7 英文覆盖：阿卜杜拉（握绳的人 / 珠子与名字）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_abdullah]
name = "Abdullah: The Hand on the Rope"

[tracks.bond_abdullah.chapters.c1]
title = "The Knot Was Loose"
text = "The sounding lead slipped over the side of the boat, the line parted at an old worn spot, and the master swore and asked who would go down for it. Abdullah’s hand was already up. I had tied the spare line. He padded over barefoot, didn’t look at me, and ran his fingers along my knot. His brows came together. “This’ll slide the minute it gets wet.” In front of the whole ship he picked it apart, tied it again, and pushed the end into my hand. “Pull. Pull till you can’t.” I pulled. The knot didn’t give. “How deep can this anchorage be? I’ve gone down twenty fathoms off Bahrain.” Somebody laughed out loud. He backed off a little: “Fifteen. Fifteen, easy.” He sat on the rail, murmured a few words of a prayer against the sea, and looked back at me with a grin. “What’s the fuss? It’s one breath.” Then he rolled backward and went under. I let the line rest across my palm and counted my heartbeats. At eighty-seven the water broke and he came up with the lead held high, and the first face he looked for wasn’t the master’s. It was mine. He hung on the rail, took two breaths, and the first thing he said was, “Were you counting just now?”"

[tracks.bond_abdullah.chapters.c1.choices.count_aloud]
text = "Tell him: eighty-seven."
reply = "“Eighty-seven.” He blinked, then laughed so hard he nearly slid back into the sea. “Count louder next time, so the whole ship hears!” When he was done laughing he leaned in and dropped his voice. “Eighty-seven… is that a lot?” I said it was more believable than twenty fathoms. He wiped the water off his face, and I never heard about twenty fathoms again."

[tracks.bond_abdullah.chapters.c1.choices.learn_knot]
text = "Ask him to teach me the knot that won’t slip when it’s wet."
reply = "It was a pearl diver’s knot, nothing like the ones drawn in the master’s book. He guided my hands through it once, then again, and only on the third time let go and crouched beside me to watch me do it alone. When I finished he gave it a tug and slapped the end into my palm. “There. If that one slips, it’s on me.”"

[tracks.bond_abdullah.chapters.c2]
title = "Stars Without Letters"
text = "It was our turn on night watch. I spread my star chart over the hatch to teach him the names, and Abdullah stared at it a long while and said the writing looked like ants moving house. He scooped a handful of pebbles from the ballast sack and laid them out across the deck, one by one. “This bright one’s the Nail. It’s nailed up there, it never moves. These two together, that’s the Camel’s Knee.” I told him the books didn’t call them that. “The names in books don’t fall in the sea.” Then it was his turn to teach me to breathe. “Out first. All of it, till your belly touches your spine. Then in, slow. Three times.” He pinched my nose shut and counted, slower than my own heartbeat. Past midnight I checked his pebbles against my chart, and one of them sat lower than I had drawn it. I held my arm out straight and measured its height above the sea with my fingers. The chart was wrong. Mine, by one finger’s width. I said under my breath, “One finger off is a hundred miles off.” He didn’t look up. “That one? Off Bahrain I watched it go headfirst into the reef for years.”"

[tracks.bond_abdullah.chapters.c2.choices.write_nicknames]
text = "Write each of his star names beside the stars on my chart."
hint = "He sweeps the pebbles into a heap and says the names are nonsense, not worth writing down. He isn’t ready to hand these to you yet."
reply = "He leaned in to watch me write “the Camel’s Knee” beside the star. “What does it look like, written?” I pointed to the words one at a time. He raised a finger and traced them in the air, and stopped on the last stroke. “My words can live on paper too?” I went on and wrote “the Nail.” He went quiet and nudged the pebbles toward me so I could see them better."

[tracks.bond_abdullah.chapters.c2.choices.breath_drill]
text = "Breathe the way he taught me, and hold it at the rail until he calls time."
reply = "I held it until my sight went black and all I could hear was my own blood. He smacked me on the back. “Breathe!” I gulped air. “Not bad lungs, for a navigator girl,” he said, but his eyes never left my back as it rose and fell, and he counted more carefully than I had counted for him."

[tracks.bond_abdullah.chapters.b1]
title = "Two Tugs on the Rope"
text = "On the shallow reef south of Mocha the master had us take turns diving. Abdullah held my line, and before I went in he spelled it out word by word. “One tug, you’re fine. Two tugs, you come up. You hear me? Two means up.” The light on the reef was green. I was counting, trying to beat my last time, when the line jerked at my waist, and jerked again. I pretended not to feel it and reached for a sea fan just ahead. The next moment I was being hauled up, my back scraping coral, and my head broke the surface. He was kneeling in the boat with both fists on the line, knuckles white. “I pulled twice.” He wasn’t smiling. I had never seen him not smile. “The things down there don’t wait while you show off.” I said I still had a breath left. He threw the line into the bottom of the boat. A bloody welt ran straight across his palm. A long time passed before he spoke again. “When I was little, it was my uncle who held my line.” He looked down at the welt. “What scares me most is the line going light in my hands. All at once. Nothing on the end of it.”"

[tracks.bond_abdullah.chapters.b1.choices.admit_it]
text = "Admit I was wrong, and draw the “two means up” sign on the first page of my notebook."
reply = "I turned to the first page and drew a hand with two fingers pointing up. He craned over to look. “That’s two eels.” I didn’t change it. He looked a while longer and didn’t ask me to change it either. He just wound the line one more turn around his own wrist, tied it off, and pulled it tight."

[tracks.bond_abdullah.chapters.b1.choices.trade_sign]
text = "Admit I was wrong, then teach him a sign: underwater, point toward the Nail."
reply = "He practiced it three times, his finger truer each time. “You can’t see stars underwater.” “You can’t see it, but you still have to know where it is.” He thought about that and lowered his hand. “That sounds like one of my mother’s prayers.” The next day, before he went in, he pointed north once before he reached for the knot."

[tracks.bond_abdullah.chapters.b2]
title = "The Pearl Boat’s Debt"
text = "A letter came from Bahrain, written for his family by a scribe in the market. Abdullah walked two circles around the deck holding it before he pushed it at me. “You read it.” His father wanted him to take the debt note he carried and show it to someone learned at the school. He drew the note out of the cloth pouch he kept against his skin and spread it open. “You don’t need to read this one. I’ll read it to you, and you tell me if it’s right.” He read it smoothly, without a single stumble. “The principal so much, the interest reckoned by the days the boat goes out, no interest charged on days the wind keeps us in…” His finger stayed on the third line the whole time. What he was reciting was on the fifth. I read it again from the page. The interest ran by the day, and that included the days a gale kept the boats ashore. “No interest on wind days” was nowhere on that paper. “The collector said it to our faces,” he said, his voice dropping. “My father was there. I was there.” The wind lifted a corner of the note. He pressed it flat and kept his hand on it for a long time. “My father thinks I can read,” he said. “I told him I checked it.”"

[tracks.bond_abdullah.chapters.b2.choices.read_line_by_line]
text = "Read it to him line by line, and have him lay out every figure in pebbles."
hint = "He folds the note and tucks it back inside his shirt, says there’s nothing to see. He isn’t ready to spread that paper in front of you."
reply = "I read a line, he laid out a line. The principal was a big heap, each day’s interest one pebble, the windbound days in black stones. By midnight the pebbles covered half the hatch. He lay on his stomach and counted them one by one, then counted them all again, and pushed the little extra heap toward me. “These,” he said, looking up with red eyes, “I worked out myself.”"

[tracks.bond_abdullah.chapters.b2.choices.offer_letter]
text = "Offer to write to his father for him and lay out the truth."
reply = "“No.” It came back fast and hard. “I write that letter myself.” I let it go. After a while he turned the note over and pushed it to me blank side up. “Teach me to write ‘Father’ first. Just that one.” I wrote it. He traced it seven times. The seventh was the crookedest, and that was the one he kept."

[tracks.bond_abdullah.chapters.a1]
title = "One Dot Off"
text = "The morning the monsoon turned, there was a line of charcoal letters on the bow planking, crooked, as if the waves had shoved them around. I knew it. It was my name: Najma, star. Abdullah was squatting by the bollard, pretending to sort rope. “I just like stars,” he said before I could open my mouth. “First word I learned happened to be star. Happened to be. Don’t read anything into it.” One of the dots in those letters had landed in the wrong place, below instead of above. One dot off, and it was a different word. I have never let a wrong mark pass. But I stood there and looked at that dot for a long time. “What?” He couldn’t stand it anymore. He got up and wiped two black streaks of charcoal down his trousers. “If it’s wrong, say so. I’m used to the master yelling at me. You think I’m scared of you?”"

[tracks.bond_abdullah.chapters.a1.choices.fix_dot]
text = "Tell him the dot is in the wrong place. One dot off makes it another word."
reply = "He clicked his tongue, snatched the charcoal, and wrote it again, grumbling, “A finger’s a hundred miles, a dot’s a thousand, right? I know your whole sermon by heart.” The new one came out straight and clean. He looked at it, then wrote a crooked one beside it with the dot still underneath. “Keeping this one. For comparison.”"

[tracks.bond_abdullah.chapters.a1.choices.leave_dot]
text = "Don’t correct it. Look at the line a long time, and ask him to write another tomorrow morning."
hint = "He shoves the charcoal up his sleeve and says he was only practicing. Ask him one more thing right now and he’ll jump overboard."
reply = "I said, “Tomorrow write your name.” His voice went small all at once. “That’s… a lot of dots.” Next morning, before it was light, I came up on deck and there was another line on the planking, even more crooked than the first, right up against my name. The dew hadn’t wet the charcoal yet."

[tracks.bond_abdullah.chapters.a2]
title = "Knowing His Own Name"
text = "The big pearling season was coming, and the Bahrain boats had to be in the water by June. Abdullah was going home for it. The night before he left, he carried out the star chart we had been drawing for two years, spread it on the deck, and weighted the corners with pebbles. The writing on it was mine. Small circles marked where his pebbles had gone, and his names for the stars sat next to them: the Nail, the Camel’s Knee, the One-Eyed One. “You keep it,” he said. “Can I… sign it, here?” He held the pen like a knife and wrote stroke by stroke, stopping halfway to catch his breath as if he had just come up from the bottom. When he finished, it was a whole name: Abdullah. Badly crooked, but not one letter missing. Then he took something out of his sash, held it closed in his fist a while, and opened his hand. Shells, big and small, strung on hemp. “Dove for them myself.” He added quickly, “They’re worth nothing. No pearls.” He looked at the bracelet, then at the name. “Read it out. I want to hear what my writing sounds like when someone else reads it.”"

[tracks.bond_abdullah.chapters.a2.choices.read_his_name]
text = "Read the name he signed aloud to his face, one sound at a time."
hint = "He covers the name with his hand and says it’s too ugly, never mind. He needs to know you a little better before he’ll let you say those crooked letters aloud."
reply = "I read it one sound at a time. “Ab-dul-lah.” He said it after me, then again, as if making sure the person on the paper was really him. On the third time he suddenly pushed the bracelet into my palm and ran. At the gangway he swung around and shouted, “Next summer it won’t be just one name I read you!”"
effects = [{}, {}, {}, { title = "Knowing His Own Name" }]

[tracks.bond_abdullah.chapters.a2.choices.wear_bracelet]
text = "Put on the shell bracelet, and tell him next time he dives, I’ll hold the line."
hint = "You can’t say that yet, and he hasn’t held the bracelet out to you either."
reply = "He opened his mouth, and for once he didn’t boast about a single fathom. He bent his head and tightened the hemp around my wrist with a pearl diver’s knot, then gave it a tug. “I taught you this knot.” That evening someone asked how deep he meant to go this season back in Bahrain. All he said was, “Depends who’s on the line.”"
effects = [{}, {}, {}, {}, { title = "Knowing His Own Name" }]

[tracks.bond_abdullah.chapters.a2.choices.ask_debt]
text = "First ask him: when he gets home, how will he face the collector?"
reply = "“Read him the note, right to his face,” he said. “Get one word wrong and he’ll laugh at me for the rest of my life.” He took out the note and read the interest clause from the start, word for word. This time his finger was on the right line, the fifth, inching along under the words."

[tracks.bond_abdullah.chapters.s]
title = "The One Who Holds the Rope"
text = "On the third day of the northeast wind, the school ship broke up. He was going back to Bahrain to stand in front of the collector and read that note himself. I was going to sea. I rolled up the star chart with its two hands of writing and pushed it into his bundle. He tried to push it back. I told him I knew those stars by heart and he didn’t. On the last night the moon was a thin rind. He sat in the stern and cut a length off his diving line, sawing the blade back and forth several times. Then he tied a knot in it, a pearl diver’s knot, tugged it, tugged it again, and held it out. “When I go down,” he said, “I wish it were you holding the line.” Then he was the first to turn his face away, toward the sea. There was nothing out there. I held the length of rope. The knot was tight, tighter than any he had tied while teaching me. “Take it,” he said, still talking to the sea. “What’s the fuss… it’s a bit of rope.”"

[tracks.bond_abdullah.chapters.s.choices.promise]
text = "Take the rope, and promise to meet in Bahrain every year after the season, where he’ll read me a letter he wrote."
hint = "You have already promised to hold someone else’s line. This time all you can do is wish him a safe passage."
reply = "I wound the rope around my wrist. “Every year when the season’s over, I’ll come to Bahrain. You write a letter and read it to me.” He turned and stared at me a long while, then pulled the star chart back out of his bundle, turned it over, and wrote on the back by the lamp. He wrote slower than he ever had, glancing up after every word as if I might be gone the moment he looked down. When he finished he pushed it over for me to read. I read it: After the season, Bahrain, one letter. One short line, one dot wrong. I didn’t fix it. He nodded and slid his knife back into its sheath. “One a year. Whatever I can’t write, I’ll read to the sea.” In the morning, before we sailed, he stood on the quay and pointed north once, toward the Nail."
effects = [{}, {}, {}, {}, { title = "The One Who Holds the Rope" }, {}]

[tracks.bond_abdullah.chapters.s.choices.heart]
text = "Take the rope, and tell him: when you can read a whole letter through, say tonight’s words again."
hint = "Those words will have to wait until you know each other better and are surer of your own heart."
reply = "He turned, and went red to the ears, red enough to see by moonlight. He laughed, much more quietly than usual. “That’ll take years.” “I can wait.” I tucked the rope into my sleeve. “I can wait out every dot.” He stopped laughing. He reached over and squeezed my hand once, and let go quickly, as if he were afraid of working a knot loose. Then he got up, paced the stern once, and sat back down, a fist’s width closer to me. “Then remember,” he said. “A whole letter. You don’t read a single word of it for me.” For the rest of the night he went over his letters under his breath, one pass at a time, asking me after each whether he had them right."
effects = [{}, {}, {}, {}, { title = "The One Who Holds the Rope" }, {}]

[tracks.bond_abdullah.chapters.s.choices.own]
text = "Give the rope back: this should go to someone on your own boat."
reply = "I handed the rope back. He caught it, weighed it in his hand, and said nothing for a while. “Fair enough,” he said at last. “You’re the navigator, I’m the diver. One up top watching stars, one down below feeling for oysters.” He tied the length back onto the line at his waist, and the join was the same knot. “Then here’s to your ship never hitting a reef. And if it does, don’t panic. Just shout. Everyone in Bahrain can swim.” He grinned, and this time he meant it. When we sailed the next day he waved from the quay, with the hand that had the rope tied to it."
effects = [{}, {}, {}, { title = "The One Who Holds the Rope" }, {}]

[tracks.reunion_abdullah]
name = "Abdullah: Pearls and a Name"

[tracks.reunion_abdullah.chapters.reunion]
title = "Pearls and a Name"
text = "Bahrain in pearling season, and the whole shore reeked of oysters drying in the sun. A pearl boat was just nosing in when the man at the bow jumped into the sea without waiting for the plank and waded ashore waist-deep, louder than he had ever been at school. “Najma! Perfect timing. Come look at my books!” Abdullah owned a share of that boat now. The debt had been cleared three years ago. He had read the note through in front of the qadi, stopped at the clause that charged interest even on days of gales, and asked the qadi to read it for himself. The first page of his ledger was full of his divers’ names, still crooked, crowded one against the next. “See if I spelled anyone wrong. Get a name wrong, and when he goes down the things in the sea won’t know who he is, or whom to give him back to.” The women drying oysters on the shore were still talking about two years ago: the Ottomans came over from Basra, laid siege for a while, and went back. He listened and waved it off. From the bottom of a chest in the hold he dug something out and unrolled it for me. It was the star chart, its corners worn soft as cloth, the back crusted with salt. He was still using it."

[tracks.reunion_abdullah.chapters.reunion.default]
effects = [{ text = "Najma, you didn’t come this year. No matter, Bahrain isn’t going anywhere. The debt is paid, three years now. I read the note to the qadi myself, and when I got to the gale-days part his beard stuck straight out. Three new divers on the boat this year: Yusuf, Khamis, and little Rashid. I’ve put their names at the bottom; check whether I spelled them right. Little Rashid is only fourteen and he holds his breath longer than I did at his age. I don’t admit that. The star chart is still in my chest. I added two new stars next to the Nail, and wrote their names on it myself. My uncle is still holding my line this year. He’s getting old, but his hands are steady. If you come next year, it’s yours. Abdullah. I wrote this one myself. There are two spelling mistakes. I know which two. Don’t laugh." }, {}]

[tracks.reunion_abdullah.chapters.reunion.choices.partner_charts]
text = "Check his list of divers name by name, and agree to make a reef chart for the pearl boats together."
reply = "We sat by the oyster mats and went through it name by name. He read, I checked. Two were wrong: one had an extra dot, one was missing a stroke. While he fixed them he muttered apologies to the two men. Then, beside each name, I noted the reefs that diver worked. He called one out, I wrote it down: the shoal to the north, the black reef past the lighthouse, the Old Well his uncle used to dive when he was young. He reeled them off fast, how deep each one was, sand or stone on the bottom, and when I later sounded those reefs myself, not one of his depths was off by half a fathom. By full dark we had filled two pages. He shut the ledger, opened it again, and pointed to the top of the first page. “This chart gets two names on it. Yours goes first.” He paused. “If it’s spelled wrong, that’s on me.”"
effects = [{}, {}, {}, { title = "Pearls and a Name" }]

[tracks.reunion_abdullah.chapters.reunion.choices.hear_his_poem]
text = "Ask him to read me the letter he has been writing for five years."
hint = "Those words will only come when both of you still remember that night in the stern, and are both ready."
reply = "He cleared his throat. Three times. The letter was written on the backs of pearl boat accounts, several sheets strung on hemp. He read haltingly, a sentence and a pause, and once he lost his place and went back to start over. He read about the Bahrain wind, about his uncle getting old and him holding his own line now, about the star he once watched dive headfirst into the reef. When he reached my name he didn’t miss at all. The dot was where it belonged. When he finished he folded the sheets and pressed them into my hand. His hand shook, but his voice came back loud. “No need for you on the line this time. I came up on my own.” He looked at me and waited a moment, then said again what he had said in the stern five years before, word for word. I took the length of rope out of my sleeve, wound it around his wrist, and tied the knot he taught me."
effects = [{}, {}, {}, { title = "Pearls and a Name" }]

[tracks.reunion_abdullah.chapters.reunion.variants.romance]
text = "Bahrain in pearling season, and the whole shore reeked of oysters drying in the sun. A pearl boat was just nosing in when the man at the bow jumped into the sea without waiting for the plank and waded ashore waist-deep, louder than he had been five years before. “Najma!” And then he stood there in the water and couldn’t find the next word. Abdullah owned a share of that boat now. The debt had been cleared three years ago. He had read the note through in front of the qadi, stopped at the clause that charged interest even on days of gales, and asked the qadi to read it for himself. The first page of his ledger was full of his divers’ names, still crooked. The women drying oysters on the shore were still talking about two years ago, when the Ottomans came over from Basra, laid siege for a while, and went back. From the bottom of a chest in the hold he dug out the star chart, its corners worn soft as cloth. Tucked inside were several account sheets strung on hemp, their backs crowded with writing. I reached for them. He clapped a hand over them, and his ears went red first. “I can’t read it smoothly yet.”"
