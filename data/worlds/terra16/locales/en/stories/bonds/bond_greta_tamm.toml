# 格蕾塔·塔姆羁绊线（bond_greta_tamm + reunion_greta_tamm）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_greta_tamm]
name = "Greta: Down to the Last Pfennig"

[tracks.bond_greta_tamm.chapters.c1]
title = "The Backs of Old Bills"
text = "Under the warehouse eaves on the Trave quay, herring barrels stood stacked shoulder-high. Greta sat on an upturned empty barrel with a stack of spoiled bills of lading on her knees, and the porters’ children crouched around her in a ring. She was in no hurry to begin. First she dipped her pen and blacked out the merchant’s name on every bill, line by line. I asked her what that was for. “That’s somebody else’s business,” she said without looking up. “How many barrels of herring, who owes whom—spread that out in front of the children and it’s gossip all over the quay by evening.” When she was done she turned the sheets over. The backs were the schoolbook. She drew a row of little circles. “One circle, one barrel. How many barrels did your fathers carry today?” The smallest child didn’t answer. He grabbed the pen, drew a circle in the corner of the sheet, and jabbed a dot into the middle of it, like a counter on a reckoning board. Greta looked at it for a while, then drew that sheet out of the stack, folded it twice, and tucked it into her own notebook. “That’s his first account,” she said. “Somebody has to keep it for him.”"

[tracks.bond_greta_tamm.chapters.c1.choices.ink_names]
text = "Help her black out the merchants’ names on the rest of the stack."
reply = "By the thirtieth sheet my hands were black, with ink under every nail. Greta handed me an old rag. “Ink is the cheapest thing in a countinghouse. It’s also the hardest to wash off.” The children said my hands looked like a chimney sweep’s, and she laughed too. Then she held my sheets up to the light one at a time. Thirty sheets, and not one name showing through."

[tracks.bond_greta_tamm.chapters.c1.choices.teach_one]
text = "Pull one child aside and show him how many barrels ride on a herring cart."
reply = "Four rows on the cart, six barrels to a row. The boy counted on his fingers twice—twenty, then twenty-eight—and the third time he shouted “Twenty-four!” and jumped so high he nearly knocked the cart over. Greta wrote twenty-four on the back of a bill, big. I started to add the working beside it, and she put her hand on my pen. “Don’t correct it for him. That number is his.”"

[tracks.bond_greta_tamm.chapters.c2]
title = "The Child Who Asks Slowly"
text = "Among the children who came to learn their numbers was a boy called Jost, who kept a copper coin clenched in his fist so tight his knuckles went white. When his turn came to ask, every sentence stopped three times. “Why… my father… that day…” I could tell he was asking about wages, and I answered before he had finished. “Wages go by the barrel. Carry more, get more.” Greta didn’t look at me. She only shook her head a little, slid the board they used for a slate closer to Jost, and waited. Down by the river the crane creaked half a turn and creaked back. “He hasn’t finished asking,” she said to me, very low. “You answered the half you heard.” Jost set the coin on the board, picked it up again, and set it down again."

[tracks.bond_greta_tamm.chapters.c2.choices.wait_him]
text = "Hold my tongue and let Jost finish, even if it takes a quarter of an hour."
hint = "She sends you home first—you don’t know each other well enough yet for her to let an outsider watch her teach."
reply = "It took a good quarter of an hour. He got there in the end: his father and Hermann next door had unloaded the same herring boat, the same number of barrels, and on payday his father came home one coin short. His mother had sent him with this coin in his fist to ask about it. Greta wrote his words into her little notebook without changing one, and only then looked up. “That one’s harder than arithmetic. I’ll keep it for now. You show him another way—how to count the barrels himself, so he can count them for his father.”"

[tracks.bond_greta_tamm.chapters.c2.choices.count_fingers]
text = "Crouch down, hold out my fingers, and count along with Jost."
reply = "I crouched and spread both hands flat on the board. He counted to seven and stopped, staring at my fingers. I stopped at seven too and waited. All at once he grinned and counted straight through to twelve, far faster than he talked. Greta had been watching. “Well, you know how to wait. When there are more of them, lend me your fingers.”"

[tracks.bond_greta_tamm.chapters.b1]
title = "The Children Judge"
text = "When lessons started again in the autumn, the master had an idea: Greta and I would each teach a stretch to the dock children, and the dock children would be the judges. Wherever they got lost, they were to mark the warehouse door in charcoal. I taught how to make small change up into whole coins. When I finished, my side of the door had a long, wobbly line on it. The oldest child spoke for all of them. “Too fast. Like a carter whipping his horse.” Greta taught insurance—when a ship comes to grief, several merchant houses share the loss. She wasn’t fast at all, but on her side someone had drawn a little ship, drawn a long way out from the shore. “What’s insurance?” one child asked. “Can you eat it?” Greta stopped short, then clapped her hands once. “Good. I lose that one.” She turned to me. “And you lose that one.” With the charcoal she wrote the day’s date beside each mark."

[tracks.bond_greta_tamm.chapters.b1.choices.redo_lesson]
text = "Do as the children say: slow my part down and teach it again."
reply = "This time I left the small change out. A porter carries twelve barrels of herring, and the foreman gives him a shilling—a shilling is exactly twelve pfennigs, a pfennig a barrel. Heads nodded all around, and somebody reached up and rubbed my long line off the door. Greta copied my example into her notebook and wrote “borrowed” beside it. “I’m borrowing yours. Someday I’ll pay you back with one of mine.”"

[tracks.bond_greta_tamm.chapters.b1.choices.swap_examples]
text = "Trade examples with her: she takes the herring barrels, I take insurance."
reply = "She taught herring barrels—how many layers of salt go into one—and the children were in fits; one insisted his mother’s herring was saltier than that. I taught insurance, and by my third sentence two in the front row were asleep, and three in the back. Greta counted the sleepers one by one. “Five. You lost by more this time.” She rubbed the little ship off her side of the door and drew it again on mine."

[tracks.bond_greta_tamm.chapters.b2]
title = "The Second Ledger"
text = "The crane’s treadwheel stood still for half a day. A porter named Claus had fallen from under the jib, and he was dead by the time they carried him away. At the end of the month the merchant house paid his widow nine days short; the foreman said those nine days didn’t tally. Greta said nothing at all on the quay. That evening she brought me to her father’s countinghouse by St. Mary’s, past his writing desk to the cupboard at the back, crouched, and pulled a thin ledger from the bottom shelf. There was nothing written on its cover. Every page held the names of dockworkers, and after each name a row of small figures: which day, how many barrels, how many pfennigs owed. Claus’s page: nine days, not one missing. “My father’s books keep the merchant house’s money,” she said. “This one keeps theirs.” She read Claus’s nine days aloud one figure at a time, slowly, very clearly, as if to someone who couldn’t hear. Then she shut the book. “Count the small sums too. Nine days is nine days.” She looked up at me. “Should this book come out?”"

[tracks.bond_greta_tamm.chapters.b2.choices.hide_ledger]
text = "Hide the ledger in the school bookcase for her, then go with her to find Claus’s widow."
hint = "She let you look for one moment, then held it close again—she isn’t ready to trust you with its hiding place."
reply = "We slid the ledger into a stack of Latin grammars and pushed it onto the top shelf of the bookcase—the master never opened the grammars. Claus’s widow lived in a half-cellar down by the river and couldn’t read. Greta read the nine days to her one by one: which day, how many barrels. At the sixth the widow said, “It rained that day. He came home soaked to the ankles.” She remembered every one of them. Outside, Greta said, “Someday this book goes on the table for everyone to see. Bring it out now and they’ll take the book, and my father will be packing his things.”"

[tracks.bond_greta_tamm.chapters.b2.choices.take_to_council]
text = "Urge her to take the ledger to the town council."
reply = "She shook her head. “The council is made of merchant-house men.” She put the ledger back at the bottom of the cupboard with two old account books on top of it. The next day she went to the merchant house alone, stood at the counter, and read the nine days out to the factor one at a time until he lost patience and paid three of them. That evening she came down to the quay to find me, with three days’ money in her fist. “The other six, I’m keeping count of.”"

[tracks.bond_greta_tamm.chapters.a1]
title = "A Sum by the Stove"
text = "The river was still frozen over, and the copper stove in the countinghouse glowed red, a jug of small beer warming on its lid. Greta chalked a problem on the slate: three merchant houses ship salt together in one hold, each a different number of sacks; a tenth of it gets soaked on the way, so how much of the loss does each house bear? I glanced at it. “That’s easy.” “Then explain it to me. Pretend I’m Jost.” She held out the chalk. “He’s never learned proportion, so you’re not allowed to say ‘proportion.’” I got as far as the second house’s share and stuck. Without that word there was no way around the step. In the end I drew one ship on the slate and three heaps of salt, and the salt looked like snowdrifts. Greta laughed first, and I followed. In the stove a coal caved in, and sparks jumped onto the lid. “There,” she said, wiping her eyes. “Grown-ups get stuck too.”"

[tracks.bond_greta_tamm.chapters.a1.choices.mark_stuck]
text = "Mark the step where I got stuck, to use as her next lesson."
reply = "I made a mark beside the three snowdrifts of salt. Greta said the children were bound to stick in exactly that place—the second house. She copied the problem onto the back of an old bill and wrote my name underneath. “Tomorrow you teach this step. If you can’t explain it, draw the salt.”"

[tracks.bond_greta_tamm.chapters.a1.choices.stay_by_stove]
text = "Don’t hurry off; stay by the stove until the night watch rings the bell."
hint = "She has banked the fire and is putting the slate away—tonight is not the night to linger."
reply = "The watchman’s bell went and the fire burned low, and she didn’t send me away. We left the sums alone. She told me about the first time she went into the countinghouse as a little girl, on tiptoe, reaching for her father’s reckoning board; a whole bag of brass counters spilled across the floor, and one rolled into a crack between the boards where no amount of digging could reach it. When the floor was relaid years later the counter turned up, and she keeps it in a little tin box. “For years after, every time my father finished a reckoning, he’d sigh, ‘Still one short.’” She poked at the coals. “That’s when I learned to count all the way to the end.”"

[tracks.bond_greta_tamm.chapters.a2]
title = "A Quill Case from an Old Cover"
text = "Greta set a quill case down in front of me. The leather was old and worn to a shine, stitched all the way around the edge with linen thread, the stitches too close to count. Inside lay three cut goose quills. “Once you’re at sea, don’t keep your accounts in lead,” she said. “Lead rubs off. Then the shipowner says you never wrote it down, and what will you argue with?” I took the quills out one at a time. On the inside of the case, in very small figures, she had written a number: eleven. “What’s this?” “The children you’ve taught on the quay,” she said. “Jost is one. Claus’s youngest girl is another. You never counted them, so I did.” She pushed the case an inch toward me, her fingers still resting on the lid."

[tracks.bond_greta_tamm.chapters.a2.choices.accept_case]
text = "Take the case and enter my first account on the spot, with her quill."
hint = "Her fingers stay pressed on the lid—you aren’t close enough yet for her to let go."
reply = "I dipped the quill and wrote on the back of the bill she handed me: One quill case, three quills, a gift. Greta tilted her head and read it through. “You’ve learned.” A moment later she tapped the line. “Which side does it go on? Don’t enter a gift as income, or at the year’s reckoning you’ll have money from nowhere and no idea where it came from.”"
effects = [{}, {}, {}, { title = "A Quill Case from an Old Cover" }]

[tracks.bond_greta_tamm.chapters.a2.choices.count_eleven]
text = "Touch the “eleven” and tell her I’ll remember all eleven children, and the one who sewed this."
hint = "Your finger barely touches the “eleven” before she shuts the lid. It isn’t your place to say that yet."
reply = "She bent her head and straightened the three quills one by one, twice over. “That isn’t on the books.” Then put it on, I said. She actually pulled out an old bill and wrote on the back: One sentence. She thought about it, and in the amount column wrote: Beyond price. Then she folded the slip into a tiny square and tucked it into the lining of the case. “Read it once you’re at sea.”"
effects = [{}, {}, {}, {}, { title = "A Quill Case from an Old Cover" }]

[tracks.bond_greta_tamm.chapters.a2.choices.ask_which_ledger]
text = "First ask which old account book the leather came from."
reply = "“My father’s first.” She turned the case over; on the back of the leather was a faded year: 1531. “The year the Katharineum opened. He kept the school’s accounts for its benches and tables. When the book was full, the cover was still good.” She scraped at the figures with a fingernail. “The school wouldn’t take me. I got its covers instead.”"

[tracks.bond_greta_tamm.chapters.s]
title = "Counted In"
text = "December, and thin ice had formed along the Trave. My ship would clear the river mouth by the end of the month. Greta said nothing about seeing me off. She sat under the countinghouse window with a big, freshly cut sheet spread before her, already ruled into columns from left to right: name, day, barrels, owed, paid. “A wage book anyone on the quay can read,” she said. “Even without letters. One circle for each barrel. One copy for the foreman, one for the merchant house, one nailed up under the crane.” “Nail it under the crane and the rain will rot it.” “Then nail up a new one every month.” She smoothed the sheet flat. “I’ve worked out the paper. Under three marks a year. I’m sixteen now; I can pay that myself.” Only then did she look up at me. Her pen had stopped over the “paid” column, and a drop of ink fell and spread, and she didn’t wipe it."

[tracks.bond_greta_tamm.chapters.s.choices.promise]
text = "Promise to find her on the quay first whenever I’m back, with wage books from other ports."
hint = "She only makes this kind of agreement with people she’s close to, or else your one promise of a lifetime already belongs to someone else. This time all you can leave her is an address."
reply = "“Bring their real books, not your copies,” she said. I said the real books are locked away in other people’s countinghouses; I’d have to steal them. She thought about that, reached into my coat, took out the quill case and counted the quills—all three there—before she gave way. “Then bring your own reckoning. In every port, when you see the porters paid, write down how many men, how many barrels, who signed, whether anyone came up short. If you get it wrong, I’ll correct it.” At the bottom of the big sheet she added a line, wrote my name, and drew a small circle after it. “That’s your column. Every time you come back, one circle.” She went over the line again until it was darker than all the others. “Miss one, and I’ll know.”"
effects = [{}, {}, {}, {}, {}, { title = "Counted In" }, {}]

[tracks.bond_greta_tamm.chapters.s.choices.heart]
text = "Tell her that when I come back, there’s an account I mean to settle with her face to face."
hint = "You can’t bring yourself to open that account with her yet. You haven’t come that far, or your one promise of a lifetime is already entered under someone else’s name."
reply = "“What account?” “I’ll tell you when I’m back.” She looked at me a long time, long enough for the man cutting ice for water on the river to break clean through. Then she drew my hand over, turned it palm up, and wrote on it with the dry end of her pen. One stroke, then another; it tickled, and I wanted to pull back, and she held on. “Twelve, seven,” she said. “My birthday. Remember that for now. If an account is going to be settled face to face, it needs a date.” She didn’t let go at once. Under the two numbers she drew a line, like the rule at the foot of a ledger page. Only then did she let go and turn to the window, flushed from her ears down to her collar. On the sill, the ink drop in the “paid” column had dried."
effects = [{}, {}, {}, {}, {}, { title = "Counted In" }, {}]

[tracks.bond_greta_tamm.chapters.s.choices.own]
text = "Go our separate ways: she keeps the quay’s books, I go to sea, and we meet in letters."
reply = "“That’s best.” She nodded as if she had already worked out this sum for me. “You go first. I haven’t finished this book.” She walked me down to the Trave, where the ship was waiting on the tide. At the gangplank she slipped a folded old bill into my pocket. “Something to work on along the way. Write as soon as you make port. Don’t forget the odd pfennigs.” I didn’t open it until we were away from the quay. On the front the merchant’s name was blacked out, as neatly as ever; on the back was a problem: how many days a letter takes from Lübeck to wherever you are, and how many can go there and back in a year. She had left the answer box empty, except for a single dot of ink at its edge. I stared at it a long while, folded the paper the way it had been, and put it in my inside pocket."
effects = [{}, {}, {}, { title = "Counted In" }, {}]

[tracks.reunion_greta_tamm]
name = "Greta: The Dockside Schoolroom"

[tracks.reunion_greta_tamm.chapters.reunion]
title = "The Dockside Schoolroom"
text = "More than six years later, there was a small hut beside the warehouses on the Lübeck quay, with a row of charcoal circles on its door. The door stood open. Inside, the porters’ children filled the room, a slate apiece, and the teacher’s desk was an upturned herring barrel. Greta stood beside it, a little taller than before, talking as slowly as ever. She saw me and didn’t stop the lesson; she only lifted her chalk. When the class let out, she picked up the thin ledger with nothing on its cover from the counter. It lay out in the open now, for anyone to leaf through. “The merchant house owned up,” she said. “They paid three years of back wages off this book. Claus’s nine days, every one of them.” At the other end of the counter was a pile of new notebooks: the ways of keeping accounts she had learned these past years, the Venetians’, the Antwerp men’s, copied out close and dense. She pushed the pile across to me, sat down on a child’s stool with her knees under her chin, and said, “Test me. This time I’m the pupil.”"

[tracks.reunion_greta_tamm.chapters.reunion.default]
effects = [{ text = "The schoolroom on the quay is open, in the old shed beside the crane. Nineteen children came the first day, fourteen the second, and by the end of the month five had come back, so nineteen again. Jost keeps the tally for the foreman now, and the foreman doesn’t dare change his figures. The second ledger came through: the merchant house accepted it and paid three years of back wages off it, and Claus’s nine days were made good too. The book sits on the schoolroom counter now; anyone who walks in can turn its pages. Since you left I’ve learned the Venetian way: what comes in on the left, what goes out on the right, and the two sides have to balance. I balanced our letters over these years, and you’ve sent me two fewer than I sent you. You owe me a letter, odd pfennigs included. —Greta Tamm, Lübeck" }, {}]

[tracks.reunion_greta_tamm.chapters.reunion.choices.examine_her]
text = "Set her a hard problem; if she gets it right, she gets to test me."
reply = "My problem: a shipload of Bergen stockfish meets a gale halfway and throws half the cargo overboard; how much do the shipmaster and the three merchants each bear? She worked it on the slate, and halfway through she stopped to ask which half went over—top or bottom? The top layers were dry, the bottom damp, and they weren’t worth the same. I hadn’t thought of that. She got it right. Her turn: twenty porters on the quay carry three hundred barrels a day, the crane breaks down for half a day, so how do you split the wages without cheating a single one of them? I worked it three times and got three answers. She laughed so hard she knocked the ledger to the floor, and the children came swarming in to look. She picked it up and dusted it off. “Today’s lesson: watching a grown-up fail to answer.” Then she turned to me. “Coming back tomorrow? I’ll save the problem for you.”"
effects = [{}, {}, {}, { title = "The Dockside Schoolroom" }]

[tracks.reunion_greta_tamm.chapters.reunion.choices.settle_account]
text = "Open my hand to her and settle that old unfinished account face to face."
hint = "You never got that far back then, and this account won’t balance today."
reply = "I held out my hand, palm up. “The seventh of December,” I said. “I’ve kept it six years and more, and never lost it.” She looked down at my palm as if the numbers were still written there. “I worked this account out long ago.” From one of the new notebooks she drew an old bill; on its back was a number, the ink faded to brown: twelve, seven. The number she had written on my palm, she had kept a copy of too. “Your copy and mine. Same number.” She shut the ledger and took my hand. “No need to write this one down.” A child was peering in through the crack of the door; she saw, and didn’t let go. Outside there was a burst of giggling, and feet running away down the quay."
effects = [{}, {}, {}, { title = "The Dockside Schoolroom" }]
