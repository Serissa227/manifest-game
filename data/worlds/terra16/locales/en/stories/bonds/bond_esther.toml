# C7 英文覆盖：埃丝特（几种钱的歌 / 账外的座位）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_esther]
name = "Esther: A Song of Many Coins"

[tracks.bond_esther.chapters.c1]
title = "A Song of Many Coins"
text = "The soldiers from Algiers had marched into Fez and laid a levy on the mellah. Outside the door of her family’s counting house Esther had set up a low table with four piles of coin on it: Fez dinars, Turkish silver, Portuguese cruzados, Spanish reales. She counted and sang at the same time, one coin into the next, each line rhyming with the last, her fingers outrunning her voice. I listened from the doorway for two lines and started humming along. By the cruzados my tongue was in a knot, and I couldn’t have told you whether I was turning cruzados into reales or the other way around. She glanced up. “Algiers accent.” “People in Algiers can count too.” “So what are you buying?” “A compass. A Spaniard’s selling one.” “Then you only need dinars into reales.” She pushed two of the piles toward me. “Leave the rest of the song alone. Sing it wrong and your compass costs more.” Outside, the men collecting the levy were knocking on the next door."
news = "The soldiers from Algiers have levied the mellah of Fez. A merchant’s daughter there sings the exchange rates of four currencies while she counts. A student with an Algiers accent tried to sing along and fell apart on the third coin."

[tracks.bond_esther.chapters.c1.choices.learn_song]
text = "Sing the four-coin song through with her, line by line."
reply = "By the fourth time through I didn’t trip once. Esther stopped counting and looked me up and down. “A head like that, wasted on raiding ships.” “Our ships take cargo, never people.” “Cargo is money.” She flicked a cruzado across the table at me. “If you can’t keep your coins straight, every cargo you take is a loss.”"

[tracks.bond_esther.chapters.c1.choices.distract_soldiers]
text = "Chat up the soldiers in my Algiers accent and buy her some time."
reply = "I put on my best Algiers waterfront voice and asked the sergeant which street he grew up on and who grilled the best sardines there. He liked me so much he kept slapping my shoulder, and he left a tenth short. Once they were gone Esther didn’t thank me. “Don’t play games with our door. Next time they’ll remember you and take two tenths more.” But in the ledger, next to that missing tenth, she wrote my name."

[tracks.bond_esther.chapters.c2]
title = "Silly Questions in the Margin"
text = "Once summer came I took to sitting just inside the door of the counting house and asking Esther silly questions. “The same dinar gets forty pieces of silver on the dyers’ street. Why only thirty-eight on the coppersmiths’ street?” She didn’t laugh. She dipped her pen and wrote my question word for word in the margin of the ledger, with my name after it. “What’s that for?” “For whoever comes next.” I reached over to strike it out, and she held my hand down. “If you don’t know, you don’t know. Cross it out and the next one has to not know it all over again.” A few days later a new apprentice turned up, a girl from Tetouan staying with relatives, who couldn’t yet tie a purse properly. Leafing through the ledger she came to that page and stared at the margin for a long while. Then, quietly: “And inside the mellah, what does it get?” Esther jerked her chin at me. “Good question. He never thought to ask that.”"
news = "A counting house in the mellah of Fez keeps its ledger margins full of questions for the new apprentices. The first one was asked by a student from Algiers."

[tracks.bond_esther.chapters.c2.choices.ask_three_more]
text = "While the new girl is listening, ask Esther three even sillier questions."
hint = "Esther pulls the ledger against her chest. You aren’t close enough yet; she doesn’t let outsiders leaf through her books."
reply = "She laughed so hard she ended up face down on the ledger, then answered each one properly and wrote each one down. The third was: “Why does a dinar from inside the mellah always fetch two pieces of silver less than the same dinar outside?” She wrote it and drew a circle next to it. “My father can’t answer that one either.” The new girl craned her neck and looked at that circle for a long time."

[tracks.bond_esther.chapters.c2.choices.beg_erase]
text = "Beg her to strike my name out of the margin."
reply = "She struck out the name and left every word of the question. “Names are no use. Questions are.” I looked at that line with no one attached to it and my face burned worse than before. The new girl, though, used it as a start and added a line of her own underneath."

[tracks.bond_esther.chapters.b1]
title = "The New Saadian Coin"
text = "In September the Saadians took Fez back, and the soldiers from Algiers left the city overnight. Within days a new coin turned up in the market, the silver bright white, with lettering around the rim that nobody could read all of. Esther set a little test in the counting house: a row of coins on the table, new and old, whole and clipped, all mixed together, and whoever named the most correctly won. I spotted the chipped edge on a real and the light weight on a cruzado, then came to grief on one new Saadian silver piece. I called it a fake. “It’s real.” She turned it over to show me. “Came out of the mint this morning. You lose.” “There wasn’t any such coin yesterday!” “The market doesn’t care what you saw yesterday.” She wrote my name in the book with “lost” after it, and while the ink was still wet she looked up again. “Three days. Then I test you again. This loss stands. The road to the next one stays open.” The new coin lay by my hand, painfully bright."
news = "The Saadians are back in Fez and there’s new money in the market. A girl in the mellah tested her classmates on it, and a student from Algiers called a good coin false on the spot."

[tracks.bond_esther.chapters.b1.choices.retry]
text = "Use the three days she gave me to learn the new coin, then sit the test again."
reply = "For those three days I crouched by the money changers’ stalls two mornings running, watching the old men weigh a coin in the palm, flick it, listen to it ring. On test day I knew the new coin at a glance, and picked out another new one while I was at it, a thin ring shaved off all the way around its edge. Esther held it up to the window a long time. “I didn’t catch that one when I laid them out.” She wrote both down. “Your loss last time still counts. This time is yours.”"

[tracks.bond_esther.chapters.b1.choices.bet_coin]
text = "Stake an Algiers gold piece that I’ll know it in three days."
reply = "She took the gold piece and weighed it in her palm. “Know it and you get this back. Don’t, and it goes in the mellah’s passage-money box.” Three days later I knew it. She pushed the gold back to me, then slid the padlocked box half a foot closer. “The box takes gifts too. No bet needed.”"

[tracks.bond_esther.chapters.b2]
title = "Fare to Salonica"
text = "In spring a family came ashore at Larache and walked ten days or so to Fez: a husband and wife, an old grandmother, two children. They had been baptized in Portugal, but at night they lit the Sabbath lamp in secret, and they ran before the Inquisition came to the door. Now they meant to reach relatives in Salonica. Esther’s father went over the sums three times by lamplight and still came up short. The grandmother held a bundle of family letters against her chest, sealed in layer after layer of wax, and shrank back from anyone who reached toward it. “Set aside the passage money first, or no one gets to leave,” Esther said beside him. Her father nodded and struck one of the household’s own expenses for the year off the books. But money was only half of it. I knew the ships heading east: which ones carried honest cargo, and which ones would snatch anyone they found alone at sea and sell them. Esther turned to me and spoke very low. “You’re from Algiers. Is there a ship that won’t take people?”"
news = "A family that fled Portugal has reached the mellah of Fez on its way to Salonica. The merchants there are raising their passage, and they say it’s still short."

[tracks.bond_esther.chapters.b2.choices.find_ship]
text = "Find the family a ship to Salonica whose master wouldn’t dare touch them."
hint = "Esther looks at you, then turns back to her father. You’re from Algiers; she can’t trust you with this family’s lives yet."
reply = "I spent three days asking at the inns in town, then rode a mule down to the docks at Tetouan, and found a Venetian ship loading hides. Her master had done business with my father, and when he heard the name Garnati he said it three times over: “That family, I won’t lay a finger on.” Esther entered the ship’s name, its master and the day it sailed in the book, and put a dot of ink at the head of the line. “This line is yours.” Before they set off, the grandmother took the letters out from against her chest and had me check the seals one more time."

[tracks.bond_esther.chapters.b2.choices.give_winnings]
text = "Press everything I won at dice last night on the family."
reply = "Before the money left my hand Esther caught my wrist. “Give it, fine. But it goes in the book. Who gave it, what day, and it’s a gift, not a loan.” She wrote out a receipt on the spot and pushed it over. I signed, crooked as anything. She blew the ink dry. “There. Now the money’s clean.” The father looked at the receipt, then at me, and didn’t reach for it until she nodded."

[tracks.bond_esther.chapters.a1]
title = "A Friend Who Needn’t Agree"
text = "That night we argued in the counting house until the lamp had been refilled twice. “The rule at sea is the cargo goes to the ship and the people go free,” I said. “My father’s ships have always worked that way.” “The cargo’s owner is a person too.” Esther slapped her pen down on the table. “A house that loses a shipload goes hungry all the same. And the people you let go have to come back with money to ransom their ship. Ransom is business too.” “Doesn’t your family handle ransoms?” That shut her up. Every year her father passed several ransoms for captives in Algiers through his hands; I knew it, and she knew I knew. She didn’t take back the old ledger she had lent me. She only wrote a few lines about what worried her on another page of it and pushed it back to me. Then she opened her own ledger to the last page, covered it with her palm, and let me see a single line: Spanish, spelled out in Hebrew letters. She read it to me under her breath. Granada. Realejo. The bridge over the Darro. “My mother’s old home,” she said. “She never talks about it. There’s an old promissory note from there in the house, and I want to know where it came from.”"
news = "The girl from a counting house in the mellah of Fez and her classmate from Algiers argued all night about the rules at sea. The neighbors say neither one got any quieter toward the end."

[tracks.bond_esther.chapters.a1.choices.argue_on]
text = "Keep arguing until the lamp goes out, and don’t give an inch."
reply = "The wick burned dry and the room went black, and she said out of the dark, “Call it even today. We’ll pick it up tomorrow.” I felt my way along the doorframe, and at the door I stopped. “Realejo. My grandmother used to say that name. She talked about the pomegranate trees there.” The room was quiet a long time. She struck the flint, and as the light came up she said, “Then tomorrow, we start with that.”"

[tracks.bond_esther.chapters.a1.choices.concede]
text = "Grant her one point: holding people for ransom is taking people too."
reply = "She didn’t gloat. She just pushed the lines about what worried her a little closer to me. “One point is enough. Work out the rest yourself.” Then she closed her own ledger and kept her hand flat on the cover. “You didn’t see that page.”"

[tracks.bond_esther.chapters.a2]
title = "The Counting Tokens"
text = "In the autumn Esther’s father bought her a new set of counting tokens, Nuremberg brass by way of Antwerp, the stamped pattern still sharp under the thumb. She tipped the old bag out on the table and counted them for me one by one. They were all worn bright, and on a few the lettering around the edge had rubbed away. “Forty.” She picked out the oldest and dropped it into her own purse. “I’m keeping this one. It’s the first one I ever pushed.” Then she opened the ledger and wrote a line: on such a day, Esther to Tariq Garnati, counting tokens, thirty-nine. At the end she added one more word: gift. “Not a loan?” “A loan gets paid back. A gift doesn’t. Between the two of us, nobody owes.” She turned the ledger around so I could read the line, pushed the bag toward me, and waited for me to say something."
news = "A counting house in the mellah of Fez has a new set of Nuremberg tokens. The old bag, they say, went to a classmate from Algiers."

[tracks.bond_esther.chapters.a2.choices.take_tokens]
text = "Take the tokens, and write her a gift receipt the way she wrote mine."
hint = "She draws the bag of tokens back toward herself. It isn’t yet the time to hand you something she has used for years."
reply = "I had nothing to give, so on the back of the receipt I wrote a song, the four coins trading places, every line rhymed. She read it through once and circled two spots. “The rhyme’s wrong here, and here you’ve counted one cruzado too many.” Then she folded the receipt in four and slipped it into the last page of her ledger, in with those lines of old place names."
effects = [{}, {}, {}, { title = "The Counting Tokens" }]

[tracks.bond_esther.chapters.a2.choices.return_one]
text = "Pick one token out of the bag and give it back to her, one old one each."
reply = "She turned it over. “The one you picked is new. It only went in the bag the year before last.” “New ones get old.” She thought about it, then took it and put it in the same purse as her oldest one, and pulled the string tight. “Then we’ll see who wears theirs down first.”"

[tracks.bond_esther.chapters.s]
title = "Trade Roads and Friendship"
text = "In December Esther’s family loaded the mules at the gate of the mellah. As soon as school broke up she was going to Algiers with her uncle to learn the trade there: ransoms, exchange, dealing with shipowners. “Your hometown.” She stuffed a new ledger into a saddlebag. “I don’t even know how they sell bread there.” “Bread by the loaf, fish by the basket, people by the—” “Don’t finish that.” I was going back to Algiers in the spring too, to my father’s ship. The two of us bound for the same city, she overland with the mule train, I waiting on a wind. She pulled the new ledger back out of the saddlebag and wrote a line in the margin of the first page: how to buy bread in Algiers. Then she looked up at me. “So when we get there, how do we settle up?”"
news = "With winter coming on, the girl from the mellah of Fez who sings her sums left for Algiers with her uncle’s mule train, to learn the ransom and exchange business."

[tracks.bond_esther.chapters.s.choices.promise]
text = "Promise to find her lodgings in Algiers where no one will make trouble for her."
hint = "A promise like this takes a closer friendship than you have yet. Or else you’ve already given your one promise of a lifetime to someone else. All you can do this time is write her a letter of introduction to a landlord."
reply = "“Somewhere well away from the docks,” she said, ticking it off on her fingers, “and close to the Jewish street. Not a landlord who lends money. Windows that face the courtyard.” “I know an old widow below the Casbah. Her roof leaks, but she’s a good woman.” “I can fix a leak myself.” She wrote the widow’s name and lane on the last page of her ledger, one line under the old place names. “Good people are hard to find.” Then she put a dot of ink at the head of the line, the way she had for the Venetian ship. “This line is a promise. Not a gift, not a loan. If you can’t find it when we get there, I’ll write you down as owing me a house.” A mule snorted. She patted the saddlebag, swung up, and looked back. “When your ship comes in this spring I’ll be on the quay to watch you unload. Only the cargo.”"
effects = [{}, {}, {}, {}, { title = "Trade Roads and Friendship" }, {}]

[tracks.bond_esther.chapters.s.choices.own]
text = "Each to our own: in Algiers she keeps to her trade, and I to my ship."
reply = "“That’s best,” she said, without a moment’s pause. “I want nothing to do with your father’s ships. If we run into each other on the quay, you don’t know me and I don’t know you, and the books stay clean.” She tied off the saddlebag, fished a token from her purse and pressed it into my hand, folding my fingers down over it one by one. “Don’t spend all your road money.” Right in front of me she wrote it in the ledger: one counting token to Tariq, gift. Underneath, in small letters: if we meet in Algiers, no greetings. The mule train started off. Ten paces on she turned and called back, “If anyone gives you trouble there, use my uncle’s name. Just this once. I won’t put it in the book.”"
effects = [{}, {}, {}, { title = "Trade Roads and Friendship" }, {}]

[tracks.reunion_esther]
name = "Esther: A Seat Off the Ledger"

[tracks.reunion_esther.chapters.reunion]
title = "A Seat Off the Ledger"
text = "There was a new counting house in the third lane of the mellah. Esther sat behind the table, the same Nuremberg tokens holding down a corner, new once and worn smooth now. Spread in front of her were a stack of lists and a bundle of family letters, all from people out of Portugal and Seville bound for Salonica or Istanbul. She checked and recited as she went, coins trading places in her mouth to the same old tune, twice as fast. “Sit.” She didn’t look up, just pointed with the end of her pen. “Not that one. That one’s for business.” Against the wall stood a low stool, its seat worn shiny, a water jar beside it. “That one is off the ledger. Whoever sits there, I don’t take their money and I don’t haggle with them.” When she had finished with one family she drew an old sheet from under the tokens and turned it toward me. The same line of Spanish in Hebrew letters, and under it several new ones. “I found where the note came from.”"
news = "A new counting house has opened in the third lane of the mellah of Fez. The woman who keeps it checks fares and holds letters for exiles heading east, and there’s always a low stool beside her table."

[tracks.reunion_esther.chapters.reunion.default]
effects = [{ text = "Tariq: I’m back in Fez. The counting house is in the third lane of the mellah, and the paperweight on the table is that set of Nuremberg tokens, the pattern on the brass long since rubbed smooth; you’ll know it the moment you walk in. There’s a low stool beside the table that’s kept for you, and nobody doing business gets to sit on it. A lot of people are passing through this year, from Portugal, from Seville, all of them heading east, and the lists are thicker than the ledger; I’m checking them alone until midnight. Whenever you’re passing, the water jar is by the stool. Pour your own. One more thing: I’ve put aside your passage money too. It’s tucked into the last page of the ledger and doesn’t go in any column. We’ll settle it when you’re sitting on that stool. Esther" }, {}]

[tracks.reunion_esther.chapters.reunion.choices.settle_fares]
text = "Sit on the stool off the ledger and help her finish this batch of fares."
reply = "We worked until dusk. The last family was a dyer out of Seville with five others to feed, and however we counted they were three dinars short. I dug three coins out of my belt and laid them on the table. Esther, as always, pulled out a sheet and wrote the receipt: what day, who gave it, a gift. When she came to my name she stopped. “These last few years you’ve taken a good few ships fewer.” “How would you know?” “I kept my uncle’s books in Algiers for three years. Half the cargo your family brought ashore got turned into money at his counter.” She pushed the receipt over for me to sign. “I came back to Fez, but his letters still come every month. Less Garnati cargo crosses his counter every year. It shows in the books.” I signed. She slipped the receipt into the ledger, then got up and filled the water jar beside the stool."
effects = [{}, {}, {}, { title = "A Seat Off the Ledger" }]

[tracks.reunion_esther.chapters.reunion.choices.her_old_names]
text = "Ask her how far the old promissory note has led her."
reply = "She talked all afternoon. The note was written in the autumn of 1491: a weaver from the Albaicín had borrowed a sum from her grandfather, to be repaid within the year. Before the year was up Granada had a new king, and before summer came her grandfather had been driven out of Spain. She had asked people coming from Seville to make inquiries. The lane in the Realejo was still there, and the bridge, and other people lived in her grandfather’s house. The weaver’s family had converted long ago, and nobody could say where they had moved after that. “I don’t want the debt.” She folded the sheet. “I’m keeping the names.” I took her pen and on another sheet wrote the names my grandmother said all her life: a well in the Albaicín, a narrow lane running downhill. When I was done, the two sheets lay side by side under the tokens."
effects = [{}, {}, {}, { title = "A Seat Off the Ledger" }]

[tracks.reunion_esther.chapters.reunion.variants.with_zaynab]
text = "There was a new counting house in the third lane of the mellah, and three camels knelt in the lane outside, chewing straw that had dropped from their panniers. Esther sat behind the table, the same Nuremberg tokens holding down a corner, worn smooth now, with lists and a bundle of family letters spread out in front of her, all for exiles heading east. “Sit.” She pointed with her pen. “Not that one. That one’s for business.” The low stool against the wall was worn shiny. “That one is off the ledger.” A woman leaned in at the door, dark from the sun, salt dust on her cuffs, and gave me a look. “Zaynab. She runs the salt caravan, and she’s waiting on me to work out this year’s price,” Esther said, as if it were nothing. “She’s the one beside me.” The two of them traded a glance, and Zaynab went back to her camels. When Esther had finished with one family she drew an old sheet from under the tokens and pushed it across: the same line of Spanish in Hebrew letters, with several new lines beneath. “I found where the note came from.”"
