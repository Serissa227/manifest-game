# 欣里克：桶可以空（bond_hinrik_korn）与重逢（reunion_hinrik_korn）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_hinrik_korn]
name = "Hinrik: A Barrel May Be Empty"

[tracks.bond_hinrik_korn.chapters.c1]
title = "The Sound of an Empty Barrel"
text = "It was cold in the grain store, and rye dust went straight up my nose. Hinrik rolled two barrels side by side in front of me, crooked a knuckle and rapped each once. One rang hollow, one sounded solid. “Which one’s full, newcomer?” I pointed left. He raised an eyebrow, didn’t praise me, and rolled a third barrel out of the corner, its bottom rumbling over the flagstones. “Again. A barrel can be empty. The count can’t. If the book says a hundred barrels, it’s a hundred barrels, and your ears have to follow the book.” He knocked three times. The sound was short and dull, like rapping on wet wood. I said empty. He grinned and levered the lid off with a bar: a barrel full to the brim with rye, the top layer caked into grayish-green lumps that crumbled into damp grit at a touch. He dropped a handful into my palm. “Full. That’s what damp sounds like. Nearly as dead as an empty one. You guessed right once. Don’t go thinking you’ve learned it. I’ve seen plenty who guess right once, and they always fall on the second.” The clump in my hand was cold and smelled of mildew. He was already holding out the chalk. “Mark it. Damp. Number thirty-seven.”"

[tracks.bond_hinrik_korn.chapters.c1.choices.open_lids]
text = "Pry the lids off the whole row with him and look in every barrel."
reply = "By the ninth barrel both my hands were full of splinters. Hinrik glanced at them, fished a needle out of his apron pocket and picked them out as he talked. “The last apprentice quit at the third. Said he came to learn sums, not carpentry.” When he was done, he had me chalk on each barrel what I’d heard before the lid came off, with a circle for the damp ones. Nine barrels, two circles, and when we checked against the open barrels, both were right. He said nothing, and added a tick beside each circle."

[tracks.bond_hinrik_korn.chapters.c1.choices.knock_all]
text = "Close my eyes, knock down the whole row, and call each one full or empty."
reply = "I knocked my way down the row with my eyes shut while he kept the tally behind me. When I opened them we checked: seven right out of ten. “Seven. That makes you half an apprentice.” I asked how I’d make up the rest. He jerked his chin toward the river mouth. “That half you only learn aboard ship. Barrels in a hold, you knock while they’re rolling.” The moment he’d said it he coughed, bent to press a lid down, and needed two tries to seat it."

[tracks.bond_hinrik_korn.chapters.c2]
title = "The Damp Sack"
text = "The stack of sacks at the very back of the store all looked the same color. Hinrik crouched, reached for the corner of the bottom sack, gave it one squeeze, and frowned. “Feel that.” I felt it. The burlap was soft and cool, a shade heavier than its neighbors, like a rag just brought in from the well. The eye couldn’t tell. The fingers could. “If the master were here, he’d say tip it in with the dry and stir. One damp sack in twenty dry ones, nobody tastes it and the books come out even.” He already had it up on his shoulder. “Not me. Stir it in, and next month it’s twenty-one damp sacks.” We hauled it out by the door on its own to air. He went back and laid his palm flat on the wall where the sack had leaned, held it there a long while, then rapped it with a knuckle, the way he knocked a barrel. “Hear that? Hollow behind.” He wiped his hand on his apron. “The books can take one sack’s loss. They can’t take a wall.”"

[tracks.bond_hinrik_korn.chapters.c2.choices.log_loss]
text = "Give this sack its own line: the day, the wall, how much went damp."
hint = "He says these are the grain store’s books, and you don’t know each other well enough yet for him to let an outsider write in them."
reply = "I spread the ledger on my knees and wrote the date, “north wall, by the third post,” and “about a quarter damp.” He leaned over to read it and grumbled that I fussed more than the head clerk. The next year the master finally had that wall mended, and the repair bill gave its cause as the day I’d written down. Hinrik brought the bill over and rapped the line twice with a knuckle. “Your handwriting.”"

[tracks.bond_hinrik_korn.chapters.c2.choices.find_leak]
text = "Go around behind the wall and find the leak."
reply = "Behind the wall was a narrow alley piled with rotten timber. I dug through it and found, above a crack in the wall, a length of eaves gutter rotted clean through, so the rain ran down the wall and soaked in. Hinrik fetched a ladder, climbed up for a look, and said my eyes were better than my hands. We stopped the gutter with oakum and pitch. Coming down the ladder his legs went a little soft, and he stood holding the wall a moment. Crouched too long, he said. The ladder had five rungs."

[tracks.bond_hinrik_korn.chapters.b1]
title = "One Barrel Short"
text = "This time there was a stocktake, and the master put up a pfennig as the prize: whoever counted a whole store first could keep it. When I finished there was still sand in the glass, and Hinrik was only on his fourth row. I’d beaten him by a quarter of an hour. I held up my slate. “Three hundred and two.” He was in no hurry to concede. He tucked the chalk behind his ear and walked slowly down the row I’d counted, all the way to the back corner, bent, and dragged a small barrel out of the gap between two big ones. “Three hundred and three. It was hiding from you.” My face went hot. I took his slate and went over it, and on the second pass I pointed at two identical numbers. “One hundred and seventeen. You wrote it twice.” He stared at them a long while, muttered “The chalk slipped,” and nodded in the end. One missed, one doubled. We set the two slates side by side, and both mistakes came from the same place: the barrels stood any which way, and the numbers were scrawled wherever. Hinrik took the chalk from behind his ear. “Then we rearrange. Until the dimmest one on the next shift can count it right.”"

[tracks.bond_hinrik_korn.chapters.b1.choices.renumber]
text = "Renumber every barrel in the store with him, row by row."
reply = "We moved the small barrels to the front, gave each row a letter and each barrel a number, chalked on the belly that faced the aisle. We kept at it until dark; he lit a lamp, walked the whole store once more, and said anyone could count it now. He left the last barrel blank and handed me the chalk. I wrote “C forty-one.” The master came to look the next day and tossed him the pfennig. “Split it.” Hinrik ran off, changed it into two smaller coins, and pressed one into my hand. “Even a pfennig splits fair.”"

[tracks.bond_hinrik_korn.chapters.b1.choices.bet_next]
text = "Bet him he’ll double a number again at the next count."
reply = "“What’s the stake?” “Loser buys a honey cake.” He snorted and said he’d never double a number again as long as he lived. At the next stocktake, sure enough, not a single number was doubled. He missed a barrel in the last row instead. He found it himself, and once he had, he stood in front of it thinking for a long time before he turned around. “Fine. Half a win to you.” That day we each bought a honey cake."

[tracks.bond_hinrik_korn.chapters.b2]
title = "The Ship at Anchor"
text = "The grain ship from Danzig drew too much water to come upriver, so it lay at anchor off Travemünde and the grain came up by lighter, load after load. When it was all ashore, the ship’s master came to the grain store with his bill of lading: a hundred and twenty barrels shipped, and the grain store’s receipt said a hundred and fourteen. “Where do your people keep their eyes?” Hinrik slapped the receipt on the table. “I counted those myself. We go aboard and see what’s left in the hold.” The moment the boat cleared the river mouth, the swell came up. He sat bolt upright the whole way, eyes fixed on the ship’s mast, not saying a word. He climbed the side, and the instant his feet touched the deck he lunged for the rail and was sick, bent double. The sailors at the foot of the mast burst out laughing. I stood between him and them. He wiped his mouth on his sleeve, his face white as an unpainted stave, and grabbed my arm hard. “Don’t tell anyone.” His voice was very low. “Nobody. I’m going to be a captain. I… I’m like this on every ship. Since I was small. Never once been any better.” The hatch stood open. Below, in the cradles that held the barrels, six hollows sat empty, side by side."

[tracks.bond_hinrik_korn.chapters.b2.choices.count_below]
text = "I go below and count for him while he gets air on deck, and back ashore we tell nobody."
hint = "Something this shameful he’d rather carry alone than hand to someone he doesn’t know well enough."
reply = "The hold was stifling and dark and smelled of damp grain and tar. I felt my way along the cradles and found them behind the ballast stones: six barrels, rolled there loose, not a wedge between them. I shouted “Six!” up the hatch, and it was a while before the answer came down. “Write it down.” Back ashore he corrected the receipt and said those six were to go under my name. I said put them under his; he was the grain store’s man. He looked at me for a good while before he said “Thanks,” very quietly, as if he didn’t want the barrels to hear."

[tracks.bond_hinrik_korn.chapters.b2.choices.tease_him]
text = "Tease him about it: every captain got there with his head over the rail."
reply = "He gave a weak laugh and said if I breathed a word he’d push me off the ladder. After a while he set his jaw, went down into the hold himself, found the six barrels behind the ballast, and was sick again when he climbed out. In the boat going back he suddenly asked, “You mean it? There are captains who get seasick?” I said yes, I’d heard of them. He didn’t ask anything else, just gripped the gunwale all the way, knuckles white."

[tracks.bond_hinrik_korn.chapters.a1]
title = "An Afternoon Without Knocking"
text = "That afternoon Hinrik didn’t test me. He rolled an empty barrel out of the store, stood it on the stone steps by the river, and patted the lid. “Sit.” It only seated one, so he crouched beside it and watched a merchantman working slowly upriver from the mouth. “Farthest I’ve ever been is Travemünde,” he said. “That’s it. Half a day on foot, quicker by boat. By boat… never mind, walking’s just as good.” He said the last part fast, as if afraid I’d pick it up. “The wharf at Bergen is all timber, a whole row of houses, every one a Hanseatic counting post. The granaries in Danzig are five stories. Five!” He stacked the air with his hands. “I want a ship of my own. Doesn’t have to be big. Two hundred barrels will do. Load rye in Danzig, trade it for stockfish in Bergen, and on the way home…” The ship reached the quay and someone aboard started a hauling chant. He stopped, picked up a pebble and tapped it on the barrel. Tock. Empty. “This barrel,” he said, “is the first thing aboard when I’ve got a ship.”"

[tracks.bond_hinrik_korn.chapters.a1.choices.ask_route]
text = "Ask him how they unload a ship at Bergen."
reply = "His eyes lit up at once. He went from the cranes on the Bergen wharf to how the stockfish is stacked aboard in bundles, to the counting-post apprentices who aren’t allowed a fire in winter. He told it as if he’d been ten times, and every word of it was picked up on the quay. I asked one question and got three answers. When he was done he was the first to laugh, half a beat late. “Fat lot of good telling it well does. First I have to get past that stretch outside Travemünde.”"

[tracks.bond_hinrik_korn.chapters.a1.choices.same_barrel]
text = "Shift over on the barrel, pull him up beside me, and watch until the last ship ties up."
hint = "Pull at him now and he’ll only jump up and go roll another barrel. You’re not that close yet."
reply = "He hesitated, then sat. The barrel was small, and our shoulders touched. He didn’t shift away, and didn’t say anything either; he just sat even straighter than usual. By the time the last ship came alongside it was dark and the lamps were lit along the quay. He didn’t get up. “Wait a bit. Let’s see them make fast.” They made fast. He still didn’t get up. We sat a while longer, until someone came out of the store to call him to lock up."

[tracks.bond_hinrik_korn.chapters.a2]
title = "The Old Counting Tokens"
text = "Hinrik set a little cloth pouch on my counting desk, its drawstring tied in a hard knot. “Take it.” It took me ages to work the knot loose. Inside were brass counters, the Nuremberg kind, twenty or so, their faces worn almost smooth. One had a chipped corner, and even the chip was worn round. Whenever he worked the counting cloth, that was the one he led with. I knew it. “I’ve got a new set. Don’t need this one anymore.” He said it fast, looking somewhere else. “I sewed the pouch myself. No laughing at the stitches.” The stitches were crooked, all right. I laid the counters out one by one on the ruled cloth and picked up the chipped one. “You’re giving me this one too?” He stopped short. Then the corners of his mouth crept up, like a breath he’d been holding for a long time finally let go. “I knew you’d recognize it.” He wiped both hands on his apron. “So you tell me. How do we split them?”"

[tracks.bond_hinrik_korn.chapters.a2.choices.take_some]
text = "Take half, and let him keep the other half along with the chipped one."
hint = "Your friendship is still too new. Start dividing it up and he’ll take it for politeness, shove the whole pouch at you, and walk off."
reply = "I sorted the counters into two piles of eleven, the chipped one in his. He counted both twice, put his pile in the drawer, locked it, and hung the key back around his neck. “Half each. The books balance.” I asked which books. He bent to tie the pouch’s drawstring, a slipknot this time that came open with one pull. “Yours and mine.”"
effects = [{}, {}, {}, { title = "The Old Counting Tokens" }]

[tracks.bond_hinrik_korn.chapters.a2.choices.trade_one]
text = "Dig a pfennig out of my pocket and trade it for the chipped one."
hint = "Try to swap him something now and he’ll only think you’re haggling. You’re not close enough yet."
reply = "He stared at the pfennig, then at me, like a sum that came out wrong however he worked it. “A brass counter for one pfennig. I’m losing on that.” For all that, he pushed the chipped counter across to me and closed his fist tight around the coin. I said then he’d better remember it and collect someday. “I’ve got a good memory,” he said. “I’ll keep track of the interest too.”"
effects = [{}, {}, {}, {}, { title = "The Old Counting Tokens" }]

[tracks.bond_hinrik_korn.chapters.a2.choices.ask_why_old]
text = "Ask him why he’d give away the old set instead of the new one."
reply = "“I don’t know yet whether the new ones are true. This old set I’ve counted tens of thousands of times. Which one’s a hair light, which one has a burr on the edge, I can feel it with my eyes shut.” Even as he said it, his hand drew the pouch back to his side of the desk. “If you’re asking that, it means you still think it’s too old. Come and get it when you’ve made up your mind. I’m in no hurry.” He tied the pouch shut in a hard knot again and put it in the drawer."

[tracks.bond_hinrik_korn.chapters.s]
title = "A Barrel May Be Empty"
text = "Thin ice had formed on the river, and the lighters were laid up. The grain store door stood half open; inside, Hinrik was running the year’s accounts one last time. He heard my steps and didn’t look up. “When does your ship sail?” I said after the new year, out of Travemünde. He grunted and struck a line through something in the ledger. “Come spring the master wants to send someone along on a ship to Danzig. He asked if I’d go.” The pen stopped. “I haven’t told him.” Not yes, not no. He scraped his pen on the lip of the inkwell, again and again. He shut the ledger and rapped the counter with his knuckles. It was solid wood, and the sound came back dull. “After you’re gone, I’ll keep knocking barrels. The day I can stand on a ship and knock without being sick, I’ll come find you.” He looked up. “And if I can’t find you?”"

[tracks.bond_hinrik_korn.chapters.s.choices.promise]
text = "Promise to come to the grain store first every time I make port, and tell him how other stores are run."
hint = "A promise like this is only made between people who’ve been through everything together. And if you’ve already given someone else your one promise of a lifetime, these words belong to them."
reply = "He thought it over and said telling wasn’t enough. I should bring back a sack of grain from somewhere else, Danzig, Riga, anywhere, so he could feel whether it was drier than Lübeck’s. I said I’d have to pay duty on it. “I’ll work out the duty for you.” He tore a blank page from the back of the ledger, wrote a line on it, and ruled a stroke underneath. “One entry for every time you come back. Any trip you don’t, the line stays empty, and I’ll still know it’s yours.” He folded the page and pushed it into my hand, then took it back, wrote the grain store’s house sign on the reverse, and pushed it at me again. “Don’t go in the wrong door. The one across the street is a tavern.” I tucked the paper inside my coat. He went back to his accounts, got two lines further, then looked up and added, “Whether I take that ship in the spring, I’ll tell you when you come back from your first run.”"
effects = [{}, {}, {}, {}, {}, { title = "A Barrel May Be Empty" }, {}]

[tracks.bond_hinrik_korn.chapters.s.choices.heart]
text = "Tell him that the day I come back, the first person I want to see is him at the grain store door."
hint = "The words come out as dull as a knock on that solid counter, and go no further. You haven’t come that far yet, or the one promise of your life already belongs to someone else."
reply = "The pen dropped from his hand onto the ledger and rolled half a turn. His ears went red first, then the red ran all the way down his neck. He bent for the pen and needed two tries to pick it up. “Then, then I’ll stand at the door every day.” I said not every day. He thought about it. “Then I’ll stand there on the windy days. Wind’s what brings the ships home.” A little later he reached out and caught my hand, quick, and let go at once, like he’d touched a hot stove lid. “I’ve written that down,” he said, not looking at me, staring at the blot of ink on the page. “When you come back… when we’re both a bit older, I’ll give you my answer.” I said all right. He nodded, and inked the blot into a number."
effects = [{}, {}, {}, {}, {}, { title = "A Barrel May Be Empty" }, {}]

[tracks.bond_hinrik_korn.chapters.s.choices.own]
text = "Make it a race: who’s a captain first, or who runs a whole store first."
reply = "“Then I’ll run a store first,” he shot back. “Captain can wait.” I said he was scared. He slapped the ledger. “A barrel can be empty. A boast shouldn’t be full.” Then he couldn’t keep a straight face, and laughed. We slapped hands across the counter. His palm was white with chalk dust and left a pale print on the back of my hand. “Remember,” he said, “loser stands the other a barrel of beer. Full. I’ll knock it, so don’t try to pass off half a barrel on me.” I said he’d better remember that captain counted too, and I’d be standing on the quay to watch him walk down the gangplank on his own two feet. He didn’t answer, just bent and struck that line in the ledger through again, so hard the nib roughed up the paper."
effects = [{}, {}, {}, { title = "A Barrel May Be Empty" }, {}]

[tracks.reunion_hinrik_korn]
name = "Hinrik: The Granary After the War News"

[tracks.reunion_hinrik_korn.chapters.reunion]
title = "The Granary After the War News"
text = "The war began in August: Lübeck alongside the Danes, against Sweden. By the time I was back in Lübeck, the line outside the grain store reached the corner of the street, every man in it sent by some ship to draw rations, clutching a stamped chit. Hinrik stood on the doorstep—the whole store was his to run now—a head taller than he used to be, his apron leather now, his voice not changed a bit. “Pelican! Forty barrels of rye, twelve of salt pork! Holy Ghost comes this afternoon, stop shoving!” He saw me and lifted his chin once, but didn’t stop. He read out every ship’s share, one after another, before he jumped down off the step and shoved a stack of lists into my arms. “Hold these for me.” He said it as if I’d left yesterday. “Seven years, and you haven’t changed. Still picking the busiest hour to turn up.” Page after page: names, ships, barrels. On the last page, in a different ink, someone had added a line: Escort for the grain, Korn. I looked up at him. He reached over and turned the page. “The supply ship sails next month, and I’m the one escorting the grain. I put my own name down.” He dropped his voice. “There’s something I haven’t told the master yet.” He didn’t say what."

[tracks.reunion_hinrik_korn.chapters.reunion.default]
effects = [{ text = "The war’s started. There’s a line outside the grain store every day, all the way to the corner. Every ship sends someone with a stamped chit, and I read out the shares one ship at a time until my throat’s raw. The master says I know the shares better than he knows his prayers, which from him is praise. The supply ship sails next month, and I’m the one escorting the grain. I put my own name down. There’s something the master still doesn’t know, and I haven’t gone to tell him. Maybe on the day I’ll tell him. Maybe on the day I’ll just go aboard and say nothing. If war news reaches you where you are, don’t believe all of it. Believe about a third and wait for my letter for the rest. And one more thing: your line in the book, I’ve kept it. Haven’t struck it out. —Hinrik" }, {}]

[tracks.reunion_hinrik_korn.chapters.reunion.choices.check_list]
text = "Check the ration lists for him, every name, so nobody slips through."
reply = "We lit a lamp in the store and went through it page by page. On the Holy Ghost’s page I pointed out a name: the same sailor was on the Pelican’s list too, drawing two shares. Hinrik struck it out, thought a moment, and wrote a small line beside it: one share of rye left over, for the widows on the quay. By the time we finished it was full dark; the line outside had gone and only the wind was left. He squared the lists into a stack and rapped the top page twice with a knuckle, the way he’d knock a full barrel. “The escort business,” he said. “I’ll go tell the master myself tomorrow. What I’ll tell him, I haven’t worked out.” He blew out the lamp and stood a moment longer in the dark. “Will you come tomorrow?” I said I would. “Then I’ll work it out tomorrow.”"
effects = [{}, {}, {}, { title = "The Granary After the War News" }]

[tracks.reunion_hinrik_korn.chapters.reunion.choices.bet_captain]
text = "Bet him he won’t dare board that supply ship."
reply = "“I dare.” He answered faster than anyone. “What’s the stake?” I said a barrel of rye, full. On sailing day, before it was light, the supply ship weighed anchor off Travemünde, and I stood on the shore to watch. He stood at the stern, straight as a mast, until the ship was a speck out at sea. A dozen-odd days later it came back, and he was first down the gangplank, his face green, salt crusted all down his front. He walked up to me and caught his breath first. “Sick the whole way. Didn’t jump.” I asked who won the bet. He thought about it a long time. “Half to me. I went aboard and didn’t jump; that half’s mine. I was sick; that half’s yours.” He pushed a chit for half a barrel of rye into my hand. “The other half when I’m back from the next run.”"
effects = [{}, {}, {}, { title = "The Granary After the War News" }]

[tracks.reunion_hinrik_korn.chapters.reunion.choices.stay_ashore]
text = "Tell him: skip this ship, stay ashore, and I’ll stay a while too."
hint = "You never got that far back then. Today these words weigh too much."
reply = "He looked at me for a long time, long enough for someone at the door to start shouting for the Pelican again. He didn’t answer them. “You know,” he said. “You’ve known since that day at the anchorage.” I said I knew. He folded the list in his hand in half, then in half again, tucked it into his apron pocket, and took my hand. This time, once he held it, he didn’t let go. His palm still had chalk dust on it. “Let somebody who can stomach it escort the grain. I’ll square it with the master.” He paused. “Back then you said the day you came home, I was the first one you wanted to see. I said I’d answer when we were older.” They were shouting outside again. He didn’t turn around, just bellowed “Wait!” at the door before he turned back. “Here’s my answer: I’m staying. You stay too.”"
effects = [{}, {}, {}, { title = "The Granary After the War News" }]
