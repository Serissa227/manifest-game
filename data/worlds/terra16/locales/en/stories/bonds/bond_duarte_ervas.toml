# C7 英文覆盖：杜阿尔特·埃尔瓦斯（药名旁的叶子 / 自己的笔迹）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_duarte_ervas]
name = "Duarte: The Leaf Comes First"

[tracks.bond_duarte_ervas.chapters.c1]
title = "A Leaf Beside Every Name"
text = "In the apothecary’s shop on the Rua Nova, Duarte was bent over the counter memorizing drug names. Every time he wrote one down he drew a leaf beside it: next to “rhubarb” a leaf as big as a fan, next to “sage” one covered in fine hairs. I laughed and said he was tracing flowers like a little boy. He didn’t argue. He got up and turned a whole row of jars around on the shelf, one after another, until every label faced the wall. “You learn names faster than I do. So which one’s the chamomile?” I picked two jars, lifted the lids, and got both wrong. He didn’t laugh. He tore a page from his book, drew a leaf of each of the two I’d mistaken, then turned the page over and drew their undersides: on one the veins grew in pairs, on the other they alternated, left, then right. “People made up the names. The leaf grew this way on its own. Know the leaf first, then learn the name.” The master coughed in the back room. The row of jars still had its back to us."

[tracks.bond_duarte_ervas.chapters.c1.choices.draw_veins]
text = "Sit down and learn from him how to draw the veins on the back of a leaf."
reply = "My veins came out crooked, like furrows after a hard rain. Duarte leaned over and studied them for a long while. “Crooked doesn’t matter, as long as they run the right way.” We kept drawing until the master came out to put up the shutters. He folded my sheet and tucked it into his own book. “I’ll keep it to compare. The day you draw them straight, we’ll take it out and see.”"

[tracks.bond_duarte_ervas.chapters.c1.choices.smell_jars]
text = "Close my eyes and name the jars one by one by smell."
reply = "Fennel, mint, chamomile: I got the first three right. The fourth smelled sweet, and I said licorice. Duarte turned the jar around. Rhubarb. He laughed out loud, then sobered. “Your nose is more honest than your eyes, but it can lie too. That jar held licorice last month, and the smell hasn’t gone.”"

[tracks.bond_duarte_ervas.chapters.c2]
title = "Two Leaves Too Alike"
text = "At the drying ground by the river, the flat baskets ran in rows down to the water. Duarte crouched by the last one and didn’t move for a long time. Two leaves lay side by side in it: one was wild celery, and the other might be, or might not. “Hemlock,” I said. “Look how thin it is.” “Wild celery can be thin too.” He turned both leaves over, then back again. “You’d have to see whether the stem has purple spots, and whoever brought these only picked the leaves.” “The master won’t be back till evening. When he comes, the whole yard will know you couldn’t tell.” He went red to the ears and still shook his head. He took a stick of charcoal from his shirt, drew both leaves, and wrote two words beside them: “Not known.” “Better a day slow. A day slow gets me a scolding at worst. Get one leaf wrong and somebody drinks it.” The river wind lifted a corner of the slip, and he weighed it down with a pebble."

[tracks.bond_duarte_ervas.chapters.c2.choices.wait_master]
text = "Wait with him at the drying ground until the master comes back, right through to evening."
hint = "“Go on home. No sense both of us sitting out in the sun.” He won’t let you wait with him yet."
reply = "The sun had gone down behind the far bank before the master came back. He picked up the leaf and gave it one look. “Hemlock.” The color left Duarte’s face for a moment. He wrapped the leaf in three layers of paper and put it in an empty jar by itself. Then he took the slip that said “Not known” and added a line under it: his name first, then mine. “We waited together,” he said. “Both names go on it.”"

[tracks.bond_duarte_ervas.chapters.c2.choices.label_both]
text = "Put a “Not known” label on each leaf for him and keep them apart."
reply = "I moved the two leaves into separate baskets, an arm’s length apart, and weighed a label down on each. Duarte watched me write. “You write like a prescription. It’s a good hand.” When the master came back that evening, both leaves were where I’d left them, nothing mixed up. He asked who had done the labels. Duarte said nothing, just pointed at me."

[tracks.bond_duarte_ervas.chapters.b1]
title = "Drugs Off the India Ships"
text = "In the autumn the India fleet came in, and overnight the storerooms of the Casa da Índia filled to the rafters: cinnamon stacked in bundles like firewood, rhubarb cut into chunks, camphor in tin canisters, and a little box of bezoar stones the storekeeper wouldn’t let us so much as look at for long. The masters set the apprentices a contest. Each of us got a wooden tray with twelve compartments and a pinch of some drug in each, and we had to write the names and hand them in. I got two wrong: I took a piece of cassia for cinnamon and called a knob of turmeric dried ginger. Duarte got one wrong. He wrote alum where the camphor was. When the rankings went up, he was first. As the storekeeper read out his name, all he said was, “I got the camphor wrong. Take a point off.” He looked at the list without a trace of pleasure, then went straight back and wrote his one mistake into his book in letters bigger than my two put together, filling a good part of the page. “The one who gets it wrong ought to remember it best,” he said. “Especially the one who won.” Then he picked up the tray again and held the camphor to his nose, over and over."

[tracks.bond_duarte_ervas.chapters.b1.choices.compare_errors]
text = "Draw both our mistakes on the same sheet of paper."
reply = "The three mistakes went down in a column: cassia, turmeric, camphor. We each drew our own. My two were crooked, and the ink had bled at the tip of the cassia leaf. His was the neatest of the three. Camphor has no leaf, so he drew one from the camphor tree and went over the tip three times. Duarte folded the sheet. “This is worth more than the rankings. They’ll put up new rankings next year. This doesn’t change.”"

[tracks.bond_duarte_ervas.chapters.b1.choices.rematch_cinnamon]
text = "Challenge him to a rematch on cinnamon when the next shipment comes in."
reply = "“Done,” he said at once, then added, “There are four kinds of cinnamon. Learn all four barks first.” For a month I was in the storerooms every day, snapping bark, sniffing it, chewing it, my mouth hot the whole time. The second contest ended in a tie. Duarte nudged the tray of cinnamon my way. “A tie counts as your win. You chewed for a month.”"

[tracks.bond_duarte_ervas.chapters.b2]
title = "The Recipe in a Borrowed Hand"
text = "I went into the back room of the shop for a mortar and found Duarte at the window copying out a recipe. I came up right behind him and he didn’t hear me. The writing on the page wasn’t his. His own hand was round, every stroke upright and tidy. This one leaned hard to the right and dragged long tails off the ends of its letters, like an old man’s. He saw me and his pen stopped, but he didn’t cover the page. On the table lay two copies of the same recipe: one on old paper, the ink gone yellow, the letters crowded together; the other the one he had just made, in a different shape altogether. “The old one is my grandmother’s,” he said, tapping the yellow sheet. “She lives out in the Alentejo. She treats people, delivers babies, knows the herbs. In the next village some of them call her a witch.” He kept his voice low. “There’s an Inquisition in the city now. I don’t want anyone to pick up this paper one day and know whose hand it is. So when I copy them, I write them in somebody else’s hand.” A cart rattled by outside. He waited until the sound had faded, then pushed the two sheets side by side toward me."

[tracks.bond_duarte_ervas.chapters.b2.choices.hide_pages]
text = "Promise to keep it to myself, and help him tuck the pages into the back of a Latin herbal."
hint = "You offer to help, and he folds the old sheet and slips it inside his shirt. He isn’t ready to trust you with this."
reply = "We chose the thickest book on the shelf, a Latin Dioscorides, and slipped his grandmother’s recipes in among the last pages. Duarte stood on a stool and pushed it back onto the top shelf. “Nobody reads this one. Even the master says it’s too heavy.” He jumped down, brushed the dust off his hands, and looked at me for a moment. “You’re the second person to know. The first was her.”"

[tracks.bond_duarte_ervas.chapters.b2.choices.visit_grandmother]
text = "Ask whether he would take me to the village to meet his grandmother."
reply = "He hesitated a long time, rubbing his thumb back and forth along the edge of the yellow sheet. “Next spring, maybe, when her cough is better.” He drew one recipe from the stack and pushed it over. “For coughs. Learn this one first. The first thing she does with anyone new is test them.”"

[tracks.bond_duarte_ervas.chapters.a1]
title = "The Night Watch"
text = "It was Lent, half the city was sick, and the shop no longer put up its shutters at night. Duarte had gone two nights without sleep. There were gray shadows under his eyes, and his hands never stopped. He passed me a bottle, and I saw that the label reading “Syrup of Poppies” was on upside down. “You’ve put it on upside down.” He turned the bottle around and stared at it a good while, as if he didn’t recognize his own writing. “When I’m tired, letters turn around on me.” He smiled, not very convincingly. “My grandmother says tired eyes lie to their owner first.” Thirty-odd bottles still stood unlabeled on the counter, and the master had long since gone upstairs; his snoring came down through the floorboards. Duarte peeled off the upside-down label, smoothed it flat bit by bit with his fingernail, and reached for the paste brush again."

[tracks.bond_duarte_ervas.chapters.a1.choices.recheck_morning]
text = "Send him home to sleep, and agree to check every label from tonight first thing tomorrow."
reply = "He wouldn’t go until I carried the paste bowl out of reach. The next morning he was knocking at the back door before it was light, his eyes still puffy. We went through eighty labels one by one and found two upside down, both from before midnight. Duarte peeled them off and tucked them into his book. “Good thing I didn’t push on last night.”"

[tracks.bond_duarte_ervas.chapters.a1.choices.keep_watch]
text = "Mind the counter for him and let him lean against the cabinet for a little sleep."
hint = "He shakes his head and says he isn’t tired, sitting bolt upright. He won’t fall asleep in front of you yet."
reply = "He said he would only close his eyes for a moment, leaned against the drug cabinet, and was asleep, his head nodding against the brass ring of a drawer. I labeled the rest of the bottles, laid my coat over him, and didn’t wake him. When he woke at dawn he didn’t thank me. He folded the coat, shook it out, folded it again, and handed it back. Every leaf he drew in his book that day came out bigger than usual."

[tracks.bond_duarte_ervas.chapters.a2]
title = "The Pressed Flower in the Book"
text = "In the autumn Duarte came back from the Alentejo with a bundle of dried herbs on his back and an old book whose cover had been rubbed shiny with mutton fat. He opened it in the back room of the shop. There were more things pressed between its pages than words written on them. Halfway through he stopped and took out a flattened little flower, pale blue, so thin the light came through it. “The first plant my grandmother taught me. I was five. She made me feel the leaves first, then smell my fingers, and only at the end did she tell me what it was called.” He folded the flower into a sheet of paper and pushed it across to me. On the paper he had drawn its leaves, fine as needles, even the white on their undersides, and beside them which month to pick it and how to use it. He hadn’t written the name. “That’s my own hand,” he said. “It’s the first time I’ve written down something she taught me in my own hand.”"

[tracks.bond_duarte_ervas.chapters.a2.choices.accept_flower]
text = "Take the pressed flower and ask him his grandmother’s name."
hint = "He pushes the paper halfway across, then keeps his hand on it. He hasn’t decided whether to give you this flower."
reply = "“Maria,” he said. “Half the old women in the countryside are called that.” I wrote “Maria” on the back of the paper, and “Alentejo” under it. Duarte looked at it a long time, then reached over and straightened a stroke I’d written crooked. “She’ll be glad. She always says a plant only belongs somewhere once someone has written its name down.”"

effects = [{}, {}, {}, { title = "The Pressed Flower in the Book" }]

[tracks.bond_duarte_ervas.chapters.a2.choices.press_one_back]
text = "Take the flower, and give back a leaf I know myself, pressed into his book."
hint = "Slip something into his book now and he’ll think you’re making fun of his grandmother."
reply = "I put the flower away and dug a sage leaf out of my pocket, one I’d picked up at the drying ground, the down still on its underside. Duarte opened his book, laid it where the flower had been, pressed it flat, and wrote a line beside it: “This page is yours from now on.” He closed the book and kept his hand flat on the cover for a long time before he lifted it."

effects = [{}, {}, {}, {}, { title = "The Pressed Flower in the Book" }]

[tracks.bond_duarte_ervas.chapters.a2.choices.name_flower]
text = "First, work out what flower it is."
reply = "I said lavender, then marjoram, and only on the third try got it: rosemary. Duarte folded the paper shut again. “Look at you. The name got here first and you still haven’t learned the leaf.” He put the flower back in his book. “When you know its leaves, I’ll give it to you.” The next day there was a pot of rosemary on the counter. He said it was for me to learn the leaves from."

[tracks.bond_duarte_ervas.chapters.s]
title = "The First Page of the Field Book"
text = "By December my ship had a sailing date. The day I went to the shop to say goodbye, Duarte was cutting a ream of new paper into sheets of one size, squaring each one before he set it down. “I’m going to make a book,” he said. “Every herb the shop uses, one to a page: the face of the leaf, the back, the flower, the root, all drawn, and the name at the very bottom. An apprentice who learns from it won’t take hemlock for wild celery again.” He showed me the first page: wild celery. The veins on the back were drawn far finer than on that slip at the drying ground two summers back, and in the bottom right corner he had written: “Known.” “The name goes last. Let them look at the leaf first.” He bent to his cutting again and didn’t stop. “The places you’re going, I suppose the leaves are nothing like ours.”"

[tracks.bond_duarte_ervas.chapters.s.choices.promise]
text = "Promise to collect leaves for him along the sea routes, and note where every one was picked."
hint = "You two aren’t close enough for that kind of promise, or you’ve already made it to someone else. All you can tell him is that you’ll bring back a few good leaves if you see them."
reply = "“And write down the weather that day,” he said. “Leaves picked on a dry day and leaves picked after rain dry differently.” I said I would. He turned and pulled a stack of oiled paper from under the cabinet, already cut, the corners squared, and pushed it into my arms. “For pressing. Leaves are harder to carry than letters. A wet letter you can still read. A leaf goes black the moment it gets damp.” I asked how many pages he would keep for me. He turned to the back of the book without counting. “As many as you bring back.” I packed the oiled paper on the very top of my things. At the end of the street he caught up with me and handed me a stick of charcoal, because ink spills on ships. “Charcoal draws thick,” he said. “Go over the veins on the back twice.”"

effects = [{}, {}, {}, {}, {}, { title = "The First Page of the Field Book" }, {}]

[tracks.bond_duarte_ervas.chapters.s.choices.heart]
text = "Tell him that the day I come back, I want to see his leaves first, and then him."
hint = "The words come right up to your lips and go back down. The two of you aren’t there yet."
reply = "The knife stopped in Duarte’s hand. His ears went red first, and then he laughed. “There isn’t a leaf in that sentence.” “Then draw one for it.” He set the knife down, drew my hand over and opened it, and drew on my palm with his fingertip: first the stalk, then the tip, then, as if he had turned it over, the veins on the back. He went slower than on any page he had ever drawn, and it tickled so much I wanted to pull away and didn’t dare. When he finished, he didn’t let go. “When you come back,” he said. “The rest can wait till then.” The master called him from the back room to grind something. He answered and still didn’t let go, not until the master called a second time. I kept that hand closed into a fist all the way to the harbor and only opened it on the gangplank."

effects = [{}, {}, {}, {}, {}, { title = "The First Page of the Field Book" }, {}]

[tracks.bond_duarte_ervas.chapters.s.choices.own]
text = "Challenge him: whoever finishes a field book first wins."
reply = "“You’ll never finish one on a ship.” “Ships go where the leaves are.” He put the paper knife down on the table and held out his hand. “Then it’s settled. The loser copies the winner’s whole book from start to finish, leaves and all.” I slapped his palm and came away with a hand full of paper scraps. He wrote the date on his first page then and there, tore off a sheet and made me write it too. “So you can’t come back and say you started before me.” I folded the sheet in four, pushed it into my boot, and patted it twice right in front of him. He walked me to the door, still muttering, “The backs. Don’t forget to draw the backs.” When I looked around from far down the street he was still in the doorway, waving the page with the date on it."

effects = [{}, {}, {}, { title = "The First Page of the Field Book" }, {}]

[tracks.reunion_duarte_ervas]
name = "Duarte: In His Own Hand"

[tracks.reunion_duarte_ervas.chapters.reunion]
title = "In His Own Hand"
text = "On the quay at the Casa da Índia, a ship just in was unloading drugs, the sacks piled all the way to the warehouse doors. Duarte stood among them with two apprentices at his side. He called out a name and wrote a label, and an apprentice slapped it on the sack. Nobody turned to ask a master anymore. He saw me, kept hold of his pen until he had finished the labels for a crate of camphor, then came over. “You’re back.” His cuffs were black with ink. “Beatriz at the hospital over by the Rossio asked me to bring her some linen, and I can’t get away.” After dark he took me into the little counting room beside the warehouse and brought out the field book. It was too fat to close now. “My grandmother died the winter before last.” He turned the pages one by one. “I copy her recipes in my own hand now, behind the plants she taught me.” He turned all the way to the end. Nothing was pressed in the last few pages. At the top of each, he had written my name. “These are yours.”"

[tracks.reunion_duarte_ervas.chapters.reunion.default]
effects = [{ text = "The field book is up to page one hundred and twenty. I’m still keeping the last few pages; your name is at the top of them, and whenever you get back to Lisbon, they’re yours to fill. My grandmother died the winter before last. I’ve finished copying her recipes in my own hand, behind the plants she taught me, and not one of them is in anyone else’s hand anymore. The camphor off the India ships was poor this year; I checked it three times before I dared to label it. With this letter, a rosemary leaf, picked at the drying ground by the river. It was a clear day, with the wind coming in off the sea. Duarte" }, {}]

[tracks.reunion_duarte_ervas.chapters.reunion.choices.fill_last_page]
text = "Press the leaves I brought back, one by one, into the last pages of the field book."
reply = "I unwrapped the bundles I’d brought back, layer by layer. With every leaf he pressed, he asked the same things: where was it picked? What day? What was the weather? I answered, he wrote, in that round hand of his own. One leaf I’d picked in the rain on the Cape Verde islands had gone half black, and he pressed it in anyway and noted beside it: “Damp.” There was another I couldn’t name, and neither could he, so he wrote “Not known,” just as he had years before, and looked up at me and grinned. By the time the last page was full, the lamp in the counting room had nearly burned dry. Duarte turned back to the title page, left a line under his own name, and handed me the pen. “This book needs two names on it.”"

effects = [{}, {}, {}, { title = "In His Own Hand" }]

[tracks.reunion_duarte_ervas.chapters.reunion.choices.count_pages]
text = "Bring out the book I made at sea and see whose has more pages and fewer mistakes."
reply = "The two books lay side by side on the counting table. His had twenty pages more; mine had two fewer mistakes. “Call it a tie,” he said. Then he took mine and leafed through it. “No. You have two fewer mistakes because you never drew the backs at all. You can’t get wrong what you never drew.” “The backs blow over in the wind at sea.” “Then weigh them down.” We argued from the backs of leaves to the stalks, and from the stalks to flowering seasons, until the watchman of the Casa da Índia rapped on the window to say he was locking up. Duarte shouted through the window, “Give us a quarter hour!” The watchman went off grumbling, and we argued a good while longer. In the end he stacked the two books together and held them to his chest and wouldn’t let go. “We’ll go again next year. This time I’ll draw the flowers, and you’ll fill in every back you missed.”"

effects = [{}, {}, {}, { title = "In His Own Hand" }]

[tracks.reunion_duarte_ervas.chapters.reunion.choices.his_hand]
text = "Take the hand he copies recipes with, and tell him what I said back then still holds."
hint = "You never said it back then, so there’s nothing to take up now."
reply = "Duarte put down his pen. He didn’t look up. He looked at our two hands, one over the other, for a long while. “I’ve been waiting,” he said. “Waiting so long that even my grandmother asked me, more than once, whether the one who wanted to see the leaves first had come back yet.” He gripped back with his inky hand and left a print on the back of mine about the size of a leaf. “Before she died, I told her it wouldn’t be long.” He pushed aside the recipe he’d half copied. “I don’t have to change my hand anymore. Whatever I write to you, I’ll write in my own.” Outside the counting room the watchman went by with his lamp, came back, stopped a moment at the door, and didn’t knock. He left the lamp on the windowsill."

effects = [{}, {}, {}, { title = "In His Own Hand" }]

[tracks.reunion_duarte_ervas.chapters.reunion.variants.own]
text = "On the quay at the Casa da Índia, a ship just in was unloading drugs, the sacks piled all the way to the warehouse doors. Duarte stood among them with two apprentices at his side. He called out a name and wrote a label, and an apprentice slapped it on the sack. He saw me, finished the labels for a crate of camphor, and came over. The first thing he said was, “How many pages did you bring back?” His cuffs were black with ink. “Beatriz at the hospital over by the Rossio asked me to bring her some linen. Wait till I’m back, and then we’ll compare.” After dark, in the little counting room beside the warehouse, he dropped the field book on the table. It was too fat to close. “My grandmother died the winter before last. I copy her recipes in my own hand now, behind the plants she taught me.” He turned to the first page. The date from all those years ago was still at the foot, and under it a new line: “Loser copies the whole book.” Then he turned all the way to the end, where nothing had been pressed in the last few pages. “Bring yours out,” he said. “I’m saving these to see whether what you brought back is enough to fill them.”"

[tracks.reunion_duarte_ervas.chapters.reunion.variants.romance]
text = "On the quay at the Casa da Índia, a ship just in was unloading drugs, the sacks piled all the way to the warehouse doors. Duarte stood among them with two apprentices at his side. He called out a name and wrote a label, and an apprentice slapped it on the sack. He saw me, and his pen slipped and dragged a long streak of ink across the label. He wrote the camphor label over again before he came over. “You’re back.” His cuffs were black with ink. “Beatriz at the hospital over by the Rossio asked me to bring her some linen. I’ll… I’ll take it tomorrow.” After dark he took me into the little counting room beside the warehouse and brought out the field book, too fat to close now. “My grandmother died the winter before last. I copy her recipes in my own hand now.” He turned all the way to the end. Nothing was pressed in the last few pages, and my name was written at the top. His finger stopped on that line and moved along it from left to right, as slowly as if he were drawing veins. “These are yours.”"
