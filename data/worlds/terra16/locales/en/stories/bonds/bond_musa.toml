# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_musa.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 两个“收下”选项第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个效果、重逢三个选项第 4 个效果是 memory；重逢 default 第 1 个效果是 letter。

[tracks.bond_musa]
name = "Musa: The Joke Goes Down First"

[tracks.bond_musa.chapters.c1]
title = "The Joke Goes Down First"
text = "Spring had come, and the Turkish soldiers still hadn’t all cleared out of the city when Musa cornered me at the school gate with a coil of rope ladder on his shoulder. There was a house in the Andalusian quarter, he said, half fallen in, with Roman money buried at the foot of the wall. “The Romans came to Fez?” “Wherever the Romans went, their money went too.” He hitched the ladder higher. “Go down and you’ll see.” All that was left of the back courtyard was a black hole with nettles growing around the rim. He was still crouched at the edge, but his joke had already gone down ahead of him: “There’s treasure this time—me, at the very least.” Before he’d finished, boots rang on the paving at the end of the lane and someone was swearing in Turkish—the watch. I had come into the city with their army, but they didn’t know me, and I didn’t care to be known. We dove into a caved-in oven and came up with faces full of ash. Musa clapped a hand over my mouth and shook all over trying not to laugh, one end of the ladder still trailing outside. The boots stopped at the courtyard gate. Someone kicked the rope, swore once, and moved off. He let go and asked, breathless, “Still digging?”"

[tracks.bond_musa.chapters.c1.choices.go_down_first]
text = "Wait for the watch to pass, grab the ladder, and go down first."
reply = "I snatched the ladder and climbed down. At the bottom there was a nest of rats and half a clay jar with a broken lip, full of dirt. When I came back up, my hair, eyebrows and lashes were gray with dust. Musa took one look at me, laughed so hard he sat down in the nettles, and leapt up again yelping. “No treasure—but I dug up a dust man!” He beat the dust off my head and said next time I could lead again: “Go down looking like that and even the rats won’t know you.”"

[tracks.bond_musa.chapters.c1.choices.tease_well]
text = "Tease him: last month you swore there was treasure down that well, too."
reply = "“There was something down that well,” he said. “One of my shoes.” He went down the ladder anyway, rummaged around a long while, and came up clutching a copper coin green with corrosion, which he insisted was Roman. I held it up to the sun; the lettering looked like it had been struck in the last few years. He snatched it back and tucked it inside his shirt. “The last few years are ancient history too.”"

[tracks.bond_musa.chapters.c2]
title = "A False Treasure Map"
text = "Musa spent a whole year’s savings on a treasure map. He’d bought it from a one-eyed old beggar in the market, who said it had come out of a Roman general’s tomb. He spread it on my bed, weighed the corners down with two stones, and traced the red line with his finger: out through Bab Ftouh, past two olive trees, turn left, under the third big rock. “See? He even drew the trees.” I held the map up to the window. Through the paper showed a watermark of a little hand, all five fingers clear—new paper, the kind the paper sellers in the market stack by the ream. It was what we used for copying. The grin froze on his face. It stayed frozen a good while before he pulled the map out of my hands and smoothed the creases flat. “The map’s a new copy. The treasure’s old.” Then he added, more quietly, “A whole year’s money.”"

[tracks.bond_musa.chapters.c2.choices.follow_anyway]
text = "Go with him to the end of the map, and pick the seller’s tricks apart on the way."
hint = "He’s already lost face. If I offer to go with him now, he’ll think I’m only coming to watch him look a fool."
reply = "Out past Bab Ftouh there were two olive trees, all right—half a mile apart. I counted the tricks off for him as we went: the red line kept to the graveyards, so nobody would dare dig too hard; and “the third big rock”—the whole hillside was big rocks. At each one he said, “Mm.” The red line ended at a dry well, and on its rim sat the one-eyed beggar with a stack of fresh maps on his knees, telling a water carrier about the Roman general. Musa watched him a long time—then paid for another map and pushed it into my hands. “This one’s prettier. Keep it.”"

[tracks.bond_musa.chapters.c2.choices.get_refund]
text = "Drag him back to the market to find the old beggar and get the money back."
reply = "The old beggar heard us out, looked Musa up and down with his good eye, then counted half the money out of his rags. The other half, he said, was the fee for the lesson—one lesson, one fee. Musa carried his half around the market and came back with two skewers of roast lamb, one for me. He ate with grease running down his chin, then licked his fingers. “Lessons taste pretty good.”"

[tracks.bond_musa.chapters.b1]
title = "The Cellar at Walili"
text = "The new king’s horsemen rode into the city, and a different set of soldiers walked the streets. Musa said there was a cellar in the Roman ruins at Walili, outside the city, and the old men of the guild swore no one had ever been down it. We led a borrowed donkey there for a whole day. The entrance lay under a row of fallen columns: a dozen-odd steps going down, and at the bottom a floor of colored stones, half broken, the picture too big for the lamp to show. I had just raised the lamp toward a jar in the corner when the earth overhead gave way. With one roar the stairway was sealed tight; not even air came through. The lamp was all the light we had, and its oil pot was half empty. At first Musa kept the jokes coming—the Romans buried their gold this deep to hide it from the tax man—and laughed at them himself, the laughter knocking around the stone walls. Then the jokes got shorter, and then he only asked, “How long will it last?” And a little later, again. The wick crackled and the flame shrank. He grabbed my sleeve and held on hard, his voice so small I almost missed it: “I’m afraid of the dark. I always have been.”"

[tracks.bond_musa.chapters.b1.choices.give_the_key]
text = "Put Grandmother’s door key in his hand: it opened a door in Granada; it can open this one."
hint = "Even now he has his pride. Hold out the key and he’ll say, “I’m not cold,” and tuck his hands away."
reply = "The iron key was longer than his palm, its teeth worn round. I told him my grandmother had carried it across the sea; she lost everything on the way except this. Musa held it clenched in his fist the whole night and didn’t make another sound. After the lamp went out, all I could hear was his breathing—one breath, then another, slowly evening out. At daybreak, shovels bit into the earth above us. He pressed the key back into my hand. It was warm, and his palm was soaked with sweat."

[tracks.bond_musa.chapters.b1.choices.worse_joke]
text = "Tell him a joke even worse than his—bad enough to make him laugh."
reply = "“You know why the Romans dug their cellars so deep?” He shook his head. “Because they knew that a thousand years later some kid called Musa would come digging.” He blinked, then burst out laughing. “You’re worse than me!” So we took turns, each joke worse than the last, and kept going even after the wick went out with a hiss. In the dark his voice got slower, then stopped. His head tipped onto my shoulder and he was asleep. I didn’t dare move. I sat like that till morning."

[tracks.bond_musa.chapters.b2]
title = "The Burnt Dinner"
text = "The ones who dug us out at Walili were a few shepherds from outside the city. Musa’s father—the “consul” of the treasure-hunters’ guild—scolded him all winter: for shaming the guild, and for nearly getting himself killed. As soon as the roads dried, Musa wanted to go back down that cellar and show the guild he wasn’t afraid. I stopped him at the city gate. “Are you going after treasure, or after your pride?” He didn’t answer. He kicked a pebble ahead of him, chased it, kicked it again, all the way to the far end of the bridge. I thought he wasn’t coming back. The sun had moved well west by the time he walked back empty-handed, the pebble gone. “Then first we feed those shepherds.” He cooked it himself. He set up a fire in the courtyard and made a big tagine—lamb, dried apricots and onions laid out in neat rows—put the clay lid on, and went to the door to greet the guests. By the time the shepherds were squatting all over the courtyard, black smoke was rising from the bottom of the pot. He lifted the lid, took one look, and put it back. The “consul” stood in the doorway with his arms folded, looking at the pot, then at his son."

[tracks.bond_musa.chapters.b2.choices.eat_first_bite]
text = "Carry the tagine to the table for him and take the first bite myself."
hint = "He still won’t let me see him flustered. He won’t even let me stand near the stove."
reply = "I carried the pot to the table, lifted the lid, and took a heaping spoonful, burnt bits and all. I chewed it slowly and nodded when I was done. The shepherds looked at one another and reached in too. In the end they scraped even the black off the bottom. When they left, the eldest of them clapped Musa on the shoulder. “Next time you go digging, bring us along. We’ll bring the shovels.” Musa said he would, then turned away to clear the bowls. He took a long time over it. His eyes were red."

[tracks.bond_musa.chapters.b2.choices.take_the_blame]
text = "Tell his father that going to Walili was my idea."
reply = "The “consul” glared at me for a long time. I said it again, and added that I was the one holding the lamp down in the cellar. He grunted, turned to go inside, and halfway there looked back. “Then you eat too.” I ate more than anyone. Musa kept scraping the burnt layer from the bottom of the pot into my bowl: a spoonful, a glance at me; I ate a spoonful, and he scraped another."

[tracks.bond_musa.chapters.a1]
title = "Candles Burning till Dawn"
text = "On the night of the Prophet’s Birthday, great candles were carried through the city, each as tall as a man and wrapped in colored paper, from the Andalusian quarter across the river all the way to the Qarawiyyin, to burn till dawn. Musa sat with me just outside the Qarawiyyin’s threshold. Last year on this night his jokes had come one after another, until the old men reciting nearby were frowning at us. I nudged him with my elbow. “Where are tonight’s jokes?” He made a small sound and left it there. Wax ran down the candlestick and set in white ridges along the brass dish. He picked at it with a fingernail, scraped off a little, crumbled it, scraped again. He kept at it a long time. Someone in the crowd led a hymn of praise; one voice sang a line and the whole street answered. When that had passed, he finally spoke, still looking at the wax. “That night at Walili—were you scared?”"

[tracks.bond_musa.chapters.a1.choices.say_afraid]
text = "Say yes, I was—and draw his ice-cold hand into my sleeve."
hint = "He hasn’t even told a joke tonight; one step nearer and he’ll get up and leave. We aren’t close enough yet to sit that near."
reply = "“Yes. When the lamp went out, I was scared too.” I took his hand and tucked it into my sleeve. It was cold as well water. It went stiff in there for a moment, as if to pull away, and then it stayed. The leader sang another line and the whole street answered. Under all that sound he said, very quietly, “Then next time we go down a cellar, we’ll both be scared, and then neither of us will be.”"

[tracks.bond_musa.chapters.a1.choices.walk_behind]
text = "Promise him: from now on, when we dig, I’ll walk behind and keep watch over the light."
hint = "Words like that need a friendship under them. Said now, he’ll take it for one more joke."
reply = "“Then you can’t run off first,” he said. I said that once I had a ship I’d take the cargo and leave the people—and anyone like him, I’d only have to feed. He snorted with laughter, then stopped laughing, his eyes on the tallest candle. “It’s a deal.”"

[tracks.bond_musa.chapters.a1.choices.count_candles]
text = "Count with him how many candles are still burning."
reply = "We counted from the doorway to the corner—one, two—lost count and started over. Near dawn a wind came up off the river, and the candles went out one after another until three were left. Musa rubbed his eyes. “Three’s plenty. That night in the cellar, we had half a pot of oil.”"

[tracks.bond_musa.chapters.a2]
title = "A Hawk That Came Out a Gull"
text = "Musa gave me a wooden bird wrapped in a rag. He cleared his throat before he handed it over. “It was supposed to be a hawk,” he said. “A treasure hunter’s hawk—flies high, sees far, sees whatever’s buried under the ground. Somewhere along the way it turned into this.” It was a gull: short neck, round belly, wings folded back, as if it had just eaten. I set it on the windowsill, a gust came in, and over it went, rolling half a turn. Musa didn’t say a word. He picked it up, took a small knife from his belt, sat on the edge of my bed, and started shaving the base. Chips fell all over the floor. He’d shave a little, stand it on his knee to test it, shave a little more, until the base was as wide and flat as a little cutting board. “Later on, when you’re on a ship”—he stood the gull back on the sill and gave it a push with one finger; it didn’t fall—“the table can rock all it likes. This won’t go over.” He was far more serious carving wood than telling jokes."

[tracks.bond_musa.chapters.a2.choices.keep_the_gull]
text = "Accept the gull and say its name is “Hawk.”"
hint = "Our friendship can’t carry the weight of this bird yet; he won’t trust me with it."
reply = "“How is that a hawk?” he asked. “At heart,” I said. He called that nonsense, loudly, with his face turned away. Later I heard he told everyone he’d given Tariq a hawk. When anyone asked what it looked like, he’d spread his hands to show them—a little wider every time."
effects = [{ }, { }, { }, { title = "A Hawk That Came Out a Gull" }]

[tracks.bond_musa.chapters.a2.choices.hold_his_knife_hand]
text = "Accept the gull, then take the hand he carves with and look at the cuts."
hint = "He’ll give me the bird, but that hand he still won’t let anyone see—and what I feel isn’t big enough yet to dare reach for it."
reply = "There were three fresh cuts on his fingers, one not yet scabbed. I held his hand and looked, and he didn’t pull it back or say anything; he just let me look. Outside the window someone was crying mint for sale, twice. Only when the cry had faded down the street did he speak, very softly. “Hawks are much harder to carve than gulls.”"
effects = [{ }, { }, { }, { title = "A Hawk That Came Out a Gull" }, { }]

[tracks.bond_musa.chapters.a2.choices.ask_another]
text = "Tell him it looks like a gull, and ask him to carve a real hawk."
reply = "He glared at me and went off with his knife. Two weeks later he turned up with another rag bundle. The new one had a long neck, a tall comb, and two grains of rice carved under its feet. I looked at it a long time and said it was a chicken. He looked at it a long time too, didn’t argue, and set the chicken next to the gull on my windowsill. “Now you’ve got a whole shipload of birds.”"

[tracks.bond_musa.chapters.s]
title = "Half the Gold"
text = "At the end of the year I was going back to Algiers. The captains had promised me a small ship of my own come spring; Musa was staying in Fez to hunt treasure with the guild. When he came to see me off he had a new ledger under his arm—leather cover, stitched spine, pages blindingly white. He opened it to the first page. It was in his hand, every stroke set down with unusual care: “Gold dug up—half goes to Tariq.” “That’s it? One line?” “One line. It’s a new ledger. You have to go easy on the ink.” He turned the book around to face me. “What about you? How do we count whatever you take?” I swung my oud onto my back. “I take cargo, never people.” “Then if there are books in the cargo,” he said, “half are mine. Roman books are sure to say where the gold is buried.” He held out the pen. The ink on the nib was nearly dry, so he dipped it again."

[tracks.bond_musa.chapters.s.choices.promise]
text = "Sign the ledger: half the gold, half the books—both count."
hint = "This entry is meant to stand for life. Our friendship can’t hold it yet—or else I’ve already promised a lifetime to someone else."
reply = "I signed under his line, then wrote another beside it—“Books taken: half go to Musa”—and signed that too. Musa blew the ink dry and read it once, then again, as if checking a treasure map of doubtful origin. Then he closed the ledger, tucked it under his arm, and towed me across the market and into the courtyard of the treasure-hunters’ guild. An iron-bound cupboard was set into the wall of the main room, and the key hung from his father’s belt. He woke his father from his nap, opened the cupboard, and laid the ledger at the very back, on top of a pile of yellowed old deeds. The “consul” rubbed his eyes and asked what it was. “Accounts,” said Musa. “I mean to keep these for the rest of my life.” His father’s eyes went from his son’s face to mine and back; he asked nothing more and locked the cupboard."
effects = [{ }, { }, { title = "Half the Gold" }, { }, { }, { }]

[tracks.bond_musa.chapters.s.choices.heart]
text = "Tell him: half the gold for me—and the other half, I want that too."
hint = "The other half—I open my mouth and don’t ask for it. My heart’s ledger hasn’t reached that page yet—or I’ve already signed that page over to someone else."
reply = "He froze. The pen was still in my hand; a drop of ink fell on the page and spread into a small black dot. He opened his mouth, then shut it. His ears went red from the lobes up, a little at a time, to the tips. After a while he pulled the ledger out of my hands, shut it, and held it to his chest. “That’ll have to wait till I’ve dug it up.” A pause. “Till we’re both grown up.” The morning I left the city he came and stood beside the mule train with nothing in his hands. The muleteer called twice. All at once he stepped forward and hugged me, hard, his chin knocking against my shoulder. Then he let go, took a step back, and didn’t tell a single joke. When the mules were through the city gate I looked back. He was still standing there, both hands tucked into his sleeves."
effects = [{ }, { }, { }, { }, { title = "Half the Gold" }, { }, { }]

[tracks.bond_musa.chapters.s.choices.own]
text = "Bet him: whoever gets rich first wins; the loser feeds every beggar in Fez."
reply = "“Every beggar in Fez?” He slapped the ledger down on the table. “You’ll go bankrupt. My father says Fez has more beggars than the mosques have pigeons.” “Then you’d better get rich first.” “The day I dig up gold, the first thing I do is go to Algiers and watch you pay.” We clapped hands so loudly the cat outside shot up onto the roof. He turned to the second page, wrote out the bet, then added a line in small letters, licked the nib, and read it to me: “Including the one who sold me the fake map.” I said that one-eyed old man might well be richer than both of us. He thought about it and went over the line again, darker. “Then he eats first. Once he’s full, he can sell me another map.”"

[tracks.reunion_musa]
name = "Musa: Dinner Outside the Cellar"

[tracks.reunion_musa.chapters.reunion]
title = "Dinner Outside the Cellar"
text = "In 1561 I came back to Fez, after two days jolting on a mule. Musa had laid out a meal at the mouth of a newly opened cellar outside the city: a felt rug spread over the rubble, a pot of tagine, a stack of flatbread, a few clay bowls, and the handful of men who dug with him gathered around. “Sit,” he said. “This time nobody has to fall in first before they’ll sit down.” Over the years he’d found a few things: a bronze lamp, half of an inscribed stone, a little jar of coins no one could date. None of it had made him one of the rich men of the stories. But he would joke about his failures now—the three days he spent waiting at the bottom of a well, and what finally came down to him was a sheep. Every time he brought a find back to the city, he said, the first thing he did was take it to the mellah in the new city and have the goldsmith’s shop look it over. “Real gold or false, those eyes can tell at a glance.” The ledger lay on the felt, its corners worn soft. Under that first line on the first page was a line I had never seen: “Owed for now.” He said he’d added it the day I left the city."

[tracks.reunion_musa.chapters.reunion.variants.with_yaqub]
text = "In 1561 I came back to Fez, after two days jolting on a mule. Musa had laid out a meal at the mouth of a newly opened cellar outside the city: a felt rug spread over the rubble, a pot of tagine, a stack of flatbread, a few clay bowls, and the handful of men who dug with him gathered around. “Sit,” he said. “This time nobody has to fall in first before they’ll sit down.” Over the years he’d found a few things: a bronze lamp, half of an inscribed stone, a little jar of coins no one could date. None of it had made him one of the rich men of the stories. But he would joke about his failures now—the three days he spent waiting at the bottom of a well, and what finally came down to him was a sheep. Every time he brought a find back to the city, he said, the first thing he did was take it to the mellah in the new city and have the goldsmith’s shop look it over. “Real gold or false, those eyes can tell at a glance.” One more bowl had been set out on the felt, and nobody sat at it. I asked who it was for, and he jerked his chin toward the city. “The one from the goldsmith’s shop. He’ll come when he’s shut up for the day.” The ledger lay beside the bowls; on the first page was a new line: “Owed for now.” He said he’d added it the day I left the city."

[tracks.reunion_musa.chapters.reunion.default]
effects = [{ text = "Tariq, you didn’t come. I laid out a meal at the mouth of that cellar outside the city. The tagine stewed all afternoon and this time it didn’t burn—ask the men if you don’t believe me. They ate every scrap, your share included. I haven’t dug up much these past years: a bronze lamp, half a stone, a jar of coins. The lamp I kept. The stone I sold to a scholar from Rabat, who said the writing was about a Roman fixing up his mother’s tomb. I listened a long time and never heard where the gold was buried. The coin in this letter I dug up at Walili this spring, twenty paces east of that old cellar. I took it to the goldsmith’s in the mellah: it’s real, it’s Roman, it’s more than a thousand years old. It’s worth nothing—the goldsmith says melt it down and you wouldn’t get a ring out of it. But it’s real. See? I finally dug up something real, and half of it is yours. A coin won’t split, so you get the whole thing. My half is owed for now. The ledger’s still here. I haven’t crossed out that line on the first page. If you hear of books anywhere at sea, remember half are mine. Next time you come to Fez, send word ahead, and I’ll fill the lamps. —Musa" }, { }]

[tracks.reunion_musa.chapters.reunion.choices.friend]
text = "Sit down, finish the meal, and change “Owed for now” in the ledger to “Owed forever.”"
reply = "We ate from late afternoon until dark, and the men lit torches. Musa mopped up the last of the sauce with a piece of bread and started telling them about the gull—and somewhere in the telling the gull became a hawk, and the hawk could talk, and it had shown us the way in the cellar at Walili. Everyone around the rug rocked with laughter, and not one of them believed a word. I took the ledger and, by torchlight, struck out “Owed for now” and wrote “Owed forever” beside it. He leaned over to look, grabbed for the pen, missed, and signed his name underneath instead, crooked as anything. When the party broke up he walked me to the city gate, tucked the ledger back inside his shirt, and patted it. “Partners in crime for life. No backing out.”"
effects = [{ }, { }, { }, { title = "Dinner Outside the Cellar" }]

[tracks.reunion_musa.chapters.reunion.choices.rival]
text = "Dig up the old bet: within five years, see who finds real gold first."
reply = "“You don’t even dig,” he said, still chewing his bread. “Taking ships counts as digging,” I said. “The sea’s just ground that got wet.” He sprayed a mouthful of soup across half the rug, and the men jumped out of the way. When he’d finished laughing he wiped his mouth, turned to a fresh page in the ledger, and wrote “Five years’ limit.” Underneath he drew two lines, one for me and one for him. “Whoever finds it first draws a circle on his own line.” The next day, before dawn, he set off with the rope ladder on his shoulder—south into the mountains, they said, looking for an old city that not even the guild’s old men could place. Before he left he sent word to me: “Save that circle for me.”"
effects = [{ }, { }, { }, { title = "Dinner Outside the Cellar" }]

[tracks.reunion_musa.chapters.reunion.choices.love]
text = "After the meal, don’t go back to the city—go down the cellar with him."
hint = "That line—“owed for now”—is still open in the ledger. Back then I never asked for the other half, and after all these years I still can’t."
reply = "The men drifted off and he said nothing about going back to the city. He lit a lamp and handed it to me, then lit another for himself. Two lamps, both oil pots full—he shook his so I could hear. The cellar wasn’t deep, a dozen-odd steps, and at the bottom a wall of colored stones made the picture of a fish with a piece of its tail missing. He held up his lamp to look at the fish; I held up mine to look at him. “That night,” he said, “all I could think was, if I ever get out, I’m never going down again.” “And then?” “And then every time I went down, I brought two lamps. One for me, and one saved.” He turned around, the light swaying across his face. Then he came over and kissed me; his lips still tasted of dried apricots. The two lamps sat at our feet, their flames perfectly still. He drew back a little and smiled. “I’m not afraid of the dark this time.”"
effects = [{ }, { }, { }, { title = "Dinner Outside the Cellar" }]
