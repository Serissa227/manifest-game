# C7 重写：bond_elene_urruti 的英文显示覆盖（嵌套表写法，按轨道、章节、选项与变体的 key 对应）；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 口头禅的英文与 tie_extra_02_amaia_elene_urruti 一致：“Wash the wound. Save the swagger for dry land.”（原句只在 B2 正文出现一次）。

[tracks.bond_elene_urruti]
name = "Elene: Read the Sky First"

[tracks.bond_elene_urruti.chapters.c1]
title = "Read the Sky First"
text = "The dew was still wet on the hillside outside town. Elene didn’t stoop to pick anything. She stood at the top of the slope and looked at the sky for a long while. “Clouds coming in off the sea.” She set her basket down. “Rain this afternoon. Pick the ones that spoil first, and spread them out once they’re picked.” I looked up. The sky was a pale, washed blue, with only a gray seam hanging over the river mouth. I said clouds that far off wouldn’t get here before dark. She ignored me, pinched off a plantain leaf and held it under my nose. A bead of water sat in the groove of the vein. “Stuff that in a basket and by tonight it’s black.” Then she tipped her own basket out onto a flat stone and laid the leaves out one by one, like fish set to dry. My basket was already heaped over the rim, wet and dry crammed in together. She glanced at it and her mouth twisted. “Are you gathering herbs or pickling cabbage?”"
news = "A sudden rain hit the hills outside Bilbao one afternoon and half the students’ herb baskets went black. Only the harpooner’s girl had spread her leaves on the rocks that morning."

[tracks.bond_elene_urruti.chapters.c1.choices.follow_hill]
text = "Walk the slope with her and write down every sign she reads in the sky."
reply = "Every few steps she stopped and pointed. Gulls flying up the river. The far hills turning blue. A smell of fish on the wind. “Two out of three, and you pack up.” I crouched by a rock and wrote each one down. She leaned over to look. “Handwriting like that, one shower and you won’t be able to read it yourself.” The rain came down that afternoon, right on time. Everything I tipped out of my basket had gone black. Hers had gone into a dry cloth before the first drop fell."

[tracks.bond_elene_urruti.chapters.c1.choices.bet_rain]
text = "Bet her that not a single drop falls today."
reply = "Her eyes lit up. “Loser carries the winner’s basket for a month.” The rain crashed down after noon, and we squeezed under an oak for the best part of an hour while my basket of leaves went slowly black at my feet. From the next day on I carried her basket. Every day there was one more stone at the bottom. I asked what the stones were for. “Ballast,” she said. “So it doesn’t feel too light and you forget how you lost.”"

[tracks.bond_elene_urruti.chapters.c2]
title = "A Bundle for Her Father"
text = "Men on the quay were rolling empty casks aboard; in a few days the whalers would sail for Newfoundland. Elene squatted by a bollard with a square of oilcloth across her knees, packing remedies into it one by one: vinegar for washing wounds, powder to stop bleeding, chilblain salve, and at the very bottom a small packet for seasickness. Her father, a harpooner, stood on the gangplank arguing with someone about rope and never once looked her way. Amaia from the tavern’s back room came by with a basket on her arm. She stopped, looked, and without a word pulled the bottom packet out and swapped it with the top one. “What gets used first goes on top. Nobody on a ship has time to dig.” Elene went red to the ears. “Seasickness isn’t even an illness! Washing wounds is what matters!” “A man who’s been sick for three days can’t hold a harpoon.” Amaia was already walking off. Elene glared at the packet and muttered, “It’s not you going to sea.” But her hands unwrapped the oilcloth and packed it all again from the start."
news = "The Bilbao whalers have sailed for Newfoundland. On the jetty the harpooner Urruti’s daughter pressed a bundle of remedies on her father, wrapped in oilcloth neater than anyone else’s."

[tracks.bond_elene_urruti.chapters.c2.choices.sort_bundle]
text = "Help her repack it: what gets used first, what comes later, what’s for last."
hint = "She hugs the oilcloth bundle to her chest and won’t let you touch it. You don’t know each other that well yet."
reply = "We unwrapped it and tied it up again, three times over. When the third was done, Amaia looked over from the tavern door and gave one nod. Elene pretended not to see and pulled the knot tight enough to strangle. The day the ship left, she pushed the bundle into her father’s arms. “Wash the wound, and don’t—” The shanty started up and the wind took the rest. She stood at the end of the jetty until the sail was a white speck, and only then turned back."

[tracks.bond_elene_urruti.chapters.c2.choices.ask_amaia]
text = "Ask her who Amaia is to her."
reply = "“I call her Aunt. She isn’t, really.” She folded a corner of the oilcloth in and pressed it flat. “Half the street calls her a witch. And half the street’s been stitched up by her.” Her voice dropped as she said it, though her eyes stayed on the lane Amaia had gone down. A moment later she added, “Don’t go telling people I call her Aunt.”"

[tracks.bond_elene_urruti.chapters.b1]
title = "Whose Harvest Kept"
text = "This time the school’s trial was gathering herbs. The old sailor who taught us plants hung a steelyard from the lintel of the storehouse door. As each basket went on the hook he slid the weight out notch by notch and scored the count on the wall in charcoal. My basket went up and the weight ran out to the very end. Elene’s weighed barely half as much, and someone at the back laughed out loud. Ten days later we compared them dried. The old sailor tipped each pile onto a board and stirred it with a finger. Half of mine had crumbled, like stove ash between the fingers. Not one of hers had broken, and the edges were still curled. He thought for a moment, then started a second line on the wall and kept the two apart: by weight, me first; by quality, her first. “So who won?” somebody asked. “Both are true. Pick one.” Afterward Elene drifted over under the steelyard, pretending to read its marks, her eyes sliding my way. “That slope of yours. Where is it?” I’d been just about to ask her: “How do you dry your leaves?”"
news = "The whaling school at Bilbao held an herb-gathering trial with a steelyard hung over the storehouse door. First by weight and first by quality went to two different students, and the old sailor chalked them up on two separate lines."

[tracks.bond_elene_urruti.chapters.b1.choices.learn_drying]
text = "Ask her to teach you to dry them first. The slope can wait."
reply = "Spread them thin, she said, turn them three times a day, and throw a coarse cloth over them when the sun gets too fierce. “Don’t think drier is better. Dry them brittle and you’ve got kindling.” I did as she said, and when I tipped the next batch onto the board, not one leaf had broken. She picked one up and held it to the light. “You learn fast, I’ll give you that.” She put it down. “Don’t get cocky. Your slope’s still better.”"

[tracks.bond_elene_urruti.chapters.b1.choices.trade_slope]
text = "Trade her the slope’s location for her drying method."
reply = "“Done.” She slapped my palm. Next morning she was up that slope before it was light, and came back with her basket heaped. She wrote the drying method on a scrap of paper for me, the words packed tight. I turned it over. The back carried half a bill of goods: “Dried cod, twelve bundles.” She flipped it straight back. “Read the front.”"

[tracks.bond_elene_urruti.chapters.b2]
title = "A Book Sewn from Old Ledgers"
text = "The Newfoundland ships came home in the first cold rain of winter. Men came down the gangplanks with ten fingers frozen purple, or with arms ringed over and over where the harpoon line had chewed the flesh. Elene set up a wooden tub at the head of the jetty and held them down one at a time to wash. One sailor pulled his arm back. A fistful of salt would do, he said, never mind the washing. “Wash the wound. Save the swagger for dry land.” She didn’t look up, just pushed his arm back into the tub. With no hand free, she shoved her herbal at me. “Find the page on frostbite. Read it out.” The stitching had long since worked loose, and pages slid out as soon as I turned one. I picked one up. On the back was a merchant house’s hand from the quay: “Iron, forty bars, delivered.” I turned another. Another bill of goods, the ink dark and faded by turns, years of old accounts. Every leaf she had drawn and every remedy she had written was squeezed onto the back of someone else’s books. Before I could read a word, the book was snatched away. “Don’t look.” She pressed it to her chest, her wet hands soaking the paper. “Can’t even read out a remedy properly.”"
news = "The Bilbao whalers are home from Newfoundland, and the frostbitten and rope-torn lined half the jetty. The harpooner’s girl set out a wooden tub and held them down one by one to wash their wounds."

[tracks.bond_elene_urruti.chapters.b2.choices.rebind]
text = "Borrow an old leather cover from the school’s countinghouse and rebind her book overnight."
hint = "She stuffs the book inside her coat and holds it there. She doesn’t trust you enough yet to let you touch it."
reply = "The countinghouse’s old cover had an ink stain on it, and I spent half the night scraping it off with a knife. I lined up the loose pages by her own numbering and sewed them back in with sail twine. Next day I gave the book back with nothing written on the cover. She leafed through it from front to back. Not a page missing. Then she put her face down into it and kept it there a long time. “Next time, don’t go messing with my things.” Her voice came out muffled by the paper. For six years after that, the book in her hands always wore that leather."

[tracks.bond_elene_urruti.chapters.b2.choices.buy_paper]
text = "Buy her a quire of fresh paper at the merchant house."
reply = "She took it and weighed it in her hand, but didn’t untie it. “I’m keeping the new stuff.” She wanted to write a wound book for ship crews, she said, big letters and short sentences. “Something like that needs clean paper. So nobody turns it over and reads who owes how many barrels of oil first.” Her herbal stayed on the old paper. I asked why. She tucked it inside her coat. “The old one has bills on the back. Keeps me warm in winter.”"

[tracks.bond_elene_urruti.chapters.a1]
title = "While Her Aunt Was Away"
text = "Amaia had gone, on a ship carrying iron to Venice. All she left behind was one instruction, “You do the spring medicine chest,” and when Elene asked when she’d be back, she said she didn’t know. The chest for this year’s first ship to Newfoundland sat on the table in the tavern’s back room, a list nailed inside the lid. Elene packed it one packet at a time, twice as fast as I could have, and when she was done she didn’t shut the lid. She took the list down and pushed it across to me. “You read, I answer. Read one, ask one.” “You could pack this with your eyes shut. What do you need me for?” She bent her head and trimmed the lamp wick. “You ask about the things you don’t understand.” After a while she added, “I don’t dare ask anything anymore. Ask, and there’s nobody to answer.”"
news = "The herbalist from the back room of a Bilbao tavern has gone to Venice on an iron ship. The medicine chest for this spring’s first ship to Newfoundland was packed by her pupil alone."

[tracks.bond_elene_urruti.chapters.a1.choices.quiz_her]
text = "Quiz her down the list, item by item, and ask about everything."
reply = "I read from the top. Vinegar for washing wounds, how many bottles. Chilblain salve, how many pots. Needles, how many, and which thread. She didn’t miss one, and answered faster than I could read. At the last line, “for seasickness,” she got it right, and her eyes went red for a moment. She wiped them straight off. “It’s nothing. The wind.” The back-room window was shut. She folded the list in four and laid it on top of everything in the chest. “When Aunt comes back, this is the first thing she reads.”"

[tracks.bond_elene_urruti.chapters.a1.choices.lamp_till_out]
text = "Sit by the chest with her and check it until the lamp runs dry."
hint = "Right now she only wants to be alone. You’re not close enough yet to sit with her that long."
reply = "We went through every packet, and when we were done we started over. The wick burned shorter and shorter until it went out with a little puff. She didn’t get up. “I can tell them in the dark.” She reached into the chest. “Chilblain salve. Needles. Vinegar…” She named them one by one and got every one right. We sat there in the dark like that, her shoulder against mine, and she didn’t move it away."

[tracks.bond_elene_urruti.chapters.a2]
title = "The Linen Handkerchief"
text = "In the autumn Elene slapped a linen handkerchief down on my desk, folded into a narrow strip with all four corners tucked inside. “The way they fold them on whalers. Pinch this corner and it pulls straight open. Just long enough to bind an arm.” She showed me. The cloth whipped open, and in three quick moves she had it folded again. “Your turn.” I folded it five times and it fell apart five times. She stood beside me clicking her tongue, and at last she pinned my hand down. “Leave out one fold. When people panic, the more folds there are, the less it opens.” At the corner of the desk lay her wound book, clean paper, the letters written large. I asked where she’d bought the handkerchief. I wanted a couple more. “You can’t buy them.” She drew it back toward her a little. “I’ve used it three years. Washed it a hundred times. I hemmed the edges myself.”"
news = "Folding handkerchiefs is all the rage at the Bilbao whaling school this autumn. A ship’s fold, they say, one pull and it’s a bandage. The one teaching it is the harpooner’s girl, and she has a tongue on her."

[tracks.bond_elene_urruti.chapters.a2.choices.learn_fold]
text = "Practice her fold over and over until one pull opens it."
hint = "She can’t bring herself to put this handkerchief in your hands yet. You’re not close enough."
reply = "On the seventh try I pinched the corner and pulled, and the whole cloth fell open across the desk. She gave one nod, folded it again and pushed it into my hand. “It’s yours. Once you’re at sea, it’s for binding wounds. Don’t go wiping sweat with it.” I asked what I was supposed to wipe sweat with, then. “Your sleeve,” she said. “Show-offs always use their sleeves.”"
effects = [{}, {}, {}, { title = "The Linen Handkerchief" }]

[tracks.bond_elene_urruti.chapters.a2.choices.fold_together]
text = "Each take two corners and fold the handkerchief together."
hint = "Reach for it now and she’ll only call you clumsy. Not close enough yet."
reply = "She held two corners and I held two, and we folded toward the middle. Our fingers bumped several times, and every time she said “Concentrate,” though her own ears went red first. When it was done she pressed the narrow strip into my palm and held it there a good while before letting go. “Hang on to it. If it comes apart, I’m not folding it twice.”"
effects = [{}, {}, {}, {}, { title = "The Linen Handkerchief" }]

[tracks.bond_elene_urruti.chapters.a2.choices.ask_manual]
text = "Ask her what page her wound book has reached."
reply = "“Page twelve. Frostbite.” She folded the handkerchief, tucked it back up her sleeve, grabbed the book and read it out at a gallop: fingers frozen white are never held to the fire; put them inside your shirt and warm them slowly. She glared at me. “Follow that?” I said “warm them slowly” didn’t say for how long. She took up her pen and added half a line on the spot: “Until the fingers move.”"

[tracks.bond_elene_urruti.chapters.s]
title = "Wash the Wound"
text = "In December the school’s storehouse was cleared out, and the steelyard came down off the lintel. In spring I was to sail on a whaler for Newfoundland. The owner had come last month to call the roll, and my name was third from the bottom. Elene was staying in Bilbao. The table by the window in the tavern’s back room was hers now, drying sieves stacked at one end and the wound book open at the other, past page twenty. “Of every ten men who come back from Newfoundland, three can’t tell you where it hurts.” She dipped her pen and didn’t look at me. “If they can’t tell it, I can’t write it right. If I write it wrong, the next ship treats by it and makes it worse.” She finished a line and laid down the pen. From the drawer she took a small packet of remedies wrapped in oilcloth, the knot square and tight, and pushed it across to me. Then she kept one finger on it and didn’t let go. “Before spring comes, if you’ve got anything to say, say it now.”"
news = "The Bilbao whaling school broke up in December, and the steelyard came down off the storehouse door. The harpooner’s girl isn’t going to sea. She’s staying in the tavern’s back room to write a wound book for sailors."

[tracks.bond_elene_urruti.chapters.s.choices.promise]
text = "Promise to find her on the quay first every time you’re back, and tell her each injury."
hint = "She changes the subject. You haven’t come far enough together for a promise like this. Or else the one promise you get in a lifetime is already given to someone else."
reply = "“Tell it straight.” She lifted her finger off the packet. “Which hand, which finger, how many days frozen, did it blister. Don’t tell me stories. Sailors add a third to every wound.” I said my memory was bad, and I’d forget half by the time I got back. She opened the wound book to its first page, which she had never written on, dipped her pen, and wrote my name. Beside it she added: the one who tells the wounds. “Now you can’t wriggle out of it.” She turned the book around to show me, the ink still wet. “Any trip you don’t come to the quay first, I cross your name out.” I tucked the packet inside my coat. At the door I looked back. She had already bent over the page again, her pen scratching away, writing the next one."
effects = [{}, {}, {}, {}, {}, { title = "Wash the Wound" }, {}]

[tracks.bond_elene_urruti.chapters.s.choices.heart]
text = "Tell her that the day you come back, she’s the first one on the quay you want to see."
hint = "Her finger is still pressed on the packet, and you can’t get the words out. You haven’t come that far, or your one promise of a lifetime has already gone to someone else."
reply = "The tip of her pen stabbed a blot into the page. “Then don’t go getting yourself hurt.” She glared at me, got up, came around the table and tied the packet to my belt. She tied it too tight, tight enough that I sucked in a breath. She undid it and tied it again. Her hands were shaking the second time, and it took her two tries to make the knot. “I’ll hold on to that for now.” Her head was down. “When you’re back from Newfoundland, when we’re both grown, you say it again. Then I’ll answer.” When it was tied her hand didn’t come away at once. She pressed on the knot, as if testing whether it would hold. I looked down at it. The same knot she tied on every packet, square and neat. She gave me a shove toward the door. “Go on. Don’t come hanging around before spring. I’ve got a book to finish.”"
effects = [{}, {}, {}, {}, {}, { title = "Wash the Wound" }, {}]

[tracks.bond_elene_urruti.chapters.s.choices.own]
text = "Go separate ways: she writes her book, you take your ship, and nobody waits on anybody."
reply = "She thought about it, then nodded. “That’s best. Whoever’s waiting reads the sky wrong. So busy watching for a sail that the storm’s right overhead and they still call it fair.” “You take your ship, I’ll write my book.” She dipped her pen again. “The year you lose a finger to the cold out there, I’ll write another page about it. Then at least you won’t have frozen it for nothing.” She stuffed the packet into my bag, under all my clothes at the very bottom, and patted it twice. “Best if you never need it.” While she was at it she untied the cord on my bag and tied it again, far tighter than I ever had. She didn’t walk me to the door. From inside the back room she just called out, “Read the sky first, come spring!” Then the shutter by the window swung closed."
effects = [{}, {}, {}, { title = "Wash the Wound" }, {}]

[tracks.reunion_elene_urruti]
name = "Elene: Under the Eaves in Bad Weather"

[tracks.reunion_elene_urruti.chapters.reunion]
title = "Under the Eaves in Bad Weather"
text = "It had rained in Bilbao for three days. When I tracked her down on the quay, Elene was under the eaves rescuing herb baskets, dragging them in one after another, water streaming from their bottoms. She saw me, jerked her chin by way of hello, and kept going. “Don’t just stand there. Grab one.” Only when all seven baskets were in did she straighten up, shake the water off her hands and look me up and down. “Arms, legs, all there. Good.” People passing on the quay nodded to her. A young man from a cooper’s family ran up for a packet of remedies. She told him how to use it once; he got three steps away and she called him back and told him again; the third time she shouted it through the rain. On a crate under the eaves lay the wound book, many times thicker now, written up to page eighty. She dried her hands and turned to the page on frostbite. The remedy there had been copied from her old herbal. It was the one she’d told me to read out on the jetty, years ago, that I never managed to get out. Now the sentences were cut short, short as a sea shanty, and in the margin was a line of small writing: reader stumbled, cut it shorter."
news = "Three days of rain in Bilbao, and Elene the herbalist hauled every basket on the quay in under the eaves. They say that wound book she writes for sailors is up to page eighty."

[tracks.reunion_elene_urruti.chapters.reunion.default]
effects = [{ text = "The rains are back. I can drag the baskets in under the eaves by myself, I don’t need you for that. The wound book is up to page eighty. I rewrote the frostbite page, the one I told you to read out on the jetty that winter and you never got out. It’s short enough now to shout like a shanty. If you’re still at sea, next time you make port come to the quay first and read it out to me. Whether it runs smooth, you can be the judge. One more thing. If you’ve picked up a cut, wash it first. Don’t wait till you’re ashore to remember. —Elene" }, {}]

[tracks.reunion_elene_urruti.chapters.reunion.choices.add_chapter]
text = "Sit down with her and add the injuries you’ve seen at sea these years to the wound book."
reply = "We wrote under the eaves until the rain stopped. I talked and she wrote, and halfway through anything she would rap the crate with her pen. “Which hand? How many days frozen? Don’t dress it up.” How the ice at Red Bay turned a man’s toes black, from which angle a harpoon line whips round to do the worst damage: she wanted every detail of it, then cut each one down to three sentences. When the rain stopped a few old sailors came along the quay. She read them the new pages straight through without a single stumble. An old man missing two fingers heard her through and drew on his pipe. “Clearer than the priest.” She shut the book, then opened it again to the last page, where she had signed it, and beside her own name she wrote mine. “From now on, when you’re back in port, come here first.” She put down the pen. “Tell the wounds straight, and your name stays on the page.”"
effects = [{}, {}, {}, { title = "Under the Eaves in Bad Weather" }]

[tracks.reunion_elene_urruti.chapters.reunion.choices.stay_ashore]
text = "Tell her you’re not shipping out this season."
hint = "That winter you never got that far. Say it out of nowhere now and she’ll think you’ve been drinking."
reply = "She was wringing out a basket, and her hands stopped. “Don’t you go showing off.” “You’re the one who said the swagger waits for dry land,” I said. “Well, this time I’m on dry land.” She froze, one hand still gripping the basket’s rim, water dripping from the herbs inside. She looked at me. Her mouth opened and closed, and then she laughed out loud, laughed until her shoulders shook, rain running down out of her hair. She stepped in and leaned her wet forehead against my shoulder and kept it there a long while. “Then stay.” Her voice was muffled in my coat. “What you said that December, I told you I’d answer when we were grown. There. That’s my answer.” Outside the eaves the rain kept coming. She didn’t lift her head. She felt for my hand, found it, and held on."
effects = [{}, {}, {}, { title = "Under the Eaves in Bad Weather" }]

[tracks.reunion_elene_urruti.chapters.reunion.variants.promise]
text = "It had rained in Bilbao for three days. When I tracked her down on the quay, Elene was under the eaves rescuing herb baskets, dragging them in one after another, water streaming from their bottoms. She saw me, jerked her chin, and kept going. “Don’t just stand there. Grab one.” Only when all seven were in did she straighten up and look me over. “Arms, legs, all there. Good.” A young man from a cooper’s family ran up for a packet of remedies. She told him how to use it once; he got three steps away and she called him back and told him again; the third time she shouted it through the rain. On a crate under the eaves lay the wound book, written up to page eighty. She didn’t turn to frostbite first. She opened it to the first page. My name was still there, and beside it “the one who tells the wounds,” faded now to brown. Further in, every few pages, came a small note giving the year and the voyage, and that I was the one who told it. The frostbite page had the most notes of all, crowding the margins. “Yours.” She tapped them with a fingernail. “You got two things wrong. I fixed them.”"
