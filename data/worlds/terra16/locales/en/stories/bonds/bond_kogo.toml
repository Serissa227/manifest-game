# 小督：替人写的字（bond_kogo）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段；effects 数组保留下标。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上、又新加了选项与变体，照“缺译回退中文”（整章未译可回退）整章删掉，待照新中文重译：bond_kogo.b1、bond_kogo.b2、bond_kogo.s。重逢一章是轨道里唯一的一章，删了就不算“整章未译”，所以保留，只补新加的变体与选项、改掉与新中文对不上的几条（见各条上方注释）。
# C7 重写，2026-10-12，Claude（Opus），与中文稿同一轮写完。专名：Kogo、Mio、Ayame、Tosa、Kyoto、Funai、Bungo、Urado、Hōkyō-ji、The Tales of Ise。
# 口头禅照人物卡的英文写作 “I’ll write the words. Keep the feelings for yourself.”，只在 c1 出现一次；女房词用罗马字（ohiya、odai、himoji），英文里不出现汉字与假名。

[tracks.bond_kogo]
name = "Kogo: Words Written for Others"

[tracks.bond_kogo.chapters.c1]
title = "A Poem Beside the Rice Sack"
text = "The rice dealer’s boy is already putting up the shutters. I came to settle our quarters’ rice account for the month, and only once the sums are done do I notice a girl in court dress crouched in the corner, one hand pressed flat on a rice sack. Under the sack lies a sheet of thin paper folded into a strip; the corner that shows is flowing kana, fine as rain off the eaves. “Are you buying or not?” the boy asks her for the third time. “Waiting for someone.” Her voice is low and quick. I lean in to look at the corner of writing. Her eyes go to my sleeve first, rest there a moment, and only then come up. “One poem, three measures of rice,” she says. “Looking costs too.” The old man outside the rice shop who writes letters for hire charges a measure and a half; she’s quoting double. She watches me as if waiting for me to drag my family name out and beat her down with it. I ask who the poem is for. She tucks the corner another half inch under the sack. “I’ll write the words. Keep the feelings for yourself.” The boy lifts the last shutter."

[tracks.bond_kogo.chapters.c1.choices.buy_it]
text = "Pay her price for the poem, and say I can’t read that flowing kana and want to watch her write it."
reply = "I count out the coins and stack them on the sack. She takes them, then her hand stops in midair. “People who buy poems never ask how they’re written.” She begs a scrap of rice wrapping from the boy, wets her brush evenly on the inkstone, and writes a line in front of me without once lifting it. Only then does she point: that one is ‘a,’ worn down from the character for peace. The ink is still wet when she presses it into my hand, then slides the sheet from under the sack and lays it on top. “Two for the price of one. Hold them flat. Don’t fold.”"

[tracks.bond_kogo.chapters.c1.choices.haggle]
text = "Haggle the way they keep accounts on ship, knocking her down one measure at a time."
reply = "I count it out on my fingers: paper, ink, her time crouching here, less a deduction for the buyer’s bad luck in not showing up. She keeps a straight face at first and gives ground a measure at a time. At a measure and a half she bursts out laughing and claps her sleeve over her mouth. “What princess haggles like this?” “One who learned it from a ship’s purser.” She knocks off a little more. “One measure. On condition you never saw me here.” I say done. She draws the poem out from under the sack and hands it over, and her finger stays on the corner a moment longer before she lets go."

[tracks.bond_kogo.chapters.c2]
title = "The Court Women’s Words"
text = "I don’t report her. Half a month later I catch her in the long gallery between two sets of quarters and ask her to teach me the court women’s words. She glances down both ends of the gallery before she lowers her voice. Water isn’t water, it’s ohiya. Rice is odai. When you’re hungry you never say hungry; you say himoji. I repeat each one after her. At the seventh she stops, and her brush leaves a dot of ink on the paper. “People outside laugh about these,” she says. “They say the palace women don’t even dare call water water. Why do you want them?” I say ships have their own cant too, and if you can’t follow it you don’t get aboard. Then I say himoji back to her and it comes out himeji. She blinks, then laughs so hard she folds over the paper, and her brush tip mashes flat against it like a little broom. “Himeji! You’re hungry, so you’re off to Harima?”"

[tracks.bond_kogo.chapters.c2.choices.learn_all]
text = "Write every word she teaches me on my pocket paper, and say them until she nods."
hint = "She waves it off: those are kitchen words, not worth writing down. You aren’t close enough yet for her to drop that worry."
reply = "We study until the lamp oil runs dry. She trims the splayed brush with a little knife while I cup my hands underneath to catch the clippings, and not one hair falls in the inkstone. When it’s done she tries a stroke and says, out of nowhere, “You’re the first one from up there who ever wanted to learn these.” I tell her I’m not from up there, I’m from Tosa. She gives me a look, adds one more word at the bottom of my paper, and won’t say what it means. “The day you need it, you’ll know.”"

[tracks.bond_kogo.chapters.c2.choices.teach_back]
text = "Teach her one of the sailors’ curses as my fee."
reply = "Red to the ears, she repeats it after me three times, then hides her mouth behind her sleeve. “I will never use that as long as I live.” Three days later, at a turn in the gallery, I hear her mutter it: a senior lady’s maid has just knocked over the copy she set out to dry. It’s that exact curse, Tosa accent and all, not a sound out of place."

[tracks.bond_kogo.chapters.a1]
title = "Which Way the Umbrella Leans"
text = "The sermon at Hōkyō-ji lets out late, and night rain starts as we head back to our quarters. The stone steps shine wet, climbing one after another into the dark. Kogo holds the umbrella; I carry the lamp. The light reaches only two steps ahead, and the rain drums on the oiled paper louder than our voices. At every turn the umbrella tips a little more my way. By the third turn half her shoulder is out in the rain. “Come in closer,” I say. “It’s my umbrella,” she says. “I decide which way it leans.” I move the lamp between us, free a hand, and take hold of the handle to set it straight. Her hand is still on the handle too, and she doesn’t let go. “Don’t move,” she says. “The lamp’s swinging.”"

[tracks.bond_kogo.chapters.a1.choices.hold_lamp]
text = "Let go of the handle and walk ahead with the lamp to light her way, leaving the umbrella to her."
reply = "She follows behind, and at last the umbrella covers her. Under the eaves at the gate of our quarters, closing it, she sees that one whole side of me is soaked. Her mouth opens and not a word comes out. She pulls a wad of pocket paper from her robe and presses it to my shoulder. It turns to pulp at once. She pulls out another wad and presses harder."

[tracks.bond_kogo.chapters.a1.choices.share_umbrella]
text = "Straighten the handle and squeeze under the same umbrella with her the rest of the way up."
hint = "Crowd under one umbrella now and she’ll just shove it into your hand and run up the steps in the rain."
reply = "It’s a small umbrella, and squeezed together, each of us has a shoulder out in the rain. Under the eaves she finds my sleeve wet too and frowns, about to scold, then swallows it. The wick pops. We both look down at the same moment. The lamp stays lit. She pushes the umbrella handle into my hand. “Hold this.” Then she bends her head and wrings out her sleeve, wringing for a long time after it has stopped dripping."

[tracks.bond_kogo.chapters.a2]
title = "A Bronze Mirror and an Incense Cake"
text = "Kogo is being sent west to a house of poetry for the spring, to teach its women to compose and to write letters. It’s a long road, and she’s allowed one chest, borrowed from our quarters, with a lid that won’t quite shut. She takes things out one by one, and at the very bottom are a palm-sized bronze mirror and a cake of incense wrapped in paper. Flowers were cast on the back of the mirror once; they’ve worn so smooth you can’t feel them. The rim is dented, and a fine old scratch runs across the face. “The mirror’s too heavy. I can’t take it.” She pushes the incense toward me. “This is light. I blended it myself. The aloeswood is scraps I begged from the incense shop, so make do.” She turns the mirror face down on her knee, and her finger runs back and forth along the old scratch."

[tracks.bond_kogo.chapters.a2.choices.hear_mirror]
text = "Ask her how the old scratch got there, and copy what she tells me onto the back of a poem card."
hint = "She wraps the mirror back in its cloth and says nothing more. That story isn’t one she’s ready to tell you yet."
reply = "She tells me about the morning her hair was first put up to go into service at court: her hands shook and the mirror hit the flagstones. She tells it slowly, and when she gets to her mother kneeling to pick it up, she stops for a while. At the end she says, “This mirror has seen me at my ugliest.” I say then it has also seen more of you than anyone. I copy it all onto the back of a poem card and wrap it up with the incense. She watches me do it, then reaches over and presses the incense in a little deeper. “When you burn it, think of me.”"
effects = [{}, {}, {}, { title = "A Bronze Mirror and an Incense Cake" }]

[tracks.bond_kogo.chapters.a2.choices.look_together]
text = "Pick up the mirror and fit both our faces into it."
hint = "Pull her in to look into the mirror together now and she’ll laugh at you for fooling around and put it back in the chest."
reply = "The mirror is too small to hold two faces. It holds only two pairs of eyes, very close together. She looks for a while and doesn’t pull away. “That’s enough.” She sets the incense on the face of the mirror and pushes both across to me. “Keep the mirror for me. When I come back, I’ll come for it.”"
effects = [{}, {}, {}, {}, { title = "A Bronze Mirror and an Incense Cake" }, {}]

[tracks.bond_kogo.chapters.a2.choices.buy_mirror]
text = "Offer to buy her a new mirror, a lighter one, to take with her."
reply = "She shakes her head. “A new mirror wouldn’t show me.” She wraps the bronze one and puts it back at the bottom of the chest; the lid creaks as she presses it down. “Heavy, then.” Then she breaks off a corner of the incense the size of a fingernail and sets it by the brazier. A thin thread of smoke rises, and she wraps up the rest and tucks it in her sleeve. “You’ve smelled it. That counts as giving it to you.”"

[tracks.reunion_kogo]
name = "Kogo: The Teacher’s Seat"

[tracks.reunion_kogo.chapters.reunion]
title = "The Lady Teacher’s Seat"
text = "The fifth year of Eiroku, Funai in Bungo. My uncle’s banquet filled the great hall, retainers in the middle, and by the screens a separate seat for the lady brought in to teach waka. It was Kogo. A few retainers’ daughters crowded round her with their drafts. She answered each low and fast: “‘Shinobu’ here means enduring. You read it as hiding. Go back and think.” “Wrong character again; I told you last time. One wrong character, ten pages of copying, your family buys the paper.” When the questions ran out she looked up at me in the doorway. She had written a few letters these years, not many, each one ending with a question about the price of rice in Urado. “Princess of the Ichijō,” she said, “what are you doing in the doorway? No one gave you a seat?” She pulled a little desk over beside her and pushed it aside to clear room for paper."

[tracks.reunion_kogo.chapters.reunion.variants.mirror]
text = "Funai, in Bungo, the fifth year of Eiroku. My uncle’s banquet fills the great hall, his retainers seated down the middle, and by the screens a separate place has been set for the woman brought in to teach poetry. It’s Kogo. A few of the retainers’ daughters crowd around her with their drafts, asking about this and that. She answers each one, low and quick. “Shinobu here means to endure. You read it as to hide. Go think again.” “You’ve got this character wrong again, and I told you last time. Copy it ten times and bring it tomorrow.” Only when every question is answered does she look up, at me by the door. Inside my robe I’m carrying the poem cards she sent by merchant ship these past years, most of them arriving around Tanabata, a finger’s width thick when stacked; and I’ve brought the bronze mirror she left in my keeping, its wrapping of poem cards one layer thicker every year. “A princess of the Ichijō,” she says, “standing in the doorway? Has nobody offered you a seat?” She doesn’t get up. She reaches out, pulls a small writing table over beside her place, and nudges it aside to clear a spot for paper."

[tracks.reunion_kogo.chapters.reunion.default]
effects = [{ text = "Ichijō-hime: Your uncle holds this banquet every year, and again you didn’t come. The students here aren’t stupid, just lazy; they ask me ten times whether a poem will do and never go back and read it once more themselves. I teach them to write decent letters, to fathers, to husbands’ families, to people far away. The other day a girl asked who I write to. I said someone at sea, a letter or two a year, depending on the wind. She asked whether that person writes back. Yes, I said, in a worse hand than yours. I can see who in your uncle’s house writes to whom; don’t ask, that’s one thing I don’t sell. Rice is cheaper here than in Kyoto; I can afford fish twice a month now. One poem enclosed, at the usual price, a measure, on your account. Kogo" }, {}]

[tracks.reunion_kogo.chapters.reunion.choices.read_all]
text = "Sit down at the little desk and go through these years’ letters and accounts with her."
reply = "I laid the letters out by year. At the far end they were singing imayō, the toasts rising and falling; we bent over the accounts. At the third year’s letter she put her hand on it. “That one’s badly written. Something happened at home that year.” “It’s the shortest, and the paper changed too: rice wrapping.” She didn’t answer; she drew it out, added a small line on the back, and pushed it back to me. It was what had happened at home that year, written flat, like an account entry. I asked, offhand, who in my uncle’s house wrote to whom, which elder sent letters toward Yamaguchi. She set down her brush. “That I don’t sell.” Then she went on with the accounts, and they came out with me owing her two and a half measures. “Same again next year. I’ll remember what you owe.”"
effects = [{}, {}, {}, { title = "The Lady Teacher’s Seat" }]

[tracks.reunion_kogo.chapters.reunion.choices.that_poem]
text = "Ask her: does she still remember the one poem she wouldn’t take rice for?"
hint = "Needs: she wrote that poem for you herself back then, heart 24, and no bill tucked behind it."
reply = "She didn’t look at me; in the low quick voice she used with her students she recited it, word for word. At the third line she slowed. That line was the harbor at Urado, a boat coming in. When she finished she said, “One character on your sheet ran in the damp. I know which. I pressed too hard on it that year.” She laid her hand on the back of mine and kept it there, steady. At the far end someone was singing imayō; she didn’t let go. After a while, with her other hand, she drew a little bill from her sleeve and set it on the desk: three formal letters this time, six measures."
effects = [{}, {}, {}, { title = "The Lady Teacher’s Seat" }]

[tracks.reunion_kogo.chapters.reunion.variants.business]
text = "The fifth year of Eiroku, Funai in Bungo. At my uncle’s banquet a separate seat by the screens was kept for the lady teacher of waka. It was Kogo, answering the retainers’ daughters low and fast. When they ran out of questions she looked up at me in the doorway. In my jacket I carried the drafts of the formal letters and courtesy notes she had written for me these years, a finger’s width thick, each with a little bill tucked under it: formal letter two measures, courtesy note one and a half, half a measure more for a seal, and three of them marked ‘owed.’ “Princess of the Ichijō,” she said, “what are you doing in the doorway? Did you bring the accounts?” She pulled a little desk over and cleared room for paper."

[tracks.reunion_kogo.chapters.reunion.choices.pay_the_sheng]
text = "Pay the one measure on the bill she tucked behind that poem."
hint = "Only when that poem has come back to you with a bill behind it."
reply = "Last year she had sent, by merchant ship, a copy of that same poem, not a word changed, with a little bill tucked behind it in her hand: one measure. I set the price of a measure of rice on the desk. She glanced at it and took it, briskly. “Settled.” She pulled the bill out of my hand, tore it in two, and dropped it in the brazier. “From now on, formal letters two measures, courtesy notes one and a half, same as ever.” She bent to correct a student’s poem, finished it, and reached for the next."
effects = [{}, {}, {}, {}, { title = "The Lady Teacher’s Seat" }]

[tracks.reunion_kogo.chapters.reunion.variants.shared]
text = "The fifth year of Eiroku, Funai in Bungo. By the screens at my uncle’s banquet a separate seat was kept for the lady teacher of waka. It was Kogo. She answered each student, and only then looked at me in the doorway. In my jacket I had the poem slip she had sent by merchant ship last year: a copy of that one poem she wouldn’t take rice for, not a word changed, with a little bill tucked behind it in her hand. One measure. I hadn’t paid it. “Princess of the Ichijō,” she said, “what are you doing in the doorway?” She pulled a little desk over and cleared room for paper; an account book lay on its corner."
