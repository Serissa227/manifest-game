# C7 英文覆盖：祖贝达（缺页的书）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_zubayda]
name = "Zubayda: The Book with Missing Pages"

[tracks.bond_zubayda.chapters.c1]
title = "The Book with Missing Pages"
text = "The bookshop on the corner of the booksellers’ street had a string of old pages hanging over the door, threaded on twine, rattling whenever the wind blew. On the bottom shelf I found a copy of Ibn Battuta’s Travels. The spine had come unstitched, and when I leafed toward the back, whole gatherings were gone. I went looking for the East African part first. Mogadishu was there. Mombasa was there. Then Kilwa: gone, three leaves in a row. “A hundred and seventeen pages missing,” said the girl behind the counter, without looking up. She was tapping down a column in her ledger with a reed pen. “I counted twice.” Her name was Zubayda, the bookseller’s younger daughter. She named a price so low I half wondered whether the book was stolen. “On one condition. You come to the shop once a week and copy one page from our complete copy. You start with the first gap and go in order.” I said all I wanted was the three Kilwa leaves. Couldn’t I do those first? “Cutting the line costs extra.” She pushed the book across to me and finally looked up. “One page a week, copied true from the original. Don’t you dare pad it out with pretty words.”"

[tracks.bond_zubayda.chapters.c1.choices.take_the_deal]
text = "Shake on it, and agree to come at this hour next week for the first page."
reply = "She opened the ledger, started a fresh line beneath a long list of debts, and wrote my name, followed by “one page a week.” “Miss a week and the price goes up.” I said then she’d better keep the complete copy safe and not let anyone buy it out from under me. “The complete copy is worth more than you are,” she said, blowing on the ink. “I’d sell it to anyone before I sold it to you.”"

[tracks.bond_zubayda.chapters.c1.choices.why_so_cheap]
text = "Ask her: why is this book so cheap?"
reply = "“Because it has pages missing.” Her face gave away nothing. I said I’d seen plenty of books with missing pages and never one at that price. She shoved the book into my arms, and a loose end of thread dropped from the spine. “Do you want it or not? If you don’t, there’s a Yemeni at the door who’s been eyeing it for three days.” I held on to it. She bent over her ledger, and the corner of her mouth moved, too quickly for me to be sure."

[tracks.bond_zubayda.chapters.c2]
title = "The Smudged Half Line"
text = "For my first page, Zubayda sat me at the low table behind the counter, the complete copy open on my left and the damaged one on my right. I copied fast, and the moment I finished I held the page up by two corners to show her. The ink wasn’t dry. It ran down the sheet, all over my hand, and turned the last half line into a black smear. I lifted my sleeve to wipe it. “Don’t move!” She caught my wrist and pulled a clean sheet from under the counter. “Wipe that with your sleeve and the page is ruined, and the paper goes on your account.” I said it was only half a line. Whoever read it could guess. She didn’t answer. She tipped her chin toward the door. Three people were waiting there: a student, a woman with a child on her hip, an old man on a crutch, all come to borrow books to copy. “Your hurry,” she said, “shouldn’t make them guess all over again what that half line says.” I copied the page again. This time I didn’t dare pick it up. She didn’t take it, either. She stood by the table and watched the ink go from glossy to dull, and only then did she lift the sheet away."

[tracks.bond_zubayda.chapters.c2.choices.wait_for_ink]
text = "From now on, sit and wait for every page to dry before you hand it over."
hint = "To her you’re still a clumsy boy from some gold merchant’s house down south. She won’t pull up a stool and sit with you while the ink dries."
reply = "A page takes about as long to dry as a cup of tea takes to drink. The first time, I just sat there. The second time, she brought a stool and sat across from me. By the third, we were talking: what kind of stone the houses in Kilwa are built from, why paper in Cairo costs more every year, how the man in the bookshop next door had sold the same copy of Kalila and Dimna three times. One page’s worth of drying, and we’d gone through half the gossip on the street. “Come early next week,” she said as I left. “I haven’t gotten to who bought it the third time.”"

[tracks.bond_zubayda.chapters.c2.choices.blot_it]
text = "Ask to borrow a pinch of blotting sand, to speed things up."
reply = "She dug a small clay jar out from under the counter and set it down in front of me with a thump. “The sand goes on your account too.” I grabbed a big handful and threw it on. Too much: it sprayed across the table and worked its way into the binding of the complete copy. She swore, crouched down, and shook the book out by its spine, little by little, and somewhere in the middle of it she started laughing. “Half a handful next time. Half is plenty.”"

[tracks.bond_zubayda.chapters.b1]
title = "The Page About Kilwa"
text = "Thirty-one pages in, I reached the three missing leaves. In the complete copy, Ibn Battuta called Kilwa one of the most beautiful and best-built cities in the world, its roofs laid on mangrove poles. Its sultan was so generous that when a man asked him for the clothes off his back, he took them off and handed them over. “If I’d been born back then,” I said as I copied, “I’d have gone and asked every day. A new outfit daily, and sooner or later the sultan holds court bare-chested.” Zubayda laughed so hard she slapped the counter with her ledger. “Beg like that and the sultan would’ve thrown you in the sea.” I kept copying, and when I got to the houses, my pen stopped. I had seen Kilwa as it is now: half the wall fallen down, a Portuguese fort standing over the harbor, grass growing in courtyard after courtyard. Fifty years ago their ships came into the harbor; the city was looted and burned, and the sultan fled in the night. This page was about a city that no longer existed. The joke wouldn’t come, and a drop of ink fell at the edge of the page. Zubayda said nothing. She got up, brought the lamp over from the counter, set it by my hand, and turned up the wick. Then she sat back down with her ledger and did not turn a single page."

[tracks.bond_zubayda.chapters.b1.choices.finish_slowly]
text = "Copy the page out word by word, then read it aloud to her."
hint = "You don’t want her to see what’s behind the jokes yet. Read this page aloud and you’re afraid your voice will give out first—and you aren’t close enough to let her hear that."
reply = "I read slowly. At “best-built” my voice caught, but I kept going to the end. Zubayda took the page and held it up to the lamp for a while. “When you go home, write down the Kilwa you see, and we’ll add it after this page.” I said there was no room; the next city started right after it. “I’ll bind in an extra leaf,” she said. “It’s our book. I decide how many leaves it gets.”"

[tracks.bond_zubayda.chapters.b1.choices.joke_again]
text = "Tell another joke and bluff your way past the page."
reply = "I told one from the gold market at Sofala: a merchant who gilded his brass weights, weighed gold with them his whole life, and in the end had his own coffin sold at the price of brass. I told it louder than usual. Zubayda didn’t laugh. She tapped the drop of ink with her fingernail. “A joke won’t fill this page.” I bent my head, copied the remaining lines without a single mistake, and scraped the ink drop clean with a penknife. When she took the sheet, she made a small tick after my name in the ledger. I asked what it meant. “This page counts.”"

[tracks.bond_zubayda.chapters.b2]
title = "Her Sister’s Name"
text = "Amina was Zubayda’s older sister, and she had copied most of the books in the shop: even script, few errors. But when they were sold, the last line of every book carried the shop’s name, never hers. That day Zubayda came to me holding a freshly bound copy of the Maqamat, still smelling sour from new paste. She turned to the end. Under the shop’s name there was room for one more line. “I want to add a line here saying who copied it.” She kept her voice down and glanced at the copying desk by the street window, afraid her sister would hear. “My father says buyers won’t trust a woman’s name. Put it in and the book won’t sell.” “What does your sister say?” “She says she doesn’t care.” Zubayda shut the book and opened it again. “When she says she doesn’t care, she cares.” She pushed it across to me. “You’re a trader. Tell me. With that line in it, will it sell?”"

[tracks.bond_zubayda.chapters.b2.choices.design_colophon]
text = "Draft the line for her, dignified enough that no buyer can find fault with it."
hint = "She doesn’t want outsiders meddling in family matters yet, and she hasn’t opened the book for you—to her, you’re still a customer who came for a book with missing pages."
reply = "I tried it four times on scrap paper. What I ended up with was: “Copied by Amina, daughter of this shop, and checked word by word.” Zubayda changed “word by word” to “collated throughout,” saying that was the phrase buyers trusted. Amina wrote the line in at the window, laid down her pen, and said, “I don’t care.” The book sold within three days of going on the shelf, faster than anything else on it. The buyer was a judge’s clerk, and as he paid he pointed at the last line. “A name and a family. That I can trust.” Zubayda repeated it to her father word for word. Twice."

[tracks.bond_zubayda.chapters.b2.choices.buy_first_copy]
text = "Say you’ll buy this one with Amina’s name on it, and you’ll be first."
reply = "Zubayda took my deposit into the back room. Through the curtain I heard her tell her father, “Someone’s already asked for it. He wants the copyist’s name in it, specifically.” Her father grumbled for a long time. The next day the book was in my hands. The last line read “Copied by Amina,” the ink still shining. When I paid, I haggled out of habit and got two coppers off. Zubayda wrapped the two coppers in a scrap of cloth by themselves and said they were for her sister."

[tracks.bond_zubayda.chapters.a1]
title = "She Spoke First"
text = "At closing time I went to check the ledger, as usual, to see how many pages I still owed. Zubayda reached over and shut it. “Next week,” she said, “could you come for something other than the missing pages?” I just stood there, my hand still on the cover. She laughed first. She brought out a flatbread wrapped in cloth from under the counter and tore it in two. “Eat something first. Sit.” We sat under the eaves of the shop. Across the street the bean-stew seller was packing up, his copper pot clanging. She told me about her readers that day: a blind old man who came once a month and had her read an entire book of poems from beginning to end, and whenever she reached a part he loved, he rapped the ground with his cane, and however many times he rapped, that was how many times she had to read it again. “Eleven raps today,” she said. “I’ve got no voice left.” I opened my mouth to answer with something from the sea. She waved it off. “Save your ships for next time. Today I talk, you listen.” She talked until dark. The bread was gone, and it was she who got up to light the lamp under the eaves."

[tracks.bond_zubayda.chapters.a1.choices.come_next_week]
text = "Say you’ll come next week. Not for the pages. For the bread."
hint = "Her hand is still on the closed ledger, and you can’t find a thing to say that doesn’t sound like politeness. Say “for the bread” and she’ll just think you’re greedy."
reply = "“Then you’re paying for the bread.” She said it fast, and then held her half of the flatbread up in front of her face for a moment. The next week when I came, two flatbreads were already waiting under the eaves: one sprinkled with black seed, one stuffed with dates, the kind I’d stared at a beat too long outside the bakery the time before. I had never told her I liked the date ones. She hadn’t asked."

[tracks.bond_zubayda.chapters.a1.choices.read_for_her]
text = "Offer to read to the blind old man next time, so she can rest her voice."
hint = "The old man is one of her regulars, and she doesn’t trust you with his poems yet—you don’t even know which lines he likes."
reply = "“Your accent,” she said, looking me up and down. “He won’t understand you.” I said I’d read slower. She thought about it. “Slower, and he’ll understand. He always says I read too fast anyway.” She pushed the other half of the bread toward me. The next month the old man came, and I read to him all afternoon. He rapped his cane nine times, then turned his face toward Zubayda and asked whether the boy from the south charged."

[tracks.bond_zubayda.chapters.a1.choices.tell_kilwa]
text = "Turn it around and tell her a story from Kilwa."
reply = "The story I told was about my mother. She died when I was three, and I remember only one thing: she would lay out the gold weights in a row on a mat and teach me to name them one by one, and when I got one wrong, she tapped my finger with the smallest weight. I laughed the whole time I told it, and said it never hurt a bit. Zubayda put her bread down. “That one,” she said, “you have to write down and put in the book.” I said that would take a lot of pages. “Then keep coming,” she said. “I’ll open a new line for you in the ledger.”"

[tracks.bond_zubayda.chapters.a2]
title = "No Refunds After Three Days"
text = "The week the book was finally whole, the last page was one I had copied. Zubayda sewed it in with needle and thread, tied it off, and bit through the end. The next day she came to the lodging house with a small wooden box. The porter wouldn’t let her in, so she stood at the gate and shouted my name until heads were poking out of every window in the courtyard. Inside the box were figs cooked down in sugar, packed side by side in neat rows. On the lid, in charcoal, was a line written fast and sharp, the same hand as her ledger: “One box sugared figs. No charge. Eat within three days. No refunds after.” “I made them myself,” she said. “The book’s finished, so you’ve got no reason to come next week.” She pushed the box into my hands. “This box will last you three days.” Then she didn’t leave, and didn’t look anywhere else. She stood by the porter’s bench, looking at me, waiting for me to say something."

[tracks.bond_zubayda.chapters.a2.choices.keep_lid]
text = "Take it, and say that once the three days are up, you’ll bring the empty box back to the shop."
hint = "This box weighs more than it looks, and you can’t find the words to take it. You aren’t close enough yet to accept it."
reply = "“An empty box isn’t a reason.” I said it was a reason to me; a shop that takes in old books ought to take in old boxes, too. She glared at me, took the box back out of my arms, fished out a stub of charcoal, and went over the line on the lid again from the start, darker this time, before she shoved it back at me. “The box is on loan. It goes in the ledger.”"
effects = [{}, {}, {}, { title = "No Refunds After Three Days" }]

[tracks.bond_zubayda.chapters.a2.choices.need_a_reason]
text = "Take it, and say you’ll come next week anyway. No reason needed."
hint = "“No reason needed”—that’s too plain; you open your mouth and close it again. You aren’t close enough, and your heart isn’t near enough yet to say it."
reply = "She went still, and then red to the tips of her ears. She opened her mouth twice before anything came out. “Then… I’ll leave the door open.” She turned and left, faster than she’d come. At the corner of the lodging house she stopped, looked back at me once, and went on. The porter on his bench chuckled. I made the figs last three days, and saved the last one until the fourth. By then it had turned a little sour."
effects = [{}, {}, {}, { title = "No Refunds After Three Days" }, {}]

[tracks.bond_zubayda.chapters.a2.choices.share_now]
text = "Open it on the spot and give her half: two of you, a day and a half."
reply = "We sat down on the porter’s bench. She counted, I ate. She split the figs into two piles, pointing at each in turn: “Yours, mine, yours…” At the end there was one left over, and she broke it in two. The porter was eyeing them, so she gave him half and called it the price of his silence. “A day and a half to finish them,” she said, closing the lid on the half-empty box, “so the day after tomorrow you’re coming to the shop to return the box.”"

[tracks.bond_zubayda.chapters.s]
title = "Beyond Once a Week"
text = "In December word came from my father in Kilwa: catch this season’s northeast monsoon and come home. After that there would be no more coming to the shop once a week. I went to tell Zubayda. She didn’t say a word. She turned the ledger to my line: “Baraka bin Salim, one page a week.” Beneath it the dates were packed tight, and the weeks I had missed each had “price goes up” written after them. Not once had she actually raised it. She picked up her pen, struck out “one page a week,” and wrote beside it: “Whenever there’s a ship.” “I’ve made up my mind,” she said. “From now on every book my sister copies carries her name on the last line. And every book we sell, we write down exactly which pages are missing, from which page to which page, not one hidden. Whatever’s missing goes on the first page.” She said it all in one breath and put down her pen. “That’s the shop settled. Now you. What do you want?”"

[tracks.bond_zubayda.chapters.s.choices.promise]
text = "Promise to write whenever a ship sails, and fill in a page of Kilwa in each letter."
hint = "A page with every ship—that’s for life. What you share can’t fill that ledger yet—or you’ve already promised a lifetime of letters to someone else."
reply = "“Kilwa,” she said, “and no jokes. I don’t accept jokes.” I said with no jokes at all the letters would be very short. “Then they’re short,” she said. “I count short ones by the page too.” She pulled a sheet from under the counter, cut a strip as wide as her palm, and wrote on it the shop’s address, her father’s name, and her own. At the very bottom she wrote three ports: Suez, Jeddah, Aden. “Write on the cover where each letter got on its ship. Whichever ship is slow, I want to know who to yell at.” I folded the strip and tucked it into the brass box where I kept my gold weights, under the heaviest one. She saw, and said nothing. She opened the finished Travels to the three Kilwa leaves. Behind them, sure enough, a new leaf had been bound in, without a word on it yet. “I’ll keep this page for you.” She closed the book. “Every letter that comes, I’ll copy a piece of it in here. When it’s full, I’ll bind in another.”"
effects = [{}, {}, { title = "Beyond Once a Week" }, {}, {}]

[tracks.bond_zubayda.chapters.s.choices.heart]
text = "Say nothing. Wait for her to speak first."
hint = "She’s waiting, and you can’t carry the silence. Either you two haven’t come that far yet, or you’ve already made the same promise to someone else."
reply = "I didn’t answer. Zubayda waited a while, and when I still said nothing, she shut the ledger herself. “Then I’ll go first,” she said. “That book has one last page I never let you fill.” I said the book was finished; the last page was one I copied and she sewed in. “That’s the book’s last page,” she said. “Not the one I’m keeping.” She looked at me. “When you’re grown, come back to Cairo and fill it.” “With what?” “I’ll tell you then.” She reached over and took my hand and held it tight. Her palm had ink on it, and a little stickiness left from boiling sugar. We stood there in the doorway of the shop. Up and down the street the lamps came on one by one, and the man from the bookshop next door came out to put up his shutters, glanced at us, and ducked back in. She didn’t mention the day I was leaving, and neither did I. When every lamp was lit, she let go, turned into the shop, and called from inside the door, “Go on. When your ship comes in, remember to write.”"
effects = [{}, {}, {}, {}, { title = "Beyond Once a Week" }, {}]

[tracks.bond_zubayda.chapters.s.choices.own]
text = "Make a bet: she runs her shop, you run your gold, and in ten years see whose name people remember first."
reply = "“The shop’s name,” she shot back, “goes on the last line of every book. Sell one in Damascus, sell one in Fez, and whoever reads to the end sees it.” I said you could put a name on gold too; the sultans of Kilwa used to strike theirs on coins. “Coins get melted down,” she said. “Books get copied.” I asked what happened if the copyist got the name wrong. That stopped her for a moment. Then she turned to the back of the ledger and wrote: “Ten years from now, names.” She signed beneath it and handed me the pen. I signed bigger than she had. She jabbed my name with the end of her pen. “Big letters don’t win.” Then she put the ledger away under the counter, locked it, and hung the key back around her neck. “Ten years. Not a year less, or it doesn’t count.”"

[tracks.reunion_zubayda]
name = "Zubayda: A Lamp Left Burning in the Bookshop"

[tracks.reunion_zubayda.chapters.reunion]
title = "A Lamp Left Burning in the Bookshop"
text = "In 1564 I came back to Cairo after dark. Every shop on the booksellers’ street had its shutters up except Zubayda’s, where a lamp was still burning. I pushed the door open. She was bent over the counter doing her accounts, and at the sound of the door she said without looking up, “We’re closed, come back tomor—” Then she saw who it was, and her pen dropped onto the ledger. She led me to the cupboard. My letters were stacked inside, shelf by shelf, the earliest on top, its edges gone yellow. “In the order they arrived,” she said. “Not the order you wrote them. The sea winds shuffled them. One you wrote two years ago got here before one you wrote three years ago.” Upstairs the copy room window had long gone dark; Amina always put down her pen at nightfall. The book she had finished that day lay at the end of the counter, and on its last line was her own name. I asked about the Travels with the missing pages, and why she had sold it to me so cheap. This time she didn’t say “because it has pages missing.” “I wanted you to come every week,” she said. “When my father asked, I told him I was clearing out old stock.” She swung the cupboard door half shut, then pulled it open again."

[tracks.reunion_zubayda.chapters.reunion.default]
effects = [{ text = "(A single page from a book. On the front, in Zubayda’s hand, is Ibn Battuta’s passage on Kilwa, copied without a slip. On the back, the writing continues:) Baraka: every ship due in Cairo this year has come in, and you weren’t on any of them. I’ve stopped cursing the ships. It isn’t their fault. The shop has a new sign, and under the name, in small letters: Missing pages declared. Last month a bookseller from Damascus asked before buying whether anything was missing. I turned to the first page and showed him, every gap, page to page, written out plainly. He said in twenty years of book markets he had never met a seller who confessed on her own. He bought three. Every book my sister copies has her name in it now, and these days my father tells anyone who’ll listen that it was his idea. Let him. I’ve kept all your letters, in the order they arrived. The last one came from Mombasa: the price of gold is down, and you haggled with a Portuguese until he bought you dinner. Still plenty of jokes. I copy every letter into the back of the book, word by word, and I’m on the third leaf I’ve bound in. This page is the one I’m filling in for you. The front is from the book; you copied it once. The last line isn’t. (The last line, smaller than everything above it:) I sold you that book so cheap because I wanted you to come every week. Now you know. Next time you come, you pay full price." }, {}]

[tracks.reunion_zubayda.chapters.reunion.choices.friend]
text = "Stay, and help her re-sort the late letters by the dates you wrote them."
reply = "She lit a second lamp, and we spread every letter across the counter. She knew my handwriting better than I did: this one was written on board, the ink jostled by the swell, one line high and the next low; that one was written at an inn in Mombasa, with the ring of a tea bowl on the paper. Plenty of the dates I remembered didn’t match, so she went to the ledger. It had the day each letter arrived, with a note beside each one: “Short.” “Jokes again.” “This one’s good.” By midnight three letters were left that we couldn’t put in any order. I hadn’t dated them when I wrote them, and they had all reached her on the same ship. “Then we go by when they arrived,” she said. I said in that case those three were hers, and the calendar had no say over them. She laughed, squared the three letters, tied them with a length of binding thread, and put them by themselves on the top shelf of the cupboard. “Then this shelf is mine.” She shut the cupboard tight and turned the key once in the lock. Then she turned around and asked whether I’d be back tomorrow to help her sort out the rest of her accounts."
effects = [{}, {}, {}, { title = "A Lamp Left Burning in the Bookshop" }]

[tracks.reunion_zubayda.chapters.reunion.choices.love]
text = "Ask her whether the last page she kept can be filled in now."
hint = "She shuts the cabinet halfway, then pulls it open again. You never asked for that last page back then, and after all these years the words still won’t fill the gap."
reply = "She looked at me for a long time. Then she turned and opened the lowest drawer of the cupboard and took out a single leaf of paper, yellowing a little, trimmed clean on all four sides, with nothing on it. She spread it on the counter, set a paperweight on it, and pushed a pen and the ink toward me. “This page doesn’t get filled one week at a time,” she said. “You write it all at once.” I asked what I should write. “I said I’d tell you then.” She leaned against the counter. “This is then. Write whatever you want. If you spoil it, this time the price doesn’t go up.” I wrote for a long time. I wrote about my mother’s weights laid out on the mat, about the half-fallen walls of Kilwa, about every ship bound north, about the sentence I had written and crossed out at the end of every letter. On the last line I wrote her name. She picked it up and read it from the first line to the last, and when she finished she said nothing. She put the page down, leaned across the counter, and kissed me. The lamp wick on the counter gave a crackle. Someone on the stairs came halfway down, then crept back up again."
effects = [{}, {}, {}, { title = "A Lamp Left Burning in the Bookshop" }]

[tracks.reunion_zubayda.chapters.reunion.variants.v1_romance]
text = "In 1564 I came back to Cairo after dark. Every shop on the booksellers’ street had its shutters up except Zubayda’s, where a lamp was still burning. I pushed the door open. She was bent over the counter doing her accounts, and at the sound of the door she said without looking up, “We’re closed, come back tomor—” Then she saw who it was, and her pen dropped onto the ledger. She led me to the cupboard. My letters were stacked inside, shelf by shelf, the earliest on top, its edges gone yellow. “In the order they arrived,” she said. “Not the order you wrote them. The sea winds shuffled them.” The lowest drawer of the cupboard stayed shut. She didn’t open it. Upstairs the copy room window had long gone dark; Amina always put down her pen at nightfall. The book she had finished that day lay at the end of the counter, and on its last line was her own name. I asked about the Travels with the missing pages, and why she had sold it to me so cheap. This time she didn’t say “because it has pages missing.” “I wanted you to come every week,” she said. “When my father asked, I told him I was clearing out old stock.” She glanced down at the lowest drawer, then raised her eyes to me, and waited."

[tracks.reunion_zubayda.chapters.reunion.variants.v2_own]
text = "In 1564 I came back to Cairo after dark. Every shop on the booksellers’ street had its shutters up except Zubayda’s, where a lamp was still burning under a new sign, with a line of small letters beneath the name: Missing pages declared. I pushed the door open. She was bent over the counter doing her accounts. She looked up, saw me, and set her pen down. “You’re two years early.” She turned a book she had just taken in to its last line and showed me the shop’s name, written out plainly. Then she led me to the cupboard, where my letters were stacked shelf by shelf in the order they had arrived. “People in Damascus know this sign now,” she said. “And your gold?” Upstairs the copy room window had long gone dark. At the end of the counter lay the book Amina had finished that day, her own name on the last line. I asked about the Travels with the missing pages, and why she had sold it to me so cheap. This time she didn’t say “because it has pages missing.” “I wanted you to come every week,” she said. “When my father asked, I told him I was clearing out old stock.” Then she opened the ledger to that page: “Ten years from now, names.”"
