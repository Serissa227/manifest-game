# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_salih.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 两个“收下”选项第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个效果、重逢两个选项第 4 个效果是 memory；重逢 default 第 1 个效果是 letter。

[tracks.bond_salih]
name = "Salih: Reading for Whom"

[tracks.bond_salih.chapters.c1]
title = "Reading for the Teacher"
text = "On my third day at al-Azhar I squeezed into the back row of a lecture circle to hear a Yemeni student read aloud to an old blind teacher. He had a good voice and read slowly, pausing after every phrase as if afraid the words might fall out of his mouth. The boy beside me was yawning, so I couldn’t help myself: under my breath, in Arabic with Swahili mixed in, I told him our coast’s story of the monkey who fooled the shark—“I left my heart up in the tree, I have to go back for it.” Two students from Zanzibar snorted out loud. The reading stopped. The teacher turned his face toward us. “Again.” The reader didn’t look around and didn’t sigh. He only said, low, “The shaykh says the ear remembers longer than the eye.” Then he turned back to the top of the page and read it again from the first word. After the lesson everyone left, but he stayed kneeling beside the teacher, waiting for him to nap. There was a clay water jug at the teacher’s elbow. He picked it up, shook it—empty—and set it gently back where it had been. He didn’t get up to fetch water. He licked his lips and turned ahead so the next page would be ready."

[tracks.bond_salih.chapters.c1.choices.refill_and_sorry]
text = "Fill the jug at the well for him, then apologize."
reply = "I drew a full jug from the well in our lodging, spilled half of it on the way back, and went back to fill it again. He took it and poured half a cup for the teacher first, and only then drank from the spout in one long swallow, his throat working. “That monkey,” he said, wiping his mouth, “was funny. Wrong time, though.” I said next time I’d pick the right one. He thought it over and nodded. “Then tell it to me. While the teacher naps.”"

[tracks.bond_salih.chapters.c1.choices.swahili_proverb]
text = "Go over and talk my way out of it with a Swahili proverb."
reply = "I told him we have an old saying back home: a man in a hurry to talk has borrowed his ears. He didn’t speak Swahili, so I said it again in Arabic. His mouth hadn’t moved yet, but his eyes were already laughing. “So when are you giving the ears back?” Right now, I said. I’d sit here all afternoon and not say a word. He let me do exactly that. I didn’t say a word, and by evening my throat was drier than his."

[tracks.bond_salih.chapters.c2]
title = "The Teacher’s Catalog"
text = "Salih wanted to make a catalog for the teacher: every book the old man had read, learned by heart, or borrowed and never returned. The teacher would say the titles and Salih would write them down. “The teacher says that when a man gets old, his books leave before he does.” He didn’t look at me when he said it; he kept his head down, grinding ink. The books filled half the room, and many had long since lost their covers, so the titles had to be read off the spines. He asked me to help. I stumbled through them, my Kilwa accent flattening every throat sound in the language. He didn’t laugh or hurry me. He said the word slowly for me, and on the third try I got it. When he’d corrected me, he wrote the proper reading in the catalog—and beside it, in smaller letters, the way I had said it wrong. The sheet was half full: titles down the left, a narrow strip of small writing on the right, and now one line of crooked Kilwa reading."

[tracks.bond_salih.chapters.c2.choices.read_all_spines]
text = "Stay and read through the whole half room with him, not one book skipped."
hint = "This is work without end. We barely know each other; he won’t let me sit up with him for it."
reply = "It took a month. Every day after lectures I ducked into that room and read, from the pile by the door to the pile under the window, until the lamps were lit, until he had worn my accent half smooth. The catalog filled three sheets. On the last day Salih read all three aloud to the teacher. At one title the old man raised his hand. “That one I borrowed in Zabid when I was young. I never gave it back.” Salih drew a small circle beside the line. I asked what the circle meant. “To be returned,” he said."

[tracks.bond_salih.chapters.c2.choices.why_my_reading]
text = "Ask him why he writes down my wrong readings too."
reply = "“The teacher says,” he answered, laying the pen beside the inkstone, “if someone reads it that way, someone ought to remember it.” He supposed I wasn’t the only man from Kilwa who said that word like that. Then I’d get a few more wrong, I told him, and win Kilwa a few more lines. He shook his head, smiling, and picked the pen back up. “No need for more. One is enough.”"

[tracks.bond_salih.chapters.b1]
title = "Kilwa as Foreigners Wrote It"
text = "A shop on the booksellers’ street had taken in a Portuguese book, Barros’s Asia, printed in Lisbon only two years before. When the bookseller heard I was from Kilwa, he made a point of finding the pages for me. My Portuguese came from sailors on the docks, and I read slowly; it took me a whole evening. How the Portuguese ships came into the harbor, how the sultan fled, how the town burned, and how afterward they built a fort on the shore. Of how our own people lived, not one line. That night in the courtyard of our lodging I told jokes—the Portuguese had written our walls three feet too short, because they measured them on their knees. The whole courtyard laughed, except Salih, sitting on the rim of the well. Around midnight someone knocked at my door. He stood outside with an Arabic manuscript in his arms, holding the lamp low. “This is the one your own people wrote. The teacher has a copy. I’ll read it to you.”"

[tracks.bond_salih.chapters.b1.choices.listen_all_night]
text = "Let him in and let him read, all the way to dawn."
hint = "What’s behind the jokes, I don’t want him seeing yet. I won’t open this door tonight."
reply = "He sat on the edge of my bed and read. The first man from Shiraz, who wrapped colored cloth all the way around the island and bought the land with it; the sultans’ names, one after another, more than I could keep. Near dawn he reached the page where a sultan built the great mosque, and stopped, a finger on the line. “This part is well written.” I didn’t say anything. He didn’t read on, either. He closed the manuscript, laid it by my pillow, blew out the lamp, and pulled the door softly shut behind him."

[tracks.bond_salih.chapters.b1.choices.joke_again]
text = "Laugh it off: I can tell my own family’s story without a book."
reply = "He looked at me a while, then set the lamp down on the threshold. “You talk. I’ll listen.” So I did. The walls of coral stone, the scales for weighing gold in the market, the year my mother took me by the hand to see the great mosque—and there I couldn’t go on. He didn’t ask. He opened the manuscript and read on from where I had stopped, very slowly, as if waiting for me to take it back."

[tracks.bond_salih.chapters.b2]
title = "A Book on Loan for Three Days"
text = "Shaykh al-Sha’rani’s lodge owned a book with no second copy anywhere in the city. The lodge’s rule was three days only: back before sunrise on the fourth, no exceptions. Salih wanted to copy it for the teacher, but no one could copy it alone in three days. He came to find me among the Jabarti students. “My brother, you read, I’ll write. When we get tired, we switch.” We lit one lamp in the teacher’s room, trimmed the wick and trimmed it again, topped up the oil and topped it up again. The first night he wrote fast. The second night his hand began to shake; ink spattered the margins and he scraped the spots away with a fingernail. On the third night I was reading when my forehead hit the book. I woke with the lamp still burning and the window going pale. He was still copying—the very page I’d been halfway through. I had never read him the second half. He was making it out from the original himself, his lips moving without a sound."

[tracks.bond_salih.chapters.b2.choices.take_over]
text = "Take the pen from him, let him sleep, and copy the last pages myself."
hint = "He still won’t let anyone sit up in his place. He won’t let go of that pen."
reply = "I worked the pen out of his fingers; the joints had gone stiff. He said no, said it twice, and was asleep on the table before he finished the third. My hand isn’t as good as his. When a line ran crooked, I straightened the next one. I finished the last page before sunrise and ran the original to the lodge just as the doorkeeper drew the bolt. When I got back he was awake, turning through my pages one by one. “The teacher can’t see this writing,” he said. “But I’m keeping it.”"

[tracks.bond_salih.chapters.b2.choices.read_louder]
text = "Rub my eyes and keep reading, louder than the three nights before."
reply = "I slapped my own face twice and picked up from the middle of that page, so loud the room rang and someone next door pounded on the wall. Salih wrote faster than on any of the three nights. He finished the last line before dawn, put down the pen, and his forehead dropped to the table. His hand was still resting by the inkstone, the fingers black with ink. I moved his hand clear and carried the original back to the lodge. Any later, the doorkeeper said, and he’d have had to take down our names."

[tracks.bond_salih.chapters.a1]
title = "The Night the Dam Was Cut"
text = "The Nile had risen full, and Cairo was going to cut the dam at the canal mouth and let the water into the city. That night the river was covered with boats hung with lamps, and the banks were packed with people—sugarcane sellers, chickpea roasters, men beating hand drums. Salih pulled me through the crowd to the docks at Bulaq and sat us down on a stretch of stone steps nobody had claimed, the water right below our feet. From inside his robe he took a small book of poems, its cover rubbed shiny, opened it to a page, and pressed it flat with his palm. “This page. Let me read it to you.” It was the first time he wasn’t reading for the teacher. He was reading to me. He read smoothly, not a single stumble—too smoothly for a first reading. Lamp boats drifted past below us, one, then another. I turned to look at him and saw he wasn’t looking at the page at all. His eyes were on the river the whole time."

[tracks.bond_salih.chapters.a1.choices.let_him_finish]
text = "Pretend I haven’t noticed, watch the river too, and let him finish."
hint = "We aren’t close enough yet to sit side by side on a night like this and play dumb. He couldn’t read on, and I couldn’t sit still."
reply = "I watched the river too, and the lamps, and didn’t look at him once. When he finished he closed the book and ran his fingers back and forth over the cover for a long time. “I read it badly.” I said he read it well, better than anything I’d heard in the lecture circle. He ducked his head and smiled, and held the book a little tighter. “Then next year, when the water rises, I’ll read it to you again.”"

[tracks.bond_salih.chapters.a1.choices.he_reads_for_whom]
text = "Promise him: whoever he wants to read to, I’ll find that person for him."
hint = "Words like that take more friendship than we have yet. Said now, he’ll think I’m making fun of him."
reply = "He lifted the book from his knees, then set it down again. “Then who I want to read to,” he said, “you already know.” And he bent his head over the book and studied it very hard. It was a good while before I noticed he was holding it upside down. He never noticed. I never mentioned it."

[tracks.bond_salih.chapters.a1.choices.ask_the_poet]
text = "Ask him who wrote the poem."
reply = "“A Yemeni poet,” he said. “It’s about a man waiting by a river for someone.” I asked whether the someone ever came. He thought about it and said the poem didn’t say. Then he shut the book, just as a cheer went up upstream—the dam was cut—and every lamp boat on the river rocked at once, until the water below was full of lamps too."

[tracks.bond_salih.chapters.a2]
title = "The Fifth Pen"
text = "When the lecture broke up, Salih stopped me in the colonnade and pushed a brass pen case into my hands—pushed it fast, as if it were hot. His name was chased into the lid, the edges of the letters worn bright. I opened it. Inside lay five trimmed reed pens side by side, every nib cut at the same slant, every one the same length. “The first four are mine,” he said. “The fifth is for whichever classmate forgot his pen. It’s been that way since I came to al-Azhar.” He reached out one finger and touched the pen at the end. “This past year, every time someone used the fifth one, it was you.” I thought about it. It was true. My pens were always left behind in the lodging or lent out and never returned, and every time, he had drawn one out of this case and handed it over, trimmed and already dipped."

[tracks.bond_salih.chapters.a2.choices.keep_case]
text = "Accept the case and tell him I’ll never forget my pen again."
hint = "We aren’t close enough yet for me to take it, or for him to let it go."
reply = "“Then the fifth one would sit idle with you.” He drew the pen at the end out of the case and tucked it into the edge of his turban. “An idle pen had better stay with me.” Then I’d keep the fifth slot in the case for him, I said. He gave me one look, said nothing, and snapped the lid shut for me with a click."
effects = [{ }, { }, { }, { title = "The Fifth Pen" }]

[tracks.bond_salih.chapters.a2.choices.pen_for_him]
text = "Accept the case, pull out the fifth pen, and press it back into his hand: this one is yours."
hint = "We haven’t come that far. He’ll give me the case, but he hasn’t decided yet whose the fifth pen should be."
reply = "He gripped the pen so hard his knuckles went white. “Then from now on, I’ll write my letters with this one.” That night a sheet of paper came under my door, folded into a narrow strip. When I opened it there was a single line, the ink fresh, the strokes a little thicker than his usual hand—the pen probably wasn’t trimmed to his liking yet. What it said, I’ve never shown anyone."
effects = [{ }, { }, { }, { title = "The Fifth Pen" }, { }]

[tracks.bond_salih.chapters.a2.choices.name_on_lid]
text = "Say the lid only has his name on it—mine has to go on too."
reply = "He blinked, then said that way it wouldn’t count as his gift; it would count as something we’d bought together. The next day he actually went to the coppersmiths, and when he came back my name sat beside his on the lid, chased a little crooked, sloping downhill. He rubbed the line with his thumb. “Crooked is easier to recognize.” He’d hold on to the case for now, he said, until he could get a smith to straighten my name. He never did go back for a second try."

[tracks.bond_salih.chapters.s]
title = "Cities and Books"
text = "Once the northeast wind settled, I would be heading south to Kilwa. Salih was staying in Cairo to finish the catalog with the teacher. Three days before I left, he spread two sheets of paper on the mat in my room and dipped his pen. On one he wrote the towns I was going to: Kilwa, Mombasa, Malindi. With each one he asked me something—was there a great mosque, did the mosque have a cupboard where books were kept under lock. On the other he wrote the books he was looking for, each title followed by a name: who had it, what street they lived on, whether they were the lending kind. “You string the scattered towns together,” he said, “and I’ll string the scattered books.” When he was done he squared the two sheets, laid one on the other, pinched the four corners neat, and set them between us—and left his hand resting on top."

[tracks.bond_salih.chapters.s.choices.promise]
text = "Agree: in every town I reach, I’ll ask after a book for him; every book he finds, he’ll write to tell me."
hint = "A book for every city, traded for a lifetime. What we share can’t string that long a strand yet—or I’ve already strung it for someone else."
reply = "I took the pen and, on the sheet of towns, left a gap after every name: when I got there I’d ask at the mosque, ask in the market, sit on the docks chewing betel with the old captains and ask them. On the sheet of books he left a gap after every title too. “Every one I find, I’ll write. Each name on here I cross out, I’ll tell you about.” He separated the sheets, pushed one to me and kept the other. “When both sheets are full, we’ll check them against each other.” I folded mine and put it under the pen case. The day I left he didn’t go to the lecture; he walked me all the way out to the caravan beyond the walls, hands tucked in his sleeves, his sheet tucked in with them. Only when the camel bells began did he take his hands out and press one on my shoulder. “My brother, go slowly on the road. The books aren’t going anywhere.”"
effects = [{ }, { }, { title = "Cities and Books" }, { }, { }, { }]

[tracks.bond_salih.chapters.s.choices.heart]
text = "Make him a rubbing of my Kilwa coin, trade it for the poem from the flood night, and say nothing."
hint = "The rubbing is done, but I can’t bring myself to trade it for his poem. My heart hasn’t risen that high yet—or I’ve already given such feelings to someone else."
reply = "I felt under the brass case of gold weights and took out the coin. A sultan of Kilwa had struck it; the letters were worn shallow. It had been my mother’s. I borrowed a sheet of his paper, laid the coin underneath, and rubbed lightly with a stick of charcoal until a circle came up, and inside it the letters rose one stroke at a time. I pushed the rubbing across to him and said nothing. He looked at it a long while. Then he took the little book of poems from the flood night out of his robe, opened it to that page, slipped the rubbing in, closed it, and pressed it flat. From between the pages he drew a sheet folded in half and handed it to me: the poem, copied out in his hand, the creases gone soft and furred from being folded who knew how many times. I folded it into a small square and laid it in the pen case, under the pens. The day I left he walked me to the caravan and held my hand a long time. The camel driver called twice before he let go."
effects = [{ }, { }, { }, { }, { title = "Cities and Books" }, { }, { }]

[tracks.bond_salih.chapters.s.choices.own]
text = "Agree to compare in ten years and see who has strung together more."
reply = "“Towns are easier to find than books,” he said. “You have the advantage.” Books are easier to carry, I said—I can’t exactly haul a town back to Cairo. He laughed, separated the sheets, and at the top of his wrote a number: zero. On mine he wrote a zero too. “Then we’ll compare. In ten years, whoever’s number is bigger buys dinner.” We’d need someone fair to judge, I said. The teacher would be fair, he said—and then stopped short. The teacher was past seventy that year. He traced over the zero once more and left it there. The day I left, he folded his sheet into his sleeve, walked me to the caravan, and wagged one finger at me. “Zero. Don’t forget—we both started from zero.”"

[tracks.reunion_salih]
name = "Salih: Reading for Those Here Today"

[tracks.reunion_salih.chapters.reunion]
title = "Reading for Those Here Today"
text = "In 1563 I came into Cairo again. The colonnade at al-Azhar still had the same pillars. The blind teacher had died two winters back, and a new master taught the circle now. Salih sat beside the lecturer, repeating for the back rows that couldn’t hear: the lecturer read a line, Salih gave it again, his voice as slow as ever. When it was over he took a volume down from the shelf and handed it to me—the teacher’s catalog, finished, sewn, in a new leather cover. I turned to the last page. The last line was in his hand: “Kilwa: the story of a town, in the mouth of a gold trader’s son.” I looked up. The courtyard had emptied. From inside his robe he took a reed pen, the nib worn, the shaft rubbed dark. I knew it. It was the fifth one. “All these years,” he said, “I’ve been writing to you with this.”"

[tracks.reunion_salih.chapters.reunion.variants.with_ilhan]
text = "In 1563 I came into Cairo again. The colonnade at al-Azhar still had the same pillars. The blind teacher had died two winters back, and a new master taught the circle now. Salih sat beside the lecturer, repeating for the back rows that couldn’t hear: the lecturer read a line, Salih gave it again, his voice as slow as ever. Outside the pillars stood a man in the robe of a clerk from the governor’s palace, arms folded, waiting. Salih followed my eyes. “That’s the one who goes to see the water with me every year when the river rises.” When it was over he took a volume down from the shelf and handed it to me—the teacher’s catalog, finished, sewn. I turned to the last page. The last line was in his hand: “Kilwa: the story of a town, in the mouth of a gold trader’s son.” From inside his robe he took a reed pen, the shaft rubbed dark. It was the fifth one. “All these years,” he said, “I’ve been writing to you with this.”"

[tracks.reunion_salih.chapters.reunion.default]
effects = [{ text = "My brother, you didn’t come to Cairo this year. No matter. Letters travel slower than people, but they travel farther. The teacher died two winters ago. In his last month he had me read the catalog through from the beginning every day, and at each book he would say whose shelf it was on and who had borrowed it and never brought it back. The book from Zabid went back to its owners last year; I found someone to carry it. The family had long forgotten all about it; they took the book and gave the man who brought it a bowl of coffee. The catalog is finished and sewn. I’ve copied the last page for you. The last line is my own addition; the teacher never said it. He didn’t object. When I read it to him he smiled a little and said, “I’ve never read that book, but I’ve heard it.” These days I’m the one repeating for the back rows. Sometimes in the middle of a line I think of someone in the last row telling a story about a monkey and a shark. Write and tell me some of the towns you’ve strung together. On my side, several names have been crossed out. —Salih. Enclosed, a copy of the catalog’s last page: … The Pearl Necklace, poems, by a man of Zabid. Returned. The Blind Man’s Lamp, dictated by the teacher, written down by Salih. Unfinished. Kilwa: the story of a town, in the mouth of a gold trader’s son." }, { }]

[tracks.reunion_salih.chapters.reunion.choices.friend]
text = "Tell him, town by town, the places I’ve strung together, and let him match them to books."
reply = "I started with Kilwa. In Mombasa an old shaykh kept a book on the stars, half of it eaten by termites. In Malindi the great mosque had a commentary on the Qur’an locked in a cupboard, and the key hung at the imam’s wife’s belt. In Lamu a blind storyteller could recite every sultan of Kilwa from first to last without a book in sight. For each town I told, Salih turned a page of his old sheet; when it matched he made a dot, and when it didn’t he added a line beside it. We went on till dark, till they lit the lamps in the courtyard, and more than half the towns and books had met. The rest he folded up and pressed into my hand. “The rest we’ll find together. We start in Lamu, with the storyteller—he doesn’t need a book, so I’ll write him down.”"
effects = [{ }, { }, { }, { title = "Reading for Those Here Today" }]

[tracks.reunion_salih.chapters.reunion.choices.love]
text = "Ask him to read the poem from the flood night once more—looking at me this time."
hint = "That page—he may not be willing to read it again today. What went unsaid back then gets as far as my lips and stops there."
reply = "He didn’t reach for the book. He looked at me and began at the first line, not a word wrong, and at the line where the man waits by the river for someone, he paused. “I’ve practiced it seven years,” he said. “Before I read it to you the first time, I’d practiced it twenty times to an empty room.” I know, I said. That night you never once looked at the page. He froze, and his ears slowly went red. “Then why didn’t you say anything?” “If I had, you’d have stopped reading.” He laughed until his shoulders shook. Then he stood, took my hand, and led me to the pillar behind the lecture circle, where he had read for the teacher all those years. He kissed me, very lightly, as if afraid of knocking the words loose. “Today’s reading,” he said, “is done.” When the northeast wind rose that season, I sent the ship south ahead of me and stayed another season in Cairo. Every season after, I came back."
effects = [{ }, { }, { }, { title = "Reading for Those Here Today" }]
