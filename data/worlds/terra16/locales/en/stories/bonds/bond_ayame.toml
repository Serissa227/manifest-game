# C7：bond_ayame / reunion_ayame 的英文显示覆盖（按轨道、章节、选项与变体的 key 对应）；不复制玩法。
# C21b 审读后（2026-11-12）：好感方向改了、或手册点名删掉的原句所在的章，英文整章删掉回退中文：bond_ayame.c2、bond_ayame.b1、bond_ayame.a1。

[tracks.bond_ayame]
name = "Ayame: Not One Sleeve Out of Place"

[tracks.bond_ayame.chapters.c1]
title = "Not One Sleeve Out of Place"
text = "Spring of 1554, my first day at court. The senior lady’s rooms were at the end of the gallery, the paper door shut, and a girl about my age was already kneeling outside it. She smoothed her left cuff, then her right, then started over from the left, and only after the third time did she rest her hands on her knees. I knelt beside her. Her eyes went to my right hand: the web of my thumb was black with ink, from settling the boatman’s accounts on the Yodo River that morning. Without a word she drew a damp cloth, folded into a neat square, from her sleeve and held it out. “Thanks,” I said. “On a boat, if the books aren’t clear, there’s a fight.” “This is not a boat.” Her voice was quiet, and every word landed exactly where it belonged. “Straighten your sleeves before you speak.” She said it steadily, but the hand holding the cloth was shaking, the fingertips trembling. She felt it too, drew the hand back, and hid it in her sleeve, fingers, cloth, chill and all. Behind the door, the senior lady cleared her throat."

[tracks.bond_ayame.chapters.c1.choices.wipe_ink]
text = "Take the cloth, scrub the ink off right in front of her, and go in together."
reply = "I scrubbed until my skin was pink and held my hand open for her. Only then did she nod once, take the cloth back, and fold it into its square again. When the door slid open she turned aside so I would walk half a step behind her. The senior lady asked our houses. She answered first: “Ōinomikado. Ayame.” Not a word wrong, even the pause measured. When my turn came I copied her pause exactly. The senior lady looked at her, then at me, and found nothing to correct."

[tracks.bond_ayame.chapters.c1.choices.hand_back]
text = "Laugh that Tosa sea wind is harder to wash off than ink, and hand the cloth back for her own fingertips."
reply = "She went red to the ears, murmured, “Forgive me,” and pulled her hand, cloth and all, back into her sleeve. Inside, she answered the senior lady without a single slip, and never once looked my way. She didn’t speak to me for the rest of the day. That evening, when I came back to our room, a new ink stick lay beside my inkstone, wrapped in paper folded perfectly square, with no name on it."

[tracks.bond_ayame.chapters.b2]
title = "The Mended Robe"
text = "That first month of 1555, before the era name changed, the court could barely scrape together the money for the New Year banquet. When the senior lady spoke of it, she only sighed: “Such are the times.” The Ōinomikado house was pinched as well. People in our quarters whispered that Ayame’s mother had sent her best robe, the one kept at the bottom of the chest, to the pawnbroker. From then on Ayame came on duty in an old unlined robe, washed pale, her cuffs as perfect as ever, the creases sharp as a blade. That day she knelt in front of me putting away the incense things, and as she bent I saw a mend between her shoulder blades: coarse, crowded stitches, the thread a shade off, plainly sewn in a hurry by lamplight. She must have felt me looking. She set down the incense box and straightened her back all at once, without turning around. “A mended robe is still a robe,” she said. “I never said it wasn’t.” “Your eyes said it.” She closed the box and smoothed her cuffs again. “You may light today’s incense, Lady Mio.”"

[tracks.bond_ayame.chapters.b2.choices.mend_seam]
text = "Borrow the robe at night, unpick the mend, and resew it with the stitches hidden in the fold."
hint = "She holds that robe tight against her. She doesn’t trust you with the torn place yet."
reply = "At first she wouldn’t. Then, in the middle of the night, she left the robe folded beside my pillow and went back to bed without a word. By the last of the lamp I unpicked the patch, found a closer thread, and sewed it back along the fold, stitch by stitch. The next day she put it on and turned once before the mirror, then once more. When she came off duty there was a packet of dried persimmons by my pillow, and on the wrapper, in her upright hand: “Your stitches are better than mine.”"

[tracks.bond_ayame.chapters.b2.choices.say_nothing]
text = "Pretend not to see, and stand behind her on duty so the seam stays hidden."
reply = "All that day, wherever she went, I was half a step behind her. At last the senior lady couldn’t help asking, “Mio, since when are you Ayame’s shadow?” Everyone laughed. Ayame glanced back at me. She didn’t laugh, and she didn’t tell me, as she usually did, that I swung my arms too wide when I walked. It was the first time she let my walk go."

[tracks.bond_ayame.chapters.a2]
title = "A Fan with a Correction"
text = "After the Chrysanthemum Festival, Ayame brought me a fan she had written herself: an old poem on the front, one of her own on the back. I turned it to the lamp. In the third line of the back, one spot was thinner than the rest, the surface faintly furred. It had been scraped with a knife and one character written over. She had scraped it so carefully you couldn’t see it unless you leaned close. “I made a mistake there,” she said quickly. “I meant to write another, but this was my only set of ribs.” From her sleeve she took a small trimmed slip of paper, its corners rounded, exactly the color of the fan. “If I paste this over it, no one will see.” “Don’t.” She held the slip and didn’t move. She looked at the fan, at the slip, at the fan again, for so long I thought she would paste it on anyway. Then she folded the slip in half, and in half again, and put it back in her sleeve."

[tracks.bond_ayame.chapters.a2.choices.keep_scrape]
text = "Take the fan, scrape and all, and ask her to write the date of the correction beside it."
hint = "She still won’t let go of the fan. You aren’t close enough for her to hand you something flawed."
reply = "She wrote a line of small characters beside the scrape, the day she had made the correction, and beneath it added one still smaller: Ayame. “This is the first thing I have ever given away without getting it right.” She closed the fan and held it out. “Don’t show it to anyone.” I was about to tuck it into my robe when she added, “But use it every day.”"
effects = [{}, {}, {}, { title = "A Fan with a Correction" }]

[tracks.bond_ayame.chapters.a2.choices.ask_perfect]
text = "Ask her to write you another after all, without a single scrape."
reply = "Ten days or so later she had actually written another. Where she had borrowed the ribs, she wouldn’t say. She laid the two fans side by side in front of me. “Choose for yourself, Lady Mio.” I chose the one without the scrape. She nodded, closed the other, put it away in her sleeve, and rose to take her leave. At the door her cuffs were neater than when she had come in."

[tracks.bond_ayame.chapters.s]
title = "We Will Compete Again"
text = "In the twelfth month a ship from Tosa was waiting for me at Sakai, to put to sea in spring. On my last night Ayame came to our quarters to see me off, carrying a stack of pocket paper trimmed perfectly even: for poems on the road. “I intend to keep competing with you in poetry,” she said, kneeling, her hands in her sleeves. “Only, there is no need to write in every letter who won and who lost.” “Then how will you know whether you won?” “I will know.” She paused. “So will you. Writing it down would be like asking the senior lady to judge.” I counted the paper: twenty sheets, not one more or less. She watched me count and didn’t stop me, and only when I finished did she ask, “Do people on ships count paper this fast too?” “People on ships count everything fast.” She drew her hands out of her sleeves and laid them on her knees, and didn’t hide them again."

[tracks.bond_ayame.chapters.s.choices.promise]
text = "Promise to send her a poem every year to find fault with, and to fault one of hers in return."
hint = "A promise like this needs a deeper friendship. And if you have already given someone a lifelong promise, this time you can only wish each other well."
reply = "“Faults only,” she said. “Not one word of praise will I accept.” “And if I can’t find any fault in yours?” “Then you have not looked closely enough.” She took a sheet from her sleeve, asked exactly where I could be reached in Tosa, and wrote it out stroke by stroke: the province, the district, the boatman’s house name, and she wouldn’t set brush to paper for the ferry landing until she had its old name too. She blew the ink dry, folded the sheet, and put it in my hand, and only then did I notice there wasn’t a speck of ink on her cuff. “One poem every spring,” she said. “If it comes late, I will take it as your surrender.” I said ship dates were hard to promise. She said then I had better write early. Outside, a cold shower began, like the one the day that gathering broke up."
effects = [{}, {}, {}, {}, {}, { title = "We Will Compete Again" }, {}]

[tracks.bond_ayame.chapters.s.choices.own]
text = "Agree that next time you meet, you’ll hold a proper contest, judged by the rules."
reply = "“Agreed,” she said at once. “We shall have a judge, and the loser may not beg off.” She thought a moment and added, “And no writing poems in sailors’ talk.” “I can’t promise that. Some of the things they say at sea sound better than anything at court.” She glared at me, glared a while longer, and suddenly laughed: no sleeve over her mouth, no lowered head, her shoulders shaking, not a rule in sight. I had known her nearly three years and never seen her laugh like that. When she stopped she looked startled at herself and hurriedly smoothed her cuffs. Then she pulled one sheet from the stack, wrote on it “Twelfth month of Kōji 2: one poetry match, owed, not yet held,” and folded it into the very bottom of my baggage. “This match is on record. When the time comes, produce it. No wriggling out.”"
effects = [{}, {}, {}, { title = "We Will Compete Again" }, {}]

[tracks.reunion_ayame]
name = "Ayame: I Ask First"

[tracks.reunion_ayame.chapters.reunion]
title = "I Ask First"
text = "In 1561 business brought me back to Kyoto, with a gift list to deliver to a noble house. I remembered most of how it was done, but not all, so I went to the palace to find Ayame first. These days she served at the senior lady’s side. When I arrived she was kneeling across from a new trainee of eight or nine, teaching the child to smooth her cuffs. “Left first, then right. When you are done, hands back on your knees, and no touching them again.” The child smoothed them three times; only the third time came out flat. An old lady-in-waiting nearby was still talking about last year: Emperor Ōgimachi’s enthronement had been put off for years and had finally been held, paid for by the Mōri of the western provinces. Ayame didn’t join in. She looked over my gift list, changed one fold, showed me how to hand it over, then leaned down to straighten the child’s crooked cushion, and only then turned to face me. “The people you meet these days,” she asked, “how do they bow?”"

[tracks.reunion_ayame.chapters.reunion.default]
effects = [{ text = "Mio: This year I never managed to see you. Here, everything is as it was. The senior lady has given me the new trainee to teach. She is eight, and smooths her cuffs three times before they lie flat, as I used to. Last year the enthronement was at last held, and the palace got through a winter without borrowing lamp oil from anyone. I enclose a recent poem. Please find its faults. Faults only; I accept no praise. —Ayame" }, {}]

[tracks.reunion_ayame.chapters.reunion.choices.tell_bows]
text = "Show her, one by one, all the bows you’ve seen over the years."
reply = "I started with the Portuguese at Macau: hat off, half a step back, a bend at the waist. Then a Ming official’s salute, hands clasped and pushed out from the chest; then a Ryūkyū envoy’s kneeling bow. Ayame knelt and watched more intently than she had once watched me carry a tray. When I got to the Siamese one, kneeling, palms pressed together and raised above the brow, then bowing down three times, she lifted a hand to stop me. “We have nothing like that at court. Please, once more.” I did it again. She beckoned the little trainee over and had her copy me, watching from the side. The child’s attempt was all crooked; Ayame reached out and set the small hands level. “Get it right first. Whether it looks well can wait.” Then she glanced at me, as if she had caught how familiar that sounded, and tucked her hands back into her sleeves. Before I left she drew the Siamese bow on a sheet of pocket paper, folded it with the corners meeting exactly, and put it in the book she used for teaching trainees."
effects = [{}, {}, {}, { title = "I Ask First" }]

[tracks.reunion_ayame.chapters.reunion.choices.one_more_match]
text = "Challenge her to a poetry match tonight, with the little trainee as judge."
reply = "She said court poetry matches were not to be held so carelessly, and went straight off to fetch paper. The trainee drew the topic: “Homeward Sails.” I wrote the wind off a ship’s stern; she wrote the sea that can’t be seen from inside the palace walls. The child held the two sheets and read them for ages, then went red and pointed at Ayame’s. “That doesn’t count,” said Ayame. “I taught her. She’s biased.” “So I win?” “It is a draw.” We argued over the word “draw” until the lamp oil ran out, and the trainee fell asleep across her cushion. Ayame took off her outer robe and laid it over her. The child rolled over and mumbled in her sleep, “Lady Ayame wins.” Ayame pretended not to hear and turned back to me, voice low. “Next time we find a judge who doesn’t know me.” “And when is next time?” “Whenever your ship comes back.”"
effects = [{}, {}, {}, { title = "I Ask First" }]

[tracks.reunion_ayame.chapters.reunion.variants.promised]
text = "In 1561 business brought me back to Kyoto, with a gift list to deliver to a noble house. All these years a poem had come from her every spring; I sent it back with a fault or two marked, and her reply was always one word: “Received.” I wasn’t sure how the gift list should be handed over, so I went to the palace to find her first. These days Ayame served at the senior lady’s side, and she was kneeling across from a trainee of eight or nine, teaching the child to smooth her cuffs. “Left first, then right. When you are done, hands back on your knees, and no touching them again.” An old lady-in-waiting nearby was still talking about last year: the enthronement had been put off for years and had finally been held, paid for by the Mōri of the western provinces. Ayame looked over my list, changed one fold, showed me the gesture, then leaned down to straighten the child’s crooked cushion, and only then turned around. “The people you meet these days,” she asked, “how do they bow?”"

[tracks.reunion_ayame.chapters.reunion.variants.rematch]
text = "In 1561 business brought me back to Kyoto, with a gift list to deliver to a noble house. The match we had put on record the year I left had never been held. I wasn’t sure how the gift list should be handed over, so I went to the palace to find Ayame first. These days she served at the senior lady’s side, and she was kneeling across from a trainee of eight or nine, teaching the child to smooth her cuffs. “Left first, then right. When you are done, hands back on your knees, and no touching them again.” An old lady-in-waiting nearby was still talking about last year: the enthronement had been put off for years and had finally been held, paid for by the Mōri of the western provinces. Ayame saw me, and her first words were, “I have not forgotten that match.” She looked over my list, changed one fold, showed me the gesture, then leaned down to straighten the child’s crooked cushion, and only then turned around. “The people you meet these days, how do they bow? Before we compete, I need to know how many bad habits you’ve picked up out there.”"
