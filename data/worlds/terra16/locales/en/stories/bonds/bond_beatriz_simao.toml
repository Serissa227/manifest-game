# 开窗的人（bond_beatriz_simao）与有窗的病房（reunion_beatriz_simao）的英文覆盖：按轨道、章节、选项的 key 写显示文字，不含玩法字段。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Beatriz, Duarte, Lisbon, the Rossio, the Hospital of All Saints, the Tagus, Mina, Viseu, the Gulf of Guinea.

[tracks.bond_beatriz_simao]
name = "Beatriz: The One Who Opens Windows"

[tracks.bond_beatriz_simao.chapters.c1]
title = "Ask the Name First"
text = "The sailors’ ward of the Hospital of All Saints is in the east arm of the cross-shaped building, beds jammed side by side, the windows set higher than a man’s head. An old sailor off a Brazil ship lies burning with fever, his lips cracked, while his son crouches by the bed and talks for him: “Cold at night, hot all day, won’t eat, what he coughs up is yellow.” I copy it down line by line, as fast as I can write. A hand presses my pen flat. Beatriz isn’t looking at me; she’s looking at the man in the bed. “Ask him his name first.” Then she drags a stool under the high window, climbs up and wrenches at the bolt. “Open the window first. The air in here would make a healthy man sick.” The bolt gives with a squeal. Wind pours in from the Rossio, smelling of chestnut smoke. The old man squints, takes two breaths, and pushes his son’s hand away. “I’m João.” Then he tells us how, the day they crossed the line, the cook let the last chicken loose, the whole crew chased it half the afternoon, it flew to the masthead, and the captain forbade anyone to shoot it—said it had more sense than the lot of them. He laughs until he coughs, and his son has to thump his back. Beatriz steps down off the stool and looks up at the other high window. Its bolt has rusted into a lump."
news = "At the Hospital of All Saints by the Rossio, the high windows in the sailors’ ward stayed shut all winter until the girl from next door to the doctor’s climbed a stool and forced them. The patients swear they can breathe again."

[tracks.bond_beatriz_simao.chapters.c1.choices.pull_bolt]
text = "Knock loose the rusted bolt on the other high window for her."
reply = "The bolt is stuck fast. I pick up a broken brick, wrap my sleeve around it, and it takes three blows before it gives. When the wind comes in, the whole room draws breath at once; even the bed at the far end that’s been moaning all morning goes quiet. Beatriz tips her head back at the window. “I’ve been hammering at that one for two weeks. Broke two bricks on it.” She takes the brick from my hand and drops it into her apron pocket. “I’m keeping this. The next stuck bolt is yours.”"

[tracks.bond_beatriz_simao.chapters.c1.choices.ask_name]
text = "Bend down and find out which João he is before I write a word."
reply = "“Which João?” The old man grins. “Half the ship is João. Write João and you’ve written nothing. Write ‘João with half an ear.’” He turns his head to show me: the top of his left ear is gone, sliced off by a hawser in the Gulf of Guinea. I write it down just like that. Beatriz laughs out loud beside me and leans over to read my page. “Put it that way and we’ll know him even when the fever’s got his wits.”"

[tracks.bond_beatriz_simao.chapters.c2]
title = "The Hands That Change the Dressing"
text = "A sailor off the Mina ship has a gash in his leg gone to pus, the dressing grown into the flesh. The physician says it comes off today. Beatriz carries a basin of warm water over, and at the bedside her face goes white, white as her apron. Yet the hand peeling back the cloth doesn’t shake at all; layer by layer it comes away. At the last layer the sailor howls. “Easy! You’re skinning a fish!” Only then do I see her other hand: clamped on the bed rail, knuckles gone blue. “Cloth,” she says. I pass it. “Another.” Before long the water in the basin is red through. When it’s done she pushes the basin into my hands and walks to the window, and stands there with her back to the room for a long time—long enough for the friar in the corridor to finish a whole passage of his office. When she comes back there’s still no color in her face, but her voice is the same as ever. “Next.”"
news = "The sailors’ ward at the Hospital of All Saints has been changing dressings till dark all summer. Everyone says the girl from next door to the doctor’s does it faster and cleaner than anyone, and the sailors she scolds end up thanking her."

[tracks.bond_beatriz_simao.chapters.c2.choices.hold_basin]
text = "Without a word, hold the basin and pass the cloths, standing where she can’t see the wound."
hint = "She waves you back—you aren’t close enough yet for her to let you watch her shake."
reply = "The next one is a knife wound in the shoulder. I stand at the head of the bed with the basin, square between her and the open wound, so all she has to watch is her own hands. She’s quicker this time than last. When we’ve cleared up she thanks me under her breath, then adds, “Don’t tell the physician.” “Tell him what?” She gives me a look, says nothing more, and carries the basin of red water out to empty it."

[tracks.bond_beatriz_simao.chapters.c2.choices.offer_swap]
text = "Tell her: “I’ll change it. You write.”"
reply = "She shakes her head. “This is my job.” But she lets me take the head of the bed and hold the patient’s shoulders. The next one is a big bearded man who starts cursing the moment the cloth lifts, working his way from the saints down to his captain. Beatriz curses right back as she works. “You fell off a gangplank dead drunk, and you’ve got the nerve to swear at me?” She’s louder than he is, loud enough to shut him up. Afterward, at the basin, I see four crescent-shaped nail marks in her palm, red going on purple."

[tracks.bond_beatriz_simao.chapters.b1]
title = "The September Fleet"
text = "In September the India fleet comes up the Tagus, and in a single day the sailors’ ward is full. The men with scurvy have gums swollen black that bleed whenever they open their mouths, and a thumb pressed into their legs leaves a pit. The physician can’t keep up, so he gives each of us apprentices a book of our own: let’s see who records fastest and most completely. I hand mine in first—twenty-one beds, names, where it hurts, how many months aboard, nothing missing. The physician leafs through it and nods. Beatriz hands hers in last, after dark. “Bed seven—I wrote one more line.” The physician lays the two books side by side and reads her line aloud: “Asks: is António alive?” The man in bed seven talked to me about António too. I took it for fever talk. “He asked three times,” Beatriz says. “Same ship. He saw António carried off the deck and never saw him again.” The physician sets her book on top of mine. “This one counts.” Mine is still open on the table. My handwriting is neater than hers."
news = "The India ships are back, and the sailors’ ward at the Hospital of All Saints filled up in a day. They say the physician set the apprentices racing to record the sick, and it was the girl who finished last who got the praise."

[tracks.bond_beatriz_simao.chapters.b1.choices.redo_round]
text = "Walk the ward again with her and ask every bed the one thing they most want to know."
reply = "We go from bed one to bed twenty-one. Nine of them ask about someone else—a shipmate, a cousin who signed on with them, the cook who owed them money—whether he made it. Beatriz copies the nine names onto a sheet and folds it twice. “Tomorrow we go down to the quay. They haven’t finished unloading; someone will know.” Two steps on, she turns back. “You’re coming. You write fast, and the quay’s a crush.”"

[tracks.bond_beatriz_simao.chapters.b1.choices.ask_method]
text = "Ask her how she gets it all down in one go."
reply = "“First you ask his name. Then where it hurts worst. Last, whether there’s anything else he wants to say.” She counts them off on her fingers. “The last one matters most. The first two are so he’ll be willing to answer it.” The next day I go round the beds her way. At the third, the sailor grips his blanket and weeps: his mother is in Viseu, and he shipped out without a word to her. I write that down too."

[tracks.bond_beatriz_simao.chapters.b2]
title = "The Page the Steward Wanted"
text = "A steward in black broadcloth comes to the ward, cuffs pressed sharp, on business for some great house. He wants to see the record for the sailor in bed twelve: the sailor says he broke his leg aboard ship; the house says he was lame before he ever sailed, and his wages should be docked by half. “The records aren’t for outsiders,” Beatriz says. The steward smiles. “Little girl, this is the king’s hospital.” “It’s his sickness.” The smile goes. He says he’ll see the director tomorrow and find out whether the director says the same. On his way out he stops in the doorway, looks over every man in the ward one by one, and gives bed twelve a second look. The door has barely shut when Beatriz turns and shoves the book into my arms, the cover still damp where she was gripping it. “Hide it for me tonight,” she says, low. “He’ll search my house.”"
news = "A steward from some great house in Lisbon turned up at the Hospital of All Saints wanting to go through a sailor’s case notes so he could dock the man’s pay. Word is the girl who keeps the ward book stood in the door and wouldn’t let him."

[tracks.bond_beatriz_simao.chapters.b2.choices.hide_ledger]
text = "Bury the book under the soap in the dispensary crate and get through the night."
hint = "She only hands this kind of thing to someone she trusts—you two aren’t there yet."
reply = "The crate in the dispensary is stacked with cakes of rosemary soap. I lay the book flat at the bottom and stack them back over it. I sleep badly and get up twice to check. Next morning the director comes, as promised. Beatriz tells him the record is here, but bed twelve has to agree before anyone sees it. The director goes and asks. The sailor turns his face to the wall. “No.” The steward leaves. She pulls the book out from under the soap and holds it to her nose. “There. This book will smell of rosemary for the rest of its life.”"

[tracks.bond_beatriz_simao.chapters.b2.choices.fetch_physician]
text = "Go and get the attending physician to stand in the way."
reply = "The physician comes and talks at the steward for a good while—the king’s bounty, the rules of the house—and in the end lets him look at the cover and sends him off. The moment he’s gone, Beatriz pulls a long face. “The cover is the record too.” The physician pretends not to hear. She tells me that next time she’ll do the blocking herself. “Next time,” I say, “we’ll do it together.” She glares at me and carries the book away, without a yes or a no."

[tracks.bond_beatriz_simao.chapters.a1]
title = "Why She Fears Blood"
text = "It’s Lent, and a few beds in the ward have emptied. Beatriz has been at it from morning till afternoon—eleven patients written up, four dressings changed, not a sip of water, her lips cracked white. I pour a cup and set it at the corner of the table where she’ll see it the moment she looks up, and I don’t call her. She writes another half page before she notices. She drinks half, sits down, and wipes her hands twice on her apron. “You saw it ages ago, didn’t you,” she says. “That day with the dressing.” I don’t answer. “When I was seven, my mother had my little brother.” She turns the cup in her hands. “The midwife wouldn’t let me in, so I sat outside the door all night. They kept carrying basins of water out. All of them red. By morning my brother was gone, and my mother had lived.” She puts the cup down. “Ever since, the sight of blood makes my head swim. So I made myself learn dressings. Let it swim. The hands don’t stop.” She opens her left hand to show me: a row of crescent marks across the palm, new ones over old."
news = "The sick are fewer this Lent at the Hospital of All Saints, but the girl who keeps the ward book still changes four dressings a day. The dispensary folk say she goes all day without so much as a mouthful of water."

[tracks.bond_beatriz_simao.chapters.a1.choices.bring_water]
text = "Push the last half cup toward her, hear her out, then leave her to sit a while alone."
reply = "I’m at the door when she calls after me. “Are you coming tomorrow morning?” I say yes. “Good.” She’s already bent over her half page again. “Bed three needs changing tomorrow. It’s deep. You’re holding the basin.” As I pull the door to, I hear her finish the water."

[tracks.bond_beatriz_simao.chapters.a1.choices.stay_late]
text = "Don’t leave. Sit with her until the vespers bell has rung."
hint = "Stay now and she’ll only feel someone has seen her soft side—you aren’t close enough yet."
reply = "She doesn’t say anything more, and neither do I. The light goes little by little; out in the square a water-seller’s cart creaks away into the distance. When the vespers bell has finished, she reaches over and presses the back of my hand, lightly, and takes hers back just as quickly. “Time to shut the window.” She gets up, goes to it, and rests her hand on the bolt. Stops. “Never mind. Leave it open.”"

[tracks.bond_beatriz_simao.chapters.a2]
title = "Rosemary Soap"
text = "One day Beatriz sets a cloth bundle on my notebook and waits, saying nothing, for me to open it. Inside is a cake of gray-green soap, square, its edges still ragged from the knife, smelling sharply of rosemary. “I made it,” she says. “Wash your hands once before you change a dressing and once after. At sea too. However dear the water is aboard, you don’t skip those two.” I pick it up and smell it. She adds, “It’s the first one that set. The three pots before it all went wrong—one too runny, one too hard, one burned on the bottom. My mother says the kitchen stank of scorched rosemary for two weeks.” Then she takes the soap back and holds it in her open palm, neither handing it over nor putting it away."
news = "The girl next door to the doctor’s in Lisbon has been making rosemary soap at home. Three pots spoiled, half the street smelled burning for two weeks, and the fourth finally set."

[tracks.bond_beatriz_simao.chapters.a2.choices.wash_together]
text = "Take her out to the courtyard trough and wash our hands with it, right now, together."
hint = "She wraps the soap back up—you two aren’t close enough for her to share the first cake with you."
reply = "The water in the trough is cold. She washes slowly, between the fingers, around the nails, the wrists, working each place till it foams green. I copy her. When we’re done she shakes her hands dry, wraps the soap in a dry cloth and then in oiled paper, and presses it into my hands. “If a piece goes missing at sea, don’t come asking me for more.” A moment later she takes it back. “If it runs out, write to me.”"
effects = [{}, {}, {}, { title = "Rosemary Soap" }]

[tracks.bond_beatriz_simao.chapters.a2.choices.rosemary]
text = "Take it, and tell her that from now on rosemary will always mean this ward, and the one who opens windows."
hint = "Those words won’t come out yet."
reply = "She bends her head and wraps the soap in a cloth, and another, and another, until it’s a little pillow. “Don’t talk nonsense.” She pushes the bundle at me and turns to straighten the medicine shelves, the tips of her ears red. After a long while, with her back still to me, she says, “The ward windows—I’ll keep them open for you too.”"
effects = [{}, {}, {}, {}, { title = "Rosemary Soap" }]

[tracks.bond_beatriz_simao.chapters.a2.choices.ask_recipe]
text = "Ask her for the recipe."
reply = "She lists it piece by piece: olive oil, lye run off wood ash, rosemary steeped in the oil for seven days, boiled till it pulls into threads off a wooden spoon. I write it in my notebook. She leans over, looks, and jabs a finger at it. “Two bowls of lye, not three. Make it your way and you’ll get something you can crack walnuts with.” I correct it. She wraps the soap up again and tucks it back into her own apron pocket. “I’m keeping this one. Make it from the recipe and bring me what you get.”"

[tracks.bond_beatriz_simao.chapters.s]
title = "The Window Left Open"
text = "December. The spring sailing is settled, and I’m going to sea. On my last day at the ward, Beatriz has bolts of cloth spread down the long table and is folding them piece by piece, tying them into small bundles with twine. Weighted down at the corner of the table is a sheet crowded with writing: what to do for fever, for bleeding gums, for swollen legs, and after each line a little drawing—a leaf, a bowl, a window. “Most men aboard can’t read,” she says without looking up. “Anyone can read a picture.” She’s staying at the Hospital of All Saints. The physician has agreed that from spring the sailors’ ward book is hers to keep. From now on she means to put one bundle of clean cloth and one sheet like this aboard every ship that sails. “Yours is the first ship I’m loading.” She ties off the last bundle and glances up at the high window. Someone has long since rubbed the rust off its bolt. “What day do you sail? Tell me exactly,” she says. “I have to time the cloth to it.”"
news = "From now on the sailors’ ward at the Hospital of All Saints will send every outbound ship a bundle of clean cloth and a sheet of remedies drawn in pictures. They say the girl who keeps the ward book ties every bundle herself."

[tracks.bond_beatriz_simao.chapters.s.choices.promise]
text = "Promise to write even when nothing has happened, and to come to the ward first thing when I’m back in port."
hint = "A promise like this needs you two to be closer—or the one promise of your life is already given to someone else. This time, all you can leave is an address."
reply = "“Then put names in your letters,” she says. “Not just the ship. I can see a ship’s name from the quay just by looking up. I can’t see the people.” I say I will. She goes to the back of the ward door, where a board is nailed up with the names of every sailor she’s written up these two years, line after line, a few with a small cross after them. She wets the pen and writes my name in the empty space at the bottom, a size bigger than the rest. “When you’re back in port, you come here first.” She taps the line with a finger. “If you don’t, I’ll count you in with the ones that have crosses, and don’t blame me when I add one after your name.” I tell her I’ll come. She pushes the first bundle she tied into my arms. “That one’s yours. Don’t you dare swab the deck with it.”"
effects = [{}, {}, {}, {}, {}, { title = "The Window Left Open" }, {}]

[tracks.bond_beatriz_simao.chapters.s.choices.heart]
text = "Tell her that the day I come back, she’s the one I want to see first."
hint = "The words won’t reach your lips—either you two aren’t there yet, or the one promise of your life is already given to someone else."
reply = "She doesn’t answer. She turns and shuts the high window. After a moment she pushes it open again. “It’s windy,” she says. I wait. She stacks the bundles on the table one by one until they’re straight, and only then speaks. “Then come back soon. The day you’re back, say it again, and I’ll answer you.” She walks me to the hospital door. The Rossio is full of people, an orange-seller is crying his wares, and she takes my hand for a moment. Her hand is rough from washing and smells of rosemary; she holds on hard and lets go fast. “Go on. Don’t look back. Look back and I’ll start shouting.” I don’t look back until the far side of the square. She’s still in the doorway with a half-tied bundle of cloth in her hand, the loose end of twine swinging in the wind. She doesn’t shout. She just lifts her hand and points at the row of high windows in the east arm—she’s keeping them open."
effects = [{}, {}, {}, {}, {}, { title = "The Window Left Open" }, {}]

[tracks.bond_beatriz_simao.chapters.s.choices.own]
text = "Each to our own: she keeps the ward, I go to sea, and nobody waits on anybody."
reply = "She nods, quick and clean. “That’s best. There are enough people waiting in this ward; I don’t need to add one more.” She pushes a bundle of cloth into my arms and tucks the folded picture sheet under its twine. “Come for more when it’s used up. Cloth has to be replaced. Whether you come back is your business.” I laugh, and so does she. Then she pulls another sheet off the table and draws a lopsided ship on the back, with three words underneath: “Get some air.” “Stick it up in the hold,” she says. “If anyone aboard falls sick and shuts himself in, slap this on his face.” At the door I look back. She’s already talking to a patient who’s just been carried in—the first question is his name, as always—and when she has it, she drags a stool over to reach the high window."
effects = [{}, {}, {}, { title = "The Window Left Open" }, {}]

[tracks.reunion_beatriz_simao]
name = "Beatriz: The Ward with Windows"

[tracks.reunion_beatriz_simao.chapters.reunion]
title = "The Ward with Windows"
text = "In the spring of 1562 I’m back in Lisbon, and the first place I go is the Hospital of All Saints. Every window in the sailors’ ward is open, not one missed, and the bolts are all new brass. The board behind the door filled up long ago; two more have been nailed beside it, and those are nearly full too. Beatriz sits at the far end of the long table, sleeves pushed to the elbow, drawing something in charcoal. She looks up, sees me, and freezes for a moment. Her first words are, “When did you get in? How many fell sick aboard, how many died?” Only then does she stand. The drawing is a new ward: a long room, two rows of beds, a window beside every bed. Duarte from the apothecary’s across the Rossio comes in with a crate of medicines, sets it down, nods to me, stands looking at the drawing a moment, says, “Changed it again,” and leaves. Beatriz holds the charcoal out to me. “You’ve lived on a ship all these years. Find me one thing wrong with this. You’re not leaving till you do.”"
news = "Every window in the sailors’ ward at the Hospital of All Saints stands open these days. Senhora Simão, who runs the ward, is drawing up a new one with a window beside every bed, and has redrawn it more times than anyone can count."

[tracks.reunion_beatriz_simao.chapters.reunion.default]
effects = [{ text = "The ward windows all have brass bolts now; not one has rusted. The board behind the door filled up, and two more have gone up beside it. I’m drawing a new ward, with a window beside every bed. The money is nowhere near there yet, but the drawing is on its ninth version, and every time Duarte brings medicines he counts the windows again. I hear you didn’t come back this spring. If anyone falls sick aboard, ask him his name first, write it down, and bring it to me when you’re in port. When your cloth runs out, come and get more. I’m keeping a bundle back for your ship. —Beatriz" }, {}]

[tracks.reunion_beatriz_simao.chapters.reunion.choices.find_flaw]
text = "Point at one spot: with that many windows it’ll be cold in winter—every window needs a draft board."
reply = "She takes the charcoal and adds a line under every window, fast, as if she’s drawn it before. “I thought of that ages ago,” she says. “I just wanted to see whether you’d spot it.” She turns the drawing to show me: under the north row of windows there’s already an old line, rubbed out. “The money’s still a long way off. The director looked at this and asked whether I was building a ward or a birdcage.” She rolls the drawing up and ties it with twine. “When there’s enough, I’ll build it. And the first bed goes to someone off your ship—write ahead and tell me his name and where it hurts.” I tell her that when anyone aboard falls sick, I ask his name first. She sniffs. “You learned that years ago. No need to show off to me.” As I leave, she has the drawing spread out again, and she’s going over that line under the north windows, making it darker."
effects = [{}, {}, {}, { title = "The Ward with Windows" }]

[tracks.reunion_beatriz_simao.chapters.reunion.choices.stay_here]
text = "Tell her I’m in no hurry to leave this time—I’d like to live somewhere near this ward."
hint = "When you left that year, the words never got this far. She won’t be the one to say them first today."
reply = "She puts the charcoal down. “Then first you learn to change a dressing without shaking.” I tell her I’ll learn. “I’ve seen plenty of people shake.” She looks at me. “You saw me shaking, that year, and never said a word.” She comes around the long table and rests her forehead against my shoulder, and keeps it there a long time. Out in the square someone is crying oranges, and the wind comes in gust after gust. “The window’s open. It’s windy,” she says into my shoulder. “Don’t move.” I don’t. After a long while she straightens, spreads the drawing out, and under the window nearest the door she draws a small bed, with my name beside it. “This one’s not for patients,” she says, and beneath my name she adds a line of small writing: “The day you came back. Answered.”"
effects = [{}, {}, {}, { title = "The Ward with Windows" }]

