# 苏玛：王子也要会算钱 / 摊位还是她的（bond_suma、reunion_suma）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、回忆标题、来信），玩法字段一律不写。
# 2026-10-12 C7 重写，与中文同一轮写完；美式拼写、弯引号。

[tracks.bond_suma]
name = "Suma: Even a Prince Must Count His Change"

[tracks.bond_suma.chapters.c1]
title = "Even a Prince Must Count His Change"
text = "In the Gresik market the cloth stalls are wedged between the fish sellers and the spice sellers. It’s the first time I’ve come to buy cloth on my own. I pick out a bolt of indigo, ask the price, drop a string of coins on the counter, tuck the bolt under my arm, and walk off. I haven’t gone three steps when someone grabs my sleeve from behind. It’s the girl who sells the cloth, a brown batik scarf wound around her head, not even as tall as I am. She hauls me back to the stall and, in front of a ring of onlookers, counts my change into my palm one coin at a time, calling out each one. When she’s done, she opens her other hand. There’s one more coin lying in it. “One short, and you’d never have known, would you? Even a prince has to count his change.” The fishmonger slaps his thigh. “Little prince, schooled by Suma!” That “little” is the word I can least stand. My face goes hot, but I’m not about to back down, so I smile and ask her whether a Ternate title is good for the bill. “Laugh all you like; the price stays.” Smack—she whisks the bolt back under the counter."

[tracks.bond_suma.chapters.c1.choices.count_again]
text = "Crouch by the stall, count the coins again, and start bargaining with her from scratch"
reply = "I thread the coins back onto their cord, and only once I’ve counted them do I open my mouth again. I name a price, she cuts it; three times over, until even the fishmonger winces for me. What I end up buying is just enough for one headcloth. She folds it into a neat square and hands it over. “That’s enough for your first lesson.” Then she laughs, and one crooked eyetooth shows."

[tracks.bond_suma.chapters.c1.choices.title_for_cloth]
text = "Keep teasing her: if a title won’t pay, how about a pantun?"
reply = "I clear my throat and recite a pantun about the clove trees flowering on the mountain at Ternate. She listens with her head tilted, then measures half a cubit off the bolt, snips it, and tosses it to me. “That one’s worth half a cubit.” I ask about the other half. She slaps the scissors down on the counter. “When you can recite one worth a whole cubit.” I take that half cubit back to the academy and use it as a bookmark for days."

[tracks.bond_suma.chapters.c2]
title = "Heckling from the Crowd"
text = "The pantun contest at the Giri academy has packed the yard in front of the lecture hall. When my turn comes in the first round, I recite one I know by heart: two lines about a clove ship at sea, two about a heart left waiting. Before the crowd has quite taken it in, a voice rises from below the platform. “The third line doesn’t rhyme!” I look for the voice and find the girl from the cloth stall in the market. So she studies here too. She’s sitting with the girls, fanning herself with a palm-leaf fan. The whole yard roars, and the master looks at me, waiting. On the spot I swap the last word of the third line and say it again. This time it rhymes. Suma nods and snaps her fan shut, like a judge. Then she opens it again and says to the girl beside her, loud enough for half the hall to hear, “It rhymes now. It just doesn’t sound any good.”"

[tracks.bond_suma.chapters.c2.choices.invite_her_up]
text = "Invite her up then and there to make that line sound good"
hint = "She still takes you for a prince who only knows how to put on airs. Ask her up now and she’ll think you mean to embarrass her in front of everyone."
reply = "She stares for a moment, then actually gathers up her skirt and climbs onto the platform. Standing beside me, she says the line through once and changes a single word. Suddenly the whole line runs smooth, and the cheering is louder than the laughter was. She tucks her fan back into her sash, and as she brushes past me on her way down she says under her breath, “You’ve got some nerve, for a prince.”"

[tracks.bond_suma.chapters.c2.choices.steady_next]
text = "Pretend not to hear, and make the next one rhyme even tighter"
reply = "I say my second pantun slowly, biting down on every line ending. Down below, that fan goes faster and faster. Twice she opens her mouth, and both times she can’t find anything wrong. When the crowd breaks up, she shouts at me through the crush, “That one wasn’t bad!” and then the girls drag her away."

[tracks.bond_suma.chapters.b1]
title = "Before the Wax Cooled"
text = "Suma drags me to her family’s workshop to learn batik. The yard is hung with drying cloth, and the reek of the indigo vats makes my eyes sting. She hands me a canting: a tiny copper pot set into a bamboo handle, its spout as thin as a rice straw. She shows me how to melt beeswax over the charcoal brazier, fill the little pot, and trace the charcoal lines on the cloth with a steady hand and steady breath. I’ve drawn a flower and a half when I get impatient to turn the cloth and see if the wax has gone through. It hasn’t cooled. I press with one finger and a whole patch of the pattern smears. Suma doesn’t scold me. She cuts the smeared piece out with her scissors and pushes it into my hand. “Keep it. It’s your sample. The first cloth a prince ever ruined.” Holding the scrap, I ask her whether even this can be sold. “First learn what can’t be,” she says, and drops another lump of wax on the brazier."

[tracks.bond_suma.chapters.b1.choices.do_it_again]
text = "Ask her for another piece, and this time wait until the wax is cold before turning it"
hint = "She glances at the wax on your fingers and says nothing. She isn’t ready to hand good cloth to someone who’s just ruined a piece."
reply = "She cuts me another piece. This time, when I finish drawing, I squat beside the cloth and wait until a whole stick of incense has burned down. I tap the wax with a fingernail; it’s hard. Only then do I turn it over. The flower is crisp, and it’s gone clean through to the back. Suma hangs the two pieces side by side at the workshop door, the smeared one and the good one. “They’re both yours. If anyone asks, I’ll tell them the prince of Ternate dyed them.”"

[tracks.bond_suma.chapters.b1.choices.keep_the_bad_one]
text = "Put the ruined piece away, and say I’ll take it home to show my father in Ternate"
reply = "“Show the Sultan?” She laughs so hard she has to hold on to a dye vat to catch her breath. “He’ll think all Gresik cloth looks like that.” When she’s done laughing, she still takes the scrap back, sits on the doorstep, and whipstitches the cut edges with needle and thread, one stitch at a time, before she returns it."

[tracks.bond_suma.chapters.b2]
title = "The Late Indigo"
text = "The dry season comes early this year, and the Solo River drops fast. The boat bringing indigo down from the interior is stuck on a sandbar halfway, and hasn’t moved in a month. The biggest vat in Suma’s family workshop has run dry; all that’s left is a blackened blue ring around the inside. But the orders can’t wait, not one of them: there are weddings, and goods that have to make their ships. Suma spreads the orders across a table and sorts them one by one into two piles: on the left, what can be delivered; on the right, what has to be put off. I suggest collecting all the deposits first and sorting things out once the indigo comes. She doesn’t even look up. “Take people’s money in full and then keep them waiting? What kind of business is that?” She pushes the right-hand pile across to me, corners squared off neatly. “The late ones have to be told, house by house. You’re a prince. If you tell them, they’ll be too embarrassed to curse.”"

[tracks.bond_suma.chapters.b2.choices.go_door_to_door]
text = "Go explain to each house for her, without leaning on my title"
hint = "She still won’t let an outsider anywhere near the workshop’s accounts. She isn’t going to hand you that pile."
reply = "I spend the whole afternoon walking that pile of orders around. At each door I start with the indigo stuck on the Solo River, then say when the cloth will be ready, and never once mention Ternate. The old woman with the wedding curses me hardest, then pours me a cup of water. I come back having been cursed at three houses. Suma hands me a bowl of cool tea and draws a circle on each of those three orders. “These three get dyed first, the day the indigo comes.”"

[tracks.bond_suma.chapters.b2.choices.find_other_indigo]
text = "Go down to the docks and see if any other ship has brought indigo"
reply = "I ask around the docks all day and find a Gujarati ship with two barrels of Cambay indigo cakes in the hold. The price the master names makes me suck in my breath. I run back and fetch Suma. She squats by a barrel, breaks off a piece to check the color, and bargains with the master for an hour, from this season’s winds to the leaky plank in his hull, until she’s knocked the price down by half. When the workshop boy has carried the barrels off, she turns to me. “All right. This one goes to your credit.”"

[tracks.bond_suma.chapters.a1]
title = "I Set the Day"
text = "My family’s kora-kora has come to Gresik to fetch me, and it has to make Ternate before the west wind dies. My father wants me home for the fasting month and the Eid after it. I go to the workshop to say goodbye. Suma is hanging cloth by the door. She hears me out and asks just one thing. “When are you coming back?” I tell her I’ll be back when the wind is. She doesn’t answer, just turns and goes into the workshop. I think she’s angry and I’m about to leave when she comes out again and pushes a slip of paper into my hand, folded no bigger than a fingernail. I open it. There’s a date on it in charcoal, written so hard it shows through the back. “That’s the day. I’ve set it. Bring your ship in on time.” The door curtain flicks shut, and she’s back inside before I can see her face. The drying pole is still swaying. The wind lifts a corner of indigo cloth and lets it fall."

[tracks.bond_suma.chapters.a1.choices.be_early]
text = "Promise to be there on the day, and wait for her on the dock half an hour early"
hint = "She pushes the note at you and is gone. Say now that you’ll be waiting early on the quay and she’ll take it for politeness. She doesn’t yet believe you’d come early for her."
reply = "After the east wind comes, I sail back to Gresik on the date from the note, step ashore half an hour before the time she set, and stand there on the dock. She sees me from a long way off. Her step falters for a moment, and then she comes over, smiling. “Well. The prince is actually on time.” We stand on the dock a long time, talking about the wind, then the ship, then the new vat of indigo she’s just mixed. The sun is going down, and she’s still talking about that vat."

[tracks.bond_suma.chapters.a1.choices.write_it_down]
text = "Copy her date into my family’s sailing schedule, and tell the captain we have to arrive that day"
hint = "Writing her date into your family’s schedule, having your family’s captain keep it for her—she doesn’t trust you that far yet."
reply = "The old captain studies the schedule a long time and says the wind may not agree. Then we’ll leave a few days early, I tell him. In the end I arrive two days early and hurry straight to the workshop. Suma sees me and drops the door curtain. “Early doesn’t count either. I said that day.” So I spend two nights at the inn by the docks. On the morning of the day itself, she knocks on the inn door with a packet of sticky rice cakes in her hand."

[tracks.bond_suma.chapters.a1.choices.bargain_the_day]
text = "Haggle with her through the door curtain: could the day move back two days?"
reply = "I ask through the curtain whether she could push it back two days, since my family will have guests after Eid. She lifts the curtain an inch. “No. A day is like a price. I set it.” I have no choice but to agree. Only then does she sweep the curtain all the way aside and laugh. Then she takes the note back out of my hand and draws a heavy line under the date."

[tracks.bond_suma.chapters.a2]
title = "A Little Beeswax Flower"
text = "Suma sets something in my palm: a little rose shaped from beeswax, no bigger than a copper coin. It’s wax left over from the workshop’s drawing, saved up over many days. Each petal is thinner than the last, and the innermost one, held to the light, is so thin it glows, and I can see her fingerprint on it. “I put the last one on the windowsill,” she says. “By noon it was a puddle. Keep this one somewhere cool.” I hold the flower on my open hand, afraid to close my fingers in case the warmth of my palm softens it. She watches me, the corner of her mouth twitches, and she goes on. “Your Ternate is too hot. If it melts, you come back and find me, and I’ll make you another.” One of the dyers in the workshop is calling her. She answers, and doesn’t move."

[tracks.bond_suma.chapters.a2.choices.keep_flower]
text = "Take the flower, and say I’ll keep it in the coolest spot in the ship’s hold"
hint = "She saved wax for days to make this flower. A thing like this—you aren’t close enough yet to accept it."
reply = "“And where’s cool in a ship’s hold?” she asks. I think about it and point to my heart. She raps the back of my hand with the bamboo handle of her canting. “So the prince’s tongue has melted too.” Then she turns away to answer the dyer, but the tips of her ears have gone red. I wrap the flower in an old scrap of cotton and keep it in the pocket against my chest. After that I carry it wherever I go."
effects = [{}, {}, {}, { title = "A Little Beeswax Flower" }]

[tracks.bond_suma.chapters.a2.choices.let_it_melt_joke]
text = "Take the flower, and say she shouldn’t count on it not melting—I’d like to come back more often"
hint = "That joke weighs too much; say it and she’ll think you’re teasing. What you feel isn’t warm enough yet to melt a wax flower."
reply = "She goes still, the canting stopped in midair. A drop of wax falls onto the cloth drying below, and she doesn’t even look. It’s a long moment before she says, “Then I’ll make a few more and wait.” The dyer calls again, and this time she goes. When I leave the workshop that evening and look back from the end of the lane, she’s still standing in the doorway, a lump of unmelted beeswax in her hand."
effects = [{}, {}, {}, { title = "A Little Beeswax Flower" }, {}]

[tracks.bond_suma.chapters.a2.choices.learn_to_make]
text = "Say I want to learn to make one for her"
reply = "She gives me a lump of wax. I spend half the afternoon shaping it by the brazier, and what I end up with has petals as thick as coconut flesh, all lopsided, no flower anyone could name. She laughs so hard she stamps her feet, tears in her eyes. But she doesn’t throw the thing away. She puts it on the workshop windowsill, at the end the sun never reaches."

[tracks.bond_suma.chapters.s]
title = "A Sarong She Dyed Herself"
text = "In December the west wind rises and the academy breaks up. My family’s ship is already in harbor and will leave as soon as the cargo is loaded. Suma comes down to the dock with a roll of cloth in her arms, and when she reaches me she doesn’t unroll it, just shoves it against my chest. It’s a sarong, indigo ground and brown flowers, the wax drawn by her and the cloth dipped in her vats—I know the way she draws, heavy at the start of a stroke, light at the end. The pattern lines up perfectly all the way along, except for one small patch at a corner of the hem that runs crooked, as if her hand had slipped. Before I can speak, she does. “When does your next ship sail?” I tell her. She nods and asks, “So what kind of life do you want?” Before I can answer that, she goes on. “Let’s be clear. I’m not going to shut the workshop to wait on anybody’s word. And you don’t get to use the sea as an excuse for not writing back all year.” The porters are calling for the loading. She stands where she is, waiting for my answer."

[tracks.bond_suma.chapters.s.choices.promise]
text = "Take the sarong, and promise to write her every sailing date first and let her call the business"
hint = "Every sailing date written to her first, and her word final in business—a promise like that takes real closeness. Or perhaps you’ve already promised to send your sailing dates to someone else first."
reply = "I tell her that from now on, every voyage, the day I sail and the day I make port, I’ll write to her first, and in our two families’ business she’ll name the prices. “Then you’d better be on time,” she says. I say I will. She looks at me the way she sizes up a bolt of cloth, then shakes out the hem of the sarong and points at that one crooked patch. “See this? This is you. Crooked.” I tell her I thought her hand had slipped. “My hand never slips.” She folds the hem back, rolls the sarong up tight for me, and ties it with a length of grass cord. “The whole thing’s drawn to the Gresik pattern. Just this one bit I left crooked on purpose. The day it lines up with the rest, that’s the day you’ve learned to keep a date.” The porters call again. She gives the knot a tug, pulls it good and tight. “First letter gets here before spring.”"
effects = [{}, {}, { title = "A Sarong She Dyed Herself" }, {}, {}, {}, {}]

[tracks.bond_suma.chapters.s.choices.heart]
text = "Take the sarong, and without a word, tuck a sprig of Ternate cloves into her hair"
hint = "The clove is in your fingers, but you don’t pin it in her hair. That step takes being very close—or perhaps your heart is already pinned on someone else."
reply = "I take a sprig of cloves out of my pocket. I brought it from home, dried, the buds still clustered on the stem, and I’ve been too fond of it to give it away. Without a word I tuck it into the knot of her hair. Suma doesn’t pull away. She reaches up and touches the cloves, once, and then again, as if she’s counting the buds. The dock is loud, but I can hear her draw a breath. “Eid, the year I come of age,” she says. “Which day—I’ll decide.” I say all right. She takes my hand and gives it a quick tug, her fingers stained with indigo that never washes out, then lets go just as fast and puts both hands behind her back. “You still write the sailing dates,” she says. “Every single letter.” Then she turns and walks off. At the corner of the dock the cloves bob in her hair with every step. She doesn’t look back."
effects = [{}, {}, {}, {}, { title = "A Sarong She Dyed Herself" }, {}, {}, {}]

[tracks.bond_suma.chapters.s.choices.own]
text = "Take the sarong, and agree that when our families do business, neither of us gives an inch"
reply = "I tell her that from now on, when our families trade, I’ll name the price for cloves and she’ll name the price for batik, and neither of us is allowed to give way. “Done.” She agrees so readily, then tilts her head at me. “That year I held back one of your coins. Have you worked out that account yet?” I tell her I’ve worked out about half. “The other half,” she says, “you pay for in tuition next time.” She holds out her hand. I slap palms with her, and something hard is pressed into mine: a Chinese copper coin with a bit of red thread run through the square hole. “That’s the one. You hold it as security. Give it back next time we haggle.” I turn the coin over. The red thread is new; she hasn’t even trimmed the ends. By then she’s gone off to help the porters tally the cargo, calling out the count faster than any clerk."

[tracks.reunion_suma]
name = "Suma: The Stall Is Still Hers"

[tracks.reunion_suma.chapters.reunion]
title = "The Stall Is Still Hers"
text = "In 1565 my ship puts in at Gresik again. The market is where it always was, but Suma’s stall has grown. It takes up three frontages now, and the awning is hung with dried batik. A few dyers stand in line at her counter for their wages, and she counts the coins into each palm one at a time, calling out each one. A middleman sidles up wanting to talk price for a Fujian merchant. She doesn’t even lift her eyes. “If he wants cloth, tell him to come himself.” So the Fujian merchant comes himself. They haggle across the counter for as long as it takes to drink a cup of tea, and she doesn’t give up a single copper. I walk over in the sarong. One corner of the hem wore through once, and I patched it myself, the stitches all crooked. The patch is the first thing she sees. She picks up the hem, turns it over, and studies the stitching for a long while before she looks up. “So—did your ship come in on time?”"

[tracks.reunion_suma.chapters.reunion.default]
effects = [{ text = "Kaicili, your ship didn’t come. I asked at the docks; they said you were held up in Ambon because the wind wouldn’t move. This time it’s not on your account, it’s on the wind’s. I’m sending a cloth sample with this Javanese boat. It’s this year’s new indigo, a shade deeper than your sarong. I dropped the old indigo house up-country; the new one sends by oxcart overland, so we don’t care anymore when the Solo River runs low. The workshop has four more vats, eleven dyers, and I pay the wages myself on the first of every month and count them out in front of everyone. The middlemen still come; I still don’t see them. Last month a Fujian merchant spent three days trying to beat my price down, and in the end he paid what I asked. On his way out he said the women of Gresik drive a harder bargain than the brokers of Quanzhou. I took it as a compliment. If your sarong wears through, don’t go patching it yourself; I don’t trust you with a needle. Bring it back and I’ll set in a proper patch—only that one crooked corner stays as it is. The date for next season is written in the corner of the sample, plain as can be. Sail by it. If that day comes and your ship still isn’t here, I’ll take the sample back and sell it to someone else. —Suma, at Gresik" }, {}]

[tracks.reunion_suma.chapters.reunion.choices.friend]
text = "Say it came in on time, then sit down and work out a long-term deal with her: cloves for batik"
reply = "I tell her it was on time, half a day early in fact; we waited outside the harbor for the tide. She says “Mm,” sends the Fujian merchant on his way, and clears me a stool across the counter. We start with cloves. She wants a three-year contract, two seasons a year, at a tenth below the Gresik market price; I want her batik to go to the Moluccas through me alone, no one else allowed to sell it there. She says I’ve got a big appetite; I say she drives a hard bargain. The whole afternoon goes by, the shade under the awning creeps across half the stall, and she doesn’t give up one copper, and neither do I. In the end each side throws in one thing more: she adds a season of sarongs, I add a picul of cloves. Once it’s settled, she counts out my deposit as custom requires. I count it back right in front of her, coin by coin, and not one is missing. “So the prince can finally count.” She snaps the cashbox shut, and there’s that crooked eyetooth."
effects = [{}, {}, {}, { title = "The Stall Is Still Hers" }]

[tracks.reunion_suma.chapters.reunion.choices.love]
text = "Say no business this time, and ask her which day she set for Eid the year she came of age"
hint = "She’s still holding the patch, studying your stitches. You didn’t say it on the quay back then, and after all these years you still can’t ask her which day she set."
reply = "She sets her ledger down and looks at me for a long time. “Today,” she says. I point out that today isn’t Eid. “I mean the day I set.” From under the cashbox she takes out a sprig of cloves, dried almost black, every bud still on it. “I decided that year: the day your ship comes in. You’re late, but the day is right.” That afternoon she closes up early and hands her ledger to the workshop boy. At dusk, behind the workshop, under the drying poles, length after length of indigo sways slowly in the wind. She asks whether there’s been anyone else, all these years. I tell her no. She nods, as if she’s just balanced an account, and then she rises on her toes and kisses me. Her hands hold my face, her fingers still stained with indigo. When I wash the next morning, I see it in the water: a touch of blue still on my cheekbone."
effects = [{}, {}, {}, { title = "The Stall Is Still Hers" }]
