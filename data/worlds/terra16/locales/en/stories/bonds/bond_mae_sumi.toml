# 真栄澄：替人写的家信（bond_mae_sumi）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段；effects 数组保留下标。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Mae Sumi、Naha、Kumemura、Mie Gusuku、Shuri Castle、Fuzhou、Nanjing、Siam、Malacca、Kyoto。
# 口头禅 “When you come home, bring the story with you.” 只在 c1 出现一次（与人物卡的英文一致）。主角的“我”不写性别。

[tracks.bond_mae_sumi]
name = "Mae Sumi: Letters Written for Others"

[tracks.bond_mae_sumi.chapters.c1]
title = "Letters Written for Others"
text = "Three days before the tribute ship sails, a line has formed on the stone steps of the Naha waterfront: sailors’ families, every one of them waiting for Mae Sumi to write a letter home. She kneels behind a low table with an inkstone weighting the corner of her paper. When an old fishwife’s turn comes, the old woman says a line and Mae Sumi writes it. At “If you dare go bad in Fuzhou, don’t bother coming home,” her brush pauses, then carries on. Reading the letter back line by line, she turns that sentence into “Don’t go bad in Fuzhou. Come home soon.” The old woman blinks, then nods. Only then does Mae Sumi fold and seal it and hand it to the young sailor waiting behind her, with a smile. “When you come home, bring the story with you.” He takes it, red to the ears. I stand there all afternoon and notice something odd: each time she seals a letter, she slips a scrap of paper from her sleeve, jots down a name, and tucks it back. Her sleeve grows fatter and fatter. The line still stretches half a street. She looks up, sees me, and points her brush my way. “Envoy’s student. If you’ve nothing to do, come grind ink.”"

[tracks.bond_mae_sumi.chapters.c1.choices.grind_ink]
text = "Sit down and grind her ink, and help write out the lines as people say them."
reply = "My characters come out stiff and square, every stroke ruled straight. She leans over for a look and her shoulders shake. “Are you writing a letter or carving a tombstone?” So I try to round them off, and by the end my wrist aches too much to lift. When the line finally runs out it is dark. She picks up the teapot; there’s only a mouthful left. She pours it, drinks half, and pushes the bowl across to me."

[tracks.bond_mae_sumi.chapters.c1.choices.ask_the_slip]
text = "Ask her what’s written on those scraps in her sleeve."
reply = "She gathers her sleeve shut and smiles sweetly. “Names. You can’t see.” When I ask whose names, she switches to Ryukyuan, so fast and thick that I can’t catch a single word. When she’s done, she gathers her sleeve a little tighter and beckons the next person in line."

[tracks.bond_mae_sumi.chapters.c2]
title = "Ryukyuan Kana and Court Chinese"
text = "My teacher at the envoy’s house has me practicing official letters to the authorities in Fuzhou, out of a textbook some student brought back from Nanjing years ago, its edges worn soft as cloth. Mae Sumi comes to borrow it. She writes her family letters in kana, with a polite sōrō closing every line, but of the style you use to address officials she knows not a word. Under the eaves of a house in Kumemura we lay out paper and brushes and make a trade. I teach her how an official letter opens, how to address the reader, how the words “Provincial Administration” must start a fresh line set higher than the rest. She teaches me how a kana letter asks after the elders at home. I write a few lines to my grandmother the way she taught me. She reads them, and by the second line she is doubled over. “Write it like this and your grandmother will think you owe her money.” “What’s wrong with it?” “Nothing’s wrong with it,” she says, wiping her eyes. “It’s too right.” She strikes out my opening “Respectfully submitted” and writes beside it: “Has the banana tree at home fruited yet?”"

[tracks.bond_mae_sumi.chapters.c2.choices.lend_textbook]
text = "Lend her the Nanjing textbook to take home and copy, to return when she’s done."
hint = "She’s still too shy to owe the envoy’s household a favor. Hand her the book and she’ll only push it back with a smile."
reply = "Three days later the textbook comes back without a single page dog-eared. But every page now has a fine line of kana down the margin: how that page’s official phrasing would go in Ryukyuan. I show it to my teacher. He leafs through page after page and sighs. “That girl. A pity she can never be sent to study in Nanjing.” When I tell her, she keeps her head down over her ink. “Then I’ll be the Nanjing student in the margins.”"

[tracks.bond_mae_sumi.chapters.c2.choices.read_a_letter]
text = "Ask her to read me one of her family letters, so I can learn how they should sound."
reply = "She picks a fisherman’s letter to his wife. She wrote it for him, yet she reads it in his voice, gruff and rough. At “Is it raining where you are?” I suddenly think of the jar under the eaves at home that catches the rain, and my throat tightens. She stops and watches me for a moment, then pushes a clean sheet across. “Want to write one too? This one’s free.”"

[tracks.bond_mae_sumi.chapters.b1]
title = "The Ship That Did Not Return"
text = "A ship bound for Siam is half a month overdue. The households on the waterfront with men aboard grow quieter by the day; one woman stands in the door of the rice shop and forgets how much she came to buy. Mae Sumi goes on writing their letters, but leaves them unsealed and puts them away in a wooden box. “When the ship comes in, they all go together.” One day I go to her house to return a book. She isn’t in the room, and on her desk, under a paperweight, lies a stack of paper: the scraps from her sleeve, grown into a thick pile, sorted into bundles by ship and tied with thin cord. The top bundle bears the name of the Siam ship, and the seven names under it are all circled in red. She comes in carrying tea, sees me looking, and makes no move to put it away. She only sets the tea by my hand. “If the ship doesn’t come back,” she says, “someone has to know who was aboard.”"

[tracks.bond_mae_sumi.chapters.b1.choices.match_the_roster]
text = "Take her list to the harbor office and check it against the Naha departure register."
hint = "She doesn’t yet trust anyone else with these papers. Mention taking them to the register and she’ll shut them away in a drawer."
reply = "The old clerk at the harbor office thinks I’m a busybody and slaps the register down on the table. It gives that ship a full page of names, but of the seven she circled, only five are there. The missing two are boys who ran down on the morning of sailing to fill empty places. The register was already written, the clerk says, and he couldn’t be bothered to change it. I go back and tell her. She nods, and beside each of the two names she adds a small dot. “Nobody wrote them in the register. I did.”"

[tracks.bond_mae_sumi.chapters.b1.choices.wait_on_the_wall]
text = "Say nothing of the list. Go with her to the sea wall at Mie Gusuku and wait for the ship."
reply = "We sit on the wall until the sun sinks into the sea, and not one sail shows on the water. All the way back she doesn’t speak, until at the fork in the road she says, “Again tomorrow.” I say all right. The next day I’m a little late, and from far off I can see her already sitting on yesterday’s stone with two rice balls on her knees, one of them for me."

[tracks.bond_mae_sumi.chapters.b2]
title = "The Dragon Boat Banner"
text = "On the fourth day of the fifth month the dragon boats race, and the envoy’s house has scraped together a crew. I row in the third seat. The night before, Mae Sumi wrote our banner, putting every rower’s name on it in its Ryukyuan reading; whenever she misread one, she made herself drink a mouthful of cold water as a forfeit. Only my name she wrote the formal way, as the characters would be read at court. “You’re from the envoy’s house. Written the local way, it would look too plain.” The boy beside me only joined the crew on the morning of the race, so his name isn’t on the banner. Halfway through, his oar catches nothing but air and he goes straight over the side, both hands locked on my oar. The boat lurches, and two others slide past us. We drag him all the way to the finish, and when we reach the shore he is still hanging off the side, choking too hard to speak, while the crowd roars with laughter. Mae Sumi has already untied the banner from its pole, spread it on a stone by the water, and is adding one more name at the very bottom: his. Someone beside her mutters, “He fell out. Does that count as rowing?” “He rowed too,” she says without looking up. “His name goes on it.”"

[tracks.bond_mae_sumi.chapters.b2.choices.your_name_too]
text = "Once ashore, ask her to write my name again too, in the Ryukyuan reading."
hint = "She still thinks of you as the envoy’s household. She lifts the brush, afraid you’ll find your name too plain the local way, and sets it down again."
reply = "She scrapes off the old line and writes slowly, stroke by stroke, then reads it out to me. In her mouth my name sounds soft, as if it belonged to someone else. The banner later hangs in the corridor of the envoy’s house, and I glance at it every day as I pass. Once I find her standing there looking at it too. Which line she was looking at, I don’t ask."

[tracks.bond_mae_sumi.chapters.b2.choices.pull_him_out]
text = "Jump in first and push the boy back aboard; the banner can wait."
reply = "By the time I’ve shoved him into the boat I’ve swallowed half the harbor. Ashore, Mae Sumi runs over and pounds my back, fast and hard, so that I cough worse than ever. “There, there,” she says. “Better out than in.” That evening, when the banner goes up in the corridor, I find she has drawn a tiny wave beside my name."

[tracks.bond_mae_sumi.chapters.a1]
title = "A Book of Names"
text = "One evening early in spring, Mae Sumi takes me up onto the sea wall at Mie Gusuku. She is holding a book bound with hemp cord, nothing written on its cover. Inside are the scraps: the ones from her sleeve, her desk and her wooden box these two years, each copied out fair, one page to a ship, and the names of those who never came back circled in red. “I want the families of the ones who went to sea and didn’t return to have a book they can look things up in,” she says. “The court records ships, not people. When a ship goes down, the royal register gets one line. Who was aboard, nobody writes.” She turns to the last page. It is only half filled; the bottom half is still bare. The sea wind sets the corners rattling and she presses them flat with her hand. “When you sail with the envoys’ ships someday,” she says, looking at the harbor instead of at me, “could you copy out the names on every ship and bring them back to me?”"

[tracks.bond_mae_sumi.chapters.a1.choices.your_name_last]
text = "Ask her to put my name in the book too."
hint = "This is the first time she’s shown the book to anyone. You aren’t close enough yet to add your own name to it."
reply = "She hesitates over the page for a while, then turns to the end and writes my name on the very last line, very small, with nothing after it. Then she closes the book and holds it against her chest. “Now you have to come back. Otherwise I’ll have to circle you in red.” The wind drops. We sit on the wall until the first star comes out, and all that time her hand stays pressed on the book."

[tracks.bond_mae_sumi.chapters.a1.choices.copy_names_back]
text = "Promise that in every port I’ll copy down the names of everyone aboard and bring them back to her."
hint = "She asks it very lightly. You aren’t close enough yet to take on a charge like this; say yes now and she’ll hear it as mere politeness."
reply = "She doesn’t thank me. She turns to the last page and draws a faint line across it with her fingernail. “From here on, it’s yours.” I ask what happens if I copy something wrong. “Copied wrong is still better than nobody copying.” She traces the line again, as if afraid the wind would smooth it away."

[tracks.bond_mae_sumi.chapters.a1.choices.first_name]
text = "Ask her whose name comes first in the book."
reply = "She turns to the first page. The first line is crooked, the ink faint. “My father’s.” He sailed with the tribute ship to Fuzhou and fell sick and died aboard on the way home; when the ship reached Naha, the royal register noted only that the ship was back. “I was eight. I’d just started learning to write.” She runs a finger along the line. “The first name I ever learned to write was his.”"

[tracks.bond_mae_sumi.chapters.a2]
title = "The Sister-Spirit’s Kerchief"
text = "When a Ryukyuan woman sees her brother off to sea, she gives him a kerchief she has embroidered herself. They say the sister’s spirit settles in it and sails with the ship, standing between him and the waves. On the stone bench behind the envoy’s house, Mae Sumi bites off the last thread and holds a kerchief out to me. White ramie, with two hibiscus flowers worked in one corner, the left a size bigger than the right, the stitches so close that the sun can’t shine through. “I unpicked the left one three times,” she says. “It got bigger every time.” Before I can reach for it her face goes red, and she pushes it at me, muttering, “I’m not your sister, you know.” After a moment she adds, more quietly, “But if you go a long way off, something ought to go with you.”"

[tracks.bond_mae_sumi.chapters.a2.choices.take_kerchief]
text = "Take the kerchief, fold it while she watches, and put it in my inner pocket."
hint = "This kerchief weighs too much. You aren’t close enough yet: she can’t quite hand it over, and you can’t quite take it."
reply = "I fold it in half twice and she can’t bear to watch. “You’ve folded it like a dishrag.” She takes it back, turns the hibiscus uppermost, folds it again into a neat little square and tucks it into the pocket inside my collar. Once it’s in, she presses a finger against the pocket from outside, firmly, like setting a seal."
effects = [{}, {}, {}, { title = "The Sister-Spirit’s Kerchief" }]

[tracks.bond_mae_sumi.chapters.a2.choices.bigger_flower]
text = "Take the kerchief and tell her the big flower on the left is my favorite."
hint = "This kerchief weighs too much. Say that now and she’ll only blush and take it back."
reply = "“That’s the botched one,” she says. I tell her the botched one is how anyone would know she made it; anyone else would have made the two the same size. She doesn’t answer. She turns to look at the sea, her ears as red as that hibiscus. After a long while she says, very low, “Next time I embroider one, they’ll come out the same size.”"
effects = [{}, {}, {}, { title = "The Sister-Spirit’s Kerchief" }, {}]

[tracks.bond_mae_sumi.chapters.a2.choices.not_a_sister]
text = "Tease her back: then what are you to me?"
reply = "She flings the kerchief in my face. “The one who writes your letters!” Then she bursts out laughing, comes back to pick it up off the ground, brushes off the dust, and keeps it clutched in her own hand. “You can have it once you’ve learned how to talk.”"

[tracks.bond_mae_sumi.chapters.s]
title = "Stories to Bring Back"
text = "The north wind has risen, and the tribute ship is sailing before the year is out; I go with it to Fuzhou. Before the anchor comes up, Mae Sumi comes down to the quay to see me off, the book of names under her arm, a finger’s width thicker than in spring. After the new year, she says, she’s going up to Shuri Castle to copy documents for the court ladies. “They say the new king’s investiture envoys will come sooner or later, and Shuri is short of people who can write.” She’ll keep the book going. She opens it to the last page to show me. The last line is my name, with nothing after it yet. “When you come back, I’ll write ‘returned’ after it,” she says. “And if you don’t…” She doesn’t finish. The wind on the quay is strong; it blows her hair into her mouth, she hooks it out with a finger, and it blows straight back in."

[tracks.bond_mae_sumi.chapters.s.choices.promise]
text = "Promise that every time I come home, I’ll bring her the names of everyone aboard first."
hint = "Bringing her the names from every voyage first—that’s a promise for life, and what you share hasn’t reached that page yet. Or you’ve already saved that lifelong line in the register for someone else."
reply = "She hears me out and says neither yes nor no. She pulls the slim brush from her hair, wets the tip on her tongue, and after my name she writes one stroke, then another, and stops halfway. “What character is that?” “Half of ‘returned.’” She slides the brush back into her hair. “The other half I’ll write when you’re back.” I tell her there are so many people on a ship that copying out every one will wear my hand to nothing. “Good,” she says. “Then you’ll know how I’ve spent these years.” They’re calling from the ship. She closes the book, holds it to her chest, and bows to touch her forehead to the cover, very lightly, the way one bows before a household shrine. Then she tucks it back under her arm, steps back two paces, and waves to me with her free hand."
effects = [{}, {}, { title = "Stories to Bring Back" }, {}, {}, {}]

[tracks.bond_mae_sumi.chapters.s.choices.heart]
text = "Hand her the corner with my name that I cut from the corridor banner last night, for her red thread. Say nothing."
hint = "A keepsake like this takes a certain closeness to trade. Or perhaps you have already pledged a lifetime to someone else."
reply = "The edge of the corner is ragged; my name on it is in her hand, the ink a little blurred by rain. I hold it out without a word. She knows the writing at a glance and asks nothing either. From her sleeve she takes a small skein of red thread, what was left from the two hibiscus flowers; there isn’t much of it. She draws out a length, winds it three times around the little finger of my left hand, ties a knot, and bites off the end with her teeth, just as she did on the stone bench that day. The corner of the banner she winds around her own wrist, tight, where her sleeve will hide it once it falls. They’re calling from the ship. She walks me to the gangplank, and her hand rests on the back of mine for a long time, long enough that they call from the ship again. Only then does she let go and step back. “Go on.”"
effects = [{}, {}, {}, {}, { title = "Stories to Bring Back" }, {}, {}]

[tracks.bond_mae_sumi.chapters.s.choices.own]
text = "Go separate ways: she clerks at Shuri, I go to sea, and in ten years we see who has recorded more names."
reply = "“You’re on.” She tucks the book under her arm. “And I’ll win.” I ask her why. “On a ship you can only record one shipload a voyage.” She counts on her fingers. “At Shuri, everyone going in and out of the castle, from the royal cooks to the envoys’ sedan bearers, none of them gets past me.” I say there are plenty of ships at sea, and in ten years I can make dozens of voyages. “Then make them,” she says. “The more you sail, the less work you are for me. One person, one entry, and that’s that.” They’re calling from the ship. She plants a hand on my back and shoves, so hard I nearly miss the gangplank. When I look back she has already turned to go, but a few steps on she turns around again and shouts, “Ten years! No cheating!”"

[tracks.reunion_mae_sumi]
name = "Mae Sumi: The Year the Envoys Came"

[tracks.reunion_mae_sumi.chapters.reunion]
title = "The Year the Envoys Came"
text = "This year Naha harbor is more crowded than anyone can remember. The Ming investiture envoys have come from Fuzhou, people say, to invest the new king, and the great ships come in one after another: attendants, soldiers, cooks, musicians, hundreds of people coming ashore, and Shuri Castle run off its feet. A long table has been set up on the quay to register the envoys’ retinue, and the woman behind it is Mae Sumi. Three books of names are stacked in front of her. The oldest, at the bottom, has words on its cover at last: “The People Aboard.” She looks up, sees me, and puts down her brush. Without a word she draws out the oldest book, turns to the last page, finds my name, and writes the character for “returned” after it. Only then does she smile. “Back, are you?” A corner of very thin letter paper shows at her cuff. When my eyes stay on it, she says it came from Kyoto, from someone who writes waka for other people. “Another letter writer for hire. We’re having a contest to see who writes slower.”"

[tracks.reunion_mae_sumi.chapters.reunion.variants.promise]
text = "This year Naha harbor is more crowded than anyone can remember. The Ming investiture envoys have come from Fuzhou, people say, to invest the new king, and the great ships come in one after another: attendants, soldiers, cooks, musicians, hundreds of people coming ashore, and Shuri Castle run off its feet. A long table has been set up on the quay to register the envoys’ retinue, and the woman behind it is Mae Sumi. Three books of names are stacked in front of her. The oldest, at the bottom, has words on its cover at last: “The People Aboard.” She looks up, sees me, and puts down her brush. Without a word she draws out the oldest book and turns to the last page. After my name, the half character is still there, its ink long since gone dull. She wets her brush and adds the other half, and only then does she smile. “Back, are you?” A corner of very thin letter paper shows at her cuff. When my eyes stay on it, she says it came from Kyoto, from someone who writes waka for other people. “Another letter writer for hire. We’re having a contest to see who writes slower.”"

[tracks.reunion_mae_sumi.chapters.reunion.variants.romance]
text = "This year Naha harbor is more crowded than anyone can remember. The Ming investiture envoys have come from Fuzhou, people say, to invest the new king, and the great ships come in one after another: attendants, soldiers, cooks, musicians, hundreds of people coming ashore, and Shuri Castle run off its feet. A long table has been set up on the quay to register the envoys’ retinue, and the woman behind it is Mae Sumi. Three books of names are stacked in front of her. The oldest, at the bottom, has words on its cover at last: “The People Aboard.” Around the wrist of her writing hand is wound a faded strip of banner cloth. She looks up and sees me, and her brush stops in midair. After a moment she sets it down, draws out the oldest book, turns to the last page, finds my name, and writes the character for “returned” after it. Only then does she smile. “Back, are you?” Her eyes rest on my left hand for a moment; then she looks down and straightens her cuff. A corner of very thin letter paper shows there. It came from Kyoto, she says, from someone who writes waka for other people. “Another letter writer for hire. We’re having a contest to see who writes slower.”"

[tracks.reunion_mae_sumi.chapters.reunion.default]
effects = [{ text = "To the student from the envoy’s house: The envoys’ ships have all gone, and Naha harbor is suddenly half empty. You didn’t come. This year I sat on the quay registering the envoys’ people: four hundred and thirty-one names, nineteen cooks, twenty-six musicians, and the sedan bearers I never did manage to count. When they left I wrote ‘returned’ after every one of them, as I always do. Going home to Fuzhou counts as returning. I’ve copied out the page of my book that has you on it and folded it in with this letter. Look at the last line: after your name, I’ve written ‘returned.’ I asked every ship that came in whether they’d seen you, and two said they had, passing far off at sea. If I can’t see you, seeing your ship will do. The ink is still fresh, so don’t smudge it with your thumb. I put words on the cover of the first book: ‘The People Aboard.’ My teacher says that’s no title for a book. I told him it isn’t a book. There’s a woman in Kyoto who writes letters for other people; we’ve been writing to each other for two years. Her hand is better than mine, and I won’t stand for it, so I practice every night. Next time you’re in port, come to the quay first. I’ll still be at that long table. When you come home… you know how the rest goes. Mae Sumi" }, {}]

[tracks.reunion_mae_sumi.chapters.reunion.choices.friend]
text = "Hand her, page by page, the names I copied at sea these years, and help her register until dark."
reply = "I spread a roll of paper on the long table: the names of people aboard ships that I copied in port after port these years, at Fuzhou, at Malacca, in Siam, more than four hundred, some pages so soaked by seawater that the ink has bled into blots. She reads them one by one, very slowly, correcting every reading I got wrong and glaring up at me after each correction. At a sailor who died of sickness in Malacca she stops, and draws a red circle. She knows that name; his family once stood in line on this quay for a letter. The envoys’ attendants line up at her table, and she tells them to wait. Long after dark, when the last attendant has been registered, she ties my roll and her three books together and pats the bundle. “You’re the hardest-working name in my books.” Then she adds, “Come early tomorrow. I haven’t finished with the envoys’ cooks.”"
effects = [{}, {}, {}, { title = "The Year the Envoys Came" }]

[tracks.reunion_mae_sumi.chapters.reunion.choices.love]
text = "Take the kerchief from my pocket and tie it back around her wrist."
hint = "The handkerchief has gone damp from gripping it in your pocket. You said nothing on the dock back then, and even now that she’s written “back” after your name, your hand won’t reach for hers."
reply = "The kerchief has been in my pocket six years. It has been washed many times; the left hibiscus has faded to a pale pink, and it is still a size bigger than the right. I take it out and pass it around her wrist. The strip of banner cloth there has faded too, and only half my name is left on it. I tie the kerchief over the banner cloth and knot it. She looks down at the knot for a long time. “This is for the one who goes to sea to carry away,” she says. “Tying it back on me, what does that mean?” “That I’ve come back.” She turns her wrist over, and back again, as if checking a letter to see the seal is fast. “Tied here,” she says, “you don’t get to go that far away again.” Then she takes hold of my collar and, across the long table and the three books, kisses me. Someone in the envoys’ line whistles. She lets go, red to the tips of her ears, picks up her brush again, and the tip trembles. “Next.”"
effects = [{}, {}, {}, { title = "The Year the Envoys Came" }]
