# 伊尔汗（bond_ilhan / reunion_ilhan）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、见闻、选项、回复、提示、变体、回忆标题、来信），玩法字段一律不写。
# 2026-10-12 C7 重写，与中文同一轮写完；美式拼写、弯引号。口头禅原句“I was on my way anyway. That’s all.”只在 C1 出现一次，重逢只用前半句呼应；
# 称呼沿用人设卡的英文：“Provincial”“yoldaş”；书记房作 the governor’s chancery。

[tracks.bond_ilhan]
name = "Ilhan: I Was Just Passing By"

[tracks.bond_ilhan.chapters.c1]
title = "The One Who Comes First"
text = "It’s still dark when I feel my way to the teacher’s pillar to borrow paper. He keeps a basket of it there, and whoever comes early can take two sheets. Someone has already lit a lamp at the foot of the pillar. Ilhan is sitting alone in the front row with Ibn Malik’s Alfiyya open on his knees, the corners of the book worn round by his thumb, murmuring yesterday’s verses under his breath. He looks up, sees me, and snaps the book shut. “I was on my way anyway. That’s all.” “I didn’t think anything of it.” I pull two sheets from the basket. “I don’t even remember your name.” “Ilhan.” He says it fast, as if afraid I’ll get it wrong. “Ilhan, of the janissary house. Take your paper and go, Provincial.” I head out. As I reach the arcade, the pages rustle open behind me. “Hey. Kilwa.” He doesn’t turn around. “Stand there and listen. I’ll read. Tell me where it doesn’t flow.”"
news = "At al-Azhar in Cairo the teacher’s lamp is lit before dawn. They say it’s that janissary boy, there ahead of the teacher every time, and he won’t let anyone call him early."

[tracks.bond_ilhan.chapters.c1.choices.listen]
text = "Sit down beside him, listen, and point out the two places where he stumbles."
reply = "I find two. In one he swallows the end of a word. The other is a throat sound: they speak Turkish at his house, and his ḥā keeps coming from the front of his mouth instead of deep in the throat. He frowns and reads the first one twice more until it runs smooth. The second he won’t accept. “Your Kilwa ears misheard.” The dawn call sounds from the minaret, and the arcade starts filling up. He shuts the book, tucks it under his arm, takes two steps, and stops. “You coming this early tomorrow?”"

[tracks.bond_ilhan.chapters.c1.choices.tease_early]
text = "Ask him: on your way to where, the front row? Do you live inside the pillar?"
reply = "His face goes dark. He grabs the book and stalks off, his hem setting the lamp flame dancing. At the door he turns around, comes back, and bends to pick a reed pen up off the mat. “The pen was on its way too.” I burst out laughing. He glares at me, and halfway through the glare the corner of his mouth twitches on its own. He gets the book up in front of his face fast and walks out behind it."

[tracks.bond_ilhan.chapters.c2]
title = "His Father’s Name"
text = "On the ledge of the lending window lies a row of wooden tags, one per student, and the old librarian calls them in order. That day the line runs out into the courtyard. Ilhan’s tag is the last one. He picks it up and walks it along the ledge all the way to the window, clearing his throat. “My father is an odabaşı up at the Citadel—” “What about the one in front of you?” I ask. In front of him is a Maghribi student, thin as a reed, hugging a long list of titles he’s fetching for his teacher. At the word Citadel he shuffles half a step aside. Ilhan glares at me. He slaps the tag down on the ledge, picks it up again, and sets it back at the very end of the row. Then he walks out and takes his place at the back of the line in the courtyard. “I wasn’t cutting in,” he says. “I came to see how many people there were.”"
news = "The line at the lending window of al-Azhar in Cairo ran all the way into the courtyard. The janissary boy walked his tag up to the front, then carried it back to the end himself. Nobody had seen that before."

[tracks.bond_ilhan.chapters.c2.choices.queue_together]
text = "Wait at the back with him and quiz him on the Alfiyya while you wait."
hint = "He keeps the tag shut in his fist so you can’t see the number. You two aren’t close enough yet for him to stand in that long line with you watching."
reply = "I give the first half of a verse; he gives the second. One miss and he has to run an errand for whoever’s ahead of us. He never runs a single one. By the time our turn comes, he has just finished the whole new section. He takes the book from the old man and weighs it in his hand. “Lines are good for something after all.” The next morning, before light, the first tag on the ledge is his. When he sees me coming he gets in first: “Half an hour early, and you don’t have to say anyone’s name.”"

[tracks.bond_ilhan.chapters.c2.choices.joke_queue]
text = "Tell the whole line a Kilwa joke to pass the time."
reply = "I clear my throat. In Kilwa there was a fishmonger who wanted an audience with the sultan. He waited in line three days, and by the time his turn came, the fish in his basket had gone bad. The sultan held his nose and asked what his complaint was. “This line,” he said. The Maghribi boy laughs first, then the whole line, and the old man at the window laughs so hard he slaps the table. When he finds our book he slips us a second one. “For the storyteller. Call it interest.” Ilhan comes out with a book under each arm, muttering, “That mouth of yours works better than a janissary’s name.”"

[tracks.bond_ilhan.chapters.b1]
title = "This Time I Lost"
text = "In the autumn the teacher sets a question for debate: a ship is still out on the Red Sea. May the pepper in her hold be sold now, to a Cairo merchant? Ilhan stands first and says no. The goods aren’t there; you’re selling wind and waves; it’s a gamble. I stand and say yes: pay the money now, fix the weight, the grade, and the day of delivery, and that’s a forward sale. Kilwa ships do it all the time, and the teacher’s own book allows it. Three times he comes back at me, and three times he circles back to the goods not being there. The teacher says, “Baraka is right.” Ilhan stays on his feet. “The second time he answered, he paused,” he says. “Long enough to say three words. Is a pause in debate a sign of weakness?” The teacher says it is. Ilhan stands a while longer. “This time I lost. I was wrong at the root. I took a forward sale for selling what you don’t have.” The next day he sets two sheets on my knee. One lists my mistakes, the other his own. The hand is equally neat on both, down to the spacing of the lines."
news = "At the autumn debates at al-Azhar in Cairo, a student from Kilwa beat the janissary boy. They say the next day the boy copied out two sets of notes for him, his own mistakes written up just as neatly."

[tracks.bond_ilhan.chapters.b1.choices.read_both]
text = "Read both sheets through, and write him a line at the bottom of his own."
reply = "The sheet about me is merciless; he even caught me putting a word in the wrong case. The sheet about himself is worse. At the bottom of his I add a line: “You were right about the pause. I wasn’t sure of myself just then.” He reads it and snorts. “Then I’ll catch you again next time.” He pulls the sheet back, folds it in four, and slides it into his sleeve. “I’m keeping this one. You can keep the one about you, if you like.”"

[tracks.bond_ilhan.chapters.b1.choices.rematch_debate]
text = "Challenge him to another debate next month, on a question he picks."
reply = "He thinks about it for three days. The question he picks comes from the Alfiyya’s verses on exceptions: after which “except” does the noun change its case, and after which does it stay put? He has thumbed those pages until the corners went fuzzy. I can’t even recite them all. I lose cleanly. Afterward he doesn’t smile. He just tucks the book under his arm. “One each, Provincial. We’re square.”"

[tracks.bond_ilhan.chapters.b2]
title = "The Soldiers’ Sons’ Fees"
text = "In 1555 a list goes up outside the bursar’s office: anyone a year behind on fees leaves the lodgings by the end of the month. The last name on it is Mustafa, twelve years old, from the Turks’ lodging. His father is a soldier from the Citadel, posted two years ago to the fort at Aswan, paid once a quarter and late every time. Ilhan drags me out of the arcade into a corner. “I know the steward in there. One word about who my father is and he crosses the name off tomorrow.” “So say it.” “No.” His jaw is set. “It’s Mustafa’s father who’s owed his pay. Why should his son get to study on the strength of my father’s name? I say the word and all Cairo remembers my father again.” He pauses, and his voice drops. “You can haggle. When a Kilwa man haggles, the whole fish market runs.” Through the half-open door, the steward turns the debt ledger to the right page and scores two lines under Mustafa’s name with his thumbnail."
news = "The bursar at al-Azhar in Cairo posted a list of students behind on their fees. Word is a soldier’s boy is to be thrown out at month’s end, and the janissary boy has been pacing outside the office."

[tracks.bond_ilhan.chapters.b2.choices.haggle_steward]
text = "Haggle with the steward: three quarterly payments, and the two of you cover the first."
hint = "He drags you into the corner, then swallows what he was about to say. On this, he doesn’t yet see you as someone to take into the bursar’s office with him."
reply = "I don’t argue with the steward about whether the boy should go. I just work the numbers with him. Soldiers are paid once a quarter. Mustafa’s father can spare one share a quarter, so the office gets three shares back within the year. Throw the boy out and not one copper of that page ever comes back. What if the pay is late again, the steward asks. Then the two of us will cover the first quarter, I say. He clicks his tongue and turns his two scored lines into three little circles. Outside, Ilhan says nothing all the way to the well. Then: “When you haggle, you look like a thief.” “And the share you’re paying?” He shoves his purse back into his sash. “I’m a thief too.”"

[tracks.bond_ilhan.chapters.b2.choices.ask_father]
text = "Tell him to let his father handle it. One word. Why go the long way around?"
reply = "His face closes. “And then it’s the janissaries throwing their weight around again. You too?” He goes into the office alone. The door doesn’t quite shut, and from outside I hear his voice climb higher and higher while the steward’s stays perfectly even: a debt is a debt. At the end of the month Mustafa walks out of the lodgings with his bedroll on his back. That day the front-row place at the lecture is empty. The teacher calls the name twice, and nobody answers."

[tracks.bond_ilhan.chapters.a1]
title = "The Long Steps of the Citadel"
text = "In the spring of 1556 the old copyist from our lodging sends me up to the Citadel with a bundle of fair copies. When I come out, the sun is already touching the dunes to the west. Outside the gate a long flight of steps runs down, steep and broad, all the way to Rumayla Square. Ilhan is sitting on the top step with an empty dinner pail on his knees. “My father’s on duty up there today. I brought his dinner.” He stands and brushes off his robe. “Done now. It’s on my way.” “On your way where?” “Down.” He’s already walking. “There’s only the one way.” The stones are worn hollow in the middle by centuries of boots. Halfway down, the minaret of the Sultan Hasan mosque lights up first, then the lamps in the square, then a whole sea of rooftops, one light after another, all the way to the river. Ilhan pauses on the step without turning around. “From here, Cairo’s not that big.”"
news = "Most evenings on the long steps below the Citadel in Cairo you’ll see two al-Azhar students going down one step at a time, slower than the water carriers."

[tracks.bond_ilhan.chapters.a1.choices.count_steps]
text = "Bet him tomorrow’s breakfast on how many steps there really are."
reply = "He names a number, I name a number, and then we count our way down one step at a time, no helping each other. At the bottom, his count is three higher than mine. “You skipped one at the turn. I saw you.” “You counted one twice halfway down.” We stand in the square arguing until every lamp is lit. In the end he says, “We count again tomorrow. I’ll bring chalk and mark every tenth step.”"

[tracks.bond_ilhan.chapters.a1.choices.walk_slow]
text = "Say nothing. Just walk down beside him, slowly."
hint = "You barely move half a step closer and he’s taking the stairs two at a time. Walk this near to him now and he’ll only hurry off."
reply = "Usually he walks like a gust of wind. Tonight he goes down one step at a time, as if each one has to be solid under his foot before he’ll take the next. I slow down too. The lamps in the square come on one by one until they reach our feet. On the last step he stops, eyes on the square. “Still on my way tomorrow.” “All right.” He takes two steps, then turns and adds, “My father’s off duty tomorrow.” The words are barely out before he catches himself, spins around, and ducks into the crowd."

[tracks.bond_ilhan.chapters.a2]
title = "A Poem Copied Twice Over"
text = "When the lecture breaks up one day, Ilhan calls me back and pulls a sheet of paper from his sleeve, folded into a square, the creases pressed sharp as a blade. “Take it. I copied it out.” I open it. It’s a poem, a dozen lines or so, about a ship beating north against the wind with a sail patched three times. It’s in his neat hand, but two of the lines in the middle are different: the ink goes dark and light in patches, and the paper has been scraped thin, so against the light you can see the old strokes underneath. Before I can say anything, he says, “Don’t just stare at the parts I botched.” “I haven’t said a word.” “Your eyes did.” He reaches out and pinches one corner of the page. He doesn’t take it back, and he doesn’t let go. “From the top. Read it to me.” I start at the first line. Only when the ship makes harbor do his fingers loosen on the corner, little by little."
news = "After the lecture broke up at al-Azhar in Cairo, someone saw the janissary boy hand the Kilwa student a neatly folded sheet, and then not let go of it."

[tracks.bond_ilhan.chapters.a2.choices.read_whole]
text = "Read straight through to the last line, without slowing at the two rewritten ones."
hint = "The moment you look up, his fingers tighten on the corner again. He isn’t ready to put this page in your hands for good."
reply = "When I reach the two lines I don’t pause, as if they had always been written that way. When I finish, he picks out one thing. “You stressed ‘sail’ wrong. You Kilwa people push everything to the back.” He presses the page into my hand and turns to go. Seven or eight steps on, he stops with his back to me. “Those two lines I changed. They’re my favorite.” Then he’s gone behind the pillars."
effects = [{}, {}, {}, { title = "A Poem Copied Twice Over" }]

[tracks.bond_ilhan.chapters.a2.choices.ask_two_lines]
text = "Finish, turn the page to the light, and ask what those two lines said before."
hint = "The moment you turn the page over, his hand is already reaching for it. Press him about those lines now and he’ll just snatch the poem back."
reply = "He turns his face to the pillar. “They were too plain. So I changed them.” “What’s wrong with plain?” “Then guess.” I guess that the ship could beat north against the wind because someone on the shore kept watching it, all the way into the harbor. He doesn’t say I’m right. He doesn’t say I’m wrong. His ears just go red, from the lobes to the tips. He takes the page from my hand, folds it back along its old creases into a square, and presses it against my chest. “Even if you guessed wrong, you’re not giving it back.”"
effects = [{}, {}, {}, {}, { title = "A Poem Copied Twice Over" }]

[tracks.bond_ilhan.chapters.a2.choices.praise_hand]
text = "Praise his hand first: not even the governor’s clerks write that neatly."
reply = "His face falls. “Handwriting is practice. Practice every day and anyone can do it. The poem is what I wrote.” He pulls the page out of my hand, folds it back along the creases, and tucks it into his sleeve. “When you’ve learned to praise a poem, I’ll show it to you again.” After that, whenever the teacher lectures on poetry, I listen harder than I ever have."

[tracks.bond_ilhan.chapters.s]
title = "I Was Only Passing By"
text = "The last lecture is over. The teacher rolls up the reed mat and stands it against the pillar. I come out through the main gate of al-Azhar, and there is Ilhan in the gateway, in a new robe of dark blue, the cuffs so stiff they could stand up on their own. In the spring he starts in the governor’s chancery. “I’ve got some business over by the Citadel,” he says. “This way’s on my way.” “The Citadel’s over there.” I point the other way. “This way, you’d go around half of Cairo.” The old gatekeeper on his stool is peeling an orange and doesn’t look up. “He’s been standing here since the noon prayer.” Ilhan goes red right down to the collar of his new robe. He coughs and asks when I’m leaving. The day after tomorrow, I tell him, with the caravan to Suez, then wait at Aden for the north wind. Home by spring. “How far is Kilwa?” “Three years, on foot. By ship, it depends on the wind’s mood.” He nods, as if he’s really working out those three years."
news = "In the gateway of al-Azhar in Cairo, the janissary boy stood all afternoon in a brand-new robe. The old gatekeeper says he was waiting for the student going home to Kilwa."

[tracks.bond_ilhan.chapters.s.choices.promise]
text = "Promise: whenever you’re back in Cairo, you’ll “happen by” the governor’s door first."
hint = "Your one promise in this life has already gone to someone else. Here in this gateway, all you can do is wish him well."
reply = "“Every time I’m back in Cairo, the first thing I do off the boat is come by the governor’s door. On my way.” “I might not be there. They could send a chancery clerk to Alexandria any day.” “Then I’ll wait at the door. On my way.” “You will not wait.” He glares at me. “Nothing looks worse than a man waiting. Standing in a gateway where everyone who walks past takes a look.” Then he seems to remember the whole afternoon he has just spent standing in this gateway, and his ears go red again. He takes a reed pen from his sleeve, crouches, and draws in the sand by the leg of the gatekeeper’s stool: a wall, a small door, a date palm beside it. “There are guards at the front. They won’t let a provincial in. Go to the back, under the palm, and ask for Ilhan of the chancery.” He stands, scuffs half the drawing out with his foot, and stops. “Got that, yoldaş?” I ask what yoldaş means. He says it’s what janissaries call the men who eat from the same pot. Then he leaves, faster than he came."
effects = [{}, {}, {}, {}, {}, { title = "I Was Only Passing By" }, {}]

[tracks.bond_ilhan.chapters.s.choices.heart]
text = "Tell him: on your way or not, you’ll come."
hint = "The words reach your lips and you swallow them yourself. The two of you haven’t come far enough for that yet."
reply = "For a long while Ilhan says nothing. The gatekeeper finishes one orange and picks up another. “Then don’t be late,” he says at last. “I hate waiting—” He swallows the rest and holds out his hand. I take it. His hand is colder than I expected, and he holds on longer than I expected, so long that the gatekeeper looks up from his orange at us, and then looks again. He lets go and steps back half a pace, as if about to say something that matters. “I was only…” The rest doesn’t come. He puts his hands behind his back and says something else instead. “Remember what you said. Next time you come to Cairo, say it again. I’ll answer you then.” He turns into the crowd in the street. At the corner he looks back once, to see whether I’m still standing in the gateway."
effects = [{}, {}, {}, {}, {}, { title = "I Was Only Passing By" }, {}]

[tracks.bond_ilhan.chapters.s.choices.own]
text = "Make it a contest: which of you gets famous in Cairo first."
reply = "“I’m a clerk.” He snorts. “A clerk’s name goes at the very bottom of the document, smaller than an ant. Famous for what?” “Then whoever’s name gets mangled by more people.” He stares at me, then laughs out loud, loud enough that the gatekeeper looks up. “Then you’ve already won. Baraka bin Salim—three years, and the teacher swallowed the ‘bin’ every single time.” “Yours is no better. Half the hall drags out the ‘han’ like a call to prayer.” “Their tongues are too short.” He holds up his palm and I slap it, hard. “Next time you’re in Cairo, I’ll keep count of everyone in the city who gets your name wrong. You’d better not leave a single one out.”"
effects = [{}, {}, {}, { title = "I Was Only Passing By" }, {}]

[tracks.reunion_ilhan]
name = "Ilhan: Still the First to Arrive"

[tracks.reunion_ilhan.chapters.reunion]
title = "Still the First to Arrive"
text = "In 1562 my ship ties up at the Bulaq wharf. The governor’s chancery is inside the Citadel. It’s barely light and the door isn’t open yet, but someone in the courtyard is already setting out stools, one after another along the wall, for the people who come with petitions. The man setting them out wears a dark blue robe gone thin at the cuffs. It’s Ilhan. He straightens up, sees me, and the stool in his hands stops in midair. “I was on my way anyway.” Then he hears it himself: this is his own chancery. He puts the stool down and dusts off his hands. “…I mean, you’re too early, Provincial.” He takes me inside. Ledgers are stacked on the table, and the cover of the top one reads: Janissary sons’ school fees, arrears. “All accounted for,” he says. “Eleven years of accounts, three hundred and more names. Whose pay was how many quarters late, which boy left because of it. It’s all here.” He pauses. “I didn’t use my father’s name. Not once.”"
news = "In the chancery inside the Citadel in Cairo, the stools are set out before dawn. They say the clerk from the janissary house has traced eleven years of soldiers’ sons’ school debts, every last entry."

[tracks.reunion_ilhan.chapters.reunion.default]
effects = [{ text = "Baraka: Every ship that tied up at Bulaq this year, I had someone ask after, one by one. None of them were yours. I’m still the first to open the chancery door every day. The soldiers’ sons’ fee accounts are all accounted for: eleven years, three hundred and seventeen names. Whose pay was how many quarters late, which boy left because of it, every entry squares. I didn’t use my father’s name. The governor has seen it, and says that from now on, in any quarter the pay doesn’t come, the school will carry the debt on its books and turn no one out. Mustafa is at the lectures these days, in the front row, there before dawn. I don’t know who he got that from. This is written on paper left over from copying chancery documents. It just happened to be lying around, so don’t read anything into it. Next time, use the back door. —Ilhan" }, {}]

[tracks.reunion_ilhan.chapters.reunion.choices.help_clerks]
text = "Shrug off your outer robe, sit down, and help him make a fair copy of the soldiers’ debts."
reply = "I sit down across from him. He reads, I copy: the name, the father’s regiment, how many quarters his pay was late, how much is owed, whether the boy is still at school. Outside, the stools fill up one by one and empty again. When we reach Mustafa’s page, he lays a hand on the paper and looks at it a long time before he lets me go on. When the minaret calls the sunset prayer, the last ledger closes. He picks up my stack and turns through it page by page. “Your hand is much better than it was.” “Your mouth hasn’t changed.” “Good thing it hasn’t.” He squares the ledgers and ties them with cord. “If it had, you wouldn’t know me off the boat.” He pulls the knot tight and looks up. “Coming back tomorrow? This lot goes before the governor, and the chancery is short one man who can haggle.”"
effects = [{}, {}, {}, { title = "Still the First to Arrive" }]

[tracks.reunion_ilhan.chapters.reunion.choices.debate_again]
text = "Challenge him to one more debate. He picked the question last time; this time it’s yours."
reply = "He rolls up his sleeves. “Go on.” “The question is this: arriving at the lecture before dawn, standing a whole afternoon in a gateway, waiting on the steps until the lamps come on. Is that passing by?” The two other clerks in the chancery put down their pens. Ilhan opens his mouth several times, quotes scripture once, quotes the janissary regulations once, tangles himself tighter with every answer, and finally slaps the table. “That question isn’t fair!” “Then concede.” “Never.” He hugs a ledger to his chest. “By the rules of the lecture, a debate on an unfair question doesn’t count. Come back next year, and I’ll set the question.” The two clerks duck their heads, shoulders shaking. He glares at them, then at me, and then he can’t hold his own face straight either."
effects = [{}, {}, {}, { title = "Still the First to Arrive" }]

[tracks.reunion_ilhan.chapters.reunion.choices.not_passing]
text = "Tell him: this time you weren’t passing by. You came all the way from Kilwa for this."
hint = "That day in the gateway, the two of you never got that far. Say it now and he’ll only think you’re teasing him."
reply = "He sets down the ledger in his hands and looks at me for a long time. Outside, someone on a stool coughs, waiting to hand in a petition. “I know,” he says. “What you said that year in the gateway, I remember. Every word. You said you’d say it again next time you came to Cairo.” He crosses the room, shuts the chancery door, and slides the bolt home. “I wasn’t passing by either. Not the front row, not the Citadel steps, not that gateway. Not once.” He comes back and takes my hand. It’s still cold, the same as that year. But this time he shows no sign of letting go. “No one can see in here,” he says. “Don’t go.” Outside, the man on the stool coughs again. Ilhan doesn’t open the door."
effects = [{}, {}, {}, { title = "Still the First to Arrive" }]

[tracks.reunion_ilhan.chapters.reunion.variants.with_salih]
text = "In 1562 my ship ties up at the Bulaq wharf. The governor’s chancery is inside the Citadel. It’s barely light and the door isn’t open yet, but someone in the courtyard is already setting out stools along the wall for the people who come with petitions. It’s Ilhan. He straightens up, sees me, and the stool in his hands stops in midair. “I was on my way anyway.” Then he hears it himself: this is his own chancery. He puts the stool down. “…I mean, you’re too early, Provincial.” He takes me inside. Ledgers are stacked on the table, and the cover reads: Janissary sons’ school fees, arrears. “All accounted for. Eleven years, three hundred and more names. I didn’t use my father’s name. Not once.” He pushes the ledgers aside and says, “This year at the flood festival, I’m going to Roda Island with Salih. The one from Yemen, you remember.” A pause, and then he adds: “It’s on my way.”"
