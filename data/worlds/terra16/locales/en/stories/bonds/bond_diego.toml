# 迭戈的羁绊线（bond_diego / reunion_diego）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_diego]
name = "Diego: The Slow Left Foot"

[tracks.bond_diego.chapters.c1]
title = "Before the Sword Was Lent"
text = "The courtyard of the Casa de Pilatos was laid with fine sand, sprinkled every morning so it gave underfoot. I took a practice sword down from the rack under the arcade. The leather on its grip was worn shiny, older than on any of the others. “That one’s mine.” It was Diego talking, the best blade among the pages. He was leaning against a pillar, his short jacket buttoned to the very top. “Anyone that pretty—too pretty by half—has soft wrists. Can’t hold a sword steady.” A few pages by the well laughed out loud. I didn’t put the sword back. “We’re not comparing faces. We’re comparing feet. You walk a pass, I’ll follow it.” He glared at me, and I looked right back. He came over, pulled the sword out of my hand, and drove it point-first into the sand. “What are you looking at? Go practice.” Then he was the first to drop into a stance: three steps back, two forward, turn. I followed. One pass, two. The sword stayed stuck in the sand, and nobody touched it. He turned fast, but every time he came around, his left foot landed on the same spot, heel first, half a beat behind his right. By the time the sun reached the eaves, the two of us had scuffed the sand into a mess—except for that one spot, stamped into a deep hollow."
news = "The pages at the Casa de Pilatos in Seville say Diego never lends out his practice sword. This spring he left it stuck in the sand and spent a whole morning matching footwork with someone instead."

[tracks.bond_diego.chapters.c1.choices.footwork_only]
text = "Stick to footwork, and learn pass by pass where his left foot falls."
reply = "By the sixth pass he was out of breath. He wiped his face on his sleeve. “You pick things up fast.” “Your left foot is easy to read.” He looked down at his own feet and was still looking when the pages by the well had all drifted off. Then he pulled the sword out of the sand and held it out to me, hilt first. “Use this one again tomorrow. Put it back on the rack when you’re done, and don’t get the leather wet.”"

[tracks.bond_diego.chapters.c1.choices.stare_back]
text = "Stand still and hold his gaze until he’s the one to look away."
reply = "He looked away first. His ears went red all the way down his neck, and he muttered something in broad Andalusian I didn’t catch and stalked off. At the stable door he stopped, without turning around. “Tomorrow. Same hour. Whoever doesn’t show is a dog.”"

[tracks.bond_diego.chapters.c2]
title = "The Slow Left Foot"
text = "In June the fencing master gave us blunted swords for the first time. A ring was drawn in the middle of the sand. Step out of it and you lost. Three moves and Diego had me at the edge of the ring. On the fourth, his point thumped against the leather over my chest. The pages by the well cheered. He had just raised his sword over his head when I said, “Your left foot is too slow.” The sword stopped in midair. “Losers sure talk a lot.” “When you turn, your left foot lands half a beat after your right. Today I was the slow one. Against somebody else, maybe not.” He threw the blunt sword onto the rack. “I won.” Then he walked off. For the next three days he sat as far from me as the table allowed, and when we passed in the corridor he hugged the opposite wall. On the fourth morning I heard sand shifting behind the stables. Diego was there alone, turning one way, then back, and his left foot now came down as fast as his right. He saw me. He didn’t stop, and he didn’t send me off. He only shifted over to the side where I could see him best from where I stood. That night his boots stood outside the dormitory door. Across the ball of one sole a new mark had been worn in, slanting, right where a turn takes the strain."
news = "First bout with blunted swords at the Casa de Pilatos: Diego won in three moves, then avoided everyone for three days. The pages say he’s been out behind the stables before dawn every day practicing his turn."

[tracks.bond_diego.chapters.c2.choices.test_step]
text = "Step in and walk that turn with him once more, then tell him it’s fixed."
hint = "He’s still sore about it and goes the long way around whenever he sees you coming. You aren’t close enough yet."
reply = "He snorted. “It was always fine.” But he walked it again, and again. Each time I said “good,” he walked it once more, and only on the third “good” did he stop and rest the sword on his shoulder. “Next time you don’t just find faults. One complaint, one compliment.”"

[tracks.bond_diego.chapters.c2.choices.say_again]
text = "In front of the pages at the well, say it again: still slow on the left."
reply = "He chased me three times around the courtyard and caught me by the collar at the fountain. Once he had hold of me he didn’t seem to know what to do next, and he was the one who started laughing. “That mouth of yours is going to get you a beating someday.” At supper that night he broke his bread in half and tossed one piece into my bowl, without a word."

[tracks.bond_diego.chapters.b1]
title = "The Ring He Missed"
text = "The autumn ring-tilting was held in the long yard behind the house. A cord was strung between two poles, and from it hung a brass ring hardly bigger than a finger ring. You charged on horseback and tried to carry the ring off on the tip of a wooden lance. That counted as a hit. Every page who placed a bet put it on Diego. He rode the chestnut mare and didn’t miss once in the first two rounds. In the third round the ring was swapped for a smaller one, and only the two of us were left. Diego reined in and jerked his chin at me. “You go first.” When my lance tip touched the ring my wrist went numb, and the ring was already hanging from the point. The yard erupted. Then Diego. His horse ran smooth and steady, but his lance passed a full hand’s width under the ring, a miss that didn’t look like him at all. The ring swung twice and stayed on the cord. When the crowd had gone I found him at the hitching post, unsaddling. “Did you let me win?” He hoisted the wooden lance onto his shoulder. “Too windy.” The banners over the long yard hung limp. There wasn’t a breath of wind. The ring nobody had taken still dangled from the cord, glinting in the sun."
news = "At the autumn ring-tilting at the Casa de Pilatos in Seville, Diego, the page everyone had bet on, missed by a hand’s width and someone else took the ring. Ask him and he’ll only tell you it was windy."

[tracks.bond_diego.chapters.b1.choices.ask_straight]
text = "Follow him into the stable and ask again: did you miss on purpose?"
reply = "“Too windy.” By the third time he said it, even he didn’t believe it, so he turned his back and started brushing down his horse. I stayed in the stable doorway. He kept his back to me, each stroke of the brush harder than the last. “Quit staring. Go brush your own horse.” That evening, while he was at it, he combed out my horse’s mane too."

[tracks.bond_diego.chapters.b1.choices.both_names]
text = "Go to the steward of the stables and put both our names down for the next match."
reply = "The list went up on the stable door. Diego stopped when he passed it, took the charcoal out of my hand, and drew a stroke after my name, then another after his own. “One each. Nobody owes anybody.” He pushed the charcoal back into my hand, took two steps, and turned around. “Next time I ride first.”"

[tracks.bond_diego.chapters.b2]
title = "The Clink of Silver"
text = "Three silver plates had gone missing from the house. The steward was certain it was the Morisco page, the new one who always kept to himself. In the dormitory, Diego kicked his boots against the floor until they banged. “He doesn’t even know where the key to the silver cupboard hangs!” He talked me into keeping watch with him. We sat under the stairs outside the silver room until the small hours, and when the candle burned out we didn’t light another. Diego kept his voice low. “If he doesn’t come tonight, I’ll sit here again tomorrow.” The first to hear anything was the scullery boy who slept by the kitchen hearth. He came running barefoot and tugged at Diego’s sleeve. Sure enough, something clinked softly over by the silver cupboard. We didn’t draw. Diego held the door, and I went for the steward. When the lamp was carried in, the thief was stuffing a fourth plate inside his shirt. It was the steward’s nephew. The steward went white, then red. The boy was foolish, he said; it could wait until morning; everyone back to bed. Diego didn’t move. Looking the steward in the eye, he said the Morisco page’s name once, then again, and the third time very slowly, as if afraid someone hadn’t heard. The steward cleared his throat and stepped aside, leaving the doorway behind him open. His nephew set the plate down on the table with a clang and was already edging toward the door."
news = "The silver plates missing from the marquis’s house in Seville have turned up: the steward’s nephew took them from the cupboard in the middle of the night. Diego said the name of the page they’d blamed three times, right to the steward’s face."

[tracks.bond_diego.chapters.b2.choices.hold_door]
text = "Block the doorway with my back, so Diego can go over the steward’s head to the majordomo."
hint = "Diego can’t yet tell whose side you’d take, and he won’t trust you with that door. You aren’t close enough yet."
reply = "The nephew threw himself at the door once, couldn’t get through, and shrank back. Diego took him by the scruff and marched him off toward the majordomo’s rooms. As he went past me he gave me a look, and there was no challenge in it. The next day the majordomo asked who had caught the thief. Diego gave three names: his own, mine, and the scullery boy’s from by the hearth."

[tracks.bond_diego.chapters.b2.choices.chase_alone]
text = "The moment he squeezes out the door, chase him down the stairs alone."
reply = "I caught his sleeve on the bottom step, but he wrenched free and it slid out of my fingers. Diego came flying down behind me and pinned him to the stone. Then he rounded on me. “Do you want to get killed? He’s got a knife in his belt!” When he had his breath back, his voice dropped. “Next time, call me.”"

[tracks.bond_diego.chapters.a1]
title = "The Same Punishment"
text = "One morning that spring I slept in. By the time I reached the front court, still doing up my buttons, the bell for morning duty had long since rung. The steward stood on the steps with the roll in his hand, and he leaned in to study my face as if hunting for the creases of a pillow. I turned my face away. “Punishment. Three days mucking out the stables, and fill the troughs.” “Me too.” Diego stepped out from the end of the line. “I was late too.” The steward checked the roll. “You’re marked present.” “Marked wrong.” The stable stank the moment you walked in. We each took a pitchfork and forked out the old straw, then hauled water from the well, bucket after bucket. I straightened up, meaning to go and have it out with the steward, but at my first step Diego nudged the side of my shoe with the toe of his and tipped his chin at the trough: work first. There were four buckets by the well. Three were plain wood. One was bound with iron, and full, it took two hands to lift. Only on the third trip did I see it: the iron-bound bucket had been in his hands the whole time, and not once had it come to me."
news = "The stables at the marquis’s house in Seville have been swept unusually clean this week. Word is someone missed the morning bell and is being punished, and Diego insists he was late too and has been hauling water alongside for three days."

[tracks.bond_diego.chapters.a1.choices.confess]
text = "Go to the steward and set it straight: I was the late one, not him."
reply = "The steward heard me out and doubled both our punishments: one for sleeping in, one for lying. Diego walked past me with a bucket and said one word under his breath: “Idiot.” Two steps on, he added, “I’ll wake you tomorrow.” The next morning, while it was still dark, someone kicked the foot of my bed. Then again. Then again."

[tracks.bond_diego.chapters.a1.choices.take_bucket]
text = "Don’t thank him. Just reach over and take the iron-bound bucket from him."
hint = "Grab his bucket now and he’ll only think you’re picking a fight. You aren’t close enough yet."
reply = "He wouldn’t let go of the handle, and neither would I. We stood locked like that in the stable doorway for a good while, water slopping out over both our shoes. He was the one who let go, and turned his face away. “Suit yourself.” When the work was done he sat on the straw pile and shifted over to leave half of it free. He didn’t say a word until I sat down, and then it was only to ask whose turn it was to carry the first load tomorrow."

[tracks.bond_diego.chapters.a2]
title = "After We Capsized"
text = "At the end of June the house held a boat race for the pages on the Guadalquivir, from below the Torre del Oro all the way to the bridge of boats at Triana. Diego and I were put in the same boat, him in front, me behind. Before the start, I had tied the lashing on my oar too loose. At the bend in the river the oar slipped out of its thole. The boat lurched, and the river poured in. I swallowed a mouthful and couldn’t find anything to hold. A hand shoved me from behind, pushing me toward a post by the bank. By the time I had my arms around it and looked back, Diego was still in the water, his head coming up once, then going under again. He dragged himself up the muddy bank on his own and lay face down in the grass, coughing so hard his whole back shook. He wanted to swear at me. Twice he opened his mouth, and not one word came out. An oar had laid my arm open, and blood was running down over my wrist. When he saw it, he reached for the page’s sash at his waist. The wet cloth had pulled into a hard knot; he worked it loose with his teeth, wound it around my arm, pulled it tight, and tied it off. Once he had his breath, the first thing he said was, “Next time tie down your lines first.” The second came a long while later. “Are you all right?”"
news = "At the marquis’s boat race on the Guadalquivir, a boat went over at the bend between the Torre del Oro and the bridge of boats at Triana. Diego, the page, half drowned himself, but first he shoved his crewmate onto a post by the bank."

[tracks.bond_diego.chapters.a2.choices.keep_sash]
text = "Keep the sash, and don’t give it back even once it’s dry."
hint = "At a moment like this he’d only haul you out of the river and walk off. You two aren’t close enough yet."
reply = "He came asking for it twice. The first time I said it wasn’t dry. The second time I said I couldn’t find it. The third time he didn’t come; he drew a new one from the steward instead. But he never wore the new one. At night it hung on the nail at the head of his bed. Every evening before the lamps went out, his eyes would slide toward it, and then toward me."
effects = [{}, {}, {}, { title = "After We Capsized" }]

[tracks.bond_diego.chapters.a2.choices.pound_back]
text = "When the coughing takes him again, kneel and pound his back until he swears at me."
hint = "Get that close right now and he’ll shove you away. You aren’t close enough yet."
reply = "“Heavy… hands…” He got half the insult out and coughed up more river. When it was over he didn’t get up. He stayed with his forehead against my knee, breathing hard, for a long time. Only when people on the water started calling our names, closer with every shout, did he push himself up. He untied the sash from my arm and tied it again, so tight that my fingers went numb. That sash stayed with me afterward. He never once came to ask for it."
effects = [{}, {}, {}, {}, { title = "After We Capsized" }]

[tracks.bond_diego.chapters.a2.choices.scold_first]
text = "Tell him off first: he nearly drowned, and he was busy shoving other people?"
reply = "He laughed through his coughing. “You’ve got plenty of breath for yelling.” I wanted to keep going, but he had already flopped onto his back in the grass and was ignoring me. So I ignored him too. We sat side by side on the bank, one watching the river and one watching the sky, until the sun had dried both our shirts and the hems were stiff as paper."

[tracks.bond_diego.chapters.s]
title = "I Haven’t Won It Back Yet"
text = "One December morning a mule cart stood outside the Casa de Pilatos with Diego’s chest roped onto the back. He would go to the garrison in the city first, and when there was a ship, on to the Indies as an officer. My own ship would sail west in the spring. When I came out he was crouched by the cart, tightening the rope on his chest, then giving it two more tugs. A little brass ring hung from the end of the rope, rubbed bright. On the day of the ring-tilting, a ring just like it had hung from the cord in the long yard, and nobody had carried that one off. “Take the sword on board,” he said. “Don’t let it rust.” “That one’s yours.” “It’s on loan.” He stood and brushed the dirt off his knees. “A loan gets paid back. I’ll want it when I come back.” The carter called from up front. Diego walked as far as the gateway and stopped, his eyes fixed on the wall across the street. “Don’t die at sea,” he said. “I haven’t won it back yet.” Then he bit his lip, as if there were more behind it and that one sentence had blocked all of it in."
news = "This year’s pages at the Casa de Pilatos have scattered. Diego, the best sword of the lot, left by mule cart for the Seville garrison first, and they say the Indies after that, as an officer."

[tracks.bond_diego.chapters.s.default]
news = "A mule cart stood outside the Casa de Pilatos first thing in the morning: the page Diego was leaving. He stood in the gateway a long while, as if waiting for someone, and only climbed aboard when the carter called for the third time."

[tracks.bond_diego.chapters.s.choices.promise]
text = "Promise him: I won’t die at sea, and I’ll wait for him to win."
hint = "You two haven’t come far enough for a promise like this, or your one promise of a lifetime already belongs to someone else. The driver is calling; there’s only time to wish each other well."
reply = "“All right,” I said. “And don’t you die in the Indies. I’ll look after the sword. You look after that left foot.” “It’s been fixed for ages.” He snorted. “Practice every day. If it rusts, I’m not taking it back.” He held out his hand and I took it. He gripped hard, like we were arm wrestling, and neither of us would let go first; when we did, both our palms were damp. “That’s settled, then,” he said. “And if you dare let me win when the day comes, I’ll haul you in like a pirate.” Half a street away, he leaned out from under the cart’s cover and shouted something back. The wind off the river carried it away. I guessed it was “Done,” so I shouted “Done!” back at him, loud enough that the porter poked his head out to look. As the cart turned the corner, the brass ring was still swinging at the tail."
effects = [{}, {}, {}, {}, {}, { title = "I Haven’t Won It Back Yet" }, {}]

[tracks.bond_diego.chapters.s.choices.heart]
text = "Answer him: then you have to come back alive and win—I’ll be waiting."
hint = "“I’ll be waiting” sticks in your throat. You haven’t come that far yet, or your one promise of a lifetime has already gone to someone else."
reply = "He froze, then turned to look out at the street, and kept looking until the carter called again. “You,” he said. “You’ll say anything, won’t you.” Then he seized my hand and squeezed until his knuckles went white and I nearly cried out, and only then let go. Four red marks stayed on the back of my hand until noon. “I’ll hold on to that, and you don’t get to take back a word of it.” He climbed onto the cart with his back to me. “When I come back, I’ll give you my answer.” Once the cart was moving he didn’t look back, not once. He only stuck his left hand out from under the cover, gave it one wave behind him, and snatched it back in, as if afraid someone might see. The brass ring tied to the rope kept swinging, and I could see it all the way from my end of the street."
effects = [{}, {}, {}, {}, {}, { title = "I Haven’t Won It Back Yet" }, {}]

[tracks.bond_diego.chapters.s.choices.own]
text = "Agree to one more bout in some port in the Indies; whoever yields first buys the wine."
reply = "“I won’t yield.” “Then you’re definitely buying.” He drew the new sword the house had issued him and cut a line into the stone of the doorframe, sparks flying. “That’s one.” He sheathed it. “When you come back, you cut the second.” Then, as an afterthought: “Start saving for that wine. Wine’s dear in the Indies.” His eyes flicked to the old practice sword on my back, but in the end he didn’t ask for it. The porter yelled after us—did we think the marquis’s doorframe was ours to carve up? Diego had already jumped onto the cart. He jerked his chin at me. “Remember. Left foot.” I looked down at my own left foot. When I looked up, the cart was far down the street. The mark in the doorframe was deep and stark white, and a whole winter of rain didn’t fade it."
effects = [{}, {}, {}, { title = "I Haven’t Won It Back Yet" }, {}]

[tracks.reunion_diego]
name = "Diego: A Sword Friend in Port"

[tracks.reunion_diego.chapters.reunion]
title = "A Sword Friend in Port"
text = "That year all of Havana smelled of lime and rang with chisels. On the west bank of the harbor channel, at the edge of town, a new fortress was going up, its walls only head-high so far, and the soldiers standing over the work were rougher than the men doing it. A boy selling water slipped me a note with a single line on it: the lane behind the fortress works, third door, sundown. No name, but I knew the hand. Every stroke leaned to the right, like something written by someone whose left foot lands late. Behind the third door was an empty yard, wild guava growing in one corner, no guards. Diego sat behind an old table, an officer’s red sash at his waist, his doublet buttoned to the top as ever. He was taller than seven years ago, and there was a new scar at the corner of his mouth. He didn’t get up. He took a sheet of paper from inside his coat, spread it on the table, and smoothed it flat with his palm. It bore the governor’s seal, and under the seal, my name. Then he unbuckled his sword, walked to the far side of the yard, and leaned it against the foot of the wall. A little brass ring was tied to the guard, and it struck the stone with a small clink. He came back and sat down. The wall was twenty paces from the table. “Sit,” he said. “This landed on my desk this morning. Orders are, if I see you, I take you in.”"
news = "The officer from Seville at the governor’s house in Havana shut himself in that empty yard behind the new fortress works at sundown and came out after dark, the brass ring on his sword jingling. Ask him who he met, and he says nobody."

[tracks.reunion_diego.chapters.reunion.default]
news = "In the empty yard behind the fortress works in Havana, the officer from Seville at the governor’s house sat alone until midnight, a sheet of paper spread on the table and a sword leaning against the wall."
effects = [{ text = "The portrait on the warrant looks nothing like you. The left foot is fixed—come and see for yourself. I waited in that yard until midnight; which port next time, you choose. —Diego" }, {}]

[tracks.reunion_diego.chapters.reunion.choices.burn_warrant]
text = "Fight him to a draw, then see what he does with that paper."
reply = "He fetched his sword from the wall and I drew mine. The first few passes were only feeling each other out, like walking footwork in the sand at the Casa de Pilatos. After that neither of us gave an inch, and the wind of our blades sheared guava leaves off the branches. At the thirtieth pass he lowered his sword. “Enough.” Breathing hard, he looked down at his own feet. “Left foot. Not slow anymore, is it?” “Not anymore.” “You haven’t gotten worse either,” he said. “You’ve rewrapped the grip, haven’t you?” “Twice.” He folded the paper in half, then in half again, tucked it inside his coat, and pressed his hand flat over it against his chest. “I didn’t see you today.” At the door he looked back. “Next time we find a bigger yard. This one’s too small to turn around in.”"
effects = [{}, {}, {}, { title = "A Sword Friend in Port" }]

[tracks.reunion_diego.chapters.reunion.choices.draw_swords]
text = "Fetch his sword from the wall: today we finish that old bout."
reply = "When I handed him the sword he smiled, and it was the first time in seven years I had seen him do it. We fought from sundown until dark. He had gotten faster, and so had I, and there wasn’t half a beat of opening left in his left foot. He hunted for one in mine until dark and never found it. We knocked two guavas off the tree in the corner, and they rolled under the table. In the end we were both leaning on our swords, gasping, with nothing to choose between us. “You haven’t slowed down either,” he said, sounding a little put out. “This isn’t over.” “Next time.” He crumpled the paper on the table into a ball and tossed it into my arms. “You keep it. Next time I’ll come and take you in myself. That’s when I’ll have won it back.” He hung his sword at his hip again. The brass ring gave a clink, and he was already out the door."
effects = [{}, {}, {}, { title = "A Sword Friend in Port" }]

[tracks.reunion_diego.chapters.reunion.choices.stay_night]
text = "Leave the swords alone, go around the table to him, and finish what was said back then."
hint = "Those words were never spoken back then. Today, there’s a warrant on the table between you."
reply = "I went around the table. He didn’t move. His hand was pressed down on that paper hard enough to crease it. “I’m back,” I said, “and you’re alive. You said you’d answer when you came back. So answer.” He looked up at me like someone learning a face again after seven years. “I answered long ago,” he said. “I knew the day the boat went over.” He stood, and the chair scraped a long way across the flagstones. He pulled me in and held me, his chin knocking against my shoulder, so tight I could hardly breathe. “The governor’s house can’t know about this.” His voice was muffled in my collar. “I don’t care.” The warrant slid off the table and landed at our feet, and he planted a boot on it. Outside the yard the drum beat for the change of guard, one stroke after another. He didn’t let go."
effects = [{}, {}, {}, { title = "A Sword Friend in Port" }]

[tracks.reunion_diego.chapters.reunion.choices.ask_knew]
text = "Ask him: you knew all along, didn’t you?"
hint = "This isn’t the time to ask that yet."
reply = "He looked off toward the sword by the wall, and it was a while before he got anything out. “What are you looking at.” Another pause. “So what if I did? That thing with my left foot—you’re the one who spotted it first.” He reached out, turned the paper on the table face down, and kept it there under his palm. He didn’t turn it back over. Over by the wall the wind nudged the brass ring on his sword against the stone, and he let it be."
effects = [{}, { title = "Did He Always Know?" }]

[tracks.reunion_diego.chapters.reunion.variants.unveiled]
text = "That year all of Havana smelled of lime and rang with chisels. On the west bank of the harbor channel, at the edge of town, a new fortress was going up, its walls only head-high so far. A boy selling water slipped me a note with a single line: the lane behind the fortress works, third door, sundown. No name. Every stroke leaned to the right, like something written by someone whose left foot lands late. Behind the third door was an empty yard with no guards. Diego sat behind an old table, an officer’s red sash at his waist, his doublet buttoned to the top, a new scar at the corner of his mouth. He took a sheet of paper from inside his coat and spread it on the table. It bore the governor’s seal, and under the seal, my name. He unbuckled his sword and leaned it against the wall twenty paces off; the little brass ring on the guard struck the stone with a clink. He came back and looked up at me, and something in his eyes shifted. “The year of the ring-tilting, I already…” He stopped. “Never mind.” After that, whenever he spoke, he kept his eyes on the paper and didn’t look at my face again. “Sit. This landed on my desk this morning. Orders are, if I see you, I take you in.”"
