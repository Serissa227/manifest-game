# C7 英文覆盖：许采（多一份纸 / 教船户识字的人）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_xu_cai]
name = "Xu Cai: One Extra Sheet"

[tracks.bond_xu_cai.chapters.c1]
title = "One Extra Sheet"
text = "On the first day of lessons, the teacher’s daughter, Xu Cai, went desk to desk with an armful of primers. She had copied them herself, the Three Character Classic, and the ink still smelled fresh. At my desk she set down a copy, then slid a loose sheet from the bottom of the pile and laid it on top. “What’s this?” “An extra. In case someone forgets theirs.” She was already moving on to the next desk. Then the roll book came around, and each of us had to write our own name. I wrote “Lin,” and the last sweeping stroke got away from me. It ran clean out of the box and into the next pupil’s space. Someone in the back row laughed. I was about to rub it out with my sleeve when Xu Cai came back and pinned the corner of the book so I couldn’t. She studied that stroke for a while, then said quietly, “Learn to write your own name, and you’ve already stopped half the cheats.” She laid her own freshly rinsed brush beside my inkstone. The handle was still wet."

[tracks.bond_xu_cai.chapters.c1.choices.take_the_sheet]
text = "Take the extra sheet and ask her to teach me to write my name properly."
reply = "She didn’t sit. She stood by the desk and watched me write. The first time, the stroke ran off again. The second time I stopped it too soon, as if someone had chopped it off. She reached over and pressed my wrist down half an inch. “When the brush gets here, pause. Then go on.” The third time it came out right. I held it up for her, and she nodded, slid the two spoiled sheets out from under my hand, and folded them into a small square that disappeared up her sleeve. “I’ll throw these away for you.” After lessons I went through the wastepaper basket outside her gate. They weren’t in it."

[tracks.bond_xu_cai.chapters.c1.choices.ask_everyone]
text = "Stop her and ask: does everyone get an extra sheet?"
reply = "She stopped and looked back at me. “Do you want it or not?” I said I did. She said “Mm” and walked off with the primers. At the door, one hand already on the frame, she turned and added, “Everyone gets one.” When lessons let out I took a good look around. Every other desk had just the one copy."

[tracks.bond_xu_cai.chapters.c2]
title = "The Window She Pushed Open"
text = "In the sixth month, men came from the county to check on the school’s pupils. They stood outside the door with the roll book and called the names one by one. I was out back drawing water. I had just hauled the bucket up to the lip of the well when I heard, from the front, “Lin—” My hands let go, and the bucket dropped back down the well. The back window creaked open. Xu Cai leaned halfway out, waved at me, and said under her breath, “Answer from here.” I called “Present!” through the window. The man at the door craned in. “Which one’s that? Why answer from the back?” “Someone has to mind the well,” said Xu Cai. “A chicken fell in the other day.” He ticked the book and left. When the footsteps had gone out of the lane, she was still at the window. “When your name is called, you always say ‘Eh’ first, then ‘Present.’ People here don’t answer like that.” A pause. “And when you write, don’t stick your little finger out.” Then she shut the window and went back inside. I still had the well rope in my hands. The bucket sat at the bottom, full to the brim."

[tracks.bond_xu_cai.chapters.c2.choices.thank_quietly]
text = "Fix both things in my head, and next day leave a packet of candied fruit on the corner of her desk."
hint = "She doesn’t want you feeling you owe her. Leave the fruit and she’ll only push it back."
reply = "Next day I got in first, tucked the oiled-paper packet onto the corner of her desk, and turned to rummage in my own books. She came in and saw it. She didn’t ask who had left it, and she didn’t open it. It went into her book box. After that, the primer pages she copied for me always had one more line at the bottom, so small I had to hold the page up to my nose: “Test tomorrow on page seven.” “Recite tomorrow: ‘If the child is not taught.’” My marks were never bad again, and the teacher said I had finally woken up."

[tracks.bond_xu_cai.chapters.c2.choices.joke_it_off]
text = "Laugh and say I’ve always liked answering from under a window."
reply = "“When Grandma calls us to eat, I always answer from under the kitchen window,” I said. “Habit.” She looked at me and didn’t laugh. “Then answer that way a few more times,” she said. “Once you’re used to it, you won’t be scared.” After that, whenever the teacher called the roll, I ran the word “Present” through my head once before I opened my mouth."

[tracks.bond_xu_cai.chapters.b1]
title = "A Primer for Boatmen"
text = "When autumn came, Xu Cai stitched a notebook together out of coarse paper and left the cover bare. The boatmen at the docks, she said, signed their contracts with a thumbprint. How much they had borrowed and how much they owed was whatever the broker said. “Five characters first. Boat, cargo, money, borrow, repay.” After lessons she set a little stool on the open ground by the docks where the nets were hung to dry, and taught the boatmen’s children to write. They held the brush like a fish spear, and “borrow” came out in pieces. I squatted beside them watching for ages until I couldn’t stand it, and rattled off a line in Hokkien: “Borrow’s got a man on one side and ‘long ago’ on the other; borrow it today, pay it back tomorrow.” The children stared, then fell about laughing, chanting it as they laughed. By the third time through they all had it, faster than a whole afternoon of her teaching. Xu Cai stood behind the stool with the coarse notebook in her hand. She watched me for a long time and didn’t say a word."

[tracks.bond_xu_cai.chapters.b1.choices.write_rhymes]
text = "Make up a rhyme for each of the five, and copy them into her notebook."
hint = "She isn’t sure yet you’d stick with work nobody will ever thank you for. The notebook stays on her side of the stool."
reply = "That night I made up five. She copied them into the notebook one by one, in a hand far neater than my reciting. At the last one, “Borrow, write a note; repay, tear up the note,” she stopped. “I’m changing one word.” She struck out “tear up” and wrote “take back.” “You take it back and tear it up anyway, don’t you?” “You take it back,” she said, “and tear it up yourself. If the broker keeps the contract, you might as well not have paid.” Hers was better. I insisted a rhyme only counts if it’s easy to say. She bent over the next line, and her shoulders shook twice. She was laughing."

[tracks.bond_xu_cai.chapters.b1.choices.teach_with_her]
text = "Split the teaching: she guides their hands, I lead the chanting."
reply = "She traced stroke after stroke while I led line after line, loud enough for half the docks to hear. At dusk the boatmen came off work to fetch their children. One old boatman bent over the characters scratched in the dirt with a stick and squinted at them a long while. Then he put one thick finger on “repay.” “That one. I know that one now.” Xu Cai turned away to pack up the brushes and ink, and kept her back to us a long time. I saw her lift her sleeve and press it to her eyes."

[tracks.bond_xu_cai.chapters.b2]
title = "Medicine for Her Father"
text = "That autumn, ships from the north brought news that a band of raiders had roamed all the way to the walls of Nanjing. The school closed for a few days, and in those days the teacher, Xu Cai’s father, fell ill. He coughed all night and couldn’t sleep. Xu Cai nursed him alone, copying by day and brewing medicine by night. I rode one of my family’s boats up to Zhangzhou, where the physician handed me three wrapped doses. “One a day. If he isn’t better when they’re gone, come back.” I wrapped them twice in oiled paper and kept them inside my coat the whole way, afraid of the damp. It was dark when I reached her courtyard. The pot on the medicine stove was bubbling. Xu Cai had fallen asleep on the stool beside it, her head against the wall. She still held a brush, and a half-copied page lay across her knees; the last character was a single horizontal stroke. In the back room the teacher coughed a while and called hoarsely, “Cai’er?” She frowned in her sleep and didn’t wake. I answered through the door curtain, “Sir, the medicine’s nearly ready.”"

[tracks.bond_xu_cai.chapters.b2.choices.finish_the_copy]
text = "Don’t wake her. Ease the brush from her fingers and finish the page for her."
hint = "Even asleep, her fingers are tight around the brush. She won’t let go of it for you yet."
reply = "I copied on from the book to the bottom of the page, and by then the medicine was boiling. When she woke, the first thing she looked at wasn’t the pot. It was the page. She looked at it a long time. “Your hand isn’t like mine. Father will notice.” “Then I’ll tear it up and do it again?” I reached for it. She pulled the page back, blew on the ink, and slipped it into her primer, in among the pages she had copied herself."

[tracks.bond_xu_cai.chapters.b2.choices.mind_the_stove]
text = "Leave her papers alone, watch the stove, and wake her once the medicine is done."
reply = "I banked the fire and watched the pot until the brew was down to a single bowl, then shook her shoulder gently. She jolted awake, felt for the page on her knees first, then looked at the stove. When she saw the medicine was ready, she stared a moment. She carried the bowl into the back room and came out a while later. In the doorway she said, “Father says the Lin child has good sense.” A pause, and her voice dropped. “I think so too.”"

[tracks.bond_xu_cai.chapters.a1]
title = "Half the Lamp Oil"
text = "After the new year I often went down to the docks to check cargo for the family, and it was pitch dark by the time I came home. Grandma said that under the old banyan at the end of the lane there stood a man with no feet, so I always ran past it. That night, running past the school, I saw a lamp still lit in the classroom. Xu Cai sat under it copying and didn’t look up when the door creaked. “Still here this late?” “The oil’s only half burned,” she said. “The other half is being saved.” She didn’t say for whom. She wet her brush and went on copying. I gave back the stack of paper I had borrowed. The wick had crusted over and the flame kept jumping, so I picked up the scissors and trimmed it, and the room brightened. Then I fished a small oil flask out of my coat. I had lifted it from the ship, meaning to go over the accounts by it at home. She looked at the flask, then at me, and smiled. She pushed her books aside and cleared half the table."

[tracks.bond_xu_cai.chapters.a1.choices.sit_beside]
text = "Sit at the half of the table she cleared, and under the one lamp, copy my own work beside hers."
hint = "Sit down now and neither of you would know where to put your hands. You aren’t close enough yet to sit side by side."
reply = "I copied my accounts and she copied her book, and the only sound was two brushes whispering. Around midnight the wick popped. We both looked up at once, and both looked down again at once. My face went hot, and I pretended to hunt for a mistake. She set down her brush, blew the ink dry, and as she gathered her books she said, “Tomorrow I’ll save you half the lamp again.”"

[tracks.bond_xu_cai.chapters.a1.choices.your_oil_hers]
text = "Pour the flask into her lamp and tell her all my oil is hers from now on."
hint = "Say that now and she’d take it for a joke—she doesn’t yet count you as someone who could say such things."
reply = "The oil went in, the flame dipped, then steadied and burned bright. “All of it to me,” she said. “Then you walk home in the dark?” “With your lamp lit, the man with no feet under the banyan won’t dare come out.” I was the first to laugh. She didn’t laugh, and she didn’t answer. She bent over her copying. But after that, however late I came back from the docks, that classroom window was lit."

[tracks.bond_xu_cai.chapters.a1.choices.ask_who_for]
text = "Ask her who the other half of the oil is really for."
reply = "“For whoever comes home late.” “And who’s that?” She turned a page without stopping her brush. “Whoever’s late, that’s who.” I stood in the doorway thinking about it for a long while. Apart from me, I couldn’t come up with anyone on that lane who ran past the banyan that late every night."

[tracks.bond_xu_cai.chapters.a2]
title = "A Reed-Leaf Bookmark"
text = "In the seventh month, when soldiers searched the harbor, the Lin ship burned down to a length of keel lying in the water. Back at school, my classmates looked at me differently. Some walked wide around me; some muttered behind my back that the Lins must be in league with pirates. On the first day of the ninth month, Xu Cai arrived before anyone else. From her sleeve she drew a pressed reed leaf, trimmed to a narrow strip, its veins still clear. “From the riverbank. I pressed it all summer. Everyone in our reading circle gets one, so nobody dog-ears the books.” She opened my primer and leafed through it until she stopped in the middle, at the page where I had made the most mistakes, blot after blot of ink. She laid the bookmark there and smoothed it flat. “Pick it up from here.” Her hand stayed pressed on that page a good while before she lifted it."

[tracks.bond_xu_cai.chapters.a2.choices.keep_bookmark]
text = "Slide the bookmark out, hold it to the window, then put it back on the page she chose."
hint = "The leaf looks light, but it is heavy to accept. You aren’t close enough yet to take it."
reply = "I held it up to the window, and every vein showed against the light. Then I slid it back into the same page and pressed the edge flat with my thumbnail. She watched me. “You made seven mistakes on that page.” “Then I’ll start from the seventh.” “Why the seventh?” “The first six are too embarrassing. They can wait.” She laughed, very softly, as if afraid of blowing the bookmark away."
effects = [{}, {}, {}, { title = "A Reed-Leaf Bookmark" }]

[tracks.bond_xu_cai.chapters.a2.choices.hold_her_hand]
text = "Accept the bookmark, and take the hand she has pressed on the page."
hint = "You can’t take that step yet. You aren’t close enough to accept it like this."
reply = "Her hand was cold, with ink on the fingertips. When I took it she went stiff for a moment, but she didn’t pull away. Someone passed the window and glanced in, and she still didn’t move. Little by little the hand in mine loosened, and warmed. A long time later she spoke, so low only I could hear. “That page. From now on I’ll copy it with you.”"
effects = [{}, {}, {}, { title = "A Reed-Leaf Bookmark" }, {}]

[tracks.bond_xu_cai.chapters.a2.choices.make_one_back]
text = "Tell her I’ll pick a reed leaf by the river too, and press one for her."
reply = "I went down to the river, picked a handful, and pressed the greenest leaf in my account book. Two weeks later I took it out. It had shriveled like a dried shrimp and gone yellow. I was too embarrassed to give it to her, but she reached over and took it, turned it over and over, and tucked it into her own primer. “A crumpled one is easy to find.” Later her primer fell and the pages scattered. Everything else got jumbled, but not that page. The crumpled leaf held it fast."

[tracks.bond_xu_cai.chapters.a2.variants.v1_known]
text = "After the day of the harbor search in the seventh month, the whole school knew: the Lin child who came to lessons was a daughter. The Lin ship had burned too, down to a length of keel lying in the water. People pointed behind my back; some slid their stools away when they saw me. Xu Cai came earliest every day and sat right beside me. Whenever someone gossiped, she closed her book and looked at them until they walked off on their own. On the first day of the ninth month she drew a pressed reed leaf from her sleeve, trimmed to a narrow strip, its veins still clear. “From the riverbank. I pressed it all summer. Everyone in our reading circle gets one, so nobody dog-ears the books.” She opened my primer to the middle, to the page where I had made the most mistakes, blot after blot of ink. She laid the bookmark there and smoothed it flat. “Pick it up from here. It stays right here from now on. No more moving it.”"

[tracks.bond_xu_cai.chapters.a2.variants.v2_kept]
text = "On the day of the harbor search in the seventh month, soldiers came questioning at the school. In front of the soldiers, and in front of her father, Xu Cai said “Brother Lin” was a cousin on her mother’s side, from the farming Lins out in the Longxi countryside, a boy she had grown up with, nothing to do with the Lins of Yuegang. She said it fast and steady. The soldiers ticked something in their book and left. Back inside, her hands shook, and they shook into the night. The Lin ship burned all the same, down to a length of keel lying in the water. On the first day of the ninth month, Xu Cai arrived before anyone else. From her sleeve she drew a pressed reed leaf, trimmed to a narrow strip. “From the riverbank. I pressed it all summer. Everyone in our reading circle gets one, so nobody dog-ears the books.” She opened my primer to the page where I had made the most mistakes, laid the bookmark there, and smoothed it flat. “Pick it up from here.” The hand pressed on the page was still trembling a little."

[tracks.bond_xu_cai.chapters.s]
title = "A House Number on Paper"
text = "At the end of the year the teacher packed the roll book into his box and said that come spring, he wouldn’t be calling my name anymore. In spring I would take my family’s last bird-boat out to sea. Xu Cai would stay in Yuegang and keep compiling her primer; she was up to the sixtieth character. She handed me a trimmed sheet of paper. “Write down where you live. When you write to me, you won’t need the excuse of borrowing a primer anymore.” I leaned over the desk and wrote: Yuegang, the Lin house, third door on the back lane; if the ship is out, leave it with the old man nex door. I pushed it across. She read it through, picked up my brush, and slipped a t into “nex.” I always used to hurry her to give my brush back when she borrowed it. This time I didn’t. She turned the paper around and, under my line, stroke by stroke, added her own address."

[tracks.bond_xu_cai.chapters.s.choices.promise]
text = "Promise that at every port I’ll find the book they teach reading from there, and send it home to her."
hint = "A primer from every port, for the rest of your life. Your friendship hasn’t filled this slip of paper yet—or you’ve already promised the books from every port to someone else."
reply = "“At every port,” I said, “I’ll go through the bookshops for whatever they teach children to read with, and send it back to you. From Siam, from Luzon, from Malacca. Even if I can’t read it, I’ll send it.” She folded the address in two. “If you can’t read it, why send it?” “You’ll read it. You can read anything.” She thought for a while with her head down, then wrote a line on the back of the paper: “First one from Luzon.” Then: “With pictures.” Then: “Keep it out of the rain.” At the third line she stopped herself and handed my brush back. “Then my primer will be a primer of a hundred ports.” “That’ll take years to write.” “Then it’ll take years.” She pushed the paper into my book box, all the way to the bottom, and pressed down on the lid, hard."
effects = [{}, {}, { title = "A House Number on Paper" }, {}, {}, {}]

[tracks.bond_xu_cai.chapters.s.choices.heart]
text = "Tell her that when I’m grown and back in Yuegang, I want to write my real name on the flyleaf of her primer."
hint = "Your true name is on the tip of the brush, but you can’t set it down. Your heart doesn’t carry the weight of those strokes yet—or you’ve already saved these words for someone else."
reply = "“The year I come of age and come back to Yuegang,” I said, “keep the flyleaf of your primer for me. I’ll write my real name there, by myself, without one stroke running out of the box.” Xu Cai said nothing. She reached across and closed her hand around mine, brush and all, so tight the handle dug into my knuckles. “Then I’ll wait for you to write it.” My throat was tight, and it took me a while to squeeze out a joke. “What if I spoil it?” “If you spoil it,” she said, “this time I won’t throw it away for you.” We sat like that. She didn’t let go, and I didn’t pull away. The lamp was filled once, then again, and it burned until the window paper went pale and someone passed down the lane with water buckets, the shoulder pole creaking."
effects = [{}, {}, {}, {}, { title = "A House Number on Paper" }, {}, {}]

[tracks.bond_xu_cai.chapters.s.choices.own]
text = "Make it a contest: she compiles the primer, I sail, and we see who gets Yuegang’s boatmen reading contracts first."
reply = "“Me first,” she said. “You’ll be at sea. The boatmen won’t even see you.” “I’ve got boatmen on my ship too. A dozen of them, and every one signs with a thumbprint.” “Then teach them.” “I will. When I’m back, I’ll have them read your sixty characters to you one by one, and if they miss one, I lose.” She laughed, pushed the address back across to me, and had me write “bet” in the corner. “Then it’s a contest. The loser copies out a whole book for the winner.” “Which book?” “Winner picks.” I finished the word and held the brush out to her, and only halfway across remembered it was mine. She didn’t take it. She pushed it back. “Take it with you. That dozen on your ship will need it.”"

[tracks.bond_xu_cai.chapters.s.variants.v1_known]
text = "At the end of the year the teacher packed the roll book into his box and said that come spring, he wouldn’t be calling my name anymore. In spring I would take my family’s last bird-boat out to sea. Xu Cai would stay in Yuegang and keep compiling her primer; she was up to the sixtieth character. She handed me a trimmed sheet of paper. “Write down where you live. When you write to me, you won’t need the excuse of borrowing a primer anymore.” I leaned over the desk and wrote: Yuegang, the Lin house, third door on the back lane; if the ship is out, leave it with the old man nex door. I pushed it across. She picked up my brush, slipped a t into “nex,” and then, above the address, wrote in who the letters were for. She wrote “Wandeng,” not “Brother Lin,” and she wrote it slowly. I always used to hurry her to give my brush back when she borrowed it. This time I didn’t. She turned the paper around and, under my line, added her own address."

[tracks.bond_xu_cai.chapters.s.variants.v2_kept]
text = "At the end of the year the teacher packed the roll book into his box and said that come spring, he wouldn’t be calling my name anymore. In spring I would take my family’s last bird-boat out to sea. Xu Cai would stay in Yuegang and keep compiling her primer; she was up to the sixtieth character. She handed me a trimmed sheet of paper. “Write down where you live. When you write to me, you won’t need the excuse of borrowing a primer anymore.” I leaned over the desk and wrote: Yuegang, the Lin house, third door on the back lane; if the ship is out, leave it with the old man nex door. I pushed it across. She picked up my brush, slipped a t into “nex,” and above the address wrote who the letters were for: “Brother Lin.” She glanced up at me, then added one more character beside it, very small: deng, “lamp.” I always used to hurry her to give my brush back when she borrowed it. This time I didn’t. She turned the paper around and, under my line, added her own address."

[tracks.reunion_xu_cai]
name = "Xu Cai: The One Who Teaches Boatmen to Read"

[tracks.reunion_xu_cai.chapters.reunion]
title = "The One Who Teaches Boatmen to Read"
text = "Eight years on, my ship came into Yuegang again. The sea ban still hadn’t been lifted, yet the harbor held twice as many ships as before, the masts packed as close as a bamboo grove. I asked after the Xu family, and a man at a tea stall pointed toward the Tianfei Temple. “The teacher’s daughter? She’s borrowed a room beside the temple. Teaches boatmen to read, and won’t take a coin.” The room was small, with a row of straw sandals by the door. Inside sat a dozen people, old and young, each with the same book open on their knees. The primer was finished: over a hundred characters, bound tight with hemp thread, a rhyme under every one. I stood by the door and listened. Xu Cai read out “borrow,” and the whole room shouted back, “Borrow’s got a man on one side and ‘long ago’ on the other!” loud enough to shake the rafters. More than half that book was nonsense I had made up years ago on the net-drying ground. She heard the door, looked up, and set down her ruler. She looked at me, and the first thing she said was, “Out at sea, did anyone cheat you because you couldn’t read?”"

[tracks.reunion_xu_cai.chapters.reunion.default]
effects = [{ text = "Reading this is as good as seeing me. The primer is finished: a hundred and eight characters, bound into a book. I’ve borrowed a room beside the Tianfei Temple and teach every evening. More come than I expected: boatmen, boatmen’s wives, porters, and a woman who mends nets down at the docks. She learns fastest of all, and for every character she learns she comes and finds one of my mistakes. I haven’t cut a single one of your rhymes, only changed a few words. The ones they chant loudest are yours. Last month an old boatman got into a quarrel with a broker. He put his finger on “repay” in the contract and read it out to him, one character at a time, and the broker went white. I stood by and said nothing, and when I got home I lit an extra lamp. The children who chanted your rhymes on the net-drying ground are reading contracts for their parents now. The page folded into this letter is one I added later. The first character on it is “lamp.” I didn’t make a rhyme for that one. Who coming into port at night doesn’t know it? I still remember the address you wrote that year; this letter goes to it. Mine hasn’t changed either. Whenever your ship comes into Yuegang again, come and find me. If you can’t, look for the window that’s still lit. —Xu Cai" }, {}]

[tracks.reunion_xu_cai.chapters.reunion.choices.friend]
text = "Spread out the reading books I’ve gathered at every port, and help her add a few more pages to the primer."
reply = "I had the crew carry up the camphor chest from the ship and laid the books out on the table one by one: Siamese palm leaves, characters the Luzon people cut into strips of bamboo, a primer begged from the Portuguese post at Malacca, a Japanese copybook full of kana. She went through them one by one until dark, lit the lamp, and kept going. “I can’t read these,” she said. “Neither can I.” “But the boatmen will go to these places.” She picked up her brush. “And when they do, they need to read the numbers on the contracts there.” That winter, in the little room beside the Tianfei Temple, we added twenty characters: the names of foreign coins, the names of a few ports, steelyard and catty, and “ship license.” She wrote the last one and turned it around to show me. It was “lamp.” “Does this one get a rhyme too?” I asked. “No need,” she said. “Every boatman knows it. Coming into port at night, it’s the first thing they look for.”"
effects = [{}, {}, {}, { title = "The One Who Teaches Boatmen to Read" }]

[tracks.reunion_xu_cai.chapters.reunion.choices.love]
text = "Open the primer to the flyleaf, write my real name, and hand her the brush."
hint = "Those words went unsaid back then, and eight years later, at the flyleaf, they still won’t come."
reply = "She pushed the primer over and opened it to the flyleaf. There was nothing on it, and the paper was newer than the pages inside. She had replaced it, probably more than once. I picked up the brush and wrote slowly, stroke by stroke. At the last stroke my wrist sank, paused, then moved on, the way she had taught me all those years ago. When I finished, not one stroke had strayed. I handed her the brush. She took it and wrote “Xu Cai” beside my name, side by side with mine, close. The ink was still wet, and she didn’t blow on it. Over at the Tianfei Temple the evening bell began to ring. She set down the brush, leaned across the table, and kissed me. The bell went on striking, and only at the seventh stroke did she sit back, red to the ears, and say in that same quiet way of hers, “Nobody tears out this page. Ever.”"
effects = [{}, {}, {}, { title = "The One Who Teaches Boatmen to Read" }]

[tracks.reunion_xu_cai.chapters.reunion.variants.duo_kept]
text = "Eight years on, my ship came into Yuegang again. The sea ban still hadn’t been lifted, yet the harbor held twice as many ships as before. I asked after the Xu family, and a man at a tea stall pointed toward the Tianfei Temple. “The teacher’s daughter? She’s borrowed a room beside the temple. Teaches boatmen to read, won’t take a coin.” The room was small, with a row of straw sandals by the door. On the river below it a fishing boat was tied up. Its owner, the young woman who used to sell charms in front of the temple, sat in the bow waiting for the lesson to end, glancing up at the room now and then. Inside, a dozen people sat with the same book open on their knees. The primer was finished: over a hundred characters, a rhyme under every one. Xu Cai read out “borrow,” and the room shouted back, “Borrow’s got a man on one side and ‘long ago’ on the other!” More than half of it was nonsense I had made up years ago. She looked up, set down her ruler, and called me “Brother Lin.” Then she laughed at herself. “I kept that name for you for ten years and more. I don’t need to keep it now.” Only then did she ask, “Out at sea, did anyone cheat you because you couldn’t read?”"

[tracks.reunion_xu_cai.chapters.reunion.variants.duo_known]
