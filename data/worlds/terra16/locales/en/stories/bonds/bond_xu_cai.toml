text = "Eight years on, my ship came into Yuegang again. The sea ban still hadn’t been lifted, yet the harbor held twice as many ships as before, the masts packed as close as a bamboo grove. I asked after the Xu family, and a man at a tea stall pointed toward the Tianfei Temple. “The teacher’s daughter? She’s borrowed a room beside the temple. Teaches boatmen to read, and won’t take a coin.” The room was small, with a row of straw sandals by the door. Inside, a dozen people sat with the same book open on their knees. The primer was finished: over a hundred characters, bound tight with hemp thread, a rhyme under every one. Xu Cai read out “borrow,” and the room shouted back, “Borrow’s got a man on one side and ‘long ago’ on the other!” More than half of it was nonsense I had made up years ago on the net-drying ground. She heard the door, looked up, set down her ruler, and called me “Brother Lin.” Then she laughed at herself. “I kept that name for you for ten years and more. I don’t need to keep it now.” Only then did she ask, “Out at sea, did anyone cheat you because you couldn’t read?”"

