# C7 重写（2026-10-11，Claude Opus）：stories/bonds/bond_naran_vaniya.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应（A2 两个收下选项第 4 个效果、S 的 promise 第 3 个、heart 第 5 个、重逢三个落点第 4 个是 memory；重逢 default 第 1 个是 letter）。
# 纳兰的口头禅照 cast 英文的写法“You get the measure first. Then I get my price.”，全文件只在 C1 出现一次。

[tracks.bond_naran_vaniya]
name = "Naran Vaniya: Opening His Own Bale"

[tracks.bond_naran_vaniya.chapters.c1]
title = "Opening His Own Bale"
text = "A Persian buyer came down to the Cambay waterfront wanting twenty bales of white cotton, to ship home to Hormuz before the rains. Every apprentice from the brokers’ houses rushed him, each with his finest bolt spread on top of the bale for the man to feel. Naran didn’t push. He crouched, slit the cord on his own bale with a little knife, drew a bolt out of the middle, shook half of it loose, and pointed to a spot for the buyer to see: two weft threads had skipped there, leaving a flaw thinner than a fingernail. “There are three like this in this bale.” Somebody beside us snorted. I leaned in and stared a long while before I could even find it. “Are you here to sell cloth or to wreck your own stall?” Naran ignored me. He pulled a Cambay measuring rod from his sash and laid it flat across the table. “You get the measure first. Then I get my price.” The buyer looked at the rod for a while. Then he turned to look at the other nineteen bales."

[tracks.bond_naran_vaniya.chapters.c1.choices.point_flaws]
text = "Crouch down, help him open the other bales, and point out every flaw I can find."
reply = "I opened them faster than he did and found more than he did—a starch stain in the seventh bale that even he had missed. Naran glared at me. “Did you come here to take my stall apart?” But the buyer wrote every flaw down, priced each bale by its faults, and took all twenty. On his way out he asked whether I had any cloth of my own, and ordered five bales from me too. As the crowd broke up the other apprentices all glared at Naran. Naran glared at me."

[tracks.bond_naran_vaniya.chapters.c1.choices.hide_bad_bolt]
text = "While he talks to the buyer, slip the flawed bolt back to the bottom of the bale."
reply = "I had barely tucked it in when Naran’s hand went into the bale after it. He drew it out again, shook it open in front of the buyer, and raised an eyebrow at me. The buyer roared with laughter and took all twenty. Afterward Naran wound the cord back around the bale, loop by loop. “You lose this round. Try again next time.” I said next time I’d be quicker. “Next time,” he said, “my eyes will be quicker.”"

[tracks.bond_naran_vaniya.chapters.c2]
title = "Two Measuring Rods"
text = "When the rains came, every ship in the Gulf of Cambay dropped anchor, and with no trade on the waterfront there was nothing left to do but quarrel. A Portuguese merchant threw a bolt down on Naran’s stall: it was short, he said, and he wanted his money back. Naran pulled the cloth open and measured it with his own rod, length by length. “Full measure. Not a finger short.” The Portuguese drew his factory’s rod out of his sleeve and measured it too, length by length. “Short.” The city had changed masters several times these last few years; the Portuguese factory had never changed, and neither had its rod. The two of them stood under the awning, each brandishing his own rod, louder and louder, while the porters gathered around to watch. Naran’s turban was soaked through—rain or sweat, there was no telling. Suddenly he grabbed my sleeve and dropped his voice. “You’ve been inside their factory. How long is their rod, really?”"

[tracks.bond_naran_vaniya.chapters.c2.choices.to_the_factory]
text = "Go with him to the Portuguese factory and lay the two rods side by side on the counter for all to see."
hint = "He’s cornered and can’t back down. Step in now and he’ll only think you’ve come to steal his customer."
reply = "The factory clerk pressed the two rods side by side on the counter, one end lined up. At the other end they differed by two fingers’ width. The porters had followed us all the way to the factory door, and now they all burst out laughing. The Portuguese merchant went red to the ears, tucked his cloth back under his arm, and said no more about a refund. On the way back it was still raining. Naran put his rod inside his shirt. “From now on, my bills give both measures.” A few steps later he added, “I owe you for this one.” I asked what he owed me. He thought about it. “A bowl of sweet milk. Next month, on me.”"

[tracks.bond_naran_vaniya.chapters.c2.choices.conversion_table]
text = "Write out a table converting one rod to the other and nail it up on his stall."
reply = "I borrowed the factory’s rod, measured three times, worked out the conversion and wrote it on a board in charcoal: so many Cambay lengths, so many Portuguese lengths and fingers. The day after the board went up on his stall, the broker next door copied it onto one of his own, and Naran stamped about in the rain complaining I’d given my handwriting away for free. But from then on the Portuguese merchant bought only from him, and told anyone who’d listen, “His rod, I trust.”"

[tracks.bond_naran_vaniya.chapters.b1]
title = "The Batch That Shrank"
text = "Radhika, the merchant our family school had brought in to teach exchange, set us a test: each of us got the same stake to buy cloth and sell it however we liked, and at year’s end whoever had the most money won—stake and profit both to keep. When the books were opened, Naran had won, and won handsomely; Radhika praised him in front of the whole school. That evening I went to his room to return an abacus, and it rolled under his bed. I lay flat and felt for it, and pulled out a bolt of cloth instead: washed, crumpled, almost a tenth shorter than it should have been. A warehouse tag hung from one end, dated the seventh month—that small deal he’d done behind his family’s back, the one he bragged about once in the summer and never mentioned again. If the whole batch had shrunk like this, what he’d lost was close to what he’d won today. The door creaked. Naran stood in the doorway, and the color drained from his face. “The abacus rolled under,” I said. He didn’t ask what I’d seen. He just shut the door behind him. “Don’t tell my father.”"

[tracks.bond_naran_vaniya.chapters.b1.choices.keep_and_lend]
text = "Keep his secret, and lend him enough to patch the hole for good."
hint = "He still thinks of you as a rival out to catch him. Hold out money now and he’ll be even less willing to take it."
reply = "I set the money on the edge of his bed. He looked at the coins for a long time and didn’t say thank you. “Interest by Cambay rules.” Three months later he paid it back, principal and interest to the last coin, then pressed one extra copper into my palm. I asked what that was for. “For keeping your mouth shut.” I never spent that copper."

[tracks.bond_naran_vaniya.chapters.b1.choices.bet_he_tells]
text = "Bet him that within half a year he’ll go and tell his father himself."
reply = "“You’ll lose.” He shoved the bolt back under the bed and pushed it a little farther in. The stake was a string of agate beads, my choice. Early the next spring he missed three days of school, and came back with one cheek swollen and the other side of his face grinning. “I told him. I said I’d lost money. I didn’t say I’d misjudged the cloth and bought a batch that shrinks.” He unstrung the beads and gave me half. “You bet I’d tell, and I told half. So half of this is my win.”"

[tracks.bond_naran_vaniya.chapters.b2]
title = "When the Tide Came In"
text = "The tide in the Gulf of Cambay is famous: going out, it bares miles of mudflat; coming in, it pushes up the bay like a wall, faster than a horse can run. That afternoon the gong on the waterfront was beating the wrong rhythm, and everyone with goods stacked at the edge of the flats was shouting. For the first time, Naran had taken in eight bales under his own name, each stamped with a mark he’d whittled himself from wood—a little balance scale. The guild hadn’t recognized it yet; he’d stamped it on anyway. Those eight bales sat at the edge of the mud, nearest the water. My ten were there too, two paces away. Far out, the waterline had gone white, and the roar came closer and closer. He looked at me and said nothing. I said nothing either. We stood between the two stacks, both of us working out the same sum: whose to drag first. “What are you staring at?” he finally rasped. “Pull!”"

[tracks.bond_naran_vaniya.chapters.b2.choices.save_his_first]
text = "Help him haul his eight stamped bales ashore first, then go back for mine."
hint = "He doesn’t yet believe you’d put his goods first. Reach for them and he’ll throw himself over his bales."
reply = "The two of us dragged them up the bank one at a time, and by the eighth bale the water was over our ankles. When I turned back, four of my ten were sitting in the sea. Naran’s eight hadn’t taken a drop, and the wooden mark was still crisp on every one. He stood on the bank watching me crouch in the mud wringing out my wet cloth, and only when I was on the third bolt did he speak. “The wet ones—I’ll buy them at the dry price.” I told him that was a losing deal. “Then it’s my loss. I’ll take it.”"

[tracks.bond_naran_vaniya.chapters.b2.choices.each_saves_own]
text = "Each of us saves our own, and we see who gets more ashore."
reply = "The bore crashed in and drew back, and we both sat panting in the mud. We counted: I’d dragged nine bales ashore, he’d dragged eight. “I win,” I said. He didn’t argue. I went looking for my tenth, sure the tide had taken it—it was in his stack, at the very bottom. Of his own eight, one was still lying in the water, the wooden mark smeared into a blur."

[tracks.bond_naran_vaniya.chapters.a1]
title = "No Prices at the River Mouth"
text = "Toward evening Naran turned up at the school gate and asked if I wanted to walk down to the mouth of the Mahi. All the way there he couldn’t help himself: a boatload of salt—salt’s cheap this year; a coconut seller—that man just charged his customer two coppers too many; fishing nets drying on the embankment—he sized them up and priced the new ones and the mended ones. By the time we reached the river mouth he was laughing at himself. “No prices today.” The wind was strong on the embankment, and he tugged his turban lower and talked about a weaving house inland. His father had taken him once. The old masters there would take in any new child, teach them from spinning all the way up to the finest weave, and never send one away for being slow. “One bolt there takes three months,” he said. “Three months, and nobody counts a single copper.” He wanted to spend a year there, he said, not buying cloth, just watching people weave. While he talked, the tide at the river mouth rose again and washed over the stones at the foot of the embankment. He moved over a little toward me."

[tracks.bond_naran_vaniya.chapters.a1.choices.talk_other_things]
text = "Say: no prices, then we’ll talk about something else—and then neither of us speaks first, all the way till dark."
hint = "He’s still hunting for something to say. Fall silent now and he’ll think you’re tired of his chatter."
reply = "We walked along the embankment and neither of us said another word. The tide rose as high as it would go, paused, then slid back out inch by inch, and the mudflats below came up again, shining as if they’d been oiled. Only when it was full dark did we turn back. “Not one price all day,” he said. “What a loss.” The next evening he was at the school gate again—the river mouth again, and no prices again."

[tracks.bond_naran_vaniya.chapters.a1.choices.keep_his_secret]
text = "Promise to keep the shrunken cloth a secret until he tells his father the whole of it himself."
hint = "He doesn’t yet see you as someone he can trust with this. Bring it up and he’ll steer the talk elsewhere."
reply = "He stopped and looked at me, then took a brass seal from inside his shirt to show me: half the face was carved, the other half still flat. “When I have a mark of my own,” he said, “a real one, one the guild recognizes—then I’ll tell him.” He put the seal away, and added, “You’ll have to be there. If my father lifts a hand, you hold him back a bit.”"

[tracks.bond_naran_vaniya.chapters.a1.choices.ask_the_weavers]
text = "Ask him just how fine the finest cloth at that weaving house is."
reply = "“Fine enough to pass through a ring.” I told him he was boasting—what passes through a ring is thread. He stopped, slid the silver ring off his finger and held it up as if to measure. “Then I’ll take you to see it.” He put the ring back on, and turned it round and round the rest of the way."

[tracks.bond_naran_vaniya.chapters.a2]
title = "A Belt Woven from Shrunken Cloth"
text = "One rainy afternoon Naran came to find me with an oilpaper parcel under his arm and opened it on the school veranda: a belt, three fingers wide, white, with one red stripe and one blue running through it. “You know this white,” he said. I did. It was the shrunken bolt from under his bed. He’d picked it apart thread by thread and, with his mother teaching him, woven it again on a backstrap loom. The red stripe, he said, came out of an old sari of his mother’s, and the blue out of one of his grandmother’s; neither wanted to give hers up, and it took him half a month of pestering. “Cloth that lost money still has to end up somewhere.” Before I could speak he had the belt around my waist and knotted—too tight. He undid it and tied it again—too loose. The rain was drumming beyond the veranda. He kept his head down, wrestling with the knot, and his ears slowly went red."

[tracks.bond_naran_vaniya.chapters.a2.choices.wear_it]
text = "Accept the belt, and say I’ll wear it whenever I go out."
hint = "This belt is made from the one bolt he least wants anyone to see. You aren’t close enough for that yet; say it now and he’ll take it for politeness."
reply = "“Wear it,” he said, “and you have to remember I lost money once.” I said I’d remember all my life—tie it on every morning and remember it every morning. He lunged to snatch the belt back; I dodged, he chased, and we went three times around a veranda pillar. In the end he dropped onto the step, out of breath. “Then remember it.”"
effects = [{}, {}, {}, { title = "A Belt Woven from Shrunken Cloth" }]

[tracks.bond_naran_vaniya.chapters.a2.choices.tie_it_again]
text = "Accept the belt, and ask him to tie it for me once more."
hint = "Ask him to tie it again now and he’ll just push the belt into your hands and tell you to do it yourself. What you feel for each other isn’t far enough along for you to ask."
reply = "He tied it a third time. This time he went slowly. His fingers brushed my waist through the cloth and stopped there, and stayed stopped a good while. “Now it’s just right.” He turned at once and headed indoors, too fast, and his shoulder hit the doorframe with a thud. He didn’t look back. He went in rubbing his shoulder."
effects = [{}, {}, {}, { title = "A Belt Woven from Shrunken Cloth" }, {}]

[tracks.bond_naran_vaniya.chapters.a2.choices.ask_price]
text = "Ask him how much he wants for the belt."
reply = "“Not for sale,” he said. “You get the measure from me first, and the price—this time you don’t get one.” Then he stopped short—he’d been saying that for years, and this was the first time it had come out bent—and laughed. He untied the belt from my waist and fastened it around his own. “Not for sale, and not a gift either. Ask me again the day you stop asking prices.”"

[tracks.bond_naran_vaniya.chapters.s]
title = "The True Sample First"
text = "In the last month of the year my family’s ship was to sail for Hormuz on the northeast wind, and I was going with it. Naran was staying behind to learn independent brokering under one of his father’s old customers. Three days before we sailed he came down to the waterfront with a brass seal clenched in his palm. The face was finished now: a little balance scale with a cotton boll in the pan, and the guild had recognized it last month. He pressed it into the ink pad, took my hand, and stamped it once on the back. “From now on, if you’ve got goods to sell in Cambay,” he said, “send the true sample first. I inspect it—friend or not, I inspect it.” “The way you inspect,” I said, “who’d dare send you anything?” “The ones who dare are my customers.” The ink was cool. His hand stayed on the back of mine and didn’t lift right away, hotter than the seal. Down the quay someone was shouting for the loading to start; he didn’t seem to hear."

[tracks.bond_naran_vaniya.chapters.s.choices.promise]
text = "Agree that all our trade will start with a true sample: he inspects, I pay."
hint = "Sending true samples first, for every deal from now on—that’s a pact for life. What you share can’t bear that seal yet—or you’ve already set your lifelong seal on someone else’s pact."
reply = "He took out his ledger and opened it to the first page. It had always been empty—saved, he said, for the first deal of his own. He dipped his pen, wrote the date and my name, then the terms stroke by stroke: whatever goods come to Cambay, the true sample comes first, inspected before any price is named; one side inspects, the other pays. When he’d finished he stamped his mark beneath it, then took my hand, pressed it into the ink and set my handprint beside his seal. I said a handprint didn’t count. “In Cambay a handprint counts for more than a seal,” he said. “Anyone can carve a fake seal. Nobody can carve a hand.” On the day the northeast wind came up he didn’t come to see me off. Once the ship was out of the gulf I opened my bundle and found he had copied that page out and stuffed it into my shoe, with one more stamp in the corner."
effects = [{}, {}, { title = "The True Sample First" }, {}, {}]

[tracks.bond_naran_vaniya.chapters.s.choices.heart]
text = "Leave the stamp on my hand unwashed, and say: when I’m grown and back, stamp it again."
hint = "The ink on the back of your hand is still cool, but you can’t say you’ll leave it unwashed. It hasn’t sat in your heart long enough—or someone else has already heard the same words from you."
reply = "He looked at the back of my hand and said nothing for a long time. The ink had dried; the little scale sat crooked above my knuckles. “It’ll rub off,” he said at last. I said then I wouldn’t let it. At sea you have to wash, he said, and haul on ropes. Then I’d haul on fewer ropes, I said. He laughed once and broke off halfway, looking down at the brass seal. “When you’re back, I’ll carve a new one.” On the day we sailed he came, and stood by the gangplank the whole time. Just before I boarded he pressed the seal into my hand, and I had barely closed my fingers around it when he pulled it back. “No—I still need this.” But his hand stayed. We stood like that, holding on, until the crew called my name the third time."
effects = [{}, {}, {}, {}, { title = "The True Sample First" }, {}]

[tracks.bond_naran_vaniya.chapters.s.choices.own]
text = "Bet him: within five years, whose mark turns up first on the quays at Hormuz?"
reply = "“What’s the stake?” he asked. I said a bale of the best cloth. He weighed the seal in his palm. “Then you’re going to lose a bale of good cloth. They know my cloth in Hormuz.” I said what they knew was his father’s mark, not his. His face went hard all at once, and he held out his hand. “Five years.” I slapped my palm into his and he gripped it hard, as if afraid I’d take it back. Just then the tide came up over the mudflats and soaked both our shoes. He looked down at the two pairs of wet shoes and said a soaking sealed a bet—that was the custom in Cambay. I said Cambay had never had any such custom. “It does from today.”"

[tracks.reunion_naran_vaniya]
name = "Naran Vaniya: His Own Mark"

[tracks.reunion_naran_vaniya.chapters.reunion]
title = "His Own Mark"
text = "More than five years later I came back to Cambay. The tide was going out, and along the waterfront stood a neat row of bales, every one stamped on its sacking with the same mark: a little balance scale with a cotton boll in the pan. His father sat on a stool by the warehouse door with a bowl of tea, watching his son inspect cloth. Naran had told him everything about the shrunken cloth in the end, and his father had still let him set up a house of his own—only he came once a month to sit, saying nothing, and left when the tea was gone. Naran was opening bales for an Armenian buyer. As always he opened his own first, drew a bolt from the middle, shook it out and looked for flaws. He glanced up and saw me, and his hands paused. Then he laid his measuring rod flat across the table—and before he’d said a word, he was already smiling. “You’re late,” he said. “I’ve been waiting a whole monsoon to see your goods.”"

[tracks.reunion_naran_vaniya.chapters.reunion.variants.bet]
text = "More than five years later I came back to Cambay. The tide was going out, and along the waterfront stood a neat row of bales, every one stamped on its sacking with the same mark: a little balance scale with a cotton boll in the pan. His father sat on a stool by the warehouse door with a bowl of tea, watching his son inspect cloth. Naran had told him everything about the shrunken cloth in the end, and his father had still let him set up a house of his own—only he came once a month to sit, saying nothing, and left when the tea was gone. Naran was opening bales for an Armenian buyer. As always he opened his own first, drew a bolt from the middle, shook it out and looked for flaws. He glanced up and saw me, and his hands paused. Then he laid his measuring rod flat across the table—and before he’d said a word, he was already smiling. “Five years are long gone,” he said. “So—Hormuz. Where’s your mark?”"

[tracks.reunion_naran_vaniya.chapters.reunion.variants.hand]
text = "More than five years later I came back to Cambay. The tide was going out, and along the waterfront stood a neat row of bales, every one stamped on its sacking with the same mark: a little balance scale with a cotton boll in the pan. His father sat on a stool by the warehouse door with a bowl of tea, watching his son inspect cloth. Naran had told him everything about the shrunken cloth in the end, and his father had still let him set up a house of his own—only he came once a month to sit, saying nothing, and left when the tea was gone. Naran was opening bales for an Armenian buyer. As always he opened his own first, drew a bolt from the middle, shook it out and looked for flaws. He glanced up and saw me, and his hands paused. He laid his measuring rod flat across the table—and his eyes went to the back of my hand before they reached my face. “Washed off?” he asked, and was smiling before he’d finished."

[tracks.reunion_naran_vaniya.chapters.reunion.default]
effects = [{ text = "This year, as always, I opened my own bales first. An Armenian buyer told me he’d seen someone on the quays at Hormuz who inspected cloth exactly the Cambay way, and asked whether it was my apprentice. I said no. I have a house of my own now. I told my father about the shrunken cloth—starting from the batch I bought in the seventh month, all the way to what was under my bed. When I’d finished he didn’t hit me. He only asked what became of the cloth. I said I’d unpicked it and woven a belt. He asked what it was worth. I said it wasn’t for sale. He didn’t ask anything more. These days he comes to the warehouse once a month, drinks a bowl of tea, watches me inspect cloth without a word, and leaves when the tea is gone. This year I waited on the quay through a monsoon, then through a dry season, and your family’s ship never came. Radhika says you’ve gone over to another port—next year, maybe. With this letter comes a sample of cloth, from the best batch this year. My mark is stamped on the corner. The space beside it I left alone—I measured it; there’s exactly room for one more seal. When you come back, bring yours. The true sample I’ve sent first. The price we’ll talk over when you get here. Naran" }, {}]

[tracks.reunion_naran_vaniya.chapters.reunion.choices.friend]
text = "Set my own seal beside his mark, and agree that all my trade will pass through his hands."
reply = "I dug my seal out of my bags, pressed it into the ink and stamped it beside his mark. The two seals sat side by side on the sacking. Naran studied them a moment, then laid his rod between them to measure the gap. “A finger too far. Closer.” I stamped another bale, the two seals snug together this time. Satisfied, he jerked his chin toward his father. “Now all Cambay knows we’re in this together.” His father said nothing and drained his bowl. That night he took me out for sweet milk at the same stall we used to go to in our school years. When I reached for my purse he pressed my hand down. “This time I’m paying. Back then I always said it was on me, and you always ended up paying—I’ve kept count of every one.”"
effects = [{}, {}, {}, { title = "His Own Mark" }]

[tracks.reunion_naran_vaniya.chapters.reunion.choices.rival]
text = "Tell him my mark has already reached the quays at Hormuz—and ask where his is."
reply = "He slapped his ledger on the table, flipped to a page in the middle and jabbed at a line. “Got there last month.” I said mine had got there the year before last. He said that batch of mine went on someone else’s ship with my mark on someone else’s bill, so it didn’t count. I said his last month’s batch had gone on someone else’s ship too. We argued from the warehouse to the sweet-milk stall and from the sweet-milk stall back to the warehouse; his father listened over his tea bowl for a good while, shook his head and left. We turned the ledger’s pages all night and by dawn still couldn’t settle who was first. Naran rubbed his eyes and shut the book. “Then we bet on the next five years. Malacca this time.” I said done. He held out his hand, ink still in the palm, and when I took it my hand came away red."
effects = [{}, {}, {}, { title = "His Own Mark" }]

[tracks.reunion_naran_vaniya.chapters.reunion.choices.love]
text = "Before the tide is all the way out, tell him: this time I want to stay."
hint = "The measuring rod lies across the table; he’s waiting for your goods, and only your goods. What you didn’t say on the quay back then has waited out one monsoon after another, and still it won’t come."
reply = "The measuring rod stopped in midair. “Stay?” he asked. “For how long?” I said until he’d finished inspecting this bale, and then the next, and on and on. He put the rod back on the table so gently it made no sound. The buyer was still waiting; his father still held his bowl of tea. He said something to the buyer, who laughed and walked off. Then he caught my hand and turned it over to look at the back—long since bare. From inside his shirt he took a newly carved seal, pressed it into the ink, and stamped it in the same place as before. “You don’t get the measure this time,” he said. “You get me.” When the tide was at its lowest the mudflats shone all over. He kissed me there on the quay, in front of his father. His father coughed, got up, left his tea bowl on the stool and walked away."
effects = [{}, {}, {}, { title = "His Own Mark" }]
