# 伊内丝·达·科斯塔羁绊线（bond_ines_costa + reunion_ines_costa）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_ines_costa]
name = "Inês: The Other Half of the Line"

[tracks.bond_ines_costa.chapters.c1]
title = "The Other Half of the Line"
text = "My mother was taking a translation to the Portuguese house for my grandfather, and I waited for her at the top of the stairs on the second floor, counting the strokes of the Bourse clock. The secretary’s daughter, Inês, came out of an inner room, sat down beside me, and before saying a word pushed a notebook onto my knees. Calfskin covers, the corners worn fuzzy. I leafed through it. Every poem on every page was half a line long, in Portuguese or in Flemish, stopping in the middle of a sentence, the right-hand side of the page left clean. “Is your family short of paper?” I said. “A quire costs twelve stuivers. Write like this and you lose half of every book.” She shook her head, her voice so soft she might have been afraid the people downstairs would hear. “The other half of the line is yours.” Her half read: When the Scheldt comes in on the tide— and after it I squeezed in “the price of pepper rises too.” I wrote it so cramped that the last word fell onto the next line, and the rhyme came out wrong. I reached for the penknife to scrape it off. She put her hand on mine. “Don’t.” On the next line she turned the poem another way, took my wrong sound for a new rhyme, and wrote half a line more. “I looked for half a year,” she said, “before I found someone who’d answer.”"

[tracks.bond_ines_costa.chapters.c1.choices.ledger_rhyme]
text = "Finish her next half line like a ledger entry: receipts, expenses, balance."
reply = "She wrote: “The tide goes out and leaves behind—” I answered: “Receipts, three cockles; expenses, one pair of shoes; balance, one afternoon.” She read it once and doubled over laughing, and the notebook slid off her knees onto the floor. She picked it up, brushed it off, and read it again. “I’ve never seen such a calculating poem.” She counted the syllables with her fingernail. “But the rhyme is right.” She folded down the top corner of the page, very carefully, and pressed it flat twice."

[tracks.bond_ines_costa.chapters.c1.choices.bet_rhyme]
text = "Bet her a stuiver on what she’ll rhyme with in the next half line."
reply = "I bet she’d end on “sea”—two of the first three pages did. She thought for a moment and wrote “ship.” I lost, and set a stuiver from my purse on the notebook. She didn’t push it back. She tucked the coin in by the spine and pressed the notebook shut. “When we have a poetry circle, that’s its first receipt.” I said there wasn’t any circle yet and she was already keeping its books. “You keep the books and I write the poems,” she said. “That’s a circle.”"

[tracks.bond_ines_costa.chapters.c2]
title = "The Pause at the Door"
text = "I went to return the rhyming dictionary she had lent me. The Costa house stood in the lane behind the Portuguese house, its door painted dark green. Inês came to open it, one hand on the frame, and stopped for a moment—not long, the way you count a step before crossing a threshold—before she stood aside to let me in. Once we were inside her voice changed. It went very soft, every word held low. Nobody in the house was asleep; I could hear a pan clattering in the kitchen. I put the dictionary on the table and lowered my voice too, and talked about pepper prices on the Bourse in a near whisper until I wanted to laugh at myself. She didn’t laugh. She took a book of poems from the shelf, pushed it into my hands, opened it in the middle, and tapped one poem. “This one is good.” When she saw me out, she was already standing outside the threshold, and her voice was her ordinary voice again. “Here you can read it aloud.” I carried the book to the end of the lane and looked back once at the green door. The word she had used was “can.”"

[tracks.bond_ines_costa.chapters.c2.choices.read_aloud]
text = "Go back to her door and read the poem she pointed to, out loud."
hint = "The door is already shut. You stand at the end of the lane for a while and can’t bring yourself to knock—you aren’t that close yet."
reply = "I stood outside the green door and read, and read loudly. A woman carrying water down the lane stopped to stare at me. The door opened a crack, and Inês stood inside listening, all the way to the last line. “Too loud,” she said. “Now the whole lane knows this poem.” She paused. “But good.” Before she shut the door she pulled it open a little again. “Next time you come, read this one again.”"

[tracks.bond_ines_costa.chapters.c2.choices.ask_pause]
text = "Go back and ask her why she stopped like that when she opened the door."
reply = "She looked at me, and her hand went back to the doorframe. “Let me think about it.” Then she went inside. I waited a week. She never brought it up again, as if she were still thinking and had never finished. But that evening at home, when I opened the book of poems, I found a slip of paper tucked beside the one she had pointed to. Her hand, half a line: The wind comes off the river, and the first thing it knocks on is—"

[tracks.bond_ines_costa.chapters.b1]
title = "The Fourth Chair"
text = "The doorkeeper of the Violet, the chamber of rhetoric, put it politely: girls were welcome to sit below the stage and listen, but reciting from it was out of the question. Inês thanked him and walked away. The next day she took me to the back room of her house, a small room that had once held bolts of cloth, its window on the yard, the nail holes from old cargo tags still in the wall. She brought a basin of water and wiped the chairs one by one. After the second I thought that was enough, but she carried in a third from next door, then a fourth. “There are only two of us.” “Then whoever comes later has somewhere to sit.” She wrung out the cloth and set the fourth chair by the door, its back against the frame. I took out my pocket ledger, turned to a fresh page, and entered the circle’s first account: chairs, four; members, two; poems, one half. Inês leaned over to look and put her finger on “poems, one half.” “That half is mine.” “Then let’s be clear: owed, half a poem; creditor, De Clercq.” She laughed out loud. It was the first time I had heard her laugh out loud in her own house."

[tracks.bond_ines_costa.chapters.b1.choices.write_charter]
text = "Draw up the circle’s rules in the form of a ledger."
reply = "Article one: each member submits one poem a month; late poems are fined half a line. Inês read it and shook her head. “Half lines are mine already. You can’t fine me in my own coin.” I struck it out and made it a whole line. She read it once more, folded the rules, and slid them under the cushion of the fourth chair. “Then I’ll never be late.” I added an entry to my ledger: rules, one copy; kept under the chair cushion."

[tracks.bond_ines_costa.chapters.b1.choices.invite_sophie]
text = "Suggest asking the Lille girl who always sits by the door at the French master’s to take the third chair."
reply = "Inês said, “Let me think about it.” The next day she was far too polite to me. “Please” when she passed the pen, “thank you” when she took it back, and “Mademoiselle de Clercq” at every turn, until my skin itched. On the third day she put an invitation in my hand. She had written it out more neatly than she copied poems, and the name, which I had given her, she had traced letter by letter. “You take it,” she said. “I don’t know her.”"

[tracks.bond_ines_costa.chapters.b2]
title = "Far Too Polite"
text = "On the day the Laurel opened, Master Heyns called the roll at the door: fifty-odd girls, half of them boarders. Within the first week I knew half the class—whose family made lace, whose lent money, whose French had a Lille accent. At dinner I sat in the middle of the long table and bet the girls around me on whether there were raisins in the pudding, won three times running, and set the whole table laughing. Inês sat at the far end. From then on she spoke to me as if I were a foreign merchant come to talk business. “Would you be so kind as to pass the salt?” “Thank you kindly.” “You are quite right.” When her turn came to hand in the circle’s notebook, she didn’t. The first week I thought she had forgotten. The second week I wrote “owed” in my ledger. By the third week, three lines were lined up after that “owed.” After lessons I called her name in the porch. She stopped and made me a proper curtsy. “Is there anything else you require?”"

[tracks.bond_ines_costa.chapters.b2.choices.ask_direct]
text = "Wait for her under the Bourse arcade the next day and ask her to her face what’s wrong."
hint = "She nods to you under the arcade and walks on by, perfectly polite, not one word more—you aren’t close enough yet to make her tell the truth."
reply = "She said it was nothing. I said, “Three weeks, three lines in fines. It’s all in the ledger.” At last she laughed, then caught it halfway and looked down at the cracks between the paving stones. “You have a whole class of friends now,” she said. “I thought the circle… wasn’t needed anymore.” At the far end of the arcade a broker was calling the price of pepper. I said, “The circle’s books aren’t closed, and nobody walks out until they are.” She looked up and recited the three lines she owed, right there, and by the third line she had dropped every “kindly” and “quite right.”"

[tracks.bond_ines_costa.chapters.b2.choices.send_paper]
text = "Buy the stack of paper she spent an afternoon over last month and didn’t buy, and give it to her."
reply = "The stationer remembered her. “That young lady held every sheet up to the window, one by one, all afternoon.” I put the stack in her hands. She accepted it, thanked me politely, and still addressed me like a customer. Two days later the circle’s notebook came back, written on that very paper. The three fine lines were all there, every word, except that the last one stopped halfway, on a comma."

[tracks.bond_ines_costa.chapters.a1]
title = "Half a Line on the Ice"
text = "January was bitterly cold, and the moat outside the city wall froze solid. Half of Antwerp went out on the ice: hot-wine sellers pushing their carts, apprentices on skates ground from bone, a pack of children chasing a wooden ball with brooms. It was Inês’s first time skating. Her skates were borrowed from a cousin, a size too big, and tied onto her shoes with strips of cloth. The moment she stepped onto the ice she grabbed my sleeve and held on for dear life; whichever way I glided, she tipped that way. “Not so tight,” I said. “This is my best one.” “If I let go, I’ll be flat on my back.” She didn’t let go. Near the city gate the crowd was packed close, and someone bumped her shoulder. She wobbled, and half a line of poetry came out of her mouth: “The people on the ice forget there’s water underfoot—” Not loudly. But out of doors, in the middle of a crowd. I stood still a moment, then answered: “—and the water forgets it owes the spring a debt.” She turned to look at me, the tip of her nose red with cold. “I’ve never recited outside before.” She paused. “Not in front of so many people.” My sleeve was crushed into a ball in her fist, as creased as a crumpled bill."

[tracks.bond_ines_costa.chapters.a1.choices.race_bridge]
text = "Race her to the bridge arch up ahead."
reply = "She let go of my sleeve and fell on the first stroke, got up and fell again, her skirt full of ice chips, and still she caught up. Under the bridge she leaned on the stone wall, panting. “Next time I win.” “Next time I’ll let you.” “Don’t you dare.” She brushed the ice off her skirt, one swipe at a time. “A win you’re given doesn’t count. You love keeping accounts—put that in them too.”"

[tracks.bond_ines_costa.chapters.a1.choices.keep_sleeve]
text = "Let her keep hold of my sleeve, and glide slowly to the bridge arch."
hint = "She lets go and tells you, very politely, that you needn’t go slowly for her—this isn’t the moment to stay at her side."
reply = "Under the bridge she still didn’t let go. The ice was too slippery, she said. We stood beneath the arch and listened to people crossing overhead, their laughter dropping down on us in bursts. She recited her half line again. I answered it, and she shook her head. I answered again, and she shook her head again. On the third try she nodded, and her fingers loosened on my sleeve a little, then held on tighter."

[tracks.bond_ines_costa.chapters.a2]
title = "A Flower Pressed in the Poem"
text = "In September a layer of willow leaves lay along the moat. After the circle broke up and the others went downstairs, Inês kept me back and drew a folded sheet from her rhyming dictionary and handed it to me. “Read it first. Talk after.” Inside it a small flower had been pressed, long dried, so thin the light came through it, faded to the pale yellow of old lace. The poem was whole—the first time she had ever written a whole poem through, not a line left over for me. The signature was wrong, too. The circle’s rule was that everyone signed with a pen name: she was Half-Line, I was Countinghouse. This sheet bore her own name, written out stroke by stroke: Inês da Costa. “I’ve broken the circle’s rule,” she said. “Put down whatever the fine is.” She dipped the pen, laid it beside the sheet with the quill pointing toward me, and then simply stood there with her hands behind her back, waiting."

[tracks.bond_ines_costa.chapters.a2.choices.sign_beside]
text = "Take up the pen and sign my own name beside hers."
hint = "Her fingers are still pressing down one corner of the sheet—she isn’t ready to let you put pen to it yet."
reply = "Lieve de Clercq. I wrote it slower than usual and didn’t dare crowd it. She looked down at the two names side by side. “Now it isn’t the circle’s poem. It belongs to two people.” I went to fold it, and she stopped me. “The ink’s still wet.” She stood there and waited until the last stroke had lost its shine, then folded the sheet, flower and all, and tucked it into my pocket ledger. “Keep it on the page you turn to every day.”"
effects = [{}, {}, {}, { title = "A Flower Pressed in the Poem" }]

[tracks.bond_ines_costa.chapters.a2.choices.the_flower]
text = "Don’t sign yet. Ask her where she picked the flower."
hint = "The words are on your tongue, but she has already folded the sheet halfway shut—you can’t ask it now."
reply = "“By the moat. The first one to bloom after the ice went.” She looked at the flower. “I went by myself that day, to the stretch where we skated.” Then she lowered her head. “Why I picked it, you’ll have to work out. I’m only telling you half.” I didn’t ask again. I signed my name beside hers. She waited until my ink was completely dry before she folded the sheet and put it in my hand, and her fingers rested on the back of my hand for a moment."
effects = [{}, {}, {}, {}, { title = "A Flower Pressed in the Poem" }]

[tracks.bond_ines_costa.chapters.a2.choices.count_poems]
text = "First open the circle’s notebook and count how many poems we’ve gathered in two years."
reply = "I counted page by page while she waited beside me. Forty-three and a half. “The half is mine,” she said. “It will never be finished.” I entered the figure in my ledger, and in the balance column I wrote: circle still standing. When I looked up, the sheet was no longer on the table. She had slipped it back into the rhyming dictionary, wiped the pen, and put it back in its jar. “Another time,” she said. “When you’ve finished counting.”"

[tracks.bond_ines_costa.chapters.s]
title = "Beyond the Ship’s Passage"
text = "In December the Laurel let its girls go for good, and the boarders were fetched home one by one. The borrowed attic had no fire in winter, so the circle’s four chairs had been carried back to the back room of Inês’s house and stood in a row against the wall. I was sailing in January; my father’s ledger was already locked in my sea chest. Inês’s family was talking about ships too—not this year, but “someday.” Each letter from Lisbon pressed harder than the last, and every evening after supper her father spread the sailing lists on the table and ran his thumbnail down them line by line. We sat side by side. She was in the one by the door, the fourth chair. The circle’s notebook lay open across both our laps, and the last page was still her half line. “I’ve worked out the passage,” I said. “Antwerp to Lisbon, one person, cabin and board, eleven florins or thereabouts.” “Why would you work that out?” “I ought to know what it will cost me to see you.” Inês didn’t answer. She opened the notebook at the middle and ran her finger along the binding. She had sewn it herself; the stitches were very close. “And beyond the passage?” she asked. “Have you worked that out too?”"

[tracks.bond_ines_costa.chapters.s.choices.promise]
text = "Split the circle’s notebook into two volumes, and agree that whoever moves first sends the new address."
hint = "This notebook can’t be split. You haven’t come far enough together, or the one promise you get in this life has already gone to someone else. It has to stay with the circle."
reply = "She bent down and brought out a notebook from under her chair, calfskin like the circle’s, brand new, its spine still stiff. “I bought it last month,” she said. “It took me an afternoon to choose.” She laid the old one on my knees. “This volume goes with you. Forty-three and a half poems, for when the sea gets dull.” The new one she kept. She opened it to the first page, wrote half a line, and turned it around to show me. “From now on my volume only gets the first half of each line. I send it to you, you write the second half and send it back. Whoever moves first writes the address inside the cover.” I ran the figures in my head: Antwerp to Lisbon, a month with a fair wind, a month waiting for a ship, four months a round trip, three round trips a year, half a line per trip. “How many years of posting is that?” She said, “Let me think about it.” She thought for a long time, long enough for the pans in the kitchen to clatter twice and for someone in the yard to throw a bucket of water out onto the ice. Then she said, “A lifetime.” She shut the new notebook and held it against her chest. “Can you work that out?” I said I couldn’t. “Good,” she said. “Anything you can work out, you’d only bet on.”"
effects = [{}, {}, {}, {}, {}, { title = "Beyond the Ship’s Passage" }, {}]

[tracks.bond_ines_costa.chapters.s.choices.heart]
text = "Tell her every half line left over is mine from now on—and that when we’re grown, I’ll hear her finish it."
hint = "You can’t pick up her half line yet. You haven’t come that far, or the words you can only say to one person have already been said to someone else."
reply = "She went red to the tips of her ears and looked down at the notebook, as if what I’d said were written on it. “That line of yours,” she said, “doesn’t rhyme.” “Then fix it.” She picked up the pen and held it over the paper for a long time, and not one letter came down. In the end she set the pen aside, reached over, and took my hand. Her hand was colder than mine, and she held on tight, the way she had held my sleeve on the ice. Outside it had gotten dark. Someone in the kitchen called her to supper; she answered and didn’t move. “Let me think about it—” she said, and stopped. “This time I have. When you come back, when we’re both grown, I’ll say it to you.” She held my hand until her mother came to call her the second time. When I left, the cold of her hand was still in my palm."
effects = [{}, {}, {}, {}, {}, { title = "Beyond the Ship’s Passage" }, {}]

[tracks.bond_ines_costa.chapters.s.choices.own]
text = "Don’t split the notebook. The circle stays in Antwerp, and whoever is in town keeps writing."
reply = "“All right.” She closed the notebook and laid it on the cushion of the fourth chair. “The notebook stays here, and wherever people go, there’s somewhere to come back to.” She fished the cloth out of the basin, wrung it, and wiped that chair down from back to legs, as carefully as she had two years before. I asked who she was wiping it for. “For whoever comes next.” She hung the cloth on the rim of the basin. “If someone’s sitting in it when you come back, you can sit on the floor.” I said in that case I had better enter it first: one seat, given up. She said enter it all you like, you’re not getting it back. I didn’t sit in that chair again before I sailed. On the day I left she walked me to the end of the lane, opened the notebook to the last page, and held it up for me to see: under her half line she had ruled a line, and nothing was written on it. It was kept for me."
effects = [{}, {}, {}, { title = "Beyond the Ship’s Passage" }, {}]

[tracks.reunion_ines_costa]
name = "Inês: The Notebook That Crossed the Sea"

[tracks.reunion_ines_costa.chapters.reunion]
title = "The Notebook That Crossed the Sea"
text = "Inês’s house stood on the slope of the Alfama, its windows facing the Tagus, where the river was crowded with ships waiting for a wind. The doorkeeper said the mistress received merchants’ letters herself; they never passed through a clerk’s hands. When I came upstairs she was at the window writing a reply, a stack of opened letters at the corner of the desk—from Antwerp, from London, from Cologne, all from people scattered every which way after the circle broke up. Some asked after their families; some sent only a poem. She heard my step and looked up, and her pen stopped in the middle of a word, and that was the end of that letter. “The sun has turned you brown.” On the shelf stood three old notebooks side by side, their calfskin worn pale. The fourth lay open on her desk. She didn’t get up. With two fingers she pushed it across the desk to me and turned to the last page. There was only half a line on it, the ink still fresh: Year after year the river runs out to sea, and still the ship has not— She laid the pen beside the notebook. “Twelve years,” she said. “Work it out. How many lines do you owe me?”"

[tracks.reunion_ines_costa.chapters.reunion.default]
effects = [{ text = "Lieve: I heard your ship put in at Lisbon and left again. People on the quay said you argued a duty down at the customs house and won, and the moment I heard it I knew it was you. My address is on the back: the Alfama, the third house below São Estêvão, windows on the river, a green door—I still like green doors. I’ve copied out the first page of the circle’s fourth notebook on the back as well. On that page I wrote only the first half of the line; the second half is waiting for you. The first three notebooks are full. Some of it was sent by old members of the circle from wherever they ended up, some I wrote alone, and every place I couldn’t go on stops halfway through. There are a great many of them by now, enough to keep you answering for a long time. You used to say a quire of paper cost twelve stuivers. I asked here: in Lisbon it’s three more. Next time you come, come to me first, not to the customs house. —Inês, Lisbon" }, {}]

[tracks.reunion_ines_costa.chapters.reunion.choices.finish_half]
text = "Finish that last half line, and get the rhyme wrong once, the way I used to."
reply = "I picked up the pen and added after her half line: “—come home, but the bill has arrived ahead of it.” The last word rhymed my way, not hers. Inês leaned over to read it, then sat back in her chair and laughed exactly the way she had the first time I heard her laugh out loud in her back room. “Twelve years,” she said, “and you still can’t rhyme.” She took the pen, turned the poem another way on the next line, caught my wrong rhyme again, made half a line of it, and stopped. Then she folded down the top corner of the page and pressed it flat twice. “This one is ours too.” She pushed the notebook back to me. “Stay tonight. In the first three, the places that stop halfway—I’ve counted—come to a hundred and seventeen. You won’t answer them all in one night.” I said then we had better bet on how many I would. She said answer first, and she’d name the stakes."
effects = [{}, {}, {}, { title = "The Notebook That Crossed the Sea" }]

[tracks.reunion_ines_costa.chapters.reunion.choices.the_other_half]
text = "Don’t answer the poem. Finish what we agreed on long ago: I want the other half now."
hint = "The two of you never got that far back then, and today this half line won’t come."
reply = "Inês put the pen down. She looked at me, for a long time, long enough for someone downstairs to knock at the door and go away again. “For that,” she said, “I’ve waited until the river under this window changed its water three times over.” She stood, came around the desk, and stopped beside my chair. I was sitting and she was standing; for the first time, she was the taller one. She bent and kissed my forehead, very lightly, as if afraid the people downstairs would hear. Then she stepped back half a pace. “Let me think about it.” I didn’t move. I waited. Outside the window a ship weighed anchor, its chain rattling on and on. She came back, and this time it wasn’t my forehead. Afterward she didn’t step away at once. She rested her forehead against mine and said, “I have.” She went back to the desk, picked up the pen, and finished the half line, writing slowly, without stopping once."
effects = [{}, {}, {}, { title = "The Notebook That Crossed the Sea" }]

[tracks.reunion_ines_costa.chapters.reunion.variants.with_sophie]
text = "Inês’s house stood on the slope of the Alfama, its windows facing the Tagus, where the river was crowded with ships waiting for a wind. The doorkeeper said the mistress received merchants’ letters herself; they never passed through a clerk’s hands. When I came upstairs she was at the window writing a reply, a stack of opened letters at the corner of the desk, all from people scattered every which way after the circle broke up. She heard my step and looked up, and her pen stopped in the middle of a word, and that was the end of that letter. “The sun has turned you brown.” On the shelf stood three old notebooks side by side, their calfskin worn pale. The fourth lay open on her desk, and tucked inside it was a letter from Emden in close, crowded writing—Sophie’s. Between Emden and Lisbon, the two of them waited two months for every letter. Inês slid it out and set it under the paperweight, as easily as if she did it every day. Then with two fingers she pushed the notebook across the desk to me and turned to the last page. There was only half a line on it, the ink still fresh: Year after year the river runs out to sea, and still the ship has not— “Twelve years,” she said. “Work it out. How many lines do you owe me?”"
