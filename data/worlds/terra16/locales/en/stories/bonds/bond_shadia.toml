# 再来一趟（bond_shadia）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_shadia]
name = "Shadia: One More Run"

[tracks.bond_shadia.chapters.c1]
title = "One More Run"
text = "The ship school stayed three days in Muscat. On the second afternoon the harbor children rowed out to challenge us: one lateen-rigged skiff each, from the landing steps out to the black rock at the harbor mouth, around it, and back. The school sent its students out one after another, and one after another they came back beaten, every time by the same sunburned girl, whose name the children on shore kept bellowing: Shadia. When my turn came, I looked at her sail first. It had three patches—one indigo, one ochre, one cut from a faded red headscarf—and each bellied out its own way in the wind. At the black rock she cut inside me and came about; one flick of the sail and it was full, while I was still hugging the rock, hunting for the angle. At the steps she had half a boat length on me. She didn’t land. She swung her skiff broadside and grinned at me. “So that’s all a pilot’s student has got?” She rapped my bow with her oar. “One more run—dare you?”"

[tracks.bond_shadia.chapters.c1.choices.race_again]
text = "Bring the bow around and race her again."
reply = "The second time I lost by a whole boat length, worse than the first. Shadia laughed so hard she nearly went over backward and had to grab the gunwale to stay in. “The more you race, the farther behind you get! Were you rowing the wrong way?” On shore she pulled a handful of dates from the cloth bag at her waist and gave me half, chewing as she talked. “Come back tomorrow. I’m here every day till your ship leaves.”"

[tracks.bond_shadia.chapters.c1.choices.ask_the_turn]
text = "Ask her first how she stole the wind rounding the black rock."
reply = "She froze, oar in midair. After a moment she dragged her skiff up the beach, crouched, and drew in the wet sand with one finger: the rock, the wind, her boat, the bow giving a little to leeward first. “You can’t wrench it around. You let it turn itself.” She brushed the sand off her hands and gave me a sidelong look. “You’re the first loser who ever asked me how I won. The rest just curse the rock.”"

[tracks.bond_shadia.chapters.c2]
title = "Her Sail, Your Hands"
text = "The next time the school ship put in at Muscat, Shadia was already squatting on the quay, waiting. She handed me the tiller of her three-patched skiff and settled herself in the bow. “You haul your own sheet. I’m just watching.” Outside the harbor the wind came up hard. I trimmed the sail in too tight; the boat lurched over and the gunwale scooped up a mouthful of sea. “Ease!” she shouted from the bow. I eased too far, and the sail went flapping and thundering while we spun in the chop. She sat hugging her knees and didn’t move a finger. She just watched. I took in a little, then a little more, until the sail stopped shaking and the boat came upright, and all at once the line in my hand went light. Only then did she grin. “That’s it. Remember what that weighs in your hand.” Ashore, she fished a frayed length of sheet out of the bilge and tossed it to me, the broken end all fuzz. “My first time, I hauled it that tight too. So tight it snapped. My father had to row out and tow me home.”"

[tracks.bond_shadia.chapters.c2.choices.keep_the_rope]
text = "Keep the broken rope, and tell her I’m sailing with her again next time."
hint = "She still thinks of you as some school kid who came to gawk. She’ll toss that rope into the sea, and you won’t get aboard her boat a second time."
reply = "Shadia raised her eyebrows. “Next time you haul the sail and I take the tiller. We’ll see if you dump me in the sea.” I wound the broken rope twice around my waist and tied it off. She took one look, said the knot was pretty but useless, yanked it loose, and tied a proper sailor’s knot in its place, then gave it two hard tugs. “There. Now it won’t come off.”"

[tracks.bond_shadia.chapters.c2.choices.thank_and_go]
text = "Thank her, then go back aboard and write that sail angle in my notebook."
reply = "I filled a page: where the wind came from, how far the sail came in, how heavy the line felt in my hand. To make it stick, I worked it into two rhyming lines. Shadia hung over our ship’s rail, poked her head in, and read it out, stumbling. “You pilot people write poems even when you lose?” I said it wasn’t a poem, it was a way of remembering. She pushed the notebook back at me. “Sounds like one when you read it.”"

[tracks.bond_shadia.chapters.b1]
title = "The Burnt Doorframe"
text = "This time Shadia said nothing about racing. She led me through the lanes behind the fish market to a stretch of sand. A doorframe stood up out of it, black, burned down to a point at the top. “My house,” she said. “The door was here. There was a lemon tree in the yard.” Two years ago the Rumi ships had come into the harbor. Their guns hit the waterfront first, and her house was among the first to burn. She and her mother crouched all night behind the rocks by the harbor, watching the fire jump from one lane to the next. She broke a piece of char off the frame and rolled it to powder between her fingers. “Rumi.” She blew the dust away. “I see their sails and I want to throw up.” Standing by that doorframe, I remembered this past August, when my family’s ship pulled a Rumi boat out of the Gulf of Oman. The men aboard were too parched to speak. I held water out to one of them, and his hands shook so badly that half of it spilled."

[tracks.bond_shadia.chapters.b1.choices.tell_her]
text = "Tell her my family’s ship once saved some Rumi, then wait for her to finish cursing."
hint = "She doesn’t trust you enough yet to hear something like that. Open your mouth and she’ll turn and walk off."
reply = "She cursed for a long time. She cursed the Rumi, she cursed my family’s ship, she cursed the Gulf of Oman for not raising a squall to flip that boat that day, until her voice went hoarse and she kicked the doorframe, then hopped around clutching her foot. Then she crouched with her back to me and asked, “The men on that boat. What happened to them?” I said we took them to Hormuz and put them ashore. She stared at the doorframe a long while. “Then they had better luck than we did.”"

[tracks.bond_shadia.chapters.b1.choices.scrape_the_char]
text = "Say nothing, and help her scrape the char off the doorframe."
reply = "I borrowed a gutting knife from a fishmonger, she picked up a mussel shell, and we each took a side. The char came off in layers, and black dust settled all over us. Underneath, the wood was pale yellow, its rings still there. Shadia laid her palm flat against it and held it there a long time. “It’s still alive.” Then she bent to scrape the other side, harder than before."

[tracks.bond_shadia.chapters.b2]
title = "The Race That Did Not Start"
text = "That year Muscat held a big race. A red flag waited at the foot of the pole on the quay; when it went up, the race began. The wind was far too strong that day. Waves rolled over the reefs outside the harbor in ranks, throwing white spray high into the air. Every other crew was hauling sail. Shadia was the first to furl hers, and she started dragging her boat up the beach. “I’m not racing.” A few boys nearby started jeering. “A whole year of winning, and today you’re scared to lose?” “She hid the night the Rumi came, too!” Her face went scarlet. Her mouth opened, but she didn’t say a word back; she bent down and started untying her lines. Standing beside her, I saw her hands stop for a moment. Her eyes went past the boys to a patch of white water off the harbor, to the east. There was nothing to see there but waves. She looked at those waves the way you look at someone who owes you and won’t pay."

[tracks.bond_shadia.chapters.b2.choices.stay_ashore]
text = "Stay ashore to help her stow the boat, and tell the jeerers I’m not racing either."
hint = "She doesn’t want anyone to see why she won’t race. Step up beside her now and you’ll only make it worse for her."
reply = "The boys laughed louder and said the pilots’ girl was a coward too. I ignored them, helped Shadia roll up her sail, and hauled the boat up past the tide line. Two of the boats that went out capsized on the reef to the east. Everyone was pulled out; one boy broke an arm. After dark Shadia came looking for me and shoved a roll of red cloth into my arms. “This flag never went up today. It’s yours.” I asked where she’d gotten it. “Stole it.”"

[tracks.bond_shadia.chapters.b2.choices.ask_the_reef]
text = "Ask her quietly which reef out there she’s looking at."
reply = "Her head whipped around as if I had stepped on her foot. She stared at me a long time—long enough that the boys drifted off to raise their sails—and then, very low: “You saw.” I waited for more. She coiled the lines she had untied, round after round, perfectly neat, and laid them in the bottom of the boat. “I’ll tell you someday. Don’t ask now.”"

[tracks.bond_shadia.chapters.a1]
title = "The Pleiades Going Down"
text = "She won this one; I lost by no more than a bow. We dragged both boats up the beach and sat with our backs against the hulls. The sun had just gone down and the western sky was still bright. The Pleiades hung in that glow, a tiny cluster, a little lower than ten days before. I wrote down its height above the sea in my notebook, and Shadia leaned over to look. “Writing again?” “A few more nights and it sinks into the sunlight. Then you can’t see it.” She made a small sound and lay back with her hands behind her head. “My grandmother says when the Pleiades set, the sea shuts its door.” After that the southwest wind comes, the ports over in India close, and the ships can only wait. She didn’t ask when our next race would be. That was a first. After a long while, still watching the stars, she said, “Before it goes down—will you still come?”"

[tracks.bond_shadia.chapters.a1.choices.come_till_it_sets]
text = "Say yes, and come sit with her every evening until the night it sets."
hint = "She only asked offhand. You two aren’t close enough yet for a promise of every evening."
reply = "As it happened, the school ship stayed those few days. Every evening I went, and every evening she was there, leaning against the same boat. The Pleiades sank a little lower each night, until on the last one there was only a speck of light skimming the sea. It flickered twice and was gone. She didn’t say anything, and neither did I. She took a date from her cloth bag and set it in my palm, and her fingers stayed there a moment before they left."

[tracks.bond_shadia.chapters.a1.choices.swear_her_secret]
text = "Say yes—and tell her I’ll wait for her to bring up that reef herself."
hint = "That reef is something she won’t let anyone touch. You two haven’t reached the point where you can mention it."
reply = "She turned her head to look at me. The sky had gone dark, but her eyes still caught the light. “When it rises again,” she said, “I’ll tell you.” I said that for the Pleiades to come back up in the east, she’d have to wait for summer. She turned her face back to the sky. “Then I’ll wait for summer.”"

[tracks.bond_shadia.chapters.a1.choices.count_stars]
text = "Count with her: how many stars are in the Pleiades, really?"
reply = "She counted six. I counted seven. She said the extra one was my eyes playing tricks; I said I had been counting those stars since I was small. We put our heads together and pointed them out one by one until it was full dark and we couldn’t see them anymore, and we still hadn’t settled it. She flopped back on the sand. “Pilots’ eyes are too good. It’s no fun.”"

[tracks.bond_shadia.chapters.a2]
title = "The Sailmaker’s Palm"
text = "By the time the school ship came back to Muscat that summer, the Pleiades were rising in the east before dawn. Shadia was waiting on the quay, and the moment she saw me she pushed something into my hand: the palm she used for sewing sails. The leather strap was worn to a shine, and the iron plate in the palm was pitted all over with tiny dents where needles had been driven home. “When your sails tear from now on, patch them yourself.” Then she slid the chart out from under my arm, spread it over an upturned fish basket, and with a stick of charcoal drew a small circle east of the harbor mouth. “About there.” “Off by a finger, off by a hundred miles,” I said. She glared at me, moved the charcoal a hair to the left, and drew it again, pressing so hard the paper pilled. “Now it’s not off. The year I went out alone, this is where it tore my hull open. It isn’t in my father’s rutter.” She tossed the charcoal onto the basket. “Now it’s on your chart.”"

[tracks.bond_shadia.chapters.a2.choices.take_palm]
text = "Keep the palm, and write her name beside that little circle."
hint = "That palm has been with her for years. It weighs too much; you two aren’t close enough yet for you to take it."
reply = "I wrote “Shadia” beside the circle, in very small letters, squeezed between the circle and the coastline. She bent over it a long time. “Why put my name there? It’s not my reef.” I said she was the one who found it. “I’m the one who hit it!” She burst out laughing first, laughed until she was doubled over, and wiped her eyes with the back of her hand, smearing charcoal across her face."
effects = [{}, {}, {}, { title = "The Sailmaker’s Palm" }]

[tracks.bond_shadia.chapters.a2.choices.hold_her_hand]
text = "Keep the palm, take the hand that drew the circle: I’ll watch this reef for you."
hint = "Your hand gets halfway and stops on the chart. You have never held hers; to say that now would be too soon."
reply = "Her hand stayed in mine a long time. She didn’t pull it back. Her palm was hard, callus over callus, all of it from sewing sails, and her fingertips were still black with charcoal. She looked down at our two hands, one on the other, and said, “Your hands are too soft.” After a moment she added, “You need to sew more sails.” Only then did she take her hand away and turn to roll up the chart, very slowly."
effects = [{}, {}, {}, { title = "The Sailmaker’s Palm" }, {}]

[tracks.bond_shadia.chapters.a2.choices.tell_father]
text = "Urge her to put this reef in her father’s rutter too."
reply = "She picked up the charcoal and turned it once between her fingers without looking at me. “When I’ve got the nerve.” She took the palm back out of my hand, slipped it onto her own, and tapped my chart with the iron side. “Patch your own sails first. Once you can, come ask me for it again.”"

[tracks.bond_shadia.chapters.s]
title = "A Race with No Date"
text = "In December the northeast wind settled in, and the school ship was heading south. I was going with it. Come spring, Shadia would be crewing on her father’s ship, running to Hormuz. On the last evening she spread a sheet of paper on the quay and wrote out a race agreement in charcoal, pressing hard on every stroke: Racers, Shadia and Najma. Course, Muscat harbor, around the black rock and back. The space for the date she left empty. “The day you come back,” she said, “that’s race day.” She tapped the paper twice with the charcoal. “And don’t you go running through bad weather to get here. Whoever capsizes halfway doesn’t lose. She just never showed up.” She folded the agreement in four and pressed it into my hand, then kept hold of my wrist, lifted her chin, and added, “Dare you?”"

[tracks.bond_shadia.chapters.s.choices.promise]
text = "Agree that the day I return, I’ll report I’m safe first, then we race."
hint = "You hold the race terms, but you can’t say it—“news that you’re safe comes first.” Your friendship hasn’t rounded the black reef yet—or you’ve already settled a lifelong promise with someone else."
reply = "“Report you’re safe first?” Shadia snorted. “Then you’d better come back alive, or there’s nothing to report.” I said of course I’d come back alive; pilots don’t capsize halfway. She tugged the agreement out of my hand, spread it on her knee, and by the light of the quay lamps drew a little circle beside the empty date. It was very round, and its size and place were exactly those of the circle she had drawn on my chart. “This circle,” she said, tapping it with the charcoal, “is the day you come back. Whenever your ship makes port, you come ashore and find me first, and you tell me to my face that you’re all right. And then—” She folded the paper again, neatly this time, tucked it into the front of my robe, and pressed it flat through the cloth. “And then you get ready to lose.” She stood, brushed off the sand, took a few steps up the beach, and turned back. “I mean it. Safe first.”"
effects = [{}, {}, { title = "A Race with No Date" }, {}, {}, {}]

[tracks.bond_shadia.chapters.s.choices.heart]
text = "Write “once we’re grown” in the date, and say that day holds more than a race."
hint = "The charcoal is in your hand, and you can’t bring yourself to write. Either you two aren’t close enough yet to name such a day, or you have already promised the same to someone else."
reply = "I took the charcoal and wrote three words in the space for the date. Shadia leaned over and read them out. “Once we’re grown.” Then she went quiet and stared at them for a long time. The quay lamps lit her face, and the color crept up into it until she was as red as the old headscarf patch on her sail. “What words?” she asked. I said I would tell her that day. She bent to fold the agreement, missed the edges twice, gave up, crumpled it into a ball, and closed it in her fist. Then she reached over and took my hand, and the ball of paper was pressed between our palms. “Whatever it is,” she said, “I’ll keep half of it for you.” She held on like that until somebody on the school ship called my name. Then she let go, smoothed the paper out, tore it in two right through the date, tucked one half into her robe, and pushed the other back at me. “You keep the other half. Lose it, and that counts as giving up.”"
effects = [{}, {}, {}, {}, { title = "A Race with No Date" }, {}, {}]

[tracks.bond_shadia.chapters.s.choices.own]
text = "Agree to come back to Muscat and race once a year for the next ten years."
reply = "“Ten years?” Shadia’s eyes went wide, and she counted on her fingers. “In ten years we’ll be twenty-six. Old. Too old to row.” I said then we’d race until we couldn’t row. “Then you’ll lose ten times.” “Maybe you will.” She snatched the charcoal, wrote a ten in the date, and drew ten short strokes after it. “Cross one off each race. Whoever wins more, wins.” I asked whose tally a crossed-off stroke went on. She thought about it and said the winner’s—no, wait, the loser’s, so the loser couldn’t weasel out—and talked herself in circles until she laughed, gave me a shove, and sent me tumbling down the dune. I came up covered in sand. She stood at the top, hands on her hips, and yelled, “First race—you already lost!”"

[tracks.reunion_shadia]
name = "Shadia: The Old Rival’s Harbor"

[tracks.reunion_shadia.chapters.reunion]
title = "The Old Rival’s Harbor"
text = "In 1562 my ship dropped anchor at Muscat. Out in the harbor a gaggle of children were racing lateen skiffs in total chaos, and a woman standing in a freshly painted racing boat was pointing her oar at them and shouting. “The sail! Why have you got it in so tight—you want to go over?” It was Shadia. Halfway through the scolding she looked up and saw my sails. She shipped her oar, abandoned the children, and came rowing straight at us, her bow nearly ramming my side. She hauled herself up over the rail, browner than ever, and before anything else pulled a letter from her robe and waved it under my nose. “A challenge from some Gujarati pilot. Every year he comes to race me, and every year he loses.” She tucked it away, folded her arms, and looked me over. “And you? Did you come to race this time, or just to sit a while?” Before I could answer, she jerked her chin toward the east side of the harbor mouth. “That reef. I put it in my father’s rutter. He yelled at me for a whole day.”"

[tracks.reunion_shadia.chapters.reunion.default]
effects = [{ text = "Najma: Your ship didn’t come into Muscat this year. The harbor men say you’re over Malacca way; others say you went somewhere farther. I don’t care. You didn’t come, that’s all. I drew this chart myself. It’s ugly, and you pilots are not allowed to laugh. The landing steps, the black rock, the reef east of the harbor mouth—they’re all on it. I drew that reef exactly. You told me once that a tiny slip puts you miles off, and I remembered, so I measured three times before I put the charcoal down. It’s in my father’s rutter now too. He yelled at me all day, asked why I hadn’t told him sooner, and when he was done yelling he picked up his pen and traced it over himself. These days I teach the harbor children to race. They haul their sails in as tight as you used to, and every time I see it I want to laugh. A pilot from Gujarat sends me a challenge every year and loses every year, and then comes back for more. He’s got more nerve than you. I broke up the old three-patch boat but kept the sail. All three patches are still on it, hanging on the wall of my room. That race we agreed on is still owed. I’m not pushing you, and don’t go running through bad weather to get here. But the day your ship makes port, come find me first. Next to that reef on the chart I wrote two words. You’ll know them. —Shadia" }, {}]

[tracks.reunion_shadia.chapters.reunion.choices.friend]
text = "Say I came to sit a while: share some dates and tell her about my years at sea."
reply = "Shadia bellowed at the children to drag their own boats ashore, then pulled me down onto the sand, dug a handful of dates out of her cloth bag, and split them with me, the same as always. I told her about Hormuz and Calicut, and about the blow off Malacca: the sail only half in when the mast started to groan, the ship sliding sideways through the seas half the night, the helmsman’s hands frozen stiff by dawn. She forgot to chew. At the end she slapped her knee. “If I’d been there, I’d have sailed that blow better than you.” I said she had never seen a wind that big. “That’s exactly why I want to.” She flicked a date pit out over the water, a long way, and then asked which way the wind had come from, how far the sail was in, which way the helm was pushed—one thing after another, more thoroughly than any harbor clerk. The sun went down and the children were long gone, and she was still drawing the wind’s direction in the sand with her finger. When she finished, she pointed at it. “Next time you sail, take me along for a stretch. Just one.”"
effects = [{}, {}, {}, { title = "The Old Rival’s Harbor" }]

[tracks.reunion_shadia.chapters.reunion.choices.rival]
text = "Say I came to race—around the black rock, one more time, same as back then."
reply = "She grinned so wide every tooth showed. “I was waiting for you to say that.” She gave me her freshly painted racer and jumped into one of the children’s old skiffs herself, saying that made it fair. The children crowded onto the landing steps, and one of them volunteered to call the start. Out past the harbor I found that my hands had remembered the weight of that sheet all these years; I knew where the sail went without thinking. Around the black rock we were nearly abreast, and still she cut inside me and came about, and one flick filled her sail. Back at the steps she had half a boat length on me, exactly as before. The children roared. She stood up in her skiff, lifted her chin at me, and laughed louder than any of them. On shore she split the handful of dates the children had pooled for the winner and gave me half. “You lost a lot more respectably this time. Coming back next year?”"
effects = [{}, {}, {}, { title = "The Old Rival’s Harbor" }]

[tracks.reunion_shadia.chapters.reunion.choices.love]
text = "Say I’d like to come aboard her boat and take the helm with her."
hint = "Her oar still lies across the gunwale. You never filled in that blank on the race terms, and now, with the tiller in reach, the words still don’t come."
reply = "She looked at me a while without a word, then turned and gave up half the tiller. We squeezed together in the stern, one hand each on the helm, and took the freshly painted boat out of the harbor, past the black rock, all the way to the reef east of the harbor mouth. The sea broke white over it. She let the sail go slack, and the boat rocked gently just outside the reef. “Here we are.” From inside her robe she took half a sheet of paper, crumpled soft, the charcoal worn faint; all that was left in the date was “Once we’re.” “The half I kept for you is right here.” I took the other half out of my own robe. On mine, “grown” was still there too. She laid the two halves side by side on the gunwale, matched the torn edges, and looked at them a while. Then she put her hand over mine on the tiller, leaned in, and kissed me. The wind set the sail thrumming and the bow slowly fell off, the tiller resting loose under both our hands. A long while later she said against my ear, “Call this one a tie.”"
effects = [{}, {}, {}, { title = "The Old Rival’s Harbor" }]

[tracks.reunion_shadia.chapters.reunion.variants.with_kabir]
text = "In 1562 my ship dropped anchor at Muscat. Out in the harbor a gaggle of children were racing lateen skiffs in total chaos, and a woman standing in a freshly painted racing boat was pointing her oar at them and shouting. “The sail! Why have you got it in so tight—you want to go over?” It was Shadia. Halfway through the scolding she looked up and saw my sails. She shipped her oar, abandoned the children, and came rowing straight at us, her bow nearly ramming my side. She hauled herself up over the rail, browner than ever, and pointed toward the quay, where a Gujarati man was crouched beside an overturned boat, mending her rudder. “That pilot lost to me three times. A man who’s lost three times ought to be good for something.” She folded her arms and looked me over. “And you? Did you come to race this time, or just to sit a while?” Before I could answer, she jerked her chin toward the east side of the harbor mouth. “That reef. I put it in my father’s rutter. He yelled at me for a whole day.”"
