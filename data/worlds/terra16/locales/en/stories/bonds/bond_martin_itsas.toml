# 马丁·伊萨斯：听桶（bond_martin_itsas）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_martin_itsas]
name = "Martin Itsas: Listening to the Casks"

[tracks.bond_martin_itsas.chapters.c1]
title = "Listening to the Casks"
text = "Just before spring, the shipowner came to the cooperage to pass this year’s water casks for the voyage. Twenty new casks stood in a row outside the door, still smelling of raw chestnut. Martin went down the line rapping each one with his knuckles—rap, then tilt his head and listen. At the seventh he put his ear to the staves and kept it there a long time. “This one doesn’t go aboard.” The shipowner bent and squinted and found no crack. “Cooper’s boy, are you listening to a cask or to ghosts?” Martin said nothing. He ladled half a cask of river water into it and crouched down beside it to wait. I crouched down too. It took about as long as a meal. Then, out of the grain at the seventh cask’s waist, a single drop swelled, hung there, and fell—plip—onto the flagstone. Martin stood and brushed the shavings off his hands. “Count the water casks three times.” The shipowner flushed red all the way down his neck."

[tracks.bond_martin_itsas.chapters.c1.choices.ear_to_cask]
text = "Put your own ear to the cask and ask him to teach you how to listen."
reply = "I heard nothing but my own heartbeat. Martin glanced at me. “Close your eyes.” He rapped again, and I still heard nothing. On the third rap the sound came back dull and muffled, like someone curled up inside the cask, coughing. “Hear it?” he asked. I nodded. He didn’t say anything more, but from that day on he stopped turning his back to me when he tapped a cask."

[tracks.bond_martin_itsas.chapters.c1.choices.call_him_coward]
text = "Laugh at him for a coward: it’s one cask, and the sea has plenty of rain."
reply = "Martin didn’t argue. He tipped the weeping cask onto its side and rolled it to my feet; it rocked half a turn on the stone. “Then it’s yours. Take it aboard and see.” The drop was already swelling out of the grain again. I didn’t reach for it. He waited a moment, rolled it back, and stood it in the corner."

[tracks.bond_martin_itsas.chapters.c2]
title = "Before the Shipowners"
text = "On the twentieth of May the shipyard kept its old custom and invited the shipowners to hear the students argue a question of seafaring. This year’s was written on a board in charcoal: how many casks of fresh water should a whaler bound for Newfoundland carry? One student said forty, another thirty-five, and the shipowners nodded along—one fewer water cask out meant one more empty cask home, full of whale oil. Then it was Martin’s turn. He stood up. “Sixty-two.” The room burst out laughing. Someone asked if he meant to sail the ship to the bottom of the sea for a drink. Martin gripped a sheet of figures, his ears burning red, and read it out line by line: how many men aboard, how many months out, how much each man drinks a day, how many days lost lying to in fog, how much a cask leaks on the way. When he reached “contrary winds on the voyage home,” his voice shook. He stopped, rapped three times on the edge of the table, and went on. A shipowner in the front row yawned. “Boy, whale oil’s worth more than water.”"

[tracks.bond_martin_itsas.chapters.c2.choices.stand_with_him]
text = "Stand up beside him, read his figures on, and name the ship that lost men to thirst last year."
hint = "He still thinks you came to watch him make a fool of himself. Stand beside him now and you’ll only make it worse."
reply = "I took the sheet and read on from “contrary winds on the voyage home.” When I’d finished, I added one more line: last autumn the ship back from Newfoundland came in four men short, and not one water cask in her hold was full. The room went quiet. An old shipowner with a white beard stroked it and said, “That boy’s count—my ship sails on it.” Afterward Martin caught up with me at the door, worked at it for a long moment, and said, “You read it better than I did.”"

[tracks.bond_martin_itsas.chapters.c2.choices.middle_number]
text = "Offer a number in between, so both sides can back down without losing face."
reply = "I said fifty. The shipowners laughed and nodded, and that settled it. Martin didn’t nod. On the way out he passed close by me and said under his breath, “A number in between—the sea won’t take it.” The next day, going past the cooperage, I saw he had hooped two more casks on top of the fifty and set them in the row by the door that nobody had ordered."

[tracks.bond_martin_itsas.chapters.b1]
title = "The Lamp at the End of the Breakwater"
text = "Late in November the whalers came back up the Nervión one after another, all but one that still showed no sail. Someone from my family was aboard her. That night a gale came up. The lamp frame at the end of the breakwater was knocked askew and the lamp blew out twice. By the time I ran out there, Martin was already on the spot with a ladder on his shoulder and a wrench stuck in his belt. “Hold it,” he said. I held the ladder and he climbed. We shouted at each other in the wind about how high the lamp should hang. “Too high and nobody sees it in the fog!” “Too low and the first big wave puts it out!” Up top he was tying knots and counting under his breath—one, two, three—losing count and starting over. Below, I yelled at him to hurry until my voice went hoarse. By the time the lamp hung steady again, the sky to the east had gone pale. Far out past the breakers there was a sail."

[tracks.bond_martin_itsas.chapters.b1.choices.hold_all_night]
text = "Hold the ladder all night; when he comes down, take the lamp watch and let him sleep."
hint = "He won’t let anyone see him tired yet. Tonight he’d rather keep the watch alone."
reply = "Sometime after midnight he climbed down, sat with his back to the lamp frame, and said he’d just shut his eyes for a moment. When the sail came into the harbor he was asleep against my shoulder, the wrench still in his fist. I didn’t wake him. My shoulder went numb and I didn’t move, not until the ship tied up at the quay and my family stood at the rail waving toward the breakwater."

[tracks.bond_martin_itsas.chapters.b1.choices.run_to_harbor]
text = "The moment you see the sail, run for the quay and leave him the ladder."
reply = "I ran all the way to the quay and threw my arms around my family at the foot of the gangplank, squeezing until I got told off for it. When I looked back toward the breakwater, Martin was standing under the lamp. He lifted it once in our direction, then shouldered the ladder and walked slowly home on his own."

[tracks.bond_martin_itsas.chapters.b2]
title = "Summer in the Cooperage"
text = "When the shipyard broke for summer I went to work in Martin’s family cooperage, shaving staves, splitting hoop withies and sweeping shavings from morning to night. In June the last ship for Newfoundland was due to sail at dawn, and she was still ten oil casks short. The shipowner planted himself in the doorway and swore until even Martin’s father retreated to the back room. Martin didn’t say a word. He filled all ten casks with water and lined them up in the yard. By the time the sun was slanting west, three of them had a dark wet patch at the waist. He picked up a hammer and started knocking them apart. The shipowner grabbed a stave as if to smash the counter. “She sails at dawn and you’re taking them to pieces?” “Put leaking casks aboard, and what do you bring the oil home in?” Martin said. The staves clattered to the floor. He laid them out one by one, dragged a bundle of freshly split chestnut hoops out of the shed, and looked back at me. “Whether we sleep tonight is up to you.”"

[tracks.bond_martin_itsas.chapters.b2.choices.rehoop_all_night]
text = "Stay up with him all night: rehoop the three leakers, then tighten the other seven too."
hint = "He hasn’t trusted your hands yet. He won’t let you touch an oil cask."
reply = "We worked by a single oil lamp until dawn. He shaved, I passed hoops; he drove, I held. When a chestnut hoop wouldn’t bend, he pressed it down with the heel of his hand until his palm went white. By sunrise all ten casks had been rolled aboard and both of us had blistered hands. Before the last one went up, Martin took his cooper’s knife and cut a small slanting hook into the bottom of every cask. “These are yours,” he said. “If one leaks, I’ll come looking for you.”"

[tracks.bond_martin_itsas.chapters.b2.choices.beg_a_day]
text = "Go plead with the shipowner to hold the ship back half a day."
reply = "The shipowner tore into me, from my family’s harpoon all the way down to my mouth, and when he was done he held the ship until afternoon anyway. Martin rolled the last cask up the gangplank, straightened, and across the crowd held up three fingers to me. Only later did I understand: every cask, counted three times."

[tracks.bond_martin_itsas.chapters.a1]
title = "Ice He Could Not See"
text = "One night early that spring I couldn’t sleep and walked out onto the San Antón bridge. Martin was already there, both arms braced on the stone parapet, staring down at the river. “Can’t sleep either?” I asked. “I had the dream.” After a while he went on. “Always the same one. The ship’s moving through fog, and up ahead there’s a field of ice, white going blue. I know it’s there, but I can never see how big it is. Every time I wake up, the blanket’s soaked.” He rapped the parapet with his knuckles—once, twice, three times—as if it were a cask. “I go aboard in June,” he said. “Newfoundland. All the ship’s water is mine to keep.” At the end of the bridge the bell of San Antón struck one. He pulled his hands up into his sleeves, as if he were cold."

[tracks.bond_martin_itsas.chapters.a1.choices.share_cloak]
text = "Open your cloak, give him half, and wait out the night with him on the bridge."
hint = "You aren’t close enough yet to huddle under one cloak. Your hand goes to the tie, then drops."
reply = "The cloak wasn’t big enough, so we had to squeeze in shoulder to shoulder. He said, “You’re really warm,” and then froze at his own words and turned his face toward the river and kept it there a long time. Near dawn the first water carrier came over the bridge. Martin straightened up and handed the cloak back. “I’ll be here again tomorrow night.”"

[tracks.bond_martin_itsas.chapters.a1.choices.see_it_for_him]
text = "Promise that once you reach Newfoundland, you’ll go and get a clear look at that ice for him."
hint = "It’s too heavy a thing to say. He isn’t ready to hand you what’s in that dream."
reply = "“If you see it clearly, come back and tell me how big it is,” Martin said, “and I won’t be afraid anymore.” He thought a moment and added, “Measure it. Looking isn’t enough.” I said all right, I’d measure it and bring it back. We each scored a line into the stone with a thumbnail, side by side, and agreed to match them up when we got home."

[tracks.bond_martin_itsas.chapters.a1.choices.ice_colour]
text = "Ask him what color the ice in the dream is."
reply = "He thought for a long time. “Like whale oil that’s stood in the shop all winter,” he said. “White, with a bit of yellow coming through.” Then he laughed at himself, shoulders shaking. “I can’t even dream without casks.” It was the first time I’d ever heard him laugh out loud."

[tracks.bond_martin_itsas.chapters.a2]
title = "The Shared Knot"
text = "In June the whalers were ready to sail for Newfoundland. It was Martin’s first voyage, and all the ship’s fresh water was in his charge. The evening before they sailed he came to find me at the shipyard with a length of newly twisted hemp, still smelling of tar. “Basque sailors tie a shared knot before they go out,” he said. “Two people each tie half, and only together does it make one whole knot. When you part, you cut it, each keeps a piece, and you join them when you’re back.” He finished his half at one end of the rope, tight and even, like a well-hooped cask. Then he held out the other end. When I took it my fingers brushed his. They were covered in fresh calluses, and one of them was still raw. “Your half,” he said. “Tie it however you like.”"

[tracks.bond_martin_itsas.chapters.a2.choices.tie_your_half]
text = "Take the rope end, finish your half, cut it, and keep one piece each."
hint = "He has tied only half the knot; the other half is yours to tie—and you aren’t close enough yet to take up that end."
reply = "My half came out crooked, with one loop still loose. I started to pick it apart and redo it, but he put his hand over mine. “Leave it. Crooked is easy to recognize.” He cut between the two halves with his knife, wound his piece three times around his left wrist and tied it off hard. “If they don’t match when I get back,” he said, “it’ll be because you tied yours wrong.”"
effects = [{}, {}, {}, { title = "The Shared Knot" }]

[tracks.bond_martin_itsas.chapters.a2.choices.tie_slowly]
text = "Take the rope end and tie so slowly that he has to keep holding the other end."
hint = "It’s too weighty a thing; you aren’t close enough to accept it. Tie it that slowly and he’d only pull his hand away."
reply = "I wound it one turn at a time, pausing after each. Martin kept hold of the other end the whole while, not hurrying me, not letting go. The light at the edge of the sky drained away bit by bit, and down on the quay someone lit a lamp. When it was done he looked at it a long time before he cut it. “You tie really slowly,” he said. His voice had gone a little rough."
effects = [{}, {}, {}, { title = "The Shared Knot" }, {}]

[tracks.bond_martin_itsas.chapters.a2.choices.keep_whole]
text = "Tell him not to cut it—you’ll keep the whole rope until he’s back to finish it."
reply = "Martin shook his head. “And if I come back and can’t find you,” he said, “then the knot’s been tied for nothing.” He cut the rope anyway, pressed the untied end into my palm, and folded my fingers over it one by one, and pressed once on my closed fist."

[tracks.bond_martin_itsas.chapters.s]
title = "Saint Nicholas’s Lamp"
text = "Early in December, Martin’s ship came home from Newfoundland. Not one of the water casks in his charge had leaked, and the shipowner clapped him on the shoulder right there on the quay for everyone to see. On the eve of Saint Nicholas, by the shipyard’s old custom, the students went out to the end of the breakwater to light a lamp for the sailors’ patron. It was the last time our year would light it, and he and I were both there. Once it caught, the wind pressed the flame down low. Martin unwound his piece of the shared knot from his wrist. Half a year of sea wind had bleached the hemp pale. “Where’s yours?” I took mine out. We held the two pieces together under the lamp, cut end to cut end. They fit exactly. In spring I’d be shipping out on my family’s boat, and he knew it. He pinched the two ends together and didn’t let go. “This time,” he said, “it’s my turn to wait under the lamp for you.”"

[tracks.bond_martin_itsas.chapters.s.variants.knot_door]
text = "Early in December, Martin’s ship came home from Newfoundland. Not one of the water casks in his charge had leaked, and the shipowner clapped him on the shoulder right there on the quay for everyone to see. On the eve of Saint Nicholas, by the shipyard’s old custom, the students went out to the end of the breakwater to light a lamp for the sailors’ patron. It was the last time our year would light it, and he and I were both there. Once it caught, the wind pressed the flame down low. Martin said the first thing he’d done off the ship was go and look at the knot on the cooperage door. It was still hanging there, the hemp bleached pale by half a year of wind. “One half’s neat. The other I tied crooked, trying to copy somebody else’s hands,” he said. “It should have been cut. Nobody came for the other piece that day.” In spring I’d be shipping out on my family’s boat, and he knew it. He rapped the lamp frame once with a knuckle, then stopped. “This time,” he said, “it’s my turn to wait under the lamp for you.”"

[tracks.bond_martin_itsas.chapters.s.choices.promise]
text = "Promise that someday you’ll sail together: you at the helm, him in charge of the water."
hint = "Under the lamp, you can’t bring yourself to promise it—you at the helm, him on the water casks. Your friendship isn’t strong enough yet to tie for life—or you’ve already tied a lifelong knot like this with someone else."
reply = "“Agreed?” Martin asked. “Agreed. I take the helm, you keep the water.” He nodded, laid the two ends side by side, and by the lamplight tied them into one with a joining knot—slowly—then pulled it tight with his teeth. He climbed the crossbars of the lamp frame and lashed the whole knot beside the iron hook the lamp hung from, three turns around. “It stays up here,” he said, looking down at me, “until that year.” The wind caught the knot and spun it under the lamp. He climbed down; the chilblains on the backs of his hands had split, and he just wiped them on his trouser leg. “What if I make captain first?” I said. “Same thing,” he said. “A captain’s water is still mine to keep.” On the way back he walked on the river side, blocking the wind off the water, and counted the lamps along the bridge as we went. By the door of San Antón it came to exactly twelve."
effects = [{}, {}, { title = "Saint Nicholas’s Lamp" }, {}, {}, {}]

[tracks.bond_martin_itsas.chapters.s.choices.heart]
text = "Join the two pieces under the lamp, and say that when you’re both grown, you’ll tell him something."
hint = "The two ends of rope lie side by side, but your hand won’t join them. Your heart’s strand isn’t twisted tight enough yet—or you’ve already tied the same knot with someone else."
reply = "I put the two rope ends together and tied a joining knot. My fingers were too stiff with cold to obey, and it took two tries to pull it tight. “When we’re both grown,” I said, “there’s something I want to tell you. Not now.” Martin looked at the knot for a long time. The lamp swung in the wind, and his face went light, then dark, then light. “That thing,” he said. “I have one too.” He took hold of the knot, and of my hand with it. His hand was colder than mine, the palm all calluses, a fresh scab pressing into my knuckle. I didn’t pull away. He didn’t let go. “We’ll say it then,” he said. “Together.” We stood like that until the lamp oil had burned down a notch and the old night watchman came up with his oil can to refill it and coughed at us. Only then did Martin let go. He tucked the joined knot inside his coat, deep."
effects = [{}, {}, {}, {}, { title = "Saint Nicholas’s Lamp" }, {}, {}]

[tracks.bond_martin_itsas.chapters.s.choices.own]
text = "Bet him: whoever makes captain first stands the other a cask of cider."
reply = "“A cask?” Martin narrowed his eyes. “Whose cask?” “Yours.” “Then I’ll hoop the cask,” he said, “and you’ll buy the cider.” “Why me?” “Because you’ll lose.” I held out my hand and he slapped it so hard the lamp frame shook. His palm smelled of whale oil, the kind no amount of washing gets out. “You sail in spring, I sail in spring,” he said. “We’ll see whose ship flies its own flag first.” The old night watchman laughed behind us. “Two pups, not a drop of cider in sight, and already at it.” Martin ignored him, wiped his hand on his trouser leg, held it out again, and we shook on it a second time."

[tracks.reunion_martin_itsas]
name = "Martin Itsas: Old Marks on the Staves"

[tracks.reunion_martin_itsas.chapters.reunion]
title = "Old Marks on the Staves"
text = "In 1562 I came back to Bilbao. The Itsas cooperage had a new sign. New casks were stacked by the door and the shavings came up over your shoes. His father sat by the door in the sun, and the journeymen called Martin “Master.” He was getting ready for another run to Newfoundland. At the counter a young woman with an herb basket was wrapping him a small packet of herbs; she pushed it into his arms, nodded to me, and went out. Martin wiped his hands on his apron and led me to the very back of the shop. An old cask stood there, its staves gone dark, its hoops replaced twice. He turned it over. Cut into the bottom was a small slanting hook—every oil cask that made the ship that summer had one, and after six runs to Newfoundland this was the only one to come back. He rapped it with his knuckles. “Still sounds right.” Then he looked up at me. “Your piece of the knot—do you still have it?”"

[tracks.reunion_martin_itsas.chapters.reunion.default]
effects = [{ text = "You didn’t come. I waited on the quay for three ships. When the fourth came in, I didn’t go. The shop is mine now. My father’s hands shake and he can’t drive a hoop anymore, so he sits by the door every day and watches me do it. There are forty new casks stacked out front; next month they sail for Newfoundland, and I’m keeping the water again. I’m sending the shared knot with this fishing boat. I tied a piece of stave to it and cut this year into the wood so you’ll know it. Hang it somewhere on your ship—anywhere you like, just not where it’ll get soaked. There’s something I meant to tell you face to face. For years I dreamed of a field of ice in the fog, and I could never see how big it was. Last year, north of Newfoundland, the fog lifted once and I saw it clearly. It wasn’t as big as in the dream, or as white. It was dirty at the edges, the same color as whale oil that’s stood too long in the shop. Since I got back I hardly have that dream anymore. The water on your ship—count it yourself. Count until you’re sure, then sail. Don’t trust the shipowner. The shop door isn’t barred. Whatever year you come back, walk straight in. There’s a stool by the stove. —Martin" }, {}]

[tracks.reunion_martin_itsas.chapters.reunion.choices.friend]
text = "Promise him the next run to Newfoundland: you at the helm, him keeping the water."
reply = "When I’d finished, Martin turned and fished a length of fresh-twisted hemp out from under the counter. “Leave the old one be,” he said. “We’ll tie another.” He tied one half and I tied the other. Mine was still crooked. He glanced at it and didn’t make me redo it; he took his cooper’s knife, cut the year into a stave of the old cask right beside the slanting hook, and nailed the new knot up next to it. The next spring our ship went down the Nervión. I stood at the helm; he crouched in the hold rapping the casks one by one, and when he finished he started over, and only after the third round did he come up for a drink. In Newfoundland he hooped the staves we’d brought into oil casks, and every time he finished one he called the count up toward the helm. We came home from that run without losing a drop of fresh water. Martin broached a cask of cider on the quay and stood the whole waterfront a drink, took half a cup himself, and sat on a cask watching me arm-wrestle the dockhands. “Next run,” he said, “you’re still at the helm.”"
effects = [{}, {}, {}, { title = "Old Marks on the Staves" }]

[tracks.reunion_martin_itsas.chapters.reunion.choices.rival]
text = "Dig up the old bet: this season, whose casks fill with whale oil first?"
reply = "“I was waiting for you to say that.” Martin yanked off his apron and threw it on the counter. That season our two ships left the Nervión a few days apart and came into Red Bay a few days apart. Everyone at the whaling station knew the two ships from Bilbao were racing: my harpooner was in the boat before first light, and his cooper’s shed burned a lamp all night and turned out six casks before morning. Every time a ship filled a cask, it ran a little flag up the mast. When the accounts were settled in the autumn, he’d beaten me by half a cask. Back in Bilbao, I bought the cider, and we broached it in his shop. On his second cup he rapped the cask with his knuckles. “That half cask—that’s my hooping.” “That’s your harpooner’s luck.” “Luck gets hooped too.” He poured me another, full to the brim, and didn’t spill a drop."
effects = [{}, {}, {}, { title = "Old Marks on the Staves" }]

[tracks.reunion_martin_itsas.chapters.reunion.choices.love]
text = "Tell him you’re in no hurry to leave this time—you’d like to spend a winter in Bilbao."
hint = "The knot is in your coat, its broken end still a match for his. What went unsaid under the lamp back then still won’t join up today, here beside the old cask."
reply = "Martin’s hand stayed on the old cask and didn’t move for a long moment. “A cooperage is the warmest place in winter,” he said. “The stove never goes out all night.” That winter the Newfoundland ships all came home and thin ice formed along the edge of the Nervión. I spent the winter in his shop—splitting hoop withies with him by day, and by night sitting up with him by the stove, roasting chestnuts and listening to the wood crack in the firebox. One night it snowed. From the very back of a cupboard he brought out the whole knot—the one we had joined under the lamp that year. The hemp had gone yellow, but the knot was still tight. He hung it around my neck, and his hand stayed at my collar. “That thing I had to say,” he said. “I’ve been saving it six years.” He didn’t finish. He bent his head and kissed me. He smelled of shavings and stove fire, but his fingers were cold, as cold as they had been under the lamp. That night, sure enough, the stove never went out."
effects = [{}, {}, {}, { title = "Old Marks on the Staves" }]

[tracks.reunion_martin_itsas.chapters.reunion.variants.v1_promise]
text = "In 1562 I came back to Bilbao. The Itsas cooperage had a new sign. New casks were stacked by the door and the shavings came up over your shoes. His father sat by the door in the sun, and the journeymen called Martin “Master.” He was getting ready for another run to Newfoundland. At the counter a young woman with an herb basket was wrapping him a small packet of herbs; she pushed it into his arms, nodded to me, and went out. Martin wiped his hands on his apron and led me to the very back of the shop. An old cask stood there, its staves gone dark, its hoops replaced twice. He turned it over. Cut into the bottom was a small slanting hook—every oil cask that made the ship that summer had one, and after six runs to Newfoundland this was the only one to come back. He rapped it with his knuckles. “Still sounds right.” Then he looked up at me. “That knot on the breakwater—I climb up every spring and pull it tight. So when’s that year of yours coming?”"

[tracks.reunion_martin_itsas.chapters.reunion.variants.v2_romance]
text = "In 1562 I came back to Bilbao. The Itsas cooperage had a new sign. New casks were stacked by the door and the shavings came up over your shoes. His father sat by the door in the sun, and the journeymen called Martin “Master.” He was getting ready for another run to Newfoundland. At the counter a young woman with an herb basket was wrapping him a small packet of herbs; she pushed it into his arms, nodded to me, and went out. Martin wiped his hands on his apron and led me to the very back of the shop. An old cask stood there, its staves gone dark, its hoops replaced twice. He turned it over. Cut into the bottom was a small slanting hook—every oil cask that made the ship that summer had one, and after six runs to Newfoundland this was the only one to come back. He rapped it with his knuckles. “Still sounds right.” When he was done, his hand stayed on the cask. “That knot. I’ve kept it all this time.”"

[tracks.reunion_martin_itsas.chapters.reunion.variants.v3_knot_door]
text = "In 1562 I came back to Bilbao. The Itsas cooperage had a new sign. New casks were stacked by the door and the shavings came up over your shoes. The shared knot still hung from the doorframe, both halves tied by his hands, six years of sun and wind turning the hemp black. His father sat by the door in the sun, and the journeymen called Martin “Master.” He was getting ready for another run to Newfoundland. At the counter a young woman with an herb basket was wrapping him a small packet of herbs; she pushed it into his arms, nodded to me, and went out. Martin led me to the very back of the shop. An old cask stood there, staves gone dark, hoops replaced twice, a small slanting hook cut into the bottom—every oil cask that made the ship that summer had one, and this was the only one to come back. He rapped it with his knuckles. “Still sounds right.” Then he tipped his head toward the door. “That one up there. Nobody’s ever come to cut it.”"
