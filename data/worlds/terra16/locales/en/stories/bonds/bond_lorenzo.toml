[tracks.reunion_lorenzo.chapters.reunion.default]
effects = [{ text = "Noël, your ship didn’t put in at Malaga. People on the quay said the boats from Tarifa had changed course, and I knew I’d guessed right again: you never land where anyone is waiting for you. The war in the mountains isn’t over. The people brought down are shipped inland a boatload at a time, and I stand at the officials’ table listening to accents, one at a time, writing each one down. There was an old woman from Ugíjar who talked exactly like my grandmother. I found her daughter for her, on the fourth ship. She didn’t know how to thank me, so she pushed a handful of dried figs into my hand. I ate half and kept half, thinking that if you came, sharp tongue and all, you’d say they were too sweet. Of the two addresses I gave you, cross out the one in Fez. My uncle died two years ago, and the dye works has been sold. The Granada one still holds, only the copyist’s shop on the hill has closed; send letters to the interpreters’ office behind the cathedral. The horses at the marquis’s house I used to walk the long way around. Now I can touch their noses; somebody has to hold the escort officers’ horses. Not one person on this whole quay can read the marks I put on the list. Lorenzo. P.S. The curling line at the very bottom of the page: read it right to left. It’s your name." }, {}]

[tracks.reunion_lorenzo.chapters.reunion.choices.friend]
text = "Stay and help him read a whole ship’s worth of names to the families on shore"
reply = "I left the ship to my mate, dragged a crate over beside the officials’ table, and stood on it. Lorenzo read out the mountain names; when I couldn’t get my tongue around one, he said it into my ear first and I shouted it to the shore: who, from which village, on which ship, sailing where. When someone on shore answered, someone started crying; when no one did, Lorenzo drew another mark by the name and said we’d call it again tomorrow. We called until the sun dropped into the sea and we were both as hoarse as crows. The escort officer packed up his table, and Lorenzo was still crouched on the ground smoothing the lists flat, one by one. That night in a warehouse on the quay he borrowed my ink and wrote the first line of the old ballad on the back of a spoiled sheet, one line in Castilian, one in the other script, and nothing below. “When the war’s over,” he said, pushing it across to me, what was left of his voice cracking, “you write the next line.”"
effects = [{}, {}, {}, { title = "Down from the Mountains" }]

[tracks.reunion_lorenzo.chapters.reunion.choices.love]
text = "Don’t sail on: stay in Malaga and see the season through with him"
hint = "He hasn’t finished his list. Back then you left the back of that paper blank, and today, among all the accents on this quay, the words still can’t find a voice of their own."
reply = "I sent the ship back to Tarifa and stayed in Malaga. By day I carried tables for him, checked lists, and argued with the escort officers; I’m better at arguing than he is. At night we slept in a warehouse on the quay, on straw that smelled of salt fish. On the third night he took a paper from the pocket next to his skin, folded in four and once more, the creases worn nearly through: the one I had pressed into his palm under the orange tree at the marquis’s house that year. “We’re grown,” he said. “Can I open it now?” He lit a candle stub, unfolded the paper, and looked at it a long time. The crooked letters were the ballad’s next line: On the day that you were born, there were great signs in the sky. I had written one letter backward. He didn’t laugh. “Thirteen years,” he said, “and I never guessed once.” He took my hand, opened the palm, dipped a finger in the ink left over from the day’s lists, and wrote my name from right to left, one curling line, the tail flung out onto my wrist. When he was done, he bent his head and kissed the name."
effects = [{}, {}, {}, { title = "Down from the Mountains" }]
