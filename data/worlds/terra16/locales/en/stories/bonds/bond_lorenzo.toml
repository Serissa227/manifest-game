# C7：bond_lorenzo 的英文显示覆盖（按轨道、章节、选项与变体的 key 对应）；不复制玩法。

[tracks.bond_lorenzo]
name = "Lorenzo: An Accent He Could Not Place"

[tracks.bond_lorenzo.chapters.c1]
title = "An Accent He Could Not Place"
text = "In the courtyard of the marquis’s house the new pages stood in a row along the tiled bench, waiting for the steward to hand out duties. The tiles were green and white, and on a winter morning they were too cold for anyone to sit on. A dark-eyed boy worked his way down the line, leaning in to hear each of us talk. “Let me guess where you’re from.” He guessed, and he was right every time: Jerez, Carmona, a mill outside Córdoba. When the steward came over coughing, he named the steward’s home village too. “Lorenzo!” The steward hauled him off by the ear, and he was still laughing. Then it was my turn. I’d been dragged out of bed before dawn and was busy cursing the house rooster, which plainly belonged in a stewpot. Lorenzo cocked his head, listened, and frowned. “The vowels are Tarifa. But the way you say ‘mar’…” He stalled, and asked me to say “mar” again. “Don’t strain yourself,” I said. “I came from the castle gate. Age three, in a basket.” His mouth hung open; the joke he had ready never came. Someone had left an orange on the bench. He picked it up, turned it twice in his hand, and set it back on the tile."

[tracks.bond_lorenzo.chapters.c1.choices.ask_his_origin]
text = "Turn the question on him: and where are you from?"
reply = "“Me? The front pew at Mass,” Lorenzo said, grinning. “Ask the priest. He’s always complaining I shout my amens too loud.” The answer came too fast, and so did the grin, like a door kept ready: knock once and it swings open on an empty room. I knew that kind of fast. It was how I answered when people asked who my parents were."

[tracks.bond_lorenzo.chapters.c1.choices.bet_an_orange]
text = "Bet him an orange he can’t work out where I’m from within a month"
reply = "He guessed for a whole month. Cádiz, Ceuta, Gibraltar, Tangier; once he even tried Venice. Not one was right. On the last morning of the month there was a peeled orange beside my pillow, its segments laid out in a ring, and no note. I ate it. It was sour enough to make my eyes water."

[tracks.bond_lorenzo.chapters.c2]
title = "The Candle Stub"
text = "A midsummer night in Seville is like sleeping under the lid of a bread oven. I was usually the hardest person in the house to wake; that night, for once, I couldn’t sleep, and got up to find water at the well. On the way back I saw a thread of yellow light under the door of the storeroom where the pages kept their odds and ends. I pushed it open. Lorenzo sat cross-legged on a heap of sacks with a palm-sized book open on his knee, beside a candle stub no taller than a fingernail. At the sound of the door he snapped the book shut and tucked it inside his shirt. “My mother’s book of hours,” he said. “Couldn’t sleep. Thought I’d read a bit.” Nobody hides a book of hours. I kept that to myself. He was already grinning. “You can’t sleep either? Then let me do the steward snoring for you.” He puffed out his cheeks: first a saw, then a leaky bellows, then what sounded like someone stepping on a goose. It was so exact I laughed and knocked over a broom. Down the corridor the night watchman lifted his lamp and called out who was there, and the two of us blew out the stub together and sat in the dark, clutching our sides and trying not to laugh."

[tracks.bond_lorenzo.chapters.c2.choices.share_candles]
text = "Pretend I saw nothing, and the next day give him half my candle stubs"
hint = "He still can’t tell whether you’ll go to the steward. Hand him candles now and he’ll be too scared to light one for a week."
reply = "He took the bundle of stubs without a word, only weighed it in his palm. At Mass that day, when the steward’s eyes swept the pews for anyone dozing, Lorenzo shifted half a step forward and put himself squarely in front of me. That night I passed the storeroom again. The light under the door was on, and it stayed on longer than it used to."

[tracks.bond_lorenzo.chapters.c2.choices.ask_the_book]
text = "Ask him straight out what the book is; if he won’t say, let it go"
reply = "“A book of hours,” he said again, eyes on the candle, not on me. I said fine, a book of hours, and went yawning back to bed. At the door I heard a cat yowl behind me, then another, each more convincing than the last. The cats followed me all the way to my bunk, and I don’t remember when I fell asleep."

[tracks.bond_lorenzo.chapters.b1]
title = "The Thousand-and-First Proverb"
text = "Master Mal Lara was compiling a book of proverbs, a thousand and one of them, not one fewer. He had every page in the marquis’s house hand in a sheet of the sayings the old folks at home were always repeating. I gave him the one the Tarifa fishermen use to curse the weather; he glanced at it, said it was coarse, and kept it. Lorenzo’s sheet he read halfway through and slapped the table. “Now this is good old Castilian!” Every page in the room turned to look. Lorenzo kept his head down and said his grandmother used to say it. I ran the line over in my mouth and found my foot tapping along: three short, one long, then a trailing beat. When the old doctor from Ceuta recited Arabic proverbs to me, they had that same beat. Exactly the same. After class Lorenzo caught up with me under the orange tree, looked left and right, and dropped his voice. “You heard it, didn’t you?”"

[tracks.bond_lorenzo.chapters.b1.choices.copy_it_too]
text = "Copy the line onto my own sheet too, change two words, make it sound more local"
hint = "He still isn’t sure you won’t tell. He won’t let you anywhere near that line."
reply = "I copied out the grandmother’s saying, swapped two words, and gave the tail a Triana fishwife’s twist. Next day Master Mal Lara circled it on both sheets. “You see? Two households say it. Everyone in Seville knows this one.” From the far end of the corridor Lorenzo winked at me, once, twice, until the master asked whether he had sand in his eye."

[tracks.bond_lorenzo.chapters.b1.choices.ask_original]
text = "Ask him privately how the line really goes"
reply = "He checked all around once more, then leaned close and said it softly in the other language, slowly, setting each word down as if he were carrying a still-warm egg. Then he stepped back. “That’s how my grandmother said it.” This time he didn’t laugh. I said it back to him, and he corrected two of my sounds, and then one more."

[tracks.bond_lorenzo.chapters.b2]
title = "A Letter Across the Strait"
text = "Behind the potters’ kilns in Triana lived an old Morisca woman; Lorenzo had written out a few salt orders for her. This time she wanted a letter. Ten years ago her son had crossed the sea to Fez, and not a word had come back since. The letter was written. On the cover Lorenzo wrote the name once in Castilian letters, and once more beneath in that curling script. “Over there, this is all they read,” he said. “But over here, nobody who sees this will let it on a boat.” The city couriers refused it, and the shipmasters on the quay took one look at the cover and waved him off. Lorenzo cornered me behind the marquis’s stables, rubbing the edge of the letter the whole time until the paper had gone fuzzy. “You’re from Tarifa,” he said. “You know the strait boats.” He wasn’t smiling. I had known him more than a year, and this was the first time I’d seen him ask anyone for anything."

[tracks.bond_lorenzo.chapters.b2.choices.through_tarifa]
text = "Have an old Tarifa fisherman carry it across, and the doctor in Ceuta send it on to Fez"
hint = "He grips the letter tighter. A letter in that script is one he still doesn’t dare hand you; it could drag you down with him."
reply = "The fisherman sewed the letter into the lining of a fish basket, and the old doctor in Ceuta passed it to a muleteer bound for Fez. Three months later an answer came, one line long: he was alive, selling jars on the potters’ street in Fez. Lorenzo read it aloud to the old woman; at the word “alive” she covered her face with her apron. When he finished he said he had to wash his hands at the well, and went behind the orange tree in the courtyard. It was a long time before he came out, red-eyed. Smoke, he said."

[tracks.bond_lorenzo.chapters.b2.choices.clear_address]
text = "Make the Castilian letters on the cover clearer, and let him find a carrier himself"
reply = "I traced the Castilian line thick and straight, plain enough for the grooms to read. Lorenzo carried it around the quays for a month and finally gave it to a soldier rotating out to Ceuta, along with half a month’s wages. Whether it ever crossed, we never found out. Every time the old woman met him at the Triana bridge she asked, and every time he told her, “Soon.”"

[tracks.bond_lorenzo.chapters.a1]
title = "A Name in Those Letters"
text = "In the storeroom it was still candle stubs. Not that first stub, of course, but he always picked the shortest, saying the long ones were for the steward’s accounts. That night Lorenzo didn’t tuck the book away. He opened it on the sacks and pushed it toward me. The page was full of curling letters crawling from right to left, like worm tracks on the sand when the tide goes out. “I’ll read it to you.” His finger traveled right to left, and what came out was something I understood: Castilian, with a little of the Granada mountains in it, about a man taking bread to his neighbors during Ramadan. “My mother’s grandmother wrote like this,” he said. “The letters are from over there. The words are from here.” He dipped the pen to teach me to write my own name in these letters, closed his hand over mine, and began the first stroke from the right. At the second letter his hand stopped. I looked up. He was looking at me, not the page. “Look at the letters,” I said, “not at me.” He coughed, ducked his head, and went over that letter again."

[tracks.bond_lorenzo.chapters.a1.choices.let_him_guide]
text = "Let him keep his hand on mine and finish my name stroke by stroke"
hint = "His hand hovers over the pen, then draws back. You aren’t close enough yet to sit shoulder to shoulder like this."
reply = "The sounds of “Noël” came out as one curling line with a long tail flung off the end. He said it looked like a wave in the strait, rolling out from Tarifa and breaking on the far shore. When it was done he didn’t let go right away, and I didn’t pull back. The candle stub guttered out with a little puff, and the room went dark all at once. The flint was right by my hand. I didn’t reach for it."

[tracks.bond_lorenzo.chapters.a1.choices.keep_the_book]
text = "Promise to keep the book for him, at the very bottom of my sword case"
hint = "He draws the book back toward himself. He can’t let go of it yet; you two aren’t there."
reply = "He held it by the spine and hesitated so long that wax dripped onto the sacks. Then he handed it over. “If anyone finds it, say you picked it up on the road.” I said a knight doesn’t lie. He called me an idiot, and then said, “Then don’t let anyone find it.” It went at the bottom of the sword case, under the oilcloth I use on the blade. It fit exactly."

[tracks.bond_lorenzo.chapters.a1.choices.ask_his_mother]
text = "Ask him how his mother taught him these letters"
reply = "“By the stove,” he said. “She wrote with a stick of charcoal on the bottom of a pot. Write one, say one, then wipe it off with a rag. My mother said it doesn’t matter if the letters get wiped away, as long as you remember them.” He lifted the little book to his nose and sniffed it, then held it out for me to sniff. “That’s why every letter I know smells of smoke.”"

[tracks.bond_lorenzo.chapters.a2]
title = "Only the First Line"
text = "Lorenzo pushed a poem sheet into my hands, folded into a neat square. Opened out, it held one line of an old frontier ballad: “Abenámar, Abenámar, Moor of the Moorish lands.” One line in Castilian letters, one below in the curling script, and then a wide stretch of clean paper. “You write the next line,” he said. “Once it’s answered, the song is finished.” He said it lightly, as if telling me what was for supper. But Master Mal Lara had taught this ballad in class: a Castilian king rides up to Granada, points at the shining towers on the hill, and asks a Moor whose they are. The Moor names them one by one. The king says, Granada, I would marry you. The city answers: I am married already, and the Moor who keeps me treats me well. I held the sheet. His thumb had pressed a small dent into one corner. The two lines were written the same size; the Castilian didn’t crowd the other script, and the other script didn’t crowd the Castilian."

[tracks.bond_lorenzo.chapters.a2.choices.keep_the_sheet]
text = "Accept the sheet: I’ll answer when I’m ready, and he may not give me a single hint"
hint = "This sheet weighs too much. You aren’t close enough yet for him to put it in your hands."
reply = "“You’ll never answer it as long as you live,” he said. “Then I’ll take as long as I live,” I said. He blinked, plucked the sheet back out of my fingers, rolled it into a thin scroll, tied it with red thread, and wedged it into a gap in my sword case. “There,” he said, patting the case. “Wherever you go now, you’ll have to carry it.”"
effects = [{}, {}, {}, { title = "Only the First Line" }]

[tracks.bond_lorenzo.chapters.a2.choices.hum_the_tune]
text = "Accept the sheet, and hum him the tune of the ballad, softly"
hint = "The tune gets as far as your throat and stops. This sheet weighs too much; you two haven’t come far enough to take it."
reply = "I had only heard the fishermen sing it twice, on the walls at Tarifa, and I lost the tune the moment I opened my mouth. Lorenzo hummed along to drag it back and wandered even farther off; the Moors of Granada wouldn’t have known it. When we stopped, he rested his forehead on my shoulder, stayed there a while, and spoke into my sleeve. “Don’t tell anyone I cried.” I said I hadn’t seen a thing. It was true. His face was buried in my shoulder."
effects = [{}, {}, {}, { title = "Only the First Line" }, {}]

[tracks.bond_lorenzo.chapters.a2.choices.answer_now]
text = "Answer the line on the spot, however it comes out"
reply = "I opened my mouth and answered: “Moor, oh Moor, your donkey’s run off.” Lorenzo laughed so hard he rolled off the sacks, clutching his stomach, and said it was the worst second line he had ever heard, bad enough to lose Granada all over again. When he was done laughing he climbed back up, dipped the pen, and copied my donkey into the clean space stroke by stroke, one line in Castilian, one in the other script."

[tracks.bond_lorenzo.chapters.s]
title = "Addresses on Both Shores"
text = "At the end of that year I was going home to Tarifa, to be given my sword at the castle in spring. Lorenzo had to stay on at the marquis’s house. The marquis was viceroy in Barcelona now, and he hadn’t taken a single page with him. “And after?” I asked. “Maybe Granada, as an interpreter. Maybe across the sea to Fez,” he said. “Depends which side throws me out first.” He took a sheet from inside his shirt with two addresses on it: one on this side of the sea, a copyist’s shop on the hillside in Granada; one on the other, a dye works in Fez that belonged to a distant uncle. “Write to either,” he said, handing it to me. “One of them will get it.” The orange tree in the courtyard had dropped its fruit all over the ground, and the overripe sweetness went straight up your nose. The carriage was already waiting at the gate. He walked me through the fallen oranges to the archway, and the whole way he didn’t do a single accent. It was just his own voice, with a little of the mountains in it."

[tracks.bond_lorenzo.chapters.s.choices.promise]
text = "Agree: any letter of his that must cross the strait comes to me, and my ship carries it"
hint = "You hold the paper with the two addresses, but you can’t offer to carry his letters across. You aren’t close enough yet for him to trust you with both shores—or you’ve already promised someone else a crossing like that."
reply = "“Your ship?” He laughed. “You don’t even have a ship.” “I will,” I said. “A knight’s word is good. The ship will come.” He stopped laughing. He spread the sheet on the tiles of the bench and, by the lamp in the archway, copied both addresses out again, neater than any proverb he ever handed Master Mal Lara. One copy he pushed into my hand. For the other he tore open his left cuff, folded the paper into a narrow strip, and sewed it in, the stitches crooked. He bit off the thread and spat it on the ground. “Now I’ve got someone on both shores.” I climbed into the carriage. As the wheels rolled over the rotten oranges in the archway and pulled away, his right hand was still pressed over his left cuff, as if over a letter he hadn’t sent yet."
effects = [{}, {}, { title = "Addresses on Both Shores" }, {}, {}, {}]

[tracks.bond_lorenzo.chapters.s.choices.heart]
text = "Write the ballad’s next line on the back, fold it, and tell him not to open it until we meet again grown"
hint = "You turn the paper over. The back is blank, but the answering line won’t go onto it. Your heart hasn’t come that far yet—or you’ve already written words like these to someone else."
reply = "I read the two addresses over three times until I had them by heart, then borrowed his pen and wrote one line on the back of the sheet, in the script he had taught me, right to left and crooked; one letter I wasn’t sure of, I went over twice. Then I folded the sheet in four, and once more, and pressed it into his palm. “The ballad’s next line,” I said. “When we’re both grown and see each other again, then you can open it.” Lorenzo looked at the paper, then at me. I waited for him to guess. He guessed at everything: which line I’d written, whether I’d got it right, whether I was making fun of him. He didn’t guess at all. He held the paper against his chest for a long moment before he tucked it inside his shirt, next to his skin. The driver called from the gate. At the archway he suddenly hugged me, fast, and let go at once, darting a glance toward the arcade as if afraid someone had seen. “Go on,” he said. “The Tarifa roosters are waiting to get you out of bed.”"
effects = [{}, {}, {}, {}, { title = "Addresses on Both Shores" }, {}, {}]

[tracks.bond_lorenzo.chapters.s.choices.own]
text = "Agree: I train with the sword, he trains his hand, and when we meet we each test the other"
reply = "“I’ll test you on those letters,” Lorenzo said. “Right to left, and not one backward. What will you test me on?” “Riding.” He went white. Of all the pages in the house he was the only one who walked the long way around a horse; last year a mule had chased him half the length of a street. “Something else,” he said. “Anything else.” “No.” For the few dozen steps from the courtyard to the archway he haggled, from riding a horse down to riding a mule, and from riding a mule down to touching a horse’s nose. I laughed the whole way and was still laughing in the carriage, and he hung on the window shouting, “The nose! Just the nose!” Before the carriage turned the corner I looked back. He was still standing in the archway, one hand stretched out, stroking the air as if there were an invisible horse’s nose in front of him."

[tracks.reunion_lorenzo]
name = "Lorenzo: Down from the Mountains"

[tracks.reunion_lorenzo.chapters.reunion]
title = "Down from the Mountains"
text = "In 1569 the war in the Alpujarras still wasn’t over, and the quays of Malaga were already packed with Moriscos marched down out of the mountains. The men’s wrists were tied along one long rope; the women sat on their bundles holding children, waiting to be loaded batch by batch and shipped into the interior of Castile. Where to, no one told them. Between the crowd and the officials’ table stood an interpreter in an old coat, its elbows rubbed shiny. He bent to hear an old man out, then turned to hear a woman crying, listening accent by accent: this one’s from Órgiva, that one’s from Ugíjar, this family’s son is on a different rope. On the officials’ list he drew a small mark beside one name, and the same mark beside another. He straightened to wipe the sweat off his face, saw me, and froze. “No need to guess this time,” Lorenzo said. “Tarifa vowels. I could hear them from halfway down the quay.” The list in his hand had gone soft with sweat, and the little marks ran on one after another, like a line of writing only he could read."

[tracks.reunion_lorenzo.chapters.reunion.variants.diego_unveiled]
text = "In 1569 the war in the Alpujarras still wasn’t over, and the quays of Malaga were packed with Moriscos marched down out of the mountains, wrists tied along long ropes, waiting to be shipped into the interior of Castile. Between the crowd and the officials’ table stood an interpreter in an old coat, listening accent by accent, drawing a small mark beside one name on the list and the same mark beside another. At the far end of the quay a Castilian officer was arguing with the escort officer, and in the end he had a whole family untied from the rope. The interpreter glanced that way, straightened to wipe his face, and saw me. “No need to guess this time,” Lorenzo said. He looked me up and down and smiled. “Everyone at the marquis’s house guessed back then, and every one of them guessed wrong. I never did. The way you say ‘I’ doesn’t sound like anyone else.” He tipped his head toward the far end of the quay, and his voice went quiet. “He’s been standing between me and them all morning.”"

[tracks.reunion_lorenzo.chapters.reunion.variants.unveiled]
text = "In 1569 the war in the Alpujarras still wasn’t over, and the quays of Malaga were packed with Moriscos marched down out of the mountains. The men’s wrists were tied along one long rope; the women sat on their bundles holding children, waiting to be loaded batch by batch and shipped into the interior of Castile. Between the crowd and the officials’ table stood an interpreter in an old coat, listening accent by accent: this one’s from Órgiva, that one’s from Ugíjar, this family’s son is on a different rope. On the list he drew a small mark beside one name, and the same mark beside another. He straightened to wipe the sweat off his face and saw me. “No need to guess this time,” Lorenzo said. He looked me up and down and smiled. “Everyone at the marquis’s house guessed back then, and every one of them guessed wrong. I never did. The way you say ‘I’ doesn’t sound like anyone else.” The list in his hand had gone soft with sweat, and the little marks ran on one after another, like a line of writing only he could read."

