# C7 重写（2026-10-12，Claude Opus）：stories/bonds/bond_isabel_soto.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 的 keep_sketch 第 4 个、witness_it 第 5 个效果是 memory；
# s 的 promise 与 heart 第 6 个、own 第 4 个效果是 memory；重逢两个选项的第 4 个效果是 memory；重逢 default 的第 1 个效果是 letter。
# 诺埃尔不用 he/she/him/her/Sir/Lady/Miss/Mister；揭开后的那一句只在 variants.unveiled 里。

[tracks.bond_isabel_soto]
name = "Isabel: Who Drew This?"

[tracks.bond_isabel_soto.chapters.c1]
title = "No Name on the Chart"
text = "Under the arcade of the Casa de la Contratación, Isabel slapped a chart down on the stone balustrade and weighed its corners with whatever was to hand, one of them with her own inkpot. “Who drew this? It’s wrong. Find it.” It showed the coast from Cape St. Vincent to the Strait of Gibraltar—headlands, sandbars, river mouths, in lines as fine as hair. I went over it west to east, then east to west, checked every tiny sounding, and found nothing. Clerks went by with their files under their arms; one of them turned to look at me twice, and I pulled my hat brim lower. “Can’t find it?” She tapped the bottom right corner with a fingernail. That was where the maker’s name belonged. There was nothing there but a smudge of ink. “That’s the mistake.” “You drew it?” “I drew it. Grandfather gives it to the candidates to trace, and then it hangs in the examination hall, and nobody asks whose hand it was.” She rolled the chart up tight and tied it with twine. “Girls don’t get licenses. Sign one and they’d scrape the name off. So I keep a copy of every one. Someday I’ll lay them all out, one by one.” As she knotted the twine, she left another black thumbprint on the roll."

[tracks.bond_isabel_soto.chapters.c1.choices.sign_it]
text = "Talk her into signing her own name on the copy she keeps"
reply = "“And what good would that do? They don’t hang that one in the hall.” She glared at me and marched off with the roll under her arm. First thing next morning she caught me outside the lecture room and shook out one corner: in the bottom right was a new line, Isabel de Soto, drawn more carefully than any coastline on the sheet. “I practiced half the night,” she said. “Ruined three sheets. Don’t laugh.”"

[tracks.bond_isabel_soto.chapters.c1.choices.find_real_error]
text = "Refuse to give up until you find a real error in her coastline"
reply = "I borrowed the chart and spent the afternoon bent over the balustrade while my shadow crept from one pillar to the next. Just before sunset I put my finger on the mouth of the Guadiana. “This is too narrow.” She didn’t believe me. She snatched the chart and ran home to her grandfather’s study, and came back red in the face from running. “I copied it wrong. Grandfather’s old chart has it narrow, and I traced it without measuring.” She took out her pen and made a note beside the river mouth without looking up. “Your eyes aren’t bad.”"

[tracks.bond_isabel_soto.chapters.c2]
title = "The Ramps of the Bell Tower"
text = "One summer night someone threw pebbles at my window. I had only just fallen asleep. When I leaned out, Isabel was standing in the street with a lump under her cloak. “Grandfather’s astrolabe.” She lifted a corner, and the brass flashed in the moonlight. “Tonight we take that red star in the south, and it goes back before dawn. Come on.” Nobody watched the cathedral tower at night, and the side door stood ajar. Inside there were no stairs, only ramp after ramp, wide enough to ride a horse up, one turn and then another. She went ahead with a little oil lamp, climbing fast. Somewhere past the tenth ramp the wick gave a crackle. “There isn’t much oil,” she said. “Did you know that when we set out?” “When we set out I was in a hurry.” She didn’t turn around. “The bells are still a long way up. Halfway there’s a window facing south. You can see the star from it. We don’t need the top.” The flame kept shrinking. It lit the bricks underfoot, but not the next turn."

[tracks.bond_isabel_soto.chapters.c2.choices.count_ramps]
text = "Count the ramps as you climb and work out how far the lamp will last"
hint = "She doesn’t even turn around. “Just climb. Leave the sums to me.” A stolen astrolabe and a failing lamp—she isn’t handing either of those to you yet."
reply = "Each ramp was about forty paces, and the wick sank a notch with every one. I said it would last seven more. She said I was making it up. We came around the seventh turn and there was the window, and the lamp went out right on cue. She hung the astrolabe against the window frame and read the scale by starlight, called out the figure to me, and added, “You’re better at sums than at stars.” Going down it was pitch black, and she held on to my sleeve the whole way, hard. “In case I drop the astrolabe,” she said. “Don’t read anything into it.”"

[tracks.bond_isabel_soto.chapters.c2.choices.hold_lamp]
text = "Cup the dying lamp in your hands and let her take the sight first"
reply = "I shielded the flame with my palm, and it shivered there. She let the astrolabe hang, squinted along the alidade, and muttered the degrees under her breath. On the last figure the lamp went out. “Got it,” she said. “Next time we bring two.” All the way down in the dark she listed my mistakes: I held the lamp crooked, my hand shook, my shadow covered half her scale. At the side door she pulled her cloak tight and looked back. “I’ll still ask you next time.”"

[tracks.bond_isabel_soto.chapters.b1]
title = "The Line She Won’t Erase"
text = "In the autumn the master of the cosmography lectures had each of us take a latitude and hand it in for comparison. I took Seville from the foot of the Torre del Oro by the river, and my figure came out several minutes higher than the one on her chart. I went to find her with it. She spread her chart on the steps in the back courtyard of the Casa, heard me out, and instead of arguing handed me her pen. “What time did you take it? Where were you standing? Sun or star? Whose cross-staff was it? Write it all down.” “Why write all that? Take it again and we’ll know.” “Take it again and whatever’s wrong is still wrong.” She set the pen down on the step. “If all you want is a winner, go fence.” So I wrote it out, line by line. By the third line she was chewing a fingernail and leaning over to read. We took it again three days later at noon, each with a cross-staff, standing on the same stone. When the figures came in, my transom had worked loose, and her chart had been worked from an old table with one line of declinations miscopied. On her chart that spot now carries two fine lines, less than a hair apart."

[tracks.bond_isabel_soto.chapters.b1.choices.both_lines]
text = "Keep both lines on the chart and give each its own note"
reply = "Beside her line she wrote: declination table, line twelve, miscopied; corrected. Beside mine I wrote: cross-staff transom loose; tightened. She took it to look and tapped my writing with her pen. “You left a letter out of ‘tightened.’” I said the pen slipped. She wouldn’t let me fix it; the word stayed short a letter. “Whoever gets this chart someday,” she said, blowing the ink dry, “will know two people had a fight right here.”"

[tracks.bond_isabel_soto.chapters.b1.choices.concede_first]
text = "Own up to your half first: you never tightened the transom"
reply = "The moment I said it, her pen stopped in midair, as if she hadn’t expected it. After a while she owned up too, quickly, all in one breath: line twelve of the declination table, she’d copied it wrong, she’d been careless. Then she added, “I spotted that ages ago. I was waiting for you to say yours first.” “Then why didn’t you say so?” “If I went first, I’d be the one who won.” She rolled up the chart and rapped the back of my hand with the pen."

[tracks.bond_isabel_soto.chapters.b2]
title = "The Dented Alidade"
text = "Early one spring morning Isabel was waiting for me outside the lecture room with shadows under her eyes. She pushed a cloth bundle into my arms and wouldn’t touch it again. I untied it. It was her grandfather’s astrolabe. One end of the alidade was dented in, as if something had taken a bite out of it. “I went up the tower again last night,” she said. “Coming down, my foot slipped. I fell with it in my arms, and it hit the ground first.” She pushed up her sleeve: her elbow was scraped raw, and she didn’t even glance at it. “Grandfather needs it tomorrow. There’s a new batch of pilots in the examination hall, and he means to take the noon sun with it in front of them.” Her face was frighteningly white. I thought she was going to cry. She didn’t. She sniffed once and asked, “Do you know anyone who can mend brass? It has to be someone with a steady hand. The scale can’t move by a single minute.”"

[tracks.bond_isabel_soto.chapters.b2.choices.fix_it]
text = "Take her across the river that night to an old brass mender in Triana"
hint = "She snatches the bundle back. “I’ll manage.” Something like this, she’d still rather carry alone."
reply = "In the Triana boatyards there was an old man who mended compasses and brass lamps; half his teeth were gone and he had even fewer words. He set the astrolabe on his anvil and tapped at it with a wooden mallet, stroke by stroke, the whole night through. Near dawn the alidade was straight. He had Isabel check it against the scale, and it was true to the minute. She emptied her purse onto the anvil, and he took half. She didn’t say a word on the walk back. Only at her own door did she turn around. “This stays between you and me. Grandfather will never hear it from me, not even in my sleep.”"

[tracks.bond_isabel_soto.chapters.b2.choices.confess_grandpa]
text = "Go home with her and own up to her grandfather"
reply = "The old examiner sat by the window and turned the astrolabe over and over, then sighted it on the rooftops outside. “Is the scale off?” We said it wasn’t. “Good, then.” He put the astrolabe down and looked at Isabel. “And you—did you get hurt?” Isabel stood frozen, and the next moment she was crying and couldn’t stop. Outside, she wiped her face clean. “He’s never asked me if I got hurt. All he ever asks is whether the chart is right.”"

[tracks.bond_isabel_soto.chapters.a1]
title = "The Star Up There"
text = "On the first clear night of spring Isabel came to my window. No pebbles this time: she knocked three times and waited for me to open it. “I’m going up the tower tonight. Are you coming?” She had a lamp in each hand. “If not, that’s fine. I’ll go by myself.” This time she had asked first. I said I’d come. She handed me her drawing board and carried the lamps herself. It was the same south window. She pinned the paper to the board, had me hold it, and copied the spring sky from the window: one star, a line, another star. At the fourth star she stopped, her pen hovering over the paper. “Why’d you stop?” “I’m waiting for you,” she said. “Find the next one first and tell me where it is. If I go too fast you can’t keep up.” I leaned out to look. When I found it and turned back, she wasn’t looking at the stars. She was looking at me. I asked what she was staring at; the stars were outside. She dropped her eyes to the paper, and the pen came down, and that line went a little crooked."

[tracks.bond_isabel_soto.chapters.a1.choices.read_star]
text = "Read off each star’s altitude from the astrolabe without a single slip"
reply = "I called a figure for each star. When I got to the last one she put her pen down. “You haven’t made one mistake tonight. I don’t know what to do with myself.” “So pick something.” She actually gave it some thought, and found one. “You’re standing too close. Your shadow’s on my paper.” I stepped back half a pace. Then she said, “You don’t have to go that far.”"

[tracks.bond_isabel_soto.chapters.a1.choices.hold_board]
text = "Hold the board steady until she has drawn the very last star"
hint = "Hold the board right at her side now and she’ll only complain you’re blocking her light and take it back to hold herself."
reply = "The last star went down in the corner of the sheet. I started to lower the board and she put her hand on it. “Hold it a bit longer. The ink’s still wet.” So we stood at the window. Below us were the roofs of Seville, one after another, and a few ship lanterns moving on the river. Wind came in through the window and blew her hair across the board, and she didn’t brush it away. “I’ve drawn the stars in this window a hundred times,” she said. “This is the best one.” The ink had long since dried, and she still didn’t let me put it down."

[tracks.bond_isabel_soto.chapters.a2]
title = "Your Name Is More Useful Than Mine"
text = "That summer the Casa was collecting copies for the new royal pattern chart, and any examiner’s student could hand one in. I went to the Casa to copy the star tables for the lectures, and the clerk chatted while he hunted them out. “That chart of yours was good work. The Andalusian stretch—even the chief pilot nodded at it.” I had never handed in a chart. I went to find Isabel. She was sharpening a pen on the back courtyard steps, and when she saw my face she knew I’d heard. She didn’t get up. “I signed it,” she said. “With my name on it they wouldn’t even unroll it. With yours, it went up on the wall.” She spun the sharpened pen once around her finger. “Your name’s more use than mine, anyway.” I waited for her to say she was sorry. She didn’t. She took a small paper folded in four from inside her bodice and pressed it into my hand: a little star chart of the spring sky in the tower window, and in the bottom right corner a line in her own hand, her own name, signed neat and square. “This one’s mine,” she said. “Nobody gets to take it.”"

[tracks.bond_isabel_soto.chapters.a2.choices.keep_sketch]
text = "Keep the little star chart and say nothing about the signature"
hint = "The star chart stays inside her coat. You aren’t close enough yet for her to hand you her own name."
reply = "I folded the little chart and tucked it inside my jacket. She stared at me, waiting, until she ran out of patience. “Why aren’t you yelling at me?” “What good would yelling do?” I said. “I’m waiting for you to come and take it back yourself.” She stabbed her penknife into the step; the point caught in a crack in the brick and hummed. “I will,” she said. “Someday I’ll take back the name and the chart together. And when I do, don’t you pretend you don’t know me.”"
effects = [{}, {}, {}, { title = "Your Name Is More Useful Than Mine" }]

[tracks.bond_isabel_soto.chapters.a2.choices.witness_it]
text = "Keep the star chart, and promise to bear witness when she claims her name"
hint = "Offer to stand witness for her now and she’ll take it for pity and put the chart away."
reply = "She looked at me for so long that the penknife slid out of her hand. “What is wrong with you?” she said. “I took your name, and you want to stand witness for me?” I said yes. She pulled my hand over, palm up, and with the pen she had just sharpened drew a star in the middle of it—five points, one stroke. “A deposit,” she said. “Don’t you dare wash it off.” The star stayed on my palm for three days."
effects = [{}, {}, {}, {}, { title = "Your Name Is More Useful Than Mine" }]

[tracks.bond_isabel_soto.chapters.a2.choices.go_protest]
text = "March straight to the Casa and demand the clerk put her name back"
reply = "The clerk heard me out and laughed so hard he knocked his blotting sand all over the desk. “An examiner’s granddaughter? Who’d dare hang a little girl’s chart in the examination hall?” I hadn’t even left the building before Isabel heard about it. She didn’t speak to me for three days and sat as far from me as the lecture room allowed. On the fourth day she blocked the doorway. “After the scene you made, I’ll never get another chart through. Everyone knows whose they are now.” She poked my forehead with the end of her pen. “Your heart’s in the right place. Your head isn’t.”"

[tracks.bond_isabel_soto.chapters.s]
title = "Your Ship, My Charts"
text = "December on the quay was cold enough to make you hunch your shoulders. The ship lay by the bank of the Guadalquivir; it would go downriver to Sanlúcar, and in spring I’d sail west. Isabel came without a chart, both hands buried in her cloak. She stood in front of me and didn’t look at my face; she looked at the brim of my hat. “Grandfather says the examiners need someone to copy charts,” she said. “Starting next year I’ll draw in that room at the back of the Casa. Still no license. Still no name.” “And you said yes?” “I said yes. That room has the newest coastlines in all of Spain, and none of them are allowed out the door. If I don’t go in, who’ll look at them for me?” She sniffed; the tip of her nose was red with cold. “You’re going west, and nobody’s drawn those coasts right yet. Whatever you see, write it down and send it to me. If you get it wrong, I’ll catch it.” Someone on deck called out to open the hold. Her hand moved inside her cloak, as if it were holding on to something."

[tracks.bond_isabel_soto.chapters.s.choices.promise]
text = "Promise her that every course your ships sail, she’ll be the one to draw"
hint = "A promise like that—she doesn’t yet count you as someone who could carry it. Or else you’ve already given your one lifelong promise to someone else."
reply = "“Then you have to come back alive to collect them.” She said it fast, as if she’d had it ready. She pulled a roll of paper from her cloak and pushed it into my arms. “Cape St. Vincent to the Canaries. I drew it. Use this for now, and if it’s wrong, that’s on me.” I asked what happened if it was wrong. “If it’s wrong, you come back and yell at me, I fix it, and the next one’s free.” A sailor on the gangplank called again. She stepped back two paces, stood by a bollard, and buried her hands in her cloak again. When we pulled away from the bank I looked back. She was already crouched by the bollard with a sheet on her knee, drawing this stretch of the river. In spring, off the Canaries, I turned the roll over and found a line on the back that she must have added before she left home: “South of twenty-eight degrees, don’t trust the old charts.”"
effects = [{}, {}, {}, {}, {}, { title = "Your Ship, My Charts" }, {}]

[tracks.bond_isabel_soto.chapters.s.choices.heart]
text = "Take the lead stylus she holds out, and give her your astrolabe pendant"
hint = "Her hand tightens and loosens inside her cloak, and in the end it stays there. She can’t take that step yet—or else you’ve already given your one lifelong promise to someone else."
reply = "She drew her hand out of her cloak. In it was a lead stylus, the holder worn shiny—the one she used for her guidelines and wouldn’t lend to anyone in the lecture room. She pushed it into my hand and turned her head toward the river. “Your ship, my charts.” Then she shut her mouth, her ears as red as if the cold had done it. I took off the astrolabe pendant around my neck, no bigger than a fingernail, its scale cut for show, its rete fixed in place. I set it in her palm. She closed her hand on it and on two of my fingers along with it, and held on a good while before she let go. “Don’t lose my stylus,” she said. “It’s my best one.” “And how does the chart-maker manage without one?” “I’ve got a worse one.” She wound the pendant’s cord around her wrist, three times. “Everything else can wait until you come back. If I’ve forgotten by then, remind me.”"
effects = [{}, {}, {}, {}, {}, { title = "Your Ship, My Charts" }, {}]

[tracks.bond_isabel_soto.chapters.s.choices.own]
text = "Each to their own: her charts, your ship, and nobody signs for anybody"
reply = "“Then it’s settled.” She drew her hand out of her cloak. It held a roll of paper, and she shook it open: her copy of the chart that went to the Casa, my name in the bottom right corner in her handwriting. Right in front of me she struck the name out stroke by stroke until it was one black bar, and underneath wrote: Isabel de Soto. The wind kept flipping the corner, and she pinned it with her elbow until she was done. “What’s yours is yours.” She held it up for me to see, just once, then rolled it up and put it back in her cloak. “I’m keeping this one. The day the Casa can hang that name, I’ll bring it out.” “And if they never can?” “Then I’ll hang it in my own cabin.” She stepped back and jerked her chin at the sailor on the gangplank. “Go on. They’re waiting on you to open the hold.”"
effects = [{}, {}, {}, { title = "Your Ship, My Charts" }, {}]

[tracks.reunion_isabel_soto]
name = "Isabel: The Unnamed Hand"

[tracks.reunion_isabel_soto.chapters.reunion]
title = "The Unnamed Hand"
text = "Eight years later my ship came up the Guadalquivir again. The clerks at the Casa had changed, and so had the pilots, but everyone agreed the best charts on the examination hall walls all came from the same hand. Nobody knew whose, so they called it “the unnamed hand.” I found Isabel in the room at the back of the Casa. It smelled of ink and size. She sat at the end of a long table, her fingers still black, blacker than they used to be. Two charts lay side by side in front of her: the Casa’s master copy, my name in the bottom right corner, and her own original, its edges worn soft, her name in the bottom right corner. Not one line of coast differed between them. “This is the ninth,” she said without looking up, laying a rule along the edges. “I’ve already got the first eight back. The clerk says I need a witness to claim it.” Only then did she look up and put down her pen. “This one has you written on it,” she said. “Are you going to stand witness this time?”"

[tracks.reunion_isabel_soto.chapters.reunion.default]
effects = [{ text = "Noël—your ship came and went. I heard about it from a clerk in the back room and ran down to the quay, and all I saw was a sail at the river mouth. Business first. The ninth chart is mine again. I didn’t wait for you to bear witness; I found three old pilots and had them check my original against the coast. It took them a month, and not one line was out. The clerk had nothing left to say and added my name to the master copy. He wrote it too small, so I made him write it again. These days fewer people at the Casa call me “the unnamed hand” and more of them call me “that fault-finding Soto girl.” I like the second one better. With this letter comes a sailing chart, the Canaries west to Hispaniola, winds and soundings marked, checked line by line against a dozen pilots’ logs. Who drew it? I did. And this time the name on it is mine—look at the bottom right corner. If you find anything wrong when you use it, write and I’ll fix it. If you notice and don’t write, that’s worse. Isabel de Soto" }, {}]

[tracks.reunion_isabel_soto.chapters.reunion.variants.unveiled]
text = "Eight years later my ship came up the Guadalquivir again. Everyone agreed the best charts on the examination hall walls came from the same hand, and since nobody knew whose, they called it “the unnamed hand.” I found Isabel in the room at the back of the Casa. It smelled of ink and size, and her fingers were still black. Two charts lay side by side: the Casa’s master copy with my name in the corner, and her original with hers. Not one line of coast differed between them. “This is the ninth,” she said, laying a rule along the edges. “I’ve already got the first eight back. The clerk says I need a witness to claim it.” She looked up, saw me, and the rule stopped. The news about me had reached Seville long before I did. She looked me over from hat brim to chin and back again, for a long time. “All these years drawing coastlines,” she said, “and I never got a proper look at you.” She put down her pen. “Never mind. The coast comes first. This one has you written on it—are you going to stand witness this time?”"

[tracks.reunion_isabel_soto.chapters.reunion.choices.testify]
text = "Go with her to the Casa and tell the clerk to his face the chart is hers"
reply = "The clerk was a young man, new to the post. He heard me out, looked at the two charts side by side, and screwed up his face. “This isn’t according to the rules.” “Which rule?” said Isabel. “Read it to me.” He leafed through the regulations for a long time and found nothing, so at last he picked up his pen and, under my name in the bottom right corner of the master copy, added a line of small writing: Drawn by Isabel de Soto. The letters were so small you had to squint. Outside, she stood on the steps and traced the line in the air with her finger. “Small writing is still writing.” That evening she bought me wine at a tavern by the river, and halfway through the second jug she pulled a fresh chart from inside her coat and slapped it on the table. “Where are you headed next? Tell me.” She worked the stopper out of her inkpot. “From now on, every course your ships sail, I draw.” Before she laid down the first line, she signed her name in the bottom right corner."
effects = [{}, {}, {}, { title = "The Unnamed Hand" }]

[tracks.reunion_isabel_soto.chapters.reunion.choices.her_route]
text = "Take the new sailing chart she drew, and tell her what she said on the quay still holds"
hint = "Those words on the quay were never said back then, and today she’ll simply roll up the chart and hand it over."
reply = "The rule stopped halfway along the edge. “Of course it holds,” she said. “I never draw a wrong course.” She didn’t hand me the chart. First she pulled my hand over, palm up, just like that summer, and with the tip of her pen drew a star on it—five points again, slower this time. When she finished, she didn’t let go. “Where’s my stylus?” I fished it out of my coat, the lead worn down to half its length. She looked it over and pushed it back into my hand. “Still usable.” From inside her collar hung an old cord, and on it the little astrolabe that never turned, rubbed bright by eight years. A clerk poked his head in at the door, saw her holding my hand, and ducked back out. She stood, brushed the corner of my mouth with a quick kiss, and stepped back, red from her ears down to her neck. “Everything else was supposed to wait until you came back,” she said. “Well, you’re back. From now on your ship’s course is mine to draw, until you can’t sail anymore.”"
effects = [{}, {}, {}, { title = "The Unnamed Hand" }]
