# 最后一排（bond_sophie_lemaire）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_sophie_lemaire]
name = "Sophie Lemaire: The Back Row"

[tracks.bond_sophie_lemaire.chapters.c1]
title = "The Back Row"
text = "At the girls’ school in town, every morning began with a hymn. The schoolmistress beat time, a dozen-odd girls stood in three rows, and I stood in the front and sang loudest. In the back row, at the seat by the door, the new girl from Lille stood straight as a post with her lips pressed into a line. She didn’t sing a single note from start to finish. The schoolmistress didn’t notice. I did. After the hymn came bookkeeping drills, and the nib of my pen split. I walked back to the last row and rapped on her desk. “Lend me a pen. I’ve never borrowed a pen from anyone in my life. You’re the first.” She raised her eyes and looked at me for a while. “That’s not what you said last time.” “What last time?” “The fourteenth of last month, at the stationer’s stall outside the Exchange. You borrowed a quill from the man, signed a bill with it, and walked off with it.” She did my voice exactly. “‘I’ll bring it back next time. Put it on my account.’” I stood there with my mouth open. I had forgotten all about it. She looked down, drew a quill from her pen case, its shaft wound with a ring of old thread, and set it on the corner of the desk. She didn’t hand it to me, and she didn’t take it back."

[tracks.bond_sophie_lemaire.chapters.c1.choices.pay_the_debt]
text = "Own the debt, count out the price of that quill, and ask her to pass it on."
reply = "I took out my purse and counted the coppers one by one: two stuivers for a quill, a month overdue, plus half a stuiver interest. She watched me count and didn’t say a word. At the last coin she said, “Well, you keep a clean account.” She knotted the coins into her handkerchief and pushed the thread-wound quill across to me. The thread was wound tight, to keep the shaft from splitting. My bookkeeping drill that day was the neatest I ever turned in."

[tracks.bond_sophie_lemaire.chapters.c1.choices.bet_she_misremembered]
text = "Bet her she has the wrong girl."
reply = "“One copper,” I said, “says you’ve got the wrong girl.” She didn’t even think about it. “Done.” After school we walked to the Exchange, one behind the other. The stationer was trimming quills and broke into a grin the moment he saw me. “The money changer’s girl! You still owe me a pen.” I put a copper in Sophie’s palm. She closed her fist on it and turned to go. Two steps on, the corner of her mouth twitched, and she pressed it flat again."

[tracks.bond_sophie_lemaire.chapters.c2]
title = "A Page Inside the Book Cover"
text = "It rained all day, and the schoolroom lamps were lit at noon. As Sophie gathered her books, one slid off the edge of the desk and slapped onto the floor. She had sewn its cover herself from coarse sacking, and a seam had come open. A sheet of paper slipped out of it and landed right at my feet. I glanced down. It was French, set out in lines, each verse with a number in front of it, like a song. But no church sang songs in French. Only last month the Emperor’s edict had been posted again on the door of the Town Hall, and when my father and I walked past, he told me not to stop and read it. Sophie bent for the page. Her hand shook worse than the paper, and it took her two tries to pinch it up. She didn’t look at me. She pressed the sheet flat on her knee and felt in her sleeve for a needle and thread. By the window, the butcher’s daughter was craning her neck our way. “What did you drop?” “A page of accounts,” Sophie said, her voice as flat as a recitation. “Mine.”"

[tracks.bond_sophie_lemaire.chapters.c2.choices.block_the_window]
text = "Stand my ledger up to block the window’s view until she’s sewn it shut."
hint = "She trusts no one yet. If I lean in now, she’ll only clutch the book tighter."
reply = "I stood my ledger on end and weighted one corner with the inkpot, right in the line of that head by the window. “I can’t work out the seventh interest problem,” I announced. “Who’ll let me see theirs?” Behind me the needle went through the sacking, a small sound, then another. When she was done she didn’t say thank you. The next day there was a stack of notes on my seat: the whole rhetoric lesson I hadn’t heard a word of, copied out clean, down to a note in the margin that the master had coughed twice."

[tracks.bond_sophie_lemaire.chapters.c2.choices.turn_away]
text = "Pretend to study my ledger and turn my face away."
reply = "I turned toward the board and counted the master’s figures one at a time. Behind me I heard all of it: the paper going back in, the needle going through the sacking, the thread pulled tight. When the lesson ended she walked past me and her step paused. I waited for her to say something. She didn’t. She drew the book closer against her chest and went."

[tracks.bond_sophie_lemaire.chapters.b1]
title = "Reading Her Own Poem"
text = "The chamber of rhetoric didn’t take girls, so Inês started a girls’ poetry circle on the pages of her own notebook. Once a month, in the back room of her house, two candles lit, whoever had a new poem read it. She dragged me along, and I made it clear at the door: “I keep accounts. I don’t write poems.” Sophie had come three times and sat by the door, and never once read. She only listened. When the meeting broke up, she would tell each girl which word she had gotten wrong, one by one, until they blushed. This time it was her turn. She stood up holding a sheet folded in four and didn’t unfold it. She had it by heart. The poem was about a door in Lille: the knocker was a brass hand, and on the frame was a notch her mother had cut to mark her height. The last line went: “Above that notch, strangers live now.” Then it was over. The room went completely still. Candle wax dripped onto the holder. Sophie stood there, one hand bunching her skirt into creases, her face as white as the paper. In my head I counted. One. Two."

[tracks.bond_sophie_lemaire.chapters.b1.choices.start_the_applause]
text = "If no one has made a sound by three, start the applause myself."
hint = "She still thinks I’m the money changer’s girl waiting to laugh at her. She won’t believe my clapping."
reply = "“Three.” I clapped once, so loud it made me jump. Inês clapped next, and then the whole room was at it. Sophie nearly missed her chair sitting down. After the meeting she was waiting at the door, wrapped in her shawl. “You counted to three. I saw your lips move.” I told her two was too hasty and four too late; three was just right. She smiled. It was the first time I had ever seen her smile, and as soon as she had, she turned to look out at the street."

[tracks.bond_sophie_lemaire.chapters.b1.choices.ask_the_door]
text = "After the meeting, ask her what street in Lille that door is on."
reply = "She told me a street name, a French one. It took me two tries to say it right. “Brass-hand knocker, third house from the corner,” she said. “Our door. Somebody else lives there now.” She tucked the folded poem inside her book cover, smoothed it flat, and pressed it down again. “What do you want the street name for?” I said a money changer’s daughter remembers everything, in case it comes in handy someday. She gave me a look that neither believed me nor didn’t."

[tracks.bond_sophie_lemaire.chapters.b2]
title = "The Night They Moved"
text = "That week the magistrates were searching again for households that kept forbidden books, going street by street. The lane where Sophie’s family rented was named, and first thing in the morning the landlord set their trunks outside the door. “I’m not answering for anybody.” By the time I reached the end of the lane it was dark. Her mother was crouched on the ground roping their bundles, the cord biting her fingers white. Sophie stood at the corner hugging a book chest, a chip of paint knocked off one corner. She didn’t ask me for anything. She only looked at me, for a long time, long enough for me to count the turns of rope her mother tied: seven. I knew my father knew a Portuguese merchant with a warehouse by the Scheldt quay, its upper floor empty, used for wool in winter. I also knew my father dreaded having his name anywhere near the words “forbidden books,” and that a favor like this he would owe once a year at most. “We’ll go outside the walls,” Sophie’s mother said, without looking at me. “There’s a house there. It keeps the rain off.” Sophie was still looking at me."

[tracks.bond_sophie_lemaire.chapters.b2.choices.find_lodging]
text = "Use my father’s connections and get the key to that warehouse loft tonight."
hint = "She still won’t owe a money changer’s family a favor. Hold out that key and she won’t take it."
reply = "I ran home and stood outside my father’s counting room for half an hour before I knocked. He heard me out, sighed, and wrote two lines on the back of a bill. The Portuguese merchant read the note and handed me the key without a single question. I put it in Sophie’s mother’s hand. She went upstairs first to check the bolt, pushed on it three times, and only then called her daughter up. Sophie held on to the book chest until it was on the floor. Then she spoke. “That thing you said last time. I’ll pay you back for it.” I thought about it the whole way home and couldn’t remember saying anything."

[tracks.bond_sophie_lemaire.chapters.b2.choices.carry_boxes]
text = "Help carry their book chests to our back yard for now, and think of something tomorrow."
reply = "The chests weighed a ton. We carried them between the two of us and rested every thirty steps. Under the woodshed in our yard there was a dry patch, and I shoved them behind the woodpile and threw an old sail over them. They stayed there three days. On the fourth, the family found a room at the foot of the city wall. When they came for the chests, Sophie pressed a folded sheet of paper into my hand, creased into a neat square. I opened it. Not a word. I turned it over. The back was blank too. I tucked it into the last page of my ledger."

[tracks.bond_sophie_lemaire.chapters.a1]
title = "May Dew"
text = "On May Day, before it was light, the moment the gates opened the girls of the town ran out to the woods with baskets, to pick hawthorn blossom before sunrise and wash their faces in the first May dew, so they wouldn’t freckle all year. Sophie knocked at our back door three times. “Dawdle any longer and the others will have washed in all the dew.” I was still tying my shoes. In the woods the grass came up to our calves, and every blade held drops of water. She tore off a dewy blade and slapped it against my cheek. It was so cold I jumped back, smeared my face with mud, and snagged my cuff on a bramble that only got tighter the more I pulled. She didn’t laugh. She crouched and worked the thorns loose one at a time, slowly, careful not to catch the threads. Across the woods other girls were laughing, and someone was singing a May song. Sophie freed the last thorn and didn’t get up right away. “May mornings in Lille,” she said quietly, “are this cold too.” It was the first time she had brought up Lille on her own."

[tracks.bond_sophie_lemaire.chapters.a1.choices.let_her_wipe]
text = "Let her wipe the mud off my face with dew-wet fingers."
hint = "We’re not close enough yet for her to touch my face. I wipe it with my own sleeve."
reply = "Her fingers were cold and smelled of grass, and they moved over my cheekbone a little at a time. When she was done, her fingertips rested on my cheek for a moment. “There.” Her voice was softer than usual, so soft I nearly missed it. On the way back into town her basket was full and mine was still empty. She walked beside me the whole way and never once went on ahead."

[tracks.bond_sophie_lemaire.chapters.a1.choices.hear_about_lille]
text = "Ask her to tell me more about May in Lille."
hint = "That one line about Lille is all she’ll give yet. If I press her, she’ll get up and go."
reply = "She sat on a fallen trunk and talked a long time. There was a linden tree in front of their house that flowered in May and made the whole street smell sweet. Every May Day her mother wove her a garland, daisies and clematis, and stood her in the doorway wearing it until the neighbors had praised it. At the garland she stopped and looked down at her empty hands. “I haven’t told anyone this,” she said. “Just remember it. Don’t feel sorry for me.”"

[tracks.bond_sophie_lemaire.chapters.a1.choices.wash_her_face]
text = "Scoop up some dew and splash it right back at her."
reply = "I scooped up a whole handful and let fly. It caught her full in the face, and she stood frozen, water dripping off her chin. The next second she snatched up her basket and came after me. I ran, round and round the oaks, half across the woods, and a whole tree of birds burst up. When she caught me, she stuffed a fistful of wet grass down the back of my collar. I heard her laugh out loud, a big laugh, nothing like a girl from the back row."

[tracks.bond_sophie_lemaire.chapters.a2]
title = "Her Mother’s Brooch"
text = "Sophie gave me a handkerchief, linen, with a forget-me-not embroidered in each corner. The one at the lower left was a size bigger than the other three. She said she had picked it out three times, it got bigger each time, and in the end she let it be. Pinned to an inside corner was a brooch, silver, very small, one of its leaves worn smooth. It had been her mother’s. “The clasp on the back was broken,” she said, turning it over to show me. “I bent it back with tweezers, a little at a time. It took a whole night.” I reached to touch it, and she got her hand on it first. “The brooch is for you to see,” she said. “The handkerchief is for you to keep.” She bent to check that the clasp was fastened, and her fingertip stayed on it a moment before she lifted it away. Far off, the bell of the Exchange struck four. She counted every stroke before she looked up."

[tracks.bond_sophie_lemaire.chapters.a2.choices.keep_kerchief]
text = "Take the handkerchief, and ask her to teach me to unpin the brooch without forcing it."
hint = "This is too much to hold. We’re not close enough yet for me to reach out and take it."
reply = "She took my hand and set my thumb on the tail of the pin. “Push in a little, then lift. Don’t pull.” The first time I pulled, and she slapped the back of my hand. The second time I forgot to push in. The third time the pin gave a small click and came free. “You’re a slow learner,” she said, but she didn’t let go. She held on while I pinned it back, and then a little while longer."
effects = [{}, {}, {}, { title = "Her Mother’s Brooch" }]

[tracks.bond_sophie_lemaire.chapters.a2.choices.pin_it_on_her]
text = "Take the handkerchief, unpin the brooch, and fasten it on her own collar."
hint = "My fingers touch the brooch and draw back. We haven’t come that far yet."
reply = "She stood still with her chin lifted a little and let me do it. There was a darned spot at her neckline, and I pinned the brooch over the darning so it hid it exactly. When I finished, she looked down at the brooch for a long time, then up at me, and her eyes were wet. “If my mother could see this, she’d like you,” she said. “She darned that spot herself, and she grumbled about how ugly it was all winter.” She folded the handkerchief and tucked it into my cuff, tucked it in tight."
effects = [{}, {}, {}, { title = "Her Mother’s Brooch" }, {}]

[tracks.bond_sophie_lemaire.chapters.a2.choices.write_an_ledger]
text = "Say I’ll enter it in my ledger: received, one handkerchief; owed her, one thing."
reply = "I really did open the ledger, dip my pen, and write it out: Received of Sophie Lemaire, one embroidered handkerchief, valued at… I stopped. “What’s it worth?” She leaned over to look, took the pen out of my hand, and drew a line through “valued at.” “No value. Just write down that you owe me one thing.” She folded the handkerchief up again and slipped it inside her bodice. “I’ll hold on to this for you until you’ve paid. And if you ever try to wriggle out of it, I’ll recite it back to you word for word.”"

[tracks.bond_sophie_lemaire.chapters.s]
title = "Two Rosters"
text = "The circle had only one roster, with every girl who had come in the past two years, and Inês had always kept it. In the spring I was going aboard ship. “Then we make two more copies,” Sophie said. “One goes with you.” At the only table in her family’s rooms we each copied half, then traded to check each other’s mistakes and fill in what was missing. She wrote fast and I wrote slow, and after every line she waited for me. Near the end I stopped at some of the names: the girl who moved to Cologne, the girl who married, the girls called home who never came back. Their chairs had been empty a long time, and I didn’t know whether to write them in. Sophie slid the pen out of my hand and gave each of them a line, full name, and after it which poem she had read at which meeting. In the corner of the room stood a wooden trunk, roped shut and left that way for over a year. “That’s for Emden,” her mother said. “Someday we’ll need it.” We reached the last line. Sophie held out the thread-wound quill to me."

[tracks.bond_sophie_lemaire.chapters.s.choices.promise]
text = "Agree that even across the sea, we’ll check each other’s work, and send every new poem."
hint = "The pen stops on the last line. Correcting each other across the sea for a lifetime—what we share can’t fill that page yet. Or I’ve already made such a promise to someone else."
reply = "“You write one, I find three mistakes,” I said. “I write one, you find as many as you like. Across the sea it’s the same. Letters get there when they get there.” Sophie stopped writing. “In the back room at Inês’s you said you keep accounts and don’t write poems.” She recited it exactly, down to the face I had pulled that day. “That was then.” She looked at me, and the corners of her mouth eased, little by little, until she smiled. She squared up her half of the roster, folded it, and slid it inside the cover of that book, pressed in with the other pages, and smoothed it flat. Then she took a stack of blank paper from the drawer, cut it to letter size, and counted twelve sheets across to me. “One a month. You send the first. I’ll mark it.” That night at home I wrote the first line of poetry in my life by candlelight, and crossed it out as soon as it was done. The next morning I started again from the crossed-out spot."
effects = [{}, {}, { title = "Two Rosters" }, {}, {}, {}]

[tracks.bond_sophie_lemaire.chapters.s.choices.heart]
text = "Write her name on the last line of my half, and ask her to write mine on hers."
hint = "Her name stops halfway, the pen point still. My heart hasn’t come far enough to finish it—or I’ve already saved that last line for someone else’s name."
reply = "On the last line I wrote: Sophie Lemaire. At “Lemaire” the ink bled a little, and I didn’t write it over. She stared at that line without a sound, and only after a while picked up the pen and wrote my name on the last line of her half. She wrote very slowly, tracing one letter at a time, and at the last curly letter she paused, as if afraid of getting it wrong. When she was done she set the two rosters side by side and nudged the edges until they lined up. The two names on the last lines sat right next to each other, nothing between them but the seam where the pages met. She reached over and took my hand. She didn’t say anything. Downstairs her mother was boiling water, and when it came to the boil the lid rattled, tap, tap, tap. She held on until the water went quiet, until the candle had burned down a good inch. “When you leave in the spring,” she said at last, “I won’t show this line to anyone.”"
effects = [{}, {}, {}, {}, { title = "Two Rosters" }, {}, {}]

[tracks.bond_sophie_lemaire.chapters.s.choices.own]
text = "Agree to each go looking for a city with room for the circle, and see who finds it first."
reply = "“I’m going to sea. I’ll see more cities,” I said. “One gold piece says I find one first, a city where girls can read poems without shutting the windows.” “I’ll find it first,” she said. “I’ve lived in more cities than you. Lille, Tournai, Antwerp. That’s three. You have one.” “A ship can call at twenty ports a year.” “A port isn’t a city.” She folded up her half of the roster. “When you find it, write and tell me. City, street, which way the door faces. Leave nothing out.” “Word for word?” “Word for word.” She held out her hand, and we struck palms the way they seal a deal on the Exchange. She struck harder than I did, then wrote the gold-piece wager on the back of her half of the roster and signed both our names underneath."

[tracks.reunion_sophie_lemaire]
name = "Sophie Lemaire: A Seat Across the Sea"

[tracks.reunion_sophie_lemaire.chapters.reunion]
title = "A Seat Across the Sea"
text = "London, 1568. The year before, the Duke of Alba had ridden into Brussels and set up the court everyone called the Council of Blood, and people from the Low Countries were fleeing by the boatload. Here they crowded into the lanes around the strangers’ church in the old Austin Friars. Sophie lived in one of those lanes. She had only moved over from Emden at the turn of the year. There was a line outside her door, and as each household came in she asked three things: “What city? How many? Who didn’t make it?” She asked fast and remembered faster, and without looking at her paper she could repeat the last family’s words back exactly. The circle had no room of its own anymore. Pinned to the wall was a sheet with the addresses of six cities: London, Norwich, Sandwich, Emden, Wesel, Cologne. When I came in she was finishing a poem for a friend who had arrived late, someone who had walked all the way from Ghent and sat in the corner too tired to read. Only when she was done did Sophie look up at me. By the table stood an empty chair with a wood chip wedged under one leg. “This one’s for you,” she said. “I’ve kept it twelve years.”"

[tracks.reunion_sophie_lemaire.chapters.reunion.default]
effects = [{ text = "Lieve, you didn’t come. I asked three sailors in from Zeeland which port your ship was in. Three sailors, three ports. I don’t believe any of them. I’m in London, in the lanes behind the old Austin Friars, and every day there’s a line outside my door. I take down their names: what city, how many, who didn’t make it. As of today, four hundred and twelve households. If you were here, you’d say that’s an ugly number and round it off. I won’t. The circle is still going. No room of our own anymore, but six cities. Here in London we meet the first Sunday of the month, in Norwich the third. With this letter is a copy of one page, the last page of that roster from twelve years ago. The last line is your name. I wrote it. Don’t tell me I’ve misremembered. I haven’t. The chair by the table is still here. One leg is short, and I’ve wedged a chip under it. Sit in it when you come back. If you don’t, I won’t move it. I remember everything you ever said, even “I keep accounts, I don’t write poems.” The day you come to London, I’ll start from the beginning. — Sophie Lemaire, London" }, {}]

[tracks.reunion_sophie_lemaire.chapters.reunion.variants.with_ines]
text = "London, 1568. The year before, the Duke of Alba had ridden into Brussels and set up the court everyone called the Council of Blood, and people from the Low Countries were fleeing by the boatload, crowding into the lanes around the strangers’ church in the old Austin Friars. Sophie lived in one of those lanes. She had only moved over from Emden at the turn of the year. There was a line outside her door, and as each household came in she asked three things: “What city? How many? Who didn’t make it?” The circle had no room of its own anymore. Pinned to the wall was a sheet with the addresses of six cities. When I came in she was finishing a poem for a friend who had walked from Ghent. In the chair that used to stand empty by the table sat a woman from Lisbon, head bent over an old notebook, continuing a poem a line at a time, pausing to wait until Sophie finished reading. Sophie looked up, saw me, and went into the back room for another chair, a wood chip wedged under one leg. “Since she came, there aren’t enough chairs,” she said. “This one’s yours. I’ve kept it twelve years.”"

[tracks.reunion_sophie_lemaire.chapters.reunion.choices.friend]
text = "Sit down in that chair, and say yes to being her sister across the sea."
reply = "I sat. The chair still wobbled a little. Sophie opened the old roster, its edges curled, every page in handwriting from twelve years ago. She found my name, dipped her pen, and wrote one word beside it: sister. She pressed so hard the nib tore the paper a little. “The circle’s rule. Whatever’s written next to a name, that’s what it is. Once it’s written, it stays.” She handed me the pen. On the last page of my ledger I wrote her name and the same word beside it. It came out crooked. She glanced at it and didn’t correct it. I didn’t leave that afternoon. I kept the line at her door for her: she asked, I wrote. When an old woman from Lille started to describe her street, Sophie paused, then named the knocker on the third house from the corner for her: a brass hand. At dusk, when she closed the door, she pushed my chair back up to the table. “Coming tomorrow?” “Coming.” “You said it,” she told me. “I’ll remember.”"
effects = [{}, {}, {}, { title = "A Seat Across the Sea" }]

[tracks.reunion_sophie_lemaire.chapters.reunion.choices.love]
text = "Sit down in that chair, and tell her this time I’m not leaving."
hint = "What went unsaid back then, twelve years on, sitting in this chair, I still can’t say."
reply = "I sat down and didn’t push the chair back. I took my half of the roster out of my coat and laid it open beside her register. “This time I’m not leaving. The ship can go to the first mate, the books to an agent in London. I’ll rent a room in this lane and keep the line at your door.” Sophie looked at me, her pen stopped in midair. Someone was waiting at the door, and she didn’t call the next family. “You know my bad habit,” she said. “Whatever anyone says, I recite it back word for word.” She stopped. “This one, I won’t recite back to you. I’m keeping it.” She laughed, and halfway through the laugh she was crying. A tear dropped on my half of the roster and landed right on the last line, on her own name. She didn’t wipe it away. She leaned across and kissed me. Her lips tasted of ink and cold tea, a light kiss, as if checking that a word was spelled right. The person at the door coughed. Sophie straightened up, scrubbed her face with her hand, and dipped her pen. “Next. What city?” All the while she wrote, her left hand stayed under the table, holding mine down."
effects = [{}, {}, {}, { title = "A Seat Across the Sea" }]
