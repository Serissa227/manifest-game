# C7 英文覆盖：小蛮（符上的价 / 第一次出洋回来）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_xiao_man]
name = "Xiao Man: The Price on the Charm"

[tracks.bond_xiao_man.chapters.c1]
title = "The Price on the Charm"
text = "At the foot of the steps before the Tianfei Temple lay a bamboo mat, and on the mat a wooden box stacked with yellow paper charms, the cinnabar seals not yet dry. The girl selling them was from a fishing family: barefoot, eyes black and bright, and when she called out, half the street turned around. I crouched, picked out a safe-passage charm, and asked the price. She didn’t answer. She looked me over from head to foot, let her eyes rest a beat longer on my sleeve, and then both her dimples showed at once. “Ten coppers.” “The old woman next door sells them for five.” “That’s the fishwife price. You’re in a long scholar’s gown. You get the scholar price.” I switched to Minnan and started haggling: five apiece, I’d take two, call it nine. She laughed even harder and waved the charm under my nose. “Hang the charm, then take the tiller yourself. This paper won’t stop a wave, scholar. You wear it so you have something to hold on to.” “And for that you want ten?” “Something to hold on to costs money too.”"

[tracks.bond_xiao_man.chapters.c1.choices.bargain_minnan]
text = "Keep at her in Minnan until she gives in."
reply = "I talked tides, then fish prices, then the temple’s incense money, then whether her bare feet got cold on the flagstones. At last she threw up her hands. “Five! Fine, five! For a scholar, you’ve got a sharper tongue than a fishwife.” I tucked the charm into my shirt and walked off, and she shouted after me, “Hang it tight! Don’t go carrying it around till you lose it!”"

[tracks.bond_xiao_man.chapters.c1.choices.does_it_work]
text = "Ask her straight: does this charm actually work?"
reply = "She tilted her head and thought about it, as if nobody had ever asked her to her face. “Whether it works depends on whether you can row.” She pressed the charm into my hand and picked only five coppers off my palm. “You owe me the other five. Pay me when you’ve learned to row.” I said I couldn’t row. “Then you’ll have to come back,” she said."

[tracks.bond_xiao_man.chapters.c2]
title = "The First Oar"
text = "Xiao Man said I had wasted my money on that charm. “Wearing a charm when you can’t row. Even Mazu would laugh.” She hauled me onto her family’s little sampan. The oar had come down from her grandfather, and the grip was worn so smooth it shone brighter than my inkstone. The water at the mouth of the Jiulong River was thick and yellow. I gripped the oar with both hands and pulled with everything I had, and the bow went round, and round, until my head spun. Xiao Man sat in the stern with one foot up on the gunwale and waited until my third circle before she reached over and pinned the oar. “Loosen your wrists. Rowing’s like lying. Push too hard and it shows.” “I never lie.” Her dimples came out again. “See? It shows.” I let my wrists go loose. The blade slid through the water, the hull dipped, and we stopped circling and moved with the current. I turned around, pleased with myself, and she pointed at the bank. “Look at that banyan.” The banyan hadn’t moved an inch. All that rowing, and I had only fought the incoming tide to a draw. She laughed so hard she nearly went over the side."

[tracks.bond_xiao_man.chapters.c2.choices.keep_rowing]
text = "Stay out on the water until I can row us back to the dock myself."
hint = "Xiao Man has drawn the oar back into the stern. She still takes you for a scholar out for a lark, and her grandfather’s oar isn’t going to you."
reply = "I rowed from early afternoon until the sun leaned west, and at last the banyans on the bank began to slide past one by one. When the hull scraped up against the dock steps, I had a blister on each palm. Xiao Man jumped ashore first and turned to pull me up, and halfway through she glanced down at my hands and looked at them longer than she ever looked at the wind. She said nothing. She took a clean piece of blue cloth from her shirt, tore it in two, wrapped my hands round and round, and tied them off with a fisherman’s knot that would never slip."

[tracks.bond_xiao_man.chapters.c2.choices.ask_her_row]
text = "Say I’ll watch her row today and learn tomorrow."
reply = "Xiao Man snorted and took the oar. She didn’t so much row as write on the river with it, stroke after stroke, and the sampan skimmed over the chop so lightly the water barely made a sound. I forgot to close my mouth. She didn’t look back until we were in midstream. “Seen enough? Tomorrow you row, and I sit in the stern cracking melon seeds.”"

[tracks.bond_xiao_man.chapters.b1]
title = "The Ghost Ship at the River Mouth"
text = "Xiao Man said there was a ghost ship off the mouth of the Jiulong River at night. “Nobody at the helm, nobody at the oars. Just a red lamp hanging from the mast. Row out to look at it and you never come back.” I’m afraid of ghosts, and a ship with nobody on it is the worst kind. But I wanted even more to know what became of that lamp. I pestered her for three days before she picked a moonless night and took the sampan out past the river mouth. I had brought my family’s red paper lantern for courage, the character for Lin brushed on it in ink. The sea was black as spilled ink. I clung to the gunwale with my teeth chattering and still kept asking, “The ones who never came back, where did they go?” “The ghosts invited them for a drink.” Then the lamp was really there, hanging in midair, perfectly still. Xiao Man slowed her strokes and eased us closer, and under the lamp the dark shape of a Fujian junk took form, with men along the rail holding blades. A torch swung our way and lit the lantern in my hand. Someone said, “Huh,” and the blades went down, and they waved us off. “Lin family? Go on, get out of here!” Xiao Man brought the boat about. Only when we were well away did she turn to look at me, her eyes full of laughter."

[tracks.bond_xiao_man.chapters.b1.choices.tell_her_truth]
text = "On the way back, tell her that ship and my family are in it together."
hint = "Those knives on the junk still flash before your eyes. She doesn’t know yet whether you’ll talk about your family; if you start, she’ll only pretend not to hear."
reply = "“I guessed already.” Xiao Man didn’t even turn around. “Whose ships in Yuegang sail at midnight with a lamp lit? Only your family’s. And they hang it that high so their own people can’t miss it.” She shoved the oar into my arms. “Your family’s ghosts. You row them home.” I rowed crooked the whole way, and she sat in the bow humming a fishing song and never asked another thing."

[tracks.bond_xiao_man.chapters.b1.choices.keep_scared]
text = "Act scared out of my wits and hang on to her sleeve all the way back."
reply = "I held on to her sleeve from the river mouth to the dock, and she laughed the whole way. “What a coward. They waved at us, and you’re still shaking.” But once we were ashore, she reached into my collar, pulled out the safe-passage charm, wound its red cord twice around, and knotted it again, tighter than before. “Shaking like that, you’ll shake it right off.”"

[tracks.bond_xiao_man.chapters.b2]
title = "Daoist Bai’s Charms"
text = "That year word reached Yuegang that the raiders had fought their way right up to the walls of Nanjing, and the line for charms in front of the Tianfei Temple ran out past the temple gate. One boatman told everyone who would listen that he had worn Xiao Man’s charm for three years and his boat had never once capsized. The next day her charms went up to twenty coppers and still sold out. But she packed up her stall early and pulled me around to the back of the temple, to find Daoist Bai, who had come from Ningbo and was lodging there. All the way she kept tugging at the end of her braid. “I sell these charms and I don’t even know where they come from. What if people really think they can stop a wave?” Daoist Bai heard her out, stroking his beard, then lifted a woodblock the width of a palm out of his cabinet. The charm was carved on it backward, cinnabar soaked deep into the grain. “A print shop in Zhangzhou makes them. A hundred to a pull. This humble Daoist only stamps his seal on top.” “That’s… all?” “That’s all.” Xiao Man stared at the block and didn’t say a word for a long time. She reached out and touched the backward characters, then drew her hand back."

[tracks.bond_xiao_man.chapters.b2.choices.change_her_sign]
text = "Go back with her and repaint her sign: “A charm is comfort. The sailing is up to you.”"
hint = "She pushes the woodblock back into the cabinet and waves you off. Her charms turned out to be so ordinary, and she isn’t ready to let you in on it yet."
reply = "I painted the words and Xiao Man held the board steady. After that she sold half as many charms that month, but more people squatted by her stall to ask whether they could put to sea tomorrow, and she would lick a finger, hold it up to the wind, and be right every time. At the end of the month she counted her coppers and swept them into the box. “Half the sales. Twice the sleep.”"

[tracks.bond_xiao_man.chapters.b2.choices.still_worth]
text = "Tell her: printed or stamped, if wearing it eases someone’s mind, it’s worth it."
reply = "Xiao Man sat on the back steps and thought about it so long that Daoist Bai went back inside. “Then from now on, every one I sell, I tell them something extra.” She counted on her fingers. “Hang it right, keep your own hand on the tiller, and don’t go out when the wind’s wrong.” By the third one she was laughing at herself. “That much talking, twenty coppers doesn’t cover it.”"

[tracks.bond_xiao_man.chapters.a1]
title = "Docking in the Rain"
text = "In spring the weather at the river mouth turns on a whim. One moment we could see the ferry landing on the far bank; the next, the rain was coming down so hard it pocked the water white. Xiao Man didn’t say a word. She grabbed the oar and in three strokes jammed the sampan under a hollow in the rocky bank, where the stone hung over us like eaves. She pulled a dry towel out of an oilcloth bundle and tossed it to me. “Dry off! Get that book wet and see if your teacher doesn’t beat you.” I was busy tucking my copy of the Analects somewhere dry; she was busy winding the mooring line around a rock, three turns, then a hard tug. Only when we were both settled did I see it. There was just one small patch under that ledge the rain didn’t reach, and she had given it to me. Half of her was out in the weather, water running off the end of her braid and down inside her collar. “Come in a bit.” “The boat’ll tip,” she said, and shifted half an inch farther out."

[tracks.bond_xiao_man.chapters.a1.choices.share_the_towel]
text = "Tear the towel in two, give her half, and shift over to sit close to her."
hint = "You’ve moved half an inch and she’s already glaring. You aren’t close enough to sit like that yet. Move again and she really will tip you overboard."
reply = "The boat did tip, and then it steadied. Xiao Man took the half towel and, instead of drying her own face, blotted the water off the corners of my book first. The rain kept on for a full two hours, and for two hours we sat shoulder to shoulder. When it stopped, she looked up at the sky. “If it rains tomorrow, we come back here.” I said tomorrow’s wind was from the northeast; it wouldn’t rain. “Then I’ll go ask Mazu for some.”"

[tracks.bond_xiao_man.chapters.a1.choices.row_her_home]
text = "When the rain eases, take the oar and row her back to the temple."
hint = "You reach for the oar and she only hugs it tighter. In rain like this, she doesn’t trust you with her boat yet."
reply = "The rain thinned to mist, and I took the oar. My wrists were loose, the blade stayed close to the water, and the boat never once spun. Xiao Man sat in the bow wrapped in the towel and watched me all the way to the temple landing before she spoke. “You row this boat better than I do now.” I said she was the one who taught me. She held out her hand. “Then where’s my fee? Two years, and I haven’t seen a single copper.”"

[tracks.bond_xiao_man.chapters.a1.choices.tell_ghost_story]
text = "Tell her a ghost story, and keep going until she’s scared too."
reply = "I told her about the ghost ship at the river mouth: a red lamp on the mast, nobody beneath it, only a line of wet footprints walking from bow to stern… When the footprints stepped onto our sampan, I was the one who shivered and shrank toward her. Xiao Man laughed so hard the boat rocked. “Scholar, your ghosts only ever scare you.”"

[tracks.bond_xiao_man.chapters.a2]
title = "A Charm Sewn into the Collar"
text = "After the harbor search, all that was left of the Lin ships at anchor was a few charred keels. Come spring, I would take the family’s last bird-boat to sea. Xiao Man heard, asked nothing, and turned up the next day with her sewing basket. She sat me on the stone block by the door and told me not to move, folded a safe-passage charm down to the size of a fingernail, slipped it into the lining of my collar, and sewed it shut one stitch at a time, the stitches as close as a fishing net. “The old men on the boats say when a big wind hits, you call ‘Mazu,’ not ‘Tianfei,’” she said around the thread. “Call her Tianfei and she has to comb her hair, put on her crown, change into her good robes before she comes. Call her Mazu and she comes with her hair still down.” “What if I call both?” “Then she can’t decide what to wear and frets herself to death at home.” On the last stitch the needle went into her finger. She hissed, put the finger in her mouth, and with her other hand patted my collar, hard."

[tracks.bond_xiao_man.chapters.a2.choices.keep_charm]
text = "Accept the charm, and tell her that in a big wind hers is the first name I’ll call."
hint = "She puts her needle away the moment she’s done, as if it were just a neighborly favor. Something like “you’re the first one I’ll call”—what you share can’t bear that yet."
reply = "“Calling me won’t help,” she said, turning her head away. “I can’t fly over with my hair down. Call Mazu.” But she had gone red to the ears. She put her needle and thread back in the basket, and they fell out, and she put them back again, and her thimble rolled under the stone block. She bent down to get it and took a long time straightening up."
effects = [{}, {}, {}, { title = "A Charm Sewn into the Collar" }]

[tracks.bond_xiao_man.chapters.a2.choices.hold_her_needle_hand]
text = "Accept the charm, and take hold of the finger she pricked."
hint = "Your hand lifts, then drops. It’s too much to accept; you aren’t that close yet, let alone close enough to take her hand."
reply = "A bead of blood had welled up on her fingertip, red as the cinnabar on the charm. I held it. She didn’t pull away, and she didn’t look at me either. She watched a fishing boat come in on the river, all the way to the dock, until its line was made fast to a bollard. Only then did she say, “Count that stitch as one I put in for Mazu. Remember how it stung, and you’ll remember to call her.”"
effects = [{}, {}, {}, { title = "A Charm Sewn into the Collar" }, {}]

[tracks.bond_xiao_man.chapters.a2.choices.ask_bai]
text = "Ask her: did Daoist Bai stamp this one too?"
reply = "“This one I didn’t buy.” Xiao Man stuck the needle back into her spool. “I knelt in the temple and asked for it. Knelt a whole afternoon. My knees are still black and blue.” She said it as offhandedly as the day’s fish prices. I pressed my hand over my collar and held it there a long time, until I could feel all four corners of the charm."

[tracks.bond_xiao_man.chapters.a2.variants.v1_known]
text = "After the harbor search, all that was left of the Lin ships at anchor was a few charred keels. Come spring, I would take the family’s last bird-boat to sea. Xiao Man heard, asked nothing, and turned up the next day with her sewing basket. She sat me on the stone block by the door and told me not to move, folded a safe-passage charm down to the size of a fingernail, slipped it into the lining of my collar, and sewed it shut one stitch at a time, the stitches as close as a fishing net. “The old men on the boats say when a big wind hits, you call ‘Mazu,’ not ‘Tianfei.’ Call her Tianfei and she has to comb her hair, put on her crown, change into her good robes before she comes. Call her Mazu and she comes with her hair still down.” She bit off the thread and winked at me. “All of Yuegang knows now. I knew all along. A charm seller reads people better than she reads the wind.” On the last stitch the needle went into her finger. She hissed, put the finger in her mouth, and with her other hand patted my collar, hard."

[tracks.bond_xiao_man.chapters.a2.variants.v2_kept]
text = "After the harbor search, all that was left of the Lin ships at anchor was a few charred keels. Come spring, I would take the family’s last bird-boat to sea. Xiao Man heard, asked nothing, and turned up the next day with her sewing basket. She sat me on the stone block by the door and told me not to move, folded a safe-passage charm down to the size of a fingernail, slipped it into the lining of my collar, and sewed it shut one stitch at a time, the stitches as close as a fishing net. “The old men on the boats say when a big wind hits, you call ‘Mazu,’ not ‘Tianfei,’” she said around the thread. “Call her Tianfei and she has to comb her hair, put on her crown, change into her good robes before she comes. Call her Mazu and she comes with her hair still down.” On the last stitch the needle went into her finger. She hissed, put the finger in her mouth, and with her other hand patted my collar, hard. Then she looked at me and smiled, and said nothing at all. It was exactly the smile she had given me the day I bought my first charm."

[tracks.bond_xiao_man.chapters.s]
title = "A Harbor of One’s Own Choosing"
text = "The wind at the river mouth bit hard in the last month of the year. I carried my red paper lantern down to the rocky bank to find Xiao Man, a red tassel hanging from its base. I’ve been afraid of the dark since I was small, and that lantern has been with me for years. She was already there, in the same spot where we had sheltered from the rain. School was over. In spring I would go with the bird-boat; she would stay. She meant to learn the tiller under an old shipmaster and save for a fishing boat of her own. “Once I have a boat, I’m going to Luzon first. They say the wind there isn’t like ours. It comes up from the south, and it’s warm.” “How do you know it’s warm?” “The ships that come back, their sails are still damp, and they don’t feel cold.” She put her hand out past the ledge into the wind and pulled it straight back. “Feel that. Ours freezes your hand.” Then she took a newly blessed charm from her shirt, not sewn, not folded, and laid it flat on my palm, and closed my fingers over it for me one at a time. “Don’t you hang this one. Hang it when you come back.”"

[tracks.bond_xiao_man.chapters.s.choices.promise]
text = "Make a pact: whoever gets a boat first takes the other out to sea once."
hint = "Whoever gets a boat first takes the other to sea—say it and it’s for life. You aren’t close enough yet to share a boat—or you’ve already promised a lifetime aboard with someone else."
reply = "“That’ll be you, then,” Xiao Man said. “Your family has boats.” “The family boats burned. There’s one left, and come spring it has to earn our keep.” She stopped short, and then her dimples slowly came out. “Then it’s me first.” She held up her palm, I held up mine, and we slapped them together under the ledge so hard the lantern swung. She still wasn’t satisfied. She took my hand and scored a line across the palm with her fingernail. “One boat. One voyage. I pick where.” “Why do you get to pick?” “It’s my boat.” We sat there a long time after that, describing that future boat over and over: a high bow, a dry hold, no lamp on the mast so nobody mistook it for a ghost ship. By the end the tide had come up to our feet. She stood and brushed off her trousers. “Time to go. The day you leave, I won’t see you off. I’ll be at my stall selling charms. Look back from the dock and you’ll see me.”"
effects = [{}, {}, { title = "A Harbor of One’s Own Choosing" }, {}, {}, {}]

[tracks.bond_xiao_man.chapters.s.choices.heart]
text = "Cut a length off the lantern’s tassel, lay it in her palm for the charm, and say nothing."
hint = "Her knife is in your hand, but you can’t make the cut. The lamp in your heart isn’t burning that bright yet—or else you’ve already given that kind of promise to someone else."
reply = "I borrowed her fish-gutting knife, cut a length from the red tassel under my lantern, and laid it in her palm, then put the charm inside my shirt. I said nothing, and she didn’t ask. She looked down at the tassel and rolled its frayed ends between her thumb and finger. Then she wound it around her wrist, once, twice, and tied it off with a fisherman’s knot, the kind that never comes undone. When it was tied, she took my hand and held it tight, so tight her knuckles went white. With its tassel gone, the lantern spun harder in the wind, its light swinging from the river to her face and back. The water kept talking under our feet. I don’t know how long it was before she spoke, quieter than usual. “Your tassel’s shorter now. Will you still dare to walk at night?” “No.” “Then don’t. Leave when it’s light. I can see you from the dock.” She didn’t let go of my hand until the tide came up over the steps."
effects = [{}, {}, {}, {}, { title = "A Harbor of One’s Own Choosing" }, {}, {}]

[tracks.bond_xiao_man.chapters.s.choices.own]
text = "Challenge her: whose boat reaches Luzon first?"
reply = "“Mine,” Xiao Man said without a second’s thought. “I read the wind better than you.” “You’re the one who taught me to row.” “Then it’s mine all the more. When does a master lose to her apprentice?” She tugged the charm halfway out of my hand, then pushed it back. “You keep this. When you get to Luzon, hang it on your boat, so the moment I sail in I’ll know it, and I can laugh at you for being late.” We hooked little fingers on it under the ledge. Even then she wasn’t satisfied. She picked up a shard of roof tile and scratched two marks on the rock face, one long, one short. “The long one’s me.” “Why?” “I scratched first.” She wiped the shard on her shirt and tucked it away. “I’m keeping this. The day you come in late, I’ll show it to you.”"

[tracks.bond_xiao_man.chapters.s.variants.v1_known]
text = "The wind at the river mouth bit hard in the last month of the year. I carried my red paper lantern down to the rocky bank to find Xiao Man, a red tassel hanging from its base. I’ve been afraid of the dark since I was small, and that lantern has been with me for years. She was already there, in the same spot where we had sheltered from the rain. “Wandeng,” she said, as easily as if she had been calling me that for years. School was over. In spring I would go with the bird-boat; she would stay. She meant to learn the tiller under an old shipmaster and save for a fishing boat of her own. “Once I have a boat, I’m going to Luzon first. They say the wind there isn’t like ours. It comes up from the south, and it’s warm.” “How do you know it’s warm?” “The ships that come back, their sails are still damp, and they don’t feel cold.” Then she took a newly blessed charm from her shirt, not sewn, not folded, and laid it flat on my palm, and closed my fingers over it for me one at a time. “Don’t you hang this one. Hang it when you come back.”"

[tracks.bond_xiao_man.chapters.s.variants.v2_kept]
text = "The wind at the river mouth bit hard in the last month of the year. I carried my red paper lantern down to the rocky bank to find Xiao Man, a red tassel hanging from its base. I’ve been afraid of the dark since I was small, and that lantern has been with me for years. She was already there, in the same spot where we had sheltered from the rain. “Brother Lin,” she said, same as always, and then laughed at it herself. School was over. In spring I would go with the bird-boat; she would stay. She meant to learn the tiller under an old shipmaster and save for a fishing boat of her own. “Once I have a boat, I’m going to Luzon first. They say the wind there isn’t like ours. It comes up from the south, and it’s warm.” “How do you know it’s warm?” “The ships that come back, their sails are still damp, and they don’t feel cold.” Then she took a newly blessed charm from her shirt, not sewn, not folded, and laid it flat on my palm, and closed my fingers over it for me one at a time. “Don’t you hang this one. Hang it when you come back.”"

[tracks.reunion_xiao_man]
name = "Xiao Man: Back from Her First Voyage"

[tracks.reunion_xiao_man.chapters.reunion]
title = "Back from Her First Voyage"
text = "In the second year after Yuegang opened to the sea, there were more sails at the mouth of the Jiulong than anyone could count. I waited on the dock three days for a ship coming back from Luzon. It came in riding low, sappanwood piled at the hatches, the rail lined with sailors burned dark by the sun, and they kept calling out, “Captain!” The one they were calling stood by the tiller, barefoot, jabbing a finger at a bollard and scolding a young hand who had tied the wrong knot. “Xiao Man!” She didn’t turn. She undid the knot and tied it again, then gave her orders: sappanwood off first, then the silver, and the water casks scrubbed out tonight. Only when every order was given did she turn around and squint along the dock. One look was all it took. Her dimples came out, and she threw up an arm and waved like mad. “Hey, Lantern! What are you standing way back there for? Scared my ship’s a ghost ship?”"

[tracks.reunion_xiao_man.chapters.reunion.default]
effects = [{ text = "Brother Lin: When the ship came back from Luzon I counted the days on the dock, and when the days ran out, you weren’t there. People in port say your ship went south, and nobody knows when you’ll be back. I can’t wait. The ship has to make the next run. So I’m sending this with a fishing boat bound for Nan’ao. They go once a month, and if you’re anywhere in those waters you’re bound to cross them. A gentleman at the temple is writing this for me. I say a line, he writes a line, and he complains I talk too much. The wind in Luzon is warm, just like I guessed that year. It comes up from the south, and the sails never dry overnight. There’s a Mazu on the shore there too, kept by Fujian folk in a thatched shed. Her incense is nothing next to our Tianfei Temple’s, but the minute a ship ties up, the first thing the crew does is go kowtow to her. The ship is mine now. Half of it, anyway; I still owe for the other half. Eleven sailors, two of them lazy, and I watch them both. There’s a new Mazu charm folded in here. I didn’t buy this one, and no print shop made it. I knelt for it a whole afternoon, so don’t mind the creases. On the back I drew a lamp. It’s ugly, but you’ll know it. In a big wind, remember to call Mazu, not Tianfei. And don’t let your rowing go soft. I’ll test you next time. When you’re next in Yuegang, go to the front of the Tianfei Temple and ask for Xiao Man who sells charms. I stopped selling long ago, but everyone still calls me that. Xiao Man" }, {}]

[tracks.reunion_xiao_man.chapters.reunion.choices.friend]
text = "Go aboard and hear how the Luzon wind is really different."
reply = "She dragged me aboard, sat me on an empty water cask by the tiller, and sat cross-legged on the deck herself, and talked from midafternoon until the lamps were lit. The Luzon wind really did come up from the south, and it really was warm, so warm the sails never dried overnight. The rajah on Manila Bay taxed harder than the customs post at Yuegang; farther south, people said, a band of Spaniards had turned up at Cebu, wearing iron clothes and sweating buckets in them. The Fujian boatmen there had put up a thatched shed on the shore with a little Mazu in it. “Her face is darker than ours at the Tianfei Temple,” she said, perfectly serious. “Sunburn.” Toward the end she laid a hand on the tiller, the way you might rest a hand on a horse’s neck. “This ship is mine now. The old captain got too old and sold her to me. I still owe half.” By full dark the crew were playing finger-guessing games below. Xiao Man stood, stretched, and suddenly swung around to point at me. “Next run, you come with me. I take the tiller, you sit in the bow and tell me ghost stories on the way. The kind that scare you first.”"
effects = [{}, {}, {}, { title = "Back from Her First Voyage" }]

[tracks.reunion_xiao_man.chapters.reunion.choices.rival]
text = "Tell her I made Luzon last year, so this round goes to me."
reply = "Xiao Man’s dimples vanished. “Whose ship did you go on?” “…I took passage on a Quanzhou ship.” “Doesn’t count.” She flung the line in her hand around the bollard. “You went on somebody else’s ship. I went on my own. Passengers don’t get there. Captains get there.” “Who made that rule?” “Me.” We argued on the dock for an hour, from who sighted the Luzon hills first to whose ship sat deeper in the water, until her crew had finished unloading the sappanwood and squatted in a row to enjoy the show. Xiao Man couldn’t win the argument and wouldn’t concede it either. She went to the hatch, came back with a palm-fiber scrub brush, and shoved it into my hands. “Next run, we race. Whoever loses scrubs out the winner’s water casks.” “We haven’t raced this run yet.” “This run you lost. You stood on the dock and watched me come in.” She gave me a push toward the casks. “Scrub, Lantern.”"
effects = [{}, {}, {}, { title = "Back from Her First Voyage" }]

[tracks.reunion_xiao_man.chapters.reunion.choices.love]
text = "Bring out the charm I never hung, and ask her to hang it on my ship."
hint = "You’ve carried that charm all these years. The words you didn’t say back then still won’t come, even standing beside her ship."
reply = "I had carried that charm inside my shirt for eleven years. Its edges were furred, the cinnabar faded to pink. I laid it on her palm the way she had once laid it on mine. “You said hang it when I came back. I’m back.” Xiao Man turned the charm over, then turned it back, and without a word followed me aboard my ship. She chose a crossbeam by the tiller, wound the red cord around it three times, cinched it, and tugged so hard the beam creaked. When it was hung, her hand stayed on it. “Now it’s hung,” she said, with her back to me. “And you can take the tiller yourself. So are you still leaving?” Before I had worked out an answer, she turned, the faded tassel on her wrist brushed my cheek, and she kissed me. Quickly, as if afraid the sailors would see; and then not so quickly. Someone on the dock whistled. Xiao Man didn’t look around. “What are you gawking at? Unload!” Then she bent her head and said against my ear, “If you’re leaving, leave on my ship.”"
effects = [{}, {}, {}, { title = "Back from Her First Voyage" }]

[tracks.reunion_xiao_man.chapters.reunion.variants.v1_with_xu_cai]
text = "In the second year after Yuegang opened to the sea, there were more sails at the mouth of the Jiulong than anyone could count. I waited on the dock three days for a ship coming back from Luzon. It came in riding low, sappanwood piled at the hatches, the rail lined with sailors burned dark by the sun, and they kept calling out, “Captain!” The one they were calling stood by the tiller, barefoot, jabbing a finger at a bollard and scolding a young hand who had tied the wrong knot. “Xiao Man!” She didn’t turn. She undid the knot and tied it again, then gave her orders: sappanwood off first, then the silver. At the far end of the dock Xu Cai stood waiting for her, holding up a charm from the Tianfei Temple. Xiao Man smiled that way first, and only then turned and squinted along the dock toward me. One look was all it took. Her dimples came out, and she threw up an arm and waved like mad. “Hey, Lantern! What are you standing way back there for? Scared my ship’s a ghost ship?”"

[tracks.reunion_xiao_man.chapters.reunion.variants.v2_tassel]
text = "In the second year after Yuegang opened to the sea, there were more sails at the mouth of the Jiulong than anyone could count. I waited on the dock three days for a ship coming back from Luzon. It came in riding low, sappanwood piled at the hatches, the rail lined with sailors burned dark by the sun, and they kept calling out, “Captain!” The one they were calling stood by the tiller, barefoot, jabbing a finger at a bollard and scolding a young hand who had tied the wrong knot. “Xiao Man!” She didn’t turn. She undid the knot and tied it again, then gave her orders: sappanwood off first, then the silver, and the water casks scrubbed out tonight. Only when every order was given did she turn around and squint along the dock. One look was all it took. Her dimples came out, and she threw up an arm and waved like mad. Around her wrist was a length of red tassel, faded long ago to the color of old brick, still tied with the same knot. “Hey, Lantern! What are you standing way back there for? Scared my ship’s a ghost ship?”"
