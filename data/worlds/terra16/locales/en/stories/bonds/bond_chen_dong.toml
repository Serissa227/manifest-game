text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I set the tablet I had carried for seven years on the table. He glanced at it, didn’t touch it, and held out his hand. “Manifest.” I spread it out and read it item by item: pepper, sappanwood, ivory. He checked each one, his questions exact and cold, as if he had never sat beside me on the bluestone at the drill ground. When I finished the last item he raised his eyes. “Lin Wandeng.” He said it easily, like one more item on the manifest, as if he had long since worn the name smooth. On the table the tablet and the manifest lay side by side, and his men stood behind him, waiting for his word."
