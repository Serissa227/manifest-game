# C7 英文覆盖：陈栋（棍下的规矩 / 站在两边）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_chen_dong]
name = "Chen Dong: Rules at Staff’s Length"

[tracks.bond_chen_dong.chapters.c1]
title = "Rules at Staff’s Length"
text = "The gong had barely sounded the end of lessons when a practice staff came down across the lane outside the school. Chen Dong had one foot braced on the wall and the staff leveled at waist height. “Brother Lin. Dare you?” Heads were already poking out at both ends of the lane. I swung my book bag behind my back and asked first, “If somebody gets hurt, whose fault is it?” He stared, as if nobody had ever asked him that before a bout. Then, without a word, he ran into the kitchen, came back with two old rags, and wound them round and round both ends of the staff until they were fat as dumplings. “Three passes with the staff, then we talk.” Once we started he gave me nothing. On the third pass he pinned my staff to the ground and I lost by a body’s length. But on his last stroke, the tip had been heading straight for my wrist, and halfway there it slid an inch aside and cracked the flagstone by my foot. I stood shaking out my wrist and looking at him. He was already crouched, unwinding the rags, slowly, without looking up."
news = "In the lane outside the Yuegang school, the son of Captain Chen of the Zhenhai Garrison has been stopping people for staff bouts again. This time he wrapped the ends in rags so nobody gets hurt."

[tracks.bond_chen_dong.chapters.c1.choices.wrap_tight]
text = "Help him rewrap the staff ends tight, with two matching knots."
reply = "I took the rags and wound them three times the way we lash lines on a ship, then tied two identical knots. He crouched and turned them over and back. “Nobody in Zhangzhou ties them like that.” “In Yuegang we do. The harder you pull, the tighter they get. Even a gale can’t work them loose.” He grunted, plucked at a knot twice, and left it. The next day the staff was leaning by the schoolroom door, both knots still on it."

[tracks.bond_chen_dong.chapters.c1.choices.fake_wrist]
text = "Rub my wrist, say I’ve twisted it, and call the rematch for another day."
reply = "He narrowed his eyes at my wrist and kept looking, so long that the crowd at the end of the lane drifted off. “Another day, then.” Early next morning he was waiting at the mouth of the lane with a little porcelain bottle in his fist. In the schoolroom he set it on my desk. A strip of red paper on the side said “Bruise Liniment,” the ink not quite dry. He went back to his seat and didn’t look my way all morning."

[tracks.bond_chen_dong.chapters.c2]
title = "The Same Opening"
text = "Chen Dong kept hitting me in the same place. Every time my right foot stepped in, my left side opened, and his staff tip was there. Nine times in one afternoon. On the tenth I pulled my staff back. “Stand still. Let me walk that step until I’ve got it.” “Stand still?” He planted his staff. “I’m not a post.” “A post doesn’t hit back. You do. That’s why I want you.” He said nothing more, and stood. I came at him one step at a time, and his staff tip hung a fist’s width from my ribs, never pressing in, never pulling away. The bluestone at the edge of the drill ground was hot from the sun, its top worn to a shine by who knows how many years of soldiers sitting on it. A classmate’s head popped up over the wall. “Why’d you stop? Chen Dong, you going easy on him?” Chen Dong didn’t turn around. “We haven’t finished the rules.” The head started to ask which rules. He thumped his staff on the ground, and it ducked out of sight."
news = "The bluestone at the edge of the Yuegang garrison’s drill ground has been taken over by schoolboys all summer. Captain Chen’s son spars with them there every day, and the soldiers walk the long way around."

[tracks.bond_chen_dong.chapters.c2.choices.drill_step]
text = "Ask him to stand right there as my target until he says “Good enough.”"
hint = "He slings the staff over his shoulder and walks off. He doesn’t know you well enough yet to stand there for you."
reply = "He stood for two hours and his staff tip never wavered. I asked if it was good enough. “Again.” I asked again. “Again.” Only when the sun dropped behind the barracks did he lower the staff. “Good enough.” My legs gave out and I sat down on the bluestone, still warm. He sat too, a body’s width away, and wiped the sweat off his staff with his sleeve."

[tracks.bond_chen_dong.chapters.c2.choices.ghost_story]
text = "When we’re worn out, sit on the bluestone and tell him a Yuegang water-ghost story."
reply = "I got to the part where the water ghost reaches up through the hull and grabs your ankle, dropped my voice, and gave myself goose bumps. Chen Dong chewed on a blade of grass. “I’m not scared.” But once it was full dark he followed me with his staff all the way to the school lane, and only then mentioned that his house was on the way. His house was at the garrison, half a city in the other direction."

[tracks.bond_chen_dong.chapters.b1]
title = "Who Admits the Loss"
text = "On the day of the autumn earth-god festival the whole school crowded the edge of the drill ground to watch. Chen Dong and I traded more than thirty passes. On the thirty-seventh his staff came up from under mine, mine flew out of my hands and rolled twice on the ground. Someone yelled, “Young Master Chen, what a hero!” Chen Dong brought his staff down on the flagstones with a crack that made everyone jump, and the yelling stopped. He bent, picked up my staff, and handed it back by the middle, tip down. “You tell me. Where did you lose?” I took it. My palms were still stinging. “Third step. My foot landed early and my weight was all forward, so one flick lifted me.” I paused. “And you. You were half a beat slow pulling back. If I hadn’t panicked, that half beat was enough to rap your knuckles.” Everyone turned to look at his face. He didn’t say a word. He stepped back to his mark and did the last flick and recovery over again, very slowly."
news = "At the autumn festival the Yuegang schoolboys held staff bouts on the garrison drill ground, and Captain Chen’s son won. When somebody cheered him for a hero, he cracked his staff on the ground and told them to shut up."

[tracks.bond_chen_dong.chapters.b1.choices.own_fault]
text = "Grab his sleeve and take that flick and recovery apart, step by step, until we settle it."
reply = "He listened as I took it apart, and at the third step he nodded. “That one, I saw too.” When I got to his half-beat recovery, he lifted his chin. “That one I don’t concede.” “You just did it over yourself.” “Showing you is one thing. Conceding is my business.” We argued from the drill ground to the lane and from the lane to nightfall, until the bean-curd seller packed up his poles. When we split up he said, “Tomorrow. We’ll see who fixes it first.”"

[tracks.bond_chen_dong.chapters.b1.choices.rematch_now]
text = "Raise my staff and demand another bout, right now."
reply = "He looked down at the hand holding my staff. “Tomorrow. When your hand stops shaking.” The next day I lost again, but this time on the fifth step. He lowered his staff. “You’re getting better.” He turned and left as soon as he said it, walking fast. I ran around in front of him to see his face. He turned it away, but I caught the corner of his mouth twitching up before he forced it flat."

[tracks.bond_chen_dong.chapters.b2]
title = "Two Questions"
text = "In the fifth month the news from the sea got worse every day. Raiders had come into the coves outside the mouth of the Jiulong River and burned two villages, and the garrison sent men to the shore overnight. Chen Dong’s family sent word for him to report back. The day before he left, he sat in the school’s covered walk cleaning his staff. The wood had been gray; by the time he was done it had a dark red shine you could see the pillars in. He stopped rubbing. “Brother Lin, let me ask you something. From now on, when you see somebody in garrison clothes, will you take every one of them for a man standing in your way?” I didn’t answer right away. My family’s ship had come back from the south the month before and lay at anchor in Yuegang, and what was in her hold, the garrison would seize on sight. “Then let me ask you something,” I said. “When you see people coming in off the sea, will you take every one of them for a thief?” He looked up at me. Outside it had started to rain, and water dripped off the eaves into the courtyard cistern, once, then again. He laid the staff across his knees and polished a spot that was already clean."
news = "Raiders got into the coves outside the Jiulong River mouth and burned two villages, and the Yuegang garrison manned the shore overnight. Even the captain’s son from the school was called back to camp."

[tracks.bond_chen_dong.chapters.b2.choices.swap_answers]
text = "Make a deal: ask names before judging people, and next time we meet, each answer the other’s question."
hint = "He slides the staff into its cloth case and stands up. He won’t make that kind of deal with you yet."
reply = "He held out his hand and I slapped it, hard. “I’ll answer first,” he said. “There are good men in the garrison. Me, for one.” “Then here’s mine. There are good people at sea. Me, for one.” He laughed out loud. In more than a year, it was the first time I had ever heard him laugh. Then he straightened his face. “We still haven’t asked names.” “Lin—” “I know.” He shouldered his staff and walked out into the rain."

[tracks.bond_chen_dong.chapters.b2.choices.lie_farmers]
text = "Lie: say my family farms and has nothing to do with the sea."
reply = "He looked at me for a long time and said nothing. He slid the clean staff into its case. “Farmers have to watch for raiders too.” Days after he left, it came to me: last winter he had gone on a patrol of Yuegang with the garrison men, and the ship flying the Lin flag at the wharf, he had seen it."

[tracks.bond_chen_dong.chapters.a1]
title = "Under the Eaves"
text = "We were let out late, straight into a night rain. Chen Dong hauled me under the school’s eaves, let go at once, and stepped back to the edge himself. Water ran off the roof in a single line that landed right on his left shoulder, and soon half his coat was soaked. “Come in a bit,” I said, and moved half a step over. “Not cold.” The eaves were only so wide, and the dry half I had made for him stayed empty. The rain was loud, the lane was deserted, and across the way the lamps went out one by one. He didn’t talk, so I didn’t either. All I heard was the line of water off the eaves striking the stone step and wearing a row of little pits in it. Only when the pits had filled with water did the rain ease, and the line break into drops. Then he spoke, looking off toward the end of the lane. “Still practicing tomorrow?” “Sure.” “Then we practice.” A pause. “Your third step still lands early. Somebody has to keep an eye on Brother Lin’s feet.”"
news = "It has rained every night in Yuegang since spring began. The school’s gutters are blocked again, and pupils let out late have to crowd under the eaves until the rain stops, sometimes till the night watchman comes by."

[tracks.bond_chen_dong.chapters.a1.choices.dash_out]
text = "Pull my coat over my head, run into the rain, and shout back: rematch tomorrow!"
reply = "I was three steps out when he shouted from the eaves, “Stop!” I didn’t. I splashed all the way home with my shoes full of water. The next day he frowned the moment he saw me and said I would catch my death doing that. Then he said that from now on, on rainy days we wouldn’t go to the drill ground. We would practice footwork in the schoolroom instead, no need to go out. While he said it, his left sleeve still hadn’t dried."

[tracks.bond_chen_dong.chapters.a1.choices.share_eaves]
text = "Say nothing, and give him a little more of the dry space."
hint = "Make room for him now and he’d only turn and walk off into the rain. You aren’t close enough yet."
reply = "He looked at the dry patch, then at me, hesitated, and moved in half a step. The line of water slid off his shoulder and fell behind his heels. We stood against the same pillar, our shoulders a fist apart. It rained until the second watch. When the night watchman went by the end of the lane with his clapper, Chen Dong finally said, “Come on. I’ll walk you.”"

[tracks.bond_chen_dong.chapters.a2]
title = "Standing in Front"
text = "In the seventh month, when soldiers searched the harbor, the Lin family’s ship burned at her mooring. In the ninth, the stump of her mast still stood up out of the water. The garrison came again, and this time they came into the school. Three soldiers blocked the schoolroom door, and their leader leafed through a register. “The Lin boy from Yuegang. He studies here, doesn’t he? Bring him out. We have questions.” Nobody in the room made a sound. My brush stopped on the paper and the ink spread into a round blot. Chen Dong stood up first. He carried his staff to the door and planted himself in front of the soldiers. “Ask me.” “And who are you?” “Son of Captain Chen of the Zhenhai Garrison. Brother Lin has sparred with me for three years. Which hand he leads with, how many bowls of rice he eats, how scared he gets at night after a ghost story, I know better than his own father. If you have questions, ask me.” The leader looked past his shoulder into the room. Chen Dong shifted half a step and blocked the look. One hand rested on his staff. The other was behind his back, clenched around something so hard his knuckles were white."
news = "After the Lin family’s ship burned in Yuegang, garrison soldiers came asking about the family at the school. Captain Chen’s son stood in the doorway leaning on his staff and told them to ask him first."

[tracks.bond_chen_dong.chapters.a2.choices.take_buckle]
text = "Once the soldiers are gone, take the thing he’s hiding behind his back and put it on."
hint = "He never does bring it out. You aren’t close enough yet, and he can’t bring himself to offer it."
reply = "It was a wooden belt buckle, the edges still rough, with a staff carved on the back, crooked. “Bad knife,” he said. “Bad staff,” I said. He turned and walked off, got five or six steps, then came back and watched me fasten it. He reached out and gave my belt a tug. “Tighter. A loose belt loses you fights.”"
effects = [{}, {}, {}, { title = "Standing in Front" }]

[tracks.bond_chen_dong.chapters.a2.choices.stand_beside]
text = "Get up, walk over, and stand at his side instead of behind him."
hint = "That step is still beyond you. You haven’t been through enough together to stand shoulder to shoulder."
reply = "The leader looked at him, then at me, muttered something, and took his men away. He kept his voice low. “What did you come out for?” “You looked silly standing there alone.” He didn’t answer. He brought the hand out from behind his back and pushed something into mine: a wooden belt buckle, the edges still rough, freshly carved. His palm was slick with sweat, and the buckle was damp from it."
effects = [{}, {}, {}, {}, { title = "Standing in Front" }]

[tracks.bond_chen_dong.chapters.a2.choices.ask_why]
text = "Once the soldiers are gone, go after him and ask why he stood in for me."
reply = "“Rules,” he said. That was all. I chased him asking what rules, whose rules, and he walked so fast I had to trot to keep up. All the way to the end of the lane, the hand behind his back stayed closed, and whatever he was holding, he never did show me."

[tracks.bond_chen_dong.chapters.a2.variants.known]
text = "Since the seventh month, the whole school knew that “Brother Lin” was in fact the Lin family’s daughter. By the ninth month the talk behind my back still hadn’t stopped. Some said no wonder I always lost at staff. Some said the Lin ship had it coming. Then the garrison came too, and blocked the schoolroom door. “Is the Lin girl here? Bring her out. We have questions.” The room went still, and a lot of eyes turned my way. Chen Dong stood up with his staff, walked to the front of my desk, and stood with his back to me and his face to the door. “Staffs straight first. Questions wait their turn.” Someone at the back whispered, “Chen Dong, did you know all along?” He didn’t turn his head. “So what if I did.” The leader of the soldiers took a step toward us. Chen Dong thumped his staff down and didn’t move. One hand rested on the staff. The other was behind his back, clenched around something so hard his knuckles were white."

[tracks.bond_chen_dong.chapters.s]
title = "The Borrowed Tablet"
text = "In the twelfth month the school closed. The teacher pasted a seal across the door, and the desks were stacked against the wall. I was going back to Yuegang. The Lin ship had burned, but I still had to go to sea, even on someone else’s ship. Chen Dong was waiting at the end of the lane. He untied a wooden tablet from his belt, branded with the Zhenhai Garrison’s mark, its corners worn shiny. “Take it. There are garrison checkpoints on the road south. When you go through, give them your own name first, then show them this.” He pressed the tablet into my palm. “No need to pass yourself off as anybody.” “This is your tablet.” “I’m lending it. Once you’re safely through that stretch, give it back.” He pulled his hand away, put it behind his back, and stepped back a pace, the way he opened distance before a bout. “Brother Lin. Take care on the road.”"
news = "When the Longxi school closed for the winter, the son of Captain Chen of the Zhenhai Garrison saw off a classmate bound for the sea at the end of the lane, and untied the tablet from his own belt."

[tracks.bond_chen_dong.chapters.s.default]
news = "The day the Longxi school closed, Captain Chen’s son waited at the end of the lane for a classmate until dark. Nobody came, so he left his tablet with the old gatekeeper to pass on and went back to the garrison."

[tracks.bond_chen_dong.chapters.s.choices.promise]
text = "Take the tablet, and promise that once I’m through, I’ll bring it to the garrison and put it in his hand."
hint = "You’ve already given your one promise of a lifetime to someone else. You can borrow the tablet, but you can’t promise on it."
reply = "I took out a handkerchief, wrapped the tablet twice, and tucked it into an inside pocket. “When are you at the garrison?” “Every day.” “Then I’ll pick a day you’re out, hand it to the guard at the gate, and have him pass it on.” “Don’t you dare.” He glared at me. “When you bring it back, you put it in my hand. If a corner’s missing, I’ll settle with you.” I said the sea was rough and a corner might go missing. He thought about it, pulled a length of thin hemp cord from his coat, and bound the handkerchief bundle once more with a hard knot, then another on top of it. “Now it won’t.” He turned toward the garrison. At the corner of the lane he looked back and shouted, “Remember, your own name first!”"
effects = [{}, {}, {}, {}, { title = "The Borrowed Tablet" }, {}]

[tracks.bond_chen_dong.chapters.s.choices.heart]
text = "Take the tablet and tell him: on the day I bring it back, there’s something I have to say to his face."
hint = "The words reach your lips, and he has already stepped back a staff’s length. You haven’t come that far yet, or your one promise of a lifetime is already someone else’s."
reply = "He put both hands behind his back, as if afraid he would drop whatever they were holding. “Say what?” “I’ll tell you the day I bring it back.” “Can’t you say it now?” “No.” His ears went red, but his mouth stayed stubborn. “Then I’ll stand at the garrison gate every day until you come.” “Even if it takes ten years?” “Even then.” “In the rain?” “In a rain of knives.” A wind came up the lane and plastered his sleeves to his arms. Suddenly he reached out and squeezed the hand that held the tablet, quick as a feint in a bout, touch and gone, then let go. “Go on,” he said. “Ships don’t wait.” I was out of the lane before I noticed the tablet in my palm was warm. I held it all the way home and it never cooled."
effects = [{}, {}, {}, {}, { title = "The Borrowed Tablet" }, {}]

[tracks.bond_chen_dong.chapters.s.choices.own]
text = "Push the tablet back: no loan. See you at sea, and stop my ship like anyone else’s."
reply = "He looked at the tablet I had pushed back and didn’t move for a long moment. Then he took it and tied it back on his belt, very tight. “Fine. See you at sea.” “You’ll stop me?” “I’ll stop you. Don’t run.” “I’m faster than you.” “When were you ever faster than me?” “The sea isn’t a staff bout.” He held his mouth straight, held it, and finally couldn’t. “Then we race. The day your ship comes past my checkpoint, I’ll be the first one on your deck.” I said I’d fly a big flag so he wouldn’t miss me. He said there was no need. “I’d know your ship from miles off.” He shouldered his staff, got two steps, and looked back. “Lose, and no backing out.” I shook my fist at his back."
effects = [{}, {}, {}, { title = "The Borrowed Tablet" }, {}]
news = "The day the Longxi school closed, Captain Chen’s son tried to lend his tablet to a classmate bound for the sea. The classmate pushed it back, and the two agreed to settle things at sea."

[tracks.bond_chen_dong.chapters.s.variants.known]
text = "In the twelfth month the school closed. The teacher pasted a seal across the door, and the desks were stacked against the wall. I was going back to Yuegang. The Lin ship had burned, but I still had to go to sea, even on someone else’s ship. Chen Dong was waiting at the end of the lane. He untied a wooden tablet from his belt, branded with the Zhenhai Garrison’s mark, its corners worn shiny. “Take it. There are garrison checkpoints on the road south. When you go through, give them your own name first, then show them this.” He pressed the tablet into my palm. “No need to pass yourself off as anybody.” “This is your tablet.” “I’m lending it. Once you’re safely through that stretch, give it back.” He pulled his hand away, put it behind his back, and stepped back a pace, the way he opened distance before a bout. “Lin Wandeng,” he said. It was the first time he had ever used my full name, and he said it stiffly, like a name read off a garrison roll. “Take care on the road.” Then he was the one who looked away."

[tracks.reunion_chen_dong]
name = "Chen Dong: On Opposite Sides"

[tracks.reunion_chen_dong.chapters.reunion]
title = "On Opposite Sides"
text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I set the tablet I had carried for seven years on the table. He glanced at it, didn’t touch it, and held out his hand. “Manifest.” I spread it out and read it item by item: pepper, sappanwood, ivory. He checked each one, his questions exact and cold, as if he had never sat beside me on the bluestone at the drill ground. When I finished the last item he raised his eyes. “Brother Lin.” He said only that, and nothing after. On the table the tablet and the manifest lay side by side, and his men stood behind him, waiting for his word."
news = "Since Qi’s troops came into Fujian, there’s a new checkpoint at the Jiulong River mouth below Yuegang that searches private ships harder than it ever hunted raiders. The garrison officer in charge, a man named Chen, always keeps a staff by his hand."

[tracks.reunion_chen_dong.chapters.reunion.default]
news = "That garrison officer named Chen at the Yuegang checkpoint sent a letter south with a private ship. The crew say the whole letter was three lines long."
effects = [{ text = "I’ve had a word with the men on the checkpoints. Just give your own name. There are still raiders at sea, so steer clear of Wuyu. Next time we meet, we spar first. —Chen Dong" }, {}]

[tracks.reunion_chen_dong.chapters.reunion.choices.return_tablet]
text = "Push the tablet back across the table to him, declare the cargo honestly, and ask him for a bowl of tea."
reply = "He picked up the tablet, wiped it on his sleeve, and tied it back on his belt as tight as he used to. Then he ran a thumbnail down the manifest and struck two lines. “That’s not sixty piculs of sappanwood, it’s seventy. Two pairs of tusks, and a broken one under the hold floor. Declare that too.” I glared at him. “I can tell how deep your ship sits from the shore.” I corrected it. He stamped it and had two bowls of the garrison’s coarse tea brought, a layer of stems floating on top. We drank across the table. He asked where I’d been all these years, I asked which year he got the scar. Last year, he said, off Wuyu, and wouldn’t say more. When we reached the bottom he turned his bowl over. “Don’t let me catch you next time.” “You won’t.” “We’ll see.” He pushed the empty bowl toward me. “You’re paying for the tea.”"
effects = [{}, {}, {}, { title = "On Opposite Sides" }]
news = "At the Yuegang checkpoint a private ship’s master argued over a manifest with the garrison officer Chen for half the day. In the end they sat down to a bowl of coarse tea, and the master paid."

[tracks.reunion_chen_dong.chapters.reunion.choices.run_the_post]
text = "Snatch the tablet and the manifest off the table, jump aboard, and run the checkpoint in front of him."
reply = "Chen Dong’s hand came down on the table a moment too late. I was already over the rail, shouting for the crew to weigh anchor. He shouted “Stop!” behind me. I didn’t. The ship rode the ebb out, and he ran along the shore after us, past two jetties and a beach of drying nets, a good three hundred yards, until the beach ran out and he had to stop. He drove his staff into the sand. “Next time!” I hung over the rail and shouted back, “Three passes with the staff first—then come after me!” Across the water I heard him curse me, laughing. I couldn’t make out the words, only that his men were laughing too. The crew asked who that was on the shore. I said a man who owes me a staff bout. The tablet dug into my ribs inside my coat all the way out."
effects = [{}, {}, {}, { title = "On Opposite Sides" }]
news = "A private ship weighed anchor at the Yuegang checkpoint without handing over its manifest. The garrison officer Chen chased it three hundred yards along the shore, never fired a shot, cursed once, and laughed at himself after."

[tracks.reunion_chen_dong.chapters.reunion.choices.the_words]
text = "Say to his face what I promised to say the day I brought the tablet back."
hint = "Those words were never promised, so today the two of you can only stand on opposite sides of the checkpoint."
reply = "I said it. It was short, shorter than I had planned all those years ago. Everyone in front of and behind the checkpoint was watching. He didn’t care. He took off his cap and turned it once in his hands. “I waited seven years.” “For what?” “For you to come. For you to say it.” He looked at me. “I knew long ago.” “Knew what?” “That you’d come. And that you’d say that.” He handed his cap to the nearest soldier and told them to wave the next ships through. The men blinked, then waved them through one by one, careful not to look our way. Then he took my wrist. His hand was bigger than it used to be, the web of his thumb callused from the staff. He led me under the eaves of the little guardhouse by the checkpoint. It wasn’t raining that day. This time he didn’t let go."
effects = [{}, {}, {}, { title = "On Opposite Sides" }]
news = "That garrison officer Chen at the Yuegang checkpoint took off his cap in front of a whole line of ships waiting to be searched and led one ship’s master under the guardhouse eaves. The ships behind went through unsearched that day."

[tracks.reunion_chen_dong.chapters.reunion.variants.v1_own_kept]
text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I held out my manifest. He didn’t take it. First he untied a tablet from his belt and slapped it down on the table: the same one I had pushed back to him years ago, its corners worn shinier. “You said see you at sea,” he said. “Well, here we are.” Only then did he hold out his hand. “Manifest.” Pepper, sappanwood, ivory: I read each item and he checked each one, his questions exact and cold. When I finished the last, he raised his eyes and kept them on me until his men behind him started clearing their throats. “Brother Lin—” He dropped his voice so only I could hear. “Or should I be calling you something else?” The manifest stopped in midair in my hand."

[tracks.reunion_chen_dong.chapters.reunion.variants.v2_own_known]
text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I held out my manifest. He didn’t take it. First he untied a tablet from his belt and slapped it down on the table: the same one I had pushed back to him years ago, its corners worn shinier. “You said see you at sea,” he said. “Well, here we are.” Only then did he hold out his hand. “Manifest.” Pepper, sappanwood, ivory: I read each item and he checked each one, his questions exact and cold. When I finished the last, he raised his eyes. “Lin Wandeng.” He said it easily, like one more item on the manifest, as if he had long since worn the name smooth. On the table the tablet lay on top of the manifest, and his men stood behind him, waiting for his word."

[tracks.reunion_chen_dong.chapters.reunion.variants.v3_own]
text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I held out my manifest. He didn’t take it. First he untied a tablet from his belt and slapped it down on the table: the same one I had pushed back to him years ago, its corners worn shinier. “You said see you at sea,” he said. “Well, here we are.” Only then did he hold out his hand. “Manifest.” Pepper, sappanwood, ivory: I read each item and he checked each one, his questions exact and cold. When I finished the last, he raised his eyes. “Brother Lin.” He said only that, and nothing after. On the table the tablet lay on top of the manifest, and his men stood behind him, waiting for his word."

[tracks.reunion_chen_dong.chapters.reunion.variants.v4_kept]
text = "Since Qi’s troops came into Fujian there were fewer raiders, and more checkpoints at the mouth of the Jiulong River. They searched private ships harder than they had ever searched for raiders. Mine was third in line. When my turn came, the officer behind the checkpoint’s long table wore a garrison coat, a saber at his belt, and a staff leaning by his hand, polished to a shine. It was Chen Dong. He had filled out, and there was a new scar through one eyebrow. I set the tablet I had carried for seven years on the table. He glanced at it, didn’t touch it, and held out his hand. “Manifest.” I spread it out and read it item by item: pepper, sappanwood, ivory. He checked each one, his questions exact and cold, as if he had never sat beside me on the bluestone at the drill ground. When I finished the last item he raised his eyes and kept them on me until his men behind him started clearing their throats. “Brother Lin—” He dropped his voice so only I could hear. “Or should I be calling you something else?” The manifest stopped in midair in my hand. The tablet on the table, he still hadn’t touched."

