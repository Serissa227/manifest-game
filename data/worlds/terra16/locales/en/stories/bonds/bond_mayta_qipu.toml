# 迈塔·基普：先数结（bond_mayta_qipu / reunion_mayta_qipu）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_mayta_qipu]
name = "Mayta Qipu: Count the Knots First"

[tracks.bond_mayta_qipu.chapters.c1]
title = "Count the Knots First"
text = "Our family’s balsa raft had only just been hauled steady on the beach at Callao when a Spanish merchant came over waving a bill. Forty-two bales of cotton were to go aboard, bound north for Paita. The writing on his bill was straight and close, and he tapped the last line with a finger. “Forty-two. The notary signed it.” In front of the gangplank stood Mayta Qipu, the one at our family school who learned his cords from old Kusi, and who on an ordinary day said fewer than ten words. He lifted a cord crowded with knots and blocked the plank. “Count the knots first, then load.” He had tied that cord in the cotton shed the day before, and it held forty bales. The merchant laughed, called him an unlettered country boy, and asked whether a bit of string was supposed to beat a notary’s ink. Mayta said nothing. He slung the cord over his shoulder, crouched, and felt his way along the bales one by one, pinching a knot with his thumb at each. At the fortieth he paused, then went on to the last two, pushed his hand into the cotton of the final bale and drew out a fistful of straw. He looked up at the merchant, and his chin rose, a little at a time."

[tracks.bond_mayta_qipu.chapters.c1.choices.count_with_him]
text = "Crouch down at the other end and count the bales with him."
reply = "I started from the other end and went faster than he did. I called “forty-two” first and pulled a fistful of straw out of the forty-first. Mayta gave me a sidelong look. “Fast is nothing. Right is something.” In the end the merchant paid for two bales of cotton. Mayta weighed the coins in his palm, split them, and pushed half into my hand without a word."

[tracks.bond_mayta_qipu.chapters.c1.choices.bet_on_paper]
text = "Take the merchant’s side and bet Mayta he has miscounted."
reply = "I bet a jar of chicha. When the straw came out of the bale, the merchant went red first, and I went red right after him. The jar was at Mayta’s house by evening. He drank with his chin held high, and when it was empty he pushed the jar back across to me. “Next time, don’t bet against a cord.”"

[tracks.bond_mayta_qipu.chapters.c2]
title = "Rafts Taken for the War"
text = "There was fighting up toward Lima. People said a man named Girón had risen in revolt in the south, and soldiers sent out from Lima were seizing boats and grain wherever they went. That day a squad of them came onto the beach at Callao. Their leader read out a paper, and then they pushed the three rafts the Chincha families had hauled ashore back into the water, carried twenty sacks of maize out of the sheds, and lugged out the big pot we brewed chicha in. “We’ll settle up when the war’s over.” That was all the leader said. Nobody dared stop them. Mayta followed the soldiers without a word, tying a knot at every step: three rafts, one big knot each; the maize, a string of twenty small ones. When two soldiers carried the pot off toward the road, he tied a knot I had never seen before, and he pulled it hard. Then he turned and pushed the cord into my hands. The end of it was still wet. “You can write Spanish. Write it out alongside,” he said. “Then they can’t wriggle out of it.”"

[tracks.bond_mayta_qipu.chapters.c2.choices.write_beside]
text = "Borrow paper and pen and write it all out in Spanish, line by line, to match his knots."
hint = "He asked you to write, but his hand hasn’t let go of the cord. You aren’t close enough yet for him to trust this account to your letters."
reply = "I knelt in the sand and wrote: three rafts, twenty sacks of maize. When I got to the pot, Mayta put his hand on my pen. “Write ‘the only big pot in the village.’” I wrote it his way. He took the paper and studied it a long time, then looked at his own cord. “Your letters can do a knot’s work too.” He folded the paper in four, tied it with the tail of the cord, and bound it up with the knots."

[tracks.bond_mayta_qipu.chapters.c2.choices.wait_till_gone]
text = "The soldiers are still close. Tell him to put the cord away before it gets him in trouble."
reply = "He ignored me. He pulled the cord back out of my hands and followed the soldiers all the way to the road, watched the pot go up onto a mule, and tied one more knot at the tail for the day itself before he turned back. The three rafts, the twenty sacks and the pot never came back. He hung the cord from the lintel of his family’s door, so that everyone who came in had to duck under it."

[tracks.bond_mayta_qipu.chapters.b1]
title = "A Race of Knots"
text = "The master at our family school had thought up a contest: when a fishing boat came in, whoever got the count of the catch down first would win. Mayta used a cord. I used paper. The fish came down off the boat basket after basket, bonito, mullet, a few I didn’t know. Mayta’s fingers flew along the cord too fast to follow, a knot for each basket, an extra one for the big fish, and he called “Done” a good while ahead of me. The master told us to read our counts to the boat’s owner. Mayta felt his way along the cord knot by knot, and the owner frowned; I read the figures off my paper, and the owner couldn’t read Spanish, so he frowned harder. In the end he pushed us both aside, crouched, and counted the whole catch himself. His count matched Mayta’s cord to the fish, and missed my paper by two. The master gave it to Mayta, and the prize was the biggest bonito on the boat. Mayta carried it over to me by the tail and swung it under my nose, his chin in the air. “Can you cook a fish that’s on paper?”"

[tracks.bond_mayta_qipu.chapters.b1.choices.learn_fast_knot]
text = "Admit defeat and ask him to teach me that fastest knot."
hint = "He’s just won and he’s full of it. Ask him now and he’ll only wave the fish at you."
reply = "He was a harsh teacher. Every time I got it wrong he yanked it apart; I got it wrong again, and he yanked it apart again. By somewhere past the tenth time the end of the cord had gone fuzzy. Near dark I tied one right. He didn’t praise it. He turned, set the bonito over the fire, and tore off half for me. “You get the tail end. Lots of bones. Eat slowly.”"

[tracks.bond_mayta_qipu.chapters.b1.choices.rematch]
text = "Refuse to concede. Next month we race again, for whose count the owner can read."
reply = "“Then what’s the point of racing?” said Mayta. “I’ll just teach the owners to read knots.” I thought he was sulking. A month later, at the rematch, three boat owners on the dock held his cords and read their own catches off them aloud. I balled up my paper, stuffed it in my sleeve, and lost fair and square."

[tracks.bond_mayta_qipu.chapters.b2]
title = "Explaining to Someone Who Does Not Know"
text = "I had gone down to the shore to pick up wedges that had dropped off the rafts, and as I came around a rock I heard someone talking. It was Mayta, alone, facing the rock with a short cord in his hands, explaining it line by line. “This strand is Chincha, this strand is Paita. The knot hanging below is ten, ten bundles of spondylus…” Halfway through he stopped, as though waiting for the rock to answer, and when it didn’t he started again from the top. Then he turned and saw me, and went red all the way down his neck. “Practice,” he said, very fast. “Next year a clerk is coming down from Lima to check the Chincha accounts. Old Kusi’s getting on. The clerk can’t understand what he says, and he doesn’t care to understand the clerk.” He thrust the practice cord into my hands. The knots were still damp. “You play the clerk,” he said. “Don’t go easy on me.”"

[tracks.bond_mayta_qipu.chapters.b2.choices.play_the_clerk]
text = "Put on a stern face, play the clerk, and pick the nastiest questions."
hint = "He said not to go easy on him, but he won’t meet your eyes. You aren’t close enough yet; if you stump him now, he won’t be able to bear it in front of you."
reply = "I put on a clerk’s voice and asked it word by word. “By what right is this knot ten? Who decided? Where is it written?” Mayta opened his mouth and nothing came. He grabbed the cord and lashed my arm with it, and that day he stalked off. Early the next morning he was standing by the rock waiting for me. “Ask me again. I’ve worked it out.”"

[tracks.bond_mayta_qipu.chapters.b2.choices.play_old_captain]
text = "Play a half-deaf old raft owner and make him go slowly."
reply = "I squatted on the rock, and every time he said something I bawled back, “Eh?” So he had to take each knot apart and explain it, from Chincha all the way to Paita, until the sun went into the sea. By the end I really did understand how to read a raftload of spondylus off a cord. He wiped the sweat off his face. “Explaining to someone who doesn’t know is harder than explaining to a clerk.”"

[tracks.bond_mayta_qipu.chapters.a1]
title = "The Dark Llama"
text = "At night we lay on a raft hauled up on the beach, the balsa under our backs still holding the day’s heat. Mayta pointed at the Milky Way. “Don’t look at the bright parts. Look at the dark.” The dark places were constellations too, he said: a llama with its long neck stretched out, a snake winding up from the south, and a little fox crouched at the llama’s feet. “My grandfather tied the stars into a cord once. Which star rises when, which way to steer at sea.” He was quiet a while. “A priest burned that cord when my father was a boy.” The waves slapped at the end of the raft, one after another. “I only remember one knot,” he said. “Where the llama’s eye is.” He held his finger up in the air, tracing that patch of dark for a long time, and never put it down."

[tracks.bond_mayta_qipu.chapters.a1.choices.follow_his_finger]
text = "Lean my head over and follow his finger to find the dark llama."
hint = "You’re not close enough yet to lie head to head. All you can do is watch his finger move across the sky from the other side of the raft."
reply = "I followed his finger a long time, and when I found the two bright stars caught in the dark shape and said, “There,” I realized our heads were touching. He didn’t move away. His raised hand came slowly down. After a good while he said, “It’ll still be there tomorrow night. Will you come?”"

[tracks.bond_mayta_qipu.chapters.a1.choices.witness_for_him]
text = "Promise that after school I’ll go to Lima and swear to the clerk that his cord accounts are true."
hint = "He doesn’t yet believe you’d go all the way to Lima for a cord. Say it now and he’ll think you’re humoring him."
reply = "He turned his head toward me. “If you swear to it, you’ll have to write it in Spanish.” “I’ll write it both ways,” I said. “You tie, I write, one copy each.” He didn’t answer. He rolled over on the raft with his back to me, and I heard him laughing, laughing so the whole raft rocked a little."

[tracks.bond_mayta_qipu.chapters.a1.choices.grandfather_rope]
text = "Ask what else his grandfather’s cord recorded."
reply = "“The Inca king’s fleet,” Mayta said. “A great many rafts set out from this sea and went west, and west, and took a year to come back. What they brought home was on the cord too.” I asked where west was. He drew his hand back and laid it on his chest. “I don’t know. The cord burned.”"

[tracks.bond_mayta_qipu.chapters.a2]
title = "Two Colors of Thread"
text = "One afternoon after the Sun Festival, Mayta brought two hanks of thread, one red, one blue, traded from a cloth dealer in Lima. “We’ll braid a cord,” he said. “I pick one color, you pick the other.” He picked red. I picked blue, because the sea is blue, and he said that wasn’t a reason. We sat on a raft by the water and braided, red over blue, blue over red. He was quick and I was slow, and halfway through his hands slowed down to wait for mine, though he still found time to complain that my blue strand was too loose. When the sun was nearly in the sea, the braid reached its end, and only the finishing knot was left. Once that knot was tied, the cord was fixed and could never be changed. Mayta held the two loose ends and didn’t tie it. “Who ties it?” he asked. His eyes were on the cord, waiting for my answer."

[tracks.bond_mayta_qipu.chapters.a2.choices.you_tie]
text = "Let him tie it. His knots are truer than mine."
hint = "This cord weighs too much. You’re not close enough yet to reach out and take it."
reply = "Mayta bent his head and tied a knot I had never seen, two turns and then back through the middle. “Only the two of us know this knot.” He wound the cord around my wrist, once, twice, three times, and when he was done he pressed the knot with his thumb, as if counting whether it would hold."
effects = [{}, {}, {}, { title = "Two Colors of Thread" }]

[tracks.bond_mayta_qipu.chapters.a2.choices.tie_together]
text = "Say we tie it together, one end each."
hint = "One end each means fingers tangled together. You two aren’t that close yet."
reply = "I took the blue end and he took the red, and with our fingers tangled together we tied the knot, pushing and pulling, and it came out lopsided. When it was done he didn’t let go, and neither did I. After a while he looked down at it. “Crooked. Nobody will ever be able to copy it.”"
effects = [{}, {}, {}, { title = "Two Colors of Thread" }, {}]

[tracks.bond_mayta_qipu.chapters.a2.choices.leave_it]
text = "Say we should leave the ends loose for now and decide later."
reply = "“A cord with no knot,” said Mayta, “remembers nothing.” He put the two ends together, flicked his hand, and tied it in a blink. Then he shoved the cord into my arms, jumped down off the raft and left. He walked a long way down the beach and never once looked back."

[tracks.bond_mayta_qipu.chapters.s]
title = "A Knot Not Undone"
text = "At the end of the year I was to go north with the family rafts, to Paita and on past it, with no telling what year I would be back. Mayta was staying in Chincha. The day before we left he found me on the beach with two new cords in his hands, not a single knot in either. “The new viceroy has reached Lima. They say the rules are going to change.” He pulled the cords straight across his knee. “There are fewer cord keepers every year, and old Kusi’s eyes are going. I’m going to learn to square knots with Spanish letters, one knot to one word, so that under the new rules there’s still someone who can read a cord.” He handed me one and kept the other. “Our promise goes into these. One each.” He looked at me. “Once it’s tied into a cord, nobody can quietly change it.” The sea wind blew the two loose ends together, and he didn’t pull them apart."

[tracks.bond_mayta_qipu.chapters.s.choices.promise]
text = "Promise to come back to Chincha once a year to check the two cords against each other."
hint = "A promise like this needs weight behind it. Either you two aren’t that close yet, or you’ve already said these words to someone else."
reply = "“Once a year,” I said. Mayta nodded and tied a knot in his cord, a short body with a small loop trailing off it: once a year. My turn. I wanted to tie “no breaking it,” but all I had ever learned were counting knots, and what I tied came out leaning sideways, impossible to read. Mayta took it and studied it a long while. “You’ve tied it wrong. This says ‘ten.’” “Then it counts the wrong way,” I said. “Ten years, and not one of them missed.” He opened his mouth to argue and shut it again. He turned my cord over and added a tiny knot beside the ten; that was a place left for me to take it back, he said, and then: “Not to be used.” He laid the two cords side by side. Same length, and the knots lined up. Next day, as I boarded the raft, he stood knee-deep in the surf and held up his cord and shook it. I held up mine. The raft was far out from the shore, and he was still holding it up."
effects = [{}, {}, { title = "A Knot Not Undone" }, {}, {}, {}]

[tracks.bond_mayta_qipu.chapters.s.choices.heart]
text = "Ask him to tie a knot on my cord that only he understands, and tell me what it means when we meet as grown-ups."
hint = "A knot like this only gets tied when both of you know your own hearts. You’re a step short, or you’ve already said these words to someone else."
reply = "Mayta didn’t start right away. He turned my cord over twice in his hands and looked at me once before he began. He tied it very slowly, one strand over the next, and when a strand went wrong he undid it and began again; twice he undid it. I couldn’t read the knot. All I could tell was that it wasn’t a counting knot, and it wasn’t a cargo knot. When it was finished he took my hand, pressed the cord into my palm, and left his hand lying over it. “This knot records a day,” he said. “Which day?” “Guess.” His palm was a little damp. “If you can’t, then when we’re both grown, come back and ask me, and I’ll tell you.” “And if I do guess it?” “Then come back anyway,” he said. “Come back and tell me which day you guessed, and we’ll see if you’re right.” The tide came in over our feet and drew back, wetting the end of the cord. A wet knot only pulls tighter, he said, and kept his hand where it was."
effects = [{}, {}, {}, {}, { title = "A Knot Not Undone" }, {}, {}]

[tracks.bond_mayta_qipu.chapters.s.choices.own]
text = "Make a bet with him: when we’re grown, whose rafts reach Callao first."
reply = "“What are we betting?” Mayta asked. “A raftload of cotton,” I said. “Whoever’s rafts come in second pays a raftload of cotton.” He looked me up and down, as if weighing how many rafts I could ever pull together. “You’ll lose badly, then. In the time it takes you to go north once, I’ll have three rafts lashed at home.” “Then we’ll see who gets there first.” He didn’t argue. He held out his hand, and we slapped palms on the beach, both of them gritty with sand, a crack loud enough to send two seabirds off the rocks. He tied one big knot in his own cord and pulled it tight. “A raftload of cotton. I tied the knot, so you’re the one who can’t get out of it.” The other cord he pushed into my arms without a single knot. Mine, he said, was for marking the day I lost."

[tracks.reunion_mayta_qipu]
name = "Mayta Qipu: New Marks on the Raft"

[tracks.reunion_mayta_qipu.chapters.reunion]
title = "New Marks on the Raft"
text = "In 1563 I came back to Callao. A line of balsa rafts stood along the beach, and the three at the far end were new, their bows carved with a mark: half of it a knot, loop over loop, and half of it Spanish letters, an M and a Q, cut neat and straight. Mayta stood among those three, arguing with a young raftsman about which one should go in the water first. The raftsman’s voice carried across half the beach. “The east one draws less, put her in first!” “The west one’s heavier loaded,” said Mayta. “Count the—” He saw me and stopped mid-word, left the raftsman standing, and came toward me. The raftsman shouted after him, “Mayta! You can’t stop halfway through a sentence!” “Ika. Wait.” Mayta stopped in front of me and pulled a cord out of his shirt. It was old, but the knots were still tight. “The year you went north, you took both cords with you,” he said. “So I tied another. Every year you didn’t come back, I tied a knot.”"

[tracks.reunion_mayta_qipu.chapters.reunion.default]
effects = [{ text = "I waited a season at Callao and you didn’t come. I’m sending this cord north with the rafts. Here’s how to read it. The big knot at the top is this year. The seven small ones under it are the seven years you’ve been gone. The bare stretch in the middle, with nothing tied on it, is the days you didn’t come back. I meant to fill it in, and then I thought: what didn’t happen shouldn’t be recorded. The knot at the very bottom records a day. Which day, come back and ask me. Ika says I should write letters instead of tying knots, that you’ve been away so long you may not read a cord anymore. I told him to shut up, and then I had him write these few lines of Spanish on the paper for me. If you can’t read the knots, read what he wrote. If you can, don’t bother; his writing isn’t as true as my knots. The new rules have changed several times, and there are two fewer cord keepers. Last year old Kusi handed me the oldest bundle of cords he had, and now I keep the accounts of more than thirty raft families in Chincha by myself. The clerk from Lima has checked them twice and hasn’t found a single mistake. You know how I practiced. Don’t tell anyone. I have three rafts now, with my mark carved on the bows, half knot, half letters. If you see it in some harbor, that’s me. Mayta" }, {}]

[tracks.reunion_mayta_qipu.chapters.reunion.choices.friend]
text = "Take out my cord and go through the years’ accounts with him, one by one."
reply = "We sat on his raft with the cords across our knees and went through them knot against knot. All the years I was running to Paita and Guayaquil, I never once caught the Chincha raft season; he had kept count, year after year, and I had run up the debt, year after year. We were still at it when dark came. Ika wandered over with a torch to watch, took one look and yelled, “Are you two doing accounts or having a fight?” When it was all added up, I owed him five, and he owed me one: the year a storm wrecked his raft and I waited half a month at Callao and he never came. He had forgotten it himself. The knot on my cord had not. Mayta stared at that knot a long time and snorted, but his back stayed straight as a mast, like a man who means to lose with some style. Then he tied a new knot at the end of his cord, tight, and pulled the last bit through with his teeth. “From this year,” he said, “we start the count over.”"
effects = [{}, {}, {}, { title = "New Marks on the Raft" }]

[tracks.reunion_mayta_qipu.chapters.reunion.choices.rival]
text = "Make him a bet: this season, whose rafts reach Callao first."
reply = "Mayta laughed out loud, the loudest I had ever heard him laugh. “I’ve been waiting for you to say that.” Behind him Ika slapped his thigh and shouted, “My money’s on Mayta!” All that season, from Paita down to Callao, the talk on the water was about two raft fleets racing each other: who had stolen a fair wind, who had spent the night behind which headland, whose raftsmen had slipped anchor in the middle of the night. My fleet was faster but slow to load; his rafts were slower, but he counted every bale before it went aboard and never once had to load twice. In the end I came in half a day behind. When my rafts pulled into Callao, Mayta was sitting on the stone steps of the dock, cotton bales piled at his feet, and tipped his chin at me. He pushed half the cotton he had won across to me. “If the loser goes home with no cotton, what are you going to bet me with next season?”"
effects = [{}, {}, {}, { title = "New Marks on the Raft" }]

[tracks.reunion_mayta_qipu.chapters.reunion.choices.love]
text = "Ask him which day that knot he pressed into my palm records."
hint = "That word was never spoken back then, and the knot was never tied. Even now you can’t bring yourself to ask."
reply = "I took the cord out of my shirt. Seven years had yellowed it, and the knot I couldn’t read was still in its place. “I’ve been guessing for seven years,” I said. “I can’t work it out. Which day is it?” Mayta took the cord and ran his thumb back and forth over the knot, twice. “Today,” he said. “How did you know I’d come back today?” “I didn’t.” He put the cord back in my hand. “When I tied it, I thought: one day you’ll come back and ask. Whatever day you come to ask, that’s the day it records.” Ika was calling him to come look at a raft. He didn’t answer. That night, after everyone had left the beach, we sat on his raft with the new marks on its bow. The waves were still slapping at the stern, and the dark llama was out again in the Milky Way. This time he didn’t point it out to me. He only turned his face toward me and kissed me."
effects = [{}, {}, {}, { title = "New Marks on the Raft" }]

[tracks.reunion_mayta_qipu.chapters.reunion.variants.own]
text = "In 1563 I came back to Callao. A line of balsa rafts stood along the beach, and the three at the far end were new, their bows carved with a mark: half of it a knot, loop over loop, and half of it Spanish letters, an M and a Q, cut neat and straight. Mayta stood among those three, arguing with a young raftsman about which one should go in the water first. The raftsman’s voice carried across half the beach. “The east one draws less, put her in first!” “The west one’s heavier loaded,” said Mayta. “Count the—” He saw me and stopped mid-word, left the raftsman standing, and came toward me. The raftsman shouted after him, “Mayta! You can’t stop halfway through a sentence!” “Ika. Wait.” Mayta pulled out the cord with the big knot in it and dangled it in front of my eyes. “A raftload of cotton,” he said. “You’re just in time. This season’s rafts aren’t in the water yet.”"

[tracks.reunion_mayta_qipu.chapters.reunion.variants.promise]
text = "In 1563 I came back to Callao. A line of balsa rafts stood along the beach, and the three at the far end were new, their bows carved with a mark: half of it a knot, loop over loop, and half of it Spanish letters, an M and a Q, cut neat and straight. Mayta stood among those three, arguing with a young raftsman about which one should go in the water first. The raftsman’s voice carried across half the beach. “The east one draws less, put her in first!” “The west one’s heavier loaded,” said Mayta. “Count the—” He saw me and stopped mid-word, left the raftsman standing, and came toward me. The raftsman shouted after him, “Mayta! You can’t stop halfway through a sentence!” “Ika. Wait.” Mayta stopped in front of me and pulled his cord out of his shirt; the knot with the little trailing loop was still there. “Once a year,” he said. “You owe me quite a few.”"

[tracks.reunion_mayta_qipu.chapters.reunion.variants.romance]
text = "In 1563 I came back to Callao. A line of balsa rafts stood along the beach, and the three at the far end were new, their bows carved with a mark: half of it a knot, loop over loop, and half of it Spanish letters, an M and a Q, cut neat and straight. Mayta stood among those three, arguing with a young raftsman about which one should go in the water first. The raftsman’s voice carried across half the beach. “The east one draws less, put her in first!” “The west one’s heavier loaded,” said Mayta. “Count the—” He saw me and stopped mid-word, left the raftsman standing, and came toward me. The raftsman shouted after him, “Mayta! You can’t stop halfway through a sentence!” “Ika. Wait.” Mayta stopped in front of me and took his own cord out of his shirt, but his eyes went to my hands. “Your cord,” he asked. “Do you still have it?”"
