# 鞠千代的羁绊线（bond_kikuchiyo / reunion_kikuchiyo）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# C21b 审读后（2026-11-12）：好感方向改了、或手册点名删掉的原句所在的章，英文整章删掉回退中文：bond_kikuchiyo.c2。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上、又新加了选项与变体，照“缺译回退中文”（整章未译可回退）整章删掉，待照新中文重译：bond_kikuchiyo.s。重逢一章是轨道里唯一的一章，删了就不算“整章未译”，所以保留，只补新加的变体与选项、改掉与新中文对不上的几条（见各条上方注释）。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_kikuchiyo]
name = "Kikuchiyo: The Ball Over the Wall"

[tracks.bond_kikuchiyo.chapters.c1]
title = "The Ball Over the Wall"
text = "On my third day at court I was still learning my way around the little yard behind the ladies’ quarters. Someone on the other side of the wall called out “Ya!” and a white ball sailed over the top, bounced twice on the flagstones, and came to rest against my foot. Deerskin, stitched, with a leather band around its middle worn fuzzy. A face rose over the top of the wall: a boy a little younger than me, red as if he’d just run three miles. He opened his mouth and nothing came out. He opened it again. Still nothing. “Yours?” I asked. He nodded so hard he nearly slid off the wall. “Then catch!” I kicked it. The ball skimmed off the toe of my shoe, went wide, and buried itself in the camellia bushes at the foot of the wall. The face vanished. A little later he came running around through the gate, out of breath, and the first thing he did was crouch down to look at my ankle. “D-did you twist it?” I said no. Only then did he turn, wrap his hand in his sleeve, and start parting the camellia branches."
news = "In the back yard of the ladies’ quarters at the Kyoto palace, a ball came flying over the wall from the Asukai side. The new girl at court kicked it straight into the camellias, and the Asukai boy spent ages crawling around in there after it."

[tracks.bond_kikuchiyo.chapters.c1.choices.help_find]
text = "Crawl into the camellias with him and hunt for the ball."
reply = "The camellia branches were thick and stiff, and both our sleeves came out snagged and torn. He found the ball first. He rubbed it on his sleeve, rubbed it again, and when it was clean he held it out to me in both hands. “Th-this one’s for you. To practice with.” “I can’t kick. You just saw.” “A k-kick that goes wide,” he said, “is still a kick.” Only then did he notice his own torn sleeve. He clutched the rip and ran, and a long way off he turned to look back, to see whether the ball was still in my hands."

[tracks.bond_kikuchiyo.chapters.c1.choices.kick_again]
text = "Ask him for the ball and take another kick."
reply = "He fished the ball out and handed it over. I backed up three steps and kicked. This time it flew high and wide, cleared the wall, and came down on the far side. An old lady-in-waiting over there started scolding. “Who has no manners?” He clapped a hand over his mouth, shoulders shaking. When he was done laughing he went red again, crouched, and showed me with his hands. “The t-top of your foot has to be flat. Like you’re carrying a bowl of water.” His words stumbled. His hands didn’t shake at all."

[tracks.bond_kikuchiyo.chapters.b1]
title = "On the Same Side"
text = "The autumn kemari meet was held on the palace ground. Of the trees at its four corners, the cherry, willow, and maple had all turned; only the pine was still green. When the sides were being picked, one of the senior ladies hid her smile behind her fan. “The Asukai mute is playing too? You do have to call out on the court, you know.” A few of the ladies laughed along. Kikuchiyo stood at the edge with his ball resting on his palm, a little purple tassel tied to its leather band. His head was down, as if he hadn’t heard. I walked over. “I’m on his side.” The fan stopped. “Lady Ichijō, there are rules about who plays with whom at a meet. Go on, then. Which rule are you standing on?” The whole court waited for me to answer. Kikuchiyo came over and set the ball in my hands without a word. Then he crouched, and with two fingers he nudged my right foot, which had been pointing the wrong way, until it faced the center of the court."
news = "At the autumn kemari meet at the Kyoto palace, a senior lady called the Asukai boy a mute, and the new Ichijō girl insisted on playing on his side. Every lady on the court craned her neck to watch."

[tracks.bond_kikuchiyo.chapters.b1.choices.formal_retort]
text = "Answer her with court protocol and join his side by right."
hint = "You haven’t learned all the palace rules yet. Speak up now and she’ll catch you out."
reply = "I said that at a meet, sides have always been set by the master house, and today he was the only Asukai on the court. Whoever he handed the ball to was on his side. The senior lady snapped her fan shut, opened it, shut it again, and never did find an answer. We won that game. When he kicked he called “Ya!”—not loud, but the whole court heard it. Afterward he caught up with me. “Y-you, just now, you were like a, like a poem.” Then he was the one who ran."

[tracks.bond_kikuchiyo.chapters.b1.choices.just_join]
text = "Say nothing and walk straight over to his side."
reply = "The senior lady said neither of us knew our place and sent us to the chapel to copy sutras. We copied until midnight. The lamp was refilled twice, and my hand ached too much to hold the brush. At dawn I counted my stack and found several extra sheets, in a hand almost exactly like mine—only the last stroke of each “sutra” ended cleaner than mine ever did. I took them to him. He kept his head down over the inkstone. “The w-writing’s the same.” “If it’s the same, you didn’t have to copy mine.” “It’s the same,” he said, “so n-nobody can tell.”"

[tracks.bond_kikuchiyo.chapters.b2]
title = "The Page That Doesn’t Exist"
text = "That spring it was my turn on duty in the ladies’ quarters, keeping the brushes and ink and doing the copying. Kikuchiyo came by with the roster from the kemari meet and stood out on the veranda a long while before he came in. He looked up at the row of court diaries on the shelf and said quietly, “Th-there’s twenty-odd years missing in there.” “Missing?” “A whole s-stretch, gone. What meets the palace held those years, who won, who recited what—nobody knows anymore.” He took a blank sheet from inside his robe, its fold pressed perfectly flat. “The one last autumn. I w-want to write it down.” The diary itself belonged to the ladies who kept it in turn, and neither of us dared add a single character. I folded the sheet in half, cut it along the crease, and slid one half to him and kept the other. “Half a page each. We tuck them into our own copybooks.”"
news = "The girl on duty in the ladies’ quarters at the Kyoto palace and the Asukai boy cut a sheet of paper in two. They say they mean to write down last autumn’s kemari meet."

[tracks.bond_kikuchiyo.chapters.b2.choices.write_half]
text = "Write my half: the day he crouched and set my foot straight."
hint = "He keeps the paper clenched in his hand and says this is an Asukai matter. You aren’t close enough yet."
reply = "I kept it short: at a meet, I stood crooked, and someone crouched down and set my foot straight with two fingers. When he read it, his ears went red first. “Y-you’re writing that down too?” “You write yours, I write mine.” He put the two halves together and held them up to the window. The cut edges matched exactly, and there it was, one whole day. “From now on,” he said, “n-nobody has to guess about this day.” He slipped his half into his copybook, right at the front."

[tracks.bond_kikuchiyo.chapters.b2.choices.date_it]
text = "Write out the date in full, and not a word more."
reply = "I wrote the year, the month, the day, and the word “clear,” and set down the brush. He leaned over to look and frowned. “Th-that’s too dry.” “If the date’s there, the day is there. Anyone who wants to know can ask around by the date.” He thought about it, took my brush, and added a few words after “clear”: kemari meet, won. Then, after a moment’s hesitation, he drew a circle around “won.”"

[tracks.bond_kikuchiyo.chapters.a1]
title = "A Poem on a Mulberry Leaf"
text = "On the night of Tanabata the palace set out basins of water in the courtyard to hold the stars, and brought in paper-mulberry leaves for people to write poems on the back of. The ladies wrote leaf after leaf and tied them to bamboo branches. Someone pressed a leaf on Kikuchiyo. “And you, young Asukai? No poem?” He took it in both hands and stood a long while gripping the brush. “I c-can’t write this kind.” When everyone had gone, I went back to clear the basins and found a mulberry leaf lying on the rim of one. It had never been tied to the bamboo, as if whoever wrote it hadn’t dared. On the back was a poem with no name, about two stars with a wall between them. The hand was careful, but at the start of every line the ink pooled a little darker, as if the brush had paused there—like the breath he always took before he spoke. I turned the leaf over, then back again. Someone in the distance was gathering up the bamboo and calling for me. I didn’t call his name."
news = "At Tanabata in the Kyoto palace, a mulberry leaf that never got tied to the bamboo turned up on the rim of a basin, an unsigned poem on its back. The ladies spent all night guessing whose hand it was."

[tracks.bond_kikuchiyo.chapters.a1.choices.ask_him]
text = "Take the leaf to him and ask: who wrote this?"
reply = "The next day I found him beside the kemari ground and held the leaf out on my palm. He glanced at it once and looked away, fixing his eyes on a fallen leaf on the ground. “I d-don’t know.” “Then I’ll keep it for whoever wrote it.” He nodded. A good while later he added, “Th-they’d be glad.” Then he flicked the ball at his feet into the air and kept it up more than twenty times without letting it touch the ground, and not once did he look my way."

[tracks.bond_kikuchiyo.chapters.a1.choices.reply_leaf]
text = "Write an answer on another leaf, unsigned too, and leave it by the basin."
hint = "Answer him now, and he may never dare leave a leaf by the basin again."
reply = "I wrote one by starlight. Mine was about a wall too—about someone on this side of it, waiting for the ball to come over. I laid the leaf back on the rim and set a pebble on it. Early the next morning the leaf was gone and the pebble was still there. That afternoon he was practicing on the court, and when he saw me he didn’t say a word, but he went red to the tips of his ears. He must have kicked a hundred times that afternoon, and not one went wide."

[tracks.bond_kikuchiyo.chapters.a2]
title = "Before the Snow Stopped"
text = "It snowed all day. Our teacher held a small poetry gathering in a side hall, only seven or eight people, the braziers burning high. When it was Kikuchiyo’s turn he stood up, gripping his fan until his knuckles went white, and stuck on the very first line. The lady in the place of honor coughed. He shut his eyes for a moment and began again from the top. It was a long poem, very long, line after line. Twice he paused for breath, but he never broke off. When he finished the last line, nobody in the room made a sound. All you could hear was the snow landing on the bamboo outside. The first person he turned to look at was me, and only then the teacher, to bow. The snow was still falling when the gathering broke up. He came after me onto the veranda and took a small cloth ball out of his sleeve, the stitches fine and close. “I m-made it myself. For your f-feet. To practice.”"
news = "The day it snowed at the Kyoto palace, there was a small poetry gathering in a side hall. The Asukai boy who blushes at everyone recited a poem of astonishing length, and afterward he chased someone out onto the veranda."

[tracks.bond_kikuchiyo.chapters.a2.choices.catch_ball]
text = "Take the cloth ball and keep it up three times in front of him."
hint = "He holds the cloth ball out, but when you reach for it he draws it back a little. You aren’t close enough yet."
reply = "Once, twice—the third went wrong and the ball dropped toward the snow. He put out a foot, flicked it up off his toe, and handed it back. “It’s t-too light. I’ll make you another one, with more stuffing.” “I want this one.” He looked at the ball, then at me, and nodded. Snow settled on his head and he didn’t brush it off. His ears were red against all that white, plain to see from halfway down the veranda."
effects = [{}, {}, {}, { title = "Before the Snow Stopped" }]

[tracks.bond_kikuchiyo.chapters.a2.choices.say_it_was_good]
text = "Tell him: you recited better than anyone, and I saw you look at me first."
hint = "Say something like that now and he’ll hide on the far side of the wall. You aren’t close enough yet."
reply = "He froze on the veranda. “Y-you saw?” “I saw. A whole room of people, and I was the first one you looked at.” He lowered his head and said nothing for a long time. Then he put the cloth ball in my hand. His fingers touched mine, ice cold, and he didn’t pull them back. They just rested there awhile. Outside the snow kept falling and falling, and only when someone by the braziers called for clearing up did he tuck his hands back into his sleeves."
effects = [{}, {}, {}, {}, { title = "Before the Snow Stopped" }]

[tracks.bond_kikuchiyo.chapters.a2.choices.ask_next]
text = "Ask him: will you recite at the next gathering too?"
reply = "“Wh-whether I recite…” He looked out at the snow. “Depends on wh-whether you’re there.” Then he startled himself and added in a hurry, “Th-there in the audience, I mean.” I said of course I’d be in the audience—did he expect me to get up and recite for him? He stuffed the cloth ball back into his sleeve and walked off so fast he slipped at the corner of the veranda, and he got up without looking back."

[tracks.reunion_kikuchiyo]
name = "Kikuchiyo: The Master Under the Tree"

[tracks.reunion_kikuchiyo.chapters.reunion]
title = "The Master Under the Tree"
text = "That year the Ichijō house held a banquet at its residence in Nakamura, and the court nobles who came down from Kyoto brought a kemari master with them—an Asukai, they said, who had only lately received his license. I took a boat from Shimoda up the Shimanto River and arrived after the banquet had begun. The garden was spread with white sand. The master stood at its center and bowed, his manners flawless. Then he bent down and began picking the pebbles out of the sand one by one and dropping them into his sleeve. It took him the better part of an hour, and the whole company waited. When he was finished he straightened and looked my way. It was Kikuchiyo. He was taller, broader in the shoulders. With the nobles at the head of the table he spoke without a single stumble, but when he turned to me, the sentence broke twice. “Lady M-Mio. W-would you like to catch one again?” After the banquet he waited for me under the tree at the corner of the garden. Before he spoke he drew a breath. “Back then it was a-always you who spoke first. This time, I will.”"
news = "At the Ichijō banquet in Nakamura, Tosa, the kemari master up from Kyoto didn’t rush to play. First he bent and picked every pebble out of the garden, and only then did he invite the daughter of the house onto the court."

[tracks.reunion_kikuchiyo.chapters.reunion.default]
news = "At the Ichijō banquet in Nakamura, Tosa, the kemari master up from Kyoto spent the better part of an hour picking pebbles out of the garden, looked once around the tables, and never kicked a single ball before the guests went home."
effects = [{ text = "Lady Mio: I went to the banquet at Nakamura. I picked the pebbles out of the white sand first, and when I looked up, you weren’t among the guests. They tell me your ship is out at sea and won’t be back at Shimoda until after the new year. I received my license last spring, and they let me onto the court at the center in Kyoto now. Under the tree at the corner of the garden in Nakamura there is a flat stone. I sat on it. When you come home, write me a date, and I-I’ll make the trip again. —Kikuchiyo" }, {}]

[tracks.reunion_kikuchiyo.chapters.reunion.choices.play_match]
text = "Play a game with him first, then sit under the tree and talk about the years."
reply = "I didn’t let him go on. I held out my hand for the ball, and he gave it to me. I kicked a dozen or so times and went wide three times, and three times he caught it, calling a soft “Ya!” as he kicked, as if calling someone by name. When we were done he looked at my feet and shook his head. “St-still not flat.” We sat down under the tree. He talked about Kyoto: how his older brothers, the legitimate sons, had finally let him onto the court at the center; how on the day he got his license he stood alone on the court until dark. I talked about the ships at Shimoda, the rains in Kyushu, the rip currents in the Bungo Channel. Somewhere along the way he suddenly stood, faced the tree, and recited a long poem from beginning to end without catching once. When he sat back down he said it was written for Nakamura—for the river here, the white sand, and someone who always kicks the ball wide. “I’ll c-copy it out for you,” he said. “Take it on board.”"
effects = [{}, {}, {}, { title = "The Master Under the Tree" }]

[tracks.reunion_kikuchiyo.chapters.reunion.choices.let_him_speak]
text = "Say nothing; stand under the tree and wait for him to speak first."
hint = "Needs: you gave him your half page back then, heart 24, and your heart went to him alone."
reply = "I stood under the tree and waited. He drew a breath, and another, and then he said it. He spoke of the snow in the kickball yard that year, of the two half pages, of how in seven years in Kyoto, before every kick, he first thought which way Tosa lay. He spoke slowly, and he didn’t stammer once. He took the two half pages from the front of his copybook, turned them over, borrowed my brush, and wrote a date on the back: today. He held the paper out. I didn’t take the paper; I took his hand. It was drizzling in Nakamura that day, and there wasn’t a footprint on the white sand."
effects = [{}, {}, {}, { title = "The Master Under the Tree" }]

[tracks.reunion_kikuchiyo.chapters.reunion.choices.speak_first]
text = "This time, too, I speak first."
hint = "Needs: you gave him your half page back then and heart 24. If your heart went to him alone, wait for him to speak."
reply = "I spoke first: of the snow in the kickball yard, of the two half pages, of the few times at sea I’d thought of Kyoto and thought of the ball coming over the wall. He listened, and halfway through he opened the copybook and pointed at the blank under the word ‘fair.’ “That d-day, I heard. I didn’t write it.” “You can write it.” “I don’t write down mistakes.” He shut the book, opened it again, and with my brush added a small line beside the date. I couldn’t read it and he didn’t show me. Then he reached over and took my hand and held it hard. Someone in the yard was rolling up the mats on the white sand."
effects = [{}, {}, {}, { title = "The Master Under the Tree" }]

[tracks.reunion_kikuchiyo.chapters.reunion.variants.shared]
text = "That year the Ichijō held a banquet at their Nakamura residence, and a court noble down from Kyoto brought a kickball master of the Asukai house, newly licensed. I arrived when the banquet had begun. The master bowed in the middle of the yard, then stooped and picked the pebbles out of the sand one by one for the better part of an hour. When he straightened and looked my way, it was Kikuchiyo. To the noble at the head of the table he spoke without a stammer; to me the sentence broke twice. “M-Mio-hime. Will you t-take one more?” After the banquet he waited under the tree in the corner with his copybook. He opened it: at the front, the two half pages; a page later, a date, and under it the single word ‘fair,’ nothing else. He shut the book, opened his mouth, and shut it again."
