# 尹海梨：纸有正反（bond_yun_haeri）与重逢（reunion_yun_haeri）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_yun_haeri]
name = "Yun Haeri: Paper Has Two Sides"

[tracks.bond_yun_haeri.chapters.c1]
title = "Paper Held to the Light"
text = "My father had a reply to Tsushima to write out in a fair hand, and he sent me to the paper shop. I walked in and asked for the whitest sheet they had; the whiter, the more respectable. The girl behind the counter didn’t answer. She drew out a sheet, went to the window and held it up to the light. “Look here.” One patch was so thin it shone. Light came through it like a moon the size of a fingernail. “Ink will bleed there. The Japan House people are fussy about that. One blot, and they’ll tell you we meant to slight Tsushima.” Then I’d write on the other side, I said. What difference did a side make? She turned the sheet over and ran a finger along the grain, then turned it back and did it again. One side dragged, the other slid. “Paper has a right side and a wrong side. So do words.” She laid the sheet back in the quire and smoothed it flat, as if she had been talking to the paper. Someone called from the back room: “Haeri, weigh the paper!” She answered, and didn’t move. She was still waiting for me to choose."

[tracks.bond_yun_haeri.chapters.c1.choices.buy_her_pick]
text = "Ask her to pick out the right quire for me, and teach me which side is which."
reply = "She chose slowly, holding each sheet up to the window. Thirty-odd sheets in, the back room called again. She tied the quire with paper string and folded down the right corner of the top sheet. “The folded corner is the front. With this quire, if you mistranslate, you can’t blame the paper.” I laughed out loud, and so did she. Then she straightened her face and held out her hand for the money."

[tracks.bond_yun_haeri.chapters.c1.choices.argue_sides]
text = "Object: an interpreter reads words, not paper."
reply = "“Then write me a sheet.” She pushed the inkstone across. I dipped the brush and wrote my own name on the side she had just turned over. Before I could lift the brush, the ink had crept along the grain and my name was one gray blot. She didn’t laugh or say a word. She took the sheet away, laid down a fresh one front side up, smoothed it, and put the brush back in my hand."

[tracks.bond_yun_haeri.chapters.c2]
title = "One Character at the Linked-Verse Gathering"
text = "The family school held a gathering for linked Chinese verse. The paper shop delivered the paper, and Yun Haeri came along behind her father to grind ink and change sheets for the teachers. When my turn came I rushed to put down my line and only saw the problem after I’d finished: one rhyme word was wrong, pulled into the rhyme next door. Each sheet passed through her hands on its way to a fresh one for the next writer. She took mine, glanced down, and ran a fingernail lightly under that one character, a scratch so faint you could only see it at an angle. Then she handed it back. “This sheet has a crease. Would you copy it out again?” Her father smiled apologetically beside her. “The child’s clumsy. It’s good paper.” I changed one character, guided by the nail mark, and copied the line out fresh. The teacher read it aloud and stroked his beard. “A steady link.” I looked up for her. She was bent over the inkstone again, turning the stick at an unhurried pace."

[tracks.bond_yun_haeri.chapters.c2.choices.ask_her_more]
text = "Go to the shop after the gathering and hand her my whole stack of old drafts to correct."
hint = "Even her nail mark was made to look like nothing. You aren’t close enough yet; she won’t take a stack of drafts where anyone can see."
reply = "At first she wouldn’t take them. She glanced at the back room, then slid the stack under the counter. On the third day I went to collect it. The drafts came back untouched except for a nail mark under each wrong character, nineteen of them. She went through them one by one, then dropped her voice even lower. “Don’t tell my father. He says correcting characters is men’s work, and a paper seller’s daughter should mind her paper.”"

[tracks.bond_yun_haeri.chapters.c2.choices.thank_by_verse]
text = "Write the character for “thanks” in the corner of a sheet and slip it back to her."
reply = "The next day the shop delivered paper, and in the corner of the top sheet was one small character: “No.” I stared at it for a long time. “No need”? “Don’t mention it”? Or did she think my character was badly written? The next time I saw her, I asked. “Guess,” she said. A little later she added, “The falling stroke was too long.”"

[tracks.bond_yun_haeri.chapters.b1]
title = "A Letter on Japanese Paper"
text = "The autumn examination was to translate a letter from Tsushima, on the spot. The teacher took one out of a box: paper thin enough to see a finger’s shadow through, yet tough; you couldn’t have torn it. I raced through it and stuck halfway. The letter claimed to come from the house of Sō, but it sounded like a shopkeeper haggling, and its honorifics jumped up a level here and down a level there. I forced out a literal version, handed it in, and felt uneasy. Afterward I ran to the paper shop, recited the lines I’d memorized for Yun Haeri, and described the paper with my hands. She dug a similar sheet out of the bottom of a cabinet and held it to the window. “This is gampi paper. The Sō house writes its letters on heavy mulberry paper, with an extra layer where the seal goes. Thin stuff like this is what the Hakata merchants keep their accounts on.” She said it fast and sure, and only then saw her father in the doorway. She bit her lip and pushed the sheet back under the cabinet."

[tracks.bond_yun_haeri.chapters.b1.choices.tell_the_teacher]
text = "Go back to school and tell the teacher, saying someone at the paper shop spotted it."
hint = "She has just bitten her lip. You don’t know each other well enough yet; if you speak up now, she’ll only avoid you."
reply = "The teacher sent someone to ask at the Japan House. Sure enough, a Hakata merchant had borrowed the Sō name to write it, hoping to squeeze out an extra shipload of rice. The teacher told the story in class and finished, “That girl at the paper shop has sharper eyes than any of us interpreters.” Word reached the shop, and Yun Haeri didn’t come to deliver paper for three days. On the fourth she set the paper on my desk and said, very quietly, “Next time, say you saw it yourself.”"

[tracks.bond_yun_haeri.chapters.b1.choices.keep_it_between]
text = "Tell no one, and just ask her to teach me how to read paper."
reply = "She taught me seven papers: mulberry, hemp, bamboo, gampi, and the rest. Each came with a little rhyme she said she’d made up herself, to make it stick. She said the last one slowest. “Paper doesn’t lie. The people writing on it do.” That one should be taught to the teacher, I said. She squared the seven samples and pushed them at me. “I’m teaching it to you first.”"

[tracks.bond_yun_haeri.chapters.b2]
title = "The Raids to the South"
text = "It was the summer break in the sixth month, and nobody in town was resting. News came up from the south: Japanese ships had broken into Jeolla, Dalyang had fallen, and many soldiers were dead. In the morning it was one fort lost; by evening the talk had made it three. The Japan House gate stood half shut, and the Tsushima merchants hardly came out. My father and a few other interpreters were shut up indoors all day writing dispatches and copying dispatches, and paper went fast. Yun Haeri came with a delivery and didn’t leave. She stood at our gate a long while, watching the shadows of the interpreters bent over their desks on the paper window. “If the court sends someone to Tsushima to demand an answer,” she asked me, “which of the interpreters would they send?” Some old interpreter, I said quickly. Someone who knew the forms. “And the young ones? The ones who know paper?” She asked too seriously. Her eyes never left that window. Before I could answer, she laughed a little at herself. “I’m only asking.”"

[tracks.bond_yun_haeri.chapters.b2.choices.guess_her_wish]
text = "Ask her softly: you want to go yourself, don’t you?"
hint = "That isn’t a question you can ask her yet. She’ll only say again, “I’m only asking.”"
reply = "She froze and looked at me for a long time, long enough for someone inside to call me to grind ink. “Don’t tell my father.” It was the first time she had admitted it. She wanted to see what paper they used on Tsushima, she said. She wanted to hear how they talked behind closed doors with her own ears, with no interpreter in between. “Every layer in between, the words get thinner.” Then she tied the string on the next quire so tight it bit, and left."

[tracks.bond_yun_haeri.chapters.b2.choices.tell_what_you_know]
text = "Tell her everything I’ve heard from my father, start to finish."
reply = "I poured out all I’d heard from the dispatches: which day, how many ships, which fort, who died. She listened closely and didn’t interrupt once. When I finished she said, “So translating one dispatch means translating that many people’s lives.” After that, every sheet she brought for the dispatches had been held to the light, its front corner folded down. Not one of them bled."

[tracks.bond_yun_haeri.chapters.a1]
title = "A Japanese Poem by Lamplight"
text = "Tucked inside an old letter from the Japan House was a Japanese poem, thirty-one syllables on a slip folded very small. The teacher glanced at it, said it wasn’t official business and needn’t be translated, and set it aside. Yun Haeri, collecting the waste paper, copied it out. After closing she lit a lamp in the back room of the shop, called me in, and spread the copy under the light. “Do you want it word by word, or just the meaning?” Both, I said. So she read it very slowly, one Japanese syllable at a time. After each line she stopped, gave me the words in Korean, and then gave me what she guessed it meant. As she came to the last line, someone pounded on the front. It was her father, wanting the shutters up. “Haeri!” She didn’t answer. Her finger stayed on that line, as if it might run off."

[tracks.bond_yun_haeri.chapters.a1.choices.listen_to_end]
text = "Tell her to ignore the door and finish the last line."
hint = "Not close enough yet. One more knock from her father and she’ll put the copy away."
reply = "She finished, and was quiet for a while before she spoke. “This line is someone standing by the sea, waiting for a ship. The ship comes, and then they don’t want to board.” I asked why. “The poem doesn’t say.” The lamp oil was nearly gone and the flame kept jumping. She didn’t refill it, and I didn’t mention it. The knocking outside stopped. She folded the copy back the way it had been. “Tomorrow we’ll read the next one.”"

[tracks.bond_yun_haeri.chapters.a1.choices.keep_her_dream]
text = "Promise her: if an embassy ever goes, I’ll put her name on the list."
hint = "This is the wish she keeps deepest. You haven’t come far enough to say it for her."
reply = "“There are no women’s names on those lists.” She said it flatly, like reciting a regulation. Then I’d write “Yun, paper merchant,” I said. An embassy needs someone to look after the paper. She looked at me and suddenly laughed, so hard her shoulders shook. “Then I’ll go as a paper merchant, just once.” She turned the poem over and wrote a line on the back: Year such-and-such, month such-and-such, paper merchant in attendance. She didn’t fill in the year or the month."

[tracks.bond_yun_haeri.chapters.a1.choices.translate_together]
text = "Ask her to help me turn the poem into a Chinese verse."
reply = "We did three drafts. The first was mine: quick, the meaning all there, and it read like a public notice. The second was hers: every word glued to the original, and it read like a ledger. The third we argued out together, character by character, until the wick grew a crust. She read it through. “This time both sides are right.” She didn’t give me that draft. It went into her own drawer under the counter."

[tracks.bond_yun_haeri.chapters.a2]
title = "A Book Cover She Sewed"
text = "Yun Haeri’s phrasebook was half done: the things fishermen said most often in front of the Japan House or beside a Tsushima boat, a line of Korean, a line of Japanese, and the sounds written underneath. She put it aside anyway and sewed a leather cover for my book of translations. Before she made a single stitch she borrowed the book, measured the spine, and measured it again. She left the tie long, a single deerskin thong that went around three times with some to spare. “You’ll translate more and more,” she said. “When the book gets thicker, the thong will still reach.” I opened the cover. On the inside, in very small writing, were three lines: one in Japanese, one in Chinese, one in the Korean script, all saying the same thing: Don’t put your words wrong side up. The stitches went around the three lines without piercing a single character. She sat behind the counter and picked up her phrasebook again, opened it to a page, and didn’t turn it for a long time."

[tracks.bond_yun_haeri.chapters.a2.choices.wrap_the_book]
text = "Take the cover, wrap her half-finished phrasebook in it too, and offer to keep her draft safe."
hint = "She won’t hand you the cover and her draft together—not yet."
reply = "She looked at the two books stacked together, bound by one deerskin thong, for a long while. “Then my draft goes wherever you go.” Wherever I went, I said, and no seawater would touch it. She nodded, reached over, and pulled the knot one notch tighter. She still had a fair copy, she said; only the fair copy didn’t have her name on it."
effects = [{}, {}, {}, { title = "A Book Cover She Sewed" }]

[tracks.bond_yun_haeri.chapters.a2.choices.read_three_lines]
text = "Take the cover and read her the three lines inside, one in each language."
hint = "These lines take two people to read. You aren’t there yet, and she won’t hand this over just like that."
reply = "I stumbled through the Japanese and rushed the Chinese, and she didn’t correct either. When I reached the Korean line she read it with me, our two voices on top of each other, one high and one low, hers half a beat behind. When we finished she didn’t look at me. She bent her head and wound the deerskin thong three times around for me and tied it, tighter than any knot the shop put on a quire."
effects = [{}, {}, {}, { title = "A Book Cover She Sewed" }, {}]

[tracks.bond_yun_haeri.chapters.a2.choices.pay_for_leather]
text = "Say that deerskin this good has to be paid for."
reply = "“Pay in paper,” she said. “From now on, when you copy letters, buy your paper only from us.” That would be business for a lifetime, I said. She tucked the needle back into its case, her eyes still on the stitches. “That’s the idea. A lifetime.” Once it was out, her hands went still. She opened the case, shut it again, and added one word: “Business.”"

[tracks.bond_yun_haeri.chapters.s]
title = "Under the Persimmon Tree"
text = "The persimmon tree had lost all its leaves, but a dozen fruit still hung on the branches, unpicked, frozen bright red. At the final examination in the eleventh month I had interpreted on the spot in front of the Japan House without a single slip, and the teacher had only said, “Go on, then.” Now, at the year’s end, everyone from the family school gathered under the persimmon tree in the yard, all talking at once about where we would meet again. Yun Haeri came with a sheet of paper in her hand, its edges folded neat. “When you send letters,” she said, “leave a finger’s width of margin on every page, so I can write my notes.” I said the sea air was damp; by the time a letter reached her it would be crumpled. She opened the sheet to show me. It was a page of my old drafts I had left at the shop two years back, corrected by her, then caught in the rain, wrinkled like persimmon skin. “As long as the writing is still there,” she said, “it can be read, slowly.” The low sun came through the branches, and the persimmons glowed red with the light behind them."

[tracks.bond_yun_haeri.chapters.s.choices.promise]
text = "Agree that every letter will keep its margin: she adds notes, I answer them."
hint = "A promise like this needs both of you to mean it. Either you haven’t come that far yet, or you have already made your one lifetime promise to someone else."
reply = "“Then one letter will have to go back and forth several times before it’s finished,” she said. Then we’d write it several times, I said; a single letter could take a year. She thought, then added a condition. “I’ll write my notes in red. You use black. Don’t mix them up.” I didn’t even own a red brush, I said. She took a stick of cinnabar ink from her sleeve and set it in my palm. It had ridden in her sleeve so long that it was warm. Then she folded the wrinkled sheet into a tiny square, untied my book cover, and slipped it inside, flat against the three lines. “I’ll start the first letter for you.” I asked what she’d written. “Look once you’re aboard.” She wound the deerskin thong back around: once, twice, three times. Across the yard her father was calling her home. She answered, then bent and gave the knot one more tug. That night I couldn’t wait. I opened it under the lamp. In the margin was a line in red: “Line seven: your ‘two’ is missing a stroke. I’m waiting for your reply.”"
effects = [{}, {}, { title = "Under the Persimmon Tree" }, {}, {}, {}]

[tracks.bond_yun_haeri.chapters.s.choices.heart]
text = "Say that when I come back to Busan grown, I want to hear her read the line in the cover in all three languages."
hint = "To hear her read that line in three languages—you mean to ask, but your tongue ties itself in knots. Your hearts aren’t that close yet—or you’ve already given your once-in-a-lifetime promise to someone else."
reply = "She didn’t answer right away. A little old snow fell from the branches onto her shoulder, and she didn’t brush it off. After a long time she reached over and took my hand, very lightly, the way you hold a sheet you don’t want to crease. “Then I’ll read and you’ll listen,” she said. “Listen carefully. Don’t put a single word wrong side up.” Her fingers were cold, with a thin callus on the pads from years of counting out paper. Across the yard someone was calling names, none of them ours. A persimmon dropped from a branch, landed by our feet, rolled half a turn and stopped. I wanted to bend and pick it up, but she didn’t let go, so I stayed still. In the end she was the one who let go, and she tucked her hand back into her sleeve and looked at the persimmon on the ground. “Once they’ve frozen, they’re bitter even if you pick them up.” Then she crouched and picked it up herself, and put it inside her jacket."
effects = [{}, {}, {}, {}, { title = "Under the Persimmon Tree" }, {}, {}]

[tracks.bond_yun_haeri.chapters.s.choices.own]
text = "Bet her: her phrasebook against my letters, and see which reaches the fishermen first."
reply = "“Mine,” she said, without a moment’s pause. “Fishermen don’t read diplomatic letters.” The letters decided when the Tsushima boats came and who bought the fishermen’s catch, I said; in the end it all came down to me. She shook her head. “When the fishermen are haggling beside the boats, where are you? Drinking tea in the Japan House.” Then her phrasebook had better carry her name, I said, or there was no telling who won. She stopped short and looked down at the wrinkled sheet in her hand, as if it had never occurred to her. “That depends on how well you translate,” she said. “If you translate well, I’ll put my name on it, so we can compete properly.” She tore the sheet in two, gave me one half, kept the other, and wrote that day’s date on both. “Whoever wins brings their half and comes to find the other.”"

[tracks.reunion_yun_haeri]
name = "Yun Haeri: Proofs in Her Own Name"

[tracks.reunion_yun_haeri.chapters.reunion]
title = "Proofs in Her Own Name"
text = "Six years later I came back to Busan, and the first place I went was the paper shop. A small new board hung by the door, lettered “Proofreading” in her hand. On the counter lay drafts of letters sent over from the interpreters’ office, each with a slip tucked in, each slip covered in red corrections and finished with a tiny “Yun.” Against the wall stood a stack of little books bound in blue cloth: the harbor phrasebook, printed at last. Down at the wharf I had already seen an old fishmonger with one tucked inside his jacket, its corners curled. Yun Haeri didn’t look up. “Sit.” So I sat and waited for her to finish the page she was on. Only when she put down her brush did she move the lamp between us. She took out one of the little books and opened it to the title page to show me: three lines in small type, one in Japanese, one in Chinese, one in the Korean script, all saying the same thing. “What I wrote inside that book cover,” she said. “It’s printed here now.” She closed the book and set it aside. “This time I want to hear your own draft.”"

[tracks.reunion_yun_haeri.chapters.reunion.default]
effects = [{ text = "I’ve enclosed a page. It’s the first page of the phrasebook. I’ve proofread it three times; see if you can find anything. The fishermen at the wharf keep it in their jackets when they haggle with the Tsushima boats, and one old man told me it was the first time nobody had cheated him on the scales. Turn the page over. I printed the same phrases again in Japanese, for the people on the Tsushima side. Father said it was a waste, but when they come ashore they need to ask the way and buy rice too. Every letter you sent, I answered in the margins in red, not one skipped. But you move too fast, and my notes never caught up with you, so they’re all under the counter, waiting for the day you come back to collect them. There’s a board by the shop door now that says “Proofreading,” and the interpreters’ office sends its letters through my hands first. The three lines I once wrote inside that book cover are printed on the phrasebook’s title page now, not a character changed. Last winter a Tsushima boatman came into the shop to buy paper with that back page in his hand, pointed at one line, and asked who had put it together. A paper merchant, I told him. I still haven’t been to Tsushima. The paper went first: the back of that page crossed the sea on a Tsushima boat. The last page of the phrasebook carries the compiler’s name. It’s mine. —Haeri" }, {}]

[tracks.reunion_yun_haeri.chapters.reunion.choices.friend]
text = "Bring out these years’ drafts for her to proof, and press my interpreter’s seal on her proof sheet."
reply = "I untied a bundle of drafts and spread them on her desk: six years of translations, some written on Tsushima, some on board ship, every margin kept the way she had asked. She went through them page by page, her red brush quick and merciless, until it was dark. She found eleven faults. I admitted ten. The eleventh I wouldn’t admit: the name of a fish, which I had written the way the Sayeogwon glossary has it. Nobody at the wharf called it that, she said, and no Tsushima boatman either. The letters were for the gentlemen at the magistrate’s office, I said, not for fishmongers. The gentlemen at the office ate the same fish, she said. We argued until the watchman beat the second watch in the street and her father coughed twice in the back room. At last she set down her brush. “That one you can have. Just this once.” Then she turned and wrote the wharf name for the fish in the margin of her phrasebook. She squared the proofs and pushed the top page toward me. Her name was at the bottom. I took my interpreter’s seal from my jacket, breathed on it, and pressed it beside her name. She glanced at it. “Crooked.” A moment later: “No need to redo it.”"
effects = [{}, {}, {}, { title = "Proofs in Her Own Name" }]

[tracks.reunion_yun_haeri.chapters.reunion.choices.love]
text = "Say there’s no draft this time, only one sentence, and say it to her in three languages."
hint = "She’s waiting to hear your own draft. You left those words unsaid under the persimmon tree, and six years on they’re still a blank page when they reach your lips."
reply = "I said it first in Japanese, stumbling, just as I had over that line inside the book cover. She didn’t move. I said it again in Chinese, and she set down her red brush. I was partway through the Korean when she came around the counter and stood in front of me, close enough that I could see a fleck of paper dust on her eyelashes. “Not one word wrong side up,” she said. Then she kissed me, lightly and briefly, the way you test a stroke of ink on a sheet, and afterward she looked down as if to check whether it had bled. The lamp oil was nearly gone, and just like that night in the back room, nobody refilled it. The “Proofreading” board knocked against the doorframe in the wind. She reached past me and slid the bolt."
effects = [{}, {}, {}, { title = "Proofs in Her Own Name" }]

[tracks.reunion_yun_haeri.chapters.reunion.variants.bookwrap]
text = "Six years later I came back to Busan, and the first place I went was the paper shop. A small new board hung by the door, lettered “Proofreading” in her hand. On the counter lay drafts of letters sent over from the interpreters’ office, each with a slip tucked in, each slip covered in red corrections and finished with a tiny “Yun.” Against the wall stood a stack of little books bound in blue cloth: the harbor phrasebook, printed at last. Down at the wharf I had already seen an old fishmonger with one tucked inside his jacket, its corners curled. Yun Haeri didn’t look up. “Sit.” So I sat and waited for her to finish the page she was on. She put down her brush, moved the lamp between us, and held out her hand for my book cover. She opened it and looked at the three lines inside, her finger resting a moment on the Korean one. “The writing’s still there.” She pushed the cover back to me. “This time I want to hear your own draft.”"
