# 扬：格纸的价（bond_jan）与重逢（reunion_jan）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_jan]
name = "Jan: The Price of Ruled Paper"

[tracks.bond_jan.chapters.c1]
title = "The Price of Ruled Paper"
text = "In 1554 my father sent me to Plantin’s shop to order ruled paper for the account books: twelve quires, twenty-eight lines to the page. Half the shop was binding benches and half was stacked paper, and the hide glue made my eyes water. The apprentice who worked out the price was called Jan. He was about my age, his hands were sticky with glue, and the figures on his slate stood perfectly straight. “Twelve quires, and the r-ruling’s extra… nine stuivers in all.” Then he added, “Once the shop starts printing, I’ll be setting type. No more odd jobs like this.” I didn’t put his ambitions on the bill. I just turned the slate around. “And the trimming? Twelve quires, and you haven’t charged for one.” He read it once, then again, and the color crept up his face. He didn’t call the master. He untied a small purse from his belt, its drawstring worn shiny, shook out two stuivers, and pushed them into the till. His ears were redder than the stick of sealing wax on the counter."

[tracks.bond_jan.chapters.c1.choices.point_out]
text = "Once he’s paid, just tap the trimming line: remember it next time."
reply = "He waited until the till was shut before he looked up. “Th-thank you.” I told him not to thank me, just get it right next time. He nodded hard. “Next time, I swear. Next time I’ll s-set a price list and nail it to the wall, so nobody gets it wrong.” When I left with the paper in my arms, he was already copying prices onto the back of his slate, line by line. He went over the trimming line twice."

[tracks.bond_jan.chapters.c1.choices.bet_second]
text = "Bet him a stuiver there’s a second mistake on the bill."
reply = "He turned the slate this way and that for a quarter of an hour, even checked how I’d spelled my own name. There was no second mistake. I set a stuiver on the counter. He pushed it back. “I c-can’t take it. I’m the one who got it wrong.” I said a bet is a bet and a bill is a bill, and I only bet on things I can work out. This time I’d worked it out very carefully. He stared at the coin a long while, took it in the end, and closed his fist on it. “Then I’ll buy a piece of type with it. My own.”"

[tracks.bond_jan.chapters.c2]
title = "The Accent Set Backwards"
text = "Just after New Year 1555 the ruled paper arrived, and Jan brought it himself. He stacked it, didn’t leave, pulled a folded sheet out of his shirt, tucked it back, and pulled it out again. “The sh-shop starts printing this summer. I set this at night, when nobody was looking. You… take a look.” It was a passage of Greek, letters small as sesame seeds, set in neat, even lines. I’d had only one year of the Greek alphabet at school, but in the third line I pointed at the little stroke over one letter. “Isn’t this one backwards?” “It’s meant to look like that,” he said, too fast. “The type sits reversed in the stick. It comes out right when it’s printed.” So I told him to fetch the original. It was a page of verse in someone’s hand, borrowed from the master so he could copy it. He laid his proof beside it and compared them letter by letter, and in the third line his finger stopped. He stared at that letter so long I had time to count a whole quire before he spoke. “Wait. This accent is set backwards.” “I said that first.”"

[tracks.bond_jan.chapters.c2.choices.find_original]
text = "Go through the shop’s old books with him and find how that letter should look."
hint = "He folds the proof and tucks it back in his shirt. You aren’t close enough yet for him to let an outsider help hunt down his mistakes."
reply = "The master had an old Venetian book on his shelf, and we were forty pages in before we found the same word. Jan went back to the case, tipped every sort in that compartment out onto the counter, and saw it at once: accents leaning both ways had been thrown into the same box, a hair’s breadth apart. He sorted them one by one until it got dark. “From now on, if anyone says I set it backwards,” he said without looking up, “I’ll tell them Lieve caught it first.”"

[tracks.bond_jan.chapters.c2.choices.tease_accent]
text = "Laugh at him: I beat him to his own favorite line."
reply = "He went red down to his collar and said fine, he’d find a different one. He thought about it all day. The next morning, when I went to the shop for a receipt, he was waiting at the door and took a deep breath. “Wait. Your accounts are backwards.” I opened the ledger and showed him, line after line. Nothing was backwards. He stared at it a long while and deflated. “Then I’ll k-keep the old one.”"

[tracks.bond_jan.chapters.b1]
title = "Our First Price Sheet"
text = "In the summer of 1555 Master Plantin hung out a printer’s sign, and Jan finally got to stand at the type case. I paid for the paper, eight stuivers; he supplied the skill and borrowed an hour after closing. We printed a price sheet for the Bourse: pepper, alum, English cloth, Danzig rye, one price to a line. The first buyer at the Bourse door was a clerk from the Portuguese factor’s house. He studied it a long while and asked, “When do these prices change?” Jan and I just stood there. Jan opened his mouth and nothing came out. Back at the shop I added a date at the top. He looked it over, then added after each kind of goods where we’d asked: pepper from the Portuguese house, cloth from the English merchants’ yard. “Whoever gave us the price, we name them,” he said. “If it’s wrong, we kn-know who to find.” We sold out and made eleven coppers. We split ten, and he set the last one on the rim of the type case. “For the next printing. Don’t touch it.”"

[tracks.bond_jan.chapters.b1.choices.add_date]
text = "Put the day we asked after every single price, not just once at the top."
reply = "Jan grumbled about the extra letters, five more to every line, and had to switch to a narrower face. It took him two nights. The second sheet sold twice as well as the first; a Hanseatic merchant bought three at once, saying he’d compare them with yesterday’s. Jan said the dates did it, I said the typesetting did, and we argued until the master came to lock up. In the end I wrote in the ledger: credit, half each. He leaned over to read it and pointed out that I’d misspelled “credit.”"

[tracks.bond_jan.chapters.b1.choices.bet_sales]
text = "Bet him how many of the second sheet will sell, and stake the coin on the type case."
reply = "I went by the morning crowd at the Bourse and said sixty. He went by what was left over from the first run and said forty. By evening we’d sold fifty-two, and we’d both lost. Jan thought it over, pushed the copper back onto the rim of the case, and straightened it. “We both lost, so the stake goes to the price sheet. We print another.”"

[tracks.bond_jan.chapters.b2]
title = "The Night After the Abdication"
text = "At the end of October the news came from Brussels: before the assembled provinces, the emperor had handed the Netherlands to his son Philip. The next day everyone at the Bourse was clutching our old sheets and asking whether the prices still held. Nobody could say. That night Jan reset the price sheet by lamplight while I sat on the paper stack noting where each price had come from: from the Genoese, I wrote the Genoese; from the tavern, I wrote the tavern. Around midnight someone pounded on the door. Jan went white and pressed both hands flat over the type, as if to cover every letter in it. “S-searching for books?” It was the night watch, asking why the lamp was still lit. I called through the door, “Price sheets. Not books.” The footsteps went away, and it was a long time before his hands came off the type. With the oil nearly gone, he set one more line at the very bottom: “Unverified.” “Th-this line,” he said, “takes as many as it’ll hold.”"

[tracks.bond_jan.chapters.b2.choices.keep_unverified]
text = "Keep the “Unverified” line, even if we sell fewer."
hint = "He says he can get through tonight on his own. You aren’t close enough yet for him to let you sit up with him."
reply = "The next day some people cursed our sheet for being no use, half an answer to every question. Others came out of their way to buy it, saying it was the only sheet in the Bourse that dared to print “don’t know.” I glanced back while I took the money. Jan had fallen asleep against the type case with a single sort pinched in his fingers, so tight I didn’t try to pry it loose."

[tracks.bond_jan.chapters.b2.choices.guess_prices]
text = "Print whatever price most people quoted, and sell first."
reply = "That run sold out. Three days later every price on it was wrong, and people came to the shop with the sheet in hand, wanting their money back. Jan didn’t say a word. He counted the returned coppers one by one, stacked them, and handed them to me to check against the books. When the next sheet came out, there was a new line at the bottom: “Unverified.” He’d set it himself, without asking me."

[tracks.bond_jan.chapters.a1]
title = "A Little Poem in My Ledger"
text = "In August 1556, after the great procession following the Feast of the Assumption, the streets were littered with trampled petals and candle drippings. At home I went over the day’s takings, turned back to July, and a sheet slid out. It was printed: six lines, like a poem. The letters were spaced twice as wide as on our price sheets, every one set far from the next, as if crowding might break something. No name, nobody it was addressed to. The fourth line said that a certain person, counting money, tucks the tip of her tongue behind her front teeth. I counted the till once over. I do. I’d never known. The next day I took the sheet to the shop in my ledger and asked Jan, “How did your shop’s spare paper end up in my books?” “Sp-spare paper,” he said. “It was crowded on procession day. Paper blew everywhere.” Then he turned away to haul stock, shoved a pile of spoiled sheets the same size from under the counter into the bottom of the cupboard, and kicked the cupboard door shut."

[tracks.bond_jan.chapters.a1.choices.ask_who]
text = "Ask him straight out who set the poem on this spare paper."
reply = "I spread the sheet on the counter and put my finger on the fourth line. “A poem on spare paper? One that knows how I count money?” He stared at the line and opened his mouth twice before anything came out. “The p-poem’s spare too. Left over from setting something else.” Then he fled to the type case, and that afternoon the master found three wrong letters in the pages he set. Most months he didn’t make three."

[tracks.bond_jan.chapters.a1.choices.keep_poem]
text = "Don’t call him on it. Slip the poem back into the page I turn to every day."
hint = "Calling him on it now would only fluster him worse. The two of you haven’t come that far yet."
reply = "He never mentioned the poem again. But whenever I went through the ledger at the shop, he watched from behind the case to see which page I opened. Nearly a month went by before he couldn’t stand it and asked, as if it had just occurred to him, “Th-that ledger. Is it working out?” I said it was, and I turned to that page every day. The sort in his hand dropped into the case with a little clink."

[tracks.bond_jan.chapters.a2]
title = "A Poem in Ledger Form"
text = "In September I sent him one back, set out like a ledger, debit on the left and credit on the right. One goose quill, borrowed, not returned. Smiles owed me, three, see February, May, July. One scolding from the master taken on his behalf, valued at two stuivers. And at the bottom, under balance, I wrote “one walk,” and I misspelled “walk” by one letter on purpose. Three days later Jan gave the sheet back with a second one beside it. He’d reset the whole thing in the shop’s best roman, and the rule between debit and credit didn’t waver by a hair. Only the misspelled word he left alone. I pointed to it. He went red. “I s-saw it.” Then he took something small from his apron pocket and put it in my palm: a little seal of pearwood, cut with the first letter of my name, an L, backwards. “It comes out right when you stamp it.”"

[tracks.bond_jan.chapters.a2.choices.stamp_it]
text = "Press the little seal onto the poem he reset, right there."
hint = "Your hand has barely touched the seal when he slides the sheet away. You aren’t close enough yet; he can’t bear to see a mark stamped on type he set."
reply = "He’d mixed the vermilion himself; it was only ever used for the red letters in prayer books. I pressed the seal down, and a neat L landed beneath the balance line. He said it was the first one he’d ever cut, and he’d ruined three blocks of wood getting there. I said this one wasn’t ruined. He leaned in and looked at the red mark a long time. “This one I cut the slowest.”"
effects = [{}, {}, {}, { title = "A Poem in Ledger Form" }]

[tracks.bond_jan.chapters.a2.choices.the_walk]
text = "Pocket the seal and tell him the walk on the balance line gets paid today."
hint = "He looks down, fiddling with his apron strings, and says the balance line was only a joke. He isn’t ready to own that debt yet."
reply = "We walked down along the Scheldt until dark, while the lamps came on one by one along the quays. He didn’t stammer once. He talked Greek letters the whole way: which one looked like an anchor, which like a steelyard hook hung upside down, which got mixed up with others most easily in the case. Back at the shop door he said, “That’s the account settled, then.” I said it wasn’t, there was more tomorrow. He blinked, his ears went red, and he said then tomorrow we’d start from here again."
effects = [{}, {}, {}, {}, { title = "A Poem in Ledger Form" }]

[tracks.bond_jan.chapters.a2.choices.fix_typo]
text = "Ask him to correct the word I misspelled on purpose."
reply = "“No.” That much came out fast; the rest caught. “That mistake is p-part of the poem.” I said he corrected everyone else’s accents and left an error in his own setting. He didn’t answer. He folded the reset poem and slid it under the bed of his own type case, where he said it was safest. Nobody could get at it there."

[tracks.bond_jan.chapters.s]
title = "Signatures on a Partnership"
text = "In December school let out for good. I bundled my schoolbooks back to my father’s exchange table, but the agreement I copied out three times before I carried it to the shop: a partnership in price sheets, for the long run. The cost of paper and the legwork at the Bourse were mine; setting and printing were his. For profits I first wrote a two-eight split, two to him and eight to me, then struck it out and wrote halves. Losses, halves too, on the next line. The last line I left empty. Jan took it and read it line by line, and at the line about losses he looked up. “You w-worked out how much we’d lose?” “Three times. In the worst year, twenty stuivers.” He touched the little purse at his belt. Two years of saving, and he was still thirty stuivers short of a set of type of his own. He looked at the agreement again and said nothing. Outside the door Mathijs leaned against the wall with a script rolled in his hand, waiting for Jan to run lines. He saw me, gave me a nod, didn’t hurry anyone, only rolled the script a turn tighter. Jan laid the agreement flat on the counter and put his fingertip on the empty line. “What g-goes here?”"

[tracks.bond_jan.chapters.s.choices.promise]
text = "Ask him to sign: partners for life."
hint = "An agreement like this only gets signed between people who’ve come all the way. Or you’ve already made your once-in-a-lifetime promise to someone else, and this can only be an ordinary partnership."
reply = "I said the last line could wait; sign the rest first. He took up the pen and signed very slowly, his name a size larger than usual, with an extra flourish on the tail as if it might run off. “And the last line, what goes there?” I said that was a future account, and I couldn’t work it out yet. He thought, picked a few sorts out of the case, arranged them in his palm, then put them back one by one. “Then I’ll have the type set for it in advance. Whenever you decide what it says, I won’t have to pick it again.” Mathijs rapped on the doorframe outside and asked whether they were running lines or not. Jan folded the agreement, tucked it into the apron pocket where he kept his purse, and dashed out. Halfway down the street he turned around. “Tomorrow! We start the books tomorrow!”"
effects = [{}, {}, {}, {}, {}, { title = "Signatures on a Partnership" }, {}]

[tracks.bond_jan.chapters.s.choices.heart]
text = "Tell him: the last line I’ll write myself, once we’re both grown."
hint = "Your pen won’t come down on that last line yet. You haven’t come that far, or the name you sign only once in a lifetime is already on someone else’s page."
reply = "He signed the rest first, and only then looked up. I told him I’d write the last line myself, when we were both grown. His face went scarlet in one go, up to his ears and down to his collar, and it took him a while to get out, “Th-then I’ll wait.” I said no stammering, this one went in the books, so say it again. He took a deep breath, set the pen down, and looked at me. “I’ll wait.” Not a single catch, this time. He reached out a hand and stopped halfway. I took it first. His fingers were gray with lead and cold, and only warmed slowly once I held on. Outside, Mathijs had knocked once on the doorframe; on the second knock he stopped, tucked the script under his arm, and walked off down the street. Jan didn’t see. He was still looking at that line."
effects = [{}, {}, {}, {}, {}, { title = "Signatures on a Partnership" }, {}]

[tracks.bond_jan.chapters.s.choices.own]
text = "Take the agreement back: he runs his print shop, I run my trade."
reply = "I slid the agreement off the counter and folded it in half. “You save for your type, I’ll save for my ship. We talk partnership once you have a shop of your own.” Jan froze for a moment, like a man let off the hook who’d also lost something. “Th-that’s fair. I haven’t saved enough for the type. Signing now, I’d only drag you down.” All the while he kept a hand pressed over the purse at his belt, so hard its drawstring went crooked. He walked me to the door, told Mathijs which scene they’d run tonight, then came two steps after me. “I’ll still print your price sheets. At the going rate, not a copper less.” I said naturally, and I wouldn’t pay a copper less either. He laughed in the doorway, remembered the cold only after, and hunched back inside."
effects = [{}, {}, {}, { title = "Signatures on a Partnership" }, {}]

[tracks.reunion_jan]
name = "Jan: Which Crate First"

[tracks.reunion_jan.chapters.reunion]
title = "Which Crate First"
text = "In November 1576 my ship tied up at the Antwerp quay while the smoke still hung over the city. The stalls in the Bourse galleries had been hacked open, and the streets were strewn with ledger pages and broken crockery. People said Master Plantin had paid the soldiers at his door to go away; Jan didn’t have that kind of silver. His print shop stood in a lane two streets from the quay. The sign had been split in two, and only half still hung. Inside, one of the two presses lay on its side, the cases were overturned, type was scattered across the floor, and he and two apprentices were crouched there picking it up one sort at a time. When he saw me he stood, knees gray with dust, and the first thing he said was, “Your ship. How m-many crates will it hold?” Not many. He pointed to two crates in the corner. One held unsold manuscripts, proofread three times. The other held the shop’s roll: fourteen workers, their wages and the streets they lived on. “Which one first?” I said the manuscripts; that was money. He said the roll. “A smashed shop can open again. Once people scatter, you never find them.” Before we went out he felt along the edge of the case and put an old sort in my palm. It was that Greek letter, its little stroke leaning the right way."

[tracks.reunion_jan.chapters.reunion.default]
effects = [{ text = "The letter was printed, the type set immaculately, even the line spacing measured. “Lieve: you weren’t in the city those days in November, and I’m glad. The shop is half smashed. One of the two presses went over and the type was all over the floor. The apprentices and I spent three days picking it up, and not one sort is missing, except a single one from the Greek box. I suppose some soldier pocketed it for silver. He’ll be disappointed. The workers’ roll is safe. Fourteen people, fourteen households; I went around to every one, and they’re all still there. Master Plantin bought his peace with silver. All I have is a house full of paper. The soldiers turned it over, decided paper wasn’t worth anything, knocked over a press, and left. Two crates of manuscripts are gone. They can be printed again. I enclose a poem, in ledger form. You know the format. Debit: one winter, one press, two crates of manuscripts. Credit: the roll, fourteen households. Balance: waiting for you. Jan”" }, {}]

[tracks.reunion_jan.chapters.reunion.choices.both_crates]
text = "Take both: the roll first, then the manuscripts."
reply = "The roll was light, and the two of us carried it between us. The manuscripts were heavy, and it took four sailors. We kept at it until dark, pulled two locked forms of standing type out from under the fallen press, and the hold was full. Jan stood at the bow looking at the smoke over the quay and asked me, “That partnership we drew up back then. Does it st-still hold?” I said the lines for profit and loss had always held. He nodded and pushed the roll crate further in. “Then this cargo, the manuscripts are ours, both of us. The roll belongs to the workers. Not one copper of it goes in the books.” I wrote two lines in the ledger. He craned to look and put a finger on one word. “Th-there’s a letter missing here.” I didn’t change it. He let it be, and reached over to smooth the page flat."
effects = [{}, {}, {}, { title = "Which Crate First" }]

[tracks.reunion_jan.chapters.reunion.choices.last_line]
text = "On the ship, write in the last line of that old agreement."
hint = "That line was never agreed on back then, and today it’s still empty."
reply = "Once the hold was full, I dug the agreement out of the bottom of my chest. Twenty years; the edges had gone yellow, and the last line was still empty. I borrowed his pen and wrote: partners, for life, everything included. Then I handed it to him. Jan read it a long time, and this time not one word caught. “I’ve waited twenty years for this line. The type’s been set for ages. It’s in the third drawer at the shop, tied up with thread, and even with the place smashed like that it didn’t come apart.” He lifted my hand and kissed the back of it, then bent his head and kissed my forehead. Someone on the quay called to cast off. He stepped back half a pace, his ears still red, his voice steady. “Now we sail. The roll’s in the hold. We take it to the workers’ homes, one house at a time.” I said yes, and from today the books would carry two names."
effects = [{}, {}, {}, { title = "Which Crate First" }]

[tracks.reunion_jan.chapters.reunion.variants.with_mathijs]
text = "In November 1576 my ship tied up at the Antwerp quay while the smoke still hung over the city. The stalls in the Bourse galleries had been hacked open, and the streets were strewn with ledger pages and broken crockery. People said Master Plantin had paid the soldiers at his door to go away; Jan didn’t have that kind of silver. His print shop stood in a lane two streets from the quay. The sign had been split in two, and only half still hung. Inside, one of the two presses lay on its side, type was scattered across the floor, and he and two apprentices were crouched there picking it up one sort at a time. At the other end of the room Mathijs, sleeves rolled up, was nailing a crate shut with nails between his teeth. Jan followed my eyes. “Mathijs. He’s the one beside me.” Then he stood, knees gray with dust. “Your ship. How m-many crates will it hold?” He pointed to two crates in the corner. One held unsold manuscripts, proofread three times. The other held the shop’s roll: fourteen workers, their wages and the streets they lived on. “Which one first?” I said the manuscripts; that was money. He said the roll. “A smashed shop can open again. Once people scatter, you never find them.” Before we went out he felt along the edge of the case and put an old sort in my palm. It was that Greek letter, its little stroke leaning the right way."
