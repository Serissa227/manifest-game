# 塔里克的羁绊线（bond_tariq / reunion_tariq）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 诺埃尔不用 he/she/him/her/Sir/Lady/Miss/Mister；“Lady Knight”只出现在 noel_unveiled 变体里。口头禅原句 “Cargo, never people.” 只在 c1 出现一次。

[tracks.bond_tariq]
name = "Tariq al-Gharnati: Letters from Across the Strait"

[tracks.bond_tariq.chapters.c1]
title = "The First Letter from Across the Strait"
text = "Early that year, before it was properly light, the old doctor from Ceuta knocked at my door. I swore at him from under the blankets. He didn’t mind; he just drew a letter out of his sleeve. On the outside it said: “To the last knight in the castle at Tarifa.” The seal was from Fez, pressed on crooked. “The boy who wrote it is an al-Gharnati. He studies at the Qarawiyyin,” the old doctor said. “He asked about Tarifa, and I said a word too many.” The letter was in Castilian, spelled every which way. The first line read: “I hear the knights of Tarifa are down to one child. Can the child ride? Can the child swim? If we meet on the Strait one day, do I call you knight, or child?” Below that he found fault with three more things: the Order’s banner was too old, Tarifa tuna cost too much, and people in Seville talked too slowly. It was signed Tariq al-Gharnati, and under the name, on a line of its own, in letters bigger than anything else on the page: “Cargo, never people.” I read it three times. On the third reading, at the word “child,” I threw off the blankets and sat up. That morning I didn’t sleep in. I wrote three pages back and used up half a bottle of ink."

[tracks.bond_tariq.chapters.c1.choices.circle_his_typos]
text = "Circle every word he misspelled and send his letter back along with mine."
reply = "I counted: eleven. Under the circles I added a line: “Do all you pirates write like this?” The old doctor held both letters up to the window against the light, reached that line, and laughed until his beard shook. “He’ll be livid.” He tucked both letters into his sleeve and was still laughing on the stairs, until the laugh turned into a long fit of coughing."

[tracks.bond_tariq.chapters.c1.choices.ask_what_he_robs]
text = "Write back and ask him: cargo only? Then what cargo have you ever taken?"
reply = "For two and a half pages I tore into his spelling and his seal, and into people in Fez who couldn’t tell which side of the water Tarifa was on. The last half page held one line: “Cargo, you say. What cargo have you ever taken?” The old doctor glanced at it as he sealed the letter. “The first two and a half pages, he’ll skip. That line, he’ll answer.”"

[tracks.bond_tariq.chapters.c2]
title = "Harsh Words Half a Year Old"
text = "At the start of summer the old doctor came again, and this letter was twice as thick as the last. Tariq opened fire at once: “What gives you the right to say my seal looks like a donkey stepped on it? A donkey’s hoofprint is neater than your handwriting!” Then two pages on my spelling, and one on how sour the oranges in Seville were. I was halfway through before I remembered that the donkey was mine. I had written it at the start of the year and forgotten it the moment it was sent. I dug out my draft and copied both dates onto one sheet: mine was written in winter, his in spring, and it reached me in summer. He was answering my winter temper; I was reading his spring temper; by the time my reply got to Fez, it would be nearly winter there again. The old doctor sat drinking my orange juice and wincing at how sour it was. “You two have been fighting with each other from half a year ago.” I weighted the sheet of dates under the inkwell. If he was that angry in spring, by now he might well have changed his mind. The ship just hadn’t arrived yet."

[tracks.bond_tariq.chapters.c2.choices.date_side_by_side]
text = "Write the two dates side by side and ask him: do you still think so?"
hint = "Two letters into a quarrel, asking what he thinks now would look like giving in first. You can’t put that on paper yet."
reply = "His answer came faster this time. First line: “I don’t. I forgive you for the donkey. Here’s something new to yell at you about.” The new thing was that people in Seville didn’t spit out their olive pits. I laughed out loud at my desk until the pageboy next door banged on the wall for quiet. It was the first time one of his letters had made me laugh."

[tracks.bond_tariq.chapters.c2.choices.scold_better]
text = "Yell right back, and do it with more style than he does."
reply = "I wrote four pages and returned the donkey and the seal with interest; the last page was a list of his misspellings. He wrote back five. The old doctor weighed the two letters in his palm. “Every letter you two send eats more paper than the last. At my age, my sleeves can barely hold them.”"

[tracks.bond_tariq.chapters.b1]
title = "The Ship That Did Not Come"
text = "At the end of September a boatman up from Sanlúcar said there was fighting in Fez: the Saadis had come up from the south and taken the city back, and the few troops the Turks had left couldn’t hold it. The ship we’d counted on didn’t come. Neither did the old doctor. I went on writing one letter a month and left each one unsealed in the wooden chest under my bed. The first tore into his spelling. The second tore less, and asked how high the walls of Fez were and whether his alley was far from the city gate. Halfway through the third I stopped, crossed out everything above it line by line, and began again: “If you’re still alive—” I didn’t write the rest. The other pages came to fetch me for almond sweets; I said I wasn’t hungry. The stack in the chest grew thicker than the thickest letter he had ever sent. At the end of the year the old doctor finally came, coughing all the way, and said the wind on the Strait had kept the boats in port for over a month; they had only just started running again. He stamped the mud off his shoes in the doorway and asked, “Any letters to take?”"

[tracks.bond_tariq.chapters.b1.choices.send_the_pile]
text = "Hand over the whole chest, with a note on top: if you’re alive, send back one word."
hint = "You still can’t bring yourself to let him know you’ve been worrying all these months."
reply = "Three months later the answer came. A whole sheet, and in the middle, a single word: “Alive.” Under it was a bird, so lopsided it could have been a gull or a chicken. The old doctor said the fighting in the city had lasted three months, and the boy had hidden half the winter in the cellar of a family from home in the Andalusian quarter. I put the sheet in my sword case, under the sword."

[tracks.bond_tariq.chapters.b1.choices.send_one]
text = "Hand over just one letter, the coldest of the lot, as if none of it mattered."
reply = "The one I gave him was the first, nothing but complaints about spelling. His answer arrived in spring: “This letter is far too calm. It doesn’t sound like you. Did the Seville winter freeze your mouth shut?” I swore and tossed it on the bed. That night I fished it out again and read it more times than I could count."

[tracks.bond_tariq.chapters.b2]
title = "The List of Names"
text = "This letter was thin. I opened it and went looking for the insults, and couldn’t find a single one. Tariq asked one thing only: “In the slave market in Seville, are there people taken from our side of the water? I need names. Names, which village, whose son. With a name, people here can pool money to buy them back.” He didn’t ask about the weather at the end. On Sunday I went to the steps outside the cathedral. Everything was sold on those steps: cloth, old swords, wine, and people. I went from one to the next with pen and paper. Some wouldn’t answer. Some named places I couldn’t spell, so I drew what they traced in the air: a mountain, two rivers, a date palm. An old man with a white beard heard me ask in Arabic where he came from, stared a long time, then asked if I’d come to buy him back. I said no, I was asking names for someone else. He held onto my sleeve and wept, too hard to say a word, until a guard came and pulled him off. That night I made a clean copy: nineteen names. When I reached the old man’s line, I couldn’t hold the pen steady. My hand kept shaking."

[tracks.bond_tariq.chapters.b2.choices.go_to_market]
text = "Send him the list, then go back to the steps and fill in the places you drew."
hint = "You aren’t close enough yet to take this on together. You write the list, tear it up, and write it again."
reply = "The next Sunday I went back, and this time I dragged the old doctor along. Mountain, rivers, date palm: one look and he read the place names straight off my drawings. Of the nineteen names, sixteen were now complete. Tariq’s answer was long, and there wasn’t an insult in it. “This time both shores are working from the same list.” The last line was squeezed against the edge of the page: “Next letter we go back to fighting.”"

[tracks.bond_tariq.chapters.b2.choices.refuse_order]
text = "Write back that a knight of the Order calls no roll at a slave market. No list."
reply = "His answer was a single line: “Then I’ll find another way.” He had pressed so hard the nib tore the paper. I spread the sheet on my desk and looked at it all night. As soon as it was light the next morning, at an hour I normally can’t get up for anything, I put the nineteen names in my pocket and went back to the cathedral steps."

[tracks.bond_tariq.chapters.a1]
title = "Lamp Oil"
text = "The winter nights were long. I was writing to Tariq by lamplight, three pages in, when a drop of oil spat out and landed right on the word “Seville,” spreading into a yellow ring. I picked up the sheet to start over, then remembered his last complaint: “Your handwriting is as tidy as a clerk’s. One look puts me to sleep.” So I drew a circle around the drop and wrote beside it: “Today’s only battle wound.” Half a year later his reply came. Tariq didn’t yell at me this time. On the back of the sheet he had drawn a lamp, the base crooked, the flame leaning to one side as if there were a draft in the room. Under the lamp, in small letters: “Don’t spill oil on your sleeve again. On the paper it doesn’t matter. Sleeves are hard to wash.” I turned the sheet over, then back. I didn’t know which alley in Fez his room was on, which way its window faced, or whether the wind got in at night. The old doctor, sitting nearby, said, “What he means is, he writes at night too.”"

[tracks.bond_tariq.chapters.a1.choices.keep_the_lamp]
text = "Fold the crooked lamp into your sword case and write back one line: my sleeve is fine."
hint = "You keep looking at this drawing and still don’t know where to put it. You’re not there yet."
reply = "His next letter had another lamp. This one stood straight, its flame upright, and beside it he’d written: “Half a month of practice.” I laid the two lamps side by side in the lining of my sword case. When the other pages came rummaging through my things, I snapped the case shut and sat on the lid. Nobody was getting a look."

[tracks.bond_tariq.chapters.a1.choices.more_names]
text = "Enclose the five new names you’ve found and tell him the list won’t stop."
hint = "The two of you haven’t come far enough with the list yet to promise to keep it going."
reply = "I had gotten the five names on the steps that spring; one came from the same village as the old man who had wept the year before. Tariq wrote back: “With your shore in it, I’m not afraid of the list breaking off.” The end of that letter had no insults and no question about the weather, only a small circle with a five inside it."

[tracks.bond_tariq.chapters.a1.choices.draw_a_sword]
text = "Draw him a sword, even more crooked than his lamp."
reply = "My sword pointed down, the blade bent as if a horse had stepped on it. His answer said: “Your sword looks like a leek. Do the knights of Tarifa ride into battle carrying leeks?” I laughed all day. At practice the next morning every cut made me think of leeks; the fencing master asked what was so funny, I said nothing, and laughed again."

[tracks.bond_tariq.chapters.a2]
title = "A Cloth Case for Letters"
text = "The old doctor brought a small linen parcel. Inside was a cloth case a finger’s width wider than a sheet of letter paper, in dark green silk, with a border of grapevines stitched around the edge. Tariq’s letter was tucked inside: “My mother made it. The silk is from the Alpujarras, the last skein she brought out of Granada. She kept it thirteen years for something that mattered. The corners of your letters are worn through. Put them in this. And don’t thank me. My mother can’t hear you, and I don’t want to.” I gathered more than two years of his letters into a stack and slid them in. Halfway they jammed, so I pulled them out to sort them again. That was when I saw a line of tiny stitches on the inside, so close-set you could only see it with every letter out and the case turned inside out: “Don’t die before we meet.” The old doctor leaned over for a look. “His mother did the outside. That line in there—the stitching is different.”"

[tracks.bond_tariq.chapters.a2.choices.use_it]
text = "Accept the case, put all his letters inside, and write back: you too."
hint = "You aren’t close enough yet to accept it, and you wrap the case back up in its linen."
reply = "His answer was one word: “Good.” He’d written it so big it took up half the page, and the ink had soaked through; turned over, you could still read it. I put that sheet in the case too, on top. The case bulged until the grapevine border would barely close."
effects = [{}, {}, {}, { title = "A Cloth Case for Letters" }]

[tracks.bond_tariq.chapters.a2.choices.write_inside]
text = "Accept the case, stitch a line under his, and send it over on the next boat for him to see."
hint = "You pick up the needle and put it down again. This gift is too heavy; you aren’t close enough yet to add a line to it."
reply = "I borrowed a needle from one of the maids in the marquis’s house and sewed by lamplight for three nights. I pricked a finger twice and managed three words: “You too.” Each stitch sat higher than the last. The case crossed the Strait and came back with a note inside: “My mother looked at it and says the stitching is like the swordwork. Too straight. Can’t turn a corner.” Under that, in Tariq’s own hand: “I think it’s fine.”"
effects = [{}, {}, {}, { title = "A Cloth Case for Letters" }, {}]

[tracks.bond_tariq.chapters.a2.choices.mock_the_silk]
text = "Write back and tease him: a pirate’s mother does embroidery?"
reply = "“A pirate’s mother can do anything,” he wrote back. “She can curse, too, better than I can. Laugh at her to her face and she’ll put you off your food for three days.” Below that he scolded me for two more paragraphs, and at the end he asked: “Has it rained in Seville?”"

[tracks.bond_tariq.chapters.s]
title = "Sending the Promise"
text = "In December half the pages in the marquis’s house left, some for home, some for Barcelona to serve the marquis. Every day someone in the courtyard was saying goodbye face to face, with a hug or a slap on the shoulder. My goodbye had to go with someone crossing the Strait. In spring I was going back to Tarifa to be knighted, and after that I would live in the castle, so I had to tell him all over again where to send his letters. Tariq’s last letter said: “Salah Rais is dead, and the captains in Algiers are carving up his ships. Next year I’m going back for one of my own.” I hauled three years of letters out of the chest under my bed and laid them across the table by date. The earliest were still arguing over a word: whether the water between us should be called “the Strait” or “our sea.” Three letters on that, and then we both forgot. The new letter was done: the castle’s address, the day of my knighting, which window faced the sea. At the last line I stopped. The nib hung over the paper, and a drop of ink fell. The old doctor coughed in the doorway. “The boat won’t wait, knight.”"

[tracks.bond_tariq.chapters.s.choices.promise]
text = "End the letter: if we meet on the Strait, full names first, then anything else."
hint = "The pen stops on the paper. A promise you make once in a lifetime: either you aren’t there yet, or you’ve already said it to someone else."
reply = "I wrote: “Noël de Cadena. Next time we meet on the Strait, that comes first, then the swords.” It looked too solemn, so I added in the margin: “If you dare give me just ‘Tariq,’ I’ll act like we’ve never met.” In spring, seven days before my knighting, his answer reached Tarifa. A big sheet, and in the middle his full name, every letter careful, not one misspelled: “Tariq al-Gharnati.” Below it: “Cargo yes, people still no—count that as part of the name. And you give yours in full too, not just ‘knight’ and done.” Further down he scolded me for half a page: why hadn’t I told him sooner about something as big as a knighting? Now he had no time to find a gift. The last line asked whether the east wind was blowing at Tarifa. I folded the letter and slid it into the innermost fold of the case, right on top of the line that said “Don’t die before we meet.”"
effects = [{}, {}, { title = "Sending the Promise" }, {}, {}]

[tracks.bond_tariq.chapters.s.choices.heart]
text = "End the letter: when we meet, don’t draw first. There’s something I have to answer you face to face."
hint = "The words reach the tip of the pen and pull back. It isn’t time for a promise like this—or you’ve already made one to someone else."
reply = "I wrote that line three times and crossed it out twice; the one I kept was short. I didn’t let the old doctor see the letter when I sealed it, and he didn’t ask. He only put it inside his coat instead of up his sleeve. In spring I went back to Tarifa, was knighted, cleared out the room in the castle that faced the sea, and went down to the harbor every morning to ask whether a boat had come from Ceuta. March, nothing. April, nothing. In May the fishermen set their nets for tuna and the Strait was all floats; I figured his boat couldn’t get around them. At the end of June the letter came. The packet was thicker than any he’d sent, but inside was a single sheet with a single line: “Then I’ll put my sword down first.” It was good paper, white and heavy, nothing a pirate could afford. I held it up to the sun at the window and found a watermark in it: a bird. I laid it between the two lamps in my sword case."
effects = [{}, {}, {}, {}, { title = "Sending the Promise" }, {}]

[tracks.bond_tariq.chapters.s.choices.own]
text = "End the letter: the first time we meet, we duel."
reply = "I wrote: “The first time we meet, we duel. No holding back, no running, and no blaming your spelling.” It felt wonderful; sealing it, my hand didn’t shake at all. His answer reached Tarifa in spring, just in time for my knighting. “Agreed. Loser buys the wine—” and the rest was struck out. “I can’t drink wine. Loser buys mint tea, then, Algiers mint tea, with sugar till the spoon stands up.” And: “You say in your letters you can never get up in the morning. On the day of the duel, I won’t wait.” Then half a page on how my new address was too long, and as always he asked about the weather in Seville. I wrote back that I didn’t live in Seville anymore. His next letter asked: has it rained in Tarifa?"

[tracks.reunion_tariq]
name = "Tariq al-Gharnati: The First Meeting"

[tracks.reunion_tariq.chapters.reunion]
title = "The First Meeting"
text = "The harbor at Algiers was blinding white. My ship had barely come alongside, the gangplank not yet steady, when someone by a bollard stepped into my path. He wore one gold earring and a red sash wide enough to go twice around him. “Tariq al-Gharnati.” Having given his name, he didn’t move aside and didn’t say another word. He only looked at my face, and kept looking, too long. “What are you staring at?” I said. “Full name given? My turn. Noël de Cadena.” He grinned and drew his sword. We fought from the quay all the way out along the mole. He was fast and full of tricks, and he cursed the whole time: my footwork, my ship, Tarifa’s tuna. I didn’t answer once; I saved my breath. At the far end of the mole each point rested on the other’s collar, and neither of us could gain another inch. He pulled back first and dropped onto the stones, laughing and out of breath. “A draw. Fine. Get out your list.” He drew a roll of paper from his sash; I took mine from inside my coat. We spread the two sheets on the stones and pinned the corners with our swords. It was the same ship’s people: his list said where each had been taken from, mine where each had been sold."

[tracks.reunion_tariq.chapters.reunion.default]
effects = [{ text = "Knight: you didn’t come. I stood on the quay three days, and by the third my red sash had gone slack. I matched the list by myself and only got halfway—without yours, there are five people from that ship I only know where they were taken from, not where they were sold. I’ll keep looking for those five. If I find them, I won’t tell you. Never mind, I will, or there’s no telling what that mouth of yours will say. The man carrying this is called Ali. He was ransomed last year after seven years at the oar on a Cádiz ship. He says he’s seen the steps outside the cathedral in Seville, and it was raining that day. I asked if he’d ever seen someone with pen and paper going from one person to the next asking names. He said no. I figured. By then you were long gone from there. I have a ship now. She’s called the Gull, with a wooden gull carved on her bow, carved crooked—you’re not allowed to laugh when you see it. Next time you’re in Algiers, look for the red sash; I’m the only one on the whole waterfront who wears one this wide. I still take only cargo. Don’t die before we meet. —Tariq al-Gharnati. P.S. Has it been raining in Seville lately? I know you haven’t lived there in ages. Just asking." }, {}]

[tracks.reunion_tariq.chapters.reunion.choices.friend]
text = "Sit down with him and match every name from that ship, one by one."
reply = "We lay on the mole matching names. He read and I searched; I read and he searched. We kept at it until dark, when the lighthouse keeper brought down a lamp. Tariq set it between the two sheets; its base was crooked, and he tried twice to straighten it without any luck. When we were done there were two names only on my list and three only on his. He scored a line under each of the five with his thumbnail. “These five will be the hardest to find.” “And the ones most worth finding.” He looked up at me as if he hadn’t expected that, and only after a while said, “Tomorrow I’ll ask the jailers. You ask the ships’ clerks. Whatever we turn up, we meet back here.” I said all right. He blew out the lamp and added, “Is it raining in Seville these days?” “I haven’t lived in Seville for years.” “I know,” he said. “Six years of asking. I can’t break the habit.”"
effects = [{}, {}, {}, { title = "The First Meeting" }]

[tracks.reunion_tariq.chapters.reunion.choices.rival]
text = "Tell him that bout didn’t count. Again tomorrow."
reply = "“Didn’t count?” He sprang up off the stone. “My point was on your collar and it didn’t count?” “The point on your collar was mine.” He glared at me, thought it over, and said, “Tomorrow I’ve got a ship to take. The day after.” The day after, at sunrise, he was waiting at the end of the mole right on time, in an even wider red sash—new, he said, and it wouldn’t get in the way. We fought all morning, until the fishermen who’d stopped to watch had gone home to eat, and it was still a draw. He sheathed his sword, breathing hard, and led me to a stall by the quay, where he ordered two glasses of mint tea, with sugar till the spoon stood up. “Loser pays,” he said. “Nobody lost today, so I pay. Next time you pay.” “Next time I win.” “We’ll see.” He took a big gulp, scalded his mouth, sucked in air, and still wouldn’t put the glass down."
effects = [{}, {}, {}, { title = "The First Meeting" }]

[tracks.reunion_tariq.chapters.reunion.choices.love]
text = "Say to his face the words you once promised in a letter."
hint = "Those words never made it into a letter back then, and standing in front of him today, you still can’t say them."
reply = "I sheathed my sword and walked over to the stone where he sat. In that letter four years ago I had written: when we meet, don’t draw first; there’s something I have to answer face to face. We had drawn, and fought for an hour besides. “About that,” I said. He looked up and stopped smiling. I said it. It was short, shorter than the line in the letter. The wind lifted a corner of his red sash and flicked it against the back of my hand. He didn’t answer right away. First he sheathed his own sword and fastened the clasp. “I’ve been waiting on the Strait for those words,” he said, “for four years. No—counting from your first letter yelling at me, six.” He stood, and his earring caught the last of the sunset. That night on the mole he kissed me, very lightly, as if afraid of tearing a sheet of paper. Far off, the lighthouse lamp came on; the two lists still lay pinned on the stones, one corner lifting in the wind."
effects = [{}, {}, {}, { title = "The First Meeting" }]

[tracks.reunion_tariq.chapters.reunion.variants.unveiled]
text = "The harbor at Algiers was blinding white. My ship had barely come alongside when someone by a bollard stepped into my path: one gold earring, a broad red sash. “Tariq al-Gharnati.” Having given his name, he stared at my face, from brows to chin and back again. “What are you staring at?” Only then did he laugh. “The ‘Lady Knight’ story is all over both sides of the Strait. You never once wrote what you looked like, so I always figured you were ugly.” Then he doubled over at his own joke, hanging onto the bollard. When he’d had enough, he wiped his eyes and drew his sword. “Full name. Yours.” “Noël de Cadena.” We fought from the quay to the far end of the mole: a draw. He sat on the stones catching his breath. “Get out your list.” We spread the two sheets and pinned the corners with our swords. It was the same ship’s people: his list said where each had been taken from, mine where each had been sold."
