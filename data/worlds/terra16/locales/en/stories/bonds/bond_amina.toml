# C7 英文覆盖：阿米娜（墨未干）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_amina]
name = "Amina: The Ink Isn’t Dry"

[tracks.bond_amina.chapters.c1]
title = "Who Will Read It"
text = "The copyist’s stall outside the gate of al-Azhar was one low table under a scrap of old sailcloth. I wanted a cheap book of poems to practice my letters on. I asked the price. The copyist didn’t look up. “Who’s reading it?” “Me.” “By what light? Day or night? How are your eyes?” Her name was Amina. She couldn’t have been many years older than me, but she asked questions like a debt collector. I told her the reader was a Swahili boy from Kilwa who read Arabic slower than a camel crossing a bridge. She didn’t laugh. She took out a slip of paper the size of her palm, dipped her pen and wrote: “Reader: slow.” A freshly copied page lay drying on the table, the letters glossy black. I reached over to turn it, and she clapped a hand down on the corner. “The ink’s still wet. Nobody turns this page.” She slid the page into the sun, looked me over once more and added a line to the slip. I leaned in. The only word I could make out was “big.” “I’ll copy yours a size larger,” she said. “We’ll talk price after.”"

[tracks.bond_amina.chapters.c1.choices.tell_truth]
text = "Own up: I read slowly, and I’d like the lines spaced wider."
reply = "She nodded and added another line to the slip: “Reader laughs a lot. Letters must be big.” I asked what laughing had to do with it. “People who laugh can’t sit still,” she said. “The eye jumps and skips a line. If the script is small, you’ll never find your place again after you’ve stopped laughing.” She tucked the slip under her inkstone and smoothed it flat, the way you’d file an order."

[tracks.bond_amina.chapters.c1.choices.haggle]
text = "Do it the Kilwa way: haggle first, talk later."
reply = "She named a price. I bargained. She didn’t budge. I told her about my father haggling over gold in Sofala; she said, “Good story,” and still didn’t budge. Three rounds later I was beaten fair and square, and on my way out I paid her an extra half copper. “What’s that for?” “The slip of paper.” She copied what was on it into her own ledger first, then folded it and handed it over. “The reader may as well keep it.”"

[tracks.bond_amina.chapters.c2]
title = "A Finger’s Width Between Lines"
text = "To repay her for the extra copying, I offered to rule her paper. She handed me a ruling board: a row of fine cords strung across a plank, with little lead weights hanging behind. “Press the sheet down, run your thumbnail along each cord, and there are your lines.” An old sheikh who lived behind the lecture halls had ordered a prayer book. I ruled twenty sheets in one go. Amina leafed through them and said neither good nor bad. “Take them to him yourself.” The old sheikh held a sheet to the tip of his nose and squinted for a long while. “My boy, are these lines quarreling? Why are they shoving each other like that?” I carried the sheets back with a joke ready on the way. When I reached the stall, Amina was rubbing her eyes with the back of her hand. Twice, then she dropped it fast and bent over her copying again. “What did he say?” “He says the lines are quarreling.” She flicked one of the lead weights and the cord trembled. “Then move them farther apart.”"

[tracks.bond_amina.chapters.c2.choices.rule_wider]
text = "Rule twenty fresh sheets, a finger’s width between lines."
hint = "She won’t hand over twenty more sheets. She paid for the paper herself, and you don’t know each other that well yet."
reply = "I moved the cords on the board one by one, a finger’s width apart, and ruled until the sun dropped behind the city wall. Amina held the sheets up to the last of the light in the doorway. “He can read these himself now. No need to send for his grandson.” I asked what I owed for the paper; twenty sheets of Venetian paper aren’t cheap. She wrapped them in a cloth. “Call it your wages for the ruling.”"

[tracks.bond_amina.chapters.c2.choices.ask_eyes]
text = "Ask her: are your eyes tired?"
reply = "She gave a short laugh. “Lamp oil is expensive. Eyes are cheap. Mind your own business.” Then she took the board, moved three cords herself and pressed three lines to show me. “That’s what wide means. Lay your thumb flat between them, and it shouldn’t touch either side.” I laid my thumb in. It fit exactly. I didn’t ask about her eyes again, and she didn’t rub them again that afternoon."

[tracks.bond_amina.chapters.b1]
title = "The Line I Skipped"
text = "Amina’s father had taken an order for two short treatises, due first thing Friday. One went to her, and one to me: she had put in a word, saying the boy from Kilwa had a knack for ruling. “A bet,” I said. “Whoever finishes first gets a cup of cane juice from the other.” “Bet whatever you like.” Amina dipped her pen. “Anyone who drops a word loses.” I handed mine in on Thursday evening. Her father checked it page by page, and on the sixth page he picked up a red pen and drew a circle in the middle. Two sentences ended on the same word; my eye had slid from the tail of one straight to the tail of the next, and a whole line in between was gone. Amina handed hers in early the next morning. Her father went through it front to back and didn’t draw a single circle. I waited for her to laugh. She didn’t. She tapped the red circle with the end of her pen. “That’s your eye cutting corners. When two lines end alike, it takes the shortcut. I skipped a whole paragraph when I was twelve, and my father made me copy the entire book over.”"

[tracks.bond_amina.chapters.b1.choices.own_up]
text = "Show her father exactly where the line went missing, and recopy the page then and there."
reply = "I opened the original and showed him which sentence my eye had slid past. Her father raised an eyebrow. “Confessed it yourself. That’s rare.” I recopied the sixth page on the spot, this time with a finger holding my place, inching down one word at a time. Amina ground ink beside me, then pushed the inkstone my way. “You get paid for this page. The cane juice is separate, and don’t think you’re getting out of it.”"

[tracks.bond_amina.chapters.b1.choices.pay_bet]
text = "Pay up: a cup of cane juice, plus a piece of the Liyongo epic."
reply = "The cane-juice stall stood at the mouth of the Khan al-Khalili. I told her how Liyongo’s mother baked a file into a loaf and sent it into the prison, and how he sang while he sawed through his chains. Amina held her cup the whole time and never drank. When I finished she said, “Write it down. I’ve never copied a Swahili poem.” I spelled out Swahili in Arabic letters, all crooked. She made a fair copy, neater than mine, and spelled every word I’d gotten wrong exactly the way I had. “The reader’s own words,” she said. “I don’t change them.”"

[tracks.bond_amina.chapters.b2]
title = "The Daylight Price"
text = "The spice merchant came after dark with a waterlogged ledger in his arms. He wanted a fresh copy made overnight; his ship sailed in the morning, he said. “Half price. Copyists have nothing to do at night anyway.” I expected her to throw him out. She nodded. The lamp was lit. The smoke climbed in threads, and before long the spout of the clay lamp had a black ring of soot. I sat beside her holding down the corners of the old ledger, and I saw that with every line she leaned a little closer to the flame, squinting, her letters a size larger than usual. On the third page she stopped, pulled the lamp an inch closer and wiped her eyes with her sleeve. “Don’t tell Zubayda.” Her voice was very low. “I’ve already turned down night work from several houses. My eyes can’t take it. But the family needs money this month.” “And you still took this?” “Half price is still money.” She dipped her pen. “Hold the page down and stop talking. I’m counting lines.”"

[tracks.bond_amina.chapters.b2.choices.bargain_daylight]
text = "Go bargain with the merchant for her: daylight copying only, paper extra, two more days."
hint = "She says her business is her own. You don’t know each other well enough yet for her to let you set her price."
reply = "The merchant hadn’t gone far: he was at the coffee stall next door, waiting for the first pages. I brought him back and asked first when his ship really sailed. Not tomorrow morning, it turned out, but three days from now; the captain was still waiting on a load of pepper. I made him laugh three times. The price didn’t drop by a coin, but the deadline stretched by two days, with daylight copying only. Amina kept her head down, counting lines, until we had shaken on it. Then she looked up and added one condition of her own. “And I’m not paying for the lamp oil.” The merchant stroked his beard and agreed. She turned and blew out the blackened lamp."

[tracks.bond_amina.chapters.b2.choices.buy_oil]
text = "Bring her a jar of good lamp oil the next day."
reply = "She took it and thanked me. Then she said, “Oil isn’t the problem.” She touched a fingertip to the corner of her eye. “This is.” She put the jar on the top shelf, too high to reach without a stool. That day she packed up the stall before the sun went down."

[tracks.bond_amina.chapters.a1]
title = "The Third Telling of the Joke"
text = "The letter from Kilwa came with a caravan and had been four months on the road. It said my grandmother had died. It had rained the day they buried her. I folded the letter into my sash and went to Amina’s stall as usual to rule her paper, and I told her the one about the camel at the customs house. She didn’t laugh. A while later I told it again with a different ending. Halfway through the third time, she put down her pen. “That’s the third time today you’ve told that joke.” I opened my mouth. The rest of it didn’t come out. She didn’t ask why, and she didn’t say anything kind. She just tipped her chin toward the patch of shade behind the stall. “Go sit there.” She poured a bowl of water and pushed it across; the bottom left a wet streak on the table. “Drink that and sit a while. I haven’t finished this page.” I sat in the shade and watched her copy, line after line. The scratch of her pen never wavered, all the way until the call to prayer came down from the minaret of al-Azhar."

[tracks.bond_amina.chapters.a1.choices.tell_her]
text = "Tell her about the letter."
reply = "It came out all in a jumble: my grandmother’s fish stew, the way she chased seabirds off with her cane, the way she scolded me for haggling harder than my father. Amina heard me out, and only after a while did she speak. “The day my mother died, I copied all night. That book sold very well afterward.” She turned today’s page around to show me, every letter straight. “Whoever reads this will never know someone was crying beside it while it was copied.” That was when I noticed my face was wet."

[tracks.bond_amina.chapters.a1.choices.tell_epic]
text = "Say nothing about the letter. Tell the part where Liyongo is betrayed by his own."
reply = "I told how Liyongo’s son wormed the secret out of him, that only a copper needle in the navel could kill him; how he died on his knees by the well with his bow still drawn, and for three days nobody in the town dared go near the water. Amina copied as she listened, writing down the Swahili verses as they came out of my mouth. When I finished she blew on the sheet and held it out. “Keep this copy. It’s for your grandmother.”"

[tracks.bond_amina.chapters.a2]
title = "The Wide-Ruled Notebook"
text = "In the hottest days of summer Amina set a cloth bundle down on my ruling board. “Open it.” It was a notebook she had bound herself, in a parchment cover, sewn with old thread from the bookshop, the stitches closer than in any book I’d seen. Every page was ruled, a finger’s width between the lines. “You leave this winter,” she said. “Once you’re at sea, write down what people need to write and read: what script the merchants keep their books in, who the sailors’ wives get to write their letters, whether anyone on board can read. Then come back and tell me.” Inside the cover, in her hand: “Outside the gate of al-Azhar, beneath the third pillar of the north wall. The copyist’s stall.” I teased her that the lines were so wide she must have ruled them for my slow eyes. “For you?” She turned to the last page, ruled like the rest, not a word on it yet. “They’re for me. When you read it to me someday, I’ll be sitting beside you, and I want to be able to see.”"

[tracks.bond_amina.chapters.a2.choices.write_first_page]
text = "On the first page, write her name and where her stall is, and say she’s the first entry."
hint = "She keeps her hand flat on the notebook. You don’t know each other well enough yet for her to let you write on the first page."
reply = "I wrote slowly, every stroke kept to the width she had taught me. As I went to close it she put out a hand. “It’s wet. Shut it now and it prints onto the facing page.” She laid the notebook open in the sun and set a paperweight on the corner. “Just as well,” she said. “If you ever leave it in some port, whoever picks it up will open it and know exactly where to send it back.”"
effects = [{}, {}, {}, { title = "The Wide-Ruled Notebook" }]

[tracks.bond_amina.chapters.a2.choices.promise_spectacles]
text = "Promise to get her a pair of spectacles from the Venetians."
reply = "She stared at me. “A pair of spectacles costs two months of my wages.” “Which is why you need me to haggle.” She looked at me a long while, then laughed out loud and pushed the notebook into my arms. “Take this first. We’ll talk about spectacles when you’re back. If you really do beat the price down, then I’ll believe you weren’t bragging.”"

[tracks.bond_amina.chapters.s]
title = "Bring Back One True Thing"
text = "Early in December the caravan for Suez fixed its day. I was going home to Kilwa first, and in spring I would sail on my father’s ship. I went to the stall to say goodbye and, while I was at it, let loose every tall tale I’d been saving up: I would see mountains that breathed fire, dive for pearls in waves higher than the walls of Kilwa, and come back to tell her about each one. Amina waited until I was done, then laid her pen on the inkstone. “Save those for Zubayda’s customers. She can sell them,” she said. “I want true things. What people eat for breakfast in some port, whose wife keeps her husband’s accounts, where people have lived their whole lives without seeing paper.” “True things aren’t as good to listen to.” “I can make up good ones myself.” She tore a strip from her ledger. “How the people you meet live their lives. One a year is enough.” On the strip was her address, written very large."

[tracks.bond_amina.chapters.s.choices.promise]
text = "Agree to send a letter every year by caravan, with one true thing seen somewhere else."
hint = "A true thing every year is a promise you make once in a lifetime, and only when you’re close enough. Either you two aren’t there yet, or it already belongs to someone else. For now you can only say you’ll write when you can."
reply = "“One is enough,” she said. “Whatever won’t fit, tell me when you’re back.” She opened the ledger where she kept her readers’ requests. The first page was crowded: the sheikh wants wide lines, the apothecary wants doses marked in red, the one-eyed captain wants no more than nine lines a page. On the last line at the bottom she wrote my name and my address in Kilwa, in among the readers. “That makes you one of my readers,” she said. “When I write back, I’ll write a size larger.” I said then I’d write a size larger too, so she wouldn’t have to squint. She rapped my knuckles with the end of her pen and didn’t argue. Before she closed the ledger she added a line after my name, the same way she had on that first slip of paper: “Reader’s request: one a year, and it has to be true.”"
effects = [{}, {}, {}, {}, { title = "Bring Back One True Thing" }, {}]

[tracks.bond_amina.chapters.s.choices.own]
text = "Make no promise. Just say: I’ll write when I have time, and not when I don’t."
reply = "“That’s best,” she said with a nod. “What I hate most is people who promise and don’t deliver, and then I’m the one who has to cover for them.” She said nothing more about letters and bent to finish her page. At dusk she walked me to the gate of the Jabartiyya lodging, where the porter was dozing. She pulled a roll of paper from her sleeve and stuffed it into my baggage: every sheet already ruled wide and not yet touched by ink. “When you’re busy, don’t write,” she said. “When you’re not, the lines are already done. Saves you a step.” Then she left without looking back, and only at the corner did she lift a hand and wave. The roll was tied with old binding thread in the tight knot the bookshop used on its bundles. On the road to Suez, I spent most of a day on camelback picking it loose."
effects = [{}, {}, {}, { title = "Bring Back One True Thing" }, {}]

[tracks.reunion_amina]
name = "Amina: The Daylight Copy Room"

[tracks.reunion_amina.chapters.reunion]
title = "The Daylight Copy Room"
text = "In 1561 I came back to Cairo. The bookshop was where it had always been, and Zubayda stood behind the counter. Upstairs there was a copy room now: three low tables, two apprentices, and a big south-facing window. Beside the door a sheet was pasted to the wall, the letters large enough to read from across the room: “One: no copying by lamplight. Two: paper is charged separately. Three: say first who the reader is.” Amina sat under the brightest window with a pair of Venetian spectacles on her nose. She looked up at me, took the spectacles off, and only then saw who it was. “Off to see far, on to see near,” she said. “I take them on and off a hundred times a day.” From downstairs Zubayda shouted, “Sister! Someone’s here with a letter—oh. It’s the man himself.” Amina ignored her and pointed to a stool under the window. “Did you bring the notebook? Read it to me.” I said she had her spectacles on; she’d be faster reading it herself. “I can see fine.” She folded the spectacles and set them on the table. “I want to hear you read it.”"

[tracks.reunion_amina.chapters.reunion.default]
effects = [{ text = "Baraka, it’s Zubayda. I’m writing this for my sister: she says a line and I put it down, so if the hand is ugly, blame me. The copy room is open, upstairs over the shop. It opens only by daylight; the minute the sun is down she throws everyone out. Two apprentices, one with a steady hand and one with a quick tongue. The quick one I mean to steal for the counter downstairs. Business is fair. Three other copyists in town have started charging for paper separately, the way she does. My sister says: you didn’t come this year, and she guesses you’re in some port somewhere, haggling so hard you lost track of the days. Next time you come, bring back one true thing, not a joke. That’s the end of what she said. I’ll add one thing: she wears spectacles now. I bargained for them myself and got nearly a third off what the Venetian first asked. She told me not to write that. I wrote it. (At the bottom, on a line of its own, in letters so big they take up three lines:) The lines are ruled. Come." }, {}]

[tracks.reunion_amina.chapters.reunion.choices.read_notebook]
text = "Sit under the window and read the wide-ruled notebook from the first page to the last."
reply = "I started on the first page: a widow in Mombasa who kept her husband’s accounts in marks she had invented herself; a shipwright in Malindi who had never written a word in his life and never built a boat that leaked; a sailor in Hormuz who asked me to write a letter to his mother, then stopped halfway and said never mind, he’d tell her himself when he got home. When I got to the Hormuz part, Amina took off her spectacles and polished them. She polished them for a long time. “That one gets copied out,” she said, “and pasted up downstairs for the customers.” By the time I read the last page the sun had moved west. The apprentices had put down their pens, and no one went to light a lamp. She pushed the notebook back to me and held out a pen. “After each entry, write the name of whoever said it. The reader should know who’s talking.”"
effects = [{}, {}, {}, { title = "The Daylight Copy Room" }]

[tracks.reunion_amina.chapters.reunion.choices.bring_paper]
text = "Set down two reams of paper off a Venetian ship, and show her the price you beat them down to."
reply = "I had bought the two reams in Alexandria off a Venetian ship and haggled a whole afternoon for them, until the purser said one more round and he’d jump overboard. I wrote the price in the corner of the top sheet and pushed it across. Amina put her spectacles on and looked at it, then took them off and looked at me. “A fifth cheaper than what I paid last month.” She nodded. “Well bargained.” She carried the paper into the cupboard and wrote a line on its door in charcoal: “For daylight.” Then she dusted off her hands and went downstairs to settle it with Zubayda. I sat under the window leafing through the wide-ruled notebook. I was on the third page when she came back up and set a small purse of silver beside the figure in the corner of the paper, not a coin over and not a coin short. “Paper is charged separately,” she said. “It’s on the wall.”"
effects = [{}, {}, {}, { title = "The Daylight Copy Room" }]
