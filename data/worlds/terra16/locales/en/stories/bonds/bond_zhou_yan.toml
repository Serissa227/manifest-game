# C7 英文覆盖：周砚（林兄的灯谜 / 开海的账 / 搜港的那一天）。只覆盖显示文字，键与中文文件一一对应。

[tracks.bond_zhou_yan]
name = "Zhou Yan: Brother Lin’s Riddle"

[tracks.bond_zhou_yan.chapters.c1]
title = "Brother Lin’s Riddle"
text = "On the third day of lessons, the teacher put me at the same desk as a boy called Zhou Yan. His brushes lay in a row sorted by length, and his inkstone was polished so bright you could see your face in it. My fingers itched. I tore off half a sheet, wrote a riddle, and pushed it across: “A ding of fire keeps watch till daylight. Name the character.” He worked at it all morning and barely touched his lunch. In the afternoon he slapped the desk. “There’s a mistake in it! The books say ‘a speck of fire.’ Nobody writes ‘a ding of fire.’ That ding is wrong.” “If there’s really a mistake, you win.” He held the slip up to the window, read the front, read the back, and traced every stroke of ink that showed through. Still not satisfied, he clutched it and ran for the teacher, turning at the door to tell me, “The books say so, but you still have to ask a person.” The teacher glanced at it once. “Nothing wrong with it.” Zhou Yan came back holding the slip, sat down, and read that ding one more time."

[tracks.bond_zhou_yan.chapters.c1.choices.give_a_hint]
text = "Draw a lopsided lamp in the margin of the slip, and say nothing."
reply = "My lamp came out crooked, its shade like an upturned straw hat. Zhou Yan stared at it until the teacher had finished a whole passage, then let out an “Ah!” His sleeve swept across the desk, the inkstone tipped, and ink flooded half the desk. “Fire, and a ding beside it. Lamp!” Before wiping anything he tucked the slip safely inside his coat. “Brother Lin, your lamp is so ugly it shamed the answer out of me.” The teacher coughed up front, and only then did he go looking for a rag."

[tracks.bond_zhou_yan.chapters.c1.choices.bet_dried_fruit]
text = "Bet him: if he can’t solve it today, he owes me candied fruit tomorrow."
reply = "By the end of the day he still hadn’t solved it. I wrote out the answer, and his mouth hung open for a good while. Early next morning there was an oilpaper packet on my desk, folded square, all four corners lined up exactly, with candied starfruit from Zhangzhou inside. “A bet is a bet,” he said. “The Analects don’t say so, but I’ll honor it.” I popped a slice in my mouth. It was sweet enough to make my teeth ache. He didn’t eat a single piece. He sat beside me and watched me eat."

[tracks.bond_zhou_yan.chapters.c2]
title = "The Sworn-Brother Pledge"
text = "Zhou Yan said desk-mates ought to have a pact. I said fine, let’s swear brotherhood, bow once, done. He wouldn’t have it. There had to be a written pledge; a brotherhood without one didn’t count. He spread out a sheet of red paper and wrote all afternoon, and the clauses kept growing. Does being late for a meal break the pact? Does keeping a borrowed book? Keeping it and getting it dirty, how many times is that? At clause eleven he chewed his brush, trying to word “speaking ill of the other behind his back” so that nobody would be wronged by it. I leaned on the desk to watch. The two words at the top, “sworn brothers,” he had pressed so hard the ink soaked through the back. “Why are those two so heavy?” “All the pledges in books are written like that.” He answered fast, without looking up. At last he pressed his own thumbprint first, pushed the pledge over to me, and held the edge down with his palm. Waiting."

[tracks.bond_zhou_yan.chapters.c2.choices.press_thumb]
text = "Press my thumb down beside his, hard."
hint = "He draws the pledge back a little and says he’d better show it to the teacher first. You aren’t close enough to press that print yet."
reply = "I pushed my thumb deep into the ink paste and pressed it next to his until my fingertip went white. Two red prints sat side by side under “sworn brothers,” one big, one small. Zhou Yan stared at the two prints without a word, so long I wanted to pull my hand back. “Brother Lin, from today we’re brothers.” As he said “brothers,” his ears went red, a little at a time, from the bottom up. I asked what was wrong with his ears. He said it was hot."

[tracks.bond_zhou_yan.chapters.c2.choices.laugh_at_clauses]
text = "Laugh at him: this isn’t a pledge, it’s a land deed."
reply = "“A land deed doesn’t have this many clauses!” He bristled, but the longer he looked the more it resembled one, and he took his brush and struck them out one at a time until only one was left: “Whatever happens, tell the other first.” I asked which book that came from. He put down the brush. “None of them. I thought of it myself.” I pressed my thumb to it. He blew the scribbled-over pledge dry, folded it, and said he’d copy out a clean one someday."

[tracks.bond_zhou_yan.chapters.b1]
title = "The Diary Left Open"
text = "That day Zhou Yan went to the well for water and left his diary open on the desk, one corner pinned under a paperweight. I only meant to check whether he was keeping accounts on me again. Last time he had written down three brushes I borrowed and never returned. But when I looked, the page was packed with writing, denser than his homework. “Is something wrong with me, that I think Brother Lin is good-looking?” Below that ran a long stretch more: one look should cost him a page of lines, but writing the lines made him think of it again, so that ought to be two pages… I laid another sheet over it, held in my laughter, packed my book bag, held it in all the way home, and laughed under my quilt the whole night. The next day he arrived first, with two gray smudges under his eyes, and asked the moment he saw me, “Yesterday, did, did anybody touch my books?” Before I could answer he added in a small voice, “That diary of mine… I’m sure I closed it.”"

[tracks.bond_zhou_yan.chapters.b1.choices.say_nothing]
text = "Blame the wind, latch his window tight, sit across from him as usual, and never say a word."
hint = "The corners of your mouth won’t stay down yet. Sit across from him now and you’ll give yourself away."
reply = "“The wind did it.” I went and latched the window with a loud click. “Autumn winds are strong, and you never weigh that book down properly.” He stared at the latch a long while and let out a long breath. His homework that day was especially good; the teacher drew three circles on it. In the afternoon, at calligraphy, I stole a look at him, and he was stealing a look at me. We both ducked our heads at once, and each of us left an ink blot on the paper."

[tracks.bond_zhou_yan.chapters.b1.choices.leave_fruit]
text = "Say I saw nothing, and when he turns away, tuck a candied starfruit into that page."
reply = "“Didn’t see a thing,” I said. While he went to borrow lamp oil from the teacher, I slipped the last piece of candied starfruit from my sleeve between those pages and closed the book. When he came back and opened it, his face went white, then red right down to his neck. All day he didn’t dare look my way; when he needed ink he reached across the desk at arm’s length. A few days later I peeked again. A line of tiny writing had been added at the bottom of the page: “Who left the fruit? The books don’t say.”"

[tracks.bond_zhou_yan.chapters.b2]
title = "A Blow Beside the Dragon Boat"
text = "Ten days before the Dragon Boat Festival, the school practiced rowing on the Jiulong River every day. When we came ashore, Chen Dong would pick up a practice staff and come looking for a bout with me. He was the son of a captain in the Zhenhai Garrison, and better with a staff than with an oar. That day the river wind was strong and the drum was still going when he swung a staff sideways at me. I leaned back, and the blow never reached me. Somehow Zhou Yan had ended up in front of me and taken it on his forearm. There was a crack, and the drummer shouted, “Somebody’s hurt!” The drum stopped. Zhou Yan crouched down hugging his arm, white as paper, still saying, “I, I was standing in the wrong place. Wrong place, that’s all.” Chen Dong’s staff hung in the air. He looked at me, then at Zhou Yan, said nothing, shouldered the staff, and walked away."

[tracks.bond_zhou_yan.chapters.b2.choices.rub_his_arm]
text = "Drag him under the banyan, rub out the bruise, and scold him: what’s a brush-holder doing blocking staffs?"
hint = "He tugs his sleeve down and hides his arm completely. He won’t let you look at the injury yet."
reply = "I sat him down under the banyan and pushed up his sleeve. A purple welt ran across his forearm, swollen shiny. I begged half a bowl of liniment off a boatman, warmed it in my palms, and rubbed it in. He sucked air through his teeth and still had to talk. “The books say, when a brother’s in trouble…” “What the books say doesn’t count.” I pressed harder. “You fool of a bookworm. A brush-holder blocking a staff?” His eyes watered with the pain, but he was smiling. “Then what I say counts.”"

[tracks.bond_zhou_yan.chapters.b2.choices.settle_with_chen]
text = "Go settle it with Chen Dong: challenge him to a bout on festival day, in front of the whole river."
reply = "Chen Dong heard me out and answered with one word. “Fine.” On festival day the riverbank was packed with people come to watch the boats, and we went more than twenty passes. His staff could have touched me, but each time it came half a beat late, and I rapped him across the knuckles. He conceded, shouldered his staff, and left without a trace of a sulk. Zhou Yan, his arm still wrapped in cloth, frowned from the side. “Did he go easy on you?” “The books don’t cover that move,” I said, and laughed before he could."

[tracks.bond_zhou_yan.chapters.a1]
title = "A Lantern with the Wrong Character"
text = "On the night of the Lantern Festival every street in Yuegang was hung with lanterns, and more floated on the Jiulong River. Zhou Yan waited for me at the school gate with a paper lantern, and the whole way he kept the face of it covered with his sleeve. At a lantern stall I caught him off guard and lifted the sleeve. Eight characters: “Blue, blue your collar; long, long my heart.” The character for heart was missing a dot. “Who’s this written for?” “C-Cao Cao quoted that line too! It’s about seeking worthy men!” His face went scarlet and he covered it again. “The character’s wrong. It isn’t fit to be seen.” “Once the candle’s lit, who can tell if there’s a dot more or less?” “Wrong is wrong, seen or not. A gift to you can’t get by on being hard to see.” We borrowed a brush from the old man at the stall. Zhou Yan held it over the heart and measured it again and again while the crowd pushed past us, the tip never landing. Several times he opened his mouth, and each time swallowed it."

[tracks.bond_zhou_yan.chapters.a1.choices.walk_the_street]
text = "Guide his hand to add the dot, then carry the lantern with him to the end of the street."
hint = "He shoves the lantern into your hands and turns to go. You aren’t close enough yet for him to walk a whole street with you."
reply = "I took his wrist and pressed it down, and just then the crowd shoved from behind. The dot landed crooked, outside the hook, thick with ink, like a mole. He sighed at it. I told him crooked still counted as fixed. We carried the lantern from one end of the street to the other, past the lion dancers and the riddle stalls, and at every stall he had to stop and argue with somebody over the wording. By the ferry landing the candle was down to the length of a fingernail. He pushed the lantern pole into my hand, and at last he spoke. “Next Lantern Festival… we walk it again.” I said all right. That wasn’t what he’d meant to say. I could hear it."

[tracks.bond_zhou_yan.chapters.a1.choices.keep_lantern]
text = "Tell him I’m keeping this lantern, and leave the dot off."
hint = "The words reach your lips and go back down. You aren’t close enough to ask him for something like that."
reply = "“Leave it?” His brush was still poised. “Why keep a mistake?” “To keep you.” The moment it was out I froze, and so did he, and a drop of ink fell from the brush onto his shoe. We stood under the lanterns, one of us looking at the lantern, the other at the ground. The old man at the stall coughed and held out his hand for the brush."

[tracks.bond_zhou_yan.chapters.a1.choices.ask_what]
text = "Ask him: you opened your mouth three times. What were you trying to say?"
reply = "“The books…” He got that far and stopped, ears as red as the lantern paper. I waited. He gave the brush back to the old man, pushed the lantern into my hands, said, “The books don’t say!” and bolted, knocking a sweet-dumpling seller’s baskets askew. I carried the lantern home. The dot on the heart never did get added."

[tracks.bond_zhou_yan.chapters.a2]
title = "The Tale of Fellow Students"
text = "In the fourth month Zhou Yan borrowed a script of The Tale of Fellow Students from the bookshop. It was about two classmates who swore brotherhood, he said. He spread it on our desk and read aloud, wagging his head. “‘At the grass bridge they swore an oath, close as hand and foot.’ See? Just like us.” Halfway through he stopped reading. His face changed, a little at a time. He shut the book, pushed it over to my side, and never touched it again. For days afterward he wouldn’t sit across from me. He moved to an empty desk by the door, and whenever he saw me coming he took the long way around, as if I were a water ghost from the river. When I asked, all he said was, “N-nothing.” Then one morning at school his ink case was sitting on my desk, black lacquer worn off at one corner, one compartment for inkstick, one for brush rags, and under it a note: “Ink case on loan. No need to return it.”"

[tracks.bond_zhou_yan.chapters.a2.choices.keep_inkcase]
text = "Keep the ink case, write on the back of the note “A brother’s things aren’t lent, they’re given,” and slip it into his book."
hint = "Under the ink case is a note: “No need to return it.” He’s avoiding you; taking it now would be like accepting what he hasn’t said—and you aren’t close enough to do that for him yet."
reply = "The next day the note was gone from his book. Zhou Yan sat at the desk by the door with his back to me all morning and couldn’t answer a single one of the teacher’s questions. Just before lessons ended he picked up his book box, walked over, and sat down next to me, back in his old place. He didn’t explain, and I didn’t ask. I only pushed the ink case into the space between us."
effects = [{}, {}, {}, { title = "The Tale, Shut Halfway" }]

[tracks.bond_zhou_yan.chapters.a2.choices.find_him]
text = "Keep the ink case, and take The Tale of Fellow Students down to the river to find him."
hint = "A gift like this is too heavy for where you two stand. And even if you could take it, you aren’t ready yet to go down to the river after him."
reply = "He was sitting on the stone steps of the ferry landing, watching the boats. I held out the book. “You never finished the second half.” He took it. His hands were shaking, and the pages rattled. “The second half, I don’t dare read.” “Then don’t. Come back to school with me first. I’m keeping the ink case.” He followed me the whole way without a word. Only when we were nearly at the gate did he speak. “Brother Lin, wait for me to work it out.” I said fine. I’d wait."
effects = [{}, {}, {}, { title = "The Tale, Shut Halfway" }, {}]

[tracks.bond_zhou_yan.chapters.a2.choices.return_it]
text = "Put the ink case back on his desk and ask what exactly he’s hiding from."
reply = "I set the ink case down in front of him with a thump. “Zhou Yan, do I owe you money?” He jumped, looked at the ink case, then at me. “I’m thinking about something the books don’t cover,” he said slowly. “Until I’ve worked it out, I can’t sit across from you.” He pushed the ink case back. “Use it for now.”"

[tracks.bond_zhou_yan.chapters.s]
title = "No Need to Excuse Yourself"
text = "Early in the twelfth month the teacher said there would be no lessons come spring. I was leaving too. In spring the last bird-boat my family had left would put to sea, and I had to sail with her. Zhou Yan was waiting for me at the tea shed by the river with two things in front of him: a book of county-school exam questions and a blank ledger. “I want to sit for the county school,” he said. “And I want to keep the accounts for your ship. I’ve thought about it for a month, and the two won’t fit together. I don’t want to hand you a pretty line just to smooth it over.” Then he started in on how he’d avoided me all summer, how muddled he’d been. I cut him off. “Enough already. No need to excuse yourself.” He took the pledge out of his coat. The red paper had faded to pink, the folds had gone soft, and all four corners were fuzzy. Who knew how many times he had turned it over. He smoothed it flat with his palm, stroke after stroke. “Brother Lin, you’re leaving in the spring.”"

[tracks.bond_zhou_yan.chapters.s.choices.promise]
text = "Copy the pledge out again, one copy each, and promise my ship comes home the day he passes."
hint = "Copy out the sworn-brothers card again and it’s brotherhood for life. You aren’t close enough yet to rewrite that card—or you’ve already exchanged a lifelong card like it with someone else."
reply = "Zhou Yan borrowed brush and ink from the tea-shed keeper, begged a sheet of red paper, and copied it character by character. Everything struck out, everything added, everything the ink had blotted, he copied exactly, not a stroke off. When he finished he blew it dry and pushed the new copy to me. “The new one’s yours. It’s damp at sea, and new paper holds up.” “What about the old one?” “The old one I keep.” He folded the worn pledge, put it back inside his coat, and pressed it once through the cloth. I pressed my thumb on the new copy, and so did he. “The day you pass, my ship comes home.” “And if I don’t pass?” “Then keep sitting till you do. My ship can wait.” He ducked his head and smiled, then blotted the ink paste on the new copy with his sleeve one more time, so it wouldn’t run at sea."
effects = [{}, {}, { title = "No Need to Excuse Yourself" }, {}, {}]

[tracks.bond_zhou_yan.chapters.s.choices.heart]
text = "Give him back the lantern with the wrong character: when we meet again, I’ll tell him where the dot goes."
hint = "You’re holding the lantern with the miswritten character, but you can’t hand it over. You don’t yet know yourself where that dot belongs—or you already have a promise like this with someone else."
reply = "I took the lantern out of my bundle and set it on the table. The paper had yellowed, one bamboo rib had come loose, and the heart on it still looked wrong however you turned it. “The lantern’s yours again,” I said. “Where that dot belongs, I’ll tell you the day we meet again.” Zhou Yan stared at the character so long his tea went cold. “Then I’ll write it once more,” he said. “Right, this time.” He reached across and took my hand. He held it tight, his palm all sweat, the way he had once put his arm in front of that staff. Outside, the wind picked up, and the door curtain slapped the frame again and again. He didn’t let go, and I didn’t pull away. Only when the keeper came to refill the pot did he release me. Then he held the lantern to his chest as carefully as he carried his book box."
effects = [{}, {}, {}, {}, { title = "No Need to Excuse Yourself" }, {}]

[tracks.bond_zhou_yan.chapters.s.choices.own]
text = "Promise that the day he passes the county exam, my ship sets off a string of firecrackers in Yuegang for him."
reply = "“Then you have to be in Yuegang,” he said at once, already arguing the terms. “The firecrackers go off in Yuegang. Set them off at sea and I won’t hear them.” “Then you have to pass.” “The books…” He started, then waved it away himself. “Never mind. Not from a book. I’m saying it: I’ll pass.” He tore a corner from the blank ledger, wrote “one string of firecrackers,” then a line for the date, left blank until the results were posted. I tucked the scrap into the pouch I kept against my skin. He watched until it was put away, then picked up his long-cold tea and drained it in one swallow, as if that sealed the contract. When he was done he remembered something, opened the ledger to the first page, and wrote the name of my bird-boat at the top. “I’m keeping the accounts anyway. Until I pass, the first entry is the firecrackers you owe me.”"

[tracks.bond_zhou_yan.chapters.s.variants.v1_known]
text = "Early in the twelfth month the teacher said there would be no lessons come spring. I was leaving too. In spring the last bird-boat my family had left would put to sea, and I had to sail with her. Zhou Yan was waiting for me at the tea shed by the river with a book of county-school exam questions, a blank ledger, and the pledge in front of him. The red paper had faded to pink, and the two words “sworn brothers” were as heavy as ever. “Since the day they searched the harbor, I’ve been thinking for half a year,” he said, looking at me. “So… so there’s nothing wrong with me after all.” “There was always something wrong with you,” I said. He blinked, then burst out laughing, laughed till he was slumped over the table with tears running, and wiped them away with his sleeve again and again. When he had finished laughing he said he wanted to sit for the county school, and he also wanted to keep the accounts for my ship, and the two wouldn’t fit together, and he didn’t want to hand me a pretty line just to smooth it over. He started in on how he’d avoided me all summer. I cut him off. “Enough already. No need to excuse yourself.”"

[tracks.bond_zhou_yan.chapters.s.variants.v2_kept]
text = "Early in the twelfth month the teacher said there would be no lessons come spring. I was leaving too. In spring the last bird-boat my family had left would put to sea, and I had to sail with her. Zhou Yan was waiting for me at the tea shed by the river with a book of county-school exam questions and a blank ledger in front of him. “I want to sit for the county school, and I want to keep the accounts for your ship,” he said. “The two won’t fit together. I don’t want to hand you a pretty line just to smooth it over.” Then he started in on how he’d avoided me all summer. I cut him off. “Enough already. No need to excuse yourself.” He took the pledge out of his coat, laid it flat, and smoothed it with his palm, stroke after stroke. The red had faded to pink, and all four corners were fuzzy. “Brother Lin,” he said, “a brother is going far away. A pledge shouldn’t exist in only one copy.”"

[tracks.reunion_zhou_yan]
name = "Zhou Yan: The Accounts When the Sea Opened"

[tracks.reunion_zhou_yan.chapters.reunion]
title = "The Accounts When the Sea Opened"
text = "In the first year of Longqing, the court gave Yuegang’s ships leave to sail the Eastern and Western Seas. Zhou Yan had passed the county exam and never set foot in an examination hall again. Now he wrote declarations for shipowners at the newly founded Haicheng county office. His desk stood under the office’s covered walk, and the line ran from the walk out into the street. When my turn came he looked up, and his brush stopped in midair. From under the desk he pulled a stack of freshly printed forms: ship’s name, beam in feet, number of hatches, which sea, what cargo. Then he took something from his coat and laid it beside the forms. It was the pledge, worn even softer than before. “On the ship’s business, I won’t vouch for a single thing that isn’t true.” He went through the old ship deeds and cargo lists I had brought, one by one, and circled every missing document in vermilion. “This needs filling in, and this, and this… this too.” We filled them in one by one. By evening the first declaration with my own name signed to it had gone in."

[tracks.reunion_zhou_yan.chapters.reunion.default]
effects = [{ text = "As if we were face to face. This year the sea opened, and Yuegang’s ships may sail the Eastern and Western Seas. I write declarations for shipowners under the covered walk of the Haicheng county office, forty a day. My wrist is swollen, but my hand gets steadier. Your ship didn’t come back to Yuegang this year, so I’m sending you a copy of the new printed form first: ship’s name, beam, hatches, which sea, what cargo. Every column must be filled in truthfully. If you don’t know how to fill one, leave it empty and I’ll show you when you’re back. No guessing. I checked your family’s old ship deeds against the county registers. Two match and one doesn’t, so that one needs fixing when you return. I’ll be there when you do, and I won’t charge you a writing fee. The new Haicheng wharf is built out to the third section, so your ship can tie up closer. I still have the pledge. It’s worn softer than ever and I don’t dare fold it again, so I keep it pressed inside The Tale of Fellow Students. I finished the second half. On the back of the form I wrote one line, “The books say so.” It’s the first half of what I said once at the teacher’s door. The second half, come back and ask me in person. —Zhou Yan, first year of Longqing, at Haicheng" }, {}]

[tracks.reunion_zhou_yan.chapters.reunion.choices.friend]
text = "Spread out the worn pledge and press my thumbprint on it once more."
reply = "The county office’s ink paste was official stock, red going on purple. I pushed my thumb into it and pressed it down beside his old print, faded now to a pale brown. Zhou Yan looked, then pushed his own thumb into the paste and pressed it onto the print he had made all those years ago, slowly, like checking a ledger entry. New over old, red over brown. “Brothers for life.” He froze at his own words and corrected himself in a hurry. “S-sworn for life.” “What are you correcting?” “The books…” He opened his mouth and closed it. “The books don’t have a rule for it. I’m correcting it because I want to.” I laughed at him, and he laughed too, so hard his vermilion brush fell onto the forms and left a red dot. He tried to wipe it with his sleeve and only made it bigger. A shipowner further back in line leaned out to ask how much longer. Zhou Yan tucked the pledge back into his coat, pressed it once, and cleared his throat. “Next.”"
effects = [{}, {}, {}, { title = "The Accounts When the Sea Opened" }]

[tracks.reunion_zhou_yan.chapters.reunion.choices.love]
text = "Bring out the lantern with the wrong character and ask him to write it right."
hint = "The lantern stays in your bundle. What went unsaid back then still can’t be brought out today."
reply = "Two more ribs had come loose, and the paper was as yellow as an old account book. I set it on top of the forms. The heart on it was the same as ever, and still not right. Zhou Yan studied the lantern until the shipowners waiting behind me started to cough. He put down the vermilion brush and took one dipped in black ink. He left the old dot where it was. Beside the old heart, he wrote another one. Stroke by stroke, the three dots set down steady, the hook drawn long. “What I wanted to say back then was this character,” he said. This time he didn’t stammer once. Then he raised the lantern to hide us from the line, took my hand, and kissed me. Yuegang, the first year the sea was open, under the covered walk of the county office, and an old paper lantern hid nothing at all. Someone behind us coughed, then coughed again. Zhou Yan’s ears went red through and through, but he kept hold of my hand and called out from behind the lantern, “N-next… just a moment!”"
effects = [{}, {}, {}, { title = "The Accounts When the Sea Opened" }]

[tracks.reunion_zhou_yan.chapters.reunion.variants.v1_known]
text = "In the first year of Longqing, the court gave Yuegang’s ships leave to sail the Eastern and Western Seas. Zhou Yan had passed the county exam and never set foot in an examination hall again. Now he wrote declarations for shipowners at the newly founded Haicheng county office. When my turn came he looked up. “Wandeng.” He said it easily, as if the name had long since been entered in his books. “That Tale of Fellow Students,” he said. “I finished the second half.” From under the desk he pulled a stack of freshly printed forms: ship’s name, beam in feet, number of hatches, which sea, what cargo. Then he took the pledge from his coat and laid it beside them, worn even softer than before. “On the ship’s business, I won’t vouch for a single thing that isn’t true.” He went through the old ship deeds I had brought, one by one, and circled every missing document in vermilion. “This needs filling in, and this… this too.” We filled them in one by one. By evening the first declaration with my own name signed to it had gone in."

[tracks.reunion_zhou_yan.chapters.reunion.variants.v2_kept]
text = "In the first year of Longqing, the court gave Yuegang’s ships leave to sail the Eastern and Western Seas. Zhou Yan had passed the county exam and never set foot in an examination hall again. Now he wrote declarations for shipowners at the newly founded Haicheng county office. When my turn came, my hair was pinned up neatly, and I gave the owner’s name: Lin Wandeng. He looked up and froze, and the stack of freshly printed forms in his hands slid to the floor with a rustle. In all of Yuegang, he was the last to know. He crouched to gather them and took ages without getting a single pile straight. Finally he looked up at me. “So… so there’s nothing wrong with me after all.” “There was always something wrong with you,” I said. He laughed out loud, still crouching on the floor. When he was done, he took the worn pledge from his coat, laid it beside the rescued forms, and circled every missing document on my old ship deeds in vermilion, one by one. “On the ship’s business, I won’t vouch for a single thing that isn’t true.” By evening the first declaration with my own name signed to it had gone in."

[tracks.wandeng_unmasked]
name = "The Day They Searched the Harbor"

[tracks.wandeng_unmasked.chapters.unmasked]
title = "The Day They Searched the Harbor"
text = "One night in the seventh month, soldiers declared that the Lin family traded with foreigners and set fire to our ship, the junk moored at Yuegang. She burned all night. Half the Jiulong River glowed red, and when the mast came down, everyone on shore cried out. The next day the searchers came into the school. Their leader held the roll book and questioned the pupils one by one: where are you from, what does your family do. At the name Lin he stopped. A soldier behind him came around and stared at my face for a long time. “Why is this boy’s face so pale?” He reached out to pull off my headcloth. Chen Dong stepped in front of me with a practice staff, holding it crosswise, and didn’t say a word. Xu Cai stood behind her father, Master Xu, white as paper, her fingers gripping his sleeve. Zhou Yan was still going through books. He had dug the Great Ming Code out of his book box and was searching it page by page, muttering, “S-surety… classmates standing surety for each other…”"
news = "The soldiers at Yuegang searched the harbor three days running and burned a Lin family junk they said was trading with foreigners. They even hauled in the pupils of the Longxi school and asked each one where they came from."

[tracks.wandeng_unmasked.chapters.unmasked.default]
news = "Strangest thing at the Longxi school: the day the soldiers searched the harbor, they pulled the headcloth off the pupil everyone called “Brother Lin,” and found the Lin family’s daughter from Yuegang."

[tracks.wandeng_unmasked.chapters.unmasked.choices.own_up]
text = "In front of the teacher and my classmates, take off my headcloth myself and say who I am."
reply = "I pushed Chen Dong’s staff down a little and untied my headcloth myself. My hair fell loose, all the way down my back. “I am the daughter of the Lin family of Yuegang. Lin Wandeng.” The room went so quiet you could hear the oars on the river. The leader looked through his roll book. It said “the Lin son.” He read that line over and over, swore, and struck it out. Zhou Yan was the last to understand. The book fell from his hands and he stared at me, mouth open, for a long while. Then he stood up, walked to the soldier, and planted himself between the soldier and me. “Th-the Great Ming Code… there isn’t one article in it that says a girl can’t study!” His voice shook so badly it barely held together, and his legs shook too, but he didn’t move aside. Chen Dong’s staff stayed crosswise the whole time. After the soldiers left, Xu Cai came over, took a wooden hairpin from her sleeve, and without a word pinned up my hair."
news = "Strangest thing at the Longxi school: the day they searched the harbor, the pupil called “Brother Lin” took off the headcloth in front of everyone. It was the Lin family’s daughter from Yuegang, and classmates stood in front of her."

[tracks.wandeng_unmasked.chapters.unmasked.choices.xu_cai_covers]
text = "Look at Xu Cai, and wait for her to speak."
hint = "Xu Cai looks at you, her lips move, and nothing comes out. She isn’t close enough to you yet to lie to her father for you."
reply = "Xu Cai let go of her father’s sleeve and stepped forward. “He’s my cousin on my mother’s side,” she said, to the soldier and to her father both. “From the Lin family who farm out in the Longxi countryside. Nothing at all to do with the Lin family of Yuegang. He’s eaten at our table since he was small. I’ve watched him at his books.” Master Xu looked at his daughter for a long time, so long the soldier grew impatient. Then he nodded. “My wife’s nephew.” The leader made a tick beside that line in the roll book and took his men away. Chen Dong lowered his staff and asked nothing. That night Xu Cai sat by the well in the school’s back courtyard. When I went to find her, her hands were still shaking so hard she couldn’t hold a bowl. “It’s the first time I’ve ever lied to my father,” she said. Zhou Yan was still crouched in the schoolroom gathering up the scattered books, fretting as he went. “There is an article, I know there is. Classmates standing surety, I remember it…”"
