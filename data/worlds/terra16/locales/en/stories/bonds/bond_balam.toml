# 巴兰：买不走的船（bond_balam / reunion_balam）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 专名：Balam、Ix Nikte'（照人物覆盖层的写法）、María（学校名册上的名字）、Campeche、Cozumel、Mérida、Maní、Yucatán。
# 口头禅：巴兰 “Name your price.”——只在 c1 正文末尾用一次；b1、a2、重逢换说法呼应。船名“不卖”译作 Not for Sale。

[tracks.bond_balam]
name = "Balam: The Canoe That Wasn’t for Sale"

[tracks.bond_balam.chapters.c1]
title = "The Canoe That Wasn’t for Sale"
text = "School was out, and I was back in Campeche, where our family canoe lay on the beach waiting for cargo. I was crouched scraping barnacles off her hull when a shadow fell over me. Balam—the cacao merchant’s son who sat behind me at school in Mérida—in a brand-new Spanish felt hat with a brim wide enough to shade half the canoe. “María, I’ll take this boat.” He opened his hand on a heap of cacao beans. “Whatever you ask, my father can pay.” “She’s not for sale. If you want to ride in her, crew for three months first. Hauling, bailing, night watch, all of it.” “Three months? That’s nothing.” That afternoon we took her out through the river mouth to try her and ran straight into the ebb’s backwash. The canoe heeled hard. I looked back and saw his face go white, both hands clawed into the gunwale. I said nothing, switched my paddle to the other side, and she came level. He acted as if nothing had happened, and at the landing he was first over the side, leaving his hat in the bottom of the boat. He stood in the shallows and opened his hand on the cacao again, the beans shiny with the sweat of his palm. “Name your price.”"
news = "On the beach at Campeche, the son of a Mérida cacao merchant offered a fistful of beans for a canoe. The boatman’s girl wouldn’t sell, so she hired him to crew for three months instead."

[tracks.bond_balam.chapters.c1.choices.counter_offer]
text = "My price: three months aboard, meals included, no wages."
reply = "He dropped the beans back into his purse one at a time and pulled the string tight. “Deal. My father will laugh himself sick when he hears.” “Then don’t tell him.” He thought about that, fished his hat out of the canoe, put it back on, and walked off toward town. I found out later he never breathed a word of it to his father."

[tracks.bond_balam.chapters.c1.choices.silly_price]
text = "My price: a thousand cacao beans, and the hat on your head."
reply = "He actually squatted on the sand and started counting. At bean three hundred he looked up and caught me laughing. He didn’t sulk. He fished the hat out of the canoe and jammed it on my head, the brim down over my nose. “The hat’s a loan. The boat I’ll buy sooner or later.” He was still seven hundred beans short, but his three months started the next morning."

[tracks.bond_balam.chapters.c2]
title = "One Basket Less"
text = "This run north carried cacao and cotton cloth. Balam rolled up his sleeves, picked out the baskets with the plumpest beans, and stacked them all in the stern. By the fifth basket the bow was cocked up in the air and the waterline at the stern had nearly reached the gunwale. “Up at the salt flats in the north, these fetch twice the salt.” He slapped a basket rim. “One basket less is one profit less.” I hauled the heaviest basket off the stern and slapped the empty thwart in the bow. “You make up its weight.” He clambered forward, grumbling, and sat; the bow dipped, and the whole canoe settled level. He looked down at the waterline by his feet, then over at the basket on the sand, muttering, counting bean by bean what he’d lost. I went to fetch the water jars. When I came back he had carried a second basket of cacao up the beach himself and set a jar of fresh water in its place, the mouth tied tight with banana leaf. “This water has a price too.” He wiped his face. “The basket I’m not earning on—put it in your ledger.”"
news = "The porters at Campeche say the cacao merchant’s boy, loading a canoe, carried a basket of fine cacao back up the beach and put a jar of water in its place. They reckon his sums have gone soft."

[tracks.bond_balam.chapters.c2.choices.sit_on_load]
text = "Keep him in the bow the whole way, watching how she rides with the load."
hint = "He’s still stubborn, swearing cacao is worth more than his life. He’ll listen once you know each other better."
reply = "He sat in the bow most of the day. At first he grumbled; then he went quiet and watched the waterline rise and fall. Toward evening he said, “A boat’s just like my father’s accounts. Too much weight at one end and over she goes.” The wind came up on the way back and we never shipped a drop. When I turned my back, I caught him sketching in charcoal, on the lining of his hat, how I’d stowed the cargo."

[tracks.bond_balam.chapters.c2.choices.let_him_load]
text = "On the way home, let him stack the salt however he likes, and wait for the wind."
reply = "He piled every sack of salt in the bow: salt was heavier than cacao, he said, and heavier meant steadier. Halfway home an east wind came up, and the bow drove into one wave after another. He bailed until both his hands cramped. On the beach he said nothing at all, threw his hat down on the sand, and walked off. Next day, before we loaded, he crouched by the canoe and asked me where each basket went."

[tracks.bond_balam.chapters.b1]
title = "The Patrol’s Questions"
text = "Three nights after we got back from Cozumel, we built a fire on the beach at Campeche and grilled a fish Balam had traded for at the market. On that run we’d been stopped off the island, near the shrine. Two Spanish soldiers rowed up alongside in a skiff and asked what we carried, where we were going, whom we meant to see. In the bottom of the canoe lay a bundle of herbs my mother had sent with me for the people by the shrine—a place the Spaniards had forbidden. I opened my mouth to answer, and Balam got there first. “My father’s salt, for the town.” His voice was lower than usual. He took his father’s license from inside his shirt and unfolded it for them, his hand as steady as if he were taking money over the counter. The soldiers looked at the seal and waved us on. Now he turned the fish over before he said, “Back there, my legs wouldn’t stop shaking.” “I saw.” “Like you saw anything. You were watching the herbs.” He poked a stick into the fire. “So who were those herbs really for?” In the firelight a corner of the license still stuck out of his shirt, stained where the sea had soaked it. I didn’t answer about the herbs. I told him something else first. “My name isn’t María. It’s Ix Nikte'.”"
news = "Boatmen at Campeche say the Spaniards stopped a canoe off Cozumel, and the son of a Mérida cacao merchant showed them his father’s license. The soldiers looked at the seal and let it go."

[tracks.bond_balam.chapters.b1.choices.tell_name]
text = "Thank him properly, then tell him the herbs were for the woman who gave me that name."
reply = "I told him the old woman had delivered me and given me my name, and that it meant Flower. Balam said it three times. The second time his tongue tripped over it; the third time he had it right. “I’m calling you that at school from now on.” “Not at school. The friars will punish us.” He thought it over. “Then on the boat.” Next day, loading cargo, he called it across half the canoe so loudly that the whole beach turned to look."

[tracks.bond_balam.chapters.b1.choices.no_lies]
text = "Tell him not to lie for me next time. I can answer for myself."
reply = "He grinned. “What’s it worth to you? Next time I won’t say a word.” I told him it wasn’t worth a single cacao bean. He laughed and owned it, handed me the grilled fish, and never asked about the herbs again. Next day, tidying the canoe, I found the license tucked under the paddle rack, folded in four and wedged in tight."

[tracks.bond_balam.chapters.b2]
title = "The One Whose Knees Gave Way"
text = "The three months were long over, and Balam was still aboard. When I asked when he meant to go home and square accounts with his father, he said one more run—the one up north. Going north meant crossing a narrow sea mouth where the tide squeezes through and the waves stand on end. The night before we sailed he came down to the beach in the dark, hat in his hands. “Let me sit in the stern tomorrow.” “The stern handles the lines. You don’t know how.” “I’ll learn.” In the moonlight I saw the hand gripping his hat brim shaking, shaking so hard the whole hat trembled. I remembered how he’d clawed the gunwale that first time through the river mouth, and how all year, whenever we took a wave, he’d been first to grab the bailer, his back to the sea. He was afraid of the water. He’d been afraid all year, and he had come on every run. He saw that I’d seen. His face went red, then white. “Don’t tell anyone. Above all, not my father. I bragged to him in the shop that I could cross that sea mouth with my eyes shut.” The brim was crushed to a wad in his fist. It was the hat he loved best."
news = "Folk on the Campeche shore say the cacao merchant’s boy has run with the canoes a whole year and still won’t go back to the shop. His father has sent word three times, and every time he says, one more run."

[tracks.bond_balam.chapters.b2.choices.teach_float]
text = "Before dawn, take him to the cenote outside town and teach him to float, with no one watching."
hint = "He’s still pretending nothing’s wrong. Say it now and he’ll turn on his heel."
reply = "The cenote water was cold and clear enough to see the stones on the bottom. I held his back so he could lie flat, and he went as stiff as a paddle. When I let go he sank halfway, then bobbed up on his own and let out a yell that sent every swallow under the rock roof wheeling. “It’s holding me up!” He lay on the surface, too scared to move anything but his mouth. That day at the sea mouth he sat amidships with his hands on his knees and never once grabbed the gunwale."

[tracks.bond_balam.chapters.b2.choices.seat_stern]
text = "Act as if I know nothing and put him in the stern on the lines, his back to the waves."
reply = "He worked the lines in the stern the whole way. Through the sea mouth he never took his eyes off the knots in his hands, his face as white as salt. Only when we were past the narrows did he unclench his teeth. On the beach he came over and mumbled his thanks, then added at once, “Not that I was scared of anything.” “And I didn’t see anything.”"

[tracks.bond_balam.chapters.a1]
title = "The Equinox Shore"
text = "Around the equinox the tide at Campeche runs out farther than at any other time. The canoe sat in the shallows, and beyond her lay a broad shelf of rock, slick with green weed. I was born at the equinox, and my mother had sent a string of shells over from the island; I hung it on the bow. To reach the rocks we had to step across a cleft full of water. I held out my hand first. “Help me over.” Balam hesitated and looked at my bare feet. “You? You run these rocks faster than a crab.” All the same, he gave me his hand, held it firm until both my feet were planted, and only then let go. He didn’t say, the way he usually would, “That’ll cost you.” He just rubbed his palm on his shirt. We sat on the rocks and watched the waves. Close in they were yellow-green; farther out they turned blue; beyond that you couldn’t tell. “Tell me,” he said, turning a pebble over and over in his fingers, “of all these seas, where would you most want to put ashore?” Before, he had always asked which sea paid best."
news = "People in Campeche say the tide ran out a long way around the equinox and bared every rock on the shore. Two youngsters from the Mérida school sat out there the whole afternoon."

[tracks.bond_balam.chapters.a1.choices.race_rocks]
text = "Don’t answer. Race him to the farthest rock."
reply = "I jumped first. He came after me, stepped on weed halfway, and went down flat on his back; his hat floated away. I waited on the farthest rock while he fished it out and climbed up dripping. “That one doesn’t count. We’ll race again.” He wrung the hat out and put it back on. We sat on that rock until the tide crept back up to our feet, and only then did I tell him the name of the island."

[tracks.bond_balam.chapters.a1.choices.reach_first]
text = "On the way back, offer him my hand first across the wet rock, and don’t hurry to let go."
hint = "Reach for him now and he’ll think you want him to carry something."
reply = "Going back we had the cleft to cross again. This time I went over first and turned to give him my hand. He looked at it, said nothing, and took it. Across the cleft, he didn’t let go, and neither did I. We stood there on the wet rocks, naming which waves were yellow and which were blue, until the tide washed over our feet. “Cozumel,” I said. “That’s where I’d put ashore.” He nodded, as if it were his answer too."

[tracks.bond_balam.chapters.a2]
title = "Cacao He Earned Himself"
text = "Balam came back from the north in the fall a shade darker, his hat a shade older. For more than two years he had crewed on my canoe, and he had kept his wages sewn into the lining of his purse. This time he didn’t go near his father’s shop. He spent his wages on two sacks of salt at the salt flats, carried them through three villages, and came back with a gourd. On the beach he pulled the stopper to show me. It was packed with cacao, every bean fat and glossy; when he cracked one open, the smell was so rich it pricked my eyes. “The best,” he said. “Not traded off my father’s price list. Every bean of it, I haggled for myself.” He stoppered the gourd and held it against his chest for a long while before he asked, “Could this gourd count as my share in your canoe?” A crooked mark was cut into its belly. He’d carved it himself, he said, so it wouldn’t get mixed up with his father’s goods."
news = "Salt sellers at Campeche say the Mérida cacao merchant’s son carried two sacks of salt through three villages and came back with a gourd of fine cacao, and never set foot in his father’s shop."

[tracks.bond_balam.chapters.a2.choices.accept_cacao]
text = "Take the gourd, and tell him it’s the most precious thing I’ve ever been given."
hint = "He’s hugging that gourd tight. You aren’t close enough yet for him to hand it over whole."
reply = "He grinned and opened his mouth to tell me what the gourd was worth, then swallowed it. That night I made a pot of chocolate with chili and beat it to a thick froth. We crouched by the fire with our bowls, drank too fast, and both scalded our tongues, hissing through our teeth. He licked his lips. “Next deal, I’m going bigger.” I washed the gourd clean and hung it in my canoe."
effects = [{}, {}, {}, { title = "Cacao He Earned Himself" }]

[tracks.bond_balam.chapters.a2.choices.half_back]
text = "Pour half back for him: that half buys him a share in my canoe."
hint = "It’s too soon to say that, and he hasn’t made up his mind to put the gourd in your hands."
reply = "I poured the cacao out on a sailcloth, split it bean by bean into two heaps, put one back in the gourd, and pushed it into his arms. He stared, then started laughing, and out of old habit opened his mouth to haggle. I got in first. “No price this time. That’s the deal.” Solemnly he tipped his half into his purse and tied the string twice. “Then from now on,” he said, “I keep half the canoe’s accounts.” He wasn’t looking at me when he said it. He was looking at the gourd."
effects = [{}, {}, {}, {}, { title = "Cacao He Earned Himself" }]

[tracks.bond_balam.chapters.a2.choices.ask_profit]
text = "First ask him how much he cleared on this run, all told."
reply = "He rattled off a figure without stopping to think. I worked it through with a stick in the sand and told him he’d overcounted the water we drank on the road and forgotten the porters the day he bought the salt. He wouldn’t have it, crouched down, and did it all again; then he scratched his head and owned it. The gourd was still in his arms. “I’ll give it to you when my accounts are square,” he said. “You don’t give away what isn’t squared.”"

[tracks.bond_balam.chapters.s]
title = "Follow My Canoe"
text = "The December wind came in off the sea, and my father sent two canoes from the island to Campeche to bring me home. School was over. The “María” on the school roll would stay behind in Mérida; I was going back to Cozumel, and from now on the salt runs and the cacao runs were mine to make. Balam was going back too. His father had sent word: the shop in Mérida would be his come spring, the ledgers were ready, and all he had to do was sit behind the counter taking in beans. The canoes were loaded. I stood in the bow; he stood in the wet sand on the shore. The Spanish hat had gone soft and shapeless, and the brim still bore the creases he’d crushed into it that night. “And you?” I asked him. “The shop’s fine,” he said, too quickly. “No sea mouths, no bailing. My father says one year there earns as much as both your canoes.” He reeled it off like a price list, but his eyes never left the cacao baskets in my canoe. The waves licked at the hull, and the paddlers were all waiting for my word."
news = "Two canoes from Cozumel picked up the boatman’s daughter at Campeche and headed east. The Mérida cacao merchant’s son stood in the wet sand a long while, watching them go."

[tracks.bond_balam.chapters.s.default]
news = "Two canoes from Cozumel loaded up at Campeche and headed east. The Mérida cacao merchant’s son had been called home to mind the shop and missed the sending-off."

[tracks.bond_balam.chapters.s.choices.promise]
text = "Promise him: the day his own canoe is built, our two canoes sail as one company."
hint = "A promise like this is made once in a lifetime. Either you’ve already given it to someone else, or the two of you haven’t come far enough to make it."
reply = "“That’ll take a lot of cacao,” he said. “You’ll save it. You’ve been saving it on my canoe for three years.” He looked down at the sand and drew two lines side by side with his toe, then a third joining them. Then he took off the old hat, waded out, and set it in my canoe on top of a cacao basket. “I’ll leave this here as a deposit,” he said. “When my canoe’s built, I’ll come and redeem it.” The paddlers began to push off. When I looked back he was still standing in the water, bareheaded, his hair blown every which way, rubbing his thumb against his fingers the way you count beans: this one goes in the ledger. In the bottom of the canoe I turned the hat over. A little pocket had been stitched into the lining, and in it sat a single cacao bean."
effects = [{}, {}, {}, {}, { title = "Follow My Canoe" }, {}]

[tracks.bond_balam.chapters.s.choices.heart]
text = "Tell him: sail with my canoe, not your father’s."
hint = "You can’t say it yet. Either you haven’t come that far, or the one promise of your life is already given to someone else."
reply = "He looked at me for a long time, long enough that one of the paddlers coughed. “Then first,” he said, “you’d have to ask your canoe whether it wants me.” “My canoe does what I say.” He laughed; it was the grin he’d had the day he stood in the shallows holding out a fistful of cacao. He waded out, took the hand I had on the gunwale, and held it hard. His palm was warm, and for once not sweating. “I’ll sit in my father’s shop a couple of years first,” he said. “Learn to haggle with the Spaniards, save up a stake. When I’m eighteen I’ll come to Cozumel, and then you can tell me whether your canoe wants me.” He let go and went back up the beach. Long after we’d pushed off I could still see him standing there, one hand pressed to his chest, as if he had a gourd of cacao tucked inside his shirt."
effects = [{}, {}, {}, {}, { title = "Follow My Canoe" }, {}]

[tracks.bond_balam.chapters.s.choices.own]
text = "Each to our own course: he goes to the shop, I go to sea, and nobody owes anybody."
reply = "“Fair enough.” He nodded, hard. “I’ll learn to pick my own course first. The shop is my father’s. Whatever road I take from here, I have to pick it.” I took out the paddle he’d used for three years and handed it to him. Two hollows were worn into the shaft, just where his fingers went. He hefted it. “Is this a present?” “Not a present. This paddle’s learned your hands. Nobody else can hold it right.” “Then I’m not paying for it.” He swung the paddle up onto his shoulder, took two steps back, and stopped. “Wherever we run into each other, I’ll still haggle with you, so don’t expect any bargains.” The canoes pushed off. He stood on the beach with the paddle on his shoulder like a flag."
effects = [{}, {}, {}, { title = "Follow My Canoe" }, {}]

[tracks.reunion_balam]
name = "Balam: Two Canoes"

[tracks.reunion_balam.chapters.reunion]
title = "Two Canoes"
text = "A new canoe lay at the cargo landing on Cozumel, her hull washed with red earth, and cut deep into her bow were the words Not for Sale. Her owner was crouched beside her loading salt sacks. He heard footsteps and looked up—Balam. He was darker than he used to be, broader in the shoulder, and bareheaded. “I knew you’d have to come and look.” He stood and brushed the salt off his hands. Since the business at Maní last year, all of Yucatán had been talking under its breath, and plenty of families had beached their canoes and didn’t dare put out. He kept on running his salt, down from the northern flats to here, once a month. “Two canoes, one company.” He pointed at my canoe, then at his. “If a blow comes up, we lash the lines together and neither of us goes over. The shares we’ll sit down and haggle out.” He pushed a paddle into my hands. “But first, try my canoe. That sea mouth up north—I cross it sitting in the bow now. And I can float. Better than you.”"
news = "A new canoe has turned up at the cargo landing on Cozumel with Not for Sale cut into her bow. She belongs to a Mérida cacao merchant’s son, who brings salt down from the northern flats once a month."

[tracks.reunion_balam.chapters.reunion.variants.promise]
text = "A new canoe lay at the cargo landing on Cozumel, her hull washed with red earth, and cut deep into her bow were the words Not for Sale. Her owner was crouched beside her loading salt sacks. He heard footsteps and looked up—Balam. He was darker than he used to be, broader in the shoulder, and bareheaded. “The canoe’s built.” He stood and brushed the salt off his hands. “I’ve come to redeem my hat.” Since the business at Maní last year, all of Yucatán had been talking under its breath, and plenty of families had beached their canoes and didn’t dare put out. He kept on running his salt, down from the northern flats to here, once a month. “Two canoes, one company.” He pointed at my canoe, then at his. “If a blow comes up, we lash the lines together and neither of us goes over. The shares we’ll sit down and haggle out.” He pushed a paddle into my hands. “But first, try my canoe. That sea mouth up north—I cross it sitting in the bow now. And I can float. Better than you.”"

[tracks.reunion_balam.chapters.reunion.variants.romance]
text = "A new canoe lay at the cargo landing on Cozumel, her hull washed with red earth, and cut deep into her bow were the words Not for Sale. Her owner was crouched beside her loading salt sacks. He heard footsteps and looked up—Balam. He was darker than he used to be, broader in the shoulder, and bareheaded. “I said I’d come when I was eighteen. I’m four years late.” He stood and brushed the salt off his hands. “Saving up the stake took a while.” Since the business at Maní last year, all of Yucatán had been talking under its breath, and plenty of families had beached their canoes and didn’t dare put out. He kept on running his salt, down from the northern flats to here, once a month. “Two canoes, one company.” He pointed at my canoe, then at his. “If a blow comes up, we lash the lines together and neither of us goes over. The shares we’ll sit down and haggle out.” He pushed a paddle into my hands. “But first, try my canoe. That sea mouth up north—I cross it sitting in the bow now. And I can float. Better than you.”"

[tracks.reunion_balam.chapters.reunion.default]
news = "The son of a Mérida cacao merchant had the scribe in the plaza write a letter to Cozumel. The scribe tells everyone it was the stingiest letter he ever wrote."
effects = [{ text = "Ix Nikte': I’m saying this and the scribe in the Mérida plaza is writing it down. He charges by the line, two cacao beans a line, so I’ll keep it short. I have my own canoe. Her name is cut into the bow. I’m not telling you what it is—come to Cozumel and see for yourself, and then you’ll know. That sea mouth up north, I cross it sitting in the bow now. Nothing more; more costs extra. When you’re back on the island, she’s the one tied with a red cord at the third post on the cargo landing. —Balam (The scribe adds: this letter came to fourteen cacao beans in all, paid in full.)" }, {}]

[tracks.reunion_balam.chapters.reunion.choices.convoy]
text = "Join him as a two-canoe company, and take turns choosing the route home."
reply = "I tried his canoe first. The hull was scraped clean, the ballast stones set square, the salt sacks stowed so bow and stern sat equally deep—exactly the way I used to stow them. He sat in the bow and turned to raise an eyebrow at me. Back on shore we crouched in the sand and drew up the accounts. He wouldn’t give an inch, not one cacao bean, and neither would I. We argued from noon until the sun was well down the sky, and the paddlers had a nap beside us. In the end we wrote it in the sand with a stick: profits split down the middle, losses too; I choose the route home this time, he chooses next time; in a blow, save the people first and the cargo after. He stared at those lines in the sand a long time, then held out his hand and slapped mine. “Best deal I ever made.” Early next morning the two canoes left harbor one behind the other, Not for Sale in the lead, the line coiled between them, ready to tie."
effects = [{}, {}, {}, { title = "Two Canoes" }]

[tracks.reunion_balam.chapters.reunion.choices.one_boat]
text = "Tie our two canoes’ lines together and tell him: one route from now on, one ledger."
hint = "Back then the words never went that far. He won’t be the one to say them today."
reply = "I didn’t try his canoe. I hauled both canoes’ mooring lines over and tied them between two posts, with the hitch we use for crossing a sea mouth, the one that never slips. “One route from now on,” I said. “One ledger.” He looked at the knot, then at me. His lips moved—the old haggling line again, most likely. I shook my head before he could get it out. “No haggling.” He laughed under his breath, bent, and kissed the back of my hand. Then he panicked, his ears flaming. “That’s a Spanish custom, I picked it up in Mérida, don’t take it wrong—” “Then do it again the Maya way.” He stared a moment, and then he really did do it again, and this time not on my hand. The men hauling salt on the landing started whistling; he paid them no mind. Later he cut a short line of small letters under the words on his bow: except to her. It came out crooked, just like the mark on that old gourd."
effects = [{}, {}, {}, { title = "Two Canoes" }]
