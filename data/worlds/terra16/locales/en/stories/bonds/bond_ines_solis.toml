# 伊内斯：这个词我还没有（bond_ines_solis / reunion_ines_solis）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C7 重写，2026-10-12，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。
# 专名：Inés de Solís、Ix Nikte'、María（学校名册上的名字）、Xochitl、Mérida、Campeche、Cozumel、Valladolid、Mexico City、Amadís of Gaul。
# 嬷嬷照人物覆盖层译作 duenna。玛雅语的喉塞撇号照专名写法用直撇号（Ix Nikte'、k'iin、nikte'、ha'），其余撇号与引号用弯的。
# 口头禅：伊内斯 “Wait—I don’t have that word yet.”——只在 c1 正文用一次；a2 say_name、重逢、来信换说法呼应。

[tracks.bond_ines_solis]
name = "Inés: I Don’t Have That Word Yet"

[tracks.bond_ines_solis.chapters.c1]
title = "How to Say Home"
text = "There was a well in the forecourt of the convent school, and after catechism the girls waited by its curb for someone from home to fetch them. Inés de Solís always waited longest, because she went around with her little notebook asking everyone questions. Today it was my turn. “María, in your language, how do you say ‘home’?” “Otoch.” The first time she said it like three separate stones. The second time she bit her tongue. The third time she caught the ending, light and short, the way people say it on the island. She slapped the well curb in delight and wrote it down at once, in a spelling she had made up herself, with two dots over one of the letters. “Wait—I don’t have that word yet. What about ‘my home’? Do you just put ‘my’ in front?” Before I could answer, she went on, “So when our family’s Indians go home, they say it too?” Then she stopped dead. Her pen sat on the page and a blot of ink spread under it. The red climbed from her ears all the way down to her collar. “I mean… the people who work for us… no, I mean the ones who bring us corn…” Her voice shrank with every word, and her fingers crumpled the edge of the notebook."
news = "In the forecourt of the convent school at Mérida, the encomendero’s daughter goes from girl to girl with a little notebook asking how to say “home,” writing each answer in a spelling nobody else can read."

[tracks.bond_ines_solis.chapters.c1.choices.teach_word]
text = "Let the remark go and teach her “my home”: in wotoch."
reply = "“In wotoch,” I said. “Put ‘my’ in front and home grows an extra sound.” She tried it with a hard break in the middle, and I shook my head. She tried it with a clumsy w, and I shook my head again. The third time she held the w in her mouth and let it slide through, and it was right. She wrote it on a new line under “otoch,” two dots and all. She didn’t look up as she finished. “What I said before—that was wrong of me.” “I heard it,” I said, smoothing the crumpled edge of her page. “And I’ll remember it.”"

[tracks.bond_ines_solis.chapters.c1.choices.call_it_out]
text = "Tell her straight out: your family’s Indians have an otoch of their own."
reply = "She went redder still, bent her head, and wrote for a long time—half a page—before she stopped. Then she tore the page out carefully and held it out to me. It was an apology, crookedly spelled, with the new word “otoch” in the middle of it, dots and all. “Here,” she said. “If you take it away, I’ll have to keep it in my head, and then I can never forget it.” I folded the page and tucked it into my blouse. She stood by the well looking at the torn edge in her notebook for a long while."

[tracks.bond_ines_solis.chapters.c2]
title = "The Word That Wouldn’t Match"
text = "We made a rule: she taught me one Castilian word, I taught her one Maya word, one for one, and no backing out. She gave me “ventana” and I gave her “ha'.” She gave me “mañana” and I gave her “sáamal.” Then we got to “k'iin,” and it all went wrong. I pointed at the sky. “K'iin.” I pointed at the date she’d written in her notebook. “That’s k'iin too.” Then I tapped the well curb and told her the duenna would be along soon, that it was nearly time—“k'iin again.” Inés’s pen hung in the air. “Sun is sol, day is día, time is tiempo. Three words. How can you get by with one?” “We just do.” She wrote the three Castilian words in a row, crossed them out, wrote them again. In the end she drew a circle on the page and wrote “k'iin” in the middle of it, and nothing else inside. “My duenna says words should be copied out neatly, one to one,” she said, staring at the circle. “This one won’t go. Maybe someday it’ll take a whole paragraph to explain. It would be a shame to cut it just to keep things tidy.”"
news = "Girls at the convent school in Mérida say the encomendero’s daughter trades words with the girl from the island, one for one, and when a word won’t match she draws a circle around it in her book."

[tracks.bond_ines_solis.chapters.c2.choices.explain_kiin]
text = "Spend a whole afternoon walking her through all three meanings of k'iin."
hint = "She tucks the notebook away and says another time. You don’t know each other well enough yet to take a whole afternoon of hers."
reply = "I started at sunrise: what you call the sun coming up, how days are counted one by one, when it’s time to plant corn and when you must not put to sea. She wrote it all inside the circle until it was full, then the words spilled outside it, and at last she wrote one more ring of them all the way around. “This one word,” she said, holding the notebook up to the sun, “is longer than my father’s whole account book.” The duenna called a third time from the gate before she shut it. “More tomorrow. Where were you? The part about not going to sea.”"

[tracks.bond_ines_solis.chapters.c2.choices.trade_book]
text = "Trade her the word for a loan of one of her hidden chivalry books."
reply = "She looked left and right, then slid a dog-eared copy of Amadís of Gaul out from under her skirt. “Don’t let my duenna see it, whatever you do. If she does, I’ll be saying the rosary for a month.” I read all night by the oil lamp, and the next day at the well I asked her what the knight meant by “cuita,” since he kept saying it. She opened her mouth and couldn’t answer. She opened her notebook instead and drew a small circle next to the big one."

[tracks.bond_ines_solis.chapters.b1]
title = "The Porter Let Only One In"
text = "In September, at the tail end of the rains, Inés told me the frangipani in her family’s courtyard had put out another round of blossoms. “That tree is your name,” she said. “I looked it up in my notebook—nikte'. You have to come see it.” The Solís gate faced the plaza. The porter was an old Spaniard leaning on an ash-wood staff. He let Inés through, then swung the staff across in front of me. “Master’s rule. Indians don’t use this gate.” Inés stopped just inside. I thought she would grab my hand and push past him. She didn’t. She turned and asked the porter, “Did my father say so?” He said he had. So she stepped back out, her hem brushing the threshold, and didn’t argue at all. We sat on the steps outside the wall. It wasn’t a high wall, and over the top hung a spray of frangipani, white petals with yellow hearts, rain still beading on them. “I’ll go and ask him,” Inés said quietly, watching the flowers. “I’ll ask him to change that rule.” She meant it. But I had seen her father once, at that same gate, and that time she had stood behind him with her head bowed and never said a word."
news = "By the plaza in Mérida, the Solís porter barred an Indian girl with his staff, and the encomendero’s daughter wouldn’t go in either. She sat with her on the steps outside the wall all afternoon."

[tracks.bond_ines_solis.chapters.b1.choices.sit_outside]
text = "Leave the rule alone and sit outside the wall with her, watching the flowers."
reply = "We sat until the sun had crossed the plaza. A breeze came up and the spray on the wall shivered and dropped two petals—one fell inside the wall, the other on the step at our feet. Inés picked up the one on our side, blew the dust off, and pressed it into her notebook on the “nikte'” page. “The one inside belongs to my family,” she said, shutting the book and pressing it flat with her hand. “This one belongs to the two of us.”"

[tracks.bond_ines_solis.chapters.b1.choices.dare_her]
text = "Ask her: do you dare go in and tell your father right now?"
reply = "She stood up, then sat down. Stood up again, took two steps toward the gate, came back and sat down. “Next month,” she said. “Next month he’s back from the estate, and he’s always in a good mood then.” I took that for talk. One day at the end of October she was waiting for me at the convent well with swollen eyes. “It didn’t work. He said a rule is a rule.” She sniffed, and then she smiled. “But I said it. Start to finish, the whole sentence.”"

[tracks.bond_ines_solis.chapters.b2]
title = "The Last Page of the Notebook"
text = "In 1555 the Solís house began to fill with guests. Inés said one of them always sat at her father’s right hand—an encomendero from Valladolid, twenty years older than she was, who twisted his beard while he talked. “They’re discussing me,” she said. “Like they’d discuss a piece of land.” She didn’t ask me for a new word that day. She turned her notebook to the very last page and pushed it across to me. There was no word for “home” on it in any language. Just lines of writing, some crossed out, some with question marks after them: Mending. Copying. Teaching children to read. Candle-making? Writing letters for people. “Work a girl can earn her own bread by,” she said under her breath. “That’s all I could think of.” I opened my mouth, and she put up a hand to stop me. “Don’t say ‘no’ for me yet. I know what you’re going to say—just don’t marry him. But I don’t even know how long any of these take to learn, or what they cost, or who would take me. I want to ask about every one of them myself.” Her finger was pressed so hard on the page it left a dent."
news = "The encomendero’s daughter in the Mérida convent forecourt, the one who asked everyone for new words, has stopped asking this year. After lessons she sits on the well curb hugging that book of hers until dusk."

[tracks.bond_ines_solis.chapters.b2.choices.go_through]
text = "Go down the list with her, one by one: where to learn it, what it costs, who’ll take her."
hint = "She closes the notebook. She’ll let you glance at that page, but she isn’t ready to have you come along door to door."
reply = "We asked around for a month. The woman at the mending shop wanted apprentices to bring their own needles and work three years unpaid. Teaching children meant finding a family willing to hand theirs to an unmarried girl. The candle-makers wouldn’t let her through the door. Only the convent scriptorium was short of hands; the friar said a clean hand was all it took, two coppers a page. Inés drew a star beside “Copying.” “I’ll start with this one.” She didn’t let me come in with her when she went to the scriptorium. I waited on the steps outside. When she came out there was ink on her cuff and a trial page in her fist. “Done.”"

[tracks.bond_ines_solis.chapters.b2.choices.teach_weaving]
text = "Bring my backstrap loom and teach her to weave a sash: her first trade on the list."
reply = "I tied one end of the loom to the well curb and the other around her waist. Her weft went tight, then slack, then tight, and the sash came out wobbling like a snake crossing sand. She was as thrilled as if the king had knighted her, and held it up over her head. “I made this! I made it all by myself!” She added a line to her list—“Weaving”—and tied the sash around her notebook in a hard knot. “From now on,” she said, “anyone who wants to read this has to undo that first.”"

[tracks.bond_ines_solis.chapters.a1]
title = "The Knight’s Lines"
text = "In spring the coolest place in the forecourt was under the laurel. Inés tucked Amadís of Gaul inside her catechism and read it to me. She didn’t read the way she talked: she drew every sentence out long, and when the knight rode off to war she stood up and made a sword stroke with her hand. “‘My princess, though seven seas lie between us, my heart remains beneath your window.’” There she paused, glanced up at me, and bent her head to read on—but the words weren’t the ones in the book. “‘My… María, though seven seas lie between us—’ No, wait, your home is across the sea already. ‘Though you go back to your island, my notebook remains…’” She was perfectly solemn, brows knit, like a teacher marking an exam. I burst out laughing, and so did she, so hard the book nearly slid out of the catechism. But she didn’t stop. She smoothed the page flat, cleared her throat, and read it all again from the top, and this time she didn’t laugh once."
news = "Under the laurel in the convent forecourt at Mérida, an encomendero’s daughter reads aloud from her catechism with such feeling that the friars passing by praise her devotion."

[tracks.bond_ines_solis.chapters.a1.choices.mock_knights]
text = "Laugh at her: those knights in her books are all big talk."
reply = "She snapped the book shut, indignant. “When a knight says something, it counts.” “Then say something that counts.” She thought for a long while, rolling a laurel leaf between her fingers. “Next month the friars test us on catechism. I’m going to come first.” She usually came fifth. A month later the list went up in the forecourt, and her name was at the top. She dragged me over to see it and stood under it with one hand on her heart, like a knight who has just sworn an oath."

[tracks.bond_ines_solis.chapters.a1.choices.be_the_knight]
text = "Take the book, change a few words in the knight’s line, and read it back to her."
hint = "Play along now and she’ll think you’re making fun of her."
reply = "I took the book, found the line, swapped “princess” for “Inés” and “window” for “well,” and read it to her word by word. When I finished she reached out, took the book back, and closed it, both hands flat on the cover. “That line of yours,” she said, “isn’t in the book.” “Then put it in your notebook.” She actually did. She turned to the very front, to the “otoch” page, and wrote it there in the margin, very small. When she was done she kept her palm over it for a while before she lifted it away."

[tracks.bond_ines_solis.chapters.a2]
title = "The Leather Book Cover"
text = "That fall the account book I kept for my family came unstitched, its pages dropping out one by one. A few days later, at the well, Inés pushed a cloth bundle into my hands and immediately put her own behind her back. Inside was a book cover of deerskin, its edges sewn tight with linen thread. The stitches ran big and small; you could tell one person had done every one of them. A line of letters was pressed into the leather. Not “María.” “Ix Nikte'.” The mark at the end was pressed in deep, and a little crooked. “I had to ask three people before I knew how to write it,” Inés said, looking down into the well. “My duenna said Indian names don’t have a proper spelling. The old clerk in the scriptorium could write it, but he couldn’t tell me what that last mark was. In the end I asked the Maya assistant at the convent, and he spent half an afternoon teaching me.” She paused. “He said that mark is the little catch of breath in the middle of your name.”"
news = "Girls at the convent in Mérida say the encomendero’s daughter sewed a deerskin book cover with crooked stitches, and the name pressed into it is an Indian one."

[tracks.bond_ines_solis.chapters.a2.choices.take_cover]
text = "Accept it, slip my account book inside, and write her Castilian words on the first page."
hint = "She says it still needs a few stitches and she’ll give it to you another time. She hasn’t quite made up her mind to hand it over."
reply = "I fit the account book in right there. It was exactly the right size, as if she had measured. On the first page I wrote the first word she ever taught me, “bentana,” then “manana.” Inés leaned over to look and tapped twice. “You’re missing the little wave here. And this should be a v, not a b.” I fixed them. She watched until I was done. “From now on I get to check your book too. To see if you’re writing my language wrong.” “Then I get to read your notebook.” “…Not the last page.” “Then I’ll start from the first.”"
effects = [{}, {}, {}, { title = "The Leather Book Cover" }]

[tracks.bond_ines_solis.chapters.a2.choices.say_name]
text = "Read the name aloud, catch of breath and all, and ask why she didn’t write “María.”"
hint = "Ask her now and she’ll only say her duenna set it as sewing practice. You haven’t got that far with her yet."
reply = "I let my breath catch at the mark and read the name to her. “Ix Nikte'. Why not María?” “María is the one on the school roll,” she said. “It isn’t you.” Then she ducked her head and scuffed at the moss at the foot of the well curb with her shoe, again and again. “There’s a word… I can’t find it. Castilian doesn’t have it. It’s not in my notebook either.” “What word?” “I don’t know.” She looked up, red to the tips of her ears. “When I find it, I’ll tell you.”"
effects = [{}, {}, {}, {}, { title = "The Leather Book Cover" }]

[tracks.bond_ines_solis.chapters.a2.choices.trade_back]
text = "Untie the new sash from my waist and give it to her in exchange."
reply = "I pressed the sash, black pattern on red, into her hand. Inés held it and frowned. “Now it’s a trade. It isn’t a present anymore.” “A trade’s fine,” I said. “Clean accounts, nobody owes anybody.” She snorted with laughter and wound the sash twice around her wrist. “You’re exactly like the cacao sellers at the market.” For all that, she still had it on when classes let out."

[tracks.bond_ines_solis.chapters.s]
title = "Nobody’s Footnote"
text = "Before the duenna came to fetch her, Inés pulled me over to the well and spread out a stack of paper. Early the next morning I was leaving for Campeche, where a canoe sent from Cozumel was waiting for me; the “María” on the school roll would be staying behind in Mérida. The stack was every word we had taught each other in three years—hers to me written on the left, mine to her on the right—some with circles drawn on them, some with pressed petals between the sheets. “We split it in two,” she said. “One share for you, one for me, both originals. Nobody walks off with just a copy.” We went through it sheet by sheet. When we got to the “otoch” page, she looked at it a while, set it on my pile, then took it back and set it on hers. “I’ve made up my mind,” she said, squaring the edges one sheet at a time. “I’m going to find work where whatever I make gets my own name at the bottom. Not ‘the Solís daughter.’ Not ‘somebody’s wife.’” She didn’t look at me while she said it. She looked at the “otoch” page in her hand."
news = "The convent school in Mérida has let out. The island girl and the encomendero’s daughter crouched by the well dividing a stack of papers written in two languages, and weren’t done until dark."

[tracks.bond_ines_solis.chapters.s.default]
news = "Boatmen at Campeche say a canoe from Cozumel picked up an island girl from the Mérida school. The encomendero’s daughter was kept in by her duenna that day and couldn’t come to see her off."

[tracks.bond_ines_solis.chapters.s.choices.promise]
text = "Promise a letter every year, each of us teaching the other three new words."
hint = "A promise like this is for someone who has learned all of the other’s words. Either you haven’t got that far, or your once-in-a-lifetime promise has already gone to someone else. This time all you can leave her is your address on the island."
reply = "“Three’s too few,” she said at once. “Five.” “Five, then. A letter takes over a month from the island to Mérida.” “Then over a month.” She stood her notebook and my account book in its leather cover side by side on the well curb and lined up their spines. “Look, the same height. From now on these two have to get to the last page together.” She took her pen and wrote the same line on the flyleaf of each: Five words a year, no backing out. Then she folded my share of the papers, slid it into the pocket of the book cover, and pressed it flat, and pressed it again. “You write the first one next year. I want to see what words you pick up at sea that I don’t have.” The duenna called her from the gate. She got as far as the gate, then turned and shouted back: “Five!”"
effects = [{}, {}, {}, {}, {}, { title = "Nobody’s Footnote" }, {}]

[tracks.bond_ines_solis.chapters.s.choices.heart]
text = "Tell her: once we’re grown, whatever word she finds, I want to hear it first."
hint = "The words stay pressed between the two stacks of paper. Either you haven’t come that far yet, or your only promise has already gone to someone else."
reply = "Her eyes lit up all at once, the way they had the first time she got “otoch” right. “That word might be very long,” she said. “It might take a whole paragraph.” “I’ve got plenty of time.” She looked down at the papers for a long while, then reached over and took my hand. There was ink on her fingers. She held on so tight I could feel her trembling. “Then don’t you leave first,” she said. “When I find it, you have to be somewhere I can say it to you.” “I’ll be at sea.” “Then at sea.” She loosened her grip a little, then tightened it again. “I’ll find it. Until then, don’t tell anyone what you just said.” The duenna called a second time from the gate. She let go, and put the “otoch” page on my pile."
effects = [{}, {}, {}, {}, {}, { title = "Nobody’s Footnote" }, {}]

[tracks.bond_ines_solis.chapters.s.choices.own]
text = "Each her own way: she copies at the convent, I go to sea, and neither is the other’s footnote."
reply = "She blinked, then laughed. “I’m writing that down.” She opened her notebook to the newest page and wrote: Nobody’s footnote. She thought for a moment, then wrote my name in the left corner, Ix Nikte', pressing hard on the mark at the end, and her own name in the right corner, a full line’s width apart. “That far?” I asked. “So neither of us is in the other’s way.” She blew the ink dry. “You keep your accounts at sea, I’ll copy my pages at the convent. And if either of us ever ends up as one line of small print in somebody else’s book, the other goes and gets her back.” When we reached the end of the stack she didn’t pass the “otoch” page back and forth this time. She put it straight on her own pile. “I’m keeping this one. You’ve got the home it came from. You don’t need it.”"
effects = [{}, {}, {}, { title = "Nobody’s Footnote" }, {}]

[tracks.reunion_ines_solis]
name = "Inés: A Table in Two Scripts"

[tracks.reunion_ines_solis.chapters.reunion]
title = "A Table in Two Scripts"
text = "In 1564 my ship lay five days at Campeche. On the third day I walked out to the Franciscan convent at the edge of town, and the friar in the scriptorium told me Inés de Solís was in the back room teaching girls their letters. She had never married the encomendero with the beard. She copied for the convent—her rate had gone from two coppers a page to four—and in the afternoons she taught the town’s girls to read. On the table by the window sat two stacks of paper side by side, Castilian on the left, Maya on the right. The Maya was in the friars’ alphabet, and some of the letters still wore two dots: her own spelling, never changed. When I came in she was bent over a new girl copying names into a register. “Don’t write yet.” She put her hand over the girl’s pen. “Go ask her first what her family calls her. Once you know, then write.” She straightened up and saw me. The old notebook lay by her hand, its cover rubbed pale. She turned to a page near the back and kept a finger in it. “I used to tell you all the time that I was missing a word,” she said. “There was one I went without for years. I’ve found it.”"
news = "In the scriptorium of the Franciscan convent at Campeche, a lady keeps papers in two scripts on her table, and teaches the new girls to ask what a person is called before they write a word."

[tracks.reunion_ines_solis.chapters.reunion.variants.with_xochitl]
text = "In 1564 my ship lay five days at Campeche. On the third day I found Inés de Solís in the scriptorium of the Franciscan convent at the edge of town. She was home from Mexico City on a visit and had borrowed a table by the window, two stacks of paper side by side on it, one in Castilian, one in Nahuatl. These days she worked at a featherwork shop in Mexico City. Every picture the shop sent out was signed on the flyleaf in two scripts, and the Castilian line was hers. Whose hand wrote the other line, she didn’t say. Xochitl leaned in the doorway twirling a green feather and gave me a lift of the chin by way of hello. They had come back together. One of the convent girls brought over a register for help, and Inés put her hand over the girl’s pen. “Go ask her first what her family calls her. Once you know, then write.” She turned, saw me, and took the old notebook out of her bundle, its cover rubbed pale. She opened it to a page near the back and kept a finger in it. “I used to tell you all the time that I was missing a word,” she said. “There was one I went without for years. I’ve found it.”"

[tracks.reunion_ines_solis.chapters.reunion.default]
news = "The lady who copies in the convent scriptorium at Campeche sent off a letter half in Castilian, half in Maya. The muleteer carrying it turned it every which way and couldn’t make out a word."
effects = [{ text = "Ix Nikte': (This half is in Castilian.) The boatmen at the Campeche wharf talk about a captain out of Cozumel who gives her name as Ix Nikte', and nobody calls her María. I guessed straight away it was you. This year I stayed a while in Campeche and often sat at the table by the window in the convent scriptorium, and every time a boat put in at the wharf I looked up. Yours never once came this way. (This half is in Maya, still in my own spelling—don’t laugh at the dots.) Back at the well I was forever saying I was short a word. I’ve found it. I won’t put it here. Once it’s written down it’s just a thing on paper that anyone can unfold and read. I want to say it to you in person. At the well we agreed on one word for one. This time I’ll go first and you can owe me. Five new words enclosed. One, pauta: the lines you rule before you copy. Two, legajo: a bundle of documents tied with string. Three, alfajor: the honey cakes from the convent kitchen. I owe you one. Four, aguacero: that kind of sudden downpour Campeche gets on June afternoons. Five, amanuense: someone who holds the pen for other people. That’s me. If you want to find me, ask in the scriptorium of the Franciscan convent at Campeche. The friars know where I am. —Inés (signed with my own name)" }, {}]

[tracks.reunion_ines_solis.chapters.reunion.choices.new_words]
text = "Sit down with her and trade every new word we’ve each saved up over the years."
reply = "We traded from afternoon until the convent rang the evening bell. She taught me eleven: scriptorium shop talk, new words that had come down from Mexico City, and one curse, which she checked the doorway before saying. I taught her nine: the name of a wind, two kinds of fish you only see off Cozumel, and the call the sailors sing out when they take in sail. “You owe me two,” she said, noting the count at the back of the notebook. “Pay me next time.” Then she turned back to the front, to the “otoch” page. There was her old spelling, both dots still on it; on the line below, “in wotoch.” She took her pen and added a third line under them: nochan. “Nahuatl, for ‘my home.’” She blew on the ink. “Three languages, three homes. I’m going to keep adding.” She slid the notebook over so I could see the three lines together, and didn’t close it until I had looked my fill."
effects = [{}, {}, {}, { title = "A Table in Two Scripts" }]

[tracks.reunion_ines_solis.chapters.reunion.choices.that_word]
text = "Ask her: what is the word?"
hint = "That promise was never made back then. She won’t say the word today."
reply = "For a moment she said nothing. She got up, pushed the door to, came back, sat down, and closed the old notebook and set it aside. “I looked for eight years,” she said. “It isn’t in Castilian. It isn’t in any book. The knights in my novels have a hundred lines, and they’re all to princesses—they don’t count.” She looked at me. “Then I found it was in your language. Nobody taught me. I found it myself.” She said it. It was Maya, and short, and she said it slowly, with the catch of breath in the middle exactly where it belonged, better than any word I ever taught her. I didn’t make a sound. She reached across and took my hand, as tight as that day at the well, and this time she wasn’t shaking. “I’m not writing this one in the notebook,” she said. “It’s only for saying to one person.” The convent bell rang for evening. She leaned over and touched her lips lightly to my forehead, like putting the two dots on a word she’d just learned."
