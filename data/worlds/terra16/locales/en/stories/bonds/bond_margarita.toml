# C7 重写（2026-10-11，Claude Opus）：stories/bonds/bond_margarita.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 的 take_lace / keep_the_knot 第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个、
# 重逢三个选项的第 4 个效果是 memory；重逢 default 的第 1 个效果是 letter。
# 诺埃尔不用 he/she/him/her/Sir/Lady/Miss/Mister；“Lady Knight”只出现在 noel_unveiled 的变体里（main_noel 第三章的英文标题）。

[tracks.bond_margarita]
name = "Margarita: The Steward’s Deductions"

[tracks.bond_margarita.chapters.c1]
title = "The Steward’s Deductions"
text = "The marquis had gone to Barcelona, and the Casa de Pilatos answered to the steward now. On payday every maid came up a third short; the steward said it was for broken crockery. The stable bell woke me, and I crossed the courtyard yawning, a jacket thrown over my shoulders. By the fountain a maid was holding up a sheet of paper and stopping everyone who passed. The cook waved her off, the groom played deaf, and the clerk from the counting room took the long way around a pillar. The ink was still wet; every time she flapped the sheet, a drop fell on the tiles. When she saw me she was across the courtyard in three strides—and then the words stopped on her lips, and she just looked at me, for a good long while. “Seen enough?” I said. “I’m not awake yet. There’s nothing written on my face.” She blinked and slapped the paper against my chest. “You can read, can’t you? Sign. It says not one bowl got broken in the kitchen this month. I’m Margarita. My name’s already on it—I just need someone who can read to witness.” Her name sprawled across the page, big and crooked, with seven drawn crosses after it."

[tracks.bond_margarita.chapters.c1.choices.sign_it]
text = "Sign it, then go back to bed."
reply = "I signed under the seven crosses. My hand wasn’t awake yet either, and the letters looked like a horse had stepped on them. She held the sheet up to the sun. “That’s how a knight writes?” Then she marched it straight into the steward’s room. At noon there was an extra piece of meat in my soup. By the next day the whole house knew that Noël, one of the pages, had stood witness for the maids. She passed me in the corridor with an armful of sheets and winked. “You didn’t hear it from me.”"

[tracks.bond_margarita.chapters.c1.choices.ask_the_endgame]
text = "Ask her first: once this blows up, how does she mean to finish it?"
reply = "“Finish it?” She burst out laughing. “I haven’t even started.” She jammed the pen into my hand; ink ran down the quill onto my fingers, two shakes didn’t get it off, and so I signed. The next day the whole house was guessing which of the pages had put a name to it. She went past me carrying a basin of water, lips pressed tight, eyes laughing."

[tracks.bond_margarita.chapters.c2]
title = "Amadís"
text = "Behind the laundry the yard was hung full of sheets. Margarita sat between two rows of them on an upturned washtub with a book open on her knees, its corners curled like dried cabbage leaves and a yellow ring of soapy water on every page. I had come looking for a lost stocking. She whipped the book behind her back, saw it was me, and brought it out again. “Amadís of Gaul,” she whispered. “If the steward finds out, he’ll dock my pay again.” She pushed the book into my arms. “You pages are all going to be knights someday, so learn from him. Amadís went to the ends of the earth for one promise.” I leafed through a few pages. “He fights three battles a day and never eats. I miss one meal and I fall over.” “Give it back!” She grabbed for it; I held it up out of reach, and she stamped her foot. “There’s a knight in this house too,” she said suddenly, “just like the ones in the book. Do you know who?” Before I could open my mouth she had snatched up her laundry basket and ducked out under the sheets. The book was still in my hands."

[tracks.bond_margarita.chapters.c2.choices.finish_and_review]
text = "Finish the book and slip a short review into the last page"
hint = "Two steps off, she turns back and takes the book away again. A forbidden book spending the night in the pages’ room is more than she can stomach yet."
reply = "It took me three nights. On the last page I tucked a slip of paper with one line on it: “The giant part is ridiculous.” Two days later the book turned up under my pillow, with a line added below mine in a hand even worse than my own: “That’s because you’ve never met a giant.” Under it lay volume two."

[tracks.bond_margarita.chapters.c2.choices.ask_her_read]
text = "Complain it’s too thick, and ask her to read a passage aloud"
reply = "She picked the scene where the knight keeps watch below the castle and read it standing on the washtub. When his beloved appeared at the window she even put on a high little voice, hamming it up worse than the players in the square. At the end she was the one who went red. She stuffed the book into the bottom of her basket and threw a wet sheet over it. “Next time read it yourself.”"

[tracks.bond_margarita.chapters.b1]
title = "The Open Ledger"
text = "Margarita had started keeping accounts. Not the household’s—the maids’: who had been docked how much on which day, and what the steward claimed it was for. She had stitched the book together from the backs of old ledger pages, and her letters were big and pressed hard into the paper. But she couldn’t carry a sum. Nine coppers and five coppers: she counted it on her fingers three times and got three answers. She barged into the pages’ room with the book in her arms while I was still under the blankets. “Up,” she said, yanking at the corner. “You learned arithmetic in your cosmography class.” “We learned to count stars.” “And stars don’t get counted one at a time?” I borrowed the kitchen’s breakage book from the cook, and we lay on our elbows at the windowsill: she read out an entry, I turned a page. When we got to October, my hand stopped. Half the dishes the steward claimed were broken weren’t in the breakage book at all. Margarita said nothing. She dragged her thumbnail under those lines, once and then again, nearly through the paper. “I knew it.”"

[tracks.bond_margarita.chapters.b1.choices.make_grid]
text = "Redraw the deductions as a grid of bowls and plates the maids who can’t read can follow"
hint = "She’s holding the ledger tight. She still isn’t sure you wouldn’t carry it straight to the steward to curry favor."
reply = "My bowls looked like cooking pots and her plates looked like moons, and we laughed at each other for ages. But the maids got it at a glance: one bowl, one copper; a bowl with a cross through it was one the breakage book had never heard of. That night the cursing of the steward went on in the sewing room until the lamps were put out. Someone cut out one of her moons and stuck it up over a bed."

[tracks.bond_margarita.chapters.b1.choices.hide_ledger]
text = "Warn her to keep the ledger where the steward can’t see it"
reply = "She rolled her eyes at me. “Where he can see it is exactly where it belongs.” And off she went with it. The next day, passing the sewing room, I saw her stitching up an old pillow, the stitches so close it looked as if she were locking something in. I never saw that ledger on the windowsill again."

[tracks.bond_margarita.chapters.b2]
title = "A Ledger in the Sword Case"
text = "Somehow the steward had heard about the ledger. At breakfast he planted himself in the kitchen doorway and announced that starting today he would search the maids’ rooms one by one, and whoever was behind it would be out of the house with her bundle. For the first time, Margarita panicked. I ran into her at the foot of the stairs, hugging an old pillow with the ledger sewn up inside. She had already been twice around the corridor and trusted none of it. When she saw me, she hauled me in under the staircase. It was dark there and smelled of old dust. “He won’t touch a page’s things,” she whispered. “Your sword cases have the marquis’s arms on them.” “So?” “So I can’t let you take this on for me.” Even as she said it, her hands were pushing the pillow into my arms—pushing it over, pulling it back a little, pushing it over again. Above us the steward’s boots started down the stairs, one step at a time."

[tracks.bond_margarita.chapters.b2.choices.hide_in_sword_case]
text = "Unpick the pillow and hide the ledger in the sword case"
hint = "Her hands pull the pillow back again. She doesn’t dare stake the other maids’ livelihoods on you yet."
reply = "I picked the seam open with the point of my sword, slid the ledger out, and laid it in the case under the blade that hadn’t been sharpened yet. The steward searched for three days and turned up two combs, a love letter and half a moldy cheese; of the ledger, not a trace. On the fourth day Margarita hung out the sheets in the courtyard and sang a whole song right in front of him. That night she came for the ledger, and after she’d gone I opened the case: beside the hilt lay a honey cake wrapped in oiled paper."

[tracks.bond_margarita.chapters.b2.choices.go_to_mal_lara]
text = "Take her and the ledger to the school in town and ask Mal Lara to judge"
reply = "Mal Lara went through the ledger from the first page to the last. At the thumbnail gouges he stroked his beard. “This steward belongs in my book of proverbs.” He wrote to the marquis in Barcelona that same day. Once the reply came, the steward never mentioned searching rooms again—he just turned aside whenever he saw Margarita coming. She made a point of hailing him across half the courtyard to ask whether he’d broken any bowls today."

[tracks.bond_margarita.chapters.a1]
title = "Ribbons Spilled on the Floor"
text = "In the sewing room, Margarita’s sewing box slid off the edge of the table. The lid sprang open and ribbons spilled everywhere—yellow, blue, a faded green—and a thimble went rolling off toward the door. She threw herself after them, and the first thing she grabbed was a red ribbon: a true, deep red that had plainly never been used. She stuffed it back into the bottom of the box and piled the thread, the scraps and the pincushion on top of it one by one until it was buried. I crouched to help with the rest. Partway through I felt eyes on me, looked up, and found her staring at my face. I turned my head away. “Pick up ribbons. Don’t look at me.” That brought her back. She grabbed a handful of blue ones, put them down, grabbed them again. “The red one,” she said, “isn’t for anybody.” Then she bit her lip, as if she had already said too much."

[tracks.bond_margarita.chapters.a1.choices.pick_up_not_look]
text = "Gather the ribbons back into the box one by one, and leave the bottom one alone"
hint = "She hugs the box to her and even shies from your outstretched hand. She doesn’t feel that close to you yet."
reply = "I sorted the scattered ribbons by color and laid them back in one at a time, without touching the bottom layer. When I passed her the box, her fingers brushed the back of my hand and stayed there a moment without pulling away. “There’s nobody in the sewing room tomorrow afternoon,” she told the lid. “Are you coming?” She ran off with the box before I could answer. The thimble was still in my hand."

[tracks.bond_margarita.chapters.a1.choices.keep_it_quiet]
text = "Promise to keep it quiet—not a word, even to the other pages"
hint = "“Isn’t for anybody”—she said it too fast, and she isn’t ready to trust you with the rest."
reply = "“If you breathe a word,” she said, pointing her needle at me, “I’ll put how you lie in bed every morning into every letter in this house. Even the cook will know.” I said it was a deal. She was so pleased she jabbed the needle into her own finger, and shook her hand and laughed at the same time."

[tracks.bond_margarita.chapters.a1.choices.whose_hat]
text = "Ask whose clothes all these ribbons are going on"
reply = "“The steward’s hat.” She didn’t bat an eye, and dangled a yellow one in front of my face. “A band of red, then a band of yellow, so the whole house can see whose wages paid for it.” I laughed so hard I sat down on the floor. She kicked me and then fell over laughing too."

[tracks.bond_margarita.chapters.a2]
title = "A Strip of Lace"
text = "Everyone in the house knew the lace at Margarita’s collar was an old piece the marchioness had handed down, and everyone knew she claimed she’d picked it out herself. This time she came to find me with her hands behind her back, and kept them there a long while before bringing them out: a short strip of new lace in white thread, worked in a pattern of tiny anchors. She had wound the bobbins for a month; I had seen her at night by the lamp, lifting the threads one at a time. Along one edge a knot had gone wrong and made a little lump. “I made this myself,” she said. “It isn’t the marchioness’s.” “I heard you.” “I made it myself.” She said it again and slapped the lace into my palm. “Sew it on your collar. How you sew it is your business.” Then she just stood there, not leaving, not looking at me, staring at the knot that had gone wrong."

[tracks.bond_margarita.chapters.a2.choices.take_lace]
text = "Take it, and ask her to show you how to sew it on, right now"
hint = "A month of winding went into that little strip. You’re not close enough yet for her to watch it go on your collar."
reply = "It took me five tries to thread the needle, and the stitches crawled across my collar like a centipede. She scolded—“The marquis’s grooms have better hands than you”—while she snipped them out and started over, her needle going like a hen pecking corn. When she was done she bent and bit off the thread, then stepped back to look. “There. Now the whole house knows I made it.”"
effects = [{}, {}, {}, { title = "A Strip of Lace" }]

[tracks.bond_margarita.chapters.a2.choices.keep_the_knot]
text = "Take it, and say the wrong knot is the best part—don’t unpick it"
hint = "She can hardly bear to look at that knot herself. You’re not close enough yet to tell her it’s pretty."
reply = "“It’s a mistake,” she said. I said the mistake was how anyone would know she’d made it; nobody else could tie that knot. She buried her face in her sewing basket and kept it there so long I thought she’d fallen asleep. When she came up she was still red. “Then don’t you let anybody see that knot.” When she sewed it on for me, she took care to turn the lump to the inside of the collar."
effects = [{}, {}, {}, { title = "A Strip of Lace" }, {}]

[tracks.bond_margarita.chapters.a2.choices.tease_madam]
text = "Tease her: so this one really isn’t the marchioness’s?"
reply = "She rapped me on the forehead with a bobbin, and not gently. “This one’s mine.” She pressed the lace harder into my hand. “And from now on, only mine.” Then she turned and left—and at the door she looked back to check I’d put it away safe."

[tracks.bond_margarita.chapters.s]
title = "Rain at the Gate"
text = "At year’s end I was going home to Tarifa, to receive my sword in the spring. The carriage waited outside the gate. It had rained since morning, and the driver sat hunched on the shaft. I had just heaved my sword case aboard when someone behind me called my name. Margarita came running out of the courtyard without a cloak, her hair half soaked and plastered to her face, her sewing box in her arms. “I’ve made up my mind,” she panted. “Either I get back every coin the maids are owed, or I walk out this gate with what I’ve saved. One way or the other, I am not sewing buttons for the steward for the rest of my life.” “You got soaked to tell me that?” “And something else.” She looked down, opened the sewing box, shut it, opened it again. Rain drummed on the lid. The driver cleared his throat. “Don’t rush me,” she said without looking up. “I’m looking for something.”"

[tracks.bond_margarita.chapters.s.choices.promise]
text = "Agree: the day she wins the wages back, she writes, and you come back to stand witness"
hint = "A promise for life—she doesn’t yet count you as someone she can trust with that. Or else you’ve already pledged your word for life to someone else."
reply = "“You’d better come that day.” She tucked the sewing box under her arm. “I’ve already used your name as a witness once. The second time’s free.” “The first time was free too.” “The first time you got meat in your soup.” Rain beat on the arch of the gateway. She held out her hand, palm up, and I slapped it—a sharp crack. Her hand was ice-cold and wet, and she hit back harder than I did. The driver coughed again, and she glared at him. “What’s the hurry? Nobody’s running off.” I climbed in. A long way down the road I looked back, and she was still standing in the gateway, the sewing box held to her chest with the lid shut tight. In the spring a letter reached Tarifa, the address big and crooked, a single line inside: “Got half of it back. The other half is waiting for your signature.”"
effects = [{}, {}, { title = "Rain at the Gate" }, {}, {}, {}]

[tracks.bond_margarita.chapters.s.choices.heart]
text = "Stand in the rain and wait for her to bring the red ribbon up from the bottom of the box"
hint = "The ribbon is still at the bottom of the box; her fingers touch it and draw back. Stand in the rain as long as you like—your hearts aren’t close enough yet for her to bring it out. Or else your heart is already given to someone else."
reply = "I didn’t get in. I stood in the rain and waited. The driver sighed and tugged his hat brim down. At last she drew the red ribbon up from the bottom of the box, slowly, as if afraid it would tear. The whole box had gone damp; the ribbon alone was dry. She pushed it into my palm and folded my fingers over it one by one. “Why it’s red,” she said, “I’ll tell you when we’re grown and see each other again.” “Why not now?” “No. If I tell you now, you’ll laugh at me all the way home.” Rain ran off her lashes and she didn’t wipe it away. She took my hand and held it tight, as if counting to three under her breath, before she let go and stepped back into the gateway. “Off you go, Noël. Don’t fall asleep in the carriage and drool on that ribbon.” The carriage rolled away. I kept that hand, the ribbon still in it, tucked inside my coat the whole road home."
effects = [{}, {}, {}, {}, { title = "Rain at the Gate" }, {}, {}]

[tracks.bond_margarita.chapters.s.choices.own]
text = "Agree that the day she leaves the marquis’s house, you’ll come for her and stand her a drink"
reply = "“One drink?” She snapped the sewing box shut. “All the years I’ve put up with this place, and you think one drink settles it?” “A barrel, then.” “A barrel, and you carry it.” She laughed, rain dripping off her chin. Then she fished a stub of tailor’s chalk out of the sewing box and wrote across the lid of my sword case in big letters: “Owes one barrel.” She pushed the chalk into my hand. “Make your mark. If a knight’s word turns out to be no good, I’ll bring this case to Tarifa and collect.” I drew a cross under it, and only then, satisfied, did she shove me in through the carriage door. “Go on, the driver’s beard is soaked through.” By the time I’d sat down and lifted the curtain, she was already running back across the courtyard with the sewing box held over her head against the rain."

[tracks.reunion_margarita]
name = "Margarita: The Old Gate of the Marquis’s House"

[tracks.reunion_margarita.chapters.reunion]
title = "The Old Gate of the Marquis’s House"
text = "Six years later I came back to Seville. The Casa de Pilatos had the same gate; the brass lion on the knocker had lost an ear, and nobody had mended it. There was a new steward. On the laundry wall hung a board with a ledger tied to it by a string, open for anyone to leaf through: who had drawn how much in wages on which day, how much had been docked and why, entry after entry, the letters big and crooked. Margarita ducked out from under the washing lines with a ring of keys at her waist and two young maids at her heels. When she saw me she froze, and a corner of the sheet in her hands dropped to the ground. Then, same as ever, she came charging. “Have you heard?—no, of course you haven’t.” She caught hold of my sleeve. “The old steward coughed up most of that crockery money when he left. There’s one last payment, and the new one won’t hand it over without a signature to stand surety.” She jingled the keys. “And I haven’t found anyone to sign it this time.”"

[tracks.reunion_margarita.chapters.reunion.default]
effects = [{ text = "Noël—I heard a knight from Tarifa was passing through Seville this year. I stood at the gate a whole afternoon looking at every knight who went by, and not one of them was you. So here’s the news. The old steward is gone, and before he went he coughed up most of the crockery money: I stood in front of his carriage and worked it out entry by entry while his driver gaped. The new steward is a thin man who reads with his nose on the paper, but he’s not a bad sort. The ledger hangs on the laundry wall where anyone can read it. I’ve been teaching the young maids their letters—first “wages,” then “docked.” There’s one payment left. The thin man says someone has to sign as surety. I told him I know a knight. He said, then fetch the knight. I said the knight is busy. So I’m sending this with a carter bound for Tarifa. His name is Juan and he’s fond of his wine—give him one cup, not two. If you’re ever passing through Seville, come in and sign. If you’re not, that’s all right too; I’ve nailed the paper to the wall, and it will wait. The red ribbon is still at the bottom of my sewing box—or else it’s with you, and you know which. Margarita. P.S. All of the above, you heard on the wind. Don’t say where." }, {}]

[tracks.reunion_margarita.chapters.reunion.variants.unveiled]
text = "Six years later I came back to Seville. The Casa de Pilatos had the same gate; the brass lion on the knocker had lost an ear. On the laundry wall hung a board with a ledger tied to it by a string, open for anyone to read, the letters big and crooked. Margarita ducked out from under the washing lines with a ring of keys at her waist and two young maids at her heels. She saw me, came charging—and stopped halfway. The story of the “Lady Knight” had reached Seville long ago. She looked me over from hat to boots, then from boots back up to hat, and went red by slow degrees right up to her ears. Then she grabbed the doorframe and laughed until she doubled over. “All those years I kept that ribbon at the bottom of my sewing box—do you know what I thought back then…” She waved it away. “Never mind. Forget it.” When she’d laughed herself out she wiped her eyes and caught my sleeve, same as ever. “Have you heard?—no, of course you haven’t. The old steward coughed up most of the crockery money when he left. There’s one last payment, and the new one wants a signature to stand surety.” She jingled the keys. “I haven’t found anyone to sign it.”"

[tracks.reunion_margarita.chapters.reunion.choices.friend]
text = "Go with her to collect the last payment, and sign with the name you carry now"
reply = "The new steward was a thin man who sat in the counting room with his nose nearly on the paper. I signed at the bottom and added my title as a knight of the Strait Order at Tarifa. The thin man looked at the signature, then at the sword at my hip, and without a word unlocked the chest and counted out the money. Margarita counted it coin by coin into a cloth bag. Then she took the ledger down from the wall and wrote one word on the last line: “Recovered.” She tossed the pen aside. That night two tables were pushed together in the laundry and the maids ate a pot of stewed mutton. Over supper Margarita told the story of the old petition three times. The first time, she had dragged me out of bed; the second time, I had come charging down the stairs on my own; by the third, I had ridden into the courtyard on horseback. “You’ve got it wrong,” I said. She raised her cup and winked at the young maids. “I never claimed I remembered it straight.”"
effects = [{}, {}, {}, { title = "The Old Gate of the Marquis’s House" }]

[tracks.reunion_margarita.chapters.reunion.choices.laugh_at_her]
text = "Laugh the old muddle off with her, then ask whether the ribbon still counts"
hint = "She hasn’t brought up any old muddle, so there’s nothing yet for you to laugh about."
reply = "“It counts,” she said. “The ribbon counts. You, I’ll have to look over again.” And she really did walk a circle around me, slowly, like someone taking stock in a storeroom. On the second lap she lost the fight again and crouched down with her face in her hands, the keys jangling. The two young maids poked their heads around the washing lines and she bellowed them back. That afternoon she dragged me through the whole house—kitchen, stables, counting room; she even knocked on the new steward’s door—and every time she shoved me forward: “This is my friend. Don’t go guessing. Whatever you guess, you’re wrong.” The paper for the last payment she had me sign leaning on the stone rim of the fountain. “This is where I stopped you, back then,” she said. “It started here, so it ends here.”"
effects = [{}, {}, {}, { title = "The Old Gate of the Marquis’s House" }]

[tracks.reunion_margarita.chapters.reunion.choices.love]
text = "Tie the red ribbon back around her wrist"
hint = "The red ribbon is right there in her sewing box. You didn’t wait for it in the rain back then, and today you can’t bring yourself to tie it on."
reply = "I untied the red ribbon from my sword hilt. Six years of wind and sun had faded it a shade and frayed its edges. When Margarita saw it, the ring of keys slid out of her hand. I took her hand, wound the ribbon twice around her wrist and tied it. My knot was bad—crooked, with a lump in it. She looked down at it for a long time, at that lump. “You still owe me an answer,” I said. “Why red.” “In the books, when knights ride out, they wear a red ribbon from the one they love.” She looked up. Her eyes were wet, but the corners of her mouth turned up. “Six years I’ve waited for this.” She rose on her toes and kissed me. Behind the washing lines the two young maids gasped, and the keys lay where they had fallen. The paper for the last payment didn’t get signed until the next day."
effects = [{}, {}, {}, { title = "The Old Gate of the Marquis’s House" }]
