# 奈·加玛：哪天到港 / 价由她开（bond_nyai_gama、reunion_nyai_gama）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、回忆标题、来信、变体），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完；美式拼写、弯引号。

[tracks.bond_nyai_gama]
name = "Nyai Gama: Which Day in Port"

[tracks.bond_nyai_gama.chapters.c1]
title = "Which Day in Port"
text = "On the Gresik waterfront the pepper sacks are stacked higher than a man. A pepper trader from Banten asks me when the cloves will come in, and I smile. “My father’s kora-koras will be here the moment the monsoon turns. Thirty oars pulling together—they’re faster than the wind.” Before he can answer, a girl sitting under the steelyard snaps her ledger shut and looks up. She’s in academy clothes, with charcoal on her fingers. “Next time, tell me which day you make port. Say that first.” I tell her they’ll come when the wind does. She tucks the ledger under her arm, stands, and brushes the pepper dust off her sarong. “The wind doesn’t listen to a prince boasting.” Prince, she says—not little prince. I’m still deciding whether that counts as politeness when she’s already a dozen paces off. The trader clicks his tongue. “That’s Nyai Gama, daughter of a Banten pepper house. Anyone who’s ever been late has a line in that book of hers.”"

[tracks.bond_nyai_gama.chapters.c1.choices.give_a_date]
text = "Catch up with her, work out the monsoon and the sailing on my fingers, and give her a date"
reply = "I catch her at the warehouse door, borrow her charcoal, and work it out on the ground: the day the monsoon turns, how many days the rowers need, where they put in along the way. She studies my sums for a while, then writes my date into her ledger. When the day comes, the fleet is three days late. She turns to the page and shows me. There’s a line drawn under that entry, and beside it: “A prince’s date—thirty percent off.”"

[tracks.bond_nyai_gama.chapters.c1.choices.prince_voice]
text = "Play the prince: “The Sultan’s ships are never late.”"
reply = "“Good.” She opens the ledger again. “Then every day late, you owe me a pound of cloves. Write it down and put your thumbprint on it.” I do. That season the fleet comes in three days behind, and I send three pounds of cloves to her stall. She takes them and sends back a receipt that says “Paid by the prince,” in very neat letters."

[tracks.bond_nyai_gama.chapters.c2]
title = "Wet Pepper"
text = "The east wind has come, and the Gresik waterfront is full of Chinese junks waiting for pepper. A peddler from up-country drops a sack on the scale, and the weight slides all the way to the end of the beam—a good deal heavier than other sacks its size. The junk’s master, a man from Quanzhou, stamps on the gunwale and shouts that the tide won’t wait. Nyai Gama pushes through the crowd, takes a handful, cracks one peppercorn between her teeth, and spits it out. “It’s been soaked.” The peddler goes red to the neck and insists that rainy-season pepper is always heavy. She doesn’t argue with him. She turns to me instead—I picked up some of the junk men’s tongue from Fujian sailors on Ternate. “You speak their language. First, tell the master to wait half a day. Second, don’t say it came from me. He won’t listen to a girl.” The peddler clamps a hand over the mouth of the sack."

[tracks.bond_nyai_gama.chapters.c2.choices.spread_and_dry]
text = "Get the master to wait half a day, then help her spread the sack out to dry and pick it over"
hint = "She doesn’t know yet whether you’d spend an afternoon on one sack of pepper. She won’t ask you to."
reply = "It takes me as long as a cup of tea to talk the master around, but he agrees to wait until evening. We tip the sack onto a mat outside the warehouse and pick it over one peppercorn at a time, the shriveled ones and the grit going into a little heap. By the time the sun is low the pepper is dry, and back on the scale it weighs a tenth less. The peddler shoulders his sack and leaves before the weighing is done. The master slaps the side of his ship and laughs. “That girl’s teeth are truer than the scale.” Nyai Gama doesn’t look around. She just tips her chin at me and keeps picking."

[tracks.bond_nyai_gama.chapters.c2.choices.ask_departure]
text = "Go aboard first and find out exactly when the junk sails"
reply = "I ask around on deck and come back with the answer. “Noon tomorrow, on the tide.” She nods and turns to the peddler. “Dry it before noon tomorrow and bring it back to be weighed. If you can’t, carry it home.” He goes off cursing, and he doesn’t come back at noon the next day. Not one peppercorn from that sack goes aboard. She writes the junk’s name and sailing hour in her ledger. “That’s all I needed.”"

[tracks.bond_nyai_gama.chapters.b1]
title = "Days on the Chessboard"
text = "Everyone at the academy knows I have never lost at chess. One afternoon Nyai Gama drags a stool over, sits down across from me, sets out the pieces, and puts a copper coin on the table first. “Loser pays one.” She plays chess the way she does business: she doesn’t chase pieces, she only goes after the tempo. I take one of her pawns; she ignores it and pushes forward. “This move is the third of the month.” I take another; she pushes again. “This one’s the fifth.” The more I take, the more nervous I get. By “the ninth,” my king is boxed into a corner by her rook and knight, and the classmates watching don’t make a sound. She takes my coin and drops the pieces back into the box one by one. “You princes always play to take the other side’s king. All I think about is which day I make port.”"

[tracks.bond_nyai_gama.chapters.b1.choices.rematch_by_days]
text = "Tip the pieces out and ask for another game—this time I’ll play by the days too"
hint = "She’s just beaten you. Ask for another game now and she’ll only think you’re a sore loser."
reply = "She gives me a look and empties the box onto the board again. This time I call out days the way she does—“the second,” “the fourth”—faster than she does. The game runs a full two hours, and I scrape a win by a single pawn. She pushes both coins across to me. “You learn fast.” Packing up the pieces, she adds, “Next time I’ll play by the month.”"

[tracks.bond_nyai_gama.chapters.b1.choices.learn_her_way]
text = "Concede, and ask her what playing “by the days” means"
reply = "She talks about which month the pepper comes to market, which month the west wind turns east, how many days it takes from Banten to Malacca. When she’s finished, not one piece on the board has moved. I write her dates in a row along the edge of the board, and they line up with the game she just played. She tilts her head and reads the row. “Then you won’t be too stupid at business.”"

[tracks.bond_nyai_gama.chapters.b2]
title = "The Date Her Uncle Set"
text = "A ship in from Banten brings a letter from Nyai Gama’s uncle. She carries it to the academy to find me, her face giving nothing away, spreads it out on my desk, and holds it flat with two fingers. The letter sets a date for her: next year she is to go home to Banten and be betrothed to the son of an old pepper merchant, and the day is already written in. “My father does what my uncle says. In things like this, my uncle does the talking.” Her voice is very even. “I want to set my own date.” I look down at the day in the letter. It falls early next year, in the month when the west wind blows hardest. Every ship in Gresik harbor will be running east then; anything bound for Banten won’t dare raise a sail. I look up, and she is watching me, waiting for me to speak first."

[tracks.bond_nyai_gama.chapters.b2.choices.no_ship_that_day]
text = "Lay her uncle’s date beside the sailing lists: does anything sail for Banten that month?"
hint = "She hasn’t decided whether an outsider should have a hand in her family’s marriage plans. She won’t spread that letter out for you to work on."
reply = "I borrow the sailing register from the harbor master and lay that month out day by day: a dozen ships bound east, not one bound for Banten. She copies the list and tucks it into her reply to her uncle. Two months later he writes back—the betrothal has been put off until “later.” She folds my draft and slips it into her ledger. “For once, the date you worked out beats a prince’s.”"

[tracks.bond_nyai_gama.chapters.b2.choices.sit_with_her]
text = "Work nothing out—just sit with her on the dock until she knows what to write back"
reply = "We sit on a dock piling until dark. She borrows my pen and writes, crosses out, writes again, until her reply is down to a single line: “I have pepper to inspect that season. No time.” When it’s done she laughs first, and holds the paper up to the lamp to dry. “That line took me all afternoon.”"

[tracks.bond_nyai_gama.chapters.a1]
title = "The Letter She Never Sent"
text = "On a rainy afternoon the academy roof starts leaking, and everyone shifts their books to the dry spots. When Nyai Gama moves her schoolbook, a letter slides out of it and lands at my feet. She doesn’t snatch it back. She bends, picks it up, holds it a moment, and hands it to me. It’s addressed to a Gujarati shipowner, offering to buy the old ship he keeps moored off Banten—price, delivery date, who pays for the repairs, every term set out in order. It is signed “Nyai Gama,” not with her father’s name. The edges of the paper have gone yellow. “I wrote it more than a year ago,” she says. “I’ve never sent it.” I ask why. She uses the schoolbook to dam a puddle of rain on the windowsill. “No woman in Banten buys a ship in her own name. I’m afraid if I send it, they’ll laugh.”"

[tracks.bond_nyai_gama.chapters.a1.choices.carry_it]
text = "Offer to carry the letter on my family’s kora-kora and deliver it the day she says yes"
hint = "She’ll let you look at the letter, but trusting you to carry it off is another matter. You aren’t that close yet."
reply = "She folds the letter and hands it to me, lets go, then takes it back, smooths the creases, and hands it over again. Three times, until the folded corners have gone fuzzy. In the end she presses it into my palm. “You hold on to it. When I’ve saved enough, I’ll say yes myself.”"

[tracks.bond_nyai_gama.chapters.a1.choices.what_ship]
text = "Ask her what kind of ship she wants"
reply = "“Not a big one.” She slips the letter back into the schoolbook and holds her hands apart to show me. “Two hundred piculs of pepper is enough. First, it has to be sound. Second, the day it sails is mine to set.” On “mine to set” her voice comes out louder than usual, and a classmate dozing at the next desk lifts his head. She glares at him and presses the book shut."

[tracks.bond_nyai_gama.chapters.a2]
title = "A Basket for Letters"
text = "Mats are laid out to dry all along the waterfront in the east-wind season. Nyai Gama walks over and sets a little basket on my chessboard, right on top of two pawns. It’s woven from palm leaf, small, just big enough for a few folded letters, and the handle is woven double, stiff when you squeeze it. For days she’s been sitting on the steps behind the lecture hall weaving something, pulling it apart whenever it went wrong. “It took a month,” she says. “A basket for letters can’t have a handle that breaks.” She taps the rim with a knuckle. “From now on, when you write, put the day you make port first.” I pick it up and give it a shake. The handle doesn’t make a sound, and the bottom still smells of sun-dried leaves. She turns to go, then looks back. “And not a prince’s date.”"

[tracks.bond_nyai_gama.chapters.a2.choices.take_basket]
text = "Take the basket, and ask her to copy out her ship letter and put it inside, so I keep a copy for her"
hint = "She spent a month on this basket. Taking it, and her letter with it—you aren’t that close yet."
reply = "She looks at me for a while, then goes to beg a sheet of paper from our teacher and copies the letter out from beginning to end, signing her name stroke by careful stroke. Folded, the copy lies in the basket, a perfect fit. She stares at it a long time. “Then this basket is my first ship.” That evening she buys me a meal at a stall by the docks. She pays, and never once opens the ledger."
effects = [{}, {}, {}, { title = "A Basket for Letters" }]

[tracks.bond_nyai_gama.chapters.a2.choices.pay_in_cloves]
text = "Offer her a pound of cloves for it"
reply = "“Two pounds,” she says at once. “The handle’s woven double.” I point out the bottom is only woven single; she says the bottom isn’t the handle. We haggle from early afternoon until the sun drops into the sea and settle at a pound and a half of cloves, plus one game of chess, loser fetches the coconut water. She wins the game. I carry the coconuts back."

[tracks.bond_nyai_gama.chapters.s]
title = "Two Sailing Schedules"
text = "In December the academy calls the roll for the last time. Come spring I go home to Ternate and she goes home to Banten, our ships sailing opposite ways. Crates wait on the dock for loading, and Nyai Gama spreads two sailing schedules over a lid, weighing down the corners with a pair of steelyard weights. One is for my family’s kora-koras, the other for her family’s pepper boats. She runs a finger down both lists while the porters hurry her twice; she doesn’t look up. At one place her finger stops: there is one month next year when both lists put a ship in Banten. She scores a line through that month with her fingernail, so hard the paper frays. “That month, if your ship makes Banten,” she says, “I’ll treat you to tea.” I ask what kind of tea. “Get there and find out.”"

[tracks.bond_nyai_gama.chapters.s.choices.promise]
text = "Agree to write to her every year with next season’s sailing dates first"
hint = "A promise like this can be made only once in a life: either you two haven’t come that far yet, or you’ve already said these words to someone else."
reply = "“Get one day wrong and it’s a pound of cloves.” She says it fast, as if she’d had it ready. I say she has to write too, then. “I never get it wrong.” She tears a corner off the schedule and makes me write next year’s first entry on the spot: which month I leave Ternate, when I pass Ambon, when I reach Banten. I write a line, she reads a line, and at the third she reaches over and changes “fifteenth” to “eighteenth.” “You forgot you lay over three days in Ambon.” I concede. She files my scrap in her ledger, tears out a piece of ledger the same size, writes her family’s pepper-boat dates on it, and hands it to me. Square, upright letters, not a single correction. “One letter a year. Dates first, everything else after.” By the time I’ve put the paper away she’s gone to watch the porters load, and she calls over three crates, “And make them good cloves!”"
effects = [{}, {}, { title = "Two Sailing Schedules" }, {}, {}]

[tracks.bond_nyai_gama.chapters.s.choices.own]
text = "Agree that the day she buys her first ship, my ship sails to Banten to escort her first cargo"
reply = "She looks at me for a long moment without speaking, turning a steelyard weight over twice in her hand. “That could take years.” I tell her I can wait. She looks down at the two schedules again, and this time she doesn’t hunt for a month where they match. She just lays one on the other, folds them in half, folds them again, and pushes them into my hand. “First, the ship is mine, the cargo is mine, and the price is mine to name,” she says. “Second, you escort the cargo, and you don’t haggle on my behalf.” I say all right. She doesn’t name a year, or even a month; for once she isn’t counting days. She only says, “Then don’t be late.” She opens the ledger and adds a line on the last page: “Kaicili, escort for the first cargo.” Closing the book, she adds, “Late goes in the ledger too.”"

[tracks.reunion_nyai_gama]
name = "Nyai Gama: She Sets the Price"

[tracks.reunion_nyai_gama.chapters.reunion]
title = "She Sets the Price"
text = "Six years later my ship puts in at Banten. The pepper market here is bigger than Gresik’s, the scales are bigger, and the noise is bigger still. Moored at the waterfront is a modest ship riding high in the water; by my eye she’ll carry two hundred piculs of pepper. On her bow, in Jawi letters, is a name: Nyai Gama. The woman herself sits at a stall beside the ship setting prices. A buyer says a word, she answers with a figure, and she gives up nothing. Someone nearby mentions that Fujian merchant named Huang—a month late again this year. “I’ll give him one more month,” she says without looking up. “The last month.” She hangs the weight on the beam, and only then does she see me. Her ledger is still open on her knee, and the first thing she asks is, “So what day did you make port this time?”"

[tracks.reunion_nyai_gama.chapters.reunion.default]
effects = [{ text = "Kaicili— You didn’t come. First, no cloves owed this time: the east wind came late this year, every ship sailing west was behind, and in my ledger the debt is the wind’s. Second, my sailing dates are below; adjust yours to match. You haven’t seen my ship. She isn’t big, she carries two hundred piculs, and my name is on her bow. The day I bought her, the Gujarati who sold her asked where my father was. I said he was at home, and the ship was mine. He looked at me a long while, then took the money. My hand didn’t shake when I signed. It shook all night after I got home. This year she made two runs to Malacca and one to Palembang, and she wasn’t a day late on any of them. Pepper is up sixty cash a picul this year; if your cloves are still at last year’s price, put me down for thirty piculs, and we’ll argue the price when we meet. Next season: out of Banten ten days after the east wind sets in, twenty days to Malacca, and I wait out the season there; the moment the west wind comes I head back, calling at Gresik for eight days, around December. If you’re anywhere near, write first and say which day you’ll arrive. Don’t leave me waiting a month on the dock for nothing. That month I scored through on the crate lid, all those years ago—it still has its line in my ledger. —Nyai Gama, at Banten" }, {}]

[tracks.reunion_nyai_gama.chapters.reunion.choices.friend]
text = "Finish the business first, then sit down aboard her ship for that cup of tea"
reply = "I name my price for cloves, she names hers for pepper, and both of us smile and neither of us budges. We haggle from noon until the sun is well down; I give a tenth on the cloves, she gives not one copper on the pepper. With the deal struck, she closes the ledger and takes me aboard her ship. The cabin is narrow: a low table, a brass kettle. The tea is something she traded off a Chinese junk, and it pours very clear. I take a sip and ask what it costs a pound. “Not for sale.” She tops up my cup. “Business is business, and tea is tea.” I tell her that the month she scored through on that schedule, my ship didn’t make it. She says she knows. She waited on the dock to the end of that month and drank the tea herself. “This year’s cup,” she says, nudging it toward me, “we’ll call you making up for it.”"
effects = [{}, {}, {}, { title = "She Sets the Price" }]

[tracks.reunion_nyai_gama.chapters.reunion.choices.escort]
text = "This season, let my ship escort her first cargo to Malacca"
reply = "Her ship goes first and mine follows, north from Banten, hugging the coast of Sumatra. Every evening she brings her ship alongside and calls across the rail to ask how far we made that day, and writes it in her ledger. The day we pass through the Bangka Strait a thick fog comes down, and I have my men beat a gong all night; her ship follows the sound and never so much as grazes an oar on the reef. On the morning of the twentieth day the walls of Malacca rise out of the sea—on exactly the day written in her ledger, not a day off. At the unloading, the customs man tries to charge extra by the size of the ship. She opens the ledger and goes through it with him line by line until he has nothing left to say. Then she stands on the quay watching her pepper go over the scales sack by sack, and turns to me. “A prince’s date—no discount this time.”"
effects = [{}, {}, {}, { title = "She Sets the Price" }]
