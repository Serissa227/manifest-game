# 达昂：风不认得王子（bond_daeng / reunion_daeng）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Daeng、Kaicili、Raja Muda、Gresik、Giri、Makassar、Ternate、Johor、Banten、the Moluccas。

[tracks.bond_daeng]
name = "Daeng: The Wind Knows No Princes"

[tracks.bond_daeng.chapters.c1]
title = "The Wind Knows No Princes"
text = "A Bugis boat is tied up below the Gresik quay, and the owner has hired students from Giri to help load her. On deck stands a boy half a head taller than me, barefoot, a coil of rope around his waist. The owner calls him “Daeng” the way you’d call for one of your own oars. He doesn’t ask whose family any of us belong to. The first thing out of his mouth is: “Who can tie a knot?” I put my hand up and add, “The Prince of Ternate can. Does that count?” A few of the others laugh. He doesn’t. He tosses me a length of coir rope. “The wind doesn’t know princes. Tie me a sail hitch.” I tie it. He takes it, gives one pull, and the knot slides half undone. Without a word he unpicks it, lays it flat on the planks, and ties it again for me, turn by turn. When he comes to the bit that traps the loose end, his hands slow down and hold there, waiting for my eyes to catch up, before he pulls it tight. “You crossed this one the wrong way,” he says. “A knot that slips the harder you pull is worse than no knot at sea.” He puts the rope back in my hand."
news = "That Bugis boat at the Gresik quay hired Giri students to load cargo. The Bugis boy aboard her never asks whose family you’re from, only whether you can tie a knot. They say a prince got one wrong and had it picked apart in front of everyone."

[tracks.bond_daeng.chapters.c1.choices.learn_knot]
text = "Ask him to show me again, and keep tying until he can’t pull it loose."
reply = "I tie it five times. The first four, one pull from him and it comes apart; he hands me back the end without a word. The fifth time he grips the rope in both fists and hauls, and the knot doesn’t give. He nods. “You can come aboard.” I ask whose boat. He stamps a heel on the deck. “This one, for now.” A pause. “When I have my own, we’ll see.”"

[tracks.bond_daeng.chapters.c1.choices.pantun_back]
text = "Answer him the pantun way, in four lines."
reply = "I clear my throat and give it to him in the tune they use for verse-swapping at the Giri market: “The wind won’t know a prince, the waves won’t know a bow; tie a knot loose and it slips—the rope knows the hand, though.” The others drum on the gunwale. Daeng stares for a moment, then laughs out loud. It’s the first time I’ve heard him laugh. “Last line’s all right. First two are noise.” I tell him the first two lines of a pantun are only there for the rhyme. He tosses the rope into my lap. “Then put your rhyming time into knots.”"

[tracks.bond_daeng.chapters.c2]
title = "Which Plank Is Loose"
text = "The Bugis boat goes up on the slip. The owner says a few of her bottom planks have worked loose, but he can’t say which. Daeng lines a handful of us students up along the hull, eyes shut, and has us tap our way down with mallets. “A loose plank sounds empty,” he says. “Like knocking on a jar with no water in it.” All I can hear is noise: the mallets, the gulls, the betel seller hollering on the bank, all of it stirred together. Daeng works his way down from the bow, stops at the seventh plank, and lays his hand on it. “This one. You find the next.” I tap all afternoon until my palms buzz, and at last I hear a dull, hollow knock. When I open my eyes he has already added a line to the repair list—and the name he’s written is mine. An old hand from the crew leans over. “You found the first one yourself. Why not put your own name down?” Daeng doesn’t look up. “Whoever finds it gets it written.” He folds the list and tucks it into the coil of rope at his waist."
news = "Down at the Gresik slipway, a hand off a Bugis boat has Giri students tapping planks blindfolded to find the loose ones. Every name on the repair list belongs to a student. Not one is his."

[tracks.bond_daeng.chapters.c2.choices.hear_hull]
text = "Shut my eyes and sound the whole hull, stem to stern."
hint = "He says new hands don’t go knocking all over a boat—you don’t know each other well enough for him to let you sound her end to end."
reply = "I work from bow to stern, and as it’s getting dark I find a third one, right under the rudder. Daeng crouches and knocks on it twice, then looks back at me. “The owner didn’t know about this one himself.” He unfolds the list again and writes my name a second time beneath the first. He writes in Javanese letters, one stroke at a time, slowly, as if a mistake would mean picking the whole thing apart and starting over."

[tracks.bond_daeng.chapters.c2.choices.chess_bet]
text = "Play him a game of chess for who patches the plank."
reply = "I take out the little wooden board I always carry and set it up right on the planking. I win. Daeng doesn’t say a thing; he shoulders the timber and goes to patch it. When he comes back, wood shavings still on the backs of his hands, he says, “Another game.” He wins the second. He looks at the board, then over at the fresh plank. “It’s already patched. That one was for nothing.”"

[tracks.bond_daeng.chapters.b1]
title = "The Last Bend"
text = "In autumn there’s a small-boat race at the Gresik river mouth, one Giri student to a boat. Daeng and I draw opposite ends of the line. All the way down I’m on his stern. At the last bend the wind comes slanting off the shore; I take in my sail too late, the boat heels, and water slops over the gunwale. By the time I have her upright again he’s already past the bamboo pole with the flag. People on the bank are shouting his name. He doesn’t raise a hand or look back at the flag. He brings his bow around, paddles back, and stops alongside me. “Take the last bend again.” “The places are already decided.” “Forget places.” He points at my sail. “Just watch when you take it in.” His own sail is still full, stretched tight by the wind, the patch at the corner darker than the rest. He leaves it like that, filled, and waits while I work my boat back to the mouth of the bend."
news = "Daeng the Bugis boy took first place in the autumn boat race at the Gresik river mouth. He never collected his prize. He turned straight around and went back to the last bend to run it again with the boy who lost."

[tracks.bond_daeng.chapters.b1.choices.walk_bend]
text = "Run the last bend with him three more times."
reply = "The first time I’m late again. The second I get it right. The third I panic and take the sail in too early, and the boat crawls through the bend as if she’s drifting. Daeng’s boat waits beside mine. “Early is better than late. Early, you’re only slow. Late, you go over.” On the way back to shore he raps the gunwale with his knuckles: once, twice, and on the third he stops. “That one. Take it in.” I rap along with him the whole way in."

[tracks.bond_daeng.chapters.b1.choices.raise_his_hand]
text = "Wait for him at the landing and hold his arm up for everyone."
reply = "The moment he sets foot on the gangplank I grab his wrist and lift it over his head. The bank erupts. Daeng tries to pull free and can’t; he goes red from his ears down to his neck. Not until we’re back on board does he mutter, “Don’t do that again.” But he unties the sheet he used that day, coils it, and throws it to me. “The one that won. Keep it, and remember when to haul in.”"

[tracks.bond_daeng.chapters.b2]
title = "Money for His Own Boat"
text = "Early in the year a boat owner in Gresik comes looking for Daeng. He’ll put up the money to build him a boat, on one condition: for ten years Daeng sails one route for him and no other, Gresik to Makassar and back, carrying rice and cloth. Daeng doesn’t say yes. He doesn’t say no either. That evening he takes me to the timber yard by the river, all the way to a pile at the very back, and crouches to push aside the palm fronds covering it. Every log underneath has a mark cut into it, some deep, some shallow, as if they’d been carved more than once. “Keel,” he says, his hand on the longest. “Ribs, both sides. These are for planking.” He counts them off one by one, pressing his thumb into each mark as he goes. “Enough for a small boat. I’m half the money short.” From the coil of rope at his waist he pulls a sheet of paper folded soft with handling, the boat owner’s contract, and holds it out to me without letting go. “You read faster than I do. Tell me which parts to look at. Don’t tell me whether to sign.”"
news = "A boat owner in Gresik is putting it about that he’ll stake Daeng the Bugis sailor to a boat of his own, so long as Daeng runs nothing but Gresik to Makassar for ten years. The whole quay is betting on whether he signs."

[tracks.bond_daeng.chapters.b2.choices.read_contract]
text = "Go through the contract with him line by line, and see what follows “ten years.”"
hint = "He keeps the contract clenched tight—that kind of paper, he won’t spread out in front of you yet."
reply = "We borrow the watchman’s oil lamp and go through it clause by clause. On the line that says “ten years” there’s a tail of small writing: “At term’s end, renewal at the owner’s discretion.” Daeng has me read it again, then reads it twice more himself, and his face slowly closes. “Then it isn’t ten years. It’s a lifetime.” The next day he folds the contract back the way it came and returns it. When he gets back he crouches by the pile of logs and lays the palm fronds over them again. “The timber can wait. I’ll earn the money myself.”"

[tracks.bond_daeng.chapters.b2.choices.offer_loan]
text = "Tell him I’ll put up the other half, no interest."
reply = "Daeng shakes his head, short and certain. “A prince’s money is still a debt.” I start to say this has nothing to do with princes—he lifts a hand to stop me and tucks the contract back into his rope coil. It’s a long while before he speaks again. “That you said it, I won’t forget.” He draws the small knife at his belt and cuts one more mark into the tail of the keel log, shallower than all the others. “That one’s yours.”"

[tracks.bond_daeng.chapters.a1]
title = "The Moment He Gave Me the Tiller"
text = "One still evening that spring, we take the boat out from the river mouth. Halfway along, Daeng pushes the tiller over to me and steps back, an arm’s length away. “You say where; I say how.” He folds his arms. “Today it’s the other way around. You say how.” He lays out, one by one, when I should call him: if the corner of the sail starts to shiver, call him; if the bow falls off downwind and two pulls won’t bring her back, call him; if the water turns cloudy and there’s sand showing underneath, call him. “Any other time, don’t.” The low sun has turned the water at the river mouth to gold, and it laps up the bank in slow layers. The tiller has been in his hands for two years; the grip is worn to a shine and still warm from his palm. I take hold, and the boat eases a little to the right. He doesn’t move. All he says is, “Feel that? She’s asking you.”"
news = "Most evenings now a little boat comes slowly into the Gresik river mouth with the student from Ternate at the tiller, while Daeng the Bugis sailor stands to one side with his arms folded and never says a word."

[tracks.bond_daeng.chapters.a1.choices.steer_alone]
text = "Ask him to turn his back and let me bring her in alone."
reply = "Daeng really does turn around. He sits in the bow with his back to me, watching the lights on shore. I never call him. Coming up to the berth I put the helm over too late, and she scrapes in sideways against a piling, half a hull off true. He doesn’t turn around. He braces a hand on the post, pushes her straight, makes the line fast, and only then says, “Next time, turn half a breath sooner.”"

[tracks.bond_daeng.chapters.a1.choices.his_hand]
text = "His hand closes over mine to show me the turn, and I don’t pull away."
hint = "He wouldn’t stand that close yet—you don’t know each other well enough."
reply = "At the bend he comes back and lays his palm over the back of my hand, pressing half an inch to the left. “Like this.” The bend is behind us and his hand stays where it is, all the way in, until the line is looped over the piling. Then he lets go. He says, “Good wind today.” I say, “Yes.” Neither of us says anything more. We make the boat fast and part at the quay. Early the next morning he’s calling me aboard from beside the boat, same as always."

[tracks.bond_daeng.chapters.a2]
title = "The Wind Cord"
text = "The southeast wind has blown all summer. One day after lessons Daeng stops me on the quay and opens his hand: a thin cord, thinner than my little finger, two strands of palm fiber twisted together, one yellowish, one gone gray with age. “Tie it at the masthead and it streams whichever way the wind goes,” he says. “Even a boat with no pennant can read the wind.” I know the gray strand. It’s the sheet they took off my boat after the race the autumn before last. I left it in a corner of the boatyard and figured someone had burned it for kindling long ago. “One strand’s mine.” He parts them a little to show me, then twists them back together. “One’s yours.” He winds the cord twice around his finger and lets it go again. “Whatever boat you end up on, tie this on and you’ll know where the wind’s coming from.”"
news = "People at the Gresik quay say Daeng the Bugis sailor has spent all summer braiding one thin cord, braiding it, unpicking it, braiding it again. Ask him what it’s for and he only says, for the wind."

[tracks.bond_daeng.chapters.a2.choices.tie_mast]
text = "Climb the mast of the little boat I usually sail and tie it at the top."
hint = "He keeps the cord wound around his finger and makes no move to hand it over—you don’t know each other well enough yet."
reply = "I climb to the masthead and tie it fast with the knot he taught me. The wind catches it and the end streams out to the northeast. Daeng watches from below, head tipped back. “Monsoon’s about to turn.” A while later: “Knot’s right, too.” He stands there watching the cord twist in the wind until I’ve climbed back down, and then says, “When my boat’s built, I’ll tie one on too.”"
effects = [{}, {}, {}, { title = "The Wind Cord" }]

[tracks.bond_daeng.chapters.a2.choices.tie_wrist]
text = "Hold out my wrist and let him tie it on me."
hint = "Hold out your hand now and he’ll only go hang it on a mast—you haven’t come that far yet."
reply = "He hesitates, then bends his head and starts to tie. He goes slowly: a turn, a press, and as he makes the knot his thumb rests a moment on the inside of my wrist before he hooks a finger under the cord to test how tight it is. I say it would be more use on a mast. He doesn’t look up. “You’re not a mast.” Then he bites off the spare end and spits it into the sea."
effects = [{}, {}, {}, {}, { title = "The Wind Cord" }]

[tracks.bond_daeng.chapters.a2.choices.ask_money]
text = "Ask him how much he’s still short for the timber."
reply = "He names a figure, a third less than what he told me in the timber yard last year. “Two more seasons and I’ll have it.” I say I’ll work out which two seasons have the best winds for him, and which ports are the cheapest to load in. He tucks the thin cord back into the coil at his waist. “You work it out. I’ll sail it.”"

[tracks.bond_daeng.chapters.s]
title = "Save a Place at the River Mouth"
text = "In December, lessons at Giri break up. In a few days there’s a boat going to Ternate, and I’m on it. Daeng is off to Makassar: more boats there, and cheaper timber. That pile of marked logs, he says, he’ll find someone to ship over with him. On the last evening we sit on the stone breakwater at the river mouth. Below our feet the ebb has bared the mudflats, and fiddler crabs scuttle about waving one giant claw apiece. He hefts the little cloth purse where he keeps his savings, then tucks it back into his waist. “In Makassar I’ll sail for other people for two years,” he says. “Then I build.” I ask where he’ll take her when she’s built. He looks out at the sea and doesn’t answer that. After a while he says, “You’re going back to Ternate. All those berths at the river mouth—” He turns to me. “Keep a place for me at the river mouth. I’ll come.” The tide has turned and is creeping back over the crab holes, little by little. He’s waiting for my answer."
news = "Lessons at Giri are over. On the stone breakwater at the Gresik river mouth, Daeng the Bugis sailor and his classmate from Ternate sat until the tide came in. Word is he leaves for Makassar in a few days."

[tracks.bond_daeng.chapters.s.default]
news = "The week Giri let out, a Bugis sailor sat on the breakwater at the Gresik river mouth every evening, waiting for a classmate who never came. Then he took ship for Makassar."

[tracks.bond_daeng.chapters.s.choices.promise]
text = "Tell him yes: there’ll be a berth for his boat at the Ternate river mouth."
hint = "A berth like that is kept only for someone you’ve come all the way with, or else your one promise of a lifetime already belongs to someone else. This time you can only watch his boat go from the shore."
reply = "I tell him I’ll keep a berth for him, the best one at the Ternate river mouth. Daeng shakes his head. “Upwind. I don’t tie up downwind.” I tell him the upwind berths are where the royal boats go. “All the better.” He says it with a straight face, the way he’d haggle over the price of timber. I laugh out loud and hold up my palm. He looks at it, then holds up his own and claps it against mine. His palm is all callus, rope-cut, ridge after ridge, hard as planking. He doesn’t take his hand back right away; he turns mine over and looks at it. “You’ve got some too.” I look down. Two years of knots have left a thin layer of it. The tide has reached the foot of the breakwater. He gets up and slaps the mud off his trousers. “Upwind. Don’t forget.”"
effects = [{}, {}, {}, {}, {}, { title = "Save a Place at the River Mouth" }, {}]

[tracks.bond_daeng.chapters.s.choices.heart]
text = "Tell him it isn’t only a berth I want to keep for him."
hint = "The tide covers the crab holes and the words still haven’t come. You two haven’t come that far yet, or your one promise of a lifetime is already someone else’s."
reply = "The moment it’s out, I freeze. Daeng doesn’t move either. He looks at me for a long time, long enough for a fiddler crab to walk past his foot and back into its hole. “I know,” he says. He reaches over and takes my hand and holds it hard, hard enough that his knuckles go pale. His palm is hot. The tide climbs over the foot of the breakwater and soaks our feet; he doesn’t move, and neither do I. “The day the boat’s built, I come to Ternate first,” he says. “Everything else waits until that day.” “And when is that?” “I don’t know.” At last he smiles a little. “So you’ll have to wait.” He doesn’t let go until it’s fully dark. All the way back to the school he walks on my seaward side, between me and the wind off the sea."
effects = [{}, {}, {}, {}, {}, { title = "Save a Place at the River Mouth" }, {}]

[tracks.bond_daeng.chapters.s.choices.own]
text = "Agree that once we each have a boat of our own, we’ll race at sea."
reply = "Something lights up in Daeng’s eyes. “Which stretch?” I say Makassar to Ternate, fair wind or foul. “Loser buys the palm wine.” He thinks about it and adds, “A whole jar.” I say it’s a deal, and ask what happens if we come in together. He shakes his head. “We won’t. The wind always takes a side.” He looks up at the bamboo pole at the river mouth where the lantern hangs; the strip of cloth on it is streaming north. “When the day comes, we’ll see whose side it’s on.” Before we go he tests my knots one more time. When I’m done he gives a tug and nods. “Out at sea, don’t make me look bad.” I tell him the same goes for him: don’t lose to a prince. He snorts, which I take as a yes."
effects = [{}, {}, {}, { title = "Save a Place at the River Mouth" }, {}]

[tracks.reunion_daeng]
name = "Daeng: A Boat of His Own"

[tracks.reunion_daeng.chapters.reunion]
title = "A Boat of His Own"
text = "Makassar harbor is so crowded the masts stand like a forest. Daeng’s boat is moored in the outermost row: not big, single-masted, her stern swept up high, the new paint not yet bleached by the sea. At the masthead flies a thin wind cord, two strands twisted into one, so faded you can’t tell whose strand is whose. When he sees me he doesn’t call out. He turns and goes below first, and comes back with a bowl of water. “Drink, then come aboard.” Only when I’ve finished does he reach down and pull me up. He walks me from bow to stern, and every line has a story: this one he got in Gresik for three days’ work, that one a Malay captain lost to him on a bet. Amidships he crouches and slaps the stretch of keel that shows. The marks are still there; even the shallowest one still shows. “Nine years,” he says. “Not one log swapped out.” He stands and glances out at my ship, anchored beyond the harbor. “That one of yours—who has the tiller these days?”"
news = "Daeng the Bugis shipmaster’s new single-master lies in the outermost row at Makassar. This year a captain from far off came aboard and looked her over, from stem to stern."

[tracks.reunion_daeng.chapters.reunion.default]
news = "A new single-masted Bugis boat has gone in the water at Makassar. Her master, Daeng, sent a palm leaf east on a passing boat. Folks on the quay say it’s asking after a berth."
effects = [{ text = "She’s built. Single mast; the keel is the same log from Gresik, and I didn’t plane off a single mark. The wind cord is tied at the masthead. These days it streams east, toward you. The berth upwind—are you still keeping it? —Daeng (cut into a palm leaf, sent with a Bugis boat going east)" }, {}]

[tracks.reunion_daeng.chapters.reunion.choices.sail_together]
text = "Sail in company with his boat on a run to the Moluccas."
reply = "We load rice and cloth in Makassar and head east together. His boat is lighter than mine; with a fair wind she pulls a few hundred yards ahead before he notices. But every evening he drops his sail and waits for my ship to come up, and our two lanterns face each other across a stretch of water. On the fifth day it rains, and through the rain I hear him over there calling a Bugis rowing chant until every oar on his boat pulls together. On the ninth day the volcano of Ternate comes up. Going into the river mouth, his boat heads straight for the upwind row and slips in among the big royal boats. The harbor guard comes running out, shouting. “Ask him.” Daeng stands in the bow and points at me. “He’s the prince here.” It’s the first time I don’t mind the word. That night we split a jar of palm wine on the quay, and he says his next run is to Banten. Am I coming?"
effects = [{}, {}, {}, { title = "A Boat of His Own" }]

[tracks.reunion_daeng.chapters.reunion.choices.race_him]
text = "Challenge him right there to a race, Makassar to Gresik."
reply = "He doesn’t even put down the water bowl. “Now?” We clear the harbor the next morning before dawn. For two days I keep right on his heels; on the third, past a stretch of shoals, he cuts into a channel I didn’t know was there, and after that all I can see is his sail. It’s nearly evening by the time I make Gresik. He’s sitting on the quay with a jar of palm wine at his feet, a good part of it already gone. When he sees me he pushes the other bowl across, filled to the brim. “Half a day,” he says. “The wind took my side. Next time, maybe not.” I sit down and drink and ask who showed him that channel. He thinks about it. “Beat me next time and I’ll tell you.” Not far off is the river mouth where we raced as boys. The tide is coming back in, and the last bend is right where it always was."
effects = [{}, {}, {}, { title = "A Boat of His Own" }]

[tracks.reunion_daeng.chapters.reunion.choices.stay_aboard]
text = "Stay aboard his boat that night and finish what I started at the river mouth."
hint = "Back at the river mouth you never got that far; today, those words can only stay unspoken."
reply = "During the night the harbor lights go out one by one. We sit in the stern with our feet over the side, water lapping at the planks. I finish what I didn’t finish at the river mouth nine years ago. I say it badly, clumsier than any pantun I ever recited at Giri. Daeng listens and doesn’t interrupt. When I’m done, he says, “Nine years I’ve waited to hear that.” He looks down at the water. “Truth is, I heard it that day.” “Then why make me wait?” “The boat wasn’t built,” he says. “I told you, the day she was built I’d come to Ternate first. And then you came here instead.” His shoulder leans in against mine and stays there. Past midnight the wind works around from east to north, and the cord at the masthead swings slowly after it. We sit there until it’s light and watch it stream south in the dawn."
effects = [{}, {}, {}, { title = "A Boat of His Own" }]

[tracks.reunion_daeng.chapters.reunion.variants.with_raja_muda]
text = "Makassar harbor is so crowded the masts stand like a forest. Daeng’s boat is moored in the outermost row: not big, single-masted, her stern swept up high, the new paint not yet bleached by the sea. At the masthead flies a thin wind cord, two strands twisted into one, so faded you can’t tell whose strand is whose. When he sees me he doesn’t call out. He turns and goes below first, and comes back with a bowl of water. “Drink, then come aboard.” He walks me from bow to stern, and every line has a story. Amidships he slaps the keel; the marks are still there. “Nine years. Not one log swapped out.” Under the tiller lies a letter, sealed with Johor wax. He sees me looking and doesn’t hide it. “From Raja Muda.” A pause. “He’s the one by my side.” He nudges the letter a little further in and glances out at my ship, anchored beyond the harbor. “That one of yours—who has the tiller these days?”"
