# C7 重写（2026-10-12，Claude Opus）：stories/bonds/bond_selim_kereste.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 的 take_spoon / trace_the_grain 第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个、重逢三个落点的第 4 个是 memory；重逢 default 的第 1 个效果是 letter。
# 口头禅英文照人物卡作 “Go with the grain. Don’t force the split.”，只在 c1 原样出现一次。

[tracks.bond_selim_kereste]
name = "Selim Kereste: Where the Curved Timber Came From"

[tracks.bond_selim_kereste.chapters.c1]
title = "Where the Curved Timber Came From"
text = "The galley due to launch in spring was still short a few knees, and the overseer sent me to the timber yard to pick out curved wood. Crouched by the stack was Selim, the timber-yard apprentice who shared my bench at the academy, wiping mud off a curved log with a rag. I slapped the log. “What are you polishing it for? It’s just oak.” He didn’t look up. He laid his palm on it and ran it slowly from the thick end to the thin, like a tailor taking a measurement. “It’s from Sinop,” he said. “Cut in winter. Whoever cut it was in a hurry, and the first stroke of the ax went wide. There’s a scar in the third ring.” I didn’t believe a word. Nobody can feel a log and tell you which mountain it grew on. A brand tag was nailed to the stack, black with smoke, and I flipped it over. Two marks were burned into it: Sinop. Midwinter. Selim took the tag out of my hand, hung it back on its nail, straightened it, and only then looked up at me. “Go with the grain. Don’t force the split.”"

[tracks.bond_selim_kereste.chapters.c1.choices.bet_a_mark]
text = "Refuse to give in. Bet him I’ll find the felling mark on the next log first."
reply = "He said fine and pointed to a log at the bottom of the stack. I turned it over end to end and spent the whole afternoon on it, and in the end I found an ants’ nest in a crack in the bark and called him over to look. Selim laughed so hard he sat down on the woodpile and couldn’t straighten up. When he was done laughing, he took my hand and pressed it against a flat spot near the root: the ax cut was slanted. The man who felled it had been standing downhill. “Next time,” he said, “feel first. Then flip.”"

[tracks.bond_selim_kereste.chapters.c1.choices.learn_rings]
text = "Ask him to teach me how to read the rings."
reply = "He found a sawn-off round of timber and tapped out the rings for me one by one with his fingernail: the wide ones were years with plenty of rain, the narrow ones were droughts. He went slowly. One ring could take him half an hour, and by the time the sun dropped behind the arsenal wall I could name a dozen or so. Near the heart there was a ring so thin you could barely see it, packed tight and dark. “Drought,” he said, pressing his nail into it. “People are the same. The drought years are where the rings sit tightest.”"

[tracks.bond_selim_kereste.chapters.c2]
title = "Behind the Sawpit"
text = "After work one evening I went back to the sawpit to look for a plane I had lost. There was nothing in the pit but sawdust, and no plane, but on the scrubby ground behind it was something new: a pile covered with a reed mat, bricks holding down the corners. I lifted one corner. Underneath, stacked neatly, was good timber, all of it. Grain a finger wide, no knots, no wormholes. None of the pieces was big, and you could tell they’d been saved off other cuts: the end of a knee here, the tail of a hull plank there, the saw marks still fresh. By the yard’s rules, offcuts like these went to the kitchen to be burned. “Don’t touch that.” Selim was standing behind me, his face gone dark enough to scare me. He yanked the mat back over the pile, tucked it tight, and set the bricks back on the corners one at a time. “What are you saving all this for?” He wouldn’t say. Only when the last brick was down did he speak, slower than usual. “I didn’t steal it. I saved it.”"

[tracks.bond_selim_kereste.chapters.c2.choices.cover_and_log]
text = "Help him weigh the mat down, then log it as scrap in the timber book, under my name."
hint = "He stood between you and the mat, watching you. He isn’t sure yet that you won’t run straight to the overseer, and he won’t let you near this wood."
reply = "My handwriting is crooked, and I hunched over the ledger a long time before “scrap, assorted” came out legible. I signed my name under it. Selim stood beside me and watched every stroke, right to the last one. “You’re not afraid of getting punished?” “Who wants scrap?” I shut the book. “The overseer can’t be bothered to look at this page himself.” He studied me for a long moment, and then at last he smiled. He went over, lifted a corner of the mat, and laid it back down. “Then from now on, part of this scrap is yours.”"

[tracks.bond_selim_kereste.chapters.c2.choices.ask_purpose]
text = "Ask once more what he’s saving it for. If he won’t say, let it go."
reply = "He still wouldn’t say. He just pushed me out of the pit. The next morning my plane was sitting on my bench, its blade honed so bright I could see my face in it. Under the plane lay a single shaving, thin enough to let the light through. I held it up to the window a long while before I recognized the grain: Sinop oak."

[tracks.bond_selim_kereste.chapters.b1]
title = "Replace the Whole Plank"
text = "A galley had to be ready to launch in spring, and when they flooded the hull to check for leaks, one seam in the bottom seeped. The overseer sent Selim and me under the hull together. “Have it sealed by tomorrow.” Selim knocked on the plank with a knuckle and tilted his head to listen. “Take the whole plank off and put on a new one.” “Why strip it?” I said. “Dig out the bad bit and set in a patch. Pulling a plank takes half a day, and you have to drive all the nails again.” “Water remembers where you patched.” “What does water remember?” We argued under that hull all afternoon, loud enough that the shipwrights leaned down to enjoy the show. In the end we each did it our own way. He pulled his half of the plank and planed and fitted it fresh; I dug the rot out of my half, set in a block of new wood, and hammered it in tight. The next day they flooded the hull again, with a ring of people standing underneath. His half didn’t let through a drop. Around my patch, a dark ring slowly spread, as if someone had drawn a circle on the wood with a wet finger."

[tracks.bond_selim_kereste.chapters.b1.choices.redo_your_half]
text = "Admit it, and ask him to teach me to replace my half too."
hint = "He just beat you, and there’s still a ring of onlookers under the hull. Ask him now and he’ll take it as mockery."
reply = "He didn’t laugh, and there wasn’t a trace of gloating on his face. He crouched, pried my patch out, and turned it over to show me: the new wood’s grain ran across, the old wood’s ran down, and the two met head-on. “Where you patch, the grain is broken. Water goes wherever it’s broken.” We pulled the plank, planed it, and fitted it until dark, him holding the lamp, me swinging the hammer. On the third day they flooded the hull again, and both halves stayed dry."

[tracks.bond_selim_kereste.chapters.b1.choices.defend_patch]
text = "Don’t admit it. Fast patching is a skill too. We’ll see next year."
reply = "“Next year that patch of yours will leak again.” Selim put his plane away in his bag. “Then you’ll remember.” I said fine, we’d wait for next year. The next spring that galley launched, made one voyage, and came back into the yard. The rest of her bottom was sound. Only around my patch had a ring of green weed grown. Selim didn’t say a word. He rapped twice on the ring with his knuckle, knock, knock. I remembered."

[tracks.bond_selim_kereste.chapters.b2]
title = "The Name He Would Not Sign"
text = "A new timber inspector came to the yard, with three rings on his right hand. He made one round of the stacks, picked out a load of prime oak meant for warships, and had it carried off to the back storehouse. Then he hauled in a load that was wet and full of knots, wrote it in the ledger, and said that was the same load. Everyone in the yard knew whose pocket the difference went into. The brand ledger lay open on a barrel, and the inspector had the yard apprentices sign one by one as witnesses. The first few signed and walked off with their heads down. When it was Selim’s turn, he picked up the pen, looked at the page, looked at the stacks, and set the pen down. “I know this timber,” he said. “The north slope at Kastamonu, came into the yard last midwinter. That isn’t the count.” The inspector laughed. “An apprentice? How many logs could you know?” Selim didn’t answer. His hand was clenched on the edge of the ledger, knuckles white, and the page under his fingers had crumpled into a crease."

[tracks.bond_selim_kereste.chapters.b2.choices.copy_brands]
text = "Help him copy down the brand of every log in that load, and take it to the steward tonight."
hint = "He pulled the ledger a little closer to himself and didn’t look at you. He isn’t ready to drag you into this mess."
reply = "After dark we slipped into the back storehouse with a lamp. He read, I copied: Kastamonu, north slope, midwinter. Kastamonu, north slope, midwinter… My writing is ugly, and I got three of them wrong. Each time he waited while I crossed it out and wrote it again, and never once hurried me. By cockcrow we had forty-one logs, not one missing. The steward came at first light and counted the storehouse against our list, and the inspector with the rings was transferred elsewhere that same day. At noon Selim bought me a bowl of bean soup. He held his own bowl in both hands, took a sip, paused. “This soup is better today than it’s ever been.”"

[tracks.bond_selim_kereste.chapters.b2.choices.sign_now_check_later]
text = "Tell him to sign for now and look into it later."
reply = "He gave me one look, didn’t sign, and walked away. The inspector swore and called the next boy. Half a month later, a ship built from that wet load cracked its keel on the slip before it ever touched water. The steward traced it back until he reached the inspector, and the man was taken away the same day. That evening Selim walked over from the far end of the stacks and stopped beside me. “See? Go with the—” He broke off halfway and laughed."

[tracks.bond_selim_kereste.chapters.a1]
title = "The Lifeboat"
text = "Once spring came, Selim finally took me to see where the wood had gone. It was an abandoned shed behind the sawpit, and the lock on its door was newer than the shed. He undid the lock and stepped aside to let me go in first. Not one piece of the wood was missing; it was stacked along the walls. In the middle of the floor lay a keel, wedged at both ends, and propped against the wall was a planed board with a little boat sketched on it in charcoal, a round-bellied thing, a column of numbers beside it. “When I was eight,” he said, “I watched a galley go down off the Marmara shore. It carried one boat. The officers got in first, and when it was full they rowed away. The oarsmen were chained to their benches. Not one of them made it in.” He wiped a layer of sawdust off the keel with his palm. “The arsenal builds a hundred big ships a year and won’t build one more little boat. So I’m building it myself.” Part of the roof had fallen in, and the evening sun came through the hole and fell right across the middle of the keel, lighting up the grain line by line."

[tracks.bond_selim_kereste.chapters.a1.choices.hold_the_keel]
text = "Go steady the keel, and tell him I’ll come help every day after work."
hint = "Your hand went halfway out and came back. This keel is his alone. It isn’t your place to put a hand on it yet."
reply = "I held one end of the keel, and he stretched the chalk line from the other end and snapped it. The line came out dead straight; the keel never moved. Selim watched my hands on the keel for a long while. “Your hands are steadier than the wood.” We didn’t say much else that day. He planed and I held, and the sunlight crept off the keel onto the wall and then off the wall altogether, until the shed was so dark the only thing you could see was the white of the shavings. I said we ought to head back. I said it, and didn’t move."

[tracks.bond_selim_kereste.chapters.a1.choices.keep_it_secret]
text = "Promise to guard the shed for him. If anyone asks, it’s where the scrap goes."
hint = "He kept the lock clenched in his fist and didn’t hand it over. He isn’t ready to trust you with this shed."
reply = "Someone asked the very next day. The overseer was passing, kicked the shed door, and asked what was locked in there. Rotten wood, I said, waiting to be split for the fire, and whoever opens it gets a handful of worms. The overseer decided it was bad luck and left. That night Selim put a key in my hand. He had bent it himself out of a piece of wire. “The day she goes in the water, you’re the first one aboard.” “Then I’d better learn to swim first.” He laughed out loud, hard enough to shake the dust off the keel."

[tracks.bond_selim_kereste.chapters.a1.choices.how_many_seats]
text = "Ask him how many people the boat will hold."
reply = "“Twelve,” he said. “Fifteen if they squeeze.” He didn’t look at me when he said it. He looked at the keel, and his lips moved a few times as if he were counting something. I didn’t ask what. After a while he picked up the charcoal from the corner and added three short strokes beside the boat on the board."

[tracks.bond_selim_kereste.chapters.a2]
title = "A Spoon from the Curved Timber"
text = "The day the lifeboat’s first knee went in, Selim got to the shed before I did. The knee had been sawn from a curved log, bent just right to sit snug against the keel, and he hadn’t thrown away a single offcut. That evening he pulled a wooden spoon out of his shirt and pushed it into my hand. It was small, the handle bent a little, and the grain ran down from the tip of the handle and curved all the way into the bowl without a single break. “I carved three before this one,” he said. “They all split. I didn’t follow the grain, and when I got to the bowl and pressed—crack.” He mimed it with his hand, then pulled the hand back. “This one follows the grain.” I scooped at the empty air with it. He stood beside me watching, wiping his hands on his apron over and over, as if the spoon were still in his hands and not finished yet."

[tracks.bond_selim_kereste.chapters.a2.choices.take_spoon]
text = "Accept the spoon, and call it the lifeboat’s first ration."
hint = "His hand stopped in midair with the spoon, then slowly drew back. It weighs too much for you to take from him yet."
reply = "“The first ration,” I said. “The lifeboat’s galley is open.” “Then you’ll have to eat twelve,” he said. “One for each seat.” “Then you’ll have to carve twelve.” “I’ll carve as many as you like,” he said, putting his knife away in his bag, “as long as you eat.” That day we shared a bowl of cold beans with that spoon, one mouthful for me, one for him, and he pushed the last spoonful over to me."
effects = [{ }, { }, { }, { title = "A Spoon from the Curved Timber" }]

[tracks.bond_selim_kereste.chapters.a2.choices.trace_the_grain]
text = "Accept the spoon, and run a finger down the grain from handle to bowl."
hint = "You meant to follow that grain all the way down, but your finger stopped on the handle. The two of you aren’t that close yet."
reply = "My finger started at the tip of the handle and followed the grain down, slowing at the bend, sliding into the bowl, and stopping. Selim watched my finger the whole way, and only when it stopped did he speak. “You read it better than I do.” I looked up at him, but he had already turned away and was rummaging through the pile of shavings, saying he had to find his plane. The plane was hanging on the wall right behind him."
effects = [{ }, { }, { }, { title = "A Spoon from the Curved Timber" }, { }]

[tracks.bond_selim_kereste.chapters.a2.choices.ask_broken_ones]
text = "Ask him where the three split ones went."
reply = "“Burned them,” he said, as if it were obvious. “That pot of bean soup we cooked in the shed last month? That’s what brought it to a boil. You had a second bowl.” I laughed so hard my hand slipped and the spoon nearly went into the sawpit. He caught it, didn’t give it back, and hung it on a nail in the wall. “You get this one the day the lifeboat goes in the water. So you don’t feed it to the fire too.”"

[tracks.bond_selim_kereste.chapters.s]
title = "Finish One Boat First"
text = "I had found a merchant ship at the docks that would sail for Alexandria in the spring, and I meant to learn the sea aboard her. Selim wasn’t leaving. He was staying at the arsenal to learn a big ship from keel to masthead, every job from start to finish. The lifeboat needed only the last few planks of her side. It was cold in the shed, and he breathed on his hands as he planed a side plank, the shavings curling down around my feet. “By the time you come back,” he said, “she ought to be in the water.” He nailed the planed board in place, then ran his plane a few strokes along the side near the stern and cut a shallow groove. It wasn’t long, just enough for one person to sit in with their back against the side. He wiped the sawdust out of it with his palm and gave it a pat. “This is your seat.”"

[tracks.bond_selim_kereste.chapters.s.choices.promise]
text = "Promise to come back the day she’s launched and be the first to sit in her."
hint = "You looked at that groove and your mouth opened and closed again. A promise that long needs more seasoning between you two than you have yet—or you’ve already made it to someone else, and this groove only fits one."
reply = "“The day she goes in the water,” I said, “I’ll come back and be the first one in.” Selim didn’t answer right away. He set the plane back in the groove and pushed it once, then again, the shavings fine as hair. The groove was a finger deeper. “There,” he said. “Now you have to come back. Otherwise it sits empty, and that looks bad.” “What if I’m late?” “Then you’re late.” He blew the shavings out of the groove. “A Sinop oak grows a hundred years before anyone cuts it. You think it minds if you take a few extra?” I sat in the groove to try it. My back fit snug against the side, but my legs wouldn’t straighten; I had to tuck them up. I told him he’d measured wrong. He said he hadn’t. He’d cut it to the way I curl up and doze on the academy bench. The day I left that spring, he came to the docks to see me off, still carrying the plane, as if the moment he turned around he’d go straight back to the shed and keep planing."
effects = [{ }, { }, { title = "Finish One Boat First" }, { }, { }, { }]

[tracks.bond_selim_kereste.chapters.s.choices.heart]
text = "Carve a mark beside the seat that only we know, and say I’ll tell him what it means when I’m grown."
hint = "The knife was already in your hand, but you couldn’t make the first cut. Maybe the two of you haven’t come that far. Maybe you’ve already carved a mark like this for someone else."
reply = "I borrowed his knife and carved a mark at the edge of the groove, small and lopsided. I couldn’t have told you myself what it looked like. “What’s that?” “I’ll tell you when I’m grown and come back.” Selim ran his thumb over the mark, along the cut and back again, for a long time. The only sound in the shed was the Golden Horn slapping against the slipway, wave after wave. “Then I’ll carve one beside it.” He took the knife back, turned so I couldn’t see, and carved fast. When he was done he covered it with his sleeve. “You can look when you’re back.” The day I boarded that spring, he came to the docks to see me off and didn’t say a word. Before they pulled in the gangplank, he suddenly caught my hand, squeezed it hard, and let go. Only once the ship was out of the Golden Horn did I open my hand. There were still a few grains of sawdust stuck to my palm, and I couldn’t bring myself to brush them off."
effects = [{ }, { }, { }, { }, { title = "Finish One Boat First" }, { }, { }]

[tracks.bond_selim_kereste.chapters.s.choices.own]
text = "Bet him on it: when we meet again, which of us will be running a slipway first?"
reply = "“You’ll be at sea. You can’t run a slipway.” Selim set his plane down on the side of the boat. “Then I’ll run a ship.” “A ship doesn’t count. A slipway is a slipway.” “What about captain? Does captain count?” He thought it over, decided he couldn’t let me have that, and couldn’t think of a comeback either, so he said, “Fine. We’ll see. You make captain, I make master of the slipway. Whoever gets there first wins.” “And the loser?” “The loser builds the winner a boat.” “A lifeboat counts as a boat.” “A lifeboat counts.” He held his palm out flat and I smacked it with a crack like a gunshot, and a whole winter’s worth of sawdust came down off the rafters onto our heads. He didn’t brush it off. He grabbed the side plank that wasn’t nailed on yet and went back to planing it, twice as fast as before."

[tracks.reunion_selim_kereste]
name = "Selim Kereste: The Lifeboat Afloat"

[tracks.reunion_selim_kereste.chapters.reunion]
title = "The Lifeboat Afloat"
text = "Five years later I came back to the Golden Horn. The arsenal’s slipways had grown longer, galleys sat on their stocks in rows, and the sawpit was right where it had always been. At the water’s edge, at the far end of the slipways, a small boat rested on two log rollers, her bow roped to a post, her hull oiled so many times it shone black. Near the stern, the seat groove was still there. Selim was standing beside her. He was a foreman on the slipway now, learning to read plans under the shipwright Hasan, a roll of drawings tucked into his belt. He had a new apprentice by the hand and was pressing it against a curved log. “Feel it. Start from the thick end. This is from Sinop, cut in midwinter—” The same lesson, word for word. “—whoever cut it was in a hurry, and there’s a scar in the third ring.” I was standing behind him, and I finished it for him. His hand went still on the log, and it was a while before he turned around. He didn’t say anything. He went to the post, unwound the boat’s line turn by turn, and put it in my hand. “Your seat,” he said, “has been empty for five years.”"

[tracks.reunion_selim_kereste.chapters.reunion.default]
effects = [{ text = "Your ship never came. I asked at the docks more times than I can count, every ship in from Alexandria, every ship in from Rhodes, and nobody had seen you. I put the lifeboat in the water this spring. I meant to wait another year, but the steward wanted that spot at the end of the slipways to lay a new keel, and wood can wait but a slipway can’t. I pushed her in by myself. The rollers were slick, and halfway down she got away from me and ran in on her own. Her bow went under and gave me a fright, and then she came up again, and not a drop got in. I sat in your seat for a while. My legs wouldn’t straighten, and then I remembered I’d cut it to fit you, so it didn’t suit me, and I got up. There’s a little wooden tag folded into this letter, sawn from an offcut of the lifeboat. Sinop oak. Feel it: there’s no scar in the third ring. The tags in the timber yard are branded with the day the tree was cut. On this one I branded the day she went in the water. Now she has two days of her own. I run a crew on the slipway these days, and I’m learning to read plans under Master Hasan. Every line on a plan is straight; they give me a headache. The seat is still empty. Nobody else has sat in it. Whatever year you come back, that’s the year somebody sits there. —Selim, the Golden Horn" }, { }]

[tracks.reunion_selim_kereste.chapters.reunion.choices.friend]
text = "Push the boat in with him, row out of the Golden Horn, and row back."
reply = "We took one side each and pushed her off the rollers. She hit the water with a rush, her bow dipped under, came up, rocked twice, and settled. The apprentice clapped on the bank. I sat down in the groove with my back against the side. My legs wouldn’t straighten, so I tucked them up. Selim took the oars up front. We rowed out from the slipway, around the rows of moored galleys, and all the way down the Golden Horn to the mouth of the Bosporus. The water went from green to blue, the swell picked up, and the little boat rose and fell, and not a drop came into her. “She’s steadier than I thought.” He rested the oars and patted her side the way you’d pat a horse’s neck. It was nearly dark when we got back. Ashore, he fetched a red-hot iron from the shed and burned a line into her stern: the date. He stepped back two paces to look at it, then added a small mark beside it, the very same mark as on the old brand tags in the timber yard. “There,” he said. “Now she has somewhere she came from, too.”"
effects = [{ }, { }, { }, { title = "The Lifeboat Afloat" }]

[tracks.reunion_selim_kereste.chapters.reunion.choices.rival]
text = "Put it to him: I made captain. Has he made master of the slipway?"
reply = "“Captain,” I said, spreading my hands. “Done. And you?” Selim pulled the roll of plans out of his belt and stuck it back in. “Almost.” “How almost?” “Next year. The steward says that post on the slipway is mine come spring.” “So you don’t have it,” I said. “You lose.” “Half lost.” “Lost is lost. There’s no half.” “How many years have you been a captain? I’ve put in five on this slipway, and I’ve trained more apprentices than you have sailors.” He started counting it out on his fingers and got himself so muddled he gave up with a wave of his hand. “Fine. The half I owe, I’ll pay with a boat.” He meant the one on the rollers. I said that one already had my seat in it. He said the seat was mine and the boat was his, two separate matters. We argued at the edge of the slipway until the sun was low, while the apprentice squatted beside us yawning. In the end he shoved the line into my hand. “Push her in first. Then we keep arguing.”"
effects = [{ }, { }, { }, { title = "The Lifeboat Afloat" }]

[tracks.reunion_selim_kereste.chapters.reunion.choices.love]
text = "Ask him about the mark on the side. Has he decided what it means?"
hint = "You glanced at the groove. Those words have been in your mouth for five years, and they still won’t come out."
reply = "He didn’t answer. He led me to the stern and worked the point of his knife under the leather patch by the groove, prying out the brass tacks one at a time. When it came up, underneath was the lopsided mark I had carved back then, and beside it was his, cut deep, its edges worn smooth after five years. “Mine,” he said, “means ‘come back.’” “And mine? Aren’t you going to ask?” “You came back,” he said. “I don’t need to ask.” We pushed the boat into the water. He jumped in first and reached a hand back for me. I sat down in the groove, and instead of going forward to the oars, he crouched in front of me, one hand braced on the side. He kissed me. The boat rocked, rocked me back against the side, and my back settled into the groove exactly, a perfect fit; he had measured it five years ago. On the bank the new apprentice covered his eyes and ran. That afternoon the little boat went nowhere. She stayed tied at the slipway, drifting on the water until evening."
effects = [{ }, { }, { }, { title = "The Lifeboat Afloat" }]

[tracks.reunion_selim_kereste.chapters.reunion.variants.v1_bet_kept]
text = "Five years later I came back to the Golden Horn. The arsenal’s slipways had grown longer, galleys sat on their stocks in rows, and the sawpit was right where it had always been. At the water’s edge, at the far end of the slipways, a small boat rested on two log rollers, her bow roped to a post, her hull oiled so many times it shone black. Near the stern, the seat groove was still there. Selim was standing beside her with a roll of drawings in his belt, pressing a new apprentice’s hand against a curved log, teaching the same old lesson: Sinop, midwinter. Behind him, I added, “There’s a scar in the third ring.” He didn’t even turn his head. “Did you make captain?” Before I could answer he was at the post, unwinding the line, and he pushed it into my hand. “Don’t tell me yet. That seat’s been empty five years. Sit in it first. We’ll settle up after.”"

[tracks.reunion_selim_kereste.chapters.reunion.variants.v2_mark_covered]
text = "Five years later I came back to the Golden Horn. The arsenal’s slipways had grown longer, galleys sat on their stocks in rows, and the sawpit was right where it had always been. At the water’s edge, at the far end of the slipways, a small boat rested on two log rollers, her bow roped to a post, her hull oiled so many times it shone black. Near the stern, the seat groove was still there, and beside it a small patch of leather had been nailed down, a brass tack at each corner, covering something completely. Selim was standing beside her with a roll of drawings in his belt, teaching a new apprentice to feel the grain, the same old lesson: Sinop, midwinter. From behind him, I said the rest of it. He turned, and his eyes went to that patch of leather first, quick as a flinch, before they came to me. The tips of his ears slowly reddened. He went to the post, unwound the line, and handed it to me. “Your seat,” he said, “has been empty for five years.”"

[tracks.reunion_selim_kereste.chapters.reunion.variants.v3_last_plank]
text = "Five years later I came back to the Golden Horn. The arsenal’s slipways had grown longer, galleys sat on their stocks in rows, and the sawpit was right where it had always been. At the water’s edge, at the far end of the slipways, a small boat rested on two log rollers, her bow roped to a post, her hull oiled so many times it shone black. Near the stern, the seat groove was still there, and the nail heads on the last side plank looked newer than all the rest. Selim was standing beside her with a roll of drawings in his belt, teaching a new apprentice to feel the grain, the same old lesson: Sinop, midwinter. From behind him, I said the rest of it. He turned, and it was a long moment before he spoke. “The day you left, I was nailing this one on.” He rapped the plank with a knuckle. “When I was done I ran to the docks, and your ship was already out of the Golden Horn.” He unwound the line from the post and handed it to me. “Your seat has been empty for five years.”"
