# 莱昂诺尔·鲁伊斯：第一张错图（bond_leonor_ruiz）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、选项、回复、提示、变体、回忆标题、来信），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完；美式拼写、弯引号。专名沿用已有译法：House of Trade、the Arenal、Torre del Oro、Triana、Sanlúcar。
# 布拉萨译 braza（第一次出现时说明是一臂展），一链译 a cable / half a cable。

[tracks.bond_leonor_ruiz]
name = "Leonor Ruiz: The First Wrong Chart"

[tracks.bond_leonor_ruiz.chapters.c1]
title = "The Chart Not for Sale"
text = "The chart shop by the Arenal docks keeps a basket of old rolled charts by the door, the cheapest two coppers apiece. I picked one of the Guadalquivir mouth, and my coins had barely touched the counter—I hadn’t even rolled it up—when a hand black with charcoal snatched it back. “That one’s not for sale.” The girl who took it was about my age, her apron covered in sooty handprints. The owner slapped his forehead and apologized: his mistake, wrong basket, that one belonged to Leonor, his shop girl. I wasn’t having it. I jabbed a finger at the sandbar off Sanlúcar. “Drawn like that, I wouldn’t take it as a gift. The bar’s in the wrong place.” She didn’t bristle. She laughed out loud, pulled a stub of charcoal from behind her ear, pushed it into my hand, and spread a sheet of wrapping paper on the counter. “Draw it first, then argue.” So I drew it. When I looked at what I’d done, my sandbar had wandered clear across the river—worse than hers. She leaned on the counter and studied it a long while, then marked a cross beside my sandbar with the charcoal."

[tracks.bond_leonor_ruiz.chapters.c1.choices.swap_for_proper_chart]
text = "Trade it for a proper chart of the river mouth, and don’t ask why hers isn’t for sale."
reply = "From under the counter she dug out a freshly traced roll and opened it for me: sandbar, shoals, the mooring posts below the Torre del Oro, nothing missing. The owner said that one was four coppers. I counted them out on the counter, and she pushed three of them back across to me. “One’s plenty. Your eyes aren’t half bad.” I rolled it up and went out, and I was a dozen steps down the quay when she yelled after me, “The bar’s half a cable farther north! Next time don’t draw it on the other bank!”"

[tracks.bond_leonor_ruiz.chapters.c1.choices.draw_it_again]
text = "Plant myself in the shop and redraw that sandbar with her, stroke by stroke."
reply = "We argued from early afternoon until the owner started putting up the shutters. She said the tail of the bar trailed downstream; I said it hooked upstream. She drew a line, I rubbed it out, and seven or eight sheets later neither of us had budged. When the owner came at us with a lamp to throw us out, she folded my drawing, opened the drawer under the counter, and dropped it in. “I’m keeping this. The day you finally lose, I’ll take it out and show you.”"

[tracks.bond_leonor_ruiz.chapters.c2]
title = "On the Back of a Tide Table"
text = "That summer Master Jerónimo de Chaves was lecturing on cosmography at the House of Trade. The lectures didn’t take girls, so Leonor crouched on the stone steps outside the window with her ear to the crack. That day the master drew the twelve signs of the zodiac on the board, circle inside circle, and from outside, even on tiptoe, she couldn’t see a thing. She dug at the window frame with her fingernail until a flake of green paint came away. When the class let out she caught me at the door, turned over a tide table for the Guadalquivir, and pushed it at me. The front was printed with the hours of every rise and fall; the back was bare. “Copy out what he drew for me. The whole zodiac—don’t leave out a line.” The words came pouring out of her, but her eyes never left the notebook tucked under my arm. “How long have you been listening at that window?” “Since his very first lesson.” She pressed the tide table into my hand again. “The pigeons on the sill know me by now.”"

[tracks.bond_leonor_ruiz.chapters.c2.choices.give_notebook]
text = "Lend her my whole notebook to copy at home, and keep watch at the window for her tomorrow."
hint = "She has the tide table pinned flat under her hand, her eyes only on my notebook. A whole notebook, from an apprentice she’s only just met—she won’t take that yet."
reply = "The next day I crouched outside the window keeping an eye on the porter, and on the steps she handed my notebook back. Down the margin of every page ran a new line of tiny writing, close and slanted, like the waterline a tide leaves on the bank. On the zodiac page, beside one of the master’s figures, she had written: “He got this wrong.” I took it to him not quite believing it. He stared at that little line for a long time, cleared his throat, went back to the board, and wiped the figure out and drew it again."

[tracks.bond_leonor_ruiz.chapters.c2.choices.retell_after_class]
text = "After class, sit with her on the steps and talk her through the master’s drawing, piece by piece."
reply = "I made a mess of it—Libra came out as Scorpio, and I couldn’t remember where the spring equinox was supposed to go. She didn’t say a word. Her charcoal flew across the back of the tide table, and when she was done she held it up in front of my face. “Is this what he drew?” It was, and it wasn’t: hers was clearer than the board, and she had even straightened the stretch the master had drawn crooked. I told her it was good. She rolled it up. “Tell me that at high tide.”"

[tracks.bond_leonor_ruiz.chapters.b1]
title = "Shoals After the Rain"
text = "It had rained for days that autumn, and the Guadalquivir had risen and fallen again, and every shoal on the riverbed had shifted. Leonor dragged me into an old Triana boatman’s skiff and we went downstream toward Coria to take soundings. The bottom of her lead was packed with tallow: drop it, haul it up, and whatever sand stuck to it told you what lay below. I read my numbers out of the notebook I’d filled that morning; she read hers off the lead as it came up dripping. Before long they stopped matching. “Two brazas on the left,” I said—two arm-spans of water. “Two?” She flicked the lead. “There isn’t half a braza over there. Your line shrank in the wet.” By the third round the boatman had heard enough. He spat over the side and poled us straight over to the side she said was shallow. There was a scrape, and the hull settled on sand and didn’t move again. Leonor wasn’t angry in the least. She squatted in the bow, slapping her knees with laughter. “See? The river’s settled it for us.”"

[tracks.bond_leonor_ruiz.chapters.b1.choices.jump_and_push]
text = "Jump in and push the boat off, and own that the wrong number was mine."
hint = "We’re still squabbling over that number. If I jump in to push now, she’ll grab me by the collar: “Don’t think you can pay this off with muscle.”"
reply = "The water only came to my knees, but the mud swallowed every step. I put my back into it three times before the skiff wobbled free of the sand. By the time I climbed in again I was mud from the waist down, and she was laughing as she struck out my number with her charcoal and wrote “half” beside it. When we tied up she tossed her shawl over my head. “Wrap up. If you catch your death, who’ll give me wrong numbers next time?”"

[tracks.bond_leonor_ruiz.chapters.b1.choices.both_numbers]
text = "Put both our numbers on one sketch and take it back for the master to judge."
reply = "The master turned the sketch this way and that for a quarter of an hour and said both numbers were right: mine was taken that morning on the flood, hers in the afternoon on the ebb, and by the time we grounded the water had dropped further still. Leonor slapped the master’s desk so hard the inkwell skidded. “Then you have to write down the hour!” Ever since, every depth on her charts has a little hour written beside it."

[tracks.bond_leonor_ruiz.chapters.b2]
title = "The Bar at Sanlúcar"
text = "The fleet for the Indies was due to sail that summer. The official chart of the river mouth, Leonor said, hadn’t been touched in ten years, while the bar at Sanlúcar swallowed ships every year, and she meant to measure it herself. We rode a flat-bottomed salt barge downriver and waited at Sanlúcar for low water. When the tide went out and the bar showed its back, she wound a sounding line around her wrist, a knot tied at every braza, and waded out through the muck feeling for the channel while I followed with the notebook. We measured until dark. The channel deep enough for big ships lay a full cable north of where the chart put it. Back on shore she unwound the soaked line from her wrist, coil by coil, and it left red welts behind. The pilot boat was going out at first light to sound the channel, and it didn’t take shop girls. She held the bundle of line in her fist, the knots biting into her palm one after another. “You’re an apprentice at the House of Trade,” she said. “Can you get me a place on that boat?”"

[tracks.bond_leonor_ruiz.chapters.b2.choices.get_her_aboard]
text = "Use my apprentice’s standing to get her aboard the pilot boat, and take an oar myself."
hint = "Her grip on the line tightens. She can’t be sure yet that once I’m aboard, I won’t pass off her soundings as my own."
reply = "The pilot captain refused at first. I told him she was there to keep the count for the House of Trade and that I’d row, and at last he waved her aboard. Over the bar she let the line down knot by knot, and with every number she called his face grew darker. In the end he said nothing at all. He pulled his own old chart from the locker, dipped a pen in red ink, and traced the channel again, farther north. All the way back upriver she held the line and didn’t say a word. Only when the Torre del Oro came into sight did she speak. “You rowed all day. Do your hands hurt?”"

[tracks.bond_leonor_ruiz.chapters.b2.choices.copy_two_sets]
text = "Copy her soundings out twice, and send one copy to the pilot captain by someone else’s hand."
reply = "I copied until midnight while she sat beside me reading the numbers out one at a time, knocking her own forehead with a knuckle whenever she misread one. At daybreak we gave a copy to a sailor on the quay to carry down. Whether the captain took it, or ever looked at it, we never found out. That summer the fleet sailed, and not one ship grounded on the bar. She stood on the quay from morning to night, counting the sails out one by one, and only when she’d counted them all would she go back to the shop to eat."

[tracks.bond_leonor_ruiz.chapters.a1]
title = "The Wrong Chart Inside the Drawer"
text = "The shutters were up and the owner had gone home. Leonor lit a candle, pulled out the drawer at the very back under the counter, and turned its lid over to show me. Inside the lid a yellowed chart was nailed down, a brass tack at each corner. The sandbar sat crooked on it. It was the very chart I had tried to buy for two coppers on my first day. Since then it had stayed tacked in here, and it had never gone back into the basket by the door. “This is the first chart I ever drew,” she said. “I was eleven, and I put the bar in the wrong place. My father took it to sea. He sat stuck on the Sanlúcar bar all night, and if the tide had come an hour later the boat would have broken up.” Every time she finished a new chart, she pulled out this drawer and looked at it first, and only then did she sell the new one. The candle leaned, and a drop of wax fell on the counter. She scraped it off with her fingernail. Another drop; she scraped that off too. Her eyes stayed on the chart, never on me. “The first time you came in, you said you wouldn’t take it as a gift,” she said. “You were right.”"

[tracks.bond_leonor_ruiz.chapters.a1.choices.hold_the_candle]
text = "Take the candle and hold it for her, and don’t flinch when the wax drips on my hand."
hint = "I reach for the candle, but she slides the holder a little toward her own side. On a night like this she isn’t used to another hand beside hers."
reply = "The third drop landed on the back of my hand before she noticed. She snatched the candle away and set it on the counter, caught my hand, and leaned down to blow on the red mark. When she’d finished we both just stood there, and the flame wavered twice. She let go and shoved the drawer shut—too hard; the lid banged down. “Come early tomorrow,” she said with her back to me. “I’ll teach you to draw tide lines.”"

[tracks.bond_leonor_ruiz.chapters.a1.choices.pin_your_mistake]
text = "Fetch my own first botched astrolabe reading and nail it up beside her wrong chart."
hint = "I want to nail my own mistake up there too, but my hand stops halfway. We aren’t close enough yet for her to let anyone else tack things into that drawer."
reply = "I tore the page out of my notebook: my first sun sighting, which had put Seville somewhere in Morocco. She found another brass tack and nailed the page up next to her chart. With the two mistakes side by side she laughed until she couldn’t stand up straight and nearly knocked the candle over. “From now on this drawer is called ‘Nearly Didn’t Come Back.’” After that, whenever she finished a new chart, she checked it against the drawer, and then I was the next one to see it."

[tracks.bond_leonor_ruiz.chapters.a1.choices.ask_next_shore]
text = "Ask her which stretch of the riverbank she wants to draw next."
reply = "“From Seville all the way to the sea,” she said. “And I won’t skimp on a single stretch.” She pulled out a sheet then and there and started at the Torre del Oro, working downriver: the Arenal docks, the kiln mouths of Triana, the orange groves on the far bank. When she reached the convent where I live, her charcoal paused. She put a small dot where the bell tower stands, and only then went on drawing."

[tracks.bond_leonor_ruiz.chapters.a2]
title = "A Tile from Triana"
text = "Once summer came, Leonor crossed the river to Triana every evening and worked in a pottery, mixing clay and hauling firewood, until after more than a month the kiln master agreed to let her fire one tile of her own. On the day it came out of the kiln she waited for me on the Arenal quay with it wrapped in a blue cloth. Layer by layer the cloth came away. On the front was a single flower, the glaze still bright, and on one petal the firing had left a tiny bubble. “The kiln heated unevenly,” she said before I could open my mouth. “Don’t you laugh.” She turned the tile over. On the back, in a glaze pen, she had drawn the bar at Sanlúcar, the channel threading between two shoals a cable north of the official chart, not a stroke out of place, down to the soundings we had taken that day. She wrapped it up again and pressed it into my hands. The cloth was still warm. “The front is for other people to look at,” she said. “The back is for you.”"

[tracks.bond_leonor_ruiz.chapters.a2.choices.take_the_tile]
text = "Accept the tile, and tell her I’ll set it into the wall of my own cabin someday."
hint = "I hold the blue bundle without daring to close my fingers on it. A tile like this—we aren’t close enough yet for me to take it with an easy conscience."
reply = "“You’re out of your mind,” she said. “The ship rolls, the bulkhead twists, and it cracks in two.” I said then it could crack in two, half a channel each. She swore at me and stalked off. Early the next morning she was knocking at the convent door with a wooden frame in her arms: pine, edged with leather strips, its bed lined with a thick layer of wool. “Set it in this,” she said. “It won’t break.”"
effects = [{}, {}, {}, { title = "A Tile from Triana" }]

[tracks.bond_leonor_ruiz.chapters.a2.choices.bubble_is_best]
text = "Accept the tile, and tell her the part I like best is the little bubble on the petal."
hint = "I want to say something about that bubble, but the words stop in my throat. We haven’t come far enough yet for me to say a thing like that."
reply = "She went red to the ears. “That’s where it got spoiled.” I said the spoiled part was something only the two of us knew about; everyone else would just see a flower. She didn’t answer. She turned away to untie her skiff from its post and fumbled at the rope a long time without getting it loose. When the knot finally gave, she said it to the river, not to me: “Then you’d better remember it. Always.”"
effects = [{}, {}, {}, {}, { title = "A Tile from Triana" }]

[tracks.bond_leonor_ruiz.chapters.a2.choices.too_fine]
text = "Tell her the tile is far too good—it ought to hang in the shop and fetch a fine price."
reply = "Her eyebrows shot up. “What I give you isn’t for sale.” She bundled the blue cloth around it and shoved it back against my chest. “Sell that, and I’ll never draw a channel that true again as long as I live.” With that she jumped into her skiff and rowed back toward Triana, and when she was well out on the water she turned and lifted an oar at me."

[tracks.bond_leonor_ruiz.chapters.s]
title = "Two Charts, One River"
text = "At the end of the year my papers came from the House of Trade: in the spring I would sail as a trainee aboard a ship bound for the Indies. I took them to the chart shop. Leonor was bent over the table on a new chart. None of the people who worked the docks—the skiffs, the olive-oil barges, the ferries—could afford a House of Trade chart, she said, so she was going to draw one for them, from Seville all the way to Sanlúcar: every shoal, and the hour you could get over it, without missing one. The draft covered half the table. The river bent a dozen times, the drawing growing denser the farther downstream it went, but at the mouth there was still a long stretch of bare paper. “You’re taking the sea,” she said. “I’m taking this river.” She handed me the charcoal, warm from her grip. “I haven’t finished sounding the mouth. Put a dot there for me first, and from now on I’ll draw outward from it.” I took the charcoal and pressed a black dot onto the river mouth."

[tracks.bond_leonor_ruiz.chapters.s.choices.promise]
text = "Promise that every time I come back, I’ll bring her a newly sounded stretch of coast to draw in."
hint = "The charcoal turns once between my fingers, but the promise won’t come. Either we aren’t close enough for words like these, or I’ve already made a promise like this to someone else."
reply = "“Then you’d better measure true,” she said. “Anything that isn’t, I won’t draw a line of.” I said that wherever I went I’d write it all down—how many times the lead went over, how many knots of line ran out, what hour the tide turned—and not drop a single number. She nodded, pulled a second stub of charcoal from behind her ear, and beside my dot she wrote today’s date, slowly, going over each figure until it was thick and dark. “That’s where it starts. Every time you bring a stretch back, I’ll add it on from here. The day you stop coming back, the chart stops there too.” I said then the chart would never stop. She rolled her eyes at me, rolled up the draft, tied it with the tail end of a sounding line, and put it away in the drawer under the counter. On the spring morning I sailed she didn’t come to the quay. But there was a small notebook in my baggage I hadn’t packed. On its cover was a river with a dot at the mouth, and beneath it, in small letters: “Start here.”"
effects = [{}, {}, { title = "Two Charts, One River" }, {}, {}, {}]

[tracks.bond_leonor_ruiz.chapters.s.choices.heart]
text = "Tell her that the day I come back to Seville grown, I’ll come to the shop first—and ask her something then."
hint = "The words rise as far as my lips, and I swallow them. Maybe we haven’t come that far yet. Or maybe I have already said this to someone else."
reply = "Her hand stopped in midair, charcoal poised right over the dot I’d just made at the river mouth. “Ask me what?” “I’ll ask you then.” She looked down at the chart for a long time—long enough for the convent bell outside to finish striking. Then she put the charcoal down. “Then I’ll have something to say back. You’ll hear it then.” She reached across the table for the ruler just as I reached to hold down a corner of the chart that was curling up, and our hands met at the river mouth, right over that dot. Her fingers were all charcoal, and cool; mine were too. She didn’t pull hers away, and I didn’t pull away mine. In the end it was the candle that went out first. In the dark she said, very quietly, “If you forget to ask, I’ll never answer.”"
effects = [{}, {}, {}, { title = "Two Charts, One River" }, {}, {}, {}]

[tracks.bond_leonor_ruiz.chapters.s.choices.own]
text = "Agree that we’ll each draw our own charts, and when we meet again, see whose shoals are truer."
reply = "“You’re on.” She pushed the draft to the middle of the table. “You draw your sea, I’ll draw my river. When you come back we lay the two charts side by side and check them number by number, and half a braza off counts as a loss.” “And the loser?” She didn’t even stop to think. “The loser buys the oranges for a month.” I said a month was nothing—Seville oranges are sour enough to set your teeth on edge, and a month of them wouldn’t settle anything. She thought about it. “A year, then.” We slapped hands across the draft—a smack and a little puff of charcoal dust—and each of us came away with half a black handprint. She looked down at hers, didn’t bother to wipe it, just rubbed it on her apron and went back to drawing her river, muttering as she went, “A year of oranges. You keep count.”"

[tracks.reunion_leonor_ruiz]
name = "Leonor Ruiz: A Lamp Above the Chart Shop"

[tracks.reunion_leonor_ruiz.chapters.reunion]
title = "A Lamp Above the Chart Shop"
text = "My ship worked its way upriver and dropped anchor once more below the Torre del Oro. The chart shop by the Arenal docks was still there. The basket by the door was a new one, and under the sign there was a new line: Leonor Ruiz, River Charts from True Soundings. A customer had just left—a maid from the marquis’s household come to order charts, with a quick tongue on her; she was out the door, but her laughter still hung in the room. Leonor had a chart table of her own now, by the window, and weighted down on it lay a long chart of the shoals running from Seville all the way to Sanlúcar. The mouth was finished. It began from the black dot I had pressed there years ago; the charcoal had faded, and she had gone over it again in ink. She was bent over the table inking in a depth when the door creaked. She looked up, saw it was me, and her pen never stopped. “The bar’s moved again,” she said. “Would you believe it?”"

[tracks.reunion_leonor_ruiz.chapters.reunion.variants.parted]
text = "My ship worked its way upriver and dropped anchor once more below the Torre del Oro. The chart shop by the Arenal docks was still there. The basket by the door was a new one, and under the sign there was a new line: Leonor Ruiz, River Charts from True Soundings. A customer had just left—a maid from the marquis’s household come to order charts, with a quick tongue on her; she was out the door, but her laughter still hung in the room. Leonor had a chart table of her own now, by the window, and weighted down on it lay a long chart of the shoals running from Seville all the way to Sanlúcar. The river mouth, still unfinished the year I left, was filled in now, its lines denser than anywhere else—you could tell one person had gone out and sounded it, trip after trip. She was bent over the table inking in a depth when the door creaked. She looked up, saw it was me, and her pen never stopped. “The bar’s moved again,” she said. “Would you believe it?”"

[tracks.reunion_leonor_ruiz.chapters.reunion.variants.promise]
text = "My ship worked its way upriver and dropped anchor once more below the Torre del Oro. The chart shop by the Arenal docks was still there. The basket by the door was a new one, and under the sign there was a new line: Leonor Ruiz, River Charts from True Soundings. A customer had just left—a maid from the marquis’s household come to order charts, with a quick tongue on her; she was out the door, but her laughter still hung in the room. Leonor had a chart table of her own now, by the window, and weighted down on it lay a long chart of the shoals running from Seville all the way to Sanlúcar. The mouth was finished. It began from the black dot I had pressed there years ago, and beside it was the date she had written that day; the charcoal of both had faded, and she had gone over them again in ink, stroke by stroke. She was bent over the table inking in a depth when the door creaked. She looked up, saw it was me, and her pen never stopped. “The bar’s moved again,” she said. “Would you believe it?”"

[tracks.reunion_leonor_ruiz.chapters.reunion.default]
effects = [{ text = "To the one who drew the sandbar on the wrong side of the river: The dockhands tell me you didn’t come back to Seville this year. Just as well—saves you starting an argument the moment you’re through the door. The shoal chart for the small boats is finished. Torre del Oro to Sanlúcar, nineteen sheets; laid end to end it’s longer than the shop. Nearly every boatman on the docks has been in to copy it, and the ones who can’t afford to, I read it out to. From last winter to this summer, not one small boat has grounded on this stretch of river. I’m telling only you that. If I told anybody else, they’d say I was bragging. I’m sending you a small copy with this letter; it’ll fit on your cabin wall. That little circle in the corner is the bubble on the tile. I traced it. The bar’s moved again—north, about half a cable. I haven’t sounded it. I’m saving it for you to sound when you come back. There’s a maid from the marquis’s household who comes in a lot, talks enough to drain the river, and brings half the street’s gossip with every order. She says she’s seen plenty of your sort, the ones who go to sea and never come back. I paid her no mind. The stretch off Cádiz is out past where my skiff can go. If you’re ever passing, drop the lead a few times for me and send me the numbers. —Leonor. Seville, the Arenal docks." }, {}]

[tracks.reunion_leonor_ruiz.chapters.reunion.choices.friend]
text = "Promise to sound a stretch off Cádiz for her next voyage—and not come back if I can’t get it right."
reply = "She snorted, pulled a roll from the shelf, and opened it: “Cádiz” in the upper left, a single line of coast below, and nothing else at all. “I can’t get at this one. A skiff can’t get out there, and the big ships won’t take me.” She rolled it up, pushed it into my arms, and tied it twice with cord. “Don’t come back unless it’s true.” I said if it wasn’t true I wouldn’t come back. She glared at me. “You’ll come back even if it isn’t. Come back and get an earful.” That night she picked a sackful of oranges in the yard behind the shop, so sour we both winced, and still we kept peeling them one after another. The peels piled up on the rim of the well while she quizzed me about the tides in the Indies—where I’d run aground, how much water the ship drew—until the moon was sinking in the west. When I left, our hands smelled of oranges, and she stuffed the last one in my pocket. “For the road. Don’t tell anyone aboard it came from my tree. It’s too sour. I’d never live it down.”"
effects = [{}, {}, {}, { title = "A Lamp Above the Chart Shop" }]

[tracks.reunion_leonor_ruiz.chapters.reunion.choices.love]
text = "Tell her I’m in no hurry to leave this time, and I’d like to stay for supper upstairs."
hint = "I never asked it, back then. All these years later, standing at her chart table, the question is still stuck in my throat."
reply = "She looked at me for a moment and set down her pen. “That thing you were going to ask me,” she said. “Are you still asking?” I asked. She didn’t answer right away. She got up, put the shutters up on the shop, picked up the lamp from the table, and headed for the stairs. “There’s only one table upstairs,” she said over her shoulder. “The charts and the supper will have to squeeze in together.” Sure enough, there was only one table upstairs: half of it weighed down with charts, half laid with bread, olives, and a little pot of fish stew. While we ate, her knee pressed against mine, and she showed no sign of moving it. Halfway through she reached over, turned my hand palm down, and searched the back of it with her thumb. The place where the candle wax burned me was long gone, but she found it anyway, bent her head, and kissed it. “That’s my answer,” she said. “Six years late. Don’t hold it against me.” Outside, the river was on the flood. The lamp sat between the charts and the bread and burned until well past midnight."
effects = [{}, {}, {}, { title = "A Lamp Above the Chart Shop" }]
