# 抢着接的下半句（bond_rania）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_rania]
name = "Rania: Snatching the Second Line"

[tracks.bond_rania.chapters.c1]
title = "Snatching the Second Line"
text = "The shipboard school lay at anchor off Mocha. Dusk was just coming on, and the old pilot sat by the binnacle reciting one of the long poems that keep a sea route in verse. At “past Aden, bearing east” he broke off and jabbed his cane at us. “Next line. Who has it?” I was still working out the star’s height for that leg in my head when a girl beside me sprang to her feet. “Don’t stop! I’ll take the second line.” She was a Hadrami merchant’s daughter named Rania, and she had been aboard three days. She capped the line fast and loud, the rhyme landing clean, and the sailors slapped the gunwale and cheered. But she had the distance for that leg short: she had put the star a finger too low. I raised my kamal to my eye and sighted on the first star coming out in the north. My mother had tied the knots in its cord for me. “One finger off is a hundred miles off.” Rania glared at me, her face going scarlet. The whole ship was laughing. The old pilot laughed so hard his cane fell onto the deck, and I couldn’t tell whether it was her he was laughing at, or me."

[tracks.bond_rania.chapters.c1.choices.praise_then_fix]
text = "Praise her rhyme first, then set the distance right and recite it for her."
reply = "“Your rhyme sounds better than mine,” I said. “It’s only that the star needs to sit one finger higher, and the distance has to stretch to match.” I recited the corrected line. She pressed her lips together and said nothing. After a while she sidled over and held out her hand for my kamal. “How do you measure that one finger?” I showed her how to hold the knot in her teeth and push the board out to arm’s length. She held it upside down, lower edge on the star and upper edge on the sea, which put the star somewhere underwater. We both collapsed laughing on the deck, and over by the binnacle the old pilot cleared his throat, loudly, twice."

[tracks.bond_rania.chapters.c1.choices.finish_yourself]
text = "Don’t give way; recite the correct second line myself."
reply = "I stood and finished the line, star height, distance, and rhyme all exactly right. The old pilot nodded. Rania walked to the stern without a word and sat with her back to everyone until full dark. Early the next morning, when I came up on deck, she was already waiting by the binnacle with a scrap of paper in her fist, its corner squeezed soft. “That line yesterday. How did you work it out? From the beginning, and don’t skip anything.”"

[tracks.bond_rania.chapters.c2]
title = "Her Uncle’s Trade"
text = "The monsoon had died, and the shipboard school lay alongside the shore at Mocha, waiting for autumn. Every day Rania held forth on deck about her uncles’ business: three warehouses in Aden, and in Cambay a great ship, “bigger than your pilot family’s ship, with masts as tall as a two-story house.” I went down to the docks and asked a sailor just back from Cambay. Oh, the ship existed, he said. It was hired. Two seasons’ hire, from a Gujarati owner. That evening Rania came to find me with a letter, from her uncle in Cambay, she said, so she could read me just how big the ship was. The edge of the paper was smudged with indigo dye. She read two lines and stopped on the third, running her finger back and forth under one word. “This is scrawled too badly,” she said. “My uncle’s handwriting has always been awful.” She read on. Halfway down she couldn’t go any further, and she turned the letter over to look at the back, as though the rest of it might be written there."

[tracks.bond_rania.chapters.c2.choices.help_reply]
text = "Don’t call her out. Help her finish the letter, then write back together to ask."
hint = "She whisks the letter behind her back. “I can read it myself.” She isn’t ready to let you see her stumble over her uncle’s letter."
reply = "I took the letter and read on from where she had stopped: the ship was hired, the lease ran until winter, and her uncle wanted to know whether the family meant to hire it again next year. Rania listened and said nothing. We lit a lamp below and wrote the reply, her speaking a line and me writing it down, asking her uncle what the hire cost and how many bales of cotton cloth the ship would carry. After the letter went off, whenever she talked about her uncle’s ship, she called it “the big hired ship.” When someone laughed, she lifted her chin. “Hired or not, it’s a big ship.” Then she was the first to laugh."

[tracks.bond_rania.chapters.c2.choices.point_it_out]
text = "Tell her to her face that the ship is hired."
reply = "“That ship is hired,” I said. “Every sailor on the docks knows it.” Rania folded the letter, smaller and smaller, and walked off. For three days she wouldn’t speak to me. If we passed on deck she turned her head away, and at meals she sat at the far end from me. On the evening of the fourth day she found me, carrying a bowl of dates, and set it down in front of me. “Fine, it’s hired. Are you eating these or not?”"

[tracks.bond_rania.chapters.b1]
title = "From Aden to Socotra"
text = "In autumn the ship was to head east, and the old pilot set the two of us to write a poem together recording the leg from Aden to Socotra. I had charge of star heights and distances; Rania had charge of the rhymes. The first few lines went smoothly. When we reached the star in the north, we fell to arguing. She wanted the poets’ name, al-Judayy, the little kid goat, because it sounded lovely. I wanted al-Jāh, the name pilots use, the one any sailor understands the moment he hears it. “Judayy rhymes,” she said. “What rhymes with Jāh? Your temper?” “It’s for people on ships. People on ships only know al-Jāh.” We argued until the binnacle lamp had been refilled twice. Then she shoved the paper across to me, pen and all. “Fine. You write this line, I’ll write the next, and we’ll see whose is better.” There was a new ink blot on the paper, from when she had slapped the table a moment before."

[tracks.bond_rania.chapters.b1.choices.take_turns]
text = "Do it that way: one line each, turn and turn about, all the way to Socotra."
hint = "She still thinks you look down on her for being good only at rhymes. Pushing the pen over was a sulk. She won’t truly take turns with you on this poem."
reply = "I wrote a line of star heights, she rhymed the next, and we wrote until dawn and reached Socotra right on time. We recited it for the old pilot. He stroked his beard through to the end and said, “One line true, one line pretty. That makes a poem of sorts.” Rania rolled the sheet up, tied it with a length of thin twine she had picked out of an old rope, and pushed it into my hands. “Keep it. We’ll go on writing later, as far as it takes us.”"

[tracks.bond_rania.chapters.b1.choices.use_her_name]
text = "Give way: use her pretty name for the star, and note the pilots’ name beside it."
reply = "I wrote down al-Judayy, and beside it, small, al-Jāh. She leaned over and studied it a long time. “You really do fuss.” But afterward, whenever she wrote verse of her own, every star had two names beside it: the pretty one large, the accurate one small. Once, halfway through a poem, she couldn’t find the small name she needed and came banging on my cabin door. Three knocks, then: “Hurry up and tell me, I’m waiting to rhyme.”"

[tracks.bond_rania.chapters.b2]
title = "The Missing Page"
text = "Rania borrowed a page of my great-grandfather’s manuscript to copy. It was a sailing poem in Ibn Mājid’s own hand, kept at the bottom of my mother’s dowry chest, and I had begged my mother for three days before she took it out. Early the next morning Rania came to me. She opened her mouth twice before any sound came out. “I… can’t find it.” She was forever forgetting to return what she borrowed, and this time she had forgotten where she’d even put it. The blood drained from my face. For a long moment I couldn’t speak. She was more frightened than I was. She knelt on deck and uncoiled every rope to search it, then crawled into the hold and went through the rice sacks until the dirt was black under her nails. On the third coil she stopped. Her tears fell on the planks one by one, spreading into dark round spots. “I’ll make it up to you,” she said. “I’ll copy it out a hundred times.” However well she copied it, it would never be that page."

[tracks.bond_rania.chapters.b2.choices.search_whole_ship]
text = "Search the whole ship again with her, and don’t scold her even when it turns up."
hint = "She ducks into the hold whenever she sees you coming, afraid the first thing out of your mouth will be blame. Right now she won’t let you search with her."
reply = "We searched from bow to stern, and when it got dark we lit a lamp and kept going. In the end it was Rania who cried out, pulling off her sandal: the page was folded in four, wedged between the sole and the insole, and she could not for the life of her remember tucking it there. I laid the manuscript on the binnacle and smoothed it out bit by bit. Beside me she was still hiccuping. “I’m never borrowing anything of yours again.” “Borrow,” I said. “Just remember to give it back.”"

[tracks.bond_rania.chapters.b2.choices.go_confess]
text = "Let her keep searching while I go ashore and own up to my mother."
reply = "My mother heard me out and didn’t scold. She set down her needlework and recited a line of verse, then another, all the way to the bottom of that page. “That page, I know by heart.” Toward evening Rania found the manuscript under her own sandal and carried it ashore to us in both hands, shaking all the way. My mother took it, looked it over, and told her, “Next time you borrow, keep it inside a book.” Rania nodded so hard her headscarf slipped sideways."

[tracks.bond_rania.chapters.a1]
title = "A Night by the Binnacle"
text = "The monsoon filled the sails and the ship ran on through the dark, and that night Rania and I had the watch. A small lamp burned in the binnacle, its glass browned with smoke, lighting only the compass needle and our two pairs of hands. “Watches are so dull,” she said, pulling paper and pen from inside her robe. “Last year’s poem stopped at Socotra. Let’s keep going, all the way to Gujarat.” I gave a line of star heights; she rhymed it. She was quick. Often I hadn’t finished my line before her rhyme was already waiting on her lips. Past midnight the ship cut through a patch of phosphorescence, the water glittering under the waves. “That has to go in.” “It has nothing to do with distance.” “The things that have nothing to do with distance are the ones worth looking at.” A few lines later she went quiet. I turned and found her asleep against my shoulder, pen still in her hand, its nib trailing one long line of ink down the page. The wick popped. She didn’t wake."

[tracks.bond_rania.chapters.a1.choices.let_her_sleep]
text = "Keep perfectly still, let her sleep on my shoulder until the watch changes, and finish the line myself."
hint = "Your shoulder stiffens and she wakes at once, rubbing her eyes and sitting a little apart. You aren’t close enough yet for her to fall asleep on you like that."
reply = "I sat without moving until the change of watch. My right shoulder went numb, and I finished the line left-handed, the letters lurching as if a wave had hit them. Only when the relief came with his lantern did she wake, find herself leaning on me, and flush to the tips of her ears. She snatched the paper and held it to the light to read my line. “This rhyme is bad.” Then she folded the sheet twice and tucked it inside her robe."

[tracks.bond_rania.chapters.a1.choices.finish_together]
text = "Nudge her awake gently: this poem has to be finished by both of us."
hint = "You reach out to nudge her and pull your hand back. You haven’t come far enough together to say a thing like that."
reply = "She sat up rubbing her eyes and capped the last line half asleep, a hopeless jumble that rhymed the northern star with the fish she’d had for supper. We both burst out laughing, loud enough to bring the captain up from below to give us a thorough scolding. Later the poem was copied out twice, one for her and one for me, and every time either of us got to that fish we laughed too hard to hold the pen."

[tracks.bond_rania.chapters.a1.choices.watch_stars]
text = "Don’t wake her; note tonight’s stars myself and write them between the lines."
reply = "I wrote down the stars crossing overhead that night one by one, squeezed into the narrow gaps between the lines in letters as small as ants. She woke just before dawn and held the page a long time. “You even remember the stars better than I do.” She read their names aloud in turn, slowly, and after each name she looked up to find it in the paling sky."

[tracks.bond_rania.chapters.a2]
title = "The Line No One Could Reach"
text = "Rania announced she was going to copy the sailors’ sea songs, the ones passed from mouth to mouth, into a book, “the kind anyone can follow, so even someone who can’t read can have it read to him.” She chased the crew around with her pen, taking down the anchor songs, the rowing songs, the songs for furling sail, one line at a time. One day she pushed a sheet of paper at me. It was crowded with songs, and next to one line she had drawn a circle, and beside the circle written: “Nobody can reach this.” “That line,” she said, “you can.” “I have never sung in front of anyone.” “I’ve heard you.” She looked at me. “That night on watch. You thought I was asleep.” The ship rocked gently off Mocha. I held the sheet. She had drawn the circle so hard her pen had cut a small tear in the paper."

[tracks.bond_rania.chapters.a2.choices.keep_sheet]
text = "Accept the song sheet, and promise to sing her that line someday."
hint = "She holds out the sheet and you don’t take it. A song nobody can reach, handed to you—what you two share can’t hold that yet."
reply = "“When?” she asked. “When your book is finished.” “That could take years.” “Then years.” She thought about it, folded the sheet into a small square, tucked it into my sleeve, and pressed it through the cloth as if it might fly away. “Agreed. If you try to wriggle out of it, I’ll copy your name into the book and write beside it: ‘Can reach it. Won’t sing.’”"
effects = [{}, {}, {}, { title = "The Line No One Could Reach" }]

[tracks.bond_rania.chapters.a2.choices.sing_it_now]
text = "Accept the song sheet, and sing that line softly, right here."
hint = "Sing it, right in front of her? You haven’t even dared take the sheet. What you feel isn’t far enough along yet to sing for her alone."
reply = "I sang it, very softly, so softly no one but the two of us could have heard. The line climbed, and at the circled place I thought it would break. It didn’t. When I finished she looked at me and said nothing for a long while, turning her pen around and around between her fingers. Then she said, “That line—from now on, you sing it only for me.” And she was the first to turn her face away, her ears as red as the lantern at the stern."
effects = [{}, {}, {}, { title = "The Line No One Could Reach" }, {}]

[tracks.bond_rania.chapters.a2.choices.circle_back]
text = "Draw a second circle next to hers and write: “This line is waiting for you to sing it.”"
reply = "She laughed out loud. “If I sing that, I’ll shake the ship apart.” But that night, lying below, I heard someone at the stern practicing that line over and over. On the seventh try her voice still cracked. On the eighth she swore under her breath. After the ninth, the stern went quiet. The next day she gave the sheet back, and between the two circles was a third, drawn very small."

[tracks.bond_rania.chapters.s]
title = "Which Sea Will You Keep"
text = "The shipboard school’s last lesson was over, and the sailors were rolling up the carpets we had sat on for class. In spring I would sail with the monsoon. Rania would stay in Zabid for one more year of study, then go into the book-ship trade with her uncles: one hold of cargo, one hold of books. She spread the sailing poem we had been writing for three years across the top of the binnacle. The paper had been pieced together several times. The Aden-to-Socotra stretch was the oldest, its ink gone gray. The phosphorescence from that night watch was there too, with a long line of ink trailing beside it. “Which sea are you going to write poems for?” she asked. Before I could answer, she added, “Think before you say it. Once you say a thing, you never take it back.” The last line of the poem she had left unwritten. The pen lay beside it, its nib still wet."

[tracks.bond_rania.chapters.s.choices.promise]
text = "Agree that each time she finishes copying a page of sailing verse, she’ll send it for me to check the distances."
hint = "Checking her distances for life—you almost say yes, then stop. Your friendship isn’t yet as long as that poem—or you’ve already promised a lifetime of checking to someone else."
reply = "“Then you’ll have to stay at sea,” she said. “Otherwise where would I send them?” “Send them to Hormuz. Everyone there knows our family’s ship. Ask, and they’ll find me.” She left the last line alone and turned the sheet over. On the back she wrote Hormuz, then Aden, Cambay, Muscat, one port to a line, and on the fifth her pen ran dry. “That’s enough,” she said. “Five ports. One of them is bound to catch you.” In the corner she wrote a tiny word, checked, and circled it. “You sign here on every page, and it doesn’t count until you do. For every mistake you find, I owe you a poem.” I said she was going to owe me a great many. She said then she would pay them back slowly, one at a time. We rolled the poem up and tied it twice around with the old twine. She held it against her chest and said she would send the first page as soon as it was copied, and if it didn’t arrive, she would keep sending."
effects = [{}, {}, { title = "Which Sea Will You Keep" }, {}, {}, {}]

[tracks.bond_rania.chapters.s.choices.heart]
text = "Tear off a corner of the song sheet for her, in exchange for one word on the last line, read aloud by no one."
hint = "You look at the last line, and your hand stays where it is. Either you haven’t come that far together, or you have already given this to someone else."
reply = "I took out the sea-song sheet and tore off one corner along the fold, the corner with the circle on it, so that “Nobody can reach this” was left with only half its words. I slid it across to her. Rania looked at the corner and didn’t ask why. She picked up the pen and wrote one word on the last line of the poem, quickly, then folded the paper in three and pressed it into my hand, and wouldn’t let me open it there. I put the corner of the song sheet into her palm. She took my hand and held it hard, her nails digging into my palm. Someone on deck was calling for the carpets to be put away. He called twice. She didn’t let go, and neither did I. I didn’t unfold the paper to read the word until spring, once I was aboard. When I had read it I folded it back the way it had been, crease on crease, not a hair out of place."
effects = [{}, {}, {}, {}, { title = "Which Sea Will You Keep" }, {}, {}]

[tracks.bond_rania.chapters.s.choices.own]
text = "Make it a race: whoever turns a whole sea route into verse first."
reply = "“I’ll take the Red Sea,” she said. “You take the other seas.” “The Red Sea is long. Can you finish it?” “If I can’t, my book ships will keep writing it. Wherever the ships go, the poem goes.” She drew a stroke beside the last line, for a starting mark, and pushed the pen into my hand. “Draw yours. Whoever reaches the end first buys the other a year of dinners.” I drew mine, straighter than hers. She glanced at it, grabbed the pen back, and went over her own stroke again."

[tracks.reunion_rania]
name = "Rania: New Rhymes at Hormuz"

[tracks.reunion_rania.chapters.reunion]
title = "New Rhymes at Hormuz"
text = "In 1561 my ship put in at Hormuz. A row of crates stood stacked along the wharf, and Rania was up on the tallest one, reading new verse to the sailors. She gave a line and the sailors below answered with the next. When they got it wrong she banged the crate with the book in her hand and shouted, “Wrong! Again!” and they roared with laughter and tried again. Her book ship had just come in from the Red Sea and lay alongside, hatches open: half cargo, half books, the bundles of books all under oilcloth. At the end she held back one line. She jumped down off the crate in a puff of dust and pushed a finished copy of sailing verse into my hands, its cover new, three lines of stitching down the spine. “The second line—” She paused, looking at me. “This time, you take it.”"

[tracks.reunion_rania.chapters.reunion.default]
effects = [{ text = "Najma. You didn’t come to Hormuz. I read verse on the wharf for a whole season, until even the porters could cap my lines, and still no one could finish the last one. My helmsman asked around and came back saying your ship had gone elsewhere. I didn’t ask where. You’re at sea somewhere, either way. I asked the ships heading east to keep an ear out, and one sailor came back saying that off Muscat he’d seen a ship with someone standing in the bow holding up a kamal, perfectly level. He couldn’t say if it was you. I said it was. The book ship ran the Red Sea three times this year, and I know the book market at Jeddah like my own back courtyard. My first finished book of sailing verse: I’m sending you one page ahead on this ship bound for the Red Sea, and the rest will wait for you to come and fetch it. I checked the distances myself once. It gave me a headache, and there are certainly still mistakes. If you spot them, don’t laugh. Write them down and we’ll settle up next time. These days I take every star height twice, and if the second doesn’t match the first, I take a third. Don’t look so pleased with yourself. I learned it from you. My uncles’ ships are still hired, but this year they hired two. I’ve learned a little bookkeeping too, and I can read every word in their letters now. I left the last line on this page unwritten. The second line is yours. —Rania" }, {}]

[tracks.reunion_rania.chapters.reunion.choices.friend]
text = "Take up the half line, then check every distance in her book, one by one."
reply = "I capped the half line, but with a star height, not a rhyme. The sailors below couldn’t follow it. She laughed. “Same as ever.” I spent three days checking that book. She gave me the purser’s cabin on her book ship and sat on a stool in the doorway. Each time I corrected a distance she reworked a rhyme, then read it back to me, and wherever it didn’t flow we argued again. On the second evening we argued hardest, over how many watches to give the run from Muscat to Hormuz. She slapped the book down on the table; I set my kamal down on the book. By the third day the book was full of both our hands, hers large and mine small, crowded together on the same lines. She closed it and wrote two names on the title page, hers first and mine second. Then she thought about it, struck them out, and wrote them again the other way around. “The next book,” she said, “the same way.”"
effects = [{}, {}, {}, { title = "New Rhymes at Hormuz" }]

[tracks.reunion_rania.chapters.reunion.choices.love]
text = "Don’t cap the verse. Sing her the line on the song sheet that no one could reach."
hint = "The line rises in your throat and goes back down. What you couldn’t say back then, you can’t sing now."
reply = "I didn’t cap the verse. I took the sea-song sheet out from inside my coat, one corner missing, its folds worn white. Then I sang the line. The sailors on the wharf went silent, the men unloading stopped with their hands full, and even the cat that guarded the book ship’s hold sat stock-still. The line climbed and climbed and went all the way to the top, steadier than that time aboard ship off Mocha. When I finished, Rania stood there with the book of verse still in her fist. She came to me and buried her face in my shoulder, and after a long moment she said, muffled, “I’ve been waiting five years for that line.” She lifted her head and kissed me. Someone on the wharf started whistling. She turned and glared at them, then turned back and didn’t let go of me. Later she took a small cloth bundle from inside her robe. In it was the missing corner of the song sheet. She forgot to return everything she ever borrowed, she lost things as a matter of habit, and in five years she had not lost this."
effects = [{}, {}, {}, { title = "New Rhymes at Hormuz" }]

[tracks.reunion_rania.chapters.reunion.variants.with_zahra]
text = "In 1561 my ship put in at Hormuz. A row of crates stood stacked along the wharf, and Rania was up on the tallest one, reading new verse to the sailors. She gave a line and the sailors below answered with the next. When they got it wrong she banged the crate with the book in her hand and shouted, “Wrong! Again!” and they roared with laughter and tried again. Her book ship had just come in from the Red Sea and lay alongside, hatches open: half cargo, half books, the bundles of books all under oilcloth. Half the books on board, she said, were for a woman scholar in Zabid, and when she came to “she,” her voice went soft. At the end she held back one line. She jumped down off the crate in a puff of dust and pushed a finished copy of sailing verse into my hands, its cover new, three lines of stitching down the spine. “The second line—” She paused, looking at me. “This time, you take it.”"
