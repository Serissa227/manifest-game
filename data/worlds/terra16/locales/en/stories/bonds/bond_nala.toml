# 断弦（bond_nala）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Nala、Tariq、Fez、Granada、the Albaicín、Algiers、the Qarawiyyin、the mellah、the Andalusi quarter。

[tracks.bond_nala]
name = "Nala: The Broken String"

[tracks.bond_nala.chapters.c1]
title = "The Broken String"
text = "A wedding in the Andalusi quarter. The soldiers have only just left the city and the walls at the end of the lane are still black, but this family’s drums are louder than anyone’s. The oud player is Nala, the musician’s daughter, her fingers too quick to follow. At the part where the bride comes through the door, the whole courtyard is clapping along—then a twang, a string snaps, and the loose end lashes the back of her hand. The clapping stops dead. Everyone looks at her. I’ve been waiting all night for a chance to show off, so I push forward with my own oud. “Use mine! Brought it from Algiers, fresh strings—” She doesn’t even glance at me. She plays on with the strings she has left, shifting the missing notes onto the others, and it sounds better than before. When she finishes, the groom’s old mother mutters from the steps, “A string breaking at a wedding. Bad luck.” The courtyard starts to buzz with it. Nala crouches, winds the broken string into a neat coil and tucks it up her sleeve, then looks up at me like I’m a guest who talks too much. “Put your oud away. You’re the one who came in with the Turkish soldiers, aren’t you?”"

[tracks.bond_nala.chapters.c1.choices.find_a_string]
text = "Promise to bring her a good string tomorrow."
reply = "I make the rounds of every instrument shop behind the dye works, let an old man lecture me for an hour on how gut strings are dried and twisted, and buy the most expensive one he has. First thing next morning I’m at her door with it. She fits it while I watch, plucks it twice and frowns. “Too tight.” I offer to go and change it, and she pushes me out the door. The day after, there’s another wedding. I squeeze into the crowd to look—and the new string on her oud is the one I bought."

[tracks.bond_nala.chapters.c1.choices.joke_it_over]
text = "Jump on the steps and drown out “bad luck” with a joke."
reply = "I hop up on the steps and announce that the string snapped at the sight of the bride, and the next one will hold out till the groom’s beard goes white. The courtyard roars. Even the groom’s old mother laughs and swears at me, and nobody mentions bad luck again. Only Nala doesn’t laugh. On her way out she passes me and says, “My stage doesn’t need your jokes to hold it up.” Two steps later her shoulders shake. She’s laughing after all."

[tracks.bond_nala.chapters.c2]
title = "This Time You Sing"
text = "Nala is teaching five or six children to sing a nuba in her father’s courtyard, and she’s put me on a hand drum at the side to keep time. Before we’re halfway through I can’t help myself: I teach the children to sing “nightingale” as “alley cat,” then do the old oil seller next door and his cough. The children roll on the ground laughing and the beat falls apart. Nala lays her oud across her knees. “You sing this time—no hiding behind a joke.” The courtyard goes quiet. Every child is staring at me. I clear my throat and sing the one my grandmother taught me, the Granada song about the water channels in the city and a window that faces south. In the third verse the next line simply isn’t there. I stand with my mouth open. She sings it for me—every word right, and she even takes her breath in the same spot my grandmother always did. When the line is done she stops and looks at me. “You know this one?” “My grandmother taught me. You?” “My mother.”"

[tracks.bond_nala.chapters.c2.choices.finish_it]
text = "Keep singing, and finish it even off-key."
hint = "To her I’m still a corsair brat who’s all mouth. She won’t stay with me to the end of this song."
reply = "I keep going, each line a little further off-key than the last, and the children laugh with their hands over their ears. She plays along the whole way, never stopping, never correcting me, until the last line, when she lays her palm on the strings. “Your grandmother sang it the Albaicín way. My family’s from another street—our ending goes down.” She stands the oud against the wall. “Come back next week and sing me your version from the start. I’ll write it down.”"

[tracks.bond_nala.chapters.c2.choices.play_instead]
text = "Where the words run out, finish it on the oud."
reply = "I fetch my oud and play the second half instead. My fingers behave better than my voice; not one of my grandmother’s little turns goes missing. Nala listens to the end and nods. “Your hands are more honest than your mouth.” The children clamor for me to play it again. She doesn’t stop them. She goes and sits on the steps and hums the words softly under the oud until the end."

[tracks.bond_nala.chapters.b1]
title = "The Old Oud in the Window"
text = "In September the new king’s soldiers marched in, and the city changed its flags and its money. Nala says a shop in the mellah sells good strings and leads me through the narrow Jewish streets. At the instrument shop she doesn’t go in. She stops in front of the window. Hanging inside is an old oud, its face ringed with mother-of-pearl, one small piece missing, like a bite out of the moon. She looks at it so long that the shop boy pokes his head out. “That’s my mother’s oud,” she says. “Two years ago we ran out of grain. My mother traded it for two sacks of wheat.” She takes a little cloth bag from her sash and weighs it in her hand. It clinks—the old king’s copper and the new king’s silver mixed together. She ties it shut. “Still a long way off.” Then she walks away, fast, so fast I have to trot to keep up. Only at the corner does she remember that we came to buy strings."

[tracks.bond_nala.chapters.b1.choices.ask_the_price]
text = "Pull her back and ask the owner what the oud costs."
hint = "She’ll tell me her family sold the oud, but she won’t let the shop see her come back for it. She won’t let me walk through that door with her."
reply = "I tug her sleeve and steer her back into the shop. The owner names his price and her face goes white. I don’t leave. I start on him with the chip in the inlay, move on to a hairline crack in the neck, then point out that hardly anyone in Fez plays these old-style ouds anymore, and he could hang it there till next year without a buyer. Half an hour of that and the price is down by half, and he agrees not to sell it to anyone else for now. Outside, she weighs the bag again. “So that mouth of yours is good for something.”"

[tracks.bond_nala.chapters.b1.choices.look_away]
text = "Pretend you didn’t see her looking, and go buy strings."
reply = "We try another shop. She picks up a string, looks at the price, and puts it back. All the way home neither of us says a word. At her door she stands for a moment. “Thank you for not asking.” The next day when she plays, I see that the place where the string broke has an old string on it, darker than all the rest."

[tracks.bond_nala.chapters.b2]
title = "Holding the Drone at the Majlis"
text = "The white-bearded old musician of the Andalusi quarter is holding a poetry evening, and the room is full of old people from Granada, a few of whom were carried onto the boats as babies. He asks Nala to sing a passage alone, then looks at me. “You play for her.” He keeps a daf on his own knee, tapping it slowly: dum, dum-ta. Everyone here knows music, and my fingers are itching. At Nala’s second line I get quick, throw in a run of ornaments, and jump into the next phrase while she’s still taking a breath. The daf stops. So does she. She turns her head and says, in front of the whole room, “You follow me. I don’t follow you.” The old people all laugh; one old woman laughs till she has to wipe her eyes with her sleeve. My face is burning, my fingers still pressed to the strings. The old musician doesn’t laugh. He lays his palm flat on the drum and waits."

[tracks.bond_nala.chapters.b2.choices.hold_steady]
text = "Drop the ornaments and hold the plainest drone with the drum."
hint = "She doesn’t yet believe I’d put my skill away for someone else. She’d rather sing this passage alone."
reply = "The drum starts again. I play nothing but the two low notes underneath, one after the other, like oarsmen pulling to the drum. When she reaches the part about leaving home, half the old heads in the room go down, and the woman who laughed till she cried is crying for real now. Afterward she presses a piece of rose sweet into my hand. “Good drone today. Better than all your ornaments.”"

[tracks.bond_nala.chapters.b2.choices.let_her_solo]
text = "Stop playing and leave the passage to her alone."
reply = "I lay the oud flat and rest my hands on my knees. She sings the passage unaccompanied, and the room is so quiet you can hear the lamp wicks. The old musician says, “The girl has her mother’s voice.” She glances at me and says nothing. But when the next passage begins, she gives me a nod to play on."

[tracks.bond_nala.chapters.a1]
title = "Tuning with No One Listening"
text = "Dusk, and Nala is tuning on her roof. No one has asked her to play and there’s no wedding to play for; she is just tuning. Her little bag of oud money sits untied at her feet. She turns a peg, plucks, tilts her head, turns it back a hair. I sit by the carpets hung out to air and watch for the best part of an hour without understanding what she’s doing. Then the call to prayer begins. It starts over at the Qarawiyyin, the nearer minarets take it up, and it rolls in layer after layer across the roofs. The string under her hand lands right on that note and hums along with it. So that’s what she was waiting for. When the call has faded she turns. “Bored?” “No.” It’s the truth, and I’m a little surprised myself. She makes a small sound and starts a slow tune. In the third line one note comes out half a step off, harsh as anything. She doesn’t stop. She doesn’t even lift an eyebrow. She just plays on."

[tracks.bond_nala.chapters.a1.choices.hum_her_mistake]
text = "When she finishes, hum the whole tune back—wrong note and all."
hint = "To hum her own mistake back at her, I’d have to know her well enough not to mind the glare."
reply = "When she’s done I hum the tune through from the start, and in the third line I hum that half-step-off note exactly the way she played it. She stops and glares at me, and the glare turns into a laugh. “You even remember the wrong ones.” By the time it’s fully dark her mother has called up twice for supper, and we’re still on the roof. When I get up to go, she says to her strings, “Tomorrow at dusk I’ll be up here tuning again.”"

[tracks.bond_nala.chapters.a1.choices.coin_in_jar]
text = "While she bends over the pegs, slip a silver coin you earned writing poems into her bag."
hint = "Before I put anything in her purse, she has to know me well enough not to take it as charity. That’s the one thing she can’t stand."
reply = "I earned that coin a few days ago in the market, writing a love poem for someone. New king’s silver, shiny enough to sting the eye. When she packs up she lifts the bag and knows at once. She tips the coin out and turns it over and over in the last of the light. She doesn’t give it back. “I’m putting this one in the accounts,” she says. “The day I buy the oud back, the first song is yours.”"

[tracks.bond_nala.chapters.a1.choices.ask_the_tower]
text = "Ask her why she waits for the minaret to tune by."
reply = "She plucks that string again and lets it ring a little longer in the echo. “My mother says that’s how she tuned in Granada too. Every house tuned to the call from the tower, so the whole city’s ouds were on one note.” She settles the oud upright. “Those towers have bells in them now.”"

[tracks.bond_nala.chapters.a2]
title = "Rose Sweets"
text = "Nala brings a little clay jar from her aunt’s kitchen, its mouth tied over with oiled paper, and plants it in front of me. “Rose sweets. That’s for two years of keeping time for me in the courtyard. Don’t think I’d forget.” She makes a point of telling me her aunt went lighter on the scent this time. “Otherwise you’d think you were eating perfume.” There’s still a dusting of flour on the jar; it’s come straight from the stove. When the paper comes off, the whole room smells of roses. The sweets are cut in small pink squares, scattered with chopped almonds. The moment I pick one up she’s watching me, very seriously, the same way she listened at the poetry evening for whether I’d rush the beat. I put it in my mouth. She leans in a little. “Well?”"

[tracks.bond_nala.chapters.a2.variants.coin]
text = "Nala brings a little clay jar from her aunt’s kitchen, its mouth tied over with oiled paper, and plants it in front of me. “Rose sweets. That’s for the silver coin on the roof. Don’t think I’d forget.” She makes a point of telling me her aunt went lighter on the scent this time. “Otherwise you’d think you were eating perfume.” There’s still a dusting of flour on the jar; it’s come straight from the stove. When the paper comes off, the whole room smells of roses. The sweets are cut in small pink squares, scattered with chopped almonds. The moment I pick one up she’s watching me, very seriously, the same way she listened at the poetry evening for whether I’d rush the beat. I put it in my mouth. She leans in a little. “Well?”"

[tracks.bond_nala.chapters.a2.choices.take_the_jar]
text = "Keep the jar, and say you’ll eat one whenever you’re homesick."
hint = "A whole jar of her aunt’s work is a heavy thing. We aren’t close enough yet for me to take it from her hands."
reply = "“Homesick for which home?” she asks. “The one in Granada.” I touch my grandmother’s door key where it hangs at my belt. “I left when I was three. I don’t remember anything. Only that my grandmother said there were roses in the courtyard.” She doesn’t say anything more. She pushes the jar further into my arms, then ties the oiled paper back on and knots it tight."
effects = [{}, {}, {}, { title = "Rose Sweets" }]

[tracks.bond_nala.chapters.a2.choices.feed_her_one]
text = "Keep the jar, and hold a sweet up to her lips."
hint = "The jar is too much, and that hand would reach too close. There haven’t been enough dusks on the roof yet; I don’t dare."
reply = "I pick one up and hold it to her lips. She freezes, opens her mouth without thinking, and in it goes. With the sweet in her mouth she can’t say a word, and slowly she turns red, the same color as the sweet. It’s a while before she swallows. “Too sweet.” Then she takes another from the jar and eats that one herself."
effects = [{}, {}, {}, { title = "Rose Sweets" }, {}]

[tracks.bond_nala.chapters.a2.choices.perfume_joke]
text = "Chew a bit, and say it still tastes like perfume."
reply = "“Like chewing a bottle of scent.” Before I’ve finished, she’s snatched the jar back. “Then don’t eat them.” The next day she brings it back, half empty. “The ones that tasted most of perfume,” she says, “I ate for you.”"

[tracks.bond_nala.chapters.s]
title = "The Time It Was Sung Through"
text = "At the end of the year a letter comes from Algiers: in the spring there’s a galiot in the harbor that will be mine to command. My teacher at the Qarawiyyin sighs and signs off my books. Nala hears and asks nothing. At dusk she pulls me up onto her roof. The oud is already tuned; the call to prayer has just died away. “If you’re going, go,” she says, holding the oud close. “But before you do, you’re singing that Granada song start to finish. And this time you don’t forget the words.” “And if I do?” “Then you don’t leave.” She says it with a perfectly straight face, her fingers already on the strings. Downstairs her aunt is scolding the cat, and the smell of the dye works drifts over on the wind. The line I got stuck on in that courtyard that summer, I’ve said to myself every night before sleep for days now—but standing in front of her, my throat is still tight."

[tracks.bond_nala.chapters.s.choices.promise]
text = "Sing it through; promise that in Fez you’ll sing for her before any jokes."
hint = "A promise like this only comes once I’ve sung for her, stumbled in front of her, and come to know her through and through. Or else I’ve already said these words to someone else."
reply = "I sing it from the top. The water channels, the south window, the long note my grandmother drew out, line after line. At the place where I stuck, my voice shakes, but the words hold. Her oud stays with me all the way, and on the last note she lays her palm across the strings. “This time, you pass.” I tell her that whenever I come to Fez, the moment my ship docks I’ll come up to this roof and sing it once before I tell a single joke. She says I can skip the jokes. She takes something from her sleeve and puts it in my palm: a gut string wound into a tight coil, the one that broke at the wedding nearly three years ago. “Your pledge. Turn up one day without singing and I’ll strangle you with it.” I wind the string three times around my grandmother’s door key and tie it off. She looks at the key and doesn’t ask which door it opens."
effects = [{}, {}, { title = "The Time It Was Sung Through" }, {}, {}, {}]

[tracks.bond_nala.chapters.s.choices.heart]
text = "Stop before the last line and let her take it; finish it together when you’re grown."
hint = "Leaving the last line for her takes more than knowing her well. It takes all those dusks on the roof, that jar of sweets, laid down first. Or else I’ve already saved a line like that for someone else."
reply = "I sing it line by line, and at the last line I stop. Her oud stops too. She looks up at me. “The last line’s yours,” I tell her. She opens her mouth, sings half of it, and stops. On the roof there’s only the sound of the airing carpets flapping in the wind. She looks at me for a long time. “The other half can wait till you come back,” she says. “When you’ve grown into a proper man who can stand up in front of people without a joke to hide behind, come back and we’ll finish it together.” I say that will take years. She says she can wait; she’s been saving for that oud for four already. The stairs are dark on the way down. She goes first, reaches back without looking, and finds my hand—the one I play with. Only when we reach the courtyard and the lamplight falls on us does she let go."
effects = [{}, {}, {}, {}, { title = "The Time It Was Sung Through" }, {}, {}]

[tracks.bond_nala.chapters.s.choices.own]
text = "Set terms first: the day she buys back her mother’s oud, you’re her first listener."
reply = "I don’t start singing. First I set my terms: when she buys back the oud in that window in the mellah, the first song is mine. “Then you’d better pay,” she says. “The first song costs the most.” “I’ll take a shipload of cargo to pay for it.” “I knew you’d say that.” She plucks a string. “Cargo, never people—you say it every day. You remember it better than your grandmother’s poems.” I tell her of course I do: I can lose a line of poetry, but I can’t lose my livelihood. She swears at me, sets the oud on her knee and says, “We’ll settle the price later. The song gets sung today.” At the place where I stuck all those years ago, I stick again. She doesn’t sing it for me. She plays a little interlude and waits for me to find my own way into the next verse."

[tracks.reunion_nala]
name = "Nala: Home in the Song"

[tracks.reunion_nala.chapters.reunion]
title = "Home in the Song"
text = "Six years later I come back to Fez. A family in the Andalusi quarter is holding a poetry evening; the courtyard is packed and there’s a ring of people standing at the gate. Word is that Nala is singing tonight, that her fee was agreed before she sang a note, and that she picks the songs herself without the host getting a word in. I squeeze in by the wall. She sits in the middle of the courtyard with an oud in her arms, and even from the wall I know it by the little piece missing from its ring of mother-of-pearl. In a corner a young scholar has a notebook open on his knee, copying each line as she sings it, his pen racing as if chasing her. When she finishes a passage she lifts her eyes, sweeps the room, and sees me. No smile, no pause—just a lift of the chin in my direction. For the next song she plucks the strings twice, and it’s the Granada song. At the line I got stuck on all those years ago, she glances my way, and the corner of her mouth twitches."

[tracks.reunion_nala.chapters.reunion.variants.romance]
text = "Six years later I come back to Fez. A family in the Andalusi quarter is holding a poetry evening; the courtyard is packed and there’s a ring of people standing at the gate. Word is that Nala is singing tonight, that her fee was agreed before she sang a note, and that she picks the songs herself without the host getting a word in. I squeeze in by the wall. She sits in the middle of the courtyard with an oud in her arms, and even from the wall I know it by the little piece missing from its ring of mother-of-pearl. In a corner a young scholar has a notebook open on his knee, copying each line as she sings it, his pen racing as if chasing her. When she finishes a passage she lifts her eyes, sweeps the room, and sees me. No smile, no pause—just a lift of the chin in my direction. For the next song she plucks the strings twice, and it’s the Granada song. At the last line she stops, her hand on the strings, and looks at me across the whole crowded courtyard. The scholar’s pen hangs in the air, waiting a long time for a second half that doesn’t come."

[tracks.reunion_nala.chapters.reunion.default]
effects = [{ text = "Tariq—You didn’t come. I sang at eleven poetry evenings in Fez this year, and at every one I watched the gate. I don’t blame you. I know how it is at sea: ships are harder to wait for than people. I have the oud back. The winter before last I finally had enough, and I carried it home from the mellah without daring to walk fast in case I fell. The chip in the inlay is still there. I didn’t have it mended—mended, it wouldn’t be my mother’s anymore. The day I bought it back, the first song was for my mother. She didn’t praise it. She just reached over, turned one of the pegs back half a turn, and said that was how she used to tune it. The second song should have been yours. You weren’t here, so I didn’t play it. I still owe you that one. I’m sending you a sheet of music with someone who’s traveling your way. It’s the Granada song. I had a man from the copyists’ shop take it down line by line as I sang it: the water channels, the south window, all there, even the long note your grandmother used to draw out. Your version and my family’s aren’t the same, so I wrote both, yours on top. Beside the last line is something in my own hand: this time, you sing. You’ll know my writing. Next time your ship comes in, come and sing first, and tell your jokes after. Or don’t come, if you can’t—but don’t lose that sheet. —Nala" }, {}]

[tracks.reunion_nala.chapters.reunion.choices.friend]
text = "Hear her out; promise that in Fez you’ll always come to hear her sing first."
reply = "When it’s over she counts the host’s money twice, very carefully, then drags me off to a little cookshop by the market and orders a pot of mutton. Her treat, she says. I ask about the oud. She bought it back the winter before last, she tells me, with wedding tips, poetry-evening fees, and what she’d saved these past years singing her way back and forth to Algiers. “The day I bought it back, the first song was for my mother.” She runs a finger over the chip in the inlay. “The second was yours. You weren’t here, so I played it to the road to Algiers.” “That still counts.” “It counts.” She ladles more broth into my bowl. “From now on, whenever you’re in Fez, you come and hear me sing first. After that you can tell all the jokes you like.” I tell her I’ve saved up a bellyful—sea jokes, Algiers jokes, jokes about Spaniards. Then tell them one at a time, she says, and for every one that isn’t funny, you sing a song."
effects = [{}, {}, {}, { title = "Home in the Song" }]

[tracks.reunion_nala.chapters.reunion.choices.love]
text = "Stay after the guests go, and carry her oud home for her."
hint = "That night on the roof, the words never came out. Standing in front of her now, they still won’t."
reply = "The guests are gone and the host’s servants are taking down the lamps. I take the oud case from her and sling it over my back. “I’ll walk you.” She doesn’t argue. We go through the narrow lanes of the Andalusi quarter and she tells me about the years: singing on the docks in Algiers, making the groom’s uncle cry at a judge’s wedding, saving right up to that last winter and going hungry to knock on the door of the shop in the mellah. I tell her about the sea, and halfway through I notice she isn’t listening. She’s looking at me. At her door she takes the oud off my back and holds it in her arms. “You carry it steadier than I do.” “And the other half of the line?” She tips her face up and kisses me. Everyone on this street is from Granada; somewhere a shutter opens and closes again. Then, with her mouth at my ear, she sings the other half through."
effects = [{}, {}, {}, { title = "Home in the Song" }]
