# 卡比尔：风变了（bond_kabir）与重逢（reunion_kabir）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_kabir]
name = "Kabir: The Wind Changed"

[tracks.bond_kabir.chapters.c1]
title = "Only Fit to Watch Stars"
text = "The little lateen boats raced across the outer anchorage all morning, and Kabir’s bow was the first to run up the sand. He jumped into the water, soaked to the knees, and lifted his chin at the classmates on the beach. “A Gujarati pilot has no business losing to Arabs.” Then he saw the star table under my arm and added, “Girls can watch the stars. Steering is a man’s job.” I didn’t answer back. I picked up half a broken oar and drew his last turn in the wet sand: the marker, where the wind came from, the moment the sail swung across. “Here. How far did you let the sail out?” He thought I was looking for a way to save face. He snorted, crouched, and snatched the oar from me. “Too far. This far. The wind presses in, the sail fills, and the bow whips around faster.” He scratched two more lines in the sand, talking faster and faster, and didn’t budge even when the surf licked at his heels. When he finished the last stroke he looked up at me with his mouth open, and it stayed open a long while. There was another race next month, and his opponent was crouching right in front of him."

[tracks.bond_kabir.chapters.c1.choices.copy_diagram]
text = "Copy the sail diagram from the sand into my notebook without a word of praise."
reply = "I copied it stroke by stroke while he crouched beside me watching. Before long he jabbed a finger at it. “You’ve drawn that angle too small.” I told him to fix it, then. He grabbed the charcoal and fixed it, and while he was at it he wrote in the margin how much sheet to ease when the wind leans on you. He shoved the notebook back at me, and only then did it dawn on him: he’d taught me for free again. He stood up and kicked the sand hard. All of it flew into the surf. Not one grain landed on my notebook."

[tracks.bond_kabir.chapters.c1.choices.ask_more]
text = "Keep asking: what if the wind leans in from the other side?"
reply = "He went from port to starboard, from running free to beating, until the sun sank into the sea and his voice was hoarse. As he left he turned and pointed at me. “If you win next time, you don’t get to say I taught you.” I said fine. You taught me, and I won’t say so. He was seven or eight steps off before he worked out what was wrong with that. He spun around to argue, but I already had the star table under my arm and was heading back to the school ship."

[tracks.bond_kabir.chapters.c2]
title = "The Wind Changed"
text = "In the second race my bow touched sand first. Kabir came in half a length behind, dropped his lines, jumped ashore, and the first thing out of his mouth was, “The wind changed.” I took a sheet of paper from my robe and held it out. Before the race I had spent the whole morning on the anchorage, writing down the wind every quarter of an hour, line after line, the ink not quite dry. “You pick,” I said. “Which part counts as changing.” He took it and read from the top down, reached the bottom, and turned back to the top. The sun dried the paper and he still hadn’t spoken. At last he folded it and gave it back, walked to his boat, bent, and shoved her another half foot into the shallows, her keel grinding on the sand. “Next time,” he said with his back to me, “we start from the same line.”"

[tracks.bond_kabir.chapters.c2.choices.same_line]
text = "Agree: next time the same starting line, and we haul the marker stones together."
hint = "He turns on his heel and says there’s nothing to race you for. You don’t know each other well enough yet."
reply = "We each hugged a stone and waded out to set them on one line. He scratched a mark into his with the point of his knife, then scratched the very same mark into mine. “Whoever cheats is a dog on the Khambhat docks.” In the third race I was ashore first again. He climbed out, opened his mouth, and the old excuse got as far as his lips before he swallowed it. All he said was, “Again.” A few steps off he muttered something about steering being a man’s job, so quietly he might not have heard it himself."

[tracks.bond_kabir.chapters.c2.choices.let_him_say]
text = "Let him blame the wind and don’t argue."
reply = "I tucked the paper back into my robe and said nothing more. He stood by his boat waiting for me to answer back. He waited a good while, then got bored with it himself and started picking at a blob of pitch on the gunwale. “Actually,” he said, “I turned too early.” He said it so softly that a wave breaking just then nearly swallowed it."

[tracks.bond_kabir.chapters.b1]
title = "One Answer, Two Voices"
text = "At the autumn star examination the old pilot spread his star table on the long cabin table, weighted both ends, and put Kabir and me in one group. “This year’s northeast monsoon. What day do you sail? Give me the day, and give me the reason.” Kabir counted on his fingers, days onward from Nayruz, loud and quick. “Day two hundred and eighty. Can’t be wrong.” I was looking at the column of currents along the edge of the table. “You can’t go that day. The water’s pouring in through the strait. No ship gets out.” He glared at me, didn’t argue, and passed me his charcoal. “Go on, then.” The old pilot asked, “Who answers?” Kabir looked at me first. I gave the water, and only then did he pick it up and give the date, each sentence catching the end of the last, as if we had rehearsed it. When we were done the old pilot drew a fingernail across the table. “One thing’s wrong.” We both bent to look at once, and his finger and mine came down on the same line."

[tracks.bond_kabir.chapters.b1.choices.joint_fix]
text = "Fix that line with him and hand it in again."
reply = "We crouched by the table, one of us reading out the currents, the other counting days, and checked it twice more before we handed it in. The old pilot looked it over and nodded. “Two who argue their way to an answer beat one who mumbles it alone.” Outside the cabin Kabir said the mistake was his. I said I should have caught it. He said it was his. I said it was mine. We argued all the way down the ladder before he finally shut his mouth and glared at me. “With you, even owning up turns into a contest.”"

[tracks.bond_kabir.chapters.b1.choices.credit_him]
text = "Tell the old pilot the date was his work; I only read the water."
reply = "Kabir’s head whipped around. “You read the water! Without the water, the best date in the world is worth nothing.” The old pilot rolled up his table. “Quiet, both of you. Two of you, and each gets the credit.” Outside, Kabir walked ahead of me all the way to the rail before he turned around, his voice low. “Next time it’s my turn to answer, I’ll say the same about you.”"

[tracks.bond_kabir.chapters.b2]
title = "The Poem He Learned in Secret"
text = "At supper Kabir started up his old tune again: Arabs can only turn a route into poetry, and when it comes to actually piloting a ship, you want a Gujarati. Nobody took the bait, and he didn’t take it back. Yet the next morning my rain-soaked star tables were laid out one by one on the stern to dry, weighed down with his sandals. That night I went aft to collect them and heard someone murmuring behind the tiller. “…on the night the north wind turns back, let the bow lean first toward land…” It was my great-grandfather’s poem, the part about the monsoon turning. At the fourth line he stuck, and started over. I stepped on a plank that creaked. Kabir shot upright and pointed at his feet. “I’m counting planks. There are… twenty-three in the stern.” I went on from the line where he had stuck. When I finished, his finger was still pointing at his feet, and he couldn’t count any further. After a long while he crouched and picked at a loose plank. “I got it from your family’s copy. You left it in the cabin, and I read one part. I just wanted to know how the monsoon part is really sung.”"

[tracks.bond_kabir.chapters.b2.choices.teach_verse]
text = "Don’t ask for it back. Teach him how the monsoon part is sung."
hint = "He stamps the plank back into place and says there’s no poem at all. You don’t know each other well enough yet."
reply = "I sang a line and he sang it after me. Where the tune shifts he came in half a beat late, caught it on the second time through, and on the third he was truer than I was. When we were done he sat on the planks a long time before he spoke. “From now on I won’t tell anyone where I learned this.” I said if he did tell, he should say it came from Najma’s family. He thought about it and nodded. “Then that’s what I’ll say.” At supper the next day he didn’t mention Gujaratis once."

[tracks.bond_kabir.chapters.b2.choices.demand_credit]
text = "From now on, before he recites it, he has to say whose poem it is."
reply = "“Why should I?” I said because my great-grandfather wrote it, and it took him a lifetime at sea. He went quiet and stared at the planks for a long time. “Then every time, before I recite it, I’ll say his name first.” I thought he was just talking. Early the next morning his voice came from the stern again, and the first words were, “Ahmad ibn Majid says…” He said it properly, the way people speak at prayer."

[tracks.bond_kabir.chapters.a1]
title = "A Morning Without a Race"
text = "It was not yet light, and not a breath of wind moved on the anchorage. I went down to the beach as I did every day, and Kabir was already there. His boat sat drawn up on the sand, and he hadn’t pushed her into the water. “What are we racing today?” He shook his head and tipped his chin toward the bow. A clean piece of sailcloth was spread over the bow thwart, and beside it lay his father’s kamal, polished bright. “Sit here. You see best from here.” We sat. The east had only just gone gray when, low over the sea in the south, a star surfaced, low and brilliant and trembling. “Suhail,” he said. “First time this year.” I turned sixteen that day. I took my family’s kamal from my robe, held the knot in my teeth, and waited for the star to clear the sea. I hadn’t called the height yet, and for once he didn’t reach over to take the board from me. He just propped his elbows on his knees. “Look first. Look as long as you like. Checking can wait.”"

[tracks.bond_kabir.chapters.a1.choices.report_height]
text = "Call out the star’s height and ask him to check it."
reply = "He took the board and measured once. “Half a finger off.” I said half a finger off is fifty miles off. “Then measure it again yourself.” I measured again, the knot between my teeth, the horizon on the lower edge and the star sitting right on the upper one. This time he said nothing, just nodded once. When it was full light he got up to loose the sail. Two steps away he turned back. “Many more of these.” He didn’t wait for an answer, and waded off."

[tracks.bond_kabir.chapters.a1.choices.just_watch]
text = "Measure nothing; sit beside him and watch Suhail climb."
hint = "Sit beside him now and he’ll think you’re waiting for him to concede. You don’t know each other well enough yet."
reply = "I put my kamal back in my robe. He glanced at me and didn’t touch his father’s either. The star climbed bit by bit, and when it stood a hand high he said, “No race today.” I said all right. The sun came up behind us and drowned the star, and only then did he speak. “Many more of these.” Then he turned to look at the sea, the back of his ears red the whole time."

[tracks.bond_kabir.chapters.a2]
title = "The Width of One Finger"
text = "Kabir set a kamal down on my star table. The board was freshly planed, its corners rounded, the very image of his father’s. But the knots on the cord were different. They sat closer together than the ones on his father’s. “I measured your hand,” he said. “That day you held the board, I watched where your fingers pressed.” I picked it up. Spliced onto the end of the cord was a length of old cord gone dark, taken off his father’s board, and not one of its knots had been untied. “My father’s spacing fit his hand. It won’t necessarily fit yours. I didn’t throw the old cord out. It’s spliced on the end, so you can check against both.” I rolled one of the new knots under my thumb for a long time. “One finger off is a hundred miles off.” “That’s why,” he said, “it has to be tied to your fingers.”"

[tracks.bond_kabir.chapters.a2.choices.try_board]
text = "Wait for dark and measure the Pole Star with it, right in front of him."
hint = "He still has the board in his fist and hasn’t held it out. You don’t know each other well enough yet."
reply = "When it was fully dark we went up to the stern. I bit the knot and pushed the board out, and the Pole Star sat exactly on the upper edge. I measured three times, and three times it was eight fingers. He said nothing, just reached over and straightened the cord. “From now on this board only answers to your hand.” Back in the cabin I drew his father’s spacing in my notebook too, beside the new one, the old on the left and the new on the right."
effects = [{}, {}, {}, { title = "The Width of One Finger" }]

[tracks.bond_kabir.chapters.a2.choices.his_hand_too]
text = "Ask him to lay his fingers on it too and see how far apart our two fingers are."
hint = "Ask him to put his hand next to yours now and he’ll only think you want another contest. You don’t know each other well enough yet."
reply = "He hesitated before he laid his finger beside mine. His was wider, wider by a hair. “A little off,” he said. “A little off is still a hundred miles.” I said then don’t take the same route as me. He drew his finger back, very slowly. “Then I’ll follow behind, a hundred miles back.” He pushed the board into my hand and never asked for it back."
effects = [{}, {}, {}, {}, { title = "The Width of One Finger" }]

[tracks.bond_kabir.chapters.a2.choices.keep_father]
text = "Tell him not to touch his father’s board; it’s what his father left him."
reply = "“I haven’t.” He flipped open his collar. His father’s board still hung safe at his neck. “This one’s new. I only borrowed a length of old cord.” He waited for me to hold out my hand. I didn’t. He stuffed the new board back inside his shirt, hard. “Then it stays with me for now. Whenever your fingers want it, come and get it.”"

[tracks.bond_kabir.chapters.s]
title = "When You Beat Me Once"
text = "One by one the ships on the anchorage weighed anchor. The ship Kabir had a berth on would leave for Khambhat the day after tomorrow; an old pilot there was waiting to take him on. My ship had another month to wait for the wind. His father’s kamal hung at his neck, showing outside his collar. He came down to the beach to find me with a sheet of paper in his fist: his ship’s sailing schedule, dates and tides, written out neatly. “For you,” he said. “There’s still one race we haven’t run.” I took it. He didn’t leave. He stood there scuffing his toe into the sand until he had dug a little hollow. “There’s one more thing,” he said, lower than usual. “Race or no race, I want to tell you.” He was looking at the sea, not at me. The tide came in, filled the little hollow, and drew back."

[tracks.bond_kabir.chapters.s.choices.promise]
text = "Promise him: one more race when I’m back, and win or lose, I’ll come tell him."
hint = "You haven’t come far enough together for a promise like that, or you have already made your once-in-a-lifetime promise to someone else. This time all you can promise is a race."
reply = "“Win or lose, you’ll tell me?” He swallowed whatever he had been about to say and changed his tone. “Then you’d better come back alive to lose.” I said he would be the one losing. He laughed out loud and pulled another sheet from his shirt: a month of tides in the Gulf of Khambhat, springs and neaps, every rise and fall, packed into tiny squares. “At the mouth of Khambhat, out of every ten ships that try it with a stranger at the helm, three end up sitting in the mud waiting for the next tide.” He pushed it into my hand. “If your ship wants in, I’m the only one who brings her. Don’t go hiring anyone else.” I said that depended on whether he’d finished his training by then. “I will have,” he said flatly. “The day you come, I’ll be the best pilot in Khambhat.” I laid the two sheets together and folded them, and he watched me fold them and didn’t bring up that other thing again. The day his ship sailed, he stood at the stern until I couldn’t see him anymore."
effects = [{}, {}, {}, {}, {}, { title = "When You Beat Me Once" }, {}]

[tracks.bond_kabir.chapters.s.choices.heart]
text = "Let him finish what he’s trying to say, then answer: when you beat me once."
hint = "It isn’t his turn to say that yet. You haven’t come that far together, or you have already made your once-in-a-lifetime promise to someone else."
reply = "He turned to face me, held it in a long moment, then said it all in a rush. “I like you. Since the day you drew my sail angle in the sand.” Then he shut his mouth tight, as if afraid another word would slip out. I looked at him. “When you beat me once.” He stared. “How many years is that going to take?” I said that was up to him. He thought, head down, then took hold of the loose end of the cord on my new kamal and tied one more knot in it, a little farther in than all the others. “That knot’s mine.” Then he squeezed my hand, hard, and let go at once. “Then I’ll go home and practice every day.” He backed off two steps and stopped. “The day I win, you have to finish answering.” I said all right, I’d wait for that day. He turned and ran, and one foot came down flat on the little hollow he had dug."
effects = [{}, {}, {}, {}, {}, { title = "When You Beat Me Once" }, {}]

[tracks.bond_kabir.chapters.s.choices.own]
text = "Agree: next time we meet we’re rivals, and nobody gives an inch."
reply = "His eyebrows went up. “When did I ever give you an inch?” I said he had. Every time he wanted to wheedle a figure off my star table, he let me win an argument first. That stopped him short. “That was the wind shifting. Doesn’t count.” Then he burst out laughing first and doubled over. When he was done laughing he swallowed that unfinished thing and held out his hand. I slapped it, a sharp crack that put up a flock of gulls along the beach. “Rivals,” he said. “See you in Khambhat. If you reach the mouth of the gulf and don’t dare come in, hang three flags outside and I’ll row out and laugh at you.” He was a long way off when he turned and shouted once more. “Three!” I folded his sailing schedule into a little square and tucked it into my star table."
effects = [{}, {}, {}, { title = "When You Beat Me Once" }, {}]

[tracks.reunion_kabir]
name = "Kabir: The Pilot’s First Words"

[tracks.reunion_kabir.chapters.reunion]
title = "The Pilot’s First Words"
text = "When the tide goes out in the Gulf of Khambhat it bares ten miles and more of mudflat, and the big ships don’t dare go in; they anchor outside the gulf and wait for the flood. A pilot boat slipped out of a channel between the flats and came alongside, and a man climbed the rope ladder with a pilot’s white turban wound around his head. Six years. Kabir was taller now, darker from the sun, bearded. He found his footing, and the first thing he said was, “What’s your draft?” I told him. He nodded, glanced over the rail at the color of the water, and said nothing about who won back then. “Next flood comes after noon. When the bore arrives it’s a wall, and we have to be in the channel ahead of it.” He asked to see my chart. I unrolled my old star chart, the one I drew in our school years. His finger traveled down the coast and stopped. “This should have been surveyed again long ago. You’ve drawn the sandbar as it was six years back. It’s moved south.”"

[tracks.reunion_kabir.chapters.reunion.default]
effects = [{ text = "Najma, this year’s tide table for the Gulf of Khambhat is enclosed. Springs and neaps both, copied neater than I ever managed at school. Every month more ships lie outside the gulf waiting on the tide. Two of them wouldn’t wait for a pilot and tried it on their own; they’re still sitting on the mudflats drying their masts. If your ship comes, send a boat in for me first. I’m the only one who brings you in. I hear you’ve gone off to other seas. My father’s kamal still hangs at my neck, and I polish it every day. There’s still one race we haven’t run. Whichever way the wind swings, we’re running it. — Kabir, Khambhat" }, {}]

[tracks.reunion_kabir.chapters.reunion.choices.let_him_pilot]
text = "Give him the helm and let him take us through the tide mouth."
reply = "He took the helm unhurried. First he had the depth sounded again, then had both anchors made ready at the bow. When the tide turned, he laid the bow on a channel between the flats that I could not see at all and called the helm stroke by stroke: two to port, back half, steady. On either side the mud was eaten away inch by inch. We had barely come alongside the stone quay when a dull roar like thunder rolled up behind us, and that white wall came driving in from the mouth of the gulf and swallowed the channel we had just come through. He put the tiller back in my hand and wiped the spray off his face. “Your ship’s not bad. Your helmsman is too stiff.” I said that was me. “I know,” he said. “All these years at the helm and still that stiff.” He took this year’s tide table from his shirt and pressed it on me. “Next time you come to Khambhat, send a boat in for me first. You keep the helm. I’ll call the channel.”"
effects = [{}, {}, {}, { title = "The Pilot’s First Words" }]

[tracks.reunion_kabir.chapters.reunion.choices.race_tide]
text = "Bet him I can bring her through the tide mouth myself, without him."
reply = "He stepped back two paces and folded his arms. “Go ahead.” I followed the channel on my star chart, and halfway in the keel scraped sand and the whole ship shuddered. He didn’t say a word, just kept his eyes on the color of the water ahead. The sound of the bore was already coming from the mouth of the gulf. On the last stretch he put a hand on the tiller, just once, then took it away and clasped it behind his back. We were inside the harbor when the wall of water broke behind us. He looked at me, and the corner of his mouth twitched. “Call it half a win for you.” I asked about the other half. He unwound his turban and wrung it out. “The other half was the wind swinging around at the mouth. That one isn’t yours and it isn’t mine.” He wound the turban back on. “Next flood, we go again. This time I won’t touch the tiller.”"
effects = [{}, {}, {}, { title = "The Pilot’s First Words" }]

[tracks.reunion_kabir.chapters.reunion.choices.you_win]
text = "Tell him: this time, you’ve won."
hint = "You never made him that promise back then. Today “won” only means won."
reply = "He was rolling up the star chart, and his hands stopped. “Won what? I haven’t even brought you in yet.” I said nothing and let him work it out. He thought for a long time, so long that the tide began to turn and the sound of water on the flats changed. Then he remembered. His ears went red first, exactly the way they had at sixteen on the anchorage. He pulled off his white pilot’s turban and crushed it in his fist. “I waited six years,” he said. “Do you know how many times I practiced?” I said I knew. I took out the kamal, and the knot on the end of its cord was still there, farther in than all the rest. He looked at it once, wound the turban back on all crooked, and took my hand, and this time he didn’t let go. “From now on, when your ship comes into Khambhat, I bring her in,” he said. “Whatever harbor it is, I bring her in. For life.” The bore thundered behind us as he took the ship into the channel, and he never once looked back."
effects = [{}, {}, {}, { title = "The Pilot’s First Words" }]

[tracks.reunion_kabir.chapters.reunion.variants.with_shadia]
text = "When the tide goes out in the Gulf of Khambhat it bares ten miles and more of mudflat, and the big ships don’t dare go in; they anchor outside the gulf and wait for the flood. A pilot boat slipped out of a channel between the flats and came alongside, and a man climbed the rope ladder with a pilot’s white turban wound around his head. Six years. Kabir was taller now, darker from the sun, bearded. He found his footing, and the first thing he said was, “What’s your draft?” I told him. He nodded, glanced over the rail at the color of the water, and said nothing about who won back then. “Next flood comes after noon. Once I’ve brought you in, I have to get to Muscat before the monsoon for a race.” He paused and straightened his turban. “Shadia’s waiting for me there. Every year she waits for me to come and lose, and when I’ve lost, she helps me haul the boat up the beach.” He asked to see my chart. I unrolled my old star chart, the one I drew in our school years. His finger traveled down the coast and stopped. “This should have been surveyed again long ago. You’ve drawn the sandbar as it was six years back. It’s moved south.”"
