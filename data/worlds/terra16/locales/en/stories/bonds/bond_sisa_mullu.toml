# 西萨·穆柳：先看采集人的手（bond_sisa_mullu / reunion_sisa_mullu）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_sisa_mullu]
name = "Sisa Mullu: Look at the Gatherer’s Hands First"

[tracks.bond_sisa_mullu.chapters.c1]
title = "Look at the Gatherer’s Hands First"
text = "The raft from the north came in past midday. A diver climbed off and tipped a basket of spondylus out onto the sand, weed still caught in the spines, and the red spread out like an evening sky. Two Spanish merchants dropped to their heels and started pawing through it, raking the biggest ones toward their own feet. Sisa Mullu didn’t crouch. She went over to the diver, lifted the right hand hanging at his side, and turned it palm up. The fingers were soaked white and wrinkled layer on layer, and under every nail were fine raw cuts, some not yet closed. She looked at it a long time before she let it go. Then she picked a shell up off the sand and turned it on her palm for the merchants to see. “However pretty the shell, count the dives it took.” She didn’t raise her voice, and she was smiling. One of the merchants laughed out loud. “An Indian girl with a heart that soft, and she thinks she can trade?” Sisa laughed too, and named her price. He pushed it down; she shook her head. He pushed again, and she set the shell gently back in the basket and named the same price, still smiling. She didn’t give up a single coin."

[tracks.bond_sisa_mullu.chapters.c1.choices.look_at_hands]
text = "Crouch by the diver too: his hands first, then the shells."
reply = "I crouched down to look at his other hand. He whipped it behind his back and rubbed it on his trouser leg, as if afraid of dirtying something. So I looked at the shells instead, and only then saw that the spines had been snapped off one by one, the breaks still white. When the day’s trading was done, Sisa was waiting for me under the awning at the market gate. She pushed a bowl of chicha across to me. “When you crouched down like that, he noticed you.” She held her own bowl and didn’t drink from it. “So did I.”"

[tracks.bond_sisa_mullu.chapters.c1.choices.pick_best_shell]
text = "Look only at the shells and point out the reddest, biggest one as the finest."
reply = "Sisa followed my finger and nodded. “It is fine.” She picked it up and turned it over to show me a fresh white scar on the underside where it had been pried loose. “This one grew on the deepest reef. He went down three times to get it.” I looked at the shell again. Its red was a little frightening. Later the merchant paid top price for it. When Sisa took the money, she counted out the few extra coins separately and pressed them into the diver’s hand."

[tracks.bond_sisa_mullu.chapters.c2]
title = "A Scale of Her Own"
text = "A Spanish merchant nobody knew had come to the market with a brass scale, its beam polished bright. He weighed spondylus a basket at a time and called out a figure, and every basket came out lighter than Sisa had guessed. She squatted beside him without a word and listened, basket after basket. After the third, she drew a wooden scale from beside the little pouch at her waist: a beam of black wood, a worn round stone hanging from one end, half a gourd for a pan. With the crowd gathering, she weighed the same three baskets again, scratching a line in the sand after each. When she had three lines, she looked up, still smiling. “Two parts in ten short.” The merchant’s face went red. An Indian scale counted for nothing, he said, and who knew what that stone weighed. The divers standing around couldn’t follow his words; they only saw him getting louder. Sisa stood and pushed the wooden scale into my hands. The beam was still warm from her palm. “You speak their language,” she said. “You tell him for me.”"

[tracks.bond_sisa_mullu.chapters.c2.choices.argue_for_her]
text = "Take the scale and explain in Spanish, point by point, where the two scales differ."
hint = "She can’t yet tell whether you’d cross a Spanish merchant in public for the sake of an Indian scale."
reply = "First I set her stone on his brass scale and made him read out its weight himself. Then I weighed one basket on each scale in turn. I explained the missing two parts in Castilian, then again in Quechua, and halfway through, the Spanish sailors watching laughed first. “Friend, your scale’s been going hungry.” The merchant had to pay by Sisa’s figure. After the stall was packed up, she sat under the awning wiping the beam with her cuff, over and over, and only stopped after the third time. “It did its part today, too.”"

[tracks.bond_sisa_mullu.chapters.c2.choices.find_third_scale]
text = "Suggest borrowing the official scale from the customs man on the quay for a third weighing."
reply = "The customs man was about to eat and didn’t like being kept from it. I told him the duty on these baskets would still go to him once they were weighed, and only then did he have the official scale carried out. It came within a hair of Sisa’s. The merchant had nothing left to say. He paid up and kicked over an empty basket on his way out. Sisa set the basket upright and gave me a very sweet smile. “So the king’s scale can be honest after all.” She tucked her own scale back at her waist and added, “Next time, I’ll need you to borrow it again.”"

[tracks.bond_sisa_mullu.chapters.b1]
title = "Shallows by the Guano Islands"
text = "“If you want to know how hard the divers have it,” Sisa said, “you have to go into the water yourself once.” We went south with my family’s raft, borrowed a small one, and paddled out to the guano islands off Chincha. We smelled them before we got close; my eyes streamed. The birds blotted out half the sky and screamed so loud we had to shout. Sisa twisted her hair into a rope, tucked it down her collar, and went in first. Even the shallows were bitterly cold. She taught me to hold my breath: three breaths, the third one full, mouth shut, sink, and don’t panic and shoot back up. The first time I came up choking the moment I went under. The second time I got a handful of slimy rock. The third time my fingers touched something hard in a crack, and I closed my fist on it and kicked for the surface. It was a little shell, dull gray, hardly bigger than a fingernail, without a hint of red. I held it up, gasping. Sisa took it and turned it over in the sunlight. “Worthless.” Then she wiped it clean on the hem of her shirt and slipped it into the little pouch at her waist. Nobody was ever allowed to touch that pouch."

[tracks.bond_sisa_mullu.chapters.b1.choices.dive_again]
text = "Go down once more. I’m bringing her up a red one if it kills me."
hint = "The water is bitterly cold. She isn’t ready to let you stay in it any longer, and she hauls you onto the raft."
reply = "“The red ones grow in the warm water up north. There aren’t any here,” she said. I didn’t listen. I went down five more times and came up empty-handed every time, and the last time my lips were purple and my teeth were chattering. Sisa hauled me onto the raft, unfastened her own cloak and wrapped me in it until only my face showed, scolding the whole time in that soft voice of hers. “You don’t need to bring me a red one. The gray one you found is plenty.”"

[tracks.bond_sisa_mullu.chapters.b1.choices.ask_why_keep]
text = "Ask her why she’s keeping a worthless shell."
reply = "“Because you found it.” It came out too fast. She stopped short, and her ears went red. She bent to untie the raft’s line, and after a while she corrected herself. “Because it was your first. Throw away the first thing you bring up, and it’s bad luck.” On the way back she let me paddle and taught me to read the color of the water for reefs: which color meant shells below, which meant only sand, and where the waves broke so hard you must never go in."

[tracks.bond_sisa_mullu.chapters.b2]
title = "The Price Board in the Market"
text = "Sisa begged an old ship’s plank from a carpenter, planed it smooth, and ruled a grid on it in charcoal: three rows for the sizes of spondylus, three columns for the colors, deep red, orange red, white-spotted. In each square she drew a shell and wrote its price beside it. She wrote the prices in Spanish numerals and put dots underneath, so anyone who couldn’t read could count the dots. She meant to hang it on the post at the market gate in Callao, where the divers from the north would see it the moment they stepped off their rafts, without having to hear a price from a merchant first. Her father saw it. He didn’t shout. He only turned the board over, face down on the ground. “Put the prices up, and who can beat them down after that? We’re merchants too, Sisa.” They quarreled that day. She never once raised her voice, and she never gave him an inch. After dark she came to find me with the half-painted board in her arms, dirt still on it from where her father had laid it face down. She leaned it against the wall and dusted the charcoal off her hands. “Six squares to go.”"

[tracks.bond_sisa_mullu.chapters.b2.choices.paint_with_her]
text = "Help her paint the last six squares and hang it at the market gate tonight."
hint = "This is between her and her father. She doesn’t want you dragged into it yet, and she won’t let you touch the board."
reply = "We painted by an oil lamp until well past midnight, she doing the shells and I the figures. When I got one wrong, she licked her finger, rubbed it out, and made me write it again. Before dawn we nailed the board to the post at the market gate, with nails I had pulled out of my family’s raft. In the morning the divers from the north crowded in front of it, counting the dots square by square, and someone reached up to touch a painted red shell. Her father came too. He stood with his arms folded and looked at it for ages, and didn’t take it down. All he said was, “This square’s priced too low.” Behind his back, Sisa winked at me."

[tracks.bond_sisa_mullu.chapters.b2.choices.talk_to_father]
text = "Talk her out of hanging it yet, and go with her to try her father once more."
reply = "Her father sat under the lamp mending a fishing net, and through a whole evening of talk he never looked up. Somewhere along the way Sisa stopped talking about prices and talked about the diver’s hands. When the net was mended, her father finally spoke: hang a small one in front of their own stall first, for one season, and see. On the way back, Sisa sawed a corner off the big board, keeping just three squares, and carried it home in her arms. “A small one will do. As long as it goes up.”"

[tracks.bond_sisa_mullu.chapters.a1]
title = "The Old Shell Not for Sale"
text = "Sisa asked me to meet her on the flat rock by the sea, and there she untied the little pouch from her waist. She never let it out of her reach, and I had always taken it for her purse. She loosened the cord and tipped out an old spondylus. Its color had long since faded to a pale pink, with red left only in a narrow ring at the rim, and its spines were worn smooth, as if someone had held it for years. The little gray shell rolled out after it. “This was my grandmother’s,” she said. “When she was young she dove for it herself, in the sea up north. Back then we weren’t merchants yet.” Two years ago a merchant from Lima had offered three times its worth. Her father had already nodded. She refused. “Not for sale means not for sale.” She laid the old shell in my palm, took hold of my wrist, and had me lift it toward the sun. “Look inside.” A thin line of light lay along the inside, fine as a hair. It ran slowly along the ridges and vanished into the ring of red at the edge."

[tracks.bond_sisa_mullu.chapters.a1.choices.hold_it_with_her]
text = "Put the old shell back in her palm, and rest my hand lightly over it."
hint = "It was her grandmother’s. You aren’t close enough yet to lay your hand on hers, so you simply give the shell back."
reply = "Her hand was colder than the shell. She didn’t pull it away, so I didn’t take mine back. We sat like that and watched the sun sink into the sea a little at a time, and the line of light in the shell dimmed with it. When it was nearly dark she spoke, so quietly the waves almost covered it. “Grandmother said this light is only for showing to someone who matters.” Then she tied the pouch’s cord again, slowly, and knotted it twice."

[tracks.bond_sisa_mullu.chapters.a1.choices.never_sell]
text = "Promise her: whoever offers whatever price, I’ll turn them down for her."
hint = "That’s a heavy thing to say. She doesn’t trust you yet with her grandmother’s shell, and she only smiles."
reply = "“Then you’d better remember what it looks like,” she said. “Or someone will bring you a fake and you won’t know.” I said I’d know it with my eyes shut. She laughed and told me to shut them. After a moment something cool and smooth pressed against my cheek, stayed there a breath, and was gone. “Is this the one?” “It is.” “Then you’ll remember.” She put the shell back in the pouch. “From now on, anyone who asks the price, I’ll send to you.”"

[tracks.bond_sisa_mullu.chapters.a1.choices.grandmother]
text = "Ask her what her grandmother was like."
reply = "“She could hold her breath longer than the men,” said Sisa, “and haggle harder than them.” On one breath her grandmother could count from one to sixty under the water; on land she could wear down a Tumbes merchant over a single basket of shells for a whole day, until he got hungry first. “I only learned the second half.” She turned the old shell over and showed me a row of faint scratches on the underside. “She cut those herself. One for every time she went down.” I counted. Twenty-seven."

[tracks.bond_sisa_mullu.chapters.a2]
title = "A Coast Painted Inside a Shell"
text = "Sisa handed me a scallop shell bigger than my palm, its inner face painted edge to edge. She had used cloth dyes, ochre, indigo, charcoal, one layer over another: at the bottom the beach at Chincha in a shallow curve; in the distance a gray-white smudge that was the guano islands, flecked with birds; on the sea two balsa rafts, and on the front one a figure leaning into a long pole. The paint had dried and felt a little rough. “At the end of the year you go north with the rafts.” She wasn’t looking at me; she was looking at the shell. “When you’re far away, hold it to your ear. You’ll hear the tide going out here.” I held it to my ear. There really was a sound inside, wave after wave, the tide drawing back and coming in again. Or maybe it was my own heartbeat."

[tracks.bond_sisa_mullu.chapters.a2.choices.take_shell]
text = "Take the shell and hold it to my ear for a long time."
hint = "She spent days painting it, and it weighs too much. You aren’t close enough yet: she can’t hold it out, and you can’t take it."
reply = "I listened so long that she reached over and tugged my sleeve. “What do you hear?” “You, laughing.” “Nonsense,” she said. “There’s nothing in there but the tide.” But she was laughing, laughing so hard her shoulders shook and the dish of paint beside her nearly tipped. She steadied the dish, took the shell from my ear, wiped the corner I had smudged with her cuff, and only then put it back in my hand."
effects = [{}, {}, {}, { title = "A Coast Painted Inside a Shell" }]

[tracks.bond_sisa_mullu.chapters.a2.choices.who_on_raft]
text = "Take the shell, and ask her who is poling the raft."
hint = "Once you ask who is on that raft, you can’t take it back. You two aren’t that close yet."
reply = "She looked at me and didn’t answer, and turned her face to the sea. The waves went out and came in, several times over, before she spoke. “It isn’t finished.” “The figure looks finished.” “The raft isn’t,” she said. “There’s only one person on it.” She put the paint dishes back in the basket one by one, lined them up neatly, and still didn’t turn around. “The day you come back, I’ll paint another one on.”"
effects = [{}, {}, {}, { title = "A Coast Painted Inside a Shell" }, {}]

[tracks.bond_sisa_mullu.chapters.a2.choices.paint_one_back]
text = "Say I’ll paint one for her in return. Fair warning: it’ll be ugly."
reply = "I borrowed her paints and worked on it three evenings running. The sea came out like a pot of soup, the two rafts like a pair of floating flatbreads, and nobody could have said who was poling. Sisa turned it over and over in her hands without once laughing, then tucked it inside her shirt and took it home. A few days later I went to her house to return the paint dishes and saw it propped at the head of her bed, against the wall, facing the pillow. She followed my eyes and didn’t pretend otherwise. “It’s ugly, but anyone can see at a glance you made it.”"

[tracks.bond_sisa_mullu.chapters.s]
title = "Coming Back, Time After Time"
text = "At the end of the year I was going north with my family’s rafts, to Paita first and then farther, with no telling what year I’d be back. The day before we left, I went to the market gate to find Sisa. The price board had gone up at last. It hung right above her family’s stall; her father had had it nailed there, square and straight. There were two more rows of shells than at first, and in the very last square was a little dull-gray shell, with “Not for sale” where the price should be. The divers from the north stepped off their rafts and, before they looked for any merchant, stood under the board with their heads tipped back. Sisa was weighing shells for someone. When she finished the basket, she handed the scale to her father and came over to me. She wasn’t smiling today. “Every time you come back,” she said, “tell me first that everyone’s safe. Then tell me what shells are fetching.” She paused, then added, “Keep track of the prices up north for me.”"

[tracks.bond_sisa_mullu.chapters.s.choices.promise]
text = "Promise her: every time I come back, the first thing I’ll say is that we’re safe."
hint = "Telling her you’re safe first, every time you return—that’s for life. Your friendship can’t dive that deep yet—or you’ve already promised someone else they’d hear it first."
reply = "“First thing, that we’re safe,” I said. “And business only second.” She held up one finger. “What shells are fetching, how heavy the scales run, which merchant’s been beating prices down, all of it goes second.” “And third?” She opened her mouth and nothing came. Her face went red first, red to the ears, nearly the color of the deep-red square on the board. “Third… third can wait.” She dug an empty little cloth bag out from under the stall and pushed it at me. Every new kind of shell I saw up north, I was to pick up the smallest one and put it in, and when I came back, tell her one by one where each was from and what it fetched. Only once the rafts were out to sea did I think to open the bag. A shell was already lying at the bottom, smaller than a fingernail, a Chincha one, with a single charcoal dot inside: the way the board marked a price. One dot, one coin."
effects = [{}, {}, { title = "Coming Back, Time After Time" }, {}, {}, {}]

[tracks.bond_sisa_mullu.chapters.s.choices.heart]
text = "Tell her that when I come back grown, I want her to paint a second person into that shell."
hint = "The second figure in that shell needs both of you to know your own hearts before it can be said. You’re one step short. Or else you’ve already promised that place in the shell to someone else."
reply = "She didn’t answer right away. She glanced up at the square marked “Not for sale,” then at me, and then she reached out and took my hand and held it tight. Her fingertips were hard where the scale beam had worn them. “Then I’ll start mixing the color now,” she said. “It has to be Grandmother’s red. That’s hard to get right.” “How long will it take?” “Until you’re back.” She didn’t let go. She led me by the hand through the market gate, past the nets drying on the sand, all the way down to the water. The rafts were waiting and someone was calling my name. Only then did she let go, open my fingers one at a time, and put something in my palm. It was the gray shell I had brought up that day off the guano islands. “Keep this for now. When you come back, I’ll want it back.” The rafts pulled away. When I looked back, she was still standing on the sand the tide had left, and she stayed there until the rafts were out of sight."
effects = [{}, {}, {}, {}, { title = "Coming Back, Time After Time" }, {}, {}]

[tracks.bond_sisa_mullu.chapters.s.choices.own]
text = "Make it a contest: she keeps the board, I run the rafts. Who will the northern divers know first?"
reply = "“Me,” said Sisa. “They come and look at the board every day.” “My rafts stop at every bay on the way north.” “You stop once and they remember you once. They look at the board every day and remember me every day.” She tapped the board with the scale beam. “You’ve lost already.” I said her name wasn’t on the board; what people remembered was the board. She stopped short, turned to ask her father for a stick of charcoal, stood on her toes, and wrote “Sisa” in the bottom right corner in Spanish letters, with a string of dots beside it. Then she handed me the charcoal. “And yours?” I said I’d write it when I won. “Write it now,” she said. “Then it’s easy to find when you lose.” I had only written the first two letters when she plucked the charcoal back out of my hand and said the rest could wait until I came home."

[tracks.reunion_sisa_mullu]
name = "Sisa Mullu: Setting Down the Basket"

[tracks.reunion_sisa_mullu.chapters.reunion]
title = "Setting Down the Basket"
text = "In 1563 my family’s raft fleet came back down from the north and beached at Callao. The price board at the market gate had been replaced, twice the size of the old one, a whole ship’s plank painted full of shells: deep red, orange red, white-spotted, and a few I had seen up north that no one here had ever painted before. A line of divers waited under it, baskets heavy on their backs. Sisa stood at the head of the line holding the black wooden scale, a bigger stone on it now. A diver who had just come in was about to set his basket on the pan when she waved him off and had him put it on the ground first, and a girl beside her ladled out a bowl of water and handed it to him. Only when he had drunk it and caught his breath did she have him bring the basket over. Halfway through the weighing, she looked up and saw me. She didn’t put down the scale, and she didn’t smile. She only asked, “Is everyone safe?”"

[tracks.reunion_sisa_mullu.chapters.reunion.default]
effects = [{ text = "You missed it. This year I asked every raft that came down from the north, one by one, and they all said they hadn’t seen your family’s flag. I’m sending this little shell with the rafts going north and told them to give it to you when they find you. What’s painted inside is Chincha. The guano islands are as white as ever, and they still stink; I can’t paint the stink, so you’ll have to remember it. There are two people on the raft, one poling and one holding a scale. You can guess who’s holding the scale. The price board’s been replaced with a big one. My father had it made. These days he tells everyone the board was his idea, and I don’t argue with him; if he’s willing to claim it, that’s enough. Now when the divers come down from the north they set their baskets down first, drink a bowl of water, and only then step up to the scale. Last month an old diver came from Manta, his hands just like that man’s on the beach that year, soaked white, cuts under every nail. I had him sit and finish his water before I weighed anything, and he said it was the first time in his life anyone had let him sit down in Callao. Grandmother’s shell is still in the pouch. A while ago someone came asking the price again, higher than last time. I said not for sale. He asked on whose say-so. I said mine. Whatever shells you see up north, whatever they fetch, keep track for me. If everyone’s safe, write that first. Business second. The third thing, tell me to my face when you’re back. Sisa" }, {}]

[tracks.reunion_sisa_mullu.chapters.reunion.choices.friend]
text = "Tell her we’re safe first, then give her the shell prices up north, one by one."
reply = "“Everyone’s safe,” I said. “Not one person lost from the rafts.” She nodded, handed the scale to the girl with the water ladle, and drew me around behind the board. Its back was still bare. She held out a stick of charcoal. “Second thing.” I started at Tumbes, went on to Guayaquil, then to a bay farther north whose name I still couldn’t say properly: where shells sold by the piece, where by the pound, where a merchant took a whole basket for one small knife. For every place I named, she wrote a line, until half the back of the board was full, and then she read it all through from the top. When she got a number wrong I corrected her, and she crossed it out and wrote it again. At last she stepped back two paces, looked it over, and tucked the charcoal behind her ear. “With this, nobody up north will ever get beaten down on price again.” That night she set out two bowls of chicha under the awning at the market gate and pushed one across to me. “This one’s yours,” she said. “I’ve kept it for you since the year you went north.”"
effects = [{}, {}, {}, { title = "Setting Down the Basket" }]

[tracks.reunion_sisa_mullu.chapters.reunion.choices.love]
text = "Tell her we’re safe, then say the third thing: this time, I want to stay in Chincha."
hint = "That word never got said back then, so the raft in the shell still holds only one figure. The third thing comes to your lips and stops there."
reply = "When the third thing came out, my voice was smaller than I meant it to be. Sisa didn’t answer. She put the scale down, right there in front of a whole line of divers, and told the girl to weigh for her. She led me by the hand through the market gate without a word, all the way to her house. I took out the shell with the coast painted inside; its colors had faded a little, but the figure with the pole was still there. Then I took out the gray shell and put it back in her palm. She closed her hand on it for a moment, then turned and brought a small dish from the cupboard. The red in it was already mixed, dried and thinned and dried again until a thick crust had formed on the bottom. “Grandmother’s red,” she said. “Seven years.” She dipped into it and painted a second figure beside the one with the pole, very slowly, the two of them shoulder to shoulder. When she was done she put the shell down, lifted her face, and kissed me."
effects = [{}, {}, {}, { title = "Setting Down the Basket" }]

[tracks.reunion_sisa_mullu.chapters.reunion.variants.own]
text = "In 1563 my family’s raft fleet came back down from the north and beached at Callao. The price board at the market gate had been replaced, twice the size of the old one, a whole ship’s plank painted full of shells: deep red, orange red, white-spotted, and a few I had seen up north that no one here had ever painted before. A line of divers waited under it, baskets heavy on their backs. Sisa stood at the head of the line holding the black wooden scale. A diver who had just come in was about to set his basket on the pan when she waved him off and had him put it on the ground first, and a girl beside her ladled out a bowl of water and handed it to him. Only when he had drunk it and caught his breath did she have him bring the basket over. In the bottom right corner of the board was “Sisa,” traced over many times, and beside it my two letters, with nothing after them. She looked up, saw me, and pointed there with the scale beam. “Is everyone safe? If so, see for yourself who won.”"

[tracks.reunion_sisa_mullu.chapters.reunion.variants.promise]
text = "In 1563 my family’s raft fleet came back down from the north and beached at Callao. The price board at the market gate had been replaced, twice the size of the old one, a whole ship’s plank painted full of shells: deep red, orange red, white-spotted, and a few I had seen up north that no one here had ever painted before. A line of divers waited under it, baskets heavy on their backs. Sisa stood at the head of the line holding the black wooden scale. A diver who had just come in was about to set his basket on the pan when she waved him off and had him put it on the ground first, and a girl beside her ladled out a bowl of water and handed it to him. Only when he had drunk it and caught his breath did she have him bring the basket over. Halfway through the weighing, she looked up and saw me, and saw the little cloth bag bulging at my waist. She didn’t put down the scale, and she didn’t smile. She only asked the first thing: “Is everyone safe?”"

[tracks.reunion_sisa_mullu.chapters.reunion.variants.romance]
text = "In 1563 my family’s raft fleet came back down from the north and beached at Callao. The price board at the market gate had been replaced, twice the size of the old one, a whole ship’s plank painted full of shells: deep red, orange red, white-spotted, and a few I had seen up north that no one here had ever painted before. A line of divers waited under it, baskets heavy on their backs. Sisa stood at the head of the line holding the black wooden scale. A diver who had just come in was about to set his basket on the pan when she waved him off and had him put it on the ground first, and a girl beside her ladled out a bowl of water and handed it to him. Only when he had drunk it and caught his breath did she have him bring the basket over. Halfway through the weighing, she looked up and saw me. Her eyes went first to my closed fist, and only then to my face. She didn’t put down the scale, and she didn’t smile. She only asked, “Is everyone safe?”"
