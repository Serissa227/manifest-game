# C7 羁绊线（2026-10-12，Claude Opus）：stories/bonds/bond_yaqub.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题与来信按 effects 的下标对应：a2 两个“收下”选项第 4 个效果、s 的 promise 第 3 个与 heart 第 5 个效果、重逢两个选项第 4 个效果是 memory；重逢 default 第 1 个效果是 letter。

[tracks.bond_yaqub]
name = "Yaqub: Listen First"

[tracks.bond_yaqub.chapters.c1]
title = "Listen First"
text = "My first month in the city, I had two silver coins in my pocket. An old sailor off the ships had split them with me and said they’d feed me in Fez for half a month. There was a goldsmith’s in the mellah that would change money, and its shutters still showed where musket butts had split the wood a few days before. I squeezed in and slapped both coins on the counter. Behind it stood a boy about my age, sleeves rolled to the elbow. He didn’t so much as glance at the stamp. He picked up one coin and let it drop on the table; then the other, and let it drop. One rang—a long ting that hung in the air. The other went tock, short, like a knock on wood. He pushed the tock back to me. “There’s lead in this one.” I laughed out loud and told him the goldsmiths of Fez must make their living by ear—this was conjuring, and next he’d hire a blind man to read the scales. He didn’t take offense. He pushed a small balance across to me, its pans polished bright. “Silver rings. The books must not stay silent.” He paused, then added, “Ears can be fooled. Scales can’t. If you don’t trust my ears, trust this.”"

[tracks.bond_yaqub.chapters.c1.choices.weigh_it]
text = "Put the tock coin on the scales and see how short it really is."
reply = "The beam rocked a few times and settled. Short by about a fingernail’s worth. I said who would ever care about that little. “A little short is still short.” He took up a graver, cut a deep line across the coin’s edge, and handed it back. “Go show it to whoever cheated you.” I did take it to the old sailor. He stared at the cut, swore once, and gave me another coin to make up for it."

[tracks.bond_yaqub.chapters.c1.choices.drop_more]
text = "Empty my pockets onto the table and let him listen to every coin."
reply = "Copper and silver clattered all over the counter. He didn’t seem to mind. He picked them up one at a time, let each drop, tilted his head to listen, and kept at it until the sun was low. Three he set apart in a row. I told him his ears were sharper than a pirate’s—a pirate can hear from three miles out which ship rides deep. “A pirate’s ears listen for ships,” he said, sliding the three over to me. “Mine listen for money.”"

[tracks.bond_yaqub.chapters.c2]
title = "A Silver-Plated Cup"
text = "I ran all the way into the mellah with a silver cup tucked inside my shirt. My father had come by it at sea years ago; it had grapevines chased around the body, and I’d carried it from Algiers to Fez and slept with it under my head. I thumped it down on the counter. “Yaqub, give me a price. I say it’s worth a ship.” Yaqub didn’t answer. He set the cup on the scales, added weights, took them off, and studied it a long while. Then he picked up a fine file and gave the base, near the rim, one light stroke. Under the scratch showed a thin line of yellow. Copper. My mouth hung open and I couldn’t find a single joke. He didn’t laugh. He set the cup back in front of me and said that when he was twelve he’d taken in a cup just like it and paid for it with a month’s wages. “That whole month,” he said, “I weighed my own hands every day, to see if they were plated too.”"

[tracks.bond_yaqub.chapters.c2.choices.laugh_together]
text = "Laugh along with him, then ask him to teach me to spot plate at a glance."
hint = "He still takes me for a pirate brat who came in to show off. Ask him for lessons now and he’ll just put the file away in a drawer."
reply = "I laughed first, laughed until I was draped over the counter, and watching me, the corners of his mouth gave too. Afterward he turned the cup over and taught me three ways: check where the rim wears hardest for the color underneath; heft it and see if the weight suits the size; file a spot where no one will look. I only learned the hefting. “One’s enough,” he said, putting the file away. “Save the other two for next time you come.”"

[tracks.bond_yaqub.chapters.c2.choices.keep_the_cup]
text = "Tell him plated or not, it was my father’s, and I’m keeping it."
reply = "He nodded and said nothing more. From under the counter he took a soft cloth, touched it to some fine ash, and rubbed at the file mark stroke by stroke until it was smooth. Then he turned the cup half around and held it to the light from the door. “You can’t see it now.” He pushed the cup back to me. “But you know.”"

[tracks.bond_yaqub.chapters.b1]
title = "The Touchstone"
text = "In September the new king’s horsemen rode into Fez and a different flag went up over the walls. Before long the new king struck new coins, and right behind them a batch with lead in them turned up in the market. The market inspector posted a notice at the market gate that laid it squarely on the goldsmiths of the mellah, and two shops had their shutters sealed that same day. I went to find Yaqub. His shop was still open, but only half the door. He sat behind the counter with a black stone in front of him, the size of a palm, polished like lacquer. He drew the new coins across it one after another, and each left a silver streak—some bright, some dull. “I’m going to find out which furnace put the lead in,” he said. His hand was steady; every streak came out the same length, the same straight line. But his eyes were red and there were dark rings under them. He hadn’t slept in nights. He swept the new coins beside him into a pile and counted them for me. “Eleven. The stone can talk, but eleven isn’t enough for it to say anything clearly.”"

[tracks.bond_yaqub.chapters.b1.choices.bring_coins]
text = "Go round the market, trade for every new coin I can get, and let him test them all."
hint = "He still doesn’t believe I’d run errands over a Jewish goldsmith’s trouble. If I say I’m going to trade for coins, he’ll only pull the door half shut again."
reply = "I spent two days running around the market, trading coppers, trading the sheath off my old dagger, and came back with forty new coins, each one noted with whose hand it came from. He streaked them until dawn, and the marks on the stone lined up in two rows: one bright, one dark. He ran his finger along the dark row, once, then again. “This row came out of the same furnace.” Then he picked up the list I’d written and looked at it a long time. My handwriting, he said, was even harder to make out than my jokes."

[tracks.bond_yaqub.chapters.b1.choices.keep_watch]
text = "Keep watch at his door all night in case the inspector’s men come to wreck the shop."
reply = "I dragged a wooden crate to the doorway and sat on it with a blade across my knees, wiping it slowly with a rag. Around midnight the inspector’s men came by once—three of them, with torches. They saw someone in the doorway polishing a knife, stood there a while, and left. Near dawn Yaqub came out and handed me a bowl of mint tea, still scalding. “You sitting there like that,” he said, “does more good than my scales.”"

[tracks.bond_yaqub.chapters.b2]
title = "Which Furnace"
text = "Yaqub found it. He got a porter who hauled charcoal to the mint to sweep him up a handful of slag, and set beside that dull row of streaks on the touchstone, the color matched; broken open, it had the same smell of lead. “The mint, east side, third furnace.” He said it flat, the way he’d call out a weight. “The man who runs that furnace is the market inspector’s brother-in-law.” He laid the slag and the touchstone side by side on the counter, neat as goods set out for sale. His father came out of the back room, took one look, and threw a cloth over both. “A Jew going to accuse the king’s mint—you know what happens.” The old man went back inside. The curtain dropped behind him, and for a long while there was no sound. Yaqub sat without moving. Then he lifted the cloth and closed the slag in his fist, so tight his knuckles went white. I stood on the other side of the counter and watched black grit sift out between his fingers, a little at a time."

[tracks.bond_yaqub.chapters.b2.choices.carry_the_proof]
text = "I’m not a Jew—let me carry the proof in. Say a student passing by picked it up."
hint = "He won’t let me take that kind of risk for him yet. The slag is in his fist, and if I reach for it, he’ll only hold on tighter."
reply = "When he handed me the slag, his fingers opened three times before they let go. I wrapped the slag and the touchstone in my headcloth and took them to an old judge who taught law at the Qarawiyyin. I only said I’d found it outside the mint and it didn’t look right. The old judge held it up to the window all afternoon and never asked who I was. The next month the east furnace had a new man in charge, the rain soaked the inspector’s notice to pulp, and no one brought up the mellah again. Yaqub heard me out, put up half the shutters, and turned around. “This time, I owe you a true silver coin.”"

[tracks.bond_yaqub.chapters.b2.choices.write_it_down]
text = "Talk him into writing it all down first, locking it up, and waiting for the right time."
reply = "He spread out a sheet and wrote it down entry by entry: which day, which furnace, the color of the slag, how dark the streaks ran on the stone. Three pages. He waited for the ink to dry all the way before folding them, then locked them in the cupboard at the very back of the shop and tied the key to his belt. “The record has to be kept,” he said, patting the belt. “But you don’t go shouting it through the streets.” After that day, when he tested coins, his eyes weren’t red anymore."

[tracks.bond_yaqub.chapters.a1]
title = "After the Shop Closed"
text = "That day, once the shutters were up at the goldsmith’s, Yaqub didn’t send me off. He asked me to sit a while. From under the counter he took a cloth bundle and opened it: a silver ring, not yet finished. Half the pattern was cut into the face—two pomegranate branches twined together—and on the left branch, one leaf had taken a stroke too many. Too deep, slanted, it split the leaf clean in two. “It’s for a girl who’s being married off far away,” he said. “She needs it next month. I spoiled it, and I don’t dare hand it over.” He clamped the ring in a wooden vise, took up his finest file, and began working at that one stroke, little by little. One pass, a puff of breath, a look under the lamp, another pass. He went so slowly I could hear the wick burning. I sat across from him turning my oud pick over in my fingers, around and around, and didn’t tell one joke. He glanced up at me. “Why so quiet tonight?” I said, “Don’t want to put your file off.” He didn’t answer. He bent over the ring again and filed even more slowly."

[tracks.bond_yaqub.chapters.a1.choices.stay_quiet]
text = "Sit beside him and watch him work until that stroke is mended."
hint = "I don’t know him well enough yet to sit up with him all night. If I just stay put, he’ll only look up and ask whether I have more coins to change."
reply = "I didn’t make a sound; I just watched. By the time he was done it was past midnight. He held the ring up to the lamp and turned it for me to see: the split leaf had become a curling leaf, as if a wind had just gone through it. You couldn’t see the stroke anymore. He wrapped the ring and went to take down the last shutter. Halfway through, he stopped, his back to me. “Tomorrow, after closing—are you coming?”"

[tracks.bond_yaqub.chapters.a1.choices.find_the_bride]
text = "Offer to go find the girl and ask if she’d take a changed pattern."
hint = "This kind of thing needs friendship behind it. He hasn’t even told me his customer’s name, let alone let me go ask her for him."
reply = "The girl lived at the other end of the mellah, and her household was busy sewing her trousseau. I showed her the paper with the new pattern drawn on it—but first I played her a tune on the oud, and then I told her the leaf curled because the wind was strong, and a house where the wind blows strong is a house that prospers. She laughed so hard she pricked her finger, and said the new one was prettier. I ran back to tell Yaqub. He heard me out and let go a long breath; his shoulders dropped all at once. “So that mouth of yours is good for more than jokes.”"

[tracks.bond_yaqub.chapters.a1.choices.tell_a_story]
text = "Tell him a story of an old Granada craftsman who mended broken things into treasures."
reply = "I told him about an old coppersmith in the Albaicín who spent three years hammering a dented water jug until it became a lamp. I told it slowly, the way my grandmother did, pausing after every line. The file in his hand never stopped, but his ear turned toward me. When I finished he asked, “Your grandmother told you that?” I said she had. He set the file down and thought about it. “Then that story is worth a true silver coin.”"

[tracks.bond_yaqub.chapters.a2]
title = "A Small Balance and Its Weights"
text = "Yaqub gave me a small wooden case, the length of my palm, with a balance carved on the lid. Inside was a little pair of scales, the brass pans polished bright enough to see your face in, and beneath them a row of weights from large to small, the tiniest hardly bigger than a grain of wheat. Every one of them, he said, he’d taken to the official weighhouse and checked against the standard. “Someday, out at sea, whatever you plun—” He stopped and swallowed the word. “—whatever comes your way, weigh it first.” I burst out laughing. “You won’t even let me have the word?” He ignored me. He shut the case, then opened it again, took the weights out one by one, looked at each and put it back. The smallest he held up to the light from the door, twice. At last he closed the lid and pushed the case toward me—but his hand stayed on the lid a while before he took it away."

[tracks.bond_yaqub.chapters.a2.choices.keep_scales]
text = "Take the scales, and promise him: whatever I take, I weigh before it goes aboard."
hint = "This is too much to give; we aren’t close enough for me to accept it. His hand is still on the lid—reach for it and he’ll take the case back."
reply = "“I take cargo, never people.” I patted the case. “And whatever I take gets weighed before it goes aboard.” “Then weigh it true,” he said. “Anything you can’t weigh true, bring it back, and I’ll weigh it again for you.” I said then he’d have to stay right here and wait. He looked out the door at the street, then at me, and said it the way he’d call out a weight: “Where would I go?”"
effects = [{ }, { }, { }, { title = "A Small Balance and Its Weights" }]

[tracks.bond_yaqub.chapters.a2.choices.weigh_his_hand]
text = "Take the scales, set his hand in the pan, and laugh: let’s weigh this first."
hint = "If I really reach for his hand, he’ll tuck it into his sleeve first. We aren’t yet at the point where I can joke about that hand."
reply = "I lifted the pan, took his hand, and set it in. The pan sank and the weights on the other side shot up. I laughed and asked what it came to. He didn’t laugh, and he didn’t take his hand away. He just let it rest in the pan, for a long time—long enough that I stopped laughing first. “That can’t be weighed,” he said, very quietly. Then he drew his hand back, tucked it into his sleeve, and turned to trim the lamp."
effects = [{}, {}, {}, { title = "A Small Balance and Its Weights" }, {}]

[tracks.bond_yaqub.chapters.a2.choices.pay_in_silver]
text = "Say I’ll trade him a true silver coin for it, so I’m not in his debt."
reply = "I fished a silver coin out of my belt and dangled it in front of him. He took it, dropped it on the table, and tilted his ear to it: ting, long and lingering. “It’s real.” He pushed it back to me. “Keep this one. Someday I’ll need it.” Then he took the case back as well. “Pay silver for a thing and it’s goods. Goods sit on the counter.” From then on the case sat beside the big scales. That coin stayed in my belt for years."

[tracks.bond_yaqub.chapters.s]
title = "Knock First When You Return"
text = "In December a letter came from Algiers: come spring, the captains would give me a small ship of my own. Yaqub wasn’t going anywhere. The shop was his father’s, and after that it would be his. The day I went to say goodbye the shop was busy, a heap of silver waiting on the counter, and he had me sit at the table until he’d finished the handful he was weighing. When he was done, he still didn’t look up. “When you come back, knock first. If I’m busy, sit down at the table and wait, like today.” I said then I’d better bring something—a whole ship’s cargo for him to weigh. “You don’t need to bring anything valuable every time.” He set a coin on the pan. “Just bring yourself.” Then he bent over that coin and weighed it: one weight on, one off, back on again. He took a long time. It was the most ordinary coin there was. I’d heard it land on the table: a clean, long ting."

[tracks.bond_yaqub.chapters.s.choices.promise]
text = "Make a pact: every time I’m back in Fez, I knock on his door before anywhere else."
hint = "Knocking at his door first is for life. What we share can’t balance that scale yet—or I’ve already promised someone else whose door I’ll knock at first."
reply = "“Your door first, then everywhere else,” I said. “The mosque, the bathhouse, the kebab stall I still owe money to—they all wait their turn.” He set down the scales, took that graver out of a drawer, went to the door, and cut a line into the frame at shoulder height, cut it deep, the shavings falling on his shoes. “One knock, one mark.” I said if he kept that up, the frame would be whittled away sooner or later. He blew the dust off the graver and thought it over. “Then I’ll get a new door.” He handed me the graver and told me to cut one beside his, for the first time. Mine came out crooked, crooked as a snake. He studied it a long while and didn’t make me redo it. He ran a finger along the crooked line. “It’s better this way. The crooked one—anyone can see it’s you.” The spring morning I set out, I went the long way, through the mellah. The shop door was open, and on the frame were two marks side by side, one straight, one crooked."
effects = [{ }, { }, { title = "Knock First When You Return" }, { }, { }, { }]

[tracks.bond_yaqub.chapters.s.choices.heart]
text = "Tell him: the day I come back grown, I’ll knock, and there’s something I’ll say inside."
hint = "He’s still weighing that coin, adding a weight, taking one away; my words go back and forth on the scale with it and won’t settle. My heart doesn’t weigh enough yet—or I’ve already promised the same words to someone else."
reply = "“The day I come back grown,” I said, “I’ll knock, and there’s something I’m going to say—once I’m inside the door.” The pan in his hand stopped in midair. He set the scales down and looked at me, looked for a long time, long enough for a water seller’s donkey to pass the door and come back again. I thought he’d ask what it was. He didn’t. “Then I’ll leave the door open and wait.” I said with the door open, the wind would blow his lamp out. He said then he’d light it again. On the morning I left, the pack train was waiting at the mellah gate. He walked me to the door and held out his hand. I thought he meant to shake on it, the way merchants close a deal. He took my hand and held it, steady, and didn’t let go right away, as if he were feeling for its weight—once, and then again. Only when the caravan man whistled a second time did he let go and tuck his hand back into his sleeve. “Go on. The door’s open.”"
effects = [{ }, { }, { }, { }, { title = "Knock First When You Return" }, { }, { }]

[tracks.bond_yaqub.chapters.s.choices.own]
text = "Bet him: within ten years, see whose name is worth more."
reply = "“Ten years,” I said, holding up all my fingers. “Ten years from now my name will be worth a ship at sea. What will yours be worth in the mellah?” He thought about it. “A goldsmith’s name takes a lifetime to be worth anything.” I said a pirate’s name could be worth something overnight—take one ship and the next day all Algiers knows it. He laughed, and for once he laughed out loud. “Then overnight it could be worth nothing, too.” He pulled a sheet of paper from under the counter, wrote out the bet, and had me press my thumbprint to it. I did, and so did he: two prints, one large, one small, mine smudged sideways. He folded the paper and didn’t lock it in the cupboard. He slid it under the scales. “Ten years from now, we’ll take it out and weigh it.”"

[tracks.reunion_yaqub]
name = "Yaqub: The Scales After the Battle"

[tracks.reunion_yaqub.chapters.reunion]
title = "The Scales After the Battle"
text = "In the summer of 1578 a battle was fought by the Makhazen River, and three kings died on the same day. Portugal’s boy king never came home. Of the nobles he’d brought, half lay on the riverbank and half were taken prisoner, waiting for their families to send silver to buy them back. The ransoms came by way of Tangier, of Ceuta, of Lisbon, and in the end all of it had to pass through the mellah of Fez and over a goldsmith’s scales. My ship lay at Larache, and I rode two days to reach the city. The goldsmith’s door was open, just as it used to be. The silver on the counter was heaped into a small hill: one sack opened and poured out, the coins weighed one by one, the finished ones stacked, then the next sack. Yaqub had gone gray at the temples; his sleeves were still rolled to the elbow, his eyes red from lack of sleep. People said he’d been weighing for half a month without a break. He weighed a coin, called out a count, and now and then said something like, “This sack is a count’s. His mother sold two estates.” I knocked. He didn’t look up, and the scales didn’t stop. “Sit down at the table and wait.”"

[tracks.reunion_yaqub.chapters.reunion.variants.knock_marks]
text = "In the summer of 1578 a battle was fought by the Makhazen River, and three kings died on the same day. Portugal’s boy king never came home. Of the nobles he’d brought, half lay on the riverbank and half were taken prisoner, waiting for their families to send silver to buy them back. The ransoms came by way of Tangier, of Ceuta, of Lisbon, and in the end all of it had to pass through the mellah of Fez and over a goldsmith’s scales. My ship lay at Larache, and I rode two days to reach the city. The silver on the goldsmith’s counter was heaped into a small hill: one sack opened and poured out, the coins weighed one by one, then the next sack. Yaqub had gone gray at the temples, his eyes red from lack of sleep. People said he’d been weighing for half a month without a break. He weighed a coin, called out a count, and now and then said something like, “This sack is a count’s. His mother sold two estates.” The marks on the doorframe ran one after another from shoulder height down half the door; at the top, side by side, were the first two, one straight, one crooked. I knocked. He didn’t look up, and the scales didn’t stop. “Sit down at the table and wait.”"

[tracks.reunion_yaqub.chapters.reunion.variants.with_musa]
text = "In the summer of 1578 a battle was fought by the Makhazen River, and three kings died on the same day. Portugal’s boy king never came home. Of the nobles he’d brought, half lay on the riverbank and half were taken prisoner, waiting for their families to send silver to buy them back. The ransoms came by way of Tangier, of Ceuta, of Lisbon, and in the end all of it had to pass through the mellah of Fez and over a goldsmith’s scales. My ship lay at Larache, and I rode two days to reach the city. The goldsmith’s door was open, just as it used to be. The silver on the counter was heaped into a small hill, weighed coin by coin, the finished ones stacked. Yaqub had gone gray at the temples, his eyes red from lack of sleep. People said he’d been weighing for half a month without a break. Someone else sat at the table, covered in dust, untying sacks and counting them for him: Musa, just back, he said, from over by the river. Yaqub weighed a coin, called out a count, and now and then said something like, “This sack is a count’s. His mother sold two estates.” I knocked. He didn’t look up, and the scales didn’t stop. “Sit down at the table and wait.”"

[tracks.reunion_yaqub.chapters.reunion.default]
effects = [{ text = "Tariq, you didn’t come to Fez this year. People at sea are busy, I know. I’ve been busy too; I eat my meals beside the scales. These past months the goldsmiths of the mellah have kept their lamps burning all night. Since the battle by the river, the Portuguese ransom silver has come in sack after sack, and I’ve been weighing it for four months; the beam has a bright worn patch now. One sack had three leaded coins in it. It was a page’s ransom; his mother in Lisbon pawned her dowry to raise it. I made it up out of my own silver and put it down under your name—if you’d been here, you would have done the same. The coin in this letter is from the first batch struck after the new king came to the throne; I picked it out of the first handful I got from the mint. The paper says its fineness: eleven parts in twelve silver, the rest copper, not a grain of lead. I drew it across the touchstone, and the streak was bright. Take it, drop it on a table, and listen. The long note—that’s the one. The shop is where it always was, and the door is open. Next time your ship puts in, come up to the city and knock first. If I’m busy, sit down at the table and wait. —Yaqub" }, { }]

[tracks.reunion_yaqub.chapters.reunion.choices.friend]
text = "Sit down at the table, take a sack, and weigh it all with him, coin by coin."
reply = "I rolled up my sleeves, took a sack, and untied it. He pushed another set of scales toward me without a word; I still remembered how the weights went. We weighed until dawn and refilled the lamp three times. At the ninth sack I picked up a coin and dropped it on the table: tock. He looked up, and our eyes met. There were three bad coins in that sack. He cut a deep line across each with his graver. “Even ransom money, and someone has the nerve to debase it.” The slip on the sack said it was the ransom of a page, seventeen years old; his mother in Lisbon had pawned her dowry. I said then we’d make it up for the one being ransomed. I took three silver coins from my belt and dropped them on the table, one after another: ting, ting, ting. He listened, nodded, stacked them in with the rest, and made an entry in the ledger—under my name. When it was light, he got up to take down the shutters. Halfway through, he looked back at me. “Tomorrow’s ten sacks will be on this same table.”"
effects = [{ }, { }, { }, { title = "The Scales After the Battle" }]

[tracks.reunion_yaqub.chapters.reunion.choices.love]
text = "Wait until he weighs the last coin, then, inside the door, say the thing to him."
hint = "What I didn’t say back then still won’t come. Even standing inside the door, all these years later, I can’t say it."
reply = "I sat at that table until the middle of the third night. When the last sack was done, he set the last coin on its stack, squared it neatly, and drew the final line in the ledger. Then he put the scales down and looked at me. I stood and walked to the door, one step inside the threshold. “Back then I said there was something I’d say once I was inside the door.” He didn’t let me go on. He came around the counter, caught my wrist, pulled me farther into the shop, and turned and shut the door. The bolt dropped so loudly the whole street must have heard. The door he’d promised to leave open for me—this was the first time he’d barred it. The lamp on the counter flickered. He kissed me, slowly—the way he did everything slowly, as if he wouldn’t let go until he had the weight exactly right. Then he drew back a little, his forehead still resting against mine. “I kept this door open for twenty-two years.”"
effects = [{ }, { }, { }, { title = "The Scales After the Battle" }]
