# 伊德里斯：你说哪一页（bond_idriss_qalam）与重逢（reunion_idriss_qalam）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_idriss_qalam]
name = "Idriss: Which Page Did You Mean?"

[tracks.bond_idriss_qalam.chapters.c1]
title = "More Notes Than Text"
text = "Soldiers from Algiers had come into the city and a strange flag hung over the gate, but the Qarawiyyin library opened as usual, and the old man with the keys still complained that we walked too loud. Idriss had claimed the low table by the window, a copy of Ibn al-Banna’s tables open in front of him. The text was in some old copyist’s hand, line after orderly line. The margins were all Idriss: tiny script crammed against tiny script, wrapping around the corners of the text and crawling back, in places squeezed right in between the lines. I asked him, “Can you even read it yourself?” “Of course.” He set a finger on the margin and read: “Here the moon runs slower than in the previous table…” Halfway through he stopped, and his ears went red. “Slower… no. Faster. I wrote faster.” His finger moved down a line and stopped again. “And this one… Your source? Which page, which line?” He was asking himself, and he had no answer either. He didn’t close the book. He pushed it closer to me instead. “Where were you looking just now? We’ll start there.” He pulled a reed pen from his sleeve, its shaft chewed full of dents. “Help me sort it out. Which is the text, which is me, which is me copying somebody else. I can’t tell them apart anymore.”"

[tracks.bond_idriss_qalam.chapters.c1.choices.sort_layers]
text = "Suggest black ink for the text, red for his notes, brown for everyone else’s."
reply = "“Red ink is expensive.” That was the first thing out of his mouth. I said then write less. He sat pinching his pen for so long that the old man came by once to hurry us, and then he said, “No red, then. I’ll write mine on separate slips and tuck them in, each one where it belongs.” He ran home to the family shop and came back with a stack of trimmed paper edges. We tucked in eleven slips that day, and when the book closed it bulged a finger thick. He patted the spine. “Fatter. Fatter is good.”"

[tracks.bond_idriss_qalam.chapters.c1.choices.read_aloud]
text = "Ask him to read it aloud from page one. I’ll only listen, not look."
reply = "He cleared his throat and started at page one. A line of text, then a pause to explain a note; the note explained, he remembered a smaller note under it. By the third page he stopped on his own, already half hoarse. “Are you tired of listening?” I said I was fine. “I’m tired.” He glared at the page as if seeing it for the first time. “So this is what it’s like for the listener. I never felt a thing while I was writing it.” Then, in the margin of page three, he added one more line in very small letters: This page is too crowded."

[tracks.bond_idriss_qalam.chapters.c2]
title = "Which Layer First"
text = "After a few months the notes were finally sorted by whose they were, but he couldn’t bear to cut a single one. He started a fresh sheet and drew arrows: this note goes with line such-and-such, that one is read first, and after it you jump to here. The arrows curled every which way, one skirting an ink blot, another ducking under the belly of a third. “Follow them,” he said, pressing the sheet on me. “If you can get through, it’s sorted.” I followed them. The first time, an arrow led me to a note about an eclipse, when the line of text was about the moon’s motion. The second time, at a crossing of two arrows, I chose the wrong one and landed on a table further on. I spread the sheet back on the table. “Here, I went wrong. And here, again.” He didn’t say I’d misread it. He took the sheet, chewed on his pen and studied it a long while, then crossed out the first arrow and drew it again, straighter, with a little circle where it began. “Of course I can get through. I drew the road.” He blew the ink dry and pushed the sheet back. “Arrows are for people who weren’t there. Try again.”"

[tracks.bond_idriss_qalam.chapters.c2.choices.follow_arrows]
text = "Follow the new arrows again, and put a tiny dot under the line once I find it."
hint = "He takes the sheet back, says it isn’t fixed yet and he’d rather not show it. You don’t know each other well enough."
reply = "On the third try I went straight there. Under that line of text I put a dot, small as a grain of sand that had landed on the page. Idriss leaned over and looked at it a good while, and for once he wrote nothing beside it. He only said, “That dot is our mark from now on. Whoever finds it, dots it.” The next day he made me a fair copy of the arrow sheet, cleaner than the first, not one arrow crossing another, and slipped it into my book."

[tracks.bond_idriss_qalam.chapters.c2.choices.cut_notes]
text = "Tell him to cut half the notes, and half the arrows go with them."
reply = "He hugged the book to his chest as if I meant to snatch it. “Not one.” I said three, then. He leafed back and forth half the afternoon, picked out three, and scraped them off with a penknife a little at a time, wincing at every stroke like a man pulling his own teeth. When he was done he set the knife down. “I’ve got those three in my head. They don’t count as cut.” The next day he redrew the arrow sheet. Three arrows fewer, and it still went in circles."

[tracks.bond_idriss_qalam.chapters.b1]
title = "Whose Source Is Sound"
text = "The Saadians had fought their way back into the city, and the flag over the gate had changed again. When the lectures resumed, the shaykh set us a contest: he would recite a line, we would name the source, then go to the library, find the line itself, and bring it back to check. I was quick. The shaykh had barely finished before I named the book, ran to the library and came back with it in my arms, while Idriss was still wandering among the shelves. But when the shaykh checked, my line was off by a word. Right book, but the line came from another volume. Idriss came back later, and the page he opened matched to the letter. So I was quicker by a step, and he was surer by a step. The shaykh had us write out every source we’d named on a sheet and hand it in. At the fifth, Idriss’s pen stopped. He thought a moment, then added a word at the end of that line: secondhand. “I’ve never seen the original of this one.” He handed over the sheet. His voice was quiet, but his face had gone red. “I copied it out of someone else’s book.” Someone in the back row snickered. The shaykh didn’t. He ran a thumbnail under the word secondhand."

[tracks.bond_idriss_qalam.chapters.b1.choices.mark_mine]
text = "Do as he did: mark every source of mine I’ve never seen in the original."
reply = "I asked for my sheet back and went down it line by line, and marked four as secondhand, three more than he had. Idriss craned his neck to watch, and when I was done he looked delighted. “Four!” He tapped two of them. “The originals for these are on the second shelf by the east wall. I’ll take you tomorrow. The other two…” He scratched his head. “I don’t know either.” When he said “I don’t know,” he didn’t blush at all."

[tracks.bond_idriss_qalam.chapters.b1.choices.ask_his]
text = "Ask him who he got that one from."
reply = "He tapped the pen shaft twice on the edge of the table. “My grandfather’s notebook. When he was young he saw the original in somebody’s house and copied this line down.” He folded the sheet in half. “That family moved away long ago. Nobody knows where the book went.” Toward the end his voice dropped so low I had to lean in to hear it. “Grandfather said he saw it. I’ve always believed him.”"

[tracks.bond_idriss_qalam.chapters.b2]
title = "The Citation He Never Found"
text = "That year a student from Meknes turned up at the lectures with Idriss’s notes, set on proving that Ibn al-Banna’s tables had predicted a certain year’s eclipse of the moon. The text said no such thing. The note did, and after it came a title and a volume number, with “seen in” in front, every stroke as careful as if he’d had the book in his hands. That night Idriss was waiting for me at the library door with an oil lamp, its chimney smoked half black. The old man was asleep; Idriss had a key of his own, cut back when his father delivered books there. He led me to the low table by the window, opened the copy, and pressed a finger on that note until the nail went white. “I’ve never seen the original of this.” He said it fast, as if he’d never get it out if he stopped for breath. “It’s from my grandfather’s notebook. It was my first year of writing notes. I should have written secondhand, and I wrote ‘seen in.’ With ‘seen in,’ it looks like I saw it.” The wick crackled. He kept his eyes on the line, not on me. “If I say so, who’ll trust my notes after this? One false note, and people will say the whole page is made up.” His finger still hadn’t moved. “But that student is going to lecture on it tomorrow.”"

[tracks.bond_idriss_qalam.chapters.b2.choices.search_library]
text = "Spend three nights in the library with him and go through every book we can."
hint = "He wants it over with tonight. He isn’t ready to let you sit up with him night after night. You don’t know each other well enough."
reply = "We searched for three nights. The first night we went through astronomy, the second through the calendars, and the third even through the law books, hoping some copyist had quoted the line in passing. Nothing. On the third night, with the lamp nearly out of oil, Idriss opened the copy, struck the note through with his reed pen, and wrote three words beside it: Original not seen. When he finished he let out a long breath and leaned back. “You spent three nights looking with me.” He looked at the three words. “Those nights are worth more than the citation.” First thing the next morning he went to the lecture hall himself and found the student from Meknes."

[tracks.bond_idriss_qalam.chapters.b2.choices.mark_unseen]
text = "Talk him into writing “Original not seen” beside it tonight, and saying so at the lecture tomorrow."
reply = "He sat with the pen in his fist, hesitating, until nearly dawn. He dipped it three times and let it dry three times. When the call to prayer came across the courtyard he finally wrote it, “Original not seen” in letters so small you had to squint. Before the lecture that morning he stood up on his own and told everyone where the note had come from. When he sat down I saw his legs shaking under the desk, and they shook a good while. The student from Meknes never lectured on that note again."

[tracks.bond_idriss_qalam.chapters.a1]
title = "The Astrolabe in the Timekeeper’s Room"
text = "The timekeeper’s room sat at the foot of the minaret, a narrow space with the bronze bowl of the water clock on one wall and, on a shelf by the window, an astrolabe worn bright. The timekeeper had to keep watch until the dawn prayer every night, and by the small hours he’d be propped against the wall, snoring. Idriss brought a book and opened it to a page whose margins were perfectly clean. Not a word. “I haven’t annotated this one yet,” he whispered. “Agreed, then: no talking till we’ve read it through. First to speak loses.” We sat side by side under the window and read. Halfway down I got stuck on a calculation and looked up at him. He was stuck too, his hand already creeping toward his reed pen. He picked it up and put it down, picked it up and put it down, and finally sat on it. Three lines further, the calculation came undone on its own. The author had put the answer after it, as if he meant to make readers fret. We looked up at the same moment and laughed out loud together. The snoring by the wall stopped. The timekeeper opened his eyes, looked first at the water clock, then at us. “Middle of the night. What’s so funny?”"

[tracks.bond_idriss_qalam.chapters.a1.choices.read_silent]
text = "Apologize to the timekeeper and finish the page in silence."
reply = "We apologized and bent our heads over the rest of the page, not a sound out of either of us. The timekeeper grumbled a bit, and grumbling woke him all the way up. He waved us over, took the astrolabe down from the window, and showed us how to turn the rete and read a star’s height, all the way until he’d fixed the time of the dawn prayer. Idriss didn’t cut in once. He just watched. On the walk back the sky was already going pale. He was ahead of me, and suddenly he turned around. “That page. I’m not going to annotate it.” I asked why. “You can understand it without.” He thought about it. “Let the next reader fret.”"

[tracks.bond_idriss_qalam.chapters.a1.choices.same_astrolabe]
text = "Hold the astrolabe’s sighting rule with him and line it up on the star outside."
hint = "Crowd that close right now and he’ll just think you’re after his astrolabe. You don’t know each other well enough."
reply = "The timekeeper told us to find the star ourselves. Idriss held one end of the sighting rule and I held the other, our hands close, a short length of brass between them. The star dropped into the two little holes. He whispered the degrees, and after he’d said them he didn’t let go, and neither did I. The brass had the night’s chill in it; his fingers were warm. Behind us the timekeeper coughed, loudly. We sprang apart, and Idriss said the degrees again, and got them wrong."

[tracks.bond_idriss_qalam.chapters.a2]
title = "The Reed Bookmark"
text = "The copyist’s shop smelled of damp paper and glue. Idriss sat behind his father’s desk, and once I was through the door he took something out of his sleeve, set it on the desk, and pushed it an inch toward me. It was a bookmark, cut from reed and shaped like his reed pen: a slanted nib at one end, the reed’s knot left at the other. Below the knot a single letter was carved, deep. It was the letter his old question always started with. “Ruined a few reeds on it,” he said quickly, eyes on the inkpot. “The knife wouldn’t behave.” I held it up to the light from the doorway. The reed was shaved so thin that a little light came through. “Keep it in your book,” he said. “Whatever page it’s in, I’ll open it and know how far you’ve read. I won’t have to ask.” Then he stopped short, as if he’d just noticed that line had saved him every question he might ask later, and his ears went red again."

[tracks.bond_idriss_qalam.chapters.a2.choices.mark_page]
text = "Put it in the copy of the tables, at the page where we made our dot."
hint = "He’s still holding the bookmark and hasn’t brought himself to slide it over. You don’t know each other well enough."
reply = "He took the copy and leafed forward page by page until he reached the bookmark, saw the little dot beneath it, and laughed. “You know how to pick.” He drew the bookmark out, studied the dot a moment, and put the bookmark back in my hand. “I’ll remember this page. It’s settled, then: the bookmark is yours, and the book belongs to the Qarawiyyin. When it’s checked, come back and see how it turned out.” I asked when that would be. He weighed what was left in his hand and sighed. “As fast as I can. Don’t give up and leave before then.”"
effects = [{}, {}, {}, { title = "The Reed Bookmark" }]

[tracks.bond_idriss_qalam.chapters.a2.choices.keep_close]
text = "Keep it in the book I read most, and tell him wherever I read, I’ll hear his question."
hint = "Say that now and his ears will go red to the neck, and he’ll snatch the bookmark back to whittle another. Not yet."
reply = "“Don’t say things like that.” He reached to take the bookmark back and stopped halfway. “I’ll take it seriously.” I said then take it seriously. He spun his reed pen once between his fingers, dropped it, and it rolled under the desk. He bent to pick it up, missed twice, and on the way up banged his head on the edge of the desk. He held his head and said nothing for a long moment. Then: “Taken seriously.”"
effects = [{}, {}, {}, {}, { title = "The Reed Bookmark" }]

[tracks.bond_idriss_qalam.chapters.a2.choices.ask_why_reed]
text = "Ask him why reed and not wood."
reply = "“This was the hundredth pen I ruined,” he said. “The nib split and it wouldn’t write, but I couldn’t throw it out.” I asked how he knew it was the hundredth. “I keep count. Every one I ruin, I scratch a line on the wall.” I said then it was worth more than a bookmark. “All the more reason to look after it.” But even as he said it, he took the bookmark back. “It isn’t done.” He showed me: the letter was carved a little crooked. Not by much. “I’ll give it to you when I’ve got it straight.”"

[tracks.bond_idriss_qalam.chapters.s]
title = "Taking the Questions Along"
text = "Winter rain had soaked the library steps black. I went to return my last book, and Idriss was still at the low table by the window with the tables open, checked as far as page forty-something, the slips tucked inside a stack thicker than last year. “When do you leave?” He didn’t look up. I said after the new year, down to the coast for a ship. He made a small sound, added a word in the margin, crossed it out. “I’m staying to check this one. When it’s done there’ll be others.” He laid his reed pen down and finally looked up. “Once you’re gone, don’t hoard what you don’t understand. Write even if you’ve only got half of it. Don’t wait till you understand everything to write to me. By then I’ll be an old man.” He drew a slip out of the copy. On it he had written out the very line the student from Meknes tried to lecture on last year, with an enormous question mark added at the end. “I still haven’t found the original. Take it with you and think about it on the way.”"

[tracks.bond_idriss_qalam.chapters.s.choices.promise]
text = "Agree that every letter carries one doubtful source, and we each hunt the other’s."
hint = "A promise like this is only made when you’ve gone all the way with someone. And if you’ve already given your once-in-a-lifetime promise to someone else, all you can leave him this time is an address."
reply = "He pushed the slip over at once, then pulled a second one out of the copy and kept it. “One each. That makes two to start with.” I asked what happened when one was found. “Whoever finds it buys dinner.” I said I’d be at sea, and there are no books on a ship. He touched his reed pen to the back of my hand and left a dot of ink. “Then find people. On the docks, in the holds, whoever says something, and who they heard it from. Write it down. People are sources too.” He walked me to the library door. The steps were slick, and he held the doorframe with one hand and kept the copy of the tables tucked against his chest with the other. “Send letters to the Qarawiyyin, with my name on them. The old man with the keys knows it.” I was two steps away when he called after me. “And date your letters! I can’t annotate a letter with no date.”"
effects = [{}, {}, {}, {}, {}, { title = "Taking the Questions Along" }, {}]

[tracks.bond_idriss_qalam.chapters.s.choices.heart]
text = "Tell him there’s something I’ll ask him the day I’m back, and he’ll have to name the page."
hint = "You can’t find the source for that line yet. You haven’t come that far, or the promise you only get to make once has already gone to someone else."
reply = "He asked which page. I said I’d tell him when I got back. “That won’t do,” he said, flustered, crumpling the slip in his hand. “At least give me a volume.” I said there was no volume. He stared at me a long while, and the red came up slowly, past his ears and down to his collar. “Then I’ll turn every page there is,” he said. “Until you’re back.” Outside, the old man rattled his ring of keys to tell us he was locking up. Idriss reached out and squeezed my hand, quickly, and when he let go there was a streak of ink on the back of my hand, rubbed off his fingers. He looked down and saw it, and didn’t wipe it off. He pushed my hand back toward me instead. “Keep it. If it washes off at sea, that means you forgot.”"
effects = [{}, {}, {}, {}, {}, { title = "Taking the Questions Along" }, {}]

[tracks.bond_idriss_qalam.chapters.s.choices.own]
text = "Make it a race: who finds the original of that citation first."
reply = "“How are you going to search at sea?” He narrowed his eyes. I said there are books at sea too, in other people’s cabins and in merchants’ chests at every port. He thought about it, decided I had a point, and decided he was being cheated. “You get to roam. I’ve got one library.” I said his library was big. “Then it’s a race.” He tore a strip off a paper edge, wrote a few words, and held it flat on the table for me to sign. “Loser copies out all of the other’s notes, start to finish. All of them.” I glanced at the thickness of his copy, and my hand stopped over the strip. He burst out laughing, loud enough that the old man outside swore at us. “Still time to back out.” I signed. He blew the strip dry and tucked it into the first page of the tables. “The day you lose, you start copying from here.”"
effects = [{}, {}, {}, { title = "Taking the Questions Along" }, {}]

[tracks.reunion_idriss_qalam]
name = "Idriss: The Source, Found"

[tracks.reunion_idriss_qalam.chapters.reunion]
title = "The Source, Found"
text = "Six years away from Fez, and the Qarawiyyin steps were as slick as ever. Idriss had a lecture circle of his own now, at the foot of a pillar, seven or eight students around him, each with a copy open on his knees. I squeezed in at the back for a look: the students were writing notes beside his notes, in smaller script, packed even tighter. He finished a passage, looked up and saw me, kept talking, and crooked a finger at me as if I’d only gone to the library for a book. When the circle broke up he brought a cloth bundle out from behind the pillar. “A merchant from Tlemcen,” he said, untying it. Inside was an old book, its leather cover cracked in several places. “This was at the bottom of his book chest. I went through it all night.” He opened it and turned the pages fast, stopped at one, and laid his finger on a line in the middle, lightly this time. It was that line. The one he’d kept his finger pinned to that night under the lamp. Here was the original. He didn’t read it out. He turned the book around to face me and looked up. “Your turn this time. You tell me: which page?”"

[tracks.reunion_idriss_qalam.chapters.reunion.default]
effects = [{ text = "Found it. A merchant from Tlemcen had the original at the bottom of his book chest. I went through it all night and found the page at daybreak. It differs from what my grandfather copied by two words. Guess which two. If you can’t, come back and look. I’ve corrected the note and written the source and the date I found it beside it. I have a pillar of my own now, with students sitting under it, and the students write notes beside my notes, packed tighter than mine. I can’t control them, and I don’t much want to. Three questions enclosed, all ones I can’t find the source for. I’ve put the page number after each. If you hear anyone at sea say something like them, write down his name, his ship, and the day he said it. I’ve filled the margins of this letter too. Turn it upside down. —Idriss" }, {}]

[tracks.reunion_idriss_qalam.chapters.reunion.choices.read_together]
text = "Name the page, and read the original through with him, top to bottom."
reply = "I said the page number, and he nodded. We each held one side of the book and read from the first line. At that line he stopped, took the old copy of the tables out of his robe, found the note, and laid the two side by side on his knees. The original and his grandfather’s copy differed by two words. Not much. The meaning slid a little, just far enough for someone to teach a whole lesson wrong. Idriss took out his reed pen and corrected the note, and beside it wrote the original’s title, the Tlemcen merchant’s name, and the date it was found. When he was done his pen paused, and then he added one more line: my name. “That night, you were the one in the library with me.” He blew the ink dry. “A source should be complete.” His students were craning to see. He shut the book. “What are you staring at? Copy it down.”"
effects = [{}, {}, {}, { title = "The Source, Found" }]

[tracks.reunion_idriss_qalam.chapters.reunion.choices.who_found]
text = "Argue first: who found it first? I heard of that merchant back in Alexandria."
reply = "“I found it first.” He pulled the book into his lap. I said two years ago in Alexandria I’d already heard that a man from Tlemcen had a book like this in his chest. “Hearsay doesn’t count. Hearsay is secondhand.” He said it with total conviction, then laughed at himself first. Neither of us would give in, so we went to the inn in town to find the merchant. He was in the courtyard drinking mint tea, and when we’d explained he stroked his beard and thought a long while. “The first one to ask about this book? A young man, carrying a copy of something, said he was a student of Master Idriss.” Idriss stood there with his mouth open. We had both lost, so we pooled our money and bought the student a meal of grilled meat. The student ate with grease on his chin and asked between bites, “Master, does this count as a source?” “It counts,” Idriss said. “Put your name in the note.”"
effects = [{}, {}, {}, { title = "The Source, Found" }]

[tracks.reunion_idriss_qalam.chapters.reunion.choices.the_question]
text = "Skip the page number. Ask the thing I held back the year I left."
hint = "You never got that far back then, and today the question won’t come out."
reply = "He didn’t ask which page. He lifted his finger from the line and looked at me, for so long that the students over by the pillar began to peer around it. “I’ve waited for that,” he said, “six years. I wore the books out. Two of them.” He closed the original, very gently, as if something might be caught inside. Then he took my hand, ink on his palm and the callus from the reed pen, and this time when he held on, he didn’t let go. “This page,” he said, “needs no notes.” Over by the pillar the students were whispering, and one of them couldn’t hold back a laugh. Idriss didn’t turn around, but his voice had been trained in the lecture hall, and one line carried over them all: “That’s all for today.”"
effects = [{}, {}, {}, { title = "The Source, Found" }]
