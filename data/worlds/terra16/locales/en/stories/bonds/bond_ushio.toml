# 先看看脚下（bond_ushio）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# C21b 审读后（2026-11-12）：好感方向改了、或手册点名删掉的原句所在的章，英文整章删掉回退中文：bond_ushio.c1、bond_ushio.b1、bond_ushio.a1。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上、又新加了选项与变体，照“缺译回退中文”（整章未译可回退）整章删掉，待照新中文重译：bond_ushio.a2、bond_ushio.s。重逢一章是轨道里唯一的一章，删了就不算“整章未译”，所以保留，只补新加的变体与选项、改掉与新中文对不上的几条（见各条上方注释）。
# 效果数组按下标对齐中文文件，只有回忆标题与来信需要译文，其余位置留空表。

[tracks.bond_ushio]
name = "Ushio: Watch Your Footing"

[tracks.bond_ushio.chapters.c2]
title = "Tracing Characters at Midnight"
text = "The rains had gone on for half a month, and the paper screens in our room had gone soft with damp. I woke in the middle of the night and saw a little lamplight still burning behind the folding screen, the wick trimmed down to the size of a grain of rice. I pulled on a robe and went around. Ushio was lying flat on the floor with a sheet of paper under her elbows, its corners already worn through. The sheet was covered edge to edge with one character, over and over: Mio. The water strokes wobbled, and the right side always fell apart at the bottom. She would finish one, measure it with her finger, and start another. I stood behind her a good while before she noticed. Then she flipped the paper over in a hurry; the ink was still wet and bled a shadow through the back. “When you send letters at court,” she said, not looking at me, staring at the lamp, “if I’m the one carrying them and the writing’s ugly, it’s you they laugh at.” Her fingers were black with ink. She wiped them on the hem of her robe, and the hem only got blacker."

[tracks.bond_ushio.chapters.c2.choices.teach_her]
text = "Sit down beside her, take her hand, and teach her stroke by stroke."
hint = "She pins the paper under her body, ears gone red. She’s still afraid I’ll see how badly she writes; she won’t let me near that sheet."
reply = "I knelt beside her and took the hand that held the brush. Her hand was harder than mine, a layer of callus across the palm, and the brush kept slipping in it. “The water strokes should look like water,” I said. “Each drop a little lower than the last.” She dotted them in like three rocks. We traced until the screens went pale, and the last Mio was her own, neater than mine. She held it up to the morning light. “So from now on I can write your letters for you.” “I’ll write my own letters,” I said. “If you want to write, write yours.” She blinked, folded the sheet into a small square, and tucked it inside her robe."

[tracks.bond_ushio.chapters.c2.choices.read_her_letter]
text = "Leave the paper alone, and ask her to read me the letter she wants to send home."
reply = "I didn’t look at the sheet. I only asked what she wanted to write home. She hesitated a long time, then turned the paper back over. There were a few more lines on the back, to her mother. She read them out word by word. “The water in Kyoto is dead. It isn’t salty. The corridors are too slippery. My lady is very good to me.” There she stopped. “That line,” she said, pressing an inky finger to it, “I wrote three times. The first two came out crooked. They looked like a lie.”"

[tracks.bond_ushio.chapters.b2]
title = "A Letter from Noshima"
text = "In early spring a Noshima salt boat put in at Sakai and brought a letter for Ushio, the address on it even more crooked than her own hand. It was from her uncle. Her cousin Takamaru was nearly a ship’s captain already. A Murakami daughter pouring tea for people in Kyoto was a waste. Come home before summer and learn the helm. Ushio gave me the letter to read and said nothing. When I handed it back she folded it, opened it, read it again, folded it again, and pressed the creases deeper each time. Outside someone was airing quilts, a bamboo pole slapping against them. “That Takamaru,” she said at last, “couldn’t even scull straight when he was little.” She tucked the letter under her knee, and her finger kept drawing on the mat, tracing a winding line of water."

[tracks.bond_ushio.chapters.b2.choices.count_the_fare]
text = "Work out the fare home to Noshima with her, coin by coin, and put the sum in her hand."
hint = "She grips the letter and won’t let me read it a second time. She isn’t ready to let me see her torn between two roads."
reply = "I took out the abacus: the boat down the Yodo, the boat from Sakai to Noshima, food and toll money on the way. I clicked it out item by item and wrote it down, and at the bottom I added what I had saved of my own. It came out exactly enough. I put the paper in her hand. She looked at it a long time, then pushed it back to me. “Once I’ve learned the helm,” she said, “I’ll come back and find your waters.” That night she answered the letter. One line: “Wait two more years.”"

[tracks.bond_ushio.chapters.b2.choices.ask_what_she_wants]
text = "Ask her where she herself wants to go."
reply = "“To sea.” She answered fast, as if she’d been holding it in her mouth a long time. Then, after a moment: “But the sea I want is yours.” And she was the first to freeze, eyes wide, as if someone else had said it for her. Before I could open my mouth she had dropped her head and was folding the letter into a small, square packet, neater than she had ever folded anything."

[tracks.reunion_ushio]
name = "Ushio: Ask the Captain First"

[tracks.reunion_ushio.chapters.reunion]
title = "Ask the Captain First"
text = "More than three years had passed when I came back to Shimoda. The sandbar at the river mouth was right where it had always been, and at high tide that dark line in the water showed at a glance. Tied up at the landing was a sekibune, not large, its hull lacquered a glossy black. Ushio stood on the landing settling the freight on a cargo of paper with a merchant from Sakai. He said it was too dear; other boats charged a fifth less. I opened my mouth to answer for her—whose boat could run this channel on a spring tide?—and with the words already on my tongue, I swallowed them. “Other boats,” Ushio said, “can’t get into this river. If your paper gets soaked, that’s your business.” She talked even shorter than before, not one word to spare. The merchant figured for a long while and agreed to the price. Only then did she turn around, as if she had seen me all along, flash me a smile, and wave me aboard. “I picked this ship myself,” she said. “Watch your footing on her first.”"

[tracks.reunion_ushio.chapters.reunion.default]
effects = [{ text = "My lady: I wrote this letter myself. The writing is ugly. You’ll know it’s mine. You didn’t come. I waited at Shimoda one whole summer, until the big autumn tides were over, and then the ship had to go to Sakai to load and I couldn’t wait longer. I’m a captain now. I picked the ship myself. A sekibune, small, shallow draft, she can get into the river at Shimoda. Other boats can’t, so I charge a fifth more than they do. The Sakai merchants curse me, and then they hire me. Seven deckhands. Two from Noshima, and one from your house, the one Ase chased with a stick for stealing persimmons when we were small. He can take in a sail now. My mother is well. At Obon she still lights a lamp at the river mouth. She says it’s for the one who held the lantern that year. She asked when you’re coming back. I said I don’t know. With this comes a tide table for the river mouth at Shimoda. I kept it myself, three years, twice a day, never missed one. When your ships come into this river, go by it. On the spring tides, don’t force it. Wait outside one night. From inside, I’ll see your lantern. The words on the back, you’ve heard me say before: watch your footing first. Ushio" }, {}]

[tracks.reunion_ushio.chapters.reunion.variants.with_yuki]
text = "More than three years had passed when I came back to Shimoda. The sandbar at the river mouth was right where it had always been, and at high tide that dark line in the water showed at a glance. Tied up at the landing was a sekibune, not large, its hull lacquered a glossy black. Ushio stood on the landing settling the freight on a cargo of paper with a merchant from Sakai. He said it was too dear; other boats charged a fifth less. I opened my mouth to answer for her—whose boat could run this channel on a spring tide?—and with the words already on my tongue, I swallowed them. “Other boats,” Ushio said, “can’t get into this river. If your paper gets soaked, that’s your business.” The merchant figured for a long while and agreed to the price. Only then did she turn around, smile at me, and wave me aboard. “I picked this ship myself. Watch your footing on her first.” In the cabin, pinned under a beam, was a roll of poem drafts on thin Kyoto paper, in a fine, slender hand that could only belong to the Reizei house. She saw me looking and cleared her throat. “Her letters don’t go through your hands anymore.” She managed to sound pleased with herself and embarrassed at the same time."

[tracks.reunion_ushio.chapters.reunion.choices.friend]
text = "Board her ship, sail one run with her, and watch how she captains."
reply = "Early the next morning we cleared the river mouth and headed west around Cape Ashizuri. She took the helm and I held the lantern. It wasn’t light yet, and she insisted: rules of the ship, passengers work too. The waves were smaller than that Obon, but she was fiercer than she had been, snapping at a deckhand for hauling in a line too slowly, at me for holding the lantern crooked. “A little left.” “Good. Don’t move.” Not one word different from back then. Past the cape the sun came up out of the sea; she handed the helm to a deckhand, came forward, and stood beside me, looking at the water a long time without saying anything. Back in port she counted out the money for the cargo. She was slower than me, but not one coin off. She put a string of coins in my hand: lantern wages. “My lady,” she said, “you’re still my lady, and I’m still your milk sister. But this ship is mine.” I tucked the coins into my sleeve and said next time I was raising my rate. She said, “Then learn to read the water first.”"
effects = [{}, {}, {}, { title = "Ask the Captain First" }]

[tracks.reunion_ushio.chapters.reunion.choices.love]
text = "Settle, now, the wage line I left blank that year."
hint = "Needs: you gave her your heart back then, and heart 24."
reply = "I said I wanted to settle the line I’d left blank. Ushio turned to her hand. “Watch the helm.” She took me by the wrist across the deck stacked with paper bales to the bow. Carved in the crossbeam was a character I hadn’t seen from the jetty: Mio, the three water strokes each a little lower than the last. “Ruined two boards,” she said. “This is the one that went in.” From her jacket she took the old handkerchief and untied it. The paper was still there, the wage line still blank. “I’m not filling it in. This boat is mine and you’re riding on it; anything I wrote there would be wrong.” I said then I wouldn’t fill it in either; I’d say something else. I didn’t say it slowly, or well, and halfway through she laughed and leaned in and kissed me. A wave broke over the bow and the boat rocked; she didn’t let go. The hand coughed behind us. Without turning round she said, “Watch your helm.”"
effects = [{}, {}, {}, { title = "Ask the Boatmaster First" }]

[tracks.reunion_ushio.chapters.reunion.choices.love_cane]
text = "Speak first of the ten strokes of the cane, then settle the blank wage line."
hint = "Needs: you gave her your heart back then, heart 24, and you spoke to her in Kyoto about the caning."
reply = "I began with the ten strokes. Ushio listened with her face to the sea and cut me off halfway: “You said it once in Kyoto. Once is enough. Say it again and it’s haggling.” She told her hand to watch the helm and took me to the bow. Carved in the crossbeam was Mio, the last water stroke cut too deep and split along the grain. She took out the old handkerchief; the paper was there, the wage line blank. I said I had something to say too. Say it, she said, say it slowly. I said it fast. Halfway through, the wind lifted the handkerchief toward the rail; she put her foot on it, picked it up, and tied it round my wrist with a sailor’s knot."
effects = [{}, {}, {}, { title = "Ask the Boatmaster First" }]

[tracks.reunion_ushio.chapters.reunion.variants.cane_silent]
text = "It’s been over three years when I come back to Shimoda. The sandbar at the river mouth is where it always was, and at high tide the dark line of deep water shows at a glance. A sekibune lies at the jetty, not big, its hull lacquered glossy black. Ushio stands on the jetty haggling with a Sakai merchant over freight for a cargo of paper. He says other boats are twenty percent cheaper. “Other boats can’t get into this river mouth,” Ushio says. “It’s a neap tide; the water’s only at the second rope on that post. Your ship draws five feet, so she’d sit outside the bar and you’d hire lighters, and the lighters cost more than my twenty percent.” He takes her price. She turns, sees me, and doesn’t lift her hand. “That year’s caning. I’m keeping count of the ten strokes for you.” Only then does she wave me aboard."

[tracks.reunion_ushio.chapters.reunion.variants.cane_confessed]
text = "It’s been over three years when I come back to Shimoda. The sandbar at the river mouth is where it always was, and at high tide the dark line of deep water shows at a glance. A sekibune lies at the jetty, not big, its hull lacquered glossy black. Ushio stands on the jetty haggling with a Sakai merchant over freight for a cargo of paper. He says other boats are twenty percent cheaper. “Other boats can’t get into this river mouth,” Ushio says. “It’s a neap tide; the water’s only at the second rope on that post. Your ship draws five feet, so she’d sit outside the bar and you’d hire lighters, and the lighters cost more than my twenty percent.” He takes her price. She turns, sees me, and smiles first. “You owned up that time, so I took the beating for nothing.” She said the same thing when we were children, not a word changed. Then she waves me aboard."

[tracks.reunion_ushio.chapters.reunion.variants.shared]
text = "It’s been over three years when I come back to Shimoda. A sekibune lies at the jetty, lacquered glossy black. Ushio is haggling with a Sakai merchant over freight; he balks, and she lays it all out, the waterline on the post, the neap-tide hour, the price of lighters, until he takes her price. She waves me aboard. Weighed down at the hatch is a letter, the hand on the cover not hers. “Picked it up on the way. It’s for you,” she says. “When I carried it I stopped and saw that person, said one sentence, nothing else. This boat runs Shimoda to Sakai; your fleet goes west. We don’t sail the same way. Watch your step first.” The pass flag hanging in her cabin is Noshima’s."
