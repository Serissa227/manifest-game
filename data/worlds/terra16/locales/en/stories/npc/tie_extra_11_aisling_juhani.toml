[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_landing.variants.third]
text = "By the third summer Aisling’s ship was in Bergen again. She went up to the room behind the warehouses first and ran a hand along the window crack. It was still the window she had ordered mended, its wedges biting hard at all four corners, and not a breath of wind came through. She slapped a sheet of paper on the table. First line: his provisions come off the top. Below that, a tenth of the cargo she brought home was his, the ship was hers to run, and the sky was his. “Your price always has the food for the way home counted in,” she said. “This time I’ve written it on the first line.” There was one more line at the bottom: when Juhani says we do not sail, we do not sail, and the captain does not take it back. “That knot in my cabin has hung there a year, and I look up at it every day and don’t dare touch it. Coming aboard is up to you. I’ve signed already.” Juhani read the paper from top to bottom, ran a thumbnail under “his provisions come off the top,” and tucked it inside his coat. “This time,” he said, “I say yes.”"
