[tracks.tie_extra_11_aisling_juhani]
name = "A Knot Can’t Say Yes for You"

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_meeting]
title = "Hold the Wind Till Morning"
text = "Aisling’s ship came into Bergen with a hold full of Irish cowhides, wanting timber and stockfish in return. The lines weren’t fast before she was ashore looking for a bed. At the end of the quay a Sámi man was crouched over a leather cord tied in three knots, and he stood up as she came by. “Captain, hear me out. The first knot, you untie it, a fair wind. The second, the wind is hard. The third—” “Save the legends,” she said, with a wave of the hand and a voice that brought the next ship’s crew to their rail. “Where do I sleep tonight?” Juhani blinked, then pointed at the back wall of the Hanseatic warehouses. “There is one room. It lets the wind in.” She went to look. The window frame hung crooked, with a gap you could push two fingers through, and rain was coming down outside. “Then we mend the window first,” she said. “We can haggle over the wind tomorrow.” He fetched a hammer and wooden wedges. She snatched the hammer out of his hand while he held the frame, and on the third blow the wedge sat tight. “All these years selling wind,” said Juhani, “and this is the first time I have shut it out for someone.”"
news = "Behind the Hanseatic warehouses in Bergen, a Sámi wind-seller never got to finish his pitch: an Irish captain marched him off to mend a drafty window, and the price of wind waited until the next day."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_turning]
title = "The Third Knot"
text = "Bergen’s taverns have talked about one ship all week. Her captain bought three knots, found the wind too weak, and untied the third before he was well out of harbor. The mast snapped in two on the spot, and the ship had to be towed home without a scrap of sail. “I was watching from the shore,” says one sailor. “The bow swung round first, as if somebody had slapped her with a door.” When the Sámi wind-seller heard, he gave anyone who asked about the third knot a single word: “No.” One man doubled the price. He said it again, more quietly. The Irish captain lodging behind the warehouses heard the whole tale, cursed the careless captain up and down, and halfway through turned around to praise the other: “A merchant who pushes silver away! I’ll give him that.” The cord with its three knots hung at the stall for half a month, and not a soul asked even about the first."
news = "A captain in Bergen untied the third wind knot soon after leaving harbor, snapped his mast and had to be towed home. The Sámi wind-seller won’t sell a third knot this season."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_choice]
title = "Who Calls the Sailing"
text = "Summer again, and the window of the room behind the warehouses was shut tight. Aisling meant to run north this trip. She came through the door and slapped a bag of silver on the table. “I’m inviting you aboard to watch the sky for me. And I’ll take all three knots.” Juhani didn’t touch the silver. He spread the leather cord out and laid the three knots in a row. “Coming aboard, yes. Knots, two. The third I do not sell this season. And the day I say we do not sail, we do not sail. Nobody’s word counts against it, not even the captain’s.” Aisling laughed until the lamp flame shook. “Once you’re aboard, where we sail is up to me.” “Knots can be untied,” said Juhani. “Look at the sky first.” They sat stiff on either side of the table until the flame stood still again. She turned her head first, then he turned his, and both pairs of eyes came to rest on me."
news = "Behind the warehouses in Bergen, an Irish captain wants to take the Sámi wind-seller north, and he wants a rule that when he says no sailing, there is none. Neither will give way."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_choice.default]
news = "The Irish captain and the Sámi wind-seller never struck a bargain, so she ran north alone. Word is she came back two sailors short."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_choice.choices.buy_two]
text = "Talk Aisling into two knots only, and into his rule: when he says we don’t sail, we don’t."
reply = "I put it to her: two knots were enough for one voyage, and when he called a halt, they halted. Aisling slapped the table and swore a blue streak, from the English to Bergen’s rain, then thrust out her hand. “Done!” On the way north Juhani called off the sailing twice. The first time, cloud came down from the north by evening. The second time the ship waited a day longer at anchor, while the swell outside ran higher than the mast. He was right both times."
news = "Behind the warehouses in Bergen, the Irish captain and the Sámi wind-seller have struck a bargain: two knots only, and when he says no sailing, there is none."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_choice.choices.buy_third]
text = "Buy Aisling the third knot too, as insurance to hang in her cabin and never untie."
reply = "I paid for the third knot and said it would only hang in the cabin, untouched. Juhani studied the cord for a long time. “I do not sell wind. A knot that hangs, that I can sell.” The price still had the food for his journey home counted into it. On the day they sailed he stood on a stool and hung the knot from the highest nail in the captain’s cabin. “Do not touch it.” Aisling craned her neck and swore at him for hanging it so high, but the whole voyage nobody laid a finger on it. She said later it was the dearest piece of rope aboard."
news = "Someone bought the third wind knot for the Irish captain at Bergen. The Sámi will allow it to hang in her cabin and nothing more: it is not to be untied."

[tracks.tie_extra_11_aisling_juhani.chapters.tie_extra_11_aisling_juhani_landing]
title = "The Mended Window"
text = "By the third summer Aisling’s ship was in Bergen again. She went up to the room behind the warehouses first and ran a hand along the window crack. It was still the window she had ordered mended, its wedges biting hard at all four corners, and not a breath of wind came through. Last year the two of them hadn’t reached terms, and she had gone north alone; counting heads on the way home, she was two short. She never said a word about that. She slapped a sheet of paper on the table. First line: his provisions come off the top. Below that, a tenth of the cargo she brought home was his, the ship was hers to run, and the sky was his. “Your price always has the food for the way home counted in,” she said. “This time I’ve written it on the first line.” There was one more line at the bottom: when Juhani says we do not sail, we do not sail, and the captain does not take it back. “Coming aboard is up to you. I’ve signed already.” Juhani read the paper from top to bottom, ran a thumbnail under “his provisions come off the top,” and tucked it inside his coat. “This time,” he said, “I say yes.”"
news = "The window in that Bergen room hasn’t leaked in three years. The Irish captain and the Sámi wind-seller have signed a partnership paper: she runs the ship, he reads the sky."

