[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_landing.variants.griet]
text = "In October Kaspar steers Liesbeth into the tavern on the quay and lays down the rule before they sit. “No talk of silver tonight.” The change from the counter has barely reached her hand before she is holding a coin up to the lamp to study its edge. He raps the table once. The bread comes, and she is explaining how silver with copper in it turns red if it sits too long. He raps twice. The third time she gets as far as “I want to add one more line to the statement,” and his knuckles come down so hard that the soup slops in the bowls. Halfway through the meal he fetches a stick of charcoal from the hearth and starts drawing the city’s streets on the tablecloth. This alley comes out at the river. That gate isn’t locked at night. Griet comes over with the soup and takes one look at the cloth. “Drawing again. That cloth goes on your tab.” He doesn’t look up. The lines shake, but he leaves out no crossing. “Find the way out first, then place the gun. Remember that.” Liesbeth looks for a long time. She doesn’t reach for a clamp. She folds the cloth and puts it in her pocket."
