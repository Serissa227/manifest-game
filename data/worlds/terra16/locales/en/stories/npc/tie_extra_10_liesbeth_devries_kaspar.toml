[tracks.tie_extra_10_liesbeth_devries_kaspar]
name = "Assayed Pay"

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_meeting]
title = "Steady Hands"
text = "A bag of soldiers’ pay sits on the long table of the assay room, tied off three times with cord. Kaspar has brought it for old Fritz, who served in his company. Liesbeth tips out ten coins, weighs them, then sets the touchstone on the table. “Hold it down. I need a streak.” Kaspar presses a hand on the stone, and it chatters against the wood. She looks up. The hand is shaking like a sheet of paper in a draft. In all the years she has known him, she has never seen that. She asks nothing. She opens a drawer, takes out a wooden clamp and clamps the stone down to the edge of the table. “Put the silver here and step back.” Kaspar steps back and puts his hand behind him. The streak is plain: the bag is a tenth short of good silver. “Fritz said the bag felt light. I told him he’d miscounted.” “He hadn’t.” The next day Kaspar is back, an old coin worn bright in his palm. “No clamp this time.” The stone rattles twice under his hand and goes still."
news = "The woman assayer at the Antwerp mint tested a bag of soldiers’ pay for an old gunner. It came out a tenth short in silver."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_turning]
title = "Payments Stopped Again"
text = "The tavern on the quay talks of one thing this week: the king has stopped payments again, the bankers have shut their doors, and the Spanish soldiers up in the citadel haven’t seen full pay in over a year. The money going around now, they say, has a few clipped old coins in every bag. The soldiers curse the mint, and the mint curses the pay office. Two days ago somebody saw the assayer from the mint, the one in the white linen cap, standing at the pay office door with a voice you could hear halfway down the street. “Coin that has never been on my scale, I won’t vouch for. Not one word!” Beside her stood a half-deaf old gunner, who leaned in to her ear. “Test first. Save the cursing for tonight.” She shut her mouth. From the next day on, the pay office sent men with sacks of coin, one bag after another, to the assay room."
news = "The king of Spain has stopped payments again, and the pay office in Antwerp is mixing clipped old coins into the soldiers’ pay. The troops curse the mint, the mint curses the pay office, and sacks of coin keep going to the assay room."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_closer]
title = "Bags Kept Apart"
text = "The pay office has sent over a heap of coin bags, the name tags long since rubbed off. Kaspar stands at the window, looks at the soldiers waiting in the yard, and matches bags to men. “The one against the wall hasn’t had a hot meal in a week. The light bag is his.” Liesbeth turns each coin edge-on to the window light. “Filed. Not filed. Filed.” The pay office clerk shoves a young soldier up to the table. “Everything in his bag is filed thin. It was him.” Kaspar looks the boy over. “Doesn’t seem likely. Filing an edge takes a steady hand, and this one can’t even hold on to his cap.” “Until I’ve tested it, nobody’s word counts,” Liesbeth says to the clerk without looking up. “Including yours.” She tips out nine more bags. Every coin bears the marks of the same file, cut to the same depth, and all of it done before the pay went out. “It wasn’t him.” The cap drops to the floor. Kaspar bends, slaps the dust off it and pushes it back into the boy’s hands."
news = "The woman assayer at the Antwerp mint and an old gunner went through the soldiers’ pay bag by bag and cleared a young soldier of clipping coins."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_choice]
title = "A Statement of Fineness"
text = "Word has come that the Spanish soldiers at Aalst have mutinied, and the crowd at the mint door is twice its usual size. Liesbeth slaps a sheet of paper down on the assay room table, the ink still wet, and shakes sand over it. It is a statement on the soldiers’ pay: of every ten coins the pay office has put out, three are short in weight. She has tested every bag and written down every coin. Kaspar picks it up and reads slowly. “This has to go to the council, and the sooner the better. Find the way out first, then place the gun. The city has to know why the men are rioting.” “Nobody will read it,” says Liesbeth, blowing off the sand. “And if they do, they won’t believe it.” Kaspar sets the page back on the table and says nothing. They both turn and look at me."
news = "The Spanish soldiers at Aalst have mutinied, and a statement on the fineness of the soldiers’ pay has been nailed to the door of the Antwerp mint. A crowd stood around it all day."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_choice.choices.deliver_testimony]
text = "Take the statement to the city council and hand it to the man in charge of the soldiers’ pay."
reply = "The official in charge of the pay reads it through while I stand there. “Three in ten? Who tested these?” He reads Liesbeth’s name twice, puts the paper in a cabinet and turns the key. “I’ll report it up.” Out in the street Kaspar says, “At least somebody took it.” “Took it, yes. Did he read it?” says Liesbeth. That night the mint’s windows go dark an hour earlier than usual."
news = "The official in charge of the soldiers’ pay at the Antwerp town hall has taken in a statement from the woman assayer at the mint and says he will report it up. Whether he has read it, nobody in the taverns can say."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_choice.choices.read_aloud]
text = "Read the statement aloud to the soldiers in the tavern on the quay."
reply = "I climb onto a bench and read it through. Nobody in the room makes a sound. The first to move is a one-eyed old soldier, who slaps a handful of coin down on the table. “Test this.” Then a second, then a third. Liesbeth scolds me for not warning her, and her hands are already opening the scale case and spreading out the cloth. She tests coin after coin until the bells strike midnight. Kaspar stands with his back against the door, and when someone tries to push in he says two words: “Line up.”"
news = "In a tavern on the Antwerp quay, someone read the mint’s statement on the soldiers’ pay aloud. When it was done, several old soldiers slapped their coin down on the table and asked the woman assayer to test it on the spot."

[tracks.tie_extra_10_liesbeth_devries_kaspar.chapters.tie_extra_10_liesbeth_devries_kaspar_landing]
title = "A Supper Without Silver"
text = "In October Kaspar steers Liesbeth into the tavern on the quay and lays down the rule before they sit. “No talk of silver tonight.” The change from the counter has barely reached her hand before she is holding a coin up to the lamp to study its edge. He raps the table once. The bread comes, and she is explaining how silver with copper in it turns red if it sits too long. He raps twice. The third time she gets as far as “I want to add one more line to the statement,” and his knuckles come down so hard that the soup slops in the bowls. Halfway through the meal he fetches a stick of charcoal from the hearth and starts drawing the city’s streets on the tablecloth. This alley comes out at the river. That gate isn’t locked at night. The lines shake, but he leaves out no crossing. “Find the way out first, then place the gun. Remember that.” Liesbeth looks for a long time. She doesn’t reach for a clamp. She leaves a tested coin under her plate, folds the cloth and puts it in her pocket."
news = "In a tavern on the Antwerp quay, an old gunner drew a map of the city’s streets on the tablecloth, and the woman assayer took the cloth away with her."

