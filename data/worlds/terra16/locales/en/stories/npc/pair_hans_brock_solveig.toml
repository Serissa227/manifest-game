# C7 story rewrite, English overlay: Hans Brock x Solveig, "One More Look West".
# Keyed by track, chapter and choice; display text only.

[tracks.pair_hans_brock_solveig]
name = "One More Look West"

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_meeting]
title = "The Wrong Name"
text = "“Hats off. This is a Hanse ship.” Hans ducked into the turf house with a dried fish in his fist. Solveig didn’t look up from the fire. “This is my house. Your ship is bobbing at the dock.” She weighed the fish on one finger. “And the fish is too small. Sit closer, my voice isn’t what it was… but first tell me what you’re paying with.” The fish became two. She got as far as the land of flat stones in the west, and Hans slapped his knee. “Hellaland! Where I come from, hell means bright. The bright land!” “Helluland. Land of slabs. Nothing bright about it.” Three times it went that way. The old man pulled rank: “Forty years I’ve sailed—” “Did you ever live there?” Hans stood with his mouth open for a long while, then burst out laughing. The fourth time he said it perfectly, took off his hat, and set it on his knee."
news = "In a turf house in Hafnarfjordur, the storyteller corrected a Lübeck sea captain on a place name three times. He got it right on the fourth and laughed so hard he took his hat off."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_closer]
title = "The Last Barrel of Flour"
text = "With war about to break out in the north, Hans said this year’s ship might be the last one. He had the final barrel of flour in the hold carried into the turf house and thumped it down on the floor. “That’s for the end of the Greenland saga.” Solveig lifted the lid, looked in, put it back, and began. The ship leaving the fjord, the fog rising off the water, the masts going into it one by one— She stopped. “The ending can wait for next time.” “You took the flour!” Hans pounded the table. “That’s cheating!” “Then you’ll have to come back.” The old man glared at her and found nothing to say. He picked up his cup, raised it halfway to rap the table, and set it down gently instead."
news = "A Lübeck captain paid his last barrel of flour for a saga. The Hafnarfjordur storyteller told only half of it and says he can have the ending next time he comes."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_turning]
title = "After Stettin"
text = "The treaty at Stettin is signed, and seven years of war on the Baltic are over. The talk on the Lübeck docks this week is all about the old ship up on the slip, and the treaty comes second: Hans Brock, seventy-eight, is scraping her bottom again and has put a new halyard on the Hanse flag at the masthead. “At your age, old man? Going to sea?” someone asked. “Iceland,” he said without looking up. “To hear the end of a story.” There’s already a table of men betting on whether he sails come spring."
news = "The Stettin treaty is signed, and on the Lübeck docks an almost-eighty captain is scraping his hull again. He says he’s off to Iceland in spring to hear the end of a story. Bets are open."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_choice]
title = "The Knees Get a Vote"
text = "Hans did come, and the first thing he said was that he’d had three days of headwind and wanted hot wine. A chart lay open on the turf-house table with a charcoal ring drawn in the west. “The old people say the Greenland ship was lost in the fog,” Solveig said, tapping the ring. “We’ll go and see what’s in it. But,” she turned to Hans, “if we get halfway and can’t go on, can we get back?” Hans called her a spoilsport first. Then he bent and rubbed his knee, which ached whenever the sky was gray, and the sky was gray today. “My knees get a vote,” he muttered. “They say draw it bigger, so we can turn around farther from the ice.” He took the charcoal and drew a much bigger ring around it. “Past this line, turn around any time.” Solveig’s voice would last only a few days in the sea wind. The two old people turned together and looked at me."
news = "Two almost-eighty-year-olds in Hafnarfjordur mean to sail west for a look at Greenland, and the whole dock is betting on how many days they’ll last."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_choice.choices.supplies]
text = "Lend them a sturdy boat and enough supplies to winter on"
reply = "I handed over a sturdy skiff from my ship, then loaded the thickest blanket and two casks of salt meat. Hans counted them three times and grunted, “A Hanseman owes no favors.” Solveig said then he could pay in stories, and squatted on the gangplank to tell one on the spot. When she finished, Hans picked up the thickest blanket and carried it to her bunk first."
effects = [{ }, { }, { }, { title = "The Thickest Blanket" }]

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_choice.choices.turnback]
text = "Mark the turnaround line on the chart with them: back at the first ice"
reply = "We drew one line across the chart. Hans stared at it for a long time. “The most cowardly line I’ve drawn in my life.” Then he took the charcoal, made a mark beside it, and slid the line back by a finger’s width. Solveig didn’t answer. She rolled up the chart, tied it with her own scarf, and tucked it inside her coat."
effects = [{ }, { }, { }, { title = "The Most Cowardly Line" }]

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_choice.choices.watch]
text = "Stay out of it and just see them off from the dock"
reply = "I stood on the dock. Hans took the helm and Solveig sat in the bow, and the boat moved slower than a person walks, never daring to set full sail. Someone behind me shouted, “Back in three days!” The stake was one dried fish, and a whole row of them was already lined up on the chopping block. I didn’t bet. I watched the boat round the breakwater until the sail was small."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_together]
title = "Nothing but Ice and Birds"
text = "They came back. Ice ran to the edge of the sky, covered in seabirds screaming loud enough to ring in the ears; no smoke, no roofs, no people. Solveig had said nothing aboard. She stood in the bow with both hands clamped on the rail and watched the ice until it was gone. Onshore she sat Hans down by the fire and told the ending of the Greenland saga. It was unlike any version she’d told before: on the ship in the fog there was now an old captain from Lübeck, cursing under his breath, his knees aching. “You’re making it up again,” Hans said. “Stories are more honest than ledgers.” The next day Hans took the Hanse flag down from his masthead and nailed it over her door frame to stop the draft. His sea chest was already inside the house, and nobody mentioned sailing dates to Lübeck anymore."
news = "The two old folk of Hafnarfjordur got back from a look to the west and saw only ice and birds. The Lübeck captain isn’t leaving this time. He’s nailed his Hanse flag over the old woman’s door."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_together.variants.helped]
text = "They came back. Ice ran to the edge of the sky, covered in seabirds screaming loud enough to ring in the ears; no smoke, no roofs, no people. Solveig had said nothing aboard. She sat with the thickest blanket over her knees, fingers wound in its edge, and watched the ice until it was gone. Onshore she sat Hans down by the fire and told the ending of the Greenland saga. It was unlike any version she’d told before: on the ship in the fog there was now an old captain from Lübeck, cursing under his breath, his knees aching. “You’re making it up again,” Hans said. “Stories are more honest than ledgers.” The next day Hans took the Hanse flag down from his masthead and nailed it over her door frame to stop the draft. The blanket stayed on her bed, his sea chest was already inside the house, and nobody mentioned sailing dates to Lübeck anymore."

[tracks.pair_hans_brock_solveig.chapters.pair_hans_brock_solveig_together.variants.matched]
text = "They turned around at the mark Hans had added. Ice ran to the edge of the sky, covered in seabirds screaming loud enough to ring in the ears; no smoke, no roofs, no people. Solveig had said nothing aboard. She stood in the bow with both hands clamped on the rail and watched the ice until it was gone. Onshore she sat Hans down by the fire and told the ending of the Greenland saga. It was unlike any version she’d told before: on the ship in the fog there was now an old captain from Lübeck, cursing under his breath, his knees aching. “You’re making it up again,” Hans said. “Stories are more honest than ledgers.” The next day Hans took the Hanse flag down from his masthead and nailed it over her door frame to stop the draft. The chart hung beside it, the mark by the line left unrubbed. His sea chest was already inside the house, and nobody mentioned sailing dates to Lübeck anymore."
