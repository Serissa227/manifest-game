# C7 英文覆盖：上岸再说（尼科斯 × 穆拉德）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标，只有回忆标题需要译文。

[tracks.pair_nikos_murad]
name = "Ashore First"

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_meeting]
title = "Where the Rope Ends"
text = "A rope was tied to the rocks below Qaitbay Citadel. Every night someone went down it to feel for the stones the Pharos had dropped into the sea, and every night a guard walked the wall above and took care not to see. Each time he came back, the end of the rope lay a little closer to his boot. Tonight the rope finally went slack. The diver, Nikos, climbed onto the rocks with his teeth chattering. “You don’t… you’re not afraid of being punished?” The guard, Murad, scowled and threw a dry shirt at his head. “My watch isn’t over. I haven’t gone anywhere. Stop shaking.” Nikos caught the shirt. First he wiped the mud off the stone in his hand. Only then did he dry his hair."
news = "Under Qaitbay Citadel in Alexandria somebody dives at night, and the guard swears he has never seen a thing. Yet the rope end on the rocks is in a new spot every morning."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_closer]
title = "The Fresh Rope"
text = "The old rope had worn a frayed patch on the rocks. Murad felt it all one night, and the next day he brought a coil of new rope and shoved it into Nikos’s arms. “Use the old one again and I’ll raise the alarm.” “How did you… know it would break?” “I run my hand along it every night.” Murad’s ears went red, and he looked hard at the sea. Nikos didn’t go in. He sat down, wiped the stone he had pulled up that day, and held it out. One half of a carved letter showed on the break, hooked like a fishhook. Murad held it the way you hold a bowl of hot soup, and held it a long while before he gave it back."
news = "The night guard at Qaitbay Citadel in Alexandria turned up with a new rope from somewhere. They say it’s tied to the rocks under the walls."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_turning]
title = "Lead With Writing On It"
text = "The story going round the harbor is that a Greek diver has pulled a sheet of lead out of the old lighthouse rubble, covered in writing nobody can read. The fishwives say it’s a treasure map. The miller’s wife says it’s a wicked book. A man who studied scripture for a few years says nobody writes on lead for no reason. A few days ago the citadel had a night guard in for questioning about stones going missing from the wall. They kept him till the small hours, and he never said a word."
news = "A diver in Alexandria has hauled up a lead plate covered in writing, and the harbor says it’s a treasure map. The citadel questioned a night guard till dawn and got nothing out of him."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_choice]
title = "A Reader for the Lead"
text = "The lead plate had been lying under the planks of Murad’s bed for a year. At noon Nikos came to the back wall of the citadel in daylight for the first time. Murad carried the plate out wrapped in sailcloth, set it on a stone, and both men turned to me. “If we hand it in, they’ll take it,” Nikos said. “I don’t want it on somebody’s shelf where no one reads a single word.” Murad laid a hand on the plate. “If you don’t hand it in, you’ll go after a second one. Alone, at night. I can’t stop you.” Nikos looked down at the plate. “What’s written underwater, don’t make it up ashore. We need somebody who can actually read it.”"
news = "They say the lead plate with the writing is still in Alexandria, and somebody saw the Greek diver and a citadel guard arguing over it for half a day behind the citadel."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_choice.default]
news = "A guard in Alexandria forced the Greek diver to nod: no more diving alone at night. Neither of them has said a word about the lead plate since."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_choice.choices.scribe]
text = "Find a scribe who knows the old scripts to read the plate"
reply = "I sent word to the old town and a scribe came. He studied the plate for three days, shaking his head, and made out only a few characters. “If I guess at the rest, I’ll be spoiling it,” he said. Nikos copied the few characters onto a scrap of paper and folded it four times. Murad wrapped the plate up again and put it back where it had been."
effects = [{}, {}, {}, { title = "A Few Characters" }]
news = "A scribe who reads old scripts spent three days in Alexandria and came out saying only, “Too old.”"

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_choice.choices.rubbing]
text = "Persuade them to make a rubbing for the public and leave the wall stones alone"
reply = "Two rubbings were made. One went to the library of the harbor mosque, where the old keeper pinned it flat with a paperweight and studied it a long time. Nikos promised to leave the stones under the wall alone, and Murad promised to go with him to dive somewhere else, by day. “That’s settled, then,” Murad said, scowl still in place. Nikos agreed, and his eyes slid toward the rocks."
effects = [{}, {}, {}, { title = "The Public Rubbing" }]
news = "The harbor mosque library in Alexandria has a new rubbing on its shelf. They say a Greek diver and a citadel guard brought it in together."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_choice.choices.watch]
text = "Stay out of it and let them work it out"
reply = "I backed off to the corner of the wall. They argued for a long time. Murad’s voice rose once, and Nikos broke off three times. In the end the plate was carried back inside, and Nikos followed, saying quietly, “You keep watch over it. I’ll keep watch over you.” Murad didn’t turn around, but his steps slowed."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_together]
title = "Walking in Daylight"
text = "One spring morning, just as Murad came off duty, Nikos was waiting outside the main gate of the citadel, with no rope and no wet clothes. “Walk in daylight?” Murad glanced all around. “In daylight. Along the East Harbor. Slowly.” A fishmonger called out to Murad three times, and three times he said, scowling, “Night watch. Not buying,” until Nikos was laughing too hard to stand. On the way back they cut round to the lee side of the wall, where the stone kept the wind off. Murad reached out first. Nikos leaned in and kissed him. The wall was built from old lighthouse stone. “There’s writing in there I can’t get at.” “Not today.”"
news = "People in Alexandria say the Greek diver who used to slip into the water at night now walks the East Harbor in broad daylight beside a citadel guard."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_together.variants.helped]
text = "One spring morning, just as Murad came off duty, Nikos was waiting outside the main gate of the citadel, with no rope and no wet clothes, only a piece of paper folded four times inside his shirt. “Walk in daylight?” Murad glanced all around. “In daylight.” Nikos pressed the paper through the cloth. “Along the East Harbor. Slowly.” A fishmonger called out to Murad three times, and three times he said, scowling, “Night watch. Not buying,” until Nikos was laughing too hard to stand. On the way back they cut round to the lee side of the wall, where the stone kept the wind off. Murad reached out first. Nikos leaned in and kissed him. The wall was built from old lighthouse stone. “There’s writing in there I can’t get at.” “Not today,” Murad said."

[tracks.pair_nikos_murad.chapters.pair_nikos_murad_together.variants.matched]
text = "One spring morning, just as Murad came off duty, Nikos was waiting outside the main gate of the citadel, with no rope and no wet clothes. “Walk in daylight?” Murad glanced all around. “In daylight,” Nikos said. “We’ll go by the library.” The rubbing hung on the wall of the mosque library, and every time Nikos passed he went in for a look. Murad waited at the door, leaning on the frame. “How many times is that?” “One more.” On the way back they cut round to the lee side of the citadel wall, where the stone kept the wind off. Murad reached out first. Nikos leaned in and kissed him."
