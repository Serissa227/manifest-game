[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_landing.variants.masks]
text = "On the Feast of Saint Blaise the procession passes the Rector’s Palace: the saint’s silver reliquaries in front, then banners and drums, then a line of masked marchers. Cecilia unwraps a cloth bundle. It is last year’s unpainted mask; she left it untouched until just before the feast, and now it shows Frana as she is now: the line between the brows gone shallower, a few fine ones at the corners of the eyes. She holds it up beside Frana’s face. “Well? Is it you?” Frana studies it for a long time. “It is. Don’t paint me younger.” She puts it on and steps into the procession. A few paces on she turns back, lifts the mask away and smiles at Cecilia. It is a face Cecilia has never seen. Her hand goes to the charcoal at her belt."
