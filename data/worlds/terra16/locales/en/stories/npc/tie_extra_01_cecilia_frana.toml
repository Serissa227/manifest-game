[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_closer]
title = "Four Women at One Table"
text = "On the night of the winter solstice, Cecilia’s paper masks cover the back-room wall, weeping and laughing, every one of them flushed red by the stove. Amaia’s herb broth bubbles on the fire. The fourth place at the table is empty but for a small packet of mastic, sent by ship from Chios every year, with a letter tucked under the string. Frana opens the letter and reads it to them: “We cut the bark early this year and the tears were few. The best of them are all in this packet. Don’t give it away.” “She writes that every year,” says Frana, “and every year I give it away.” She breaks the resin in three and pushes a piece in front of each of them. Two cups later the envoy has fallen asleep against the wall, and the line between her brows has smoothed out. Amaia reaches over to nudge her; Cecilia stops her. “Don’t wake her. You don’t often see this face.” She takes out a stick of charcoal and starts drawing on a sheet of the paper Amaia wraps her powders in."
news = "On the night of the winter solstice the back room of the apothecary by the port in Ragusa stayed lit past midnight. A few women sat laughing around a pot of broth, and the envoy fell asleep against the wall after two cups."

