[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_closer.variants.eleni]
text = "On the night of the winter solstice, Cecilia’s paper masks cover the back-room wall, weeping and laughing, every one of them flushed red by the stove. Eleni comes over from her shop two doors down with a jar of resin, and the moment she sits she is arguing with Amaia over how much ginger goes in the broth, as if haggling at market. “Three slices! One more and I won’t touch it.” “Seven,” says Amaia, without looking up. “If you won’t, someone else will.” Frana tries the middle ground. “Five. Each side gives a little.” Neither side listens, so she pours herself a drink. Two cups later the envoy has fallen asleep against the wall, and the line between her brows has smoothed out. Eleni goes to nudge her; Cecilia stops her. “Don’t wake her. You don’t often see this face.” She takes out a stick of charcoal and starts drawing on a sheet of the paper Amaia wraps her powders in."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_turning]
title = "The Health Office Notice"
text = "A notice from the health office has gone up on the pillar by the port gate, the ink still wet, and a ring of sailors has gathered around it. Those who can read it read it out to those who can’t: any foreigner who practices medicine must have two citizens of the city stand surety, or may not dispense a single remedy. When the reading is done, several heads turn toward the shop by the port. The window where the Biscayan herb woman dries her herbs has stayed shut for days; only the one with the masks is open. When a man comes asking for something for a fever, the mask-maker hands him a smiling face. “The guild has the key to the medicine. Faces I have ready.” At the fish market they say the envoy spent a whole morning arguing with the physicians’ guild in the Rector’s Palace and came out still smiling, greeting everyone she passed. The cooper’s wife heard the first thing the envoy said when she came in that evening: “The guild wants a second guarantor.”"
news = "A health office notice in Ragusa says foreign healers need two citizens to stand surety for them. The apothecary by the port has sold nothing but masks for days."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_choice]
title = "Surety for a Foreigner"
text = "Two sheets lie on Frana’s desk. One is Amaia’s surety bond, with Frana’s own name on the first line; the guarantor she put on the second line was sent back by the guild, on the grounds that he owes the envoy a favor and so does not count. The other is the Republic’s order: a batch of masks for next year’s Feast of Saint Blaise, waiting to go to Cecilia. She slides the mask order to the bottom of the pile and draws out the bond. Cecilia leans in the doorway. “Even an envoy puts the Republic’s business second?” “Don’t tell the Great Council.” Only then does Frana notice me, and she rises to offer a chair. “I saw your ship the moment it came in. Not a mast in the harbor stands straighter. …And that’s the pleasantries seen to. What do you want?” Cecilia laughs out loud. “She needs a guarantor, and she won’t be the first to say so.”"
news = "Ragusa’s envoy pledged her own salary as surety for a Biscayan herb woman, and the masks for the Feast of Saint Blaise were ordered a month late because of it."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_choice.choices.stand_surety]
text = "Go to the health office and stand as Amaia’s second guarantor."
reply = "I sign the second line of the bond. The guild’s old physician glances at it. “A foreigner vouching for a foreigner?” He goes through my papers twice, then sends down to the port for three sailors, all of them Amaia’s patients: one whose fever broke, one who kept his leg, and one who only came for a drink. When he has heard them out, he stamps the bond with the guild’s seal. That night Amaia presses a packet of seasickness powder into my hand and won’t take a coin for it. “If I took money, it wouldn’t be repaying a favor.”"
news = "A foreign captain’s name has turned up on a surety bond at the Ragusa health office, and the Biscayan herb woman by the port has opened her herb window again."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_choice.choices.festival_masks]
text = "Ship gold leaf and paper blanks from Venice so Cecilia can fill the Saint Blaise order."
reply = "One crate of paper blanks is crushed in the hold; what’s left is just enough. Cecilia works a month without stopping and delivers every mask the Republic ordered. As for the bond, Frana ends up pledging her own salary. Before I leave I see Cecilia make one more, unpainted, wrap it in cloth and lay it at the bottom of the box where she keeps her molds. “That one’s for the envoy,” she says. “What colors it gets, I’ll decide once I’ve seen her other face.”"
news = "A ship from Venice brought crates of gold leaf and paper blanks to the mask shop by the port in Ragusa, and not one of the Republic’s festival masks was missing."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_landing]
title = "An Old Friend’s Face"
text = "On the Feast of Saint Blaise the procession passes the Rector’s Palace: the saint’s silver reliquaries in front, then banners and drums, then a line of masked marchers. Cecilia unwraps a cloth bundle, takes out a new mask and holds it up beside Frana’s face. It shows her as she is now: the line between the brows gone shallower, a few fine ones at the corners of the eyes. “Well? Is it you?” Frana studies it for a long time. “It is. Don’t paint me younger.” She puts it on and steps into the procession. A few paces on she turns back, lifts the mask away and smiles at Cecilia. It is a face Cecilia has never seen. Her hand goes to the charcoal at her belt."
news = "In the Saint Blaise procession at Ragusa, the envoy wore a mask with fine lines at the eyes. Halfway along she took it off, turned back and smiled at the mask-maker at the edge of the crowd."

