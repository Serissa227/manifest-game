# C7 英文显示覆盖（2026-10-11，Claude 写）：按轨道、章节、选项、变体的 key 对应中文分片 stories/npc/tie_extra_01_cecilia_frana.toml；只覆盖文字，不带玩法字段。

[tracks.tie_extra_01_cecilia_frana]
name = "Don’t Paint Me Younger"

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_meeting]
title = "The Envoy Who Won’t Smile"
text = "Frana Lukić has come to inspect the foreigners’ residence papers. In the two rooms rented above the cooper’s, she checks every page against its seal, and her brow has not unknotted since she came up the stairs. When she is done, she mentions in passing that she would like a mask. “Laughing ones, weeping ones, all along the wall. Pick one?” says Cecilia. “Whatever you like.” The envoy is already turning to the next file. Ten days later she comes to collect it. In the box is a frowning face, one vertical line cut deep between the brows. Frana laughs in spite of herself. “Is that how I look to you?” “That’s the face you came in with,” says Cecilia. “The one you leave with, I haven’t seen yet.” Frana shuts the lid and walks off with the box under her arm. The face ends up on her study wall, opposite her desk."
news = "The new mask-maker by the port in Ragusa made the envoy a frowning mask. The envoy didn’t send it back; she took it home and hung it in her study."

[tracks.tie_extra_01_cecilia_frana.chapters.tie_extra_01_cecilia_frana_meeting.variants.both]
text = "Frana Lukić has come to inspect the foreigners’ residence papers. This shop by the port dries herbs in its left window and hangs masks in its right, and nailed to the doorframe is a permit gone yellow at the edges. She knows the hand; it is her own. “I wrote this eight years ago. You certainly kept me waiting.” When the papers are done, she mentions in passing that she would like a mask. “Laughing ones, weeping ones, all along the wall. Pick one?” says Cecilia. “Whatever you like. But we settle the price first. Two doors down there’s a woman who sells mastic and bargains as though every price were a quarrel. Don’t learn from her.” Ten days later she comes to collect it. In the box is a frowning face, one vertical line between the brows. Frana laughs in spite of herself. “Is that how I look to you?” “That’s the face you came in with. The one you leave with, I haven’t seen yet.” Frana shuts the lid and walks off with the box under her arm. The face ends up on her study wall, opposite her desk."

