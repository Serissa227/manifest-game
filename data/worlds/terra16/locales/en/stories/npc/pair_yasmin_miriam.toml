text = "In spring the workshop gave Yasmin the paintings for a book of poems. By custom the last leaf belongs to the scribe’s colophon; painters may not sign. Around the colophon she drew a border of twining flowers and in the corner set a single pomegranate flower, the veins of its petals winding about to spell a name: Golnar. Her old nurse in Tabriz used to call her that. It means pomegranate flower. She had said the name aloud to only one person, once. Behind the last leaf she had tucked a mounted scrap of lining paper: Rakhsh, short one hind leg, still with his head down to drink. Miriam came for the book, checked the seal first as always, then turned the pages one by one to the last. Her finger stopped on the flower. “This is you.” Yasmin did not deny it. “A flower in the corner of a wall still knows who is looking.” Miriam leaned across and kissed her by the lamp. Footsteps went past outside. She put the book in her basket, drew the cloth over it, and went out the door, once more the palace kira."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_together.variants.matched]
text = "In spring the workshop gave Yasmin the paintings for a book of poems. By custom the last leaf belongs to the scribe’s colophon; painters may not sign. Around the colophon she drew a border of twining flowers and in the corner set a single pomegranate flower, the veins of its petals winding about to spell a name: Golnar. Her old nurse in Tabriz used to call her that. It means pomegranate flower. She had said the name aloud to only one person, once. Miriam came for the book. Ever since last autumn’s letter arrived with its seal intact, she had looked at seals even longer than before. When she was done, she turned the pages one by one to the last. Her finger stopped on the flower. “This is you.” Yasmin did not deny it. “A flower in the corner of a wall still knows who is looking.” Miriam leaned across and kissed her by the lamp. Footsteps went past outside. She put the book in her basket, drew the cloth over it, and went out the door, once more the palace kira."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_epilogue]
title = "The Painter Bound for Hormuz"
text = "In the Jewish quarter of Istanbul they say Miriam the kira has been knocking only a third off the merchants’ prices this spring, not her usual half. Here is how the story goes. The Persian woman painter from the palace has been sent to Hormuz to paint a book for the king’s household there, and nobody knows for how many years. She left at the start of last autumn. It was raining that day, and she carried her paint chest onto the ferry for Üsküdar, where the road east begins on the far shore. On the same boat stood the kira’s messenger, a bundle on his back. The ferrymen say the kira never came to see her off, but that messenger carried the other end of the painter’s chest the whole way. This spring the messenger came back alone, carrying a letter, and took it to a green-painted door in the Jewish quarter. The seal on it has no letters, only a flower. The messenger says in the tavern that from now on he’ll be making the trip every season."
news = "The ferrymen at Üsküdar say the Persian woman painter from the palace went off to Hormuz to paint a book, and the day she left, the kira’s messenger shouldered his bundle and boarded the same boat."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_apart]
title = "Sent Away Early"
text = "The business of the missing leaf at the palace workshop in Istanbul was proven in the end: someone had sold it outside the palace to the Venetians. The woman painter from Persia was thrown out of the workshop and told to be gone from the city by spring. Before she went, she sent a letter to the kira in the Jewish quarter, sealed with that seal of hers that bears nothing but a flower. The errand boy who carried it says the kira did not open it in front of him. She tucked it inside her dress, against her heart, and paid him double. The old women of the quarter clicked their tongues: a letter carried like that can only be a love letter. In spring the painter left with a caravan heading east, bound for Hormuz to paint books for people there, they say. She was hardly out of the gates before the kira’s messenger took the same road, and he’ll be making the trip every season from now on. That Venetian in Galata hung the leaf in his counting house and tells everyone who comes in how alive the horse’s eyes are."
news = "In the Jewish quarter of Istanbul they say the Persian woman painter thrown out of the workshop left for Hormuz with a caravan this spring, and the kira means to send a messenger after her every season."
