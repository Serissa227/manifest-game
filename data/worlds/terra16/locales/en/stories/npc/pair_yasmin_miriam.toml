# C7 配角线 pair_yasmin_miriam 的英文显示覆盖（嵌套表写法，按轨道、章节、选项与 variants 的 key 对应）；只覆盖文字，不复制玩法。

[tracks.pair_yasmin_miriam]
name = "The Name on the Last Leaf"

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_meeting]
title = "The Woman with the Basket"
text = "Once spring comes, the palace workshop keeps its windows open to dry the paper. I had brought a packet of Badakhshan lapis and was waiting by the door for the steward to pay me. At the other end of the bench sat Miriam, the kira who shops and carries messages for the palace women, come to collect a batch of small paintings. She never hurries anyone. Yasmin, the only woman painter in the workshop, was grinding the last of the blue, and grinding it slowly, as if on purpose. The courtyard in her picture was finished except for a patch the size of a palm in the lower right—in her paintings, that corner is never filled in. This time she dipped her brush in the blue and added a woman seen from behind, a basket on her arm, on her way out of a door. Miriam looked at it for a long time and did not ask who it was. “May I keep this one?” “Every painting here is entered in the register.” Yasmin blew on the corner. “Not one can go missing.” Miriam settled the basket on her arm and stood. “A letter can do its work without being opened.” When I came back for my money the next day, the steward said the count in the register was correct. Miriam passed the door just then, and under the cloth of her basket showed a corner of blue."
news = "That Persian woman painter in the Topkapı workshop put a woman with a basket into the corner of a small picture, they say, and the kira who came to collect it stared a long while without asking a thing."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_closer]
title = "Staying Past the Last Lamp"
text = "That year Miriam came to the workshop twenty-odd times, and every time she stayed a little longer. Yasmin kept count. She noticed something else: this woman remembered every seal in the workshop. Once, the cord knotted into the wax on the steward’s box of gold leaf had been turned the other way, and Miriam saw it the moment she walked in. “Someone’s opened that.” The steward spent three days looking into it. It was an apprentice. That night, with the lamps nearly out, Yasmin asked her, “You carry the ladies’ letters. If what’s inside ever gets out, it’s the carrier who pays. Aren’t you afraid?” Miriam rested the basket on her knees. “I remember the seal. Never what’s inside.” Yasmin drew a small painting, no bigger than her hand, from the bottom of her paint chest, folded it into a cover, softened the wax over the lamp, and pressed her own seal into it. The seal had no letters on it, only a pomegranate flower. She put the letter into the basket. “Then remember mine.” That letter stayed at the bottom of Miriam’s basket from then on, the pomegranate flower in the wax rubbed shiny, never once opened."
news = "The workshop apprentices tell it in the coffeehouses of Istanbul: the palace kira has been at the workshop all year, and she never leaves until the last lamp is out."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_turning]
title = "The Missing Leaf"
text = "All summer the coffee stalls of Istanbul talked about the Persian shah’s gift. Shah Tahmasp’s embassy had brought the new sultan, Selim, a Shahnama with more than two hundred paintings in it, gold on every page, people said. The palace workshop was ordered to copy several of them. The trouble was with the copy. The old man who sells pigments says the workshop’s own study copy is short a leaf. The royal book is untouched; what is missing comes from the copy the painters work from. The steward is beside himself and has had the painters from Persia brought in one by one for questioning, from morning till dark. The flatbread seller at the palace gate tells it more darkly: the missing leaf was the woman painter’s work, and someone saw her leave last every single day. Others take her side. If she meant to steal, why leave the real book and take a copy?"
news = "The Shahnama the shah sent the sultan is inside the palace in Istanbul, and now the workshop’s copy is short a leaf. Every painter from Persia has been questioned, they say, the woman painter too."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_choice]
title = "A Letter No One May Open"
text = "I was unloading a cart of paper at the back door of the workshop when it opened a crack. Yasmin stood just inside, the toes of her shoes against the threshold, not moving an inch past it—someone confined to the workshop who steps out that door can never explain it away. Miriam stood outside, a cloth over her basket. “If that leaf isn’t found in ten days, she has to leave the palace.” Miriam said it evenly, like reading out a bill. “And I have a letter to get out of the palace. No one may have touched the seal.” The letter had come from the sultan’s favorite; that was all she said about it, and she moved the basket behind her. The guards at the front gate had been searching every basket for days, even the bread seller’s. Yasmin looked at me through the gap. “That leaf is Rakhsh, Rustam’s horse. I painted its eyes. Without it the whole poem is short a rhyme.” Miriam looked at her, then at me. “You’re from outside the walls.”"
news = "The flatbread seller at the palace gate in Istanbul says the Persian woman painter in the workshop has been confined and must leave the palace if the missing leaf isn’t found. The kira has been hanging around the back door for days."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_choice.default]
news = "Istanbul argued all summer over the workshop’s missing leaf, and by autumn it was settled: the kira found a slip in the register of comings and goings. The leaf had been logged as “sent to the binder” all along."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_choice.choices.find_page]
text = "Search the bookbinders outside the palace—the copy was unstitched, and the leaf may have been cut up as scrap."
reply = "The binder’s shop is behind the Grand Bazaar, and the scrap there is piled higher than a man. On the second day of digging I felt something stiff in a stack of lining paper for book corners—paint on the back. I unfolded it, and there was Rakhsh at the river with his head down to drink, short one hind leg where the knife had trimmed him. I brought it back and passed it through the crack in the door. Yasmin held it in shaking hands. “My name isn’t on it.” She touched the horse’s eye with a fingertip. “But it’s mine.”"
news = "Somebody turned the scrap heap at the binder’s behind the Grand Bazaar in Istanbul upside down, they say, and dug out a leaf with a horse on it whose eyes still shine."
effects = [{ }, { }, { }, { title = "A Leaf in the Lining" }]

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_choice.choices.carry_letter]
text = "Carry Miriam’s letter out of the palace with the seal untouched."
reply = "I sewed the letter into the canvas bag I had brought from the ship, between the leaves of a roll of sample paper. At the gate the guards went through my basket item by item and never touched the bag. By the fountain outside the palace wall I handed the letter back to Miriam. She looked at the seal, turned it over, looked again, a long time, and only then smiled at me. The apprentices say she never smiles at messengers. That evening she went back to the workshop and read through the register of comings and goings until midnight."
effects = [{ }, { }, { }, { title = "The Seal As It Was" }]

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_choice.choices.sell_page]
text = "Someone is quietly selling that leaf—buy it, then sell it on to the Venetians in Galata."
reply = "The seller was a hand at the binder’s, and he did not ask little. I paid and went straight to Galata. The Venetian merchant held the leaf up to the window and studied the horse a long while, then paid three times what I had. The money was barely warm in my purse when the missing leaf became a settled fact: Yasmin was thrown out of the workshop and given a date by which to leave Istanbul. The next time I passed the back door, the crack had closed."
news = "A Venetian merchant in Galata paid a fortune for a single Persian painting of a horse, and a few days later the palace workshop in Istanbul turned a woman painter out."

[tracks.pair_yasmin_miriam.chapters.pair_yasmin_miriam_together]
title = "A Name Only She Could Read"
text = "In spring the workshop gave Yasmin the paintings for a book of poems. By custom the last leaf belongs to the scribe’s colophon; painters may not sign. Around the colophon she drew a border of twining flowers, thick and close, and in the corner set a single pomegranate flower. The veins of its petals were so fine you needed a reading crystal to follow them as they wound about and spelled a name: Golnar. Her old nurse in Tabriz used to call her that. It means pomegranate flower. She had said the name aloud to only one person, once. Miriam came for the book, checked the seal first as always, then turned the pages one by one to the last. Her finger stopped on the flower. “This is you.” Yasmin did not deny it. “A flower in the corner of a wall still knows who is looking.” Miriam leaned across and kissed her by the lamp. Footsteps went past outside. She put the book in her basket, drew the cloth over it, and went out the door, once more the palace kira."
news = "A book of poems just bound at Topkapı has borders on its last leaf so fine you have to hold them to a lamp. The workshop says it’s the Persian woman painter’s hand, but her name is nowhere in the book."

