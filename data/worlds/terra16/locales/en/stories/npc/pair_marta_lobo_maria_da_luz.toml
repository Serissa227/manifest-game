# C7：pair_marta_lobo_maria_da_luz 的英文显示覆盖（嵌套表写法，按轨道、章节、选项、变体 key 对应；不含玩法字段）。

[tracks.pair_marta_lobo_maria_da_luz]
name = "Two Women and a Hollow Wall"

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_meeting]
title = "Not a Runaway Bride"
text = "Late in September the India fleet came into Goa with the last of the monsoon still raining on it. Among the passengers was a woman whose only luggage was an oilcloth tube, which she hugged to her chest and wouldn’t let a porter touch. The first thing she asked on the quay was where she could find a bed without giving her name. Maria was at her warehouse door counting in a shipment of pepper. One look and she took the woman for a bride who had run off from some wedding in Lisbon; the fleet brought one or two every year. She tucked her ledger under her arm. “Come in out of the rain. The cargo can wait until tomorrow.” Upstairs there was an empty room where nobody wrote down surnames. The first thing Marta did was set the tube on the table and untie the cord. What slid out was no list of dowry linens but the corner of a heavy sheet, crowded with lines, the ink still fresh. Maria brought the lamp closer, and Marta pinned a corner of the sheet flat with one hand. “You can look. Don’t touch.” Maria tucked her hands back into her apron. She took one more look at the lines, then turned and pulled the shutter half closed. “All the more reason to eat first.”"
news = "That widow who trades out of the Goa docks has taken in another stranger. She’s lodging upstairs in the warehouse, came with nothing but an oilcloth tube, and won’t say her surname."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_closer]
title = "The Wall That Answered"
text = "Marta went around at night with a candle, looking for somewhere to put the tube. Under the bed boards was too shallow; the rafters had rats. She tapped along the wall with her knuckles, inch by inch, and on the side by the stairs the sound went hollow. She had just put her ear to it when someone inside the wall coughed. A board slid aside. The candlelight found an old woman with her arm around a thin girl, both crouched behind two rows of pepper sacks, both wide awake. Maria came up the stairs with a pot of rice gruel. She saw the open wall, stopped for half a step, then passed the pot in anyway. The old woman had her eyes and her brow. Maria explained nothing. She only looked at the tube in Marta’s arms. “That thing of yours. Want to put it in here too?” Marta opened her mouth, and none of her usual barbs came out. She handed the tube over. “Push it to the back. Mind her feet.” The next morning the aunt found a small map by her pillow: the back roads from Goa south to Cochin, the same road the two of them had fled up a year before, marked with where the ferries crossed and which parish priests didn’t ask questions. It was drawn finer than anything Marta had ever done for the trading house."
news = "They say the lamp upstairs in that widow’s warehouse in Goa burned all night. The lodger and the landlady sat up talking till dawn before anyone went to bed."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_turning]
title = "The Black Robes Arrive"
text = "That autumn the inquisitors came to Goa, and all at once the streets were full of black robes. Down at the docks people said the new men meant to search the homes of New Christians. Whose hearth stayed cold on Saturdays, who never touched pork: there was always a neighbor ready to report it, and plenty of the informers, people noticed, owed money to the families they named. One by one the warehouses along the Rua Direita had a knock at the door. A clove dealer was taken away, and his shop was sealed the same day. The fishwife says the widow merchant’s warehouse got its knock too. She showed the questioners into her counting room, poured them a glass of wine, and talked pepper prices with them for half the afternoon. They left empty-handed, and never so much as set foot on the stairs. Others say her lodger sat at the upstairs window all that afternoon with a pen in her hand and never made a single mark."
news = "The inquisitors have reached Goa and are knocking on every warehouse door along the Rua Direita. That widow merchant poured her visitors a glass, and they left empty-handed."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_choice]
title = "Who Keeps the Original"
text = "After the new year the knocking came more often. Two days ago the warehouse next door had its floorboards pried up. The chart and the people couldn’t stay behind the same wall any longer: if the searchers found one, the other was lost too. The two women argued until the wick burned down, then came to the docks to find me together. Marta spoke first, every word clipped short. “Get her aunt out first. I’ll hide the chart myself.” “You’ll hide it? I still have to carry your supper up the stairs.” Maria turned to me. “The chart goes first. As long as it’s in the house, she doesn’t sleep.” “The people go first.” “The chart goes first.” Each of them was begging a ship for the other’s secret. Maria had her fist closed around the key to the little brass padlock on the hidden loft; Marta held the oilcloth tube against her chest. Neither would let go first. At the far end of the quay the Fleming who asked about sea routes for an Antwerp firm was loitering again. Last month he had stopped Marta in the street to ask whether the chart was for sale."
news = "That widow merchant in Goa keeps walking down to the docks lately with her lodger beside her. They don’t say a word the whole way, then start talking at the same time once they get there."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_choice.default]
news = "The lodger at that widow’s warehouse in Goa has put her pen away; her inkpot’s dried out on the windowsill. That Fleming from the docks came knocking again and wasn’t let in."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_choice.choices.keep_chart]
text = "Take the original aboard my ship and leave it with someone I trust."
reply = "Marta put the oilcloth tube in my hands and kept her fingers pressed on the cap a long while before she let go. “This is worth a life. Don’t let it be worth yours.” Beside her, Maria pushed a bundle of food wrapped in banana leaves into my arms. “This is for the chart. A hungry courier doesn’t get far.” On the day I sailed, Marta didn’t come to the quay. Maria said she had spread a fresh sheet of paper upstairs and wouldn’t tell anyone what she was drawing."
effects = [{}, {}, {}, { title = "The Oilcloth Tube" }]
news = "That widow merchant in Goa sent a parcel of food wrapped in banana leaves out to a ship in the roads. For one of the passengers, she said, and wouldn’t say which."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_choice.choices.relatives]
text = "Carry Maria’s aunt and cousin to Cochin on my ship."
reply = "Before dawn two women came aboard with their heads covered, carrying a basket of flatbread Maria had baked through the night. As she left, the aunt pressed an old ring into Maria’s palm without a word. Marta stood on the quay the whole time and didn’t speak until the ship had cleared the harbor. “There. Now the only thing behind that wall is mine.” Maria slid the ring onto her finger. It was a size too big, so she tore off a length of thread and wound it around the base a few times."
effects = [{}, {}, {}, {}, { title = "The Aunt’s Ring" }]
news = "A ship left the Goa docks heading south before first light. That widow merchant stood on the quay until the sail was gone, and came back with a bit of thread wound around one finger."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_choice.choices.sell]
text = "Sell the chart to the Fleming on the quay who asks about routes for Antwerp."
reply = "The Fleming paid enough to buy a small boat, in a leather purse so heavy it sagged. Marta counted it twice without a word, then pushed the purse across the table to Maria. Three days later his clerk got drunk in a tavern and bragged that his master had paid the price of a ship for a roll of paper, and it was worth it. On the fourth day the inquisitors’ men were going door to door down the Rua Direita, asking after a woman who drew charts."
news = "A Flemish clerk got drunk in a Goa tavern and said his master paid the price of a ship for a roll of paper. Next day the inquisitors’ men were on the Rua Direita asking after a woman who draws."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_together]
title = "Landlady and Lodger"
text = "Only Marta knew where the original had gone. She didn’t say, and Maria didn’t ask. After that she never picked up a drawing pen again. She kept the books in the warehouse counting room instead, in small, level letters that never wandered; anyone could see it was a draftsman’s hand. If anyone asked, they were landlady and lodger. One night in the rains, with the downpour drumming dull on the roof and a single lamp left burning, Maria finished the last page of the accounts and reached for the lamp. Marta caught her by the wrist, turned her hand palm up, and began to trace on it with a fingernail. “That tickles.” “Hold still. This is Lisbon.” The nail moved down along a coast, swung wide around the bottom of it, and slowed to a crawl. “The Cape of Good Hope.” “Why so slow?” “Heavy winds.” She traced all the way to the heel of the hand and stopped. “Goa.” Maria closed her hand into a fist, as if the line might leak out. Marta looked at the fist. “This route owed me wages. I’d say I’ve collected.” Maria bent her head and kissed her."
news = "The lodger at that widow merchant’s place in Goa used to draw sea charts, they say. Now she only keeps the books, and when someone asks her for a chart, she says her hand’s gone stiff."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_landing_b]
title = "Charts Without a Name"
text = "With the original gone from Goa, Marta found she dared to pick up a pen again. She drew charts for merchants, unsigned this time, not even with her father’s name, and better than the crown’s: on the shoals between Goa and Malacca the official chart had two mistakes, and hers had none. Maria set the prices and didn’t knock off a single coin. When one shipmaster complained, Maria began rolling the chart back up. “Buy the crown’s, then. When you run aground, the crown won’t pay for the hull.” Out came his purse again. One night in the rains Marta spread a new chart on the long table and called her over. In one corner, on the shore at Goa, there was now a tiny warehouse with a lamp on its roof. “What’s this?” “A mark. The buyers won’t understand it. You will.” Maria studied it a long time and said the lamp was too small; the one upstairs was brighter. Marta set down her pen, leaned in, and brushed a kiss on the corner of her mouth. “Then go turn it up.”"
news = "There’s a woman in Goa drawing sea charts for merchants. She doesn’t sign them, and they beat the crown’s charts. Her landlady keeps the books and won’t come down a coin, and the shipmasters who balked all came back."

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_landing_b.variants.relatives]
text = "With the aunt and the cousin safe in Cochin, nothing was left behind the wall but Marta’s own things. “A roll of paper,” she said. “If they find it, they find it.” So she dared to pick up a pen again. She drew charts for merchants, unsigned this time, not even with her father’s name, and better than the crown’s. Maria set the prices and didn’t knock off a single coin. On the hand that turned the ledger pages she wore the aunt’s old ring; she had rewound the thread at its base twice now. Last month a letter came from Cochin, one line long: All well. The bread’s all gone. One night in the rains Marta spread a new chart on the long table and called her over. In one corner, on the shore at Goa, there was now a tiny warehouse with a lamp on its roof. “What’s this?” “A mark. The buyers won’t understand it. You will.” Maria studied it a long time and said the lamp was too small; the one upstairs was brighter. Marta set down her pen, leaned in, and brushed a kiss on the corner of her mouth. “Then go turn it up.”"

[tracks.pair_marta_lobo_maria_da_luz.chapters.pair_marta_lobo_maria_da_luz_apart]
title = "A Passage Every Year"
text = "People on the docks say the lodger who drew charts left in a hurry, on a night boat to Hormuz. Her luggage was the same oilcloth tube she had arrived with, only lighter now. The inquisitors’ men came to the warehouse on the Rua Direita the very next day and asked questions all afternoon. Whoever was in the counting room just kept filling their glasses, and they learned nothing. They came back once more, drank again, and again never went upstairs. From then on the widow merchant’s cargo lists carried one extra line every year: Hormuz, one passage. Some years she went herself and came back a shade darker from the sun. Other years someone came from over there and stayed upstairs in the warehouse for a month, until the monsoon turned. The dockhands say the two women never cry when they part at the gangplank. They just tighten each other’s headscarves a little."
news = "That lodger in Goa who drew charts left overnight, for Hormuz they say. Ever since, the widow merchant’s cargo list has one extra line a year: a passage to Hormuz."
