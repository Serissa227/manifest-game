# Which Page to Burn (pair_fatima_suleyman_celebi): English overlay, keyed by track, chapter and choice.

[tracks.pair_fatima_suleyman_celebi]
name = "Which Page to Burn"

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_meeting]
title = "Verse on Credit"
text = "Evening in Tahtakale, and the coffeehouse was packed with porters and clerks. At the table by the stove, Süleyman Çelebi, a palace clerk, set down his third empty cup, drew a sheet of paper from his sleeve and laid it on the table’s edge. “Madam, the Persian poets say one poem outweighs a city. I only want it to outweigh three coffees. Fresh ink, for today’s bill.” Fatima did not take it. She opened the ledger to the day’s page and pushed it across. “Traveler, a poem can be written slowly. The boys have to eat tonight.” He blushed to the collar and counted out his coins one by one. Only then did she pick up the paper and tuck it into the worn book beside her, not into the ledger. I sat on the bench by the door and watched her press the page flat."
news = "The mistress of a Tahtakale coffeehouse in Istanbul won’t take poems for payment. A poet from the palace turned red and paid in silver on the spot."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_closer]
title = "After Closing"
text = "After closing, Fatima kept Süleyman back. The stools were upended on the tables, the stove down to red coals, one oil lamp set between them. That was her rule: new poems were read to her alone, and only then could he leave. That night he reached a line about the palace and stopped short. “Why did you stop?” “This one is about the palace.” Süleyman lowered the page. “A poem can be cut, but you can’t pretend you never wrote it.” Fatima did not tell him to cut it. She slid the lamp a hand’s breadth toward him. “Read on. I’m listening.”"
news = "After closing at a Tahtakale coffeehouse in Istanbul, the back room stays lit. Regulars say the mistress is listening to a palace poet read."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_turning]
title = "After Konya"
text = "In Tahtakale this week, talk around the stoves is about one thing: Prince Bayezid beaten at Konya and gone off to Persia overnight. The palace has started asking who keeps the prince’s verses and who copied his letters. A porter says the prince once wrote his father a poem begging mercy, and that clerks supposedly passed copies around. Someone lowers his voice: one clerk’s notebook has it, along with a few lines that are far too blunt, and lately he comes straight from the palace to a certain coffeehouse, eyes ringed with sleeplessness."
news = "Prince Bayezid is beaten and has fled to Persia, and the palace is hunting for his verses. Istanbul says a clerk has been running to a Tahtakale coffeehouse every day."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_choice]
title = "The Book by the Stove"
text = "Süleyman set a notebook wrapped in blue cloth beside the stove. “I can’t burn it. I can’t keep it.” It held the prince’s plea in copy, a few poems about the palace that were far too blunt, and several pages about the coffeehouse boys and regulars, who said what on which day, every one named. Only a single page had no names; it was about the lamp after closing. Officers had already come by once to ask questions. Fatima dragged a stool to the stove and turned the pages. “I’ll mind the fire; you put your poems away.”"
news = "The stove in a Tahtakale coffeehouse in Istanbul has burned fiercely these days. Some say the mistress is burning paper, but no one saw what."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_choice.choices.hide]
text = "Sew the book into canvas and sail it out of Istanbul"
reply = "I found needle and thread and, with both of them watching, began sewing the notebook into an old piece of canvas. Halfway through, Fatima stopped my hand, tore out the pages bearing the boys’ and regulars’ names, and fed them to the stove one by one. “These don’t sail.” The page about the lamp she slipped into her own book. Süleyman stared at the stove mouth and said nothing. I bit off the thread and sewed the rest shut."
effects = [{}, {}, {}, { title = "The Book in the Canvas" }]

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_choice.choices.deflect]
text = "Turn the officers aside when they come back"
reply = "Two days later the officer came again and asked, cup in hand, whether that clerk was a regular. I said he owed me for a cargo and I was looking for him myself. The officer laughed, finished his coffee, paid and left. The back door stood open a crack. When Süleyman came out, his hand was still shaking and the cup rattled. All Fatima said was, “Next time you owe money, pick a prettier excuse.” The stove in the back room burned late that night."
effects = [{}, {}, {}, { title = "A Debt Owed for Someone Else" }]

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_choice.choices.watch]
text = "Stay out of it and watch her pick the pages"
reply = "I stayed on the bench by the door. She read page after page and decided as she went: the boys’ names, burn; the palace lines, burn; the prince’s poem, burn that too. Flame licked the paper’s edge while Süleyman turned his face away. In the end one page remained. She looked at it a long while, then opened her own worn book and slipped it in."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_together]
title = "The Page She Kept"
text = "The danger had blown over. At closing I was the last customer, waiting by the stove for a second cup. Fatima finished wiping the last glass, drew a page from her old book and set it in front of Süleyman. Its edge was yellowed by the stove; it was about the lamp after closing. “If you must write, write here, for me alone.” Süleyman pinched the corner. “Madam, is that a proposal?” “Count yourself lucky, gözüm.” She kissed him across the table, briefly, then turned to me. “Collect the cups in the morning. If anyone asks, the fire was strong.”"
news = "The mistress of a certain Istanbul coffeehouse now leaves a lamp lit every night after closing. Regulars say a palace poet sits under it, reading to nobody but her."

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_together.variants.v1_helped]
text = "The danger had blown over. At closing I was the last customer. Süleyman asked about the notebook, and Fatima tipped her head toward me. “It’s on this one’s ship. Better at sea than in the palace.” She finished the cups, drew a page from her old book and set it before him; it was about the lamp after closing. “If you must write, write here, for me alone.” “Madam, is that a proposal?” “Count yourself lucky, gözüm.” She kissed him across the table, briefly, then turned to me. “Collect the cups in the morning.”"

[tracks.pair_fatima_suleyman_celebi.chapters.pair_fatima_suleyman_celebi_together.variants.v2_covered]
text = "The storm had passed, and the officers never came back. At closing Süleyman fished out a small purse and pressed it into my hand. “For the cargo. I owe it, and you shouldn’t carry my debt for nothing.” Fatima, wiping a cup, said, “Take it. I’ll keep his accounts.” She drew from her old book a page about the lamp after closing and laid it in front of him. “If you must write, write here, for me alone.” “Madam, is that a proposal?” “Count yourself lucky, gözüm.” She kissed him across the table, briefly."
