[tracks.pair_mathijs_jan_side]
name = "A Poet Under His Own Name"

[tracks.pair_mathijs_jan_side.chapters.pair_mathijs_jan_side_landing]
title = "His Name on the Title Page"
text = "The playbook was going to press. Jan set the composing stick on the table and looked up. “Whose name goes on the title page?” Mathijs thought about it so long that the bell on the corner rang twice. “Mine,” he said. “Mathijs Peeters. Not one letter short.” It was the first time he had put his name to anything he’d written. The letter he had rewritten and rewritten and never meant to hand over, he folded in four and slipped into the last page of his own copy of the proof, and closed it. Jan picked out the type one sort at a time and set the name straight and square, the right way round, rubbing the last letter clean once more. “I’ll read the proofs for you,” Jan said. “If there’s a wrong letter, I’ll buy you a pastry.” “Then I’ll come every day to watch you get it wrong.” “First learn to read type backwards.” They both laughed."
news = "The Violieren’s little play has been printed, and this time it carries a name: the young man who has played women’s parts since boyhood. People in Antwerp say he’ll sign everything from now on."

