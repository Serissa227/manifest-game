[tracks.pair_mathijs_jan]
name = "The Unsigned Play"

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_meeting]
title = "Type Read Backwards"
text = "Mathijs pushed open the door of the print shop, wanting to borrow a line of type for a playbill. Jan didn’t look up. He pressed a composing stick into Mathijs’s hand. “The letters are all backwards in the stick. Learn to read them the wrong way round first.” Mathijs read aloud in front of a roomful of apprentices, getting worse with every word, until the “king” on the playbill came out as “eel.” Jan burst out laughing, then halfway through glanced down at the line in the stick and went pale. “Wait—that accent’s on backwards.” “You make mistakes too?” Mathijs held the stick like a trophy. “That one was s-set for you. To practice on!” Jan smoothed the type flat and, as an afterthought, added one more line, backwards: Mathijs’s name. He didn’t take the name. He only picked a single period out of the case. “This is all I need. My play isn’t finished yet.”"
news = "In an Antwerp print shop, an apprentice set the name of the Violieren’s boy who plays the women’s parts backwards in type, and the boy walked off with a single period."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_closer]
title = "Not in the Script"
text = "In the third act of the rehearsal, Mathijs, playing the girl at the window, got as far as “The one I’m waiting for always has ink on his hands—” and stopped dead. Jan, down in the hall with the prompt copy, thought he’d lost the line. He found the page and held it up, a finger on one line. “It says ‘comes from the sea’ here. Stress on ‘sea.’” The whole hall waited. Mathijs took the copy, looked at it, and laughed it off. “Shh. It’s only a play. Don’t take it seriously.” Everyone laughed along. After the scene he went to the print shop with the rouge still on his face and carried paper all afternoon. Jan counted sheets beside him and got the count wrong twice. That evening Mathijs washed his hands. The rouge came off clean, but the ink stayed in the creases of his fingers."
news = "The Violieren’s boy who plays the women’s parts dried up on a line at rehearsal, and they say he spent the rest of the afternoon carrying paper at a print shop."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_turning]
title = "The Violieren’s Little Play"
text = "The rhetoric festival opened in Antwerp. Chambers from every town marched in with banners and scenery, and from morning till night there were queues for the plays. The talk of every tavern was the unsigned little play put on by the Violieren. The lead was the young man who has played women’s parts since boyhood, and one speech in it rang so true that an old woman in the front row soaked two handkerchiefs, and an elder actor from another chamber went around asking who’d written those words. Nobody on stage would say. But someone spotted a compositor from a print shop in the back rows. Everyone else clapped their hands red, and he never clapped once, just folded his playbill over and over. When it was done he was the last one out, and he turned back to ask the man stacking benches, “Is this one… playing again tomorrow?”"
news = "At the rhetoric festival the Violieren put on an unsigned little play, and they say a print-shop compositor in the audience never clapped and was the last one out."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_choice]
title = "After the Festival"
text = "The festival was over, but the bunting was still up in the streets. The Violieren’s rehearsal hall was heaped with props waiting to be put away, and Mathijs sat on a scenery board painted KING, a letter in his hand, wrapped in an extra sheet of paper so the ink wouldn’t smear the shared playbook. “There isn’t a line in it that wants an answer right away,” he said, holding it up to me in his stage voice. “Only the things I’ve said all these years through other people’s mouths. Take it to Jan for me.” I had hardly reached out when he pulled it back. “Never mind. Don’t.” He pressed it flat against his knee, knuckles white, still smiling. “See? I can’t even play this scene.”"
news = "Since the festival the Violieren’s young actor has been hanging about the print shop door, going in and coming out again, always clutching something."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_choice.default]
news = "A few days after the festival the print-shop compositor went to the Violieren’s young actor himself, and the two stood in a doorway for half an hour and agreed to talk again tomorrow."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_choice.choices.deliver]
text = "Hand the letter to Jan"
reply = "Jan wiped the ink from his hands on his apron before he would take the two layers of paper. He read standing by the type case, very slowly, pressing each fold flat with his thumb. When he finished, the only sound in the shop was type dropping into a box. “I, I’ll go to him tomorrow,” he said, and drew a breath. “Myself. If that’s all right? Nobody needs to carry it between us anymore.” I nodded. He folded the letter back the way it had come, and it took him three tries to get it right."
news = "Someone carried a letter wrapped in two layers of paper from the Violieren’s young actor to the print shop, and the compositor washed his hands before he would take it."
effects = [{}, {}, {}, { title = "The Letter in Two Wrappers" }]

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_choice.choices.say_it]
text = "Give the letter back to Mathijs and ask Jan to meet him at the shop after work"
reply = "I pushed the letter back into his hand and ran ahead to the print shop to pass on one sentence: “After work, he’ll be waiting at the door.” Mathijs arrived as the light was going and stood outside for a full quarter of an hour, straightening his collar, clearing his throat, until at last he crushed the letter into a ball, stuffed it in his pocket and went in. I stayed outside. Through the door I heard Jan say, “Hold on a moment,” and then nothing for a long time."
news = "The Violieren’s young actor stood a quarter hour at the print shop door before going in, and they say he came out as red as if he’d put on stage rouge."
effects = [{}, {}, {}, { title = "A Quarter Hour at the Door" }]

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_choice.choices.leave]
text = "Say nothing and let the letter stay in Mathijs’s pocket"
reply = "I took a step back and said it could wait. Mathijs visibly relaxed, laughed, and tucked the letter into his coat, striking a pose from the stage. “That’s better. Who takes anything said on a stage to heart?” The next morning I saw him turn into the lane to the print shop on his own, one hand pressed to the front of his coat the whole way."
news = "The Violieren’s young actor walked Antwerp for three days with something in his coat, and on the fourth morning turned into the print shop lane by himself."

[tracks.pair_mathijs_jan.chapters.pair_mathijs_jan_together]
title = "An Answer in His Own Voice"
text = "On an evening in March the shop had closed for the day, and a row of damp proofs hung on the drying line. Jan called Mathijs over under the rope, and this time he didn’t stammer. “In the autumn I said I’d answer tomorrow, and it took me until spring. That line, ‘The one I’m waiting for always has ink on his hands’: you got halfway through it at rehearsal, years ago. I set the proof of it three times, and every time my hands shook.” He took a small slip off the line and held it out. It was printed the right way round, a single line: “The one I wait for always has ink on his hands. I’m here, and the ink is still wet.” Mathijs tried to read it in his stage voice, lost it at the second word, opened his mouth to laugh it off, and no laugh came. His thumb brushed the edge of the slip and came away black. “It really is wet…” “This one isn’t backwards,” Jan said. He stepped closer and kissed Mathijs. The next day Mathijs wrote his own name on the last page of his new script, in big letters."
news = "An Antwerp compositor printed one small slip the right way round, a single line they say, and the Violieren’s actor keeps it inside his coat."

