[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_landing_b.variants.isabel_taken]
text = "The new master chart hangs in the House of Trade, and its river-mouth section is the old examiner’s granddaughter’s. Leonor comes to look at it once. She stands in front of it so long that the clerk copying charts looks up at her twice, and only then taps the eastern end of the mouth with the point of her sounding lead. “Here. It silted up again last winter. Don’t believe me—go and sound it.” It reaches Isabel the same day. She doesn’t go to the House to argue. She hires a boat and sounds it cast by cast for two days, then walks into the House and says to the clerk, “Give me the pen. I drew it; I’ll fix it.” After that, when the two of them pass on the docks, both look away. A month later a slip of paper is pushed under the door of the chart shop, with a single line on it: The Canaries chart in your shop—your latitude is two minutes out. Who drew this?"
