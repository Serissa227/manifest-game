[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_turning]
title = "Talk in the House of Trade"
text = "The water seller at the gate of the House of Trade says the pilots have taken to comparing their river-mouth charts whenever they get together. And when the comparing is done, neither of the two best comes from the House’s own chartmakers: one was drawn by the old examiner’s granddaughter, the other came out of the chart shop on the docks. The old pilots laugh. “So next time we cross the bar, we ask the ladies aboard?” The new lecturer in cosmography doesn’t laugh. He holds the sounding chart up to the window for a long while and says he has never seen a better one. The talk finds its way back to the docks. Someone asks Isabel if she has heard. She is trimming a quill. “Heard what?” The nib snaps, and she picks up another. Someone goes to the shop to ask Leonor, who doesn’t look up from the depth line she is inking. “Wait for the tide.”"
news = "Word in the House of Trade in Seville is that the two best river-mouth charts the pilots carry were both drawn by women—one by the old examiner’s granddaughter, one in a chart shop on the docks."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_choice]
title = "Only One Will Do"
text = "The new pilot major is revising the master chart, and for each stretch of coast he will take one chart only. On the docks they say he is the same man who praised that sounding chart eleven years ago, back when he lectured in cosmography. Both charts lie open on the long table of a dockside tavern. Each has been more than twenty years in the making, and each is truer than the one on the wall of the House of Trade. Isabel lays her palm on her latitude table. “Not a minute out.” A pause. “He praised yours. I know.” Leonor runs a fingernail down the line of soundings, figure by figure. “Not an inch out.” But neither chart can go in on its own: a woman’s chart has to be signed and handed in by someone who holds a license. At the same moment, both of them push their charts an inch toward me, and neither lets go."
news = "Seville’s new pilot major is revising the master chart and will take one chart for each stretch of coast. Two women who have spent twenty-odd years drawing charts both want theirs to be the one."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_choice.default]
news = "An old pilot on the Seville docks, one willing to vouch for a woman’s work, has handed in a river-mouth chart for two women chartmakers. They sat up all night piecing it together from two, so the story goes."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_choice.choices.submit_both]
text = "I’ll sign both and hand both in—let the pilot major see the pair before he chooses."
reply = "I signed the back of each chart and took them in together. The pilot major shut his door and spent the whole afternoon over them, then came out and said only this: latitudes from the Soto chart, soundings from the one off the docks. Outside the gate Isabel said, “I knew it.” Leonor said, “So did I.” They walked the whole length of the street with me between them, and only at the corner did one turn left and the other right."
news = "The pilot major at the House of Trade in Seville shut himself in for an afternoon with two river-mouth charts, then came out and said: latitudes from one, soundings from the other."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_choice.choices.submit_isabel]
text = "Only Isabel’s—her latitude table is the fuller one."
reply = "The House of Trade took it. Isabel watched until the clerk had rolled it up and laid it on the shelf, and only then turned around. Leonor said nothing at all. She rolled up her own chart and tied the cord around it twice. Back at the shop she locked it in a cupboard and hung the key on her sounding line."
news = "The House of Trade in Seville has taken the old examiner’s granddaughter’s river-mouth chart. The one from the dockside chart shop never went in—it’s locked in a cupboard now, they say."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_choice.choices.submit_leonor]
text = "Only Leonor’s—her soundings are new."
reply = "The House of Trade took it. Back at the tavern, right in front of me, Isabel started tearing into the corner of her own chart—and halfway along, her hand stopped. She pressed the torn flap flat and weighted it with the foot of her cup. “I’ll keep it. For next time.” The ink on her fingers had smudged along the tear."
news = "The House of Trade in Seville has taken the river-mouth chart from the dockside chart shop. When the old examiner’s granddaughter heard, she tore into a corner of her own, so they say."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_landing]
title = "One Chart, Two Names"
text = "The new master chart hangs in the great hall of the House of Trade. The pilots crowd in front of the river-mouth section, noses almost to the paper, before they make out two tiny signatures in the corner of the frame: one tucked under the latitude table, one beside the line of soundings, each smaller than a sesame seed. Isabel looks for a while, then puts a black fingertip on Leonor’s. “Your signature’s crooked.” “The boat rocked,” says Leonor. “You signed it on a table in the House of Trade.” “Then the table rocked.” Leonor slings her sounding line over her shoulder and heads for the door. “Measure it first. Then talk. Next time the bar shifts, I’ll be there first.” Isabel follows her as far as the doorway. “Get there first, then—I’ll still finish drawing first!”"
news = "On the new master chart in the House of Trade in Seville, the river-mouth corner bears two signatures no bigger than sesame seeds, both of them women’s. The pilots have to put their noses to the paper to see them."

