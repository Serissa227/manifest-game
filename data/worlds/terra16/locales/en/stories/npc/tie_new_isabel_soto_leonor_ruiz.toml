[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_landing_b]
title = "The One That Went In"
text = "The new master chart hangs in the House of Trade, and its river-mouth section is the sounding chart from the dockside shop. Isabel comes to look at it once. She stands in front of it so long that the clerk copying charts looks up at her twice, and only then puts an inky finger on the eastern end of the mouth. “Who drew this? It’s wrong—last winter this silted up again.” It reaches the docks the same day. Leonor doesn’t go to the House to argue. She rows down in her skiff, spends two days sounding, then walks into the House and says to the clerk, “Give me the pen.” She makes that spot half a fathom shallower. After that, when the two of them pass on the docks, both look away. A month later a slip of paper is pushed under Isabel’s door, with a single line on it: The one you sold the pilots—Cape St. Vincent is half a league too far north."
news = "The new master chart in the House of Trade in Seville had a line corrected within days of going up. The one who spotted the mistake, they say, was the other woman who draws charts."

