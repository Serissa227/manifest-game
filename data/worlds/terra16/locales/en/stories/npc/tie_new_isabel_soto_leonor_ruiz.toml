[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_meeting]
title = "The Same Stretch of Coast"
text = "In the courtyard of the House of Trade, a pilot sits on the rim of the well, waiting to buy a chart. The first to arrive is the old examiner’s granddaughter, Isabel, half her fingers black with ink; the second is Leonor from the chart shop on the docks, her roll tied with a length of wet cord. The two charts go down side by side on the well: the same stretch of coast, from Cape St. Vincent to the river mouth. Isabel spares Leonor’s a single glance. “Who drew this? It’s wrong. That headland sits half a league too far south.” Leonor doesn’t look up. She winds the cord back around, turn by turn. “Measure it first. Then talk.” The pilot buys neither. He won’t take a woman’s chart aboard—if the House of Trade found out, there would go his license. One girl with her chart under her arm, the other with hers on her shoulder, they stand face to face in the gateway, until the gatekeeper, keys in hand, gives up waiting, turns sideways, squeezes between them and swings one leaf of the gate shut. Next morning the boatmen on the docks are stopped by two girls, one after the other, with the same question: “Anything sailing for Cape St. Vincent?”"
news = "In the courtyard of the House of Trade in Seville, the old examiner’s granddaughter and the girl from the dockside chart shop tried to sell the same stretch of coast to the same pilot. He bought neither."

[tracks.tie_new_isabel_soto_leonor_ruiz.chapters.tie_new_isabel_soto_leonor_ruiz_closer]
title = "Where the Bar Really Lies"
text = "This spring the bar at the river mouth is wrong again: two cargo boats bound downriver have run aground on it, one after the other. Isabel slaps her grandfather’s old chart down on the table in the chart shop. “East. The latitude’s right there—work it out yourself.” Leonor just opens a sounding book gone wavy with river water. “West. I had the lead down in March.” They argue from midafternoon until the shop lamps are lit, and settle it like this: at first light they take Leonor’s skiff and ride the ebb down to measure. For two days at the mouth the lead goes over the side again and again. The east end is still shallow; to the west a new bank has silted up. The bar is creeping west, and each of them had it half right. On the way back up, nobody says a soft word. When the boat ties up at the Arenal, Isabel pulls a latitude table from inside her coat and pushes it into Leonor’s hands. Leonor pushes the sounding book back at her, the water stain on its cover still damp. That night, on each of the two charts, one spot is scraped clean with a penknife and drawn again."
news = "Down on the Seville docks they say the examiner’s granddaughter and Leonor from the chart shop argued half the night about the bar at the river mouth, rowed down at dawn to measure it, and came back without a word between them."

