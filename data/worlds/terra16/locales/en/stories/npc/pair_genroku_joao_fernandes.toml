text = "In 1588 Nagasaki passed to the Kanpaku’s direct rule, and the magistrate’s clerks went door to door to register households again. The table was set up at the entrance. “Head of household?” “Genroku of the Nanban-ya.” “Who lives with him?” “João Fernandes, Portuguese pilot.” The clerk frowned: no place to write a barbarian name. Genroku took the brush, wrote it in katakana, then copied it beside in Portuguese letters. The letter box had come back to the house last autumn from that ship; in the slot of its lid a single grain of rice from the hold was still stuck. He pushed the register toward João. “Sign. Goods may come late. Don’t miss the day you promised.” João counted on his fingers, pen in hand. “You said it in Macao, and at Yokoseura… twenty-eight years I took you to be hurrying up a shipment.” “For a shipment,” said Genroku, “I wouldn’t have said it for twenty-eight years.” Outside, the man nailing up the board asked, “New address. Change the names?” They answered together: “No.”"
