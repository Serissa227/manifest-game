# 黑船回来的日子（pair_genroku_joao_fernandes）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_genroku_joao_fernandes]
name = "The Days the Black Ship Came Back"

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_meeting]
title = "A Letter in the Wrong Pile"
text = "The silk cargo lists came in, and at the bottom of the pile lay a letter in Portuguese. The buyer from Sakai took it for one more list and read it out: “…a buyer from Sakai, an abacus under his arm, standing in the rain counting crates, and when he reached the third count he started over on the beads…” Halfway through, his ears went red. João was fetched from down the quay. He hailed Genroku first, in the Hokkien of the Fujian boatmen, “Have you eaten yet?”, and only then saw what was in his hand, and slapped a palm flat on the page. “On this voyage the letters come off the ship before the cargo! That is not cargo.” Genroku held it high. “If I read it, I owe you an answer, and a proper one. A few days late is fine, but name the day and keep it.” They spent the afternoon crouched by a mooring post, João writing “chuva,” Genroku drawing the character for rain beside it, one word in two scripts on a single sheet, neither willing to rub his out. Before dark Genroku sent a boy for a little wooden box and cut a slot in the lid. “No freight. Letters only.”"
news = "On the quay at Macao a merchant from Sakai read a private Portuguese letter aloud as if it were a cargo list, went red halfway through, and the pilot’s son who wrote it chased him for it."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_closer]
title = "The Wordbook at Yokoseura"
text = "The black ship tied up at the new pier at Yokoseura, the planks still oozing resin. João did not count cargo first. He pulled a thick book from his coat, its cover wrapped in waxed cloth. “Words for trade,” he said. “Pledge, pawn, credit, return.” Genroku turned two pages and tapped the table with his brush. “Write only these and you’ll spend your life haggling.” He added his own: mend the roof, burn the rice, forget the umbrella. The shop foreman put his head in the door. “Which of those sells for money?” They laughed until the book slid off the table. João pointed at the oil-paper umbrella by the door. “Casa.” “Umbrella. Kasa.” “Casa! Where I come from, casa is a house.” “Umbrella.” By the fourth round Genroku had stopped correcting him. Beside the character for umbrella he wrote casa in Portuguese letters and drew a line between them. “When it’s raining,” he said, “they’re the same word.”"
news = "A black ship has come into Yokoseura, and they say a Portuguese pilot and a merchant from Sakai are making a wordbook on the pier, down to “burned the rice.”"

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_together]
title = "The New Pier"
text = "In 1571 the first Portuguese ship sailed into the newly opened harbor at Nagasaki. João stood on the unfinished pier for an hour with his face in the wind. “Southwest. She’ll clear the harbor tomorrow.” Someone from the fleet shouted for him from the far end of the quay, and he did not answer. Genroku crouched by the little box and turned over the paper tag tied to it, crossed out “Macao,” and wrote “Nagasaki,” slowly. Three wordbooks were stacked at his feet; the bottom one had a corner scorched the year of Yokoseura. That night they sat in the half-built warehouse, the cedar beams still smelling of resin, rain ticking on the open roof. “This time,” João said, “I’m not leaving.” Genroku didn’t answer. He moved the lamp farther away, put a hand behind João’s neck and kissed him."
news = "The first black ship has come into the new harbor at Nagasaki, and they say a pilot’s son stepped off her and never went back aboard; he’s living in a Sakai merchant’s warehouse."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_together.default]
effects = [{}, {}, { title = "The New Pier" }]

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_turning]
title = "Given Away"
text = "There is only one subject in the taverns of Nagasaki this summer. Lord Ōmura has given Nagasaki and Mogi to the Jesuits, and nobody can say which street answers to whom or which shop pays what to whom. Yesterday two apprentices in the back street argued over a paving stone for half the length of it. “A gift is a gift,” said the fishmonger, “the harbor’s land may belong to the priests, but my fish are still my fish.” On the house by the sea where two men live together, the name board at the door was repainted this morning, the street written a new way. Passersby say the merchant from Sakai stood before it a long time, running a finger over the fresh lacquer, while the other man laughed at him. “It’s dry. It won’t come off.”"
news = "Lord Ōmura has given Nagasaki to the missionaries, the rules change by the day, and even the name boards at the doors have to be written again."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_choice]
title = "Twenty Days"
text = "The day the expulsion edict went up in Nagasaki, I was at João’s house waiting for a cargo list. The notice was plain: the priests had twenty days to leave Japan, and merchants were not included. But the magistrate’s office had another list, of people who lodged with the priests, and João’s name was on it. For years he had piloted the Church’s ships. “Anyone on the list has to prove himself,” said the runner, and left. Genroku stacked a dozen years of cargo books on the table, higher than the wordbooks. João knelt in the corner packing a chest. The compass went in: “Borrowed from a captain.” The star tables the mission gave him went in: “To be returned.” “I kept the books,” Genroku said, “but whether the man at the desk accepts them isn’t mine to say.” João stood, turning the letter box in his hands, and did not put it in the chest."
news = "The expulsion edict has reached Nagasaki, and the priests are packing for the ships; they say a pilot’s son is on the list and is going around with cargo books to prove he’s a merchant."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_choice.choices.papers]
text = "Go to the Portuguese captain-major and get João a merchant’s pass."
reply = "The captain-major turned the cargo books for an hour and stopped at the page for 1571. “That year’s ship into Nagasaki was one of the fleet’s merchantmen, and he piloted her. The Church borrowed her once, and the account is in the fleet’s name.” The clerk dipped the seal in ink. João took the pass and looked for a pen first, to strike his own line off the list, and only then looked up at me. “Is there room on the pier? I’d like to watch how the ships go out.”"
effects = [{}, {}, {}, { title = "A Merchant’s Pass" }]
news = "A captain-major at Nagasaki has issued a merchant’s pass to a pilot’s son, who took it and went first to strike his name off the list, then down to the pier to watch the ships."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_choice.choices.hide_chest]
text = "Carry the wordbooks and the letter box to my ship and keep them safe."
reply = "After dark I wrapped the box and the three wordbooks in oilcloth, carried them aboard my own ship and wedged them among the rice sacks in the hold. João watched the hatch close. “Whether I can stay isn’t settled yet. These have to stay no matter what.” Genroku put a thumb on the slot in the lid, where the wood had long since been worn smooth by letters."
effects = [{}, {}, {}, { title = "The Box That Charges No Freight" }]

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_choice.choices.watch]
text = "Stay out of it and go to the pier to watch the priests board."
reply = "The pier was packed, ship after ship taking on the priests’ chests. João stood among the people seeing them off and did not set one foot on the gangway. Genroku stood close by with the cargo list in his fist, the paper fraying, counting coils of cable under his breath. At the ninth coil the ship let go her line."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_epilogue]
title = "New Address, Same Names"
text = "In 1588 Nagasaki passed to the Kanpaku’s direct rule, and the magistrate’s clerks went door to door to register households again. The table was set up at the entrance. “Head of household?” “Genroku of the Nanban-ya.” “Who lives with him?” “João Fernandes, Portuguese pilot.” The clerk frowned: no place to write a barbarian name. Genroku took the brush, wrote it in katakana, then copied it beside in Portuguese letters. He pushed the register toward João. “Sign. Goods may come late. Don’t miss the day you promised.” João counted on his fingers, pen in hand. “You said it in Macao, and at Yokoseura… twenty-eight years I took you to be hurrying up a shipment.” “For a shipment,” said Genroku, “I wouldn’t have said it for twenty-eight years.” Outside, the man nailing up the board asked, hammer raised, “New address. Change the names?” They answered together: “No.”"
news = "Nagasaki is registering its households again, and the house by the sea has a new address; the board by the door still has a Japanese name and a Portuguese one, as it has for well over a decade."

[tracks.pair_genroku_joao_fernandes.chapters.pair_genroku_joao_fernandes_epilogue.variants.helped]
text = "In 1588 Nagasaki passed to the Kanpaku’s direct rule, and the magistrate’s clerks went door to door to register households again. The table was set up at the entrance. “Head of household?” “Genroku of the Nanban-ya.” “Who lives with him?” “João Fernandes, Portuguese pilot.” The clerk frowned: no place to write a barbarian name. João pointed behind the door. The merchant’s pass was nailed to the wall, and beside it the paper tag with “Macao” crossed out in 1571. The clerk looked once and asked nothing more. Genroku pushed the register toward João. “Sign. Goods may come late. Don’t miss the day you promised.” João counted on his fingers, pen in hand. “You said it in Macao, and at Yokoseura… twenty-eight years I took you to be hurrying up a shipment.” “For a shipment,” said Genroku, “I wouldn’t have said it for twenty-eight years.” Outside, the man nailing up the board asked, “New address. Change the names?” They answered together: “No.”"

