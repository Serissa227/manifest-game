# 回忆标题按选项 effects 的下标对应（choice 的 buy_batch、smooth_books 的第 4 个效果是 memory）。

[tracks.pair_qin_hongying_shen_zhiwei]
name = "Shards and a Sword Cut"

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_meeting]
title = "Triple the Fee"
text = "A blue cloth-bound ledger lay open on the escort agency’s counter in Yuegang: twenty crates of official-pattern blue-and-white, to be guarded as far as the river mouth and loaded aboard. Qin Hongying didn’t even glance at it. She held up three fingers. “Triple?” Shen Zhiwei smiled. “You do put a high price on yourself, Escort Qin.” “You put a low one on them.” Qin jerked her chin at the door. Six of her men squatted by the crates outside, eating flatbread, and she went down the row. “Ah-Wang, from Shima, his mother’s eyes are going. Old Cai, from Haicang, had a baby girl last month. The skinny one is Shuisheng, from Wuyu. Best swimmer we’ve got, useless on a road…” When she’d named all six, she folded the three fingers away. “Cargo can be repaid. People have to come home.” Shen stopped smiling. She dipped her brush and wrote the six names into the ledger one by one, and under each name she started a new line: road money. At Old Cai’s line the brush paused, and she added two small words: new baby."
news = "The woman who runs the Yuegang escort agency took on a job from Jingdezhen and asked triple the going rate. Her men say it’s the first time a client ever wrote their names in the books."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_closer]
title = "Not Cargo Damage"
text = "On last winter’s run down from Jingdezhen the carts were “robbed” three times. Each time two or three crates of porcelain went missing, nobody got hurt, and the robbers never once drew their blades. Qin Hongying saw it and said nothing. After every robbery she just climbed up on the cart shaft and bellowed out the crate count from the top. The fourth time, the blades came out. She took one meant for Shen Zhiwei and got a gash down her left arm. In spring Shen came to the agency with her ledger to see how the wound was healing, her brush held above the page. “This run, I’ll enter as cargo damage.” Qin rolled up her sleeve. “That entry doesn’t go under cargo damage.” Shen crouched to change the dressing. Her hands shook the whole time, and she wound the bandage crooked twice. “Crates can always be recounted. Just don’t get hurt again.” When it was tied off, she told it all: the first three robberies were men she had hired, on mountain passes she had picked. Then she stared into the medicine bowl. Qin asked only one thing. “Those three times. Did you write down the men’s pay?”"
news = "The escort woman in Yuegang took a blade across her left arm, and the whole time she was laid up, the kiln official’s daughter from Jingdezhen came by the agency every day. To go over the accounts, she said."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_turning]
title = "Old Books, Open Sea"
text = "In the first year of Longqing, Yuegang opened to the sea. Porcelain that used to be hauled onto skiffs in the dead of night now went aboard in broad daylight on a ship’s license, porters chanting, a clerk at the gangplank reading the license aloud. Talk in the tea sheds, though, turned back to old business. The kiln official’s daughter from Jingdezhen was in town again, staying at the inn across from the escort agency and going in and out all day with her ledgers. Come to settle her books, people said. Porcelain could be sold out in the open now, but those years of “losses to robbery” were still sitting in the imperial kiln works’ accounts. A few days back a man with a Jingdezhen accent turned up at the agency door asking how many times, exactly, those runs down from Jingdezhen had been robbed. The men said they couldn’t remember. The old woman who sells fish balls says Escort Qin heard it from inside, didn’t say a word, and got up and shut the door."
news = "Yuegang’s open to the sea now, and porcelain that used to load at midnight goes aboard at noon. But someone from Jingdezhen keeps asking how many times those escort runs a few years back really got robbed."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_choice]
title = "The True Accounts"
text = "Shen Zhiwei had to go back to Jingdezhen and answer for her books. She came to find me at the inn and spread a stack of receipts on the table: the pay the men never got for those three runs, settled to the last copper, each receipt stamped with a red thumbprint. Beside Old Cai’s thumbprint someone had drawn a lopsided little baby. What remained was the hole in the kiln works’ accounts: three hundred taels of silver and forty crates of porcelain. “I still have forty crates of official-pattern blue-and-white that never went overseas.” She said it politely, more politely than she needed to. “They’d sell. Only every buyer wants to know where they came from.” Qin Hongying leaned in the doorway with her arms folded, a strip of scar showing at her left cuff. “If you mean to patch up a lie, leave my agency out of it.” Shen didn’t turn around. She squared the receipts one by one, weighted them under a teacup, and waited for me to speak."
news = "The kiln official’s daughter from Jingdezhen is in Yuegang settling her books. They say the hole is three hundred taels and forty crates, and the escort woman hasn’t put in one word for her."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_choice.default]
news = "The kiln official’s daughter emptied out her own savings to fill half the hole in Yuegang. The other half, she says, she’ll go back to Jingdezhen and answer for herself."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_choice.choices.buy_batch]
text = "Buy all forty crates so she can fill the hole with the porcelain money."
reply = "I took all forty crates in one go, at the market price, not a copper knocked off. Shen Zhiwei counted the silver twice and stopped halfway through the second count. “This is too much.” I said it wasn’t. She didn’t argue. She took the silver to the county office and squared her books. On the way back she didn’t head for the docks. She turned into the empty shop next to the escort agency, rapped on the wall with her knuckles and asked the landlord what it went for by the month. Qin Hongying’s voice came through the wall. “It’s thin, quit knocking. Every ear in the agency is on this side.”"
news = "Somebody in Yuegang bought up all forty crates of official-pattern porcelain the kiln official’s daughter had on her hands, and the silver was in the county counting house that same day."
effects = [{ }, { }, { }, { title = "Forty Crates of Official Ware" }]

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_choice.choices.smooth_books]
text = "Pay a clerk in the license office to change years of “robbery” to “storm.”"
reply = "The clerk took the silver and spent three nights scraping with a little blade, until every “lost to robbery” over those years read “lost to storm” and the books fit together without a seam. Qin Hongying went through them from first page to last, her face dark. “You’ve changed the paper. The cut was real.” Shen Zhiwei kept her head down and said, “Yes.” Qin closed the ledger and didn’t give it back. She turned, locked it in her own strongbox and hung the key back on her belt."
news = "One of the license clerks in Yuegang has been burning his lamp till the third watch every night. The escort woman went to see him once and came out with a face like the bottom of a pot."
effects = [{ }, { }, { }, { title = "The Altered Ledger" }]

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_choice.choices.report]
text = "Tell the Haicheng county office what really happened on those runs."
reply = "Men from the county sealed the escort agency for three days, and its men sat on the front steps eating flatbread. People sent by the kiln official took Shen Zhiwei back to Jingdezhen. The escort that took her home was one Qin Hongying signed on for herself, at a tenth of her usual fee. On the day they set out she walked past me and stopped for a moment. “Somebody else escorting her? I wouldn’t trust it.” The curtain on the cart stayed open the whole way."
news = "Haicheng county shut the Yuegang escort agency for three days. The kiln official’s daughter was taken home to Jingdezhen by her family, and the escort woman rode guard on the cart."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_together]
title = "Once a Year to Jingdezhen"
text = "Shen Zhiwei was leaving for Jingdezhen in the morning. It rained that night, and the water ran off the eaves of the agency’s back courtyard in a single thread. The old scar on Qin Hongying’s left arm itched whenever it rained, and she had been scratching at it all evening until Shen couldn’t stand to watch. She took the arm and rubbed it with her palm, round and round. “Easy,” Qin said through her teeth. “That hurts worse than the blade did.” “Then stop scratching. Scratch it open and I’m the one who has to write it down.” Qin went quiet. It was a while before she spoke. “When you go back, I’ll run an escort to Jingdezhen once a year. I won’t charge you triple.” “Charge it.” Shen looked up. “The men get every copper they’re owed.” Qin laughed out loud, bent her head and kissed her. The lamp under the eaves swung in the wind. Next morning the docks were crowded, and Shen stood at the foot of the gangplank and counted every crate from the top, in front of the whole ship, before she went aboard."
news = "Every spring the escort woman in Yuegang runs a job to Jingdezhen. Her men say it never turns a profit, but she won’t let anybody else take it."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_together.variants.covered]
text = "Shen Zhiwei was leaving for Jingdezhen in the morning. It rained that night. Qin Hongying opened her strongbox, took out the altered ledger and pushed it down to the bottom of Shen’s bundle. “Burn it when you get home. Don’t keep it around like a charm.” Shen held the bundle shut. “If I burn it, nobody will remember those entries.” “I will.” Qin pushed up her left sleeve. The scar itched whenever it rained, and she scratched at it as she talked. “It’s all written down right here.” Shen took the arm and rubbed it with her palm, round and round. Qin let her for a long time before she spoke. “When you go back, I’ll run an escort to Jingdezhen once a year. I won’t charge you triple.” “Charge it. The men get every copper they’re owed.” Qin laughed out loud, bent her head and kissed her. Next morning Shen stood at the foot of the gangplank and counted every crate from the top, in front of the whole ship, before she went aboard."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_landing_b]
title = "The China Shop Next Door"
text = "The empty shop next to the escort agency hung out a sign in spring. It sold blue-and-white from the common kilns, and little things pieced together from broken porcelain: hairpins, buttons, paperweights for holding down ledgers. The first thing on the counter was an official-pattern bowl that had smashed into seven or eight pieces during the real robbery. Now it was held fast with fourteen metal staples, a slip of red paper under it: not for sale. A merchant insisted on buying it and went as high as two taels. Shen Zhiwei smiled and shook her head. “Somebody already paid for this bowl.” At dusk Qin Hongying came back from a job and, instead of going in her own door, turned into the shop next door and counted the crates behind the counter one by one. “One short.” “Sold.” Shen looked up from her ledger. “Go count the agency’s first.” “The agency’s aren’t going anywhere.” Qin sat down at the end of the counter, waited for her to close the ledger, leaned over and kissed her. Then she counted the staples on the bowl again."
news = "A china shop just opened next door to the escort agency in Yuegang. The owner is a woman from Jingdezhen, and on the counter there’s a mended bowl marked not for sale."

[tracks.pair_qin_hongying_shen_zhiwei.chapters.pair_qin_hongying_shen_zhiwei_apart]
title = "The Escort Home"
text = "Everyone in Jingdezhen says the kiln official was impeached, and the imperial kiln works’ accounts were gone through all winter. His daughter is shut up in the back courtyard and not allowed out for a year, not even to the kilns. People also say that escort woman from Yuegang brings a job into Jingdezhen every month, nothing but a few loads of tea and a few bolts of cloth, and that run always loses money. She doesn’t stay at an inn. She goes around to the back gate of the kiln official’s house, stands outside it a while, hands the gatekeeper a small parcel and leaves. The old gatekeeper got drunk once and told people at the kiln mouth what’s in it: a handful of Yuegang tea, and under the tea a folded slip of paper with nothing on it but a number. “The first time it said one. Last month it got to five.” He smacked his lips. “A few days later the young mistress sends one out too. Just a number, the same one that went in. The two of them counting days through a gate, like they were counting crates.”"
news = "The kiln official in Jingdezhen has been impeached and his daughter kept indoors. Every month the escort woman from Yuegang brings a job here, and it always loses money."
