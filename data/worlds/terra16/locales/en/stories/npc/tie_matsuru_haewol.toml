# C7 重写（2026-10-11，Claude Opus）：tie_matsuru_haewol 的英文显示覆盖，按轨道、章节、选项、变体的 key 对应；不含玩法字段。

[tracks.tie_matsuru_haewol]
name = "The Kerchief Goes North"

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_meeting]
title = "A Knot She Didn’t Know"
text = "A Jeju fishing boat drifted into Naha harbor with half its mast gone, and no one on the quay could make out a word its seven or eight crew said; the interpreter the court sent had a handful of Korean phrases and needed three gestures per question. Only one of them, a diver, wasn’t shy. The moment her feet touched land she was asking for rope, and she squatted on the shingle mending a net, her knots quick and hard. Matsuru watched a long while, then untied her own kerchief and tried to copy one. The diver glanced over, shook her head, plunged the knot into a bucket and tried to work it loose. It wouldn’t budge. “Tie it like that and once it’s wet, it won’t come undone.” Matsuru changed her grip and tied another around her own wrist, then pointed to the sea, and to the shore under her feet. “Can this knot leave someone a way back?” The interpreter stumbled through it. The diver stared, then burst out laughing and snatched up the end of the rope. “It can. But anything that goes in the water gets tied my way.”"
news = "A Jeju fishing boat drifted into Naha harbor. There was a diver aboard who wanted rope the moment she stepped ashore, and the priestess from the sacred grove squatted beside her all afternoon, learning her knots."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_closer]
title = "What the Tide Is Called"
text = "The tide was out on the reef beyond Naha. On the flat the water came only to the waist; a step past the edge, it went deep. Before going in, Haewol pointed at the weed by her feet. “Watch, dry-lander. Leaning in, the tide’s coming. Leaning out, it’s going, and when it goes fast, you come up.” Matsuru asked what this tide was called in Jeju. Haewol thought about it. “‘Time to come up.’” Matsuru sat on the rocks and kept count for her. At a hundred the water was still flat. At a hundred and twenty she was on her feet and about to shout when Haewol broke the surface thirty feet out with a long whistle, a sea urchin in her fist, its spines still moving. That night Matsuru folded a kerchief the way a sister folds one for a brother, into a strip narrow enough to tuck into a sash. “Come home safe. No need to bring anything costly.” Haewol turned it over and over. “This is for a brother. I’m not your brother.” “Then say it’s from an elder sister.”"
news = "Out on the reef past Naha, the Jeju diver went under while the priestess counted on the rocks. She reached a hundred and twenty before the woman came up, a sea urchin in her hand."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_closer.default]
effects = [{ }, { title = "What the Tide Is Called" }]

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_turning]
title = "The Ship North"
text = "Word on the docks was that the court’s envoy ship would sail north on the south wind and carry home the Jeju castaways who had drifted in the year before. On boarding day the diver came last, a white kerchief at her waist, tied in a small, hard knot of her own. A porter teased her that it was what a priestess ties on men going to sea. She slapped the knot. “Who it’s for is my call.” The priestess never came to see them off. The old woman who minds the shrine gate says she sat inside all day and came out once, to ask which way the wind was blowing. Told it was from the south, she nodded. “Then it’s an easy passage.” And she went back in."
news = "Naha’s envoy ship went north on the south wind and took the Jeju castaways home. The whole dock says the diver wore the priestess’s kerchief at her waist, and the priestess never came down to see her go."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_choice]
title = "Whose Safe Return"
text = "A letter found its way to Naha aboard a Chinese junk. An old clerk in Jeju had written it out for her, but Matsuru, reading it to me, was laughing by the second line: that voice was in every word. “Dry-lander, I wear your kerchief even in the water. When we go down here, the ones seeing us off are all women. Old ones, little ones, ones who can’t dive anymore, and nothing in their hands. Give each of them one of your kerchiefs too.” Matsuru cut a bolt of white cloth and folded twenty by lamplight. Halfway through the last, her hands stopped, one corner still sticking up. “All these years, they’ve been for people going to sea.” She looked at it. “For myself, I can’t remember how the folds go.” She laid it on top of the bundle and looked up at me. “Could you carry this north for me?”"
news = "The Naha priestess cut a whole bolt of white cloth and folded twenty kerchiefs in a night. They’re for the women in Jeju who see the divers into the water, one apiece."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_choice.default]
news = "The bundle of kerchiefs the Naha priestess folded missed this year’s ship north. It sits on a shelf in the shrine; she says it will wait for next year’s envoy ship."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_choice.choices.deliver_north]
text = "Take the bundle to Busan and find a Jeju boat for it."
reply = "Matsuru finished the last one and tucked it in. “Twenty, then. Not one short.” The bundle went to Busan on my ship and left the next day on a fishing boat out of Jeju. Before it cast off, I watched one of the women aboard open it, pull out a kerchief and wind it around her waist with a twist and a tug: the knot that still comes undone when it’s wet. She jerked her chin toward the south, and the whole boat laughed."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_choice.choices.keep_one]
text = "Tell her to keep the half-folded one for herself."
reply = "Matsuru looked at it a long time, finished folding it, and didn’t put it back. She wound it twice around her left wrist. The knot came out clumsy; she got it wrong once and started over. It was the one Haewol had taught her. She shook her wrist. Still loose. She left it. “Next time she comes, I’ll have her tie it again.” The other nineteen went north on the next ship."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_landing]
title = "One for Each Shore"
text = "The answer came back from the north in the same old clerk’s hand and the same loud voice. “Twenty, one for every woman seeing us off. From now on the ones going in wear one and the ones on shore wear one. Both sides have theirs.” Folded inside was a drawing: a row of women on the shore, each with the same white at her waist. In one corner, in a crooked hand nothing like the clerk’s, was another line: “Weed leaning out, don’t go in.” Matsuru traced the characters with a fingertip. “She’s learning to write.” She pasted the drawing to a pillar in the shrine. Early next morning, at low tide, she went down to the edge of the reef, crouched, and checked by that line which way the weed was leaning."
news = "There’s a drawing from Jeju pasted to a pillar in a Naha shrine: a row of women on the shore, white kerchiefs at their waists. Next morning someone saw the priestess crouched at the edge of the reef, reading the tide."

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_landing.default]
effects = [{ }, { }, { title = "One for Each Shore" }]

[tracks.tie_matsuru_haewol.chapters.tie_matsuru_haewol_landing.variants.kept]
text = "The answer came back from the north in the same old clerk’s hand and the same loud voice. “Nineteen, one for every woman seeing us off. From now on the ones going in wear one and the ones on shore wear one. That one on your wrist, I’ll retie it next time I come.” Folded inside was a drawing: a row of women on the shore, each with the same white at her waist. In one corner, in a crooked hand nothing like the clerk’s, was another line: “Weed leaning out, don’t go in.” Matsuru looked down at the slack knot on her wrist. “Then it stays loose a while longer.” She pasted the drawing to a pillar in the shrine. Early next morning, at low tide, she went down to the edge of the reef, crouched, and checked by that line which way the weed was leaning."
