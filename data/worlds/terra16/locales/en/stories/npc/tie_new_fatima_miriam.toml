# C7 配角线 tie_new_fatima_miriam 的英文显示覆盖（嵌套表写法，按轨道、章节、选项 key 对应）；只覆盖文字，不复制玩法。

[tracks.tie_new_fatima_miriam]
name = "The Stool by the Door"

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_meeting]
title = "Lingering a Little Longer"
text = "The coffeehouse in Tahtakale keeps a low stool by its door for porters to rest on. Every Thursday around noon Miriam, the palace kira, came by with an armful of sealed parcels, and every time she reached the stool she paused, a little longer each week, and never once sat down. The regulars at the door liked to tease her: “Which lady’s is it today?” She would smile and answer in Spanish, and not one of them understood a word. Fatima had watched from behind the brazier for a good many Thursdays and never asked her a thing. That day, when she stopped by the stool again, Fatima brought a cup out and nudged the stool forward with her toe. “I’ll mind the fire; you put your letters away.” Miriam didn’t sit. She shifted the parcels from her right arm to her left, seals turned in toward herself, drank the cup standing in small sips, and handed it back. “A letter can do its work without being opened. So can your coffee.” “Did I ask you anything?” “That’s just it. You didn’t.” The next Thursday a cup was already waiting on the stool, a saucer over the top."
news = "At that coffeehouse in Tahtakale, Istanbul, there’s an extra cup on the stool by the door every Thursday. The kira who runs the palace errands drinks it standing up and walks on."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_closer]
title = "Not Past This Door"
text = "A clerk from the palace counting-house sat by the brazier, and by his second cup his voice had grown loud. “That kira opened a lady’s letter—” Fatima came over with the pot to top him up. She held the spout very low and let the coffee run in a thin thread, so that the cup took an age to fill. When it was full at last, she said, “Gözüm, those camels of yours back home in Konya—any calves this year?” Once the clerk got onto camels he talked for the length of a meal, and the letter never came up again. When Miriam came on Thursday, Fatima repeated his half-sentence to her word for word. Miriam’s cup stopped at her lips. “Which lady?” Fatima told her. “That one was green wax with a pomegranate seal. When I put it in her maid’s hand, not one leaf of the pomegranate was missing. It’s a lie.” “I know.” Fatima set the pot back on the brazier. “That’s why it never got past this door.” Miriam looked at the parcels in her arms, then bent and set them down on the stool by the door. She stayed on her feet, but for the first time she drank her coffee with both hands around the cup."
news = "A clerk from the palace counting-house got going about the kira by the brazier of that coffeehouse in Tahtakale, Istanbul. The mistress topped up his cup very slowly, asked after his camels, and the talk wandered off elsewhere."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_closer.default]
effects = [{  }, { title = "Not Past This Door" }]

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_turning]
title = "A Higher Threshold"
text = "Early in the winter the old sultan died, the new one hurried back from Manisa to take the throne, and his mother became Valide Sultan. The porters of Tahtakale say the palace thresholds rose three inches overnight. The kira who used to run errands for the ladies now does the Valide’s business, and going in or out she has three gates to pass, with someone at every one of them going through her parcels and noting the hour. A simit seller outside the palace gate heard her tell one of the searchers, “Leave the wax alone. Break it, and you can explain it to the Valide.” Some say she’s made her fortune, that one bolt of cloth from the Valide would buy half a street. Others glimpsed her once across the fish market, thinner, walking fast, not turning around for anyone who called her name. On the stool outside the coffeehouse a cup still sat every Thursday under its saucer, and for weeks on end nobody came to drink it. The regulars watched the mistress of the house wait until past noon, lift the saucer, drink the cold coffee in the doorway, and turn the cup over on the stool. When someone asked who she was waiting for, she asked him back, “Must I account to you for every cup I pour?”"
news = "A new sultan in Istanbul, and the Valide’s threshold three inches higher. Outside that coffeehouse in Tahtakale, the Thursday cup has gone undrunk for weeks."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_choice]
title = "Talk in the Coffeehouses"
text = "The story came over from another coffeehouse: the kira who runs the Valide’s errands sells the Valide’s favor, and anyone after a post had better slip gold into her parcels first. This time there was no keeping it down. All three coffeehouses on that street in Tahtakale were telling it, and by now someone could tell you whether the gold was Venetian or Hungarian. On Thursday Miriam came, her face as white as the sealed letters in her arms. She stood in the doorway and got out half a sentence. “A letter can do its work without…” The rest would not come. Fatima put down the pot, went to her, took her by both shoulders and pressed her down onto the stool by the door. In fifteen years it was the first time Miriam had sat on that stool, and she kept to the very edge, her back straight as a rod. Fatima turned to me. “I’ll mind the fire. You go and find out which door this came out of.”"
news = "Talk against the kira has been going around Istanbul’s coffeehouses. One woman in Tahtakale showed the man spreading it out of her door for good, but the story still ran all summer."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_choice.choices.trace_rumor]
text = "Follow the story back, shop by shop, to whoever started it."
reply = "I worked from the coffeehouse at the top of the street to the one at the bottom, then all the way to a tavern in Galata, and every trail led to the same man: a clerk just thrown out of the palace counting-house. The kira had caught three padded prices in the Valide’s purchase accounts he kept. Someone at the tavern remembered him pounding the table: “She picks at my accounts, I’ll pick at her name.” I carried the line back to Tahtakale unchanged and read it out by the brazier. At first the room was silent; then somebody snorted. Fatima asked, “The one with the camels in Konya?” By the next day all three coffeehouses were talking about something else. Miriam got up from the stool, took the pot from Fatima, and filled my cup."
news = "That story about the kira selling the Valide’s favor has been traced to a clerk thrown out of the palace counting-house. Somebody in Tahtakale read his own words out loud, and Istanbul dropped it the next day."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_choice.choices.stand_by_fatima]
text = "Stay and carry saucers for Fatima, and watch how she handles the room."
reply = "Fatima went from table to table with the pot, neither fast nor slow, asking after somebody’s family at each one, while I followed with the saucers. At the table by the window a man was just saying “the Valide’s favor” when she set the pot down and pushed his cup an inch away from him. “This table gets no coffee from me today.” The three of them sat there dumbstruck, then threw down a few coppers and left, and they never came back. Fatima went back to the brazier to see to her fire. I put down the money for my afternoon’s coffee on the counter; she pushed it back to me."
news = "The woman who keeps that coffeehouse in Tahtakale went around topping up cups until she reached the table gossiping about the kira, then set the pot down: no coffee for this table today. Istanbul says those three never went back."

[tracks.tie_new_fatima_miriam.chapters.tie_new_fatima_miriam_landing]
title = "Sitting Down at Last"
text = "On Thursday around noon Miriam stopped at the door as she always did. She had been walking past that stool for sixteen years, and last year someone had pressed her down onto the edge of it. Today she looked at it for a moment, set her parcels at her feet, and sat down, her skirts spreading over the seat. Fatima brought a cup, pulled up a smaller stool to sit facing her, and every so often glanced at the parcels the way she glanced at the fire. They talked about other things. The leatherworker’s eldest daughter was going to Bursa as a bride, and Miriam had picked out the lock for her dowry chest. A young Janissary had left a roll of poems in the shop, and Fatima couldn’t decide which to burn and which to keep, so she read them out one by one. “Burn that one. It rhymes like a roll call.” “And this one?” “Keep it. It’s about your brazier.” Two cups’ worth of time went by before Miriam stood and gathered the parcels back into her arms. “I’ll sit again next week.” Fatima turned Miriam’s cup over on the stool. “I’ll save you the stool.”"
news = "The stool outside that coffeehouse in Tahtakale, Istanbul, is kept for one person on Thursdays. The kira who runs the Valide’s errands sits down for two cups these days."

