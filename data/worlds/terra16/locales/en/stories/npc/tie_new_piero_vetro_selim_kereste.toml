[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_landing.variants.helped]
text = "The plague had ended. In July Venice kept its first Feast of the Redeemer, and boats were lashed side by side across the Giudecca Canal to make a bridge that swayed all the way to a temporary wooden chapel on the far bank. A good share of the planks was oak from the hills above İzmit that Selim had shipped, unpainted, the grain showing. Piero stepped over them one by one. “This one’s yours?” “This one too.” A corner of yellowed paper stuck out of his apron pocket, and Selim saw it. “You kept it?” “Blurred as it is, I can still say it by heart,” said Piero. “‘Going with the grain, not forcing it. I’ll get through.’ Well, you’re through. I’m done talking to you across water.” In the middle of the bridge, in front of everyone who had come to see the lights, he took Selim’s hand and didn’t let go, and leaned in and kissed him. After that, every year at the feast, Selim’s timber boat tied up before the bridge went up."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_landing.variants.rowed]
text = "The plague had ended. In July Venice kept its first Feast of the Redeemer, and boats were lashed side by side across the Giudecca Canal to make a bridge that swayed all the way to a temporary wooden chapel on the far bank. A good share of the planks was oak from the hills above İzmit that Selim had shipped, unpainted, the grain showing. Piero stepped over them one by one. “This one’s yours?” “This one too.” In the middle of the bridge his foot stopped. Someone had cut the shape of a small shard of glass into this plank with a knife, the cut still pale. Piero crouched and traced it with a finger, once, twice, then stood up and took Selim’s hand in front of everyone who had come to see the lights. “People are looking,” Selim said, lowering his voice. “Let them,” said Piero. “This plank has me on it.” He didn’t let go. He leaned in and kissed him. After that, every year at the feast, Selim’s timber boat tied up before the bridge went up."

