[tracks.tie_new_piero_vetro_selim_kereste_side.chapters.side]
title = "Furnace Wood and Timber"
text = "At the first Feast of the Redeemer the bridge of boats swayed all the way across the canal to the Giudecca. A good share of its planks was İzmit oak that Selim had shipped. He walked with his head down, counting grain, while Piero walked with his head back, counting lamps. “How many on your side?” “Eleven lines.” “Forty-six lamps on mine, and the brightest one I blew myself.” They stood a while in the middle of the bridge, watching the lights on the water blur together. Piero said that from now on his furnace wood would be only what Selim picked. Selim thought about it and said slowly that from now on the timber he shipped would go to Murano first. Then he added, “Nothing wet gets sent.” Piero laughed so hard the whole bridge rocked with him."
news = "Venice kept its first Feast of the Redeemer. Some planks in the bridge of boats came from Istanbul, and Murano’s furnace wood was picked by the same man."

