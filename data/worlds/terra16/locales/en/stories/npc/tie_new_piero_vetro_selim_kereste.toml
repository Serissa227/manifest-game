[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_turning]
title = "The Inn With the Sealed Door"
text = "The plague came to the city this summer, and the health officers are sealing the streets one by one, nailing boards across the doors. Most of the foreign merchants have gone, and the ones who couldn’t get away have been written down on the officers’ lists. The landlady of the inn behind the Rialto says the first to fall in her house was the Ottoman timber merchant, dead in three days. His man Selim sat up three nights without sleeping, and when the officers came to carry the body out, he set his master’s shoes straight before he let them take him, and said, “I’m his man. Wherever he goes, I go.” Over in Murano they tell how Piero threw down his blowpipe and ran for the quay, and the furnace master caught him by the collar: “You won’t get in!” “Then I’ll wait outside!” That evening the boat left for the quarantine island, and the register had one more line."
news = "Plague in Venice, and the health officers are sealing the streets one by one. An Ottoman timber merchant has died in an inn behind the Rialto, and his man was taken off to the quarantine island."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_choice]
title = "Bread on the Stone Ledge"
text = "One April night Piero was waiting for me at the little landing in Murano, half a loaf of dark bread under his arm and blisters on both palms. “One a night,” he said. “I set it on the stone ledge at the quarantine island’s landing. No going ashore: I put it down and row away. When I come the next night, sometimes the last one is still there and sometimes it’s gone, and I can’t tell if he took it or someone else did.” He pulled a narrow strip of paper from his apron and folded it over and over. “I can’t get a letter in. You have a ship, and a pass from the health officers. Just one line. It took me three nights.” On the paper was written: “Even a crack can tell us something. Don’t you crack.” He pushed it into my hand, took it back to read once more, and only then held it out again."
news = "On the stone ledge at the Venice quarantine island’s landing, someone leaves a loaf of bread every night and rows away. The rower comes from Murano."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_choice.default]
news = "A Murano glassblower rowed out alone for four months to leave bread on the quarantine island’s ledge, and some nights someone else took it. The Ottoman merchant’s man inside came out a good deal thinner."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_choice.choices.supply_island]
text = "Take a boatload of food and his letter to the island, and hand them to the steward the proper way."
reply = "I loaded a boat with dark bread, dried beans and vinegar, hung the health officers’ pass over the gunwale, and tied up at the official landing. The island’s steward had his men carry the crates in one by one; the strip of paper was soaked in vinegar and smoked over sulfur before it went through the iron grating. Three days later I came back for the empty crates, and the steward held out a crumpled slip, its ink blurred by vinegar, with a single line: “Going with the grain, not forcing it. I’ll get through.” Piero read it three times on the quay, and at the word “through” he wiped his nose on his sleeve. “Months of this, and he still opens his mouth and out comes timber.”"
news = "Someone with a health officers’ pass took the quarantine island’s official landing a boatload of bread, beans and one short letter, and the steward took in the crates one by one."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_choice.choices.row_with_him]
text = "Row out with Piero and watch the tide for him at night."
reply = "That night I sat in the stern watching the tide while Piero sang an off-key song in the bow, the oars dipping in time. Near the ledge he eased off, set the loaf down, and was about to back away when a cough came out of the dark opposite. Piero froze, his oar hanging over the water. A long moment passed, and then a voice, slow, as if waiting for each word to land: “Is the… wood dry?” Piero opened his mouth, and his voice came out hoarse: “Dry enough to light your ears!” I said nothing. I only held the boat steady until no more sound came from across the water, and the tide had gone out."
news = "At the quarantine island’s ledge, someone rows out at night to leave bread, and once a cough came from the dark on the other side, asking if the wood was dry."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_landing]
title = "Timber on the Bridge of Boats"
text = "The plague had ended. In July Venice kept its first Feast of the Redeemer, and boats were lashed side by side across the Giudecca Canal to make a bridge that swayed all the way to a temporary wooden chapel on the far bank. A good share of the planks was oak from the hills above İzmit that Selim had shipped, unpainted, the grain showing. Piero stepped over them one by one. “This one’s yours?” “This one too.” “And this?” “That one’s someone else’s, so go easy on it.” In the middle of the bridge Piero stopped and took Selim’s hand in front of everyone who had come to see the lights. “People are looking,” Selim said, lowering his voice. “Let them,” said Piero. “The planks under their feet are yours.” He didn’t let go. He leaned in and kissed him. After that, every year at the feast, Selim’s timber boat tied up before the bridge went up."
news = "Venice kept its first Feast of the Redeemer, with a bridge of boats over the Giudecca Canal and some oak planks from Istanbul in it. Two men stood hand in hand in the middle of the bridge for a good while."

