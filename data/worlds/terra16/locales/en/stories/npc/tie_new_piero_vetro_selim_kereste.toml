[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_meeting]
title = "Shards in Little Jars"
text = "Half a year and more after the peace, a firewood boat from the east tied up at Murano’s little landing, owned by an Ottoman timber merchant. Selim, who crewed it, carried a tally sheet into the glassworks to find someone to sign, and by the furnace a man was squatting on the floor in front of a row of small jars, sorting broken glass into them: blue, milk-white, lagoon green. “Why not just throw it out?” Selim asked, so quietly he might have been afraid of startling someone. Piero didn’t look up, and his hands didn’t stop. “Throw it out and it cracked for nothing. Even a crack can tell us something. Here, you’re the wood man. Look at this one. What’s it trying to say?” Selim crouched, picked up the green sliver, and turned it half a circle against the window. A cloudy streak ran through it, and the crack followed the streak. “Go with the grain. Don’t force the split.” He said it very slowly. “That’s how you split firewood. Nobody split this piece of yours. The fire in your furnace is uneven, and it cracked along its own grain.” Piero’s hands stopped at last, and his eyes lit up like a man’s who has found a coin. “Say it along the grain once more and I’ll write it down!” He spent the whole afternoon picking firewood, and asked of every log which mountain it had grown on."
news = "In a Murano glassworks, an Ottoman timber merchant’s man squatted on the floor for an afternoon, talking firewood with a glassblower who sorts his broken shards into jars."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_closer]
title = "Grain and Crack"
text = "Piero’s whole batch of cups had cracked again: thirty goblets, every one split at the foot. The furnace master’s boy chalked another mark against his name, and Piero scratched his head and laughed. “With the batch I ruined last time still unpaid, I’ll be blowing glass here till I’m eighty.” Selim let the money go by. He crouched at the woodpile by the furnace mouth and split the logs one at a time: the heart of the beech was black, and water seeped from the cut. “Even a crack can tell us something,” he said, copying Piero’s way of talking, only much more slowly. “It tells you the wood is wet.” The boy fussed that the lot was paid for and had to be burned. Selim said sorry three times and did not give an inch: “This lot can’t go in the furnace.” The next batch was fired with wood of his own picking. On the morning the annealing oven was opened, all thirty goblets were whole, and Piero stood hugging the entire row, laughing too hard to speak."
news = "A Murano glassblower’s goblets kept splitting at the foot. An Ottoman timber merchant’s man cut open the furnace wood, found it wet, and swapped it, and this time not one cracked."

[tracks.tie_new_piero_vetro_selim_kereste.chapters.tie_new_piero_vetro_selim_kereste_closer.default]
