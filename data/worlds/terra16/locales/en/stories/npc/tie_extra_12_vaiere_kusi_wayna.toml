[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_landing.variants.helped]
text = "Vaiere’s double canoe is back from the south, and this time it sails west. Planks are laid between its two hulls, and Kusi sits cross-legged on them, tying the seven cords she was shown to the mast one by one, their ends pointing west. At the bottom hangs a lopsided double-strand knot, one she tied herself, learned from him that afternoon. Kusi looks at it and pulls it one turn tighter. The other bundle, wound in red thread, rests on his own knee, pinned under the head of his stick. Vaiere asks nothing about it. She raises a hand to a star that has just cleared the horizon. “The day it climbs to this height, I’ll be back.” “It climbs to this height every day,” says Kusi. “Which day? Give me a number.” “Eleven years from today.” He nods. “Not a round number. I believe it.”"

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_landing.variants.notes]
text = "Vaiere’s double canoe is back from the south, and this time it sails west. Planks are laid between its two hulls, and Kusi sits cross-legged on them, tying the seven cords she was shown to the mast one by one, their ends pointing west. The other bundle, wound in red thread, rests on his own knee, pinned under the head of his stick. “The captain has the notes,” Vaiere says. “The corner with the waves was never copied.” “He says he’ll guard it for life,” says Kusi. “Round. I don’t believe him.” “Nor do I.” She raises a hand to a star that has just cleared the horizon. “The day it climbs to this height, I’ll be back, to see whether he has.” “It climbs to this height every day,” says Kusi. “Which day? Give me a number.” “Eleven years from today.” He nods. “Not a round number. I believe it.”"
