# C7：tie_extra_12_vaiere_kusi_wayna 的英文显示覆盖（嵌套表，按轨道、章节、选项 key 对应）；不含玩法字段。

[tracks.tie_extra_12_vaiere_kusi_wayna]
name = "Two Seas Not for Sale"

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_meeting]
title = "Not Every Knot Comes Undone"
text = "A woman from the west sits on the stone steps of the quay with a square of bark cloth spread across her knees. It is covered in dots and lines, and there is not one written word on it. An old quipu keeper from Chincha stops a little way off, leaning on his stick, a bundle of knotted cords under his arm; Tupac Yupanqui’s voyage across the sea, out and back, is tied into them. “Your goods. Give me a number,” he says. “And not a round one. A man who gives a round number is either lazy or lying.” “I have no goods,” says Vaiere, without looking up. “Sit down. Don’t talk. Listen.” He sits. She asks, “Which cord is the sea?” “None of them.” He shakes the bundle out and points to a long bare stretch between two clusters of knots. “The men who went out are tied at this end, the men who came back at that one. In between, nine months, and no knots.” Then it is his turn. “Which star is home?” She lays her palm over one dot on the cloth and leaves only its neighbor showing. “This one. In summer it rises right on the water.” The old man bends over it for a long while. He doesn’t move her hand, and he doesn’t loosen his own grip on the fist-sized knot at the tail of the cord."
news = "On the quay steps at Callao a woman from the west spread out a square of bark cloth, and an old quipu keeper from Chincha shook out his cords. They sat facing each other until dark."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_turning]
title = "The Map They Wouldn’t Copy"
text = "The quay at Callao talked about that dinner for days. The silver merchant had taken the woman from the west and the old man from Chincha to eat, with a clerk in tow and a purse of pesos on the table. He wanted the star paths copied down and the readings of the cords too, enough to fit out a fleet and go looking for the islands Mendaña found and then lost. The old man asked only, “How much?” “Three thousand.” The old man shook his head. “Round.” The merchant went home and counted all night, and the next morning he named his figure: “Three thousand two hundred and seventeen.” The old man nodded as if he were writing it down, and tucked his cords into his sleeve while he was at it. “And once I’ve bought it,” the woman asked, “whose is the road?” “The fleet’s.” She started rolling up the bark cloth, layer by layer. They say the clerk’s pen hadn’t touched the paper before the two of them burst out laughing together."
news = "A Callao silver merchant offered three thousand two hundred and seventeen pesos for the woman from the west’s star paths and the old keeper’s cords, and went home with neither."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_choice]
title = "A Ring of Waves"
text = "Vaiere’s ship puts to sea again the day after tomorrow, for a year. The notes she promised me lie on my cabin table: the names of seventeen stars and the directions they rise, and not one sailing course. She pulls the bark cloth toward her, dips a little stick in candlenut soot and paints a ring of waves in the farthest corner. “This corner is not to be copied. Anywhere else, copy what you like.” Kusi pulls five cords from his bundle and winds red thread around them. “Five. I counted. These five I don’t explain.” Someone knocks on the cabin door. It is the silver merchant again, and this time two men from the garrison stand behind him. “The viceroy’s house would like a look at this cloth as well. My price is three thousand five hundred and three.” Vaiere doesn’t look at them. She looks at me. “You tell me. This corner. Do we give it?”"
news = "The silver merchant of Callao went to find the woman from the west with soldiers from the garrison, just as she was filling a corner of her bark cloth with waves."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_choice.default]
news = "The silver merchant took soldiers from the garrison to ask the woman from the west for her bark cloth and the old keeper for his cords. He got neither, and left saying he’d be back."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_choice.choices.turn_away]
text = "Keep the merchant and the soldiers out of the cabin on their behalf."
reply = "I planted myself in the cabin doorway with my own cargo manifest and read it out to the garrison men, line by line. Somewhere past the ninetieth line the merchant slipped away; the soldiers stood about for another hour before they gave up too. Behind the door Kusi was asking, “The third star. How high?” “A hand’s breadth,” Vaiere said. “You first.” That afternoon she taught him three stars and he taught her a double-strand knot. Neither made it into the notes."
news = "A ship’s master at Callao kept the garrison men busy all afternoon with his cargo manifest, while the woman from the west and the old keeper stayed in the cabin and never came out."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_choice.choices.keep_notes]
text = "Take only the notes that can be made public, and promise to guard that corner for them."
reply = "Vaiere put the notes in my hands, turned, and shook the bark cloth open in front of the soldiers: in the far corner a ring of waves, drawn so thick that nothing showed beneath it. They leaned in for a long time, then had to admit there was nothing more to see. Kusi asked me, “Give me a number. How many years will you guard it?” “For life.” “Round,” he said, tucking the five cords wound in red back into his sleeve. “I don’t believe you.”"
news = "The garrison men at Callao looked over the woman from the west’s bark cloth and found one corner so thick with waves that nothing showed; a ship’s master took a set of notes and said he would guard that corner for life."

[tracks.tie_extra_12_vaiere_kusi_wayna.chapters.tie_extra_12_vaiere_kusi_wayna_landing]
title = "A Sea Apiece"
text = "Vaiere’s double canoe is back from the south, and this time it sails west. Planks are laid between its two hulls, and Kusi sits cross-legged on them, tying the seven cords she was shown to the mast one by one, their ends pointing west. The other bundle, wound in red thread, rests on his own knee, pinned under the head of his stick. Vaiere glances at it once and asks nothing. She raises a hand to a star that has just cleared the horizon. “The day it climbs to this height, I’ll be back.” “It climbs to this height every day,” says Kusi. “Which day? Give me a number.” “Eleven years from today.” He nods. “Not a round number. I believe it.”"
news = "On the day the woman from the west sailed out of Callao, the old quipu keeper sat cross-legged on her deck and spent the better part of an hour tying seven cords to the mast."

