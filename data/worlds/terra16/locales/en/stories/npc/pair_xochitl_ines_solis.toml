[tracks.pair_xochitl_ines_solis]
name = "Signed in Two Tongues"

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_meeting]
title = "Two Doors"
text = "In the forecourt of the convent school, Xochitl squatted by the steps sorting a bundle of feathers and humming a song in Nahuatl. Inés came over with her little notebook, listened to half of it and sat down right beside her. “Wait—I don’t have that word yet. That line just now, sing it again.” Xochitl gave her a sidelong look. “Call this a song? The ones in Mexico City are ten times bigger.” Having bragged, she sang it again from the top anyway, slower this time. At one word Inés cut in again. “Nochān—what’s that?” “My home.” “Home the house, or home the people in it?” Xochitl opened her mouth and turned the feather in her fingers twice. “…Both.” Inés drew two doors in her notebook. Under one she wrote “house,” under the other “people,” and between them she spelled out nochān letter by letter. Under the arcade a nun clapped twice. Xochitl stuffed the feathers back in her bag and lowered her voice. “The second half tomorrow.”"
news = "In the forecourt of the convent school in Mérida, an encomendero’s daughter is learning a Nahuatl song from a Mexica girl. Sister says one more verse and they’ll both be copying scripture."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_closer]
title = "Thy People, My People"
text = "In catechism class, Sister called on Inés to read from the Book of Ruth. “Whither thou goest, I will go…” From the back row someone hummed a line in Nahuatl, a line from that song in the forecourt, meaning much the same thing. Xochitl kept her head down and pretended to count her rosary beads. Inés reached “thy people shall be my people,” looked up straight into a pair of eyes in the back row, and lost her place on the next line. Sister shut the book. “Ten copies.” After class Xochitl grabbed half the paper and copied too. On the fifth copy she added a line of Nahuatl in the margin and put the pen down. “Our song is older than your book.” “How do you know?” “My grandmother said so. Her grandmother sang it.” Inés didn’t argue. “Then I’ll write down both.” She turned to the page with the two doors and wrote one line in Castilian between them, one in Nahuatl. Xochitl leaned in to spell it for her, and their heads nearly touched before both of them pulled back. Xochitl took a green feather from her bag, tucked it into that page, closed the notebook and pushed it back into Inés’s arms."
news = "A nun at the convent school in Mérida made a young lady copy out the Book of Ruth. A Mexica girl helped her, and now there’s a line in the margin nobody else can read."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_turning]
title = "The Second Life of a Grant"
text = "In the Mérida market lately, everyone has been doing the Solís family’s sums for them. An encomienda in Yucatán passes down two lives and no further, and old Solís is the second life: once he closes his eyes, the maize and cotton cloth from those villages belong to the Crown. The beeswax woman says there’s always a way. Over in Valladolid there’s an encomendero twice the Solís girl’s age who has already buried one wife. Marry her to him, tie both families’ villages to one rope, and the tribute feeds them for another lifetime. The wedding is supposed to be at Christmas. “And if the girl won’t have him?” “Then it’s the convent in Mexico City. Mérida still has no convent that takes women, so if they want her shut away, it has to be that far.” The old water carrier puts in a word of his own: that daughter of the Mexica auxiliary has been hanging around the Solís back gate for months, always carrying a roll of something—feathers some days, paper others. The kitchen maid took one at the door once and had it in her apron before she’d turned around."
news = "The Solís family means to marry their daughter off to Valladolid, to a groom twice her age, they say. Everyone in Mérida says the match is about the tribute."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_choice]
title = "The Road to Mexico City"
text = "In a salt shed behind the Campeche docks, Inés turned her notebook to the last page and spread it on a sack of salt for me to see. The writing there was smaller than anywhere else: mending, two reales a day; copying, paid by the page; teaching children to read, board included. Every line ended in a question mark, and a few of the question marks had been struck out. “Father has never seen this page,” she said. “Before a knight rides out, he has to know what he’ll eat on the road.” Xochitl leaned in the doorway holding a letter from her cousin Ana in Mexico City: the workshop needed a helper who could write in Spanish, to keep the books and letter the title pages, three months’ trial for anyone who came. “I can lay feathers. She can write.” Xochitl stopped and stared at the salt grains on the floor. “I’ve never been to Mexico City.” Inés didn’t look up. She closed the notebook. “Then we’ll go for the first time together.” She nudged it toward me. “You’re the one who sails. How many days from here to Veracruz?”"
news = "The Solís girl in Mérida left a letter and was gone. They say she went off with a Mexica girl on a salt boat out of Campeche, bound for Veracruz."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_choice.choices.stall_match]
text = "Take Inés’s letter to Valladolid and call on the encomendero."
reply = "Inés wrote all night, ruined two sheets, and the one she kept ran to half a page. I took it to Valladolid with a chest of cacao. The encomendero read it in his gallery for a long time, then folded it back along its creases. “I don’t want a wife who comes through my door crying.” He didn’t tear up the contract. He only said it was “postponed,” first to next year, then perhaps the year after. By the day word of the postponement reached the Solís house in Mérida, Inés was already in Mexico City."
news = "That encomendero in Valladolid has put off the Solís wedding. Before the matchmaker was even out the door, all Mérida was saying the daughter had long since left home."
effects = [{ }, { }, { }, { title = "The Postponed Match" }]

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_choice.choices.passage]
text = "Carry them from Campeche to Veracruz on my own ship."
reply = "On sailing day, before dawn, Inés came up the gangplank behind the men hauling salt, wearing Xochitl’s old clothes, her hair stuffed under a straw hat. Only once we were out of Campeche harbor did she cry, in hiccuping gulps. Xochitl scolded her the whole way—“You look awful, like a wet parrot”—and the whole way held out her own shawl. By the time we tied up at Veracruz the shawl was soaked through, and Inés still wouldn’t give it back."
news = "A merchant ship slipped out of Campeche before dawn with two extra passengers, one in a straw hat, one dressed like a Mexica girl. Bound for Veracruz, people say."
effects = [{ }, { }, { }, { title = "The Ship to Veracruz" }]

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_choice.choices.watch]
text = "Stay out of it, and see them off at the docks on sailing day."
reply = "They took passage on a little salt boat, its hold stacked to the beams with sacks, so passengers sat on top of them. Before she stepped onto the gangplank, Inés turned and looked once toward the convent in Mérida. Xochitl didn’t look back. She only gripped Inés’s hand, so hard Inés let out an “ow.” The boat pulled away from the quay with the two of them still sitting on the salt, hands still locked."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_together]
title = "Two Scripts on the Title Page"
text = "The back room of Ana’s feather workshop had a single window facing north. Ana put her head in—“Use whatever scraps you like, leave the cupboard alone”—and went back out front. On the table lay the first thing the two of them had made together: a wooden folding case, like a book with only two pages. On the right-hand page, which Xochitl had spent seven days feathering, a hummingbird hovered between two doors, one framed in brown, one in blue, exactly like the pair in the notebook nine years ago. The left-hand page was the title page, and it needed an inscription. “You first.” Inés handed her the pen. Xochitl wrote a line in Nahuatl, very slowly. Beneath it Inés wrote the same sentence in Spanish: Thy people shall be my people. On Sunday they left the city for the first time to see the lake. Xochitl stood on the causeway looking for a long time. “It’s smaller than I said.” “You’ve been bragging for ten years.” “Nine.” Xochitl wouldn’t give her that, and turned to face her. “Nocniuh—” Before she could finish, Inés rose on her toes and kissed her. Someone poled a canoe past on the lake. Xochitl didn’t pull away."
news = "The feather workshop in Mexico City has hung up a little folding case: inside, a hummingbird between two doors, and on the title page one line in Nahuatl and one in Spanish."

[tracks.pair_xochitl_ines_solis.chapters.pair_xochitl_ines_solis_together.variants.helped]
text = "The back room of Ana’s feather workshop had a single window facing north. Ana put her head in—“Use whatever scraps you like, leave the cupboard alone”—and went back out front. On the table lay the first thing the two of them had made together: a wooden folding case, like a book with only two pages. On the right-hand page a hummingbird hovered between two doors, exactly like the pair in the notebook nine years ago. The left-hand page was the title page, and it needed an inscription. Xochitl wrote a line in Nahuatl; beneath it Inés wrote the same sentence in Spanish: Thy people shall be my people. Then Inés added a tiny line in the corner: Campeche, summer of 1562. “And who’s that line for?” “Someone who lent us a hand. I’m leaving the name off. They’d only be embarrassed.” On Sunday they left the city for the first time to see the lake. Xochitl stood on the causeway looking for a long time. “It’s smaller than I said.” “You’ve been bragging for ten years.” “Nine.” Xochitl turned to face her. “Nocniuh—” Before she could finish, Inés rose on her toes and kissed her. Someone poled a canoe past on the lake. Xochitl didn’t pull away."

[tracks.pair_xochitl_ines_solis_side]
name = "The Page Torn Out"

[tracks.pair_xochitl_ines_solis_side.chapters.pair_xochitl_ines_solis_side_landing]
title = "The Page Torn Out"
text = "On the Campeche docks, a ship for Veracruz was taking on salt. Xochitl’s luggage was one cloth bundle and a wooden box of feathers, and she kept opening its clasp and snapping it shut again. “The lake in Mexico City,” she said, “I could find my way around it with my eyes closed.” Inés said “Mm” and let her talk. She took the notebook from inside her dress, turned to the page with the two doors and nochān written on it, and tore it out bit by bit along the binding. She pressed it into Xochitl’s hand. “When you get there, check for me whether it really is ten times bigger than here. Then write and tell me. Write it in Nahuatl. I can read it.” Xochitl said nothing back. She opened the box, slid the page under the bottom layer of green feathers and snapped the clasp shut. Someone on board called that they were casting off. She took two steps, then turned. “And you?” “The convent school needs someone to teach the girls their letters.” Inés waved the notebook, one page short now. “I’ll give it a try.” Xochitl snorted and went up the gangplank. Long after the ship had cleared the harbor, Inés was still standing on the stone steps of the quay."
news = "That Mexica girl from Mérida has gone to Mexico City to learn feather painting. The encomendero’s daughter saw her off on the Campeche docks and stayed until the ship was out of sight."
