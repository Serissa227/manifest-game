# 坏银币的好去处（pair_musa_yaqub）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_musa_yaqub]
name = "A Good Home for a Bad Coin"

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_meeting]
title = "A Night in the Lockup"
text = "A silver piece cut with lead went from the cloth market to a cobbler, and from the cobbler into the hands of two boys. The market inspector didn’t ask where it came from. He took one boy in each fist, dragged them to the back of his office, and dropped the bar across the door of the lockup. There was no window. Musa started first. “It’s quieter in here than my father’s guild.” Then came a second joke, and a third, each one faster than the last, and once the final crack of light under the door went out he stopped taking breaths between them. Yaqub sat against the wall and listened for a good while without saying a word. Then he took a few coins from his shirt and weighed them in his palm. “Silver rings. The accounts can’t go quiet. I’ll drop them, you listen, and call it true or false.” A coin hit the flagstones with a bright note. Musa’s mouth closed. “True.” “Right. Again.” Later they traded places, Musa dropping and Yaqub guessing. When the door opened at dawn and the inspector’s torch swung in, Yaqub said, “I got three wrong.” Musa rubbed his eyes. “You never got one wrong.”"
news = "In Fez the market inspector locked up two boys for a night over one bad silver coin. They say the lockup rang and clinked till morning."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_closer]
title = "The Coin on the Lamp"
text = "Under the small oil lamp in the goldsmith’s shop hung a new thing, a silver coin with a hole punched through it, turning on its thread, flashing, then flashing again. Musa reached out and set it swinging. “What’s it worth?” “Nothing you could pay.” Yaqub didn’t look up from the scale pan, where he was setting down weights. “It buys one thing only: coming back on time.” “Where did you get it?” “Ask the price. Don’t ask the story.” Musa laughed and said that in that case every time he left town he’d have to come look at this lamp first. Yaqub said nothing and trimmed the wick shorter. At the door Musa turned. “When do you put up your shutters?” “One hour after sunset.” He said it over twice under his breath, found a lump of charcoal, and drew a line on the back of his hand. Behind him the scale pan jolted. Yaqub had weighed half a grain wrong, and he never weighed wrong."
news = "In the Jewish quarter of Fez, a goldsmith’s lamp has a silver coin with a hole in it hanging underneath. The shop’s young master won’t sell it at any price."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_together]
title = "First Stop, the Goldsmith’s"
text = "Musa had been away three months with the guild, and the day he got back he didn’t go home. A quarter hour before closing, with the shutters only half up on the goldsmith’s shop, he squeezed in sideways and upended a cloth bag on the counter, and sand hissed out across the wood. “This time there’s real treasure. At the very least, there’s me.” Two copper coins rolled out of the sand, so rusted you couldn’t read them. Yaqub didn’t laugh. He set them on the scale one at a time, adding weights and taking them off, adding and taking off. “How much?” Musa asked. “The most expensive two I’ve ever seen.” Musa reached for a joke and couldn’t find one. On the lamp the pierced coin turned half a circle. Yaqub came around the counter, pushed the last shutters home and barred them, and when he turned, Musa’s hand was still hanging in the air with nowhere to go. He took it. Then he kissed him, just a short one, while the scale pan went on swaying behind them."
news = "The guild consul’s son in Fez, back from three months on the road, didn’t go home first. He went straight to the goldsmith’s shop in the Jewish quarter."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_turning]
title = "Three Kings"
text = "All the talk in the street is that when the fighting at the Wadi al-Makhazin ended, not one of the three kings came home. The young king of Portugal didn’t come back, the sultan of Morocco didn’t come back, and the old sultan who had been pushed off his throne and came with the Portuguese to win it back drowned in the river. Then people said the prisoners are being marched into Fez in long lines, thousands more mouths to feed and thousands of families going from gate to gate asking after someone. The goldsmiths in the Jewish quarter keep their lamps burning all night. Ransom silver is carried in sack after sack, the scale arms go down and come up, and passersby say the weights click behind those doors more often than the call to prayer."
news = "Three kings died in the fighting at the Wadi al-Makhazin. Fez now has a thousand prisoners and a thousand families asking after their own."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_choice]
title = "The Lists"
text = "The goldsmith’s counter was covered with other people’s things: rings, silver buckles, amulets with names cut into them, each with half a slip of paper pinned under it. Musa leaned on the counter, his pack already tied. “Four families in the guild have sons who haven’t come back,” he said. “I’m going out toward Alcácer, village by village.” “There are no lamp-oil shops out in the fields.” Yaqub didn’t look up from the buckle he was wiping. “I should be the one to go.” “If you go, who matches the things to the families?” They argued until the lamp ran dry. Musa tore off a sheet of paper, and Yaqub tore another. Each wrote a list of names, put a place to send word at the bottom, and swapped. Then they both turned to look at me."
news = "After the fighting at the Wadi al-Makhazin, the joker of the Fez treasure-hunters’ guild went out to look for missing men, while the goldsmith’s shop in the Jewish quarter spends every day identifying belongings."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_choice.choices.lists]
text = "Go out with Musa and search name by name"
reply = "We spent twenty days in the villages around Alcácer. In each one Musa handed the list to the oldest person first, and whenever we found someone he drew a circle around the name and added a line to that night’s letter to Yaqub. He didn’t tell one joke the whole way. We slept on threshing floors, and he kept a lamp burning until daylight. I pretended not to notice."
effects = [{}, {}, {}, { title = "The List Full of Circles" }]
news = "The jokester of the Fez treasure-hunters’ guild is out searching, they say, and hasn’t told a single joke the whole way. Most of the names on his list have a circle by them."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_choice.choices.relay]
text = "Stay in the city and carry word between them"
reply = "Yaqub recognized one silver buckle, with a line of lettering cut on the back in the style they write it around Salé. I rode out after dark on a donkey and put it in Musa’s hands. He bent over it by the fire a long time, and the next morning he went and knocked on the door that lettering pointed to. Before he turned back he sent me ahead with a message: “Go and see for me whether the lamp is still lit.”"
effects = [{}, {}, {}, { title = "The Buckle with Writing" }]
news = "A silver buckle identified in a Fez goldsmith’s shop was carried out of the city by night, and they say it found the house whose name was cut into it."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_choice.choices.watch]
text = "Stay out of it and wait at the goldsmith’s"
reply = "I waited in the shop. Every morning Yaqub wiped down the lamp with the silver coin on it before he took down the shutters, then spent the day identifying belongings. On the evening of the nineteenth day someone knocked three times, Musa’s knock. Yaqub still had the lamp rag in his fist when he went to open the door."
news = "The goldsmith’s son in Fez wiped his lamp and identified lost belongings every day for nineteen days, until the man who went out searching came back."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_epilogue]
title = "Which Door First"
text = "Musa had gone off on another long trip. The day he got back, the goldsmith’s shop had just lit its lamp when three knocks came, neither soft nor hard. The pierced coin on the lamp had been polished until it shone. Yaqub opened the door, lamp oil on his cuff. “Two days late.” “Ran into a sandstorm,” Musa said, dusting his shoulders. “Me and the camel fought over one blanket, and the camel won.” “I filled the lamp four times.” Yaqub stepped aside. Musa opened his mouth, swallowed the rest of the joke, and went in over the threshold first."
news = "Folk in Fez say the treasure hunter from the guild always knocks three times at the goldsmith’s in the Jewish quarter when he gets back from a long trip. The whole street knows that knock."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_epilogue.variants.helped]
text = "Musa had gone off on another long trip. The day he got back, the goldsmith’s shop had just lit its lamp when three knocks came, neither soft nor hard. On the wall behind the counter hung a sheet of paper packed with circled names, and Yaqub looked at it every morning before he took down the shutters. He opened the door, lamp oil on his cuff. “Two days late.” “Ran into a sandstorm,” Musa said, dusting his shoulders. “Me and the camel fought over one blanket, and the camel won.” “I filled the lamp four times.” Yaqub stepped aside. Musa opened his mouth, swallowed the rest of the joke, and went in over the threshold first."

[tracks.pair_musa_yaqub.chapters.pair_musa_yaqub_epilogue.variants.matched]
text = "Musa had gone off on another long trip. The day he got back, the goldsmith’s shop had just lit its lamp when three knocks came, neither soft nor hard. On the wall behind the counter was pinned a rubbing of the back of the lettered buckle, the first belonging Yaqub had ever matched. He opened the door, lamp oil on his cuff. “Two days late.” “Ran into a sandstorm,” Musa said, dusting his shoulders. “Me and the camel fought over one blanket, and the camel won.” “I filled the lamp four times.” Yaqub stepped aside. Musa opened his mouth, swallowed the rest of the joke, and went in over the threshold first."

[tracks.pair_musa_yaqub_side]
name = "Friends Who Share a Lamp"

[tracks.pair_musa_yaqub_side.chapters.pair_musa_yaqub_side_landing]
title = "A Lamp to Borrow"
text = "Musa went out with the guild for the first time, and three months later he came back and didn’t go home. He went to the goldsmith’s to say he was safe. He emptied a bag of sand on the counter, and in it there were only two rusty copper coins. “No treasure,” he said, brushing off his hands. “But I got back in one piece.” Yaqub set the coins on the scale pan and glanced at it. “Worthless.” He didn’t give the coins back, but he nudged the lamp with the silver coin on it across the counter, just far enough for Musa to reach. “Next time you go out, come back and borrow the lamp.” Musa grinned and said it was a deal. At the door he looked back at the lamp once more."
news = "The joker of the Fez treasure-hunters’ guild came back from a long trip and went to the goldsmith’s in the Jewish quarter to say he was safe. All the treasure he brought was two rusty copper coins."
