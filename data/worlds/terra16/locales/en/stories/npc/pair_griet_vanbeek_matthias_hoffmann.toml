# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_griet_vanbeek_matthias_hoffmann]
name = "Failing Together"

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_meeting]
title = "Hers Goes First"
text = "The shop on the Antwerp corner had only just been rented, and half the nails on the wall were still bare. A girl with a lens pushed up on her forehead barged in and reached straight for the brass clock with the balance wheel on the bench. “Don’t touch that! The spring isn’t wound tight yet.” Matthias snatched it against his chest. “It’s going to sea. Bend one tooth and that’s three days of my work gone.” “Griet. From Middelburg, here to buy glass.” Her eyes had already moved to his belt. “That compass of yours—can I borrow it and take it apart?” He drew himself up. “The heir of Henlein doesn’t lend his compass out to be taken apart by laymen.” They argued from the compass to the balance wheel to whether two lenses stacked together could see far, and after a quarter of an hour Griet slapped the bench. “Let’s make it together. You make the clock, I make the tube that sees far.” “And when it works, whose name goes on it?” “Mine first.” She pulled two blank ledgers off the shelf. “Failures get written down twice. One book each.”"
news = "In Antwerp a newly arrived clockmaker from Nuremberg and a lens grinder from Middelburg argued in his workshop for a quarter of an hour, then announced they were going to build something together."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_closer]
title = "Not Until It’s Been Shaken"
text = "In the channel outside Flushing a cloth trader’s boat agreed to take them out for one trial. On shore the clock ran true; on deck it went wild, its hand chasing the swell. Griet held her two stacked lenses to her eye and squinted at a far steeple for a long time. “A smear of light.” A wave hit, the clock box slid toward the rail, and what Matthias grabbed was Griet’s sleeve. The clock cracked against a bollard and the hand jumped another half mark. Back in the cabin he opened the ledger and pinched the corner of the page. “Tear it out. We’ll try again.” Griet’s palm came down flat on the paper, pinning his fingers. “It only counts if it’s been shaken.” He stared at that page for a long time before he said it. “It failed.” “Right, it failed. Write it down.” She pushed the pen into his hand and left her own where it was."
news = "A boat out of Flushing carried a clock and a lens grinder to sea. The clock came back running wild, and the girl came back laughing."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_turning]
title = "The King’s Fleet"
text = "The king’s fleet has weighed anchor at Flushing and gone home to Spain, leaving a wide stretch of empty water at the quay, but the talk in the taverns hasn’t sailed with it. They say that before the fleet left, a nobleman’s steward went around Flushing and Antwerp asking who could build a clock that would hold the longitude at sea. The king’s pilots could use one, the price was negotiable, and he’d pay half up front if need be. At last somebody pointed him to the clockmaker from Nuremberg on a corner in Antwerp, a man whose first words are always “almost there.”"
news = "The king’s fleet has left Flushing. They say a nobleman’s steward is asking around for a clock that can fix longitude at sea, price negotiable."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_choice]
title = "Selling Hope"
text = "The steward came to the workshop and set a bag of coin on the bench, heavy enough to pin down the spread plans. “Write me a certificate saying the clock has proved itself at sea. The advance is yours on the spot.” Matthias said nothing. Under the table his hand was clenched; last month’s rent was still owing. “Actually, it’s already—” His mouth opened and shut. Griet flipped the ledger to the Flushing page and slapped it down in front of the steward. “Have you read this? The clock ran wild on that boat. What would we be certifying? That money is a lie, and we’re not taking it.” The steward turned to me, looking for someone reasonable. So did Griet. “You get around. Besides this bag of coin, is there any other way?”"
news = "The nobleman’s steward who was asking after a sea clock hit a wall in Antwerp. They say a lens grinder turned him down to his face, and he left slamming the door."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_choice.default]
news = "The workshop on the Antwerp corner refused the steward’s advance and is living on spectacles and table clocks, while the clock for the sea is still being tried."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_choice.choices.public_trial]
text = "Set up a public trial at the Exchange, with Griet running it."
reply = "Half a ring of people gathered at the Exchange. The clock went on the rocking board and was off within minutes, and Griet read out the error in front of everyone. “Slow by three minutes twelve. Next.” She left out nothing, down to the last second, while Matthias stood by with his arms folded and his face red to the ears. Half the crowd drifted off. Two shipowners stayed, and said that anyone brave enough to read out a failure could be trusted with their spectacles and table clocks."
effects = [{}, {}, {}, { title = "Error Read Out Loud" }]
news = "At the Exchange in Antwerp a lens grinder read out, in front of everyone, how far off a clock had run. Two shipowners stayed and nodded."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_choice.choices.honest_buyer]
text = "Find honest buyers for their spectacles and table clocks to keep the shop afloat."
reply = "I brought them orders for twenty pairs of spectacles and three table clocks. Matthias studied the list for a long time. “This isn’t what I set out to make.” Griet was rubbing a lens on her sleeve. “Eat first. The clock can take its time.” He didn’t argue; he went off to dig out the little chains for the table clocks."
effects = [{}, {}, {}, { title = "Twenty Pairs of Spectacles" }]
news = "The corner workshop in Antwerp has suddenly landed an order for twenty pairs of spectacles and three table clocks, and word is somebody put in a good word."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_choice.choices.watch]
text = "Stay out of it and watch how they answer the steward."
reply = "The steward slammed the door on his way out and took his bag of coin with him. Matthias didn’t say a word all night; he sat under the lamp grinding a gear. When I passed by the next morning there was a fresh page in the ledger that read “Steward came, no signature,” in two hands crowded together."
news = "The door of the corner workshop in Antwerp rattled the night before last when a nobleman’s steward slammed it, and the clockmaker hasn’t slept since."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_together]
title = "The Order on the Sign"
text = "The shop on the Antwerp corner has a new sign, the paint still wet: “Van Beek & Hoffmann.” Her name comes first. “No clock, no tube,” Matthias said, counting on his fingers. “Two ledgers of failures, filled up. But the workshop got built.” Griet, up on a ladder, ran a hand over the board. “I chose the order. You don’t mind?” “You chose it the first day you walked in.” He took a small clock off the shelf, wound it full, and set it by her grinding bench under the garret window, where a lens on the corner was aimed at the masts on the river. The bench and the crate of lenses had come from Middelburg last month, and her coat now hung beside his on the same nail. “This one isn’t going to sea. It stays here.” Griet bent and listened. “It’s running a little slow,” she said. “I’ll write it down.”"
news = "A workshop in Antwerp has hung up a new sign with the lens grinder’s name before the clockmaker’s, and they say it was she who settled the order."

[tracks.pair_griet_vanbeek_matthias_hoffmann.chapters.pair_griet_vanbeek_matthias_hoffmann_together.variants.helped]
text = "The shop on the Antwerp corner has a new sign, the paint still wet: “Van Beek & Hoffmann.” Her name comes first. There was a line at the door for spectacles, and one of them was a shipowner I knew. “No clock, no tube,” Matthias said, counting on his fingers. “Two ledgers of failures, filled up. But the workshop got built.” Griet, up on a ladder, ran a hand over the board. “I chose the order. You don’t mind?” “You chose it the first day you walked in.” He took a small clock off the shelf, wound it full, and set it by her grinding bench under the garret window, where a lens on the corner was aimed at the masts on the river. The bench and the crate of lenses had come from Middelburg last month, and her coat now hung beside his on the same nail. “This one isn’t going to sea. It stays here.” Griet bent and listened. “It’s running a little slow,” she said. “I’ll write it down.”"
