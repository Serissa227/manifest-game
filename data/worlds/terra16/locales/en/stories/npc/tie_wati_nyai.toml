# 不相让的下半句（tie_wati_nyai）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、见闻、选项、回复、回忆标题），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完；美式拼写、弯引号。

[tracks.tie_wati_nyai]
name = "Not a Coin, Not a Line"

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_meeting]
title = "A Price List That Won’t Scan"
text = "Classes are out, but the stalls on the Gresik waterfront are still open. In front of Nyai Gama’s pepper stall stands a whitewashed board with two lines in charcoal: “The east wind carries ships to Banten; pepper, seven hundred cash the load.” Wati, at the nutmeg stall next door, reads it aloud and slowly shakes her head. “Your price list is a bad pantun. It opens with the sea, it ends with money, and there’s nothing in between.” Nyai Gama keeps her hand on the steelyard and doesn’t look up. “Then here’s the second half: if pepper’s dear, don’t be haughty—go and price the nutmeg sold by Wati.” The stevedores laugh until they’re slapping the sacks. Wati laughs too, and when she’s done she tips a handful of nutmeg into her scale pan. “Let the growers name their price first.” Nyai Gama snaps her cashbox shut. “Tell me plainly which day you’ll make port next time.” A boatman tries to slip in a lower offer while everyone’s laughing. Both girls turn on him at once. “Seven hundred.” “Fourteen hundred.”"
news = "On the Gresik waterfront, the Banda elder’s girl and the Banten pepper merchant’s girl haggle in pantun, and the boatmen hang around after work to hear the next line."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_closer]
title = "Verses on the Mosque Steps"
text = "This year’s pantun contest is over, and the judges and the crowd have gone back down the hill. The stone steps of the mosque on Giri hill still hold the heat of the day, and a few girls stay behind and carry on, with nobody keeping score. Wati takes her openings only from the islands of Banda—Neira, Lonthor, Ai, Run, all eleven in turn. Nyai Gama answers with the harbors along the Banten coast—Pontang, Cigede, Tangerang—each reply quicker than the last. The moon comes up out of the sea and neither of them has dropped a line. For the last verse, Wati sings the opening half—“The tide off Ai has run out past the reef, the boats of Run are not yet home—” and stops. The other girls nudge Nyai Gama to answer. She waits a long while, and doesn’t. “First, that half is yours to keep.” She unhooks the little knife she uses on sack cords and cuts a hole in the top of the coconut at Wati’s feet. “Second, half each.” Wati takes it, drinks exactly half, and hands it back."
news = "Up on Giri hill above Gresik, girls sat on the mosque steps after the contest trading pantun until moonrise. One verse was only sung halfway, and nobody finished it."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_turning]
title = "One Buyer Only"
text = "Around the betel stalls on the Gresik waterfront, all anyone talks about these days is one sheet of paper. A merchant from Malacca is bound for Banda to get the nutmeg headmen’s thumbprints on it: the whole island’s nutmeg sold to him alone, at one price, for ten years. It runs in Malay and Portuguese side by side—until the last few clauses, which are in Portuguese only. A copy went around the docks and found its way into the Giri academy. They say Wati, the Banda elder’s daughter, read halfway and tore up the prices she had been drafting for her island for next year. All she said was, “Ten years. He’s even set next year’s price for us.” They also say Nyai Gama of Banten crouched down, gathered the scraps, pieced them together, and held them down with a steelyard weight. “Stop tearing. Find out which headmen haven’t seen this yet.”"
news = "A Malacca merchant is taking a monopoly contract to the nutmeg headmen of Banda, and the last clauses are in Portuguese only. Copies have been all over the Gresik docks."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_choice]
title = "Growers First"
text = "Ten copies lie on the long table behind the lecture hall. Wati and Nyai Gama sat up three nights with the interpreter from the docks, putting the contract into Malay line by line, the Portuguese clauses too, and writing it out ten times—the round hand is Wati’s, the square one Nyai Gama’s. But the academy won’t let students go to sea. Wati gathers all ten to her side. “Banda first. The growers still don’t know what the end of it says.” Nyai Gama reaches over and slides four away. “First, Banda gets copies. Second, so does Banten. If Banda won’t sign, that man’s next stop is Banten.” For the first time the two of them stand behind the same table, with me on the other side. Wati pushes her six across to me; Nyai Gama squares up her four and sets them on top."
news = "Two girls at the Giri academy in Gresik have copied out ten translations of a contract for the growers of Banda and Banten—but the academy won’t let them sail."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_choice.default]
news = "The translations two Gresik schoolgirls made went out with the next season’s spice boats and arrived two months late. Half the headmen on Banda had already put their thumbprints down."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_choice.choices.to_growers]
text = "I know two fast boats leaving at dawn. Six for Banda, four for Banten—we load them tonight."
reply = "Both boats were out before first light. A month later word came back with the crews: the copies reached Banda ten days ahead of the Malacca merchant, and the Lonthor headmen had the last clauses read out to them twice, then nailed the merchant’s contract to the oldest nutmeg tree at the edge of the village. Nyai Gama added a line to her ledger: “Banten, four copies, delivered.” Wati heard it all and asked one thing. “How high up the tree?”"
news = "The headmen of Lonthor on Banda nailed a Malacca merchant’s contract to a nutmeg tree, they say—a translation from Gresik got there ten days ahead of him."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_choice.choices.pantun_warning]
text = "Hardly any of the headmen can read. Write a pantun together and send it with the copies."
reply = "Wati wanted all four lines for herself; Nyai Gama wouldn’t hear of it. They argued in the lecture hall until the lamp ran dry and settled on two lines each: “Nutmeg hangs heavy on Lonthor’s trees, the tide at Neira is slow to fall; the last few lines are a foreign tongue—have them read before you sign at all.” The islands are Wati’s; the sting is Nyai Gama’s. The copies went with the next boat, and the pantun traveled farther than they did. It was still being sung on the Banda docks years later."
news = "There’s a new pantun going around the Banda docks telling the nutmeg growers to have the foreign clauses read out before they sign. Two schoolgirls in Gresik wrote it, apparently."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_landing]
title = "Answering Back Across the Water"
text = "Their years at Giri are over. Wati is going home to Banda, Nyai Gama to Banten. Their two boats cast off from Gresik together—one running east before the west wind, the other beating west along the shore against it—and the water between them widens a little at a time. Nyai Gama sings first, her ledger rolled into a speaking trumpet, and her opening half goes after the price of Banda nutmeg: “Smoke off the fire-mountain drifts to the east, Banda nutmeg costs more than gold—” Wati stands at the stern, lets her finish, and answers at her own pace, going after the Banten pepper scale: “Banten files her weights down neat, a pound of pepper weighs half what you’re…” The wind takes the last word, and the boatmen on the dock crane their necks and still miss it. “Which day do you make port next time?” Nyai Gama shouts across the water. “Let the growers say!”"
news = "Two boats cast off from Gresik together, one for Banda and one for Banten, and the girls aboard traded insults in pantun across the water until the wind took the last line."

[tracks.tie_wati_nyai.chapters.tie_wati_nyai_landing.default]
