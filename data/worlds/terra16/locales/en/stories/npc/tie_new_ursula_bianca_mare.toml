# 账还没结（tie_new_ursula_bianca_mare）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段。
# C7 新线，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Ursula、Bianca Mare、Antwerp、Genoa、Brussels、Madrid、Augsburg、Nuremberg、Fugger、stuiver。
# 两人的口头禅照人物英文覆盖层：Ursula “I haven’t lost. The books aren’t closed.”；Bianca “Please, sit. Is the lamp bright enough? … Before you sign, take your time and work out whom you already owe.”

[tracks.tie_new_ursula_bianca_mare]
name = "The Books Aren’t Closed"

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_meeting]
title = "After the Lamps Are Lit"
text = "Since the Spanish crown stopped paying, everyone on the Antwerp Exchange has been in a hurry to get royal bills off their hands. The Fugger agent has hurried off to Brussels to see the king’s treasury men, and the one minding his books at home is his seventeen-year-old daughter, Ursula. After dark there is a knock. A Genoese widow in black comes in and lights the lamp on the desk herself, as if the house were hers. “Please, sit. Is the lamp bright enough?” She wants the stack of bills in the drawer, at forty in the hundred. Ursula stays on her feet. She lays her Nuremberg counters out on the desk, sweeps them together, lays them out again—three times in all—then locks the bills back in the drawer. “Not at that price. I haven’t lost. The books aren’t closed.” The widow doesn’t haggle. She tucks a slip of paper under the base of the lamp, with “Bianca Mare” and a street in Genoa written on it. “There’s no hurry here.”"
news = "After the Spanish crown stopped paying, a Genoese widow came calling in Antwerp after dark to buy up royal bills at forty in the hundred. The Fugger agent’s seventeen-year-old girl sent her away."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_closer]
title = "Her Own Name on the Door"
text = "The new sign over the door is freshly painted with Ursula’s own name, and the word Fugger appears nowhere on it. On opening day everyone who walks in has come to gawk; nobody deposits a coin. After dark, the lamp is already lit when Bianca pushes the door open and sets a purse on the desk. “No need to count it.” Ursula unties it and tips the coins out beside the scales, weighing and counting them one by one; when she finishes, she does it all again. Not a stuiver out. “You don’t trust me?” “I trust the scales.” Bianca laughs aloud; Ursula has never heard her laugh before. Those bills five years ago, she says, fell below her price the very next year. Ursula lets that pass and puts the weights back in their box. Bianca glances at the sign on the door. “This house will last three years.” Ursula enters the purse on the first line of the first page. “In three years, come and check the books.”"
news = "A counting house with a woman’s name over the door has opened in Antwerp. Its first depositor was the Genoese widow, who came after dark and had her purse weighed twice in front of her."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_turning]
title = "The Crown Stops Paying Again"
text = "In mid-September the news came from Madrid to the Antwerp Exchange: the king of Spain had stopped paying again. Last time it was the Augsburg houses that took the worst of it; this time, people say, a few of the Genoese will be shutting their doors as well. The counting house with a woman’s name over the door is still open, but there’s a line outside every day, and everyone in it has come to take money out. Ursula stands behind the counter herself, paying them one at a time until dark, and the cash chest under the counter grows lighter by the day. When someone in the line curses her for being slow, she doesn’t even look up: “Stay in line. Anyone I don’t reach today is first tomorrow.” There’s also a broker with a Genoese accent going around the Exchange, asking everyone how many more days of withdrawals that house can cover. Ask him who wants to know, and he softens his voice the way his employer does: “The lady only wonders how many more nights that lamp of hers can stay lit.”"
news = "The king of Spain has stopped paying again. In Antwerp, the counting house with a woman’s name over the door has a line of people outside, all taking their money out, and the owner works the counter herself till dark."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_choice]
title = "An Offer for the Ledgers"
text = "After dark, Bianca comes again. Only one lamp is burning in the counting house, and she spreads a contract beneath it: all of Ursula’s ledgers—the loans out, the deposits in, the name of every client—to be bought in a single lot. The price is fair, higher than anyone on the Exchange would pay. Ursula sets out her counters beside the contract, then looks up. “That’s a tenth more than I’d have put on it myself.” Bianca lays the pen across the contract. “Before you sign, take your time and work out whom you already owe.” The counters slide across, slide back, and click against the wood: Ursula’s hands are shaking. She isn’t looking at Bianca. She’s looking at me."
news = "Word is out on the Antwerp Exchange: that Genoese widow wants to buy Ursula’s ledgers—the loans, the deposits, and every client’s name with them."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_choice.default]
news = "The Antwerp counting house with the woman’s name didn’t sell its ledgers to the Genoese. The owner sold the house she lived in instead and moved the business into a little room upstairs."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_choice.choices.bridge_loan]
text = "Pledge my own cargo and raise her some ready money elsewhere."
reply = "Bianca hears me out, folds the contract away, and turns the lamp wick down a little before she leaves. I pledge my cargo bill to a money changer at the far end of the Exchange, and at noon the next day the cash is carried into the counting house in two chests. The people in line are paid; a few of them linger, then hand the money back in, and the rest drift away. Ursula goes through my cargo bill three times. “You valued your goods too high. At today’s prices, by more than a tenth. Next time you pledge anything, ask me first.” She hands the bill back and adds a line to her ledger, with my name on it. “This one goes in my books.”"
news = "Two chests of cash were carried into Ursula’s counting house in Antwerp, and the line outside was paid off and gone. They say some captain pledged an entire cargo to raise it."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_choice.choices.read_terms]
text = "Read the whole contract aloud for her, down to the last clause."
reply = "I start at the first clause and read through to the last, and there I pause. It says that every name in the ledgers will, from now on, be “looked after” by the buyer. Ursula’s counters fall silent. She pushes the contract back across the desk. “My people aren’t for sale.” Bianca doesn’t argue. She folds the contract in half, then in half again, and slides it into her sleeve. “That is the line I came to hear.” After she leaves, Ursula’s lamp burns all night. The next morning she puts her own house up for sale."
news = "At that Antwerp counting house with the woman’s name, the owner pushed the Genoese widow’s contract for the ledgers straight back across the desk and said just one thing: “My people aren’t for sale.”"

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_landing]
title = "The Books Aren’t Closed"
text = "Since last November, half the names in Antwerp’s ledgers have never come in to settle. Ursula’s counting house is still open, moved upstairs now and half the size it was. After the lamps are lit, the stairs creak. Bianca has brought no contract this time, only a flask of Genoese wine, which she sets down among the counters. “You still owe me a reason for turning me down.” Ursula sweeps the counters to one side, pours two cups and pushes one across. “I haven’t lost. The books aren’t closed.” Bianca raises her cup; the lamplight trembles on the wine. “Then don’t close them.”"
news = "After the lamps were lit, that Genoese widow called again at Ursula’s counting house in Antwerp. No contract this time: she brought a flask of wine, and the two of them drank until midnight."

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_landing.default]
