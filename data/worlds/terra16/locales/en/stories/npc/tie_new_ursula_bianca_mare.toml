[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_landing.variants.helped]
text = "Since last November, half the names in Antwerp’s ledgers have never come in to settle. Ursula’s counting house is still where it was, under the same sign it opened with. After the lamps are lit, someone knocks. Bianca has brought no contract this time, only a flask of Genoese wine, which she sets down among the counters. “I hear someone pledged a whole cargo for you. You still owe me a reason for turning me down, and the cargo doesn’t count.” Ursula sweeps the counters to one side, pours two cups and pushes one across. “I haven’t lost. The books aren’t closed.” Bianca raises her cup; the lamplight trembles on the wine. “Then don’t close them.”"

[tracks.tie_new_ursula_bianca_mare.chapters.tie_new_ursula_bianca_mare_landing.variants.refused]
text = "Since last November, half the names in Antwerp’s ledgers have never come in to settle. Ursula’s counting house is still open, moved upstairs now and half the size it was. After the lamps are lit, the stairs creak. Bianca has brought no contract this time, only a flask of Genoese wine, which she sets down among the counters. “Last year you told me your people weren’t for sale. This year half the names in your books are gone.” Ursula sweeps the counters to one side, pours two cups and pushes one across. “I haven’t lost. The books aren’t closed.” Bianca raises her cup; the lamplight trembles on the wine. “Then don’t close them.”"
