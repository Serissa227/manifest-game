# C7 英文覆盖：省下来的好木料（哈桑 × 塞利姆·凯雷斯特，师徒）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应。

[tracks.tie_extra_07_hasan_selim_kereste]
name = "Good Timber Set Aside"

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_meeting]
title = "Where the Wood Came From"
text = "Hasan came to the timber yard for a bent beam to cut a knee from. The stack-keeper didn’t look up; he pointed at whatever sat on top. Selim, the new apprentice, stepped over with a hand held out in midair, as if afraid of hurting someone. “Brother, not that one. It came off the shady side of the İzmit hills. It dries slow. Use it now and it splits by next year.” He crouched, dragged another out from the bottom of the stack and ran his thumb around the cut end. “This one’s from the Black Sea coast. Seasoned three winters.” Hasan took it and rapped it twice with the back of his hatchet, head tilted, listening. He didn’t praise it. “Fold a drawing if you like. Never a keel.” He swung the beam onto his shoulder. “Come to the slipway tomorrow.” Selim shoved the shady-side beam back on top of the stack and pulled two layers of sacking over it. By the time he turned to answer, Hasan was already halfway down the row."
news = "They say an apprentice in the Golden Horn arsenal’s timber yard remembers which mountain every bent beam was felled on, and the shipwright Hasan has taken him onto the slipway."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_closer]
title = "Reading the Grain"
text = "A length of keel lay propped on the slipway, and Hasan ran a charcoal line along the grain of the joint. “Grain follows the load. Cut against it and the plane tears.” Selim cut the joint once. It tore, and he took it apart. He cut it again. It tore again. “Master,” he said quietly, “is the plane dull?” Hasan didn’t look up. “The plane’s fine. Look at the grain.” The third try tore as well, and Hasan gave it one glance. “The wood’s wincing for you.” Selim took the third joint apart, and the fourth time the shavings curled off so thin you could see light through them. Hasan drew his thumb across the seam and felt no gap. “Cut another.” At the end of the day Selim picked up the shavings and the sawn-off ends and dropped them one by one into a sack. Hasan saw it from the far end of the slipway, turned, and went to put away his hatchet. He asked nothing."
news = "On the slipway at the Golden Horn, the shipwright Hasan made a timber-yard apprentice take the same keel joint apart three times before he nodded at the fourth."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_turning]
title = "News From Djerba"
text = "All summer the taverns along the Golden Horn have talked of nothing but Djerba: Piyale Pasha won a great victory at sea and came into port towing a long string of captured ships. From that day the arsenal has kept its pitch fires burning night and day. Timber runs short, so the overseer sends clerks to count every stick; the yard’s books are checked three times a day, and anyone whose tally doesn’t match the ledger gets the cane. At the coffee stall a shipwright did Hasan’s voice for the others: up on the slipway, he said, Hasan had only one thing to say. “Captured ships—look at the keel first, then the flag.” Over at the timber yard, the clerk called out a stick and Selim answered with where it came from: which mountain, which year it was felled, how many winters it had seasoned. The clerk shut his book. “How do you remember so well?” Selim thought about it. “I’ve touched them. You don’t forget what you’ve touched.” The clerk drew a ring around his name in the ledger and said that boy’s counts needn’t be checked twice."
news = "Piyale Pasha towed a string of captured ships home from Djerba; the Golden Horn arsenal is mending them day and night, counting timber stick by stick, and short tallies get the cane."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_choice]
title = "Timber for a Lifeboat"
text = "I was waiting at the arsenal for timber to refit my ship. Hasan went round to the very back of the timber yard to pick out a knee, and I followed. A sheet of canvas covering something blocked the way; he lifted a corner and stood still. Under it sat a half-finished boat, its planks all different shades, every one a leftover offcut from a warship, the seams so fine you couldn’t slip a fingernail in. Hasan crouched and ran a hand along the keel, and the hand stopped. “That’s the offcut I sawed from the slipway three years ago.” Selim came out from behind the stack with his head down, his voice very low. “If a warship goes over, men need a little boat to climb onto. Go with the grain. Don’t force the split. I couldn’t find the grain on the overseer, so I kept saving. Three years now.” Every stick of it had been counted in the books. Saved up like that, it was theft. Hasan looked a long time and didn’t shout. He turned to me. “Captain, is there a way?”"
news = "The clerks at the Golden Horn arsenal’s timber yard have been counting hard lately, going over the scrap ledger again and again and calling shipwrights and apprentices in for questioning."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_choice.default]
news = "A line in the Golden Horn arsenal’s scrap ledger didn’t add up; the shipwright Hasan owned to it himself and took a public dressing-down from the overseer."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_choice.choices.trial_day]
text = "Ask the overseer to name a day for a public trial and enter the boat as an arsenal sample."
reply = "The overseer heard me out and asked one thing: “If she capsizes, whose fault is it?” I said mine. He set the day for the end of the month, in the Golden Horn, before the whole arsenal. Twelve shipwrights crowded into the little boat until her gunwale stood a hand’s width above the water, and not one of them fell in. The overseer asked whose idea it had been. Hasan said the apprentice’s; Selim said the master’s. The overseer laughed out loud and wrote in his book: “One sample boat, for the arsenal.”"
news = "At the Golden Horn arsenal a little boat was put to the test: twelve shipwrights climbed aboard and she stayed afloat, and the overseer wrote her down as “one sample boat, for the arsenal.”"

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_choice.choices.cover_ledger]
text = "Help Hasan enter the timber in the scrap ledger, every line seamless."
reply = "That night the three of us sat over one oil lamp. Selim named each piece in turn—which mountain, which year it was felled, even which end had the wormhole—and Hasan and I entered it in the scrap ledger line by line until the ink dried. Next day the clerk counted the stock and the numbers matched. Nobody asked a thing. Selim said quietly that he owed his master one. Hasan shut the book. “A keel can’t be bent. This time it was the books that bent. Never again.”"

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_landing]
title = "The First Lifeboat"
text = "The little boat slid off the landing stage and made a slow circle in the Golden Horn, sitting steady. On her stern was cut a small oak leaf, Selim’s mark, and beside it one straight line scored with the corner of Hasan’s axe blade. The stack-keeper had come down with the others to watch, arms folded, for once saying nothing. Hasan stood at the water’s edge with his hands behind his back. “Fold a drawing if you like. Never a keel—and this boat’s keel is yours.” Selim opened his mouth, and what he meant to say stuck in his throat. All that came out was, “…The grain runs true.” He crouched and ran his hand along the gunwale, following the grain, and only then noticed his palm was slick with sweat."
news = "A small lifeboat went into the Golden Horn; the apprentice Selim’s oak-leaf mark is cut on her stern, with another line beside it that the shipwright Hasan cut."

