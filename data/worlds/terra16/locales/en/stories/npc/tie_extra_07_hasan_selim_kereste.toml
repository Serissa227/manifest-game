[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_landing.variants.v1_helped]
text = "The little boat slid off the landing stage and made a slow circle in the Golden Horn, sitting steady. The overseer watched from the quay, then told the whole landing stage that the arsenal would order three more, and from now on every warship would carry one. On her stern was cut a small oak leaf, Selim’s mark, and beside it one straight line scored with the corner of Hasan’s axe blade. Hasan stood with his hands behind his back. “Fold a drawing if you like. Never a keel—and this boat’s keel is yours.” Selim opened his mouth, and what he meant to say stuck in his throat. All that came out was, “…The grain runs true.” He crouched and ran his hand along the gunwale, following the grain, and only then noticed his palm was slick with sweat."

[tracks.tie_extra_07_hasan_selim_kereste.chapters.tie_extra_07_hasan_selim_kereste_landing.variants.v2_covered]
text = "The little boat slid off the landing stage and made a slow circle in the Golden Horn, sitting steady. At the far end of the stage a clerk was thumbing through the scrap ledger; he reached those pages, looked up at the boat in the water, and turned the page. On her stern was cut a small oak leaf, Selim’s mark, and beside it one straight line scored with the corner of Hasan’s axe blade. Hasan stood with his hands behind his back. “Fold a drawing if you like. Never a keel—and this boat’s keel is yours.” Selim opened his mouth, and what he meant to say stuck in his throat. All that came out was, “…The grain runs true.” He crouched and ran his hand along the gunwale, following the grain, and only then noticed his palm was slick with sweat."
