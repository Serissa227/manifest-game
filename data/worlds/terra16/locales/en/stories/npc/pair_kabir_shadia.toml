[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_together.variants.helped]
text = "The southwest monsoon was nearly on them, and Kabir would leave for Cambay in the morning. On the last night Shadia rowed him out of the harbor, shipped the oars, and lay down beside him on the bottom boards. Near the Pole Star two small stars circled slowly, keeping watch over it. “You Arabs call them the Two Calves,” Kabir said. “Old pilots in Cambay call them the poleguards.” “The calves never slack, not for a single turn around the Pole,” said Shadia. “And you?” “Last year, two boats exactly alike, and I lost by half a hull. Nothing to say about that.” He kept his eyes on the sky. “I give up this time too. The wind didn’t move.” Shadia turned her head. “Every year before the monsoon, I’ll be waiting in Muscat for a race,” she said. “And when it’s done, we watch them together.” Then she kissed him. Water slapped softly against the planks beneath them."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_together.variants.matched]
text = "The southwest monsoon was nearly on them, and Kabir would leave for Cambay in the morning. On the last night Shadia rowed him out of the harbor, shipped the oars, and lay down beside him on the bottom boards, drifting over the same water as last year. “Last year you called out their heights and I said I already knew them,” said Shadia. “I didn’t remember all of it. Tell me again?” Kabir pointed at the two small stars by the Pole Star and gave the numbers without a slip. “You call them the Two Calves. Old pilots in Cambay call them the poleguards. I give up this time.” “Give up what?” “The wind didn’t move and the boat didn’t drift. I just give up.” Shadia turned her head. “Every year before the monsoon, I’ll be waiting in Muscat for a race,” she said. “And when it’s done, we watch them together.” Then she kissed him."

[tracks.pair_kabir_shadia_side]
name = "Fair Rivals"

[tracks.pair_kabir_shadia_side.chapters.pair_kabir_shadia_side_landing]
title = "Fair Rivals"
text = "With the southwest monsoon coming, Kabir was about to go home to Cambay. Before he left they raced once more, and this time he won. He stood waist-deep in the water for a long while, unable to speak. Shadia waded over and pushed her own oar into his arms, five years of use worn into a hollow in the handle. “Use this next year. And if you win, don’t you dare say it was the oar.” “I won,” said Kabir, then stopped short. “I really won. And there’s no wind to blame.” “The wind didn’t play favorites today. I’ll give you that.” Shadia laughed and clapped him on the shoulder. “Next year I win it back, and you can make something up.”"
news = "The pilot from Cambay finally won a race at Muscat, and the racing girl gave him her own oar. They’ve agreed to meet again next year."

[tracks.pair_kabir_shadia_side.chapters.pair_kabir_shadia_side_landing.default]
