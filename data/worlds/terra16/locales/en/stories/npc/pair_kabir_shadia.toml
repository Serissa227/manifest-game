# 输家与好桨（pair_kabir_shadia）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_kabir_shadia]
name = "No Race This Time"

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_meeting]
title = "Two Sore Losers"
text = "The school ship lay in Muscat, and everyone who had watched the races had gone home. Kabir, a young pilot from Cambay, sat on an upturned hull wetting a finger to test the wind, over and over. Shadia came down the sand carrying two oars, one cracked and one the last good oar of the season. She had lost three races herself, all to the same boat with the blue-edged sail that had beaten him. She knew the look at a glance: salt all over him and a face that refused to take it. She dropped the good oar into his arms and kept the cracked one. “One more run. Dare you?” Kabir closed his scraped palm around the oar and winced, but his mouth never paused. “Cambay pilots don’t lose three times. The wind shifted, that’s all.” Shadia sat down hard in the sand, laughing too much to hold on to her broken oar."
news = "On the racing beach at Muscat, two young sailors who had each lost three times were seen sharing an oar. One handed it over and the other kept talking, and the one who handed it over ended up laughing in the sand."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_closer]
title = "Charts Without Names"
text = "They bet on whose star chart was more accurate. Each drew one, signed nothing, and left it at the chart table to be shuffled in with the rest. The day the charts came back, Shadia pulled one from the pile and laughed. “Two little stars by the Pole, inked three times over. Who else is afraid they’ll run off?” The chart Kabir had pulled out had a crooked little boat in the corner, sitting on top of a shoal he had drawn wrong. “Covering a mistake that grandly. Nobody but you. And you inked those two little stars no more lightly than I did.” He took up a pen and added a second boat beside hers, even more crooked. Shadia studied it a long while, then pushed the stake, a bag of dates, across the table. “You can have them back. We’ll bet again.” Kabir pushed it back to her. “Next time, you set the question.” Both their ears had gone red. One stared at the wall, the other at the floor."
news = "Aboard the school ship moored at Muscat, somebody bet on two unsigned star charts. The two who drew them knew each other’s at a glance, so the stake went back where it came from."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_turning]
title = "The Water Nobody Sold"
text = "The only talk on the quay these days is that the Rumis, the Ottomans, have marched out of al-Hasa to besiege Bahrain, and everybody in the harbor is on edge. Two days ago a ship full of Rumi soldiers tied up at the jetty and asked to buy fresh water, paying well. The racing girl stood at the well and would not let them draw a single bucket. Those who heard her say she told them: “Seven years ago your guns burned my family’s house. There is water in this well, and I would sooner give it to a dog than to you.” A young pilot from Cambay was standing beside her, a kamal tucked under his arm. He said nothing, and he didn’t leave. The ship hung about at the jetty until evening and then sailed off with its buckets empty."
news = "The Rumis have gone to besiege Bahrain. A soldiers’ ship came into Muscat for water, and they say the racing girl was first to refuse, with a pilot from Cambay standing at her side."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_choice]
title = "Before the Monsoon"
text = "The northeast wind was about to rise, and one boat after another on the beach was rushing to load. Kabir scratched a line in the sand and laid his father’s kamal across it. “One more race before we sail. I’m staking this.” Shadia didn’t look at the kamal. She stared at her toes. “Not this time. Can we skip it?” Kabir stood there stunned, then turned to me. “Did you hear that? She’s afraid to lose.” “I’ve beaten you a dozen times. What would I be afraid of?” Shadia finally looked up, not smiling. “Leave this one alone.” The two of them turned to me together."
news = "The northeast monsoon is nearly here. On the beach at Muscat, the pilot from Cambay staked his kamal on one more race, and the racing girl asked if they could skip it."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_choice.default]
news = "Before the monsoon, the pilot from Cambay lost another race on the beach at Muscat and blamed the wind again as he came ashore. The racing girl told him, next year."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_choice.choices.fair_race]
text = "Set up a fair race: same boats, same wind, and I’ll be the judge"
reply = "I borrowed two identical little lateen boats from the harbor, drew lots for the sides, and stood at the flagpole on the jetty to call the start. Only one gust came, and both sails caught it. Shadia won by half a hull. Kabir came ashore, opened his mouth, and left the wind out of it. All he said was, “Next year.” Shadia picked the kamal up out of the sand, blew it clean, and put it back in his hand."
news = "At Muscat’s race before the monsoon, two boats alike in every way caught the same gust. The racing girl won by half a hull, and the pilot from Cambay came ashore without a word about the wind."
effects = [{}, {}, {}, { title = "Two Boats Exactly Alike" }]

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_choice.choices.no_race]
text = "Talk them out of racing and take them out to look at the stars"
reply = "I rowed my skiff out and towed their two boats out of the harbor, one behind the other, then cast off the line past the shoals. Nobody touched an oar that night, and the boats drifted side by side on the tide. Kabir showed her the two dim little stars beside the Pole and called out their heights all the way down, never off by more than a finger. Shadia said, “I already know this.” When he finished, she said, “Give me the heights again.”"
news = "The race that was promised at Muscat before the monsoon never came off. Two little boats drifted outside the harbor all night with their oars shipped, and came back at dawn."
effects = [{}, {}, {}, { title = "Two Boats Drifting Side by Side" }]

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_choice.choices.watch]
text = "Stay out of it and watch from the shore"
reply = "I sat on the jetty and said nothing. They talked for about as long as it takes to drink a cup of tea, could not agree, and raced anyway. Kabir lost again and came ashore with a complaint about the wind, as always. This time Shadia didn’t laugh at him. She crouched down and furled his sail, faster than he could have done it himself."
news = "At Muscat’s race before the monsoon, the pilot from Cambay lost again and blamed the wind as he stepped ashore. The racing girl knelt and furled his sail for him."

[tracks.pair_kabir_shadia.chapters.pair_kabir_shadia_together]
title = "The Two Calves"
text = "The southwest monsoon was nearly on them, and Kabir would leave for Cambay in the morning. On the last night Shadia rowed him out of the harbor, shipped the oars, and lay down beside him on the bottom boards. Near the Pole Star two small stars circled slowly, keeping watch over it. “You Arabs call them the Two Calves,” Kabir said. “Old pilots in Cambay call them the poleguards.” “The calves never slack, not for a single turn around the Pole,” said Shadia. “You, though, lose a race and blame the wind.” “I give up this time.” He kept his eyes on the sky. “The wind didn’t move.” Shadia turned her head. “Every year before the monsoon, I’ll be waiting in Muscat for a race,” she said. “And when it’s done, we watch them together.” Then she kissed him. Water slapped softly against the planks beneath them."
news = "A small boat drifted outside Muscat harbor all night. They say the racing girl and the pilot from Cambay were aboard, watching the stars in the north."

