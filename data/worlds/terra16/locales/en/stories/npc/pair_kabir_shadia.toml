[tracks.pair_kabir_shadia_side.chapters.pair_kabir_shadia_side_landing.variants.helped]
text = "With the southwest monsoon coming, Kabir was about to go home to Cambay. Before he left they raced once more, in boats exactly alike, and this time he won by half a hull. He stood waist-deep in the water for a long while, unable to speak. Shadia waded over and pushed her own oar into his arms, five years of use worn into a hollow in the handle. “Use this next year. And if you win, don’t you dare say it was the oar.” “Last year I lost to you by half a hull,” said Kabir. “This year I beat you by half a hull. I really won, and there’s no wind to blame.” “Then we’re even,” said Shadia, laughing, and clapped him on the shoulder. “Next year I win it back, and you can make something up.”"

[tracks.pair_kabir_shadia_side.chapters.pair_kabir_shadia_side_landing.variants.matched]
text = "With the southwest monsoon coming, Kabir was about to go home to Cambay. Before he left they raced once more, and this time he won. He stood waist-deep in the water for a long while, unable to speak. Shadia waded over and pushed her own oar into his arms, five years of use worn into a hollow in the handle. “Use this next year. And if you win, don’t you dare say it was the oar.” “I won,” said Kabir, then stopped short. “I really won. And there’s no wind to blame.” “I still remember the star heights you called out that night,” said Shadia. “If you lose next year, I’ll recite them back to you anyway.”"
