[tracks.tie_extra_08_gu_zhao_genroku]
name = "Whose Bad Temper"

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_meeting]
title = "The Tea He Wouldn’t Drink"
text = "In a warehouse by the Hirado shore, twenty Tanegashima matchlocks lay on straw, their barrels wiped with oil. Gu Zhao, a company commander with the Ming mission, crouched and counted them one by one. Genroku of Sakai stood by with a tea tray, grinning like a man who has just pocketed a deposit. “You’ve come a long way, sir. Have some tea. I didn’t dare make it strong for a first meeting. I was afraid it would choke you.” Gu Zhao glanced at the bowl. “Weak.” He didn’t touch it. “Brother, who is the buyer? When was the silver paid? What fineness? Which ship unloaded these guns?” “Your questions are too salty, sir. They want a splash of tea.” Gu Zhao ignored him and took the manifest. In the buyer’s column was a name from Wang Zhi’s fleet, with a red seal pressed beneath it. Gu Zhao rubbed the seal with his thumb. The ink was dry through. They stood and went through the list to the last line, and the two straw cushions on the floor stayed empty. Gu Zhao slapped the paper down on the table. “The seal is genuine. The man has to come back alive too.” “Goods can be late. People mustn’t break their word,” said Genroku, and carried away the bowl nobody had touched."
news = "In a warehouse on the Hirado shore, a Ming officer and a merchant from Sakai stood over a twenty-gun manifest all afternoon, and a bowl of tea went cold untouched."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_turning]
title = "Boatmen Aren’t Collateral"
text = "Word has gone round the quay that the manifest for those twenty guns has a line of small print on the back: if the buyer can’t pay, twelve boatmen from his ship go in pledge for the debt, Chinese and Japanese alike. The ferrymen say that when Gu Zhao read that line he wanted to make arrests then and there. “Twelve men who ran guns for bandits. Not one stays behind. I’ll take the lot.” The fishmonger says Genroku of Sakai smiled, shut the warehouse door, and answered through the planks: “Sir, the buyer signed that paper. The twelve were only written into it. Not one of them ever signed.” Some say he was guarding the men, others that he was guarding his collateral. Either way, that night one man stood inside the door and one outside, and they shouted through the boards until both were hoarse."
news = "The manifest for twenty guns at Hirado has twelve boatmen pledged against the debt on its back. The Ming officer wants them arrested, and the Sakai merchant has shut his warehouse door."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_choice]
title = "Two Accounts"
text = "The mission had settled on sailing home at the start of spring. In the warehouse Gu Zhao spread out his report; across from him Genroku opened his house’s ledger. The same twenty guns, two wordings: the report said “seized,” the ledger said “held on deposit.” “You write what you saw, I’ll write what I saw,” said Genroku, dipping his brush. “Neither of us touches the other’s words.” Gu Zhao nodded stiffly and jabbed a finger at the ledger. “Twelve names, and you left out a line. Sign beside what you overlooked, too.” “You were quick to write ‘bandits’ in that report of yours.” The two sheets were pushed across the table, left and right, toward me."
news = "The mission has settled on sailing home in spring. In a Hirado warehouse the Ming officer and the Sakai merchant are writing statements, and each has to sign the other’s."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_choice.default]
news = "In a Hirado warehouse the Ming officer and the Sakai merchant signed each other’s statements, very much against their will, and half of the twelve boatmen were let go."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_choice.choices.both_testimonies]
text = "Change nothing in either: the report to the mission, the ledger to Sakai’s council of merchants."
reply = "“As written. Not a word changed,” I said. Gu Zhao watched me roll up the report and grunted. Genroku winced at the word “bandits” in it, then signed it anyway. The report went into the mission’s baggage; I took the ledger to Sakai and put it in the council’s hands. Later the buyer turned and denied the debt; both sides laid the two sheets on the table, and he couldn’t even say they had been written wrong."
news = "In Hirado someone sent off a Ming officer’s report and a Sakai merchant’s ledger without changing a word: the report into the mission’s baggage, the ledger to the merchants’ council in Sakai."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_choice.choices.free_boatmen]
text = "Pay the twelve boatmen’s debt out of my own cargo."
reply = "I had crates carried over from my ship and counted them out at the warehouse door. Genroku took up his brush and struck the twelve names off one by one. At the last name the door at the back of the warehouse opened, and the twelve filed out with their heads down. Genroku shut the ledger. “This goes on a fresh page. I don’t mix it with the black ship’s accounts.” Gu Zhao scowled. “This is against the rules.” “Rules don’t reach the captain’s cargo,” said Genroku, quick as a flash. Gu Zhao snorted, and the corner of his mouth twitched; Genroku burst out laughing. Each caught the other’s grin, and both put on straight faces at once."
news = "A ship’s captain at Hirado paid off twelve boatmen’s debt with his own cargo. The Sakai merchant struck the twelve names from his book, and the Ming officer muttered that it was against the rules."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_landing]
title = "A Rival You Can Trust"
text = "The mission’s ship was about to sail. Genroku had been waiting on the Hirado quay since dawn with an iron kettle in one hand and two tea bowls in the other. When Gu Zhao came up, he poured a bowl and held it out. Gu Zhao looked down at it. “Weak.” “Next time you come, I’ll make it strong.” “Next time I come, I’ll still be checking your cargo.” Gu Zhao stepped onto the gangplank, got halfway, and turned back. “If another manifest ever pledges boatmen for debt, I’ll come to you first.” “That sounds like a debt collector,” said Genroku, bowl still raised, nodding with a smile. “I’ll take it.” When the ship had cleared the quay he drank the weak tea down in one go and screwed up his face. “…It really is weak.”"
news = "The day the Ming mission left Hirado, a Sakai merchant came down to the quay with a kettle of tea. The officer said it was weak as ever, and threw a parting threat over his shoulder."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_landing.default]
effects = [{}, {}, { title = "A Rival You Can Trust" }]

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_landing.variants.freed]
text = "The mission’s ship was about to sail. A line of people had gathered on the quay: the twelve boatmen, Chinese and Japanese, still in their old clothes. Gu Zhao did not look at them once. Genroku came with the iron kettle and an armful of bowls, calling the names one by one and handing a bowl to each, and only when all twelve had been served did he reach Gu Zhao. “Yours, sir.” “Weak.” “Next time you come, I’ll make it strong.” “Next time I come, I’ll still be checking your cargo. If another manifest pledges boatmen for debt, I’ll come to you first.” The twelve bent their heads over their bowls, and not one of them frowned."

[tracks.tie_extra_08_gu_zhao_genroku.chapters.tie_extra_08_gu_zhao_genroku_landing.variants.helped]
text = "The mission’s ship was about to sail. Genroku had been waiting on the quay since dawn, an iron kettle in one hand and a folded sheet of paper in the other. “The buyer sent his silver yesterday, in front of both statements. Weighed ingot by ingot, not a coin short.” “And the fineness?” asked Gu Zhao. “Tested. Full grade.” Gu Zhao took the bowl, drained it, and frowned. “Weak.” “You drank it?” “I was thirsty.” “Next time you come, I’ll make it strong.” “Next time I come, I’ll still be checking your cargo. If another manifest pledges boatmen for debt, I’ll come to you first.” He stepped onto the gangplank and did not look back."
