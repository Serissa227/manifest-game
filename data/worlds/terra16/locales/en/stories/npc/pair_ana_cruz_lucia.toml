# C7：pair_ana_cruz_lucia 的英文显示覆盖（嵌套表写法，按轨道、章节、选项、变体 key 对应；不含玩法字段）。

[tracks.pair_ana_cruz_lucia]
name = "A Hummingbird on the Flyleaf"

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_meeting]
title = "Turn It Around"
text = "Ocharte’s press was printing a prayer book with a small panel of featherwork set into the cover, and the pattern had gone to Ana’s workshop. The woman who came to collect the sample was a compositor, her apron speckled with ink, and she held the sample up the moment she walked in. “Wrong color. Too blue. The priest wants green.” Ana kept working. “Don’t stand there, you’re blocking the light.” She took the sample and turned it toward the window, and the blue sank into green, like a pool that had suddenly grown deep. Lucia shut her mouth. After a while she fished a piece of type out of her apron pocket and set it on the bench. “Then you turn this one around.” Ana turned it left and right, held it to the window and turned it again, and still couldn’t make the backward letter on its face come out right. “L. L for Lucia. It’s cut backward—turn it till dark and it won’t come right. It’s not one of your feathers.” Ana dropped the type into her own pocket. “I’ll keep this. The sample’s still full price.” She laughed first, and Lucia laughed with her. Two apprentices poked their heads out of the back room: someone had stumped their master, and she was laughing."
news = "A compositor came to the Mexico City feather workshop for a sample and stumped the painter with a single piece of type. The two of them laughed over it for ages; the apprentices say they’d never seen their master laugh."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_closer]
title = "Reading by Touch"
text = "On Sundays the workshop was shut, and in the back room the two of them took turns being the teacher. Lucia tipped a handful of type into Ana’s palm. “Close your eyes. Feel for the nick on the side. Nick facing out, the letter’s the right way up.” Ana got four wrong, got the fifth right, and was so pleased with herself she opened her eyes. Then it was Ana’s turn. She tucked a hummingbird’s breast feather into the window frame and told Lucia to look at it in the morning, at noon, and by candlelight. Lucia learned fast and didn’t spare her tongue. “You people have more names for green than there are greens.” Ana pulled the door to and said one word, low: huitzitzilin. Her grandparents used to say that those who fell in battle came back after four years as hummingbirds, to drink from the flowers. She had never told that to a friar. The next Sunday Lucia brought a paper packet, and inside was that word, set in a line of type. Ana ran her fingers along it with her eyes shut, one letter at a time, and stopped at the fourth. “This one’s upside down.” Lucia snatched it back to look and went red to the ears. The next day the line sat on the windowsill, and Ana wouldn’t let her fix the turned letter."
news = "That compositor from the Mexico City press spends her Sundays at the feather workshop these days, learning to see the colors in feathers, they say. She comes back muttering Nahuatl over the type cases."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_together]
title = "The Curfew Nights"
text = "In August the two Ávila brothers lost their heads in the main plaza. After that the city shut down at dusk, and the night watch went door to door hunting conspirators. Lucia finished setting a proclamation, stepped out, and found a rope already across the end of the street, so she turned back to the workshop’s back room. The candle was half burned when she spoke. “Once there was a sentence on a proof that scared me more every time I read it. I didn’t tell anyone. That night I pulled the line and filled the gap with other type. It went out like that, and nobody noticed.” “What did it say?” “I forget.” “You don’t forget things.” Lucia said nothing. Her fingers moved over the tabletop, again and again, as if feeling for type that wasn’t there. Ana didn’t try to comfort her. “When I lay the Virgin’s robe, I lay my grandparents’ meanings in with it. The friars call it beautiful, and I let them.” She pushed the candle into the space between them. “We’ve both taken things and told no one.” The knocking reached the house next door. Lucia reached over, picked a wisp of down from beside Ana’s ear, and kissed her. The knocking went on from door to door and never stopped at the workshop. In the morning, when the apprentices asked, Ana said only, “Curfew.”"
news = "All through the curfew nights in Mexico City, the press’s compositor never went home. Word is she stayed at the feather workshop, and the moment the curfew lifted she ran back to set type."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_turning]
title = "The Press Stands Still"
text = "New Spain has its Inquisition now, and among the first taken was the printer Ocharte. People say a prayer book he printed had a sentence in it that shouldn’t have been there. A seal went up on the print shop door, and half a month later it came down again. The neighbors say the printer’s wife is keeping the place going with a few of the men. The press stands idle, the paper is nearly gone, and the only sound inside is type being sorted. That compositor goes in every day and hasn’t missed one. The chandler across the street says she’s grown thin, and the lamp in the back window often burns until the cocks crow. In the tavern somebody muttered, “What’s she so scared of? She didn’t write the book.” The man beside him didn’t laugh. “She set it, letter by letter.” Most evenings a woman from the feather workshop comes by with a basket, stands at the door a little while, and leaves without it."
news = "Ocharte’s been taken by the Inquisition, but his print shop in Mexico City is still open. They say his wife and a few of the men are holding it together, and that compositor hasn’t missed a single day."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_choice]
title = "Paper Costs More Than Saints"
text = "There was paper in the shop’s store for one catechism, no more. Spanish paper came up from Veracruz, and a ream cost what a family ate in a month. The shop kept its doors shut by day and ran the press in secret at night, a page at a time. Lucia came to the workshop to borrow money. Ana had no coin on hand, only a feather Virgin just finished, ordered by a man from the viceroy’s household to be shipped back to Spain. “I’ll sell it.” “Don’t you dare.” Lucia laid her hand flat on the frame. “Don’t quietly take out a single letter. Not a single feather, either. You spent half a year on this one.” “I can make another saint. Once the shop shuts, it doesn’t open again.” Lucia with her hand on the frame, Ana already dragging out the sacking to wrap it, they argued until the apprentices hid in the courtyard. When I pushed the door open, both of them turned at once and spoke at once. “You settle it.”"
news = "Ocharte’s press is desperate for paper. Word in Mexico City is that the feather painter means to sell a holy image bound for Spain to buy some."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_choice.default]
news = "That feather Virgin meant for Spain was sold after all, and the money went to Ocharte’s press in Mexico City. The compositor, they say, scolded the painter all afternoon before she took it."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_choice.choices.paper]
text = "I’ll go to Veracruz and bring paper up for the press."
reply = "I got twenty reams off a ship at Veracruz. The mule train took nine days to make the climb, and the oilcloth arrived caked in mud. Lucia let no one else touch it. She held every sheet to the light herself, and when she’d checked the last one she wiped her hands on her apron. “Nothing wrong with it.” Ana murmured beside me, “That’s the only compliment she owns.” The Virgin was crated as planned and went to the viceroy’s household."
effects = [{}, {}, {}, { title = "Twenty Reams" }]
news = "Twenty reams of Spanish paper have reached Ocharte’s press in Mexico City, brought up from Veracruz by mule train, they say. The press is running again."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_choice.choices.buyer]
text = "Find Ana a buyer with a good eye, get her a fair price, and give the money to the press."
reply = "The buyer was a merchant going home to Seville. He turned the Virgin three times in the window light, watching the robe go from blue to green and from green to gold, and paid the asking price without haggling once. Ana pushed the whole purse across to Lucia. Lucia untied it, counted, and pushed half of it back. “The rest buys glue for your apprentices. I only want what the paper costs.” Ana wouldn’t take it. The purse sat between them all afternoon, until an apprentice finally put it away in the cupboard."
effects = [{}, {}, {}, { title = "The Saint Turned Three Times" }]
news = "The feather Virgin from the Mexico City workshop went to a merchant bound for Seville at full price, no haggling, and the money, they say, went to Ocharte’s press."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_choice.choices.tell]
text = "Tell the Inquisition’s notary that the press runs at night."
reply = "The notary took down what I said word for word without looking up. The next night the Inquisition’s men went into the print shop and searched until dawn. Every page of standing type was broken up, and letters lay all over the floor. Lucia was called in for questioning three times. The Virgin never did get sold; Ana sat on the steps outside the Inquisition’s door for three days. Late on the third afternoon Lucia came out, walking as if the ground had gone soft under her. Ana stood, unwound her own shawl, and wrapped it around Lucia’s shoulders."
news = "The Inquisition searched Ocharte’s press in Mexico City all night. Every page of standing type was broken up, and the compositor was called in for questioning three times."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_epilogue]
title = "A Mark in the Corner"
text = "In spring the press brought out another prayer book. In the lower right corner of the flyleaf sat a hummingbird no bigger than a fingernail, wings spread, beak down, as if about to peck at the title. Nobody in town could say who had cut it. Ana knew at a glance: the line of type on the workshop windowsill was one letter short, and the missing one was the letter that had been set upside down. “I thought not a single letter was to come out.” “I took out my own mistake.” Lucia pushed the book across to her. “That doesn’t count.” From then on the two of them ate together every Sunday in the workshop courtyard. Lucia brought a book; Ana chose the brightest hour of the day, sat with her back to the sun, and gave the bright side to the page. Whenever Lucia hit a misprint she read it aloud and ticked the margin with charcoal, and Ana said she proofread even her dinner."
news = "Ocharte’s press in Mexico City is printing again. The new prayer book has a little hummingbird in the corner of the flyleaf, and nobody in town can say who cut it."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_epilogue.variants.helped]
text = "In spring the press brought out another prayer book, printed on the paper that had come up from Veracruz. In the lower right corner of the flyleaf sat a hummingbird no bigger than a fingernail, wings spread, beak down, as if about to peck at the title. Nobody in town could say who had cut it. Ana knew at a glance: the line of type on the workshop windowsill was one letter short, and the missing one was the letter that had been set upside down. “I thought not a single letter was to come out.” “I took out my own mistake.” Lucia pushed the book across to her. “And I picked the paper sheet by sheet. That doesn’t count.” From then on the two of them ate together every Sunday in the workshop courtyard. Lucia brought a book; Ana chose the brightest hour of the day, sat with her back to the sun, and gave the bright side to the page. Whenever Lucia hit a misprint she read it aloud, and Ana said she proofread even her dinner."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_epilogue.variants.sold]
text = "In spring the press brought out another prayer book. In the lower right corner of the flyleaf sat a hummingbird no bigger than a fingernail, wings spread, beak down, as if about to peck at the title. Nobody in town could say who had cut it. Ana knew at a glance: the line of type on the workshop windowsill was one letter short, and the missing one was the letter that had been set upside down. Lucia had cut it from a feather sketch. The apprentices had spent that half purse on glue, and the first pot they boiled went to gluing that very sketch. “I thought not a single letter was to come out.” “I took out my own mistake. That doesn’t count.” From then on the two of them ate together every Sunday in the workshop courtyard. Lucia brought a book; Ana chose the brightest hour of the day, sat with her back to the sun, and gave the bright side to the page."

[tracks.pair_ana_cruz_lucia.chapters.pair_ana_cruz_lucia_apart]
title = "A Winter Without Sundays"
text = "The print shop has stayed shut since the search. The seal on the door has bleached white in the sun and rain, and the neighbors reckon it will stay shut a full year. The compositor lost her work and now copies unloading lists at the canal landing on the east side of the city, two coppers a sheet. The cargo master says she copies faster than anyone but can’t stop correcting: misspell a shipowner’s name by one letter and she strikes it out. The Sunday supper in the feather workshop courtyard stopped for a winter. The neighbors say no fire was lit back there all that time, and the painter sat out in the courtyard alone, sorting feathers. Come spring the chimney smoked again, and there were two bowls on the table as before. Only, ever since, when someone from the viceroy’s household comes to order a holy image, the painter says she doesn’t have the feathers. The Virgin that never sold still hangs on the wall of her back room."
news = "That print shop in Mexico City is still shut after the search. The compositor copies cargo lists at the canal landing, and the Sunday supper in the feather workshop courtyard stopped for a winter, then started again."
