[tracks.pair_lu_guifan_catarina_pereira]
name = "Terms Beyond the Ground Rent"

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_meeting]
title = "Nobody’s Daughter on the Page"
text = "A shipload of pepper has come in at the Macao quay. Lu Guifan spreads out the manifest, brush hovering: “Whose name for the owner?” Captain Pereira is still drawing breath when his daughter gives a name, only her own. The old bookkeeper coughs. The captain’s face darkens, and the Chinese shopkeeper across the table frowns. Catarina ignores both and taps a figure on the scale with her fingernail. “The sacks got damp. Take off fifteen percent, out of my share.” She does the sum faster than the bookkeeper can. Lu has already written half a line, “daughter of Captain Pereira.” “Write the names side by side first,” she says, “then argue about whose family they belong to.” He looks at the half line, crumples the sheet, and takes a fresh one. This time he leaves those words off."
news = "On the Macao quay a Portuguese captain’s daughter had the Chinese interpreter write the manifest in her own name, not her father’s, and the elders on both sides went black in the face."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_closer]
title = "The Softened Sentence"
text = "The Pereiras’ back wall and the neighbor’s fish stall have been shouting at each other half the night, and Lu Guifan is called in to interpret. The stall owner slaps the wall top and barks, “Barbarian devils, and they push their wall onto my land!” Lu turns to the Pereira household. “He says the footing seems to have crossed the line.” Catarina stands behind the door, and she understands a good deal of the language. “He said ‘barbarian devils.’” Lu’s ears go red. “I give both sides exactly as they speak, except this one.” “Why?” “It was aimed at your family.” She lets it drop. At noon the next day she walks into the interpreters’ shed and buys him a bowl of noodles, slapping the coins down first. “Next time, translate the insults too. I’m used to them.”"
news = "In Macao a Chinese interpreter softened an insult while translating between two households, and a Portuguese captain’s daughter caught it on the spot."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_turning]
title = "Five Hundred Taels"
text = "Folks on the quay are all working out the same sum. The five hundred taels of silver the Portuguese pay the Xiangshan county office each year will count as ground rent from now on, they say, and it goes into the county’s own treasury. So whose is the land in Macao, and whose are the houses? Both sides are counting again. At the tea stall there’s a smaller story too: Interpreter Lu, the one who translates for everybody, and Captain Pereira’s daughter want to rent a house of their own, and have had the lease read over by someone who knows. Not one elder on either side has nodded."
news = "The five hundred taels the Portuguese pay Xiangshan county now count as ground rent, so who owns which house in Macao has to be reckoned all over again. And a young pair want a house of their own; both families say no."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_choice]
title = "Waiting at A-Ma"
text = "Under the banyan in front of A-Ma Temple, Catarina asks Lu Guifan, “Will you move out of the old house?” He counts his worries off one by one. “My family wants me to marry a girl from home. Your priest says it isn’t proper. Macao’s ground rent changes every year, and every time I read the small print of a lease, I’m afraid.” She hears him out, then takes a brass key from her sleeve, still unpolished. “I’ve picked the house, at the foot of the hill. The neighbor doesn’t open up till dawn, so no noise. I remember every one of those reasons.” They both turn to look at me."
news = "Under the banyan in front of A-Ma Temple in Macao, they say a Portuguese girl stood holding a key and waited for a Chinese interpreter, and she waited the better part of a day."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_choice.default]
news = "On ground-rent day in Macao, word is the interpreter and Captain Pereira’s daughter settled it between them in front of A-Ma Temple, and neither family could stop them."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_choice.choices.mediate]
text = "Sit down with each family and talk it through"
reply = "I go to the Pereiras first. The captain hears me out and raps his pipe on the table edge for a long while, then says his daughter does sums better than he does and this is beyond him. At the Lus’ house the old man asks only one thing: “Can the girl cook?” I tell him honestly that she can’t. He sighs, picks up his tea, and does not say “no.”"
effects = [{ }, { }, { }, { title = "The Pipe Tapped for So Long" }]

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_choice.choices.lookout]
text = "Keep watch at the temple on rent day"
reply = "Once the rent silver has gone off, the crowd in front of the temple hasn’t thinned. An aunt from the Lu family comes toward the temple gate with a basket on her arm, and I ask her the way three times before she goes around. Under the banyan those two talk for a long time. At the end Catarina presses the key into his palm and closes his fingers over it."
effects = [{ }, { }, { }, { title = "The Key Under the Banyan" }]

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_choice.choices.watch]
text = "Stay out of it and let them decide"
reply = "I step back to the temple wall and say nothing. Lu pushes the key back into her hand and says he has to read the small print of the lease once more. At noon the next day he turns up with a corrected lease, both names side by side, the ink not yet dry."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_together]
title = "A Door With Two Names"
text = "The nameplate on the new house carries two names, one in Chinese characters, one in Portuguese letters, on the same line. Neither family sent anyone, but plenty of neighbors came. Lu Guifan hangs the lease behind the door with every clause spelled out, and reads it to her. “Clause seven: the wall footing moves back half a foot.” Catarina says, “From now on, you don’t have to translate a word in this house.” He bolts the door, and when he turns around she is already close and kisses him."
news = "A new house in Macao has a nameplate with two names, one in Chinese characters and one in foreign letters, side by side. Neither family came, but the neighbors filled the place."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_together.variants.v1_mediated]
text = "The nameplate on the new house carries two names, one in Chinese characters, one in Portuguese letters, on the same line. Neither family sent anyone, but two things sit by the door with no name on them: an old brass lamp and a package of rice cake. Lu Guifan hangs the lease behind the door with every clause spelled out, and reads it to her. “Clause seven: the wall footing moves back half a foot.” Catarina says, “From now on, you don’t have to translate a word in this house.” He bolts the door, and when he turns around she is already close and kisses him."

[tracks.pair_lu_guifan_catarina_pereira.chapters.pair_lu_guifan_catarina_pereira_together.variants.v2_matched]
text = "The nameplate on the new house carries two names, one in Chinese characters, one in Portuguese letters, on the same line. Neither family sent anyone. Only a bamboo basket sits on the threshold, oranges weighing down a sheet of red paper, and whoever brought it didn’t come in. Lu Guifan hangs the lease behind the door with every clause spelled out, and reads it to her. “Clause seven: the wall footing moves back half a foot.” Catarina says, “From now on, you don’t have to translate a word in this house.” He bolts the door, and when he turns around she is already close and kisses him."
