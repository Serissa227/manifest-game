# 由她定潮时（pair_ko_haewol_shin_gyeong）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_ko_haewol_shin_gyeong]
name = "On Her Tide"

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_meeting]
title = "Knots First"
text = "At the fish market a young man in a navy officer’s coat stood in front of the Jeju diver’s stall, holding half a sack of rice and a bolt of cloth. “That summer the raiders hit Jeju, I went into the water, and you hauled me out. This is only—” Ko Haewol never looked at the rice. She pulled a bundle of dried hemp rope from under the table and tossed it to him. “I can’t eat a landsman’s thanks. Learn to tie a knot first. You grabbed my wrist that day. Nearly took us both down.” Shin Gyeong tied the end into a hard knot and pulled it tighter the harder he tried to undo it, sweat running into his eyes. She didn’t take it from him. She slowed another length of rope down so he could see it: one turn, one pass through, one tug. On the third try the knot came loose. He held on to the rope end and said, very seriously, “You know this sea. I’ll listen first.”"
news = "At the Busan fish market, a young naval officer carried rice and cloth to thank a diver from Jeju. She kept none of it and made him spend the afternoon learning knots."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_closer]
title = "The Other Ledger"
text = "Since the raids, the navy’s reports counted only warships. Shin Gyeong kept another book, house by house, of what the fishing families of Jeju had lost: nets, boats, people. This time, when Ko Haewol came to Busan to sell abalone, he handed it to her on the stone steps outside the naval camp. At the end of every line, in small characters, he had written who had told him and when. She turned the pages and stopped at one. “This house didn’t lose two boats. It lost one boat and a son.” Shin took the book back, struck out the line in front of her, wrote it again, and blew the ink dry. “When is a good time for you to come next? I’ll keep the day free.” “I go by the tide,” she said, shutting the book and handing it back, “not by your office roll call.” He opened the inside cover and added a line in small characters, copied from that month’s tide table."
news = "An officer at the Busan naval camp is keeping a second book on the fishing families of Jeju, and they say he corrects it house by house on a diver’s word."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_turning]
title = "Tribute Abalone"
text = "Word spread along the Busan docks. After the raids the court still wanted its full tribute of abalone from the Jeju divers, not one short. The young officer at the naval camp, the one with the second book on the fishing families, sent it up the chain and said Jeju could not pay this year. His superior cursed him for it. They say he took it standing and never changed a word. Passengers from Jeju said the divers went quiet when they heard, and that winter they changed the hours they went into the water and would not say why. At the Busan fish market people saw Ko Haewol braiding rope those days. Every length she finished, she kept."
news = "After the raids, Jeju’s divers still owe the full abalone tribute. They say an officer at the Busan naval camp sent up a ledger for them and got cursed out for it."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_choice]
title = "The Day She Picked"
text = "Shin Gyeong had me carry his letter. It filled a whole page, and the first half was weather: the spring wind, the damp of the fish market, the willow budding in the camp yard. Only in the second half did it work around to wanting to see her. I found Ko Haewol at the market, squatting over a net. She read it through, then pressed a crease into the edge of the paper with her thumbnail. “That man’s afraid to ask straight out.” She didn’t pocket the letter. She tapped it against her palm, and her eyes went to my bundle. In it was a copy of his ledger of the fishing households, with no instructions for what to do with it. She waited for me to move first."
news = "An officer from the Busan naval camp had a letter carried to the Jeju diver, and they say the first half page of it was about the weather."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_choice.default]
news = "The Jeju diver picked her own rest day and sent word to the naval camp through the fish market: a flat rock on the shore, and don’t bring wine."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_choice.choices.deliver]
text = "Leave the letter in her hands and let her pick the day and place"
reply = "I said nothing, left the letter in her hands, and told the camp only this: the day and place were hers to name. Four days later her answer came. The day would be one she didn’t dive, on a flat rock by the sea big enough for her net bag, with no feast. Shin heard it out, put the bolt of fine cloth he had kept for two weeks back in its chest, and stopped me at the door. “Would you go once more and ask whether she can use dry rope?”"
news = "The officer at the Busan naval camp put away a bolt of cloth he had bought as a gift and asked the Jeju diver if she could use dry rope. They say she picked the day herself."
effects = [{}, {}, {}, { title = "The Crease in the Paper" }]

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_choice.choices.records]
text = "Send the ledger copy to the Jeju magistrate, no private word"
reply = "I added nothing to the copy. I gave it to the purser of a government ship bound for Jeju, to put in the magistrate’s hands. When the ship came back it brought news: Jeju’s abalone tribute that year was cut by three tenths. Ko Haewol knew whose ledger it was. She didn’t say thank you. She sent word by a passenger that the day to meet was five days earlier."
news = "They say Jeju’s abalone tribute was cut by three tenths this year, after a copy of the Busan officer’s ledger reached the magistrate’s desk."
effects = [{}, {}, {}, { title = "Three Tenths Off the Tribute" }]

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_choice.choices.watch]
text = "Say nothing and leave once the letter is delivered"
reply = "I swallowed what I had been going to say and turned to go. “Can he swim?” she called after me. I said not very well. She laughed out loud, folded the letter, and pushed it deep into her net bag. “Then we’ll meet on the flat rock.” She didn’t say what day."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_together]
title = "On the Flat Rock"
text = "The flat rock by the shore was bleached white in the sun. Ko Haewol set out her net bag, her iron pry bar, and her goggles in a row and went into the water. Shin Gyeong had come too early and stood by the rock for an hour, not daring to take off his boots, and when the water reached his ankles he wouldn’t go any farther. She surfaced with one long whistle, a fist-sized abalone gripped in her hand, and pushed it, dripping, into his. “Paying me back ends here. After this, boast all you like on land. In the water, you do what I say.” He opened his mouth to answer, and she had already risen on her toes and kissed him, and he tasted salt. He held the abalone and had no idea where to put it. “In the bag,” she said. “Next time, I’ll come and fetch you.”"
news = "There’s a flat rock on the shore at Busan where an officer from the naval camp stood for an hour, they say, waiting for a diver from Jeju to come up out of the water."

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_together.variants.v1_matched]
text = "The flat rock by the shore was bleached white in the sun. Shin Gyeong had come with three bundles of dry rope and stacked them by the rock, once and then again, before he noticed that she had already laid out her net bag, iron pry bar, and goggles and gone into the water. He stood there for an hour. She surfaced with one long whistle, a fist-sized abalone gripped in her hand, looked at the pile of rope, and pushed the shell, dripping, into his hand. “Paying me back ends here. Ashore, brag as much as you like. Underwater, I give the orders.” He opened his mouth to answer, and she had already risen on her toes and kissed him, and he tasted salt. The rope rolled everywhere. “Pick it up,” she said. “Next time, I’ll come and fetch you.”"

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_together.variants.v2_helped]
text = "It was five days sooner than she had set. The flat rock by the shore was bleached white in the sun, and Ko Haewol set out her net bag, her iron pry bar, and her goggles in a row and went into the water. Shin Gyeong had come too early and stood by the rock for an hour. She surfaced with one long whistle, a fist-sized abalone gripped in her hand, and pushed it, dripping, into his. “Jeju’s tribute came down by three tenths. The whole island is saying whose ledger it was. I won’t say thanks. Paying me back ends here. Ashore, strut all you want. The water is mine.” He couldn’t get a word out, and she had already risen on her toes and kissed him, and he tasted salt. “In the bag,” she said. “Next time, I’ll come and fetch you.”"

[tracks.pair_ko_haewol_shin_gyeong.chapters.pair_ko_haewol_shin_gyeong_epilogue]
title = "She Moved to Busan"
text = "A new household has settled in a small hut on the shingle below the naval camp, with a row of net bags and kelp drying under the eaves. People say it’s the Jeju diver Ko Haewol, moved to Busan, still in the water at first light. Whenever Officer Shin is due to go out on patrol, he turns aside to the shingle first to ask about the day’s tide. If she says the surf is high, he pushes his sailing back half a day. The men in the camp tell it as a joke. He hears it and doesn’t argue. He says, “If she says the surf is high, then it’s high.”"
news = "That diver from Jeju has moved to Busan, they say, and the officer from the naval camp stops to ask her the day’s tide before every patrol."
