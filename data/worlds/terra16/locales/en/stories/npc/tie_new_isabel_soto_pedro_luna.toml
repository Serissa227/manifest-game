[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_landing.variants.helped]
text = "The ships from the Strait came back into Seville one after another. Pedro had lost weight and his face had gone the color of leather. He walked into Isabel’s shop by the Arenal quay without a word, shook open the folds of his pilot’s license and drew out the roll, spreading it on her worktable. The license carried more salt-water stains than the chart did. The coast of the Strait was still her drawing, but beside it ran the latitudes he had taken all the way, and at the end of every line a tiny arrow pointing toward land. She went down them with a pen, line by line, and stopped at the eleventh. “Who drew this? It’s wrong—you’re a minute off here.” “Then you fix it,” said Pedro, smiling. She fixed the minute and didn’t touch a single arrow. She put the pen down. “Three years of your words are all over this. Now it’s my turn to say something.” She came around the worktable and kissed him."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_landing.variants.mediated]
text = "The ships from the Strait came back into Seville one after another. Pedro had lost weight and his face had gone the color of leather. He walked into Isabel’s shop by the Arenal quay without a word and turned his coat inside out. The crooked stitches in the lining had gone white with salt, and not one had come loose. Isabel looked at her own needlework, and the corner of her mouth twitched. He unpicked the thread, drew out the roll and spread it on her worktable. Beside her coast ran the latitudes he had taken all the way, and at the end of every line a tiny arrow pointing toward land. She went down them with a pen and stopped at the eleventh. “Who drew this? It’s wrong—you’re a minute off here.” “Then you fix it,” said Pedro, smiling. She fixed the minute and didn’t touch a single arrow. She put the pen down. “Three years of your words are all over this. Now it’s my turn to say something.” She came around the worktable and kissed him."

[tracks.tie_new_isabel_soto_pedro_luna_side]
name = "Scale and Chart, Side by Side"

[tracks.tie_new_isabel_soto_pedro_luna_side.chapters.side]
title = "Scale and Chart"
text = "The fleet was home. Pedro unpicked his coat lining and drew out a roll of chart the sea had wrinkled, and spread it on Isabel’s worktable, the latitudes he had taken along the way written thick beside the coast she had drawn. She checked them line by line, found only one slip, and corrected it herself in tiny letters. When she was done she loaded her pen with ink, marked out a space beside her own signature, and held the pen out to him. “Write.” “Under yours is fine,” said Pedro. “You took the latitudes,” she said. “Yours goes first.” “Any place will do,” he said, still giving way. “As long as the chart is right.” “Then on one line,” said Isabel. The two names ran together on a single line. She blew the ink dry and pinned the chart to the wall above the worktable."
news = "The Strait fleet is home in Seville, and an astrolabe maker and the examiner’s granddaughter have finished checking a chart together. It now carries two names signed side by side."

