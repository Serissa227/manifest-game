[tracks.tie_new_isabel_soto_pedro_luna]
name = "Her Name on the Chart"

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_meeting]
title = "Check the Scale First"
text = "In the instrument hall of the House of Trade, a clerk was laying astrolabes out along the long table one by one. Pedro, an apprentice from an astrolabe workshop, came in carrying the new one his master had made. The old examiner behind the desk hadn’t even put out a hand when his granddaughter Isabel snatched it away. She took it to the window, set a pair of dividers against the scale, then against another spot. “Who cut this? It’s wrong—the thirty-seventh degree is narrower than its neighbor by a hair.” Pedro went red to the ears. He had cut that degree himself. He didn’t argue. He took the astrolabe back and looked again against the light. “Latitude doesn’t care about surnames. You’re right. I’ll recut it.” Isabel stood there with her mouth open, the rest of her complaint stuck in her throat."
news = "On inspection day at the House of Trade in Seville, the examiner’s granddaughter found one degree cut too narrow on a new astrolabe. The apprentice who cut it owned up on the spot and took it back to redo."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_closer]
title = "The Road She Drew"
text = "Isabel unrolled a chart on the workbench of the astrolabe shop and weighted its corners with brass weights and a pair of dividers. It was a route to the West Indies: out of Sanlúcar, past the Canaries, all the way to Santo Domingo. Her name was signed in the lower right corner, the ink barely dry. “Use this one when you sit for your license.” Pedro did what he always did and checked her lines of latitude first, one by one, and could find no fault. Then his finger followed the route west and stopped in the middle of the ocean. No island there, no reef, only a few thin lines. He didn’t move for a long time. “You’re afraid,” said Isabel. He didn’t deny it. His throat had gone tight. “I’m afraid so.” She rolled the chart up and pushed it into his arms. “Then just hold on to it. If I ever get aboard a ship, I’ll go myself.”"
news = "In a Seville astrolabe shop, the apprentice Pedro has been given a chart of the route to the West Indies. The examiner’s granddaughter drew it, and her own name is signed in the corner."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_closer.default]
