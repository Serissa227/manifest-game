[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_turning]
title = "The Strait Fleet Takes On Hands"
text = "This summer the Seville waterfront talks of one thing: the King is sending a great fleet to the Strait of Magellan to build forts along it, so that no foreign ship can slip into the Pacific again. It will sail from Sanlúcar in September. A long table has been set up outside the House of Trade, where clerks sign on pilots and carpenters and anyone who understands instruments. The last man in the line, they say, is the old apprentice from the astrolabe shop, who has ground scales for twenty-odd years and never once been to sea. “How many voyages?” asks the clerk. “…None, I’m afraid,” says Pedro. “I only know how to read a scale.” “Then you’re just who we want,” says the clerk, writing: “Pilot’s assistant, in charge of instruments.” When he gets to the date of birth, the clerk writes May thirty-first, and the examiner’s granddaughter shoves her way out of the crowd, snatches the pen and strikes it through. “May thirteenth, not May thirty-first!” “Thank you,” Pedro says quietly. She tosses the pen back on the table. “I couldn’t stand to watch.”"
news = "The King is sending a great fleet to the Strait of Magellan, and the House of Trade in Seville has set up a table to sign on hands. The apprentice from the astrolabe shop, who has never been to sea, put his name down."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_choice]
title = "Carry the Chart or Not"
text = "Three days before the fleet sailed, Isabel cornered Pedro at the back door of the workshop and pushed a roll of paper into his hands: the coast around the Strait, which she had drawn herself after questioning everyone who had ever been there, her name signed in the corner as always. “Only the House of Trade’s standard charts are allowed aboard,” said Pedro. He unrolled it, glanced at it, rolled it up again, his voice dropping. “If the chief pilot sees a chart signed by a woman, I’m afraid there’ll be a fine.” He gripped the roll, his thumb rubbing back and forth over her signature, and his hand began to shake again. Isabel didn’t coax him. She only said, “Latitude doesn’t care about surnames. You said so yourself.” Then she turned and looked at me. “Well? Does he carry it or not?”"
news = "Just before the Strait fleet sailed, the examiner’s granddaughter pressed a roll of her own drawing on an astrolabe maker. They stood at the back door of the Seville workshop for a good while."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_choice.default]
news = "On the day the Strait fleet boarded in Seville, the examiner’s granddaughter walked the astrolabe maker to the very end of the landing stage, reached out to pat flat a bulge in the lining of his coat, and only then turned back."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_choice.choices.get_license]
text = "Get Pedro a pilot’s license at the House of Trade, so what he carries is his own call."
reply = "I waited in the corridors of the House of Trade until dark before the chief pilot would see me. I told him that half the pilots in Seville were steering by scales Pedro had cut. He listened without a word, and in the end stamped a new license. Back at the workshop, Pedro took the paper from me, and his hand didn’t shake at all. He slipped Isabel’s chart inside the folds of the license, closed it, and pressed it flat with his palm. On the day the ships sailed, Isabel stood on the landing stage and didn’t wave. Only when the ship was well off the bank did she shout up at the deck: “Check the scales first!”"
news = "The House of Trade has stamped a pilot’s license for Pedro, the Seville astrolabe maker. The day the Strait fleet sailed, the examiner’s granddaughter shouted “Check the scales first!” at the deck from the landing stage."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_choice.choices.argue_signature]
text = "Tell Pedro: carry it or not, but not one stroke of her name is to be scraped off."
reply = "“I wasn’t going to scrape it off,” Pedro said quickly. “It’s her name.” Isabel snorted. “Then why are you shaking?” “I was afraid you’d tell me not to take it.” She stared at him for a while, then pulled a needle and thread out of her cuff. “Coat off.” With me looking on, she sewed a flat pocket into the lining, the stitches crooked. She bit off the thread, rolled the chart into a thin tube, pushed it in and patted it flat. “If the chief pilot turns it up, make him read my name aloud. His tongue won’t rot.”"
news = "The examiner’s granddaughter squatted at the back door of a Seville astrolabe shop and sewed an inside pocket into the coat of a man bound for the Strait fleet. The stitches wandered all over, and she patted the result twice when she was done."

[tracks.tie_new_isabel_soto_pedro_luna.chapters.tie_new_isabel_soto_pedro_luna_landing]
title = "Back to Check the Chart"
text = "The ships from the Strait came back into Seville one after another. Pedro had lost weight and his face had gone the color of leather. He walked into Isabel’s shop by the Arenal quay without a word, unpicked a few stitches in his coat lining, pulled out the roll and spread it on her worktable. The coast of the Strait was still her drawing, but beside it ran small writing: the latitudes he had taken all the way, and at the end of every line a tiny arrow pointing toward land. She went down them with a pen, line by line, and stopped at the eleventh. “Who drew this? It’s wrong—you’re a minute off here.” “Then you fix it,” said Pedro, smiling. She fixed the minute and didn’t touch a single arrow. She put the pen down. “Three years of your words are all over this. Now it’s my turn to say something.” She came around the worktable and kissed him."
news = "The Strait fleet is back in Seville. The astrolabe maker who stepped off it didn’t go home but headed straight for the examiner’s granddaughter’s shop by the Arenal quay, and the two of them checked one chart together until dark."

