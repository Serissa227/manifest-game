[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_landing.variants.v1_both]
text = "When spring came, Xochitl handed in a small image of the Virgin in a robe of quetzal green, with two small lines in the lower right corner, one in Nahuatl and one in Castilian. Ana took it to the window and looked at it at dawn, at noon, and again by candlelight that night, and what she looked at longest was the corner. Xochitl kept watch over a fresh bowl of orchid-root glue, ready for the tearing and the redoing. Ana set the picture down. “Hang it by the door.” Xochitl opened her mouth. This time not even the first half came out. She carried the picture outside, and Inés, waiting by the door, saw it first. She leaned in and read the two lines aloud, one after the other, and got a sound wrong in the Nahuatl. Xochitl hauled her back. “The glue’s still wet!”"

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_landing.variants.v2_signed]
text = "When spring came, Xochitl handed in a small image of the Virgin in a robe of quetzal green, with two small lines in the lower right corner, one in Nahuatl and one in Castilian. Ana took it to the window. She looked at it at dawn, again at noon, and again that night with a candlestick held up to it, and what she looked at longest was the corner. Xochitl stood at the far end of the table all day with a fresh bowl of orchid-root glue at her elbow, ready for the tearing and the redoing. Ana set the picture down. “Hang it by the door.” Xochitl opened her mouth. This time not even the first half came out. She picked up the picture and made for the door, then turned back at the threshold. “Where are the nails?” Ana didn’t look up. “Second drawer on the left.”"

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_landing.variants.v3_ines]
text = "When spring came, Xochitl handed in a small image of the Virgin: a robe of quetzal green laid over a layer of hummingbird violet. Ana took it to the window. She looked at it at dawn, again at noon, and again that night with a candlestick held up to it, all without a word. Xochitl kept watch over a fresh bowl of orchid-root glue, ready for the tearing and the redoing. Ana set the picture down. “Hang it by the door.” Xochitl opened her mouth. This time not even the first half came out. She carried the picture outside and held it up against the doorframe three times to judge the height. Inés, waiting by the door, saw it first and reached out to touch it. Xochitl slapped her hand away. “The glue’s still wet!”"
