# C7：tie_extra_05_ana_cruz_xochitl 的英文显示覆盖（嵌套表写法，按轨道、章节、选项、变体 key 对应；不含玩法字段）。

[tracks.tie_extra_05_ana_cruz_xochitl]
name = "Green in Three Lights"

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_meeting]
title = "Out of My Light"
text = "Xochitl stood in the main plaza for the better part of an hour. The cathedral, the arcades of the viceroy’s palace, the two snow peaks hanging in the southeastern sky: she took them in one by one without a word, and never once picked up the feather box at her feet. By the time she reached her cousin’s workshop she had found her tongue again. She dumped the box on the table. “Call that big? In Mexi…” The rest stuck in her throat. Ana didn’t look up. “Don’t stand there, you’re blocking the light. Over here. Good, now look.” Under the window lay the backing for a holy image, cotton paper brushed with glue boiled down from orchid roots. Xochitl pressed her first hummingbird feather onto it a hair out of true. Ana reached over and tore the whole patch off. “Again.” She redid it eleven times that day. The eleventh time, Ana kept her hands to herself."
news = "A cousin from Mérida has started at the feather workshop in Mexico City. On her first day the painter tore up eleven patches of her work, and word is her eyes stayed dry."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_meeting.variants.ines]
text = "Inés stood outside the workshop threshold with Xochitl’s feather box in her arms, and nothing would bring her in; she had long since learned that nobody stands in the bright patch by Ana’s door. Today, for the first time, Xochitl was called up to her cousin’s own table. She planted her feet and opened her mouth. “Call that big? In Mexi…” Out at the door, Inés burst out laughing. Ana didn’t look up. “Don’t stand there, you’re blocking the light. Over here. Good, now look.” The cotton paper was already brushed with orchid-root glue. Xochitl’s first hummingbird feather went down a hair out of true, and Ana tore the whole patch off. “Again.” She redid it eleven times that day, and Inés, outside the door, counted every one."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_closer]
title = "Grandmother’s Feathers"
text = "Ana wedged a quetzal tail feather into a crack in the window frame and told Xochitl to start watching it at first light. At dawn its green was lake water; by noon it had gone hard as jade. “Customers only know one green,” Ana said. “You have to know all three.” Xochitl stared at the feather, then asked out of nowhere, “Those feathers Grandmother used to talk about. What did they actually mean?” Ana glanced at the door, got up and pulled it to, and leaned in to whisper them one kind at a time. When she reached the quetzal, Xochitl couldn’t keep quiet. “She called us ‘my green feather.’ That’s what she meant?” Ana pinched her arm hard and finished before she sat back. “None of this gets written down.” For a long while Xochitl said nothing. That evening, when the candle was lit and the feather had gone so dark it almost vanished, she finally spoke. “Nocniuh.”"
news = "There’s a quetzal tail feather stuck in the window frame of the Mexico City feather workshop. The painter makes her cousin watch it from dawn until the candles are lit. One feather, she says, has three greens."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_closer.default]
effects = [{ title = "Green in Three Lights" }]

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_turning]
title = "The Scaffold in the Plaza"
text = "In August the two Ávila brothers lost their heads on the main plaza; they had meant, people say, to make the marquis king of New Spain. Their house is to be pulled down and the ground sown with salt, or so the story goes. Every day someone else is taken away. The gentlemen who had ordered feather saints have shut their gates, and their stewards came by to cancel: three orders, one after another, gone from the feather workshop. The porters who carry feathers up from the south have stopped coming as well. The roads are watched, they say, and every basket gets tipped out and searched. When the neighbors asked the painter whether she would stay open, she said, “Open as usual. Not enough feathers, we make small pieces.” Her cousin from Mérida muttered from the back, “Small ones are harder on the eyes.”"
news = "They beheaded the Ávila brothers on the main plaza in Mexico City, and the arrests go on every day. The feather workshop lost three orders for holy images in a row, but the painter says the door stays open."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_choice]
title = "The Workshop Has One Name"
text = "Winter had set in, and still no feathers from the south. Ana’s holy image had stalled at the saint’s robe: half of it laid, the other half bare glued paper. Xochitl, for her part, had finished her first small piece of her own, a palm-sized Saint Francis with a hummingbird at his feet. She sketched in the corner with a stick of charcoal. “Nahuatl here, Castilian here.” Ana pushed the workshop seal across the table at her. “This workshop has one name.” “Your name.” “Yes.” Xochitl put the charcoal down and went silent. The cousins sat on opposite sides of the table all afternoon. When I pushed the door open, the only sound in the room was Ana scraping glue."
news = "The Mexico City feather workshop has been short of feathers all winter, and now the two cousins are deadlocked over a signature. Neighbors say the only sound in there all afternoon was glue being scraped."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_choice.default]
news = "The Mérida cousin’s first little picture at the Mexico City feather workshop went out under the workshop’s seal after all, though word is she wrote her own name on the back in charcoal."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_choice.choices.deliver_feathers]
text = "Bring the workshop a load of quetzal and hummingbird feathers from the south."
reply = "Half a month later two baskets wrapped in oilcloth were set down at the workshop door. Ana sorted them against the window feather by feather for a whole day. The night the saint’s robe was finished, she pushed the brightest handful left over across the table. “That piece of yours. Redo the eyes with these.” Xochitl picked one up, turned it under the candle, said nothing more about the signature, and dragged her stool back to the table."
news = "The Mexico City feather workshop finally got its feathers from the south, two baskets of quetzal and hummingbird, and the holy image that sat unfinished all winter is done."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_choice.choices.back_signature]
text = "Speak up for Xochitl: sign in both scripts, so people on both sides know who made it."
reply = "Ana gave a cold laugh. “So you know my workshop’s rules better than I do.” She ignored me after that and went back to scraping glue. Early the next morning Xochitl came running to find me. The seal had been shoved to the corner of the table, she said, and her little picture was propped in the brightest spot under the window with a sharpened reed pen beside it. Ana had stood behind her and watched her write both lines in the corner. One crooked stroke, and she had to scrape it off and start again."
news = "The Mexico City feather workshop broke its own rule: the cousin from Mérida has two lines written in the corner of her little picture, one in Nahuatl and one in Castilian."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_landing]
title = "The One Left Whole"
text = "When spring came, Xochitl handed in a small image of the Virgin: a robe of quetzal green laid over a layer of hummingbird violet. Ana took it to the window. She looked at it at dawn, again at noon, and again that night with a candlestick held up to it, all without a word. Xochitl stood at the far end of the table all day with a fresh bowl of orchid-root glue at her elbow, ready for the tearing and the redoing. Ana set the picture down. “Hang it by the door.” Xochitl opened her mouth. This time not even the first half came out. She picked up the picture and made for the door, then turned back at the threshold. “Where are the nails?” Ana didn’t look up. “Second drawer on the left.”"
news = "There’s a new little Virgin hanging by the door of the Mexico City feather workshop, made by that cousin from Mérida. The painter looked it over all day and, would you believe it, didn’t tear it up."

[tracks.tie_extra_05_ana_cruz_xochitl.chapters.tie_extra_05_ana_cruz_xochitl_landing.default]
