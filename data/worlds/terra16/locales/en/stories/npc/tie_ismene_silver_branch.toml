# C7 重写（2026-10-11，Claude Opus）：tie_ismene_silver_branch 的英文显示覆盖，按轨道、章节、选项、变体的 key 对应；不含玩法字段。

[tracks.tie_ismene_silver_branch]
name = "Questions for the Teacher"

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_meeting]
title = "The Lesson Left Unanswered"
text = "The ten kings’ council was over, and the stone trough where the bull was offered had been scrubbed clean. Ismene sat on the plinth beneath the pillar with a sheet of paper across her knees, written over on both sides, tiny script crowding even the margins. “Everything I’ve asked her these past years that she never answered. It’s all here.” She took me through it line by line: why the seventh line on the pillar is one word short; whether newcomers from the outer sea should hear the oath through before they set foot ashore. The top line was struck out. I had to lean in close to read it: “What is your name?” The woman with the silver branch came out from behind the pillar, the fog trailing after her. I couldn’t make out her face, only that she was bright, brighter than the noon sun. She took the page, read it top to bottom, handed it back to Ismene, and sang a single line: “On the western sea lie thrice fifty isles.” Then she was gone. Ismene copied that line at the foot of the page too, and turned to me. “Did you understand it?” I shook my head. She chewed on her pen a long while. “Neither did I.” She folded the page and slid it under a loose slab at the edge of the plinth."
news = "Word in Atlantis’s outer harbor is that the moment the ten kings’ council broke up, the young priestess who keeps the pillar slid a page full of questions under a slab at its foot. The temple sweepers step around it."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_closer]
title = "The Pillar After the Council"
text = "That spring Ismene started over from the first line on the pillar. With every word she read, her finger moved down one word, always a finger’s width from the inscription, never touching it. At the passage on the bull hunt she stopped. “‘The ten kings take the bull without iron.’ The next sentence, the council skipped straight over.” The woman with the silver branch stood behind her. She never brought iron into the temple; even the pin in her hair was carved from bone. She studied that line a long time, and then, for the first time, she spoke without singing: “You read more slowly than I heard it read, long ago.” Ismene looked back at her. “Is slow good, or bad?” Her finger was already drifting toward the skipped sentence. The woman watched it, and handed back, word for word, what Ismene always said to stop strangers: “Finish the oath before you touch the pillar.” Ismene drew her hand back, turned to the pillar again, and read on from the sentence the council had skipped."
news = "The old woman who sweeps the temple in Atlantis says the young priestess of the pillar read the laws aloud line by line while the woman with the flowering branch stood behind her and listened. They stayed till dark and never lit a lamp."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_closer.default]
effects = [{ title = "The Pillar After the Council" }]

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_turning]
title = "No One Came Out of the Fog"
text = "The fog in the outer harbor hasn’t lifted since May. You can’t see the mastheads, and the fishing boats ring bells all the way in and out. On the quay they say the woman with the flowering branch hasn’t come once. “That’s seven-isles folk for you,” says the old man mending nets. “No hello when they come, no goodbye when they go.” Some say they’ve heard singing in the fog at night, drifting in from the west, one line over and over: “…thrice fifty isles…” The young priestess of the pillar comes down to the quay every evening and stands a while by the mooring post, looking west. Ask her who she’s waiting for and she’ll ask first what brings you to the quay; answer her, and she still keeps her own answer to herself. When she’s stood long enough she goes back to the temple and reads her pillar. At the end of July the lamplighter saw her borrow a table on the quay, write a note, fold it into a narrow strip and tuck it into her sleeve. “When the fog lifts, it goes on the first boat west.”"
news = "The fog has sat on Atlantis’s outer harbor for three months, and the woman with the flowering branch hasn’t come once. The young priestess of the pillar still stands by the mooring post every evening, though."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_choice]
title = "Questions Across the Water"
text = "In the west a corner of the fog tore open. Over toward the seven isles lay a white boat with no oarsmen and no sail, and at its bow a point of light, as if someone stood there holding up a branch in flower. Ismene put the note in my hand, the same narrow strip, unsealed. “No need for wax. She can see it.” Afraid I might refuse it, she told me the questions first: more ships come from the outer sea every year, and the clause on receiving them is still the old words her forebears carved. Should those aboard hear the oath first, or be given water and bread first? The second question she read very quietly: may the keeper of the pillar disagree with her own teacher? “I want to hear how she answers.” She drew her hands back into her sleeves. “But the harbor is mine to decide.” An old sailor on the quay reminded me: no iron goes ashore on the seven isles. Knives, nails, anchor chain, all of it stays aboard."
news = "The young priestess of the pillar in Atlantis’s outer harbor had a visiting captain carry a note into the fog to the seven isles. It came back with a white petal folded inside."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_choice.default]
news = "A note sat under the foot of the pillar in the Atlantis temple all autumn. The woman with the flowering branch came by once, glanced at it, sang a line and left again."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_choice.choices.carry_question]
text = "Take her note out to the white boat."
reply = "I left my knife and hobnailed boots aboard my own ship and rowed over in the skiff. At the bow of the white boat the woman with the silver branch read the note through. She asked for no pen and wrote nothing. She plucked a petal from the branch, laid it inside, folded the note along its old creases, and handed it back. “Take it back as it is.” In the harbor Ismene unfolded it and the petal dropped into her palm, still soft. She held it a long time. “She means, ‘You decide.’” That night she pressed the petal into her copy of the laws, at the page with the welcoming clause."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_choice.choices.go_yourself]
text = "Urge her to go herself. She need only leave her iron aboard."
reply = "Ismene hesitated a good while. Then she unhooked the little iron penknife from her belt, gave it to me, borrowed my skiff and rowed into the fog alone. She came back at dusk on the third day with the white sand of the isles on her shoes, and hadn’t stamped off a grain of it. “She asked me three questions,” she said, sitting on the edge of the quay and counting on her fingers. “Are the people from the outer sea thirsty? How many times have I read the oath myself? What am I afraid of? She didn’t answer a single one of mine.” She looked down at the sand on her shoes. “But somehow I think I know the answers now.”"
news = "They say the pillar’s young priestess in Atlantis borrowed a skiff and rowed into the fog to the seven isles herself. She was back at dusk on the third day, her shoes white with sand."

[tracks.tie_ismene_silver_branch.chapters.tie_ismene_silver_branch_landing]
title = "A Question in Return"
text = "In early spring the fog thinned, and the woman with the silver branch came over from the seven isles with nothing in her hands but the branch. Ismene stood before the pillar and read her the revised welcoming clause: “A ship from the outer sea: first ask its purpose; give water, give bread. Read the oath to those aboard, and when it has been read, ask which king’s guests they are.” When she finished, the woman asked only one thing. “And those who don’t understand it?” Ismene didn’t answer. She drew the old page out from under the slab at the pillar’s foot, turned to the bottom, and pointed at the line of song she had copied there. “When you sang me ‘thrice fifty isles,’ did you know I wouldn’t understand?” The woman laughed. The old sweeper, forty years at the temple, said afterward she had never once seen her laugh before. The white flowers on the silver branch chimed faintly; the woman picked the smallest and laid it at the foot of the pillar. “For this lesson, you do the asking.”"
news = "People in Atlantis’s outer harbor are saying the woman with the flowering branch laughed in front of the temple pillar. There’s a small white flower at its foot now, and the young priestess won’t let anyone sweep it away."

