[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_meeting]
title = "One Wrong Character"
text = "Kim Munyeong came into the paper shop with a draft under his arm, wanting paper to fair-copy a reply for the Japan House. Haeri pulled a sheet of mulberry-bark paper off the shelf and rubbed it across her palm. “The smooth side is the front. Write on the rough side; it takes the ink.” Then she glanced down at the draft spread on the counter, and before her head caught up, her finger had landed on the last line. “That character’s wrong. Paper has a right side and a wrong side. So do words.” The line was a plea for pardon, except that the word for “forgive” had been written as the word for “rage.” She corrected other people’s drafts when nobody was looking; this time the words were out and could not be taken back. Munyeong stared for a long while, color climbing up behind his ears. He was not angry. He pushed the draft back across the counter. “Say it again, please—word for word. Which character should it be?” “Forgive.” Haeri tapped it with the back of her paper knife. “Next to the woman radical you wrote a hand. It wants a mouth. Anyone at the Japan House who reads that will think you’re begging them to be furious.” He took up his brush and mended it, then asked for thirty sheets. Haeri counted out thirty-two and pressed them into his arms. “Rough side up.”"
news = "The paper merchant’s daughter at Busanpo set the interpreter’s apprentice right about one character in his draft: he had written “rage” for “forgive.” He went red, owned up, and the reply was mended on the spot."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_closer]
title = "How Each Side Says Sorry"
text = "At night the drying room behind the paper shop had a whole wall of sheets warming on it, and every hour someone had to turn them over. Haeri turned a round, then went back to the lamp to look at his booklet. It had three columns: what we say, what the Japan House says, and which sentences go badly if you say them too heavily. For “we are mortified” the Japan House had three phrasings, each a step apart, and he had copied the page out a third time and still held his brush in the air. “That one’s too light,” Haeri said, circling it in the margin with vermilion. “They’ll hear that you’re not owning up.” “And if it’s heavy?” “Then they write it down and enter your guilt in their ledger.” She set the brush down and said, suddenly, “I want to go myself, once. Stand on the dock at Tsushima and say every one of these to their faces.” Munyeong did not laugh. He laid down his pen. “Say that again.” She said it again, louder than the first time. Out in the shop, her father’s snoring caught, hitched, and carried on."
news = "An interpreter’s apprentice at Busan is putting together a little booklet on how each side says sorry. The paper merchant’s daughter proofreads it for him, the two of them at it by lamplight till the small hours."

