[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_turning]
title = "Sonjuk Island"
text = "In the second month Japanese ships crept up on Sonjuk Island off Jeolla, and the commander of the garrison died there. The news took half a month to reach Busan. At the Japan House it went eerily quiet, and then documents poured into the interpreters’ room like a spring tide: letters of accusation, letters of excuse, letters asking what was going on, and every one of them needed paper and a proofreader. “The shelves at the paper shop are bare,” said the fishmonger next door. “And the one at Yun’s is still picking through what’s left, sheet by sheet, saying the new mulberry paper is uneven on the rough side.” The guard at the interpreters’ room said the paper merchant’s daughter came more often than the roll call: “I asked what the hurry was, and she told me that right now one wrong character could cost a man his head.” Interpreter Kim was no idler either. A letter had come over from the Japan House, and he made the messenger read it aloud three times. “‘We are deeply mortified’—is that an apology or an accusation? Settle that first, and then I’ll translate the rest.”"
news = "Japanese ships hit Sonjuk Island off Jeolla in the second month and killed the garrison commander. Now the papers at the Busan Japan House are piled to the roof, and the paper merchant’s daughter is at the interpreters’ room every day."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_choice]
title = "Paper for the Reply"
text = "The Sō clan of Tsushima had come, asking Korea to send an envoy to Japan’s new master. The court’s reply was on its way through Busan, and it needed the best paper and the sharpest eyes. Haeri was stacking mulberry paper in neat piles, a strip of cloth wound round a thumb the paper knife had nicked. “The head interpreter says women don’t go into the duty room,” she said, fast. “They’ll still use my paper. It’s the proofreader they’re finding someone else for.” Munyeong leaned in the doorframe, his bags already tied. “The moment the reply is sealed, I go with it.” Haeri picked up a stack of sheets and set it down in front of me. It was crowded with vermilion; she had proofed it by night. “Paper has a right side and a wrong side,” she said. “This time I want to do the turning myself.”"
news = "The Sō of Tsushima has come to Busan asking Korea to send an envoy. The court’s reply needs paper and proofreading, and the paper merchant’s daughter can’t get past the duty-room door."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_choice.default]
news = "The paper in the court’s reply came from the Yun paper shop in Busan, and the proofing was done in the shop at night by the daughter of the house; her name is nowhere on the letter. Interpreter Kim of the duty room has gone to Tsushima with it."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_choice.choices.plead]
text = "Go to the head interpreter and plead for her: let her prepare the paper and proof it in the room itself."
reply = "The head interpreter was an old man with a face as thin as the back of a knife. I said only, “Please read three pages first.” He said nothing, drew the sheets Haeri had proofed over to the lamp and read line by line, a finger moving down to the last page, and found nothing to mark. “How many characters does a woman know?” “Enough to know a wrong one,” said Haeri. The old man coughed and stood aside from the door. She proofed in the duty room for three nights, and I kept watch outside. On the third night Munyeong came out with a lamp and held a sheet up for me: in the very corner of the back, a tiny Yun, the ink still wet. “She says the reply belongs to the court,” he said, dropping his voice. “The paper belongs to the Yuns.”"
news = "The head interpreter at the Busan duty room read the pages the paper merchant’s daughter had proofed, could not find a single mistake, and let her in through the door."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_choice.choices.carry_proofs]
text = "Carry her proofed pages into the duty room overnight, before the reply is sealed."
reply = "I reached the duty room when the reply was already copied to its last page and the wax dish had been brought in. Haeri had circled three places in vermilion, the first in the salutation: someone had stuck a mountain on top of the Sō family name, making it a different character, so the letter now addressed somebody else. Munyeong took the pages, bent to the lamp and checked every stroke, and mended all three. The wax was still hot enough to sting when he looked up at me. “Which three did she circle? Read them to me.” I read the three characters out to him. He nodded and sealed it."
news = "The night before the court’s reply was sealed, somebody carried proofed pages into the Busan duty room and three characters were mended before the seal went on. Next day Interpreter Kim sailed for Tsushima with the letter."

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_landing]
title = "Fixing the Date"
text = "Kim Munyeong came back from Tsushima with his baggage still on his shoulder and stopped at the paper-shop door. He had not said a word about Tsushima. Haeri spoke first, from behind the counter. “The fifteenth of next month.” “The fifteenth of what?” “The wedding day. I’ve fixed it.” She pressed a slip of red paper flat on the counter. “I wrote it myself. Check it for mistakes. Paper has a right side and a wrong side. This time don’t you read it backwards.” He bent his head and went through it character by character, twice, and looked up. “Word for word. Once more.” “The wedding day. The fifteenth of next month!” She said it louder than the first time, the shutter of the silk shop across the street banged, and half the street heard. Munyeong asked nothing more. He turned back his sleeve and wrote two more words deep inside the cuff: the fifteenth."
news = "The daughter of the Yun paper shop at Busan shouted her wedding day in the doorway, twice over, and rattled the shutter of the silk shop across the street. Half the street heard."

