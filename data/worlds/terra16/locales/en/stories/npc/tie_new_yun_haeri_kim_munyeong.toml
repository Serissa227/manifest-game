[tracks.tie_new_yun_haeri_kim_munyeong_side.chapters.side]
title = "Paper and Proofs"
text = "Back from Tsushima, Munyeong stood in the paper-shop doorway and told Haeri what he had seen over there, one thing at a time: how at the lord’s house you said sorry by first laying your folding fan across your knees, keeping your head down and your voice low; how our envoys stood to speak, and when the words came out heavy, the other side wrote them down. Haeri pinned the pages flat with the back of her paper knife and wrote as he talked. At “folding fan” she stopped. “Again, please,” she said, in his voice. “How low?” “Just this low.” Munyeong dropped his voice by half. Haeri laughed out loud, turned the page over and added a line to the back in vermilion. “We’ll finish it,” she said. “From now on, anyone going to the Japan House comes here first for a copy. I’ll supply the paper. Paper has a right side and a wrong side. So do words.”"
news = "The Busan paper shop now hands out a little booklet on how each side says sorry: paper from the shop, proofing by Interpreter Kim and the paper merchant’s daughter together. Everyone with business at the Japan House comes for a copy first."

