[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_landing.variants.v1_helped]
text = "Kim Munyeong came back from Tsushima with his baggage still on his shoulder and stopped at the paper-shop door. Haeri was cutting paper behind the counter and did not look up. “The fifteenth of next month.” “The fifteenth of what?” “The wedding day. I’ve fixed it.” She pressed a slip of red paper flat on the counter. “Check it for mistakes. Paper has a right side and a wrong side. This time don’t you read it backwards.” He bent his head and went through it character by character, and looked up. “Word for word. Once more.” “The wedding day. The fifteenth of next month!” She said it louder than the first time, the shutter of the silk shop across the street banged, and half the street heard. Munyeong turned back his sleeve and wrote two more words deep inside the cuff: the fifteenth. “The man who received the reply felt the paper for a long time over there,” he said. “Then he asked who had prepared it. I told him: the Yun paper shop at Busanpo, Yun Haeri.” Haeri tapped the counter with the back of her paper knife. “Did he write it down right?” “He did.”"

[tracks.tie_new_yun_haeri_kim_munyeong.chapters.tie_new_yun_haeri_kim_munyeong_landing.variants.v2_carried]
text = "Kim Munyeong came back from Tsushima with his baggage still on his shoulder and stopped at the paper-shop door. Haeri spoke first from behind the counter, her paper knife still moving. “The fifteenth of next month.” “The fifteenth of what?” “The wedding day. I’ve fixed it.” She pressed a slip of red paper flat on the counter. “Check it for mistakes. Paper has a right side and a wrong side. This time don’t you read it backwards.” He bent his head and went through it character by character, and looked up. “Word for word. Once more.” “The wedding day. The fifteenth of next month!” She said it louder than the first time, the shutter of the silk shop across the street banged, and half the street heard. Munyeong turned back his sleeve and wrote two more words deep inside the cuff: the fifteenth. “The three characters you circled,” he said. “The interpreter who took the letter at Tsushima read them out twice and never stumbled.” “Twice?” The paper knife kept going. “It should have been right the first time.”"

