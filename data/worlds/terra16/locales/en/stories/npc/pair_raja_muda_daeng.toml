# 河口那条船（pair_raja_muda_daeng）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_raja_muda_daeng]
name = "The Boat at the River Mouth"

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_meeting]
title = "Whose Boat"
text = "Only one boat was tied up at the ferry landing, and a Bugis boy sat in the stern drawing slow circles in the water with the tip of his oar. A boy in a silk jacket came down the bank with a chest at his feet and his chin in the air. “Why isn’t my boat here yet? I want to cross.” The oar stopped. Daeng lifted it out, laid it across his knees, leaned back against the stern and did not move. The wind pushed the boat a foot from the bank and drew it back. Raja Muda stood on the baking mud with sweat on his forehead, shifting the chest from hand to hand, his lips starting to shape words and giving up. “…May I ride in your boat?” Only then did Daeng put the oar back in the water. “Get in.” On the far bank the prince patted down both sleeves and came up with a gold ring. “Can’t make change for that,” Daeng said. “The fare is two coppers.” “I don’t have any coppers.” “Then you owe me.”"
news = "The Bugis boy who ferries at Giri would not let the Prince of Johor call his boat “mine,” and the prince stood on the bank in the sun for half an afternoon before he changed his words."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_closer]
title = "The Half Left for Him"
text = "The pantun contest was over and the lanterns were going out one by one. The two of them sat on the riverbank with their feet over the water. Daeng was cutting another notch in a strip of bamboo, and the notches already ran halfway along it. Raja Muda looked toward the river mouth and spoke like a man reading out a decree. “By rights, Malacca should be ours. One day I’m going to take it back. What about you?” “A boat.” Daeng blew the shavings off. “With no debt on it.” A few schoolmates passing by burst out laughing. “That’s all you want?” Daeng did not look up, and the knife did not stop. The prince did not laugh. He cleared his throat and began the first half of a pantun: “The tide runs out, the post stands still, three times the mooring line is changed—” He paused. “The second half is yours. You finish it.” The knife stopped. After a long while Daeng said it slowly. “The boat I want is small. No one’s flag on her, no one’s ledger.” The bamboo slid off his knee, and Raja Muda caught it before it touched the water, soaking his sleeve to the elbow. “That one, word for word,” he said. After a moment he added, low, “Every chest I own, somebody else decided what goes in it.” Then he held it out. His fingers stayed on the strip a little longer than they needed to."
news = "After the pantun contest at Giri, the prince of Johor started a verse by the river and, they say, left the second half to a young Bugis deckhand."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_together]
title = "A Boat of His Own"
text = "The last notch on the bamboo strip was cut in April. The other half of the money bought a load of fresh timber, and it lay spread across the riverbank at Giri beside the planks that had been seasoning for months. Raja Muda came every day. He never mentioned money or his family, only planed. By the third day his palms had blistered; he wrapped them in cloth and kept planing, and the shavings curled around his ankles. Daeng watched him twice, said nothing, and tossed him a small pot of coconut oil. The boat went into the river in May with no ceremony, a few shipwrights shoving at the stern, and it slid in, rocked, and settled. “Get in,” said Daeng, standing in the shallows, tipping his chin at the bow. “The bow? That’s…” “First passenger sits in the bow. I don’t keep a seat for princes. And you still owe me a fare from five years ago.” “I remember.” Raja Muda climbed aboard, and his blisters rubbed the fresh pitch on the gunwale until he sucked in a breath. Daeng poled out to midstream, laid the pole down, and let the current turn them half around. Then he leaned over and kissed him, quickly."
news = "A new boat went into the river at Giri, built by the Bugis sailor. They say the first passenger, up in the bow, was the Prince of Johor."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_turning]
title = "A Fleet from Malacca"
text = "At the food stalls by the Johor river mouth the boatmen keep their voices low. The Portuguese in Malacca are gathering a fleet, more sails than anyone can count, and they say it is coming for the old capital. The court has argued for ten days. Some of the old counselors want to hold out to the last man, and others packed their belongings into chests long ago and are only waiting for the word to retreat upriver. Argue as they like, one boat at the river mouth stays quiet. It is a Bugis boat, moored there since spring, taking no cargo and no passengers, with new mooring lines and the moss scraped clean off her sides. Someone asked the owner what he was waiting for. He looked toward the palace and said nothing."
news = "The Portuguese are massing a fleet at Malacca to hit Johor, and they say a Bugis boat has sat at the Johor river mouth for months, taking no cargo and not leaving."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_choice]
title = "The Way Upriver"
text = "The guns began in the afternoon. By evening the quay at the river mouth was packed: women of the palace, clerks, wet nurses with babies, and a chest at everyone’s feet. Raja Muda pushed through with a scroll of names in his fist, the hem of his court robe thick with mud. Daeng’s boat was moored farthest out, a mark cut into her hull at the waterline. He tapped the mark. “You say where; I say how. But there are only so many places aboard.” “Fifty-eight names on the list.” “Below this line she carries twenty a trip. A round trip takes an hour. If the fire reaches the quay before dawn, I can make two trips. The third depends on the sky.” They bent over the list for a long time. Raja Muda dipped the brush and, from the top down, struck out the word “chests” line by line, and when he came to his own line his hand paused and then he struck that one too. Not one name was touched. Daeng pushed the list toward me. “You work it out.”"
news = "The Portuguese have taken old Johor, and the Bugis boat at the river mouth held on for the last trip. They say the last man aboard was a prince who had left his chests behind."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_choice.choices.list]
text = "Sort them by the waterline mark, trip by trip"
reply = "I stood at the head of the gangplank and counted people by the mark on the hull: wet nurses with babies first, then the clerks clutching their ledgers, chests left on the stones. The first two trips filled her. By the third, the city was burning and her gunwale rode almost level with the water. Daeng said nothing and reached out and took the last two children. Raja Muda was the last to jump aboard, the scroll of names still in his hand, one corner scorched black."
effects = [{}, {}, {}, { title = "The List Without Chests" }]
news = "On the night old Johor fell, the Bugis boat at the river mouth made three trips. They say the last man aboard was a prince."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_choice.choices.second_boat]
text = "Find another boat downstream for those who won’t fit"
reply = "I ran downriver, and at dusk I found a fishing boat on the mud flats. The owner glanced at the fire over the river mouth and named three times the usual price. I didn’t haggle. When the boat reached the quay, Daeng’s first load had just filled. He saw it, nodded to me from the bow, threw the owner a line and told him to follow astern."
effects = [{}, {}, {}, { title = "The Fishing Boat Astern" }]
news = "On the night old Johor fell, a fishing boat from downriver trailed the Bugis boat at the river mouth. They say the last man aboard was a prince."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_choice.choices.watch]
text = "Stay out of it and wait at the river mouth"
reply = "I sat on the stone steps at the river mouth all night. The fire burned until the small hours, and the voices on the quay thinned and drew away. Just before dawn Daeng’s boat came out of the smoke, riding low, with Raja Muda in the bow. The court robe was gone. He wore only a soaked undershirt."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_epilogue]
title = "No Debt to the Court"
text = "The court’s boats went upriver in October, and their oars were still audible beyond the third bend. Raja Muda did not board any of them. He stood in the bow of Daeng’s boat and recited the titles that remained, one at a time: heir of the kings of Malacca, lord of the Johor River, master of seven hundred ships at sea… By the last one his voice was hoarse. Daeng squatted by the hatch whipping the end of a rope, listened from start to finish, and never stopped working. On the quay the last launch of the court still waited, an old retainer in it with both hands held out. Raja Muda slid the signet ring from his finger and tossed it across. “Let them keep it all.” The launch pulled away. A coil of sheet came flying at his chest and he caught it in both arms. “The ring’s gone. The fare isn’t. Haul, the wind’s turned,” Daeng said. He pulled once and the line did not move, so he changed hands. The sail went up and filled. He looked back upriver, turned back around and sat in the bow, in the same place as always."
news = "The Johor court has moved upriver. They say one prince did not go with it. He boarded a Bugis boat and has not worn a court robe since."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_epilogue.variants.helped]
text = "The court’s boats went upriver in October, and their oars were still audible beyond the third bend. Raja Muda did not board any of them. He stood in the bow of Daeng’s boat and recited the titles that remained, one at a time: heir of the kings of Malacca, lord of the Johor River, master of seven hundred ships at sea… By the last one his voice was hoarse. Daeng squatted by the hatch whipping the end of a rope, listened from start to finish, and never stopped working. On the quay the last launch of the court still waited, an old retainer in it with both hands held out. Raja Muda slid the signet ring from his finger and tossed it across. “Let them keep it all.” The launch pulled away. He ducked into the cabin, folded the list with its scorched corner and its struck-out chests, and laid it in the wooden box under Daeng’s old shirts. When he came out, a coil of sheet came flying at his chest and he caught it in both arms. “The ring’s gone. The fare isn’t. Haul, the wind’s turned,” Daeng said. The sail went up and filled. He looked back upriver, turned back around and sat in the bow, in the same place as always."

[tracks.pair_raja_muda_daeng.chapters.pair_raja_muda_daeng_epilogue.variants.matched]
text = "The court’s boats went upriver in October, and their oars were still audible beyond the third bend. Raja Muda did not board any of them. He stood in the bow of Daeng’s boat and recited the titles that remained, one at a time: heir of the kings of Malacca, lord of the Johor River, master of seven hundred ships at sea… By the last one his voice was hoarse. On the quay the last launch of the court still waited, an old retainer in it with both hands held out. Raja Muda slid the signet ring from his finger and tossed it across. “Let them keep it all.” The launch pulled away. At the far end of the quay the fisherman from downriver, who had been squatting there for hours, walked over with a basket of fish. “What that passenger paid would have bought half my boat. The fish are the change.” Daeng took the basket, looked at Raja Muda, said nothing, and handed him a coil of sheet instead. “The fare isn’t gone. Haul, the wind’s turned.” The sail went up and filled. He looked back upriver, turned back around and sat in the bow, in the same place as always."

[tracks.pair_raja_muda_daeng_side]
name = "Passenger and Friend"

[tracks.pair_raja_muda_daeng_side.chapters.pair_raja_muda_daeng_side_landing]
title = "Two Coppers, Five Years Late"
text = "Daeng’s first boat went into the river at Giri still smelling of fresh-planed wood. Raja Muda was her first passenger, and he sat bolt upright in the bow with one hand on the gunwale the whole way. On the far bank he stood, reached into his sleeve, and put two copper coins in Daeng’s palm. “Your fare. Five years overdue.” Daeng bit one, then pocketed both. “From now on a prince pays like anyone else.” “Naturally,” said Raja Muda, with a straight face. “When does the next crossing leave?” “What’s the hurry? The tide hasn’t turned.” They sat down on the bank, Raja Muda began the first half of a pantun, and Daeng gave the second half, still about the boat."
news = "The Bugis sailor’s new boat has gone into the river at Giri. They say its first passenger was the Prince of Johor, who paid his two coppers like an honest man."
