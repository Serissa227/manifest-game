# 留下哪条独木舟（pair_jean_leblanc_pierre_cardon）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_jean_leblanc_pierre_cardon]
name = "Which Canoe to Keep"

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_meeting]
title = "Too Many Nails"
text = "The Calvinists’ ship had barely touched the beach when Pierre was down on his heels beside a cracked canoe, tipping a handful of iron nails out of his tool bag. The village interpreter crouched at the other end with a pot of resin and an armful of bark cord. “Stand back. Shavings get in your eyes,” Pierre said, not looking up. “Nothing on my side makes shavings.” Jean wound the cord once around the crack. “Our people have never put a nail in a canoe.” They argued from noon until the sun was low, then settled it by taking a side each and pushing the canoe into the water. Pierre’s side leaked first, and his sleeve was wet to the elbow. Jean didn’t laugh. He held out his own dry cloth. An old man in the palm shade said something in Tupi, probably asking how many more nails the white man meant to drive into his canoe. Jean answered him, smiling: “I can translate. I can’t promise for him.”"
news = "Up in Guanabara Bay, a newly arrived French carpenter and the village interpreter argued all afternoon over a canoe and ended up mending one side each."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_closer]
title = "Supper Ashore"
text = "The Calvinists Villegagnon had thrown out of the fort sat in lean-tos on the shore, and every rain came through the roof. Jean took Pierre home to the longhouse where he lived. When the food came, Pierre bowed his head and folded his hands, and everyone in the house stopped to watch. Jean lowered his voice and put the prayer into Tupi a line at a time, slowly, as though he were stalling. At “our daily bread,” the woman beside Pierre pushed a piece of grilled fish in front of him. After the meal he wouldn’t sit idle. He found two boards and a crossbar and fitted the longhouse door with a bolt, on the inside. “A door has to open from the inside,” he said. “Nobody here is going to lock you in,” Jean said from the doorframe. “Why bother?” Pierre drove in the last wedge. “I’m afraid of being shut in. With it fitted, I can sleep.”"
news = "The Calvinists put off the island have moved into the village ashore, and they say a carpenter has hung a door on a Tupinambá longhouse that bolts from the inside."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_together]
title = "The Ship Sailed Without Him"
text = "The Jacques was ready to carry the Calvinists back to France, and Pierre’s name was on the list. On the day she sailed the others queued for the boats. He didn’t go. The longhouse door was still one board short. Jean found him on the shore, squatting in a drift of shavings, planing the board very slowly and running his thumb over it after every stroke. “The ship’s waiting,” Jean said. “The board’s not done.” Pierre didn’t look up. Across the bay the Jacques raised her sails. He set the plane down, then picked it up again. That night he prayed outside the longhouse for a long time, and Jean crouched nearby and waited. When he finished, Jean reached down to pull him to his feet. Pierre stood up. He didn’t let go. “Tomorrow I’ll pray about this again,” Pierre said. “I know,” said Jean. Pierre bent his head and kissed Jean."
news = "The Jacques has sailed for France with the Calvinists. One carpenter on the list stayed behind, and they say he’s planing a door board in the village ashore."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_turning]
title = "Fort Coligny"
text = "News went around the docks: the Portuguese had taken Fort Coligny on the island, and the French had scattered. Some had vanished into the forest with the Tupinambá; others were asking anyone who would listen for a ship home. A fishmonger swore he had seen the carpenter who stayed behind squatting on the beach with the village interpreter, taking apart a canoe, the nails on one side pulled out one by one and the resin on the other left alone. A fisherman swore just as hard that after dark the same two were still on the quay, asking every French captain when he sailed."
news = "The Portuguese have taken the French fort in Guanabara Bay. The French have scattered, some into the forest and some in search of a ship home."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_choice]
title = "Forest or Ship"
text = "After Fort Coligny fell, the French in the bay scattered. My ship was waiting for the tide at the mouth of the bay when the two of them came to find me, one after the other. Pierre spoke first. A French ship was willing to carry him to Le Havre, and he could afford the passage. “I won’t live in a place where I can’t see God.” Jean sat on the gangplank braiding a length of cord. The villagers were heading north, deep into the forest, and he had to go with them. “And I won’t go back to a country that treats me as a stranger.” They stood at opposite ends of the plank. Neither asked the other to follow, and both looked at me."
news = "The French in Guanabara Bay are coming and going and scattering, and word is the interpreter and the carpenter haven’t settled who follows whom."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_choice.default]
news = "The French in Guanabara Bay have scattered. The carpenter took a ship back to Le Havre, and the interpreter went north into the forest with the villagers."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_choice.choices.same_side]
text = "My ship is heading north anyway. I’ll take both of them to a village in Bahia."
reply = "I put them ashore at a small cove south of Bahia. The first thing Pierre did on land was crouch down and turn over the driftwood on the sand, weighing each piece in his hand. Jean walked straight to the nearest longhouse without looking back, to find the man in charge and talk. Neither thanked me. They were both too busy, and I took that for thanks."
news = "A ship bound north put a French interpreter and a carpenter ashore at a small cove south of Bahia. Neither looked back."
effects = [{}, {}, {}, { title = "The Cove South of Bahia" }]

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_choice.choices.letters]
text = "Promise to carry their letters between Le Havre and Brazil whenever I pass this coast."
reply = "Pierre handed me the first letter. There was no street on the cover, only: “North, third bay along the coast, the longhouse where the brazilwood dries.” Jean said the village had no door numbers. “Then I’ll look for the door,” I said, “the kind that bolts from the inside.” Pierre grunted and pressed the envelope flat once more."
news = "A captain in Guanabara Bay has agreed to carry letters between a French carpenter and the interpreter up north, and the covers will give only a direction."
effects = [{}, {}, {}, { title = "An Address Without a Number" }]

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_choice.choices.watch]
text = "Stay out of it and watch the French ship leave the dock."
reply = "Pierre boarded and stood at the stern and never once looked back. Jean didn’t come down to the dock. He stood far off on the rocks, braiding his length of cord and unpicking it again. The ship rounded the headland, and he was still standing there."
news = "On the dock at Guanabara Bay the French ship sailed with the carpenter aboard, and the interpreter stood alone on the far rocks until it was out of sight."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_apart]
title = "Shavings on Two Shores"
text = "They say the carpenter went home to Le Havre and builds doors at the shipyard, every one with its bolt on the inside. The yard hands laugh at him for it, and he doesn’t explain. The interpreter went into the northern forest and now translates for a village there. Whenever a ship comes in, he’s the first to run down and ask whether there’s anything for him. An ocean lies between them, and in a year the most either can hope for is a letter from the other, if a passing ship is willing to carry it."
news = "At the Le Havre shipyard there’s a carpenter back from Brazil whose door bolts all sit on the inside. They say he waits all year for one letter from Brazil."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_apart.variants.matched]
text = "They say the carpenter went home to Le Havre and builds doors at the shipyard, every one with its bolt on the inside. The yard hands laugh at him for it, and he doesn’t explain. The interpreter went into the northern forest. A ship carries a letter between them once a year, and the one bound north is addressed by direction, not by street: “North, third bay along the coast.” The captain says the man in Le Havre always presses the envelope flat before he opens it."

[tracks.pair_jean_leblanc_pierre_cardon.chapters.pair_jean_leblanc_pierre_cardon_landing_b]
title = "Same Side of the Water"
text = "In the village south of Bahia the longhouse has another door now. Pierre hung it, and the bolt is on the inside, as always. On Sundays he won’t touch a nail. He sits on the threshold turning the pages of his dog-eared Bible and looks up at the yard every page or so. Across the yard Jean is translating a deal between a merchant and a woman of the village, cloth for brazilwood. The woman talks at length. Jean gives it in one line: “She says the price can be talked over. First, eat.” Halfway through, he glances back at the man on the threshold. Pierre holds up the book and waggles it: I’m watching. That night Jean stands outside the door and asks, “Which way does this one open tonight?” “From inside,” says Pierre. “Come in.” The bolt slides back."
news = "Two Frenchmen live in a village south of Bahia. One translates for the villagers and the other won’t work on Sundays, and they say both door bolts are on the inside."

