# C7 配角线 tie_new_nala_aisha 的英文显示覆盖（嵌套表写法，按轨道、章节、选项、变体 key 对应）；只覆盖文字，不复制玩法。

[tracks.tie_new_nala_aisha]
name = "The Oud and the Slate"

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_meeting]
title = "Strings and Slates"
text = "Noon in June, and seven girls sat in Aisha’s courtyard with slates on their knees, tracing the letters she had written out for them. Next door at the musician’s house an oud started on a slow tune. The smallest girl stopped first, and before the line was done all seven heads had tilted toward the wall. Aisha brushed the chalk off her hands and went to knock, the girls trailing after her with their slates. Nala came out with the oud in her arms. Aisha tipped her head at the girls behind her. “They pick up that tune faster than their letters.” Nala looked down at the row of upturned faces and pointed the neck of the oud at the smallest. “You were humming along.” The child giggled and said that whenever she opened her mouth to sing, her grandmother pretended to be deaf. “Your grandmother can play deaf. I won’t. This time, you sing.” Scarlet to the ears, the little girl sang. Aisha crouched and wrote the words onto her slate one by one. Nala glanced down. “You rushed the second line. She held that note half a beat.” Aisha added a short dash after the word. Nala turned to go in, then looked back from the doorway. “I won’t play in the mornings.”"
news = "There’s a courtyard in the Andalusi quarter of Fez where the girls write on slates all morning, then spend the afternoon listening through the wall to the musician’s daughter on the oud."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_closer]
title = "Spelled Out on a Slate"
text = "The little girl who had gone red to the ears singing in that courtyard five years ago knew all her letters now. She had spelled out one of Nala’s tunes on her slate—no notation, a letter for every sound—until both sides were full. That afternoon she stood in Nala’s courtyard hugging the slate and sang straight off it. The tune wandered in several places, but the accent was unmistakably Aisha’s: the way scholars’ families spoke in the city of Granada, every word set down square and proper. The corner of Nala’s mouth twitched; she didn’t laugh. She picked along on the oud and nudged the stray notes back one at a time, and left every word just as the girl said it. Aisha, leaning on the wall, waited until the girl had run off. “That tune comes from the mountain villages. You’re not going to fix her accent?” Nala bent over her tuning pegs. “That’s her way of singing it.” Aisha drew a thin book of poems from her sleeve and laid it on the oud case. “You may borrow the book—the next girl is waiting.” Nala opened it. On the flyleaf ran a column of names, seven crossed out, and the last one was hers."
news = "A girl in the Andalusi quarter of Fez learned a tune by singing off letters spelled out on a slate. Nala the oud player straightened out the melody and didn’t touch a word of her accent."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_closer.default]
effects = [{}, { title = "Spelled Out on a Slate" }]

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_turning]
title = "People from the Mountains"
text = "Since spring, strangers have been knocking on doors all over the Andalusi quarter of Fez, asking after relatives. Word is there’s been a rising in the mountains over toward Granada, and the people of the Alpujarras crept down to the coast by night and crowded into fishing boats to row across. Mule drivers who came all the way up from Tetouan say that some on the road carried out nothing but a cooking pot, and some walked barefoot with nothing at all. Overnight the quarter gained a hundred-odd mouths; the mosque courtyard is full of sleepers, and the line at the well runs until dawn. Everyone in the lanes is talking about the musician’s house and the teacher’s house beside it: both have given up half their courtyards, slates pushed against the wall and mats laid out to the doorstep. Someone saw Aisha at her door taking down names, crouching low whenever a child wouldn’t speak. “Say it when you’re ready. I’ll wait.” Nala went from one shelter to the next with her oud, asking everyone she met: “Who still remembers the songs from home?”"
news = "There’s been a rising in the mountains near Granada, and refugees from the Alpujarras have crossed the sea to Fez. The Andalusi quarter gained a hundred mouths overnight; some brought nothing but a cooking pot."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_choice]
title = "Nothing but a Song"
text = "A mule driver had brought the girl to Aisha’s courtyard at the start of the year. She came with nothing; even the shoes on her feet had been given to her along the way. All she had was one song from her village, sung in an accent so thick that the oldest people in the quarter could follow only half of it. Aisha set a new slate on her knees. “Letters first. Once you can write, we’ll put the song down, and then it can’t be lost.” Nala reached over and took the slate away. “Write it down and it changes. Can those few letters of yours spell her sounds?” “If they can’t, I’ll spell it again.” “Spell it as often as you like, it’ll still be in your accent.” Their voices climbed. The girl shrank against the doorpost, twisting the hem of her tunic, her lips still moving to the tune of that song. Aisha turned and saw me at the gate. “You settle it.” Nala said, “Don’t settle anything yet. Hear her sing it first.”"
news = "A refugee girl has turned up in the Andalusi quarter of Fez with nothing but a song from her village, in an accent so thick even the old folk can’t follow all of it."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_choice.default]
news = "That refugee girl who came to the Andalusi quarter of Fez with only a song has moved in with Aisha the teacher: letters in the morning, singing at the musician’s house next door in the afternoon. Nobody ever did write the song down."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_choice.choices.find_room]
text = "Find them an empty room in the quarter, with a bed for the girl and space for slates and the oud."
reply = "I spent two days asking around the quarter before I found a locked room at the end of a lane. Its owner, an old man, had gone to join his son in Tlemcen the year before and left the key at the oil press next door. Inside there was nothing but a straw mat and a window facing south. Aisha carried in slates and two chests of books, trip after trip, and stacked them along the wall. Nala drove a wooden peg in beside the window and hung up her oud. “The oud hangs here, so the song lives here too.” Aisha gave her a look but didn’t argue, and wrote the girl’s name on the topmost slate. That first night the girl slept in the room alone. We stood out in the lane and heard her sing the song from beginning to end."
news = "That room at the end of a lane in the Andalusi quarter of Fez, locked up a whole year, has someone in it again: an oud by the window, and a refugee girl singing her village song at night."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_choice.choices.write_and_sing]
text = "Talk them into both: Aisha writes it in the girl’s accent, Nala plays from what’s written."
reply = "Aisha laid ten slates out on the ground. The girl sang a line, Aisha spelled a line, then read it back aloud; whenever Nala shook her head, she wiped it off and spelled it again. By the third day she had taken to writing some sounds as two letters stacked one on the other, a spelling no book had ever used. Nala played from the slates, and the girl sang from them. A few old people sat on the doorstep to listen, and when it was over one old woman said, “Read like that, it sounds like someone from that village singing.” Aisha rubbed her chalky hands down her skirt. “Well? Has it changed?” Nala didn’t answer. She pointed at the two stacked letters. “This one. Teach me how to say it.”"
news = "Aisha, who teaches in the Andalusi quarter of Fez, has spelled a refugee girl’s village song onto slates in the girl’s own accent. The old folk say reading it sounds like someone from that village singing."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_landing]
title = "A Room"
text = "By spring the room at the end of the lane in the Andalusi quarter was ready: an oud on the wall, slates stacked at its foot. In the mornings Aisha taught the girls their letters here; in the afternoons Nala taught them the songs from home, each village’s song in that village’s accent. Aisha had lettered the sign by the door: a single line, “Hafsa’s Room.” Nala read it twice. “Whose Hafsa is that?” “Her own. She was from Granada too. She crossed the sea and taught women poetry.” That evening, in front of a roomful of girls, the two of them swore themselves sisters: they broke a loaf, dipped it in salt, and shared it. Aisha said, “From today, there is bread and salt between us.” Nala played and Aisha recited, and when the poem was done Nala lifted her chin at the girl by the door, the one who had come last year with nothing. The girl stood up and sang her song."
news = "There’s a room at the end of a lane in the Andalusi quarter of Fez: reading in the morning, home songs in the afternoon. The two women who run it shared bread and salt in front of their pupils and swore themselves sisters."

