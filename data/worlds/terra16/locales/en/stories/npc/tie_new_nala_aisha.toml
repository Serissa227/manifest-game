[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_landing.variants.v1_written]
text = "By spring the room at the end of the lane in the Andalusi quarter was ready: an oud on the wall, and beside it a slate with the song spelled out on it, some sounds written as two letters stacked together. In the mornings Aisha taught the girls their letters here; in the afternoons Nala taught them to sing from that slate, and what came out was the accent of that village. Aisha had lettered the sign by the door: a single line, “Hafsa’s Room.” Nala read it twice. “Whose Hafsa is that?” “Her own. She was from Granada too. She crossed the sea and taught women poetry.” That evening, in front of a roomful of girls, the two of them swore themselves sisters: they broke a loaf, dipped it in salt, and shared it. Aisha said, “From today, there is bread and salt between us.” Nala played and Aisha recited, and when the poem was done the girl who had come last year with nothing stood up to sing her song, and the whole room sang along with her, eyes on the slate on the wall."

[tracks.tie_new_nala_aisha.chapters.tie_new_nala_aisha_landing.variants.v2_helped]
text = "By spring the room with the south-facing window, at the end of the lane in the Andalusi quarter, was ready: the oud on its peg by the window, slates stacked along the wall, last year’s straw mat rolled up in the back. In the mornings Aisha taught the girls their letters here; in the afternoons Nala taught them the songs from home, each village’s song in that village’s accent. Aisha had lettered the sign by the door: a single line, “Hafsa’s Room.” Nala read it twice. “Whose Hafsa is that?” “Her own. She was from Granada too. She crossed the sea and taught women poetry.” That evening, in front of a roomful of girls, the two of them swore themselves sisters: they broke a loaf, dipped it in salt, and shared it. Aisha said, “From today, there is bread and salt between us.” Nala played and Aisha recited, and when the poem was done Nala lifted her chin at the girl under the window, the one who had come last year with nothing. The girl stood up and sang her song."
