[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_landing.variants.helped]
text = "On the beach at Arica, Ika’s raft went into the water. She was called Fox, after the dark shape in the Milky Way. Mayta had come from Chincha, more than ten days at sea, and tied the name into his own ledger cord: a strand of russet thread, three short knots around a long one, which was Ika’s mark. At the end of the cord hung a slip of paper left by the clerk of the court, in Spanish, with one word on it: “Verified.” Ika flicked it with a fingernail. “That doesn’t count as a knot.” “No,” said Mayta. “It’s there to keep people off.” Ika shut his eyes and went over the name three times. “The new knots are tighter than the old. Same as when you retied the fortieth. I could tell by touch!” That night he did not boast and did not talk over anyone. He sat on the bow of the raft, leaned across and kissed Mayta. Next day Mayta took ship back to Chincha, with a cord of Ika’s tying in his bundle. The seventh knot was crooked. He looked at it once and left it."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_landing.variants.timber]
text = "On the beach at Arica, Ika’s raft went into the water. She was called Fox, after the dark shape in the Milky Way. The thickest balsa log, the one under her bottom, had come up from Guayaquil, and Ika had cut the shape of a knot deep into it. Mayta had come from Chincha, more than ten days at sea, and tied her name into his own ledger cord: a strand of russet thread, three short knots around a long one, which was Ika’s mark. “I tie names slowly,” he said. “Feel it slowly.” Ika shut his eyes and went over it three times. “The new knots are tighter than the old. Same as when you retied the fortieth. I could tell by touch!” That night he did not boast and did not talk over anyone. He sat on the bow of the raft, leaned across and kissed Mayta. Next day Mayta took ship back to Chincha, with a cord of Ika’s tying in his bundle. The seventh knot was crooked. He looked at it once and left it."

[tracks.tie_new_mayta_qipu_ika_side]
name = "Two Cords That Match (Side by Side)"

[tracks.tie_new_mayta_qipu_ika_side.chapters.side]
title = "Matching Cords"
text = "The day Ika’s raft went into the water, the llama trains were lined up half a mile along the silver dock at Arica. Mayta came from Chincha and kept out of the crowd. He crouched under the mast and tied the raft’s name into his own ledger cord: russet thread, three short knots around a long one, Fox. Ika ran his hand down it, his voice carrying across half the dock. “From now on every cargo out of Arica goes on your accounts! You count the knots, I load!” “Count the knots first,” said Mayta, “then we talk price.” By evening two cords hung side by side from the mast, Ika’s and Mayta’s, and counted from end to end they were not one knot apart."
news = "A new raft has gone into the water at Arica, and her owner says that from now on all his cargo will be written on the ledger cord of a friend in Chincha, who made the trip just to tie a knot."

