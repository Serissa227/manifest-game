[tracks.tie_new_mayta_qipu_ika]
name = "A Raft’s Name on the Ledger Cord"

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_meeting]
title = "Three Knots Out"
text = "The Chincha raft had tied up at Callao, and Mayta squatted by the gangplank checking the cargo against the cord across his knees. Ika, who had brought his teacher’s delivery cord, laid it down beside Mayta’s: three knots out. “You’re the one who’s wrong. Count faster, the raft’s waiting!” The more Ika hurried him, the slower Mayta counted. He reached out to run a finger down Ika’s cord, and Ika clapped it to his chest. “Don’t touch that cord, it’s my teacher’s!” “I didn’t,” said Mayta, drawing his hand back. “Count the knots, then load.” They went down the two cords together, one knot against one knot, until the fortieth gave it up: a bundle of spondylus, three strings of shell, and Mayta had counted it twice. “Three knots! Mayta’s three knots out!” Ika crowed it up and down the dock. Mayta went red to the ears, picked the knot out and tied it tight again. Ika pinched the new knot between two fingers. “Tight this time.” He shouldered his cord and was a long way off before he stopped laughing, and Mayta pinched the knot once more before he called for the loading."
news = "On the dock at Callao two young men from Chincha squatted over three knots all afternoon. The one who had it wrong went red and tied the knot again, and the other laughed loud enough for half the dock to hear."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_closer]
title = "A Raft of His Own"
text = "Ika told anyone who would listen that he was going to have a raft of his own, and then the people who laughed at him for being “only good for fingering cords” could shut up. He said it again on the dock at Callao, and Mayta waited until he had finished. “Nine balsa logs, two sails, one mast. Two hundred pesos owed, forty a year, five years.” “Can’t you let me dream in peace for one night?” Ika grumbled. Mayta did not answer. He sat down on the stone steps and tied the figures one by one into a fresh length of cord. At the very end he tied a mark, three short knots around a long one, which was Ika. He held it out. “Count the knots, then load. That’s your raft.” Ika ran a fingertip along it, knot by knot, and said nothing for a long time. His ears went red first. Then he tucked the cord into his belt beside his teacher’s."
news = "There is a raftsman on the dock at Callao with the loudest voice on the water who tells everyone he’ll build a raft of his own. Yesterday his friend sat on the steps and tied the cost of it into a cord for him."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_closer.default]
effects = [{}, { title = "A Raft of His Own" }]

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_turning]
title = "Gone to Arica"
text = "In the inn at Arica a llama driver was pulling off his boots and holding forth. The silver ingots from Potosí came down the mountain, one llama train after another, and every bar of it had to be ferried out to the big ships on rafts, so a raftsman there earned in a day what a man in Chincha earned in three. “Kusi Wayna’s apprentice from Chincha, the one with the biggest mouth, got in last month,” the fish seller put in. “Goes up and down the dock shouting that all of Potosí’s silver passes under his feet.” “He keeps a cord tucked in his belt,” said the driver, “and anyone who reaches for it gets, ‘Don’t touch that, it’s my raft!’” A raftsman just in from Chincha laughed. “Before I left I went by Mayta’s and told him Ika had reached Arica. He never even looked up. ‘I know,’ he said. ‘It’s in the accounts.’”"
news = "The talk in the inns at Arica is that Potosí’s silver now goes to sea from here, and that the loudest raftsman in Chincha has come too, with a cord tucked in his belt."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_turning_b]
title = "News from Cusco"
text = "A mule driver up from Cusco lowered his voice in a tavern at Callao. The last Inca of the mountains, Túpac Amaru, had been taken to the plaza in Cusco and put to death. The tavern stayed quiet for a long time. Next day the cord-keepers on the dock were rolling up their accounts earlier than usual, and the inspecting officials let it be known that from now on every village’s accounts would be read out to them, cord by cord. “Mayta of Chincha has been staying at the dockside inn,” the wine seller said, “and he sat up at night with a lamp, counting every cord he’d brought. I asked what for. He said, ‘If they ask tomorrow, I have to have the answer.’” A raftsman up from Arica had a message from Ika, too: “Tell that slowcoach not to panic. If he panics, nobody’s going to count for him!”"
news = "News from Cusco says the last Inca of the mountains has been put to death. At Callao the cord-keepers rolled up their accounts earlier than usual, and the inspectors say every village’s accounts will be read out to them."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_choice]
title = "Read It in Spanish"
text = "In the magistrate’s office at Callao the inspector had the Chincha traders’ cords spread across his desk, with a clerk and an interpreter at his elbow. “Read. Read it out in Spanish. If you can’t, it counts as concealment.” Mayta stood in the middle of the floor. He had practiced this speech at the wall at night more times than he could count, but when he opened his mouth—“This one is…”—his throat felt bound up like a cord. Ika squeezed in at the back of the hall, smelling of Arica sea wind, and said, in a voice lower than I had ever heard from him, “Count the knots, Mayta. Count the knots.” Then he looked over at me in the doorway and pushed the corner of a paper back up his sleeve. “My raft’s still half short of timber. No rush… you look after him first.”"
news = "At Callao the inspector has ordered a Chincha trader to read his cords out in Spanish before the court, and a raftsman who came all the way from Arica is standing at the back."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_choice.default]
news = "In the magistrate’s office at Callao a young Chincha trader read his cords through knot by knot, slowly. The inspector grew impatient but found no fault. The raftsman who had come from Arica went back as soon as the court rose, and the timber for his raft will have to wait out another winter."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_choice.choices.testify]
text = "Step up and vouch for Mayta: my ship has checked cargo against every knot on that cord."
reply = "I walked up to the desk and laid down the manifests of the three runs my ship had made from Chincha last year. The inspector leafed through them, looked at the cord, and nodded to the clerk. “Let him read.” Mayta drew a breath and began at the first knot, and he did not stick again, not even at the last. When he had finished he looked around for Ika. Ika was rolling his timber list into a tube and stuffing it back in his sleeve, grinning, his voice back at full volume. “I always said Mayta gets a knot wrong once in a dozen years!”"
news = "In court at Callao a young Chincha trader froze at the first word of his cords, until a ship’s captain stepped up to vouch for him and he finished. The raftsman from Arica at the back laughed loudest."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_choice.choices.raft_timber]
text = "Go to Guayaquil and bring Ika a load of balsa to make up the timber for his raft."
reply = "I did not go into the hall. I turned around, left the building and went straight down to the harbor, bound for Guayaquil. Behind me Mayta’s voice began, very slow, easing out one knot at a time. Three months later the balsa logs lay on the beach at Arica. Ika walked three times around the pile and said only two words: “That’ll do.” He set the thickest log aside for the bottom of the raft."
news = "Somebody has shipped a load of balsa from Guayaquil to Arica for the raftsman from Chincha. He walked three times around the pile and didn’t boast once."

[tracks.tie_new_mayta_qipu_ika.chapters.tie_new_mayta_qipu_ika_landing]
title = "A Name in Knots"
text = "On the beach at Arica, Ika’s raft went into the water. She was called Fox, after the dark shape in the Milky Way. Mayta had come from Chincha, more than ten days at sea, and tied the name into his own ledger cord: a strand of russet thread, three short knots around a long one, which was Ika’s mark. “I tie names slowly,” he said. “Feel it slowly.” Ika shut his eyes and went over it three times. “The new knots are tighter than the old. Same as when you retied the fortieth. I could tell by touch!” That night he did not boast and did not talk over anyone. He sat on the bow of the raft, leaned across and kissed Mayta. Next day Mayta took ship back to Chincha, with a cord of Ika’s tying in his bundle. The seventh knot was crooked. He looked at it once and left it."
news = "A new raft has gone into the water on the beach at Arica. Her owner is the loud one from Chincha, and her name is tied into somebody else’s ledger cord."

