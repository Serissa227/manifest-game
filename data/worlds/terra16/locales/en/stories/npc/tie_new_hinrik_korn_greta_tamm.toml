[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_landing.variants.v1_helped]
text = "A basket of eggs sat on the grain store threshold with a note pressed under them in a scribe’s hand: “The count can’t be empty.” One of the widows who had been paid had sent it, and Hinrik had entered the eggs in the books by number, fourteen. He stood on the threshold in his apron, and across the street the window of the countinghouse upstairs was open. “Tamm!” he shouted, as if reading out an account. “I get seasick. The moment I board. Every time I’m sick in the bilge and wipe my mouth before I come up. Last year, when they carried me off the ship at Visby, I should have owned up. I’ll never captain a ship!” “I know. I put the ginger in your pocket,” said the person in the window. A brick cart rattled between them. He waited for it to pass, crossed the street, and stood under the window with his face turned up. “From now on I run the grain store, and I’m not setting foot on a ship. A barrel can be empty—” “The count can’t,” said Greta, finishing it for him. She came down and kissed him in the countinghouse doorway."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_landing.variants.v2_covered]
text = "The day for the payment had come round. Hinrik stood on the grain store threshold in his apron with a small purse in his pocket: this month’s sum for the captain who had passed through. Across the street the window of the countinghouse upstairs was open. “Tamm!” he shouted, as if reading out an account. “I get seasick. The moment I board. Every time I’m sick in the bilge and wipe my mouth before I come up. Last year, when they carried me off the ship at Visby, I should have owned up. I’ll never captain a ship!” “I know. I put the ginger in your pocket,” said the person in the window. A brick cart rattled between them. He waited for it to pass, crossed the street, and stood under the window with his face turned up. “From now on I run the grain store, and I’m not setting foot on a ship. A barrel can be empty—” “The count can’t,” said Greta, finishing it for him. She came down and kissed him in the countinghouse doorway."

[tracks.tie_new_hinrik_korn_greta_tamm_side]
name = "Two Doors on One Street"

[tracks.tie_new_hinrik_korn_greta_tamm_side.chapters.side]
title = "The Granary and the Countinghouse"
text = "In the hall of the Shipmasters’ Guild, a ring of ship models hung from the ceiling. Greta laid two fair copies of the second ledger on the long table, one for the guild and one to take back to her own countinghouse. “From now on, before any ship leaves port, leave a copy of the crew roll and the wages on file. I’ve worked out the paper and ink: twenty pfennigs a ship.” The old master of the guild cleared his throat and turned to Hinrik. “Korn, weren’t you going to be a ship’s master? What are you doing standing behind the countinghouse girl?” “Seasick,” said Hinrik, briskly. “The sums at sea I’m done with. The ones on land, I’ll see through to the end. Twenty pfennigs wouldn’t even buy half a barrel of wheat.” The master looked at him, looked at her, and stamped the paper. Back in the street, he went in at the grain store door and she went in at the countinghouse door opposite. The windows lit up one after the other, and she pushed hers open and called out, “I’ll check your day’s count tonight!” “And I’ll check yours in the morning!” he called back."
news = "The Shipmasters’ Guild in Lübeck has made a new rule: before any ship leaves port, a copy of the crew roll and wages must be left on file. The countinghouse clerk’s daughter proposed it, and Korn from the grain store worked out the cost of paper and ink."

