[tracks.tie_new_hinrik_korn_greta_tamm_side.chapters.side.variants.helped]
text = "In the hall of the Shipmasters’ Guild, a ring of ship models hung from the ceiling. Greta laid two fair copies of the second ledger on the long table, one for the guild and one to take back to her own countinghouse. “From now on, before any ship leaves port, leave a copy of the crew roll and the wages on file. I’ve worked out the paper and ink: twenty pfennigs a ship.” The old master of the guild did not clear his throat. He only looked down at his hands. “I paid out plenty at the town hall that time.” He turned to Hinrik. “Korn, weren’t you going to be a ship’s master?” “Seasick,” said Hinrik, briskly. “The sums at sea I’m done with. The ones on land, I’ll see through to the end.” The master nodded and stamped the paper. Back in the street, he went in at the grain store door and she went in at the countinghouse door opposite. The windows lit up one after the other, and she pushed hers open and called out, “I’ll check your day’s count tonight!” “And I’ll check yours in the morning!” he called back."
