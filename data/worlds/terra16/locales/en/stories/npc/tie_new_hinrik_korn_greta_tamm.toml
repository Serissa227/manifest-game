[tracks.tie_new_hinrik_korn_greta_tamm]
name = "Across the Street"

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_meeting]
title = "Half a Barrel Short"
text = "The grain store on the Trave was unloading a shipload of wheat from Danzig. Hinrik crouched in the middle of the barrels, rapping each stave with a knuckle and calling the count under his breath: “Full. Full. Empty, strike it off.” Greta stood at the head of the gangplank with the bill of lading, checking it line by line, and at the last line her pen stopped. “Half a barrel short.” “Half a barrel?” He didn’t look up. “Spilled on the way, Tamm.” “Count the small sums too. Start again.” He sighed and started again. Somewhere past the thirtieth barrel his knuckle stopped. The top sounded dull and soft, and lower down the note went hard, like knocking on paving stone. They tipped it out: half a barrel of wheat, and under it half a barrel of fine sand. “A barrel can be empty. The count can’t,” Hinrik said, staring at the pile. “This one isn’t even empty. It’s lying.” Greta clapped once and wrote in the margin: sand, half a barrel. He laughed a beat late, then scooped the sand back into the barrel a handful at a time and pressed the lid down. “Keep it. We’ll need it when we have it out with the shipper.” By afternoon the seller was in the grain store’s black book."
news = "The grain store in Lübeck found half a barrel of sand in a shipment of wheat. A barrel-knocking apprentice and the countinghouse clerk’s daughter found it between them."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_closer]
title = "The Supply Ship"
text = "In those weeks the talk of war grew tighter by the day: the Danes were going to fight the Swedes, and Lübeck would send ships and grain. The grain store wanted a clerk for the supply ship, and Hinrik was the first to put up his hand, saying he would be mate in three years and master in five. On the trial run the ship dropped down the Trave to Travemünde, circled once on the open water, and came back. He came down the gangplank white as a sheet of paper, wiping his mouth on his sleeve. “Cold wind off the sea.” The midday sun was beating on the quay, and the porters were stripped to the waist. Greta looked up at the sky, asked nothing, and slipped a little twist of paper into his pocket, folded from an old bill of lading. “Ginger. Hold it in your mouth, don’t chew.” Then she opened the crew roll at the pay table and added a line under his name: “Next of kin: Tamm, countinghouse.” He had handed that column in empty. Hinrik read it upside down across the table, twice, and said nothing. He put a slice of ginger in his mouth and sucked on it until his eyes burned red."
news = "Lübeck is taking on hands for the supply ships that feed the fleet. The grain store’s apprentice was first to sign, and the countinghouse clerk’s daughter slipped a packet of ginger into his pocket on the quay."

