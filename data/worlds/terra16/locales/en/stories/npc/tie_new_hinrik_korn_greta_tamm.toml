[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_turning]
title = "The Storm off Gotland"
text = "At the end of July the Danish and Lübeck fleets lay off Visby, and one night of storm took a dozen ships and more, and nobody could count the drowned. News came home with the fishing boats, a little more each day, and the quay at Lübeck filled with women waiting, packed down the steps and into the water. The Tamm girl from the countinghouse came every evening at dusk. She didn’t cry. She carried a pot of hot soup and passed it down the line. They say the grain store’s apprentice wasn’t on the ship: the day before the storm he was put ashore at Visby, and the ship’s surgeon said it was something he’d eaten, and he said it was the cold. Later he came home on a fishing boat, and the moment he set foot on the quay every woman turned her head. “How many?” the Tamm girl asked. “Forty-three on our ship,” he said. “Just me left. The count is wrong.” She pushed the soup pot into his hands. “Drink it while it’s hot.”"
news = "A storm caught the Danish and Lübeck fleets off Visby and sank a dozen ships; the quay at Lübeck is full of women waiting for news."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_choice]
title = "The Book That Sank"
text = "After three days of sleet, the front room of the Tamm countinghouse was packed with the widows of drowned sailors, their wet shawls dripping rings onto the floor. I had come to collect a bill of lading and was wedged against the counter. The shipowner leaned on the wall and spread his hands: the pay book had gone down with the ship, there was no proof, and not one pfennig could be paid. A woman with a baby asked, “What day did my husband sign on?” Nobody could say. Greta crouched and pulled a second ledger from the bottom of a cabinet, its cover worn fuzzy, chalk dust along the page edges: every man’s day of signing on, every month’s pay in marks, not a pfennig out. She pushed it across to the shipowner, her hand shaking. “Count the small sums too.” Hinrik had somehow come to stand behind her. “A barrel can be empty. The count can’t.” The shipowner stared at the book for a long time, gritted his teeth and admitted half; the rest he would not budge on. Hinrik said the spare cash in the grain store’s till could front it, and he would square it with the owner. Every face in the room turned to me."
news = "The shipowner in Lübeck says the pay book went down with the ship, and the widows of drowned sailors are crowded into the countinghouse, not one of them able to say what day her man signed on."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_choice.default]
news = "The Lübeck shipowner has admitted to half the wages; the other half the grain store’s apprentice and the countinghouse clerk’s daughter advanced out of spare funds."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_choice.choices.get_wages]
text = "Take the second ledger to the town hall and win the widows their full wages."
reply = "Greta put the ledger in my hands. “Keep the pages in order.” I tucked it under my arm and walked all the way to the town hall. The clerk got as far as the third page, then stopped turning and sent for the shipowner. That afternoon the wages were paid in full, not a pfennig short. The widows queued for their money, and Greta stood at the table reading out names one by one; somewhere past a dozen, her tears fell on the page. Hinrik took the list from her hand and read out the rest, in a voice as dry as if he were reading a bill of lading."
news = "The Lübeck town hall made the shipowner pay the drowned sailors their wages in full. On pay day the countinghouse clerk’s daughter broke down halfway through the names, and the grain store’s apprentice read out the rest."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_choice.choices.cover_half]
text = "Pay the remaining half of the wages in the grain store’s place, so the two of them don’t fall into debt."
reply = "I tipped my purse out on the counter and counted out the half the grain store was to advance, coin by coin. Hinrik counted it twice and pushed one back. “One pfennig too many.” Then, stern-faced: “I’ll pay this back. By the month. Not a pfennig short.” Greta turned to the last page of the second ledger, wrote my name and the sum, and added two words beside it: no hurry."
news = "A captain passing through Lübeck made good half the widows’ wages for the grain store. The apprentice says he will pay it back by the month; the countinghouse clerk’s daughter wrote “no hurry” in her book."

[tracks.tie_new_hinrik_korn_greta_tamm.chapters.tie_new_hinrik_korn_greta_tamm_landing]
title = "No More Ships"
text = "On a clear morning, new barrels of rye were rolling past the grain store door. Hinrik stood on the threshold in his apron. Across the street, the window of the countinghouse upstairs was open. “Tamm!” he shouted, as if reading out an account. “I get seasick. The moment I board. Every time I’m sick in the bilge and wipe my mouth before I come up. Last year, when they carried me off the ship at Visby, I should have owned up. I’ll never captain a ship!” The person in the window did not draw back. “I know. I put the ginger in your pocket.” A brick cart rattled between them. He waited for it to pass, crossed the street, and stood under the window with his face turned up. “From now on I run the grain store, and I’m not setting foot on a ship. A barrel can be empty—” “The count can’t,” said Greta, finishing it for him. She came down and kissed him in the countinghouse doorway."
news = "The grain store’s apprentice in Lübeck shouted across the street at the countinghouse window that he would run the grain store from now on and never go to sea again. The countinghouse clerk’s daughter heard him out, came down and kissed him."

