# 退回去的米（tie_new_ayame_kogo）的英文显示覆盖：按轨道、章节、选项、变体的 key 嵌套；只写显示文字，不复制玩法。
# C21b（2026-11-12）：中文重写后，下列章节的英文与中文对不上，且新加了选项与变体；照“缺译回退中文”（整章未译可回退）整章删掉，待以后照新中文重译：tie_new_ayame_kogo.tie_new_ayame_kogo_choice、tie_new_ayame_kogo.tie_new_ayame_kogo_landing。
# C7 新线，2026-10-11，Claude（Opus），与中文稿同一轮写完。效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。
# 专名：Ayame（Ōinomikado）、Kogo、Kyoto、Upper Kyoto、Kenrei Gate、Ōmi、Owari、Oda。
# 口头禅：菖 “Straighten your sleeves before you speak.”（照人物卡，只在 meeting 用一次，上臈的回话与落点只换说法呼应）；小督的口头禅本线不用原句，choice 里只有一句呼应。

[tracks.tie_new_ayame_kogo]
name = "The Rice Sent Back"

[tracks.tie_new_ayame_kogo.chapters.tie_new_ayame_kogo_meeting]
title = "Inside the Gate, Outside the Gate"
text = "The first summer after the academy, Ayame entered the palace in the train of a senior lady-in-waiting, and Kogo rented a little house in a lane of Upper Kyoto and wrote letters for hire. Beside the Kenrei Gate a stretch of the earthen wall had fallen in, and someone had stopped the gap with a bamboo fence. Kogo had come with a letter for the old gate servant to send his mother in Ōmi; he couldn’t write. A line of women came out through the gate, Ayame last of all, carrying her lady’s lacquered letter box. She saw Kogo, looked away, and walked past without a crease in her sleeves. Kogo stepped back against the bamboo and bowed to that retreating back, very correctly. “If your lady ever needs a hand to write for her, I’m under the persimmon tree in Upper Kyoto.” Ayame’s step faltered. She didn’t turn around. “Straighten your sleeves before you speak.” The gate servant stood holding his letter, looking in through the gate, then out."
news = "At the Kenrei Gate in Kyoto, a palace girl with a letter box walked straight past the girl who writes letters for hire. One bowed to her back, the other never turned, and the old gate servant just stared."

[tracks.tie_new_ayame_kogo.chapters.tie_new_ayame_kogo_closer]
title = "Returned as It Came"
text = "Two days before the autumn poetry gathering, Ayame’s maid left the palace with a sack of rice and knocked at the little house under the persimmon tree in Upper Kyoto. Early next morning the rice came back exactly as it had gone, with a slip of paper tied to the straw cord at its neck, in that kana hand nobody ever has the heart to burn: “This time, please write it yourself.” Ayame spread the slip under the lamp and sat up with it all night, grinding her ink dry twice. At the gathering she read the poem she had written. The judge stopped twice in the middle of his verdict, and the whole room studied its fans. Afterward she called for her maid. “Take a box of sweets outside the palace.” The maid asked what message should go with it. “None.” The next day the maid came back with a slip that said only, “Not badly written.” Ayame read those three words over and over, then pressed the slip between the pages of her poetry book."
news = "At the autumn poetry gathering in the Kyoto palace, the Ōinomikado daughter lost, and lost badly. Afterward her maid carried a box of sweets out through the palace gate, and nobody knows for whom."

[tracks.tie_new_ayame_kogo.chapters.tie_new_ayame_kogo_turning]
title = "Oda’s Soldiers in the Capital"
text = "In the lines outside the rice shops of Upper Kyoto there’s only one thing to talk about: Oda of Owari has marched into the capital with the new shogun, and the streets are full of soldiers. Some say his men lose their heads for stealing a single coin. Some say Oda went into the palace once, saw the walls falling down, and had them measured on the spot, because he means to pay for the palace to be rebuilt. The girl under the persimmon tree who writes letters for hire has a line at her door until dark: soldiers writing to their mothers in Owari, townsfolk writing to kin in the country to say they’re safe. One soldier couldn’t think what to say. After a long struggle he got out, “Tell her I’m not dead.” She wrote exactly that, then added two lines about the Kyoto weather. Even a maid from the Ōinomikado house stood in the line once. She had no letter, only a question from her mistress: “The one under the persimmon tree—is she keeping well?” The girl didn’t look up. “Tell her rice has doubled in price. My letters are still a measure apiece.”"
news = "Oda of Owari has brought the new shogun into Kyoto, and the city is full of soldiers. The girl under the persimmon tree in Upper Kyoto has people lined up for letters home until dark."
