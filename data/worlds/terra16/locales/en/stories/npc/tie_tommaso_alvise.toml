# C7 英文覆盖：戏衣要还（托马索 × 阿尔维塞）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标，只有回忆标题需要译文。

[tracks.tie_tommaso_alvise]
name = "Return the Costume"

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_meeting]
title = "The Wrong Robe"
text = "On the third night of Carnival, Alvise climbed the stairs to the company’s storeroom with a bundle of wax-sealed dispatches under his arm. He wanted a costume that would get him into a banquet. Tommaso dug down to the bottom of the chest and shook out a robe patched three times: elbow, cuff, hem. “Do you want to play a man, or a bolt of cloth?” Alvise frowned. “There’s more patch than robe.” “At a banquet every eye is on the best-dressed man. That’s a candle burn. That’s where a servant yanked it in Padua. I never forget a costume I’ve lent out.” Tommaso reached to move the bundle off the lid of the chest, but Alvise’s hand got there first. “Before this is opened, ask who has the right to open it.” “I only open costume chests.” That night Alvise walked into the banquet in the patched robe, and not one guest looked at him twice. The next day the robe came back folded square. In the pocket was a scrap of waste paper with one word on it, “Thanks,” and the back was covered in writing. Tommaso didn’t turn it over."
news = "At Carnival in Venice a secretary borrowed a thrice-patched costume from the players, wore it to a banquet, and not one guest looked at him twice."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_turning]
title = "The Borrowed Name"
text = "All summer the taverns of Venice have told the same story: a letter that was never meant to be opened fell into outside hands, and it was signed with an actor’s name. The creditors followed the name to the company and waited at the edge of the stage until the play was half over. “The man who plays Pantalone owes us two hundred ducats!” somebody shouted. The audience took it for a new gag and clapped. “Pantalone owes no money—only a beating!” Tommaso shot back, quick as ever, until a creditor held up the paper and read out a line from the letter: “The remainder follows on the next ship; no separate receipt. —Tommaso.” Pantalone took off his mask, and under it was Tommaso’s face. He was chased out of the square and down three streets, then slipped in by the back door of an inn and didn’t dare light a lamp."
news = "The taverns of Venice are saying a letter was signed with the actor Tommaso’s name. Creditors waited at the stage until the play was half over and chased him down three streets."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_choice]
title = "Out in the Open"
text = "Alvise had come back to Venice with his dispatches again. He had barely put his bags down at the inn by the Rialto Bridge when Tommaso blocked the doorway, holding two scraps of paper: the letter the creditors were passing off as an IOU, and last year’s slip that said “Thanks.” Tommaso hauled him out to the yard, to a wine barrel, and slapped the two side by side on its lid. “Look at the hook at the end,” he said. “This sentence is a line from the play. The next one is true: you borrowed that name.” Alvise turned the letter over and looked at the back. “Official business. I can’t talk about it.” “Then say what you can.” Alvise said nothing. Everyone in the yard had stopped what they were doing. Tommaso turned his head first; after a moment Alvise turned too, and the two of them looked at me."
news = "In an inn yard in Venice, the actor whose name was borrowed cornered a secretary beside a wine barrel and told him to say it plainly."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_choice.default]
news = "In Venice the actor’s creditors all vanished overnight and nobody saw who paid. The company’s name never quite got clean."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_choice.choices.clear_name]
text = "Go with Alvise to the creditors’ counting room and have him write a correction under his own name."
reply = "The counting room was behind the fish market, a weight on one side of the table and a chipped inkwell on the other. Alvise asked for a fresh sheet and looked at both sides before he wrote. The correction was one sentence: the signature on that letter had nothing to do with the actor Tommaso. He signed it with his own full name. The clerk raised an eyebrow. “That’s all?” “That’s all.” Tommaso flicked the duplicate the clerk had copied out for him. “Enough to get three of your IOUs torn up.” Back at the storeroom he tacked the copy inside the lid of the costume chest."
news = "A secretary in Venice signed his own name in the creditors’ counting room, stating that the letter had nothing to do with the actor Tommaso. The company kept a copy inside its costume chest."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_choice.choices.pay_creditors]
text = "Pay off the false IOU the creditors hold against the company."
reply = "The creditor counted out the silver I had handed over, tore the IOU in two, put one half in his purse and pushed the other across to Tommaso. Tommaso held his half and turned to Alvise. “The captain paid. You owe the favor.” “I’ll remember it.” “Is that sentence a line, or is it true?” Alvise didn’t answer. He took the torn half from him, turned it over to look at the back, and handed it back."
news = "A ship’s captain in Venice has paid off an actor’s creditors. The actor says the money was the captain’s but the favor is owed, and the secretary must settle that himself."

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_landing]
title = "A Costume to Borrow Again"
text = "The third winter, Alvise climbed the storeroom stairs again. Tommaso didn’t open the chest. First he pulled a folded sheet out of his shirt and slapped it on the lid: where to, how many days, when it comes back. The last line he had added himself: No borrowing names. The creditors had melted away the winter before in a single night, and Tommaso had never asked who paid; he had only written that line bigger than all the rest. “You write even this down.” “Pantalone keeps good accounts.” Tommaso held out the pen. “Don’t sign, and the costume doesn’t leave the room.” Alvise read it through, signed, and flipped the sheet over. Nothing on the back. He looked up. Tommaso was trying not to laugh. “What are you looking for?” “Habit.” Tommaso lifted a new robe from the bottom of the chest, without a single patch on the elbow. He had paid for the cloth himself, and the books had it down as Pantalone’s new wardrobe. “This time, play a man.”"
news = "The players in Venice now make you sign a sheet before you borrow a costume, and one line on the sheet reads “No borrowing names.”"

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_landing.default]
effects = [{}, {}, { title = "A Costume to Borrow Again" }]

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_landing.variants.helped]
text = "The third winter, Alvise climbed the storeroom stairs again. Tommaso didn’t go digging for costumes. First he pulled a folded sheet out of his shirt and slapped it on the table: where to, how many days, when it comes back. The last line he had added himself: No borrowing names. He lifted the lid of the chest, and inside it the copy of the correction was still tacked up, its corners curling. He tapped it with the tip of his pen. “That’s where the last line came from.” “You write even this down.” “Pantalone keeps good accounts.” Alvise read the sheet through, signed, and flipped it over. Nothing on the back. He looked up. Tommaso was trying not to laugh. “What are you looking for?” “Habit.” Tommaso lifted a new robe from the bottom of the chest, without a single patch on the elbow. He had paid for the cloth himself, and the books had it down as Pantalone’s new wardrobe. “This time, play a man.”"

[tracks.tie_tommaso_alvise.chapters.tie_tommaso_alvise_landing.variants.paid]
text = "The third winter, Alvise climbed the storeroom stairs again. Tommaso didn’t open the chest. First he pulled a folded sheet out of his shirt and slapped it on the lid: where to, how many days, when it comes back. The last line he had added himself: No borrowing names. A torn half of the IOU was pinned to the corner of the sheet. “The interest on that favor is the last line.” “You write even this down.” “Pantalone keeps good accounts.” Alvise read the sheet through, signed, and flipped it over. Nothing on the back. He looked up. Tommaso was trying not to laugh. “What are you looking for?” “Habit.” Tommaso lifted a new robe from the bottom of the chest, without a single patch on the elbow. He had paid for the cloth himself, and the books had it down as Pantalone’s new wardrobe. “This time, play a man.”"
