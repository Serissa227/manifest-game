[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_turning]
title = "The Great Plague"
text = "All summer Lisbon has been dying a street at a time. Those with money hired carts and left for the hills. Those who stayed nailed their doors and shutters shut so the bad air couldn’t get in, and the physicians say the same: close the windows, burn incense, stay indoors. Only the girl next door to the doctor’s throws every shutter wide each morning, and the neighbors across the street call her mad. She shouts back, “It’s stifling in there! People can’t breathe! Keep yours shut and I’ll keep mine open!” The apothecary’s apprentice had saved for five years to get his name on next March’s Goa ship. A few days ago someone saw him standing at the clerk’s desk. The clerk asked, “Duarte Ervas. Strike you off?” He stared at the line for a good while. “Strike it. Once the plague is over, we’ll see.”"
news = "Plague in Lisbon: the physicians tell every house to shut its windows and burn incense, but the girl next door to the doctor’s throws hers open and is called mad. The apothecary’s apprentice has struck his name off the Goa ship."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_choice]
title = "The Ward That Opened Its Windows First"
text = "The empty warehouse by the river used to stack sacks of pepper. Now every high window was thrown open and dust turned in the shafts of light. Beatriz stood at the door with a stick of charcoal between her fingers. For every patient carried in she asked a name and wrote it on the wall beside the door, and for everyone who didn’t pull through she drew a line. She never passed off a dressing to anyone else; her hands still shook, and she changed it anyway. The wall by the door was full, and the names had spread to the third pillar. From the back room Duarte’s voice came out hoarse: “The wormwood ran out yesterday. I won’t give out mugwort in its place. One wrong handful could kill.” He had been mixing medicines in there all night. “The doctor won’t come, and the apothecaries are stripped bare,” she said, holding the charcoal out to me. “Open the window first. That part’s done. The two things left are medicine and hands. Can you find us some?”"
news = "There is a ward by the Lisbon riverside with every window open, and the wall by its door is covered with patients’ names, a line through each one that didn’t pull through."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_choice.default]
news = "In the plague, an empty warehouse by the Lisbon river has become a ward with every window open. Medicine and hands are short, and on the wall by the door many names have a line through them."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_choice.choices.bring_supplies]
text = "Hand Duarte the two draughts you brought, then hire men at the quay who’ll go into the warehouse."
reply = "Duarte pulled the stopper, sniffed, and stood both gourds on the nearest windowsill. “Not watered down.” I shouted at the quay for a good while before three porters came, each with a vinegar-soaked rag stuffed under his nose, and they went straight in to haul water, turn patients over and empty buckets. That night no new line appeared on the wall, and for the first time Duarte lay down and slept straight through."
hint = "Duarte only takes brewed draughts, and he needs two. If you have none, find another way to help her."
news = "At the Lisbon riverside ward with its windows all open, a batch of medicine and three porters arrived this week, and the apprentice in the back room finally got a night’s sleep."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_choice.choices.write_names]
text = "Stay and write the name of everyone carried in on the wall for her."
reply = "I went through eleven sticks of charcoal. Each patient who came through the door, I asked for a name first and wrote it out letter by letter on the wall, rubbing out mistakes with my sleeve. There was a small child who couldn’t speak; I asked three times and finally asked the neighbor who had carried him in. At night Duarte came out to count the wall, said nothing, and left a packet of freshly ground powder by my hand. The day winter began, Beatriz pointed to the long stretch of wall with no lines through it. “Those are yours. You wrote them down.”"
news = "On the wall of the open-windowed ward by the Lisbon riverside, a whole new stretch of names has appeared. They say a foreign captain crouched at its foot day after day writing them down for her."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_landing]
title = "No Voyage to India"
text = "The plague had passed. Beatriz had signed the lease on the warehouse by the river herself, and the shutters were fixed with iron hooks to stand open all year round. Duarte moved his mortar into the back room, and on the lowest shelf of the cabinet lay a stack of his grandmother’s recipes, every sheet in a different hand. She could tell they were all his. He set the book from Goa on the shelf and closed its cover. “I’m not going to India. The vines and leaves are in the book. The patients of Lisbon I have to learn here.” Beatriz leaned against the doorframe. “Are you staying for the ward, or for me?” He put the last packet of powder into a drawer. “Know the leaf before you learn the name,” he said, and looked up. “You come before both.” She laughed out loud, crossed the room and kissed him."
news = "After the great plague in Lisbon, the ward with the open windows by the river has been leased for good, and the apothecary’s apprentice tells anyone who asks that he is not going to India."

