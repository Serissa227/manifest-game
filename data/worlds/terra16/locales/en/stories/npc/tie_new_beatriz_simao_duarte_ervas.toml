# 先开窗的病房（tie_new_beatriz_simao_duarte_ervas）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。口头禅与英文人物卡一致：Open the window first. / Know the leaf before you learn the name.

[tracks.tie_new_beatriz_simao_duarte_ervas]
name = "The Ward That Opened Its Windows First"

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_meeting]
title = "Name First"
text = "A sailor lay on the bench in the doctor’s front room, burning with fever, his lips cracked and peeling. Beatriz didn’t touch the medicines. She opened the case book first. “What’s your name?” The sailor rasped, “…Vicente.” “Vicente.” She wrote it down, then went along the row pushing the shutters wide, one by one. “Open the window first.” The apothecary’s apprentice came in with a basket just then. He set it on the table, never looked at the patient, and drew a leaf in the corner of a sheet of paper, its edge cut fine and ragged. “Wormwood. Know the leaf before you learn the name. This one is gray on both sides, so don’t mix it up with mugwort, which is white underneath. Grab the wrong handful and the fever won’t break.” Beatriz looked over her shoulder. “He has a name. Write that first.” Duarte’s pen stopped. Then, beside the leaf, he wrote one word: Vicente."
news = "A sailor was carried into a doctor’s house in Lisbon, burning with fever. The girl next door asked his name before anything else, and the apothecary’s apprentice drew a wormwood leaf in the corner of a sheet."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_closer]
title = "The Book from Goa"
text = "The doctor’s house had just taken delivery of a book by Doctor Orta, printed in Goa: Portuguese, two physicians talking drugs back and forth, the spine still damp from the voyage, and not one picture in it. Duarte bent over the table and turned to the page on pepper, and his finger stopped. “It says how the vine climbs and how wide the leaf is, and there’s no picture. I want to go and look, and come back and draw it.” “Then go,” said Beatriz without looking up. “I’ll ask about a passage for you.” She was crouched by a dockworker’s leg, unwinding a bandage glued to the wound with dried blood, turn by turn, and her fingers shook too much to hold the end of the cloth. Duarte saw. He shut the book and crouched down beside her. “You hold the leg. I’ll change it.” When it was done he washed his hands in the basin. “Know the leaf before you learn the name. First learn what you’re afraid of.” Beatriz didn’t answer. She got up and pushed the window open."
news = "Doctor Orta’s book, printed in Goa, has reached Lisbon, and there isn’t a single picture in it. The apothecary’s apprentice leafed through it and said he means to go to India and see those vines and leaves for himself."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_closer.default]
