[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_landing.variants.helped]
text = "The plague had passed. Beatriz had signed the lease on the warehouse by the river herself, and the shutters were fixed with iron hooks to stand open all year round. Duarte moved his mortar into the back room, and on its windowsill stood two empty draught gourds, sent over that autumn, which he couldn’t bring himself to throw away. On the lowest shelf of the cabinet lay a stack of his grandmother’s recipes, every sheet in a different hand. She could tell they were all his. He set the book from Goa on the shelf. “I’m not going to India. The vines and leaves are in the book. The patients of Lisbon I have to learn here.” Beatriz leaned against the doorframe. “Are you staying for the ward, or for me?” “Know the leaf before you learn the name,” he said. “You come before both.” She laughed out loud, crossed the room and kissed him."

[tracks.tie_new_beatriz_simao_duarte_ervas.chapters.tie_new_beatriz_simao_duarte_ervas_landing.variants.names]
text = "The plague had passed. Beatriz had signed the lease on the warehouse by the river herself, and the shutters were fixed with iron hooks to stand open all year round. She wouldn’t let anyone whitewash the wall by the door. The charcoal names were still there, and survivors dropped by every so often, found their own, and traced it with a finger. In the back room, on the lowest shelf of the cabinet, lay a stack of recipes from Duarte’s grandmother, every sheet in a different hand. She could tell they were all his. He said, “I’m not going to India. The vines and leaves are in the book. The patients of Lisbon I have to learn here.” “Are you staying for the ward, or for me?” “Know the leaf before you learn the name,” he said, and looked up. “You come before both.” She laughed out loud, crossed the room and kissed him."

[tracks.tie_new_beatriz_simao_duarte_ervas_side]
name = "Names First, Leaves First (Side by Side)"

[tracks.tie_new_beatriz_simao_duarte_ervas_side.chapters.side]
title = "Names First, Leaves First"
text = "The ward in the old warehouse by the river keeps its windows open all year. Duarte gave up his passage to Goa and opened a dispensary in the empty room next door, its wall covered with leaves he drew, each with a line underneath: wormwood, gray on both sides; mugwort, white underneath. Patients give their names at the ward door, Beatriz writes them in her book, then sends them next door. Duarte points at the wall. “Know the leaf before you learn the name. What you take home has to be this one.” A sailor came up with a fish in his hand and stood in the doorway. “Vicente. You asked my name about ten years ago.” Beatriz didn’t look up. “I remember. You were so feverish you couldn’t recognize a soul. The dispensary’s next door. Go and learn the leaf.”"
news = "The ward with the open windows by the Lisbon riverside has been leased, and a dispensary has opened next door with its walls covered in drawn leaves. Patients give their names first, then go next door to learn their medicine."

