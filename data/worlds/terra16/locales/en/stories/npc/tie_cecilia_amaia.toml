# C7：tie_cecilia_amaia 的英文显示覆盖（按轨道、章节、选项与变体的 key 对应）；不复制玩法。

[tracks.tie_cecilia_amaia]
name = "Awake for Her"

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_meeting]
title = "The Borrowed Basin"
text = "The Biscay iron ship had been in three days when three of its sailors went down with fever, raving. The herbalist who had come with the cargo went along the wharf asking for a basin, and the doors shut one after another; someone spat “witch” through a closed shutter. When she stepped into the mask shop behind the wharves, Cecilia was brushing gesso onto a paper shell. The owner held out an unpainted white mask with her sweetest smile. “What face will it be? Laughing, weeping, I have both. Keep your name to yourself.” “Amaia.” She didn’t take it. “I need a basin of clean water. It’s my hands I have to wash.” The smile stopped on Cecilia’s face. She brought water from the back room and set it in the doorway, watched Amaia push her sleeves to the elbow, and put her own hands in as well. A smell of fennel rose off the water, the same as the bundle of stalks under her pillow. She said nothing, only nudged the basin a little toward Amaia. Two weeks later all three sailors were on their feet. On the morning the iron ship left, a small bunch of dried fennel hung from the mask shop’s doorframe."
news = "The mask shop behind the Venice wharves lent a basin of water to the herbalist off the Biscay ship, and the three sailors who were raving with fever were up and about within two weeks."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_closer]
title = "Awake for Her"
text = "The iron ship came back the next winter. One evening after Saint Lucy’s Day the mask shop put its shutters up early, and Cecilia’s face was as white as fresh gesso. “Sit. Hold out your hand,” said Amaia. The hand Cecilia held out was clutching a bundle of fennel stalks, and she pressed them into Amaia’s palm. “If you can’t wake me, don’t fetch a priest, and don’t fetch a doctor. And don’t turn me over.” She lay down as if dead; a long while passed between one breath and the next. Amaia sat the whole night with the fennel in her fist. Toward dawn Cecilia’s hand had gone frighteningly cold, and Amaia cupped it between both of hers and began, very low, the old prayer her mother had taught her. Cecilia opened her eyes, and the first thing she saw was those healer’s hands. “I’ve been out fighting all night, and here you were, keeping the door for me.” “Fighting who?” “Witches.” She laughed. “Don’t worry, not one of them can cure a fever. I was born in the caul. And I heard those prayers of yours. That’s enough to burn the pair of us.” Amaia didn’t let go of her hand. She bent and kissed her."
news = "On the Ember night in Advent, the lamp in the mask shop behind the Venice wharves never went out, and the herbalist from Biscay didn’t lift the shutters to leave until daylight."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_closer.default]
effects = [{}, { title = "Awake for Her" }]

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_turning]
title = "Born with the Caul"
text = "All summer the Friulian peddler who sells needles and thread under the Rialto bridge has had one piece of news from home for anyone who’ll listen: the court at Aquileia has called in some country people and asked them where they went on the nights of the Ember Days. “They all give the same answer,” he says, dropping his voice. “Every one of them swears he was born with the caul.” This season the mask shop behind the wharves puts its shutters up before dark. When the neighbors ask why, the owner laughs. “Carnival’s a long way off. Nobody’s buying faces.” The sailors on the Biscay iron run say she gave them three letters for Bilbao, each thinner than the last; the third felt like an empty fold of paper. Amaia opened it on the quay and glanced at it. “One word.” She didn’t wait for the winter iron ship. She took the first boat leaving for the Mediterranean."
news = "The Friulian peddler under the Rialto bridge says the court at Aquileia is questioning country people from his parts: on the Ember nights, where exactly did you all go?"

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_choice]
title = "A Berth for Whom"
text = "A bailiff in black nailed the summons to the mask shop’s shutter: Cecilia dal Pozzo is to appear before the court and say what her Friulian countrymen did on the nights of the Ember Days. In the back room Amaia pounded herbs without looking up. “Tell them what you know. Don’t tell them what those men never did.” “And when they get around to asking about me?” Cecilia laid three masks out on the table: one laughing, one weeping, one with no expression at all. “Which one should I wear? Judges like the weeping kind, I bet.” At the back of the cupboard lay a fourth, edged in gilt; one Carnival a gentleman had left it with her as a pledge for a favor he owed. She didn’t reach for it. Halfway through her laugh she stopped and looked up at me."
news = "This winter the woman from the mask shop behind the Venice wharves is forever at the court, and the herbalist from Biscay waits for her on the bridge opposite, all day long."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_choice.choices.noble]
text = "Go to the gentleman who pledged the gilt mask and ask him to speak for her outside the court."
reply = "The gentleman stood in the arcade outside the court for a quarter of an hour and said a few words to someone; I was too far off to hear them. Cecilia was called in once and was out before dark, and her name never went into the file. Back at the shop she took the gilt mask from the back of the cupboard and, without a glance at it, shoved it into the stove. “That favor’s paid.”"
news = "The Venice court called the mask-shop woman in only once and sent her home the same day. They say a gentleman with a gold ring was standing in the arcade that afternoon."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_choice.choices.ragusa_ship]
text = "Book the two of them passage to Ragusa, and ask Frana, the Ragusan envoy, for a residence permit."
reply = "I booked two berths. Frana heard me out, wrote the permit then and there, sealed it, and kept it under her hand on the desk. “Come for it on the day you really mean to leave.” Amaia folded the two tickets in half and pushed them to the bottom of her medicine bag. “They can wait.” The ship sailed for Ragusa on time, with two berths empty."
news = "Word on the Venice quay is that somebody booked two berths to Ragusa for the mask-shop woman and the herbalist from Biscay. The ship sailed with both berths empty."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_choice.choices.listen]
text = "Sit up with her till morning and hear about her first time out on an Ember night."
reply = "I did nothing but listen. She told me about her first night out, a winter night in her teens: mist rising on the paths between the fields, a fennel stalk shaking so hard she could barely hold it. Halfway through she started laughing at herself, and she talked until the window went gray. The next day she went to the court alone. She came back at dusk and put the three masks away in the cupboard, untouched. “I answered everything they asked. What they didn’t ask, I didn’t say a word about.”"
effects = [{}, { title = "Tales of the Ember Nights" }]

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_landing]
title = "The Second Window"
text = "Last winter the sentence came down at Aquileia: the Friulian men confessed, were given penances and served half a year in prison. In spring Cecilia and Amaia came ashore at Ragusa with a medicine chest and a crate of mask molds. They rented two rooms above a cooper’s by the harbor. By day Amaia saw to sailors on the quay, and the front window filled with drying herbs; the back window was Cecilia’s, where a few masks hung only before Carnival, and after dark she wouldn’t open the shutter for anyone who knocked. The back room of the Bilbao tavern stood empty now; anyone there who wanted news of them had to wait for a letter from Ragusa. Amaia tied the last bunch of wormwood to the window bar and turned around. “Nobody here knows our faces.” Cecilia was pressing a wet sheet into a mold, and she smoothed it flat before she answered. “Then we’ll make new ones.”"
news = "Two women from abroad have moved in by the Ragusa harbor. One doctors the sailors; the other takes mask work only before Carnival. Word is they came over from Venice."

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_landing.default]
effects = [{}, {}, { title = "The Second Window" }]

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_landing.variants.v1_ragusa]
text = "Last winter the sentence came down at Aquileia: the Friulian men confessed and were given penances. In spring Cecilia and Amaia went to Frana’s desk and collected the permit at last. Its edges had yellowed; the seal was still red. A shop opened on the Ragusa waterfront with the permit nailed to the doorframe and a small bunch of dried fennel hanging beside it. It had two windows, herbs drying in the left and masks in the right. Sailors who came to be treated bought a Carnival face on their way out, and ladies who came for a mask went home with a packet of fever powder. Amaia wiped out the mortar. “Nobody here knows our faces.” Cecilia hung a new mask in the right-hand window. “Then we’ll make new ones.”"

[tracks.tie_cecilia_amaia.chapters.tie_cecilia_amaia_landing.variants.v2_helped]
text = "Last winter the sentence came down at Aquileia: the Friulian men confessed and were given penances, and Cecilia’s name was nowhere in the file. They left without hurry, hired a boat and crated every last mold from the shop. Before they went, Cecilia finished one final mask for the gentleman’s daughter, and the girl paid for it out of her own purse. In Ragusa they rented two rooms by the harbor, herbs drying in the front window, masks in the back. Amaia counted the crates. “Nobody here knows our faces.” Cecilia opened the top one and laid the molds out on the table one by one. “Then we’ll make new ones.”"
