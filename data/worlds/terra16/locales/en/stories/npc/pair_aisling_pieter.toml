# Her Ship, His Shore (pair_aisling_pieter) — English display overlay: nested by track, chapter, choice and variant key; display text only, no gameplay.
# The effects arrays line up by index with the Chinese file; only memory titles need text, every other slot is an empty table.

[tracks.pair_aisling_pieter]
name = "Her Ship, His Shore"

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_meeting]
title = "Brought Aboard"
text = "A Galway merchant had put up the money to have the Connacht coast drawn, and the man he hired, Pieter, came down to the quay and found his drawing case already lashed to a mast, with a knot that was both tight and handsome. “I’m inviting you aboard!” The woman at the foot of the mast had a voice that turned half the quay around. She grinned and held out a hand. “Come or don’t, that’s your call. Once you’re on, where we go is mine.” Pieter looked at the case, then at the gangplank, and went aboard. Within the hour he was hanging over the rail, being sick. He wiped his mouth and went on drawing. As they slid past a reef he finished a page and pointed at the shore. “That rock. It looks like a dog crouching.” “A dog!” Aisling slapped the gunwale, laughing. “We call it Old Crouch. You didn’t get one hair wrong!” At a narrow inlet she caught his pen hand. “Not this one.” Pieter glanced up and asked nothing. With the tip of his knife he scraped away the line he had just begun, right in front of her, until the paper was clean."
news = "The O’Flaherty woman captain in Galway has “invited” a mapmaker from the Low Countries aboard her ship. They say he was sick the whole way, and drew it all true anyway."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_closer]
title = "The Reef at Ebb"
text = "Pieter had put one reef in the wrong place, half a ship’s length off. Aisling took one look at the chart and knew. “You drew that lying down. Don’t blame the reef.” She didn’t laugh at him. The next day she anchored outside that reef and said they would wait. They waited out a whole ebb. The water fell slowly, the crew grumbled from noon till evening, and nobody dared go ashore. The rock rose out of the sea inch by inch, black and wet, and it sat farther west than on the chart. Pieter crouched at the rail to correct it. When the anchor rope eased, the hull swung half around and the marks on the shore slid away, and he cried out without turning his head. “Hold the coastline still. Let me finish.” “The sea keeps the coastline,” Aisling shouted from behind him. “Not me!” When he was done he wrote a line of small letters in the margin: “Pointed out by Aisling O’Flaherty.” She leaned over and looked at it longer than she had looked at the reef. Then she tapped the line with one finger. “The writing’s too small.”"
news = "A ship off Galway sat half a day outside one reef waiting for the tide to fall. The people aboard say it was so the mapmaker could see it properly."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_turning]
title = "Ireland in the Atlas"
text = "Antwerp had printed a new atlas, Master Ortelius’s great Theatrum, and a merchant up from the Low Countries brought a copy home to Galway and spread it across a tavern table for everyone to pass around. When they reached the page for Ireland the whole table laughed. “The west coast looks like a cheese the mice got at!” The bays around the O’Flaherty lands were blank on the sheet. “No wonder that family’s ships are always popping up out of the sea!” When the joke reached Aisling she pounded the table, laughing, and said it was well drawn and not one word should be changed. The mapmaker on her ship was another matter. They say he sat over the atlas all night and the lamp burned until dawn. The next day someone on the quay saw him holding a letter sealed with wax in a stranger’s stamp. It had come from Duisburg, where they say a Master Mercator makes maps for a living."
news = "A new atlas printed in Antwerp has reached Galway, and its west coast is a mess. They say the mapmaker aboard the O’Flaherty ship sat up all night over it."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_choice]
title = "Bays in Charcoal"
text = "A letter had come from Mercator’s workshop in Duisburg inviting Pieter to join them, to leave in the spring. He wanted to take the Connacht drafts he had made over the years and put his own name on them. But the drafts showed the bays where Aisling’s family hid their ships. Aisling barged into my cabin with the drafts in her arms, Pieter at her heels. She spread them over the bunk and the table and began circling places in charcoal, pressing hard. “These. If you drew them, you scrape them off.” Pieter stood still, one hand on the corner of the top sheet, its edge already fuzzy from his thumb. “I could take the ones you haven’t circled.” “Take them. Put your own name on them. You drew the coast. The bays belong to my family.” She flung the charcoal onto the table. There was no softness in her. “I invite people aboard. I don’t invite them to stay.” They both looked at me."
news = "Word on the Galway quay is that the mapmaker on the O’Flaherty ship is bound for Duisburg, and the woman captain never said one word to keep him."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_choice.choices.send_drafts]
text = "Have the circled bays scraped off, then send the drafts to Antwerp for Pieter"
reply = "I wrapped the drafts in oilcloth and gave them to a bookseller I knew in Antwerp to pass along, under Pieter’s name. The circled places he scraped away on the spot, his knife flat against the paper, until you could not tell anything had ever been drawn there. Aisling watched with her arms folded and said nothing. When the last sheet was done she swept the shavings off the table into her palm, closed her fist on them, and walked out."
effects = [{}, {}, {}, { title = "Scraped Clean" }]

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_choice.choices.carry_letters]
text = "Promise to carry their letters between Galway and Antwerp"
reply = "Aisling wrote the first one on the spot, very short, and pressed her family’s ship seal into the wax so hard it squeezed out at the edges. Pieter’s ran to three pages, and the last was still unfolded. On it he had drawn her ship, with a small figure in the bow whose mouth was wide open. He saw that I had seen, and hurried to fold it back, and folded it crooked."
effects = [{}, {}, {}, { title = "The Ship Seal" }]

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_choice.choices.watch]
text = "Stay out of it and watch him pack his case"
reply = "Pieter untied the ropes round his drawing case and tied them again, three times. From the bow Aisling shouted, “That knot’s wrong!” He tied it once more, and this time it was the knot she had taught him. She said nothing further and went off to check a mooring line, one she had already checked twice."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_together]
title = "Still Her Helm"
text = "The day before Pieter left, Aisling invited him aboard one last time. He thought it was a send-off and climbed on hugging his case, but she did not steer for open water. She sailed straight into the bay that was not even on his drafts, the one he had never been allowed to draw. The cliffs on both sides kept every breath of wind away, and the water lay flat as polished iron. She took in the sail and let the ship glide, and said the name of the bay in a low voice, once. Pieter did not reach for his pen. He stood beside her with nothing in his hands and said the name over twice to himself, filing it somewhere other than paper. Aisling kissed him first, just once, quick as furling a sail. He blinked, then said quietly, “In my letters I’ll draw only your ship. Never the bay.” She stepped back and her voice came up to full size again. “Go and draw your maps. Every summer I’ll sail out to find you, and I’ll still be the one at the helm.”"
news = "Folk on the Galway quay saw the O’Flaherty woman captain put the mapmaker on the boat for the Low Countries, then take her own ship home at the helm. She didn’t swear once on the way back."

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_together.variants.helped]
text = "On the morning before Pieter left, the Antwerp bookseller’s answer arrived: the drafts were received, and “we’ll look again for the next edition.” Pieter read it out to Aisling, and at those last words she snorted. “Look if you like. The bays aren’t for looking at.” That afternoon she invited him aboard one last time. He climbed on hugging his case, and she did not steer for open water. She sailed into the bay that was not even on his drafts, where the cliffs held off the wind, took in the sail, let the ship glide, and said the name of the bay in a low voice, once. Pieter did not reach for his pen. He said the name over twice to himself. Aisling kissed him first, just once, quick as furling a sail. He blinked, then said quietly, “In my letters I’ll draw only your ship. Never the bay.” She stepped back, her voice at full size again. “Go and draw your maps. Every summer I’ll sail out to find you, and I’ll still be the one at the helm.”"

[tracks.pair_aisling_pieter.chapters.pair_aisling_pieter_epilogue]
title = "An Irish Ship Every Year"
text = "Everyone on the Antwerp quay knows one Irish ship. She comes into port every summer, and you don’t need to look at her flag, you can tell by the voice: the captain is a woman who swears at a deckhand more sweetly than most people praise one, and praises one louder than most people swear. Odd thing is, in the very week that ship ties up, a barge always comes late down the Rhine, and off it steps a thin mapmaker with a green face. He is seasick, and he still hurries to the quay, hugging a drawing case as if it were a child. The old porters have laid bets on it. Someone once asked the captain who he was. She nodded at the man on the dock hugging his case. “That one? I invited him aboard. I do it once a year.”"
news = "Folk on the Antwerp quay say an Irish ship comes in every summer, her captain a loud-voiced woman, and a mapmaker from Duisburg is always there waiting on the dock."
