# English display overlay for pair_kutti_diogo_rocha, nested by track, chapter, choice and variant key; display text only, no gameplay.
# Effect arrays line up by index with the Chinese file; only memory titles need text, every other slot stays an empty table.

[tracks.pair_kutti_diogo_rocha]
name = "The River Mouth Asks No Flag"

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_meeting]
title = "Names First"
text = "On the sand at the river mouth, the new Portuguese gunner was shouting firing orders at three boats, and not one deckhand moved. Kutti jumped down from a gunwale, dragged him onto the beach to squat, and picked up a stick. “Anyone can shout orders.” He scratched a name into the sand. “Ali on the oar. Kunhi on the line. A big ship can’t turn, so a small boat shouldn’t panic. But you don’t even know who’s rowing. Who do you shout for when you panic?” Diogo tried it. “Alee.” “Ali.” “Ah… lee.” Twice wrong. Kutti laughed so hard he dropped the stick, then picked it up again. “That town of yours, I can’t say it either. Write it for me.” Diogo wrote “Setúbal.” Kutti sounded it out one syllable at a time. On the third try the tide crept up and licked their heels, and both of them stepped back at once."
news = "At the Calicut river mouth, a Marakkar boy has the new Portuguese gunner reciting the deckhands’ names on the beach until the tide comes in."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_closer]
title = "Two Kinds of Traitor"
text = "A man on the shore shouted at Kutti: “Your uncle’s bones are still down in that sea, and you stand watch with a Frank!” Someone else spat at Diogo and said he changed flags faster than shirts. Up on the battery the two of them argued range half the night. “Once that third sandbar shows, a big ship runs aground. You don’t need to shoot that far!” “Aground, its broadside still reaches you.” Worn out, Kutti took a charcoal stick and drew the river mouth on a board while Diogo marked the gun positions. As they went on, the little escape boat got traced over and over until it was bigger than the guns. The old watchman came over and asked Diogo, pointing at a gun position, “Who is that thing aimed at?” “Wherever that muzzle points, that’s on me.” Kutti said nothing. He rubbed out the shoal on the board with his thumb and drew it again, to the range they had fought over."
news = "They say the Portuguese gunner at the Calicut river mouth gets called a traitor, and that on the map he drew, the boat to carry people out is bigger than the guns."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_together]
title = "After the Handover"
text = "The monsoon was over and the river-mouth watch had a new schedule. The drum had sounded twice for the changeover, and Kutti was still sitting on the battery wall with his legs swinging, watching Diogo rub down a gun barrel with an oily cloth. “Doesn’t your church keep a roll?” Kutti asked at last. “When a man leaves, what happens to his name?” “Struck out.” Diogo did not look up. “Very neatly.” “Somebody at home won’t know me either.” Kutti said it fast, the way he called depths over a shoal. “Last month my uncle saw me at the mosque door and walked around me. In front of everyone.” Diogo’s hand stopped. He tossed the cloth over. “Do that end.” Kutti wiped his way to the muzzle, looked up, and Diogo was standing right there with a smudge of powder on his nose. Kutti reached out to rub it off, did not get it clean, and his wrist was caught. Diogo kissed him. Far off the third drum of the watch sounded, and no one went to relieve anyone."
news = "The battery at the Calicut river mouth has a new watch schedule, and they say the Portuguese gunner and the little Marakkar sailor always land on the same shift."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_turning]
title = "Chaliyam"
text = "They say the Zamorin’s army has surrounded the Portuguese fort at Chaliyam, and the Marakkar ships have bottled up the harbor mouth so no supply boat gets in. The loudest guns under the walls were supposedly cast by Portuguese gunners who ran off to the other side, men who knew every stretch of that wall. Since the fort fell, the Portuguese in Cochin have been promising revenge and offering money for the turncoats who made guns for the Zamorin. At the Calicut river mouth they say the reward would buy half a ship."
news = "The Zamorin has taken Chaliyam fort, and they say several of the guns below its walls were cast by Portuguese deserters. The Portuguese are offering a bounty for them."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_choice]
title = "Keep a Way Out"
text = "The bounty notice went up in Cochin, and the news came back to the river mouth on the monsoon. Diogo’s mother sent word with a messenger and a letter, its wax sealed over a cross: if he came back and confessed, the governor would pardon him. On the battery Diogo crouched before the gun with the blown touchhole, the letter stuffed in his belt with one corner showing. Kutti was down by the wall counting the sandbars the ebb left bare, his chanting coming in scraps. “We can leave one path through the shallows,” Kutti said. “Small boats can use it.” “Mm.” Diogo tapped the touchhole with a chisel. “This gun will be right by tonight.” Neither of them said a word about the letter. Kutti looked up and saw me, and his voice suddenly rose. “You’re just in time!”"
news = "The Portuguese posted a bounty notice in Cochin for deserting gunners, and they say the gunner at the Calicut river mouth has had a letter from his mother."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_choice.default]
news = "The battery at the Calicut river mouth was mended overnight, and the letter the Portuguese gunner got, they say, has sat on the gun platform ever since without an answer."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_choice.choices.route]
text = "Wade the shallows with Kutti and leave them a way out"
reply = "At low tide Kutti and I waded the whole river mouth. He drove three bamboo poles into one shoal and his chant came smooth again. “Only small boats can use this. A big ship can’t swing around here, so whatever chases us stops dead.” Diogo watched from the battery, and when we waded back he showed Kutti the mended touchhole. “Try a shot?” “No,” Kutti said. “One bang and the patrol will know there’s a path.”"
effects = [{}, {}, {}, { title = "Three Poles in the Shallows" }]

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_choice.choices.pardon]
text = "Tell Diogo the pardon in the letter is real and he should go back"
reply = "Diogo read the letter through again and sat by the gun all night. Before dawn he had the gun rubbed bright and put the match case in Kutti’s hand. “If I don’t go, I fail my mother. If I go, I fail this gun,” he told me. “You’re telling me to choose, so I choose my mother.” He boarded the boat to Cochin. Kutti stood on the quay with no chant and stayed until the sail was gone."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_choice.choices.watch]
text = "Stay out of it and watch their night on the wall"
reply = "The two of them sat on the battery until morning. The gun got mended and the letter stayed where it was. At first light Diogo folded it into a small paper boat and set it on the water of the river mouth. Kutti watched it drift off, started half a line of his chant, and swallowed it."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_epilogue]
title = "The Battery at the Mouth"
text = "Before the monsoon the gun with the blown touchhole was back on its carriage, a ring of bright brass around the new vent. Diogo lay down behind the breech, squinted at the river mouth, and stood up. “She’ll fire.” Kutti sat on the wall watching the water, his chant a half beat slow because he was counting waves. “Look at that patrol boat,” he said, jerking his chin. “Draws so deep she’ll be on the sand one step inside.” Out at sea the sail of a Portuguese patrol ship cut slantwise across the horizon and did not turn. “She’s seen the gun,” Diogo said. “She’s seen me,” Kutti said, laughing. “I’m the little boat she can’t catch.” He sang the chant through to the end. Diogo kept time and missed a beat, and Kutti did not point it out."
news = "The battery at the Calicut river mouth is mended, and the same two men keep the night watch, one watching the water and one the gun. The Portuguese patrol boat did not dare come near."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_epilogue.variants.helped]
text = "Before the monsoon the gun with the blown touchhole was back on its carriage, a ring of bright brass around the new vent. Diogo lay down behind the breech, squinted at the river mouth, and stood up. “She’ll fire.” The three bamboo poles still stood on the shoal. Before every flood tide Kutti waded out to straighten them and came back wet to the knees, his chant a half beat slow because he was counting waves. “Look at that patrol boat,” he said, jerking his chin. “Draws so deep she’ll be on the sand one step inside.” Out at sea the sail of a Portuguese patrol ship cut slantwise across the horizon and did not turn. “She’s seen the gun,” Diogo said. “She’s seen me,” Kutti said, laughing. “I’m the little boat she can’t catch.” He sang the chant through to the end. Diogo kept time and missed a beat, and Kutti did not point it out."

[tracks.pair_kutti_diogo_rocha.chapters.pair_kutti_diogo_rocha_apart]
title = "Back Under the Old Flag"
text = "They say the deserting gunner went back to Cochin, confessed in open court, was pardoned, and now repairs guns in the Portuguese shipyard and says little at his work. But every year when the monsoon turns, a small boat comes down from the north and lies a night at the Cochin river mouth, and a sailor of the Marakkar house is aboard. Men at the yard have seen the gunner walk to the water at night with a lantern and come back before dawn with wet cuffs. The two are lovers still, with two flags between them."
news = "They say the Portuguese deserter went back to Cochin and confessed, and that each year when the monsoon turns, a little Marakkar boat lies a night at the Cochin river mouth."

