# C7：tie_new_catarina_pereira_lin_hui 的英文显示覆盖（嵌套表，按轨道、章节、选项 key 对应）；不含玩法字段。

[tracks.tie_new_catarina_pereira_lin_hui]
name = "Names Side by Side"

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_meeting]
title = "The Two-Ledger Table"
text = "The mud walls of the Parián are still damp, but the Lin family’s long table is already out by their door: accounts in Chinese characters on the left, accounts in Castilian on the right, an abacus laid across the middle. Now that both crowns sit on one king’s head, the waterfront says this is the first ship ever to come over from Macau. Catarina, who sailed with the cargo, comes to settle accounts and opens with a sentence in Chinese. Lin Hui listens for a long moment. “That’s Cantonese. I’m from Zhangzhou.” So one of them talks Portuguese and the other answers in Castilian, and between them they catch most of it. Catarina goes through both books three times. “Names side by side first; then we can argue about whose it is. My one shipload has two names at your table.” Lin Hui pushes the ledgers together until their spines touch. “Different scripts don’t make a debt payable twice.” By lamplight her finger stops on a Chinese entry for freight, then crosses to a Castilian line for lighterage. Same boat, same sum. She slides the silver back across the table, and Catarina sweeps it into her purse. “I already found out which eating house in the Parián stays open latest. This one’s on me.”"
news = "At the Lin family’s table in Manila’s Parián, the one with two kinds of ledger, a Portuguese woman from Macau sat checking accounts till the lamps were lit and turned up a boat fee that had been charged twice."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_closer]
title = "The Third Ledger"
text = "Early the next spring Catarina is back. The first of the Lins’ shutters has barely come down when she is already at the table; one visit was enough for her to learn when every house in the Parián opens. She slaps a newly bound book down between the two old ledgers. “Matching two books against each other is too much work. From now on we keep this one together.” Lin Hui opens it, calls over her shoulder in Hokkien for the boy to grind ink, and turns back. “Who goes down as owner? And whose name comes first?” Catarina draws a line straight down the middle of the page. Lin Hui will write on the left in characters, Catarina on the right in Portuguese, and in the owner’s column the two names sit either side of the line, level with each other. The first entry is twenty piculs of pepper. Lin Hui’s father comes out with his hands clasped behind his back, picks up the book, leafs through it, then turns it upside down. “Who could ever read accounts like these?” “All the better,” says Catarina, handing the pen to Lin Hui. “The only people who can read them are sitting on either side of this table.” The old man puts the book down, nudges the abacus into the middle between them, and goes back inside."
news = "The Lins in Manila’s Parián keep a ledger with Chinese on the left and Portuguese on the right, and two women’s names standing level in the owner’s column. Old Lin turned it upside down and still couldn’t make it out."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_turning]
title = "The Great Fire"
text = "On the day of the governor’s funeral the church was full of candles. Some say a flame by the bier caught the hangings. The fire ran along bamboo walls and thatched roofs until most of Manila was black ground, and a whole row of shops in the Parián went with it. The story told most on the waterfront is about the Lin daughter. The water carrier says that when the fire reached her door she didn’t go for the cash box. What she carried out was a ledger, and she crouched in the middle of the street beating sparks off its cover with her sleeve. When the neighbors called her a fool, she didn’t even look up. “Melted silver is still silver when you pick it up. Burn the books and nobody can say who owes whom.” The warehouse the two women rented by the harbor had no one to save it; a few stone pillars are all that’s left. Two weeks later the Macau ship came in, and the Portuguese woman ran straight from the landing to the Parián. She stood at the blackened doorframe and asked, “Where are the goods?” The Lin daughter held up the ledger. “In here.”"
news = "Fire broke out in Manila the day the governor was buried, and a whole row of shops in the Parián burned. The water carrier says the Lin daughter saved nothing from the flames but one ledger and left the cash box behind."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_choice]
title = "Who Pays First"
text = "After the fire the Lins put up a thatched shed on what was left of their stone footings. The long table is out by the door as always, and on it lies only the shared ledger with its scorched corner. The binding thread went brittle in the heat; one touch and the book fell apart into two stacks. What burned in the warehouse was a load of raw silk Lin Hui took on credit while Catarina was in Macau, entered as usual under both names. Now the Fujian shipowner comes every day for his money, and the Spanish merchants who ordered the silk come every day for their goods. Catarina clutches the front half. “That silk never passed through my hands. By Portuguese custom, goods that never reached me aren’t mine to lose.” Lin Hui clutches the back half. “By Parián custom, whoever is written in the book owns what’s in it. Your name is on this line, level with mine.” It is their first real quarrel, and a crowd gathers outside the shed. In the end one turns around, then the other, and the two halves of the ledger, one from the left and one from the right, are held out to me at the same moment."
news = "Since the fire in Manila, the two women in the Parián who keep their accounts together have fallen out over who pays first for a load of burned silk. Each one is holding half the ledger."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_choice.default]
news = "The two women in Manila’s Parián who share a ledger quarreled for seven days and in the end split the cost of the burned silk down the middle. The Portuguese one is borrowing from a shipowner in Macau, the Lin daughter from her own people."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_choice.choices.front_payment]
text = "Put up the silk money for them and send the Fujian shipowner back to his junk."
reply = "I count the silver out on the table in the shed. The Fujian shipowner checks it ingot by ingot and goes back to his junk, and the doorway is suddenly quiet. Catarina speaks first. “This counts as a loan to the two of us. Half each.” Lin Hui has already stacked the two halves of the ledger together and is stitching them back with hemp thread, one hole at a time. “When we pay it back, the note carries both names too, level.” Once the book is bound, she turns to a fresh page, enters the loan, and hands me the pen. “The lender’s name goes on the top line.”"
news = "A passing captain put up the silk money for the two women in Manila’s Parián who keep a ledger together, and the Fujian shipowner took his silver back to his junk that same day."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_choice.choices.one_rule]
text = "Set them a rule: the fire was both of theirs, so the loss splits in half, like the names in the book."
reply = "They both glare at me, then turn and glare at each other. Somebody outside the shed laughs out loud. Lin Hui is the first to crack. She laughs too, and slaps her half down on the table. “Our names are already side by side. What are we fighting about?” Catarina sniffs and says nothing. She pulls a length of hemp thread from her sleeve, squares the two stacks, and starts stitching them back together, one hole at a time. Only when she reaches the last hole does she speak. “I’ll pay half the silk. Next time you buy on credit, wait until I’m back.”"
news = "One word from an out-of-town captain, and the two women who fell out in Manila’s Parián split the burned silk money down the middle. The ledger that came apart is stitched back into one."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_landing]
title = "Names Side by Side"
text = "The Parián’s shops are standing again, the new shutters still smelling of raw pine. On opening day Catarina brings a partnership contract from Macau, laid out like their shared ledger: Chinese characters on the left, Portuguese on the right, a line down the middle, and a place to sign on either side, level. Catarina signs first and passes the pen. “Names side by side first—” Lin Hui takes it. “—and no debt gets counted twice.” When she has signed, she brings out the old ledger with the scorched corner from the bottom of the cupboard. It was restitched after the fire, the knots lumpy and crooked. Catarina holds it steady while Lin Hui stands on tiptoe and nails it to the new wall, facing the long table. As the last nail goes in, Catarina says, “Turn it to the silk page. Face out.” Lin Hui glares at her, and turns it anyway."
news = "A newly built shop in Manila’s Parián has an old ledger with a scorched corner nailed to its wall, open at the entry for a load of silk that burned. The shop belongs to the Lin daughter and a Portuguese woman from Macau."

