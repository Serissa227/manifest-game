[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_landing.variants.helped]
text = "The Parián’s shops are standing again, the new shutters still smelling of raw pine. On opening day Catarina brings a partnership contract from Macau, laid out like their shared ledger: Chinese characters on the left, Portuguese on the right, a place to sign on either side, level. The last line records the silver I lent them after the fire: half repaid by one, half by the other, settled. Catarina signs first and passes the pen. “Names side by side first—” Lin Hui takes it. “—and no debt gets counted twice.” When she has signed, she holds the pen out to me. “A settled debt still needs the lender’s name.” Then she brings out the old ledger with the scorched corner, the one she restitched in the shed. Catarina holds it steady while Lin Hui stands on tiptoe and nails it to the new wall. As the last nail goes in, Catarina says, “Turn it to the silk page. Face out.” Lin Hui glares at her, and turns it anyway."

[tracks.tie_new_catarina_pereira_lin_hui.chapters.tie_new_catarina_pereira_lin_hui_landing.variants.mediated]
text = "The Parián’s shops are standing again, the new shutters still smelling of raw pine. On opening day Catarina brings a partnership contract from Macau, laid out like their shared ledger: Chinese characters on the left, Portuguese on the right, a place to sign on either side. The first clause is what I said that day in the shed: fire or flood, the loss is halved between the names in the book. The second is Catarina’s: no buying on credit unless both of them are there. Catarina signs first and passes the pen. “Names side by side first—” Lin Hui takes it. “—and no debt gets counted twice.” When she has signed, she brings out the old ledger with the scorched corner. Catarina restitched it in the shed, and the knots are lumpy and crooked. She holds it steady while Lin Hui stands on tiptoe and nails it to the new wall. As the last nail goes in, Catarina says, “Turn it to the silk page. Face out.” Lin Hui glares at her, and turns it anyway."
