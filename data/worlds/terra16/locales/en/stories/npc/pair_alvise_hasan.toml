# C7 英文覆盖：图纸不画的地方（阿尔维塞 × 哈桑）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标，只有回忆标题需要译文。

[tracks.pair_alvise_hasan]
name = "What the Drawings Leave Out"

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_meeting]
title = "The Coffee Went Cold"
text = "In the coffeehouse at Tahtakale, the Venetian bailo’s secretary had made three detours before he got to the point. “The slip at the Golden Horn yard, is it a hundred and twenty paces long, or a hundred and thirty? I’m asking for a friend.” The shipwright Hasan didn’t answer. He nodded at the cup in front of the man. “You haven’t touched your coffee.” “It’s bitter.” Hasan pushed his sugar jar across the table and went back to planing his sliver of wood. The coffee went cold, and nobody mentioned the slip again. Hasan said there was a door at his house that leaked every time it rained. Alvise said the windows in Venice did the same, and they were soon arguing over which wood stood up best to water. The secretary laid out a roof with bread crumbs, and one beam came out crooked. Hasan reached over and straightened it. “That one’s the keel. A drawing can be folded. A keel can’t.” The owner came to clear the cups. Both were full. Alvise said, “If one should wish, some day, to ask again about the slip, where would one ask?” “This table.”"
news = "In a Tahtakale coffeehouse, the Venetian bailo’s secretary and a shipwright from the Golden Horn argued all afternoon over a leaking door, and both cups of coffee went stone cold."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_closer]
title = "The Carpenter at the Guarded Door"
text = "War had broken out over Cyprus, and the soldiers at the gate of the bailo’s house in Galata had been changed; everyone who came or went showed a token. That night the wind was high, and the hinge pin of the side door snapped. The steward reported it to the authorities, and the carpenter who took the job was Hasan, from the Golden Horn. He had gone and asked for it himself. On the first day he measured the frame while Alvise sat on the step with an armful of dispatches and watched. On the second he planed the new door and Alvise brought him water. “Forgive me, but is this pine?” “No oak getting in, with the war on.” Hasan didn’t look up. “A pine door swings open. It also shuts.” On the third evening the last wooden peg went in. Hasan put the hammer down and didn’t reach for his tool bag. “It’s mended.” “It’s mended,” Alvise said, but his hand stayed flat on the new planks and he didn’t step aside. Hasan pressed the hand, door and all, under his own and kissed him. It was brief, the way you check a seam. Outside, the guard heard the hammering stop. He waited, heard nothing more, and crouched to tie his boot. It took him a long time."
news = "The Venetian house in Galata, the one with soldiers at the gate, has a new door. The man who fitted it came from the Golden Horn and took three days."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_turning]
title = "One Winter"
text = "Ever since the news from Lepanto came back, the hammers at the Golden Horn have not stopped, and at night they work on by torchlight. The yard has run out of needle and thread, and men patch their clothes with rope. In the coffeehouses they say that a few days ago the Venetian bailo’s secretary sent a parcel to one of the shipwrights: a roll of needles and some clean strips of cloth, without so much as a note. The shipwright turned it over for a long time, then handed the cloth around to his gang, and the needles too, keeping only the finest, which he stuck in his turban. And somebody swears that yesterday evening that same shipwright spread the plans for the new galleys across a table at Tahtakale to correct the measurements, and the secretary sat opposite with his cup and never once looked down at the paper."
news = "Since Lepanto the hammers at the Golden Horn yard haven’t stopped all night. They say the Venetian bailo’s secretary sent a shipwright a parcel of needles and thread."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_choice]
title = "Borrowed or Stolen"
text = "A merchant from Venice caught me at the coffeehouse door and pressed a wax-sealed letter into my hand. He dropped his voice. “The new warships at the Golden Horn. One drawing. The keel line will do. Name your price.” At the next table Alvise had heard. He had gone pale, and he looked at neither the letter nor me. “Before this is opened, ask who has the right to open it,” he said, very low, tapping the table’s edge twice with a fingertip. He knew the seal. The door banged, and Hasan came in with a roll of plans under his arm and took the usual seat, pushing the sugar jar toward the secretary. “I don’t leave the plans in the yard overnight. I take them home and put them by my bed.” He yawned. “Three nights without sleep.”"
news = "That winter at the Golden Horn a Venetian merchant went around asking after the plans for the new warships, and they say the price he named was frightening."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_choice.default]
news = "A Venetian merchant waited ten days at a Galata inn, found no one to take his purse, and sailed home in the spring without a single drawing."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_choice.choices.steal]
text = "Wait until Hasan is dead asleep, take the plans from beside his bed, and sell them to the merchant."
reply = "The roll slid out from beside the bed lighter than I expected, and Hasan didn’t even turn over. The merchant took the plans without haggling. On the third day the yard began questioning its shipwrights one by one. Hasan was kept all night, and at dawn he said to the man at the door, “The only one who has been in my room is him.” After that he never went back to the coffeehouse."
news = "The Golden Horn yard has lost a roll of plans for the new warships. The overseer is questioning the shipwrights one by one, and one of them was kept all night."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_choice.choices.cover]
text = "Turn the merchant down, and cover for the two of them: enter Hasan on my crew list as ship’s carpenter so he can go in and out of the bailo’s house."
reply = "I pushed the letter back into the merchant’s sleeve and wrote one more line on my crew list: carpenter, Hasan. The next day he walked up to the house gate carrying my ship’s tool chest. The guard lifted the lid, saw iron nails and a hand adze, and waved him through. “I’ve never worked on a ship,” Hasan murmured as he went in. Alvise said later that the place they met most often that winter was beside a chest of nails."
effects = [{}, {}, {}, { title = "The Chest of Nails" }]
news = "The guards at the Venetian house in Galata let a carpenter with a tool chest in every day now, and nobody has asked where his ship is moored."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_choice.choices.refuse]
text = "Turn the merchant down and hand the wax-sealed letter to Alvise."
reply = "Alvise took the letter, weighed it in his hand, left it unopened and slipped it into his sleeve. Then he drew out a sheet of paper and wrote to his people in Venice while I watched. Only what a fisherman could see from the shore went into it: how many hulls stood on the slip, when the hammers rang and when they stopped. “If anyone on the quay can count it, I may write it,” he said. He pushed the page across to me and did not seal it until I had read it through."
effects = [{}, {}, {}, { title = "The Letter About Hulls" }]
news = "A ship’s captain passed a Venetian merchant’s sealed letter on to the Venetian house in Galata, and the merchant checked out of his inn the same day."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_together]
title = "Cups After the Peace"
text = "The peace was signed, and the soldiers at the gate of the bailo’s house left faster than they had come. On the first fine day of April, Alvise walked into the coffeehouse in broad daylight for the first time. Hasan was already in the usual seat with two cups in front of him, one pushed across the table. The secretary took up the sugar spoon, put a single measure into his own cup, for the first time, and sipped. “Still bitter.” “Add another.” “Another, and it won’t be the cup I ordered.” Hasan didn’t press him. He put the lid back on the jar. People came and went and nobody looked twice: a Venetian secretary and a shipwright from the Golden Horn, talking timber across a table. Only under the table did Hasan’s boot press against another boot, and it stayed there."
news = "Since the peace was signed, the Tahtakale coffeehouse has seen the Venetian secretary and the Golden Horn shipwright at one table again, one of them putting sugar in his coffee."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_together.default]
effects = [{}, {}, { title = "Cups After the Peace" }]

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_together.variants.helped]
text = "The peace was signed, and the soldiers at the gate of the bailo’s house left faster than they had come. On the first fine day of April, Alvise walked into the coffeehouse in broad daylight for the first time. Hasan was already in the usual seat with two cups in front of him, one pushed across the table. There was an old wooden chest by his foot, and I knew it at once. “Your ship’s carpenter. Returned.” Hasan nudged the chest toward me with his boot. I turned the chest over. Carved on the bottom was a very small ship, the cuts still pale. The secretary took up the sugar spoon, put a single measure into his own cup, for the first time, and sipped. “Still bitter.” “Add another.” “Another, and it won’t be the cup I ordered.” Under the table Hasan’s boot pressed against another boot, and it stayed there."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_together.variants.refused]
text = "The peace was signed, and the soldiers at the gate of the bailo’s house left faster than they had come. On the first fine day of April, Alvise walked into the coffeehouse in broad daylight for the first time. Hasan was already in the usual seat with three cups in front of him, and as I came in he pushed one to me, sugar already in it. “He says you read that letter before he sealed it,” Hasan said, the way he would quote the price of a plank. “Hulls only.” The secretary put a single measure of sugar into his own cup, for the first time, and sipped. “Still bitter.” “Add another.” “Another, and it won’t be the cup I ordered.” Hasan didn’t press him. Under the table his boot pressed against another boot, and it stayed there."

[tracks.pair_alvise_hasan.chapters.pair_alvise_hasan_apart]
title = "Across the Golden Horn"
text = "They say that after the winter the plans went missing, the shipwright from the Golden Horn did not set foot in the Tahtakale coffeehouse for a full year. The Venetian bailo’s secretary went every day, though, and sat until the owner put up the shutters, with two cups in front of him, one to drink and one to go cold. Some say the shipwright sent a freshly planed sliver of wood to the house every month that year, smelling of resin, with no word attached. This spring, after the peace, somebody saw the shipwright come as far as the coffeehouse door. He didn’t come in. He stood below the step and spoke a few words across the threshold, and all the room caught was the last of it: “Put enough sugar in. And don’t tell me it’s bitter again.” Then he went down the slope toward the Golden Horn. The secretary pushed the cold cup to the far side of the table, the empty side."
news = "Ever since the plans went missing, the Golden Horn shipwright hasn’t been near the coffeehouse for a year, and the Venetian secretary sits until closing with two cups in front of him."
