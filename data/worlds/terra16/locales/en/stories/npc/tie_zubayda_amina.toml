# C7 配角线 tie_zubayda_amina 的英文显示覆盖（嵌套表写法，按轨道、章节、选项 key 对应）；只覆盖文字，不复制玩法。

[tracks.tie_zubayda_amina]
name = "The Daylight Her Sister Kept"

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_meeting]
title = "Out of Lamp Oil Again"
text = "The wick spat and the lamp ran dry again. Zubayda turned the oil jar upside down and shook it. “The customer comes first thing tomorrow! How many pages left? Three—and you’ve managed a page and a half all evening.” Amina didn’t look up. She lifted the wick with a needle, and the flame brightened for a breath. “The ink’s still wet. Nobody turns this page.” Zubayda whipped the finished page away and fanned it over the lamp by two corners. Halfway through, she saw her sister rub her eyes, dip the pen, rub them again and hold the nib above the paper; only at the third rub did it touch the page. Zubayda hung the page on the drying line without a word and went next door to borrow half a jar of oil. The book went out half a day late. The customer leafed through it and couldn’t tell which pages had been copied after sunrise. That afternoon Zubayda dragged the copying desk out of the back room to the window over the street, and knocked a chip of paint off one leg on the doorsill."
news = "A bookshop on Cairo’s booksellers’ street has dragged its copying desk to the street window. The elder sister copies, the younger minds the stall, and they say a month’s lamp oil now lasts two."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_turning]
title = "Paper Grows Dear"
text = "On the booksellers’ street these days, every third word is paper. The paper ship from Alexandria came in a month late, and the price at the paper shops is one thing in the morning and another after noon. Some say the Franks make their paper thinner every year; some say the customs men at the port have added another tenth. The bookseller’s younger girl made the rounds of five paper shops in a single day. One dealer says she held a sheet up to the sun, his face right behind the anchor watermark: “It’s so thin I can see you grinning. And you want that price?” At dusk she came home hugging a ream of the cheapest, her face whiter than the paper. A neighbor heard the elder sister’s slow voice through the window: “Thin paper drinks ink. I’ll just write slower.” Next morning a new board hung beside the stall: copying taken in, price open to haggling."
news = "Paper on Cairo’s booksellers’ street costs something different every day; they say the paper ship from Alexandria came in a month late. The bookseller’s younger girl tried five shops and came home with one ream of the thinnest."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_closer]
title = "The Night Work Turned Away"
text = "A judge’s errand boy came by to ask whether the rush job sent back the other week might be taken on after all. That was how Zubayda found out that three jobs meant for the night had been handed back, deposits and all. She let fly right there in front of the boy. “Three! I talked myself hoarse for half a month to get those, and you send them all back without a word? Who pays for the paper? If you’re going to slack off, at least pick your day!” Amina didn’t argue. She finished the page in front of her, scattered a pinch of sand over it to blot the ink, and only then looked up. “I sent them back. Lamp oil’s dear.” Around midnight Zubayda got up for water. The lamp by the window was still burning. Her sister held a page an inch from the flame, lips moving, making out the letters one by one. Zubayda stood there with the water jar for a while, then went back to bed. The next day the board by the stall had a new line under “copying taken in”: “No rush work at night.” When a customer grumbled that it was slow and poured on the flattery to jump the line, she tapped the board. “Whatever’s missing goes on the first page. Save your sweet talk. Want it fast? Try next door.”"
news = "A bookstall on Cairo’s booksellers’ street has added a line to its board: no rush work at night. When people grumble, the bookseller’s younger girl slaps the board and tells them to try next door."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_choice]
title = "Keeping the Good Hours"
text = "A teacher from al-Azhar left an order at the stall: a commentary to be copied in forty days, at a price that would buy a year of paper. Zubayda ran the sums on the counter three times, and every time they came out with night work in them. “Copy till sunset, then two more hours by the lamp, just this once. Forty days. It can be done.” Amina took the order, read it, set it back on the counter and pointed at the board by the stall, the one that said no rush work at night. “I can finish it by daylight. Sixty days.” “Sixty? He’ll have gone somewhere else long before that!” “Then let him.” One sister inside the stall, one outside it, neither budging; students passing by stepped around them. Zubayda shoved the order across to me. “You tell us. Do we take it or not?”"
news = "A teacher at al-Azhar ordered a copied commentary, and those two sisters on Cairo’s booksellers’ street spent a whole afternoon arguing across their stall over whether to take it."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_choice.default]
news = "Zubayda of Cairo’s booksellers’ street haggled two afternoons over the al-Azhar teacher’s commentary and took it at fifty days. Her stall now stays open an hour past dark, and her sister copies only by day."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_choice.choices.daylight_buyer]
text = "I’ll ask around al-Azhar for a buyer who will wait sixty days."
reply = "I asked in the arcades of al-Azhar for three days and turned up an old scholar from Yemen. Told he would have to wait sixty days, he stroked his beard and laughed. “I’ve waited twenty years for this commentary. Another twenty days won’t kill me.” Zubayda went and handed the teacher his order back, and grumbled all the way home about the paper money she’d lost. Two months later Amina copied the last page and wrote her name at the foot of it, very small, as if she’d rather nobody saw."

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_choice.choices.tell_her]
text = "Tell Amina: “Your sister should hear about your eyes from you.”"
reply = "Amina glanced at me, turned to her sister, and said one sentence. “After dark, I can’t make out the letters anymore.” Zubayda didn’t make a sound for a long while. She had seen it that night by the lamp, but this was the first time it had been said out loud. She tore the teacher’s order in two and spread out a fresh sheet. “Sixty days, then. Anyone who thinks that’s slow can go next door.”"

[tracks.tie_zubayda_amina.chapters.tie_zubayda_amina_landing]
title = "Each Sister’s Share"
text = "At the end of the month Zubayda tipped the takings onto the counter and pushed them into three piles. “Your wages, my wages, the household.” Amina pushed half the middle pile back. “Sitting at a stall taking money isn’t work.” “And a copyist’s eyes aren’t capital?” Zubayda pushed it back again. “For two years now I’ve carried your eyes in the ledger as capital.” The coins went back and forth three times and not one of them changed piles. In the end each pile went into a cloth purse, and Amina’s had a blue thread stitched around the mouth so it was easy to tell apart. From that commentary on, every book the elder sister copied ended with one more small line at the foot of the last page: copied by Amina."
news = "Those sisters on Cairo’s booksellers’ street split each month into three purses now, and they say every book the elder copies has the copyist’s name at the foot of its last page."

