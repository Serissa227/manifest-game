# C7：pair_radhika_aishath 的英文显示覆盖（嵌套表写法，按轨道、章节、选项、变体 key 对应；不含玩法字段）。

[tracks.pair_radhika_aishath]
name = "A Bead Each Year"

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_meeting]
title = "The Smallest Shell"
text = "Just before the monsoon turned, the last few boats from the Maldives tied up at Khambhat. Aishath, a cowrie trader from Male, borrowed the long bench in Radhika’s bead shop to count her shells. She tipped a thousand of them out and turned each one over to look at its back. The porter carrying her goods stamped his feet in the doorway. “Count like that and the boat’ll be gone.” Her hands didn’t stop. “Don’t scorn the small ones. That’s how a ship’s fare gets saved.” At the very end she picked out the smallest shell of all and carried it over to the grinding wheel. “Can you drill this one?” Radhika held it up to the light from the door. “Drill it and it splits.” From the bottom of a chest she took two red agates she never sold, ground a little setting, and fixed the shell between the two red beads. She changed the wheel’s water twice before it was done. Aishath hung the chain around her neck and looked down at it for a long time. “Money is for spending. This one I’m not spending yet.” Radhika wiped the stone dust off the wheel. “Next sailing season, I’ll grind you another.” “Then I’m writing it down.” Aishath opened her ledger and, on the last line, wrote: the first one."
news = "An agate maker in Khambhat ground a setting for a cowrie trader from Male, just to hold one tiny shell. They say the trader won’t spend that shell for anything."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_turning]
title = "The Sealed Storehouse"
text = "This year the Portuguese ships came into Male, and one after another the cowrie storehouses got seals on their doors. A clerk from the factory set a table on the quay. Shells could be sold only to the factory, at whatever price the factory named. The old coir-rope seller says one of the sealed storehouses belongs to a woman who trades cowries. Every day she goes to stand by its door while the guards change, then walks off. She doesn’t shout and she doesn’t beg. She never wrote anyone a letter asking for help. All she sent, on a boat bound for Khambhat, was a sheet of figures: how many kotta were in the store, how much she lost at the factory’s price, how much more at Bengal’s, line after line down to the last kotta, with the date of the sealing at the bottom. The boatman who carried it can’t keep his mouth shut. He says a letter came back from Khambhat, a short one, and its first line said nothing about money. “Have you eaten yet?” The trader read it, tucked it inside her shirt, and the next day went to stand by the storehouse door as usual."
news = "The Portuguese have taken Male and sealed the cowrie stores one by one. They say a woman trader there sent Khambhat a list of her losses, worked out kotta by kotta to the very last."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_together]
title = "The Fourth Bead"
text = "In the third winter of the occupation, Radhika came to Male on the northeast monsoon for the first time. A Portuguese customs man emptied her agates out on the planks of the quay, sack by sack, and took one bead in ten. Aishath was waiting at the end of the jetty. She didn’t say a word about the sealed storehouse. The first thing she asked was, “Have you eaten?” Radhika blinked. “You’re asking me first?” Radhika’s own letter, years ago, had opened with the very same words. That night, in the little house Aishath rented, Radhika untied a packet of oilcloth and shook out three red agates, ground since the occupation began and never sent. She lifted the chain from Aishath’s neck and threaded them on one at a time. With the first one, sent before the occupation, that made four. “Once this bead is done, sailing day is close.” Aishath put her hand over Radhika’s. “Then don’t grind so fast.” The oil lamp wavered. Radhika didn’t thread any more. She bent her head and kissed her. The chain lay on the mat between them, the shell still sitting in its old setting."
news = "The Portuguese still hold Male, but the agate maker from Khambhat came on the monsoon anyway. She paid a tenth in duty, and the rest of her beads went to a woman cowrie trader, they say."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_choice]
title = "Wait for the Wind"
text = "Other years Radhika brought a sack of beads. This season she brought a whole shipload of agate, and the boat sat a hand’s width lower in the water. Outside the city, the Thakurufaanu brothers’ men were fighting their way down from the northern atolls, and the Portuguese had doubled the night watch. Aishath’s storehouse had been sealed for fifteen years, and the factory had let it be known that come spring, every sealed shell would be hauled away. “Sell this cargo and buy back the store before the fighting starts,” Radhika said. “Wait.” Aishath shut her ledger. “Wait until we see who wins. If we buy it back and somebody seals it again, all that agate was ground for nothing.” “And when the factory has emptied it, what will you be waiting for then?” Aishath didn’t answer. Her fingers moved along the chain at her neck, counting bead by bead, and stopped at the sixteenth. Radhika fell quiet too. The room was still for a while. Then both of them turned to look at me."
news = "There’s hard fighting outside Male, and the agate maker from Khambhat has brought a whole shipload of agate. She means to buy back a woman trader’s storehouse that’s been sealed fifteen years."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_choice.default]
news = "With the fighting outside Male, the agate maker’s shipload went unsold, every bead of it. They say it’s all been stacked in the woman trader’s rented house, filling half the room."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_choice.choices.redeem]
text = "Sell Radhika’s agate at a good price and buy back the store before the fighting."
reply = "I sold the agate on to a ship bound for Bengal. The captain called it too dear, Radhika wouldn’t knock off a single bead, and in the end I covered the freight myself. The silver came to exactly the ransom the factory had named. The day the seals came off, Aishath had Radhika and me stand at the door and wouldn’t let us in. She counted it sack by sack, alone, for three days. On the third evening she came out and said four hundred shells were missing. Rats had chewed through a sack and the shells had run down into the cracks in the floor. Not the factory. Radhika asked, “You’re writing down four hundred?” “I am.”"
effects = [{}, {}, {}, { title = "The Torn Seal" }]
news = "The fighting outside Male isn’t over, but that woman trader’s storehouse, sealed fifteen years, has already been bought back. Paid for with Khambhat agate sold to a Bengal ship, they say."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_choice.choices.brothers]
text = "Carry a letter into Male for the Thakurufaanu brothers’ men."
reply = "The letter was sewn into the core of a coil of rope. I shouldered it off the boat and handed it to an old man mending nets on the quay. He shoved the rope into his pile of nets and asked nothing. When Aishath found out, she didn’t speak to me for half a day. She sat on her doorstep unpicking an old net, and only when she’d finished did she say, “Your stitches are too coarse. One squeeze and a guard would feel it. Next time, tell me. I’ll sew it for you.” From inside the house Radhika laughed once and stayed where she was."
effects = [{}, {}, {}, { title = "The Letter in the Rope" }]
news = "A coil of rope sat overnight with the old net mender on the Male quay. The next day the brothers’ men outside the walls knew exactly when the Portuguese guard changed."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_choice.choices.both_sides]
text = "Trade with both sides: sell to the Portuguese factory and to the brothers’ men."
reply = "Money from both sides went into my strongbox. The Portuguese factory would only take goods from faces it knew on the island, so I asked Aishath to deliver for me. She made three runs and didn’t ask a single question. From then on the factory’s list of suppliers had one more name on it, and it was hers. When Radhika heard, she carried her agate back into the hold, crate by crate. “The name on that list is hers,” she said. “Don’t you forget it.”"
news = "With fighting like this outside Male, somebody is still trading with both sides. They say the one delivering for the Portuguese factory is a woman from town who deals in cowries."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_epilogue]
title = "The Seventeenth"
text = "Last year Male drove out the Portuguese. The day the factory’s flag came down, the seals came off Aishath’s storehouse too. Of fifteen years’ worth of shells, less than half were left, and the sacks at the bottom had gone yellow. When the northeast monsoon rose, Radhika came as she always did and took the seventeenth bead from inside her shirt. Aishath had no time to look at it. She was crouched in the storehouse counting, bundle by bundle, until dark. Then she shut her ledger. “That’s enough.” “Enough for what?” “Enough for a boat.” She stood and brushed the shell grit off her knees. “Next year, don’t ride on somebody else’s. Come on mine.” Radhika laughed and threaded the seventeenth onto the chain. It hung past Aishath’s heart now, and Radhika fastened the clasp for her. “Then next year’s bead, I’ll grind on your boat.” “Boats roll. If it comes out crooked, I won’t take it.”"
news = "Male has driven out the Portuguese, and the woman trader’s storehouse is unsealed, though there isn’t much left inside. The agate maker from Khambhat still comes the moment the monsoon turns, and there’s one more bead on that chain."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_epilogue.variants.letters]
text = "Last year Male drove out the Portuguese. The day the factory’s flag came down, the seals came off Aishath’s storehouse too. Of fifteen years’ worth of shells, less than half were left. When the northeast monsoon rose, Radhika came as she always did. There was a new man taking duties on the quay: the old net mender, now harbor master for the brothers. He knew me at a glance, and before he wrote out any duty slip, he asked, “That coil of rope. Got any more?” Up on the jetty Aishath laughed out loud. “He’s been waiting a year to say that.” That night she crouched in the storehouse and counted bundle by bundle, then shut her ledger. “That’s enough. Enough for a boat. Next year, come on mine.” Radhika threaded the seventeenth bead onto the chain and fastened the clasp for her. “Then next year’s bead, I’ll grind on your boat.” “If it comes out crooked, I won’t take it.”"

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_landing_b]
title = "A Bead Shop on the Water"
text = "Last year Male drove out the Portuguese. The storehouse Aishath bought back had long since sent its shells to Bengal by the boatload, and the empty building became a bead shop facing the sea. The board over the door bore Aishath’s name. The shelves held agate from Khambhat. Under the counter lay the seal that had been torn off the door, the Portuguese stamp still easy to read. When customers asked what it was, Aishath said, “Accounts.” The moment the northeast monsoon rose, Radhika came and set up her wheel behind the shop, and the hiss of the grinding water ran together with the sound of the surf. “Once that wheel starts up, the fishmonger next door knows you’re here.” “Good. Saves me knocking on doors.” Radhika held a freshly ground bead up against the sea to judge its color. “The seventeenth. Ground in our own shop.” She passed it across the counter. Aishath took it, and before she threaded it onto the chain, she made an entry in the ledger."
news = "There’s a new bead shop in Male facing the sea. The sign carries the woman trader’s name, but what it sells is Khambhat agate, and all day long there’s the sound of a grinding wheel out back."

[tracks.pair_radhika_aishath.chapters.pair_radhika_aishath_apart]
title = "A Name in the Old Ledger"
text = "After Male drove out the Portuguese, the brothers’ men went through the factory’s old books and turned up a list of suppliers. On it was the name of a local woman who traded cowries, the ink still fresh. On the quay they say she carried goods for the Portuguese, and they tell it with every detail. A few say quietly that those loads were never hers. She didn’t say a word in her own defense. That same month she took a boat to Khambhat and left every sack of shells in her storehouse behind. Boatmen from Khambhat say she lives above the bead shop of Radhika the agate maker now. For as long as the wheel turns downstairs, she keeps accounts upstairs, and she doesn’t touch cowries anymore. She still wears that chain with a single shell on it. It used to gain one bead each sailing season. Now there is no boat to wait for. Every year, when the day comes, the woman from downstairs climbs the steps, counts out one bead for her, and threads it on."
news = "After Male drove out the Portuguese, someone found a woman cowrie trader’s name in the factory’s old books. She didn’t argue. That same month she sailed for Khambhat."
