# C7 story rewrite, English overlay: Marion x Bernat, "Hot Soup on the Ice".
# Keyed by track, chapter and choice; display text only.

[tracks.pair_marion_bernat]
name = "Hot Soup on the Ice"

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_meeting]
title = "The Leaking Barrel"
text = "A row of empty oil barrels stood on the Red Bay dock. Marion rapped each one with a knuckle and named a price as she went, never turning her head. “Cod by the quintal, salt extra, and the time I lose off my drying racks counts too. Now, does your barrel leak?” Nothing but numbers in her head, he thought. He hadn’t finished opening his mouth when a strand of the pulley rope parted overhead and the barrel hanging from it lurched. He threw out a hand. “Not with your hand!” She had the rope end before he did, boot braced against a post. “That hand is for whales.” The barrel settled, but a thin line of oil was already creeping from one seam. “The wood just came in from the cold,” he said. “It needs a while to close up.” Marion dragged over a stool and sat. “Then we wait together.” The oil kept dripping. He swore in Basque, “arraio,” and knelt to drive the hoop tighter."
news = "At Red Bay, a Basque harpooner was told to his face that one of his oil barrels leaked, by the Breton fishery woman up from St. John’s. The two sat on the dock half an hour waiting to see."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_closer]
title = "Counting Heads"
text = "The fog rolled in after noon and was still there after dark. One whaleboat hadn’t come back, and Bernat stood on the beach counting heads as the men came ashore, slower than anyone. The foreman ran up to ask whether the oil would fetch last year’s price. Bernat didn’t turn around. “I stick the whale. Ask the owner about prices. If it’s a man I’m looking for, give me his name, and I’ll count whether he’s back.” Marion had only come to settle accounts. She fetched a lantern, stood beside him without a word of advice, and refilled it twice. At midnight oars sounded in the fog. He called the names one by one, and after the last he finally let out a long breath. The next day the owner sent over a new contract for the shares. Bernat took it and held it upside down. Marion glanced at it, said nothing, pulled it from his hand, and read it from the top, very slowly. “This line is the price of oil. If you want to ask something, ask about this line.”"
news = "A whaleboat was lost in the fog for a night off Red Bay. They say the one who stood on the beach with a lantern till midnight, keeping the harpooner company, was that Breton woman from St. John’s."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_turning]
title = "The Winter of Broth"
text = "The talk in the street is all about this winter. Those left behind at St. John’s ate through the last of the stores by February, and in the huts men began counting biscuits. They say the Breton fishery woman brought out every piece of her own salt pork and gave it away, a piece at a time, and kept only the broth for herself, not even fishing out the scraps. One of her hands said, “She was still counting out loud while she cut it.” The hands are betting that when the first ship comes into harbor in spring she will be thinner by a good deal, and not a coin will be missing from her books. Even the spoonfuls of broth she drank herself will be written down, owed to herself."
news = "The folk wintering at St. John’s were out of food by February. They say the Breton fishery woman gave away all her salt pork and drank only broth herself."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_choice]
title = "The Top of the Page"
text = "Marion spread her ledger page on the plank table by the drying beach and listed the hands’ shares first: how many men, how many quintals of grain, how many pieces of salt pork, row after row, and not one row for herself. She turned to me. “I’m keeping people over this winter, and the grain has to come from outside. You go. I’ll pay market price, not a penny short.” Bernat, who had brought the oil down, stood by his barrels and did not move. She added, eyes still on the page, “Are you going back to Gipuzkoa this year? If not, there are no whales to stick in winter. I won’t give you work, I’ll give you grain, and it goes in the book.” The harpooner looked at her a long time. “I don’t want a free ride,” he said. “I want to be able to say I’m tired, later on.” Marion didn’t answer. Her pen hung over the top of the page for a moment, then came down."
news = "The Breton fishery woman at St. John’s means to keep hands on over the winter. They say she asked the harpooner from Red Bay, in front of her men, whether he’d skip going home."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_choice.default]
news = "The Breton fishery woman at St. John’s has laid in two winter shares for the Red Bay harpooner. They say she never asked whether he wanted them."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_choice.choices.grain]
text = "Bring her a shipload of winter grain"
reply = "I came back from the open sea with the grain and the boat nosed up to the beach. Marion weighed every sack herself and counted out my pay on the spot, not a penny short. At the top of the page she wrote a new line: “Two winter shares.” She didn’t say whose. Bernat stood beside her looking at it and asked nothing."
effects = [{ }, { }, { }, { title = "Two Winter Shares" }]

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_choice.choices.ledger]
text = "Help her keep wages and household apart, and write his “say I’m tired” into it"
reply = "I took the page and drew a line down it: wages in one column, household in the other. Bernat didn’t look down. He had Marion read it to him row by row, and at the line that said he could say he was tired he nodded and pressed his palm flat on the table. Marion took the pen back and added one more line under the household column: say so when you’re tired, no wages docked."
effects = [{ }, { }, { }, { title = "Allowed to Be Tired" }]

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_choice.choices.watch]
text = "Stay out of it and let her say it herself"
reply = "I stepped back behind the barrels and said nothing. Marion repeated herself word for word. Bernat was quiet a long while, then said he’d go back to Red Bay and ask the owner. Three days later he was back, without any word from the owner, a new harpoon on his shoulder. “How much?” was all Marion asked. “Mine.”"

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_together]
title = "The Man Who Stayed Behind"
text = "The last ship for Europe weighed anchor, her masts sliding one by one toward the open sea. Bernat did not board. He stood on the drying beach with his harpoon on his shoulder, planted like a post, until the sail was a small white scrap. Marion sat at the shed door reckoning winter stores. She went through them three times and shut the ledger. “Two shares make one share. It saves firewood.” She didn’t look up. “There’s only one stove in the shed.” “That’s why it saves firewood.” She jerked her head toward the door. “Don’t lean the harpoon on the wall, lean it by the door. Come in and eat.” He leaned it by the door and went in."
news = "The last ship for Europe has sailed, and the Red Bay harpooner wasn’t on it. They say he’s wintering at St. John’s, sharing one stove with the Breton fishery woman."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_together.variants.helped]
text = "The last ship for Europe weighed anchor, her masts sliding one by one toward the open sea. Bernat did not board. He stood on the drying beach with his harpoon on his shoulder, planted like a post, until the sail was a small white scrap. Marion kept watch over the grain sacks piled in the corner of the shed, every one weighed by her own hand, and she went through the count three more times and shut the ledger. “Two shares make one share. It saves firewood.” She didn’t look up. “There’s only one stove in the shed.” “That’s why it saves firewood.” She jerked her head toward the door. “Don’t lean the harpoon on the wall, lean it by the door. Come in and eat.” He leaned it by the door and went in."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_together.variants.mediated]
text = "The last ship for Europe weighed anchor, her masts sliding one by one toward the open sea. Bernat did not board. He stood on the drying beach with his harpoon on his shoulder, planted like a post, until the sail was a small white scrap. Marion opened the ledger at the shed door, wages in one column, household in the other, and with her pen joined the two names in the household column into one. The wages column she left alone. “One column for the household. It saves firewood.” She didn’t look up. “There’s only one stove in the shed.” “That’s why it saves firewood.” She jerked her head toward the door. “Don’t lean the harpoon on the wall, lean it by the door. Come in and eat.” He leaned it by the door and went in."

[tracks.pair_marion_bernat.chapters.pair_marion_bernat_epilogue]
title = "The Frozen Bay"
text = "They say last winter Red Bay froze solid, and several ships were caught in the bay and couldn’t leave. Not until spring did anyone go ashore to count, and the men at the try-pots had died in numbers. One whaleboat’s crew all lived. The Basque harpooner in its bow had gone aboard that autumn carrying two winter shares, the sack mouths stitched with a ring of red thread. When people asked how he’d thought of it, he said, “Someone made me take them.” That someone was a Breton woman who kept books in St. John’s, and every autumn she pushed that extra share onto his boat."
news = "Red Bay froze last winter, and they say a good many died. One boat’s whole crew came through, because the harpooner had gone aboard that autumn with two winter shares."
