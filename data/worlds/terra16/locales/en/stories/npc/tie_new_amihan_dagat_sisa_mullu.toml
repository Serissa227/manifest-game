[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_landing.variants.helped]
text = "The ship from Acapulco brought the news: last November, off the coast of California, the English had taken the Santa Ana and set her on fire. Not a single letter aboard survived, so they said. Sisa heard it out and counted the months off on her fingers. “There’s still the other one. It went another way,” she said. “My family will get one yet.” She went inside and came back with a small cloth bundle. Inside was an old spondylus shell, its red faded to a hairline at the rim. Back in Chincha someone had offered three times its worth for it, and she hadn’t let go of it. She put the shell in Amihan’s palm. “That copy—when I wrote it, I added three words at the end.” “Which three?” Sisa closed those callused fingers over the shell one at a time. “Not coming back.” Amihan held it, and was a long time answering. “This channel opens only at high tide. You waited for it.” That night it was Amihan who kissed Sisa first."

[tracks.tie_new_amihan_dagat_sisa_mullu_side]
name = "Two Women at the River Mouth (Side by Side)"

[tracks.tie_new_amihan_dagat_sisa_mullu_side.chapters.side]
title = "Two Women at the River Mouth"
text = "News that the Santa Ana had been taken reached Tondo, and with it went the letter Sisa had sent home to Chincha. She heard it out, went inside, and brought out an old spondylus shell, its color long faded. She threaded it on hemp twine and hung it over the shipwright’s door. “I’m living here from now on.” Amihan didn’t ask anything more. The next day she carried timber down to the river mouth and spent half a month hammering, until there stood a little shed for buying shells, with a board nailed up by the doorway. Sisa wrote the rule on it in charcoal, one careful stroke at a time: hands first, then the goods. The first diver who came to sell stood at the doorway, not understanding, wiping his hands on his shirt again and again and afraid to hold them out. Amihan, planing a board nearby, didn’t look up. “Go on. She only wants to look.”"
news = "A new shell-buying shed has gone up at the Tondo river mouth. The rule on the board by the door: look at the diver’s hands first, then check the goods."

