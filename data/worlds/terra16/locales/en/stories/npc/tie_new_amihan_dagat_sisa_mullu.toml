[tracks.tie_new_amihan_dagat_sisa_mullu]
name = "The Door the Tide Opens"

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_meeting]
title = "Hands First"
text = "The ship from Peru had unloaded her silver at Manila before anyone found what was wrong with her: below the waterline, shipworm had eaten the planking into a sieve. She was towed into the yard at the Tondo river mouth, and Amihan came down with a gang of loggers carrying a few sample timbers. The owner thought Tondo prices were robbery and sent Sisa, who had come out with the cargo of shells, to beat them down. Sisa didn’t look at the wood. She took the loggers’ hands and turned them over one by one, and last of all Amihan’s: callus across the whole palm, black resin packed under the nails. “However fine the timber, count the miles it came on someone’s back.” Her Castilian was stiffer than the loggers’. “The price goes up.” The loggers looked at one another, somebody laughed out loud, and behind her the owner stamped his foot. Amihan let a moment go by before she answered, pointing at the mudflats showing at the river mouth. “The rafts are still upriver. They can’t come in till the water rises. Here you wait to bargain. This channel opens only at high tide.” Sisa nodded, sat down on the timber stack, and stayed there until the water came over the mud."
news = "They’re repairing a Peruvian ship at the Tondo river mouth. The Peruvian woman sent to beat down the timber price turned every logger’s hands over first—and then put the price up."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_turning]
title = "No More Ships from Peru"
text = "All along the Manila waterfront they were talking about that Peruvian ship: two months under repair at Tondo, then off home the moment she was sound—without the woman who came out with the shells. The week it sailed she was down with a fever so bad she knew no one, and it was the shipwright’s daughter from Tondo who carried her on her back to find a physician. This year the galleon in from Acapulco brought more news: the king had given orders that no ship from Peru was to come this way again. Anyone who wanted to go back would have to take the galleon to Acapulco and look for a ship south from there—two years, if everything went well. A porter said he’d heard the woman ask, “Two years?” The shipwright’s daughter counted it out for her on her fingers. “First you wait for the monsoon, then for the galleon, then…” Halfway through, she stopped counting. The woman was lodging with the shipwright’s family now. Someone had seen her sitting at the edge of the yard, watching the water from low tide to high, the whole afternoon."
news = "On the Manila waterfront they say the king has forbidden any more ships from Peru. That Peruvian woman with the shells at the Tondo river mouth fell ill and missed her ship—now she can’t get home."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_closer]
title = "The Tide’s Street Names"
text = "Amihan rowed Sisa out in the small boat to learn the waterways of the river mouth. “This one, at high tide, is ‘the Market.’” The tip of her oar pointed down the water between two rows of stilt houses. “When the tide’s out, it’s ‘the Mud.’” Sisa said it after her once, then pointed to the next channel. When they came alongside the quay, a merchant lifted the lid on a basket of shells for her: even sizes, true color. Sisa didn’t look at the shells. She looked at the divers standing by—hands covered in raw cuts, fingers soaked white. A few questions, and it came out that these divers were in the merchant’s debt: every day under the water paid off a day’s interest. “No.” She put the lid back on. “However pretty the shell, count the dives it took.” The merchant called her a foreign woman who should mind her own business and told his men to carry the basket to another boat. Amihan swung her boat broadside to the quay and rested the oar across her knees. “If she won’t buy, no boat here will carry it.” Not one boatman on the quay moved. Sisa turned to look at her and smiled—three years in Tondo, and the first time she had smiled the way she did at home in Chincha."
news = "A Peruvian woman at the Tondo river mouth refused to buy shells brought up by divers working off a debt. When the merchant tried to ship them elsewhere, the shipwright’s daughter turned her boat across the quay, and not one boat would take them."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_closer.default]
