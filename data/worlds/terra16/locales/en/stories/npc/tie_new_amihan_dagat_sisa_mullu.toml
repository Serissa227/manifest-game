[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_choice]
title = "A Letter Home"
text = "Six years, and this was the first time Sisa had written home to Chincha. It wasn’t a long letter: she was alive, she was in Tondo, she lodged with a shipwright’s family, and she still had all ten fingers. The first two drafts went wrong, and she fed them both to the stove. “Send off a spoiled letter and you’re asking for bad luck.” Amihan sat beside her cutting oilcloth. She folded the third draft, wrapped it twice, and tied it with hemp twine, pulling harder than she ever did on a bundle of hull planks. “The damp gets into everything at sea.” The letter could only go with this year’s galleon—the Santa Ana, leaving Manila in July for Acapulco—and from there with some merchant heading south to Peru. Whether it ever arrived was down to luck. Sisa turned the oilcloth packet over, and over again. “Do you think it’ll get there?” Amihan didn’t answer. She bit through the end of the twine, raised her eyes, and looked at me."
news = "A Peruvian woman at the Tondo river mouth has written a letter home and wrapped it twice in oilcloth. It goes on this year’s galleon to Acapulco, then on to Peru."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_choice.default]
news = "The Peruvian woman at the Tondo river mouth has put her letter home on the Santa Ana—Acapulco first, then on to Peru. Down at the quay they reckon that by a road that long, not three letters in ten get through."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_choice.choices.other_route]
text = "Have her make a second copy and send it to Peru on my ship, by another route."
reply = "Sisa copied the letter once more. She wrote it slower than any of the others, and when she reached the end she covered it with her palm and folded it before anyone could look. Amihan wrapped it twice in oilcloth like the first and tied it tight. In July one packet left Manila with the Santa Ana and the other went aboard my ship. Sisa laid the two packets side by side on the table and looked at them a long while. “One letter, two channels. One of them is bound to catch the tide.” Amihan looked up at her. “That’s my line.” “Six years under your roof,” Sisa said. “I can borrow one line.”"
news = "The Peruvian woman at the Tondo river mouth made two copies of her letter home: one went on the Santa Ana, the other with a different ship, by another way to Peru."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_choice.choices.walk_her_home]
text = "Go with them to the Manila quay and watch the letter loaded onto the Santa Ana."
reply = "The Santa Ana took three days to load. Sisa stood on the quay until the last crate went down into the hold. The oilcloth packet had long since vanished under bales of silk and she couldn’t see it even on tiptoe, but she stayed. Amihan rowed us back to Tondo; I sat in the stern. Sisa sat in the bow and sang a song from Chincha, something about drying shells on the beach, and halfway through she broke off. “The rest of it… I’ve forgotten.” Amihan’s oar stopped too, and the boat drifted with the current. After a while Amihan hummed the rest of the tune. Sisa had sung it, half out of her head, in the fever that made her miss her ship."
news = "On the Manila quay, all three days the Santa Ana was loading, a Peruvian woman stood watching. She didn’t leave until the last crate was in the hold."

[tracks.tie_new_amihan_dagat_sisa_mullu.chapters.tie_new_amihan_dagat_sisa_mullu_landing]
title = "Not Going Back"
text = "The ship from Acapulco brought the news: last November, off the coast of California, the English had taken the Santa Ana, stripped her cargo and set her on fire. Not a single letter aboard survived, so they said. When word reached the yard, Amihan was caulking a seam. Sisa heard it out, went inside, and came back with a small cloth bundle. Inside was an old spondylus shell, its red faded to a hairline at the rim. Back in Chincha someone had offered three times its worth for it, and she hadn’t let go of it. She put the shell in Amihan’s palm and closed those callused fingers over it one at a time. “I’m not going back.” Amihan held it, and was a long time answering. “This channel opens only at high tide.” She looked down at her closed hand. “You waited for it.” That night it was Amihan who kissed Sisa first."
news = "The ship from Acapulco says the English took the Santa Ana last year, and every letter aboard was lost. When the Peruvian woman at the Tondo river mouth heard, she said she isn’t going back."

