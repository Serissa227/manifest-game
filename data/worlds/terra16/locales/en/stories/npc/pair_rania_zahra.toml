# 回忆标题按选项 effects 的下标对应（choice 的 hold_ship、bring_book 的第 4 个效果是 memory）。

[tracks.pair_rania_zahra]
name = "Honey in the Back Row"

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_meeting]
title = "A Rhyme That Walks Like a Camel"
text = "During a break in lessons one of the girls recited the opening couplet of a sailing poem, the one that runs from Aden up to Jeddah. Rania didn’t wait to be asked. She stood and rattled off six more lines in one breath, the rhymes lurching all over the place, then lifted her chin at the room. Zahra, in the corner, didn’t even look up. “Your rhymes walk like a camel. Left foot, right foot, limp.” Every head turned to see Rania’s face. Rania clapped her hands. “Don’t stop—I’ve got the next line!” On the spot she added four more, and worked the camel, the limp and Zahra’s name into the rhymes. The last line went: Even a lame camel makes it to Jeddah, so long as Zahra walks in front and curses it the whole way. The room fell apart laughing. The old lady set down her prayer beads and sent the two of them out the door together. Out on the gallery they were still arguing over whether the last line ought to lose two words. Zahra asked, “Source?” Rania said, “You are.” The water seller outside packed up his stall and carried off his empty jars, and they still hadn’t settled it."
news = "Two girls who study under the lady scholar in Zabid—one writes verses, the other finds fault—argued until the teacher threw them out. The water seller says they kept at it on the gallery for ages."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_closer]
title = "A Jar of Honey Every Morning"
text = "The day for the teaching licenses was set for October. In August Zahra lost her voice and told no one. She still came in first every day and still corrected everyone else, only her corrections got shorter each time, and after each one she took a sip of water. Rania noticed and said nothing. From the next day on, a jar of Wadi Do‘an honey appeared beside Zahra’s desk every morning, with no verse on it and no name. On the third day Rania hauled in a board of jujube wood and set it on the desk. “I’ll read the chains of transmission, you follow along in your head. Wherever you’re shaky, rap on it, and I’ll mark it for you. Saves you talking.” Zahra glared at her. “I don’t need it.” Then she rapped the board once with her knuckle. For days the only sound between them was tap, tap. Once Zahra rapped especially hard: Rania had read two names in a chain the wrong way around. Rania glared back, and Zahra mouthed a single short word. Rania had been hearing that word for two years. She got it at once, laughed out loud, and somebody next door shushed her."
news = "Someone in Zabid has been leaving a jar of Wadi Do‘an honey at the lady scholar’s door every day for over a month. Nothing is ever written on the jar."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_turning]
title = "The Back Row"
text = "When people in Zabid talk about license day, they always start with the half a word. The hall was packed, scholars up front, students and curious merchants behind. Zahra, the old lady’s pupil, recited one chain of transmission after another all morning without a single slip. On the last chain her voice cracked, and only half a word came out. The whole hall went still for a moment; even the people fanning themselves stopped. Then, from the back row, someone tapped the bench twice, softly: tap, tap. Zahra drew a breath and finished the chain, every word right. Afterward the water seller said he knew who had been sitting back there: the Hadrami merchant’s daughter, the one who can’t let anybody recite half a line on the gallery without jumping in to finish it. “She sat there from morning till night,” the water seller said, “and never finished a single line.”"
news = "On license day in Zabid, the Hadrami merchant’s daughter sat in the back row. Usually she talks over everybody. That day she didn’t say a word from morning to night."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_choice]
title = "Her First License"
text = "Zahra was about to teach her own class and grant her own licenses for the first time, in the mosque by the harbor at Mocha. Once the day was fixed, it turned out to be the same day Rania’s family book ship was due to sail. The northeast monsoon had just set in, and the shipmaster said he couldn’t spare a single day. Rania caught me on the quay, a sailing schedule crumpled in her fist. “The shipmaster’s an old partner of my father’s. Every time I open my mouth, he shuts it with the monsoon. Go and ask him whether we can sail a day late.” First I stopped by the lecture hall to tell Zahra the sailing date. She was calling the roll, and her pen never stopped. “Whether she comes or not is no concern of mine.” Then she turned and told her students to keep the front seat by the pillar free, the cushion straightened, and a slip laid on it with a single word: “Reserved.” A student asked who it was for. Zahra opened the register. “Someone who’ll be late.”"
news = "Zahra of Zabid is granting her own licenses in Mocha now. They say she had a student keep a front seat by the pillar free, and won’t tell anyone who it’s for."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_choice.default]
news = "At the new class in the harbor mosque at Mocha, the reserved front seat stayed empty to the end. A woman in the back row listened to half of it, then ran off to catch her ship."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_choice.choices.hold_ship]
text = "Go to the quay and ask the shipmaster to sail a day later."
reply = "The shipmaster grumbled that the monsoon waits for nobody, and a day late meant a whole cargo’s worth of profit. I sat down and worked out what one day would cost him, item by item, paid him the sum in silver, and only then did he loop the mooring line back around the post. On the day of the class, Rania sat in the front seat by the pillar, bolt upright, as if afraid someone would make her move, the slip balled in her hand. Halfway through, Zahra saw her, paused, took a sip of water, and went on faster than she ever had. When the class ended Rania opened her mouth, but Zahra spoke first. “You’re sitting crooked.”"
news = "A Hadrami book ship at Mocha sailed a day late even with the monsoon up. Word is someone sat down and worked out the day’s losses for the shipmaster."
effects = [{ }, { }, { }, { title = "The Front Seat" }]

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_choice.choices.bring_book]
text = "Dig out the commentary Zahra wanted from Rania’s ship and get it there before class."
reply = "Rania said Zahra had asked her to find that commentary in Cairo last year, and it had ended up at the bottom of the hold. The two of us shifted half a shipload of frankincense sacks and cloth before we felt the oilcloth bundle at the very bottom. When I ran into the hall with it, the first student had only just sat down. Zahra opened it to the first page and frowned. “Third line, one word miscopied.” Then she closed the book and, in front of everyone, said “thank you” to Rania, who had come in behind me dripping with sweat. Rania stood there with her mouth open, for once without a comeback."
news = "Somebody on the Mocha quay turned out half a book ship’s cargo just to dig one commentary out of the bottom of the hold and rush it to the harbor mosque before class."
effects = [{ }, { }, { }, { title = "The Book at the Bottom of the Hold" }]

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_choice.choices.listen]
text = "Stay out of it and listen to the class from outside."
reply = "The front seat by the pillar stayed empty, the slip still on its cushion. Halfway through, someone in the back row slipped out bent double, pitch from the quay on the hem of her robe. When the class ended I was standing at the door, and there was Rania running back up from the quay, smelling of the sea: the ship would wait for the evening tide, so she had a little time. Zahra came out, rolled up the reserved cushion with the slip inside, pushed the whole thing into Rania’s arms, and went back in to clear her desk. Rania ran for the quay with the cushion, and halfway there she turned and shouted, “You’ll have it back in the spring!”"
news = "The new lady scholar from Zabid gave her first class in Mocha, and when it was over she rolled up the reserved cushion and shoved it at a woman running back from the quay."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_together]
title = "A Book Without a Cover"
text = "In spring the book ship came back from Jeddah. As always, Zahra came down to Mocha and waited in a warehouse on the quay. Rania lugged in a wooden case first. Inside was a manuscript from the Cairo book market, and two pages in, Zahra had already found a mistake. Rania was ready for that. Grinning, she pulled something else out of her robe: a little booklet, no cover, no title, sewn with coarse thread. Zahra opened it. On the first page was a strip of paper cut from an old draft, in her own hand: Rhymes like a camel walks, limping left and right. After that, one strip to a page, came every correction she had written on Rania’s poems over the years, not one of them thrown away. She turned every page to the end and looked up. Before she could open her mouth, Rania got in first. “You’re going to ask for the source again. It’s here.” She tapped her own chest. Zahra closed the booklet, stood up and kissed her. For a while Rania couldn’t make a sound. At last she said, “Every time I make port from now on, I’ll bring you a book.” “Bring ones with fewer mistakes.”"
news = "Whenever the Red Sea book ship docks at Mocha, the scholar Zahra of Zabid is down on the quay. The Hadrami woman on board brings her a book every time."

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_together.variants.helped]
text = "In spring the book ship came back from Jeddah. As always, Zahra came down to Mocha and waited in a warehouse on the quay. Rania lugged in a wooden case first. Inside was a manuscript from the Cairo book market, and two pages in, Zahra had already found a mistake. Rania was ready for that. She pulled a little booklet out of her robe: no cover, no title, sewn with coarse thread. On the first page was a strip of paper in Zahra’s own hand: Rhymes like a camel walks, limping left and right. After that, one strip to a page, came every correction Zahra had made on her poems over the years. On the very last page was pasted a slip with a single word, “Reserved,” its corners gone soft from being clutched in a sweaty palm. Zahra looked up, and Rania got in first. “You’re going to ask for the source again. It’s here.” She tapped her own chest. Zahra closed the booklet, stood up and kissed her. It was a while before Rania said, “Every time I make port from now on, I’ll bring you a book.” “Bring ones with fewer mistakes.”"

[tracks.pair_rania_zahra.chapters.pair_rania_zahra_epilogue]
title = "Every Port, the Book Market First"
text = "The booksellers at the Jeddah market have all come to know her these last two years: a Hadrami ship with a woman for its master, loud, the sort who, when anyone at a stall recites half a line, leans in to finish it and isn’t embarrassed when it doesn’t rhyme. Yet she is ferociously picky about books. She will turn a manuscript over and over for ages hunting for copying errors, and the moment she finds one, she puts it down. “Not this one. It’s going to someone who does nothing but find mistakes, and if she finds one, I’ll never live it down.” A bookseller up from Aden says she is the same there: the ship barely tied up, the cargo still in the hold, and she is already at the book market. She never haggles over the ones she chooses. She only borrows the bookseller’s pen and draws a little camel in the corner of the first page: three legs straight, one bent. One bookseller asked what it was supposed to be. She said, “Me, writing poetry.”"
news = "At the Jeddah book market they say a Hadrami woman shipmaster buys only the hardest books and draws a lame camel in each one. They’re for a teacher in Zabid, she says."

[tracks.pair_rania_zahra_side]
name = "The Book Ship and the Lecture Hall"

[tracks.pair_rania_zahra_side.chapters.pair_rania_zahra_side_landing]
title = "The Book Ship and the Lecture Hall"
text = "The day after the book ship got back to Mocha from Jeddah, Rania carried a Cairo manuscript into the lecture hall by the harbor and plunked it down on Zahra’s desk. “The priciest book in the whole Cairo market. The copyist swore on his life there isn’t one mistake in it.” Zahra had barely turned a few pages before she scored the margin three times with her fingernail. “Here, here, and here.” Rania leaned over to look and went bright red, then made up four lines on the spot cursing the copyist, and by the third line her rhyme had gone lopsided again. “Third line,” said Zahra. “Limping.” They argued their way from the hall out to the steps behind it and kept at it all afternoon, exactly as they had on the gallery at twelve and thirteen. When the sun went down, Rania’s stomach growled first. Zahra stood and brushed off her robe. “Dinner. And next trip, send me the list before you load the books.”"
news = "The Hadrami woman on the Red Sea book ship brings Zahra of Zabid books every time she’s in Mocha. They start arguing the moment they meet, then go off to dinner together."
