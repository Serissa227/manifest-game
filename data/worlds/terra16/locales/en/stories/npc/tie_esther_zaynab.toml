# C7 英文覆盖：埃丝特 × 宰娜卜（盐路上的回信钱）。只覆盖显示文字，键与中文文件一一对应。

[tracks.tie_esther_zaynab]
name = "Reply Money on the Salt Road"

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_meeting]
title = "The Name She Couldn’t Sign"
text = "Zaynab came late, her cuffs still wet: the camels had drunk their fill outside the south gate before she would set foot in the mellah. She didn’t sit. She stood at the counting table and recited last year’s losses. “Gray-neck, dead at the third well north of Taghaza. The lame one, at the fifth. And a young female we never got around to naming.” Esther, sixteen and minding the table for her father, looked up. “You want dead camels counted against the interest?” “They were my capital.” “Then sign. If you can’t write your own name, what am I supposed to show my father?” Zaynab dipped her thumb in the water bowl and pressed it to the foot of the contract; the paper puckered into a small round wrinkle. “The desert doesn’t honor seals. It honors water.” Esther bent over her sums again. Halfway down, her pen stopped. She struck out the line with the interest and wrote it in again, five points lower. “Set aside the passage money first, or no one gets to leave.”"
news = "A house in the mellah of Fez has lent money to a salt caravan heading south. A girl of sixteen did the sums, and the caravan’s leader, who can’t write, signed with a wet thumb."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_closer]
title = "Forty Days of Accounts"
text = "The moment Esther was back from Algiers she announced she would see the salt road for herself. Taghaza’s mines had changed hands and Zaynab now took her caravan to pits farther east, and Esther would not advance a coin on a road she hadn’t walked. She went south with the caravan for twenty days and back for twenty more. The day they came into Fez the skin was peeling off her nose, and the margins of her ledger were crowded with star names: Zaynab pointed them out each night, and Esther wrote them down by the fire. In among them was a single line, the name of a place nobody could make sense of. Zaynab had a slip of paper in her sleeve now, with “Zaynab” on it in Esther’s hand, and beside the same fire she had traced it forty nights running. At the gateway into the mellah the camels went through first. Zaynab stopped. “Have you finished the accounts?” Esther looked down and ran a finger along the figures, all the way to the bottom. “One line short.” Then she shut the ledger and kissed Zaynab."
news = "The salt caravan is back in Fez with a sunburned clerk in tow, peeling at the nose. She’s the daughter of a house in the mellah, and she walked with the camels for forty days."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_closer.default]
effects = [{}, { title = "Forty Days of Accounts" }]

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_turning]
title = "A Letter from Istanbul"
text = "Early in the year a letter came from Istanbul: Gracia Nasi, the one they called La Señora, was dead. Half the Jewish merchants who had fled Portugal and Italy these past years had sailed on her ships. The house in the mellah needed someone to keep its counter out there, and it sent Esther. By summer the street was still talking about it. The girl who could sing several currencies into one sum was gone, and before she went she had settled every small debt she had, down to the two coppers she owed the oil seller. “I’d rather not owe anyone on the road.” The keeper of the inn outside the south gate knew more. Esther had left a bag of silver behind his counter with “Reply money” stitched across the neck. “Each time Zaynab sends a letter back, give the courier one coin.” Zaynab, he said, always asked two things when she rode in: first about fodder, then, “Anything for me from the mellah?” The salt caravan didn’t come north that season. The bag still hung on its nail behind the counter, not one coin lighter."
news = "The girl from the mellah of Fez who sings her sums has gone to Istanbul. Before she left she hung a bag of silver at the south-gate inn, to pay the courier whenever the salt caravan’s leader sends a letter back."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_choice]
title = "A New Road After the War"
text = "Since the Battle of the Three Kings in August, the roads south had been thick with soldiers making their way home, taking every camel they saw and pressing every driver into service. Zaynab had brought her caravan up from Timbuktu, but she left the last load of gold at an oasis to the south and rode into Fez with only two drivers. She found me at the inn outside the south gate and drew Esther’s letter out of her robe. She couldn’t read; the innkeeper had read it to her once, and she gave it back to me word for word: the price of gold in Istanbul, a new clerk at the counter, this year’s sailings. At the last line she laid a finger on the paper. That line she knew by its shape. “Set aside the passage money first.” She folded the letter. “She writes that every time. Never anything else.” Out in the yard a camel was chewing. She asked me which road the gold should take."
news = "Since the Battle of the Three Kings the salt caravan outside the south gate of Fez has to find another road, and its leader says this year is her last run."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_choice.default]
news = "The salt caravan came back to the south gate of Fez the long way around, four camels and one driver short. Its leader says that was her last run."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_choice.choices.reroute]
text = "Find the caravan a back road clear of the press gangs, and load the gold onto my ship at Sale."
reply = "I found the caravan its road: west from the oasis, clear of the main road and its soldiers, then down to Sale along the herders’ tracks through the hills. The gold went aboard my ship, and every driver walked back into Fez. The day they arrived, Zaynab led the oldest camel in the string to the inn door and sold it on the spot, without counting the money. “I’m not going out again.”"
news = "The salt caravan at the south gate of Fez lost nobody this time: the gold was shipped from Sale, the drivers walked home through the hills, and their leader sold a camel the same day."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_choice.choices.carry_letter]
text = "Take the gold to Istanbul for her, and a letter along with it."
reply = "She sat under the lamp until the cocks crowed and couldn’t get a word of it out. At first light she told me to take the pen, and said one thing: “I’m staying put. Whether you come is up to you.” When I had written it, she took a yellowed slip from her sleeve and, copying the letters on it stroke by stroke, signed her name at the foot of the page, crooked as a camel’s tracks. It was the first time she had ever signed her name. She blew the ink dry and pressed the letter into my hand. “When the gold gets into town, take this with it.”"
news = "The caravan leader at the south gate of Fez has sent her last gold to Istanbul with a ship’s captain, and a letter with it. They say she signed the letter herself."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_landing]
title = "Supper for the Last Caravan"
text = "Zaynab sold the caravan, kept a single she-camel and rented a small courtyard with a well just outside the mellah. On the night she paid off her drivers she gave them one last supper, and set out an extra bowl for the one who hadn’t walked home last autumn. Esther’s reply came too: the counter in Istanbul couldn’t spare her, and from now on she would come back to Fez every winter. Tucked in the envelope, as always, was a coin of reply money. The courier read it out once and left. Zaynab sat down by the well and recited the letter to the she-camel from start to finish without missing a line. When she reached “Set aside the passage money first,” she laughed out loud. “That again.” Then she closed her hand on the coin, got up and called toward the gate: “Has the courier gone far?”"
news = "A caravan leader who sold her whole string has moved in just outside the mellah of Fez, with a single she-camel in the yard. The couriers from Istanbul already know her gate."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_landing.default]
effects = [{}, {}, { title = "Supper for the Last Caravan" }]

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_landing.variants.v1_matched]
text = "With the caravan sold, Zaynab kept a single she-camel and rented a small courtyard outside the mellah, with a well and a spare room. Halfway through the supper for her drivers, a courier from Istanbul knocked at the gate. The reply was one line long. The courier read it, turned the sheet over to check the back, and yes, there was only the one: “When the wind turns, I’m coming.” As always, a coin of reply money was tucked in the envelope. Zaynab pressed it back into the courier’s hand. “No answer this time.” She said the line over to the she-camel three times, then got up and swept out the spare room. That winter Esther really did come, and stayed the whole season."

[tracks.tie_esther_zaynab.chapters.tie_esther_zaynab_landing.variants.v2_helped]
text = "Zaynab sold the caravan to a broker outside the south gate and led home just one she-camel, which she tethered in the small courtyard she had rented outside the mellah. Every driver who had walked back from Sale last autumn turned up for the last supper, not one missing, all elbowing each other for the mutton fat at the bottom of the pot. Esther’s letter had come that morning: the counter in Istanbul wouldn’t let her go, but she would be back every winter, and as usual a coin of reply money was folded inside. Zaynab sat on the edge of the well and recited the letter to the she-camel. The drivers shouted at her to speak up, and when she got to “Set aside the passage money first,” she was the first to laugh. “That again.” She rapped the coin on the rim of the pot. “Whoever goes into town tomorrow takes my answer.”"
