[tracks.pair_ushio_reizei_yuki]
name = "Tide Sound and Pine Wind"

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_meeting]
title = "Three Words Struck Out"
text = "There was a poetry match at the end of the month, and the ladies’ quarters were practicing first. The topic was “A Spring Night.” Ushio knelt in the last seat, and when her turn came she wrote one too: the tide going out at night, a hull settling onto the sand an inch at a time. The senior ladies passed it around and laughed. “Seaside handwriting. Looks like knots in a mooring line.” Reizei Yuki took it and looked it over. “A maid may write poems too, you know.” Before anyone could answer she had a brush in hand. “Tide” became “pine wind,” “sand” became “moss,” “hull” became “sleeve,” and the sea poem turned into a palace poem. Last of all she struck out the final word. “Better with one word fewer.” Ushio took the paper back and, right in front of her, put a line through each of the three changes and wrote her own words back in beside them. “Have you ever heard the tide go out at night?” The whole room waited for the Reizei daughter to lose her temper. Yuki stared at the three black strokes for a long time, then set her brush down by the inkstone. “Well struck. Next time, don’t leave me anything to change.” From behind the blind I saw Ushio restore all three words. The final word, the one Yuki had cut, she left out."
news = "Word from the palace in Kyoto: the Reizei daughter rewrote a maid’s poem, the maid struck it all back on the spot, and neither would give an inch. The ladies watched the whole afternoon."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_closer]
title = "Poling Her Home"
text = "The Tanabata poetry gathering had broken up. Reizei Yuki took a folded paper from her sleeve, pressed it into Ushio’s hand and said nothing. Ushio opened it and glanced down. It was a poem about a boat left on the sand when the tide goes out, waiting for the next flood: the kind of thing Ushio had thought a hundred times and never once managed to say. She folded it shut, ran down to the Kamo River, borrowed a shallow river boat from a fisherman and set the pole against the bank. “Get in. I’ll take you home.” Yuki gathered her robes and stepped onto the boards, and the boat rocked. Ushio caught her arm. “She’ll rock. Watch your feet first.” Yuki looked down at the hand holding her. Ink was ground into the creases between the fingers, new stains over old ones. She looked once and didn’t ask. The whole way there was only the sound of the pole dipping in the water. At the landing at Demachi, Ushio folded the poem into a square no bigger than her thumb and tucked it inside her robe. She didn’t give it back, and she didn’t say thank you. All she said was, “Wait. The tide always turns.” Yuki stepped ashore, then turned. “If you can’t say it aloud, don’t. I know what it says.”"
news = "On Tanabata night someone saw a little boat on the Kamo River. A palace maid was poling, the Reizei daughter was sitting in it, and not a word passed between them all the way to Demachi."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_turning]
title = "News from Itsukushima"
text = "In the tenth month word came from the west: the Mōri had crushed Sue Harukata at Itsukushima, and the ships said to have sealed off the sea for the Mōri were those of the Murakami of Noshima. When the news reached the palace, the ladies finally put it together. That maid who walked too loudly and spoke with a Seto Inland Sea accent was a Murakami daughter. “The pirate girl” stopped being something said behind her back and started being said to her face. They say someone stopped her in a corridor and asked how many people her family had killed that week. She didn’t answer. She turned and walked off. At the poetry meeting the next day the Reizei daughter stood up without waiting to be called and recited an old poem about the Inland Sea, giving its source line by line: the fifteenth book of the Man’yōshū, written by envoys to Silla as their ship passed through those waters. When she finished she asked the room, “And whose ships guard that sea now?” No one answered. The old night-duty lady says that night she saw the Murakami maid in the corridor writing a letter home, with the Reizei daughter beside her grinding ink until it was too thick to run."
news = "When the fight at Itsukushima reached Kyoto, some at the palace jeered at the Murakami maid. The Reizei daughter stood up, recited an old poem of the Inland Sea, and the jeering stopped."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_together]
title = "Letters with No Go-Between"
text = "The Reizei house had come down to Nakamura to teach poetry, and the party’s boat put in at the mouth of the Shimanto. Ushio’s boat had waited three days in Shimoda harbor. Yuki came aboard and spread an oilpaper bundle open on the deck boards: every letter Ushio had sent in two years, stacked by date, the hand a little steadier in each. Underneath was an older pile, the practice sheets Ushio had botched and thrown in the wastebasket back at the palace, each one smoothed flat, not one missing. Ushio drew out the crooked sheet at the very bottom and her ears went red. “You picked these up too?” “The Orchid Pavilion Preface has words scratched out all over it, and people still treasure it,” said Yuki. “Besides, it’s good paper.” She pulled out a letter and pointed at the words on its cover: Kindly pass on. “Stop writing that. Write my name.” Ushio trimmed the lamp brighter, laid out a fresh sheet and wrote the character for Yuki. The first came out too big, the second blotted, the third was right. She dipped the brush to write a fourth, and Yuki closed her hand over Ushio’s on the brush. The wick gave a small crack. Yuki leaned in and kissed her, very lightly, and when she drew back she still hadn’t let go of her hand."
news = "A young lady from a Kyoto poetry house has come to Shimoda harbor in Tosa, and the Murakami daughter poles out every day to fetch her. The harbor says they sit in the cabin over a stack of old letters with the lamp lit past midnight."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_together.variants.v1_matched]
text = "The Reizei house had come down to Nakamura to teach poetry, and the party’s boat put in at the mouth of the Shimanto. Ushio’s boat had waited three days in Shimoda harbor. Yuki came aboard and spread an oilpaper bundle on the deck boards: every letter of Ushio’s from two years, stacked by date, every cover addressed to the same go-between, with that tiny “pass on” beneath the name and a crooked wave beside it. Underneath was an older pile, the practice sheets Ushio had botched and thrown in the wastebasket at the palace, each one smoothed flat. Ushio’s ears went red. “You picked these up too?” “The Orchid Pavilion Preface has words scratched out all over it, and people still treasure it. Besides, it’s good paper.” Yuki drew out the envelope with the wave on it. “Two years of having them passed on. Time we told our go-between. From now on, write my name.” Ushio trimmed the lamp and wrote the character for Yuki: the first too big, the second blotted, the third right. She went to write a fourth, and Yuki closed her hand over Ushio’s on the brush, leaned in and kissed her, very lightly, and still didn’t let go."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_together.variants.v2_helped]
text = "The Reizei house had come down to Nakamura to teach poetry, and the party’s boat put in at the mouth of the Shimanto. Ushio’s boat had waited three days in Shimoda harbor. Yuki came aboard and spread an oilpaper bundle on the deck boards: every letter of Ushio’s from two years, stacked by date. The Reizei gate on every cover was in Ushio’s own hand from the very first one, which sprawled across half the envelope. Each was smaller than the last, until the most recent were the same size as Yuki’s own writing. Underneath was an older pile, the practice sheets Ushio had botched and thrown in the wastebasket at the palace, each one smoothed flat. Ushio’s ears went red. “You picked these up too?” “The Orchid Pavilion Preface has words scratched out all over it, and people still treasure it. Besides, it’s good paper.” Yuki tapped the gate on an envelope. “You’ve got the gate right. You’ve never written my name. Write it.” Ushio trimmed the lamp and wrote the character for Yuki; the third one came out right. She went to write a fourth, and Yuki closed her hand over Ushio’s on the brush, leaned in and kissed her, very lightly."

[tracks.pair_ushio_reizei_yuki.chapters.pair_ushio_reizei_yuki_epilogue]
title = "The Toll Boats"
text = "The Murakami daughter has gone back to Noshima with a ship of her own and the Murakami pass flag at her bow. Inland Sea boatmen say that these days, when you pay the sail toll at Noshima, the islanders always ask one more question once the money’s counted: heading for Kyoto? If you are, you carry a letter along with you, and the toll is still collected to the last coin. One boat in ten, they say, has carried a letter to Kyoto. At the Kyoto end, the Reizei gatekeeper can spot the Noshima flag from half a street away, and has his hand out for the letter before the boatman opens his mouth. They also say the Murakami captain goes up to Kyoto every autumn without fail and comes back with a newly copied book of poems in her hold, wrapped in three layers of oilpaper, stowed under the compass box, and nobody is to touch it. A new hand who didn’t know the rules once reached for it, and she sent him off with one sentence: “That’s my chart.”"
news = "Noshima boatmen say that of the boats that pay the island’s toll, one in ten carries a letter to Kyoto. The Reizei house receives it; the Murakami captain sends it."

[tracks.pair_ushio_reizei_yuki_side]
name = "Two Names Side by Side"

[tracks.pair_ushio_reizei_yuki_side.chapters.pair_ushio_reizei_yuki_side_landing]
title = "Two Names Side by Side"
text = "Ushio brought a boatload of dried bonito up from Tosa, delivered it and stopped in at the Reizei house on her way. Yuki was in the corridor airing a newly copied anthology, the ink not quite dry, its pages spread out one by one on bamboo mats under paperweights. Ushio crouched to look and stopped at a page near the middle: a poem about the tide going out at night, signed “Ushio of Tosa,” set right beside one of Yuki’s own. The Reizei anthologies had never taken a poem from someone who started out as a maid. “The words are ugly,” said Ushio. “Couldn’t you have fixed them when you copied it out?” “If I’d fixed them, you’d only strike them back.” Yuki moved a paperweight an inch. “Ugly, and yours.” Ushio said nothing. She sat down at the edge of the mat and pulled a crumpled sheet from her robe. “Wrote this on the boat. Pick at it.” Yuki read one line and frowned and raised her brush to change it, and Ushio put her hand over the page. They spent the whole afternoon in the corridor trading poems, neither giving way on a single one, and by dark there were three more sheets on the mat, black with crossings-out."
news = "The Reizei house’s newest anthology has a poem about the ebbing tide signed Ushio of Tosa, set beside one of Reizei Yuki’s. Kyoto’s poets say it’s the first time."
