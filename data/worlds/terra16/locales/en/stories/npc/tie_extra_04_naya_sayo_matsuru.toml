# C7 英文覆盖：会磨毛的手巾（纳屋小夜 × 真鹤，朋友）。只覆盖显示文字，按轨道、章节、选项 key 对应。

[tracks.tie_extra_04_naya_sayo_matsuru]
name = "The Cloth That Wore Thin"

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_meeting]
title = "Why Is This Tea So Bitter?"
text = "Last year a Sakai ship came home with word that a noro priestess in Naha had prayed over its whole crew. Sayo sent her a jar of new tea by ship. The reply was three words long: “Far too bitter.” In spring Sayo sailed down herself. The smell met her at the door, more sickroom than tea room: a clay pot bubbling on the stove, where Matsuru was stewing the leaves like a remedy. They needed a full hour, she said, to give up their flavor. Sayo lifted the pot off the fire, took out her bamboo whisk and set about teaching her. Matsuru’s wrist was too stiff. Her first two bowls were murky water; only the third rose into a fine froth. She looked at the froth a while without a word of praise, then got up and pushed the bamboo shutter open. The waves came against the reef, one, then another. “Does your tea room have a quiet like this?” Sayo picked up the bowl. “Finish the tea before we talk about that.” She stayed in Naha half a month. When she left, the whisk stayed on Matsuru’s shelf, with the white linen cloth she had wiped the bowls with hanging beside it."
news = "They’re saying around Naha harbor that a tea merchant’s daughter came all the way from Sakai to teach the noro to whisk tea. The noro had been boiling it like medicine for an hour. Her third bowl finally frothed."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_turning]
title = "The Ship That Never Came In"
text = "Since autumn, people on the Sakai waterfront have been asking after the ship that left for Naha in spring. She caught the last of the north wind out of port and should have been in long ago, yet Naha says nobody there has seen so much as a sail. She was carrying tea for the Naya house, and three Naha men who had crewed Sakai ships for years. Boatmen back from Naha say the noro there has been going from door to door. The old mother says a line, the wife says a line, and the noro writes each one down just as it was said. “I’ll send them all at once,” she told them. “If the ship gets back to Sakai first, the words will be there waiting.” Before the first frost, a Naya clerk let it slip over tea: the young mistress had a letter from Naha, three households’ messages in a neat, careful hand. She read it twice and said only, “Not one word of her own in it.”"
news = "Down at the Sakai docks they say the ship that sailed for Naha in spring still hadn’t been sighted by autumn, and the Naha noro gathered up messages from the crew’s families and sent them to Sakai."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_choice]
title = "Who Carries the Tea"
text = "The ship has turned up at last. A spring gale drove her back north, and she has spent a whole year in a cove on Amami, mending her rudder and waiting for a wind. Everyone aboard is alive. A boat heading north brought the news to Sakai, along with a word apiece from the three Naha men. In the Naya tea room, the new tea is already sealed in its jar. Sayo kneels on the mat cutting paper, sheet after sheet trimmed square and left unwritten, so the three households can send their answers. Kaede leans in the doorway, watching only the lane. “She gathers everyone’s words,” Sayo says, pressing the last sheet flat. “Nobody gathers hers.” Only then does she look up at me. “Are you going to Naha this trip?”"
news = "Word in Sakai is that the Naya daughter cut a stack of plain paper and packed it in with new tea for the noro in Naha, so the families waiting on the late ship could write back."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_choice.default]
news = "The Naya daughter in Sakai sealed a jar of new tea with a stack of unwritten paper and sent it on the next merchant ship to Naha. It reached the noro a month late."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_choice.choices.carry_tea]
text = "I’m sailing for Naha anyway. Give me the tea and the paper."
reply = "When I reached Naha, Matsuru was sitting under the eaves with a few half-folded kerchiefs in her lap. She opened the tea jar and smelled it before she looked at the paper. The top sheet had writing on it, in Sayo’s hand: “This one is for you.” Matsuru held it for a long time, then folded it into a small square and tucked it under the jar. All she said to me was, “Tell her I won’t boil this one.” The rest of the paper she had taken around to all three houses by the afternoon."
news = "The noro in Naha got new tea and a stack of paper from Sakai, brought to her door by a passing captain. By that afternoon, all three households waiting on the ship had their sheets."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_choice.choices.wait_for_letter]
text = "Ask for a bowl of tea and wait while she writes Matsuru a line."
reply = "Sayo whisked me a bowl and picked up her brush. She wrote a sheet and crumpled it, wrote another and crumpled that too. My bowl was empty by the time the third was done, and it held a single line: “Next time you come to Sakai, I’ll mind the door for you.” Over in the doorway, Kaede gave a low laugh. Sayo didn’t turn around. “What are you laughing at? You don’t know the first thing about tea.” Then she folded the note and tucked it under the seal of the jar."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_landing]
title = "The Frayed Cloth"
text = "Sayo came to Naha again and heard a whisk going before she was through the door. Matsuru knelt on the mat, her wrist loose now, and a smooth froth rose in the bowl. She wiped the rim with a cloth before pushing it across: white linen washed to gray, its edges worn to fuzz. It was the one Sayo had left hanging on the shelf three years before. “Look at the state of it.” Sayo reached to throw it out. Matsuru put a hand on it. “It still works.” Sayo drank the bowl dry. “Then tomorrow we’ll go and pick a new one. You keep the old.” Next day, at a cloth stall by the harbor, Sayo went straight for the finest ramie. Matsuru took it out of her hands. “No need for anything costly.” The two of them haggled over a single cloth for half the afternoon, until the stall keeper knocked off the odd coins just to see them go."
news = "At a banana-fiber cloth stall on Naha harbor, the tea merchant’s daughter from Sakai and the noro haggled half a day over one cloth for wiping bowls. The stall keeper knocked off the odd coins to be rid of them."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_landing.default]
effects = [{}, {}, { title = "The Frayed Cloth" }]

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_landing.variants.helped]
text = "Sayo came to Naha again. Matsuru whisked a bowl and pushed it across, and this time it frothed. She still wiped the rim with the white linen cloth Sayo had left three years before, its edges long since worn to fuzz. Sayo reached to throw it out; Matsuru put a hand on it. “It still works.” From under the tea jar she drew a sheet folded into a small square: the top sheet of last year’s stack, with one line written on it now. “I want a jar of tea that doesn’t turn bitter when you boil it. For me to drink.” Sayo stared at the line. “That’s coarse leaf. It hardly counts as tea.” A moment later: “I’ll bring you some next time.” The next day the two of them went to a cloth stall by the harbor for a new one; Matsuru kept the old. Sayo went for the finest ramie, Matsuru said there was no need for anything costly, and they haggled with the stall keeper for half the day."

[tracks.tie_extra_04_naya_sayo_matsuru.chapters.tie_extra_04_naya_sayo_matsuru_landing.variants.letter]
text = "Sayo came to Naha again, and before she was through the door Matsuru pointed at the threshold. “Your letter said you’d mind the door for me. I can’t get to Sakai, so mind this one.” Sayo sat on the threshold for a good two hours and sent away two people asking about sailings before the whisk inside went quiet. The bowl had a froth on it. The cloth for the rim was the white linen one Sayo had left three years before, its edges worn to fuzz. “Look at the state of it.” Sayo went to throw it out. Matsuru put a hand on it. “It still works.” Sayo said, “Then tomorrow we’ll pick a new one. You keep the old.” Next day at a cloth stall by the harbor, Matsuru put back the fine ramie Sayo had chosen. “No need for anything costly.” The two of them haggled over a single cloth for half the afternoon."
