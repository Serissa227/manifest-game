# 树皮上的小口（tie_frana_eleni）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.tie_frana_eleni]
name = "Nicks in the Bark"

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_meeting]
title = "Easy with the Knife"
text = "The envoy from Ragusa had come to talk about a consignment of mastic. Eleni was in no hurry to name a price. First she marched her up to the groves in the south and handed her a little hooked blade. “If you want to beat my price down, cut a tree first.” Frana held the blade the way she would hold a seal, square and solemn, and pressed. It went in half a finger deep and the bark curled up white. Eleni clamped a hand around her wrist. “A tree isn’t paper! Spoil it and you’ll just write out a fresh one, will you? It has to weep again next year.” The envoy looked at the cut for a long moment. “I’m sorry.” Then she stood there, startled at herself. She had apologized many times in council chambers, and every time it had been for a sentence. Back at the market that afternoon Eleni haggled loudly enough for half the street to hear, while every word out of the envoy was a compliment. Eleni won, slapped a bag down in front of her—“This bag is the finest tears. …Don’t listen to the man next door—his are last year’s”—and then pressed one more little piece into her palm. When Frana boarded her ship, she was still holding it."
news = "Up in the mastic groves of southern Chios, the envoy from Ragusa tried her hand at tapping a tree, cut far too deep, and had her wrist grabbed by the girl who sells the resin."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_closer]
title = "Tears of the Second Season"
text = "A year later, in the tapping season, the Ragusan ship tied up and Frana walked straight past the trading house and up to the southern groves. The ground under the tree had been swept flat and dusted with white earth. The cuts made earlier in the summer were running, and the drops fell one by one onto the white and set into little tears. The two of them crouched and counted. Somewhere past forty, Eleni asked, “What you’re telling me this time—is it the truth, or is it the envoy talking?” “The truth. That’s why it sounds so ugly.” Frana kept her eyes on the ground. “The Sultan’s fleet can’t get its teeth into Malta. When it sails again next spring, it will want something softer to bite. I’m afraid that next year this island will have a new master, and I won’t be able to find this tree.” Eleni didn’t answer back. She took Frana’s hand and picked the resin out from between her fingers, bit by bit, and when she had finished she didn’t let go."
news = "The Ragusan envoy is back on Chios this year. This time she skipped the haggling on the quay, went up to the southern groves first, and spent the whole afternoon crouched under one tree."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_turning]
title = "A New Flag over the Quay"
text = "Everyone on the quay says Piyale Pasha’s fleet came in on Easter Day, so many ships the harbor was packed solid. “You couldn’t have squeezed a rowboat in,” says the fishmonger, “and not a shot fired on the whole island.” The doors of the Genoese counting house have been sealed, and the gentlemen who ran it were marched aboard a ship—bound for Istanbul, people say. The mastic still has to be gathered; they chew it in the Sultan’s palace too. Only now someone else holds the scales. As for the girl who sells mastic in the market, the one with the loudest voice on Chios, these days whoever tries to haggle with her gets the same answer: “That’s the price. Take it or leave it.” Not another word of argument. And someone swears they saw a Ragusan flag in the harbor."
news = "Chios has changed flags without a shot fired. The Genoese counting house is under seal, but come July somebody will still be crouched under the trees in the southern groves, cutting the bark."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_choice]
title = "Stay or Go"
text = "“Your Excellency honors Ragusa with your visit. …There, the courtesies are done. This time I’m the one who needs something.” Frana drew me into a corner of the quay out of the wind and lifted the edge of her cloak. A new seam ran along the lining, the stitches as fine as embroidery. “The treaty. If the Pasha gets it, Ragusa has been plotting with Venice. If the Venetians get it, Ragusa has been plotting with the Sultan. Either way, it’s enough to start a war.” Eleni stood behind her, gripping a copied page of the new register. One household was missing from her village, and it was hers: her father had kept the scales for the Genoese counting house for twenty years, and the new tax collector was going door to door with the old accounts. “I can only look after one of these,” said Frana. “Then you look after your paper, and I’ll look after my trees.” Neither of them walked away. They both looked at me."
news = "Since Chios changed flags there’s been a Ragusan woman going in and out of the harbor. She says she’s here to buy mastic, yet nobody has seen her buy a single bag."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_choice.default]
news = "The summer Chios changed flags, the Ragusan envoy stayed only five days and left with her cloak oddly lumpy. The family in the south who kept the scales stayed put, and carried the scales to the tax collector themselves."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_choice.choices.treaty_home]
text = "Unpick the treaty, hide it aboard, and carry it to Ragusa for her."
reply = "I put the treaty under the ballast stones in the hold, and twelve days later it was before Ragusa’s Great Council. The minutes recorded the name of an elderly senator. Frana stayed on the island, drank sherbet with the new tax collector three days running, and polished his report until it shone. The scales still hang in Eleni’s house; someone else just keeps the accounts now. The next time I put in at Chios she met me on the quay and said only, “This time I know who carried it.”"
news = "In the harbor at Chios, the Ragusan envoy spent three days drinking sherbet with the new tax collector, and the family in the south who once kept the Genoese scales are still working their grove."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_choice.choices.take_family]
text = "Bring the ship to the south shore by night and take Eleni’s family to Ragusa."
reply = "The ship waited in a little cove on the south shore with its lanterns out: Eleni’s mother and father, a younger brother, and the scales they had used for twenty years. Eleni came aboard last. She had gone back to the grove first and made one last cut in that tree, a very shallow one. Frana took her treaty on another ship; the day we came alongside at Ragusa, she was already standing on the quay waiting. The following spring a shop selling mastic opened by the harbor."
news = "A mastic-growing family from the south of Chios slipped aboard a foreign ship in the dark—gone to Ragusa, they say—and the new tax collector’s register is one line shorter again."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_choice.choices.sell_treaty]
text = "Take the treaty, then sell it to the Venetian bailo in Istanbul."
reply = "The bailo’s secretary counted out the money and locked the treaty in a copper box. A month later Ragusa recalled Frana and barred her from any embassy for three years. She didn’t write to curse me. That autumn the crate of mastic I had ordered from Eleni came back to my ship unopened. On the lid, in Frana’s hand: “Your deposit is inside. The goods are no longer for sale.”"
news = "Word from Istanbul has it that the Venetian bailo got hold of a Ragusan document, and the envoy who used to come to Chios for mastic was promptly called home."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_landing]
title = "Shade, Every Summer"
text = "In the tapping months the Ragusan ship came again. Frana would stay on the island for a month and leave at the end of it, year after year. Eleni had saved the first tear of the season, wrapped in a fig leaf, and only brought it out once Frana was inside the grove. “You’re always three days late.” “An envoy must always be three days late,” said Frana, folding back a corner of the leaf. “It looks dignified.” “Dignified won’t put bread on the table.” Eleni’s tongue gave no quarter, but the rest of her was already sitting down beside Frana. They stayed in the shade of the tree until dark; somebody’s dog barked down the slope for ages, and neither of them got up. Early the next morning Frana took the little hooked blade and made a cut in the bark. Not too deep, not too shallow. Just right."
news = "Every year in the tapping months a Ragusan woman turns up in the groves of southern Chios, stays a month, and leaves. For that month, the girl who sells mastic won’t haggle with anyone."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_landing.default]
effects = [{}, {}, { title = "Shade, Every Summer" }]

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_landing.variants.sold]
text = "In the tapping months Frana came again. This time she was aboard a wine trader, paying her own fare, in the same cloak she had sewn the treaty into last year, its cuffs frayed. Eleni had saved the first tear of the season in a fig leaf and brought it out once Frana was inside the grove. “Three days late again.” “I’m not an envoy anymore.” Frana took the leaf. “I’m three days late because merchant ships are slow.” She said less than she used to, and not one compliment; and Eleni, for once, didn’t pick a quarrel with her. They sat in the shade of the tree until dark. Early the next morning Frana took the little hooked blade and made a cut in the bark. Not too deep, not too shallow. Just right."

[tracks.tie_frana_eleni.chapters.tie_frana_eleni_landing_b]
title = "A Small Bag of Mastic"
text = "The new shop by the harbor at Ragusa is a small one. Along the counter stands a row of open clay jars, every one of them full of mastic from Chios, and beside them hang the scales that have done twenty years’ service. The shopkeeper still haggles as if picking a fight, so fiercely that the Venetian merchant next door would rather go around to the back streets for his stock. Before every embassy Frana comes in for one small bag and tucks it into the pocket of her cloak nearest the treaty. “Is that a bribe?” Eleni asks, weighing it out with a sidelong look. “Something for the Pasha’s men to taste?” “It’s tears.” Frana pulls the drawstring tight. “It isn’t for anyone.” Eleni snorts, and before the scale beam has even settled she drops another little piece into the bag."
news = "A new mastic shop has opened by the harbor in Ragusa. The woman from Chios who runs it haggles like she’s spoiling for a fight, and the Venetian merchant next door won’t set foot inside."

