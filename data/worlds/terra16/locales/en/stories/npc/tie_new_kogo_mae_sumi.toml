[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_landing.variants.helped]
text = "Mae Sumi had come as the mission’s scribe, and she stayed a full month in Kyoto. On the first day, the moment the official business was done, she followed the line under the signature into a lane in Upper Kyoto, and under the persimmon tree a woman stood waiting. They stopped three paces apart. Neither had ever seen the other. Mae Sumi spoke first. “Kyoto has no sea, only the little sea in my inkstone, and tonight even that has a tide—” Kogo took it up without missing a word. “—the evening swell of Naha harbor, rising all the way to my brush.” “When you come home, bring the story with you.” Mae Sumi laughed. “This time I brought it myself.” All that month, night after night, they said everything the letters had left out. On the third night, by the lamp, Kogo took her hand and kissed her. The day the mission left, at the landing on the Yodo River, Kogo pressed a letter on her and told her not to open it until she was aboard. It held one line: “The next one I’ll write with your face in front of me.”"

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_landing.variants.matched]
text = "From the day the mission entered the city, Kogo waited outside the temple gate where the envoys lodged. Her house had been swept three times over, and two cups stood ready on the table. Mae Sumi, standing in for the scribe who had fallen ill, came in on the later ship, with only a few days of the mission left. As she reached the temple gate, a woman beside it rose to her feet. They stopped three paces apart. Neither had ever seen the other. Mae Sumi spoke first. “Kyoto has no sea, only the little sea in my inkstone, and tonight even that has a tide—” Kogo took it up without missing a word. “—the evening swell of Naha harbor, rising all the way to my brush.” “When you come home, bring the story with you.” Mae Sumi laughed. “This time I brought it myself.” Night after night they said everything the letters had left out. On the third night, by the lamp, Kogo took her hand and kissed her. The day the mission left, at the landing on the Yodo River, Kogo pressed a letter on her and told her not to open it until she was aboard. It held one line: “The next one I’ll write with your face in front of me.”"

[tracks.tie_new_kogo_mae_sumi_side]
name = "Thirty Years of Letters"

[tracks.tie_new_kogo_mae_sumi_side.chapters.side]
title = "A Room Full of Letters"
text = "While the Ryukyuan mission was in Kyoto, Mae Sumi found the house under the persimmon tree in Upper Kyoto. They didn’t stop for pleasantries. They tipped thirty years of letters out of two boxes, covered the floor of a whole room, and matched them up year by year. The year Satsuma stopped the ships, the space stood empty; in the year beside it lay two letters side by side. One held a pressed coral-tree flower, its red gone nearly black. “Did I send this?” Mae Sumi held it up to the light. “You did. I wrote that we don’t have that flower in Kyoto, and the very next letter, there it was.” On the third day Mae Sumi opened her register, struck out the line that read “the scribe in Kyoto,” and on the first page wrote, neatly, “Kogo.” Before they parted they agreed that from now on, whoever got a letter first would sing that song through before anything else. “I can’t sing,” said Kogo. “Then read it. Where the words won’t come out, sing those parts—I’ll teach you.”"
news = "While the Ryukyuan envoys were in Kyoto, one of the suite and Kogo the letter writer spread thirty years of old letters across a whole room and spent three days and nights matching them up."

