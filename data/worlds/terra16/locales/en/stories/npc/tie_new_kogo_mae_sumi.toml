# C7 英文覆盖：替别人写信的人（小督 × 真栄澄）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标。

[tracks.tie_new_kogo_mae_sumi]
name = "The Letter Writers"

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_meeting]
title = "A Letter for a Dead Man"
text = "All along the Sakai waterfront they’re telling the same story. A young sailor off a Ryukyuan ship came down with a fever, lay nine days, and never got up again. His shipowner had to send word to the man’s old mother in Naha. He wrote two lines himself, couldn’t stand the look of them, and sent to Kyoto for a girl who writes letters for hire. She was in no hurry to pick up the brush. First she asked, “When he lay down, which way was he facing?” The shipowner had to think. “South. He said it was warmer that way.” She asked what the sailor liked to eat and what he’d said near the end; she asked all afternoon and wrote all night. Next day the old clerk read it out for the shipowner, stopped halfway to press a sleeve to his eyes, then went back through it from the top. “Strange. Not once does it say ‘dead.’” The letter left on the next ship bound for Naha."
news = "A Ryukyuan sailor died of a fever in Sakai, and his shipowner sent all the way to Kyoto for someone to write to the man’s mother. The old clerk who read it out wept, and swears the word “dead” isn’t in it once."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_closer]
title = "Who Wrote This Letter?"
text = "The letter took nearly a year to reach a fishwife in Naha. She couldn’t read, so she sent for Mae Sumi. Mae Sumi read slowly. When she came to “He lay down facing south, facing home,” her voice turned, and the next few lines came out sung. When it was over, the old woman gripped the paper. “Who was this writer to my son?” Mae Sumi opened her mouth and found no answer. “…I’ll ask for you.” She wrote the reply, a line for every line the old woman spoke: “Don’t send his clothes back. Give them to some sailor who needs them.” When the old woman had said her piece, Mae Sumi started a new line and added one of her own: “Who wrote this letter?” That night she entered a new line in her register: the scribe in Kyoto."
news = "Mae Sumi, who reads letters out for folk in Naha, read a death notice that came from Sakai, then added a line of her own to the reply, asking who had written it."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_closer_b]
title = "A Ryūka and a Waka"
text = "For three years the letters between Kyoto and Naha had carried other people’s messages, with a single line of their own tucked in at the end. This spring, the one forwarded from Sakai held nothing of anyone else’s. Only a ryūka: “Below Mie Gusuku the evening tide / runs north at every dusk, / meets the sea wall and turns back— / this letter won’t turn back.” Kogo had been writing poems for other people for ten years. No one had ever written one for her. She answered with a waka. It took three nights, and the spoiled sheets filled half her book chest. On the third night I came by for a letter I’d asked her to write. One sheet still hung over the lip of the chest, not quite stuffed in. It held one line, “Kyoto has no sea,” struck through. Kogo drew it back, smoothed it flat and slid it under her inkstone. “I’ll write the words. Keep the feelings for yourself.” She sealed the finished letter. “This time, both of them are mine.”"
news = "Kogo, who writes letters for hire outside the palace in Kyoto, has written a poem for herself for once. It took her three nights, and the spoiled sheets fill half a book chest."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_closer_b.default]
effects = [{}, { title = "A Ryūka and a Waka" }]

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_turning]
title = "The Year the Ships Stopped"
text = "Talk on the Naha waterfront has it that Satsuma found fault with the manners of Ryukyu’s ayabune envoys, gave them a dressing-down to their faces, and the ships north stopped then and there. For how long, nobody can say. The woman who writes letters for sailors’ families comes down to the docks on the first of every month to ask. The first time, the harbor master was polite about it: “No ships from Satsuma, no road for a letter from Kyoto.” By the fifth time he was shaking his head before she reached him. She took no offense. She drew an old letter from her sleeve and read him its last line: “When the tide comes in, tell me.” Then she said, “I’ll come again next month.” Her neighbors say she goes home, opens the book where she logs her letters, and writes the date in the empty column all the same."
news = "Satsuma took Ryukyu’s envoys to task for bad manners, and the ships north from Naha have stopped. A woman who writes letters for sailors’ families still comes down on the first of every month to ask after mail from Kyoto."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_choice]
title = "A Place on the Envoy Ship"
text = "By spring it was all over Naha: the new king would send a monk of Tenryū-ji in Shuri up to Kyoto by way of Satsuma, to pay his respects to the Regent who now rules the whole realm. Mae Sumi was forty-eight. Thirty years of letters made a thicker pile than her register. The envoy’s suite had been settled long ago, and nobody had said a word about taking along a woman who writes letters for hire. She spread Kogo’s latest letter in front of me and pointed to the small line under the signature: “Upper Kyoto, the lane running north from Ichijō, the house with the persimmon tree by the door.” “Thirty years I’ve stood on that dock seeing other people off.” She folded the letter again, every crease lined up. “This time I want to get on the ship myself.”"
news = "Ryukyu’s envoys are going up to Kyoto by way of Satsuma, and Mae Sumi, who writes letters for Naha families, wants to go with them. She’s been asking everyone she knows to put in a word."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_choice.default]
news = "Word is the Ryukyuan envoy’s scribe fell ill just before they sailed, and Mae Sumi, who writes letters for Naha families, was called in to take his place. She only made the later ship north."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_choice.choices.envoy_seat]
text = "Go with her to the envoy’s staff and argue for a scribe’s place aboard."
reply = "I pleaded her case for a good while, and the envoy’s secretary only waved me off. “There has never been a place for a woman on an envoy ship.” Mae Sumi didn’t argue. She handed him her register. He turned a few pages—which ship, which year, who was aboard, not a name missing—and his hand went still. “What this mission lacks is someone who can keep names straight.” By evening her name had been added to the list of the envoy’s suite, on the very last line. She looked at that line for a long time, as if it belonged to someone else."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_choice.choices.carry_letter]
text = "Take a letter to Kyoto ahead of her, so the house by the persimmon tree knows to expect her."
reply = "A month later I was in Kyoto, waiting under the persimmon tree until dark. When Kogo came up the lane, I held out the letter. “She’s coming with the envoys.” She didn’t open it; she had known that hand for thirty years. She stood a while with the letter pressed to her chest. Then she said, “Thank you for coming all this way,” went inside, and swept the house from one end to the other. She even scrubbed the threshold."

[tracks.tie_new_kogo_mae_sumi.chapters.tie_new_kogo_mae_sumi_landing]
title = "First Sight, Thirty Years On"
text = "Mae Sumi had stepped in for a scribe who fell ill, and she reached Kyoto on the later ship, with only a few days of the mission left. She followed the line under the signature into a lane in Upper Kyoto, and under the persimmon tree a woman stood waiting. They stopped three paces apart. Neither had ever seen the other. Mae Sumi spoke first. “Kyoto has no sea, only the little sea in my inkstone, and tonight even that has a tide—” Kogo took it up without missing a word. “—the evening swell of Naha harbor, rising all the way to my brush.” “When you come home, bring the story with you.” Mae Sumi laughed. “This time I brought it myself.” Night after night they said everything the letters had left out. On the third night, by the lamp, Kogo took her hand and kissed her. The day the mission left, at the landing on the Yodo River, Kogo pressed a letter on her and told her not to open it until she was aboard. It held one line: “The next one I’ll write with your face in front of me.”"
news = "The Ryukyuan envoys stayed in Kyoto a while. One of the suite kept slipping off to a persimmon tree in Upper Kyoto and coming back each time with a roll of writing up her sleeve."

