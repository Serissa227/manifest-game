# English display overlay for pair_salih_ilhan (No Names on the Gauge): nested by track, chapter, choice and variant key; display text only, no gameplay.
# Effect arrays line up by index with the Chinese file; only memory titles need a translation, the other slots stay empty tables.

[tracks.pair_salih_ilhan]
name = "No Names on the Gauge"

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_meeting]
title = "The Notes in the Margin"
text = "Before dawn, under the arcade, the blind teacher leaned on a pillar and listened to Salih read. Salih read slowly, one clause at a time, and Ilhan lasted half a page before he broke in. “At this rate we’ll still be here at sunset.” He pulled the book out of Salih’s hands and ran on, bright and fast, turning pages as if something were chasing him. When he finished he lifted his chin and waited to be praised. The teacher shook his head. “You skipped the margins. Not one line. Those notes from earlier readers are what I listen for.” Ilhan went red to the ears. Salih did not snatch the book back. He only walked over and laid his finger on the line that had been missed. “Brother, it’s here. The shaykh says the ear remembers longer than the eye.” The next morning, before it was light, Ilhan was already on the stool nearest the teacher, the best stool beside it empty, a fold of his robe pinning it down. When Salih came in he did not look up. “That one’s for the servant, provincial. Don’t get ideas.”"
news = "In Cairo, a Janissary officer’s son grabbed the book from the student reading to his blind teacher and raced through it. The old man said he had skipped every margin, the part that matters."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_closer]
title = "Marks on the Gauge"
text = "When the Nile began to rise, the teacher sent his two students to the Nilometer on Roda to read the gauge and come back and tell him about it. Ilhan strode ahead the whole way. At the ferry landing he stopped, turned, and saw Salih far behind. When Salih came up, Ilhan spoke first. “I was on my way anyway. That’s all.” The gauge stood at the southern tip of the island, the stone shaft sunk deep, its steps going down one by one into the water. “Never seen a river this big, have you, provincial?” Salih looked at the water. “Where I come from, the river comes for three days a year.” Ilhan craned over the edge and called the number. “Fifteen cubits and six marks!” “Look again?” Salih said softly. Ilhan glared, then bent to look once more, and his ears went red. “…Five.” Back in the teacher’s room, the two of them described how cold the stone was and how slick the moss on the steps. The teacher laughed and asked, “So how high is the water?” Before he opened his mouth, Ilhan glanced at Salih."
news = "That blind teacher in Cairo sent two students out to the water gauge on Roda, and they say they came back describing even the moss on the steps."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_turning]
title = "The Late Sixteen Cubits"
text = "They say the Nile came up late that year. The day passed when it should have reached sixteen cubits and it was still a few marks short, so the canal dam stayed uncut and the price of grain in Cairo changed every morning, with queues outside the bakers’ doors. The young clerk who had just joined the governor’s office, the Janissary’s son, copied water reports until the small hours and threw spoiled sheets all over the floor; people took it for impatience with his pen. Across the city, the Yemeni student at al-Azhar read to his blind teacher through the night, three volumes, until his voice cracked. Around Flood Festival, Roda was full of people of every kind, but the two young men were not there together, and the man who minds the gauge said it was the first time in all these years."
news = "The Nile rose late that year, sixteen cubits would not come, and grain prices climbed daily in Cairo. They say two young men who came every year were missing from the gauge on Roda."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_choice]
title = "Who Can Leave"
text = "Flood Festival was ten days off. Salih found me in the arcade at al-Azhar, a slip of paper crumpled in his hand, dates written and crossed out. “The teacher wants a whole day of reading that day. And Ilhan has a pile of papers at the governor’s office. I don’t want to make him drop them.” He paused. “Brother, tell him any day suits me, and don’t say I’m the one pushing.” At dusk Ilhan stopped me at the gate of the governor’s office and pushed a slip of his own at me, the date changed for the third time. “Tell that provincial any day is fine with me. …See if it suits him, though. He shouldn’t leave the teacher.” Both wanted to meet at the gauge on Roda, and neither would ask the other to give way."
news = "Before Flood Festival in Cairo, the governor’s young clerk and the Yemeni who reads to a blind teacher sent word through a friend. They say they changed the date three times."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_choice.default]
news = "On festival day in Cairo, the Yemeni finished a whole day of reading and the governor’s young clerk finished his papers. They say the two reached Roda one after the other once it was dark."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_choice.choices.cover_ilhan]
text = "Copy papers at the governor’s office so Ilhan can go"
reply = "The head clerk stood behind my shoulder for half an hour, picked out three faults, and finally said “It will do” and walked off. Ilhan thrust his pen case into my hands, got as far as the door, and came back. “It’s not that I don’t trust you, it’s just that if he gets there first, you’ll—” “Tell him you’re on your way,” I finished for him. His ears went red at once, and he ran down the steps without looking back."
effects = [{}, {}, {}, { title = "A Day of Copying" }]

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_choice.choices.read_for_salih]
text = "Read to the teacher for one evening so Salih can go"
reply = "I held the book and read with a tight throat, stumbling. The teacher smiled after half a page. “A new voice. You read so carefully, you must be afraid of every word.” He waved a hand toward where Salih stood. “Go on, I release you tonight.” Before he left, Salih folded down the corner of the page I was to read and left it by my hand. “Tomorrow I’ll pick it up from here.”"
effects = [{}, {}, {}, { title = "The Folded Page" }]

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_choice.choices.watch]
text = "Stay out of it and carry each message word for word"
reply = "I carried the words over exactly as given and added nothing. Salih answered me, “Then we’ll wait until the teacher is done.” Ilhan answered, “Not till it’s fully dark? …Fine, I’ll bring a lamp.” The ferryman told me later that there was a lamp on the steps of Roda that night, burning until daylight."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_together]
title = "A Night on Roda"
text = "At night the island held nothing but the sound of water. Ilhan waited on the steps with a lantern. Salih came with a book under his arm and turned pages for a long time before he stopped. “This page. Listen.” The page held a poem he had copied out himself, soft at the edges from being folded so often, and none of the teacher’s books had it. When it was over Ilhan opened his mouth, and the line about being on his way anyway never came. He set the lantern down and picked it up again. “You read it better than the teacher’s book, provincial.” Salih smiled and did not look away. It was Ilhan who leaned in first. Afterward he turned, red-faced, to the gauge and insisted, “Sixteen cubits. It’s there.” “Look again?” Salih asked. Ilhan studied it for a long time. “…One mark short.” They agreed to come to this same step every Flood Festival from then on, whether the river rose early or late."
news = "Someone was reading poetry beside the Roda water gauge at night. They say it was the Yemeni who reads to a blind teacher, and the one listening was the governor’s young clerk."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_together.variants.helped]
text = "At night the island held nothing but the sound of water. Ilhan, on the steps with his lantern, said, “Somebody won us this night this year.” Salih came with a book under his arm and turned pages for a long time before he stopped. “This page. Listen.” The page held a poem he had copied out himself, soft at the edges from being folded so often, and none of the teacher’s books had it. When it was over Ilhan opened his mouth, and the line about being on his way anyway never came. He set the lantern down and picked it up again. “You read it better than the teacher’s book, provincial.” Salih smiled and did not look away. It was Ilhan who leaned in first. Afterward he turned, red-faced, to the gauge and insisted, “Sixteen cubits. It’s there.” “Look again?” Salih asked. Ilhan studied it for a long time. “…One mark short.” They agreed to come to this same step every Flood Festival from then on, whether the river rose early or late."

[tracks.pair_salih_ilhan.chapters.pair_salih_ilhan_epilogue]
title = "The Yearly Promise"
text = "The old man who minds the gauge on Roda says that for two years now, every Flood Festival, two young men have come. One wears a clerk’s robe, the other carries a book. One calls out the number fast and the other makes him look again, and whoever called it wrong goes red and never says it was the wind. They sit on the steps late into the night. Sometimes the one with the book reads and the one in the robe listens, and sometimes it is the other way round, fast and full of mistakes, and the other never stops him. Every year before the festival the old man scrubs the marks on the gauge, and they get clearer each time, though their two names are not carved anywhere on it. The moss on the steps he leaves. He says those two have gotten used to that step."
news = "The old man on Roda says two young men come to see the gauge every Flood Festival, one calling the number fast, the other making him look again."

[tracks.pair_salih_ilhan_side]
name = "Two Records"

[tracks.pair_salih_ilhan_side.chapters.pair_salih_ilhan_side_landing]
title = "Half a Cubit Apart"
text = "On Flood Festival day Ilhan and Salih each took a record out to Roda. Ilhan’s was copied from the figures the governor’s office announced; Salih’s was what he had seen himself. Halfway through comparing, the two sheets differed by half a cubit. “The office’s numbers were measured,” said Ilhan, slapping his paper down on the step. “Brother, I watched the water climb to the third line,” Salih said, and would not give way. They argued in the sun all afternoon, neither willing to strike out his own line, and finally went back together and laid both sheets across the blind teacher’s knees for him to judge. He ran his fingers along the edges of the two papers and laughed. “Keep both. If they ever agree, I’ll start to worry.”"
news = "Two young men at the Roda gauge each held a record and argued over it all afternoon. They say the difference was half a cubit, and in the end they took it to the blind teacher to judge."
