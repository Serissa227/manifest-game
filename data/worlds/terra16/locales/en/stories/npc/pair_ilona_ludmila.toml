# C7 配角线 pair_ilona_ludmila 的英文显示覆盖（嵌套表写法，按轨道、章节、选项与 variants 的 key 对应）；只覆盖文字，不复制玩法。

[tracks.pair_ilona_ludmila]
name = "Reading Her the Daylight"

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_meeting]
title = "The Quarry’s Book List"
text = "The bounty came from a man in leather gloves: find someone who goes about at night, someone with a pale face. Ilona can see that kind of thing. She slipped in through the side door of the Old Town library after midnight, counting the windows and doors first—two windows, one door—and then the people. I was copying in the reading room; all I saw was a woman moving along the shelves, one hand on the hilt of her knife. At the very back of the stacks a single candle burned. Ludmila, the night keeper, sat beneath it and did not look up. “Hush—softly now. I haven’t finished that page.” Ilona kept her knife out. Ludmila did not pretend to be asleep, either. She finished the page, then drew out a slip of paper and pushed it across the table. On it were one title and one page number. “Tomorrow, in daylight, look at a page for me. Just the one.” “Why daylight?” Ilona asked. “It has been a very long time since I saw words by day.” The knife point dropped an inch. “What’s your name?” “Ludmila. And yours?” “Ilona.” She folded the list twice and tucked it into the pouch at her belt. She never went back for the bounty."
news = "A woman with a Black Sea accent walked into Prague’s Old Town library one night with her hand on her knife, they say, and walked out holding a book list."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_closer]
title = "A Page at the Window"
text = "For more than a year Ilona had come once a month, always by day. She stood at the south window of the stacks and read a page aloud; Ludmila sat in the deepest shadow between the shelves and listened, and never came one step closer to the window. I was at the next table waiting on a book, and listened all morning. This month it was a traveler’s account in manuscript. The writer had been to the monastery at Broumov and seen the Devil’s Bible, a book it takes two monks to lift: more than a hundred hides went into its pages, he wrote, and the monks say it was written in a single night. He had copied one picture into his account—a green-faced devil, claws out, a forked tongue. Ilona stopped and held the manuscript up toward the shadows. “Your kind—do you all like looking at this?” The shadows were quiet a moment. “Your kind—do you all like asking that?” For the first time, Ilona laughed out loud. The old day keeper poked his head up from behind the counter, and she clapped a hand over her mouth. “Go on,” Ludmila said. “The page facing the devil is the city of heaven. Read that one too.”"
news = "This year Prague’s Old Town library has kept a window open by day as well, and a foreign woman stands at it reading aloud. Nobody who comes to borrow can make out what she’s reading."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_turning]
title = "Strangers After the Crowning"
text = "In September Rudolf was crowned King of Bohemia in Prague. Carts jammed the city gates for half a month, and the town filled up with nobles, attendants, stargazers, apothecaries, and others nobody could quite account for. Innkeepers in the Old Town say a few knights who speak Hungarian took rooms and stayed on. They skipped the procession and stayed out of the churches. They went door to door asking one thing: had anyone seen a woman from the Black Sea, a woman of few words who can’t sit still with her back to a window? Then they asked where the night keeper of the library lives, when she opens, when she leaves. The old woman at the bakery says a knight pressed a silver coin into her hand; she took it and still said she didn’t know. The boy at the riverside tavern says the Black Sea woman sits by the door every night these days, orders a single cup, and stays till closing."
news = "Since the crowning, Prague has filled up with strangers, and a few knights who speak Hungarian are going door to door in the Old Town asking about the library that opens at night."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_choice]
title = "Every Last Page"
text = "The tavern by the Vltava was about to close. Ilona pushed the door open, looked at the windows first, then at me, and set her heel against the threshold. “Leave the door open. …Good. Stay right there.” She pulled a pledge slip from inside her coat and slapped it on the table. It was from the Old Town library, in Ludmila’s hand: “Twelve pages, one silver coin.” “They’ve found me. The order that raised me.” She spoke fast. “Their terms: hand over the ‘thing’ in the library. Do that, and the old debts are wiped clean.” I asked whether Ludmila knew. “She knows. I told her.” Ilona turned the slip over. There was a line of small writing on the back. “She said to show you.” The line read: “The pledge stands, and the books still go out. You people are always in such a hurry.” “She’s opening tonight like always.” Only then did Ilona sit, back to the wall, knife by her hand. “So. Tell me what I do.”"
news = "Prague’s Old Town library hasn’t had a quiet night lately, and at the tavern by the river a woman with a Black Sea accent often sits until dawn with a knife at her elbow."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_choice.default]
news = "Some knights who speak Hungarian turned Prague’s Old Town library inside out all night while that Black Sea woman stood in the doorway, arms folded, telling them it held nothing but books. Books were all they found."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_choice.choices.shield]
text = "Let a lie slip at the riverside tavern and lead the knights out of town."
reply = "I drank at that tavern until midnight, waited for the Hungarian speakers to take the next table, and then, thick-tongued, let it “slip”: the Black Sea woman had caught a coach to Vienna last week and still owed me money. The knights were out the city gate first thing next morning. Ilona heard me out and slid her knife back into its sheath. “When you lie, you look more like a good person than I do.”"
news = "Somebody at a tavern by the Vltava had too much to drink and let something slip, and a few knights who speak Hungarian left for Vienna first thing the next morning."
effects = [{ }, { }, { }, { title = "A Lie Sent to Vienna" }]

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_choice.choices.parasol]
text = "Find a sunshade and a veil, and pick an overcast day for Ludmila to go out."
reply = "The parasol came from a secondhand shop in the Jewish Town, its canopy of dark oiled silk; I had a tailor sew the veil double. It was ten days or so before an overcast afternoon came. Ludmila stood on the library steps under the parasol, behind the veil, and read the notices posted across the street for a quarter of an hour. “So this is the color of words by day.” Ilona stood between her and the sun and did not move a step."
news = "One overcast afternoon a woman with a parasol and a veil stood on the steps of Prague’s Old Town library reading the notices for a quarter of an hour, with someone wearing a knife beside her."
effects = [{ }, { }, { }, { title = "A Quarter Hour Under Clouds" }]

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_choice.choices.hand_over]
text = "Go to the knights’ inn and tell them what happens at the library at night."
reply = "I told them everything, item by item: when the side door opens, which candle burns at the back of the stacks. That night the stacks caught fire. Ludmila was gone. Ilona dug through the ashes for three days and found only half a book list, charred. She came to me holding it and asked nothing at all. She looked at me the way you look at a hunter."
news = "The stacks of Prague’s Old Town library caught fire in the middle of the night and half of them burned. The doorkeeper says some knights who speak Hungarian came by that evening."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_together]
title = "Two the World Didn’t Catch"
text = "Once things had blown over, the books came back from outside the city crate by crate. I helped carry the last one in; Ludmila checked the page counts at the shelves, and not one book was missing. That night Ilona didn’t leave. Ludmila closed the ledger and, for the first time, asked her: “Where are you from? Don’t say the Black Sea. The Black Sea is very big.” Ilona counted the windows and doors once more, then the people. Three. Her eyes rested on me a moment. “You can stay.” Then she told it. It took a long while; the candle was changed once. When she had finished, Ludmila opened the book at her elbow to the middle, then shut it. “The books say… no. No book has ever written this down.” She was quiet a moment. “We are both of us people this world never caught.” Ilona didn’t answer. She pushed the candlestick a little nearer to her. After that Ilona came once a month to read a page. Whenever she left, there was a book list from Ludmila tucked inside the book, and its first line read: “For Ilona. Read these by day. You needn’t read them to me.”"
news = "The night keeper of Prague’s Old Town library has a regular reader these days who comes by daylight, reads one page, and goes. That reader’s name never appears on the borrowing slips."

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_together.variants.v1_parasol]
text = "Once things had blown over, the books came back from outside the city crate by crate. The dark parasol hung behind the door of the stacks, mud from that afternoon still on its tip. Ludmila finished checking the page counts and looked up at it. “Next overcast day, I’m going out again. To see the river this time.” That night Ilona didn’t leave. Ludmila closed the ledger and, for the first time, asked her: “Where are you from? Don’t say the Black Sea. The Black Sea is very big.” Ilona counted the windows and doors once more, then the people. Three. Her eyes rested on me a moment. “You can stay.” Then she told it. It took a long while; the candle was changed once. When she had finished, Ludmila was quiet a moment. “We are both of us people this world never caught.” Ilona didn’t answer. She pushed the candlestick a little nearer to her. After that Ilona came once a month to read a page. Whenever she left, there was a book list from Ludmila tucked inside the book, and its first line read: “For Ilona. Read these by day. You needn’t read them to me.”"

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_together.variants.v2_helped]
text = "Once things had blown over, the books came back from outside the city crate by crate. Ilona said she’d heard those knights were still going inn to inn in Vienna, looking. Ludmila laughed. “When you living people lie, you always throw it a long way.” That night Ilona didn’t leave. Ludmila closed the ledger and, for the first time, asked her: “Where are you from? Don’t say the Black Sea. The Black Sea is very big.” Ilona counted the windows and doors once more, then the people. Three. Her eyes rested on me a moment. “You can stay.” Then she told it. It took a long while; the candle was changed once. When she had finished, Ludmila was quiet a moment. “We are both of us people this world never caught.” Ilona didn’t answer. She pushed the candlestick a little nearer to her. After that Ilona came once a month to read a page. Whenever she left, there was a book list from Ludmila tucked inside the book, and its first line read: “For Ilona. Read these by day. You needn’t read them to me.”"

[tracks.pair_ilona_ludmila.chapters.pair_ilona_ludmila_apart]
title = "Half the Stacks Burned"
text = "Half the stacks of the Old Town library burned one night before spring. The men who fought the fire say it started at the very last row of shelves, where only one candle is ever lit. The night keeper vanished for a month. Borrowers took it for granted she had burned in there, and some fretted over the pledge money she was holding for them. Then word came from outside the walls: a cellar out there had a lamp burning again at night. It stays open only till cockcrow and lends only to people it knows; pledges are still reckoned by the page, and books with scorched edges go out like any other. The woman from the Black Sea found her way there and still goes once a month to read a page. The tavern by the river, she has never set foot in again. The boy who works there says she came as far as the door once, looked over the people sitting inside, and turned and walked away without even pulling the door shut behind her."
news = "Half the stacks of Prague’s Old Town library burned, and its night keeper was missing for a month. Later she opened again outside the city—nights only, and only for people she knows."
