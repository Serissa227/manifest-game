# C7 英文覆盖：马先喝水（维克拉姆 × 胡拉姆）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标，只有回忆标题需要译文。

[tracks.pair_vikram_khurram]
name = "Water First"

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_meeting]
title = "The Horse Drinks First"
text = "The gray had been twenty days on a ship and still wobbled on its legs. Vikram, the broker from Vijayanagara, walked three circles around it and was already asking for the fourth time. “Seven years old, I’ve checked the teeth, so what are you asking—” “Feed the horse first. Then we’ll ask who’s paying.” Khurram, the Persian horse dealer, never looked up. He crouched, slipped the bit out, and led the animal toward the trough. “The sun’s going down!” “It drinks. You wait.” The gray drank a long time. Khurram listened to it swallow until it was done, then brushed off his hands. “Now we can talk price.” Next morning Vikram turned up with a wooden bucket, set it down by the gray’s hooves, and said, as usual, “Still too much.” But he let the horse drink first."
news = "In the Bhatkal horse market a Vijayanagara broker and a Persian dealer fought over whether to water the horse or haggle first. Next day the broker showed up carrying his own bucket."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_closer]
title = "A Loose Shoe"
text = "The ditch was hardly a ditch, but the chestnut dug in its front hooves and would not cross. Vikram was in full flow. “Whorl on the chest, my grandfather’s side always said, a horse like that will—” Khurram was already crouched at the leg. He dug a sharp little stone out of the frog of the hoof, rolled it in his palm, then pointed at the other foot. “The shoe’s loose. A nail’s sticking up. It isn’t stubborn. It hurts.” Vikram’s sentence broke off in the middle. He squatted to look at the nail and looked for a long while. “…How did I not feel that yesterday?” “Yesterday you were haggling.” The handsome chestnut stayed in the stall after that. When people saw Vikram at the market he was leading a colt that still needed schooling, arguing with Khurram over how many pounds of fodder it should get. When they parted, they took the same road."
news = "That quarrelsome broker in Bhatkal no longer rides the prettiest horse in the market. They say a Persian dealer taught him better with one small stone."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_together]
title = "The Same Road"
text = "The kingdom wanted more warhorses every month, and the buyers pushed like men collecting debts. Khurram led four horses with loose shoes off to one side and refused to pass them as sound. Vikram clacked the beads of his abacus. “Do you know what the fine is? Four horses. Four!” “I know.” “You know, and still—” They argued until dark. Then they tipped their purses out on the fodder pile together, counted out the grooms’ fares home, and wrapped each share in a cloth. Only one lamp was left burning in the stable. Vikram leaned on a post and took a long time to speak. “All my years in this trade, and I’ve never been the first to walk away from anyone.” Khurram said nothing. He set the last bundle down, crossed the straw, and took his hand. After a while, he kissed him."
news = "The two horse traders who bicker all day in a Bhatkal stable chipped in together for the grooms’ fares home. Once the shouting stopped, they walked off the same way."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_turning]
title = "Talikota"
text = "The word along the coast is that Vijayanagara lost a great battle at Talikota. The capital has been stripped bare and burned for months. Every day more people come down to the western ports, and the Bhatkal horse market is full of animals run off from the interior, saddles still on, with nobody asking a price and nobody buying. Some say a few of those horses were sold out of this very market last winter."
news = "Vijayanagara has lost at Talikota and its capital has been plundered. Bhatkal’s horse market is full of runaway horses from inland, and nobody is buying."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_choice]
title = "Word From the Capital"
text = "The ledgers lay open in the stable, and beside them a map Khurram had drawn of the interior with four villages ringed. Those were the places his missing grooms had last sent word from. “I’m going,” Khurram said, brushing down a horse without turning. “They’re out there.” “There are routed soldiers in the hills, and rain.” Vikram pushed the abacus aside. “I’m taking the grooms we have and the books to the coast, and not a day later. A debt has a balance due, and a man needs a way out.” “Then take yours.” The brush stopped. Vikram turned first and looked at me. “Scout both roads for us.”"
news = "Since Talikota, one of Bhatkal’s two horse traders has headed for the hills to find people and the other has pulled out for the coast. They say each tied a rope to the same hitching post before leaving."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_choice.choices.two_roads]
text = "Scout both the inland road and the coast road, and draw them a map"
reply = "I carried three days of food, walked the inland road as far as the first ford, and counted every village along the coast where a person could rest. Back at the stable I drew it all on one sheet and covered it in marks. The inland road would wash out in three days; the coast road would hold. Khurram studied it, then moved his start up by two days. Vikram didn’t stop him. He led out his own best horse, the chestnut. “Take this one. Let it drink first, on the road.”"
effects = [{}, {}, {}, { title = "The Marked-Up Sheet" }]
news = "Somebody in Bhatkal walked both roads and came back with a map covered in marks. They say the Persian dealer looked it over and moved his departure up."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_choice.choices.guide]
text = "Go inland with Khurram to find the grooms, and bring him back"
reply = "I went inland with Khurram. The first village was empty. The second had burned on one side. At the well in the third sat two grooms who stood up when they knew him and then crouched back down, crying too hard to speak. We found four in all. A villager said he had seen a fifth, heading north. Khurram didn’t say a word on the way back. Outside Bhatkal, the first thing he asked was, “Has Vikram left yet?”"
effects = [{}, {}, {}, { title = "The Four Grooms Found" }]
news = "Somebody went inland with the Persian dealer and brought back four of his missing grooms. They say that coming into town the first thing he asked was whether the broker had left."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_choice.choices.watch]
text = "Stay out of it and wait at the stable door until they finish"
reply = "I sat on the fodder pile by the door. They went from the ledgers to the rain and from the rain back to the ledgers until both were hoarse and the lamp wick had been trimmed twice. At dawn Khurram shouldered a water skin and headed for the hills, and Vikram drove the remaining grooms and the cart toward the coast. Before they left, each tied a rope to the hitching post at the door, one high and one low, and neither rope was touched."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_epilogue]
title = "Back in the Stable"
text = "Spring had come, and the stable smelled as it always had, of fodder and horse sweat. Vikram got there first and crouched by the trough watering a colt, with water he’d carried himself in the same old bucket. Footsteps sounded at the door. A dusty party led its horses in. It was Khurram, with the grooms he had found behind him. They stood on either side of the trough, beside the hitching post, for a long time. Khurram spoke first. “Has the horse had its water?” “It has.” Vikram’s voice came out rough. “And you?”"
news = "In a Bhatkal stable the two horse traders have found each other again. They say the Persian dealer’s first words were to ask whether the horse had drunk."

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_epilogue.variants.helped]
text = "Spring had come, and the stable smelled as it always had, of fodder and horse sweat. Vikram got there first and crouched by the trough watering a colt, with water he’d carried himself in the same old bucket. Footsteps sounded at the door. A dusty party came through the door, with Khurram at the head and the grooms he had found behind him. He was riding the chestnut, which had gone thin but wore new shoes. Vikram went to the hooves first. Only after he had run his hand over them did he look up. “The shoes held,” Khurram said. “Has the horse had its water?” “It has.” Vikram’s voice came out rough. “And you?”"

[tracks.pair_vikram_khurram.chapters.pair_vikram_khurram_epilogue.variants.matched]
text = "Spring had come, and the stable smelled as it always had, of fodder and horse sweat. Vikram got there first and crouched by the trough watering a colt, with water he’d carried himself in the same old bucket. Footsteps sounded at the door. A dusty party led its horses in. It was Khurram, with four grooms behind him. He didn’t speak. He walked to the hitching post, took out a knife, and cut a name into the wood. “Who’s that?” Vikram asked. “Uday. The fifth.” Khurram blew the shavings off. “Has the horse had its water?” “It has.” Vikram’s voice came out rough. “And you?”"
