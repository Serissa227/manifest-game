# C7 英文覆盖：替你写不替你答（鞠千代 × 小督）。只覆盖显示文字，按轨道、章节、选项、变体 key 对应；effects 数组保留下标。

[tracks.tie_kikuchiyo_kogo]
name = "I’ll Write It, You Answer It"

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_meeting]
title = "The Reply He Couldn’t Say"
text = "A matchmaker had come to the Asukai house from a family in the north of the city, and the house sent back a single instruction: Kikuchiyo was to answer with a poem himself and recite it to the messenger in the morning. After dark he knocked at the little house under the persimmon tree, hugging a small sack of rice. “W-write it for me.” “One measure of rice, one poem. Rewrites cost extra,” said Kogo, without looking up. She wrote for the better part of an hour by lamplight and pushed a folded sheet across to him. He got as far as the second line and his throat locked, as if a ball were wedged in it. He tried again and again, and every time he stopped in the same place. Kogo scooped half a measure out of the sack and pushed it back. “Rice buys the words, nothing more. I don’t charge for the half you can’t say. Where you’re afraid to read, change it yourself.” He crouched on the threshold and rewrote until the paper went fuzzy at the edges under his thumb. On the third try the line became “My ball hasn’t landed yet.” Kogo nodded. “That one sounds like you.” “O-once more. This time I’ll only watch the ball.” He spread the sheet across his knees and began again from the top, and this time he reached the last line."
news = "A family in Kyoto’s palace quarter sent a go-between to ask for the Asukai boy, and the boy sent back a poem he had rewritten three times himself."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_turning]
title = "Taken the Wrong Way"
text = "The ladies’ quarters in Kyoto have talked of nothing else all summer but the Asukai house’s reply. The family in the north of the city took the line “My ball hasn’t landed yet” to mean “He’s young, wait two more years,” waited an honest year, and this summer could wait no longer and sent word again. The court ladies have chewed on it and added a layer of their own: the boy is shy, says the ball hasn’t landed, and has caught it already. “Shy ones always write like that. A no that means yes,” one lady says with great authority, and nobody stops her. People by the kemari ground say the boy hasn’t kicked once all summer, and the ball he sent flying in spring is still wedged in the cherry tree, with no one to fetch it. Someone heard him at the foot of the wall, telling it, “I never said yes.” Over and over, and the wall didn’t answer. Some people carried all this to the girl under the persimmon tree who writes letters for hire. She was grinding ink and didn’t look up. “He changed the poem himself. All I did was nod.”"
news = "The Asukai boy’s refusing poem has been taken for a coy yes, and the court ladies of Kyoto are telling it with relish: he’s only shy, they say, and has already said yes."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_choice]
title = "Handing the Brush Back"
text = "The persimmons had ripened and littered the ground by the door. The family from the north of the city had come a third time, and this time they spoke plainly: they wanted a straight answer, written so that no one could mistake it. Kogo ground fresh ink and unrolled a long sheet. “A long poem. Three measures. This time I’ll write it so nobody can misread it.” She opened her rice ledger to the page from two years back, where she had copied the line “My ball hasn’t landed yet” in the margin, and set a fingertip on the word “yet.” “I should have stopped you then.” She had just loaded the brush when a hand pressed down on a corner of the paper. Kikuchiyo’s fingers were shaking, and so was his voice. “This time—this time I’ll write the last line myself.” Kogo’s brush hung in the air. She looked at him, then at me, standing in the doorway."
news = "Word in Kyoto is that the Asukai boy has one last reply to write, and that he stopped the girl who writes for him and said he wanted to write the closing line himself."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_choice.default]
news = "The Asukai house in Kyoto has sent off its last reply, with a wobbly closing line said to be the boy’s own; the other family understood it and has not called again."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_choice.choices.own_line]
text = "Tell Kogo to check only for mistakes and let Kikuchiyo write the whole poem."
reply = "Kogo glanced at me, set her brush back in its rest and pushed it across to Kikuchiyo. “The brush is yours. I only look for mistakes, and mistakes are free.” He wrote all night, and a dozen crumpled sheets piled up by the threshold before he had a clean copy at dawn. Kogo read it from start to finish and touched a single character in the last line. He had written “The ball has already landed,” but the character for “already” was missing its closing stroke, so it read “self.” She closed it with the brush. “That one was wrong. The rest is right.” He stared at it a long while before he could speak. “Then, then this poem—” “Is yours. Go and recite it. If they misread it again, that’s their fault.”"
news = "The Asukai house’s last reply has gone out from Kyoto, and they say the boy wrote all of it himself, with a single character corrected; the other family understood it and has not called again."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_choice.choices.kogo_writes]
text = "Ask Kogo to write the whole thing as before, with no gap anyone could slip through."
reply = "“As before,” said Kogo. She dipped her brush and wrote straight through, and took her three measures of rice without ceremony. Kikuchiyo’s hand slid from the corner of the paper and did not come up again. Not one word of the long poem could be misread: the ball had landed in its own yard, not over the wall, and every line was sealed shut. He read the long poem from start to finish without a stumble, without even losing his breath. When he finished he folded the paper without looking at her. “This is your poem. It isn’t mine.” Kogo was tying up the rice sack. Her hands paused, and she didn’t argue."
news = "The Asukai house’s last reply has gone out from Kyoto, written so tightly that no one could misread it; the other family read it and has not called again."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_landing]
title = "A Friend’s Fee"
text = "The kemari gathering at the Asukai house was breaking up, and cherry blossoms lay all over the yard. The elder brothers, the legitimate sons, all claimed sore throats, and nobody would recite a poem to close the day, so every eye fell on the boy under the eaves. Kikuchiyo stood, sleeve crumpled in his fist, and recited a poem he had written himself. He went slowly, and on the last line his voice did not shake. The yard was quiet for a moment before someone clapped. He crossed to the corner where Kogo sat copying out poems for the Asukai house and set a sack of rice beside her inkstone. “That’s your fee.” Kogo weighed the sack in her hand, opened the neck and looked in. One measure, exactly. “I didn’t write this one.” “It’s—it’s for teaching me to rewrite it three times.” His face went red to the ears. Kogo didn’t push the sack back. Blossoms fell on the sheets of poems, and she set the rice on top of them."
news = "At a spring kemari gathering in Kyoto, the Asukai boy stood in the yard and recited a poem he had written himself, and nobody made a sound through the last line."

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_landing.default]
effects = [{}, {}, { title = "A Friend’s Fee" }]

[tracks.tie_kikuchiyo_kogo.chapters.tie_kikuchiyo_kogo_landing.variants.ghost]
text = "The kemari gathering at the Asukai house was breaking up, and cherry blossoms lay all over the yard. The elder brothers all claimed sore throats. Kikuchiyo stood and recited a new poem, not the one from last autumn. He went slowly, and on the last line his voice did not shake. Kogo stood at the very back with her hands in her sleeves, took in every word, and was the first to turn and slip out by the side gate. Early next morning a sack of rice sat on the threshold under the persimmon tree, weighted with a crooked note: “One measure, full. Thanks for three rewrites.” A voice came from behind the tree: “T-the fee.” Half a head peeked out and ducked back. Kogo picked up the sack and spoke to the trunk. “Ugly handwriting. Not an ugly recital.” She tucked the note into a book."
