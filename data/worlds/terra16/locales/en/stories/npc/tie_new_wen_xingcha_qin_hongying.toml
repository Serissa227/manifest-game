# C7：tie_new_wen_xingcha_qin_hongying 的英文显示覆盖（嵌套表，按轨道、章节、选项 key 对应）；不含玩法字段。

[tracks.tie_new_wen_xingcha_qin_hongying]
name = "The Cloud Reader"

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_meeting]
title = "No Sailing Today"
text = "The shipowner stands on the gangplank shouting that the tide won’t wait. Qin Hongying does it the old way: people first, six men, none missing; then silver, one chest, seals unbroken. On a stone bollard by the quay sits an old woman chewing betel, her head tipped back at the sky. After a good while she says, “No sailing today.” “Granny, this ship’s none of your business,” Qin says without looking around. The old woman takes no offense. She talks like a watchman calling the hours, one line at a time: “Don’t rush to ask what lies west of the West. Learn the stars in front of you first. Look at the feet of those clouds. They drag like a broom.” The shipowner laughs out loud. Qin glances to the southwest, hoists the chest onto her shoulder and walks back down the plank. The shipowner curses the bad luck, casts off and leaves without her. That night a gale blows up and two ships go over outside the harbor. Early next morning Qin walks the whole waterfront with a packet of cakes until a fish seller nods toward the bollard. “Granny Wen? Oldest pilot in Yuegang.”"
news = "An old woman chewing betel on the Yuegang quay studied the sky a good while and said nothing would sail that day. The escort woman carried her silver straight back down the gangplank, and that night two ships went over outside the harbor."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_closer]
title = "Cloud Feet"
text = "The stairs of the sea-watch tower are steep. Wen Xingcha stops on the third step and declares they were built crooked. Qin doesn’t argue; she just crouches down in front of her. At the top, the old pilot points her palm-leaf fan at the sky and quizzes her, cloud by cloud. “That one. Flat underneath—” “Fair weather.” “That one, trailing threads—” “It’ll turn.” “And one dragging like a broom?” “Stay in.” The old pilot allows her two words: “Not bad.” Qin runs her thumb along her scabbard. There is a notch cut into it. The year before last she took trailing threads for a flat base. That job spent three days in the rain on the Jiulong River, two chests of tea were soaked, and when she got back she cut the notch herself. At dusk she carries Wen down again and sets her on a bollard by the quay. “Cargo can be repaid. People have to come home. You count as cargo too.” Wen pats her knees. “Those stairs are crooked, that’s all.”"
news = "The woman who runs the Yuegang escort agency carries the old pilot up the sea-watch tower every few days. The two of them point at clouds and talk until dark, and then she carries her back down."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_closer.default]
effects = [{}, { title = "Cloud Feet" }]

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_turning]
title = "General Qi’s Men"
text = "In the tea shed on the Yuegang waterfront, everyone is talking about General Qi’s men from Zhejiang. The pirate nest on Hengyu lay beyond a stretch of mudflat, they say, so every soldier carried a bundle of straw, laid it on the mud at low tide and walked across, and the place fell in a day. A month later Niutian in Fuqing fell too. Some thump the table and say the sea will be quiet at last. Others lower their voices: once it’s quiet, the officials will come to manage the ships. The escort agency has had a slow season, half the shipowners it usually sees, and the men squat on the threshold throwing dice. Inside, Qin Hongying finishes cleaning her saber, slides it home, and lets her thumb rest on the notch in the scabbard. “Half the business. Not one man short.” Over in the tea shed, Wen Xingcha hears it all out and sets her bowl down on the table. “Let them manage the ships. Somebody still has to read the sky.”"
news = "In the Yuegang tea sheds they say General Qi’s men from Zhejiang crossed the mudflats on bundles of straw and took the pirate nest at Hengyu, then Niutian. The escort agency on the waterfront has lost half its trade."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_choice]
title = "The Last Unlicensed Sailing"
text = "Word is that next year the sea will open and anyone sailing abroad will need a license first, so this season’s unlicensed ships bound for the Southern Seas will be the last out of Yuegang. Wen Xingcha has stood on the quay all morning, and whenever anyone comes near she tucks her bamboo cane behind her back. She says she wants to go aboard one more time and look at the stars out there, on the ship whose cargo Qin Hongying is escorting. She is sixty-eight this year. “No.” That is all Qin will say, but her hand is already counting the people aboard: pilot, helmsmen, sailors. She reaches the end and starts again from the top. The old pilot ignores her and turns to me. “What do you say? Will these old bones still know the stars out there?”"
news = "The last smuggler out of Yuegang is bound for the Southern Seas. The old pilot, sixty-eight, wants to go aboard, and the escort woman guarding the cargo has counted the crew three times."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_choice.default]
news = "The last smuggler out of Yuegang came home with a broken mast. They say the old pilot never got aboard after all, and her legs ached the whole winter."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_choice.choices.sound_ship]
text = "Find her a sturdier ship sailing the same season, with helmsmen who will take her word."
reply = "I find a newly refitted ship in the harbor whose master learned to read the sky from her years ago. The moment he hears it’s Granny Wen, he has a stool nailed down in the bow. She sits on that stool for a month, and every cloud she points to turns out as she says. The day the ship comes in, Qin Hongying is waiting on the quay. She counts heads, then carries Wen down the gangplank on her back, and over her shoulder the old pilot says, “The stars out there are just as they were when I was young.”"
news = "The old pilot of Yuegang went south that season on a newly refitted ship and sat in the bow for a month. Now she tells everyone the stars out there are the same as when she was young."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_choice.choices.wait_for_license]
text = "Talk her into waiting for next year’s opening and taking the first licensed ship."
reply = "The old pilot gives no answer and goes home on her cane. Early next morning she is back on the quay, and the first thing she says is, “Then I’ll wait. It’s one year. The stars won’t run off.” Beside her, Qin Hongying lets out a long breath, bows her head and goes back to polishing her saber, on the side that was already bright."
news = "The old pilot of Yuegang says she’ll wait for next year’s opening and take the first licensed ship. The escort woman beside her spent half the day polishing one saber."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_landing]
title = "The First License"
text = "Yuegang has opened to the sea, and the first ships with licenses are making ready to sail. Last year Wen Xingcha never did get aboard that smuggler, and her legs ached all winter; the ship came home with a broken mast. Since spring she has come down to the quay every day on her cane. Qin Hongying is escorting the cargo in the hold, and as the clerk reads from the license she counts heads along with him. At the end there is one too many. “Passengers don’t count,” says the clerk. “On my list they do.” Qin writes the extra one at the bottom of her escort list and crouches at the foot of the gangplank. Halfway up, the old pilot speaks from her back. “Cargo can be repaid, people have to come home. This time I’m the cargo, so you’d better bring me home.” “Quiet. Watch the clouds.” Wen settles in the bow and looks up. The clouds are flat underneath."
news = "Among the first licensed ships out of Yuegang was one with the port’s oldest pilot sitting in the bow. The escort woman guarding the cargo had carried her aboard on her back."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_landing.default]
effects = [{}, {}, { title = "The First License" }]

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_landing.variants.helped]
text = "This is the second year running that Wen Xingcha has gone to sea. Last year she came home on another ship and said, “The stars out there are just as they were when I was young,” and Qin Hongying carved the words into the door of the escort agency, where the men see them every time they come and go. Now Yuegang has opened to the sea, and the first ships with licenses are making ready to sail. Qin is escorting the cargo in the hold, and as the clerk reads from the license she counts heads along with him. At the end there is one too many. “Passengers don’t count,” says the clerk. “On my list they do.” She writes the extra one at the bottom of her escort list and crouches at the foot of the gangplank. Halfway up, the old pilot speaks from her back. “Cargo can be repaid, people have to come home. This time I’m the cargo, so you’d better bring me home.” “Quiet. Watch the clouds.” Wen settles in the bow and looks up. The clouds are flat underneath."

[tracks.tie_new_wen_xingcha_qin_hongying.chapters.tie_new_wen_xingcha_qin_hongying_landing.variants.waited]
text = "Yuegang has opened to the sea, and the first ships with licenses are making ready to sail. Last year Wen Xingcha agreed to wait a year, and she has not waited a day longer: the moment the licenses were issued, she was sitting on the quay with her cane. Qin Hongying is escorting the cargo in the hold, and as the clerk reads from the license she counts heads along with him. At the end there is one too many. “Passengers don’t count,” says the clerk. “On my list they do.” Qin writes the extra one at the bottom of her escort list and crouches at the foot of the gangplank. Halfway up, the old pilot speaks from her back. “Cargo can be repaid, people have to come home. This time I’m the cargo, so you’d better bring me home.” “Quiet. Watch the clouds.” Wen settles in the bow and looks up. The clouds are flat underneath. “What did I tell you? The stars didn’t run off.”"
