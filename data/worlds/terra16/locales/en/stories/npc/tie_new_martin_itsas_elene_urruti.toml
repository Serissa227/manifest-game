[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_landing.variants.v2_counted]
text = "On Cooper Street there is a shop with an iron hoop nailed to the left of the doorframe and a little bundle of dried herbs hanging on the right. Barrels on the left, medicine on the right. Seafarers come in to order water casks and find a packet of herbs pressed into their hands as they pay; people who come about chilblains drop a cracked meal tub on the left as they walk in and leave carrying the tub and the cure together. Nailed to the doorframe is a cask lid branded with the number thirty. The salvage ship came home in autumn without a leak in any of the thirty casks, and Martin sawed the lid off the last one and nailed it up here. “From now on I only count water on land,” he said as he put up the shutters. “Three times, four times, however many I like.” Elene was clipping a prescription sheet to the wall with a wooden peg. “Good. I can keep up with the wounds on land.” Next morning Martin stood in the doorway with his mallet for a long while before he said, “No ice last night.” Elene went on spooning herbs into a pot and didn’t look up. “I was right beside you, and I shut the window tight. Of course there wasn’t. I’ll do it again tonight.”"

[tracks.tie_new_martin_itsas_elene_urruti_side]
name = "Two Doors, One Porch"

[tracks.tie_new_martin_itsas_elene_urruti_side.chapters.side]
title = "Casks and Cures Next Door"
text = "On Cooper Street, Elene’s apothecary has opened next door to Martin’s cooperage, and the two shops share one porch where seafarers crowd out of the rain. They order their water casks at Martin’s, then step next door for medicine at Elene’s, all in one trip. The prescription sheets are copied onto wooden tags, one tag nailed to each cask. “You wrote this one wrong,” Martin said, tapping a tag with his mallet. “Frostbite’s under fever.” Elene went on lettering the next tag without stopping. “How many times did you tap the hoop on the seventh cask? You called the count after two.” Martin shut his mouth and went back to tap it again, counting aloud this time: one, two, three. Elene pulled the tag off, struck out the line, wrote it fresh, and nailed it to his cask."
news = "On Bilbao’s Cooper Street two shops share a porch. Whoever buys a cask pops next door for medicine, and every cask carries a prescription tag."

