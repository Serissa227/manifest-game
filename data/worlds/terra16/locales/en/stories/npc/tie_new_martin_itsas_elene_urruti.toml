[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_turning]
title = "News from Red Bay"
text = "As winter set in, ships back from Newfoundland came into Bilbao one after another with the same news: the San Juan, loaded to the hatches with whale oil, had gone down in a storm at Red Bay. “She sank in the harbor, in shallow water,” a sailor told the tavern. “Every man got ashore. The ship and the oil are gone.” The shipowner’s counting-house stayed shut for three days. The women on the jetty did not leave; they waited ship after ship and counted the men off one by one. People on Cooper Street say the harpooner’s daughter stood at the end of the jetty for two days with her herb basket on her arm, and as each ship tied up she called out, “Is Martin Itsas aboard?” and then looked at the hands of whoever stepped off. When the last ship docked, Martin Itsas was among them. His hands were tucked in his sleeves until Elene caught hold and pulled them out: ten fingers, and two of them frostbitten. “Eight left,” he said. “Enough to hoop a cask.” Elene said nothing and took him into the back room."
news = "Ships back from Newfoundland say the San Juan went down at Red Bay with a full load of whale oil. Every man got ashore, but the ship and the oil are gone. The women on Bilbao’s jetty are waiting ship by ship."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_choice]
title = "Sail Again or Stay"
text = "I went to Cooper Street to order water casks for my ship. Martin didn’t look up when I came in; his knuckles went on rapping the hoop, tap after tap. I asked about the dark rings under his eyes, and he said the loft was drafty. A fresh notice from the shipowner was pasted to the shop door: a cargo of whale oil still lay under the water at Red Bay, a crew would go back in spring to salvage it, and men were wanted. “If the cooper’s son doesn’t go, who’s going to count those casks?” he said. His right hand was half healed, the cloth wound up to the wrist, and beside the old scar on the back of it two fingers were bandaged fat. Elene crouched next to him and peeled off the old dressing without a word: wash, salve, wrap tight. Then she set the salve pot down on the table. “I’ve washed the wound. Whether you play the hero is up to you.” The knuckle stopped on the hoop."
news = "The shipowner has posted a notice: come spring they sail back to Red Bay to salvage the oil that went down with the San Juan, and men are wanted on Bilbao’s Cooper Street."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_choice.default]
news = "A notice on Cooper Street is hiring men to salvage whale oil at Red Bay. The cooper’s son has given the shipowner’s advance back and spent a whole day hammering hoops in his father’s shop."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_choice.choices.medicine_red_bay]
text = "Take your two herbal draughts and her prescription sheet to the salvage ship and hand them to the surgeon."
hint = "You need two herbal draughts on you before you can carry the medicine aboard."
reply = "Elene packed a wooden box with several bundles of dried herbs of her own mixing. I laid my two draughts on top and the prescription sheet over everything: one line to a remedy, one remedy to a complaint. I carried the box to the salvage ship. The surgeon turned two pages and asked who had written it. “A girl who knows her herbs,” I said. He tucked the sheet into his log. Martin didn’t sail. On the day the ship cast off, a sailor whistled on the gangplank and Elene stared him quiet with one look; Martin stood at the end of the jetty with his hands in his sleeves until the sails were out of sight. In autumn the ship came home, and the surgeon told anyone who would listen that the box had saved three men. Elene said nothing when she heard it. She went back to the tavern and copied the prescription sheet out again."
news = "A salvage ship left Bilbao’s jetty for Red Bay with one more box aboard, its medicines labeled in a careful hand. The cooper’s son stayed ashore and watched from the end of the jetty for a long time."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_choice.choices.count_barrels]
text = "Go through the salvage ship’s water casks with Martin, one tap at a time."
reply = "We carried the salvage ship’s water casks out onto the jetty one at a time. Martin tapped each one, ear against the staves, and called the count; I steadied the cask, and Elene scratched a tally on a wooden tag with her charcoal, one stroke a cask. At the thirtieth he stopped. “I’ve counted these three times.” Elene said nothing and drew a small crescent moon beside the last stroke. He hammered the last hoop tight and set down the mallet. When the salvage ship cast off, he stood on the jetty and didn’t move."
news = "On Bilbao’s jetty the cooper’s son tapped all thirty of the salvage ship’s water casks, counting each one aloud, and then put down his mallet."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_landing]
title = "Barrels on the Left, Herbs on the Right"
text = "On Cooper Street there is a shop with an iron hoop nailed to the left of the doorframe and a little bundle of dried herbs hanging on the right. Barrels on the left, medicine on the right. Seafarers come in to order water casks and find a packet of herbs pressed into their hands as they pay; people who come about chilblains drop a cracked meal tub on the left as they walk in and leave carrying the tub and the cure together. “From now on I only count water on land,” Martin said as he put up the shutters. “Three times, four times, however many I like.” Elene was clipping a prescription sheet to the wall with a wooden peg. “Good. I can keep up with the wounds on land.” Next morning Martin stood in the doorway with his mallet for a long while before he said, “No ice last night.” Elene went on spooning herbs into a pot and didn’t look up. “I was right beside you, and I shut the window tight. Of course there wasn’t. I’ll do it again tonight.”"
news = "On Bilbao’s Cooper Street there’s a shop that hoops barrels on the left and sells medicine on the right. Seafarers who buy a cask get a packet of herbs thrown in, and folk with chilblains leave their cracked tubs to be mended."

