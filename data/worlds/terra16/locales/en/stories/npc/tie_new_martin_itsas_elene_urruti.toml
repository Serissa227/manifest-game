[tracks.tie_new_martin_itsas_elene_urruti]
name = "Cooperage and Apothecary"

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_meeting]
title = "Water Casks"
text = "Forty-odd water casks stood in a row on the jetty, soaked overnight, waiting to be loaded for the sailing. Martin worked down the line on his haunches, tapping each cask with his mallet, ear pressed to the staves, counting under his breath. A loose iron hoop sprang free without warning and laid open the back of his hand; blood dripped onto the cask. He shook the hand out and kept tapping. Elene came by with a basket of dried herbs for a ship’s medicine chest. Three years in the same classroom, and all she remembered of him was that he drummed on the desk edge during lessons. She dropped the basket and caught his hand. “You’re bleeding on the staves and still counting?” Martin kept his eyes on the cask, not the hand. “I haven’t finished counting. Count the water casks three times.” Elene snorted. “Then count your blood too.” She pulled the stopper from her water flask and flushed the cut. He counted each rinse aloud, and at the third she wrapped a cloth around it and tied a hard knot. Then he went back and counted all forty casks three times over, and the tally came out right every time."
news = "On the jetty at Bilbao a cooper’s son cut his hand on a loose hoop and crouched there, refusing to stop until the water casks were counted. The herb-woman’s apprentice from the tavern back room marched over and washed the wound three times in front of the whole quay."

[tracks.tie_new_martin_itsas_elene_urruti.chapters.tie_new_martin_itsas_elene_urruti_closer]
title = "Packing the Medicine"
text = "The night before he sailed for Newfoundland in the spring, Martin stood at the table in the tavern’s back room holding a little medicine cask he had hooped himself, watching Elene pack herbs. She wrapped them one by one and wrote on each paper cover: “Frostbite.” “Bleeding gums.” “Fever.” The charcoal moved quick and steady, one packet written, one packet packed into the cask. “I keep dreaming about ice,” Martin said, and his knuckle rapped the hoop once, twice. “I can’t make it out, but I know it’s there.” The charcoal stopped. Elene didn’t laugh. She turned, snatched another handful of leaves and made up one more packet. This one had no illness written on it, only a crescent moon, and she pushed it down to the bottom of the cask. “If you dream of it, drink this.” She pressed the lid shut. “And count the ship’s water three times yourself.”"
news = "On a whaler leaving Bilbao this spring, a cooper’s son is carrying a little medicine cask, and every packet in it was labeled by the herb-woman’s apprentice from the tavern back room."

