# C7 story rewrite, English overlay: Lin Hui x Pedro de Ocampo, "Say Her Name First".
# Keyed by track, chapter and choice; display text only. Memory titles follow the index of the memory effect in effects.

[tracks.pair_lin_hui_pedro_ocampo]
name = "Say Her Name First"

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_meeting]
title = "Squeezed to the Margin"
text = "The Zhangzhou ship has been in port three days when the Lin family’s line finally comes up in the clerks’ room. Pedro de Ocampo copies each entry into Spanish, and Lin Hui’s name gets jammed into the margin, half a line of it. She walks in without a word, turns the whole sheet halfway round, and fills the middle with her own hand: name, count, eighty bolts of satin, four cases of porcelain. “Different script, but a debt isn’t owed twice.” The man waiting on the cargo grumbles about wasted time, and she doesn’t look up. “If the name is wrong, who exactly is supposed to collect?” Pedro touches his pen. “My register only holds people I’ve met and asked. You were standing right here and I put you in the margin. That was my fault.” He takes a fresh sheet, puts her name on the first line, and asks, “How is my name written in your characters?” She writes it out for him. He copies it, and his first stroke wobbles badly."
news = "A Spanish clerk in Manila had his cargo list corrected to his face by a Chinese merchant’s daughter. They say he wrote out a fresh one the next day, with her name on the first line."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_closer]
title = "Walk It Yourself"
text = "The registers inside the walls and the houses outside them never agree on names. Lin Hui catches Pedro at the clerks’ room door. “Clerk, sir, go and walk it yourself.” And he does: three days, knocking house by house, writing down only the people he has met and spoken to. His feet blister, and he learns how many people one line reading “foreign traders” has been leaving out. On the third evening it pours. He hurries back with the register hugged to his chest, and Lin Hui runs after him and throws him the oilcloth she wraps cargo in. “Don’t let the names you just got straight wash away again.” The next day the oilcloth comes back folded square, with a line of small writing in one corner: Lin Hui, Zhangzhou. She asks, “When did you find that out?” “The first day. You told the old woman at the door you were from Zhangzhou.” Pedro touches his pen again. “I wrote it down.”"
news = "A Spanish clerk walked the Chinese quarter outside Manila’s walls for three days, door to door, and they say the soles of his feet are raw. All to get the names right."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_turning]
title = "Limahong’s Fleet"
text = "They say a fleet of Chinese ships has come out of the sea, under a captain called Limahong, and twice it has hit Manila and burned half the town. The fighting isn’t even over and people in the city are already looking at the Chinese differently. Soldiers have ringed the quarter outside the walls, and the word is they mean to take the register and call people in for questioning, one by one. The light in the clerks’ room burns all night. Someone passing under the window saw Señor Ocampo sitting over the register, picking up his pen and putting it down again."
news = "Limahong’s ships have hit Manila and burned half the town. Soldiers ring the Chinese quarter outside the walls, and they say people will be called in one by one, off the register."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_choice]
title = "The List at the Gate"
text = "The fighting is over, and eleven boatmen from outside the walls still haven’t come home. Lin Hui has made them a list, some of them down only by their childhood names: Ah-Man, Big Fish, Old Seven. Pedro picks up his pen. “The soldiers read the register’s characters. They can’t say childhood names. Let me give them names that are easier to enter—” Lin Hui slaps a hand down on the paper. “Change them and his mother won’t know him. Find the people who know him first.” Pedro wants to carry the list through the gate. Lin Hui wants to go too. They stop me under the lean-to outside the checkpoint. “Captain,” Lin Hui says, holding the paper up to me, “we need you for half a day.”"
news = "After Limahong pulled out, a Spanish clerk in Manila went to the gate with a Chinese merchant’s daughter and a list of names. They say most of the missing came home."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_choice.default]
news = "In the days after Limahong left, a clerk and a Chinese merchant’s daughter turned up at Manila’s gate every morning with a list. The guards waved them off at first, then got used to them and let them through."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_choice.choices.vouch]
text = "Take my ship’s papers to the gate and vouch for the list"
reply = "The officer at the gate turns my ship’s papers over twice, studies the seal on the guarantee, and waves the guards aside. Of the eleven names, nine are found that same day. Beside the other two, Lin Hui draws a circle, and doesn’t cross them out. Pedro stares at the circles with his pen pressed to the paper and doesn’t write. “We go again tomorrow,” Lin Hui says."
news = "A ship’s captain put up papers at Manila’s gate to vouch for a list of Chinese names, and they say nine boatmen were found that very day."
effects = [{ }, { }, { }, { title = "Two Names in Circles" }]

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_choice.choices.walk]
text = "Go house to house with them, looking for people who know these boatmen"
reply = "We walk two full days. Each time we find someone who knows a man, Pedro asks again, and only when it checks does he write the real name beside the childhood name: Ah-Man, Chen Mansheng. Big Fish, Huang Youyu. The last one we find is Old Seven himself, an old boatman huddled in a net-drying shed. Pedro crouches and asks what he is called. The old man cries as he gives his name, and then gives it again, in case the clerk missed it."
news = "A ship’s captain walked two days outside Manila’s walls with a clerk and a merchant’s daughter, asking at every door. They say even an old boatman was found, crying as he told them his name."
effects = [{ }, { }, { }, { title = "Real Names Beside Childhood Names" }]

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_choice.choices.watch]
text = "Wait by the city wall until they come back"
reply = "I sit half the day on a stone block at the foot of the wall. At dusk the two of them come back, Pedro’s shoe split again, Lin Hui’s list covered in fresh writing. They walk the whole way without a word and stop at the city gate. Lin Hui folds the list and presses it into his hand. “The gate, tomorrow morning.”"

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_together]
title = "A Table for Two Ledgers"
text = "A bigger table now stands at Lin Hui’s door, with the Chinese ledger open on the left, the Spanish one on the right, and a bowl of tea in the middle. Pedro comes as soon as he is off duty, sits on the right, and reads her the names he has settled that day, one by one, while she checks them on the left. By the last name it is dark. He reaches for his pen, but it is already lying across the register. “That’s all I got straight today. Tomorrow… may I come again?” “When have you ever not?” She pushes the tea bowl aside, leans across the two ledgers, and kisses him. An abacus bead clicks on the corner of the table."
news = "Outside Manila’s walls there’s a big table with Chinese accounts on one side and Spanish accounts on the other, and they say the clerk comes every evening after his shift to go over the names."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_together.variants.helped]
text = "A bigger table now stands at Lin Hui’s door, with the Chinese ledger open on the left, the Spanish one on the right, and under the tea bowl in the middle, the list, with two names still ringed. Pedro comes as soon as he is off duty, sits on the right, and reads her the names he has settled that day, one by one, while she checks them on the left. At the two circled lines he stops and says nothing, only looks at her. By the last name it is dark. He reaches for his pen, but it is already lying across the register. “That’s all I got straight today. Tomorrow… may I come again?” “When have you ever not?” She pushes the tea bowl aside, leans across the two ledgers, and kisses him. An abacus bead clicks on the corner of the table."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_together.variants.matched]
text = "A bigger table now stands at Lin Hui’s door, with the Chinese ledger open on the left, the Spanish one on the right, and a bowl of tea in the middle. Pedro comes as soon as he is off duty, sits on the right, and reads her the names he has settled that day while she checks them on the left. When they are done she slides out the sheet from under the tea bowl: every childhood name now has a real name beside it, and the last line is still water-stained. It is dark by then. He reaches for his pen, but it is already lying across the register. “That’s all I got straight today. Tomorrow… may I come again?” “When have you ever not?” She pushes the tea bowl aside, leans across the two ledgers, and kisses him. An abacus bead clicks on the corner of the table."

[tracks.pair_lin_hui_pedro_ocampo.chapters.pair_lin_hui_pedro_ocampo_epilogue]
title = "The Parián"
text = "They say every Chinese household in Manila has been moved into the newly marked Parián outside the walls, house against house, with soldiers at the gate and a tag to show every time you pass. The Lins’ table, the one with two kinds of ledger, went too, and now stands at the Parián’s gate. It was too long to get through the new doorway, so they sawed a piece off the end, and the Chinese ledger sits on a brick on the left so it lies as flat as ever. Every evening a Spanish clerk comes as before. The tag in his hand is worn smooth at the edges, and when the soldiers see him they push the gate open. He sits on the right and opens his register."
news = "Manila’s Chinese have all moved into the Parián, and they say the table with two kinds of ledger went along too. The Spanish clerk still turns up every evening to go over the names."
