[tracks.pair_xu_cai_xiao_man_side]
name = "Reading Lessons in the Fort"

[tracks.pair_xu_cai_xiao_man_side.chapters.pair_xu_cai_xiao_man_side_landing]
title = "School Behind Earthen Walls"
text = "In those years, people say, the pirate alarms never stopped, and the families along the river at Yuegang raised earthen forts and kept watch by turns at night. The watchmen had time on their hands, so Xu Cai propped a door on two trestles in front of the granary and started a reading class. The first lesson taught one thing only: how to write your own name. Her first pupil was Xiao Man, who didn’t just come herself but poled her sampan up and down the river hauling in one family after another. “The schoolmaster’s girl doesn’t charge a copper. You’d turn down something for free?” The boatmen she brought squatted in rows; one held the brush like a fish spear, another got ink in his beard. Xu Cai called the roll. When she reached Xiao Man, Xiao Man strode up and wrote the character Man on the door: the strokes still thick, but each one a proper stroke, sitting square inside its box. “You’ve got that one,” Xu Cai said. “Today you teach them.” Xiao Man pushed the brush into an old boatman’s hand and guided it down. “What’s your name?” “Chen Shuisheng.” “Three characters. Learn one tonight and I’ll grill you a fish in the morning.” At the other end of the door, Xu Cai laughed out loud, cut another sheet of paper and passed it over."
news = "There’s a reading class going in the earthen fort at Yuegang. The schoolmaster’s daughter teaches it, and the charm girl from the Tianfei temple is the one dragging people in."
