# C7 重写（2026-10-12，Claude Opus）：stories/npc/pair_xu_cai_xiao_man.toml 的英文显示覆盖；按轨道、章节、选项、变体的 key 对应，不复制玩法。
# 回忆标题按选项 effects 的下标对应（choice 的 permit、charm 的第 4 个效果是 memory）。
# 字的译法：“蛮”写作 the character Man，“采”写作 the character Cai，船名“安澜”写作 Anlan（Calm Waters）。

[tracks.pair_xu_cai_xiao_man]
name = "The First Character at the Bow"

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_meeting]
title = "Two Wrong Strokes"
text = "On the steps of the Tianfei temple sat an old wooden box of safe-passage charms, red ink on yellow paper, stacked neat as tiles, every one reading “Heavenly Consort protect us, calm waters on all four seas.” Xu Cai had come for one on behalf of her father, who was about to take ship, and had brought me along. She picked one up and studied it a long while. “There’s an extra stroke in ‘protect,’ and the ‘waters’ is missing a dot.” The fisher girl selling them snatched it back and stuck out her chin. “Hang the charm, then take the tiller yourself. One stroke more or less, Mazu can read it.” “Mazu can. The people buying them can’t. At least let me fix the writing.” “Fix it? Learn to pole a boat first.” From there they haggled until the sun dropped: how many coppers a corrected charm was worth, how many charms a boat lesson cost, who paid if the boat tipped over. The fisher girl glanced at me, standing off to one side, then at Xu Cai, and grinned. She pulled out a charm and tucked it into the front of my jacket. “For safe passage.” Xu Cai counted six coppers into the box and took the one with the extra stroke. “Tomorrow, first thing, at the river mouth.” “Ask for Xiao Man. Anyone outside the temple knows me.”"
news = "That fisher girl who sells charms outside the Tianfei temple in Yuegang had two wrong strokes pointed out by the schoolmaster’s daughter, and the pair of them haggled at the temple gate all afternoon."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_closer]
title = "The First Character"
text = "The tide was out at the river mouth, and Xiao Man’s sampan lay tilted on the mudflat. “Pole at a slant. Let the water do the work.” Xu Cai did as she was told. The pole went in and wouldn’t come out, and she ended up hanging off it while the sampan slid away under her feet. Xiao Man laughed so hard she stepped on nothing and went into the river, and came up still laughing. “Schoolmaster’s girl, that pole’s more stubborn than you are.” Then it was Xu Cai’s turn to teach. She spread paper on the boards and started with ledger words, “silver,” “rice.” Xiao Man pushed it back. “Teach me to write me first.” Xu Cai wrote the character Man for her to trace. Xiao Man held the brush like a pole; every stroke came out a blot, the strokes piled on top of each other, and the one character filled half the sheet. Red in the face, she reached to crumple it. Xu Cai held it flat and drew another sheet from her sleeve—she always carried one extra. “Bigger still fits. Learn to write your own name, and you’ve already stopped half the cheats.” Xiao Man didn’t crumple it. She folded it in half, then in half again, and slid it under the bottom of her charm box. “Coming back tomorrow?” Xu Cai asked. “I am. One character a day. You skip one, I skip a lesson with the pole.”"
news = "Down at the Jiulong River mouth, someone saw the schoolmaster’s daughter learning to pole a boat. Her pole stuck fast in the mud, and the charm girl laughed so hard she fell in the river."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_together]
title = "The Second Character"
text = "In those years, people say, the pirate alarms came one after another, and the families along the river at Yuegang built earthen forts and took turns keeping watch through the night. That night there was fog on the river. Xiao Man poled rice into the fort, one trip, two, three, until the sacks had rubbed a red welt into her shoulder. Xu Cai sat inside the gate by an oil lamp calling the roll; for anyone who couldn’t write their name, she wrote it for them and had them press a thumbprint. At the end, the register was missing one line. Xiao Man dropped the last sack in the gateway and leaned over, out of breath. “Who’s left?” Xu Cai handed her the brush. Xiao Man blinked, then wrote the character Man on that line. Still crooked, but it fit in one square. She didn’t give the brush back. She took Xu Cai’s hand. “Teach me another one.” “Which one?” “You know which.” Xu Cai guided her hand, stroke by stroke, and wrote the character Cai beside it. The two of them stepped out of the gateway and stopped at the foot of the wall; the night watch’s clapper sounded far off at the other end of the fort. Xiao Man leaned in and kissed her, quick. Xu Cai didn’t let her pull away. She put her arms around her and held on."
news = "The night of the watch at the Yuegang fort, the charm girl poled three boatloads of rice inside, and the schoolmaster’s daughter sat at the gate calling the roll till dawn."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_together.variants.known]
text = "In those years, people say, the pirate alarms came one after another, and the families along the river at Yuegang built earthen forts and took turns keeping watch. That night there was fog on the river. Xiao Man poled rice into the fort, one trip, two, three, until the sacks had rubbed a red welt into her shoulder. Xu Cai sat inside the gate by an oil lamp calling the roll. At the end, the register was missing one line. Xiao Man dropped the last sack and leaned over. “Who’s left?” Xu Cai handed her the brush. Xiao Man wrote the character Man on that line, still crooked, but it fit in one square. She didn’t give the brush back. She took Xu Cai’s hand. “Teach me another one.” Xu Cai guided her hand and wrote the character Cai beside it. The two of them stepped out of the gateway and stopped at the foot of the wall. Out of nowhere Xu Cai asked, “That business with Wandeng—you knew all along, didn’t you?” Xiao Man tipped her head. “I read the wind better than I read people.” Then she leaned in and kissed her, quick. Xu Cai didn’t let her pull away. She put her arms around her and held on."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_turning]
title = "The Sea Opens"
text = "Last winter Yuegang was made the seat of Haicheng County, and this spring the county posted a notice on the wharf: from now on, merchant junks could take out a sea pass and sail abroad in the open. A crowd packed in under it, the ones who could read reading aloud, the ones who couldn’t listening. At the tea stall they say the notice hadn’t been up three days before the charm seller outside the Tianfei temple emptied out every coin she’d saved and bought into an oceangoing junk—thirty shares in the ship, and two of them hers. “A charm seller? Can she even read a share contract?” “No. The schoolmaster’s daughter wrote it.” The old woman who sells fish balls picked up the story: she was right there by the ship that day, and the schoolmaster’s daughter read the draft out to the boatmen: who put in how much, how the profit was split, what happened if the ship went down, and not one roundabout sentence in it. A few old boatmen who couldn’t write their own names heard it through and pressed their thumbprints on the spot. “Sixty years I’ve lived,” the old woman said, “and that’s the first contract I ever understood. And at the bottom the charm seller signed it herself, her own name, Man, one great big character.”"
news = "First year the sea’s open at Yuegang, and the charm girl from the Tianfei temple has bought into an oceangoing junk. They say the schoolmaster’s daughter wrote the contract, and even the boatmen could follow it."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_choice]
title = "A Sea Pass and a Charm"
text = "The junk Xiao Man had bought into was making its first voyage abroad that winter, bound for Luzon as soon as the northeast wind set in. The hold was booked, the water casks mended, and the sea pass was still stuck at the county office: only so many were issued a year, and whoever was at the back of the line waited for next year. Xiao Man stood on the wharf knocking her pole against a bollard, counting days. “Another month and the wind turns. Miss this season and the ship sits idle a year, and thirty shares’ worth of money soaks in the harbor.” Xu Cai stood by the bollard holding a roll of cargo lists—she had made two copies, one for the ship and one for herself. “I’ll go to the temple and ask for a charm.” Xiao Man stopped and glared. “Hang the charm—” “—and take the tiller yourself. I know.” Xu Cai finished it for her and pushed the cargo lists into her arms. “I’ll get the charm. Someone still has to run down the pass.” Xiao Man looked down at the lists; she couldn’t read half the words, but she held them tight. When the two of them came to find me, Xiao Man had the pole in one hand and the lists in the other, and Xu Cai still had ink on her cuff."
news = "That charm seller turned shipowner in Yuegang got her sea pass this time, and the schoolmaster’s daughter knelt a full two hours at the Tianfei temple asking for a charm."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_choice.default]
news = "That junk at Yuegang with the charm girl’s shares in it got its sea pass just before the year was out, and the schoolmaster’s daughter went to the Tianfei temple on her own for a charm to hang on the tiller."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_choice.choices.permit]
text = "Go to the county office and get the sea pass for Xiao Man’s ship."
reply = "I stood in line outside the county office for three days, squatting under the screen wall and sharing a steamer of rice cakes with a crowd of boatmen; on the fourth I had a broker I knew put in a word. The pass came through at the end of the eleventh month, stamped with the red seal of Haicheng County. Xiao Man turned the paper over and over, and finally handed it to Xu Cai. “Read it to me. Don’t skip a single word.” Xu Cai read it from top to bottom, even the characters inside the seal. When she finished, Xiao Man held out her hand again. “One more time.”"
effects = [{ }, { }, { }, { title = "The First Sea Pass" }]

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_choice.choices.charm]
text = "Go with Xu Cai to the Tianfei temple for the voyage charm."
reply = "Xu Cai knelt before Mazu longer than anyone; the temple keeper came by twice to add incense, and she still hadn’t risen. Once she had the charm, she read the front first, character by character—the “waters” had every one of its dots—before she nodded. She didn’t hand it to the keeper to be blessed. She turned her back, borrowed the brush on the offering table and wrote one line on the back, very small, then folded it twice and slipped it into her sleeve. Outside the gate she stopped. “Don’t tell her there’s anything on the back.”"
effects = [{ }, { }, { }, { title = "The Charm with Writing on the Back" }]

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_choice.choices.watch]
text = "Stay out of it and watch them ready the ship from the wharf."
reply = "I stood on the wharf all afternoon. Xiao Man was at the bow sounding the depth, paying a knotted line down hand over hand and counting under her breath. Xu Cai was on shore reading the cargo lists to the crew word by word; she misread a price and the sailors laughed, and she didn’t mind, just went back and read it again. A gust of north wind came in off the river mouth and flipped a page in Xu Cai’s hands, and up at the bow Xiao Man raised a hand to test the wind. There was a gangplank between them and neither one looked around, but both of them paused at the same moment."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_epilogue]
title = "Words on the Bow"
text = "As soon as the southwest wind set in, Xiao Man’s ship came home, riding low, its hold full of Luzon silver and bundles of sappanwood, brokers crowding the rail with offers. After this run the old owner had sold her the ship; she was its captain now. She jumped ashore and, before any cargo changed hands, pulled Xu Cai out of the schoolroom and down to the bow. “Give her a name. You write it.” Xu Cai ground a bowl of ink and wrote two big characters on a freshly planed board, Anlan, Calm Waters, and this time the “waters” had all three dots. A deckhand was about to nail it up when Xiao Man flipped the board over, back side up. “Here. One more.” “What should I write?” “You know.” Xu Cai loaded the brush and wrote the character Man, big enough to fill half the board. The idlers on the wharf laughed. “Captain, Calm Waters out front and your own name hiding on the back? What kind of ship’s name is that?” Xiao Man watched the board go up on the bow, Anlan facing out, and gave it a pat. “The one on the back is the real one.”"
news = "A junk came back into Yuegang with a woman for captain. The schoolmaster’s daughter wrote Anlan on the bow, and they say the back of the board has her own name on it, one great big character."

[tracks.pair_xu_cai_xiao_man.chapters.pair_xu_cai_xiao_man_epilogue.variants.helped]
text = "As soon as the southwest wind set in, Xiao Man’s ship came home, its hold full of Luzon silver and bundles of sappanwood. Nailed to the cabin wall was last year’s sea pass, its red seal blurred by damp, and beside it Xu Cai’s copy, neater than the government’s. After this run the old owner had sold her the ship; she was its captain now. She jumped ashore and the first thing she did was pull Xu Cai down to the bow. “Give her a name. You write it.” Xu Cai wrote Anlan, Calm Waters, on a freshly planed board, and this time the “waters” had all three dots. A deckhand was about to nail it up when Xiao Man flipped the board over. “Here. One more.” “What should I write?” “You know.” Xu Cai wrote the character Man, big enough to fill half the board. The wharf laughed. “Calm Waters out front and the captain’s name hiding on the back? What kind of ship’s name is that?” Xiao Man watched the board go up on the bow, Anlan facing out, and gave it a pat. “The one on the back is the real one.”"

