[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_together.variants.helped]
text = "On the fifteenth of February Huang Dun’s ship came into port on time, riding low with a hold full of pepper. Suma was waiting on the jetty with a lacquer box in her arms, the red carp on the lid washed down to a faint shadow. Huang Dun knew it at once. “That’s the one I brought the first year—” She lifted the lid. It was divided into small compartments, each holding a swatch of dyed cloth: indigo, sappanwood red, turmeric yellow. He couldn’t speak, and when he did he managed only, “My family can’t say a word this time. The hold is full and the books balance.” Suma rose on her toes and kissed him, then turned and said “Unload,” and the crew didn’t dare hoot. She turned the lid over. Pasted inside was a small slip of paper: the fifteenth of February, next year. “Coming back?” “Yes.”"

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_together.variants.matched]
text = "On the fifteenth of February Huang Dun’s ship came into port on time, and in his coat was the old master’s sailing schedule for the whole year. Suma was waiting on the jetty with a lacquer box in her arms, the red carp on the lid washed down to a faint shadow. Huang Dun knew it at once. “That’s the one I brought the first year—” She lifted the lid. It was divided into small compartments, each holding a swatch of dyed cloth: indigo, sappanwood red, turmeric yellow. He couldn’t speak. He pushed the schedule into her hand. “My father says nobody is to haggle down a price that girl sets.” Suma rose on her toes and kissed him, then turned and said “Unload.” She turned the lid over. Pasted inside was a small slip of paper: the fifteenth of February, next year. “Coming back?” “Yes.”"

[tracks.pair_huang_dun_suma_side]
name = "Old Hands Who Keep Honest Books"

[tracks.pair_huang_dun_suma_side.chapters.pair_huang_dun_suma_side_landing]
title = "Three Days Late"
text = "On the fifteenth of February Huang Dun’s ship was three days late again. Suma wrote “three days late” in her ledger and, as usual, put him to taking in the cloth first. The yard was hung with cloth until evening. Across the poles the two of them settled this year’s price; he shaved off five percent, she shaved off five percent, and the books came out even. With the accounts closed Suma went off across the street with two bowls in her hands and called back, “Cake is on me. I’m paying this time.” Huang Dun laughed until his belly shook. “You’ve kept count of my late days for four years, not one missed.” “I keep the interest too.”"
news = "The batik merchant of Gresik and the fat captain from Yuegang have been trading four years now. They say her ledger is full of the days he was late, but the cake across the street was her treat."
