[tracks.pair_huang_dun_suma]
name = "Which Month Next Year?"

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_meeting]
title = "Write the Price First"
text = "Huang Dun’s ship put in at Gresik for the first time, and he strolled into the batik workshop grinning. Suma ignored the grin and pushed a sheet across the counter. “Laugh all you like; the price stays. Write down what each dyer is paid. One name to a line.” He wrote fast and added the third line wrong, and she tapped the mistake with a fingernail. Once it was fixed he leaned in and whispered, “That cake stall across the street. Could it go on the freight bill?” “You eat it, you pay for it,” she said without looking up. Huang Dun patted his belly. “Even if the sky falls, we eat first.” The next day he turned up with a lacquer box painted with a red carp, Yuegang mung-bean cakes for the dyers to share. On the corner of the counter sat an upturned bowl, and under it a slice from the stall across the street. “Put it on your account,” said Suma."
news = "The fat captain from Yuegang came to Gresik for the first time and was made to sit down and write out the dyers’ wages for the batik mistress. The next day he brought a box of mung-bean cakes and shared them with every dyer in the workshop."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_closer]
title = "A Ship Late"
text = "Huang Dun was a ship late. He stopped at the workshop door with a whole belly of apologies, but Suma spoke first. “Good, the cloth is dry. Take it down.” The yard was hung with batik from pole to pole, and he spent the afternoon gathering it in. One piece he took down inside out, and she rapped the back of his hand. Rubbing it, he asked whether she could hurry the dyeing, a few more bolts to take with him. “You can’t hurry a dyer’s hands,” said Suma, shaking out a length. “Rushed cloth comes out the wrong color. I’d sooner sell less.” Huang Dun folded the piece again, very slowly. “Then I’ll come earlier next year.” She said nothing. She opened her ledger and made a note in the margin, tilted so he couldn’t see."
news = "The fat captain from Yuegang came a ship late this year. The batik merchant in Gresik didn’t scold him; she had him carry in her cloth in the yard all afternoon."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_turning]
title = "Silver from Luzon"
text = "The Spanish have built a town at Manila on Luzon and are paying chests of silver for silk. Yuegang’s ships are all heading that way this year, and half as many come to Java. “A ship’s worth of silk fetches more silver in Manila than three runs to Java,” say the men on the quay, working it out. They say the fat captain who always calls at Gresik is being pushed by his family to change course. A few days ago his ship tied up, but he didn’t go to the workshop. He squatted on the jetty and ate a slice of cake, and went on eating it all afternoon. When someone asked if he was going to Luzon, he chewed, and said neither yes nor no."
news = "Manila has a Spanish town now, and Yuegang’s ships are all going to Luzon for silver. The fat captain who calls at Gresik is being told to follow them, and spent an afternoon squatting on the jetty."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_choice]
title = "Which Month Next Year?"
text = "At year’s end the workshop was quiet except for the abacus. Suma wrote the last entry and laid down her pen. “Which month do you get in next year?” Huang Dun rubbed his hands. “Well… my family’s ships don’t move on my word alone—” “Then we go by my date.” She cut him off, turned to a fresh page for the new year, and put a fingertip on February. Then she looked at me. “You get around the harbors. Any ideas?”"
news = "The batik merchant of Gresik asked the fat captain from Yuegang to his face which month he’d come in next year. Before he could answer, she wrote the date in her ledger."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_choice.default]
news = "On the last page of the year the batik merchant of Gresik wrote down the fifteenth of February. The fat captain from Yuegang said “I’ll come” and pulled his hat back on."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_choice.choices.cargo]
text = "Find Huang Dun’s ship a cargo to carry home from Gresik"
reply = "I spent two days making the rounds of the trading houses and found him a full hold of pepper and sappanwood for the voyage back to Yuegang. Huang Dun worked out the figures three times and got three answers. Suma took the abacus and did it once: only a little less than he would make going to Luzon. He went home with the ledger under his arm to fight it out with his family, and she called after him from the door, “Win the argument, then come.”"
news = "Someone at the trading houses in Gresik found the fat captain from Yuegang a cargo of pepper and sappanwood to carry home. The batik merchant checked the sums and said it was only a little short of what Luzon would pay."
effects = [{}, {}, {}, { title = "Pepper for the Voyage Home" }]

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_choice.choices.family_letter]
text = "Carry a letter from Suma to Huang Dun’s family in Yuegang"
reply = "The letter was written on the back of an account sheet: what day the ship would arrive, how much cargo, how many dyers and what each was paid, item after item, and at the bottom her name, without one soft word. I took it to the Huang house in Yuegang. The old master read it through, slapped it down on the table, and asked his son, “Who has been keeping your accounts in Gresik all this time?” “She has.” The old man grunted and told the clerk to schedule the February sailing."
news = "A letter from the batik merchant of Gresik reached the Huang house in Yuegang, nothing in it but dates, cargo and wages. They say the old master read it and told his clerk to book the February sailing on the spot."
effects = [{}, {}, {}, { title = "The Letter That Read Like a Contract" }]

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_choice.choices.watch]
text = "Stay out of it and see how Huang Dun answers"
reply = "Huang Dun twisted his hat in his hands and said one word: “Yes.” Suma’s pen was already moving; a new line went onto the page: the fifteenth of February. He said the wind might not cooperate that day. “That’s the wind’s business.” She blew the ink dry, closed the ledger, and pushed it toward him so he could look."

[tracks.pair_huang_dun_suma.chapters.pair_huang_dun_suma_together]
title = "The Day She Set"
text = "On the fifteenth of February Huang Dun’s ship came into port on time. Suma was waiting on the jetty with a lacquer box in her arms, the red carp on the lid washed down to a faint shadow. Huang Dun knew it at once. “That’s the one I brought the first year—” She lifted the lid. It was divided into small compartments, each holding a swatch of dyed cloth: indigo, sappanwood red, turmeric yellow, the colors of all these years. He couldn’t speak, and turned his hat round and round in his hands. Suma rose on her toes and kissed him. The crew hooted, but she turned and said “Unload,” and no one made another sound. She turned the lid over. Pasted inside was a small slip of paper: the fifteenth of February, next year. “Coming back?” “Yes.”"
news = "The fat captain from Yuegang sailed into Gresik on the fifteenth of February this year, right on time. The people on the quay say it’s the first time they’ve seen him do it."

