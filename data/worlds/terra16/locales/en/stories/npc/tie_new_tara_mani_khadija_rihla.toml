[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_landing.variants.family]
text = "The first page of Khadija’s travel book held a single line: “For my father, who minds the warehouse for me.” By the thirtieth page, every road carried at its foot the name of whoever told it: a Jeddah boatman, a Cairo camel driver, an old bead grinder of Khambhat. Under the few stretches she had walked herself, she wrote only “I.” She worked in Tara’s workshop, her table hard up against the grinding wheel, a film of stone dust on her ink. One evening after work, Tara took a carnelian from her purse. It had cracked under the drill, and she had carried it for years. She slipped it into the first page. “A bookmark. This one goes on nobody’s bill.” Khadija looked at the crack for a long while and, for once, didn’t ask where it came from. She pulled the map she had brought from Fez out of the bottom of her chest, unrolled it, and in the square for Khambhat she inked: Tara Mani. “The teller?” Tara asked. “The one who lives here.” Khadija blew the ink dry. “Somebody lives in this square now.” That night, before the lamp went out, she kissed Tara."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_landing.variants.helped]
text = "Khadija’s pass was pinned to the workshop wall, its occupation box reading: Recorder of Roads. The map of Khambhat she had drawn for the new official was long since handed in, not a lane left out; yet on her own map, Khambhat still showed only a few quays copied off beads. Her travel book had reached its thirtieth page, and at the foot of every page was the name of whoever told her that road: a Jeddah boatman, a Cairo camel driver, an old bead grinder of Khambhat. She worked in Tara’s workshop, her table hard up against the grinding wheel, a film of stone dust on her ink. One evening after work, Tara took a carnelian from her purse. It had cracked under the drill, and she had carried it for years. She slipped it between the pages. “A bookmark. This one goes on nobody’s bill.” Khadija looked at the crack for a long while and, for once, didn’t ask where it came from. She unrolled her own map and, in the square for Khambhat, inked: Tara Mani. “The teller?” Tara asked. “The one who lives here.” Khadija blew the ink dry. “Somebody lives in this square now.” That night, before the lamp went out, she kissed Tara."

[tracks.tie_new_tara_mani_khadija_rihla_side]
name = "Beads Between the Pages (Side by Side)"

[tracks.tie_new_tara_mani_khadija_rihla_side.chapters.side]
title = "A Bead for Every Chapter"
text = "Khadija settled in Khambhat and wrote her travel book in the back room of the bead maker’s workshop, every page naming who had told her the road. Each time she finished a chapter, Tara chose a bead from her sample cord and laid it in that chapter: “Fez Blue” for the chapter on Fez, a gray-green “Hormuz” for the one on Jeddah. When it came to the Khambhat quays, Tara hunted for a long time and came up with one that had no name yet. “What’s it called?” Khadija asked. “Finish the chapter, then name it. I’ve paid for the grinding; the name’s yours.” Khadija unrolled her map, wrote Tara’s name in the square for Khambhat, and added one word beside it: teller. “Half this book is yours. I wrote down the roads; you gave the colors.” Tara picked out another bead and weighed it in her palm. “Then both names go on the cover. Write mine small—it saves ink.”"
news = "A woman from Fez is writing a travel book in the back room of a Khambhat bead maker’s house. Each time she finishes a chapter, the bead maker’s daughter tucks a bead between its pages."

