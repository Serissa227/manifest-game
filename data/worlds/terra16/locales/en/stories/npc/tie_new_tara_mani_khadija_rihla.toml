[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_meeting]
title = "Where Is This Color From?"
text = "Pilgrimage season in Jeddah: one street ran from the quay to the market, and the crowd inched along it shoulder to shoulder. The caravan from Fez had spread a carpet of yellow leather slippers by the roadside. Khadija sat on a sack doing the accounts, and when she looked up she saw the woman at the next stall holding up a cord of thirty-odd beads, no two alike. Khadija pointed at a gray-green one. “Where is this color from?” “Hormuz.” Tara thumbed along to an orange-red one. “This one’s Malindi. All ground in Khambhat, and I know who ground each one and how many days it took. Colors have names. Wages should too.” “Who named them?” “I did.” “And who is ‘I’?” “Tara Mani.” Khadija drew a half-finished map from her sleeve and added the ports one bead at a time, writing a small line beside each: so says Tara of Khambhat. When she was done, she turned it around. “Blank on the map doesn’t mean nobody lives there. And your cord has more ports on it than my map.” Before the market broke up, they traded addresses: one written on the tag of the bead cord, one on the back of the map."
news = "In the Jeddah market this pilgrimage season, a slipper seller from a Fez caravan went down the Khambhat sample beads at the next stall and drew each one’s port into her map."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_closer]
title = "Fez Blue"
text = "The Khambhat bead market has a few new colors this year, and the stallholders trip over the names: “Fez Blue,” “Tangier White,” “Sand of Sijilmasa.” Down the grinders’ lane they say the names come from Fez, in letters that ride the monsoon and turn up only a few times a year. Whenever one comes, the bead maker’s daughter stands in the workshop doorway and reads it aloud. The last one said: “The bowls in Fez are exactly this blue. My mother told me that—she serves soup in that bowl every day.” Then, the same day, she goes up to the kiln, picks out stones and fires a new batch. When the old grinder asks whose loss it is if the batch spoils, she says: “Mine. If it comes out right, every bead’s grinding wage goes in the book.” The beads she sends back to Fez are all named for the quays of Khambhat, one name to a bead, each with a paper tag tied on."
news = "The Khambhat bead market has new colors called “Fez Blue” and “Tangier White.” The grinders’ lane says the names come from Fez, one letter at a time."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_turning]
title = "The Emperor Comes to See the Sea"
text = "Akbar’s army marched into Gujarat and the sultan surrendered. On the quay they say the emperor came on to Khambhat afterward just to look at the sea—he had never seen it in his life. He had a small boat poled out on the rising tide, drifted a little way into the gulf, and came back. The bead market shut for three days, every stall packed away indoors. The bead maker’s daughter squeezed into the crowd on the embankment and saw only a parasol, a boat, and a man standing in the bow for a long time. Back at the workshop she dug out the last letter from Fez. At the bottom it asked: “What color is the sea at Khambhat? You still haven’t named it.” The old grinder asked what the emperor looked like. “I couldn’t see his face.” She spread out a sheet of paper. “What I saw was how he looked at the sea—the very same way someone from Fez first looked at my beads.” She put the line into her reply word for word. What color the sea was, she still didn’t say."
news = "Akbar’s army has taken Gujarat, and the emperor himself came to Khambhat to look at the sea and even went out in a little boat. The bead market shut for three days."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_choice]
title = "Strangers on the Register"
text = "The new Mughal officials want every stranger in Khambhat to come in and register at the office: anyone without a guarantor or a living goes out on the next ship. The line runs out of the door, and Khadija stands at the end of it holding nothing but that roll of maps. She took ship straight from Jeddah. The letter from Fez telling her to come home and mind the warehouse is rolled up inside the map, unanswered. Tara comes running back from the bead makers’ guild, sweating. “The guild will vouch for her, but the master says we have to wait. Wait till he’s balanced his books, wait till the new officials know his seal.” “How long?” “He didn’t say.” Tara turns to me. “You deal with officials all the time. Does she count as having a living?” Khadija hugs the roll a little tighter. “I record routes. Every stretch of road and who told me about it—I never miss one. Does that count?”"
news = "Khambhat’s new officials are registering strangers. There’s a long line at the office, and at the back of it a woman from Fez holding nothing but a roll of maps."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_choice.default]
news = "Khambhat’s new officials are registering strangers. A woman from Fez lodging behind the bead maker’s house spent two months waiting on a guarantor, and in that time drew every lane in town."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_choice.choices.ask_pass]
text = "Go to the office and get her a pass that names her a caravan’s route clerk."
reply = "The clerk said a woman couldn’t be a clerk and pushed the map back across the desk. I pushed it back again and unrolled it. The new official strolled out of the inner room and bent over it for a long while, until his finger stopped on Khambhat. “Why are there only a few quay names here?” “I copied them off beads,” said Khadija. “Nobody’s told me the roads of Khambhat yet.” “Then draw me one. From the quay to this office, and don’t leave out a single lane.” The pass was signed that day. In the box for occupation, the clerk chewed his pen for a long time and finally wrote: Recorder of Roads. Tara leaned over to look and burst out laughing."
news = "The Khambhat office has issued a pass to a woman from Fez, with “Recorder of Roads” as her occupation. They say the new official wants her to draw him a map of the town."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_choice.choices.family_letter]
text = "Carry a letter to her family in Fez saying why she won’t go back to the warehouse."
reply = "Khadija sat up all night writing it. I took it aboard and, at Jeddah, handed it to a caravan bound for Cairo. Back in Khambhat, the guild master dragged his feet for two months before he finally set his seal. The answer arrived in winter—one line from her father: “I’ll mind the warehouse myself. Write your routes down properly, and don’t leave out a single teller’s name.” Khadija read it, pressed the letter to her face, and cried. Tara didn’t ask why. She warmed a bowl of milk on the stove and set it down beside the map."
news = "A ship out of Khambhat carried a thick letter to Fez for the woman who draws maps behind the bead maker’s house. The answer came back in winter, a single line long."

[tracks.tie_new_tara_mani_khadija_rihla.chapters.tie_new_tara_mani_khadija_rihla_landing]
title = "The Bead Between the Pages"
text = "Khadija’s travel book had reached its thirtieth page. At the foot of every page was the name of whoever told her that road: a Jeddah boatman, a Cairo camel driver, an old bead grinder of Khambhat. Under the few stretches she had walked herself, she wrote only “I.” She worked in Tara’s workshop, her table hard up against the grinding wheel, a film of stone dust on her ink. One evening after work, Tara took a carnelian from her purse. It had cracked under the drill, and she had carried it for years. She slipped it between the pages. “A bookmark. This one goes on nobody’s bill.” Khadija looked at the crack for a long while and, for once, didn’t ask where it came from. She pulled the map she had brought from Fez out of the bottom of her chest, unrolled it, and in the square for Khambhat she inked: Tara Mani. “The teller?” Tara asked. “The one who lives here.” Khadija blew the ink dry. “Somebody lives in this square now.” That night, before the lamp went out, she kissed Tara."
news = "A woman from Fez is lodging in a Khambhat bead maker’s workshop, writing a travel book at a table pushed up against the grinding wheel, with beads tucked between the pages."

