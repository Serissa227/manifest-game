# 门板还要装回去（pair_kaspar_griet）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、见闻、选项、回复、变体、回忆标题），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完（Claude Sonnet）；美式拼写、弯引号。回忆标题按 effects 的下标对应（choice 的 children / door 里第 4 个是 memory，放空表占位）。

[tracks.pair_kaspar_griet]
name = "The Door Goes Back On"

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_meeting]
title = "The Tab Behind the Door"
text = "The back of the door is Griet’s ledger. The new gunner has run up three months of beer, and she has chalked it all down in figures each a palm wide. Kaspar reads it from the doorway. “Too big. Third house from the east end could read it across the street.” “That’s the idea.” Griet takes the chalk and adds one more stroke, bigger than the rest. The next noon he comes with no money, only a paper of nails. He turns the chair that always leans to one side upside down and taps the nails into the joints one by one. Set back on the floor, it no longer rocks. Kaspar says, “What breaks gets mended.” Griet tests a leg with the toe of her shoe. “That doesn’t pay for the beer.” She doesn’t touch the line on the door."
news = "Behind the door of the widow’s tavern on the Antwerp quay there’s one more line of chalk. The gunner who owes it hasn’t paid, but he has fixed the wobbly chair."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_together]
title = "The Autumn Payments Stopped"
text = "The crown has stopped payments, the men in the citadel go unpaid, and the footsteps in the street get more ragged by the day. After closing, Kaspar doesn’t leave. He lifts the lantern, leads Griet out the back door, and paces the narrow alley step by step. “One man gets through here. A cart gets through here, if you take a wheel off at the corner.” At the mouth of the alley he looks back at the tavern’s back door. “Find the way out first, then place the gun. I did it the other way around once.” Griet carries her stores into the back room sack by sack, then counts them. “Enough till spring. I’ve counted you in.” She sits down beside him at the hearth. The fire cracks. He bends and kisses her, and she lifts her face to it. The debt is still chalked on the back of the door. When she gets up she looks at the chalk, leaves it on its nail, and goes."
news = "The crown has stopped payments again, and the soldiers in Antwerp go unpaid. The widow’s tavern on the quay keeps its fire lit after closing, and the regulars say the gunner hasn’t gone home."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_turning]
title = "Sandbags Facing the Citadel"
text = "All anyone on the quay talks about this month is the Spanish soldiers up in the citadel, months without pay, and the mutineers outside the walls with their eyes turned toward Antwerp. They say the town hall has men piling sandbags across from the citadel, and the troops the council sent for are nearly here. The widow’s tavern has put a new bolt on its back door, iron, a finger thicker than the old one. The regulars say the gunner who drinks on credit walks the quay every noon, counting street corners under his breath like a man calling a roll."
news = "The soldiers in the Antwerp citadel have gone months without pay, and people are piling sandbags across from it. The widow’s tavern on the quay has put a new bolt on its back door."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_choice]
title = "The Door Comes Down"
text = "On the fourth of November the citadel gates open and the mutinous soldiers pour into the street like a flood. Kaspar stands at the window, listening. “From the south, along the river street. Two companies, and the second one is out of step.” Without another word he lifts the tavern door off its hinges and shoulders it toward the alley mouth. Griet grabs the edge. “Owing for drink is fine. Owing for a life isn’t. There are three neighbor children in the back room, and they have to go out first.” “If the alley mouth isn’t blocked, they won’t get far.” He doesn’t let go. “Then you block it, and I’ll see them out. The door can go back on later.” Through the crack of the back room door, three pairs of eyes are looking at me."
news = "On the night of the Spanish Fury, the door of the widow’s tavern on the Antwerp quay was taken down and set across the alley mouth, and word is that a good many children were got out the back way."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_choice.choices.children]
text = "Pick up the smallest child and lead the other two into the back alley"
reply = "The smallest one hooks an arm around my neck, and the other two hold fast to my coat. At the back door Kaspar tosses me one line: “Keep to the right wall. Stop at the second corner.” We slip into the narrow alley, and at the corner I look back. The door stands upright across the alley mouth, and Griet is behind it, handing him wedges."
news = "On that night in Antwerp, a stranger carried the smallest child out through the back alley of the quay tavern, and they say a door stood slanted across the alley mouth until daylight."
effects = [{ }, { }, { }, { title = "Three Children in the Alley" }]

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_choice.choices.door]
text = "Take the other end of the door and help him stand it up"
reply = "The door is far heavier than it looks, and the back of it still carries Griet’s chalk. We wedge it slantwise into the alley mouth. Kaspar tests it with his foot. “A finger’s width off square, and it hides three men from view.” Griet has already gone back inside. She brings the children out one at a time and sends them behind the door and down the alley toward the river."
news = "The door of the Antwerp quay tavern was wedged slantwise across the alley mouth, and they say a stranger helped carry it. The children inside were sent out behind it, one after another."
effects = [{ }, { }, { }, { title = "The Door Wedged Across the Alley" }]

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_choice.choices.watch]
text = "Stay in the tavern and bar the front door until dawn"
reply = "I bar the front door and sit down behind the counter. Footsteps come close, then fade, then come close again. Griet hands each child in the back room a stub of chalk and tells them to draw ships on the floor, and not to make a sound. Just before dawn there is a knock on the back door, three long and one short. Kaspar comes in carrying the door. One corner is gone and two lead balls are lodged in the boards, and he doesn’t have a scratch on him."
news = "On the night of the Spanish Fury the front door of the widow’s tavern on the Antwerp quay stayed barred till dawn, and the gunner came back carrying a door with a corner shot off, without a scratch on him."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_epilogue]
title = "Hanging the Door Again"
text = "In spring Kaspar carries the door out to the yard and planes it flat. He digs out the lead, plugs the holes with wedges, scarfs a new piece of oak into the missing corner, and hangs it back on the tavern, with the hinges rubbed in mutton fat. The chalk on the back is smeared at the edges, but the sum from 1574 can still be read. Griet climbs up on a stool and writes two words at the bottom: “Paid up.” Kaspar looks up. “What with?” “You know what.” She hops down and puts the chalk back on its nail. At closing he hangs his hat on the hook at the foot of the stairs, and does not go over to the counter to put anything on the tab."
news = "The door of the widow’s tavern on the Antwerp quay is back on its hinges, and under the old tab on the back of it somebody has chalked two words: paid up."

[tracks.pair_kaspar_griet.chapters.pair_kaspar_griet_epilogue.variants.helped]
text = "In spring Kaspar carries the door out to the yard and planes it flat. He digs out the lead, plugs the holes with wedges, and scarfs a new piece of oak into the missing corner. The three neighbor children turn up. The two older ones hold the door steady, and the smallest stands on tiptoe handing up nails, one at a time, and Kaspar says “good” for each, until the door is back on the tavern. The chalk on the back is smeared at the edges, but the sum from 1574 can still be read. Griet climbs up on a stool and writes two words at the bottom: “Paid up.” Kaspar looks up. “What with?” “You know what.” She hops down and puts the chalk back on its nail. At closing he hangs his hat on the hook at the foot of the stairs, and does not go over to the counter to put anything on the tab."
