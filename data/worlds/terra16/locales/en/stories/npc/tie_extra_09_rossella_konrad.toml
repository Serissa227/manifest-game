[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_landing.variants.helped]
text = "Konrad arrived in Setúbal with an old leather case. His resignation had gone in long since, he had come to keep the books for the pans, and the case held only a few small ledgers he had kept himself. Rossella had asked me to come too, because a ledger ought to have its creditor present. The pans’ new book lay open on the washing stone to dry, its last page face up: my name, then “paid in installments,” and beside it a line of tiny writing, “Said there’s no need. There is.” Konrad stopped on the bank and asked a second time. “When work is done, may I see you?” “Yes.” Rossella answered fast, as fast as her hands. “F-first wash this.” She pushed a salt-stiff work shirt into his arms and carried the tub down to the water. They crouched side by side on the stones to scrub. After a while she laughed. “You’re too gentle. The s-salt won’t come out like that.” He blushed and scrubbed it again, and the white ring on the cuff faded, ring by ring. “The gold hasn’t come,” he said. “I got here first.” “I-I counted you in ages ago.” She touched the corner of his mouth with hers, quickly. It tasted of salt."
