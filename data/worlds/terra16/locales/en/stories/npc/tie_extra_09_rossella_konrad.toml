# C7: English display overlay, keyed by track, chapter, choice and variant. Gameplay fields are not repeated here.

[tracks.tie_extra_09_rossella_konrad]
name = "Salt Leaves a White Mark"

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_meeting]
title = "The White on His Cuff"
text = "Konrad came across the salt pans with mud to his ankles, to talk about a shipload of salt. He was neat from collar to hem except for one thing: a stiff white ring around his right cuff, the mark of a man who has been down in the salt store. Rossella spotted it from behind a heap of salt. Her hand was quicker than her eyes; she caught his wrist and turned it over. “Y-you went down there yourself?” Konrad, sure he was about to be praised, puffed out his chest and started on the big Welser deal. She fetched a wooden bucket and set it at his feet. “W-wash it first. Dried salt makes the cloth go hard. It cuts.” He crouched and scrubbed, still talking. “The ships are booked. Wages wait on a bill of exchange from Seville. Until the gold arrives, don’t count the men in.” Rossella understood only half. No hired men counted in, so her own family would be doing the carrying. In a thin, small voice she named a price, a tenth above her usual. Konrad had scrubbed his cuff three times before he caught on. He sighed and signed the contract. The ring had faded. It had not gone."
news = "At the Setúbal salt pans the eldest daughter made the Welser agent wash his sleeve before talking prices. By the time he had finished, the price had gone up a tenth."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_closer]
title = "Salt Harvest"
text = "At harvest time Konrad hauled the salt sacks himself, and by the third trip he was propped against the stone by the scales, unable to straighten his back. Rossella squatted beside the scales, waiting for him. First she took a pinch from the salt spilled on the ground and tossed it over her left shoulder. Only then did she speak. “Y-your commission is three coppers a sack. That’s too much. There are eleven mouths in our house…” Her voice thinned with every word. A tear dropped into the scale pan, and then another. Konrad had never seen anyone cry so quietly. He fumbled his ledger open. “Half! Would half do?” The next day he came for the last of the load. From a distance he saw Rossella cross-legged on the bank, handing flatbread dusted with coarse salt down a row of brothers and sisters, laughing loud enough to be heard across the pans. The smallest was caked in salt from head to foot, white hands in the air, crowing, “I’m the king of El Dorado!” That was a story Konrad had told them when he stopped to rest. He stood below the bank, thinking of the two tears in the scale pan, then climbed up and sat down beside her, rubbing his back. “I-I won’t give in next time.” Rossella went red from neck to ears. She pushed the biggest piece of bread into his hand."
news = "At the salt harvest in Setúbal the Welser agent carried sacks himself, and the eldest daughter of the pans cried him down to half his commission."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_turning]
title = "After the Lease"
text = "A muleteer up from Seville rested at the Setúbal pans and talked about the Welsers. Their lease in Venezuela had ended years ago and left a heap of bad debts, each rolling into the next. The house wanted its young agent in Seville to spin the El Dorado story for new backers. He put his pen down. “I like telling the El Dorado story. To children. Using it to collect people’s money? No.” So they docked him half a year’s pay. The eldest daughter, squatting by the scales and counting sacks, heard half of this, and the tally cord in her hand fell to the ground. “It d-dropped again,” she whispered. “Of all years…” The muleteer could not tell whether she meant the cord or her luck. After that, in the weeks of the harvest, the stone by the scales where he sat to rest his back was often empty."
news = "Talk at the Setúbal pans says the Welsers’ debts in Venezuela keep growing, and their young agent in Seville has been docked half a year’s pay for refusing to peddle El Dorado to new backers."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_choice]
title = "Small Debts First"
text = "The pans had owed their workers wages for three months. I had come for the cargo list and found the counting shed lit. Rossella stacked coppers on the table in neat heaps, fast as shuffling cards, murmuring, “Old João, twelve days. The two Afonsos, nine each…” Workers first, Konrad’s commission after: she had decided that. Konrad moved his own entry to the very bottom of the page, pen hovering, then looked up. “When work is done, could I see you?” He said he wanted to leave the Welsers. But there was one IOU, forty ducats he had taken years ago as if it were gold, and the firm said whoever took it owned it. Until it was settled, his resignation could not go in. Rossella’s hand froze in mid-air. After a long stammer she managed, “F-finish the accounts first.” Then she and Konrad both looked at me."
news = "At the Setúbal pans, when the wages were paid, the Welser agent put his own commission on the very last line."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_choice.choices.small_debt]
text = "Pay off the forty-ducat IOU for Konrad."
reply = "I tipped forty ducats onto the table. Konrad rang each coin against the wood and listened, because this time he would not mistake paper for gold. Then he wrapped them up and wrote his resignation that same night. The firm would not let him go until he had handed over the Seville books, and that took the whole winter. Rossella turned to the last page of the ledger and wrote my name, and beside it “paid in installments.” “No need to put that down,” I said. “It h-has to be put down.” She added, “I’ll pay it back a copper at a time. Half a copper, if I have to.”"
news = "Somebody at the Setúbal pans paid off an IOU for the Welser agent, and they say he wrote his resignation that same night."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_choice.choices.listen]
text = "Sit down and go through three months of accounts with Rossella, line by line."
reply = "The three of us sat over one lamp and went through it from the first line to the last. Rossella still stammered through the first two pages. By the third the figures stood up in neat rows and her tongue straightened out. When the last sum balanced she pushed the ledger across to Konrad. “The a-accounts are done. Ask.” He went red to the ears and pushed it back. “If I ask now, I’m paying for a yes with an IOU. I’ll ask when my own books are clear.”"
news = "The counting shed at the Setúbal pans stayed lit until past midnight while the eldest daughter and the Welser agent went through three months of wages from the top."

[tracks.tie_extra_09_rossella_konrad.chapters.tie_extra_09_rossella_konrad_landing]
title = "It Washes Out"
text = "Konrad arrived in Setúbal with an old leather case. He had quit the Welser post to keep the books for the pans, and the case held only a few small ledgers he had kept himself. He stopped on the bank between the pans and asked a second time. “When work is done, may I see you?” “Yes.” Rossella answered fast, as fast as her hands. “F-first wash this.” She pushed a salt-stiff work shirt into his arms and carried the tub down to the water. They crouched side by side on the stones to scrub. After a while she laughed. “You’re too gentle. The s-salt won’t come out like that.” He blushed and scrubbed it again, and the white ring on the cuff faded, ring by ring. “The gold hasn’t come,” he said. “I got here first.” “I-I counted you in ages ago.” She touched the corner of his mouth with hers, quickly. It tasted of salt."
news = "The Welsers’ former agent has quit and taken up bookkeeping at the Setúbal pans. They say he and the eldest daughter spent a whole afternoon side by side at the water’s edge, scrubbing work shirts."

