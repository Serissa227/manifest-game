# C7 重写：tie_extra_02_amaia_elene_urruti 的英文显示覆盖（嵌套表写法，按轨道、章节、选项 key 对应）；不含玩法字段。

[tracks.tie_extra_02_amaia_elene_urruti]
name = "The Back-Room Mortar"

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_meeting]
title = "The Back-Room Basin"
text = "The back-room door bangs open and fourteen-year-old Elene hauls her father in. A harpoon line has torn the harpooner’s right palm open, and blood is running between his fingers. “A pinch of salt’ll see to it,” he grumbles. “No call to come in here. The whole street says—” “Hand on the table. Open it.” Amaia doesn’t look up. “Don’t tell me what they’re saying out there. Gossip never cured anyone.” He makes for the door again. Elene puts both hands on his shoulders and plants him back on the stool. “Wash the wound. Save the swagger for dry land.” Now Amaia looks up. “Who taught you that?” “Nobody. I thought of it myself.” Amaia pushes a basin of warm water across to her. “Then you hold this. Keep your hands still.” Seven stitches, and not a drop slops over the rim. Amaia sends him home with the basin, herbs steeping in it. First thing next morning Elene brings it back, scrubbed till it shines, and stays standing in the doorway."
news = "In the back room of a Bilbao tavern, a girl of fourteen sat her harpooner father down on a stool to have his hand stitched, and held the basin without spilling a drop."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_closer]
title = "Sewn from Old Accounts"
text = "Elene drops the book on the table as if it were something she’d already thrown away. It is stitched with sail-mending twine, and every page has a shipowner’s hand on the back: “Whale oil, forty-two barrels; three leaking.” “Old accounts he threw out. I picked them up,” she says before Amaia can open her mouth. “I can’t afford good paper.” Amaia lets that pass and turns the pages one by one, putting a charcoal cross through every leaf drawn wrong: too many teeth on this one, the veins running the wrong way on that. “You don’t tear out mistakes. Cross them through and draw it again beside them.” “Then the whole book will be crosses.” “A book full of crosses is the only kind worth having.” On the last page is a plantain, drawn exactly right. Amaia puts no cross there, only a small dot beside it, and pushes the book back. By summer’s end another dozen ledger pages have been sewn in, and each carries fewer crosses than the one before."
news = "The Urrutis’ girl, the harpooner’s daughter, has gone to learn from the herbalist in the back of a Bilbao tavern. Word is that if she draws a single leaf wrong, she has to draw it again right beside it."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_closer.default]
effects = [{ title = "The Ledger-Paper Herbal" }]

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_turning]
title = "Witch Talk"
text = "All through January the Bilbao quays tell the same story: one of the men back from Red Bay drank Amaia’s medicine in the tavern’s back room and still didn’t see the month out. His widow stands at the corner of Coopers’ Street shouting “Witch!” until half the street leans out to look. Some speak up for the back room: “His legs were so swollen when he came ashore he couldn’t get his boots on, and his gums bled if you touched them. Nobody’s medicine would have been in time.” The tavern keeper wants no trouble and bars the back-room door. Someone hears Amaia through the planks: “Shut is shut. The pot still boils.” On the fourth morning Elene draws the bar and swings the door back against the wall. “If you’re sick, come in. If you’ve come to curse, do it from the street.”"
news = "A sailor back from Red Bay didn’t live out January. His widow cried “witch” at the corner of Coopers’ Street in Bilbao, and the tavern’s back room stayed shut three days before it opened again."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_choice]
title = "A Witness at the Door"
text = "Two men come from the parish, a deacon and a young priest with pen and paper, to ask about the sailor who died in January. Amaia sits behind her mortar and keeps the pestle going. “If it can’t be cured, it can’t be cured. Ask what you like.” She won’t speak up for herself, but Elene has already planted herself in the back-room doorway. “I changed his dressings those days. You ask me before you ask her.” She opens her book and holds it up under the priest’s nose. It is still ledger paper, but the crosses are few now; on these pages there are none, just one line a day: the third, swollen to the ankle; the seventh, past the knee; the twelfth, gums bleeding, can’t get the medicine down. The priest’s pen stops on the page. Amaia glances at Elene and doesn’t tell her to stand aside."
news = "When the Bilbao parish came asking about the tavern herbalist, it was her pupil who stood in the back-room doorway, holding up a book."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_choice.default]
news = "The herbalist’s pupil carried her book to the Bilbao parish, had her say and came back to her mortar. The questions came to nothing, though the street talk took all summer to die down."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_choice.choices.testify]
text = "Testify at the parish: he came ashore swollen-legged with bleeding gums—the sailors’ sickness."
reply = "I tell the priest what I’ve seen aboard ship: men back from a long voyage swell in the legs first, then their gums go, and once they’re ashore the medicine rarely catches up. When I’m done he strikes the word “witch” out of his notes. Back at the tavern, it’s Amaia who blocks the doorway this time. “Don’t think I owe you.” The next day Elene brings a packet of dried lemon to my ship all the same, with Amaia’s writing on the paper: two slices a day, chew them well."
news = "They say a captain from out of town went to the Bilbao parish to speak up for the tavern herbalist, and the priest crossed “witch” out of his notes then and there."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_choice.choices.handbook]
text = "Copy out the pages in her book on the sailors’ sickness for this year’s ship’s surgeons."
reply = "Elene copies for three evenings on good paper I bring up from the ship—the first time she has written on anything but the back of old accounts. At the foot of every copy she adds the same line: “Wash the wound. Save the swagger for dry land.” Amaia leafs through one and finds two mistakes. “Fix them before they go.” The surgeons of the three ships sailing for Newfoundland this spring take a copy each; one grumbles about her handwriting, another tucks his inside his coat on the spot."
news = "Every surgeon on the three ships that left Bilbao this spring carries a copy of the pages on the sailors’ sickness, written out by the pupil from the tavern’s back room."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_landing]
title = "The Mortar Changes Hands"
text = "On the first day of autumn Amaia pushes the mortar across to Elene. Its rim is worn smooth, and the pestle handle has a groove worn by twenty years of her grip. “Mornings are yours. Evenings are mine.” “Why mornings?” “The morning lot hurt less and swear less. You can stand them.” Elene asks nothing more. She takes a handful of dried plantain and grinds for a long time, until it comes out fine as ash, and frowns at it before anyone else can. Amaia looks, says not a word, pinches some coarse leaf in from the jar, gives it two stirs and puts the pestle back in her hand."
news = "In the back room of a Bilbao tavern the pupil sees the morning patients now and the herbalist keeps the evenings. After twenty years in her hands, the mortar has passed to younger ones."

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_landing.default]
effects = [{}, {}, { title = "The Mortar Handed Over" }]

[tracks.tie_extra_02_amaia_elene_urruti.chapters.tie_extra_02_amaia_elene_urruti_landing.variants.handbook]
text = "The day the first ship back from Newfoundland comes in, one of the surgeons finds his way to the back room and pulls the copy from his coat to show Elene, its corners curled and greasy with whale oil. “Those pages saved two men.” A few days later Amaia pushes the mortar across to her. Its rim is worn smooth, and the pestle handle has a groove worn by twenty years of Amaia’s grip. “Mornings are yours. Evenings are mine.” “Why mornings?” “The morning lot hurt less and swear less. You can stand them.” Elene takes a handful of dried plantain and grinds it fine as ash, and frowns at it herself. Amaia says not a word, pinches in some coarse leaf, gives it two stirs and puts the pestle back in her hand."
