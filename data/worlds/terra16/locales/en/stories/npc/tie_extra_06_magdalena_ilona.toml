# C7：英文显示覆盖，按轨道、章节、选项与 variants 的 key 对应；不复制玩法字段。

[tracks.tie_extra_06_magdalena_ilona]
name = "After the Measuring Cup"

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_meeting]
title = "Don’t Drink It Yet"
text = "Well past midnight the workshop door banged open and a woman came in with the cold still on her, the left shoulder of her coat soaked through. Magdalena got up to shut the door. “Leave the door open. …Good. Stay right there.” The woman kept her back to the doorframe, one hand on the knife at her belt, and would not sit; she looked over every window first. Magdalena pushed the bowl of medicine she had just brewed to the far end of the table. “Don’t drink that yet. Where does it hurt?” “Spare me. Hand it over.” “If you won’t say where it hurts, I won’t guess.” Magdalena opened her ledger. “If it’s a grain short, write down a grain short. Don’t make up the weight with wishes.” The furnace crackled for a long while. Teeth set, the woman pointed at her left shoulder. Coat cut away, wound washed and dressed. The wound was fresh, yet its edges had already closed, like one three or four days old. Magdalena entered the dose, and the wound just as she found it, with no question mark after it. She never asked what the woman had killed. The woman said her name was Ilona. At the door she looked back. “Nights, from now on—leave it open.”"
news = "An alchemist’s workshop in Prague’s Old Town had its lamp burning well past midnight. They say the woman who runs it was dressing a shoulder wound for a woman off the Black Sea coast."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_meeting.variants.ludmila]
text = "Well past midnight the workshop door banged open and a woman came in with the cold still on her, the left shoulder of her coat soaked through. Magdalena got up to shut the door. “Leave the door open. …Good. Stay right there.” The woman kept her back to the doorframe, one hand on the knife at her belt, and would not sit. “Who sent you?” Magdalena asked. “The one who keeps the Old Town library at night. She said your medicine doesn’t lie.” Magdalena snorted. “She has three of my books and hasn’t returned one.” She pushed the bowl of medicine she had just brewed to the far end of the table. “Don’t drink that yet. If you won’t say where it hurts, I won’t guess. If it’s a grain short, write down a grain short. Don’t make up the weight with wishes.” Teeth set, the woman pointed at her left shoulder. The wound was fresh, yet its edges had already closed, like one three or four days old. Magdalena wrote it down as it was and never asked what the woman had killed. The woman said her name was Ilona. At the door she looked back. “Nights, from now on—leave it open.”"

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_closer]
title = "The Chair by the Door"
text = "The shoulder had long since healed, but Ilona still turned up every few days—sometimes to pay something toward the medicine, sometimes because the shoulder hurt again. Before winter, three nights running, new footprints showed in the mud outside. On the fourth night she scattered furnace ash across the threshold, and at first light she crouched over it. “This one’s a new boot. The heel isn’t worn down yet. This one drags his left foot—he’s come a long way.” Magdalena crouched beside her to learn, and every time she read one wrong, Ilona smoothed the ash and pressed the print again. Back inside it was Ilona’s turn at the scales. A grain out, and Magdalena tipped the powder back into the jar. “Again.” Ilona hated being beaten, and on her way out she borrowed a brass measuring cup to practice with at home. Two rows of strokes ran along the wall, one row each; whoever taught a lesson drew a stroke in her own. Little by little the chair by the door became Ilona’s alone. One night she had been talking for a quarter of an hour before she noticed her back was to the window. She stopped short, and laughed first. “This room of yours has spoiled me.”"
news = "The woman who runs that alchemist’s workshop in Prague’s Old Town crouches at her door at dawn these days, learning to read footprints, while the Black Sea woman who calls so often learns to weigh doses inside."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_turning]
title = "The Court Moves In"
text = "That year the Emperor moved his court from Vienna to Prague. Below the castle hill new signboards went up overnight: alchemists, astrologers, sellers of the “philosophers’ stone,” and strangers whose trade no one could name, forever strolling on the Charles Bridge. Crucibles and charcoal doubled in price. The workshop in the Old Town went on selling medicine and nothing else. A man in velvet came by, they say, wanting “the powder that turns things to gold,” and the woman who runs the place didn’t even look up. “No gold. Something for fever, something to stop bleeding—those, yes.” The Black Sea woman in the chair by the door stood and pulled the door half open. “Buying medicine, come in. Anything else, out.” The man left. Within a few days half the street was calling it “the shop that won’t make gold.”"
news = "Since the Emperor’s court came to Prague, charcoal costs twice what it did and alchemists outnumber bakers. Only one shop in the Old Town refuses to make gold."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_choice]
title = "Two Slips of Paper"
text = "The man in velvet came back. He was making gold for great folk up on the castle hill now, and this time he didn’t want powder; he wanted her furnace ledger. “Let me copy three pages. Your figures can vouch for my gold.” He left a signed note and said he would collect at the end of the month. That same month Ilona came back from the Charles Bridge and slapped a scrap of paper on the table: three strokes, and under one of them a crooked little foot. Magdalena knew that foot. She laid the two papers side by side and set a scale weight on them. “Mine can wait. Yours can’t.” Ilona pressed her hand flat on the note. “Yours can’t either. He’ll use your numbers to cheat the Emperor, and when it falls apart, it’s your furnace they smash first.” That night the workshop lit no lamp."
news = "Strangers have been standing at the foot of the Charles Bridge in Prague for days now, and that alchemist’s workshop in the Old Town keeps its lamps dark at night."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_choice.default]
news = "The Old Town workshop in Prague stayed dark three nights running. On the fourth day the strangers at the Charles Bridge were gone, and the man from the castle hill never got a single page of that furnace ledger."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_choice.choices.block_charlatan]
text = "Stand at her door at month’s end and turn away the man who comes for the ledger."
reply = "At the end of the month the man came for the ledger, and you didn’t step aside. He said people at court were waiting to see the figures; you said the people at court were welcome to come themselves. He went off cursing and borrowed a ledger from some other shop. In the spring he made gold before a crowd on the castle hill, and someone pried the false bottom out of his crucible. Not long after, the court apothecary sent to the Old Town for a batch of fever remedies from “the woman who wouldn’t lend her ledger.” Magdalena entered a line in her book: “Ledger not lent. Handled by: the captain.”"
news = "A puffer who scrapes a living on Prague’s castle hill went to the Old Town workshop to borrow its furnace ledger, and a foreign captain stood in the doorway and wouldn’t let him have it."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_choice.choices.cover_ilona]
text = "Wear Ilona’s old cloak and lead the men at the bridge across the river."
reply = "After dark you put on Ilona’s old cloak and walked slowly from the bridge into the lanes of the Lesser Town. The one who drags his left foot followed you half the night; the other two searched up and down the riverbank and gave up only at dawn. Ilona came in a quarter of an hour after you—she had spent the night under the eaves on the far bank, watching them. There was no blood on her hands. For the first time she didn’t wipe her knife before anything else; she sat straight down in the chair by the door. “I’m starving. Anything to eat?”"
news = "The strangers at Prague’s Charles Bridge crossed the river one night last week and chased someone through the lanes of the Lesser Town for half the night. Nobody knows who."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_landing]
title = "A Chair Each"
text = "The two rows of strokes on the wall had reached the doorframe; there was no room left for more. Ilona polished the brass measuring cup, brought it back and set it beside the ledger. Magdalena had added a chair, side by side with the one by the door. Ilona put down her bowl and laid her knife on the stove, where it didn’t block the door. “Finished. Do I go, or stay?” Magdalena opened the ledger, wrote a line and pushed it across. Ilona couldn’t read much; she looked at it a long time. “What does it say?” “If it’s a grain short, I write a grain short. I wrote ‘willing.’ Not a grain short.” Ilona sat down, and this time she said nothing about her shoulder. Later the two of them moved into the rooms above the workshop. Late that summer someone outside the window was saying that two Englishmen had come to town with a black mirror, wanting to see the Emperor."
news = "That workshop in Prague’s Old Town that won’t make gold keeps its upstairs lamp burning late these days, and there are two chairs side by side by the door."

