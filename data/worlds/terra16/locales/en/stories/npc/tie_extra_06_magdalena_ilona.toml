[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_landing.variants.v1_hidden]
text = "The two rows of strokes on the wall had reached the doorframe; there was no room left for more. Ilona polished the brass measuring cup, brought it back and set it beside the ledger. Magdalena had added a chair, side by side with the one by the door. Ilona put down her bowl and laid her knife on the stove, where it didn’t block the door. “Finished. Do I go, or stay?” Magdalena opened the ledger, wrote a line and pushed it across. Ilona couldn’t read much; she looked at it a long time. “What does it say?” “If it’s a grain short, I write a grain short. I wrote ‘willing.’ Not a grain short.” Ilona turned her own chair around, sat down with her back to the window, and this time said nothing about her shoulder. Later the two of them moved into the rooms above the workshop. Late that summer someone outside the window was saying that two Englishmen had come to town with a black mirror, wanting to see the Emperor."

[tracks.tie_extra_06_magdalena_ilona.chapters.tie_extra_06_magdalena_ilona_landing.variants.v2_helped]
text = "The two rows of strokes on the wall had reached the doorframe; there was no room left for more. Ilona polished the brass measuring cup and brought it back. Beside the chair by the door, Magdalena had added another. The court’s fever remedies covered the table, and the two of them labeled bottles between mouthfuls of supper; Ilona stuck one on crooked, and Magdalena peeled it off and did it again. When the last label was on, Ilona laid her knife on the stove, where it didn’t block the door. “Done. Do I go, or stay?” Magdalena opened the ledger, wrote a line and pushed it across. Ilona couldn’t read much; she looked at it a long time. “What does it say?” “If it’s a grain short, I write a grain short. I wrote ‘willing.’ Not a grain short.” Ilona sat down, and this time she said nothing about her shoulder. Later the two of them moved into the rooms above the workshop. Late that summer someone outside the window was saying that two Englishmen had come to town with a black mirror, wanting to see the Emperor."
