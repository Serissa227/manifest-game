[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_landing.variants.helped]
text = "In the guild register those two names had stood side by side for sixteen years; only the shop sign had never caught up. The day the last order went out, Leonor carried a ladder into the street and put up a freshly painted sign: two names, Margarita’s first. Margarita stood in the middle of the street and looked at it so long that half the street stopped to look too. “I come second in the register and first on the sign? Who told you to write that?” Up on the ladder, Leonor pointed the brush at her. “Draw it first, then argue.” “You didn’t hear a yes from me.” Margarita was laughing as she said it. She hitched up her skirts, climbed the ladder and kissed her under the sign in front of half the street. The fish-seller clapped and shouted, “And whose account does that go on?” From then on, the room upstairs where Margarita had lived for sixteen years held nothing but books."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_landing.variants.mediated]
text = "The day the last order went out, Leonor carried a ladder into the street and put up a freshly painted sign: two names, Margarita’s first. Margarita stood in the middle of the street and looked at it so long that half the street stopped to look too. “I only bought in for half. Who told you to write that?” Up on the ladder, Leonor pointed the brush at her. “Draw it first, then argue.” “You didn’t hear a yes from me.” Margarita was laughing as she said it. She hitched up her skirts, climbed the ladder and kissed her under the sign in front of half the street. That night she tipped the other half out onto the counter—the pile pushed back to her sixteen years before, every slip still under its stack, not one coin spent. “Now I’m all the way in.” From then on, the room upstairs where she had lived for sixteen years held nothing but books."

[tracks.tie_new_margarita_leonor_ruiz_side]
name = "Side by Side at the Chart Shop"

[tracks.tie_new_margarita_leonor_ruiz_side.chapters.side]
title = "The Chart Shop Partners"
text = "The day the last order went out, Leonor changed the shop’s sign: two names painted side by side, the same size. Margarita stood in the middle of the street with her hands on her hips and looked at it a long while. “Well, that’s done it. Now all Seville knows half this shop is mine.” “All Seville knew years ago.” Leonor was putting in the last stroke up on the ladder. “You told everyone you met.” “You didn’t hear it from me!” One on the ladder and one at the foot of it, they argued from noon until dark. When they were done, Margarita locked up, Leonor shouldered the ladder, and they went down to the docks for fried fish. The fish-seller had kept back the two biggest for them, as usual, and put them on Margarita’s account."
news = "The chart shop on the Seville docks has a new sign with two women’s names side by side—one draws, one keeps the books. They argued over it at the door till dark, then went off together for fried fish."

