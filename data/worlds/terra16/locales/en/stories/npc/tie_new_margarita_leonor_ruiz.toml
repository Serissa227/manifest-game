[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_turning]
title = "A Letter from Naples"
text = "The letter from Naples said the marquis had died in office as viceroy. Within days a list went up on the gate of the Casa de Pilatos: the new master was turning off half the maids and servants and sending the rest out to the country estates. The woman who fries fish on the docks says that one evening the household’s sharpest-tongued maid sat on the steps of the chart shop hugging a money box, from sunset until the lamps were lit, and never said a word. The woman who draws the charts came out once. “Come in and sit. Those steps are cold.” The maid shook her head. “I’m doing my accounts.” A few days later the fish-seller heard her talking again at the stall: her severance had been paid, and with what was in the box it came to a nice round sum. “And that,” says the fish-seller, “she told me herself.”"
news = "Word from Naples is that the marquis is dead, and his Seville household is turning off half its maids and servants. Someone saw that quick-tongued maid sitting on the dock steps with a money box until dark."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_choice]
title = "She Came with Her Savings"
text = "Margarita carried the money box into the chart shop and set it down on the drawing table hard enough to make the ink bottle jump. “I want to buy in.” Since the old master died, Leonor had kept the shop going on her own. She didn’t even look at the box. “No.” Propping up her own shop with sixteen years of a friend’s savings was a disgrace she couldn’t stomach; besides, the guild register had never once listed a lady’s maid as a partner. “People write registers.” Margarita lifted the lid. Inside, the coins sat in neat stacks, and under each stack was a slip of paper marked with a year and a month. “Draw it first, then argue—your own words.” Leonor put her pen down on the table. There was no sound in the shop but the bargemen’s chant from the river. The two of them stood there deadlocked, then both turned to look at me."
news = "The maid the marquis’s household let go walked into the chart shop on the Seville docks with her money box and asked to buy a share. The owner wouldn’t even look at the box. She said no."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_choice.default]
news = "The chart shop on the Seville docks spent a week fighting over a money box. In the end the owner took the money as a loan, interest written out to the last coin, and the maid moved into the room upstairs—as a lodger, they say."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_choice.choices.guild_surety]
text = "Go to the guild and stand surety, so Margarita is entered as a partner."
reply = "The old man at the guild turned the bond over and over and said that in forty years of keeping the register he’d never seen a partnership like it. I signed where the guarantor signs. Margarita took the pen and wrote her name faster than she talks, then blew the ink dry for him. Leonor stood behind us biting back a smile the whole time, and only lost the fight once we were out the guild door. “That hand of yours looks better than my charts.”"
news = "For the first time, the Seville chartmakers’ guild has a former lady’s maid in its register as a partner. A ship’s captain stood surety for her, and the old man at the guild hasn’t stopped shaking his head."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_choice.choices.talk_leonor]
text = "Tell Leonor: sixteen years in that box, saved for exactly this day."
reply = "When I’d said my piece, Leonor said nothing for a long time. Then she took her rule, slid the stacks into two piles and pushed one pile back. “Half buys in. Half you keep, so if you ever want to leave, you still can.” Margarita gathered that pile back into her arms. “I’m not leaving.” “Keep it anyway.” Leonor collected the slips from her own side one by one and pushed them across to her, pen and all. “The books are yours.”"
news = "The chart shop on the Seville docks took half that maid’s money as her share and pushed the other half back. The owner says it’s hers to keep, in case she ever wants to leave."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_turning_b]
title = "Fire at Cadiz"
text = "They still haven’t finished hauling the burned hulls out of Cadiz harbor. On the waterfront they say the English burned twenty ships; by the time it reaches the taverns it’s thirty. Nobody here calls that Englishman by his name—just “the Dragon.” Since then the shipowners have been rushing up to Seville for new charts, and spares besides. A pilot back from Seville says the lamp in that chart shop on the docks burns till midnight every night: two women, one drawing, one keeping the books, and orders piled off the table onto the floor. The day he went to collect, the one with the books was shouting inside, “The three for Cadiz go out today!” The one with the pen threw it down. “Nag, nag—nag once more and you can draw them!” You could hear it across the street. The pilot paid his deposit. His chart is booked for next spring."
news = "The English burned a harbor’s worth of ships at Cadiz, and the owners have all gone up to Seville for new charts. That chart shop on the docks works till midnight, and the two women in it can be heard arguing from across the street."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_landing]
title = "Two Names on the Sign"
text = "The day the last order went out, Leonor carried a ladder into the street, took down the shop’s old sign and put up a freshly painted one. There were two names on it, and Margarita’s came first. Margarita stood in the middle of the street with her head tipped back and looked at it so long that half the street stopped to look too. “Who told you to write that? There’s nothing about this in the loan papers.” Up on the ladder, Leonor pointed the brush at her. “Draw it first, then argue.” “You didn’t hear a yes from me.” Margarita was laughing as she said it. She hitched up her skirts, climbed the ladder and kissed her under the sign in front of half the street. The fish-seller clapped and shouted, “And whose account does that go on?” From that day on, the room upstairs that was supposedly let to a lodger held nothing but books."
news = "The chart shop on the Seville docks has a new sign with two women’s names on it. The day it went up, the one who used to be a maid in the marquis’s house climbed the ladder and kissed the one who draws the charts in front of half the street."

