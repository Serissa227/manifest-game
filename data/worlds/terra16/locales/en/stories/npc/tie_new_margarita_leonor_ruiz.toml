[tracks.tie_new_margarita_leonor_ruiz]
name = "Upstairs at the Chart Shop"

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_meeting]
title = "An Estate Map to Order"
text = "The maid the marquis’s household sent to order a map was called Margarita. She wore a band of old lace at her cuffs, and before she got down to business she went along the wall looking at every map in turn. The country estate wanted a new survey. She read out the boundaries and brought half the street’s gossip in with them: the steward’s wife said the olive grove on the east side belonged to the marquis, the priest from the next village said it belonged to the Church, the two households had been quarreling over a single tree for three years, and last year even the mules had started kicking each other. Leonor, the shop’s helper, was bent over the table with her rule and didn’t look up. “Draw it first, then argue.” That shut Margarita up. She sat on the stool tugging at her lace for a good while, then leaned in and dropped her voice so low only the paper could hear. “The steward’s been holding back three months of our wages—you didn’t hear it from me.” Leonor’s pen stopped for a moment. The east plot she drew in as a dotted line."
news = "The chart shop on the Seville docks has taken an estate map from the marquis’s household. The maid who came to order it sat there all afternoon and got through half the street’s gossip."

[tracks.tie_new_margarita_leonor_ruiz.chapters.tie_new_margarita_leonor_ruiz_closer]
title = "Holding the Lamp"
text = "The sandbar at the river mouth had shifted again, the fleet was waiting to sail, and the shipowners took turns pounding the table for new charts. Leonor spread the pilots’ sounding records across the whole table and set the figures down on the chart one at a time, swearing under her breath. “Damned sandbar. Moves three times a year.” Margarita came straight from work, picked up the oil lamp and stood at her shoulder. Most nights she was barely through the door before it all came pouring out—who had fought with whom in the household, whose letter was really meant for whom. That night she talked about herself: a money box under her bed, nine years of saving, every coin entered in her accounts. “When there’s enough in it, I’m never carrying anyone else’s words again.” Leonor didn’t look up. “Lamp lower.” They refilled the oil three times. Near dawn Leonor put down her pen, took a tightly folded square of paper from inside her bodice and opened it out: a yellowed chart with one shoal drawn in the wrong place. “My first one. Wrong. I keep it to remind myself.” Margarita brought the lamp closer and looked at that shoal for a long time."
news = "The chart shop on the Seville docks kept its lamp burning all night, and the new sandbar chart was handed over before the fleet sailed. That gossiping maid from the marquis’s house stood in there holding the lamp till morning."

