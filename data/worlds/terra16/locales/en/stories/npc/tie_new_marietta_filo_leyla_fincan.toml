[tracks.tie_new_marietta_filo_leyla_fincan_side]
name = "Two Shops, One Wall"

[tracks.tie_new_marietta_filo_leyla_fincan_side.chapters.side]
title = "The Lamp Shop and the Coffee Stall"
text = "A lamp shop has opened next to the coffee stall at the arsenal gate. Only a wall stands between the two, and nailed to it is a sheet of paper with deep creases, covered in two people’s names: one line of tidy Ottoman letters, and under it several lines of crooked ones. Marietta carves a little squinting cat under every lamp. The sign and the receipts are Leyla’s business, and she writes even “no bubbles” with every stroke in its place. Shipwrights who come to order lamps always sit down at the coffee stall first. Leyla pours, and shouts through the wall, “Twelve lamps, and keep the third band fine!” From the other side comes the answer: “Heard you. One more turn on the wheel.”"
news = "Shipwrights on the Golden Horn say the new lamp shop by the arsenal gate gives out the hardest bills in town to wriggle out of: the woman from Murano grinds the lamps, and the coffee-stall girl next door writes the receipts."

