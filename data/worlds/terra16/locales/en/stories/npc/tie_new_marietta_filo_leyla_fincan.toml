[tracks.tie_new_marietta_filo_leyla_fincan]
name = "A Lamp by the Coffee Stall"

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_meeting]
title = "The Twelfth Lamp"
text = "On the quay of the Golden Horn a crate was pried open, and in the straw lay twelve Murano glass lamps a mosque had ordered, each base struck with the Filo family’s copper stamp. The receiving clerk picked one out, said it was cracked, and refused to sign for the lot. Marietta, who had brought the crate all the way from Venice, held the lamp up to the sun and turned it slowly. “One more turn on the wheel—don’t say you can’t see yet. The crack is in the third band of the pattern, thin as a hair. Hang it up and you’ll never see it.” The clerk put down his pen. “Seen or not, it’s a crack.” Leyla, who sold coffee at the arsenal gate, had been listening the whole time. Now she came over with two cups, pressed one on the clerk and one on Marietta, and helped herself to the paper and the reed pen. “Finish your coffee before you fight—the words aren’t written down yet.” She wrote it out stroke by stroke: eleven lamps sound, one with a fine crack, the crack in the third band. Then she turned the sheet around. The clerk read it from top to bottom, found nothing to argue with, and signed. Marietta was in no hurry to get back to her ship. She sat at the coffee stall until dark and drank four cups."
news = "On the Golden Horn quay a mosque clerk wouldn’t sign for a crate of Venetian lamps because one was cracked. The girl from the coffee stall at the arsenal gate wrote him a fresh receipt, and he signed."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_closer]
title = "Bubbles and Signatures"
text = "Two years later Marietta came with another load of lamps. Once they were handed over, she fished a shard of glass out of her bag at the coffee stall and held it up to the sun in front of Leyla’s eyes. “Look inside. Good glass has hardly any bubbles. Like the sea first thing in the morning, not a wisp of mist.” Leyla squinted at it for a long time. “All I can see is your finger.” Marietta moved the shard half an inch, and at last Leyla said, “Oh.” Then it was Leyla’s turn to teach. She wrote her own name at the top of a sheet as a model, then took Marietta’s hand in hers and guided it through “Marietta” in Ottoman letters, stroke by stroke, right to left. On the fifth try—“Beş,” Marietta counted, in the Turkish she had just picked up—the name finally stopped leaning. Leyla let go of her hand. “My mother can’t read. When I was little and the accounts needed her mark, I was the one who signed. I practiced it a few hundred times where nobody could see. I can write her name better than my own.” Marietta said nothing. She folded the sheet covered in both their names, folded it again, and slipped it into her tool bag."
news = "At the coffee stall by the arsenal gate on the Golden Horn, the keeper’s daughter spent a whole afternoon holding a Venetian woman’s hand, teaching her to write her name in Ottoman letters."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_closer.default]
