[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_turning]
title = "The Venetians Held"
text = "These days the shipwrights’ street talks of only one thing: the Sultan wants Cyprus, and he has gone to war with Venice for it. Over in Galata the Venetian merchants have been taken away one by one, their goods sealed and their ships held, and the bailo is shut up in his own house with soldiers at the door. “Every name on the list is accounted for,” says a man who runs errands for the officials, “all but one woman who works glass.” “Sailed a month before the war,” says the fishmonger. “Nobody saw her board,” says a shipwright. The twelve Venetian lamps in the mosque are still lit every night. Nobody has taken them down, and the one with the crack in the third band burns with the rest. The coffee stall at the arsenal gate opens as usual; only the keeper’s daughter packs up a little later every day."
news = "Every Venetian in Istanbul has been detained, and the bailo isn’t allowed out of his house. On the shipwrights’ street they say only one name on the list is missing: a woman who works glass."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_choice]
title = "The Way Home Is Shut"
text = "The peace was signed in March. In Galata the Venetians lined up to board their ships, and the quay was loud for a month. Marietta didn’t go. She spread her tool bag out on the low table at the coffee stall and took things out one by one: a steel graver, two whetstones, a little packet of fine sand, a pair of dividers. Murano’s rule was plain: a glassworker may not ply the trade abroad. She had spent three years grinding lamps on the Golden Horn. Go back, and she would be punished; stay, and she might never see her mother again. “So they punish me,” she said. “It won’t be the first time.” At the bottom of the bag was the sheet she had folded twice over, and her hand stopped. Leyla pushed a cup of coffee to her elbow. “Finish that before you fight.” Marietta didn’t drink, and didn’t fight. She looked up at me."
news = "The peace is signed and Istanbul’s Venetians are going home, but a woman from Murano at the arsenal gate has never once gone down to the quay."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_choice.default]
news = "The peace is signed and Istanbul’s Venetians are boarding ships for home. The woman from Murano never went to the quay; her tool bag has moved into the empty room next to the coffee stall at the arsenal gate."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_choice.choices.pass_papers]
text = "Go to the bailo’s house and get her papers to visit home."
reply = "The bailo’s clerk spent half a day leafing through old precedents, then added a line at the foot of the document: “Permitted to return home to visit family. Not permitted to work.” I brought it back to the coffee stall. Marietta read the line and laughed out loud. “No work there, work here. That’s enough.” Leyla asked for the paper, read it aloud from top to bottom, even traced a fingertip around the edge of the seal, and only then handed it back. “The seal’s crooked. Still, nobody can wriggle out of it.”"
news = "The bailo’s house in Pera has given a woman from Murano on the Golden Horn a paper: she may go home to visit, but not to work. Leyla at the coffee stall read it out to a whole table of shipwrights."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_choice.choices.carry_letter]
text = "Carry a letter of hers back to Murano and see it reaches her mother."
reply = "It wasn’t a long letter, but it took Marietta all night, and more of it was crossed out than kept. In Murano I found the family who sold glass beads. Her mother couldn’t read; she had the priest next door read it to her twice, then sat on her doorstep for a long while. The reply was written by someone else, and it ran to a single line: “Your own mark—remember to cut it deep.” I carried it back to the Golden Horn. Marietta read it without a word, picked up her steel graver, and drew it across the whetstone, again and again."
news = "A ship from Murano brought a one-line letter from home for the Venetian woman by the coffee stall on the Golden Horn. That night the whetstone in the room next to the stall rasped until dawn."

[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_landing]
title = "A Lamp Shop by the Coffee Stall"
text = "Next to the coffee stall at the arsenal gate, the room that had stood empty for years opened its doors. A row of little glass lamps hung over the entrance and chimed against one another whenever the wind went by. Leyla had written the sign, in letters you could read from half a street away. Marietta crouched behind the counter cutting the bases. Under every lamp she carved a little squinting cat, and under the cat her name, right to left, the way Leyla had taught her with a hand over hers. Her father’s copper stamp touched none of them. Leyla wrote the first receipt too: one small lamp, no cracks, no bubbles. When the day’s work was done they sat at the edge of the stall over a last cup. Leyla began, “Finish your coffee before—” “No fighting today,” said Marietta, and leaned in and kissed her. Leyla went still for a moment, then set her cup down steady. “Noted.”"
news = "A lamp shop has opened next to the coffee stall by the arsenal gate on the Golden Horn. The woman from Murano carves a little squinting cat under every lamp, and the stall keeper’s daughter wrote the sign."

