[tracks.tie_new_marietta_filo_leyla_fincan.chapters.tie_new_marietta_filo_leyla_fincan_landing.variants.helped]
text = "Next to the coffee stall at the arsenal gate, the room that had stood empty for years opened its doors. A row of little glass lamps hung over the entrance and chimed against one another whenever the wind went by. Leyla had written the sign. Marietta crouched behind the counter cutting the bases. Under every lamp she carved a little squinting cat, and under the cat her name, right to left. Her father’s copper stamp touched none of them. At the very back of the cupboard lay the paper from the bailo’s house, its seal still crooked. When the day’s work was done they sat at the edge of the stall over a last cup. “Next summer I’m going back to Murano to see my mother,” Marietta said. “Then I’m coming too,” said Leyla. “Nothing on that paper says you can’t bring someone. Finish your coffee before—” “No fighting today.” Marietta leaned in and kissed her. Leyla went still for a moment, then set her cup down steady. “Noted.”"

