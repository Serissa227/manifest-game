# English display overlay for pair_theodoros_tommaso, nested by track, chapter, choice and variant key; display text only, no gameplay.
# Effect arrays line up by index with the Chinese file; only memory titles need text, every other slot stays an empty table.

[tracks.pair_theodoros_tommaso]
name = "Names Offstage"

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_meeting]
title = "How a Prince Stands"
text = "Three days before the Carnival play opened, the manager had hired a cavalryman who called himself an emperor’s grandson to lend the show some weight. Nail heads still stuck out along the edge of the backstage platform. Tommaso unbuckled the sword from Theodoros’s hip and stuck it in the prop rack. “A fallen prince never touches his hilt. The moment he does, the audience knows he wants a fight.” “If my forefathers fell, they fell standing straight,” Theodoros said, squaring his shoulders until they shook. “And your hands? Scatter them like you’re tossing crumbs.” Tommaso showed him three times. Every time, Theodoros’s hand dropped to his hip and went looking for a sword that wasn’t there. Tommaso backed away explaining where to stand, missed the edge with his heel, and slid off the platform. Theodoros got there in one stride, caught him with one hand, and set him upright on the floor. Tommaso brushed down his doublet, laughing. “That one didn’t need acting.”"
news = "At Carnival in Venice, a theater company hired a cavalryman who calls himself an emperor’s grandson. They say the play suffered, but he caught an actor falling off the edge of the stage."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_closer]
title = "The Man Who Played the Miser"
text = "On stage, Pantalone counted every candle stub. Backstage at the accounts table, Tommaso tipped out a month’s wages and pushed every coin to the doctor they had sent for. “If Pippo’s fever doesn’t break, who plays the servant who gets beaten tonight?” The doctor counted and left. In the doorway, Theodoros noticed two old playbills folded into the soles of Tommaso’s shoes. He said nothing. The next morning a faded cloak lay across the costume trunk, patched three times at the edges and still smelling of rain. Tommaso shook it out. “Which emperor wore this?” “I did.” Theodoros leaned on the doorframe and did not come in. “All the way from Corfu to here, and not a drop got through. Your costumes are new, and they leak.” Tommaso said nothing. He draped the cloak over his shoulders, and when the sleeves hung past his fingertips, he rolled them back, one turn at a time."
news = "A theater company in Venice has gained an old cloak for its costume trunk. They say the cavalryman who calls himself an emperor’s grandson gave it, and it is older than anything else they own."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_turning]
title = "Debt at the Back Door"
text = "They say the company owed money to half of Venice, and the creditors followed it backstage to seize the costumes. The manager, out of ideas, pushed forward the cavalryman who calls himself a prince and told him to put on his old cloak and frighten them: owing money to the imperial family brings bad luck. An old bookkeeper among the creditors was not impressed. He asked only, “Where’s your family tree?” The cavalryman actually produced it. The old man put on his spectacles and turned the pages for the better part of an hour. At the end he remarked that the handwriting was very neat, and took the costumes anyway."
news = "Creditors followed a Venice theater company backstage. The company put forward a man who calls himself an emperor’s grandson to scare them, and the creditors asked to see his family tree instead."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_choice]
title = "Not My Words"
text = "The manager slapped a new script down on the backstage table. The cover read The Prince’s Thanks: a fallen prince, his life saved by an actor, declares himself in public, and the audience weeps and pays. Tommaso pushed the script back. “My words don’t go on stage.” The manager said that everything he did was acting. Tommaso said anything but this. At the door, Theodoros was holding off creditors with his shoulder against the planks. He had heard. He did not turn around. Tommaso looked at me, his voice a little hoarse. “Help the company find another way, would you?” Then Theodoros spoke, still facing the door. “If blood is worth anything, it’s worth a sword taken for someone else. I’ll take this one.”"
news = "A Venice theater company wanted to stage a new play about a prince repaying his rescuer. They say the actor who plays the miser flatly refused and argued with the manager all night."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_choice.default]
news = "The prince-repays-his-rescuer play at a Venice theater company never got staged. They say the cavalryman held the back door against creditors for a month, and his stool is worn into a hollow."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_choice.choices.notary]
text = "Take the company to a notary to sign a partnership contract in their real names"
reply = "In his shop the notary read the contract aloud, clause by clause, to the whole company: who plays how many nights, who takes what share, who covers when someone is ill, and a last clause spreading the debt over three years, with the old bookkeeper’s thumbprint under it, every clause followed by a real name. When it was Theodoros’s turn, the pen hovered a moment. He wrote “Theodoros” and left off the imperial surname. The manager grumbled and signed too, and nobody mentioned The Prince’s Thanks again."
effects = [{}, {}, {}, { title = "A Contract in Real Names" }]

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_choice.choices.debts]
text = "Pay off the company’s debt"
reply = "I counted the money out on the table. The old bookkeeper checked every coin and had the seized costumes carried back backstage, the old cloak lying on top of the trunk. Tommaso shook it out and put it around Theodoros’s shoulders, fastening it up to the top button. “This time I owe you.” Theodoros looked down at the patches and grunted. “Interest at the imperial rate.”"
effects = [{}, {}, {}, { title = "The Old Cloak Returned" }]

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_choice.choices.watch]
text = "Stay out of it and see whether the play gets staged"
reply = "I sat on a bench in the empty house all night. The argument backstage didn’t die down until the small hours, and the shape in the doorway never moved. At dawn Tommaso came out holding the script torn in two, and Theodoros followed behind carrying his makeup box."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_together]
title = "Only Our Names"
text = "On the last night of Carnival, The Fallen Prince was no longer on the bill. Backstage there was one lamp left. Theodoros had taken off the borrowed gold-trimmed coat and sat on the stool by the door, where he had kept his post for a month while the creditors circled outside. Tommaso lifted off Pantalone’s leather mask. It had left a red line across the bridge of his nose. “That one was a line. The next one is true.” He tossed the mask into the trunk and paused. “Theodoros.” Theodoros stood, and the stool crashed over; neither of them picked it up. “I’ve recited that whole string of family names a hundred times,” he said. “I’ve never once heard just the first name.” Tommaso kissed him. Outside, a creditor knocked three times, and nobody answered."
news = "Venice’s prince-in-exile play is not running this year. They say the cavalryman who used to call himself an emperor’s grandson now only answers to his own name."

[tracks.pair_theodoros_tommaso.chapters.pair_theodoros_tommaso_together.variants.helped]
text = "On the last night of Carnival, The Fallen Prince was no longer on the bill. Backstage there was one lamp left, and no creditors outside the door. Theodoros carried the stool back to its corner, took off the borrowed gold-trimmed coat, and sat down at the mirror. Tommaso lifted off Pantalone’s leather mask. It had left a red line across the bridge of his nose. “Everything on that stage was lines,” he said, tossing the mask into the trunk and turning around. “This isn’t. Theodoros.” Theodoros stood, and the candle in front of the mirror shivered. “I’ve recited that whole string of family names a hundred times,” he said. “I’ve never once heard just the first name.” Tommaso kissed him. The flame leaned over, then stood up straight again."
