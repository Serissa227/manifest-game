# C7 重写（2026-10-11，Claude Opus）：tie_sowol_haewol「军报背面的人家」的英文显示覆盖。
# 按轨道、章节、选项、变体的 key 写成嵌套表；只覆盖显示文字，不含玩法字段。
# 专名照人物英文覆盖层：Park Sowol、Ko Haewol；口头禅照人物卡的英文。

[tracks.tie_sowol_haewol]
name = "On the Back of the Report"

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_meeting]
title = "Her Own Words First"
text = "Dongnae had sent down a new register of fishing households, and every family that had come over from Jeju had to report once at the Busan office. When a sun-darkened diver’s turn came, she would not sit, and she went straight to the year of the raids. “That June the Japanese ships came into the bay at night, and my mother drove us up the hill. When I looked back, the three nets drying on our rocks were burning like a New Year bonfire. Nine years, and nobody has paid back a single thread.” Park Sowol, the interpreter’s daughter, was copying for the clerk. Her brush never paused, and when she had finished she read it aloud: “Ko, commoner of Jeju. Japanese raid, Eulmyo year. Three nets lost.” The diver waited for the rest. None came. “Whose story is that?” Sowol turned the sheet over. “The official letter is done. The letter home still has to go. Tell it again. This time I’ll write your words first.” Ko Haewol told it again, longer than the first time. The back of the sheet filled up. Not one word on the front was changed."
news = "Word from the Busan office: the interpreter’s daughter filled the back of a report with a Jeju diver’s own words and left the three official lines on the front exactly as they were."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_closer]
title = "Counting from the Water"
text = "Haewol took Sowol down to the divers’ village and counted it house by house: whose nets had burned, whose man had gone to sea and not come back, whose daughter had only started diving this year. “How old is the girl in this house?” Sowol asked. “Eleven. A year younger than I was when I started.” Sowol tucked her skirt into her sash and was still soaked to the knees, but on the rocks she wrote faster than she ever did at the office. At the mouth of the bay a diver was coming up for air far out, and Sowol started clambering over the rocks with the register to go and ask her name. Haewol hauled her back. “Be brave on land all you like. In the water, you listen to me.” She went in herself and swam out. On the way back she let out her long whistle first, shouted the name ashore, then pushed an abalone into Sowol’s hand, weed still trailing from the shell. “Take that home. Call it today’s ink money.” Sowol weighted the page down with the abalone, wrote in the name, and added a small line beside it: “Mouth of the bay. Asked in the water.”"
news = "In the divers’ village outside Busan, people saw the interpreter’s daughter with her skirt hitched up, taking names door to door. The Jeju diver showing her around pressed an abalone on her."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_turning]
title = "Warships Only"
text = "At the start of winter the Gyeongsang naval command sent down a new form for its reports: how many warships, how many soldiers, how many guns. The last column, the one for coastal fishing households, had been struck through in red. At the Busan office a clerk made a joke of it. “The interpreter’s girl spent a whole autumn running around in a wet skirt, and all she ran up is a book nobody wants.” They say Park Sowol did not even look up. “Thirty-seven households. Show me which one was for nothing.” Then she wrapped the register in oiled paper and locked it in her own chest. Early next morning there was a basket of kelp at the office gate, still dripping. The gatekeeper said the woman who left it had a Jeju accent and said only one thing: “For the interpreter’s girl. Not for the clerks.”"
news = "They say the Gyeongsang naval command’s new reports ask only after warships and soldiers, with the fishing households struck off, and that next morning a basket of wet kelp turned up at the Busan office gate."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_choice]
title = "Word Back from the Shore"
text = "In early spring I went to the Busan office for a sailing permit, and Sowol caught me in the back courtyard. She was holding the register she had taken out of her chest, still in its oiled paper. “If the naval command won’t have it, I’ll send it to Dongnae. If Dongnae won’t, I’ll send it to the governor.” Haewol, squatting on the steps, went on stripping kelp. “The people in it still don’t know what you’ve made of them.” Sowol thought about that. “Then I’ll make the rounds again and read it to every house.” “The ones on Jeoryeong Island need a boat, and boats cost money.” Haewol glanced at her embroidered shoes. “And on the rocks past Dadaepo you won’t make it a quarter mile.” Halfway through the argument they both turned to look at me."
news = "The Busan interpreter’s daughter means to read a fishing register aloud door to door. The Jeju diver says she walks too slowly, and the two of them argued half the day in the office courtyard."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_choice.default]
news = "They say the Busan interpreter’s daughter carried her fishing register along the coast and read it at nine houses before the rain came, then left the other twenty-eight to the Jeju diver."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_choice.choices.read_back]
text = "Pay the boat fare, carry the register, and read it house to house with them."
reply = "We walked from Dadaepo to the mouth of the bay, then hired a boat out to Jeoryeong Island. At the fourteenth house an old diver put her hand flat on the page. “My man’s name is Manseok, not Manbok.” Sowol struck it out and wrote it again on the spot. The old woman couldn’t read, but she put her finger on the character and said it over three times, until it sat right in her mouth, before she let us go. Outside, Haewol was already counting up ahead. “Twenty-three to go. Keep up, dry-landers.”"
news = "Along the Busan shore the interpreter’s daughter read her fishing register at every door. On Jeoryeong Island an old diver said her husband’s name was wrong, and it was put right then and there."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_choice.choices.to_dongnae]
text = "Make a fair copy of the register for them and take it to Dongnae."
reply = "I copied for three nights. Sowol checked every page, found seven mistakes of mine and let none of them pass. The clerk at Dongnae accepted the book and said it would go in the storeroom. Sowol didn’t say a word the whole way back. It was Haewol who spoke first. “A storeroom beats a red line.” Halfway home Sowol bought three bowls of soup and rice and pushed the first one across to Haewol."
news = "That fishing register the naval command struck off at Busan has gone into the Dongnae storeroom as a fresh copy. The Jeju diver says a storeroom beats a red line."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_landing]
title = "A Page Set Right"
text = "Haewol took the register back to the shore for the summer, where a boy from the village school read it to her page by page. In autumn she carried it into the office, laid it open on Sowol’s desk and turned to a page with a folded corner. “Read.” Sowol read down to the sixth line. “…their nets burned by Japanese ships in the Eulmyo year.” “Stop. I never said the Japanese burned that family’s nets. The wind took them. Their second son still remembers that summer’s gale.” Every clerk in the room looked up. Somebody snickered. “So the interpreter’s book has mistakes too.” Sowol ignored him. In front of all of them she struck the line out, wrote “damaged by wind,” and then copied one more line into the margin: “As told by Ko of Jeju.” Haewol couldn’t read it. “What does that say?” Sowol read it to her once. Haewol nodded, reached over, and smoothed the folded corner flat."
news = "At the Busan office the interpreter’s daughter corrected a page of her fishing register in front of a roomful of clerks. The mistake had been pointed out by a Jeju diver."

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_landing.default]
effects = [{}, {}, { title = "A Page Set Right" }]

[tracks.tie_sowol_haewol.chapters.tie_sowol_haewol_landing.variants.helped]
text = "Haewol kept the register at the shore all summer and only brought it back to the office in autumn, laying it open on Sowol’s desk. It fell open in the middle, where a red thumbprint sat beside the name Manseok: the old diver on Jeoryeong Island had dipped her thumb in Sowol’s vermilion that day and said a name put right ought to be signed for. Haewol leafed ahead to the page with the folded corner. “Read.” Sowol read down to the sixth line. “…their nets burned by Japanese ships in the Eulmyo year.” “Stop. That family’s nets went in the wind. I never said Japanese ships.” Every clerk in the room looked up. Somebody snickered. “So the interpreter’s book has mistakes too.” Sowol ignored him, struck the line out in front of all of them, wrote “damaged by wind,” and copied one more line into the margin: “As told by Ko of Jeju.” Haewol couldn’t read it. “What does that say?” Sowol read it once. Haewol nodded and smoothed the folded corner flat."
