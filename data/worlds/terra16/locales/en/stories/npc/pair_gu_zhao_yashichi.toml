# 信送到，人还在（pair_gu_zhao_yashichi）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_gu_zhao_yashichi]
name = "The Letter Gets Through, the Man Is Still Here"

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_meeting]
title = "His Foot First"
text = "Yashichi came from Goto holding three letters above his head the whole way, and he was still holding them up when he crossed the camp threshold, as if carrying a bowl of boiling soup. Gu Zhao did not reach for the letters. He looked down at the man’s foot first. “How did you hurt it?” “The gangplank was slick. The letters couldn’t get wet. What’s a foot?” “Sit, brother.” Gu Zhao dragged over a chair and stayed standing himself. “You can curse me sitting down.” Yashichi did, in Chinese first, then in the Kyushu dialect, then in ship’s cant, and only when he ran out of breath did he notice that the wax on all three letters was untouched. Gu Zhao only asked whether a crosswind had come up at sea. He turned a letter over and glanced at the seal. “The seal is genuine. The man has to come back alive too.” Yashichi swallowed the last half of his curse and took the bowl of hot water Gu Zhao pushed into his hands. His fingers were still shaking."
news = "At a camp outside Ningbo, a go-between from Wang Zhi’s ship arrived carrying three letters above his head. They say the sergeant asked after the man’s foot before the letters, and fetched him a chair."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_together]
title = "Winter at Cengang"
text = "Wang Zhi’s ships lay in Cengang harbor, supposedly to accept the amnesty, and the talks dragged on. Gu Zhao stood guard at the stockade on shore; Yashichi had been sent from the ships to relay words. All winter they spoke through a few stakes, and the fire by the stockade burned until midnight every night. That night Yashichi took Gu Zhao’s reply through the gap. The margins were crowded with small writing: this one Gu can’t promise, this one must go to my superior, this one I don’t know. “It’s the most honest reply I’ve ever seen,” said Yashichi, and swore once in Kyushu dialect. “Too honest to be worth anything as proof.” “Proof is somebody else’s business.” Gu Zhao pulled back the bolt. “The fire’s on this side. It’s cold.” Yashichi came through and sat by the fire, the letter still in his hand. As the flames sank, Gu Zhao leaned over and kissed him, and the edge of the paper was crushed into a deep crease."
news = "The Cengang surrender talks have dragged on all winter, and the fire by the stockade burns until midnight every night. They say the sergeant on guard and the go-between from the ships are often seen sitting there together."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_turning]
title = "The Captain in Irons"
text = "Word has gone around the streets: Wang Zhi went to Hangzhou to take the amnesty, and the moment he entered the city they seized him. Aboard the ships at Cengang everything fell apart. Mao Haifeng set fire to his own vessels and cut a way out toward Japan, and the go-between went with them. Sergeant Gu, who had been guarding the stockade on shore, did not get away. His superiors called him in and questioned him for three days. Who kept feeding the fire by the stockade every night? Had he dealt privately with the men on the ships? The fishmonger says that in three days he gave one answer, “The firewood belonged to the camp,” and not a word more. On the fourth day he came out, and the fire pit by the stockade had gone stone cold."
news = "Word around Ningbo is that Wang Zhi was seized in Hangzhou and half the ships at Cengang burned, and the survivors ran for Japan. The sergeant guarding the stockade was questioned three days by his superiors."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_choice]
title = "Paper Saves No One"
text = "When news of Wang Zhi’s execution reached Hirado, the Chinese on the quay went about with grim faces, and for days nobody spoke. A smuggler’s boat brought a letter from Zhejiang with a single line in it: “Of everything Gu put in writing, not one promise has held.” Yashichi read it three times, cursed the sea in three tongues, then turned to me. “I can’t write back. This one I say with my own mouth; I won’t make paper answer for a man’s life. But he’s over the water, and my mouth can’t reach him.” He pressed the letter flat on his knee and smoothed it again and again."
news = "News of Wang Zhi’s execution has reached Hirado, and the Chinese on the quay look grim. They say one go-between received a letter from Zhejiang and has not answered it."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_choice.default]
news = "The go-between at Hirado kept the Zhejiang letter in his sleeve for a whole year, and only answered the next spring, with one line."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_choice.choices.meet]
text = "Risk arranging a meeting at sea, in the ruined harbor of Shuangyu."
reply = "Yashichi crouched and drew the Shuangyu jetty in the dust of the quay, then rubbed it out halfway. “On a slack-tide night. No lights on the ships.” I slipped past half of Zhejiang’s patrol boats and left word with a fishmonger in Ningbo. Half a month later another ship carried the answer back to Hirado, a single sentence: “Gu will be there.” The day was set for early summer next year. It had to be hidden from the officials on both sides, and I now owe a debt of favors I will not finish repaying in this life."
effects = [{}, {}, {}, { title = "A Night at Shuangyu" }]

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_choice.choices.carry]
text = "Carry a reply for Yashichi to Ningbo."
reply = "Yashichi ground his ink for a long time and wrote one line, with no salutation and no name, and handed it to me only when the ink was dry. Three characters: “Still here.” Then he said, “Sew it into the sail. Don’t let anyone read it.” That night I stitched it into the fold of the sail. In Ningbo I cut off the hem and gave it to a fishmonger. He weighed it in his hand and said he knew the sergeant."
effects = [{}, {}, {}, { title = "A Line Sewn into the Sail" }]

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_choice.choices.watch]
text = "Stay out of it, and just sit with him on the quay."
reply = "We sat on the stone steps at Hirado until the tide went out. Yashichi cursed the sea for a while, then the officials, and at last himself. Then he folded the letter down to a very small square and tucked it into his sleeve. “Whatever I keep in my sleeve is always heavy,” he said. “This one is light.”"

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_epilogue]
title = "One Letter a Year"
text = "What they say on the streets is that the sea ban gets stricter every year and fewer Chinese ships come to Hirado. Yet every spring a smuggler’s boat brings a letter from Zhejiang for the man who used to be the go-between on Wang Zhi’s ship. He writes back too, one line each time. When people ask the courier what that line says, he says he can’t make it out. It was so short it looked as if the writer was afraid someone would copy it. An old sailor glanced at it once, smiled, and said nothing. Folks say the one writing is in Taizhou, and the one reading is in Hirado."
news = "The sea ban tightens every year and fewer Chinese ships call at Hirado, yet each year a letter from Zhejiang reaches a go-between there."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_epilogue.variants.matched]
text = "What they say on the streets is that the sea ban gets stricter every year and fewer Chinese ships come to Hirado. Yet every spring a smuggler’s boat brings a letter from Zhejiang for the man who used to be the go-between on Wang Zhi’s ship. He answers with a single line, three characters last year and four this year. The courier says that at this rate it will take until his hair is white to make up a letter. An old sailor glanced at one once, smiled, and said nothing. Folks say the one writing is in Taizhou, and the one reading is in Hirado."

[tracks.pair_gu_zhao_yashichi.chapters.pair_gu_zhao_yashichi_landing_b]
title = "A Night at Shuangyu"
text = "The harbor at Shuangyu was smashed by imperial troops more than ten years ago. Half a jetty is left, and at low tide the blackened pilings show. Gu Zhao’s patrol boat lay to the north, Yashichi’s smuggler to the east, and neither showed a light. At the end of the jetty stood an oil lamp with a bowl over it, leaking a finger’s width of glow. “You’re earlier than I thought,” Yashichi said first. “I had three curses ready for you at sea, and now I can’t use one of them.” “A seal can’t save a man,” said Gu Zhao. “This time the man came himself.” They sat side by side on the black pilings until the tide rose over their feet. Before dawn Gu Zhao lifted the bowl off the lamp and the finger of light went out. He stepped onto the patrol boat bound north, and Yashichi called after him, “Next year, I’ll write you two lines.”"
news = "Lights were seen at the ruined harbor of Shuangyu one night. A fisherman says two boats lay alongside until morning, one an official boat and one a Japanese hull, and each went its way at dawn."
