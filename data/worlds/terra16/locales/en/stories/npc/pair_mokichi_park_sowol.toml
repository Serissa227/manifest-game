# 公文之外一张纸（pair_mokichi_park_sowol）的英文覆盖：只覆盖显示文字（轨道名、章名、正文、见闻、选项、回复、变体、回忆标题），玩法字段一律不写。
# 2026-10-11 C7 重写，与中文同一轮写完（Claude Sonnet）；美式拼写、弯引号。回忆标题按 effects 的下标对应（choice 的 verbatim / fast 里第 4 个是 memory，前三个放空表占位）。

[tracks.pair_mokichi_park_sowol]
name = "A Sheet Beside the Dispatch"

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_meeting]
title = "One Stroke Too Many"
text = "A ship from Tsushima brings a translated cargo list from the interpreter at Hirado, a Portuguese ship’s manifest. Sowol reads it end to end and stops only at the line naming the recipient. He has put one extra bar inside the “moon” of her name, turning it into “eye.” She takes her red brush, draws a ring around that one character, touches nothing else, seals the sheet up again, and sends it back on the return ship. Her father leans over. “The list reads well. Why circle one character?” “Once the official copy is done, the family letter still has to be delivered. And the name has to be right.” Twenty days later the next letter arrives. The recipient’s line is written enormous, and at the bottom he has added: “Hirado, clear this morning. Three gulls on the fish-drying rack at the end of the street.” Sowol corrects two of his translated terms. That last line she leaves alone."
news = "The Busan interpreter’s daughter sent a whole draft that came from Hirado back with a single stroke circled, and word is the next letter came with the writing twice as big."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_closer]
title = "Inside the Gate"
text = "The Tsushima yearly ship comes in, and among the interpreters aboard is a man from Hirado named Mokichi. After four years of letters, this is the first time Sowol has seen the hand behind them. Once the gate of the Japanese house is shut, no Japanese may step outside it. Sowol has brought her father’s papers in his place, and she sits down at a long table inside, one stack of letters at her end, one at his. He reads a line, she checks it. “You’ve written ‘your country’ as ‘your dynasty.’” “My mistake.” He waits for her nod before he picks up the brush. Eleven corrections in a day, and every time he waits for that nod. She is on the seventh before she notices she is counting. At dusk Mokichi gathers his papers and slides one small folded sheet to the bottom of the pile, then pushes the pile across. At home, under the lamp, Sowol draws it out. There is one line on it: “Hirado, clear the day we sailed, wind from the southwest.” She grinds her ink and adds a line below about Busan, and next morning the man who delivers firewood and rice to the compound carries it in."
news = "The Tsushima yearly ship has docked at Busan, and the Hirado interpreter spent a whole day checking papers in the Japanese house. Word is he left a slip of paper under the stack when he went."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_together]
title = "Cold Rice"
text = "Mokichi comes to Busan a second time, with twice the papers of last time, and by dark they have checked only half. The rice Sowol brought into the compound has sat at the corner of the table until it is stone cold. They eat it that way and finish the last document. Mokichi sets down his chopsticks. “I can’t get through that gate.” “And I can’t get to Hirado.” She slides her red brush back into the pot. “Then we write.” “For a lifetime?” “For a lifetime.” The wick pops. He touches the back of her hand, she doesn’t pull away, and she leans across and kisses him once. After that, every dispatch has another sheet beside it. Sometimes the sheet is covered edge to edge. Sometimes it holds one line: “The rice went cold.”"
news = "They checked papers in the Busan Japanese house until dark, and word is the interpreter’s daughter and the Hirado man ate cold rice and finished the last one."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_turning]
title = "The Envoys Sail"
text = "Word has gone round the taverns: the court is sending envoys to Japan, Hwang Yun-gil as chief and Kim Seong-il as his deputy, sailing from Busan. The port has been thick with carts all month, and the lamps burn all night in the interpreters’ houses. They say one interpreter’s daughter copied papers for the embassy for a month, until her wrist swelled, and when she had finished she sealed a letter of her own and gave it to someone in the embassy who was crossing ahead. People asked what was in it. “Family talk,” she said. When they asked again she shut the door."
news = "The envoys have sailed from Busan for Japan, and they say the interpreter’s daughter copied papers for them for a month and then sealed one more letter for someone to carry across."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_choice]
title = "The Line to Keep"
text = "Hirado, the interpreter’s house. Mokichi has Sowol’s letter open in front of him and his own reply beside it. When I walk in he is scraping the edge of the paper with a fingernail and doesn’t look up. “She says all of Busan has been copying papers for the embassy. I’m answering with this part.” He reads it out: “‘There are more newly lacquered warships in the Hizen harbors, and more rice in the storehouses, and nobody has told me who it is for.’” He holds the sheet at arm’s length. “If I strike it, she worries less. Should I strike it? You tell me.” Before I can open my mouth he shakes his head. “It isn’t said until both sides have understood. But this letter has to cross the sea, and the embassy is already on the road.” He folds the paper and looks at me."
news = "The old interpreter at Hirado has been down at the quay every day waiting on the Tsushima boats. Word is he’s got a letter for Busan that he rewrote three times and still struck nothing out."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_choice.default]
news = "The letter from the Hirado interpreter rode a Tsushima boat for two months and reached Busan with winter. That one line was never struck out."

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_choice.choices.verbatim]
text = "Not a word changed. I’ll carry your reply to Busan"
reply = "Mokichi folds the letter down to the width of a finger. I open the seam of the sail and stitch it in, one stitch at a time. In Busan, Sowol opens it on the veranda of the interpreters’ hall and reads that line aloud. “Nobody has told me who it is for.” She doesn’t cry. She pulls a fresh sheet of petition paper toward her, copies the line onto the first row exactly as written, and goes to find her father."
news = "The old Hirado interpreter’s reply was stitched into the seam of a foreign ship’s sail, and word is not one word of it was changed all the way to Busan."
effects = [{ }, { }, { }, { title = "The Line Left In" }]

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_choice.choices.fast]
text = "I’ll get it there before the embassy turns back"
reply = "I catch a few days of southwest wind and cross the strait in one run. When the letter reaches Busan the embassy is still in Japan. Sowol opens it in front of me, reads it through, and takes it straight to her father. The old interpreter reads it twice. For a long time he says nothing. Then he moves the lamp on the table a little closer to her."
news = "A foreign captain rode the southwest wind and got a letter from Hirado to Busan in a fraction of the time the Tsushima boats take."
effects = [{ }, { }, { }, { title = "The Wind Ahead of the Embassy" }]

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_choice.choices.watch]
text = "I’ll stay out of it and let the letter go with the Tsushima boat"
reply = "I hand the letter to the Tsushima boatmaster waiting at the quay and ask nothing more. Later I hear the boat sat in harbor two months waiting on wind, and Mokichi went down to ask about sailing dates every one of those days. The letter reaches Busan with winter. Sowol reads it, and her answer is one line: “Write it as it is. I can read it.”"

[tracks.pair_mokichi_park_sowol.chapters.pair_mokichi_park_sowol_epilogue]
title = "Translate It True"
text = "The embassy is back, and the two envoys say different things at court. One reports signs of movement and the other says there are none, and they argue half a month without settling it. In the interpreters’ hall in Busan, Sowol lays out Mokichi’s letters one by one until they cover half the table. At the very bottom is the one written in huge characters thirty-five years ago, with its line about the clear weather still unstruck. She writes her answer in two lines and reads it to her father. “Whoever asks me from now on how this sentence should be rendered, I will render it true. So will you.” Her father asks, “Will he?” “His writing is quicker than his talk.” She folds the letter and writes his name on the cover. Then she holds it to the lamp and looks it over once. Not a stroke wrong."
news = "The envoys are home and tell the court two different stories. Busan’s interpreter’s daughter dug out thirty-odd years of old letters and says from now on she translates things as they are."

