text = "The embassy is back, and the two envoys say different things at court. One reports signs of movement and the other says there are none, and they argue half a month without settling it. In the interpreters’ hall in Busan, Sowol lays out Mokichi’s letters one by one until they cover half the table. At the very bottom is the one written in huge characters thirty-five years ago, with its line about the clear weather still unstruck. On her father’s desk lies the letter that came ahead of everyone that summer, its corners worn soft from handling. She writes her answer in two lines and reads it to her father. “Whoever asks me from now on how this sentence should be rendered, I will render it true. So will you.” Her father asks, “Will he?” “His writing is quicker than his talk.” She folds the letter and writes his name on the cover. Then she holds it to the lamp and looks it over once. Not a stroke wrong."
