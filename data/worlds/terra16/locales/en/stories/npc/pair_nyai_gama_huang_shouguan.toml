# 迟到一个月（pair_nyai_gama_huang_shouguan）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_nyai_gama_huang_shouguan]
name = "A Month Behind"

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_meeting]
title = "Supper Before Business"
text = "Huang Shouguan’s ship made Banten a full month late, and the half hold of pepper set aside for him had gone aboard someone else’s boat the night before. He stood on the landing with a head full of wind reports and no chance to start on them, because Nyai Gama had already put a bowl in his hands, rice with fried small fish on top. “Eat.” He squatted beside the pepper sacks and finished it, and only then was he called into the counting room. She named the price once and didn’t give up a copper. He began on the headwinds. She pushed the abacus aside. “Wind isn’t my business. Next time, tell me which day you’ll make port. Tell me first.” Huang stood holding the empty bowl and could think of nothing to say back."
news = "On the Banten quay, a pepper merchant’s daughter sold half a hold out from under a Luzon ship that was a month overdue, then fed the captain supper before she would talk price."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_closer]
title = "Order Papers Out to Dry"
text = "Huang Shouguan had missed the date again. Water had come into the hold and a stack of order papers had gone soft as dough. Nyai Gama peeled them apart one by one and spread them on the pepper sacks to dry, reading out figures as she went. “This one, twelve piculs. This one, twenty. The wet paper belongs to the shipowner and so does the loss. I won’t swallow it for him.” Huang said, “Understood. I figured the wind right; I never figured the leak.” He took the bill of damages. A folded slip lay under it. He didn’t open it until he was back aboard. The first line read, “Are you better?” Below it she had written that she had heard from another ship he’d lain sick in Tondo most of the winter, and that he could have sent word; she wasn’t going to hold his cargo over it. He folded the slip and tucked it into his ledger, in the column where the sailing dates went."
news = "Wet order papers lay spread across the Banten quay, and a pepper merchant’s daughter went through them line by line. She would not cover one coin of the loss for the captain from Luzon."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_turning]
title = "Walls at Manila"
text = "Word went round the quay: the Spaniards have raised a walled town at Manila, and the Fujianese merchants of Tondo are moving into it in droves, shops, ships and counting rooms and all. They say a captain who sails to Banten for pepper every year has moved too. On moving day everything else went onto the cart, but he kept the Banten order book inside his coat and never let go of it the whole way. This year’s ship to Banten is likely to be late again. Over in Banten, the pepper merchant’s daughter has spent ten years buying her own ships and setting her own prices. Everyone asks when she means to marry. She tells them one thing: depends on the sailing dates."
news = "The Spaniards have built a town at Manila, and the Fujianese merchants of Tondo are all moving there. A captain who sails to Banten every year may well be late again this time."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_choice]
title = "She Sets the Day"
text = "In ten years Nyai Gama had bought two ships of her own, and prices, sailing dates and delivery days were all hers to say. That day she called me into the counting room. “Which ships between Manila and Banten will sail on the day they promise? Find out for me.” Before I could answer she had a sheet of paper spread out and was writing. Would he care to start a household? If so, the day was hers to set. Lateness was allowed, but how word would be sent when he was late had to be written down before the wedding, and no more vanishing for a month. She blew the ink dry and folded the letter. “I haven’t found anyone to carry it yet.”"
news = "The pepper merchant of Banten has written a letter to Manila, said to be about a wedding date. It even spells out how to send word if he is late."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_choice.default]
news = "The pepper merchant of Banten has set her wedding day. The answer from Manila says he will be there, and that if he is late he will send word first."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_choice.choices.ships]
text = "Find Huang Shouguan a ship at Manila that sails when it says"
reply = "I spent three days working the Manila docks and booked Huang Shouguan a berth on a big Minnan ship. The sailing day was stamped with the shipowner’s seal, and nobody could change it. When he heard the counting room at Banten had sent me asking, he turned the slip over in his fingers for a long time, then took out his ledger and drew a circle beside the sailing-date column. “First time,” he said, “I’ve had a day in this book that was nailed down.”"
news = "Someone on the Manila docks booked a Fujianese captain onto a big ship whose sailing day is sealed on the slip. They say he drew a circle around it in his own ledger."
effects = [{}, {}, {}, { title = "The Circled Sailing Date" }]

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_choice.choices.letter]
text = "Carry Nyai Gama’s letter to Manila ahead of anything else"
reply = "Huang Shouguan finished the letter and asked, “How long did it take her to write this?” I said about as long as a cup of tea takes. He laughed. “It’ll take me a month to answer.” Yet he pulled out a sheet of paper right there and wrote a single word on it, “Yes.” He pressed it into my hand before the ink dried. “Before I get the chance to work out the wind one more time.”"
news = "A Fujianese captain at Manila received a letter from Banten and answered it on the spot with a single word. They say it was the quickest answer he ever gave."
effects = [{}, {}, {}, { title = "The One-Word Reply" }]

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_choice.choices.watch]
text = "Stay out of it and let her mail the letter herself"
reply = "Nyai Gama gave the letter to a passing merchant ship. It was held up on the way and reached Manila a month and a half later. In the counting room at Banten she asked nothing; every morning she simply counted the sails in the harbor. Later it was said that Huang Shouguan read the letter, opened his ledger that same night, and moved his sailing date forward, then forward again."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_together]
title = "The Man She Waited For"
text = "The wedding day came, and Huang Shouguan did not. Nyai Gama opened her shop as usual and weighed pepper as usual, and wrote one line in her ledger: waiting. His message had arrived three days earlier, four words from a small boat: “Late. About a month.” A month on, his ship came in, and before it was even moored he called from the bow, “On time this once—just let me work out the wind!” The whole quay roared. She didn’t laugh. She opened the ledger, moved the agreed day back a month, and wrote beside it the date the message came. That night the two ledgers became one. From then on he was a month late every year, and she waited that extra month every year."
news = "The Banten pepper merchant is married, and the groom turned up a month late. She wasn’t angry; she moved the day back a month and wrote it all down in her ledger."

[tracks.pair_nyai_gama_huang_shouguan.chapters.pair_nyai_gama_huang_shouguan_together.variants.helped]
text = "The wedding day came, and Huang Shouguan did not. Nyai Gama opened her shop as usual and weighed pepper as usual, and wrote one line in her ledger: waiting. Three days later the big Minnan ship with the sealed sailing date came into port. Before it was moored he was shouting from the bow, “On time this once—just let me work out the wind!” The whole quay roared. This time he had a case: the ship had not been late, the wind had. She didn’t laugh. She opened the ledger, moved the agreed day back three days, and wrote: wind three days late, ship not late. That night the two ledgers became one. From then on he came once a year, and however late or early, she had the ledger open and waiting."
