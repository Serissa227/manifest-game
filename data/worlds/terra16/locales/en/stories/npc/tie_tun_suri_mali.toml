[tracks.tie_tun_suri_mali]
name = "A Place for the Elephant to Sleep"

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_meeting]
title = "Come Down First"
text = "That year Bayinnaung of Burma sent to Ayutthaya demanding white elephants, and the court was in such an uproar that nobody could spare a moment for the princess from Johor. So Tun Suri was shown to the elephant stables. She sat on a cow elephant’s back, making her case for troops and rice ships through an interpreter on the far side of the rail, until someone took a firm hold of the reins. “Come down first.” The trainer, Mali, spoke low and slow. “That girth sore hasn’t healed. She’s scared too, so stop shouting.” The princess flushed, broke off mid-sentence, and slid down the elephant’s leg all the same. She bent to look at the rubbed-raw patch under the elephant’s belly and tried out the Siamese the interpreter had taught her: “Does it hurt?” She got one sound wrong, and it came out closer to “Are you hungry?” Mali laughed out loud, then took her through it again, one word at a time. No troops came of it. On the day the princess left, a sack of rice turned up at the stable door. Stitched around its mouth in Malay letters was “Does it hurt?”—spelled with the same wrong sound."
news = "At the Ayutthaya stables, the woman who trains the elephants ordered the princess from Johor down off a cow’s back because of a girth sore. The princess went red and did as she was told."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_turning]
title = "Footprints Going South"
text = "Word of Ayutthaya’s fall traveled south along the coast. The fishermen at the Pattani river mouth say a cow elephant came down from the north a few days ago, led by a Siamese woman whose sandals were worn through. She walked in front; on the elephant’s back were a sack of rice and three children, said to be from the Ayutthaya stables. One fisherman who could read went over for a look at the sack. A line of Malay letters was stitched around its mouth; he read it twice and couldn’t make a sentence of it. “One letter’s sewn wrong,” he said. The woman drew the sack closer, her voice as low as if she were soothing the elephant. “Siamese, sewn in Malay letters. It asks if it hurts. The wrong letter—I know that one.” She settled by the river and went from boat to boat for half a month. Not one would take an elephant."
news = "Fishermen at Pattani say a Siamese woman walked in from the north leading a cow elephant, with three children from the Ayutthaya stables riding on its back."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_choice]
title = "Not a War Elephant"
text = "A Johor merchant ship brought a letter. Mali couldn’t read Malay letters, so she came to find me and asked me to read it to her. There wasn’t a word in it about affairs of state—only which high ground at the mouth of the Johor River stayed dry and which flooded at high tide, and where an elephant could sleep without the water creeping up on her at night. The last line was Siamese spelled out in Malay letters: “Does it hurt?” Mali heard it out and nodded. “She got it right this time.” She folded the letter and tucked it into the rice sack. The cow was afraid of water and wouldn’t take another step toward the small boats. Someone in the harbor had made an offer, though: sell her into the palace war stables and the fare would be paid, with some left over. Mali stroked the elephant’s ear and kept her voice low. “She carries children. She doesn’t carry soldiers.” The three children crouched by the elephant’s legs, all of them looking up at me."
news = "A Siamese woman has been going from ship to ship in Pattani harbor, asking which could carry a cow elephant that fears water, plus three children. She still hasn’t found one."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_choice.default]
news = "The Siamese woman at Pattani with the cow elephant gave up waiting for a ship. She set off south down the peninsula on foot with three children, saying she was bound for Johor."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_choice.choices.send_ship]
text = "Take Mali, the elephant and the three children to Johor on my ship."
reply = "We emptied the hold and laid down three layers of dry straw. The elephant shook from trunk to tail on the gangplank, and Mali hummed into her ear all night; the children said it was the tune the Ayutthaya stables used to settle calves. On the fourth day we entered the Johor River, and from a long way off I could see Tun Suri standing knee-deep in the water, her sarong hitched up in one hand and a basket of rice on her other arm."
news = "A ship at Pattani cleared its whole hold and sailed for Johor carrying a trembling cow elephant, three children and the Siamese woman who leads it."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_choice.choices.stable_land]
text = "Go to Johor first and secure that high ground at the river mouth for a stable."
reply = "The landowner’s opening price would have bought a second elephant. I sat chewing betel with him all afternoon and talked it down by half. Tun Suri snapped off a twig there and then and drew the stable’s four posts in the dirt. Then she stopped, coloring to the ears. “The price… I never asked Mali whether it suits her.” That night she wrote another letter to Pattani, ending with the same line as before."
news = "Somebody has secured that high ground at the mouth of the Johor River for half the asking price. Word is it’s for an elephant stable—and the elephant is still up in Pattani."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_landing]
title = "High Ground at the River Mouth"
text = "Three months on the road, and when the elephant stepped onto the mudflats at the mouth of the Johor River her ears hung slack; she was spent. Mali rode on her neck, the three children slumped on the rice sack behind her. This time it was Tun Suri standing below, looking up. “Come down first.” Mali slid down. The princess reached first for the old girth sore, long since scarred over, and only then looked at Mali. “Does it hurt?” Not a sound out of place this time. “My feet.” The princess turned and told her people to cook rice for the children first, then knelt in the mud and started untying Mali’s sandals. Someone behind her coughed. She went red and kept working at the knots. “From now on, whatever hurts, you tell me first.” “Three months of walking,” Mali said, looking down at her, “and that was all I wanted to hear.” That night the two of them raised the first stable on the high ground. The elephant lay down on her side and began to snore, and they sat on the fresh straw and listened to her the whole night through."
news = "A Siamese cow elephant has turned up at the mouth of the Johor River. The princess spent all night building it a stable on the high ground, and the Siamese woman who led it in stayed up with her."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_landing.default]
effects = [{ }, { }, { title = "High Ground at the River Mouth" }]

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_landing.variants.helped]
text = "The ship had beaten the overland road by more than two months. The elephant came down the gangplank into the shallows with Mali on her neck, humming into her ear the whole way; the three children jumped down round-cheeked, not one of them sick. Tun Suri stood knee-deep in the water and looked up. “Come down first.” Mali slid down. The princess reached first for the old girth sore, long since scarred over, and only then looked at Mali. “Does it hurt?” Not a sound out of place this time. “My head. Four days at sea, and I was sick for three.” The princess sent her people to cook rice for the children, then took Mali by the arm and walked her, one step at a time, up into the shade on the high ground. Someone behind them coughed. She went red and didn’t let go. “From now on, whenever you’re unwell, you tell me first.” “Every time I was sick over the rail,” Mali said, “I was thinking of you saying that.” That night the two of them raised the first stable on the high ground. The elephant lay down on her side and began to snore, and they sat on the fresh straw and listened to her the whole night through."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_landing.variants.stable]
text = "Three months on the road before the elephant stepped onto the mudflats at the mouth of the Johor River. Up on the high ground the stable’s four posts were already standing, each carved with the same Siamese words in Malay letters—the line Mali had taught the princess word by word, back in Ayutthaya. Mali couldn’t read, but she knew that shape: she had seen it stitched around a rice sack and written at the foot of a letter. This time it was Tun Suri standing below, looking up. “Come down first.” Mali slid down. The princess touched the old girth sore first, then looked at Mali. “Does it hurt?” “My feet,” said Mali. The princess knelt in the mud and untied her sandals, and let her people cough behind her all they liked. “From now on, whatever hurts, you tell me first.” “Three months of walking,” Mali said, looking down at her, “and that was all I wanted to hear.” That night the two of them put a roof on the four posts. The elephant lay down on her side and began to snore, and they sat on the fresh straw and listened to her the whole night through."

[tracks.tie_tun_suri_mali.chapters.tie_tun_suri_mali_epilogue]
title = "Upriver Together"
text = "The year the Portuguese stormed Johor’s old capital, the court fell back upriver, and the stables went first. The old cow elephant was long gone; it was her daughter carrying the loads now. Mali climbed the bank ahead of everyone to look at the ground, crouched to feel the soil, then watched the elephant’s ears. “This is high enough. She’ll sleep here.” Tun Suri came behind her, spreading straw. One of the new attendants brought up the old story: thirteen years ago, hadn’t the princess nearly sailed with the Queen of Jepara’s fleet to attack Malacca? “Nearly,” Mali said slowly. “Her Highness was shouting louder than anyone on the quay. I dragged her back.” “The queen herself didn’t even sail with it.” Tun Suri had gone red, but her hands kept working the straw. “What would I have been doing there?” When the straw was down, she took a stick of charcoal and wrote the rations on the stable post: so many sacks of rice, so many baskets of salt, so many mouths. The last line was the same as ever: “If we want to go back, first make sure everyone with us has eaten.”"
news = "Johor’s old capital has fallen and the court is moving upriver. The stables lead the way: a cow elephant in front, and those two women behind her, one choosing the ground and one laying the straw."

