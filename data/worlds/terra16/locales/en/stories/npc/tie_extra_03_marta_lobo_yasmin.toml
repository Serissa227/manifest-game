# C7：tie_extra_03_marta_lobo_yasmin 的英文显示覆盖（嵌套表，按轨道、章节、选项 key 对应）；不含玩法字段。

[tracks.tie_extra_03_marta_lobo_yasmin]
name = "The Blue on the Chart"

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_meeting]
title = "Too Dear a Blue"
text = "The secretary who promised to buy it is late, so Marta spreads the chart of the Strait of Hormuz she has brought from Goa across the long table in the governor’s painting room and pins the top edge with two brass weights. The new Persian painter leans out from behind her dishes of pigment and takes one look. “The coastline is good,” says Yasmin. “But the whole sheet looks underfed.” Marta doesn’t look at her. She looks at the border Yasmin has just finished: vines, gold thread, and in one corner a little boatman turning his head to gaze out of the picture. “You’re wasting lapis where it does no good.” “He’s looking at your sea,” Yasmin says, in no hurry at all. “It’s too pale. He can’t see it.” Her finger hovers over the lower right corner of the chart without touching the paper. “This corner is kept for a name. Where’s yours?” Marta doesn’t answer. She picks up one of the weights and sets it down squarely on that corner. By nightfall the secretary still hasn’t come. When Marta leaves, chart and weights stay on the table. “I’m not paying for the paint.”"
news = "In the painting room at the governor’s house in Hormuz, a chartmaker from Goa and a Persian painter argued all afternoon over the blue on a chart. The chart didn’t sell. The chartmaker left it behind and said she wouldn’t pay one larin toward the paint."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_turning]
title = "The Scraped Line"
text = "Down on the waterfront someone has a gilded chart laid out on an upturned fish basket. “Old work, maker unknown,” he says, and wants three times the price of a new one. The strait is drawn true, and the gold in the border catches the eye. An apprentice from the governor’s painting room walks by and knows that blue at once. When he tells the others, they all remember: the Persian painter colored that chart with paint she bought herself and left it on the painting-room wall all winter to dry, and by spring it was gone. Its lower right corner held two names, one line in Persian script and one in wobbly Portuguese letters, as if traced by someone who couldn’t write that hand. Both lines have been scraped away with a knife, the paper worn so thin the light shows through. Marta happens to be over from Goa again that season. She hears the story and heads straight for the docks. “They scrape off the names and put up the price.” Yasmin catches her by the sleeve. “What’s scraped off can be written again.”"
news = "A man on the Hormuz waterfront is selling a gilded chart as old work by nobody in particular, at three times the going rate. People at the governor’s painting room say the thin, scraped patch in its corner used to hold two names."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_closer]
title = "Half Each"
text = "The two of them clear the table at the back of the painting room and settle the rules first. Marta draws a charcoal line down the middle of the tabletop. “The coastline is mine. Look all you like, but keep your hands off.” “The border and the colors are mine,” says Yasmin, setting out her dishes in a row. “And you don’t say a word about them.” Two days pass in peace. On the evening of the third, Marta eyes the dish of blue Yasmin has just mixed and can’t help herself. “That blue costs too much.” Yasmin doesn’t answer back. She dips the tip of her brush in lapis, reaches across the charcoal line, and sets down one dot, no bigger than a grain of rice, just off the cape Marta has drawn. Marta looks at it for a long time. Then she opens her book of soundings and runs a finger down a column of figures until it stops. “…It really is deep water there.”"
news = "In the governor’s painting room at Hormuz, two women spent the summer at one table, one drawing coasts and the other laying on color. They bickered their way through the first chart and left two spaces free in its corner."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_choice]
title = "A Buyer Who Keeps the Names"
text = "Two new charts stand rolled in an oilcloth tube against the doorframe of the painting room. Yasmin wrote both names in the lower right corners; Marta’s she traced from the signature on a receipt, stroke for stroke. Marta will sell only to someone who won’t scrape the names off. The day before yesterday a buyer from Muscat asked, “Could the corner come off?” and she showed him and his offer the door. “You won’t find three people like that in Hormuz,” says Yasmin. “Then find three,” says Marta. Yasmin rolls the charts tight, ties them with a silk thread and turns to me. “You’ve seen more ports than we have. Do you know anyone like that?”"
news = "Two women are selling charts on the Hormuz waterfront, and a buyer has to promise first not to scrape the names off the corner. Anyone who won’t doesn’t even get to haggle."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_choice.default]
news = "Two women stood over two rolled charts on the Hormuz waterfront all winter and sold only one. The buyer swore he would leave the names alone; word is he scraped off half a line before he sold it on."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_choice.choices.honest_buyer]
text = "Take the charts to the old merchant from Shiraz. Not one book he owns has had the copyist’s name scraped off."
reply = "The old merchant spreads the chart across his knees, leans in close and reads the two names aloud, one sound at a time. At Yasmin’s he looks up and asks whether she is from Shiraz. “When I buy a chart, I buy the names with it.” He pays for both on the spot and orders a third, to run from Hormuz all the way to Basra. On the walk back to the painting room Marta says only, “He got my surname wrong.” Yasmin says, “Then write the next one yourself.”"
news = "An old merchant from Shiraz bought two charts on the Hormuz waterfront, read out the names in the corner for all to hear, and ordered another that runs to Basra."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_choice.choices.to_goa]
text = "Take one to Goa on my ship and let Marta’s counting house sell it."
reply = "The chart sails with me to Goa. Two months later a letter comes back from the one who keeps the books there: it fetched a good price from a captain on the Cochin run, who promised to hang it in his cabin, names and all. At the foot of the letter, on a line of its own in smaller writing, is a note for whoever laid on the color: “The blue was well spent.” Marta reads that line twice before she hands the letter to Yasmin."
news = "A chart from the Hormuz painting room went to Goa by ship and fetched a good price, they say, from a captain on the Cochin run. Not one name was scraped off."

[tracks.tie_extra_03_marta_lobo_yasmin.chapters.tie_extra_03_marta_lobo_yasmin_landing]
title = "Two Names"
text = "The new chart is finished, running from Hormuz around to the far side of Qeshm. Yasmin holds out the pen, handle toward Marta. Marta takes it and writes her name in the lower right corner. She has drawn charts for other people for thirty years, and this is the first time she has put her own name to one of her own. The letters are tiny, squeezed into the corner as if afraid of being seen. Yasmin signs beside it, twice as large, and lets the last stroke trail into the border, right at the feet of the little boatman. There is always one in her borders, turning to gaze out of the picture. Marta looks at the two names, then at the dish of blue. “That blue costs too much.” “Names don’t,” says Yasmin, moving the sheet under the window to dry. “Where do we draw next season?” “Two a season.” Marta tucks the charcoal into her sleeve. “One goes back to Goa with me. One stays in Hormuz.”"
news = "Charts from the governor’s painting room in Hormuz now carry two women’s names in the corner, one signed very small and one very large. They make two a season, and one goes by ship to Goa."

