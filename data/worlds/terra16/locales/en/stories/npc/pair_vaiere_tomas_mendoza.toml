# The Island She Will Not Mark (pair_vaiere_tomas_mendoza) — English display overlay: nested by track, chapter, choice and variant key; display text only, no gameplay.
# The effects arrays line up by index with the Chinese file; only memory titles need text, every other slot is an empty table.

[tracks.pair_vaiere_tomas_mendoza]
name = "The Island She Will Not Mark"

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_meeting]
title = "Water First"
text = "Out past the reef a man was clinging to a ship’s plank, going under and coming up again. Vaiere paddled over, hooked his belt with the blade of her paddle and hauled him over the side. He coughed up half the sea, and his first words on opening his eyes were, “Where is this? Which way is the island?” His hand was already scrabbling inside his shirt, and it came out with a sodden logbook. She pushed a coconut-shell bowl against his mouth. “Your ship has been two days off course and you don’t even know it. Sit up, don’t talk, and listen.” He got half the water down before he saw what he was sitting in. It was a canoe, and the lashings along the gunwale were new, still wet, pulled hard. “I finished mending her last night.” She rapped the side with her paddle. “Know where you’re sitting before you ask where the island is. Can you hear which way the swell is coming from?” Tomás shut the logbook, put his pen away and turned his ear to the water."
news = "The star-navigator of Matavai Bay fished a stranger out from beyond the reef, clinging to a plank. They say the first thing he asked on waking was where the island lay, and she shut him up with a bowl of water."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_closer]
title = "The Line He Left Unwritten"
text = "That night Vaiere laid a ring of pebbles on the sand, one for each place a star comes up. Tomás squatted to look and wrote as he went, and while he wrote he told her about the route home: north from the Philippines, far up, then east on the wind all the way to Mexico. It was in the books now. “A road in a book doesn’t mean the whole sea belongs to the chart.” She nudged one pebble with her toe. “Remember this one. Not that one.” “I can’t put a name to this star.” “Then remember where it rises.” He wrote them down one by one until he reached the last line, the one where he ought to have set down where this island lay. His pen stopped, and nothing touched the page. He closed the logbook without explaining. Vaiere watched him close it, set the last pebble in the ring, and smiled at him for the first time."
news = "The foreign pilot at Matavai Bay is learning the stars from the navigator there. They say there is one line in his logbook he has never filled in."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_choice]
title = "Her Course"
text = "I brought my ship into Matavai Bay and found Tomás and Vaiere standing beside a small boat dragged up the sand. It had been built from the wreckage that washed ashore from his ship, with half its nails rusted through and her coconut fiber stuffed into the seams. “This boat can go out to open water now.” Vaiere slapped the gunwale. “I’ll tell you the way. When you go is yours to decide. If you go, I won’t stop you. If you stay, you say plainly that it’s because you want to.” Tomás wiped his hands on his sleeve before he spoke. “I’d like to keep learning from you.” He looked straight at her. “You lead this stretch, and I’ll keep the record.” Vaiere neither nodded nor shook her head. Her eyes came around to me."
news = "The foreign pilot at Matavai Bay is about to leave. They say the star-navigator gave him a way out and then let him stay another season."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_choice.choices.materials]
text = "Unload timber and iron nails in the bay so he can leave whenever he likes"
reply = "I unloaded the timber in the bay and tipped the iron nails out in a small heap. Vaiere nudged them with her foot and made a face at how they bristled. “My canoe doesn’t need these.” “My boat does.” Tomás was already crouching to count them. They argued half the afternoon over whether one seam should be nailed or lashed, and in the end the boat’s port side got nails and the starboard side got her cord. When they finished, Tomás looked at the starboard lashing for a long time and said it held better than the nails. She didn’t answer. She trimmed the loose end of the cord an inch shorter."
effects = [{}, {}, {}, { title = "Half Nails, Half Cord" }]

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_choice.choices.oath]
text = "Ask Tomás to swear before her never to draw the island, even after he leaves"
reply = "Tomás swore nothing. He opened his logbook and tore out the page from the night of the stars, the one with the last line unwritten, and held it out to Vaiere. “There’s no island on this page. There won’t be.” She didn’t reach for it. She looked at me first, as if to ask whose idea this had been. After a while she took it, folded it once, put it in a little box of fishhooks in the canoe and shut the lid. “It stays there,” she told Tomás. “Come and get it yourself if you ever want it.”"
effects = [{}, {}, {}, { title = "The Page with No Island" }]

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_choice.choices.watch]
text = "Step aside and watch how she decides"
reply = "I stepped back and said nothing. Vaiere waited a moment, then pointed her arm at the western sea. “When the wind turns, I’ll lead you a stretch. How far is mine to say.” Tomás asked whether she could at least tell him how long it would take. “Until I say stop.” She turned to untie the canoe. “Bring the logbook tonight. I talk, you listen.”"

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_together]
title = "The Steering Paddle Is Hers"
text = "The night before they sailed west, Vaiere paddled the canoe out to the middle of the lagoon and let the swell carry it, and they lay on their backs looking at the stars. “Where this island lies. I’m telling you now.” She said it like an order. “No pen.” Tomás pushed the logbook to the stern. She leaned to his ear and gave it to him star by star, swell by swell, and then said, “Again.” He got one place wrong and she pinched his ear. “Again.” By the third time he had not missed a word. “Good.” She looked up at the sky. “Now you may kiss me.” He kissed her, and she kissed him back, longer than he did. At dawn she dipped the paddle in the water without turning her head. “Sit in front.”"
news = "The star-navigator of Matavai Bay is taking the foreign pilot west. They say she kept the steering paddle in her own hands the whole time."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_turning]
title = "The Pilot Who Came Back"
text = "The Spaniards had only just raised walls at Manila when the taverns started talking about a strange thing. A pilot had turned up in the city whose name had been crossed off the missing list two years before. He was burned dark as an islander, with a cord of braided coconut fiber around his wrist, and his logbook, soaked once and dried hard, was stiff as bark. The clerk asked where he had come to grief, and he said only, “South.” Pressed, he opened the logbook and held it out. One line had been left unwritten, and he made no move to fill it. They say the canoe that brought him back never touched the shore. At daybreak all anyone saw was a streak of white water out beyond the point."
news = "A pilot reported lost two years ago has turned up in new Manila, browned like an islander. Asked where he was wrecked, he says only “South.”"

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_epilogue]
title = "The Anchorage at Guam"
text = "At the anchorage of Umatac the galleon had stopped for water, and cask after cask went up on its ropes. Tomás stood at the rail and watched the southern sea all afternoon. At dusk a double-hulled canoe came out of the swell from the south, its sail old, Vaiere at the steering paddle. She did not board. She brought the canoe alongside, under the rail, and tipped her face up. “Coming with me for a stretch this time?” The sailors leaned out to look, and an old helmsman held up three fingers: three years since the last time. Tomás called to the first mate, “Lend me ten days!” The mate waved a hand. The ship would be sitting there for ten days anyway. He went down the rope ladder and dropped into the canoe. “What about that line?” She glanced at the logbook inside his shirt. “Still not written.” “Keep it that way.” She already had the paddle in the water."
news = "At dusk a double canoe from the south slid into the anchorage at Umatac on Guam, a woman at its helm, and the pilot of the galleon went down to join her."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_epilogue.variants.v1_matched]
text = "At the anchorage of Umatac the galleon had stopped for water, and cask after cask went up on its ropes. Tomás stood at the rail and watched the southern sea all afternoon. At dusk a double-hulled canoe came out of the swell from the south, its sail old, Vaiere at the steering paddle. She did not board. She brought the canoe alongside, under the rail, and tipped her face up. “Coming with me for a stretch this time?” The sailors leaned out to look, and an old helmsman held up three fingers: three years since the last time. Tomás called to the first mate, “Lend me ten days!” The mate waved a hand. The ship would be sitting there for ten days anyway. He went down the rope ladder and dropped into the canoe, the logbook in his shirt with one page torn raggedly out. “The page is still there.” She tapped the little box of fishhooks with the tip of her paddle. “And that line?” “Still not written.” “Keep it that way.” She already had the paddle in the water."

[tracks.pair_vaiere_tomas_mendoza.chapters.pair_vaiere_tomas_mendoza_epilogue.variants.v2_helped]
text = "At the anchorage of Umatac the galleon had stopped for water, and cask after cask went up on its ropes. Tomás stood at the rail and watched the southern sea all afternoon. At dusk a double-hulled canoe came out of the swell from the south, its sail old, Vaiere at the steering paddle. She did not board. She brought the canoe alongside, under the rail, and tipped her face up. “Coming with me for a stretch this time?” The sailors leaned out to look, and an old helmsman held up three fingers: three years since the last time. Tomás called to the first mate, “Lend me ten days!” The mate waved a hand. The ship would be sitting there for ten days anyway. He went down the rope ladder and dropped into the canoe, and saw at once that an iron nail was caught in the lashing at the stern, rusted red. “Left over from that year.” She didn’t turn her head. “Looser than cord, but I kept it. And that line?” “Still not written.” “Keep it that way.” She already had the paddle in the water."
