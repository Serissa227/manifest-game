[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_meeting]
title = "A Price Outside the Feast"
text = "The datu’s feast was laid out by the river mouth, gongs sounding one after another. The scribe of the Ryukyuan ship, Kinjō Shin, stood at the edge of the mats and called out the islands along the route in time with the gongs: “Miyako, Yaeyama, Yonaguni, Batan, Babuyan—” Not one wrong, and hardly anyone listening. He slipped outside for air, still reciting under his breath. On the stone steps a ring of boatmen squatted around a young man with the narrow blue border of a cadet branch sewn along his collar, who was squatting in the mud himself and counting copper coins into their hands one by one. “Put it on the account, young master,” said the old boatman. “Cash,” the young man said, slapping the last coin into the old boatman’s palm. “Count it before you touch an oar.” Then he brushed the mud off his knees and went laughing to the Ryukyuan steward at the ship’s side, and in three sentences knocked a fifth off the price. Shin was waiting when he came back. “Where I come from we say, learn the island first, then the flag. Here, it seems, you learn the boatmen first.” “Hear the boatmen first.” The young man grinned. “Lakan.” “Kinjō Shin. Seventy-two coins. I counted.”"
news = "A Ryukyuan ship has put in at the Tondo river mouth. At the datu’s feast the ship’s scribe recited island names by the dozen, while outside a cadet-branch young master squatted by the river and paid the boatmen cash before he went to haggle over the cargo."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_closer]
title = "Learning the Tide Together"
text = "The Ryukyuan ship came again. Lakan rowed Shin out in a small boat to learn the tides of Manila Bay. “The east end drains fast. One falling tide and it’s all mud. That reef to the north sinks out of sight when the water is full, and deep-draft ships love to run onto it.” Shin set it all down in his notebook, line after line. Lakan glanced over, snatched the brush, and added a line in the margin, in a hand like a crab walking: East end drains fast. That night the boat lay out in the middle of the bay, with the lights along the shore dotted here and there. Shin said suddenly, “When I was seventeen, on a night passage, I took a fisherman’s fire for the harbor light and called out, ‘We’re in.’ The helmsman dropped the lead line. We were half a hull-length from the reef. I’ve never told anyone. Everyone praises my sense of direction, and every time I hear it I think of that light.” Lakan didn’t laugh. He pointed to a single spark of light far out on the water. “And that one?” Shin looked for a long time. “…A fisherman’s fire.” “Then you got it right this time.” Lakan held out the oar. “Go and have a look.”"
news = "A small boat lay out in the middle of Manila Bay all night. The two men in her named the lights one by one until dawn, then rowed home to Tondo."

