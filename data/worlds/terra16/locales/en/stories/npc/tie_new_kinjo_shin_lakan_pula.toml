[tracks.tie_new_kinjo_shin_lakan_pula_side.chapters.side]
title = "Learn the Island First, Then the Flag"
text = "The Chinese junk lay at Naha quay for three days before anyone remembered the bundle of letters pressed down in her hold. The oilcloth came off layer by layer, and there was Lakan’s hand, ugly but legible enough: he was alive, Tondo had a new master, he was still down at the river mouth haggling for the boatmen. At the end he had written, “Next time a Ryukyuan ship comes, I’ll haggle the price for you, and I’ll pay the boatmen first.” Shin copied the letter into the clerk’s register, turned to the line for Tondo and added Lakan’s name beside it, larger than the writing around it. The steward, passing, glanced over. “What do you want that in there for?” “If a ship goes south again,” Shin said, closing the book, “this is the man to learn first.”"
news = "The clerk’s son, Kinjō Shin, at Naha harbor has had a letter from Luzon and added a name beside the Tondo line in his register; the steward asked him what he wanted it there for."

