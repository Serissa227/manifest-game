[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_landing.variants.helped]
text = "A Chinese junk came into Naha from Luzon. A boatman held up an oilcloth bundle on the quay and shouted, “Which of you is Clerk Kinjō?” Shin unwrapped it. The handwriting was awful, every line crooked, but the island names were all correct. Lakan was alive, Tondo had a new master, and he was still down at the river mouth haggling for the boatmen. Then came a line of small characters: “That sheet of paper you wrote in the cabin, I took it to Bangkusay and brought it back. The water has softened it, but the words are still readable.” Shin read that, pressed the letter to his chest, and stood there a while. The last line: “Next time you come, look for me first.” The official ships no longer sailed south; for the next ten years only the Chinese junks would carry letters. He copied it into the register, then asked the next junk bound south to take a reply, written in the margin of the original, a single line: “You first, then the island, then the flag.”"

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_landing.variants.matched]
text = "A Chinese junk came into Naha from Luzon. A boatman held up an oilcloth bundle on the quay and shouted, “Which of you is Clerk Kinjō?” Shin unwrapped it. The handwriting was as bad as ever, but the island names were all correct. He read it twice, the second time slowly. It said Tondo had a new master and Lakan was still down at the river mouth haggling for the boatmen. At the very bottom of the notebook lay the other letter, the one I had carried from Tondo last year, just a single sentence. This was the second. The last line: “Next time you come, look for me first.” The official ships no longer sailed south; for the next ten years only the Chinese junks would carry letters. Shin laid the two side by side, copied the new one into the register, and asked the next junk bound south to take a reply, written in the margin of the original, a single line: “You first, then the island, then the flag.”"

