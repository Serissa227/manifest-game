[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_turning]
title = "The Last Voyage South"
text = "In the shipyard at Naha the old storekeeper sighed as he checked the cables. “The official ship to the southern seas—this trip may well be the last one. Trade down south is worse every year, and the palace stopped wanting to send ships long ago.” The rope seller put in, “The clerk’s boy is still going aboard, though.” “I told him not to,” the old man said. “He slapped his notebook down under my nose: the tides of Manila Bay, two hands on one page, one neat, one like a crab walking. ‘East end drains fast,’ he read out. ‘Lakan of Tondo wrote that. I promised him I’d be there by spring.’” The rope seller shook his head. “He writes down every promise he makes.” The north wind rose, and the ship ran south before it."
news = "They say at Naha harbor that this may be the last official ship south, the palace being unwilling to send another; the clerk’s son went aboard all the same, saying he had given his word."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_choice]
title = "The Ship Must Go"
text = "Beyond the mouth of the bay the Spanish ships lay in a long line. Tondo’s war boats had torches lit at the river mouth, ready to go and block them at Bangkusay, and Lakan’s family had boats among them. The steward of the Ryukyuan ship stuck a stick of incense in the gunwale. “Just this one tide. When it burns down, we weigh anchor. We have to be out of the bay before the fighting starts.” Shin stood in the bow and Lakan on the quay, a stretch of retreating water between them, the torches’ reflections swaying on the mud. “Lakan!” Shin shouted. “Learn the island first, then the flag. This time I can’t make out either!” Lakan stood gripping a wooden shield, not laughing. “What can’t you make out?” Shin opened his mouth. His notebook had everything in it except this page. They both turned at once to look at the ship moored beside the river mouth. Mine."
news = "The Spanish ships lie in a line off Manila Bay and Tondo’s war boats have torches lit at the river mouth; the steward of the Ryukyuan ship says he will wait for this one tide and no more."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_choice.default]
news = "Tondo’s war boats went out of the river mouth to Bangkusay, and the Ryukyuan ship left the day before the fighting; on the quay one man kept a hand raised until the ship was out of sight."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_choice.choices.hold_tide]
text = "Moor my ship in the river mouth to hold the channel, and ask the steward for one more tide."
reply = "I swung my ship across the channel and called over to the Ryukyuan ship: “Give me one more tide. I’ll hold the river mouth for you, and at daybreak I’ll lead you out of the bay myself.” The steward cursed for a good while, then lit a fresh stick of incense. When the tide had turned, Lakan rowed his small boat alongside and climbed down into the cabin. The lamp in the Ryukyuan cabin burned all night. I stayed on my own deck listening to the water lap the planks, and across the stretch of water all I could hear was one low voice reciting something a word at a time—island names, it sounded like. At daybreak Lakan had a folded sheet of paper tucked in his belt, its edges neat and square, the kind from a clerk’s register. He dropped back into the small boat and raised a hand to me. “I owe you a tide.” The boat merged into the torchlight at the river mouth and headed for Bangkusay. Shin gripped the rail and watched until there was nothing left to see."
news = "At the Tondo river mouth a merchantman lay across the channel all night and won the Ryukyuan ship one more tide; the datu’s cadet-branch young master spent that night aboard the Ryukyuan ship and came down at daybreak."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_choice.choices.carry_letter]
text = "Promise Lakan: once the fighting is over, I’ll carry a letter for him to Naha."
reply = "Lakan nodded to me from the quay. “I’ll write it when I’m back. My handwriting is bad, so don’t laugh.” Then he turned to board a war boat. The Ryukyuan ship slipped away on the ebb. At Bangkusay, Tondo lost. Lakan came back alive, his left arm wrapped in cloth, and stood beside my ship holding up a letter. It held a single sentence: “Hear the boatmen first, and the boatmen say there will be Chinese ships next year.” I carried it to Naha and put it in Shin’s hand. He looked at it for a long time. “Is his handwriting still that bad?” “Still.” He slid the letter in at the very bottom of his notebook."
news = "Tondo lost the fight at Bangkusay; the datu’s cadet-branch young master came home alive and gave a merchantman a one-line letter for Naha."

[tracks.tie_new_kinjo_shin_lakan_pula.chapters.tie_new_kinjo_shin_lakan_pula_landing]
title = "What the Chinese Junk Brought"
text = "A Chinese junk came into Naha from Luzon. A boatman held up an oilcloth bundle on the quay and shouted, “Which of you is Clerk Kinjō?” Shin unwrapped it. The handwriting was awful, every line crooked, but the island names were all correct: Babuyan, Batan, Yonaguni, Yaeyama, laid out all the way back to Naha as if someone had walked a finger along a chart. He read it twice, the second time slowly, as if reciting islands. Below the names came the real news. Lakan was alive, Tondo had a new master, and he was still down at the river mouth haggling for the boatmen. The last line: “Next time you come, look for me first.” The official ships no longer sailed south; for the next ten years only the Chinese junks would carry letters. Shin copied it into the clerk’s register, then asked the next junk bound south to take a reply. He wrote it there and then in the margin of the original, a single line: “You first, then the island, then the flag.”"
news = "A Chinese junk back from Luzon has brought a letter to Naha harbor in an oilcloth wrapping; the clerk’s son, Kinjō Shin, read it twice, copied it into the register and sent a reply by the next junk."

