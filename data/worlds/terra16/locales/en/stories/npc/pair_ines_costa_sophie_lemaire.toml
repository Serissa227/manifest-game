[tracks.pair_ines_costa_sophie_lemaire]
name = "One Poem, Passed Back and Forth"

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_meeting]
title = "Half a Line of Portuguese Sea"
text = "After the Laurel school opened, the girls’ poetry circle moved into a borrowed attic; this was its second meeting up there. When the book came to Inês she wrote half a line, as always, in Portuguese: “The sea comes up from the mouth of the Tagus all the way to here—” Then she slid it aside, her voice so soft she might have been afraid of waking someone. “The other half of the line is yours.” She had meant it for the girl across from her, but Sophie, in the back row by the door, reached over first, took the book and answered in French with a line of rain: rain falling on the roofs of Lille. Someone laughed. A sea and a rain, two languages, not a rhyme between them. Inês went red and picked up her pen to strike out her half. Sophie pinned the page down. “That’s not what you said last time. You said anyone could write in the circle’s book.” Inês’s pen hung in the air and never came down. It was the first time she had let her accent stay on the page. When the meeting broke up, the book was left between two chairs. Inês reached for it; so did Sophie. Their hands bumped on the cover."
news = "In that girls’ poetry circle in Antwerp the book goes one line Portuguese, one line French. Read aloud, it sounds like two boats calling to each other across the river."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_closer]
title = "A Line Apiece"
text = "For half a year the book had gone back and forth between them once a week, one line each, still the same poem from last autumn. That day, after the meeting, Inês caught Sophie at the top of the attic stairs and asked for last week’s line back. “It came out wrong. Let me think it over and write another.” Sophie didn’t take the book. She shut her eyes and recited the line word for word. Then, eyes still closed, she recited half a line more: “The chair by the door is empty today.” Sophie had been sick for three days the month before, and Inês had written that half line and then put a stroke through it. Inês went red from her neck to the tips of her ears. “You remember the ones I cross out?” “You wrote those too.” Sophie closed the book, pushed it back into her arms and started down the stairs. On the third step she looked back."
news = "Two schoolgirls in Antwerp have been adding to the same poem for half a year, one only in Portuguese, the other only in French, and neither will write the last line."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_together]
title = "Line One Hundred"
text = "The poem had reached its hundredth line and its third book. Inês finished copying the day’s cargo lists for her father’s office, ink still on her cuff, and went to wait in the lee of the dock warehouses on the Scheldt. Sophie brought the new book. On its first page was a single half line, copied over from the old book in Sophie’s hand: I want to keep going. “Finish this one yourself,” Sophie said, holding out the pen. “Not half a line.” Inês held the pen over the paper until it shook a small blot loose. “I… let me think it over.” “You’ve been thinking it over for five years.” Sophie took the pen back and wrote a very short line of French under the half line: Moi aussi. Me too. Inês stared at the two words. “That isn’t a poem.” “It is.” Sophie closed the book. “The rest we can write a little at a time.” The wind off the river rattled the warehouse door. Inês rose on her toes and kissed her, very lightly, then looked straight down at the book, her ears as red as they used to get in the attic."
news = "Behind the dock warehouses in Antwerp, two young women often read poems out of one book—one with a Portuguese accent, one with a Lille accent—and end up laughing halfway through."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_turning]
title = "The Night at the Cathedral"
text = "On the night of August twentieth a crowd poured into the Cathedral of Our Lady. Afterward the old street sweeper said he hauled three cartloads of plaster and gold leaf off the steps. For days the only talk in town was of ships. Families who had come from Lille and Tournai went down to the docks one after another asking for passage north, to Emden or anywhere else, and the fares changed by the day. The Portuguese merchants’ secretary had a letter from Lisbon calling him and his household home. The herring woman said she had passed the secretary’s house one evening and seen his daughter sitting under the window with a little pair of scissors, unpicking an old notebook stitch by stitch until it came apart in two halves: one on the windowsill, one held against her chest. “I’ve seen that book,” the woman said. “There’s a girl with a Lille accent who used to read it with her.”"
news = "Since the night they smashed up Our Lady’s, every Lille family in Antwerp has been asking after ships to Emden, and the Portuguese secretary’s house is packing up for Lisbon."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_choice]
title = "Two Berths, Three People"
text = "Inês’s family would sail for Lisbon after the New Year. Her father’s office had booked two berths on a Hanseatic freighter bound for Emden, meant for the clerks staying behind in the north to collect debts. Inês slapped both tickets on the table and pushed them toward Sophie. “I’ll talk to Father about the clerks.” Sophie didn’t touch them. “Your family needs to get out too.” “My family is taking another ship.” “Another ship,” Sophie repeated, one word at a time. “Last month you said the ship your family is waiting for hasn’t even been booked.” Inês fell silent. Two tickets, and Sophie’s family was three: Sophie, her mother and a younger brother. The circle’s book lay open on the table, its stitching gone, split into two halves with the tickets between them. Neither of them would look at the other. Together they turned and looked at me."
news = "The Portuguese secretary’s house in Antwerp is going back to Lisbon. His office booked two berths to Emden, and his daughter has taken the tickets over to a Lille family."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_choice.default]
news = "The Portuguese secretary’s daughter gave two berths to Emden to a Lille family. Their youngest is going overland with relatives, and she’s sailing home to Lisbon with her own people."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_choice.choices.third_berth]
text = "Find the Hanseatic captain at the docks and get one more berth for Sophie’s brother."
reply = "The captain counted it out for me on his fingers: there wasn’t room in the hold for a goat. I pledged him the freight on a crate from my next cargo, and only then did he clear half a bunk behind the hold partition. When I got back, Sophie was waiting at the door. She lowered her head and said “thank you,” fast, as if afraid someone might overhear. Inês sat at the table trimming the loose threads on both halves with her scissors, one by one. When she was done she pushed one half across. “Yours.”"
news = "That Hanseatic ship bound for Emden: the captain took a crate’s worth of freight money and squeezed a Lille boy in behind the hold partition."
effects = [{ }, { }, { }, { title = "The Third Berth" }]

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_choice.choices.carry_half]
text = "Promise them that from now on I’ll carry the two halves between their cities."
reply = "Inês thought it over, then put the half she was taking to Lisbon into my hands. “Once she’s settled in Emden, take it to her for me.” Sophie turned to its last page and wrote an address: the back room of a cloth merchant’s. Under it she added, “Knock three times, not two.” I wrapped the book in oilcloth and tied it twice. Inês watched me finish, then reached over and gave the cord one more tug. “It rains a lot up north.”"
news = "A ship’s captain on the Antwerp docks has taken charge of an old notebook in oilcloth. He says he’ll carry it back and forth between Lisbon and Emden for two young women."
effects = [{ }, { }, { }, { title = "Half a Book of Poems" }]

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_choice.choices.see_off]
text = "Stay out of the ticket business and see them off at the docks on sailing day."
reply = "The wind on the docks was strong enough to set the posted notices flapping. Sophie and her mother went up the gangplank first, her brother squeezed between them with his bundle on his back; the captain looked once and said nothing. Inês didn’t cry. She pushed Sophie’s half of the book into her arms, turned and walked away. Only after a dozen steps did she look back. The ship had already left the quay."
news = "On the Antwerp docks the Portuguese secretary’s daughter saw a Lille family onto a ship for Emden. She didn’t cry, and didn’t look back until she was a dozen steps away."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_epilogue]
title = "The Half That Came Back"
text = "The secretary’s new house in Lisbon looked out over the Tagus. Inês set a parcel on the windowsill and opened it: half the book, sent from Emden, its cover puckered by seawater. She turned page by page to the end and stopped. Copied there was a line in Portuguese: The chair by the door is empty today. It was the half line she had written and struck out eleven years ago. Sophie had copied it back without missing a word, then finished it in French: In Emden I took the seat by the door too. Inês read the line aloud to me, stopped halfway and touched the back of her hand to her nose. “She even remembers the half I crossed out.” On the next page she wrote a whole line and left no half for anyone. She blew it dry. “All of it this time. Let her learn that by heart.” Then she sealed it and gave it to the first ship going north."
news = "Every year an old notebook comes to the Portuguese secretary’s house in Lisbon from Emden, and every year it goes back. The postman says it’s full of poems."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_epilogue.variants.helped]
text = "The secretary’s new house in Lisbon looked out over the Tagus. Inês set a parcel on the windowsill and opened it: half the book, sent from Emden. A slip fell out first, in Sophie’s hand. Her brother was apprenticed to a printer in Emden, ink up to his wrists, and could already read type backward. Inês tucked the slip under the inkwell and turned page by page to the end, and stopped. Copied there was a line in Portuguese: The chair by the door is empty today. It was the half line she had written and struck out eleven years ago. Sophie had copied it back without missing a word, then finished it in French: In Emden I took the seat by the door too. Inês read it aloud to me and stopped halfway. “She even remembers the half I crossed out.” On the next page she wrote a whole line, no half left over. “All of it this time. Let her learn that by heart.” She sealed it and gave it to the first ship going north."

[tracks.pair_ines_costa_sophie_lemaire.chapters.pair_ines_costa_sophie_lemaire_epilogue.variants.matched]
text = "The secretary’s new house in Lisbon looked out over the Tagus. I set the bundle on Inês’s windowsill. It was the same oilcloth I had left with, but the knots were Sophie’s now, pulled tight as pebbles, and it took Inês a long time to work them loose. She turned page by page to the end and stopped. Copied there was a line in Portuguese: The chair by the door is empty today. It was the half line she had written and struck out eleven years ago. Sophie had copied it back without missing a word, then finished it in French: In Emden I took the seat by the door too. Inês read it aloud to me, stopped halfway and touched the back of her hand to her nose. “She even remembers the half I crossed out.” On the next page she wrote a whole line, blew it dry, wrapped it in the same oilcloth and pushed it back across to me. “North again. You again.”"

[tracks.pair_ines_costa_sophie_lemaire_side]
name = "Sisters Across the Sea"

[tracks.pair_ines_costa_sophie_lemaire_side.chapters.pair_ines_costa_sophie_lemaire_side_landing]
title = "Send the Rest"
text = "Of the two berths her father’s office had booked to Emden, Inês kept neither. She pushed both across to Sophie and her mother. Sophie looked at the tickets for a long time and didn’t say thank you. That night, in the back room of Inês’s house, the two of them unpicked the circle’s book and split it down the middle, half each. On the last page of her half, Inês wrote half a line: “Send the rest.” The letters were tiny, crowded into the corner of the page. Sophie leaned in to look and frowned. “Your writing is still too small. In Emden I’ll need two candles to read it.” “Then light two,” Inês said. “I’ll pay for the candles.” Sophie snorted and tucked her own half inside her coat. On the way out she went first, then stopped at the door and waited until Inês had blown out the lamp, and they walked out into the lane together."
news = "Before the Portuguese secretary’s house in Antwerp left for Lisbon, it gave away the office’s two berths to Emden. A mother and daughter from Lille took the tickets."
