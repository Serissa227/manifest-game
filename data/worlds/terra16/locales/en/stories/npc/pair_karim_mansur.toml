# 谁先开船（pair_karim_mansur）的英文显示覆盖：按轨道、章节、选项与变体的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_karim_mansur]
name = "Who Sails First"

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_meeting]
title = "The Same Passengers"
text = "Forty-six pilgrims bound for the Swahili coast sat in a row under the matting awning on the Jeddah quay, waiting for the northeast wind to take them home to Mogadishu. Karim and Mansur had been shouting over their heads for an hour about the fare: Karim kept undercutting, and Mansur would not budge. Midway, Mansur caught sight of the berth board in Karim’s hand and frowned. “Forty-six people, twenty days at sea, and you’ve written eleven barrels of water. It should be twelve.” “My ship has enough.” “Enough for you.” He turned, rolled a barrel down from his own vessel and pushed it all the way to Karim’s feet. “Carry one bale less and leave one more barrel of water. You’ve got a bundle of pepper in that hold that can come off.” Karim scowled and said “Thanks” first, then added the rest: “I’m still undercutting you.” “And I still won’t knock off a copper,” said Mansur."
news = "Two captains on the Jeddah quay fought over a party of returning pilgrims until half the dock turned out to watch. When it was done, one pushed a water barrel from his own ship over to the other, and not a copper came off his price."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_closer]
title = "The Tiller He Gave Away"
text = "Karim’s ship came into the Jeddah channel with the tiller in the hands of a sixteen- or seventeen-year-old deckhand, and the hull scraped past the reef, shaving off a patch of paint and showing white wood. Mansur’s pilot boat shot out of the harbor, shouting all the way, swung round the bow and led them into the anchorage. On the quay he rounded on Karim at once. “Are you mad? Letting a boy steer into Jeddah?” Karim leaned on a mooring post, his palms still red from the sheet line. “What I told him was, you take the tiller, I’ll watch the sail. My father did that for me. Somebody has to let go first. The kid brother at home will be next.” Mansur stopped scolding. He unhooked the water skin from his belt, pulled the stopper, took Karim’s hands and poured water over the two red marks. “Water costs plenty in Jeddah,” said Karim. “It’s my water. I’ll pour it where I like.” The skin ran dry, and Karim’s hands stayed out."
news = "A ship from Mogadishu let a green boy steer it into Jeddah and nearly hit the reef. They say its old rival from the harbor went out in a pilot boat and led it in."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_turning]
title = "The Pass"
text = "They say a Portuguese patrol boat has seized a pilgrim ship outside the strait for sailing without a pass, and where its people were taken depends on who is telling it: Aden, some say, or somewhere farther. Then something odd happened on the Jeddah waterfront. Two shipowners who had been at each other’s throats for over a year sat down at one table in a waterfront eating house and stayed until the boy came to clear the tables. Mansur spread out a chart; Karim laid down a pass stamped with red wax, someone else’s, borrowed for the look. The talk at the table was no longer about dividing passengers. It was about the paper itself. Whether the Red Sea wants one, and how far beyond the strait you must carry one, nobody can say for certain, so the two of them went through it a line at a time. When they broke up, the borrowed pass stayed on Mansur’s side of the table, and Mansur tucked it into his ledger."
news = "The Portuguese seized a pilgrim ship without a pass outside the strait, and in a Jeddah eating house those two old rival shipowners sat at the same table for the first time."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_choice]
title = "Scheduling Two Ships"
text = "More pilgrims were going home this season than usual, and the two ships’ sailing dates had landed in the same week. Mansur spread his berth sheet on the table and ran a finger down the days. “I want them staggered. Two ships in one stretch of sea, the patrol comes once, and it takes both.” Karim took the pen and stopped under the last column, the one for water, at the blank space. “Staggered is fine. Add a line: emergency water. If your ship runs short I send you a barrel, if mine does you send me one. No charge.” Mansur stared at the blank space and neither agreed nor refused. He turned and asked me, “You’ve sailed more seas than the two of us. Will you help me work this season out?”"
news = "The two old rival shipowners in Jeddah argued over this year’s sailings until midnight. The two ships will go out staggered, and each leaves a barrel of emergency water for the other."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_choice.default]
news = "The two old rival shipowners in Jeddah asked no one for help. They argued until the small hours and staggered their sailings by five days, and each left a barrel of emergency water for the other’s ship."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_choice.choices.routes]
text = "Find out when the patrol boats run and which waters want a pass."
reply = "I spent some days each in Aden and Mocha, asking the harbor clerks and the pilots one question at a time, and half a month later I came back with a sheet covered in dates: which days the patrol boat puts in for water, which seas get a pass check and which it ignores. Mansur read it through and moved his own sailing back three days so Karim’s ship could go first. Karim stared at the paper. “How did you get these dates out of anyone?” “I fed a clerk dinner all evening,” I said."
effects = [{}, {}, {}, { title = "The Sheet of Dates" }]

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_choice.choices.share_ship]
text = "Suggest they simply share one ship this season."
reply = "They both stared at me as if I had proposed hanging the anchor from the mast. Karim spoke first. “Share a ship? Me and him?” Mansur said nothing, rolled up his berth sheet and left. Early the next morning he found me at my inn with the sheet under his arm and asked before he was through the door, “If we share, whose name goes next to the water in the last column?”"
effects = [{}, {}, {}, { title = "The Shared Berth Sheet" }]

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_choice.choices.watch]
text = "Stay out of it and let them work it out."
reply = "I sat by the lamp and never said a word. The two of them wrangled into the small hours until they were hoarse, over whether to stagger the sailings by three days or by four. When the oil was down to a finger’s depth, Karim snatched up the pen and added a line to the last column of Mansur’s berth sheet: emergency water, two barrels, one of them the other man’s. Mansur glanced at it and bent to blow the ink dry."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_together]
title = "One Empty Berth"
text = "The new ship’s berth sheet was pinned to the wall of the Jeddah counting room, forty berths filled to the last one, and the last column as always for water: ten barrels. The next-to-last column had one square left empty. Karim rapped it with a knuckle. “Who’s this one for? I’ve counted every passenger.” Mansur was cutting a pen and did not look up. “The owners. Two owners, one cabin.” “How long have you been working that out?” “Since the day we staggered the sailings last year. One pass covers the ship, and we don’t have to stock water twice. Any way you add it up, it comes out ahead.” He put the pen down, crossed the room and kissed Karim. Karim was still holding the berth board and did not let go."
news = "Those two Jeddah shipowners, who had quarreled for years, went in together on a pilgrim ship. They say one berth on its sheet was left empty for the owners themselves."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_together.variants.helped]
text = "The new ship’s berth sheet was pinned to the wall of the Jeddah counting room, and beside it hung last year’s sheet covered in patrol-boat dates, its corners curling. Forty berths filled to the last one, and the last column as always for water: ten barrels. The next-to-last column had one square left empty. Karim rapped it with a knuckle. “Who’s this one for? I’ve counted every passenger.” Mansur was cutting a pen and did not look up. “The owners. Two owners, one cabin.” “How long have you been working that out?” “Since I got that paper. With the dates in hand, one ship can do the work of two, we buy one pass, and we don’t stock water twice.” He put the pen down, crossed the room and kissed Karim. Karim was still holding the berth board and did not let go."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_together.variants.matched]
text = "The new ship’s berth sheet was pinned to the wall of the Jeddah counting room, forty berths filled to the last one, and the last column as always for water: ten barrels. The next-to-last column had one square left empty. Karim rapped it with a knuckle. “Who’s this one for? I’ve counted every passenger.” Mansur jerked his chin at me. “Last year someone told us to share one ship. I took that person for mad, then I worked at it all winter and found the madness paid. This one is for the owners. Two owners, one cabin.” He put the pen down, crossed the room and kissed Karim. Karim was still holding the berth board and did not let go."

[tracks.pair_karim_mansur.chapters.pair_karim_mansur_epilogue]
title = "Wherever the Monsoon Goes"
text = "Everyone on the Hormuz quay knows the Somali shipowner, the eldest son of a Mogadishu captain’s house, who has lived in town since last year. But each year when the monsoon turns, his ship makes a run to the Red Sea and lies a full pilgrim season at Jeddah. The pilgrim-ship owner from Jeddah does the same, and when the monsoon turns again his ship comes alongside the Hormuz jetty. The Portuguese clerk at the customs house says he has no need to watch the sky: when the Somali turns up at his window for a pass, the wind is about to change. This year he had two forms laid in his drawer early, one for the Somali shipowner and one for the man from Jeddah."
news = "The Portuguese clerk at the Hormuz customs house says that when the Somali shipowner comes for his pass the monsoon is about to turn, and the Jeddah pilgrim-ship owner follows in his wake, year after year."
