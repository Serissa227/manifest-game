# 山路认得人（pair_diego_lorenzo）的英文显示覆盖：按轨道、章节、选项的 key 嵌套；只写显示文字，不复制玩法。
# 效果数组按下标对齐中文文件，只有回忆标题需要译文，其余位置留空表。

[tracks.pair_diego_lorenzo]
name = "The Mountain Knows the Way"

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_meeting]
title = "Behind the Sword Rack"
text = "In the middle of the night Diego felt behind the sword rack for the practice blade he kept hidden there, and his fingers closed on a book instead. The writing ran right to left across the page, and he couldn’t read a letter of it. A candle stub flared, and Lorenzo flew at him. “Proverbs. I’m copying them out for the steward.” He was smiling sweetly, but his knuckles had gone white. “Proverbs you have to hide behind a sword rack?” Diego didn’t let go. He looked by the candlelight for a moment, then slapped the book back against Lorenzo’s chest. Lorenzo watched his face, waiting for the shout. “What are you looking at? Go practice.” Diego pushed his own oil lamp across the floor, crouched, and drew out the blade. “And keep the wax off my hilt.” From that night they took turns keeping watch: one drilled, one read, and whoever heard footsteps coughed."
news = "In the pages’ quarters of the Marquis of Tarifa’s house in Seville, they say the best swordsman and the sweetest talker both stay up all night. The steward has checked a few times and found nothing."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_closer]
title = "The Boy Who Darned at Night"
text = "Lorenzo woke in the night to find Diego under the window darning a sock by moonlight, his stitches crawling like worms. Diego shoved the sock behind his back. Lorenzo rolled over and pretended to sleep. Next morning the steward came to inspect the pages’ hose. Lorenzo stepped up first, playing the Marquis’s tailor, and measured the steward’s calf with a long drawl: “This gentleman’s leg is short a good inch of satin—” The room howled, the steward went red and slammed the door behind him, and nobody mentioned socks again. That evening a sewing roll landed on Diego’s bed. “Let me guess where you’re from.” Lorenzo leaned in the doorway. “That knot is for mending nets. Tarifa.” “…My aunt taught me,” said Diego, the tips of his ears burning. “Shut up.” The lamp stayed lit. Diego threaded the needle, Lorenzo held the light, and for once he didn’t say a word."
news = "In the Marquis of Tarifa’s house in Seville, the page who does everyone’s accents played the Marquis’s tailor to the steward’s face. The room roared, and the steward went red and slammed the door."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_together]
title = "The Quay at Triana"
text = "Diego’s posting to the Indies had come through, and the fleet sailed at first light. On their last night they sat at the edge of the Triana quay with the dark Guadalquivir below them. Diego struggled for a long while. “Don’t let me hear across the sea that something’s happened to you.” Lorenzo laughed it off. “What could happen to a man like me?” Diego said nothing and stared at the water. Lorenzo stopped laughing. He took a scrap of paper from his shirt, and on it, in Arabic letters, was Diego’s name. “Took me thirty tries to get it right,” he said. “If anyone finds it on you, it’s your neck. So don’t let them search you.” Diego pushed the scrap into the deepest fold of his purse and buckled it shut. A bell across the river struck eleven. Lorenzo leaned in first, and this time he wasn’t imitating anyone."
news = "The night before the Indies fleet sailed, two young men from the Marquis’s house sat on the quay at Triana in Seville until dawn."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_turning]
title = "The Banned Letters"
text = "The talk on the Málaga waterfront is that on New Year’s Day they read the decree out in Granada. The Moriscos may no longer speak Arabic or wear their old clothes, and anyone who disobeys will be fined. For several nights the harbor has smelled of smoke. They say a scrivener-interpreter in Granada, the kind who writes petitions for other people, squatted in his courtyard after dark and burned every one of his Arabic practice sheets, tearing them apart one by one until dawn. Only one was left, folded small and tucked inside his shirt. When the old woman next door asked over the wall what he was burning, he said scrap paper. Someone claims to have glimpsed that last sheet. It bore the name of a Spaniard."
news = "The decree banning Arabic has gone from Granada to Málaga. Morisco families on the waterfront burn old books and clothes at night, and the smoke drifts half a street."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_choice]
title = "Roads on Both Sides"
text = "Fighting had broken out in the Alpujarras. Within one day two men came looking for me. In the morning it was Lorenzo, interpreting for Morisco families in the hills. His map ran from the mountain pass down to the shore at Málaga, with circles only where there was water. “The old and the children can’t walk at night. Those wells are their lives.” At dusk it was Diego, back from the fleet and posted to Granada, in the garrison’s coat. He spread his own map and circled only the water, in exactly the same places. “The patrols need to water their horses.” His finger pressed the last well. “The day after tomorrow my men will be here.”"
news = "Málaga’s harbor is full of families down from the hills these days, and they all say an interpreter is leading them along the mountain roads."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_choice.default]
news = "In the Alpujarras, an officer and a guide-interpreter met at a spring, the Málaga waterfront says, and both swords stayed in their scabbards."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_choice.choices.route]
text = "Take the families down along Lorenzo’s water route"
reply = "We took the road Lorenzo had drawn, and at every well someone was waiting, shepherds he had arranged to hand out water. On the last stretch the officer at the crossroads was Diego. He took the list and read it for a long time. “All my orders say is count heads,” he said. Lorenzo murmured, “Count wrong and you’ll be punished.” “I never could count.” Diego folded the list, tucked it inside his coat, and stepped aside to let us pass."
effects = [{}, {}, {}, { title = "The Road with Water" }]
news = "Málaga’s harbor is full of families down from the hills, and they say an interpreter led them and the officer at the crossroads checked the list and let them through."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_choice.choices.berths]
text = "Book passage to Fez for these families, nothing more"
reply = "Twenty berths were booked. Diego came to inspect the ship, notebook in hand at the foot of the gangway, counting heads one by one. At the end his book was three strokes short. Lorenzo watched him from the other end of the plank and said nothing. Diego shut the notebook. “Wind’s turned. Cast off.”"
effects = [{}, {}, {}, { title = "Three Uncounted" }]
news = "Twenty berths for Fez were taken on the Málaga docks. An officer counted heads, announced the wind had turned, and the ship sailed."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_choice.choices.watch]
text = "Stay out of it and wait for news in Málaga"
reply = "I waited a month in Málaga. A donkey driver who came down said that at one spring in the hills, two men stood a long while on either side of a cart, one in a soldier’s coat, one carrying a roll of papers, swords sheathed. Later the soldier tossed over his water skin. The other man caught it, drank, and threw it back."
news = "Donkey drivers outside Málaga say that at a spring in the hills an officer and a man with a roll of papers stood a long time on either side of a cart."

[tracks.pair_diego_lorenzo.chapters.pair_diego_lorenzo_epilogue]
title = "Arabic Script in the Purse"
text = "The soldiers in the Havana fort are saying their officer, the one who never smiles, is back from Spain. He talks even less now. Deep in his purse is an old scrap of paper covered in foreign writing, and anyone who reaches for it gets his temper. Last time a recruit wanted to see if it was a love letter, and he ended up pinned to the wall. Others say a letter comes to the fort from Granada every year, in a beautiful hand and a voice that can sound like anybody. One year it read exactly like the governor. The officer went through it twice, then laughed out loud, alone up on the battery."
news = "Havana’s fort has an officer who never smiles and carries a scrap of paper in foreign writing, said to come from Granada. Anyone who asks about it gets snapped at."

[tracks.pair_diego_lorenzo_side]
name = "Accents on the Quay"

[tracks.pair_diego_lorenzo_side.chapters.pair_diego_lorenzo_side_landing]
title = "Accents on the Quay"
text = "The fleet for the Indies was about to sail. On the quay at Triana the captain read out his muster, and Lorenzo, squeezed in among the well-wishers, did his Biscay accent, drawling out Diego’s name until the whole ship was doubled over. On the gangplank Diego cursed him foully, then unbuckled the practice sword from his back and threw it across the crowd. “Keep it for me. We’ll settle this when I’m back.” Lorenzo caught it neatly. “If you lose, I’m trading it for wine.” As the gangplank came up, Diego didn’t turn around. He just raised one hand and waved it."
news = "Before the Indies ship sailed from the quay at Triana in Seville, a page from the Marquis’s house mimicked the captain’s roll call and had the whole ship laughing."
