[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_turning]
title = "The New Sultan Rides In"
text = "Early in the spring the new sultan rode into Fez with his Ottoman soldiers, coming from Algiers. The olive seller says he was raised in Istanbul and cares for little but music. The tailor says the palace band is short of players, and the scribes are copying song texts all over town and going to the people for the ones they can’t find. At the tea stall someone nods across the river. “Songs? Try the Andalusi quarter. The old folk there carry half of Granada in their heads.” Within days the palace men are knocking at doors in that very lane: whose daughter plays the oud best? People in the lane tell how the copy shop’s young master caught wind of it, lost a slipper running, and burst in on Nala. “Are you going?” She didn’t look up from the peg she was tuning. “First I’ll ask which song they want.”"
news = "Abd al-Malik has ridden into Fez from Algiers with Ottoman troops. They say the new sultan loves music, and his men are already going door to door in the Andalusi quarter asking after players."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_choice]
title = "Page Forty-One"
text = "I had brought Nala a packet of oud strings and arrived just as the palace scribe did. He spread a square, neatly written sheet on the stone table: the song for the court. “The sultan wants this one, and not a word changed. The text was copied from the copyist’s son’s annotated book. It can’t be wrong.” Nala’s fingertip stopped at the last line. “My mother didn’t sing it like this. She sang ‘house,’ not ‘girl.’” Idriss had been sent for to check the book. He went white, and his hands were already turning pages. “Copied from which page…?” “Forty-one,” said the scribe. There it was. His own hand, his own dot. He turned backward, then forward, looking for any copy older than his. There was none. “The booklets the Granada people carried over the sea were scattered across the used-book stalls of Algiers long ago,” he muttered. “Who is going to dig through those? Another one with no source.” The scribe pressed the sheet flat. “The date of the banquet isn’t fixed yet. When it is, I’ll come for you, and you will sing it as written.”"
news = "The palace in Fez has asked a musician’s daughter from the Andalusi quarter to play before the court; she read the scribe’s song text and said her mother never sang it that way."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_choice.default]
news = "In Fez, the palace scribe’s song text had one word copied wrong. The musician’s daughter sang it her mother’s way, and the copyist’s son corrected his own book on the spot, in front of the scribe."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_choice.choices.find_original]
text = "Go to the used-book stalls in Algiers and find the oldest copy of the song for Idriss."
reply = "I spent three days at the used-book stalls by the harbor in Algiers. The stallholder tipped a bundle of moldy booklets onto the ground. “Left behind by people who fled across the sea. Nobody can read the hands. I sell them by weight.” The booklet at the very bottom had the song in a corner of one page, and the word was “house,” its dot under the line, exactly as Nala sings it. I paid by weight and carried it all the way back to Fez. Idriss took it and pressed a finger to the dot for a long time. For once he didn’t ask which page. He opened his own book, dipped his pen, and wrote beside the wrong word: “Line miscopied. The musician’s singing governs.”"
news = "A moldy bundle of booklets, said to have been carried over the sea by Granada exiles, was bought by weight at a used-book stall in the port of Algiers and taken straight to a copy shop in Fez."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_choice.choices.stand_by_her]
text = "Go with Nala to court and stand behind her while she sings."
reply = "On the day of the court visit Nala had me stand behind her; Idriss was stopped at the hall door. She didn’t so much as glance at the sheet the scribe had handed her. She struck the strings and sang, “There’s a house on the hill, its door to the sea.” The new sultan listened to the end and nodded. The scribe’s pen hung in the air and did not come down. When she left the hall she turned to look for someone. Idriss stood in the gallery clutching his annotated book, open at a page where the ink in the margin was still wet."
news = "In Fez, a musician’s daughter from the Andalusi quarter played at court without following the scribe’s text; she sang it as her mother taught her, and the new sultan nodded. The scribe didn’t dare change a word."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_landing]
title = "The Book Goes with Her"
text = "Outside the east gate the mule train for Algiers was waiting to leave, Nala’s oud already lashed to a saddle. Idriss pushed the annotated book into her arms. “Wherever you sing, correct it there.” She opened it. Every page had his writing in the margins, so small you had to put your nose to it. At the page for the song of the hill, beside the wrong word, was a new line: “The musician’s singing governs.” “You can bear to part with this one?” “I remember every page.” Nala rose on her toes and kissed him. The muleteer coughed behind them. Idriss reached into his coat for the book out of habit and found nothing there; Nala laughed from the saddle. “You say it this time—no hiding behind a book.” He stood a while with empty hands. “The day you come back, I’ll be at the east gate.” After that, every few months a mule came in through the east gate carrying the oud and the book, and the book was a little thicker each time than when it had left."
news = "In the mule train outside the east gate of Fez, a musician’s daughter from the Andalusi quarter rode out for Algiers with her oud on her back and a copyist’s son’s annotated book in her arms."

