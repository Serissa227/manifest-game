[tracks.tie_new_idriss_qalam_nala]
name = "A Line Copied Wrong"

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_meeting]
title = "The Slipped Dot"
text = "Idriss sat down under the orange tree in Nala’s courtyard with his annotated book and asked her to sing him the old village songs, one by one, so he could copy them out. Nala had a rule: she sang a song once, and he had to sing it back exactly, not one word changed, not the accent either. By the third song he had started to dodge. He cleared his throat. “There was once a copyist who wrote ‘the sultan’s camels’ as—” Nala laid the oud across her knees. “Save the copyist for after. This time, you sing.” He sang, red in the face. The tune wandered off three streets away, and the water-carrier’s donkey at the end of the lane turned its head to look. Nala laughed so hard she plucked a wrong string, then went back to correcting him note by note. The last line went, “There’s a house on the hill, its door to the sea.” He copied it as he heard it, his pen twitched, and the dot in the middle of the word for “house” slid to the other side of the line. The page now said “girl.” He blew the ink dry. “Next one.” By the end of that year the book held twenty more songs."
news = "In a courtyard in the Andalusi quarter of Fez, a copyist’s son asked a musician’s daughter to sing him her village songs, then sang one back himself, and the water-carrier’s donkey turned its head."

[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_closer]
title = "Not on Any Page"
text = "After the night prayer Nala knocked at the back door of the copy shop with her oud on her back. She wanted to know where an old song came from: at a wedding someone had asked who wrote it, and she hadn’t been able to say. Idriss opened his annotated book and turned page after page until his ears went red. “Your source? Which page, which line?” “It isn’t on any page,” Nala said, sitting down to tune. “It’s in my mother’s mouth.” She sang and he wrote. When she corrected a word he struck the line out and began it again; when she said, “Hold this one long, like a ship crossing the sea,” he drew a long stroke beside the word. Behind the curtain his father’s snoring rose and fell, and twice they topped up the lamp. After midnight he suddenly put down his pen. “There’s a quotation in this book that I’ve hunted for ten years and never traced to its source. I didn’t write a source beside it. I’ve never told anyone.” Nala laid the oud flat across her lap. “Then keep hunting. And what I sing, keep writing down.” He dipped his pen, and she began the next line."
news = "A lamp in a copy shop in the Andalusi quarter of Fez burned until the small hours last night: the shop’s young master and a musician’s daughter, one singing a line, the other writing it down, comparing them half the night."

