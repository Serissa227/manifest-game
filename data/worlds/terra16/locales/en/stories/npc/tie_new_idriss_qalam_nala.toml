[tracks.tie_new_idriss_qalam_nala.chapters.tie_new_idriss_qalam_nala_landing.variants.helped]
text = "Outside the east gate the mule train for Algiers was waiting to leave, Nala’s oud already lashed to a saddle. Idriss pushed the annotated book into her arms. “Wherever you sing, correct it there.” She opened it. Every page had his writing in the margins, so small you had to put your nose to it. At the page for the song of the hill lay a yellowed old copy, the word “house” ringed in red ink, and beside it in his tiny hand: “The musician’s singing governs.” “You can bear to part with this one?” “I remember every page.” Nala rose on her toes and kissed him. The muleteer coughed behind them. Idriss reached into his coat for the book out of habit and found nothing there; Nala laughed from the saddle. “You say it this time—no hiding behind a book.” He stood a while with empty hands. “The day you come back, I’ll be at the east gate.” After that, every few months a mule came in through the east gate carrying the oud and the book, and the book was a little thicker each time than when it had left. The page with the red ring was never touched."

