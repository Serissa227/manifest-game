[tracks.tie_new_idriss_qalam_nala_side]
name = "The Annotated Book and the Oud (Side by Side)"

[tracks.tie_new_idriss_qalam_nala_side.chapters.side]
title = "Half Ink, Half Song"
text = "Nala was leaving to play in Algiers, and the mule train waited outside the east gate. Idriss did not hand over his annotated book. He had spent the whole winter copying out a duplicate, the stitching still new, and on its flyleaf he had ruled a line down the middle with a straightedge, “Words” on the left and “Songs” on the right. “In every city you sing in, correct the margin right there,” he said, tucking the copy into her saddlebag. “Send it back with the caravans and I’ll copy the changes into the master.” Nala studied the line. “Your side is more crowded than mine.” “Notes are always crowded.” She swung up into the saddle and slung the oud over her back. “Then I’ll write more on my side. And when I send it back, you copy it into the master with not one dot of my accent moved.” He followed the mule a few steps. “Not one dot!”"
news = "Outside the east gate of Fez, a copyist’s son pressed a duplicate of his annotated book on a musician’s daughter from the Andalusi quarter. They mean to make one songbook between them, he writing and she singing, with the mule trains carrying it back and forth."

