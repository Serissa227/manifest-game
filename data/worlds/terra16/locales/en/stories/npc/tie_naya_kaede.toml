# C7 英文覆盖：第二只茶碗（纳屋小夜 × 百地枫）。只覆盖显示文字，按轨道、章节、选项 key 对应；effects 数组保留下标。

[tracks.tie_naya_kaede]
name = "The Second Tea Bowl"

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_meeting]
title = "A Stranger to Tea"
text = "Oda’s men had come to Sakai demanding a war levy of twenty thousand kan. The merchant council argued for half a month, some for digging a moat and holding the town, some for paying up and being done with it. Sayo’s father didn’t wait for them to settle it; he sent to Iga for a guard, a woman named Momochi Kaede. In the tea room Kaede tried the door bar twice, then crouched to look at the gap under the threshold. She never once glanced at the tea wares on the shelf. So Sayo set the family’s most valuable piece, a square-shouldered tea caddy, right in front of her knees. “If this breaks,” Kaede asked, “does somebody pay for it with their life?” Sayo put the caddy back in the cabinet and brought out two coarse bowls instead, one with a chip in the rim. “We’ll use these today. Finish the tea before we talk about selling.” “Selling it to pay the levy?” “That depends on what the town settles on, once it’s done shouting.” Kaede took the chipped bowl and drained it in one go. As she drank, she shifted her seat until her back was to the wall and her face to the door."
news = "Sakai’s merchant council has been arguing over the twenty-thousand-kan levy from winter into spring. The Naya house’s new guard from Iga has spent the whole winter standing at their door."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_closer]
title = "The Pack in the Night"
text = "Oda’s men went from house to house in Sakai with a list, “buying” famous tea wares at prices they named themselves. The night before they reached the Naya house, Kaede wrapped the square-shouldered caddy, stowed it in her own pack, and slipped out of town before dawn. The men left with two pieces; Sayo’s father told them the third had broken years ago. Kaede came back at dusk, her pack flat, mud caked to her ankles. Sayo didn’t ask where she had hidden it. She waited until Kaede had slid the bar home, then said, “What was in it for you?” “Cold tea can be replaced. Lost people can’t.” Kaede sat down by the door. “That one was your mother’s.” That day Sayo whisked two bowls. She didn’t carry the second over to the door; she set it on the mat beside her. “This bowl isn’t for the guard.” Kaede looked at the bowl for a while, then got up, left the door, and sat down next to her. That night she looked back at the door bar only once."
news = "Oda’s men went through Sakai “buying” famous tea wares. The Naya house handed over two and swore the third broke years ago, though nobody has ever seen the pieces."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_closer.default]
effects = [{}, { title = "The Second Tea Bowl" }]

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_turning]
title = "No Road Back to the Hills"
text = "The news from Iga came down with the firewood sellers: Oda’s armies had gone into the hills by several roads at once. The fires burned for more than a month, and not a temple or a village was left standing. In Sakai’s teahouses nobody picked up the subject. But the water carrier who lives across from the Naya house says that one of those nights he got up again and again, and every time, their guard was sitting on the doorstep with her pack in her arms. She never moved. Someone came out from inside with hot water and changed it three times, each time saying only, “The water’s gone cold.” Toward dawn the guard spoke: “If I can never be a guard again, can I still sit here?” The one inside didn’t answer. She whisked another bowl and set it down on the doorstep."
news = "The hills of Iga burned for over a month, and nobody in Sakai’s teahouses will speak of it. All anyone will say is that the Naya house’s guard sat on the doorstep the whole night, clutching her pack."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_choice]
title = "Which Piece Goes"
text = "Men from the magistrate’s office were going door to door, asking after anyone who had come from Iga. Someone had given them Kaede’s name, and nobody would say who. Sayo asked me into the tea room, and this time she made no tea. The ledger of the family’s tea wares lay open in front of her; she turned the pages one by one and stopped at the last. Kaede laid her hand flat on the book. “Not your mother’s.” “Then you tell me which one.” Sayo’s voice was as soft as ever. “Everything else put together wouldn’t buy one person passage out.” Kaede said nothing and didn’t move her hand. They both turned to look at me."
news = "Sakai’s magistrate is going house to house after people from Iga. The Naya house turned away guests for three days, and not a sound came out of the tea room."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_choice.default]
news = "The Sakai magistrate’s men went to the Naya house to take the Iga guard and came away empty-handed. She had left on her own the night before and told no one where. All she left behind were a few fingerprints on the door bar."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_choice.choices.hide_on_ship]
text = "Hide Kaede in my hold and bring her back once things blow over."
reply = "Once we cleared the harbor, Kaede crouched behind the rice sacks in the hold for twelve days. She ate only half of what I brought down and kept the rest wrapped inside her robe, in case she had to run. When the talk died down I sailed back to Sakai. She jumped onto the pier and didn’t ask about the magistrate at all. Her first words were: “Has Sayo been drinking her tea?” Sayo was standing at the far end of the pier, holding a coarse bowl with a cloth over it."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_choice.choices.sell_caddy]
text = "Sell the caddy to Oda’s tea master for Sayo, to pay Kaede’s way out."
reply = "Oda’s tea master turned the caddy over and studied its foot three times, then paid enough to take Kaede to Kii and bring her back again. Kaede took the purse and looked at Sayo for a long time before tucking it into the innermost fold of her sash. Sayo folded the empty silk pouch in four and put it at the very back of the cabinet. Later the caddy turned up at other people’s tea gatherings. Sayo went to see it once, took the lowest seat, finished her bowl, and left without a word."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_choice.choices.inform_oda]
text = "Tell Oda’s men where the Iga survivors went, in return for Kaede’s safety alone."
reply = "I wrote down for the magistrate a few place names I’d picked up from sailors. Some days later Oda’s men brought a string of Iga people down out of the Kii hills, and Kaede’s name was struck from the list. She was safe. Half a month on, she heard from someone how the word had gotten out. That night the Naya door was barred as always. By morning Kaede was gone. The bar had been pulled out and laid across the threshold, with a fresh knife cut in the wood. The next time I called at the Naya house, Sayo still served me tea. It was too bitter to swallow."
news = "They say Oda’s men followed word sent out of Sakai and hauled a string of Iga folk out of the Kii hills. Not long after, the Naya guard was gone."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing]
title = "Tea on That Day, Every Year"
text = "After the fire at Honnō-ji, Kyoto stayed in turmoil all summer. People coming down from the north brought every kind of news except news of Kaede. A monk from the temple called to ask whether a memorial service should be held for the guard. Sayo saw him to the door. “Nobody has brought word of her death. I won’t invent one for her.” When the anniversary of Iga’s fall came around, she whisked two bowls. She drank one herself. The other she left by the door until it was stone cold, then carried it out and poured it over the step. “Cold tea can be replaced.” She washed the empty bowl and set it upside down on the shelf, next to her own."
news = "On the anniversary of Iga’s fall, Naya Sayo of Sakai made two bowls of tea. She drank one, let the other go cold, and poured it out on the stone step at her door."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing.default]
effects = [{}, {}, { title = "Tea on That Day, Every Year" }]

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing.variants.betrayed]
text = "After the fire at Honnō-ji, Kyoto stayed in turmoil all summer. People coming down from the north brought every kind of news except news of Kaede. The knife cut was still in the bar. The carpenter had come twice, run his thumb along it and said, “One pass with the plane and it’s smooth again.” Twice Sayo had sent him home. When the anniversary of Iga’s fall came around, she whisked two bowls. She drank one herself. The other she left by the door until it was stone cold, then carried it out and poured it over the step. “Cold tea can be replaced.” When she barred the door that night, she ran a finger along the cut from one end to the other."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing_b]
title = "A Door That Opens Inward"
text = "When word of Honnō-ji reached Sakai, the town was in an uproar for a while, then settled. Sayo and Kaede rented two rooms in a back lane and opened a small tea room with space for four guests. Kaede never went to collect her guard’s wages. At the end of each month the two of them emptied half a purse apiece onto the table, and that was what the household ran on. The carpenter asked which way the door should open. “Out,” said Kaede. “Harder to kick in.” “In,” said Sayo. “A guest only has to push.” In the end it opened inward. On the first night, at closing, Kaede got up out of habit to bar the door. Sayo put a hand over hers and went herself. “This time you sit. I’ve got the door.” Kaede stayed where she was and watched her shove the bar all the way home, then give it one more push."
news = "A little tea room has opened in a Sakai back lane, with room for four guests. The woman who used to stand guard at the Naya door sits down and drinks with them now."

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing_b.default]
effects = [{}, {}, { title = "A Door That Opens Inward" }]

[tracks.tie_naya_kaede.chapters.tie_naya_kaede_landing_b.variants.sold]
text = "When word of Honnō-ji reached Sakai, the town was in an uproar for a while, then settled. Sayo and Kaede rented two rooms in a back lane and opened a small tea room with space for four guests. The family’s tea wares had been sold off or scattered; only two coarse bowls were left on the shelf, one chipped at the rim. Kaede stared at the shelf for a long time. “That’s all that’s left?” Sayo took down the chipped one. “Just right. These are what I served you in, the first time.” On the first night, at closing, Kaede got up out of habit to bar the door. Sayo put a hand over hers and went herself. “This time you sit. I’ve got the door.” Kaede stayed where she was and watched her shove the bar all the way home, then give it one more push."
