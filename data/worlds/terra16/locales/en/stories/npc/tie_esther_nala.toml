# 账里留一段乡音（tie_esther_nala）的英文覆盖：按轨道、章节、选项、变体的 key 写显示文字，不含玩法字段。
# C7 重写，2026-10-11，Claude（Opus），与中文稿同一轮写完。专名：Esther、Nala、Fez、Algiers、Tlemcen、Málaga、the Alpujarras、Cádiar。

[tracks.tie_esther_nala]
name = "An Accent in the Ledger"

[tracks.tie_esther_nala.chapters.tie_esther_nala_meeting]
title = "Beats That Won’t Add Up"
text = "Friday afternoon, in a courtyard of the Andalusi quarter. Nala is working through an old tune on her oud, and Esther sits on the steps counting the beats for her in a ledger, one pen stroke a beat. By the third line the figures no longer agree: “That was eight just now. How is it seven and a half this time?” “The old folks call this rhythm ‘one and a half,’” Nala says, still playing. “Make it come out in whole numbers and it’s wrong.” Esther counts it twice more and gets lost both times. Nala sets the oud down. “You sing this time—no hiding behind a joke.” Esther opens her mouth for a joke, can’t find one, and sings. She is so far off-key that the dog next door starts barking. When she’s done, she draws a wavy line beside the row. “Where it won’t add up, I’ll put one of these.” Nala tilts her head at it. “Then next Friday, you draw the next one.”"
news = "In the Andalusi quarter of Fez there’s a musician’s house where, every Friday afternoon, a girl from the mellah sits on the steps counting beats for his daughter. When the count won’t come out she sings, and the dog next door howls."

[tracks.tie_esther_nala.chapters.tie_esther_nala_closer]
title = "Names Before the Titles"
text = "Nala’s songbook grows thicker with every song she copies, but who taught her each one she keeps only in her head. Esther borrows it for three days. When it comes back, every title has a line of small writing in front of it: “the baker from Málaga,” “the washerwoman from the Alpujarras.” Nala turns the pages one by one, and her face darkens. “Songs aren’t accounts. Nobody here owes anybody.” “If it isn’t written down, in a few years no one will know who sang them,” Esther says. “And the book in your head can’t be lent out.” Halfway through, Nala goes quiet. She takes the pen and fills in two songs Esther left without a name: one from the old farrier, one from the woman who sells mint. The mint seller calls her home “Gharnata,” so that is how Nala spells it, not Granada."
news = "The songbook in that musician’s house in the Fez Andalusi quarter now has two hands on every page: the daughter copies out the songs, and a girl from the mellah writes in, stroke by stroke, who taught each one."

[tracks.tie_esther_nala.chapters.tie_esther_nala_turning]
title = "Half an Old Song"
text = "Since autumn came, the whole Andalusi quarter of Fez has been talking about an old man from the Alpujarras. He goes door to door, wanting neither water nor bread, and on every threshold he asks the same thing: “The song we sang at weddings in Cádiar—does anyone here know it?” He remembers only the first half himself; it breaks off where the bride steps out of her door. People say he crossed the sea in secret, and that he carries two names, one the priest gave him and one his mother did. Nala, the musician’s daughter, followed him down three lanes and said just one thing the whole way: “Again, slower.” Back home she wrote the first half into her songbook, with most of the page below it bare. When the girl from the mellah came to put his name before the title, she asked him, “Both of them?” Both, he said. He has taken a room at the quarter’s inn, and he told the innkeeper: “Until I find the rest of it, I’m not leaving.”"
news = "An old man from the mountains has turned up in the Andalusi quarter of Fez, knocking on doors for a wedding song. He knows only the first half, and says he won’t leave without the rest."

[tracks.tie_esther_nala.chapters.tie_esther_nala_choice]
title = "Let Her Hear It First"
text = "The old man has fallen ill at the inn, coughing too hard to finish a sentence. All he says is that he wants to hear the whole song before he goes. Nala sits by the bed and plays the first half three times; on the third, at the line where the bride steps out, her hand stops on the strings. “I don’t know what comes after.” Eyes closed, the old man says, “The second half belonged to the women. They sang it to the bride. I stood outside the door that day and heard it once.” Esther opens the songbook and draws a long wave across that page, all the way to the edge. “What can’t be worked out, somebody still remembers. When you find it, let her hear it first—and don’t let anyone tidy up the accent on the way.” They both turn to look at me."
news = "The old mountain man in the Andalusi quarter of Fez has fallen ill. The musician’s daughter goes to the inn every day to play him his half a song."

[tracks.tie_esther_nala.chapters.tie_esther_nala_choice.default]
news = "At an inn in the Andalusi quarter of Fez, the musician’s daughter plays the sick mountain man his song. Nobody knows the second half, so she hums it through on the oud. He says that will do."

[tracks.tie_esther_nala.chapters.tie_esther_nala_choice.choices.ask_elders]
text = "Go door to door in the quarter and ask the old women whose village sang it too."
reply = "I start from the inn’s lane. Six houses shake their heads. The seventh door takes a long time to open: it’s the washerwoman from the Alpujarras, the one in Nala’s songbook. She spends her days down at the river, which is why the old man knocked twice and got no answer. I fetch Nala. Nala plays the first half; the washerwoman dries her hands, leans on the doorframe and sings on from there, in exactly the old man’s accent. Nala takes it down line by line, long drawn-out endings and all. When it’s over, the washerwoman says that was what they sang the year she married, and then she covers her face and cries."
news = "A washerwoman in the Andalusi quarter of Fez sang the old mountain man the second half of the song he’d spent a year hunting for, and then burst into tears herself."

[tracks.tie_esther_nala.chapters.tie_esther_nala_choice.choices.client_roll]
text = "Ask Esther to search her family firm’s old client roll for anyone from Cádiar."
reply = "Esther spreads the roll on the counting-house table and keeps her palm over the other names, reading out only the lines from that village. Three households came from Cádiar. Two moved on to Tlemcen long ago; the third is still in Fez, and the man of the house remembers four lines his mother used to sing, and stumbles through them. I take him to Nala and he sings them to her first. Esther copies the four lines into the songbook and writes beside the wave, very small: “Two lines short.” “That’s bookkeeping,” Nala says. “Keep the books,” says Esther, “and you know what’s still owing.”"
news = "A merchant house in the Fez mellah went through its old client roll and found a man from the same village as the old man in the Andalusi quarter. That wedding song now has four more lines."

[tracks.tie_esther_nala.chapters.tie_esther_nala_landing]
title = "A Listener Who Counts"
text = "Esther’s family has nailed its chests shut; in the morning they leave with a caravan for Algiers. On the last evening Nala plays her the wedding song in the courtyard: the first half clean and clear, the second still hummed through on the strings. Esther sits on the same step as three years ago, no ledger open on her knees. For the first time she doesn’t count the beats. She just claps, louder than anyone. When it’s over, Nala turns to the back of the songbook, tears out the last page and hands it to her: the tune Esther sang off-key that Friday three years ago, with “Esther of the mellah” written before the title. “Where you went off-key, I took it down just as you sang it.” Esther folds the page twice and tucks it into the purse that holds the passage money. “This goes in first. The passage money can wait its turn.”"
news = "Esther of the Fez mellah is off to Algiers with her family. On her last night they played the oud half the night in a courtyard in the Andalusi quarter, and the girl on the steps never stopped clapping."

[tracks.tie_esther_nala.chapters.tie_esther_nala_landing.default]
effects = [{}, {}, { title = "A Listener Who Counts" }]

[tracks.tie_esther_nala.chapters.tie_esther_nala_landing.variants.helped]
text = "Esther’s family has nailed its chests shut; in the morning they leave with a caravan for Algiers. On the last evening the courtyard is full: the old mountain man sits wrapped in a blanket by the well, the washerwoman beside him. Nala plays the wedding song, and this time she plays all of it; when the second half comes, the washerwoman sings along, and the old man’s lips move without a sound. Esther sits on the same step as three years ago. For the first time she doesn’t count the beats. She just claps, louder than anyone. When it’s over, Nala tears the last page out of the songbook and hands it to her: the tune Esther sang off-key that Friday three years ago, with “Esther of the mellah” written before the title. “Where you went off-key, I took it down just as you sang it.” Esther folds the page twice and tucks it into the purse that holds the passage money. “This goes in first. The passage money can wait its turn.”"

[tracks.tie_esther_nala.chapters.tie_esther_nala_landing.variants.roll]
text = "Esther’s family has nailed its chests shut; in the morning they leave with a caravan for Algiers. On the last evening Nala plays her the wedding song in the courtyard: the first half, then the four lines the man from Cádiar remembered, and the last two still hummed through on the strings. Esther sits on the same step as three years ago. For the first time she doesn’t count the beats. She just claps, louder than anyone. When it’s over, she takes the songbook and adds four words after “Two lines short”: “Wait till I’m back.” Nala tears the last page out and hands it to her: the tune Esther sang off-key that Friday three years ago, with “Esther of the mellah” written before the title. “Where you went off-key, I took it down just as you sang it.” Esther folds the page twice and tucks it into the purse that holds the passage money. “This goes in first. The passage money can wait its turn.”"
