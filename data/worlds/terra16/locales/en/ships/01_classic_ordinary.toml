# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[ships.swallow]
name = "Caravel"
description = "The little ship the Portuguese used to feel their way down the African coast: lateen sails, a shallow draft, bold enough to hug the shore. The hold is narrow, though, and carries few stores."

[ships.tradewind]
name = "Carrack"
description = "The spice ship of the Lisbon–Goa run. Its fore and aft castles rise like a pair of towers, and the wide belly holds pepper, water and months of ship’s biscuit."

[ships.whale]
name = "Northern Hulk"
description = "An old workhorse of the North Sea and the Low Countries, deep and broad in the belly, loaded with timber, salt and grain to the waterline. It claws to windward slowly, and turning takes its own sweet time."

[ships.silvergull]
name = "Coastal Lateen Trader"
description = "A small Mediterranean coaster under lateen sails, with a protective eye often painted on the bow. It shuttles cloth, oil jars and wine casks from port to port and can lie in a shallow cove."

[ships.bastion]
name = "Large Galleon"
description = "The new great galleon, with a lowered forecastle and a longer hull. Besides a hold fit for ocean voyages, it still carries its guns in rows along the sides."

[ships.beacon]
name = "Armed Merchantman"
description = "A merchantman fitted with guns by its owners: still cargo below, but a row of gunports cut along the side. It can trade, and it can escort a convoy."

[ships.mistfalcon]
name = "North African Oared Sailor"
description = "A fast North African ship, long and lean; when the wind drops, out come the oars and it runs its quarry down. A long chase empties the water casks, and it must put into port for more."

[ships.farstar]
name = "Large India Nau"
description = "An enlarged India nau built for the long road around the Cape of Good Hope, its hold full of spice cargo and months of provisions. Its deep draft keeps it out of shallow river mouths; it waits outside for the tide."

[ships.cog]
name = "Northern Cog"
description = "The old Hanseatic cog, boxy and blunt, with one mast and one square sail. Good enough for coastal cargo, but less obedient in a headwind than the newer multi-masted ships."

[ships.sloop]
name = "Single-masted Coaster"
description = "A single-masted coaster for estuaries and shoals, its draft shallow enough to venture over sandbars. The owner lives on short-haul freight and a close knowledge of the tides and hidden sands."

[ships.dhow]
name = "Dhow"
description = "Stitched planks with the seams smeared in fish oil and lime, and a lateen sail that rides the monsoon across the Arabian Sea. Outsiders lump all such craft together as “dhows”; between one coastal port and the next, most of the cargo changes hands aboard them."

[ships.brig]
name = "Brigantine Galley"
description = "A light Mediterranean oared brigantine, shallow in draft and quick to turn. While the great ships are still circling outside a bay’s mouth, it has already threaded between the rocks and slipped in."

[ships.pinnace]
name = "Pinnace"
description = "The big ships’ eyes and ears: sounding depths, carrying urgent letters, taking a look at the shore. It can cross oceans in company, but alone on a long voyage its stores last only a few days."

[ships.settler]
name = "Ocean Transport Nau"
description = "A transport nau that carries travelers, tools and provisions across the ocean, its hold wide enough for half a village, hoes and all. It cannot be fast and carries few guns; everything gives way to capacity."

[ships.frigate]
name = "Light Cruising Sailor"
description = "A quick sailing ship built for patrol, scouting and dispatches, with plenty of hands for the sails. It can run down a merchantman and still turn away in time when an enemy’s heavy ship comes up."

[ships.galleass]
name = "Armed Great Galley"
description = "The Venetian great trading galley in armor: broad in the hull, creeping along under sail and rank on rank of oars, with room for firearms at the bow and along both sides."

[ships.junk]
name = "Trading Junk"
description = "The multi-masted ship of East Asian merchants, its sails stiffened with battens, spread panel by panel and lowered panel by panel when the wind rises. The hold carries porcelain, silk and the odds and ends of every port along the coast."

[ships.clipper]
name = "Fast Galleon"
description = "A fast galleon with a low forecastle and a slender hull that leaps ahead the moment the wind rises. All those sails and ropes need a crew of practiced hands."

[ships.lineship]
name = "Great Warship"
description = "A great warship built on the lines of an armed carrack, with towering castles and a thick hull, its decks crowded with fighting men and a mix of heavy and light guns."
