# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[ships.jong]
name = "Javanese Jong"
description = "The great ship of Java, hulled with several layers of heavy planking and able to carry a whole island’s cargo. Its tilted rectangular sails take the monsoon and drive that heavy body through the straits."

[ships.kora_kora]
name = "Kora-kora"
description = "The long boat of the Moluccas, with platforms jutting out along both sides so that dozens of rowers can sit side by side, and a sail besides. It carries troops and fights in the waters between islands."

[ships.mtepe]
name = "Mtepe"
description = "The Swahili mtepe hoists a sail of plaited mats, and its planks are sewn together with coconut-fiber cord. It runs only between the ports of its own familiar coast, carrying goods over short distances."

[ships.sambuk]
name = "Sambuk"
description = "The commonest lateen ship on the Arabian Sea, with a high stern and a broad poop. It sails for India on the southwest monsoon of late summer and waits for the northeast wind of winter to bring it home."

[ships.maya_canoe]
name = "Maya Trading Canoe"
description = "Columbus met just such a canoe off the Bay Islands in 1502: dug from a single great tree, as long as a galley, with two dozen paddlers and a palm-leaf awning amidships over bales of cotton cloth, cacao beans and copper axes."

[ships.balsa_raft]
name = "Balsa Trading Raft"
description = "In 1526 Pizarro’s pilot stopped such a raft at sea: balsa logs lashed together, a cotton sail, steered by boards slid down between the logs, and the deck piled with silverware, cloth and red spondylus shell."

[ships.double_canoe]
name = "Ocean-going Double Canoe"
description = "Polynesian navigators cross the open ocean in double canoes under crab-claw sails slanting at the sky; the platform lashed between the two hulls holds the people, the water and the food for the whole way."
