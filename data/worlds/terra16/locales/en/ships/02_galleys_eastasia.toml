# 英文显示覆盖；路径、表名与 key 对应中文分片，不覆盖数值。

[ships.galley]
name = "Galley"
description = "The Mediterranean galley: a hundred rowers and more pulling together, lateen sails to help only with a fair wind, and the heavy guns all in the bow. A sprint is fierce; steady rowing wears the oarsmen out."

[ships.galiot]
name = "Galiot"
description = "A small oared galley common in North Africa and the Mediterranean, light and quick to turn, a corsair’s favorite and good for carrying letters. Once the rowers tire, the chase is over."

[ships.kobaya]
name = "Kobaya"
description = "A small Japanese sculling boat for passing orders, scouting and ferrying cargo. Light enough to thread between islands and reefs, it carries so little food and water that it cannot go far out to sea."

[ships.sekibune]
name = "Sekibune"
description = "A mid-sized Japanese warship of the coastal lords, driven by rank after rank of sculls. The hold is mostly men and arrow screens, leaving little room for cargo."

[ships.atakebune]
name = "Atakebune"
description = "A large Japanese war galley with a screened turret built around its deck to shelter the men. Thick planking and a big crew make it steady in coastal fighting, but it needs a wide, slow circle to come about."

[ships.fuchuan]
name = "Fuchuan"
description = "A great Fujian seagoing ship with a pair of wide-open eyes painted on its bow and a tall, upswept stern. Its bottom is pointed and its draft deep: at ease on the open ocean, and in danger of grounding the moment it nears a shallow shore."

[ships.shachuan]
name = "Shachuan"
description = "A flat-bottomed, shallow-draft coastal freighter for shoal waters and sandbank channels, hauling cargo between the Jiangnan coast and Shandong. It cannot stand ocean swells."

[ships.niaochuan]
name = "Niaochuan"
description = "The slimmest of Fujian’s seagoing ships, its sharp bow like a bird’s beak, slicing the swell as it goes. Merchants use it to catch the monsoon and beat the market with urgent cargo, but when the wind stiffens even it must run for a sheltered bay early."

[ships.panokseon]
name = "Panokseon"
description = "A new warship of the Korean navy, with a fighting deck built over the rowers’ deck so that the whole ship seems to wear a plank roof. The oarsmen pull sheltered in the dim space beneath it, while archers and gunners stand above."
