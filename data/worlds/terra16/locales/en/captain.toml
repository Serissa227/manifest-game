# 英文覆盖：属性、评价、岗位的显示名与属性说明（对应 captain.toml）。

[groups.aptitude]
name = "Aptitude"

[groups.craft]
name = "Craft"

[groups.conduct]
name = "Conduct"

[attributes.seamanship]
name = "Seamanship"
desc = "Flagship speed and the precision of hand steering; the higher of yours and your captain’s."

[attributes.commerce]
name = "Commerce"
desc = "The discount on trade tax when you buy and sell; the higher of yours and your trader’s."

[attributes.arms]
name = "Arms"
desc = "Skill in hand-to-hand fighting, boarding actions, and duels; the higher of yours and your boatswain’s."

[attributes.stewardship]
name = "Stewardship"
desc = "The discount on crew and worker wages; the higher of yours and your accountant’s."

[attributes.numeracy]
name = "Numeracy"
desc = "How many forecasts the market window can track at once; tuning its parameters by hand takes a high score."

[attributes.eloquence]
name = "Eloquence"
desc = "Haggle a little more off the price, hire mates for less, and carry more weight at the negotiating table."

[attributes.constitution]
name = "Constitution"
desc = "How much fatigue you can carry, and how well you stand up to disease and scurvy."

[attributes.might]
name = "Might"
desc = "The weight of your blows in melee and boarding fights."

[attributes.agility]
name = "Agility"
desc = "Winning the first move and dodging in a duel; steadier hand steering, too."

[attributes.intellect]
name = "Intellect"
desc = "The experience multiplier for reading and lessons; how fast you learn starts here."

[attributes.perception]
name = "Perception"
desc = "How far you see through fog, how well you spot finds, and whether you catch a false rumor."

[attributes.resolve]
name = "Resolve"
desc = "Checks against storms and uncanny events, and the spirit that keeps a crew steady."

[attributes.charm]
name = "Charm"
desc = "People warm to you faster, and mates cost less to recruit."

[attributes.fortune]
name = "Fortune"
desc = "How far the chance part of a check can tip your way; set by your birthday and rarely changes."

[attributes.astronomy]
name = "Astronomy"
desc = "How precisely you fix your position each day and how much of the unknown your charts reveal; the higher of yours and your navigator’s."

[attributes.gunnery]
name = "Gunnery"
desc = "The punch of your guns in a sea fight, and how well drilling pays off; the higher of yours and your gunner’s."

[attributes.command]
name = "Command"
desc = "How many ships you can lead, how well they fight together, and how high the crew’s spirits run."

[attributes.etiquette]
name = "Etiquette"
desc = "How high the bar is to be received by the great; good manners open court and embassy doors."

[attributes.intrigue]
name = "Intrigue"
desc = "Intelligence that is more reliable and leaks less, and contraband that is harder to catch."

[attributes.medicine]
name = "Medicine"
desc = "Skill at treating disease, wounds, and scurvy; the higher of yours and your surgeon’s."

[attributes.learning]
name = "Learning"
desc = "Telling real antiques, gems, and curios from forgeries, and judging what a book or chart is worth."

[attributes.arcana]
name = "Arcana"
desc = "The force of your spellcraft, and how deeply uncanny things take hold of you."

[attributes.morality]
name = "Morality"
desc = "Your lean toward good or evil; your name for privateering and plunder, and some people’s regard, follow it."

[attributes.honor]
name = "Honor"
desc = "Your name for keeping or breaking your word; it decides whether the other side trusts you at the table."

[attributes.piety]
name = "Piety"
desc = "How close you stand to church, mosque, and temple, and how suspicious the Inquisition grows."

[attributes.sensibility]
name = "Sensibility"
desc = "Your eye and ear for poetry, music, and art; collections, gifts, and poetry gatherings all turn on it."

[ratings.naval]
name = "Naval rating"

[ratings.mercantile]
name = "Mercantile"

[ratings.scholarship]
name = "Scholarship"

[ratings.social_rating]
name = "Social rating"

[ratings.arcane_rating]
name = "Arcane rating"

[abilities.astronomy]
name = "Astronomy"

[abilities.gunnery]
name = "Gunnery"

[abilities.medicine]
name = "Medicine"

[abilities.eloquence]
name = "Eloquence"

[roles.captain]
name = "Captain"
desc = "Holds the helm; how fast the flagship runs starts with the captain."

[roles.navigator]
name = "Navigator"
desc = "Takes star sights: spots ports and landmarks from farther off, and scrapes fewer rocks near shore."

[roles.gunner]
name = "Gunner"
desc = "Keeps the guns and powder; how true the broadsides fly is up to the gunner."

[roles.boatswain]
name = "Boatswain"
desc = "Drives the hands: shortens sail to save the ship and cargo in storms, and leads the boarders."

[roles.trader]
name = "Trader"
desc = "Haggles in port, shaving a little off taxes and prices."

[roles.accountant]
name = "Accountant"
desc = "Keeps the books and the hold: wages and stores are measured out, so long voyages eat less."

[roles.surgeon]
name = "Surgeon"
desc = "Tends the sick: fewer fall ill, and fewer of those die."

[roles.interpreter]
name = "Interpreter"
desc = "Translates and negotiates: talks and audiences go more smoothly."

[roles.caravan_leader]
name = "Caravan leader"
desc = "Leads the overland caravan: faster, and robbed less often."

[roles.industry_manager]
name = "Industry manager"
desc = "Runs the workshops and holdings for a better output."

# H01：瞭望长。岗位名与岗位说明（desc）的英文覆盖要逐字段齐全，草稿检查会查
[roles.lookout]
name = "Lookout"
desc = "Watches from the masthead: sails and weather on the horizon are seen sooner, even in fog."
