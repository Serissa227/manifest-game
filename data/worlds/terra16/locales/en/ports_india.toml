# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.diu]
name = "Diu"
lore = "The Portuguese fort on Diu sits on the harbor mouth, and every ship coming or going must take a pass from it. Yet the biggest shipowners on the quay are still local Gujaratis, and the clerks still cry their prices in Gujarati."

[ports.bassein]
name = "Bassein"
lore = "In 1534 the sultan ceded Bassein to Portugal, and the talk in the streets has changed its accent. Teak from the northern hills is lashed into rafts and floated down, and grain is loaded for Goa."

[ports.daman]
name = "Daman"
lore = "The Daman Ganga floats teak logs down from the hills one by one to dry in stacks along the river mouth. Hammers knock in the riverside yards, mending small craft of the coasting trade; ships bound for Surat or back to Bassein like to lie a night here."
river = "Daman Ganga"

[ports.khambhat]
name = "Khambhat"
lore = "The tide in the Gulf of Khambhat comes fast and high, a wall of water driving in at the flood. The big ships dare not enter and wait in the outer gulf while small craft ride the tide out with bales of cotton cloth and agate."

[ports.surat]
name = "Surat"
lore = "A cloth port at the mouth of the Tapti, its channel guarded by a stone castle finished in 1546. When the pilgrimage season comes, ships for Jeddah crowd the river bend, their decks covered with sleeping pilgrims in white."
river = "Tapti"

[ports.chaul]
name = "Chaul"
lore = "Chaul is cut in two: the upper town belongs to the Sultan of Ahmadnagar, while the lower town at the river mouth holds a Portuguese fort. The two lie a few miles apart, each collecting its own dues, and a merchant going in or out pays twice."
river = "Kundalika"

[ports.goa]
name = "Goa"
lore = "Goa spreads along the Mandovi, the viceroy’s palace and the churches looking down on the quays. On the Straight Street a bell rings for the morning auction: Persian horses, pepper, silks, and people too. Konkani, Persian and Gujarati churn together in the bazaar."
river = "Mandovi"

[ports.bhatkal]
name = "Bhatkal"
lore = "Hills rise right behind Bhatkal, and a trade road climbs the Western Ghats toward Vijayanagara. Arab horses come ashore here and are led up the hill one by one; the cavalry of that great capital depends on them."

[ports.calicut_port]
name = "Calicut"
lore = "The Zamorin’s beach market has no quay: big ships anchor offshore and goods come in by small boat. Pepper sacks are piled like hillocks, and merchants of every nation hold a stall each, speaking every tongue."

[ports.cochin_port]
name = "Cochin"
lore = "The Raja of Cochin has allied himself with Portugal, and the guns of Fort Manuel cover the harbor channel. The town’s Jewish merchants and St Thomas Christians carry on the pepper trade as ever; whoever the master is, they do their sums first."

[ports.colombo]
name = "Colombo"
lore = "On the coast of the King of Kotte, the Portuguese post buys cinnamon every day. The peelers bring it down from the hills roll by roll and sell it to the foreigners, yet they still owe service to the court of Kotte."

[ports.male]
name = "Male"
lore = "Cowries from the atolls and dried bonito are carried out by pilots who know the reef passages. A stranger who tries it alone will, nine times in ten, end up aground on the coral."

[ports.chittagong]
name = "Chittagong"
lore = "A port at the mouth of the Karnaphuli, from which Bengal cloth goes to sea, and musk from the hills is sold by weight in small leather pouches."
river = "Karnaphuli"

[ports.hooghly]
name = "Hooghly"
lore = "On the mudbanks of the Hooghly, rice, sugar and fine cloth are piled to wait for loading, and the footprints are wiped smooth by every flood tide. The channel to the old port of Satgaon is so choked that a pilot must stop to sound at every bend, and shipowners simply drop anchor here instead."
river = "Hooghly"

[ports.nagapattinam]
name = "Nagapattinam"
lore = "Printed cottons of the Coromandel Coast are shipped from here, red grounds and white flowers, hard to come by at Melaka and in Java. The Nayak of Thanjavur governs the port and calls Vijayanagara his overlord, but collects the dues himself."
