# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.atlantis_port]
name = "Atlantis Outer Harbour"
lore = "The outer harbor on the east side of the ring-city faces Gadeira across the sea. Rings of water and land close inward, the outermost wall sheathed in bronze and the next in tin; the people who live inside are still there."

[ports.persephone_isle_1]
name = "First Isle of Persephone"
lore = "The visitors’ anchorage on the eastern side of the seven isles, with shallow water and white sand. Ships rest here while the sailors lean on the rail and watch the mist, waiting for a gap they can see through before feeling their way toward the other isles."

[ports.persephone_isle_2]
name = "Second Isle of Persephone"
lore = "A small bay in the mist, the water flat as a mirror, taking only ships that have been admitted. Before you land, every piece of iron goes back down into the hold, and someone waits on the shore to see you finish."

[ports.persephone_isle_3]
name = "Third Isle of Persephone"
lore = "The island has a small market whose fruit and cakes smell unnaturally sweet. Old sailors take the newcomers by the sleeve and give one warning: be gone within three nights, and eat nothing."

[ports.persephone_isle_4]
name = "Anchorage of the Land of Women"
lore = "The Land of Women of Bran’s tale lies hidden among the seven isles. When a ship passes through the mist and the sailors hear singing, they know the shore is near; nobody can say whether the song is a welcome or a warning to hurry."

[ports.persephone_isle_5]
name = "Fifth Isle of Persephone"
lore = "White flowers bloom in the island’s woods and the leaves are fine as silver; ships anchor under the boughs. The sailors never learned its true name, and call it the Fifth Isle in order, the way one counts stars."

[ports.persephone_isle_6]
name = "Sixth Isle of Persephone"
lore = "To pass from the outer sea to the inner you must go through a mist, and at the Sixth Isle it turns a corner. A ship that has not been admitted sees only white at that turning, not even the shadow of a shore."

[ports.persephone_isle_7]
name = "Seventh Isle of Persephone"
lore = "The isle nearest Gadeira stands like a sentry for the seven, watching the outer sea. The wind on its shore always sounds, when you listen, like people murmuring; the dwellings of the elves are hidden there."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# The eastern outer harbour faces Gadeira; its coordinates and surviving ring-city are a game extension of ancient texts.
# The eastern guest anchorage of the seven isles; its numbered location is a game convention.
# The Land of Women from Bran's tale is placed among the seven isles as an explicit game extension.
# The isle nearest the direction of Gadeira watches the outer sea; its elven residents belong to this world's textual synthesis.
