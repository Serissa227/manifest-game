# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.ruin_pharos]
name = "Submerged Remains of Pharos"
lore = "The lighthouse Strabo described was thrown into the sea by two earthquakes. On calm days, rows of huge stones can still be seen beneath the fishing boats, like a skeleton that has come apart."

[discoveries.ruin_troy]
name = "Mound of Troy"
lore = "A mound on the plain, with shepherds driving their flocks across the top and layer upon layer of broken pottery in its sides. Most European visitors go farther south along the coast and take a different ruin for Troy."

[discoveries.ruin_knossos]
name = "Knossos Ruins"
lore = "On a hillside south of Candia, vines have grown over broken walls. The local guides will take you instead to the quarry caves near Gortyn, insisting King Minos’s labyrinth is there, and lead you in and out by torchlight along a thread."

[discoveries.ruin_carthage]
name = "Carthage Ruins"
lore = "Outside Tunis, Carthage’s stones were carried off long ago by the boatload and built into other cities’ walls. Only the outline of the round war harbor can still be made out, like a ring pressed flat at the edge of the sea."

[discoveries.ruin_delos]
name = "Delos Ruins"
lore = "Delos is small enough to walk across in a day, yet it was once the marketplace of the whole Aegean. The ancients ruled that no one could be born on the island and no one could die there. Now its only keepers are a few shepherds and a row of stone lions."

[discoveries.ruin_ephesus]
name = "Ephesus Ruins"
lore = "Year after year the river silt has pushed the coast farther out, until the harbor of Ephesus lies miles from the sea and no ship can reach it. The colonnades still stand at the edge of the marsh, and villagers from Ayasoluk lead their camels through underneath."

[discoveries.ruin_giza_pyramids]
name = "Pyramids of Giza"
lore = "Herodotus says the workers who built the Great Pyramid ate sixteen hundred talents of silver in radishes, onions and garlic alone. Now the people of Cairo have stripped off its white outer stone for their houses, and the rough steps of the core show through."

[discoveries.ruin_giza_sphinx]
name = "Sphinx of Giza"
lore = "The people of Cairo call it the Father of Terror. Sand buries it to the shoulders, and its nose is gone. The villagers say a man once knocked the nose off, and ever since, the sand has crept closer to their houses every year."

[discoveries.ruin_petra]
name = "Petra"
lore = "Pass through a gorge barely wide enough for one camel and the face of a temple appears, carved into rose-colored rock. The Bedouin here say that Moses struck water from the rock in this valley, and they still drink from that spring."

[discoveries.ruin_persepolis]
name = "Persepolis Terrace"
lore = "The Persians call this terrace the Throne of Jamshid, or the Forty Columns. Along the stairways march carved processions of tribute bearers leading horses and carrying jars. They have been walking for two thousand years and have not yet arrived."

[discoveries.ruin_basilica_cistern]
name = "Basilica Cistern"
lore = "Households here cut a hole in the cellar floor, lower a bucket and draw up water, sometimes with a fish in it. Pierre Gilles went down by boat with a torch and saw rows of columns marching off into the dark. After nightfall, nobody lowers a bucket."

[discoveries.ruin_great_zimbabwe]
name = "Stone Walls of Great Zimbabwe"
lore = "Not a dab of mortar holds these stones, laid course upon course into high curving walls. The Portuguese are sure this is Solomon’s Ophir or the palace of the Queen of Sheba. The Shona simply call it zimbabwe, the houses of stone."

[discoveries.ruin_angkor]
name = "Angkor"
lore = "In the galleries of Angkor Wat the monks have never stopped chanting. The story goes that a Cambodian king, chasing wild elephants deep into the forest, stumbled once more on the great stone city held fast in the roots of trees."

[discoveries.ruin_borobudur]
name = "Borobudur Terraces"
lore = "Under brush and volcanic ash, a small hill on the Kedu plain hides terrace after terrace of carved reliefs, with a Buddha seated inside each of the bell-shaped stupas at the top. The villagers say it is bad luck to go up, and few ever do."

[discoveries.ruin_chichen_itza]
name = "Chichen Itza"
lore = "The pyramid stairs are so steep you climb them on hands and feet. To the north lies the sacred well, deep and round, where Maya still come from far away to drop jade, copper bells and prayers for rain into the water. The old men by the well watch every stranger’s hands."

[discoveries.ruin_tulum]
name = "Seaward Walls of Tulum"
lore = "In 1518 Grijalva’s ships sighted this town from the sea, and the chaplain aboard wrote that it looked no smaller than Seville. Walls enclose it on three sides; the fourth is cliff and sea, and Maya canoes come and go from the little beach beneath the cliff."

[discoveries.ruin_tiwanaku]
name = "Stone Gate of Tiwanaku"
lore = "Cieza writes that when he asked the people here who built these gates, they told him the stones had appeared in a single night. Over the lintel a god holds a staff in each hand, and rows of figures run toward him from both sides, some of them with the heads of birds."

[discoveries.ruin_rapa_nui]
name = "Rapa Nui Moai"
lore = "The island’s stone figures stand with their backs to the sea, gazing at their own villages. The islanders say they are ancestors, and that they walked to their platforms by sacred power."

[discoveries.ruin_nan_madol]
name = "Nan Madol"
lore = "Basalt columns stacked crosswise like firewood enclose nearly a hundred man-made islets. The people of Pohnpei say two sorcerer brothers chanted the stones through the air. To go in, you must first ask the chief who holds this place."

[discoveries.ruin_vinland]
name = "Old Vinland Camp"
lore = "In the meadows at the northern tip of Newfoundland, long low banks of turf trace the shapes of houses. The Greenlanders’ saga says that more than five hundred years ago Leif Eriksson sailed west and wintered in a land where grapes grew."

[discoveries.ruin_greenland]
name = "Ruins of Greenland's Eastern Settlement"
lore = "By the fjord the stone walls of Hvalsey church still stand, roofless for many years. In 1408 it saw the last wedding anyone wrote down. Those who hunt seals from skin boats in the fjord now are another people."

[discoveries.ruin_galle_stele]
name = "Galle Trilingual Inscription"
lore = "Zheng He’s fleet set up this stone in Ceylon in 1409. The Chinese text honors the Buddha, the Tamil a Hindu god, the Persian Allah, and beneath all three the list of offerings is exactly the same."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Stonework under shallow water records harbour changes; later archaeological identifications are not presented as certain knowledge in 1553.
# Residents draw water through openings above the columns; Gyllius's later publication date remains distinct.
# The coordinate follows modern archaeology; characters can only observe the surviving forms.
# Chinese, Tamil and Persian inscriptions share the stone; visibility in 1553 is a stated game extension of a later archaeological find.
