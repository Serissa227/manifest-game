# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.plant_cinchona]
name = "Andean Cinchona"
lore = "Strip the bark from these trees on the slopes above Loja and it comes away reddish brown, so bitter that one chew numbs the back of the tongue. What the mountain people use it for, they do not readily tell outsiders."

[discoveries.plant_cacao]
name = "Cacao"
lore = "In Tabasco cacao beans are money; a hundred good ones will buy a turkey. The drink made from them is poured back and forth from a height to raise a head of foam, and those who know will tell you the foam is the best mouthful."

[discoveries.plant_vanilla]
name = "Vanilla"
lore = "The pods the Totonac pick are green and smell of almost nothing. They are spread in the sun by day and wrapped up to sweat at night, over and over for weeks, until they turn black and fragrant. The Mexica call it the black flower and use it to flavor cacao."

[discoveries.plant_tomato]
name = "Tomato"
lore = "Red and yellow tomatoes are heaped in the market, to be ground into sauce with chilies. In Italy, Mattioli’s book calls them golden apples and says some people there fry them in oil with salt and pepper, the way they cook eggplant."

[discoveries.plant_potato]
name = "Highland Potato"
lore = "By Lake Titicaca a single field can grow tubers in a dozen colors. They are left out to freeze on frosty nights and trampled dry by day until they become chuño, light and hard, which keeps for years. The miners of Potosí live on it."

[discoveries.plant_tobacco]
name = "Tobacco"
lore = "The Taíno light the leaves and draw the smoke up their noses through a forked tube; Oviedo says tabaco was first the name of the tube. Some old Spanish soldiers have picked up the habit and now cannot go a day without it."

[discoveries.plant_afo_clove]
name = "The Afo Clove Tree"
lore = "High on the slopes of the Gamalama volcano, the islanders call this oldest of clove trees Afo. In the few days when the buds turn from green to red, the whole village climbs up to pick them and spread them on mats to dry, and the scent drifts all the way down to the ships in the harbor."

[discoveries.plant_dragon_blood]
name = "Socotra Dragon's Blood Tree"
lore = "The dragon’s blood trees of Socotra open like umbrellas. Cut the bark and red resin seeps out and sets in drops like blood. Arab merchants call it the blood of the two brothers, and painters and varnishers alike compete for it."

[discoveries.plant_baobab]
name = "Baobab"
lore = "On the Swahili coast they call it mbuyu. An old trunk goes hollow and holds a bellyful of water in the rains to see the village through the dry season. The elders sit in its shade to settle disputes, and no one dares cut it down, for spirits live inside."

