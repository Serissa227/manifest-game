# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[ports.guam]
name = "Umatac, Guam"
lore = "Chamorro seafarers know the lagoon passages and the star paths; now and then a Spanish ship from afar anchors here, trading iron for water and rice."

[ports.tahiti]
name = "Matavai Bay, Tahiti"
lore = "Island navigators sail double canoes between the islands; a stranger’s ship must first find this bay, then slowly earn the islanders’ trust."

# Original notes: regular galleon traffic at Guam only after 1565; Tahiti is a hidden port that must be found first.
