# C2 英文显示覆盖；key 与中文一一对应，不覆盖坐标、供需和其他规则。
[discoveries.phantom_antillia]
name = "Antillia, Isle of Seven Cities"
lore = "Old Portuguese sailors say these are the seven cities built by the archbishop of Porto and six bishops who fled across the sea. When the fog thickens, walls and bell towers loom ahead of the bow. When it lifts, there is nothing but empty sea."

[discoveries.phantom_satanazes]
name = "Satanazes"
lore = "The chart of 1424 places it north of Antillia with a single name beside it: Satanazes, the devils. Sailors who have seen it in the fog head straight for confession when they make port. Ask whether they got close, and every one of them shakes his head."

[discoveries.phantom_st_brendan]
name = "Saint Brendan's Isle"
lore = "From the mountains of El Hierro, islanders often see one island too many out to the west. In 1526 the authorities sent ships to find it, and they came back having seen only fog. Saint Brendan and his monks sailed for seven years to reach it. It will not be found so easily."

[discoveries.phantom_hy_brasil]
name = "Hy-Brasil"
lore = "People on Ireland’s west coast say it rises from the sea once every seven years: a round island split in two by a channel through the middle. In 1480 the merchants of Bristol sent a ship to search for it all summer, and it came home empty-handed."

# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# Seven city-like shapes appear in mist, leaving only water when approached; the point is a game sighting area.
# The round island west of Ireland invites pursuit but has no reachable harbour.
