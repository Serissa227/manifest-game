# C8：英文显示覆盖；按 key 对应，嵌套数组按 key 或原下标合并，不覆盖玩法数值。

[skills.astral_navigation]
name = "Celestial navigation"
description = "At night, measure the height of the stars and check the figures against the sailing book."

[skills.tide_reading]
name = "Reading tides"
description = "Read the tide marks and the sound of the surf, and always leave room to spare when making landfall."

[skills.rigging]
name = "Rigging"
description = "Feel the tension of a line and trim the sail to the wind, so the canvas never flaps wild."

[skills.double_entry]
name = "Double-entry bookkeeping"
description = "Record each sum as a debit and a credit, then check goods and coin against the book, so the ledger tells the truth."

[skills.sword_iberian]
name = "Iberian common fencing"
description = "Steady footwork and a straight point, aimed to strike once and true. No flourishes."

[skills.sword_italian]
name = "Italian sword and buckler"
description = "A sword in one hand and a small buckler in the other, close work at short range, quick enough to blur."

[skills.sword_japanese]
name = "Japanese sword practice"
description = "Practice the grip and the draw first, then the cut and the return. The master says the blade learns before the man does."

[skills.staff_fujian]
name = "Fujian staff practice"
description = "Stance work, gate guard, and paired drills. Keep the hips steady and let the staff end follow the body."

[skills.sword_ottoman]
name = "Ottoman blade and shield"
description = "A shield in the left hand and a blade in the right. Press with the shield edge and strike from behind it, often from horseback."

[skills.firearms]
name = "Firearms"
description = "Load the powder, ram the ball, and prime the pan. Drill the three steps until the hands move alone, and keep them still at the shot."

[skills.diving]
name = "Diving"
description = "Hold your breath, count your heartbeats, and come up with a basket of oysters before the lungs give out."

[skills.herbal_medicine]
name = "Herbal medicine"
description = "Know leaves, roots and flowers by shape, and which ones are safe to brew. Good for minor complaints, not for serious illness."

[skills.cartography]
name = "Cartography"
description = "Measure distances, set bearings, and draw the shoreline. A chart is trusted only when the lines are true."

[skills.shipbuilding]
name = "Shipbuilding"
description = "Choose the timber, shape the keel, and join the planks. The curve of the hull has to be fixed in the mind before the first nail."

[skills.court_etiquette]
name = "Etiquette"
description = "The number of steps into a hall, the depth of a bow, the way a gift is offered. One misjudged inch and the court laughs."

[skills.negotiation]
name = "Negotiation"
description = "Learn what the other side fears before naming a price. Give an inch only when you can take two in return."

[skills.poetry]
name = "Poetry"
description = "Rhyme and break the lines so they can be recited aloud at a banquet without a stumble."

[skills.music]
name = "Ensemble and song"
description = "In ensemble, follow the beat of the lead player. When singing, keep some breath for the end of the phrase."

[skills.koto_playing]
name = "Koto playing"
description = "Pluck the strings and press the bridges, slide with the left hand, and keep the nails filed even."

[skills.oud_playing]
name = "Oud playing"
description = "A feather plectrum between the fingers, the body held against the chest, and the low notes come first."

[skills.calligraphy]
name = "Calligraphy and copying"
description = "Grind the ink, steady the wrist, and copy whole scrolls with even strokes that stand up straight."

[skills.embroidery]
name = "Embroidery"
description = "Stretch the silk on the frame and run the needle true. Lay the gold thread flat on the face and tack it down with fine silk stitches hidden beneath it."

[skills.incense_blending]
name = "Incense blending"
description = "Blend resin, sandalwood, and musk in seasonal proportions, so the scent lingers in a room without overpowering it."

[skills.knotwork]
name = "Knotwork"
description = "Work cords in pairs and braid them into patterns. The fingers must tie faster than the eyes can follow."

[skills.woodcarving]
name = "Woodcarving"
description = "Cut with the grain, block out the form first, then refine the detail. One slip of the blade and the whole piece is ruined."

[skills.painting]
name = "Drawing and coloring"
description = "Mix the pigments, lay the ground, and glaze in layers. Let each coat dry, or the surface turns muddy."

[skills.weaving]
name = "Weaving"
description = "Set the warp, throw the shuttle, and keep every thread equally tight, so the cloth lies flat."

[skills.cooking]
name = "Kitchen craft"
description = "Let the dough rest fully, judge the heat by eye, and cook the syrup until it threads."

[skills.tea_roasting]
name = "Tea roasting"
description = "Roast the leaves over low embers, turning them often. Scorched tea cannot be saved."

[skills.waxwork]
name = "Waxwork"
description = "Melt the wax, tint it, and pour it into molds. Set the brows and eyes while the wax is still soft."

[skills.riding]
name = "Riding"
description = "Sit deep and move with the horse’s stride. Take up the reins and let them out lightly."

[skills.quipu]
name = "Quipu accounting"
description = "Tie cords into counts, one cord for each ledger line. Color and knot style each record a different thing."

[skills.lang_arabic]
name = "Arabic"
description = "Arabic contracts, medical treatises and star tables, read line by line without anyone at your elbow to translate."

[skills.lang_aramaic]
name = "Aramaic"
description = "Grain accounts cut into stone tablets add up line by line in Aramaic, down to the number of checkpoints a caravan passed."

[skills.lang_catalan]
name = "Catalan"
description = "Catalan notes crowded into the margins of sea charts, smaller than the harbor names beside them."

[skills.lang_chinese]
name = "Chinese"
description = "Chinese classics and official papers, from posted notices to the characters stamped on a ship’s permit, need no guessing."

[skills.lang_dutch]
name = "Dutch"
description = "The rushed hand of Dutch clerks in the counting house, and the contracts and shipping papers beside it, all come clear."

[skills.lang_english]
name = "English"
description = "English sea journals, where the crew grumbles about the weather below deck, and every complaint names the wind and the port."

[skills.lang_french]
name = "French"
description = "French verse copied out in court, where the hidden meaning in each couplet is plain to a reader."

[skills.lang_geez]
name = "Geʽez"
description = "Geʽez scripture, where the congregation chants in unison and every line is known to reader and listener alike."

[skills.lang_german]
name = "German"
description = "German pamphlets sold in the market, clearly printed, with the prices spelled out in full."

[skills.lang_greek]
name = "Greek"
description = "Greek recipes name each leaf and root, copied onto sheepskin, and the apothecary’s boy measures from them."

[skills.lang_hebrew]
name = "Hebrew"
description = "Read Hebrew scripture and prayer books, and the letters merchants in different cities send each other in those square letters."

[skills.lang_italian]
name = "Italian"
description = "Venetian bills of exchange on thin paper, in a quick Italian hand. A seasoned clerk can tell a true bill from a forged one at a glance."

[skills.lang_japanese]
name = "Japanese"
description = "Japanese poem collections and documents. A Sakai contract is written cleanly, and a monk’s signature at the end of a letter can be picked out."

[skills.lang_kiche]
name = "Kʼicheʼ"
description = "K’iche’ almanacs set the planting days in a ring, and a highland elder can count around it and find the same day on the page."

[skills.lang_korean]
name = "Korean"
description = "On post-station horse tallies, Korean script runs alongside Chinese characters, and the route for passage is clear at a glance."

[skills.lang_latin]
name = "Latin"
description = "Latin lecture notes crowded with marginal glosses, which the masters correct line by line and students read aloud after them."

[skills.lang_malay]
name = "Malay"
description = "Malay sea logs note each port’s depth, wind, and anchorage in short lines in the corners of the page."

[skills.lang_mixtec]
name = "Mixtec pictorial literacy"
description = "A Mixtec picture page draws a royal line as a tree, with each branch carrying the name of a ruler."

[skills.lang_nahuatl]
name = "Nahuatl"
description = "Nahuatl tallies count cacao beans in the ledger, and when a market haggler opens his mouth you can follow every bargain word for word."

[skills.lang_old_javanese]
name = "Old Javanese"
description = "Old Javanese inscriptions are cut on temple stone stairs, and the verses wind around the reliefs, so one walk around the temple reads a stanza."

[skills.lang_pali]
name = "Pali"
description = "Pali is written on palm leaves stacked in layers, and monks run a fingertip along each line as they chant."

[skills.lang_persian]
name = "Persian"
description = "Persian verse is inscribed on garden tiles, and court decrees and caravan accounts share the same flowing hand."

[skills.lang_portuguese]
name = "Portuguese"
description = "Portuguese cargo notes list pepper by weight, and when a letter from Goa arrives, the quay knows the price before the ship is unloaded."

[skills.lang_sanskrit]
name = "Sanskrit"
description = "Sanskrit law codes are cut into copper plates. A line learned by heart in class leads to the full chapter on the reverse side."

[skills.lang_spanish]
name = "Castilian"
description = "Castilian ration lists record the biscuit and water aboard each ship, and a returning fleet’s report can be checked against them line by line."

[skills.lang_turkish]
name = "Ottoman Turkish"
description = "Ottoman Turkish customs registers are divided by port, and the seal of the customs house is pressed along the edge of every page."

[skills.lang_yucatec]
name = "Yucatec Maya"
description = "Yucatec Maya inscriptions carve dates as rings on stone, and the lucky day a priest names can be found in the same ring."

[skills.lang_swahili]
name = "Swahili"
description = "Swahili sea chants name the hours of the monsoon, and when the skipper calls one out, the ships in the East African ports know to raise sail."

[skills.lang_gujarati]
name = "Gujarati"
description = "Read Gujarati account books and letters. A Khambhat bill of exchange follows a fixed form, and one wrong word means the money will not be paid."

[skills.lang_quechua]
name = "Quechua"
description = "Quechua notices are fixed to the boundary stones of the post roads, giving the distance to the next pass and which bridge is out."

[skills.lang_mongolian]
name = "Mongolian"
description = "Mongolian seal script is cut into bronze seals, and documents in the felt tents carry the mark, which an envoy from the steppe can check on arrival."

[skills.lang_jurchen]
name = "Jurchen"
description = "Jurchen rock carvings run along the ridge, marking distances and springs, so a traveler knows where the water is at a glance."

[skills.lang_ryukyuan]
name = "Ryukyuan"
description = "Ryukyuan songs are copied onto thin paper, and when an envoy from Naha sings a verse, the lines on the sheet follow the tune."

[skills.lang_undeciphered]
name = "Undeciphered writing"
description = "The carved signs on the stone break into fragments. No one can read them, and no one can teach how."

[skills.arcana_natural_astrology]
name = "Natural magic and astrology"
description = "Herbs, hymns and silver plates engraved with figures, each used when a star reaches its hour. A master must speak the star-places aloud to someone already awakened. The academy teaches the theory, and ordinary star offerings have no force."

[skills.arcana_alchemy]
name = "Alchemy"
description = "The furnace never goes cold, and the master points at the king and queen in the woodcuts to explain the fire. Students must first awaken. The schools read only the printed words, and ordinary alchemy yields not a drop."

[skills.arcana_rosicrucian_healing]
name = "Rosicrucian healing"
description = "Rumor tells of a nameless brotherhood that heals the sick for nothing, dresses like the locals, and wears no sign. Only an awakened pupil is taught face to face by a sworn member. The book gives the art its name, but ordinary prayer cannot give anyone those hands."

[skills.arcana_steganography]
name = "Steganography"
description = "Trithemius’s manuscript seems to describe spirits summoned to carry messages, but those in the trade read it as writing hidden inside writing. A master teaches the method by mouth, and only to someone who has awakened. The classroom teaches ink, and an ordinary letter hides no power at all."

[skills.arcana_kabbalah]
name = "Letters and Kabbalah"
description = "Hebrew letters are counted as numbers, and the names of God are broken apart and set in a new order. Reuchlin’s book leads a reader only to the threshold. Those who have awakened are taught the rest, aloud, by a master. Many recite the names in worship, but only the ones a master has marked answer."

[skills.arcana_folk_warding]
name = "Folk warding"
description = "In Friuli they say children born with the caul leave their bodies on Ember nights, armed with fennel stalks, to fight the witches who steal the harvest with sorghum. A master teaches it line by line, to the awakened. Burning paper and chanting at home protects no one."

[skills.arcana_good_society]
name = "The Good Society"
description = "Old women in Milan say they slip out at night to the Lady of the East’s gathering, where a gnawed ox can be raised from its bones. Only the awakened are taught, by a senior member. Lessons give the rules alone, and ordinary rites give no power."

[skills.arcana_wind_knots]
name = "Wind knots"
description = "Northern wizards sell sailors wind tied in three knots: loose the first for a fair breeze, the second for a strong one, the third for a gale. A master shows each turn by hand, and only to the awakened. The school can explain the loops, but a knotted cord by itself raises no wind."

[skills.arcana_letter_squares]
name = "Letters and magic squares"
description = "Letters turn into numbers, and the names of God are set into magic squares, written on paper or engraved on silver to wear close. The grid is set only for the awakened, dictated by a master. Classrooms hang the diagrams, but reciting the numbers makes no magic."

[skills.arcana_talismanic_shirt]
name = "Talismanic shirt"
description = "Begun at an hour the stars appoint, the shirt is sewn close with verses and number squares and worn under armor. A master names its use to the one who will wear it, once awakened. The books show the pattern, but a shirt sewn by anyone else is only a shirt."

[skills.arcana_geomancy]
name = "Geomancy"
description = "Rows of dots are struck in the sand, sorted odd or even into sixteen figures, and the answer is read from them. A master teaches the lines to someone already awakened. The method sits in books, but without guidance, scattering grain and smoothing sand achieves nothing."

[skills.arcana_daoist_talismans]
name = "Daoist talismanic rites"
description = "Only a Daoist ordained with a register at Mount Longhu may draw talismans and lead the altar, and at court men have risen to grand secretary by writing blue-paper prayers. The steps and incantations pass to the awakened from a Daoist master. Classes show the talisman shapes, but ordinary rites grant no power."

[skills.arcana_spirit_writing]
name = "Spirit writing"
description = "Two people hold a forked wooden frame, and its stylus writes by itself in a tray of sand while one calls out the characters and another copies them down. An awakened hand is guided stroke by stroke by a master medium. Classrooms read the records, and an ordinary frame does not move."

[skills.arcana_fangshi]
name = "Fangshi arts"
description = "Adepts claim they can turn lead and mercury into gold and silver, and Tao Zhongwen went in and out of the palace on such claims. A fangshi teaches it in person, and only to someone awakened. The fire-times written in books bring nothing to a common alchemist."

[skills.arcana_white_lotus]
name = "White Lotus rites"
description = "White Lotus followers say Xiao Qin could chant city walls into collapse, and even Altan Khan beyond the frontier once believed him. The chant and hand signs pass face to face from teacher to the awakened. Academies teach the scriptures, but village gatherings never hand over the real art."

[skills.arcana_onmyodo]
name = "Onmyōdō"
description = "Onmyōji read directions and choose lucky days, steering travel away from the baleful gods, and the Tsuchimikado house has served the court this way for generations. Awakening comes first, and then a diviner teaches the board and chants. Schools teach the calendar, but ordinary rituals carry no power."

[skills.arcana_waka_spirit]
name = "The spirit of waka"
description = "The kana preface to the Kokinshū says poetry moves heaven and earth without effort, and that its power lies in thirty-one well-measured syllables. Only the awakened learn how each line is spoken, from a poetry master’s lips. Anthologies can be read, but reciting poems alone calls nothing down."

[skills.arcana_shugendo]
name = "Mountain ascetic rites"
description = "Mountain ascetics train in the hills of Kumano and Ōmine and blow conch horns to pray for wind for seafarers. Only the awakened are led into the mountains, where a master passes on the true words. Students can recite the mountain rules, but everyday blessings grant no power."

[skills.arcana_korean_rites]
name = "Korean ritual arts"
description = "Mudang beat drums and dance to drive affliction from sick households, and the Hwarin Office keeps them on its rolls. The rite passes from a shaman’s own voice, and only to the awakened. Classrooms can read the prayer texts, but a rite recited from a book carries no power."

[skills.arcana_ryukyu_blessing]
name = "Ryukyuan priestess blessings"
description = "Noro priestesses sing sacred songs to send ships to sea, and people say a sister’s guardian spirit rides on her brother’s sail. The blessing is given only to the awakened, and only by a priestess herself. Lessons cover the blessing words, but ordinary worship cannot receive the gift."

[skills.arcana_jurchen_shaman]
name = "Jurchen shamanic arts"
description = "The shaman ties bells at the waist, beats a single-headed drum to enter trance, and calls a sick person’s soul back from the dead. Only the awakened are taught the drum rhythm and chants, by an elder shaman at night. A class knows only where the art came from, and ordinary prayers have no effect."

[skills.arcana_maya_calendar]
name = "Maya calendrical divination"
description = "Priests reckon time in katuns of twenty years, thirteen to a round, and what happened once comes back in the katun of the same name. Only the awakened learn the count, one day at a time, from a calendar keeper. Students can see the almanacs, but casual readings bring nothing."

[skills.arcana_nahual]
name = "Nahual and day signs"
description = "Day-keepers open the book of 260 days and choose a lucky naming day from a child’s birth sign, and the old people say the nahualli can take the shape of a beast. An older diviner passes down the day names and omens, to the awakened alone. The school keeps the calendars, but the calendars alone cast nothing."

[skills.arcana_pochteca_disguise]
name = "Pochteca disguise"
description = "Long-distance merchants put on foreign clothes, take on foreign hairstyles and accents, and slip into enemy markets to gather news. The art is passed on through a senior merchant’s hands-on teaching, and only to the awakened. Classes read records of disguise, but a costume alone changes no one."

[skills.arcana_taino_behiques]
name = "Taíno behique arts"
description = "The behique fasts and purges, snuffs cohoba to speak with the zemís, and sucks the sickness out of the patient’s body. Only the awakened learn the songs and herbs, from an elder behique. A classroom can name the art, but ordinary singing and dancing grant nothing."

[skills.arcana_kongo_nkisi]
name = "Nganga and nkisi"
description = "The nganga packs herbs, earth and bits of bone into a bundle or the belly of a carved figure, and once sealed it holds a power of its own. Only the awakened learn the spells and sealing methods, spoken by a priest. Lessons show only drawings, and a cloth figure hung in the house holds no power."

[skills.arcana_benin_arts]
name = "Benin court arts"
description = "Queen Mother Idia used secret arts to help her son win the war with Idah, and the art also asks Olokun of the sea for wealth and children. Only the awakened are taught, by older women inside the palace walls. A classroom teaches court manners alone, and ordinary offerings grant no power."

[skills.arcana_shona_medium]
name = "Shona mediumship"
description = "The spirits of past kings, the mhondoro, speak through their mediums, asking rain for Mutapa’s ruler and people and settling disputes. An elder medium brings the awakened novice in. Students hear the medium’s stories, but calling out the ancestors’ names draws no spirit."

[skills.arcana_ethiopian_scroll]
name = "Protective scroll craft"
description = "A däbtära cuts parchment to the owner’s height, writes prayers on it, and paints wide-eyed angels, and the scroll is then rolled up and carried close. The craft needs an awakening and a scribe master’s hands-on teaching. Classes teach the writing, but a scroll made without the master’s words has no force."

[skills.arcana_sikidy]
name = "Sikidy"
description = "The diviner divides fano-tree seeds into heaps, sets them odd or even in a grid, and reads from sixteen figures which day to choose and what offering to make. Only the awakened learn it, grain by grain, from a diviner. The school can explain the figures, but seeds scattered without training divine nothing."

[skills.arcana_malay_sea]
name = "Malay sea rites"
description = "The sea pawang chants to calm the spirits of the sea and pushes offerings out on a little boat, asking for fish and safe passage. An old sailor passes it on aboard ship, to the awakened. Schools teach the sea rituals, but offerings made at the quay grant no power."

[skills.arcana_babaylan]
name = "Babaylan arts"
description = "Babaylan are mostly women, who dance to the sound of horns, offer a hog, and let the spirits speak through them, and the people of Cebu call on them for healing and omens. Only the awakened learn the songs and herbs, from an elder healer in the hill villages. Lessons cover where the art came from, but village festivals bestow nothing."

[skills.arcana_siam_auspices]
name = "Siamese court auspices"
description = "Court Brahmins fix the auspicious hour, and at the royal ploughing the sacred oxen choose among rice, beans, liquor and grass to foretell the year’s harvest and rain. Only the awakened are taught aloud by a court astrologer. Lessons cover the day-counting method, but picking an auspicious day alone brings no power."

[skills.arcana_star_paths]
name = "Polynesian star paths"
description = "Old navigators teach the paths only aboard the canoe, pointing at the stars as they rise, and only to someone who has awakened. Classes teach the star names, but a night voyage alone does not teach the paths. No one learns them ashore."

