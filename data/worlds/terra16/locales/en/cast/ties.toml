# C6：每条关系的英文说明；关系结构、日期与条件取中文分片。

[ties.mio_wandeng]
note = "A boy off a Fujian junk that drifted into Shimoda said his cousin carried the lamp at the Tianfei temple in Yuegang. Mio sent a letter back with him asking after the ships from the Gotō Islands, and Tosa’s tides and Yuegang’s lamp have kept in touch ever since."

[ties.najma_baraka_childhood]
note = "The year the monsoon brought a Kilwa ship into Julfar, two children quarreled over the name of a star. Neither gave in, so they agreed to pick it up again when the next ship came."

[ties.najma_baraka_letters]
note = "Najma writes from Zabid and Baraka answers from Cairo, and their letters always pass each other somewhere on the Red Sea. Each one asks one more question than the last."

[ties.noel_tariq]
note = "A letter takes half a year to cross the strait, and every one of them is an argument. Neither writer will be the first to sign off with “You were right.”"

[ties.ix_xochitl]
note = "In Mérida one is a conquered Maya, the other a Mexica girl whose people came with the conquerors. Xochitl sneers at the Maya, yet she picks up the words Ix Nikte' teaches her faster than anyone."

[ties.baraka_mio]
note = "The boy Baraka once pulled from a slave trader’s hands now goes by Yasuke and serves at Nobunaga’s side. Through him, a shipowner from Kilwa and one from Tosa have begun to write to each other."

[ties.kaicili_wandeng]
note = "The year Lin Feng’s ships stormed into Manila Bay, Kaicili and Wandeng were haggling over a cargo. Before long the table held something else: a list of boat families to be taken off that night."

[ties.mio_ushio]
note = "Milk-sisters, nursed by the same woman. When Mio entered court service, Ushio followed her to Kyoto in the guise of a maid, and never once told Mio about the sneers she met there."

[ties.mio_yuki]
note = "The Reizei daughter spent a whole year finding fault with Mio’s poems. At the autumn contest Mio’s side lost, and the judge found her poem too forceful. Afterward Yuki skipped the winners’ sweets, sat down across from Mio with a fair copy of the verdict, and asked how the line Mio had cut before handing it in used to go."

[ties.mio_yasuko]
note = "Hirohashi Yasuko, widow of the regent Kanefuyu, opens the way for Mio to serve at court, through a sister who waits on the emperor as a senior lady-in-waiting. The first lesson: answer from behind the blind, and never say everything. Yasuko does not forget the favor."

[ties.lieve_ines]
note = "The chambers of rhetoric take no girls, so Lieve and Inês started a poetry circle of their own. Their first book of poems was copied onto ruled paper Lieve brought home from the counting house; Inês complained that the lines boxed the verses in, and Lieve said that was what kept them straight."

[ties.lieve_bianca]
note = "A debt that will not be extended brings Lieve to Bianca’s countinghouse, which opens only after the lamps are lit. Each has found the other’s limit, and each is waiting for the other to give way first."

[ties.najma_rania]
note = "Whenever Najma recites the first half of a sailing verse, Rania jumps in with the rest, never minding a lopsided rhyme. Their poems name more harbors than they manage rhymes."

[ties.najma_shadia]
note = "Every race they sail is for the same stake: the loser mends the winner’s sail. After one of them they lay on the deck picking out Canopus, and neither said a word about whose sail needed mending."

[ties.najma_salima]
note = "Gulbadan’s ladies stayed in the Hijaz for years, and for those years Najma and Salima corrected each other’s poems. Salima cuts words without mercy; Najma will not surrender a single star name. Their Persian and Arabic lines share one book."

[ties.wandeng_xu]
note = "The master called on Wandeng to recite, and halfway through the words ran out; from behind the curtain someone softly gave the first two words of the next line. After class Wandeng went to the curtain to say thanks, and Xu Cai only asked, “What are you thanking me for? If you knew the book by heart, would you need the curtain?”"

[ties.qin_wandeng]
note = "Qin Hongying runs her escorts on a single rule: lost cargo can be paid for, but everyone comes home. On her first run, Wandeng was planted behind the escort flag with orders to watch the people, not the goods."

[ties.wen_wandeng]
note = "Wen Xingcha spreads out her grandfather’s ocean star chart and has Wandeng keep two columns, one for hearsay and one for what she has seen herself. Mix them up, and the whole page gets copied again."

[ties.ix_ines_solis]
note = "In the convent forecourt they teach each other their languages. Ix Nikte' asked why Castilian calls home a house one moment and a hearth the next. Inés had no answer, and had never once wondered who carried in the firewood for her own family’s hearth."

[ties.esther_nala]
note = "The two girls around Tariq are each other’s best friends. Esther can chant the accounts of three currencies like a song, and Nala catches every note she sings off-key."

[ties.wati_nyai]
note = "Wati can sniff a sack of nutmeg and name the Banda island it came from; Nyai Gama can tell you, without opening her book, the day every pepper ship leaves port. When they trade pantun, one opens with nutmeg and the other with pepper, and every closing line is a dig at the other’s prices. At the scales, neither budges by a single coin."

[ties.zubayda_amina]
note = "Amina, the elder sister, copies the books; Zubayda sells them. When Zubayda haggles she always names her sister’s wages first, and Amina always says she has named them too high."

[ties.cecilia_amaia]
note = "On Ember Day nights Cecilia sleeps like the dead. The one who sits by her bed, afraid she will not wake, is Amaia, the woman everyone calls a witch."

[ties.esther_zaynab]
note = "Esther walked forty days of desert with Zaynab’s salt caravan. At night Zaynab taught her the stars and she taught Zaynab to keep accounts; apart, each still sets aside the cost of a reply before anything else."

[ties.tun_suri_mali]
note = "When Ayutthaya fell in 1569, Mali fled south leading a cow elephant. Years ago she had taught Tun Suri to ride; now Tun Suri has built a stable at the mouth of the Johor for her and the elephant, and neither of them means to leave."

[ties.naya_kaede]
note = "Kaede, the guard from Iga, knows nothing about tea, so Sayo whisks her a bowl every day. The year Nobunaga came collecting famous tea wares, Kaede slipped a tea caddy into her own pack in the middle of the night."

[ties.matsuru_haewol]
note = "A Jeju fishing boat with half its mast gone drifted into Naha, and the diver aboard was asking for rope to mend nets the moment she stepped ashore. Matsuru squatted beside her to learn the knots, and the first one she tied went solid as soon as it hit the bucket. The diver laughed, took the rope from her, and showed her how a knot is tied for the water."

[ties.sowol_haewol]
note = "The year Haewol moved from Jeju to Busan, she went to the office to report the three nets the raiders burned in 1555. Sowol, copying for the clerk, wrote the regulation three lines on the front, then turned the sheet over and asked her to tell it again from the start. The back filled up with Haewol’s own words."

[ties.frana_eleni]
note = "Chios changed flags. Eleni’s family stayed, and the old scales went to the new tax collector. Every tapping season Frana comes to the island for a month, always three days late, and every year Eleni saves her the season’s first tear, folded in a fig leaf."

[ties.ismene_silver_branch]
note = "The woman with the silver branch teaches Ismene to listen to the outer sea. In return Ismene has her teacher stand before the orichalcum pillar and read the law through again, every word."

[ties.ushio_yuki_rivals]
note = "At a practice poetry match, Reizei Yuki remarked that a maid could write poems too, then took up her brush and turned Ushio’s poem of the night tide into palace pine wind and moss. In front of the whole room Ushio struck out all three changes and wrote her own words back. Only the last word, the one Yuki had cut, she never put back."

[ties.tommaso_alvise]
note = "Tommaso remembers every costume Alvise ever borrowed from the company, and he reminds his old friend that a stage can be borrowed but the people offstage are not props."

[ties.kikuchiyo_kogo]
note = "A family north of the city sent a matchmaker, and the Asukai house told Kikuchiyo to turn the match down with a poem of his own. He carried a sack of rice to Kogo under the persimmon tree and asked her to write it. There was one line he couldn’t bring himself to say as written, so she handed back half a measure and told him to fix it himself. He rewrote it three times on her doorstep before the poem was his."

[ties.mio_kikuchiyo]
note = "Kikuchiyo means to win his kemari license on his own footwork, but he can’t bring himself to say “I’m going to try for it” in front of anyone. Mio doesn’t say it for him. She just stands at the edge of the court and counts his kicks, one by one."

[ties.mio_takamaru]
note = "Takamaru beat Mio in the Shimoda river-mouth race and jeered that a court princess couldn’t pull an oar. Now he patches up a rickety kobaya while Mio copies tide tables for him, and they mean to teach every new hand to read them."

[ties.mio_kogo]
note = "Mio caught Kogo ghostwriting love poems for rice and, instead of reporting her, asked to be taught the court ladies’ way of writing. Whom those poems were for, Mio has never asked."

[ties.lieve_jan]
note = "Jan was saving penny by penny for a set of type of his own, and Lieve worked out the price of lead for him, pointing out in passing that he had set an accent backward. He didn’t believe her, checked, and found she was right."

[ties.lieve_sophie_lemaire]
note = "Sophie wants her family to choose their own road out, so Lieve copies the fares and tolls of every route into one table. Sophie checks it line by line and finds a figure that doesn’t match what Lieve said last time."

[ties.najma_kabir]
note = "Kabir has lost three races to Najma and blamed a change in the wind every time. Now he means to fix a dangerous shoal by his own sightings. Najma checks his figures against her star tables, and neither will admit a mistake first."

[ties.najma_abdullah]
note = "Najma teaches Abdullah the stars, and he teaches her how to breathe before a dive. They have gone through the pearling boat’s old debts note by note, with Najma reading out the figures."

[ties.najma_zahra]
note = "Zahra sits up collating manuscripts for her teaching license, and Najma keeps her company. In the margin one line says “Source?” and the next is a star name Najma has filled in."

[ties.lin_wandeng_zhou_yan]
note = "Zhou Yan dries out the village deeds the water ruined, one sheet at a time, while Wandeng holds a lamp so he can make out the characters. Every character they recover gives a family that lost its papers one more witness."

[ties.lin_wandeng_chen_dong]
note = "Chen Dong wants a bout with staves before any conversation. He is hunting the garrison’s missing pay, and Wandeng asks around the fishing households for him on a single condition: no fisher takes the blame."

[ties.ix_nikte_balam]
note = "Balam tried to buy the canoe from Ix Nikte', and she told him to crew on it for three months instead. If he wants to trade cacao for salt without his father’s price list, he has to learn to read the people aboard first."

[ties.ix_nikte_kan_pech]
note = "What Kan Pech copies out, page by page, is when to sow, when to pray for rain, and which days are bad for setting out. Ix Nikte' finds households who can be trusted to keep it, only a few pages to each, so no single fire can take it all."

[ties.noel_diego]
note = "Diego won their first bout, and Noël told him his left foot was too slow. Diego fumed for three days and quietly fixed it. Now the two trade barbs while chasing down the theft pinned on a page."

[ties.noel_isabel_soto]
note = "Isabel drags Noël up the cathedral bell tower at midnight to watch the stars. She writes down every measurement she takes and gives Noël the copies to keep, as proof that the charts are her work."

[ties.noel_margarita]
note = "Margarita stood up to the steward to get back the maids’ withheld wages, and Noël keeps their common ledger exact to the last coin. The other maids say she asks this particular knight for help rather too often."

[ties.tariq_musa]
note = "Musa is tracing the false silver so his father’s guild won’t carry someone else’s debt. Going down into the cellars, Tariq holds the torch while Musa leads, counting the steps and telling a joke for each one. The deeper they go, the fewer the jokes."

[ties.tariq_aisha]
note = "Aisha teaches the neighborhood girls to read at home, Tariq’s sisters among them. He brings her books he has taken at sea; she accepts them, and then tells him to stop taking ships."

[ties.tariq_nala]
note = "Nala collects the home songs exiles still remember, accent and all. Tariq tracks down old people who can still sing the old tunes for her, but when it’s his turn to sing, he tries to get out of it with a joke."

[ties.tariq_esther]
note = "Tariq and Esther grew up together and now check exiles’ travel money side by side. In Esther’s ledger, even the meals Tariq owes her are written down."

[ties.kaicili_raja_muda]
note = "In a pantun contest Raja Muda capped Kaicili’s verse, and both of them stopped short. Later Kaicili lent a ship to Johor’s envoys on one condition: no kneeling between schoolmates."

[ties.kaicili_suma]
note = "Suma drags Kaicili to the market to haggle, telling him that even a prince has to know money. She takes him along house to house as she checks the dyers’ wages, and when she haggles with him she gives up not a single coin."

[ties.kaicili_wati]
note = "Wati holds that the people who grow the nutmeg should name its price. Kaicili walks her through every monopoly contract he has seen in the Clove Islands, and she writes down the harshest clause most carefully of all."

[ties.kaicili_nyai_gama]
note = "Nyai Gama’s pepper contracts spell out delivery and default to the letter. When Kaicili’s ship came in a day late, she fined him by the contract, he paid by the contract, and neither said another word about it."

[ties.baraka_salih]
note = "Salih is compiling a spoken catalog for his blind teacher, and Baraka turns each book’s history into a little story so the old man can remember it. Salih ends up knowing them better than his teacher does."

[ties.baraka_zubayda]
note = "Zubayda sold Baraka a book with missing pages on condition that he come each week to copy one back in. Later he brought her a few stray leaves from Kilwa, which counted for several weeks’ work."

[ties.baraka_amina]
note = "Amina is fighting for daylight working hours and a fair price for paper on the copyists’ behalf. She leaves the haggling with the paper sellers to Baraka, who rarely gets past his third story before they give way."

[ties.school_ushio_reizei_yuki]
note = "The Tanabata poem Ushio could not bring herself to read aloud was one Yuki wrote for her, and Yuki never asked for it back. On the day their years at court came to an end, they settled just one thing: their letters need not all pass through Mio’s hands."

[ties.adult_ushio_reizei_yuki]
note = "When Ushio’s ship comes in, Yuki’s letter is already waiting on the quay, addressed to Ushio alone. The poem from all those years ago, Ushio has finally read aloud."

[ties.school_ines_costa_sophie_lemaire]
note = "As always, Inês wrote half a line and pushed the poetry book across to Sophie, who pocketed it and said the other half would take a long time. They agreed that if either of them ever had to leave, the other would keep a passage for her."

[ties.adult_ines_costa_sophie_lemaire]
note = "Sophie sends the poetry circle’s book back with that half line filled in at last. The passage Inês’s family set aside has been waiting for her ever since."

[ties.school_rania_zahra]
note = "During a break Rania jumped in and added six lines to a sailing poem, and Zahra said her rhymes limped along like a camel. Rania shot back four more lines on the spot, with the camel and Zahra both worked in. The old lady sent them out of the room together, and they were still arguing on the gallery when the water seller packed up."

[ties.adult_rania_zahra]
note = "Every time Rania’s ship makes port, she brings Zahra a book. Zahra’s notes on the flyleaf have changed from finding fault with the rhymes to asking when the next ship is due."

[ties.school_xu_cai_xiao_man]
note = "Xiao Man teaches Xu Cai to row, and the first character Xu Cai teaches her is the Man of her own name. On the last day of school, in front of the Tianfei temple, they agreed that whenever Xiao Man sails abroad, Xu Cai will write the charm she carries."

[ties.adult_xu_cai_xiao_man]
note = "Xiao Man now owns her own fishing boat, and the board hung at its bow bears Xu Cai’s writing. The night before every voyage, the two of them linger at the Tianfei temple for as long as a stick of incense takes to burn."

[ties.school_xochitl_ines_solis]
note = "Inés recited “your people shall be my people” from the Book of Ruth, and Xochitl answered with a Nahuatl song that meant much the same. They agreed that someday their inscriptions would take a line from each, and whoever left first, the other would finish it."

[ties.adult_xochitl_ines_solis]
note = "In a feather workshop in Mexico City, the new pictures are signed in two languages, one line in Castilian and one in Nahuatl. The two hands that sign them now work at the same bench."

[ties.school_diego_lorenzo]
note = "Lorenzo can mimic anyone’s accent but has never once mimicked Diego’s. When their pageboy years ended they agreed that whichever side they end up on, if either hears the other being gossiped about, he will shut it down first."

[ties.adult_diego_lorenzo]
note = "When they meet again as men, one wears an officer’s coat and the other interprets for hire in Granada. Diego is as blunt as ever, and Lorenzo still lets him be, smiling."

[ties.school_musa_yaqub]
note = "One debased Saadian coin got the two of them locked in the market inspector’s lockup for a night, and they passed it dropping coins on the flagstones and guessing true or false by the ring. Musa promised that whenever he came home from a dig, the goldsmith’s door would be the first he knocked on."

[ties.adult_musa_yaqub]
note = "Each time Musa comes back from the south, he is standing in the goldsmith’s shop before he has beaten the sand off his boots. Yaqub, as ever, listens first to whether the silver in his purse rings true."

[ties.school_salih_ilhan]
note = "On the day of the flood festival, Ilhan claimed he happened to be going that way and walked with Salih to the nilometer on Roda Island. They agreed to come back next year and see which mark the water reached."

[ties.adult_salih_ilhan]
note = "Every year when the Nile rises, the same two men stand by the nilometer on Roda Island. Ilhan still says he was passing by; nobody has believed him for years."

[ties.school_raja_muda_daeng]
note = "Daeng wanted no reward, only a berth kept for him at the river mouth. Raja Muda claimed one for him at the mouth of the Johor, and since then has only ever told him which night the tide runs high, never given him an order."

[ties.adult_raja_muda_daeng]
note = "The berth now holds a boat of Daeng’s own. When Raja Muda comes down to the river mouth to find him, he never brings his retinue."

[ties.school_kabir_shadia]
note = "Two people who had each lost to Najma three times recognized each other on the quay. Shadia, as usual, called him out to race again when the season turns, with the last race’s loser choosing which shore marks the finish."

[ties.adult_kabir_shadia]
note = "Kabir pilots out of Cambay and Shadia races out of Muscat, and whenever the monsoon turns they race a stretch of sea. The loser says the wind changed, the winner doesn’t believe it, and afterward they sit side by side waiting for the moon."

[ties.school_huang_dun_suma]
note = "In 1568 Huang Dun brought his own ship into Gresik for the first time. Suma skipped the pleasantries and had him write out every dyer’s wage, one to a line, without a single figure wrong."

[ties.adult_huang_dun_suma]
note = "At the year-end reckoning Suma asked only one thing: which month next year? Huang Dun was still mumbling that his family’s ships didn’t move on his say-so when she wrote the fifteenth of February on the new year’s page. On that day his ship came into Gresik on time, and it has every year since."

[ties.school_mathijs_jan]
note = "Mathijs slipped an unsigned play into Jan’s type case with nothing more than “Set this for me, would you?” Jan set it, but whether he understood it, he hasn’t said."

[ties.adult_mathijs_jan]
note = "When the unsigned play at the rhetoricians’ festival ended, Jan was the one man in the house who didn’t clap. The next spring, under the drying lines of the print shop, he unpegged a small sheet printed the right way round and handed it to Mathijs as his answer, the ink still damp. The day after, Mathijs put his own name to a play for the first time."

[ties.mathijs_jan_crush]
note = "In the school play, Mathijs played a heroine with a monologue he had added himself. All the while he spoke it, he never once looked toward where the printer’s apprentice sat."

[ties.marta_lobo_maria_da_luz]
note = "Maria took the woman on the quay, clutching a single oilcloth tube, for a runaway bride and gave her a room above the warehouse. To the rest of Goa they are landlady and lodger. The lodger has put down her drawing pen and keeps the books in the counting room, and now and then traces a sea route across Maria’s palm with a fingernail."

[ties.yasmin_miriam]
note = "Miriam always lingered a little when she came to collect a painting, and in the corner of a miniature she was not allowed to sign, Yasmin painted in a woman with a basket. Then a missing page of the Shahnameh bound the two of them together."

[ties.radhika_aishath]
note = "Three winters into the Portuguese occupation, Radhika finally reached Male with the monsoon, and the customs man skimmed one agate in ten. That night she threaded the three beads she had never been able to send onto the chain at Aishath’s throat, until Aishath caught her hand and asked her not to grind the next one too quickly."

[ties.qin_hongying_shen_zhiwei]
note = "Shen Zhiwei covered half the hole in the imperial kiln’s accounts from her own savings and went back to Jingdezhen to answer for the rest. On the rainy night before she left, Qin Hongying promised to run an escort up to Jingdezhen once a year, and not at triple the fee. Shen insisted she charge it all the same: the men’s share was not to be skimped."

[ties.ilona_ludmila]
note = "A traveler from the Black Sea burst into the Old Town library at midnight and found Ludmila reading by candlelight. Ludmila asked only one thing of her: some day, by daylight, to read her a page. Whether either will stay, neither has said."

[ties.ana_cruz_lucia]
note = "Lucia taught Ana to read type, and Ana taught Lucia how a hummingbird’s feathers change color in the light. The year the press ran short of paper, Ana put up her fee for a feather icon, and neither shop had to close."

[ties.jean_leblanc_pierre_cardon]
note = "Every door Pierre builds for Fort Coligny opens from the inside; in the Tupinambá village, Jean keeps a hammock slung for him. Two ways out stand ready, and neither has been first to ask whether they take one together."

[ties.kutti_diogo_rocha]
note = "To the Portuguese, Diogo is a traitor; Kutti took him in and became half a traitor in his own people’s eyes. Ever since, they have kept the night watch at the river mouth together."

[ties.nikos_murad]
note = "Every night Nikos dives for stones from the old Pharos, and every night Murad on the citadel walls pretends not to see. Not until a lead tablet with writing on it came up did the two of them speak by daylight."

[ties.theodoros_tommaso]
note = "Tommaso coaches Theodoros on playing the imperial heir more convincingly, and Theodoros turns away the creditors who come for the company. Among all the true and false pedigrees, that much is true."

[ties.karim_mansur]
note = "For years Karim and Mansur fought over pilgrims on the same monsoon route. The Portuguese passes put them on the same side for the first time, and now when they draw up their sailings, each keeps a berth for the other."

[ties.hans_brock_solveig]
note = "When the northern war ended, Hans and Solveig wrote “westward” in the same logbook. He calls it an old woman’s tale; she says a story is more honest than a ledger. Either way, both want to see for themselves what became of the Greenlanders."

[ties.kaspar_griet]
note = "In November 1576, Kaspar, who had drunk on credit there for years, knew which street the mutineers would come down, and pulled the doors off Griet’s tavern for a barricade. Behind those doors, Griet kept food for whoever survived."

[ties.mokichi_park_sowol]
note = "Mokichi in Hirado and Sowol in Busan have written to each other for years by way of the Japan House’s official packets. The official tone has shifted more than once, but neither has ever cut a word from the private note tucked inside."

[ties.lu_guifan_catarina_pereira]
note = "Neither family will agree. On the day Macau paid its ground rent to Xiangshan County, Lu Guifan and Catarina wrote their names side by side in front of the A-Ma temple, and where they live from now on is theirs to decide."

[ties.lin_hui_pedro_ocampo]
note = "From the Parián to the foot of the city wall, Lin Hui reads out a name and Pedro writes it down, once in Chinese characters and once in Spanish. Whether the person behind each name is still there, they go and see for themselves."

[ties.vaiere_tomas_mendoza]
note = "Vaiere hauled the lost Tomás into her canoe and let him fret a few days longer than he needed to. Where they sail, and when he learns where the islands lie, are hers to decide; the way back to the galleon has always been left open to him."

[ties.nyai_gama_huang_shouguan]
note = "Nyai Gama set the wedding day, and Huang Shouguan wrote back that he would be there without fail. He was a month late anyway; only his message arrived on time. She took no offense. She moved the day back a month in her ledger, and since then the counting room in Banten has kept a single set of books."

[ties.fatima_suleyman_celebi]
note = "The year Bayezid rose in revolt, Süleyman’s collection held a few lines that should never have been written. Lady Fatima, minding the coffeehouse stove, decided which pages to burn and which one to keep; how to answer for those lines is his own business."

[ties.griet_vanbeek_matthias_hoffmann]
note = "“Let’s make it together” was Griet’s idea, on condition that if it worked, her name came first. Matthias never admits defeat out loud, yet his failed clock wheels and her ruined lenses are logged in the same notebook."

[ties.aisling_pieter]
note = "Aisling says she “invited” Pieter aboard to chart the coast; she never asked whether he wanted to come. The seasick mapmaker retched the whole way, and when he reached the last bay of Connacht, he signed the corner of the chart with his own name."

[ties.marion_bernat]
note = "Marion runs the fishery, Bernat works the ice-bound sea, and they argue whenever they meet. That first winter, it was Marion who spoke first: their winter stores would go into one account."

[ties.ko_haewol_shin_gyeong]
note = "Ko Haewol once pulled Shin Gyeong out of the sea off Jeju. Ever since, she decides which tide they meet on, and Gyeong has learned to wait on shore until she waves him over."

[ties.alvise_hasan]
note = "The winter war broke out over Cyprus, soldiers stood at the gate of the Venetian house in Galata, and the wind snapped the hinge of the side door. Hasan the shipwright went and asked for the job himself, and it took him three days. Once the door was mended, whatever passed between the two of them stayed on the inside of it."

[ties.gu_zhao_yashichi]
note = "The letters of amnesty went back and forth between the two sides, always carried by Yashichi, the interpreter from Wang Zhi’s fleet. Gu Zhao, a captain in Yu Dayou’s army, promised nothing except this: the man who carried them would be under his protection."

[ties.genroku_joao_fernandes]
note = "Nagasaki has only just opened, and the great ship comes once a year. João tucks his letters to Genroku into the ledgers and gets them ashore before the cargo; before any sailing date is fixed, the two have already met on the quay."

[ties.vikram_khurram]
note = "Khurram brings warhorses by sea, and Vikram beats down the price for Vijayanagara. Before the price was settled, word came that the Deccan sultans had joined forces; the first thing the two agreed on was how the grooms would get out of the city alive."

[ties.extra_01_cecilia_frana]
note = "Frana came up to check the foreigners’ residence papers, frowning from the moment she walked in, and on her way out she ordered a mask, almost as an afterthought. Ten days later it turned out to be a frowning face. She laughed in spite of herself, and hung it in her study where she would see it every time she looked up."

[ties.extra_03_marta_lobo_yasmin]
note = "The buyer never came, so Marta spread the chart of the strait she had brought from Goa across a table in the governor’s painting room. The new Persian painter said the sea was too pale, and asked why the corner had no name in it. Marta set a brass weight on that corner. When she went off at dark the chart stayed behind, along with a parting word: she was not paying for the paint."

[ties.extra_04_naya_sayo_matsuru]
note = "Sayo sent new tea to Naha by ship, and the answer came back in three words: “Far too bitter.” In spring she went herself and found Matsuru stewing the leaves like medicine. She coached her bowl by bowl until the third one finally frothed, and when she sailed home to Sakai she left the whisk and the white linen bowl cloth behind."

[ties.extra_06_magdalena_ilona]
note = "Well after midnight a woman with a soaked shoulder burst into the Old Town workshop. She wouldn’t sit, only stood with the doorframe at her back and a hand on her knife. Magdalena never asked where she came from. She dressed the wound and wrote the dose down exactly. Ilona asked one thing before she left: keep the door open at night."

[ties.extra_08_gu_zhao_genroku]
note = "Twenty Tanegashima matchlocks lay in a Hirado warehouse. Gu Zhao of the Ming mission counted them one by one while Genroku of Sakai offered a bowl of weak tea. Gu Zhao called it weak, left it untouched, and went straight to who the buyer was and when the silver came. Neither of them sat down, and they fought over the manifest line by line to the end."

[ties.extra_09_rossella_konrad]
note = "Konrad, the Welser agent, came to Setúbal to talk about a shipload of salt. One cuff had a stiff white ring on it, the kind you only get by going down into a salt store yourself. Rossella brought him a bucket and made him wash it first, and while he scrubbed she raised her usual price by a tenth. He caught on by the third rinse, sighed, and signed anyway."

[ties.extra_10_liesbeth_devries_kaspar]
note = "Old Fritz thought his pay bag felt light, so Kaspar carried it to the assay room for Liesbeth to test. The hand he pressed on the touchstone kept shaking. In a dozen years she had never seen that. She asked nothing, clamped the stone fast to the table and told him to stand back. The streak bore Fritz out: a tenth short of good silver."

[ties.extra_11_aisling_juhani]
note = "Aisling fixes the supply ports for the northern voyage, and Juhani reads the sky and strikes out the ill-omened days. They have agreed that if either of them says no, the ship stays in harbor."

[ties.extra_12_vaiere_kusi_wayna]
note = "Vaiere lays her star paths beside the knotted cords to compare them. The old record-keeper explains only the strands he chooses, the ones that tell of Tupac Yupanqui’s voyage out and back; the other knots he will not touch."

[ties.council_mio_lieve]
note = "Mio told the story of the Tanabata poem from her fifteenth summer, written on the ribs of her fan; Lieve read out the last entry in her father’s ledger. Before they parted they agreed that the price of silver at Hirado would go to Antwerp every quarter."

[ties.council_mio_najma]
note = "Najma said her astrolabe came from her great-grandfather; Mio said the poem on her fan was her own; neither would give an inch. In the end what changed hands was a tide table for the Inland Sea and a page on the rising and setting of Canopus."

[ties.council_mio_lin_wandeng]
note = "With the lantern and the fan side by side on the table, the two of them first laughed over the letter a smuggler boy once carried between them. Then Wandeng taught Mio the lamps Yuegang junks hang when they lie off Hirado at night: one means cargo, two means waiting for someone, none means keep away."

[ties.council_mio_ix_nikte]
note = "In the pyrite mirror Ix Nikte' brought, the writing on Mio’s fan showed up reversed. A whole Pacific lies between their homes, so they agreed to send letters by the Manila galleons, however slow."

[ties.council_mio_noel]
note = "Noël started by complaining that the writing on the fan was too cramped; Mio shot back that the star badge was polished too bright. Once the sparring was done, they got down to business: each ship will log the foggy months west of the Azores and pass them on to the other."

[ties.council_mio_tariq]
note = "Tariq recited his grandmother’s poems and Mio answered with a waka; neither understood a word of the other, but both heard the homesickness. When talk turned to Japanese sold aboard Portuguese ships, Tariq slammed the table and promised to watch for them in the western seas."

[ties.council_mio_kaicili]
note = "Kaicili twirled his clove sprig and talked about Ternate’s volcano; Mio fanned herself and talked about the sea off Tosa; both steered clear of their fathers. By the end, the price of copper at Hirado had been traded for the price of cloves in the Moluccas, and neither came out behind."

[ties.council_mio_baraka]
note = "Baraka set his Kilwa coin on the face of Mio’s fan, and at the mention of Yasuke they laughed for a good while. Since Honnō-ji no one knows where Yasuke went; whoever hears first will write to tell the other."

[ties.council_lieve_najma]
note = "Lieve’s ledger is never off by a penny, and Najma’s astrolabe is never off by a finger’s width. They spent half the night picking holes in each other’s figures, and in the end struck a trade: Antwerp’s pepper prices for Hormuz’s, with the monsoon dates thrown in."

[ties.council_lieve_lin_wandeng]
note = "Wandeng told the story of her lantern three different ways, and Lieve noted each one in the margin of her ledger and picked out the true one. Wandeng laughed and owned up, and promised that any silk prices she sent from Yuegang would be the honest ones."

[ties.council_lieve_ix_nikte]
note = "Ix Nikte' said that on her coast cacao beans are money. Lieve’s eyes lit up, and on the spot she opened a new column in her father’s ledger, headed not in guilders but in cacao beans."

[ties.council_lieve_noel]
note = "Noël is searching for the heirs of the seventy-seven names on the roster, and Lieve opened her father’s ledger: debtors and payers, decades of names. Whenever one matches, they agreed, a letter goes out at once."

[ties.council_lieve_tariq]
note = "Tariq laid his grandmother’s key on the table as security for a loan to ransom captives; Lieve wanted interest, and they argued half the night. In the end she pushed the key back to him, and what went into the ledger was a ransom at no interest."

[ties.council_lieve_kaicili]
note = "Kaicili smiled and named a price for cloves; Lieve worked it out and found it was a sum no one could pay. She smiled too. Only then did they get to the real price, and to how cloves from Ternate might reach Antwerp through fewer Portuguese hands."

[ties.council_lieve_baraka]
note = "Lieve weighed the Kilwa coin in her palm and asked how much rice it would buy in his harbor; Baraka answered with a story. By the time it was over, she had converted the weights Kilwa uses for gold into Antwerp marks and drawn up a table for him."

[ties.council_najma_lin_wandeng]
note = "Wandeng described the ocean star chart back in Yuegang, and Najma brought out her great-grandfather’s verses; several of the stars turned out to be the same ones. That night they each made a copy: the compass routes of the southern seas for Najma, the star paths of the Arabian Sea for Wandeng."

[ties.council_najma_ix_nikte]
note = "Ix Nikte' said her people set their days by Venus, and Najma immediately pulled out her astrolabe to check. They agreed to each keep a year’s record of Venus and compare them across two oceans."

[ties.council_najma_noel]
note = "One brought an astrolabe, the other a star badge. Noël said that star needed no measuring, and Najma measured it anyway. When she was done, Noël copied out of the old commander’s journal the bearing the Corvo statue points along, and slid it across to her."

[ties.council_najma_tariq]
note = "For once the talk needed no interpreter, though Tariq’s Arabic came out thick with the Maghreb and Najma picked out three words she took for Berber. He conceded one and said the other two were her ignorance, not his Arabic. News between their two seas will go by way of the merchants of Cairo."

[ties.council_najma_kaicili]
note = "Kaicili asked Najma to pilot a ship from Malacca straight down to the Moluccas, and the fee he named was handsome. Najma asked about the winds three times over before she so much as glanced at his clove sprig and nodded."

[ties.council_najma_baraka]
note = "With the astrolabe and the Kilwa coin side by side, the two of them fell to arguing over that star’s name again, from the moment it rose until it set. For the first time Baraka accepted her name for it, and Najma was not pleased at all: “If you give in, what are we going to argue about next time?” Before they parted they agreed to meet in Kilwa when the monsoon turns again."

[ties.council_lin_wandeng_ix_nikte]
note = "One knows how to move cargo under a sea ban, the other how to hide people under a convent’s nose. With the lantern and the mirror side by side, they compared their skills and agreed that whenever someone on either side needs hiding, the other will clear a space in the hold."

[ties.council_lin_wandeng_noel]
note = "Each of them claimed the harder strait. Wandeng said the Penghu reefs lie in wait for ships at night; Noël said the sea at Gibraltar only ever flows inward, and the only way out is to wait at Tarifa for an east wind. Wandeng paid for that with a Yuegang pilot’s trick: draw up a bucket of seawater, and its color tells you whether you have crossed the Black Ditch."

[ties.council_lin_wandeng_tariq]
note = "A smuggler and a privateer, neither needing to play the saint. Wandeng asked his rules for taking a ship; Tariq said cargo, never people. She thought it over and said Yuegang ran on much the same. Before leaving they swapped signals: on Tariq’s coast, smoke on the headland means Spanish galleys have put out; on Wandeng’s, a straw hat hung upside down from a fishing boat’s masthead means the government’s war junks are coming."

[ties.council_lin_wandeng_kaicili]
note = "Of the boat families taken off that night in Manila, each of them remembered half the names; at the council they went through them together and made the list whole. Whenever a Yuegang ship reaches the Moluccas now, Kaicili finds it a berth."

[ties.council_lin_wandeng_baraka]
note = "Baraka told a story about a haunted ruined palace in Kilwa; Wandeng covered her ears and begged him to stop, then pestered him to go on. When he finished, he promised that next time he would bring one of the blue-and-white shards still lying on that palace floor, as an offering for the Tianfei temple."

[ties.council_ix_nikte_noel]
note = "Ix Nikte' first asked whom Noël served. Noël said the Order was down to a single knight and served no one. Only then did she set her pyrite mirror on the table and turn it for Noël to look into. Noël looked away: “A mirror that fine shouldn’t be wasted on me.”"

[ties.council_ix_nikte_tariq]
note = "They hate the officials of the same king. Tariq said the door his grandmother’s key once opened has long since had its lock changed; Ix Nikte' said the temple on her island is nothing but stones now. They agreed that whenever the Inquisition in Spain turns to a new town, or the friars in Yucatán set out for a new village, word will go across to the other."

[ties.council_ix_nikte_kaicili]
note = "The clove sprig lay beside the pyrite mirror: cacao on one side of the world, cloves on the other, and outsiders holding the price of both. They agreed to keep two figures for every year’s harvest: one for outsiders, and the true one, written only to each other."

[ties.council_ix_nikte_baraka]
note = "Baraka said the Portuguese had written Kilwa’s story wrong; Ix Nikte' said the Spaniards had burned her people’s books. They agreed that each would write down the history of home in their own hand, and send a copy to the other for safekeeping."

[ties.council_noel_tariq]
note = "After nearly thirty years of quarreling across the strait, they sat at the same table unarmed for the first time. Noël said the key had rusted, Tariq said the star badge had lost a point, and after that neither picked a fight. Before the council broke up, Tariq pushed across a list of the captives held in the Algiers bagnios, and Noël checked it line by line against the roster until dawn."

[ties.council_noel_kaicili]
note = "Noël never pays a compliment without a jab first, and Kaicili took every jab smiling. In the end it was Noël who asked first: if any heirs of the names on the roster had drifted out to the Spice Islands, would he keep an eye out? Kaicili agreed without even naming a price."

[ties.council_noel_baraka]
note = "Baraka started with the story of his coin and was still going after the lamp wick had been trimmed three times. Noël never once interrupted, only jotted down a few names in a script no one else could read. When the council broke up, they agreed that whichever ship rounded the Cape of Good Hope first would carry a letter for the other."

[ties.council_tariq_kaicili]
note = "Tariq asked what cloves would fetch in Algiers; Kaicili smiled and asked how many shiploads of cloves he had taken. Neither answered, but they agreed that news from the Ottoman side would be handed east from port to port, all the way from the Mediterranean to Ternate."

[ties.council_tariq_baraka]
note = "Two men who love a joke both stopped laughing when the talk turned to slave ships. Baraka named the go-betweens in Jeddah and Mocha who broker ransoms; Tariq told him that in Algiers the ransom is only the start, with cuts taken at every hand, and the interpreter’s fee the one you can least afford to skip."

[ties.council_kaicili_baraka]
note = "Both their homes have forts the Portuguese built. Kaicili told how Ternate besieged theirs for five years until the garrison handed it over and left, and Baraka listened more closely than anyone. At the end he asked just one thing: in those five years, how had they cut off the fort’s food?"

[ties.extra_02_amaia_elene_urruti]
note = "Fourteen-year-old Elene dragged her father into the tavern’s back room, his palm torn open by a harpoon line, and sat him down by force. Amaia put in seven stitches while Elene held the basin of warm water without a tremor. She brought the basin back scrubbed, and stayed on to learn her herbs from Amaia."

[ties.extra_05_ana_cruz_xochitl]
note = "On her first day in the workshop, the cousin from Mérida set her first hummingbird feather on a holy image a fraction askew, and Ana ripped away the whole patch without a word. Xochitl laid it again and again. On the eleventh try Ana only looked, and left it alone."

[ties.extra_07_hasan_selim_kereste]
note = "Hasan wanted a bent beam for a knee, and Selim, the new apprentice at the timber yard, stopped him: the one on top was cut on the shady side of the hills and would split within the year. He hauled out one that had seasoned three winters. Hasan rapped it twice with his hatchet and listened. He gave no praise, only told the boy to report to the slipway in the morning."

[ties.frana_eleni_friends]
note = "The Ragusan envoy came to Chios to talk mastic, and Eleni wouldn’t name a price until she had taken her up the hill to cut a tree. Frana cut far too deep, and Eleni fretted over the bark half the afternoon; when Frana sailed, she was still holding the scrap of resin Eleni had pushed into her hand."

[ties.frana_eleni_crush]
note = "In the second tapping season Frana walked off the ship and straight up to the southern groves. Crouched by the white earth, counting the tears that had set under the tree, she said aloud what she feared most: the Sultan’s fleet might come next year. Eleni didn’t argue. She took Frana’s sticky hand and kept it."

[ties.extra_01_cecilia_frana_confidants]
note = "On the solstice night a packet of resin from Chios sat at the empty place in the back room, and Frana broke it into three and shared it out. Two cups later she was asleep against the wall, the frown she always wore smoothed away, and Cecilia wouldn’t let anyone wake her. She took out her charcoal and drew that face."

[ties.extra_06_magdalena_ilona_crush]
note = "Ilona scattered stove ash across the threshold and taught Magdalena to read the footprints; back inside, it was her turn to weigh remedies, starting over at every grain short, while two rows of tally marks crept along the wall. One night, deep in talk, she stopped short: she had been sitting all evening with the window at her back."

[ties.extra_06_magdalena_ilona_lovers]
note = "The winter the court moved to Prague, they saw off the charlatan who wanted her ledgers and the men waiting at the bridge. The next year the borrowed brass cup came home polished, a second chair stood beside the first by the door, and when Ilona asked whether she should go or stay, the answer was written in the ledger. After that they lived upstairs from the workshop."

[ties.extra_09_rossella_konrad_crush]
note = "At harvest Konrad hauled salt sacks himself until his back gave out, and Rossella still talked his commission down by half. The next day the littlest of her family, white with salt from head to foot, was playing king of El Dorado, a game out of one of Konrad’s stories. He sat down beside her on the bank, and she went red and gave him the biggest piece of bread."

[ties.extra_09_rossella_konrad_lovers]
note = "Konrad refused to spin his El Dorado stories for investors, and he was saddled with an IOU he had once taken for gold, so it was years before he could quit the Welsers. He came to Setúbal with his old leather case to keep the books for the salt pans. Rossella didn’t keep him waiting for an answer; she handed him a salt-stiff work shirt and took him down to the water to wash it with her."

[ties.matsuru_haewol_confidants]
note = "On the reef at low tide Haewol dove for urchins while Matsuru sat on the rocks counting her breath; the count was past a hundred and twenty before Haewol broke the surface far out. That night Matsuru folded her a kerchief for safekeeping, the way a sister does for a brother. Haewol objected that it was meant for a brother. Matsuru answered that this one came from an elder sister."

[ties.aisling_pieter_crush]
note = "Pieter had drawn a reef half a ship’s length out of place. Aisling didn’t tease him. She anchored off the reef the following day and held the whole crew there through an ebb tide so he could see it. On the corrected chart he added a line in the margin crediting her. She studied it a long while and complained only that the letters were too small."

[ties.jean_leblanc_pierre_cardon_crush]
note = "When Villegagnon threw the Calvinists off the island, Jean brought Pierre in from the leaking lean-tos to sleep in his own longhouse. Before the meal Pierre bowed his head to pray, and the whole house stopped to watch. Jean put the prayer into Tupi for him under his breath, a line at a time, so slowly he seemed reluctant to reach the end."

[ties.qin_hongying_shen_zhiwei_friends]
note = "For twenty crates of official-pattern ware, Qin Hongying asked triple the usual fee. When Shen Zhiwei laughed at the price, Qin named the six men waiting outside one by one: whose mother was going blind, who had just had a baby girl. Shen stopped laughing. She wrote all six into her ledger and set a sum for road money beside every name."

[ties.qin_hongying_shen_zhiwei_crush]
note = "On that run the carts were robbed four times. The first three times no blade left its sheath; the fourth was real, and Qin Hongying took a cut meant for Shen Zhiwei. Changing the dressing in spring, Shen’s hands shook so badly the bandage went on crooked, and she told the whole truth about the first three. The first thing Qin wanted to know was whether the men had been paid for them."

[ties.radhika_aishath_friends]
note = "Aishath, a cowrie trader from Male, was counting shells in Radhika’s bead shop when she picked out the very smallest and asked if it could be drilled. It would only split, so Radhika fetched two red agates she kept back from sale and ground a tiny mount to hold the shell between them. Aishath entered it in her ledger as bead number one."

[ties.theodoros_tommaso_crush]
note = "On stage Pantalone counted every candle stub; offstage Tommaso handed a month’s wages to the doctor and walked on old playbills folded into his shoes. Theodoros said nothing. The next morning a cloak patched three times lay across the costume trunk. Tommaso put it on, sleeves hanging past his hands, and never gave it back."

[ties.vaiere_tomas_mendoza_crush]
note = "On the beach at night Vaiere pointed out the pebbles in her ring one by one, and Tomás logged where each star rose. When he reached the line meant for the island’s position, he stopped and shut the book. It was the first time Vaiere smiled at the stranger."

[ties.new_kogo_mae_sumi_friends]
note = "The letter that told a Naha fishwife her sailor son had died in Sakai never once used the word “dead.” Mae Sumi read it aloud to the old woman, wrote her reply for her, and at the bottom slipped in a question of her own about the scribe in Kyoto."

[ties.new_kogo_mae_sumi_confidants]
note = "For three years their letters carried other people’s news, and each allowed herself just one line at the very end. Then one spring Naha sent a ryūka meant for Kogo alone; her waka in reply took three nights, and she threw away enough drafts to half fill her book chest."

[ties.new_kogo_mae_sumi_lovers]
note = "After thirty years of letters, Mae Sumi finally reached Kyoto in the autumn of 1589, standing in for an envoy’s scribe who had fallen ill, and found Kogo’s house by the persimmon tree in an Upper Kyoto lane. At the Yodo River landing Kogo gave her a letter of a single line: from now on, she would write with Mae Sumi’s face before her."

[ties.new_margarita_leonor_ruiz_friends]
note = "Margarita, a maid from the marquis’s household, came in to order an estate map and spilled half the street’s gossip across the table before she had finished the boundaries. The olive grove two households had fought over for three years, Leonor gave to nobody: she drew it in as a dotted line."

[ties.new_margarita_leonor_ruiz_confidants]
note = "The night the fleet was waiting to sail, Margarita held the lamp for Leonor until dawn, and the oil was filled three times. For once she talked about nobody but herself: the money box she kept beneath the bed with nine years of savings in it, and the day it would be enough for her to stop carrying the household’s whispers."

[ties.new_margarita_leonor_ruiz_lovers]
note = "Years ago the money box went down as a loan, and Margarita moved in upstairs, a lodger in name only. In 1588 the shop hung a fresh sign with two names on it, hers first; she went up the ladder and kissed the mapmaker with half the street looking on, and the upstairs room has held nothing but books since."

[ties.new_marietta_filo_leyla_fincan_friends]
note = "One of the twelve Murano lamps a mosque had ordered had a hairline crack, and the clerk would not sign for any of them. Leyla, whose family ran a coffee stall outside the arsenal, wrote a receipt that said exactly which band the crack was in, and he signed; Marietta, who had come with the lamps, stayed at the stall cup after cup until dark."

[ties.new_marietta_filo_leyla_fincan_confidants]
note = "Two years on, Marietta brought another load of lamps and held a shard up to the sun to show Leyla the bubbles inside. Leyla, in turn, guided her hand through her own name in Ottoman letters, right to left, until by the fifth try it stood up straight; the page of their two names went folded into Marietta’s tool bag."

[ties.new_marietta_filo_leyla_fincan_lovers]
note = "When the peace was signed and the other Venetians crowded aboard for home, Marietta stayed away from the quay. In 1574 a lamp shop opened beside the coffee stall, with a sign in Leyla’s hand and a first receipt that read “no cracks, no bubbles”; over the day’s last coffee Leyla started in on her usual sparring, and Marietta stopped her with a kiss."

[ties.new_tara_mani_khadija_rihla_friends]
note = "Pilgrimage season in Jeddah: at the next stall, every bead on Tara’s sample cord was named for a port. Khadija copied the ports one by one onto her unfinished map, crediting each to Tara, and by the time the stalls came down they had left their addresses on each other’s bead cord and map."

[ties.new_tara_mani_khadija_rihla_confidants]
note = "Every letter from Fez to Khambhat named a color: “Fez Blue” was the blue of the bowl Khadija’s mother served soup in every day. Tara fired a fresh batch of stone to match, and each bead she sent back carried a paper tag named for a Khambhat quay."

[ties.new_tara_mani_khadija_rihla_lovers]
note = "Khadija wrote her travel book in Tara’s workshop, her table pushed up beside the grinding wheel, the ink gritty with stone dust. On the map she had carried from Fez she added Tara Mani’s name to the square for Khambhat—at last, she said, someone lived there—and that night, before the lamp was out, it was Khadija who leaned in first."

[ties.new_amihan_dagat_sisa_mullu_friends]
note = "Sent by the Peruvian shipowner to beat down the price of timber, Sisa turned the loggers’ hands over one by one, came to Amihan’s callused palm, and raised the price instead. The rafts could not come in before high tide, so she settled onto the timber pile and waited for the water to cover the mud."

[ties.new_amihan_dagat_sisa_mullu_confidants]
note = "Having missed the ship home to Peru, Sisa had spent three years in Tondo. When she refused shells that indebted divers had been made to bring up and the merchant went looking for another boat, Amihan swung hers across the quay and not a boatman in the harbor would move; Sisa turned and smiled at her, the first real smile since she had left Chincha."

[ties.new_amihan_dagat_sisa_mullu_lovers]
note = "Amihan wrapped Sisa’s first letter home in six years in two layers of oilcloth, and it sailed with the Santa Ana; in 1588 word came back that the English had caught the galleon off California, stripped her and set her alight. That day it was Sisa who spoke first, to say she was not going back, and Amihan who kissed first."

[ties.new_isabel_soto_leonor_ruiz]
note = "Two charts of the same stretch of coast lay on the well curb at the House of Trade. Isabel took one look and said the other’s headland was drawn half a league south of where it belonged, and the pilot waiting to buy dared take neither. The next morning two girls, one after the other, went down the docks asking for a boat to Cape St. Vincent."

[ties.new_ursula_bianca_mare]
note = "In the year Spain’s king defaulted, a Genoese widow called in Antwerp after dark, lit the lamp on the desk herself, and offered forty for every hundred of face value on the royal bills. Seventeen-year-old Ursula laid out her counters three times and locked the bills away again; the widow did not haggle, only left a slip with her Genoa address under the lamp."

[ties.new_fatima_miriam_friends]
note = "Every Thursday Miriam, the palace kira, passed the coffeehouse with her arms full of sealed parcels and paused by the porters’ stool at the door, never once sitting. Fatima brought her a cup, and she drank it on her feet; by the next Thursday the stool had a cup of its own, kept warm under a saucer."

[ties.new_fatima_miriam_confidants]
note = "A palace clerk two cups into his coffee started loudly on some gossip about the kira. Fatima topped him up so slowly, and asked so warmly after his camels back in Konya, that the story never left the room; when Miriam heard about it that Thursday, she set her parcels down on the stool for the first time."

[ties.new_catarina_pereira_lin_hui]
note = "When a ship from Macau came into Manila, Catarina, in charge of its cargo, sat down at the long table outside the Lin house in the Parián. Portuguese against Castilian, the two of them went over the books by lamplight and found the same lighter run charged once in each ledger; the silver went back into Catarina’s purse, and supper that night was on her."

[ties.new_wen_xingcha_qin_hongying_friends]
note = "An old woman chewing betel on a bollard studied the sky and said nobody should sail today, so Qin Hongying carried the silver chest back down the gangplank. That night a gale overturned two ships outside the harbor; next morning Qin went along the quay with a packet of cakes until she learned the old woman was Wen Xingcha, Yuegang’s oldest pilot."

[ties.new_wen_xingcha_qin_hongying_confidants]
note = "The sea-watch tower has a steep stair, and Wen Xingcha will hear no word about her knees, only about the crooked steps, so Qin Hongying crouches down and carries her up. At the top the old pilot quizzes her on cloud after cloud; the notch on Qin’s scabbard marks the year she misread one and let two chests of tea soak through on the Jiulong River."

[ties.new_ayame_kogo]
note = "After the academy, Ayame went into the palace and Kogo took a little house with a persimmon tree by the door and wrote letters for hire; at the Kenrei Gate one bowed and the other never turned around. When Ayame lost badly at the autumn poetry gathering of 1563, she sent Kogo a box of sweets with no message, and got back a slip that said: “Not badly written.”"

[ties.new_nala_aisha_friends]
note = "When the oud started up at the musician’s house next door, all seven girls tracing letters in Aisha’s courtyard tipped their heads toward the wall. Aisha went over and knocked; Nala had the smallest girl sing, Aisha took the words down on a slate, and before going back inside Nala promised to keep her mornings quiet."

[ties.new_nala_aisha_confidants]
note = "The smallest girl from that first afternoon had learned her letters, and now sang Nala’s tune off a slate she had spelled out herself, in Aisha’s accent. Nala straightened out the melody and left every word as the girl said it; afterward Aisha lent her a book of poems whose flyleaf listed seven borrowers crossed off and Nala next."

[ties.new_nala_aisha_sworn]
note = "The year the people of the Alpujarras came across the sea to Fez, each household gave up half its courtyard. By the spring of 1571 the little room down the lane was teaching girls their letters in the mornings and the songs from home in the afternoons, and one evening, before a roomful of them, Nala and Aisha shared a piece of bread dipped in salt and became sisters by oath."

[ties.new_mayta_qipu_ika_friends]
note = "On the dock at Callao, two young men from Chincha checked a shipment against their cargo cords, and Mayta counted one bundle of spondylus shell twice. Ika’s laughter carried halfway down the quay; Mayta went red and tied the knot tight again."

[ties.new_mayta_qipu_ika_confidants]
note = "Ika told everyone he meant to own a raft. Mayta heard him out, then sat on the stone steps and tied the lumber, the sails and the debt into a fresh cord, ending it with Ika’s mark. Ika ran a fingertip along it and, for once, said nothing."

[ties.new_mayta_qipu_ika_lovers]
note = "Ika’s raft went into the water at Arica and was named Fox, for the dark shape in the Milky Way. Mayta came down from Chincha and tied the name into his own ledger cord. Now one keeps to Chincha and the other to Arica, and their two cords travel between them with the passing ships."

[ties.new_kinjo_shin_lakan_pula_friends]
note = "At the datu’s feast by the river mouth in Tondo, the Ryukyuan ship’s scribe, Kinjō Shin, recited island names to a crowd that barely listened. Down on the steps, Lakan, a cadet of the datu’s house, squatted in the mud counting coppers into boatmen’s hands, then took a fifth off the steward’s price in three sentences."

[ties.new_kinjo_shin_lakan_pula_confidants]
note = "Lakan rowed Kinjō Shin out to learn the tides of Manila Bay, and snatched his brush to add a line in the margin in a hand like a crab walking. That night, with the boat anchored mid-bay, Shin finally said what had been weighing on him, and Lakan answered by handing him the oar."

[ties.new_kinjo_shin_lakan_pula_lovers]
note = "The Ryukyuan ships no longer sail south, but Lakan’s letter reached Naha on a Chinese junk: an ugly hand, every island name right, Tondo under a new master, and Lakan still haggling for boatmen at the river mouth. Shin copied it into the clerk’s register and sent a reply on the next junk."

[ties.new_piero_vetro_selim_kereste_friends]
note = "Half a year after the peace, an Ottoman firewood boat tied up at Murano. Selim, its hand, found Piero squatting by the furnace sorting broken glass into little jars by color, picked up a green shard, held it to the window, and named the uneven fire that had made it."

[ties.new_piero_vetro_selim_kereste_confidants]
note = "Piero’s goblets had cracked at the foot again. Selim crouched at the woodpile and split the logs one by one until he found the wet beech; when the furnace boy protested that the lot was paid for, he apologized and still would not let it near the fire. The next firing used wood he picked, and the whole row came out sound."

[ties.new_piero_vetro_selim_kereste_lovers]
note = "Selim came through the plague on the quarantine island. At Venice’s first Feast of the Redeemer, some planks of the bridge of boats were oak he had shipped, and halfway across Piero took his hand in front of the crowd. Every year since, Selim’s timber boat ties up before the bridge goes up."

[ties.new_idriss_qalam_nala_friends]
note = "Under the orange tree in Nala’s courtyard, Idriss copied down the old village songs. Her rule: she sings a song once, and he sings it back exactly, accent and all. His tune wandered until the donkey in the lane turned to look, and in the last line a slipped dot turned the word for “house” into “girl.”"

[ties.new_idriss_qalam_nala_confidants]
note = "After the night prayer, Nala knocked at the copy shop’s back door, wanting to learn who wrote an old song a wedding guest had asked about. It was in none of Idriss’s pages; it lived only in her mother’s voice. She sang, he wrote, and the lamp took oil twice before dawn."

[ties.new_idriss_qalam_nala_lovers]
note = "Outside the east gate, Idriss pushed his notebook, crammed with marginal notes, into Nala’s arms and told her to correct it in every city she sang in. She rode off with the mule train to Algiers. Every few months she came back to Fez, the book a little thicker each time, and he was at the gate."

[ties.new_martin_itsas_elene_urruti_friends]
note = "Forty-odd water casks stood on the jetty, and Martin tapped and counted every one. When a loose hoop sprang free and opened the back of his hand, he kept counting, blood on the staves. Elene, passing with herbs for a ship’s medicine chest, caught his hand, rinsed it three times from her flask, and tied the cloth in a hard knot."

[ties.new_martin_itsas_elene_urruti_confidants]
note = "The night before Martin sailed, Elene packed his little medicine cask in the tavern’s back room, naming the ailment on each paper in quick charcoal strokes. At the end she wrapped one more packet, left the label blank except for a drawn crescent, and tucked it under the rest."

[ties.new_martin_itsas_elene_urruti_lovers]
note = "On Cooper Street one shop is half cooperage, half herb counter. Sailors come in to order a water cask and walk out with a packet of medicine pressed into their hands. Martin has given up the sea and counts only the casks on shore; whatever wounds come through the door are Elene’s to wash."

[ties.new_hinrik_korn_greta_tamm_friends]
note = "The grain store on the Trave unloaded a shipload of Danzig wheat. Hinrik rapped each barrel and called the count; Greta checked the bill and found it half a barrel short. One barrel, tipped out, held wheat on top and sand below, and by afternoon the seller was in the store’s black book."

[ties.new_hinrik_korn_greta_tamm_confidants]
note = "On the day of the supply ship’s trial run, Greta asked Hinrik nothing when he came down the gangplank. She slipped a twist of ginger into his pocket, then went to the pay table and wrote under his name in the crew roll that his next of kin was Tamm, of the countinghouse."

[ties.new_hinrik_korn_greta_tamm_lovers]
note = "After the storm off Visby, Hinrik stayed on at the grain store. One bright morning he stood on the threshold and shouted a long speech up at the countinghouse window across the street. Greta heard it out through the open sash, then came downstairs to meet him with a kiss."

[ties.new_isabel_soto_pedro_luna_friends]
note = "In the House of Trade’s instrument hall, Isabel, the examiner’s granddaughter, took a new astrolabe out of her grandfather’s reach, set her dividers to it, and announced that the thirty-seventh degree was a hair too narrow. Pedro, the apprentice, had cut that degree himself. He did not argue; he said he would recut it."

[ties.new_isabel_soto_pedro_luna_confidants]
note = "Isabel spread a chart of the sea road to the West Indies across the astrolabe shop’s workbench, her name freshly signed in the corner. Pedro, as always, went over the latitude lines first and found nothing wrong. She told him to hold on to it for now."

[ties.new_isabel_soto_pedro_luna_lovers]
note = "When the Strait fleet came home, Pedro unpicked his coat lining and laid the roll on Isabel’s worktable: her coastline, with every latitude he had taken beside it, a small arrow at the end of each line. She found one place off by a minute, fixed it, put down the pen and spoke first."

[ties.new_yun_haeri_kim_munyeong_friends]
note = "Kim Munyeong came to the paper shop for sheets to fair-copy a reply to the Japan House. Haeri saw that the last line had “forgive” written as “rage” and told him so to his face. He owned the mistake, fixed it, and bought thirty more sheets, and she quietly added two to the pile."

[ties.new_yun_haeri_kim_munyeong_confidants]
note = "At night the drying room behind the paper shop held a wall of warm sheets. Haeri turned them, then sat under the lamp to go through Munyeong’s booklet on how each side says sorry, circling in vermilion the lines that weighed too much or too little. In the next room her father’s snoring rose and fell."

[ties.new_yun_haeri_kim_munyeong_lovers]
note = "The court’s reply passed through Busan on paper from the Yun shop, every character checked by Haeri at night, though her name was nowhere on it. Munyeong went to Tsushima with it. He came home with his bags still on his shoulder, and she had already written a wedding date on a slip of red paper for him to proofread."

[ties.new_beatriz_simao_duarte_ervas_friends]
note = "A feverish sailor lay on the bench in the doctor’s front room. Beatriz asked his name before anything else, then pushed open the shutters. Duarte, the apothecary’s apprentice, arrived with a basket and started sketching a wormwood leaf in the corner of a page; she stopped him, and after a moment he wrote the sailor’s name beside it."

[ties.new_beatriz_simao_duarte_ervas_confidants]
note = "A new book printed in Goa reached the doctor’s house, two physicians talking drugs back and forth, not one picture in it. Duarte put his finger on the page about pepper and said he wanted to see it for himself and come back to draw it. Beatriz, not looking up, said she would ask about a passage."

[ties.new_beatriz_simao_duarte_ervas_lovers]
note = "After the plague, Beatriz leased the old pepper warehouse by the river that had served as the ward, and its windows have stood open ever since. Duarte moved his mortar into the back room, gave up the thought of Goa, and stayed to tell Lisbon’s patients which leaf was which."
