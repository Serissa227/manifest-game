# 往事名录英文覆盖：只有name与lore；不提供persona、lines或可交互身份。

[past.sayyida_al_hurra_reign]
name = "Sayyida al-Hurra’s Rule at Tetouan"
lore = "Old Tétouan folk say that in her day the corsair ships sailed at her word, and the friars who crossed over to ransom captives had to wait on her nod. She was turned out in 1542, yet neither shore has forgotten her."

[past.christopher_columbus]
name = "Christopher Columbus"
lore = "Seville’s old sailors start with his four crossings. Las Casas wrote down the other half: the gold levies on Hispaniola, the hounds, and the Taíno villages that emptied one after another."

[past.vasco_da_gama]
name = "Vasco da Gama"
lore = "In Lisbon they say he found the road to India. Malabar fishermen tell another story: in 1502, on his orders, a shipload of pilgrims returning from Mecca was burned at sea."

[past.ferdinand_magellan]
name = "Ferdinand Magellan"
lore = "Five ships sailed; three years later one came back to Seville with eighteen men. Their captain-general fell in the shallows of Mactan, and it was Pigafetta who finished the story for him."

[past.francisco_serrao]
name = "Francisco Serrão"
lore = "He settled on Ternate and never went home. In his letters to his old friend Magellan the clove islands sounded as near as the house next door, and men put to sea with those letters in their pockets."

[past.hernan_cortes]
name = "Hernán Cortés"
lore = "In his letters to the emperor, every battle was justified. The elders of Tlatelolco told the friars something else: smallpox, broken causeways, bodies floating in the lake."

[past.moctezuma_ii]
name = "Moctezuma II"
lore = "The Spaniards say his own people’s stones killed him. The Mexica say the Spaniards killed him before they fled. Each story still has its listeners."

[past.malinche]
name = "Malinche"
lore = "In the pictures of the conquest she always stands beside Cortés, speaking for both sides. What she wanted to say for herself, no picture shows and no book records."

[past.gonzalo_guerrero]
name = "Gonzalo Guerrero"
lore = "Later Spaniards told of a countryman who washed up in Yucatán after a shipwreck, took a Maya wife and tattooed his face. When Cortés sent for him, he answered that his children were here, and he was staying."

[past.francisco_pizarro]
name = "Francisco Pizarro"
lore = "At Cajamarca he seized the Inca, took a room full of gold as ransom, and killed him anyway. Eight years later he died in his own house in Lima, cut down by the men of his old partner Almagro."

[past.gonzalo_pizarro]
name = "Gonzalo Pizarro"
lore = "Rather than let the king’s New Laws take away his Indians, he raised an army, killed the viceroy, and ruled Peru for years. In 1548, beaten at Jaquijahuana, he lost his head."

[past.juan_pizarro]
name = "Juan Pizarro"
lore = "When Manco Inca besieged Cuzco in 1536, this Pizarro brother led the storming of Sacsayhuamán’s walls, took a stone to the head, and never got up."

[past.hernando_pizarro]
name = "Hernando Pizarro"
lore = "The price of executing Almagro was a long imprisonment in the castle of La Mota at Medina del Campo. From his cell he wrote letters and fought lawsuits to hold on to the Pizarro fortune in Peru."

[past.oruc_reis]
name = "Oruç Reis"
lore = "The elder Barbarossa brother. He lost an arm under the walls of Béjaïa—old Algiers sailors say he wore a silver one after—and in 1518 the Spaniards ran him down near Tlemcen."

[past.hayreddin_barbarossa]
name = "Hayreddin Barbarossa"
lore = "After Preveza every Ottoman captain wanted to be him, and sailors still pass around copies of the campaigns he dictated. The book has little to say about the captives who rowed his galleys. He died in 1546."

[past.francis_xavier]
name = "Francis Xavier"
lore = "In the winter of 1552 he waited in a hut on Shangchuan for a boat that would carry him into Canton. It never came. Jesuits still copy the letters he sent from Japan and Malacca."

[past.pati_unus]
name = "Pati Unus"
lore = "The sultan of Demak sent fleets twice against Malacca and died at sea on the second attempt. His great ship, said to have seven decks, still lies on the shore, and everyone who goes to measure it reports a bigger number."

[past.ahmad_ibn_majid]
name = "Ahmad ibn Mājid"
lore = "Arabian Sea pilots recite his sailing verses like family trees: which star’s rising means a turn of the helm, which stretch of seabed is sand. As for whether he was the pilot who guided da Gama, some say yes, and others swear he wasn’t."

[past.heinrich_cornelius_agrippa]
name = "Heinrich Cornelius Agrippa"
lore = "His Three Books of Occult Philosophy pass half-openly among scholars; some read them for learning, some for spells. People also say his black dog was no dog, and that he drove it off before he died."

[past.johannes_trithemius]
name = "Johannes Trithemius"
lore = "The abbot’s Steganographia circulates only in manuscript, full of angels summoned to carry messages. Those who crack it say it’s really a cipher; those who don’t are all the more afraid of it."

[past.paracelsus]
name = "Paracelsus"
lore = "He once burned Avicenna in public at Basel and insulted every university physician he met. Since his death in 1541, books and recipes bearing his name keep multiplying—more than he ever wrote."

[past.erasmus]
name = "Erasmus"
lore = "The Folly of his Praise of Folly mocked monks, scholars and kings, and readers who laughed found themselves not quite laughing by the end. His letters reached every corner of Europe; now both sides of the great quarrel want to claim him."

[past.juan_luis_vives]
name = "Juan Luis Vives"
lore = "A Valencian who made his home in Bruges, he once wrote a book for the queen of England on how to educate a daughter. Schools and households still raise children by his methods—some of them a little too strictly."

[past.nicolaus_copernicus]
name = "Nicolaus Copernicus"
lore = "They say the first printed copy reached his bedside when he could no longer speak. The book puts the sun at the center; astronomers curse it and work out their calendars from its tables all the same."

[past.martin_luther]
name = "Martin Luther"
lore = "He died in 1546 in Eisleben, the small town where he was born. Farmhouse hearths read the German Bible he translated, and princes go to war and make peace again over the words he wrote."

[past.leo_africanus]
name = "Leo Africanus"
lore = "Born in Granada, raised in Fez, seized by corsairs and carried to Rome, baptized—and then he wrote a Description of Africa. Venice printed his book, but he went back to North Africa, and after that no one could say for certain where he was."

[past.georg_faust]
name = "Georg Faust"
lore = "The wandering “Doctor Faust” told fortunes and named his price at many a city gate, and was thrown out of more than one town. They say he died at an inn in Staufen with his neck wrung round backward; the inn’s people said the devil had come to collect."

[past.wang_shouren]
name = "Wang Shouren"
lore = "In 1529, returning from putting down a rising in Guangxi, he died aboard a boat at Nan’an in Jiangxi. His last words were: “This heart is bright. What more is there to say?” His students still lecture across the empire, and their subject is that heart."

[past.zhu_wan]
name = "Zhu Wan"
lore = "He razed Shuangyu and beheaded more than ninety men at Zoumaxi for dealing with foreigners, and the sea merchants of Fujian and Zhejiang hated him to the bone. Impeached, he took poison, leaving one line behind: “Ridding ourselves of foreign pirates is easy. Ridding ourselves of Chinese ones is hard.”"

[past.zhengde]
name = "The Zhengde Emperor"
lore = "Old palace eunuchs can still describe the revels of the Leopard Quarter, and the grand general’s title he gave himself. He caught a chill after falling into the water at Qingjiangpu and died the next year without a son, so the throne passed to his cousin."

[past.yang_tinghe]
name = "Yang Tinghe"
lore = "When Zhengde died, he held the court together through the thirty-seven days the throne stood empty, and brought the Jiajing Emperor up from Anlu. Then came the Great Rites quarrel—over whom the emperor should call his father—and he fought it until he resigned. He died stripped of his rank."

[past.shao_yuanjie]
name = "Shao Yuanjie"
lore = "A Daoist from Dragon and Tiger Mountain who prayed for rain and for heirs on the Jiajing Emperor’s behalf. The palace said every prayer of his was answered, and his honors rose to the rank of Minister of Rites. After he died in 1539, Tao Zhongwen took over the altars in the West Park."

[past.ouchi_yoshitaka]
name = "Ōuchi Yoshitaka"
lore = "Yamaguchi still remembers his splendor: court nobles from Kyoto, paintings from Ming, copper coin brought home by the tally ships. In 1551 Sue Takafusa rose against him; he fled to Taineiji and took his own life there."

[past.ouchi_harumochi]
name = "Ōuchi Harumochi"
lore = "The young heir adopted from the Ichijō of Tosa. In 1543, retreating from Izumo, his boat overturned at Iya Bay; he was twenty. Since then, fishermen say, strange lights wander over that water at night—the young lord still looking for the road back to Yamaguchi."

[past.ichijo_fusaie]
name = "Ichijō Fusaie"
lore = "During the Ōnin War this branch of the Ichijō took refuge at Nakamura in Tosa. Fusaie was born there, became the first lord of the Tosa Ichijō, and turned the little town his father had founded into a “Little Kyoto,” where courtiers from the capital felt almost at home."

[past.ichijo_fusafuyu]
name = "Ichijō Fusafuyu"
lore = "He inherited his father’s “Little Kyoto,” managing Tosa’s fields and harbors with one hand and holding court rank in Kyoto with the other, his letters running back and forth between Nakamura and the capital. When he died in 1541, his granddaughter Mio was barely a year old."

[past.ichijo_fusamoto]
name = "Ichijō Fusamoto"
lore = "In 1549 the young head of the house died by his own hand at the Nakamura residence. The household said a madness had come over him; in town, people whispered that someone had driven him to it—or simply done it for him. No one can say."

[past.shin_saimdang]
name = "Shin Saimdang"
lore = "People say a hen once pecked at the insects in one of her paintings. When she died in 1551, her son Yi I wrote out her life for the family, line by line: how his mother read, painted, and missed her parents’ home."

[past.wang_gao]
name = "Wang Gao"
lore = "Wang Gao of Jianzhou raided the horse markets under the Wall and killed Ming officers. In the end Wang Tai of the Hada bound him and handed him over, and in 1520 he was put to death in the capital. Old men in Jianzhou still lower their voices when they say his name."

[past.wang_tai]
name = "Wang Tai"
lore = "Wang Tai of the Hada held the Ming trading patents; at the horse markets, who went in first and who waited depended on his mood, and Jianzhou never forgot that he bound Wang Gao and handed him over for a reward. After he died in 1527, the Hada patents became a prize every clan fought for."

[past.francis_i_france]
name = "Francis I of France"
lore = "He was captured at Pavia and held a year in Madrid; he brought the aged Leonardo to Amboise and raised the château at Chambord. Since his death in 1547, the French court has gone on living in his style."

[past.henry_viii]
name = "Henry VIII"
lore = "To end a marriage he broke with Rome and closed every monastery in England, and their stones and fields passed into his courtiers’ hands. Since his death in 1547 the crown has passed down the line he set among his children, and each new monarch changes the services in the churches again."

[past.jakob_fugger]
name = "Jakob Fugger"
lore = "Jakob “the Rich” of Augsburg lent the Habsburgs enough to buy an imperial crown, then collected on the debt through the silver and copper mines of Tyrol and Hungary. In the quarter he built for the city’s poor, the rent is one Rhenish gulden a year, plus three prayers a day for the Fugger family."

[past.marguerite_de_navarre]
name = "Marguerite de Navarre"
lore = "Sister of Francis I. Her stories first passed from hand to hand at court: ten travelers trapped by floods in a mountain abbey, each telling a tale a day. Only in 1558, years after her death, did anyone put them into print."

[past.margaret_of_austria]
name = "Margaret of Austria"
lore = "She governed the Netherlands for her nephew Charles and raised him from a boy. In 1529 she sat down with Louise of Savoy, mother of the French king, and the two women made the “Ladies’ Peace,” halting a war two kings could not end."

[past.eleni_ethiopia]
name = "Eleni of Ethiopia"
lore = "A Muslim princess of Hadiya who married into the Ethiopian royal house and took its faith, she ruled as regent for a boy king and sent an envoy all the way to Lisbon. A Portuguese priest wrote down what the people said: while she lived, everyone was protected; when she died, great and small alike felt they had died with her."

[past.ahmad_ibn_ibrahim]
name = "Aḥmad ibn Ibrāhīm al-Ghāzī"
lore = "Harar calls him the Lord of the Conquest; the highlands call him Grañ, the Left-Handed. For more than a decade his armies burned the highland churches, until he fell at Wayna Daga in 1543. One side still sings of that battle as a lament, the other as a hymn of thanks."

[past.afonso_i_kongo]
name = "Afonso I of Kongo"
lore = "In 1526 he wrote to the king of Portugal: “Every day the merchants are seizing our people, and our land is being emptied.” He set officials to check whether each person sold was “lawfully” a slave. The letter reached Lisbon; the ships kept sailing from Mpinda."

[past.vlad_iii]
name = "Vlad III"
lore = "Old Wallachians tell of his law: a golden cup left by a well, and in all his reign no one dared take it. The German pamphlets tell of something else—forests of stakes, and a prince who dined among them."

[past.mihnea_cel_rau]
name = "Mihnea cel Rău"
lore = "Dracula’s son, who ruled for less than two years and earned the name “the Bad” for how harshly he dealt with the great boyars. In 1510 he was stabbed to death in Sibiu as he left Mass; yet the night watchmen swear that on winter nights afterward they saw his back crossing the square."

[past.kunjali_marakkar_i]
name = "Kunjali Marakkar I"
lore = "The Zamorin of Calicut put the sea in his hands. His fast boats hid in Malabar’s river mouths and backwaters, waiting for Portuguese ships to lie helpless in a calm. Malabar’s Muslims still sing of him."

[past.giocangga]
name = "Giocangga"
lore = "When Ming troops surrounded Gule in 1528, he went inside to bring his granddaughter out and died when the stockade fell. Jianzhou says Nikan Wailan led the Ming soldiers there, and his descendants have kept that account open ever since."

[past.taksi]
name = "Taksi"
lore = "Taksi followed his father into Gule and never came out. The Ming called it a mistake, returned the two bodies, and added thirty trade patents and thirty horses. His son Nurhaci accepted them—and counted that day as the first of his grievances."
