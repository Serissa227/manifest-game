responses = ["observe", "avoid"]
outcomes = { observe = { text = "问湖边的人谁被拖走过", reply = "湖边的老妇人讲，有个渔人身上挂着一块绿玉，夜里下水，人就没有再上来。只浮出一块玉。湖上的祭司去收殓，说只有没有罪过的祭司才敢碰。", clue = "c11_creature_ahuizotl_known" }, avoid = { text = "夜里不靠湖边", reply = "船员把身上的玉石全收进舱底，夜里不靠湖边，在远处抛锚过了一夜，白耽误了一天。天亮时湖面平得像一块铅板，什么也没有。", delay_days = 1 } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
ports = ["veracruz"]

