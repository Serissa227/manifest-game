# 自由船长·钦查筏商之子·个人小线「筏上的绳」（故事 2.0，A5 / E37 契约）
#
# 标签：钦查筏商之子·个人小线。“我”是玩家自创的船长：不写性别、外貌、肤色、身高与名字；别人称“船长”“某家的孩子”。
# 轨道：free_chincha_rafts（kind = main，auto = true，start = a00_gate）。门槛章 a00_gate 的 when 读 c12_voyage_custom_chincha_rafts，default 设 c13_free_chincha_rafts。
# 章数：5 章（a00_gate 门槛见闻、a01_wine 伊卡来的酒、a02_cord 和约的绳、b01_drake 夜里进港的英国船、c01_last 最后一条筏）。没有变体，没有 HIST_ 占位旗标。
#
# 依据：
#   史实——钦查一带的巴尔萨木筏，印加时代沿岸运货、往北换海菊蛤贝壳；西班牙人来后木筏被大船与骡队挤掉；
#   伊卡一带的葡萄园与酒在 1550—60 年代兴起；1566 年阿科班巴和约（比尔卡班巴的印加提图·库西与西班牙人议和，年金与地产两年没有兑现）；
#   1579 年 2 月英国船夜袭卡亚俄，砍断港内船的锚缆；波托西的银经阿里卡出海，大帆船取代了沿岸的木筏。
#   原创——筏商一家（“我”的家）、结绳官库西（cast 里的 kusi_wayna，在本线里是老结绳官，1557 年从钦查下到卡亚俄）、印加的使者、那根记着和约的绳、伊卡的葡萄园主与老筏户。
# 伏笔：a02 的“藏”选项设 c13_free_chincha_rafts_cord_kept，决定 c01 的绳去向；c01 拆筏时只写“看当年缠进了哪里”，不替玩家定。
#
# 读的旗标：c12_voyage_custom_chincha_rafts（门槛，C12 设）；c13_free_course_explore（b01 的 follow 选项，主干 a01 设）。
# 设的旗标：c13_free_chincha_rafts；c13_free_chincha_rafts_cord_kept。
# 回忆插画清单：
#   mem-free_chincha_rafts-a01 往北的老路：灰蓝的太平洋上，几条巴尔萨木筏挂着方帆往北漂，筏上堆着红色的海菊蛤壳。
#   mem-free_chincha_rafts-b01 夜里漂出去的船：夜里的卡亚俄港，几条砍断了锚缆的大船慢慢漂向港外，海滩上的筏户举着火把看。
#   mem-free_chincha_rafts-c01 最后一条筏：卡亚俄的海滩上，一条巴尔萨木筏被拆开，木头一根根分给围过来的渔家，港里停着西班牙的大帆船。
#   mem-free_chincha_rafts-c01b 还回去的绳：库斯科的石墙下，一个老妇人接过一根打满结的旧绳，用手指一个结一个结地摸。
# 等待的包：C12（门槛旗标）；整合方把本文件登记进 world.toml 的 stories，并在 runtime_links 中核对 free_chincha_rafts 的 pending。

[[tracks]]
key = "free_chincha_rafts"
name = "筏上的绳"
kind = "main"
start = "a00_gate"
auto = true
cast = ["kusi_wayna", "francis_drake"]

# ───────────── 第一幕「启航」1557—1561 ─────────────

# a00 门槛见闻：只有选了钦查筏商之子的家庭才会在这里开轨道。
[[tracks.chapters]]
key = "a00_gate"
title = "少了一半的筏"
text = "正月的卡亚俄海滩，钦查来的木筏停了一排，比父辈那时候少了一半。印加的时候，钦查的筏商成千上万，如今剩下的几家替西班牙人运货。老结绳官库西坐在筏边打结。筏商家的孩子要出海了，他在孩子的桅上系了一根绳，打了三个结：一个记来路，一个记去路，第三个他没说。海滩上的老筏户转述他的话：“库西说，绳记得，人也得记得。”"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "callao"
cast = ["kusi_wayna"]
mood = "tender"
when = [{ kind = "flag", flag = "c12_voyage_custom_chincha_rafts" }]
news = "卡亚俄海滩上钦查的木筏比从前少了一半，老结绳官库西在一个要出海的孩子桅上系了一根打了三个结的绳。"

[tracks.chapters.default]
next = "a01_wine"
effects = [{ kind = "flag", flag = "c13_free_chincha_rafts" }]

# a01 伊卡来的酒：葡萄园主要筏、要快；老筏户想守老路。三个选项各有各的代价。
[[tracks.chapters]]
key = "a01_wine"
title = "伊卡来的酒"
text = "夏天的卡亚俄，伊卡的西班牙葡萄园主来海滩上雇筏。他们的酒装在大陶罐里，要从南边的海湾运到利马，一筏一筏地运，给的是银子。老筏户们还想走老路：往北去，到海湾换海菊蛤，再把贝壳背上山。那是印加时候钦查人发财的路。葡萄园主蹲在沙上，拿手指敲了敲一罐酒：“海菊蛤值几个钱？这一罐比它值钱。山上的神也不要贝壳了，你运哪一样？”老筏户把脸转开：“往北的路，我爷爷走了一辈子。”我没说出口：一条筏，一次只能走一条路。"
at = "callao"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1559, 2, 1] }]
deadline = [1561, 10, 31]

[tracks.chapters.timeout]
next = "a02_cord"
effects = [{ kind = "letter", person = "kusi_wayna", text = "孩子：筏户们替伊卡的西班牙人运了两年酒，往北的老路，已经没有人走了。我在绳上记了一笔，你回来看。——库西" }]

[[tracks.chapters.choices]]
key = "wine"
text = "接葡萄园主的活，一筏一筏运酒"
next = "a02_cord"
effects = [{ kind = "cash", value = 1500 }]
news = "卡亚俄的人说，伊卡的葡萄园主雇走了好几家筏户，一筏一筏往利马运酒，海滩上的老筏户骂了一整天。"
reply = "酒罐用草绳一层层捆在筏上，一路上浪打过来，没碎一个。卸货的时候，葡萄园主一罐罐数过去，数完又多给了一罐，说是“新酒，尝尝”。他的管家在旁边记账，笔尖没停。"

[[tracks.chapters.choices]]
key = "north"
text = "跟老筏户往北走一趟老路"
next = "a02_cord"
effects = [{ kind = "memory", memory = "mem-free_chincha_rafts-a01", title = "往北的老路" }]
news = "卡亚俄的人说，老筏户的几条木筏又往北去了，一去半个月，海湾里的老交情还在。"
reply = "北边的海湾里，潜水的人还认得钦查的筏，蛤壳一筐筐搬下来，要的价比去年低了一半。贝壳背上山那天，只卖出去一半。剩下的被雨泡得发白，老筏户一个个捡起来，又装回筐里。"

[[tracks.chapters.choices]]
key = "knots"
text = "用绳结替筏户们把这一季的账记清"
next = "a02_cord"
effects = [{ kind = "skill", skill = "quipu", value = 20 }]
check = { attr = "numeracy", base = 20, per = 7 }
news = "卡亚俄海滩上的人说，某家的孩子把这一季的账打成了绳，挂满了木桩，老结绳官摸了一遍。"
reply = "“我”打完的绳挂在海滩的木桩上，一根根垂着，像一串没人认领的账。库西一根根摸过去，摸到第四根停下，点点头，只改了一个结。改的是“我”最得意的那个结，他改得很轻。"
fail = { next = "a02_cord", effects = [], news = "卡亚俄海滩上的人说，某家的孩子替筏户打的账绳有两个结打反了，老结绳官看了半天，解开重打。" }

# ───────────── 第二幕「潮涌」1566—1569 ─────────────

# a02 和约的绳：使者要“我”的筏把绳带进利马的审问院。绳上的结是西班牙人答应过的账。限期 1569-06-30，超时使者回山，绳留在库西手里。
[[tracks.chapters]]
key = "a02_cord"
title = "和约的绳"
text = "比尔卡班巴的印加提图·库西跟西班牙人议了和。西班牙人答应给他年金，给他的儿子留地。和约签了两年，答应的东西一样也没到。印加的使者下山来，走到卡亚俄的海滩上，找到了筏商家的船长。使者的背囊里是一根打满结的绳，一样东西一个结，记着和约里西班牙人答应的每一样。使者要“我”的筏把他和绳一起带到利马的审问院，当着法官的面念。“你们的纸会烂，”他把绳摊在沙上，“我们的绳，一百年也是这几个结。”“念一遍要几天？”我问。我想知道，法官会不会听一根绳。"
at = "callao"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1566, 9, 1] }]
deadline = [1569, 6, 30]

[tracks.chapters.timeout]
next = "b01_drake"
effects = [{ kind = "letter", person = "kusi_wayna", text = "船长：比尔卡班巴的使者回山里去了，没有等到你。那根绳我收着，等你回来，我们一起念。——库西" }]

[[tracks.chapters.choices]]
key = "lima"
text = "带使者和绳去利马的审问院"
next = "b01_drake"
effects = [{ kind = "reputation", faction = "vilcabamba", value = 2 }]
check = { attr = "eloquence", base = 20, per = 7 }
news = "利马的人说，一个印加使者带着一根打满结的绳进了审问院，法官叫人数绳上的结，数完没说认不认。"
reply = "法官听完，没说认不认。“我”开口：不用念，只数。书记不肯碰绳，就站在一旁看“我”数。“我”从头数到尾，数到中间，书记的嘴也跟着动了，一个数都没错。法官在簿子上记下一个数，记的是结的多少，不是结的意思。使者接过簿子看了一眼，把绳重新缠好，回山前站在门口，说：“数对了。意思还没人念。”"
fail = { next = "b01_drake", effects = [{ kind = "reputation", faction = "vilcabamba", value = 1 }], news = "利马审问院的门卫不许带绳的人进门，印加的使者在门口站了一天，最后递进去一张纸。" }

[[tracks.chapters.choices]]
key = "hide"
text = "把绳藏在筏上，等更好的时候"
next = "b01_drake"
effects = [{ kind = "flag", flag = "c13_free_chincha_rafts_cord_kept" }]
news = "卡亚俄海滩上的人说，比尔卡班巴来的使者跟一条钦查的筏说了几句，独自上了山，没人听清他说什么。"
reply = "“我”把绳缠在筏的桅杆底下，外面再缠一层草绳，缠到看上去只是一根旧木头。使者站在沙上看着，没有拦，也没有问。缠完了，“我”用手按了按，草绳勒进了木头里。草绳的结是“我”自己打的，比库西教的松，一拽就开，可没人会去拽它。他看了“我”一眼，说了句山里的话，“我”没听懂，只听出里头有个数字。然后他往山上走，走出几步，在坡上站住，朝那条筏望了望。那天夜里，“我”坐在筏上，手一直按着桅杆。没人知道桅杆里缠着一份和约。"

[[tracks.chapters.choices]]
key = "back"
text = "劝使者回山里去，利马不会听"
next = "b01_drake"
effects = []
news = "卡亚俄海滩上，一个印加使者听了一个筏商的劝，把绳收回怀里，一步一步往山上走了，没有再回头。"
reply = "“我”把利马的事说了一遍：书记不认绳，法官未必听。使者看了“我”很久，把绳收回怀里，缠得比来时更紧。“利马的纸，”他说，“山里人见过。它不认人。”他说他会再来。他后来没有来，那根绳也没有再从山上下来。他把绳的一头塞进衣襟里，走得很慢。走到沙滩尽头，他朝停在那里的木筏望了一眼，才往山上去。他的脚印一直延伸到山脚下，潮水来时才慢慢抹平。“我”在沙滩上站了一阵，才发现手里攥着一截草绳头，是他缠绳时掉在沙上的，“我”顺手捡了起来。"

# ───────────── 第三幕「更远之处」1579—1589 ─────────────

# b01 夜里进港的英国船：1579 年 2 月的卡亚俄。stage 章，窗口没人回应就走 default，不写 when（上一章结算后即进入）。
[[tracks.chapters]]
key = "b01_drake"
title = "夜里进港的英国船"
text = "二月的一个夜里，一条没挂灯的船悄悄开进卡亚俄港，船上的人说英国话。他们挨个搜港里的船找银子，找不到就用刀把锚缆砍断，让船漂出去。海滩上的筏户被惊醒，光着脚站在沙上，看那些大船一条条往外漂。“银子！哪条船装着银子？”一个英国水手举着火把喊，口音很重。我想：他们要的是运银的大船，它前几天刚往北开走了。我数着港里的船，数到第七条，那条的锚缆就断了。我的筏就泊在最外头，离那条船只有一箭远。一个水手爬上舷梯，用刀背敲着舱门，喊了几声西班牙话，没人应。一个老筏户压低声音：“别喊，把火把举高，让港里的人看见我们。”"
stage = "involve"
window = [[1579, 2, 1], [1579, 3, 15]]
at = "callao"
cast = ["francis_drake"]
speaker = "captain"
mood = "tense"
news = "卡亚俄的人说，一条英国船夜里进港，搜了一圈没找到银子，把港里的船锚缆全砍了。"

[tracks.chapters.default]
next = "c01_last"
effects = []

[[tracks.chapters.choices]]
key = "warn"
text = "划筏去给停在外面的船报信"
next = "c01_last"
effects = [{ kind = "fame", value = 1 }, { kind = "reputation", faction = "peru", value = 2 }]
check = { attr = "agility", base = 20, per = 7 }
reply = "外面的船听见了，连夜起锚，躲进了海湾。“我”的筏划回来的时候，海滩上的人接过桨，没人说话。天亮时英国船已经走了，礁石上搁着一截被砍断的锚缆，没人肯去捡。“我”上岸时，手掌磨破了，血印在桨柄上。"
fail = { next = "c01_last", effects = [], news = "卡亚俄海滩上，有个钦查来的孩子想给外头的船报信，筏还没出去，就被英国人的小艇用桨推回了沙滩。" }

[[tracks.chapters.choices]]
key = "ashore"
text = "把筏上的人都撤上岸"
next = "c01_last"
effects = [{ kind = "memory", memory = "mem-free_chincha_rafts-b01", title = "夜里漂出去的船" }]
reply = "筏户们蹲在沙滩上看了一夜，火把一根根插在沙里，没人回家。天快亮的时候，一个孩子指着港口说，那些大船漂起来，像没人要的木头。大人们没有接话，有人去拿了水和饼，一人一口分着，没有人坐下，都站在沙上。"

[[tracks.chapters.choices]]
key = "follow"
text = "远远跟着英国船，看它往哪里去"
next = "c01_last"
effects = [{ kind = "chart", region = "panama_gulf" }]
requires = [{ kind = "flag", flag = "c13_free_course_explore" }]
hint = "追一条外国船出海，没有买卖，也没有名声，只有立过探海志向的船长，筏户们才肯跟。"
reply = "英国船往北开得很快，“我”的筏跟了三天，跟丢了。回来的路上，“我”把北边海湾的水深一处一处写在绳上，写到一半，手被海风冻得直抖。夜里英国船拐进一片黑水，就再也没有看见它。"

# c01 最后一条筏：1587 年起的终章。拆筏的人在桅杆底下找那根绳。落点三个：拆筏分木、最后一次出海、还绳。
[[tracks.chapters]]
key = "c01_last"
title = "最后一条筏"
text = "卡亚俄的港里停满了西班牙的大船，波托西的银子从阿里卡运来，再往巴拿马去。海滩上的巴尔萨木筏一条条少了，如今只剩“我”家这一条。家里的长辈说，木头朽了，筏也该拆了。好的木头留给还要打渔的人家，烂的当柴烧。我没接话，只看着桅杆上那一圈圈草绳，颜色比木头还旧。“筏是木头的，会朽。绳记得，人也得记得。你记得的，比筏久。”库西已经很老了，坐在沙滩上看潮，没有问拆筏的事，只问那根和约的绳后来怎样了。他慢慢地说：“绳要还，就得有人上山去。”我想再驾它出海一次。拆筏的人把桅杆底下的草绳一层层剥开。最里头有没有那根绳，要看当年“我”把它缠进了哪里。"
at = "callao"
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1587, 3, 1] }]
deadline = [1589, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = []

[[tracks.chapters.choices]]
key = "give"
text = "把筏拆了，木头送给还要打渔的人家"
next = "done"
effects = [{ kind = "memory", memory = "mem-free_chincha_rafts-c01", title = "最后一条筏" }]
news = "卡亚俄海滩上，一条老巴尔萨木筏被拆了，木头分给了围过来的渔家，港里的西班牙大船照旧往巴拿马开。"
reply = "分木头的时候，一个渔家的孩子蹲在筏边，问这条筏去过哪里。“我”一处一处数给他听：北边的海湾，印加的码头，英国船漂出去的那个夜里，还有好几条没人记的水道。数到一半，他靠着一根木头睡着了，木头上还留着打结的绳印。“我”把最后一段也数完了，数到连自己也记不清的地方，才停下来。大人们一担一担把木头挑走，有人说烧了可惜，有人说拿去做门框，最后还是都分了。分到“我”手里的，只有一截带结的木条，“我”把它拿在手里，没有放下。"

[[tracks.chapters.choices]]
key = "sail"
text = "最后一次驾筏出海"
next = "done"
effects = [{ kind = "fame", value = 1 }]
check = { attr = "seamanship", base = 20, per = 7 }
news = "卡亚俄港里有人说，一条钦查的老木筏从西班牙大船中间穿出了外港，船舷上的水手还吹了声口哨。"
reply = "筏从大帆船中间穿过去，木头在水里吱吱地响。西班牙水手趴在船舷上看，有人用手掌拍了一下船舷，有人把帽子摘了下来。“我”没有回头，只看着前面那条窄窄的水道。出了外港，浪从筏底下钻上来，又从两边落下去，像这条木头很久没有这样走过了。有个老筏户在船尾数着浪，数到七，就喊一声，喊得很短。“我”让人把舵绳攥紧，一直没松手。港口的钟声从身后追上来，又慢慢落下去。岸上有人喊了一句，听不清，只听见一个“筏”字，像是在问这条筏还回不回来。"
fail = { next = "done", effects = [{ kind = "memory", memory = "mem-free_chincha_rafts-c01", title = "最后一条筏" }], news = "卡亚俄港外，一条老木筏出了港口就开始进水，掉头回了海滩，长辈们已经在等着拆了。" }

[[tracks.chapters.choices]]
key = "cord"
text = "把那根和约的绳带上山，还给比尔卡班巴的后人"
next = "done"
effects = [{ kind = "reputation", faction = "vilcabamba", value = 2 }, { kind = "memory", memory = "mem-free_chincha_rafts-c01b", title = "还回去的绳" }]
requires = [{ kind = "flag", flag = "c13_free_chincha_rafts_cord_kept" }]
hint = "那根绳早不在你手里了。"
news = "卡亚俄海滩上的人说，某家的船长去了一趟山上，回来时空着手，只说东西交给了一个老妇人。"
reply = "接绳的是一个印加的老妇人，住在山上的石墙下。她接过绳，一个结一个结地摸，指尖在每个结上停一停。“我”说，这根绳在桅杆底下缠过。她没有问在哪里，只问缠的时候有没有把结打紧。摸到最后一个，她抬起头，看了“我”一眼，说：“他们答应的，一样也没给。”她把指尖在最后一个结上按了很久，才松开。然后她把绳挂在门口的石墙上，院子里的孩子围过来看那些结，没有一个人问那是什么。门口晒着的玉米被风吹下几粒，落在石板上，没人去捡。"
