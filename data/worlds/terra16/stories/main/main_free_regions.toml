# 修士的海图：宿务的老修士要找一条回美洲的路，他要的是北边那股黑水。
[[tracks.chapters]]
key = "a1_offer"
title = "修士的海图"
text = "宿务的海滩上刚插上西班牙人的十字架，没有人肯去看它。岸上的村子前几天被烧过，还冒着烟。黎牙实比的船停在湾里；一个穿奥斯定会黑袍的老修士——乌尔达内塔，从前是领航员——在船舱里摊开一张太平洋的图，图的北半边几乎什么也没画。他听说“我”从北边的海来，想知道日本以东那股黑色的海流往哪里走。“从这里往东，四十年没有一条船回得去。我要的不是风，是那股往北的黑水。”老修士的手指在图上敲了敲：“我年轻时在这片海上困过八年。我要找的是回去的路。”我（心里）：他图上北边那一半，跟我的一样，是没画的。"
when = [{ kind = "flag", flag = "c13_main_free" }, { kind = "date", from = [1565, 4, 28] }]
at = "cebu"
speaker = "captain"
mood = "mystic"
cast = ["andres_urdaneta", "miguel_lopez_legazpi"]
deadline = [1565, 5, 20]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "kuroshio"
text = "把你知道的黑潮讲给他听"
next = "a2_sailing"
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "你没在北边的海上认过潮，讲不出黑潮往哪里拐。"
effects = [{ kind = "flag", flag = "c13_free_southeast_asia_a_kuroshio" }, { kind = "affinity", person = "andres_urdaneta", value = 5 }]
reply = "老修士一边听一边在图的北边画了一道弯线。画完他说：“那就往北再走十度。”"

[[tracks.chapters.choices]]
key = "winds"
text = "凭这些年的航海日志，描述北边海上的风"
