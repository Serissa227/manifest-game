# 交到国王手里：限期送信，书记说国王只读跟打仗有关的信。
[[tracks.chapters]]
key = "b2_lisbon"
title = "交到国王手里"
text = "里斯本的王宫在河边，国王塞巴斯蒂安满脑子是摩洛哥的十字军，书记们忙着替他征兵、征船。“我”带着刚果王的信在宫门外等，铜丝已经锈了。卖橄榄的老头问：“那封信是给谁的？”“我”没答。远处的台阶上，年轻的国王骑马经过，没有回头。国王的书记从台阶上下来，手里夹着一摞文书：“刚果？国王这个月只听摩洛哥。你等明年吧。”书记说国王只读跟打仗有关的信。这封信里一个字也没提打仗。信纸的边角已经被雨水泡软了。"
at = "lisbon"
speaker = "captain"
mood = "tense"
cast = ["sebastian_i"]
objectives = [{ kind = "item", item = "kongo_royal_letter", qty = 1, text = "带着刚果王的信到里斯本" }]
deadline = [1578, 6, 20]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "item", item = "kongo_royal_letter", qty = -1 }]
news = "里斯本的人说，有一封刚果王的信在路上走了两年，送到时国王已经去了摩洛哥。"

[[tracks.chapters.choices]]
key = "clerk"
text = "把信交给国王的书记，看着他登记"
next = "done"
effects = [{ kind = "item", item = "kongo_royal_letter", qty = -1 }, { kind = "reputation", faction = "kongo", value = 3 }, { kind = "fame", value = 1 }]
reply = "书记在登记簿上写下“刚果，信一封”，把它放在一摞信的最底下。"

[[tracks.chapters.choices]]
key = "jesuits"
text = "交给耶稣会的神父，托他们在宫里说"
next = "done"
effects = [{ kind = "item", item = "kongo_royal_letter", qty = -1 }, { kind = "reputation", faction = "kongo", value = 2 }]
reply = "神父读完信，在胸前画了十字，说他会在国王出征前找个机会。他没说找不找得到。"

[[tracks.chapters.choices]]
key = "read"
text = "在码头上把信念给来往的人听"
