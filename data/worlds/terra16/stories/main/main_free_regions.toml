next = "b2_lisbon"
effects = [{ kind = "item", item = "kongo_royal_letter", qty = 1 }]
reply = "使者用三层树皮布把信包好，又在外面缠了一圈铜丝。他说铜丝是刚果王的手。"

[[tracks.chapters.choices]]
key = "governor"
text = "先把信给诺瓦伊斯看"
next = "done"
