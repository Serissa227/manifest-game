text = "主教座堂前挤满了人，总督要当众宣读效忠新王的誓词。台阶下的人群挤成一团，有人踮着脚，有人把孩子举过头顶。安东尼奥的人混在人群里，帆布缝着的信还没送出去，他把帆布攥在手里，指节发白。玛丽亚站在台阶下，手里拿着仓库的钥匙。她的指尖把钥匙上的齿痕摸了一遍又一遍。总督的声音很大，念到“腓力”的时候，人群里有人低低地咳了一声。誓词读到一半，钟楼上的钟敲错了一下。台阶边的书记催道：“快，念完就散。”安东尼奥的人凑过来，压低声音：“读完这一页，港口就要封了。船长，你的船还走得了吗？”"
