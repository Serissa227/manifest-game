text = "冬天，圣奥古斯丁的木头城墙立起来了，教堂是一座茅草顶的小屋。南边那个河口，西班牙人自己管它叫“马坦萨斯”，屠杀。提姆夸的孩子们在海滩上捡法国人的扣子。一个提姆夸孩子把捡来的扣子串成了项链，戴在脖子上，谁的扣子，他自己也不知道。提姆夸的老人对着海滩摆手：“先来的穿蓝衣服，后来的穿红衣服。都说会留下。”"
