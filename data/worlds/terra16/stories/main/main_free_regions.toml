# 折了三折的纸：伊贺的逃兵要卖一条消息，也要一条船。
[[tracks.chapters]]
key = "c1_offer"
title = "折了三折的纸"
text = "入梅前的堺，雨下得黏。一个自称从伊贺逃出来的男人，前一年织田家平了伊贺，他在码头的酒屋里找到“我”，手里一张折了三折的纸，画着京都一座寺的院墙。茶碗里的茶早凉了，他也没碰。他的手指头上有烧伤的疤。他说明智日向守的兵月初要“往西”，可不一定往西。“我”问：“你要的是银子，还是船？”他回了一句：“要银子的人，等得起。要船的人，等不起。”伊贺人：“信长烧了我们的山。这张纸能救他，也能不救他——看你出多少。”我（心里）：他卖的哪是消息，分明是一条船。"
