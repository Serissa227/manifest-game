effects = [{ kind = "flag", flag = "c13_free_lever_H35" }, { kind = "reputation", faction = "venice", value = 3 }, { kind = "fame", value = 2 }]
reply = "船擦着巡船的桨冲进港，城墙上的人在喊“我”听不懂的威尼斯土话。"

[tracks.chapters.choices.fail]
