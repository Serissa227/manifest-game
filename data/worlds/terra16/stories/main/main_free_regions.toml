# 上山的马队：马夫们要走三个星期才到王的营。维克拉姆自己没有上马。
[[tracks.chapters]]
key = "a2_talikota"
title = "上山的马队"
text = "冬天，马队从巴特卡尔出发上西高止山，走三个星期才到王都的边境。马夫们裹着羊毛毯子，在港口的火堆边抽签，抽到的先上山。胡拉姆一大早站在山路口，数着马蹄印，一个也不肯数错。他一边数一边念，数到第三十匹，嘴唇不动了。比贾布尔的探子也在港里，打听马的数目和上山的日子，不时拿眼睛去量马背。一个探子笑着问“我”：“这一队有多少匹？我好替我的主人记账。”维克拉姆把马匹清单折了又折，折痕都起了毛。出发那天，维克拉姆自己没有上马，他说要留在港里等下一批。他把清单递给“我”：“我给每个人都铺好了退路……轮到自己，脚迈不开。”“我”接过清单，纸角被手心捂得发软。"
