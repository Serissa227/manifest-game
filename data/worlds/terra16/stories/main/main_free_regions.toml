[[tracks.chapters.variants]]
key = "v3_oda"
when = [{ kind = "flag", flag = "c13_free_east_asia_a_oda" }]
text = "夏末，热田神宫的工匠在本殿外面砌一道土墙，土里掺了油和石灰，一层一层夯，顶上盖瓦。神官说这是织田家打赢以后献给神宫的。热田的商人们站在墙边算账，算谁家的木札还作数。那个在砦子里领头的足轻来热田结账，账结清了，他带来的人少了一半。墙夯到一半，一个老工匠从墙土里拣出一枚生锈的箭镞，看了看，又顺手夯了回去。夯墙的工匠对旁人说：“这墙要站三百年。三百年后有人问起，就说是那年的雨砌的。”"

[[tracks.chapters.variants]]
key = "v4_warned"
when = [{ kind = "flag", flag = "c13_free_east_asia_a_warned" }]
text = "夏末，热田神宫的工匠在本殿外面砌一道土墙，土里掺了油和石灰，一层一层夯，顶上盖瓦。神官说这是织田家打赢以后献给神宫的。热田的商人们站在墙边算账，算谁家的木札还作数。那天在今川营外笑话“我”的侍大将，没有回骏河。墙夯到一半，一个老工匠从墙土里拣出一枚生锈的箭镞，看了看，又顺手夯了回去。夯墙的工匠对旁人说：“这墙要站三百年。三百年后有人问起，就说是那年的雨砌的。”"

