text = "年底，第一批书从利马运到卡亚俄，要装船发往各教区。书不厚，每一页分三栏：西班牙语、克丘亚语、艾马拉语。书的封面是粗布的，摸上去像一块旧帆。那个码头上长大的通事也在送书的队伍里，他说要把书送回他母亲的村子。码头上一个不识字的搬运工翻开一本，指着中间那一栏，念出了声。他认得那是他母亲说的话的样子。他念对了一句，周围的人都愣住了。搬运工（转述）：“这是我们的话。写成字，原来是这样的。”"
