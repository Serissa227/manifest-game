# 三种话的教理问答：利马要把书印成三种话，每句话要三个通事分别译。
[[tracks.chapters]]
key = "c1_offer"
title = "三种话的教理问答"
text = "利马在开公会议，主教们决定把教理问答译成克丘亚语和艾马拉语，印出来发到每个教区。耶稣会的阿科斯塔神父负责起草，他在卡亚俄的码头上等一条船：从墨西哥来的印书匠带了一台印机，印机在码头上盖着麻布，一个搬运工伸手去摸，被人拍开了。可是纸不够，懂两种印第安话的通事也不够。阿科斯塔的书桌上堆着一摞草稿，有的页边上写满了小字。阿科斯塔：“一句话译错，就是一个村子信错。所以我要三个人，三遍。”书里每一句话，都要请三个通事分别译一遍：“三个都对上了，才印。”"
