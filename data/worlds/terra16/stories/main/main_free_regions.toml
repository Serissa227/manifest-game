[[tracks.chapters.variants]]
key = "v1_survives"
when = [{ kind = "flag", flag = "h41_vilcabamba_vilcabamba_survives" }]
text = "卡亚俄的雾很浓，正是南半球的冬天。谈判的使者已经进了山，码头上的人说：“今年的征兵鼓敲得没那么凶了。”山那边的消息一阵一阵传下来：比尔卡班巴那边还在打，印加王的人守着山口，副王的书记每天在库斯科数人头。雾里传来骡队的铃声，一串接一串，往海边的小港去了。一个修士坐在石墩旁边，把请愿书摊在膝盖上，一个字一个字地数。一个从山里下来的骡夫坐在码头的石墩上，抽着烟，他说：“山口的人在等一封信。”他抽完最后一口，把烟头按在石墩上。“我”的船在港里等了两天，没有人来买火药。"

