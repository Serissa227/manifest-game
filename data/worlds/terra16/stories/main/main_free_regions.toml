when = [{ kind = "flag", flag = "h35_cyprus_siege_famagusta_holds" }]
text = "一月的海浪打在法马古斯塔的城墙上，港口外只剩几条奥斯曼的巡船，灯火一闪一闪，像在数奎里尼的船。奎里尼的船队趁风冲过去，城墙上的人举着火把，火光照得水面一片红。奎里尼在船头喊：“快卸，天亮前必须出去！”守将布拉加丁亲自到码头上接粮，披着一件旧斗篷，手一直在抖，他把手藏进斗篷底下。卸完粮，布拉加丁请船长们带走城里最小的孩子。他说：“粮够吃到夏天。夏天以后的事，交给天主。孩子们，交给你们。”一个裹着毯子的孩子仰头问：“船上有没有饼？”布拉加丁说春天奥斯曼人会带着更多的炮回来。水手们把最后一袋饼扔上了岸。城墙上没有人欢呼，只有人低头去接。城墙上的人说，今年夏天他们能守住。别人都不信，他们信。"

[[tracks.chapters.choices]]
