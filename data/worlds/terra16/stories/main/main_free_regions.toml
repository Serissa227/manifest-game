# 副王的战书：征兵的鼓，修士的请愿书。
[[tracks.chapters]]
key = "b1_offer"
title = "副王的战书"
text = "卡亚俄的码头上贴着副王的告示：比尔卡班巴的印加杀了副王的使者，从今天起是叛逆。征兵的鼓一天敲三遍，火药商人在港里抢船。军需官的账本摊在桌上，一排排的火药桶画得整整齐齐。一个多明我会的修士在码头边拦住“我”，手里一卷请愿书：他要有人把它送到库斯科去，求副王先谈，再打。他的鞋底磨穿了一半，走路一瘸一拐。修士说，请愿书上签名的人里，有一半是在比尔卡班巴有亲戚的混血儿。修士：“打下比尔卡班巴，不过是多一座空城。谈下来，是多几千个活人。”"
