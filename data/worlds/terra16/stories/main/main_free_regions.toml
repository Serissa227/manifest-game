# 德川殿在堺：快马带来本能寺的火。德川的随从要走伊贺的山路。
[[tracks.chapters]]
key = "c2_honnoji"
title = "德川殿在堺"
text = "堺的会合众在宴请一位来游览的客人——三河的德川家康，带着几十个随从看南蛮船、喝茶。初二的早上（公历六月二十一日），京都方向来的快马带来消息：本能寺起了火。德川的随从们脸色变了，有人说要走伊贺的山路回去。随从里有人压低了声音：“快马是半夜到的，京都要是真的，三河也要变天。”堺的会所里挂着南蛮的地图，德川的人对着地图指来指去，茶碗还在手边，有人的茶已经凉了。随从：“山路有伊贺的残党，海路有九鬼的船。船长，你走过哪条？”“我”没有答，只看着桌上那只没人动过的茶碗。德川殿一句话也没说，只让人去备马。我（心里）：那张纸要是早送十天……"
