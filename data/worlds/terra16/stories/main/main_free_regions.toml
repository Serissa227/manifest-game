text = "八月以后，逃回来的人一个个进了丹吉尔，衣服是破的，脚是烂的。三一会的胡安修士站在城门口的石阶上念名字：念到的，家属哭着上前；念不到的，家属等着下一批。国王的名字，没人敢念。念到最后，修士停下来，把一张纸翻过去。背面写的是国王，他没念。胡安修士（转述）：“活着的念名字，死了的念祷文，不知道的……先不念。”"
