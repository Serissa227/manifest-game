# 罗安达的新墙：刚果王的使者在沙滩上等了一个月。
[[tracks.chapters]]
key = "b1_offer"
title = "罗安达的新墙"
text = "罗安达的海湾里，诺瓦伊斯的人在砌一座新堡，一边砌墙一边往船上装人——用链子拴着的人。总督的书记在台阶上登记人数，笔尖上的墨一滴一滴落在纸上。沙滩上的脚印一排排往船边去。一个刚果王阿尔瓦罗一世派来的使者在沙滩上等了一个月，手里一封用葡萄牙文写、封蜡压着十字的信，要送给里斯本的国王；他不肯把信交给总督的人。刚果使者：“国王的信，要国王的手拆。总督的手，会把它放进火里。”他把信的内容念了一句：“别再让商人把我的子民装上船。”"
when = [{ kind = "flag", flag = "c13_main_free" }, { kind = "date", from = [1576, 2, 1] }]
at = "luanda"
speaker = "captain"
mood = "tense"
cast = ["paulo_dias_novais", "alvaro_i_kongo"]
deadline = [1576, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
