# 鲁昂城下：王军攻城，逃难的人挤在码头上，一个印书匠背着一块木版。
[[tracks.chapters]]
key = "a2_rouen"
title = "鲁昂城下"
text = "秋天，王军围了鲁昂，炮声顺着塞纳河传到海边，一下一下，像有人在远处敲鼓。迪耶普的码头上挤满了从鲁昂逃出来的人，抱着包袱，有的还穿着睡衣。英格兰的援兵到了勒阿弗尔，没到鲁昂。英格兰的水手站在船头喊：“只收带得动的！”一个老妇人把铺盖扔在码头上，回头去抱孙子。一个孩子坐在包袱上，怎么哄也不肯起来。逃难的人里有一个印书匠，背上背着的是一块刻好的木版，衣服早丢在了路上。他冲船上的人喊：“衣服丢了不要紧，这块版丢了，那本书就没有了。”勒泰斯蒂站在他身后，把一卷图稿塞进“我”的手里，图稿外面包着油布。“我”没问他要去哪里。"
window = [[1562, 9, 15], [1562, 11, 15]]
at = "dieppe"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["guillaume_le_testu"]
news = "迪耶普的人说，鲁昂城破以后，码头上全是逃难的人，有个印书匠背着一块木版就上了去英格兰的船。"

