# 彭世洛来的人：王子要枪、要甘蔗。大城的商人问，船停在这里是走还是留。
[[tracks.chapters]]
key = "c1_offer"
title = "彭世洛来的人"
text = "大城已经当了十几年缅甸的属国。一个从北边彭世洛来的官员找到“我”，不肯在码头上谈，约在一处卖甘蔗的棚子里。棚顶是椰子叶，风一吹，叶子哗哗地响。他手里捏着一根甘蔗，咬一口，又放下。他说他的主人，年轻的王子纳黎萱，需要火绳枪，也需要喂战象的甘蔗与稻草，越多越好，越快越好，不能让勃固的人知道。官员：“战象吃得比兵多。枪我们能想办法，甘蔗只能靠船。”他说这话时，声音压得比甘蔗棚的叶子还轻。他说的没有“打仗”两个字，说的是“把从前的东西拿回来”。"
