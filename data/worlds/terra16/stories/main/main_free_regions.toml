effects = [{ kind = "item", item = "kongo_royal_letter", qty = -1 }, { kind = "fame", value = 2 }, { kind = "reputation", faction = "portugal", value = -2 }]
reply = "码头上的人越聚越多，有人骂，有人沉默。第二天港务官来找“我”，说国王的信不能在码头上念。"

[tracks.chapters.choices.fail]
