at = "sakai"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["tokugawa_ieyasu"]
news = "堺的人说，本能寺烧起来那天早上，来游览的德川殿脸都白了，带着随从从伊贺的山里绕回了三河。"

[tracks.chapters.default]
