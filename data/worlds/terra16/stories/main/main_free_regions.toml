at = "callao"
stage = "involve"
speaker = "captain"
mood = "sad"
cast = ["francisco_de_toledo", "tupac_amaru_i"]
news = "卡亚俄的人说，比尔卡班巴的最后一个印加王被押去了库斯科，副王的人在广场上搭好了台子，全城的人都被叫去看。"

[tracks.chapters.default]
