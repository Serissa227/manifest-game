# 烽火一路点到伦敦：逆风里拖船出港。拖出去的那几条，后来在加来点成了火。
[[tracks.chapters]]
key = "c2_fireships"
title = "烽火一路点到伦敦"
text = "七月底，有人看见西班牙的舰队出现在利泽德角外，山头的烽火一个接一个点着，一路点到伦敦。普利茅斯港里的船顶着逆风往外拖，水手们在小艇上拼命划。港口的钟楼上，有人一下一下地敲着警钟。“我”的船在港里，桅杆上挂着一块湿帆，怕火星子落上来。风是逆的，船要人拖出港。拖船的水手：“风不帮我们，那就用手！船长，借你的小艇！”德雷克站在码头上吼：“别管缆绳，先出港！”拖船的人一排站在岸边，喊声压过了海浪。一个老水手把缆绳往肩上一扛，闷声不响地往前走。烽火从山头一路点下去，最后一把火在伦敦的方向亮了。岸上没有人说话，只有烽火在山头噼啪作响。"
window = [[1588, 7, 20], [1588, 8, 15]]
at = "plymouth"
stage = "involve"
