[[tracks.chapters]]
key = "a1_offer"
title = "喝够了水的马"
text = "季风刚过的巴特卡尔，马厩里一排阿拉伯马。马贩子胡拉姆一匹一匹摸它们的腿，先去看它们喝没喝够水，才肯谈价。维克拉姆是维查耶纳伽尔的马匹经纪人，来了三趟，每趟都带着王都的急信：德干的几个苏丹结了盟，罗摩·罗阇要马，要很多马，钱却要等秋天的税。胡拉姆：“马喝够了水，才谈价。你急，马不急。”维克拉姆：“钱一定会有。只是……要等打完。”他说话时一直看着马槽，像在数马。胡拉姆一句话也没接，只把一匹马牵到水边。我（心里）：这一仗，谁替它付钱？"
