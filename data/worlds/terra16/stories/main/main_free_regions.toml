# 换了旗的会合众：目击。收矢钱的名单上，有几家前年还在给织田家运货。
[[tracks.chapters]]
key = "c3_after"
title = "换了旗的会合众"
text = "秋天的堺，会合众的屋檐下换了新的灯笼。山崎一战以后，羽柴家的使者来堺收矢钱，商人们一边骂一边交。码头上没人再提那天早上的事，只有茶室里还有人小声说起德川殿走的那条路。收钱的人拿着名单一家一家念。念到有几家，商人们互相看了一眼：前年还在给织田家运货的，就是这几家。会合众的老人（转述）：“谁坐天下，堺都要交钱。交给谁，这才要紧。”"
