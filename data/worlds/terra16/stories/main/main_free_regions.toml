# 沥青与旧帆：德雷克要能打的船，霍金斯要过秤。霍金斯问“我”的船烧不烧得着。
[[tracks.chapters]]
key = "c1_offer"
title = "沥青与旧帆"
text = "春天的普利茅斯，霍伊高地上有人在打木球，港里的船在上沥青，黑烟一股一股升起，呛得人直咳嗽。德雷克在码头上吼：“缆绳！再拿一卷来！”他骂承包商的缆绳不经拉，霍金斯拿着账本跟在后头。西班牙的大舰队要来的消息传了一年，英格兰人缺沥青、缺旧帆、缺肯烧掉的船。港口的木板上贴着一张征用的告示，墨迹被雨水晕开了。德雷克：“西班牙人的船高，我们的船快。剩下的，交给风。”霍金斯：“船长，你那批沥青掺沙了没有？我要过秤。”霍金斯问“我”：你的船，烧不烧得着？"
