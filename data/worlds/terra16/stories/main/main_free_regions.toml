# 山那边的消息：比尔卡班巴空了。一个骡夫从山里下来。
[[tracks.chapters]]
key = "b2_vilcabamba"
title = "山那边的消息"
text = "卡亚俄的雾很浓，正是南半球的冬天。山那边的消息一阵一阵传下来：比尔卡班巴已经空了，印加王往森林里逃，追兵在后面。码头上的人说：“副王的人已经在库斯科的广场上搭好了台子。”雾里传来骡队的铃声，一串接一串，往海边的小港去了。一个修士坐在石墩旁边，把请愿书摊在膝盖上，一个字一个字地数，数到最后一页，又从头数。风一吹，纸页翻过去，他又用手压住。一个从山里下来的骡夫坐在石墩上，抽着烟，不肯往人堆里走。他抽完一根，又点上一根，说：“他们抓到他了。在河边，跟他怀孕的妻子一起。”"
