text = "复活节那天，八十条加莱船进了希俄斯的港口。皮雅利帕夏没有开炮，派人上岸收钥匙。桨手的歌声顺着水面一阵一阵传过来，码头上的人听不清词，只看见船头的旗。马奥纳的老爷们被请上船，说是去伊斯坦布尔面见苏丹，后来才知道是去卡法。树园里的人照常割树皮，树干上的刀口一道一道，没有停。一个通事站在船舷下喊：“皮雅利帕夏只要钥匙，不要人命。谁还留在岛上，自己说。”“我”的船停在港里最外的一排，所有人都看得见。奥斯曼的书记第一件事，是去抄玛蒂克树园的名册。“我”舱里那一库玛蒂克，突然成了全岛最后一批热那亚货。书记对码头上的“我”说：“树还是这些树，税换个人收。船长，你船上装的什么？”"

