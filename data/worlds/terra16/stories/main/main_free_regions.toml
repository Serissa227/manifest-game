# 倒在地上的水：北边的王子在孟坑把金瓶里的水倒在地上。
[[tracks.chapters]]
key = "c2_independence"
title = "倒在地上的水"
text = "五月，消息从北边传来：纳黎萱在孟坑当着众人把金瓶里的水倒在地上，说暹罗从此不再是勃固的属国。大城里的人一半欢喜一半害怕；勃固的军队已经在路上。河边的寺庙在敲钟，钟声被风吹散了，一半到了城里，一半到了河对岸。王子的人在寺后头搬枪箱，箱子上的漆还是新的。城墙根下卖粥的老头说：“王子倒水，是要人记住。谁记住了，谁就得站队。”倒在地上的水收不回来，城里的人都这么说，说的时候压低了声音。河上有一只船靠了岸，船夫把一箱箱东西往下搬，谁也不问是什么。大城的商人又问了一遍：“金瓶里的水倒了，就收不回来了。船长，你的船停在这里，是要走还是要留？”"
