# 圣佩德罗号起锚：限期的出发。只有北边那张草图能送出去。
[[tracks.chapters]]
key = "a2_sailing"
title = "圣佩德罗号起锚"
text = "六月初，圣佩德罗号装满淡水和米，船员两百人，大半在发抖——他们知道往东意味着什么。码头上一个年轻水手在绳梯上回头喊：“老爷，这船要是回不来，宿务的酒钱归谁？”没人笑。一个管账的书记站在跳板边，数着人头，数到第三遍才放下笔。乌尔达内塔站在船尾，手里是那张北边画了几道弯线的图。黎牙实比留在岸上，没有来送。起锚前，老修士把一本只写了一行的航簿递过来：“北纬三十九度，往东。”他说：“你跟一段也好。到了三十九度，你要回头，我不怪你。”我（心里）：他要的是一个认得北边海的人。船上两百个人，他肯看的只有我一个。"
