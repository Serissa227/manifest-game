# 自由船长·地区章（故事 2.0，A5 / E37 契约，C13 第九批）
# 标签：自由船长·地区章。主角是玩家自创的船长：“我”不写性别、外貌、肤色、身高；别人叫“船长”“某家的孩子”。
# 结构：18 条 [[tracks]]，每条 kind = "main"、auto = true，start = 首章 key。第一章是 at 在该海区枢纽港的普通章，
#   when = c13_main_free（主干门槛章设）+ 日期起点，期限到下一章窗口之前，timeout 静默失败（不写见闻、不写来信）。
#   第二章是挂在真实事件上的 involve（default = 历史照常），或限期交货章；第三章（有的轨道）是目击 witness，变体读 HIST 与本线旗标。
# 一览（海区；幕；史实代码）：
#   第一幕 a：桶狭间的雨（东亚；H17，热田）、往东回去的路（东南亚；H24，宿务与阿卡普尔科）、巴特卡尔的马（印度洋；H23，巴特卡尔）、
#     玛蒂克之岛（地中海；H26，希俄斯）、迪耶普的两边（大西洋与欧洲；H21，迪耶普与勒阿弗尔）、卡罗琳堡（美洲；H25，圣奥古斯丁）。
#   第二幕 b：堺的铅（东亚；H43，堺）、湄南河的水门（东南亚；H34，大城）、辩论之屋的书（印度洋；R10，苏拉特）、
#     冲过封锁（地中海；H35，坎迪亚与法马古斯塔）、刚果王的信（大西洋与欧洲；H45，罗安达与里斯本）、最后的印加（美洲；H41，卡亚俄）。
#   第三幕 c：伊贺来的纸（东亚；H54，堺）、金瓶里的水（东南亚；H58，大城）、两份效忠书（印度洋；H52，果阿）、
#     丹吉尔的名单（地中海；H49，丹吉尔）、普利茅斯的火船（大西洋与欧洲；H60，普利茅斯）、南边的第一本书（美洲；R13，卡亚俄）。
# 依据（史实，只从人物嘴里、物件上、告示里透出来）：热田与桶狭间（1560，织田的人踩着雨翻过丘陵，信长在神宫前祈祷，热田神宫本殿外后来砌了土墙）；
#   堺的宗易称暹罗铅、甲斐的商人找铅（1575，长篠前的铅弹）；伊贺人与本能寺（1582，伊贺被织田平定后的残党、德川殿在堺、回三河走伊贺山路）；
#   宿务的老修士乌尔达内塔北上找回美洲的路（1565，圣佩德罗号离宿务、阿卡普尔科开港）；大城的围城与纳黎萱（1569 与 1584—87）；
#   塔利科塔之战与维查耶纳伽尔的马（1565）；希俄斯的玛蒂克与皮雅利的舰队（1566，复活节，加莱船、卡法）；
#   勒泰斯蒂的地图与鲁昂之围、勒阿弗尔的英军投降（1562—63）；罗安达与刚果王阿尔瓦罗一世的信（1576）；普利茅斯的火船（1588）；
#   卡罗琳堡与梅嫩德斯建圣奥古斯丁（1565，河口的屠杀）；比尔卡班巴的副王战书与请愿书（1572）；利马三种话的教理问答（1583—84）。
# 原创：每章的具体人物（胡拉姆、伊贺来的男人、埃莱妮、印书匠、里卡多、搬运工等）、对白、选项与物件。
# 读的共享旗标：c13_main_free（每条首章的门槛，主干 a00 default 设）；c12_* 不读。
# 设的本线旗标：c13_free_<轨道短名>_<选项>（各轨道的分支）、c13_free_lever_<代码>（C10 杠杆钥匙，可选）、
#   c13_free_course_*（主干方向，只读）、c13_free_southeast_asia_a_kuroshio（只在本线，宿务与北上的分支）。
# HIST 占位（整合方按 C10 公布的代码 → key 表替换）：h17_okehazama_imagawa_survives（a3_wall）、h23_talikota_vijayanagara_survives（a3_after）、
#   h25_fort_caroline_french_settlement_survives（a3_inlet）、h35_cyprus_siege_famagusta_holds（b2_blockade）、h41_vilcabamba_vilcabamba_survives（b2_vilcabamba）、
#   h49_three_kings_sebastian_returns（c2_lists）、h52_iberian_union_antonio_rules_portugal（c2_oath）、h54_honnoji_nobunaga_survives（c3_after）、h60_armada_spanish_landing（c3_wind）。
# C10 杠杆钥匙（可选，不用就删读它的 requires）：c13_free_lever_H17（a2）、H23（a2_talikota）、H25（a2_hurricane）、H34（b2_fall）、H35（b2_blockade）、
#   H41（b2_vilcabamba）、H43（b2_lead）、H52（c2_oath）、H54（c2_honnoji）、H60（c2_fireships）。
# 等待的包：A9（a1 的身份门槛可改成 protagonist 条件）；C10（上面的 HIST 与杠杆）；C12/主干 main_free 的门槛章设 c13_main_free。
# 回忆插画清单（mem-<轨道>-<章>，画面各不超过 60 字）：
#   mem-main_free_east_asia_a-a2_okehazama（雨云下的神宫）：热田神宫门前，几匹马喷着白气，远处海上的云堆成一堵黄灰色的墙。
#   mem-main_free_east_asia_b-b2_lead（宗易的秤）：堺的码头上，一杆长秤吊着一锭铅，茶人模样的人眯眼看秤星。
#   mem-main_free_southeast_asia_b-b2_fall（水门里递出来的孩子）：夜雨里的城墙水门，人们把孩子一个个递到船上。
#   mem-main_free_mediterranean_a-a2_piyale（复活节夜里的账册）：夜色里的希俄斯港，一条小船载着一箱账册，从八十条加莱船之间溜出去。
#   mem-main_free_mediterranean_b-b2_blockade（法马古斯塔的孩子们）：一月的港口，城墙上举着火把，几个裹着毯子的孩子被抱上一条商船。
#   mem-main_free_atlantic_europe_a-a2_rouen（勒泰斯蒂的图稿）：迪耶普码头的雨里，一个领航员把一卷卷画着海岸与怪兽的图稿递上船。
#   mem-main_free_americas_a-a2_hurricane（风暴前的河口）：圣约翰河口，乌云压着棕榈林，几个法国妇人抱着孩子蹚水上船。
#   mem-main_free_americas_b（无回忆）；mem-main_free_americas_c（无回忆）。
# 禁区：不写战场、屠杀、处决与尸体的细节；不写同学（C7 的重逢）；不写恋爱；见闻不泄露秘密；不写报酬数字。

[[tracks]]
key = "main_free_east_asia_a"
name = "桶狭间的雨"
kind = "main"
start = "a1_offer"
auto = true
cast = ["oda_nobunaga", "imagawa_yoshimoto"]

# 热田的木札：今川与织田都要人运东西，选哪边决定这个夏天这条船怎么走。
[[tracks.chapters]]
key = "a1_offer"
title = "热田的木札"
text = "早春的热田，神宫门前的商人町，屋檐下挂着写满货名的木札。热田的商人一向替织田家筹粮运货，这回要人把一船火药送到鸣海湾边的砦子。同一家客栈里，一个从骏河来的商人摸出成色好的银子，请人替今川家把军粮运过尾张的丘陵。两边都说对方撑不过这个夏天。热田的商人把算盘拍在桌上：“火药要在梅雨前到。到晚了，砦子里的人只能拿石头守。”骏河的商人笑了一声：“今川殿下四万人，织田那边连四千都凑不齐。你算算账。”骏河人的银子上压着今川家的印，他毫不避讳，觉得今川已经赢了。我（心里）：这两笔账，哪一笔是真的？"
when = [{ kind = "flag", flag = "c13_main_free" }, { kind = "date", from = [1560, 1, 10] }]
at = "atsuta"
speaker = "captain"
mood = "tense"
cast = []
deadline = [1560, 5, 25]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "oda"
text = "替热田的商人把火药运到鸣海湾的砦子"
next = "a2_okehazama"
requires = [{ kind = "cash", ge = 600 }]
hint = "你连预先垫付的火药钱都拿不出来。"
effects = [{ kind = "cash", value = -600 }, { kind = "flag", flag = "c13_free_east_asia_a_oda" }, { kind = "reputation", faction = "oda", value = 2 }]
reply = "砦子里的足轻把火药桶一个个滚进土仓。领头的那个说：“回来结账。”顿了顿，又补一句：“要是还有人在的话。”"

[[tracks.chapters.choices]]
key = "imagawa"
text = "收下骏河人的银子，替今川家运军粮"
next = "a2_okehazama"
effects = [{ kind = "cash", value = 800 }, { kind = "flag", flag = "c13_free_east_asia_a_imagawa" }, { kind = "reputation", faction = "imagawa", value = 2 }]
reply = "军粮卸在沓挂附近的河滩上。今川家的侍大将连看都没看，叫人记下了“我”的旗号。"

[[tracks.chapters.choices]]
key = "none"
text = "两边的生意都不接，只在热田补水"
next = "a2_okehazama"
reply = "热田的商人冷笑一声：“外头来的船都一样，只看天，不看人。”"

# 神宫前的马：信长的人马踩着雨来了。船长报的时辰是唯一能改动的东西。
[[tracks.chapters]]
key = "a2_okehazama"
title = "神宫前的马"
text = "梅雨季的清早，一小队骑马的人冲进热田，领头的年轻武士在神宫前下马祈祷——热田人认得，那是织田上总介。马喷着白气，马夫拿袖子去擦它们的嘴，没有人敢出声。天色发黄，海那边的云堆得像墙。神宫的老神官抬头看云，嘟囔说午后要变天：“这云是从伊势那边推过来的，午后才落。外乡人，别乱报时辰。”“我”的水手们在码头上也在看同一片云，有人把缆绳解开又系上，手一直在抖。织田家的足轻隔着人群喊：“船上的！你们看海的，说说，雨什么时候到？”没人应，码头上的人都看着“我”。我（心里）：老神官看的是风向，我看的是海上的涌。两样东西算出来的时辰，差着一个时辰。"
window = [[1560, 6, 1], [1560, 6, 20]]
at = "atsuta"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["oda_nobunaga", "imagawa_yoshimoto"]
news = "热田的人说，那天午时的雨大得像海倒过来，织田的人马就是踩着那场雨翻过丘陵的。"

[tracks.chapters.default]
next = "a3_wall"
effects = []

[[tracks.chapters.choices]]
key = "rain"
text = "看风估时辰，告诉织田的人：午时前后有急雨"
next = "a3_wall"
check = { attr = "astronomy", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_free_east_asia_a_rain" }, { kind = "flag", flag = "c13_free_lever_H17" }, { kind = "fame", value = 1 }]
reply = "足轻把“我”的话原样喊给骑马的人。那人没回头，只抬了一下手。一个时辰后，雨像倒下来一样。"

[tracks.chapters.choices.fail]
next = "a3_wall"
effects = [{ kind = "memory", memory = "mem-main_free_east_asia_a-a2_okehazama", title = "雨云下的神宫" }]
news = "热田的足轻说，船上那个外乡人报的时辰晚了一个时辰，骂了一句就走了。雨后来还是落了。"

[[tracks.chapters.choices]]
key = "warn"
text = "骑马去沓挂，把织田家出兵的事告诉今川的营地"
next = "a3_wall"
requires = [{ kind = "flag", flag = "c13_free_east_asia_a_imagawa" }]
hint = "你和今川家素无往来，营门不会为一个外乡船长打开。"
effects = [{ kind = "flag", flag = "c13_free_east_asia_a_warned" }, { kind = "reputation", faction = "imagawa", value = 2 }]
reply = "今川营里的人听完笑了：“织田的人能有几个？”把“我”打发到营外喝水。"

[[tracks.chapters.choices]]
key = "away"
text = "趁雨没落，把船开出热田湾"
next = "a3_wall"
effects = [{ kind = "memory", memory = "mem-main_free_east_asia_a-a2_okehazama", title = "雨云下的神宫" }]
reply = "船出湾时，岸上传来海螺声。“我”没回头，雨在船尾追了半个时辰。"

# 信长塀：目击。墙是夯出来的，夯进去的东西没人去挖。
[[tracks.chapters]]
key = "a3_wall"
title = "信长塀"
text = "夏末，热田神宫的工匠在本殿外面砌一道土墙，土里掺了油和石灰，一层一层夯，顶上盖瓦。神官说这是织田家打赢以后献给神宫的。热田的商人们站在墙边算账，算谁家的木札还作数。墙夯到一半，一个老工匠从墙土里拣出一枚生锈的箭镞，看了看，又顺手夯了回去。夯墙的工匠对旁人说：“这墙要站三百年。三百年后有人问起，就说是那年的雨砌的。”"
window = [[1560, 7, 1], [1560, 9, 30]]
at = "atsuta"
stage = "witness"
speaker = "captain"
mood = "cheerful"
cast = ["oda_nobunaga"]
news = "热田神宫在本殿外砌了一道掺油的土墙，商人们说那是织田家打赢以后还的愿。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "v1_imagawa"
when = [{ kind = "flag", flag = "h17_okehazama_imagawa_survives" }]
text = "夏末，热田神宫里没有人砌墙。今川的大军照常西去，热田的商人连夜把写着织田家的木札烧了，神宫外只剩烧木札的灰，被风吹得满街都是。一个老工匠在灰堆旁边蹲着，把一枚生锈的箭镞翻来覆去地看，最后揣进了怀里。神官扫灰的时候，扫帚一下一下，扫得很慢。热田的神官在门口念着祭文，一句也没有提织田的名字。"

[[tracks.chapters.variants]]
key = "v2_rain"
when = [{ kind = "flag", flag = "c13_free_east_asia_a_rain" }]
