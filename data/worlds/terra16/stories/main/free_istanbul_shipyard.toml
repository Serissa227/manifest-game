# 伊斯坦布尔造船厂的孩子·个人小线（free_istanbul_shipyard）
#
# 标签：伊斯坦布尔造船厂的孩子·个人小线（模板 custom_istanbul_shipyard，家乡港 istanbul）。
# “我”不写性别、外貌、肤色与身高，不写名字；speaker = "captain" 时说话的是“我”；别人称呼“船长”“金角湾船匠家的孩子”“老师的学徒”。
# 依据：史实——苏莱曼清真寺 1557 年落成（穹顶用料的说法，兵工厂与清真寺抢木料）；1569 年奥斯曼人想在顿河与伏尔加河之间挖运河（大维齐尔的命令，卡法与亚速的船匠被征调）；
#   1571 年勒班陀之后，奥斯曼一个冬天重建舰队，大维齐尔说“帆用缎子”（兵工厂总管转述）；1577 年托普哈内的天文台建成，1580 年 1 月被拆毁（宫里有人说是看天看坏了）。
#   原创：船匠师傅伊利亚斯、船台上的交接凭记（木牌）、天文台的助手、那架大象限仪的木框、算不通的运河图。
#   秘史与传闻只从人嘴里出来，不开历史课。
# 轨道：free_istanbul_shipyard（kind = main，auto = true，start = a00_gate）。门槛章 a00_gate 的 when 为 c12_voyage_custom_istanbul_shipyard，default 设 c13_free_istanbul_shipyard。
# 本文件设置的旗标：c13_free_istanbul_shipyard（a00 的 default）；c13_free_istanbul_shipyard_canal（a01 的 go）；
#   c13_free_istanbul_shipyard_instruments（b01 的 save）；c13_free_istanbul_shipyard_receipt_given（c01 的 selim）。
# 读取的旗标（由别的文件设）：c12_voyage_custom_istanbul_shipyard（门槛）。c13_free_istanbul_shipyard_canal 与 _instruments 由本文件的 a01、b01 设，c01 的两个变体读它们。
#   本线不读请托旗标（c13_request_*），不读 C7 的旗标。
# 结构：a01、a02、b01 有期限，超时走静默或来信；c01 的 selim 与 take 分别落在“交给木料场的人”与“接下船台”，own 是离开的落点。
#   模板的同学（leyla_fincan、selim_kereste）只客串：塞利姆在 c01 说一句，不写救生艇与木料，莱拉不出场。
# 等待的包：A9（门槛章的身份条件）。本文件没有 HIST_ 占位旗标；没有亚特兰蒂斯补章；英文覆盖本次不写（只做中文）。
# 回忆插画清单（mem-* 键与画面，各不超过 60 字）：
#   mem-free_istanbul_shipyard-a01 “算不通的运河”：兵工厂的船台边，老船匠和船长对着一张画着两条河的图，中间那段陆地被墨涂得很重。
#   mem-free_istanbul_shipyard-b01 “托普哈内的大象限仪”：山上的天文台里，一架比人还高的木头象限仪立着，船匠在给木框打楔子。
#   mem-free_istanbul_shipyard-c01 “交到手里的船台”：金角湾的船台上，一条新龙骨刚架好，老船匠把一块刻着编号的木牌放在船长手里。

[[tracks]]
key = "free_istanbul_shipyard"
name = "金角湾的船台"
kind = "main"
start = "a00_gate"
auto = true
cast = ["c8_golden_horn_master", "fatima"]

# a00 门槛见闻：正月的咖啡馆里，客人吵清真寺的木料，顺带说起船匠家的孩子要出海。
[[tracks.chapters]]
key = "a00_gate"
title = "第三座山上的穹顶"
text = "正月的塔赫塔卡莱，咖啡馆的炭火添得勤。城里的大清真寺今年落成，穹顶用的是兵工厂最好的木料，船台上剩下的只能是次一等的橡木。有人说，金角湾船匠家的孩子要出海了，船是师傅亲手看过龙骨的。法蒂玛夫人一边添炭，一边把客人的话往后厨传：“清真寺用的是好木头，船用的是剩下的——可淹死人的是船，不是清真寺。”"
when = [{ kind = "flag", flag = "c12_voyage_custom_istanbul_shipyard" }]
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "istanbul"
cast = ["c8_golden_horn_master", "fatima"]
mood = "tender"
news = "塔赫塔卡莱的咖啡馆里说，大清真寺的穹顶用走了兵工厂最好的木料，金角湾船匠家的孩子偏偏这时候出海。"

[tracks.chapters.default]
next = "a01_canal"
effects = [{ kind = "flag", flag = "c13_free_istanbul_shipyard" }]

# a01 冬天的运河命令：师傅算了三遍，算不通。期限是 1569 年春末，船匠们早已动身去卡法。
[[tracks.chapters]]
key = "a01_canal"
title = "挖到伏尔加去"
text = "冬天，兵工厂收到大维齐尔的命令：在顿河和伏尔加河之间挖一条运河，让船从黑海直接开进里海。卡法和亚速的船匠要被征去，造能拖上岸的平底船。师傅把“我”叫到船台边，指着图上那一段陆地。图是他自己画的，两条河之间墨涂得很重。“算了三遍，算不通。”他用指节敲着那一段，“船能在水上走，不能在草原上走。总管不信，你去跟他说。”船台上的锛子声停了，学徒们都竖着耳朵。他又说：“要是这条河真挖通了，金角湾就不是世界的尽头了。”说完他把图卷起来，过了一会儿又摊开，像是还想再看一遍。“我”想知道那条河到底挖不挖得通。"
when = [{ kind = "date", from = [1568, 11, 1] }]
at = "istanbul"
speaker = "captain"
mood = "tense"
deadline = [1569, 4, 30]

[tracks.chapters.timeout]
next = "a02_sails"
effects = [{ kind = "letter", person = "c8_golden_horn_master", text = "船匠们走了，去了卡法，一个不剩。总管说春天就挖通，我说春天的河会结冰，他没听。你要是还在金角湾，来船台一趟。那张图我留着，图上那段陆地，我又算了一遍，还是算不通。" }]

[[tracks.chapters.choices]]
key = "go"
text = "跟船匠们去卡法，造那些平底船"
next = "a02_sails"
effects = [{ kind = "flag", flag = "c13_free_istanbul_shipyard_canal" }, { kind = "reputation", faction = "ottoman", value = 2 }]
reply = "卡法的冬天比金角湾冷得多，风从亚速海上刮过来，船匠们的手冻得攥不住凿子。他们造好的头一条平底船，下水就陷进了泥里，拖了三天才拖出来。“我”把拖船的缆绳在木桩上绕了一圈，打的是师傅教的结，对船匠说了一句：“拉，别松。”"
news = "卡法的码头上说，金角湾来的船匠在亚速的泥滩上造平底船，头一条下水就陷进了芦苇里。"

[[tracks.chapters.choices]]
key = "argue"
text = "去总管那里，把挖不通的账算给他听"
next = "a02_sails"
effects = [{ kind = "reputation", faction = "ottoman", value = 1 }, { kind = "memory", memory = "mem-free_istanbul_shipyard-a01", title = "算不通的运河" }]
reply = "“我”把纸摊在他面前，只说了一句：“这一段，师傅算了三遍，我又算了一遍。”总管没说话，只拿笔在最末一行底下划了一道。过了一会儿他把纸折成四折，塞进了腰带里。船匠们还是要走，只是少走了几个——名册上，几个老船匠的名字被他用指甲掐掉了。"
news = "兵工厂门口的书记说，有个小船长拿着算账纸去找总管，纸收下了，船匠还是照去卡法。"
check = { attr = "learning", base = 20, per = 7 }

[tracks.chapters.choices.fail]
next = "a02_sails"
news = "兵工厂的总管听完一半就挥手，门口的书记学给人听：大维齐尔要的是船，不是算术。"

[[tracks.chapters.choices]]
key = "apprentice"
text = "替师傅把他最好的学徒留在金角湾"
next = "a02_sails"
effects = [{ kind = "affinity", person = "c8_golden_horn_master", value = 3 }]
reply = "“我”替那个最会看纹的学徒报了病，他就躲在船台底下，躲了一个冬天。春天出来时长高了半个头，两只手裂了口子。师傅什么也没说，只把自己那把旧锛子递给了他，柄上的油已经被手磨亮了。"
news = "金角湾的船台上说，伊利亚斯师傅最好的学徒报了病，躲在船底下过了一个冬天，没去卡法。"

# a02 限期章：勒班陀以后的冬天，兵工厂要帆布。帆布在码头上，三种卖法，期限是 1572 年春末。
# 不论选哪项，这一舱帆布都在回应时卸下（目标 goods 回应时扣货）。
[[tracks.chapters]]
key = "a02_sails"
title = "缎子做帆"
text = "勒班陀的消息传回来，兵工厂一夜没睡。大维齐尔在朝上说，要在一个冬天造出一支新舰队：“锚用银子打，缆用丝绳，帆用缎子。”船台上排满了加莱船的龙骨，木头已经堆不下，缺的是帆布。“我”的船刚靠岸，一舱布还堆在码头上。总管等在船台边，话说得很快：“帆用缎子也要造出来，你这一舱布，比缎子便宜。”私人船主也到了，一个跑黑海的希腊人，手里托着钱袋。师傅走过来，伸手摸帆布，指尖在经纬间来回捻。“这一舱布，能让二十条船出港，也能让二十条船沉进海里。”“我”把家里的话说了出来：“先看龙骨，再看帆。”师傅没接，把布翻过来，看背面的线。“我”没说出口：这舱布是一路护过来的，还没想好卖给谁。"
when = [{ kind = "date", from = [1571, 11, 1] }]
at = "istanbul"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "goods", good = "sailcloth", qty = 20, at = "istanbul", text = "把帆布运到伊斯坦布尔" }]
deadline = [1572, 4, 30]

[tracks.chapters.timeout]
next = "b01_observatory"
effects = [{ kind = "letter", person = "c8_golden_horn_master", text = "帆布另外找来了，新舰队春天还是下了水。你没回来，船台上的人问起你，我说你在海上。海上更要帆布，这话他们听进去了。兵工厂的书记又来问过一次，我没给他好脸色。" }]

[[tracks.chapters.choices]]
key = "arsenal"
text = "全部交给兵工厂"
next = "b01_observatory"
effects = [{ kind = "cash", value = 1350 }, { kind = "reputation", faction = "ottoman", value = 3 }]
reply = "总管在收据上盖了兵工厂的印，印泥还是湿的，说春天第一条下水的船上，会有“我”的帆。“我”回了一句：“那就缝结实点。”然后把收据折进袖子里，才发现手上还沾着布屑，一根一根拈下来，搓成了一小团。码头上的脚夫在背后笑，说这下船长也做了一回帆匠。"
news = "兵工厂门口说，金角湾来的一舱帆布卸了整整一天，总管在收据上盖了印，印泥还没干。"

[[tracks.chapters.choices]]
key = "slip"
text = "交货时，求师傅让“我”上船台干一个冬天"
next = "b01_observatory"
effects = [{ kind = "cash", value = 1000 }, { kind = "skill", skill = "shipbuilding", value = 30 }]
reply = "“我”一个冬天钉了三条船的肋骨，手上全是木刺，夜里摸着床板都觉得扎。有一根肋骨偏了，“我”问要不要拆，师傅看了一眼：“拆了再钉。”春天船下水那天，“我”站在船舷边上，看着它一点一点滑进水里。师傅没夸，只拍了拍船舷，说了一句：“还凑合。”"
news = "金角湾边的船匠传开了，伊利亚斯师傅的船台上留下个小船长，一个冬天钉肋骨，手上没一块好皮。"

[[tracks.chapters.choices]]
key = "private"
text = "按市价卖给出价更高的私人船主"
next = "b01_observatory"
effects = [{ kind = "cash", value = 1800 }, { kind = "reputation", faction = "ottoman", value = -1 }]
reply = "私人船主是个跑黑海的希腊人，钱数得又快又干净，一个子儿也没多给。他一边数一边说：“战争对谁都好，对我尤其好。”他把帆布的边角拎起来，凑到亮处看了看，又放下。师傅在船台那头看着，没有回头，手里的锛子却停了。"
news = "码头上的希腊船主得意地说，一舱金角湾的帆布被他高价买走，黑海的船要赶在春天前挂帆。"

# b01 限期章：托普哈内山上的天文台，木框裂了。“我”已经卸下一半，拆毁令到了。期限 1580 年 1 月末，超时静默进入 c01。
[[tracks.chapters]]
key = "b01_observatory"
title = "托普哈内的天文台"
text = "金角湾对岸的托普哈内山上，有一座新盖的天文台。里面立着一架比人还高的木头象限仪，铜环一圈圈套着，站在底下仰头看，像站在一口井里。前年大彗星的时候，天文台的主人塔奇丁替苏丹算过吉凶；后来瘟疫来了，宫里有人说是看天看坏了。助手到兵工厂来找会修大木器的船匠：那架象限仪的木框裂了一道缝，楔子松了，量星就歪。“木框裂了，星就量歪了。”他说，“星量歪了，就有人说是我们的错。”“我”已经卸下木框的一半，楔子还攥在手里。“我”想先把楔子打紧，别的事等打完再说。山道上这时来了个骑马的人，怀里揣着一封没拆的文书，火漆印是宫里的。"
when = [{ kind = "date", from = [1579, 3, 1] }]
at = "istanbul"
speaker = "captain"
mood = "mystic"
deadline = [1580, 1, 20]

[tracks.chapters.timeout]
next = "c01_head"
effects = []

[[tracks.chapters.choices]]
key = "repair"
text = "抢在拆毁令到之前，把大象限仪的木框装回去"
next = "c01_head"
effects = [{ kind = "memory", memory = "mem-free_istanbul_shipyard-b01", title = "托普哈内的大象限仪" }]
reply = "木框是在拆毁的人上山之前装回去的。“我”用楔子一下一下把它敲紧，助手扶着木框，手抖得厉害。“楔子要打闷，一响就是没咬住。”“我”只说了这一句。裂口上贴了一根薄木，是“我”从船台带来的旧橡木，刨得像纸一样薄，贴上去像给木头缝了一道伤。那天夜里，助手请“我”从象限仪里看了一眼织女星，说它从来没这么准过。“我”把眼睛凑上去，铜环冰凉，那颗星正好停在十字线的正中。助手没说谢，只递过一块干布，让“我”擦掉手上的木屑。“我”接过布，才发现木屑早嵌进了指缝，擦了很久也擦不干净。"
news = "托普哈内山上说，兵工厂来的船匠夜里修好了大象限仪，第二天拆毁的人还是上了山。"
requires = [{ kind = "skill", skill = "shipbuilding", ge = 60 }]
hint = "你的手艺还修不了这么大的木器。"

[[tracks.chapters.choices]]
key = "save"
text = "拆毁令到以前，把一箱仪器的零件运上船"
next = "c01_head"
effects = [{ kind = "flag", flag = "c13_free_istanbul_shipyard_instruments" }]
reply = "“我”只跟助手说了一句：“箱子不许开，开了就对不上数。”零件用草席裹了三层，藏进了“我”的船舱，铜环碰在一起，声音被草席闷住了。助手跟着船走了一程，到于斯屈达尔才下船，站在岸上朝船尾挥了挥手，什么也没说。船开出去很远，他还站在那里，手一直没放下来。那一夜风小，船走得慢，“我”在舱里把铜环一个一个摸过去，数出了十二个。箱子里原本有十三个，少的那个，“我”没有再去找。船靠岸时，草席还是湿的，码头上一股海腥味，助手的脚印已经被人踩乱了。“我”把草席叠好收进舱底，那张席子上还留着山上的土色。"
news = "托普哈内山下说，有人夜里从天文台运出一箱仪器，裹着草席上了船，没人敢问是谁的。"
check = { attr = "intrigue", base = 20, per = 7 }

[tracks.chapters.choices.fail]
next = "c01_head"
news = "托普哈内山下的车马站说，一辆装仪器的车刚出门就被拦下，助手说：“算了，星还在天上。”"

[[tracks.chapters.choices]]
key = "away"
text = "不碰天文台的事"
next = "c01_head"
reply = "拆的那天“我”在船台上。山上有人在喊，接着是木头倒下来的声音，隔着水也听得见。那一天，“我”手里还攥着一根没打进去的楔子，攥到掌心出了汗，楔子的棱角印在了手上。天黑以后，山上没有一点灯。第二天一早，船台上的人都在说山上的烟，有人说那是旧纸，有人说是木头。“我”没有上山去看，那一年的春天很短，木屑很快就盖住了地面。后来有人从山上捡回一块带漆的木片，拿到船台上来给“我”看，“我”没有接。那块木片上的漆还亮着，像是拆下来没多久。"
news = "金角湾的船台上说，托普哈内山上的天文台拆了，那天木头倒下的响声，半个港口都听见了。"

# c01 终章的交接：师傅的船台、那块木牌。落点是接下船台、交给木料场的人、或者带走自己去造船。
# 变体按 key 字母序取第一个满足的：v1 的零件优先于 v2 的卡法。变体整段替换正文，回复不随变体变。
[[tracks.chapters]]
key = "c01_head"
title = "交接凭记"
text = "春天，师傅的手拿不稳锛子了。船台上的活交给了别人，兵工厂的总管也有自己的人选，是个会算账的书记。师傅不肯走，还是每天到船台上来，坐在旧龙骨堆上，看新架起来的那一条。今天他把“我”叫过去，从怀里摸出一块木牌。木牌是“我”出海那年他给的，正面刻着船台的编号，背面磨得发亮，墨写的三个名字只剩个影子。“拿着它的人，船台就认谁。”他把木牌放进“我”手里，“你回不回来？”“我”没有马上答。他指着新龙骨，说：“龙骨正了，船就正。人也一样。”“我”没说出口：先看龙骨，再看帆。他又说，当年他也是从他师傅手里接过这块木牌的，那时候他也在海上。"
when = [{ kind = "date", from = [1585, 3, 1] }]
at = "istanbul"
speaker = "captain"
mood = "tender"
deadline = [1588, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "letter", person = "fatima", text = "你师傅的船台空了一季，后来给了别人。他离开船台以前在我这里喝了最后一杯，坐了很久，话不多。他说木牌在你手里，他放心。炉子还是热的，你哪天回伊斯坦布尔，先来坐坐。" }]

[[tracks.chapters.choices]]
key = "take"
text = "回来接下师傅的船台"
next = "done"
effects = [{ kind = "reputation", faction = "ottoman", value = 3 }, { kind = "memory", memory = "mem-free_istanbul_shipyard-c01", title = "交到手里的船台" }]
reply = "接下船台的第一天，“我”就把师傅的锛子挂在了船台的柱子上。柱子是老木，挂钉的地方被锛子磨出了一道凹痕，正好卡住锛子的柄。总管来看过一眼，说船台归谁管，他没意见，只要船下水的日子不误。“我”答：“船下水的日子，不会误。”师傅站在远处看了很久，没有走过来，只丢下一句：“还凑合。”说完他转身去看新龙骨，脚步比平时慢。那天傍晚，“我”一个人在船台上量龙骨，线绳绷直，结打在两头，从龙骨的这头量到那头。那天的木屑扫了三回，最后一回是“我”自己扫的。"
news = "金角湾的老船匠都在议论，伊利亚斯师傅把锛子交了出去，船台的新主人是个不爱说话的船长。"
requires = [{ kind = "skill", skill = "shipbuilding", ge = 60 }]
hint = "你的手艺还撑不起一座船台，总管不会认。"

[[tracks.chapters.choices]]
key = "selim"
text = "把凭记交给塞利姆，他一直在船台上"
next = "done"
effects = [{ kind = "item", item = "shipwright_receipt", qty = -1 }, { kind = "flag", flag = "c13_free_istanbul_shipyard_receipt_given" }]
reply = "塞利姆接过木牌，翻过来看了背面，磨得发亮的地方，他用拇指摸了一下。“拿过很多年了。”他说完就回去搬板子了，连谢字都没有。木料场的板子堆得比人高，他一块一块搬，搬到天黑。“我”把手在衣角上蹭了蹭，看着他的背影。师傅也看着，点了点头，把锛子在磨石上又蹭了两下。门口一捆板子的绳结松了，塞利姆绕回去重新打了一个，拽了两下才走开。“我”看了那个结很久。那天夜里，“我”在灯下重新打了一遍量龙骨的绳结，打得很慢。"
news = "金角湾木料场的人说，伊利亚斯师傅的木牌交给了塞利姆，那人一句谢都没说，就回去搬板子了。"
requires = [{ kind = "item", item = "shipwright_receipt", qty = 1 }]
hint = "那块木牌不在你身上。"

[[tracks.chapters.choices]]
key = "own"
text = "带着凭记出海，去造自己的船"
next = "done"
effects = [{ kind = "fame", value = 1 }]
reply = "“我”在别的港口造了一条船，龙骨是照师傅教的法子量的，一根线、一个结，没有改。船下水那天，风从船尾推过来，龙骨稳得很。“我”把木牌钉在了船舱里，钉子钉得很正。这块木牌一直在那里，船每回靠岸，“我”都要先摸一摸它。有人问它是什么，“我”只说是一块编号。那一年冬天，海上的风压过来，“我”每天都要在龙骨旁边站一会儿，手放在木头上，直到手心发热，才肯去吃饭。师傅说过，龙骨是凉的，人站得久了，木头也就认人了。"
news = "罗得岛的造船匠说，一个金角湾来的船长新开了船台，龙骨的量法跟兵工厂的老师傅一个样。"

[[tracks.chapters.variants]]
key = "v1_instruments"
when = [{ kind = "flag", flag = "c13_free_istanbul_shipyard_instruments" }]
text = "春天，师傅的手拿不稳锛子了。船台上的活交给了别人，兵工厂的总管也有自己的人选，是个会算账的书记。师傅不肯走，还是每天到船台上来，坐在旧龙骨堆上，看新架起来的那一条。今天他把“我”叫过去，从怀里摸出一块木牌。木牌是“我”出海那年他给的，正面刻着船台的编号，背面磨得发亮，墨写的三个名字只剩个影子。“拿着它的人，船台就认谁。”他把木牌放进“我”手里，“你回不回来？”“我”没有马上答。船舱里还放着那箱从托普哈内运下来的零件，铜环裹在草席里，师傅一眼就认了出来，说铜环拿来做船上的罗盘座正好。他指着新龙骨，说：“龙骨正了，船就正。人也一样。”“我”没说出口：先看龙骨，再看帆。他又说，当年他也是从他师傅手里接过这块木牌的，那时候他也在海上。"

[[tracks.chapters.variants]]
key = "v2_canal"
when = [{ kind = "flag", flag = "c13_free_istanbul_shipyard_canal" }]
text = "春天，师傅的手拿不稳锛子了。船台上的活交给了别人，兵工厂的总管也有自己的人选，是个会算账的书记。师傅不肯走，还是每天到船台上来，坐在旧龙骨堆上，看新架起来的那一条。今天他把“我”叫过去，从怀里摸出一块木牌。木牌是“我”出海那年他给的，正面刻着船台的编号，背面磨得发亮，墨写的三个名字只剩个影子。“拿着它的人，船台就认谁。”他把木牌放进“我”手里，“你回不回来？”“我”没有马上答。他指着新龙骨，说：“龙骨正了，船就正。人也一样。”“我”没说出口：先看龙骨，再看帆。他又说，当年他也是从他师傅手里接过这块木牌的，那时候他也在海上。师傅还记得卡法那一年，说“我”是那批船匠里唯一一个第二年还肯回船台的。"
