[[tracks.chapters.variants]]
key = "door"
when = [{ kind = "flag", flag = "c13_main_baraka_gold_door" }]
text = "葡萄牙人终于摸到了马尼卡的金市：集市边插着他们的旗，门口坐着一个“门长”，每个进市的人先交一份布。穆塔帕王的收布人照旧收王的那一份。恩科西从王城下来，他已经是信使里的老资格了，鞋还是那双旧的。内陆人只认坎贝的花布，一匹花布的纹样能讲一个故事：绕三圈的是河，带点的是星。收布人一匹一匹翻看，翻到一匹带星点的，停下来问我是谁织的、在哪里买的。他要听的，是葡萄牙人还要往里走多远。收布人认出了我：“当年在豹皮前伏得最低的，就是你。”门长先开口：“先交布，再进门。葡萄牙国王的门，不讲价。”恩科西冷笑：“王的门也讲价，拿规矩讲。”我（心里）：两扇门，一扇比一扇老。"

# b05 门上的字：召（大津巴布韦）。只拓才进 b06；没拓直接去 b07。
[[tracks.chapters]]
key = "b05_zimbabwe"
title = "门上的字"
text = "从索法拉随商队往内陆走了二十来天，到了石头的房子，大津巴布韦。墙不抹一点灰浆，一层层石片垒成弧形，要仰着头看；墙里立着几根石柱，柱顶站着皂石雕的鸟，鸟眼朝天。领路的是一个绍纳老人，替这片石墙的灵媒跑腿。门楣上有一行刻痕，葡萄牙人的史书说，连有学问的摩尔商人也读不懂。跟着商队来的葡萄牙代理人说：“所罗门的金子就埋在这下面，我拿一年的薪水打赌。”老人说：“鸟看天，人看鸟。你看门，就别看鸟。”我凑近了看，那不像一行字，倒像有人拿一枚戒指在湿泥上按了一下，又按了一下。老人说：“墙是我们的祖父垒的。戒指？戒指是你们海边人的故事。”我（心里）：一个说是所罗门，一个说是祖父，我先拓下来，再听谁的。"
at = "sofala"
speaker = "captain"
mood = "mystic"
cast = ["baraka"]
when = [{ kind = "date", from = [1574, 3, 1] }]
deadline = [1575, 6, 30]

[tracks.chapters.timeout]
next = "b07_league"
effects = []

[[tracks.chapters.choices]]
key = "rub"
text = "用炭条和开罗的纸，拓下门上那行刻痕"
next = "b06_two_rubbings"
requires = [{ kind = "reputation", faction = "mutapa", ge = 5 }]
hint = "老人不让王廷不认得的人碰那道门。"
effects = [{ kind = "flag", flag = "c13_half_solomon_gate" }, { kind = "memory", memory = "mem-main_baraka-b05", title = "门上的字" }]
reply = "老人点了头，替我按住纸角。拓出来的东西黑一块白一块，我卷好，塞进砝码箱的夹层，跟父亲的账簿放在一起。"

[[tracks.chapters.choices]]
key = "sit_night"
text = "在门外坐一夜，听老人讲石头房子的来历"
next = "b06_two_rubbings"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_half_solomon_gate" }, { kind = "reputation", faction = "mutapa", value = 2 }, { kind = "memory", memory = "mem-main_baraka-b05", title = "门上的字" }]
reply = "天亮时他说：“你讲的海边故事，比你们的书好听。拓吧，别碰鸟。”"

[tracks.chapters.choices.fail]
next = "b07_league"
effects = [{ kind = "reputation", faction = "mutapa", value = 2 }]
news = "大津巴布韦的商路上，有个基尔瓦金商在门外坐了一夜，天亮时老人起身就走，没提那道门。"

[[tracks.chapters.choices]]
key = "birds_only"
text = "只看皂石鸟，不碰那道门"
next = "b07_league"
effects = [{ kind = "reputation", faction = "mutapa", value = 3 }]
reply = "我在柱子底下坐了半天，看鸟，看天。葡萄牙代理人去量墙，量到一半被老人赶了出来。我什么也没带走，回去的路上却一直觉得箱子比来时沉。"

# b06 两张拓纸：独白章，无 at。拓了门铭才进；另一半在纳吉玛那边。
[[tracks.chapters]]
key = "b06_two_rubbings"
title = "两张拓纸"
text = "回到海边，夜里我在油灯下把门铭的拓纸摊开。小时候随季风认得的那个尤尔法领航女孩，纳吉玛，在信里提过：她家那边渔夫网上来一只铜瓶，瓶口的铅封上压着一个谁也不认得的印。我照她信里描的样子在拓纸边上比了比，笔画像是接得上，又差一截。我想要另一半。也想知道，纳吉玛肯不肯把她那一半交给一个跟她吵了一辈子的人。我（心里）：一道门，一只瓶子，中间隔着半片海，印却只有一枚。她信里的话，我还记得：“你要是再把北极星叫错，就别给我写信。”"
speaker = "captain"
mood = "mystic"
cast = ["baraka", "najma"]
when = [{ kind = "date", from = [1574, 6, 1] }]
deadline = [1575, 12, 31]

[tracks.chapters.timeout]
next = "b07_league"
effects = [{ kind = "start_track", track = "main_baraka_solomon" }]

[[tracks.chapters.choices]]
key = "join"
text = "两张拓纸并排摊开，一笔一笔对"
next = "b07_league"
requires = [{ kind = "flag", flag = "c13_half_solomon_gate" }, { kind = "flag", flag = "c13_half_solomon_bottle" }, { kind = "flag", flag = "c13_mark_solomon", value = false }]
hint = "另一半还在尤尔法的领航人手里。"
effects = [{ kind = "item", item = "emerald_mark_solomon", qty = 1 }, { kind = "flag", flag = "c13_mark_solomon" }, { kind = "memory", memory = "mem-main_baraka-b06", title = "两张拓纸" }]
reply = "两张纸叠在灯前，铅封上的印正好补上门铭缺的那一截。我把灯拿开，又拿近，看了一夜。天亮时给纳吉玛写信，头一句是：你赢了，这回我没叫错。"

[[tracks.chapters.choices]]
key = "wait"
text = "把门铭收进砝码箱，托季风船给纳吉玛捎个口信"
next = "b07_league"
requires = [{ kind = "flag", flag = "c13_half_solomon_gate" }]
hint = "你没拓到那道门。"
effects = [{ kind = "start_track", track = "main_baraka_solomon" }, { kind = "affinity", person = "najma", value = 3 }]
reply = "口信是这样的：“你的瓶子，我的门，凑一凑。”我故意没说清楚，好让她回信骂我。她骂人的信，比别人夸人的信长。"

[[tracks.chapters.choices]]
key = "sell"
text = "把门铭卖给葡萄牙商站，他们正找俄斐"
next = "b07_league"
requires = [{ kind = "flag", flag = "c13_half_solomon_gate" }]
hint = "手里没有门铭的拓纸，卖不了。"
effects = [{ kind = "cash", value = 2500 }, { kind = "reputation", faction = "portugal", value = 2 }, { kind = "flag", flag = "c13_half_solomon_gate", value = false }]
reply = "代理人捧着那张纸，像捧着圣物。我没告诉他那上面拓下来的只是一道门，门后面是什么，他得自己去问那个老人。"

[[tracks.chapters.variants]]
key = "has_bottle"
when = [{ kind = "flag", flag = "c13_half_solomon_bottle" }]
text = "回到海边，夜里我在油灯下把门铭的拓纸摊开。纳吉玛托季风船捎来的铅封拓纸，已经压在砝码箱底下等了我一季，信只有一句：“你的门，我的瓶，凑一凑。”我照她的瓶口比了一夜，笔画接得上，一点也不差。我想要另一半。也想知道，纳吉玛肯不肯把她那一半交给一个跟她吵了一辈子的人。我（心里）：一道门，一只瓶子，中间隔着半片海，印却只有一枚。"

# b07 七条船：召（蒙巴萨，诸城同盟）。
[[tracks.chapters]]
key = "b07_league"
title = "七条船"
text = "蒙巴萨，老城清真寺的院子，季风换向前的那几天。我把五座城的使者请到一张席子上：基尔瓦、蒙巴萨、马林迪、帕泰、摩加迪沙。蒙巴萨和马林迪的人隔得最远，马林迪是葡萄牙人的朋友，蒙巴萨被葡萄牙人烧过不止一回。席子中间我摆上父亲的砝码，一城一枚。我说：“老人们说，从设拉子来的是七条船，一条船一座城。今天到了五条，剩下两条在路上，船老大是我舅舅，向来慢。”马林迪的使者：“我们跟葡萄牙人喝过的酒，比跟你们喝过的水还多。”蒙巴萨的老人盯着我腰上的铜币看了半天：“这枚铜币……你母亲是从我们这条街嫁出去的。”我母亲是蒙巴萨人，我到今天才知道她娘家在哪条街。我拿一个笑话接住：“那我欠你们一顿饭，今天这顿先算我的。”"
at = "mombasa"
speaker = "captain"
mood = "cheerful"
cast = ["baraka"]
when = [{ kind = "date", from = [1575, 7, 1] }]
deadline = [1577, 9, 30]

[tracks.chapters.timeout]
next = "c01_yasuke"
effects = []
news = "蒙巴萨的人说，基尔瓦萨利姆家张罗的那顿饭到底没请成，几座城的使者各回各的船。"

[[tracks.chapters.choices]]
key = "mombasa_gold"
text = "蒙巴萨：用金子说话，替苏丹添一笔火药钱"
next = "b08_oath"
requires = [{ kind = "cash", ge = 3000 }]
hint = "蒙巴萨的苏丹只听得见金子落在秤盘上的声音。"
effects = [{ kind = "cash", value = -3000 }, { kind = "flag", flag = "c13_main_baraka_league_mombasa" }, { kind = "reputation", faction = "swahili_cities", value = 3 }]
reply = "我把金子用父亲的砝码一枚一枚称给他看，称到最后一枚，蒙巴萨的使者自己伸手按住了秤盘：“够了。我们的苏丹记性好。”"

[[tracks.chapters.choices]]
key = "seven_ships"
text = "帕泰与摩加迪沙：讲七条船，讲到他们自己接下去"
next = "b08_oath"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_baraka_league_pate" }, { kind = "flag", flag = "c13_main_baraka_league_mogadishu" }, { kind = "reputation", faction = "swahili_cities", value = 4 }, { kind = "reputation", faction = "ajuran", value = 2 }]
reply = "讲到第五条船，帕泰的长老接过去讲第六条。摩加迪沙的人不服，抢着讲第七条，讲错了，满院子的人笑成一团，饭就这么吃完了。"

[tracks.chapters.choices.fail]
next = "b08_oath"
effects = [{ kind = "flag", flag = "c13_main_baraka_league_pate" }]
news = "帕泰的长老接了下去，摩加迪沙的人听完就起身告辞，说船要等风。"

[[tracks.chapters.choices]]
key = "malindi_honor"
text = "马林迪：以信义起誓，同盟不去打葡萄牙人"
next = "b08_oath"
requires = [{ kind = "attr", attr = "honor", ge = 55 }]
hint = "马林迪的使者只看你在索法拉、在塞纳做过什么。"
