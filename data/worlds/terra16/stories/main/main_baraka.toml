effects = [{ kind = "item", item = "emerald_mark_solomon", qty = 1 }, { kind = "flag", flag = "c13_mark_solomon" }, { kind = "memory", memory = "mem-main_baraka_solomon-join", title = "两半合一" }]
reply = "印合上了。拓纸卷好以后，那一截接缝摸上去一点也不硌手。"

[[tracks.chapters.choices]]
key = "copy_first"
text = "合起来以前，先各描一份留底"
next = "done"
requires = [{ kind = "flag", flag = "c13_mark_solomon", value = false }]
