[[tracks.chapters]]
key = "join"
title = "两半合一"
text = "两张拓纸凑齐了：一张拓自大津巴布韦的门楣，一张拓自渔夫铜瓶的铅封。摊在一起的那一刻，铅封上的印正好补上门铭缺的那一截。据说拿着这枚印的人，能让山里的灵都听话。灯芯爆了个花，两张纸的边严丝合缝，拓纸上只是一枚印，可灯影晃了一下。"
mood = "mystic"
when = [{ kind = "flag", flag = "c13_half_solomon_gate" }, { kind = "flag", flag = "c13_half_solomon_bottle" }, { kind = "flag", flag = "c13_mark_solomon", value = false }]
deadline = [1588, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "join"
text = "把两张拓纸并排摊开"
next = "done"
requires = [{ kind = "flag", flag = "c13_mark_solomon", value = false }]
