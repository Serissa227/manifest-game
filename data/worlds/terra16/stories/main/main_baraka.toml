[[tracks.chapters.variants]]
key = "league"
when = [{ kind = "flag", flag = "c13_main_baraka_league_sworn" }]
text = "1589 年三月，蒙巴萨。米尔·阿里第二回来了，这回在岛上筑了土墙。葡萄牙舰队从海上堵住了港口；对岸大陆上，津巴人的营火一直烧到浅滩边。马林迪那边捎来话：津巴人要是往北走，马林迪北边的塞格朱人在岸上等着。津巴的首领隔着水派人喊话：“葡萄牙人是海上的神，我是陆上的神。”我母亲娘家那条街就在港边。纳吉玛的船泊在北边的水道里，她说夜里那条水道能走船。她对我说：“水道只开退潮前那一个时辰。你的笑话留到船上再讲。”半夜里有人游水过了海峡，是米尔·阿里自己，他宁可做葡萄牙人的俘虏，也不落到津巴人手里。我（心里）：母亲娘家门口那块踏脚石，我小时候在上面摔过一跤。今晚，我得从它上面把人一个一个扶下船。"

# c10 金之河：终章（1589）。三个落点恰好一面 end_*；HIST_H59 只在变体里读。
[[tracks.chapters]]
key = "c10_epilogue"
title = "金之河"
text = "1589 年夏天。津巴人往北走，在马林迪北边被塞格朱人挡住了。葡萄牙人在蒙巴萨的岸上量地，说要筑一座石堡。我坐在母亲娘家的院子里。院墙塌了，井还在。膝盖上摊着那本写了二十多年的史书，脚边是父亲的黄铜砝码箱，这些年里面的砝码少了几枚，每一枚都有去处。一个马库阿来的学徒在替我磨墨，他问：“书写完了，给谁看？”我第一次没有笑话可讲。我说：“给写错我们的人看，也给还没出生的人看。Haba na haba——一点一点，量米的升就满了。”"
cast = ["baraka"]
mood = "tender"
when = [{ kind = "date", from = [1589, 6, 1] }]

[[tracks.chapters.choices]]
key = "chronicle"
text = "把诸城自己的史书写完，抄七份，一城一份"
next = "done"
requires = [{ kind = "flag", flag = "c13_main_baraka_history_begun" }]
hint = "史书没起过笔，谈不上写完。"
effects = [{ kind = "flag", flag = "c13_main_baraka_done" }, { kind = "flag", flag = "c13_main_baraka_end_chronicle" }, { kind = "memory", memory = "mem-main_baraka-c10", title = "七份史书" }]
reply = "七份，基尔瓦、蒙巴萨、马林迪、帕泰、摩加迪沙，还有两份给还没回来的两条船。最后一页没写苏丹的名字，写的是父亲没写完的那半个字。我替他写完了。"

[[tracks.chapters.choices]]
key = "kilwa"
text = "回基尔瓦，在退潮的浅滩边重开金市"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_baraka_done" }, { kind = "flag", flag = "c13_main_baraka_end_kilwa" }, { kind = "memory", memory = "mem-main_baraka-c10", title = "七份史书" }]
reply = "第一天只来了三个人，一个卖鱼的，一个卖布的，一个问我砝码箱卖不卖。我说不卖，但可以借他称一回。潮退的时候，浅滩又露出来，这回从上面走过来的是挑着货的人。"

[[tracks.chapters.choices]]
key = "road"
text = "把砝码箱交给马库阿学徒，自己随季风再走一趟"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_baraka_done" }, { kind = "flag", flag = "c13_main_baraka_end_road" }, { kind = "memory", memory = "mem-main_baraka-c10", title = "七份史书" }]
reply = "我教他认箱盖里刻的记号，一格一格讲来历。讲到那个马库阿男孩的那一格，我头一回没加一个笑话。船出港时，他在岸上举着箱子，像举着一盏灯。"

