# ── 第二幕 1567—1577 潮涌 ──

# b00 独眼诗人的米：限期交货（米 15 包），卡蒙斯在莫桑比克岛。第二幕第一章，设 act2。
[[tracks.chapters]]
key = "b00_camoes"
title = "独眼诗人的米"
text = "莫桑比克岛，等风的季节。岛上挤着两百来个等船回葡萄牙的人，米价一天一变，米在蒙巴萨、马林迪、桑给巴尔都买得到。小教堂边的酒馆里，一个独眼的葡萄牙人胳膊底下压着一卷油布包的诗稿，他说湄公河口沉船那回，他一只手划水，一只手把这卷诗举过头顶。他写的是达·伽马的航海，里面有蒙巴萨，也有马林迪。“米我收下。诗你得听完，不许中途走。”他念到蒙巴萨：诗里的蒙巴萨国王奸诈，马林迪国王是好朋友。他问我：“你们那边的诗人，管我们葡萄牙人叫什么？”我告诉了他。他大笑，说这一句他死也不写进去。我说：“蒙巴萨的国王要是听见这一段，会请你吃一顿饭，吃完再把你扔下海。”我（心里）：外人写我们，一个写成账，一个写成诗；账还能改，诗改不动。"
at = "mozambique_island"
speaker = "captain"
mood = "cheerful"
cast = ["luis_de_camoes"]
when = [{ kind = "date", from = [1568, 1, 1] }]
objectives = [{ kind = "goods", good = "rice", qty = 15, at = "mozambique_island", text = "运十五包米到莫桑比克岛：等船回葡萄牙的人断粮了" }]
deadline = [1569, 8, 31]

[tracks.chapters.timeout]
next = "b01_barreto"
effects = [{ kind = "flag", flag = "c13_main_baraka_act2" }]

[[tracks.chapters.choices]]
