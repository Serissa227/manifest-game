# ── 第一幕 1557—1566 ──

# a00 门槛见闻：基尔瓦码头，开罗回来的金商之子。窗口止日没人回应也照走。
[[tracks.chapters]]
key = "a00_gate"
title = "开罗回来的人"
text = "正月的东北风正盛，基尔瓦珊瑚石砌的码头上，挑夫卸着从北边来的布，清真寺台阶上坐着晒太阳的老人。从开罗来的船靠了岸，下船的是金商萨利姆的儿子，白袍上还沾着书铺的灰。他先问的是索法拉的金价，没问家里。台阶上的老人咂着嘴：“开罗教出来的嘴，砍起价来跟他爹一个样，只是多讲一段故事。”码头上已经有人在数他那十二匹布了，父亲早把布装上了他的姆泰佩。"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "kilwa"
stage = "rumor"
mood = "cheerful"
cast = ["baraka"]
when = [{ kind = "flag", flag = "c12_voyage_baraka" }]
news = "基尔瓦码头上说，金商萨利姆的儿子从开罗回来了，下船先问的是索法拉的金价。"

[tracks.chapters.default]
next = "a01_monsoon"
effects = [{ kind = "flag", flag = "c13_main_baraka" }]

# a01 父亲的砝码：限期交货（布 10 匹），兼教玩家交货；父亲的砝码箱在这一章交到他手上。
[[tracks.chapters]]
key = "a01_monsoon"
title = "父亲的砝码"
text = "索法拉的金市挨着葡萄牙人的石堡，正午的日头把秤盘晒得烫手。这是我第一次一个人称金。出门前父亲把用了三十年的黄铜砝码箱交给我，箱盖里侧刻着每一枚砝码的记号，最小的那枚只有一粒豆子重。父亲的老伙计哈希姆蹲在草席对面，金砂包在芭蕉叶里，他的拇指搭在秤杆上：“萨利姆的儿子？让我看看你的手。称金的人，手不能比金子先动。”堡里的葡萄牙书记坐在一边，等着抽王室那一份。我在心里又听了一遍父亲临行时的话：“Haba na haba——一点一点，量米的升就满了。”母亲病的那一年我三岁，我只记得一碗没喝完的椰汁。这件事，我得拿个笑话盖过去。"
at = "sofala"
speaker = "captain"
mood = "cheerful"
cast = ["baraka"]
when = [{ kind = "date", from = [1557, 1, 7] }]
objectives = [{ kind = "goods", good = "cloth", qty = 10, at = "sofala", text = "趁东北风，把父亲的十匹布运到索法拉的金市" }]
deadline = [1557, 3, 31]

[tracks.chapters.timeout]
next = "a02_massawa"
effects = []
news = "基尔瓦的萨利姆今年的布是在自家码头贱卖的，听说儿子没赶上往南的风。"

[[tracks.chapters.choices]]
key = "reweigh"
text = "用父亲的砝码，一枚一枚重称"
next = "a02_massawa"
check = { attr = "commerce", base = 35, per = 6 }
effects = [{ kind = "cash", value = 1400 }, { kind = "memory", memory = "mem-main_baraka-a01", title = "父亲的砝码箱" }]
reply = "哈希姆收回拇指，把那块磨过角的秤砣扔进了海里：“这一块，算我送你的见面礼。”我把箱子里最小的那枚砝码收回袋里，那一枚，我一直没用上。"

[tracks.chapters.choices.fail]
next = "a02_massawa"
effects = [{ kind = "cash", value = 900 }, { kind = "memory", memory = "mem-main_baraka-a01", title = "父亲的砝码箱" }]
news = "索法拉的人说，萨利姆的儿子一枚一枚重称，称对了，却把账讲糊涂了，回去的路上才算明白。"

[[tracks.chapters.choices]]
key = "story_price"
text = "讲个故事，讲到他自己把拇指拿开"
next = "a02_massawa"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "cash", value = 1600 }, { kind = "reputation", faction = "swahili_cities", value = 2 }, { kind = "memory", memory = "mem-main_baraka-a01", title = "父亲的砝码箱" }]
reply = "我讲一个替苏丹称金子、最后称出自己影子有多重的商人。讲到一半，哈希姆把拇指收回去拍大腿，笑得秤杆都在抖。他一边擦眼睛一边说，这个价，就这么定了。"

[tracks.chapters.choices.fail]
next = "a02_massawa"
effects = [{ kind = "cash", value = 1000 }, { kind = "memory", memory = "mem-main_baraka-a01", title = "父亲的砝码箱" }]
news = "索法拉的金市上，哈希姆听完笑了一场，照样按着秤，说故事好，价钱不改。"

[[tracks.chapters.choices]]
key = "pay_debt"
text = "先替父亲还上那笔旧账，再谈金价"
next = "a02_massawa"
requires = [{ kind = "cash", ge = 600 }]
hint = "袋里的钱还不够还一笔二十年的账。"
effects = [{ kind = "cash", value = 800 }, { kind = "flag", flag = "c13_main_baraka_paid_debt" }, { kind = "memory", memory = "mem-main_baraka-a01", title = "父亲的砝码箱" }]
reply = "哈希姆数也不数就收下了，说从今往后，索法拉的金市上他替萨利姆家说话。我还讲了个笑话，他没笑。那笔账是我母亲的药钱。"

[[tracks.chapters.variants]]
key = "rw_debt"
when = [{ kind = "flag", flag = "rw_baraka_hashim_debt_promised" }]
text = "索法拉的金市挨着葡萄牙人的石堡，正午的日头把秤盘晒得烫手。这是我第一次一个人称金。出门前父亲把用了三十年的黄铜砝码箱交给我，箱盖里侧刻着每一枚砝码的记号，最小的那枚只有一粒豆子重。父亲的老伙计哈希姆蹲在草席对面，金砂包在芭蕉叶里，他的拇指搭在秤杆上：“萨利姆的儿子？让我看看你的手。称金的人，手不能比金子先动。”他又说：“开罗那封信里，你说剩下的账你来还。我记着。”堡里的葡萄牙书记坐在一边，等着抽王室那一份。我在心里又听了一遍父亲临行时的话：“Haba na haba——一点一点，量米的升就满了。”母亲病的那一年我三岁，我只记得一碗没喝完的椰汁。这件事，我得拿个笑话盖过去。"

[[tracks.chapters.variants]]
key = "rw_story"
when = [{ kind = "flag", flag = "rw_baraka_hashim_story_promised" }]
text = "索法拉的金市挨着葡萄牙人的石堡，正午的日头把秤盘晒得烫手。这是我第一次一个人称金。出门前父亲把用了三十年的黄铜砝码箱交给我，箱盖里侧刻着每一枚砝码的记号，最小的那枚只有一粒豆子重。父亲的老伙计哈希姆蹲在草席对面，金砂包在芭蕉叶里，他的拇指搭在秤杆上：“萨利姆的儿子？让我看看你的手。称金的人，手不能比金子先动。”他又问：“故事带来了没有？开罗那封信里，你答应过的。”堡里的葡萄牙书记坐在一边，等着抽王室那一份。我在心里又听了一遍父亲临行时的话：“Haba na haba——一点一点，量米的升就满了。”母亲病的那一年我三岁，我只记得一碗没喝完的椰汁。这件事，我得拿个笑话盖过去。"

# a02 马萨瓦换了旗：红海来的消息，旁白。
[[tracks.chapters]]
key = "a02_massawa"
title = "马萨瓦换了旗"
text = "红海下来的船带来消息：奥斯曼的帕夏带兵上了马萨瓦岛，海关换了旗，账簿的第一页改写成了“哈贝什省”。去年有人在苏伊士数过那些新桅杆，如今就泊在马萨瓦外面。船老大把这话讲给码头上每一个人听，末了总要加一句：“帕夏的人上船头一句就问，这船往南还去不去基尔瓦。货，他们后来才看。”"
window = [[1557, 4, 1], [1557, 9, 30]]
at = "massawa"
stage = "rumor"
mood = "tense"
cast = ["baraka"]
news = "马萨瓦来的船说，奥斯曼的帕夏带兵上了岛，海关换了旗，账簿开头改写成“哈贝什省”。"

[tracks.chapters.default]
next = "a03_silveira"
effects = []

# a03 带盐的神父：召，西尔韦拉要人领路，恩科西要人报信。
[[tracks.chapters]]
key = "a03_silveira"
title = "带盐的神父"
text = "1560 年旱季，索法拉的清晨冷得要裹毯子。一条从南边下来的小船靠了岸，船上的耶稣会士瘦得像一根桅绳。夜里他睡在甲板上，随身只有一小袋盐和一壶水，说是施洗用的。穆塔帕王廷的年轻信使恩科西刚从山里下来，蹲在码头的木桩上打量他。神父要去赞比西河口，再上到王廷，他要一个懂王廷规矩的人。他把手伸过来，手指干得裂了口子：“我不要金子，也不要象牙。我只要一个肯慢慢替我说话的人。”恩科西在一旁嚼着草根：“信可以急，水不能省——神父，你那壶水是喝的，还是泼的？”王廷里从海边去的商人已经在说，神父是巫师，水和盐是下咒用的。神父听不懂这句绍纳话，还在冲恩科西笑。"
at = "sofala"
speaker = "captain"
mood = "tense"
cast = ["goncalo_da_silveira", "nkosi"]
when = [{ kind = "date", from = [1560, 5, 1] }]
deadline = [1560, 9, 30]

[tracks.chapters.timeout]
next = "a04_strangled"
effects = []
news = "索法拉的人说，那个只带一袋盐的神父自己找了船夫，上赞比西河去了。"

[[tracks.chapters.choices]]
key = "guide"
text = "陪他上河口，路上教他王廷的拍手礼"
next = "a04_strangled"
effects = [{ kind = "flag", flag = "c13_main_baraka_guided" }, { kind = "reputation", faction = "portugal", value = 2 }, { kind = "affinity", person = "goncalo_da_silveira", value = 5 }]
reply = "我教了他七天。他学得极认真，拍手拍得比王廷的人还响。分手时他把那袋盐分了一半给我，说是给我的船的。"
news = "索法拉的人说，萨利姆的儿子陪那个瘦神父上了赞比西河口，一路教他怎样在王廷里拍手。"

[[tracks.chapters.choices]]
key = "warn_court"
text = "托恩科西先跑回王廷：这个神父不带兵"
next = "a04_strangled"
effects = [{ kind = "flag", flag = "c13_main_baraka_warned_court" }, { kind = "affinity", person = "nkosi", value = 6 }, { kind = "reputation", faction = "mutapa", value = 3 }]
reply = "恩科西把我的话背了一遍，一字不差，当天下午就上了山路，鞋都没换。他回头喊了一句：王要是问起是谁说的，我就说是基尔瓦那个话多的。"

[[tracks.chapters.choices]]
key = "stay_out"
text = "两边都不沾，卖完这一季的布就走"
next = "a04_strangled"
effects = [{ kind = "cash", value = 600 }]
reply = "布卖给了王廷来的管事，价钱不坏。神父的小船第二天一早走了，帆上补着一块红布。我站在码头上看了很久，才想起账还没记。"

# a04 河里的神父：历史现场。窗口内没人插手就走 default。
[[tracks.chapters]]
key = "a04_strangled"
title = "河里的神父"
text = "1561 年四月，雨季快过去了，索法拉外的河水还是黄的。恩科西从王廷一路跑下来，泥一直糊到膝盖，手里攥着神父那只装盐的小袋，袋口的绳子还打着神父的结。他说王廷的议事会信了海边商人的话，夜里把神父勒死，扔进了河里。消息比恩科西晚一步到了石堡。堡里的长官已经叫人去抓城里的摩尔商人，里面有父亲的几个老伙计。恩科西把那只盐袋塞进我手里：“门关着，可钥匙还在王的手里。王已经下令关了海边的金市。你要开，就得空着手去，再带着布回来。”我（心里）：上回见他，那袋盐是满的。"
window = [[1561, 4, 15], [1561, 8, 31]]
at = "sofala"
stage = "involve"
speaker = "captain"
mood = "sad"
cast = ["nkosi"]
news = "索法拉的人说，内陆王廷把那个施洗的神父勒死、扔进了河里，石堡里的长官要城里的摩尔商人交代。"

[tracks.chapters.default]
next = "a05_gold_door"
effects = []
news = "索法拉石堡的长官连夜抓了三个摩尔商人，内陆的金市一连几天关着门。"

