text = "这些年我每回进赞比西河，都要在塞纳下游那片沙洲边停一停。沙洲上如今有一间草棚，迪奥戈出了牢就住在那里，腿瘸了，在河边立了一个木十字，说神父就是在这一段沉下去的。那两个从栅栏里拉出来的孩子长大了，常给他送鱼，他从没劝过他们受洗。我把迪奥戈写进了史书，又划掉，又写上。一个流放兵，一个摩尔金商，信的不是一个神，在同一条河边，各看见了一点什么。他看见的是水一下子平了；我看见的，是他张开的两只胳膊。"


# ───────────── 旁轨（剧情增写 2026-11-12，Claude）：第二本账（姑母阿莎与椰纤棚里的人，1557—1588，5 章） ─────────────
# 母本：《古兰经·光明章》第三十三节的赎身契；后世的训诫诗《姆瓦娜库波纳》作对照。文化：斯瓦希里海岸的家奴、赎身与放人的功德；照样卖绳给运人的船。
# 张力：阿莎拿卖给运人船的绳钱，一个一个往回赎人；巴拉卡继承了父亲的“九个人”。1587 年津巴人趁退潮过浅滩（史实：城里有人带路，带路的人后来被津巴首领处死）——
#     这里只用传闻口吻：放没放人、苏迪走没走，决定那一夜从红树林里领人出去的是谁，带路的那个人认不认得沤椰壳的池子，都只在变体里分，不点名。
# 人物的死：阿莎死于 1587 年津巴人破城那一夜（s4，与 c08 同一时节；c08 以后的章节里她不出场）。
# 入口：s1、s2 读 c13_main_baraka 加日期，s3、s4 读 _act2，s5 读 _act3。各章有期限与 timeout，s5 是终章（next = done）。
# 读：rw_baraka_rope_name_wait / _no_more_said（养成·第二本账 c4、c6，s1 变体）、rw_baraka_rope_faraji_freed（c5，s2 变体）。
# 设：rw_baraka_s_name_learned / _raised / _stopped（s1）、_freed_all / _contract / _waited（s2，timeout 也设 _waited）、_sudi_yes / _sudi_haggled / _sudi_aunt / _sudi_gone（s3，timeout 设 _sudi_gone）、
#     _ledger_found / _buried / _carried（s4）、rw_baraka_rope_end_chronicle / _end_both / _end_cleared（s5）。
[[tracks]]
key = "main_baraka_rw_rope"
name = "第二本账"
kind = "main"
start = "s1_ledger"
auto = true
cast = ["baraka"]

# s1 池子最东头：小账当面交到手上。
[[tracks.chapters]]
key = "s1_ledger"
title = "池子最东头"
text = "回到基尔瓦的第一个旱季，姑母把那本小账当面交给我看，第一页还是那一行，帕泰的赛义德，一年十二捆。赛义德老了，今年来的是他儿子，船更大，舱底的铁环多了一排，说葡萄牙人在莫桑比克岛上也收人，往印度运，价钱涨了。池子最东头那一口，希库达尼还在捶，头发白了一半。她看见我，停下木棒：“金商的儿子，你回来了。名字的事，你还问不问？”"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1557, 5, 1] }]
at = "kilwa"
speaker = "captain"
mood = "tender"
cast = ["baraka"]
deadline = [1558, 6, 30]

[[tracks.chapters.choices]]
key = "ask_name"
text = "蹲下来，问她原来的名字"
next = "s2_estate"
effects = [{ kind = "flag", flag = "rw_baraka_s_name_learned" }]
reply = "她说了。是一个河那边的名字，四个音，最后一个音往上挑，像在喊远处的人。我念了三遍她才点头。她说那是她母亲起的，意思是“第二场雨”。我把它写进本子，写在希库达尼旁边，两个名字中间没画线。"

[[tracks.chapters.choices]]
key = "raise"
text = "把卖给赛义德儿子的绳价翻一倍"
next = "s2_estate"
effects = [{ kind = "cash", value = 600 }, { kind = "flag", flag = "rw_baraka_s_raised" }]
reply = "赛义德的儿子骂我比他父亲还黑，骂完还是买了，说今年船上的人多，绳子省不得。多出来的那一半，我当着姑母记进了小账。姑母看着那一行说：“你翻的是他的价，还是你自己的心？”我答不上来。"

[[tracks.chapters.choices]]
key = "stop"
text = "今年起，绳子不卖给这条船"
next = "s2_estate"
effects = [{ kind = "flag", flag = "rw_baraka_s_stopped" }]
reply = "我说不卖。赛义德的儿子耸耸肩，掉头去了马林迪。姑母把小账翻到最后一页：“往后没有这笔钱进来，这一页就一直空着。”她没怪我，只是那天晚上，她一个人在灯下坐了很久。"

[tracks.chapters.timeout]
next = "s2_estate"
effects = []
news = "基尔瓦的人说，萨利姆家的绳坊今年换了人管账，帕泰的大船照样来买绳。"

[[tracks.chapters.variants]]
key = "rw_name_wait"
when = [{ kind = "flag", flag = "rw_baraka_rope_name_wait", value = true }]
text = "回到基尔瓦的第一个旱季，姑母把那本小账当面交给我看，第一页还是那一行，帕泰的赛义德，一年十二捆。赛义德老了，今年来的是他儿子，船更大，舱底的铁环多了一排，说葡萄牙人在莫桑比克岛上也收人，往印度运，价钱涨了。池子最东头那一口，希库达尼还在捶，头发白了一半。她看见我，停下木棒：“你在信里问过我的名字。人回来了，自己问吧。”"

[[tracks.chapters.variants]]
key = "rw_no_more"
when = [{ kind = "flag", flag = "rw_baraka_rope_name_wait", value = false }, { kind = "flag", flag = "rw_baraka_rope_no_more_said", value = true }]
text = "回到基尔瓦的第一个旱季，姑母把那本小账当面交给我看，第一页那一行底下画了一道线：去年起，没卖。赛义德老了，他儿子去马林迪买的绳，船照样来，舱底的铁环多了一排，说葡萄牙人在莫桑比克岛上也收人，往印度运，价钱涨了。后半本那一年一个名字也没添。池子最东头那一口，希库达尼还在捶，头发白了一半。她看见我，停下木棒：“金商的儿子，你回来了。名字的事，你还问不问？”"

# s2 法官的单子：父亲死后分遗产，“九个人”归了儿子。
[[tracks.chapters]]
key = "s2_estate"
title = "法官的单子"
text = "父亲死后，法官来家里分遗产。书记一样一样记：秤房，砝码箱，两条船，椰纤棚，还有人。单子上写着九个名字，每个名字后面一个价钱，跟写船一样。照规矩，儿子在，姑姑分不到，这九个人都归了我。姑母坐在一边，手里绕着一根椰纤线，绕得越来越紧。法官问我，单子有没有错。希库达尼不在单子上，她的契是十年前写的。法拉吉在单子上，排在第一个，腿肿着，坐在门口听。他儿子苏迪排在第七个，二十岁，会拧绳，会撑船。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1564, 3, 1] }]
at = "kilwa"
speaker = "captain"
mood = "tense"
cast = ["baraka"]
deadline = [1565, 12, 31]

[[tracks.chapters.choices]]
key = "free_all"
text = "当着法官，把九个人的契一起写了"
next = "s3_sudi"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "swahili_cities", value = -1 }, { kind = "flag", flag = "rw_baraka_s_freed_all" }]
reply = "法官的书记写了一个下午，写到手酸。九个人一个一个按手印，有的笑，有的哭，有个老妇人按完问我：那我今晚还睡原来的地方吗？我说睡。苏迪按完就走了，走到门口又回来，说他明天照样来上工，要工钱。邻居们说萨利姆的儿子败家，败得比他爹会砍价还快。"

[[tracks.chapters.choices]]
key = "contract"
text = "照姑母的规矩：钱交够了就写契"
next = "s3_sudi"
effects = [{ kind = "flag", flag = "rw_baraka_s_contract" }]
reply = "我说照姑母那本小账的规矩，谁的钱交够了，谁的契就写。法官点头，说这是正道。书记把九个人的身价抄了一份，交给姑母收着。苏迪听完问：“我的价钱是多少？”我念给他听。他说：“我会交够的。”说得很快。"

[[tracks.chapters.choices]]
key = "wait"
text = "先不动，等生意稳了再说"
next = "s3_sudi"
effects = [{ kind = "cash", value = 500 }, { kind = "flag", flag = "rw_baraka_s_waited" }]
reply = "我说父亲刚走，生意还不稳，人先照旧。法官没说什么，书记把单子折好，交到我手里。姑母手里的线断了，她没换新的，就那样攥着断头。夜里我听见苏迪在棚子后面跟谁说话，声音压得很低。"

[tracks.chapters.timeout]
next = "s3_sudi"
effects = [{ kind = "flag", flag = "rw_baraka_s_waited" }]
news = "基尔瓦的法官分完了萨利姆的遗产，听说单子上除了船和秤，还有九个人。"

[[tracks.chapters.variants]]
key = "rw_faraji"
when = [{ kind = "flag", flag = "rw_baraka_rope_faraji_freed", value = true }]
text = "父亲死后，法官来家里分遗产。书记一样一样记：秤房，砝码箱，两条船，椰纤棚，还有人。单子上写着九个名字，每个名字后面一个价钱，跟写船一样。照规矩，儿子在，姑姑分不到，这九个人都归了我。姑母坐在一边，手里绕着一根椰纤线，绕得越来越紧。法官问我，单子有没有错。希库达尼不在单子上，她的契是十年前写的。法拉吉也不在，父亲那年替他写过契，他是作为自己的人死的。他儿子苏迪还在单子上，排在第七个，二十岁，会拧绳，会撑船。"

# s3 苏迪要的东西：要什么由 s2 的结果定（变体），回答不变；没回答（timeout）他就自己走了。
[[tracks.chapters]]
key = "s3_sudi"
title = "苏迪要的东西"
text = "苏迪三十二了，椰纤棚里的活儿一半是他在管。这年旱季他来找我，站在秤房门口，不进来：他要赎他自己，还有他女人和两个孩子，钱他攒了十一年，差一点。“差的那一点，你说个数。”他说完盯着我腰上的砝码箱，像当年卡蒂盯着秤杆。码头上，帕泰的船又来了，舱口开着，底下有人在喊水。"
when = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "date", from = [1576, 2, 1] }]
at = "kilwa"
speaker = "captain"
mood = "tense"
cast = ["baraka"]
deadline = [1577, 12, 31]

[[tracks.chapters.choices]]
key = "yes"
text = "他要的，照他说的给"
next = "s4_ford"
effects = [{ kind = "flag", flag = "rw_baraka_s_sudi_yes" }]
reply = "我说好，照你说的。他在门口愣了一下，好像准备好的话没用上，有点不甘心。他点点头走了，走出几步又回头：“你爹不会答应得这么快。”我说我爹答应得慢，可他答应过的都算数。"

[[tracks.chapters.choices]]
key = "haggle"
text = "跟他讲价，讲到他自己笑出来"
next = "s4_ford"
effects = [{ kind = "flag", flag = "rw_baraka_s_sudi_haggled" }]
reply = "我跟他讲了一个上午，他报一个数，我讲一个笑话，再报一个数。讲到后来他笑了，说我把一桩正经事讲成了赶集。最后的数比他说的多一点，比我想的少一点。他走的时候说：“你讲价跟你爹一样，只是多讲故事。”"

[[tracks.chapters.choices]]
key = "aunt"
text = "让姑母定"
next = "s4_ford"
effects = [{ kind = "flag", flag = "rw_baraka_s_sudi_aunt" }]
reply = "我说这事让姑母定。姑母把小账翻开，一行一行地看，看到苏迪他娘的名字，停了很久。她定的数，比他说的还少。苏迪没谢她，也没谢我，只说：“她定的，我认。”"

[tracks.chapters.timeout]
next = "s4_ford"
effects = [{ kind = "flag", flag = "rw_baraka_s_sudi_gone" }]
news = "基尔瓦的人说，萨利姆家绳坊的苏迪带着女人孩子，半夜撑一条小船去了对岸的大陆。"

[[tracks.chapters.variants]]
key = "rw_contract"
when = [{ kind = "flag", flag = "rw_baraka_s_contract", value = true }]
text = "苏迪三十二了，他自己的契前年写成了，钱是一枚一枚交够的，比账上的日子早了两年。这年旱季他又来找我，站在秤房门口，不进来：他女人和两个孩子的契还没写，钱差一点。“差的那一点，你说个数。”他说完盯着我腰上的砝码箱，像当年卡蒂盯着秤杆。码头上，帕泰的船又来了，舱口开着，底下有人在喊水。"

[[tracks.chapters.variants]]
key = "rw_freed"
when = [{ kind = "flag", flag = "rw_baraka_s_freed_all", value = true }]
text = "苏迪三十二了，拿着工钱，椰纤棚里的活儿一半是他在管。这年旱季他来找我，站在秤房门口，不进来：他要东头那三口沤椰壳的池子归他自己，赚的钱分我三成。“我自己的人，自己的池子。你说个数。”他说完盯着我腰上的砝码箱，像当年卡蒂盯着秤杆。码头上，帕泰的船又来了，舱口开着，底下有人在喊水。"

# s4 浅滩那一夜：津巴人破基尔瓦（1587，c08 同一时节），阿莎死。带路的人只用传闻。
[[tracks.chapters]]
key = "s4_ford"
title = "浅滩那一夜"
text = "津巴人过浅滩那一夜，姑母没有走。她七十二了，腿不灵，坐在椰纤棚里，怀里抱着那本小账，说账在哪里她在哪里。我赶回来的时候潮已经涨了，棚子烧塌了半边，沤椰壳的池子里漂着灰。她靠着最东头那口池子的石沿坐着，像在等收工，小账压在胸口，一页也没烧着。码头上的人说，带路的是城里人，退潮的时候哪一块泥能踩、哪一块会陷，他心里清清楚楚。"
when = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "date", from = [1587, 5, 15] }]
at = "kilwa"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
deadline = [1587, 10, 31]

[[tracks.chapters.choices]]
key = "ledger"
text = "从她怀里把小账拿出来"
next = "s5_names"
effects = [{ kind = "flag", flag = "rw_baraka_s_ledger_found" }]
reply = "她的手指扣着封皮，扣得很紧，我掰了很久。小账最后一页是她临死前几天写的，字歪了：一个是这些年名字的总数，一个是卖绳的总捆数，两个数中间，她没画等号。"

[[tracks.chapters.choices]]
key = "bury"
text = "就在椰纤棚后墙外，把她埋了"
next = "s5_names"
effects = [{ kind = "flag", flag = "rw_baraka_s_buried" }]
reply = "清真寺东墙塌了，坟地上全是新土。我在椰纤棚后墙外头给她挖了一个坑，挨着法拉吉他娘。活下来的绳坊的人来了七八个，没人去叫，自己来的，每个人往坑里放了一根椰纤。"

[[tracks.chapters.choices]]
key = "ships"
text = "先把活着的人送上北去的船"
next = "s5_names"
effects = [{ kind = "reputation", faction = "swahili_cities", value = 3 }, { kind = "flag", flag = "rw_baraka_s_carried" }]
reply = "我没来得及哭，先把能找到的人一船一船往北送，送到马菲亚，送到桑给巴尔。最后一船开走，我才回到椰纤棚。她还靠在池沿上，潮水已经退了，泥上全是脚印，有大人的，也有孩子的。"

[tracks.chapters.timeout]
next = "s5_names"
effects = []
news = "基尔瓦的人说，津巴人过浅滩那一夜，萨利姆家的老姑母坐在椰纤棚里，没有走。"

[[tracks.chapters.variants]]
key = "rw_gone"
when = [{ kind = "flag", flag = "rw_baraka_s_sudi_gone", value = true }]
text = "津巴人过浅滩那一夜，姑母没有走。她七十二了，腿不灵，坐在椰纤棚里，怀里抱着那本小账，说账在哪里她在哪里。我赶回来的时候潮已经涨了，棚子烧塌了半边，沤椰壳的池子里漂着灰。她靠着最东头那口池子的石沿坐着，像在等收工，小账压在胸口，一页也没烧着。码头上的人说，带路的那个人认得沤椰壳的池子，退潮时哪一块泥能踩，他踩过十几年。没人说出他的名字。听说津巴人一进城，先把他杀了。我想起苏迪半夜撑走的那条小船。"

[[tracks.chapters.variants]]
key = "rw_led"
when = [{ kind = "flag", flag = "rw_baraka_s_sudi_gone", value = false }, { kind = "flag", flag = "rw_baraka_s_sudi_yes", value = true }]
text = "津巴人过浅滩那一夜，姑母没有走。她七十二了，腿不灵，坐在椰纤棚里，怀里抱着那本小账，说账在哪里她在哪里。我赶回来的时候潮已经涨了，棚子烧塌了半边，沤椰壳的池子里漂着灰。她靠着最东头那口池子的石沿坐着，像在等收工，小账压在胸口，一页也没烧着。那一夜从红树林里把人一个一个领出去的，是苏迪，他踩了半辈子沤椰壳的泥，闭着眼都知道哪一块能下脚。他回来找过姑母，姑母不肯走，把孩子们交给了他。"

[[tracks.chapters.variants]]
key = "rw_led_b"
when = [{ kind = "flag", flag = "rw_baraka_s_sudi_gone", value = false }, { kind = "flag", flag = "rw_baraka_s_sudi_yes", value = false }]
text = "津巴人过浅滩那一夜，姑母没有走。她七十二了，腿不灵，坐在椰纤棚里，怀里抱着那本小账，说账在哪里她在哪里。我赶回来的时候潮已经涨了，棚子烧塌了半边，沤椰壳的池子里漂着灰。她靠着最东头那口池子的石沿坐着，像在等收工，小账压在胸口，一页也没烧着。活下来的人说，那一夜是苏迪打着火把，从红树林里把人一个一个领出去的。他回头找过姑母，姑母摆摆手，把怀里那本账抱得更紧了。码头上的人还说，带路的是城里人，退潮时哪一块泥能踩，他心里清清楚楚。"

# s5 没画等号的一页：终章。
[[tracks.chapters]]
key = "s5_names"
title = "没画等号的一页"
text = "姑母死后的第一个东北风季，我把那本小账从头到尾抄了一遍。前半本是绳：每一年卖给谁，几捆，什么价，那条船往哪里去。后半本是人：名字，身价，交回多少，哪天写的契。有几个名字旁边另有一个名字，是他们自己一个音一个音教她拼的。抄到最后一页，那两个没画等号的数，我看了一夜。赎回来的人多，还是绳子拴走的人多，没有人算得清。"
when = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "date", from = [1588, 2, 1] }]
speaker = "captain"
mood = "tender"
cast = ["baraka"]

[[tracks.chapters.choices]]
key = "chronicle"
text = "把后半本的名字抄进诸城的史书"
next = "done"
effects = [{ kind = "growth", attr = "learning", value = 100 }, { kind = "flag", flag = "rw_baraka_rope_end_chronicle" }]
reply = "我把那些名字一个一个抄进史书，抄在基尔瓦那一卷的末尾，有两个名字的，两个都抄。史书里写苏丹，写船，写打仗，从来没写过捶椰壳的人。现在写了。"

[[tracks.chapters.choices]]
key = "both"
text = "前半本也抄进去，一捆不少"
next = "done"
effects = [{ kind = "flag", flag = "rw_baraka_rope_end_both" }]
reply = "我把前半本也抄了进去，四十一年，每一年卖给谁，几捆。抄的时候手发抖。后人读到基尔瓦的绳，就该知道这绳拴过什么。姑母要是看见，会说：账上写清楚。"

[[tracks.chapters.choices]]
key = "clear"
text = "把还没交够的几笔，一笔勾销"
next = "done"
effects = [{ kind = "flag", flag = "rw_baraka_rope_end_cleared" }]
reply = "后半本里凡是没交够的，不管是谁的，我拿父亲的笔一笔一笔划掉，在旁边写一个“清”字。写完我把小账放进砝码箱，压在最底下，毡子下面那个空着的位置上。"
