effects = [{ kind = "reputation", faction = "portugal", value = 1 }, { kind = "reputation", faction = "swahili_cities", value = 2 }]
reply = "长官把名单从十七个名字改成了九个，改的时候一直问我金价。"

[tracks.chapters.choices.fail]
next = "b03_barreto_dies"
effects = [{ kind = "reputation", faction = "portugal", value = -2 }]
news = "石堡的书记在名单最后一行添上了一个基尔瓦人的名字，名字后面画了个问号。"

[[tracks.chapters.choices]]
