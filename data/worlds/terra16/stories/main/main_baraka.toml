# b01 要牛的人：历史现场（巴雷托的远征，1569—73）。窗口内没人插手，蒙克拉罗斯说服了巴雷托。
[[tracks.chapters]]
key = "b01_barreto"
title = "要牛的人"
text = "莫桑比克岛对岸的椰林里，巴雷托的营帐一排排搭开，马一匹接一匹倒在热里。帐门口挂着一张葡萄牙人画的图：一个戴王冠的黑人国王坐在一座金山上，旁边写着“莫诺莫塔帕”。随军的耶稣会士蒙克拉罗斯要走赞比西河，说要先替死在河里的西尔韦拉讨个公道。巴雷托要一个认得金市、会称穆塔帕砝码的人，还要牛。他指着图上的两条路问我：“哪条路上摩尔人多？”我听出来了，他要我替他数的是人头。巴雷托：“牛要多少头，你直说。我只信数得清的东西。”我（心里）：图上的金山画得比整个基尔瓦还大，画图的人一辈子没见过金子是怎么从山里出来的。"
window = [[1569, 9, 1], [1570, 12, 31]]
at = "mozambique_island"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["francisco_barreto"]
news = "莫桑比克岛对岸，巴雷托的人马一匹接一匹倒在热里，营里天天吵走哪条路去穆塔帕。"

[tracks.chapters.default]
next = "b02_sena"
effects = []
news = "莫桑比克岛上的人说，神父吵赢了，巴雷托的远征军要走赞比西河。"

[[tracks.chapters.choices]]
key = "guide_old_road"
text = "做向导，领他们走索法拉那条老商路"
next = "b02_sena"
effects = [{ kind = "cash", value = 2000 }, { kind = "reputation", faction = "portugal", value = 4 }, { kind = "reputation", faction = "mutapa", value = -4 }, { kind = "flag", flag = "c13_main_baraka_guided_barreto" }]
reply = "他当场付了一半定钱。牛我替他买齐了。每买一头，卖牛的村子就多问一句：这些人要去哪里。"

[[tracks.chapters.choices]]
key = "river_road"
text = "替他画一张图，画的是神父最爱走的那条河路"
next = "b02_sena"
check = { attr = "intrigue", base = 20, per = 7 }
effects = [{ kind = "reputation", faction = "mutapa", value = 3 }, { kind = "flag", flag = "c13_main_baraka_misled" }]
reply = "蒙克拉罗斯看了我的图，连声说好。河路上船走得慢，热病走得快。这一路碰不到索法拉的金市。"

[tracks.chapters.choices.fail]
next = "b02_sena"
effects = [{ kind = "reputation", faction = "portugal", value = -3 }]
news = "营地里的人说，基尔瓦来的金商画的河路图，被巴雷托翻过来看了背面，以后再没找过他。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不去：金商不给兵带路"
next = "b02_sena"
effects = [{ kind = "reputation", faction = "swahili_cities", value = 2 }, { kind = "growth", attr = "honor", value = 200 }]
reply = "巴雷托不生气，只说：“记住今天。等我们找到金矿，金价就不由你们说了。”我说那我先记下今天的金价。"

[[tracks.chapters.variants]]
key = "told"
when = [{ kind = "flag", flag = "c13_main_baraka_told_portuguese" }]
text = "莫桑比克岛对岸，巴雷托的营帐一排排搭开，马一匹接一匹倒在热里。帐门口挂着一张葡萄牙人画的图：一个戴王冠的黑人国王坐在一座金山上，旁边写着“莫诺莫塔帕”。随军的耶稣会士蒙克拉罗斯要走赞比西河，说要先替死在河里的西尔韦拉讨个公道。巴雷托要一个认得金市、会称穆塔帕砝码的人，还要牛。他指着图上的两条路问我：“哪条路上摩尔人多？”我听出来了，他要我替他数的是人头。巴雷托认得我：“神父的死讯，是你头一个送到岛上的。”他把这当成一句夸奖。巴雷托：“牛要多少头，你直说。我只信数得清的东西。”我（心里）：图上的金山画得比整个基尔瓦还大，画图的人一辈子没见过金子是怎么从山里出来的。"

# b02 塞纳来的船：历史现场（1572，塞纳的摩尔商人被处死，只写结果）。
[[tracks.chapters]]
key = "b02_sena"
title = "塞纳来的船"
text = "1572 年旱季，索法拉。赞比西河那边下来几条船，船上全是女人和孩子。塞纳的摩尔商人被巴雷托的人处死了，说是他们毒死了远征军的马。船头放着一架铜秤，一只秤盘被砍掉了。石堡的长官接到命令，要把索法拉所有的摩尔商人列一张名单。抱着秤的女人走上岸来，看见我腰间的砝码箱，停住了。她认出箱盖里侧的刻记：这架秤，是她丈夫从萨利姆手里买的。她说：“这只盘子是他们砍的。另一只，我留着称我们剩下的东西。”我（心里）：父亲卖出去的秤，回来了一半。"
window = [[1571, 12, 1], [1572, 8, 31]]
at = "sofala"
stage = "involve"
speaker = "captain"
mood = "sad"
cast = ["francisco_barreto"]
news = "索法拉的人说，塞纳的摩尔商人被巴雷托的人处死了，说是他们毒死了远征军的马。"

[tracks.chapters.default]
next = "b03_barreto_dies"
effects = []
news = "索法拉石堡的名单送到了巴雷托手里，从塞纳逃下来的女人孩子在海边散了。"

[[tracks.chapters.choices]]
key = "hide"
text = "把人藏进船舱，趁夜往北开"
next = "b03_barreto_dies"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "portugal", value = -4 }, { kind = "reputation", faction = "swahili_cities", value = 4 }, { kind = "flag", flag = "c13_main_baraka_sheltered_sena" }]
reply = "六十多个人挤在象牙和米袋中间，孩子不许哭，就含着椰子肉。天亮时船过了索法拉的沙洲，那个女人才把那半架秤放下来。"
news = "索法拉的人说，从塞纳逃下来的女人孩子一夜之间不见了，第二天有条基尔瓦的船吃水深得出奇。"

[[tracks.chapters.choices]]
key = "plead"
text = "去石堡替他们说情，把名单改短"
next = "b03_barreto_dies"
