effects = [{ kind = "item", item = "emerald_mark_solomon", qty = 1 }, { kind = "flag", flag = "c13_mark_solomon" }, { kind = "growth", attr = "learning", value = 200 }]
reply = "描了两份，一份留给自己，一份留给给你另一半的人。合起来的那一张，比两张描本都轻。"

[[tracks.chapters.variants]]
key = "baraka"
when = [{ kind = "flag", flag = "c13_main_baraka" }]
speaker = "captain"
text = "两张拓纸凑齐了：一张拓自大津巴布韦的门楣，一张拓自渔夫铜瓶的铅封。纳吉玛的铅封拓纸随季风船到了，我把它跟门铭并排摊开，嘴里还在跟她不在场地吵。铅封上的印正好补上门铭缺的那一截。据说拿着这枚印的人，能让山里的灵都听话。灯芯爆了个花。我说：“纳吉玛要是在，准说是她的瓶子先到的。”"

[[tracks.chapters.variants]]
