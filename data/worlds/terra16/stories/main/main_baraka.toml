# k1 毡子底下：利昂戈把秘密告诉儿子。读养成期 n7 的回信。
[[tracks.chapters]]
key = "k1_bottom"
title = "毡子底下"
text = "从索法拉回来，父亲已经不大下楼了，咳得夜里要坐着睡。他把我叫到秤房，从腰带里摸出那块缝着红线的羊皮：“箱子交给你那天，我把这一枚留下了。”羊皮解开，那枚砝码躺在他掌心里，刻着十，分量只有九成半。“只用在下山卖金的人身上。头一回是你娘咳血那年，后来是你的书，后来是这个屋顶。”他看着我，“利昂戈把铜针交给儿子，是因为他累了。我也累了。”"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1557, 4, 1] }]
at = "kilwa"
speaker = "captain"
mood = "tender"
cast = ["baraka"]
deadline = [1557, 12, 31]

[[tracks.chapters.choices]]
key = "take"
text = "接过来：这一枚以后归我管"
next = "k2_kati"
effects = [{ kind = "flag", flag = "rw_baraka_k_took" }, { kind = "growth", attr = "resolve", value = 150 }]
reply = "我把那一枚接过来，连羊皮一起塞进腰带。父亲松了一口气，像卸下一包金砂，又咳了很久。“归你管，”他说，“用不用也归你。”那天夜里他睡得很沉，我在秤房坐到天亮，腰带里那一点分量，比整箱砝码还沉。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不接：您用的，您自己收着"
next = "k2_kati"
effects = [{ kind = "flag", flag = "rw_baraka_k_refused" }, { kind = "growth", attr = "honor", value = 100 }]
reply = "我把他的手合上，连那一枚一起。“您用的，您收着。”父亲看着自己的拳头，笑了一声：“利昂戈的儿子要是像你，他就死不了了。”他把羊皮包塞回腰带，拍了两下，“可我还是会死的。”"

[[tracks.chapters.choices]]
key = "ask_kati"
text = "问他：卡蒂知道吗"
next = "k2_kati"
effects = [{ kind = "flag", flag = "rw_baraka_k_asked_kati" }]
reply = "“卡蒂？”父亲想了一会儿才想起是谁，“他爷爷信了我二十年。他爷爷不看秤，看我的脸。”他把那一枚放上秤盘，自己盯着横梁：“我这张脸，比这一枚还轻。”卡蒂知不知道，他没答，我也没再问。"

[tracks.chapters.timeout]
next = "k2_kati"
effects = []
news = "基尔瓦的人说，金商萨利姆今年没下过码头，秤房交给了从开罗回来的儿子。"

[[tracks.chapters.variants]]
key = "rw_know"
when = [{ kind = "flag", flag = "rw_baraka_needle_know", value = true }]
text = "从索法拉回来，父亲已经不大下楼了，咳得夜里要坐着睡。他把我叫到秤房，从腰带里摸出那块缝着红线的羊皮：“箱子交给你那天，我把这一枚留下了。”羊皮解开，那枚砝码躺在他掌心里，刻着十，分量只有九成半。“只用在下山卖金的人身上。头一回是你娘咳血那年，后来是你的书，后来是这个屋顶。”他看着我，“你信里说你已经知道。你知道得比我早，我是用了十年才知道它有多轻。利昂戈把铜针交给儿子，是因为他累了。我也累了。”"

[[tracks.chapters.variants]]
key = "rw_mute"
when = [{ kind = "flag", flag = "rw_baraka_needle_mute", value = true }]
text = "从索法拉回来，父亲已经不大下楼了，咳得夜里要坐着睡。他把我叫到秤房，从腰带里摸出那块缝着红线的羊皮：“箱子交给你那天，我把这一枚留下了。”羊皮解开，那枚砝码躺在他掌心里，刻着十，分量只有九成半。“只用在下山卖金的人身上。头一回是你娘咳血那年，后来是你的书，后来是这个屋顶。”他看着我，“我在信里说当面讲，你回信一个字也没提它。你像我。利昂戈把铜针交给儿子，是因为他累了。我也累了。”"

[[tracks.chapters.variants]]
key = "rw_wait"
when = [{ kind = "flag", flag = "rw_baraka_needle_wait", value = true }]
text = "从索法拉回来，父亲已经不大下楼了，咳得夜里要坐着睡。他把我叫到秤房，从腰带里摸出那块缝着红线的羊皮：“箱子交给你那天，我把这一枚留下了。”羊皮解开，那枚砝码躺在他掌心里，刻着十，分量只有九成半。“只用在下山卖金的人身上。头一回是你娘咳血那年，后来是你的书，后来是这个屋顶。”他看着我，“你说等你回来，叫我慢慢讲。我没力气慢慢讲了，就这几句。利昂戈把铜针交给儿子，是因为他累了。我也累了。”"

# k2 卡蒂下山：用还是不用。差额照算要钱（requires 现金，带 hint）。
[[tracks.chapters]]
key = "k2_kati"
title = "卡蒂下山"
text = "旱季，内陆的商队又下到海边。卡蒂十五了，个子快跟我一般高，背上的芭蕉叶包比他爷爷那时候的还大。他把金砂放在秤房的木台上，没看我的脸，先看秤杆，眼睛跟着横梁走。父亲坐在里屋的门帘后头，我听得见他压着嗓子咳，咳两声，停一停，像在提醒我什么。卡蒂说：“我爷爷说你们家的秤是老的。”他把手搭在台边，等我拿砝码。那一枚在哪儿，我和父亲都知道。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1558, 9, 1] }]
at = "kilwa"
speaker = "captain"
mood = "tense"
cast = ["baraka"]
deadline = [1559, 12, 31]

[[tracks.chapters.choices]]
key = "use"
text = "用那一枚，照父亲这些年的规矩"
next = "k3_clerk"
effects = [{ kind = "cash", value = 800 }, { kind = "flag", flag = "rw_baraka_k_used" }]
reply = "横梁停在老地方。卡蒂数了数刻线，点点头，把金砂倒进我的袋子。我给他讲了个海龟借水的笑话，他笑了，笑得跟他爷爷一模一样。门帘后头的咳嗽停了。那一季，萨利姆家的金子比哪一年都多。"

[[tracks.chapters.choices]]
key = "true"
text = "用刻字清楚的那一枚"
next = "k3_clerk"
effects = [{ kind = "cash", value = 400 }, { kind = "flag", flag = "rw_baraka_k_true" }]
reply = "横梁朝卡蒂那一边沉下去一点。卡蒂没觉出什么，他从没见过别的数。我照横梁付了钱，多出的那一点，他揣进怀里，说今年的布能多换两匹。门帘后头，父亲很久没咳。晚饭的时候他说：“往后你称，我不听了。”"

[[tracks.chapters.choices]]
key = "repay"
text = "称准，再把这些年的差额算给他"
next = "k3_clerk"
requires = [{ kind = "cash", ge = 1000 }]
hint = "这些年的差额，袋里的钱还填不上。"
effects = [{ kind = "cash", value = -1000 }, { kind = "reputation", faction = "mutapa", value = 2 }, { kind = "flag", flag = "rw_baraka_k_repaid" }]
reply = "我称准了，又搬出父亲的旧账，一年一年算给他看，算到他爷爷头一回下山那年。卡蒂听完，像被人当胸推了一把。他把钱收下，一枚一枚数，数完问：“我爷爷知道吗？”门帘后头，父亲替我答了：“他不知道。他信我。”"

[tracks.chapters.timeout]
next = "k3_clerk"
effects = []
news = "内陆下来的卖金人说，基尔瓦萨利姆家的秤，今年换了一双手。"

[[tracks.chapters.variants]]
key = "rw_taught"
when = [{ kind = "flag", flag = "rw_baraka_needle_teach_boy", value = true }]
text = "旱季，内陆的商队又下到海边。卡蒂十五了，个子快跟我一般高，背上的芭蕉叶包比他爷爷那时候的还大。他把金砂放在秤房的木台上，没看我的脸，先看秤杆，一格一格数刻线——那些刻线，是我隔着一片海托姑母教给他的。父亲坐在里屋的门帘后头，压着嗓子咳，咳两声，停一停，像在提醒我什么。卡蒂说：“我爷爷说你们家的秤是老的。”他把手搭在台边，等我拿砝码。那一枚在哪儿，我和父亲都知道。"

# k3 书记要的证物：敌人许给儿子一样东西。西尔韦拉死后，石堡把这桩死算在海边摩尔商人头上（a04）。
[[tracks.chapters]]
key = "k3_clerk"
title = "书记要的证物"
text = "神父死后，索法拉石堡里的人写了一份又一份给国王的报告，说穆塔帕的王是被海边的摩尔商人挑唆的。堡里的书记找到我，请我喝了一杯葡萄牙酒。他说里斯本还要一样东西：摩尔人怎样骗内陆卖金人的证据，最好是一枚亲手拿出来的假砝码。“你给我一枚，你家的名字就不上名单。你父亲的老伙计们，我管不了。”他说话很客气，酒杯一直没放下。我（心里）：利昂戈的儿子，也是有人许了他一样东西。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1561, 9, 1] }]
at = "sofala"
speaker = "captain"
mood = "tense"
cast = ["baraka"]
deadline = [1562, 8, 31]

[[tracks.chapters.choices]]
key = "give"
text = "把那一枚交给书记"
next = "k4_threshold"
effects = [{ kind = "reputation", faction = "portugal", value = 3 }, { kind = "reputation", faction = "swahili_cities", value = -3 }, { kind = "flag", flag = "rw_baraka_k_gave_clerk" }]
reply = "我把羊皮包放在他的酒杯旁边。书记打开看了很久，在本子上描下它的样子，写上分量，又写上“基尔瓦的摩尔人”。他没写萨利姆，他说话算话。回基尔瓦的船上，我给水手讲了一路笑话，讲到最后一个，我自己先停了。"

[[tracks.chapters.choices]]
key = "deny"
text = "说海边的秤没有那样的东西"
next = "k4_threshold"
effects = [{ kind = "reputation", faction = "swahili_cities", value = 1 }, { kind = "flag", flag = "rw_baraka_k_denied" }]
reply = "我说海边的秤是老的，砝码也是老的，老东西磨轻了，不算骗。书记笑了，说我父亲教得好。他把酒喝完。第二天，名单上多了两个父亲老伙计的名字。是不是因为我，我没去问。"

[[tracks.chapters.choices]]
key = "tell_father"
text = "回去把书记的话原样告诉父亲"
next = "k4_threshold"
effects = [{ kind = "flag", flag = "rw_baraka_k_told_father" }]
reply = "父亲靠在墙上闭着眼，过了很久才开口：“他许你什么？”我说许我家的名字。父亲说：“那你回他：萨利姆家的名字，不值一枚砝码。”说完他自己笑了，笑得又咳起来，“这话是我年轻时候说的。说完没几年，我就用上了它，一用二十年。”"

[tracks.chapters.timeout]
next = "k4_threshold"
effects = []
news = "索法拉石堡的报告送去了里斯本，听说里头附了一张砝码的图。"

[[tracks.chapters.variants]]
key = "rw_hid"
when = [{ kind = "flag", flag = "c13_main_baraka_hid_traders" }]
text = "神父死后，索法拉石堡里的人写了一份又一份给国王的报告，说穆塔帕的王是被海边的摩尔商人挑唆的。堡里的书记找到我，请我喝了一杯葡萄牙酒：“你把几个摩尔人藏进象牙堆里，长官记得。”他说里斯本还要一样东西：摩尔人怎样骗内陆卖金人的证据，最好是一枚亲手拿出来的假砝码。“你给我一枚，这笔旧账就算了，你家的名字也不上名单。”他说话很客气，酒杯一直没放下。我（心里）：利昂戈的儿子，也是有人许了他一样东西。"

[[tracks.chapters.variants]]
key = "rw_told"
when = [{ kind = "flag", flag = "c13_main_baraka_told_portuguese" }]
text = "神父死后，索法拉石堡里的人写了一份又一份给国王的报告，说穆塔帕的王是被海边的摩尔商人挑唆的。堡里的书记找到我，请我喝了一杯葡萄牙酒：“神父死的消息，岛上是从你的船上听来的。长官记得你。”他说里斯本还要一样东西：摩尔人怎样骗内陆卖金人的证据，最好是一枚亲手拿出来的假砝码。“你给我一枚，你家的名字就不上名单。”他说话很客气，酒杯一直没放下。我（心里）：利昂戈的儿子，也是有人许了他一样东西。"

# k4 秤房的门槛：萨利姆死（1563 年 10 月）。像利昂戈死在井边，一整天没人敢进去。
[[tracks.chapters]]
key = "k4_threshold"
title = "秤房的门槛"
text = "十月，父亲死了。他死在秤房的门槛上，背靠着门框，一只手搭在秤杆上，秤盘里还压着半包金砂。码头上来来去去的人都看见了，都以为萨利姆又在等谁先开价，没人敢进去打扰，从早上一直到太阳偏西。是姑母去叫他吃饭，站在门口跟他说了两句话，他没应，她才走过去。我的船是第二天靠的岸。姆泽说，利昂戈也是这样，在井边跪着，三天没人敢去打水。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1563, 10, 12] }]
at = "kilwa"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
deadline = [1563, 12, 31]

[[tracks.chapters.choices]]
key = "finish"
text = "先把秤盘里那半包称完"
next = "k5_last_song"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_baraka_k_finished" }]
reply = "我跪在他旁边，把那半包金砂称完。横梁上压着的砝码刻字清清楚楚，不是羊皮里那一枚。他最后一回称金，用的是准的。我把数记进账，记在他的名字底下，然后才去扶他。"

[[tracks.chapters.choices]]
key = "hand"
text = "替他把手从秤杆上拿下来"
next = "k5_last_song"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_baraka_k_hand" }]
reply = "他的手已经僵了，我一根一根掰开他的指头。秤杆上有他攥出来的一道亮印子，三十年攥出来的。姑母在我身后说：“轻点，他怕疼。”她从来没说过他怕疼。"

[[tracks.chapters.choices]]
key = "sit"
text = "挨着他坐下，等到天黑再叫人"
next = "k5_last_song"
effects = [{ kind = "skill", skill = "poetry", value = 40 }, { kind = "flag", flag = "rw_baraka_k_sat" }]
reply = "我在门槛上挨着他坐下，像小时候等他收秤。码头上的人还是不进来，他们现在知道了，可还是不进来。天黑了，姆泽拄着拐杖来，站在门外唱了一段利昂戈，唱完说：“好了，可以进去了。”这才有人进来抬他。"

[tracks.chapters.timeout]
next = "k5_last_song"
effects = []
news = "基尔瓦的人说，金商萨利姆死在自家秤房的门槛上，手还搭在秤杆上，过路的人一整天都以为他在等人开价。"

[[tracks.chapters.variants]]
key = "rw_repaid"
when = [{ kind = "flag", flag = "rw_baraka_k_repaid", value = true }]
text = "十月，父亲死了。他死在秤房的门槛上，背靠着门框，一只手搭在秤杆上，秤盘里还压着半包金砂，是卡蒂今年带下山的。码头上来来去去的人都看见了，都以为萨利姆又在等谁先开价，没人敢进去打扰，从早上一直到太阳偏西。是姑母去叫他吃饭，站在门口跟他说了两句话，他没应，她才走过去。我的船是第二天靠的岸。姆泽说，利昂戈也是这样，在井边跪着，三天没人敢去打水。"

# k5 姆泽唱的第三遍：老诗人死（1567 年）。读养成期 n5 对“儿子那一段”的回答。
[[tracks.chapters]]
key = "k5_last_song"
title = "姆泽唱的第三遍"
text = "姆泽躺在椰荫下的席子上，已经起不来了，嗓子只剩一缕气。他叫我把耳朵凑过去，要唱利昂戈的最后一段，说这是第三遍，给他自己的。他唱铜针，唱井，唱跪着的弓。唱到儿子，他停了很久。“你爹的事，我知道。”他说，“基尔瓦唱歌的人什么都知道，只是不唱。”"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1567, 2, 1] }]
at = "kilwa"
speaker = "captain"
mood = "mystic"
cast = ["baraka"]
deadline = [1567, 12, 31]

[[tracks.chapters.choices]]
key = "write"
text = "拿出纸，他唱一句，我记一句"
next = "k6_where"
effects = [{ kind = "growth", attr = "learning", value = 150 }, { kind = "flag", flag = "rw_baraka_k_mze_written" }, { kind = "flag", flag = "rw_baraka_mze_gone" }]
reply = "他唱一句，我记一句。记到儿子那一行，他唱的是：针是父亲给的，手是儿子的，两样都记着。唱完他问我记下没有。我说记下了。他说：“好，这一段我不唱了。”那是他说的最后一句整话。"

[[tracks.chapters.choices]]
key = "listen"
text = "不记，只听，听完背给他"
next = "k6_where"
effects = [{ kind = "skill", skill = "poetry", value = 60 }, { kind = "flag", flag = "rw_baraka_k_mze_heard" }, { kind = "flag", flag = "rw_baraka_mze_gone" }]
reply = "我没拿纸。他唱完，我从头背了一遍，背到马菲亚后面那一段，他拿指头敲了一下席子，是我念错了一个音。我改过来，他才把手放下。那天夜里，他就走了。"

[[tracks.chapters.choices]]
key = "sing"
text = "替他唱：葡萄牙人来的那年，有人跑了"
next = "k6_where"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_baraka_k_mze_sang" }, { kind = "flag", flag = "rw_baraka_mze_gone" }]
reply = "我替他唱了那一句，他的调子，我的词：船进港那天，有个孩子跑进红树林，丢了一只鞋，活了下来，后来唱了五十年歌。他闭着眼听，嘴角动了动，像在跟着唱，又像在骂我。"

[tracks.chapters.timeout]
next = "k6_where"
effects = [{ kind = "flag", flag = "rw_baraka_mze_gone" }]
news = "基尔瓦的人说，唱了一辈子老地名的姆泽死了，死前三天还在码头的石凳上坐着。"

[[tracks.chapters.variants]]
key = "rw_forgiven"
when = [{ kind = "flag", flag = "rw_baraka_son_forgiven", value = true }]
text = "姆泽躺在椰荫下的席子上，已经起不来了，嗓子只剩一缕气。他叫我把耳朵凑过去，要唱利昂戈的最后一段，说这是第三遍，给他自己的。他唱铜针，唱井，唱跪着的弓。唱到儿子，他停了很久。“你在开罗画的那个圈，我想了十年，还是画不圆。你爹的事，我知道。基尔瓦唱歌的人什么都知道，只是不唱。”"

