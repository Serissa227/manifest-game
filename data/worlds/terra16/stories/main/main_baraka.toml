# c07 法扎的烟：历史现场（1587，果阿来的船报复法扎）。指挥官与月份待核，正文只写“果阿来的船”。
[[tracks.chapters]]
key = "c07_faza"
title = "法扎的烟"
text = "1587 年初，帕泰岛。果阿派来的葡萄牙船队来清算去年向米尔·阿里献过礼的城。法扎的城墙被炮轰塌了一角，椰林烧了半边，城主被带上旗舰，再没下来。帕泰城的长老派人到港口找我，说基尔瓦萨利姆家的人，在这条海岸上说得上话。葡萄牙船长手里有一张名单。他问：“去年那条土耳其船来的时候，谁给它送了水？”帕泰的长老看着我，说：“你讲过七条船。现在烧的是第六条。”"
window = [[1587, 1, 15], [1587, 4, 15]]
at = "pate"
stage = "involve"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
news = "帕泰岛上的人说，果阿来的船把法扎的城墙轰塌了一角，城主上了旗舰就没再下来。"

[tracks.chapters.default]
next = "c08_zimba_kilwa"
effects = []
news = "法扎烧成了一片灰，帕泰和北边几座城的使者，都给果阿来的船送去了贡品。"

[[tracks.chapters.choices]]
key = "rescue"
text = "带船去法扎的海湾接人"
next = "c08_zimba_kilwa"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "portugal", value = -3 }, { kind = "flag", flag = "c13_main_baraka_faza_saved" }]
reply = "法扎的海湾水浅，大船进不来，我的姆泰佩进得来。接了四趟，最后一趟上来一个老织工，怀里抱着一卷没织完的布。"
news = "帕泰岛上的人说，法扎烧起来那天，有条基尔瓦的缝合船在浅湾里来回跑了四趟。"

[[tracks.chapters.choices]]
key = "ransom"
text = "上旗舰去谈：用基尔瓦的金子赎帕泰的长老"
next = "c08_zimba_kilwa"
requires = [{ kind = "cash", ge = 2500 }]
hint = "旗舰上的人只收称得出分量的东西。"
effects = [{ kind = "cash", value = -2500 }, { kind = "reputation", faction = "swahili_cities", value = 4 }]
reply = "船长把我的金子过了秤，过得很仔细，像个金商。长老下船的时候没看我，他说赎回来的人不该先谢赎他的人，该先谢称金子的秤。"

[[tracks.chapters.choices]]
key = "record"
text = "一个字不改地把今天写进史书"
next = "c08_zimba_kilwa"
requires = [{ kind = "flag", flag = "c13_main_baraka_history_begun" }]
hint = "你从没动笔写过诸城的事。"
effects = [{ kind = "growth", attr = "learning", value = 200 }, { kind = "reputation", faction = "swahili_cities", value = 1 }]
reply = "我写下烟往哪边飘，写下船长名单上的名字，写下我站在哪里、什么也没做。父亲页边那个“不对”，这回该写在我自己的名字旁边。"

[[tracks.chapters.variants]]
key = "goa"
when = [{ kind = "flag", flag = "c13_main_baraka_warned_goa" }]
text = "1587 年初，帕泰岛。果阿派来的葡萄牙船队来清算去年向米尔·阿里献过礼的城。法扎的城墙被炮轰塌了一角，椰林烧了半边，城主被带上旗舰，再没下来。帕泰城的长老派人到港口找我，说基尔瓦萨利姆家的人，在这条海岸上说得上话。葡萄牙船长认出了我，向我道谢：“去年那封信，来得正是时候。”这比挨骂还难受。他手里有一张名单。他问：“去年那条土耳其船来的时候，谁给它送了水？”帕泰的长老看着我，说：“你讲过七条船。现在烧的是第六条。”"

[[tracks.chapters.variants]]
