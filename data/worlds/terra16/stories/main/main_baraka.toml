# ───────────── 旁轨（剧情增写 2026-11-12，Claude）：铜针（父亲萨利姆，1557 年到他死后，6 章） ─────────────
# 母本：斯瓦希里史诗《利昂戈·富莫》——刀枪不入的英雄把唯一能杀死他的铜针告诉了亲生儿子；敌人许了儿子一样东西（k3 石堡的书记）；英雄死后跪在井边，城里三天没人敢去打水（k4 秤房的门槛）。
# 文化：斯瓦希里城邦的商业与体面；对内陆卖金人的轻慢藏在一枚砝码里。张力：萨利姆的爱是真的，他的富也是真的，两样都有一丝一丝称出来的那一部分；巴拉卡接过来以后用还是不用。
# 入口：c13_main_baraka（a00 default 设）加日期；k6 读 _act3（c01 必设）。各章有期限与 timeout，k6 是终章（next = done）。
# 人物的死：萨利姆死于 1563 年 10 月（k4；a06 从 1564 年起写下葬第四十天，k4 期限截在 1563 年底）；姆泽死于 1567 年（k5；在 a06 的期限 1566-10-31 以后）。
# 约定：a00—b08 不提马库阿男孩（c01 的秘密），k6 在 _act3 以后才提箱里“最小的那一枚”；不写恋爱；口头禅 Haba na haba 不在旁轨里出现。
# 读：rw_baraka_needle_know / _wait / _mute（养成·铜针 n7，k1 变体）、rw_baraka_needle_teach_boy（n6，k2 变体）、rw_baraka_son_guilty / _forgiven / _town（养成·利昂戈的井 n5，k5 变体）、
#     c13_main_baraka_told_portuguese / _hid_traders（a04，k3 变体）。
# 设：rw_baraka_k_took / _refused / _asked_kati（k1）、_used / _true / _repaid（k2）、_gave_clerk / _denied / _told_father（k3）、_finished / _hand / _sat（k4）、
#     _mze_written / _mze_heard / _mze_sang 与 rw_baraka_mze_gone（k5，timeout 也设 mze_gone）、rw_baraka_needle_end_written / _end_told / _end_blank（k6）。
