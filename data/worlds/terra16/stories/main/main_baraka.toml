# a05 金市的门：限期交货（布 20 匹），献布的规矩。
[[tracks.chapters]]
key = "a05_gold_door"
title = "金市的门"
text = "金市关着，雨季又过去一回。恩科西带来王的话：海边的人要重新进金市，得先献上二十匹好布，要坎贝织的厚布，葡萄牙船运来的薄布不算。献布那天，王的收布人坐在一张豹皮上，旁边插着一支长矛。恩科西当着我的面从布边抽出一根线，用牙咬，看断不断。收布人摸着布，慢慢开口：“海边的人，先拍手，再说话。”恩科西在我耳边小声说：“伏得低一点。他眼睛不好，看不见你，就当你没伏。”我（心里）：在开罗我跪过讲席，在这里我伏在豹皮前，两样都是为了让人肯开口。收布人又说：“布是好布。可去年说我们王是凶手的，也是海边的嘴。”"
at = "sofala"
