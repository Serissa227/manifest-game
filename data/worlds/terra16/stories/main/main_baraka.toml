# b04 坎贝的花布：限期交货（坎贝花布 20 匹），门长与王的收布人。
[[tracks.chapters]]
key = "b04_fairs"
title = "坎贝的花布"
text = "葡萄牙人终于摸到了马尼卡的金市：集市边插着他们的旗，门口坐着一个“门长”，每个进市的人先交一份布。穆塔帕王的收布人照旧收王的那一份。恩科西从王城下来，他已经是信使里的老资格了，鞋还是那双旧的。内陆人只认坎贝的花布，一匹花布的纹样能讲一个故事：绕三圈的是河，带点的是星。收布人一匹一匹翻看，翻到一匹带星点的，停下来问我是谁织的、在哪里买的。他要听的，是葡萄牙人还要往里走多远。门长先开口：“先交布，再进门。葡萄牙国王的门，不讲价。”恩科西冷笑：“王的门也讲价，拿规矩讲。”我（心里）：两扇门，一扇比一扇老。"
at = "sofala"
speaker = "captain"
mood = "cheerful"
cast = ["nkosi"]
objectives = [{ kind = "goods", good = "calico", qty = 20, at = "sofala", text = "从坎贝运二十匹花布到索法拉，内陆的金市只认这种布" }]
