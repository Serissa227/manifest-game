[[tracks.chapters.choices]]
key = "sell_rice"
text = "米照岛上的价卖给商站，只给诗人留一袋"
next = "b01_barreto"
effects = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "cash", value = 1200 }, { kind = "affinity", person = "luis_de_camoes", value = 3 }]
reply = "商站管事数钱的时候嫌我心软。那袋米卡蒙斯扛不动，是我替他扛进酒馆的，他在后面念了一路诗，算是付脚钱。"

[[tracks.chapters.choices]]
key = "give_rice"
text = "米全分给等船的人，只求他记住一个基尔瓦人的名字"
next = "b01_barreto"
effects = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "growth", attr = "honor", value = 200 }, { kind = "fame", value = 2 }, { kind = "affinity", person = "luis_de_camoes", value = 10 }]
reply = "他把我的名字念了三遍，念得像个葡萄牙名字。“诗里没有你的位置，”他说，“可我欠你一顿饭，这一顿我记着。”"
news = "莫桑比克岛上等船的人说，有个基尔瓦金商把一船米全分了，只要那个独眼诗人记住他的名字。"

[[tracks.chapters.variants]]
key = "rw_mze"
when = [{ kind = "flag", flag = "rw_baraka_mze_gone" }, { kind = "flag", flag = "c7_bond_zubayda_landing_friend", value = false }, { kind = "flag", flag = "c7_bond_zubayda_landing_love", value = false }]
text = "莫桑比克岛，等风的季节。岛上挤着两百来个等船回葡萄牙的人，米价一天一变，米在蒙巴萨、马林迪、桑给巴尔都买得到。小教堂边的酒馆里，一个独眼的葡萄牙人胳膊底下压着一卷油布包的诗稿，他说湄公河口沉船那回，他一只手划水，一只手把这卷诗举过头顶。他写的是达·伽马的航海，里面有蒙巴萨，也有马林迪。“米我收下。诗你得听完，不许中途走。”他念到蒙巴萨：诗里的蒙巴萨国王奸诈，马林迪国王是好朋友。他问我：“你们那边的诗人，管我们葡萄牙人叫什么？”我告诉了他。那个词，姆泽老人临死前还在席子上唱过。他大笑，说这一句他死也不写进去。我说：“蒙巴萨的国王要是听见这一段，会请你吃一顿饭，吃完再把你扔下海。”我（心里）：外人写我们，一个写成账，一个写成诗；账还能改，诗改不动。"

[[tracks.chapters.variants]]
key = "zubayda_friend"
when = [{ kind = "flag", flag = "c7_bond_zubayda_landing_friend" }]
