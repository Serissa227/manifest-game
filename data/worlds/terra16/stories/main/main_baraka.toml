# c08 退潮的浅滩：目击（1587，津巴人与基尔瓦）。不写屠杀与食人。
[[tracks.chapters]]
key = "c08_zimba_kilwa"
title = "退潮的浅滩"
text = "南边来的津巴人围了基尔瓦好些天，过不了海峡。后来城里有人替他们带路，趁退潮从浅滩涉了过来。我赶到的时候，潮又涨了，浅滩只剩一道水痕。清真寺东墙塌了一截，墙外父母的坟还在。岸上的渔夫直说：“潮退了，他们就过来了。潮涨了，他们就不走了。”我站在岸上讲了一个又一个笑话，讲给谁听，我自己也不知道。带路的那个人，津巴的首领没有留他。我（心里）：父亲，母亲，你们那边的潮，退得没这么快吧。"
window = [[1587, 5, 1], [1587, 9, 30]]
at = "kilwa"
stage = "witness"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
news = "基尔瓦的人说，津巴人是趁退潮从浅滩涉过来的，带路的是城里的人。"

