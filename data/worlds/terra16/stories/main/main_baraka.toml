# c06 一条船的苏丹：历史现场（1586，米尔·阿里南下）。纳吉玛在蒙巴萨码头重逢。
[[tracks.chapters]]
key = "c06_mir_ali"
title = "一条船的苏丹"
text = "1586 年初，东北季风里，一条挂奥斯曼旗的桨帆船开进蒙巴萨港，只有一条。船长米尔·阿里·贝伊站在船头，说苏丹的舰队就在后面。北边的摩加迪沙、帕泰、拉穆已经派人去他船上献了礼。码头上我撞见了纳吉玛：她替一条阿曼船领航，刚靠岸，牵星板还攥在手里。她看了一眼他的船，心里算出他回程的风只剩一个月。米尔·阿里：“葡萄牙人一年来一回，我一个月就能把伊斯坦布尔的旗插满这条海岸。”纳吉玛：“他的船吃水太浅，装不下他说的那么多苏丹。”我（心里）：我跟她吵了三十年，头一回想听她把话说完。"
window = [[1586, 1, 1], [1586, 6, 30]]
at = "mombasa"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["mir_ali_bey", "najma"]
news = "蒙巴萨的人说，一条挂奥斯曼旗的桨帆船开进港来，船长说苏丹的舰队就在后头，大家数了数，只有一条。"

[tracks.chapters.default]
next = "c07_faza"
effects = []
news = "北边几座城都向那条奥斯曼船献了礼；米尔·阿里装了一船葡萄牙人的货和俘虏，回红海去了。"

[[tracks.chapters.choices]]
key = "ottoman"
text = "借奥斯曼之力：替米尔·阿里在诸城之间牵线"
next = "c07_faza"
effects = [{ kind = "reputation", faction = "ottoman", value = 5 }, { kind = "reputation", faction = "portugal", value = -5 }, { kind = "flag", flag = "c13_main_baraka_sided_ottoman" }]
reply = "我替他把蒙巴萨苏丹的话译成他爱听的样子，把他的话译成苏丹敢信的样子。纳吉玛在一旁看着，一句话也没说。这比她骂我还难受。"

[[tracks.chapters.choices]]
key = "stand"
text = "自己站起来：照马林迪的盟誓，谁也不投"
next = "c07_faza"
requires = [{ kind = "flag", flag = "c13_main_baraka_league_sworn" }]
hint = "没有当年那只铜盆，这句话没人接。"
effects = [{ kind = "reputation", faction = "swahili_cities", value = 5 }, { kind = "affinity", person = "najma", value = 4 }, { kind = "flag", flag = "c13_main_baraka_stood_alone" }]
reply = "我把那只铜盆的事讲给蒙巴萨的苏丹听。他说盟誓是好东西，可葡萄牙人不认。我说葡萄牙人也不认米尔·阿里，那我们至少认自己。纳吉玛说，这是她头一回听我讲完一句不带笑话的话。"

[[tracks.chapters.choices]]
key = "warn_goa"
text = "给果阿的葡萄牙人报信"
next = "c07_faza"
effects = [{ kind = "reputation", faction = "portugal", value = 5 }, { kind = "reputation", faction = "swahili_cities", value = -5 }, { kind = "flag", flag = "c13_main_baraka_warned_goa" }]
reply = "信是夜里写的，托一条去果阿的船。写完我把纸上的灰吹掉，吹了很久。纳吉玛第二天就走了，没跟我告别。"

