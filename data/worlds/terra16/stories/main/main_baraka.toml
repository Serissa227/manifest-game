# b08 彗星下的盟誓：目击（1577-10—12）。只有 b07 回应过才会走到这里。
[[tracks.chapters]]
key = "b08_oath"
title = "彗星下的盟誓"
text = "马林迪的海滩，入夜以后。天上拖着一条长尾巴的星，亮得能照见人影。盟誓的人用一只铜盆盛了海水，每座城的人往里放一样东西：基尔瓦放的是我父亲箱子里倒数第二小的那枚砝码。一个老水手坐在礁石上，望着彗星说：“彗星出来的年份，海那边有人在开会。”我说：“那他们开会也该请我们吃饭。”"
window = [[1577, 10, 15], [1577, 12, 31]]
at = "malindi"
stage = "witness"
speaker = "captain"
mood = "mystic"
cast = ["baraka"]
news = "马林迪的人说，彗星出来那几夜，几座城的人在海滩上往一只铜盆里放东西，说是要结盟。"

