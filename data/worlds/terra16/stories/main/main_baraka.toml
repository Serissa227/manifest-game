# k6 每一枚的去处：终章。_act3 以后才写箱里“最小的那一枚”。
[[tracks.chapters]]
key = "k6_where"
title = "每一枚的去处"
text = "这些年，父亲的砝码箱跟着我走了半个世界，里面的砝码少了几枚，最小的那一枚跟着一个马库阿男孩去了日本。夜里我把剩下的一枚枚摆出来，从大到小，像父亲当年在秤房里那样。摆到最后，空出来的那个位置是毡子底下那一枚的。它轻了半成，二十年里从下山卖金的人袋子里，一丝一丝称出了一剂药、一个屋顶、开罗的几年书。我写了二十年史书，这一页一直空着。"
when = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "date", from = [1584, 6, 1] }]
speaker = "captain"
mood = "tender"
cast = ["baraka"]

[[tracks.chapters.choices]]
key = "write"
text = "在史书里写下：这一枚轻了多少"
next = "done"
effects = [{ kind = "growth", attr = "learning", value = 100 }, { kind = "flag", flag = "rw_baraka_needle_end_written" }]
reply = "我写：基尔瓦金商萨利姆，箱底有一枚砝码，刻十，重九成半，用了二十年，用在下山卖金的人身上。写完我在旁边添上自己的名字，因为那一年我也拿过它。墨干了，这一页终于不空了。"

[[tracks.chapters.choices]]
key = "kati"
text = "去马尼卡找卡蒂，当面讲给他"
next = "done"
effects = [{ kind = "reputation", faction = "mutapa", value = 2 }, { kind = "flag", flag = "rw_baraka_needle_end_told" }]
reply = "我随商队上了马尼卡的金市，在门长的旗子底下找到了卡蒂，他的儿子已经能背金砂下山了。我把父亲的事从头讲了一遍，讲到羊皮上的红线。他听完，往我手里塞了一小撮金砂：“我爷爷要是在，会说算了。我不说算了，我说：你讲完了。”"

[[tracks.chapters.choices]]
key = "blank"
text = "这一页留着，给以后的人"
next = "done"
effects = [{ kind = "flag", flag = "rw_baraka_needle_end_blank" }]
reply = "我没写。史书里只写父亲死在秤房的门槛上，手还搭在秤杆上。轻的那一枚，留给以后翻到这一页的人自己去称。我合上书，给自己讲了个笑话，没讲完。"

[[tracks.chapters.variants]]
key = "rw_clerk"
when = [{ kind = "flag", flag = "rw_baraka_k_gave_clerk", value = true }]
text = "这些年，父亲的砝码箱跟着我走了半个世界，里面的砝码少了几枚，最小的那一枚跟着一个马库阿男孩去了日本。夜里我把剩下的一枚枚摆出来，从大到小，像父亲当年在秤房里那样。摆到最后，空出来的那个位置是毡子底下那一枚的，它在里斯本哪个柜子里，夹在一份说摩尔人如何骗人的报告中间。它轻了半成，二十年里一丝一丝称出了一剂药、一个屋顶、开罗的几年书。我写了二十年史书，这一页一直空着。"

[[tracks.chapters.variants]]
key = "rw_repaid"
when = [{ kind = "flag", flag = "rw_baraka_k_gave_clerk", value = false }, { kind = "flag", flag = "rw_baraka_k_repaid", value = true }]
text = "这些年，父亲的砝码箱跟着我走了半个世界，里面的砝码少了几枚，最小的那一枚跟着一个马库阿男孩去了日本。夜里我把剩下的一枚枚摆出来，从大到小，像父亲当年在秤房里那样。摆到最后，空出来的那个位置是毡子底下那一枚的。它轻了半成，二十年里称出了一剂药、一个屋顶、开罗的几年书；差额我算给了卡蒂，账是平了。卡蒂每年下山还来我的秤房，自己看刻线，自己报数。我写了二十年史书，这一页一直空着。"


# ───────────── 旁轨（剧情增写 2026-11-12，Claude）：河边的兵（流放兵迪奥戈与耶稣会士蒙克拉罗斯，1561—1581，7 章，含掷骰失败的一章） ─────────────
# 母本：《忏悔录》第八卷的花园——一个放纵的人被一句话击中，从此换了一种活法（这里击中他的是河面一下子平了）；
# 文化：葡萄牙的流放兵与殉道者崇拜——慈悲与刀出自同一份信；张力：赌了一辈子的人把命押给一个被扔进河里的神父；九年后神父的弟兄要拿摩尔人的命去抵那条命，他信的神站在哪一边，这一把得他自己掷。
# 蒙克拉罗斯照他自己的报告写（不加旁白审判，也不洗白）：他为没有坟的弟兄悲痛，力主走河路去惩罚害死西尔韦拉的人；塞纳的马死了，马夫在拷问下供出摩尔教长，成年男子被杀，十七人受审，一人受洗、改为绞死；
#     他把这叫作公道；1573 年与巴雷托大吵，巴雷托不久死在塞纳；他劝接手的人退回莫桑比克，自己搭船回里斯本。兰达那条线的火、书、“你又能救得了谁”，这里都不用。
# 新人物：流放兵迪奥戈只在正文里出现，不作 speaker，不加情谊效果。他死不死由 r4 的检定定（失败走 r4_dice，死于 1572 年）。
# 入口：r1、r2 读 c13_main_baraka（a00 设），r3—r5 读 _act2（b00 必设），r6 读 _act3（c01 必设）。塞纳不是港口，r4 不设 at。
# 读：c13_main_baraka_guided（a03，r1、r3 变体）、c13_main_baraka_guided_barreto（b01，r4 变体）。
# 设：rw_baraka_r_water / _salt_shown / _asked（r1）、_salt_given / _salt_half / _salt_kept（r2）、_described / _argued / _asked_grave（r3）、
#     _stood_saved / _diogo_died（检定失败）/ _bought_women / _away（r4，互斥；timeout 也设 _away）、_shouted / _salted_river（r4_dice）、_asked_sleep / _carried_box / _told_silveira（r5）、
#     rw_baraka_river_end_written / _end_salt / _end_asked（r6）。
[[tracks]]
key = "main_baraka_rw_river"
name = "河边的兵"
kind = "main"
start = "r1_dice"
auto = true
cast = ["baraka"]

# r1 扔进河里的骰子：西尔韦拉死后，一个流放兵从河上下来（看见天堂一角的人）。
[[tracks.chapters]]
key = "r1_dice"
title = "扔进河里的骰子"
text = "雨季前，一个葡萄牙流放兵从赞比西河上游漂下来，在索法拉的酒棚里坐着，面前一碗水。棚里的人都认得他：迪奥戈，里斯本的牢里放出来的，在王廷边上跟人赌了五年骰子，输掉过一条船。他说神父被勒死那夜他在河边，看着他们把人抬下来，扔进水里。“他的脸一点也不怕。水一下子就平了，像底下有人伸手接住了他。”从那夜起他没再摸过骰子，骰子他也扔进了河里。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1561, 9, 15] }]
at = "sofala"
speaker = "captain"
mood = "mystic"
cast = ["baraka"]
deadline = [1562, 6, 30]

[[tracks.chapters.choices]]
key = "water"
text = "给他再要一碗水"
next = "r2_penitent"
effects = [{ kind = "flag", flag = "rw_baraka_r_water" }]
reply = "他两手捧着那碗水，喝得很慢，像在喝什么贵东西。“我从前一天喝一罐酒，现在喝水，喝出来水是有味道的。”我说那是索法拉的井水咸。他摇头：“不是咸。是我从前没尝过。”"

[[tracks.chapters.choices]]
key = "salt"
text = "把神父那只盐袋拿给他看"
next = "r2_penitent"
effects = [{ kind = "flag", flag = "rw_baraka_r_salt_shown" }]
reply = "他一看见袋口那个结，就从凳子上滑下去，跪在泥地上，额头碰着我的鞋尖。他求我让他拿一下，就一下。他捧着袋子，嘴唇动个不停，念的是拉丁话，念完还给我，眼睛是红的：“你留着。你是摩尔人，可你留着比我留着干净。”"

[[tracks.chapters.choices]]
key = "ask"
text = "问他：你那夜在河边做什么"
next = "r2_penitent"
effects = [{ kind = "flag", flag = "rw_baraka_r_asked" }]
reply = "“等他们赌完。”他说那夜王廷边上有一场骰子局，他输光了，出来撒尿，正碰上抬人的。“我要是赢了，就不会出来，就看不见。”他看着自己的手，“你说，是骰子叫我输的，还是谁叫我输的？”"

[tracks.chapters.timeout]
next = "r2_penitent"
effects = []
news = "索法拉的人说，有个流放兵从河上下来，戒了酒，也戒了骰子，逢人就讲神父的事。"

[[tracks.chapters.variants]]
key = "rw_guided"
when = [{ kind = "flag", flag = "c13_main_baraka_guided" }]
text = "雨季前，一个葡萄牙流放兵从赞比西河上游漂下来，在索法拉的酒棚里坐着，面前一碗水。棚里的人都认得他：迪奥戈，里斯本的牢里放出来的，在王廷边上跟人赌了五年骰子，输掉过一条船。他一见我就问：“教神父拍手的，是你吧？他进王廷那天，拍得全城都听见了。”他说神父被勒死那夜他在河边，看着他们把人扔进水里。“他的脸一点也不怕。水一下子就平了，像底下有人伸手接住了他。”从那夜起他没再摸过骰子，骰子他也扔进了河里。"

# r2 医院的水担：他把命交给了那个神，神父们却信不过一个赌徒。盐袋的去处。
[[tracks.chapters]]
key = "r2_penitent"
title = "医院的水担"
text = "莫桑比克岛的医院挨着小教堂，屋里躺着等船回葡萄牙的病人，热病一来，一夜抬出去好几个。迪奥戈在这里挑水，一天挑三十担，肩膀上一道一道血印。每个星期五他关起门来拿绳子抽自己，抽到隔壁的病人求他停手。神父们说他是个赌徒，信不过，不给他领圣体。他见了我，先问的还是那只盐袋：“还在吗？”他想带着它上河，去找神父沉下去的那一段水。"
when = [{ kind = "flag", flag = "c13_main_baraka" }, { kind = "date", from = [1564, 6, 1] }]
at = "mozambique_island"
speaker = "captain"
mood = "tender"
cast = ["baraka"]
deadline = [1567, 10, 31]

[[tracks.chapters.choices]]
key = "give"
text = "把盐袋给他"
next = "r3_monclaro"
effects = [{ kind = "flag", flag = "rw_baraka_r_salt_given" }]
reply = "我把盐袋交给他。他这回没有跪，只是两手接过去，贴在胸口，站了很久。“我替你带到那段水边，”他说，“撒一半，留一半。留下的那一半，等我死了，跟我埋在一起。”"

[[tracks.chapters.choices]]
key = "half"
text = "分一半给他，另一半我留着"
next = "r3_monclaro"
effects = [{ kind = "flag", flag = "rw_baraka_r_salt_half" }]
reply = "我们蹲在医院门口，把盐倒在一片芭蕉叶上，分成两堆。他分得很仔细，一粒一粒拨，拨到两堆一样多。“一半在河上，一半在海上，”他说，“他走过的路，就都有了。”"

[[tracks.chapters.choices]]
key = "keep"
text = "说：这是恩科西交到我手里的"
next = "r3_monclaro"
effects = [{ kind = "flag", flag = "rw_baraka_r_salt_kept" }]
reply = "我说这只袋子是王廷的信使从山里一路攥下来的，我得替他留着。迪奥戈没再求，点点头，挑起水担走了。走到门口他回头：“那你替我摸一摸袋口的结。他打结的时候，手指是凉的。”"

[tracks.chapters.timeout]
next = "r3_monclaro"
effects = []
news = "莫桑比克岛上的人说，医院里那个挑水的流放兵，神父们还是不肯给他领圣体。"

# r3 没有坟的人：蒙克拉罗斯的悲痛。与 b01 同一时节。
[[tracks.chapters]]
key = "r3_monclaro"
title = "没有坟的人"
text = "巴雷托的营地里，耶稣会士蒙克拉罗斯住在最靠海的一顶帐篷，夜里点着灯写信，写给国王，也写给罗马。他瘦，眼窝深，一说起西尔韦拉，声音就低下去，像怕吵醒谁。“他连一座坟都没有，河把他吃了。我们的弟兄死在哪里，我们就在哪里替他立十字。他死在一条河里，十字立在哪里？”迪奥戈蹲在帐篷外头，是他找来的证人。蒙克拉罗斯转过来问我：“王廷里那些从海边去的商人，你认得几个？”"
when = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "date", from = [1569, 10, 1] }]
at = "mozambique_island"
speaker = "captain"
mood = "tense"
cast = ["baraka"]
deadline = [1570, 12, 31]

[[tracks.chapters.choices]]
key = "describe"
text = "给他讲西尔韦拉在索法拉的样子"
next = "r4_sena"
effects = [{ kind = "flag", flag = "rw_baraka_r_described" }]
reply = "我讲他睡在甲板上，讲那袋盐和那壶水，讲他的手指干得裂了口子。蒙克拉罗斯闭着眼听，听到裂口，把自己的手伸到灯下看了看。“他总不肯抹油，说油是给活人的。”他谢了我，谢完又问了一遍：那些商人，我认得几个。"

[[tracks.chapters.choices]]
key = "argue"
text = "说：勒死他的是王廷的议事会"
next = "r4_sena"
effects = [{ kind = "flag", flag = "rw_baraka_r_argued" }]
reply = "蒙克拉罗斯点头，好像早等着这一句：“议事会的耳朵是谁喂的？”他从桌上抽出一张纸，上面一列名字，都是摩尔人。“我不恨他们，我替他们祷告。可公道是公道，祷告是祷告。”他把纸放回去，压上一块石头。"

[[tracks.chapters.choices]]
key = "grave"
text = "问他：你要的是一座坟，还是一笔账"
next = "r4_sena"
effects = [{ kind = "flag", flag = "rw_baraka_r_asked_grave" }]
reply = "他看了我很久，久到灯芯爆了一下。“我要他不白死。一个人为天主死在河里，河边的人照旧做买卖，照旧称金子，好像什么都没发生过——那他就白死了。”说这话的时候，他的手在抖，是真的在抖。"

[tracks.chapters.timeout]
next = "r4_sena"
effects = []
news = "莫桑比克岛上的人说，巴雷托营里那个耶稣会士天天写信，写的都是死在河里的那个神父。"

[[tracks.chapters.variants]]
key = "rw_guided"
when = [{ kind = "flag", flag = "c13_main_baraka_guided" }]
text = "巴雷托的营地里，耶稣会士蒙克拉罗斯住在最靠海的一顶帐篷，夜里点着灯写信，写给国王，也写给罗马。他听说我陪西尔韦拉上过河口，叫人给我搬了凳子：“他信里写过一个基尔瓦人，话多，心好。”一说起西尔韦拉，他的声音就低下去：“他连一座坟都没有，河把他吃了。他死在一条河里，十字立在哪里？”迪奥戈蹲在帐篷外头，是他找来的证人。蒙克拉罗斯转过来问我：“王廷里那些从海边去的商人，你认得几个？”"

# r4 塞纳的十七个人：站没站到前面，由玩家的选择与他自己的命定（检定失败走 r4_dice）。
[[tracks.chapters]]
key = "r4_sena"
title = "塞纳的十七个人"
text = "塞纳的河岸上，远征军的马一匹接一匹倒下。马夫们挨了拷打，供出一个摩尔教长出钱叫他们下毒。巴雷托的人搜遍了河两岸，摩尔人的男人杀得只剩十七个，关在栅栏里等审。我的船运米上来，在下游的沙洲边等水。审完了，十七个人都要死。蒙克拉罗斯在栅栏边说，肯受洗的，死得轻一点。迪奥戈一个一个去劝，劝得满脸是泪，只有一个人点了头。天亮以前，迪奥戈来敲我的船舷：“他们明天动手。你陪我去站一站。”"
when = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "date", from = [1572, 3, 1] }]
speaker = "captain"
mood = "sad"
cast = ["baraka"]
deadline = [1572, 12, 31]

[[tracks.chapters.choices]]
key = "stand"
text = "跟他一起站到栅栏前头"
next = "r5_after"
check = { attr = "eloquence", base = 40, per = 8 }
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "portugal", value = -3 }, { kind = "reputation", faction = "swahili_cities", value = 3 }, { kind = "flag", flag = "rw_baraka_r_stood_saved" }]
reply = "我们站在栅栏前头，迪奥戈张开两只胳膊，我在他旁边讲，讲了一个早上，讲米，讲牛，讲河路上的热病，讲到巴雷托不耐烦地摆手。最后两个最小的孩子被拉了出来，改判去划船。迪奥戈挨了三十鞭，戴着铐子押下了河。他走的时候冲我笑，背上全是血。"
fail = { next = "r4_dice", effects = [{ kind = "flag", flag = "rw_baraka_r_diogo_died" }], news = "塞纳的人说，那天早上有个流放兵站在摩尔人的栅栏前头，巴雷托的人没跟他多说一句。" }

[[tracks.chapters.choices]]
key = "rice"
text = "上岸找巴雷托：拿一船米换女人孩子"
next = "r5_after"
requires = [{ kind = "cash", ge = 1500 }]
hint = "一船米的钱，袋里还凑不出来。"
effects = [{ kind = "cash", value = -1500 }, { kind = "reputation", faction = "swahili_cities", value = 3 }, { kind = "flag", flag = "rw_baraka_r_bought_women" }]
reply = "巴雷托收下了米，说米是米，命是命，十七个人照审照判。可栅栏外头那些女人和孩子，他准了，准她们坐我的船下河。迪奥戈一个人站到了栅栏前头，挨了一顿鞭子，被铐起来押走了。他从我的船边过，喊了一声：“米是好米！”"

[[tracks.chapters.choices]]
key = "away"
text = "不去，开船往下游走"
next = "r5_after"
effects = [{ kind = "flag", flag = "rw_baraka_r_away" }]
reply = "我没去。天亮时我把船撑离了沙洲，顺着水往下走。走出一里地，上游响了一声炮，又一声。水手们都不说话。后来我才听人说，迪奥戈那天没站到前头，他跪在那十几个人中间，一个一个替他们闭眼睛。"

[tracks.chapters.timeout]
next = "r5_after"
effects = [{ kind = "flag", flag = "rw_baraka_r_away" }]
news = "塞纳的人说，十七个摩尔人只有一个受了洗，受了洗的那一个是绞死的，别的人不是。"

[[tracks.chapters.variants]]
key = "rw_guided_b"
when = [{ kind = "flag", flag = "c13_main_baraka_guided_barreto" }]
text = "塞纳的河岸上，远征军的马一匹接一匹倒下。马夫们挨了拷打，供出一个摩尔教长出钱叫他们下毒。巴雷托的人搜遍了河两岸，摩尔人的男人杀得只剩十七个，关在栅栏里等审。我替巴雷托一头一头买齐的牛，有一半倒在了河岸上。我的船跟着运米上来，在下游的沙洲边等水。审完了，十七个人都要死。蒙克拉罗斯在栅栏边说，肯受洗的，死得轻一点。迪奥戈一个一个去劝，劝得满脸是泪，只有一个人点了头。天亮以前，迪奥戈来敲我的船舷：“他们明天动手。你陪我去站一站。”"

# r4_dice 这一把：检定失败，迪奥戈死（1572 年）。
[[tracks.chapters]]
key = "r4_dice"
title = "这一把"
text = "迪奥戈没让开。巴雷托的队长骂了他两句，叫人把他拖走，他抱着栅栏的木桩不撒手。蒙克拉罗斯在后头说了一句什么，我没听清。后来他们不拖了，把他跟那十几个人绑在一排。他回过头来看我，脸上一点也不怕，跟他讲过的那个神父一样。“这一把，”他说，“我押上了。”"
speaker = "captain"
mood = "sad"
cast = ["baraka"]

[[tracks.chapters.choices]]
key = "shout"
text = "喊他的名字"
next = "r5_after"
effects = [{ kind = "flag", flag = "rw_baraka_r_shouted" }]
reply = "我喊他，一遍一遍地喊，喊到嗓子破了。他没再回头。事后我在河岸上找了一天，没找到他。巴雷托的人说，跟摩尔人绑在一起的，都扔进了河里。跟他的神父，是同一条河。"

[[tracks.chapters.choices]]
key = "salt"
text = "往河里撒一把船上的盐"
next = "r5_after"
effects = [{ kind = "flag", flag = "rw_baraka_r_salted_river" }]
reply = "我从船上的盐袋里抓了一把，撒进河里。水是黄的，盐一落下去就没了。水手们以为我在做摩尔人的法事，谁也没问，谁也没笑。"

# r5 回里斯本的船：巴雷托死后（b03），蒙克拉罗斯回国。读 r4 的结果。
[[tracks.chapters]]
key = "r5_after"
title = "回里斯本的船"
text = "巴雷托死在塞纳，死前跟蒙克拉罗斯大吵了一架，吵完就躺倒了。蒙克拉罗斯劝接手的人把剩下的兵带回莫桑比克，自己搭上了回里斯本的船。上船那天，他在码头上认出了我，站住了。他比在营里时更瘦，说塞纳的事他写进了报告，写的是公道：“那不是报仇。报仇的话，我会脸红。”他到底没走到那座山，也没找到那段水。"
when = [{ kind = "flag", flag = "c13_main_baraka_act2" }, { kind = "date", from = [1573, 8, 1] }]
at = "mozambique_island"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
deadline = [1574, 12, 31]

[[tracks.chapters.choices]]
key = "sleep"
text = "问他：塞纳以后，你睡得着吗"
next = "r6_corner"
effects = [{ kind = "flag", flag = "rw_baraka_r_asked_sleep" }]
reply = "“睡得着。我每天夜里替他们祷告，祷告完就睡得着。”他说的是真话，我看得出来。他倒反过来问我睡不睡得着。我说我讲笑话，讲到自己睡着。他想了想：“那也是一种祷告。”"

[[tracks.chapters.choices]]
key = "box"
text = "不问，帮他把书箱扛上船"
next = "r6_corner"
effects = [{ kind = "flag", flag = "rw_baraka_r_carried_box" }]
reply = "书箱很沉，里面是写了四年的信与报告。我扛上跳板，他在后头扶着箱角，一路叫我小心，别让海水溅着。放下箱子，他把手按在箱盖上：“这里头有他。”我知道他说的是西尔韦拉，可我想的是栅栏里那十几个人，箱子里也有他们。"

[[tracks.chapters.choices]]
key = "silveira"
text = "说：西尔韦拉从没提过摩尔人"
next = "r6_corner"
effects = [{ kind = "flag", flag = "rw_baraka_r_told_silveira" }]
reply = "我说：他在索法拉那几天，跟我讲的是盐、水、拍手，没说过一句摩尔人的坏话。蒙克拉罗斯的脸一下子白了，又慢慢红回来。“他是圣人，圣人不记仇。记仇是我们这些活着的人的事。”他上了船，没再回头。"

[tracks.chapters.timeout]
next = "r6_corner"
effects = []
news = "莫桑比克岛上的人说，巴雷托营里的耶稣会士搭船回里斯本了，带走了一箱子信。"

[[tracks.chapters.variants]]
key = "rw_bought"
when = [{ kind = "flag", flag = "rw_baraka_r_bought_women", value = true }]
text = "巴雷托死在塞纳，死前跟蒙克拉罗斯大吵了一架，吵完就躺倒了。蒙克拉罗斯劝接手的人把剩下的兵带回莫桑比克，自己搭上了回里斯本的船。上船那天，他在码头上认出了我，站住了。他比在营里时更瘦，说塞纳的事他写进了报告，写的是公道：“那不是报仇。报仇的话，我会脸红。”他到底没走到那座山，也没找到那段水。他又说：“你那船米，我写进报告了，写的是：一个摩尔商人的布施。”"

[[tracks.chapters.variants]]
key = "rw_died"
when = [{ kind = "flag", flag = "rw_baraka_r_diogo_died", value = true }]
text = "巴雷托死在塞纳，死前跟蒙克拉罗斯大吵了一架，吵完就躺倒了。蒙克拉罗斯劝接手的人把剩下的兵带回莫桑比克，自己搭上了回里斯本的船。上船那天，他在码头上认出了我，站住了。他比在营里时更瘦，说塞纳的事他写进了报告，写的是公道：“那不是报仇。报仇的话，我会脸红。”他到底没走到那座山，也没找到那段水。说到迪奥戈，他只说了一句：“他是自己要绑上去的。我替他做过弥撒。”"

[[tracks.chapters.variants]]
key = "rw_saved"
when = [{ kind = "flag", flag = "rw_baraka_r_stood_saved", value = true }]
text = "巴雷托死在塞纳，死前跟蒙克拉罗斯大吵了一架，吵完就躺倒了。蒙克拉罗斯劝接手的人把剩下的兵带回莫桑比克，自己搭上了回里斯本的船。上船那天，他在码头上认出了我，站住了。他比在营里时更瘦，说塞纳的事他写进了报告，写的是公道：“那不是报仇。报仇的话，我会脸红。”他到底没走到那座山，也没找到那段水。他又说，那个站在栅栏前头的流放兵关在岛上的牢里，他去听过一回他的告解。“他说他不后悔。我信他不后悔。”"

# r6 天堂的一角：终章。迪奥戈的结局只在变体里分。
[[tracks.chapters]]
key = "r6_corner"
title = "天堂的一角"
text = "这些年我每回进赞比西河，都要在塞纳下游那片沙洲边停一停。我把迪奥戈写进了史书，又划掉，又写上。一个流放兵，一个摩尔金商，信的不是一个神，在同一条河边，各看见了一点什么。他看见的是水一下子平了；我看见的，是他张开的两只胳膊。"
when = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "date", from = [1581, 3, 1] }]
speaker = "captain"
mood = "tender"
cast = ["baraka"]

[[tracks.chapters.choices]]
key = "write"
text = "把他写在摩尔商人的名字旁边"
next = "done"
effects = [{ kind = "growth", attr = "learning", value = 100 }, { kind = "flag", flag = "rw_baraka_river_end_written" }]
reply = "我把他写在塞纳那十七个人的名字旁边。名字我只记得九个，剩下的空着。外人写错了我们五十年，我写一个外人，写得尽量对。"

[[tracks.chapters.choices]]
key = "salt"
text = "在沙洲边往河里撒一把盐"
next = "done"
effects = [{ kind = "flag", flag = "rw_baraka_river_end_salt" }]
reply = "我把一把盐撒进河里。是哪一袋的盐，已经说不清了，西尔韦拉的，船上的，索法拉井边晒的，都是盐。河水照旧是黄的，照旧往海里流。"

[[tracks.chapters.choices]]
key = "ask"
text = "去塞纳打听那天活下来的人"
next = "done"
effects = [{ kind = "flag", flag = "rw_baraka_river_end_asked" }]
reply = "我在塞纳的市场上问了三天，问那年栅栏里出来的人。有人说没有，有人说有两个孩子，划船划到了果阿。我把“两个孩子，划船”写在本子上，后面打了一个问号，问号比字还大。"

[[tracks.chapters.variants]]
key = "rw_away"
when = [{ kind = "flag", flag = "rw_baraka_r_away", value = true }]
text = "这些年我每回进赞比西河，都要在塞纳下游那片沙洲边停一停。迪奥戈那天没站到前头，后来他又赌上了，在索法拉的酒棚里一把一把地掷，掷输了就笑。有人问他神父的事，他说不记得了。我把迪奥戈写进了史书，又划掉，又写上。一个流放兵，一个摩尔金商，信的不是一个神，在同一条河边，各看见了一点什么。他看见的是水一下子平了；我看见的，是他张开的两只胳膊。"

[[tracks.chapters.variants]]
key = "rw_bought"
when = [{ kind = "flag", flag = "rw_baraka_r_bought_women", value = true }]
text = "这些年我每回进赞比西河，都要在塞纳下游那片沙洲边停一停。迪奥戈挨了鞭子以后回了岛上，又去医院挑水，挑到头发白了。坐我的船下河的那些女人，有一个在索法拉开了一间卖盐的小铺。我把迪奥戈写进了史书，又划掉，又写上。一个流放兵，一个摩尔金商，信的不是一个神，在同一条河边，各看见了一点什么。他看见的是水一下子平了；我看见的，是他张开的两只胳膊。"

