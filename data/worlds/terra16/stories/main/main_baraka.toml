key = "v4_malindi"
when = [{ kind = "flag", flag = "c13_main_baraka_league_malindi" }]
text = "马林迪的海滩，入夜以后。天上拖着一条长尾巴的星，亮得能照见人影。盟誓的人用一只铜盆盛了海水，每座城的人往里放一样东西：基尔瓦放的是我父亲箱子里倒数第二小的那枚砝码。马林迪的苏丹按着经书起誓，港外泊着葡萄牙人的船，起誓的人背对着它。一个老水手坐在礁石上，望着彗星说：“彗星出来的年份，海那边有人在开会。”我说：“那他们开会也该请我们吃饭。”"


# ── 第三幕 1578—1590 更远之处与回家 ──

# c01 码头上的高个子：秘密揭开（澳门）。文中不写“弥助”二字；news 不写认出。
[[tracks.chapters]]
key = "c01_yasuke"
title = "码头上的高个子"
text = "1578 年秋，澳门南湾，耶稣会院门前的石阶。巡察使范礼安在等去日本的大船。他身边那个随从高出所有人一个头，肩上扛着巡察使的书箱，嘴里哼着一支调子，是马库阿船夫划桨时的号子。我站住了。他手腕上有一道旧绳痕。很多年前，在索法拉的海边，我用父亲给的钱，从一条奴隶贩子的船上换下过一个男孩，那以后他去了哪里，我一直不知道。他放下书箱，先认出了我。他指着我腰间的黄铜箱，用半句斯瓦希里话说：“砝码。最小的那个。”那天在船上，我把箱子里最小的一枚砝码塞进他手里，让他攥着，别抖。范礼安皱了皱眉：“他是我的仆人，不是奴隶。这一点，船上每个人都知道。”我（心里）：我讲了一辈子笑话，这一刻一个也想不起来。"
at = "macao"
speaker = "captain"
mood = "tender"
cast = ["alessandro_valignano", "yasuke"]
when = [{ kind = "date", from = [1578, 9, 1] }]
deadline = [1579, 6, 30]

[tracks.chapters.timeout]
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "letter", person = "yasuke", text = "致基尔瓦那位带黄铜箱的金商：巡察使的仆人托我写这几句。索法拉海边那条船上的男孩还活着，就要跟巡察使去日本。最小的那枚砝码他一直记得。他问你今年的金价。" }]

[[tracks.chapters.choices]]
key = "gift"
text = "把箱里现在最小的那枚砝码，连同一封信交给他"
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "flag", flag = "c13_main_baraka_yasuke_gift" }, { kind = "affinity", person = "yasuke", value = 10 }, { kind = "memory", memory = "mem-main_baraka-c01", title = "码头上的高个子" }]
reply = "他把砝码系在腰带上，信塞进怀里。他还不认得字。“到了那边，”我说，“找个会念的人念给你听。念到笑话的地方，你得笑。”他说他会笑两遍，一遍替我。"
news = "澳门码头上，巡察使的高个子随从跟一个东非来的金商说了半天话，说的是澳门谁也听不懂的话。"

[[tracks.chapters.choices]]
key = "freedom"
text = "求巡察使放他自由"
next = "c02_summons"
check = { attr = "eloquence", base = 5, per = 8 }
effects = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "flag", flag = "c13_main_baraka_asked_freedom" }, { kind = "affinity", person = "yasuke", value = 6 }, { kind = "affinity", person = "alessandro_valignano", value = 3 }, { kind = "memory", memory = "mem-main_baraka-c01", title = "码头上的高个子" }]
reply = "范礼安想了很久，说：“他要是愿意留下，我不拦。”他看了看我，又看了看那条船。他选了船。“我想看看，”他说，“他们说的那个更远的岛。”"

[tracks.chapters.choices.fail]
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "affinity", person = "yasuke", value = 3 }, { kind = "memory", memory = "mem-main_baraka-c01", title = "码头上的高个子" }]
news = "澳门的人说，有个东非来的金商当着巡察使的面，替他那个高个子随从说过话，巡察使客气地回绝了。"

[[tracks.chapters.choices]]
key = "farewell"
text = "只说一声保重，问他现在叫什么"
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_main_baraka_act3" }, { kind = "affinity", person = "yasuke", value = 3 }, { kind = "memory", memory = "mem-main_baraka-c01", title = "码头上的高个子" }]
reply = "他说葡萄牙人给他起过一个名字，他不喜欢。“等我到了那边，”他说，“也许会有一个我喜欢的。”我说那就写信告诉我，写错了字也行。"

# c02 第二枚铜币：召（无 at）。立场与信物在这里选，恰好一面 stance；超时缺省 open。
[[tracks.chapters]]
key = "c02_summons"
title = "第二枚铜币"
text = "泊船的港口，集市上一个晒得脱皮的水手用一枚铜币买水。那是一枚基尔瓦苏丹的铜币，崭新，边上的字一个也没磨。我从怀里摸出母亲留下的那一枚：同一个苏丹，同一副模子。母亲那枚背面磨平了的半行字，这一枚上清清楚楚：“他信靠众世界之主。”水手说，这枚钱是在亚速尔西边一个港口找给他的。那里谁也不问你是哪个国王的人，什么都收：消息、书、种子，也收我们这片海三百年前的钱。“那边的人看钱不看值多少，”他说，“看它从哪儿来。”我把两枚铜币背靠背一合，磨掉的那半行字就读全了。母亲那枚磨掉的，原来是“众世界”。"
cast = ["baraka"]
mood = "mystic"
when = [{ kind = "date", from = [1582, 7, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_baraka_stance_open" }]

[[tracks.chapters.choices]]
key = "open"
text = "把母亲的铜币缝进衣襟，去找那座港：让雾散开，让两边做买卖"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_baraka_keepsake" }, { kind = "flag", flag = "c13_main_baraka_stance_open" }]
reply = "我把两枚铜币都缝进衣襟，一枚是母亲的，一枚是找来的。水手的那枚我照价付了水钱，他乐了。我对水手说，一座港要是只收不卖，迟早没人去。他们笑我说话像我爹。"

[[tracks.chapters.choices]]
key = "close"
text = "带上铜币去；那边的人若愿意藏着，就由他们藏着"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_baraka_keepsake" }, { kind = "flag", flag = "c13_main_baraka_stance_close" }]
reply = "我想起大津巴布韦那个不许人碰鸟的老人。有些地方，外人一去就变成了别人书里的一页。我去，只想把母亲的钱送回它亲戚身边。开门的事，轮不到一个金商。"

[[tracks.chapters.choices]]
key = "hand"
text = "铜币托人送回基尔瓦，放在母亲坟头；那片海交给守得住它的人"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_baraka_stance_hand" }]
reply = "我不带铜币。金商的规矩是：贵重的东西交给保得住它的人，不交给最想要它的人。我还是要去看一眼，看看到底谁守得住。"

# c03 离金之河最远的海：历史现场（1583-07，特塞拉岛外）。赶不到 default 设 absent。
[[tracks.chapters]]
key = "c03_dark_sea"
title = "离金之河最远的海"
text = "特塞拉岛外，七月，圣克鲁斯侯爵的舰队正在攻安格拉，炮声隔着海一阵一阵传过来。再往西走两天，海面浮满黄褐色的海草，风停了，罗经的针自己打转。这是我离金之河最远的一次。这里没有河，没有金市，只有一片不肯动的海。水手说：“老板，这海连鱼都不游。我们回去卖水吧，西班牙人给的价比金子还好。”我（心里）：在索法拉，金子顺着河下来；在这里，什么都不流。海草中间有一道窄缝，像有人走过。罗经乱转的时候，那道窄缝没有合上，它在等船。"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
stage = "involve"
speaker = "captain"
mood = "mystic"
cast = ["baraka", "alvaro_de_bazan"]
news = "亚速尔的人说，特塞拉岛那一仗打到最后的夏天，西边的海草一直漂到了安格拉港外。"

[tracks.chapters.default]
next = "c04_after"
effects = [{ kind = "flag", flag = "c13_main_baraka_absent" }, { kind = "flag", flag = "c13_main_baraka_atlantis_over" }]

[[tracks.chapters.choices]]
key = "cross"
text = "顺着海草里那道缝穿进去"
next = "c04_after"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "没有那卷《翠玉录》的抄片，海草不让路。"
effects = [{ kind = "flag", flag = "c13_main_baraka_crossed" }]
reply = "船头压进海草，海草让开了。罗经停了，指着一个它从没指过的方向。"

[[tracks.chapters.choices]]
key = "sell_water"
text = "掉头：把淡水卖给圣克鲁斯侯爵的舰队"
next = "c04_after"
effects = [{ kind = "flag", flag = "c13_main_baraka_turned_back" }, { kind = "cash", value = 1500 }, { kind = "reputation", faction = "spain", value = 2 }, { kind = "flag", flag = "c13_main_baraka_atlantis_over" }]
reply = "西班牙的军需官按桶付钱，一桶比索法拉的一两金子还贵。我讲了个笑话，说这是我这辈子卖得最好的一船货，水手们都笑了。我回头看了一眼海草，它已经在身后了。"
news = "安格拉港外，一条东非来的缝合船把整船淡水卖给了西班牙舰队，船主还跟军需官讲了半天价。"

[[tracks.chapters.choices]]
key = "listen"
text = "在海草边停一夜，把铜币贴在耳边听"
next = "c04_after"
requires = [{ kind = "flag", flag = "c13_main_baraka_keepsake" }]
hint = "衣襟里没有那枚铜币，海草边上什么也听不见。"
effects = [{ kind = "flag", flag = "c13_main_baraka_turned_back" }, { kind = "growth", attr = "sensibility", value = 200 }, { kind = "flag", flag = "c13_main_baraka_atlantis_over" }]
reply = "我听见了一点声音，像远处集市上讨价还价，又像我自己的心跳。天亮时风回来了，船已经被洋流推出了海草。我一句话也没对水手说。"

[[tracks.chapters.variants]]
key = "coin"
when = [{ kind = "flag", flag = "c13_main_baraka_keepsake" }]
text = "特塞拉岛外，七月，圣克鲁斯侯爵的舰队正在攻安格拉，炮声隔着海一阵一阵传过来。再往西走两天，海面浮满黄褐色的海草，风停了，罗经的针自己打转。这是我离金之河最远的一次。这里没有河，没有金市，只有一片不肯动的海。水手说：“老板，这海连鱼都不游。我们回去卖水吧，西班牙人给的价比金子还好。”我（心里）：在索法拉，金子顺着河下来；在这里，什么都不流。衣襟里那两枚铜币，一枚是母亲的，一枚是找来的，一路上我都没松手。海草中间有一道窄缝，像有人走过。罗经乱转的时候，那道窄缝没有合上，它在等船。"

# c04 海草以后：无 at 的回响。基础文本是没有穿过去的回程；C11 的判决旗标只在变体里。
[[tracks.chapters]]
key = "c04_after"
title = "海草以后"
text = "回程的船上。雾没有开，至少我没看见它开。去过西边的人回来都不大说话；我是唯一一个说个不停的，可说出来的全是笑话，连我自己都听不出哪一句是真的。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”我把手伸进衣襟摸了一下，这一趟比走的时候重。"
cast = ["baraka"]
mood = "tender"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_baraka_atlantis_over" }]
deadline = [1584, 1, 10]

[tracks.chapters.timeout]
next = "c05_yasuke_letter"
effects = []

[[tracks.chapters.choices]]
key = "write"
text = "把这一趟写进史书最后几页"
next = "c05_yasuke_letter"
requires = [{ kind = "flag", flag = "c13_main_baraka_history_begun" }]
hint = "你还没动笔写诸城的事，这一趟没处安放。"
effects = [{ kind = "growth", attr = "learning", value = 200 }]
reply = "我写了三页，最后一页只写了海草的颜色和罗经的针。诸城的史书里第一次有了一片不属于诸城的海。"

[[tracks.chapters.choices]]
key = "tell"
text = "在甲板上当故事讲，讲到一半就收钱"
next = "c05_yasuke_letter"
effects = [{ kind = "fame", value = 3 }, { kind = "cash", value = 300 }]
reply = "讲到海草让开的地方我就停下收钱，收完再讲另一个结尾。三天里讲了三个结尾，没有一个是真的，听的人都说值。"

[[tracks.chapters.choices]]
key = "keep"
text = "谁也不告诉，把铜币放回砝码箱"
next = "c05_yasuke_letter"
effects = [{ kind = "growth", attr = "sensibility", value = 100 }]
reply = "铜币放回砝码箱的夹层，跟父亲的账簿压在一起。账簿上最后一笔是父亲的字，我没往下记。"

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "回程的船上。西边的海草再没漂到过安格拉。金板上的判词是我写的，字比账本还难认。那道缝合上了，像从来没有过。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "回程的船上。西边回来的船越来越多，船上卖一种发红光的铜。金板上那句判词是我写的：航路打开。亚速尔西边那片海开了，去过西边的人回来都不大说话；我是唯一一个说个不停的，可说出来的全是笑话。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”"

[[tracks.chapters.variants]]
key = "v3_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "回程的船上。我在一张金板前坐过一夜，那是别人的事，我只记得它的颜色。回来以后，我讲的笑话少了一半。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”"

[[tracks.chapters.variants]]
key = "v4_crossed"
when = [{ kind = "flag", flag = "c13_main_baraka_crossed" }]
text = "回程的船上。我穿过去了，又回来了。我看见的东西说不清，就先不说。这辈子头一回，我有一个讲不出口的故事。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”"

[[tracks.chapters.variants]]
key = "v5_turned"
when = [{ kind = "flag", flag = "c13_main_baraka_turned_back" }]
text = "回程的船上。我在海草边掉了头。船上的水卖了好价钱，可我总觉得少称了一样东西。船上最小的水手问：“巴拉卡叔叔，西边的海是什么颜色？”我说：“黄的。像没熬好的咖啡。”"

# c05 日本来的信：结果回响（hub，无 at）。两组互斥：HIST_H54 为真的一组、为假的一组，任何时候恰好两项可选。
[[tracks.chapters]]
key = "c05_yasuke_letter"
title = "日本来的信"
text = "一封从日本来的信，在路上走了两年多才追到我手里。信是耶稣会的人代写的葡萄牙文，末尾按着一个大拇指印，旁边是两个我不认得的日本字。信里说，那是他的主公赏给他的名字：弥助。主公赏了他刀和宅子，还问过他：“东非的海是什么颜色？”他答：“早上是绿的，晚上是金的。”同一条船还捎来一包耶稣会的信，说的是日本那年夏天京都的一座寺。"
cast = ["yasuke"]
mood = "tender"
when = [{ kind = "date", from = [1584, 1, 15] }]
deadline = [1585, 12, 31]

[tracks.chapters.timeout]
next = "c06_mir_ali"
effects = []

[[tracks.chapters.choices]]
key = "lives_reply"
text = "回信：问他主公赏的宅子里，有没有一扇朝海的窗"
next = "c06_mir_ali"
requires = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives" }]
effects = [{ kind = "affinity", person = "yasuke", value = 5 }]
reply = "耶稣会那包信说，那年夏天京都的寺里起过一场火，信长从火里走了出来。我在回信里画了一扇窗，窗外是海，海是金的。画得很难看，我在旁边写：这是晚上。"

[[tracks.chapters.choices]]
key = "lives_grave"
text = "把信带回基尔瓦，念给父母的坟听"
next = "c06_mir_ali"
requires = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives" }]
effects = [{ kind = "growth", attr = "sensibility", value = 200 }]
reply = "我念到“晚上是金的”那一句，念不下去了，就改讲了个笑话给坟听。父亲生前最爱听我讲砸了的笑话。"

[[tracks.chapters.choices]]
key = "fire_ask"
text = "托耶稣会的船去问：那一夜以后，他在哪里"
next = "c06_mir_ali"
requires = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives", value = false }]
effects = [{ kind = "affinity", person = "yasuke", value = 3 }]
reply = "耶稣会那包信里写着：那一夜他在主公身边打到最后，被明智的人交给了神父。以后的事，信里没有。我的问信托出去了，回信一直没来。"

[[tracks.chapters.choices]]
key = "fire_box"
text = "把信收进砝码箱的夹层，跟父亲的账簿放在一起"
next = "c06_mir_ali"
requires = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives", value = false }]
effects = [{ kind = "growth", attr = "sensibility", value = 100 }]
reply = "信和父亲的账簿压在一起，一样厚。我合上箱子，给水手们讲了一晚上笑话，讲到他们求我别讲了。"

[[tracks.chapters.variants]]
key = "v1_mio"
when = [{ kind = "flag", flag = "c13_npc_mio_yasuke_letter" }]
text = "一封从日本来的信，在路上走了两年多才追到我手里。信先交给了一位土佐来的姬君船主，由她捎到长崎再转出来；包信的油纸上，盖着一面过所旗的印。信是耶稣会的人代写的葡萄牙文，末尾按着一个大拇指印，旁边是两个我不认得的日本字。信里说，那是他的主公赏给他的名字：弥助。主公赏了他刀和宅子，还问过他：“东非的海是什么颜色？”他答：“早上是绿的，晚上是金的。”同一条船还捎来一包耶稣会的信，说的是日本那年夏天京都的一座寺。"

