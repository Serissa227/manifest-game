# 依据（史实）：1552 巴罗斯《亚洲》记大津巴布韦门铭“连有学问的摩尔商人也读不懂”（a06、b05）；
#   1557 奥斯曼取马萨瓦、设哈贝什省（a02 只写消息，不写年份以外的细节）；
#   1560—61 耶稣会士西尔韦拉沿海北上、经赞比西河进穆塔帕王廷，1561 年在王廷被勒死、尸身扔进河里（a03、a04）；
#   1564 前后诵经与父亲之死（a06 只写散了以后）；
#   1568—69 卡蒙斯滞留莫桑比克岛，1572 年《卢济塔尼亚人之歌》出版，第二歌写蒙巴萨与马林迪（b00）；
#   1569—73 巴雷托远征，1572 塞纳的摩尔商人被处死（罪名是毒死了马，只作指控转述），1573 年巴雷托死在塞纳（b01—b03）；
#   1574—75 葡萄牙人到马尼卡金市，设“门长”抽税（b04）；1577 大彗星（b08）；
#   1578—79 范礼安在澳门、1579 携非洲随从到日本（c01）；1581 信长赐名弥助（正文不写此名，c05 的来信才第一次出现）；1582 本能寺（c05 只做 HIST 旗标）；
#   1583 亚速尔海战、圣克鲁斯侯爵攻安格拉（c03）；1586 米尔·阿里·贝伊南下（c06）；
#   1587 果阿派船队报复向米尔·阿里献礼的城，法扎被毁（c07，指挥官与月份待核，正文只写“果阿来的船”）；
#   1587 或 1588 津巴人屠基尔瓦（c08，年份待核，食人的说法是葡萄牙人的记载，不写）；
#   1589 蒙巴萨、津巴首领的话、米尔·阿里被俘、塞格朱人在马林迪以北挡住津巴人（c09、c10）。
#   基尔瓦铜币背面的“信靠众世界之主”（14 世纪哈桑·本·苏莱曼的铜币）；“设拉子来的七条船”为巴罗斯记下的基尔瓦口传；Haba na haba 为斯瓦希里谚语。
# 原创：老商人哈希姆、老诗人、父亲页边的“不对”、母亲是蒙巴萨人、诸城同盟与铜盆盟誓、绍纳老人、第二枚铜币与水手、蒙巴萨母亲娘家那条街、马库阿学徒。
# 秘密：c01_yasuke（1578—79 澳门）揭开：马库阿男孩就是弥助。a00—b08 不提那个男孩，也不写“我救过一个孩子”；任何 news 都不写。
