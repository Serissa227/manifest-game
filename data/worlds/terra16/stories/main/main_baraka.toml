# c09 海上的神，陆上的神：历史现场（1589，蒙巴萨）。纳吉玛领水道，米尔·阿里被俘。
[[tracks.chapters]]
key = "c09_mombasa"
title = "海上的神，陆上的神"
text = "1589 年三月，蒙巴萨。米尔·阿里第二回来了，这回在岛上筑了土墙。葡萄牙舰队从海上堵住了港口；对岸大陆上，津巴人的营火一直烧到浅滩边。津巴的首领隔着水派人喊话：“葡萄牙人是海上的神，我是陆上的神。”我母亲娘家那条街就在港边。纳吉玛的船泊在北边的水道里，她说夜里那条水道能走船。她对我说：“水道只开退潮前那一个时辰。你的笑话留到船上再讲。”半夜里有人游水过了海峡，是米尔·阿里自己，他宁可做葡萄牙人的俘虏，也不落到津巴人手里。我（心里）：母亲娘家门口那块踏脚石，我小时候在上面摔过一跤。今晚，我得从它上面把人一个一个扶下船。"
window = [[1589, 3, 1], [1589, 5, 31]]
at = "mombasa"
stage = "involve"
speaker = "captain"
