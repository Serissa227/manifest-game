# a06 两本书：父亲下葬后的基尔瓦。笑话要多，眼泪不写。
[[tracks.chapters]]
key = "a06_outsiders"
title = "两本书"
text = "基尔瓦，父亲下葬第四十天的诵经刚散。清真寺东墙外是母亲的坟，父亲就埋在她旁边。诵经的时候我讲了三个父亲砍价的笑话，满屋子的人都笑了，只有我自己停不下来。父亲的木箱里只有两本书：一本是葡萄牙人巴罗斯印的《亚洲》，翻到写基尔瓦的那几页，页边有一行炭笔字，父亲一辈子只在书上写过这一处：“不对”。另一本是家里传下来的阿拉伯文《克卢瓦编年史》抄本，写到葡萄牙人来的前几年就停了，后半本一个字也没有。老诗人坐在我对面，等我先开口。我看清了父亲画线的地方：巴罗斯写基尔瓦的人望风而逃，城自己交了出来。父亲在旁边写“不对”，祖父那年没逃，他把清真寺的书一捆一捆背上了船。“不对”下面还有半个字，没写完。"
at = "kilwa"
speaker = "captain"
mood = "sad"
cast = ["baraka"]
when = [{ kind = "date", from = [1564, 1, 1] }]
deadline = [1566, 10, 31]

[tracks.chapters.timeout]
next = "b00_camoes"
effects = []

[[tracks.chapters.choices]]
key = "begin"
text = "在父亲的“不对”下面接着写：诸城自己的事"
next = "b00_camoes"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "item", item = "kilwa_ms", qty = 1 }, { kind = "flag", flag = "c13_main_baraka_history_begun" }, { kind = "growth", attr = "learning", value = 200 }, { kind = "memory", memory = "mem-main_baraka-a06", title = "不对" }]
reply = "我把编年史后半本摊开，写下第一行：那一年基尔瓦的人没有全逃，有人背着书上了船。写得很慢，像父亲称最后一撮金砂。"

[tracks.chapters.choices.fail]
next = "b00_camoes"
effects = [{ kind = "item", item = "kilwa_ms", qty = 1 }, { kind = "flag", flag = "c13_main_baraka_history_begun" }, { kind = "memory", memory = "mem-main_baraka-a06", title = "不对" }]
news = "基尔瓦的读书人说，萨利姆家的儿子写了三页，撕了两页，留下的那一页只有一行。"

[[tracks.chapters.choices]]
key = "ask_poet"
text = "先跟老诗人坐一夜：编年史停下以后，谁还记得"
next = "b00_camoes"
effects = [{ kind = "item", item = "kilwa_ms", qty = 1 }, { kind = "skill", skill = "poetry", value = 80 }, { kind = "flag", flag = "c13_main_baraka_history_begun" }, { kind = "memory", memory = "mem-main_baraka-a06", title = "不对" }]
reply = "老诗人从葡萄牙人的船开进港的那天讲起，讲到天亮，讲到一半停下来骂我记得太慢。我没写一个字，全背下了。他说这才像基尔瓦的读书人。"

[[tracks.chapters.choices]]
key = "sell_barros"
text = "把巴罗斯的书卖给葡萄牙商站，换一船布"
next = "b00_camoes"
effects = [{ kind = "cash", value = 700 }]
reply = "书记翻都没翻就付了钱。父亲写字的那一页我撕下来留着。他们不会发现少了一页，我也不打算告诉他们。"

