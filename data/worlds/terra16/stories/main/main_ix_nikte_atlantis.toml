# at3：阿兹特兰的答案。无 at，个人终章；at2 之后两个月在任何地方弹出。无 news。
[[tracks.chapters]]
key = "at3_aztlan"
title = "阿兹特兰的答案"
text = "外港的漂流者小镇，各种话混在一起。七城主教的后人说着古葡萄牙话，脚夫们用那瓦特话吆喝。镇子最里头住着一个很老的人，自称马丁，说快五十年前押他去塞维利亚的那条船，在海上漂进了海草里，他就这样上了岸。我把老脚夫那块布上的脚印重描在一块新布上，摊到他面前，用那瓦特话问：这里是不是阿兹特兰？他看了很久，摇头：“阿兹特兰的湖边有白鹭，这里一只也没有。我们的人是从湖里走出来的，这里的人是被海圈起来的。两种岛。”他又说：“这里的人都在等一条往回走的船。我不等了，我已经回不去了，也就不用回去了。”老脚夫说过，没有人画过往回走的路。原来这里全是想往回走的人。"
when = [{ kind = "wait", days = 60 }]
cast = ["ix_nikte"]
speaker = "captain"
mood = "tender"

[[tracks.chapters.choices]]
key = "home"
text = "把老人的话带回岛上，讲给湖上的人听"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_atlantis_home" }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at3", title = "两种岛" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
reply = "我答应老人，回去以后把“两种岛”的话讲给湖上来的人听。老人没有再多问。他把那块新布拿过去，在布边上添了一只白鹭，线条很细，翅膀只画了一半。他说，这是他记得的最后一只。说这些话时，他的手指在布上一下一下地点着，像是在为谁记路。我没有问，把布叠好收进怀里。那天夜里我把布摊在灯下，对着老脚夫的脚印，又描了一遍。"

[[tracks.chapters.choices]]
key = "stay_season"
text = "在外港多待一季，替漂流者镇上的女人接生"
next = "done"
check = { attr = "medicine", base = 35, per = 6 }
fail = { next = "done", effects = [{ kind = "flag", flag = "c13_main_ix_nikte_atlantis_midwife" }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at3", title = "两种岛" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }] }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_atlantis_midwife" }, { kind = "skill", skill = "herbal_medicine", value = 20 }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at3", title = "两种岛" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
reply = "那一季我接了四个孩子。一个是七城主教后人家的，老太太一边骂一边攥着我的手，骂的是葡萄牙话，我听不全，却知道她在夸我。一个的父亲是修院里出来的人，在门外站了一夜，天亮才敢进来。我用母亲的法子，在产床底下放了一块从岛上带来的石头。孩子落了地，屋里就安静了。"
# 检定失败的回复（暂存，待整合方定）：那一季我还是待下来了，只是手生了，接生时总要停一停，想一想母亲是怎么做的。

[[tracks.chapters.choices]]
key = "bring_him"
text = "拿一船可可跟他换一程：跟我的船回去"
next = "done"
check = { attr = "charm", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "memory", memory = "mem-main_ix_nikte_atlantis-at3", title = "两种岛" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }] }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_atlantis_oldman" }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at3", title = "两种岛" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
reply = "老人说，他想看看海的那一边，还有没有湖。他没有收拾东西，只把我手里的新布要过去，叠好放进胸口。上了船，他就一直坐在船头，背对着镇子，面朝海的那一边。船离了码头，他才第一次回头，看了一眼镇子的屋檐。他没有说话，只把手按在膝盖上，像在想一件很远的事。"
# 检定失败的回复（暂存，待整合方定）：他把我送到码头，指了指码头上空，那里一只白鹭也没有，他就转身回了镇子。

[[tracks.chapters.variants]]
key = "v1_spoke"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_council_spoke" }]
text = "外港的漂流者小镇，各种话混在一起。七城主教的后人说着古葡萄牙话，脚夫们用那瓦特话吆喝。镇子最里头住着一个很老的人，自称马丁，说快五十年前押他去塞维利亚的那条船，在海上漂进了海草里，他就这样上了岸。老人听说我在熄火的会上开过口，说他漂到这里这么多年，头一回有人替打下来的地方说话。我把老脚夫那块布上的脚印重描在一块新布上，摊到他面前，用那瓦特话问：这里是不是阿兹特兰？他看了很久，摇头：“阿兹特兰的湖边有白鹭，这里一只也没有。我们的人是从湖里走出来的，这里的人是被海圈起来的。两种岛。”他又说：“这里的人都在等一条往回走的船。我不等了，我已经回不去了，也就不用回去了。”老脚夫说过，没有人画过往回走的路。原来这里全是想往回走的人。"

