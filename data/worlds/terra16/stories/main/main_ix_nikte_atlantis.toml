text = "外港的漂流者小镇，各种话混在一起。七城主教的后人说着古葡萄牙话，脚夫们用那瓦特话吆喝。镇子最里头住着一个很老的人，自称马丁，说快五十年前押他去塞维利亚的那条船，在海上漂进了海草里，他就这样上了岸。那些年我在韦拉克鲁斯对着一块旧布起的猜测，今天终于有人答了。我把老脚夫那块布上的脚印重描在一块新布上，摊到他面前，用那瓦特话问：这里是不是阿兹特兰？他看了很久，摇头：“阿兹特兰的湖边有白鹭，这里一只也没有。我们的人是从湖里走出来的，这里的人是被海圈起来的。两种岛。”他又说：“这里的人都在等一条往回走的船。我不等了，我已经回不去了，也就不用回去了。”老脚夫说过，没有人画过往回走的路。原来这里全是想往回走的人。"
