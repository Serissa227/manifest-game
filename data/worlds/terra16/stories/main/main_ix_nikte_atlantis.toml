# C13 主线·伊希·妮克特的亚特兰蒂斯补章（暂存，Claude 写，仅中文）。
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_ix_nikte_atlantis_over，主线“那以后”章 c05_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
# 标签：main（伊希的亚特兰蒂斯补章，3 章）；轨道 main_ix_nikte_atlantis（kind=main，auto=true，start=at1_mirror）。
# 登记：暂存。A8 E63（帷幕与 atlantis_port 可达）与 C11 第二轮（atlantis_council 轨道、atlantis_council_met、atlantis_verdict_*）合进来以前不登记；
#       不登记时主线照样走完，主线 c08 不读这里的旗标。
# 依据·史实：H56 十王的会议（1583）。柏拉图对话录里的亚特兰蒂斯只从人物的念头里透出来，不讲课。
#       “烧书的人后来当了主教”是一句旧事（1562 马尼的焚书，后来兰达主教），只作伊希嘴里的一句话。
# 依据·原创：山铜柱背面的字、伊斯梅妮、熄了火的会、自称马丁的老人与“两种岛”、白鹭、老脚夫那块布。
# 待核：十王的名字与判词的内容归 C11；柱上律文的条文一律不写。
# 秘密：本文件不再揭开任何秘密。家里的事只在 at3 的接生一句里用母亲的法子带过，不写书，不写名字。
# 人物：伊斯梅妮（ismene，cast 已有，1564 年生）只守庙、只读律文，不写恋情；老人只写“自称马丁的老人”，不进 cast（马丁·奥塞洛特尔的本世界线见 TERRA16 §9.2）。
#       不出现 C11 的人物（带银枝的女人），她还不在 cast。
# 读的旗标：c13_main_ix_nikte（at1 门槛，主线 a00 设）；c13_main_ix_nikte_crossed（at1，主线 c04 设）；
#       c13_main_ix_nikte_aztlan（at3 变体，主线 b07 设）；atlantis_council_met 与 atlantis_verdict_close / _open / _hand_hermetic / _hand_christ / _hand_ottoman / _hand_dragon（at2 变体，C11 设）。
# 设的旗标：c13_main_ix_nikte_mirror_laid（at1 选项）；c13_main_ix_nikte_council_spoke（at2 选项）；
#       c13_main_ix_nikte_atlantis_home / _atlantis_midwife / _atlantis_oldman（at3 三个落点，C11 与图鉴可读）。
# 缺省走向：at1 期限 1584-12-31，到了静默结束（timeout 不写见闻）；at2 紧跟 at1，没有缺省；at3 在 at2 之后 60 天，在玩家所在的任何地方弹出。
# 见闻：整个文件不写 news（章节级与分支都不写）。
# 检定失败的回复：引擎只在成功时显示选项的 reply；失败时显示的是 fail 分支的 news。本文件不写 news，所以失败的回复写在对应 fail 旁的注释里，待整合方定。
# 变体：变体是整段替换正文。at2 的四个判词变体只换结尾一句，at3 的两个变体各加一句，都整段照抄基础正文。
# 回忆插画清单：
#   mem-main_ix_nikte_atlantis-at1（镜子照见的柱子）：铜色的神庙里，一个玛雅女人举起拼成的黄铁矿小镜，镜里映着身后刻满字的红金色柱子，一个少女跪在镜前。
#   mem-main_ix_nikte_atlantis-at3（两种岛）：漂流者小镇的屋檐下，一个那瓦特老人在画着脚印的布边添了一只白鹭，玛雅女人蹲在一旁看。

[[tracks]]
key = "main_ix_nikte_atlantis"
name = "月之岛·外港"
kind = "main"
start = "at1_mirror"
auto = true
cast = ["ix_nikte", "ismene"]

# at1：镜子照见的柱子。门槛：身份旗标与主线 c04 的越过旗标；期限到了静默结束。
[[tracks.chapters]]
key = "at1_mirror"
title = "镜子照见的柱子"
text = "外港的码头铺着一层铜皮，太阳底下亮得像一圈火。守庙的少女领我穿过两道水门、两道陆门，进了波塞冬神庙。正中立着一根红金色的山铜柱，柱身刻满了字，密得像爬过一地的蚂蚁。她叫伊斯梅妮，看上去还不到二十岁，是这里最年轻的“克莱托”。我还没开口，她先问：“你来做什么？先说这个。是哪位王的人，等一会儿再说也不迟。”岛上的老妇人也是这个规矩，先问来意，后问名字。这是头一回有人抢在我前头问，我差点笑出声。我从袖子里摸出黄铁矿镜。她一眼看见，眼睛亮了：“外面来的字和手工，我都要翻过来看背面。”"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "flag", flag = "c13_main_ix_nikte_crossed" }]
at = "atlantis_port"
cast = ["ix_nikte", "ismene"]
speaker = "captain"
mood = "mystic"
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]

[[tracks.chapters.choices]]
key = "lay_mirror"
text = "把镜子放在柱前，让她读背面的字"
next = "at2_council"
requires = [{ kind = "item", item = "ix_pyrite_mirror", qty = 1 }]
hint = "你两手空空，柱子背面的字，没有东西照得出来。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_mirror_laid" }, { kind = "affinity", person = "ismene", value = 5 }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at1", title = "镜子照见的柱子" }]
reply = "伊斯梅妮跪下来，把镜子平放在柱前的铜台上，对着它念了很久。念的是一种我听不懂的话，有几个音，码头上的脚夫偶尔也这样讲。念到一半她停住，说这一段讲的是“打下来的地方该怎么待”。她没有收，放回我手里：“到会上，你自己拿着。”"

[[tracks.chapters.choices]]
key = "ask_law"
text = "拿一袋可可跟她换一句：柱子上有没有写被征服的人"
next = "at2_council"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "at2_council", effects = [{ kind = "affinity", person = "ismene", value = 2 }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at1", title = "镜子照见的柱子" }] }
effects = [{ kind = "affinity", person = "ismene", value = 6 }, { kind = "memory", memory = "mem-main_ix_nikte_atlantis-at1", title = "镜子照见的柱子" }]
reply = "她想了很久，说写了，在背面。正面全是王的事，背面写的是打下来的人。我问写的是什么，她没有直接答，只说：“被打下来的人，也要照律文活着。”说完她把柱子转回背面，不再看我。"
# 检定失败的回复（暂存，fail 没有 reply 字段，待整合方定显示方式）：她摇头，说这句话只能在十王面前问，问的人要站在火灭了的地方。

# at2：熄了火的会。无 at，紧跟 at1 弹出（夜里）。判词归 C11 的 atlantis_council 轨道；变体只读 C11 登记的旗标，整段替换正文，结尾那一句改掉。
[[tracks.chapters]]
key = "at2_council"
title = "熄了火的会"
text = "十个穿深蓝长袍的人围着柱子坐下，金杯里盛着牛血，血腥气压过了炭火。伊斯梅妮没有坐，站在柱边，手里捧着律文，一页一页翻得很快。有人念完誓词，所有的火一起熄了，连柱子上的反光也没了。完全的黑暗里，十王要审外面的世界。从前听来的亚特兰蒂斯，是打下过很多地方的那一边。她的手心出了汗，指尖凉得发僵。黑暗里有个王先开口：“被打下来的人，也有资格来审吗？”判词要等天亮才知道。"
night = true
cast = ["ix_nikte", "ismene"]
speaker = "captain"
mood = "mystic"

[[tracks.chapters.choices]]
key = "speak"
text = "在黑暗里开口，替被征服的人说一句"
next = "at3_aztlan"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "at3_aztlan", effects = [] }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_council_spoke" }]
reply = "我先开口：“我的岛上，烧书的人后来当了主教。你们的柱子，背面写着什么？”然后把马尼的火、名册上的名字、湖上那座城一样一样说出来，不哭，只报数：哪一年，烧了几部，抓了几个，走了几天的路。每说一样就停一停，让它在黑里站住。说完很久，黑暗里有人用金杯轻轻碰了一下桌面。"
# 检定失败的回复（暂存，待整合方定）：我说完，黑暗里只有呼吸声；天亮以后才知道，那一下沉默也被记进了金板。

[[tracks.chapters.choices]]
key = "mirror"
text = "不说话，把镜子转向十王"
next = "at3_aztlan"
requires = [{ kind = "flag", flag = "c13_main_ix_nikte_mirror_laid" }]
hint = "镜子没在柱前照过，它在黑里什么也映不出来。"
reply = "黑暗里镜子本该什么也照不见，可柱子背面的字发着很淡的光，映进了镜子。十王一个一个凑过来，弯下腰看。没有人说话。我的手一直没有抖。"

[[tracks.chapters.choices]]
key = "ask"
text = "问他们：你们当年打下的那些地方，后来怎样了"
next = "at3_aztlan"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_council_spoke" }]
reply = "领头的王回答了，答得很长，讲的是几千年前的海。讲到一半，他自己也停下来，像在心里数什么。我听完只说了一句：“那就是没人回去看过。”"

