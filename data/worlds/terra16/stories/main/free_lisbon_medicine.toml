[[tracks.chapters.choices]]
key = "recipe"
text = "把祖母的药方抄进自己的簿子"
next = "done"
effects = [{ kind = "skill", skill = "herbal_medicine", value = 20 }]
reply = "方子上有一味药，我在果阿那座园子里见过，那时候不知道祖母也用它。园丁说，这味药便宜，穷人家也用得起。我把方子抄进簿子最前面，写完才发现，字写得和她一模一样，连末尾那个圈也画得一样小。"

[[tracks.chapters.choices]]
key = "money"
text = "寄一笔钱回去，给家里添一盏新灯"
requires = [{ kind = "cash", ge = 1000 }]
hint = "你的钱这一季都压在货上了。"
next = "done"
effects = [{ kind = "cash", value = -1000 }, { kind = "memory", memory = "mem-free_lisbon_medicine-c01", title = "点着的铜灯" }]
reply = "回信里我写，新灯已经买好，摆在旧灯旁边。旧灯还是点那一盏，新灯只用来看路。我又问了父亲的手，这回问得仔细，连哪根指头不听使唤也问了。"

[[tracks.chapters.choices]]
key = "line"
text = "只回一句：灯点着就好"
next = "done"
effects = [{ kind = "memory", memory = "mem-free_lisbon_medicine-c01b", title = "一句话的回信" }]
reply = "那天晚上，我在船舱里也点了一盏灯。油灯的火很小，舱里的人问起，我说是老习惯，没告诉任何人为什么。灯一直点到天亮，灯芯烧短了一截，我没有去拨它。"
