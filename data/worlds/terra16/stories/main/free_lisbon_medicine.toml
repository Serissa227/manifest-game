# 里斯本的新基督徒医生之子·个人小线（free_lisbon_medicine）
#
# 标签：里斯本的新基督徒医生之子·个人小线。自由船长的模板 custom_lisbon_medicine，家乡港 lisbon。
# “我”不写性别、外貌、肤色与身高，不写名字；speaker = "captain" 时说话的是“我”，别人称“船长”或“医生家的孩子”。
# 依据：史实——葡萄牙宗教裁判所 1536 年设立，此后审问“暗中守犹太教”的新基督徒；加西亚·达·奥尔塔（1501 年生）1534 年到果阿，
#   1563 年在果阿印出《印度草药与药物对话》，他本人出身新基督徒；1580 年阿尔瓦公爵的兵进里斯本，腓力成了葡萄牙的王；
#   波尔多的“葡萄牙商人”社区；威尼斯的犹太人区与伊斯坦布尔的加拉塔。
#   原创——医生一家、那盏周五擦的铜灯、表兄一家、传唤书、祖母的药方、这一线的“周五的灯”。
# 轨道：free_lisbon_medicine（kind = main，auto = true，start = a00_gate）。门槛章 a00_gate 的 when 要求 c12_voyage_custom_lisbon_medicine；
#   default 设 c13_free_lisbon_medicine。
# 秘密：家里暗中守着安息日（祖母星期五擦的那盏灯）。a00 与 a01 只写灯、写画在信封上的灯，不解释；a02 由父亲第一次说出来；永远不进见闻。
# 设置的旗标：c13_free_lisbon_medicine；c13_free_lisbon_medicine_letter_kept、_warned（a01）；_cousin_saved（a02）；
#   _venice、_istanbul、_stay（b01，超时也设 _stay）。
# 读取的旗标：c12_voyage_custom_lisbon_medicine（门槛，由 C12 设）；a02 变体读 _letter_kept、_warned；c01 变体读 _venice、_istanbul、_stay、_cousin_saved。
# 变体：a02 的 v1_warned、v2_kept（整段替换正文）。c01 的 v0_* 三条是“去向 + 表兄来信”的组合变体，排在 v1 至 v3 之前，
#   保证表兄那句话在三个去向里都能出现；v4_cousin 只作兜底（b01 每条路都会设下三个去向之一，v4 不会单独命中）。
# 信物：herbal_draught 不在本文件；主干 c02_summons 的信物选项读它。本线没有 c01_keepsake 章。
# HIST 占位：本文件没有 HIST_ 旗标。
# 等待的包：A9（门槛章的身份条件，若引擎接管开轨道则 auto 改为 false，正文不动）。
# 回忆插画清单（mem-* 键与画面，各不超过 60 字）：
#   mem-free_lisbon_medicine-c01 点着的铜灯：傍晚的窗台上，一盏擦得发亮的旧铜灯第一次点着了火，屋里的老人在灯下坐着。
#   mem-free_lisbon_medicine-c01b 一句话的回信：船舱里，船长对着一张只写了一行字的信纸，油灯在旁边亮着。
# 待核（不进正文）：皮涅罗大夫的人设卡写他“家三代都是老基督徒”，与本线“新基督徒人家”的出身相反；本线的正文只写灯与沉默，
#   不替人设卡辩解。整合时若要统一，改人设卡，不改本文件。
# 年份：正文不写数字年份。

[[tracks]]
key = "free_lisbon_medicine"
name = "周五的灯"
kind = "main"
start = "a00_gate"
auto = true

# A00：门槛见闻。选中别的主角时窗口一过这条线静默结束，什么也不留下。
[[tracks.chapters]]
key = "a00_gate"
title = "擦得发亮的灯"
text = "里斯本旧城的巷子窄，正月的风把晾衣绳吹得直响。井边的女人们说，皮涅罗大夫家的孩子要出海了。老太太每个星期五傍晚，都把窗台上那盏旧铜灯擦得发亮，擦完摆回窗台上，街坊没见它点过。巷口的面包师说，宗教裁判所有个“熟人”这几天常到医生家门口坐坐。“他说是来看病的，看了三回，一回药也没开。”"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "lisbon"
stage = "rumor"
cast = ["c8_lisbon_physician"]
mood = "tender"
news = "里斯本旧城的人说，医生家的孩子要出海了，宗教裁判所的一位熟人这几天常去他家门口喝一杯。"
when = [{ kind = "flag", flag = "c12_voyage_custom_lisbon_medicine" }]

[tracks.chapters.default]
next = "a01_orta"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine" }]

# A01：果阿的药园。1563 年奥尔塔的书印出来之后，父亲托运的药草要送到。
# 不论选哪项，药草都在这一章卸下；超时则由别的船带到，奥尔塔留一封信。
[[tracks.chapters]]
key = "a01_orta"
title = "果阿的药园"
text = "果阿城外，老医生奥尔塔的园子里种着从各处搬来的树。胡椒藤爬满了墙，一棵没见过的树上挂着红豆子。他的书刚印出来，书页间夹着一张勘误，纸角被他捏得发软。父亲托运的那一船欧洲药草，一袋袋卸在园门口。奥尔塔数得比账房还仔细，数到一半停下，说：“书里写错的东西，我改了一半，剩下一半，留给后来的人。”这时他才看见我怀里的信。信封上没有收信人，只画了一盏灯，灯底下一道短线。奥尔塔没有伸手。他看那盏灯看了很久，像是认得，又像是不想认，然后转身走到园门口，朝门外的路望了一眼，像是这一眼已经看了很多年，才把门闩插上。“药草收下了。”他隔着门说，“信你先拿着，有话站在门外说。”我没说出口：父亲在信封上画灯，是给他看，还是给别人看。门缝里传来一声短促的笑。“你父亲还是那么爱写方子？”我说：“家里的话，先看，再开方子。”门后面静了一会儿。"
when = [{ kind = "date", from = [1563, 4, 10] }]
at = "goa"
speaker = "captain"
mood = "tender"
cast = ["garcia_de_orta"]
objectives = [{ kind = "goods", good = "herbs", qty = 10, at = "goa", text = "把父亲托运的药草运到果阿" }]
deadline = [1564, 10, 31]

[tracks.chapters.timeout]
next = "a02_cousin"
effects = [{ kind = "letter", person = "garcia_de_orta", text = "药草托别的船带到了，袋数对得上，我没有计较。你父亲的信我还没有收到。要是在你身上，就留着，等哪天你来园子里再给我。园里的姜黄今年熟得早。" }]

[[tracks.chapters.choices]]
key = "letter"
text = "把父亲的信从门缝里递给他"
next = "a02_cousin"
effects = [{ kind = "cash", value = 600 }, { kind = "item", item = "orta_goa", qty = 1 }]
reply = "他接过信，拆开看了一遍，又折好，放进灶里烧了。火很小，烧得很慢，他一直看着，直到纸角卷成黑灰。出来时，他塞给我一本自己的书，扉页上什么也没写。“替我谢你父亲。”"
news = "果阿城外的老药园，里斯本来的一船草药卸在门口，园主收下了，别的什么也没说。"

[[tracks.chapters.choices]]
key = "keep"
text = "只交药草，信先留在身上"
next = "a02_cousin"
effects = [{ kind = "cash", value = 600 }, { kind = "flag", flag = "c13_free_lisbon_medicine_letter_kept" }]
reply = "他看了我一眼，没问信的事。只说下回来，园子里的姜黄就熟了。他把药草一袋袋收进屋，最后一袋收得很慢。收完了，他才说，有些信拆开了就得回，他这把年纪，不想再回了。"
news = "果阿城外的老药园，里斯本来的人卸下一船草药，园主一袋一袋点过，没留人吃饭。"

[[tracks.chapters.choices]]
key = "warn"
text = "告诉他，里斯本的熟人最近在打听他的家人"
next = "a02_cousin"
effects = [{ kind = "cash", value = 600 }, { kind = "flag", flag = "c13_free_lisbon_medicine_warned" }]
reply = "他沉默了很久，手指在门闩上来回划。最后他说，他的姐妹们还在果阿，哪里也不去。“告诉你父亲，我知道了。”门闩响了一声，他没有开门，也没有再说一句。"
news = "果阿城里的人说，老药园的园主听了一句里斯本来的消息，一个人沉默了很久。"

# A02：传唤书。这一章第一次说出那盏灯的意思：家里一直暗中守着安息日。
# 三个选项各有代价：夜里开船要过一次检定；拿钱拖传唤要有钱；不带人就什么也不留。超时则表兄被带走，由父亲来信。
[[tracks.chapters]]
key = "a02_cousin"
title = "传唤书"
text = "秋天，表兄拿着一张宗教裁判所的传唤书来找我，手在抖。纸是新的，墨还没干透。街坊说他家星期五晚上关着门，星期六不生火。“他们问的不是我做了什么，”表兄说，“是我们家的老人做了什么。”他要带妻子和两个孩子走，去波尔多。那边有一群“葡萄牙商人”，没人问他们星期六做什么。他说话时一直朝码头的方向看，那里系着我的船。父亲站在门口，没进来，也没走。他起身去盆边洗手，水声很响。擦干了手，他才开口，只说了一句：“灯，你祖母是为谁擦的，你现在该知道了。”我没说出口：那盏灯是给安息日擦的。擦完不点，关着门过星期五的晚上和星期六，祖母一辈子都这样。小时候问她那盏灯是给谁看的，她说给老天看，不给人看，我便一直当它是家里的摆设。"
when = [{ kind = "date", from = [1567, 9, 1] }]
at = "lisbon"
speaker = "captain"
mood = "tense"
deadline = [1568, 10, 31]

[tracks.chapters.timeout]
next = "b01_union"
effects = [{ kind = "letter", person = "c8_lisbon_physician", text = "你表兄被带走了。那天是星期五，港口的人来得早，他没来得及跟谁说一句。家里的灯，这个星期五没擦。你在海上，不必急着回信。" }]

[[tracks.chapters.variants]]
key = "v1_warned"
when = [{ kind = "flag", flag = "c13_free_lisbon_medicine_warned" }]
text = "秋天，表兄拿着一张宗教裁判所的传唤书来找我，手在抖。纸是新的，墨还没干透。街坊说他家星期五晚上关着门，星期六不生火。“他们问的不是我做了什么，”表兄说，“是我们家的老人做了什么。”他要带妻子和两个孩子走，去波尔多。那边有一群“葡萄牙商人”，没人问他们星期六做什么。他还说，果阿那边奥尔塔医生的姐妹，前不久也被人问过话了。他说话时一直朝码头的方向看，那里系着我的船。父亲站在门口，没进来，也没走。他起身去盆边洗手，水声很响。擦干了手，他才开口，只说了一句：“灯，你祖母是为谁擦的，你现在该知道了。”我没说出口：那盏灯是给安息日擦的。擦完不点，关着门过星期五的晚上和星期六，祖母一辈子都这样。小时候问她那盏灯是给谁看的，她说给老天看，不给人看，我便一直当它是家里的摆设。"

[[tracks.chapters.variants]]
key = "v2_kept"
when = [{ kind = "flag", flag = "c13_free_lisbon_medicine_letter_kept" }]
text = "秋天，表兄拿着一张宗教裁判所的传唤书来找我，手在抖。纸是新的，墨还没干透。街坊说他家星期五晚上关着门，星期六不生火。“他们问的不是我做了什么，”表兄说，“是我们家的老人做了什么。”他要带妻子和两个孩子走，去波尔多。那边有一群“葡萄牙商人”，没人问他们星期六做什么。他说话时一直朝码头的方向看，那里系着我的船。父亲站在门口，没进来，也没走。他先问那封画了灯的信交了没有。我说没有。他说，也好。然后他起身去盆边洗手，水声很响。擦干了手，他才开口，只说了一句：“灯，你祖母是为谁擦的，你现在该知道了。”我没说出口：那盏灯是给安息日擦的。擦完不点，关着门过星期五的晚上和星期六，祖母一辈子都这样。小时候问她那盏灯是给谁看的，她说给老天看，不给人看，我便一直当它是家里的摆设。"

[[tracks.chapters.choices]]
key = "night"
text = "今夜就开船，把他们一家送去波尔多"
check = { attr = "seamanship", base = 20, per = 7 }
next = "b01_union"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine_cousin_saved" }]
reply = "船过河口时，表兄的小女儿趴在船舷上问，为什么船上不点灯。我说，等到了地方再点。她点点头，回身去拉母亲的袖子，像是要把这句话带过去。"
news = "里斯本河口夜里悄悄离了一条小船，船上多了几口人，天亮以后港务所的人才发现。"
fail = { next = "b01_union", effects = [], news = "河口的沙洲搁了船，天亮前港务官的小艇靠了过来，那家的男人把妻儿塞进货舱，自己跳上了小艇。" }

[[tracks.chapters.choices]]
key = "bribe"
text = "先去找那位熟人，用钱把传唤拖一拖"
requires = [{ kind = "cash", ge = 1200 }]
hint = "你凑不出能让那位熟人闭嘴的钱。"
next = "b01_union"
effects = [{ kind = "cash", value = -1200 }, { kind = "flag", flag = "c13_free_lisbon_medicine_cousin_saved" }]
reply = "熟人收了钱，笑着说：“病总会好的。”传唤拖了一个月，够表兄一家坐别人的船走了。我在码头上看着那张传唤书被风吹进水里，没去捡。"
news = "里斯本旧城的一位熟人最近手头宽裕，街坊说他嘴上只挂着一句：病总会好的。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不带他们，船上人多嘴杂"
next = "b01_union"
effects = []
reply = "表兄没求第二遍，转身走了。父亲那天晚上把灯擦了很久，擦到窗台上映出一圈光，也没有点。第二天一早，巷口那位熟人又来了，在医生家门口喝了一杯，问的还是街坊的病。"
news = "里斯本的码头上，一个男人牵着两个孩子走到船边，又牵着他们回了巷子。"

# B01：来信。阿尔瓦公爵的兵进了里斯本以后，父亲问“我”家里该不该走，走去哪里。无 at，在海上也能收到。
# 三个去向各设一个旗标；超时（1581 年底前没有回信）按留下处理。
[[tracks.chapters]]
key = "b01_union"
title = "新王进城那天"
text = "孩子：阿尔瓦公爵的兵从阿尔坎塔拉进了城，城里的钟敲了一整天，敲完就没人再出门。腓力成了葡萄牙的王，他的人说，新王的宗教裁判所不会比旧的松。街坊里已经有三家卖了房子，一家往威尼斯去，一家往伊斯坦布尔，还有一家，没人知道去了哪里。巷口的那位熟人上个月不来了。我不知道是高升，还是在等什么。我的手抖得厉害，字写歪了，你看不惯就算了。我问你，家里该不该走，走去哪里。我想了很久，想不出来，这件事你替我拿主意。你在海上，回信慢也没关系。我对你祖母说：“可不是哪里都能点灯。”她没理我，只说了一句，我替她抄在信的最后：“哪里都有星期五。”"
when = [{ kind = "date", from = [1580, 9, 15] }]
speaker = "captain"
mood = "sad"
deadline = [1581, 12, 31]

[tracks.chapters.timeout]
next = "c01_lamp"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine_stay" }]

[[tracks.chapters.choices]]
key = "venice"
text = "回信：去威尼斯"
next = "c01_lamp"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine_venice" }]
reply = "我回信写了威尼斯哪条街的犹太人区，哪个商人在那里认得家里的人。还画了一张小图：运河边的窄巷，巷口一口井，井边一扇开着的窗。信末我没有署名，只写：窗户开着，灯就看得见。"

[[tracks.chapters.choices]]
key = "istanbul"
text = "回信：去伊斯坦布尔"
next = "c01_lamp"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine_istanbul" }]
reply = "我回信说，伊斯坦布尔的苏丹不管人星期六生不生火。路远，可那里有一条街，住的多是从西边来的人。我把街名写在了信上，又添一句：先到卖灯油的铺子问。我想，这一句父亲会看懂。"

[[tracks.chapters.choices]]
key = "stay"
text = "回信：留在里斯本，灯照旧不点"
next = "c01_lamp"
effects = [{ kind = "flag", flag = "c13_free_lisbon_medicine_stay" }]
reply = "我回信只写了一句：房子在，人在，灯在。写完觉得自己太狠，又添了一句，问父亲的手好些没有。信袋交给下一班船的时候，风很大，我一直看着它被装上小船。"

# C01：终章。又一封家信，这回是别人代写的。那盏铜灯第一次点着了；点灯的地方由去向的变体写出。
# 变体排列：v0_* 三条是“去向 + 表兄来信”，v1 至 v3 是去向，v4 只作兜底。
[[tracks.chapters]]
key = "c01_lamp"
title = "点着的灯"
text = "又一封家信，这回不是父亲的字。他的手已经拿不住笔，信是别人代写的，末尾才由他自己添了一行。点灯的地方，他没有写名字，只说是那间朝西的屋子。信里写的是一个星期五的傍晚。那盏擦了几十年的旧铜灯，第一次点着了。灯芯拨了又拨，火才稳下来，屋里的人都站着，没有人先坐下。灯点着的时候，他想起我出海那天的早上，我站在码头上，眼睛看的是河口。他让人写下：“灯点着了。你祖母要是在，会先骂我点得太早，天还没黑。”他还让人写：你小时候问我，为什么先看舌头。我说，先看，再开方子。这句话你该还记得。信末附了祖母留下的一张药方，纸已经发黄，字迹是她的。方子末尾描着一个小小的圈，像一盏灯。"
when = [{ kind = "date", from = [1584, 3, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1586, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "v0_istanbul_cousin"
when = [{ kind = "flag", flag = "c13_free_lisbon_medicine_istanbul" }, { kind = "flag", flag = "c13_free_lisbon_medicine_cousin_saved" }]
text = "又一封家信，这回不是父亲的字。他的手已经拿不住笔，信是别人代写的，末尾才由他自己添了一行。点灯的地方是伊斯坦布尔加拉塔的一座木房子，邻居是从萨洛尼卡来的人家。信里写的是一个星期五的傍晚。那盏擦了几十年的旧铜灯，第一次点着了。灯芯拨了又拨，火才稳下来，屋里的人都站着，没有人先坐下。灯点着的时候，他想起我出海那天的早上，我站在码头上，眼睛看的是河口。他让人写下：“灯点着了。你祖母要是在，会先骂我点得太早，天还没黑。”他还让人写：你小时候问我，为什么先看舌头。我说，先看，再开方子。这句话你该还记得。信末附了祖母留下的一张药方，纸已经发黄，字迹是她的。方子末尾描着一个小小的圈，像一盏灯。波尔多的表兄也来了信，说他的小女儿每个星期五都抢着点灯。"

