# at3：班顿的下半句。无 at，个人终章；没有缺省。
[[tracks.chapters]]
key = "at3_lower_half"
title = "班顿的下半句"
text = "离开前的早上，外港的码头还没醒透，三色的石阶上挂着露水。伊斯梅妮来送我，手里拿着律文卷子，卷子的角被她的手指磨得发毛。她说：“律文里每一条都有后半句。你的呢？”我这辈子说过无数个班顿的上半句，从没说过下半句。下半句是意思，我总是留给对方去猜，猜错了也不改。这一回码头上没有人跟我对歌，只有一条小船在石阶下等着，船夫一下一下拍着桨架。我没有接她的卷子，在门槛边上坐下。门槛是石头的，坐下去还带着夜里的凉。她站在我面前等，说：“你不说，我就当你没有。”我把两行念了出来：“树是种树的人种的，价就由他开；船先靠了岸，人先坐下，秤后才抬来。”念完，雾在船后慢慢散开，石阶上的露水一颗一颗滚下去。"
when = [{ kind = "date", from = [1583, 10, 1] }]
cast = ["ismene"]
speaker = "captain"
mood = "tender"

[[tracks.chapters.choices]]
key = "say_it"
text = "把下半句说给伊斯梅妮听"
next = "done"
reply = "她听完，把两行字一个一个写在律文卷子的末尾，笔尖在每个字上都停一停。写完她把卷子合上，说：“律文里没有这一条。我替它找个地方放，放在柱子旁边，让后来的人也能读。”她没有问下半句是谁教的，只问：“那秤是谁的？”我说：“是这条船上的，还没抬下来。”她笑得很轻，说那就对了，又翻回卷子第一页，在页边添了一个小小的记号。我上船时没有回头，码头上的雾一直跟到船尾。她在柱子那边念那两行字的声音，隔着雾还听得见一点。"
effects = [{ kind = "title", title = "对出下半句的人" }, { kind = "memory", memory = "mem-main_kaicili_atlantis-at3", title = "班顿的下半句" }, { kind = "affinity", person = "ismene", value = 6 }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]

[[tracks.chapters.choices]]
key = "carry_home"
text = "下半句带回去，说给特尔纳特的种树人听"
next = "done"
reply = "我朝她行了吉里学来的礼，说下半句要在岛上说才对得上。她点头：“那我记着上半句。”她把卷子抱在怀里，没有再问。回程的雾很薄，船过了几座小岛，我一路在心里把那两行念熟，念到不看舱板也能说出来。到了特尔纳特，丁香园里的老人们已经在等着听了。他们问下半句在哪里，我说：“下半句在我的船上，秤还没搬下船。”有个老人笑着骂了一句，转身拿来一块木板，让我把那两行写上去，挂在井边。"
effects = [{ kind = "memory", memory = "mem-main_kaicili_atlantis-at3", title = "班顿的下半句" }, { kind = "reputation", faction = "ternate", value = 5 }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]

[[tracks.chapters.variants]]
key = "gave"
when = [{ kind = "flag", flag = "c13_main_kaicili_atl_gave" }]
text = "离开前的早上，外港的码头还没醒透，三色的石阶上挂着露水。伊斯梅妮来送我，手里拿着律文卷子，卷子的角被她的手指磨得发毛。她说：“律文里每一条都有后半句。你的呢？”我这辈子说过无数个班顿的上半句，从没说过下半句。下半句是意思，我总是留给对方去猜，猜错了也不改。这一回码头上没有人跟我对歌，只有一条小船在石阶下等着，船夫一下一下拍着桨架。我没有接她的卷子，在门槛边上坐下。门槛是石头的，坐下去还带着夜里的凉。她站在我面前等，说：“你不说，我就当你没有。”我把两行念了出来：“树是种树的人种的，价就由他开；船先靠了岸，人先坐下，秤后才抬来。”念完，雾在船后慢慢散开，石阶上的露水一颗一颗滚下去。卷子里夹着的那枝丁香，花已经谢了，香还在。"
