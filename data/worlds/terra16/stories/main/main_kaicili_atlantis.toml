# C13c 亚特兰蒂斯补章·凯奇利（Claude 写，仅中文）。
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_kaicili_atlantis_over，主线“那以后”章 c05_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
#   at2 期限 1584-12-31 收到 1583-10-15：at2 的门槛是 atlantis_council_met，会议窗口止于 1583-09-30，没赶上会议的局不再空等一年多，到期照旧进 at3。
# 标签：main（凯奇利的亚特兰蒂斯补章，3 章）；轨道 main_kaicili_atlantis（kind=main，auto=true，start=at1_clove）。
# 登记：暂存。A8 E63（帷幕与 atlantis_port 可达）与 C11 第二轮（atlantis_council 轨道、atlantis_council_met、判决旗标）合进来以前不登记进 world.toml；
#       不登记时主线照样走完，主线 c04 与 c02 不读这里的旗标。
# 依据·史实：TERRA16 §6.1（《克里提亚斯篇》的外港、三色石、山铜、律法柱与十王的起誓）、§8.5（1583 十王的会议，H56）。
#       柏拉图的亚特兰蒂斯只从人物的念头与物件里透出来，不讲课。
# 依据·原创：外港的丁香开花、班顿的上半句与下半句、伊斯梅妮的律文卷子、刀柄上的许诺、门槛边上的那两行。
# 待核：十王的名字与判词的内容归 C11；本文件不写十王的名字，也不写判词本身，判词只在变体里加一句。
# 秘密：本文件不揭开任何秘密。父亲与堡垒的事不在本文件出现。
# 人物：伊斯梅妮（ismene，cast 已有，1564 年生）只守庙、只读律文，不谈情；不写带银枝的女人（C11 的人物，还不在 cast）。
# 读的旗标：c13_main_kaicili（at1 门槛，主线 a00 设）；c13_main_kaicili_crossed（at1 门槛，主线 c04 设）；
#       c13_main_kaicili_keepsake（at1 的 give_sprig 与 no_sprig 变体，主线 c02 设）；
#       atlantis_council_met（at2 门槛）；atlantis_verdict_close / atlantis_verdict_open（at2 的两个变体，C11 设）；
#       c13_main_kaicili_atl_gave（at3 变体，本文件 at1 设）。
# 设的旗标：c13_main_kaicili_atl_gave（at1 交出丁香）。
# 其他效果：称号“对出下半句的人”（at3 say_it）；回忆 mem-main_kaicili_atlantis-at3「班顿的下半句」（at3 两个选项都设）；特尔纳特声望 +5（at3 carry_home）。
# 缺省走向：at1 期限 1584-12-31，到了静默结束（timeout 不写见闻）；at2 同一期限，超时照走 at3，不改判；at3 没有缺省，等玩家回应。
# 见闻：at1 有港口，转折写在选项与失败分支上；at2、at3 没有 at，不写见闻。
# 检定失败的回复：引擎失败时显示 fail 分支的 news，所以失败的回复写在 fail.news 里，码头口吻，带地名。
