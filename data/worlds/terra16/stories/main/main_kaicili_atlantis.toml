cast = ["ismene"]

# at1：山铜城里的丁香。门槛：身份旗标与主线 c04 的越过旗标；期限到了静默结束。
[[tracks.chapters]]
key = "at1_clove"
title = "山铜城里的丁香"
text = "外港的码头是红、白、黑三色的石头砌成的，墙上包着一层发红光的金属，山铜。空气暖得像雨季前的特尔纳特。贴身的那枝丁香在这股暖气里开了花，白瓣一朵朵张开，我自己先闻见了。守律法柱的女祭司站在码头上等，年纪不大，怀里抱着一卷律文。她开口就问：“你为什么来？这个先说。谁家的人，晚一点再问不迟。”我说想替七十二座岛说一句话。她又问：“你们岛上的东西，是怎么定价的？”这一问，我第一次答不出一个数。我说：“先坐下，先听种树的人说。”心里却想，开了花的丁香，在这里才第一次不是货。"
when = [{ kind = "flag", flag = "c13_main_kaicili" }, { kind = "flag", flag = "c13_main_kaicili_crossed" }]
at = "atlantis_port"
cast = ["ismene"]
speaker = "captain"
mood = "mystic"
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]

[[tracks.chapters.choices]]
key = "give_sprig"
text = "把那枝开了花的丁香交给伊斯梅妮"
next = "at2_council"
requires = [{ kind = "flag", flag = "c13_main_kaicili_keepsake" }]
hint = "你空着手来的，那枝丁香留在了哥哥的枕边。"
reply = "她把丁香翻过来看背面，看花萼，看断口，看了很久：“外面来的东西，背面也一样认真。”她把它夹进律文的卷子里，抱紧了些，领我往内城走。路上她只问了一句：“这花是几时开的？”我说，是进了这道门才开的。她没有再问。"
news = "听说亚特兰蒂斯外港有个外来的人，把开了花的丁香交给守律法柱的女祭司，她夹进了律文卷子里。"
effects = [{ kind = "flag", flag = "c13_main_kaicili_atl_gave" }, { kind = "affinity", person = "ismene", value = 8 }]

[[tracks.chapters.choices]]
key = "pantun_gate"
text = "用一首班顿的上半句，回答她的来意"
next = "at2_council"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "我开口念：“山铜墙上的日头晃成一圈，丁香花落进红石的缝里。”她听完两行，问下半句呢。我说下半句要等议完了才对得出。她笑了一下。年长的祭司们说她不懂规矩，她看着这个外来的人，觉得他也不懂。"
news = "亚特兰蒂斯外港，守庙的女祭司被一个外来的人用两行景物问住了，没骂他，倒笑了一下。"
effects = [{ kind = "affinity", person = "ismene", value = 5 }, { kind = "skill", skill = "poetry", value = 4 }]
fail = { next = "at2_council", effects = [], news = "亚特兰蒂斯外港，守庙的女祭司说律文上没有拿诗答话的规矩，叫那个外来的人明天再来。" }

[[tracks.chapters.variants]]
key = "no_sprig"
when = [{ kind = "flag", flag = "c13_main_kaicili_keepsake", value = false }]
text = "外港的码头是红、白、黑三色的石头砌成的，墙上包着一层发红光的金属，山铜。空气暖得像雨季前的特尔纳特。我没带丁香，头巾的金丝里却还留着一点丁香味，是出门前从哥哥枕边那一枝上蹭到的。守律法柱的女祭司站在码头上等，年纪不大，怀里抱着一卷律文。她先闻到了，才抬眼看我。她开口就问：“你为什么来？这个先说。谁家的人，晚一点再问不迟。”我说想替七十二座岛说一句话。她又问：“你们岛上的东西，是怎么定价的？”这一问，我第一次答不出一个数。我说：“先坐下，先听种树的人说。”"

# at2：会上的岛国。无 at，C11 的会议旗标一到就弹出（夜里）。判词归 C11；变体只按判决旗标加一句。
[[tracks.chapters]]
key = "at2_council"
title = "会上的岛国"
text = "律法柱前的夜，牛血的味道还没散，火把一支支熄了。十位王在黑暗里起誓，声音从四面压过来，柱子上的字在最后一点反光里闪了一下。我站在柱子外圈，手里没有冠，也没有印，只有腰间那把“海之灵”。柱脚的铜钉还留着刚熄的火把的热气。伊斯梅妮站在柱边，捧着律文，低声提醒我：“把誓词读完，再碰那根柱子。”轮到我了。黑暗里有人问，外面的海要不要这座岛来管。我没有碰柱子，只把手按在刀柄上，说：“我们岛上，外来的船先上岸，先坐下，先听。你们也一样。”"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
deadline = [1583, 12, 31]
cast = ["ismene"]
speaker = "captain"
mood = "tense"
night = true

[tracks.chapters.timeout]
next = "at3_lower_half"
effects = []

[[tracks.chapters.choices]]
key = "close"
text = "按着刀柄说：雾里有雾里的人，合上那片海"
next = "at3_lower_half"
reply = "柱子外圈静了一下。伊斯梅妮在律文的卷子上点了一下，没有抬头，手指停在一行字上，过了很久才翻到下一页。判不判，不是我一个人说了算；我说完，退回黑暗里，手还按着刀柄，刀柄上的鱼骨纹硌得掌心发疼。"
effects = [{ kind = "affinity", person = "ismene", value = 4 }]

[[tracks.chapters.choices]]
key = "open"
text = "按着刀柄说：让船来，可要先上岸、先坐下"
next = "at3_lower_half"
reply = "有一位王笑出了声，问小岛凭什么给大海立规矩。我也笑：“凭丁香长在我们的岛上。”黑暗里又有人问：“那海呢？海凭什么？”我没有答，等他们自己想。伊斯梅妮把这两句话都记在了律文的末页上，一个字也没有改。"
effects = [{ kind = "skill", skill = "negotiation", value = 4 }]

[[tracks.chapters.variants]]
key = "a_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "律法柱前的夜，牛血的味道还没散，火把一支支熄了。十位王在黑暗里起誓，声音从四面压过来，柱子上的字在最后一点反光里闪了一下。我站在柱子外圈，手里没有冠，也没有印，只有腰间那把“海之灵”。柱脚的铜钉还留着刚熄的火把的热气。伊斯梅妮站在柱边，捧着律文，低声提醒我：“把誓词读完，再碰那根柱子。”轮到我了。黑暗里有人问，外面的海要不要这座岛来管。我没有碰柱子，只把手按在刀柄上，说：“我们岛上，外来的船先上岸，先坐下，先听。你们也一样。”判下来了，雾要合上。我想起班达一位老人递过来的那杆小秤。"

