[[tracks.chapters.choices]]
key = "hand"
text = "星盘留在家里，只把星路抄好，交给守得住的人"
next = "c05_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_najma_stance_hand" }, { kind = "chart", region = "agulhas" }, { kind = "chart", region = "cape_good_hope" }]
reply = "我把星盘交给母亲，收进嫁妆箱，只带一卷抄得工工整整的星路。抄本的最后一页，我没有写名字。给谁，到了那里再定。"

[[tracks.chapters.variants]]
key = "idris"
when = [{ kind = "flag", flag = "c13_main_najma_idris_heard" }]
text = "夜里，船泊着，我把外曾祖父的星盘贴在眼前，对准星路最后一联里的那颗星。摩卡那位长老说的“柱子外头”，原来就落在这一联上。那颗星落在西边，落下去的地方，诗里写的是“柱子外头”。我算过：从这里去，要绕过索法拉以南的海，过好望角，再往北。走的正是当年法兰克人来的那条路，只是倒着走。星盘边上的刻度在灯下发亮，被几代人的拇指磨得没了棱。值夜的水手探头问：“领航，今晚还量吗？”我：“量到天亮。星又不会跑。”我（心里）：最后一联的星，落在柱子外头。我（心里）：他们说他替法兰克人引了路。这一回，我替他把路走完。"

[[tracks.chapters.variants]]
key = "no_route"
when = [{ kind = "flag", flag = "c13_main_najma_star_route", value = false }]
text = "夜里，船泊着，我把外曾祖父的星盘贴在眼前，对准星路最后一联里的那颗星。星路我一直没量通，可最后那一联我背得出。那颗星落在西边，一年比一年亮，落下去的地方，诗里写的是“柱子外头”。我算过：从这里去，要绕过索法拉以南的海，过好望角，再往北。走的正是当年法兰克人来的那条路，只是倒着走。星盘边上的刻度在灯下发亮，被几代人的拇指磨得没了棱。值夜的水手探头问：“领航，今晚还量吗？”我：“量到天亮。星又不会跑。”我（心里）：最后一联的星，落在柱子外头。我（心里）：他们说他替法兰克人引了路。这一回，我替他把路走完。"

# c05 柱外的星：1583 年，黑暗之海。穿过、掉头或缺席。
[[tracks.chapters]]
key = "c05_dark_sea"
title = "柱外的星"
text = "特塞拉岛的安格拉，港里全是船：西班牙的、法国的、葡萄牙流亡王子的，岛上的炮声一天没停。我在港外加了水，往西开。两天以后风停了。海面铺满了黄褐色的海草，船像陷在一片烂泥里。罗经的针一会儿指这边，一会儿指那边。水手：“领航！针在打转！”我：“针转它的。看星。”有人在桅下小声说：“掉头吧，风还在东边。”夜里雾上来了，浓得能攥出水来，船头的灯只照出一丈。雾里远远有一点光，低得贴着水，不像星。我把蜡板上的星路摊在膝头，天上的星只剩雾缝里的几颗。罗经乱了，可星没乱。雾缝里露出来的，正是星路上的那一颗。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["najma"]
speaker = "captain"
mood = "mystic"
night = true
news = "安格拉港里的人说，特塞拉岛打仗那个夏天，有一条阿拉伯人的桑布克加了水就往西去了。"

[tracks.chapters.default]
next = "c06_after"
effects = [{ kind = "flag", flag = "c13_main_najma_absent" }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }]
news = "亚速尔那年夏天，西班牙的船打下了特塞拉岛，港里的人说西边的海草长到了船底。"

[[tracks.chapters.choices]]
key = "star_route"
text = "照外曾祖父的星路，一颗星一颗星地走进去"
requires = [{ kind = "item", item = "majid_hidden_route", qty = 1 }, { kind = "flag", flag = "c11_atlantis_key_ready" }]
next = "c06_after"
effects = [{ kind = "flag", flag = "c13_main_najma_crossed" }, { kind = "flag", flag = "c13_main_najma_star_route_used" }, { kind = "memory", memory = "mem-main_najma-c05", title = "柱外的星" }]
hint = "那几行诗你一直没量通，雾里认不出该跟哪颗星。"
reply = "“第九颗，九指。差一指，就差一百里——别动舵。”我一颗一颗报数，舵手一指一指转舵。海草从船底退开，雾在船头裂开一条缝，缝里有一座灯塔，塔顶的火是铜色的。"

[[tracks.chapters.choices]]
key = "tabula"
text = "照那片抄着翠玉的纸上的话走"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
next = "c06_after"
effects = [{ kind = "flag", flag = "c13_main_najma_crossed" }, { kind = "memory", memory = "mem-main_najma-c05", title = "柱外的星" }]
hint = "你手里没有那片抄着翠玉的纸。"
reply = "纸上的拉丁字我只认得几个，可我照着“下者如同上者”那一句，把星路倒过来读。海里的倒影和天上的星对上了。雾开了。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "罗经乱了，掉头回有风的地方"
next = "c06_after"
effects = [{ kind = "flag", flag = "c13_main_najma_turned_back" }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }]
reply = "我让舵手掉头。往东走了一天一夜，风回来了，海草留在了身后。那点贴着水的光一直没有跟来，也一直没有灭。"
news = "安格拉港的人说，一条阿拉伯人的桑布克加了水往西去，两天后又掉头回来了，船上的人一个字也不肯讲。"

# c06 回来的领航人：那以后。缺省文本不依赖 C11；变体读 atlantis_council_met。
[[tracks.chapters]]
key = "c06_after"
title = "回来的领航人"
text = "秋天，我回到印度洋，季风正要转，有几天海上连一只鸟都看不见。水手们不提那片海草，我也不提。蜡板上的星路还在。最后几颗星旁边，我画了一个问号。这几行字怎么办，我得自己定：写进航路书，只讲给一个人，还是烧掉。水手：“领航，那几夜的事，记不记进航簿？”我：“记在蜡板上。航簿等我想好。”我（心里）：路写下来，就是谁都能走的路。"
cast = ["najma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }]
deadline = [1585, 12, 31]

[tracks.chapters.timeout]
next = "c07_mombasa"
effects = []

[[tracks.chapters.choices]]
key = "write"
text = "把柱外那几行写进自己的航路书"
next = "c07_mombasa"
effects = [{ kind = "flag", flag = "c13_main_najma_route_written" }, { kind = "skill", skill = "cartography", value = 6 }]
reply = "我换了新墨，一行一行写：星名、指数、哪里有海草，哪里针会乱。写完那一页，我没有押韵。"

[[tracks.chapters.choices]]
key = "tell_one"
text = "只讲给一个人：写信给蒙巴萨的巴拉卡"
next = "c07_mombasa"
effects = [{ kind = "flag", flag = "c13_main_najma_route_told" }]
reply = "信写得很短，只有那几颗星和一句“你别笑”。我知道他会笑，也知道他会把信收进那只装砝码的黄铜小箱，一辈子不拿出来给别人看。"

[[tracks.chapters.choices]]
key = "burn"
text = "把那几行烧掉：这条路到我为止"
requires = [{ kind = "item", item = "majid_hidden_route", qty = 1 }]
next = "c07_mombasa"
effects = [{ kind = "flag", flag = "c13_main_najma_route_burned" }, { kind = "item", item = "majid_hidden_route", qty = -1 }]
hint = "那几行诗本来就不在你手里。"
reply = "我在船尾点了一盏灯，把蜡板上的字一行一行刮下来，蜡屑扔进海里。最后一颗星我刮得最慢。外曾祖父的手稿还在家里，那一页，我用线缝上了。"

[[tracks.chapters.variants]]
key = "council"
when = [{ kind = "flag", flag = "atlantis_council_met" }, { kind = "flag", flag = "c13_main_najma_crossed" }]
