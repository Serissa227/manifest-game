# b07 兀鲁伯的表：马六甲的回回商人，日食之争（L23）。
[[tracks.chapters]]
key = "b07_eclipse"
title = "兀鲁伯的表"
text = "马六甲，葡萄牙人的白堡压在山头，城外克林人的街上挤着香料与布。亚齐的船队这两年屡次来攻，城门查得紧。一个广州来的回回商人在清真寺后院等我。他摊开一部残缺的星表，页边写满汉字：北京钦天监的回回科要和大统历的人比一场日食，缺的是兀鲁伯那部撒马尔罕星表的后半，还有会推的人。残表的页角被虫蛀了，蛀洞正好吃掉了几行数。“京里的人说，这回输了，回回科就要关门。”他说。我看着蛀洞。“蛀掉的是第十一表的后三行。我背得出。”我不看就把那几行补了上去。商人当场跪了下来，求我跟船去广州。我（心里）：往东的海，诗里一句也没写过。"
at = "malacca"
cast = ["najma"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1573, 1, 1] }]
deadline = [1574, 1, 31]
news = "马六甲克林人街的清真寺里，广州来的回回商人在找会推兀鲁伯星表的人。"

[tracks.chapters.timeout]
next = "b09_surat"
effects = []
