# c09 星的路：终章。三选一。超时落在“世界的领航人”。
[[tracks.chapters]]
key = "c09_epilogue"
title = "星的路"
text = "我的航路书摊在膝上。前半本是外曾祖父的诗抄，后半本是我三十多年的数：亚丁的开航日，马尔代夫环礁的口子，广州光塔的方位，亚丁外海那几块黑石，蒙巴萨北水道退潮时的深浅。铜星盘挂在舱壁上，刻度又被我的拇指磨亮了一层。舱外的海很平，夜里的星一颗一颗都在，连最暗的那颗也在。最后一页还没有写字，纸边上却已经有了一圈被手指蹭黑的印子。我翻到第一页。那是 1557 年亚丁开航日那天，我抄下的针路。那时我以为领航就是报准每一指。水手在船尾探头：“领航，明年的开航日，写哪一天？”我：“比墙上早两天。”我（心里）：这一页，得我自己来写。书往哪里去，我还没定：留在船上，换成生意，还是交给学生。我：“往南。南边的星，我还有几颗没量。”"
cast = ["najma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1589, 6, 1] }]
deadline = [1590, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "flag", flag = "c13_main_najma_done" }, { kind = "flag", flag = "c13_main_najma_end_pilot" }]

[[tracks.chapters.choices]]
key = "end_pilot"
text = "航路书留在船上，接着领航"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_najma_done" }, { kind = "flag", flag = "c13_main_najma_end_pilot" }, { kind = "title", title = "世界的领航人" }]
reply = "我在最后一页写下明年的开航日，往后推了一遍，比港务所墙上的早两天。然后合上书，去船头量今晚的第一颗星。星出来得很准。我报了数，舵手照着转。天亮以后，海还是那片海，我还是那个报数的人。"

[[tracks.chapters.choices]]
key = "end_merchant"
text = "用这些年的海路，在红海做咖啡与书的生意"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_najma_done" }, { kind = "flag", flag = "c13_main_najma_end_merchant" }, { kind = "cash", value = 2000 }]
reply = "我在摩卡和吉达之间开了一条船路，舱里一半咖啡，一半书。船票上印着一颗星。苏菲的兄弟们说，我压价压得比督察还狠，可他们每个月都还是来码头上等我。"

[[tracks.chapters.choices]]
key = "end_scholar"
text = "回扎比德，把航路书讲给学生听"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_najma_done" }, { kind = "flag", flag = "c13_main_najma_end_scholar" }, { kind = "skill", skill = "astral_navigation", value = 8 }]
reply = "我在扎比德的讲堂里讲第一堂课。学生里有领航人的孩子，也有采珠人的女儿。我先问每个人从哪里来，要他报一个纬度。"

