[[tracks.chapters.variants]]
key = "same_master"
when = [{ kind = "flag", flag = "c13_main_najma_gujarati_master" }]
text = "霍尔木兹岛，红土、盐壳，岛上没有一口甜水井，运淡水的船一天三趟靠岸。葡萄牙人的堡垒压在港口上，商馆门口排着领通行证的船主。去年开航日我领去卡利卡特的那位古吉拉特船主，把我请进货栈，开口先提那卷针路，说“咱们是一条船上下来的”。他摊开一张旧的卡塔兹，一块蜂蜡，一支细笔：他要运胡椒去吉达，通行证上不许。只要照着葡萄牙船长的印描一方，再把货单改一行。最扎眼的是新纸上的“领航”一栏。那一栏里，已经写好了我的名字。“你外曾祖父那样的人，还怕一张纸？照着描一遍就行。”船主说。“这张纸上，海是他们的。我的名字不该在上头。”我说。我看着印上那只十字的四个角，差了不到半粒米。描得出来。"

# a05 半句诗：盲眼的贾法尔。
[[tracks.chapters]]
key = "a05_jafar"
title = "半句诗"
text = "傍晚，霍尔木兹运淡水的码头边，说书的角落里摆着一圈矮凳，一只讨钱的铜碗。盲眼的贾法尔拿手杖敲着地，讲他小时候见过的老领航伊本·马吉德。人群里有人起哄：“给法兰克人引路去印度的，不就是他？”贾法尔的脸涨红了，却说不出一句叫人闭嘴的凭据。他闻到了我身上的海盐，又听出了我的口音，忽然放慢声音，念了一联写南方星的诗。只念了上半句。念到一个词的时候，他顿了一下。贾法尔（手杖敲地）：“这一段，我是听他亲口说的。”起哄的人：“给法兰克人领路的不就是他？”我：“谁说的？哪一年？哪条船？”"
at = "hormuz_port"
cast = ["jafar"]
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1559, 1, 1] }]
deadline = [1560, 12, 31]
news = "霍尔木兹码头的盲眼说书人贾法尔逢人便说，伊本·马吉德家的后人在他的说书摊前站了半个时辰。"

[tracks.chapters.timeout]
