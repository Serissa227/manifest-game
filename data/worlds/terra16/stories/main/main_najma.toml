# a07 胡椒与哈里发：亚齐的使节，要一个认得红海的领航。
[[tracks.chapters]]
key = "a07_aceh"
title = "胡椒与哈里发"
text = "亚齐的王城，河口码头上胡椒袋垒得比人高，空气辣得睁不开眼。苏丹阿拉乌丁·卡哈尔在廊下听事，由通事传话，问话短得像发令。他先问的不是航路，是：“葡萄牙人查过你的船吗？”我说查过，在霍尔木兹海峡，一条巡船，一面旗。苏丹听完，只点了一下头。他要再派使节去伊斯坦布尔，求苏丹的炮和炮匠。这一程不能经马六甲，要从苏门答腊往西，过锡兰以南、马尔代夫，直进红海。他要一个认得吉达外礁的阿拉伯领航。使节的礼单装在一只金线绣的囊里，囊口封着苏丹的印。苏丹（通事传话）：“你多说一句废话，就有一船胡椒误了季风。”我：“过锡兰以南，要等哪颗星落到几指，我心里有数。”我（心里）：不经马六甲，不经第乌。这条路，诗里写过。"
at = "aceh_port"
cast = ["najma", "alauddin_al_kahar"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1563, 6, 1] }]
deadline = [1565, 12, 31]
news = "亚齐的苏丹又要派人去伊斯坦布尔求炮，码头上的人说他在找一个认得红海的领航人。"

[tracks.chapters.timeout]
