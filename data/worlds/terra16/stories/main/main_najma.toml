# a06 巡船靠了过来：无地点，立刻弹出。不写海战。
[[tracks.chapters]]
key = "a06_patrol"
title = "巡船靠了过来"
text = "海上，上午。一条葡萄牙人的桨船从下风处靠过来，桅上挂着基督骑士团的十字。他们要看通行证、船员名单和火器清单，一条一条对。巡船上的领航是个上了年纪的马拉巴尔人，一直盯着我腰间那只铜星盘看。桨手们光着背，桨一下一下落进水里，声音像鼓。军官（通事传话）：“通行证。没有就罚，或者跟我们回霍尔木兹的堡里说清楚。”我算了算风和水道。天黑以后，海峡里有一片浅滩，大船不敢跟。老领航忽然压低声音：“这刻度……是马吉德家的？”我（心里）：天黑后的浅滩，北极星压在第二根桅绳上的时候能过。"
cast = ["najma"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1560, 3, 1] }]
deadline_days = 90

[tracks.chapters.timeout]
next = "a07_aceh"
effects = [{ kind = "reputation", faction = "portugal", value = -2 }]
news = "葡萄牙巡船的簿子上记了一条尤尔法桑布克的船名，说她不肯停船受查。"

