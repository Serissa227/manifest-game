# b09 画着圣像的通行证：莫卧儿女眷的朝觐船，葡萄牙书记念出的那个名字。
[[tracks.chapters]]
key = "b09_surat"
title = "画着圣像的通行证"
text = "苏拉特，塔普蒂河口。帕迪沙的大船萨利米号泊在河心，女眷们的帐篷在岸上搭了快一年。等的就是葡萄牙人那张通行证，它终于从达曼送来了。听说纸上画着他们的圣像。女眷里有人不肯伸手去接。古尔巴丹公主照样接了过来，转手交给侍女收好，说：“纸是纸，路是路。”送通行证来的葡萄牙书记在码头上闲坐，捧着一本他们国家的编年史，念得很得意。念到达伽马在马林迪雇的那个领航员，他念出一个我念不准的名字。我让他又念了一遍，记住了那几个音，不知道它有什么用。“你走海路来的？那你一定知道，从苏拉特到吉达要走多少天。”古尔巴丹问我。帘子后面，萨利玛问：“你们海上的人，管睡不着的夜叫什么？”我（心里）：画着圣像的纸。海不认得圣像，星也不认得。"
at = "surat"
cast = ["najma", "gulbadan_begum", "salima_sultan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1576, 6, 1] }]
deadline = [1576, 10, 31]
news = "苏拉特的人说，帕迪沙姑母的朝觐船终于出了河口，船队里有一条尤尔法来的桑布克。"

[tracks.chapters.timeout]
next = "b10_mecca"
effects = []
news = "苏拉特的莫卧儿女眷等了一整年通行证，十月里终于上了船，领航的是个古吉拉特人。"

