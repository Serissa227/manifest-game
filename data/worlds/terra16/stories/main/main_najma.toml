effects = [{ kind = "cash", value = 1500 }, { kind = "flag", flag = "c13_main_najma_forged" }]
reply = "我描得比原印还端正，连纸上的一处墨晕都描了上去。船主过了第乌，托人捎回一包胡椒。那张描过的蜡纸，我当晚烧了，灰撒进运淡水的船后面。"
fail = { next = "a05_jafar", effects = [{ kind = "reputation", faction = "portugal", value = -5 }, { kind = "flag", flag = "c13_main_najma_forged" }], news = "霍尔木兹商馆的书记说，有张通行证上的印描歪了一个角，正挨个追问是谁的手笔。" }

