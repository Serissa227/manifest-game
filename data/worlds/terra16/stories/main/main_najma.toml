#
# 回忆插画清单：
#   mem-main_najma-a03 开航日：黎明的亚丁港外，一条桑布克抢在众船之前出港，船头的女孩举着牵星板对着天边最后一颗星。
#   mem-main_najma-b04 别扭的韵：无月的夜里，女领航咬着牵星板的绳结举板量星，膝上的蜡板刻满一列列星名和数字。
#   mem-main_najma-b05 铅封：新月夜的油灯下，一只湿铜瓶立在码头木板上，女领航把蜡纸压在熏黑的六角星铅封上。
#   mem-main_najma-b10 麦加的问答：禁寺边的讲学处，戴轻纱头巾的女领航站在一圈坐着的学生中间，老学者手里的笔停在半空。
#   mem-main_najma-c01 晾在船帆上的诗：亚丁的海滩背阴处，一张旧帆铺开，两个女人跪着一页页摊开湿诗稿，每页压一块黑石。
#   mem-main_najma-c05 柱外的星：满海海草的夜里，雾裂开一条缝，船头的女领航举着牵星板，雾缝里露出一颗星和一座铜色火光的灯塔。
#   mem-main_najma-c07 一颗星的名字：蒙巴萨的码头夜里，金商坐在黄铜小箱上举着牵星板量星，女领航在旁边扶着他的手肘。

