# a04 一方描得出的印：霍尔木兹，一张假通行证。
[[tracks.chapters]]
key = "a04_cartaz"
title = "一方描得出的印"
text = "霍尔木兹岛，红土、盐壳，岛上没有一口甜水井，运淡水的船一天三趟靠岸。葡萄牙人的堡垒压在港口上，商馆门口排着领通行证的船主。一个古吉拉特船主把我请进货栈。他摊开一张旧的卡塔兹，一块蜂蜡，一支细笔：他要运胡椒去吉达，通行证上不许。只要照着葡萄牙船长的印描一方，再把货单改一行。最扎眼的是新纸上的“领航”一栏。那一栏里，已经写好了我的名字。“你外曾祖父那样的人，还怕一张纸？照着描一遍就行。”船主说。“这张纸上，海是他们的。我的名字不该在上头。”我说。我看着印上那只十字的四个角，差了不到半粒米。描得出来。"
at = "hormuz_port"
cast = ["najma"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1558, 1, 1] }]
deadline = [1559, 12, 31]
news = "霍尔木兹的古吉拉特船主四处找人描葡萄牙人的印，说尤尔法那个女领航的手最稳。"

[tracks.chapters.timeout]
next = "a05_jafar"
effects = []
news = "霍尔木兹的古吉拉特船主等了两个季风，没等到他要找的女领航，只好去葡萄牙商馆排队领通行证。"

[[tracks.chapters.choices]]
