# b03 嫁妆箱：母亲拿出外曾祖父的手稿，贾法尔念的半句差一个词。
[[tracks.chapters]]
key = "b03_dowry"
title = "嫁妆箱"
text = "正午的尤尔法，拉希德家的院子。父亲老了，坐在门槛上补网。母亲把嫁妆箱从里屋拖出来：印度柚木，黄铜钉，开盖一股玫瑰水和樟脑的味道。箱底用一块旧帆布包着外曾祖父的手稿。我小时候偷看过一回，挨了一顿骂。“你自己有船十几年了，该给你了。”母亲说。我翻到写南方星的那一联。上半句，正是贾法尔在霍尔木兹念过的那半句。两句一对，我在心里过了一遍，差一个词。稿子上没有他念的那个词。这一行的韵押得别扭，他不会押错韵。“你外曾祖父写诗，押不上的地方，从来不硬押。”母亲说。父亲抬起头，问的是另一件事：“这回在家住几天？”"
at = "julfar"
cast = ["najma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1571, 1, 1] }]
deadline = [1571, 9, 30]
news = "尤尔法拉希德家的女儿回来住了几天，邻居说院子里的灯亮到半夜，第二天才见她出门。"

