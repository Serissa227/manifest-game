fail = { next = "c02_muscat", effects = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "reputation", faction = "ottoman", value = -2 }], news = "亚丁总督不肯开城门，说没有伊斯坦布尔的话，一群印度来的女人也不许进城。" }

[[tracks.chapters.choices]]
key = "dry_poems"
text = "陪萨利玛把湿了的诗稿一页页晾干"
next = "c02_muscat"
effects = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "affinity", person = "salima_sultan", value = 10 }, { kind = "memory", memory = "mem-main_najma-c01", title = "晾在船帆上的诗" }]
reply = "我把桑布克的备用帆铺在背阴处，两人一页一页摊开。萨利玛念一页，我压一块石头。有一页上写着“守星”两个字，墨晕开了，萨利玛说就让它晕着。"

[[tracks.chapters.variants]]
key = "hajj_pilot"
when = [{ kind = "flag", flag = "c13_main_najma_hajj_pilot" }]
text = "亚丁外海，莫卧儿女眷的船触了礁，船身斜在礁上。女眷和侍从被小船一趟趟接到滩上。亚丁总督关着城门，说要等伊斯坦布尔的话。我领她们来的时候是十月，回来的时候是这样。古尔巴丹坐在一只翻倒的水桶上，一个一个点名。点到第三十一个，没有人答。古尔巴丹没哭，把第三十一个名字又念了一遍，念得更大声。萨利玛把湿透的诗稿揣在袖子里，一页也不肯给侍女碰。潮正在退，礁上露出一道一道的黑石。古尔巴丹：“三十一。再找。我们来的时候是三十一个，回去也要三十一个。”萨利玛：“纸湿了不要紧，字还在。别拿太阳晒，墨会跑。”我（心里）：潮往东南退，人要是还在，就在那几块黑石后面。"

# c02 三条桨帆船：米尔·阿里·贝伊袭马斯喀特。被劫那天的湾口。
[[tracks.chapters]]
key = "c02_muscat"
title = "三条桨帆船"
text = "天没亮，马斯喀特的小海湾里，三条桨帆船贴着礁石划进来，桅上挂着红旗。城里的葡萄牙兵往山里跑，渔夫往海里跑。我的桑布克泊在海湾口，离城比离那三条船都近。蓄水池边已经起了火。领头那条船的船头站着一个嗓门很大的人，正冲岸上喊：苏丹的舰队到了。三条船，他喊成舰队。船上的桨手有一半是俘虏，看他的眼神却像看恩人。米尔·阿里：“看见那条桨帆船没有？那是苏丹的船——也就是我的船。”一个渔夫跳上我的船：“姑娘，你的船吃水浅，带我们出湾！”我（心里）：潮还有半个时辰转。转了，湾口那道礁就露出来。"
stage = "involve"
window = [[1581, 8, 1], [1581, 10, 31]]
at = "muscat"
cast = ["najma", "mir_ali_bey"]
speaker = "captain"
mood = "tense"
news = "马斯喀特被劫那天，湾口泊着一条尤尔法的桑布克，城里烧到天亮，它才起锚。"

[tracks.chapters.default]
next = "c03_coffee"
effects = []
news = "米尔·阿里·贝伊的三条桨帆船抢了马斯喀特，葡萄牙人躲进了山里，城里烧了两天。"

[[tracks.chapters.choices]]
key = "warn"
text = "趁潮没转，划小船进城去报信"
