next = "c03_coffee"
effects = [{ kind = "reputation", faction = "hormuz", value = 3 }, { kind = "fame", value = 1 }]
reply = "我贴着礁影划进去，挨家敲门，每家只报一句：“还有半个时辰。”等红旗插上蓄水池，城里的人已经走了一大半。"
fail = { next = "c03_coffee", effects = [{ kind = "reputation", faction = "hormuz", value = 1 }], news = "马斯喀特被劫那天，有个女领航划小船进城报信，晚了一步，城门口已经是红旗。" }

