# c04 最后一联：无地点，夜里弹出。星盘与立场（开、合、留）。
[[tracks.chapters]]
key = "c04_summons"
title = "最后一联"
text = "夜里，船泊着，我把外曾祖父的星盘贴在眼前，对准星路最后一联里的那颗星。那颗星落在西边，落下去的地方，诗里写的是“柱子外头”。我算过：从这里去，要绕过索法拉以南的海，过好望角，再往北。走的正是当年法兰克人来的那条路，只是倒着走。星盘边上的刻度在灯下发亮，被几代人的拇指磨得没了棱。值夜的水手探头问：“领航，今晚还量吗？”我：“量到天亮。星又不会跑。”我（心里）：最后一联的星，落在柱子外头。我（心里）：他们说他替法兰克人引了路。这一回，我替他把路走完。"
cast = ["najma"]
speaker = "captain"
mood = "mystic"
night = true
when = [{ kind = "date", from = [1582, 7, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c05_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_najma_stance_open" }]

[[tracks.chapters.choices]]
key = "open"
text = "带上外曾祖父的星盘去：雾该散了，海是大家的"
requires = [{ kind = "item", item = "majid_astrolabe", qty = 1 }]
next = "c05_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_najma_keepsake" }, { kind = "flag", flag = "c13_main_najma_stance_open" }, { kind = "chart", region = "agulhas" }, { kind = "chart", region = "cape_good_hope" }]
hint = "星盘不在手边，这条路开不了。"
reply = "我把星盘用油布裹好，挂回腰间。天亮时，我让水手把南边的海图摊开，一张从没用过的葡萄牙人的图。我在好望角那里画了一颗星。"

[[tracks.chapters.choices]]
key = "close"
text = "带上星盘去，把那条路合上"
requires = [{ kind = "item", item = "majid_astrolabe", qty = 1 }]
next = "c05_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_najma_keepsake" }, { kind = "flag", flag = "c13_main_najma_stance_close" }, { kind = "chart", region = "agulhas" }, { kind = "chart", region = "cape_good_hope" }]
