[[tracks.chapters.variants]]
key = "hajj_pilot"
when = [{ kind = "flag", flag = "c13_main_najma_hajj_pilot" }]
text = "我领萨利米号进吉达的那年冬天，萨利玛托人捎话：纳赫拉瓦利要讲法兰克人的事了，来不来听？从吉达上麦加，两天的路。禁寺边的讲学处，纳赫拉瓦利刚写完他的也门史，墨迹还新，学生围了三圈。他念到法兰克人那一段：说他们灌醉了一个阿拉伯领航员，那人叫艾哈迈德·伊本·马吉德。帘子后面的萨利玛轻轻笑了一声。我站起来。手里没有书，只有一个在苏拉特码头上记下的名字的音，和外曾祖父的星盘。“远客，你说的这一笔，有书为证吗？”纳赫拉瓦利问。萨利玛（帘后）：“谁看见的？”我：“葡萄牙人自己的书里写着：马莱莫·卡纳。”纳赫拉瓦利的笔停在半空。他把那几个音在嘴里又过了一遍。“卡纳……”他说，“那是古吉拉特人的名字。我的祖上，就是从古吉拉特的纳赫拉瓦拉来的。”"

