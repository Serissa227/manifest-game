[[tracks.chapters.variants]]
key = "aceh_guns"
when = [{ kind = "flag", flag = "c13_main_najma_aceh_guns" }]
text = "马六甲，葡萄牙人的白堡压在山头。城门口的兵认得我，那年替亚齐使节带过话。我只能等天黑，从克林人的街绕进城。城外挤着香料与布，城门查得紧。一个广州来的回回商人在清真寺后院等我。他摊开一部残缺的星表，页边写满汉字：北京钦天监的回回科要和大统历的人比一场日食，缺的是兀鲁伯那部撒马尔罕星表的后半，还有会推的人。残表的页角被虫蛀了，蛀洞正好吃掉了几行数。“京里的人说，这回输了，回回科就要关门。”他说。我看着蛀洞。“蛀掉的是第十一表的后三行。我背得出。”我不看就把那几行补了上去。商人当场跪了下来，求我跟船去广州。我（心里）：往东的海，诗里一句也没写过。"

# b08 光塔下：限期把星表送到广州。日食之前。
[[tracks.chapters]]
key = "b08_eclipse_run"
title = "光塔下"
text = "广州城西，怀圣寺的光塔立在屋顶上，塔顶的风向标是一只金鸡。码头上市舶司的人一船一船地查。老教长在寺里等我，身边站着一个北上的回回官员。另一头，一个穿青袍的书吏也找上门来，他是大统历那边的人，出高价要买这部表。那价钱，比我这十几年领航挣的任何一单都高。表用油布包着，背在我自己身上，一路没有离身。老教长：“京里的人说，这回要是输了，回回科就关门。”青袍书吏：“表留下，钱也留下。这对谁都好。”我（心里）：表到了不会推的人手里，就是一叠纸。"
at = "guangzhou"
cast = ["najma"]
speaker = "captain"
mood = "tense"
