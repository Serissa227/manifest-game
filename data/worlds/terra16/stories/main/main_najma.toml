# b05 铅封：新月夜，老渔夫网上来的铜瓶。所罗门那一半的门铭在巴拉卡那里。
[[tracks.chapters]]
key = "b05_bottle_seal"
title = "铅封"
text = "新月夜，尤尔法的码头。老渔夫抱着一只湿淋淋的铜瓶来敲门：外礁那边一网拉上来的，瓶口封着铅，铅上压着一枚六角星的印，四周绕一圈细字。跟说书人讲的渔夫与精灵一模一样。老渔夫说，半夜瓶子里有声音，像有人在很远的地方数数。我把油灯凑近，量了铅封的宽：两指。那圈字像阿拉伯字，又像希伯来字，哪一种都对不上。老渔夫：“你识字，你看看这上头写的什么。别撬，我不要什么精怪。”我：“不撬。拓下来就够了。”我（心里）：巴拉卡要是在，准说他在南边哪座石门上见过这种字。"
at = "julfar"
cast = ["najma"]
speaker = "captain"
mood = "mystic"
night = true
deadline = [1572, 6, 30]
news = "尤尔法的老渔夫网上来一只封着铅的铜瓶，半夜抱去敲了拉希德家的门，码头上的人都没敢看。"

[tracks.chapters.timeout]
next = "b06_idris"
effects = []
news = "尤尔法的老渔夫网上来一只封着铅的铜瓶，问遍了码头，没人敢替他撬开。"

[[tracks.chapters.choices]]
key = "rub_return"
text = "用灯烟和蜡纸拓下铅封，瓶子沉回原处"
next = "b06_idris"
effects = [{ kind = "flag", flag = "c13_half_solomon_bottle" }, { kind = "memory", memory = "mem-main_najma-b05", title = "铅封" }]
reply = "我用灯烟熏黑铅封，蜡纸一压，六角星和那圈字就清清楚楚了。天亮前我和老渔夫划船出去，照着星把瓶子沉回原处。沉下去的地方，我用两颗星的高度记在蜡板上。"
news = "尤尔法的老渔夫说，他网上来的那只铜瓶，被拉希德的女儿拓了一张纸，又照着星沉回了海里。"

