# a08 吉达外礁：限期把使节送到吉达。
[[tracks.chapters]]
key = "a08_aceh_run"
title = "吉达外礁"
text = "吉达外的珊瑚礁一道连一道，水色从深蓝到碧绿，只隔一个船身。使节一路晕船，此刻却站在船头念经。码头上，奥斯曼总督的官员等着收礼单，朝觐的人群从岸上一直排到城门。金线囊放在我的舱里，压在星盘下面。一路上我量过锡兰以南的星，在马尔代夫的环礁之间找到了过船的口子。这些我都记在蜡板上。“姑娘，你一路报的星，比我念的经还准。”使节说。“礼单呢？先看礼单。”官员说。临别时，使节凑到我耳边，要我把苏丹要炮匠的那句话带回亚齐。只有一句话，比一船胡椒还沉。"
at = "jeddah"
cast = ["najma"]
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "at", at = "jeddah", text = "把亚齐的使节送到吉达" }]
deadline_days = 150
news = "吉达港里来了一条亚齐的船，使节说领航的女人在马尔代夫的环礁里找到了没人走过的口子。"

[tracks.chapters.timeout]
