# c01 晾在船帆上的诗：亚丁外海，莫卧儿女眷的船触礁，点名点到第三十一个没人答。
[[tracks.chapters]]
key = "c01_aden_wreck"
title = "晾在船帆上的诗"
text = "亚丁外海，莫卧儿女眷的船触了礁，船身斜在礁上。女眷和侍从被小船一趟趟接到滩上。亚丁总督关着城门，说要等伊斯坦布尔的话。古尔巴丹坐在一只翻倒的水桶上，一个一个点名。点到第三十一个，没有人答。古尔巴丹没哭，把第三十一个名字又念了一遍，念得更大声。萨利玛把湿透的诗稿揣在袖子里，一页也不肯给侍女碰。潮正在退，礁上露出一道一道的黑石。古尔巴丹：“三十一。再找。我们来的时候是三十一个，回去也要三十一个。”萨利玛：“纸湿了不要紧，字还在。别拿太阳晒，墨会跑。”我（心里）：潮往东南退，人要是还在，就在那几块黑石后面。"
