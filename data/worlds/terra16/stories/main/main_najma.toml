# b06 伊德里斯的星：摩卡苏菲道堂的长老，“黑暗之海”第一次出现。
[[tracks.chapters]]
key = "b06_idris"
title = "伊德里斯的星"
text = "摩卡一座苏菲道堂的屋顶，夜里的赞念刚停，小杯里的咖啡还烫，苦得发涩。一位白胡子长老听我念完那几行别扭的诗，拨着念珠不说话。他说，学者们讲，希腊人叫赫尔墨斯的那位，就是先知伊德里斯，第一个用笔写字、第一个认星的人。又说：这几行星往西走，走过赫拉克勒斯的柱子，那里的雾比夜还黑。长老：“柱子外头，阿拉伯人叫它黑暗之海。”长老：“伊德里斯是第一个用笔的人。他写下的星，有人读得懂，有人一辈子读不懂。”我（心里）：黑暗也有星。只是没人去量。"
at = "mocha"
cast = ["najma"]
speaker = "captain"
mood = "mystic"
night = true
when = [{ kind = "date", from = [1572, 1, 1] }]
deadline = [1573, 12, 31]
news = "摩卡苏菲道堂的屋顶上，一个阿拉伯女领航跟长老喝了一夜咖啡，说的全是星。"

[tracks.chapters.timeout]
next = "b07_eclipse"
effects = []
news = "摩卡的苏菲夜会上有人念了一段伊本·马吉德的诗，说那是往柱子外头去的路。"

[[tracks.chapters.choices]]
key = "listen"
text = "听他讲完伊德里斯的事"
next = "b07_eclipse"
effects = [{ kind = "skill", skill = "astral_navigation", value = 4 }, { kind = "flag", flag = "c13_main_najma_idris_heard" }]
reply = "长老讲到天快亮，讲伊德里斯升天，讲他留下的板子。我一句也没插嘴，把“柱子”两个字刻在蜡板最下面，旁边画了一个向西的箭头。"

