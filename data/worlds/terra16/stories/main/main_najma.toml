# c03 咖啡兄弟的二十包豆子：吉达，限期交货。（目标：二十包咖啡到吉达）
[[tracks.chapters]]
key = "c03_coffee"
title = "咖啡兄弟的二十包豆子"
text = "吉达的码头，海关门上新贴了一张告示：市场督察说，咖啡让人夜里不睡、聚众，不许公开卖。督察的人正一包一包地撬开刚卸的麻袋。我舱里的二十包是摩卡苏菲道堂的兄弟们凑钱买的。麻袋上烫着他们的记号，要送进吉达的道堂，给夜里的赞念用。码头另一头，朝觐的人排着队。有人隔着人群问我：卖不卖？督察撬开的第一包，正是烫着兄弟们记号的那一包。他认得那个记号。“这是摩卡那帮守夜的人的豆子。告示你看见了？”“看见了。告示上没写船上不许装。”我（心里）：二十包。少一包，长老那杯就是空的。"
at = "jeddah"
cast = ["najma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1582, 1, 1] }]
objectives = [{ kind = "goods", good = "coffee", qty = 20, at = "jeddah", text = "把摩卡咖啡兄弟托的二十包咖啡运到吉达" }]
deadline = [1582, 6, 30]
news = "吉达的市场督察撬开一包摩卡来的咖啡，跟一个阿拉伯女领航对着告示吵了一上午。"

