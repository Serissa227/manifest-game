# b10 谁看见的：麦加禁寺边，纳赫拉瓦利的也门史。秘密在这一章揭开。
[[tracks.chapters]]
key = "b10_mecca"
title = "谁看见的"
text = "从吉达上麦加，两天的路。禁寺边的讲学处，纳赫拉瓦利刚写完他的也门史，墨迹还新，学生围了三圈。他念到法兰克人那一段：说他们灌醉了一个阿拉伯领航员，那人叫艾哈迈德·伊本·马吉德。帘子后面的萨利玛轻轻笑了一声。我站起来。手里没有书，只有一个在苏拉特码头上记下的名字的音，和外曾祖父的星盘。“远客，你说的这一笔，有书为证吗？”纳赫拉瓦利问。萨利玛（帘后）：“谁看见的？”我：“葡萄牙人自己的书里写着：马莱莫·卡纳。”纳赫拉瓦利的笔停在半空。他把那几个音在嘴里又过了一遍。“卡纳……”他说，“那是古吉拉特人的名字。我的祖上，就是从古吉拉特的纳赫拉瓦拉来的。”"
stage = "involve"
window = [[1577, 1, 1], [1578, 12, 31]]
at = "jeddah"
cast = ["najma", "qutb_al_din_nahrawali", "salima_sultan"]
speaker = "captain"
mood = "tense"
news = "麦加的学生们说，一个尤尔法来的女领航在纳赫拉瓦利的讲学处跟他争起了外曾祖父的名字。"

[tracks.chapters.default]
next = "c01_aden_wreck"
effects = []
news = "麦加的纳赫拉瓦利写完了他的也门史，书里说给法兰克人引路的是个阿拉伯领航员。"

[[tracks.chapters.choices]]
key = "evidence"
text = "把书记念给我的那一页，逐字对着他的书讲"
check = { attr = "learning", base = 35, per = 6 }
next = "c01_aden_wreck"
effects = [{ kind = "flag", flag = "c13_main_najma_name_cleared" }, { kind = "fame", value = 3 }, { kind = "memory", memory = "mem-main_najma-b10", title = "麦加的问答" }]
reply = "纳赫拉瓦利沉默了很久，没有划掉那一行。他在页边添了一句小字：“一说其人为古吉拉特之卡纳。”他把书转过来给我看。我看完，把星盘贴在胸口，向他行了礼。"
fail = { next = "c01_aden_wreck", effects = [{ kind = "fame", value = 1 }, { kind = "memory", memory = "mem-main_najma-b10", title = "麦加的问答" }], news = "麦加禁寺边，一个阿拉伯女领航跟纳赫拉瓦利辩了半日，他没改书上的字。" }

[[tracks.chapters.choices]]
