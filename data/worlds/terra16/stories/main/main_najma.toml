# ───────────── 第一幕「启航」1557—1566 ─────────────

# a00 门槛见闻：只有选了纳吉玛的家庭才会在这里开轨道。
[[tracks.chapters]]
key = "a00_gate"
title = "拉希德的女儿"
text = "冬天的尤尔法海滩，潜水的人坐在翻扣的小船边补网、剥椰绳。码头上那条桑布克刚刷过鱼油，船头挂着一只铜星盘，风一吹就晃。补网的人在传：拉希德船长今年不下海了，舵交给了女儿，就是那个在码头上当面改港务官报的潮时、改完还要对方再念一遍的姑娘。有人说女人掌舵要倒霉，有人说她报的星位比她父亲还准。一个老潜水人一句话收了场：“她爹的珠子是我捞的，她报的潮是我对过的。你们要赌，赌她回不回得来，别赌她认不认得路。”"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "julfar"
cast = ["najma"]
mood = "cheerful"
news = "尤尔法码头上的采珠人说，拉希德船长今年不下海了，那条桑布克归了他女儿掌舵。"
when = [{ kind = "flag", flag = "c12_voyage_najma" }]

[tracks.chapters.default]
next = "a01_monsoon"
effects = [{ kind = "flag", flag = "c13_main_najma" }]

# a01 舵交到手里：父亲把桑布克交给她，趁东北季风出海。这一章不用口头禅。
[[tracks.chapters]]
key = "a01_monsoon"
title = "舵交到手里"
text = "天刚亮，尤尔法的海滩上，桑布克已经推到了滚木上，东北风正对着船尾。父亲拉希德蹲在沙上，把去年夏天的珍珠一颗颗包进红布，每包一颗，就在绳上打一个结。他不上船，只把舵绳往我手里一放。母亲在屋檐下看着，没有走过来。舱里压着出海资本里的十包咖啡，船头挂着外曾祖父的铜星盘，边上的刻度被几代人的拇指磨得发亮。“亚丁的珠商拿湿拇指称珠子。”父亲说，“你带自己的秤去。”我数了一遍绳上的结，比他说的少一个。他笑了，说那一颗留给母亲。码头那头，希赫尔的抄书人抱着一捆纸走过来，问能不能搭船。“半个舱就够我和我的纸。”他说，“到亚丁我付钱，到希赫尔我替你抄一页你想要的书。”父亲终于又开口，说的却不是珠子：“舵是你的了，账也是你的。这一程装什么、带谁，你自己定。”风在船尾，一指不偏。"
at = "julfar"
cast = ["najma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1557, 1, 7] }]
deadline = [1557, 3, 15]

[tracks.chapters.timeout]
next = "a02_aden"
effects = [{ kind = "flag", flag = "c13_main_najma_late_monsoon" }]
news = "尤尔法拉希德家的桑布克到三月还泊在码头上，采珠人说东北风等不得人。"

[[tracks.chapters.choices]]
key = "take_pearls"
text = "带上父亲的珍珠，去亚丁卖个好价"
next = "a02_pearls"
effects = [{ kind = "flag", flag = "c13_main_najma_father_pearls" }]
reply = "我把红布包贴身收好，又把绳上的结数了一遍。父亲叮嘱“湿拇指”那句话的时候，我已经在想，怎么在亚丁当着珠商的面把秤摆出来。那把小铜秤，我用油布包了两层。"

[[tracks.chapters.choices]]
key = "passenger"
text = "让出半个舱，捎上要回希赫尔的抄书人"
next = "a02_aden"
effects = [{ kind = "cash", value = 300 }, { kind = "flag", flag = "c13_main_najma_scribe" }]
reply = "抄书人抱着纸上了船，付的是一把旧银币，枚枚我都对着太阳看过。一路上他念诗，我改他念错的星名。他把一张写坏的纸折成小船放进海里，说是给海神的。"

[[tracks.chapters.choices]]
key = "check_astrolabe"
text = "先不急走，在码头上把星盘和父亲的牵星板对一遍"
requires = [{ kind = "item", item = "majid_astrolabe", qty = 1 }]
check = { attr = "astronomy", base = 35, per = 6 }
next = "a02_aden"
effects = [{ kind = "skill", skill = "astral_navigation", value = 6 }]
hint = "要有那只铜星盘在手，才对得了刻度。"
reply = "夜里我把星盘的刻度和父亲牵星板上的绳结一格格对齐，才发现第三个结松了，量出来的高度总比星盘低一点。我重新打紧。父亲第二天看了一眼，什么也没说，把那块牵星板也放上了船。"
fail = { next = "a02_aden", effects = [], news = "尤尔法码头上，拉希德的女儿对着一块牵星板和一只铜星盘量了半夜，天亮才开船。" }

# a02 湿拇指与一张字条：限期到亚丁。字条里的半指是巴拉卡故意留给她改的。
[[tracks.chapters]]
key = "a02_aden"
title = "湿拇指与一张字条"
text = "四月的亚丁，火山口的城背后是秃山，港口的税关前排着卸货的船。东北风一天比一天弱，再过几个星期海就要关了。珠市在税关后面的巷子里，古吉拉特的珠商拿湿拇指在秤盘边上一按一按。港务官认得我父亲。他从账簿里抽出一张折了四折的字条，说是南下的船上，一个基尔瓦金商的儿子留下的，“说你一看就知道是谁”。字条上写着亚丁的北极星高度，旁边画了个笑脸。高度差了一点。“他少量了半指。”我说。港务官笑起来：“他说你看了会骂他。”我（心里）：他知道我会改。他就是要我改。"
at = "aden"
cast = ["najma"]
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "at", at = "aden", text = "趁东北季风的尾巴赶到亚丁" }]
deadline = [1557, 4, 30]
news = "亚丁港的人说，尤尔法来了个年轻的女船主，桑布克是她父亲的，舵是她自己的。"

[tracks.chapters.timeout]
next = "a03_opening_day"
effects = []
news = "亚丁港四月的船簿上没有尤尔法来的桑布克，港务所的人说季风先走了一步。"

[[tracks.chapters.choices]]
key = "reply_baraka"
text = "给巴拉卡回一张字条，托南下的船带去基尔瓦"
next = "a03_opening_day"
effects = [{ kind = "flag", flag = "c13_main_najma_wrote_baraka" }]
reply = "我只写了一行：改过的高度。别的什么也没写，连名字都没署。港务官看了，说这叫什么信。我说他认得。最后，我把那个笑脸原样描了一个，描得比他的端正。"

[[tracks.chapters.choices]]
key = "ask_sailing_day"
text = "去港务所问清今年往印度的开航日"
next = "a03_opening_day"
effects = [{ kind = "flag", flag = "c13_main_najma_knows_day" }]
reply = "港务所墙上挂着往年的开航日，一年一行。我把近十年的日子抄下来，自己往后推了一遍，推出来的那天，比墙上写的早两天。港务官不信，说到时候见。"

[[tracks.chapters.variants]]
key = "late_monsoon"
when = [{ kind = "flag", flag = "c13_main_najma_late_monsoon" }]
text = "东北风的最后几天，我把桑布克赶进了亚丁。帆已经软了，港务官在码头上说：“再晚三天，你就得在海上过夏天。”珠市在税关后面的巷子里，古吉拉特的珠商拿湿拇指在秤盘边上一按一按。港务官认得我父亲。他从账簿里抽出一张折了四折的字条，说是南下的船上，一个基尔瓦金商的儿子留下的，“说你一看就知道是谁”。字条上写着亚丁的北极星高度，旁边画了个笑脸。高度差了一点。“他少量了半指。”我说。港务官笑起来：“他说你看了会骂他。”我（心里）：他知道我会改。他就是要我改。"

[[tracks.chapters.variants]]
key = "scribe"
when = [{ kind = "flag", flag = "c13_main_najma_scribe" }]
text = "四月的亚丁，火山口的城背后是秃山，港口的税关前排着卸货的船。东北风一天比一天弱，再过几个星期海就要关了。珠市在税关后面的巷子里，古吉拉特的珠商拿湿拇指在秤盘边上一按一按。港务官认得我父亲。他从账簿里抽出一张折了四折的字条，说是南下的船上，一个基尔瓦金商的儿子留下的，“说你一看就知道是谁”。字条上写着亚丁的北极星高度，旁边画了个笑脸。高度差了一点。“他少量了半指。”我说。港务官笑起来：“他说你看了会骂他。”我（心里）：他知道我会改。他就是要我改。码头上，希赫尔的抄书人下船前，把一页抄好的星名表塞进我手里，说是船钱以外的。"

# a02 另一条路：带着父亲的珍珠到亚丁。只有 take_pearls 的人会走到这里（next 路由，不用检定门槛）。
[[tracks.chapters]]
key = "a02_pearls"
title = "湿拇指与一包珍珠"
text = "四月的亚丁，税关前排着卸货的船，东北风一天比一天弱。我怀里揣着父亲那包红布珍珠，隔着布都能摸出每一颗的圆。珠市在税关后面的巷子里。古吉拉特的珠商看见我怀里那包红布，眼睛先不看珠子，先看我的脸。港务官认得我父亲，把我拉到账房门口，从抽屉里翻出一张折了四折的字条。字条是南下的船上一个基尔瓦金商的儿子留下的，上面是亚丁的北极星高度，旁边画着笑脸。我看了一眼就知道差在哪里。“他少量了半指。”我说。港务官先笑了：“那小子说你看了准会骂他。”我（心里）：这张字条是他故意留给我改的。"
at = "aden"
cast = ["najma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "c13_main_najma_father_pearls" }]
objectives = [{ kind = "at", at = "aden", text = "带着父亲的珍珠，在季风关海之前赶到亚丁" }]
deadline = [1557, 4, 30]
news = "亚丁珠市的人说，尤尔法来的女船主怀里揣着一包红布珍珠，进巷子前先问了秤摆在哪里。"

[tracks.chapters.timeout]
next = "a03_opening_day"
effects = []
news = "亚丁珠市四月没等到尤尔法的红布珍珠，珠商们说今年的好货八成叫季风给耽误了。"

[[tracks.chapters.choices]]
key = "sell_pearls"
text = "把父亲的珍珠拿去珠市，自己摆秤"
next = "a03_opening_day"
effects = [{ kind = "cash", value = 1200 }]
news = "亚丁的珠市上，尤尔法来的女船主带着自己的秤卖珠子，古吉拉特的珠商当场收起了湿拇指。"
reply = "我把父亲的小铜秤摆在珠商的秤旁边，一颗一颗过了两遍。珠商的拇指停在半空。卖完，我把那根打了结的绳收进袖子。那是要还给父亲的账。"

[[tracks.chapters.choices]]
key = "reply_baraka"
text = "写一行字，托南下的船捎给基尔瓦的巴拉卡"
next = "a03_opening_day"
effects = [{ kind = "flag", flag = "c13_main_najma_wrote_baraka" }]
reply = "纸上我只留了一个数，是改过的北极星高度，没有署名。港务官拿着纸看了半天，问基尔瓦那边的人看得懂吗。我说他看得懂。末了我又描了一个笑脸，描得比他的端正。"

[[tracks.chapters.choices]]
key = "ask_sailing_day"
text = "到港务所问清，今年往印度的船哪一天开"
next = "a03_opening_day"
effects = [{ kind = "flag", flag = "c13_main_najma_knows_day" }]
reply = "我在港务所的墙上抄下近十年的开航日，往后推了一遍，推出来的那天比墙上写的早两天。港务官不信，说到时候再看。"

# a03 开航日：八月末的亚丁，第一次独自领航。“差一指，就差一百里”第一次用。
[[tracks.chapters]]
key = "a03_opening_day"
title = "开航日"
text = "八月末的亚丁港外，西南季风刚松了劲，港里挤满了等着开海的船：古吉拉特的大船、霍尔木兹的桑布克，还有一条舱里钉着葡萄牙通行证的商船。天没亮，港务所的鼓响了。一个坎贝来的古吉拉特船主冲上我的船。他的领航发着烧，说胡话都在报星，船上四十个人等着去卡利卡特。他手里攥着一卷用靛蓝线捆的旧针路，是古吉拉特海岸的。“我那领航烧得说胡话都在报星。你肯接？”“差一指，就差一百里。你的旧图我要先看。”我说。葡萄牙商船的通事站在舷梯上喊：“站在船头就行，到了卡利卡特，钱照付。”船主没回头，只把旧针路往我怀里一塞。翻开第一页，我看见第乌那一段画错了。船主随口说，他祖父的船“法兰克人来的那年”就泊在马林迪，“那年的事，坎贝的老船户比你们阿拉伯人记得清”。我没有追问。"
stage = "involve"
window = [[1557, 8, 20], [1557, 9, 10]]
at = "aden"
cast = ["najma"]
speaker = "captain"
mood = "cheerful"
news = "亚丁港外开航日那天，一个尤尔法来的女领航第一次独自领船过阿拉伯海，船上的人说她报星比老领航还准。"

[tracks.chapters.default]
next = "a04_cartaz"
effects = []
news = "亚丁今年的开航日，往印度的船走了一大半，尤尔法那条桑布克没赶上头一拨。"

[[tracks.chapters.choices]]
key = "pilot_gujarati"
text = "替古吉拉特船领航去卡利卡特"
next = "a04_cartaz"
effects = [{ kind = "cash", value = 800 }, { kind = "chart", region = "gujarat" }, { kind = "flag", flag = "c13_main_najma_gujarati_master" }, { kind = "memory", memory = "mem-main_najma-a03", title = "开航日" }]
news = "亚丁开航日，一个尤尔法的女领航把发烧的古吉拉特领航换了下来，替那条船去了卡利卡特。"
reply = "十九天横渡。我夜里量星，白天看海鸟，替船主把旧针路里第乌那一段改了三处。到卡利卡特，船主让我把整卷针路抄走，说这一卷本来就该是领航人的。"

[[tracks.chapters.choices]]
key = "pilot_cartaz"
text = "接那条舱里钉着葡萄牙通行证的船"
next = "a04_cartaz"
effects = [{ kind = "cash", value = 1000 }, { kind = "reputation", faction = "portugal", value = 3 }, { kind = "flag", flag = "c13_main_najma_cartaz_ship" }, { kind = "memory", memory = "mem-main_najma-a03", title = "开航日" }]
reply = "通行证钉在船长铺位的上方，纸角画着一个我不认识的圣像，船长每天早上摸一下。我一路没看那张纸。过第乌时，我站在船头，葡萄牙巡船挥手放行。钱给得一文不少，下船时我没有回头。"

[[tracks.chapters.choices]]
key = "first_out"
text = "谁的活都不接，趁开航日第一个出港"
check = { attr = "seamanship", base = 20, per = 7 }
next = "a04_cartaz"
effects = [{ kind = "fame", value = 3 }, { kind = "memory", memory = "mem-main_najma-a03", title = "开航日" }]
