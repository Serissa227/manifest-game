# ───────────── 旁轨（2026-11-12 剧情增写）：债的绳子（拉希德、潜水人与努尔） ─────────────
# 母本：《一千零一夜》的“海老人”（骑在肩上不肯下来的人）；文化：海湾采珠的担保与欠账一代传一代——好的一面是船上同生共死，坏的一面是债把人钉在海底；
#       张力：拉希德背着霍尔木兹，潜水人背着拉希德；纳吉玛替谁都算得清，替谁也解不开。救得了的只有一点：不让账落到下一代身上。
# 入口：c13_main_najma（a00 缺省）加日期；r3—r6 用 c13_main_najma_act2，r7 用 c13_main_najma_act3。各章无 at，进入即弹出。本旁轨不用口头禅。
# 读养成期旗标：rw_najma_page_folded / took_book / book_left（人物线 A 不下海了）、rw_najma_kept_aunt_secret / asked_aunt_saad / told_father_saad（A 瘸腿的萨阿德）、
#       rw_najma_nur_knots / nur_pearl_given（人物线 C）；读主线已有的 c13_main_najma_teacher_saved（r4）。
# 本轨设 rw_najma_rope_*，给本轨后面几章的变体读。去世：萨菲娅（r5，1576 年 4 月）、拉希德（r6，1579 年 3 月）；已有主线章节在这以后都不让他们出场。
# r2 一章就是美术已画的努尔 24 岁那一幕：腕上一根引向画外的绳（绳的那头在打盹的拉绳人手里），看着一颗珠子，笑不到眼里。
[[tracks]]
key = "main_najma_rw_debt_rope"
name = "债的绳子"
kind = "main"
start = "r1_hormuz"
auto = true
cast = ["najma"]

[[tracks.chapters]]
key = "r1_hormuz"
title = "萨尔曼的账房"
text = "霍尔木兹的盐山底下，霍贾·萨尔曼的账房开在一条背阴的巷子里，门前的台阶天天有人洒水。我是自己找去的，船泊在外锚地，没告诉父亲。萨尔曼老了些，声音还是那么软。他认得我，叫人上咖啡，把父亲那一页翻给我看：利上滚的利，一行压着一行。压在最底下的，是父亲那本黑皮账的誊本——账上二十四个潜水人，如今都押在他这里。“你父亲是个好人，”他说，“好人的账，最难收。”我（心里）：父亲背着他，他们背着父亲。"
speaker = "captain"
mood = "tense"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma" }, { kind = "date", from = [1558, 3, 1] }]

[[tracks.chapters.variants]]
key = "a1_folded"
when = [{ kind = "flag", flag = "rw_najma_page_folded" }]
text = "霍尔木兹的盐山底下，霍贾·萨尔曼的账房开在一条背阴的巷子里，门前的台阶天天有人洒水。我是自己找去的，船泊在外锚地，没告诉父亲。萨尔曼老了些，声音还是那么软。他认得我，叫人上咖啡，把父亲那一页翻给我看：利上滚的利，一行压着一行。压在最底下的，是父亲那本黑皮账的誊本。优努斯那一页折着一个角——我离家那天父亲折的，萨尔曼的伙计誊账时，连那个角也照样折了。“你父亲是个好人，”他说，“好人的账，最难收。”我（心里）：父亲背着他，他们背着父亲。"

[[tracks.chapters.variants]]
key = "a2_took"
when = [{ kind = "flag", flag = "rw_najma_took_book" }]
text = "霍尔木兹的盐山底下，霍贾·萨尔曼的账房开在一条背阴的巷子里，门前的台阶天天有人洒水。我是自己找去的，船泊在外锚地，没告诉父亲。萨尔曼老了些，声音还是那么软。他认得我，叫人上咖啡，把父亲那一页翻给我看：利上滚的利，一行压着一行。压在最底下的是一份誊本，誊的正是我船舱里那本黑皮账，一个字不差，连父亲按的柏油指印都描了。“你父亲是个好人，”他说，“好人的账，最难收。”我（心里）：父亲背着他，他们背着父亲。"

[[tracks.chapters.variants]]
key = "a3_left"
when = [{ kind = "flag", flag = "rw_najma_book_left" }]
text = "霍尔木兹的盐山底下，霍贾·萨尔曼的账房开在一条背阴的巷子里，门前的台阶天天有人洒水。我是自己找去的，船泊在外锚地，没告诉父亲。萨尔曼老了些，声音还是那么软。他认得我，叫人上咖啡，把父亲那一页翻给我看：利上滚的利，一行压着一行。压在最底下的，是父亲那本黑皮账的誊本，原本还在家里的床底下，就是父亲数到二十四就停下的那一本。“你父亲是个好人，”他说，“好人的账，最难收。”我（心里）：父亲背着他，他们背着父亲。"

[[tracks.chapters.choices]]
key = "pay"
text = "替父亲还上一截"
requires = [{ kind = "cash", ge = 500 }]
hint = "身上的钱不够还他一截。"
next = "r2_pearl"
effects = [{ kind = "cash", value = -500 }, { kind = "flag", flag = "rw_najma_rope_paid_khwaja" }]
reply = "我把银子摆上桌，伙计一枚枚对着光看。看完，萨尔曼亲手在父亲那一页划了一道。“利我照算，”他说，“本少了，利就少。拉希德有个好女儿。”说到“好”字，他又笑了一下。我出门的时候，台阶上的水已经干了。"

[[tracks.chapters.choices]]
key = "copy"
text = "请他让我把这一页誊下来"
check = { attr = "intellect", base = 45, per = 8 }
next = "r2_pearl"
effects = [{ kind = "flag", flag = "rw_najma_rope_copied" }]
reply = "我誊了一个下午，一个数一个数地对。誊完回到船上又算了一夜，算出萨尔曼的利一年滚两回，比他嘴上说的多一回。这个数我没拿去跟他吵。我抄了两份，一份寄回尤尔法给姨母，一份夹进自己的航簿。"
fail = { next = "r2_pearl", effects = [], news = "霍尔木兹的账房伙计说，有个阿拉伯女领航在萨尔曼那里坐了一下午，抄了一页账，走的时候脸色很难看。" }

[[tracks.chapters.choices]]
key = "leave"
text = "什么也不碰，喝完咖啡就走"
next = "r2_pearl"
effects = [{ kind = "flag", flag = "rw_najma_rope_left" }]
reply = "我喝完那杯咖啡，把杯子在手里轻轻摇了两下，递回去——尤尔法人说“够了”，就是这样。萨尔曼看懂了，笑着送我到门口。这根绳子，我还没有力气去拉。回船的小艇上，我把手泡在海里，泡到指头发白。"

[[tracks.chapters]]
key = "r2_pearl"
title = "二十四岁"
text = "十一月，季风换了向，我的桑布克在哈伊马角外头等风。穆萨的船也泊着，采季早过了，他的人还在晒最后一批蚌。努尔坐在船舷上，二十四岁，头发长回来了，拿一根麻绳勒着。她右手腕上系着潜水的绳，绳的那一头在船舱里，在拉绳的人手里，那人靠着桅杆打盹。她左手捏着一颗珠子，对着太阳慢慢转。看见我，她把珠子举起来给我看，笑了，笑到一半就停在嘴角，没往眼睛里去。“这一颗，”她说，“够把我赎出来。可它是船上的。”"
speaker = "captain"
mood = "sad"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma" }, { kind = "date", from = [1564, 11, 1] }]

[[tracks.chapters.variants]]
key = "a1_knots"
when = [{ kind = "flag", flag = "rw_najma_nur_knots" }]
text = "十一月，季风换了向，我的桑布克在哈伊马角外头等风。穆萨的船也泊着，采季早过了，他的人还在晒最后一批蚌。努尔坐在船舷上，二十四岁，头发长回来了，拿一根麻绳勒着。她右手腕上系着潜水的绳，绳的那一头在船舱里，在拉绳的人手里，那人靠着桅杆打盹。绳上有结：一个大的，三个小的。我当年替她打的两个大结，她解开了一个，又添上了几个我不认得的。她左手捏着一颗珠子，对着太阳慢慢转。看见我，她把珠子举起来给我看，笑了，笑到一半就停在嘴角，没往眼睛里去。“这一颗，”她说，“够把我赎出来。可它是船上的。”"

[[tracks.chapters.variants]]
key = "a2_flat"
when = [{ kind = "flag", flag = "rw_najma_nur_knots", value = false }, { kind = "flag", flag = "rw_najma_nur_pearl_given" }]
text = "十一月，季风换了向，我的桑布克在哈伊马角外头等风。穆萨的船也泊着，采季早过了，他的人还在晒最后一批蚌。努尔坐在船舷上，二十四岁，头发长回来了，拿一根麻绳勒着。她右手腕上系着潜水的绳，绳的那一头在船舱里，在拉绳的人手里，那人靠着桅杆打盹。她左手捏着一颗珠子，对着太阳慢慢转。我腰间的小袋里，还装着她那年在石堤上塞给我的那颗扁珠子。看见我，她把手里那颗举起来给我看，笑了，笑到一半就停在嘴角，没往眼睛里去。“这一颗，”她说，“够把我赎出来。可它是船上的。”"

[[tracks.chapters.choices]]
key = "buy"
text = "照珠市的价，从穆萨手里买下这颗珠子，钱记在她名下"
requires = [{ kind = "cash", ge = 800 }]
hint = "穆萨给这颗珠子开的价，你身上的钱不够。"
next = "r3_boat"
effects = [{ kind = "cash", value = -800 }, { kind = "flag", flag = "rw_najma_rope_nur_bought" }]
reply = "穆萨要价很高，我没还。钱交出去，我要他当着努尔的面把她的名字从账上划掉。他划了。努尔一直盯着那支笔，看它划完，才低头去解手腕上的绳。解到一半，她停了。“明年呢？”她说，“明年我娘的药，我哥的船位钱。”她把绳结又系了回去。"

[[tracks.chapters.choices]]
key = "read"
text = "上船去，替她把穆萨今年的账念一遍"
next = "r3_boat"
effects = [{ kind = "flag", flag = "rw_najma_rope_nur_read" }]
reply = "我念，她听；拉绳的人醒了，也在听。账上的数比八年前少了，可新添了几行：她哥哥的船位钱，她娘的药钱，都记在她名下，是她自己让记的。我念完，她点点头：“比我想的少。”我说比我想的多。她把那颗珠子放进穆萨的网兜，放得很轻。"

[[tracks.chapters.choices]]
key = "sit"
text = "不提账，陪她坐到太阳落"
next = "r3_boat"
effects = [{ kind = "flag", flag = "rw_najma_rope_nur_sat" }]
reply = "我们坐在船舷上，脚泡在水里。她问我去过的海，我一处一处说：亚丁，卡利卡特，马六甲那道窄水。她听得很认真，听完说：“那些地方的海底，我一处也没见过。”太阳落下去，她把珠子收回船舱。拉绳的人醒了，喊她吃饭，她应了一声，声音很亮。"

[[tracks.chapters]]
key = "r3_boat"
title = "小船"
text = "正月里我回到尤尔法，父亲在码头上等我。他老得很快，左肩比右肩低了一掌。阿明那条小船泊在湾里，船底长满了藤壶。父亲说，萨尔曼死了，他儿子接了账房，头一件事就是派人来点数，二十四个潜水人一个一个点过去，像点牲口。“小船卖了，能还八个人的账。”父亲说，“卖了，剩下十六个跟着萨尔曼的儿子走；不卖，二十四个都跟着我一起烂。”他问的不是我，是他自己。"
speaker = "captain"
mood = "sad"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1569, 2, 1] }]

[[tracks.chapters.variants]]
key = "a1_paid"
when = [{ kind = "flag", flag = "rw_najma_rope_paid_khwaja" }]
text = "正月里我回到尤尔法，父亲在码头上等我。他老得很快，左肩比右肩低了一掌。阿明那条小船泊在湾里，船底长满了藤壶。父亲说，萨尔曼死了，他儿子接了账房，头一件事就是派人来点数，二十四个潜水人一个一个点过去，像点牲口。我那年在霍尔木兹替他还的那一截，只够让点数的人少点三个名字。“小船卖了，能还八个人的账。”父亲说，“卖了，剩下的跟着萨尔曼的儿子走；不卖，一个个都跟着我一起烂。”他问的不是我，是他自己。"

[[tracks.chapters.choices]]
key = "sell"
text = "帮他把船卖了，先还优努斯那几家"
next = "r4_qadi"
effects = [{ kind = "flag", flag = "rw_najma_rope_boat_sold" }]
reply = "买船的是哈伊马角的人，价压得很低，父亲没还价。钱一到手，他先去了优努斯家，然后是另外七家，一家一家把账划掉。划完第八家，天已经黑了。他坐在门槛上说：“剩下十六个，往后是别人的人了。”他说“别人”，像在说一个他没去过的地方。"

[[tracks.chapters.choices]]
key = "pay"
text = "我出钱：船留着，二十四个一个不让"
requires = [{ kind = "cash", ge = 1500 }]
hint = "手头的钱不够填二十四个人的账。"
next = "r4_qadi"
effects = [{ kind = "cash", value = -1500 }, { kind = "flag", flag = "rw_najma_rope_boat_kept_paid" }]
reply = "我把钱交给父亲，他接得很慢。“这是你的船挣的。”他说。我说船本来也是你的。他把钱分成二十四份，一份一份包好，第二天一早送去萨尔曼儿子的账房。小船留下了，二十四个人也留下了，利还在滚。他知道，我也知道，这只是把绳子往后放了一截。"

[[tracks.chapters.choices]]
key = "his"
text = "这是他的船，让他自己定"
next = "r4_qadi"
effects = [{ kind = "flag", flag = "rw_najma_rope_boat_his" }]
reply = "父亲等我开口，我没开口。他看了我很久，点点头，像是早就知道。那条船他到底没卖。春天采季一开，阿明照样带着二十四个人下海，萨尔曼的儿子派人在码头上点数。父亲站在旁边，替那人一个一个报名字，报得比那人还快。"

[[tracks.chapters]]
key = "r4_qadi"
title = "法官的纸"
text = "九月，尤尔法来信：优努斯死了。不是淹死的。他从那道礁上来以后躺了三天，两条腿一点点不听使唤，第三天连话也说不出了。他儿子十二岁，跟爷爷一个名字，也叫朱马。萨尔曼的儿子已经派人上门，说按海上的老规矩，爹的账，儿子背。信是姨母的字，最后一行：你在扎比德读过书，书上怎么说？"
speaker = "captain"
mood = "sad"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1573, 9, 1] }]

[[tracks.chapters.variants]]
key = "a1_sold"
when = [{ kind = "flag", flag = "rw_najma_rope_boat_sold" }]
text = "九月，尤尔法来信：优努斯死了。不是淹死的。他从那道礁上来以后躺了三天，两条腿一点点不听使唤，第三天连话也说不出了。他的账父亲卖船那年已经划掉，可第二年他家断了粮，又向萨尔曼的儿子借了一回。他儿子十二岁，跟爷爷一个名字，也叫朱马。萨尔曼的儿子已经派人上门，说按海上的老规矩，爹的账，儿子背。信是姨母的字，最后一行：你在扎比德读过书，书上怎么说？"

[[tracks.chapters.variants]]
key = "a2_kept"
when = [{ kind = "flag", flag = "rw_najma_rope_boat_kept_paid" }]
text = "九月，尤尔法来信：优努斯死了。不是淹死的。他从那道礁上来以后躺了三天，两条腿一点点不听使唤，第三天连话也说不出了。小船还在，他的账也还在，我那年填进去的钱，让利滚了四年，又滚回了原先那么高。他儿子十二岁，跟爷爷一个名字，也叫朱马。萨尔曼的儿子已经派人上门，说按海上的老规矩，爹的账，儿子背。信是姨母的字，最后一行：你在扎比德读过书，书上怎么说？"

[[tracks.chapters.choices]]
key = "fatwa"
text = "去扎比德，请老夫人写一张纸：欠账跟着遗产走，不跟着儿子走"
check = { attr = "learning", base = 45, per = 8 }
next = "r5_aunt"
effects = [{ kind = "flag", flag = "rw_najma_rope_fatwa" }, { kind = "affinity", person = "c8_zabid_woman_scholar", value = 3 }]
reply = "老夫人听完，叫人取纸，写了不到十行，引的是哪一位法学家的话、出自哪一部书，一条一条写得清清楚楚：人死了，他的欠账从他留下的东西里还；还不完的，不落到儿子身上。她吹干墨交给我：“纸是纸。海上认不认，是海上的事。”"
fail = { next = "r5_aunt", effects = [{ kind = "flag", flag = "rw_najma_rope_fatwa_weak" }], news = "扎比德的人说，一个尤尔法的女领航替潜水人的儿子去求学者写字，学者写了，尤尔法那边的人却说海上有海上的规矩。" }

[[tracks.chapters.choices]]
key = "buy_page"
text = "替小朱马把那一页买下来"
requires = [{ kind = "cash", ge = 600 }]
hint = "身上的钱不够买下那一页。"
next = "r5_aunt"
effects = [{ kind = "cash", value = -600 }, { kind = "flag", flag = "rw_najma_rope_page_bought" }]
reply = "萨尔曼的儿子把那一页撕下来给我，撕得很齐。我没有烧，带回尤尔法交给优努斯的寡妇。她不识字，把纸翻来覆去看了几遍，问我上面是不是她男人的名字。我说是。她把纸贴在胸口贴了很久，说：那就留着，留着他。"

[[tracks.chapters.choices]]
key = "qadi"
text = "带上父亲，去哈伊马角找法官评理"
check = { attr = "eloquence", base = 45, per = 8 }
next = "r5_aunt"
effects = [{ kind = "flag", flag = "rw_najma_rope_qadi" }]
reply = "法官是个年轻人，听萨尔曼的伙计讲完海上的规矩，又听我讲完书上的规矩，想了一下午。最后他判：账从优努斯留下的东西里还——一只网兜、两块石坠、一间泥屋，泥屋不许动；剩下的，不落到孩子身上。萨尔曼的伙计走的时候，回头看了那孩子一眼。"
fail = { next = "r5_aunt", effects = [], news = "哈伊马角的法官说，海上的账，海上的人自己算，他不管。尤尔法拉希德家的女儿在堂下站了一下午。" }

[[tracks.chapters]]
key = "r5_aunt"
title = "杂项"
text = "四月，姨母死了。她走得很快，早上还在拨算盘，晌午说累，躺下就没再起来。我赶回尤尔法的时候，她已经下葬三天。母亲把她的账册交给我，一共十一本，本本都平。第十二本压在最底下，没有封皮，头一页写着两个字：杂项。里面一行一行全是人名：萨阿德，优努斯，努尔，还有十几个我不认得的。每个名字后面一个数，没有一笔写着还。"
speaker = "captain"
mood = "sad"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1576, 4, 1] }]

[[tracks.chapters.variants]]
key = "a1_kept"
when = [{ kind = "flag", flag = "rw_najma_kept_aunt_secret" }]
text = "四月，姨母死了。她走得很快，早上还在拨算盘，晌午说累，躺下就没再起来。我赶回尤尔法的时候，她已经下葬三天。母亲把她的账册交给我，一共十一本，本本都平。第十二本压在最底下，没有封皮，头一页写着两个字：杂项。头一个名字就是萨阿德，那一年我替她核过这一笔，什么也没问。后面是优努斯，努尔，还有十几个我不认得的。每个名字后面一个数，没有一笔写着还。"

[[tracks.chapters.variants]]
key = "a2_asked"
when = [{ kind = "flag", flag = "rw_najma_asked_aunt_saad" }]
text = "四月，姨母死了。她走得很快，早上还在拨算盘，晌午说累，躺下就没再起来。我赶回尤尔法的时候，她已经下葬三天。母亲把她的账册交给我，一共十一本，本本都平。第十二本压在最底下，没有封皮，头一页写着两个字：杂项。萨阿德那一行旁边画着一个小圈，记的是我写信去问她的那一年。后面是优努斯，努尔，还有十几个我不认得的。每个名字后面一个数，没有一笔写着还。"

[[tracks.chapters.variants]]
key = "a3_told"
when = [{ kind = "flag", flag = "rw_najma_told_father_saad" }]
text = "四月，姨母死了。她走得很快，早上还在拨算盘，晌午说累，躺下就没再起来。我赶回尤尔法的时候，她已经下葬三天。母亲把她的账册交给我，一共十一本，本本都平。第十二本压在最底下，没有封皮，头一页写着两个字：杂项。萨阿德那一行底下另起了一行小字：拉希德知道了，随他。后面是优努斯，努尔，还有十几个我不认得的。每个名字后面一个数，没有一笔写着还。"

[[tracks.chapters.choices]]
key = "tell_saad"
text = "去码头告诉萨阿德，免他账的是谁"
next = "r6_roll"
effects = [{ kind = "flag", flag = "rw_najma_rope_saad_told" }]
reply = "萨阿德坐在他的绳摊后面，听我说完，半天没动。然后他放下那根搓了一半的椰绳，拄着拐站起来，往墓地那边走，一条腿拖在地上。我没有跟去。第二天他托人送来一捆绳，搓得匀极了，绳头上系着一张纸，纸上按了一个手印。"

[[tracks.chapters.choices]]
key = "keep"
text = "合上本子：她没让人知道，我也不说"
next = "r6_roll"
effects = [{ kind = "flag", flag = "rw_najma_rope_ledger_kept" }]
reply = "我把第十二本裹进油布，和外曾祖父的誊本放在一起。萨阿德到死都会以为是父亲免了他的账，父亲也只能一直让他这么以为。这是姨母留给我们父女俩的一笔账，她算准了谁也不会去还。"

[[tracks.chapters.choices]]
key = "close"
text = "在每个名字后面写一个“清”字"
next = "r6_roll"
effects = [{ kind = "flag", flag = "rw_najma_rope_ledger_closed" }]
reply = "我一行一行写，写到天亮，写了四十一个“清”。写完才发现，我的字跟她的字摆在一处，一样像刀切的。母亲在门口看了一会儿，说：“你姨母要是看见，准说你乱记账。”说完她先哭了。那是姨母走后她头一回哭。"

[[tracks.chapters]]
key = "r6_roll"
title = "点名"
text = "三月，父亲病得起不来了。我到家那天夜里，他醒过一回，叫我把那本黑皮账拿来。他看不清字了，就叫我念。我念一个名字，他应一声，像从前收工时站在船头点名：阿明，萨阿德，优努斯——我停了一下，说优努斯已经不在了。他说：“我知道，念。”我就接着念。念到最后一个，他没有应。我又念了一遍，念得更大声。"
speaker = "captain"
mood = "sad"
cast = ["najma"]
night = true
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1579, 3, 1] }]

[[tracks.chapters.variants]]
key = "a1_sold"
when = [{ kind = "flag", flag = "rw_najma_rope_boat_sold" }]
text = "三月，父亲病得起不来了。我到家那天夜里，他醒过一回，叫我把那本黑皮账拿来。他看不清字了，就叫我念。我念一个名字，他应一声，像从前收工时站在船头点名。念到第八个，我说这八家的账，那年卖船时你已经划了。他说：“划了的也念。”念到优努斯，我说他已经不在了。他说：“我知道，念。”我就接着念。念到最后一个，他没有应。我又念了一遍，念得更大声。"

[[tracks.chapters.variants]]
key = "a2_kept"
when = [{ kind = "flag", flag = "rw_najma_rope_boat_kept_paid" }]
text = "三月，父亲病得起不来了。我到家那天夜里，他醒过一回，叫我把那本黑皮账拿来。小船还泊在湾里，二十四个名字一个没少，利也一笔没少。他看不清字了，就叫我念。我念一个名字，他应一声，像从前收工时站在船头点名：阿明，萨阿德，优努斯——我停了一下，说优努斯已经不在了。他说：“我知道，念。”我就接着念。念到最后一个，他没有应。我又念了一遍，念得更大声。"

[[tracks.chapters.choices]]
key = "pillow"
text = "合上账，塞到他枕头底下"
next = "r6b_juma"
effects = [{ kind = "flag", flag = "rw_najma_rope_book_pillow" }]
reply = "我合上账，塞进他的枕头底下。母亲看见了，没有拿出来。第二天抬他去净身以前，她把账抽了出来，交到我手里：“他背了一辈子。到那边去，让他空着手。”"

[[tracks.chapters.choices]]
key = "amin"
text = "把账交给阿明"
next = "r6b_juma"
effects = [{ kind = "flag", flag = "rw_najma_rope_book_amin" }]
reply = "阿明的头发全白了。他接过账，没有翻：“我不识字，船长知道的。”我说我知道。他说那你还给我？我说念名字用不着识字，那些名字你都记得。他想了想，点点头，把账抱在怀里，像抱一个刚从海里拉上来的孩子。"

[[tracks.chapters.choices]]
key = "mine"
text = "自己收着：这根绳，往后我来拉"
next = "r6b_juma"
effects = [{ kind = "flag", flag = "rw_najma_rope_book_mine" }]
reply = "我把账收进船舱，和航簿放在一处。往后每回路过尤尔法，我都要上岸到码头站一站，看谁的船回来了，谁没有。没有人等我点名，可我还是在心里点一遍，点到最后一个才坐下。"

[[tracks.chapters]]
key = "r6b_juma"
title = "优努斯的儿子"
text = "六月，我的船在尤尔法补水。码头上一个年轻人来找我，二十一岁，晒得很黑，耳朵里塞着一团羊毛，说他叫朱马，优努斯的儿子。他在萨尔曼儿子的船上下海，替他爹还账，还到今年，还剩三季。他不是来求我替他还的。他说，他爹活着的时候讲过：他在海底看见的星，领航的人在天上也看得见。他想知道是不是真的。"
speaker = "captain"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1582, 6, 1] }]

[[tracks.chapters.variants]]
key = "a1_fatwa"
when = [{ kind = "flag", flag = "rw_najma_rope_fatwa" }]
text = "六月，我的船在尤尔法补水。码头上一个年轻人来找我，二十一岁，晒得很黑，耳朵里没塞羊毛，说他叫朱马，优努斯的儿子。老夫人那张纸，他娘一直压在箱底；萨尔曼的儿子派人来过两回，看完纸就走了，再没来过。他一天也没下过海。他说，他爹活着的时候讲过：他在海底看见的星，领航的人在天上也看得见。他想知道是不是真的。"

[[tracks.chapters.variants]]
key = "a2_page"
when = [{ kind = "flag", flag = "rw_najma_rope_page_bought" }]
text = "六月，我的船在尤尔法补水。码头上一个年轻人来找我，二十一岁，晒得很黑，耳朵里没塞羊毛，说他叫朱马，优努斯的儿子。我那年买下的那一页，他娘缝在了枕头里，他一天也没下过海。他说，他爹活着的时候讲过：他在海底看见的星，领航的人在天上也看得见。他想知道是不是真的。"

[[tracks.chapters.variants]]
key = "a3_qadi"
when = [{ kind = "flag", flag = "rw_najma_rope_qadi" }]
text = "六月，我的船在尤尔法补水。码头上一个年轻人来找我，二十一岁，晒得很黑，耳朵里没塞羊毛，说他叫朱马，优努斯的儿子。哈伊马角的法官那一判以后，他家的泥屋还在，他一天也没下过海。他说，他爹活着的时候讲过：他在海底看见的星，领航的人在天上也看得见。他想知道是不是真的。"

[[tracks.chapters.choices]]
key = "hire"
text = "收他上船，从拉绳学起"
next = "r7_rope"
effects = [{ kind = "flag", flag = "rw_najma_rope_juma_hired" }]
reply = "他在我船上从最底下做起：拉帆，拉绳，刮船底。头一个月他一颗星也没学，只学会一件事：夜里值更，每隔一刻往四下看一圈。第二个月我把牵星板递给他，叫他找北星。他找了很久，找到了，举着板子一动不敢动，像怕它跑了。"

[[tracks.chapters.choices]]
key = "star"
text = "带他上屋顶，指给他看蚌壳里那一闪"
next = "r7_rope"
effects = [{ kind = "flag", flag = "rw_najma_rope_juma_star" }]
reply = "我们在父亲家的屋顶上坐到半夜。我把老人星指给他看，说你爹讲的那一闪，大概就是这一颗的颜色。他看了很久，说：比海底的亮。我说海底那一颗是你爹的，这一颗谁都能看。他点点头，说那他还是要他爹那一颗。"

[[tracks.chapters.choices]]
key = "school"
text = "出钱送他去扎比德的学堂"
requires = [{ kind = "cash", ge = 300 }]
hint = "身上的钱不够送他去扎比德。"
next = "r7_rope"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "rw_najma_rope_juma_school" }]
reply = "他走那天，他娘拿那只装网兜的旧箱子给他装行李，箱底还压着两块石坠，他没拿出来。我给扎比德学堂如今的师傅写了一封信，请他收下一个采珠人的儿子。回信说收了，又说：采珠人的儿子憋气长，背诗不怕喘。"

[[tracks.chapters]]
key = "r7_rope"
title = "绳子"
text = "十月，我又泊在哈伊马角外头。穆萨早死了，他的船归了侄子。船上拉绳的人里有一个女人，四十六岁，左耳全聋了，右手腕上系着一根绳，绳的那一头在水底下。下面是她哥哥的儿子，十七岁，替她下水；她不下了，她拉。我在小艇上喊她，她没听见，旁边的人推了她一下，她才转过头来冲我笑，缺牙的地方还缺着。绳子在她手里一动，她立刻低头去看，不再看我。"
speaker = "captain"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1586, 10, 25] }]

[[tracks.chapters.variants]]
key = "a1_bought"
when = [{ kind = "flag", flag = "rw_najma_rope_nur_bought" }]
text = "十月，我又泊在哈伊马角外头。穆萨早死了，他的船归了侄子。船上拉绳的人里有一个女人，四十六岁，左耳全聋了，右手腕上系着一根绳，绳的那一头在水底下。那年我从穆萨手里替她买下一颗珠子，她把自己的名字从账上划了，转身又替哥哥按了拇指印——如今下面是她哥哥的儿子，十七岁，替她下水；她不下了，她拉。我在小艇上喊她，她没听见，旁边的人推了她一下，她才转过头来冲我笑，缺牙的地方还缺着。绳子在她手里一动，她立刻低头去看，不再看我。"

[[tracks.chapters.choices]]
key = "clear"
text = "把她侄子的账清了"
requires = [{ kind = "cash", ge = 1000 }]
hint = "身上的钱不够清这一笔。"
next = "done"
effects = [{ kind = "cash", value = -1000 }, { kind = "flag", flag = "rw_najma_rope_nephew_cleared" }]
reply = "我上了船，把钱交给穆萨的侄子，看他划账。努尔一直没回头，手里攥着绳。孩子上来了，喘着气问是谁。努尔说：领航的。她把绳从手腕上解下来，在掌心绕了几圈，递给我，手在抖。那根绳是湿的，还带着热气。第二年我再路过，她又在船上，拉的是别人家的孩子。"

[[tracks.chapters.choices]]
key = "paper"
text = "替那孩子写一张纸：这一页不往下一代传"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_rope_paper" }]
reply = "我照在扎比德学过的那几条，替那孩子写了一张：爹的账从爹留下的东西里还，不落到儿子身上，请哈伊马角的法官盖了印。努尔叫我念了三遍，念完把纸折成小方块，塞进侄子腰上的网兜，跟他的石坠放在一起。“他看不懂，”她说，“可他会带着。”"

[[tracks.chapters.choices]]
key = "hold"
text = "什么也不做，接过另一根绳，陪她拉"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_rope_held" }]
reply = "我上了船，跟一个拉绳的人换了位置，接过另一根绳，下面是一个我不认得的孩子。我们并排站着，各拉各的，谁也不说话。她的绳动了两下，她往上拉；我的绳动了两下，我也往上拉。两个孩子一齐冒出水面的时候，她看了我一眼。那一回，笑到了眼睛里。"

# ───────────── 旁轨（2026-11-12 剧情增写）：第三十一只鸟（母亲玛丽亚姆与那一行诗） ─────────────
# 母本：阿塔尔《鸟的会议》——三十只鸟飞过七道山谷，在水面上看见的是自己；掉队的那一只，书里不记它看见了什么；
#       文化：荣誉与沉默——母亲为家名藏起一行，女儿为真去找；
#       张力：那一行在最后一联的下半句，与 c04“最后一联”咬住：上半句是那颗落在“柱子外头”的星，下半句是母亲藏了一辈子的话。
#       它在 m5 才露出来：“柱外来的人向我借这颗星，我借了；从那以后，我的夜里少了一颗。”谁是柱外来的人（法兰克人，还是 c05 雾那头的人）、
#       “借”是认罪还是别的，正文不下定论；伊本·马吉德给达伽马引路的传闻照 b09—b10 的写法，不在这里判。
# 入口：c13_main_najma（a00 缺省）加日期；m2—m3 用 _act2，m4—m6 用 _act3。各章无 at，进入即弹出。本旁轨不用口头禅。
# 读养成期旗标：rw_najma_promised_mother / asked_line / asked_31st（人物线 B 装订线）、rw_najma_measured_window（B 刀口）；
#       读主线已有：c13_main_najma_name_cleared（m3）、c13_main_najma_crossed / _turned_back（m4）；读本线 b03 追加的 rw_najma_ms_with_mother（m2）。
# 去世：玛丽亚姆（m6 开头，1584 年 3 月）；已有主线章节在这以后不让她出场。
[[tracks]]
key = "main_najma_rw_31st_bird"
name = "第三十一只鸟"
kind = "main"
start = "m1_letter"
auto = true
cast = ["najma"]

[[tracks.chapters]]
key = "m1_letter"
title = "针刺的半句"
text = "十月，卡利卡特的码头上，霍尔木兹来的船捎来母亲的信。她的信还是老样子，写满半张，留半张给我回。这一封抄了一段波斯诗，是那本绿皮书里的：戴胜对鸟儿们说，路是长的，可你们本来就会飞。信尾她写：你父亲的肩越来越低，你姨母的账越来越平，我很好，那一行也好好的。我把信翻过来，背面用针刺着一行小孔，对着灯看，是航路诗的最后一联，只有上半句。"
speaker = "captain"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma" }, { kind = "date", from = [1559, 10, 1] }]

[[tracks.chapters.variants]]
key = "a1_promised"
when = [{ kind = "flag", flag = "rw_najma_promised_mother" }]
text = "十月，卡利卡特的码头上，霍尔木兹来的船捎来母亲的信。她的信还是老样子，写满半张，留半张给我回。这一封抄了一段波斯诗，是那本绿皮书里的：戴胜对鸟儿们说，路是长的，可你们本来就会飞。信尾她写：你父亲的肩越来越低，你姨母的账越来越平，我很好。你答应过我的事，我也记着。我把信翻过来，背面用针刺着一行小孔，对着灯看，是航路诗的最后一联，只有上半句。"

[[tracks.chapters.variants]]
key = "a2_asked_line"
when = [{ kind = "flag", flag = "rw_najma_asked_line" }]
text = "十月，卡利卡特的码头上，霍尔木兹来的船捎来母亲的信。她的信还是老样子，写满半张，留半张给我回。这一封抄了一段波斯诗，是那本绿皮书里的：戴胜对鸟儿们说，路是长的，可你们本来就会飞。信尾她写：你父亲的肩越来越低，你姨母的账越来越平，我很好。你走到卡利卡特了，还不够远。我把信翻过来，背面用针刺着一行小孔，对着灯看，是航路诗的最后一联，只有上半句。"

[[tracks.chapters.variants]]
key = "a3_bird"
when = [{ kind = "flag", flag = "rw_najma_asked_31st" }]
text = "十月，卡利卡特的码头上，霍尔木兹来的船捎来母亲的信。她的信还是老样子，写满半张，留半张给我回。这一封抄了一段波斯诗，是那本绿皮书里的：戴胜对鸟儿们说，路是长的，可你们本来就会飞。信尾她写：你父亲的肩越来越低，你姨母的账越来越平，我很好。你问过的那只掉队的鸟，我又把书翻了一遍，还是没有它。我把信翻过来，背面用针刺着一行小孔，对着灯看，是航路诗的最后一联，只有上半句。"

[[tracks.chapters.choices]]
key = "short"
text = "回信只写：知道了"
next = "m2_window"
effects = [{ kind = "flag", flag = "rw_najma_bird_reply_short" }]
reply = "我只写了三个字，又觉得太硬，在底下补了卡利卡特的胡椒价，补了船上一个水手的笑话，最后才是那三个字。信封好，我在码头上站了一会儿。她刺那一行孔的时候，针一定扎过手。她从来不肯用顶针。"

[[tracks.chapters.choices]]
key = "birds"
text = "回信抄一段《鸟的会议》，抄掉队的鸟"
next = "m2_window"
effects = [{ kind = "flag", flag = "rw_najma_bird_reply_birds" }]
reply = "我把记得的那几段默出来：怕的鸟，舍不得窝的鸟，嫌路远的鸟。抄到最后，我加了一只书里没有的——一只飞到一半，回头去找另一只的鸟。这只是我编的，我没注明。母亲认得出来。"

[[tracks.chapters.choices]]
key = "needle"
text = "照她的法子，在回信背面用针刺航路诗的第一联"
next = "m2_window"
effects = [{ kind = "flag", flag = "rw_najma_bird_needle" }]
reply = "我借了船上补帆的针，在灯下一孔一孔地刺，刺歪了两孔，又补正。第一联是北星，是我小时候背错一个字就得从头来的那一句。刺完，我对着灯看，一行细细的光。她看见了，会知道我在告诉她：我还记得开头。"

[[tracks.chapters]]
key = "m2_window"
title = "一指半的窗"
text = "嫁妆箱开过以后，外曾祖父的手稿跟着我的船走了一个夏天。十月夜里，我把它翻到最后一页。最后一联的上半句还在，往西落下去的那颗星；下半句的地方，那道窗还开着，四边齐整，一指半宽。我把油灯挪到窗后，光从窗里透出来，落在舱板上，是窄窄的一条亮。我（心里）：割它的人量过它有多长。藏它的人，也一定量过。"
speaker = "captain"
mood = "mystic"
cast = ["najma"]
night = true
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1571, 10, 1] }]

[[tracks.chapters.variants]]
key = "a1_with_mother"
when = [{ kind = "flag", flag = "rw_najma_ms_with_mother" }]
text = "嫁妆箱开过以后，外曾祖父的手稿还锁在母亲的箱子里，钥匙挂在她腰上。十月我又回尤尔法，母亲把箱子打开，让我自己翻，她就坐在旁边纺线。我翻到最后一页。最后一联的上半句还在，往西落下去的那颗星；下半句的地方，那道窗还开着，四边齐整，一指半宽。我把油灯挪到窗后，光从窗里透出来，落在席子上，是窄窄的一条亮。纺车一直没停。我（心里）：割它的人量过它有多长。藏它的人，也一定量过。"

[[tracks.chapters.variants]]
key = "a2_measured"
when = [{ kind = "flag", flag = "rw_najma_ms_with_mother", value = false }, { kind = "flag", flag = "rw_najma_measured_window" }]
text = "嫁妆箱开过以后，外曾祖父的手稿跟着我的船走了一个夏天。十月夜里，我把它翻到最后一页。最后一联的上半句还在，往西落下去的那颗星；下半句的地方，那道窗还开着，四边齐整，一指半宽，跟我十三岁那年用绳结量的一样，十八年一丝没变。我把油灯挪到窗后，光从窗里透出来，落在舱板上，是窄窄的一条亮。我（心里）：割它的人量过它有多长。藏它的人，也一定量过。"

[[tracks.chapters.choices]]
key = "far"
text = "写信回去问：我现在走得够远了吗"
next = "m3_kana"
effects = [{ kind = "flag", flag = "rw_najma_bird_asked_far" }]
reply = "我数了数这些年走过的港：亚丁，卡利卡特，亚齐，吉达，马六甲。数完写进信里，问她够不够。回信来得很快，只有一行：你去的地方都有人去过。下面她画了一只鸟，没画眼睛。"

[[tracks.chapters.choices]]
key = "gap"
text = "把上半句抄进自己的航簿，下半句也留一道空"
next = "m3_kana"
effects = [{ kind = "flag", flag = "rw_najma_bird_left_gap" }]
reply = "我在航簿里抄下上半句，下面空出一行，空得和手稿上一样长。水手看见了，问是不是墨不够了。我说是留给别人写的。他没再问。那一行空着，往后每回翻到，我都要停一下，像船过一处没测过深浅的水。"

[[tracks.chapters.choices]]
key = "star"
text = "照上半句，量那颗往西落的星"
check = { attr = "astronomy", base = 45, per = 8 }
next = "m3_kana"
effects = [{ kind = "flag", flag = "rw_najma_bird_star_measured" }, { kind = "skill", skill = "astral_navigation", value = 4 }]
reply = "我等到后半夜，那颗星从西边落下去，落得很慢，最后一点光贴着海面停了很久。我量了它落下的方位，记在窗旁边的页边上，用最小的字。上半句说的是对的。下半句说的什么，星不告诉我。"
fail = { next = "m3_kana", effects = [], news = "值夜的水手说，领航在船尾守了一夜西边的一颗星，天亮时什么也没记，回舱就睡了。" }

[[tracks.chapters]]
key = "m3_kana"
title = "一个名字换一个名字"
text = "正月，我从吉达回到尤尔法，母亲在门口等我。她老了，背弯了，眼睛还是亮的。我把麦加的事讲给她听：纳赫拉瓦利的讲学处，萨利玛在帘后问的那一句，那个从葡萄牙人书里念出来的名字。母亲听完，很久不说话，手在膝头一下一下地抚，像在抚一页纸。然后她说：“一个名字换一个名字。你是替他洗了，还是替那个叫卡纳的人背上了？”"
speaker = "captain"
mood = "tense"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1579, 1, 15] }]

[[tracks.chapters.variants]]
key = "a1_cleared"
when = [{ kind = "flag", flag = "c13_main_najma_name_cleared" }]
text = "正月，我从吉达回到尤尔法，母亲在门口等我。她老了，背弯了，眼睛还是亮的。我把麦加的事讲给她听：纳赫拉瓦利的讲学处，萨利玛在帘后问的那一句，还有他在页边添的那行小字，一说其人为古吉拉特之卡纳。母亲听完，很久不说话，手在膝头一下一下地抚，像在抚一页纸。然后她说：“一个名字换一个名字。你是替他洗了，还是替那个叫卡纳的人背上了？”"

[[tracks.chapters.choices]]
key = "defend"
text = "说：我只是念出了葡萄牙人自己写下的"
next = "m4_west"
effects = [{ kind = "flag", flag = "rw_najma_bird_kana_defended" }]
reply = "母亲点点头，说我说得对，书上写的就是书上写的。她又说：可你外曾祖父那一辈的人，谁也没读过葡萄牙人的书，他们只听得见码头上的话。她站起来去添灯油，背对着我说：“你洗得干净纸，洗不干净码头。”"

[[tracks.chapters.choices]]
key = "again"
text = "说：那一行，现在可以给我了吗"
next = "m4_west"
effects = [{ kind = "flag", flag = "rw_najma_bird_asked_again" }]
reply = "母亲看着我，眼里有一点笑，又有一点怕。“你刚替他争了一个名字回来，”她说，“这时候给你，你只会拿它去跟纳赫拉瓦利再吵一架。”她把手按在我手背上：“再等等。等你不急着替谁争的时候。”"

[[tracks.chapters.choices]]
key = "lamp"
text = "不答，替她把灯芯挑亮"
next = "m4_west"
effects = [{ kind = "flag", flag = "rw_najma_bird_silent" }]
reply = "我拿起剪子，把灯芯剪去一截，屋里亮了一圈。母亲看着那圈光，像在看一颗刚升起来的星。“你小时候背错一个字，”她说，“我就这样挑灯，叫你从头。”她没再提卡纳，也没再提那一行。"

[[tracks.chapters]]
key = "m4_west"
title = "往西落的星"
text = "十一月，我从西边那片海回来，先回了尤尔法。母亲病了，躺在里屋，嫁妆箱放在她床脚。她叫我坐近一点，问我到了哪里。我说我到了最后一联那颗星落下去的那片海上。她的眼睛一下子睁大了，抓住我的手腕，抓得很紧，比她这个年纪该有的力气大。“你走得比他远了？”我说我不知道他走到过哪里。她松开手，笑了：“那就是远了。”"
speaker = "captain"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1583, 11, 1] }]

[[tracks.chapters.variants]]
key = "a1_crossed"
when = [{ kind = "flag", flag = "c13_main_najma_crossed" }]
text = "十一月，我从西边那片海回来，先回了尤尔法。母亲病了，躺在里屋，嫁妆箱放在她床脚。她叫我坐近一点，问我到了哪里。我说我穿过了柱子外头的雾，雾那边有一座灯塔，塔顶的火是铜色的。她的眼睛一下子睁大了，抓住我的手腕，抓得很紧，比她这个年纪该有的力气大。“你走得比他远了？”我说我不知道他走到过哪里。她松开手，笑了：“那就是远了。”"

[[tracks.chapters.variants]]
key = "a2_turned"
when = [{ kind = "flag", flag = "c13_main_najma_turned_back" }]
text = "十一月，我从西边那片海回来，先回了尤尔法。母亲病了，躺在里屋，嫁妆箱放在她床脚。她叫我坐近一点，问我到了哪里。我说我到了柱子外头，海草铺满了海，雾里有一点贴着水的光，我掉了头。她的眼睛一下子睁大了，抓住我的手腕，抓得很紧，比她这个年纪该有的力气大。“掉头的时候，你看清那颗星了吗？”我说看清了。她松开手，笑了：“那就够远了。”"

[[tracks.chapters.choices]]
key = "tell"
text = "把柱子外头的事，一件一件讲给她听"
next = "m5_line"
effects = [{ kind = "flag", flag = "rw_najma_bird_told_west" }]
reply = "我讲安格拉港里的炮声，讲风停以后的海草，讲罗经的针怎么打转。母亲闭着眼睛听，听到星的地方，嘴唇跟着动，像在对一行诗的韵脚。讲完，她说：“他也讲过这样的海。我那时候小，以为是说书。”"

[[tracks.chapters.choices]]
key = "ask"
text = "趁她清醒，问那一行"
next = "m5_line"
effects = [{ kind = "flag", flag = "rw_najma_bird_asked_dying" }]
reply = "母亲没有生气。她看着屋顶，看了很久，说：“开春吧。开春我要是还在，就给你。”她说“还在”，说得那么平，像在说一笔账的期限。我没再问，把她的手放回被子里。"

[[tracks.chapters.choices]]
key = "wait"
text = "不问，等她自己开口"
next = "m5_line"
effects = [{ kind = "flag", flag = "rw_najma_bird_waited" }]
reply = "我在床边坐到她睡着。半夜她醒过一回，叫我的小名，问我饿不饿，像我还是十二岁。我说不饿。她说那就背一段诗给我听。我从北星背起，背到最后一联的上半句，停住了。她在黑暗里说：“对。就停在那里。”"

[[tracks.chapters]]
key = "m5_line"
title = "那一行"
text = "二月，母亲知道自己不行了。那天下午她很清醒，叫我关上门，从枕头底下摸出一个小布包，包里是一条窄窄的纸，一指半宽，边缘齐整，纸色比手稿还旧。她没有给我，自己捏着，闭着眼睛念，用的是外曾祖父的调子，只念了一遍：“柱外来的人向我借这颗星，我借了；从那以后，我的夜里少了一颗。”念完，她把纸条放进我手心。“我父亲割下它，是法兰克人的船头一回开进霍尔木兹那年。他临死交给我，说这一行谁读了，都只读得出一个意思。”她看着我：“你读出几个？”"
speaker = "captain"
mood = "mystic"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1584, 2, 1] }]

[[tracks.chapters.choices]]
key = "one"
text = "说：一个。他给法兰克人引过路"
next = "m6_paste"
effects = [{ kind = "flag", flag = "rw_najma_bird_read_one" }]
reply = "母亲点点头，像早就等着这一句。“所以我藏了。”她说，“我不是怕别人知道，是怕你知道。你从小要的就是准，这一行一准，你就再也替他说不出话了。”我说：可它写的是“借”，不是“给”。她说：所以我留着它，没有烧。"

[[tracks.chapters.choices]]
key = "two"
text = "说：两个。柱外来的人，不一定是法兰克人"
next = "m6_paste"
effects = [{ kind = "flag", flag = "rw_najma_bird_read_two" }]
reply = "我说法兰克人是从南边绕过来的，绕的是好望角，不是那两根柱子；我在柱子外头见过的，是另一片海。母亲听着，嘴角一点点松下来。“你外祖父要是听见，”她说，“是会再割一回，还是把它贴回去？”她没等我答，自己先笑了，笑着笑着咳起来。"

[[tracks.chapters.choices]]
key = "counting"
text = "说：我还在数"
next = "m6_paste"
effects = [{ kind = "flag", flag = "rw_najma_bird_still_counting" }]
reply = "母亲看了我很久。“好，”她说，“那就数。三十只鸟数到了自己，你数到第三十一只，再来告诉我。”她闭上眼睛。我坐在床边，把那条纸搁在掌心，一直搁到天黑，没有再读第二遍。"

[[tracks.chapters]]
key = "m6_paste"
title = "第三十一只鸟"
text = "母亲是三月走的，一个没有月亮的夜里，走以前没再说话。秋天，我把外曾祖父的手稿摊在船舱里，把那条纸放到最后一页的窗上，正好，一丝不差，像那道窗七十多年来一直在等它。浆糊调好了，在碗里放凉。母亲那本绿皮的波斯书也在手边，后封是空的。我（心里）：三十只鸟飞到了，看见的是自己。第三十一只，是被人从书里拿走的那一只。"
speaker = "captain"
mood = "sad"
cast = ["najma"]
night = true
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1584, 9, 1] }]

[[tracks.chapters.variants]]
key = "a1_one"
when = [{ kind = "flag", flag = "rw_najma_bird_read_one" }]
text = "母亲是三月走的，一个没有月亮的夜里，走以前没再说话。秋天，我把外曾祖父的手稿摊在船舱里，把那条纸放到最后一页的窗上，正好，一丝不差，像那道窗七十多年来一直在等它。我跟母亲说我只读出一个意思，可这半年里，“借”那个字每夜都在我耳朵里，跟一颗不肯落下去的星一样。浆糊调好了，在碗里放凉。母亲那本绿皮的波斯书也在手边，后封是空的。我（心里）：三十只鸟飞到了，看见的是自己。第三十一只，是被人从书里拿走的那一只。"

[[tracks.chapters.choices]]
key = "paste"
text = "贴回去：这一行是他的，谁读、读出什么，是读的人的事"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_bird_pasted" }]
reply = "我用指尖抹了一层薄薄的浆糊，把纸条对准窗口，压平，再拿一块干净的布按了一夜。天亮时它贴住了，接缝细得像一根头发。最后一联又是一整联了。我把手稿合上，在封皮里面写了一行小字：这一行是外祖父割下的，母亲收着，女儿贴回。我没有写我读出了几个意思。"

[[tracks.chapters.choices]]
key = "sew"
text = "缝进我自己航路书的封皮，像她那样收着"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_bird_sewn" }]
reply = "我拆开航路书的后封，把纸条放进去，用补帆的线一针一针缝上，缝得比母亲那回还密。航路书的后封从此比前封厚了一圈。往后要是有人问，我大概也会说，是装订的人手笨。说完，我才明白她当年说这句话的时候，心里是什么滋味。"

[[tracks.chapters.choices]]
key = "learn"
text = "背下来，把纸条在灯上烧了"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_bird_burned" }]
reply = "我念了七遍，一遍比一遍慢，念到能用外曾祖父的调子念出来。然后我把纸条凑到灯上，看它从一角卷起来，黑了，亮了一下，没了。手稿上的窗还开着。往后那一行只在我嘴里，我不念，就没有人念；我死了，它就跟着我走。这是母亲没敢做的事，我替她做了。"

# ───────────── 旁轨（2026-11-12 剧情增写）：守灯的人（扎比德海口的穆巴拉克） ─────────────
# 母本：《忏悔录》式的转折之后——看见过一回的人，此后天天守着那扇门在的地方；文化：苏菲的守夜与咖啡，宣礼台上的灯也是夜里船认的岸标；
#       张力：灯是给船的，不问是谁的船——这句话在宰德派起义那年要拿命去守。纳吉玛量得出灯的方位，量不出他看见过什么。
# 人物：穆巴拉克只在正文出现（不作 speaker、不加情谊），他在 l3（1582 年 3 月之前）去世。
# 入口：c13_main_najma 加日期；l2 用 _act2（宰德派围扎比德那年冬天，与 b01 同时），l3 用 _act3。各章无 at，进入即弹出。本旁轨不用口头禅。
# 读养成期旗标：rw_najma_lamp_measured（人物线 D 海边的小寺）、rw_najma_seer_refused（D 让船，那一粒咖啡豆）。
[[tracks]]
key = "main_najma_rw_lamp"
name = "守灯的人"
kind = "main"
start = "l1_lamp"
auto = true
cast = ["najma"]

[[tracks.chapters]]
key = "l1_lamp"
title = "宣礼台上的灯"
text = "四月夜里，我的桑布克从亚丁往北，贴着也门的岸走。过扎比德海口的时候，舵手指着岸上说：那里有一盏灯。不用看我也知道是哪一盏。灯在宣礼台顶上，不偏，不晃。我让船在外锚地停了半夜，划小艇上岸。穆巴拉克坐在门口，头发白了一半，听见桨声站起来，先抬头去看灯，再回过头来看我。"
speaker = "captain"
mood = "tender"
cast = ["najma"]
night = true
when = [{ kind = "flag", flag = "c13_main_najma" }, { kind = "date", from = [1561, 4, 1] }]

[[tracks.chapters.variants]]
key = "a1_measured"
when = [{ kind = "flag", flag = "rw_najma_lamp_measured" }]
text = "四月夜里，我的桑布克从亚丁往北，贴着也门的岸走。过扎比德海口的时候，舵手指着岸上说：那里有一盏灯。不用看我也知道是哪一盏。灯在宣礼台顶上，不偏，不晃，跟我十五岁那年在学堂船头量下的方位一丝不差，我那张海图上点的那个点，如今成了真的。我让船在外锚地停了半夜，划小艇上岸。穆巴拉克坐在门口，头发白了一半，听见桨声站起来，先抬头去看灯，再回过头来看我。"

[[tracks.chapters.choices]]
key = "coffee"
text = "坐下喝他的咖啡，听他讲这几年"
next = "l2_war"
effects = [{ kind = "flag", flag = "rw_najma_lamp_coffee" }]
reply = "他讲的都是灯：哪年的油贵，哪一夜风大，灯罩被吹下来两回，有一回是一条迷了路的渔船靠着这盏灯摸回了海口，船上的人第二天送来一筐鱼。他一件也没讲他自己。我问他那扇门后来开过没有。他笑笑，给我添了一杯。"

[[tracks.chapters.choices]]
key = "chart"
text = "把这盏灯写进航簿，注明点灯的人"
next = "l2_war"
effects = [{ kind = "flag", flag = "rw_najma_lamp_charted" }, { kind = "skill", skill = "cartography", value = 3 }]
reply = "我在航簿里写：扎比德海口，宣礼台灯，日落点，日出熄；点灯人，穆巴拉克。写完念给他听。他听到自己的名字，愣了一下，说：“把我的名字划掉，写‘守寺的人’。”我没有划。他也没再说。"

[[tracks.chapters.choices]]
key = "oil"
text = "留下一罐灯油钱"
requires = [{ kind = "cash", ge = 100 }]
hint = "身上的钱不够留一罐灯油。"
next = "l2_war"
effects = [{ kind = "cash", value = -100 }, { kind = "flag", flag = "rw_najma_lamp_oil" }]
reply = "他不肯收，说灯油要自己挣，挣来的油点着才亮。我说这不是给你的，是给那些夜里认这盏灯的船的。他想了很久，收了，说那就记在灯的账上，不记在他的。第二天天没亮，我看见他在宣礼台上，比平时多擦了一遍灯罩。"

[[tracks.chapters]]
key = "l2_war"
title = "不许点的灯"
text = "正月，山里的宰德派打到了扎比德城下，奥斯曼的兵退到海口。夜里有不挂旗的船从北边来，兵说是山里人的船，要从海口偷运粮食进城。一个奥斯曼军官带人到了小寺，叫穆巴拉克把灯灭了：灯亮着，等于给敌人指路。穆巴拉克站在宣礼台底下，不让开，也不吵。“灯是给船的，”他说，“船上是谁，灯不问。”军官的手按在了刀柄上。我的船正好泊在海口。"
speaker = "captain"
mood = "tense"
cast = ["najma"]
night = true
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1568, 1, 15] }]

[[tracks.chapters.choices]]
key = "talk"
text = "上岸替他说：这盏灯也领着奥斯曼的运兵船"
check = { attr = "eloquence", base = 45, per = 8 }
next = "l2b_hajj"
effects = [{ kind = "flag", flag = "rw_najma_lamp_saved" }]
reply = "我报了几个数：这一个月夜里进海口的船，挂奥斯曼旗的有几条，不挂旗的有几条，前者多出一倍。灯一灭，先撞礁的是他自己的船。军官想了想，说那就亮着，可他要派一个兵守在台上，看哪一边的船先靠岸。穆巴拉克给那个兵也煮了一杯咖啡。"
fail = { next = "l2b_hajj", effects = [{ kind = "flag", flag = "rw_najma_lamp_broken" }], news = "扎比德海口的人说，奥斯曼的兵砸了一座小清真寺的灯，守灯的老人在台阶上坐了一夜，天亮又去城里买了一只新灯罩。" }

[[tracks.chapters.choices]]
key = "relight"
text = "等兵走了，夜里帮他把灯重新点上"
next = "l2b_hajj"
effects = [{ kind = "flag", flag = "rw_najma_lamp_relit" }]
reply = "灯被兵吹灭了。半夜我划小艇上岸，他已经坐在台阶上等我，好像知道我会来。我们一前一后爬上宣礼台，他捂着风，我打火。灯芯着了的那一下，他低声念了一句什么，我没听清。第二天一早，军官派人来问是谁点的，他说是他，一个人。"

[[tracks.chapters.choices]]
key = "stay"
text = "这是陆上的仗，我的船不靠岸"
next = "l2b_hajj"
effects = [{ kind = "flag", flag = "rw_najma_lamp_left" }]
reply = "我没有上岸，在船上看着。灯灭了，过了一会儿又亮了，又灭了，又亮了。到天亮前，它一直亮着。后来我听说，那一夜军官叫人吹了它四回，穆巴拉克点了四回，第五回军官没再叫人上去。没有人知道他为什么不叫了。"

[[tracks.chapters]]
key = "l2b_hajj"
title = "一个人的位子"
text = "正月，我领着去吉达的船北上，在扎比德海口补水。穆巴拉克听说我要去吉达，夜里划着一条借来的小舢板到我船边，扶着船舷问：船上还有没有一个人的位子。他这辈子没去过麦加。他说他攒了十一年的灯油钱，够买一张船票。我说有。他点点头，划了回去。第二天一早他又划来了，手里提着那只灯罩。"
speaker = "captain"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act2" }, { kind = "date", from = [1577, 1, 10] }]

[[tracks.chapters.choices]]
key = "go"
text = "说：你去，灯我找人替你点"
next = "l3_last"
effects = [{ kind = "flag", flag = "rw_najma_lamp_offered_seat" }]
reply = "他把灯罩放在我的船舷上，摇摇头。“我想了一夜，”他说，“那扇门在哪里开都一样，灯只在这里。”他把攒了十一年的钱倒在我手里，说替他交给禁寺边守夜的人，一文也别留。我数了数，铜钱居多，一共不到一张船票的一半。他攒错了数。他自己知道。"

[[tracks.chapters.choices]]
key = "tell"
text = "答应他：回来的时候，把麦加一样一样讲给他听"
next = "l3_last"
effects = [{ kind = "flag", flag = "rw_najma_lamp_promised_tell" }]
reply = "第二年我回来，在小寺门口坐了一整夜，把麦加讲给他听：禁寺的柱廊，夜里绕着天房走的人，渗渗泉的水是什么味道。他闭着眼听，听完说：跟我看见的不一样，也一样。天亮了，他起身去吹灯。"

[[tracks.chapters.choices]]
key = "shade"
text = "收下那只灯罩，替他带到吉达去"
next = "l3_last"
effects = [{ kind = "flag", flag = "rw_najma_lamp_shade" }]
reply = "他说灯罩替他去就够了，灯还在，他再买一只。那只灯罩跟着我的船去了吉达，又跟着回来。回来时我把它还给他，他翻来覆去地看，像在找上面有没有沾到别处的光。看完他把它挂回了宣礼台，挂在新的那一只旁边。"

[[tracks.chapters]]
key = "l3_last"
title = "最后一回点灯"
text = "三月，我又过扎比德海口，天还没黑透，宣礼台顶上的灯已经亮了。上了岸才知道，穆巴拉克前天夜里死了，死在宣礼台的梯子上，手里还攥着火绒。灯是海口一个卖鱼的孩子替他点的。孩子说，老人教过他：太阳落进海里一半的时候点，早了费油，晚了船看不见。屋里那张席子、那只水罐都在，经书合着，夹着一粒焙得很黑的咖啡豆。"
speaker = "captain"
mood = "sad"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_main_najma_act3" }, { kind = "date", from = [1582, 3, 1] }]

[[tracks.chapters.variants]]
key = "a1_bean"
when = [{ kind = "flag", flag = "rw_najma_seer_refused" }]
text = "三月，我又过扎比德海口，天还没黑透，宣礼台顶上的灯已经亮了。上了岸才知道，穆巴拉克前天夜里死了，死在宣礼台的梯子上，手里还攥着火绒。灯是海口一个卖鱼的孩子替他点的。孩子说，老人教过他：太阳落进海里一半的时候点，早了费油，晚了船看不见。屋里那张席子、那只水罐都在，经书合着，夹着一粒焙得很黑的咖啡豆。我十四岁那年，他还我那一成钱的时候，布包里也压着这样一粒。"

[[tracks.chapters.choices]]
key = "light"
text = "今晚我来点"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_lamp_last_lit" }]
reply = "第二天傍晚，我照那孩子说的，等太阳落进海里一半，才爬上梯子去点。灯芯着了，我在台上站了一会儿，顺手量了北极星，九指上下，跟我十几岁时在扎比德的屋顶上量的一样。我不知道他那一回看见了什么。可从这里往海上看，看得见很多船，每一条都在往这盏灯转。"

[[tracks.chapters.choices]]
key = "boy"
text = "把灯油钱留给那孩子，叫他接着点"
requires = [{ kind = "cash", ge = 200 }]
hint = "身上的钱不够留下灯油钱。"
next = "done"
effects = [{ kind = "cash", value = -200 }, { kind = "flag", flag = "rw_najma_lamp_boy" }]
reply = "孩子不敢接，说他娘会以为他偷的。我叫了海口卖鱼的几个大人来作证，把钱当面交到他手里，说这是灯的钱，一年一年地点。孩子把钱揣进怀里，跑上宣礼台，把灯罩擦了一遍，学的正是老人的样子，先擦一面，再擦另一面。"

[[tracks.chapters.choices]]
key = "last_words"
text = "问那孩子：他最后说了什么"
next = "done"
effects = [{ kind = "flag", flag = "rw_najma_lamp_last_words" }]
reply = "孩子想了想，说老人那天夜里一直在笑，说门又开了一条缝。孩子问他什么门，他说你以后就知道了，不知道也不要紧，你点灯就行。孩子说完问我：领航的，是什么门？我说我也不知道。我是真的不知道。"
