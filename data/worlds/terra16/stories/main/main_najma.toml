# 2026-11-12 剧情增写：读养成期人物线 B「装订线」的旗标（两项互斥），只换一句。
[[tracks.chapters.variants]]
key = "rw_promised"
when = [{ kind = "flag", flag = "rw_najma_promised_mother" }]
text = "正午的尤尔法，拉希德家的院子。父亲老了，坐在门槛上补网。母亲把嫁妆箱从里屋拖出来：印度柚木，黄铜钉，开盖一股玫瑰水和樟脑的味道。箱底用一块旧帆布包着外曾祖父的手稿。我小时候偷看过一回，挨了一顿骂。“你自己有船十几年了，该给你了。”母亲说。她把稿子递过来，手在最后一页上按了一下才松开。我十五岁那年答应过她不找的那一行，她还记着。我翻到写南方星的那一联。上半句，正是贾法尔在霍尔木兹念过的那半句。两句一对，我在心里过了一遍，差一个词。稿子上没有他念的那个词。这一行的韵押得别扭，他不会押错韵。“你外曾祖父写诗，押不上的地方，从来不硬押。”母亲说。父亲抬起头，问的是另一件事：“这回在家住几天？”"

[[tracks.chapters.variants]]
key = "rw_asked_line"
when = [{ kind = "flag", flag = "rw_najma_asked_line" }]
text = "正午的尤尔法，拉希德家的院子。父亲老了，坐在门槛上补网。母亲把嫁妆箱从里屋拖出来：印度柚木，黄铜钉，开盖一股玫瑰水和樟脑的味道。箱底用一块旧帆布包着外曾祖父的手稿。我小时候偷看过一回，挨了一顿骂。“你自己有船十几年了，该给你了。”母亲说。她又补了一句：“走得够远了。可还不够那一行。”我翻到写南方星的那一联。上半句，正是贾法尔在霍尔木兹念过的那半句。两句一对，我在心里过了一遍，差一个词。稿子上没有他念的那个词。这一行的韵押得别扭，他不会押错韵。“你外曾祖父写诗，押不上的地方，从来不硬押。”母亲说。父亲抬起头，问的是另一件事：“这回在家住几天？”"

# b04 押得别扭的韵：无地点，夜里弹出。星路的第一次量取。
[[tracks.chapters]]
key = "b04_star_check"
title = "押得别扭的韵"
text = "无月的夜，船泊着，海上一点风也没有，星多得压人。我把牵星板举到眼前，打结的绳咬在牙间。蜡板上是那几行押得别扭的诗，每一个别扭的韵脚都落在一颗星名上，后面跟着一个数，是牵星板上的指数。我一颗一颗量过去：先往南，再往西，绕过一片诗里只叫“最后的地”的海。量到最后，星路指向的海，不在我见过的任何一张图上。我第一次想到，外曾祖父也许走过一条谁都不知道的路。我（心里）：押不上的地方，都藏着星。我（数）：“第三颗，七指半。第四颗……不对，八指。”"
cast = ["najma"]
speaker = "captain"
mood = "mystic"
night = true
deadline_days = 60

[tracks.chapters.timeout]
next = "b05_bottle_seal"
effects = []

[[tracks.chapters.choices]]
key = "sight_full"
text = "照诗上的几行，一颗星一颗星地量"
check = { attr = "astronomy", base = 20, per = 7 }
next = "b05_bottle_seal"
effects = [{ kind = "item", item = "majid_hidden_route", qty = 1 }, { kind = "flag", flag = "c13_main_najma_star_route" }, { kind = "memory", memory = "mem-main_najma-b04", title = "别扭的韵" }]
reply = "最后一颗星落在牵星板的第九个结上。我把整条路抄成一列数，抄完手还在抖。天边泛白的时候，我才发现嘴里的绳结已经咬断了。"
fail = { next = "b05_bottle_seal", effects = [] }

[[tracks.chapters.choices]]
key = "sight_half"
text = "诗还有几处不通，先量量看"
check = { attr = "astronomy", base = 5, per = 8 }
next = "b05_bottle_seal"
effects = [{ kind = "item", item = "majid_hidden_route", qty = 1 }, { kind = "flag", flag = "c13_main_najma_star_route" }, { kind = "memory", memory = "mem-main_najma-b04", title = "别扭的韵" }]
reply = "缺的那几个字，我用星去补：哪颗星该在那里，字就该是哪个。补到第五颗，诗和天对上了。"
