# b01 三箱书：宰德派起义，扎比德的老夫人与她的书。
[[tracks.chapters]]
key = "b01_zabid"
title = "三箱书"
text = "冬天的摩卡海滩，从扎比德平原逃下来的人挤满了沙滩：驴车、包袱、哭的孩子。山里的宰德派打下来了，扎比德的城门白天也关着。讲圣训的老夫人坐在一辆驴车上下来。车上用麻绳捆着三只书箱，其中一只装着她这些年发出去的传授许可的底簿。奥斯曼的军官在征船运兵北上，给的价钱高。老夫人不肯先走，要人先装书。“先装书。”她说，“人老了沉，书不沉。”奥斯曼军官：“这条船我包了，一个兵一个座，钱当场给。”老夫人没有上船。她把那只底簿箱子推到我面前，自己往后退了一步。我（心里）：三箱书压舱，正好补上那一侧的偏。"
stage = "involve"
window = [[1567, 9, 1], [1568, 6, 30]]
at = "mocha"
cast = ["najma", "c8_zabid_woman_scholar"]
speaker = "captain"
mood = "sad"
news = "扎比德被围那年冬天，摩卡港边的书箱和运兵的船抢一个码头，一个尤尔法的女领航夹在中间。"

[tracks.chapters.default]
