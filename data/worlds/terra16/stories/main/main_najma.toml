fail = { next = "c01_aden_wreck", effects = [{ kind = "fame", value = 1 }, { kind = "reputation", faction = "ottoman", value = -3 }], news = "麦加的学生们说，有个阿拉伯女领航当众顶撞纳赫拉瓦利，被请出了讲学处。" }

[[tracks.chapters.choices]]
