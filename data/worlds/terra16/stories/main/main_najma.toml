# 主线·纳吉玛·星的路（故事 2.0，A5 / E37 契约）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_najma_atlantis 与本线同批登记；c06_after 的 when 加 c13_main_najma_atlantis_over，由补章的结局与 c05_dark_sea 的掉头 / 缺席分支设。
#   2026-11-12 剧情增写（第九批）：文件末尾加三条旁轨 main_najma_rw_debt_rope「债的绳子」、main_najma_rw_31st_bird「第三十一只鸟」、main_najma_rw_lamp「守灯的人」，
#   读养成期 najma_growth.toml 人物线设的 rw_najma_*；b03 加两段变体（读 rw_najma_promised_mother / _asked_line），mother_recites 追加 rw_najma_ms_with_mother。三条旁轨都不用口头禅。
#   旁轨里去世的人：萨菲娅 1576-04（r5）、拉希德 1579-03（r6）、玛丽亚姆 1584-03（m6 开头）；已有主线章节在这以后没有让他们出场。
#   c06_after 以前的 c05 星路选项另要 c11_atlantis_key_ready（星路在摩卡与《翠玉录》对读过，帆船才穿得过帷幕；锁定提示原文已合用）。
#   补章 at3 的 leave_astrolabe 留下铜星盘，设 c13_main_najma_astrolabe_left：c09_epilogue 的 a1—a4 变体读它（舱壁上挂的换成伊斯梅妮的小铜板）。
# 标签：主线；主角纳吉玛（najma，1540 年生，尤尔法人，拉希德之女）；轨道 main_najma（kind main，auto，门槛 a00_gate 读 c12_voyage_najma）。
# 章数：28 章（另有 a02_pearls，为拿着父亲珍珠去亚丁的分路章，由 take_pearls 经 next 进入，共 29 个章节 key）。一幕 a00—a08（10 个 key，1557—1566）、二幕 b01—b10（10 章，1567—1577）、三幕 c01—c09（9 章，1578—1590）。
# 亚特兰蒂斯补章另文件 main_najma_atlantis.toml（暂存，待 A8 / C11 之后登记）。
#
# 依据（史实）：伊本·马吉德《航海原理与规则之益》与航路诗，苏莱曼·马赫里一脉的星名与针路；纳赫拉瓦利《也门闪电》（麦加学者，写于 1577 年前后）；葡萄牙编年史记下的领航员 Malemo Caná（今多认为不是伊本·马吉德）；1554 年西迪·阿里·雷斯；宰德派起义与锡南帕夏重取也门（1569—70）；亚齐遣使伊斯坦布尔求炮；古尔巴丹一行的朝觐与 1580 年亚丁外海的船难；米尔·阿里·贝伊 1581 年袭马斯喀特、1585—89 年斯瓦希里海岸；特塞拉岛 1583 年的海战；L23 日食之争为本世界线平移。
# 原创：纳吉玛一家（拉希德、母亲、那只嫁妆箱）、贾法尔与他添的那个词、老潜水人、老渔夫、苏菲长老、广州的回回商人与老教长的情节、星路与铅封那一联、晾诗稿的帆。
# 待核：通行证上画圣像一说；纳赫拉瓦利在页边添字为本世界线的写法；1581 年马斯喀特的具体月份；L23 日食的日期由 C10 定。
#
# 读的旗标：c12_voyage_najma（门槛）；c7_bond_rania_* / c7_bond_zahra_* / c7_pair_rania_zahra_*（b01 变体）；c7_bond_shadia_*（c02 变体）；atlantis_council_met（c06 变体，C11）；l23_eclipse_calculation_hui_calendar_adopted（b09 变体，C10）；h59_mir_ali_coast_coastal_autonomy（c08 选项互斥与变体，C10）。
