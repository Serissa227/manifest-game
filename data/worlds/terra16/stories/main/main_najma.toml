reply = "我和巴拉卡一个走海、一个走岸，三天跑了四座城。巴拉卡每到一座城先讲一段史诗，讲完了才说正事；我每到一座城，只报一个数：一条船，几支桨。"

[[tracks.chapters.choices]]
key = "quarrel"
text = "先跟巴拉卡把那颗星叫什么吵清楚"
