# c07 一颗星的名字：蒙巴萨。米尔·阿里南下，巴拉卡与她为一颗星吵起来。（不写恋情）
[[tracks.chapters]]
key = "c07_mombasa"
title = "一颗星的名字"
text = "蒙巴萨的港口，米尔·阿里的桨帆船挂着红旗泊在岛边。只有一条，他说那是苏丹的舰队。北边帕泰、拉穆的旗已经换了。码头上，巴拉卡坐在一只黄铜小箱上，箱子里装着称金的砝码。他一眼认出了我，张口就是一段斯瓦希里史诗，说的是一个女领航和一颗星。我们为那颗星叫什么吵了起来。我报阿拉伯名和指数，他报斯瓦希里名和他父亲的说法。米尔·阿里：“看见那条船没有？那是苏丹的舰队。”巴拉卡：“你报的是阿拉伯人的名字，我报的是我们的。星又不识字，叫哪个它都亮。”我：“它不识字。可你量的高度又少了半指。”吵到最后，巴拉卡说，他父亲那年在蒙巴萨见过一个报星从不差一丝的阿拉伯老领航。我忽然不吵了。那是我父亲教我的报法。"
stage = "involve"
window = [[1586, 1, 1], [1586, 6, 30]]
at = "mombasa"
cast = ["najma", "mir_ali_bey", "baraka"]
speaker = "captain"
mood = "cheerful"
news = "蒙巴萨码头上的人说，基尔瓦那个讲史诗的金商和一个阿拉伯女领航为一颗星吵了一下午，米尔·阿里在旁边看得直乐。"

[tracks.chapters.default]
next = "c08_zimba"
effects = []
news = "米尔·阿里·贝伊的桨帆船到了蒙巴萨，北边的帕泰和拉穆都升起了奥斯曼的红旗，码头上的人议论了一整天。"

[[tracks.chapters.choices]]
