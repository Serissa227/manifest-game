# at3 灯的去处：离开外港的前一夜，最外一圈尽头有一根空着的铜桩，雾从外海涌进来。
# 两个落点：把灯留在铜桩上（交出灯笼，称号），或带回月港天妃宫。都不改主线结局。
[[tracks.chapters]]
key = "at3_where_lamp_goes"
title = "灯的去处"
text = "离开外港的前一夜，雾从外海涌进来。伊斯梅妮领我走到环形码头最外面一圈的尽头，那里立着一根空铜桩，上头什么也没挂，桩顶被海风磨得发亮。“很久以前，这里挂过一盏灯，给迷路的船看的。”她说，“后来墙会自己亮了，就没有人再点。”我抬头看墙。光从墙里透出来，亮是亮，照到雾边上就散了，像水泼在油布上。雾里什么也看不见，只有火照得进去。月港外的礁滩上，天黑了渔家的女人就往岸边点火把，一支接一支，最后一条船进了港才收。我把灯笼举到铜桩底下。灯芯在纸壳里一下子站直了，不歪，不跳，像回到了它该待的地方。伊斯梅妮盯着那点火：“它会灭的。外面的火都会灭。”我笑了：“会灭就有人添油。这个，我们月港人最拿手。”"
mood = "tender"
speaker = "captain"
at = "atlantis_port"
night = true
cast = ["ismene"]
deadline = [1585, 12, 31]

[[tracks.chapters.choices]]
key = "leave_lamp"
text = "把灯笼挂上那根铜桩，给雾里迷路的船照路"
requires = [{ kind = "item", item = "tianfei_lantern", qty = 1 }]
hint = "你身上没有灯可挂。"
effects = [{ kind = "item", item = "tianfei_lantern", qty = -1 }, { kind = "title", title = "替雾里点灯的人" }, { kind = "memory", memory = "mem-main_lin_wandeng_atlantis-at3", title = "灯的去处" }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }, { kind = "flag", flag = "c13_main_lin_wandeng_lamp_left" }]
next = "done"
reply = "我把灯笼挂上铜桩，教伊斯梅妮怎么剪灯芯，纸破了怎么糊，浆要薄，厚了一见潮就起皮。老话讲，天好的时候就得把落雨天的粮存足，油也一样，我给她留了三罐。她学得很慢，很认真，剪坏了两根，没吭声，换了第三根。我的船驶出雾的时候，回头还看得见那一点红。"
news = "亚特兰蒂斯外港最外一圈的铜桩上，如今挂了一盏红纸灯笼，是海上来的女船主留下的，守庙的女祭司在学剪灯芯。"

[[tracks.chapters.choices]]
key = "take_home"
text = "把灯带回月港，挂回天妃宫的檐下"
effects = [{ kind = "affinity", person = "ismene", value = 5 }, { kind = "fame", value = 3 }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }]
next = "done"
reply = "伊斯梅妮送我到码头。雾在她背后一层一层合上，她说她会记得，外面有一种火是会怕风的。我把灯笼提回腰上，火苗又歪了，歪得叫人踏实。我说下回带一盏新的给你，红纸我糊，竹骨我自己破。她想了想：“那就说定了。”说完，她把手指按在铜桩上，像在那儿记了一道。"
news = "亚特兰蒂斯外港，海上来的女船主带着红灯笼起锚，守庙的女祭司送到码头，说好了下回要一盏新的。"

[[tracks.chapters.variants]]
key = "shown"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_at_lamp_shown" }]
text = "离开外港的前一夜，雾从外海涌进来。伊斯梅妮领我走到环形码头最外面一圈的尽头，那里立着一根空铜桩，上头什么也没挂，桩顶被海风磨得发亮。她指给我看桩身上一道补过的接缝，说这根铜桩也补过。那晚我给她看过竹骨上补的地方，她记得。“很久以前，这里挂过一盏灯，给迷路的船看的。”她说，“后来墙会自己亮了，就没有人再点。”我抬头看墙。光从墙里透出来，亮是亮，照到雾边上就散了，像水泼在油布上。雾里什么也看不见，只有火照得进去。月港外的礁滩上，天黑了渔家的女人就往岸边点火把，一支接一支，最后一条船进了港才收。我把灯笼举到铜桩底下。灯芯在纸壳里一下子站直了，不歪，不跳，像回到了它该待的地方。伊斯梅妮盯着那点火：“它会灭的。外面的火都会灭。”我笑了：“会灭就有人添油。这个，我们月港人最拿手。”"

