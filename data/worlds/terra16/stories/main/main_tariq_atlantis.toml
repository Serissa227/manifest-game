[[tracks.chapters.choices]]
key = "hang_key"
text = "把钥匙挂在门框上那颗生锈的钉子上，不进门"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "钥匙没跟着你来，没东西可挂。"
next = "done"
effects = [{ kind = "item", item = "granada_key", qty = -1 }, { kind = "memory", memory = "mem-main_tariq_atlantis-at3", title = "井边的钥匙" }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }, { kind = "flag", flag = "c13_main_tariq_key_left" }]
news = "亚特兰蒂斯外港坡顶的井边，有个外乡船长挂上了一把铁钥匙，没有进那扇门。"
reply = "钉子的高度刚好是祖母伸手能够到的地方。我踮了一下脚，把钥匙的环套上去，钉子锈得厉害，蹭了我一手红。钥匙晃了两下就停了，停的时候齿朝着日落。伊斯梅妮没有上来帮忙，只站在井沿边看着，末了说：“挂在这里的东西，风会替你收着。”我说：“那就让它在这儿晒太阳。”她笑了一下，这是我头一回见她笑。钉子旁的石缝里也开着一小丛蓝花，我叫不出名字，开得没心没肺。我把手在衣角上擦了擦，蓝花的汁沾在指头上，擦不掉。"

[[tracks.chapters.choices]]
key = "keep_key"
text = "不挂不送，回船去讲给妹妹的孩子听"
next = "done"
effects = [{ kind = "memory", memory = "mem-main_tariq_atlantis-at3", title = "井边的钥匙" }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }]
news = "亚特兰蒂斯外港有个外乡船长来井边打水，喝了一口，没进那扇半开的门。"
reply = "我在门口站了一会儿，从井里打了一桶水喝，比海水甜一口。水凉得牙根发酸，我一边喝一边笑，笑自己在这地方竟喝到了不咸的水。回阿尔及尔以后，我要讲给妹妹听，再讲给她的孩子：外面有一扇门，没人锁，门前的水不咸。回船的路上，我把这口水的味道编进了曲子里，门的事一个字也没编。回头看，井边那扇门还半开着，门轴没有再响。我把水桶放回井沿，绳子的印子还在，我手上的水印子也留下了。"

[[tracks.chapters.choices]]
key = "give_ismene"
text = "把钥匙交给伊斯梅妮，让律法柱边多一样外面的东西"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "钥匙没跟着你来，没东西可交。"
next = "done"
effects = [{ kind = "item", item = "granada_key", qty = -1 }, { kind = "affinity", person = "ismene", value = 5 }, { kind = "memory", memory = "mem-main_tariq_atlantis-at3", title = "井边的钥匙" }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }, { kind = "flag", flag = "c13_main_tariq_key_left" }]
news = "亚特兰蒂斯外港的女祭司收下了一把阿尔及尔来的铁钥匙，说律法没说不许。"
reply = "她照旧先看背面，看了很久，看到我以为她要还给我。然后她说：“律法没说不许收外面的东西。它也没说，收了就得还。”她从袖子里摸出一只小木匣，把钥匙放进去。匣子里已经躺着几样我认不出来历的旧物，她说是前人收下的，收下的理由都写在匣盖里面。律法没说不许，她也找得出收下它的理由。她把匣盖合上，手指在盖子上停了一下，才松开。我走出几步，回头看见她还在看那只木匣，没有抬头。"

[[tracks.chapters.variants]]
key = "a_spoke"
when = [{ kind = "flag", flag = "c13_main_tariq_council_spoke" }, { kind = "flag", flag = "c13_main_tariq_keepsake" }]
text = "离港的前一天，伊斯梅妮带我上了外港头顶的一片坡地。白墙一层一层往上叠，像一摞没晾干的白布。坡上风大，晒过一天的墙还是热的，贴上去能摸到底下石头的凉。坡顶有一口井，井沿是青石，绳子磨过的印子一圈一圈，磨得很深，不知是哪一代人打水磨出来的。井边长着一丛蓝花，石缝里也开，不挑地方。井旁一扇木门半开着，门板灰白，门轴吱呀响了一声。门框外侧钉着一颗生锈的钉子，钉子上什么也没挂。伊斯梅妮走在我前头，忽然说：“那一夜长凳那头敲的三下，是我敲的。”这扇门，像极了祖母嘴里的阿尔拜辛。“这扇门没人锁过。你要进去，就进去。”伊斯梅妮说。她没看我，看的是门。（心里）背面姑娘今天没翻东西，只看门。“进去了，就回不去了。我还有一条船停在外面。”我说。我站在门前，攥着祖母的钥匙，门却不要它。（心里）门朝日落。原来是这一扇。原来我不想进。"

[[tracks.chapters.variants]]
key = "a_spoke_nokey"
when = [{ kind = "flag", flag = "c13_main_tariq_council_spoke" }, { kind = "flag", flag = "c13_main_tariq_keepsake", value = false }]
text = "离港的前一天，伊斯梅妮带我上了外港头顶的一片坡地。白墙一层一层往上叠，像一摞没晾干的白布。坡上风大，晒过一天的墙还是热的，贴上去能摸到底下石头的凉。坡顶有一口井，井沿是青石，绳子磨过的印子一圈一圈，磨得很深，不知是哪一代人打水磨出来的。井边长着一丛蓝花，石缝里也开，不挑地方。井旁一扇木门半开着，门板灰白，门轴吱呀响了一声。门框外侧钉着一颗生锈的钉子，钉子上什么也没挂。伊斯梅妮走在我前头，忽然说：“那一夜长凳那头敲的三下，是我敲的。”这扇门，像极了祖母嘴里的阿尔拜辛。“这扇门没人锁过。你要进去，就进去。”伊斯梅妮说。她没看我，看的是门。（心里）背面姑娘今天没翻东西，只看门。“进去了，就回不去了。我还有一条船停在外面。”我说。钥匙在阿尔及尔，我只把祖母那句歌唱给井听。（心里）门朝日落。原来是这一扇。原来我不想进。"

