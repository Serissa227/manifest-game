# 第 3 章：井边的门。门是开着的，钥匙用不上；他站在门口，忽然不想进去。
[[tracks.chapters]]
key = "at3_granada"
title = "回不去的格拉纳达"
text = "离港的前一天，伊斯梅妮带我上了外港头顶的一片坡地。白墙一层一层往上叠，像一摞没晾干的白布。坡上风大，晒过一天的墙还是热的，贴上去能摸到底下石头的凉。坡顶有一口井，井沿是青石，绳子磨过的印子一圈一圈，磨得很深，不知是哪一代人打水磨出来的。井边长着一丛蓝花，石缝里也开，不挑地方。井旁一扇木门半开着，门板灰白，门轴吱呀响了一声。门框外侧钉着一颗生锈的钉子，钉子上什么也没挂。这扇门，像极了祖母嘴里的阿尔拜辛。“这扇门没人锁过。你要进去，就进去。”伊斯梅妮说。她没看我，看的是门。（心里）背面姑娘今天没翻东西，只看门。“进去了，就回不去了。我还有一条船停在外面。”我说。我站在门前，攥着祖母的钥匙，门却不要它。（心里）门朝日落。原来是这一扇。原来我不想进。"
when = []
at = "atlantis_port"
cast = ["ismene"]
