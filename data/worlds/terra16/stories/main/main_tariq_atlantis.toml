key = "v1_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "神庙里的火熄了。十个王穿着深蓝的袍子，坐在黑暗里，谁也看不清谁的脸。外面来的人坐在靠门的长凳上，一个挨一个，没人先开口。门边的火盆早灭了，只剩一股烧焦的油味。有人在黑暗里低声传话：海要合上了。伊斯梅妮站在我身后，压着嗓子说：“这里不是码头上的酒馆。轮到你，说真话。”他们要决定黑暗之海是开是合，还是交给谁守。轮到我时，我想的是那把没有门的锁，海倒想不起来。我船上的规矩是：货归你，人归他自己。可门一拆，人就只能站在门外。黑暗里有个声音问：“你是哪一岸的人？”（心里）黑暗里看不见脸，说笑话最难。"

