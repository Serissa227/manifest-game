cast = ["ismene"]

# 第 1 章：外港的门。门上没有锁眼，律法的门不靠铁。伊斯梅妮的见面句只在这里用一次。
[[tracks.chapters]]
key = "at1_ring_gates"
title = "不上锁的门"
text = "外港是一圈一圈的。一圈水，一圈陆，陆上的城墙套着三道：外头一道包着铜，中间一道包着锡，最里头那道泛着红光，是山铜。每座桥头都立着一扇厚木门，门框磨得发亮，门板上连个锁眼也没有。我把“鸥”泊在外湾，一个人走上桥。祖母的铁钥匙用一根丝线挂在胸口，齿上的锈蹭得皮肤发痒。守柱的是个年轻女人，灰袍，手里捧着一卷木板，柱子上刻的全是律法。她先看我的腰间，再看我的手，最后才看我的脸。（心里）我给她起了个外号，叫背面姑娘。看东西先翻背面的人，看人大概也一样。她说：“你来做什么？先说这个。谁家的船、哪一国的人，后头再报也不迟。”我把钥匙举到门前去比，比了半天，才明白手里是件没用的东西。门上别说钥匙，连一根针都穿不过去。我说：“我来找一扇门。我手里这把钥匙，原来那扇门没了。”她绕着钥匙转了半圈，没有伸手去接，只说：“这里锁人的是律法，不是铁。”（心里）门上没有锁眼。祖母，你骗了我一辈子，还是我听错了一辈子？"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "flag", flag = "c13_main_tariq_crossed" }]
at = "atlantis_port"
cast = ["ismene"]
speaker = "captain"
mood = "mystic"
night = false
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_tariq_atlantis_over" }]

[[tracks.chapters.choices]]
key = "show_key"
text = "把钥匙放在律法柱前，讲阿尔拜辛那扇门"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "钥匙留在了阿尔及尔。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 5 }]
news = "亚特兰蒂斯外港的守柱人接过一把阿尔及尔来的旧铁钥匙，翻过来看背面，说门胀了，所以锉。"
reply = "我讲了阿尔拜辛，讲祖母在井边念过的那几句，讲到一半卡住了，只好拿手比划。她没笑。钥匙刚搁到柱前，她先说了一句：“把誓词读完，再碰那根柱子。”我硬着头皮背了一遍，背错了两个字，她也没纠正。然后她才拿起钥匙，翻过来看背面。“齿是后来锉过的。门胀了，所以锉。你们的门也会胀。”她把齿按在柱子上一道旧刻痕边上比了比，刻痕比齿宽一点，她点了点头，没说是还是不是。我问她这样算不算验过，她说：“算你走到了门前。”"

[[tracks.chapters.choices]]
key = "ask_doors"
text = "先问她：你们的门为什么不上锁"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 3 }]
news = "有个外乡船长问亚特兰蒂斯外港的女祭司，为什么门上不上锁。女祭司说，守钥匙的人会老。"
reply = "“上锁的门要有人守钥匙。守钥匙的人会老，会死，会把钥匙传错了人。门一锁，就得再有一个人替他守着，一代一代，守到没人记得钥匙原来挂在哪扇门上。”我问：“那门不上锁，贼来了怎么办？”她说：“贼进得来。门本来就不是拿来挡贼的。”说完她看了一眼我胸口那根丝线，又看了看桥头那扇门，没有再往下说。门闩是木头的，磨得发亮，上头没有一根铁。我想起祖母家的门闩也是木头的，冬天她总拿手去摸。"

[[tracks.chapters.choices]]
key = "play_oud"
text = "不回答，弹一支格拉纳达的曲子"
requires = [{ kind = "item", item = "oud", qty = 1 }]
hint = "琴没带上船。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 4 }]
news = "亚特兰蒂斯外港的桥头有人弹起格拉纳达的琴，弹到一半，一扇门自己开了一条缝。"
reply = "我把琴从背上解下来，第一根弦就走了音，自己先笑出声。格拉纳达的曲子不等人，我索性凭记忆弹下去。弹到一半，桥头那扇门自己开了一条缝，也许是风，门缝里吹出来的风带着潮湿的石头味。伊斯梅妮没有动，只说：“外面来的人弹琴，我们会记在律法柱的背面。”我问记什么，她说：“记你弹错的那几根弦，还有你停下来的地方。”琴弦在潮气里松了，我拧紧，又弹了一小段，这回没走音。弹完，我才听见自己的喘气声，比弦还乱。"

[[tracks.chapters.variants]]
key = "a_no_key"
when = [{ kind = "flag", flag = "c13_main_tariq_keepsake", value = false }]
text = "外港是一圈一圈的。一圈水，一圈陆，陆上的城墙套着三道：外头一道包着铜，中间一道包着锡，最里头那道泛着红光，是山铜。每座桥头都立着一扇厚木门，门框磨得发亮，门板上连个锁眼也没有。我把“鸥”泊在外湾，空着手走上桥。钥匙没带来，压在阿尔及尔妹妹的木盒底下，我身上只剩祖母教过的那一句歌。守柱的是个年轻女人，灰袍，手里捧着一卷木板，柱子上刻的全是律法。她先看我的腰间，再看我的手，最后才看我的脸。（心里）我给她起了个外号，叫背面姑娘。看东西先翻背面的人，看人大概也一样。她说：“你来做什么？先说这个。谁家的船、哪一国的人，后头再报也不迟。”我说：“我来找一扇门。祖母的门，我只记得一句歌。”她把木板抱紧，看了我很久，说：“这里锁人的是律法，不是铁。门不认钥匙。”（心里）门上没有锁眼。祖母，你骗了我一辈子，还是我听错了一辈子？"

# 第 2 章：十王会议上的一夜。只写这位主角的位置与一句话；会议本身归 C11。
[[tracks.chapters]]
key = "at2_council"
title = "被赶出门的人"
text = "神庙里的火熄了。十个王穿着深蓝的袍子，坐在黑暗里，谁也看不清谁的脸。外面来的人坐在靠门的长凳上，一个挨一个，没人先开口。门边的火盆早灭了，只剩一股烧焦的油味，从柱子那边慢慢飘过来。伊斯梅妮站在我身后，压着嗓子说：“这里不是码头上的酒馆。轮到你，说真话。”他们要决定黑暗之海是开是合，还是交给谁守。轮到我时，我想的是那把没有门的锁，海倒想不起来。我船上的规矩是：货归你，人归他自己。可门一拆，人就只能站在门外。黑暗里有个声音问：“你是哪一岸的人？”（心里）黑暗里看不见脸，说笑话最难。"
when = []
at = "atlantis_port"
cast = ["ismene"]
speaker = "captain"
mood = "mystic"
night = true
deadline = [1585, 6, 30]

[tracks.chapters.timeout]
next = "at3_granada"
effects = []

[[tracks.chapters.choices]]
key = "for_exiles"
text = "替被赶出家门的人说一句：门开着，他们才回得来"
next = "at3_granada"
effects = [{ kind = "flag", flag = "c13_main_tariq_council_spoke" }, { kind = "affinity", person = "ismene", value = 3 }]
news = "亚特兰蒂斯神庙那一夜，有个外乡船长替被赶出家门的人说了话，靠门的长凳那头有人轻轻敲了三下。"
reply = "我说：“两岸的。我家的门被拆了两回，一回在格拉纳达，一回在我心里。”话出口，我觉得自己说得太像唱歌，就补一句，免得显得装腔：“我不是来求门的。我是替那些进不了门的人，问一句门还开不开。”黑暗里没人出声。我心里想，完了，准备好的笑话今晚用不上了。过了很久，靠门的长凳那头轻轻敲了三下。伊斯梅妮后来说，那是“记下了”的意思。那一下很轻，像怕被人听见。我没有坐回长凳，手心的汗把钥匙的齿都焐热了。"

[[tracks.chapters.choices]]
key = "joke"
text = "讲一个笑话，让十个王里至少有一个笑出声"
check = { attr = "eloquence", base = 20, per = 7 }
next = "at3_granada"
effects = [{ kind = "flag", flag = "c13_main_tariq_council_spoke" }, { kind = "affinity", person = "ismene", value = 2 }]
news = "亚特兰蒂斯神庙那一夜，有个外乡船长讲了个卖钥匙的笑话，最里头的位子上有人笑出了声。"
reply = "我讲一个老头在阿尔及尔卖钥匙：同一把卖了三回，每回都说这是最后一把。第三个买主气呼呼地问：门锁呢？老头说，门早就换过了，只剩这把钥匙还在卖。我故意压低声音讲到最后一句，像在码头上推销假货。黑暗里先是一阵安静，接着最里头的位子上传出一声短促的笑，又马上压下去了。伊斯梅妮在我身后咳了一声，我知道她也差点笑出来。我坐回长凳，两只手全是汗，比在海上打一仗还累。"
fail = { next = "at3_granada", effects = [], news = "亚特兰蒂斯神庙那一夜，外乡船长讲的笑话没人笑，女祭司叹了口气，这笔买卖算赔了。" }

[[tracks.chapters.choices]]
key = "raise_key"
text = "什么也不说，只把钥匙举起来"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "你手里没有可举的东西。"
next = "at3_granada"
effects = [{ kind = "flag", flag = "c13_main_tariq_council_spoke" }]
news = "亚特兰蒂斯神庙的火熄着，一个外乡人举着一把旧铁钥匙，一直举到火重新点起来。"
reply = "黑暗里谁也看不见钥匙。我把它举过头顶，齿朝着柱子的方向，一句话也没说。长凳上有人小声问旁边的人：那是什么？旁边的人说：一把钥匙。我举着，举到胳膊发酸，换到另一只手，还是举着。不知过了多久，最里头的火重新点起来了，火光先照到的就是那把钥匙，齿上的锈亮了一下。我的胳膊抖得厉害，钥匙却没晃，齿一直朝着柱子。放下来的时候，手指僵得半天伸不直。"

