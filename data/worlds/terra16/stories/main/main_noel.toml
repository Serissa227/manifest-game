key = "rw_debt"
when = [{ kind = "flag", flag = "rw_noel_paid_passage" }, { kind = "flag", flag = "c13_main_noel_gate_star", value = false }]
text = "安格拉的人还认克拉图院长做国王，港口的炮口朝着海；城外的人说，西班牙人在海湾登过一回岸，被岛民赶着一群牛冲回了海里。从安格拉往西，两三天的海路，是亚速尔最小的岛科尔武。岛上的老神父领我爬到山顶，山顶上只剩一座石座。石人早被国王的人拆走了，岛上的老人还指得出那条手臂指的方向：西边。老人们说：“石人是后来被国王的人拆走的，手还朝着西。”老神父说，二十五年前，一个系红缎带的老骑士死在这座石座边上，临死把一本日志交给他，说总有一天会有人来取。日志的夹页里有一张账，最末一行是：欠诺埃尔，五枚。后面画着一个圈。“他说，‘别让孩子以为链子是锁孩子的。’我那时候不懂，现在也不懂。”"

# C06：蓬塔德尔加达（亚速尔海战）。
[[tracks.chapters]]
key = "c06_azores_battle"
title = "蓬塔德尔加达"
text = "七月，圣米格尔岛外的海上一下子来了两支舰队：一边是法国人斯特罗齐带来的船，替克拉图院长争亚速尔；一边是圣克鲁斯侯爵阿尔瓦罗·德·巴赞从里斯本带来的盖伦船。二十六日早上，风从西北来，两边在蓬塔德尔加达外海撞在一起，打了一整天。我的船从安格拉赶到，法国人的旗舰已经着了火。打完以后，侯爵在维拉弗兰卡的广场上审俘虏。巴赞说：“没有委任状的人，在海上就是海盗。海盗不用审。”安东尼奥在一旁说：“葡萄牙只剩这几座岛了。骑士，你站哪一边？”"
stage = "involve"
window = [[1582, 7, 15], [1582, 8, 15]]
at = "angra"
cast = ["alvaro_de_bazan", "antonio_crato"]
speaker = "captain"
mood = "tense"
news = "圣米格尔岛外打了一整天，法国人的旗舰沉了。后来维拉弗兰卡的广场上，砍了好些法国人的头。"

