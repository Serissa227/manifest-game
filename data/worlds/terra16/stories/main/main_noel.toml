# 主线：诺埃尔·德·卡德纳（noel）·「链与缎带」（故事 2.0，A5 / E37 契约）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_noel_atlantis 与本线同批登记；c09_after 的 when 加 c13_main_noel_atlantis_over，由补章的结局与 c08_dark_sea 的掉头 / 缺席分支设。
#
# 标签：C13c 主线（haiku 写手）。诺埃尔是海峡骑士团最后一位骑士，嘴毒、骄傲、守信，早上叫不醒，
#       最讨厌被人盯着脸看，其实很怕孤单。一五四〇年生，一五五七年出海时十六岁。
#       第一幕 1557—1566（小姐骑士的揭开在 a04）、第二幕 1567—1577（海峡两岸，名册散在各地）、第三幕 1578—1590（失去与知道）。
#
# 依据（史实与原创的界线）：
#   史实：圣康坦（1557，只作新闻）、杰尔巴（1560，骨塔与水桶）、马耳他之围（1565，森格莱阿的木桩）、
#         阿尔普哈拉斯山区的摩里斯科人迁散（1569）、勒班陀（1571）、三王之战（1578）、
#         蓬塔德尔加达海战（1582）、无敌舰队（1588）；托莱多赫拉克勒斯洞的传说；阿尔及尔的俘虏大院与三一会赎俘（1580）。
#   原创：塔里法城堡的海峡骑士团与七十七个名字的名册；堡门上的铁链与两行铭文；科尔武岛的老团长日志；
#         诺埃尔的来历（卡塔利娜·奥尔蒂斯）；名册旁轨的三封来信（果阿、澳门、长崎）；绳铺的老人与刻痕。
#   待核：圣艾尔莫堡陷落与图尔古特之死的日子只借城里人的嘴说；三王之战中塞巴斯蒂安的下落（H49，只写传闻）；
#         科尔武的石像指向西方（只作老团长日志的描写）。
#
# 读写的共享旗标：
#   写：c13_main_noel（a00 default，全线与 NPC 线读）；c13_main_noel_first_mark（a01）；c13_main_noel_inscription_read、
#       c13_main_noel_gate_star（a03）；noel_unveiled 与 c13_main_noel_unveiled（a04 的每个分支与超时，C7 读）；
#       c13_main_noel_djerba_galley、c13_main_noel_lever_h18（a05，H18 杠杆钥匙，C10 用不用由 C10 定）；
#       c13_mark_toledo（一局只发一次，npc_noel_toledo 也读）；c13_main_noel_toledo_told / _descended / _sold / _shared；
#       c13_main_noel_malta_inside；c13_main_noel_name_malta（a10，c11 读）；
#       c13_main_noel_act2（b01 的 default 与每个选项）、c13_main_noel_act3（c01 的 timeout 与每个选项）；
#       名册旁轨 main_noel_roster 的 c13_main_noel_name_goa / _macao / _japan、_roster_paid、_east_search；
#       c13_main_noel_dissuaded（c01）；c13_main_noel_crossed / _turned_back / _absent；c13_main_noel_keepsake；
#       c13_main_noel_stance_open / _close / _hand；c13_main_noel_origin_known；c13_main_noel_done 与 _end_*。
#   读：c12_voyage_noel（a00 门槛）；c13_npc_mio_mate（r3 变体）；c13_mark_toledo（a08）；HIST 占位（见下）。
#
# 等待的包：
#   A9：门槛章 a00 加 {kind="protagonist", protagonist="noel"}；若引擎接管开轨道，auto 改 false。
#   A8：mark_* 发现物的许可流程（a08 印记章暂不加 discovery 目标）；majid_hidden_route 不在本线。
#   C9/A6：志向与家庭结局旗标（本线不读）。
#   C10：HIST 占位替换为 C10 的结果 key；杠杆钥匙 c13_main_noel_lever_h18 用不用由 C10 定。
#   C11：十王会议的 atlantis_council_met 与判决旗标（c09 变体读）；亚特兰蒂斯补章在 main_noel_atlantis.toml，本文件不含。
#   C7：noel_unveiled 由 a04 设，五条重逢读；a04 以前的章不写他/她指诺埃尔。
#
# HIST 占位清单（C10 替换为 key；改后的结果不存在则删除那一项，保留缺省一项）：
#   h22_malta_siege_ottoman_takes_malta（名册 r1 变体）、h32_alpujarras_morisco_autonomy（b02 变体）、h49_three_kings_sebastian_returns（c03 两项互斥，C10 不做就删 returned 项）。
#   其余史实只作文字、不读结果：H15、H18、H22（a10）、H32（b01）、H37、H49（c01、c02）、H53、H56、H60（c10）。
#
# 回忆插画清单（mem-main_noel-<章>）：
#   mem-main_noel-a01 七十六个缺席；mem-main_noel-a04 小姐骑士；mem-main_noel-a06 骨塔；
#   mem-main_noel-a08 洞口的刻痕；mem-main_noel-b04 砍断的锁；mem-main_noel-c03 雾里的王；
#   mem-main_noel-c05 西指的石座；mem-main_noel-c11 链与缎带。

[[tracks]]
key = "main_noel"
name = "链与缎带"
kind = "main"
start = "a00_gate"
auto = true

# 门槛见闻：只有选了诺埃尔的家庭才会在这里开轨道。
[[tracks.chapters]]
key = "a00_gate"
title = "授剑的红缎带"
text = "正月初，塔里法。东风刮了三天，海峡上一片白浪。城堡一早敲了钟，管事把骑士团那件黑袍红斗篷抱到城垛上晾，这件衣裳一年只在点名那天穿。鱼市上的人说，城堡里那位骑士昨天授了剑，剑柄上系着一条红缎带。卖金枪鱼的老妇人拿这事跟人打赌，嗓门大得半条街都听得见：“钟敲到第三遍，那位骑士才出门，头发还翘着。明早的弥撒，我押他赶不上。”"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "tarifa"
cast = ["noel"]
mood = "cheerful"
news = "塔里法城堡一早敲了钟，那位系红缎带的骑士授了剑。鱼市上的人说，骑士团如今就剩这一个人。"
when = [{ kind = "flag", flag = "c12_voyage_noel" }]

[tracks.chapters.default]
next = "a01_roll"
effects = [{ kind = "flag", flag = "c13_main_noel" }]

