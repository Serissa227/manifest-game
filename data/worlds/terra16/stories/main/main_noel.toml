# A08：洞口的刻痕（紧接 A07 弹出）。
[[tracks.chapters]]
key = "a08_toledo_mark"
title = "洞口的刻痕"
text = "一卷纸从特里亚纳捎到我手里，是绳铺的老人凭记性描的洞口刻痕。纸上是一排一排的小锁，有的锁着，有的开着，末尾画着一张有腿的桌子。老人在纸边写：“老辈人说，那间屋子每来一位新王，就加一把锁。”我数了数，锁一共二十六把，最后一把是开着的。托人捎来的话里还有一句：“二十六把锁，二十五把锁着。撬开最后一把的那个王，后来丢了整个西班牙。”撬锁的人丢了国。那间屋子里锁着的，到底是什么？"
speaker = "captain"
mood = "mystic"
cast = ["noel", "tariq"]
news = "托莱多那个封了的洞，听说有人描出了洞口的刻痕：一排一排的锁，最后一把是开着的。"

[[tracks.chapters.variants]]
key = "descended"
when = [{ kind = "flag", flag = "c13_main_noel_toledo_descended" }]
text = "蜡烛照到洞口第三块石头，冷风从深处吹上来，石面上一排一排刻着小锁，末尾一张有腿的桌子。我数到第二十六把，是开着的。老人在绳铺说过：“撬开最后一把的那个王，后来丢了整个西班牙。”我是在洞里想起来的。"

