[[tracks.chapters.variants]]
key = "rw_storm"
when = [{ kind = "flag", flag = "rw_noel_storm_heard" }]
text = "一五四一年，马丁和老团长在这座城东边的滩上上了岸，没能走到城门；我是从正门进来的。阿尔及尔关俘虏的大院子，当地人叫澡堂，白天比夜里还吵。我跟着三一会的人进城，袖子里揣着安全通行的文书。胡安修士在门房里摊开他那本磨破的赎俘簿，一个名字一个名字地念价钱：“名字一个一个念，别把人念成总数。”一个手残了的西班牙人坐在院子当中给人讲故事，讲到一半停下来，说上个月又跑了一回，又被抓了回来。他叫塞万提斯，身上带着唐·胡安的推荐信，帕夏以为他是个大人物，价钱开得吓人。同船来的人里，有个叫马丁·德·乌维达的，这个姓在名册上。塔里克靠在门框上说：“价我能压三成。再多，帕夏的书记要哭了。”"

# C01：别去非洲（限期）。国王要去摩洛哥。
[[tracks.chapters]]
key = "c01_sebastian"
title = "别去非洲"
text = "这年春天，里斯本河口泊满了船，连运牲口的平底船都征来了。国王二十四岁，要亲自去摩洛哥，替一个被赶下台的苏丹夺回王位，顺手把半个摩洛哥收到十字架底下。老臣们劝不住，他的舅舅、西班牙的腓力也劝不住。宫里的人说，谁劝，谁就是怕死。我被召进宫，因为国王想听海峡骑士讲讲对岸的海岸。“你们海峡的骑士，难道守着海峡就够了？”我说：“陛下，名册上十字比圆圈多。那些十字，都是过了海的。”国王听完，只问了一句：海峡骑士团当年，有没有人怕过死。"
speaker = "captain"
mood = "tense"
cast = ["sebastian_i", "noel"]
at = "lisbon"
when = [{ kind = "date", from = [1578, 3, 1] }]
deadline = [1578, 6, 24]
news = "里斯本河口泊满了去摩洛哥的船，连运牲口的平底船都征了。宫里有个海峡来的骑士当面劝过国王。"

