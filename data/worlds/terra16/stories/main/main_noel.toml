fail = { next = "a07_toledo", effects = [{ kind = "memory", memory = "mem-main_noel-a06", title = "骨塔" }], news = "杰尔巴的浅滩上，一个土耳其船长跟那位系红缎带的骑士比了一场。骑士被打进水里，船长没追，转身走了。" }

# A07：托莱多的绳铺老人。
[[tracks.chapters]]
key = "a07_toledo"
title = "下过洞的老人"
text = "塞维利亚河对岸的特里亚纳，绳铺挨着陶窑，空气里一股柏油味。老人坐在门口搓缆绳，手指粗得像绳结。十几年前，托莱多的大主教派人下赫拉克勒斯洞，是他在洞口放的绳子，每隔一臂打一个结，他数着结把人放下去，又数着结把人拉上来。拉上来的人只说深处有水声和冷风，有一个上来以后病死了，洞口随后又封上。前几天，一个说葡萄牙话的人来找过他，自称从托马尔来。今天他又来了，钱袋往桌上一放。老人头也不抬：“一个结一臂长。我放下去四十一个结，拉上来的人，只剩三十九个结那么高的胆子。”那人说：“骑士，你我都替王家做事。卖给我，你省得跑托莱多。”我说：“替王家做事？我替的是一本名册，它可付不起你的价。”"
speaker = "captain"
mood = "mystic"
cast = ["noel"]
when = [{ kind = "date", from = [1560, 8, 1] }]
