[[tracks.chapters.choices]]
key = "guard"
text = "守住：日志里的方位，一个字也不交"
next = "c11_roll_call"
effects = [
  { kind = "flag", flag = "c13_main_noel_armada_guard" },
  { kind = "reputation", faction = "spain", value = -3 },
]
reply = "书记把文书收回去，说要报给公爵。我送他到门口，指着门上的链子说：这条链子拴了四十多年，不差这一回。他走的时候没敢抬头看。"

[[tracks.chapters.choices]]
key = "open"
text = "交出去：把往西的方位抄给总署的领航员，谁都能看"
next = "c11_roll_call"
requires = [{ kind = "item", item = "commander_journal", qty = 1 }]
hint = "日志不在你手里，那些方位你也记不全。"
effects = [
  { kind = "flag", flag = "c13_main_noel_armada_open" },
  { kind = "reputation", faction = "spain", value = 3 },
]
reply = "我没给公爵，抄了三份：一份给书记，一份寄塞维利亚的领航考官，一份钉在塔里法教堂的门上。从今往后，往西的路不是骑士团一家的秘密。"

[[tracks.chapters.choices]]
key = "shared"
text = "把守海峡的事分一半给对岸：写信给塔里克"
next = "c11_roll_call"
requires = [{ kind = "affinity", person = "tariq", ge = 40 }]
hint = "海峡那边，还没有一个肯替你守夜的人。"
effects = [
  { kind = "flag", flag = "c13_main_noel_armada_shared" },
  { kind = "affinity", person = "tariq", value = 5 },
]
reply = "信写得很短：海峡两岸，一人守一边。回信更短：“好。东风天归你，西风天归我。”书记在一旁看我写信，没看懂，也没敢问。"

# C11：链与缎带（终章，限期）。
[[tracks.chapters]]
key = "c11_roll_call"
title = "链与缎带"
text = "冬天，舰队的残船还在一条一条地漂回西班牙，爱尔兰的海岸上捡得到穿铠甲的尸首。授剑的日子又到了。那天早上钟还没敲，我就醒了，这辈子头一回。管事站在誓约厅门口，手里提着敲钟的木槌，看见我走过来，愣了一下，没敢敲。誓约厅里还是七十七把椅子，名册摊在桌上，三十年里画上去的圆圈一个挨一个，有几页的纸已经摸软了。窗外的风把页角吹起来，我用手压住。我披上那件嫌热的红斗篷，开始念。念到第一个没有记号的名字，我说：“阿隆索·德·贝哈尔——”没人应。我等了一下，接着念。念到最后一个，我应了一声“在”。这一回，门口的人也跟着应了一声。"
speaker = "captain"
mood = "tender"
cast = ["noel"]
at = "tarifa"
when = [{ kind = "date", from = [1588, 9, 1] }]
deadline = [1590, 6, 30]
news = "塔里法城堡又点了一回名。城里人说，那位骑士头一回没让管事敲钟就起来了。"

[tracks.chapters.timeout]
next = "done"
effects = [
