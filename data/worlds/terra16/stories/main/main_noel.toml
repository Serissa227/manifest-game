# b3 埃尔南的误差：封了蜡的那张纸，拆、留、烧。拆了也读不懂（密写，换字表在科尔武的日志里）。
[[tracks.chapters]]
key = "b3_hernan"
title = "误差在我"
text = "九月，埃尔南先生七十二岁，眼睛看不清星表了。他叫我去书房。桌上摊着他那本记误差的本子，最后一页夹着那张封了蜡的纸，蜡上的戒指印磨平了一半。他说会议那边议过我的事，没议出结果，先搁着。“搁着，”他说，“就是等我们这一辈都死了再议。”他咳了一阵，把封蜡的纸推过来：“我本想等你在别处读到那个名字。怕是等不到了。”"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1564, 9, 1] }]
at = "tarifa"
speaker = "captain"
mood = "sad"
cast = ["noel"]
deadline = [1566, 12, 31]

[[tracks.chapters.choices]]
key = "keep_sealed"
text = "不拆，照他原先说的，等"
next = "b3c_cloth"
effects = [{ kind = "flag", flag = "rw_noel_b_sealed_kept" }]
reply = "他看了我很久，点点头，把纸放回本子里：“好。那这本子你拿走。我死了，它就是你的误差。”一个月后他死了，死前最后一句话是纠正神父的拉丁文，神父念错了一个词尾。我在名册上他那一格画了十字，十字旁边照他的样子写了一行小字：误差在我。"

[[tracks.chapters.choices]]
key = "open"
text = "当着他的面拆开"
next = "b3c_cloth"
effects = [{ kind = "flag", flag = "rw_noel_b_sealed_opened" }]
reply = "纸上是老团长的字，只一行，我一个字也认不出：字母全换了样子，是骑士团旧册子里那种密写。先生笑了，笑得咳起来：“他连这个也不肯写明白。换字的表，他带到西边去了。”没到冬天，他就死了。那张纸我夹回他的本子里，跟他的星表放在一起。"

[[tracks.chapters.choices]]
key = "burn"
text = "当着他的面烧掉"
next = "b3c_cloth"
effects = [{ kind = "flag", flag = "rw_noel_b_sealed_burned" }]
reply = "他没拦我。纸烧得很快，蜡化了，滴在烛台上，跟那年礼拜堂烛台上积的蜡泪一个颜色。他说：“也好。误差烧了，就只剩记得的人。记得的人也会死，那就真没有了。”一个月后他死了。我在他本子的最后一页写：一五六四年九月，烧去一页，由我。"

[tracks.chapters.timeout]
next = "b3c_cloth"
effects = []
news = "塔里法城堡的老学者埃尔南·德·莱昂死了。替他做终傅的神父说，老人临死还在改他的拉丁文。"

[[tracks.chapters.variants]]
key = "rw_inez"
when = [{ kind = "flag", flag = "rw_noel_sambenito_told" }, { kind = "flag", flag = "rw_noel_sealed_returned", value = false }]
