key = "told"
when = [{ kind = "flag", flag = "c13_main_noel_toledo_told" }]
text = "老人在绳铺的油灯下把纸摊开，纸发黄，边角被绳子磨毛了。他用搓绳的粗手指一把一把点着锁数给我听：“二十六把锁，二十五把锁着。撬开最后一把的那个王，后来丢了整个西班牙。”"

[[tracks.chapters.choices]]
key = "trace"
text = "把刻痕一笔一笔描在自己的本子上"
next = "a09_malta_call"
requires = [{ kind = "flag", flag = "c13_mark_toledo", value = false }]
hint = "这些锁已经有人一把一把描过了，那张纸就在你手边。"
effects = [
  { kind = "item", item = "emerald_mark_toledo", qty = 1 },
  { kind = "flag", flag = "c13_mark_toledo" },
  { kind = "memory", memory = "mem-main_noel-a08", title = "洞口的刻痕" },
]
reply = "我描了一夜，描到最后那把开着的锁，手停了一下，还是照样描成开的。描完的那页纸，摸上去像是凉的。"

[[tracks.chapters.choices]]
key = "memorize"
text = "只看，不描：记在心里，把纸烧掉"
next = "a09_malta_call"
effects = [
  { kind = "growth", attr = "intellect", value = 100 },
  { kind = "memory", memory = "mem-main_noel-a08", title = "洞口的刻痕" },
]
reply = "纸烧得很快，二十六把锁一起卷起来。我闭上眼还看得见它们，一把一把，最后一把开着。"

[[tracks.chapters.choices]]
key = "share"
text = "描一份，寄去海峡对岸给塔里克"
next = "a09_malta_call"
requires = [{ kind = "flag", flag = "c13_mark_toledo", value = false }]
hint = "锁已经有人描过了，要寄的就是那张纸，它在你手边。"
effects = [
  { kind = "item", item = "emerald_mark_toledo", qty = 1 },
  { kind = "flag", flag = "c13_mark_toledo" },
  { kind = "flag", flag = "c13_main_noel_toledo_shared" },
  { kind = "affinity", person = "tariq", value = 3 },
  { kind = "memory", memory = "mem-main_noel-a08", title = "洞口的刻痕" },
]
reply = "回信隔了一季才到。塔里克说，他那个同名的人，八百多年前在托莱多拿到过所罗门的桌子，海峡那块石头至今还叫他的名字。“你描的锁，比我祖母那串钥匙还多。”信末问塔里法的钟还响不响。"

# A09：墨西拿的名单。
[[tracks.chapters]]
key = "a09_malta_call"
title = "墨西拿的名单"
text = "春天，墨西拿。西西里副王的加莱船一条一条地进港，又一天一天地不走。医院骑士团在城里的修院门口贴了一张名单，是比尔古城里各国骑士的名字，按语区排，墨迹被雨淋得发淡。卡斯蒂利亚那一栏的第九个，叫弗朗西斯科·德·贝哈尔。我把名册翻到第一页：阿隆索·德·贝哈尔，后面什么记号也没有。土耳其人的帆，据说一个月以内就到。修院的老修士站在门边，朝我伸出手：“运粮船后天走，舱里只剩站的地方。”我说：“站着就站着，我又不是来享福的。”"
speaker = "captain"
mood = "tense"
cast = ["noel"]
at = "messina"
when = [{ kind = "date", from = [1565, 3, 1] }]
deadline = [1565, 5, 15]
news = "墨西拿的骑士团修院门口贴着比尔古的骑士名单。有个海峡来的骑士天天去看同一个名字。"

[tracks.chapters.timeout]
next = "a10_malta"
effects = []
news = "墨西拿修院门口那张名单贴了三个月，雨把卡斯蒂利亚那一栏淋得看不清了。"

[[tracks.chapters.variants]]
key = "first_mark"
when = [{ kind = "flag", flag = "c13_main_noel_first_mark" }]
text = "春天，墨西拿。西西里副王的加莱船一条一条地进港，又一天一天地不走。医院骑士团在城里的修院门口贴了一张名单，墨迹被雨淋得发淡。卡斯蒂利亚那一栏的第九个，叫弗朗西斯科·德·贝哈尔。我把名册翻到第一页：阿隆索·德·贝哈尔，后面只有我八年前画的一个问号，墨褪成了灰，我还认得出它。修院的老修士站在门边：“运粮船后天走，舱里只剩站的地方。”我说：“站着就站着。”"

[[tracks.chapters.choices]]
key = "go_in"
text = "挤上最后一条运粮船，赶在土耳其人前面进比尔古"
next = "a10_malta"
effects = [{ kind = "flag", flag = "c13_main_noel_malta_inside" }]
reply = "船走了两天，到比尔古那天，岛北的瞭望塔正在点烟。修士说我是最后一个从正门进城的外人。舱里只剩站的地方，我站了两天，腿肚子抽了两回，没让人看出来。"

[[tracks.chapters.choices]]
key = "press"
text = "留在墨西拿，天天去副王门口催援军"
