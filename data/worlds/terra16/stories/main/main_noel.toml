reply = "开春，马耳他来了贝哈尔家的人，阿尔及尔来了乌维达，还有几个我只在信里见过的人。贝哈尔家来的是个少年，念到自己的名字，声音抖得厉害，我替他把椅子拉开。乌维达帮着把空椅子搬到桌边，搬了三趟，自己没坐下。七十七把椅子坐不满，也坐了九把。那天的钟是我自己敲的，管事站在门口说骑士团的钟不该由骑士敲。我说：今天不一样。我把红斗篷让给最年轻的那个穿，太热了，我早就想脱。"
news = "塔里法城堡里又点了一回名，这一回应声的不止一个，听说有从马耳他和阿尔及尔赶来的人。"

