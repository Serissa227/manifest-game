fail = { next = "b05_lisbon_name", effects = [{ kind = "memory", memory = "mem-main_noel-b04", title = "砍断的锁" }], news = "乌卢赤·阿里带着几十条船从同盟的右翼钻了出去，追得最近的一条小船，最后也只看见了他的船尾。" }

# B05：国王的卫士。
[[tracks.chapters]]
key = "b05_lisbon_name"
title = "国王的卫士"
text = "里斯本河边的王宫外，年轻的国王在练他的卫队。他二十上下，骑在马上比谁都直，开口三句不离非洲：休达、丹吉尔、摩洛哥的平原。卫队里有个瘦高的年轻人一直往我这边看，看的不是脸，是我外套上的星徽。他从怀里掏出一枚一样的，锡做的，边角磨圆了。他叫迪奥戈·阿尔瓦雷斯，说曾祖从海峡来，家里只剩这枚星和一个姓。“曾祖叫什么，我背得出来。您翻翻名册。”国王在马上听见了，说：“海峡的骑士？正好。我要过海峡。”我说：“陛下，过海峡容易，回来难。名册上十字画得比圆圈多。”"
speaker = "captain"
mood = "tender"
cast = ["sebastian_i", "noel"]
at = "lisbon"
when = [{ kind = "date", from = [1572, 1, 1] }]
deadline = [1575, 9, 30]
news = "里斯本王宫的卫队里有个年轻人，胸口别着一枚旧锡星，说是曾祖从海峡带来的。"

[tracks.chapters.timeout]
next = "b06_algiers"
effects = []
news = "里斯本王宫卫队里有人拿着一枚旧锡星四处问，问了几年，没问到塔里法来的人。"

[[tracks.chapters.variants]]
key = "nova"
when = [{ kind = "date", from = [1572, 11, 11], to = [1574, 3, 31] }]
text = "特茹河口的天上出了一颗新星，亮得白天都看得见。迪奥戈仰着头指给我看，说那是给我们的。里斯本王宫的卫队里有个瘦高的年轻人，胸口别着一枚锡星，他叫迪奥戈·阿尔瓦雷斯，说曾祖从海峡来，家里只剩这枚星和一个姓。“曾祖叫什么，我背得出来。您翻翻名册。”国王在马上听见了，说：“海峡的骑士？正好。我要过海峡。”我说：“陛下，过海峡容易，回来难。名册上十字画得比圆圈多。”"

[[tracks.chapters.choices]]
key = "acknowledge"
