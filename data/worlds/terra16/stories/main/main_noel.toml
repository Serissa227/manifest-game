# C08：海草与静风（交汇：诺埃尔↔塔里克）。黑暗之海。
[[tracks.chapters]]
key = "c08_dark_sea"
title = "海草与静风"
text = "这个夏天，圣克鲁斯侯爵的船一天天逼近特塞拉岛，安格拉的人在海湾里打木桩。我的船趁夜出了港，往西。过了科尔武，海上开始漂海草，一片接一片，黄得像晒干的麦秆。风停了，帆垂下来，罗经的针在玻璃底下慢慢地转，转完一圈，又转一圈。船上的人不说话，桶里的水都不晃。海草最密的地方，水底下有一道一道的影子，像一条很长的铁链，往西边去。水手长说：“骑士，再往西，桶里的水就不够回去了。”水手长又压低声音：“骑士，回头吧，桶里的水还够回去。”"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["noel", "tariq"]
speaker = "captain"
mood = "mystic"
news = "特塞拉岛七八月间让圣克鲁斯侯爵拿下了。安格拉的渔夫说，这个夏天往西去的船，比往东回来的多。"

[tracks.chapters.default]
