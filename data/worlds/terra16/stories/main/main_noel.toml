[[tracks.chapters.choices]]
key = "circle"
text = "在名册上画圆圈，把他的两种字都抄进去"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_noel_name_japan" }]
reply = "他们的字我照着描，描了三遍才像。描完我去敲了一下城堡的钟，就一下，镇上的人都跑出来看。"

[[tracks.chapters.choices]]
key = "drawing"
text = "回信，画一张塔里法城堡的样子寄去"
next = "done"
effects = [
  { kind = "flag", flag = "c13_main_noel_name_japan" },
  { kind = "growth", attr = "charm", value = 100 },
]
reply = "我画得很丑，城堡像一只蹲着的猫。门拱上那条链子我画得最仔细。托神父带回去，神父说下一班船要三年。"

# ════════════ 增写（2026-11-12）：诺埃尔的主线旁轨（见 docs/drafts/rw-noel-handoff.md） ════════════
# 旁轨一·最后的守夜（7 章）：老团长留下的盔甲、号角、守夜的规矩，和守着它们的人一个一个走掉、又一个一个来。接 a00 授剑、a01 七十六个缺席、c05 科尔武。
# 母本：《堂吉诃德》（后世）的临终——好人阿隆索把“骑士”两个字留下；《罗兰之歌》的号角——该吹的时候吹；《高卢的阿马迪斯》守门三夜，门开了里头没有要找的人；
#       文化：骑士的慷慨与体面（借了钱也要请人吃饭、欠的账要还）；坏的一面是名册与门第——打鱼人家的孩子进不了团；
#       张力：守夜是守一样没人要的东西；诺埃尔从一个人守，守到一屋子人陪着守，守的东西还是没人要。
# 入口：c13_main_noel（a00 default 设）、_act2（b01）、_act3（c01）加日期；除终章外每章有 deadline 与 timeout。不读、不设主线结局旗标。
# 读：养成期 rw_noel_armor_chair / _armor_sea（w1、w6）、rw_noel_storm_heard / _martin_tide（w2）、rw_noel_horn_blown / _horn_kept（w3）；主线 c13_main_noel_origin_known / _mother_named（w5）。
# 设：rw_noel_debt_*、rw_noel_martin_*、rw_noel_horn_sounded / _unsounded、rw_noel_squire_*、rw_noel_vigil_*（终章三个互斥结局 rw_noel_vigil_end_horn / _gate / _keep）。
[[tracks]]
key = "main_noel_rw_vigil"
name = "最后的守夜"
kind = "main"
start = "w1_debt"
auto = true
cast = ["noel"]

# w1 押着的盔甲：老团长借船钱，拿盔甲作押。体面与债。
[[tracks.chapters]]
key = "w1_debt"
title = "押着的盔甲"
text = "三月，点完名的第二个月，塞维利亚来了一个放债人，带着公证人和一纸借据：老团长西行以前，拿骑士团礼拜堂里那副盔甲作押，借了一笔船钱，一年为期，连本带利。放债人在誓约厅里看了看七十七把椅子，又看看我：“盔甲我不要，铁也卖不上价。可账是账。骑士，您总不会叫老团长欠着人走。”公证人念借据，念到“以骑士之名担保”，念得格外响。"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1557, 3, 1] }]
at = "tarifa"
speaker = "captain"
mood = "tense"
cast = ["noel"]
deadline = [1558, 12, 31]

[[tracks.chapters.choices]]
key = "pay"
text = "照借据，连本带利付清"
next = "w2_martin"
requires = [{ kind = "cash", ge = 400 }]
hint = "钱箱里凑不够这笔连本带利的钱。"
effects = [{ kind = "cash", value = -400 }, { kind = "growth", attr = "honor", value = 100 }, { kind = "flag", flag = "rw_noel_debt_paid" }]
reply = "我数钱的时候，放债人一直看着我的手。数完他说：“老团长借的时候，也是这样一枚一枚数。”他在借据上写了个“清”字递还给我。借据背面有一行老团长的字，挤在角上：船钱，七座城，名册。我把它夹进名册的最后一页。"

[[tracks.chapters.choices]]
key = "work"
text = "替他跑三趟货抵账"
next = "w2_martin"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "rw_noel_debt_worked" }]
reply = "三趟货，从桑卢卡尔往加那利运酒，回程捎糖。放债人说这是便宜了我。第三趟回来，他验完糖，把借据撕成两半，一半给我：“另一半我留着。往后谁说塔里法的骑士赖账，我拿出来给他看。”"

[[tracks.chapters.choices]]
key = "refuse"
text = "不认：骑士团的东西不归一个人"
next = "w2_martin"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_noel_debt_refused" }]
reply = "放债人没恼，收起借据：“那就上法庭。”官司拖了一年，判下来，骑士团城外的一小块盐田归了他。他来量地那天我没出门。管事回来说，放债人站在盐田边上问，老团长往西到底找什么。管事说找人。放债人说：那这块地，就当我替他找了。"

[tracks.chapters.timeout]
next = "w2_martin"
effects = []
news = "塞维利亚的放债人往塔里法城堡跑了两趟，那张借据还压在他的柜子里。"

[[tracks.chapters.variants]]
key = "rw_chair"
when = [{ kind = "flag", flag = "rw_noel_armor_chair" }]
text = "三月，点完名的第二个月，塞维利亚来了一个放债人，带着公证人和一纸借据：老团长西行以前，拿骑士团那副盔甲作押，借了一笔船钱，一年为期，连本带利。放债人在誓约厅里看了看七十七把椅子，看了看首座上那副摆成坐着样子的空盔甲，又看看我：“押给我的就是这一副？铁卖不上价，我不要。可账是账。骑士，您总不会叫老团长欠着人走。”公证人念借据，念到“以骑士之名担保”，念得格外响。"

[[tracks.chapters.variants]]
key = "rw_sea"
when = [{ kind = "flag", flag = "rw_noel_armor_sea" }]
text = "三月，点完名的第二个月，塞维利亚来了一个放债人，带着公证人和一纸借据：老团长西行以前，拿骑士团那副盔甲作押，借了一笔船钱，一年为期，连本带利。他问盔甲在哪儿。我说在海峡底下，中间那道暗流里。他愣了一下，笑了：“那更省事，账上只认钱。骑士，您总不会叫老团长欠着人走。”公证人念借据，念到“以骑士之名担保”，念得格外响。"

# w2 马丁的潮：十月二十三日，他第一回在这个日子出海。
[[tracks.chapters]]
key = "w2_martin"
title = "十月二十三，出船"
text = "十月，马丁病倒了，不在床上，在码头的木箱上。他不肯回屋，说屋里听不见潮。哈桑医生看过他，出来冲我摇头。二十三日那天，天很好，东风不大。马丁叫我扶他上船：“今天出。”我说十月二十三您从来不出船。他说：“今天我自己看得出风来。”我们把船划到海峡中间那道暗礁上头。潮转的时候，他说了一声“在”，就不再说话了。"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1561, 10, 15] }]
at = "tarifa"
speaker = "captain"
mood = "sad"
cast = ["noel"]
deadline = [1563, 12, 31]

[[tracks.chapters.choices]]
key = "church"
text = "划回去，葬在礼拜堂底下"
next = "w3_horn"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_noel_martin_church" }]
reply = "神父说他三年没告解，管事去求了两回，才许他进礼拜堂的地。下葬那天，码头上的渔夫来了一半，那天没人下网。我在名册上马丁·罗哈斯那一格画了十字，旁边添了两个小字：守潮。"

[[tracks.chapters.choices]]
key = "reef"
text = "照渔人的规矩，沉在暗礁上头"
next = "w3_horn"
effects = [{ kind = "skill", skill = "tide_reading", value = 10 }, { kind = "flag", flag = "rw_noel_martin_reef" }]
reply = "我们用他自己补过的那张帆裹他，坠石绑在脚上，等下一回潮转才放下去。神父后来骂我，说他没有坟，复活那天找不着他。我说找得着，他认得潮。"

[[tracks.chapters.choices]]
key = "vigil"
text = "不急着回，在船上守到天亮"
next = "w3_horn"
effects = [{ kind = "growth", attr = "honor", value = 100 }, { kind = "flag", flag = "rw_noel_martin_vigil" }]
reply = "我守着他到天亮，没点灯。天亮时海峡起了薄雾，渔船一条一条从雾里出来，看见我们都停了桨。雾里有人喊他的名字，我替他应了。回港以后，名册上那一格我画了十字，又画了一个圈，两个记号叠在一起。管事说名册上没有这种记号。我说现在有了。"

[tracks.chapters.timeout]
next = "w3_horn"
effects = []
news = "塔里法码头的老舵手死在船上。打鱼的人说，他走的那天，海峡的潮转得比平常慢。"

[[tracks.chapters.variants]]
key = "rw_storm"
when = [{ kind = "flag", flag = "rw_noel_storm_heard" }, { kind = "flag", flag = "rw_noel_martin_tide", value = false }]
text = "十月，马丁病倒了，不在床上，在码头的木箱上。他不肯回屋，说屋里听不见潮。哈桑医生看过他，出来冲我摇头。二十三日那天，天很好，东风不大。马丁叫我扶他上船：“今天出。阿尔及尔那一夜，是我把他硬拖上的船。今天你别拖我。”我们把船划到海峡中间那道暗礁上头。潮转的时候，他说了一声“在”，就不再说话了。"

[[tracks.chapters.variants]]
key = "rw_tide"
when = [{ kind = "flag", flag = "rw_noel_martin_tide" }]
text = "十月，马丁病倒了，不在床上，在码头的木箱上。他不肯回屋，说屋里听不见潮。哈桑医生看过他，出来冲我摇头。二十三日那天，天很好，东风不大。马丁叫我扶他上船：“今天出。那年夏天你陪我守过一回潮，这一回你替我守。”我们把船划到海峡中间那道暗礁上头，熄了灯。潮转的时候，他说了一声“在”，就不再说话了。"

# w3 号角：罗兰的号角，这一回落在诺埃尔手里。
[[tracks.chapters]]
key = "w3_horn"
title = "号角"
text = "六月，海峡上来了三条加列奥特，不挂旗，夜里贴着岸往西摸，摸到塔里法外头的金枪鱼网场。几百个人在网边，网口正开着。塔楼的哨兵跑下来叫我，城里人也上了坡，要吹号，请直布罗陀和公爵的船。礼拜堂墙上那只象牙号角还挂着，颜色更黄了。我的船在港里，二十个人，三门小炮，对面三条船，人比我多。老团长那年站在城垛边说的话，我一个字也没忘。"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1566, 5, 1] }]
at = "tarifa"
speaker = "captain"
mood = "tense"
cast = ["noel"]
deadline = [1568, 12, 31]

[[tracks.chapters.choices]]
key = "blow"
text = "先吹号，再出港"
next = "w4_squire"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_noel_horn_sounded" }]
reply = "号角这回一声就出来了。网场的船听见，丢下网往港里划，网口没收，那一季的鱼跑了一半。直布罗陀的船下午才到，三条加列奥特早走了，一条渔船也没少。网头来找我，说骑士吹一声号，吹掉了半季的鱼。我说鱼明年还来。他说人也来。他没骂我，把账本上那一行划了。"

[[tracks.chapters.choices]]
key = "fight"
text = "不吹，带船出去堵"
next = "w4_squire"
effects = [{ kind = "fame", value = 2 }, { kind = "flag", flag = "rw_noel_horn_unsounded" }]
reply = "我们贴着网场外沿横过去，三门小炮打不准，声音够大。加列奥特掉了头，走的时候顺手牵走了网场最外头一条船，船上三个人。我追了半夜，追到休达外海，没追上。回来时天亮了，城里的人站在坡上，谁也没开口。那只号角，一声没响。"

[[tracks.chapters.choices]]
key = "both"
text = "叫人吹号，自己同时出港"
next = "w4_squire"
effects = [{ kind = "growth", attr = "command", value = 100 }, { kind = "flag", flag = "rw_noel_horn_sounded" }]
reply = "我把号角塞给管事的孙子胡安尼托，叫他吹，自己带船出港。号声在身后响起来，我没回头。三条船看见网场的船往回跑，又看见我的船，犹豫了一阵，往东去了。网口没来得及收，鱼跑了一半。那孩子吹完跑到码头上，问我吹得对不对。我说，头一声像牛叫，就对了。"

[tracks.chapters.timeout]
next = "w4_squire"
effects = []
news = "塔里法外头的网场今年夏天叫海盗惊了一回。城里人说，城堡的号角挂在墙上，没人吹。"

[[tracks.chapters.variants]]
key = "rw_blown"
when = [{ kind = "flag", flag = "rw_noel_horn_blown" }, { kind = "flag", flag = "rw_noel_horn_kept", value = false }]
text = "六月，海峡上来了三条加列奥特，不挂旗，夜里贴着岸往西摸，摸到塔里法外头的金枪鱼网场。几百个人在网边，网口正开着。塔楼的哨兵跑下来叫我，城里人也上了坡，要吹号，请直布罗陀和公爵的船。礼拜堂墙上那只象牙号角还挂着，颜色更黄了。十几年前我替老团长吹过它一回，头一声像牛叫。我的船在港里，二十个人，三门小炮，对面三条船，人比我多。"

[[tracks.chapters.variants]]
key = "rw_kept"
when = [{ kind = "flag", flag = "rw_noel_horn_kept" }]
text = "六月，海峡上来了三条加列奥特，不挂旗，夜里贴着岸往西摸，摸到塔里法外头的金枪鱼网场。几百个人在网边，网口正开着。塔楼的哨兵跑下来叫我，城里人也上了坡，要吹号，请直布罗陀和公爵的船。那只象牙号角在我屋里的箱子上，是老团长走前放在我膝上的。他说过：该吹的时候就吹，别等。我的船在港里，二十个人，三门小炮，对面三条船，人比我多。"

# w4 第二个守夜的人：打鱼人家的孩子要当骑士。名册的门第与血统。
[[tracks.chapters]]
key = "w4_squire"
title = "第二个守夜的人"
text = "正月，点名前那几夜，我照老团长的样子守夜。管事的孙子胡安尼托十六岁了，一连三夜蹲在礼拜堂门口，第四夜自己抱着一条毯子进来。他说他要当骑士：会游水，会吹号，名册上前二十个名字都背得出。他背给我听，背到第十九个，费尔南多，错了一个字。名册的规矩我知道：入团要验门第，要验血统。他爹是打鱼的，第一关就过不去。"
when = [{ kind = "flag", flag = "c13_main_noel_act2" }, { kind = "date", from = [1572, 1, 10] }]
at = "tarifa"
speaker = "captain"
mood = "tender"
cast = ["noel"]
deadline = [1574, 12, 31]

[[tracks.chapters.choices]]
key = "squire"
text = "叫他坐下：当侍从，不当骑士"
next = "w4b_chart"
effects = [{ kind = "flag", flag = "rw_noel_squire_taken" }]
reply = "他想了想，问侍从做什么。我说守夜的时候递蜡烛，点名的时候替我数椅子，早上叫我起床。他说最后一样最难。从那以后，每年点名的早上，敲钟的是他，敲到第三遍我才起来。"

[[tracks.chapters.choices]]
key = "teach"
text = "不管规矩，教他背全七十七个"
next = "w4b_chart"
effects = [{ kind = "flag", flag = "rw_noel_squire_named" }]
reply = "他背了一个冬天，开春时七十七个一个不错。最后一个是我的名字，他背到那里，看着我笑了一下，没出声。我说背出来，他背了。我在名册末页底下写了他的名字，没画记号。管事看见，说这一行不算数。我说现在不算。"

[[tracks.chapters.choices]]
key = "send"
text = "叫他回去睡：这不是孩子的事"
next = "w4b_chart"
effects = [{ kind = "flag", flag = "rw_noel_squire_sent" }]
reply = "他抱着毯子走了，走到门口回头：“老团长那时候也叫你回去睡吗？”我说没有。他说：“那你为什么叫我？”我答不上来。第二夜他又来了，我没赶他。"

[tracks.chapters.timeout]
next = "w4b_chart"
effects = []
news = "塔里法城堡今年点名，骑士不在家。管事的孙子在礼拜堂守了三夜，说是替骑士守的。"

# w4b 七个红点：老团长的海图拿到贸易总署。领航总长阿隆索·德·查韦斯（约 1492—1586，史实人物，只在正文出现）。
[[tracks.chapters]]
key = "w4b_chart"
title = "七个红点"
text = "三月，我把老团长那张海图带到塞维利亚，贸易总署的楼上。图还是那张：亚速尔以西一块没名字的岛，岛上七个红点，图边压着他改过年份的字条。领航总长阿隆索·德·查韦斯八十多岁了，眼睛还亮，拿一片磨过的水晶把七个红点一个一个看过去，看完问：“谁点的？”我说一个老骑士。他把图推回来：“这里没有岛。三十年来从这片海回来的领航员，没有一个在簿子上记过它。”"
when = [{ kind = "flag", flag = "c13_main_noel_act2" }, { kind = "date", from = [1576, 3, 1] }]
at = "seville"
speaker = "captain"
mood = "mystic"
cast = ["noel"]
deadline = [1579, 12, 31]

[[tracks.chapters.choices]]
key = "enter"
text = "请他记进领航簿：记作“未见”"
next = "w5_journal"
effects = [{ kind = "skill", skill = "cartography", value = 10 }, { kind = "flag", flag = "rw_noel_chart_entered" }]
reply = "老人想了一会儿，提笔在一本厚簿子的页边写：亚速尔以西，某骑士所点七城，未见。他说簿子上不许写传说，可是许写没看见的东西。“未见，”他说，“就是还没人看见。这两个字比‘没有’老实。”"

[[tracks.chapters.choices]]
key = "keep"
text = "收回来：这是他的岛"
next = "w5_journal"
effects = [{ kind = "flag", flag = "rw_noel_chart_kept" }]
reply = "我把图卷起来，用老团长的麻线系好。老人看我系，说他年轻时也画过一座岛，后来自己划掉了，划掉那天睡得很好。“你哪天要是睡不着，”他说，“拿来，我替你划。”我说不用，他早替自己划过了。"

[[tracks.chapters.choices]]
key = "copy"
text = "请他描一份，留在总署"
next = "w5_journal"
effects = [{ kind = "fame", value = 1 }, { kind = "flag", flag = "rw_noel_chart_copied" }]
reply = "他叫一个年轻书记描了一份，书记描到第七个红点手抖了一下，点大了一圈。老人没叫他改：“留着。让后来的人知道，描的人也犹豫过。”那一份后来夹在总署的旧图堆里，跟一百多座没人要的岛放在一处。"

[tracks.chapters.timeout]
next = "w5_journal"
effects = []
news = "贸易总署的领航总长说，这几年送来的海图里，有一张亚速尔以西点着七个红点，送图的人后来没再来。"

# w5 日志里的名字：好人阿隆索把“骑士”两个字留在了海上（读 c05 的旗）。
[[tracks.chapters]]
key = "w5_journal"
title = "膝盖响了一声"
text = "九月，我回到塔里法。礼拜堂的蜡烛这些年是胡安尼托替我点的，点的还是两支，像老团长最后那一夜。我在祭台前跪下去，膝盖响了一声。我四十一岁了，比他收下我那年还小十四岁。我常想他在西边最后那些日子想些什么：七座城，名册，还是一个早上叫不醒的孩子。蜡烛烧得很稳，门外胡安尼托在跟他的儿子说话，说骑士又要守夜了。"
when = [{ kind = "flag", flag = "c13_main_noel_act3" }, { kind = "date", from = [1582, 9, 1] }]
at = "tarifa"
speaker = "captain"
mood = "tender"
cast = ["noel"]
deadline = [1585, 12, 31]

[[tracks.chapters.choices]]
key = "sleep"
text = "守到半夜，叫胡安尼托接着守"
next = "w6_last"
effects = [{ kind = "flag", flag = "rw_noel_vigil_slept" }]
reply = "我是被钟叫醒的，钟敲到第三遍。胡安尼托坐在长凳那头，眼睛熬红了，说一夜都没事，就是蜡烛换了三回。我身上盖着那件红斗篷。我没问是谁盖的。"

[[tracks.chapters.choices]]
key = "read"
text = "把阿马迪斯念到门开"
next = "w6_last"
effects = [{ kind = "flag", flag = "rw_noel_vigil_read" }]
reply = "我念到阿马迪斯守满三夜，门开了，里头没有他要找的人。胡安尼托问：那他怎么办？我说接着走。他说那这本书骗人，前头守了那么久。我说守的时候不知道，所以才守得住。"

[[tracks.chapters.choices]]
key = "circle"
text = "在名册上，给他那一格画个圈"
next = "w6_last"
effects = [{ kind = "flag", flag = "rw_noel_vigil_named" }]
reply = "名册第一页有他，名字后面一直空着。我在空格里画了一个圈，不画十字，旁边写：一五五六年，科尔武，往西。胡安尼托问为什么不画十字。我说他是去点名的，点名的人不算缺席。"

[tracks.chapters.timeout]
next = "w6_last"
effects = []
news = "塔里法城堡这几年点名前的守夜，都是管事的孙子替骑士守的。"

[[tracks.chapters.variants]]
key = "rw_journal"
when = [{ kind = "flag", flag = "c13_main_noel_origin_known" }]
text = "九月，我回到塔里法。礼拜堂的蜡烛这些年是胡安尼托替我点的，点的还是两支，像老团长最后那一夜。我在祭台前跪下去，膝盖响了一声。我四十一岁了，比他收下我那年还小十四岁。科尔武那本日志，我读到了最后一页。最后一页没写七座城，也没写名册，只写了一行名字：阿隆索·德·卡德纳，塔里法人。前面没有“骑士”，后面没有“团长”。那两个字，他到底留在了海上。"

[[tracks.chapters.variants]]
key = "rw_name"
when = [{ kind = "flag", flag = "c13_main_noel_mother_named" }, { kind = "flag", flag = "c13_main_noel_origin_known", value = false }]
text = "九月，我回到塔里法。礼拜堂的蜡烛这些年是胡安尼托替我点的，点的还是两支，像老团长最后那一夜。我在祭台前跪下去，膝盖响了一声。我四十一岁了，比他收下我那年还小十四岁。科尔武那本日志，我读到她的名字就合上了。剩下的页，夜里我常想翻，又怕翻到最后一页，他在那上头写的是我不认得的一个人。"

# w6 最后的守夜（终章）：守的东西交给谁。三个互斥结局只设 rw_ 旗，不碰主线结局。
[[tracks.chapters]]
key = "w6_last"
title = "最后的守夜"
text = "正月，舰队的事过去半年，海峡又静了。点名前最后一夜，我照旧守夜。这回礼拜堂里人不少：胡安尼托带着他七岁的儿子；佩皮塔从塞维利亚搭船下来，揣着一包炸鱼，坐下就骂船夫；门口长凳上还有几个城里的老人，他们父亲的名字我都叫得出。老团长那本阿马迪斯，书脊的麻线我换过三回了。祭台前横着我的剑，缎带红得发旧，旁边是那只象牙号角。天亮以前，我想定下这些东西往后交给谁守。"
when = [{ kind = "flag", flag = "c13_main_noel_act3" }, { kind = "date", from = [1589, 1, 10] }]
at = "tarifa"
speaker = "captain"
mood = "tender"
cast = ["noel"]

[[tracks.chapters.choices]]
key = "horn_boy"
text = "把号角交给胡安尼托的儿子"
next = "done"
effects = [{ kind = "flag", flag = "rw_noel_vigil_end_horn" }]
reply = "孩子抱着号角，号角比他的胳膊还长。他问什么时候吹。我说该吹的时候就吹，别等。他问什么时候是该吹的时候。我想了很久：看见有人要被带上别人的船，就是。钟敲第三遍我起来了，那孩子抱着号角睡着了，没松手。"

[[tracks.chapters.choices]]
key = "gate"
text = "天亮后，把剑和号角挂上堡门"
next = "done"
effects = [{ kind = "flag", flag = "rw_noel_vigil_end_gate" }]
reply = "天亮以后，我把剑和号角挂在堡门的拱顶底下，挨着那条铁链和两行字。佩皮塔仰头看：“挂这么高，谁够得着？”我说够不着的人，就站在底下看。她说：“你们骑士的东西，都是给人站在底下看的。”说完把一块炸鱼塞进我嘴里。"

[[tracks.chapters.choices]]
key = "keep"
text = "什么也不交，明年接着守"
next = "done"
effects = [{ kind = "flag", flag = "rw_noel_vigil_end_keep" }]
reply = "我说明年还守。胡安尼托说您都快五十了。我说老团长守到六十七，还往西去了。佩皮塔说：“你要是也往西去，我可不去码头送你。”钟敲到第三遍我还没醒，是她拿包炸鱼的油纸把我拍醒的。"

[[tracks.chapters.variants]]
key = "rw_chair"
when = [{ kind = "flag", flag = "rw_noel_armor_chair" }]
text = "正月，舰队的事过去半年，海峡又静了。点名前最后一夜，我照旧守夜。这回礼拜堂里人不少：胡安尼托带着他七岁的儿子；佩皮塔从塞维利亚搭船下来，揣着一包炸鱼，坐下就骂船夫；门口长凳上还有几个城里的老人，他们父亲的名字我都叫得出。隔壁誓约厅的首座上，那副盔甲坐了三十二年，铁片锈成了红褐色，面甲还是合不上。祭台前横着我的剑，缎带红得发旧，旁边是那只象牙号角。天亮以前，我想定下这些东西往后交给谁守。"

# 旁轨二·清白的血（8 章）：名册上那四行小字、圣地亚哥骑士团的视察、买得到的证人、被划掉的弃儿、只算半份的证词。接 b06 赎俘簿与 c05 科尔武；与塔里克那边的阿尔及尔互相照见（只写在本文件的正文里）。
# 母本：卡斯蒂利亚的血统证明（probanza）与买卖证人的街；《小癞子》1573 年删正本（删去修士与卖赎罪券两章）；
#       文化：体面的骨气与“血统洁净”的残忍——章程是后人添的，可它在马德里有人专门读；街上的人看得透：体面能买，证人按哭不哭论价；
#       张力：最讲真话的老学者替孩子写了一句不真的话；最该作证的人，证词只算半份。来历在 c05 揭开以前，本线只写“那一格的字不对”，不写底下是什么。
# 入口：同上（c13_main_noel / _act2 / _act3 加日期）。b4 在阿尔及尔，与 b06 同一段日子；b5、b6 在 c05 的期限之后；b3c、b3b、w4b 在塞维利亚。
# 读：养成期 rw_noel_rule_asked、rw_noel_page_own_hand（b1）、rw_noel_pepita_indies / _shop / _stall（b2）、rw_noel_sambenito_told、rw_noel_sealed_returned（b3）、rw_noel_pepita_book（b3b）、
