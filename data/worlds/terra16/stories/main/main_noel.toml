key = "autonomy"
when = [{ kind = "flag", flag = "h32_alpujarras_morisco_autonomy" }]
text = "山里的人跟国王谈成了，阿尔普哈拉斯自己管自己。大路上走的是回山里的人，背着锅和织机。十一月起，塞维利亚城外的大路上一队一队地过人，骑士在桥头替一家人扛了一程织机。河边的船夫说：“那位塔里法的骑士站了一整天，没说一句话。”"

[[tracks.chapters.variants]]
key = "ferried"
when = [{ kind = "flag", flag = "c13_main_noel_ferried" }]
text = "十一月起，塞维利亚城外的大路上一队一队地过人：格拉纳达来的摩里斯科人，手腕拴在绳上，往北走。说是要散到卡斯蒂利亚的各个村子去，一个村子只许住几户。河边的船夫说：“那位塔里法的骑士在桥头站了一整天，一句话没说，看见一个老太太掉了一只鞋，下去替她捡了回来。”有人说，桥头那家人里有个老太太，去年是从得土安的海滩上岸的，她认得那条船。"

# B03：侯爵夫人号（限期）。
[[tracks.chapters]]
key = "b03_messina"
title = "侯爵夫人号"
text = "八月，墨西拿港里挤着两百多条加莱船，唐·胡安的旗舰“王家号”船尾漆得金红，像一座漂着的祭坛。码头上的人等着舰队出海，酒馆里卖的全是赌这一仗的签。我在“侯爵夫人号”的跳板边上碰见一个发着烧的士兵，二十来岁，脸烧得通红，嘴却停不下来，从骑士小说讲到我剑柄上的缎带。“骑士小说里的骑士都系缎带，人家系在手臂上，系给心上人。您系在剑上，系给谁？”我说：“系给一本名册。你烧成这样，嘴还这么碎？”他不恼，说他叫米格尔·德·塞万提斯，这一仗就算烧着也要上甲板。说完他又盯着我看。我把帽檐往下一拉：“别盯着我的脸看。”"
speaker = "captain"
mood = "cheerful"
cast = ["don_juan_austria", "miguel_de_cervantes", "noel"]
at = "messina"
when = [{ kind = "date", from = [1571, 7, 20] }]
deadline = [1571, 9, 15]
news = "墨西拿港里那条侯爵夫人号上，有个发烧的士兵跟一位系红缎带的骑士斗了一晚上嘴。"

[tracks.chapters.timeout]
next = "b04_lepanto"
effects = []
news = "墨西拿的舰队九月中出了港，港里只剩下运饼干的船，酒馆也空了一半。"

[[tracks.chapters.choices]]
key = "flagship"
text = "去“王家号”找唐·胡安，求一个旗舰上的位子"
next = "b04_lepanto"
requires = [{ kind = "reputation", faction = "spain", ge = 10 }]
hint = "旗舰跳板上站岗的人只认名字，不认缎带。"
effects = [{ kind = "flag", flag = "c13_main_noel_flagship" }]
reply = "唐·胡安看了看我的星徽，说他小时候在宫里听老人讲过海峡骑士，以为早没了。他让我站在船艏炮的后面。"

[[tracks.chapters.choices]]
key = "marquesa"
text = "上“侯爵夫人号”，跟那个发烧的士兵同一条船"
next = "b04_lepanto"
effects = [
  { kind = "flag", flag = "c13_main_noel_marquesa" },
  { kind = "affinity", person = "miguel_de_cervantes", value = 5 },
]
reply = "他把自己的毯子分了我一半，夜里烧得说胡话，讲的全是一个骑着瘦马的老绅士。我听着听着睡着了，早上又是他把我推醒的。"

[[tracks.chapters.choices]]
key = "supply"
text = "把自己的船编进辎重队，运饼干和水"
next = "b04_lepanto"
effects = [
  { kind = "flag", flag = "c13_main_noel_supply" },
  { kind = "cash", value = 400 },
]
reply = "同盟的军需官按船付钱，一袋饼干一袋饼干地点。我的船吃水很深，跟在舰队最后面，走得很慢。"

# B04：砍断的锁（交汇：诺埃尔↔塔里克）。勒班陀。
[[tracks.chapters]]
key = "b04_lepanto"
title = "砍断的锁"
text = "舰队从科孚往南走了七天。十月七日早上，帕特雷湾口的风停了，土耳其人的船排成一弯新月。炮响过三轮，两边的船头就撞在了一起。我跳上一条土耳其加莱船的时候，甲板滑得站不住脚。桨座底下锁着的是基督徒，两百来个，脚踝上的铁链拴在一根长链上，一直拴到船尾。有人用卡斯蒂利亚话冲我喊：“骑士！这边还有人！”一个老划手扒着桨座的木头，朝我伸手：“骑士，先砍我脚上的，我认得路——我划了十一年。”远处，乌卢赤·阿里的船从同盟的右翼钻了出去，最后面跟着一条加列奥特，船帆上补着一块红布。链子比我想的沉。抢旗、砍锁、追人，只能选一样。"
stage = "involve"
window = [[1571, 10, 1], [1571, 10, 15]]
at = "corfu"
cast = ["don_juan_austria", "miguel_de_cervantes", "uluc_ali", "tariq"]
speaker = "captain"
mood = "tense"
news = "勒班陀的捷报传到墨西拿，钟敲了一整夜。听说土耳其人的桨座上，放出来上万个基督徒。"

[tracks.chapters.default]
next = "b05_lisbon_name"
effects = []

[[tracks.chapters.variants]]
key = "flagship"
when = [{ kind = "flag", flag = "c13_main_noel_flagship" }]
text = "我站在“王家号”船艏炮的后面，看唐·胡安在甲板上跳了一段舞给水手们看，然后叫人把十字架举起来。十月七日早上，帕特雷湾口的风停了，土耳其人的船排成一弯新月。炮响过三轮，两边的船头就撞在了一起。我跳上一条土耳其加莱船的时候，甲板滑得站不住脚。桨座底下锁着的是基督徒，两百来个，脚踝上的铁链拴在一根长链上，一直拴到船尾。一个老划手扒着桨座的木头，朝我伸手：“骑士，先砍我脚上的，我认得路——我划了十一年。”链子比我想的沉。抢旗、砍锁、追人，只能选一样。"

[[tracks.chapters.variants]]
key = "marquesa"
when = [{ kind = "flag", flag = "c13_main_noel_marquesa" }]
text = "在“侯爵夫人号”上，塞万提斯的烧还没退，船长叫他躲进舱底，他不肯，要了小艇边上的位置。十月七日早上，帕特雷湾口的风停了，土耳其人的船排成一弯新月。炮响过三轮，两边的船头就撞在了一起。我跳上一条土耳其加莱船的时候，甲板滑得站不住脚。桨座底下锁着的是基督徒，两百来个，脚踝上的铁链拴在一根长链上，一直拴到船尾。一个老划手扒着桨座的木头，朝我伸手：“骑士，先砍我脚上的，我认得路——我划了十一年。”链子比我想的沉。抢旗、砍锁、追人，只能选一样。"

[[tracks.chapters.variants]]
key = "supply"
when = [{ kind = "flag", flag = "c13_main_noel_supply" }]
text = "在辎重队里，饼干船跟在最后。炮声传过来时，我把饼干扔进海里，空出舱位，往前开去。十月七日早上，帕特雷湾口的风停了，土耳其人的船排成一弯新月。我跳上一条土耳其加莱船的时候，甲板滑得站不住脚。桨座底下锁着的是基督徒，两百来个，脚踝上的铁链拴在一根长链上，一直拴到船尾。一个老划手扒着桨座的木头，朝我伸手：“骑士，先砍我脚上的，我认得路——我划了十一年。”链子比我想的沉。抢旗、砍锁、追人，只能选一样。"

[[tracks.chapters.choices]]
key = "board"
text = "第一批冲过船头，去抢土耳其人的船旗"
