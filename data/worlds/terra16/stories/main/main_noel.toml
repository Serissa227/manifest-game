# C07：第三种读法（召请，无 at，限期）。1583 套第一章。
[[tracks.chapters]]
key = "c07_summons"
title = "第三种读法"
text = "这个冬天海峡上的东风一直不停。夜里，木星和土星在西边天上一天比一天靠近，水手们说明年夏天它们会碰在一起，到时候亚速尔以西的雾会退。我把老团长留下的话翻来覆去地想。堡门上那行拉丁文，我念过一千遍：“此链非为锁汝，乃为锁彼。”锁的是“彼”。要是“彼”不在海峡这边，在柱子外面呢？我站在堡门底下，看那条锈了四十年的铁链。第一层是骑士团的，第二层是她的，第三层是谁的？"
speaker = "captain"
mood = "mystic"
cast = ["noel"]
when = [{ kind = "date", from = [1582, 9, 1] }]
deadline = [1583, 2, 28]
news = "塔里法城堡门口那条老铁链，这个冬天有人刮了锈、上了油。城里人说，骑士要出远门了。"

[tracks.chapters.timeout]
next = "c08_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_noel_stance_close" }]
news = "塔里法城堡的骑士这个冬天没出海，夜夜站在堡门底下看西边的星。"

