when = [{ kind = "flag", flag = "rw_noel_armor_chair" }]
text = "一月的清晨，塔里法城堡的誓约厅冷得像井底，长桌两边摆着七十七把椅子，首座上坐着老团长那副盔甲，面甲合不上。管事敲了三遍钟，我才从床上爬起来。门外是他的声音：“骑士，第三遍了。再不起，钟要敲裂了。”我隔着门回他：“谁规定点名要在天亮以前？……念吧，我听着。”然后披上那件嫌热的红斗篷进门，头发还没梳。桌上摊着海峡骑士团的名册：七十七个名字，后面画着十字、圆圈，或者什么也没有。从休达来的摩里斯科老医生站在门口当见证，他不是骑士，不能坐。管事把名册翻到一页，指着第一个什么记号也没有的名字：阿隆索·德·贝哈尔。"

# A02：圣康坦的捷报，城堡的钟没有响。
[[tracks.chapters]]
key = "a02_st_quentin"
title = "不响的那口钟"
text = "八月中旬，圣康坦大捷的消息从塞维利亚传到塔里法。国王的军队在圣洛伦索节那天打垮了法国人，渔夫们把船上的旗都挂了出来。城里的教堂一座接一座敲钟，钟声顺着海风飘到岸外。只有城堡上那口钟一声没响。管事对来催的人说：“骑士讲了，名册上没有一个人在圣康坦，这口钟留着给自己人敲。”"
stage = "rumor"
window = [[1557, 8, 12], [1557, 9, 30]]
at = "tarifa"
cast = ["noel"]
mood = "cheerful"
news = "圣康坦大捷的消息传到塔里法，满城的钟都敲了，只有城堡上那口没响。"

[tracks.chapters.default]
next = "a03_inscription"
effects = []

# A03：堡门上的铁链与两行字。
[[tracks.chapters]]
key = "a03_inscription"
title = "门上的两行字"
text = "十月的雨下了一个礼拜。城堡大门的拱顶上挂着一条锈得发黑的铁链，链环有拇指粗。卡斯蒂利亚的教堂里也挂这种链子，是被赎回来的俘虏还愿用的。链子底下刻着两行字，上面拉丁文，下面阿拉伯文，苔藓长进了笔画里。拉丁文那行我从小会背：“此链非为锁汝，乃为锁彼。”下面那行，老团长从没念给我听过。管事在一旁说：“老团长刻字那年冬天，你刚进城堡。链子是先挂的还是后挂的，我记不清了。”我说：“你记得每年腌几桶金枪鱼，就记不清这个？”管事说，阿方索十世的宫廷译过阿拉伯人讲宝石和星象的书，老团长两本都抄过。"
speaker = "captain"
mood = "mystic"
cast = ["c8_tarifa_steward", "noel"]
at = "tarifa"
when = [{ kind = "date", from = [1557, 10, 1] }]
deadline = [1558, 12, 31]
news = "塔里法城堡门口挂着一条老铁链，链子底下两行字，一行拉丁文一行阿拉伯文。城里只有那位骑士肯站在雨里看。"

[tracks.chapters.timeout]
next = "a04_lady_knight"
effects = []
news = "塔里法城堡门上那条铁链又锈了一层。城里人说，骑士这一年不常在家。"

[[tracks.chapters.choices]]
key = "read_both"
text = "对着拉丁文和阿拉伯文，一个词一个词地读"
next = "a04_lady_knight"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_noel_inscription_read" }]
reply = "拉丁文的“彼”是复数，说的是“他们”。阿拉伯文最后那个字却是单数、阴性，是“她”。同一条链子，上一行锁“他们”，下一行锁“她”。我不知道“她”是谁，是海，是船，还是一个人。"
fail = { next = "a04_lady_knight", effects = [], news = "塔里法城堡的骑士在堡门底下对着两行字看了一下午，拉丁文念出来了，阿拉伯文那一行到天黑也没念通。" }

[[tracks.chapters.choices]]
key = "ask_steward"
text = "去问管事：链子是谁挂的，字是谁刻的"
next = "a04_lady_knight"
effects = [{ kind = "affinity", person = "c8_tarifa_steward", value = 3 }]
reply = "管事说，字是老团长刻的，阿拉伯文那一行是休达的老医生帮着刻的。链子是有人送来还愿的，是谁，老团长不让问。他说完就去翻金枪鱼桶，不再看我。"

[[tracks.chapters.choices]]
key = "scrape"
text = "拿刀把门上的苔刮干净，看底下还有没有第三行"
next = "a04_lady_knight"
check = { attr = "perception", base = 35, per = 6 }
effects = [{ kind = "flag", flag = "c13_main_noel_gate_star" }]
reply = "没有第三行。只在阿拉伯文底下刮出一颗八角的小星，跟我胸前的星徽一模一样，小得像谁拿针尖刻的。我把苔吹干净，星还在。"
fail = { next = "a04_lady_knight", effects = [], news = "塔里法城堡的骑士拿刀刮堡门上的苔，刮破了手，血滴在门槛上，管事唠叨了一下午。" }

