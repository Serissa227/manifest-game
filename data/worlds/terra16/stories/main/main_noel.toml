next = "b06_algiers"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [
  { kind = "flag", flag = "c13_main_noel_name_lisbon" },
  { kind = "flag", flag = "c13_main_noel_warned_diogo" },
]
reply = "他低头想了一夜，第二天去管了王家马厩，马厩离非洲最远。他说，他在马厩里也能把星擦亮。"
fail = { next = "b06_algiers", effects = [{ kind = "flag", flag = "c13_main_noel_name_lisbon" }], news = "里斯本王宫的卫队里有个年轻人被塔里法来的骑士劝了一下午，最后还是去报了非洲的名。" }

[[tracks.chapters.choices]]
key = "refuse"
text = "不认：一枚旧锡星说明不了什么"
next = "b06_algiers"
effects = [{ kind = "affinity", person = "sebastian_i", value = 3 }]
reply = "他没争，把锡星揣回怀里。国王在马上看着我笑了笑，说骑士团就该这么挑人。我不喜欢那个笑。"

# B06：赎俘簿（限期）。阿尔及尔。
[[tracks.chapters]]
key = "b06_algiers"
title = "赎俘簿"
text = "阿尔及尔关俘虏的大院子，当地人叫澡堂，白天比夜里还吵。我跟着三一会的人进城，袖子里揣着安全通行的文书。胡安修士在门房里摊开他那本磨破的赎俘簿，一个名字一个名字地念价钱：“名字一个一个念，别把人念成总数。”一个手残了的西班牙人坐在院子当中给人讲故事，讲到一半停下来，说上个月又跑了一回，又被抓了回来。他叫塞万提斯，身上带着唐·胡安的推荐信，帕夏以为他是个大人物，价钱开得吓人。同船来的人里，有个叫马丁·德·乌维达的，这个姓在名册上。塔里克靠在门框上说：“价我能压三成。再多，帕夏的书记要哭了。”"
speaker = "captain"
mood = "tense"
cast = ["miguel_de_cervantes", "fray_juan", "tariq", "noel"]
at = "algiers"
when = [{ kind = "date", from = [1575, 10, 1] }]
deadline = [1577, 12, 31]
news = "阿尔及尔的俘虏大院里，有个西班牙骑士跟着三一会的修士念名字，旁边站着那个只劫货的海盗。"

[tracks.chapters.timeout]
next = "c01_sebastian"
effects = []
news = "阿尔及尔三一会的修士说，这两年来问赎价的西班牙人里，没有一个系红缎带的。"

[[tracks.chapters.variants]]
key = "marquesa"
when = [{ kind = "flag", flag = "c13_main_noel_marquesa" }]
text = "塞万提斯一眼认出我，接上勒班陀前那一晚的话头：“骑士，您又来了？上回在侯爵夫人号上，您嫌我话多。”阿尔及尔的俘虏大院子，白天比夜里还吵。我跟着三一会的人进城，袖子里揣着安全通行的文书。胡安修士在门房里摊开他那本磨破的赎俘簿，一个名字一个名字地念价钱。同船来的人里，有个叫马丁·德·乌维达的，这个姓在名册上。塔里克靠在门框上说：“价我能压三成。再多，帕夏的书记要哭了。”"

[[tracks.chapters.choices]]
