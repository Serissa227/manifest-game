# C02：马哈赞河边（交汇：诺埃尔↔塔里克）。三王之战。
[[tracks.chapters]]
key = "c02_alcazar"
title = "马哈赞河边"
text = "八月四日，马哈赞河边的平原上没有一丝风，太阳把尘土晒得发白。葡萄牙人的方阵从早上就在挨炮，到中午散了。阿卜杜·马利克病得坐不住，躺在轿子里指挥，轿帘一直没掀开。我从丹吉尔上岸，跟着运伤兵的车往南赶了几天，到的时候，河边已经全是死人和被剥了衣裳的人。马利克的中军里，有个系红腰带的人在往外搬伤兵，两边的都搬。那人一身土，抬头看见我，只说：“马利克早上就死在轿子里了，他们不让说。骑士，今天一天死了三个王。”有人说国王骑着马冲进了尘土里，再没出来；有人说他早死了，只是没人认得出来。"
stage = "involve"
window = [[1578, 7, 20], [1578, 8, 20]]
at = "tangier"
cast = ["sebastian_i", "abd_al_malik", "tariq"]
speaker = "captain"
mood = "sad"
news = "马哈赞河边一天死了三个王。丹吉尔的人说，葡萄牙的国王冲进尘土里，就再没出来。"

[tracks.chapters.default]
next = "c03_fog_king"
effects = []

[[tracks.chapters.variants]]
key = "sailed"
when = [{ kind = "flag", flag = "c13_main_noel_sailed_with_king" }]
text = "我跟着国王的船队在阿尔齐拉上岸，走了十几天才到河边；那天早上迪奥戈就在我前面三排。八月四日，马哈赞河边的平原上没有一丝风，太阳把尘土晒得发白。葡萄牙人的方阵从早上就在挨炮，到中午散了。阿卜杜·马利克病得坐不住，躺在轿子里指挥，轿帘一直没掀开。河边已经全是死人和被剥了衣裳的人。一个系红腰带的人一身土，说：“马利克早上就死在轿子里了，他们不让说。骑士，今天一天死了三个王。”有人说国王骑着马冲进了尘土里，再没出来；有人说他早死了，只是没人认得出来。"

[[tracks.chapters.choices]]
key = "king"
text = "在尘土里找国王"
next = "c03_fog_king"
check = { attr = "perception", base = 5, per = 8 }
effects = [{ kind = "flag", flag = "c13_main_noel_saw_king" }]
