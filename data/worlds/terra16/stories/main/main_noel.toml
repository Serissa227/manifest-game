[[tracks.chapters.variants]]
key = "rw_returned"
when = [{ kind = "flag", flag = "rw_noel_sealed_returned" }]
text = "九月，埃尔南先生七十二岁，眼睛看不清星表了。他叫我去书房。桌上摊着他那本记误差的本子，最后一页夹着那张封了蜡的纸。八年前我的指甲碰到过这块蜡，被他按住了手。他说会议那边议过我的事，没议出结果，先搁着。“搁着，”他说，“就是等我们这一辈都死了再议。”他咳了一阵，把封蜡的纸推过来：“那回我按住你。这回我不按了，我怕等不到你在别处读到那个名字。”"

# b3c 照原样换新：埃尔南死后，他外祖母那件悔罪衣换了新的。
[[tracks.chapters]]
key = "b3c_cloth"
title = "照原样换新"
text = "三月，埃尔南先生死后的头一个春天，我照他本子末页记着的一个名字和年份，找到塞维利亚那座教区教堂。侧廊墙上的黄布衣换过一批，旧的烂了，新的照原样缝，黄得刺眼，木牌也是新刻的，名字和年份一个字没改。看守换了一个年轻人，说每隔些年就换，为的是永志不忘。我问他见没见过一个常来站着看的老人。他说没见过，来看的人不多，来的多半是找自家姓的。"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1565, 3, 1] }]
at = "seville"
speaker = "captain"
mood = "sad"
cast = ["noel"]
deadline = [1568, 12, 31]

[[tracks.chapters.choices]]
key = "copy"
text = "把这个名字抄进名册的空白页"
next = "b3b_castigado"
effects = [{ kind = "flag", flag = "rw_noel_b_inez_copied" }]
reply = "我在名册最后的空白页写下：伊内斯·德·莱昂，一四八八，塞维利亚。不画十字，不画圈，旁边注一行：埃尔南·德·莱昂之外祖母。管事后来问我这是团里的谁。我说是一个证人的证人。"

[[tracks.chapters.choices]]
key = "stand"
text = "站在那一件前面，站到天黑"
next = "b3b_castigado"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_noel_b_inez_stood" }]
reply = "我站着，手背在身后，学他的样子。来了一个妇人，在另一件黄布前跪下，念了很久，起来时眼睛是干的。年轻的看守来点灯，问我是不是也来找自家的姓。我说找一个老师的。他说老师的姓，也算自家的姓。"

[[tracks.chapters.choices]]
key = "ask"
text = "问看守：没人来看，还换吗"
next = "b3b_castigado"
effects = [{ kind = "flag", flag = "rw_noel_b_inez_asked" }]
reply = "“换，”他说，“规矩是换。”他想了想，“没人来看，换的人自己看一眼，也算有人看过。”说完他去点灯了。我在那盏灯底下把木牌又看了一遍，新刻的字很深，刀痕里还卡着木屑。"

[tracks.chapters.timeout]
next = "b3b_castigado"
effects = []
news = "塞维利亚有座教区教堂，今年侧廊里换了一批新的黄布衣。"

[[tracks.chapters.variants]]
key = "rw_inez"
when = [{ kind = "flag", flag = "rw_noel_sambenito_told" }]
text = "三月，埃尔南先生死后的头一个春天，我又去了塞维利亚那座教区教堂。侧廊墙上的黄布衣换过一批，旧的烂了，新的照原样缝，黄得刺眼，木牌也是新刻的，名字和年份一个字没改。十年前先生在这件前面站过，手背在身后，说她的错写在布上挂了七十年。看守换了一个年轻人，说每隔些年就换，为的是永志不忘。我问他见没见过一个常来站着看的老人。他说没见过，来看的人不多。"

# b3b 删掉的两章：1573 年的删正本。删掉的不算，留着的才算。
[[tracks.chapters]]
key = "b3b_castigado"
title = "删掉的两章"
text = "九月，塞维利亚的书铺里摆出了那本小书的新版，书名页上多了“删正”两个字。佩皮塔拿着一本上了我的船，翻给我看：讲修士的那一章没了，讲卖赎罪券的那一章也没了，剩下的照印，连错字都没改。“删掉的，是他们怕人看见的，”她说，“留着的那个挨饿的绅士，他们不怕。饿肚子的体面，谁都不怕。”她又从怀里摸出一本旧的，书脊用麻线缝过：十四年前那本书上了禁书单子，她这本一直没交。"
when = [{ kind = "flag", flag = "c13_main_noel_act2" }, { kind = "date", from = [1573, 9, 1] }]
at = "seville"
speaker = "captain"
mood = "cheerful"
cast = ["noel", "pepita_montero"]
deadline = [1575, 9, 30]

[[tracks.chapters.choices]]
key = "compare"
text = "拿新旧两本，对着念那个绅士"
next = "b4_murad"
effects = [{ kind = "affinity", person = "pepita_montero", value = 2 }, { kind = "flag", flag = "rw_noel_b_castigado_read" }]
reply = "两本里，那个绅士一个字没改：还是饿着肚子站在门口，还是拿草棍剔牙。佩皮塔听我念完，说：“你看，他们留下他，是因为他不丢人。丢人的是看见他的人。”她把新的那本垫在船舱的木箱底下，旧的又揣回了怀里。"

[[tracks.chapters.choices]]
key = "roster"
text = "说：名册上划掉的名字也是怕人看见"
next = "b4_murad"
effects = [{ kind = "flag", flag = "rw_noel_b_castigado_roster" }]
reply = "她听我讲完第六十页那一道，想了很久：“书删了两章，还叫那本书。名册划掉一个人，那个人就没了？”她摇头，“书比人运气好。”她把旧的那本推给我：“拿去，夹在你的名册里。删掉的东西搁在一块儿，不寂寞。”"

[[tracks.chapters.choices]]
key = "warn"
text = "劝她把旧的烧了，免得惹祸"
next = "b4_murad"
effects = [{ kind = "flag", flag = "rw_noel_b_castigado_warned" }]
reply = "“烧？”她把书揣得更紧，“我小时候饿了十年，没人来烧那十年。这本书写的就是那十年。”她瞪我一眼，“你们骑士守名册，我守这个。谁也别劝谁。”"

[tracks.chapters.timeout]
next = "b4_murad"
effects = []
news = "塞维利亚书铺里那本删正的小书卖得很快。台阶上的人说，买的人总要多问一句：旧的还有没有。"

[[tracks.chapters.variants]]
key = "rw_book"
when = [{ kind = "flag", flag = "rw_noel_pepita_book" }]
text = "九月，塞维利亚的书铺里摆出了那本小书的新版，书名页上多了“删正”两个字。佩皮塔拿着一本上了我的船，翻给我看：讲修士的那一章没了，讲卖赎罪券的那一章也没了，剩下的照印，连错字都没改。“删掉的，是他们怕人看见的，”她说，“留着的那个挨饿的绅士，他们不怕。饿肚子的体面，谁都不怕。”她又从怀里摸出一本旧的，书角卷得像晒干的鱼鳍——一五五四年我在台阶上买给她的那本。禁书单子出来那年，她把它缝进了篮子的夹层。"

# b4 被划掉的名字：1531 年除名的弃儿，如今在阿尔及尔的大院里替俘虏写信。与 b06 同一段日子。
[[tracks.chapters]]
key = "b4_murad"
title = "写信的老头"
text = "阿尔及尔的俘虏大院里，有个替人写信的老头，替俘虏写家信，一封收两个阿斯珀，用西班牙话写，用阿拉伯话封口。他六十多岁，戴头巾，左手少两根指头。他看见我外套上的星徽，手里的笔停了：“海峡分团。这颗星，我在一个老骑士的胸甲上见过，在城东的滩上。”他说他叫穆拉德，早先在海那边有过一个名字，是城门口的人给起的，后来叫一个骑士划掉了。"
when = [{ kind = "flag", flag = "c13_main_noel_act2" }, { kind = "date", from = [1575, 10, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["noel"]
deadline = [1577, 12, 31]

[[tracks.chapters.choices]]
key = "circle"
text = "在那道划痕旁边画一个圈"
next = "b5_page"
effects = [{ kind = "flag", flag = "rw_noel_b_murad_circle" }]
reply = "他看我画完，问：“圆圈是什么意思？”我说是应过名。他说：“我没应过。”我说那你现在应。他把笔放下，过了很久，用卡斯蒂利亚话说了一声“在”，说得很生，像一句四十年没说过的外国话。"

[[tracks.chapters.choices]]
key = "ransom"
text = "问他：要不要我赎你回去"
next = "b5_page"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_noel_b_murad_letters" }]
reply = "他笑了，笑得碰倒了墨水瓶：“赎？我不是俘虏。我在这儿有老婆，有两个儿子，有一间屋，有一个名字，是我自己的，谁也划不掉。”他擦干墨水，“你要赎，就赎那些想回去的。我替你写信，不收钱。”那一季，他替我写了十一封赎俘的信。"

[[tracks.chapters.choices]]
key = "shore"
text = "问他一五四一年滩上那一夜"
next = "b5_page"
effects = [{ kind = "flag", flag = "rw_noel_b_murad_1541" }]
reply = "他说那一夜他在滩上，看见一个老骑士要往城门去，叫另一个人硬拖回了船上。“我没上船，”他说，“我往城门那边走了。走到天亮，城门开了，出来的人给我一块面包，问我叫什么。我说没有名字，名册上划掉了。他们就给了我一个。”他把那块面包比给我看，比得很小。"

[tracks.chapters.timeout]
next = "b5_page"
effects = []
news = "阿尔及尔俘虏大院里那个写信的老头，这两年替西班牙人写的信比往年多。"

[[tracks.chapters.variants]]
key = "rw_struck"
when = [{ kind = "flag", flag = "rw_noel_struck_seen" }]
text = "阿尔及尔的俘虏大院里，有个替人写信的老头，替俘虏写家信，一封收两个阿斯珀，用西班牙话写，用阿拉伯话封口。他六十多岁，戴头巾，左手少两根指头。他看见我外套上的星徽，手里的笔停了：“海峡分团。这颗星，我在一个老骑士的胸甲上见过，在城东的滩上。”他说他叫穆拉德，早先在海那边有过一个名字，后来叫一个骑士划掉了。“胡安·德·塔里法。”我替他说了出来。名册第六十页，那一道划得几乎破了纸。他看着我，像看一个从井里爬上来的人。"

# b5 那一格：c05 之后。实话、旧话、还是划掉章程那一条。
[[tracks.chapters]]
key = "b5_page"
title = "那一格"
text = "八月，我把名册摊在誓约厅的长桌上，翻到自己那一格。四行小字，第三行写着生于塔里法，第四行是那句拉丁文。埃尔南先生的字，墨色本来就浅，二十多年过去，浅得快看不见了。会议那边的视察早换了人，新来的那位来信说，塔里法分团的事要在明年复活节前议完：一个人的分团，没有留着的道理。信末一句：骑士的血统证明，可还齐全？"
when = [{ kind = "flag", flag = "c13_main_noel_act3" }, { kind = "date", from = [1582, 8, 1] }]
at = "tarifa"
speaker = "captain"
mood = "tense"
cast = ["noel"]
deadline = [1584, 12, 31]

[[tracks.chapters.choices]]
key = "truth"
text = "把实话写进那一格，寄去马德里"
next = "b6_hassan"
effects = [{ kind = "growth", attr = "honor", value = 150 }, { kind = "flag", flag = "rw_noel_b_page_truth" }]
reply = "我刮掉那四行小字，刮得纸薄了一层，写上我知道的全部：知道多少写多少，不知道的那一半，写“不知”。寄去马德里的那一份我签了名，又照埃尔南先生的样子，在页边添了一栏：此处原文不真，为何不真，由谁所写。会议没有回信。在马德里，不回信也是一种回答。"

[[tracks.chapters.choices]]
key = "keep"
text = "让埃尔南先生那一行留着"
next = "b6_hassan"
effects = [{ kind = "flag", flag = "rw_noel_b_page_kept" }]
reply = "我把名册合上。那一行是一个老人照另一个老人的意思写的，为的是一个孩子能在这张长桌边坐下。我坐下了，坐了二十多年。我回信给会议：齐全。信寄出去，我去礼拜堂跪了一夜，像老团长擦掉那一行以后那样。"

[[tracks.chapters.choices]]
key = "clause"
text = "不动那一格，划掉章程里那一条"
next = "b6_hassan"
effects = [{ kind = "growth", attr = "honor", value = 100 }, { kind = "flag", flag = "rw_noel_b_clause_struck" }]
reply = "我翻开章程，翻到老团长当年不许我念的那一条，从头念了一遍，念完，划掉了。划得很用力，跟名册第六十页那一道一样用力。旁边我写：此条后人所加，阿方索王立团时无此条，由塔里法分团最后一名骑士删去。会议要议，就议这一条。"

[tracks.chapters.timeout]
next = "b6_hassan"
effects = []
news = "圣地亚哥骑士团的会议又来信问塔里法分团的事，信在城堡门房压了一年，没人拆。"

[[tracks.chapters.variants]]
key = "rw_cipher"
when = [{ kind = "flag", flag = "c13_main_noel_origin_known" }, { kind = "flag", flag = "rw_noel_b_sealed_opened" }]
text = "八月，我把名册摊在誓约厅的长桌上，翻到自己那一格。四行小字，第三行写着生于塔里法，第四行是那句拉丁文。埃尔南先生的字，浅得快看不见了。老团长那张密写的纸，我对着科尔武日志夹页里的换字表，一个字母一个字母读通了。他原先写的是：生于阿尔及尔的俘虏院，母卡塔利娜·奥尔蒂斯，直布罗陀人。一五四七年冬，他叫埃尔南擦掉了这一行。会议那边新来的视察来信说，塔里法分团的事要在明年复活节前议完。信末一句：骑士的血统证明，可还齐全？"

[[tracks.chapters.variants]]
key = "rw_known"
when = [{ kind = "flag", flag = "c13_main_noel_origin_known" }]
text = "八月，我把名册摊在誓约厅的长桌上，翻到自己那一格。四行小字，第三行写着生于塔里法，第四行是那句拉丁文。埃尔南先生的字，浅得快看不见了。那四行字底下是什么，我如今知道了：一个直布罗陀的女人，一座阿尔及尔的大院，一条挂上门拱的铁链。会议那边新来的视察来信说，塔里法分团的事要在明年复活节前议完：一个人的分团，没有留着的道理。信末一句：骑士的血统证明，可还齐全？"

[[tracks.chapters.variants]]
key = "rw_named"
when = [{ kind = "flag", flag = "c13_main_noel_mother_named" }, { kind = "flag", flag = "c13_main_noel_origin_known", value = false }]
text = "八月，我把名册摊在誓约厅的长桌上，翻到自己那一格。四行小字，第三行写着生于塔里法，第四行是那句拉丁文。埃尔南先生的字，浅得快看不见了。我只知道一个名字：卡塔利娜·奥尔蒂斯，直布罗陀人。科尔武那本日志剩下的页，我没读。会议那边新来的视察来信说，塔里法分团的事要在明年复活节前议完：一个人的分团，没有留着的道理。信末一句：骑士的血统证明，可还齐全？"

# b6 半份的证人（终章）：两岸的坟地都不收他。三个互斥结局只设 rw_ 旗。
[[tracks.chapters]]
key = "b6_hassan"
title = "半份的证人"
text = "二月，哈桑医生八十二岁，病倒在码头后面的药铺里，门口那排草药一冬没人收。神父来过两回，要他告解、领终傅，他说他告解过了，用两种话，对着同一个天。神父出来对我说，城里有人写过他的状子，说他朝东躺着；不领终傅，教堂的地不收。得土安的船夫也捎来话：受过洗的人，那边的坟地也不收。医生自己只对我说了一句：别让他们为我吵。"
when = [{ kind = "flag", flag = "c13_main_noel_act3" }, { kind = "date", from = [1585, 2, 1] }]
at = "tarifa"
speaker = "captain"
mood = "sad"
cast = ["noel"]

[[tracks.chapters.choices]]
key = "chapel"
text = "葬在礼拜堂底下：骑士团的证人"
next = "done"
effects = [{ kind = "affinity", person = "noel_physician", value = 3 }, { kind = "flag", flag = "rw_noel_blood_end_chapel" }]
reply = "神父不肯来，经是我自己念的，念的是我们这边的；念完，又照他教我的字母念了一句他们那边的，念得不准。礼拜堂是骑士团的地，这几步主教管不着。胡安尼托和我挖坑挖到半夜。我在名册证人那一页写：哈桑·萨卜提，休达人，证人，整份。"

[[tracks.chapters.choices]]
key = "gate"
text = "葬在堡门边，他刻的那行字底下"
next = "done"
effects = [{ kind = "affinity", person = "noel_physician", value = 3 }, { kind = "flag", flag = "rw_noel_blood_end_gate" }]
reply = "堡门边那块地不是教堂的，也不是谁家的，是海峡的风吹得到的地方。我们把他葬在拱门左边，头朝东，脚朝西。门上那行阿拉伯字，最后一个词底下就是他。有人去主教那里告我，主教来信问，我回信说：门口那块地，骑士团拿来拴马。"

[[tracks.chapters.choices]]
key = "cross"
text = "夜里送他过海，葬在得土安城外"
next = "done"
effects = [{ kind = "affinity", person = "noel_physician", value = 3 }, { kind = "flag", flag = "rw_noel_blood_end_cross" }]
reply = "船是亚辛的儿子撑的，夜里过海，四个钟头。得土安城外有一片没人管的坡，种着无花果。我们在一棵无花果底下挖了坑，亚辛的儿子念经，念得比我准。天亮前回到塔里法，神父在码头上等着，问我昨夜去了哪里。我说去还一封信。"

[[tracks.chapters.variants]]
key = "rw_vouch"
when = [{ kind = "flag", flag = "rw_noel_hassan_vouched" }, { kind = "flag", flag = "rw_noel_b_hassan_swore", value = false }]
text = "二月，哈桑医生八十二岁，病倒在码头后面的药铺里，门口那排草药一冬没人收。神父来过两回，要他告解、领终傅，他说他告解过了，用两种话，对着同一个天。神父出来对我说，城里有人写过他的状子，说他朝东躺着；不领终傅，教堂的地不收。得土安的船夫也捎来话：受过洗的人，那边的坟地也不收。我十二岁那年替他说过一句半真的话，他叫我记住它有多重。如今他只对我说了一句：别让他们为我吵。"

[[tracks.chapters.variants]]
key = "rw_witness"
when = [{ kind = "flag", flag = "rw_noel_b_hassan_swore" }]
text = "二月，哈桑医生八十二岁，病倒在码头后面的药铺里，门口那排草药一冬没人收。神父来过两回，要他告解、领终傅，他说他告解过了，用两种话，对着同一个天。神父出来对我说，城里有人写过他的状子，说他朝东躺着；不领终傅，教堂的地不收。得土安的船夫也捎来话：受过洗的人，那边的坟地也不收。那年在视察面前，他的证词只算半份；如今两岸的坟地，连半份也不给。他自己只对我说了一句：别让他们为我吵。"
