next = "c09_after"
effects = [{ kind = "flag", flag = "c13_main_noel_turned_back" }, { kind = "flag", flag = "c13_main_noel_atlantis_over" }]
reply = "我叫人把小艇放下去，拖着大船一桨一桨地往东划。划了三天，海草才落到身后。回到安格拉，港里插满了西班牙的旗。"

# C09：铭文的下半句（无 at；读 C11 的变体）。
[[tracks.chapters]]
key = "c09_after"
title = "铭文的下半句"
text = "秋天，往回走的船上，亚速尔以西的雾听说还在原处，水手们说今年的会合没给谁让路。水手长探进头来：“骑士，岸快到了，名册该收了。”我说：“再等一下，还差半句。”我把名册摊在舱里的小桌上，对着堡门那两行字抄下来的拓片，一个字一个字地比。两行字我从小看到大，到今天也只读懂了一半，另一半只能猜。老团长没写完的，我替他写；我写不完的，留给下一个人。"
speaker = "captain"
mood = "tender"
cast = ["noel"]
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_noel_atlantis_over" }]

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "我从柱外回来，判词是我亲手写上金板的：把黑暗之海合上。雾不会再退。我把铁链又擦了一遍油。原来锁“彼”的，从来不止海峡这一边。"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "我从柱外回来，判词是我亲手写上金板的：雾要散了，航路要开了。我把这句话抄进名册，写在铭文旁边。"

[[tracks.chapters.variants]]
key = "v3_crossed"
when = [{ kind = "flag", flag = "c13_main_noel_crossed" }]
text = "柱外的事，我还没想好怎么跟名册交代。从那边回来以后，我一句话也没多说，只把铭文抄了一遍又一遍。"

[[tracks.chapters.variants]]
key = "v4_turned_back"
when = [{ kind = "flag", flag = "c13_main_noel_turned_back" }]
text = "海草落在身后的那一刻，我就知道链子的影子还会在那里。回到塔里法，我先去看门上的字，看它有没有变，没有。"

[[tracks.chapters.choices]]
key = "write"
text = "把铭文的三种读法写进名册最后一页"
next = "c10_armada"
effects = [{ kind = "growth", attr = "learning", value = 100 }]
reply = "我写了三行，第三行写了又划，划了又写，最后只留下半句。墨干以后，我把名册合上，压在剑匣底下。"

[[tracks.chapters.choices]]
key = "scrape"
text = "什么也不写，等回了塔里法，去把门上的苔再刮一遍"
next = "c10_armada"
effects = [{ kind = "growth", attr = "resolve", value = 100 }]
reply = "回到塔里法那天，我刮到天黑，两行字干干净净。门口卖鱼的老妇人的孙女问我刻的是什么，我说是锁，她说锁哪有字，我没跟她争。"
news = "塔里法城堡门上那两行字，今年秋天被人刮得干干净净，从城墙上都看得清。"

# C10：奇异之年（无敌舰队）。守、开、托。
[[tracks.chapters]]
key = "c10_armada"
title = "奇异之年"
text = "五月，无敌舰队还在里斯本等风，梅迪纳—西多尼亚公爵的人已经沿着安达卢西亚的海岸征船、征人、征领航员。来塔里法的是公爵府的一个书记，带着两个兵，说舰队要是绕路回来，得有人认得爱尔兰以西、亚速尔以西的海。听说海峡骑士团的老团长往西去过，留下过方位。他把征用的文书摊在誓约厅的长桌上，压在名册旁边。这一年人人都在念一句老预言：今年要么天塌，要么海翻。书记对我说：“骑士，公爵说了，骑士团的东西，就是国王的东西。”我说：“骑士团的东西只有一本名册、一条铁链、一个嘴不饶人的骑士。您要哪样？”"
stage = "involve"
window = [[1588, 5, 1], [1588, 8, 31]]
at = "tarifa"
cast = ["noel", "medina_sidonia"]
speaker = "captain"
mood = "tense"
news = "无敌舰队五月底从里斯本出了港。塔里法的人说，公爵派来征领航员的书记在城堡门口等了三天，门没开。"

[tracks.chapters.default]
next = "c11_roll_call"
effects = []
news = "无敌舰队五月底从里斯本出了港。塔里法城堡的门一直关着，公爵派来的书记等了三天，回去了。"

[[tracks.chapters.variants]]
key = "v1_tomar"
when = [{ kind = "flag", flag = "c13_main_noel_toledo_sold" }]
