# C05：西指的石座（限期；揭开来历）。科尔武岛。
[[tracks.chapters]]
key = "c05_corvo"
title = "西指的石座"
text = "安格拉的人还认克拉图院长做国王，港口的炮口朝着海；城外的人说，西班牙人在海湾登过一回岸，被岛民赶着一群牛冲回了海里。从安格拉往西，两三天的海路，是亚速尔最小的岛科尔武。岛上的老神父领我爬到山顶，山顶上只剩一座石座。石人早被国王的人拆走了，岛上的老人还指得出那条手臂指的方向：西边。老人们说：“石人是后来被国王的人拆走的，手还朝着西。”老神父说，二十五年前，一个系红缎带的老骑士死在这座石座边上，临死把一本日志交给他，说总有一天会有人来取。“他说，‘别让孩子以为链子是锁孩子的。’我那时候不懂，现在也不懂。”"
speaker = "captain"
mood = "sad"
cast = ["noel"]
at = "angra"
when = [{ kind = "date", from = [1580, 11, 1] }]
deadline = [1582, 7, 10]
news = "科尔武岛的山顶上只剩一座空石座。岛上的老人说，那上面的石人，手一直指着西边。"

[tracks.chapters.timeout]
next = "c06_azores_battle"
effects = []
news = "科尔武的老神父去年冬天死了。岛上的人说，他屋里那本外乡人的日志，跟他一起下了葬。"

[[tracks.chapters.variants]]
key = "ledger"
when = [{ kind = "flag", flag = "c13_main_noel_ledger_seen" }]
text = "安格拉的人还认克拉图院长做国王，港口的炮口朝着海。从安格拉往西，两三天的海路，是亚速尔最小的岛科尔武。岛上的老神父领我爬到山顶，山顶上只剩一座石座。老神父说，二十五年前，一个系红缎带的老骑士死在这座石座边上，临死把一本日志交给他，说总有一天会有人来取。日志的封皮里夹着一颗八角小星的印，跟阿尔及尔那本赎俘簿上，卡塔利娜·奥尔蒂斯那一行旁边的一样。“他说，‘别让孩子以为链子是锁孩子的。’我那时候不懂，现在也不懂。”"

[[tracks.chapters.variants]]
key = "star"
when = [
  { kind = "flag", flag = "c13_main_noel_gate_star" },
  { kind = "flag", flag = "c13_main_noel_ledger_seen", value = false },
]
text = "安格拉的人还认克拉图院长做国王，港口的炮口朝着海。从安格拉往西，两三天的海路，是亚速尔最小的岛科尔武。岛上的老神父领我爬到山顶，山顶上只剩一座石座。石座的底边刻着一颗八角星，刀痕很深，边上却干干净净，像有人常来擦，跟堡门上那颗针尖大的星一个刻法。老神父说，是二十五年前一个系红缎带的老骑士死在这座石座边上，临死刻的，又把一本日志交给他，说总有一天会有人来取。“他说，‘别让孩子以为链子是锁孩子的。’我那时候不懂，现在也不懂。”"

[[tracks.chapters.choices]]
key = "read_all"
text = "坐在石座边，把日志读到最后一页"
next = "c06_azores_battle"
effects = [
  { kind = "item", item = "commander_journal", qty = 1 },
  { kind = "flag", flag = "c13_main_noel_origin_known" },
  { kind = "flag", flag = "c13_main_noel_mother_named" },
  { kind = "memory", memory = "mem-main_noel-c05", title = "西指的石座" },
]
reply = "老团长的字写得很挤，一页一页翻下去，像怕漏掉什么。那年冬天，一个从阿尔及尔赎回来的直布罗陀女人，抱着一个三岁的孩子，来到堡门口。她叫卡塔利娜·奥尔蒂斯。直布罗陀城破那天的早上，她的丈夫死在码头上。她被海盗掳走，两个月后，在阿尔及尔的俘虏大院里生下这个孩子。孩子的父亲，就是那个死在城破那天的丈夫。三一会赎了她，孩子那一份是骑士团付的。她把自己身上那条铁链挂上门拱还愿，求老团长收下孩子，说：别让孩子知道链子是谁的。几天后她死在塔里法的收容院。那个冬天老团长刻了门上的字。阿拉伯文那行是老医生刻的，最后一个字是单数阴性：锁的是她。最后一行：孩子哭了一夜，早上睡着了，叫不醒。我合上日志，坐到太阳落进西边的海里。"

[[tracks.chapters.choices]]
key = "name_only"
text = "读到她的名字，就把日志合上"
next = "c06_azores_battle"
effects = [
  { kind = "item", item = "commander_journal", qty = 1 },
  { kind = "flag", flag = "c13_main_noel_mother_named" },
  { kind = "memory", memory = "mem-main_noel-c05", title = "西指的石座" },
]
reply = "“卡塔利娜·奥尔蒂斯，直布罗陀人。”读到这里我就合上了。名字够了，剩下的我留给以后，要是有以后。神父没问，把石座上的苔扫干净，让我坐。"

[[tracks.chapters.choices]]
key = "sink"
text = "不读，让神父把日志沉进科尔武外海"
next = "c06_azores_battle"
effects = [
  { kind = "growth", attr = "resolve", value = 150 },
  { kind = "memory", memory = "mem-main_noel-c05", title = "西指的石座" },
]
reply = "神父把日志从石座的缝里取出来，递给我。我没接，让他拿去沉进崖下的海。日志落下去，在浪里翻了一下就没了。神父画了个十字。我说名册已经够重了，说完才发现，自己的手一直在抖。"

# 增写（2026-11-12）：rw_ 变体，读养成期设的旗（见交接）。引擎取键名最小的那个匹配变体；会与已有变体同时成立的，加了 value = false 的守卫。
