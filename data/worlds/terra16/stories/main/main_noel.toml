text = "我挂着骑士团的白十字旗，跟着拉瓦莱特的加莱船在马耳他与杰尔巴之间跑了三趟。五月中，坏消息比船先到马耳他：皮雅利帕夏和图尔古特的舰队在杰尔巴外海追上了联军，半支舰队没了。岛上那座堡还在守，堡里的井早干了，守军拿锅煮海水，接锅盖上的水汽喝。拉瓦莱特经过我的船，只说了一句：“水送不进去，就把人接出来。别两样都想要。”海这么平，像有人把它熨过。"

[[tracks.chapters.choices]]
