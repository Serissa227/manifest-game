# R1：果阿来的信。
[[tracks.chapters]]
key = "r1_goa"
title = "果阿来的信"
text = "果阿来的信，转了三手，从里斯本走了一个月才到塔里法。写信的是一个老兵，口述，由教堂的书记代笔：“骑士，我叫佩罗·德·莫朗，外祖母是海峡分团一个骑士的女儿。我在印度当了三十年兵，娶了果阿的女人，生了五个孩子，回不去了。我的名字您画个圈就行，人就不回去了。印度的太阳把我晒成了别的颜色，塔里法的钟怕是认不出我。”信里夹着一片干了的槟榔叶，叶子上用针刺出一颗八角星。信的末尾，书记加了一行小字：“他说，名字在您那里，人在哪里都行。”"
speaker = "captain"
mood = "tender"
cast = ["noel"]
when = [{ kind = "date", from = [1570, 3, 1] }]

[[tracks.chapters.variants]]
key = "malta_fell"
when = [{ kind = "flag", flag = "h22_malta_siege_ottoman_takes_malta" }]
text = "果阿来的信，转了三手，从里斯本走了一个月才到塔里法。马耳他丢了的消息比这封信先到果阿，教堂里为骑士团做了一台弥撒。写信的是一个老兵，口述，由教堂的书记代笔：“骑士，我叫佩罗·德·莫朗，外祖母是海峡分团一个骑士的女儿。我在印度当了三十年兵，娶了果阿的女人，生了五个孩子，回不去了。我的名字您画个圈就行，人就不回去了。印度的太阳把我晒成了别的颜色，塔里法的钟怕是认不出我。”信里夹着一片干了的槟榔叶，叶子上用针刺出一颗八角星。信的末尾，书记加了一行小字：“他说，名字在您那里，人在哪里都行。”"

[[tracks.chapters.choices]]
key = "circle"
text = "在名册上把莫朗那一格画成圆圈"
next = "r2_macao"
effects = [{ kind = "flag", flag = "c13_main_noel_name_goa" }]
reply = "圆圈画好，我把槟榔叶夹在那一页。叶子脆，合书的时候碎了一个角，星还在。他不回来，可他应了名。"

[[tracks.chapters.choices]]
key = "fare"
text = "画上圆圈，再托印度船队捎一笔回乡的路费"
next = "r2_macao"
requires = [{ kind = "cash", ge = 500 }]
hint = "这笔路费，你现在掏不出来。"
effects = [
  { kind = "cash", value = -500 },
  { kind = "flag", flag = "c13_main_noel_name_goa" },
  { kind = "flag", flag = "c13_main_noel_roster_paid" },
]
reply = "钱托给了里斯本印度商馆的一个书记，他说一年以后才到得了。我知道莫朗不会用它回来。我只是想让他知道，路是通的。"

# R2：澳门的炮手。
[[tracks.chapters]]
key = "r2_macao"
title = "澳门的炮手"
text = "这封信从澳门来，走了两年。写信的是个葡萄牙炮手，叫贡萨洛·罗德里格斯，祖父是从海峡出去的。他在澳门的炮台上教人铸炮、放炮；去年冬天，北边来了几个明朝的官，说北边的仗打得紧，想请澳门的炮手北上，价钱开得很高。信上写：“骑士，我这一手是祖父教的。祖父说，海峡分团的人只替自己的誓打仗。北边的官给的是银子，给不了誓。您说，替别国的皇帝打仗，算不算背誓？”"
speaker = "captain"
mood = "tense"
cast = ["noel"]
when = [{ kind = "date", from = [1577, 6, 1] }]

[[tracks.chapters.variants]]
key = "goa"
when = [{ kind = "flag", flag = "c13_main_noel_name_goa" }]
text = "这封信从澳门来，走了两年。写信的是个葡萄牙炮手，叫贡萨洛·罗德里格斯，祖父是从海峡出去的。他在澳门的炮台上教人铸炮、放炮；去年冬天，北边来了几个明朝的官，说北边的仗打得紧，想请澳门的炮手北上，价钱开得很高。信上写：“骑士，我这一手是祖父教的。祖父说，海峡分团的人只替自己的誓打仗。北边的官给的是银子，给不了誓。您说，替别国的皇帝打仗，算不算背誓？”信末还有一句：他在果阿见过一个叫莫朗的老兵，老兵叫他给塔里法写信。"

[[tracks.chapters.choices]]
key = "circle"
text = "回信：去不去由你，名册上这一格我画圆圈"
next = "r3_japan"
effects = [{ kind = "flag", flag = "c13_main_noel_name_macao" }]
reply = "我写：誓是你自己的，不是名册的。圆圈先画上。你去了北边，记得活着回来，让我改不成十字。"

[[tracks.chapters.choices]]
key = "search"
text = "回信：再托你替名册留意东方别的名字"
next = "r3_japan"
effects = [
  { kind = "flag", flag = "c13_main_noel_name_macao" },
  { kind = "flag", flag = "c13_main_noel_east_search" },
]
reply = "我把名册里所有空着的名字抄了一份寄去，抄到半夜。东方那么大，总有一两个姓会在码头上被人喊出来。"

# R3：长崎来的字。1584 年以后。
[[tracks.chapters]]
key = "r3_japan"
title = "长崎来的字"
text = "夏天，日本来的船在里斯本靠了岸，跟着耶稣会的神父带来一包信，其中一封写给“塔里法城堡的骑士”。写信的是长崎一个十四岁的孩子，叫若昂，葡萄牙水手的孙子，祖父的祖父在名册上。他用葡萄牙文写了自己的名字，旁边又用他们的字写了一遍，墨很浓，一笔也不抖。信上写：“骑士，祖父说，塔里法的钟比长崎的大。我想听一听。”信纸背面有一个小小的手印，是孩子按上去的。"
speaker = "captain"
mood = "tender"
cast = ["noel"]
when = [{ kind = "date", from = [1584, 9, 1] }]

[[tracks.chapters.variants]]
key = "v1_mio"
when = [{ kind = "flag", flag = "c13_npc_mio_mate" }]
text = "夏天，日本来的船在里斯本靠了岸，跟着耶稣会的神父带来一包信，其中一封写给“塔里法城堡的骑士”。写信的是长崎一个十四岁的孩子，叫若昂，葡萄牙水手的孙子，祖父的祖父在名册上。他用葡萄牙文写了自己的名字，旁边又用他们的字写了一遍，墨很浓，一笔也不抖。信上写：“骑士，祖父说，塔里法的钟比长崎的大。我想听一听。”信上的日本字是澪念给我听的，她念完说，这孩子的字比她弟弟写得好。信纸背面有一个小小的手印，是孩子按上去的。"

[[tracks.chapters.variants]]
key = "v2_east"
when = [{ kind = "flag", flag = "c13_main_noel_east_search" }]
text = "夏天，日本来的船在里斯本靠了岸，跟着耶稣会的神父带来一包信，其中一封写给“塔里法城堡的骑士”。写信的是长崎一个十四岁的孩子，叫若昂，葡萄牙水手的孙子，祖父的祖父在名册上。他用葡萄牙文写了自己的名字，旁边又用他们的字写了一遍，墨很浓，一笔也不抖。信里说，是澳门一个叫贡萨洛的炮手在长崎的码头上喊了他祖父的姓。“骑士，祖父说，塔里法的钟比长崎的大。我想听一听。”信纸背面有一个小小的手印，是孩子按上去的。"

[[tracks.chapters.variants]]
key = "v3_paid"
when = [{ kind = "flag", flag = "c13_main_noel_roster_paid" }]
