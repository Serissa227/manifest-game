fail = { next = "a10_malta", effects = [], news = "墨西拿副王府门口天天来一个系红缎带的骑士，门房后来见了就关门。" }

# A10：森格莱阿的木桩（交汇：诺埃尔↔塔里克）。
[[tracks.chapters]]
key = "a10_malta"
title = "森格莱阿的木桩"
text = "七月初的一个夜里，海上起了雾，六百来个人从岛北摸上岸，绕过土耳其人的营地进了比尔古，我在里头。城里的人说，圣艾尔莫堡六月底丢了，图尔古特也死在那边的炮台下。七月十五日天刚亮，阿尔及尔的哈桑帕夏带着他的人从海上扑森格莱阿，小船一条挨一条，撞在湾里那排木桩上。马耳他的泳手咬着刀跳进水里砍缆绳。城墙上，一个年轻的卡斯蒂利亚骑士胸前挂着一枚磨旧了的锡星，跟我的星徽一个样子，他就是弗朗西斯科·德·贝哈尔。他隔着墙喊：“我家老人说，长子一辈子要去塔里法应一次名。没人去过。”我喊回去：“那就在这儿应。弗朗西斯科·德·贝哈尔——”他应了一声：“在。”阿尔及尔人的小船里，有一个系红腰带的人。"
stage = "involve"
window = [[1565, 5, 18], [1565, 9, 8]]
at = "malta"
cast = ["jean_de_valette", "hasan_pasha", "turgut_reis", "tariq"]
speaker = "captain"
mood = "tense"
news = "马耳他的围城九月初散了。大援军上岸那天，满岛的钟一齐响，比尔古的城墙上到处是炮弹砸出的坑。"

[tracks.chapters.default]
next = "b01_alpujarras"
effects = []

[[tracks.chapters.variants]]
key = "inside"
when = [{ kind = "flag", flag = "c13_main_noel_malta_inside" }]
text = "我五月就在城里，看着土耳其人的帆把海遮满。六月底圣艾尔莫堡丢了，第二天湾里漂过来钉在木板上的，是守军的旗。七月十五日天刚亮，阿尔及尔的哈桑帕夏带着他的人从海上扑森格莱阿，小船一条挨一条，撞在湾里那排木桩上。马耳他的泳手咬着刀跳进水里砍缆绳。城墙上，一个年轻的卡斯蒂利亚骑士胸前挂着一枚磨旧了的锡星，跟我的星徽一个样子，他就是弗朗西斯科·德·贝哈尔。他隔着墙喊：“我家老人说，长子一辈子要去塔里法应一次名。没人去过。”我喊回去：“那就在这儿应。弗朗西斯科·德·贝哈尔——”他应了一声：“在。”阿尔及尔人的小船里，有一个系红腰带的人。"

[[tracks.chapters.choices]]
key = "stakes"
text = "跳进水里，跟马耳他的泳手一起守那排木桩"
next = "b01_alpujarras"
check = { attr = "agility", base = 20, per = 7 }
effects = [
  { kind = "flag", flag = "c13_main_noel_name_malta" },
  { kind = "reputation", faction = "hospital", value = 5 },
]
reply = "水里分不清谁是谁，只看谁手里有刀。爬上岸时，贝哈尔伸手把我拽上墙。我把他的名字念了一遍，他应了。"
fail = { next = "b01_alpujarras", effects = [{ kind = "flag", flag = "c13_main_noel_name_malta" }], news = "森格莱阿的木桩底下打了一上午，有个系红缎带的骑士被人从水里捞上来，手里还攥着刀。" }

[[tracks.chapters.choices]]
