key = "rw_gate"
when = [{ kind = "flag", flag = "rw_noel_gate_asked" }]
text = "十月的雨下了一个礼拜。城堡大门的拱顶上挂着一条锈得发黑的铁链，链环有拇指粗。卡斯蒂利亚的教堂里也挂这种链子，是被赎回来的俘虏还愿用的。链子底下刻着两行字，上面拉丁文，下面阿拉伯文，苔藓长进了笔画里。拉丁文那行我从小会背：“此链非为锁汝，乃为锁彼。”下面那行，老团长从没念给我听过；哈桑医生说过，等我自己读通了再去找他。管事在一旁说：“老团长刻字那年冬天，你刚进城堡。链子是先挂的还是后挂的，我记不清了。”我说：“你记得每年腌几桶金枪鱼，就记不清这个？”管事说，阿方索十世的宫廷译过阿拉伯人讲宝石和星象的书，老团长两本都抄过。"

# A04：小姐骑士。酒馆里的赌局，揭开秘密。
[[tracks.chapters]]
key = "a04_lady_knight"
title = "小姐骑士"
text = "不论哪座港口，码头边的酒馆总是一个样子：桌上有酒渍，墙上有盐霜，角落里有人赌钱。这一回赌的是我。我坐在靠门的位子上，帽檐压得很低，一口酒没碰。一个穿新靴子的年轻水手把钱袋拍在桌上，绳子都没系紧：“骑士？骑士哪有这么白的脸。我赌一袋钱，是个姑娘。”水手说完，还拿钱袋在桌上敲了两下。角落里一个老渔夫慢吞吞地押了另一边：“我押另一边。城堡门口捡来那年，我就见过。”我把手按在帽檐上，没动。满屋子的人都转过头来，盯着我的脸。"
speaker = "captain"
mood = "cheerful"
cast = ["noel"]
when = [{ kind = "date", from = [1558, 3, 1] }, { kind = "location", port = true }]
deadline = [1559, 10, 31]
news = "码头酒馆里有人拿塔里法那位系红缎带的骑士打赌，一袋钱押在桌上，赌的是骑士的面子。"

[tracks.chapters.timeout]
next = "a05_djerba_call"
effects = [
  { kind = "flag", flag = "noel_unveiled" },
  { kind = "flag", flag = "c13_main_noel_unveiled" },
]
news = "这一年海峡两边都在传一个外号：小姐骑士。当面这么叫的人，都挨过塔里法那位骑士的剑背。"

[[tracks.chapters.choices]]
key = "duel"
text = "拔剑：赢了，叫他把钱袋连那句话一起收回去"
next = "a05_djerba_call"
check = { attr = "arms", base = 20, per = 7 }
effects = [
  { kind = "flag", flag = "noel_unveiled" },
  { kind = "flag", flag = "c13_main_noel_unveiled" },
  { kind = "fame", value = 3 },
  { kind = "memory", memory = "mem-main_noel-a04", title = "小姐骑士" },
]
reply = "我没起身，只把剑抽出半尺，剑尖一挑，钱袋的绳子断了，钱撒了一桌，铜的银的滚到老渔夫脚边。“赌我是姑娘？”我把剑插回鞘里，“那你输了。”满屋子哄笑，年轻水手红到耳根，嘴里还嘀咕：“骑士哪有这么拿剑的。”年轻水手的靴子在地上蹭了两下，红着脖子说：“我输得起。”我让人给全屋开了一轮酒，桌上的钱一枚一枚扫回来，数过了才付账。老渔夫在角落里拍桌子，说这一注他押对了边，要我干了他那杯。"
fail = { next = "a05_djerba_call", effects = [{ kind = "flag", flag = "noel_unveiled" }, { kind = "flag", flag = "c13_main_noel_unveiled" }, { kind = "memory", memory = "mem-main_noel-a04", title = "小姐骑士" }], news = "码头酒馆里有人跟那位系红缎带的骑士比剑，骑士输了一招，赌局照样算数，那袋钱还是押错的水手掏。外号从此传开了：小姐骑士。" }

[[tracks.chapters.choices]]
key = "hat_off"
text = "摘下帽子，当着满屋子的人把话说清楚"
next = "a05_djerba_call"
effects = [
  { kind = "flag", flag = "noel_unveiled" },
  { kind = "flag", flag = "c13_main_noel_unveiled" },
  { kind = "growth", attr = "honor", value = 100 },
  { kind = "memory", memory = "mem-main_noel-a04", title = "小姐骑士" },
]
reply = "我摘下帽子，一句一句说清楚：“我是骑士，男的。……还有，别盯着我的脸看。”酒馆静得听见外头的浪，角落里的赌局也停了。老渔夫把钱袋揣进怀里，朝我举了举杯子。年轻水手愣了半天，才憋出一句：“那你长这么好看干什么？”我把帽子扣回桌上：“问我娘去。”说完自己也不知道娘在哪儿，便不再接话，把酒喝完。老渔夫笑出了声，笑得咳起来，半天停不下来。这事一个月后传到塞维利亚，侯爵府里有人听说了。"

[[tracks.chapters.choices]]
key = "laugh"
text = "笑着认输，偷偷托老渔夫替自己也押一注"
next = "a05_djerba_call"
requires = [{ kind = "cash", ge = 200 }]
hint = "你兜里的钱，押不起这一注。"
effects = [
  { kind = "flag", flag = "noel_unveiled" },
  { kind = "flag", flag = "c13_main_noel_unveiled" },
  { kind = "cash", value = 200 },
  { kind = "memory", memory = "mem-main_noel-a04", title = "小姐骑士" },
]
reply = "我不吭声，把一把钱塞给老渔夫，让他替我押在另一边。年轻水手非要我自己说个明白，老渔夫慢悠悠替我说破了，赢来的两百全推回我面前。我数了一遍，一个子儿不少，顺手抽出一枚给他当酒钱。年轻水手在一边张着嘴，半天说不出话来。“骑士嘴硬，我替骑士说了。”我说：“押注的眼光不错，就是嘴太碎。”"

# A05：马耳他的水桶。拉瓦莱特在敲水桶。
[[tracks.chapters]]
key = "a05_djerba_call"
title = "马耳他的水桶"
text = "冬天，马耳他的比尔古港塞满了加莱船：热那亚的、那不勒斯的、西西里的、教皇的，桅杆密得像一片枯树林。说是要去打的黎波里，可码头上人人在谈水，那边的海岸挖不出井。大团长让·德·拉瓦莱特站在一排新箍的水桶中间，一只一只地敲，听声音分辨漏不漏。他看了一眼我外套上的星徽：“海峡分团？我以为那支骑士团早就并进圣地亚哥了。”我说：“短是短，每个名字都念得出来。您那本呢，大团长？”"
speaker = "captain"
mood = "tense"
cast = ["jean_de_valette", "noel"]
at = "malta"
when = [{ kind = "date", from = [1559, 11, 1] }]
deadline = [1560, 2, 9]
news = "马耳他比尔古港的码头上，大团长亲手一只只敲水桶。听说有个海峡来的骑士多箍了一百只。"

[tracks.chapters.timeout]
next = "a06_djerba"
effects = []
news = "马耳他港二月里空了。说是去打的黎波里的舰队，听说拐去了杰尔巴。"

[[tracks.chapters.choices]]
key = "galley"
text = "把自己的船编进骑士团的加莱船队"
next = "a06_djerba"
effects = [
  { kind = "reputation", faction = "hospital", value = 3 },
  { kind = "flag", flag = "c13_main_noel_djerba_galley" },
]
reply = "书记给我一面小旗，白十字，叫我挂在桅顶上。我问船在哪里。他说，在第三条加莱船上，那条船的桨手最渴。拉瓦莱特经过时看了一眼小旗，只说了一句：骑士团的船，水先给桨手喝。"

[[tracks.chapters.choices]]
key = "casks"
text = "出钱给运水船多箍一百只水桶"
next = "a06_djerba"
requires = [{ kind = "cash", ge = 800 }]
hint = "你的钱箱，连自己船上的水桶都快箍不起了。"
effects = [
  { kind = "cash", value = -800 },
  { kind = "flag", flag = "c13_main_noel_lever_h18" },
  { kind = "affinity", person = "jean_de_valette", value = 4 },
]
reply = "桶匠连夜开工，一百只新桶码在码头上，桶底都烙了一颗八角星。是我叫他们烙的，免得被别的骑士团认走。拉瓦莱特敲了敲其中一只，没说话，点了点头。"

[[tracks.chapters.choices]]
key = "decline"
text = "不去：这一仗，名册上一个名字也没有"
next = "a07_toledo"
effects = [{ kind = "affinity", person = "jean_de_valette", value = -2 }]
reply = "拉瓦莱特说：那你来马耳他做什么。我说：来看看别人的名册有多长。他转身去敲下一只桶。"

# A06：杰尔巴的围城，堡里的井干了。
[[tracks.chapters]]
key = "a06_djerba"
title = "骨塔"
text = "五月中，坏消息比船先到马耳他：皮雅利帕夏和图尔古特的舰队在杰尔巴外海追上了联军，半支舰队没了。岛上那座堡还在守，堡里的井早干了，守军拿锅煮海水，接锅盖上的水汽喝。比尔古码头上天天有人往小船上搬水桶，趁夜往南开，回来的船一条比一条少。拉瓦莱特站在码头上，一句话说了两遍：“水送不进去，就把人接出来。别两样都想要。”一个回来的水手把锅盖往桌上一扣：“锅盖上那点水，一个人一天舔三口。”海这么平，像有人把它熨过。"
stage = "involve"
window = [[1560, 5, 11], [1560, 7, 31]]
at = "malta"
cast = ["jean_de_valette", "piyale_pasha", "turgut_reis"]
speaker = "captain"
mood = "sad"
news = "杰尔巴的堡七月底丢了。马耳他回来的船上，没人肯提那座骨头垒的塔。"

[tracks.chapters.default]
