reply = "他坐在一群被剥了衣裳的人中间，胸口空着。我把钱袋扔给看守，看守掂了掂，把他推过来。回丹吉尔的车上他一直攥着我的袖子，说星丢在河里了。我说名册上那个圆圈不会丢。"

[[tracks.chapters.choices]]
key = "tariq"
text = "在马利克的中军前遇见塔里克"
next = "c03_fog_king"
effects = [
  { kind = "flag", flag = "c13_main_noel_alcazar_tariq" },
  { kind = "affinity", person = "tariq", value = 3 },
]
reply = "他眉骨上那道疤结了一层灰。他说马利克死了，中军里的格拉纳达人都哭了。他们流亡了一辈子，跟着这个王回来，王死在了回来的路上。我们一起把一车伤兵送到河边的渡口，两边的人都有，没人问谁是哪边的。"

# C03：雾里的王（结果回响，无 at）。H49 互斥两项。
[[tracks.chapters]]
key = "c03_fog_king"
title = "雾里的王"
text = "八月底到九月，消息一天一个样地传回里斯本。有人说国王死了，尸首已经认过；有人说认尸的人看错了，国王受了伤，躲在哪座修道院里养着，等一个起雾的早上，就从海上回来。贝伦的码头上，每天早上都有人站着往河口看。码头上的老妇人对我说：“他会回来的。等一个有雾的早上。”我没接话。旁边一个水手啐了一口：“国王要是活着，早派人报了。”"
speaker = "captain"
mood = "mystic"
cast = ["noel"]
when = [{ kind = "date", from = [1578, 8, 21] }]
news = "里斯本的贝伦码头上，每天早上都有人站着等国王的船。有人说，要等一个起雾的早上。"

[[tracks.chapters.variants]]
key = "diogo"
when = [{ kind = "flag", flag = "c13_main_noel_diogo_saved" }]
text = "八月底到九月，消息一天一个样地传回里斯本。有人说国王死了，尸首已经认过；有人说认尸的人看错了，国王受了伤，躲在哪座修道院里养着，等一个起雾的早上，就从海上回来。贝伦的码头上，每天早上都有人站着往河口看。迪奥戈在我船上发着烧，一醒就问国王回来没有。码头上的老妇人对我说：“他会回来的。等一个有雾的早上。”"

[[tracks.chapters.variants]]
key = "dissuaded"
when = [{ kind = "flag", flag = "c13_main_noel_dissuaded" }]
text = "八月底到九月，消息一天一个样地传回里斯本。有人说国王死了，尸首已经认过；有人说认尸的人看错了，国王受了伤，躲在哪座修道院里养着，等一个起雾的早上，就从海上回来。贝伦的码头上，每天早上都有人站着往河口看。那天在王宫里，他把我的话听完了。听完，还是去了。"

[[tracks.chapters.variants]]
key = "saw_king"
when = [{ kind = "flag", flag = "c13_main_noel_saw_king" }]
