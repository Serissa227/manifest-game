text = "三月，塞维利亚大教堂外的台阶上，什么都有人卖：糖，奴隶，去西印度的船位，还有证人。佩皮塔管着卡迪斯那家蕾丝铺的钥匙，十年契还没满，每月替老板娘上来收两回账；铺子里面包箱子上的锁，她早砸了。台阶上的人她认得一半。听我说完视察要的三个证人，她从篮子底下摸出一张纸：“台阶上就有。一个两个杜卡多，会哭的四个，说得出你小时候在哪个墙角尿过的，六个。”"

