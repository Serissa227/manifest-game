text = "正月初，塔里法。东风刮了三天，海峡上一片白浪。城堡一早敲了钟，管事把骑士团那件黑袍红斗篷抱到城垛上晾，这件衣裳一年只在点名那天穿。鱼市上的人说，城堡里那位骑士昨天授了剑，剑柄上系着一条红缎带。守门的说，授剑前那一夜，礼拜堂里有人把名册从头念到尾，念得嗓子都哑了，老舵手在门槛外放了一碗汤。卖金枪鱼的老妇人拿这事跟人打赌，嗓门大得半条街都听得见：“钟敲到第三遍，那位骑士才出门，头发还翘着。明早的弥撒，我押他赶不上。”"

# A01：点名。七十六个缺席，第一个空着的名字是阿隆索·德·贝哈尔。
[[tracks.chapters]]
key = "a01_roll"
title = "七十六个缺席"
text = "一月的清晨，塔里法城堡的誓约厅冷得像井底，长桌两边摆着七十七把椅子。管事敲了三遍钟，我才从床上爬起来。门外是他的声音：“骑士，第三遍了。再不起，钟要敲裂了。”我隔着门回他：“谁规定点名要在天亮以前？……念吧，我听着。”然后披上那件嫌热的红斗篷进门，头发还没梳。桌上摊着海峡骑士团的名册：七十七个名字，后面画着十字、圆圈，或者什么也没有。从休达来的摩里斯科老医生站在门口当见证，他不是骑士，不能坐。管事把名册翻到一页，指着第一个什么记号也没有的名字：阿隆索·德·贝哈尔。"
stage = "involve"
window = [[1557, 1, 7], [1557, 2, 28]]
at = "tarifa"
cast = ["c8_tarifa_steward", "noel"]
speaker = "captain"
mood = "tender"
news = "塔里法城堡点了名，七十七个名字，只有一个应了声。守门的说，骑士念完最后一个，在空椅子中间坐了很久。"

[tracks.chapters.default]
next = "a02_st_quentin"
effects = [{ kind = "start_track", track = "main_noel_roster" }]
news = "塔里法城堡点了名，七十七个名字，管事一个人念完了，最后替骑士应了一声。"

[[tracks.chapters.choices]]
key = "read_all"
text = "把七十六个名字一个一个念出声，念到嗓子哑"
next = "a02_st_quentin"
effects = [
  { kind = "growth", attr = "honor", value = 100 },
  { kind = "memory", memory = "mem-main_noel-a01", title = "七十六个缺席" },
  { kind = "start_track", track = "main_noel_roster" },
]
reply = "念到第四十几个，嗓子劈了。老医生把薄荷水推过来，我没喝，接着念。念到最后一个，是我自己，我应了一声“在”，声音在空椅子之间撞了两回才停。天已经大亮，管事在名册最后一行写上日期，写得很慢。"

[[tracks.chapters.choices]]
key = "first_mark"
text = "在第一个没有记号的名字旁边画个问号"
next = "a02_st_quentin"
effects = [
  { kind = "flag", flag = "c13_main_noel_first_mark" },
  { kind = "memory", memory = "mem-main_noel-a01", title = "七十六个缺席" },
  { kind = "start_track", track = "main_noel_roster" },
]
reply = "问号画在“阿隆索·德·贝哈尔”旁边。管事皱眉：问号算什么记号？我说：算我还没问完。他把笔递过来，又收回去，说这是骑士团的名册，不是你的草稿本。我没接话，把问号描得更深了一点。"

[[tracks.chapters.choices]]
key = "close_dead"
text = "把画满十字的那几页合上，只念还有圆圈和空着的"
next = "a02_st_quentin"
effects = [
  { kind = "growth", attr = "resolve", value = 100 },
  { kind = "memory", memory = "mem-main_noel-a01", title = "七十六个缺席" },
  { kind = "start_track", track = "main_noel_roster" },
]
reply = "管事一句话没说。等我出了门，他又把那几页翻开，自己低声念了一遍。我在门外听见了，没进去。"

