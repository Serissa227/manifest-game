fail = { next = "b01_alpujarras", effects = [{ kind = "flag", flag = "c13_main_noel_name_malta" }], news = "森格莱阿的墙头上，有个外来的骑士替一个卡斯蒂利亚人挡了一刀，自己的肩膀开了口子。" }

[[tracks.chapters.choices]]
key = "call_tariq"
text = "认出小船上的塔里克，隔着水喊他的全名"
next = "b01_alpujarras"
effects = [
  { kind = "flag", flag = "c13_main_noel_name_malta" },
  { kind = "affinity", person = "tariq", value = 3 },
  { kind = "growth", attr = "honor", value = 100 },
  { kind = "reputation", faction = "hospital", value = -2 },
]
reply = "他的船停了一下，船头上的人回喊了我的全名：“诺埃尔·德·卡德纳”，一个音也没错。然后圣安杰洛堡的炮响了，他的船掉头退出木桩。墙上的人骂我通敌，贝哈尔替我挡了回去，事后要我把他的名字也念一遍。"

# B01：夜里的加列奥特（交汇：诺埃尔↔塔里克）。
[[tracks.chapters]]
key = "b01_alpujarras"
title = "夜里的加列奥特"
text = "这一年海峡上夜里不点灯的船多了。格拉纳达山里的摩里斯科人圣诞前起了事，北非的船往格拉纳达的海岸运火枪、运人，再把山里逃出来的人运回去。一个没有月亮的夜里，我的船从塔里法出港往东巡，巡到马拉加以东、格拉纳达山脚下的那段海岸外，已是第三更。一条加列奥特从黑里冲出来，船头撞上我的船头，木头响得像骨头断了。对面船头站着一个系红腰带的人，金耳环在灯笼光里闪了一下。是塔里克。他说：“骑士，剑先别拔。我舱里没货，只有人。”我问：“你什么时候改行运人了？”他答：“劫的是货，运的是人。这两样我分得清。”舱盖底下不全是枪，还有几张女人和孩子的脸。远处，王家巡海船的灯正往这边移。"
stage = "involve"
window = [[1569, 3, 1], [1569, 10, 31]]
at = "tarifa"
cast = ["tariq"]
speaker = "captain"
mood = "tense"
news = "格拉纳达海岸外的渔夫说，塔里法那位骑士的船夜里撞上了一条阿尔及尔的加列奥特，两条船贴着走了半里，两边都没开炮。"

