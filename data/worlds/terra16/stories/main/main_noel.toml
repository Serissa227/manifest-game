effects = [{ kind = "memory", memory = "mem-main_noel-c03", title = "雾里的王" }]
reply = "十一月有一天真起了雾，河口白茫茫的，码头上一下子站满了人，有人脱下了帽子。雾从早上压到中午，一条船也没进来。雾散了，河上只有几条打鱼的船。一个老妇人收起手里的蜡烛，说：不是今天。她第二天还来，我也陪她站到了天黑。"

# C04：赎回的人（witness）。阿尔及尔。
[[tracks.chapters]]
key = "c04_ransomed"
title = "赎回的人"
text = "九月，阿尔及尔港里停着帕夏的加莱船，再过一天就要开去君士坦丁堡，塞万提斯已经被锁上了桨座。三一会的两个修士跑遍城里的商人，凑够了五百金币，赶在开船前把人赎了下来。胡安修士数着钱说：“五百。一个金币也没少，一个也没多。”十月底，塞万提斯上了回西班牙的船，在跳板上回头看了一眼这座白城。他对我说：“骑士，这回我真走了。下回见面，我给您讲一个更长的故事。”我在码头上看着。"
stage = "witness"
window = [[1580, 9, 15], [1580, 10, 31]]
at = "algiers"
cast = ["miguel_de_cervantes", "fray_juan"]
speaker = "captain"
mood = "tender"
news = "阿尔及尔的人说，帕夏的船开往君士坦丁堡前一天，三一会的修士赎下了一个手残了的西班牙人。"

[tracks.chapters.default]
