]
reply = "旗抢到了，旗杆比我还高。一颗流弹擦过胸口，把星徽崩掉了一个角。我后来一直没让人补。"
fail = { next = "b05_lisbon_name", effects = [{ kind = "fame", value = 3 }, { kind = "memory", memory = "mem-main_noel-b04", title = "砍断的锁" }], news = "勒班陀那一仗，有个系红缎带的骑士头一批跳上土耳其人的船，又头一批被挤下了海。" }

[[tracks.chapters.choices]]
