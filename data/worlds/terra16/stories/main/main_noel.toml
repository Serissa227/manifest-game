fail = { next = "c03_fog_king", effects = [], news = "马哈赞河边有个外国骑士在尘土里找了一下午国王，找到的只是一匹没有主人的马。" }

[[tracks.chapters.choices]]
key = "diogo"
text = "在俘虏堆里找迪奥戈，拿钱把他换出来"
next = "c03_fog_king"
requires = [
  { kind = "flag", flag = "c13_main_noel_name_lisbon" },
  { kind = "flag", flag = "c13_main_noel_warned_diogo", value = false },
  { kind = "cash", ge = 500 },
]
hint = "名册上没有一个你答应要来找的人，或者你身上的钱换不出一个人。"
