# b1 视察：红剑十字的修道骑士查授剑，也查那四行小字。
[[tracks.chapters]]
key = "b1_visitor"
title = "红剑十字"
text = "四月，圣地亚哥骑士团的会议派来一位视察，瘦高，胸前绣着红剑十字，带一个书记、两个仆人。他说塔里法分团一五五七年正月授剑，没报会议准许，授剑的老团长也死了，这件事要查。他在誓约厅坐了三天，把名册一页一页翻过去，翻到我那一格，用指甲在四行小字底下划了一道：“生于塔里法。谁作证？”埃尔南先生站在我身后，咳了一声。"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1558, 4, 1] }]
at = "tarifa"
speaker = "captain"
mood = "tense"
cast = ["noel"]
deadline = [1560, 12, 31]

[[tracks.chapters.choices]]
key = "hernan"
text = "请埃尔南先生作证"
next = "b2_witness"
effects = [{ kind = "affinity", person = "noel_old_scholar", value = 2 }, { kind = "flag", flag = "rw_noel_b_hernan_swore" }]
reply = "先生作证的时候手背在身后，一个词也不纠正自己。他说一五四三年冬天，孩子是从城里的收容院抱来的，生在塔里法，父母是旧基督徒，死于那年的时疫。说完他看着视察：“若有误差，在我。”视察没听懂这一句，书记照样记下了。"

[[tracks.chapters.choices]]
key = "truth"
text = "自己答：我不知道我生在哪里"
next = "b2_witness"
effects = [{ kind = "growth", attr = "honor", value = 100 }, { kind = "flag", flag = "rw_noel_b_truth_said" }]
reply = "视察抬头看了我很久：“不知道？”我说三岁以前的事，谁记得。他放下笔：“骑士团的人，要知道。”埃尔南先生在背后拽了我一下，我没回头。视察合上名册，给了两年：找三个证人来，不然这一格要拿到会议上议一议。"

[[tracks.chapters.choices]]
key = "hassan"
text = "请哈桑医生作证：那年冬天他在"
next = "b2_witness"
effects = [{ kind = "affinity", person = "noel_physician", value = 3 }, { kind = "flag", flag = "rw_noel_b_hassan_swore" }]
reply = "视察听说医生是休达来的、受过洗，眉头就皱了：“新基督徒的证词，会议只算半份。”医生站在门口没进来：“半份就半份。那年冬天我在门口，看着孩子进来的。”就这一句，他再没多说。书记记下：证人一，摩里斯科人，算半份。"

[tracks.chapters.timeout]
next = "b2_witness"
effects = []
news = "圣地亚哥骑士团的视察在塔里法等了三天。城堡的骑士出海未归，他把名册抄了一份带走。"

[[tracks.chapters.variants]]
key = "rw_hand"
when = [{ kind = "flag", flag = "rw_noel_page_own_hand" }, { kind = "flag", flag = "rw_noel_rule_asked", value = false }]
text = "四月，圣地亚哥骑士团的会议派来一位视察，瘦高，胸前绣着红剑十字，带一个书记、两个仆人。他说塔里法分团一五五七年正月授剑，没报会议准许，授剑的老团长也死了，这件事要查。他在誓约厅坐了三天，把名册一页一页翻过去，翻到我那一格，看了很久：“这一行，有两个人的字。”他用指甲在四行小字底下划了一道：“生于塔里法。谁作证？”埃尔南先生站在我身后，咳了一声。"

[[tracks.chapters.variants]]
key = "rw_rule"
when = [{ kind = "flag", flag = "rw_noel_rule_asked" }]
text = "四月，圣地亚哥骑士团的会议派来一位视察，瘦高，胸前绣着红剑十字，带一个书记、两个仆人。他说塔里法分团一五五七年正月授剑，没报会议准许，授剑的老团长也死了，这件事要查。他翻完名册又翻章程，翻到后半那一条，念出了声：凡入名册者，四代须为旧基督徒。老团长当年不许我念的那一条，他念得又慢又清楚。念完他翻回名册，用指甲在我那一格底下划了一道：“生于塔里法。谁作证？”埃尔南先生站在我身后，咳了一声。"

# b2 证人的价钱：台阶上什么都卖。佩皮塔的去向在这里有回声。
[[tracks.chapters]]
key = "b2_witness"
title = "证人的价钱"
text = "三月，塞维利亚大教堂外的台阶上，什么都有人卖：糖，奴隶，去西印度的船位，还有证人。佩皮塔在卡迪斯和这里之间跑花边，一个月上来两回，台阶底下的人她认得一半。她听我说完视察要的三个证人，从篮子底下摸出一张纸：“台阶上就有。一个两个杜卡多，会哭的四个，说得出你小时候在哪个墙角尿过的，六个。”"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "date", from = [1561, 3, 1] }]
at = "seville"
speaker = "captain"
mood = "cheerful"
cast = ["noel", "pepita_montero"]
deadline = [1563, 6, 30]

[[tracks.chapters.choices]]
key = "buy"
text = "买三个证人"
next = "b3_hernan"
requires = [{ kind = "cash", ge = 300 }]
hint = "三个证人的价钱，你现在掏不出来。"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "rw_noel_b_bought" }]
reply = "佩皮塔挑了三个：一个卖水的老头，一个修鞋的，一个在收容院洗过衣裳的寡妇。他们背了三天，背得比我还熟：哪年冬天，哪个收容院，孩子穿的什么。寡妇背到孩子哭了一夜，自己先哭了，佩皮塔说这一哭值两个杜卡多，另算。视察的书记记完，说证词很齐整。我付钱的时候，手没有抖。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不买：名册不收买来的话"
next = "b3_hernan"
effects = [{ kind = "growth", attr = "honor", value = 100 }, { kind = "flag", flag = "rw_noel_b_refused" }]
reply = "佩皮塔把纸收回去：“好。那你就等着他们来议你。”她给我倒了一碗水，“你知道你们骑士跟我们差在哪儿？我们骗人，为的是吃饭。你们不骗人，为的也是吃饭，吃的是体面。”"

[[tracks.chapters.choices]]
key = "pepita"
text = "她说：我去作证，不要钱"
next = "b3_hernan"
effects = [{ kind = "affinity", person = "pepita_montero", value = 4 }, { kind = "flag", flag = "rw_noel_b_pepita_swore" }]
reply = "她真去了，穿着最好的那件裙子，站在视察面前一口气说了半个时辰：我小时候怎样在码头帮她拖麻绳，怎样被老团长骂，怎样一个结也打不好——全是真的，一句也不沾生在哪里。视察问她知不知道孩子生在哪里。她说：“大人，那年我也才三岁。”书记笑出了声。视察记下：证人二，渔家女，所言皆实，无关紧要。"

[tracks.chapters.timeout]
next = "b3_hernan"
effects = []
news = "塞维利亚大教堂台阶上卖证词的人说，今年来问价的人里，有一个系红缎带的，问完就走了。"

[[tracks.chapters.variants]]
key = "rw_indies"
when = [{ kind = "flag", flag = "rw_noel_pepita_indies" }]
text = "三月，塞维利亚大教堂外的台阶上，什么都有人卖：糖，奴隶，去西印度的船位，还有证人。佩皮塔从新西班牙回来了，晒得像一块熏过的木头，带回一箱没卖掉的花边和一句话：那边的面包也锁在箱子里。她在台阶底下重新支了个摊，台阶上的人她认得一半。听我说完视察要的三个证人，她从摊子底下摸出一张纸：“台阶上就有。一个两个杜卡多，会哭的四个，说得出你小时候在哪个墙角尿过的，六个。”"

[[tracks.chapters.variants]]
key = "rw_shop"
