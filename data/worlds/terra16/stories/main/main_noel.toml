reply = "名册挂上去，风一吹，书页一页页翻，十字、圆圈、空着的格子，谁路过都看得见。我在名册下面钉了一块板，板上只写一行字：看见自己家的名字，进来应一声。头一个进来的是卖金枪鱼的老妇人，她找了半天，指着一个空格子说：“这个是我家那口子，十五年前出海，没回来。”我在格子里画了个十字，她看着，点了点头，没哭。"

