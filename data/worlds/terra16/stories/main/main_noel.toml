[[tracks.chapters.choices]]
key = "returned"
text = "去贝伦的码头，看国王下船"
next = "c04_ransomed"
requires = [{ kind = "flag", flag = "h49_three_kings_sebastian_returns" }]
hint = "这一年，码头上没有船回来。"
effects = [
  { kind = "reputation", faction = "portugal", value = 3 },
  { kind = "memory", memory = "mem-main_noel-c03", title = "雾里的王" },
]
reply = "他瘦了一圈，下船时扶着一个卫兵的肩膀，没看人群。码头上有人喊“陛下”，他听见了，抬头看的却是河口的雾。他认出了我外套上的星，停了一下，什么也没说，被人簇拥着进了城。我站在码头边，看他的靴子踩过湿木板，一步也没回头。那天早上没有雾。"

[[tracks.chapters.choices]]
key = "legend"
text = "跟码头上的人一起，等一个起雾的早上"
