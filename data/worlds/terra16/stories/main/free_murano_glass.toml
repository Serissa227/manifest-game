# 自由船长模板·穆拉诺的玻璃匠之子：个人小线（free_murano_glass，故事 2.0，A5 / E37 契约）
#
# 标签：自由船长模板 custom_murano_glass，家乡港 venice；个人小线 kind = main，共五章。
#   “我”不写性别、外貌、肤色与身高，不写名字；speaker = "captain" 时说话的是“我”，别人称呼“船长”“某家的孩子”。
#   家里的话“火候到了才吹”全线两次（a01 与 c02）。同学（皮耶罗、玛丽埃塔）只许一句客串，本文件一句也不写；1557—1563 年没有章节。
#   博尔托洛师傅是 c8_murano_master（穆拉诺作坊的玻璃师傅）；人设卡里窑边的三句话（“递”“转”“别碰”）本线不用，只写他的白左眼。
#
# 依据（史实与原创的界线）：
#   史实：威尼斯禁止玻璃匠外流（1540 年代以来的法令）；安特卫普仿制“威尼斯式”玻璃；塞浦路斯战争（1570—71）与加莱船的半小时沙漏；
#         德拉·波尔塔《自然魔法》写过镜片的怪事。
#   原创：货舱里出逃的伙计；挂美人鱼招牌的窑；“看得见远处的筒”——望远镜在本世界线提前出现，写成匠人自己的发现，
#         只在 c01 出现，之前不写镜片的奇效。
#
# 轨道：free_murano_glass（auto = true，start = a00_gate）。门槛章 a00_gate：when = c12_voyage_custom_murano_glass（C12 设）；
#   default 设 c13_free_murano_glass。
#   章节：a00_gate（1557-01，见闻）→ a01_journeyman（1564—1565，召）→ b01_sand（1570—1571，限期）→ c01_tube（1578—1580，转）→ c02_furnace（1585—1588，终章）。
# 读的旗标：c12_voyage_custom_murano_glass（C12）。c02 的变体读 c13_free_murano_glass_smuggled（a01）与 c13_free_murano_glass_tube_venice / _tube_ottoman / _tube_porta（c01）。
# 设的旗标：c13_free_murano_glass（a00 default）；c13_free_murano_glass_smuggled（a01 的出逃选项，检定成功才设）；
#   c13_free_murano_glass_tube_venice / _tube_ottoman / _tube_porta（c01 三个选项，各设一面）。
# 物品：half_hour_glass（b01 的 furnace 选项给）；porta_naples（c01 的 porta 选项 requires，只查不扣）。
# 目标：b01_sand 的 goods quartz_sand 10 在 venice 回应时扣一次（三个选项都在这一章卸下）。
# HIST_ 占位旗标：无。
# 等待的包：A9（门槛章的 protagonist 条件，整合时可加）；C12（c12_voyage_custom_murano_glass 的来源）。
# 回忆插画清单（mem-* 键与画面，各不超过 60 字）：
#   mem-free_murano_glass-a01 攥着吹管的手：夜里的船舱，一个年轻匠人攥着一根铁吹管坐在灯下，船长站在舱门口。
#   mem-free_murano_glass-c02 重新点着的炉子：穆拉诺的作坊里炉口重新冒出红光，老匠人坐在一旁，看船长把吹管伸进火里。
#   mem-free_murano_glass-c02b 交给行会的配方：行会的长桌上，一本抄满配方的小册子摊开着，老匠人和船长隔着桌子坐着。

[[tracks]]
key = "free_murano_glass"
name = "潟湖的禁令"
kind = "main"
start = "a00_gate"
auto = true
cast = ["c8_murano_master"]

[[tracks.chapters]]
key = "a00_gate"
title = "十人议会的告示"
text = "正月，穆拉诺的作坊街口又贴出十人议会的告示：玻璃匠不许离开潟湖，走了的，家里人要替他坐牢。告示底下围了一圈人，有人说这回是真要抓。偏偏这时候，挂美人鱼招牌那座窑的博尔托洛师傅，家里的孩子要当船长出海了。行会的老人站在告示前头：“手上起过炉茧的，走到哪儿都是穆拉诺的人。”卖鱼的婆子在一旁啐了一口：“告示上可没写船长。”"
when = [{ kind = "flag", flag = "c12_voyage_custom_murano_glass" }]
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "venice"
cast = ["c8_murano_master"]
mood = "tender"
news = "穆拉诺又贴出告示，不许玻璃匠离开潟湖；可玻璃师傅家的孩子偏偏当了船长，行会的人为这事吵了一个晚上。"

[tracks.chapters.default]
next = "a01_journeyman"
effects = [{ kind = "flag", flag = "c13_free_murano_glass" }]

[[tracks.chapters]]
key = "a01_journeyman"
title = "货舱里的匠人"
text = "夜里起了雾，船泊在威尼斯港外的锚地，桅灯只剩一团黄。有人敲舱门，敲得很轻。进来的是父亲作坊里最好的那个吹玻璃的伙计，左手攥着一根铁吹管。他站在灯前，先看我的手，又看摊在桌上的海图。“安特卫普有人开了威尼斯式的玻璃坊，工钱是这里的三倍。求船长把我藏进货舱，带出潟湖。”我用指甲沿着海图上的潟湖口子划过去。“货舱里能放一个人。可海关要开箱子。”他把吹管往海图边上一磕，响了一声。“海关里有十人议会的眼线，抓到了，人送回来，帮忙的也跑不了。”他把吹管翻过来，管口有一道磨出来的凹痕。“这是师傅的手磨出来的。我拿它走，等于把师傅的一半也搬上船。师傅教我的，我不会教给别人。我只是……想自己吹自己的炉。”父亲的窑边有一句话，我们从小听到大：火候到了才吹。我没说出口：父亲知道了，会说什么？"
when = [{ kind = "date", from = [1564, 3, 1] }]
at = "venice"
speaker = "captain"
mood = "tense"
deadline = [1565, 10, 31]

[tracks.chapters.timeout]
next = "b01_sand"
effects = [{ kind = "letter", person = "c8_murano_master", text = "孩子：那个伙计自己走了。没人藏他，也没人替他说话。他坐的是一条去安特卫普的盐船，船老大收了他一点钱，说是替船上添口汤水。他的吹管还留在你的舱里，你回来时替我带回来。十人议会的人来问过两回，问有没有人从你的船上下去，我说不知道。——父亲" }]

[[tracks.chapters.choices]]
key = "smuggle"
text = "把他藏进货舱，混过海关带出潟湖"
next = "b01_sand"
check = { attr = "intrigue", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_free_murano_glass_smuggled" }, { kind = "reputation", faction = "venice", value = -2 }]
reply = "船出了潟湖的口子，天还没亮。伙计从货舱的木箱里爬出来，手里还攥着那根吹管。他对着身后的穆拉诺跪了一下，额头贴着甲板，什么也没说。我把舱口的板子重新钉上，钉歪了一根，也没有再拔。"
fail = { next = "b01_sand", effects = [{ kind = "reputation", faction = "venice", value = -3 }], news = "威尼斯港口的海关在货舱里多敲了两下木箱，伙计被押回了岸上。穆拉诺的人说，博尔托洛师傅一个月没跟自家的孩子说话。" }

[[tracks.chapters.choices]]
key = "persuade"
text = "劝他留下，替他去跟父亲谈工钱"
next = "b01_sand"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "memory", memory = "mem-free_murano_glass-a01", title = "攥着吹管的手" }]
reply = "我替他去谈。父亲听完，沉默了半天，然后给伙计涨了工钱，又在作坊后头给了他一座自己的小炉子。伙计没有道谢，只把吹管在衣襟上蹭了又蹭。那天夜里，作坊后头只亮着一盏灯，我从院子里望过去，能看见他把火门一个一个试过去。"
fail = { next = "b01_sand", news = "穆拉诺的作坊街上有人传，博尔托洛师傅撂下一句：“工钱好商量，规矩碰不得。”第二天一早，那个吹玻璃的伙计就搭别人的船走了。" }

[[tracks.chapters.choices]]
key = "tell"
text = "把这件事告诉父亲，让他自己处理"
next = "b01_sand"
effects = [{ kind = "reputation", faction = "venice", value = 2 }]
reply = "我连夜把这件事讲给父亲听，讲得很慢，怕漏了哪一句。他没骂人，只问了一句：“他的吹管还在不在？”然后披上外套去了作坊，谈了什么我不知道。第二天伙计照常上工，再也没有跟我说过话。"

[[tracks.chapters]]
key = "b01_sand"
title = "沙漏里的沙"
text = "塞浦路斯开了仗。兵工厂的工头一早就来了穆拉诺，带着一张单子：加莱船上计时用的半小时沙漏，要几百只。玻璃要薄，要匀，沙要细得能从针眼里过。父亲站在窑口，把一撮白砂捏在指头间搓，搓到最后只剩一层粉。“沙不细，玻璃再好也白搭。”他说，眼睛看的却是我船上运来的那几袋砂。工头在一旁催：“船上的人靠它换班，靠它算航程。沙漏不准，整条船就迷路。”父亲吹第一只沙漏那天，我站在炉边数着沙落，数到一半才发现，正好是半个时辰。他吹了四十年玻璃，手比钟准。我想知道，这些沙漏最后要挂在哪条船上，哪一个人会盯着它翻过来。"
when = [{ kind = "date", from = [1570, 4, 1] }]
at = "venice"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "goods", good = "quartz_sand", qty = 10, at = "venice", text = "把石英砂运到威尼斯" }]
deadline = [1571, 7, 15]

[tracks.chapters.timeout]
next = "c01_tube"
effects = [{ kind = "letter", person = "c8_murano_master", text = "孩子：兵工厂的沙漏另找了人吹，砂是从伊斯特拉运来的。舰队已经往墨西拿去了。你那一船砂没有人来收，也没有人来问。炉子还在烧，你回来进门先把靴子脱了，别带着海水进窑房。——父亲" }]

[[tracks.chapters.choices]]
key = "arsenal"
text = "把砂直接交给兵工厂的工头"
next = "c01_tube"
effects = [{ kind = "cash", value = 450 }, { kind = "reputation", faction = "venice", value = 3 }]
reply = "工头当场把砂倒进秤盘，一粒一粒地看。称完，他撕下一张票据，上面压着一只有翼狮子的火漆印。票据上写的是什么，我没细看。装车的人来回搬了三趟，工头一直站在码头上没走。父亲在窑口那边没有回头。"

[[tracks.chapters.choices]]
key = "furnace"
text = "把砂送进父亲的炉子，陪他一起吹沙漏"
next = "c01_tube"
effects = [{ kind = "reputation", faction = "venice", value = 2 }, { kind = "item", item = "half_hour_glass", qty = 1 }]
reply = "我吹坏了七只，不是太厚，就是裂了纹，堆在窑边。我把砂重新过了一遍筛，手上的旧茧磨破了，血印在吹管上。第八只吹出来，父亲在窑口看了一眼，点了头。他把那一只留给了我，没有放进装货的箱子。"

[[tracks.chapters.choices]]
key = "ragusa"
text = "把砂卖给出价更高的拉古萨商人"
next = "c01_tube"
effects = [{ kind = "cash", value = 900 }, { kind = "reputation", faction = "venice", value = -1 }]
reply = "拉古萨人付的是金币，过秤时还笑：“威尼斯的玻璃匠，就只有这点死心眼？”木箱一只一只搬过去，船边的水声很响。我下船的时候，父亲正站在窑口，手里捏着一撮白砂。他看见我从别人的船上下来，没有问，把那撮砂扔回了盆里。"

[[tracks.chapters]]
key = "c01_tube"
title = "看得见远处的筒"
text = "春天，父亲作坊后屋的窗开着，风里有潟湖的咸味。桌上摊着一副眼镜的毛坯，是替老会计做的，他看账本的字越来越小。我把一片凸镜和一片凹镜一前一后装进铜筒，只想把镜片的距离调准。筒子拉到最长，对着窗外。圣马可的钟楼一下子跳到了眼前，钟楼顶上的鸽子，我能数清有几只。父亲从炉边走过来，拿过去看了很久。他只用右眼凑上去，左眼闭着。放下筒的时候，他说：“看得远的东西，先看见的是打仗的人。”兵工厂的书记前些日子来问过老会计的眼镜，问得很细。伊斯坦布尔的商人天天在码头上转。码头上有人说，那不勒斯有位先生写过一本《自然魔法》，书里讲过镜片的怪事。父亲把筒推回到我面前：“十人议会要是知道了，这根筒就是一道新的告示。你来定。”我想，我只是想替一个老人看清账本。"
when = [{ kind = "date", from = [1578, 3, 1] }]
at = "venice"
speaker = "captain"
mood = "mystic"
deadline = [1580, 12, 31]

[tracks.chapters.timeout]
next = "c02_furnace"
effects = [{ kind = "letter", person = "c8_murano_master", text = "那个筒我收起来了，放在炉子后面的箱子里。镜片会起雾，人也会。——父亲" }]

[[tracks.chapters.choices]]
key = "venice"
text = "献给十人议会，让兵工厂去管"
next = "c02_furnace"
effects = [{ kind = "flag", flag = "c13_free_murano_glass_tube_venice" }, { kind = "reputation", faction = "venice", value = 3 }]
reply = "议会的书记把筒锁进一只铁箱，递过一张不许外传的誓书，签名的地方要按手印。我按了，指印留在纸上，比签名还清楚。书记把筒拿在手里转了一圈，只看底下那一截铜，没有对着窗户试。他问我还有没有别的图样，我说没有。他点点头，说兵工厂会来人，让我在穆拉诺等着。那天夜里父亲没有说话，只把窑门关得比平时早。我想，这一回是我自己把它交出去的。兵工厂的人第二天一早就来了，车轮压过石板路，响了整条街。领头的人没有进作坊，只在门口朝窑房里望了一眼。"

[[tracks.chapters.choices]]
key = "ottoman"
text = "卖给从伊斯坦布尔来的商人"
next = "c02_furnace"
effects = [{ kind = "flag", flag = "c13_free_murano_glass_tube_ottoman" }, { kind = "cash", value = 2500 }, { kind = "reputation", faction = "venice", value = -3 }]
reply = "商人对着潟湖看了一眼，笑了。他把筒举到眼前，对着码头那头的桅杆看了很久，嘴角翘了起来。付钱的时候，他的伙计数了两遍，每一袋都用手掂过。商人临走时说：“我的主人会很高兴，你们的议会不会。”他把筒装进毡套，塞进袍子里，没有回头。父亲那天没有上码头。码头上的人都在看那条船。有个挑水的老头说，那东西要是落到奥斯曼人手里，将来看谁的船都清楚。我没接话，把手里的缆绳解开又系上。我站在岸边，看着那条船出了口子。"

[[tracks.chapters.choices]]
key = "porta"
text = "寄给那不勒斯写《自然魔法》的那位先生"
next = "c02_furnace"
requires = [{ kind = "item", item = "porta_naples", qty = 1 }]
hint = "你没读过那位先生的书，不知道该寄给谁、怎么写信。"
effects = [{ kind = "flag", flag = "c13_free_murano_glass_tube_porta" }]
reply = "回信走了两个月才到。那位先生说，他早想到过这件事，只是没有做成；末了问我，镜片是怎么磨出来的。我把磨镜的法子写了三页，字写得歪歪斜斜，有几处只能画图。草稿上有一处我把凸与凹画反了，改了三次，纸都擦破了。写完才发现，这法子是在父亲的窑边学来的，他从来没有写下过一个字。信寄走那天，父亲从窑边看了一眼信封，没有说话，只把炉门的火拨旺了一点。信封上的字，我写了三遍才写正。码头上的人问我寄的是什么，我说是一封很长的信。"

[[tracks.chapters]]
key = "c02_furnace"
title = "冷下来的炉子"
text = "冬天，父亲的炉子熄了三天没点。柴堆得满墙，可他的手抖得拿不住吹管了，吹出来的杯脚歪得连学徒都不肯看。作坊的墙边排着一溜坩埚，第三只上有一道裂纹，是我小时候砸的，那时候想看看里头是不是空的。行会的人来了，穿着黑袍站在门口，问的话很简单：这座炉子，谁接？炉子要留在穆拉诺，别处不许点，行会的人说得很平。父亲坐在窑口的矮凳上，左眼还是发白的，右眼看着我。“炉子冷了可以再点，手冷了就点不回来了。”他说。过了一会儿，又添了一句：“你走了这么多年，手上的茧还在。”他说这话的时候，手按在膝盖上，没有抖。我把手摊开，掌心那层硬皮是十几岁磨出来的，现在还在。父亲说，火候到了才吹。这一回他是说给行会的人听的。我想，船上的大副能管船，管不了炉子。"
when = [{ kind = "date", from = [1585, 1, 15] }]
at = "venice"
speaker = "captain"
mood = "sad"
deadline = [1588, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "letter", person = "c8_murano_master", text = "炉子我交给了行会。你回来的时候，记得去看一眼，第三只坩埚是你小时候砸裂的那只。" }]

[[tracks.chapters.choices]]
key = "stay"
text = "回来接下炉子，把船交给大副"
next = "done"
effects = [{ kind = "reputation", faction = "venice", value = 2 }, { kind = "memory", memory = "mem-free_murano_glass-c02", title = "重新点着的炉子" }]
reply = "第一炉吹坏了，第二炉也吹坏了。我把船交给大副，写了一张条子，压在海图的潟湖那一角。第三炉父亲没有看，只听着炉膛里的声音，就说：“成了。”我把第三只坩埚拿到窑边，那道裂纹朝外，没有去动它。那天夜里，行会的人在门口立了片刻，没有进来，提起黑袍的下摆走了。父亲坐在矮凳上，两只手放在膝盖上，第一次没有抖。我守到天亮，窑里的火一直没有断过。父亲那一晚睡得很沉，是这三天里第一回。作坊里的柴堆还在墙边，我一根一根地添进去。"

[[tracks.chapters.choices]]
key = "leave"
text = "带着手艺走，去一个没有告示的港口"
next = "done"
effects = [{ kind = "reputation", faction = "venice", value = -2 }, { kind = "fame", value = 1 }]
reply = "我把父亲的配方抄在航海日志的背面，一页配方，一页航线。抄到第三页，手抖了一下，墨点滴在“石英砂”三个字上。船上的大副问我要不要改航线，我说照原来的走。墨迹还没干，船已经出了港。穆拉诺的钟在身后敲了一下，我没有回头看。炉子在我身后冷着，父亲大概还坐在窑口，两只手按在膝盖上。航海日志的背面写满了，我又翻到正面的空页，接着写航线。直到海岸线看不见，我才停下笔。那天风向转了，大副喊人收帆，我站在船尾，看穆拉诺的岸线慢慢矮下去。"

[[tracks.chapters.choices]]
key = "guild"
text = "抄一份配方交给行会，炉子留在穆拉诺"
next = "done"
effects = [{ kind = "reputation", faction = "venice", value = 1 }, { kind = "memory", memory = "mem-free_murano_glass-c02b", title = "交给行会的配方" }]
reply = "我把父亲的配方一条一条抄进小册子，抄得很慢，抄错了就撕掉重来。抄完送到行会，门口的黑袍人没有拦我，只点了点头。老人翻了两页，把小册子合上，说这些配方够穆拉诺用一百年。他没有再问炉子的事，只是把小册子压在长桌的一角，压得很平。我走出行会的门，回头看了一眼父亲的窑口，火还没有点。我在行会的台阶上坐了一会儿，手心的硬皮蹭着石头，有点疼。晚上回到作坊，父亲在矮凳上睡着了，我没有叫醒他。窑房里的冷气从门缝里钻出来。"

[[tracks.chapters.variants]]
key = "v1_smuggled"
when = [{ kind = "flag", flag = "c13_free_murano_glass_smuggled" }]
text = "冬天，父亲的炉子熄了三天没点。柴堆得满墙，可他的手抖得拿不住吹管了，吹出来的杯脚歪得连学徒都不肯看。作坊的墙边排着一溜坩埚，第三只上有一道裂纹，是我小时候砸的，那时候想看看里头是不是空的。行会的人来了，穿着黑袍站在门口，问的话很简单：这座炉子，谁接？炉子要留在穆拉诺，别处不许点，行会的人说得很平。父亲坐在窑口的矮凳上，左眼还是发白的，右眼看着我。“炉子冷了可以再点，手冷了就点不回来了。”他说。过了一会儿，又添了一句：“你走了这么多年，手上的茧还在。”他说这话的时候，手按在膝盖上，没有抖。我把手摊开，掌心那层硬皮是十几岁磨出来的，现在还在。父亲说，火候到了才吹。这一回他是说给行会的人听的。我想，船上的大副能管船，管不了炉子。安特卫普来了一封信，是当年货舱里那个伙计写的，他的炉子也起了，信里问师傅的手还好吗。"

[[tracks.chapters.variants]]
key = "v2_venice"
when = [{ kind = "flag", flag = "c13_free_murano_glass_tube_venice" }]
