when = [{ kind = "flag", flag = "c13_free_murano_glass_tube_porta" }]
text = "冬天，父亲的炉子熄了三天没点。柴堆得满墙，可他的手抖得拿不住吹管了，吹出来的杯脚歪得连学徒都不肯看。作坊的墙边排着一溜坩埚，第三只上有一道裂纹，是我小时候砸的，那时候想看看里头是不是空的。行会的人来了，穿着黑袍站在门口，问的话很简单：这座炉子，谁接？炉子要留在穆拉诺，别处不许点，行会的人说得很平。父亲坐在窑口的矮凳上，左眼还是发白的，右眼看着我。“炉子冷了可以再点，手冷了就点不回来了。”他说。过了一会儿，又添了一句：“你走了这么多年，手上的茧还在。”他说这话的时候，手按在膝盖上，没有抖。我把手摊开，掌心那层硬皮是十几岁磨出来的，现在还在。父亲说，火候到了才吹。这一回他是说给行会的人听的。我想，船上的大副能管船，管不了炉子。那不勒斯的先生寄来一本新书，扉页上写着“给穆拉诺的那一双手”。"
