reply = "船员骂了一路。他把自己那份珊瑚分给他们，堵住了一半的嘴。放人的海滩上，那个女孩把乘客单折好还给他，说留着，下回你就知道我们叫什么。"

[[tracks.chapters.choices]]
key = "sell"
text = "连人带货拉回巴德斯坦，照规矩卖"
