text = "接舷之后，甲板上滑着鱼油和血。舱口掀开，底下蹲着十一个人：珊瑚工的妻子，两个老人，几个孩子，最小的那个男孩攥着什么东西不撒手。塔里克想起得土安地牢口那只木船。文书捏着一张乘客单，手抖得念不出名字。老舵手在旁边算账：“十一个人，抵得上半船珊瑚。船长，你算算，巴德斯坦这个月的价钱好。”塔里克张了张嘴，那句话已经到了舌尖：“只劫货，不劫人。货搬走，人留下。”说出口才知道它比弯刀沉。一个女孩从文书手里抽过乘客单，自己念出了自己的名字，念得比文书快。"

# a03：萨阿德的王子流亡到阿尔及尔。纯见闻。
[[tracks.chapters]]
key = "a03_saadi"
title = "流亡的王子"
text = "西边来的船带来消息：萨阿德的老苏丹死在阿特拉斯山里自己的帐子里，下手的是身边的卫兵。新苏丹清理兄弟，一个十六岁的王子带着几个仆人坐船逃到了阿尔及尔，在防波堤上用西班牙话和土耳其话轮流问路。码头上的人学他的口气说：“这里谁弹乌德琴？我父亲的帐子里，也有人弹。”"
stage = "rumor"
window = [[1557, 10, 23], [1557, 12, 31]]
at = "algiers"
cast = ["abd_al_malik"]
mood = "tense"
news = "阿尔及尔的人说：萨阿德的老苏丹死在自己的帐子里，他的一个儿子坐船逃到了这里，才十六岁。"
when = []

