effects = [{ kind = "reputation", faction = "ottoman", value = 4 }, { kind = "affinity", person = "uluc_ali", value = 5 }]
reply = "炮口照着那几段灰浆打，墙塌得像泡了水的面包。乌卢赤·阿里把破帆布折好，揣进了自己怀里。"

[[tracks.chapters.choices]]
