# c05：海底的玫瑰。限期章，印记（五块雕石只看、只描、不捞）。
[[tracks.chapters]]
key = "c05_wreck"
title = "海底的玫瑰"
text = "初夏，风停的那几天，城东的海面平得能照见云。小船停在羊皮上那个十字的上方，绳子一圈圈放下去，铅坠拴在潜水人的腰上。上来的人吐出一口海水，用炭笔在纸上描他看见的东西：一朵玫瑰，一只号角，一条金眼的鱼，一只珍珠作舌的小铃，一只金足的小杯，和戈马拉书里写的五块石头对得上。潜水人说：“石头是绿的，可不透亮，不像祖母绿。”船员问：“不捞？那咱们下来干什么？”塔里克说：“看。皇帝丢的东西，咱们看一眼就够了。”（心里）这是我这辈子头一回，看见好东西不动手。"
speaker = "captain"
mood = "mystic"
cast = ["tariq"]
at = "algiers"
when = [{ kind = "date", from = [1581, 5, 1] }]
objectives = [{ kind = "item", item = "divers_witness", qty = 1, text = "潜水人的画在你手里" }, { kind = "goods", good = "rope", qty = 10, at = "algiers", text = "备齐下水的绳子" }]
deadline = [1582, 5, 31]

[tracks.chapters.timeout]
next = "c06_summons"
effects = []

[[tracks.chapters.variants]]
key = "a_jade"
when = [{ kind = "flag", flag = "c13_npc_ix_nikte_jade_hint" }]
text = "初夏，风停的那几天，城东的海面平得能照见云。小船停在羊皮上那个十字的上方，绳子一圈圈放下去，铅坠拴在潜水人的腰上。上来的人吐出一口海水，用炭笔在纸上描他看见的东西：一朵玫瑰，一只号角，一条金眼的鱼，一只珍珠作舌的小铃，一只金足的小杯，和戈马拉书里写的五块石头对得上。科苏梅尔那边捎来一句话：画上的东西，那里的人叫它玉，比金子贵。潜水人说：“石头是绿的，可不透亮，不像祖母绿。”船员问：“不捞？那咱们下来干什么？”塔里克说：“看。皇帝丢的东西，咱们看一眼就够了。”（心里）这是我这辈子头一回，看见好东西不动手。"

