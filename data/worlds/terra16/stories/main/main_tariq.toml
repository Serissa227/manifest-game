# a09：祖母把钥匙交到他手里。见证章，无选项。
[[tracks.chapters]]
key = "a09_grandmother"
title = "手与钥匙"
text = "刮东风的晚上，油灯烧得很低。祖母病了，躺在铺着阿尔普哈拉斯丝毯的床上。钥匙他从小就带着，今晚祖母要他把钥匙放进她手心，再一根根把他的手指合上去。“门朝日出，井朝星星；钥匙朝着回家的人。”她讲格拉纳达城门上的老话：外面那道拱上刻着一只手，里面那道拱上刻着一把钥匙。手够着钥匙那天，城就破了。塔里克说：“那它早就够着了。”祖母说：“那就换一只手。”（心里）这把钥匙我带了十几年，今晚才有了分量。"
stage = "witness"
window = [[1566, 3, 1], [1566, 12, 31]]
at = "algiers"
speaker = "captain"
mood = "tender"
night = true
cast = ["tariq"]
news = "阿尔及尔的人说：那个弹琴的海盗这一冬没出海，天天守在他祖母的床边。"
when = []

[tracks.chapters.default]
