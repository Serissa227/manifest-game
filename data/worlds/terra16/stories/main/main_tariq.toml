# b08：塞万提斯。交汇：诺埃尔（不用代词）。塞万提斯的口头禅只在这里用一次。
[[tracks.chapters]]
key = "b08_cervantes"
title = "不肯死心的俘虏"
text = "俘虏院里，一个左手残了的西班牙兵在给别的俘虏讲故事，讲得人忘了饿。他身上搜出过唐·胡安写的推荐信，看守把他当成了大人物，赎价抬得吓人。他已经跑过一回，向奥兰走，向导半路丢下了他。诺埃尔这些年住在阿尔及尔赎人，这回找上了塔里克的船：“这个人越狱的次数，比我赖床的次数还多。你帮不帮？”塞万提斯先开口：“坐吧，别看我这只左手。它在勒班陀替右手挣了光荣，如今只管端碗。”塞万提斯说，城东有个花园，园子里有个洞，能藏十几个人，他要带着别人一起走。（心里）他不是我劫来的。可这座城给他定价的时候，我也在场。"
speaker = "captain"
mood = "tense"
cast = ["miguel_de_cervantes", "noel", "fray_juan"]
at = "algiers"
when = [{ kind = "date", from = [1576, 3, 1] }]
deadline = [1577, 12, 31]

