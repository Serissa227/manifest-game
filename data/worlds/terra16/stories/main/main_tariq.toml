[[tracks.chapters.variants]]
key = "a_hand"
when = [{ kind = "flag", flag = "c13_main_tariq_stance_hand" }]
text = "夏天，特塞拉岛。圣克鲁斯侯爵的舰队压在岛东，七月底在海滩登陆，岛上的法国人和安东尼奥的人守不住了。岛西边的海上浮着成片的海草，无风，罗经在盘里乱转。海草底下翻着死鱼的白肚皮，船员用篙子拨开，又拨回去。诺埃尔的船停在海草边上，等着塔里克的船。诺埃尔隔着两船的距离喊：“罗经不灵了。你那把钥匙呢？指个方向。”塔里克说：“钥匙在妹妹的木盒里。……往那边，那边的海草颜色深。”海草在船底下沙沙地响，像有人在翻一本很旧的书。（心里）柱子外头。祖母，我到了。"

[[tracks.chapters.choices]]
key = "cross"
text = "跟着诺埃尔的船，开进海草里去"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "你手里没有能在雾里认路的东西。"
next = "c08_after"
effects = [{ kind = "flag", flag = "c13_main_tariq_crossed" }]
reply = "海草越来越密，桨划不动了就用篙撑。雾从水面上站起来，两条船之间只剩一根拴着的缆绳。他最后听见的是诺埃尔骂了一句天气。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头，这片海不是给人走的"
next = "c08_after"
effects = [{ kind = "flag", flag = "c13_main_tariq_turned_back" }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }]
reply = "他解开两条船之间的缆绳，扔了回去。诺埃尔接住，没说话，冲他举了一下剑柄上的红缎带。"

[[tracks.chapters.choices]]
key = "beach"
text = "先去特塞拉的海滩，把困在那里的人运出来"
next = "c08_after"
effects = [{ kind = "flag", flag = "c13_main_tariq_turned_back" }, { kind = "growth", attr = "honor", value = 200 }, { kind = "reputation", faction = "spain", value = -1 }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }]
news = "安格拉的人说：西班牙人登岛那天，一条阿尔及尔的加列奥特在岛北的海滩上接了一船人走，没挂任何一边的旗。"
reply = "等他回到海草边上，诺埃尔的船已经不见了，只有海面上一圈慢慢合拢的水纹。"

# c08：那以后。在家乡港。读 C11 的会议旗标（变体）。无 at 的偏离见 notes。
[[tracks.chapters]]
key = "c08_after"
title = "回来以后"
text = "回到阿尔及尔的家。墙上挂钥匙的那颗钉子，母亲一直没让人取下来。母亲问他晒黑了没有，他说海草把太阳都挡了。妹妹围着他问：“柱子外头是什么？有没有石榴？”塔里克张嘴想开玩笑，没开出来：“有……有雾。”平时他的笑话能一直说到底，这回说到嘴边又咽了回去。妹妹不信，拉着他的袖子要他把乌德琴弹一遍。他弹了两个音，停下来，说琴弦松了，要换。妹妹说换就换，他说不急。"
speaker = "captain"
mood = "mystic"
cast = ["tariq"]
at = "algiers"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_tariq_atlantis_over" }]
deadline = [1585, 6, 30]

[tracks.chapters.timeout]
next = "c09_lanzarote"
effects = []

[[tracks.chapters.variants]]
key = "a_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "回到阿尔及尔的家。墙上挂钥匙的那颗钉子，母亲一直没让人取下来。回来的人不愿多讲：他见过十个王坐在黑暗里，那件事他只讲给妹妹一个人听，讲成一个故事，故事里有一扇不上锁的门。妹妹问他柱子外头是什么，有没有石榴。塔里克张嘴想开玩笑，没开出来：“有……有雾。”平时他的笑话能一直说到底，这回说到嘴边又咽了回去。妹妹不信，拉着他的袖子要他把乌德琴弹一遍。他弹了两个音，停下来，说琴弦松了，要换。妹妹说换就换，他说不急。"

[[tracks.chapters.variants]]
key = "b_crossed"
when = [{ kind = "flag", flag = "c13_main_tariq_crossed" }]
text = "回到阿尔及尔的家。墙上挂钥匙的那颗钉子，母亲一直没让人取下来。母亲问他晒黑了没有，他说海草把太阳都挡了。妹妹围着他问：“柱子外头是什么？有没有石榴？”塔里克张嘴想开玩笑，没开出来：“有……有雾。”平时他的笑话能一直说到底，这回说到嘴边又咽了回去。妹妹不信，拉着他的袖子要他把乌德琴弹一遍。他弹了两个音，停下来，说琴弦松了，要换。妹妹说换就换，他说不急。他在柱子外头看见的东西，说出来没人信，连他自己都不太信。"

