# c06：召请（无 at）。门朝日落，海在柱子外头。诺埃尔的信不用代词。三选一立场。
[[tracks.chapters]]
key = "c06_summons"
title = "门朝日落"
text = "一条从西班牙来的船靠上了“鸥”泊着的港口，下来一个格拉纳达的老妇人。她在码头上唱起祖母常念的那句，下半句却不一样：“门朝日落，海在柱子外头。”唱完，她把一只缺了口的铜铃塞进他手里，说这是给带钥匙的人摇的，摇响了，门那边的人就知道有人来了。同一条船带来一封信，是诺埃尔从里斯本寄来的：“铭文另有一种读法。亚速尔见。带上你那把破钥匙——别装作没听懂。”（心里）祖母念的是上半句。下半句她一辈子没念过，是不敢，还是忘了？"
speaker = "captain"
mood = "mystic"
cast = ["tariq", "noel"]
when = [{ kind = "date", from = [1582, 6, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c07_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_tariq_stance_open" }]

[[tracks.chapters.choices]]
key = "open_key"
text = "带上钥匙：那边要是有门，就让它开着，谁来都能进"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "没带钥匙，谈不上让门开着。"
next = "c07_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_tariq_keepsake" }, { kind = "flag", flag = "c13_main_tariq_stance_open" }]
reply = "他把钥匙用母亲的丝线穿起来挂在脖子上。船员问去哪里，他说往西，西到没有港口的地方。"

[[tracks.chapters.choices]]
key = "close_key"
text = "带上钥匙：那边的门，替里面的人锁好"
requires = [{ kind = "item", item = "granada_key", qty = 1 }]
hint = "没带钥匙，锁不了那边的门。"
next = "c07_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_tariq_keepsake" }, { kind = "flag", flag = "c13_main_tariq_stance_close" }]
reply = "他想起那把没有门的锁，门板劈了当柴，锁却还挂着。那样的事，他不想替谁再做一遍。钥匙贴着胸口，凉的。"

[[tracks.chapters.choices]]
key = "hand"
text = "把钥匙留给妹妹，空手去：门交给守规矩的人"
next = "c07_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_tariq_stance_hand" }]
reply = "妹妹接过钥匙，问他回不回来。他说回来，回来就找她要钥匙。她把钥匙收进了阿伊莎教她认字时用的那个木盒。"

# c07：黑暗之海。交汇：诺埃尔。柱子外面。亚速尔以西的雾。
[[tracks.chapters]]
key = "c07_dark_sea"
title = "柱子外面"
text = "夏天，特塞拉岛。圣克鲁斯侯爵的舰队压在岛东，七月底在海滩登陆，岛上的法国人和安东尼奥的人守不住了。岛西边的海上浮着成片的海草，无风，罗经在盘里乱转。海草底下翻着死鱼的白肚皮，船员用篙子拨开，又拨回去。诺埃尔的船停在海草边上，等着塔里克的船。诺埃尔隔着两船的距离喊：“罗经不灵了。你那把钥匙呢？指个方向。”塔里克说：“钥匙又不是罗经。……往那边，那边的海草颜色深。”海草在船底下沙沙地响，像有人在翻一本很旧的书。（心里）柱子外头。祖母，我到了。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
speaker = "captain"
mood = "mystic"
cast = ["tariq", "noel", "alvaro_de_bazan"]
news = "安格拉的人说：西班牙人登岛那个夏天，岛西边的海上起了一场不散的雾，罗经在船上乱转。"
when = []

[tracks.chapters.default]
next = "c08_after"
