# b06：唐·胡安取突尼斯。唐·胡安的口头禅只在这里用一次。
[[tracks.chapters]]
key = "b06_tunis_lost"
title = "皇帝的儿子进城"
text = "十月，唐·胡安的舰队在拉格莱特靠了岸，没放一枪就进了突尼斯城。城里的人往凯鲁万的方向逃，驴车塞满了城门。唐·胡安骑马在城边划线，要修一座新堡，人们说他想在这里给自己戴一顶王冠。他注意到这条阿尔及尔的船，叫人把船长带过去。“人人都说我是皇帝的儿子、国王的弟弟。那你呢，船长，你是谁的人？”塔里克说：“我是我这条船的人。船叫‘鸥’，阁下要不要记下来？”塔里克心里想，那人要一顶王冠，城里的人要一辆驴车。"
stage = "involve"
window = [[1573, 10, 8], [1573, 11, 30]]
at = "tunis"
speaker = "captain"
mood = "tense"
cast = ["don_juan_austria"]
news = "突尼斯的人说：皇帝的儿子没放一枪就进了城，在城边划了线要修新堡。"
when = []

[tracks.chapters.default]
next = "b07_tunis_back"
effects = []

[[tracks.chapters.choices]]
key = "evacuate"
text = "把逃难的人从城外的海滩运到比塞大"
next = "b07_tunis_back"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "reputation", faction = "hafsid", value = 2 }, { kind = "reputation", faction = "spain", value = -1 }]
reply = "一个老织工上船时只带了一架拆开的织机，死活不肯扔。到了比塞大，他把织机在码头上重新装起来，当天就开始织。"

[[tracks.chapters.choices]]
key = "send_word"
text = "日夜兼程，把消息送到伊斯坦布尔去"
next = "b07_tunis_back"
effects = [{ kind = "reputation", faction = "ottoman", value = 3 }]
reply = "他在金角湾的码头上见到的第一个大人物是乌卢赤·阿里，对方听完只说：“明年夏天。”"

[[tracks.chapters.choices]]
