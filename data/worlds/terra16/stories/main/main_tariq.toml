reply = "带出来的多半是十几岁的侍从，有一个一路抱着国王的一只靴子。到了海边，他把人交给一条丹吉尔的渔船，没收钱。"

[[tracks.chapters.choices]]
key = "find_noel"
text = "在乱军里找那位骑士"
next = "c02_alcazar_echo"
effects = [{ kind = "affinity", person = "noel", value = 8 }, { kind = "flag", flag = "c13_main_tariq_act3" }]
reply = "找到时那位骑士坐在一匹死马旁边，红缎带不知丢在了哪里，只说：“没找到国王。”塔里克解下自己的红腰带，扔了过去。"

# c02：结果回响。无 at。h49_three_kings_sebastian_returns 分叉。
[[tracks.chapters]]
key = "c02_alcazar_echo"
title = "同一天"
text = "回到船上的第一夜。码头上传来传去的，是那一天死了几个王。船员坐在桅杆底下叹气：“三个王，一天。”旁边的人接过去：“老天爷今天倒是不偷懒。”塔里克把琴抱在怀里，一个音也没弹。丹吉尔来的水手说，河湾里捡回来一只镶金的国王靴子，被人卖了三回，每回买主都说是真的。（心里）那个王子问过谁会弹琴。我那天要是在码头上就好了。"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
when = [{ kind = "date", from = [1578, 8, 16] }]

[[tracks.chapters.variants]]
key = "a_malik_lives"
when = [{ kind = "alive", person = "abd_al_malik", value = true }]
