# b04：乌卢赤·阿里召船。
[[tracks.chapters]]
key = "b04_uluch_call"
title = "掰开的饼干"
text = "乌卢赤·阿里要带阿尔及尔的船东去，和苏丹的大舰队会合，对付神圣同盟。他一条船一条船地查桨手的口粮，拿起一块饼干掰开，看里面有没有虫。他自己当过桨手，待桨手不算坏，口粮给足，却从没想过放他们走。他把掰开的饼干一半递给塔里克：“你那条规矩我听说了。我在桨凳上坐过，知道底下的人怎么熬。”塔里克说：“那就换个熬法。”乌卢赤·阿里把另一半扔给了桨凳上的人，说：“海上的规矩就是这样，我也是这么熬出来的。”（心里）他掰饼干的手，先看的也是底下的人。"
speaker = "captain"
mood = "tense"
cast = ["uluc_ali"]
at = "algiers"
when = [{ kind = "date", from = [1571, 4, 1] }]
deadline = [1571, 8, 31]

[tracks.chapters.timeout]
next = "b05_lepanto"
effects = []

