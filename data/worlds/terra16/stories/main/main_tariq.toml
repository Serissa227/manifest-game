reply = "他托一条去塔巴尔卡的珊瑚船捎信，热那亚那边的修会凑了钱。交人那天，女孩的母亲把一枚珊瑚扣子塞给他：“这算不得赎金，只是谢你没把我们带进那个市场。”"

[[tracks.chapters.variants]]
key = "rw_boy"
