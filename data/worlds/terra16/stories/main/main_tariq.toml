# s1 哈姆扎的喜事：父亲的手按不住弦了，儿子替他坐进了船长的院子。
[[tracks.chapters]]
key = "s1_wedding"
title = "新郎是哈姆扎"
text = "哈姆扎娶亲，请塔里克去弹琴。父亲的左手早就按不住弦了，阿尔及尔的喜事上，人人都说加尔纳蒂家的儿子弹得像他爹年轻时候。院子里摆着烤羊，客人们说的是哪个村子、几个人头、巴德斯坦这个月的价。父亲坐在角落里，膝上横着那把格拉纳达的琴，没弹，只听。哈姆扎端着酒过来，冲琴一扬下巴：“弹快的。今晚谁慢，谁罚一碗。”"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1561, 4, 1] }]
at = "algiers"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
deadline = [1562, 12, 31]

[[tracks.chapters.choices]]
key = "play_fast"
text = "照新郎的意思，弹得又快又响"
next = "s2_last_tune"
effects = [{ kind = "cash", value = 300 }, { kind = "reputation", faction = "algiers", value = 1 }, { kind = "flag", flag = "rw_tariq_s_fast" }]
reply = "满院子叫好，哈姆扎把一把银币撒在琴上。塔里克抬眼，看见父亲在角落里低下了头，跟那年在船长家的院子里，他自己低头的样子一模一样。（心里）原来是这么回事。银币他收了，第二天一枚不剩，全交给了胡安修士。"

[[tracks.chapters.choices]]
key = "play_slow"
text = "弹一支格拉纳达的老调，慢慢弹"
next = "s2_last_tune"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_tariq_s_slow" }]
reply = "院子里先是有人嫌慢，起哄要罚他，后来就没人出声了。哈姆扎坐在新娘的帘子外头，听着听着，用卡斯蒂利亚话哼了两句，是他母亲的调子。曲子完了，他走过来，把一袋钱放在琴边：“这袋不是撒的，是给的。”"

[[tracks.chapters.choices]]
key = "hand_to_father"
text = "把琴递给父亲：您来"
next = "s2_last_tune"
effects = [{ kind = "fame", value = 1 }, { kind = "flag", flag = "rw_tariq_s_father" }]
reply = "父亲接过琴，左手按不住，就只拨空弦，一根一根，拨得很慢，像在数数。满院子愣了一会儿，有人笑，哈姆扎瞪过去一眼，就没人笑了。父亲拨完，把琴还给他：“喜事上，不该弹这个。”说完自己先笑了。"

[tracks.chapters.timeout]
next = "s2_last_tune"
effects = []
news = "阿尔及尔的人说：铁匠家的哈姆扎娶亲那晚，请的是加尔纳蒂家的琴，琴声一直响到天亮。"

[[tracks.chapters.variants]]
key = "rw_strung"
when = [{ kind = "flag", flag = "rw_tariq_fifth_strung" }]
