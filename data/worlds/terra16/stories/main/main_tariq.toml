# b03：结果回响。无 at，日期一到就弹出。h32_alpujarras_morisco_autonomy 分叉。锁与钥匙的一幕。
[[tracks.chapters]]
key = "b03_alpujarras_echo"
title = "山里的消息"
text = "起义结束的消息传到了海峡南岸。一个从格拉纳达逃出来的老锁匠找到了塔里克的船，怀里抱着一把从阿尔拜辛老屋门上拆下来的铁锁。房子给了新来的人，门板劈了当柴。钥匙插得进锁，锁上没有门。老锁匠说：“锁是我年轻时配的。门没了，锁不该跟着烧。”塔里克接过锁，嘴里念的是祖母的诗：“丢了钥匙的人，回家只好敲门。”他没笑。（心里）钥匙还在，门没了。我倒成了那只够着钥匙的手。"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
when = [{ kind = "date", from = [1571, 3, 1] }]

[[tracks.chapters.variants]]
key = "a_aisha"
when = [{ kind = "flag", flag = "c7_bond_aisha_promise" }]
text = "起义结束的消息传到了海峡南岸。一个从格拉纳达逃出来的老锁匠找到了塔里克的船，怀里抱着一把从阿尔拜辛老屋门上拆下来的铁锁。房子给了新来的人，门板劈了当柴。钥匙插得进锁，锁上没有门。阿伊莎从非斯寄来那张钥匙的拓片，说一直夹在一本书里，书借出去十几回，拓片没丢。老锁匠说：“锁是我年轻时配的。门没了，锁不该跟着烧。”塔里克接过锁，嘴里念的是祖母的诗：“丢了钥匙的人，回家只好敲门。”他没笑。（心里）钥匙还在，门没了。我倒成了那只够着钥匙的手。"

