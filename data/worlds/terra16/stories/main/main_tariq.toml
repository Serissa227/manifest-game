text = "他快五十了，眉骨上那道小疤成了一道皱纹。阿尔及尔的港口和马拉加的海岸，他闭着眼都能画出来。西班牙人提起他咬牙，阿尔及尔的孩子学他弹琴的样子，被他赎回去的人在两岸的教堂和清真寺里都替他念过名字。“鸥”早就不在船长团的册子上了，那一页上他自己划的墨迹还洇着。船头调琴，一根弦怎么也调不准。母亲在码头上问：“你到底算哪边的人？”塔里克说：“两边的。船在中间。”他拨了一下那根弦，弦音还是偏。码头上的小贩认得他，把烤饼塞过来，说老规矩，不收钱。他不推辞，坐在舱口吃完，才把琴抱起来。（心里）钥匙还在，门变成了很多扇。"

[[tracks.chapters.choices]]
key = "end_corsair"
text = "留在船长团，守着章程里的那一句话"
requires = [{ kind = "flag", flag = "c13_main_tariq_rule_written" }]
hint = "章程里没有你的那一句。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_tariq_done" }, { kind = "flag", flag = "c13_main_tariq_end_corsair" }, { kind = "memory", memory = "mem-main_tariq-c11", title = "两岸" }]
reply = "每有新船长入团，他就把章程翻到那一页，让对方站着念。那一页上有一行字，墨色比别处新，是他当年写下的。每年秋天他还去一趟防波堤，给新来的船长发一本抄好的章程，封皮是他用旧帆布自己缝的。有个年轻人念错了一个字，他没纠正，说：“念错了也算数，只要你记得为什么念。”厅里的老桨手听见这句，有人咧嘴笑了，笑完去添了一碗茶。那一页他从来不让别人替他翻。"

[[tracks.chapters.choices]]
key = "end_ransomer"
text = "收起弯刀，在两岸之间做赎人的买卖"
requires = [{ kind = "flag", flag = "c13_main_tariq_first_contract" }]
hint = "你还没替谁谈成过一张赎身契。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_tariq_done" }, { kind = "flag", flag = "c13_main_tariq_end_ransomer" }, { kind = "memory", memory = "mem-main_tariq-c11", title = "两岸" }]
reply = "他在防波堤边租了一间小屋，门上不挂招牌。两岸来的信堆在桌上，他先问人叫什么、家在哪个村，学的是胡安修士的样子。信里若是提到谁被掳走了，他就在名册上添一行，添完再去找船。有一回他替一个热那亚织工谈下了赎价，织工在码头上哭了半天，说不出一句道谢的话。他说不必谢，价钱是他一个一个问出来的。夜里他把名册摊在灯下，一行一行对，对到第三遍才肯吹灯。有人劝他多收一点，他说：问不出来的那一半，一文也不加。"

[[tracks.chapters.choices]]
key = "end_free"
text = "谁的旗也不挂，带着“鸥”往没人管的海上去"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_tariq_done" }, { kind = "flag", flag = "c13_main_tariq_end_free" }, { kind = "memory", memory = "mem-main_tariq-c11", title = "两岸" }]
reply = "出港那天他在船头弹完一整支曲子，最后一句是祖母的诗：“歌唱到最后一句，人就到了门口。”船出了防波堤，他把琴换到左手，右手拨弦，一声一声往西数，数到第七声，岸上那片白墙已经看不清了。船舷上没有旗，船尾没有刻名字，只有一只鸥的影子在水里跟了一程又一程。琴弦松了一根，他没停，弹完最后一句才去拧。防波堤上的人等他回头，他没回头。"

