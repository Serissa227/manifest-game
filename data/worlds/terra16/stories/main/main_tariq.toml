# a05：第一张赎身契。限期章，目标是手里留着保银（只查不扣）。
[[tracks.chapters]]
key = "a05_first_contract"
title = "第一张赎身契"
text = "帕夏府的院子里，一张石桌上摊着赎身契，左栏阿拉伯文，右栏卡斯蒂利亚文。伯爵的儿子锁在巴尼奥里，三一会的胡安修士带着他那本磨破的名册来了。修士先不谈价：“船长，先别说价——他叫什么，家在哪个村？”哈桑帕夏在一旁喝果子露：“近卫军要饷，船长要船。你要什么？”赎金之外还有一串零碎：帕夏的抽成、港税、自由证、通事费，修士一项一项念。（心里）原来一个人的价钱，有一半是别人加上去的。"
