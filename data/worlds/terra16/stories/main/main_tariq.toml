# a06：凯比尔港城头的面包篮。费尔南多第一次出现（变体，别人叫他）。
[[tracks.chapters]]
key = "a06_oran"
title = "城头上的面包篮"
text = "春夜，哈桑帕夏的大军围着奥兰和凯比尔港。城里断粮，守军的家眷夜里从城头放下绳子，吊着篮子向城外的小贩买面包，谁都知道，谁都不说。塔里克的船泊在城下的小湾里，船员听见城头上有人用格拉纳达口音唱一支老曲子。哈桑在营火边下令：“天亮以前，我要看见凯比尔港的旗子倒下来。”城头上的女人压低了声音：“篮子里有钱，别让当官的看见。”那支曲子停了。（心里）这曲子我祖母也会唱，她唱的是另一段。"
stage = "involve"
window = [[1563, 4, 1], [1563, 6, 15]]
at = "oran"
speaker = "captain"
mood = "tense"
night = true
cast = ["hasan_pasha"]
news = "奥兰的人说：土耳其人六月退了，城头上那些夜里吊篮子的女人，到底熬过了这一春。"
when = []

[tracks.chapters.default]
next = "a07_malta_call"
effects = []

[[tracks.chapters.variants]]
key = "a_contract"
when = [{ kind = "flag", flag = "c13_main_tariq_first_contract" }]
text = "春夜，哈桑帕夏的大军围着奥兰和凯比尔港。城里断粮，守军的家眷夜里从城头放下绳子，吊着篮子向城外的小贩买面包，谁都知道，谁都不说。塔里克的船泊在城下的小湾里。城头上有人认出了“鸥”，隔着护城沟喊：“费尔南多！你又来谈价了？”听说守在城头上的，就是当年他替人谈过赎价的那位伯爵的儿子。哈桑在营火边下令：“天亮以前，我要看见凯比尔港的旗子倒下来。”那支用格拉纳达口音唱的老曲子停了。（心里）这曲子我祖母也会唱，她唱的是另一段。"

