text = "九月，帕夏任满要回伊斯坦布尔，塞万提斯已经被锁上了帕夏的船。三一会的赎金在起锚前一刻凑齐。胡安修士抱着钱袋一路小跑上了跳板，一个一个地念名字：“米格尔——念到了，下来！”塞万提斯在跳板上回头，冲“鸥”的方向举了举那只残手。留在岸上的葡萄牙教士安东尼奥·德·索萨攥着他写了一半的书，朝船上喊：“他走了，我的书里又少一个能讲故事的人。”塔里克在码头上看着。（心里）他被抓了五年，跑了四回，最后是被钱从桨凳上赎下来的。"

# c04：潜水人的画。发放 divers_witness。葡萄牙人在打听这张图。
[[tracks.chapters]]
key = "c04_diver"
title = "潜水人的画"
text = "冬天，一个老潜水人找上“鸥”，怀里揣着一张羊皮。羊皮上画着城东海底的礁、沙，还有压着东西的船骨。他年轻时下水捞过皇帝船队沉下的炮和锚。阿尔及尔人都讲那年的老话：风暴是城里的圣人拿手杖击了海。码头上还有个葡萄牙人在打听这张图，说是替基督骑士团问的。“那年风暴，海底下铺满了皇帝的船。我捞过炮，捞过锚，还摸着过一朵石头做的玫瑰。”老人说完，把羊皮往桌上一放。葡萄牙人说：“开个价。骑士团出得起。”（心里）皇帝丢在我们门口的东西，倒要我们自己下去看。"
speaker = "captain"
mood = "mystic"
cast = ["tariq"]
at = "algiers"
when = [{ kind = "date", from = [1580, 11, 1] }]
deadline = [1581, 4, 30]

[tracks.chapters.timeout]
next = "c05_wreck"
effects = []

[[tracks.chapters.variants]]
key = "a_yaqub"
when = [{ kind = "flag", flag = "c7_bond_yaqub_landing_friend" }]
