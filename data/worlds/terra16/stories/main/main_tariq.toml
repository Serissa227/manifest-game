# c11：终章。两岸。三个落点，恰好一面。
[[tracks.chapters]]
key = "c11_epilogue"
title = "两岸"
text = "他快五十了，眉骨上那道小疤成了一道皱纹。阿尔及尔的港口和马拉加的海岸，他闭着眼都能画出来。西班牙人提起他咬牙，阿尔及尔的孩子学他弹琴的样子，被他赎回去的人在两岸的教堂和清真寺里都替他念过名字。船头调琴，一根弦怎么也调不准。母亲在码头上问：“你到底算哪边的人？”塔里克说：“两边的。船在中间。”他拨了一下那根弦，弦音还是偏。码头上的小贩认得他，把烤饼塞过来，说老规矩，不收钱。他不推辞，坐在舱口吃完，才把琴抱起来。（心里）钥匙还在，门变成了很多扇。"
speaker = "captain"
mood = "tender"
cast = ["tariq"]
when = [{ kind = "date", from = [1589, 1, 1] }]

# 补章 at3 把钥匙挂在井边或交给伊斯梅妮的局（c13_main_tariq_key_left，只在穿过去的局里设）：a0 排在最前，正文照抄 a_crossed，只换掉最后一句。
