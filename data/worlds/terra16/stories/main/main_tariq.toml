# b07：奥斯曼收回拉格莱特与新堡。阿卜杜·马利克第一次出现。
[[tracks.chapters]]
key = "b07_tunis_back"
title = "拉格莱特"
text = "夏天，伊斯坦布尔的大舰队来了，乌卢赤·阿里也在。壕沟一直挖到拉格莱特的墙根，炮响了一个多月。八月拉格莱特换了旗，九月新堡也丢了。那个当年坐船逃到阿尔及尔的王子，已经三十出头了，在奥斯曼的营里打仗，认出了塔里克的琴。阿卜杜·马利克说：“你还弹那把琴？我在阿尔及尔的码头上听过。”壕沟边上蹲满了西班牙伤兵，近卫军的小头目在挑能卖的：“能走的绑起来，不能走的——你要？给钱。”塔里克心里想，壕沟里的人，一半前天还在修墙。"
stage = "involve"
window = [[1574, 7, 15], [1574, 9, 15]]
at = "tunis"
speaker = "captain"
mood = "tense"
cast = ["uluc_ali", "abd_al_malik"]
news = "突尼斯的人说：那年夏天拉格莱特的炮响了一个多月，壕沟边上蹲满了等人认领的伤兵。"
when = []

[tracks.chapters.default]
next = "b08_cervantes"
effects = []

[[tracks.chapters.choices]]
