# b05：勒班陀。事件现场，default 照史实。
[[tracks.chapters]]
key = "b05_lepanto"
title = "勒班陀"
text = "科孚东南，帕特雷湾口，十月七日的早上海面平得像油。乌卢赤·阿里在奥斯曼的左翼，绕开对面的船，冲进去夺了马耳他骑士团旗舰的旗。中军先垮了，烟压在水面上。两边船上锁着的桨手，都有人挣断了链子。乌卢赤·阿里隔着船喊：“跟上！今天能活着回去的船，明年就是一支舰队。”“鸥”离一条正在下沉的大船只有一箭远，桨凳上的人在喊：“斧头！谁有斧头！”塔里克心里想，桨凳上锁着的人，喊救命用的都是一个词。"
stage = "involve"
window = [[1571, 9, 1], [1571, 10, 15]]
at = "corfu"
speaker = "captain"
mood = "tense"
cast = ["uluc_ali"]
news = "科孚的渔夫说：大仗那天，帕特雷湾口漂着的桨，比秋天的鱼还多。"
when = []

[tracks.chapters.default]
next = "b06_tunis_lost"
effects = []

[[tracks.chapters.variants]]
key = "a_broke"
when = [{ kind = "flag", flag = "c13_main_tariq_broke_rule" }]
