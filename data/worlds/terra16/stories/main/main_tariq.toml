# h1 两条船：头一年秋天，防波堤两头各靠一条加列奥特。
[[tracks.chapters]]
key = "h1_two_ships"
title = "防波堤两头"
text = "秋天，“鸥”回港那天，防波堤另一头也靠了一条加列奥特，船身刷着新漆，甲板上拴着一串人。站在船头点数的是哈姆扎，耳朵上那只银环在太阳底下一闪一闪。他如今是那条船的副手，船专做转手的买卖：从得土安和萨累的地牢里买人，运到阿尔及尔的巴德斯坦，一转手就是一成半的利。他跳上码头，先抱了塔里克一下，又往“鸥”的舱口瞥了一眼：“听说你头一回出海就碰上了舱里有人。放了？”"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1557, 10, 20] }]
at = "algiers"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
deadline = [1558, 6, 30]

[[tracks.chapters.choices]]
key = "see_hold"
text = "跟他上船，去看他的舱底"
next = "h2_at_cost"
effects = [{ kind = "growth", attr = "perception", value = 150 }, { kind = "flag", flag = "rw_tariq_h_saw_hold" }]
reply = "舱底比“鸥”的深，一盏灯挂在梁上，三十几个人挤着坐，脚上的铁环里圈都垫着旧布。哈姆扎用卡斯蒂利亚话跟他们说船到了，说得很软。上了甲板，他换回阿拉伯话：“你看，我待他们不坏。”（心里）他说的是真话。所以才难受。"

[[tracks.chapters.choices]]
key = "drink"
text = "跟他去鱼市口喝一碗"
next = "h2_at_cost"
effects = [{ kind = "reputation", faction = "algiers", value = 1 }, { kind = "flag", flag = "rw_tariq_h_drank" }]
reply = "两人在哈菲莎的饼摊边坐到半夜。哈菲莎给一人塞了一块饼，问哈姆扎什么时候还她那只烤鱼。哈姆扎掏出一枚银币拍在案板上。哈菲莎没收，把银币推回去：“你的钱，我认得是从哪儿来的。饼算我请。”哈姆扎笑了，笑完把那枚银币一直攥到散场。"

[[tracks.chapters.choices]]
key = "go_back"
text = "什么也不说，回自己船上"
next = "h2_at_cost"
effects = [{ kind = "growth", attr = "resolve", value = 100 }]
reply = "他拍拍哈姆扎的肩，说船上还有活，转身回了“鸥”。夜里他坐在船头调琴，防波堤那一头的船上也亮着一盏灯，灯底下有人在用卡斯蒂利亚话唱歌，唱得很轻，像哄孩子睡觉。他听出来是哈姆扎的嗓子。"

[tracks.chapters.timeout]
next = "h2_at_cost"
effects = []
news = "阿尔及尔的码头上说：铁匠家的哈姆扎跟的那条船，这一年往巴德斯坦送了三船人。"

[[tracks.chapters.variants]]
key = "rw_boatrule"
when = [{ kind = "flag", flag = "rw_tariq_hamza_boat_rule" }, { kind = "flag", flag = "c13_main_tariq_broke_rule", value = false }, { kind = "flag", flag = "c13_main_tariq_first_ransom_seed", value = false }]
text = "秋天，“鸥”回港那天，防波堤另一头也靠了一条加列奥特，船身刷着新漆，甲板上拴着一串人。站在船头点数的是哈姆扎，耳朵上那只银环在太阳底下一闪一闪。他如今是那条船的副手，船专做转手的买卖：从得土安和萨累的地牢里买人，运到阿尔及尔的巴德斯坦，一转手就是一成半的利。他跳上码头，先抱了塔里克一下：“你刻歪的那只木船，在我舱里摆着呢。”又往“鸥”的舱口瞥了一眼，“听说你头一回出海就碰上了舱里有人。照你刻的那行字，放了？”"

[[tracks.chapters.variants]]
key = "rw_broke"
when = [{ kind = "flag", flag = "c13_main_tariq_broke_rule" }]
text = "秋天，“鸥”回港那天，防波堤另一头也靠了一条加列奥特，船身刷着新漆，甲板上拴着一串人。站在船头点数的是哈姆扎，耳朵上那只银环在太阳底下一闪一闪。他如今是那条船的副手，船专做转手的买卖：从得土安和萨累的地牢里买人，运到阿尔及尔的巴德斯坦，一转手就是一成半的利。他跳上码头，先抱了塔里克一下，咧嘴一笑：“听说你那十一个，在巴德斯坦卖了好价。欢迎回家。”（心里）他是真心替我高兴。"

[[tracks.chapters.variants]]
key = "rw_seed"
when = [{ kind = "flag", flag = "c13_main_tariq_first_ransom_seed" }, { kind = "flag", flag = "c13_main_tariq_broke_rule", value = false }]
text = "秋天，“鸥”回港那天，防波堤另一头也靠了一条加列奥特，船身刷着新漆，甲板上拴着一串人。站在船头点数的是哈姆扎，耳朵上那只银环在太阳底下一闪一闪。他如今是那条船的副手，船专做转手的买卖：从得土安和萨累的地牢里买人，运到阿尔及尔的巴德斯坦，一转手就是一成半的利。他跳上码头，先抱了塔里克一下：“听说你把一船人送回了热那亚，换了赎金。”他想了想，“不坏。比卖少挣一半，可修士欠你一个情。”"

# h2 照本钱卖给你：他要跟塔里克做“一笔买卖的两头”。
[[tracks.chapters]]
key = "h2_at_cost"
title = "一笔买卖的两头"
text = "胡安修士的名册越来越厚，阿尔及尔的人都知道“鸥”的船长替修会谈赎价。哈姆扎找上门来，开门见山：他的舱里常有“好货”，有家底的，有修会肯出钱的，他可以先告诉塔里克，照本钱加一成卖给他，塔里克转手跟修士谈，谈多少都归塔里克。“你要救人，我要卖人，咱俩做的是一笔买卖的两头。”他把一张纸推过来，“两头都不吃亏。”"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1559, 1, 15] }]
at = "algiers"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
deadline = [1559, 12, 31]

[[tracks.chapters.choices]]
key = "partner"
text = "答应：只做有人肯赎的"
next = "h3_keel"
effects = [{ kind = "cash", value = 800 }, { kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_tariq_h_partner" }]
reply = "两人在那张纸上按了手印，纸上没写一个“人”字，只写“货”。头一年，经这条路赎回去的有十九个。（心里）十九个。哈姆扎的船这一年跑了九趟。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不答应：这本账我不跟你分"
next = "h3_keel"
effects = [{ kind = "growth", attr = "honor", value = 150 }, { kind = "flag", flag = "rw_tariq_h_refused" }]
reply = "哈姆扎没生气，把纸折起来揣回怀里：“你不跟我分，修士就跟别人分，账还是这本账。”走到门口他又回头，“你不卖人，我记着。可你得买，不买，人就烂在我舱里。”"

[[tracks.chapters.choices]]
key = "children"
text = "只答应一样：舱里有孩子，先告诉我"
next = "h3_keel"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_tariq_h_children" }]
reply = "哈姆扎想了想，伸出手：“孩子便宜，修士爱赎。行。”他说得像在谈一桶油。从那以后，他的船每回靠岸，总有个小厮先跑到“鸥”这边来报一个数：三个，五个，一个。"

[tracks.chapters.timeout]
next = "h3_keel"
effects = []
news = "阿尔及尔的书记们说：铁匠家的哈姆扎跟修士们混熟了，修会的赎单上，常有他船上的人。"

[[tracks.chapters.variants]]
key = "rw_tenth"
when = [{ kind = "flag", flag = "rw_tariq_hamza_tenth_struck" }]
text = "胡安修士的名册越来越厚，阿尔及尔的人都知道“鸥”的船长替修会谈赎价。哈姆扎找上门来，开门见山：他的舱里常有“好货”，有家底的，有修会肯出钱的，他可以先告诉塔里克，照本钱加一成卖给他，塔里克转手跟修士谈，谈多少都归塔里克。“那一成我先写在纸上，”他笑，“省得你又在信里替我划掉。”他把那张纸推过来，“你要救人，我要卖人，咱俩做的是一笔买卖的两头。两头都不吃亏。”"

[[tracks.chapters.variants]]
key = "rw_fee"
when = [{ kind = "flag", flag = "rw_tariq_hamza_fee_taken" }]
text = "胡安修士的名册越来越厚，阿尔及尔的人都知道“鸥”的船长替修会谈赎价。哈姆扎找上门来，开门见山：他的舱里常有“好货”，有家底的，有修会肯出钱的，他可以先告诉塔里克，照本钱加一成卖给他，塔里克转手跟修士谈，谈多少都归塔里克。“你在非斯替我写过一封赎信，润笔收得爽快，”他说，“这回也一样，咱俩做的是一笔买卖的两头。”他把一张纸推过来，“两头都不吃亏。”"

# h3 船底的名字：奥兰以后，船归了哈姆扎。读养成期木船上刻的那一块。
[[tracks.chapters]]
key = "h3_keel"
title = "龙骨边的木板"
text = "奥兰那一仗以后，哈姆扎跟的那位船长死在了凯比尔港城下，船归了哈姆扎。重漆下水那天，他请塔里克来看。船头没写名字——阿尔及尔的船，名字是船长的名声，哈姆扎说他还没有名声。他把塔里克拉到舱底，指给他看龙骨边上一块新刨的木板，上面刻着两行字，一行是他母亲的名字，卡斯蒂利亚字，一行是他自己的。“这是我的船，”他说，“底下这个女人，一辈子也不会知道她坐在一条什么样的船上。”"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1563, 7, 1] }]
at = "algiers"
speaker = "captain"
mood = "tender"
cast = ["tariq"]
deadline = [1564, 12, 31]

[[tracks.chapters.choices]]
key = "touch_names"
text = "伸手摸那两行字"
next = "h4_dates"
effects = [{ kind = "growth", attr = "sensibility", value = 100 }]
reply = "木板还带着刨花的香，字刻得很深，刀口一点也没有犹豫。塔里克摸到第二行，哈姆扎在后面说：“别摸了，摸多了要亮，亮了就有人问。”（心里）他刻得这么深，是怕海水，还是怕自己哪天想磨掉它？"

[[tracks.chapters.choices]]
key = "ask_mother_news"
text = "问他：你母亲还在塔里法吗"
next = "h4_dates"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_tariq_h_dates" }]
reply = "还在，老了，眼睛不行了。每年修士的船回去，他托人捎一包阿尔及尔的蜜枣。“她不知道是我捎的。我叫捎的人说，是一个被赎回去的人托的。”他说完自己笑了，“也不算撒谎。她被赎回去了，我托的。”"

[[tracks.chapters.choices]]
key = "joke_sink"
text = "开个玩笑：船底刻名字，沉了才有人看见"
next = "h4_dates"
effects = [{ kind = "fame", value = 1 }]
reply = "哈姆扎大笑，笑完说：“沉了才好。沉了，她就跟我在一块儿了。”他拍拍龙骨，像拍一匹马，“可我舍不得沉。这船跑一趟，够我在城北买一间带井的院子。”"

[tracks.chapters.timeout]
next = "h4_dates"
effects = []
news = "阿尔及尔的人说：铁匠家的哈姆扎有了自己的船，船头不写名字，船长团的册子上只记了一个“哈姆扎的船”。"

[[tracks.chapters.variants]]
key = "rw_named"
when = [{ kind = "flag", flag = "rw_tariq_hamza_boat_named" }]
text = "奥兰那一仗以后，哈姆扎跟的那位船长死在了凯比尔港城下，船归了哈姆扎。重漆下水那天，他请塔里克来看。船头没写名字——阿尔及尔的船，名字是船长的名声，哈姆扎说他还没有名声。他把塔里克拉到舱底，指给他看龙骨边上一块新刨的木板，上面刻着三行字：他母亲的名字，他自己的，第三行是“塔里克”，字形跟那年木船底下刻的一模一样，是照着描的。“你刻在我木船上的，我搬到真船上来了。”他说，“你的名字在我船底下，你的人可不在我舱里。”"

[[tracks.chapters.variants]]
key = "rw_rule"
when = [{ kind = "flag", flag = "rw_tariq_hamza_boat_rule" }]
text = "奥兰那一仗以后，哈姆扎跟的那位船长死在了凯比尔港城下，船归了哈姆扎。重漆下水那天，他请塔里克来看。船头没写名字——阿尔及尔的船，名字是船长的名声，哈姆扎说他还没有名声。他把塔里克拉到舱底，指给他看龙骨边上一块新刨的木板，上面刻着三行字：他母亲的名字，他自己的，第三行刻得歪歪扭扭，最后一个字挤到了板边上：船上的人，不卖。“你刻在木船上的，我照着抄了。”他说，“抄下来，不照着做。我就是想每回下舱，都看它一眼。”"

[[tracks.chapters.variants]]
key = "rw_blank"
when = [{ kind = "flag", flag = "rw_tariq_hamza_boat_blank" }]
text = "奥兰那一仗以后，哈姆扎跟的那位船长死在了凯比尔港城下，船归了哈姆扎。重漆下水那天，他请塔里克来看。船头没写名字——阿尔及尔的船，名字是船长的名声，哈姆扎说他还没有名声。他把塔里克拉到舱底，指给他看龙骨边上一块新刨的木板，上面刻着两行字，一行是他母亲的名字，一行是他自己的，下面还空着一块，跟那只木船上空着的一样大。“你那年说，等你的船出过海再刻。”他说，“你的船出过海了，你还是不刻？”"

# h4 塔里法的蜜枣：母亲死了，他去不了塔里法。诺埃尔（不用代词）。
[[tracks.chapters]]
key = "h4_dates"
title = "城墙底下的新坟"
text = "春天，修士的船从塔里法回来，捎来一句口信：哈姆扎的母亲死了。阿尔及尔的船长到了塔里法上岸，是要吊死的，哈姆扎去不了。他找到塔里克，手里捧着一只连夜刻出来的小木船，跟小时候在铁匠铺后院刻的那一只一个样子，船底刻着她的名字。“你那位骑士朋友在塔里法有门路，”他说，“把这只船放到她坟上。不用说是谁的。”"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1567, 5, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1568, 10, 31]

[[tracks.chapters.choices]]
key = "ask_noel"
text = "写信托诺埃尔"
next = "h5_full_hold"
effects = [{ kind = "affinity", person = "noel", value = 3 }, { kind = "flag", flag = "rw_tariq_h_noel_boat" }]
reply = "信寄出去，回信隔了半年才来，是诺埃尔的字，一句寒暄也没有：木船放在了城墙底下一座新坟上，坟前已经有人供着一小包蜜枣。“塔里法的人问这是谁家的船，我说海上漂来的。”塔里克把回信念给哈姆扎听。哈姆扎听完什么也没说，去防波堤上坐了一夜。"

[[tracks.chapters.choices]]
key = "go_tarifa"
text = "跟修士的赎俘船去一趟塔里法"
next = "h5_full_hold"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_tariq_h_went_tarifa" }]
reply = "修士劝不住，替他写了一张保书，写他是赎俘船上的帮工。他在塔里法的码头上站了半天，没敢进城，把木船交给城门口卖鱼的妇人，给了她一枚银币，请她放到城墙底下那座新坟上。回程，哈姆扎在防波堤上等他，第一句话问的是：“她坟上长草了没有？”"

[[tracks.chapters.choices]]
key = "refuse_boat"
text = "不去：那边谁也不欠你"
next = "h5_full_hold"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_tariq_h_boat_sea" }]
reply = "哈姆扎把木船收回怀里，点点头：“对，谁也不欠谁。”第二年开春，有人看见他站在防波堤尽头，把那只木船放进了海里。风是往北吹的，他一直看着它漂，漂到看不见。"

[tracks.chapters.timeout]
next = "h5_full_hold"
effects = []
news = "阿尔及尔的码头上说：哈姆扎的船那一季没出海，船长天天坐在防波堤上刻东西。"

[[tracks.chapters.variants]]
key = "rw_dates"
when = [{ kind = "flag", flag = "rw_tariq_h_dates" }]
text = "春天，修士的船从塔里法回来，捎来一句口信：哈姆扎的母亲死了。捎信的人还说，那一年的蜜枣她吃到了最后一包，临走前问过一回，捎蜜枣的那个被赎回来的人，是不是长得很高。阿尔及尔的船长到了塔里法上岸，是要吊死的，哈姆扎去不了。他找到塔里克，手里捧着一只连夜刻出来的小木船，跟小时候刻的那只一个样子：“你那位骑士朋友在塔里法有门路。把这只船放到她坟上。不用说是谁的。”"

# h5 满的舱：这条线的刀。“你又能救得了谁”由他换成自己的说法。
[[tracks.chapters]]
key = "h5_full_hold"
title = "满的舱"
text = "那年夏天，哈姆扎的船从西班牙海边回来，舱里一百零七个人，一个渔村差不多都在里头。塔里克带着钱上了他的船，要买那几个孩子和她们的母亲。哈姆扎坐在舱口，听他报完数，没还价，先问了一句：“你这袋钱，是赎谁剩下的？”他掰着指头算：“你去年赎走十一个，我今年就多跑一趟。你今年买走二十个，我明年再多跑一趟。塔里克，这一舱人，是你从海上叫来的。你倒说说，你救下的是谁？”"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1576, 5, 1] }]
at = "algiers"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
deadline = [1577, 12, 31]

[[tracks.chapters.choices]]
key = "buy_anyway"
text = "照样买，一个一个买"
requires = [{ kind = "cash", ge = 800 }]
hint = "这点钱，连舱口那个最小的孩子都买不走。"
next = "h6_oar"
effects = [{ kind = "cash", value = -800 }, { kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_tariq_h_bought" }]
reply = "他把钱一袋一袋倒在舱板上，买下了十四个，不够买第十五个。哈姆扎替他数完，把空袋子扔还给他：“下回多带点。”（心里）他说得对，也不对。对的那一半，我一辈子还不清；不对的那一半，是这十四个人今晚睡在岸上。"

[[tracks.chapters.choices]]
key = "burn_words"
text = "回他：那我就烧了你的船"
next = "h6_oar"
effects = [{ kind = "reputation", faction = "algiers", value = -1 }, { kind = "flag", flag = "rw_tariq_h_burn_words" }]
reply = "哈姆扎笑了：“烧吧。明年巴德斯坦的价涨一成，跑这一趟的船多三条。”他站起来拍拍塔里克的肩，“这座城你救不了。你救得了的，是你自己晚上睡得着觉。”（心里）他没说错，我今晚睡得着。我恨的就是这一样。"

[[tracks.chapters.choices]]
key = "walk_away"
text = "转身下船"
next = "h6_oar"
effects = [{ kind = "growth", attr = "resolve", value = 150 }, { kind = "flag", flag = "rw_tariq_h_walked" }]
reply = "他没买，下了船。走到防波堤一半回头，哈姆扎站在船舷边上，没喊他。那天傍晚巴德斯坦开了市，一百零七个人，叫价叫了一整夜。他在“鸥”上听了一整夜，琴就搁在膝上，一根弦也没碰。"

[tracks.chapters.timeout]
next = "h6_oar"
effects = []
news = "阿尔及尔的人说：那年夏天，哈姆扎的船一趟带回了一百多个人，巴德斯坦开了一夜的市。"

[[tracks.chapters.variants]]
key = "rw_partner"
when = [{ kind = "flag", flag = "rw_tariq_h_partner" }]
text = "那年夏天，哈姆扎的船从西班牙海边回来，舱里一百零七个人，一个渔村差不多都在里头。塔里克带着钱上了他的船，要买那几个孩子和她们的母亲。哈姆扎坐在舱口，把当年两人按过手印的那张纸抖开，纸上没有一个“人”字。“你翻翻这本账，”他说，“你赎走一个，我的船多跑一趟；你赎走十九个，我多跑九趟。这十几年，我的船是你喂大的。塔里克，这一舱人，是你从海上叫来的。你倒说说，你救下的是谁？”"

[[tracks.chapters.variants]]
key = "rw_children"
when = [{ kind = "flag", flag = "rw_tariq_h_children" }]
text = "那年夏天，哈姆扎的船从西班牙海边回来，舱里一百零七个人，一个渔村差不多都在里头。塔里克带着钱上了他的船，要买那几个孩子和她们的母亲。哈姆扎坐在舱口：“孩子的数，我还是头一个报给你的，跟那年说好的一样。”他掰着指头算：“你买走一个孩子，我下回就多带两个。孩子便宜，修士爱赎，船长们都知道是谁在买。塔里克，这一舱人，是你从海上叫来的。你倒说说，你救下的是谁？”"

[[tracks.chapters.variants]]
key = "rw_refused"
when = [{ kind = "flag", flag = "rw_tariq_h_refused" }]
text = "那年夏天，哈姆扎的船从西班牙海边回来，舱里一百零七个人，一个渔村差不多都在里头。塔里克带着钱上了他的船，要买那几个孩子和她们的母亲。哈姆扎坐在舱口，听他报完数，笑了：“那年你不肯跟我分账，说得多干净。如今还不是拿着钱上我的船？”他掰着指头算：“你不跟我分，修士跟别人分，船照样跑。塔里克，这一舱人，是你们这些赎人的从海上叫来的。你倒说说，你救下的是谁？”"

# h6 桨凳上的人：他自己有了一个数。救得了救不了，由选择定。诺埃尔不用代词。
[[tracks.chapters]]
key = "h6_oar"
title = "第三排的桨凳"
text = "消息是胡安修士带回来的：哈姆扎的船在撒丁岛外海被西班牙的桨帆船截住了，船上的人分了，哈姆扎锁在一条那不勒斯桨帆船的第三排桨凳上——当年他做自由桨手，坐的也是第三排。修士说，那边的人知道他是阿尔及尔的船长，开的价不低；也可以换，拿一个那边要的人来换。（心里）他这辈子，到头来也有了一个数。"
when = [{ kind = "flag", flag = "c13_main_tariq_act3" }, { kind = "date", from = [1580, 12, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1582, 5, 31]

[[tracks.chapters.choices]]
key = "ransom_him"
text = "托修士出钱赎他"
requires = [{ kind = "cash", ge = 1500 }]
hint = "一个阿尔及尔船长的价，你手上的钱还够不着。"
next = "h7_third_line"
effects = [{ kind = "cash", value = -1500 }, { kind = "reputation", faction = "algiers", value = 2 }, { kind = "flag", flag = "rw_tariq_h_ransomed" }]
reply = "钱是塔里克出的，赎单上写的是“阿尔及尔的哈姆扎，铁匠之子”。修士替他压下来一截，说那边的书记认得“鸥”这个名字。第二年开春，哈姆扎回来了，左手少了三根指头，是桨柄砸的。他在码头上看见塔里克，第一句话是：“我值多少？”塔里克报了个数。他点点头：“不贵。”"

[[tracks.chapters.choices]]
key = "ask_noel_way"
text = "求诺埃尔在那边走门路"
next = "h7_third_line"
effects = [{ kind = "affinity", person = "noel", value = 2 }, { kind = "flag", flag = "rw_tariq_h_noel_tried" }]
reply = "诺埃尔回信说，门路找着了，那条船的船长肯放人，条件是阿尔及尔放一个西班牙老兵回去。两边来回谈了一年，老兵病死在巴尼奥里，哈姆扎还锁在桨凳上。那位骑士最后一封信只有一句：“对不住，这一个我没赎成。”（心里）救不了的人，就是救不了。"

[[tracks.chapters.choices]]
key = "let_be"
text = "不赎：他的账，他自己认"
next = "h7_third_line"
effects = [{ kind = "growth", attr = "resolve", value = 150 }, { kind = "flag", flag = "rw_tariq_h_left" }]
reply = "他没去找修士。夜里他把哈姆扎早年刻给他的木船拿出来，翻过来看船底的名字，看了很久。（心里）他说过，我救得了的，只有自己晚上睡得着。今晚我睡不着。"

[tracks.chapters.timeout]
next = "h7_third_line"
effects = [{ kind = "flag", flag = "rw_tariq_h_left" }]
news = "阿尔及尔的人说：哈姆扎的船再没回来，船长团的册子上，“哈姆扎的船”那一行被人划掉了。"

# h7 船底的第三行：终章。赎回来的局换变体。
[[tracks.chapters]]
key = "h7_third_line"
title = "船底的第三行"
text = "一个从那不勒斯赎回来的阿尔及尔老桨手找到“鸥”，交给塔里克一只木船，比巴掌还小，是拿一块船板在桨凳上刻的，刀是偷藏的一片铁。老桨手说，第三排那个阿尔及尔人去年冬天死了，死前一直在刻这只船，刻完托他带回来，“交给鸥的船长”。船底刻着三行，刀痕很浅：一个女人的名字，哈姆扎，第三行是塔里克。"
when = [{ kind = "flag", flag = "c13_main_tariq_act3" }, { kind = "date", from = [1584, 3, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["tariq"]

[[tracks.chapters.choices]]
key = "hang_beam"
text = "把木船挂在舱梁下，钥匙旁边"
next = "done"
effects = [{ kind = "growth", attr = "sensibility", value = 200 }, { kind = "flag", flag = "rw_tariq_hamza_end_beam" }]
reply = "他把木船拿丝线吊在舱梁底下，挨着那把钥匙。船一晃，两样东西就碰一下，叮的一声，很轻。船员们起初嫌吵，后来夜里听不见这一声，反倒睡不着。"

[[tracks.chapters.choices]]
key = "to_sea"
text = "把木船放进海里，让它往北漂"
next = "done"
effects = [{ kind = "growth", attr = "resolve", value = 200 }, { kind = "flag", flag = "rw_tariq_hamza_end_sea" }]
reply = "他走到防波堤尽头，把木船放进水里。那天的风往北吹，木船打了两个转，朝塔里法那边去了。（心里）他母亲在那边城墙底下，他在船底下。三个名字，总有一个到得了岸。"

[[tracks.chapters.choices]]
key = "give_child"
text = "送给码头上一个刚被赎回来的孩子"
next = "done"
effects = [{ kind = "fame", value = 2 }, { kind = "flag", flag = "rw_tariq_hamza_end_child" }]
reply = "码头上蹲着一个刚从巴尼奥里赎出来的西班牙孩子，等修士的船。塔里克把木船塞到他手里，他翻过来，看见船底的字，问刻的是谁。塔里克说，是一个会说两种话的人。孩子把木船揣进怀里，上了船，一路没松手。"

[[tracks.chapters.variants]]
key = "rw_home"
when = [{ kind = "flag", flag = "rw_tariq_h_ransomed" }]
text = "哈姆扎回来以后，再没上过船。他少了三根指头，握不住刀，也握不住桨，就坐在防波堤上刻木船，一只卖给孩子们一枚铜钱。有的孩子是阿尔及尔的，有的是巴尼奥里等着被赎的。那年冬天他病倒了，临走前托人把一只木船送到“鸥”上，船底刻着三行：一个女人的名字，哈姆扎，第三行是塔里克。他托人带了一句话：“这只不卖。账我清了。”"

