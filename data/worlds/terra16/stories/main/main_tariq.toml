# ───────────── 旁轨（剧情增写 11-11，Claude）：山里的钥匙（祖母宰娜卜，1567 年的敕令到她死后） ─────────────
# 母本：伦迪《安达卢斯挽歌》（数丢了的城）只作底色；骨架是“回家的人回不到家”——1568 年阿尔普哈拉斯起事，往下逃的人挤满海滩，只有她往山上走。
# 文化：安达卢斯的乡愁与记仇；四十三年“受了洗留下来”的隐信。张力：她骂了一辈子“留下来的人”，家事簿后半本最后一个名字是她自己的洗礼名。
# 入口：c13_main_tariq（a00 default 设）加日期；k2 起读 c13_main_tariq_act2（b01 必设），k6 读 _act3（c01 必设）。各章有期限与 timeout，k6 是终章（next = done）。
# 史实：1567 年元旦的敕令（禁阿拉伯话、旧衣裳、阿拉伯名字、澡堂、婚礼上的乐器，三年为限）；1569 年 10 月山里拥立的王被自己人勒死；
#   1570 年 2 月唐·胡安攻下加莱拉，夷城撒盐。祖母死在哪里由 k2 的选择定（山里的村子 / 阿尔及尔），只在变体里分。
# 约定：本旁轨不出现“费尔南多”，不出现口头禅原句；诺埃尔不出场。
# 读：rw_tariq_gm_asked_name / _kept_blot（养成·关着窗的经 n4，k1 变体）、rw_tariq_gm_promise_yes / _no / _wait（n6，k2 变体）、
#     rw_tariq_door_back_half（n2b，k5 变体）；设：rw_tariq_k_name_told / _decree_kept（k1）、rw_tariq_k_sailed / _ashore / _other_ship（k2，互斥）、
#     rw_tariq_k_waited（k3）、rw_tariq_k_read_now / _read_later / _book_mother（k4）、rw_tariq_k_page_torn / _page_kept / _notes（k5）、
#     rw_tariq_keys_end_names / _end_both / _end_blank（k6）。已有章节 b03 的变体读 _sailed / _other_ship。
[[tracks]]
key = "main_tariq_rw_keys"
name = "山里的钥匙"
kind = "main"
start = "k1_decree"
auto = true
cast = ["tariq"]

# k1 不许再说的话：1567 年的敕令传到阿尔及尔。祖母头一回说出自己的洗礼名（可选）。
[[tracks.chapters]]
key = "k1_decree"
title = "不许再说的话"
text = "开春，从马拉加偷渡过来的人带来了国王的新敕令：格拉纳达的摩里斯科人，三年之内不许再说阿拉伯话，不许穿老式衣裳，不许用阿拉伯名字，澡堂一律拆掉，婚礼上不许奏乐。码头上议论了好几天。祖母去年冬天那场病挺过来了，腿却不灵了，整天坐在院里晒太阳。塔里克把敕令一条一条念给她听，念到名字那一条，她笑了一声：“名字？六十多年前，他们已经拿走过一回了。”（心里）她说“一回”，像是在说她自己。"
when = [{ kind = "flag", flag = "c13_main_tariq" }, { kind = "date", from = [1567, 3, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1568, 6, 30]

[[tracks.chapters.choices]]
key = "ask_name"
text = "问她：那一回，您被叫作什么"
next = "k2_bundle"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_tariq_k_name_told" }]
reply = "祖母看着院墙上的日影，很久才说了一个名字：玛丽亚。“神父往我头上洒水的时候念的。我十三岁，就记住了这一个词。”她伸手要过钥匙摸了摸，又塞回他手里，“你不许叫。谁也不许叫。”"

[[tracks.chapters.choices]]
key = "read_on"
text = "不接话，把剩下的几条念完"
next = "k2_bundle"
effects = [{ kind = "reputation", faction = "algiers", value = 1 }]
reply = "他念完了：澡堂、衣裳、婚礼上的乐器，连乌德琴也在里头。祖母听到琴，扭头冲屋里喊：“优素福，听见没有，你的琴也有罪了。”父亲在屋里没应声。那天夜里，祖母屋里的窗板又关上了，门缝里塞着布。"

[[tracks.chapters.choices]]
key = "copy_decree"
text = "把敕令抄下来，夹进祖母的家事簿"
next = "k2_bundle"
effects = [{ kind = "skill", skill = "calligraphy", value = 10 }, { kind = "flag", flag = "rw_tariq_k_decree_kept" }]
reply = "祖母不让抄进簿子里：“我的簿子里不记国王的话。”她叫他另拿一张纸抄，抄完夹在簿子外头，拿一根丝线捆住。“哪天这张纸上的话也作废了，”她说，“你再拆这根线。”"

[tracks.chapters.timeout]
next = "k2_bundle"
effects = []
news = "阿尔及尔的码头上都在传：格拉纳达那边，连婚礼上奏乐都要罚了。"

[[tracks.chapters.variants]]
key = "rw_asked"
when = [{ kind = "flag", flag = "rw_tariq_gm_asked_name" }]
text = "开春，从马拉加偷渡过来的人带来了国王的新敕令：格拉纳达的摩里斯科人，三年之内不许再说阿拉伯话，不许穿老式衣裳，不许用阿拉伯名字，澡堂一律拆掉，婚礼上不许奏乐。码头上议论了好几天。祖母去年冬天那场病挺过来了，腿却不灵了，整天坐在院里晒太阳。塔里克把敕令一条一条念给她听，念到名字那一条，她笑了一声：“名字？六十多年前，他们已经拿走过一回了。”（心里）在非斯的时候，我写信问过她一回信尾那个字母。她没答。十二年了，她还记得我问过。"

[[tracks.chapters.variants]]
key = "rw_blot"
when = [{ kind = "flag", flag = "rw_tariq_gm_kept_blot" }]
text = "开春，从马拉加偷渡过来的人带来了国王的新敕令：格拉纳达的摩里斯科人，三年之内不许再说阿拉伯话，不许穿老式衣裳，不许用阿拉伯名字，澡堂一律拆掉，婚礼上不许奏乐。码头上议论了好几天。祖母去年冬天那场病挺过来了，腿却不灵了，整天坐在院里晒太阳。塔里克把敕令一条一条念给她听，念到名字那一条，她笑了一声：“名字？六十多年前，他们已经拿走过一回了。”（心里）那团涂掉的墨，我从非斯一直夹到船上，夹在琴谱里。"

# k2 收好的包袱：平安夜山里起火以后，她要回去。读养成期 n6 的许诺。
[[tracks.chapters]]
key = "k2_bundle"
title = "收好的包袱"
text = "正月，平安夜山里起火的消息才过去十几天，祖母就收好了一个包袱：两件旧衣，一块绣石榴的头巾，那本家事簿。她叫人把她抬到码头，坐在“鸥”的跳板边上，谁劝也不走。“山里的人自己来叫了，”她对塔里克说，“我在这边等了二十六年。”船上的老桨手们都停了手，看船长怎么说。（心里）她五十六岁那年过的海，如今八十二了，要再过一回。"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1569, 1, 5] }]
at = "algiers"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
deadline = [1569, 3, 15]

[[tracks.chapters.choices]]
key = "take_her"
text = "让她上船，船头铺一张毯子"
next = "k3_uphill"
effects = [{ kind = "growth", attr = "honor", value = 150 }, { kind = "flag", flag = "rw_tariq_k_sailed" }]
reply = "他把舱里最好的一张毯子铺在船头。母亲站在跳板上，没拦，也没上来，只塞给他一卷补帆的丝线。祖母坐定，把钥匙要了过去，攥在手心里：“到了那边，我自己走。”"

[[tracks.chapters.choices]]
key = "refuse_her"
text = "不让她上船：这一趟是去打仗"
next = "k3_uphill"
effects = [{ kind = "growth", attr = "resolve", value = 150 }, { kind = "flag", flag = "rw_tariq_k_ashore" }]
reply = "他蹲在跳板边，跟她讲海上的炮、山里的兵、她的腿、山里的冬天。她一句一句听着，听完把包袱抱紧：“你说的都对。”她没再争，叫人把她抬回去，一路没回头。那天夜里，她屋里的窗板没关。"

[[tracks.chapters.choices]]
key = "ask_mother"
text = "去作坊问母亲：让不让她走"
next = "k3_uphill"
effects = [{ kind = "reputation", faction = "algiers", value = -1 }, { kind = "flag", flag = "rw_tariq_k_other_ship" }]
reply = "母亲在拆那条丝腰带，头也没抬：“她是你父亲的娘。可我要是她，我也走。”她把拆下来的丝绕成一团，塞进祖母的包袱：“山里人认得这个结。”第二天，祖母搭上一条往马拉加去的走私船，船主收了她一对金耳环。钥匙她带走了。塔里克没去码头送。"

[tracks.chapters.timeout]
next = "k3_uphill"
effects = [{ kind = "flag", flag = "rw_tariq_k_ashore" }]
news = "阿尔及尔的人说：加尔纳蒂家的老太太在码头上坐了一冬，等一条往北去的船。"

[[tracks.chapters.variants]]
key = "rw_promise_no"
when = [{ kind = "flag", flag = "rw_tariq_gm_promise_no" }]
text = "正月，平安夜山里起火的消息才过去十几天，祖母就收好了一个包袱：两件旧衣，一块绣石榴的头巾，那本家事簿。她叫人把她抬到码头，坐在“鸥”的跳板边上，谁劝也不走。“你在非斯回信说，船上不是看雪的地方。”她对塔里克说，“这回我不看雪，我回家。”船上的老桨手们都停了手，看船长怎么说。（心里）她五十六岁那年过的海，如今八十二了，要再过一回。"

[[tracks.chapters.variants]]
key = "rw_promise_wait"
when = [{ kind = "flag", flag = "rw_tariq_gm_promise_wait" }]
text = "正月，平安夜山里起火的消息才过去十几天，祖母就收好了一个包袱：两件旧衣，一块绣石榴的头巾，那本家事簿。她叫人把她抬到码头，坐在“鸥”的跳板边上，谁劝也不走。“你信里说，等山里有人来叫，一起走着上山。”她对塔里克说，“人来叫了。你走不走？”船上的老桨手们都停了手，看船长怎么说。（心里）她五十六岁那年过的海，如今八十二了，要再过一回。"

[[tracks.chapters.variants]]
key = "rw_promise_yes"
when = [{ kind = "flag", flag = "rw_tariq_gm_promise_yes" }]
text = "正月，平安夜山里起火的消息才过去十几天，祖母就收好了一个包袱：两件旧衣，一块绣石榴的头巾，那本家事簿。她叫人把她抬到码头，坐在“鸥”的跳板边上，谁劝也不走。她从包袱里抽出一封信，纸都磨软了，是他十六岁那年从非斯寄回来的：头一回往北，一定带上你。“头一回你没带，”她说，“这一回算头一回。”船上的老桨手们都停了手，看船长怎么说。"

# k3 往山上走的人：她上不上得了岸、上不上得了山，三段变体按 k2 分。
[[tracks.chapters]]
key = "k3_uphill"
title = "上不去的绳梯"
text = "四月，码头上的人说，加尔纳蒂家的老太太夜里一个人拄着拐上了防波堤，要搭一条往马拉加去的走私船。船主不敢收，她就自己去攀船舷上的绳梯，攀到第三级，膝盖一软，掉进了水里，是两个渔家孩子把她捞上来的。塔里克赶到的时候，她坐在石阶上，浑身湿透，怀里还抱着那个包袱。“上不去了，”她说，“二十六年前，我上得去。”"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1569, 4, 1] }]
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1569, 12, 31]

[[tracks.chapters.choices]]
key = "back_to_sea"
text = "第二天照旧出海"
next = "k4_bundle_back"
effects = [{ kind = "reputation", faction = "algiers", value = 1 }]
reply = "他第二天照旧出了海。舵手问往哪边，他说往北，说完又改口说往东。一整趟他都没弹琴，船员们说船长的琴弦大概是断了，没人敢问。"

[[tracks.chapters.choices]]
key = "stay_ashore"
text = "这一季不出海，在家等消息"
next = "k4_bundle_back"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_tariq_k_waited" }]
reply = "他这一季没出海，每天去码头问从山那边回来的船。回来的人说得都差不多：山里冷，兵多，粮少，逃下来的比上去的多。他每问完一个，就在墙上那颗钉子底下站一会儿。"

[tracks.chapters.timeout]
next = "k4_bundle_back"
effects = []
news = "马拉加的渔夫说：那年春天，往下逃的人挤满了海滩，只有很少几个人是往山上走的。"

[[tracks.chapters.variants]]
key = "rw_other_ship"
when = [{ kind = "flag", flag = "rw_tariq_k_other_ship" }]
text = "四月，往马拉加去的那条走私船回来了。船主说，老太太在山脚下的海滩上下了船，跟着几个往山里送火药的人走了，走得比谁都快，“像那条路她走过”。海滩上全是往下逃的人，抱着孩子，扛着丝卷，挤着上小船，只有她一个往山上走。她托船主带回来一句话，给孙子：“告诉他，我走着上的山。”"

[[tracks.chapters.variants]]
key = "rw_sailed"
when = [{ kind = "flag", flag = "rw_tariq_k_sailed" }]
text = "四月，没有月亮的夜，“鸥”贴着马拉加以东的海岸靠了岸。山脚下的海滩上，往下逃的人一串一串摸到水边，抱着孩子，扛着丝卷，挤上小船。只有一个人往山上走，是祖母。她叫一个赶骡的孩子扶着，一步一步往黑里走，没有回头。塔里克追上去，她停下来，把他的手掰开：“回你的船上去。这一段路，是我的。”（心里）她的手比我想的有劲。"

# k4 带回来的包袱：她死了。死在山里（sailed / other_ship）还是阿尔及尔（ashore 与缺省），分变体。钥匙与家事簿回到塔里克手里（b03 要用钥匙）。
[[tracks.chapters]]
key = "k4_bundle_back"
title = "床头朝北"
text = "三月，祖母死在阿尔及尔，死在冬天最后一场东风里。那一冬山里的消息一条比一条坏：山里拥立的王被他自己的人勒死了；唐·胡安攻下加莱拉，把城夷平，地上撒了盐。她每听一条，就叫人把床往北挪一点，挪到最后，床头顶住了墙。她死前要过钥匙攥了一夜，天亮时母亲才从她手里取下来，交还塔里克，连同那本家事簿。"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1570, 3, 1] }]
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1570, 12, 31]

[[tracks.chapters.choices]]
key = "read_now"
text = "当夜就翻开家事簿的后半本"
next = "k5_back_half"
effects = [{ kind = "flag", flag = "rw_tariq_k_read_now" }]
reply = "他点了灯，翻到她从不让人看的那一半，只看了一页就合上了。那一页的名字底下，都画着线。（心里）她说过，人的账，活着的时候不给人看。她不活着了，我还是不敢看。"

[[tracks.chapters.choices]]
key = "read_later"
text = "等过了四十天再翻"
next = "k5_back_half"
effects = [{ kind = "growth", attr = "resolve", value = 100 }, { kind = "flag", flag = "rw_tariq_k_read_later" }]
reply = "他把家事簿用她的石榴头巾包好，压在琴箱底下。四十天里，他每天夜里替她念一段经，窗板关着，门缝塞着布，声音压得很低。第四十天，他打开窗板念了一回，念不出声来。"

[[tracks.chapters.choices]]
key = "give_mother"
text = "把家事簿交给母亲收着"
next = "k5_back_half"
effects = [{ kind = "flag", flag = "rw_tariq_k_book_mother" }]
reply = "母亲接过簿子，没翻，拿手掌在封皮上按了按：“她跟我拌了三十年嘴，最后一句，是叫我别把她的丝毯卖了。”她把簿子收进绣箱最底下一格，说等他想看了再来拿。"

[tracks.chapters.timeout]
next = "k5_back_half"
effects = []
news = "阿尔及尔的人说：加尔纳蒂家的老太太走了，补帆的石阶空了一整个春天。"

[[tracks.chapters.variants]]
key = "rw_mountain"
when = [{ kind = "flag", flag = "rw_tariq_k_sailed" }]
text = "三月，一个从山里逃出来的女人找到了“鸥”，怀里抱着祖母的包袱：两件旧衣，一块石榴头巾，那本家事簿，还有那把钥匙。女人说，老太太在山里一个叫不出名字的村子里过的冬，替人补衣裳、记账，夜里关着窗念经，村里人笑她：“这儿用不着关窗了。”开春前她病倒了，死在一场雪里。临走前她叫人把钥匙和簿子包好，说一定有船来接，“我孙子的船，叫鸥”。（心里）她到底看见了雪。"

[[tracks.chapters.variants]]
key = "rw_mountain_b"
when = [{ kind = "flag", flag = "rw_tariq_k_other_ship" }]
text = "三月，一个从山里逃出来的女人找到了“鸥”，怀里抱着一个包袱：两件旧衣，一块石榴头巾，那本家事簿，还有那把钥匙。女人说，那个走着上山的老太太在山里一个叫不出名字的村子里过的冬，替人补衣裳、记账，夜里关着窗念经，村里人笑她：“这儿用不着关窗了。”开春前她病倒了，死在一场雪里。她叫人把东西包好，说阿尔及尔有一条船叫鸥，船长是她孙子，“他没来送我，他会来接”。"

# k5 后半本：家事簿最后一页是她自己的洗礼名，名字底下的线最密。k1 说出过名字的局换变体。
[[tracks.chapters]]
key = "k5_back_half"
title = "后半本"
text = "四月，塔里克终于把家事簿的后半本从头翻到了尾。前半本是阿尔拜辛的街和井，后半本全是名字：留在那边、受了洗、没有走的人，一页一页，每个名字底下都画着线，一道，两道，三道。翻到最后一页，只有一个名字，是卡斯蒂利亚字写的：玛丽亚。那个名字底下的线画得最多，密得把纸都划破了。页脚有一行她后来添的阿拉伯字，墨还很新：我也是留下来的人，留了四十三年。"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1571, 4, 15] }]
at = "algiers"
speaker = "captain"
mood = "sad"
cast = ["tariq"]
deadline = [1572, 12, 31]

[[tracks.chapters.choices]]
key = "tear_page"
text = "把最后一页撕下来，跟钥匙拴在一起"
next = "k6_names_back"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_tariq_k_page_torn" }]
reply = "他把那一页沿着装订线撕下来，折成小方块，用母亲的丝线跟钥匙拴在一处。（心里）她把自己记在恨的那一边，记了一辈子。这一页不该跟那些名字待在一块儿。"

[[tracks.chapters.choices]]
key = "keep_page"
text = "什么也不动，合上簿子"
next = "k6_names_back"
effects = [{ kind = "flag", flag = "rw_tariq_k_page_kept" }]
reply = "他把簿子合上，放回琴箱。那一页是她自己写的，线是她自己画的，他没有资格替她擦。（心里）她恨得对不对，轮不到我来判。"

[[tracks.chapters.choices]]
key = "add_notes"
text = "在那些名字旁边，写上他知道的下落"
next = "k6_names_back"
effects = [{ kind = "skill", skill = "calligraphy", value = 15 }, { kind = "flag", flag = "rw_tariq_k_notes" }]
reply = "这些年经他手赎回来的人里，有七个名字在这本簿子上。他在每个名字旁边，用很小的字写上：某年，某船，赎回。线他没动。（心里）她画线的时候，不知道这些人后来也渡了海。"

[tracks.chapters.timeout]
next = "k6_names_back"
effects = []
news = "阿尔及尔的书记们说：那个弹琴的海盗最近常去安达卢斯区，挨家打听几个格拉纳达老名字。"

[[tracks.chapters.variants]]
key = "rw_known"
when = [{ kind = "flag", flag = "rw_tariq_k_name_told" }]
text = "四月，塔里克终于把家事簿的后半本从头翻到了尾。前半本是阿尔拜辛的街和井，后半本全是名字：留在那边、受了洗、没有走的人，一页一页，每个名字底下都画着线，一道，两道，三道。翻到最后一页，只有一个名字，是卡斯蒂利亚字写的。他不用念也知道是哪一个，那年春天，她在院子里亲口告诉过他，又叫他不许叫。那个名字底下的线画得最多，密得把纸都划破了。页脚有一行她后来添的阿拉伯字：我也是留下来的人，留了四十三年。"

# k6 还回来的名字：第三幕。终章，三个落点。
[[tracks.chapters]]
key = "k6_names_back"
title = "簿子的最后一页背面"
text = "那年冬天，塔里克把祖母的家事簿翻到最后一页的背面，那里还空着。这些年经他手赎回去的人，名字都在胡安修士的名册上，在萨穆埃尔儿子的账上，在码头的赎单上，就是不在这本簿子里。祖母记的是丢了的街和留下来的人，他该记什么？舱外在下雨，钥匙挂在舱梁底下，跟着船轻轻地晃。"
when = [{ kind = "flag", flag = "c13_main_tariq_act3" }, { kind = "date", from = [1580, 11, 1] }]
at = "algiers"
speaker = "captain"
mood = "tender"
cast = ["tariq"]

[[tracks.chapters.choices]]
key = "write_returned"
text = "把赎回去的人一个一个写上"
next = "done"
effects = [{ kind = "fame", value = 2 }, { kind = "flag", flag = "rw_tariq_keys_end_names" }]
reply = "他写了一整夜，阿拉伯字和卡斯蒂利亚字一行挨着一行，写到天亮还没写完。他没在任何一个名字底下画线。（心里）祖母，你记的是留下来的，我记的是回去的。两样合在一本里，这本账才算齐。"

[[tracks.chapters.choices]]
key = "write_both"
text = "只写一行：她的两个名字"
next = "done"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_tariq_keys_end_both" }]
reply = "他写了宰娜卜，又在旁边用卡斯蒂利亚字写了玛丽亚，两个名字一样大，底下都没画线。（心里）她两个都是。她自己不肯认，我替她认了。她要是知道，大概又要叫我关上窗。"

[[tracks.chapters.choices]]
key = "leave_blank"
text = "让那一页空着，把簿子收进琴箱"
next = "done"
effects = [{ kind = "growth", attr = "resolve", value = 150 }, { kind = "flag", flag = "rw_tariq_keys_end_blank" }]
reply = "他把簿子合上，收进琴箱，压在那张发黄的旧纸底下。空着的那一页，他想留给以后的人，留给哪一个从山里下来、从海上回来、还记得自家井边住着谁的人。（心里）门没了，簿子还开着。"

[[tracks.chapters.variants]]
key = "rw_torn"
when = [{ kind = "flag", flag = "rw_tariq_k_page_torn" }]
text = "那年冬天，塔里克把祖母的家事簿翻到最末，最后一页早被他撕下来跟钥匙拴在一起了，簿子的尾巴只剩一道参差的纸茬，和茬后面一张空着的衬页。这些年经他手赎回去的人，名字都在胡安修士的名册上，在萨穆埃尔儿子的账上，在码头的赎单上，就是不在这本簿子里。祖母记的是丢了的街和留下来的人，他该记什么？舱外在下雨，钥匙连着那一小方纸挂在舱梁底下，跟着船轻轻地晃。"

# ───────────── 旁轨（剧情增写 11-11，Claude）：哈姆扎的船（发小哈姆扎，贩人的船长，1557 到 1580 年代） ─────────────
# 母本：《一千零一夜》“渔夫与魔鬼”（等得太久，谢字烂在嘴里）；阿尔及尔的赎俘史——赎金让抓人有利可图，赎得越多，船跑得越勤。
# 文化：私掠城的账，人人有价；好的一面是舱底那盏灯、铁环里垫的布、给母亲捎的蜜枣，坏的一面是认下这本账。
# 张力：哈姆扎不是恶人。他母亲被修士赎回塔里法，赎单上没有他；他上了贩人的船，一路做到船长，最后自己也被锁上了桨凳，有了一个数。
#   “你又能救得了谁”在 h5 由他换成自己的说法：“这一舱人是你从海上叫来的……你救下的是谁？”伊希·妮克特那条线里的原句不重复。
# 入口：c13_main_tariq（a00 default 设）加日期；h5 读 _act2，h6 起读 _act3。各章有期限与 timeout，h7 是终章（next = done）。
# 约定：诺埃尔（h4、h6）不用代词，只叫名字或“那位骑士”；不出现“费尔南多”与口头禅原句。哈菲莎只在 h1 的回应里出现，不作 speaker、不加情谊。
# 读：c13_main_tariq_broke_rule / _first_ransom_seed（a02，h1 变体）；rw_tariq_hamza_boat_rule / _boat_named / _boat_blank（养成·哈姆扎的账 n7，h1、h3 变体）、
#     rw_tariq_hamza_tenth_struck / _fee_taken（n4，h2 变体）；本轨 h2 的 rw_tariq_h_partner / _refused / _children（h5 变体）、h3 的 _dates（h4 变体）、h6 的 _ransomed（h7 变体）。
