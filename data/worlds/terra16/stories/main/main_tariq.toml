# a07：去马耳他的船。
[[tracks.chapters]]
key = "a07_malta_call"
title = "去马耳他的船"
text = "港务所门外那块木板又写满了字，这回写的是出征的船名，不再是看见的帆。哈桑帕夏要带阿尔及尔的船去马耳他，和伊斯坦布尔来的大舰队会合，图尔古特也会从的黎波里赶来。烤饼干的炉子日夜不熄，桨手的链子在码头上一串一串地数。一个刚被赎回来的西西里水手带来一句话：“海峡那边那位系红缎带的骑士，问我认不认识一个弹琴的海盗。我说认识，那位骑士欠我三枚铜子。”哈桑在一旁拍着桌子：“我父亲没拿下的岛，轮到我了。”塔里克看见自己的船名被写在哈桑的名下，炭笔字还没干。"
