[[tracks.chapters.variants]]
key = "rw_empty"
when = [{ kind = "flag", flag = "rw_tariq_fifth_empty" }]
text = "哈姆扎娶亲，请塔里克去弹琴。父亲的左手早就按不住弦了，阿尔及尔的喜事上，人人都说加尔纳蒂家的儿子弹得像他爹年轻时候。院子里摆着烤羊，客人们说的是哪个村子、几个人头、巴德斯坦这个月的价。父亲坐在角落里，膝上横着那把格拉纳达的琴，第五个弦轴还空着，红弦缠在琴颈上，跟塔里克在非斯缠上去时一样。哈姆扎端着酒过来，冲琴一扬下巴：“弹快的。今晚谁慢，谁罚一碗。”"

# s2 最后一段：勒班陀以后那个冬天，父亲死了。
[[tracks.chapters]]
key = "s2_last_tune"
title = "三百场喜事"
text = "勒班陀以后那个冬天，父亲病倒了。他躺在床上，叫塔里克把那把格拉纳达的琴取下来，放在他胸口。他的手已经抬不起来，只用一根指头去碰中间那个弦轴。“我这辈子，”他说，“弹了三百场喜事。每一场都有人哭，哭的人不在院子里。”母亲在门口站着，手里拿着一卷没拆的红丝。"
when = [{ kind = "flag", flag = "c13_main_tariq_act2" }, { kind = "date", from = [1572, 2, 1] }]
at = "algiers"
speaker = "captain"
mood = "sad"
night = true
cast = ["tariq"]
deadline = [1573, 6, 30]

[[tracks.chapters.choices]]
key = "play_him_out"
text = "替他把那一段弹完"
next = "s3_send_off"
effects = [{ kind = "skill", skill = "oud_playing", value = 20 }, { kind = "flag", flag = "rw_tariq_s_played" }]
reply = "塔里克照着父亲当年在墙下弹过的那一段弹，弹到一半，父亲的指头在被子上打起拍子，很慢，比琴还慢。弹完，拍子停了。（心里）他走的时候，拍子是对的。"

[[tracks.chapters.choices]]
key = "hold_hand"
text = "不弹，握着他的手"
next = "s3_send_off"
effects = [{ kind = "growth", attr = "sensibility", value = 150 }, { kind = "flag", flag = "rw_tariq_s_held" }]
reply = "他把琴挪开，握住父亲的手。那只手又干又硬，指尖上是一辈子的弦茧。父亲没再说话，天亮前，手指在他掌心里轻轻拨了一下，像拨一根看不见的弦。"

[[tracks.chapters.choices]]
key = "ask_debt"
text = "问他：商馆的账，到底清了没有"
next = "s3_send_off"
effects = [{ kind = "growth", attr = "commerce", value = 100 }, { kind = "flag", flag = "rw_tariq_s_debt" }]
reply = "父亲笑了，笑得咳起来：“早清了。你出海第二年就清了，你母亲没告诉你？”他说清账那天，他把外头弹的那把琴还给了商馆，只留下这一把。“那一把，是弹给他们的。这一把，没弹给过谁。”"

[tracks.chapters.timeout]
next = "s3_send_off"
effects = []
news = "阿尔及尔的人说：老琴师优素福走了，那一冬城里的喜事，请不到一个像样的乌德琴手。"

[[tracks.chapters.variants]]
key = "rw_strung"
when = [{ kind = "flag", flag = "rw_tariq_fifth_strung" }]
text = "勒班陀以后那个冬天，父亲病倒了。他躺在床上，叫塔里克把那把格拉纳达的琴取下来，放在他胸口。他的手已经抬不起来，只用一根指头去碰中间那根红弦，碰了一下，弦响了，很轻。“你在非斯上的，”他说，“上得比我当年松。松一点好。”他又说：“我这辈子弹了三百场喜事。每一场都有人哭，哭的人不在院子里。”母亲在门口站着，手里拿着一卷没拆的红丝。"

[[tracks.chapters.variants]]
key = "rw_empty"
when = [{ kind = "flag", flag = "rw_tariq_fifth_empty" }]
text = "勒班陀以后那个冬天，父亲病倒了。他躺在床上，叫塔里克把那把格拉纳达的琴取下来，放在他胸口。他的手已经抬不起来，只用一根指头去碰中间那个空着的弦轴，碰到了缠在琴颈上的那圈红弦。“你也没上，”他说，“好。我还以为你会上。”他又说：“我这辈子弹了三百场喜事。每一场都有人哭，哭的人不在院子里。”母亲在门口站着，手里拿着一卷没拆的红丝。"

# s3 起锚前的那支曲子：赎俘船出港，码头上要有人弹琴送行。终章，三个落点。
[[tracks.chapters]]
key = "s3_send_off"
title = "起锚前的那支曲子"
text = "那年秋天，赎俘的船起锚之前，码头上照老规矩要有人弹琴送行。三一会的修士请了塔里克——两岸的人都认得他的琴。防波堤上站满了人：要走的，脚上的铁环刚卸，脚踝还是白的；送的，有赎了人的修士，也有卖了人的船长。塔里克坐在缆桩上，把那把格拉纳达的琴抱起来，中间那根红弦是母亲重新搓过的，他拧了很久才拧准。"
when = [{ kind = "flag", flag = "c13_main_tariq_act3" }, { kind = "date", from = [1579, 9, 1] }]
at = "algiers"
speaker = "captain"
mood = "tender"
cast = ["tariq"]

[[tracks.chapters.choices]]
key = "granada_tune"
text = "弹父亲那支格拉纳达的老调"
next = "done"
effects = [{ kind = "growth", attr = "sensibility", value = 200 }, { kind = "flag", flag = "rw_tariq_string_end_granada" }]
reply = "他弹得很慢，慢得防波堤上的人坐不住，坐不住也没人走。船上有个老俘虏是安达卢西亚人，听到一半，扶着船舷跟着哼，哼的词跟祖母念过的诗是一个韵。（心里）父亲，这一回哭的人，在院子里。"

[[tracks.chapters.choices]]
key = "their_song"
text = "弹一支要走的人听得懂的西班牙歌"
next = "done"
effects = [{ kind = "reputation", faction = "spain", value = 2 }, { kind = "flag", flag = "rw_tariq_string_end_spanish" }]
reply = "他弹的是港口里西班牙俘虏们夜里唱的那一支，调子是他小时候在巴尼奥门外听熟的。船上的人先是愣住，然后一个一个跟着唱起来，唱到船出了防波堤，声音还从水上飘回来。岸上几个船长骂他，骂完也没走。"

[[tracks.chapters.choices]]
key = "counting_tune"
text = "弹码头上教孩子数数的那支小调"
next = "done"
effects = [{ kind = "fame", value = 2 }, { kind = "flag", flag = "rw_tariq_string_end_counting" }]
reply = "他弹的是阿尔及尔码头上教孩子数数的调子，一、二、三，一拨一个数。岸上的孩子跟着数，船上被赎走的人也跟着数，数到他们自己的人数，琴停了。（心里）这一船，一个也没数漏。"
