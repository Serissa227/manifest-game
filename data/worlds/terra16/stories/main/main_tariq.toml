# a08：马耳他之围。交汇：诺埃尔（不用代词）。
[[tracks.chapters]]
key = "a08_malta"
title = "圣艾尔莫的烟"
text = "六月，圣艾尔莫堡整日被炮轰，烟压在大港上，港口拉着铁链。海面漂着船板，也漂着锁着链子的桨手。奥斯曼船上的桨手多是基督徒奴隶，有人趁乱跳了海。图尔古特八十岁了，坐在岸上的帐子里看地图，哈桑帕夏等着要去攻森格莱阿。隔着一道壕沟，塔里克第一次看清那位骑士剑柄上的红缎带。一块被炮弹打碎的石头溅进了帐子，图尔古特在帐子里说：“我在热那亚人的船上划过四年桨。落水的那几个，捞不捞，你自己定。”那位骑士隔着壕沟喊：“信里你可没说你的船这么破。还有，别盯着我的脸看。”塔里克说：“你的缎带比信里写的还红。”（心里）十年的信吵的都是小事，这回吵的是一座岛。"
stage = "involve"
window = [[1565, 6, 11], [1565, 9, 8]]
at = "malta"
speaker = "captain"
mood = "tense"
cast = ["turgut_reis", "noel", "hasan_pasha"]
news = "比尔古的人说：围城那年夏天，海上漂着的除了船板，还有锁着铁链的桨手。"
when = []

