# b01：阿尔普哈拉斯起义的召章。本幕第一章，所有分支设 _act2。
[[tracks.chapters]]
key = "b01_uprising"
title = "平安夜的山火"
text = "平安夜，山里来的人带着消息：阿尔普哈拉斯的村子烧起了火，山里拥立了一个王，他原先的受洗名也叫费尔南多。信缝在一条丝腰带里。塔里克的母亲摸了一下就认出了丝，她说：“这丝是我们村的，机子上打的结，我闭着眼也认得。”新任的贝伊乌卢赤·阿里肯悄悄给枪，却不肯打旗号。他看着桌上那条腰带说：“枪我给，船你出。伊斯坦布尔问起来，就说是商人自己卖的。”母亲拆开腰带的线，里层还绣着一个村名。屋梁下的油灯晃了一下。是风。"
speaker = "captain"
mood = "tense"
cast = ["uluc_ali"]
at = "algiers"
when = [{ kind = "date", from = [1568, 12, 24] }]
deadline = [1569, 2, 28]

[tracks.chapters.timeout]
next = "b02_crossing"
effects = [{ kind = "flag", flag = "c13_main_tariq_act2" }]

[[tracks.chapters.choices]]
key = "guns"
text = "买火绳枪，运进山里去"
requires = [{ kind = "cash", ge = 1500 }]
hint = "这点钱买不来几支枪。"
next = "b02_crossing"
effects = [{ kind = "cash", value = -1500 }, { kind = "reputation", faction = "spain", value = -10 }, { kind = "reputation", faction = "algiers", value = 2 }, { kind = "affinity", person = "uluc_ali", value = 4 }, { kind = "flag", flag = "c13_main_tariq_guns" }, { kind = "flag", flag = "c13_main_tariq_act2" }]
reply = "枪用渔网裹着，压在一层腌鱼底下。母亲把那条腰带系在他腰上，说到了山脚就交给第一个说她村名的人。"

[[tracks.chapters.choices]]
key = "refugees"
text = "不运枪，去海边接逃出来的人"
next = "b02_crossing"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "reputation", faction = "spain", value = -3 }, { kind = "flag", flag = "c13_main_tariq_act2" }]
reply = "他把舱底腾空，铺上干草。乌卢赤·阿里看着他铺，说桨手的舱都没铺得这么软。"

[[tracks.chapters.choices]]
key = "stay"
text = "不回去——那边早就不是家了"
next = "b02_crossing"
effects = [{ kind = "affinity", person = "uluc_ali", value = -2 }, { kind = "flag", flag = "c13_main_tariq_act2" }]
reply = "那一夜他把会弹的格拉纳达曲子从头弹到尾，弹到一半断了弦，没换。母亲在隔壁拆那条腰带，拆了一夜。"

[[tracks.chapters.variants]]
key = "rw_bundle"
when = [{ kind = "flag", flag = "rw_tariq_ransom_taken" }]
text = "平安夜，山里来的人带着消息：阿尔普哈拉斯的村子烧起了火，山里拥立了一个王，他原先的受洗名也叫费尔南多。信缝在一条丝腰带里。塔里克的母亲摸了一下就认出了丝，她说：“这丝是我们村的，机子上打的结，我闭着眼也认得。”新任的贝伊乌卢赤·阿里肯悄悄给枪，却不肯打旗号。他看着桌上那条腰带说：“枪我给，船你出。伊斯坦布尔问起来，就说是商人自己卖的。”母亲拆开腰带的线，里层还绣着一个村名，是尤比莱斯。这些年巷口的布包是塔里克在送，萨穆埃尔账上那几个山里的村名，他闭着眼也背得出。屋梁下的油灯晃了一下。是风。"

# b02：马拉加外海。交汇：诺埃尔（与 main_noel b01 同一场，这里只写塔里克的角度）。受洗名第二次出现。
[[tracks.chapters]]
key = "b02_crossing"
title = "马拉加外海"
text = "没有月亮的夜，马拉加以东的海岸。山脚下的海滩上有人举着火把打信号，亮了三下又灭了。西班牙的巡逻船停在外海，灯影底下，有一条船没挂灯。诺埃尔这两年在阿尔及尔赎人，这回却出现在马拉加外海。隔着水，那位骑士喊：“费尔南多——还是该叫你塔里克？信里你可没说要来马拉加。”塔里克回了一句：“这片海，我祖母比你先来。”那位骑士接着喊：“人可以过去，别的不行。”舱底压着二十几个人，塔里克数过三遍。（心里）上回隔着一道壕沟，这回隔着一船人。"
stage = "involve"
window = [[1569, 3, 1], [1569, 9, 30]]
at = "malaga"
speaker = "captain"
mood = "tense"
night = true
cast = ["noel"]
news = "马拉加的渔夫说：今年春天夜里常有不挂灯的船从阿尔及尔那边来，往山脚下去。"
when = []

[tracks.chapters.default]
next = "b03_alpujarras_echo"
effects = []

