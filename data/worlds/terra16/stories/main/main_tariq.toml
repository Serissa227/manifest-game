# c01：三王之战。本幕第一章，所有分支与 default 设 _act3。交汇：诺埃尔。
[[tracks.chapters]]
key = "c01_alcazar"
title = "轿帘后面的人"
text = "八月初，大西洋岸往内陆一天的路，马哈赞河边热得地面发白。当年那个十六岁的流亡王子回来了，带着奥斯曼借来的兵，病得坐在轿子里指挥。格拉纳达流亡者的火枪队站在他的中军，有人唱着阿尔拜辛的调子装火药。塞巴斯蒂安的葡萄牙大军被困在河湾里。轿帘后面的阿卜杜·马利克问：“从哪儿来的？……我也是从很远的地方来到这里的。坐吧，我们算是同路人。”一个火枪手听出了口音：“阿尔拜辛的？我认得你家那条街，井边那条。”（心里）二十年前，那个孩子也是坐船逃到阿尔及尔的。"
stage = "involve"
window = [[1578, 7, 25], [1578, 8, 15]]
at = "tangier"
speaker = "captain"
mood = "tense"
cast = ["abd_al_malik", "sebastian_i", "noel"]
news = "丹吉尔的人说：河边那一仗，格拉纳达人的火枪队站在摩洛哥的中军，装火药的时候唱的是老家的调子。"
when = []

[tracks.chapters.default]
