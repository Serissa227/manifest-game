key = "c_turned"
when = [{ kind = "flag", flag = "c13_main_tariq_turned_back" }]
text = "回到阿尔及尔的家。墙上挂钥匙的那颗钉子，母亲一直没让人取下来。母亲问他晒黑了没有，他说海草把太阳都挡了。妹妹围着他问：“柱子外头是什么？有没有石榴？”塔里克张嘴想开玩笑，没开出来：“有……有雾。”平时他的笑话能一直说到底，这回说到嘴边又咽了回去。妹妹不信，拉着他的袖子要他把乌德琴弹一遍。他弹了两个音，停下来，说琴弦松了，要换。妹妹说换就换，他说不急。那位骑士的船后来回到里斯本，桅杆上缠满了海草，诺埃尔一个字也不肯讲。"

[[tracks.chapters.variants]]
key = "d_absent"
when = [{ kind = "flag", flag = "c13_main_tariq_absent" }]
text = "回到阿尔及尔的家。墙上挂钥匙的那颗钉子，母亲一直没让人取下来。母亲问他晒黑了没有，他说海草把太阳都挡了。妹妹围着他问：“柱子外头是什么？有没有石榴？”塔里克张嘴想开玩笑，没开出来：“有……有雾。”平时他的笑话能一直说到底，这回说到嘴边又咽了回去。妹妹不信，拉着他的袖子要他把乌德琴弹一遍。他弹了两个音，停下来，说琴弦松了，要换。妹妹说换就换，他说不急。那个夏天他没赶到亚速尔，只收到诺埃尔一封骂他的信，信是从雾里回来以后写的。"

[[tracks.chapters.choices]]
key = "song"
text = "把看见的编成一支新曲，在码头上弹"
next = "c09_lanzarote"
effects = [{ kind = "fame", value = 2 }, { kind = "memory", memory = "mem-main_tariq-c08", title = "没人听过的调子" }]
reply = "曲子没有词，码头上的人听完说像下雨，又说像有人在敲门。他说都不是，说完自己也说不出是什么。"

[[tracks.chapters.choices]]
key = "silence"
text = "什么也不说，把那颗空钉子擦干净"
next = "c09_lanzarote"
effects = [{ kind = "growth", attr = "sensibility", value = 200 }]
reply = "他擦了一整个下午，擦到铁发亮。母亲说你祖母也这么擦，擦完了就不说话。"

[[tracks.chapters.choices]]
key = "lisbon"
text = "去里斯本找那位骑士，把两人看见的对一对"
next = "c09_lanzarote"
effects = [{ kind = "affinity", person = "noel", value = 5 }]
reply = "两人在里斯本码头的小酒馆里对了一夜，对上的不到一半。最后那位骑士说，对不上的那一半才是真的。"

# c09：兰萨罗特的白旗。穆拉特的口头禅只在这里用一次。
[[tracks.chapters]]
key = "c09_lanzarote"
title = "兰萨罗特的白旗"
text = "夏天，阿尔及尔的船头一回成群开出海峡，进了大西洋。穆拉特·雷斯（老）带着加列奥特扑向兰萨罗特，掳了岛上的人，连岛主家的女眷也在里面。几天后，海滩上插起一根挑着白布的长矛，岛上的人来谈赎金。穆拉特把名单递给塔里克：“你这消息是哪条船上听来的？船名、船长、哪一天。说清楚了，我才信。”塔里克扫了一眼名单，心里想，出了海峡，规矩还是那条规矩。穆拉特却先笑了：“海峡外头的岛又肥又没人守，你不早说？”"
stage = "involve"
window = [[1585, 7, 1], [1585, 8, 31]]
at = "las_palmas"
speaker = "captain"
mood = "tense"
cast = ["murat_reis_elder"]
news = "拉斯帕尔马斯的人说：阿尔及尔的船头一回开出了海峡，兰萨罗特的人在海滩上举着白旗谈赎金。"
when = []

[tracks.chapters.default]
next = "c10_taife"
effects = []

[[tracks.chapters.variants]]
key = "a_broke"
when = [{ kind = "flag", flag = "c13_main_tariq_broke_rule" }]
text = "夏天，阿尔及尔的船头一回成群开出海峡，进了大西洋。穆拉特·雷斯（老）带着加列奥特扑向兰萨罗特，掳了岛上的人，连岛主家的女眷也在里面。几天后，海滩上插起一根挑着白布的长矛，岛上的人来谈赎金。穆拉特把名单递给塔里克：“你这消息是哪条船上听来的？船名、船长、哪一天。说清楚了，我才信。”塔里克扫了一眼名单，心里想，出了海峡，规矩还是那条规矩。穆拉特却先笑了：“海峡外头的岛又肥又没人守，你不早说？”穆拉特拍着他的肩：“你年轻时不也卖过一船？装什么。”"

[[tracks.chapters.choices]]
key = "goods_only"
text = "跟他一起，只搬岛上的货，不碰人"
next = "c10_taife"
effects = [{ kind = "reputation", faction = "algiers", value = 2 }, { kind = "reputation", faction = "spain", value = -3 }, { kind = "affinity", person = "murat_reis_elder", value = 4 }]
reply = "他搬了一船葡萄酒和染料苔，人一个没碰。穆拉特看着他的船笑：“你这是来做买卖的。”"

[[tracks.chapters.choices]]
key = "warn"
text = "抢先一步，给岛上报信"
next = "c10_taife"
effects = [{ kind = "reputation", faction = "spain", value = 4 }, { kind = "reputation", faction = "algiers", value = -4 }, { kind = "affinity", person = "murat_reis_elder", value = -8 }]
news = "拉斯帕尔马斯的人说：阿尔及尔的船到兰萨罗特以前，有人在夜里敲了海边每一家的门。"
reply = "敲到第七家门，有个老人举着火把出来，看清他的衣服，愣了半天才喊人。那一夜岛上一半的人进了山洞。"

[[tracks.chapters.choices]]
key = "ransom"
text = "在白旗底下替岛上的人谈价，自己先垫上一部分"
requires = [{ kind = "cash", ge = 1500 }]
hint = "你兜里的钱压不住这张名单。"
next = "c10_taife"
effects = [{ kind = "cash", value = -1500 }, { kind = "reputation", faction = "spain", value = 3 }, { kind = "affinity", person = "murat_reis_elder", value = 2 }, { kind = "flag", flag = "c13_main_tariq_lanzarote_ransom" }]
news = "拉斯帕尔马斯的人说：兰萨罗特的白旗底下，是一个阿尔及尔海盗替岛上的人把价谈下来的。"
reply = "谈了三天。最后一个上岸的是个老渔夫，脚刚碰到沙子就跪下去亲了一口，又吐出一嘴沙。"

# c10：船长团。口头禅原句第二次，也是最后一次（放在他提笔的那一刻）。
[[tracks.chapters]]
key = "c10_taife"
title = "船长团"
text = "防波堤边的船长团议事厅，长凳坐满了。桌上一本章程，墨水瓶里插着一支秃笔。兰萨罗特以后，船长们要重新定分账的规矩，新来的帕夏也等着抽成。奥鲁奇已经是老资格，提出他的规矩：不打俘虏，不拆散母子，赎金谈妥就放人。奥鲁奇嗓门还是那么大：“你那条规矩，能饿死一半的船长。”穆拉特·雷斯靠在门框上：“章程要写清楚，谁也别想拿嘴当账本。”奥鲁奇把笔推到塔里克面前：“你那条，写还是不写？”塔里克接过笔，说：“只劫货，不劫人。”（心里）这句话我说了三十年，头一回要写成字。"
speaker = "captain"
mood = "tense"
cast = ["murat_reis_elder", "oruc"]
at = "algiers"
when = [{ kind = "date", from = [1586, 1, 1] }]
deadline = [1588, 12, 31]

[tracks.chapters.timeout]
next = "c11_epilogue"
effects = []

