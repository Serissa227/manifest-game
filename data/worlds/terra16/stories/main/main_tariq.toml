# 主线·塔里克：两岸（故事 2.0，A5 / E37 契约）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_tariq_atlantis 与本线同批登记；c08_after 的 when 加 c13_main_tariq_atlantis_over，由补章的结局与 c07_dark_sea 的掉头 / 缺席分支设。
#   补章 at3 的 hang_key / give_ismene 把祖母的钥匙留在外港，设 c13_main_tariq_key_left：c11_epilogue 的 a0_key_left 变体读它。
# 2026-11-12 剧情增写（Claude）：旁轨 main_tariq_rw_keys（山里的钥匙）、main_tariq_rw_hamza（哈姆扎的船）、main_tariq_rw_string（第五根弦）追加在文件末尾；
#   已有章节 a02、a05、a09、b01、b03、c11 各加 rw_ 变体（读养成期 tariq_growth.toml 与旁轨设的 rw_tariq_* 旗标），都带 value = false 守卫，不压已有变体。
#   旁轨里不出现“费尔南多”与口头禅原句，诺埃尔不用代词；新旗标只选变体，不锁章节、不锁选项。
# 标签：主线，男主角塔里克·加尔纳蒂（1540 年生，1557 年出海时十七岁）。全线不写恋爱；与诺埃尔是宿敌也是挚友，不写任何心动。
# 轨道：main_tariq（脊轨，29 章，a00_gate 为门槛见闻）；亚特兰蒂斯补章 main_tariq_atlantis 另文件暂存，待 A8 / C11 登记。
# 依据——史实（正文只从人物嘴里、码头告示和物件上透出来，不讲历史课）：
#   1557-10 萨阿德苏丹穆罕默德·谢赫遇刺，阿卜杜·马利克流亡阿尔及尔（a03）；
#   1558-08-26 莫斯塔加奈姆之战，阿尔考德特伯爵战死、其子被俘（a04、a05）；
#   1563 奥兰与凯比尔港之围（a06）；1565 马耳他之围，图尔古特 6-23 死（a08）；
#   1568-12-24 阿尔普哈拉斯起义，山里拥立的王原名费尔南多·德·巴洛尔（b01、b02）；
#   1571-10-07 勒班陀（b05）；1573-10 唐·胡安取突尼斯，1574 奥斯曼收回拉格莱特与新堡（b06、b07）；
#   1575-09 塞万提斯被俘，1580-09-19 三一会赎回（b08、c03）；1578-08-04 三王之战（c01、c02）；
#   1541-10 查理五世舰队毁于阿尔及尔外海，戈马拉 1552 年书中科尔特斯失落的五块雕石（c04、c05）；
#   1582—83 亚速尔海战（c06、c07）；1585 穆拉特·雷斯出海峡袭兰萨罗特（c09）。
# 原创：船“鸥”、乘客单、保银、没有门的锁、海底的玫瑰、船长团章程里的一句话、祖母的钥匙与她念的诗。
# 待核：伯爵被俘的儿子是否就是 1563 年守凯比尔港的马丁·德·科尔多瓦（正文只写传闻，不写全名）；穆拉特·雷斯袭兰萨罗特是 1585 还是 1586 年（正文不写年份）；图尔古特遗体送的黎波里（一般如此记载）；“门上的手与钥匙”的老话见于后世记载（正文只作祖母口中的老话）。
# 读写的共享旗标：设 c13_main_tariq（a00 default）、_act2（b01）、_act3（c01）、_first_contract / _broke_rule / _first_ransom_seed / _gave_genoese（a02、a05）、_keepsake 与 _stance_open / _close / _hand（c06）、_crossed / _turned_back / _absent（c07）、_done 与恰好一面 _end_corsair / _end_ransomer / _end_free（c11）；另设 _cut_chains（b05）、_guns（b01，可作 C10 的 H32 杠杆钥匙）、_rescue_boat（b04）、_cervantes_helped（b08）、_scouted_sicily（a07）、_tunis_intel（b06）、_lanzarote_ransom（c09）、_rule_written / _left_taife（c10）、c13_mark_cortes（c05，全局印记一次性）。读 c12_voyage_tariq（门槛）、c7_bond_esther_promise、c7_bond_aisha_promise、c7_bond_yaqub_landing_friend、c7_bond_musa_promise、c13_npc_ix_nikte_jade_hint（ix_nikte 组）。
# 等待的包：C10 的 h22_malta_siege_ottoman_takes_malta、h32_alpujarras_morisco_autonomy、h42_tunis_recapture_spanish_tunis、h49_three_kings_sebastian_returns；C11 的 atlantis_council_met；C12 的 c12_voyage_tariq；ix_nikte 组的 c13_npc_ix_nikte_jade_hint；C7 的 c7_bond_* 旗标（只用于变体）。
# HIST 占位清单：h22_malta_siege_ottoman_takes_malta（a09 变体）、h32_alpujarras_morisco_autonomy 与其 false 对照（b03 两个选项）、h42_tunis_recapture_spanish_tunis（b08 变体）、h49_three_kings_sebastian_returns 与其 false 对照（c02 两个选项）。
# 诺埃尔：全文件不用代词，只叫名字或“那位骑士”；外貌暗示只许 a08 一句“别盯着我的脸看”；不读不设 noel_unveiled。
# 回忆插画清单（mem-main_tariq-<章>，画面描述）：a02 第一个战利品（接舷后的甲板上，年轻的船长捏着一张写满名字的乘客单，舱口蹲着的女孩仰头看他）；a05 第一张赎身契（帕夏院里的石桌上摊着两栏文字的赎身契，修士的手指按着一个村名）；a09 钥匙交到手里（油灯下，祖母枯瘦的手把孙子的手指一根根合拢在一把磨得发亮的铁钥匙上）；b03 插不进的门（船舱门上挂着一把旧铁锁，钥匙插在锁里，锁后面没有门）；b03a 山里的集市（山间集市的井边，一块写着两种字的石板，石板旁挂着一把旧锁）；b05 砍断的链子（冒烟的海面上，年轻海盗抡着卷刃的斧头，链子从沉船的桨凳上掉进海里）；c02 格拉纳达人的中军（黄昏的海滩上，一排盖着粗布的担架，最前面那副上放着一只刻着石榴树的火药壶）；c05 海底的玫瑰（清澈的海底，两根朽船骨之间卡着一朵不透亮的绿石玫瑰，一只手伸过去，停在半寸外）；c08 没人听过的调子（阿尔及尔的码头上，塔里克闭着眼弹乌德琴，围着听的人里有个小女孩踮着脚）；c10 写进章程的一句话（议事厅长桌上摊开的章程，秃笔刚写完一行，墨迹旁有人用指甲画了一只小小的海鸥）；c11 两岸（夕阳下的“鸥”船头，鬓角花白的塔里克抱着乌德琴，身后一边是阿尔及尔的白城，一边是远处的西班牙山影）。

[[tracks]]
key = "main_tariq"
name = "两岸"
kind = "main"
start = "a00_gate"
auto = true

# a00：门槛见闻。c12_voyage_tariq 只在选中塔里克时设；窗口一过，这条主线静默失败。
[[tracks.chapters]]
key = "a00_gate"
title = "弹琴的新船长"
text = "阿尔及尔防波堤边卖烤沙丁鱼的摊子前，老桨手们在议论一件事：那个弹乌德琴的摩里斯科小子有了自己的加列奥特，船名叫“鸥”。下水那天他站在船头弹了一整支曲子。有人笑他瘦，有人说他手上有刀茧。一个老桨手咂着嘴说：“那孩子说他只劫货。等他头一回看见舱底下蹲着人，再听他怎么说。”"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "algiers"
cast = ["tariq"]
mood = "cheerful"
news = "阿尔及尔码头上都在说：那个弹乌德琴的摩里斯科小子有了自己的加列奥特，船名叫“鸥”。"
when = [{ kind = "flag", flag = "c12_voyage_tariq" }]

[tracks.chapters.default]
next = "a01_genoese"
effects = [{ kind = "flag", flag = "c13_main_tariq" }]

# a01：第一个猎物。三条路：截、打听、让。
[[tracks.chapters]]
key = "a01_genoese"
title = "热那亚的帆"
text = "冬末，港务所门外的木板上写满了船长们在海上看见的帆：“热那亚，三桅，吃水深，往西。”塔里克的船员个个比他大二十岁，靠在缆桩上等着看这个新船长的第一单。奥鲁奇也盯上了那条船。他比塔里克大六岁，是船长圈里的后生，嗓门大，好面子，剔着牙说：“货单我看，人名你念。吃水深的船，舱里不一定都是货。”塔里克笑了：“热那亚人的船吃水深，是因为心里压着秤砣。”笑完他却又去看那行炭字。（心里）头一条船，得让那帮老桨手把嘴闭上。"
speaker = "captain"
mood = "cheerful"
cast = ["tariq", "oruc"]
at = "algiers"
when = [{ kind = "date", from = [1557, 1, 7] }]
deadline = [1557, 6, 30]

[tracks.chapters.timeout]
next = "a02_first_prize"
effects = []

[[tracks.chapters.choices]]
key = "hunt"
text = "就截这一条，今晚趁陆风出港"
next = "a02_first_prize"
effects = [{ kind = "reputation", faction = "algiers", value = 1 }]
reply = "船员在甲板上敲桨柄起哄。他坐在船头调琴弦，一根弦断了，他说这是好兆头，没人信。"

[[tracks.chapters.choices]]
key = "ask_cargo"
text = "先去热那亚水手的酒馆打听，船上装的是什么"
check = { attr = "intrigue", base = 35, per = 6 }
next = "a02_first_prize"
effects = [{ kind = "flag", flag = "c13_main_tariq_knew_people" }]
reply = "一个喝醉的科西嘉水手说，那船是往塔巴尔卡送珊瑚工的家眷，舱里有女人和孩子。他把酒钱多付了一倍。"
fail = { next = "a02_first_prize", effects = [], news = "阿尔及尔港边的酒馆里，人人只记得那条热那亚船的油漆是新刷的。" }

[[tracks.chapters.choices]]
key = "give_oruc"
text = "把这条帆让给奥鲁奇，自己等下一条"
next = "a02_first_prize"
effects = [{ kind = "affinity", person = "oruc", value = 5 }, { kind = "flag", flag = "c13_main_tariq_gave_genoese" }]
reply = "奥鲁奇大笑着拍他的背，说欠他一顿酒。当晚奥鲁奇的船先出了港。塔里克在木板上另找了一行炭字：“西西里，单桅，往南。”"

# a02：规矩第一次被考验。口头禅原句全线只在这里说出口（另一次在 c10）。
[[tracks.chapters]]
key = "a02_first_prize"
title = "舱里有人"
text = "接舷之后，甲板上滑着鱼油和血。舱口掀开，底下蹲着十一个人：珊瑚工的妻子，两个老人，几个孩子。文书捏着一张乘客单，手抖得念不出名字。老舵手在旁边算账：“十一个人，抵得上半船珊瑚。船长，你算算，巴德斯坦这个月的价钱好。”塔里克张了张嘴，那句话已经到了舌尖：“只劫货，不劫人。货搬走，人留下。”说出口才知道它比弯刀沉。一个女孩从文书手里抽过乘客单，自己念出了自己的名字，念得比文书快。"
speaker = "captain"
mood = "tense"
cast = ["tariq"]
objectives = [{ kind = "battle", wins = 1, text = "在海上赢下第一仗" }]
deadline = [1557, 10, 15]

[tracks.chapters.timeout]
next = "a03_saadi"
effects = []

[[tracks.chapters.variants]]
key = "a_gave"
when = [{ kind = "flag", flag = "c13_main_tariq_gave_genoese" }]
text = "接舷之后，甲板上滑着鱼油和血。舱口掀开，底下蹲着十一个人：从特拉帕尼回家的朝圣者，两个老人，几个孩子。文书捏着一张朝圣证，证上盖着教区的印，手抖得念不出名字。老舵手在旁边算账：“十一个人，抵得上半船货。船长，你算算。”塔里克张了张嘴，那句话已经到了舌尖：“只劫货，不劫人。货搬走，人留下。”一个女孩从文书手里抽过朝圣证，自己念出了自己的名字，念得比文书快。"

[[tracks.chapters.variants]]
key = "b_knew"
when = [{ kind = "flag", flag = "c13_main_tariq_knew_people" }]
text = "接舷之后，甲板上滑着鱼油和血。舱口掀开，底下蹲着十一个人：珊瑚工的妻子，两个老人，几个孩子。文书捏着一张乘客单，手抖得念不出名字。老舵手在旁边算账：“十一个人，抵得上半船珊瑚。船长，你算算，巴德斯坦这个月的价钱好。”塔里克张了张嘴，那句话已经到了舌尖：“只劫货，不劫人。货搬走，人留下。”一个女孩从文书手里抽过乘客单，自己念出了自己的名字，念得比文书快。酒馆里那个科西嘉人说的没错，舱里有人，他早就知道，还是来了。"

[[tracks.chapters.choices]]
key = "spare"
text = "货搬走，人送到撒丁岛的海滩上放下"
