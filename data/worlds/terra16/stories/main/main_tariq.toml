# c03：塞万提斯被赎。见证章，无选项。
[[tracks.chapters]]
key = "c03_ransomed"
title = "起锚前一刻"
text = "九月，帕夏任满要回伊斯坦布尔，塞万提斯已经被锁上了帕夏的船。三一会的赎金在起锚前一刻凑齐。胡安修士抱着钱袋一路小跑上了跳板，一个一个地念名字：“米格尔——念到了，下来！”桨凳上解下一副链子。留在岸上的葡萄牙教士安东尼奥·德·索萨攥着他写了一半的书，朝船上喊：“他走了，我的书里又少一个能讲故事的人。”塔里克在码头上看着。（心里）他被抓了五年，跑了四回，最后是被钱从桨凳上赎下来的。"
stage = "witness"
window = [[1580, 9, 15], [1580, 10, 31]]
at = "algiers"
speaker = "captain"
mood = "tender"
cast = ["miguel_de_cervantes", "fray_juan", "antonio_de_sosa"]
news = "阿尔及尔的人说：那个独手的西班牙人到底被赎走了，钱是在帕夏的船起锚前一刻凑齐的。"
when = []

[tracks.chapters.default]
