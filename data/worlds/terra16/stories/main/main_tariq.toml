# a04：莫斯塔加奈姆。哈桑帕夏要海面封死。
[[tracks.chapters]]
key = "a04_mostaganem"
title = "莫斯塔加奈姆"
text = "八月，谢利夫河口一带热得冒烟。奥兰的西班牙大军向东去打莫斯塔加奈姆，水不够，补给全靠海上。哈桑帕夏（海雷丁的儿子）的军队在陆上合围，要阿尔及尔的船把海面封死。哈桑在船头对塔里克说：“人人见了我先问我父亲。今天让他们问问我。海上那几条补给船，一条也别放进来。”海滩上溃逃的西班牙兵一边跑一边用卡斯蒂利亚话喊：“摩尔人！我给你钱——”塔里克嘟囔了一句：“石榴熟在海那边，熟了也不等人。”跑起来的人都一个样，看不出哪个是哪边的兵。岸上传来消息：伯爵死在城下了，他的儿子被套上了铁链，要押回阿尔及尔。"
stage = "involve"
window = [[1558, 8, 15], [1558, 9, 15]]
at = "oran"
speaker = "captain"
mood = "tense"
cast = ["hasan_pasha"]
news = "奥兰的人说：伯爵死在莫斯塔加奈姆城下，他的儿子被土耳其人押回了阿尔及尔。"
when = []

[tracks.chapters.default]
next = "a05_first_contract"
effects = []

[[tracks.chapters.choices]]
key = "with_hasan"
text = "跟着哈桑帕夏的船封海，把补给船一条条截下"
