# C13a 主线·一条澪·亚特兰蒂斯补章「潮之扇·雾的那边」（故事 2.0，A5 / E37 契约）
# 2026-11-12 Q03：每章补了 hint（目标文字，照本章的 at / when / window / deadline 写）与 go（去处，等于本章的 at；没有 at 的来信章不写 go）。改条件时请同步改 hint。
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_mio_atlantis_over，主线“那以后”章 c07_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
#   at2 期限改为 1583-12-31（与 at1 一致，配合会议窗口顺延到 11-30，为过雾后的航程留时间）、at2 超时也设 _atlantis_over（理由同林晚灯补章）；at3 的 leave_fan 另设 c13_main_mio_fan_left：主线 c07、c10 要求它为假，扇子留下了的局改走 main_mio.toml 末尾的旁轨 main_mio_fan_left。
# 标签：main；主角一条澪（mio，1540 年生，土佐一条家）。本文件的“我”是澪（speaker = captain），1583—1585 年她四十三到四十五岁。
# 轨道：main_mio_atlantis（kind = main，auto = true，start = at1_fan_pillar），三章：at1 扇子与律法柱 → at2 熄了火的黑暗里 → at3 补陀落的那片海。
#       暂存：A8 的 E63（帷幕、atlantis_port 可达、tabula_smaragdina 作钥匙）与 C11 第二轮合进来以前，整合方不登记本文件
#       （同 C7 暂存配角链的做法）。不登记时 main_mio 照样完整：c05 召请 → c06 黑暗之海 → c07 那以后 → 第三幕余下各章。
# 依据：
#   史实与古典——《克里提亚斯篇》（113d—120d）：三圈海水两圈陆地的环城、包铜包锡包山铜的三道墙、波塞冬神庙里刻着律法的山铜柱、
#       十王穿深蓝长袍在熄了火的黑暗里审判、天亮后把判词刻在金板上。只按原文复原，不添新景物；不写献牛与血的细节。
#       《古今集》假名序“不用力气就能动天地”一句，只作转述，不引原文。
#       补陀落渡海：熊野那智浜之宫补陀洛山寺的渡海船（从外面钉死舱门、四角立小鸟居），见 main_mio a13。只照信众看待自己的方式写。
#       宫中七夕乞巧奠的“流之座”（白绢象征银河、隔绢赠答和歌）：见 C7 bond_reizei_yuki a1。
#   原创——伊斯梅妮（cast/story_atlantic.toml，1564 年生，最年轻的“克莱托”）；“带着歌来的客人可以在会议上说一句话”这条律文；
#       漂来的修士讲的“东方坐钉死的船漂来、又自己走了的人”；判词金板旁的小字；三个落点。
#   待核：无（正文不写年份）。
# 读的旗标：
#   c13_main_mio（门槛，main_mio a00_gate 的 default 设）、c13_main_mio_crossed（main_mio c06 的 cross 设）；
#   c13_main_mio_keepsake（main_mio c05 三个选项设；超时不设）——at1 sing、at3 leave_fan 的门槛：
#       澪的桧扇是回忆里的信物，不是物品；她西来时扇子总在身上（main_mio c06 的正文也把它放在船头），
#       keepsake 读作“c05 那天拿定了主意，要把扇子上的歌交出去”，所以被挡时的提示写成“还没拿定主意”，不写“没带来”。
#   c13_main_mio_fudaraku_seen（main_mio a13 的 follow 成功设）——at3 follow_east 的门槛。
#   C11（整合时登记进 runtime_links.toml 的 pending_flags，owner C11）：atlantis_council_met（at2 的 when）、
#       atlantis_verdict_close、atlantis_verdict_open（at2 的变体）。
# 设的旗标：c13_main_mio_atl_sang（at1 的 sing 设；只在本文件内读：at2 的变体 v3_sang）。
#   本文件不设 main_mio 会读的旗标（补章未登记时，主线读它会因“旗标没有来源”加载失败）；不设 done / end（归 main_mio c10）。
# 物品：mio_pass_flag（过所旗，items_accessory_01，开局就有；at1 的 pass_flag 只查不扣）。
# 技能：arcana_waka_spirit（skills.toml；at2 的 calm_wind 门槛 ≥40）。
# 检定：at2 court_words —— etiquette，base 20 per 7（一般）；失败分支的 news 就是玩家看到的失败回复（也进见闻）。
# 缺省走向：
#   at1 期限 1584-12-31，到期静默结束（next = failed，不写见闻、不写效果）。
#   at2 期限 1585-06-30，到期走 at3（effects 空，不写见闻）。
#   at3 期限 1585-12-31，到期结束（next = done，effects 空，不写见闻）。
#   普通章不写 window（有 window 必须有 default）；简报的窗口起日由门槛旗标代替，止日写成 deadline。
# 等待的包：A8 E63（帷幕、atlantis_port 可达、tabula_smaragdina 作钥匙）；C11 第二轮（atlantis_council 轨道、会议与判决旗标）。
# HIST 占位：无。
# 回忆插画清单：
#   mem-main_mio_atlantis-at3「补陀落的那片海」：亚特兰蒂斯运河口外，无岸的海，一条小早的帆被夕阳照透。
# 给整合方：at3 的 leave_fan 把扇子留在律法柱下，而 main_mio 的 c10 终章（1589 起）写“膝上放着那把桧扇”。
#   按简报，补章不设 main_mio 读的旗标，所以这里不改；补章登记时，可在本文件 leave_fan 设一面旗、给 c10 加一个变体
#   （扇子换成空着的腰带），两处同一轮登记，免得主线读到没有来源的旗标。
# 禁区：父亲之死（b03 已揭开，本文件不提）；“隐藏志向”不点破；伊斯梅妮（十八九岁）只有情谊，不写恋爱；
#       十王不起名、不进 cast、不给直接引语（只写“有人”）；判词的内容归 C11，变体只写一句结果；和歌不写原文，一章至多一句歌意；
#       口头禅“旗钱，先付”“再来一局”不在本文件出现；见闻不写秘密。

[[tracks]]
key = "main_mio_atlantis"
name = "潮之扇·雾的那边"
kind = "main"
start = "at1_fan_pillar"
auto = true
cast = ["ismene"]

# ───────────────────────── at1 扇子与律法柱 ─────────────────────────
# 普通章，at 外港，限期。门槛：澪是主角且穿过了黑暗之海。到期静默结束，不写见闻。
[[tracks.chapters]]
key = "at1_fan_pillar"
title = "扇子与律法柱"
hint = "若哪天船穿过了西边的雾，就在那边的外港上岸；1583年底以前。"
go = { port = "atlantis_port" }
text = "外港的小镇上什么话都有：码头上有人用老派的葡萄牙话讨价，有人念拉丁文的祷词，剩下的我一句也听不懂。往里看，三道环墙一道比一道红，最里面那道在太阳底下像烧着的铜。船只许泊在外港，我是走着过的桥。波塞冬的神庙里立着一根山铜柱，从头到脚刻满了字，柱前站着伊斯梅妮，十八九岁，下巴抬得很高。“你来做什么？——王的名字，先放一放。”我把桧扇打开给她看。扇骨上细细的假名，是那年京都七夕的歌。她不接，只伸一根指头把扇子翻到背面，又翻回来：“这上面的字像水。你们那边的律法，是写在水上的吗？”“写在天上。”我说，“银河两边的人，一年只许见一回，守了上千年。这也是律法。”我伸手要指柱上的字，她把我的手腕挡开：“外面的人，别碰柱子。”她自己找到一行，念给我听：带着歌来的客人，可以在会议上说一句话。她比我第一次进宫时大不了几岁，也一样不肯低头。"
speaker = "captain"
mood = "mystic"
at = "atlantis_port"
cast = ["ismene"]
when = [{ kind = "flag", flag = "c13_main_mio" }, { kind = "flag", flag = "c13_main_mio_crossed" }]
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_mio_atlantis_over" }]

[[tracks.chapters.choices]]
key = "sing"
text = "把扇子交到她手里，唱一遍扇骨上的歌"
requires = [{ kind = "flag", flag = "c13_main_mio_keepsake" }]
hint = "你还没拿定主意，让这把扇子离开自己的手。"
reply = "我把扇子放进她手里，唱了一遍。在宫里，这首歌是压着嗓子念的；在这里我放开了唱，唱到一半嗓子劈了一下，我没停。神庙里很静，柱上的字反着光。唱完，伊斯梅妮把扇子合好，两只手递回来，扇骨朝着我。“调子我记住了。”她说，“词以后再学。你得多待些日子。”"
next = "at2_council"
effects = [{ kind = "flag", flag = "c13_main_mio_atl_sang" }, { kind = "affinity", person = "ismene", value = 8 }]

[[tracks.chapters.choices]]
key = "recite"
text = "扇子不离手，只把歌的意思一句一句念给她听"
reply = "我没松手，只把歌的意思一句一句念出来，念得很慢，像在码头上给不识字的船主念契约。伊斯梅妮听得很认真，嘴唇跟着动。念完，她问：“隔着银河的那两个人，后来见到了没有？”我把扇子合上，插回腰带，低头去看柱脚的石缝。她等了一会儿，没再问。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 4 }]

[[tracks.chapters.choices]]
key = "pass_flag"
text = "把阿濑的过所旗铺在柱前：这是我们那边的律法"
requires = [{ kind = "item", item = "mio_pass_flag", qty = 1 }]
hint = "阿濑的那面旗，已经不在你的船上了。"
reply = "我从怀里取出过所旗，铺在柱前的石板上。旗角磨毛了，旗边是阿濑当年一针一针补过的线，补了三回，三种颜色。伊斯梅妮蹲下去，用指头顺着针脚摸了一圈。“内海上见了这面旗，没人拦船。”我说，“我们那边的律法，就是这个。”她抬起头：“外面的律法，原来是缝出来的。”我去收旗，她按住旗角，又看了一会儿才松手。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 6 }]

# ───────────────────────── at2 熄了火的黑暗里 ─────────────────────────
# 普通章，at 外港，夜里，限期；等 C11 的 atlantis_council_met。会议本身归 C11 的 atlantis_council，这里只写澪的座位与她的一句话。
# 变体是整段替换：v1/v2 读 C11 的判决旗标，结尾加一句；v3 读本文件的 c13_main_mio_atl_sang，加伊斯梅妮哼调子的一句。
[[tracks.chapters]]
key = "at2_council"
title = "熄了火的黑暗里"
hint = "留在外港，等十王的会开起来；1583年年底以前。和歌言灵练到四十，那夜用得上。"
go = { port = "atlantis_port" }
text = "会议照古老的规矩开。火一盏一盏熄掉，熄到最后一盏，十位王已经穿好深蓝的长袍，坐进了黑暗里。今夜他们审的是外面的世界。客人坐末席，我是末席里最末的一个，扇子攥在手里，看不见。黑暗里起了风，从神庙的门缝灌进来，吹得供台上的金杯叮叮地响。有人压着嗓子说，这是不祥。柱子那边传来伊斯梅妮的声音，不高：“客人，只许一句。”风一阵比一阵紧。我想起《古今集》的序里说，歌不用力气，就能动天地。十五岁在宫里背它，只当是一句好听的话。“轮到你了。”伊斯梅妮说，“柱子听着。”看不见扇子，歌还在。"
speaker = "captain"
mood = "mystic"
night = true
at = "atlantis_port"
cast = ["ismene"]
when = [{ kind = "flag", flag = "atlantis_council_met" }]
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "at3_fudaraku_sea"
effects = [{ kind = "flag", flag = "c13_main_mio_atlantis_over" }]

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "会议照古老的规矩开。火一盏一盏熄掉，熄到最后一盏，十位王已经穿好深蓝的长袍，坐进了黑暗里。今夜他们审的是外面的世界。客人坐末席，我是末席里最末的一个，扇子攥在手里，看不见。黑暗里起了风，从神庙的门缝灌进来，吹得供台上的金杯叮叮地响。有人压着嗓子说，这是不祥。柱子那边传来伊斯梅妮的声音，不高：“客人，只许一句。”风一阵比一阵紧。我想起《古今集》的序里说，歌不用力气，就能动天地。十五岁在宫里背它，只当是一句好听的话。“轮到你了。”伊斯梅妮说，“柱子听着。”看不见扇子，歌还在。判词是天亮以后才下的：门要合上。眼下，还轮着我这一句。"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "会议照古老的规矩开。火一盏一盏熄掉，熄到最后一盏，十位王已经穿好深蓝的长袍，坐进了黑暗里。今夜他们审的是外面的世界。客人坐末席，我是末席里最末的一个，扇子攥在手里，看不见。黑暗里起了风，从神庙的门缝灌进来，吹得供台上的金杯叮叮地响。有人压着嗓子说，这是不祥。柱子那边传来伊斯梅妮的声音，不高：“客人，只许一句。”风一阵比一阵紧。我想起《古今集》的序里说，歌不用力气，就能动天地。十五岁在宫里背它，只当是一句好听的话。“轮到你了。”伊斯梅妮说，“柱子听着。”看不见扇子，歌还在。判词是天亮以后才下的：航路要开。眼下，还轮着我这一句。"

[[tracks.chapters.variants]]
key = "v3_sang"
when = [{ kind = "flag", flag = "c13_main_mio_atl_sang" }]
text = "会议照古老的规矩开。火一盏一盏熄掉，熄到最后一盏，十位王已经穿好深蓝的长袍，坐进了黑暗里。今夜他们审的是外面的世界。客人坐末席，我是末席里最末的一个，扇子攥在手里，看不见。黑暗里起了风，从神庙的门缝灌进来，吹得供台上的金杯叮叮地响。有人压着嗓子说，这是不祥。柱子那边传来伊斯梅妮的声音，不高：“客人，只许一句。”过了一会儿，柱子那边有人轻轻哼起扇骨上那首歌的调子——是她。她只学会了调子。风一阵比一阵紧。我想起《古今集》的序里说，歌不用力气，就能动天地。十五岁在宫里背它，只当是一句好听的话。“轮到你了。”伊斯梅妮说，“柱子听着。”看不见扇子，歌还在。"

[[tracks.chapters.choices]]
key = "calm_wind"
text = "在黑暗里咏一首歌，让风停下"
requires = [{ kind = "skill", skill = "arcana_waka_spirit", ge = 40 }]
hint = "你的歌，还动不了风。"
reply = "许给我的那一句话，我拿来咏了一首歌。头一句出口，风还在门缝里叫；唱到第三句，金杯不响了。歌意只有一句：银河那边的人话还没说完，风，你先歇一歇。最后一个音落下去，神庙里静得听得见我的指甲刮过扇骨。黑暗里有人倒吸了一口气。天亮以后，伊斯梅妮领我去看金板：判词旁边多刻了一行小字，说外面的人带来一首让风停下的歌。她指着那行字：“这一行是我刻的。刻歪了，别笑。”"
next = "at3_fudaraku_sea"
effects = [{ kind = "affinity", person = "ismene", value = 6 }, { kind = "fame", value = 3 }]

[[tracks.chapters.choices]]
key = "court_words"
text = "照宫里的礼数开口：先报一条家的名，再说外面的海"
check = { attr = "etiquette", base = 20, per = 7 }
reply = "我照在御所里回话的规矩，先报家名：“土佐一条家之女澪，谨禀诸位殿下——外面的海上，有人为一面旗拔刀，也有人为一首歌等上一年，请殿下们两样一并记下。”说完我伏下身去，额头离地一寸。黑暗里静了一下，十王里有人笑了一声，说这是今晚最体面的一句话。伊斯梅妮在柱旁记的时候，笔尖顿了两回。"
next = "at3_fudaraku_sea"
effects = [{ kind = "affinity", person = "ismene", value = 4 }]
fail = { next = "at3_fudaraku_sea", effects = [], news = "亚特兰蒂斯外港的人说，十王会议那一夜，日本来的女船长照宫里的礼数报了家名，后半句却叫一阵风吹散了。" }

[[tracks.chapters.choices]]
key = "open_fan"
text = "什么也不说，只把扇子打开"
reply = "我一个字也没说，把扇子打开。扇骨在黑暗里“啪”地一声，像帆一下吃满了风。风好像没变，又好像变了，我说不准。十王里没人出声。伊斯梅妮在柱旁记下：客人没有说话。天亮以后她把那一行念给我听，又说：“不说话的客人，柱子记得最牢。”"
next = "at3_fudaraku_sea"
effects = []

# ───────────────────────── at3 补陀落的那片海 ─────────────────────────
# 普通章，at 外港，限期；澪在亚特兰蒂斯的个人终章。三个落点只发同一条回忆，不设 main_mio 读的旗标。
[[tracks.chapters]]
key = "at3_fudaraku_sea"
title = "补陀落的那片海"
hint = "会散了以后还在外港；1585年底以前，定下是走是留。"
go = { port = "atlantis_port" }
text = "会议散了。外港的船一条条解缆，往雾里去的、往雾外去的，傍晚都挤在运河口。伊斯梅妮送我到最外头的石阶，指着东边：“从这里往东，海就一直是海，没有岸。”我的小早系在码头上，扇子插在腰带里。那智那条钉死的船，绳子在纲切岛砍断以后，就是朝这样的海去的。伊斯梅妮说，她小时候听一个漂来的修士讲过一个故事：东方有个人，坐在一条钉死的船里漂到了这里，住了些日子，又自己走了，没人知道去了哪儿。“修士说他走的那天，脸是朝东的。”我没接话。运河口的水一下一下推着船底。她又问：“你还会再来吗？——先别答。答了，就成了律法。”钉子是从外面钉的，门是从里面开的。"
speaker = "captain"
mood = "tender"
at = "atlantis_port"
cast = ["ismene"]
deadline = [1585, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_atlantis_over" }]

[[tracks.chapters.choices]]
key = "follow_east"
text = "解开小早，朝她指的东边再走一天一夜"
requires = [{ kind = "flag", flag = "c13_main_mio_fudaraku_seen" }]
hint = "那智那条船往哪里漂，你当年没有看清。"
reply = "我解开缆，朝她指的方向走。一天一夜，海一直是海：没有岛，没有鸟，连海草也没有，只有水手们越来越少的话。半夜，一个年轻水手问要不要点灯。“点，”我说，“点在船尾。”我坐在船头，把那智那一夜从头想了一遍——那盏油灯是怎样一点一点小下去的。第二天傍晚，太阳从船尾落下去，把帆照透了，帆上的补丁都看得见。我叫人掉头。舵手问：“看见什么了？”“够了。”我说，“看见了。”回到运河口，伊斯梅妮还坐在石阶上，什么也没问，递过来一块干饼。"
next = "done"
effects = [{ kind = "memory", memory = "mem-main_mio_atlantis-at3", title = "补陀落的那片海" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }]

[[tracks.chapters.choices]]
key = "leave_fan"
text = "折回神庙，把扇子留在律法柱下"
requires = [{ kind = "flag", flag = "c13_main_mio_keepsake" }]
hint = "西来以前你没有下决心把扇子交出去，到了柱子跟前，也还舍不得。"
reply = "我折回神庙，把扇子合好，放在律法柱的脚下，扇骨朝里。伊斯梅妮跟在后面，看着，没有拦我。“歌留在这里，”我说，“比留在我身上久。”她蹲下去，把扇子往柱脚里推了推，推到门缝里的风吹不着的地方。她问要不要在柱上记一笔，记下是谁留的。“不用，”我说，“扇骨上有名字。”送我回运河口，她一路没开口，到了石阶才说：“柱子底下的东西，十王也不许动。”腰上轻了一块，回平户的一路上，我的手总要去摸那个地方，摸到的是腰带上一道磨亮的印子。"
next = "done"
effects = [{ kind = "affinity", person = "ismene", value = 6 }, { kind = "memory", memory = "mem-main_mio_atlantis-at3", title = "补陀落的那片海" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }, { kind = "flag", flag = "c13_main_mio_fan_left" }]

[[tracks.chapters.choices]]
key = "go_home"
text = "不约归期，上船回平户"
reply = "“那就不约。”我说。伊斯梅妮点点头，像是很满意：不约，就成不了律法，往后来不来，都不算违誓。我跳上小早，叫人撑离石阶。她在石阶上喊了一句：“下回来，还是先说来意。”扇子还在腰带里，硌着腰。我想抽出来朝她扬一扬，手到了腰带上，又放下了——扬了，就跟约了一样。运河口的水很平，平得照得见两岸的铜墙。外港的铜钟在背后敲起来，我数到第七下，一次也没回头。出了雾，舵手问往哪儿走。“平户。”我说，“风向对，就别等。”"
next = "done"
effects = [{ kind = "memory", memory = "mem-main_mio_atlantis-at3", title = "补陀落的那片海" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }]
