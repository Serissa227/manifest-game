reply = "她一路晕船，吐了三回，吐完还嫌我的船摇得不稳。到了会安的天妃宫，却自己爬上梯子，把人家的灯添满了，管香火的人拦也拦不住，我在梯下扶着。回来她跟邻居说，外头的妈祖也认得她。"
news = "月港林家的老太太头一回出洋，坐着女儿的船去会安看别人家的天妃宫，据说一路晕船。"

# c08 北边的米价：限期交货三十担米到天津。李自成不出场，只在驿卒嘴里一句。
[[tracks.chapters]]
key = "c08_rice_north"
title = "北边的米价"
text = "开春的天津，运河边搭着粥厂，逃荒的人从山东、河南一路走来，排得看不见头。码头的木牌上写着米价，一天改三回。管辽饷的粮官要把南来的米全买走，说辽东的兵也要吃；粥厂的老和尚只要平价：“施主，米是活人的事，价钱是死人的事。”我问粮官出什么价，他伸出两根手指。我说：“客官，两根手指，是二两还是二十两？”他没回话，朝木牌努了努嘴。运河边坐着个被裁掉的驿卒：“驿站一撤，我们这些人，不进山就进坟。”他老家的驿站撤了，马卖了，跟他一起的人都去了山里，有一个叫李自成，以前也是驿站的马夫。我想起阿母说过存粮的话，可我这三十担，是别人的雨天。"
at = "tianjin"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1588, 1, 1] }]
objectives = [{ kind = "goods", good = "rice", qty = 30, at = "tianjin", text = "三十担南米运到天津" }]
deadline = [1589, 3, 31]

[tracks.chapters.timeout]
next = "c09_first_to_pass"
effects = []
news = "天津的粥厂这一冬关了两回门；南边来的米船比往年少了一半，木牌上的米价一天改三回。"

[[tracks.chapters.variants]]
