[[tracks.chapters.choices]]
key = "sell_rice"
text = "两边都不帮，只把米卖给围城的西班牙兵"
next = "b07_rada_list"
effects = [{ kind = "cash", value = 900 }]
reply = "米卖得很好，围城的兵饿得厉害，一袋米还没落地，就有人蹲下去用手捧着吃。王望高看我数钱，笑了：“你们月港人，谁赢都饿不着。”我把钱袋系紧：“大人，这话说反了，是谁饿，我们才饿不着。”他的笑停了一下，又接着笑。"
news = "马尼拉的西班牙兵这个春天吃的米，是月港来的女船主卖的，明朝的把总看着她数钱，笑了一声。"

# b07 拉达的书单：福州。不提 C13d 的拉达请托（1576—77 马尼拉《广舆图》）。
[[tracks.chapters]]
key = "b07_rada_list"
title = "拉达的书单"
text = "盛夏的福州，西班牙使团住在驿馆里，官府客客气气地招待，就是不许他们久留。拉达修士手里攥着一张长长的书单：历书、本草、律例、地图、兵书，他念不出书名，就指着字让我念。“人人都说那里城墙高，可墙后面的兵怎么样，没人说得清。书里会写吗？”南门外的书铺掌柜见了番僧就加价，见了我又减回去：“番僧买书论斤，姑娘买书论本——一样的书，两样的价。”我笑他：“客官，您这秤是看人脸色称的吧？”掌柜也笑，价没动。书单最后一行是《筹海图编》，那里头画的是我家门口的卡子和炮台。拉达把钱袋倒在桌上，只够一半，他问我肯不肯先垫上，到了马尼拉再还。"
at = "fuzhou"
speaker = "captain"
mood = "cheerful"
cast = ["martin_de_rada", "wang_wanggao"]
when = [{ kind = "date", from = [1575, 6, 11] }]
deadline = [1575, 9, 14]

[tracks.chapters.timeout]
