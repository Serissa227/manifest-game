# ───────────── 旁轨（2026-11-11 剧情增写）：旧营的号令（林升，从岑港到江口的墩台） ─────────────
# 母本：说书里的岳飞与风波亭（不反的忠）；《史记·刺客列传》豫让（为知己者死）；
#       文化：愚忠——把一辈子押在一个人身上，那人不在了，令还在；张力：二哥守的那道令，原是防倭船夜里进来，守到后来，防的是自家人夜里出去，而他从来不知道令为什么下。
# 史实（正文一律传闻口吻）：1558 岑港之围（王直旧部据守，俞大猷、戚继光围攻，旧部南走）；1563 平海卫；俞大猷，泉州晋江人，善棍，著《剑经》，1579 年卒于家。
# 入口：o1、o2 读 c13_main_lin_wandeng（a00 的缺省设）加日期；o3 以后读 _act2。o2 在福州、o4 在月港（期限与超时），其余无 at。
# 读养成期旗标：sheng_signed / sheng_promise / sheng_asked / sheng_yue / sheng_lamp_code（人物线 C）；读主线 c13_main_lin_wandeng_japan_run（b01）；
#       读本轨 order_taken / beacon_night 与旁轨“引票”的 ledger_lamps。本轨设 told_father_censhan（o1）给旁轨“义兄的孩子”f2 读。
[[tracks]]
key = "main_lin_wandeng_rw_old_orders"
name = "旧营的号令"
kind = "main"
start = "o1_censhan"
auto = true
cast = ["lin_wandeng"]

[[tracks.chapters]]
key = "o1_censhan"
title = "寨墙上的歌"
text = "秋天，一封信从浙江转了三手才到我船上。信皮上一个“林”字，大得压住半边，里头是别人代写的小楷。二哥说他在俞将军的营里，围着舟山的岑港，围了一个夏天，港里是五峰船主留下的人，据着山寨不肯出来。“夜里寨墙上有人唱漳州的歌，嗓门大，缺牙漏风，唱的是阿爹年轻时候唱的那一支。我认得。我没跟任何人讲。将军说寨里都是倭，我信将军。”末一行才是他自己的字，歪歪扭扭：灯仔，我没出声。"
speaker = "captain"
mood = "tense"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng" }, { kind = "date", from = [1558, 8, 1] }]

[[tracks.chapters.choices]]
key = "tell_father"
text = "托浯屿的船给月港捎话：九伯在岑港"
next = "o2_burning_boats"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_told_father_censhan" }]
reply = "我写了几个字，托浯屿的船转去月港：九伯在岑港，围着他的，是二哥的营。写完我才想到，这几个字到了阿爹手里，他会做什么。船已经走了。后来秦红缨带话回来，说林老大看了信，在码头上站了一夜，第二天照常去看缆，一个字没提。"

[[tracks.chapters.choices]]
key = "mercy"
text = "回信叫二哥：哪一夜寨里的人走，你看错一回"
next = "o2_burning_boats"
effects = []
reply = "我写：岑港四面是水，寨里的人迟早要走，走的那一夜，你守哪一边，就往哪一边看错一回。写完我知道这是叫他犯军法。回信到的时候已经是冬天，代笔的人写：岑港的人往南走了，营里查了三个月，查不出那夜是谁睡着了。底下二哥自己的字，只有两个：没睡。"

[[tracks.chapters.choices]]
key = "silent"
text = "不回信，替他守着这件事"
next = "o2_burning_boats"
effects = []
reply = "我没回。我在罗盘匣底压了一张白纸，算是替二哥记下这件事：岑港，夏天，寨墙上的歌。他没出声，我也不出声。往后很多年，我在海上听见有人唱那支漳州的歌，唱到缺牙漏风的那一句，总要回头看一眼。"

[[tracks.chapters.variants]]
key = "a1_signed"
when = [{ kind = "flag", flag = "rw_lin_wandeng_sheng_signed" }]
text = "秋天，一封信从浙江转了三手才到我船上。信皮上一个“林”字，端端正正，是那年我在名册上替他补的那个样子，代笔的人大概是照着名册描的。二哥说他在俞将军的营里，围着舟山的岑港，围了一个夏天，港里是五峰船主留下的人，据着山寨不肯出来。“夜里寨墙上有人唱漳州的歌，嗓门大，缺牙漏风，唱的是阿爹年轻时候唱的那一支。我认得。我没跟任何人讲。将军说寨里都是倭，我信将军。”末一行才是他自己的字，歪歪扭扭：灯仔，我没出声。"

[[tracks.chapters.variants]]
key = "a2_promise"
when = [{ kind = "flag", flag = "rw_lin_wandeng_sheng_promise" }, { kind = "flag", flag = "rw_lin_wandeng_sheng_signed", value = false }]
text = "秋天，一封信从浙江转了三手才到我船上。信皮上一个“林”字，大得压住半边，里头是别人代写的小楷。二哥说他在俞将军的营里，围着舟山的岑港，围了一个夏天，港里是五峰船主留下的人，据着山寨不肯出来。“夜里寨墙上有人唱漳州的歌，嗓门大，缺牙漏风，唱的是阿爹年轻时候唱的那一支。我认得。我没跟任何人讲。将军说寨里都是倭，我信将军。”末两行才是他自己的字，歪歪扭扭：灯仔，我没出声。海上官船多，你喊了没有？我没听见。"

[[tracks.chapters]]
key = "o2_burning_boats"
title = "沙滩上的火"
text = "平海卫打完的那个秋天，闽江口外的沙滩上一连烧了三天船。烧的是名单上“接济倭寇”的人家的船，一条一条拖上岸，浇了油，点火。我在烟里找到二哥，他已经是管十个兵的哨长，脸被火烤得发亮，手里举着火把，见了我先笑，笑完才想起火把还在手上。“将军拍了我的肩，”他说，“平海卫我砍了两个。名单上咱家那一行，将军拿朱笔划了。”他回头看那些船，“别家的，划不了。”"
at = "fuzhou"
speaker = "captain"
mood = "tense"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng" }, { kind = "date", from = [1563, 8, 1] }]
deadline = [1563, 12, 31]

[tracks.chapters.timeout]
next = "o2b_post"
effects = []
news = "平海卫以后，闽江口外的沙滩上一连烧了三天船，说是名单上接济倭寇的人家的。"

[[tracks.chapters.choices]]
key = "curse"
text = "当着他的兵骂他：你烧的也是乡亲的船"
next = "o2b_post"
effects = []
reply = "我骂得很难听，骂他认了一个将军，就不认得月港的人了。他的兵都转过头来看。二哥的脸从红变白，举着火把站着，像一根不知道往哪边倒的桅杆。最后他说：“将军的令。我不烧，别人也烧。我烧，我知道烧的是谁家的。”他把火把扔进了最近的那条船。"

[[tracks.chapters.choices]]
key = "plead"
text = "指着最边上那条小渔船：就这一条，给我"
next = "o2b_post"
effects = []
reply = "那条船的船帮上画着一只歪歪的眼睛，是渔家孩子画的。二哥看看船，看看我，又看看远处骑马的军官，咬着牙叫他的兵把船推回水里：“它自己漂走的。我没看见。”船漂到江心，被一户人家划走了。那天晚上他挨了二十军棍，后来托人给我带话，只一个字：值。"

[[tracks.chapters.choices]]
key = "watch"
text = "什么也不说，陪他站着，看火烧完"
next = "o2b_post"
effects = []
reply = "我站在他旁边，一直站到天黑。火烧完一条，又拖来一条。二哥不说话，也不赶我走，火光照着他的半边脸，我看见他嘴唇在动，像在数什么，数的是烧了几条，还是平海卫砍了几个，我听不出来。收兵的号角响了，他走之前把腰上的水囊解下来塞给我：“烟大，润润嗓子。”"

[[tracks.chapters.variants]]
key = "a1_asked"
when = [{ kind = "flag", flag = "rw_lin_wandeng_sheng_asked" }]
text = "平海卫打完的那个秋天，闽江口外的沙滩上一连烧了三天船。烧的是名单上“接济倭寇”的人家的船，一条一条拖上岸，浇了油，点火。我在烟里找到二哥，他已经是管十个兵的哨长，脸被火烤得发亮，手里举着火把，见了我先笑，笑完才想起火把还在手上。“将军拍了我的肩，”他说，“平海卫我砍了两个。名单上咱家那一行，将军拿朱笔划了。灯仔，你当年问我的那句，我现在答得上了：将军没叫我烧咱家的。”他回头看那些船，“叫我烧的，是别家的。”"

[[tracks.chapters]]
key = "o2b_post"
title = "描下来的令"
text = "这一年二哥的信是他自己写的，错字比对的字还多，我连猜带蒙才读通。营裁了，兵散了，他没回家，跟县里讨了个差事，去守九龙江口南岸那座烽墩。“将军那年巡到江口，在墩上下过一道令，我在场。令还在，就得有人守。”信里另夹着一张纸，是他照着墩上那块令牌一笔一笔描下来的，描得歪歪扭扭：夜见江口有灯出海，即举火报营。纸角上还有一行：“灯仔，你的船要是夜里过江口，把灯笼收进舱里。我眼神好。”"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1574, 9, 1] }]

[[tracks.chapters.choices]]
key = "coat"
text = "回信：墩上冷，我给你捎一件棉袄"
next = "o3_two_mournings"
effects = []
reply = "棉袄托船家捎去，是在吕宋买的，絮的是木棉，轻。二哥回信说穿上了，墩上的风从海上直灌，木棉挡得住。又说他把我那盏灯笼的样子讲给墩上另外两个兵听，叫他们夜里看见红纸灯笼，先别举火，来报他。“我看。我认得。”"

[[tracks.chapters.choices]]
key = "why"
text = "回信问：将军下这道令，为的是什么"
next = "o3_two_mournings"
effects = []
reply = "二哥回信只有一行，是自己写的：“将军下的令，不问为什么。”字写得很用力，“问”字的门框写歪了，像被人推了一把。我把这张纸压进罗盘匣，跟他描的那块令牌压在一处。"

[[tracks.chapters.choices]]
key = "stow"
text = "回信答应他：夜里过江口，灯笼收进舱里"
next = "o3_two_mournings"
effects = []
reply = "我写：好，夜里过江口，灯笼收进舱里，不叫你为难。写完我把腰上的灯笼摸了一遍，这是我头一回答应别人把它收起来。往后夜里过九龙江口，我真把它收进了舱里，远远看见南岸墩上那一点火，就叫舵工把船再往外让一让。"

[[tracks.chapters]]
key = "o3_two_mournings"
title = "两场孝"
text = "阿母的信里，二哥的事只占了三行。阿爹出殡那天，他说墩上的令不能离人，没回来。去年秋天，听说俞将军死在泉州的家里，他倒是去了，把墩托给了别人，从漳州走到泉州，走了三天，在将军家门口跪了一夜，额头磕破了。“给将军戴的孝，比给你阿爹的重。”阿母写到这里，墨停了很久，洇出一个圆点，“我不怪他。他这一辈子，就这一个人拍过他的肩。”"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1580, 1, 15] }]

[[tracks.chapters.choices]]
key = "write"
text = "给二哥写信，只写阿爹最后那几天"
next = "o4_beacon"
effects = []
reply = "我把阿母信里阿爹最后几天的事，一样一样抄给二哥：阿爹最后一夜还问了缆绳，问二哥收帆的那只手好没好。我没写一句怪他的话。信托到墩上，过了很久才有回音，是他自己写的，字比从前还歪，只有一行：阿爹的缆，我替他记着。"

[[tracks.chapters.choices]]
key = "angry"
text = "回信给阿母：他给外人跪，给阿爹不跪"
next = "o4_beacon"
effects = []
reply = "我写得很冲，说他认了一个姓俞的当爹。写完才看见阿母那一句“我不怪他”，揉了，重写，重写的那封还是冲。阿母回信说，信她念给二哥听了，他听完一句话没说，第二天把将军发的那块腰牌和阿爹那根烟锅，一起挂在了墩上那块令牌底下。"

[[tracks.chapters.choices]]
key = "incense"
text = "在船头给两个人各点一炷香"
next = "o4_beacon"
effects = []
reply = "我在船头摆了两只碗，盛上沙，各插一炷香：一炷给阿爹，一炷给那个我没见过的将军。船工问第二炷给谁，我说给二哥的爹。他们听不懂，我也不解释。两炷香烧得一样快，烟往同一边飘，飘到桅杆那里缠在一起，又分开了。"

[[tracks.chapters.variants]]
key = "a1_yue"
when = [{ kind = "flag", flag = "rw_lin_wandeng_sheng_yue" }]
text = "阿母的信里，二哥的事只占了几行。阿爹出殡那天，他说墩上的令不能离人，没回来。去年秋天，听说俞将军死在泉州的家里，他倒是去了，把墩托给了别人，从漳州走到泉州，走了三天，在将军家门口跪了一夜，额头磕破了。回来以后，他在渡口的茶棚里坐到天黑，说书的又在讲风波亭，他没哭，听完跟说书的说：岳爷爷死的时候，还有个皇帝；将军死的时候，什么也没有。“我不怪他，”阿母写，“他这一辈子，就这一个人拍过他的肩。”"

[[tracks.chapters]]
key = "o4_beacon"
title = "墩上的令"
text = "九龙江口南岸那座旧烽墩，开海以后就没人修了，墙塌了一角，台上长着草。二哥在那里，墩上最后一个兵。营早撤了，饷是县里给的，给得很少。墩台的木柱上钉着一块令牌，漆掉了大半，字还认得出：夜见江口有灯出海，即举火报营。“将军下的令，”二哥说，“没人撤，就还在。”他的头发白了一半，嗓门还是那么大。我说营都没了，你举火给谁看。他看着江口，说：“令在。”"
at = "yuegang"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
