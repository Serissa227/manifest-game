[[tracks.chapters.variants]]
key = "turned"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_turned_from_lamp" }]
text = "那夜我掉了头，绕了半个月远路才到那霸，那个油纸包一路没拆。封皮上写着“琉球久米村天妃宫”，墨迹被海水泡过又晾干。那霸的久米村住的都是早年过去的闽人，天妃宫里守香的是个缠小脚的老妇人。我站在殿门口等她拆信。她读了很久，读到最后把信贴在胸口：是她哥哥四十年前写给他们娘的家书，船沉在半路上，信却漂到了今天。“四十年了，”她说，“信回来了，人没回来。”她把信供在天妃像前，说娘等这封信，等到死。那天夜里港口外又起了雾，殿前那盏长明灯照得见门槛，照不见码头。"

[[tracks.chapters.choices]]
key = "deliver"
text = "把信交到老人手里，什么也不问"
next = "b01_kaihai"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_two_lamps" }, { kind = "reputation", faction = "ryukyu", value = 3 }]
reply = "老人点了三炷香，一炷给哥哥，一炷给娘，一炷递给我。我不会插，插歪了，她伸手扶正，什么也没说。"
news = "那霸久米村的天妃宫收到一封四十年前的家书，送信的是一条福建鸟船；那天夜里港外起了雾。"

[[tracks.chapters.choices]]
key = "ask_who"
text = "问老人，她哥哥那条船沉在哪里"
next = "b01_kaihai"
effects = [{ kind = "fame", value = 1 }]
reply = "她说只听人讲过沉在半路。她翻出一本旧香火簿，四十年前那一页记着哥哥捐的二十文，字是庙祝代写的。我把船名抄下来，回去问了几个老船户，谁也没听过这条船。"
news = "那霸久米村的天妃宫里，有个月港来的姑娘翻了一夜旧香火簿，打听一条四十年前沉了的船。"

[[tracks.chapters.choices]]
key = "tea"
text = "把红灯笼挂到殿前的长明灯旁边，陪她守一夜"
requires = [{ kind = "item", item = "tianfei_lantern", qty = 1 }]
hint = "你腰间空着，没有灯可挂。"
next = "b01_kaihai"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_two_lamps" }, { kind = "memory", memory = "mem-main_lin_wandeng-a10", title = "两盏灯" }]
reply = "老人把我的灯笼提起来看了看，搬了条凳子到门槛边。两盏灯并排挂在殿檐下，一盏红纸的，一盏琉璃的。她坐着折了半夜纸钱，折好的码在香炉边上。天亮前雾散了，她把灯笼摘下来还我，只说了一句：“下回起雾，挂两盏。”"
news = "那霸久米村的天妃宫起雾那夜挂了两盏灯，红纸的那盏是月港来的姑娘带来的。"

# ───────────── 第二幕「潮涌」1567—1577 ─────────────

# b01 十年后的月港：开海头一年。只写县衙、船引与日本禁航；不写周砚、小蛮、许采与第一张船引（C7）。
[[tracks.chapters]]
key = "b01_kaihai"
title = "十年后的月港"
text = "开春，我的鸟船十年来头一回大白天开进九龙江口，卡子上的兵只看了一眼船名就挥手放行。天妃宫墙上贴着新告示，准贩东西二洋，盖着巡抚涂泽民的关防；末一行“倭国不许”，被人用指甲刮花了。母亲站在宫门的石阶上，一盏一盏给殿前的灯添油：“灯我一直点着。你看，一盏也没灭。”父亲坐在台阶底下数进港的帆，数错了，又从头数。宫门外摆着海防馆书办的桌子，领船引的人排到了江边；几位士绅凑在一起，说要再上一道条陈，把广州、宁波也开了。轮到我，书办头也不抬：“船名、梁头、往哪一洋——倭国不许，写了也白写。”我这才想起，我最赚钱的那条路，偏偏这张纸上没有。港开了，我反倒不知道先迈哪只脚上岸。"
window = [[1567, 2, 1], [1567, 6, 30]]
at = "yuegang"
stage = "involve"
speaker = "captain"
mood = "tender"
cast = ["tu_zemin"]
news = "开海这一年的月港，天妃宫墙上贴的告示前头挤满了人，最末一行“倭国不许”被人用指甲刮花了。"

[tracks.chapters.default]
next = "b02_last_page"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }]
news = "开海这一年的月港，天妃宫墙上的告示前头挤满了人；林家那条鸟船没回来看。"

[[tracks.chapters.variants]]
key = "burned"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_burned_pass" }]
text = "开春，我的鸟船十年来头一回大白天开进九龙江口，卡子上的兵只看了一眼船名就挥手放行。天妃宫墙上贴着新告示，准贩东西二洋，盖着巡抚涂泽民的关防；末一行“倭国不许”，被人用指甲刮花了。母亲站在宫门的石阶上，一盏一盏给殿前的灯添油：“灯我一直点着。你看，一盏也没灭。”父亲坐在台阶底下数进港的帆，数错了，又从头数。宫门外摆着海防馆书办的桌子，领船引的人排到了江边；几位士绅凑在一起，说要再上一道条陈，把广州、宁波也开了。轮到我，书办头也不抬：“船名、梁头、往哪一洋——倭国不许，写了也白写。”他递来的纸是真的。十年前我在舱里烧掉一张假的，当时没想过会有这一天。我这才想起，我最赚钱的那条路，偏偏这张纸上没有。港开了，我反倒不知道先迈哪只脚上岸。"

