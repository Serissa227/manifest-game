[[tracks.chapters.choices]]
key = "carry_gifts"
text = "替他们把钟和三棱镜平平安安运上西江"
next = "c07_mothers_lamp"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_carried_gifts" }, { kind = "reputation", faction = "jesuits", value = 4 }]
reply = "一路上钟每到时辰就响，船工每响一回就念一声佛，念到后来连橹手都跟着钟摆的节拍划。到了肇庆，知府拿三棱镜对着太阳照，墙上出了一道虹，他笑得像个孩子。罗明坚在一边小声说：“这个不是妖术。”知府没听见，利玛窦听见了，忍着没笑。"
news = "广州码头有条月港鸟船替两个番僧往肇庆运一口会自己报时的钟，船工一路上都不敢睡。"

[[tracks.chapters.choices]]
