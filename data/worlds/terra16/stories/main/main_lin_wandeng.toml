[[tracks.chapters.choices]]
key = "map_print"
text = "跟利玛窦要一张刚刻出来的世界图"
requires = [{ kind = "date", from = [1584, 10, 1] }]
hint = "图还在刻，木板上只有半个世界。"
next = "c07_mothers_lamp"
effects = [{ kind = "item", item = "ricci_zhaoqing", qty = 1 }, { kind = "flag", flag = "c13_main_lin_wandeng_map_print" }]
reply = "他从木板上揭下一张，递给我的时候两只手都不敢碰字，只捏着边。那张墨还没干透，西边那片大陆的边上蹭花了一块。我说正好，那里本来就看不清。他看了看那一块，笑了：“下一版我留着这个污点。”"
news = "广州码头上，番僧利玛窦送了月港来的女船主一张墨还没干透的世界图，她说西边那块蹭花了正好。"

# c07 阿母的长明灯：灯钥。油与长明灯是这条线里“油”的正经用处；许采只在变体里一句。
[[tracks.chapters]]
key = "c07_mothers_lamp"
title = "阿母的长明灯"
text = "冬夜的天妃宫，殿前那盏长明灯挂得很高，要踩着梯子添油。母亲七十多了，爬到第三级就喘，扶着梯子不肯下来；宫里的老司香病了一冬。两个哥哥在殿外吵：灯钥该归谁，船该谁管，妹子是不是该收心了。大哥冲我吼：“你一年在家住不满一个月，灯钥给你，灯给谁添？”母亲从梯子上下来，把油库的铜钥匙放进我手心，钥匙上缠着一根褪色的红绳，是热的，被她攥了一冬。“晴天要把下雨天的粮存好，”她说，“灯也一样，有油的时候，就得备着没油的日子。我这辈子只怕一件事，跟你一样怕灯灭，所以我一盏也没让它灭过。”门外北边来的船户在说，山东的米价贵得吃人。"
at = "yuegang"
speaker = "captain"
mood = "sad"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1586, 1, 1] }]
deadline = [1587, 10, 31]

[tracks.chapters.timeout]
next = "c08_rice_north"
effects = []

