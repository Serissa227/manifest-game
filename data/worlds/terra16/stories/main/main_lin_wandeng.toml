news = "平户的人说，月港林家的女儿当着五峰船主的面问了一句“这禁几时开”，船主半天没言语，赏了林家一个泊位。"

# a03 濠镜的草寮：葡萄牙人住进来，陆归帆译到“借”字。只写一个“借”字，不写租约。
[[tracks.chapters]]
key = "a03_haojing"
title = "濠镜的草寮"
text = "台风季的濠镜，半岛上一排新搭的草寮，葡萄牙人说是借地晾货，晾着晾着就住下了。通事陆归帆站在一只空木桶上替两边喊价，一句官话一句番话，不肯少念一个字。他译到那个“借”字停了停，索性两种意思都念一遍：葡萄牙人听成“租”，香山县来看的小官听成“暂住”，两边都点了头。“条款我念两遍，葡萄牙话一遍，官话一遍——哪个字没听懂，当场问！”卡塔丽娜·佩雷拉挨家数门，转头瞪我：“刚下船？找哪一家、住哪条街，说吧。”码头边一个炮手正显摆一门佛郎机，后膛敞着，子铳摆了一排，像一排酒壶。我冲他拱拱手：“客官，这门炮卖不卖？不卖我就光看看——看看又不要钱。”"
window = [[1557, 7, 20], [1557, 10, 15]]
at = "macao"
stage = "involve"
speaker = "captain"
mood = "cheerful"
cast = ["lu_guifan", "catarina_pereira"]
news = "濠镜的葡萄牙人搭起了草寮，码头上有个通事站在木桶上，一句官话一句番话地喊价。"

[tracks.chapters.default]
next = "a04_ningbo"
effects = []
news = "濠镜的葡萄牙人头一年搭的草寮，入冬前换了半边砖墙；香山县的人来看过一回，什么也没说。"

[[tracks.chapters.choices]]
key = "shout_prices"
text = "跳上木桶替陆归帆喊价，抽一成牙钱"
check = { attr = "commerce", base = 20, per = 7 }
next = "a04_ningbo"
effects = [{ kind = "cash", value = 600 }, { kind = "affinity", person = "lu_guifan", value = 5 }]
