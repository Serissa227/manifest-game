# a08 平海卫的捷报：福州茶棚里的说书人。变体读 h19_taizhou_pinghai_coast_pacified_early。
[[tracks.chapters]]
key = "a08_pinghai"
title = "平海卫的捷报"
text = "福州的茶棚里，说书人拍着醒木：去年冬天倭寇破了兴化城，今年开春戚家军又回来了，三路兵一早合围平海卫，倭船连缆都没来得及解。“听说是潮水帮的忙！”有人插嘴。说书人接着讲俞大猷的棍，说俞老将军教兵先学棍，棍是百艺的根本。讲完了，角落里有人问：打完了，海上的禁会不会松一点？没人答。"
window = [[1563, 5, 15], [1563, 7, 31]]
at = "fuzhou"
stage = "rumor"
mood = "cheerful"
cast = ["qi_jiguang", "yu_dayou"]
news = "福州的茶棚里都在说平海卫：三路兵一早合围，倭船没来得及解缆。"

[tracks.chapters.default]
next = "a09_black_ditch"
effects = []

[[tracks.chapters.variants]]
key = "early"
when = [{ kind = "flag", flag = "h19_taizhou_pinghai_coast_pacified_early" }]
text = "福州的茶棚里，说书人拍着醒木想讲平海卫，台下的人先笑了：倭船去年冬天就散了，那一仗根本没打起来。说书的只好改讲戚家军回浙江的事，讲俞大猷的棍，讲得没精打采。角落里有人问：倭寇没了，海上的禁会不会松一点？没人答。"

[[tracks.chapters.variants]]
key = "guided"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_guided_qi" }]
text = "福州的茶棚里，说书人拍着醒木：去年冬天倭寇破了兴化城，今年开春戚家军又回来了，三路兵一早合围平海卫，倭船连缆都没来得及解。“听说是潮水帮的忙！”有人插嘴。说书人接着讲俞大猷的棍，说俞老将军教兵先学棍，棍是百艺的根本。讲完了，角落里有人问：打完了，海上的禁会不会松一点？没人答。倒是有人提起去年秋天替戚家军走兴化湾的那条月港鸟船。"

# a09 黑水沟的雾：雾里撞上一块沉船的船板，板上捆着一个油纸包（a10 的信从这里来）。
[[tracks.chapters]]
key = "a09_black_ditch"
title = "黑水沟的雾"
text = "冬天，过澎湖外的黑水沟，雾从海面上漫过来，近得伸手就湿。罗盘的针在碗里打转，船工开始往海里撒纸钱。我腰上的红灯笼跳了三下，火苗缩得只剩一点，我最怕的就是这个。雾里有浪打礁的声音，听不出在左在右。船头咚地撞上一样东西，捞上来是半块泡得发黑的船板，钉子锈没了，板上拿麻绳捆着个油纸包。“沉船的东西！”舵工压低嗓子喊，“快扔回去，留着要招它的主人来的！”我最爱听这种故事，可从没想过自己会站在故事里头。我把油纸包解下来，船板扔回了海里。"
speaker = "captain"
mood = "mystic"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1564, 1, 1] }]

[[tracks.chapters.choices]]
key = "follow"
text = "叫人打铅锤，船头一寸一寸地量水"
check = { attr = "seamanship", base = 20, per = 7 }
next = "a10_two_lamps"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_followed_lamp" }]
reply = "铅锤一回一回放下去，水深报上来，我照着报数拐舵，每拐一下，都听见礁石在船底下喘气。天亮前雾散了，我腰上的灯笼又稳稳地亮着，船工们谁也不肯先说话。"
news = "澎湖外的黑水沟起了一夜大雾，有条月港鸟船打着铅锤摸了过去。"

[tracks.chapters.choices.fail]
next = "a10_two_lamps"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_followed_lamp" }, { kind = "cash", value = -300 }]
news = "澎湖外的雾夜里，月港的鸟船摸错了水，船底擦过一块礁，修船的钱够船主心疼半年。"

[[tracks.chapters.choices]]
key = "answer"
text = "把天妃宫的红灯笼举过头顶，叫船工都看着灯"
requires = [{ kind = "item", item = "tianfei_lantern", qty = 1 }]
hint = "你摸了摸腰间，灯笼不在身上。"
next = "a10_two_lamps"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_answered_lamp" }]
reply = "我把灯笼举过头顶，竹骨在手里发烫。火苗一点一点长回来，船工们看见灯没灭，纸钱撒了半把就攥住了。舵工盯着灯影把了一夜舵，天亮时船已经在沟南。"
news = "澎湖外的黑水沟起了大雾，月港鸟船上有人把一盏红灯笼举了一夜，船平平安安过了沟。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头，叫船工烧纸，谁也不许回头看"
next = "a10_two_lamps"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_turned_from_lamp" }]
reply = "我们掉头往北，烧了半舱纸钱，没人敢回头。我回头了：雾压在沟上，一直没散。"
news = "澎湖外的黑水沟起了大雾，有条月港的鸟船掉头绕了远路，烧了半舱纸钱。"

# a10 两盏灯：久米村天妃宫的家书（a09 在雾里从沉船板上解下的油纸包）。不写信怎么漂到黑水沟。
[[tracks.chapters]]
key = "a10_two_lamps"
title = "两盏灯"
text = "雾散以后，我拆开那个油纸包，里头是一封信，封皮上写着“琉球久米村天妃宫”，墨迹被海水泡过又晾干。那霸的久米村住的都是早年过去的闽人，天妃宫里守香的是个缠小脚的老妇人。我站在殿门口等她拆信。她读了很久，读到最后把信贴在胸口：是她哥哥四十年前写给他们娘的家书，船沉在半路上，信却漂到了今天。“四十年了，”她说，“信回来了，人没回来。”她把信供在天妃像前，说娘等这封信，等到死。那天夜里港口外又起了雾，殿前那盏长明灯照得见门槛，照不见码头。"
at = "naha"
speaker = "captain"
mood = "mystic"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1564, 3, 1] }]
deadline = [1566, 10, 31]

[tracks.chapters.timeout]
next = "b01_kaihai"
effects = []

[[tracks.chapters.variants]]
key = "answered"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_answered_lamp" }]
text = "雾散以后，我拆开那个油纸包，里头是一封信，封皮上写着“琉球久米村天妃宫”，墨迹被海水泡过又晾干。那霸的久米村住的都是早年过去的闽人，天妃宫里守香的是个缠小脚的老妇人。我站在殿门口等她拆信。她读了很久，读到最后把信贴在胸口：是她哥哥四十年前写给他们娘的家书，船沉在半路上，信却漂到了今天。“四十年了，”她说，“信回来了，人没回来。”她把信供在天妃像前，说娘等这封信，等到死。她看见我腰上的红灯笼，问是不是月港天妃宫的竹骨。那天夜里港口外又起了雾，殿前那盏长明灯照得见门槛，照不见码头。"

