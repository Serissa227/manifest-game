# ───────────── 旁轨（2026-11-11 剧情增写）：义兄的孩子（林老大与方九，托孤） ─────────────
# 母本：《史记·刺客列传》豫让（士为知己者死）；元杂剧《赵氏孤儿》的托孤；
#       文化：江湖的义与它的盲；张力：阿爹守了一辈子的诺，守住了一个孩子，也替一个烧过村子的人收了尸。
# 方九（九伯）与十郎（方念）是新人物，只在正文；与 a05 浯屿的二十四将、秦红缨的镖船相接；f1 的半枚钱接养成期人物线 B。
# 史实（传闻口吻）：1558 岑港之围、旧部南走浯屿、1559 年闽南沿海被扰；王直在两种历史结果里都是 1557 年冬起被拘在杭州，f1、f2 不分支。
# 入口：f1、f2 读 c13_main_lin_wandeng 加日期；f3、f4 读 _act2。f3 在月港（期限与超时），其余无 at。
# 读养成期旗标：coin_lantern / coin_compass / coin_refused / half_coin / jiubo_wrote / asked_jiubo（人物线 B）；读旁轨“旧营的号令”的 told_father_censhan；
#       本轨设 child_aboard（f1）、jurou_father（f3）给 f3、f4 的变体读。
[[tracks]]
key = "main_lin_wandeng_rw_sworn_child"
name = "义兄的孩子"
kind = "main"
start = "f1_other_half"
auto = true
cast = ["lin_wandeng"]

[[tracks.chapters]]
key = "f1_other_half"
title = "另一半"
text = "夜里，鸟船泊在浯屿外的背风处，一条没挂灯的小艇靠上来。艇上一个瘦汉子，背着一个孩子，十来岁，剃着五岛那边的头，眼睛却是漳州人的眼睛。汉子说九伯在舟山的岑港，官军围得紧，出不来了，托他把孩子送到林老大手里。“九伯说，林老大的灯仔在海上跑，船头挂一盏补过的红纸灯笼，找灯笼就不会错。”孩子从脖子上解下一根红绳，绳上拴着半枚永乐钱，带着“乐”字，伸到我面前，用很生的唐话说了一个字：“对。”汉子说，孩子叫十郎，唐名方念。"
speaker = "captain"
mood = "tender"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng" }, { kind = "date", from = [1558, 5, 1] }]

[[tracks.chapters.choices]]
key = "send_home"
text = "托秦红缨的镖船，把孩子送回月港交给阿爹"
next = "f2_head"
effects = []
reply = "秦红缨听完，看了孩子一眼，只问一句：“倭话说得多，唐话说得少，路上有人问，算谁家的？”我说算林家的远房侄子，娘死了，爹在海上。她点点头，把孩子抱上镖船，用自己的斗篷裹住。后来阿母来信说，阿爹在码头上接的人，一句话没说，把孩子扛在肩上走回了家。那年阿爹四十六了。"

[[tracks.chapters.choices]]
key = "keep_aboard"
text = "把孩子留在鸟船上，跟我跑海"
next = "f2_head"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_child_aboard" }]
reply = "月港不开，我回不去，孩子也送不回去。我让他睡在司香的那个角落，挨着妈祖龛。头几夜他不肯睡，抱着膝盖坐着，眼睛盯着舱口，像在等谁来接。第五夜起风，船摇得厉害，他终于睡着了，手里攥着那半枚钱，嘴里说了一句倭话。老舵工懂一点，说是“阿爹”。"

[[tracks.chapters.choices]]
key = "ask_boy"
text = "蹲下来，问孩子自己想去哪里"
next = "f2_head"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_child_aboard" }]
reply = "我用半生不熟的倭话问他。他想了很久，指了指舟山的方向。我说那边回不去。他又想了很久，指了指我腰上的灯笼。汉子在一旁苦笑：“他娘说，跟着灯走，就不会丢。”我把灯笼的提绳解下一截，系在他手腕上。他就这样留在了我的船上。"

[[tracks.chapters.variants]]
key = "a1_lantern"
when = [{ kind = "flag", flag = "rw_lin_wandeng_coin_lantern" }]
text = "夜里，鸟船泊在浯屿外的背风处，一条没挂灯的小艇靠上来。艇上一个瘦汉子，背着一个孩子，十来岁，剃着五岛那边的头，眼睛却是漳州人的眼睛。汉子说九伯在舟山的岑港，官军围得紧，出不来了，托他把孩子送到林老大手里。“九伯说，林老大的灯仔在海上跑，船头挂一盏补过的红纸灯笼，找灯笼就不会错。”孩子从脖子上解下一根红绳，绳上拴着半枚永乐钱，带着“乐”字。我解下灯笼底下那半枚，两半一凑，“永”和“乐”对上了，剪口的细齿咬在一起，像两排牙咬住了一句话。孩子盯着那枚合起来的钱，用很生的唐话说：“对。”汉子说，孩子叫十郎，唐名方念。"

[[tracks.chapters.variants]]
key = "a2_compass"
when = [{ kind = "flag", flag = "rw_lin_wandeng_coin_compass" }]
text = "夜里，鸟船泊在浯屿外的背风处，一条没挂灯的小艇靠上来。艇上一个瘦汉子，背着一个孩子，十来岁，剃着五岛那边的头，眼睛却是漳州人的眼睛。汉子说九伯在舟山的岑港，官军围得紧，出不来了，托他把孩子送到林老大手里。“九伯说，林老大的灯仔在海上跑，船头挂一盏补过的红纸灯笼，找灯笼就不会错。”孩子从脖子上解下一根红绳，绳上拴着半枚永乐钱，带着“乐”字。我回舱里掀开罗盘匣，从针碗底下抠出带“永”字的那一半，两半一凑，严丝合缝。针碗里的水晃了一下。孩子盯着那枚合起来的钱，用很生的唐话说：“对。”汉子说，孩子叫十郎，唐名方念。"

[[tracks.chapters.variants]]
key = "a3_refused"
when = [{ kind = "flag", flag = "rw_lin_wandeng_coin_refused" }]
text = "夜里，鸟船泊在浯屿外的背风处，一条没挂灯的小艇靠上来。艇上一个瘦汉子，背着一个孩子，十来岁，剃着五岛那边的头，眼睛却是漳州人的眼睛。汉子说九伯在舟山的岑港，官军围得紧，出不来了，托他把孩子送到林老大手里。“九伯说，林老大的灯仔在海上跑，船头挂一盏补过的红纸灯笼，找灯笼就不会错。”孩子从脖子上解下一根红绳，绳上拴着半枚永乐钱，带着“乐”字，伸到我面前。另一半还在阿爹的腰带里，在月港，当年是我没肯接。孩子等了很久，见我手里没有，眼睛暗了一下，用很生的唐话问：“不对？”汉子说，孩子叫十郎，唐名方念。"

[[tracks.chapters.variants]]
key = "a4_wrote"
when = [{ kind = "flag", flag = "rw_lin_wandeng_jiubo_wrote" }, { kind = "flag", flag = "rw_lin_wandeng_coin_lantern", value = false }, { kind = "flag", flag = "rw_lin_wandeng_coin_compass", value = false }, { kind = "flag", flag = "rw_lin_wandeng_coin_refused", value = false }]
text = "夜里，鸟船泊在浯屿外的背风处，一条没挂灯的小艇靠上来。艇上一个瘦汉子，背着一个孩子，十来岁，剃着五岛那边的头，眼睛却是漳州人的眼睛。汉子说九伯在舟山的岑港，官军围得紧，出不来了，托他把孩子送到林老大手里。“九伯说，林老大的灯仔在海上跑，船头挂一盏补过的红纸灯笼，找灯笼就不会错。”孩子从怀里掏出一张揉得发软的纸，上面三个大字：方十郎，旁边画着一个提灯的小人。他指指小人，又指指我，用很生的唐话说了一个字：“对。”汉子说，孩子叫十郎，唐名方念。"

[[tracks.chapters]]
key = "f2_head"
title = "竿子上的头"
text = "第二年夏天，月港来的船带来阿母的信。岑港的人往南走了，有几条船泊过浯屿，上岸烧过海沧那边的两个渔村。官军追上来，在海上拿住了几十个，九伯也在里头。斩首那天，九伯的头挂在海沧渡口的竿子上，挂了七天。第七夜，有人爬上竿子，把头取走了。巡检司查了半个月，查到阿爹头上，阿爹在衙门里挨了四十板，一个字没认。阿母写：四十板，跟当年九伯替他挨的一样多。人是你大哥保出来的，保的代价，他不说。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng" }, { kind = "date", from = [1559, 6, 1] }]

[[tracks.chapters.choices]]
key = "villages"
text = "托人捎银子回去，给海沧被烧的渔村"
next = "f3_jurou"
requires = [{ kind = "cash", ge = 300 }]
hint = "你眼下凑不出这笔钱。"
effects = [{ kind = "cash", value = -300 }]
reply = "我把银子分成两包，托给不认得林家的船家，叫他送到海沧那两个渔村，说是天妃宫的善款。船家回来说，一个村子收了；另一个村口坐着个老妇人，把银包扔进了海里，说烧她家的是倭寇，倭寇的银子她不要。我没告诉船家，那银子不是倭寇的，可也不全不是。"

[[tracks.chapters.choices]]
key = "worth"
text = "给阿爹写信，只问一句：值不值"
next = "f3_jurou"
effects = []
reply = "我写：九伯的船烧过海沧的村子，你还去取他的头，值不值？信很短，写完我自己都觉得刻薄。回信是大哥代的笔，阿爹的话只有一句，跟那年在龙骨边上说的一样：“不问值不值。”底下大哥添了一行小字：阿爹把头埋在浯屿的山上，坟朝东，朝五岛。"

[[tracks.chapters.choices]]
key = "book"
text = "把九伯的名字，写进船上的香簿"
next = "f3_jurou"
effects = []
reply = "船上的香簿记的是开洋、过礁、见山时上的香，从不记人名。我在末页另起一行，写：方九，漳州人，死在海沧。写完想了想，又在后头添了两个字：倭寇。笔停了很久，那两个字我没划掉，也没再看。往后每回翻香簿，翻到那一页，我都翻得很快。"

[[tracks.chapters.variants]]
key = "a1_asked"
when = [{ kind = "flag", flag = "rw_lin_wandeng_asked_jiubo" }]
text = "第二年夏天，月港来的船带来阿母的信。岑港的人往南走了，有几条船泊过浯屿，上岸烧过海沧那边的两个渔村。我想起那年夜里在灯下问九伯的话，他没答；海沧那两个渔村，替他答了。官军追上来，在海上拿住了几十个，九伯也在里头。斩首那天，九伯的头挂在海沧渡口的竿子上，挂了七天。第七夜，有人爬上竿子，把头取走了。巡检司查了半个月，查到阿爹头上，阿爹在衙门里挨了四十板，一个字没认。阿母写：四十板，跟当年九伯替他挨的一样多。人是你大哥保出来的，保的代价，他不说。"

[[tracks.chapters.variants]]
key = "a2_censhan"
when = [{ kind = "flag", flag = "rw_lin_wandeng_told_father_censhan" }, { kind = "flag", flag = "rw_lin_wandeng_asked_jiubo", value = false }]
text = "第二年夏天，月港来的船带来阿母的信。岑港的人往南走了，有几条船泊过浯屿，上岸烧过海沧那边的两个渔村。官军追上来，在海上拿住了几十个，九伯也在里头。我去年捎回去的那几个字，阿爹揣了一年，揣到了这一天。斩首那天，九伯的头挂在海沧渡口的竿子上，挂了七天。第七夜，有人爬上竿子，把头取走了。巡检司查了半个月，查到阿爹头上，阿爹在衙门里挨了四十板，一个字没认。阿母写：四十板，跟当年九伯替他挨的一样多。人是你大哥保出来的，保的代价，他不说。"

[[tracks.chapters]]
key = "f3_jurou"
title = "十郎要去平户"
text = "开海以后头一回回家，阿爹老了，背驼了，还天天去码头看缆。十郎也在码头上，二十岁了，个子比阿爹高，扛瓷箱扛得比谁都稳，唐话说得跟月港人一样，只有急起来才冒出两句倭话。那天他把我堵在天妃宫的石阶上：“姐，港开了，你的船去不去平户？我娘在五岛。”阿爹在台阶底下听见了，没回头：“你九伯托的，是让你做唐人。平户去不得，倭国不许。”十郎的脸涨红了：“伯父说的不许，是官府的不许，还是九伯的？”"
at = "yuegang"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1567, 4, 1] }]
deadline = [1568, 10, 31]

[tracks.chapters.timeout]
next = "f3b_grave"
effects = []
news = "开海头一年，林老大家那个会说倭话的侄子，在码头上扛了一年瓷箱。"

[[tracks.chapters.choices]]
key = "take"
text = "带十郎去平户：九伯的诺，管不到海上"
next = "f3b_grave"
effects = []
reply = "我说九伯托的是阿爹，不是我。阿爹没拦。他起身回屋，拿出一样东西塞给十郎，是九伯的旧烟袋，袋口绣着一个“方”字：“到了五岛，给你娘看。看完了，回不回来，你自己定。”那年冬天我的船去平户，十郎站在船头，倭话唐话混着喊，喊得满港的人都回头。"

[[tracks.chapters.choices]]
key = "stay"
text = "劝十郎留下：五岛那边，未必还有人等你"
next = "f3b_grave"
effects = []
reply = "我说九伯死了快十年，五岛那边的人，未必还认得你。十郎看着我，看了很久：“姐，你也觉得我是倭。”我说我没这么说。他说：“你们都没说。”他再没提平户，第二年在月港领了一张往吕宋的引，自己跑船去了，船头挂的是林家的红灯。"

[[tracks.chapters.choices]]
key = "father"
text = "出去，让阿爹自己跟他说"
next = "f3b_grave"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_jurou_father" }]
reply = "我起身出了门，把他们俩留在屋里。在门外，我听见阿爹说了很长一段话，比他这辈子跟我说过的加起来还长：浯屿外翻船那一年，四十板，岑港，海沧渡口那根竿子。说到竿子，他停了。十郎问是谁取的。阿爹说：“我。”后来十郎没去平户，也没跑船，留在码头上替阿爹看缆，一直看到阿爹走。"

[[tracks.chapters.variants]]
key = "a1_aboard"
when = [{ kind = "flag", flag = "rw_lin_wandeng_child_aboard" }]
text = "开海以后头一回回家，我把十郎带上了岸。他在我船上长到二十岁，个子比阿爹还高，唐话是船工教的，满嘴舵楼上的粗话。阿爹在码头上看着他走过来，看了很久，伸手在他肩上拍了两下，像拍一条刚靠岸的船。当晚，十郎在饭桌上放下碗：“伯父，港开了，我想去平户。我娘在五岛。”阿爹也放下了筷子：“你九伯托的，是让你做唐人。平户去不得，倭国不许。”十郎的脸涨红了：“伯父说的不许，是官府的不许，还是九伯的？”"

[[tracks.chapters]]
key = "f3b_grave"
title = "浯屿的坟"
text = "清明以后，阿母来信说，浯屿山上那座朝东的坟叫人刨了。刨坟的是海沧的人：十二年前被烧的那两个渔村里，有一户的儿子长大了，打听出坟里埋的是谁。阿爹那天正在山上，拦在坟前，被人推下了坡，摔断两根肋骨。他躺了一个月，能下床的头一天，又上了山，把刨开的土一捧一捧填回去。“刨坟那后生，他爹就死在那年的火里，”阿母写，“你阿爹知道。他说：他刨他的，我填我的。”"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1571, 4, 15] }]

[[tracks.chapters.choices]]
key = "move"
text = "回信：把九伯的骨殖迁去五岛"
next = "f4_father"
effects = []
reply = "我写：坟在浯屿，一年刨一回，阿爹一年填一回，要填到哪年？迁去五岛吧，九伯的女人在那边。大哥回信说，阿爹不肯：“他说九伯是漳州人，死了也要朝着家。”底下一行小字：坟又垒高了一尺，阿爹自己垒的。"

[[tracks.chapters.choices]]
key = "visit"
text = "托人去海沧，看看刨坟的那个后生"
next = "f4_father"
effects = []
reply = "托的是秦红缨镖局里一个老镖师。他回来说，那后生在海沧渡口打鱼，三十出头，背上一大片烧伤，是那年火里留下的。老镖师问他还刨不刨。他说不刨了，林老大填一回，他就去看一回，看到第三回，自己也弄不清刨的是谁了。“他托我问你，”老镖师说，“那个倭寇，到底是好人还是坏人。”"

[[tracks.chapters.choices]]
key = "father"
text = "写信问阿爹：你拦在坟前的时候，想的是什么"
next = "f4_father"
effects = []
reply = "回信是阿爹口述、大哥代笔的，七个字：“他捞我，我填他。”大哥在后头添了一句：阿爹说完这七个字，又说了一句，叫我别写，我还是写了——“那后生没错。”我把信叠好，压进罗盘匣底。那一夜我在舱里，好久没睡着。"

[[tracks.chapters]]
key = "f4_father"
title = "船认路"
text = "秋天，月港来的信是大哥写的，横平竖直，一个字也没多。阿爹是八月里走的，走以前三天不大说话，第三天夜里叫人把他扶到码头，把缆摸了一遍，摸完说：“船认路，人认规矩。规矩是我自己认的。认错了，也是我的。”回家就躺下了。他的腰带里还缠着那半枚永乐钱，阿母要放进棺里，大哥说等你回信再定。信末大哥添了一行：二哥那边，信送到墩上了，人没回来。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1578, 10, 1] }]

[[tracks.chapters.choices]]
key = "lamp"
text = "在船头给阿爹点一夜灯"
next = "done"
effects = []
reply = "那一夜我把船头的灯点到天亮，灯芯剪了四回。船工们轮班的时候，都在灯底下站一会儿再走。天快亮时风转了，我想起阿爹教我认风的那句话，就一句：“风在哪边，烟就往哪边。”烟往北飘，往月港那边。"

[[tracks.chapters.choices]]
key = "rule"
text = "把阿爹最后那句话，刻在舵把上"
next = "done"
effects = []
reply = "舵把是硬木的，我拿刀刻了一夜，刻得歪歪扭扭：规矩是自己认的。刻完满手木屑。往后掌舵，掌心总压在那几个字上，压久了，字被磨得发亮。有一回新来的舵工问这是谁的规矩，我说我阿爹的。他问那现在是谁的。我说我的。"

[[tracks.chapters.choices]]
key = "jiubo"
text = "写信问大哥：阿爹最后那几天，提没提九伯"
next = "done"
effects = []
reply = "大哥回信说，阿爹最后一夜说了几句胡话，最清楚的一句是：“九哥，缆我系好了。”大哥写：我没听懂。我听懂了。那年浯屿外翻船，九伯把阿爹从水里捞上来，头一件事，大概就是把翻了的船缆系牢。"

[[tracks.chapters.variants]]
key = "a1_coin"
when = [{ kind = "flag", flag = "rw_lin_wandeng_half_coin" }]
text = "秋天，月港来的信是大哥写的，横平竖直，一个字也没多。阿爹是八月里走的，走以前三天不大说话，第三天夜里叫人把他扶到码头，把缆摸了一遍，摸完说：“船认路，人认规矩。规矩是我自己认的。认错了，也是我的。”回家就躺下了。他的腰带里空着，那半枚永乐钱二十多年前给了我。阿母说他临走还摸了一下腰，摸了个空，笑了一下。信末大哥添了一行：二哥那边，信送到墩上了，人没回来。"

[[tracks.chapters.variants]]
key = "a2_jurou"
when = [{ kind = "flag", flag = "rw_lin_wandeng_jurou_father" }, { kind = "flag", flag = "rw_lin_wandeng_half_coin", value = false }]
text = "秋天，月港来的信是大哥写的，横平竖直，一个字也没多。阿爹是八月里走的，走以前三天不大说话，第三天夜里叫人把他扶到码头，把缆摸了一遍，摸完说：“船认路，人认规矩。规矩是我自己认的。认错了，也是我的。”回家就躺下了。十郎守了三夜灵，把自己那半枚钱解下来，跟阿爹腰带里那半枚合在一起，放进了阿爹的手心。信末大哥添了一行：二哥那边，信送到墩上了，人没回来。"
