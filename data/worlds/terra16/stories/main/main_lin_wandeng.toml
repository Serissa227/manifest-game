key = "a0_rw_pass"
when = [{ kind = "flag", flag = "rw_lin_wandeng_pass_seen" }, { kind = "flag", flag = "rw_lin_wandeng_coin_compass", value = false }]
text = "出海头一夜，鸟船泊在江口外一座小岛的背风处，北风刮得人牙根发冷。我掀开水罗盘的木匣换水，针碗底下压着一张折成四折的纸，展开是两张：一张是父亲的字，三两行，墨还没透；一张盖着海沧安边馆的朱印，印是真印，大哥在货栈的灯下给我看过，是书办借他盖的；可那位通判前年就调走了，纸是假的，上头写的船名是去年烧掉的那条福船，船名来不及改。字条只说：船到平户，见五峰船主，替林家问一句“这禁几时开”；问完就走；月港一天不开，船一天别回来。老舵工蹲在舱口抽旱烟：“钱四脚，人两脚——拿假纸跑，跑不过官府的。”我把纸往他眼前一抖，笑了：“纸是假的，船是真的，人也是真的。客官，你先替我看看风。”针碗里的水晃了一下，针头朝北，我的船朝南。"

