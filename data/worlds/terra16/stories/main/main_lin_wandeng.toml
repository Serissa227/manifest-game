news = "马尼拉湾的夜里，特尔纳特王子的科拉科拉和月港林家的鸟船并靠，一边念名字一边接人，城外的唐人家眷上了船。"

# b06 追到吕宋的把总：王望高与拉达。王望高不洗白也不写海战；不写林凤挖河（后文传闻）。
[[tracks.chapters]]
key = "b06_wang_wanggao"
title = "追到吕宋的把总"
text = "春天，西班牙人在林加延的河口外围住了林凤的残部。明朝的把总王望高追到马尼拉，跟总督喝着番人的酸酒，打听林凤藏在哪条河口；总督想借他的船，送两个修士去福建。奥斯定会的拉达修士坐在一边，膝上摊着一本自己画的中国地图，地名一半是错的：“你的船从哪儿来，那里的纬度是多少？说个大概也行，我自己会再算。”城外木栅里关着林凤的旧部，都是潮州、漳州的穷船户，晒得脱了皮。王望高把酒杯推到我面前：“坐下，喝一杯。这是番人酿的酸酒，酸得扎舌头，后劲倒大。喝完了，你告诉我林凤藏在哪条河口。”我没动。他放下杯子：“听说你跟林凤是同姓？”"
window = [[1575, 4, 1], [1575, 6, 10]]
at = "manila"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["wang_wanggao", "martin_de_rada"]
news = "马尼拉的西班牙人请明朝的把总喝酒，问林凤藏在哪条河口；月港来的女船主坐在下首，一口没喝。"

[tracks.chapters.default]
next = "b07_rada_list"
effects = []
news = "明朝的把总带着两个西班牙修士回了福建；听说林凤还困在林加延的河口里。"

