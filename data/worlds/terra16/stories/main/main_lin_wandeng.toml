# a02 平户：王直、弥七与澪。念信，信上没有一个“开”字。澪是 NPC，只写好胜与旗钱。
[[tracks.chapters]]
key = "a02_hirado"
title = "平户的老船主"
text = "入夏的平户，港里泊满挂“徽”字旗的大船，码头上葡萄牙话、闽南话、倭话搅成一锅。王直宅子的堂上摊着浙江来的招抚信，弥七站在边上，他不信纸，要紧的话只肯口传。码头上都说，船主自己不杀人，可他旗下有几条船上岸是要烧村子的，弥七从不替这话争辩。堂下立着土佐来的公家姬君一条澪，正为往内海去的船跟管事讲旗钱。我和她通了两年信，托表哥的船捎，今天头一回见面。她一眼认出我腰上的灯笼，扇骨一指：“你就是信里那个提灯的？字那么丑，人倒不丑。旗钱先付。”王直不理这头，叫我念信：“堂上识字的人不少，我偏要听个月港丫头念。”我念到底，一个“开”字也没找着，只有“免死”“立功”。王直盯着我：“朝廷说我是贼，沿海的烧杀都记在我头上。你说，哪个字写着开海？”"
at = "hirado"
speaker = "captain"
mood = "tense"
cast = ["wang_zhi", "yashichi", "mio"]
when = [{ kind = "date", from = [1557, 5, 1] }]
deadline = [1557, 7, 15]

[tracks.chapters.timeout]
next = "a03_haojing"
effects = []
news = "五峰船主的船队这一季在平户进进出出，月港林家的鸟船一直没露面。"

