news = "九龙江口南岸那座旧烽墩上，还住着一个老兵，夜里坐在墩台上看江口。"

[[tracks.chapters.choices]]
key = "take_down"
text = "踩着墙角，替他把那块令牌取下来"
next = "o5_torch"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_order_taken" }]
reply = "我踩着塌了的墙角去够那块令牌，钉子锈死了，拔不动。二哥在底下看着，没拦，也没帮。我拔了半天，手心磨破了，只拔下来一颗钉。我把那颗钉放在他手里。他攥着钉看了很久：“钉子你拿走。牌子留着。没人撤，它就还在。”"

[[tracks.chapters.choices]]
key = "stay"
text = "在墩上陪他守一夜"
next = "o5_torch"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_beacon_night" }]
reply = "那夜我们坐在墩台上，他给我烤了两条鱼，烤焦了，他说营里的伙夫也这么烤。半夜，江口真有一点灯往外走，很小，一闪一闪。二哥站起来，手伸向火把，伸到一半停住，就那么停着，一直停到那点灯看不见。他坐回来，说：“没看清。”我说我也没看清。"

[[tracks.chapters.choices]]
key = "argue"
text = "跟他说：这道令防的是倭船，不是自家人"
next = "o5_torch"
effects = []
reply = "我说将军下这道令的时候，夜里摸进来的是倭船；如今夜里出去的，是月港的船，是去平户、去吕宋讨饭吃的人。二哥听完，点了点头，说我讲得对。我以为他明白了。他又说：“令上没写倭船。令上写的是灯。”他说得很认真，认真得叫我说不出第二句。"

[[tracks.chapters.variants]]
key = "a1_japan"
