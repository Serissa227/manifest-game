news = "山海关海口，月港来的船卸完货连夜出了港，回头只看见关城上的旗，天黑了，分不清颜色。"

# c10 关外的消息：L19 结果回响。缺省三项（至多）与每个非缺省结果各一项互斥；ungated 的两项读 z_ 变体呼应 c09。
[[tracks.chapters]]
key = "c10_beyond_pass"
title = "关外的消息"
text = "夏天，北边来的船说：关开了，清兵进了关，赶跑了李自成，坐进了北京。码头上有人说换了皇帝，海禁说不定要松；有人说北边的人不认海，船引怕是要作废。“北边换了谁坐，海还是这片海，”卖鱼的老头说。我把船引从罗盘匣里拿出来看了一遍，朱砂印还是红的，可盖印的衙门已经不是那个衙门了。我这辈子跟“禁”斗，到头来它换了一张脸。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1589, 7, 1] }]

[[tracks.chapters.variants]]
key = "no_entry"
when = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_dashun_faces_qing" }]
text = "北边来的船说：北京换了人坐，可山海关没开，清兵在关外看着。码头上的人说，这世道，两边都不敢先动。卖鱼的老头把秤杆一翘：“没人先动，我的鱼倒先臭了。”我把船引拿出来看了一遍，朱砂印还红着。"

[[tracks.chapters.variants]]
key = "split"
when = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_jurchen_fragmented" }]
text = "北边来的船说：关外的部落自己散了，叶赫还在，建州没能把他们拢到一起。码头上的人听了半天，问：那海禁还是谁说了算？卖鱼的老头嘿了一声：“船引上盖谁的印，谁说了算。”我把船引拿出来看了一遍，朱砂印还红着。"

[[tracks.chapters.variants]]
key = "standoff"
when = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_frontier_stalemate" }]
text = "北边来的船说：关外的仗打成了对峙，清兵进不来，明兵也出不去，辽西那条走廊还在明朝手里。码头上的人说，海禁大概还是老样子。卖鱼的老头撇嘴：“老样子好，老样子的价我熟。”我把船引拿出来看了一遍，朱砂印还红着。"

[[tracks.chapters.variants]]
key = "truce"
when = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_trade_peace" }]
text = "北边来的船说：两边议了和，以辽河为界，开了马市，像当年俺答受封那样。码头上有人说，北边的买卖要比海上的好做了。卖鱼的老头不服：“马再好，也不会游水。”我把船引拿出来看了一遍，朱砂印还红着。"

[[tracks.chapters.variants]]
key = "z_news_first"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_news_first" }]
text = "夏天，北边来的船说：关开了，清兵进了关，赶跑了李自成，坐进了北京。码头上有人说换了皇帝，海禁说不定要松；有人说北边的人不认海，船引怕是要作废。“北边换了谁坐，海还是这片海，”卖鱼的老头说。我想起那天在海口，吴总兵攥着那封信掉转马头的背影。我把船引从罗盘匣里拿出来看了一遍，朱砂印还是红的，可盖印的衙门已经不是那个衙门了。我这辈子跟“禁”斗，到头来它换了一张脸。"

[[tracks.chapters.variants]]
key = "z_refugees"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_refugees" }]
text = "夏天，北边来的船说：关开了，清兵进了关，赶跑了李自成，坐进了北京。码头上有人说换了皇帝，海禁说不定要松；有人说北边的人不认海，船引怕是要作废。“北边换了谁坐，海还是这片海，”卖鱼的老头说。海口接出来的那四十多口人，听说在登州开了间小书铺，塞给我伞的那位老太太也在。我把船引从罗盘匣里拿出来看了一遍，朱砂印还是红的，可盖印的衙门已经不是那个衙门了。我这辈子跟“禁”斗，到头来它换了一张脸。"

[[tracks.chapters.choices]]
key = "history_lamp"
text = "在船头点一盏灯，朝北照一照"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_frontier_stalemate", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_trade_peace", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_jurchen_fragmented", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_dashun_faces_qing", value = false }]
next = "c11_to_shaozhou"
effects = [{ kind = "reputation", faction = "ming", value = 1 }]
reply = "灯点了一夜，北边什么也看不见。船工们不敢睡，轮着给我递热水。天亮我把它吹灭，这是我这辈子第一回自己吹灭一盏灯，吹之前，我数了三下才敢。"

[[tracks.chapters.choices]]
key = "history_letter"
text = "托北边来的船户，给山海关的总兵捎一句话"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_frontier_stalemate", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_trade_peace", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_jurchen_fragmented", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_dashun_faces_qing", value = false }]
next = "c11_to_shaozhou"
effects = [{ kind = "reputation", faction = "later_jin", value = 3 }]
reply = "捎话的船户过了两个月才回来，只学得一句：“总兵说，天津来的消息，他记着。”我问他总兵如今穿谁家的衣裳，他没答。"

[[tracks.chapters.choices]]
key = "history_refugees"
text = "去登州看看，北京逃出来的人家落了脚没有"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_frontier_stalemate", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_trade_peace", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_jurchen_fragmented", value = false }, { kind = "flag", flag = "l19_beijing_shanhaiguan_dashun_faces_qing", value = false }]
next = "c11_to_shaozhou"
effects = [{ kind = "reputation", faction = "ming", value = 2 }]
reply = "他们在登州开了间小书铺，门边靠着一把旧油纸伞，掌柜的是个北京口音的老太太。她看了我半天，问我是不是从海上来的，说海上的人都该有一把伞。我买了一把。"

[[tracks.chapters.choices]]
key = "standoff"
text = "关外打成了对峙：替守关的兵再跑一船粮"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_frontier_stalemate" }]
next = "c11_to_shaozhou"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_qing_held_out" }, { kind = "reputation", faction = "ming", value = 3 }]
reply = "关还是那道关，关外还是那些营，夜里营火连成一条线，数不过来。我运去的粮，守关的兵当天就吃了一半，剩下的一半，管库的一袋一袋摸过去，才肯在我的单子上盖印。"

[[tracks.chapters.choices]]
key = "truce"
text = "两边议了和、开了马市：去马市上看一眼"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_trade_peace" }]
next = "c11_to_shaozhou"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_qing_held_out" }, { kind = "cash", value = 800 }]
reply = "马市上的人穿着两样衣裳，说着三样话，讨价还价跟月港一样凶。我卖了一船茶，买了一匹马，没地方养，又卖了，倒赚了一碗奶茶的钱。"

[[tracks.chapters.choices]]
key = "split"
text = "北边的部落散了伙：把消息带回月港"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_jurchen_fragmented" }]
next = "c11_to_shaozhou"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_qing_held_out" }, { kind = "fame", value = 2 }]
reply = "茶棚里的人不信，说北边的人怎么会自己散。我说散了就是散了，跟船队一样，没有人带头就各走各的。老板娘给我添了碗茶：“那你下回带点北边的盐来，看他们还认不认账。”"

[[tracks.chapters.choices]]
key = "no_entry"
text = "关没开，北京却换了人：替逃出来的人找条去南边的船"
requires = [{ kind = "flag", flag = "l19_beijing_shanhaiguan_dashun_faces_qing" }]
next = "c11_to_shaozhou"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_qing_held_out" }, { kind = "reputation", faction = "ming", value = 2 }]
reply = "我在码头上扯了块木板，写上“往南，有舱”，竖在船头，不到半天就挤满了。关上的兵守着关，北京坐着另一个人，两边隔着一道墙对着看。往南的船一条比一条挤，没有一条是空的。"

# c11 搬去韶州：利玛窦被逐出肇庆。witness；news 不随变体变。
[[tracks.chapters]]
key = "c11_to_shaozhou"
title = "搬去韶州"
text = "秋天，广州城外的西江上，一条装满书箱的船往北去，船头坐着利玛窦。新来的总督看中了仙花寺的房子，给了一点银子，叫他们搬去韶州。书箱码得整整齐齐，最上面压着一卷世界图，边角被水汽卷了起来。利玛窦看见我的船，隔着水朝我拱手，用官话喊了一句：“地还是圆的！韶州也在这张图上！”罗明坚已经回了西洋，那口会报时的钟留在了肇庆。"
window = [[1589, 8, 1], [1589, 10, 31]]
at = "guangzhou"
stage = "witness"
speaker = "captain"
mood = "sad"
cast = ["matteo_ricci"]
news = "这个秋天，肇庆仙花寺的番僧又成了广州茶棚里的话头：新来的总督要不要赶他们，说法有三种。"

[tracks.chapters.default]
next = "c12_lamp_unextinguished"
effects = []


[[tracks.chapters.variants]]
key = "v2_gifts"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_carried_gifts" }]
text = "秋天，广州城外的西江上，一条装满书箱的船往北去，船头坐着利玛窦。新来的总督看中了仙花寺的房子，给了一点银子，叫他们搬去韶州。书箱码得整整齐齐，最上面压着一卷世界图，边角被水汽卷了起来。那块三棱镜他带走了，说知府还回来了，不要了。利玛窦看见我的船，隔着水朝我拱手，用官话喊了一句：“地还是圆的！韶州也在这张图上！”罗明坚已经回了西洋，那口会报时的钟留在了肇庆。"

[[tracks.chapters.variants]]
key = "v3_map"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_map_print" }]
text = "秋天，广州城外的西江上，一条装满书箱的船往北去，船头坐着利玛窦。新来的总督看中了仙花寺的房子，给了一点银子，叫他们搬去韶州。书箱码得整整齐齐，最上面压着一卷世界图，边角被水汽卷了起来。他远远问我，那张蹭花了一块的世界图还留着没有，我把它举起来晃了晃。他隔着水朝我拱手，用官话喊了一句：“地还是圆的！韶州也在这张图上！”罗明坚已经回了西洋，那口会报时的钟留在了肇庆。"

# c12 不灭的灯：终章。口头禅第二次（也是最后一次），反过来用。三个落点都放下一样东西。
# 变体优先级（字母序 + 守卫）：held_out > two_lamps > borrowed > keys_brother > lobbied > temple_keys。
[[tracks.chapters]]
key = "c12_lamp_unextinguished"
title = "不灭的灯"
text = "冬至前后，月港的夜。我四十九了，腰上的灯笼竹骨补过四回，纸换过七回，火苗还是那么小、那么红。九龙江口泊满了领船引的船，桅杆挤成一片竹林；天妃宫的长明灯在高处亮着，江面上全是它的影子。罗盘匣里压着一张船引，一卷牵星图，匣底的木头被水泡得发黑。我坐在船头，想往后这盏灯挂在哪儿。一个后生蹲过来：“船主，您这辈子撒过多少谎？”我张口就答：“不撒谎怎么活？”答到一半，自己先笑了：“这回没撒谎。这一辈子，有一句是真的：灯没灭过。”后生愣了愣，指着天：“船主，西边那颗星，今晚看得见吗？”"
speaker = "captain"
mood = "tender"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1589, 11, 1] }]

# 补章 at3 选了 leave_lamp 的局（c13_main_lin_wandeng_lamp_left）：a1—a6 按原变体的先后各配一条、a7 配基础正文，排在最前；正文照抄，只换掉灯笼那一句（同一句七处相同）。
[[tracks.chapters.variants]]
key = "a1_left_borrowed"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_lamp_left" }, { kind = "flag", flag = "c13_main_lin_wandeng_chart_borrowed" }, { kind = "flag", flag = "c13_main_lin_wandeng_qing_held_out", value = false }, { kind = "flag", flag = "c13_main_lin_wandeng_two_lamps", value = false }]
text = "冬至前后，月港的夜。我四十九了，腰上这盏灯笼是回来以后自己破竹糊纸扎的，火苗豆大，红是一样的红；原先那盏，还挂在那边的铜桩上。九龙江口泊满了领船引的船，桅杆挤成一片竹林；天妃宫的长明灯在高处亮着，江面上全是它的影子。罗盘匣里压着一张船引，一卷牵星图。我跟温婆婆借了一年，一借二十年；她要是还在，准要骂我一声“后生”。我坐在船头，想往后这盏灯挂在哪儿。一个后生蹲过来：“船主，您这辈子撒过多少谎？”我张口就答：“不撒谎怎么活？”答到一半，自己先笑了：“这回没撒谎。这一辈子，有一句是真的：灯没灭过。”后生愣了愣，指着天：“船主，西边那颗星，今晚看得见吗？”"

