news = "濠镜码头上，一个月港来的姑娘拿米袋裹着一门佛郎机抬上了船，葡萄牙人的账上记了一笔：林家，一门。"

[[tracks.chapters.choices]]
key = "just_watch"
text = "什么也不买，蹲在炮边看他们怎么装弹"
next = "a04_ningbo"
effects = [{ kind = "skill", skill = "firearms", value = 40 }]
reply = "我蹲在炮边看了一下午，看得炮手嫌我碍事，塞给我一块饼让我走。我边吃边在心里把子铳的样子又画了一遍：一个打，一个装，一个等。回船的路上我拿饼渣在舱板上摆了一遍，摆错了两回。"
news = "濠镜码头上，有个月港丫头蹲在佛郎机旁看了一下午，炮手赶不走，只好给了她一块饼。"

# a04 递进宁波的条件：限期跑腿。门客、谢清晏、假文引。口头禅①只在 break_in 的回复里用。
[[tracks.chapters]]
key = "a04_ningbo"
title = "递进宁波的条件"
text = "初冬的宁波，市舶司门口排着等验货的船户，北风把告示吹得哗哗响。王直的船队已经泊到舟山，他要先把自己的条件递进总督胡宗宪的幕府：许互市，宽海禁，招抚以后海上的事归他管。弥七不肯写，叫我背，我背得比《三字经》还熟。门口有两条路。言官的门客靠在柱子上，笑眯眯：“姑娘，话递上去要钱，递得好看也要钱。”市舶司的通事谢清晏却把我让进偏房：“足下请坐，慢慢说。今日堂上又错了一个字——不能再错第二个。”那门客喝多了，隔着板壁嘟囔了一句，没压住嗓子：巡按大人早拿定了主意，条件写得再好，老船主一进城就拿。"
at = "ningbo"
speaker = "captain"
mood = "tense"
cast = ["xie_qingyan", "hu_zongxian"]
when = [{ kind = "date", from = [1557, 10, 16] }]
deadline = [1558, 1, 31]

