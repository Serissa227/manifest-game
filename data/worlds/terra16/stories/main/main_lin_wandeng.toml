effects = [{ kind = "cash", value = 800 }]
reply = "罗明坚信了，当天就写信去澳门订一面镜子，写得很认真，连镜框的花纹都问了。后来听说知府真喜欢，我随口编的，倒编中了，我听见这话的时候正在喝茶，差点呛着。"
news = "广州码头上，月港来的女船主给番僧透了个消息，说肇庆的知府最爱西洋的镜子，罗明坚当场信了。"

[tracks.chapters.choices.fail]
