# 林晚灯：不灭的灯（主线脊轨，故事 2.0，A5 / E37 契约，C13b 第九批，Claude 写，仅中文）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_lin_wandeng_atlantis 与本线同批登记；c05_returned 的 when 加 c13_main_lin_wandeng_atlantis_over，由补章的结局与 c04_dark_sea 的掉头 / 缺席分支设。
#   at3 的 leave_lamp 把天妃宫灯笼挂在外港铜桩上，设 c13_main_lin_wandeng_lamp_left：c05_returned 的 v0a / v0b、c12 的 a1—a7 变体读它（灯笼不在身上的写法）。
# 标签：C13b 主线 · 林晚灯「不灭的灯」；家乡港月港（yuegang，休眠到 1567 年：第一幕不写“回到月港”，回家要等 b01）。
#       主线 main_lin_wandeng，32 章，auto = true，start = a00_gate；三幕：启航（a00—a10，1557—1566）、潮涌（b01—b09，1567—1577）、更远之处（c01—c12，1578—1590）。
# 依据（史实）：TERRA16 §12.4、§10（H05 余波、H13、H14、H19、H29、H38、H53、H56；L08、L10、L14、L15、L16、L17、L19、L20、L26）、§8.4（制诰之宝）、
#       《筹海图编》；拉达《中国记》；利玛窦札记。
#       王直的豪爽与烧村、林凤的狠、王望高的追索、孔有德的欠饷、吴三桂的倨傲都从人物嘴里和物件上透出来，不洗白也不丑化。
# 依据（原创）：林家的鸟船与水罗盘匣底的字条和假文引、二十四将的合股帖、名单上的“月港林”、久米村天妃宫的四十年前家书、
#       温星槎的过洋牵星原记与末页、皮岛的秤砣、察哈尔老管事的毡包、阿母的油库钥匙。
# 待核（正文一律传闻口吻）：二十四将的年份与浯屿的位置；1562 年林墩之战的月份；久米村天妃宫守香人的身份；1576 年皮岛守将的名字。
# 声音：speaker = captain 时“我”是晚灯；说话快、爱笑，称生人“客官”；闽南俗语每章至多一句，全写成普通话的意思
#       （钱四脚人两脚 a01；千金买厝万金买厝边 a05；输人不输阵 b03；晴天存雨天的粮 c07）。
#       口头禅“不撒谎怎么活？”全线只用两次：a04 break_in 的回复（真的撒谎闯门）与 c12（反过来用：这回没撒谎）。
# 秘密：女扮男装由 C7 在 1556 年独占揭开，本线不写坦白与识破，也没有社学旧人出场；
#       牵星图末页的“西洋之西”到底是不是温星槎祖父亲眼见的，永不说破，只写她的手掌压在那一页上。
# 恋爱：本线不写，也不用 heart / relation / tie / bond 效果；许采只在 c07 的变体里出现一句；历史人物只写史料里的往来与合作。
# 读的共享旗标：c12_voyage_lin_wandeng（a00 门槛，C12 结业只给选中林家的那一局设）；
#       h14_wang_zhi_return_wang_zhi_amnestied（a06 互斥）、h19_taizhou_pinghai_coast_pacified_early（a08 变体）、h38_manila_luzon_holds_manila（b04 变体）、l16_wuqiao_mutiny_mutiny_settled（c01 变体）、
#       l19_beijing_shanhaiguan_frontier_stalemate / _trade_peace / _jurchen_fragmented / _dashun_faces_qing（c10 互斥）；c11 原有的 L26 留在肇庆变体已删（C10 没有这个结果）；
#       atlantis_council_met（c05 变体，C11 设）；c7_tie_new_wen_xingcha_qin_hongying_landing（b02 变体）、
#       c7_bond_xu_cai_landing_love / _friend（c07 变体）；c13_mark_seal（c02 的 take_paper，requires 为假）。
# 设的共享旗标：c13_main_lin_wandeng（a00 default）；_act2（b01 的 default 与每个选项）；_act3（c01 的 default）；
#       _keepsake、_stance_open / _stance_close / _stance_hand（c03，恰好一面；超时设 _stance_open）；
#       _crossed / _turned_back / _absent（c04，恰好一面）；_two_lamps（a10）；_wangzhi_lived / _wangzhi_died（a06）；
#       _lobbied（b01，L20 杠杆钥匙，C10 不用就删）；_post_saved（c08，L19 杠杆钥匙，可选）；_qing_held_out（c10，任一非缺省结果）；
#       _done 与恰好一面 _end_merchant / _end_temple / _end_west（c12）；c13_mark_seal（c02）。
# 本线自己的分支旗标：forged_pass、burned_pass、fathers_word（a01）；urged、warned、asked（a02）；folangji（a03）；pleaded（a04）；
#       24_friend、informed（a05）；guided_qi、warned_villages、hid_families（a07）；followed_lamp、answered_lamp、turned_from_lamp（a09）；
#       licensed、japan_run（b01）；chart_sworn、chart_borrowed、chart_left（b02）；drew_route（b04）；defended、limahong_talk、families_out（b05）；
#       guided_wang、pleaded_men（b06）；rada_books、gave_chouhai（b07）；gunners、sold_north（b08）；pidao_fed、gunners_pidao、iced（b09）；
#       star_measured（c04）；carried_gifts、map_print（c06）；temple_keys、keys_to_brother、mother_aboard（c07）；
#       relief_fair、post_saved、hoarded（c08）；news_first、refugees（c09）。每面都有变体读。
# 缺省走向：stage 章没人回应就走 default（历史照常）；有 at 的普通章都写了 deadline 与 timeout，期限早于下一章窗口的起日；
#       a01、a05、a06、a09、c03（超时除外）、c05、c10、c12 没有 at，进入即弹出。
# 等待的包：A9（a00 的 when 可加 protagonist 条件；若引擎按 main_track 开轨道，auto 改 false，章不动）；
#       A8（c02 的 mark_seal 发现物许可流程定了以后可加成 discovery 目标；c04 的 tabula_smaragdina 要“醒来”才能穿雾，atlantis_port 可达）；
#       C10（HIST_* 占位已于 2026-10-26 换成历史事件的结果旗标；_lobbied、_post_saved 是否用作杠杆钥匙）；
#       C11（c05 的变体可按 atlantis_verdict_* 再细分；
#       c03 的 _keepsake 与 _stance_* 交给十王会议读）。
# 历史结果旗标（2026-10-26 由 HIST_* 占位换成 C10 的 key）：h14_wang_zhi_return_wang_zhi_amnestied（a06）、h19_taizhou_pinghai_coast_pacified_early（a08）、h38_manila_luzon_holds_manila（b04）、l16_wuqiao_mutiny_mutiny_settled（c01）、
#       l19_beijing_shanhaiguan_frontier_stalemate / _trade_peace / _jurchen_fragmented / _dashun_faces_qing（c10）。
# 写法说明（给整合方与审计）：
#       1. 审计的“准备后条件仍不满足”：选项的 requires 不读本线自己在别的分支设的旗标。简报里这样的六处门禁改成了无门槛，旗标改由变体读：
#          a02 ask（原需 fathers_word；a02 加变体 fathers_word）、a04 break_in（原需 forged_pass；b01 加变体 forged）、
#          a07 hide_families（原需 24_friend；a07 加变体 friend）、b09 gunners_stay（原需 gunners；回复写成两种来历都通；b09 加变体 gunners）、
#          c10 history_letter / history_refugees（原需 news_first / refugees；c10 加变体 z_news_first / z_refugees）、
#          c12 end_temple（原需 temple_keys；c12 加变体 temple_keys）。
#       2. 变体只取 key 字母序最前、条件满足的那一个，所以几处加了守卫条件让该出现的出现：
#          c01 v2_gunners 要求 gunners_pidao 为假（否则 v3 永远轮不到）；c12 的 borrowed / keys_brother / lobbied / temple_keys 要求 two_lamps 为假，
#          borrowed 另要求 qing_held_out 为假，使优先级成为 held_out > two_lamps > borrowed > keys_brother > lobbied > temple_keys。
#       3. c01 的基础文本写“孙巡抚被押进了京城，船户们说，怕是回不来了”（不写“已经斩了”），v7_sun_alive 才写“案子拖着没判”。
#       4. c09 的 cast 照简报留着 li_zicheng（他不在场，只在消息里）。
#       5. 无 at 的章（a01、a05、a06、a09、c03、c05、c10、c12）不写死所在港口。
#       6. 有 at 的普通章（带 deadline 与 timeout）不写章节级 news：见闻写在各选项、检定失败分支与 timeout 上，避免超时时引擎拿章节级 news 顶上；
#          stage 章（involve / witness / rumor）照契约写章节级 news 与 default。
# 回忆插画清单（mem-main_lin_wandeng-*）：
#   a06 为老船主点的灯：夜海上一盏小纸灯漂远，光点时隐时现；鸟船船舷边一个高马尾的姑娘屏着气看。
#   a10 两盏灯：雾夜的久米村天妃宫，殿檐下并排挂着一盏红纸灯笼和一盏琉璃长明灯，缠小脚的老妇人坐在门槛上。
#   b02 原记的末页：潮湿的小屋里，老妇人枯瘦的手掌按在一卷发黄的牵星记最后一页上，对面的年轻女船主伸着脖子看。
#   b05 一张名单：马尼拉湾的夜里，鸟船与科拉科拉并靠，女船主举灯念名单，船舷边一户户唐人家眷被递上船。
#   c02 拿纸不拿印：辽河口马市的船边，老牧人掀开毡子，羊毛里压着一方发黑的绿印；一张纸上一圈朱红印边。
#   c04 雾里的灯：海草铺满的无风海面，浓雾里一条鸟船船头挑着红灯笼，灯火笔直，雾在船头分开一道缝。
#   c07 阿母在船头：会安天妃宫里，一个缠小脚的福建老妇人踩着梯子给别人家的长明灯添油，女儿在梯下扶着。
#   c12 不灭的灯：冬夜九龙江口泊满帆船，天妃宫的长明灯在高处，船头一盏补过多回的小红纸灯笼，火苗小而红。
# 整合须知（给整合方）：
#   - cast/ties.toml：tie_qin_wandeng 的 story 指向 main_lin_wandeng（a05）；tie_wen_wandeng 指向 main_lin_wandeng（b02，原定 a11）；
#     kaicili_wandeng 的 note 就是 b05 这一幕。
#   - 月港 1567 年前休眠：cast 里林晚灯（NPC）1557—1566 的日程 at = yuegang，别的玩家这几年见不到她，建议改到双屿或濠镜；
#     C7 的 reunion_chen_dong（1563 月港）、reunion_xu_cai（1565 月港）对玩家 = 林晚灯走不到，只会走 default / 超时。
#     （2026-11-01 close-places：陈栋重逢已改到 1563 福州闽江口、许采重逢已挪到 1567 月港，两章都走得到了。）
#   - 西洋大铳在东亚买不到：b08 的炮与铳师只做成 cash 垫款与故事里的事，goods 目标只有 b03（生丝 20）、b09（粮 30）、c08（米 30）三处。
#   - 本文件不登记 main_lin_wandeng_atlantis（暂存，等 A8 E63 与 C11 第二轮）；本线 c12 不读它设的任何旗标。


