[[tracks.chapters.choices]]
key = "take_paper"
text = "用一船绸缎的价钱，换一张印文"
requires = [{ kind = "cash", ge = 1500 }, { kind = "flag", flag = "c13_mark_seal", value = false }]
hint = "老管事没把毡子解开。"
next = "c03_summons"
effects = [{ kind = "cash", value = -1500 }, { kind = "item", item = "emerald_mark_seal", qty = 1 }, { kind = "flag", flag = "c13_mark_seal" }, { kind = "memory", memory = "mem-main_lin_wandeng-c02", title = "拿纸不拿印" }]
reply = "老管事把绸缎一匹匹摸过去，摸完才解开毡子。朱砂只蘸了一次，他压得很重，压完把印包回毡子里，连看都不让我多看一眼。纸上的字我认不全，可那一圈印边，我一辈子记得。"
news = "牛庄马市上，察哈尔的老管事用毡包里的一方旧印，给月港的女船主压了一张纸，换走了一船绸缎。"

[[tracks.chapters.choices]]
key = "only_look"
text = "只请他打开毡子让我看一眼，纸不要"
next = "c03_summons"
effects = [{ kind = "affinity", person = "sutai", value = 3 }, { kind = "fame", value = 1 }]
reply = "他愣了一下，把毡子掀开一角，让我看了一眼发黑的绿，又盖上。我说绸缎我留着，纸不要，印也不要，看一眼就够我吹到老。他说太后会喜欢听这件事：有人见了印，连纸都不要。"
news = "牛庄马市上的人说，有个月港来的女船主只看了一眼察哈尔老管事的毡包，连那张印文都没要。"

[[tracks.chapters.choices]]
key = "sell_word"
text = "把印在谁手里的消息卖给沈阳来的人"
next = "c03_summons"
effects = [{ kind = "cash", value = 1500 }, { kind = "reputation", faction = "later_jin", value = 5 }, { kind = "reputation", faction = "chahar", value = -5 }]
reply = "沈阳的人付钱很爽快，还多给了一碗奶茶，奶茶里放了盐，我喝了一口就放下了。第二天老管事的毡包不见了，人也不见了，船边他坐过的地方，只剩一小片压平的草。"
news = "牛庄马市上，察哈尔老管事的毡包一夜之间不见了，沈阳来的人倒多喝了几碗奶茶。"

# c03 末页的星：召请。灯焰压扁、像有人吸气，这个比喻只在本章用。不点破西洋之西是不是祖父亲眼见的。
[[tracks.chapters]]
key = "c03_summons"
title = "末页的星"
text = "夏夜无风，帆垂着，船像钉在水上。我把过洋牵星原记摊在舱顶，就着灯量末页那颗星。那颗星今年升得格外早，在西边，比原记上记的高了半指。腰间的红灯笼没有风也朝西斜，灯焰被压得扁扁的，像有人在那边轻轻吸气。船上的人说，西洋人传言今年天上两颗大星要碰头，海的尽头要开门。老舵工把烟锅磕在舱沿上：“西边是番人的海，番人自己都说那里有鬼。”我笑了：“鬼要真有，我先问它有没有船引。”我量了三遍，三遍都是同一个数：原记没有错，是天变了。鬼故事我听了一辈子，这回想自己去看看，鬼长什么样。"
speaker = "captain"
mood = "mystic"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1582, 6, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_stance_open" }]

[[tracks.chapters.variants]]
key = "chart_left"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_chart_left" }]
text = "原记留在了温婆婆那里，我手里的誊本没有末页；可她手掌盖住的那一页，我只看过一眼，就记住了那颗星。夏夜无风，帆垂着，船像钉在水上，我就着灯凭记性量。那颗星今年升得格外早，在西边，比我记的高了半指。腰间的红灯笼没有风也朝西斜，灯焰被压得扁扁的，像有人在那边轻轻吸气。船上的人说，西洋人传言今年天上两颗大星要碰头，海的尽头要开门。老舵工把烟锅磕在舱沿上：“西边是番人的海，番人自己都说那里有鬼。”我笑了：“鬼要真有，我先问它有没有船引。”我量了三遍，三遍都是同一个数：记性没有错，是天变了。鬼故事我听了一辈子，这回想自己去看看，鬼长什么样。"

[[tracks.chapters.variants]]
key = "sworn"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_chart_sworn" }]
text = "夏夜无风，帆垂着，船像钉在水上。我把过洋牵星原记摊在舱顶，就着灯量末页那颗星。那颗星今年升得格外早，在西边，比原记上记的高了半指。腰间的红灯笼没有风也朝西斜，灯焰被压得扁扁的，像有人在那边轻轻吸气。我对着温婆婆的罗盘起过誓，这卷纸不卖、不抵、不给官府，没说过不许带去西边。船上的人说，西洋人传言今年天上两颗大星要碰头，海的尽头要开门。老舵工把烟锅磕在舱沿上：“西边是番人的海，番人自己都说那里有鬼。”我笑了：“鬼要真有，我先问它有没有船引。”我量了三遍，三遍都是同一个数：原记没有错，是天变了。鬼故事我听了一辈子，这回想自己去看看，鬼长什么样。"

[[tracks.chapters.variants]]
key = "wangzhi_died"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_died" }]
text = "夏夜无风，帆垂着，船像钉在水上。我把过洋牵星原记摊在舱顶，就着灯量末页那颗星。那颗星今年升得格外早，在西边，比原记上记的高了半指。腰间的红灯笼没有风也朝西斜，灯焰被压得扁扁的，像有人在那边轻轻吸气。老船主要是还活着，大概会骂我：西边的买卖，你一个人也敢去？船上的人说，西洋人传言今年天上两颗大星要碰头，海的尽头要开门。老舵工把烟锅磕在舱沿上：“西边是番人的海，番人自己都说那里有鬼。”我笑了：“鬼要真有，我先问它有没有船引。”我量了三遍，三遍都是同一个数：原记没有错，是天变了。鬼故事我听了一辈子，这回想自己去看看，鬼长什么样。"

[[tracks.chapters.variants]]
key = "wangzhi_lived"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_lived" }]
text = "夏夜无风，帆垂着，船像钉在水上。我把过洋牵星原记摊在舱顶，就着灯量末页那颗星。那颗星今年升得格外早，在西边，比原记上记的高了半指。腰间的红灯笼没有风也朝西斜，灯焰被压得扁扁的，像有人在那边轻轻吸气。老船主受封以后说过，海上最大的买卖不在南洋，在西边，我当时以为他喝多了。船上的人说，西洋人传言今年天上两颗大星要碰头，海的尽头要开门。老舵工把烟锅磕在舱沿上：“西边是番人的海，番人自己都说那里有鬼。”我笑了：“鬼要真有，我先问它有没有船引。”我量了三遍，三遍都是同一个数：原记没有错，是天变了。鬼故事我听了一辈子，这回想自己去看看，鬼长什么样。"

[[tracks.chapters.choices]]
key = "lamp_open"
text = "提着天妃宫的灯往西去：让雾散开，谁都能走这条路"
requires = [{ kind = "item", item = "tianfei_lantern", qty = 1 }]
hint = "你摸了摸腰间，空的。"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_keepsake" }, { kind = "flag", flag = "c13_main_lin_wandeng_stance_open" }]
reply = "我把灯笼的竹骨又缠了一道麻线，缠得很紧。老舵工在旁边嘀咕，说拆完了海禁，又要去拆番人的。我笑着说：“有一道算一道。”海禁我恨了一辈子，西边要是也有一道禁，我也想去把它拆了。"

[[tracks.chapters.choices]]
key = "lamp_close"
text = "提着灯去，替雾里住着的人把门关好"
requires = [{ kind = "item", item = "tianfei_lantern", qty = 1 }]
hint = "门要靠灯去关，可腰上没有灯。"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_keepsake" }, { kind = "flag", flag = "c13_main_lin_wandeng_stance_close" }]
reply = "我把灯笼挂回桅杆，灯口朝东，罩子又绑了一圈布条。开了海，月港的人赚了银子，也赔了命。西边的人要是不想见我们，我替他们挡一挡，我躲卡子躲了半辈子，门在哪儿，哪边能关，我熟。"

[[tracks.chapters.choices]]
key = "hand_over"
text = "灯留在船上，把这条路交给守得住它的人"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_stance_hand" }]
reply = "我把那卷星图卷起来，系上绳子，灯笼收进舱里，没挂桅杆。老舵工看着我，意外地没骂。路是要人守的，我守不住一片海，可我认得几个守得住的人。"

# c04 黑暗之海：亚速尔以西。穿雾要翠玉录（A8），这里只做变体。
[[tracks.chapters]]
key = "c04_dark_sea"
title = "黑暗之海"
text = "特塞拉岛的安格拉港外，西班牙人的炮一整天不停，港里挤满了逃难的船。往西三天，海草铺满海面，风停了，水罗盘的针在碗里转个不停，像被谁拿手指拨着。雾里有很多灯：番人的船灯、渔火，还有几盏不知道是什么的，一会儿近一会儿远。船工缩在舱口，一个在讲鬼故事，一个叫他住嘴。“番人说，这里的雾是活的，吃船。”讲的人压低嗓门。我喊：“接着讲！吃了船，然后呢？”腰上的灯笼里，火舌忽然直了，四周一丝风都没有，它却像在指路。怕是真怕。可要是现在掉头，我这辈子讲鬼故事，就只能讲别人的了。"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
stage = "involve"
speaker = "captain"
mood = "mystic"
night = true
cast = ["lin_wandeng"]
news = "特塞拉岛外西班牙人的炮打了一个夏天；安格拉港的渔夫都说，西边的雾一直没散。"

[tracks.chapters.default]
next = "c05_returned"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_absent" }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }]
news = "特塞拉岛的炮声停了，安格拉港里的船也散了，渔夫说西边的海草又合拢了。"

[[tracks.chapters.variants]]
key = "two_lamps"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_two_lamps" }]
text = "特塞拉岛的安格拉港外，西班牙人的炮一整天不停，港里挤满了逃难的船。往西三天，海草铺满海面，风停了，水罗盘的针在碗里转个不停，像被谁拿手指拨着。雾里有很多灯：番人的船灯、渔火，还有几盏不知道是什么的，一会儿近一会儿远。雾深处有一盏灯，远远地亮了一下，又亮了一下，像那年久米村天妃宫檐下的那一盏。船工缩在舱口，一个在讲鬼故事，一个叫他住嘴。“番人说，这里的雾是活的，吃船。”讲的人压低嗓门。我喊：“接着讲！吃了船，然后呢？”腰上的灯笼里，火舌忽然直了，四周一丝风都没有，它却像在指路。怕是真怕。可要是现在掉头，我这辈子讲鬼故事，就只能讲别人的了。"

[[tracks.chapters.choices]]
key = "cross"
text = "照着那页翠玉的抄片念一遍，往雾里开"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "你手里没有能让雾让路的东西。"
next = "c05_returned"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_crossed" }, { kind = "memory", memory = "mem-main_lin_wandeng-c04", title = "雾里的灯" }]
reply = "我把那页翠玉的抄片举到灯前，一句一句念，念得结结巴巴，船工们捂着耳朵。念到“下者如同上者”，雾在船头分开一道缝，缝那头有光，比灯大得多，像一整座城都亮着。腰上的灯笼笔直地亮着，一点也不抖。"
news = "安格拉港的渔夫都说，有条挂红灯笼的东方船往西开进了雾里，雾在它后头合上了。"

[[tracks.chapters.choices]]
key = "measure"
text = "照原记末页的星量一回，量完就掉头"
requires = [{ kind = "item", item = "star_crossing_original", qty = 1 }]
hint = "原记不在你箱子里，那颗星你只记得一半。"
next = "c05_returned"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_turned_back" }, { kind = "flag", flag = "c13_main_lin_wandeng_star_measured" }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }]
reply = "我举着木板，一指一指地量。雾顶上露出一小块天，那颗星正挂在原记写的位置，一指不差。我量完，在末页边上添了一行小字，把墨吹干，然后叫船工收帆。船工问我怎么不往里走，我说：“量完了，不欠它的了。”"
news = "安格拉港的渔夫都说，有条东方船在雾边停了一夜，船上有人举着一块木板量星，天亮就回来了。"

[[tracks.chapters.choices]]
key = "turn_home"
text = "收帆掉头：月港还有人等着这盏灯"
next = "c05_returned"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_turned_back" }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }]
reply = "我喊了一声“收帆”，嗓子比我想的哑。掉头的时候火舌又歪了回去，朝东。船工们都松了口气，有人放声笑，笑得很难听。只有我站在船尾，看着雾在后头一点点合拢。"
news = "安格拉港的渔夫都说，有条挂红灯笼的东方船往西去了三天，又回来了。"

# c05 烘干的灯骨：回来的人。基础文本不依赖 C11；变体读 atlantis_council_met。
[[tracks.chapters]]
key = "c05_returned"
title = "烘干的灯骨"
text = "回程的船上，船工们把雾边的事讲了一路，讲一次多一条鬼。我听着，不拆穿，有时候还替他们添一句：“那条鱼还会讲价。”灯笼的竹骨在雾里潮了，我拿炭盆一根一根烘干，烘着烘着天就亮了。西边的雾开没开，回来的船说法不一：有人说有一座城，有人说只有海草。最年轻的那个船工蹲在炭盆边问我：“船主，那边到底有什么？”我张口就要编，又咽回去了。头一回，我不想撒谎。"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_lin_wandeng_atlantis_over" }]

# 补章 at3 选了 leave_lamp（天妃宫灯笼挂在外港铜桩上，c13_main_lin_wandeng_lamp_left）：v0a / v0b 排在最前，正文照抄 v1 / v3，只换掉写灯笼在身上的那一句。
[[tracks.chapters.variants]]
key = "v0a_lamp_council"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_lamp_left" }, { kind = "flag", flag = "atlantis_council_met" }]
text = "秋天，我听一个从西边回来的人说话。他讲十个王坐在黑地里，一个一个审外面的世界，说话的样子，像刚从一场很长的会上下来。旁边有人问，灯是不是真的一盏也不点，他只答了一句：全熄了。我没拆他的台。腰间空着，我倒想笑：最外一圈的铜桩上，那点红亮着呢。"

[[tracks.chapters.variants]]
key = "v0b_lamp"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_lamp_left" }]
text = "我从雾那头回来了。船工们追着问，一个比一个会猜，有人说那边满地是金子，有人说满地是鬼。那边的事，我答应过不乱说，只告诉他们：那边的灯，比月港的亮。夜里炭盆照旧端出来，我蹲在旁边烤手，手心翻过来，手背翻过去，翻到天亮，也没有一根竹骨要烘。"

[[tracks.chapters.variants]]
key = "v1_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "秋天，我听一个从西边回来的人说话。他讲十个王坐在黑地里，一个一个审外面的世界，说话的样子，像刚从一场很长的会上下来。旁边有人问，灯是不是真的一盏也不点，他只答了一句：全熄了。我腰上的灯笼，不知怎么，那一刻重了一点。"

[[tracks.chapters.variants]]
key = "v2_absent"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_absent" }]
text = "我没赶上那片海。回来的船从西边带回各种说法，有人说有一座城，有人说只有海草，我听了一个秋天，不拆穿，有时候还替他们添一句：“那条鱼还会讲价。”灯笼的竹骨在雾里潮了，我拿炭盆一根一根烘干，烘着烘着天就亮了。最年轻的那个船工蹲在炭盆边问我：“船主，那边到底有什么？”我张口就要编，又咽回去了。我自己都没去过，拿什么编。"

[[tracks.chapters.variants]]
key = "v3_crossed"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_crossed" }]
text = "我从雾那头回来了。船工们追着问，一个比一个会猜，有人说那边满地是金子，有人说满地是鬼。那边的事，我答应过不乱说，只告诉他们：那边的灯，比月港的亮。灯笼的竹骨在雾里潮了，我拿炭盆一根一根烘干，烘着烘着天就亮了。"

[[tracks.chapters.variants]]
key = "v4_measured"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_star_measured" }]
text = "回程的船上，船工们把雾边的事讲了一路，讲一次多一条鬼。我听着，不拆穿，有时候还替他们添一句：“那条鱼还会讲价。”灯笼的竹骨在雾里潮了，我拿炭盆一根一根烘干，烘着烘着天就亮了。原记末页的边上多了我的一行小字，墨迹跟温婆婆祖父的混在一起。西边的雾开没开，回来的船说法不一：有人说有一座城，有人说只有海草。最年轻的那个船工蹲在炭盆边问我：“船主，那边到底有什么？”我张口就要编，又咽回去了。头一回，我不想撒谎。"

[[tracks.chapters.choices]]
key = "tell_tales"
text = "编个故事讲给船工们听，要比真的还吓人"
next = "c06_prism_clock"
effects = [{ kind = "fame", value = 3 }]
reply = "我讲到雾会吃船，最小的那个吓得抱住桅杆；讲到灯会指路，他又松开了。到了下一个港，这故事已经传到别的船上去了，传回来的时候多了一只三个脑袋的海龟。"

[[tracks.chapters.choices]]
key = "keep_quiet"
text = "一个字也不提，夜里一个人对着天上的星量"
next = "c06_prism_clock"
effects = [{ kind = "skill", skill = "astral_navigation", value = 60 }]
reply = "船工们以为我吓着了，没人敢问，连最爱嚼舌头的那个也闭了嘴。我把那几夜量的星一颗颗添进手边那卷图的空边，添到再也添不下，墨用完了，就拿炭条添。"

# c06 三棱镜与钟：罗明坚与利玛窦。肇庆在内陆，从广州上西江。不写传教说教。
[[tracks.chapters]]
key = "c06_prism_clock"
title = "三棱镜与钟"
text = "广州城外的码头，罗明坚雇船往西江上游的肇庆去，舱里是一口会自己报时的钟和一块三棱玻璃，是送知府的礼。船工们不敢挨着那口钟睡，说里头住着会数数的东西。利玛窦年轻，官话说得比罗明坚好，他摊开一张还没刻完的世界图：大明不在正中间，月港只是海边一个小点，西洋还要往西，是一大块陆地。罗明坚指着自己写的字：“你看这个‘天’字，一个人张开手脚，头上再顶一横。造字的人，真是聪明。”利玛窦笑着接过去：“这里的读书人不信地是圆的。我不跟他们争，先请他们喝茶。”他问我：你从海上来，一定知道地是圆的吧？我笑着答：“客官，船开远了，岸是先沉下去的。”我在那张图上找牵星图末页那颗星底下的地方，那里画着一片很大的陆地，写着我不认识的名字。"
at = "guangzhou"
speaker = "captain"
mood = "cheerful"
cast = ["michele_ruggieri", "matteo_ricci"]
when = [{ kind = "date", from = [1583, 11, 1] }]
deadline = [1585, 10, 31]

[tracks.chapters.timeout]
next = "c07_mothers_lamp"
effects = []

