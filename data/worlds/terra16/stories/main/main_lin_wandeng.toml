effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_warned" }, { kind = "affinity", person = "wang_zhi", value = 3 }]
reply = "他笑出声，说我比他那几个火长看得细；可船队照常修帆，没有一条停下来。澪出门时往我手里塞了一面小旗：“下回来平户，先付钱。”旗角锁的针脚又密又直，比她写的字好看多了。"
news = "平户的人说，五峰船主堂上有个月港丫头劝他别信那封招抚信，船主笑她看得细，船队的帆还是照常修。"

[[tracks.chapters.choices]]
