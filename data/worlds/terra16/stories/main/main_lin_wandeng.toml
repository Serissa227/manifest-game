reply = "银子装了一箱，粮官说辽东的兵会记得我。我扛着箱子过粥厂门口，排队的人没人看我，也没人让路，我从人缝里侧着身子过去，箱角蹭了谁的碗。回船的路上，队一步也没往前挪。"
news = "天津码头上，三十担南米按木牌上的饥价卖给了管辽饷的粮官，粥厂门口的队一步也没往前挪。"

# c09 谁先到山海关：吴三桂的马鞭。default 与 news 都不写开没开关，结果由 C10 决定。
[[tracks.chapters]]
key = "c09_first_to_pass"
title = "谁先到山海关"
text = "暮春，山海关海口，长城一直伸进海里，浪打在老龙头的石头上。从天津来的消息比驿马还快：北京城破了，李自成进了城。关上的总兵吴三桂年轻，骑着马在海滩上来回跑，问每一条靠岸的船：“北京那边怎么说？别挑好听的，照实讲。”关外的清兵扎了营，派来的人一天来三趟；海口里挤满了从北京逃出来的官眷，抱着箱子求船：“船主，箱子都给你，只要一条舱。”我怀里揣着天津带来的一封信，信里写的是吴家的事。吴三桂勒住马，问我：“我父亲还活着吗？”信在我怀里，我还没拆。这辈子我撒过一千个谎，这一回，我宁可手里的信是假的。"
window = [[1589, 4, 20], [1589, 6, 30]]
at = "shanhaiguan"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["wu_sangui", "li_zicheng"]
news = "山海关海口挤满了从北京逃出来的船，有人说关城上的旗一夜换了两回。"

[tracks.chapters.default]
next = "c10_beyond_pass"
effects = []
news = "山海关的城头换了两回旗，海口的船主都说，且等风向明白了再靠岸。"

