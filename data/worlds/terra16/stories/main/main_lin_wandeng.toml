next = "a05_twentyfour"
effects = [{ kind = "cash", value = -500 }]
news = "宁波行辕的门子认出一个月港姑娘手里的文引是前年那位通判的旧印，罚了她一笔银子，从侧门送了出来。"

# a05 二十四将的船：合股帖、秦红缨的刀。tie_qin_wandeng 的故事落在秦红缨这一句上。
[[tracks.chapters]]
key = "a05_twentyfour"
title = "二十四将的船"
text = "春夜，鸟船泊在一座小岛的背风面，远处浯屿上的番舶亮着几点火。一条蒙着灯罩的小艇靠上来，船上是“二十四将”里张家的老三，怀里揣着一张合股帖：二十三个红手印，末尾还空着一格，格子边写了个“林”字，是父亲当年应下的。押着入股银子的是月港镖局的秦红缨，上船先点人，再点银箱。张老三要造一条大船，专给浯屿的番舶送水送米，要我的鸟船跑在前头看风：“千金买厝，万金买厝边，你家跟我们做了二十年厝边。”秦红缨把刀横在银箱上，下巴朝空格一点：那个“林”字，是她亲眼看着父亲写的。“老板，按不按手印我不管。今晚小艇上七个人，回去还得是七个。”"
speaker = "captain"
mood = "tense"
night = true
cast = ["qin_hongying"]
when = [{ kind = "date", from = [1558, 3, 1] }]

[[tracks.chapters.choices]]
key = "join"
text = "在合股帖的空格里按下手印，出一股银子"
requires = [{ kind = "cash", ge = 800 }]
hint = "你掏遍了舱底，凑不出一股的银子。"
next = "a06_lamp_for_wang"
effects = [{ kind = "cash", value = -800 }, { kind = "flag", flag = "c13_main_lin_wandeng_24_friend" }]
reply = "手指头上的印泥是凉的，比海水还凉。张老三把帖子对着灯照了照，我那一格比二十三个手印都红。秦红缨点完银子，难得笑了一下：“这回是二十四个。”"

[[tracks.chapters.choices]]
key = "lookout"
text = "不入股，只替他们看风：巡船来了就挂两盏灯"
check = { attr = "intrigue", base = 35, per = 6 }
next = "a06_lamp_for_wang"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_24_friend" }, { kind = "affinity", person = "qin_hongying", value = 3 }]
reply = "那一季我替他们挂了三回灯，三回都挂对了：一回在半夜，一回在涨潮，一回浪打湿了灯笼，我拿舱里的油灯顶上，挂得歪歪的，也算数。秦红缨押银子回月港前，把我的船也记在镖单末尾，说算半个自己人。"
news = "浯屿外的人说，月港林家的鸟船今年替几条夜里送米的船看风，巡船一露头就挂起两盏灯，一回也没错过。"

[tracks.chapters.choices.fail]
next = "a06_lamp_for_wang"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_24_friend" }]
news = "浯屿外的人说，月港那条鸟船头一回替人看风，错把渔船当成巡船，害得夜里送米的小艇白跑了半夜。"

[[tracks.chapters.choices]]
key = "inform"
text = "天亮去海沧的安边馆，把这条船报上去"
next = "a06_lamp_for_wang"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_informed" }, { kind = "reputation", faction = "ming", value = 3 }, { kind = "cash", value = 300 }, { kind = "affinity", person = "qin_hongying", value = -10 }]
reply = "安边馆赏了我一小包银子，通判的书吏连我的名字都没问，那包银子轻得有点好笑。后来在码头上，秦红缨迎面走过来，把刀从左手换到右手，一句话也没说。"
news = "海沧安边馆里，有人报上去一条给浯屿番舶送米的船，赏银只有一小包，码头上的人说，报信的那位走路都低着头。"

# a06 老船主的灯：王直之死的回响。h14_wang_zhi_return_wang_zhi_amnestied 互斥：缺省两项（史实），改写两项。
[[tracks.chapters]]
key = "a06_lamp_for_wang"
title = "老船主的灯"
text = "开春，从杭州回来的船带来一张抄下来的告示：官巷口斩了“徽王”汪直，枭首示众。船上的人围着那张纸，有人骂，有人不吭声，老舵工把它揉成一团又展开。“他的船烧过多少村子，他的旗也护过多少条船，”老舵工说，“两本账，记不平的。”小水手凑过来问：“船主，那面徽字旗，往后还挂不挂？”我没答。我买了一盏纸灯，不是腰上那盏，攥在手里，没点。船舷外的水黑得看不见底。"
speaker = "captain"
mood = "sad"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1560, 2, 1] }]

[[tracks.chapters.variants]]
key = "lived"
when = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied" }]
text = "杭州来的船说，老船主受了封，船队挂起朝廷给的旗。码头上放了一挂鞭炮，有人骂他降了，有人说海上要太平了。老舵工蹲在炮仗纸屑里不说话，过了半天才冒出一句：“他的旗以后好看了，不知道还护不护人。”我还是买了一盏纸灯，攥在手里，没点。"

[[tracks.chapters.variants]]
key = "pleaded"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_pleaded" }]
text = "开春，从杭州回来的船带来一张抄下来的告示：官巷口斩了“徽王”汪直，枭首示众。船上的人围着那张纸，有人骂，有人不吭声，老舵工把它揉成一团又展开。“他的船烧过多少村子，他的旗也护过多少条船，”老舵工说，“两本账，记不平的。”小水手凑过来问：“船主，那面徽字旗，往后还挂不挂？”我没答。我买了一盏纸灯，不是腰上那盏，攥在手里，没点。船舷外的水黑得看不见底。我递进宁波的那几条条件，大概跟他一起埋了。"

[[tracks.chapters.variants]]
key = "urged"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_urged" }]
text = "开春，从杭州回来的船带来一张抄下来的告示：官巷口斩了“徽王”汪直，枭首示众。船上的人围着那张纸，有人骂，有人不吭声，老舵工把它揉成一团又展开。“他的船烧过多少村子，他的旗也护过多少条船，”老舵工说，“两本账，记不平的。”小水手凑过来问：“船主，那面徽字旗，往后还挂不挂？”我没答。我买了一盏纸灯，不是腰上那盏，攥在手里，没点。船舷外的水黑得看不见底。他肯去杭州，有一半是我劝的。"

[[tracks.chapters.choices]]
key = "lived_toast"
text = "把他受封的消息讲给船上的人听，今晚多开一坛酒"
requires = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied" }]
next = "a07_names_on_list"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_lived" }, { kind = "memory", memory = "mem-main_lin_wandeng-a06", title = "为老船主点的灯" }]
reply = "酒开到第三坛，有人说海上要太平了，有人说太平了反而没饭吃。我把那盏纸灯点上放出去，当是贺他。灯漂得很稳，一路都亮着。"

[[tracks.chapters.choices]]
key = "lived_flag"
text = "托弥七捎话：林家的船往后也挂他的旗"
requires = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied" }]
next = "a07_names_on_list"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_lived" }, { kind = "reputation", faction = "wang_zhi", value = 5 }]
reply = "弥七的回话只有一句，口传的：“船主说，挂可以，旗钱照付。”我笑了半天，笑得老舵工直瞪我，最后连他的烟锅也抖了起来。"

[[tracks.chapters.choices]]
key = "died_lamp"
text = "在船舷外放一盏纸灯，替老船主照一程"
requires = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied", value = false }]
next = "a07_names_on_list"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_died" }, { kind = "memory", memory = "mem-main_lin_wandeng-a06", title = "为老船主点的灯" }]
reply = "我把灯点上，放在船舷外的水面上。灯漂出去很远，浪一大，光被水吞掉了，灯芯大概正在水里一跳一跳。我屏着气等，心里只有一句：它要是灭了，我就当没看见。等到它又露了出来，才敢喘。灯漂到看不见的地方，船上的人才慢慢散开。老舵工替我把剩下的灯油收好，说这一盏点得值。"

[[tracks.chapters.choices]]
key = "died_furl"
text = "把船上那面徽字小旗收进箱底，不再挂"
requires = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied", value = false }]
next = "a07_names_on_list"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_wangzhi_died" }, { kind = "reputation", faction = "ming", value = 2 }]
reply = "旗叠了四折，压在罗盘匣下面，那盏纸灯没点，和旗叠在一处。往后过卡子，兵丁翻我的舱，翻不到它。"

# a07 名单上的姓：戚继光入闽，名单压在桌角。不写横屿的草捆与烂泥滩（C7）。
[[tracks.chapters]]
key = "a07_names_on_list"
title = "名单上的姓"
text = "秋天的福州码头，戚家军刚从福清过来，兵在岸边操练狼筅，竹枝上的叶子还没摘净。一个把总在码头摆了张桌子，雇船，也雇熟悉兴化湾水路的人；桌角压着一张名单：漳州沿海“通番”的人家，打完倭寇再一户户清理。第三行，月港林，墨还是新的，离我的手只有一尺。戚继光自己走过来查火药，抓起一袋硝掂了掂，又看了看我的船：“火药和硝你带了多少？以次充好的，在我营里要掉脑袋。”把总在边上催：“会走兴化湾的？会就坐，不会就让开。”戚继光拿起名单扫了一眼，说营里只打倭，船户的事归府里管。他没撕，又放回了桌角。"
window = [[1562, 9, 1], [1562, 11, 30]]
at = "fuzhou"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["qi_jiguang"]
news = "福州码头上，戚家军的把总拿着一张通番人家的名单雇船，排在头一个的是月港林家的鸟船。"

[tracks.chapters.default]
next = "a08_pinghai"
effects = []
news = "戚家军破了林墩，又回浙江去了；那张通番人家的名单留在了福州府的柜子里。"

