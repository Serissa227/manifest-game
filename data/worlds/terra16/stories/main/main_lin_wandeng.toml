[[tracks.chapters.choices]]
key = "end_merchant"
text = "把红灯笼挂上新船的桅杆：林家的船照船引出洋"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_done" }, { kind = "flag", flag = "c13_main_lin_wandeng_end_merchant" }, { kind = "title", title = "月港的船主" }, { kind = "memory", memory = "mem-main_lin_wandeng-c12", title = "不灭的灯" }]
reply = "新船下水那天，九龙江口的船都挂了灯。我的那盏挂得最高，也最小。出港的时候，卡子上的兵冲我喊了一声“林船主”，没查。船引上写的是东西二洋，写得清清楚楚；西边那颗星，船引上没有位置。后生蹲在缆桩上问我：“船主，西边那颗星，不去了？”我说：“船引上没写，先把船引上写的跑完。”他嘟囔着收了缆。母亲站在天妃宫的石阶上，没挥手，只把殿前的灯多点了一盏。我把罗盘匣盖上，冲后生们笑了一声：往南，起锚。"

[[tracks.chapters.choices]]
key = "end_temple"
text = "回天妃宫守灯：海上的事交给后生"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_done" }, { kind = "flag", flag = "c13_main_lin_wandeng_end_temple" }, { kind = "title", title = "天妃宫的守灯人" }, { kind = "memory", memory = "mem-main_lin_wandeng-c12", title = "不灭的灯" }]
reply = "我把船交给了跟我最久的那个后生，宫里添油的人轮着排班，傍晚那一班我排给了自己。梯子很高，我爬到第三级，就学会了母亲的喘。爬到顶才发现，从那儿望出去，九龙江口的桅杆一根一根都认得出是谁家的。出港的船经过宫前都要鸣一声锣，我在梯子上一个一个数，数错了从头数，跟父亲当年一样。海上的事，后生们每回靠岸都来讲给我听，我听到一半，叫他们别讲了，又催着往下讲。"

[[tracks.chapters.choices]]
key = "end_west"
text = "照原记末页的星，再往西走一回"
requires = [{ kind = "item", item = "star_crossing_original", qty = 1 }]
hint = "原记不在你箱子里，西边的星你只记得一半。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_done" }, { kind = "flag", flag = "c13_main_lin_wandeng_end_west" }, { kind = "title", title = "西洋之西的灯" }, { kind = "memory", memory = "mem-main_lin_wandeng-c12", title = "不灭的灯" }]
reply = "开春刮北风，我的船出了九龙江口一直往南，再往西。月港的人说林船主老了还不安分。出港前我去天妃宫添了一回油，添得很满，梯子脚下站着母亲，没说话，把一罐灯油塞进我怀里，罐口封着蜡。后生里有五个自己报了名，我一个一个问他们怕不怕鬼，三个说怕，两个说不怕，我把说不怕的那两个留在了岸上。我在原记末页又添了一行字：此去，不问归期。"

# ───────────── 旁轨（2026-11-11 剧情增写）：引票（林长，开海以后到他死） ─────────────
# 母本：《水浒传》受招安以后的结局（走正路的人被正路吃掉）；《史记·刺客列传》豫让（为知己者死，反写为乡亲）；
#       文化：开海以后的保人、牙人与船引，一级一级往上走，一级一级交出自己；张力：他替官府管了二十年船，管到最后，官府要他交出管不住的那些船。
# 入口：c13_main_lin_wandeng_act2（b01 的缺省与每个选项都设）加日期。y1 在月港（期限与超时），其余无 at、进入即弹出（不写死所在港口）。
# 读养成期旗标：ledger_scorned / ledger_heard / ke_fed / forged_bond（人物线 A）、lamp_confessed（人物线 D）；读本轨的 chang_vouched / chang_scorned。
# 本轨设：chang_vouched、chang_scorned（y1、y3）给 y3、y4 的变体读；ledger_lamps（y5）给旁轨“旧营的号令”o5 读。
[[tracks]]
key = "main_lin_wandeng_rw_yinpiao"
name = "引票"
kind = "main"
start = "y1_license_house"
auto = true
cast = ["lin_wandeng"]

[[tracks.chapters]]
key = "y1_license_house"
title = "林记保船"
text = "开海的头一年，天妃宫东边那排旧货栈里，新挂了一块黑漆招牌：林记保船。大哥坐在招牌底下，穿一件青布直身，袖口洗得发白，面前摆着算盘、印泥和一摞空白的保结。领船引的人先要找保人，保人替他们给海防馆的书办写结，写一张，收一钱例银。排队的船户从门口排到江边，见了他都叫“林保长”。我十年没见他，他胖了一点，拇指还在算盘珠上拨。看见我，他先看我的船，再看我：“阿灯，引票我替你保。往日本的，不保。”"
at = "yuegang"
speaker = "captain"
mood = "tense"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1567, 3, 1] }]
deadline = [1568, 10, 31]

[tracks.chapters.timeout]
next = "y2_name_given"
effects = []
news = "开海头一年，月港天妃宫东边新挂了一块“林记保船”的招牌，领引的船户从门口排到了江边。"

[[tracks.chapters.choices]]
key = "vouch"
text = "排进队里，请大哥替我的船作保"
next = "y2_name_given"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_chang_vouched" }, { kind = "reputation", faction = "ming", value = 1 }]
reply = "排到他跟前，我报了船名、梁头、往哪一洋。他写得很快，写到保人一栏，按了手印，又拿袖口擦掉印泥边上溢出来的那点红。书办伸手要例银，我笑着说：“客官先记着。”大哥已经从自己的钱袋里摸出一钱，替我交了：“自家人的例银，我出。出了，就没人能说林保长偏私。”这话我想了一路，也没想明白是偏还是不偏。"

[[tracks.chapters.choices]]
key = "dog"
text = "当着排队的人，喊他一声“林保长”，再啐一口"
next = "y2_name_given"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_chang_scorned" }]
reply = "我扬着嗓子喊了一声“林保长”，满屋的人都回过头，我往地上啐了一口。排队的船户里有人笑，有人往后退。大哥没抬头，接着给下一个人写结：“下一位。”我走出门，听见他在后头跟书办说：“我妹子，脾气随我阿爹。”书办也笑了。笑得最轻的是他。"

[[tracks.chapters.choices]]
key = "ask"
text = "把他拉到后间，问：往日本的那些船，你记不记"
next = "y2_name_given"
effects = []
reply = "他关上门才开口：“记。”他拿指头点了点太阳穴，“往吕宋的引，十张里有三张去的是平户，书办知道，我知道，大家都不说。我保的是吕宋；他们去了哪里，是海的事。”说完他拉开门，换了一副脸，朝外头喊：“下一位！”"

[[tracks.chapters.variants]]
key = "a1_scorned"
when = [{ kind = "flag", flag = "rw_lin_wandeng_ledger_scorned" }]
text = "开海的头一年，天妃宫东边那排旧货栈里，新挂了一块黑漆招牌：林记保船。大哥坐在招牌底下，穿一件青布直身，袖口洗得发白，面前摆着算盘、印泥和一摞空白的保结。领船引的人先要找保人，保人替他们给海防馆的书办写结，写一张，收一钱例银。排队的船户从门口排到江边，见了他都叫“林保长”。我十年没见他，他胖了一点，拇指还在算盘珠上拨。看见我，他先看我的船，再看我，像在等我开口骂人。我骂过他官府的狗，他记得比我清楚：“阿灯，要骂，先排队。引票我替你保。往日本的，不保。”"

[[tracks.chapters.variants]]
key = "a2_heard"
when = [{ kind = "flag", flag = "rw_lin_wandeng_ledger_heard" }, { kind = "flag", flag = "rw_lin_wandeng_ledger_scorned", value = false }]
text = "开海的头一年，天妃宫东边那排旧货栈里，新挂了一块黑漆招牌：林记保船。大哥坐在招牌底下，穿一件青布直身，袖口洗得发白，面前摆着算盘、印泥和一摞空白的保结。领船引的人先要找保人，保人替他们给海防馆的书办写结，写一张，收一钱例银。排队的船户从门口排到江边，见了他都叫“林保长”。我站在队尾，听他跟书办报数，报一条，下巴就轻轻动一下。那是他念第二本账的样子，我在货栈的阁楼上见过。看见我，他先看我的船，再看我：“阿灯，引票我替你保。往日本的，不保。”"

[[tracks.chapters]]
key = "y2_name_given"
title = "柯家的船"
text = "春天，月港来的船捎来阿母的信，信里夹着大哥的一页。阿母写家常，写到一半，笔迹变了，是大哥接着写的：海防馆新来的老爷要立规矩，叫保长们各报一家欠饷不交的船户，杀一儆百。“我报了柯家。柯阿水那条船，三年没纳过一文水饷，人人都知道。报一家，三十条船的饷就收齐了。”信纸最后一行是阿母添的，字小得像蚂蚁：柯阿水的船，充公了。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1572, 4, 1] }]

[[tracks.chapters.choices]]
key = "money"
text = "托船捎二百两给柯阿水，不署名"
next = "y2b_cap"
requires = [{ kind = "cash", ge = 200 }]
hint = "这笔银子，你眼下拿不出来。"
effects = [{ kind = "cash", value = -200 }]
reply = "银子托给了跑月港的熟船，包了三层油布，里头不放一个字。船家问给谁，我说柯阿水；问谁送的，我说海里捞的。后来阿母来信说，柯阿水拿那包银子另造了一条小船，船头漆了一盏红灯。他不知道是谁送的。大哥知道。"

[[tracks.chapters.choices]]
key = "letter"
text = "回信只写给大哥：你那本账，还记得清吗"
next = "y2b_cap"
effects = []
reply = "我写得很短：一家换三十条，算盘是对的。可十几年前你换下来的那四条、那十条，跟今天这三十条，你脑子里那一本，还记得清吗？信发出去半年，大哥回了一个字：清。字写得很重，墨洇穿了纸，翻过来，背面也是一个“清”。"

[[tracks.chapters.choices]]
key = "keep"
text = "把信压进罗盘匣，不回"
next = "y2b_cap"
effects = []
reply = "我把信叠好，压进罗盘匣底，跟别的纸压在一处。那夜船在海上走得很稳，我睡不着，起来看针。针碗里的水一动不动，针指着北，指着月港的方向。我对着它说了一句“清个鬼”，没人听见。"

[[tracks.chapters.variants]]
key = "a1_fed"
when = [{ kind = "flag", flag = "rw_lin_wandeng_ke_fed" }]
text = "春天，月港来的船捎来阿母的信，信里夹着大哥的一页。阿母写家常，写到一半，笔迹变了，是大哥接着写的：海防馆新来的老爷要立规矩，叫保长们各报一家欠饷不交的船户，杀一儆百。“我报了柯家。柯阿水那条船，三年没纳过一文水饷，人人都知道。报一家，三十条船的饷就收齐了。”信纸最后几行是阿母添的，字小得像蚂蚁：柯阿水的船，充公了。他来殿里找过我，问十几年前半夜给他阿公送水的那个读书后生，是不是你。我说不知道。"

[[tracks.chapters.variants]]
key = "a2_bond"
when = [{ kind = "flag", flag = "rw_lin_wandeng_forged_bond" }, { kind = "flag", flag = "rw_lin_wandeng_ke_fed", value = false }]
text = "春天，月港来的船捎来阿母的信，信里夹着大哥的一页。阿母写家常，写到一半，笔迹变了，是大哥接着写的：海防馆新来的老爷要立规矩，叫保长们各报一家欠饷不交的船户，杀一儆百。“我报了柯家。柯阿水那条船，三年没纳过一文水饷，人人都知道。报一家，三十条船的饷就收齐了。那年你替他写的那张保结，还在我账柜里。”信纸最后一行是阿母添的，字小得像蚂蚁：柯阿水的船，充公了。"

[[tracks.chapters]]
key = "y2b_cap"
title = "一顶冠带"
text = "阿母的信里说，大哥得了一顶冠带。海防馆的老爷说他收饷有功，替县里省了一年的兵，报上去，赏了他一个义民的名头，一顶乌纱，一条角带。他戴着去了天妃宫，在长明灯底下站了一会儿，没上香，又摘下来，用油纸包了，锁进账柜。“他说，戴着这个，不好在灯前站。”阿母写，“我问他为什么。他说灯前的话要说实，戴着它，他说不出实话来。”"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1577, 5, 1] }]

[[tracks.chapters.choices]]
key = "congrat"
text = "回信道一声喜：林家头一个戴冠带的"
next = "y3_harder_than_clerk"
effects = []
reply = "我写：恭喜大哥，林家几代跑海，你是头一个戴冠带的，阿爹要是还年轻，准要骂你。写完又看了一遍，觉得这话说得太漂亮，像别人家的妹子写的。回信是大哥自己写的：“谢。阿爹骂了。”底下画了一颗算盘珠。"

[[tracks.chapters.choices]]
key = "price"
text = "回信问：这顶帽子，你拿什么换的"
next = "y3_harder_than_clerk"
effects = []
reply = "大哥回了一张单子，跟当年列货价一个样：后港的锅，十一口；网，七张；柯家的船，一条；吴家的二小子，在海防馆的牢里关了四十天。单子最底下一行：“还有我自己，不知值几钱。”我把单子压进罗盘匣，盖子盖上，又掀开看了一眼。"

[[tracks.chapters.choices]]
key = "sea"
text = "不回信，夜里在船头把阿母那句话念给海听"
next = "y3_harder_than_clerk"
effects = []
reply = "我没回信。夜里在船头，我把阿母信里那句话念了一遍：戴着它，他说不出实话。念完觉得海风有点冷。船工问我念什么，我说念我大哥。他们说你大哥是做官的吧。我说算是，戴帽子的那种。"

[[tracks.chapters]]
key = "y3_harder_than_clerk"
title = "林剥皮"
text = "靠港那天，码头上碰见一个月港来的老船户，他认出我的灯笼，蹲在跳板边跟我讲家乡的事，讲到大哥，啐了一口：“你那个哥，如今管着全县的引票，比书办还狠。加增饷一下来，他头一个去收，收到后港那几户打鱼的，拿锅抵，拿网抵。人家骂他林剥皮，他照收。”老船户说完又看我，“姑娘，你别恼。你哥嘛，说是他替大家收齐了，海防馆就不派兵来点船。谁知道是真是假。”"
speaker = "captain"
mood = "tense"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1582, 3, 1] }]

[[tracks.chapters.choices]]
key = "defend"
text = "替大哥辩一句：他收齐了，兵就不来"
next = "y3b_forgetting"
effects = []
reply = "我说他收齐了，海防馆就没有借口派兵点船，点船的兵是要烧船的。老船户看了我很久：“姑娘，你这话跟你哥说的一模一样。”他起身走了，走到跳板尽头又回头，“一模一样。”那天我在舱里坐到半夜，把这句话翻来覆去，越翻越不像我自己说的。"

[[tracks.chapters.choices]]
key = "curse"
text = "跟着骂一句：林剥皮，骂得好"
next = "y3b_forgetting"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_chang_scorned" }]
reply = "我嗓门比他还响：林剥皮，好名字，回头我替他刻在招牌上。老船户反倒愣了，讪讪地说做妹子的别这么讲。我给他倒酒，倒到第三碗，他醉了，拉着我的袖子说，前年他家的船没引被扣，是我大哥半夜去海防馆领回来的。“林剥皮，”他打着嗝，“剥别人的皮，不剥咱们的。”"

[[tracks.chapters.choices]]
key = "fishers"
text = "问他：后港那几户打鱼的，后来怎么样了"
next = "y3b_forgetting"
effects = []
reply = "老船户说，锅抵了，网抵了，人没事，第二年又借了网下海。我问借谁的网。他想了想：“好像是林家货栈里赊的，不要利钱。”说完他自己也糊涂了，挠着头说这事怪，剥了皮，又给你缝上。我没告诉他，这是大哥算盘上的一进一出，进的那笔给官府看，出的那笔给自己看。"

[[tracks.chapters.variants]]
key = "a1_vouched"
when = [{ kind = "flag", flag = "rw_lin_wandeng_chang_vouched" }]
text = "靠港那天，码头上碰见一个月港来的老船户，他认出我的灯笼，蹲在跳板边跟我讲家乡的事，讲到大哥，啐了一口：“你那个哥，如今管着全县的引票，比书办还狠。加增饷一下来，他头一个去收，收到后港那几户打鱼的，拿锅抵，拿网抵。人家骂他林剥皮，他照收。满县的船，就你那一条的例银他自己掏，这个大家也都知道。”老船户说完又看我，“姑娘，你别恼。你哥嘛，说是他替大家收齐了，海防馆就不派兵来点船。谁知道是真是假。”"

[[tracks.chapters]]
key = "y3b_forgetting"
title = "记不住了"
text = "回月港的那个冬天，大哥请我去货栈喝茶。招牌还挂着，漆掉了一半，林记的“记”字只剩个言字旁。他老了，算盘还在手边，拇指却不大拨了。茶倒到第二碗，他忽然说：“阿灯，我记不住了。”他说上个月念第二本账，念到后港，想不起吴家二小子叫什么，在黑里坐着想了一夜。“记不住的那些，我念给阿母，她拿灯簿记。”他看着茶碗，“一本账，记的人多了，就是供词。我知道。可我记不住了。”"
at = "yuegang"
speaker = "captain"
mood = "tender"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1586, 3, 1] }]
deadline = [1587, 10, 31]

[tracks.chapters.timeout]
next = "y4_cangue"
effects = []
news = "月港天妃宫东边那块“林记保船”的招牌，漆掉了一半。"

[[tracks.chapters.choices]]
key = "name"
text = "替他去后港，问一问吴家二小子的名字"
next = "y4_cangue"
effects = []
reply = "我去后港问了，吴家二小子叫阿顺，前年娶了亲，船头挂一盏红灯。我回来告诉大哥，他“哦”了一声，嘴唇动了动，像把这个名字塞回了脑子里的哪一格。过了一会儿，他又问：“叫什么？”我说阿顺。他跟着念：“阿顺。”"

[[tracks.chapters.choices]]
key = "stop"
text = "劝他：别记了，这本账该收了"
next = "y4_cangue"
effects = []
reply = "我说港开了快二十年，夜里出去的船你记了二十年，够了，该收了。大哥摇头：“港开了，日本还不开。只要有一条船夜里出去，就得有人记它几时走、几时回、欠了谁。不然它沉了，没人知道它出去过。”他说这话的口气，像阿母说起那盏撤掉的灯。"

[[tracks.chapters.choices]]
key = "me"
text = "跟他说：记不住的，念给我听"
next = "y4_cangue"
effects = []
reply = "他看了我很久，摇了摇头：“你在海上，你的船也在这本账里。记账的人，不能在账上。”他把茶碗推到我面前，叫我喝完。我喝完了，他又续满，续到第三碗，才说：“阿母记。阿母不出海。”那天我走的时候，他送到门口，站在招牌底下，手里没拿算盘。"

[[tracks.chapters]]
key = "y4_cangue"
title = "县衙前的枷"
text = "入冬，阿母的信是请人代写的，字是陌生的，话是她的。海澄县新来的老爷要定船引的额数，额外的船一律不许出海；又听说江口夜里常有船往东走，没引，叫保长们把船名报上来。别的保长都报了，大哥不报。老爷问他，他说：“没有。”老爷说有人看见。他说：“那叫看见的人报。”第二天，县衙门口多了一副枷，枷里是大哥，封条上写着“抗命”。阿母说：天冷，他穿得少，我送了两回棉袄，衙役不让送进去。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1587, 11, 15] }]

[[tracks.chapters.choices]]
key = "silver"
text = "托最快的船捎银子回去，打点衙门放人"
next = "y5_second_book"
requires = [{ kind = "cash", ge = 500 }]
hint = "这么大一笔打点钱，你眼下拿不出来。"
effects = [{ kind = "cash", value = -500 }]
reply = "银子交给最快的那条船，带着一封信，写给县里一位认得的老秀才，请他替我送进该送的门。船走了，我在舱里一个时辰一个时辰地数。回信说银子收了，衙役松了口，棉袄送进去了，人放不放，要等老爷过了年再说。老爷那个年，过得很长。"

[[tracks.chapters.choices]]
key = "plead"
text = "写信劝大哥：把名单交了，人先出来"
next = "y5_second_book"
effects = []
reply = "我写：你保了一辈子的船，保不住你自己。名单交出去，他们最多扣几条船，船没了还能再造，人没了什么都没了。写完读了一遍，才发觉这是十年来我头一回求他。回信还是阿母请人代写的，只带了大哥一句话：“交了，夜里出去的人就回不来。阿灯，你在海上，你知道。”"

[[tracks.chapters.choices]]
key = "sheng"
text = "回信只问一句：二哥呢"
next = "y5_second_book"
effects = []
reply = "阿母的回信隔了一个月才到：你二哥还在江口南岸那座墩上，夜里点火的那座。他来县衙前站过一回，隔着看热闹的人看了你大哥一眼，没往前走，又回墩上去了。“他说，墩上的令，不能离人。”"

[[tracks.chapters.variants]]
key = "a1_ke"
when = [{ kind = "flag", flag = "rw_lin_wandeng_ke_fed" }]
text = "入冬，阿母的信是请人代写的，字是陌生的，话是她的。海澄县新来的老爷要定船引的额数，额外的船一律不许出海；又听说江口夜里常有船往东走，没引，叫保长们把船名报上来。别的保长都报了，大哥不报。老爷问他，他说：“没有。”老爷说有人看见。他说：“那叫看见的人报。”第二天，县衙门口多了一副枷，枷里是大哥，封条上写着“抗命”。阿母说：天冷，他穿得少，我送了两回棉袄，衙役不让送进去。倒是柯阿水天天傍晚去喂他喝水，衙役拦，阿水说：“吃果子要拜树头。我阿公戴枷那年，也有人来喂。”"

[[tracks.chapters.variants]]
key = "a2_scorned"
when = [{ kind = "flag", flag = "rw_lin_wandeng_chang_scorned" }, { kind = "flag", flag = "rw_lin_wandeng_ke_fed", value = false }]
text = "入冬，阿母的信是请人代写的，字是陌生的，话是她的。海澄县新来的老爷要定船引的额数，额外的船一律不许出海；又听说江口夜里常有船往东走，没引，叫保长们把船名报上来。别的保长都报了，大哥不报。老爷问他，他说：“没有。”老爷说有人看见。他说：“那叫看见的人报。”第二天，县衙门口多了一副枷，枷里是大哥，封条上写着“抗命”。阿母说：天冷，他穿得少，我送了两回棉袄，衙役不让送进去。码头上骂过他林剥皮的人，这些天都绕开县衙走，没人骂了，也没人去看。"

[[tracks.chapters]]
key = "y5_second_book"
title = "灯簿的后半本"
text = "开春，月港来的船带来一只油布包，是阿母寄的。包里是天妃宫的灯簿，前半本是捐油人的名字，我在社学那几年誊过；后半本我从没见过，每一页都是灯：某月某日，许灯一盏，吴家；某月某日，许灯两盏，柯家……一盏灯，是一条夜里出港的船；“另付”那一栏，是大哥替他们垫的例钱，一笔一笔，记了二十年。最后一页是阿母的字：你大哥是正月里在枷上走的。走以前托人带出来一句话：让他们夜里别点灯出港。"
speaker = "captain"
mood = "sad"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "date", from = [1588, 4, 1] }]

[[tracks.chapters.choices]]
key = "burn"
text = "把后半本烧了：这本账，不能再有人记"
next = "done"
effects = []
reply = "我在船尾点了一盏灯，把后半本一页一页撕下来烧。烧到柯家那一页，手停了一下，还是烧了。灰被风卷到海上，落得很远。大哥说过，这本账只许一个人记，记的人多了，就是供词。现在一个人也不记了。烧完我把灯簿合上，前半本那些捐油人的名字，还好好的。"

[[tracks.chapters.choices]]
key = "keep"
text = "把灯簿压进罗盘匣，跟船引放在一起"
next = "done"
effects = []
reply = "灯簿太厚，罗盘匣盖不上，我把匣底那块木头撬了，垫高一寸，才盖严。从此罗盘匣里压着两样东西：一张给官府看的船引，一本给自己看的灯簿。老舵工问我匣子怎么重了，我说多了一本账。他说账有什么重的。我说这本重。"

[[tracks.chapters.choices]]
key = "lamps"
text = "照着后半本，在船头给每一条船点一盏灯"
next = "done"
effects = [{ kind = "flag", flag = "rw_lin_wandeng_ledger_lamps" }]
reply = "那夜我在船头挂满了灯，点一盏，念一个名字：吴家，柯家，后港陈家……点到后来灯不够了，就把舱里的油灯也端上来。船工们站在甲板上看，谁也不问。海上很黑，我的船亮得像一座小庙。大哥要是看得见，准又要说我毛躁，油钱谁出。"

