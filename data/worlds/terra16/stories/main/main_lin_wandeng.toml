# c02 拿纸不拿印：察哈尔的老管事与毡包。只看、只记、只拓，不写偷与抢；苏泰本人不出场。
[[tracks.chapters]]
key = "c02_paper_not_seal"
title = "拿纸不拿印"
text = "辽河口的牛庄马市上卖马、卖盐、卖人参，沈阳来的人在人堆里来回走。一个察哈尔的老管事抱着一个毡包，坐在我的船边不动，说大汗死在西边的草场上，太后和小台吉手里还留着一方印，元朝传下来的，有人说就是秦朝那一方。太后只准压一张印文：拿纸，不拿印。她不给沈阳的人，也不给北京的人，要给一个“海上的、不归哪一边的人”。老管事要的是一船绸缎，和一句话：这张纸，不卖到沈阳去。他解开毡子，印就压在羊毛里，比我想的小，绿得发黑。“太后说了，印是帐里的，纸是你的。朱砂只蘸一次，压坏了，没有第二张。”我笑他：“一船绸缎换一张纸，客官，这买卖我做过更亏的。”他没笑。我心里算过：一方印能换一座江山，一张纸只换得来一句许诺，我想要的是纸。"
at = "niuzhuang"
speaker = "captain"
mood = "mystic"
cast = ["sutai", "ejei"]
when = [{ kind = "date", from = [1579, 6, 1] }]
deadline = [1580, 3, 31]

[tracks.chapters.timeout]
next = "c03_summons"
effects = []
news = "察哈尔的人开春献了印；牛庄马市上那个抱毡包的老管事，再也没来过。"

