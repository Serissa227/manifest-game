[[tracks.chapters.choices]]
key = "take_keys"
text = "接下灯钥：往后我出海，宫里的灯也归我管"
next = "c08_rice_north"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_temple_keys" }]
reply = "我请了宫边两个寡妇轮着添油，钱从我的船上出。大哥嘟囔了一晚，第二天一早却第一个来扶梯子，扶得很紧，说梯子年头久了，别摔了他的钱。钥匙我系在腰带上，走一步响一步，母亲在宫门口听着，说这声音她听了三十年，换个人腰上响，倒不习惯。"
news = "月港天妃宫的长明灯换了管钥匙的人，林家的女儿出海前把宫里的油库添满了。"

[[tracks.chapters.choices]]
