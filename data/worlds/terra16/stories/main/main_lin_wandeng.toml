[[tracks.chapters.choices]]
key = "lobby"
text = "凑一笔银子给县里的士绅，替“多开几个港”的条陈打点"
requires = [{ kind = "cash", ge = 1500 }]
hint = "士绅们看了看你的钱袋，客气地请你去后头排队。"
next = "b02_last_page"
effects = [{ kind = "cash", value = -1500 }, { kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "flag", flag = "c13_main_lin_wandeng_lobbied" }]
reply = "条陈写得花团锦簇，我的名字排在第十一个，前头十位都比我会说“为民请命”。士绅收银子的时候手很稳，说递上去要等，等多久没人知道。母亲在台阶上看着，没问我花了多少。我对她笑了笑：“本钱嘛，先下了再说。”"
news = "月港天妃宫前的士绅凑钱递条陈，要把广州、宁波也开了，署名排第十一位的是林家的女儿。"

[[tracks.chapters.choices]]
key = "license"
text = "排进书办的队，领一张往东洋的船引"
next = "b02_last_page"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "flag", flag = "c13_main_lin_wandeng_licensed" }, { kind = "reputation", faction = "ming", value = 3 }]
reply = "书办在船引上写下“往东洋吕宋”，盖了印，递给我时手指上全是朱砂。我折好放进罗盘匣，那地方以前压过的是假的。父亲在台阶底下数帆，数到我这一条，抬手指了指：“这条没数错。”"
news = "月港天妃宫外领船引的队排到了江边，林家的女儿领的是一张往东洋吕宋的。"

[[tracks.chapters.choices]]
key = "japan_run"
text = "不领船引，照旧夜里往日本走"
next = "b02_last_page"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_act2" }, { kind = "flag", flag = "c13_main_lin_wandeng_japan_run" }, { kind = "reputation", faction = "ming", value = -3 }]
reply = "我把船引的队让给后头的人，转身往码头走。母亲看我把船又往江口外挪，什么也没说，只往我手里塞了一包糖渍的杨桃干，酸得牙根发软。父亲在台阶底下嘟囔：“白天开进来，夜里开出去，这条船倒会过日子。”开了海，我还是夜里走。"
news = "开海这一年的月港，林家的鸟船没领船引，天一黑就出了江口，船头一盏红灯笼压得低低的。"

# b02 原记的末页：温星槎把祖父的过洋牵星原记交出来。不写望海楼、云脚、竹杖（C7），不说破西洋之西。
[[tracks.chapters]]
key = "b02_last_page"
title = "原记的末页"
text = "梅雨天，温星槎屋里潮得能拧出水，她把星图箱子垫高了三块砖。她七十了，去年坐着领了船引的船出了一趟洋，回来腿就不大听使唤。箱子里是她祖父随宝船下西洋时记的过洋牵星原记：几指几角，密密麻麻，纸边有朱笔改过的痕迹。她推过一卷来，手掌却一直压在最后一页上：“后生，抬头。量一量，几指？答不上来，这卷纸你就别碰。”我答：“三指半，温婆婆。”她点点头，才说：“图能照着画，原记只这一份。我这把骨头出不去了，它得跟着船走。”她终于抬起手掌，末页只有一颗星的位置和几个指数，指向西洋还要往西的地方。我问她祖父见没见过那里。“西洋以外有什么，等这卷你认熟了再问，”她说，“眼前的星，一颗也不许叫错。”纸上有个浅浅的掌印，是她几十年压出来的。"
at = "yuegang"
speaker = "captain"
mood = "tender"
cast = ["wen_xingcha"]
when = [{ kind = "date", from = [1568, 2, 1] }]
deadline = [1568, 10, 31]

[tracks.chapters.timeout]
next = "b03_borrowed_flag"
effects = []
news = "月港最老的女火长今年又不出门了，码头上的后生说她屋里那口星图箱子一直没开。"

[[tracks.chapters.variants]]
key = "c7_first_voyage"
when = [{ kind = "flag", flag = "c7_tie_new_wen_xingcha_qin_hongying_landing" }]
text = "梅雨天，温星槎屋里潮得能拧出水，她把星图箱子垫高了三块砖。去年开海，她是被镖局的秦红缨背上船的，回来逢人就说外头的星没变，可她的腿变了。箱子里是她祖父随宝船下西洋时记的过洋牵星原记：几指几角，密密麻麻，纸边有朱笔改过的痕迹。她推过一卷来，手掌却一直压在最后一页上：“后生，抬头。量一量，几指？答不上来，这卷纸你就别碰。”我答：“三指半，温婆婆。”她点点头，才说：“图能照着画，原记只这一份。我这把骨头出不去了，它得跟着船走。”她终于抬起手掌，末页只有一颗星的位置和几个指数，指向西洋还要往西的地方。我问她祖父见没见过那里。“西洋以外有什么，等这卷你认熟了再问，”她说，“眼前的星，一颗也不许叫错。”纸上有个浅浅的掌印，是她几十年压出来的。"

[[tracks.chapters.choices]]
key = "swear"
text = "收下原记，对着她的罗盘起誓：不卖、不抵、不给官府"
next = "b03_borrowed_flag"
effects = [{ kind = "item", item = "star_crossing_original", qty = 1 }, { kind = "flag", flag = "c13_main_lin_wandeng_chart_sworn" }, { kind = "affinity", person = "wen_xingcha", value = 5 }, { kind = "memory", memory = "mem-main_lin_wandeng-b02", title = "原记的末页" }]
reply = "她让我把手按在罗盘边上，说一句我跟一句：不卖，不抵，不给官府。起完誓，她把原记用油纸裹了三层，又塞进一块樟脑，裹得比裹婴孩还仔细。“还行。”她说。这是夸我。我抱着包袱走回码头，一路没敢松手。"
news = "月港最老的女火长把一卷牵星的原记交给了林家的女儿，码头上有人说那卷纸比一条船还值钱。"

[[tracks.chapters.choices]]
key = "borrow"
text = "只借一年：量完末页的星就还给她"
next = "b03_borrowed_flag"
effects = [{ kind = "item", item = "star_crossing_original", qty = 1 }, { kind = "flag", flag = "c13_main_lin_wandeng_chart_borrowed" }, { kind = "affinity", person = "wen_xingcha", value = 3 }, { kind = "memory", memory = "mem-main_lin_wandeng-b02", title = "原记的末页" }]
reply = "她哼了一声，说一年够量什么。我说量不完就再借一年。她把原记推过来，手指在油纸上压了一下才松开：“那你得活着回来还。”我笑着应了，应得比起誓还响。"
news = "月港最老的女火长把牵星的原记借给林家的女儿一年，嘱咐她活着回来还。"

[[tracks.chapters.choices]]
key = "leave_it"
text = "请她自己留着：原记该跟着认得它的人"
next = "b03_borrowed_flag"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_chart_left" }, { kind = "affinity", person = "wen_xingcha", value = 8 }, { kind = "item", item = "wen_star_chart", qty = 1 }, { kind = "memory", memory = "mem-main_lin_wandeng-b02", title = "原记的末页" }]
reply = "她骂我没出息，骂了足足一盏茶的工夫，骂完从箱底抽出一份她自己誊的图塞给我：“原记留下，这份你拿去，丢了也不心疼。”我翻到誊本的末页，纸是新的，那一页没有字。她的手掌又按了上去。"
news = "月港最老的女火长把原记留在自己箱子里，只给了林家的女儿一份誊本，还骂了她一顿。"

# b03 挂着别人的旗：开海以后去日本仍是走私。澪是 NPC，只写好胜与旗钱。
[[tracks.chapters]]
key = "b03_borrowed_flag"
title = "挂着别人的旗"
text = "秋天的平户。开了海，月港的船能去南洋，偏偏不能来日本；可码头上照样泊着好几条福建船，船引上写的都是“往东洋吕宋”。弥七还守着老船主留下的这一摊，只认口信：“船名别报。货报给我，我记在心里。”澪的小早挂着一面一条家的旗进港，她这两年为土佐的事跑得脸都瘦了，开口还是先谈旗钱。码头上有个福建口音的闲汉一直盯着我的舱口，是替海道衙门记船名的。澪也看见了，眼睛一亮：“挂一面一条家的旗，海上没人敢动你。旗钱嘛——这回减半。”输人不输阵，我想，旗可以借，价不能让。"
at = "hirado"
speaker = "captain"
mood = "cheerful"
cast = ["mio", "yashichi"]
when = [{ kind = "date", from = [1568, 11, 1] }]
objectives = [{ kind = "goods", good = "raw_silk", qty = 20, at = "hirado", text = "二十担生丝运到平户" }]
deadline = [1570, 10, 31]

[tracks.chapters.timeout]
next = "b04_before_galleons"
effects = []
news = "开海以后月港的船照样往平户跑，只是这两年没见着林家那条鸟船，弥七在码头上白等了几季。"

[[tracks.chapters.variants]]
key = "japan_run"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_japan_run" }]
text = "秋天的平户。开了海，月港的船能去南洋，偏偏不能来日本；可码头上照样泊着好几条福建船，船引上写的都是“往东洋吕宋”。我连船引都没领，比他们还省一道谎。弥七还守着老船主留下的这一摊，只认口信：“船名别报。货报给我，我记在心里。”澪的小早挂着一面一条家的旗进港，她这两年为土佐的事跑得脸都瘦了，开口还是先谈旗钱。码头上有个福建口音的闲汉一直盯着我的舱口，是替海道衙门记船名的。澪也看见了，眼睛一亮：“挂一面一条家的旗，海上没人敢动你。旗钱嘛——这回减半。”输人不输阵，我想，旗可以借，价不能让。"

[[tracks.chapters.variants]]
key = "licensed"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_licensed" }]
text = "秋天的平户。开了海，月港的船能去南洋，偏偏不能来日本；可码头上照样泊着好几条福建船，船引上写的都是“往东洋吕宋”，我的那张也是，书办的朱砂印还鲜红。弥七还守着老船主留下的这一摊，只认口信：“船名别报。货报给我，我记在心里。”澪的小早挂着一面一条家的旗进港，她这两年为土佐的事跑得脸都瘦了，开口还是先谈旗钱。码头上有个福建口音的闲汉一直盯着我的舱口，是替海道衙门记船名的。澪也看见了，眼睛一亮：“挂一面一条家的旗，海上没人敢动你。旗钱嘛——这回减半。”输人不输阵，我想，旗可以借，价不能让。"

[[tracks.chapters.choices]]
key = "partner"
text = "跟澪合一船：挂一条家的旗卸货，赚的对半分"
next = "b04_before_galleons"
effects = [{ kind = "cash", value = 1200 }, { kind = "affinity", person = "mio", value = 8 }]
reply = "旗一挂，盯梢的闲汉就走了。澪数银子的时候比我还快，数完分我一半，又从我这一半里抠回旗钱。我们在码头上吵到天黑，吵的是那一枚铜板该算旗角还是算旗杆。"
news = "平户码头上，一条月港来的船挂着土佐一条家的旗卸生丝，她们两个船主为了旗钱又吵了一架。"

[[tracks.chapters.choices]]
key = "undercut"
text = "抢在澪前头，把丝直接卖给松浦家的人"
check = { attr = "intrigue", base = 20, per = 7 }
next = "b04_before_galleons"
effects = [{ kind = "cash", value = 2000 }, { kind = "affinity", person = "mio", value = -5 }]
reply = "我连夜把丝搬进松浦家的仓，价比行市高两成。第二天澪在码头上堵我，扇子敲了我脑门一下：“旗钱你欠我两回了，记着。”我捂着脑门笑，笑得她的扇子又举了起来。"
news = "平户松浦家的仓里，连夜搬进了月港来的生丝，价比行市高两成，土佐来的姬君第二天在码头上堵了卖主。"

[tracks.chapters.choices.fail]
next = "b04_before_galleons"
effects = [{ kind = "cash", value = 800 }, { kind = "affinity", person = "mio", value = -3 }]
news = "平户松浦家的管事是土佐姬君的熟人，转头就把月港来的卖主告诉了她，她当面把价砍了一半，说这是教人做买卖。"

[[tracks.chapters.choices]]
key = "via_yashichi"
text = "按行价卖给弥七，各做各的"
next = "b04_before_galleons"
effects = [{ kind = "cash", value = 1500 }, { kind = "affinity", person = "yashichi", value = 5 }]
reply = "弥七不记账，货价他念一遍我念一遍就算数，丝一担一担过了秤，没有一张纸。他说老船主在的时候，月港的丝都是这样卖的，说完低头去数货，不看我，也不再提船名。"
news = "平户码头上，弥七收了月港来的二十担丝，不立账，只让卖主把价钱念了两遍。"

# b04 大帆船来之前：黎牙实比立城。变体读 h38_manila_luzon_holds_manila。
[[tracks.chapters]]
key = "b04_before_galleons"
title = "大帆船来之前"
text = "雨季的马尼拉，新砍的木栅还往下淌树汁，营房上挂着西班牙国王的旗。黎牙实比老了，开口先问存粮：“船上几个人，存粮还够吃几天？先说这个。”他要唐人的丝和瓷，好装上回墨西哥的船。黄寿官从汤都搬了过来，逢人就说他今年的船期准；林蕙在城外支了张大桌，左边汉字账，右边西班牙账：“看货随便看，摸了就得买。”河滩上唐人的货棚才搭了三间。黎牙实比当着众人拍了桌子：谁画一张去月港的针路，他出的银子比一船丝还多。"
window = [[1571, 6, 24], [1571, 10, 31]]
at = "manila"
stage = "involve"
speaker = "captain"
mood = "cheerful"
cast = ["miguel_lopez_legazpi", "huang_shouguan", "lin_hui"]
news = "马尼拉立了西班牙人的城，城外的唐人搭起了货棚，有条月港的鸟船头一个来卖丝。"

[tracks.chapters.default]
next = "b05_same_name"
effects = []
news = "西班牙人在吕宋立了城，城外的唐人搭起了货棚；第二年开春，头一批唐船才到。"

[[tracks.chapters.variants]]
key = "sulayman"
when = [{ kind = "flag", flag = "h38_manila_luzon_holds_manila" }]
text = "雨季的马尼拉，拉惹苏莱曼守住了河口，西班牙人只在河口外搭营，木栅还往下淌树汁。黎牙实比照样要唐人的丝和瓷，只是得先给拉惹交一笔泊船钱。黄寿官从汤都搬了过来，逢人就说他今年的船期准；林蕙在城外支了张大桌，左边汉字账，右边西班牙账：“看货随便看，摸了就得买。”河滩上唐人的货棚才搭了三间。黎牙实比当着众人拍了桌子：谁画一张去月港的针路，他出的银子比一船丝还多。"

[[tracks.chapters.choices]]
key = "silk_silver"
text = "拿生丝换西班牙人的银子，林蕙两本账一起记"
check = { attr = "commerce", base = 20, per = 7 }
next = "b05_same_name"
effects = [{ kind = "cash", value = 1500 }, { kind = "affinity", person = "lin_hui", value = 3 }]
reply = "银锭是新铸的，敲一下声音发脆。林蕙两本账对完，抬头冲我一笑：“两边一个钱都不差——难得。”我拿起一锭对着太阳照，说：“客官，这么脆的银子，是不是还没睡醒？”她没接话，只把算盘往我这边推了推。"
news = "马尼拉城外，林蕙当着月港来的女船主的面，两本账对了一遍，一个钱都不差，西班牙人的新银锭敲起来声音发脆。"

[tracks.chapters.choices.fail]
next = "b05_same_name"
effects = [{ kind = "cash", value = 700 }]
news = "马尼拉城外，西班牙人的秤比月港那位女船主的重半两，林蕙在两本账上各画了一个圈，说这个亏下回找补。"

[[tracks.chapters.choices]]
key = "build_sheds"
text = "替唐人在城外再搭一排货棚，先把地方占住"
next = "b05_same_name"
effects = [{ kind = "reputation", faction = "new_spain", value = 3 }, { kind = "affinity", person = "huang_shouguan", value = 5 }]
reply = "我的船工和黄寿官的伙计一起扛竹子，十天搭了七间。黄寿官把最靠河的那间留给我，说船期一准，第一个开张。竹子是新砍的，一股青气，棚顶的茅还没铺，下雨就漏。他摸着漏水的地方笑：“头家，先漏着，漏不死人。”"
news = "马尼拉河滩上的唐人货棚，十天里添了七间，竹子是月港林家的船工和黄寿官的伙计一起扛的。"

[[tracks.chapters.choices]]
key = "draw_route"
text = "替黎牙实比画一张去月港的针路"
next = "b05_same_name"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_drew_route" }, { kind = "cash", value = 800 }, { kind = "reputation", faction = "new_spain", value = 5 }, { kind = "reputation", faction = "ming", value = -3 }]
reply = "我照火长的口诀一更一更写下去，写到“入九龙江”停了笔，没把卡子在哪儿写上。黎牙实比数银子给我，数得很慢，数完问：“后头没有了？”我说：“后头得另付钱，客官。”他笑了，没有再问。"
news = "马尼拉的西班牙总督拿到一张去月港的针路，画图的是月港林家的女儿，据说最后一段她停了笔。"

# b05 同姓的人：林凤攻马尼拉。凯奇利是 NPC，不写他的秘密与父亲。林凤不洗白。
[[tracks.chapters]]
key = "b05_same_name"
title = "同姓的人"
text = "十一月底，林凤的六十多条船压进马尼拉湾，头一仗就杀了西班牙人的营官。那天我正在自己船上跟特尔纳特来的凯奇利谈一船丁香，他笑着听我开价，笑着往下压。城外唐人的头家划着小船过来，递上一张名单：城外住着的福建人家，男女老小，要连夜接走——西班牙人怕唐人里应外合，唐人怕林凤，也怕西班牙人。我念到第三行，念出了两个月港的姓，当年跟我家跑过船的。凯奇利把丁香的价钱按下不提：“这张名单，倒不用压价。”林凤的小船跟着到了，船头的人冲我喊：“同姓的，过来说话！船主说了，你的消息最好是真的。上个月卖他假消息的，在桅杆上晒了三天。”"
window = [[1574, 11, 25], [1574, 12, 20]]
at = "manila"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["lin_feng", "kaicili"]
news = "林凤打进马尼拉湾那几天，特尔纳特王子的科拉科拉和月港林家的鸟船一前一后泊在城外，两条船都没开炮。"

[tracks.chapters.default]
next = "b06_wang_wanggao"
effects = []
news = "林凤两回攻马尼拉都没打下来，船队退去了林加延；城外的唐人货棚烧了一半。"

[[tracks.chapters.choices]]
key = "defend"
text = "把鸟船横在河口，替马尼拉守一夜"
next = "b06_wang_wanggao"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_defended" }, { kind = "reputation", faction = "new_spain", value = 5 }]
reply = "林凤的小船在黑地里试了两回，都在我的船头掉了头。天亮时西班牙人的营官来道谢，眼睛却一直盯着我船上那些唐人的脸，像在数哪几个是昨夜靠岸的，哪几个是原来就在的。我替他守了一夜，他倒先疑起我的人来。"
news = "林凤攻马尼拉的那一夜，河口横着一条月港的鸟船，林凤的小船试了两回，都在它船头掉了头。"

[[tracks.chapters.choices]]
key = "talk"
text = "以同姓的名义上林凤的船去谈"
check = { attr = "eloquence", base = 5, per = 8 }
next = "b06_wang_wanggao"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_limahong_talk" }, { kind = "fame", value = 3 }]
reply = "他的船舱里点着驱潮的艾草，烟呛得我直流眼泪。我说同姓五百年前是一家，他笑得不见眼睛：“五百年前的事，我只认今天的米。”笑完他答应第二天不烧城外的货棚，第二天果然没烧，只是城还是攻了。"
news = "听说林凤攻马尼拉前，有个月港的女船主上过他的船，他应了一件事，第二天城外的唐人货棚果然没烧。"

