# ───────────── 第一幕「启航」1557—1566 ─────────────

# a00 门槛见闻：只有选了林家的人才会在这里开轨道；窗口一过，没人回应也照走。
[[tracks.chapters]]
key = "a00_gate"
title = "林家最后一条船"
text = "腊月头几天，九龙江口的茶棚里，补网的人又说起林家。去年他家被烧了一条福船，剩下那条鸟船前两夜还是出了江口，船头挂着一盏小红纸灯笼，夜里看得见，白天看不见。有人说林老大是送女儿去倭国，有人说是去南洋避风头。茶客里有个年轻的问：“灯挂得那么低，是怕卡子上的兵看见，还是怕自己看不见路？”补网的老人头也不抬：“港一天不开，那条船就一天别想明着回来。”"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "yuegang"
stage = "rumor"
mood = "tense"
cast = ["lin_wandeng"]
when = [{ kind = "flag", flag = "c12_voyage_lin_wandeng" }]
news = "九龙江口的渔户说，林家剩下的那条鸟船腊月里出了港，船头一盏红灯笼压得很低。"

[tracks.chapters.default]
next = "a01_compass_box"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng" }]

# 2026-11-11 剧情增写：读养成期人物线 D 的 rw_lin_wandeng_window_lamp（阿母宫后窗上的灯）。
[[tracks.chapters.variants]]
key = "a0_rw_window"
when = [{ kind = "flag", flag = "rw_lin_wandeng_window_lamp" }]
text = "腊月头几天，九龙江口的茶棚里，补网的人又说起林家。去年他家被烧了一条福船，剩下那条鸟船前两夜还是出了江口，船头挂着一盏小红纸灯笼，夜里看得见，白天看不见。那两夜，天妃宫后墙那扇朝江口的小窗也一直亮着一盏灯，三更才灭。茶客里有个年轻的问：“灯挂得那么低，是怕卡子上的兵看见，还是怕自己看不见路？”补网的老人头也不抬：“港一天不开，那条船就一天别想明着回来。”"

# a01 罗盘匣底的字：父亲的字条与假文引。三个选项各留一样东西，后文各有人读。
[[tracks.chapters]]
key = "a01_compass_box"
title = "罗盘匣底的字"
text = "出海头一夜，鸟船泊在江口外一座小岛的背风处，北风刮得人牙根发冷。我掀开水罗盘的木匣换水，针碗底下压着一张折成四折的纸，展开是两张：一张是父亲的字，三两行，墨还没透；一张盖着海沧安边馆的朱印，印是真印的样子，可那位通判前年就调走了，纸是假的，上头写的船名是去年烧掉的那条福船，父亲连船名都来不及改。字条只说：船到平户，见五峰船主，替林家问一句“这禁几时开”；问完就走；月港一天不开，船一天别回来。老舵工蹲在舱口抽旱烟：“钱四脚，人两脚——拿假纸跑，跑不过官府的。”我把纸往他眼前一抖，笑了：“纸是假的，船是真的，人也是真的。客官，你先替我看看风。”针碗里的水晃了一下，针头朝北，我的船朝南。"
speaker = "captain"
mood = "tense"
night = true
cast = ["lin_wandeng"]
when = [{ kind = "date", from = [1557, 1, 7] }]

[[tracks.chapters.choices]]
key = "keep_pass"
text = "把假文引压回罗盘匣底，往后过卡子用"
next = "a02_hirado"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_forged_pass" }]
reply = "老舵工叹了口气，把匣盖扣紧，像扣上一口小棺材。我拿指甲在船名上刮了刮，刮不掉，就笑着说：“烧掉的船也能再跑一回，客官，你信不信？”他没接话，只把烟锅在船帮上磕了三下。"

[[tracks.chapters.choices]]
key = "burn_pass"
text = "就着舱里的灯把假文引烧了，林家的船不靠假纸"
next = "a02_hirado"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_burned_pass" }, { kind = "reputation", faction = "ming", value = 1 }]
reply = "我把假文引的一角凑到灯上。船名一个字一个字卷起来，黑了，掉进海里。老舵工松了口气，随即又皱起眉：往后的卡子怎么过？我拍拍手上的灰：“到时候再撒别的谎——这回先不撒。”他瞪我，瞪着瞪着自己先笑了。"

[[tracks.chapters.choices]]
key = "learn_word"
text = "把父亲要问五峰船主的那句话背熟，字条烧掉"
next = "a02_hirado"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_fathers_word" }]
reply = "我把那句话念了三遍，第三遍才听出是父亲的口气：他问的是五峰船主，口气却像在问他自己。字条凑到灯上，烧得很快；假文引照旧压在针碗底下，没人再提它。"

