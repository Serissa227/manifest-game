# c01 渡海的炮：登州的炮手投了北边。传闻口吻。变体优先级：quelled > gunners > gunners_pidao > iced > pidao_fed > sold_north > sun_alive。
[[tracks.chapters]]
key = "c01_guns_across"
title = "渡海的炮"
text = "登州的船户在码头上说：前年冬天孔有德的兵在吴桥没饭吃，闹了起来，回头占了登州，围了一年多。今年春天，孔有德、耿仲明带着一百多条船、城里的西洋大铳和铳师，渡海投了北边。城头上死了十几个澳门来的铳师，孙巡抚被押进了京城，船户们说，怕是回不来了。有个船户指着空了的炮台：“炮是朝廷花银子买的，铳师是朝廷花银子请的——全送给对面了。那几门炮，往后要从对面打过来了。”"
window = [[1578, 4, 15], [1578, 7, 15]]
at = "dengzhou"
stage = "rumor"
mood = "sad"
cast = ["kong_youde", "geng_zhongming", "sun_yuanhua"]
news = "登州的船户说，这一年水城里的炮响了好几个月，澳门来的铳师死了一大半。"

[tracks.chapters.default]
