[[tracks.chapters.choices]]
key = "reason"
text = "回信告诉他：将军是怕倭船夜里摸进来"
next = "done"
effects = []
reply = "我写：那些年倭船常在夜里摸进江口烧村子，将军怕的是这个，所以叫墩上见灯就举火。如今江口外没有倭船了，只有月港的船。二哥的回信隔了两个月：他把火把熄了，挂在墩上那块令牌底下。“令我还守着，”他写，“火不点了。将军要是在，也不点。”"

[[tracks.chapters.choices]]
key = "release"
text = "回信说：下令的人不在了，令就撤了"
next = "done"
effects = []
reply = "我写：下令的人不在了，令就该跟着他走，你替他撤了吧，墩上就你一个，你是最大的官。代笔的人回信说，二哥听完笑了，笑得直咳嗽，说他这辈子头一回当最大的官。他下了墩，搬回天妃宫后头的老屋住，夜里还是醒，醒了就坐在门槛上往江口看，看见帆就数，数完了，睡。"

[[tracks.chapters.choices]]
key = "oil"
text = "托人给墩上送一罐灯油，什么也不写"
next = "done"
effects = []
reply = "我托船家送去一罐天妃宫的灯油，封口的蜡上按了我的指印。二哥收到，没回信。后来阿母说，他把油倒进墩上那盏旧灯，每夜点着，挂在墩台朝江口的那一角，不举火，就点灯。江口夜里出去的船远远看见那一点亮，都知道今夜墩上的人醒着，醒着，没点火。"

[[tracks.chapters.variants]]
key = "a1_taken"
when = [{ kind = "flag", flag = "rw_lin_wandeng_order_taken" }]
