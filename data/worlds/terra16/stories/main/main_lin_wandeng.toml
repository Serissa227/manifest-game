news = "福州到中左所的海上，有条月港鸟船载着吕宋来的番僧和满舱的箱子，一路上船主都在纠正他念错的书名。"

# b08 登州的铳尺：孙元化、张焘、孔有德。西洋大铳东亚买不到，炮与铳师只写成故事里的事（cash 垫款），不做 goods 目标。
[[tracks.chapters]]
key = "b08_gunner_rule"
title = "登州的铳尺"
text = "冬天的登州水城，海面结着薄冰，码头上堆着从澳门运来的两门西洋大铳。巡抚孙元化是奉教的读书人，蹲在炮边，看澳门来的葡萄牙铳师拿一把铜尺量炮口，量一门摇一回头。“你见过澳门的铳师怎样量炮口吗？”我说只见过量米的斗，他也不笑，把铜尺递过来：“差一分，炮弹就落到自己人头上。”他说的是炮，我听着像在说人。张焘在边上骂，说铳师比炮还难伺候；孔有德披着羊皮袄喝酒，逢人就问饷什么时候到，他的兵是从皮岛撤过来的辽人，三个月没见银子。孙元化要两样东西：再从澳门请两个铳师北上；再找一条快船，赶在下一回封冻以前把冬粮送上皮岛。码头另一头，一个北边口音的商人凑过来，压低声音：替他跑一船硫磺过海，价钱翻倍。"
at = "dengzhou"
speaker = "captain"
mood = "tense"
cast = ["sun_yuanhua", "zhang_tao", "kong_youde"]
when = [{ kind = "date", from = [1575, 10, 1] }]
deadline = [1576, 4, 30]

[tracks.chapters.timeout]
next = "c01_guns_across"
effects = []
news = "登州水城招海船跑皮岛的冬粮，招了一个冬天；月港林家的船没来。"

[[tracks.chapters.variants]]
key = "folangji"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng_folangji" }]
text = "冬天的登州水城，海面结着薄冰，码头上堆着从澳门运来的两门西洋大铳。巡抚孙元化是奉教的读书人，蹲在炮边，看澳门来的葡萄牙铳师拿一把铜尺量炮口，量一门摇一回头。“你见过澳门的铳师怎样量炮口吗？”我说只见过量米的斗，他也不笑，把铜尺递过来：“差一分，炮弹就落到自己人头上。”他说的是炮，我听着像在说人。他又看了看我船头那门旧佛郎机，笑着说它比他的门生年纪还大。张焘在边上骂，说铳师比炮还难伺候；孔有德披着羊皮袄喝酒，逢人就问饷什么时候到，他的兵是从皮岛撤过来的辽人，三个月没见银子。孙元化要两样东西：再从澳门请两个铳师北上；再找一条快船，赶在下一回封冻以前把冬粮送上皮岛。码头另一头，一个北边口音的商人凑过来，压低声音：替他跑一船硫磺过海，价钱翻倍。"

[[tracks.chapters.choices]]
key = "gunners_and_grain"
text = "替孙元化从澳门请两个铳师北上，再接下皮岛的冬粮"
requires = [{ kind = "cash", ge = 2000 }]
hint = "请铳师要先垫一大笔安家银，你拿不出来。"
next = "b09_before_ice"
effects = [{ kind = "cash", value = -2000 }, { kind = "flag", flag = "c13_main_lin_wandeng_gunners" }, { kind = "reputation", faction = "ming", value = 3 }]
reply = "孙元化写了聘书，拉丁字和汉字各一份。两个铳师坐我的船从澳门北上，一路晕船，一路量我船头那门旧炮，量完还要摇头。年长的那个把铜尺压在枕头底下睡，说梦话也是在报数。"
news = "登州水城的孙巡抚托月港的鸟船去澳门请了两个铳师，聘书是拉丁字和汉字各写一份。"

[[tracks.chapters.choices]]
key = "grain_only"
text = "铳师的事不沾，只接下皮岛的冬粮"
next = "b09_before_ice"
effects = [{ kind = "reputation", faction = "ming", value = 1 }]
reply = "张焘点了点头，说总算来了个只管运粮的。孔有德拍我的肩：粮到了，岛上的弟兄记你一辈子。他拍得太重，我往前栽了一步，满嘴是他的酒气。孙元化没说话，把铜尺收进了袖子。"
news = "登州水城里，月港来的女船主只肯接皮岛的冬粮，不沾铳师的事，张焘说总算来了个只管运粮的。"

[[tracks.chapters.choices]]
key = "sulfur_north"
text = "替北边来的商人跑一船硫磺过海"
next = "c01_guns_across"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_sold_north" }, { kind = "cash", value = 2500 }, { kind = "reputation", faction = "later_jin", value = 5 }, { kind = "reputation", faction = "ming", value = -5 }]
reply = "硫磺在辽河口卸的，对岸来接货的人穿着羊皮袄，跟孔有德的兵穿得一模一样。银子是好银子，我数了两遍，手有点冷。那商人临走拱了拱手：“林船主，下回还找你。”我没应声，把银子拎进舱，关上了舱门。"
news = "登州码头上，有个北边口音的商人包下一条月港的船，硫磺装得满满当当，夜里往辽河口去了。"

# b09 封冻之前：皮岛冬粮，限期交货三十担。冰合上之前走。
[[tracks.chapters]]
key = "b09_before_ice"
title = "封冻之前"
text = "初冬，皮岛的码头边已经结了一圈白冰，船底刮着冰碴。岛上挤满了从辽东逃过来的辽民，排着队等粮，手里拿着破碗和人参。管粮的副将拿着一杆秤，秤砣比别人家的大一圈。他小声跟我说，一半粮按户发，一半粮夜里装船，对岸和朝鲜那边，价钱是这里的五倍：“毛帅在的时候也是这么发的。你别看我的秤，看海。”我笑着应他：“大人放心，我只数袋子。”一个辽民挤过来：“姑娘，人参换不换米？一根换一碗。”我船上两个懂炮的缩在舱口，朝岛上那几门破炮望了又望。我卸到第二十担，港口的冰已经合拢了一半。冰比人走得快，我得比冰还快。"
at = "pidao"
speaker = "captain"
mood = "tense"
cast = ["mao_wenlong"]
objectives = [{ kind = "goods", good = "grain", qty = 30, at = "pidao", text = "三十担粮赶在封冻前运上皮岛" }]
deadline = [1576, 11, 30]

[tracks.chapters.timeout]
next = "c01_guns_across"
effects = [{ kind = "flag", flag = "c13_main_lin_wandeng_iced" }]
news = "今年皮岛的冬粮晚了一步，辽东湾先封了冻；岛上的辽民一个冬天吃的是海菜。"

