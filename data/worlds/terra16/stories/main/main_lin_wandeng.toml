[[tracks.chapters]]
key = "o5_torch"
title = "火把"
text = "入夏，阿母的信里夹着二哥托人代写的一页，代笔的人写得很直，二哥的话很弯。他说大哥出殡以后，江口那几户人家夜里又要出海，船上没引，往东走。“大哥临走那句话，我也听说了：让他们夜里别点灯出港。他们听了，一盏也没点。可我坐在墩上，看得见黑里的帆。帆比灯好认。”他举着火把坐到天亮，没点，也没放下。“天亮以后，我想了一早上将军为什么下这道令，想不起来。那一年我站在最后一排，只听见令，没听见为什么。灯仔，你读过书，你替我想想。”"
