reply = "账寄回去的那天，我在旧账的最后一页写了一行：汉萨，记到此处。然后盖上随身的铜印。"
news = "里斯本外的塔霍河口，吕贝克来的那位船长把被扣的船一条条记清，账寄回了吕贝克议会。"
check = { attr = "numeracy", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "reputation", faction = "hanse", value = 1 }], news = "里斯本的船主们说，吕贝克来的那位小船长记了一个月的账，有三条船的名字始终对不上。" }

[[tracks.chapters.choices]]
key = "plead"
text = "上英格兰人的船，替那个老船主求情"
next = "done"
effects = [{ kind = "reputation", faction = "hanse", value = 2 }, { kind = "reputation", faction = "england", value = 1 }]
reply = "军官最后放了老船主的那一条。船上装的是鳕鱼，不是粮。老船主下船时，没回头看河口。"
news = "塔霍河口的英格兰军官放了一条吕贝克的船，船上装的是鳕鱼，听说是吕贝克来的某家的孩子替船主说了好话。"
check = { attr = "eloquence", base = 5, per = 8 }
fail = { next = "done", news = "里斯本河口上，吕贝克来的船长替老船主说话，英格兰的军官客气地听完，说船要带回普利茅斯，女王会判。" }

[[tracks.chapters.choices]]
key = "buy"
text = "用自己的钱买回一船粮，还给船主"
next = "done"
effects = [{ kind = "cash", value = -3000 }, { kind = "reputation", faction = "hanse", value = 4 }]
reply = "老船主拿到粮，先在我的账本上按了个手印。手印是黑的，是码头上的煤灰。"
news = "塔霍河口一船被扣的粮，吕贝克来的某家的孩子用自己的钱买了回去，老船主在账本上按了手印。"
requires = [{ kind = "cash", ge = 3000 }]
hint = "你的钱买不回一船粮。"

[[tracks.chapters.variants]]
key = "v1_lease"
when = [{ kind = "flag", flag = "c13_free_lubeck_accounts_lease" }]
text = "夏天，里斯本外的塔霍河口停着一排船。英格兰的舰队开到城下，攻了几天没攻下，却在河口扣下了几十条汉萨的船，船上装的是给西班牙的粮和缆绳。其中一条的货舱里，装的正是我在安特卫普货栈的旧主顾的黑麦。德雷克的旗在远处的桅杆上飘，德雷克本人没有下船。吕贝克、汉堡、但泽的船主挤在码头上，手里举着自己船的契据，没人理他们。一个老船主挤到我跟前，把一张契据塞进我手里，手抖得厉害。“船是我爷爷的爷爷造的。账，你替我记。”他说自己不识字，账一直是别人替他记的。我说：“账不平，船不开。”他听不懂，只是点头，把这句话听了两遍，像是要记下来。码头上哭的人不少，我在数还剩几条船。我没说出口：那本旧账的最后一页，原来在这里。"

[[tracks.chapters.variants]]
key = "v2_seat"
when = [{ kind = "flag", flag = "c13_free_lubeck_accounts_seat" }]
text = "夏天，里斯本外的塔霍河口停着一排船。英格兰的舰队开到城下，攻了几天没攻下，却在河口扣下了几十条汉萨的船，船上装的是给西班牙的粮和缆绳。德雷克的旗在远处的桅杆上飘，德雷克本人没有下船。吕贝克、汉堡、但泽的船主挤在码头上，手里举着自己船的契据，没人理他们。一个老船主挤到我跟前，把一张契据塞进我手里，手抖得厉害。“船是我爷爷的爷爷造的。账，你替我记。”他说自己不识字，账一直是别人替他记的。我把契据摊平，记账的格式还是当年在安特卫普新馆学的。我说：“账不平，船不开。”他听不懂，只是点头，把这句话听了两遍，像是要记下来。码头上哭的人不少，我在数还剩几条船。我没说出口：那本旧账的最后一页，原来在这里。"
