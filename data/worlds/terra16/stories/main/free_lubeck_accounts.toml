next = "c01_tagus"
effects = [{ kind = "cash", value = 2500 }]
reply = "装满亚麻的船过湾口时，私掠船的帆就在地平线上，风正好转了，船一头扎进了东边的雾里。"
news = "纳尔瓦的湾口，一条吕贝克的船满载亚麻冲了出去，瑞典人的私掠船只在后面干瞪眼。"
check = { attr = "seamanship", base = 20, per = 7 }
