[[tracks.chapters.choices]]
key = "family"
text = "把俄国商人的妻儿送到吕贝克"
next = "c01_tagus"
effects = [{ kind = "reputation", faction = "moscovy", value = 2 }, { kind = "memory", memory = "mem-free_lubeck_accounts-b01", title = "纳尔瓦的木桥" }]
reply = "孩子们第一次看见吕贝克的七座尖塔，挤在船头一座一座地数，问哪一座是面包铺。"
news = "吕贝克的港口来了一条挤满孩子的船，船上的俄国人说，他们要找的是一家面包铺。"

[[tracks.chapters.variants]]
key = "v1_seat"
when = [{ kind = "flag", flag = "c13_free_lubeck_accounts_seat" }]
text = "芬兰湾尽头的纳尔瓦，河两岸一边是俄国人的城堡，一边是旧骑士团的城堡，中间一座木桥，桥上的人走得慢。码头上，俄国商人把亚麻、毛皮和蜡堆得比人还高，价钱比里加便宜一半。安特卫普新馆的账房托我带了一本纳尔瓦的价目，说新馆如今也空了一半的仓库。湾口有没有瑞典人的私掠船，谁也不说，只朝那边看。一个俄国商人挤到我的船边，身后跟着妻子和两个孩子，背着包袱。“亚麻你随便装。”他说，“我的孩子，只要一个角落。”他的手在抖，不是冷。他忽然又说：“我在吕贝克有个表亲，开面包铺的。船长，你小时候常去那家买面包，他认得你的口音。”我想：船装得下货，也装得下人，可不能两样都装满。"

# c01 塔霍河口的汉萨船：1589，里斯本外的塔霍河口。终章；期限 1589-12-31，超时直接收尾并寄一封信。
# 落点：记清损失 / 替老船主求情 / 自掏腰包买回一船粮。变体 v1_lease、v2_seat 各改一句正文，回复不变。
[[tracks.chapters]]
key = "c01_tagus"
title = "塔霍河口的汉萨船"
text = "夏天，里斯本外的塔霍河口停着一排船。英格兰的舰队开到城下，攻了几天没攻下，却在河口扣下了几十条汉萨的船，船上装的是给西班牙的粮和缆绳。德雷克的旗在远处的桅杆上飘，德雷克本人没有下船。吕贝克、汉堡、但泽的船主挤在码头上，手里举着自己船的契据，没人理他们。一个老船主挤到我跟前，把一张契据塞进我手里，手抖得厉害。“船是我爷爷的爷爷造的。账，你替我记。”他说自己不识字，账一直是别人替他记的。我说：“账不平，船不开。”他听不懂，只是点头，把这句话听了两遍，像是要记下来。码头上哭的人不少，我在数还剩几条船。我没说出口：那本旧账的最后一页，原来在这里。"
at = "lisbon"
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1589, 5, 1] }]
deadline = [1589, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "letter", person = "c8_katharineum_teacher", text = "里斯本的消息传回来了：几十条船被扣在塔霍河口，议会里没人说话。那本旧账的最后一页，我替你写了。——霍尔斯特" }]

