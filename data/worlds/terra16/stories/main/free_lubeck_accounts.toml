# C13a 自由船长 · 吕贝克的记账学徒 ·「汉萨的旧账」（stories/main/free_lubeck_accounts.toml）
# 标签：吕贝克的记账学徒·个人小线（自由船长的模板小线，custom_lubeck_accounts，家乡港 lubeck）。
# 五章：a00 门槛见闻（1557 年 1 月，吕贝克）→ a01 钢院的那一栏（1558—60，伦敦）→ a02 安特卫普的新馆（1564—66）
#       → b01 纳尔瓦的最后几个夏天（1579—81）→ c01 塔霍河口的汉萨船（1589，里斯本）。
# 依据（史实，只从人物嘴里、告示与物件上透出，正文不开历史课）：伦敦钢院的特权 1550 年代起一再被削减；
#       安特卫普的汉萨新馆 1564—68 修建；纳尔瓦 1581 年被瑞典攻下；1589 年英格兰的舰队在塔霍河口扣下汉萨的船。
# 原创：霍尔斯特先生与那本旧账、钢院的老会计、新馆的馆长、俄国商人与他在吕贝克的表亲、里斯本的老船主。
# 回避：C7 的北方七年战争（1563—70）、汉斯·布罗克×索尔维格、欣里克×格蕾塔；C13d 的汉斯·布罗克去但泽送抚恤、
#       格蕾塔的算术书与欣里克的粮船。汉斯·布罗克只在门槛章被转述一句。
# 读：c12_voyage_custom_lubeck_accounts（a00 门槛）。
# 设：c13_free_lubeck_accounts（a00 缺省）；c13_free_lubeck_accounts_seat（a02 选项“坐进新馆的账房”）、
#     c13_free_lubeck_accounts_lease（a02 选项“租下货栈”）。
# 变体读：_seat（b01 v1_seat；c01 v2_seat）、_lease（c01 v1_lease）。
# 窗口写法：普通章用 when 的 date from 加 deadline 表达（普通章写 window 必须同时有 default，故不写 window）；
#     有 window 的只有门槛章 a00（rumor）。
# 等待的包：A9（门槛章可再加 protagonist 条件，可选，不影响本文件）。HIST 占位：无。
# 回忆插画清单（mem-* 与 ≤60 字画面描述）：
#   mem-free_lubeck_accounts-a02「新馆的塔」：安特卫普新城区，一座四方仓库围着的高塔还搭着脚手架，船长站在下面仰头看。
#   mem-free_lubeck_accounts-b01「纳尔瓦的木桥」：纳尔瓦河上的木桥，一边是俄国的城堡，一边是旧骑士团的城堡，一家人背着包袱走向码头。
#   mem-free_lubeck_accounts-c01「塔霍河口的契据」：里斯本码头上，几十个北方船主围着一个记账的人，河口停着一排挂着英格兰旗的船。
# 人称：“我”不写性别、外貌、肤色、身高；别人称“船长”“某家的孩子”，不用第三人称代词指“我”。
# 家里的话“账不平，船不开”全线两次（a01、c01）。
# 寰宇先只做中文：本文件不写 locales/en 覆盖。

[[tracks]]
key = "free_lubeck_accounts"
name = "汉萨的旧账"
kind = "main"
start = "a00_gate"
auto = true
cast = ["c8_katharineum_teacher"]

# a00 门槛见闻：1557 年 1 月，吕贝克酒窖。c12 门槛；无选项。
[[tracks.chapters]]
key = "a00_gate"
title = "一本旧账"
text = "吕贝克的酒窖里，老船主们喝到第三杯就骂英格兰人。汉斯·布罗克说过，汉萨没老，是别人的船太多了。另一个老船主说：“英格兰人收的不是税，是我们的年纪。”角落里，卡塔琳学校的霍尔斯特先生没接话，只把一本发黄的旧账推到灯下，交给账房里某家的孩子：“汉萨老没老，看账就知道。最后十年，进项一页比一页薄。”那孩子今年要出海。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "lubeck"
cast = ["c8_katharineum_teacher"]
mood = "tender"
when = [{ kind = "flag", flag = "c12_voyage_custom_lubeck_accounts" }]
news = "吕贝克酒窖里的人说，卡塔琳学校的先生把一本记了三十年的旧账交给了学徒，说汉萨老没老，看账就知道。"

[tracks.chapters.default]
next = "a01_steelyard"
effects = [{ kind = "flag", flag = "c13_free_lubeck_accounts" }]

# a01 钢院的那一栏：1558—60，伦敦。普通章；期限 1560-10-31，超时去 a02 并寄一封信。
[[tracks.chapters]]
key = "a01_steelyard"
title = "钢院的那一栏"
text = "泰晤士河边，钢院的高墙里堆着波罗的海的蜡、麻和木板。英格兰的海关新定了税，书记拿着一卷文书进来，话还没说完，老会计已经接了过去，把这一季的账摊在我面前。“新税那一栏，写‘暂行’。”他的手指压在纸上，指甲缝里还有麻绳的灰，“老人们看见‘永久’两个字，会睡不着的。”墙外，英格兰的商人冒险家公司的人站在码头上，看汉萨的船像看一条老狗。我把笔搁下：“蜡四十桶，麻六捆，木板三十块。账不平，船不开。”老会计没笑，只问：“船不开，吕贝克的老人们就得在家里饿着。你写的是账，还是船？”我没说出口：账是给人看的，可数是给明年看的。"
at = "london"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1558, 3, 1] }]
deadline = [1560, 10, 31]

[tracks.chapters.timeout]
next = "a02_house"
effects = [{ kind = "letter", person = "c8_katharineum_teacher", text = "钢院的账托别的船带回来了，新税那一栏写的是‘暂行’，没人去改。暂行了几年，你算算。下一季的账，记得把你的名字签在边上。——霍尔斯特" }]

[[tracks.chapters.choices]]
key = "true"
text = "照实写下新税，一个字也不改"
next = "a02_house"
effects = [{ kind = "skill", skill = "double_entry", value = 20 }, { kind = "reputation", faction = "hanse", value = 1 }]
reply = "老会计把账从头看到尾，看到新税那一栏停住，在边上签了自己的名字。签得很重，纸背都透了墨。"
news = "伦敦钢院的账上，新税那一栏照实写着，老会计在边上签了名，英格兰的书记凑过来看了又看。"
check = { attr = "numeracy", base = 20, per = 7 }
fail = { next = "a02_house", effects = [{ kind = "skill", skill = "double_entry", value = 20 }], news = "伦敦钢院的账房里有人笑，吕贝克来的小船长把新税那一栏算错了一处，老会计替那孩子改了，还说这样英格兰人看不懂。" }

[[tracks.chapters.choices]]
key = "temporary"
text = "照老会计的意思写“暂行”"
next = "a02_house"
effects = [{ kind = "reputation", faction = "hanse", value = 2 }, { kind = "reputation", faction = "england", value = -1 }]
reply = "吕贝克的议会收到账，回信只有两个字：甚好。第二年税又涨了，回信还是那两个字。"
news = "吕贝克的议员们拿到伦敦钢院寄来的账，见新税写着‘暂行’，都说这下能睡个好觉了。"

[[tracks.chapters.choices]]
key = "customs"
text = "去英格兰的海关问清楚，新税到底管几年"
next = "a02_house"
effects = [{ kind = "reputation", faction = "england", value = 2 }]
reply = "书记翻出一卷新的章程，指给我看：通篇没有一个字提到期限。书记把章程合上，说：“女王的章程，不写期限。”"
news = "伦敦海关的书记翻出新章程，新税通篇没有期限，吕贝克来的船长抄了一份就走。"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "a02_house", news = "伦敦的海关书记被问到新税管几年，只说一句“女王的意思”，别的一个字也不肯讲。" }

# a02 安特卫普的新馆：1564—66，安特卫普。普通章；期限 1566-07-31，超时去 b01 无信。
[[tracks.chapters]]
key = "a02_house"
title = "安特卫普的新馆"
text = "安特卫普新城区，汉萨的新馆还在盖：四面是仓库，中间一座高塔，塔身的脚手架上挂着工人的毡帽。交易所的钟一响，满街的人都在算钱，汉萨的人走路却不慌。馆长站在木板上，指着还没砌好的塔身：“楼要盖得大，人家才信你还在。”他看了看我的手，又问我的船在哪里。我说：“斯海尔德河口，装的是蜡。”馆长说：“钢院的人说你记过账。这里的账房缺人手，缺一个数目记得牢的。”窗边搬来一张桌子，桌上摆着新馆的账本，第一页还空着。馆长在塔底又说了一句，声音很低：“这座楼盖得这么大，是因为汉萨已经小了。”"
at = "antwerp"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1564, 5, 1] }]
deadline = [1566, 7, 31]

[tracks.chapters.timeout]
next = "b01_narva"

[[tracks.chapters.choices]]
key = "seat"
text = "坐进新馆的账房，记一季的账"
next = "b01_narva"
effects = [{ kind = "flag", flag = "c13_free_lubeck_accounts_seat" }, { kind = "reputation", faction = "hanse", value = 3 }]
reply = "我记的第一笔是一船里加的麻。记完，馆长把账本拿起来从头看了一遍，说：“字比数好看。”不知道是夸，还是骂。"
news = "安特卫普的汉萨新馆，账房的桌子上坐了一个吕贝克来的年轻人，记账的字比谁都工整。"
requires = [{ kind = "skill", skill = "double_entry", ge = 60 }]
hint = "你的复式账还不熟，馆长翻了两页就合上了。"

[[tracks.chapters.choices]]
key = "lease"
text = "租下新馆一间货栈，自己做生意"
next = "b01_narva"
effects = [{ kind = "cash", value = -2000 }, { kind = "flag", flag = "c13_free_lubeck_accounts_lease" }]
reply = "货栈的钥匙很大，挂在腰上叮当响。第一季进的货是从但泽来的黑麦，我亲自数过每一袋。"
news = "安特卫普交易所旁边的汉萨新馆，有个吕贝克来的年轻船长租下一间货栈，第一季进的是但泽的黑麦。"
requires = [{ kind = "cash", ge = 2000 }]
hint = "你的钱租不起交易所旁边的货栈。"

[[tracks.chapters.choices]]
key = "decline"
text = "谢过馆长，还是回船上"
next = "b01_narva"
effects = [{ kind = "memory", memory = "mem-free_lubeck_accounts-a02", title = "新馆的塔" }]
reply = "离开时，我回头看见脚手架上的工人在塔顶挂起了汉萨的旗。旗子被风一吹，展开，又卷了回去。"
news = "安特卫普的新城区，汉萨的新馆塔顶挂起了旗，路过的人都仰头看，没人去算那座楼要花多少钱。"

# b01 纳尔瓦的最后几个夏天：1579—81，纳尔瓦。普通章；期限 1581-08-31，超时去 c01 并寄一封信。
# 变体 v1_seat：玩家在 a02 坐进了新馆的账房，纳尔瓦的价目由新馆托付。
[[tracks.chapters]]
key = "b01_narva"
title = "纳尔瓦的最后几个夏天"
text = "芬兰湾尽头的纳尔瓦，河两岸一边是俄国人的城堡，一边是旧骑士团的城堡，中间一座木桥，桥上的人走得慢。码头上，俄国商人把亚麻、毛皮和蜡堆得比人还高，价钱比里加便宜一半。湾口有没有瑞典人的私掠船，谁也不说，只朝那边看。一个俄国商人挤到我的船边，身后跟着妻子和两个孩子，背着包袱。“亚麻你随便装。”他说，“我的孩子，只要一个角落。”他的手在抖，不是冷。他忽然又说：“我在吕贝克有个表亲，开面包铺的。船长，你小时候常去那家买面包，他认得你的口音。”我想：船装得下货，也装得下人，可不能两样都装满。"
at = "narva"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1579, 5, 1] }]
deadline = [1581, 8, 31]

[tracks.chapters.timeout]
next = "c01_tagus"
effects = [{ kind = "letter", person = "c8_katharineum_teacher", text = "纳尔瓦被瑞典人拿下了，吕贝克的船再也去不了那里。旧账上纳尔瓦那一栏，我替你划掉了。——霍尔斯特" }]

