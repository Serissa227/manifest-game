# 主线补章·纳吉玛·星的路·柱外（暂存，故事 2.0，A5 / E37 契约，C13a 第九批）
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_najma_atlantis_over，主线“那以后”章 c06_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
#   at2 删去 when（1583-06-01 起）：at2 在外港、期限 1585-12-31，六月以前到港答完 at1 就离港的玩家要回港才见得到 at2，主线 c06_after 会跟着拖到 1585 年底；正文不写月份，删掉不影响文字。
#   at3 的 leave_astrolabe 另设 c13_main_najma_astrolabe_left（主线 c09_epilogue 的“铜星盘留在柱旁”变体读）。
# 标签：主线补章；主角纳吉玛（najma，1540-08-24 生，尤尔法领航人家）。本文件的“我”是纳吉玛（speaker = captain），1583—1585 年她四十三到四十五岁。
# 轨道：main_najma_atlantis（kind = main，auto = true，start = at1_pillar），三章：at1 柱上的星 → at2 熄了火的审判 → at3 那边还有海。
#       暂存：A8 的 E63（帷幕、atlantis_port 可达；majid_hidden_route 算不算钥匙由 A8 定）与 C11 第二轮合进来以前，整合方不登记本文件
#       （同 C7 暂存配角链的做法）。不登记时主线照样完整：c04 召请 → c05 黑暗之海 → c06 那以后 → 第三幕余下各章。
# 依据：
#   史实与古典——柏拉图《克里提亚斯篇》的律法柱与誓词、熄了火的夜里十王穿深蓝长袍审判、天亮后把判词刻在金板上。只按原文复原，不添景物；不写献牛与血的细节。
#   原创——伊斯梅妮（cast/story_atlantic.toml，1564 年生，最年轻的“克莱托”）；柱顶星表里“北”字的那一处差别；三个落点。
#   待核：无。
# 读的旗标：
#   c13_main_najma（门槛，main_najma a00 的 default 设）；c13_main_najma_crossed（main_najma c05 的穿过分支设）；
#   c13_main_najma_stance_open / _close / _hand（main_najma c04 召请时恰好一面设，at2 的三个立场选项门槛）；
#   c13_main_najma_pillar_matched（本文件 at1 设，at3 的变体读）。
# 设的旗标：c13_main_najma_pillar_matched（at1 的贴星盘与量星成功时）。不设 main_najma 会读的旗标；不设 done 与 end_*（终局归 main_najma c09）。
# C11 等待项：atlantis_council_met、atlantis_verdict_close / _open 只写在 at2 的变体里（整合时登记进 runtime_links.toml 的 pending_flags，owner C11）。
# A8 等待项：atlantis_port 可达（E63）。
# 物品：majid_astrolabe（伊本·马吉德的铜星盘，出海资本里发一件）；at1 的贴星盘要持有，at3 的换铜板会交出去。
# 回忆插画清单（mem-main_najma_atlantis-*）：
#   at1 柱上的星：铜色神庙里，女领航把一只铜星盘贴在刻满星名的山铜柱上，年轻的女祭司弯腰细看。
#   at2 熄了火的审判：熄了火的神庙里只有顶上一圈星光，女领航站在山铜柱前，黑暗里坐着一排看不清脸的人。
#   at3 没有回忆（三个落点留给主线 c09 的收尾）。

[[tracks]]
key = "main_najma_atlantis"
name = "星的路·柱外"
kind = "main"
start = "at1_pillar"
auto = true
cast = ["najma", "ismene"]

# at1 柱上的星：外港神庙，山铜柱，纳吉玛认出外曾祖父那几行诗押的就是柱顶的星。
# 要紧的一个数：柱上最北的那颗离刻线差了一指。本文件不用纳吉玛的口头禅，只换说法。
[[tracks.chapters]]
key = "at1_pillar"
title = "柱上的星"
text = "外港的石码头被太阳晒得发烫，三道环墙在远处闪着铜色。神庙正中立着一根山铜柱，柱顶一圈刻满星名和数，一行一行，像一页航路书。迎上来的是最年轻的那个女祭司，眉眼很硬，先问我来做什么。我说来量星。她说：“量星可以。派你来的是哪位王，一会儿再问。”我没答。腰间挂着牵星板，木头边被海风吹得发白。外曾祖父那几行押得别扭的诗，我在星路上算过不止一遍，押的就是柱顶这一圈。她却不许我碰柱子，只说：“把誓词读完，再碰那根柱子。”然后她念起了誓词，念到违誓的人怎么受罚，一个字不少。我低头去数柱顶的星。数到北边那一颗，它离刻线差了一指。我心里想：就差这一指，外曾祖父没有抄错。"
mood = "mystic"
speaker = "captain"
at = "atlantis_port"
cast = ["najma", "ismene"]
when = [{ kind = "flag", flag = "c13_main_najma" }, { kind = "flag", flag = "c13_main_najma_crossed" }]
deadline = [1583, 12, 31]

[[tracks.chapters.choices]]
key = "lay_astrolabe"
text = "把外曾祖父的铜星盘贴上柱子，一颗颗对"
requires = [{ kind = "item", item = "majid_astrolabe", qty = 1 }]
hint = "外曾祖父的铜星盘不在你手里，贴不上这根柱子。"
effects = [{ kind = "flag", flag = "c13_main_najma_pillar_matched" }, { kind = "affinity", person = "ismene", value = 6 }, { kind = "memory", memory = "mem-main_najma_atlantis-at1", title = "柱上的星" }]
next = "at2_council"
reply = "星盘的网环转到第九格，柱上北边那颗星离刻线一指，正好落进网环的缺口里。伊斯梅妮弯下腰看了很久，问这东西是谁做的。我说：“做它的人早死了。改它的人，有我一个。”她没接话，手指却沿着铜盘的边摸了一圈，停在边上磨得最亮的那一段。"
news = "外港神庙里，一个海上来的女领航把铜星盘贴上律法柱，那颗星正好压在一起。"

[[tracks.chapters.choices]]
key = "sight_kamal"
text = "用牵星板量柱顶的星，一颗颗报数"
check = { attr = "astronomy", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_najma_pillar_matched" }, { kind = "memory", memory = "mem-main_najma_atlantis-at1", title = "柱上的星" }]
next = "at2_council"
reply = "她站在神庙门口，对着柱顶一颗颗量过去，报数时一个字也不慢。伊斯梅妮把一块蜡板拿在手里，每报一颗就刻一道。报到最后一颗，她把蜡板翻过来给我看：律文上刻的是“北”，我报的是“北偏一指”。柱子是对着旧北极立的，我说，星挪了，柱没挪。"
news = "外港神庙前，一个女领航对着柱顶的星量了半个时辰，报的数被守柱的祭司刻在蜡板上。"

[tracks.chapters.choices.fail]
next = "at2_council"
effects = []
news = "外港神庙前，女领航对着柱顶报数，报错了一颗，守柱的祭司当场纠正，蜡板上划了一道。"

[[tracks.chapters.choices]]
key = "hear_oath"
text = "先听她把誓词读完，再碰柱子"
effects = [{ kind = "affinity", person = "ismene", value = 10 }]
next = "at2_council"
reply = "誓词很长，诅咒违誓的人的那一段尤其长。伊斯梅妮读完，自己把我的手按到了柱子上——比我预想的凉。她说：“这样才算你碰过。”我没有把手抽回来。柱子上的字在指腹底下一条条凸着，她读的时候，声音一直没有停。"
news = "外港神庙里，守柱的女祭司把誓词从头读到尾，读完把一个外来的女人的手按上山铜柱。"

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_najma_atlantis_over" }]

# at2 熄了火的审判：夜里的神庙，十王坐在黑暗里，外来的人一个一个被叫到柱前。
# 立场三项按召请那夜的旗标互斥（只有一面设着的那项的话能说），only_number 永远可见。
[[tracks.chapters]]
key = "at2_council"
title = "熄了火的审判"
text = "夜里，神庙里所有的火都熄了。十位王穿着深蓝的长袍坐在黑暗里，深蓝在黑里看不出颜色，审的是外面的世界。外来的人一个一个被叫到柱前说话，说完就退进门外的凉地里。轮到我的时候，我看不见任何人的脸，只看得见神庙顶上开着的那一圈天。星在那里，和白天柱顶刻的是同一批。伊斯梅妮站在柱边，没有点灯，我只听见她翻律文的声音。黑暗里有个声音说：“领航人，你说。外面的海，该不该让人找到这里。”我没有答该不该。我说：“从尤尔法到这里，一共十一个月，二十三颗星。”"
mood = "mystic"
speaker = "captain"
at = "atlantis_port"
night = true
cast = ["najma", "ismene"]
deadline = [1585, 12, 31]

[[tracks.chapters.choices]]
key = "say_open"
text = "说：外面的海已经连成一片，雾挡不住了"
requires = [{ kind = "flag", flag = "c13_main_najma_stance_open" }]
hint = "那一夜你没有说让雾散开，这句话没有底气。"
effects = [{ kind = "reputation", faction = "free_port", value = 3 }, { kind = "memory", memory = "mem-main_najma_atlantis-at2", title = "熄了火的审判" }]
next = "at3_far_sea"
reply = "我把那些数一条条报完，最后加了一句：今年来的船，明年还会来，后年会更多。黑暗里很久没有声音，然后有人用指节敲了一下桌面，一下，又一下。那边的椅子响了一下，像是有人站起来，又坐了回去。"
news = "外港神庙的夜会上，海上来的女领航说，今年来的船明年还会来，后年会更多。"

[[tracks.chapters.choices]]
key = "say_close"
text = "说：雾里的海，留给雾里的人"
requires = [{ kind = "flag", flag = "c13_main_najma_stance_close" }]
hint = "那一夜你没有说要合上，这句话你替不了它。"
effects = [{ kind = "affinity", person = "ismene", value = 6 }, { kind = "memory", memory = "mem-main_najma_atlantis-at2", title = "熄了火的审判" }]
next = "at3_far_sea"
reply = "我说外曾祖父把路藏进押不上的韵里，就是不想让所有人都看见。那几行我留在自己这里，不写进任何人的航路书。伊斯梅妮在黑暗里轻轻吸了一口气，没有说话。后来她问我为什么。我说：雾里的路，走一趟就够了。"
news = "外港神庙的夜会上，海上来的女领航说，雾里的海留给雾里的人，她不往外抄。"

[[tracks.chapters.choices]]
key = "say_hand"
text = "说：路交给守得住的人，不交给抢得快的人"
requires = [{ kind = "flag", flag = "c13_main_najma_stance_hand" }]
hint = "那一夜你没有说路要交给守得住的人，这句说不出口。"
effects = [{ kind = "reputation", faction = "free_port", value = 1 }, { kind = "memory", memory = "mem-main_najma_atlantis-at2", title = "熄了火的审判" }]
next = "at3_far_sea"
reply = "我说我带来的是一卷抄本，抄到最后一页，空着一行没写给谁。黑暗里有人问我，现在想写给谁。我说：等天亮，看门开在哪一边。门外的凉地里起了风，吹进来，供台上的香灰飞起来一层。"
news = "外港神庙里有人传，海上来的女领航带了一卷抄本，最后一页空着，说等天亮再写给谁。"

[[tracks.chapters.choices]]
key = "only_number"
text = "只报那个数，别的不说"
effects = [{ kind = "memory", memory = "mem-main_najma_atlantis-at2", title = "熄了火的审判" }]
next = "at3_far_sea"
reply = "我报完数就退了下去，站到门外的凉地里。后来伊斯梅妮告诉我，那一夜所有人里，只有我说的话被原样刻进了金板。她说这话的时候没有看我，只看着柱子。金板上的字，我后来一个也没去看。"
news = "外港神庙的夜会上，海上来的女领航只报了一个数，就退到门外的凉地里去了，没有再开口。"

[tracks.chapters.timeout]
next = "at3_far_sea"
effects = []

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "夜里，神庙里所有的火都熄了。十位王穿着深蓝的长袍坐在黑暗里，深蓝在黑里看不出颜色，审的是外面的世界。外来的人一个一个被叫到柱前说话，说完就退进门外的凉地里。轮到我的时候，我看不见任何人的脸，只看得见神庙顶上开着的那一圈天。星在那里，和白天柱顶刻的是同一批。伊斯梅妮站在柱边，没有点灯，我只听见她翻律文的声音。黑暗里有个声音说：“领航人，你说。外面的海，该不该让人找到这里。”我没有答该不该。我说：“从尤尔法到这里，一共十一个月，二十三颗星。”天亮以后，金板上刻下的是一个“合”字。"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "夜里，神庙里所有的火都熄了。十位王穿着深蓝的长袍坐在黑暗里，深蓝在黑里看不出颜色，审的是外面的世界。外来的人一个一个被叫到柱前说话，说完就退进门外的凉地里。轮到我的时候，我看不见任何人的脸，只看得见神庙顶上开着的那一圈天。星在那里，和白天柱顶刻的是同一批。伊斯梅妮站在柱边，没有点灯，我只听见她翻律文的声音。黑暗里有个声音说：“领航人，你说。外面的海，该不该让人找到这里。”我没有答该不该。我说：“从尤尔法到这里，一共十一个月，二十三颗星。”天亮以后，金板上刻下的是一个“开”字。"

[[tracks.chapters.variants]]
key = "v3_council_met"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "会议已经开了三夜，我是最后几个被叫到的人之一。夜里，神庙里所有的火都熄了。十位王穿着深蓝的长袍坐在黑暗里，深蓝在黑里看不出颜色，审的是外面的世界。外来的人一个一个被叫到柱前说话，说完就退进门外的凉地里。轮到我的时候，我看不见任何人的脸，只看得见神庙顶上开着的那一圈天。星在那里，和白天柱顶刻的是同一批。伊斯梅妮站在柱边，没有点灯，我只听见她翻律文的声音。黑暗里有个声音说：“领航人，你说。外面的海，该不该让人找到这里。”我没有答该不该。我说：“从尤尔法到这里，一共十一个月，二十三颗星。”"

# at3 那边还有海：离开外港的早上，无地点的个人终章；三个落点各只一条路。
[[tracks.chapters]]
key = "at3_far_sea"
title = "那边还有海"
text = "离开外港的早上，我站在船尾回头看。黑暗之海的外头，往西还有海。七座小岛之间的水一片比一片蓝，海鸟往更西边飞，没有一只回头。码头上，伊斯梅妮站得笔直，手里捏着一块小铜板，板上刻的是柱上那一圈星的名和数。她说：“外面来的东西，我都要翻过来看背面。”她把铜板递过来，又收回去，像是还没想好给谁。她问：“还回来吗？”我说：“不一定。”船从外港的水道里出去，两边的石墙把风挡住，帆一下子松下来，到了水道口又吃满了。柱顶那圈星在晨光里看不清了，只剩一片铜色。舵手把缆绳收好，甲板上只剩风和海鸟的叫声。我把牵星板收进袋里，在船尾站了很久，心里想：往西还有星，没有人量过。"
mood = "tender"
speaker = "captain"
cast = ["najma", "ismene"]

[[tracks.chapters.choices]]
key = "chart_west"
text = "留一季，把七岛以西的海量出来"
effects = [{ kind = "chart", region = "sargasso" }, { kind = "skill", skill = "cartography", value = 8 }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }]
next = "done"
reply = "我在七岛之间来回走了一季，量出来的星记满了一块蜡板。走的时候，我在最后一页押了一行新诗，这回韵押得很顺。伊斯梅妮在码头上接过蜡板，翻到背面看了很久。她问我那片海有没有人住。我说没有人量过，所以不知道。"

[[tracks.chapters.choices]]
key = "leave_astrolabe"
text = "把铜星盘留给伊斯梅妮，换她那块铜板"
requires = [{ kind = "item", item = "majid_astrolabe", qty = 1 }]
hint = "外曾祖父的铜星盘不在你手里，没有东西可换。"
effects = [{ kind = "item", item = "majid_astrolabe", qty = -1 }, { kind = "affinity", person = "ismene", value = 10 }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }, { kind = "flag", flag = "c13_main_najma_astrolabe_left" }]
next = "done"
reply = "伊斯梅妮把星盘翻过来看背面，看见了几代人的拇指印。她说会把它挂在柱子旁边，让来问的人先摸一摸。我把那块铜板贴身收好。铜板的一面刻着柱子朝北的那一行，刻线很深，像是怕人刮掉。铜板比星盘轻，我却觉得沉。"

[[tracks.chapters.choices]]
key = "go_home"
text = "回家：尤尔法的采珠季要开了"
effects = [{ kind = "fame", value = 3 }, { kind = "flag", flag = "c13_main_najma_atlantis_over" }]
next = "done"
reply = "我让舵手往东。回程比来时快，沿路的星都像是认得我。到尤尔法那天，码头上的老潜水人问我去了哪里。我说：“报个纬度给你，自己去量。”舵手问我，回去是先卖货还是先交图。我说先交图，图是给下一条船用的。"

[[tracks.chapters.variants]]
key = "pillar"
when = [{ kind = "flag", flag = "c13_main_najma_pillar_matched" }]
text = "离开外港的早上，我站在船尾回头看。黑暗之海的外头，往西还有海。七座小岛之间的水一片比一片蓝，海鸟往更西边飞，没有一只回头。码头上，伊斯梅妮站得笔直，手里捏着一块小铜板，板上刻的是柱上那一圈星的名和数。铜板上的星，和我那天在柱上对过的一颗不差。她说：“外面来的东西，我都要翻过来看背面。”她把铜板递过来，又收回去，像是还没想好给谁。她问：“还回来吗？”我说：“不一定。”船从外港的水道里出去，两边的石墙把风挡住，帆一下子松下来，到了水道口又吃满了。柱顶那圈星在晨光里看不清了，只剩一片铜色。舵手把缆绳收好，甲板上只剩风和海鸟的叫声。我把牵星板收进袋里，在船尾站了很久，心里想：往西还有星，没有人量过。"
