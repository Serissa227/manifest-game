# b06：巴石河口的红灯。交汇：林晚灯的红灯笼与凯奇利的科拉科拉在马尼拉湾同一夜。
[[tracks.chapters]]
key = "b06_limahong"
title = "巴石河口的红灯"
text = "马尼拉湾，北风季的夜。我的科拉科拉载着丁香，来卖给华人的帆船。月港林家那条鸟船开价最硬，我正坐在它的舱里往下压价，林凤的六七十条船就摸进了湾。城墙上的西班牙人点起火把，城外棚屋里的唐人两头不是人：西班牙人疑他们通林凤，林凤的人又当他们是叛徒。城外的头家划着小船靠上来，递进一张名单。林晚灯把船舷上的红灯笼举了起来，棚屋里的灯一盏接一盏灭了。回头对我说：“借你的船一夜，把城外唐人的老人孩子运过河去汤都。”远处林凤的人在喊：“谁挡我的船，谁就是官兵！”林晚灯朝黑地里回了一句：“我从不撒谎，今天还没有。”灯笼一收，河上就只剩我的桨声。"
stage = "involve"
window = [[1574, 11, 25], [1574, 12, 15]]
at = "manila"
