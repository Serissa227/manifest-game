# a01：堡门外的饭篮。两边都信得过他，他在堡门口看清这一点。
[[tracks.chapters]]
key = "a01_seized"
title = "堡门外的饭篮"
text = "特尔纳特的葡萄牙石堡临着海，墙脚泡在潮水里。父亲被堡主扣在里面已有些日子了。叔叔凯奇利·古吉拉提先一步出了堡，这几天在宫里、营地和堡门之间来回传话。首领们和海峡对岸蒂多雷的科拉科拉一起围住了堡。堡门口，卫兵每次都要掀开饭篮上的芭蕉叶，把米一粒一粒翻一遍。蒂多雷的水师统领走过来，托我把一卷纸塞进饭篮，带进去：放人之后，马基安岛的丁香要分给蒂多雷。叔叔把纸攥在手里：“谁亲眼看见他们落的印？没凭据的东西，进了堡门就是一条人命。”门缝里传来父亲的声音：“饭里没掺沙子吧？堡里的人连米都要数，你别学他们。”我对水师统领说：“你的开价，我当班顿的上半句听；下半句怎么对，看你等不等得起。”"
speaker = "captain"
mood = "tense"
cast = ["hairun", "kaicili_gujirati"]
at = "ternate_port"
stage = "involve"
window = [[1557, 1, 10], [1557, 4, 30]]
news = "特尔纳特的堡门外，苏丹的小儿子提着饭篮进进出出，蒂多雷的船也让他过。"

