when = [{ kind = "flag", flag = "c13_main_kaicili_drake_letter" }]
text = "里斯本的雨下个没完，河岸边一间租来的小屋，屋里晾着一件湿透的金丝头巾。使者凯奇利·奈克捧着国书，马来文一份，通事译的葡萄牙文一份，等了大半年，答复一拖再拖。国王在马德里。国书里把赶走葡萄牙人写成“让他们平安离岛”。使者把话压低了：“您写给英格兰女王的那封信，在这里一个字也不能提。”我说：“那封信，我也快忘了怎么写的。”他见到同乡，先问的是摩鹿加的消息。我手里的信说，苏丹去年七月走了。"

[[tracks.chapters.choices]]
key = "tell_first"
text = "先告诉他：派他来的苏丹已经不在了"
next = "c08_spanish"
effects = [{ kind = "affinity", person = "kaicili_naik", value = 8 }, { kind = "memory", memory = "mem-main_kaicili-c07", title = "雨里的国书" }]
reply = "使者坐了很久，把国书放在膝上，用袖子把上面的雨点擦干。“那我更要递上去，”他说，“先苏丹的事，总得有人记得。”"

[[tracks.chapters.choices]]
key = "deliver_first"
text = "先陪他把国书递出去，递完了再说"
next = "c08_spanish"
effects = [{ kind = "reputation", faction = "portugal", value = 5 }, { kind = "reputation", faction = "spain", value = 3 }]
reply = "我们在王室的衙门外等了三天，国书总算收了进去，盖了一个收讫的印。回屋的路上，我才说出那封信的事，使者在雨里站住了。"
check = { attr = "etiquette", base = 20, per = 7 }
fail = { next = "c08_spanish", effects = [{ kind = "affinity", person = "kaicili_naik", value = 3 }], news = "里斯本的衙门说国王在马德里，国书只能留下等。那个摩鹿加来的人，在雨里陪着使者走回河边。" }

[[tracks.chapters.choices]]
key = "take_home"
text = "劝他跟我回去：国书递到马德里，答复也要十年"
next = "c08_spanish"
effects = [{ kind = "flag", flag = "c13_main_kaicili_envoy_home" }, { kind = "affinity", person = "kaicili_naik", value = 5 }]
reply = "使者把国书锁进箱子，说要带回去交给新苏丹，由新苏丹决定还递不递。上船那天，他第一次笑了：“回家的船，比来的船好坐。”"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "c08_spanish", effects = [{ kind = "affinity", person = "kaicili_naik", value = 2 }], news = "里斯本的码头上，使者摇头说，他是奉命来的，没有奉命回去。那张回程的船期，被人写在纸上留了下来。" }

# c08：海峡里的一道桨。1585 年西班牙人再来，蒂多雷的舅舅家在最后一排。
[[tracks.chapters]]
key = "c08_spanish"
title = "海峡里的一道桨"
text = "哥哥的坟在父亲旁边，坟上的土已经长了草。侄子赛义德做了苏丹，年轻，还不太会在首领们面前说话。马尼拉的西班牙船又来了，这一回带着蒂多雷的科拉科拉。我站在旧堡的墙上，父亲进过的那座石堡，墙头这几年换过几面旗。哥哥的拐杖还靠在墙角，杖头雕着一条科拉科拉。侄子在墙下喊：“叔叔，父亲说你下棋从不先动手。”蒂多雷的船头有人隔着水喊：“外祖父的棋，你还记得吗？”我看着海峡里最后一排的船。桨下得很慢。那一排是在等我开价。"
stage = "involve"
window = [[1585, 3, 1], [1585, 6, 30]]
at = "ternate_port"
cast = ["kaicili"]
speaker = "captain"
mood = "tense"
news = "特尔纳特人说，西班牙船来的那几天，苏丹的叔叔拄着先苏丹的拐杖在旧堡墙上站了三天。"

[tracks.chapters.default]
next = "c09_nutmeg"
effects = []
news = "马尼拉的西班牙船又来攻特尔纳特，在海峡里转了几天，没靠上岸就回去了。"

[[tracks.chapters.variants]]
key = "a_home"
when = [{ kind = "flag", flag = "c13_main_kaicili_went_home" }]
text = "哥哥的坟上的土还没长草。我回来时，侄子把拐杖交到我手里，一句话也没说。马尼拉的西班牙船又来了，这一回带着蒂多雷的科拉科拉。我站在旧堡的墙上，父亲进过的那座石堡，墙头这几年换过几面旗。侄子在墙下喊：“叔叔，父亲说你下棋从不先动手。”蒂多雷的船头有人隔着水喊：“外祖父的棋，你还记得吗？”我看着海峡里最后一排的船。桨下得很慢。那一排是在等我开价。"

[[tracks.chapters.variants]]
key = "b_daeng"
