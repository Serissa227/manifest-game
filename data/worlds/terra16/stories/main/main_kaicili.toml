# b02：三百人没回来。黎牙实比的第一句话，算的是他手里那张名单。
[[tracks.chapters]]
key = "b02_cebu"
title = "三百人没回来"
text = "宿务的海滩，西班牙人在滩头筑的三角形木堡就在眼前。葡萄牙的大船在湾口封了三个月，科拉科拉泊在浅水里。营里先是缺水，后是发热，每天早上都有人抬着草席往林子里走。棕榈叶上记着桨手的名字，每天要划掉几个。黎牙实比派人打着白布过来，第一句话是：“船上还有几个人能划桨？这仗谁先数清楚，谁就赢。”哥哥在滩上回他：“葡萄牙人在船上喝酒，我们的人在滩上发烧。这一笔我记着。”我把叶子卷起来。名字划一个少一个，划不回来。"
stage = "involve"
window = [[1568, 10, 1], [1569, 1, 31]]
at = "cebu"
cast = ["babullah", "miguel_lopez_legazpi"]
speaker = "captain"
mood = "sad"
news = "宿务回来的人说，特尔纳特的王子在滩上背着发热的桨手上船，背了一整夜。"

[tracks.chapters.default]
next = "b03_gate"
effects = []
news = "宿务回来的科拉科拉少了好几条，特尔纳特人说，北边死了三百个桨手，葡萄牙人还是没打下西班牙人的木堡。"

[[tracks.chapters.choices]]
