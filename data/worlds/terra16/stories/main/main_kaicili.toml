[[tracks.chapters.choices]]
key = "sultan"
text = "接下王冠，由我坐镇，等侄子能背下七十二座岛的名字"
next = "c11_epilogue"
requires = [{ kind = "reputation", faction = "ternate", ge = 50 }]
hint = "首领们还没有把你当成能戴冠的人。"
effects = [{ kind = "flag", flag = "c13_main_kaicili_role_sultan" }, { kind = "reputation", faction = "ternate", value = 5 }]
reply = "首领们一个个起身行礼。侄子没有动，过了很久才把王冠捧过来，手在抖。我接过来，没戴，放在膝上，对侄子说：“等你能把七十二座岛的名字背下来，它就还给你。”"

[[tracks.chapters.choices]]
key = "jogugu"
text = "把王冠留给侄子，自己做宰相，兼管科拉科拉"
next = "c11_epilogue"
effects = [{ kind = "reputation", faction = "ternate", value = 3 }, { kind = "skill", skill = "negotiation", value = 4 }]
reply = "我把那卷贝叶推到侄子面前，自己坐到了下首第一个位子上，宰相的位子。首领们松了口气。侄子散会后追出来，叫了我一声叔叔，没说别的。"

[[tracks.chapters.choices]]
key = "merchant"
text = "冠不要，印也不要：只要每年丁香卖给谁，由我说"
next = "c11_epilogue"
requires = [{ kind = "cash", ge = 20000 }]
hint = "你的船和钱，还撑不起七十二座岛的丁香。"
effects = [{ kind = "flag", flag = "c13_main_kaicili_role_merchant" }, { kind = "reputation", faction = "ternate", value = 3 }]
reply = "大厅里有人笑出了声。我也笑，把一筐丁香倒在贝叶上：“冠会长头发，丁香不会。可丁香能换来冠要的一切。”首领们最后都点了头，他们本来就知道，丁香比冠重。"

# c11：丁香的王冠。终章。三个落点各设 done 与恰好一面 end。
[[tracks.chapters]]
key = "c11_epilogue"
title = "丁香的王冠"
text = "丁香的收获季，加马拉马的山坡上全是人。花苞由青转红，摊在席子上晒，香气一直飘到港里的船上。坟边的草刚被人割过，一把镰刀还放在石头上。我先去父亲和哥哥的坟边坐了一会儿，膝上是“海之灵”。回到旧堡，侄子在里面议事，我这个宰相坐在门外的台阶上，有人来问丁香的价，我朝门里努努嘴。老船长（转述）：“老苏丹说过，丁香是命根子，也是别人赖着不走的理由。”我说：“那就让它只做命根子。”班顿的下半句，我替哥哥留了许多年。今天我把它说了出来，声音不大。坐在旁边晒丁香的孩子抬起头，等我说完。"
speaker = "captain"
mood = "tender"
cast = ["kaicili"]
when = [{ kind = "date", from = [1588, 1, 1] }]

[[tracks.chapters.variants]]
key = "a_sultan"
when = [{ kind = "flag", flag = "c13_main_kaicili_role_sultan" }]
text = "丁香的收获季，加马拉马的山坡上全是人。我坐在父亲和哥哥的坟边，膝上是“海之灵”。王冠放在我身旁，我还是没戴。坟边的草刚被人割过，一把镰刀还放在石头上。侄子在旁边背七十二座岛的名字，背到第四十几座卡住了。我替他接了一句：“第四十三座，班达。”侄子回头看我：“叔叔，你数得比我快。”班顿的下半句，我替哥哥留了许多年。今天我把它说了出来，声音不大。坐在旁边晒丁香的孩子抬起头，等我说完。"

[[tracks.chapters.variants]]
key = "b_merchant"
when = [{ kind = "flag", flag = "c13_main_kaicili_role_merchant" }]
text = "丁香的收获季，加马拉马的山坡上全是晒丁香的席子。我没有冠，也没有印。港里每一条船的船主上岸，先来我的棚子里坐。一个船主进棚时笑着说：“你这棚子，比王宫还好找。”我回他：“丁香在这儿，不在宫里。”我在父亲和哥哥的坟边坐了一会儿，膝上是“海之灵”。班顿的下半句，我替哥哥留了许多年。今天我把它说了出来，声音不大。坐在旁边晒丁香的孩子抬起头，等我说完。"

[[tracks.chapters.choices]]
key = "island"
text = "丁香的价握在岛上人自己手里：谁来买，都先上岸坐下"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_kaicili_done" }, { kind = "flag", flag = "c13_main_kaicili_end_island" }, { kind = "title", title = "丁香的王冠" }, { kind = "memory", memory = "mem-main_kaicili-c11", title = "丁香的王冠" }]
reply = "我在码头上立了一块木牌：外来的船先上岸，先坐下，先听种树的人说。第一年有三条船掉头走了，第二年它们又回来了。"

[[tracks.chapters.choices]]
key = "open"
text = "放开海峡：谁的船来都卖，价随行市走"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_kaicili_done" }, { kind = "flag", flag = "c13_main_kaicili_end_open" }, { kind = "title", title = "开海峡的人" }, { kind = "memory", memory = "mem-main_kaicili-c11", title = "丁香的王冠" }]
reply = "特尔纳特的港口那一年来了九国的船，价跌了，又涨了。首领们抱怨，种树的人却第一次见到了会安的瓷碗和古吉拉特的布。我看着港里的帆，数不过来，笑了。"

[[tracks.chapters.choices]]
key = "league"
text = "和班达、爪哇结成香料之盟：丁香、肉豆蔻同进同退"
next = "done"
requires = [{ kind = "flag", flag = "c13_main_kaicili_banda_league" }]
hint = "班达那边还没有人愿意和你同进同退，结盟的话说不出口。"
effects = [{ kind = "flag", flag = "c13_main_kaicili_done" }, { kind = "flag", flag = "c13_main_kaicili_end_league" }, { kind = "title", title = "香料之盟" }, { kind = "memory", memory = "mem-main_kaicili-c11", title = "丁香的王冠" }]
reply = "那年西风起时，格雷西克、万丹、班达和特尔纳特的船第一次排在同一个港口外面，船头都插着一枝丁香。吉里的长老送来一句祝福，没有许诺，也没有白给。"

# ── 增写（2026-11-12）·旁轨「杭·惹拔」：伊德里斯从王家的舵手到交堡前一夜，7 章（k1—k7）。
# 母本：《杭·杜亚传》（后世成书）——老大被冤仍不叛，老二为他反王、被老大亲手杀死；《马来纪年》的君臣之约（王不辱民，民不叛王）。
# 文化：马来武人的结义与“不叛”；张力：伊德里斯认凯奇利，就替他记仇；凯奇利不叛，就得在交堡前一夜对上他。
# 史实只经人物嘴里透出来：1563 安汶（a05 之后）、1570 年 2 月海伦在堡门里被刺（动刀的是堡主的侄子，正文只说“那个人”）、首领与苏丹要堡主偿命、
#   1575 年交堡时巴布拉放堡里的人活着离开（“一个也不许碰”）。H36 的“提早撤空”结果由 k6 的 rw_a_early 变体接住。
# 入口：k1—k2 读 c13_main_kaicili（a00 default 设）；k3—k6 读 _act2（b01 各选项设）；k7 读 _act3（c01 default 与各选项设）。终章 k7 的选项 next = done。
# 读：rw_kaicili_idris_home / _helm_oath（养成）、c13_main_kaicili_warned_padre / _vengeance / _no_blood / _clove_oath（主线）、rw_kaicili_l_box_burned / _l_box_vouched（旁轨 l3）、H36；
# 设：rw_kaicili_k_*；k6 三个落点 rw_kaicili_k_end_kris / _end_bare / _end_guard 由 k7 读。伊德里斯在 k6 的 kris、guard 两个落点死去（1575），见交接的人物去世表。
[[tracks]]
key = "main_kaicili_rw_jebat"
name = "杭·惹拔"
kind = "main"
start = "k1"
auto = true
cast = ["kaicili"]

# k1 王家的舵
[[tracks.chapters]]
key = "k1"
title = "王家的舵"
text = "五月，围堡进到第五个月，父亲还在堡里。伊德里斯在老船长的船上划了四个月的桨，饭篮进堡的那些天，他的船就泊在堡下，离门最近。今天老船长把他领到宫里的船棚，指着苏丹那条大科拉科拉：老舵手眼睛看不清浪了，要换人。首领们说要贵人家的儿子，老船长说要手稳的。苏丹不在，船还是苏丹的。伊德里斯站在船棚门口，手在纱笼上擦了又擦，看着我。"
when = [{ kind = "flag", flag = "c13_main_kaicili" }, { kind = "date", from = [1557, 5, 10] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1558, 12, 31]

[[tracks.chapters.choices]]
key = "vouch"
text = "替他担保：舵交给他，出了事算我的"
next = "k2"
effects = [{ kind = "reputation", faction = "ternate", value = 2 }, { kind = "flag", flag = "rw_kaicili_k_vouched" }]
reply = "苏丹的儿子作了保，首领们不好再提贵人家。老船长把舵柄上缠的布解下来，重新缠了一遍，交到伊德里斯手里。他握住，没说谢，只说：“你作的保，我拿命还。”我说不要命，要船完好。他说：“船完好，就是我的命。”"

[[tracks.chapters.choices]]
key = "apprentice"
text = "开个价：先跟老船长掌三年副舵"
next = "k2"
effects = [{ kind = "skill", skill = "negotiation", value = 4 }, { kind = "flag", flag = "rw_kaicili_k_apprenticed" }]
reply = "我说舵要换，可苏丹的舵不能交给没在大浪里掌过的人；先掌三年副舵，三年后老船长说行，就是他的。首领们说公道。伊德里斯脸上的光暗了一下，又亮了：“三年。你记着这句话。”他去了船尾，把副舵的绳子一根根理顺。"

[[tracks.chapters.choices]]
key = "brother"
text = "请哥哥巴布拉来看他掌一趟"
next = "k2"
effects = [{ kind = "affinity", person = "babullah", value = 3 }, { kind = "flag", flag = "rw_kaicili_k_babullah" }]
reply = "哥哥站在岸上，看伊德里斯掌着那条大船绕过港里的三块礁，回来时船头没偏一指。哥哥点头：“船匠的儿子？好。往后他的舵就是我的舵。”伊德里斯跪下谢恩，谢的是哥哥。我站在一旁，头一回觉得，这个人从我手里走出去了一步。"

[tracks.chapters.timeout]
next = "k2"
effects = []
news = "特尔纳特的船棚里换了新舵手，码头上的人说，是个船匠的儿子。"

[[tracks.chapters.variants]]
key = "rw_a_helm"
when = [{ kind = "flag", flag = "rw_kaicili_helm_oath" }]
text = "五月，围堡进到第五个月，父亲还在堡里。伊德里斯在老船长的船上划了四个月的桨，饭篮进堡的那些天，他的船就泊在堡下，离门最近。今天老船长把他领到宫里的船棚，指着苏丹那条大科拉科拉：老舵手眼睛看不清浪了，要换人。首领们说要贵人家的儿子，老船长说要手稳的。吉里山脚那棵榕树底下，他跟我要过一个价：我有了船，舵归他。这条船不是我的。他站在船棚门口，看着我，等我付账。"

[[tracks.chapters.variants]]
key = "rw_b_home"
when = [{ kind = "flag", flag = "rw_kaicili_idris_home" }, { kind = "flag", flag = "rw_kaicili_helm_oath", value = false }]
text = "五月，围堡进到第五个月，父亲还在堡里。伊德里斯跟我一条船从格雷西克回来，回来就上了老船长的船，划了四个月的桨，饭篮进堡的那些天，他的船泊在堡下，离门最近。今天老船长把他领到宫里的船棚，指着苏丹那条大科拉科拉：老舵手眼睛看不清浪了，要换人。首领们说要贵人家的儿子，老船长说要手稳的。伊德里斯站在船棚门口，手在纱笼上擦了又擦，看着我。"

# k2 眉上的疤
[[tracks.chapters]]
key = "k2"
title = "眉上的疤"
text = "安汶回来一个月，伊德里斯眉上那道口子结了痂，从眉心斜到眉梢，像谁拿炭笔给他添了一笔。他如今是哥哥那条科拉科拉的正舵手，二十三岁，船上的人叫他“稳手”。他在船棚里给克里斯上油，跟我说起希图的滩：村里一个少年端着火绳枪对着哥哥，他扑上去，枪响了，打在船帮上，木刺扎进眉毛。“那孩子十四五岁，我把他按在水里，按到他松了手。”"
when = [{ kind = "flag", flag = "c13_main_kaicili" }, { kind = "date", from = [1563, 11, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1566, 12, 31]

[[tracks.chapters.choices]]
key = "thank"
text = "谢他护住了哥哥"
next = "k3"
effects = [{ kind = "reputation", faction = "ternate", value = 2 }, { kind = "flag", flag = "rw_kaicili_k_scar_thanked" }]
reply = "我说哥哥的命是他护下的，这一笔特尔纳特记着。他摇头：“我护的不是苏丹，是苏丹弟弟的哥哥。”他说得绕，自己先笑了。笑完又摸了摸那道疤：“你要是在那条船上，我也扑。”"

[[tracks.chapters.choices]]
key = "boy"
text = "问他：那孩子后来呢"
next = "k3"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_k_scar_boy" }]
reply = "“活着。”他把克里斯插回鞘里，“拖上岸的时候他咬了我一口，看我的那个眼神，跟我当年看堡里那个敲我头的书记一模一样。”他停了很久，“卡旺，我那天才知道，恨是会传的。我按着他，他就接过去了。”"

[[tracks.chapters.choices]]
key = "kris"
text = "看他那把克里斯：刀身几道弯"
next = "k3"
effects = [{ kind = "growth", attr = "arms", value = 200 }, { kind = "flag", flag = "rw_kaicili_k_scar_kris" }]
reply = "五道弯，刀面的纹像雨点打在沙上。他说是攒钱请克里斯匠打的，匠人问要给谁看，他说给一个人看就够了。我问是谁。他把刀递过来：“你先拿着。哪天我替你用它，再还我。”我没接。"

[tracks.chapters.timeout]
next = "k3"
effects = []
news = "安汶回来的科拉科拉上，苏丹儿子的舵手眉上多了一道疤，码头上的孩子学他摸眉毛。"

[[tracks.chapters.variants]]
key = "rw_padre"
when = [{ kind = "flag", flag = "c13_main_kaicili_warned_padre" }]
text = "安汶回来一个月，伊德里斯眉上那道口子结了痂，从眉心斜到眉梢，像谁拿炭笔给他添了一笔。他如今是哥哥那条科拉科拉的正舵手，二十三岁，船上的人叫他“稳手”。他在船棚里给克里斯上油，跟我说起希图的滩，说着说着压低了嗓子：“你在宫里跟那个神父说过话。船队几时到，他早就知道。苏丹没问，我也没说。”他用拇指抹了一下眉上的痂，“替你瞒一回，不算什么。”"

# k3 一百三十下桨
[[tracks.chapters]]
key = "k3"
title = "一百三十下桨"
text = "父亲下葬快一个月的一个夜里，伊德里斯来找我。那天早上他的船泊在堡下，离门三十步。他看见苏丹解刀、进门，门合上；看见门又开，四个人抬着出来。他说他数了：从门合上到门开，一百三十下桨。他坐在我屋里的门槛上，背对着我，说往后每天夜里，他都要数完一百三十下才睡。“卡旺，我只问你一句：你恨不恨。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1570, 3, 25] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]
deadline = [1571, 6, 30]

[[tracks.chapters.choices]]
key = "tell"
text = "告诉他：劝父亲去的人，是我"
next = "k4"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "flag", flag = "rw_kaicili_k_told_idris" }]
reply = "我说了。屋里很静，外头的雨又下起来。他没回头，过了很久才开口：“那就更不能让你去找那个人。你找到他、杀了他，是替自己赎罪，你赎不清的。我去，就只是报仇。报仇干净。”他站起来走了，门槛上留着两个湿脚印。"

[[tracks.chapters.choices]]
key = "lie"
text = "说：不恨，恨是堡里的人教的"
next = "k4"
effects = [{ kind = "flag", flag = "rw_kaicili_k_said_no_hate" }]
reply = "“不恨，”我说，“恨是堡里的人教的东西，我不学。”伊德里斯点点头，好像早知道我会这么答。“那我替你学。”他走到门口又停住：“卡旺，你说话从来不看人。今天你看着我说的。”他没说他信不信。"

[[tracks.chapters.choices]]
key = "kris"
text = "不答，把“海之灵”横在两人中间"
next = "k4"
effects = [{ kind = "flag", flag = "rw_kaicili_k_kris_shown" }]
reply = "我把“海之灵”横在我们中间，刀柄朝他。他看了很久，没碰：“这是你的。”我说父亲进门前交给我的，说出来再还。他说：“那他是要你替他拿着，不是要你替他用。”说完他自己愣了一下，好像这话不该从他嘴里出来。他走的时候，把门轻轻带上了。"

[tracks.chapters.timeout]
next = "k4"
effects = []
news = "苏丹下葬以后，堡下那段海面每天夜里都有一条船泊着，不点灯。"

[[tracks.chapters.variants]]
key = "rw_a_vengeance"
when = [{ kind = "flag", flag = "c13_main_kaicili_vengeance" }]
text = "父亲下葬快一个月的一个夜里，伊德里斯来找我。那天早上他的船泊在堡下，离门三十步。他看见苏丹解刀、进门，门合上；看见门又开，四个人抬着出来。他说他数了：从门合上到门开，一百三十下桨。他听说我在议事厅里按着刀发了誓，要找到动刀的那个人。他坐在我屋里的门槛上，背对着我：“你发的誓，我替你还。你只要告诉我一句：你恨不恨。”"

[[tracks.chapters.variants]]
key = "rw_b_noblood"
when = [{ kind = "flag", flag = "c13_main_kaicili_no_blood" }]
text = "父亲下葬快一个月的一个夜里，伊德里斯来找我。那天早上他的船泊在堡下，离门三十步。他看见苏丹解刀、进门，门合上；看见门又开，四个人抬着出来。他说他数了：从门合上到门开，一百三十下桨。他听说我在议事厅里发了不流血的誓。他坐在我屋里的门槛上，背对着我：“你不流，总得有人流。卡旺，我只问你一句：你恨不恨。”"

[[tracks.chapters.variants]]
key = "rw_c_clove"
when = [{ kind = "flag", flag = "c13_main_kaicili_clove_oath" }]
text = "父亲下葬快一个月的一个夜里，伊德里斯来找我。那天早上他的船泊在堡下，离门三十步。他看见苏丹解刀、进门，门合上；看见门又开，四个人抬着出来。他说他数了：从门合上到门开，一百三十下桨。他听说议事那天，首领们等我发血誓，我却说丁香的价。他坐在我屋里的门槛上，背对着我：“丁香的价，我不懂。我只问你一句：你恨不恨。”"

# k4 下半句
[[tracks.chapters]]
key = "k4"
title = "下半句"
text = "十月，首领们开过蒂多雷夫人的信匣以后，岛上的话传得很难听：苏丹是死在蒂多雷女人的信里的。哥哥没替母亲说一句话，只让她搬出宫，住到丁香园边上的旧屋。伊德里斯在船棚里等我，舵柄横在膝上。他把那个约背给我听，一字不差，是我小时候在母亲膝下背的那一段：“王不辱民。他先辱了，约就断了。你还守着下半句干什么？”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1571, 10, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1573, 6, 30]

[[tracks.chapters.choices]]
key = "lower"
text = "答：约的下半句，不等上半句"
next = "k5"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_k_lower_half" }]
reply = "“约是两家立的，两家都死了几百年了，”他说，“你守的是一张纸。”我说我守的是母亲：她被辱了，没叛；我要是叛了，她那一半就白守了。他看着我，那眼神我认得，是那年堡门口挨了一手杖以后，他攥着凿子的样子。“好，你守你的下半句。上半句，我替你讨。”"

[[tracks.chapters.choices]]
key = "price"
text = "答：上半句的账，我去跟哥哥讨价"
next = "k5"
effects = [{ kind = "affinity", person = "babullah", value = -2 }, { kind = "flag", flag = "rw_kaicili_k_brother_priced" }]
reply = "我去了。哥哥在议事厅后的小屋里听我说完：“让她搬出宫，是我护她。留在宫里，首领们的嘴会杀了她。”我说这一句我信，岛上的人不信。哥哥说：“那你开个价。”我说让母亲每年圣纪回宫坐一次席，坐上首。他想了很久，答应一半：坐席，不坐上首。伊德里斯听了只说：“一半？他辱的是一整个。”"

[[tracks.chapters.choices]]
key = "warn"
text = "答：这话你再说一遍，我就得告诉哥哥"
next = "k5"
effects = [{ kind = "flag", flag = "rw_kaicili_k_warned" }]
reply = "他放下舵柄站起来，比我高半个头。“你去告诉他。告诉他船匠的儿子说，苏丹辱了他弟弟的母亲。他要砍，我就让他砍，砍的是一个说了实话的人。”我没去告诉。那一夜我才明白，我那句话不是吓他，是求他别再说。他也明白。"

[tracks.chapters.timeout]
next = "k5"
effects = []
news = "特尔纳特的宫里少了一位夫人，丁香园边的旧屋夜里亮着灯。"

[[tracks.chapters.variants]]
key = "rw_a_burned"
when = [{ kind = "flag", flag = "rw_kaicili_l_box_burned" }]
text = "十月，首领们捧着那一匣子灰散了会，岛上的话传得很难听：烧了，就是有鬼；苏丹是死在蒂多雷女人的信里的。哥哥没替母亲说一句话，只让她搬出宫，住到丁香园边上的旧屋。伊德里斯在船棚里等我，舵柄横在膝上。他把那个约背给我听，一字不差：“王不辱民。他先辱了，约就断了。你烧了一匣子信替她挡，他连一句话都不替她挡。你还守着下半句干什么？”"

[[tracks.chapters.variants]]
key = "rw_b_vouched"
when = [{ kind = "flag", flag = "rw_kaicili_l_box_vouched" }]
text = "十月，信匣开到最后一封，什么也没开出来，首领们见了母亲照样起身行礼。可岛上的话还是传得很难听，哥哥还是让她搬出宫，住到丁香园边上的旧屋。伊德里斯在船棚里等我，舵柄横在膝上。他把那个约背给我听，一字不差：“王不辱民。你拿自己去作保，保住了她的名声，没保住她的屋子。他先辱了，约就断了。你还守着下半句干什么？”"

# k5 篮底的名字
[[tracks.chapters]]
key = "k5"
title = "篮底的名字"
text = "围城的第四年，堡墙上还是每天吊篮子下来换鱼。伊德里斯管着堡下那一段的船，每天看篮子上去下来。二月的一天，他拿着一块布来找我，是从篮底拆下来的，背面用炭写着几个葡萄牙字，是一个名字。他说是墙上一个妇人塞下来的，求人捎给马六甲的亲戚。“我认得这个名字，”他说，“那天门里动刀的，就是他。他还在里面。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1574, 2, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1575, 6, 30]

[[tracks.chapters.choices]]
key = "read"
text = "接过布，自己念那几个字"
next = "k6"
effects = [{ kind = "flag", flag = "rw_kaicili_k_name_read" }]
reply = "我念得很慢。名字是对的，堡下的人都这么叫那个人。可名字底下还有半行：请转告他母亲，他还活着。伊德里斯只问：“名字对不对？”我说对。他把布折好揣进怀里，揣在克里斯旁边：“那就够了。”"

[[tracks.chapters.choices]]
key = "brother"
text = "把布交给哥哥"
next = "k6"
effects = [{ kind = "affinity", person = "babullah", value = 3 }, { kind = "flag", flag = "rw_kaicili_k_name_to_king" }]
reply = "哥哥看完，把布扔进了灯里。“交堡那天，堡里的人一个不杀，这是我当着首领们答应的，也写进了给马六甲的信。”他看着我，“谁给你的？”我没说。他说：“我不问。你去告诉他：苏丹的话，比他的刀长。”我回去转告伊德里斯。他笑了：“刀短，才近。”"

[[tracks.chapters.choices]]
key = "doubt"
text = "说：名字对，人未必对"
next = "k6"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_k_name_doubted" }]
reply = "我说那天门里不止一个人，你在三十步外，看见的是门，不是脸；堡里叫这个名字的，也未必只有一个。哥哥说过，记着他的脸，别记成别人的。伊德里斯看着我：“你是要我别记，还是要我记准？”我说记准。他说：“我记准了。”那块布他再没给我看过。"

[tracks.chapters.timeout]
next = "k6"
effects = []
news = "堡下的人说，墙上吊下来的篮子里，这阵子常夹着写了字的布条。"

# k6 门槛外三十步
[[tracks.chapters]]
key = "k6"
title = "门槛外三十步"
text = "七月，堡里的人答应交堡，明天一早出门上船，只带箱子。今夜堡下没有灯，哥哥的卫兵围成半圈，守着门前那片空地——苏丹说了，明天出门的人，一个也不许碰。我在空地边上找到伊德里斯。他没在船上，坐在门槛外三十步那块石头上，就是那年他数一百三十下桨的地方。克里斯横在膝上，刀鞘解开了。“卡旺，你回去睡。明天的事跟你没关系。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1575, 7, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1576, 6, 30]

[[tracks.chapters.choices]]
key = "kris"
text = "拔出“海之灵”，站到他和门槛中间"
next = "k7"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "ternate", value = 3 }, { kind = "flag", flag = "rw_kaicili_k_end_kris" }]
reply = "他站起来，看看我手里的刀，又看看我。“你父亲的刀，”他说，“好。用它，干净。”是他先动的手。我们在黑里绕着那块石头，谁也没出声。卫兵听见铁碰铁的声音跑过来时，他已经跪在地上，一只手捂着肋下，另一只手还攥着刀。他靠在我肩上喘：“你守住了。”天亮以前，他死在那块石头边上。哥哥答应的事，一件也没破。"

[[tracks.chapters.choices]]
key = "bare"
text = "空着手，坐到他旁边那块石头上"
next = "k7"
effects = [{ kind = "growth", attr = "honor", value = 500 }, { kind = "flag", flag = "rw_kaicili_k_end_bare" }]
reply = "我没拔刀，在他旁边坐到半夜。他起身要走，我跟着起来，挡在他前头。刀尖顶在我胸口，我没退。他说让开，我说要过去就从这里过。刀尖往前送了一点，衣裳破了，皮破了，血是热的。他的手抖了一下，把刀扔在沙地上，跪下来用两只手按住我的伤口，一直按到天亮。哥哥后来没杀他，只让他驾自己那条小船离岛，永远别回来。"

[[tracks.chapters.choices]]
key = "guard"
text = "转身去叫哥哥的卫兵"
next = "k7"
effects = [{ kind = "affinity", person = "babullah", value = 5 }, { kind = "reputation", faction = "ternate", value = 2 }, { kind = "flag", flag = "rw_kaicili_k_end_guard" }]
reply = "我转身往卫兵那边走。他在身后叫了一声“卡旺”，我没回头。卫兵围上去，他没冲，也没跑，站在石头上等。他们让他放下刀，他不放；他们上去夺，他才动手，伤了两个人。他是被四支长矛钉在石头边上的。我回来时他还睁着眼看我——不是恨，是在看我到底守住了没有。天亮以后，哥哥答应的事，一件也没破。"

[tracks.chapters.timeout]
next = "k7"
effects = []
news = "特尔纳特人说，苏丹答应的事一件也没破；可交堡那几天，苏丹的一个舵手不见了。"

[[tracks.chapters.variants]]
key = "rw_a_early"
when = [{ kind = "flag", flag = "h36_ternate_revolt_fortress_evacuated_early" }]
text = "堡早就空了，空了好几年。今天哥哥把苏丹的座位搬了进去，夜里堡下没有灯。可安汶来的船捎了话：那年门里动刀的人没走远，在安汶的堡里当差，下个月随一条换货的船来蒂多雷。我在门槛外三十步那块石头上找到伊德里斯，就是那年他数一百三十下桨的地方。他的船装好了水和饭，没点灯。克里斯横在膝上，刀鞘解开了。“卡旺，你回去睡。苏丹答应让他们走，没答应让他们一直走下去。”"

[[tracks.chapters.variants]]
key = "rw_b_told"
when = [{ kind = "flag", flag = "rw_kaicili_k_told_idris" }, { kind = "flag", flag = "h36_ternate_revolt_fortress_evacuated_early", value = false }]
text = "七月，堡里的人答应交堡，明天一早出门上船，只带箱子。今夜堡下没有灯，哥哥的卫兵围成半圈，守着门前那片空地——苏丹说了，明天出门的人，一个也不许碰。我在空地边上找到伊德里斯。他坐在门槛外三十步那块石头上，克里斯横在膝上，刀鞘解开了。“卡旺，你回去睡。你那年告诉我，劝他去的是你。这一刀不是替苏丹的，是替你的。你赎不清的，我替你一刀了了。”"

# k7 船舷上的歪鸟
[[tracks.chapters]]
key = "k7"
title = "船舷上的歪鸟"
text = "四月，码头上的老船匠眼睛不行了，还在给人补船。他认得我，叫我王子，不叫卡旺。他的棚子底下拴着一条小船，船舷上那只歪歪扭扭的鸟，漆褪得只剩个影子。他说那是他儿子十几岁时钉的头一条船，交堡那年以后，再没人划过，船底的缝他每年雨季前补一回，补完又拴回去。他问我，要不要拆了当柴烧。"
when = [{ kind = "flag", flag = "c13_main_kaicili_act3" }, { kind = "date", from = [1580, 4, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]

[[tracks.chapters.choices]]
key = "row"
text = "把船推下水，自己划它出海一趟"
next = "done"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_k_boat_rowed" }]
reply = "我把小船推下水，一个人划出港，划到看得见蒂多雷火山的地方。浪从侧面打过来，我压住舵，身子倾得早了半拍——十几岁时他总说我倾得太晚。我在海上坐到太阳偏西，回来把船拴回棚子底下，对老船匠说：别拆，我还要划。"

[[tracks.chapters.choices]]
key = "paint"
text = "跟他要一罐漆，把那只鸟描回来"
next = "done"
effects = [{ kind = "reputation", faction = "ternate", value = 2 }, { kind = "flag", flag = "rw_kaicili_k_bird_painted" }]
reply = "我蹲在船舷边，照着褪了的影子把那只鸟一笔一笔描回来。描得还是歪，翅膀一高一低。老船匠凑近看了半天：“他描的也是这样，一高一低。他说这样飞起来，转得了弯。”"

[[tracks.chapters.choices]]
key = "write"
text = "坐在棚子底下，写一封信"
next = "done"
effects = [{ kind = "skill", skill = "poetry", value = 4 }, { kind = "flag", flag = "rw_kaicili_k_letter_written" }]
reply = "我借了老船匠的炭笔，在一块刨下来的木板上写：浪还是那样，白浪几时起，要看月亮，也要看老船长的烟斗往哪边偏。写完，我把木板钉在船尾，字朝里。寄得到寄不到，船都带着它。"

[[tracks.chapters.variants]]
key = "rw_a_kris"
when = [{ kind = "flag", flag = "rw_kaicili_k_end_kris" }]
text = "四月，码头上的老船匠眼睛不行了，还在给人补船。他认得我，叫我王子，不叫卡旺。他知道那一夜是谁的刀，五年里一次也没提。他的棚子底下拴着一条小船，船舷上那只歪歪扭扭的鸟，漆褪得只剩个影子。他说那是他儿子十几岁时钉的头一条船，交堡那年以后，再没人划过。他问我，要不要拆了当柴烧。"

[[tracks.chapters.variants]]
key = "rw_b_bare"
when = [{ kind = "flag", flag = "rw_kaicili_k_end_bare" }]
text = "四月，一条从苏拉群岛来的小船靠岸，船主捎来一封信，粗纸，字写得很重，封口上画着一只歪歪扭扭的鸟。信只有三行：我在这边替人钉船。这边的浪比家里大，白浪几时起，还是要看月亮。你胸口的伤好了没有。第四行写了又划掉，划痕底下认得出两个字：苏丹。码头上的老船匠站在我身后，眼睛不行了，问我信上写了什么。他的棚子底下，那条船舷上画着鸟的小船，还拴着。"

[[tracks.chapters.variants]]
key = "rw_c_guard"
when = [{ kind = "flag", flag = "rw_kaicili_k_end_guard" }]
text = "四月，码头上的老船匠眼睛不行了，还在给人补船。五年里他没跟我说过一句话，今天却叫住了我，叫我王子。他的棚子底下拴着一条小船，船舷上那只歪歪扭扭的鸟，漆褪得只剩个影子。他说那是他儿子十几岁时钉的头一条船。四支长矛的事，他一个字也没提，只问我，要不要拆了当柴烧。"

# ── 增写（2026-11-12）·旁轨「两边的信」：蒂多雷夫人从 1560 年的海峡之战到 1586 年下葬，6 章（l1—l5，含 l3b 表姐的木匣）。
