# c10：七十二岛的账。首领们要一个见过柱外的人坐镇。三个落点：做苏丹、做宰相（无旗标）、做香料商王。
[[tracks.chapters]]
key = "c10_seventy_two"
title = "七十二岛的账"
text = "旧堡的大厅如今是议事的地方，首领们坐成一圈。中间摊着一卷贝叶：七十二座岛，每座岛每年送来什么，丁香、西米、奴仆、船。侄子坐在上首，太年轻。哥哥留下的那副棋摆在他手边，缺了一只马。首领们要我说一句：先苏丹的东西，谁来接。一个老首领说：“七十二座岛要一个人记得住它们的名字。”我把一枚丁香放进那副棋盘缺马的位子，权当那只马。“你们的开价，我当班顿的上半句听；下半句怎么对，看你们等不等得起。”我念的是：七十二座岛七十二片帆，一片帆底下一筐丁香。"
speaker = "captain"
mood = "tense"
at = "ternate_port"
cast = ["kaicili"]
when = [{ kind = "date", from = [1586, 1, 1] }]
deadline = [1589, 12, 31]
news = "特尔纳特的旧堡里，首领们议了一整天七十二座岛的账，散会时苏丹的叔叔往棋盘里放了一枚丁香。"

[tracks.chapters.timeout]
next = "c11_epilogue"
effects = []
news = "特尔纳特的首领们等了几年，苏丹的叔叔没回来议事，宰相的位子就一直给他空着。"

