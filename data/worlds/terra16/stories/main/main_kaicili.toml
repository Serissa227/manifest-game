key = "noblood"
when = [{ kind = "flag", flag = "c13_main_kaicili_no_blood" }]
text = "五年里他没让营里的人放过一支冷箭。他发过的誓，堡里的人也听说了，所以才肯跟他下棋。围城第五年的旱季，堡里的人瘦得穿不住铠甲。不知从哪一天起，堡里的守将和我隔着护城河下棋：每天一个孩子从墙上吊下一张纸条，写一步；我在河边摆子，回一步。守将从墙上扔下一只象牙马，说他的棋盘少了一个子，借我的用。今天的纸条上，除了一步棋，还有一行字：“这盘下完，我们就走。”哥哥站在我身后看了很久：“他想输给你，不想输给我。随你。”守将送上门的那个子，跟外祖父当年那步坏棋一模一样。我认出来了。"

