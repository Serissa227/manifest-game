# b03：门槛。秘密在这一章揭开：劝父亲去的是他。正文停在门合上的那一刻。
[[tracks.chapters]]
key = "b03_gate"
title = "门槛"
text = "前一夜，宫里的廊下，雨刚停。父亲把那盘没下完的棋推到我面前：堡主请他第二天进堡赴宴讲和，几天前两边刚对着各自的经书起过誓。“你下棋爱让对方先走。这一回，是谁先走？”我说：“去吧。刚起过誓，他们不敢走错这一步。”父亲笑了笑，把棋子一颗颗收进盒里。第二天早上，堡门口。堡里不许带刀，父亲的卫士被枪杆拦在门外。父亲解下那把七道弯的克里斯，交到我手里：“替我拿着，出来再还我。”门在身后合上了。我心里只有一件事：劝他去的人是我，这件事我在岛上从没对谁说过。"
stage = "involve"
window = [[1570, 1, 10], [1570, 3, 10]]
at = "ternate_port"
cast = ["hairun"]
speaker = "captain"
mood = "sad"
night = true
news = "特尔纳特的要塞门口那天早上，苏丹的卫士被留在门外，在台阶上蹲了很久。"

[tracks.chapters.default]
next = "b04_oath"
effects = [{ kind = "item", item = "sea_spirit_kris", qty = 1 }, { kind = "flag", flag = "c13_main_kaicili_gate_away" }]

