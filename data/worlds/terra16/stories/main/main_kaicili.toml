# b07：隔着护城河的棋。守将故意送了一个子，凯奇利认出那是外祖父的坏棋。
[[tracks.chapters]]
key = "b07_siege_chess"
title = "隔着护城河的棋"
text = "围城第五年的旱季，堡里的人瘦得穿不住铠甲。不知从哪一天起，堡里的守将和我隔着护城河下棋：每天一个孩子从墙上吊下一张纸条，写一步；我在河边摆子，回一步。守将从墙上扔下一只象牙马，说他的棋盘少了一个子，借我的用。今天的纸条上，除了一步棋，还有一行字：“这盘下完，我们就走。你赢，我们只带箱子；你输，我们带上炮。”哥哥站在我身后看了很久：“他想输给你，不想输给我。随你。”我念了班顿的上半句：堡墙上晒着白帆布，护城河里游着小鱼。守将送上门的那个子，跟外祖父当年那步坏棋一模一样。我认出来了。"
at = "ternate_port"
cast = ["babullah"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1575, 1, 1] }, { kind = "flag", flag = "h36_ternate_revolt_fortress_evacuated_early", value = false }]
deadline = [1575, 6, 10]
news = "特尔纳特的堡墙上，有人每天往下吊一张纸条，围城的人说那是一盘没下完的棋。"

[tracks.chapters.timeout]
