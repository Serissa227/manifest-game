# c01：金鹿号的戒指。德雷克问的第一句是西班牙人的船；哥哥托付的戒指，要装进一封信。
[[tracks.chapters]]
key = "c01_drake"
title = "金鹿号的戒指"
text = "特尔纳特港外泊着一条满身藤壶的英格兰船，船尾漆着一头金色的鹿。苏丹的御船出港去迎它，船上敲锣，吹螺号。哥哥坐在船中的华盖底下，手里捏着一枚金戒指。英格兰船长德雷克嗓门很大，先问的是：“你们见过西班牙人的船没有？先说那个，丁香的事等一会儿。”哥哥笑：“礼是礼，账是账。戒指是礼，丁香是账。”他要把戒指托这个陌生人带给一位从没见过的女王。德雷克说丁香他全要，问价时却只摆了摆手：“你们要什么就开。”我心里想：不还价的客人，下一回就不来了。"
stage = "involve"
window = [[1579, 11, 1], [1579, 11, 30]]
at = "ternate_port"
cast = ["francis_drake", "babullah"]
speaker = "captain"
mood = "cheerful"
news = "金鹿号在特尔纳特装了满舱丁香，听说苏丹还托英格兰船长捎一枚戒指给他们的女王。"

[tracks.chapters.default]
