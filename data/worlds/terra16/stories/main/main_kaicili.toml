next = "c09_nutmeg"
effects = [{ kind = "reputation", faction = "ternate", value = 10 }, { kind = "reputation", faction = "spain", value = -5 }]
reply = "两排长船横在海峡里，桨一齐举一齐落，西班牙的船靠不了岸，转了三天，回了蒂多雷。首领们第一次叫我“劳特”，那是海的意思。"
check = { attr = "command", base = 5, per = 8 }
