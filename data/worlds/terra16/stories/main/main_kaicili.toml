[[tracks.chapters.variants]]
key = "c_vengeance"
when = [{ kind = "flag", flag = "c13_main_kaicili_vengeance" }]
text = "哥哥的坟在父亲旁边，坟上的土已经长了草。侄子赛义德做了苏丹，年轻，还不太会在首领们面前说话。马尼拉的西班牙船又来了，这一回带着蒂多雷的科拉科拉。我站在旧堡的墙上，哥哥的拐杖还靠在墙角，杖头雕着一条科拉科拉。西班牙船的甲板上站着几个葡萄牙人，我一个一个看过去，没有那张脸。侄子在墙下喊：“叔叔，父亲说你下棋从不先动手。”蒂多雷的船头有人隔着水喊：“外祖父的棋，你还记得吗？”我看着海峡里最后一排的船。桨下得很慢。那一排是在等我开价。"

[[tracks.chapters.choices]]
