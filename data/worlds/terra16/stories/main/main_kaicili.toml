# C13c 主线·凯奇利·劳特「丁香的王冠」（故事 2.0，A5 / E37 契约）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_kaicili_atlantis 与本线同批登记；c05_after 的 when 加 c13_main_kaicili_atlantis_over，由补章的结局与 c04_dark_sea 的掉头 / 缺席分支设。
#   补章 at1 的 give_sprig（c13_main_kaicili_atl_gave，丁香夹进了伊斯梅妮的律文卷子）：c05_after 加 v0_gave 变体，silent 选项（把丁香放回棋盒）要求它为假，锁着时有提示。
# 标签：主线，男主角凯奇利·劳特（1540 年生，特尔纳特苏丹海伦之子，母亲是蒂多雷宫里的公主；1557 年出海时十六七岁）。全线不写恋爱，不用 heart / relation / tie / bond 效果；林晚灯只叫名字，不用他 / 她。
# 依据——史实（只从人物嘴里、码头告示与物件上透出来，不讲历史课）：1557 葡萄牙堡主扣押海伦，首领与蒂多雷围堡（a01、a02）；1563 巴布拉的船队到安汶（a04、a05）；1564 玉佛迁往万象（a06、a07）；1568—69 宿务之围（b01、b02）；1570 海伦在要塞门口被刺（b03、b04）；1570—75 围城，1575 交堡（b05—b08）；1574 林凤袭马尼拉（b06）；1579 德雷克到特尔纳特（c01）；1582、1585 西班牙人来攻（c02、c08）；1583 巴布拉去世，子赛义德即位（c06）；马尼拉的西班牙人与蒂多雷的葡萄牙人同挂一面旗（c02）；“七十二岛之主”（c10）。
# 原创：凯奇利本人与他的家事（母亲、劝父亲赴宴、海之灵的传承）、外祖父的棋、隔河的棋、阿佛的种子、班顿的上半句。
# 待核：海伦获释的年月、1582 与 1585 两次来攻的月份、交堡的月份、凯奇利·奈克到里斯本的月份（正文一律传闻口吻）。
# 秘密：心里的刺（劝父亲赴宴的是他）只在 b03 正文里揭开；b03 走 default 时由 b04 的 b_away 变体揭开。见闻、标题、英文覆盖都不写。
# 读写的共享旗标：设 c13_main_kaicili（a00 default）、_act2（b01）、_act3（c01）、_keepsake 与 _stance_open / _close / _hand（c03）、_crossed / _turned_back / _absent（c04）、_done 与恰好一面 _end_island / _end_open / _end_league（c11）；另设 _makian_given（a02）、_ambon_talk / _ambon_fleet / _warned_padre（a04）、_seat_given（a06）、_cebu_letter（b01）、_fed_fort（b05）、_gate_away / _gate_charge（b03）、_vengeance / _no_blood / _clove_oath（b04，no_blood 交给 C11）、_chess_won / _chess_lost（b07）、_manila_news / _afo（b09，afo 交给 C11）、_burned_cloves（c08）、_banda_league（c09）、_went_home（c06）、_envoy_home（c07）、_role_sultan / _role_merchant（c10）；全局印记 c13_mark_buddha（a07 record）。读 c12_voyage_kaicili（门槛）、c7_bond_daeng_landing_friend、c7_bond_wati_landing_friend、c7_bond_wati_own、c7_bond_raja_muda_landing_friend、atlantis_council_met、atlantis_verdict_close / _open（C11）。
# 等待的包：A8（tabula_smaragdina 是否作帷幕钥匙）、A9（门槛章可加 protagonist 条件）、C10（HIST 代码表与结果旗标）、C11（atlantis_council_met、atlantis_verdict_*）。
# 历史结果旗标（2026-10-26 由 HIST_* 占位换成 C10 的 key）：h36_ternate_revolt_fortress_evacuated_early（b07 的 when、b08 的 early / opened 两个选项）、h52_iberian_union_antonio_rules_portugal（c02 变体 a_antonio）。
# C10 没有“海伦获救”与“葡萄牙人守住堡”两种结果，b04 的 a_rescued 变体与 b08 的 hold 选项已删。
# 2026-11-12 增写：文件末尾追加三条旁轨 main_kaicili_rw_jebat（杭·惹拔）、main_kaicili_rw_letters（两边的信）、main_kaicili_rw_oar（最后一拍）；a00、a01 加 rw_ 变体。秘密的写法不变：劝父亲赴宴的是他，旁轨只在 b03 以后的章里让人物知道。
# 回忆插画清单（mem-main_kaicili-<章>，画面）：a05 熄了灯的船（夜里的海湾，一条科拉科拉熄了灯横在湾口，远处一条小船上挤着孩子）；a07 佛前一炷香（酥油灯里一尊碧绿的小佛，一炷掺着丁香的香快烧到底，旁边坐着一位王和一个戴金丝头巾的人）；b03 门槛（石堡的门半开着，门槛外一个人双手捧着一把七道弯的克里斯，门里的院子亮得刺眼）；b06 红灯笼与七趟船（夜里的河口，一盏红灯笼举在小船上，一条长长的科拉科拉载满人往对岸划）；b07 隔着护城河的棋（护城河边摆着一张棋盘，墙头吊下一只小篮子，篮里一张纸条和一只象牙马）；b08 交堡那天（石堡的门向外大开，葡萄牙人提着箱子走下台阶，门槛外站着一个手按克里斯的人）；b09 阿佛的种子（火山灰落在丁香叶上，老树底下一个人把种子拣进芭蕉叶里）；c02 同一根桅上的两面旗（从火山坡上的竹棚望过海峡，对岸石堡下一根桅杆挂着两面旗，棚里一支雕着船的拐杖）；c04 海草里的丁香（黄褐色的海草铺到天边，一条长长的科拉科拉船头挂着一束干丁香，前方是雾）；c05 压回棋盒的丁香（棋盒打开，底下一枝发青的丁香压在一页旧字上；本线新增的插画，原骨架未列）；c06 迟到的信（信封的蜡封裂开，一枝压扁的丁香落在棋盒边；本线新增）；c07 雨里的国书（雨中的里斯本河岸，两个戴金丝头巾的人站在屋檐下，一个怀里抱着一卷国书）；c11 丁香的王冠（收获季的火山坡上满是晒丁香的席子，两座坟边坐着一个人，膝上横着一把七道弯的克里斯）。

