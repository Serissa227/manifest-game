# 增写（2026-11-12）：a01 的 rw_ 变体读养成期“杭·惹拔”j1 的 rw_kaicili_fort_debt_paid。
[[tracks.chapters.variants]]
key = "rw_debt"
when = [{ kind = "flag", flag = "rw_kaicili_fort_debt_paid" }]
text = "特尔纳特的葡萄牙石堡临着海，墙脚泡在潮水里。父亲被堡主扣在里面已有些日子了。叔叔凯奇利·古吉拉提先一步出了堡，这几天在宫里、营地和堡门之间来回传话。首领们和海峡对岸蒂多雷的科拉科拉一起围住了堡。守门的书记还是那一个，十三岁那年我在他门口开过一回三倍的价，他认得我，点头的时候没笑。堡门口，卫兵每次都要掀开饭篮上的芭蕉叶，把米一粒一粒翻一遍。蒂多雷的水师统领走过来，托我把一卷纸塞进饭篮，带进去：放人之后，马基安岛的丁香要分给蒂多雷。叔叔把纸攥在手里：“谁亲眼看见他们落的印？没凭据的东西，进了堡门就是一条人命。”门缝里传来父亲的声音：“饭里没掺沙子吧？堡里的人连米都要数，你别学他们。”我对水师统领说：“你的开价，我当班顿的上半句听；下半句怎么对，看你等不等得起。”"

# a02：蒂多雷宫里的夜。外祖父故意走一步坏棋，等外孙吃。
[[tracks.chapters]]
key = "a02_tidore"
title = "外祖父的棋盘"
text = "蒂多雷宫里的夜，雨季刚过，廊下点着椰油灯。外祖父坐在象牙棋盘那头等我，母亲是从这座宫里嫁出去的，廊下的老侍女还认得我小时候的样子。外祖父每吃一个子，就说一条价：蒂多雷的船为特尔纳特围堡，要换马基安岛三年的丁香。棋盘边堆着一小撮晒干的丁香，他拿它当筹码数。“外孙来讨价，我高兴；外孙替特尔纳特讨价，我只好高兴得多要一点。”他忽然停住，把一颗子推到我面前：“小王子，该你走了。”我照旧笑，手指在棋子上停了一下。海峡这边一座火山，海峡那边一座火山。"
