# b04：按在刀柄上的手。三个变体：a_rescued 必须排在最前。
[[tracks.chapters]]
key = "b04_oath"
title = "按在刀柄上的手"
text = "父亲葬在清真寺后面的坡上，丁香树的影子落在新土上。首领们推哥哥巴布拉做了苏丹。头一次议事，哥哥站起来说：不强攻。把堡围住，让堡里的人自己数米，数到他们走。一个首领低声说：“苏丹的血流在门口，门还立着。”首领们等我发誓。岛上的规矩：手按在刀柄上说的话，要算数。我膝上横着“海之灵”，刀柄上还有父亲的手留下的油。哥哥看着我：“不强攻。让他们在堡里数米，数到他们自己开门。”"
speaker = "captain"
mood = "sad"
cast = ["babullah"]
when = [{ kind = "date", from = [1570, 3, 11] }]


[[tracks.chapters.variants]]
key = "b_away"
when = [{ kind = "flag", flag = "c13_main_kaicili_gate_away" }]
text = "他不在门口。卫士把那把克里斯带回来交给我，说苏丹进门前解下了刀，叫人“交给小儿子”。那盘没下完的棋，父亲问我去不去，是我说的“去吧”。我说，刚起过誓，他们不敢走错这一步。这句话，我在岛上从没对谁说过。父亲葬在清真寺后面的坡上，丁香树的影子落在新土上。首领们推哥哥巴布拉做了苏丹。哥哥站起来说：不强攻，让他们在堡里数米，数到他们自己开门。首领们等我发誓。刀柄上还有父亲的手留下的油。"

[[tracks.chapters.variants]]
key = "c_charge"
when = [{ kind = "flag", flag = "c13_main_kaicili_gate_charge" }]
text = "父亲葬在清真寺后面的坡上，丁香树的影子落在新土上。首领们推哥哥巴布拉做了苏丹。哥哥站起来说：不强攻。把堡围住，让堡里的人自己数米，数到他们走。我额头上撞门留下的疤还没结痂，首领们看着那道疤，先不说话了。我膝上横着“海之灵”，哥哥看着我：“不强攻。让他们在堡里数米，数到他们自己开门。”"

[[tracks.chapters.choices]]
key = "vengeance"
text = "手按刀柄发誓：找到动刀的那个人"
next = "b05_siege_supply"
effects = [{ kind = "flag", flag = "c13_main_kaicili_vengeance" }, { kind = "affinity", person = "babullah", value = 5 }]
reply = "首领们齐声应了。巴布拉看着我，点了点头：“记着他的脸，别记成别人的。”那天夜里，我把堡墙上每个哨兵的脸都看了一遍。"

[[tracks.chapters.choices]]
key = "no_blood"
text = "手按刀柄发誓：不流一滴血，把那座堡拿回来"
next = "b05_siege_supply"
effects = [{ kind = "flag", flag = "c13_main_kaicili_no_blood" }, { kind = "growth", attr = "honor", value = 500 }, { kind = "affinity", person = "babullah", value = -2 }]
reply = "议事的屋里静了很久。有个首领冷笑，巴布拉抬手止住他：“我说不强攻，他说不流血。好，我们兄弟俩加起来，就是一座空堡。”"

[[tracks.chapters.choices]]
key = "clove_oath"
text = "不发血誓，只替父亲应下一件事：丁香的价由岛上的人定"
next = "b05_siege_supply"
effects = [{ kind = "flag", flag = "c13_main_kaicili_clove_oath" }, { kind = "reputation", faction = "ternate", value = 5 }]
reply = "首领们面面相觑，老船长却点头：先苏丹最恨的就是堡里的人替他定价。巴布拉说：“这一句，比报仇难。”我把刀收回鞘里，第二天去了丁香园。"

# b05：城里城外的米。篮子吊下来，篮底的布上绣着十字。
[[tracks.chapters]]
key = "b05_siege_supply"
title = "城里城外的米"
text = "围城的第一个雨季。堡墙下搭起了特尔纳特人的棚子，棚边照样有人摆摊卖鱼。堡里的葡萄牙妇孺每天放一只篮子下来，换几条鱼。岛上的米不够两边吃，要从爪哇运。篮子从墙头吊下来，篮底垫着一块布，布上绣着十字，红线绣的。墙上的妇人朝下喊：“我们不要鱼了，给孩子一点米就行！”哥哥站在棚子边：“米是给围城的人吃的。城里的人饿了，门就开得快。”我看着那只篮子，又看看哥哥。哥哥在等门开，篮子在等米。船上的米，要分给谁？"
at = "ternate_port"
cast = ["babullah"]
speaker = "captain"
mood = "tender"
objectives = [{ kind = "goods", good = "rice", qty = 30, at = "ternate_port", text = "从爪哇运三十担米到特尔纳特" }]
deadline_days = 365
news = "特尔纳特的堡墙下，苏丹的弟弟运来了米，堡墙上的篮子又吊下来了。"

[tracks.chapters.timeout]
next = "b06_limahong"
effects = []
news = "特尔纳特的围城过了一年，爪哇的米船没来，堡墙上那只篮子还是空着吊上吊下。"

[[tracks.chapters.variants]]
