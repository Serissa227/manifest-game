# a00：门槛见闻。c12_voyage_kaicili 只在选中凯奇利时设；窗口一过，这条主线静默失败。
[[tracks.chapters]]
key = "a00_gate"
title = "王子回来了"
text = "北风季头一个早上，爪哇吉里的科拉科拉靠上特尔纳特码头。船上卸下书箱、一副旧棋盘，还有蒂多雷外祖家托带的槟榔。那位苏丹的小儿子说话慢，见人先笑，上岸先谢船老大，再谢挑夫。卖槟榔的老妇说：“吉里教出来的孩子，礼数比堡里的人还长。”一个挑夫笑着接了一句：“箱子比人还沉，怕是一半都是书。”码头上的人又朝岸上那座石堡努努嘴：堡门这几天白天也关着。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "ternate_port"
cast = ["kaicili"]
mood = "cheerful"
news = "特尔纳特码头上说，苏丹的小儿子从爪哇的吉里回来了，箱子里一半是书，一半是蒂多雷外祖家托带的槟榔。"
when = [{ kind = "flag", flag = "c12_voyage_kaicili" }]

[tracks.chapters.default]
next = "a01_seized"
effects = [{ kind = "flag", flag = "c13_main_kaicili" }]

