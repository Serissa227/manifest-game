text = "围城的第一个雨季。堡墙下搭起了特尔纳特人的棚子，棚边照样有人摆摊卖鱼。堡里的葡萄牙妇孺每天放一只篮子下来，换几条鱼。岛上的米不够两边吃，要从爪哇运。篮子从墙头吊下来，篮底垫着一块布，布上绣着十字，红线绣的。墙上的妇人朝下喊：“我们不要鱼了，给孩子一点米就行！”哥哥站在棚子边：“米是给围城的人吃的。”首领们装船时都在笑，发过“不流血”誓的人，打仗就打米。我看着那只篮子，又看看哥哥。"

