# b09：会长头发的王冠。阿佛的种子。凯奇利想起万象的王问过的话。
[[tracks.chapters]]
key = "b09_crown"
title = "会长头发的王冠"
text = "加马拉马火山冒了几天白烟，山腰上的丁香叶子落了一层灰。老人们说要把苏丹的王冠请出来：冠上的“头发”会自己长，长到哪一年，火山就安分到哪一年。巴布拉如今被人叫作七十二岛之主，却不肯把王冠拿出宫。“王冠出了宫，人就会说苏丹怕火山。”哥哥说。一个老人说：“冠上的头发长一寸，火山就睡一年。”山下的客栈住着一位马尼拉来的修士，手里记着本子，问我这王冠的故事。我上山去看那株最老的丁香树，阿佛。树下的种子落了一地。我念了班顿的上半句：火山顶上冒白烟，丁香树下落红花。我想起万象的王问过我的话：搬家的时候，带什么走？"
speaker = "captain"
mood = "mystic"
at = "ternate_port"
cast = ["babullah"]
when = [{ kind = "date", from = [1576, 1, 1] }]
objectives = [{ kind = "discovery", discovery = "plant_afo_clove", text = "上加马拉马的山腰，找到那株叫阿佛的丁香老树" }]
deadline = [1577, 12, 31]
news = "特尔纳特的老人说，加马拉马冒烟那几天，苏丹的弟弟在阿佛老树底下拣了一整天种子。"

[tracks.chapters.timeout]
next = "c01_drake"
effects = []
news = "特尔纳特的加马拉马冒了一冬的烟，苏丹的王冠到底没有请出宫，老人们只好自己上山拜火。"

[[tracks.chapters.variants]]
