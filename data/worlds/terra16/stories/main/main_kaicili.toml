# l1 海峡两边的火山
[[tracks.chapters]]
key = "l1"
title = "海峡两边的火山"
text = "1560 年，父亲的船队打了蒂多雷，烧了海峡对岸两个村子，把外祖家一条大科拉科拉拖回了特尔纳特的码头。庆功那一夜，宫里点了一百盏椰油灯。母亲照常坐席，照常奉茶，奉到父亲面前，手很稳。散了席，她把我叫进她屋里，桌上摆着一封写好的信，没封口：“明天你替我送过海。你父亲知道，你外祖父也会知道是你送的。”"
when = [{ kind = "flag", flag = "c13_main_kaicili" }, { kind = "date", from = [1560, 3, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1561, 12, 31]

[[tracks.chapters.choices]]
key = "read"
text = "当着她的面问：我能先看吗"
next = "l2"
effects = [{ kind = "flag", flag = "rw_kaicili_l_letter_read" }]
reply = "“看吧。”信很短，写给外祖父：女儿在特尔纳特吃得饱、睡得着；丈夫赢了，女儿替他高兴；父亲输了，女儿替父亲难过。两样都是真的，不知道先写哪一样，就一起写了。我把信折好，她把蒂多雷的旧印按在封口上，又把特尔纳特的印按在旁边，两枚印挨着。"

[[tracks.chapters.choices]]
key = "carry"
text = "不看，封好，明早送过海"
next = "l2"
effects = [{ kind = "reputation", faction = "tidore", value = 3 }, { kind = "flag", flag = "rw_kaicili_l_letter_carried" }]
reply = "第二天我划着自己的船过了海峡。蒂多雷的码头上还在冒烟，外祖父没见我，派一个老侍女出来接信。她认得我，接过信，摸了摸我的脸：“你母亲的字，还跟在这边时一个样。”回来时她塞给我一包槟榔，是我小时候在廊下嚼过的那个味。"

[[tracks.chapters.choices]]
key = "ship"
text = "说：要我送，就把外祖家那条船也还回去"
next = "l2"
effects = [{ kind = "reputation", faction = "tidore", value = 6 }, { kind = "reputation", faction = "ternate", value = -3 }, { kind = "flag", flag = "rw_kaicili_l_ship_returned" }]
reply = "我去找父亲，说母亲的信我送，可得配一样东西：拖回来的那条大科拉科拉。父亲笑了：“你开这个价，是替谁开的？”我说替母亲。他想了一夜，叫人把那条船的桨全卸了，空船拖到海峡中间，让蒂多雷的人自己来拖。母亲知道了，一句话没说，那天晚饭多给我舀了一勺汤。"

[tracks.chapters.timeout]
next = "l2"
effects = []
news = "海峡两边的人说，特尔纳特打赢了蒂多雷；苏丹那位蒂多雷来的夫人，庆功宴上照常奉茶。"

[[tracks.chapters.variants]]
key = "rw_a_deliver"
when = [{ kind = "flag", flag = "rw_kaicili_oath_deliver" }]
text = "1560 年，父亲的船队打了蒂多雷，烧了海峡对岸两个村子，把外祖家一条大科拉科拉拖回了特尔纳特的码头。庆功那一夜，宫里点了一百盏椰油灯。母亲照常坐席，照常奉茶，奉到父亲面前，手很稳。散了席，她把我叫进屋里，桌上摆着一封写好的信，没封口：“你在吉里写信给我，说到你手里的信只管送到。明天就替我送这一封过海。”"

[[tracks.chapters.variants]]
key = "rw_b_burn"
when = [{ kind = "flag", flag = "rw_kaicili_oath_burn" }]
text = "1560 年，父亲的船队打了蒂多雷，烧了海峡对岸两个村子，把外祖家一条大科拉科拉拖回了特尔纳特的码头。庆功那一夜，宫里点了一百盏椰油灯。母亲照常坐席，照常奉茶，奉到父亲面前，手很稳。散了席，她把我叫进屋里，桌上摆着一封写好的信，没封口：“你说过，不该送的你替我烧。这一封，你看完再定是送还是烧。”"

[[tracks.chapters.variants]]
key = "rw_c_price"
when = [{ kind = "flag", flag = "rw_kaicili_oath_price" }]
text = "1560 年，父亲的船队打了蒂多雷，烧了海峡对岸两个村子，把外祖家一条大科拉科拉拖回了特尔纳特的码头。庆功那一夜，宫里点了一百盏椰油灯。母亲照常坐席，照常奉茶，奉到父亲面前，手很稳。散了席，她把我叫进屋里，桌上摆着一封写好的信，没封口：“你说每封信都有个价。这一封的价，你算算。明天替我送过海。”"

# l2 晚到的那一封
[[tracks.chapters]]
key = "l2"
title = "晚到的那一封"
text = "父亲下葬快一个月了，一条蒂多雷的小船靠岸，捎来一封给母亲的信，黄蜡封口，是两个月前写的。母亲在灶前拆开，读了一遍，没读第二遍，就递给了我。写信的是外祖家那个老侍女，只一句：堡里新来的那位要请苏丹赴宴，这边有人听见一点风声，别让他进门。母亲没哭，看着灶里的火，问我：“那天前一夜，他去问过谁？”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1570, 3, 20] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]
deadline = [1570, 12, 31]

[[tracks.chapters.choices]]
key = "confess"
text = "告诉她：他问的是我，我说的是去吧"
next = "l3"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "flag", flag = "rw_kaicili_l_confessed" }]
reply = "我说完，母亲把信从我手里拿回去，折成窄条，送进了火里。纸烧起来，她才开口：“这封信要是早到两个月，你父亲还是会问你，你还是会说去吧，他还是会去。”她用火钳把灰压平，“他去，不是因为你说了什么，是因为你说的时候，他信你。”"

[[tracks.chapters.choices]]
key = "hide"
text = "说：他谁也没问"
next = "l3"
effects = [{ kind = "flag", flag = "rw_kaicili_l_hid" }]
reply = "“他谁也没问。”母亲点点头，像这正是她要的答案。她把信折成窄条，没烧，压进了灶台的砖缝里。“这一封我不烧。烧了，就像我从没收到过。我收到过，晚了，这件事我得记着。”她没再看我。我知道她不信，也知道她不会再问。"

[[tracks.chapters.choices]]
key = "ask"
text = "反问她：您早一点收到，拦得住他吗"
next = "l3"
effects = [{ kind = "flag", flag = "rw_kaicili_l_asked_back" }]
reply = "母亲想了很久。“我会拦，他会去。他这辈子在堡里进进出出，没听我拦过一回。”她把信递回给我，“你收着。哪天你想知道一个人的话有多重，就看看它：晚了两个月，什么也没拦住。”那封信我夹进了经本，压在讲“忍”的那一页。"

[tracks.chapters.timeout]
next = "l3"
effects = []
news = "苏丹下葬以后，丁香园边上那家人说，宫里的灶一夜一夜地亮到天明。"

[[tracks.chapters.variants]]
key = "rw_a_sat"
when = [{ kind = "flag", flag = "rw_kaicili_ash_sat" }]
text = "父亲下葬快一个月了，一条蒂多雷的小船靠岸，捎来一封给母亲的信，黄蜡封口，是两个月前写的。母亲蹲在灶前拆开，跟我十二岁那年夜里陪她看火时一个样子。她读了一遍，没读第二遍，就递给了我。写信的是外祖家那个老侍女，只一句：堡里新来的那位要请苏丹赴宴，这边有人听见一点风声，别让他进门。母亲没哭，看着灶里的火，问我：“那天前一夜，他去问过谁？”"

[[tracks.chapters.variants]]
key = "rw_b_asked"
when = [{ kind = "flag", flag = "rw_kaicili_ash_asked" }]
text = "父亲下葬快一个月了，一条蒂多雷的小船靠岸，捎来一封给母亲的信，黄蜡封口，是两个月前写的。母亲在灶前拆开，读了一遍，就递给了我。十二岁那年我问过她，灶里烧的是什么；她说，是不该让她知道的事。这一封是该让她知道的，晚了两个月。写信的是外祖家那个老侍女，只一句：堡里新来的那位要请苏丹赴宴，这边有人听见一点风声，别让他进门。母亲看着灶里的火，问我：“那天前一夜，他去问过谁？”"

# l3 开匣
[[tracks.chapters]]
key = "l3"
title = "开匣"
text = "围城的第二年春天，首领们在议事厅里说：苏丹死前一个月，宫里有人跟蒂多雷通信；蒂多雷又跟堡里的人有来往。他们要开蒂多雷夫人的信匣。哥哥坐在上首，没说开，也没说不开，只看着我。母亲的信匣压在她屋里的箱底，钥匙在她自己手里。她把钥匙放进我手心：“你去拿。你拿去，比他们拿去好看。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1571, 3, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1571, 9, 30]

[[tracks.chapters.choices]]
key = "open"
text = "捧着信匣进议事厅，当众打开"
next = "l3b"
effects = [{ kind = "reputation", faction = "ternate", value = 2 }, { kind = "flag", flag = "rw_kaicili_l_box_opened" }]
reply = "我把匣子放在议事厅中间的席上，打开。首领们一封封地翻，翻出外祖父的咳嗽、老侍女的病、蒂多雷园子里的花、母亲小时候那个奶娘的坟。翻到最底下，是一沓没寄出去的信，全是写给父亲的，一封也没寄过。首领们不翻了。哥哥起身说：合上。可岛上的人从此都知道，蒂多雷夫人的匣子被当众开过。"

[[tracks.chapters.choices]]
key = "burn"
text = "先回屋，把匣子里的信一封不读，全烧了"
next = "l3b"
effects = [{ kind = "affinity", person = "babullah", value = -4 }, { kind = "flag", flag = "rw_kaicili_l_box_burned" }]
reply = "我没去议事厅，先回了母亲的屋，蹲在灶前，把匣子里的信一封封送进火里，没读。母亲站在门口看着，没拦。我捧着一匣子灰进了议事厅，首领们炸开了锅：烧了，就是有鬼。哥哥抬手止住他们，盯着那匣子灰看了很久：“我弟弟烧的，是我们特尔纳特人看不得的东西。这一笔，记在我账上。”"

[[tracks.chapters.choices]]
key = "vouch"
text = "开匣以前先开价：开出一封通敌的，我去蒂多雷做人质"
next = "l3b"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "flag", flag = "rw_kaicili_l_box_vouched" }]
reply = "我把匣子放在席上，先不打开：开吧。开出一封写着堡里的事、写着苏丹进门的事，我明天就坐船去蒂多雷给外祖家做人质，这辈子不回来；开不出来，诸位往后见了我母亲，起身行礼。哥哥说：开。开到最后一封，什么也没有。那以后首领们见了母亲照样起身——可她已经不在宫里住了。"

[tracks.chapters.timeout]
next = "l3b"
effects = []
news = "特尔纳特的议事厅里吵了三天，吵的是一只信匣开还是不开。"

# l3b 底层的红蜡
[[tracks.chapters]]
key = "l3b"
title = "底层的红蜡"
text = "首领们的人也去了商馆。表姐那只乌木匣子摆在柜台上，两个人守着，等议事厅的人来开。表姐坐在账桌后面记她的账，一笔不错。柜台上的油灯亮着，她算盘打得很响，一声也没乱。看见我进门，她没抬头，只把笔在砚台边刮了刮：“小王子，他们要开的是蒂多雷来的信。底层那几封，不是蒂多雷来的。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1571, 4, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "mystic"
cast = ["kaicili"]
deadline = [1571, 12, 31]

[[tracks.chapters.choices]]
key = "burn"
text = "趁守匣的人走开，打开底层，一封不看全烧掉"
next = "l4"
effects = [{ kind = "flag", flag = "rw_kaicili_l_red_burned" }]
reply = "表姐把一把小铜钥匙推过来，推得很慢。守匣子的人去后院喝水，我打开底层，红蜡朝下，一封也没翻过来，一起塞进商馆的灶里。烧的时候有一股松脂和海水的味道。表姐一直在记账，等灶里没了声音，才把笔放下：“今天的账，记完了。”"

[[tracks.chapters.choices]]
key = "keep"
text = "把底层的信揣进怀里，带上自己的船"
next = "l4"
effects = [{ kind = "flag", flag = "rw_kaicili_l_red_kept" }]
reply = "我把底层那几封揣进怀里，红蜡贴着胸口，有点凉。守匣子的人回来开了匣，翻出来的全是蒂多雷的家常话和丁香的账。那几封信在我船上的舵位底下压了许多年，我一次也没拆。表姐后来只问过一回：“还在？”我说在。她说：“那就好。烧了，我就真的什么也没写过了。”"

[[tracks.chapters.choices]]
key = "open"
text = "说：让他们开，开出来我替你认"
next = "l4"
effects = [{ kind = "reputation", faction = "ternate", value = 1 }, { kind = "flag", flag = "rw_kaicili_l_red_opened" }]
reply = "议事厅的人来了，开了匣，开到底层，拆了一封红蜡的。念信的人念了两行，脸红了，看看表姐，又看看我，把信折上了。他回去跟首领们说，是女人家的话，写给谁没写名字。首领们笑了一阵，散了。表姐那天照常关了商馆的门。第二天，她把那只乌木匣子劈了，当柴烧了。"

[tracks.chapters.timeout]
next = "l4"
effects = []
news = "特尔纳特商馆那只装信的乌木匣子被议事厅的人开过，开出来的全是丁香账。"

[[tracks.chapters.variants]]
key = "rw_a_burn"
when = [{ kind = "flag", flag = "rw_kaicili_key_burn" }]
text = "首领们的人也去了商馆。表姐那只乌木匣子摆在柜台上，两个人守着，等议事厅的人来开。表姐坐在账桌后面记她的账，一笔不错。我脖子上那把小铜钥匙，挂了十五年，绳子换过三回。看见我进门，她没抬头，只把笔在砚台边刮了刮：“小王子，你答应过的。我没出事，可这也算一回事。”"

[[tracks.chapters.variants]]
key = "rw_b_ask"
when = [{ kind = "flag", flag = "rw_kaicili_key_ask" }]
text = "首领们的人也去了商馆。表姐那只乌木匣子摆在柜台上，两个人守着，等议事厅的人来开。表姐坐在账桌后面记她的账，一笔不错。结业那年我在信里说过，真到那一天，先在她床前问一句，寄还是烧。今天她不在床上，在账桌后面。她没抬头，只把笔在砚台边刮了刮：“小王子，你留的那条缝，今天用得上了。底层那几封，不是蒂多雷来的。”"

[[tracks.chapters.variants]]
key = "rw_c_returned"
when = [{ kind = "flag", flag = "rw_kaicili_key_returned" }]
text = "首领们的人也去了商馆。表姐那只乌木匣子摆在柜台上，两个人守着，等议事厅的人来开。表姐坐在账桌后面记她的账，一笔不错。结业那年，她托人把底层的钥匙捎给我，我原样寄了回去，说底层的信该由她自己寄。她一封也没寄。看见我进门，她没抬头，只把笔在砚台边刮了刮：“小王子，你说得对。今天你得替你那句话还账。”"

# l4 最后一封过海的信
[[tracks.chapters]]
key = "l4"
title = "最后一封过海的信"
text = "母亲在丁香园边的旧屋里住了快十年，眼睛不太好了，信还写，写得很慢，一封要写三天。六月，她让我替她送最后一封过海：蒂多雷的舅舅病重，外祖父早不在了，娘家只剩舅舅还记得她小时候的样子。信封好了，她不让我看，也不盖印，只在封口上画了一枝丁香。“你哥哥不许我过海，”她说，“他不许，我就不过。信替我过。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act3" }, { kind = "date", from = [1580, 6, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tender"
cast = ["kaicili"]
deadline = [1582, 5, 31]

[[tracks.chapters.choices]]
key = "deliver"
text = "不看，夜里划小船过海送到"
next = "l5"
effects = [{ kind = "reputation", faction = "tidore", value = 4 }, { kind = "flag", flag = "rw_kaicili_l_last_delivered" }]
reply = "我夜里过海，蒂多雷新堡的灯就在岸上，葡萄牙哨兵在墙头走来走去。舅舅躺在席子上，让人把信念给他听。念到一半，他抬手止住，说后面的他知道，不用念了。他让我回去告诉母亲：园子里那棵她小时候爬过的树，还在。"

[[tracks.chapters.choices]]
key = "read"
text = "船到海峡中间，拆开读了，再封回去"
next = "l5"
effects = [{ kind = "flag", flag = "rw_kaicili_l_last_read" }]
reply = "船到海峡中间，我拆了信。信里只写她这辈子记得的蒂多雷：哪一棵树，哪一口井，哪个侍女的笑声，写了两页，没有一句提特尔纳特，也没有一句提父亲。最后一行：哥哥，我没叛过他，也没叛过你们。我重新封好，在她画的那枝丁香旁边，替她补了一枝。"

[[tracks.chapters.choices]]
key = "brother"
text = "先去求哥哥，让母亲自己过海一趟"
next = "l5"
effects = [{ kind = "affinity", person = "babullah", value = 2 }, { kind = "flag", flag = "rw_kaicili_l_last_brother" }]
reply = "哥哥听完沉默了很久：“蒂多雷如今是葡萄牙人的码头。她过去，首领们会说什么？”我说首领们说什么，都比她见不着舅舅轻。哥哥说：“你开的价，总是别人付。”第二天他派了一条挂苏丹旗的船送母亲过海。她在蒂多雷住了三天，回来什么也没说，只带回一枝那边的丁香。"

[tracks.chapters.timeout]
next = "l5"
effects = []
news = "海峡对岸传来消息，蒂多雷苏丹家的一位老亲王病故了。"

[[tracks.chapters.variants]]
key = "rw_a_burned"
when = [{ kind = "flag", flag = "rw_kaicili_l_box_burned" }]
text = "母亲在丁香园边的旧屋里住了快十年，眼睛不太好了，信还写，写得很慢，一封要写三天，写完就烧，自从那年我替她烧了一匣子，她就再没留过一封。六月，她让我替她送最后一封过海：蒂多雷的舅舅病重，娘家只剩舅舅还记得她小时候的样子。这一封她没烧，封好了，不盖印，只在封口上画了一枝丁香。“你哥哥不许我过海，”她说，“他不许，我就不过。信替我过。”"

[[tracks.chapters.variants]]
key = "rw_b_opened"
when = [{ kind = "flag", flag = "rw_kaicili_l_box_opened" }]
text = "母亲在丁香园边的旧屋里住了快十年，眼睛不太好了，信还写，写得很慢，一封要写三天。那年匣子被当众开过以后，她换了一只新的，钥匙不离身。六月，她从新匣子里取出一封，让我替她送最后一封过海：蒂多雷的舅舅病重，娘家只剩舅舅还记得她小时候的样子。信不盖印，只在封口上画了一枝丁香。“你哥哥不许我过海，”她说，“他不许，我就不过。信替我过。”"

# l5 两半的约
[[tracks.chapters]]
key = "l5"
title = "两半的约"
text = "1586 年雨季，母亲病倒了。临走前一天，她让我把她箱底那只小匣子拿来。匣子里只有一封信，是写给我的，没封口。“这一封不用送，”她说，“你就在这儿看。”信是父亲死后那年写的，压了十六年，只一段话：那天早上你父亲出门前对我说，阿南达让我去，我就去。他说的时候在笑。我读完抬头，她已经闭上了眼睛，第二天早上没再醒来。"
when = [{ kind = "flag", flag = "c13_main_kaicili_act3" }, { kind = "date", from = [1586, 6, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]

[[tracks.chapters.choices]]
key = "tidore"
text = "把她送过海，葬在蒂多雷，坟朝着特尔纳特"
next = "done"
effects = [{ kind = "reputation", faction = "tidore", value = 5 }, { kind = "flag", flag = "rw_kaicili_l_end_tidore" }]
reply = "她没说要葬在哪里，可这些年她坐在旧屋门口，脸总朝着海峡那边。我去跟侄子、如今的苏丹说了，他年轻，去问首领们，首领们不出声。我自己备了船。蒂多雷的舅家在坡上给她留了一块地，坟头朝北，正对着海峡这边的火山。下葬那天，两岸的码头上都站着人，谁也没过海。"

[[tracks.chapters.choices]]
key = "grove"
text = "葬在丁香园边，她住了十几年的旧屋后头"
next = "done"
effects = [{ kind = "reputation", faction = "ternate", value = 3 }, { kind = "flag", flag = "rw_kaicili_l_end_grove" }]
reply = "我把她葬在丁香园边，她住了十几年的旧屋后头，不进宫里的坟地，也不在父亲旁边。坟头朝着海峡。蒂多雷的舅家派了一条船来，船上的人没上岸，在海峡中间停了一会儿，往水里撒了一把丁香，就回去了。"

[[tracks.chapters.choices]]
key = "letter"
text = "把那封信放进她手里，一起下葬"
next = "done"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "flag", flag = "rw_kaicili_l_end_letter" }]
reply = "我把那封信折好放进她手里，合上她的手指。信上那段话，我念到能背了才放下。她这辈子烧了那么多封信，留下的这一封，就让它跟着她。下葬那天我念了班顿的上半句：两座山中间一道海，海上的船不挂帆。下半句我没念，她知道。"

[[tracks.chapters.variants]]
key = "rw_a_confessed"
when = [{ kind = "flag", flag = "rw_kaicili_l_confessed" }]
text = "1586 年雨季，母亲病倒了。临走前一天，她让我把她箱底那只小匣子拿来。匣子里只有一封信，是写给我的，没封口。“这一封不用送，”她说，“你就在这儿看。”信是父亲死后那年写的，压了十六年。那年灶前我告诉过她，劝父亲去的人是我；原来她在那以前就知道。信上只一段话：那天早上你父亲出门前对我说，阿南达让我去，我就去。他说的时候在笑。我读完抬头，她已经闭上了眼睛，第二天早上没再醒来。"

[[tracks.chapters.variants]]
key = "rw_b_hid"
when = [{ kind = "flag", flag = "rw_kaicili_l_hid" }]
text = "1586 年雨季，母亲病倒了。临走前一天，她让我把她箱底那只小匣子拿来。匣子里只有一封信，是写给我的，没封口。“这一封不用送，”她说，“你就在这儿看。”信是父亲死后那年写的，压了十六年。那年灶前我对她说，父亲谁也没问。信上只一段话：那天早上你父亲出门前对我说，阿南达让我去，我就去。他说的时候在笑。她一直知道，一直没说破我。我读完抬头，她已经闭上了眼睛，第二天早上没再醒来。"

# ── 增写（2026-11-12）·旁轨「最后一拍」：老船长乌马尔从围城到 1585 年海峡里的最后一趟，3 章（r1—r3）。
# 母本：最初的战士（老将死在最后一仗的船上）；葡萄牙人的福斯塔用锁着的人划桨。文化：科拉科拉的同桨同命；张力：他最知道敌人的船，也最恨；他的秘密（被锁着划过两年桨）
#   到洗身时才从手腕、脚踝的疤上露出来，正文不替他说破。乌马尔在主线 c03（1582）仍在凯奇利身边，所以他死在 1585 年西班牙人第二次来攻时（与 c08 同一季）。
# 入口：r1、r2 读 _act2；r3 读 _act3。终章 r3 的选项 next = done。读：rw_kaicili_dream_drum（养成 u1）、rw_kaicili_bench_named（养成 u6）；设：rw_kaicili_r_*。
[[tracks]]
key = "main_kaicili_rw_oar"
name = "最后一拍"
kind = "main"
start = "r1"
auto = true
cast = ["kaicili"]

# r1 认得这种船
[[tracks.chapters]]
key = "r1"
title = "认得这种船"
text = "八月，马六甲派来一条福斯塔，想趁夜摸进堡下的小码头，给堡里送火药。老船长七十一了，非要上头一条科拉科拉。福斯塔窄长，跑得快，我们追了半夜也追不上。老船长坐在船尾，听了一会儿对面的桨声，忽然低声数起来，数的是我十二岁那年在马基安的湾里，半夜听见过的那几个字。数到第八，他说：“它要转了。贴左边。”"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1571, 8, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "tense"
cast = ["kaicili"]
deadline = [1572, 12, 31]

[[tracks.chapters.choices]]
key = "left"
text = "照他说的，贴左边上去"
next = "r2"
effects = [{ kind = "reputation", faction = "ternate", value = 4 }, { kind = "reputation", faction = "portugal", value = -3 }, { kind = "flag", flag = "rw_kaicili_r_fusta_taken" }]
reply = "它转的那一刻，左边一排桨停在半空，我们的船头正好顶了上去。福斯塔上的葡萄牙人放了两枪，就举了手。老船长第一个跳过船舷，不去抢火药，弯着腰往桨座底下钻，摸到那根长杆，一把抽了出来。一排锁着的人一起站了起来。"

[[tracks.chapters.choices]]
key = "ask"
text = "先问他：您数的是什么话"
next = "r2"
effects = [{ kind = "flag", flag = "rw_kaicili_r_count_asked" }]
reply = "“他们的话。”他头也不回，“鞭子落在第八下，第八下以后左边停桨。问完了？贴左边！”等我们贴上去，福斯塔已经转过了一半，船尾擦着我们的船头过去，火药没送进堡，人也没抓着。回港的路上他一句话也不说，下船时才说：“问得不是时候，可问得对。”"

[[tracks.chapters.choices]]
key = "idris"
text = "让伊德里斯的船去贴，我在外头堵"
next = "r2"
effects = [{ kind = "reputation", faction = "ternate", value = 3 }, { kind = "flag", flag = "rw_kaicili_r_idris_closed" }]
reply = "伊德里斯的船像一条鱼一样贴了上去，正贴在福斯塔停桨的那一边。他第一个跳过去，克里斯拔在手里。等我的船靠上来，甲板上已经倒了两个葡萄牙人。老船长在桨座底下摸到那根长杆，抽了出来，锁着的人一个接一个站起来，站不稳，扶着桨。伊德里斯回头看着老船长，看了很久。"

[tracks.chapters.timeout]
next = "r2"
effects = []
news = "特尔纳特堡下的人说，马六甲来的一条福斯塔夜里在海峡里被科拉科拉追了半夜。"

# r2 桨座上的人
[[tracks.chapters]]
key = "r2"
title = "桨座上的人"
text = "从那条福斯塔上解下来的二十四个人，有爪哇的、望加锡的、班达的，还有三个从很远的西边来的黑皮肤的人，脚踝上都是一圈发白的印子，一指宽。老船长给他们一个一个洗脚，洗得很慢，用的是他自己手腕上解下来的布条。我第一次看清他手腕上那两圈疤，跟那些人脚踝上的一模一样。首领们说，这些人要么编进桨手，要么卖到望加锡去。"
when = [{ kind = "flag", flag = "c13_main_kaicili_act2" }, { kind = "date", from = [1572, 2, 1] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]
deadline = [1573, 12, 31]

[[tracks.chapters.choices]]
key = "free"
text = "替他们开价：不编不卖，等季风送回各自的岛"
next = "r3"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "ternate", value = -2 }, { kind = "flag", flag = "rw_kaicili_r_freed" }]
reply = "首领们说围城正缺人手。我说缺人手就雇，照桨手的价给工钱；不愿意划的，等西风起了，搭丁香船回家。老船长一直蹲着洗脚，没抬头。那天晚上他来找我，头一回没叫我小桨手，叫了我的名字，只叫了一声，什么也没说，就走了。"

[[tracks.chapters.choices]]
key = "enroll"
text = "听首领们的，编进围城的桨手"
next = "r3"
effects = [{ kind = "reputation", faction = "ternate", value = 4 }, { kind = "flag", flag = "rw_kaicili_r_enrolled" }]
reply = "他们编进了围城的船。老船长没反对，只提了一个条件：这二十四个人的桨位由他排，谁也不许站在他们背后。头一回操练，那三个西边来的人怎么也合不上我们的拍子，老船长就让鼓手停下，自己用嘴唱，一句一句，唱到他们合上为止。"

[[tracks.chapters.choices]]
key = "ask"
text = "问老船长：您说怎么办"
next = "r3"
effects = [{ kind = "flag", flag = "rw_kaicili_r_asked_umar" }]
reply = "他把最后一只脚洗完，拧干布条，缠回自己的手腕，缠得很慢。“问他们自己，”他说，“有人问过了，他们才知道自己是人。”我们一个一个问：十一个要回家，九个留下划桨，还有四个不说话，只看着老船长。老船长说：那这四个，跟我。"

[tracks.chapters.timeout]
next = "r3"
effects = []
news = "特尔纳特人说，围城的船上多了二十几个外岛来的桨手，老船长亲自排的桨位。"

[[tracks.chapters.variants]]
key = "rw_drum"
when = [{ kind = "flag", flag = "rw_kaicili_dream_drum" }]
text = "从那条福斯塔上解下来的二十四个人，有爪哇的、望加锡的、班达的，还有三个从很远的西边来的黑皮肤的人，脚踝上都是一圈发白的印子，一指宽。老船长给他们一个一个洗脚，洗得很慢，用的是他自己手腕上解下来的布条。我第一次看清他手腕上那两圈疤，跟那些人脚踝上的一模一样。十二岁那年，我在马基安的湾里半夜敲鼓，把他从梦里的数里拉了回来；我那时不知道，他梦见的是哪一条船。首领们说，这些人要么编进桨手，要么卖到望加锡去。"

# r3 最后一拍
[[tracks.chapters]]
key = "r3"
title = "最后一拍"
text = "三月，马尼拉的西班牙船带着蒂多雷的科拉科拉又来了，在海峡里排开。老船长八十五了，走路要人扶，那天早上却自己走到码头，在头一条船的鼓手位子上坐下，谁劝也不起来。他说不划了，只数。船出了港，他敲下第一下鼓，声音不大，两排桨一齐落下去，落得比我听过的哪一回都齐。敲到不知第几下，鼓声停了。他靠在鼓上，手还举着鼓槌。"
when = [{ kind = "flag", flag = "c13_main_kaicili_act3" }, { kind = "date", from = [1585, 3, 15] }]
at = "ternate_port"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]

[[tracks.chapters.choices]]
key = "wash"
text = "回港以后，亲手替他洗身"
next = "done"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_r_washed" }]
reply = "照规矩，我和两个老桨手替他洗身。解开手腕的布条，那两圈疤露出来；洗到脚，脚踝上也是两圈，比手腕上的深。一个老桨手低声说：他从没在人前脱过鞋。我们用白布把他裹好，谁也没再说话。他腕上那几根布条，我洗净晒干，收进了他父亲那只罗盘的木盒里。"

[[tracks.chapters.choices]]
key = "beat"
text = "从他手里接过鼓槌，接着往下敲"
next = "done"
effects = [{ kind = "reputation", faction = "ternate", value = 6 }, { kind = "flag", flag = "rw_kaicili_r_beat_on" }]
reply = "我没让船回头，从他手里接过鼓槌。他的手指很容易就松开了，像早就等着。我接着他停下的那一拍往下敲，两排桨没乱。那天海峡里没有一条西班牙船靠上岸。回港以后我才放下鼓槌，桨手们一个一个过来，摸一下他的鼓，再上岸。"

[[tracks.chapters.choices]]
key = "table"
text = "把他那张桨位表放回他怀里，一起下葬"
next = "done"
effects = [{ kind = "growth", attr = "honor", value = 200 }, { kind = "flag", flag = "rw_kaicili_r_table_buried" }]
reply = "他的桨位表还揣在怀里，三十多年改过不知多少遍，最新的一张，每一排都留着空格。我们把他葬在码头后面的坡上，听得见桨声的地方。下葬前我把那张表重新叠好，放回他胸口。表上第三列那一格，还是那个样子。"

[[tracks.chapters.variants]]
key = "rw_named"
when = [{ kind = "flag", flag = "rw_kaicili_bench_named" }]
text = "三月，马尼拉的西班牙船带着蒂多雷的科拉科拉又来了，在海峡里排开。老船长八十五了，走路要人扶，那天早上却自己走到码头，在头一条船的鼓手位子上坐下，谁劝也不起来。他怀里揣着那张轮值表，第三列那一格，还是我结业那年自己写回去的名字。他说不划了，只数。船出了港，他敲下第一下鼓，两排桨一齐落下去，落得比我听过的哪一回都齐。敲到不知第几下，鼓声停了。他靠在鼓上，手还举着鼓槌。"
