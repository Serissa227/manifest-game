next = "b06_limahong"
effects = [{ kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "portugal", value = 6 }, { kind = "affinity", person = "babullah", value = -6 }, { kind = "flag", flag = "c13_main_kaicili_fed_fort" }]
