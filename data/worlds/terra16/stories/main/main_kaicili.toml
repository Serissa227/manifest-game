# c02：同一个国王的船。见证章，没有选项。变体：八英镑的热病前一个月，凯奇利的丁香园先撤了。
[[tracks.chapters]]
key = "c02_first_spanish"
title = "同一个国王的船"
text = "海峡对面蒂多雷的新石堡下，停进了几条从马尼拉来的西班牙船。从特尔纳特的山坡上看过去，两家的旗挂在同一根桅杆上。哥哥老了，咳嗽，坐在山坡上的竹棚里看海，手里拄着那根雕着科拉科拉的拐杖。“以前是两只狗抢一根骨头。”他说，“现在是一个主人牵着两只狗。”我看着那根桅杆，心里想：外祖父的岛上，又多了一面旗。几周以后，营里传出热病，西班牙人一个个被抬上船。"
