effects = [{ kind = "flag", flag = "c13_main_kaicili_burned_cloves" }, { kind = "reputation", faction = "spain", value = -6 }, { kind = "reputation", faction = "ternate", value = -2 }]
reply = "北坡烧了两天，烟一直飘到蒂多雷。西班牙人看着烟，问通事这是什么意思；通事说，岛上的人宁可烧掉，也不卖给你们。他们当月就走了。"
check = { attr = "resolve", base = 20, per = 7 }
fail = { next = "c09_nutmeg", effects = [{ kind = "reputation", faction = "ternate", value = 2 }], news = "特尔纳特北坡有人说，苏丹的叔叔举着火把站在丁香树前，停了很久，最后把火把插进了土里。" }

# c09：肉豆蔻的秤。班达长老把秤递过来：谁拿秤，谁就说了算。
[[tracks.chapters]]
key = "c09_nutmeg"
title = "肉豆蔻的秤"
text = "班达奈拉的晒场，肉豆蔻衣摊在竹席上，红得刺眼。长老们请特尔纳特出面护岛：葡萄牙人、西班牙人、爪哇人都来买，价一年三变。他们愿意只卖给特尔纳特的船，换特尔纳特的科拉科拉护航。价由谁来定，他们没说，只把晒场边上那杆老秤推到我面前。秤砣是一块磨圆了的火山石。晒场那头一个年轻的种树人喊：“我们的价，凭什么要别人来定？”长老把秤杆递过来：“秤在谁手里，价就是谁的。你拿着吧。”父亲最恨别人替他定价，现在轮到我替别人定。我接过秤杆，又想放下。"
speaker = "captain"
mood = "tender"
at = "banda_neira"
cast = ["kaicili"]
when = [{ kind = "date", from = [1585, 7, 1] }]
deadline = [1587, 12, 31]
news = "班达奈拉的晒场上，长老们把秤杆递给了特尔纳特苏丹的叔叔，他接过去，看了很久。"

[tracks.chapters.timeout]
next = "c10_seventy_two"
effects = []
news = "班达奈拉的长老们等了两年，特尔纳特的人没来拿秤，肉豆蔻的价照旧一年三变。"

