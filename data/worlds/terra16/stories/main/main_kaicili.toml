# c07：雨里的国书。目标：在里斯本找到特尔纳特来的使者。
[[tracks.chapters]]
key = "c07_lisbon"
title = "雨里的国书"
text = "里斯本的雨下个没完，河岸边一间租来的小屋，屋里晾着一件湿透的金丝头巾。使者凯奇利·奈克捧着国书，马来文一份，通事译的葡萄牙文一份，等了大半年，答复一拖再拖。国王在马德里。国书里把赶走葡萄牙人写成“让他们平安离岛”，那条英格兰船的事，一个字也不能提。“你会说马来话？好，好！这城里我只能跟通事说话，他们译的我只信一半。”他见到同乡，先问的是摩鹿加的消息：“小王子——不，殿下，苏丹好吗？”我手里的信说，苏丹去年七月走了。"
speaker = "captain"
mood = "sad"
at = "lisbon"
cast = ["kaicili_naik"]
objectives = [{ kind = "person", person = "kaicili_naik", text = "在里斯本找到特尔纳特来的使者" }]
deadline = [1584, 12, 31]
news = "里斯本码头的人说，香料群岛来的使者在雨里站了一整天，身边多了一个戴金丝头巾的同乡。"

[tracks.chapters.timeout]
