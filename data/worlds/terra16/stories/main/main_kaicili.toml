# c06：迟到的信。巴布拉已经不在了，侄子的信追上了他。
[[tracks.chapters]]
key = "c06_brother"
title = "迟到的信"
text = "一封信经马六甲、果阿一站一站追上我，信封上的蜡封裂了，里面夹着一枝压扁的丁香。字是侄子赛义德写的：“叔叔，父亲去年七月走了，葬在祖父旁边。”信里写着：“父亲说，等叔叔回来，把拐杖交给你。”送信的人问要不要回信，我说：“不回了。”我把那枝丁香拿在手里，它已经压得没有形状。我心里想：他说他等得起。我信了。我手里第一次没有可以开价的东西。"
speaker = "captain"
mood = "sad"
cast = ["kaicili"]
when = [{ kind = "date", from = [1584, 3, 1] }]

[[tracks.chapters.variants]]
key = "hand"
when = [{ kind = "flag", flag = "c13_main_kaicili_stance_hand" }]
text = "一封信经马六甲、果阿一站一站追上我，信封上的蜡封裂了，里面夹着一枝压扁的丁香。字是侄子赛义德写的：“叔叔，父亲去年七月走了，葬在祖父旁边。”信里还说，弟弟留在枕边的那枝丁香，哥哥一直攥在手里。信的末尾写着：“父亲说，等叔叔回来，把拐杖交给你。”送信的人问要不要回信，我说：“不回了。”我把那枝丁香拿在手里，它已经压得没有形状。我心里想：他说他等得起。我信了。"

