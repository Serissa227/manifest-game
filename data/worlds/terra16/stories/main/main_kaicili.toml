text = "特尔纳特海滩，季风转向前的闷热天。葡萄牙人从马六甲运来几门铜炮，正往科拉科拉的船头上绑。堡里的葡萄牙人这回求的是苏丹：西班牙人在宿务立了木堡，抢的是两家共同的丁香路。父亲答应出十五条船，由巴布拉领。父亲坐在堡门外的凉棚下，对堡里来的人笑着行礼。“葡萄牙人借我们的船打西班牙人，我借葡萄牙人的炮守我们的丁香。谁也不吃亏。”哥哥在船头拍了拍炮身：“你去不去？去，就坐我的船尾，帮我数西班牙人的营火。”今年的丁香正在树上转红，没人采就要烂在枝上。我看着父亲那张笑脸，他袖口里的手一下一下掐着指节，在数船。"
