key = "a_antonio"
when = [{ kind = "flag", flag = "h52_iberian_union_antonio_rules_portugal" }]
text = "海峡对面蒂多雷的新石堡下，西班牙人的船进不了港。堡里的葡萄牙人不肯和马尼拉的人同挂一面旗，两家的船隔着港口互相不理。哥哥老了，咳嗽，坐在竹棚里看海，拐杖上的科拉科拉磨得发亮。“两只狗还是两只狗，只是都想咬我们。”他说。堡墙上有人喊：“同一面旗，不是同一条船。”西班牙人单独上岸，热病一来，没过两个月就走了。"

[[tracks.chapters.variants]]
key = "b_warned"
when = [{ kind = "flag", flag = "c13_main_kaicili_manila_news" }]
text = "海峡对面蒂多雷的新石堡下，停进了几条从马尼拉来的西班牙船。从特尔纳特的山坡上看过去，两家的旗挂在同一根桅杆上。哥哥老了，咳嗽，坐在竹棚里看海，手里拄着那根雕着科拉科拉的拐杖。“以前是两只狗抢一根骨头。”他说，“现在是一个主人牵着两只狗。”修士说漏的那句话，我记了几年。西班牙船进港前十天，我把丁香园里的人和筐都撤上了山，船上的人上岸，只看见空席子。"

# c03：开错季节的丁香。召请。信物是回忆，不是物品；超时默认立场为 close。
[[tracks.chapters]]
key = "c03_summons"
title = "开错季节的丁香"
text = "一个没风的夜里，我打开棋盒，取出底下压着的那枝丁香。它是出海那年从家里带走的，晒干了许多年。今夜它冒出了一点青：干了的花苞，不该再发芽。我把它举到灯下，花苞朝着西边。老船长说，阿佛的精灵会叫人把什么带到很远的地方去，比果阿还远，比里斯本还远，远到“柱子外面”。哥哥躺在竹床上，听完说：“去吧。我等得起。”老船长（转述）：“干了的丁香发青，是有人在很远的地方叫它。”我念班顿的上半句：西风吹过特尔纳特，丁香香到海那边。我第一次想去一个没有价的地方，像万象的那尊佛。"
speaker = "captain"
mood = "mystic"
night = true
cast = ["kaicili"]
when = [{ kind = "date", from = [1582, 6, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_kaicili_stance_close" }]

[[tracks.chapters.variants]]
key = "afo"
when = [{ kind = "flag", flag = "c13_main_kaicili_afo" }]
text = "一个没风的夜里，我打开棋盒，取出底下压着的那枝丁香。它是出海那年从家里带走的，晒干了许多年。今夜它冒出了一点青：干了的花苞，不该再发芽。棋盒里还有那包阿佛的种子，芭蕉叶下面有一粒裂开了口。我把丁香举到灯下，花苞朝着西边。老船长说，阿佛的精灵会叫人把什么带到很远的地方去，远到“柱子外面”。哥哥躺在竹床上，听完说：“去吧。我等得起。”老船长（转述）：“干了的丁香发青，是有人在很远的地方叫它。”我念班顿的上半句：西风吹过特尔纳特，丁香香到海那边。"

[[tracks.chapters.choices]]
key = "open"
text = "带上这枝丁香去：雾该散开，丁香本来就该谁都买得到"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_kaicili_keepsake" }, { kind = "flag", flag = "c13_main_kaicili_stance_open" }]
reply = "我把丁香包进一块蜡染布，贴身放好。启程那天哥哥让人把拐杖递给我，我没接：“回来再还你。”说完才想起，这句话是谁对谁说过的。"

[[tracks.chapters.choices]]
key = "close"
text = "带上这枝丁香去：雾里有雾里的人，就像岛上有岛上的价"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_kaicili_keepsake" }, { kind = "flag", flag = "c13_main_kaicili_stance_close" }]
reply = "我把丁香插在头巾的金丝里。老船长替我算好了季风：先到马六甲，再搭葡萄牙人的船过好望角。我笑着说，这是我这辈子头一回求葡萄牙人带路。"

[[tracks.chapters.choices]]
key = "hand"
text = "把丁香留在哥哥枕边，空手去：谁守得住，就交给谁"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_kaicili_stance_hand" }]
reply = "我把那枝发青的丁香放在哥哥的枕头边。哥哥闭着眼说：“你把岛留给我，我把丁香留给你，等你回来再换。”"

# c04：海草里的丁香。1583 汇合。罗经的针停下来，指的是贴身放丁香的那一侧。
[[tracks.chapters]]
key = "c04_dark_sea"
title = "海草里的丁香"
text = "特塞拉岛的安格拉港，西班牙的大舰队围着岛，港里挤满了逃难的小船。往西一天的海上，海草铺成一片黄褐色的草原，风停了，罗经的针在碗里打转。安格拉的渔夫拉住我的船帮：“再往西，海草就长到船底下了，没有人回来说过那边是什么。”我离家最远，闻到的却是丁香的味道，从雾的那一边飘过来。贴身那块蜡染布里包着丁香。罗经的针停了一下，又转。船尾的舵手啐了一口：“针不停，就说明路还没定。”我心里想：离家最远的地方，闻起来像家。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["kaicili"]
speaker = "captain"
mood = "mystic"
news = "安格拉的渔夫说，西边的海草今年长到了港口外，罗经的针在那片水上转个不停。"

[tracks.chapters.default]
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_kaicili_absent" }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]

[[tracks.chapters.variants]]
key = "no_sprig"
when = [{ kind = "flag", flag = "c13_main_kaicili_keepsake", value = false }]
text = "特塞拉岛的安格拉港，西班牙的大舰队围着岛，港里挤满了逃难的小船。往西一天的海上，海草铺成一片黄褐色的草原，风停了。我没有带丁香，只有罗经碗里一根停不下来的针。安格拉的渔夫拉住我的船帮：“再往西，海草就长到船底下了，没有人回来说过那边是什么。”针停了一下，又转，最后停住，指的是西边。舵手在船尾问：“往西，还是回头？”我心里想：离家最远的地方，我身上没有带着家的味道。"

[[tracks.chapters.choices]]
key = "cross"
text = "照着那片翠玉抄片上断了的一句，往雾里开"
next = "c05_after"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "你手里没有能在雾里认路的东西，罗经只会打转。"
effects = [{ kind = "flag", flag = "c13_main_kaicili_crossed" }, { kind = "memory", memory = "mem-main_kaicili-c04", title = "海草里的丁香" }]
reply = "我把船头对准针停的方向，海草从船底下滑过去，声音像有人在念经。雾合上的时候，我回头看了一眼安格拉的火光，然后不再回头。"
news = "安格拉的渔夫说，有一条摩鹿加的长船往西开进了海草里，再没看见回来。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头：离家最远的地方，到这里就够了"
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_kaicili_turned_back" }, { kind = "memory", memory = "mem-main_kaicili-c04", title = "海草的边上" }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]
reply = "我让桨手倒划，船慢慢退出海草。针还在转，我把罗经碗用布盖上。回安格拉的路上，我一句话也没说，只把贴身的东西拿出来看了一眼，又收好。"

[[tracks.chapters.choices]]
key = "ferry_back"
text = "掉头回安格拉，把船借给逃出特塞拉岛的人"
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_kaicili_turned_back" }, { kind = "growth", attr = "honor", value = 300 }, { kind = "reputation", faction = "spain", value = -4 }, { kind = "reputation", faction = "portugal", value = 3 }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]
reply = "我的科拉科拉吃水浅，能贴着礁石走，西班牙的大船追不进来。我来回载了三趟渔夫和他们的老婆孩子，送到圣米格尔岛的背面。最后一趟，一个孩子问我为什么往西边来，我说：“来看看海草。”"

# c05：又干了的丁香。回响章，读 C11 的 atlantis 旗标。
[[tracks.chapters]]
key = "c05_after"
title = "又干了的丁香"
text = "秋天，我在一条往南的葡萄牙船上，海草和雾都在身后了。雾没有开，或者我没有进去。船上的人问我去西边做什么，我笑着说去卖丁香，没卖出去。那枝丁香若带着，早已干回去了，青色没了，只剩香。葡萄牙水手凑过来：“你们岛上的人，也往柱子外面跑？”我说：“我们岛上的人，哪里有价就往哪里跑。这回没有价。”我想把看见的东西说给一个人听。想来想去，想听的是哥哥。"
speaker = "captain"
mood = "tender"
cast = ["kaicili"]
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_kaicili_atlantis_over" }]

