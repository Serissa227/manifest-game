reply = "舅舅家的统领是我小时候在蒂多雷宫里一起玩过的表兄，两人在船头嚼了一夜槟榔。第二天蒂多雷的船没动，西班牙人孤零零地攻了一回，退了。"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "c09_nutmeg", effects = [{ kind = "reputation", faction = "tidore", value = 2 }], news = "表兄听完只说了一句：“外祖父当年要的马基安，你们还没给。”第二天蒂多雷的船照样跟着冲，只是冲得不快。" }

[[tracks.chapters.choices]]
