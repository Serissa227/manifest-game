key = "v10_naha_envoy"
when = [{ kind = "flag", flag = "c12_voyage_custom_naha_envoy" }]
text = "外港的石码头晒得发烫，远处三道环墙闪着铜色的光。守庙里最年轻的伊斯梅妮带着两个持杖的人走下台阶，先问来意，不问王名。码头上的小镇各说各话，古葡萄牙语、拉丁语，还夹着一种“我”听不出来的调子。一个小贩在台阶下卖晒干的鱼，没人买；台阶上的盐花被太阳晒得发白。她没有去看货箱，只看“我”的手。“外面的人上岸，先说来意，再说名字。王的名字，留到后头。”她停了停，又问：“身上有没有从家里带来的东西？”贴身的口袋里有一块岛间通行凭记，木札上刻着几道线。伊斯梅妮摸着那些刻痕，没有说话。我想：她问的是家里的东西，不是船上的货。"

