# 自由船长·亚特兰蒂斯补章（暂存，故事 2.0，A5 / E37 契约，C13 第九批）
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_free_atlantis_over，主线“那以后”章 c04_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
# 标签：自由船长补章；主角是玩家自创的船长（speaker = captain）。“我”不写性别、外貌与名字，别人称呼“船长”或“外面来的人”。
# 轨道：main_free_atlantis（kind = main，auto = true，start = at1_outer_harbor），三章：at1 外港的女祭司 → at2 熄了火的黑暗里 → at3 各说各话的小镇。
# 依据：
#   史实与古典——柏拉图《克里提亚斯篇》的环城、山铜柱上刻的律法、熄了火的夜里十王在柱前审判；只从人物嘴里、柱子与码头的告示上透出来，不开历史课。
#   原创——伊斯梅妮（cast/story_atlantic.toml，1564 年生，最年轻的“克莱托”）；外港的小镇与三位漂流者（七城主教的后人、圣布伦丹的修士、里斯本冒险者的后代）；“回去的路”这个母题。
#   待核：无。
# 暂存：A8 的 E63（atlantis_port 帷幕与可达）与 C11 第二轮（atlantis_council 轨道、atlantis_council_met、atlantis_verdict_*）合进来以前，整合方不登记本文件。
#       不登记时主线照样完整；at1 的期限 1584-12-31 到了，轨道静默失败，不写见闻。
# 读的旗标：
#   c13_main_free（门槛，main_free a00 的 default 设）；c13_main_free_crossed（main_free c03 的穿过分支设，at1 的 when）；
#   c13_main_free_keepsake（main_free c02 设，at1 的交出选项门槛）；c13_main_free_new_star（main_free b01 设，at2 的星位选项门槛）；
#   c12_voyage_custom_*（12 个模板，at1 的模板变体）；c13_free_seville_pilot_quadrant_given、c13_free_basque_whaling_knife_left、c13_free_istanbul_shipyard_receipt_given（at1 的先交出变体）；
#   atlantis_council_met、atlantis_verdict_close、atlantis_verdict_open（C11，at2 的变体）。
# 设的旗标：c13_main_free_atlantis_asked / _named / _offered（at1）；c13_main_free_atlantis_spoke / _star（at2）。
# 禁区：不写精灵的来历；不写判决内容；不写龙骑士团与长生。
# HIST 占位：无。
# 回忆插画清单（mem-* 与画面）：
#   mem-main_free_atlantis-at1 交到她手里的那样东西：烫脚的石码头上，年轻的女祭司双手接过船长递来的一样旧物，身后是铜色的环墙。
#   mem-main_free_atlantis-at2 黑暗里的外圈：熄了火的神庙里，十个模糊的身影围着发微光的铜柱，船长站在靠门的外圈。
#   mem-main_free_atlantis-at3 各说各话的小镇：山铜城墙下的小镇，几个穿旧式衣服的漂流者围着船长，一个老妇人在膝上铺开海图。

[[tracks]]
key = "main_free_atlantis"
name = "柱外的港"
kind = "main"
start = "at1_outer_harbor"
auto = true

# at1：外港的女祭司。普通章，at = atlantis_port，期限 1584-12-31，超时静默失败（不写见闻）。
[[tracks.chapters]]
key = "at1_outer_harbor"
title = "外港的女祭司"
text = "外港的石码头晒得发烫，远处三道环墙闪着铜色的光。守庙里最年轻的伊斯梅妮带着两个持杖的人走下台阶，先问来意，不问王名。码头上的小镇各说各话，古葡萄牙语、拉丁语，还夹着一种“我”听不出来的调子。一个小贩在台阶下卖晒干的鱼，没人买；台阶上的盐花被太阳晒得发白。她没有去看货箱，只看“我”的手。“外面的人上岸，先说来意，再说名字。王的名字，留到后头。”她停了停，又问：“身上有没有从家里带来的东西？”我想：她问的是家里的东西，不是船上的货。"
at = "atlantis_port"
cast = ["ismene"]
speaker = "captain"
mood = "mystic"
night = false
when = [{ kind = "flag", flag = "c13_main_free" }, { kind = "flag", flag = "c13_main_free_crossed" }]
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_over" }]

[[tracks.chapters.choices]]
key = "offer"
text = "把从家里带出来的那样东西交到她手里"
next = "at2_council"
requires = [{ kind = "flag", flag = "c13_main_free_keepsake" }]
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_offered" }, { kind = "memory", memory = "mem-main_free_atlantis-at1", title = "交到她手里的那样东西" }]
hint = "你把家里的那样东西留在了岸上，手伸进箱子，摸到的只有海图。"
news = "外港的石码头上，外来的船长把一样旧东西交给女祭司，她看过，又还了回来。"
reply = "伊斯梅妮看过以后，把它还给“我”：“它认得你，就够了。”她领“我”走上台阶。"

[[tracks.chapters.choices]]
key = "name"
text = "只报上自己的名字和出海的港口"
next = "at2_council"
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_named" }]
news = "外港的码头上，一个外来的船长报了出海的港口，女祭司把那个名字念得走了样，漂流者在旁边笑。"
reply = "她把那个港口的名字念了两遍，念得走了样，旁边一个漂流者替她纠正。她笑了一下，侧身让开台阶：“进来吧。”"

[[tracks.chapters.choices]]
key = "ask"
text = "先问她神庙里刻着的是哪一条律法"
next = "at2_council"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_asked" }]
news = "外港的女祭司背出一条律文，说外来的船不许带铁进内港，有个船长回头看了看停在外海的船。"
reply = "她背了一句律文：外来的船不许带铁进内港。“我”回头看了一眼自己船上的锚，没有说话。"
fail = { next = "at2_council", effects = [{ kind = "flag", flag = "c13_main_free_atlantis_named" }], news = "外港的女祭司不爱答问，外来的船长问起神庙里的律法，她只回了一句：等见到柱子再问。" }

[[tracks.chapters.variants]]
key = "v00a_seville_given"
when = [{ kind = "flag", flag = "c13_free_seville_pilot_quadrant_given" }]
text = "外港的石码头晒得发烫，远处三道环墙闪着铜色的光。守庙里最年轻的伊斯梅妮带着两个持杖的人走下台阶，先问来意，不问王名。码头上的小镇各说各话，古葡萄牙语、拉丁语，还夹着一种“我”听不出来的调子。一个小贩在台阶下卖晒干的鱼，没人买；台阶上的盐花被太阳晒得发白。她没有去看货箱，只看“我”的手。“外面的人上岸，先说来意，再说名字。王的名字，留到后头。”她停了停，又问：“身上有没有从家里带来的东西？”行囊里压着一张拆了蜡的考题纸。伊斯梅妮读了题，轻声说：这道题在这里也没人答得出。我想：她问的是家里的东西，不是船上的货。"

