# at2：熄了火的黑暗里。普通章，at = atlantis_port，期限 1585-06-30，超时进入 at3（静默，不写见闻）。
# 这一章不写 when：at1 结算后立即进入，玩家在外港就弹出。
[[tracks.chapters]]
key = "at2_council"
title = "熄了火的黑暗里"
text = "夜里，神庙里的火一盏盏熄了。十个穿深蓝长袍的人围着刻律法的山铜柱坐下，外面来的人站在外圈。柱脚边有一只金杯，杯里的牛血黑得映不出一点光。山铜柱上的字被手摸得发亮，靠门的那一段最旧，刻痕里积着灰，指甲划过去是钝的。黑暗里一阵一阵地呼吸，没有人出声。伊斯梅妮把“我”领到靠门的位置，低声说：“把誓词读完，再碰那根柱子。”黑暗里有一个王问：“你没有国王。那你替谁说话？外面的海，是谁的？”我想：替船上那几十个人说，也替这些年见过的港口说。"
at = "atlantis_port"
cast = ["ismene"]
speaker = "captain"
mood = "mystic"
night = false
deadline = [1585, 6, 30]

[tracks.chapters.timeout]
next = "at3_drifters"

[[tracks.chapters.choices]]
key = "speak"
text = "开口：外面的海是走它的人的"
next = "at3_drifters"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_spoke" }]
news = "神庙里熄了火，外来的船长说外面的海是走它的人的，黑暗里有人把这句话换成别的语言又说了一遍。"
reply = "黑暗里安静了一会儿。有人把“我”的话重复了一遍，换成了“我”听不懂的那种语言。"
fail = { next = "at3_drifters", effects = [{ kind = "memory", memory = "mem-main_free_atlantis-at2", title = "黑暗里的外圈" }], news = "外港的神庙里，外来船长的话说到一半卡住了，黑暗里有人轻笑一声，女祭司替那句话补完了后半句。" }

[[tracks.chapters.choices]]
key = "listen"
text = "不开口，先听十个人轮流说话"
next = "at3_drifters"
effects = [{ kind = "memory", memory = "mem-main_free_atlantis-at2", title = "黑暗里的外圈" }]
news = "外港的神庙里，十个声音轮流响了一夜，外来的船长站在靠门的外圈，一句话也没说。"
reply = "“我”听见十个人轮流开口，有的急，有的停下来等别人接。只听懂了几个外面港口的名字。"

[[tracks.chapters.choices]]
key = "star"
text = "说出新星那一年你量下的位置"
next = "at3_drifters"
requires = [{ kind = "flag", flag = "c13_main_free_new_star" }]
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_star" }]
hint = "那一年你没有量那颗星，说不出它在哪里。"
news = "神庙里有个外来的船长报出一个星位，黑暗里的王让人把数字又念了一遍。"
reply = "一个王让“我”把数字再说一遍，然后在金板上记了下来。"

[[tracks.chapters.variants]]
key = "v1_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "夜里，神庙里的火一盏盏熄了。十个穿深蓝长袍的人围着刻律法的山铜柱坐下，外面来的人站在外圈。柱脚边有一只金杯，杯里的牛血黑得映不出一点光。山铜柱上的字被手摸得发亮，靠门的那一段最旧，刻痕里积着灰，指甲划过去是钝的。黑暗里一阵一阵地呼吸，没有人出声。伊斯梅妮把“我”领到靠门的位置，低声说：“把誓词读完，再碰那根柱子。”黑暗里有一个王问：“你没有国王。那你替谁说话？外面的海，是谁的？”我想：替船上那几十个人说，也替这些年见过的港口说。天亮前，“我”听见了“合上”这个词。"

[[tracks.chapters.variants]]
key = "v2_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "夜里，神庙里的火一盏盏熄了。十个穿深蓝长袍的人围着刻律法的山铜柱坐下，外面来的人站在外圈。柱脚边有一只金杯，杯里的牛血黑得映不出一点光。山铜柱上的字被手摸得发亮，靠门的那一段最旧，刻痕里积着灰，指甲划过去是钝的。黑暗里一阵一阵地呼吸，没有人出声。伊斯梅妮把“我”领到靠门的位置，低声说：“把誓词读完，再碰那根柱子。”黑暗里有一个王问：“你没有国王。那你替谁说话？外面的海，是谁的？”我想：替船上那几十个人说，也替这些年见过的港口说。天亮前，“我”听见了“打开”这个词。"

[[tracks.chapters.variants]]
key = "v3_met"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "会议已经进入第二夜，外面来的人来得晚。神庙里的火早就熄了，十个穿深蓝长袍的人围着山铜柱，只赶上判词写上金板之前的那一段。柱脚边有一只金杯，山铜柱上的字被手摸得发亮。黑暗里一阵一阵地呼吸，没有人出声。伊斯梅妮把“我”领到靠门的位置，低声说：“把誓词读完，再碰那根柱子。”黑暗里有一个王问：“你没有国王。那你替谁说话？外面的海，是谁的？”我想：替船上那几十个人说，也替这些年见过的港口说。"

# at3：各说各话的小镇。个人终章，at = atlantis_port，期限 1586-12-31，超时直接结束（静默，不写见闻）。
# 三个选项都走 done；没有变体。小镇的人都用“你”称呼“我”。
[[tracks.chapters]]
key = "at3_drifters"
title = "各说各话的小镇"
text = "山铜城墙外的小镇，是几百年里漂进来的人搭的。石头小教堂里有人唱古老的礼拜歌。酒馆门口，一个腰上挂着七把旧钥匙的老人正在试门。码头边，一个老妇人在膝上铺开海图。绳子上晾着几张旧图，被风吹得啪啪响。老修士坐在她旁边，本子摊在腿上，左页写见闻，右页留疑问。他抬头问：“外面的人，现在还相信世界是圆的吗？我这一页记的是疑问。”老妇人头也不抬，手指点在图上：“别人画来路，我画回去的路。你要哪一张？”图的尽头画着一个小港，那是“我”出海的港口。她听“我”说过一次，就记住了它的样子。我想：这一季，我还没想好走不走。"
at = "atlantis_port"
cast = ["drifter_lisbon", "drifter_seven_cities", "drifter_brendan"]
speaker = "captain"
mood = "tender"
night = false
deadline = [1586, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "flag", flag = "c13_main_free_atlantis_over" }]

[[tracks.chapters.choices]]
key = "stay"
text = "在小镇住一季，把外面的事讲给他们听"
next = "done"
effects = [{ kind = "memory", memory = "mem-main_free_atlantis-at3", title = "各说各话的小镇" }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
news = "山铜城墙下的小镇上，一个外来的船长在酒馆里讲了一季外面的港口，老修士的本子记满了疑问。"
reply = "一季里“我”讲了三十个港口，老修士记了三十页疑问。临走时他把其中一页撕下来，塞进“我”手里。"

[[tracks.chapters.choices]]
key = "map"
text = "请老妇人画一张回家的路"
next = "done"
effects = [{ kind = "skill", skill = "cartography", value = 30 }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
news = "外港的码头边，画海图的老妇人替一个外来的船长画了三天回程，图上没有经纬，只有海草的边。"
reply = "她画了三天。图上没有经纬，只有风向与海草的边。“我”后来照着它，回到了出海的那个港口。"

[[tracks.chapters.choices]]
key = "leave"
text = "什么也不带，记住来时的路就走"
next = "done"
check = { attr = "seamanship", base = 20, per = 7 }
effects = [{ kind = "skill", skill = "astral_navigation", value = 30 }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
news = "外港的人说，一个外来的船长什么也没带，凭记忆就出了雾，三道环墙很快看不见了。"
reply = "“我”凭记忆出了雾，回头再也看不见那三道环墙。"
fail = { next = "done", effects = [{ kind = "memory", memory = "mem-main_free_atlantis-at3", title = "各说各话的小镇" }, { kind = "flag", flag = "c13_main_free_atlantis_over" }], news = "外港的人说，一个外来的船长出港第二天就认不出星了，又折回来请画海图的老妇人指路。" }
