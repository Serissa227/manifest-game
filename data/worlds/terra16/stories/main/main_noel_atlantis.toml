[[tracks.chapters.choices]]
key = "them"
text = "说：链子锁的是外面的人，别让他们进来"
next = "at3_last_blank"
effects = [{ kind = "affinity", person = "ismene", value = 2 }]
reply = "十王里有一个点了点头，有一个把手放在柱上，没有出声。最左边那位老王睁开眼，看了我一下，又闭上。伊斯梅妮在蜡板上记下这一句，记完把灯递给下一个人。灯没点着，那人接过去时还是愣了一下。"
news = "神庙的会议上，海峡来的骑士只说了一句话，女祭司当众把它记在了蜡板上。"

[[tracks.chapters.choices]]
key = "us"
text = "说：链子锁的是我们自己，别让我们出不去"
next = "at3_last_blank"
effects = [{ kind = "affinity", person = "ismene", value = 2 }]
reply = "柱子底下有人笑了一声，不是嘲笑。笑的是个白胡子老头，笑完低头看自己的手，像在算这话值多少钱。伊斯梅妮记下这一句，抬眼看了我一下，又低头去看蜡板。她把蜡板往我这边转了转，让我看那一行字，末了一笔拖得很长。"
news = "神庙的会议上，海峡来的骑士说链子锁的是在场的人自己，柱子底下有人笑出了声。"

[[tracks.chapters.choices]]
key = "her"
text = "说：链子锁的是一个母亲的命，从来不是孩子的"
requires = [{ kind = "flag", flag = "c13_main_noel_origin_known" }]
hint = "这一句，你还不知道该替谁说。"
next = "at3_last_blank"
effects = [{ kind = "affinity", person = "ismene", value = 4 }]
reply = "没人点头，也没人笑。伊斯梅妮把蜡板放下，用手指在柱底的石面上记了这一句，指尖按得很重。她后来说，柱子前面，用手记的话不会化。我想的是门上那个阴性的词，还有门拱上那条挂了几十年的铁链。"
news = "神庙的会议上，海峡来的骑士说了一句没人接得上的话。女祭司没有用蜡板记，她用手记下了它。"

# 第三章：外港小镇。个人终章，不设 done 与 end（归 main_noel 的 c11）。名册上最后一个空格，由诺埃尔自己决定怎么办。
[[tracks.chapters]]
key = "at3_last_blank"
title = "最后一个空格"
text = "外港里侧有一片小镇，住的多是几百年里漂进黑暗之海的人，口音杂得很。画回程海图的老妇人是里斯本冒险者的后代，腰上别着量星的尺，领我穿过几条窄巷，停在一扇矮门前。门楣上刻着一颗八角星，没有缺角。门里住着一家打鱼的，祖上是一个从阿尔赫西拉斯出海的骑士，两百多年前船漂进了雾里，再没回去。屋角的炉子上煮着鱼汤，咸得发苦，没人嫌。老人举着一枚生了绿锈的铜星，从屋里探出头来：“外面……还点名？”我说：“点。三十年，就我一个人点。今天多一个。”老妇人在门口小声说：“回去的路我替人画过不少张，这一家从来不问。”我翻开名册。倒数第二页，那一格什么记号也没有：贡萨洛·德·阿尔赫西拉斯。名册上最远的一个名字，原来在柱子外面。"
speaker = "captain"
mood = "tender"
at = "atlantis_port"
cast = ["ismene", "drifter_lisbon", "noel"]
deadline = [1586, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "flag", flag = "c13_main_noel_atlantis_over" }]

[[tracks.chapters.choices]]
key = "circle"
text = "当着他们的面，在那一格画上圆圈，念一遍名字"
next = "done"
effects = [{ kind = "affinity", person = "drifter_lisbon", value = 3 }, { kind = "memory", memory = "mem-main_noel_atlantis-at3", title = "最后一个空格" }, { kind = "flag", flag = "c13_main_noel_atlantis_over" }]
reply = "我念“贡萨洛·德·阿尔赫西拉斯”，声音不大，屋里却静了下来。老人愣了一下，把铜星攥在手里，用一种很老的卡斯蒂利亚话应了一声“在”。那是他的祖上在雾里传下来的话，这一声，是头一回说给外面的人听。他的孙子学着应了一句，应得太响，全屋的人都笑了，老人笑得咳嗽起来，拍着孙子的背，又应了一遍。我站得离门近，听见巷子那头有人在敲补锅的铁，一下，停一下，又一下。老妇人没笑，她在门边把这一天的日子记下来，写在自己的海图背面。我把名册合上前又看了一眼那个圆圈，圈得不圆，像是手抖了。"
news = "外港小镇的矮门里，一家打鱼的老人在旧名册上听见自己祖上的名字，应了一声“在”。"

[[tracks.chapters.choices]]
key = "chart_home"
text = "请老妇人把回塔里法的路画给这一家"
next = "done"
effects = [{ kind = "affinity", person = "drifter_lisbon", value = 5 }, { kind = "memory", memory = "mem-main_noel_atlantis-at3", title = "最后一个空格" }, { kind = "flag", flag = "c13_main_noel_atlantis_over" }]
reply = "老妇人画了一整夜，油灯添了三回油。她把塔里法画成一个小小的圈，圈旁写：钟比这里的大。又在圈和矮门之间画了一条虚线，说那是海，画的时候不必太准。天亮时她把图卷起来，用麻绳捆好，塞进老人怀里。那家人收下了图，没说走不走。老妇人收笔时手指发僵，说这辈子替人画过的图，这一张最不像图。老人把图摊在膝上看了很久，手指沿着虚线慢慢移动，最后停在那个圈上。我在名册上那一格旁边添了一条往东的线。线的尽头空着，我没有替他们写下去。那家人里的小孙子拿着图跑到门口，对着东边的海比划了半天。"
news = "外港的码头上，里斯本后人替一家打鱼的人连夜画回塔里法的路，图上写着：钟比这里的大。"

[[tracks.chapters.choices]]
key = "leave"
text = "那一格就空着：有的名字，留在柱子外面才好"
