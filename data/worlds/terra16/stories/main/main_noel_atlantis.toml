# 链与缎带：柱外（诺埃尔的亚特兰蒂斯补章，故事 2.0 TOML 契约，C13b 暂存）
# 2026-11-01 接回登记（C13 收尾）：A8 E63 的帷幕（realms.toml 的 atlantis：钥匙 tabula_smaragdina，另要 c11_atlantis_key_ready、判词不是“合上”）与 C11 的十王会议
#   （stories/c11_realms.toml 的 atlantis_council，设 atlantis_council_met 与判决旗标）都已在世界里，本文件登记进 world.toml；下文写“暂存 / 不登记”的注释是当时的情形。
#   接线：每个通向 done / failed 的分支（含 at1 超时）设 c13_main_noel_atlantis_over，主线“那以后”章 c09_after 的 when 读它；at1 期限由 1584-12-31 收到 1583-12-31（黑暗之海窗口止于 9-30，没进外港的局早点放行主线）。
#   at2 期限 1585-12-31 收到 1583-10-15、at2 超时也设 _atlantis_over（理由同林晚灯补章）。
# 标签：主线补章；主角 noel（诺埃尔·德·卡德纳，1540-11-11）。轨道 main_noel_atlantis，kind = main，auto = true，起点 at1_gadeira。
# 依据：亚特兰蒂斯外港、伊斯梅妮（cast/story_atlantic.toml）、十王会议、律法柱、里斯本冒险者的后代、打鱼的一家，都是原创（TERRA16 §14、C6 人物）。
#       堡门铭文、名册、星徽、科尔武、七十七个名字出自 main_noel 的设定。史实：无。阿尔赫西拉斯的船漂进雾里一事为虚构，只从人物嘴里透出。
# 读的旗标：c13_main_noel（门槛，main_noel 的 a00 设）、c13_main_noel_crossed（main_noel 的 c08 设）、c13_main_noel_keepsake（c07 设）、
#       c13_main_noel_inscription_read（a03 设）、c13_main_noel_by_inscription（c08 设）、c13_main_noel_origin_known（c05 设）、
#       atlantis_council_met、atlantis_verdict_close、atlantis_verdict_open（C11 设）。
# 设的旗标：c13_main_noel_atl_badge（只在本文件内读，at2 的变体 v3_badge 读）。
#       at3 的三个选项各发一条回忆 mem-main_noel_atlantis-at3；本文件不设 c13_main_noel_done 与 end 旗标（归 main_noel 的 c11）。
# 等待的包：A8 E63（atlantis_port 可达，没有帷幕则 at1 在期限到时静默 failed）；C11 第二轮（atlantis_council 轨道与判决旗标）。
#       两者合入以前，本文件不登记进 world.toml 的 tables.stories，runtime_links.toml 的 pending 也不动。
# HIST 占位：无。
# 回忆插画：mem-main_noel_atlantis-at3「最后一个空格」：外港小镇的矮门，门楣上一颗八角星，骑士翻开旧名册，屋里打鱼的老人举手应名。
# 写作注记：本文件的“我”是诺埃尔。见闻（news）里不写任何秘密，不对诺埃尔用代词。“别盯着我的脸看”与“叫不醒”两处习惯不在本文件里写。

[[tracks]]
key = "main_noel_atlantis"
name = "链与缎带：柱外"
kind = "main"
start = "at1_gadeira"
auto = true
cast = ["ismene", "drifter_lisbon", "noel"]

# 第一章：外港码头。伊斯梅妮先问来意，不问名字。门槛是主线的两面旗标，期限到了仍没到港就静默结束。
[[tracks.chapters]]
key = "at1_gadeira"
title = "面对加德拉"
text = "外港在环城的东面，隔着一片海，正对着我们叫加的斯、他们叫加德拉的那个方向。码头的石头是红的、白的、黑的，一层一层砌上去，墙上包着铜，太阳一照就像着了火。神庙的女祭司伊斯梅妮站在码头尽头等着，比我想的年轻。她不问我的名字，先问来意。她说这一片海岸归加德罗斯一系，柱子外面有一座城，他们一直知道，只是用祖先的名字叫它。“说来意。名字留到柱子前面再说。”我说：“来替一个死在科尔武的老人，看一眼他没看到的东西。问名字之前先问这个，你们的规矩倒省事。”她看了一眼我的名册，说这里也有人数名字：漂进黑暗之海的人，外港一个一个记着。我心里想：加德拉原来在这边，加的斯是对岸。"
speaker = "captain"
mood = "mystic"
at = "atlantis_port"
cast = ["ismene", "noel"]
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "flag", flag = "c13_main_noel_crossed" }]
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_main_noel_atlantis_over" }]

[[tracks.chapters.variants]]
key = "by_inscription"
when = [{ kind = "flag", flag = "c13_main_noel_by_inscription" }]
text = "水底那条链子的影子一直把船领到外港的防波堤下，在最后一块石头前断了。外港在环城的东面，隔着一片海，正对着我们叫加的斯、他们叫加德拉的那个方向。码头的石头是红的、白的、黑的，一层一层砌上去，墙上包着铜，太阳一照就像着了火。神庙的女祭司伊斯梅妮站在码头尽头等着，比我想的年轻。她不问我的名字，先问来意。她说这一片海岸归加德罗斯一系，柱子外面有一座城，他们一直知道，只是用祖先的名字叫它。“说来意。名字留到柱子前面再说。”我说：“来替一个死在科尔武的老人，看一眼他没看到的东西。问名字之前先问这个，你们的规矩倒省事。”她看了一眼我的名册，说这里也有人数名字：漂进黑暗之海的人，外港一个一个记着。我心里想：加德拉原来在这边，加的斯是对岸。"

[[tracks.chapters.choices]]
key = "badge"
text = "把缺了一角的星徽放在伊斯梅妮面前"
requires = [{ kind = "flag", flag = "c13_main_noel_keepsake" }]
hint = "星徽没有带来。你离开塔里法的时候，它没有跟着你上船。"
reply = "她拿起星徽对着光看了很久，用指甲碰了碰缺的那个角，问是怎么缺的。我说勒班陀，一颗流弹，崩掉了一角。她没笑，也没追问下一句，只把星徽放回我手心，指了指柱子底下那块铜板：“柱子前面，外来的人要拿出一样自己的东西。这一样够了。”我把它别回胸前原来的位置，她看着那个缺口，像在数它少了多少。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 5 }, { kind = "flag", flag = "c13_main_noel_atl_badge" }]
news = "外港码头上传开了：海峡来的骑士拿出一枚缺了角的金星，女祭司对着光看了半天，问是怎么缺的。"

[[tracks.chapters.choices]]
key = "lines"
text = "把堡门上的两行字背给她听"
requires = [{ kind = "flag", flag = "c13_main_noel_inscription_read" }]
hint = "那两行字，你自己还没读通。"
reply = "拉丁文她没听懂。阿拉伯文那行她听懂了一半，停在最后一个词上。那个词是阴性的，她说，在他们的话里指海也说得通，要看说话的人站在哪一边。她问我：“你们锁的是人，还是海？”我张了张嘴，没有话。她也不催，只用指尖在蜡板上划了一道，划在两个字中间。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 3 }]
news = "外港码头上传开了：海峡来的骑士背出了堡门上的两行字，女祭司追问，锁的是人，还是海？"

[[tracks.chapters.choices]]
key = "full_name"
text = "先报全名：诺埃尔·德·卡德纳，海峡骑士团"
reply = "她说名字留到柱子前面，可既然报了，她就记下。她用一支铜笔在蜡板上写我的名字，每一笔都停一下，像怕写错一个音。写到“卡德纳”，她抬头看了我一眼，什么也没问，低下头接着写完。"
next = "at2_council"
effects = [{ kind = "affinity", person = "ismene", value = 1 }]
news = "海峡骑士团的人到了外港，报上全名，女祭司用铜笔在蜡板上一笔一笔写下来。"

# 第二章：神庙里的十王会议。轮到诺埃尔时只能说一句话。会议的流程与判决归 C11，这里只写他站的位置与他说的那一句。
[[tracks.chapters]]
key = "at2_council"
title = "链锁的是谁"
text = "会议在神庙里，火熄了，火盆里的灰还是温的。十王穿着深蓝的袍子坐在律法柱下，外面来的人站在柱子的影子里。坐在最左边的老王一直闭着眼，有人咳嗽，有人把手放在柱上。轮到我的时候，伊斯梅妮举着一盏没点着的灯，用灯的边沿碰了碰我的手肘，示意我开口。“只一句。说多了，柱子不记。”柱子上的字我一个也不认识，铜里掺着一种红光，像太阳落进去没出来。四十年，一句话。门上那两行字，我看了这么多年，只看出过两种读法。站到柱子底下，我觉得自己这一句，能添出第三种。"
speaker = "captain"
mood = "mystic"
at = "atlantis_port"
cast = ["ismene", "noel"]
when = [{ kind = "flag", flag = "atlantis_council_met" }]
deadline = [1583, 12, 31]

[tracks.chapters.timeout]
next = "at3_last_blank"
effects = [{ kind = "flag", flag = "c13_main_noel_atlantis_over" }]

