effects = [{ kind = "affinity", person = "ismene", value = 3 }, { kind = "memory", memory = "mem-main_noel_atlantis-at3", title = "最后一个空格" }, { kind = "flag", flag = "c13_main_noel_atlantis_over" }]
reply = "我合上名册，没告诉他们那一页上写着什么。那一格什么记号也没有，我就不替它添一个。老人问我还点不点名，我说点，每年都来。他没再问。走出矮门，伊斯梅妮在巷口靠着墙等，见我出来，没问那一页，只问我找到了没有。我说找到了，就让它空着。她把手里的蜡板递过来，上面记着今天的日子，说柱子前面，空着的格子也要记上日子。我把蜡板还给她，她没追问，只把那一行又看了一遍。巷子里有人在晾鱼网，风一吹，网上的铜铃响了几声。那一晚我在船上没睡，把那一页的样子在心里描了一遍。"
news = "外港小镇上有人说，一个海峡来的骑士翻开旧名册，合上时没说那一页写着什么，只说有一格就让它空着。"
