# 非斯的学者之子·个人小线（free_fez_scholar）
# 标签：自由船长的模板小线（模板 custom_fez_scholar，家乡港丹吉尔；非斯的家学与卡拉维因的旁听里长大，经丹吉尔出海）。
# 轨道：free_fez_scholar（kind=main，auto=true）。
# 章：a00_gate（门槛见闻，1557 年正月，丹吉尔）→ a01_leo（来信，1557 年春起）→ a02_martil（1564 年冬至 1565 年春，得土安的马尔蒂勒河口）
#     → b01_marble（1579 至 1581，里窝那，赎金与糖）→ c01_chair（1585 至 1588，得土安，卡拉维因的讲席，终章）。第二幕（1566—77）本线无章。
# 依据：史实——哈桑·瓦赞（利奥）的《非洲志》1526 年写成、1550 年在威尼斯印出；1565 年西班牙的巴赞在得土安的马尔蒂勒河口沉船堵港，断海盗的出路；
#       艾哈迈德·曼苏尔用三王之战以后葡萄牙人付的赎金修宫殿，大理石以糖等重从里窝那换来。
#       原创——老先生与他的信、手稿抄本的来历、布沙伊卜先生的信、书商与石商的话、卡拉维因的讲席。
#       待核：无。正文只写传闻与物件，史实从人物嘴里和物件上透出来。
# 秘密：没有身世秘密；伏笔是利奥《非洲志》的意大利文手稿（a01 收下），c01 决定它的去处。
# 旗标：设 c13_free_fez_scholar（a00 缺省）、c13_free_fez_scholar_compare（a01 选“跟印本对一对”）；
#       读 c12_voyage_custom_fez_scholar（a00 门槛）、c13_free_fez_scholar_compare（c01 变体）。
# 物品：leo_ms（a01 给出，c01 捐出时收回）。信物 apprentice_notebook 在本文件只作正文里的物件“手订的簿子”，召请章由 main_free 读。
# 等待的包：A9（门槛章可加 protagonist 条件，本文件不写）。无 HIST 占位，无 C10 依赖。
# 人物在场：a02_martil 不设章节 cast（西班牙的巴赞只在消息与远处的帆里出现，不在场；设了会被记成“见过”）；轨道 cast 为 c8_fez_house_teacher。
# 回忆插画清单（mem-* 与画面描述，不超过 60 字）：
#   mem-free_fez_scholar-a02「马尔蒂勒河口的书船」：冬天的河口，一条装满书箱的小船被拖向海里，远处海平线上有几面西班牙的帆。
#   mem-free_fez_scholar-b01「里窝那的大理石」：里窝那的码头上，白色的大理石块堆成小山，几个石匠扛着工具走上一条装糖的船。
#   mem-free_fez_scholar-c01「交回书库的手稿」：卡拉维因清真寺的书库里，一份裹着油布的旧手稿被放上书架，老学者伸手摸了摸书脊。
#   mem-free_fez_scholar-c01b「讲席下的学生」：卡拉维因清真寺的柱廊下，学生们围坐着，讲席上的船长手里拿着一本航海日志。
# 写法：“我”不写性别、外貌、肤色、身高；别人称“船长”或“某家的孩子”。“书合上以前，别下结论”是家里的话，全线只用两次（a00 脚夫转述、c01 诵经先生转述）。

[[tracks]]
key = "free_fez_scholar"
name = "藏起来的手稿"
kind = "main"
start = "a00_gate"
auto = true
cast = ["c8_fez_house_teacher"]

# A00 门槛见闻：丹吉尔码头上的书箱。只在模板 custom_fez_scholar 的船开出去时才有这一章。
[[tracks.chapters]]
key = "a00_gate"
title = "书箱里的出处"
text = "正月的丹吉尔码头，葡萄牙人的港务官翻一只从非斯下来的书箱。翻了半天，只翻出经注和星表。脚夫们蹲在一边看热闹，有人说箱子的主人是某家的孩子，在非斯跟一位老先生念过书，这回要出海。老先生没下山来送，只让赶骡的人捎下来一张纸，纸上只有一处经文的出处。脚夫们替老先生转话：“书合上以前，别下结论。”港务官看不懂那张纸，收进了抽屉。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "tangier"
cast = ["c8_fez_house_teacher"]
mood = "tender"
when = [{ kind = "flag", flag = "c12_voyage_custom_fez_scholar" }]
news = "丹吉尔的港务官翻了一个从非斯下来的书箱，只翻出经注和星表，书箱的主人要出海了。"

[tracks.chapters.default]
next = "a01_leo"
effects = [{ kind = "flag", flag = "c13_free_fez_scholar" }]

# A01 来信：老先生托赶骡的人送来一包手稿。无 at，随时弹出，所以写成一封信。
[[tracks.chapters]]
key = "a01_leo"
title = "利奥的手稿"
text = "书箱里的经注和星表够你在船上用了。另有一包东西，托赶骡的人一路背下来，油布裹了三层。打开以前先想好要不要收。里面是一份抄本，哈桑·瓦赞写的《非洲志》，用意大利文写成。他是我年轻时的朋友，基督徒管他叫“非洲人利奥”。他后来在罗马住了许多年，有人说他改了信仰，有人说他回来了，我不知道哪一种是真的。这份东西放在非斯不安全。放在你的船上，也许安全些。威尼斯有人把它印成了书。印出来的，跟这份不一样。哪里不一样，我老了，看不出来了。——老先生"
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1557, 3, 1] }]
deadline = [1557, 12, 31]

[tracks.chapters.timeout]
next = "a02_martil"
effects = []

[[tracks.chapters.choices]]
key = "keep"
text = "收下手稿，替老先生保管"
next = "a02_martil"
effects = [{ kind = "item", item = "leo_ms", qty = 1 }]
reply = "“我”把包放进装海图的铁皮箱，压在星表底下，挨着那本手订的簿子。油布上还有赶骡人的汗渍，也有非斯的红土。以后每次开箱，手都要先在油布上停一停，像是在跟谁打招呼。"

[[tracks.chapters.choices]]
key = "compare"
text = "收下，找机会带去威尼斯，跟印本对一对"
next = "a02_martil"
effects = [{ kind = "item", item = "leo_ms", qty = 1 }, { kind = "flag", flag = "c13_free_fez_scholar_compare" }]
reply = "“我”在回信里写明，到了威尼斯就去找那本印本，一页一页对，对到哪一句不一样，就抄在纸边上寄回来。老先生的回信很快到了。信纸很薄，字迹抖得厉害，只有一句：“找到了，先别告诉我。”"

[[tracks.chapters.choices]]
key = "return"
text = "托人原样送回，不敢收"
next = "a02_martil"
effects = []
reply = "赶骡的人把包又背上了山，走的还是来时那条路，油布上的结一个都没动。路上要过两道河，他说，这包东西在背上比在船上重。老先生后来再没提这件事。下一封信只问骡子的草料够不够。"

# A02 沉在河口的船：西班牙人要堵马尔蒂勒河口，河里的海盗和老先生的书船都还在河里。
[[tracks.chapters]]
key = "a02_martil"
title = "沉在河口的船"
text = "冬天的得土安，马尔蒂勒河口挤满了船。河湾里藏着海盗的船，桅杆压得低低的，上面盖着芦席。河岸上的安达卢斯人在打包，女人们把银器缝进被褥，孩子们被按在船舷边不许哭。老先生托运下山的那一船书还停在河里，箱子上盖着湿草，跟海盗的船挤在一处。得土安的书商站在岸上对“我”说：“书是老先生一辈子的东西。海盗的船，是他们一辈子的东西。你只装得下一样。”消息是从海上传来的。西班牙的巴赞要带船过来，把装满石头的旧船沉在河口，要把这条河堵死。那天海平线上真的出现了西班牙人的帆。“我”把海图摊在船头，指着河口：“图上只画到湾口。河里的水深，没人替我们量过。”河里的海盗摸到“我”的船边，话很短：“替我们带一船家眷出去。”我没说出口：书箱还在河里，船上却只有我的两只手。"
speaker = "captain"
mood = "tense"
at = "tetouan"
when = [{ kind = "date", from = [1564, 10, 1] }]
deadline = [1565, 3, 31]

[tracks.chapters.timeout]
next = "b01_marble"
effects = [{ kind = "letter", person = "c8_fez_reciter", text = "河口堵死了。西班牙人的石船沉在马尔蒂勒，走海的路断了。先生的书改走陆路，晚了一个月，湿了三本。他一句抱怨也没说，只让人把湿的那三本摊在天井的橙树下。你的船若还停在河口外，就别再等了。" }]

[[tracks.chapters.choices]]
key = "books"
text = "趁河口还没堵，把书船拖出来"
next = "b01_marble"
effects = [{ kind = "reputation", faction = "morocco", value = 2 }, { kind = "memory", memory = "mem-free_fez_scholar-a02", title = "马尔蒂勒河口的书船" }]
reply = "书船拖出河口的时候，西班牙人的第一条旧船正沉在身后，水花溅湿了最上面那只箱子。湿草被风吹掉，露出箱盖上一行墨写的书名，是老先生的笔迹。"
news = "有人看见一条小船拖着书箱出了马尔蒂勒河口，岸上的书商一路跟着跑，嘴里念着书名。"
check = { attr = "seamanship", base = 20, per = 7 }
fail = { next = "b01_marble", effects = [], news = "得土安河口那条装书的船搁了浅，只抢出了半船书，另一半改走陆路下了山。" }

[[tracks.chapters.choices]]
key = "families"
text = "替海盗们把一船家眷带出去"
next = "b01_marble"
effects = [{ kind = "reputation", faction = "morocco", value = 2 }, { kind = "reputation", faction = "spain", value = -2 }]
reply = "家眷们在甲板上回头看河口，没有人说话。有个老妇人说，她当年也是这样从格拉纳达的海边上船的，那时没有人替她数人头。这一次，“我”一个一个数过，数到最后一个孩子，才让船离岸。"
news = "得土安的海盗船今天送走一船安达卢斯人的家眷，岸上的老人说，这是河口最后一船走得出去的人。"

[[tracks.chapters.choices]]
key = "wait"
text = "停在河口外，看西班牙人怎么做"
next = "b01_marble"
effects = []
reply = "巴赞的人沉下七条旧船，动作干净利落，没有人喊一声。从那天起，得土安的河只进不出，海盗的船在河里挤了一冬，再没有一条能走。“我”的船在河口外停了三天，帆没有放下过。"
news = "西班牙人在马尔蒂勒河口沉了七条旧船，城里的海盗骂了一整天，骂完又去河边数船。"

# B01 一斤糖换一斤石头：里窝那的码头。限期到 1581 年六月底，把蔗糖运到里窝那；不论选哪项，糖都在这一章卸下。
[[tracks.chapters]]
key = "b01_marble"
title = "一斤糖换一斤石头"
text = "里窝那的码头上，卡拉拉运来的大理石堆成一座小山，白得刺眼。石块上用炭笔写着斤两，有的数字已经被雨水冲淡了。苏丹的代理人坐在一张折凳上，身边摆着账本，要的石头是马拉喀什那座新宫殿的，钱是葡萄牙人三王之战以后付的赎金，要得急。石商站在对面，要的是糖。“我”的船压着蔗糖，今天就在这里卸下。代理人翻开账本：“一斤换一斤。苏丹说，石头和糖都一样重，人才不一样。”“我”拿起一块石头，看了看上面的炭字：“这个数，是谁报给你的？”石商把手按在一块白石上：“这一车里有一块，原本是给里窝那一座教堂订的。订金付了一半，教堂后来没钱了。”我没说出口：一斤对一斤，账算得清，算不清的是那块订过的石头。"
speaker = "captain"
mood = "cheerful"
at = "livorno"
when = [{ kind = "date", from = [1579, 1, 15] }]
objectives = [{ kind = "goods", good = "sugar", qty = 20, at = "livorno", text = "把蔗糖运到里窝那" }]
deadline = [1581, 6, 30]

[tracks.chapters.timeout]
next = "c01_chair"
effects = [{ kind = "letter", person = "c8_fez_reciter", text = "苏丹的宫殿还在盖，大理石是别人运来的。马拉喀什的人说，那座宫殿的每一块石头，都是用葡萄牙人的赎金买的。你的糖若没送到里窝那，就算了，别在那里耗着。" }]

[[tracks.chapters.choices]]
key = "even"
text = "照规矩，一斤糖换一斤石头"
next = "c01_chair"
effects = [{ kind = "cash", value = 850 }, { kind = "reputation", faction = "morocco", value = 3 }]
reply = "石头一块块装上船，压得船吃水深了一尺。代理人在每块石头上用炭写了个数，写完才把账本合上。石商在岸上数了一遍，数到那块白石时停了停，没说话。“我”站在舷边看船一点点压下去，手里那张单子上，一斤和一斤终于对齐了。"
news = "里窝那码头上的大理石装上了去摩洛哥的船，码头的脚夫说，一船糖换回这么多石头，马拉喀什的那座宫殿够气派了。"

[[tracks.chapters.choices]]
key = "haggle"
text = "跟石商讲价，多换一船石头"
next = "c01_chair"
effects = [{ kind = "cash", value = 1600 }]
reply = "石商摇着头，还是答应了。他说摩洛哥人的糖太甜，甜得他吃亏，又把多出来的那一船石头的斤两一笔笔记进自己的账本，一个字也不肯漏。“我”听着他的笔尖在纸上刮，才觉得这一船糖没有白运。"
news = "里窝那的石商今天在码头上叹气，说卖掉了整整一船石头，糖却卖得太便宜了。"
check = { attr = "commerce", base = 20, per = 7 }
fail = { next = "c01_chair", effects = [{ kind = "cash", value = 850 }], news = "里窝那的石商只肯一斤换一斤，说再讲价，他就把这车石头卖给城里的教堂。" }

[[tracks.chapters.choices]]
key = "carvers"
text = "连刻石头的匠人也请上船"
next = "c01_chair"
effects = [{ kind = "reputation", faction = "morocco", value = 2 }, { kind = "memory", memory = "mem-free_fez_scholar-b01", title = "里窝那的大理石" }]
reply = "两个石匠一路上在甲板上磨凿子，凿子磨了又磨，一句话也不多说。到了萨累，他们才问“我”，宫殿是在哪一片山脚下。“我”答不上来，只好指了指南边的山。他们点点头，把凿子收进布袋，说石头到了地方，自己会知道该凿成什么样。"
news = "里窝那的两个石匠跟着一条去萨累的船走了，码头上的人说，他们这辈子没去过那么远的地方。"

# C01 卡拉维因的讲席：终章。讲席的邀请由诵经先生从非斯带来；手稿在不在你身边，决定第一个选项能不能选。
[[tracks.chapters]]
key = "c01_chair"
title = "卡拉维因的讲席"
text = "冬天，非斯来的诵经先生下山到了得土安。他在港口的客栈里等了两天，等到“我”的船靠岸，才把带来的话说完。他的鞋上还沾着非斯的红土，两天里没人替他刷，他自己也不在意。卡拉维因清真寺的讲席要空出来了。学者们想请走过海的人讲一回，讲海那边的书，讲海那边的星。“他还问起那份手稿。”诵经先生从袖口里抽出一张纸，纸角被手指磨得发毛，“他的眼睛已经看不清字了。可第一页的第一句，他还记得。”“我”问：“那一句，是哪一卷的注？”诵经先生摇摇头，说那一卷早就不在非斯了，老先生只记得句子，不记得卷数。“他说，书合上以前，别下结论。”诵经先生把纸折好，递过来，“现在他想合上了。”窗外码头上在卸一船柑橘。我想，那一页的第一句，我得先自己读一遍。"
speaker = "captain"
mood = "tender"
at = "tetouan"
when = [{ kind = "date", from = [1585, 1, 15] }]
deadline = [1588, 12, 31]

[[tracks.chapters.variants]]
key = "v1_compare"
when = [{ kind = "flag", flag = "c13_free_fez_scholar_compare" }]
text = "冬天，非斯来的诵经先生下山到了得土安。他在港口的客栈里等了两天，等到“我”的船靠岸，才把带来的话说完。他的鞋上还沾着非斯的红土，两天里没人替他刷，他自己也不在意。卡拉维因清真寺的讲席要空出来了。学者们想请走过海的人讲一回，讲海那边的书，讲海那边的星。“他还问起那份手稿。”诵经先生从袖口里抽出一张纸，纸角被手指磨得发毛，“他的眼睛已经看不清字了。可第一页的第一句，他还记得。”“我”问：“那一句，是哪一卷的注？”诵经先生摇摇头，说那一卷早就不在非斯了，老先生只记得句子，不记得卷数。“他说，书合上以前，别下结论。”诵经先生把纸折好，递过来，“现在他想合上了。”“我”在威尼斯对过那本印本，印出来的少了一章写非斯书商的事。老先生要是问起，“我”打算说。窗外码头上在卸一船柑橘。我想，那一页的第一句，我得先自己读一遍。"

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "letter", person = "c8_fez_reciter", text = "老先生走了。讲席空了一年，后来给了别人。他走以前说，那份手稿在你那里，他就不担心了。" }]

[[tracks.chapters.choices]]
key = "library"
text = "把手稿捐给卡拉维因的书库"
next = "done"
requires = [{ kind = "item", item = "leo_ms", qty = 1 }]
hint = "那份手稿不在你身边。"
effects = [{ kind = "item", item = "leo_ms", qty = -1 }, { kind = "reputation", faction = "morocco", value = 2 }, { kind = "memory", memory = "mem-free_fez_scholar-c01", title = "交回书库的手稿" }]
reply = "书库的管事把油布一层层打开，只看了一眼第一页，没念出声，就把手稿放上了书架。架子是旧的，上面一排排的抄本都裹着布，手稿放在最边上，挨着一本缺了封面的星表。登记簿上写下手稿的名字，又写下“我”的名字，问要不要在后面加上“船长”两个字。“我”说不必，管事就在那一行末尾点了个墨点，把笔搁下。"
news = "卡拉维因的书库收进一份意大利文的旧手稿，管事说，这东西读不懂，先放上书架再说。"

[[tracks.chapters.choices]]
key = "lecture"
text = "坐上讲席，讲一回海那边的星"
next = "done"
effects = [{ kind = "fame", value = 2 }]
reply = "台下的学生问的问题，一半“我”答不上来。可他们记下的，比“我”讲的还多。一个穿旧披风的学生举手问，那颗星在海上到底是拿来看路，还是拿来看时辰。“我”想了一会儿，说两样都用。学生们低头写了一片。讲完的时候，一个老学者走上台阶，问的是：那颗星的名字，是哪一本书里的。“我”答得出来，说的是老先生的书。老学者点了点头，没再问。"
news = "卡拉维因的讲席上来了个讲海的人，讲了一个下午的星，台下的学生抄了满满两本。"
check = { attr = "learning", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "memory", memory = "mem-free_fez_scholar-c01b", title = "讲席下的学生" }], news = "卡拉维因的讲席上，讲海的船长忘了一颗星的阿拉伯名字，台下一个学生替船长接了上去。" }

[[tracks.chapters.choices]]
key = "idriss"
text = "请伊德里斯替你讲，你坐在台下听"
next = "done"
effects = [{ kind = "memory", memory = "mem-free_fez_scholar-c01b", title = "讲席下的学生" }]
reply = "伊德里斯讲的是经注，批注比正文还长，讲到一半就把正文放下，改用手指在空中画字。“我”坐在台下，听懂了几句当年听不懂的注，记在手订的簿子上。散场的时候，柱廊下的学生还在争论一个字该怎么读，“我”没有插嘴，只在簿子边上记下了两种读法。"
news = "卡拉维因的讲席上换了人讲，讲经注的先生散场时还被几个学生拦在柱廊下争论。"
