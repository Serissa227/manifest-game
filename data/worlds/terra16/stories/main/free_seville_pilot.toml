news = "塞维利亚总署的大厅里，一个修道院来的孩子接过一件旧象限仪，翻来覆去看了很久，才肯去量。"

[[tracks.chapters.variants]]
key = "v1_father"
when = [{ kind = "flag", flag = "c13_free_seville_pilot_father_known" }]
text = "总署请我坐一回考官的长凳，考一场领航的口试。考生是修道院送来的一个孤儿，十四五岁，手里没有仪器，两只手一直攥着衣角。我拆开了封了二十多年的蜡，蜡碎成三块掉在桌上，我一块块捡回来。蜡里压的印边缺了一角。老头的字旁边，有一行更旧的小字，我认得，是那张字条上的笔迹。纸上只有一道题，我照着念出来：“在没有月食的夜里，你怎么知道自己往东走了多远？”孩子问：“这题有标准答案吗？”我说：“全天下的领航员都答不出。”我到今天也答不出。大厅最后一排，巴列斯特罗斯靠着椅背，假装打瞌睡。他没睁眼，只说：“答不出，不要紧。先看清自己答不出什么。”我想：他封这张纸的时候，心里等的是哪一天？"
