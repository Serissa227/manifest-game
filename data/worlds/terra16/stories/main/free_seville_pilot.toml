# 塞维利亚的孤儿领航学徒·个人小线（故事 2.0，A5 / E37 契约）
# 标签：自由船长模板“塞维利亚的孤儿领航学徒”（custom_seville_pilot，家乡港 seville）；轨道 free_seville_pilot（kind main，auto，门槛 a00_gate 读 c12_voyage_custom_seville_pilot）。
# 章数：5 章（a00_gate 门槛见闻；a01_flota 召；a02_veracruz 转；b01_register 转；c01_question 终章）。一幕 a00—a02（1557—1560）、二幕 b01（1572—1574）、三幕 c01（1580—1581）。
# 依据（史实）：塞维利亚贸易总署的领航执照与出海船队；领航总长阿隆索·德·查韦斯（1552—86 在任，cast historical_01_europe）；1554 年新西班牙船队在北方海岸失事，幸存者沿海岸南走（只从人物嘴里透出，不开历史课）。
# 原创：老考官巴列斯特罗斯与封了蜡的考题；修道院的弃婴簿与字条；父亲罗德里戈·萨拉斯与象限仪背面的记号；韦拉克鲁斯的独臂老水手；总署旧档里的执照。
# 读的旗标：c12_voyage_custom_seville_pilot（门槛，C12 结业设定）。
# 设的旗标：c13_free_seville_pilot（a00 的 default）；c13_free_seville_pilot_flota（a01 签契约）；_1554_heard（a02 的 ask / show）；_father_known（b01 的 copy / archive）；_quadrant_given（c01 的 give）。
# 读的旗标（变体）：c13_free_seville_pilot_flota（a02 v1_flota）；c13_free_seville_pilot_1554_heard（b01 v1_heard）；c13_free_seville_pilot_father_known（c01 v1_father）。
# 等待的包：A9（门槛章的 protagonist 条件，整合时加在 a00 的 when 里）；C12（c12_voyage_* 由结业设定）。
# 占位：本线没有 HIST 占位（1554 年的风暴不作分支）。
# 回忆插画清单：
#   mem-free_seville_pilot-a02 象限仪背面的记号：热浪里的韦拉克鲁斯码头，独臂老水手把一件旧象限仪翻过来，用拇指摸背面的刻痕。
#   mem-free_seville_pilot-b01 弃婴簿上的一行：修道院窗下，一本发霉的簿子摊开着，中间夹着一张发黄的字条，旁边放着一件旧象限仪。
#   mem-free_seville_pilot-b01b 总署旧档里的执照：总署档案室的长桌上，一张二十年前的领航执照摊在灯下，签名旁边画着一个小记号。
#   mem-free_seville_pilot-c01 拆开的考题：总署的大厅里，老考官坐在最后一排，前面站着一个没有仪器的孤儿，手里拿着一张拆了蜡的旧纸。
# 禁区：“我”不写性别、外貌、肤色、身高，别人称“船长”或“某家的孩子”；中英文都不用第三人称代词指“我”；父亲的死状、母亲都不写；同学莱昂诺尔（a01 图铺）与佩德罗（不出场）只许一句客串，1562—63 年的重逢归 C7。
# 避开的题目：查韦斯的请托（圣维森特角与象限仪）、莱昂诺尔的拉斯帕尔马斯水道、佩德罗的星盘、监考与亚速尔以西的岛。

[[tracks]]
key = "free_seville_pilot"
name = "封好的考题"
kind = "main"
start = "a00_gate"
auto = true
cast = ["jeronimo_ballesteros", "alonso_de_chaves"]

# a00 门槛见闻：只有选了这个模板的学徒才会在这里开轨道。见闻体，第三人称。
[[tracks.chapters]]
key = "a00_gate"
title = "封了蜡的纸"
text = "塞维利亚贸易总署的台阶下，码头上的人在传。老考官巴列斯特罗斯脾气躁了一辈子，临了收了个修道院里长大的孤儿当最后一个学徒。学徒要出海那天，老头把一张封了蜡的纸塞进那孩子手里，当着满码头的人说：“等你考别人那天再拆。早拆一天，就不算我的学徒。”那孩子没接话，把纸揣进怀里，揣得很深。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "seville"
cast = ["jeronimo_ballesteros"]
mood = "tender"
news = "塞维利亚码头的人说，老考官巴列斯特罗斯把一张封了蜡的纸交给最后一个学徒，叫那孩子发誓不许拆。"
when = [{ kind = "flag", flag = "c12_voyage_custom_seville_pilot" }]

[tracks.chapters.default]
next = "a01_flota"
effects = [{ kind = "flag", flag = "c13_free_seville_pilot" }]

# a01 召：春天的总署大厅，查韦斯问的是象限仪是谁给的。船队五月走了，没等人，以老考官的信收尾。
[[tracks.chapters]]
key = "a01_flota"
title = "新西班牙的船队"
text = "春天，贸易总署的大厅里挤满了等签契约的船主和领航员，靴子在木地板上踩出一片响。领航总长查韦斯坐在长桌后面，一张一张看领航执照，看得很慢，手指在每张纸边上停一停。今年去韦拉克鲁斯的船队缺一个领航副手，船主嚷着要便宜的，书记嚷着要签得快的。轮到我，执照递过去，墨迹还是新的。查韦斯没先看执照，先看了看我手里的象限仪。大厅另一头，巴列斯特罗斯背对着这边，装作在和人争一张表格。查韦斯放下执照，抬起头，问的却不是执照上的事：“这件仪器旧了，刻度倒没磨平。谁给你的？”我说：“刻度是我自己对着太阳校的。”我没说出口：修道院给的。修道院说，是跟我一起送来的。"
at = "seville"
cast = ["alonso_de_chaves"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1559, 1, 10] }]
deadline = [1559, 5, 31]

[tracks.chapters.timeout]
next = "a02_veracruz"
effects = [{ kind = "letter", person = "jeronimo_ballesteros", text = "船队走了，没等你。我骂了总署书记一页纸，骂他们签契约签得太慢。最后一行我只写一句：去韦拉克鲁斯的路，自己走也是走。" }]

[[tracks.chapters.choices]]
key = "flota"
text = "签总署的契约，随船队去当领航副手"
next = "a02_veracruz"
effects = [{ kind = "flag", flag = "c13_free_seville_pilot_flota" }, { kind = "reputation", faction = "spain", value = 2 }]
reply = "书记在我的名字后面停了笔。那里本该有一个父姓，我没有。他犹豫了一下，写上修道院的名字，又在契约底下盖了章。"
news = "塞维利亚的贸易总署，今年去韦拉克鲁斯的船队多了一个修道院出来的领航副手，书记在契约上停了好一会儿笔。"

[[tracks.chapters.choices]]
key = "solo"
text = "不签契约，自己的船跟在船队后面走"
next = "a02_veracruz"
effects = [{ kind = "skill", skill = "astral_navigation", value = 20 }]
reply = "旗舰嫌我跟得太近，打了两次旗语。我就落后半里，照自己量的纬度走。每天中午，我在舱里把数记在纸上，记到天黑。"
news = "塞维利亚港外，去新西班牙的船队旗舰连打了几次旗语，那条不签约的小船不肯靠近，码头上有人打赌它迟早要掉队。"

[[tracks.chapters.choices]]
key = "chart"
text = "先去码头的地图铺，买一张新到的加勒比海图"
requires = [{ kind = "cash", ge = 300 }]
hint = "你身上的钱买不起一张新海图。"
next = "a02_veracruz"
effects = [{ kind = "cash", value = -300 }, { kind = "chart", region = "east_caribbean" }]
reply = "地图铺后屋的莱昂诺尔抬头冲我笑了笑，没说话。新图上的岛比我学过的多了三个。"
news = "塞维利亚的码头地图铺里，有个没签约的领航学徒花了一大笔钱，买走了一张新到的加勒比海图。"

# a02 转：韦拉克鲁斯的码头，独臂老水手认出象限仪背面的记号。只给线索，不揭开父亲是谁。
[[tracks.chapters]]
key = "a02_veracruz"
title = "五年前的风"
text = "韦拉克鲁斯外的圣胡安·德·乌卢阿锚地，热得像蒸笼。船在卸葡萄酒和铁器，木箱的味道又闷又甜。码头边坐着一个独臂的老水手，盯着我手里的象限仪看了很久。他问：“你们这些领航的，嘴里的话能信吗？”我说：“量过的才算数。”他没接话，过了很久才开口：“五年前，那支船队在北边的海岸碰上风暴，三条船冲上了沙洲。活下来的人沿着海岸一路走回来，三百个人剩不到一把。领航的那几个……没回来。有一个总拿这样一件象限仪量太阳，一路量到沙洲上。”我没说出口：他认的是记号，不是我。"
at = "veracruz"
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1559, 6, 1] }]
deadline = [1560, 8, 31]

[tracks.chapters.timeout]
next = "b01_register"

[[tracks.chapters.choices]]
key = "ask"
text = "请他把那一年的事讲完"
next = "b01_register"
effects = [{ kind = "flag", flag = "c13_free_seville_pilot_1554_heard" }]
reply = "他讲到一半停了，说剩下的去塞维利亚修道院问。“那年送去的孩子，修士们都记着。”说完他撑着膝盖站起来，抖了抖裤腿，走进货栈的阴影里。"
news = "韦拉克鲁斯码头上，独臂的老水手讲起五年前沙洲上的风暴，讲到一半停住，只说剩下的事有人该去问。"

[[tracks.chapters.choices]]
key = "show"
text = "把象限仪递给他，让他看背面的记号"
requires = [{ kind = "item", item = "quadrant", qty = 1 }]
hint = "你的象限仪不在身边，手里只剩一个空套子。"
next = "b01_register"
effects = [{ kind = "flag", flag = "c13_free_seville_pilot_1554_heard" }, { kind = "memory", memory = "mem-free_seville_pilot-a02", title = "象限仪背面的记号" }]
reply = "他用剩下的那只手接过仪器，翻到背面，拇指停在一处刻痕上，停了很久，什么也没说。还给我的时候，他的手在抖，仪器碰在掌心里响了一声。"
news = "韦拉克鲁斯的码头上，一个年轻的领航员拿出一件旧象限仪，独臂的老水手翻过来看了背面，一句话也没说。"

[[tracks.chapters.choices]]
key = "leave"
text = "不问了，装完货就走"
next = "b01_register"
effects = []
reply = "船离港的时候，老水手还坐在缆桩上。他没有挥手，只用没断的那只手，在膝盖上画了一个三角。"
news = "韦拉克鲁斯港外的船道上，有人看见码头边一个独臂的老水手，目送那条船出了港。"

[[tracks.chapters.variants]]
key = "v1_flota"
when = [{ kind = "flag", flag = "c13_free_seville_pilot_flota" }]
text = "韦拉克鲁斯外的圣胡安·德·乌卢阿锚地，热得像蒸笼。我是随船队来的领航副手，旗舰正在卸葡萄酒和铁器，船主站在栈桥上催我去点数。点到一半，码头边坐着一个独臂的老水手，盯着我手里的象限仪看了很久。他问：“你们这些领航的，嘴里的话能信吗？”我说：“我是领航的。”他没接话，过了很久才开口：“五年前，那支船队在北边的海岸碰上风暴，三条船冲上了沙洲。活下来的人沿着海岸一路走回来，三百个人剩不到一把。领航的那几个……没回来。有一个总拿这样一件象限仪量太阳，一路量到沙洲上。”我没说出口：他认的是记号，不是我。"

# b01 转：冬天的修道院，老修士把弃婴簿翻到那一页。字条上的笔迹与象限仪背面的记号是同一个人的手。限期到年底，没人来就以老修士的信收尾。
[[tracks.chapters]]
key = "b01_register"
title = "弃婴簿上的一行"
text = "冬天，修道院的老修士把一本发霉的弃婴簿搬到窗下，一页一页往回翻，翻到很多年前的一个夏天。那一页上记着：门口放过一个孩子，身边一件旧象限仪，一张字条。字条上写着一个领航员的名字，还有一句话：“那个人随船队去了。若不回来，请教这孩子认星。”字条上的字歪歪斜斜，最后一笔拖得很长，我见过这一笔。象限仪背面刻的那个记号，收尾也是这样拖出去的。老修士把簿子推到我面前，说：“没人来认，我就一直夹着。你现在来了，就算认了。”我想：那个人没教过我认星，可这件仪器教了我。"
at = "seville"
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1572, 1, 15] }]
deadline = [1574, 12, 31]

[tracks.chapters.timeout]
next = "c01_question"
effects = [{ kind = "letter", person = "jeronimo_ballesteros", text = "修道院的老修士过世了，那本簿子交给了大教堂。要看，就快去。我这把年纪，也等不起了。" }]

[[tracks.chapters.choices]]
key = "copy"
text = "把那一行和那张字条抄下来"
next = "c01_question"
effects = [{ kind = "flag", flag = "c13_free_seville_pilot_father_known" }, { kind = "memory", memory = "mem-free_seville_pilot-b01", title = "弃婴簿上的一行" }]
reply = "我一个字一个字抄。抄到名字的时候，老修士在旁边低声念了一遍，念得很轻，像怕吵醒了谁。"
news = "塞维利亚修道院的老修士搬出一本发霉的旧簿子，说它要交给大教堂了，叫来人快看。"

[[tracks.chapters.choices]]
key = "archive"
text = "去总署的旧档里查那个领航员的执照"
next = "c01_question"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_free_seville_pilot_father_known" }, { kind = "memory", memory = "mem-free_seville_pilot-b01b", title = "总署旧档里的执照" }]
reply = "执照上签的正是查韦斯，签名旁边画着一个小记号，和象限仪背面的一样。我在档案室的长桌上翻到天黑，灯座里的油换了两回。"
news = "塞维利亚总署的人说，档案室的灯亮到很晚，一个学徒埋在旧执照堆里，谁问话也不抬头。"
fail = { next = "c01_question", effects = [], news = "塞维利亚总署的旧档室里，有个学徒翻了三天旧执照，纸太乱，最后只带出一个名字。" }

[[tracks.chapters.choices]]
key = "close"
text = "合上簿子，不看了"
next = "c01_question"
effects = []
reply = "我把簿子还给老修士，说不用了。老修士没有劝，只把字条重新夹好，夹得比原来还紧。"
news = "塞维利亚修道院里有个学徒翻了半本弃婴簿，看了一眼就合上了，老修士也没劝。"

[[tracks.chapters.variants]]
key = "v1_heard"
when = [{ kind = "flag", flag = "c13_free_seville_pilot_1554_heard" }]
text = "冬天，修道院的老修士把一本发霉的弃婴簿搬到窗下，一页一页往回翻，翻到很多年前的一个夏天。那一页上记着：门口放过一个孩子，身边一件旧象限仪，一张字条。字条上写着一个领航员的名字，还有一句话：“那个人随船队去了。若不回来，请教这孩子认星。”字条上的名字，就是韦拉克鲁斯那个独臂老水手说过的，没走回来的那个领航员。字条上的字歪歪斜斜，最后一笔拖得很长，我见过这一笔。象限仪背面刻的那个记号，收尾也是这样拖出去的。老修士把簿子推到我面前，说：“没人来认，我就一直夹着。你现在来了，就算认了。”我想：那个人没教过我认星，可这件仪器教了我。"

# c01 终章：总署请我坐考官的长凳，拆开二十多年前封蜡的题。落点三选一：照题考、写下自己的办法、把象限仪送给那孩子。超时以老考官的信收尾。
[[tracks.chapters]]
key = "c01_question"
title = "拆开那张纸"
text = "总署请我坐一回考官的长凳，考一场领航的口试。考生是修道院送来的一个孤儿，十四五岁，手里没有仪器，两只手一直攥着衣角。我拆开了封了二十多年的蜡，蜡碎成三块掉在桌上，我一块块捡回来，摆在纸边上。蜡里压的印是老头自己的，印边缺了一角。纸上只有一道题，我照着念出来：“在没有月食的夜里，你怎么知道自己往东走了多远？”孩子问：“这题有标准答案吗？”我说：“全天下的领航员都答不出。”我到今天也答不出。大厅最后一排，巴列斯特罗斯靠着椅背，假装打瞌睡。他没睁眼，只说：“答不出，不要紧。先看清自己答不出什么。”我想：他封这张纸的时候，心里等的是哪一天？"
at = "seville"
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1580, 1, 15] }]
deadline = [1581, 12, 31]

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "letter", person = "jeronimo_ballesteros", text = "总署问今年还考不考人，你人不在。我替你回了一句：等那孩子回来，他自己拆。" }]

[[tracks.chapters.choices]]
key = "sealed"
text = "照封纸上的题，考那个孩子"
next = "done"
effects = [{ kind = "memory", memory = "mem-free_seville_pilot-c01", title = "拆开的考题" }]
reply = "孩子想了很久，说：“我不知道，可我会每天量。”我对他说：“量过的才算数。”然后在考卷上写了一个“过”字。"
news = "塞维利亚总署的大厅里，修道院来的孩子考领航，老考官留下的题没人答得出，那孩子说会每天量。"

[[tracks.chapters.choices]]
key = "answer"
text = "在题下面写下这些年的办法，再考他别的"
next = "done"
effects = [{ kind = "skill", skill = "astral_navigation", value = 30 }]
reply = "我在题下写了半页：月距、沙漏、航迹推算，没有一样准，三样凑在一起才勉强。写完我另出了两道别的题给他。他答出一道，另一道在纸边上画了个圈，问能不能先空着。"
news = "塞维利亚总署里传，那位少说话的领航员在老考官的封题下面写了半页办法，又另出了两道题考那孩子。"

