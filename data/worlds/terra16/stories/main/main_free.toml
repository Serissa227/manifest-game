# C06 交船：收过徒弟的那条线先在这里交船。passed 不设门槛，只由 c05 收徒弟的选项 next 进来，不读同一轨道上别的选项设的旗标。
[[tracks.chapters]]
key = "c06_handover"
title = "交船"
text = "冬天，徒弟已经能独自量星了，夜里替我值更，报出来的数再没错过。那天夜里他把最后一页的墨磨好，递到我手里，说：“船长，该您写了。”我接过笔，没有马上写。他替我把灯芯挑亮了一点，动作有些生，挑过了又退回来。窗外港口的灯一盏盏亮起来，码头上有人喊：“收缆！”桌上的航海日志摆成一排。这条船接下来往哪边开，该由谁站在船尾，我心里其实已经有数，只是还没想好怎么说出口。"
when = [{ kind = "date", from = [1589, 1, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1590, 6, 30]

[[tracks.chapters.choices]]
key = "passed"
text = "把船交给徒弟，看着他起锚"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_free_done" }, { kind = "flag", flag = "c13_main_free_end_passed" }]
reply = "徒弟起锚的时候回头看了一眼，又转回去看前面的水道。我没有挥手，只把帽子按了按。他第一次站在船尾，手还在抖，我没有去扶。后来他在第一个夜里给我寄来一封信，信上只写了一个港口的名字，和一个数，那是他量的星高。"

[[tracks.chapters.choices]]
key = "stay"
text = "船还留在我手里，最后一页我自己写完"
next = "c06_epilogue"
effects = []
reply = "徒弟还留在船上，我把这条船继续攥在自己手里。他问我为什么不放手，我说：“最后一页还没写完。”明年的第一个港口还没有定，我想，还能再想一年。"

