# C02：明年夏天，亚速尔以西。召请；超时的缺省立场是 open。
[[tracks.chapters]]
key = "c02_summons"
title = "明年夏天，亚速尔以西"
text = "一封没有署名的短信，夹在一包新到的海图里。纸是好纸，字是拉丁文，只有一行：“柱子以西，雾会在双鱼的夏天开一道缝。”同一个月，港里的人都在说，圣克鲁斯侯爵的舰队要再去特塞拉岛。我把纸翻过来，背面没有字，只有一个压得很深的印子，像是戒指压出来的。大副凑过来看了一眼，说：“船长，那边要打仗。我们去，是去做生意，还是去看热闹？”我心里想：雾那边要是真有一座城，它该不该让人看见？我没有回答，把那张纸放在灯下，看了很久。"
when = [{ kind = "date", from = [1582, 9, 1] }]
speaker = "captain"
mood = "mystic"
deadline = [1583, 2, 28]

[[tracks.chapters.choices]]
key = "open"
text = "让雾散开：那边的城该跟这边的世界通商"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_free_stance_open" }]
reply = "我在日志上写：海是走出来的。船员听说要往亚速尔去，有人高兴，有人摇头。摇头的那个转身去检查了一遍缆绳。当晚我把这一行念给大副听，他没说好，也没说不好，只问：“走出去以后，回不回得来？”"

[[tracks.chapters.choices]]
key = "close"
text = "雾里有雾里的人：替他们把门关上"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_free_stance_close" }]
reply = "我想起出海那年，家乡有个人说过：有些门开了就关不上，要先想好谁守着。我决定去看一眼，看完替那边保密。那人的原话我记不全了，只记得他说话时手里在削一根木签。我把那根木签的样子画进了日志，旁边什么也没写。"

[[tracks.chapters.choices]]
key = "hand"
text = "交给守得住的一方，别让人抢"
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_free_stance_hand" }]
reply = "我在纸上列了几个名字：赫尔墨斯的书商、骑士团、奥斯曼的舰队。一个一个划掉，最后留下一个没写出来。划到最后，纸上只剩一道横线。我把纸折起来，夹进海图里，没有交给任何人。"

[tracks.chapters.timeout]
next = "c03_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_free_stance_open" }]

[[tracks.chapters.variants]]
key = "v1_keepsake"
when = [{ kind = "flag", flag = "c13_main_free_keepsake" }]
text = "一封没有署名的短信，夹在一包新到的海图里。纸是好纸，字是拉丁文，只有一行：“柱子以西，雾会在双鱼的夏天开一道缝。”同一个月，港里的人都在说，圣克鲁斯侯爵的舰队要再去特塞拉岛。我把纸翻过来，背面没有字，只有一个压得很深的印子，像是戒指压出来的。大副凑过来看了一眼，说：“船长，那边要打仗。我们去，是去做生意，还是去看热闹？”我心里想：雾那边要是真有一座城，它该不该让人看见？我没有回答，把那张纸放在灯下，看了很久。读信时，我的手按在那只包着家里东西的油布包上。"

