# C03：黑暗之海的边上。安格拉的 stage 章：window、default、at、cast、news 齐全；没有 when。
[[tracks.chapters]]
key = "c03_dark_sea"
title = "黑暗之海的边上"
text = "安格拉港外挤满了船：圣克鲁斯侯爵的舰队、法国人的残船、来看热闹的商船，桅杆密得像一片林子。往西一天，海草多起来，风停了，罗经的针抖个不停。雾的边上漂着一只皮筏，筏上坐着一个老修士，手里一本本子，一页记见闻，一页记疑问。他不靠近，也不走开。本子被风吹得一页一页翻，他用手按着。远处侯爵的旗舰上有人喊：“哪条船？报上名来！”老修士隔着海草喊：“你带着那片抄到一半的纸吗？没有的话，海草会把你送回去，像送走别人一样。”我心里想：罗经不准了，可星还准。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["alvaro_de_bazan", "drifter_brendan"]
speaker = "captain"
mood = "mystic"
news = "安格拉的人说，侯爵的舰队打下特塞拉岛那年夏天，西边的海草一直长到港口外，罗经一个月都不准。"

[[tracks.chapters.choices]]
key = "cross"
text = "拿出那片抄着翠玉录的纸，往雾里开"
next = "c04_after"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
effects = [{ kind = "flag", flag = "c13_main_free_crossed" }]
reply = "雾从船头分开一道缝，像有人掀开帘子。我没有回头去数安格拉的灯，只看着前面那道缝。那道缝两边的海草是灰白的，像被人一根一根梳过。我把纸摊在舵台上，手按着它，直到安格拉的灯全看不见了。"
hint = "你身上没有那片抄到一半的纸。老修士摇了摇头，海草在船头合拢。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头，这一趟不是我的年份"
next = "c04_after"
effects = [{ kind = "flag", flag = "c13_main_free_turned_back" }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
reply = "我下令掉头，海草放开了船。回到安格拉，侯爵的人盘问了半天，最后只抄走了我航海日志的一页。他们抄的是这一年的风向，我记得很清楚。盘问的人没有问我为什么掉头，我也没有说。"

[[tracks.chapters.choices]]
key = "follow"
text = "照五年前记下的方位，再往雾里靠一程"
next = "c04_after"
requires = [{ kind = "flag", flag = "c13_main_free_comet_chase" }]
check = { attr = "seamanship", base = 5, per = 8 }
effects = [{ kind = "flag", flag = "c13_main_free_turned_back" }, { kind = "flag", flag = "c13_main_free_fog_seen" }, { kind = "memory", memory = "mem-main_free-c03", title = "雾里那条无桨的船" }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
reply = "我看见了那条没有桨手的船。它离我只有两箭远，船身灰白，帆一张也没有。然后雾合上了。船头没有人，只有一截断了的缆绳挂在栏杆上，在风里轻轻晃。"
fail = { next = "c04_after", effects = [{ kind = "flag", flag = "c13_main_free_turned_back" }, { kind = "flag", flag = "c13_main_free_atlantis_over" }], news = "安格拉的人说，有条船往雾边上靠，海草缠住了舵，等解开时雾已经退回原处，船长只记下了一个方位。" }
hint = "你没有记过那条无桨船的方位，雾里分不出东西。"

[tracks.chapters.default]
next = "c04_after"
effects = [{ kind = "flag", flag = "c13_main_free_absent" }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]

[[tracks.chapters.variants]]
key = "v1_new_star"
when = [{ kind = "flag", flag = "c13_main_free_new_star" }]
text = "安格拉港外挤满了船：圣克鲁斯侯爵的舰队、法国人的残船、来看热闹的商船，桅杆密得像一片林子。往西一天，海草多起来，风停了，罗经的针抖个不停。雾的边上漂着一只皮筏，筏上坐着一个老修士，手里一本本子，一页记见闻，一页记疑问。他不靠近，也不走开。本子被风吹得一页一页翻，他用手按着。远处侯爵的旗舰上有人喊：“哪条船？报上名来！”雾顶上那片天里，我认出了十一年前量过的那颗新星的位置。它早已暗了，位置还在。老修士隔着海草喊：“你带着那片抄到一半的纸吗？没有的话，海草会把你送回去，像送走别人一样。”我心里想：罗经不准了，可星还准。"

# C04：回来的人。亚速尔的消息从酒馆传来。
[[tracks.chapters]]
key = "c04_after"
title = "回来的人"
text = "前些日子，酒馆里有人冲我举杯：“往西去的那几条船，回来的人都不爱说话，你是不是也去了？”我没答。角落里有个人在讲故事，把那条船讲成了有桨的，我知道它没有。秋天，亚速尔的消息一条条传到各港口：侯爵回里斯本领赏，法国人的残船去了拉罗谢尔。掌柜擦着杯子，说：“去的人不少，回来的，连船都不愿意多看一眼。”雾没有开。回来的人，不说话。"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_free_atlantis_over" }]
speaker = "captain"
mood = "mystic"
deadline = [1584, 12, 31]

[[tracks.chapters.choices]]
key = "log"
text = "把这一年写进航海日志，一个字也不改"
next = "c05_world_after"
effects = [{ kind = "memory", memory = "mem-main_free-c04", title = "这一年的日志" }]
reply = "这一页我写得很慢，一个港口一个港口地写，写到安格拉就停了。写完我把日志锁进箱子，钥匙在手里转了几圈，最后还是放回了贴身的口袋。"

[[tracks.chapters.choices]]
key = "chart"
text = "把看见的画成一张没人会信的海图"
next = "c05_world_after"
effects = [{ kind = "skill", skill = "cartography", value = 20 }]
reply = "海图上那一角我只画了海草的边线，一个字也没写。拿给港里的书商看，他翻来覆去看了半天，说这种图卖不掉。我说，本来就不卖，留着给船上的人看。"

[[tracks.chapters.choices]]
key = "tell"
text = "在酒馆里讲出来，信不信由他们"
next = "c05_world_after"
effects = [{ kind = "fame", value = 1 }]
reply = "一半人笑，一半人沉默。沉默的那一半后来一个个走过来，问那条船到底什么样。讲错细节的那个人散场后找到我，问能不能跟着船出一趟海，他说他记得住风向。"

[tracks.chapters.timeout]
next = "c05_world_after"

