[[tracks.chapters.variants]]
key = "v02_murano_glass"
when = [{ kind = "flag", flag = "c12_voyage_custom_murano_glass" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出出海那年父亲塞给我的威尼斯玻璃杯。对着太阳看，杯底有一个小气泡。父亲当年说过：这只不卖。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v03_lisbon_medicine"
when = [{ kind = "flag", flag = "c12_voyage_custom_lisbon_medicine" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出祖母配的一小瓶药剂。蜡封上压着一个只有家里人认得的记号，这么多年我一直没打开。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v04_lubeck_accounts"
when = [{ kind = "flag", flag = "c12_voyage_custom_lubeck_accounts" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出账房学徒的印记，一枚磨圆了角的铜印，印面是汉萨的鹰。我在第一本账簿的第一页盖过它。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v05_basque_whaling"
when = [{ kind = "flag", flag = "c12_voyage_custom_basque_whaling" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出出海时师傅给的解缆小刀。师傅在刀柄上刻过一道记号，后来我每过一季就添一道。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v06_istanbul_shipyard"
when = [{ kind = "flag", flag = "c12_voyage_custom_istanbul_shipyard" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出船匠的交接凭记，一块刻着船台编号的木牌。师傅说过，拿着它的人，船台就认谁。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v07_fez_scholar"
when = [{ kind = "flag", flag = "c12_voyage_custom_fez_scholar" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出出海时带的手订的簿子。前面是先生抄给我的出处，后面记满了港口的名字。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v08_cambay_broker"
when = [{ kind = "flag", flag = "c12_voyage_custom_cambay_broker" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出父亲系在我腰上的那袋算筹。竹签磨得发亮，少了两根，一直没补。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v09_busan_interpreter"
when = [{ kind = "flag", flag = "c12_voyage_custom_busan_interpreter" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出出海时带的手订的簿子。第一页是先生写的十个女真字，后面是我一路记下的话。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

[[tracks.chapters.variants]]
key = "v10_naha_envoy"
when = [{ kind = "flag", flag = "c12_voyage_custom_naha_envoy" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出岛间通行凭记，一块盖着王府朱印的木札。这些年进过多少个港，木札上就多了多少道刻痕。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

