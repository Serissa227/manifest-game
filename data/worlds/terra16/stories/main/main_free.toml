# C05：那以后的世界。
[[tracks.chapters]]
key = "c05_world_after"
title = "那以后的世界"
text = "新年，我把这些年的航海日志一本本摆在桌上，十几本，书脊一样高。窗外是冬天，有人在街上赶车，车轮声一直传到屋里。翻到第一本，我认不出自己当年的字了。第一行写的是风向，第二行写着一个人的名字，名字旁边画了一个圈。当年送我出港的人说过：“字写歪了也要写完。”大副站在门口，手里拎着一包刚买的墨：“船长，这些本子要是丢了，可就没人知道我们去过哪儿了。”"
when = [{ kind = "date", from = [1586, 1, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1588, 12, 31]

[[tracks.chapters.choices]]
key = "logbook"
text = "把这些年写成一本航海记，交给印书的人"
next = "c06_epilogue"
effects = [{ kind = "flag", flag = "c13_main_free_logbook" }, { kind = "fame", value = 2 }]
reply = "印书的人要我删掉三章，说出去没人信的那几章。我只删了一章，留下的两章，他读了一遍，没有再说什么。他把稿子翻到最后，问这一页有没有人能作证。我说有，都在船上，一个都没走。"

[[tracks.chapters.choices]]
key = "apprentice"
text = "收一个徒弟，把认风认星的本事教给他"
next = "c06_handover"
effects = [{ kind = "flag", flag = "c13_main_free_apprentice" }, { kind = "memory", memory = "mem-main_free-c05", title = "第一课" }]
reply = "徒弟第一夜就把北极星认错了，第二夜没认错。我没夸他，只把十字测天仪递过去，让他自己对准地平线。他对了三次才停下来，手心全是汗，抬头问：“船长，这回对了吗？”我说，你自己看。"

[[tracks.chapters.choices]]
key = "last_voyage"
text = "再出海一次，去一个从没去过的港口"
next = "c06_epilogue"
effects = [{ kind = "flag", flag = "c13_main_free_last_voyage" }, { kind = "skill", skill = "rigging", value = 20 }]
reply = "我挑了海图上一个从没靠过的港口。水手们听说要去那里，有人回家写了遗嘱，又笑着回来了，说是陪船长走一趟。出港那天，码头上的人都来送，没有一个人说“别去了”。"

[tracks.chapters.timeout]
next = "c06_epilogue"

[[tracks.chapters.variants]]
