# C06：最后一页。收尾；超时的缺省落点是 end_sea。
[[tracks.chapters]]
key = "c06_epilogue"
title = "最后一页"
text = "冬天，最后一本航海日志还剩一页。我坐在屋里，把三十多年的事想了一遍：第一个港口，我在岸上站得太久，忘了当时是几点起的锚；第一封信，拆的时候船正顶着风，纸被吹得哗哗响；那片雾，我见过它退开一圈，也见过它合上。想到哪里就停一下，不急着往下写。信纸已经软了，我还是把它从箱底翻出来，又看了一遍。楼下有人问：“船长，今晚还上船吗？”我说：“等写完这一行。”门口又有人喊：“船长，潮水到了。”桌上的灯芯短了，我没有剪。墙边摆着这些年的日志，一本挨着一本。我提笔，在最后一页上写下一个港口的名字。笔尖停了一下，墨滴在纸上。"
when = [{ kind = "date", from = [1589, 1, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1590, 6, 30]

[[tracks.chapters.choices]]
key = "home"
text = "回到出海的那个港口，在码头边住下"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_free_done" }, { kind = "flag", flag = "c13_main_free_end_home" }]
reply = "家乡码头上，有年轻的船主来问路。我给他们看日志，不收钱。他们看了一会儿，问我第一个港口是哪里。我说，你们走了就知道。有个年轻人把日志翻到第一页，看了很久，说那个风向他认得，是这个码头每年春天都有的风。"

[[tracks.chapters.choices]]
key = "sea"
text = "一直留在海上，船到哪里，家就在哪里"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_free_done" }, { kind = "flag", flag = "c13_main_free_end_sea" }]
reply = "我换了一条小一点的船，照旧每年出港。港务所的书记已经不用问我名字了，见了我，直接递上登记簿。登记簿上我签的名字一年比一年潦草，书记却每次都替我把日期写端正。"

[tracks.chapters.timeout]
next = "done"
effects = [{ kind = "flag", flag = "c13_main_free_done" }, { kind = "flag", flag = "c13_main_free_end_sea" }]

