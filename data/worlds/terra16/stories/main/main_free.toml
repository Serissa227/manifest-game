# 自由船长·主干（main_free）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_free_atlantis 与本线同批登记；c04_after 的 when 加 c13_main_free_atlantis_over，由补章的结局与 c03_dark_sea 的掉头 / 缺席分支设。
#
# 标签：自由船长（玩家自创）。“我”不写性别、外貌、肤色与身高，不写名字；speaker = "captain" 时说话的是“我”；别人称呼“船长”。
# 依据：史实——1563 年木星与土星会合（秘史：七级试炼对外人开放，这里只写书店里的低语）；1572 年仙后座新星（第谷记下的那颗）；
#   1577 年大彗星；1583 年圣克鲁斯侯爵拿下特塞拉岛（H53）；1583 年十王的会议（H56，这里只写“回来的人”）。
#   秘史与原创：赫尔墨斯的书、黑暗之海的雾退了一圈、无桨的船，为游戏补全。
# 轨道：main_free（auto = true，start = a00_gate）。门槛章 a00_gate 的 when 要求九位主角的 c12_voyage_<key> 全为 false，且 upbringing_graduated；
#   default 设 c13_main_free。
# 模板变体：a01、a02、c01 按 c12_voyage_custom_<模板> 取变体。变体按 key 的字母序取第一个满足的（v00a 至 v00d 的特例优先于 v01 至 v12），只改正文。
# 本文件设置的旗标：c13_main_free；c13_main_free_act2、_act3；_keepsake；_stance_open / _close / _hand；_crossed / _turned_back / _absent / _fog_seen；
#   _hermes_heard、_new_star、_comet_chase、_logbook、_apprentice、_last_voyage；_done 与 _end_home / _end_sea / _end_passed；
#   方向 c13_free_course_trade / _explore / _arms / _letters；c13_free_keepsake_left。
# 结构：c05 的“收徒弟”选项 next 到 c06_handover（交船章，passed 不设门槛）；c06_epilogue 只留回港与留海两个落点。
# 读取的旗标（由别的文件设）：c12_voyage_*（门槛与模板变体）；c13_free_<地区>_a_*（a04 变体，地区章）；
#   c13_free_seville_pilot_father_known / _quadrant_given、c13_free_basque_whaling_knife_left、c13_free_istanbul_shipyard_receipt_given（c01 变体，模板小线）；
#   atlantis_council_met（C11，c04 变体）。
# 等待的包：A8（E59 赫尔墨斯入口；E63 翠玉录能否穿过黑暗之海，外港是否可达，c03 的 cross 选项由它定）；A9（自创主角的身份条件）；
#   C11（十王会议读 keepsake、stance、crossed，atlantis_council_met 在 c04 变体中读）。本文件没有 HIST_ 占位旗标。
# 回忆插画清单（mem-* 键与画面，各不超过 60 字）：
#   mem-main_free-a02 压在海图下的信：船舱的桌上摊着海图，一角压着一封拆开的信，油灯照着封蜡上的沥青。
#   mem-main_free-a03 书店里的那场争论：窄小的书店，柜台上摊着星历，书商和船长隔着烛台各指着一颗星。
#   mem-main_free-a04 家乡的码头：十年后的家乡码头，船还没靠稳，岸上有人举手认出了船上的旗。
#   mem-main_free-a04b 岸上的一季：港口小客栈的窗边，船长看着自己的船由别人带出港，手里还拿着航海日志。
#   mem-main_free-b01 不动的那颗星：夜里的甲板，船长举着十字测天仪对着仙后座，旁边的水手提着灯。
#   mem-main_free-b02 彗星最后的尾巴：正月的夜空，一道淡下去的彗尾斜挂在西南，船上的人都仰着头。
#   mem-main_free-c03 雾里那条无桨的船：灰白的雾墙前，一条没有帆没有桨的船慢慢滑过海草，船长站在船头看。
#   mem-main_free-c04 这一年的日志：船舱里，船长在航海日志上写满一页，又在页边画了一道雾。
#   mem-main_free-c05 第一课：甲板上，船长把十字测天仪交到一个少年手里，教他对准地平线。

[[tracks]]
key = "main_free"
name = "自由船长"
kind = "main"
start = "a00_gate"
auto = true

# A00：门槛见闻。选中别的主角时这条线静默结束，什么也不留下。
[[tracks.chapters]]
key = "a00_gate"
title = "出港簿上的新名字"
text = "正月初的里斯本，港务所门口排着等盖章的船主，冻得直跺脚。王室档案馆的戈伊斯老馆长拄着拐杖上了台阶，要查旧簿子。书记替他搬出一摞出港登记，老人翻到今年那一页，眯着眼数了半天，嘀咕道：“这一页的名字，比去年一整本还多。”他把那一页折了个角，说：“这些名字，过几年都要来我这儿找自己的船。”"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "lisbon"
stage = "rumor"
mood = "cheerful"
cast = ["damiao_de_gois"]
news = "里斯本港务所的书记说，今年来登记出港的年轻船长比往年多，档案馆的戈伊斯老先生还把那一页折了角。"
when = [{ kind = "flag", flag = "c12_voyage_mio", value = false }, { kind = "flag", flag = "c12_voyage_lieve", value = false }, { kind = "flag", flag = "c12_voyage_najma", value = false }, { kind = "flag", flag = "c12_voyage_lin_wandeng", value = false }, { kind = "flag", flag = "c12_voyage_ix_nikte", value = false }, { kind = "flag", flag = "c12_voyage_noel", value = false }, { kind = "flag", flag = "c12_voyage_tariq", value = false }, { kind = "flag", flag = "c12_voyage_kaicili", value = false }, { kind = "flag", flag = "c12_voyage_baraka", value = false }, { kind = "flag", flag = "upbringing_graduated" }]

[tracks.chapters.default]
next = "a01_first_wind"
effects = [{ kind = "flag", flag = "c13_main_free" }]

# A01：起锚。基础正文是没有模板时的样子；12 个模板变体各换家乡画面与送行的人。
[[tracks.chapters]]
key = "a01_first_wind"
title = "起锚那天"
text = "起锚的那个早上，缆绳一松，船身往下一沉。岸上站着送行的人，一个挨一个，越来越小。送行的人里有个人喊：“到了就写信！”我站在船尾没有挥手，手里攥着出港的文书，纸角被汗浸软了。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"
when = [{ kind = "date", from = [1557, 1, 7] }]
speaker = "captain"
mood = "tender"
deadline = [1557, 3, 31]

[[tracks.chapters.choices]]
key = "trade"
text = "先把舱装满，哪里的货便宜就往哪里去"
next = "a02_mentor_letter"
effects = [{ kind = "flag", flag = "c13_free_course_trade" }, { kind = "skill", skill = "negotiation", value = 20 }]
reply = "第一个陌生的港口，我站在货栈里压价，压到对方把算盘推回来，叹了口气才停。舱装满了，船也比预计沉下去两寸。水手们说，船长在岸上算账，跟在船上一样狠。"

[[tracks.chapters.choices]]
key = "explore"
text = "去海图上还画不全的海，自己量一段岸线"
next = "a02_mentor_letter"
effects = [{ kind = "flag", flag = "c13_free_course_explore" }, { kind = "skill", skill = "cartography", value = 20 }]
reply = "我把新买的海图铺在舱板上，在边角添上第一条自己量出来的海岸线。墨还没干，一个浪从舷窗打进来，湿了一角。那段线糊成一片灰，我没有擦，就让它那样留着。"

[[tracks.chapters.choices]]
key = "arms"
text = "凭本事挣名声：海上的事，打得过才算数"
next = "a02_mentor_letter"
effects = [{ kind = "flag", flag = "c13_free_course_arms" }, { kind = "fame", value = 1 }]
reply = "第一次有船远远看见我的旗，就转了舵。甲板上的水手笑成一片，我没笑，只把旗杆上的结又打了一遍。"

[tracks.chapters.timeout]
next = "a02_mentor_letter"
effects = [{ kind = "flag", flag = "c13_free_course_trade" }]

[[tracks.chapters.variants]]
key = "v01_seville_pilot"
when = [{ kind = "flag", flag = "c12_voyage_custom_seville_pilot" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。塞维利亚特里亚纳那一侧的码头上，瓜达尔基维尔河水是黄的，几只驳船挤在岸边。老考官巴列斯特罗斯站在贸易总署的台阶上不肯下来，只抬了一下帽檐，隔着人群说了一句：“罗经别乱打。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v02_murano_glass"
when = [{ kind = "flag", flag = "c12_voyage_custom_murano_glass" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。潟湖起了雾，穆拉诺的炉火在雾里发红。当玻璃师傅的父亲从人群里挤过来，把一小块还温着的碎玻璃塞进我手心，什么也没说。岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v03_lisbon_medicine"
when = [{ kind = "flag", flag = "c12_voyage_custom_lisbon_medicine" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。里斯本贝伦的塔在退潮的滩上投下一截影子。当医生的父亲把药箱钥匙交到我手里，说：“药房的门，你知道在哪。”说完就背过身去。二楼的窗里亮着一盏灯，祖母没下楼。岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v04_lubeck_accounts"
when = [{ kind = "flag", flag = "c12_voyage_custom_lubeck_accounts" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。吕贝克特拉沃河口，城里七座尖塔排成一线。卡塔琳学校的先生递来一本还没写字的账簿：“第一页你自己记。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v05_basque_whaling"
when = [{ kind = "flag", flag = "c12_voyage_custom_basque_whaling" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。毕尔巴鄂的内尔维翁河边堆着一排排鲸油桶，味道冲得人眼睛发酸。鱼叉手师傅蹲在船头，用刀刻下第一道记号，边刻边骂：“刻一道，回来看一道。”姨妈从人群后面塞来一包晒干的药草。岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v06_istanbul_shipyard"
when = [{ kind = "flag", flag = "c12_voyage_custom_istanbul_shipyard" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。金角湾兵工厂的船台一排排斜进水里。船匠师傅拍了拍龙骨，说：“船是骨头，人是皮，皮给风吹烂了，骨头还在。”咖啡馆的法蒂玛夫人隔着水喊了一句，叫我回来讲给她听。岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v07_fez_scholar"
when = [{ kind = "flag", flag = "c12_voyage_custom_fez_scholar" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。丹吉尔的码头上，葡萄牙港务官把我的书箱翻了半天，一本一本抖开。非斯的先生没来，托赶骡的人捎来一张纸，上面只写了一处经文的出处。赶骡的人说：“先生说，这一处你要自己翻。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v08_cambay_broker"
when = [{ kind = "flag", flag = "c12_voyage_custom_cambay_broker" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。坎贝湾退了潮，船搁在泥滩上等水。当经纪人的父亲把一袋算筹系在我腰上，一根一根拍平了，叮嘱：“先过秤，再谈价。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v09_busan_interpreter"
when = [{ kind = "flag", flag = "c12_voyage_custom_busan_interpreter" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。釜山浦倭馆的木栅外，对马来的船挂着宗氏的旗。司译院的先生拿出一张书契的样纸，叫我临走前再念一遍。我念到一半，他摆摆手：“够了，你的话，到了那边再说。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v10_naha_envoy"
when = [{ kind = "flag", flag = "c12_voyage_custom_naha_envoy" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。那霸港里进贡船正在装硫磺，黄得刺眼。当正使的父亲一边点礼单一边挥手，祝女在船头洒了一把海水，说：“替你压浪。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v11_tondo_datu"
when = [{ kind = "flag", flag = "c12_voyage_custom_tondo_datu" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。汤都的河口，福建的戎克船和文莱的帆挤在一处。家学先生坐在竹屋的檐下，用手指在沙上画潮，画完一道抹掉一道，抬头对我说：“潮会来，你记得下一回。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

[[tracks.chapters.variants]]
key = "v12_chincha_rafts"
when = [{ kind = "flag", flag = "c12_voyage_custom_chincha_rafts" }]
text = "起锚的那个早上，缆绳一松，船身往下一沉。卡亚俄的海滩上停着钦查来的巴尔萨木筏，浪一推一推的。老结绳官库西把一根打了三个结的绳系在桅上，拍了拍：“一个结一季，别解开。”岸越来越小，我站在船尾没有挥手。岸沉下去的时候，我才想起来，第一个港口还没定。这一辈子要往哪边去，我想在看不见岸以前定下来。"

# A02：老师的第一封信。信的部分由模板变体给出；请托只指人与事，不写报酬。
[[tracks.chapters]]
key = "a02_mentor_letter"
title = "老师的第一封信"
text = "一封信从家里追来，转了两三个港口才到我手里，封蜡上沾着别的船的沥青。我拆信时船正顶着西风，纸被吹得哗哗响。字写得很慢，一笔一划，像写的人怕自己写错。信末老师问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"
when = [{ kind = "date", from = [1557, 6, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1558, 6, 30]

[[tracks.chapters.choices]]
key = "errand"
text = "照信里说的，去那几个港口找人"
next = "a03_conjunction"
effects = [{ kind = "skill", skill = "negotiation", value = 20 }]
reply = "我把信里的名字抄在海图背面，按港口的先后排好。有两个地方我从没靠过，名字却熟得像邻居。我没说去不去，船头已经转向了第一个港口的方向。"

[[tracks.chapters.choices]]
key = "letters"
text = "改道：照老师的路去读书、去求见"
next = "a03_conjunction"
effects = [{ kind = "flag", flag = "c13_free_course_letters" }, { kind = "flag", flag = "c13_free_course_trade", value = false }, { kind = "flag", flag = "c13_free_course_explore", value = false }, { kind = "flag", flag = "c13_free_course_arms", value = false }, { kind = "skill", skill = "calligraphy", value = 20 }]
reply = "我的回信只写了一行，把原来定下的方向划掉。那天夜里我在舱里点着灯读书，读到天亮，灯油添了两回。天亮时大副来敲门，问今天还出不出港。我说不出，他就站在门口等，等到我把灯吹了。"

[[tracks.chapters.choices]]
key = "keep"
text = "把信压在海图底下，照原来的打算走"
next = "a03_conjunction"
effects = [{ kind = "memory", memory = "mem-main_free-a02", title = "压在海图下的信" }]
reply = "信一直压在海图底下。后来每次换图，我都要先把它挪开，看一眼，再压回去。水手们以为那是家信，我没有解释。"

[tracks.chapters.timeout]
next = "a03_conjunction"

[[tracks.chapters.variants]]
key = "v01_seville_pilot"
when = [{ kind = "flag", flag = "c12_voyage_custom_seville_pilot" }]
text = "一封信转了两三个港口才到我手里，是巴列斯特罗斯写的，字像他的脾气，一笔比一笔硬。领航总长查韦斯要一件刻度没磨平的仪器，老梅迪纳要人去加那利夜里看罗经。两个老头都不肯先开口求人，就叫我去。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v02_murano_glass"
when = [{ kind = "flag", flag = "c12_voyage_custom_murano_glass" }]
text = "一封信是父亲口述、学徒代写的，字写得东倒西歪。里亚尔托后头那家面具铺的老板娘要人跑一趟拉古萨，车马钱她照付。炉子上的事不用我管，信里写得清清楚楚。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v03_lisbon_medicine"
when = [{ kind = "flag", flag = "c12_voyage_custom_lisbon_medicine" }]
text = "信是父亲写的，夹着一张药方。王室档案馆的戈伊斯老馆长在找一份被人借走不还的航海报告，托我留意。信末只添了一句：周五别在外面过夜，不解释。我把药方折好收进袖子，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v04_lubeck_accounts"
when = [{ kind = "flag", flag = "c12_voyage_custom_lubeck_accounts" }]
text = "信是先生写的。伦敦钢院的老会计、卑尔根商站的掌柜，都缺一个记得住数的人。先生写：账要记，人情也要记。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v05_basque_whaling"
when = [{ kind = "flag", flag = "c12_voyage_custom_basque_whaling" }]
text = "信是姨妈托神父代写的，字歪歪扭扭。拉罗谢尔的盐又涨了，师傅的膝盖逢雨就疼。村里谁家缺人手，信里一个个点了名。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v06_istanbul_shipyard"
when = [{ kind = "flag", flag = "c12_voyage_custom_istanbul_shipyard" }]
text = "这回来的是法蒂玛夫人的咖啡馆捎来的一句口信，由一个跑船的人带到。加拉塔那位格拉西亚夫人要船去拉古萨接人，画坊的亚斯明要上好的靛蓝。口信说完，那人又补了一句：夫人问：“书还读不读。”我把这句话记在海图背面，没有抬头。"

[[tracks.chapters.variants]]
key = "v07_fez_scholar"
when = [{ kind = "flag", flag = "c12_voyage_custom_fez_scholar" }]
text = "信是先生写的，引了三处出处，一处比一处绕。舍夫沙万那位老女主人下山来了一趟，非斯的讲师曼朱尔想看一本基督徒印的拉丁文《医典》。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v08_cambay_broker"
when = [{ kind = "flag", flag = "c12_voyage_custom_cambay_broker" }]
text = "信是父亲写的，一半是账。第乌的通行证官换人了，霍尔木兹的马价跌了。末尾叮嘱：别替不认识的人做保。信末又问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v09_busan_interpreter"
when = [{ kind = "flag", flag = "c12_voyage_custom_busan_interpreter" }]
text = "信是先生写的，楷书一笔不苟。一位女诗人要把冬衣送去北边，汉城的金尚宪大人要找一处烧不着的地方存书。先生写：字要练下去。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v10_naha_envoy"
when = [{ kind = "flag", flag = "c12_voyage_custom_naha_envoy" }]
text = "信是父亲写的。福州柔远驿的驿丞换了人，下一趟进贡船要早一个月备礼。祝女托他在信背面写了一句祝福，字很大，像怕我看不见。信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v11_tondo_datu"
when = [{ kind = "flag", flag = "c12_voyage_custom_tondo_datu" }]
text = "信是先生托福建船主带来的。文莱的港务官问起汤都今年的瓷器，马尼拉湾那边的拉惹家也有话要传。先生在信末问了一句：“书还读不读。”我把信折起来，压在海图底下，半天没有抬头。"

[[tracks.chapters.variants]]
key = "v12_chincha_rafts"
when = [{ kind = "flag", flag = "c12_voyage_custom_chincha_rafts" }]
text = "这回来的是库西托筏户带来的一根绳。筏户替他念：有一串老绳的事，要等我回卡亚俄再说。绳上打了三个结，他说，我到了就知道该怎么解。我把绳系在床头，半天没有抬头。"

# A03：书店里的低语。没有 at：这是一段回想，不写“我走进某港”。
[[tracks.chapters]]
key = "a03_conjunction"
title = "书店里的低语"
text = "那是木星与土星靠在一起的那几夜。我在一家小书店里待了半个下午，只为买一张纸。店很窄，柜台上摊着一本新印的星历，页角被翻卷了。书商见我总盯着那一页看，就把声音压低：“城里有一本赫尔墨斯的书，只有十几行字。抄来抄去，每一手都不一样，你说怪不怪？”我问在哪里能看到。他摇摇头，把星历合上，又翻开。我想弄明白的是，那两颗星有什么好吵的。书商忽然不说了，抬眼看我，没有赶人，只问了一句：“你的船往西走过多远？”"
when = [{ kind = "date", from = [1563, 8, 25] }]
speaker = "captain"
mood = "mystic"
deadline = [1564, 8, 31]

[[tracks.chapters.choices]]
key = "ask"
text = "留下来，问那本书的下落"
next = "a04_ten_years"
effects = [{ kind = "flag", flag = "c13_main_free_hermes_heard" }]
reply = "书商只给了一个暗号似的问法，叫我到别的港口的书店再问一遍。我把那句话记在簿子最后一页，用的是铅笔，怕墨水洇开。"

[[tracks.chapters.choices]]
key = "almanac"
text = "买一本斯特夫勒的新历书就走"
next = "a04_ten_years"
requires = [{ kind = "cash", ge = 300 }]
effects = [{ kind = "cash", value = -300 }, { kind = "item", item = "almanach_ulm", qty = 1 }]
reply = "星历的纸很新，有一页印错了月相，书商用红笔改过，改得很小心。我把它塞进海图箱，那页错的月相我没有撕。"
hint = "你摸了摸钱袋，这本书今天买不起。"

[[tracks.chapters.choices]]
key = "argue"
text = "跟书商争那两颗星到底预兆什么"
next = "a04_ten_years"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "fame", value = 1 }, { kind = "memory", memory = "mem-main_free-a03", title = "书店里的那场争论" }]
reply = "争到打烊，书商说我是第一个拿航海日志跟他争星象的人。第二天港里就有人认得我，说我是跟书店老板吵了一下午的船长。"
fail = { next = "a04_ten_years", news = "城里那家窄小的书店，老板跟一个船长吵了半个下午的星象，最后把星历合上：等你在海上量过一整夜，再来跟我争。" }

[tracks.chapters.timeout]
next = "a04_ten_years"

# A04：出海十年。变体各加一句，取自地区章留下的旗标（只取一片海）。
[[tracks.chapters]]
key = "a04_ten_years"
title = "出海十年"
text = "新年的第二天，我翻开第一本航海日志。第一页的墨已经发褐，页边有一小块盐渍，是那年第一场风留下的。我一页一页往后翻：哪一页沾过盐，哪一页夹着一片干叶子，哪一页的字歪得厉害，是在晃动的舱里写的。大副站在舱门口，问：“船长，今年还往远处走吗？水手们想知道，要不要先跟家里打个招呼。”我没有马上回答，只说：“先看看海图。”翻到最后一页，我才发现，日志上记得最多的是人名，货倒没记住几样。"
when = [{ kind = "date", from = [1567, 1, 2] }]
speaker = "captain"
mood = "tender"
deadline = [1567, 6, 30]

[[tracks.chapters.choices]]
key = "home"
text = "回家乡港一趟，把这些年的事说给家里听"
next = "b01_new_star"
effects = [{ kind = "flag", flag = "c13_main_free_act2" }, { kind = "memory", memory = "mem-main_free-a04", title = "家乡的码头" }]
reply = "家乡的码头变了：添了一座新仓库，港务官换了一个。送我出港的那个人还站在老地方，手里拿着一根烟斗。我把日志摊在桌上，一页一页念给他听。他听到一半就不说话了，只说：你的字比走的时候小了。"

[[tracks.chapters.choices]]
key = "further"
text = "继续往远处走，下一张海图再大一点"
next = "b01_new_star"
effects = [{ kind = "flag", flag = "c13_main_free_act2" }, { kind = "skill", skill = "rigging", value = 20 }]
reply = "我把新买的大海图钉在舱壁上，旧图卷起来塞进箱底。水手们说，船长的箱子越来越像书店，我没理，只把钉子又敲紧了一下。"

[[tracks.chapters.choices]]
key = "rest"
text = "把船交给大副，自己在岸上歇一季"
next = "b01_new_star"
effects = [{ kind = "flag", flag = "c13_main_free_act2" }, { kind = "memory", memory = "mem-main_free-a04b", title = "岸上的一季" }]
reply = "我在岸上第三天就坐不住了，每天去码头看别人的船进出。大副回来那天，船上多了一块我没见过的补丁，补得很粗，他说是在风里撞的。"

[tracks.chapters.timeout]
next = "b01_new_star"
effects = [{ kind = "flag", flag = "c13_main_free_act2" }]

