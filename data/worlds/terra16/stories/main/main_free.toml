# B01：仙后座的新星。夜里的事，没有 at。
[[tracks.chapters]]
key = "b01_new_star"
title = "仙后座的新星"
text = "十一月的一个晴夜，值夜的水手把我叫上甲板。仙后座的 W 旁边多了一颗星，比金星还亮，也不闪。老水手说：“这是凶兆。天上多一颗，地上就少一个人。船长，绕开它走吧。”年轻的说：“是好兆，赌它明晚还在不在。”有个从亚速尔回来的渔夫抽着烟，说：“西边的雾退了一圈。”我站在船头看了那颗星很久，心里想：它不动，会动的才吓人。到了第二夜，它还在，位置一点没动。不是彗星，也不是流星。"
when = [{ kind = "date", from = [1572, 11, 11] }]
speaker = "captain"
mood = "mystic"
night = true
deadline = [1573, 4, 30]

[[tracks.chapters.choices]]
key = "measure"
text = "连着几夜量它的高度，记下它在哪两颗星之间"
next = "b02_comet"
check = { attr = "astronomy", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_free_new_star" }, { kind = "skill", skill = "astral_navigation", value = 20 }]
reply = "我量了七夜，七夜的数一样。把它记在两颗暗星中间，画上图，旁边写上夜数。后来有人说，北边一个丹麦人也这么记。夜里冷，水手替我把灯罩擦了七遍，第七遍时他说：“它还在。”"
fail = { next = "b02_comet", effects = [{ kind = "memory", memory = "mem-main_free-b01", title = "不动的那颗星" }], news = "港里的人说，那几夜云厚，有个船长只量成了一夜星，回港还在码头上骂天，说那个数字他要描粗了留着。" }

[[tracks.chapters.choices]]
key = "tavern"
text = "靠港以后在酒馆里讲给人听"
next = "b02_comet"
effects = [{ kind = "fame", value = 1 }]
reply = "酒馆里一半人不信，一半人请我喝酒。第二天有个书商找上门，问能不能把我说的印成小册子。我说先把星的位置画对了再说。有个老船工一直没说话，等人散了才凑过来，问那颗星是不是也照到了北边的冰上。"

[[tracks.chapters.choices]]
key = "ignore"
text = "照常看北极星，不去管它"
next = "b02_comet"
effects = []
reply = "我照旧量北极星定纬度，每晚两次，记在日志的同一栏里。新星亮了一年多，船一次也没偏过航，只是大副夜里总要抬头看一眼。"

[tracks.chapters.timeout]
next = "b02_comet"

[[tracks.chapters.variants]]
key = "v1_hermes"
when = [{ kind = "flag", flag = "c13_main_free_hermes_heard" }]
text = "十一月的一个晴夜，值夜的水手把我叫上甲板。仙后座的 W 旁边多了一颗星，比金星还亮，也不闪。老水手说：“这是凶兆。天上多一颗，地上就少一个人。船长，绕开它走吧。”年轻的说：“是好兆，赌它明晚还在不在。”有个从亚速尔回来的渔夫抽着烟，说：“西边的雾退了一圈。”我想起九年前书店里那个书商的话，他说，天上出了新东西，就再去问他。我站在船头看了那颗星很久，心里想：它不动，会动的才吓人。到了第二夜，它还在，位置一点没动。不是彗星，也不是流星。"

# B02：没有桨手的船。消息由酒馆传来，一章只写这一种。
[[tracks.chapters]]
key = "b02_comet"
title = "没有桨手的船"
text = "去年冬天那颗大彗星的尾巴，到正月还挂在西南的天上，一夜比一夜淡。消息是酒馆里传出来的，一句一句转到我耳朵里。掌柜一边擦杯子，一边说：“别听他的，他前天在这儿喝翻了一整桌。”港里来了一条亚速尔回来的渔船，船主喝醉了，逢人就讲：“彗星最亮那几夜，我在特塞拉岛以西看见过一条船。没有桨，没有帆，就那么走，在无风的海草上走。船上没有人，走得却很稳，像有人在水底下推。”我心里想：他说的那片海，我的图上还空着。不对，是还没画。"
when = [{ kind = "date", from = [1578, 1, 2] }]
speaker = "captain"
mood = "mystic"
night = true
deadline = [1578, 6, 30]

[[tracks.chapters.choices]]
key = "chase"
text = "记下他说的方位，等风顺了去亚速尔看看"
next = "c01_keepsake"
effects = [{ kind = "flag", flag = "c13_main_free_act3" }, { kind = "flag", flag = "c13_main_free_comet_chase" }]
reply = "我请船主又喝了一杯，把他说的方位画在一张油纸上，标出彗尾指的那一角。船主第二天酒醒了，说什么也不肯再讲，只叫我别让他看见那张图。油纸我折了四折，压在海图最底下。那个方位离我这些年走过的航线只隔着几天的风，我每晚都想拿出来看一眼。"

[[tracks.chapters.choices]]
key = "note"
text = "把彗尾指的方向记进日志就算了"
next = "c01_keepsake"
effects = [{ kind = "flag", flag = "c13_main_free_act3" }, { kind = "memory", memory = "mem-main_free-b02", title = "彗星最后的尾巴" }]
reply = "日志那一页我画了彗尾，也画了那个醉汉的手势，两手一上一下，像在按一样东西。画完我把页角折起来，没有再翻。后来有个水手凑过来问那是什么，我说是个醉鬼的手势。他说，醉鬼有时也说得准。"

[[tracks.chapters.choices]]
key = "sell"
text = "把彗星画成一张星图卖给港里的书商"
next = "c01_keepsake"
effects = [{ kind = "flag", flag = "c13_main_free_act3" }, { kind = "cash", value = 500 }]
reply = "书商把星图印成单张，彗尾画得比真的还长。落款上的名字被印错了一个字母，他说无所谓，印得出来就有人买。印出来的第三天，码头上有个孩子拿着一张跑来跑去，喊：“有船没有桨！”"

[tracks.chapters.timeout]
next = "c01_keepsake"
effects = [{ kind = "flag", flag = "c13_main_free_act3" }]

# C01：从家里带出来的东西。召请之前的一夜；信物的变体只改写物件那一段。
[[tracks.chapters]]
key = "c01_keepsake"
title = "从家里带出来的东西"
text = "闷热的夜里，我收拾舱底的箱子，翻出出海那年从家里带出来的那样东西。它裹着好几层油布，揭开时一股旧木头的气味冲上来。我把它放在灯下看，磨损的地方，上面的记号，边角的裂，一样一样都对得上。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"
when = [{ kind = "date", from = [1582, 6, 1] }]
speaker = "captain"
mood = "tender"
deadline = [1582, 8, 31]

[[tracks.chapters.choices]]
key = "take"
text = "把它包好，放进随身的箱子，带去西边"
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_main_free_keepsake" }]
reply = "我用油布包了三层，系在床头。大副问是什么宝贝，我说是家里的东西，他就没再问。夜里船一晃，它就在床头碰一下木板，我醒过来两次，每次都先摸一摸油布。"

[[tracks.chapters.choices]]
key = "leave"
text = "把它留给一个要留在岸上的人"
next = "c02_summons"
effects = [{ kind = "flag", flag = "c13_free_keepsake_left" }]
reply = "我把它交给码头上的老朋友，说等回来再拿。那人接过去，拿手按了按，说：回来我还你。我走出十几步，回头看了一眼，他还站在码头上，把东西举在手里对着太阳看。"

[[tracks.chapters.choices]]
key = "reckon"
text = "对着它，把出海那年的航线重新算一遍再带走"
next = "c02_summons"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_free_keepsake" }, { kind = "skill", skill = "cartography", value = 20 }]
reply = "我用它和旧日志把第一年的航线重画了一遍，发现当年量错了半度。难怪那一趟多走了两天，原来不是风的错。那半度我用铅笔在图上画了一条细线，画完对着灯看了很久。"
fail = { next = "c02_summons", effects = [{ kind = "flag", flag = "c13_main_free_keepsake" }], news = "港里的人说，有个船长在灯下把出海那年的航线算到半夜，有一段怎么也对不上，最后还是把东西包好带走了。" }

[tracks.chapters.timeout]
next = "c02_summons"

[[tracks.chapters.variants]]
key = "v00a_seville_given"
when = [{ kind = "flag", flag = "c13_free_seville_pilot_quadrant_given" }]
text = "闷热的夜里，我收拾舱底的箱子，翻出一张封了二十多年的考题纸。蜡已经拆了，题还在。那件象限仪早送给了考领航的孤儿，我带上的是这张纸。最近三个港口里，三个不相干的人说过同一句话，一字不差：“明年夏天，亚速尔以西。”我心里想：三个港口，三个人，说的是一样的话。我拿着它，坐到天快亮。天亮时大副来敲门，问：“船长，今天还出港吗？”"

