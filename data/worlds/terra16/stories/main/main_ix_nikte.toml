# c08 月之岛：终章，她给家乡起的名字第一次说破，三条路挑一条走到头。
[[tracks.chapters]]
key = "c08_epilogue"
title = "月之岛"
text = "旱季的傍晚，我坐在家里的货岸上，脚边是两条老独木舟，一条已经补过七回。对岸的渔村、坎佩切的同盟、湖上的人、名册上的名字，都在我心里一样一样地回来。我给家乡起的那个名字“月之岛”，在这里第一次说破。伊希切尔是接生、草药和织布的女神，岛上的人从没叫过这里月之岛。那是我小时候，看月亮从塞诺特的洞口挪过去，自己起的。我对来问的人说：“月之岛是我起的名字。岛上没人这么叫，以后也不会有人这么叫。我叫就够了。”旁边卖鱼的孩子笑起来，说这名字太长，他记不住。我看着海，心里想：最后一折上那朵花后面，总得有点什么。三条路我都已经走过一段，只是要挑一条走到头。"
when = [{ kind = "date", from = [1588, 1, 1] }]
mood = "tender"
speaker = "captain"
cast = ["ix_nikte"]

[[tracks.chapters.choices]]
key = "canoes"
text = "守住沿岸的独木舟商路，到桨拿不动为止"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_done" }, { kind = "flag", flag = "c13_main_ix_nikte_end_canoes" }, { kind = "reputation", faction = "itza", value = 2 }]
reply = "我把船队交给年轻的桨手以前，又亲自跑了一趟从坎佩切到南边河口的老路，在每一个停过船的海湾都停一下，看水色，看人。坎佩切的盐仓还在，老村子的棕榈棚还在，只是有些结已经换人打了。我教年轻的桨手，遇到穷渔镇先问一句要不要盐，再谈价。最后一次回岛，我把船靠在老庙那边的沙滩上。老渔夫的孙子跟在我后头，把每一个海湾的名字都记在了自己的木片上。记到最后一片，他抬头问我：“这一片叫什么？”我说：“还没有名字。你来起。”"

[[tracks.chapters.choices]]
key = "healer"
text = "进伊希切尔的老庙，做接生的老妇"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_done" }, { kind = "flag", flag = "c13_main_ix_nikte_end_healer" }, { kind = "skill", skill = "herbal_medicine", value = 30 }]
reply = "我跟着母亲当年的路走，背着母亲留下的药箱，一户一户地去。接下来的第一个孩子是对岸渔村的，那个村子前些年被外国船劫过，有一半人搬到了岛上。我替产妇按住肚子，替孩子擦了身，孩子落地的时候哭得很响。我把手洗了三遍，才去看产妇的脸色。名册上的人我没有一个不认得。孩子落地以后，产妇问叫什么。我说教名留给神父，家里叫的那个，由我来起。我想了一下午，起了“回来”。门口有人叫我吃饭，叫的是“妮克特”，我应了一声。"

[[tracks.chapters.choices]]
key = "scribe"
text = "替岛上和对岸的镇子写诉状，用两种字"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_done" }, { kind = "flag", flag = "c13_main_ix_nikte_end_scribe" }, { kind = "skill", skill = "lang_spanish", value = 30 }]
reply = "我的第一份诉状替对岸的渔村要回一片晒盐的海滩，写的是卡斯蒂利亚话，因为官府的人只认那一种字。玛雅话的那一份我另外抄了一本，留在岛上，给老人们念。落款的名字，照我在名册上的选择写。写完我把笔搁在墨瓶上，在坎佩切的码头等了一天，回信来了：海滩准许归还，条件是渔村每年交一袋盐。那袋盐，我替他们交。老人们听完，说这一份比神父的册子还准。我没有回嘴，只把它又念了一遍。我把回信折好，夹进那本玛雅话的诉状里，一起收在柜子底下。"

