# a10 两个证人：限期送人到港，骡队的头儿不点人。
[[tracks.chapters]]
key = "a10_witnesses"
title = "两个证人"
text = "两个马尼来的人上了我的船。一个是修家的寡妇，丈夫被吊过以后没熬过八月；一个是手腕上有绳痕的老日子祭司。他们要去墨西哥城的检审庭，把马尼的事当面说给听得懂的人。船在韦拉克鲁斯的沙滩外下锚，大船躲在乌卢阿岛背后，货靠驳船一趟一趟往岸上摆。骡队的头儿在驳船码头上点货，不点人。到了岸边，寡妇忽然问，到了墨西哥城是不是非得她自己上堂去说；她要的只是丈夫的名字有人写下来。老祭司却非走不可。头儿说：“我驮的是银子和胭脂虫。人？人要执照。”老祭司说：“我数过日子了。这一趟不走，就没有下一趟。”我说：“我不求你。我拿一袋可可豆，换你骡背上两个空位子。”"
at = "veracruz"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
objectives = [{ kind = "at", at = "veracruz", text = "把马尼的两个证人送到韦拉克鲁斯" }]
deadline_days = 150

[[tracks.chapters.choices]]
key = "pay"
text = "出一袋可可豆，雇骡队把两人都送上墨西哥城"
next = "a11_chi"
requires = [{ kind = "cash", ge = 300 }]
hint = "你的钱袋压不住骡队头儿的嘴。"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "c13_main_ix_nikte_witnesses_sent" }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "头儿掂了掂袋子，把两个人安在最后两头骡子上，算作押货的。寡妇临走拉住我，把丈夫的名字用玛雅话念了三遍，要我记住怎么念。"
news = "韦拉克鲁斯的骡队这回驮上墨西哥城的，除了银子，还有两个从尤卡坦来的老人。"

[[tracks.chapters.choices]]
key = "talk"
text = "跟头儿讲买卖：两个人算押货的，路上替他们认路"
next = "a11_chi"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_witnesses_sent" }, { kind = "fame", value = 1 }]
reply = "我把这件事说成一笔买卖。老祭司认得山路上哪口井有水，比头儿的向导还准，就当是雇他认路。头儿想了半天，说两个人算押货的，骡背上的空位子不白占。"
news = "韦拉克鲁斯的骡队头儿点了头，把一个马尼来的老人编进了押货的队伍，说是请来认路的。"

[tracks.chapters.choices.fail]
next = "a11_chi"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_witnesses_sent" }, { kind = "cash", value = -100 }]
news = "韦拉克鲁斯的骡队头儿只肯带一个人上路，另一个坐在码头的货堆上，一直坐到天黑。"

[[tracks.chapters.choices]]
key = "name_only"
text = "替寡妇把丈夫的名字写成一封信，送她回家"
next = "a11_chi"
effects = [{ kind = "skill", skill = "lang_spanish", value = 20 }, { kind = "reputation", faction = "sotuta", value = 1 }]
reply = "我借驳船码头上书记的桌子，用卡斯蒂利亚话写了一封给托拉尔主教的信。丈夫的名字写在最上面一行，字写得比平时大。信写完，她把它折成四折，贴身收进衣襟。她说主教一定会读，哪怕只读一行。"

[tracks.chapters.timeout]
next = "a11_chi"
effects = []
news = "两个从马尼来的人在韦拉克鲁斯的沙滩上等船等过了冬，最后自己走陆路回了家。"

# a11 老师站在哪一边：加斯帕尔与证词箱。
[[tracks.chapters]]
key = "a11_chi"
title = "老师站在哪一边"
text = "坎佩切的码头，去西班牙的报信船在装一只上了漆的木箱，箱子里是修士们为兰达的官司收的证词。加斯帕尔从马尼下来，亲眼看着箱子上船，里面有他的一份。他三十四了，还在修院里教孩子认字，在两种话之间来回。他请我喝一碗加辣椒的可可，问我一句话：他算不算把自己卖了。加斯帕尔说：“我替修士翻译了十年，翻到最后，我自己说哪种话都像翻译。”我说：“你教我认的字，我拿来记了马尼的名字。”他的证词里说兰达是个好老师，这句是真的。他也是马尼被吊的那几户人家的亲戚，这也是真的。"
when = [{ kind = "date", from = [1565, 1, 1] }]
at = "campeche"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte", "gaspar_antonio_chi"]
deadline = [1566, 12, 31]

[[tracks.chapters.choices]]
key = "testify"
text = "劝他再写一份：替马尼被吊的人作证"
next = "b01_ulua"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_chi_spoke" }, { kind = "affinity", person = "gaspar_antonio_chi", value = 6 }, { kind = "reputation", faction = "new_spain", value = -2 }]
reply = "我把那张纸推到他面前，说马尼被吊的人，名字总得有一个人替他们念出来。加斯帕尔没有说话，借了码头书记的桌子，用卡斯蒂利亚话写了半页。写到马尼的名字时换成玛雅话，又划掉，又写上。"
news = "坎佩切码头上，马尼来的通事在报信船开走以前，往证词箱里又塞了半页纸。"

[tracks.chapters.choices.fail]
next = "b01_ulua"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 2 }]
news = "加斯帕尔说要回马尼再想想。报信船起锚的时候，他还站在岸上，手里攥着一张没写字的纸。"

[[tracks.chapters.choices]]
key = "letters"
text = "不问官司，只问他还教不教孩子认字"
next = "b01_ulua"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 4 }, { kind = "skill", skill = "lang_latin", value = 20 }]
reply = "他笑了，拿可可碗底在桌上画了几个字母。说马尼的孩子现在会用拉丁字母写自己祖父的名字了，修士以为他们在抄经。我照着把那几个字母描了一遍。"

[[tracks.chapters.choices]]
key = "book_back"
text = "向他要回母亲那部书"
next = "b01_ulua"
requires = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_chi" }]
hint = "那部书不在他手里。"
effects = [{ kind = "item", item = "maya_inheritance_codex", qty = 1 }, { kind = "affinity", person = "gaspar_antonio_chi", value = 2 }]
reply = "他从修院的经书箱底层摸出那个包，接生布还是母亲叠的样子，三层。“我一折也没翻，”他说，“翻了，我就得翻译。”我把包放在桌上，摸了摸那三层接生布，布上母亲的针脚还在。"

[tracks.chapters.timeout]
next = "b01_ulua"
effects = []
news = "坎佩切的报信船装走了一箱尤卡坦的证词，马尼来的那位通事一直送到了跳板底下。"

