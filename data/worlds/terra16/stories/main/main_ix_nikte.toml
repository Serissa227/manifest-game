# a09 火灭了以后：结果回响，两项按 HIST 互斥。
[[tracks.chapters]]
key = "a09_mani_echo"
title = "火灭了以后"
text = "九月，雨下得正密。我坐在船舱里，面前摊着可可账本，一页一页地翻。科苏梅尔来的桨手带了消息：新来的托拉尔主教八月到了梅里达，叫停了兰达的审问，放了人。桨手说：“主教说，再吊人就是他吊。”我（心里）：一部、两部……我把手指头掰了三遍，还是那个数。"
when = [{ kind = "date", from = [1562, 9, 1] }]
speaker = "captain"
mood = "sad"
cast = ["ix_nikte"]

[[tracks.chapters.choices]]
key = "more_saved"
text = "数一数：从火边抢下来的书，比他们以为的多"
next = "a10_witnesses"
requires = [{ kind = "flag", flag = "r03_mani_codices_people_and_codices_sheltered" }]
hint = "火边的事，你听到的只有灰。"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-a09", title = "马尼的火" }, { kind = "fame", value = 1 }]
reply = "各村的人陆续划船来报：这家的墙里还有一部，那家埋在玉米窖里一部，有一部顺着河漂到了海边，被渔夫捞起来晒干了。我把这些书的名字记在账本背面，记的是藏书人家的名字。"

[[tracks.chapters.choices]]
key = "ashes"
text = "只剩灰：把记得的那些名字念一遍"
next = "a10_witnesses"
requires = [{ kind = "flag", flag = "r03_mani_codices_people_and_codices_sheltered", value = false }]
hint = "有人说火边有书被抢了出来，不是你听说的这一回。"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-a09", title = "马尼的火" }]
reply = "回岛的独木舟上，我让桨手停桨，把能记起来的被审者的名字念了一遍。念一个，船头的老桨手就拿桨敲一下船舷。念完，海上很静。有几个名字我念错了，船头的老桨手没有纠正，只又敲了一下船舷。"

