# a06 同盟的价：限期交货，代理人的条子写错了名字。
[[tracks.chapters]]
key = "a06_salt_run"
title = "同盟的价"
text = "同盟的第一船盐到了坎佩切。监护主的代理人带着两个兵，等在跳板下面，手里一张盖了印的纸：盐按去年的价，一袋不许多要。沿岸最穷的两个渔镇派来的人蹲在盐仓门口，他们的独木舟让风暴打坏了，今年交不出同盟的份子。纳奇·科科姆的人在一旁看我怎么办。代理人把纸往我面前一递：“小姑娘，回去问问你父亲，这张条子值多少船盐。”纸上写的是父亲的名字，不是我的。我说：“船是我开来的。条子上的名字，您写错了。”"
at = "campeche"
speaker = "captain"
mood = "cheerful"
cast = ["ix_nikte", "nachi_cocom"]
objectives = [{ kind = "goods", good = "salt", qty = 20, at = "campeche", text = "把同盟的二十袋盐运到坎佩切" }]
deadline_days = 180

[[tracks.chapters.choices]]
key = "keep_price"
text = "按同盟定的价交进同盟的仓"
next = "a07_codex"
effects = [{ kind = "cash", value = 400 }, { kind = "reputation", faction = "sotuta", value = 3 }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "代理人的脸色变了。我把那张条子接过来，揉成一团扔进水里，说：“盐按同盟的价收，一袋不少。”当晚纳奇的人就划船回内陆报信，第二天同盟的另外几条船也照这个价卸了货。"
news = "坎佩切码头上，监护主的代理人那张免检的条子被一个科苏梅尔的女船主扔进了海里。"

[[tracks.chapters.choices]]
key = "sell_agent"
text = "压价卖给代理人，收下那张免检的条子"
next = "a07_codex"
effects = [{ kind = "cash", value = 600 }, { kind = "reputation", faction = "new_spain", value = 2 }, { kind = "reputation", faction = "sotuta", value = -4 }]
reply = "我把条子上的名字改成了自己的，一笔一笔地描。代理人笑着收下盐钱，把条子折好放进袖子里。纳奇的人一句话没说，转身就走。第二年同盟的绳子上，科苏梅尔那个结被人解开过，又系上了，系得很松。"
news = "坎佩切的玛雅商人说，科苏梅尔的小姑娘卖了同盟的盐，拿了代理人的免检条子，纳奇的人一句话没说就走了。"

[[tracks.chapters.choices]]
key = "poor_towns"
text = "按约交仓，再多卸一成白给两个穷镇"
next = "a07_codex"
effects = [{ kind = "cash", value = 250 }, { kind = "fame", value = 2 }, { kind = "reputation", faction = "sotuta", value = 2 }, { kind = "flag", flag = "c13_main_ix_nikte_salt_poor" }]
reply = "我按同盟的价把盐交进仓，又让人卸下一成，搬到两个渔镇的人肩上。他们扛着盐走了，一句谢也没说，大概不知道该怎么谢一个比自己孙女还小的船主。第二年雨季，我的独木舟在他们的海湾避风，岸上有人送来一罐腌好的鱼。"
news = "坎佩切的盐仓门口，两个渔镇的人扛着白给的盐走了，一句谢也没有。"

[tracks.chapters.timeout]
next = "a07_codex"
effects = []
news = "坎佩切的玛雅商人等了半年，同盟的第一船盐还是没到，监护主的代理人照旧按去年的价收。"

[[tracks.chapters.variants]]
key = "v1_lead"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_alliance_lead" }]
text = "同盟的第一船盐到了坎佩切。盐袋上烙着同盟的记号，是一个结，是我定的。监护主的代理人带着两个兵，等在跳板下面，手里一张盖了印的纸：盐按去年的价，一袋不许多要。沿岸最穷的两个渔镇派来的人蹲在盐仓门口，他们的独木舟让风暴打坏了，今年交不出同盟的份子。纳奇·科科姆的人在一旁看我怎么办。代理人把纸往我面前一递：“小姑娘，回去问问你父亲，这张条子值多少船盐。”纸上写的是父亲的名字，不是我的。我说：“船是我开来的。条子上的名字，您写错了。”"

# a07 接生布里的书：母亲的包，揭开家里的旧书。
[[tracks.chapters]]
key = "a07_codex"
title = "接生布里的书"
text = "五月底，雨季前最闷的几天，坎佩切的海滩上连风都是热的。母亲搭着家里的独木舟过海来了，怀里抱着一个用接生布裹了三层的包。加斯帕尔·安东尼奥·奇从马尼一路走到海边。他是兰达修士最得意的学生，也是当年在修院前院偷偷教我拉丁字母的人。他带来的消息是：修士在马尼的山洞里搜出了神像，正一村一村地问，问不出来就把人吊起来。加斯帕尔说：“我替兰达修士翻过一百个词，没有一个是‘烧’。”包里是一部树皮纸折成的屏风书，一折一代人：谁娶了谁，哪片可可园归哪家，跟邻镇许过什么约。母亲把它藏在接生的床底下，藏了二十年。母亲说：“修士翻得到床，翻不到海。你是走海的。”我这才知道，自己从小睡的那张床底下压着一整部家谱。母亲只说了一句：“你的名字也在里面。最后一折。”"
when = [{ kind = "date", from = [1562, 5, 1] }]
at = "campeche"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "gaspar_antonio_chi"]
deadline = [1562, 6, 30]

[[tracks.chapters.choices]]
key = "ship"
text = "带上船：船走到哪，书跟到哪"
next = "a08_mani"
effects = [{ kind = "item", item = "maya_inheritance_codex", qty = 1 }, { kind = "flag", flag = "c13_main_ix_nikte_codex_ship" }, { kind = "flag", flag = "c13_main_ix_nikte_lever_r03" }, { kind = "memory", memory = "mem-main_ix_nikte-a07", title = "接生布里的书" }]
reply = "我把包塞进船尾压舱石底下那个装淡水的空罐，罐口用蜂蜡封死。母亲看着我封，说我父亲当年藏可可豆也是这样。封好以后，我把罐子搬到自己睡的舱位底下，夜里伸手就能摸到。"

[[tracks.chapters.choices]]
key = "cenote"
text = "让母亲带回岛上，封蜡沉进塞诺特"
next = "a08_mani"
effects = [{ kind = "item", item = "maya_inheritance_codex", qty = 1 }, { kind = "flag", flag = "c13_main_ix_nikte_codex_cenote" }, { kind = "flag", flag = "c13_main_ix_nikte_lever_r03" }, { kind = "memory", memory = "mem-main_ix_nikte-a07", title = "接生布里的书" }]
reply = "我教母亲怎么封蜡，怎么在石头底下打结。她说包要带回岛上，我说就沉在岛上我小时候游泳的那口塞诺特里，沉到水底最黑的一块石头下面。她看了我很久，说：“你在水里比在岸上像我。”"

[[tracks.chapters.choices]]
key = "chi"
text = "交给加斯帕尔，请他“代为翻译”"
next = "a08_mani"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_chi" }, { kind = "affinity", person = "gaspar_antonio_chi", value = 5 }, { kind = "memory", memory = "mem-main_ix_nikte-a07", title = "接生布里的书" }]
reply = "加斯帕尔接过包，没有打开，先用两种话说了一遍谢：卡斯蒂利亚话一遍，玛雅话一遍，第二遍说得慢。母亲一路没跟他讲话。回到船上，我一路都没有问他拿到那个包以后会怎么做。"

[tracks.chapters.timeout]
next = "a08_mani"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_home" }]
news = "坎佩切的玛雅人说，马尼那边在搜旧东西，好几家接生婆连夜把床挪了地方。"

# a08 新年头一天的火：马尼的焚书，救人还是救书。
[[tracks.chapters]]
key = "a08_mani"
title = "新年头一天的火"
text = "我从坎佩切上岸，走三天的路进内陆，到马尼。七月十二日，修院前的广场上堆着收来的书和神像。被审过的人穿着罚衣站成一排，有人的胳膊吊不直。兰达修士站在台阶上讲道，加斯帕尔站在人群后头，不往台阶那边看。老人们说，那五天没名字的日子刚过，这一天是新年的头一天：六 Manik。兰达说：“这里头没有一个字不是谎话。”加斯帕尔低声说，不看我：“别在这儿哭。哭的人他们也记。”我数了，七个人站不直。火点起来以后，一个被吊伤的老人从罚衣底下摸出一卷没交的书，往人堆外递。递到的正好是我。"
window = [[1562, 7, 1], [1562, 8, 31]]
at = "campeche"
stage = "involve"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte", "diego_de_landa", "gaspar_antonio_chi"]
news = "马尼的修院前，修士把各村收来的书和神像堆起来点了火，烧了整整一天。"

[tracks.chapters.default]
next = "a09_mani_echo"
effects = []

[[tracks.chapters.choices]]
key = "smuggle"
text = "趁着火，把三部书和一户人家从玉米地里送走"
next = "a09_mani_echo"
check = { attr = "command", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_saved_books" }, { kind = "reputation", faction = "new_spain", value = -5 }, { kind = "reputation", faction = "itza", value = 2 }]
reply = "桨手们扮成挑柴的，三个包裹压在柴底下，一家五口跟在后头，天黑前走出了玉米地。到了海边我才发现，一路上我没说过一句话。"
news = "马尼焚书那天，有人看见一队挑柴的从玉米地里往坎佩切的海边去，柴捆比平常高了一截。"

