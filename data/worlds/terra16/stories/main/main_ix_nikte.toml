# f4 书里的路：主教兰达给她看他书里的字母表；岛上一个老接生婆的像在主教府后院。读双生子旁轨的 rw_ix_nikte_mother_penance 与字母线的 rw_ix_nikte_be_road（三段变体互斥）。
[[tracks.chapters]]
key = "f4_bishop"
title = "书里的路"
text = "主教的人从各村收走的东西，堆在梅里达主教府的后院。岛上一个老接生婆的伊希切尔小像也在里头，是巡视员从她床底下拖出来的。我进城去求。兰达在书房里见我，桌上摊着一本手抄的书，他翻到一页给我看：一行西班牙字母，每个字母旁边画着一个我们的老画字。“这是我在托莱多写的。”他指着其中一个，是一只脚印踩在路上，“你认得吗？我念的是‘贝’。”他合上书，这才问我来做什么。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "date", from = [1574, 4, 1] }]
at = "campeche"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "diego_de_landa"]
deadline = [1576, 12, 31]

[[tracks.chapters.choices]]
key = "plead"
text = "求他还那尊像：老人只是想让孩子平安"
next = "f4b_lightest_word"
check = { attr = "eloquence", base = 40, per = 8 }
effects = [{ kind = "reputation", faction = "new_spain", value = 1 }, { kind = "flag", flag = "rw_ix_nikte_idol_boxed" }]
reply = "他听完，把手搁在书上：“像不能还。可我不让她跪。”他叫人从后院取来那尊小像，当着我的面放进一只木盒，钉上钉子。“它跟我的书一样，在这里待着。等哪天没有人拜了，它就是一块好看的石头。”他说这是慈悲，他是真这么想的。"

[tracks.chapters.choices.fail]
next = "f4b_lightest_word"
effects = [{ kind = "reputation", faction = "new_spain", value = -1 }]
news = "梅里达主教府后院那一堆偶像，听说过了圣灵降临节，一齐砸碎了。"

[[tracks.chapters.choices]]
key = "take_it"
text = "说：像交给我，我拿去沉进海里"
next = "f4b_lightest_word"
effects = [{ kind = "reputation", faction = "new_spain", value = -1 }, { kind = "fame", value = 1 }]
reply = "他看了我很久：“你会沉吗？”我说会，沉进塞诺特。他笑了：“塞诺特。你们的神最喜欢的地方。”像他到底没给。他只答应，那个老接生婆的罚减去一半，礼拜天在教堂门口站半个时辰。他送我到门口：“我在救她，你也在救她。我们俩用的不是一种绳子。”"

[[tracks.chapters.choices]]
key = "pay"
text = "替老人交罚金，像不要了"
next = "f4b_lightest_word"
requires = [{ kind = "cash", ge = 300 }]
hint = "你身上的钱，抵不了主教府的罚。"
effects = [{ kind = "cash", value = -300 }, { kind = "reputation", faction = "new_spain", value = 2 }]
reply = "管账的修士收了钱，在一本厚册子上记了一行。那尊小像我没再问。走出主教府，后院传来锤子的声音，一下，两下。我没有回头数。回岛的船上，我一直想着册子上那一行：一个名字，后面跟着一个数。"

[tracks.chapters.timeout]
next = "f4b_lightest_word"
effects = []
news = "梅里达主教府的后院堆着各村收来的东西，听说主教亲自一件件看过，才叫人搬走。"

