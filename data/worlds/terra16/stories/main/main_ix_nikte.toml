# ── 第三幕 1578—1590 更远之处 ──

# c01 钟敲了一整天：兰达去世的消息，码头上的一句转述。
[[tracks.chapters]]
key = "c01_landa_dies"
title = "钟敲了一整天"
text = "坎佩切的码头，五月。梅里达的消息顺着驿路下来：主教兰达四月底死了。城里的西班牙人去教堂，钟敲了一整天。码头上卸鱼的玛雅人照常卸鱼，只是比平常安静。那天是五 Ik，风的日子。一个卸鱼的老人说：“他把我们的日子记进了他的书，又把我们的书烧了。账是两笔。”"
