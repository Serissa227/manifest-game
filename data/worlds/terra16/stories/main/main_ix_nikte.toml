# c07 三个老妇：伊希切尔节，空龛前的一句问话。
[[tracks.chapters]]
key = "c07_ixchel"
title = "三个老妇"
text = "伊希切尔的节日，从前全尤卡坦的女人划船过海来朝圣，获准进庙的只有上了年纪的老妇人。今年来的只有岛上的三个，最小的也六十多了，走一段台阶歇一回。她们叫我走在后头捧柯巴脂。我已经不是进庙的年纪，也不再是孩子。今天正好是我的生日，春分的海边，塞诺特里的水最清的那天，一五八七年三月二十一日，五 Men。领头的老妇说：“台阶还是那么多级。是我们的腿变短了。”我心里想：四十七年前，我是被一个这样的老妇人接到这世上来的。走到空龛前，领头的老妇回头看我，问那部书去了哪里。"
window = [[1587, 3, 1], [1587, 5, 31]]
at = "cozumel"
stage = "witness"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte"]
news = "科苏梅尔的伊希切尔节今年只来了三个老妇人，商队首领家的女儿替她们捧着香走在后头。"

[tracks.chapters.default]
next = "c08_epilogue"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-c07", title = "三个老妇" }]

