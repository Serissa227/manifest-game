reply = "我提着母亲的药箱，走到排成一排的人跟前，先从肩膀上最重的那个开始，用母亲的法子给吊伤的肩膀敷草药，一个一个敷过去。加斯帕尔替我跟看守说了一句话，看守就不再拦了。"
news = "马尼的修院前，一个科苏梅尔来的姑娘给吊伤的人敷草药，看守也不拦了。"

[tracks.chapters.choices.fail]
next = "a09_mani_echo"
effects = [{ kind = "reputation", faction = "new_spain", value = -1 }]
news = "马尼的看守把草药罐踢翻在地上，把一个科苏梅尔来的姑娘赶出了广场。"

[[tracks.chapters.choices]]
