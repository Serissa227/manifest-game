# ── 第二幕 1567—1577 潮涌 ──

# b01 乌卢阿岛的号声：历史现场，英格兰船队与新总督船队背靠背。
[[tracks.chapters]]
key = "b01_ulua"
title = "乌卢阿岛的号声"
text = "九月中，风暴刚过，英格兰的船队拖着破帆躲进了乌卢阿岛背风的一侧。第二天，新总督的船队也到了港口外，两边说好互不动手。我的独木舟在浅水里替人摆渡淡水与盐。第三夜，一条英格兰小艇摸到我船边讨水。我问：“你是谁派来的？”舵上坐着个二十八岁的年轻人，他说：“你从哪个方向来？要是见过西班牙人的船，就先说那个，别的事可以等。”小艇尾上另一个人说：“先报个数：你的船多少条，几个桨手，肯不肯卖水？”我看见炮台上的人趁夜换成了穿船队号衣的兵。休战是假的。"
window = [[1568, 9, 16], [1568, 10, 15]]
at = "veracruz"
stage = "involve"
speaker = "captain"
mood = "tense"
night = true
cast = ["ix_nikte", "john_hawkins", "francis_drake"]
news = "韦拉克鲁斯外的乌卢阿岛打了一仗，英格兰人只逃出去两条船，岸上丢下了一百来个人。"

[tracks.chapters.default]
next = "b02_corsairs"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }]

[[tracks.chapters.choices]]
key = "warn"
text = "划去告诉英格兰人：炮台上的人换了"
next = "b02_corsairs"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "reputation", faction = "england", value = 4 }, { kind = "reputation", faction = "new_spain", value = -4 }, { kind = "flag", flag = "c13_main_ix_nikte_lever_h33" }]
reply = "我让桨手把桨叶裹上布，贴着水划过去。霍金斯听完没有道谢，先向我要了三桶水，又问我叫什么。我报了“伊希·妮克特”，他念了两遍，都没念对。"
news = "韦拉克鲁斯外的乌卢阿岛，夜里有条玛雅独木舟给英格兰人送了信，天亮以后，号声还是响了。"

[[tracks.chapters.choices]]
key = "ferry"
text = "替西班牙船队把兵摆渡上岛"
next = "b02_corsairs"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "reputation", faction = "new_spain", value = 4 }, { kind = "reputation", faction = "england", value = -4 }, { kind = "cash", value = 300 }]
reply = "我的独木舟一趟载六个兵，没有一个兵敢在船上站起来。最后一趟，我看见火船从上风漂下来，照亮了那个讨过水的年轻人的脸。我把船掉头划走，没有回头。"
news = "韦拉克鲁斯外的乌卢阿岛，西班牙人的兵是一趟一趟由一条玛雅独木舟摆渡上岸的，英格兰人在水上一个也没拦。"

[[tracks.chapters.choices]]
key = "rescue"
text = "仗打完以后，去浅水里捞落水的人，不问是哪一边的"
next = "b02_corsairs"
check = { attr = "seamanship", base = 35, per = 6 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "fame", value = 3 }, { kind = "reputation", faction = "england", value = 1 }, { kind = "reputation", faction = "new_spain", value = 1 }]
reply = "我把独木舟划进浅水，伸手一个一个往船上拉，不问穿的是哪一边的号衣。英格兰人和西班牙人在我的船上谁也不看谁，只伸手跟我要水。"
news = "乌卢阿岛外的浅水里，一条玛雅独木舟捞起了十一个人，英格兰人四个，西班牙人七个。"

[tracks.chapters.choices.fail]
next = "b02_corsairs"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "fame", value = 1 }]
news = "乌卢阿岛外浪太大，一条玛雅独木舟只拉上来三个人，第四个的手从船边滑了下去。"

# b02 底舱里的人：打赢一场海战以后，被掳的渔村人在船底。
[[tracks.chapters]]
key = "b02_corsairs"
title = "底舱里的人"
text = "乌卢阿那个夏天以后，尤卡坦东岸多了挂外国旗的小船。对岸一个渔村的人被掳走了十几个，要卖到岛上的种植园去。那一仗以后，我在被俘的船的底舱里找到了他们，手脚都绑着。有个女人认出了我的独木舟，她说：“你是科苏梅尔接生婆的女儿。你娘接过我的孩子。”桨手在舱门口说：“船上的铁锚够打三十把斧子。”我说：“先松绑。别的等人都喝上水再说。”投降的人里最年轻的那个，手上缠着布条，布条是渔村女人织的花样。他用抢来的布包伤口。"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
objectives = [{ kind = "battle", wins = 1, text = "打赢一场海战" }]
deadline_days = 180

[[tracks.chapters.choices]]
key = "officials"
text = "把人送回渔村，船和水手交给坎佩切的官"
next = "b03_census"
effects = [{ kind = "reputation", faction = "new_spain", value = 2 }, { kind = "fame", value = 2 }, { kind = "cash", value = 200 }]
reply = "坎佩切的官给了赏钱，当天就在海滩上立了绞架。我领了钱就开船，没等到行刑。被押上岸的人里，那个缠着花布条的年轻人一直回头看着我的船，直到船拐出了港口。"
news = "坎佩切的海滩上当天立了绞架，科苏梅尔的独木舟送回了东岸渔村被掳的十几个人。"

[[tracks.chapters.choices]]
key = "let_go"
text = "放投降的水手划小艇走，不交官府"
next = "b03_census"
effects = [{ kind = "reputation", faction = "france", value = 2 }, { kind = "reputation", faction = "new_spain", value = -2 }]
reply = "我给了他们一桶水、一支桨，指了往北的方向：“再来，我就不问了。”那个缠着花布条的年轻人回头看了一眼，被同伴按下了头。那条小艇划出了两里，我看见他们在水上停了很久，才往北去。"

[[tracks.chapters.choices]]
key = "strip"
text = "把船上的帆和铁器卸下来，分给对岸的渔村"
next = "b03_census"
effects = [{ kind = "cash", value = 150 }, { kind = "fame", value = 1 }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "渔村用那张帆补了三条独木舟，铁锚打成了鱼钩。官府后来来问船的下落，村里人都说是让风刮走的。我的桨手们把船上的桨一根一根数过，少了一根，没人说破。"

[tracks.chapters.timeout]
next = "b03_census"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_village_burned" }]
news = "尤卡坦东岸一个渔村让外国船烧了，村里的人有一半划船过海，去了科苏梅尔。"

[[tracks.chapters.variants]]
key = "v1_poor"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_salt_poor" }]
text = "乌卢阿那个夏天以后，尤卡坦东岸多了挂外国旗的小船。对岸一个渔村的人被掳走了十几个，要卖到岛上的种植园去。那一仗以后，我在被俘的船的底舱里找到了他们，手脚都绑着。有个女人认出了我的独木舟。她是当年白拿过我一成盐的穷渔镇的人，她说：“你是科苏梅尔接生婆的女儿。你娘接过我的孩子。那罐腌鱼，今年怕是送不成了。”桨手在舱门口说：“船上的铁锚够打三十把斧子。”我说：“先松绑。别的等人都喝上水再说。”投降的人里最年轻的那个，手上缠着布条，布条是渔村女人织的花样。他用抢来的布包伤口。"

# b03 名册上的名字：witness，神父挨家登记，她认得每一个名字。
[[tracks.chapters]]
key = "b03_census"
title = "名册上的名字"
text = "旱季，阿森西奥神父带着一个书记过海来，挨家挨户登记：家主、妻子、孩子，名字写成教名加玛雅姓。岛上两个村子，三四百人。我跟在书记后头走了一个上午。每一个名字我都认得：这个是我跟着母亲接生下来的，这个欠我家半季的可可，这个是去年在塞诺特里差点淹死、被我捞上来的。书记念了一个名字：“迪耶戈·帕特。下一个。”他写到一个刚满月的婴儿，问叫什么。母亲答不上来，孩子还没取教名。我替她答了一个名字。神父说：“这个岛，比册子上写的小。”我心里想：一页纸，写下了一个村子。我小时候以为它要一整片海才装得下。一五七〇年三月二十日，六 Men。"
window = [[1570, 3, 1], [1570, 5, 31]]
at = "cozumel"
stage = "witness"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte"]
news = "科苏梅尔来了个神父挨家挨户记名字，岛上两个村子，一个上午就记完了一个。"

[tracks.chapters.default]
next = "b04_two_names"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-b03", title = "名册上的名字" }]

[[tracks.chapters.variants]]
key = "v1_burned"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_village_burned" }]
text = "旱季，阿森西奥神父带着一个书记过海来，挨家挨户登记：家主、妻子、孩子，名字写成教名加玛雅姓。岛上两个村子，三四百人。我跟在书记后头走了一个上午。每一个名字我都认得：这个是我跟着母亲接生下来的，这个欠我家半季的可可，这个是去年在塞诺特里差点淹死、被我捞上来的。对岸烧了的那个渔村，有十几个人这两年搬到了岛上，书记把他们也写了进来，写在最后一页。书记念了一个名字：“迪耶戈·帕特。下一个。”他写到一个刚满月的婴儿，问叫什么。母亲答不上来，孩子还没取教名。我替她答了一个名字。神父说：“这个岛，比册子上写的小。”我心里想：一页纸，写下了一个村子。我小时候以为它要一整片海才装得下。一五七〇年三月二十日，六 Men。"

# b04 两个名字：involve，普查名册上写哪个名字。
[[tracks.chapters]]
key = "b04_two_names"
title = "家里叫的名字"
text = "轮到我家。书记翻开梅里达修院学校带来的旧名册，对照着，指了一行：“玛丽亚。没错吧？”神父点头。门口，母亲在叫我，叫的是“妮克特”。棕榈棚下的桌子上只有一支笔、一瓶墨。书记蘸了一次墨，又把笔放下，等我开口。名册要送去梅里达，以后收贡赋、派工、受洗、下葬，都照这一行。母亲在门外说：“妮克特，饭凉了。”我心里清楚，这两个名字不是一个人的两种叫法，是两个人。我说：“写一个，另一个就没了。纸只认一个。”"
window = [[1570, 3, 15], [1570, 7, 31]]
at = "cozumel"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
news = "科苏梅尔的普查名册送去了梅里达，岛上没有一个人的名字是自己家里叫的那个。"

[tracks.chapters.default]
next = "b05_french_boy"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_name_maria" }]

[[tracks.chapters.choices]]
key = "maria"
text = "写“玛丽亚”"
next = "b05_french_boy"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_name_maria" }, { kind = "reputation", faction = "new_spain", value = 2 }]
reply = "书记照抄了一行。母亲在门外没再叫。晚上吃饭的时候，母亲照旧叫我“妮克特”，我照旧答应。纸上的人和饭桌边的人，从此分开住。名册合上的时候，书记又按了一次红章。"

[[tracks.chapters.choices]]
key = "both"
text = "请神父两个都写：教名在前，家里的名字在后"
next = "b05_french_boy"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_name_both" }]
reply = "我说“妮克特”是我们话里的一种花，修院的院子里也种着。神父想了想，说圣母也爱花，就叫书记在后面添了一个词。神父说这一行要重写，书记又蘸了一次墨，墨干得慢，我等了很久。"

[tracks.chapters.choices.fail]
next = "b05_french_boy"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_name_maria" }]

[[tracks.chapters.choices]]
key = "ix"
text = "只写伊希·妮克特"
next = "b05_french_boy"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_name_ix" }, { kind = "reputation", faction = "new_spain", value = -2 }]
reply = "书记的笔停在半空，看神父。神父看了我很久，说这一行他不签字。书记还是写了，写得很小，挤在格子边上，像一个不该在那儿的人。门口的母亲没有进来，只把一碗饭放在了台阶上。"

