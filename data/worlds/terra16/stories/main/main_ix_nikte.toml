[[tracks.chapters.variants]]
key = "v1_chi_holds"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_chi" }]
text = "我从坎佩切上岸，走三天的路进内陆，到马尼。七月十二日，修院前的广场上堆着收来的书和神像。被审过的人穿着罚衣站成一排，有人的胳膊吊不直。兰达修士站在台阶上讲道，加斯帕尔站在人群后头，不往台阶那边看。加斯帕尔的袖口鼓着一块，我认得那是母亲的接生布。他今天一直把手背在身后。老人们说，那五天没名字的日子刚过，这一天是新年的头一天：六 Manik。兰达说：“这里头没有一个字不是谎话。”加斯帕尔低声说，不看我：“别在这儿哭。哭的人他们也记。”我数了，七个人站不直。火点起来以后，一个被吊伤的老人从罚衣底下摸出一卷没交的书，往人堆外递。递到的正好是我。"

