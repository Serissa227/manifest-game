# f4b 还是最轻的那个词：主教府的审问里，加斯帕尔替人翻话（接养成期齐的笔 n1）。读 rw_ix_nikte_chi_light / _chi_pressed（互斥）。
[[tracks.chapters]]
key = "f4b_lightest_word"
title = "还是最轻的那个词"
text = "主教府的审问一年比一年少，可没有停。六月，岛上一个老渔夫被人告在船底藏了一尊石像，押到梅里达问话，翻话的是加斯帕尔，作保的是我，站在门边。主教坐在上头，问得又快又软，像在哄孩子。老渔夫说：“那是我出海前要摸一摸的。”加斯帕尔顿了一下，翻成了一句什么。他四十五了，翻话的时候还是那样，先把一个词在心里掂两回。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "date", from = [1576, 6, 1] }]
at = "campeche"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "gaspar_antonio_chi", "diego_de_landa"]
deadline = [1578, 12, 31]

[[tracks.chapters.choices]]
key = "listen"
text = "听他怎么翻"
next = "f5_last_medicine"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 3 }, { kind = "reputation", faction = "new_spain", value = 1 }]
reply = "他翻的是：“他说那是一块压舱的石头，出海前摸一摸，好知道船稳不稳。”主教笑了，罚老渔夫捐一桶灯油给教堂，放他走了。出了门，加斯帕尔没看我：“二十年了，我手里还是那杆秤。只是秤砣越来越轻，我越来越重。”"

[[tracks.chapters.choices]]
key = "cut_in"
text = "抢在他前头，用卡斯蒂利亚话替老渔夫答"
next = "f5_last_medicine"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = -2 }, { kind = "reputation", faction = "new_spain", value = -1 }, { kind = "fame", value = 1 }]
reply = "我说那是压舱石，岛上的船都有。主教看了我一眼，又看加斯帕尔：“玛丽亚替你翻了。”加斯帕尔低下头，说是。老渔夫放了，罚一桶灯油。夜里加斯帕尔来找我，只说了一句：“下回别抢。你抢一回，他就记住我慢了一回。”"

[[tracks.chapters.choices]]
key = "ask_after"
text = "等散了，问他：你到底翻的是什么"
next = "f5_last_medicine"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 2 }, { kind = "skill", skill = "lang_spanish", value = 10 }]
reply = "“我翻的是真话，”他说，“老人摸那尊像，是为了心里稳；压舱石也是为了船稳。两样都是稳。”他把手揣进袖子，“主教信了，老人回家了。这一句里没有一个词是假的，可我知道它是什么。”"

[tracks.chapters.timeout]
next = "f5_last_medicine"
effects = []
news = "梅里达主教府这一年又审了几个藏像的人，翻话的都是那个马尼来的老通事。"

[[tracks.chapters.variants]]
key = "rw_light"
when = [{ kind = "flag", flag = "rw_ix_nikte_chi_light" }]
text = "主教府的审问一年比一年少，可没有停。六月，岛上一个老渔夫被人告在船底藏了一尊石像，押到梅里达问话，翻话的是加斯帕尔，作保的是我，站在门边。主教坐在上头，问得又快又软，像在哄孩子。老渔夫说：“那是我出海前要摸一摸的。”加斯帕尔顿了一下，翻成了一句什么。我十四岁那年在修院门外谢过他一回，他说，最轻的那个词，也可能是一根绳子。他四十五了，翻话的时候还是那样，先把一个词在心里掂两回。"

[[tracks.chapters.variants]]
key = "rw_pressed"
when = [{ kind = "flag", flag = "rw_ix_nikte_chi_pressed" }]
text = "主教府的审问一年比一年少，可没有停。六月，岛上一个老渔夫被人告在船底藏了一尊石像，押到梅里达问话，翻话的是加斯帕尔，作保的是我，站在门边。主教坐在上头，问得又快又软，像在哄孩子。老渔夫说：“那是我出海前要摸一摸的。”加斯帕尔顿了一下，翻成了一句什么。我十四岁那年在修院门外追问过他，为什么不照翻；他说，字有轻重，他手里拿着秤。他四十五了，翻话的时候还是那样，先把一个词在心里掂两回。"

# f5 最后一包药：主教病重，她带着母亲的方子进城（1579 年 4 月底兰达死于梅里达，c01 的消息在 5 月）。
[[tracks.chapters]]
key = "f5_last_medicine"
title = "最后一包药"
text = "正月，加斯帕尔从梅里达捎来口信：主教病了，西班牙郎中给他放了几回血，越放越虚。“你母亲的方子，也许用得着。他不会喝，可也许会。”我带着母亲配的药进了城。兰达躺在修院一间小屋里，屋里只有一张木床、一个十字架、一摞书。他五十五了，手瘦得只剩骨节。他认出我，用玛雅话问：“我们的老人快死的时候，说什么？”"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1579, 1, 15] }]
at = "campeche"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte", "diego_de_landa", "gaspar_antonio_chi"]
deadline = [1579, 4, 25]

[[tracks.chapters.choices]]
key = "leave_med"
text = "把药留下，教看护的修士怎么煎"
next = "f6_after_bells"
effects = [{ kind = "skill", skill = "herbal_medicine", value = 15 }, { kind = "flag", flag = "rw_ix_nikte_landa_medicine" }]
reply = "我教看护的年轻修士：水煮到剩一半，温着喂，一天三回。兰达听着，没说喝，也没说不喝。我走到门口，听见他在身后说：“你母亲的手，比我的书管用。这话别告诉主教府的人。”我说您就是主教。他笑了，咳了很久。"

[[tracks.chapters.choices]]
key = "answer"
text = "照实告诉他：老人说，我要去井底下了"
next = "f6_after_bells"
effects = [{ kind = "skill", skill = "lang_yucatec", value = 10 }]
reply = "他闭着眼听，听完说：“井底下。我烧了那么多书，就是不想让他们去井底下。”过了一会儿，他又说：“玛丽亚，你说，他们到了井底下，会不会遇见我？”我说井底下的人不认得修士。他像是放心了，又像是没有。"

[[tracks.chapters.choices]]
key = "ask_regret"
text = "问他：马尼的火，您后悔吗"
next = "f6_after_bells"
effects = [{ kind = "flag", flag = "rw_ix_nikte_landa_regret" }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "他睁开眼，看着屋顶的椽子，看了很久。“后悔，”他说，“后悔没早来二十年。早来二十年，他们从小就认得天主，用不着烧那么多。”他说得很慢，很真。我站在床边，手里的药包攥出了汗，到底没把它放下。"

[tracks.chapters.timeout]
next = "f6_after_bells"
effects = []
news = "梅里达的人说，主教病得起不来床，西班牙郎中给他放了三回血。"

# f6 钟敲过以后：加斯帕尔带来主教留下的一本小册子。读字母线的 rw_ix_nikte_booklet_returned / _kept（互斥），终章 next = done。
[[tracks.chapters]]
key = "f6_after_bells"
title = "钟敲过以后"
text = "主教下葬以后，加斯帕尔来坎佩切找我。他如今在梅里达替官府当通事，替玛雅人打官司，也替西班牙人翻诉状，头发白了一半。他说修士们收拾主教的屋子，那本画着字母的书，听说早年留在了西班牙。“他记下的东西会比我们活得久，”加斯帕尔说，“比我们的书活得久——我们的书，他烧了。”他从袖子里拿出一样东西放在我面前，是一本巴掌大的皮面小册子，空的，是主教生前给各村孩子抄教理用的。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_act3" }, { kind = "date", from = [1579, 8, 1] }]
at = "campeche"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte", "gaspar_antonio_chi"]

[[tracks.chapters.choices]]
key = "cenote"
text = "带回岛上，封上蜂蜡，沉进塞诺特"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_fire_end_cenote" }, { kind = "reputation", faction = "itza", value = 1 }]
reply = "回岛那夜，我把小册子用蜂蜡封了，绑上一块石头，沉进小时候游水的那口塞诺特。它沉得很慢，一路往下，碰到洞壁响了一声。老人们说，投进井里的东西不死，只是再也见不着。我在水边坐到天亮。那口井底下，如今多了一本修士的册子。"

[[tracks.chapters.choices]]
key = "write"
text = "在空页上，用两种字写下马尼那天的名字"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_fire_end_names" }, { kind = "skill", skill = "lang_spanish", value = 15 }, { kind = "fame", value = 2 }]
reply = "我写了一个旱季。一页西班牙字母，一页我们的话：名字、村子、吊了几天、回没回家。写不全的，就空一格。写完交给加斯帕尔，请他收进通事的文书箱。他翻到最后：“这一本，我替你压在箱底，压在给国王的诉状下面。”我说国王不会翻到底。他说：“所以压在那儿。”"

[[tracks.chapters.choices]]
key = "give_back"
text = "推回给加斯帕尔：他的账，让他自己记"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_fire_end_returned" }, { kind = "affinity", person = "gaspar_antonio_chi", value = 4 }]
reply = "加斯帕尔没接，我就把它搁在我们中间的桌上。两个人看着它，谁也不碰。后来他说起他父亲，说起奥茨马尔，说起那年没下的雨，说了一下午。天黑以前他把小册子拿走了，走的时候说：“一本空的，最难写。”"

[[tracks.chapters.variants]]
key = "rw_kept"
when = [{ kind = "flag", flag = "rw_ix_nikte_booklet_kept" }]
text = "主教下葬以后，加斯帕尔来坎佩切找我。他如今在梅里达替官府当通事，替玛雅人打官司，也替西班牙人翻诉状，头发白了一半。他说修士们收拾主教的屋子，那本画着字母的书，听说早年留在了西班牙。“他记下的东西会比我们活得久，”加斯帕尔说，“比我们的书活得久——我们的书，他烧了。”他从袖子里拿出一样东西放在我面前，是一本巴掌大的皮面小册子，空的，跟我怀里揣了二十多年、前头抄着《天主经》的那一本，一模一样。"

[[tracks.chapters.variants]]
key = "rw_returned"
when = [{ kind = "flag", flag = "rw_ix_nikte_booklet_returned" }]
text = "主教下葬以后，加斯帕尔来坎佩切找我。他如今在梅里达替官府当通事，替玛雅人打官司，也替西班牙人翻诉状，头发白了一半。他说修士们收拾主教的屋子，那本画着字母的书，听说早年留在了西班牙。“他记下的东西会比我们活得久，”加斯帕尔说，“比我们的书活得久——我们的书，他烧了。”他从袖子里拿出一样东西放在我面前：是我结业那年还给兰达的那本小册子。皮面磨得发亮，后面几页我当年随手记的字还在，旁边多了几处红墨的小记号，是他的笔迹。最后一页是空的。"

# ───────────── 增写旁轨（2026-11-11）：双生子（母亲伊希·卡努尔），7 章（t2b 在 t2 与 t3 之间） ─────────────
# 母本：《波波尔·乌》双生兄弟下西巴尔巴——祖母在屋子正中种玉米穗（枯了是死，发芽是活），兄弟骗过冥王，最后自己跳进炉子、骨灰撒进河里，第五天回来；
#   文化：接生婆与伊希切尔、撒玉米问日子、给孩子念日子名（1552 年敕令以后都是禁事），兰达记的葬俗（死者嘴里放玉米与石珠）；
#   张力：骗过死神的人自己也得死一回——她替岛上最后一位契兰认罪、受罚、不许接生，又在罚里回来，最后把嘴里的规矩带进坟里。
# 入口：c13_main_ix_nikte 加日期；t3 读 _act2，t5 读 _act3。各章有期限与 timeout；t6 是终章（next = done），不抢主线 c08 的三个落点。
# 与主线对得上：b04（1570）母亲还在、b06（1573）兰达问她还接不接生；c06（1584）契兰还活着（t3 母亲替他认罪）；c08 的“母亲留下的药箱”。母亲 1580 年起病、死于 1580—1582。
# 人物：佩德罗（盐场西班牙人之子）、埃克（北村渔家）是养成期“同一夜的两个孩子”，只在正文出现，不作 speaker、不加情谊效果。
# 读：rw_ix_nikte_kernels_pouch、_moon_lamp / _moon_door、_chilan_burned / _chilan_kept_self / _chilan_kept_boy（养成期）。
# 设：rw_ix_nikte_t_asked / _t_raised / _t_told（t1）、_t_spaniard_saw（t2）、_mother_penance / _t_claimed / _t_bargain（t3，三个选项与 timeout 都设 _mother_penance，f4 的变体读）、
#   _t_through_wall / _t_mother_went（t4）、_t_old_burial / _t_both_burial / _t_church_burial（t5，互斥）、_twins_end_go / _twins_end_sent / _twins_end_water（t6）。
