# t1 屋子正中：马尼回来，母亲又在屋子正中埋了两穗玉米。读养成期的 rw_ix_nikte_kernels_pouch。
[[tracks.chapters]]
key = "t1_two_ears"
title = "屋子正中"
text = "从马尼回来，我上岸先回家。母亲不在，去对岸接生了。屋子正中的泥地上又埋了两穗玉米，旁边一撮柯巴脂烧剩的黑渣。姨母说，是我去马尼那天母亲埋的，埋完一夜没睡。左边那穗好好的，抽了半尺高的芽；右边那穗倒了，须子发黑，叶子卷成一团。姨母说：“你娘不让我拔，也不让我扶。她说扶起来的不算。”夜里母亲回来，看见我，先看的却是那两穗玉米。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1562, 9, 20] }]
at = "cozumel"
speaker = "captain"
mood = "mystic"
cast = ["ix_nikte"]
deadline = [1563, 12, 31]

[[tracks.chapters.choices]]
key = "ask"
text = "问她：倒下的那穗是谁"
next = "t2_same_night"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_asked" }, { kind = "skill", skill = "herbal_medicine", value = 5 }]
reply = "母亲“嘘”了一声：“问出来就不灵了。”她蹲下去，用手指把倒下那穗根上的土按实，按得很轻。“马尼那天死了的，不全是你，”她说，“也不全不是。”她起身去烧水，背对着我站了很久，水开了也没动。"

[[tracks.chapters.choices]]
key = "raise"
text = "把倒下的那穗扶起来，用草绳绑住"
next = "t2_same_night"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_raised" }]
reply = "姨母在门口“哎”了一声，母亲却没拦。我用草绳把它绑在一根削尖的木棍上，绑了三道。母亲看着说：“扶起来的不算。”过了一会儿，她又说：“不算也好。不算，就还能再算一回。”第二天早上，绑着的那穗还是歪的，叶子却展开了一点。"

[[tracks.chapters.choices]]
key = "tell"
text = "什么也不问，把马尼看见的讲给她听"
next = "t2_same_night"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_told" }, { kind = "fame", value = 1 }]
reply = "我讲了吊着的人、站不直的人、火，还有那个往人堆外递书的老人。母亲一直在拨灶里的火，一句也没插。讲完，她说：“你做得对。”我问哪一件做得对。她说：“讲出来。讲出来，就是在给死了的人起名字。”"

[tracks.chapters.timeout]
next = "t2_same_night"
effects = []
news = "科苏梅尔的人说，商队首领家屋子正中埋着两穗玉米，一穗绿，一穗倒，谁也不许碰。"

[[tracks.chapters.variants]]
key = "rw_pouch"
when = [{ kind = "flag", flag = "rw_ix_nikte_kernels_pouch" }]
text = "从马尼回来，我上岸先回家。母亲不在，去对岸接生了。屋子正中的泥地上又埋了两穗玉米，旁边一撮柯巴脂烧剩的黑渣。姨母说，是我去马尼那天母亲埋的，埋完一夜没睡。左边那穗好好的，抽了半尺高的芽；右边那穗倒了，须子发黑，叶子卷成一团。我腰上那袋结业时她分给我的红玉米，一路没离过身。姨母说：“你娘不让我拔，也不让我扶。她说扶起来的不算。”夜里母亲回来，看见我，先看的却是那两穗玉米。"

# t2 同一夜的两个孩子：盐场的西班牙人看见了母亲撒玉米。读养成期的 rw_ix_nikte_moon_lamp / _moon_door（互斥）。
[[tracks.chapters]]
key = "t2_same_night"
title = "盐场管事的儿子"
text = "收盐的那个西班牙人如今管着岛上的盐场。他儿子佩德罗十二岁了，在塞诺特里呛了水，捞上来就发烧，烧了三天，说胡话。修士的药不管用，他夜里敲开了我家的门，帽子攥在手里。母亲看了孩子的舌头和手心，从床底下摸出那只小布袋，当着他的面，把玉米撒在席子上。他看见了，嘴唇动了动，没说话。屋角站着北村渔家的埃克，跟佩德罗是同一夜生的，是来送水的。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1566, 4, 1] }]
at = "cozumel"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
deadline = [1567, 12, 31]

[[tracks.chapters.choices]]
key = "watch"
text = "站在母亲身后，什么也不说"
next = "t2b_isabel"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_spaniard_saw" }, { kind = "skill", skill = "herbal_medicine", value = 10 }]
reply = "母亲数完玉米，配了两样草，煮到剩一半，让那个西班牙人自己端着碗喂，说孩子认得爹的手。天亮时佩德罗退了烧。西班牙人走之前在门槛上站了一会儿：“我什么也没看见。”母亲说：“我知道。”"

[[tracks.chapters.choices]]
key = "block"
text = "挡在席子前头，不让他看"
next = "t2b_isabel"
effects = [{ kind = "reputation", faction = "new_spain", value = 1 }]
reply = "我站到他和席子中间，用卡斯蒂利亚话请他出去等。他出去了，在门外站了一夜，一直念玫瑰经。孩子天亮退了烧。母亲收起玉米，对我说：“你挡得住他的眼睛，挡不住他的嘴。”过了半年，他一句也没说出去。"

[[tracks.chapters.choices]]
key = "ek"
text = "叫埃克烧水，自己替母亲递草药"
next = "t2b_isabel"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_spaniard_saw" }, { kind = "fame", value = 1 }]
reply = "埃克烧水，我递药，母亲拨玉米，三个人谁也不说话。西班牙人坐在门槛上看着，看着看着睡着了，帽子掉在地上。佩德罗醒过来，头一句话是问埃克要水。两个孩子一个躺着一个蹲着，脸挨得很近，像一对真的兄弟。"

[tracks.chapters.timeout]
next = "t2b_isabel"
effects = []
news = "科苏梅尔盐场管事的儿子在塞诺特里呛了水，烧了三天，听说是一个岛上的接生婆治好的。"

[[tracks.chapters.variants]]
