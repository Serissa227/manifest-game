# f1 伊萨马尔的台阶：焚书以前，他爱这片土地、量它的石头、问它的路。
[[tracks.chapters]]
key = "f1_izamal"
title = "伊萨马尔的台阶"
text = "伊萨马尔的修院砌在老金字塔顶上，我背着两袋蜂蜡爬一百多级台阶，爬到一半歇了三回。兰达修士在顶上量石头，会衣卷到膝盖，手里一根打了结的绳，一结一结地量，量完往本子上记。他如今是方济各会在尤卡坦管事的人，见了我，还是叫前院时的名字：“玛丽亚！蜡放下，过来看，这座山原来有多大。”他说这底下原是魔鬼的庙，他把天主的屋子盖在了它头顶。接着他问我：科苏梅尔的朝圣路怎么走，女人们过海要几天，庙门几时开。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1558, 3, 1] }]
at = "campeche"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte", "diego_de_landa"]
deadline = [1561, 12, 31]

[[tracks.chapters.choices]]
key = "pilgrim"
text = "把朝圣的旧路一段段讲给他听"
next = "f2_ashes"
effects = [{ kind = "reputation", faction = "new_spain", value = 1 }, { kind = "flag", flag = "rw_ix_nikte_told_pilgrimage" }]
reply = "我讲了：沿岸往北，到波莱等风，一天过海；女人们在船上唱什么，下船先洗哪只脚。他记得飞快，问一句记一句。记完合上本子，很满意：“往后这条路上走的，是去望弥撒的人。路还是这条路。”他说得很高兴。我想起北岸老庙前那几个绕着路来的老妇人，什么也没说。"

[[tracks.chapters.choices]]
key = "price"
text = "只谈蜡价，别的不说"
next = "f2_ashes"
effects = [{ kind = "cash", value = 200 }]
reply = "我说蜡是岛上的，价也是岛上的。他笑起来，跟我讲了半天价，讲得比坎佩切的商人还狠，说修院的钱要省给穷人。最后他照我开的价付了，又多给一枚：“给你母亲。她接生的手，比我们的祷告管用。”他说这话不像在开玩笑。"

[[tracks.chapters.choices]]
key = "why"
text = "问他：记这些做什么"
next = "f2_ashes"
effects = [{ kind = "skill", skill = "lang_latin", value = 10 }, { kind = "flag", flag = "rw_ix_nikte_asked_why" }]
reply = "“记下来，”他用玛雅话说，说得又快又准，“等他们都成了好基督徒，总得有人记得他们从前在什么样的黑夜里。”他把绳子绕回手上，“你以为我恨他们？我爱他们。爱一个人，才要把他从火里拉出来。”台阶底下，修院的钟响了。"

[tracks.chapters.timeout]
next = "f2_ashes"
effects = []
news = "伊萨马尔的修院又加高了一层，听说砌墙的石头，是从老金字塔上一块块撬下来的。"

[[tracks.chapters.variants]]
key = "rw_road"
when = [{ kind = "flag", flag = "rw_ix_nikte_be_road" }]
text = "伊萨马尔的修院砌在老金字塔顶上，我背着两袋蜂蜡爬一百多级台阶，爬到一半歇了三回。兰达修士在顶上量石头，会衣卷到膝盖，手里一根打了结的绳，一结一结地量，量完往本子上记。他如今是方济各会在尤卡坦管事的人，见了我，先在半空里画了一只脚印：“路！前院那个说‘路’的丫头。玛丽亚，蜡放下，过来看，这座山原来有多大。”他说这底下原是魔鬼的庙，他把天主的屋子盖在了它头顶。接着他问我：科苏梅尔的朝圣路怎么走，女人们过海要几天，庙门几时开。"

# f2 灰堆：托拉尔主教叫停审问以后，火堆前他认出了她。“你又能救得了谁”在这里由他说出口。
[[tracks.chapters]]
key = "f2_ashes"
title = "灰堆"
text = "十月，托拉尔主教放回来的人陆续回了村。我进内陆到马尼，替一户人家接回他们吊伤了肩的老父亲。修院前烧过的那片地还是黑的，雨把灰泡成了泥，泥里露着半截泥像的胳膊。天擦黑，兰达修士一个人出来，站在灰堆边。他瘦了，认出了我：“玛丽亚。那天你站在第三排，靠着那棵木棉。”他从泥里捡起一卷烧焦的树皮纸，抖了抖，递过来。“你来接人。你又能救得了谁？一个老头，一卷烂纸。”他停了一下，“我也这么问我自己。我救了几千个灵魂，主教说我手上有血。”"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1562, 10, 1] }]
at = "campeche"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte", "diego_de_landa"]
deadline = [1563, 3, 31]

[[tracks.chapters.choices]]
key = "take_page"
text = "接过那卷纸，收进怀里"
next = "f3_toledo"
effects = [{ kind = "flag", flag = "rw_ix_nikte_ash_page" }, { kind = "reputation", faction = "itza", value = 1 }]
reply = "纸卷一碰就掉渣，里头还有一角是红的，画着半个人的脚。我把它裹进接生布，贴身揣着。兰达看着我收，没拦：“拿去吧。烧剩的，魔鬼也认不出自己了。”他往修院走，走到门口又站住，像在等我叫他。我没叫。"

[[tracks.chapters.choices]]
key = "read_names"
text = "翻开账本背面，念出那天记下的名字"
next = "f3_toledo"
requires = [{ kind = "flag", flag = "c13_main_ix_nikte_names_kept" }]
hint = "那天被吊的人叫什么，你没有记下来。"
effects = [{ kind = "flag", flag = "rw_ix_nikte_names_read" }, { kind = "fame", value = 1 }]
reply = "我一个一个念。念第一个，他没动；念到第五个，他在胸前画了十字；念到最后一个，他已经跪在灰里，嘴里念着拉丁经文，替他们，也替他自己。我念完，他没起来，我也没扶。那户人家的老父亲靠在墙边，听见自己的名字，哭了。"

[[tracks.chapters.choices]]
key = "carry_old"
text = "不答他，背起老人就走"
next = "f3_toledo"
effects = [{ kind = "reputation", faction = "itza", value = 1 }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "老人的肩一碰就疼，我把他的胳膊搭在自己脖子上，一步一步往外挪。走出十几步，听见兰达在后头说：“他的罚衣，记得还给修院。”我没回头。老人在我背上轻轻说了一句玛雅话：那卷纸，是我家的。"

[tracks.chapters.timeout]
next = "f3_toledo"
effects = []
news = "听说兰达修士要被送回西班牙去。马尼的人说，修院前那片烧黑的地，雨下了一季还是黑的。"

# f3 托莱多来的问题：他在西班牙写书，隔着一片海问接生婆床下放什么。读字母线的 rw_ix_nikte_bed_*（互斥）。
[[tracks.chapters]]
key = "f3_toledo"
title = "托莱多来的问题"
text = "加斯帕尔托人捎话，约我在坎佩切税关后头见。他手里一张纸，是从西班牙辗转寄来的：兰达修士在那边等着受审，闲下来写一本记尤卡坦的书，写到一半，有些事要问。纸上十几条，问日子，问字母，问井。中间一条写着：科苏梅尔的接生婆，床下放的是什么像，叫什么名，几时摆，几时收。“他点名要问你，”加斯帕尔说，“他记得你母亲。”"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1566, 2, 1] }]
at = "campeche"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "gaspar_antonio_chi"]
deadline = [1567, 12, 31]

[[tracks.chapters.choices]]
key = "past"
text = "照母亲当年的说法答：那是从前的事"
next = "f4_bishop"
effects = [{ kind = "skill", skill = "lang_spanish", value = 10 }, { kind = "flag", flag = "rw_ix_nikte_answered_past" }]
reply = "我照着念，加斯帕尔照着写，用的是他最好的那手字。写完他把纸吹干：“从前。好词。修士最爱‘从前’，从前的事，烧不着现在的人。”他把纸折好，又说，“可他读书的时候，会想这个‘从前’是哪一年。”"

[[tracks.chapters.choices]]
key = "skip"
text = "这一条不答，只答盐和潮水"
next = "f4_bishop"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 2 }]
reply = "加斯帕尔看着那一行空着，没劝。别的几条他一一写完，轮到这一条，想了想，写了一句：问的人不在岛上。他说这句也是真的，母亲那个月去对岸接生，半个月没回来。他把纸叠好，叠得很慢。"

[[tracks.chapters.choices]]
key = "chi_decide"
text = "问他：换了是你，你怎么答"
next = "f4_bishop"
effects = [{ kind = "affinity", person = "gaspar_antonio_chi", value = 3 }]
reply = "他笑了，有点苦：“我？我已经替他答了一百条。”他把纸推回我面前，“这一条是你的。我答，是修家的人在答；你答，是接生婆的女儿在答。他要的是后一种。”我拿起笔，写了两个字，又划掉，最后什么也没写，把纸还给了他。"

[tracks.chapters.timeout]
next = "f4_bishop"
effects = []
news = "坎佩切的报信船又往西班牙捎了一包信，听说有一封是写给那个在托莱多受审的修士的。"

