# b05 井底的孩子：历史现场，1571 法国船劫掠后的搜岛，一个孩子与一只烛台。
[[tracks.chapters]]
key = "b05_french_boy"
title = "井底的孩子"
text = "法国船抢了岛上教堂的钟，第二天巡岛的兵从对岸赶来，在海滩上抓了十几个人。清早我去塞诺特游水，在洞壁的石缝里看见一个浑身发抖的男孩，十三四岁，船上打杂的，手里攥着一只从教堂抢来的银烛台，不肯松手。他说法国话，我一句也听不懂。我问：“你哪条船上的？”他听不懂，我自己先笑了一下。洞口外，兵在挨家搜。男孩把烛台塞到我手里，比划着：拿去，别交我。洞口外的兵喊：“井里也看看！”我心里想：他比我第一次划船过海的时候还小。"
window = [[1571, 2, 1], [1571, 12, 31]]
at = "cozumel"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
news = "科苏梅尔的教堂让法国船抢了钟，岛上抓到的法国人都押去了梅里达，听说要送墨西哥城去审。"

[tracks.chapters.default]
next = "b06_landa_back"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]

[[tracks.chapters.choices]]
key = "hand_over"
text = "把孩子和烛台交给巡岛的兵"
next = "b06_landa_back"
effects = [{ kind = "reputation", faction = "new_spain", value = 3 }, { kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]
reply = "我先把烛台交出去，又把孩子领到兵的跟前。兵说这一船的人都要送到墨西哥城去审。孩子被拉走的时候回头喊了一句法国话，我到底没弄明白是什么。"

[[tracks.chapters.choices]]
key = "smuggle"
text = "把孩子藏进下一条去哈瓦那的独木舟"
next = "b06_landa_back"
check = { attr = "intrigue", base = 20, per = 7 }
effects = [{ kind = "reputation", faction = "france", value = 2 }, { kind = "reputation", faction = "new_spain", value = -2 }, { kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]
reply = "我把他塞进盐袋中间，盖上一张晒干的鱼网。烛台我留下了，后来偷偷放回了教堂的门槛上。那条去哈瓦那的独木舟开出去的时候，盐袋底下一声也没有。"
news = "科苏梅尔的独木舟运盐去哈瓦那，船上多了一个不说话的男孩，没人数得清楚。"

[tracks.chapters.choices.fail]
next = "b06_landa_back"
effects = [{ kind = "reputation", faction = "new_spain", value = -1 }, { kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]
news = "科苏梅尔的海滩上，兵掀开了一张鱼网，一个湿透的孩子被拖了出来，那条船被罚了一季的盐。"

[[tracks.chapters.choices]]
key = "name_him"
text = "留他在岛上当桨手，给他起一个岛上的名字"
next = "b06_landa_back"
check = { attr = "charm", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_boy_named" }, { kind = "reputation", faction = "new_spain", value = -1 }, { kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]
reply = "我给他剃了头，换上棉衣，跟村里人说是对岸烧掉的渔村来的孤儿，起名叫“卡伊”，是鱼的意思。下一回神父来，名册最后一页多了一行。"
news = "科苏梅尔的村子收下了一个对岸烧掉的渔村来的孤儿，叫卡伊，是商队首领家的人保的。"

[tracks.chapters.choices.fail]
next = "b06_landa_back"
effects = [{ kind = "reputation", faction = "new_spain", value = -2 }, { kind = "memory", memory = "mem-main_ix_nikte-b05", title = "井底的孩子" }]
news = "科苏梅尔的村子里，孩子一开口说话，就被邻居家的狗咬住了裤腿，连村口的老妇都探出头来看。"

[[tracks.chapters.variants]]
key = "v1_burned"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_village_burned" }]
text = "法国船抢了岛上教堂的钟，第二天巡岛的兵从对岸赶来，在海滩上抓了十几个人。对岸那个渔村就是这样的船烧的。清早我去塞诺特游水，在洞壁的石缝里看见一个浑身发抖的男孩，十三四岁，船上打杂的，手里攥着一只从教堂抢来的银烛台，不肯松手。他说法国话，我一句也听不懂。我问：“你哪条船上的？”他听不懂，我自己先笑了一下。洞口外，兵在挨家搜。男孩把烛台塞到我手里，比划着：拿去，别交我。我看着这个孩子，手指在袖子里松了又紧。洞口外的兵喊：“井里也看看！”我心里想：他比我第一次划船过海的时候还小。"

# b06 主教的戒指：历史现场，兰达以主教身份回到坎佩切。
[[tracks.chapters]]
key = "b06_landa_back"
title = "主教的戒指"
text = "十月，坎佩切的码头铺了草席，钟敲个不停。兰达从西班牙回来了。十年前他是被押走的修士，如今手上戴着主教的戒指，四十九岁，瘦了，眼睛还是那样。他上岸的第一道令：科苏梅尔岛出钱铸一口新钟，旧的让法国船抢了。岛上的老庙石头要拆去砌教堂的墙，各村的祭司重新登记。兰达在人群里认出了我，马尼那天我站在哪里，他记得。他说：“你船上没藏着偶像吧？别笑。在尤卡坦，连井底都可能沉着一个。”然后他问：“玛丽亚，你母亲还替人接生吗？替我谢谢她。当年我的本子里，接生的事是她讲的。”我心里想：他记得我，记得的是那个名字。"
window = [[1573, 10, 1], [1574, 3, 31]]
at = "campeche"
stage = "involve"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "diego_de_landa"]
news = "新主教在坎佩切上了岸，头一道令就是叫科苏梅尔岛出钱铸一口新钟。"

[tracks.chapters.default]
next = "b07_aztlan"
effects = []

[[tracks.chapters.choices]]
key = "petition"
text = "替岛上的村子请愿：钟由岛上出可可慢慢铸，老庙的石头不拆"
next = "b07_aztlan"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_petitioned" }, { kind = "reputation", faction = "new_spain", value = 1 }, { kind = "fame", value = 2 }]
reply = "我不求情，只算账：岛上一年产多少盐，换多少可可，拆一块石头要几个人工，误几天渔季。兰达听完，用戒指敲了敲桌子：“钟分三年。石头，先不动。”"
news = "坎佩切的主教接下了科苏梅尔的账，钟分三年铸，老庙的石头一块也不拆。"

[tracks.chapters.choices.fail]
next = "b07_aztlan"
effects = [{ kind = "reputation", faction = "new_spain", value = -1 }]
news = "主教听完科苏梅尔人的账，说石头是给天主的，钟照铸，石头照拆。"

[[tracks.chapters.choices]]
key = "move_book"
text = "避开他，连夜把那部家传的书挪个地方"
next = "b07_aztlan"
requires = [{ kind = "item", item = "maya_inheritance_codex", qty = 1 }]
hint = "那部书不在你手里。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_moved" }]
reply = "我当夜划船回岛，从藏书的地方取出那个包，用新的油布裹了，搬进老庙石阶下一个只有我和母亲知道的空洞里。回来的时候天快亮了，岛上的人还没醒，只有海鸟在码头上叫。"

[[tracks.chapters.choices]]
key = "tithe"
text = "交一份可可的什一税，换岛上一年清静"
next = "b07_aztlan"
requires = [{ kind = "cash", ge = 400 }]
hint = "你的可可豆还不够填主教的盘子。"
effects = [{ kind = "cash", value = -400 }, { kind = "reputation", faction = "new_spain", value = 3 }]
reply = "修士接过可可袋，当着我的面数了一遍，数完收进袖子里，一句话也没说。那一年，主教的巡视员没有过海来。第二年，他来了。修士把可可袋交给书记，书记在账册上记了一笔，字迹工整，写的是“科苏梅尔，一袋”。"
news = "坎佩切的主教收下了科苏梅尔的一袋可可，那一年，岛上没有人被叫去修钟。"

[[tracks.chapters.variants]]
key = "v1_chi"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_chi_spoke" }]
text = "十月，坎佩切的码头铺了草席，钟敲个不停。兰达从西班牙回来了。十年前他是被押走的修士，如今手上戴着主教的戒指，四十九岁，瘦了，眼睛还是那样。兰达身后站着加斯帕尔，如今是主教的通事。他看了我一眼，那半页证词的事，主教显然知道了。他上岸的第一道令：科苏梅尔岛出钱铸一口新钟，旧的让法国船抢了。岛上的老庙石头要拆去砌教堂的墙，各村的祭司重新登记。兰达在人群里认出了我，马尼那天我站在哪里，他记得。他说：“你船上没藏着偶像吧？别笑。在尤卡坦，连井底都可能沉着一个。”然后他问：“玛丽亚，你母亲还替人接生吗？替我谢谢她。当年我的本子里，接生的事是她讲的。”我心里想：他记得我，记得的是那个名字。"

[[tracks.chapters.variants]]
key = "rw_bed"
when = [{ kind = "flag", flag = "rw_ix_nikte_bed_written" }, { kind = "flag", flag = "c13_main_ix_nikte_chi_spoke", value = false }]
text = "十月，坎佩切的码头铺了草席，钟敲个不停。兰达从西班牙回来了。十年前他是被押走的修士，如今手上戴着主教的戒指，四十九岁，瘦了，眼睛还是那样。他上岸的第一道令：科苏梅尔岛出钱铸一口新钟，旧的让法国船抢了。岛上的老庙石头要拆去砌教堂的墙，各村的祭司重新登记。兰达在人群里认出了我，马尼那天我站在哪里，他记得。他说：“你船上没藏着偶像吧？别笑。在尤卡坦，连井底都可能沉着一个。”然后他问：“玛丽亚，你母亲还替人接生吗？替我谢谢她。当年我的本子里，接生的事是她讲的。”那一页是我替她写的，写的是“从前”。我心里想：他记得我，记得的是那个名字。"

# b07 白色之地：阿兹特兰的布，柏拉图的岛，一个猜测。
[[tracks.chapters]]
key = "b07_aztlan"
title = "白色之地"
text = "韦拉克鲁斯的货栈，安蒂瓜河边沙地里的蚊子比人多。一个墨西加老脚夫歇工时摊开一卷旧布，布上画着一行一行的脚印，从湖心一个小岛上出发。他说那是他祖先走出来的地方，阿兹特兰，“白色之地”，岛在湖中间，湖边全是白鹭。隔壁书店的伙计正跟人吹，说有个西班牙史家写过：这片新大陆，就是柏拉图说的那座沉到海里的岛。老脚夫说：“我们是从水里出来的，所以墨西哥城也盖在水里。”书店伙计说：“柏拉图说那座岛一圈陆一圈水。”我心里想：两个都是岛，都在水中间，都回不去了。老脚夫又说：脚印是往外走的，没人画过往回走的路。"
when = [{ kind = "date", from = [1575, 1, 1] }]
at = "veracruz"
speaker = "captain"
mood = "mystic"
cast = ["ix_nikte"]
deadline = [1577, 12, 31]

[[tracks.chapters.choices]]
key = "plato"
text = "拿柏拉图来对：岛、环形的水、山铜的墙"
next = "c01_landa_dies"
requires = [{ kind = "read", work = "plato_dialogues" }]
hint = "那部讲沉没之岛的对话录，你还没读过。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_aztlan" }, { kind = "skill", skill = "lang_latin", value = 15 }]
reply = "我把拉丁文一句一句翻给老脚夫听。翻到“三圈水两圈陆”的时候，老人用手指在布上的湖边画了三个圈。两个人对着那块布坐到天黑，都没有说这是还是不是。"
news = "韦拉克鲁斯的货栈里，一个尤卡坦的女船主跟墨西加老脚夫对着一块旧布坐了一下午。"

[[tracks.chapters.choices]]
key = "cloth"
text = "坐下来，让老人把布上的路从头讲到尾"
next = "c01_landa_dies"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_aztlan" }, { kind = "skill", skill = "lang_nahuatl", value = 20 }]
reply = "老人讲了三天，每天讲一段。讲到第三天停在一个画着断树的地方，说后面的他爷爷也不记得了。我把那棵断树描在账本背面，旁边写：白色之地，往东？"

[[tracks.chapters.choices]]
key = "letter"
text = "把这个猜测写成信，托人带去墨西哥城给霍奇特尔"
next = "c01_landa_dies"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_aztlan" }, { kind = "affinity", person = "xochitl", value = 4 }]
reply = "我把布上的脚印描了一份，夹在信里。半年后回信来了，只有一句：“白色的岛要是真在湖里，你先把湖画全了再来吵。”字比我记忆里的好看多了。"

[tracks.chapters.timeout]
next = "c01_landa_dies"
effects = []
news = "韦拉克鲁斯的货栈里有个墨西加老脚夫，逢人就摊开一块画着脚印的旧布，没几个人肯看完。"

