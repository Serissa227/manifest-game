# t2b 册子上的母亲：b04 普查以后，母亲问自己的教名。读主线 b04 设的 c13_main_ix_nikte_name_maria / _name_both / _name_ix（互斥）。
[[tracks.chapters]]
key = "t2b_isabel"
title = "册子上的母亲"
text = "普查的神父走了以后，母亲夜里问我：册子上，她叫什么。我说伊莎贝尔，伊莎贝尔·卡努尔，是她受洗那年修士给的，她自己从来没用过。母亲把这个名字念了三遍，念得磕磕绊绊，像嚼一块硬饼。“伊莎贝尔。”她笑了，“她是谁？”我说是西班牙从前的一个女王。母亲说：“女王也接生吗？”屋子正中那两穗玉米早拔了，地上只剩两个浅坑。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1570, 8, 1] }]
at = "cozumel"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte"]
deadline = [1571, 12, 31]

[[tracks.chapters.choices]]
key = "teach"
text = "教她念：伊——莎——贝尔"
next = "t3_into_fire"
effects = [{ kind = "skill", skill = "lang_spanish", value = 5 }, { kind = "fame", value = 1 }]
reply = "她学了一晚上，到底把“贝尔”念成了“贝”，在我们的话里就是路。她自己笑得直咳：“路就路，女王也得走路。”第二天她去接生，产妇的男人问她叫什么，她说伊莎贝尔，说完自己先别过脸去。"

[[tracks.chapters.choices]]
key = "no_need"
text = "说：您不用记，家里没人这么叫您"
next = "t3_into_fire"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_isabel_kept" }]
reply = "母亲摇头：“得记。哪天他们照着册子来叫我，我不答应，人家就说册子上这个人死了。”她又把那个名字念了一遍，念顺了一点，“我还没打算死。”"

[[tracks.chapters.choices]]
key = "which"
text = "问她：册子上那个，是您哪一个"
next = "t3_into_fire"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_two_women" }]
reply = "母亲想了很久：“册子上那个，替我交贡，替我受洗，将来替我下葬。家里这个，替我接生。”她往灶里添了一根柴，“她们俩不吵架，就是互相不认识。”"

[tracks.chapters.timeout]
next = "t3_into_fire"
effects = []
news = "科苏梅尔的普查名册送走以后，岛上的老妇们夜里互相念自己的教名，念错了就笑。"

[[tracks.chapters.variants]]
key = "rw_both"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_name_both" }]
text = "普查的神父走了以后，母亲夜里问我：册子上，她叫什么。我说伊莎贝尔，伊莎贝尔·卡努尔，是她受洗那年修士给的，她自己从来没用过。我自己那一行写了两个名字，一前一后，她没问。母亲把那个名字念了三遍，念得磕磕绊绊，像嚼一块硬饼。“伊莎贝尔。”她笑了，“她是谁？”我说是西班牙从前的一个女王。母亲说：“女王也接生吗？”屋子正中那两穗玉米早拔了，地上只剩两个浅坑。"

[[tracks.chapters.variants]]
key = "rw_ix"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_name_ix" }]
text = "普查的神父走了以后，母亲夜里问我：册子上，她叫什么。我说伊莎贝尔，伊莎贝尔·卡努尔，是她受洗那年修士给的，她自己从来没用过。我自己那一行，书记写得很小，挤在格子边上，她知道，没提。母亲把那个名字念了三遍，念得磕磕绊绊，像嚼一块硬饼。“伊莎贝尔。”她笑了，“她是谁？”我说是西班牙从前的一个女王。母亲说：“女王也接生吗？”屋子正中那两穗玉米早拔了，地上只剩两个浅坑。"

