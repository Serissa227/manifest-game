news = "坎佩切的同盟收下了科苏梅尔的一袋可可豆，纳奇掰开一颗看了看，说成色不错。"

[[tracks.chapters.choices]]
key = "cocom"
text = "让科科姆家牵头，但先把修家那一结空着"
next = "a06_salt_run"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "reputation", faction = "sotuta", value = 3 }, { kind = "fame", value = 1 }]
reply = "我说绳子上可以留一段不打结，“哪天修家的船来了，再打。”纳奇哼了一声，没有反对，却把那段空绳又看了一遍，才把绳子递给下一个商人。"
news = "坎佩切的同盟给修家留了一段空绳，纳奇说，那是科科姆家的宽厚。"

[tracks.chapters.choices.fail]
