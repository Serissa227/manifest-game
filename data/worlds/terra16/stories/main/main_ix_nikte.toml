key = "rw_maria"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_name_maria" }]
text = "普查的神父走了以后，母亲夜里问我：册子上，她叫什么。我说伊莎贝尔，伊莎贝尔·卡努尔，是她受洗那年修士给的，她自己从来没用过。我那一行写的是玛丽亚，一个字也没多，她晚饭时照旧叫我妮克特。母亲把那个名字念了三遍，念得磕磕绊绊，像嚼一块硬饼。“伊莎贝尔。”她笑了，“她是谁？”我说是西班牙从前的一个女王。母亲说：“女王也接生吗？”屋子正中那两穗玉米早拔了，地上只剩两个浅坑。"

# t3 自己走进炉子的人：主教的巡视员来岛上找契兰，母亲替他认了撒玉米的罪。b04 以后，可以写她对“玛丽亚”的想法。读养成期契兰线的 rw_ix_nikte_chilan_*。
[[tracks.chapters]]
key = "t3_into_fire"
title = "自己走进炉子的人"
text = "主教的巡视员过海来了，带着一张名单挨村问：谁还撒玉米，谁还在夜里给孩子念日子，谁家床底下有东西。他要找的是岛上最后那位契兰，名单上头一个就是他。老人病着，起不了身，要是被拖去梅里达，路上就会死。第二天一早，母亲换上那件出门才穿的深色衣裳，自己走到教堂前头，对巡视员说：“撒玉米的是我。岛上会念日子的，只剩我一个。”"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_act2" }, { kind = "date", from = [1574, 1, 15] }]
at = "cozumel"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte"]
deadline = [1575, 6, 30]

[[tracks.chapters.choices]]
key = "let"
text = "让她去：这是她自己选的路"
next = "t4_knock"
effects = [{ kind = "flag", flag = "rw_ix_nikte_mother_penance" }]
reply = "我站在人群后头，看她把那只小布袋交出去，看巡视员把床底下的伊希切尔像装进麻袋带走。她被罚每个礼拜天在教堂门口跪一个时辰，手里举着蜡烛，不许再接生。回家的路上她走得很稳，一步也没让我扶。"

[[tracks.chapters.choices]]
key = "claim"
text = "抢上前去：撒玉米的是我"
next = "t4_knock"
effects = [{ kind = "flag", flag = "rw_ix_nikte_mother_penance" }, { kind = "flag", flag = "rw_ix_nikte_t_claimed" }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "巡视员看了我一眼，翻开名册，笑了：“玛丽亚？梅里达修院出来的玛丽亚，会撒玉米？”周围的人都笑了，母亲也笑了，笑得最响。那个名字护住了我，护得我抬不起头。母亲还是被罚了。礼拜天我跪在她旁边，举着另一根蜡烛，没人叫我跪。"

[[tracks.chapters.choices]]
key = "pedro_father"
text = "去求盐场的那个西班牙人作保"
next = "t4_knock"
effects = [{ kind = "flag", flag = "rw_ix_nikte_mother_penance" }, { kind = "flag", flag = "rw_ix_nikte_t_bargain" }, { kind = "cash", value = -150 }]
reply = "他听我说完，帽子在手里转了好几圈。他去了，跟巡视员说了半个时辰。母亲不用跪了，只罚站，可床底下的像还是被装走了。他出来时不看我：“欠你母亲的，我只还得起这么多。”我谢他。他说别谢，下一季的盐价，要再商量。"

[tracks.chapters.timeout]
next = "t4_knock"
effects = [{ kind = "flag", flag = "rw_ix_nikte_mother_penance" }]
news = "科苏梅尔的人说，主教的巡视员在岛上住了半个月，走的时候带走了一口袋东西，岛上的接生婆从此不接生了。"

[[tracks.chapters.variants]]
key = "rw_burned"
when = [{ kind = "flag", flag = "rw_ix_nikte_chilan_burned" }]
text = "主教的巡视员过海来了，带着一张名单挨村问：谁还撒玉米，谁还在夜里给孩子念日子，谁家床底下有东西。他要找的是岛上最后那位契兰，名单上头一个就是他。我十六岁那年把记过的纸都烧了，老人的话只在我脑子里，巡视员翻不到——可他翻得到老人。老人病着，起不了身，要是被拖去梅里达，路上就会死。第二天一早，母亲换上那件出门才穿的深色衣裳，自己走到教堂前头，对巡视员说：“撒玉米的是我。岛上会念日子的，只剩我一个。”"

[[tracks.chapters.variants]]
key = "rw_kept"
when = [{ kind = "flag", flag = "rw_ix_nikte_chilan_kept_self" }]
text = "主教的巡视员过海来了，带着一张名单挨村问：谁还撒玉米，谁还在夜里给孩子念日子，谁家床底下有东西。他要找的是岛上最后那位契兰，名单上头一个就是他。老人的话缝在我药筐的夹层里，十几年没拆过。老人病着，起不了身，要是被拖去梅里达，路上就会死。第二天一早，母亲换上那件出门才穿的深色衣裳，自己走到教堂前头，对巡视员说：“撒玉米的是我。岛上会念日子的，只剩我一个。”"

[[tracks.chapters.variants]]
key = "rw_boy"
when = [{ kind = "flag", flag = "rw_ix_nikte_chilan_kept_boy" }]
text = "主教的巡视员过海来了，带着一张名单挨村问：谁还撒玉米，谁还在夜里给孩子念日子，谁家床底下有东西。他要找的是岛上最后那位契兰，名单上头一个就是他。老人的孙子胡安如今是镇上教堂的助手，替巡视员敲钟，那包油布就压在他的钟绳底下。老人病着，起不了身，要是被拖去梅里达，路上就会死。第二天一早，母亲换上那件出门才穿的深色衣裳，自己走到教堂前头，对巡视员说：“撒玉米的是我。岛上会念日子的，只剩我一个。”"

# t4 没人敲的门：罚了以后，第一个来敲门的产妇。读养成期的 rw_ix_nikte_kernels_pouch。
[[tracks.chapters]]
key = "t4_knock"
title = "没人敲的门"
text = "罚了以后，夜里再没人敲我家的门。产妇们去找别的婆子，或者自己咬着布生。母亲每夜坐在门边，坐到鸡叫，药筐挂在钩子上落了灰。屋子正中那两穗玉米，她早拔了，坑也填平了。一个刮北风的夜里，门终于响了，是对岸渔村来的男人，浑身湿透，说他女人生了一天一夜，孩子横着，别的婆子都摇头。母亲站起来，又坐下了。她被罚的，正是这个。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1575, 8, 1] }]
at = "cozumel"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
deadline = [1577, 12, 31]

[[tracks.chapters.choices]]
key = "through_wall"
text = "我去，母亲隔着墙教"
next = "t5_river"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_through_wall" }, { kind = "skill", skill = "herbal_medicine", value = 15 }]
reply = "我进屋接，母亲蹲在墙根，隔着一层棕榈叶，一句一句地说：手放哪儿，往哪边转，什么时候叫她用力。做到一半我的手抖了，她在墙外“嘘”了一声，我就不抖了。孩子落地，是个女孩。母亲在墙外坐了一夜，算起来，她没有进门。"

[[tracks.chapters.choices]]
key = "mother_go"
text = "替母亲把药筐取下来：去吧，罚我来担"
next = "t5_river"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_mother_went" }, { kind = "reputation", faction = "new_spain", value = -1 }]
reply = "母亲看着那只落了灰的药筐，看了很久，伸手接了，拍了两下灰。她走得比我快。天亮孩子落了地，是个男孩。礼拜天她照旧去教堂门口站着，站得比以前直。神父看了她一眼，没说什么，那家人谁也没说出去。"

[[tracks.chapters.choices]]
key = "both"
text = "两个人一起去"
next = "t5_river"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_mother_went" }, { kind = "fame", value = 1 }]
reply = "母亲接，我递，跟我十四岁那年一样。孩子横着，她把手伸进去转，转了三回，额上的汗滴在产妇肚子上。孩子落地没哭，她倒提着拍了两下，才哭出声。回来的路上她靠着我走：“这一回，又骗过去了。下一回，就该轮到我自己了。”"

[tracks.chapters.timeout]
next = "t5_river"
effects = []
news = "科苏梅尔的人说，那个被罚的接生婆夜夜坐在门口，岛上的产妇宁可去对岸，也不敢敲她的门。"

[[tracks.chapters.variants]]
key = "rw_pouch"
when = [{ kind = "flag", flag = "rw_ix_nikte_kernels_pouch" }]
text = "罚了以后，夜里再没人敲我家的门。产妇们去找别的婆子，或者自己咬着布生。母亲每夜坐在门边，坐到鸡叫，药筐挂在钩子上落了灰。她那半袋红玉米跟床底下的像一起没了，我这半袋还在腰上，她一回也没跟我要。一个刮北风的夜里，门终于响了，是对岸渔村来的男人，浑身湿透，说他女人生了一天一夜，孩子横着，别的婆子都摇头。母亲站起来，又坐下了。她被罚的，正是这个。"

# t5 撒进河里的骨头：母亲临终，要嘴里含一粒玉米、一颗绿石珠（兰达记的玛雅葬俗）。
[[tracks.chapters]]
key = "t5_river"
title = "撒进河里的骨头"
text = "母亲六十四了，冬天咳了一场，开春就起不来了。她叫我把吊床挪到屋子正中，挪到当年埋玉米的地方。她把那个老故事的最后一段又讲了一遍：双生兄弟自己跳进炉子，骨头磨成粉撒进河里，第五天从水里回来。讲完她说：“我骗过他们一回，罚过了。这一回，该轮到我自己进炉子了。”她要我答应一件事：她死了，嘴里放一粒玉米、一颗绿石珠，照老人们的规矩。神父的规矩里，没有这一条。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_act3" }, { kind = "date", from = [1580, 2, 1] }]
at = "cozumel"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte"]
deadline = [1582, 12, 31]

[[tracks.chapters.choices]]
key = "old_way"
text = "答应她：照老规矩，埋在屋后"
next = "t6_fifth_day"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_old_burial" }, { kind = "reputation", faction = "itza", value = 1 }, { kind = "reputation", faction = "new_spain", value = -2 }]
reply = "她走的那夜，我把一粒红玉米、一颗她项链上的绿石珠放进她嘴里，用棉布裹好，跟姨母两个人埋在屋后的可可树下，没告诉神父。第二天神父来问，我说母亲回对岸娘家去了。他在册子上记了两个字：迁出。"

[[tracks.chapters.choices]]
key = "both_ways"
text = "请神父来行终傅，玉米和石珠藏进她嘴里"
next = "t6_fifth_day"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_both_burial" }]
reply = "神父来了，给她抹了油，念了经，母亲睁着眼听完，对他道了一声谢。神父一走，我把玉米和石珠放进她嘴里，她自己合上了。她葬在教堂的院子里，名册上写的是她的教名。只有我知道，她嘴里含着另一种规矩。"

[[tracks.chapters.choices]]
key = "church"
text = "求她：就照神父的规矩吧，别再罚一回"
next = "t6_fifth_day"
effects = [{ kind = "flag", flag = "rw_ix_nikte_t_church_burial" }, { kind = "reputation", faction = "new_spain", value = 1 }]
reply = "母亲看着我，看了很久，像看一个刚接到这世上的孩子。“好，”她说，“你怕，我不怪你。”她葬在教堂的院子里，嘴里什么也没有。下葬那天，我在口袋里攥着那粒玉米攥了一路，回家以后，埋在了屋子正中。"

[tracks.chapters.timeout]
next = "t6_fifth_day"
effects = []
news = "科苏梅尔那个被罚过的老接生婆死了，听说下葬那天，岛上好几个女人在家里点了一撮香。"

# t6 第五天：屋子正中钻出一根玉米芽；同一夜生的埃克来请她接生。终章 next = done，不抢主线 c08 的落点。读 t5 的三个葬法旗标（互斥）。
[[tracks.chapters]]
key = "t6_fifth_day"
title = "第五天"
text = "雨季来了。母亲走后的头一个雨季，屋子正中的泥地上钻出一根玉米芽，没人种过——也许是她早年埋下的，也许是那年拔的时候落下的一粒。姨母眼花了，看了三遍才信。那天下午，北村的埃克来敲门，他媳妇要生了。“你娘接的我，”他说，“我娘说，要你来接我的孩子。”我看了看墙上的钩子，母亲的药筐挂在那里，筐沿磨得发亮。"
when = [{ kind = "flag", flag = "c13_main_ix_nikte" }, { kind = "date", from = [1580, 8, 1] }]
at = "cozumel"
speaker = "captain"
mood = "tender"
cast = ["ix_nikte"]

[[tracks.chapters.choices]]
key = "go"
text = "取下药筐，跟他走"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_twins_end_go" }, { kind = "skill", skill = "herbal_medicine", value = 20 }]
reply = "筐里的小刀、布卷、瓶子一样不少，是母亲走前收拾好的。埃克的孩子半夜落地，是个女孩，哭得很响。埃克的母亲把孩子递给我，要我念她的日子。我念了，念完才发现，用的是母亲的调子。"

[[tracks.chapters.choices]]
key = "send"
text = "叫他去请别的婆子：我不是接生的人"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_twins_end_sent" }]
reply = "埃克愣了一下，没争，转身跑了。我站在门口看他跑远，手却已经把药筐从钩子上摘了下来。我在门槛上坐了一夜，药筐搁在膝上，等他回来说生了，或者回来再叫我。天亮他来了，说生了，是个儿子，别的婆子接的。"

[[tracks.chapters.choices]]
key = "water"
text = "先给那根玉米芽浇一瓢水，再走"
next = "done"
effects = [{ kind = "flag", flag = "rw_ix_nikte_twins_end_water" }, { kind = "skill", skill = "herbal_medicine", value = 10 }]
reply = "我舀了一瓢水，浇得很慢，浇完蹲着看水渗下去。埃克在门口急得直跺脚。我站起来，取下药筐，跟他走了。走出几步回头看，那根芽在雨里一动不动，像一个站在门口等人的孩子。"

[[tracks.chapters.variants]]
key = "rw_both"
when = [{ kind = "flag", flag = "rw_ix_nikte_t_both_burial" }]
text = "雨季来了。母亲走后的头一个雨季，屋子正中的泥地上钻出一根玉米芽，没人种过。教堂院子里那座新坟上长了草，没人知道坟里的人嘴里含着什么。姨母眼花了，看了三遍才信那是玉米。那天下午，北村的埃克来敲门，他媳妇要生了。“你娘接的我，”他说，“我娘说，要你来接我的孩子。”我看了看墙上的钩子，母亲的药筐挂在那里，筐沿磨得发亮。"

[[tracks.chapters.variants]]
key = "rw_church"
when = [{ kind = "flag", flag = "rw_ix_nikte_t_church_burial" }]
text = "雨季来了。母亲走后的头一个雨季，屋子正中的泥地上钻出一根玉米芽，就在下葬那天我埋下那一粒的地方。它到底还是长出来了。姨母眼花了，看了三遍才信。那天下午，北村的埃克来敲门，他媳妇要生了。“你娘接的我，”他说，“我娘说，要你来接我的孩子。”我看了看墙上的钩子，母亲的药筐挂在那里，筐沿磨得发亮。"

[[tracks.chapters.variants]]
key = "rw_old"
when = [{ kind = "flag", flag = "rw_ix_nikte_t_old_burial" }]
text = "雨季来了。屋后可可树下的土，雨一冲就平了，看不出埋过人。母亲走后的头一个雨季，屋子正中的泥地上钻出一根玉米芽，没人种过。姨母眼花了，看了三遍才信。那天下午，北村的埃克来敲门，他媳妇要生了。“你娘接的我，”他说，“我娘说，要你来接我的孩子。”我看了看墙上的钩子，母亲的药筐挂在那里，筐沿磨得发亮。"
