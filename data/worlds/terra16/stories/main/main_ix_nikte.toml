# ───────────── 增写旁轨（2026-11-11）：马尼的火（兰达），7 章（f4b 在 f4 与 f5 之间） ─────────────
# 母本：兰达《尤卡坦风物志》里他自己写下的焚书（“他们悲伤得惊人”）与字母表；对照拉斯·卡萨斯《西印度毁灭述略》（1552）；
#   文化：方济各会的救灵热忱与宗教审判——慈悲与绳子出自同一份热心；张力：他爱这片土地、学它的话、量它的石头，也把它的书当魔鬼的书烧掉，到死都觉得自己在救人。
# 不加旁白审判，也不洗白：他的话全按他自己的道理说（“爱一个人，才要把他从火里拉出来”“后悔没早来二十年”）。不编私情。
# 入口：c13_main_ix_nikte（a00 default 设）加日期；f4 读 _act2，f6 读 _act3。各章有期限与 timeout，没赶上就静默往下走；f6 是终章（next = done）。
# 秘密：f1、f2 在 a07 以前或同年，不写书与她家的关系；f2 以前不写她对“玛丽亚”的想法（b04 以前）——这里只有别人这样叫她。
# 史实取舍：1558—1561 他的职务只写“管事的人”；托拉尔 1562 年 8 月到任叫停审问；约 1566 年在西班牙写书（托人带问题单来是本线的细节）；
#   1573 年起任主教，主教府收各村偶像；1579 年 4 月底死于梅里达，正月起病、放血是本线的细节。“书里的路”即字母表里 B 的脚印。
