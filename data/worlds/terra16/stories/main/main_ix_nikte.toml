# 伊希·妮克特：月之岛（主线脊轨，故事 2.0，A5 / E37 契约，C13a 第九批）
# 2026-11-01 接回登记：亚特兰蒂斯补章 main_ix_nikte_atlantis 与本线同批登记；c05_after 的 when 加 c13_main_ix_nikte_atlantis_over，由补章的结局与 c04_dark_sea 的掉头 / 缺席分支设。
# 标签：月之岛；家乡港科苏梅尔（cozumel）；主线 main_ix_nikte，27 章，auto = true，start = a00_gate。
# 依据（史实）：兰达《尤卡坦风物志》里的科苏梅尔朝圣与伊希切尔节；1562-07-12 马尼的焚书；1562-08 托拉尔主教到任；
#   1563 兰达被送回西班牙受审；1568-09 圣胡安·德·乌卢阿；1570 科苏梅尔逐户普查（主持神父只在正文里提，写作阿森西奥）；
#   1571 法国船劫科苏梅尔教堂（待核：月份与船主，正文只写“法国船”）；1573-10 兰达以主教身份回来；
#   1579-04-29 兰达死于梅里达；1553 王室收缴戈马拉《西印度通史》（正文只透出“这书是禁的”）；1583 特塞拉岛之战。
# 原创：伊希一家、两位马尼证人、井底的法国孩子、老预言者契兰的话、阿兹特兰的猜测、塞诺特里的回忆。
# 历法：玛雅日子按 GMT 584284 换算（与 C7 坎·佩奇的信一致）；1582 年以前用儒略历日期，1583 年以后用新历日期。
# 秘密：a07_codex（1562）揭开家里藏着旧书；b04_two_names（1570）揭开两个名字。
#   a07 以前一个字不写书与她家的关系；b04 以前可以写别人叫她“玛丽亚”，不写她为此怎么想。两件事永远不进见闻。
# 读的共享旗标：c12_voyage_ix_nikte（门槛，C12 结业设）；c7_bond_ines_solis_*（b04 一句变体）；
#   c7_bond_xochitl_landing_friend / _landing_love / _promise、c7_pair_xochitl_ines_solis_together（b07 一句变体）；
#   atlantis_council_met、atlantis_verdict_close / _open（c05 变体，C11 登记后才生效）；HIST_* 占位（见下）。
# 设的共享旗标：c13_main_ix_nikte（a00 default，C13d 与 NPC 线读）；_act2（b01 所有分支与 default）；_act3（c01 default）；
#   _sotuta_buyers、_alliance_lead、_salt_poor、_itza_carried / _itza_hidden、_codex_ship / _codex_cenote / _codex_chi / _codex_home、
#   _lever_r03（可选杠杆钥匙）、_saved_books / _saved_family / _fed_prisoners / _names_kept、_witnesses_sent、_chi_spoke、
#   _name_maria / _name_both / _name_ix、_boy_named、_petitioned、_codex_moved、_village_burned（b02 超时）、_aztlan、
#   _jade_eye、_keepsake、_stance_close / _stance_open / _stance_hand、_crossed / _turned_back / _absent、
#   _codex_lake / _codex_island / _codex_copied、_done 与 _end_canoes / _end_healer / _end_scribe。
# 等待的包：A9（门槛章可加 protagonist 条件；若引擎接管开轨道，auto 改 false）；
#   C10（r03_mani_codices_people_and_codices_sheltered 见 a09；HIST_H20 / H33 / H53 / H56 在 a08、b01、c02、c04、c03 按 C10 表替换；
#   杠杆钥匙 c13_main_ix_nikte_lever_r03（a07）与 _lever_h33（b01），不用就删）；
