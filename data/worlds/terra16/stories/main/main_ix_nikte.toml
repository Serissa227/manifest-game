# a05 一根打结的绳：同盟的头，纳奇·科科姆与修家的仇。
[[tracks.chapters]]
key = "a05_alliance"
title = "一根打结的绳"
text = "坎佩切城外玛雅人的老村子，棕榈棚下坐满了沿岸几个镇子的独木舟商人。中间摊着一根棉绳，每个镇子打一个结，结的大小就是这个镇子出的船。监护主的代理人这两年按他们的价强收盐和蜂蜡。索图塔的领主纳奇·科科姆亲自从内陆下来了，坐在最靠里的位置，他要同盟听科科姆家的。有人提议把马尼的修家也拉进来，纳奇当场冷了脸，同盟差点在第一个结上散掉。纳奇说：“先说是谁引你来的。在索图塔，没人引荐的客人，连井水都喝不上。”又说：“修家要入，就先把奥茨马尔的账算清。”我说：“绳子是棉的，仇是你们两家的。船是我的。”"
when = [{ kind = "date", from = [1560, 2, 1] }]
at = "campeche"
speaker = "captain"
mood = "tense"
cast = ["ix_nikte", "nachi_cocom"]
deadline = [1561, 3, 31]

[[tracks.chapters.choices]]
key = "lead"
text = "我来牵头：海上的价，独木舟说了算"
next = "a06_salt_run"
check = { attr = "command", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_alliance_lead" }, { kind = "reputation", faction = "sotuta", value = 2 }, { kind = "fame", value = 2 }]
reply = "我把自己的结打在绳子正中，打得比纳奇的还大。纳奇盯着那个结看了很久，最后说：“海归你，林子归我。”商人们把头抬了起来，有人伸手去量那个结的大小。"
news = "纳奇在坎佩切的棕榈棚下说：“海归你，林子归我。”一根棉绳上打了七个结，最大的那个是科苏梅尔的。"

[tracks.chapters.choices.fail]
next = "a06_salt_run"
effects = [{ kind = "reputation", faction = "sotuta", value = 1 }]
news = "商人们看了看说话的姑娘，又看看纳奇，把头低下了。科苏梅尔的结打在了绳尾。"

[[tracks.chapters.choices]]
