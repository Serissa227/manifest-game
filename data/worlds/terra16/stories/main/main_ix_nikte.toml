# ── 第一幕 1557—1566 启航 ──

# a00 门槛见闻：渔村的闲话，只带一句小转折。
[[tracks.chapters]]
key = "a00_gate"
title = "回岛的独木舟"
text = "科苏梅尔西岸的渔村，北风刚停，海面亮得刺眼。两条刷着红土的独木舟靠了岸，四十个桨手跳进齐腰的水里，往沙滩上拖。晒网的木架底下，渔夫们边看边说：独木舟商队首领家的女儿从梅里达的修院学校回来了。人还没上岸，先站在船头一个一个数桨手的工钱。“梅里达的修士给她换了个名字，岛上的狗可没换，照样冲她摇尾巴。”"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "cozumel"
stage = "rumor"
mood = "cheerful"
cast = ["ix_nikte"]
when = [{ kind = "flag", flag = "c12_voyage_ix_nikte" }]
news = "科苏梅尔的渔夫说，独木舟商队首领的女儿从梅里达回来了，船还没靠稳，先把桨手的可可豆数了两遍。"

[tracks.chapters.default]
next = "a01_stones"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte" }]

# a01 只剩石头的庙：空龛与变小的龛，一个动作收住。
[[tracks.chapters]]
key = "a01_stones"
title = "只剩石头的庙"
text = "上岸第三天清早，我独自穿过灌木，去岛中间的老庙。台阶让一棵野无花果的根撑裂了。供台上三块熏黑的印子，是从前烧柯巴脂留下的。龛里落着一层鸟毛，是空的。门口一个拾柴的小孩问：“你也是来拆石头盖教堂的吗？”我记得这龛比我的头还高。那面黄铁矿镜裹在我腰间的布袋里，是守庙的老妇人在我去梅里达那年塞给我的。我把它掏出来，想放回龛里。龛比记忆里小得多。不是龛变小了，是我长大了。我把镜子收回布袋。一五五七年一月十日，十二 Etznab。"
window = [[1557, 1, 7], [1557, 3, 31]]
at = "cozumel"
stage = "witness"
speaker = "captain"
mood = "sad"
cast = ["ix_nikte"]
news = "科苏梅尔岛上的人说，伊希切尔的老庙今年一个朝圣的人也没等到，只有商队首领家的女儿去扫了一回台阶。"

[tracks.chapters.default]
next = "a02_first_canoe"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-a01", title = "只剩石头的庙" }]

# a02 第一船盐：限期交货，修士的秤上有一块蜡。
[[tracks.chapters]]
key = "a02_first_canoe"
title = "第一船盐"
text = "坎佩切码头后头的盐仓，正午，地上的盐粒硌脚。父亲把第一趟买卖交给我：岛上晒的十袋盐。方济各会修院的厨房修士拎着一杆西班牙秤来了，内陆索图塔来的玛雅商人背着可可豆和棉布也来了，两边隔着盐袋互相看。修士的秤砣底下粘着一块蜡，秤是偏的。我看见了。修士说：“盐要干的。潮的，我按半价。”我说：“岛上的盐晒足了七个太阳。修士，您先把秤砣底下那块蜡抠了，咱们再称。”索图塔的商人说：“可可豆是论颗的，不论秤。”"
at = "campeche"
speaker = "captain"
mood = "cheerful"
cast = ["ix_nikte"]
objectives = [{ kind = "goods", good = "salt", qty = 10, at = "campeche", text = "把十袋盐运到坎佩切" }]
deadline = [1557, 5, 31]

[[tracks.chapters.choices]]
key = "friars"
text = "抠掉蜡，照修院的秤卖给厨房"
next = "a03_itza"
effects = [{ kind = "cash", value = 350 }, { kind = "reputation", faction = "new_spain", value = 2 }]
reply = "修士红了脸，把蜡抠下来，嘴里念了半句经。银子一枚一枚数到我手里，最后一枚他多按了一下，像是赔不是，又像是记住了我。盐搬上骡车的时候，他把秤砣翻过来又看了一遍，没再说话。"
news = "坎佩切的盐仓里，科苏梅尔来的小姑娘当着修士的面，把秤砣底下的蜡抠了下来。"

[[tracks.chapters.choices]]
key = "sotuta"
text = "按玛雅的规矩，换索图塔商人的可可豆"
next = "a03_itza"
effects = [{ kind = "cash", value = 250 }, { kind = "reputation", faction = "sotuta", value = 2 }, { kind = "flag", flag = "c13_main_ix_nikte_sotuta_buyers" }]
reply = "商人一颗一颗数豆子，数到一半停下来问我父亲是谁。听完他点点头，把剩下的豆子整袋推过来，不数了。他说明年雨季以前还来。“那时候，你家的盐要是还潮，就别拿来。”"
news = "坎佩切的玛雅商人说，科苏梅尔来的小姑娘拿盐换豆，换到一半他把剩下的豆子整袋推过去，连数都不数了。"

[[tracks.chapters.choices]]
key = "haggle"
text = "让两边当着面出价，谁高卖谁"
next = "a03_itza"
check = { attr = "commerce", base = 20, per = 7 }
effects = [{ kind = "cash", value = 450 }]
reply = "两边当着面抬价：修士加一句，商人跟一句，盐袋上方的价钱一路往上走。我站在两边中间不说话，只把豆子一颗一颗地数着。修士最后咬着牙出了价，商人笑着走了，走的时候说这丫头像她爹。"
news = "坎佩切码头上，修士咬着牙出了高价，索图塔的商人笑着说，这丫头像她爹。"

[tracks.chapters.choices.fail]
next = "a03_itza"
effects = [{ kind = "cash", value = 220 }, { kind = "reputation", faction = "sotuta", value = -1 }]
news = "坎佩切码头上，两边的买家一起冷了脸，盐被按低价卖给了先走回来的那一个。"

[tracks.chapters.timeout]
next = "a03_itza"
effects = []
news = "坎佩切的修院厨房这个月的盐，没有从科苏梅尔的船上买，是从一艘外地来的船上买的，价钱比科苏梅尔的盐贵了一截。"

[[tracks.chapters.variants]]
key = "rw_ledger"
when = [{ kind = "flag", flag = "rw_ix_nikte_second_ledger" }]
text = "坎佩切码头后头的盐仓，正午，地上的盐粒硌脚。父亲把第一趟买卖交给我：岛上晒的十袋盐。那张盖了印的许可状叠了三叠，贴在我胸口；另一本账在我脑子里，父亲说，那一本不归坎佩切管。方济各会修院的厨房修士拎着一杆西班牙秤来了，内陆索图塔来的玛雅商人背着可可豆和棉布也来了，两边隔着盐袋互相看。修士的秤砣底下粘着一块蜡，秤是偏的。我看见了。修士说：“盐要干的。潮的，我按半价。”我说：“岛上的盐晒足了七个太阳。修士，您先把秤砣底下那块蜡抠了，咱们再称。”索图塔的商人说：“可可豆是论颗的，不论秤。”"

# a03 往湖上去的人：夜里的货岸，逃人，一个认得她母亲的老人。
[[tracks.chapters]]
key = "a03_itza"
title = "往湖上去的人"
text = "雨季的夜里，一条借来的小独木舟摸进我家的货岸。一个手腕上有贡赋绳勒痕的老人，一个抱着孩子的年轻母亲，两个半大的男孩，从对岸的村子里逃出来。修士要把几个小村并进大镇，监护主的人挨家来点人头。他们要往南去，去佩滕湖上的诺赫佩滕。那座城不交贡赋，也不让修士上岸。能进南边林子的河口，只有我的船走得到。老人从怀里摸出一串打了结的棉绳，结的数目是他们村的人数。他看了我很久，说他认得我母亲。我出生那天，是他划船把接生婆送到岛上的。老人说：“湖上的人说，他们那儿的鼓，还是从前的鼓。”我说：“到河口要九天。路上不许哭，不许生火，孩子饿了先饿着。”年轻母亲低声问：“她答应了？”"
when = [{ kind = "date", from = [1557, 6, 1] }]
at = "cozumel"
night = true
speaker = "captain"
mood = "tense"
cast = ["ix_nikte"]
deadline = [1559, 10, 31]

[[tracks.chapters.choices]]
key = "carry"
text = "载他们南下，送到能进林子的河口"
next = "a04_lake_city"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_itza_carried" }, { kind = "reputation", faction = "itza", value = 3 }, { kind = "reputation", faction = "new_spain", value = -2 }]
reply = "九天，没生过一回火。到了河口，老人把那串结绳解下一截给我：“这一截是你。”我嘴上说不要，还是缠在了桨柄上。那几夜雨下个不停，我让桨手贴着岸边的芦苇走，每天只给他们一顿玉米。"
news = "听说科苏梅尔有条独木舟往南走了九天，回来的时候船上空了，桨柄上多了一截结绳。"

[[tracks.chapters.choices]]
key = "hide"
text = "把他们藏在岛上，算作早就住在这里的人家"
next = "a04_lake_city"
check = { attr = "intrigue", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_itza_hidden" }, { kind = "reputation", faction = "itza", value = 1 }]
reply = "母亲给孩子们换了岛上的衣裳，老人学着岛上的口音说话。我把人领进西边的屋子，村口的事交给了母亲去应付。第三天，邻居就有人说记得他们，说是几年前来的远房亲戚。"
news = "科苏梅尔的邻居说，西岸这个春天忽然多了几户远房亲戚，都说早就住在那儿。"

[tracks.chapters.choices.fail]
next = "a04_lake_city"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_itza_hidden" }, { kind = "reputation", faction = "new_spain", value = -3 }]
news = "科苏梅尔的村口，监护主的人在本子上画了个记号，说西岸的人家多了几口。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不载：给水和玉米，让他们天亮前自己走"
next = "a04_lake_city"
effects = [{ kind = "reputation", faction = "new_spain", value = 1 }]
reply = "我把两罐水、一篮玉米放在货岸上，转身回屋，没有送。天亮的时候小独木舟不见了，沙上留着孩子光脚的印子，一直通到水里。天亮前，我听见货岸那头有水声，没有回头去看。"

[tracks.chapters.timeout]
next = "a04_lake_city"
effects = []
news = "科苏梅尔对岸的村子这两年跑了好几户人家，监护主的人说是往南边的林子里去了。"

[[tracks.chapters.variants]]
key = "rw_south"
when = [{ kind = "flag", flag = "rw_ix_nikte_salt_south" }]
text = "雨季的夜里，一条借来的小独木舟摸进我家的货岸。一个手腕上有贡赋绳勒痕的老人，一个抱着孩子的年轻母亲，两个半大的男孩，从对岸的村子里逃出来。修士要把几个小村并进大镇，监护主的人挨家来点人头。他们要往南去，去佩滕湖上的诺赫佩滕。那座城不交贡赋，也不让修士上岸。能进南边林子的河口，只有我的船走得到。那个河口我认得，十三岁那年跟父亲在没点灯的夜里去过，红树林里有人等着拿蜂蜡换盐。老人从怀里摸出一串打了结的棉绳，结的数目是他们村的人数。他看了我很久，说他认得我母亲。我出生那天，是他划船把接生婆送到岛上的。老人说：“湖上的人说，他们那儿的鼓，还是从前的鼓。”我说：“到河口要九天。路上不许哭，不许生火，孩子饿了先饿着。”年轻母亲低声问：“她答应了？”"

# a04 湖上的城：旱季的盐贩闲话，变体读 a03 的选择。
[[tracks.chapters]]
key = "a04_lake_city"
title = "湖上的城"
text = "旱季开头，从南边划回来的盐贩在科苏梅尔的货岸上歇脚，说起佩滕湖：湖心的岛上房子挤到水边，独木舟比西班牙人的骡子还多，城里的祭司照旧数日子。盐贩换了一顿可可，话却不肯住嘴。“湖上的人不认西班牙国王，也不认墨西哥城的那个。他们说，国王是湖。”"
window = [[1559, 11, 1], [1560, 1, 31]]
at = "cozumel"
stage = "rumor"
mood = "tender"
cast = ["ix_nikte"]
news = "从南边回来的盐贩在科苏梅尔说，佩滕湖上那座城的人还不交贡赋，西班牙人的船进不了那片湖。"

[tracks.chapters.default]
next = "a05_alliance"
effects = []

[[tracks.chapters.variants]]
key = "v1_carried"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_itza_carried" }]
text = "旱季开头，从南边划回来的盐贩在科苏梅尔的货岸上歇脚，说起佩滕湖：湖心的岛上房子挤到水边，独木舟比西班牙人的骡子还多。盐贩说，湖边的村子里有个手腕上带绳痕的老人，见人就打听科苏梅尔的独木舟。盐贩换了一顿可可，话却不肯住嘴。“湖上的人不认西班牙国王，也不认墨西哥城的那个。他们说，国王是湖。”"

