# c02 书里的五块石头：戈马拉书里的雕石，伊希认出那是玉。
[[tracks.chapters]]
key = "c02_cortes_stones"
title = "书里的五块石头"
text = "韦拉克鲁斯书店的后屋，老板从一块包布里取出一本不许卖的书，书页发黄。其中一页写科尔特斯带回西班牙的五块雕好的“祖母绿”：一朵玫瑰、一只号角、一条金眼的鱼、一只拿大珍珠当铃舌的小铃、一只金脚的小杯。后来它们随皇帝的船队沉在了阿尔及尔外海。我把自己的玉耳珰摘下来，对着窗口的光，跟书上的描述一样一样地比。老板说：“这本书，官府收过一回。剩下的，都在柜子底下。”我说：“墨西加人的绿石头，我耳朵上就戴着一块。它不是祖母绿。”我心里想：五块玉，沉在一个我连名字都念不准的海里。"
when = [{ kind = "date", from = [1579, 8, 1] }]
at = "veracruz"
speaker = "captain"
mood = "mystic"
cast = ["ix_nikte"]
deadline = [1581, 12, 31]

[[tracks.chapters.choices]]
key = "write_algiers"
text = "托商人带封信去阿尔及尔：捞石头的人得知道那是玉"
next = "c03_summons"
requires = [{ kind = "cash", ge = 150 }]
hint = "托人带信过两片海，要的不只是一句好话。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_jade_eye" }, { kind = "cash", value = -150 }, { kind = "memory", memory = "mem-main_ix_nikte-c02", title = "书页上的五块石头" }]
reply = "我不知道阿尔及尔该寄给谁，就写“给在皇帝沉船那片海里下水的人”。商人笑我，我把可可豆拍在桌上，商人就不笑了。商人收了钱，说这封信要过三个月才能到，他没有保证。"
news = "韦拉克鲁斯的商人要去阿尔及尔，带走了一封写给“沉船那片海里下水的人”的信。"

[[tracks.chapters.choices]]
key = "keep"
text = "不说，只把五块石头描在账本背面"
next = "c03_summons"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_jade_eye" }, { kind = "memory", memory = "mem-main_ix_nikte-c02", title = "书页上的五块石头" }]
reply = "我照着书描：玫瑰、号角、鱼、铃、杯。描完在旁边写了一个玛雅字，意思是“绿的、贵的、会呼吸的石头”。老板看不懂，以为我在记账。"

[[tracks.chapters.choices]]
key = "sell"
text = "把这一页的描样卖给收奇物的商人"
next = "c03_summons"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_jade_eye" }, { kind = "cash", value = 300 }, { kind = "memory", memory = "mem-main_ix_nikte-c02", title = "书页上的五块石头" }]
reply = "收奇物的商人出了好价，问我这五块石头值多少。我说：“值你以为的一半。另一半，是你认错的那部分。”商人没听懂，付了钱。收奇物的商人还问我，这一页的描样能不能卖两份。我说只有一份。"
news = "韦拉克鲁斯的收奇物商人花大价钱买了一页描样，说是科尔特斯丢在海里的五块绿石头。"

[tracks.chapters.timeout]
next = "c03_summons"
effects = []
news = "韦拉克鲁斯的书店后屋压着一本官府收过的书，听说里面写着科尔特斯丢在海里的五块绿石头。"

# c03 镜子里的柱子：召请，无 at，日子一到在任何地方弹出。
[[tracks.chapters]]
key = "c03_summons"
title = "镜子里的柱子"
text = "雨季的一个夜里，船舱里只点了一盏鱼油灯。我照例把黄铁矿镜拿出来擦。镜子里映出来的不是我的脸，是一根红金色的柱子，柱身上刻满了字，四周是一圈一圈的水。只看了一眼，灯花一跳，镜子里又是我自己。舱外守夜的人问：“船长，又看见什么了？”我说：“一圈水，一圈陆，一圈水。”老脚夫布上的湖边，也是三个圈。我对自己说，要去，就带着它去。它原来就不是我的。"
when = [{ kind = "date", from = [1582, 6, 1] }]
speaker = "captain"
mood = "mystic"
night = true
cast = ["ix_nikte"]
deadline = [1583, 2, 28]

[[tracks.chapters.choices]]
key = "close_mirror"
text = "带镜子去：雾里有雾里的人，别把那片海翻开"
next = "c04_dark_sea"
requires = [{ kind = "item", item = "ix_pyrite_mirror", qty = 1 }]
hint = "镜子不在你身边。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_keepsake" }, { kind = "flag", flag = "c13_main_ix_nikte_stance_close" }]
reply = "我把镜子裹回母亲缝的软布袋，说给自己听：湖上的人躲了这么多年，就是因为没人找得到那片湖。别人的湖也一样。船舱里的鱼油灯跳了一下，我没有去吹它。"

[[tracks.chapters.choices]]
key = "open_mirror"
text = "带镜子去：让雾散开，湖上的人也能走出来"
next = "c04_dark_sea"
requires = [{ kind = "item", item = "ix_pyrite_mirror", qty = 1 }]
hint = "镜子不在手边，没法让雾散开。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_keepsake" }, { kind = "flag", flag = "c13_main_ix_nikte_stance_open" }]
reply = "我想起老脚夫的话：没人画过往回走的路。要是那片海开了，路就有了两头。我把镜子揣进怀里，贴着心口，一路上它都是温的。这一句我没有说给船上任何人听。"

[[tracks.chapters.choices]]
key = "hand_stay"
text = "镜子留在岛上：那片海，交给守得住的人去管"
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_stance_hand" }]
reply = "我把镜子交给岛上最后的几位老妇人保管，自己空着手去。老妇人说镜子会等我，我说镜子等的不是我。她们用一块旧布把镜子包好，放回龛里，龛里落着的鸟毛一根也没有动。"

[tracks.chapters.timeout]
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_stance_close" }]

[[tracks.chapters.variants]]
key = "v1_boy"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_boy_named" }]
text = "雨季的一个夜里，船舱里只点了一盏鱼油灯。我照例把黄铁矿镜拿出来擦。镜子里映出来的不是我的脸，是一根红金色的柱子，柱身上刻满了字，四周是一圈一圈的水。只看了一眼，灯花一跳，镜子里又是我自己。舱外守夜的是卡伊，当年井底的那个孩子，如今是我船上最好的桨手。他问船长，镜子是不是又亮了。我说：“一圈水，一圈陆，一圈水。”老脚夫布上的湖边，也是三个圈。我对自己说，要去，就带着它去。它原来就不是我的。"

# c04 亚速尔以西：历史现场，海草与雾，巴赞的舰队。
[[tracks.chapters]]
key = "c04_dark_sea"
title = "海草那头的光"
text = "这辈子我第一次离开玛雅的海这么远。独木舟到不了这里，我的船是换过索具的欧洲船。特塞拉岛的安格拉湾外挤满了圣克鲁斯侯爵的船，七月底他们要在岛的另一头登陆。我的船往西开了三天。海面上浮着一片一片的海草，风停了，罗经的针在玻璃罩里来回跳。盘查的军官上船来，巴赞听了汇报，说：“不是法国人的船？那就让她往西去，西边什么也没有。”老水手说：“针不指北了，船长，它在指别的什么。”海草的另一头起了雾，雾里有一点红金色的光，跟镜子里一样。一五八三年七月二十六日，十 Imix。"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
stage = "involve"
speaker = "captain"
mood = "mystic"
cast = ["ix_nikte", "alvaro_de_bazan"]
news = "安格拉的人说，西班牙人拿下特塞拉岛的那个夏天，有几条外国船往西开进了海草里，有的回来了，有的没有。"

[tracks.chapters.default]
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_absent" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]

[[tracks.chapters.choices]]
key = "cross"
text = "穿进去"
next = "c05_after"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "没有那片抄着《翠玉录》的纸，船只会在海草里打转。"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_crossed" }]
reply = "我把那片抄着拉丁文的纸压在罗经的玻璃罩上，针慢慢停住，指向雾里那点光。船头碰开海草的声音，像有人在水底翻书。海草在船底下嘶嘶地响，像有人用手指在皮子上划。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头：回有风的海去"
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_turned_back" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
reply = "我下令掉头。第二天早上风回来了，海草已经在船尾后面。我回头看了一眼，雾还在，光没了。老水手在舵边说：“针又指北了。”我没有回答。"

[[tracks.chapters.choices]]
key = "pull_survivors"
text = "回特塞拉的海湾，去捞海战里落水的人"
next = "c05_after"
check = { attr = "medicine", base = 35, per = 6 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_turned_back" }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
reply = "我用母亲的法子止血、接骨，船舱里躺满了葡萄牙人和法国人，一个西班牙兵也在里面，没人问他是哪一边的。我一个一个地看过去，手上的血干了又湿。"
news = "安格拉的人说，特塞拉岛的海湾里有条外国小船救上来一舱的伤兵，船上的女人用老法子止血接骨。"

[tracks.chapters.choices.fail]
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_turned_back" }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
news = "特塞拉岛的海湾里，救上来的人有一半没熬过夜，天亮时被缝进帆布，推下了海。"

# c05 放得进镜子的岛：那以后，无 at，读 C11 的判决与会议旗标。
[[tracks.chapters]]
key = "c05_after"
title = "放得进镜子的岛"
text = "秋天，往回走的船上。雾没有开。我站在船头，把这一趟从头想了一遍。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_ix_nikte_atlantis_over" }]
speaker = "captain"
mood = "tender"
cast = ["ix_nikte"]

[[tracks.chapters.choices]]
key = "tell_elders"
text = "回岛以后，把看见的讲给老妇人们听"
next = "c06_chilam"
effects = [{ kind = "skill", skill = "cartography", value = 15 }]
reply = "回到岛上那晚，老妇人们听完，用玉米粒在地上照我说的摆了一个圈，又摆一个圈。我跪下去，替她们把海草的那一片也摆上。老妇人说，日子里早就有这样的地方，只是没人划船去过。"

[[tracks.chapters.choices]]
key = "silent"
text = "谁也不说"
next = "c06_chilam"
effects = [{ kind = "memory", memory = "mem-main_ix_nikte-c05", title = "回来的人" }]
reply = "回到岛上，我把船拖上岸，刮船底，补桨，跟从前每一次回岛一样。夜里我一个人去塞诺特游了很久，游到月亮从洞口挪开。第二天有人问起这一趟航程，我说风不好，就没有再提。"

[[tracks.chapters.choices]]
key = "write"
text = "用两种字写下来：拉丁字母一遍，玛雅的画字一遍"
next = "c06_chilam"
effects = [{ kind = "skill", skill = "lang_latin", value = 20 }]
reply = "我写了两遍。拉丁字母那一遍写得快，画字那一遍写到一半停了：笔尖落在一个圈上，玛雅的字里没有画法能把它接下去。写完我把两张纸对着看，发现有两个地方的意思对不上，就空着没补。"

[[tracks.chapters.variants]]
key = "v1_v_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "秋天，往回走的船上。我站在船头，把这一趟从头想了一遍。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。金板上那一笔“合上”，是我亲笔写的。往后再没有哪条船在亚速尔以西看见那点光。"

[[tracks.chapters.variants]]
key = "v2_v_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "秋天，往回走的船上。我站在船头，把这一趟从头想了一遍。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。金板上那一笔“打开”，是我亲笔写的。我知道，坎佩切的码头上，已经有人在打听往西去的船。"

[[tracks.chapters.variants]]
key = "v3_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }, { kind = "flag", flag = "c13_main_ix_nikte_crossed" }]
text = "我在雾那边见过十个人，在熄了火的黑暗里说话。回来以后，我不知道该从哪一句讲起。秋天，往回走的船上。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。"

[[tracks.chapters.variants]]
key = "v4_turned"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_turned_back" }]
text = "我在海草边上掉了头。回来以后，罗经的针一直有点歪，我没让人修。秋天，往回走的船上。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。"

[[tracks.chapters.variants]]
key = "v5_absent"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_absent" }]
text = "我没赶上那片雾。从安格拉回来的商人说，那个夏天往西去的船，有的回来了，有的没有。秋天，往回走的船上。船上的老桨手问我去了哪里，我只说：“很远。”老桨手又问：“你走的时候说要去找一根柱子。找着了？”我说：“我见过一根柱子。上面的字，比兰达的书还多。”从这么远的海上回头看，岛真的很小，小得可以放进一面镜子。"

# c06 契兰的夜：老预言者的话，抄本送去哪里。
[[tracks.chapters]]
key = "c06_chilam"
title = "契兰的夜"
text = "一个没有月亮的夜里，岛上最后一位契兰派孙子来叫我。契兰是入迷后代神说话的老预言者，我小时候偷偷听过他说话。洞里的塞诺特边点着一小撮柯巴脂。老人躺在席子上，身子一动不动，嘴里的声音不像他自己。他说的话只当传闻听：湖上的人还要等很久很久，等到一百多个雨季以后，才有外人的船进得了那片湖。说完他醒过来，第一句问我：“那部书，你打算放在哪儿？”我这才发现，书里的名字到我这一代就停了。最后一折上那朵小花后面，是空的。"
when = [{ kind = "date", from = [1584, 1, 1] }]
at = "cozumel"
speaker = "captain"
mood = "mystic"
night = true
cast = ["ix_nikte"]
deadline = [1586, 12, 31]

[[tracks.chapters.choices]]
key = "lake"
text = "把抄本永远送去湖上，交给伊察人"
next = "c07_ixchel"
requires = [{ kind = "item", item = "maya_inheritance_codex", qty = 1 }]
hint = "你手里没有那部抄本，送不去湖上。"
effects = [{ kind = "item", item = "maya_inheritance_codex", qty = -1 }, { kind = "flag", flag = "c13_main_ix_nikte_codex_lake" }, { kind = "reputation", faction = "itza", value = 3 }]
reply = "我亲自划船送到南边能进林子的河口，交给一个从湖上来接的年轻人。年轻人捧着书，问我要不要留一句话写在最后一折。我说：“写上‘到了’。”"
news = "科苏梅尔的独木舟这个旱季往南走了一趟，没装货，回来的时候也没装。"

[[tracks.chapters.choices]]
key = "island"
text = "留在岛上，藏在老庙的石头底下"
next = "c07_ixchel"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_island" }]
reply = "我把书放回老庙石阶下那个空洞，压上一块刻着花的石头。契兰说：“石头比人记得久。”我说：“那就让石头记。”书放进去的时候，我听见石头底下有水在动，像是塞诺特的水。"

[[tracks.chapters.choices]]
key = "copy"
text = "用拉丁字母抄一份，原本留给湖，抄本留给岛"
next = "c07_ixchel"
check = { attr = "learning", base = 20, per = 7 }
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_copied" }, { kind = "skill", skill = "lang_yucatec", value = 20 }]
reply = "我抄了一个旱季，每一折一页，名字用加斯帕尔教的字母拼，可可园的边界照原样画。抄到最后一折，我把自己的名字拼了两遍，两种写法。原本我包好，等湖上的人来接。"

[tracks.chapters.choices.fail]
next = "c07_ixchel"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_island" }]
news = "科苏梅尔的老妇人说，今年塞诺特的水冷得早，有个女船主在洞里泡了一下午，上来时嘴唇是紫的。"

[tracks.chapters.timeout]
next = "c07_ixchel"
effects = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_island" }]
news = "科苏梅尔最后那位说预言的老人死了，岛上的人说他走以前一直在等一条船。"

[[tracks.chapters.variants]]
key = "v1_moved"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_moved" }]
text = "一个没有月亮的夜里，岛上最后一位契兰派孙子来叫我。契兰是入迷后代神说话的老预言者，我小时候偷偷听过他说话。洞里的塞诺特边点着一小撮柯巴脂。老人躺在席子上，身子一动不动，嘴里的声音不像他自己。他说的话只当传闻听：湖上的人还要等很久很久，等到一百多个雨季以后，才有外人的船进得了那片湖。说完他醒过来，第一句问我：“那部书，你打算放在哪儿？”我这才发现，书里的名字到我这一代就停了。书还在当年躲主教时挪进去的石阶空洞里，油布外面长了一层青苔。最后一折上那朵小花后面，是空的。"

[[tracks.chapters.variants]]
key = "v2_cenote"
when = [{ kind = "flag", flag = "c13_main_ix_nikte_codex_cenote" }]
text = "一个没有月亮的夜里，岛上最后一位契兰派孙子来叫我。契兰是入迷后代神说话的老预言者，我小时候偷偷听过他说话。洞里的塞诺特边点着一小撮柯巴脂。老人躺在席子上，身子一动不动，嘴里的声音不像他自己。他说的话只当传闻听：湖上的人还要等很久很久，等到一百多个雨季以后，才有外人的船进得了那片湖。说完他醒过来，第一句问我：“那部书，你打算放在哪儿？”我这才发现，书里的名字到我这一代就停了。书还封着蜡沉在塞诺特底下，我得先下水去捞。最后一折上那朵小花后面，是空的。"

