# 坎贝经纪人之子·个人小线（主线，自由船长模板 custom_cambay_broker，故事 2.0，A5 / E37 契约，C13 第九批）
# 标签：坎贝经纪人之子；家乡港 khambhat；轨道 free_cambay_broker（kind = main，auto = true，start = a00_gate），共 5 章：
#   a00 门槛见闻（1557 正月）→ a01 去蒙巴萨的珠子（限期）→ a02 丈量土地的人（限期，1574—76）→ b01 宫船的保书（限期，1576 雨季）→ c01 一张旧汇票（来信，1584—86）。
# 依据（史实）：葡萄牙通行证与第乌的盖印（a00 只写码头上的传闻）；坎贝的玛瑙与红玉髓珠经季风运往东非（a01 背景，正文只写玛瑙）；
#   莫卧儿的托达尔·马尔在古吉拉特丈量土地、清查账簿、定新税（a02，1572—73 征服之后，正文只写丈量的人）；
#   1576 年莫卧儿宫廷女眷从苏拉特坐船出发，船要葡萄牙人的通行证与担保（b01，只写担保，不写圣地与旅程本身）；古吉拉特的汇票（c01）。
# 原创：经纪行一家；卡利扬吉师傅的书信；斯瓦希里的年轻商人与他父亲的铜印；霍尔木兹的商人与汇票背面的小字；宫船的管事与港务官。
# 人物：“我”不写性别、外貌、肤色、身高；别人称“船长”“某家的孩子”。c8_cambay_broker（卡利扬吉师傅）是经纪行的老师傅，只通过信与码头上的事出场。
# 秘密：本线没有身世秘密。伏笔是父亲的汇票（c01 才出现），背面的小字说出父亲做生意的规矩；父亲的死因不写。
# 家里的话“先过秤，再说价”：全线两次（a00 码头的脚夫转述一次，c01 “我”心里一次）。
# 读的共享旗标：c12_voyage_custom_cambay_broker（a00 门槛，C12 结业设）；c13_npc_najma（b01 变体，纳吉玛 NPC 线设，只被提起，不出场）。
# 设的共享旗标：c13_free_cambay_broker（a00 的 default，模板的其他章与主干读）；c13_free_cambay_broker_credit（a01 赊账的选项，c01 变体读）。
# 等待的包：A9（门槛章可加 protagonist 条件）。与 C7、C13d 的分工：不读请托旗标，不写学院同学的重逢，不写 C7 的题目。
# HIST 占位：无（本线不挂史实结果，历史只在 a02 与 b01 的背景里透出）。
# 回忆插画清单：
#   mem-free_cambay_broker-a02“藏起来的旧账”：坎贝经纪行的后屋，一本厚厚的旧账被塞进米缸，门外有扛着竹竿的人经过。
#   mem-free_cambay_broker-c01“父亲的汇票”：经纪行的柜台上，一张发黄的汇票摊开着，背面有一行小字，旁边放着一袋算筹。
# 英文：寰宇先只做中文，本文件不配英文覆盖。

[[tracks]]
key = "free_cambay_broker"
name = "汇票走到哪里"
kind = "main"
start = "a00_gate"
auto = true
cast = ["c8_cambay_broker"]

# 门槛见闻：只有选中坎贝经纪人之子的时候，这一章才会在正月的码头上响起。
[[tracks.chapters]]
key = "a00_gate"
title = "通行证上的印"
text = "正月的坎贝，码头上都在说通行证的事。第乌新来的葡萄牙通行证官，盖一个印要多等三天，还要多交一成。商人们骂了一路，骂完还是排队交钱。经纪行的卡利扬吉师傅没骂，只抱着胳膊站在一旁，看孩子的父亲俯下身，把一袋算筹系到那孩子腰上，一边系一边念叨。一个脚夫学舌：“老经纪人说：先过秤，再说价。”码头上有人算了账，说这一个印，比棉布还贵。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "khambhat"
cast = ["c8_cambay_broker"]
mood = "tender"
news = "坎贝码头的人说，第乌的通行证官换了人，盖印要多交一成；某家的孩子偏偏这个时候带着一船棉布出海。"
when = [{ kind = "flag", flag = "c12_voyage_custom_cambay_broker" }]

[tracks.chapters.default]
next = "a01_beads"
effects = [{ kind = "flag", flag = "c13_free_cambay_broker" }]

# 去蒙巴萨的珠子：珠子必须在这一章交出，三个选项分别落在钱、信与秤上。
[[tracks.chapters]]
key = "a01_beads"
title = "去蒙巴萨的珠子"
text = "东北季风把船送到蒙巴萨，珊瑚石的城墙被太阳晒得发白。“我”把父亲托运的那箱玛瑙珠搬上岸，红的、白的、带条纹的，颗颗在箱里滚。城里的老商人出来看货，出的价压得很低，只说一句：“现钱，今天就过数。”“我”没接话，先把自己的小秤盘往箱边一放。一个年轻的斯瓦希里商人挤到前头，说珠子进了内陆，一年后就能变成金子和象牙，他眼下付不起全价。他从怀里摸出一枚铜印，压在箱盖上：“我父亲的印，替我担保。”我想：先拿钱，还是先拿信。"
at = "mombasa"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1558, 11, 1] }]
deadline = [1561, 4, 30]
objectives = [{ kind = "goods", good = "jewelry", qty = 5, at = "mombasa", text = "把坎贝的玛瑙珠运到蒙巴萨" }]

[tracks.chapters.timeout]
next = "a02_survey"
effects = [{ kind = "letter", person = "c8_cambay_broker", text = "你那箱珠子在蒙巴萨的仓里等了两个季风。买主等不起，托别的船把货运走了，价钱压得很低。下回别让货过季。我平常只说“再看看”，这一次不说了：过了季，就是不行。" }]
news = "蒙巴萨的人说，坎贝来的那箱珠子在仓里放得太久，最后托别的船运走，价钱被压得很低。"

[[tracks.chapters.choices]]
key = "ivory"
text = "卖给城里的老商人，换象牙现结"
next = "a02_survey"
effects = [{ kind = "cash", value = 4350 }]
reply = "老商人把象牙一根根摆在沙上，用手掌比长短，比“我”的秤还准。珠子过数的时候，他一颗也没数，只扫了一眼箱底，说：“这箱我要了，明天叫人来抬。”钱点到最后一枚，他把钱袋往“我”这边推了推：“下回季风进港，箱子别等到过季。”"
news = "蒙巴萨的老商人一次收走了坎贝来的整箱珠子，现钱付清，象牙当天就装上了船。"

[[tracks.chapters.choices]]
key = "credit"
text = "赊给那个年轻商人，收下他父亲的铜印"
next = "a02_survey"
effects = [{ kind = "cash", value = 2000 }, { kind = "flag", flag = "c13_free_cambay_broker_credit" }]
reply = "年轻商人把铜印包进一块蓝布，双手递过来，指头在布角上停了一下才松开。他说明年季风回来，会到码头上找“我”的船；要是找不到，就去坎贝的经纪行问。布角绣着一条小鱼，针脚歪歪扭扭。"
news = "蒙巴萨的港口上，坎贝来的珠子赊给了一个斯瓦希里的年轻商人，押的是他父亲的一枚铜印。"

[[tracks.chapters.choices]]
key = "scale"
text = "照父亲的规矩，先验对方的秤再谈价"
next = "a02_survey"
effects = [{ kind = "cash", value = 4800 }]
reply = "老商人的秤果然短了一线。他红着脸换了一杆，把桌上的珠子重新过了一遍，价钱也跟着往上抬了一截。秤盘底下那块铅，是他自己伸手摘下来的，嘴里还嘟囔：“小孩子的眼睛倒尖。”"
news = "蒙巴萨的人说，坎贝来的孩子当众验了老商人的秤，那杆秤果然短了一线。"
check = { attr = "numeracy", base = 20, per = 7 }
fail = { next = "a02_survey", effects = [{ kind = "cash", value = 4000 }], news = "蒙巴萨的市集上，坎贝来的孩子要验老商人的秤，结果自己那杆秤先差了一线，老商人笑着把差的那份算在了孩子头上。" }

# 丈量土地的人：莫卧儿的书吏来坎贝清账。这里的账要么清给人看，要么藏起来。
[[tracks.chapters]]
key = "a02_survey"
title = "丈量土地的人"
text = "莫卧儿的人打下坎贝已经两年。旧贵族有的投了降，有的逃去了别处。现在皇帝的财政官托达尔·马尔派人来丈量土地、清查账簿，要定新税。丈量的人扛着竹竿在街上走，书吏一家一家地敲门。父亲的经纪行柜台上摊着一本厚账，记着这些年替旧贵族经手的生意。书吏翻了两页，抬起头说：“账清楚的人家，税反而交得少。”他又说：“皇帝不怕你有钱，怕的是不知道你有多少钱。”我想：这本账里有几笔，不该给外人看。"
at = "khambhat"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1574, 9, 1] }]
deadline = [1576, 3, 31]

[tracks.chapters.timeout]
next = "b01_hajj"
effects = [{ kind = "letter", person = "c8_cambay_broker", text = "丈量的人走了，账也带走了。他们量地用的是竹竿，量人用的是什么，我还没看明白。你父亲这几天话少了，饭也吃得少。等你回来，先到柜台前坐下，把账摊开，慢慢说。" }]
news = "坎贝的人说，丈量的人一家家走完了，经纪行的账房却一连好几天没有点灯，街坊都在猜。"

[[tracks.chapters.choices]]
key = "help"
text = "替丈量的人把经纪行的账算清"
next = "b01_hajj"
effects = [{ kind = "reputation", faction = "mughal", value = 2 }]
reply = "书吏一笔一笔对完，每一笔都翻回原单去看，手指点着纸边，不快也不慢。对到第三本，他停下来问，这些旧账是谁在记。父亲说是自己记的，又说有几笔是老师傅记的。书吏问到第四本，父亲把算盘推过去，自己退到柜台另一头，一句话也没说。书吏在册子上写了一个“清”字，又在旁边画了一道细线，表示这一家的账可以放心。合上册子时他说：“这样的账，我一个季度也见不到一本。”那天晚上，父亲第一次请他喝了一杯，杯子是从柜台底下拿出来的。"
news = "坎贝的丈量那几天，经纪行的老账被书吏对了两天，最后清清楚楚地放回了柜台。"
check = { attr = "numeracy", base = 20, per = 7 }
fail = { next = "b01_hajj", effects = [{ kind = "reputation", faction = "mughal", value = 1 }], news = "坎贝经纪行的旧账送到丈量的人手里，有几笔对不上，书吏皱着眉头，还是收下了。" }

[[tracks.chapters.choices]]
key = "hide"
text = "把父亲那本旧账藏起来"
next = "b01_hajj"
effects = [{ kind = "memory", memory = "mem-free_cambay_broker-a02", title = "藏起来的旧账" }]
reply = "旧账被塞进米缸，压在米底下躲过了竹竿。丈量的人从门口走过，靴子声停了一下，又走了。“我”蹲在缸边，手心全是汗，米缸里一股陈米的味道，直到外头的脚步声全散了，才敢把盖子掀开一条缝。父亲后来说，账里的名字，有一半已经不在世了。第二天一早，那本账被拿出来晒在院子里的太阳底下，书页一页一页翻开，像是怕它受潮。那一天的晚饭，父亲没有动筷子，只喝了半碗汤。那晚他没有问“我”为什么藏，只把米缸的盖子又压了一块石头。"
news = "坎贝的丈量那几天，有一户经纪人家的旧账躲过了竹竿，没有交到书吏手里。"
check = { attr = "intrigue", base = 20, per = 7 }
fail = { next = "b01_hajj", effects = [{ kind = "reputation", faction = "mughal", value = -2 }], news = "坎贝的书吏在经纪行后屋的米缸里翻出一本旧账，没罚钱，只在册子上记了一笔。" }

[[tracks.chapters.choices]]
key = "gift"
text = "送书吏一份礼，请他手下留情"
next = "b01_hajj"
effects = [{ kind = "cash", value = -1000 }, { kind = "reputation", faction = "mughal", value = 1 }]
reply = "书吏收下那个布包，掂了掂，放进袖子里。那只布包里是这一季最后的现钱，父亲没有问是多少。账查得照样仔细：每一笔都要父亲自己念一遍，念错一个字就重来。查到后半夜，他的茶换了三次。临出门他说了一句：“礼我收了，账还是要照着查。”书吏走后，父亲在桌上把剩下的现钱一块块数了一遍，数完没说什么，只把灯拨亮了些。父亲送到门口，站在那里，半天没有进屋，手还扶着门框。“我”在旁边站着，没有说话，手里还捏着一根算筹，直到父亲把灯吹了。"
news = "坎贝的人说，丈量的书吏在经纪行门口收了一份礼，账查得一笔不少，人却多坐了一会儿。"
requires = [{ kind = "cash", ge = 1000 }]
hint = "现钱都押在棉布上，凑不出这笔打点。"

# 宫船的保书：苏拉特港里两条宫船要一个担保的人。这里是名字第一次值钱。
[[tracks.chapters]]
key = "b01_hajj"
title = "宫船的保书"
text = "雨季的苏拉特，港里停着两条大船，船舷刷着新漆，舱门挂着帘子。宫里的女眷要坐船去西边的圣地，船要葡萄牙人的通行证，葡萄牙人却要一个担保的人：船要是不回来，货要是有违禁，谁赔？港务官要找一个港里认得的经纪人，几个名字报上来，末一个是“我”。宫里的管事站在雨檐底下，手里压着一卷册子，看着“我”说：“船上的人是去还愿的。葡萄牙人要的是账。你替我们算一算这笔账。”“我”说：“账我先看一看，名字再说。”港务官在一旁挥手：“不做也行，总得有个名字。”我没说出口：保书一签，船要是出了事，签名的人就是我。"
at = "surat"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1576, 6, 1] }]
deadline = [1576, 10, 15]

[tracks.chapters.timeout]
next = "c01_hundi"
news = "苏拉特的人说，两条宫船雨季里照常开了，保书上签的是谁的名字，港里有好几种说法。"

[[tracks.chapters.choices]]
key = "surety"
text = "替宫船做保，在保书上签名按印"
next = "c01_hundi"
effects = [{ kind = "cash", value = -2000 }, { kind = "reputation", faction = "mughal", value = 3 }]
reply = "保书上“我”签了名，按了手印，红印子还湿着。船出港那天，宫里的管事站在码头上，隔着雨幕冲“我”行了一礼，礼行得很低，身后的侍女们都低下了头。管事只说了一句：“船上的人记得，是坎贝的名字保的船。”"
news = "苏拉特港的人说，坎贝经纪行的孩子在保书上按了手印，两条宫船的船头朝西，雨停了。"
requires = [{ kind = "cash", ge = 2000 }]
hint = "你的家底还撑不起这样一份保。"

[[tracks.chapters.choices]]
key = "cartaz"
text = "去达曼替宫船向葡萄牙人讨通行证"
next = "c01_hundi"
effects = [{ kind = "reputation", faction = "mughal", value = 2 }, { kind = "reputation", faction = "portugal", value = 1 }]
reply = "达曼的葡萄牙长官拖了一个月才盖印。盖印时他随口说起，他母亲年轻时也坐船去过一次圣地，那圣地在罗马。他把印收起来，又加了一句：“下回带你们的账本来，我看看账上有没有你说的那么清楚。”"
news = "达曼的葡萄牙长官肯替苏拉特的宫船盖印，港里的人都说，坎贝来的那个人嘴皮子厉害。"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "c01_hundi", effects = [{ kind = "reputation", faction = "mughal", value = 1 }], news = "苏拉特港的人说，葡萄牙人拖了一个月才在通行证上盖印，宫船晚开了好几天，可到底还是开了。" }

[[tracks.chapters.choices]]
key = "decline"
text = "不做这份保，让港务官另找别人"
next = "c01_hundi"
effects = []
reply = "港务官找了城里另一家的老经纪，那人收了钱，保书签得很快。港务官临走回头说了一句：“不做也行，别在港里传说我找人找得慢。”船开的那天，“我”在码头上站到船影看不见，才转身往回走。"
news = "苏拉特的码头上，宫里的两条大船找了城里另一家经纪行做保，坎贝的名字没有出现在保书上。"

[[tracks.chapters.variants]]
key = "v1_najma"
when = [{ kind = "flag", flag = "c13_npc_najma" }]
text = "雨季的苏拉特，港里停着两条大船，船舷刷着新漆，舱门挂着帘子。宫里的女眷要坐船去西边的圣地，船要葡萄牙人的通行证，葡萄牙人却要一个担保的人：船要是不回来，货要是有违禁，谁赔？港务官要找一个港里认得的经纪人，几个名字报上来，末一个是“我”。港里的人还说，领航的是个从尤尔法来的女领航，看星比看账准。宫里的管事站在雨檐底下，手里压着一卷册子，看着“我”说：“船上的人是去还愿的。葡萄牙人要的是账。你替我们算一算这笔账。”“我”说：“账我先看一看，名字再说。”港务官在一旁挥手：“不做也行，总得有个名字。”我没说出口：保书一签，船要是出了事，签名的人就是我。"

# 一张旧汇票：信追到手里，汇票背面一行小字，兑不兑由“我”说了算。
[[tracks.chapters]]
key = "c01_hundi"
title = "一张旧汇票"
text = "一封信追到“我”手里，写信的还是卡利扬吉师傅，字比平时写得慢，信纸边上沾着一点墨，像是写字的人停笔时手抖了一下。霍尔木兹的一个商人拿着一张二十多年前的汇票，来找经纪行。汇票上是父亲的笔迹，父亲的印，一笔一划都不差。父亲已经不在了。按古吉拉特的规矩，汇票走到哪里，经纪行的名字就跟到哪里，兑不兑，现在由“我”说了算。商人在柜台前坐了一下午，茶凉了两回，一句催促也没有。汇票背面另有一行小字，是父亲的笔迹：“持票人若是个老实人，照付。”我想：先过秤，再说价——可这一回，秤在父亲那边。信末另起一行：“账上没有。可印在这儿，字也在这儿。”"
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1584, 2, 1] }]
deadline = [1586, 12, 31]

[tracks.chapters.timeout]
next = "done"
news = "坎贝的老码头上，霍尔木兹来的商人等了一整季没人来兑票，把汇票折进袖子，上船走了。"

[[tracks.chapters.choices]]
key = "honor"
text = "照汇票兑付，不问来历"
next = "done"
effects = [{ kind = "cash", value = -1500 }, { kind = "reputation", faction = "gujarat", value = 2 }, { kind = "memory", memory = "mem-free_cambay_broker-c01", title = "父亲的汇票" }]
reply = "拿票的人接过钱，数也不数，只说票上的数今天总算对上了。他说这一笔是他父亲当年借给“我”父亲的，够一船人从霍尔木兹回家的路费。他把汇票递回来，说这张纸留在坎贝最合适。“我”把汇票平平地压在柜台上，底下是那袋算筹。算筹袋口的绳结，还是那年码头上系的那一个。那人走到门槛上停了一下，说这张票他父亲在霍尔木兹的时候，每年都要拿出来看一看。他没有多看票上的数，只问了一句，父亲写字的手是不是还和从前一样稳。“我”没有答。"
requires = [{ kind = "cash", ge = 1500 }]
hint = "你手头的钱兑不起这张票。"

[[tracks.chapters.choices]]
key = "check"
text = "先把父亲的旧账一本本翻出来查"
next = "done"
effects = [{ kind = "skill", skill = "double_entry", value = 20 }]
reply = "在一本旧账的夹层里，“我”找到了那一笔。记的是一句话，字很小：欠这张票上的人一个情。墨迹已经发黄，像是隔了很久才写下的。“我”把那一页抄进自己的账本，抄完又对了一遍，数是对的，只是那个情字，账上没有地方记。那一页的边角上，有人用指甲压出过一道折痕，折了又展开，展开了又折。回信里，“我”只写了一个数，没有写那个情字。那一页上的字是父亲的，墨色比票面上的略浅，像是另一年写的。“我”把那一页折回去，夹回旧账里。"
check = { attr = "numeracy", base = 20, per = 7 }
fail = { next = "done", news = "坎贝经纪行的旧账被虫蛀了一半，一笔也查不出来，只好写信去说，等人回去再兑。" }

[[tracks.chapters.choices]]
key = "wait"
text = "写信请对方再等一季"
next = "done"
effects = []
reply = "信寄出去，只写了一句：“票我记下了，请再等一季。”之后“我”每天都会去码头看一眼霍尔木兹来的船，看了几次，也就不再数了。夜里对账的时候，手里的算筹拨来拨去，拨到一半就停下，心思却只在那行小字上。那一季里，霍尔木兹的船来了又走，码头上没有人问起这张票。卡利扬吉师傅的回信又来了一封，只有一行：“票还在，印还在，你慢慢算。”那行小字“持票人若是个老实人”，“我”念了很多遍，念到后来，只剩下“老实人”三个字在心里来回转。"

[[tracks.chapters.variants]]
key = "v1_credit"
when = [{ kind = "flag", flag = "c13_free_cambay_broker_credit" }]
text = "一封信追到“我”手里，写信的还是卡利扬吉师傅。拿汇票来的，是当年在蒙巴萨赊珠子的那个斯瓦希里商人的儿子。票上是父亲的笔迹和印，父亲已经不在了。他说这张票在他父亲那里收了二十多年，他父亲临终前叫他带来坎贝，让经纪行照票兑了，两家的账就算两清。那人在柜台前站了很久，不讨债；那枚铜印他也带着，说兑了以后要换回去。他把铜印放在柜台上，印面朝下。按古吉拉特的规矩，汇票走到哪里，经纪行的名字就跟到哪里，兑不兑，现在由“我”说了算。汇票背面有一行小字：“持票人若是个老实人，照付。”信末另起一行：“账上没有这一笔。可这张票，印是真的。”"
