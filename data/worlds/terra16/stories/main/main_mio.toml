title = "中村的刺客"
text = "冬天，中村的消息顺着四万十川流到下田：御所里那位受了洗的一条殿，夜里被摸进御所的旧臣砍了，命保住了，人却起不来了。御所的侍女连夜去请大夫，大夫没请来，先请来了一个会念南蛮经的人。撑渡船的老船夫说：“砍他的是跟了他十几年的人。他倒下去的时候，手里还攥着那串念珠。”"

