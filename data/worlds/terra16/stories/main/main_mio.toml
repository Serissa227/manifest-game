# 回忆插画清单（mem-main_mio-<章>）：
#   mem-main_mio-a03 舅舅最后的信：梅雨里的堺，船板上摊着一封盖大内菱纹的信，雨点把墨洇开。
#   mem-main_mio-a08 言继的日记：堺的仓库前一排钱箱，山科言继把毛笔递给澪，日记摊在箱盖上。
#   mem-main_mio-a13 钉死的船：那智的海滩上，一条钉着木屋、四角立着小鸟居的船被拖向北风里的海。
#   mem-main_mio-a14 两座不许登的岛：平静的海上两座小岛，白幡祭船绕行，一条小早横在潮头，船板上摊着炭笔描的图。
#   mem-main_mio-b03 宗珊收着的辞世：夜里的栈桥边，黑漆文匣打开，一张发黄的假名辞世压在宗珊的字条下。
#   mem-main_mio-c04 四个少年的船：冬天长崎的码头上一排写着名字的木箱，四个少年站在黑船的跳板前回头。
#   mem-main_mio-c06 海草里的扇子：月下无风的海，浮满海草，小早船头一把打开的桧扇压在乱转的罗经旁。
#   mem-main_mio-c09 最后一面旗：能岛空荡荡的关所，门上钉着关白的告示，一捆旧过所旗堆在码头上。

