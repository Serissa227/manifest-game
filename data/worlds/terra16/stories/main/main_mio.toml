reply = "言继写下“毛利”，旁边添了一行小字：经土佐一条家。墨还没干，本愿寺的使者就探过头来看。"

[[tracks.chapters.choices]]
key = "otomo_name"
text = "记在大友名下：舅舅出了钱，就该有名字"
requires = [{ kind = "flag", flag = "c13_main_mio_otomo_door" }]
hint = "丰后没有答应出这笔钱。"
next = "a09_coronation"
effects = [{ kind = "flag", flag = "c13_main_mio_coronation_paid" }, { kind = "fame", value = 3 }, { kind = "reputation", faction = "imperial_court", value = 5 }, { kind = "reputation", faction = "otomo", value = 3 }, { kind = "memory", memory = "mem-main_mio-a08", title = "言继的日记" }]
reply = "言继照舅舅的意思，把大友写在毛利前头。本愿寺的使者脸都青了，扯着袖子讲规矩。言继头也不抬，说哪一家的钱先到堺就先写哪一家，大友的箱子比本愿寺的早到了三天。那一行墨干得慢，我在箱子边上守着，守到它不反光了才走。"

[[tracks.chapters.choices]]
