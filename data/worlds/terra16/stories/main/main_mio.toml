reply = "九鬼家的船匠一块一块验过铁板，敲一下听一下，付了钱，又请我上大船看了一眼。船舱里黑得像仓库，一排炮口朝外，炮手们坐在炮边捏饭团吃。下船的时候，能岛的人在码头上看着我，没有一个开口。"
news = "堺的人说，土佐一条家的姬君替织田家往鸟羽运了一船铁板，九鬼家的船匠请她上大船看了一眼。"

