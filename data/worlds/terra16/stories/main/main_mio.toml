# c07 那以后：膝上的扇子。无 at；基础正文 = 没赶到；变体先读 C11 的判决，再读本线 c06 的结果。
# 补章 at3 选了 leave_fan（扇子留在律法柱下）的局不走这一章：门槛要求 c13_main_mio_fan_left 为假，那一局由旁轨 main_mio_fan_left 的 f1 接手；
# 期限 1585-06-30（c08 的窗口 7-15 才开）到期静默进 c08，免得主线一直卡在这里。三个选项设 c13_main_mio_after_seen：这一章先走过了，旁轨的 f1 就不再出。
[[tracks.chapters]]
key = "c07_after"
title = "膝上的扇子"
hint = "1583年10月以后，靠港时会有人讲起亚速尔那个夏天；雾那边若还有事，先了结它。"
text = "秋天，一条从里斯本回来的葡萄牙船，进了我泊船的港口。水手们坐在船头讲亚速尔：那个夏天，西边的海上全是船，雾没有开，回来的人什么也不说。一个缺了门牙的老水手接着说：“我们船长到了海草边上就叫掉头，一句话也没多说。”有个水手在卖从里斯本带来的玻璃珠，一边数珠子一边插嘴：“雾没开？开了。只是开给谁，不开给谁。”他又说，回来的那几条船，船头都多了一样东西，各家不一样。那个夏天，我没赶上。我把扇子放在膝上，听了一下午。去没去成，扇子都还是这把。"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }, { kind = "flag", flag = "c13_main_mio_fan_left", value = false }, { kind = "location", port = true }]
deadline = [1585, 6, 30]

[tracks.chapters.timeout]
next = "c08_kanesada_dies"
effects = []

[[tracks.chapters.choices]]
key = "song"
text = "把这一趟写成一首歌，谁问都不解释"
next = "c08_kanesada_dies"
effects = [{ kind = "skill", skill = "poetry", value = 10 }, { kind = "flag", flag = "c13_main_mio_after_seen" }]
reply = "我写了一夜，揉掉的纸团堆了半舱。天亮时只留下一句：雾里的岸，跟下田的沙洲一样，看得见，靠不上。我把它抄在扇子背面，最边上那根扇骨旁边，字挤得很密，不凑到灯底下认不出来。"

[[tracks.chapters.choices]]
key = "box_fan"
text = "把扇子收进匣子，一年里不再打开"
next = "c08_kanesada_dies"
effects = [{ kind = "flag", flag = "c13_main_mio_after_seen" }]
reply = "我把扇匣放在船舱最底下，压上一块压舱石。那一年我的船走得特别稳，稳得水手们说不像我开的船。年底开匣的时候，扇子上的墨一点没褪。"

[[tracks.chapters.choices]]
key = "tell_ushio"
text = "回能岛去，讲给汐听"
next = "c08_kanesada_dies"
effects = [{ kind = "affinity", person = "ushio", value = 5 }, { kind = "flag", flag = "c13_main_mio_after_seen" }]
reply = "我从头讲到尾，汐一直在补网，手没停。讲完了，她只问了一句：“那边的潮，几时转？”我张了张嘴，答不上来。她笑了，把网扔给我一头：“答不上来，就再去一趟。”"

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "秋天，我的船回到了熟悉的海上。那边的判词说，门要合上——我听见了，回来的路上，海草在船后一层层合拢，像从来没让开过。扇骨之间多了一片薄片，看不出是什么金属，比纸还薄，敲着不响。港口里卖玻璃珠的葡萄牙水手一边数珠子一边说：“雾没开？开了。只是开给谁，不开给谁。”水手问我：“姬君这一趟去了哪里？”我说去了趟西边。去过一回，扇子还是这把，只是沉了一片。"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "秋天，我的船回到了熟悉的海上。那边的金板上刻着判词：航路要开。我坐在那场会议的末席，听了十个人的话，记住了九个半。回到平户，我头一回在酒馆里讲了一夜，老板娘添了三回酒，每回都说：“再讲一遍那块金板。”讲到卖玻璃珠的葡萄牙水手都忘了收摊。他最后说：“雾没开？开了。只是开给谁，不开给谁。”我说往后开给所有的船。讲了一夜，扇子在膝上没合过。"

[[tracks.chapters.variants]]
key = "v3_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "秋天，我的船回到了熟悉的海上。那边的火熄过一回，在黑暗里，有人把那片海判给了一方。判给了谁，我记得，不想说。回来以后我很久不开口，水手们以为我病了，舵手端着粥守在舱口：“姬君，三天没吃东西了。”港口里卖玻璃珠的葡萄牙水手拿珠子逗我：“雾没开？开了。只是开给谁，不开给谁。”我把扇子放在膝上，一个下午没打开。"

[[tracks.chapters.variants]]
key = "v4_crossed"
when = [{ kind = "flag", flag = "c13_main_mio_crossed" }]
text = "秋天，我的船回到了熟悉的海上。海草让开过一回，又在我身后合上了。我去过那边，又回来了，这件事我谁也没告诉。卖玻璃珠的葡萄牙水手说，回来的那几条船，船头都多了一样东西，各家不一样；他盯着我的船头看了半天：“雾没开？开了。只是开给谁，不开给谁。”码头上有人问我：“这一趟去了哪里，晒得这么黑？”我把扇子打开，挡住了脸。扇子挡得住脸，挡不住身上那股海草的味道。"

[[tracks.chapters.variants]]
key = "v5_turned_back"
when = [{ kind = "flag", flag = "c13_main_mio_turned_back" }]
text = "秋天，一条从里斯本回来的葡萄牙船，进了我泊船的港口。水手们坐在船头讲亚速尔：那个夏天，西边的海上全是船，雾没开，回来的人什么也不说。一个缺了门牙的老水手接着说：“我们船长到了海草边上就叫掉头，一句话也没多说。”我到过那片海草边上，又掉了头，他们讲的，我比他们知道得多一点，也少一点。卖玻璃珠的水手一边数珠子一边插嘴：“雾没开？开了。只是开给谁，不开给谁。”那以后，我常在夜里看西边的天。去没去成，扇子都还是这把。"

# c08 弟弟之死（见闻）：户岛的灯（守住幡多时改为中村）。
[[tracks.chapters]]
key = "c08_kanesada_dies"
title = "户岛的灯"
hint = "1585年7月中至年底回下田的河口，宇和海的渔船会带消息来。"
go = { port = "shimoda_tosa" }
text = "夏天，秀吉的大军渡海进了四国，长宗我部降了。同一个月，宇和海来的渔船带来消息：户岛上的兼定过世了，四十出头，岛上的渔家照南蛮的规矩给他立了一个木十字。渔夫说：“殿下走的时候手里攥着念珠，嘴里念的是土佐话。”我在下田的河口点了一盏灯，放在那道沙洲上，等潮把它带出去。补网的老婆婆在旁边看着：“涨潮放灯，它走不了的。”灯没有走，在沙洲上搁浅了，一直亮到天明。灯不肯走，像他。"
stage = "witness"
window = [[1585, 7, 15], [1585, 12, 31]]
at = "shimoda_tosa"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "sad"
news = "下田的渡口说，土佐的旧主一条兼定过世了，临终时手里攥着一串南蛮的念珠，嘴里念的是土佐话。"

[tracks.chapters.default]
next = "c09_edict"
effects = []

[[tracks.chapters.variants]]
key = "held"
when = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }]
title = "中村的灯"
text = "夏天，秀吉的大军渡海进了四国，长宗我部降了。同一个月，兼定死在中村的御所里，四十出头。御所的侍女照南蛮的规矩给他立了一个木十字，四万十川上的渡船那一天都挂了白。渡口的老船夫说：“殿下走的时候手里攥着念珠，嘴里念的是土佐话。”我在下田的河口点了一盏灯，放在那道沙洲上，等潮把它带出去。补网的老婆婆在旁边看着：“涨潮放灯，它走不了的。”灯没有走，在沙洲上搁浅了，一直亮到天明。灯不肯走，像他。"

[[tracks.chapters.variants]]
key = "refused"
when = [{ kind = "flag", flag = "c13_main_mio_watari_refused" }]
