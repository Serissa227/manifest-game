# o3 那一颗：说不说“不是狂疾”。变体读养成期砚箱留在澪手里（rw_mio_box_all）与 b03 夹进扇子（c13_main_mio_poem_in_fan）。
[[tracks.chapters]]
key = "o3_bead"
title = "那一颗"
hint = "1580年3月以后、1581年底以前，再去一趟足摺的清水。"
go = { port = "shimizu_tosa" }
text = "开春我又去了足摺。母亲咳得厉害了，夜里只能坐着睡。她拨念珠，拨到那一处空着的地方，停一停，再往下拨，这么多年还是这样。我坐在她身边，袖子里那件事压了七年：宗珊临死前托人送来的那张纸，纸上那一行“不是狂疾”。家里人说了三十年狂疾，母亲念了三十年佛，替一个乱了心、念不出声的人念。窗外，金刚福寺的钟敲了一下。"
at = "shimizu_tosa"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1580, 3, 1] }]
deadline = [1581, 12, 31]
news = "足摺的渔家说，一条家的姬君又上了崖，在庵里住了好几夜，船上的灯一夜一夜亮着。"

[tracks.chapters.timeout]
next = "o4_bell"
effects = []
news = "足摺庵里的老尼说，夫人这两年咳得厉害，常坐在檐下朝海上看，看完了接着拨念珠。"

[[tracks.chapters.choices]]
key = "tell"
text = "告诉她：那不是狂疾"
next = "o4_bell"
effects = [{ kind = "affinity", person = "mio_mother", value = 3 }, { kind = "flag", flag = "rw_mio_cape_told" }]
reply = "我说了，说得很慢，一个字一个字。母亲的手停在念珠上，没有看我。过了很久，她说：“我知道。那一夜，他是醒着的。”她说她拆下一颗念珠，塞进了他的砚池，“他一辈子在那方砚上写字，总得有一声佛号陪着他写。”她又拨起念珠来，拨到空处，这回没停：“原来你也知道了。那就不用我一个人记着了。”"

[[tracks.chapters.choices]]
key = "recite"
text = "把父亲那首辞世念给她听"
next = "o4_bell"
effects = [{ kind = "skill", skill = "poetry", value = 5 }, { kind = "flag", flag = "rw_mio_cape_recited" }]
reply = "我把父亲那首辞世念给她听，念了两遍。舵那一句，我念得最慢。母亲听完，闭着眼坐了很久：“他到最后，还在想船。”她从来不知道他写过这首歌。那一夜她没有念佛，就坐在灯底下，嘴唇一动一动，我凑近了才听出来，她在默那首歌，一遍又一遍，像在背一本账。"

[[tracks.chapters.choices]]
key = "quiet"
text = "什么也不说，替她拨完那一串"
next = "o4_bell"
effects = [{ kind = "flag", flag = "rw_mio_cape_silent" }]
reply = "我什么也没说。母亲睡着以后，我把她的念珠拿过来，从头拨，一颗一声，拨到那处空着的地方，替她念了第一百零八声，念得很轻。早上她醒了，看见念珠搁在枕边，换了个方向，看了我一眼，没问。那件事，我原样带回了船上。"

[[tracks.chapters.variants]]
