text = "夜里，一条小船从中村顺流下来，靠上下田的栈桥。船上是土居宗珊的老仆，怀里抱着一只黑漆文匣。几天前，家老宗珊劝谏殿下，被殿下当场斩了；京都本家的内基大人已经到了中村，说要替一条家做主。老仆跪在栈桥上：“家老说，这张纸给大姬君，不给殿下。殿下看了，会以为是在骂他。”匣子里是一张发黄的纸，假名写得细细的，是父亲的辞世。纸上压着宗珊的一行字：“不是狂疾。是他自己选的。”二十四年来，家里人只说父亲是犯了狂疾。我借着老仆的灯笼读那首歌，歌里说：潮要转了，舵交给还握不住它的手。那年弟弟七岁。宗珊替父亲守了这张纸二十四年，最后死在那只手底下。父亲的字跟我的一样细，原来是跟他学的。"
