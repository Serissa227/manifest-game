# s1 回岛：阿濑要回能岛把旗账上那一行写回去。在下田。变体读养成期替她写回那一行的旗。
[[tracks.chapters]]
key = "s1_return"
title = "回岛"
hint = "1570年4月以后、1571年3月底以前在下田，阿濑有话要对你说。"
go = { port = "shimoda_tosa" }
text = "春天，阿濑把网棚里的东西全搬了出来，摊在河滩上晒：旧网、梭子、一只装渔具的箱子，箱子里压着一本发黄的旗账。她五十八了，右手早就撑不动篙，补网全靠左手。“我要回能岛。”她说得跟说潮几时转一样，“村上的人来信，说番所的旗账上，下田那一行还空着。我回去，自己写上。”她把晒干的网一张张叠好，叠到最后一张停了停：“姬君的船，送我一程。”"
at = "shimoda_tosa"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "c13_main_mio_act2" }, { kind = "date", from = [1570, 4, 1] }]
deadline = [1571, 3, 31]
news = "下田河口的人说，能岛那位乳母要回岛了，网棚里的东西在河滩上晒了一整天。"

[tracks.chapters.timeout]
next = "s2_fuses"
effects = []
news = "下田河口的人说，能岛来的那位乳母搭着村上家的关船回岛了，走的时候没让人送。"

[[tracks.chapters.choices]]
key = "row"
text = "我掌舵，送她回岛"
next = "s2_fuses"
effects = [{ kind = "flag", flag = "rw_mio_oar_rowed" }]
reply = "我掌舵，阿濑坐在船头，一路没回头看下田。过宫洼濑户的时候潮正急，她伸出左手往右指了指，我照她指的扳舵，船擦着漩涡的边过去了。到了能岛，泊位上站着一排老人，阿松婆站在最前头。阿濑下船没让人扶，自己走上栈桥，走到番所门口，回头朝我挥了挥手，像是打发我回去收钱。"

[[tracks.chapters.choices]]
key = "stay"
text = "劝她留在下田"
next = "s2_fuses"
effects = [{ kind = "flag", flag = "rw_mio_oar_argued" }]
reply = "我说下田的河口离不了她。阿濑把箱子盖上：“姬君说这话，自己信不信？”我不信。河口有政所的人，有渔家，有我教出来的两个小船头。她说：“奶喂完了，血还给人家。”第二天我还是送了她，船上她一句话也没说，下船时把那只装渔具的箱子留在了我的舱里。"

[[tracks.chapters.choices]]
key = "toll"
text = "照能岛的规矩，交她一面旗的钱"
requires = [{ kind = "cash", ge = 100 }]
hint = "这串旗钱，你眼下拿不出来。"
next = "s2_fuses"
effects = [{ kind = "cash", value = -100 }, { kind = "flag", flag = "rw_mio_oar_paid" }]
reply = "我把一串钱放在她的箱子上，说这是我这条船今年过能岛的旗钱，交给她。阿濑看看钱，看看我，咧嘴笑了，缺了一颗牙：“一条家的姬君给村上的人交旗钱，头一回。”她把钱揣进怀里，“到了岛上，我替你写进账。”"

[[tracks.chapters.variants]]
key = "filled"
when = [{ kind = "flag", flag = "rw_mio_ledger_filled" }]
text = "春天，阿濑把网棚里的东西全搬了出来，摊在河滩上晒：旧网、梭子、一只装渔具的箱子，箱子里压着一本发黄的旗账，有一页折着角。她五十八了，右手早就撑不动篙，补网全靠左手。“我要回能岛。”她说得跟说潮几时转一样，“村上的人来信，说番所的旗账上，下田那一行这些年一直是姬君的字。我回去，换成我自己的。”她把晒干的网一张张叠好，叠到最后一张停了停：“姬君的船，送我一程。”"

# s2 来信：木津川口以前，阿濑在番所搓焙烙的捻子。不带地点；在 b08（1576-07）以前。
[[tracks.chapters]]
key = "s2_fuses"
title = "焙烙的捻子"
hint = "1576年5月中，能岛会捎来一封信，字是汐的。"
text = "五月，能岛捎来一封信，是汐的字，话是阿濑的。阿濑在番所里带着岛上的女人们搓焙烙的捻子，麻和硝一层层搓进去，搓松了烧得快，搓紧了点不着。“我左手搓得比她们两只手都快。”信里说，武吉大人给姬君留了第三排，“姬君排第几排，我管不着。我只要姬君记得：扔火以前，先舔一下指头，举起来试风。”信的最后，汐自己添了一行，字很小：“娘说她也要去。”"
cast = ["mio", "ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1576, 5, 15] }]

[[tracks.chapters.choices]]
key = "forbid"
text = "回信：不许她上船"
next = "s3_last_oar"
effects = [{ kind = "flag", flag = "rw_mio_oar_forbade" }]
reply = "我回信给汐，叫她看住她娘，不许上船，捻子搓完就回番所坐着。汐的回信只有一句：“我看不住。从来没看住过。”"

[[tracks.chapters.choices]]
key = "allow"
text = "回信：要去，就上我的船"
next = "s3_last_oar"
effects = [{ kind = "flag", flag = "rw_mio_oar_allowed" }]
reply = "我回信说，要去，就上我的船，坐在舱里替我数焙烙。我想着，在我船上，至少我看得见她。汐回信说，她娘听了，骂我把她当成了数钱的小丫头，骂完又说：“也行。”"

[[tracks.chapters.choices]]
key = "ushio"
text = "回信问汐：你怎么想"
next = "s3_last_oar"
effects = [{ kind = "affinity", person = "ushio", value = 2 }, { kind = "flag", flag = "rw_mio_oar_ushio" }]
reply = "我问汐怎么想。她的回信写了很久才来：“娘年轻时在船上替人挡过一钩子，那一回，她没问谁同不同意。”信尾又添一句：“我会在她旁边。”"

# s3 最后一桨：b08 焙烙火矢以后（8-16 起）去能岛。变体读 b08 的落点；跟着村上的，再看 s2 让不让她上船。
[[tracks.chapters]]
key = "s3_last_oar"
title = "最后一桨"
hint = "木津川口那一仗以后，1576年年底以前回能岛一趟。随身多带五百金币。"
go = { port = "noshima" }
text = "木津川口那一夜以后，我回到能岛。阿濑躺在番所的里屋，右半边身子裹着浸了油的布，屋里一股烧焦的头发味。阿松婆守在旁边，说那一夜河口的火烧起来，有一条小船翻了，船上的人全掉进火光底下的水里，阿濑就在那时候解了一条小早，一个人划过去——用的是左手，桨抵在胸口上，一下一下往前推。她捞上来三个，第四个拽到一半，船边的焙烙炸了。“她不许人告诉你，”阿松婆说，“她说那几个人都是交过旗钱的。”"
at = "noshima"
cast = ["mio", "ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1576, 8, 16] }]
deadline = [1576, 12, 31]
news = "能岛的人说，木津川口那一夜，番所的老阿濑一个人划小早去火里捞人，烧伤了半边身子。"

[tracks.chapters.timeout]
next = "s4_needle"
effects = []
news = "能岛的人说，老阿濑烧伤以后躺了一冬，醒着的时候总问一条家姬君的船到了没有。"

[[tracks.chapters.choices]]
key = "watch"
text = "留在岛上守着她"
next = "s4_needle"
effects = [{ kind = "flag", flag = "rw_mio_oar_stayed" }]
reply = "我在番所里屋守了九天。阿濑醒过来两回，头一回问捞上来的三个人活了几个，阿松婆说都活了。她点点头，又睡了。第二回她看见我，皱眉：“姬君的船泊了九天，旗钱谁收？”我说没人收。她说：“亏了。”然后就笑，笑得咳，咳完了说饿。"

[[tracks.chapters.choices]]
key = "medicine"
text = "连夜去堺，请最好的医家"
requires = [{ kind = "cash", ge = 500 }]
hint = "请堺的医家要一大笔钱，你眼下拿不出来。"
next = "s4_needle"
effects = [{ kind = "cash", value = -500 }, { kind = "flag", flag = "rw_mio_oar_medicine" }]
reply = "我连夜开船去堺，把城里最贵的那家医家请上了船，连同他一箱子的药。医家看完伤，摇了摇头，还是把药留下，教阿松婆怎么换。阿濑醒着，看着那箱药：“这一箱，够买三面旗。”我说旗我有的是。她把头转过去，对着墙说：“姬君的钱，从来没花在正处。”"

[[tracks.chapters.choices]]
key = "ledger"
text = "把她捞人的事记进番所的旗账"
next = "s4_needle"
effects = [{ kind = "flag", flag = "rw_mio_oar_ledger" }]
reply = "我去番所，跟执笔的老人说，把这件事记上。老人说旗账只记钱，不记事。我说那就记钱：那三个人交过的旗钱，算阿濑收的。老人想了很久，在下田那一行底下添了一笔：濑，收三人。阿濑醒来以后，我念给她听。她说：“记错了，是四个。第四个也交过。”"

[[tracks.chapters.variants]]
key = "murakami_allowed"
when = [{ kind = "flag", flag = "c13_main_mio_kizu1_murakami" }, { kind = "flag", flag = "rw_mio_oar_allowed" }]
text = "木津川口那一夜以后，我回到能岛。阿濑躺在番所的里屋，右半边身子裹着浸了油的布，屋里一股烧焦的头发味。那一夜她坐在我船舱里替我数焙烙，数到一半，人不见了。阿松婆守在旁边，说河口的火烧起来，有一条小船翻了，阿濑就在那时候解了我船尾的那条小早，一个人划过去——用的是左手，桨抵在胸口上，一下一下往前推。我照武吉说的没回头看，没看见她。她捞上来三个，第四个拽到一半，船边的焙烙炸了。“她说那几个人都是交过旗钱的。”"

[[tracks.chapters.variants]]
key = "murakami"
when = [{ kind = "flag", flag = "c13_main_mio_kizu1_murakami" }]
text = "木津川口那一夜以后，我回到能岛。阿濑躺在番所的里屋，右半边身子裹着浸了油的布，屋里一股烧焦的头发味。那一夜我的小早排在第三排，照武吉说的，焙烙扔出去没回头看。阿松婆说，就在我背后的火光里，有一条小船翻了，阿濑解了一条小早，一个人划过去——用的是左手，桨抵在胸口上，一下一下往前推。她捞上来三个，第四个拽到一半，船边的焙烙炸了。“她不许人告诉你，”阿松婆说，“她说那几个人都是交过旗钱的。”"

[[tracks.chapters.variants]]
key = "oda"
when = [{ kind = "flag", flag = "c13_main_mio_kizu1_oda" }]
text = "木津川口那一夜以后，我回到能岛。那一夜我站在堺的码头上看火，我卖给织田家的松脂烧的是谁的船，我分不清。阿濑躺在番所的里屋，右半边身子裹着浸了油的布，屋里一股烧焦的头发味。阿松婆说，那一夜有一条小船翻了，阿濑解了一条小早，一个人划过去——用的是左手，桨抵在胸口上，一下一下往前推。她捞上来三个，第四个拽到一半，船边的焙烙炸了。阿松婆看着我：“她说那几个人都是交过旗钱的。”"

# s4 领子上的针：阿濑之死（终章），汐来信。不带地点。针与 bon_1556“领子上那根旧的”相照。
[[tracks.chapters]]
key = "s4_needle"
title = "领子上的针"
hint = "1577年开春，汐还会写信来。"
text = "开春，汐的信到了，比哪一回都短：娘过了。腊月里伤口好了大半，正月里下了一场雪，她非要去泊位上看潮，回来就躺下了，再没起来。走以前，她把领子上别着的那根针取下来，叫汐收着，说是缝姬君那面过所旗用的，“旗不坏，针就不许扔”。信里夹着一张纸，是番所旗账的一页抄本，最后一行，执笔的老人替她写好了：下田·濑。"
cast = ["mio", "ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1577, 2, 1] }]

[[tracks.chapters.choices]]
key = "needle"
text = "去能岛，把那根针别在我的领子上"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_oar_needle" }]
reply = "我去了能岛。阿濑葬在岬头那块了望岩底下，坟前插着一根旧篙。汐把针交给我，针尖磨得发亮。我把它别在领子上，跟阿濑别的地方一样。那天泊位外来了一条过路的商船在门前等潮，番所里没人出去。我解了缆划过去，照阿濑教的，先看吃水，再看舱口，然后报了旗号。"

[[tracks.chapters.choices]]
key = "sew"
text = "用那根针，补一回旧旗"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_oar_sewn" }]
reply = "汐托人把针捎到了我船上。那天夜里，我把阿濑缝的那面过所旗摊在舱板上，旗边有一处磨开了线。我照她的针脚补，一针压一针，补了半宿。补好的那一截比原来的粗，一看就看得出是两个人的手。我没拆。"

[[tracks.chapters.choices]]
key = "coins"
text = "托汐在她棺里放六文钱"
requires = [{ kind = "cash", ge = 10 }]
hint = "六文钱也拿不出来了。"
next = "done"
effects = [{ kind = "cash", value = -10 }, { kind = "flag", flag = "rw_mio_oar_coins" }]
reply = "我回信给汐，叫她在棺里放六文钱，就说是我交的。过三途川也要搭渡船，渡船也要收钱，阿濑一辈子收别人的钱，这一回，该有人替她付。汐回信说，钱放了，放在她左手里，右手攥不住。"

[[tracks.chapters.variants]]
key = "filled"
when = [{ kind = "flag", flag = "rw_mio_ledger_filled" }]
text = "开春，汐的信到了，比哪一回都短：娘过了。腊月里伤口好了大半，正月里下了一场雪，她非要去泊位上看潮，回来就躺下了，再没起来。走以前，她把领子上别着的那根针取下来，叫汐收着，说是缝姬君那面过所旗用的，“旗不坏，针就不许扔”。信里夹着一张纸，是番所旗账的一页抄本，最后一行还是我当年写进去的那几个字，墨早褪了，执笔的老人在旁边又描了一遍：下田·濑。"
