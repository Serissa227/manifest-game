# b08 第一次木津川口（H46 现场，本章不读结果）。C7 禁区：不写鹰丸，窗口止于 8 月 15 日。
[[tracks.chapters]]
key = "b08_kizugawa1"
title = "焙烙火矢"
hint = "1576年7月至8月中旬在堺，大阪湾要打仗了。"
go = { port = "sakai" }
text = "盛夏，大阪湾。毛利家的运粮船要进木津川口，给织田围着的石山本愿寺送米，护航的是村上家的几百条小早；织田家的船堵在河口。堺的码头上，松脂和硫磺一天涨三回价，两边的人都在买。我的船舱里搁着一筐焙烙，陶壳里填满火药，捻子露在外头，是武吉托人送来的，还捎了一句话：“第三排给你留着。焙烙扔出去别回头看。”织田家在堺的买办也找上船来，眼睛先落在我的松脂桶上：“姬君的松脂，织田家出双倍。仗打完，钱一样是钱。”入夜涨潮了，风却是从河口往外刮的。火往前扔，风往回吹。"
stage = "involve"
window = [[1576, 7, 1], [1576, 8, 15]]
at = "sakai"
cast = ["mio"]
speaker = "captain"
mood = "tense"
night = true
news = "木津川口烧了半夜，堺的人说，火光底下总有一条土佐的小早来来回回。"

[tracks.chapters.default]
next = "b09_yao_bikuni"
effects = []
news = "堺的商人说，木津川口那一夜，松脂的价一天涨了三回，买的是织田家，卖焙烙的是能岛。"

[[tracks.chapters.choices]]
key = "join_murakami"
text = "跟村上的船进河口，排在第三排"
check = { attr = "command", base = 20, per = 7 }
next = "b09_yao_bikuni"
effects = [{ kind = "flag", flag = "c13_main_mio_kizu1_murakami" }, { kind = "reputation", faction = "murakami", value = 3 }, { kind = "reputation", faction = "oda", value = -3 }, { kind = "fame", value = 2 }]
reply = "我的小早排在第三排。焙烙一个接一个扔上织田的大船，陶壳一碎，火就顺着船板爬上帆。我照武吉说的，没回头看。火从河口烧到半夜，毛利的粮船趁着火光一条条进了石山。天亮回到堺，我才发现自己的眉毛烧掉了半边。"
news = "木津川口烧了半夜，能岛扔上织田大船的焙烙里，有一筐是土佐那条小早扔的。"
fail = { next = "b09_yao_bikuni", effects = [{ kind = "flag", flag = "c13_main_mio_kizu1_murakami" }, { kind = "reputation", faction = "oda", value = -3 }], news = "木津川口那一夜，有个焙烙被风吹回来，在一条土佐小早的船舷上炸开，烧掉了半边帆。" }

[[tracks.chapters.choices]]
key = "sell_oda"
text = "把船上的松脂卖给织田的人"
next = "b09_yao_bikuni"
effects = [{ kind = "flag", flag = "c13_main_mio_kizu1_oda" }, { kind = "cash", value = 900 }, { kind = "reputation", faction = "oda", value = 3 }, { kind = "reputation", faction = "murakami", value = -3 }]
reply = "买办当场付清，还多送了一匹堺织的缎子。那一夜我站在堺的码头上看河口的火，火光把半边天烧红了，分不清烧的是谁的船。武吉的人从我身边走过去，没打招呼。"
news = "堺的人说，木津川口那夜，土佐一条家的姬君把一船松脂卖给了织田家，自己站在码头上看火。"

[[tracks.chapters.choices]]
key = "rescue"
text = "在河口的水里捞人，哪边的都捞"
next = "b09_yao_bikuni"
effects = [{ kind = "fame", value = 2 }, { kind = "reputation", faction = "hongwanji", value = 1 }]
reply = "我在火光底下来回了七趟。船舱里躺满了湿透的人，有村上的水夫，也有织田的足轻，挤在一处咳水，谁也顾不上瞪谁。第七趟回来，一个本愿寺的小和尚蹲在船边，挨个往他们嘴里喂米汤。"

# b09 若狭小浜：八百比丘尼的洞；戴龙戒的外国人（只写戒指与问法）。
[[tracks.chapters]]
key = "b09_yao_bikuni"
title = "八百比丘尼的洞"
hint = "1576年9月以后去若狭的小浜（日本海那一侧），1577年10月底以前。"
go = { port = "obama" }
text = "秋天的若狭小浜，日本海的风已经冷了。空印寺后山有个洞，传说吃了人鱼肉、活了八百岁的比丘尼最后走进去，就再没出来，洞口种着她留下的白椿。京里来的商人顺口说，南蛮人在四条坊门盖了一座三层的寺。镇上有个外国人到处打听“不老的肉”，日本话说得磕磕绊绊，手指上一枚戒指，是一条咬住自己尾巴的龙。他拦住我：“人鱼的肉……或者血。小姐，你知道哪里有？我付金子。”守洞的老尼扫着落叶，头也不抬：“比丘尼走进去的时候说，活得太久，看着的人都走了。你还要找吗？”外国人没理她，又问我：你们的神道里，有没有一种血，喝了不会老？他戒指上的龙咬着自己的尾巴，一圈，又一圈。"
at = "obama"
cast = ["mio"]
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1576, 9, 1] }]
deadline = [1577, 10, 31]
news = "小浜来了个戴龙戒的外国人，到处打听人鱼肉，一条家的姬君跟他说了半天话。"

[tracks.chapters.timeout]
next = "b10_togashima"
effects = []
news = "小浜的人说，那个打听人鱼肉的外国人在若狭转了一年，最后坐船往北去了。"

[[tracks.chapters.choices]]
key = "misdirect"
text = "给他指一条错路：去越前的海边找人鱼"
check = { attr = "intrigue", base = 20, per = 7 }
next = "b10_togashima"
effects = [{ kind = "flag", flag = "c13_main_mio_dragon_met" }, { kind = "fame", value = 1 }]
reply = "我把越前一个渔村说得活灵活现：哪片礁石底下，哪年哪月，谁家的网拖上来过半截鱼尾。那地方根本没有人鱼，只有很肥的乌贼。外国人一个字一个字记下，当天就雇了船往北去了。"
fail = { next = "b10_togashima", effects = [{ kind = "flag", flag = "c13_main_mio_dragon_met" }], news = "小浜的人说，一条家的姬君给那个戴龙戒的外国人指了条错路，外国人听完笑了，说她的谎比他们那边的修士编得好，照样往空印寺去了。" }

[[tracks.chapters.choices]]
key = "warn_nuns"
text = "去寺里提醒老尼，把洞口的白椿看好"
next = "b10_togashima"
effects = [{ kind = "flag", flag = "c13_main_mio_dragon_met" }, { kind = "reputation", faction = "wakasa_takeda", value = 2 }]
reply = "老尼请我喝了一碗苦茶，叫寺里的人轮流守洞，夜里也点着灯。那个外国人第二天来了，在洞口站了很久，最后只摘走了一片椿叶，夹进他的小册子里。"

[[tracks.chapters.choices]]
key = "sell_tale"
text = "把比丘尼的传说讲给他听，一个故事一个价"
next = "b10_togashima"
effects = [{ kind = "flag", flag = "c13_main_mio_dragon_met" }, { kind = "cash", value = 700 }, { kind = "reputation", faction = "wakasa_takeda", value = -2 }]
reply = "他付得很爽快，每个故事都记进一本小册子，册子的封皮上也压着那条龙。我讲了七个，收了七回钱。数钱的时候心里有点硌，说不上来为什么，像鞋里进了一粒沙。"

[[tracks.chapters.variants]]
