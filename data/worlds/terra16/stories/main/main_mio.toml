hint = "王直还活着，用不着这炷香。"
next = "a11_noshima"
effects = [{ kind = "affinity", person = "yashichi", value = 3 }]
reply = "我等到退潮。把那张告示折成一只小纸船，插上一炷香，从船舷放进水里。纸船打着转往外漂，香头一明一灭，漂到港口外头那道浪线就灭了。后来弥七听说了，托人捎来一句：船主是徽州人，香要朝西插。"

[[tracks.chapters.variants]]
