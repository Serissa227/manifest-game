# 标签：C13a 主线（opus 写手）。主线；日本·土佐与京都；公家的姬君；GL/BL/BG 归 C7，本文件不写恋爱。
#       澪是土佐一条家的长女，乳母家是能岛村上，从小会卖过所旗；话快、抢话、句里带数，好胜，事后才作歌。
#       2026-11-12 C21a：第一幕 a00—a14 按 docs/COPY-STYLE.md 与 docs/world/voices/japan.md 重写（交接 docs/drafts/c21a-handoff.md）。
#       第一幕「启航」1557—1566（a00—a14）；第二幕「潮涌」1567—1577（b01—b10 + 条件旁轨 main_mio_tosa_held）；
#       第三幕「更远之处」1578—1590（c01—c10）。
#
# 依据（史实与原创的界线）：
#   史实：土佐一条家、大内义长之死、王直、府内医院、正亲町天皇即位礼、能岛村上与来岛村上、补陀落渡海、
#         忌宫与满珠干珠、伊予之败、安艺国虎、土居宗珊、兼定的出家受洗与渡川、两次木津川口、八百比丘尼传说、
#         户岛遇刺、耳川、弥助、天正遣欧使节、本能寺、特塞拉岛海战、兼定之死、海贼停止令、小田原。
#   原创：澪与她的一切选择、假旗、硫磺箱、宗珊的字条、扇骨上的歌。
#   待核（正文一律用传闻口吻，不写“待核”）：
#     土居宗珊被杀的年份（TERRA16 定 1573，史料有 1571—73 诸说）；兼定受洗与渡川的确切月份；
#     1560 年代补陀落渡海是否仍有出航；忌宫祭礼是否有海上遥拜两岛的仪式（游戏补全）；
#     阿喜多之子伊东祐胜在安土神学校的年份；广桥保子 1558 年是否仍在宫中（a07 只让她在信末添一行）。
#
