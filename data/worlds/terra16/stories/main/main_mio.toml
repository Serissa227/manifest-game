[[tracks.chapters.variants]]
key = "v4_rome"
when = [{ kind = "flag", flag = "c13_main_mio_rome_letter" }]
text = "小田原开城的消息传到平户，天下归了一家。七月里，从罗马回来的少年们捎来一句话——如今他们已经是青年了：那封没写收信人的信，交给了一个在罗马码头上画船的人。我五十岁了，坐在平户的码头上，膝上放着那把桧扇，扇骨被海风磨得发亮，扇纸补过两回。港里一个扎红白束发绳的女孩赛小船输了，不服气，跑过来盯着我的扇子：“婆婆，扇子上写的是什么？”我把扇子打开。这么多年，那首歌我在船上读过，在潮边读过，在弟弟的灯旁读过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，扇子只有这一把。"

