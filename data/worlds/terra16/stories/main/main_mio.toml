# a04 平户的王直；林晚灯在场。交汇：玩家是澪时由这里负责。
[[tracks.chapters]]
key = "a04_hirado"
title = "徽王的船"
hint = "9月底以前去平户，徽王的船还泊在松浦家的码头。"
go = { port = "hirado" }
text = "平户松浦家的码头上泊满了唐船，山坡上那座宅子挂着“徽王”的旗号。王直听说土佐来了个上过京、会挂能岛旗的姬君，叫人请我上船。上船以前，我在栈桥上跟松浦家收泊钱的人磨了一刻，三十文磨到二十二。船舷边站着提红纸灯笼的林晚灯，月港林家派来看王直风向的人，我们托她表哥的船通了两年信，今天头一回照面。栈桥上那一刻她全听见了，笑着说信里只夸过我的字。王直不问旗钱，先问别的：“朝廷一会儿叫我贼，一会儿许我做官。姑娘是公家的人——朝廷的话，几成作数？”通事弥七在我们中间传话，不往纸上落：“要紧的话别写。写了，就有人拿去对。”舱里的桌上摊着一张五岛到舟山的针路图，酒倒好了，谁也还没喝。"
at = "hirado"
cast = ["wang_zhi", "yashichi", "lin_wandeng"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1557, 3, 1] }]
deadline = [1557, 9, 30]
news = "平户山坡上那位徽王请土佐来的姬君上船喝酒，月港林家的人提着红灯笼在船舷边听。"

[tracks.chapters.timeout]
next = "a05_farewell"
effects = []
news = "平户的人说王直的船队去了五岛，土佐那条小早没赶上，山坡上的宅子只剩看门的。"

[[tracks.chapters.choices]]
key = "carry_letter"
text = "替王直起一封信稿，托胡宗宪的使者带回去"
check = { attr = "etiquette", base = 35, per = 6 }
next = "a05_farewell"
effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_letter" }, { kind = "affinity", person = "wang_zhi", value = 5 }, { kind = "reputation", faction = "wang_zhi", value = 3 }]
reply = "我照宫里奉书的格式起稿：开头三行全是客套，要的东西一条一条藏在客套底下，叫人推也推不开。王直看到一半笑了，说这字比他船上火长写的好看，叫人把火长喊来看。弥七把稿子接过去，说这一封他送到使者跟前，不经第二个人。"
fail = { next = "a05_farewell", effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_letter" }, { kind = "affinity", person = "wang_zhi", value = 2 }], news = "平户的人说，一条家的姬君替徽王起了一封信，写得太客气，弥七摇着头把要紧的几条改成了口信。" }

[[tracks.chapters.choices]]
key = "sell_flags"
text = "把能岛的旗卖给他的船队，一船一面"
next = "a05_farewell"
effects = [{ kind = "cash", value = 800 }, { kind = "reputation", faction = "murakami", value = 2 }, { kind = "reputation", faction = "wang_zhi", value = 2 }]
reply = "王直二话没说，叫火长们排着队来领旗。轮到林晚灯，也替自家的船要了一面，硬是压下半成价——我让了，就这一回。傍晚，一排唐船的桅顶都飘着能岛的旗，从山坡上看下去，整整齐齐。"
news = "平户的人说，王直的船队一船挂了一面能岛的旗，旗钱是一条家的姬君收的，一文没让。"

[[tracks.chapters.choices]]
key = "doubt"
text = "照实说：朝廷的话，三成作数"
check = { attr = "eloquence", base = 20, per = 7 }
next = "a05_farewell"
effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_doubt" }, { kind = "affinity", person = "wang_zhi", value = 6 }]
reply = "我把宫里的事讲给他听：紫宸殿漏雨，御所办一场即位礼要等大名凑钱，公卿拿着扇子去武家讨米。王直听完，把凉了的酒倒回壶里，叫弥七记下两个字：“三成。”弥七照旧没写，点了点头。"
fail = { next = "a05_farewell", effects = [{ kind = "affinity", person = "wang_zhi", value = 1 }], news = "平户山坡上的徽王听土佐来的姬君讲京里的朝廷，听完哈哈一笑，说小姑娘懂什么大明的朝廷。" }

[[tracks.chapters.variants]]
key = "sulfur"
when = [{ kind = "flag", flag = "c13_main_mio_sulfur" }]
text = "平户松浦家的码头上泊满了唐船，山坡上那座宅子挂着“徽王”的旗号。王直的火长在码头上一眼认出了我：堺那箱硫磺，就是我替人瞒下的。他没让我在栈桥上交泊钱，直接领我上了船。船舷边站着提红纸灯笼的林晚灯，月港林家派来看王直风向的人。我们托她表哥的船通了两年信，今天头一回照面。她看看那个火长，又看看我，开口问的是堺今年的纸价。王直已经先给我倒了酒，桌上摊着一张五岛到舟山的针路图。通事弥七在我们中间传话，不往纸上落：“要紧的话别写。写了，就有人拿去对。”王直不问旗钱，先问别的：“朝廷一会儿叫我贼，一会儿许我做官。姑娘是公家的人——朝廷的话，几成作数？”那个火长站在他身后，脚边就是舱口，堺那一箱压在这条船的舱底。"

# a05 王直回舟山受抚；最后一次劝或不劝。H14 前奏。
[[tracks.chapters]]
key = "a05_farewell"
title = "回舟山的船"
hint = "10月至11月底留在平户，王直的船队这时候起锚回舟山。"
go = { port = "hirado" }
text = "北风前天起来的，火长说今夜就走。平户港里王直的大船一条接一条升帆，要回舟山的岑港受抚。码头上点着火把，松浦家的人站得远远的。王直在船头看水，回头问我：“姑娘，今夜的潮几时转？你说几时，我就几时开船。”他把那张针路图卷起来，没带走，递给弥七：“回来再用。”林晚灯提着红灯笼站在栈桥尽头：“灯我替他提到港口外。再远，就是妈祖的事了。”她说完把灯笼换了只手。我那面自己写的旗卷在小早的舱里，“一条”两个字，还没给任何船挂过。码头的石阶一级一级露出水来，已经露到第三级。"
stage = "involve"
window = [[1557, 10, 1], [1557, 11, 30]]
at = "hirado"
cast = ["wang_zhi", "lin_wandeng"]
speaker = "captain"
mood = "sad"
night = true
news = "王直的大船升帆回舟山那夜，平户码头上站着一条家的姬君，还有月港林家提灯笼的人。"

[tracks.chapters.default]
next = "a06_funai"
effects = []
news = "平户的码头说，王直的船队趁着北风去了舟山，岸上提红灯笼送行的，是月港来的林家人。"

[[tracks.chapters.choices]]
key = "urge_stay"
text = "当面劝他留下：等宁波再来一封信再走"
check = { attr = "eloquence", base = 5, per = 8 }
next = "a06_funai"
effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_warned" }, { kind = "affinity", person = "wang_zhi", value = 8 }]
reply = "王直在船头站了半个时辰，叫人把帆落下一半。码头上的火把换了两回。天亮以后，他又叫人升了回去。他多等了一天，第二天夜里还是走了，走前朝我拱了拱手。"
news = "平户码头上有人看见，徽王的帆落了一半又升起来，晚走了一天。说是土佐那位姬君拦在船头劝了半夜。"
fail = { next = "a06_funai", effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_warned" }, { kind = "affinity", person = "wang_zhi", value = 3 }], news = "平户码头上有人看见，土佐的姬君拦在徽王船头劝了半夜，徽王拍拍她的肩：大明的事，得在大明了结。" }

[[tracks.chapters.choices]]
key = "give_flag"
text = "把写着“一条”的旗送给他，挂在船尾"
next = "a06_funai"
effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_flag" }, { kind = "affinity", person = "wang_zhi", value = 6 }, { kind = "reputation", faction = "wang_zhi", value = 2 }]
reply = "王直接过旗，自己爬上船尾系好，打了两个死结。他说这是他船上头一面日本公家的旗。船出港的时候，那面旗在火把底下越走越小，最后只剩一点白。"
news = "平户港里徽王的船尾多了一面写着“一条”的旗，听说是土佐那位姬君送的，她自己还没挂过。"

[[tracks.chapters.choices]]
key = "watch_tide"
text = "什么也不劝，替他的船队看一夜潮"
check = { attr = "seamanship", base = 35, per = 6 }
next = "a06_funai"
effects = [{ kind = "skill", skill = "tide_reading", value = 15 }, { kind = "affinity", person = "wang_zhi", value = 4 }]
reply = "我在码头的石阶上蹲了一夜，盯着水线一寸一寸往下退。天亮前水停了一停，我喊了一声“转了，寅时二刻”，王直的船队应声起锚。等最后一条船出了港口，我才发现腿麻得站不起来，是林晚灯把灯笼换到左手，伸右手拉了我一把。"
news = "平户港里王直的大船升帆回舟山那夜，一条家的姬君在码头上看了一夜潮，天亮前喊了一声，船队就起了锚。"
fail = { next = "a06_funai", effects = [{ kind = "affinity", person = "wang_zhi", value = 2 }], news = "平户港里徽王的船队起锚时，头一条船在港口擦了沙。替他看潮的土佐姬君算早了一刻，徽王没怪她。" }

[[tracks.chapters.variants]]
key = "doubt"
when = [{ kind = "flag", flag = "c13_main_mio_wangzhi_doubt" }]
text = "北风前天起来的，火长说今夜就走。平户港里王直的大船一条接一条升帆，要回舟山的岑港受抚。码头上点着火把，松浦家的人站得远远的。王直在船头看水，看见我，先开了口：“你说朝廷的话三成作数——我想了一个夏天，还是要去赌那三成。姑娘，今夜的潮几时转？你说几时，我就几时开船。”他把那张针路图卷起来，没带走，递给弥七：“回来再用。”我那面自己写的旗卷在小早的舱里，“一条”两个字，还没给任何船挂过。林晚灯提着红灯笼站在栈桥尽头：“灯我替他提到港口外。再远，就是妈祖的事了。”说完她把灯笼换到了左手。"

# a06 舅舅宗麟的府内；阿尔梅达的医院。
[[tracks.chapters]]
key = "a06_funai"
title = "府内的南蛮医院"
hint = "腊月到来年6月去丰后府内见舅舅。手头留五百金币以上，那边用得着。"
go = { port = "funai" }
text = "舅舅大友宗麟的府内泊着葡萄牙船，耶稣会的会院旁边新开了一座医院，门口排着长队。阿尔梅达挽着袖子给人剜疮，他原是做买卖的，把家产都捐了进来。我船上有几个水手在海上受了伤，伤口发了热。他看都不看我带来的货：“先别谈货。你的人谁在发烧？抬进来，伤口要见光。”宗麟二十七八岁，披一件南蛮斗篷，在码头上拦住我：“你船上有什么新鲜的？”货堆上摆着一挺葡萄牙火绳枪，旁边立着写价钱的木牌，他扫了一眼，说这个他有了。换药的时候，阿尔梅达随口说，长府那边也有人送伤兵来过，是大内家的，他们说丰后的船没来。我端着的碗晃了一下。舅舅在门口听见了，只说：“长府的事……丰后有丰后的难处。晴英会明白的。”他转身回了码头，叫人撬开一箱刚卸下的南蛮玻璃器，一只一只举起来对着太阳看。"
stage = "involve"
window = [[1557, 12, 1], [1558, 6, 30]]
at = "funai"
cast = ["otomo_sorin", "luis_de_almeida"]
speaker = "captain"
mood = "cheerful"
news = "府内的南蛮医院里，大友家那位土佐来的外甥女抬着自家的伤水手去排了队。"

[tracks.chapters.default]
next = "a07_court_letter"
effects = []
news = "府内的南蛮医院开了门，头一个月就收了上百个病人，连大友家的武士也去排队。"

[[tracks.chapters.choices]]
key = "donate"
text = "把受伤的水手送进医院，再捐一笔药钱"
requires = [{ kind = "cash", ge = 500 }]
hint = "你的钱袋不够付这一笔药钱。"
next = "a07_court_letter"
effects = [{ kind = "cash", value = -500 }, { kind = "reputation", faction = "otomo", value = 3 }, { kind = "reputation", faction = "jesuits", value = 3 }, { kind = "affinity", person = "luis_de_almeida", value = 5 }, { kind = "flag", flag = "c13_main_mio_funai_hospital" }]
reply = "水手们三天就退了热，头一个能下地的跑去帮着烧水。阿尔梅达找来一本旧账簿，翻到背面写下我的名字。正面记的是他从前贩过的货，一行一行都划掉了。"

[[tracks.chapters.choices]]
key = "arquebus"
text = "跟葡萄牙人买下那挺火绳枪"
requires = [{ kind = "cash", ge = 800 }]
hint = "这一挺铁炮的价，你现在付不起。"
next = "a07_court_letter"
effects = [{ kind = "cash", value = -800 }, { kind = "item", item = "matchlock", qty = 1 }, { kind = "reputation", faction = "otomo", value = 1 }]
reply = "葡萄牙水手教我装药、夹火绳，比划了半天，最后干脆捏着我的手指扣下去。第一枪把栈桥上的海鸥全惊飞了，我耳朵嗡了一下午。宗麟在楼上拍手，叫人送来一包南蛮的金平糖。"

[[tracks.chapters.choices]]
key = "ask_uncle"
text = "当面问舅舅：长府的船，为什么没有派"
check = { attr = "etiquette", base = 20, per = 7 }
next = "a07_court_letter"
effects = [{ kind = "flag", flag = "c13_main_mio_asked_sorin" }, { kind = "affinity", person = "otomo_sorin", value = 3 }, { kind = "reputation", faction = "otomo", value = -1 }]
reply = "我换上宫里的礼数跪着问，敬语一层套一层，问的还是那一句：船呢。宗麟答得很快：“那年的船，派到别处去了。”他把身上那件南蛮天鹅绒披风解下来，赏给了我船上烧得最厉害的那个水手，又问那水手是哪里人，跟葡萄牙人学没学会他们的歌。"
fail = { next = "a07_court_letter", effects = [{ kind = "flag", flag = "c13_main_mio_asked_sorin" }, { kind = "reputation", faction = "otomo", value = -3 }], news = "府内的人说，大友殿那位土佐来的外甥女当面问长府的事，问得太冲，大友殿拂袖走了，第二天还是派人送来了伤药。" }

# a07 山科言继的信（广桥保子在信末添一行）：即位礼的钱。无 at，来信。
[[tracks.chapters]]
key = "a07_court_letter"
title = "即位礼的钱"
hint = "1558年开春以后，京里的信会追到你手里。想自己垫一笔，先攒够三千金币。"
text = "一封信辗转追到我手里，信封磨得起了毛。山科言继刚从骏河的今川家讨钱回来，字写得又急又密：“紫宸殿的屋顶漏了三处，我拿盆接着。钱，钱，钱——姬君若认得哪位肯出钱的殿下，替朝廷开个口。”一封信我数下来，十一个“钱”字。新天皇践祚好几个月了，即位礼还办不起。信里顺带一句：本愿寺已经许了一大笔，去晚了，名字连末尾都排不上。信末另有一行细长的女手，墨淡，是广桥保子添的：“你那年寄来的那首歌，我还收着。”信里还夹着一张引见帖，纸角折着约见的时辰。"
cast = ["yamashina_tokitsugu", "hirohashi_yasuko"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1558, 3, 1] }]
news = "堺的人说，京里的山科大人到处写信讨钱办即位礼，连土佐一条家的姬君都收到了一封。"

[[tracks.chapters.choices]]
key = "own_purse"
text = "先拿自己攒的钱垫上一笔，让言继有个开头"
requires = [{ kind = "cash", ge = 3000 }]
hint = "你手里的钱，还垫不起这一笔。"
next = "a08_donation"
effects = [{ kind = "cash", value = -3000 }, { kind = "flag", flag = "c13_main_mio_own_purse" }, { kind = "item", item = "court_invitation", qty = 1 }]
reply = "我把钱封进一只漆箱，箱盖上写了“一条”。封箱以前我又数了一回，零头另包成一小包，搁在舱板上。那一夜我在船板上算账，算来算去，算的是那两支没买成的新橹。"

[[tracks.chapters.choices]]
key = "mori_door"
text = "走能岛的门路，替朝廷去求毛利家出钱"
next = "a08_donation"
effects = [{ kind = "flag", flag = "c13_main_mio_mori_door" }, { kind = "item", item = "court_invitation", qty = 1 }]
reply = "能岛的人替我把话递到吉田郡山，回话来得飞快：“正有此意。”我回了一封谢帖，敬语一层叠一层。替我递话的能岛人念着直咂舌，说吉田郡山那一家，那年春天还在长府围着寺门。"

[[tracks.chapters.choices]]
key = "otomo_door"
text = "去府内求舅舅：大友家也该在朝廷那里有个名字"
check = { attr = "eloquence", base = 20, per = 7 }
next = "a08_donation"
effects = [{ kind = "flag", flag = "c13_main_mio_otomo_door" }, { kind = "item", item = "court_invitation", qty = 1 }]
reply = "宗麟一口应下，只提了一个条件：名字要写在毛利前头。他说这话时笑着，眼睛却盯着我，像在等我替长府说点什么。我没说。回到船上，那张引见帖皱了一角。"
fail = { next = "a08_donation", effects = [{ kind = "item", item = "court_invitation", qty = 1 }], news = "府内的人说，土佐一条家的姬君替朝廷来讨钱，大友殿说丰后的钱要留着买南蛮的炮，她空着手走了。" }

# a08 堺的钱箱：名字写谁。
[[tracks.chapters]]
key = "a08_donation"
title = "堺的钱箱"
hint = "1560年正月底以前，把募来的钱送到堺，交给言继的人。"
go = { port = "sakai" }
