# c02 耳川以后（H51，见闻）：府内的雪夜，阿喜多的家书。
[[tracks.chapters]]
key = "c02_mimikawa"
title = "府内的雪夜"
hint = "1579年1月初至4月底去府内，妹妹阿喜多一家在那边落了脚。"
go = { port = "funai" }
text = "耳川一仗以后的府内，满城是伤兵和寡妇。另一个妹夫田北镇周死在了日向。舅舅宗麟去年夏天受了洗，如今闭门不出，门外的老兵说：“耳川的水是红的，过了三天还是红的。”妹妹阿喜多是伊东家的遗孀，伊东家垮了以后，她带着两个儿子逃到丰后，住在一间借来的屋子里；大儿子在安土的神学校读书，听说会弹南蛮的琴。下雪的晚上，阿喜多从一只旧匣子里拿出一叠土佐寄来的家书给我看。最上面一封是我自己好几年前寄的，我早忘了。她说：“姐姐，往东过了海就是土佐吧？我在这边，夜里总以为听得见四万十川。”我寄出去就忘了的信，她一封一封都收着。"
stage = "witness"
window = [[1579, 1, 5], [1579, 4, 30]]
at = "funai"
cast = ["otomo_sorin", "akita_ichijo"]
speaker = "captain"
mood = "sad"
news = "府内满城是耳川回来的伤兵与寡妇，大友家那位受了洗的老殿下，听说已经不出门了。"

[tracks.chapters.default]
next = "c03_yasuke"
effects = []

[[tracks.chapters.variants]]
key = "hospital"
when = [{ kind = "flag", flag = "c13_main_mio_funai_hospital" }]
text = "耳川一仗以后的府内，满城是伤兵和寡妇。当年我送水手去过的南蛮医院，如今躺满了耳川回来的人，门口那本旧账簿上还有我的名字。另一个妹夫田北镇周死在了日向。舅舅宗麟去年夏天受了洗，如今闭门不出，门外的老兵说：“耳川的水是红的，过了三天还是红的。”妹妹阿喜多是伊东家的遗孀，带着两个儿子逃到丰后，住在一间借来的屋子里。下雪的晚上，她从一只旧匣子里拿出一叠土佐寄来的家书给我看。最上面一封是我自己好几年前寄的，我早忘了。她说：“姐姐，往东过了海就是土佐吧？我在这边，夜里总以为听得见四万十川。”我寄出去就忘了的信，她一封一封都收着。"

# c03 弥助的信（交汇：澪↔巴拉卡，玩家是澪时由这里负责）。
[[tracks.chapters]]
key = "c03_yasuke"
title = "安土来的高个子"
hint = "1581年3月至9月在堺，从那里上京看马揃。懂葡萄牙话的话，有句话能当面问。"
go = { port = "sakai" }
text = "春天，我从堺上京。京里的人挤破了头，要看那个跟着南蛮神父来的高个子：皮肤黑得发亮，比旁人高出一个头还多，信长给他起名弥助，赏了他一把短刀和一座宅子。马揃那天，信长在马上回头看了他好几回。人散了，弥助在一棵柳树底下叫住我。他听神父说，土佐有一条家的船，往很远的地方去。他手里攥着一封信，是请神学校的修士用葡萄牙文写的，收信的人在东非的基尔瓦，一个金商的儿子，叫巴拉卡，当年把他从奴隶贩子手里救下来的人。“弥助这个名字，是主公起的。基尔瓦的那个人，叫我另一个名字。”他说话很慢，一个字放稳了才说下一个，“这封信要走很久。走一年、两年，都行。他会等。”然后他问我：你的名字是谁给的？我一向抢话最快，这一回一个字也没抢出来。澪，是水底下看不见的那道水路。父亲给的。"
at = "sakai"
cast = ["yasuke", "oda_nobunaga"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1581, 3, 1] }]
deadline = [1581, 9, 30]
news = "京里的人都去看信长那个高个子的南蛮家臣，听说他在柳树底下跟一条家的姬君说了半天话。"

[tracks.chapters.timeout]
next = "c04_embassy"
effects = []
news = "堺的人说，安土那个高个子的南蛮随从托人打听过一条家的船，没打听到。"

[[tracks.chapters.choices]]
key = "take_letter"
text = "收下信：往西去的船，我替你找"
next = "c04_embassy"
effects = [{ kind = "flag", flag = "c13_main_mio_yasuke_letter" }, { kind = "affinity", person = "yasuke", value = 8 }]
reply = "我把信用油纸包了三层，塞进扇匣里，跟扇子挨着。弥助弯下腰，从怀里摸出一只小铜铃，挂在我的船头，说他们那边的人出海以前都挂一只，保平安。铃声很细，风一吹就响，像有人在船头小声说话。"

[[tracks.chapters.choices]]
key = "ask_home"
text = "收下信，再用葡萄牙话问他：想不想回家"
requires = [{ kind = "skill", skill = "lang_portuguese", ge = 30 }]
hint = "你说不了几句葡萄牙话。"
next = "c04_embassy"
effects = [{ kind = "flag", flag = "c13_main_mio_yasuke_letter" }, { kind = "affinity", person = "yasuke", value = 12 }]
reply = "他听见葡萄牙话，眼睛亮了一下，答得很长：一条很宽的河，一个卖金沙的集市，一个在井边唱歌的女人。我只听懂了一半。说到最后，他把手按在腰间那把短刀上：“这里也是家。”信我收下了，用油纸包了三层。"

[[tracks.chapters.choices]]
key = "one_word"
text = "不收信，只跟他交换一句话"
next = "c04_embassy"
effects = [{ kind = "affinity", person = "yasuke", value = 4 }]
reply = "我蘸了点水，在船板上画给他看：两片沙洲中间，有一道深一点的水，船顺着它走才不会搁浅，那就是“澪”。他看了很久，告诉我他从前的名字，念了两遍，我跟着念，第三遍才念对。那封信，他后来托给了耶稣会的邮包。两个名字，我都记住了。"

[[tracks.chapters.variants]]
key = "v1_azuchi_murakami"
when = [{ kind = "date", from = [1581, 4, 15] }, { kind = "flag", flag = "h50_second_kizugawa_murakami_holds_sea" }]
text = "我的船进大阪湾时，九鬼的大船已经三年没进过湾口，内海还是村上的。春天，我从堺上安土。城下町的石阶上挤满了人，要看那个跟着南蛮神父来的高个子：皮肤黑得发亮，比旁人高出一个头还多，跟在信长的队伍后头走过石阶。信长给他起名弥助，赏了他一把短刀和一座宅子。人散了，弥助在一棵柳树底下叫住我。他手里攥着一封信，是请神学校的修士用葡萄牙文写的，收信的人在东非的基尔瓦，一个金商的儿子，叫巴拉卡，当年把他从奴隶贩子手里救下来的人。“弥助这个名字，是主公起的。基尔瓦的那个人，叫我另一个名字。”他说话很慢，一个字放稳了才说下一个，“这封信要走很久。走一年、两年，都行。他会等。”然后他问我：你的名字是谁给的？我一向抢话最快，这一回一个字也没抢出来。澪，是水底下看不见的那道水路。父亲给的。"

