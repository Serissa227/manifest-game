text = "渡川一仗以后，四万十川上照旧是一条家的渡船。中村御所门口重新挂起了藤纹的幔幕，殿下又住进了御所，侍女们忙着把落了灰的屏风一扇一扇擦亮。撑渡船的老船夫逢人就说：“长宗我部的人退到渡川东边去了。这条河，还是一条家的。”"
