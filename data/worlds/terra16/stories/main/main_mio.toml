# c04 天正遣欧使节（R11）：四个少年。目标 at nagasaki，绝对期限。伊东满所只写送行与托信。
[[tracks.chapters]]
key = "c04_embassy"
title = "四个少年"
hint = "1581年11月中至1582年2月19日之间到长崎，黑船在等北风。带上一千金币或一张日本沿海图更好。"
go = { port = "nagasaki" }
text = "冬天的长崎，黑船泊在湾里等北风。会院里，四个十三四岁的少年在背拉丁文，背得磕磕绊绊。正使伊东满所是伊东家的孩子，妹妹阿喜多婆家的人；本来该去的是阿喜多的儿子，他在安土读书，赶不及，才换了满所。少年们的木箱在码头上排成一排，每只上面写着名字。满所认出我扇子上的假名，说阿喜多夫人教他写信，用的就是这种字——那是我小时候教妹妹的。他仰着脸问：“夫人说，您的船去过很远的地方。罗马……比那还远吗？”范礼安在码头上分铺位，铺位不够，他看了我一眼：“船上每一个铺位，都要换一个日本回来的故事。小姐愿意出一个吗？”他的木箱比他还高。"
at = "nagasaki"
cast = ["ito_mancio", "alessandro_valignano"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1581, 11, 15] }]
objectives = [{ kind = "at", at = "nagasaki", text = "赶在黑船出发以前到长崎" }]
deadline = [1582, 2, 19]
news = "长崎的黑船等北风那几天，一条家的姬君来码头送伊东家的孩子，在一排写着名字的木箱边上站了很久。"

[tracks.chapters.timeout]
next = "c05_summons"
effects = []
news = "长崎的黑船趁着北风走了，船上有四个日本少年，说是要去罗马见教皇。"

[[tracks.chapters.choices]]
key = "berth"
text = "出钱，替少年们的通事在船上争一个铺位"
requires = [{ kind = "cash", ge = 1000 }]
hint = "这个铺位的价，你现在出不起。"
next = "c05_summons"
effects = [{ kind = "cash", value = -1000 }, { kind = "reputation", faction = "jesuits", value = 3 }, { kind = "affinity", person = "alessandro_valignano", value = 4 }, { kind = "memory", memory = "mem-main_mio-c04", title = "四个少年的船" }]
reply = "我出钱买下一个铺位，给少年们的通事。范礼安在名单末尾添了一行，字写得很小。那个通事是平户人，会写假名，也会写葡萄牙字。后来听说，一路上满所的家信，都是他替着写的。"

[[tracks.chapters.choices]]
key = "chart"
text = "送少年们一张日本沿海图，让罗马的人看看这边的海"
requires = [{ kind = "item", item = "chart_japan", qty = 1 }]
hint = "你手里没有一张能拿得出手的日本沿海图。"
next = "c05_summons"
effects = [{ kind = "item", item = "chart_japan", qty = -1 }, { kind = "affinity", person = "ito_mancio", value = 8 }, { kind = "memory", memory = "mem-main_mio-c04", title = "四个少年的船" }]
reply = "满所把图摊在木箱盖上，手指从长崎一路往东摸，摸到土佐停了一下。他把图卷好，放进自己的箱子，说要拿给教皇看，土佐在这里。范礼安在旁边看了一眼，说罗马的地图上，日本只有一片叶子那么大。满所把箱盖扣上：“那就让他们看看叶子上的路。”"

[[tracks.chapters.choices]]
key = "letter"
text = "托他们带一封信去罗马，收信人到船上再想"
next = "c05_summons"
effects = [{ kind = "flag", flag = "c13_main_mio_rome_letter" }, { kind = "affinity", person = "ito_mancio", value = 4 }, { kind = "memory", memory = "mem-main_mio-c04", title = "四个少年的船" }]
reply = "我写了一封信，封口上没写收信人，交给满所：“路上遇见值得的人，就交出去。”他捧着信想了很久，问什么样的人才算值得。我说你看见了就知道。他把信放进箱子最底下，压在拉丁文课本下面。"
news = "长崎的人说，一条家的姬君赶在黑船出发前来送伊东家的孩子，送了一封没写收信人的信。"

# c05 召请（H54 传闻、H56）：扇骨上的歌。无 at；超时设缺省立场 open，不带信物。
[[tracks.chapters]]
key = "c05_summons"
title = "扇骨上的歌"
hint = "1582年7月以后，京里那场火的消息会传到海上，船在哪儿都听得到。"
text = "京里本能寺那一夜的火，传到海上时已经是六月底了。有人说信长死在火里，有人说他从后门出去了，有人说那个高个子的家臣被明智的人抓了又放了。报信的船头直摇头：“京里的话，十句里信三句。”夜里我在船上打开那把桧扇。扇骨上是那年七夕夜里写的歌，隔着白绢写的：银河这边，银河那边。我数着星星，忽然读出了另一层意思——银河那边，不在天上，在西边的海上。平户酒馆里的南蛮领航员说过，明年夏天木星与土星在双鱼宫会合，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇子合上又打开，我发现自己已经在心里算起了船期：果阿，好望角，里斯本。歌是往天上写的，扇子一直在海上。"
cast = ["mio"]
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1582, 7, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c06_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_mio_stance_open" }]

[[tracks.chapters.choices]]
key = "open"
text = "带上扇子西去：让雾散开，海该给所有的船走"
next = "c06_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_mio_keepsake" }, { kind = "flag", flag = "c13_main_mio_stance_open" }]
reply = "我把扇子插进腰带，叫人去长崎打听往果阿的船：哪一条最早走，哪个船主肯捎一条小早。水手问我西边有什么。我说不知道，所以要去。海是走出来的，雾也一样，走的船多了，它就得让开。"

[[tracks.chapters.choices]]
key = "close"
text = "带上扇子西去：雾里有雾里的人，别去惊动"
next = "c06_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_mio_keepsake" }, { kind = "flag", flag = "c13_main_mio_stance_close" }]
reply = "我把扇子收进匣子，系了两道绳。我只去看一眼。那边要是有人住着，我就替他们把门带上，回来什么也不说。水手问要不要多带几桶淡水，我说多带，再带一包下田的盐，见了那边的人，好打个招呼。乳母从前讲过，别人家的门帘，掀开一角就够了。"

[[tracks.chapters.choices]]
key = "hand"
text = "带上扇子西去：这件事，交给守得住的人"
next = "c06_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_mio_keepsake" }, { kind = "flag", flag = "c13_main_mio_stance_hand" }]
reply = "一条家守不住土佐，能岛守不住内海，我守不住的东西，一只手数不过来。那片海总得有人守。我去看看是谁，看清了，就把扇子交给他。临走前，我把扇骨上的歌另抄了一份，压在给母亲的家书里。扇子交出去要是回不来，歌还在下田。"

[[tracks.chapters.variants]]
key = "rw_fire"
when = [{ kind = "flag", flag = "rw_mio_fire_seen" }, { kind = "flag", flag = "c13_main_mio_poem_in_fan", value = false }, { kind = "flag", flag = "c13_main_mio_fudaraku_seen", value = false }, { kind = "flag", flag = "c7_bond_reizei_yuki_promise", value = false }]
text = "京里本能寺那一夜的火，传到海上时已经是六月底了。有人说信长死在火里，有人说他从后门出去了，有人说那个高个子的家臣被明智的人抓了又放了。报信的船头直摇头：“京里的话，十句里信三句。”我想起那年上京北边那场火，雨下着，火照样烧，雨点落进去连一声响都没有。夜里我在船上打开那把桧扇。扇骨上是那年七夕夜里写的歌，隔着白绢写的：银河这边，银河那边。我数着星星，忽然读出了另一层意思——银河那边，不在天上，在西边的海上。平户酒馆里的南蛮领航员说过，明年夏天木星与土星在双鱼宫会合，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇子合上又打开，我发现自己已经在心里算起了船期：果阿，好望角，里斯本。歌是往天上写的，扇子一直在海上。"

[[tracks.chapters.variants]]
key = "a_poem_fudaraku"
when = [{ kind = "flag", flag = "c13_main_mio_poem_in_fan" }, { kind = "flag", flag = "c13_main_mio_fudaraku_seen" }]
text = "京里本能寺那一夜的火，传到海上时已经是六月底了。有人说信长死在火里，有人说他从后门出去了，有人说那个高个子的家臣被明智的人抓了又放了。报信的船头直摇头：“京里的话，十句里信三句。”夜里我在船上打开那把桧扇。扇骨上是那年七夕夜里写的歌，隔着白绢写的：银河这边，银河那边。扇骨间夹着的父亲的辞世也露了出来，父亲的歌里是舵，我的歌里是河，两首挨在一起。我数着星星，忽然读出了另一层意思——银河那边，不在天上，在西边的海上。我想起那智那条钉死的船往东南漂去的那一夜，原来那时候我就想跟着走。平户酒馆里的南蛮领航员说过，明年夏天木星与土星在双鱼宫会合，“亚速尔以西的海草会让出一条路，老领航都这么说”。扇子合上又打开，我发现自己已经在心里算起了船期：果阿，好望角，里斯本。歌是往天上写的，扇子一直在海上。"

