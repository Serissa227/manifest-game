# a11 能岛的关所：旗挂谁的印。
[[tracks.chapters]]
key = "a11_noshima"
title = "能岛的石印"
hint = "1561年3月以后去能岛的关所，武吉等你盖印；最晚1562年6月底。"
go = { port = "noshima" }
text = "能岛小得一眼望得到头，四周的潮一天掉四回头，漩涡就在城脚下打转。关所里，村上武吉头一句问的是船：“几根桅？这一趟吃水几尺？”问完才敲了敲面前那叠还没写字的旗，旗旁边是一方石刻的印。窗外，对岸来岛的船一条条往西去：门司城下，舅舅宗麟的兵围着城，来岛村上在帮毛利运兵。来岛通康靠在门边：“门司那边打得正紧。能岛还要看到几时的潮？”武吉没理他：“毛利给得多，我靠毛利近些；大友给得多，我靠大友。”他把石印推到我手边，“你娘家是一条，奶娘家是村上。你盖哪一方，这一年你卖的旗钱就照哪一方记，账房在外头等着。”印泥盒也跟着推过来了，盖子开着。"
at = "noshima"
cast = ["murakami_takeyoshi", "kurushima_michiyasu"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1561, 3, 1] }]
deadline = [1562, 6, 30]
news = "能岛的关所里，一条家的姬君跟村上武吉为一方石印争了一下午，对岸来岛的船正往门司去。"

[tracks.chapters.timeout]
next = "a12_forged_flags"
effects = []
news = "能岛的关所说，一条家的姬君这一年没来领印，她卖出去的旗，钱照旧记在能岛名下。"

[[tracks.chapters.choices]]
key = "noshima_seal"
text = "盖能岛的印：卖旗的钱，能岛拿大头"
next = "a12_forged_flags"
effects = [{ kind = "reputation", faction = "murakami", value = 3 }, { kind = "affinity", person = "murakami_takeyoshi", value = 4 }]
reply = "印按下去，我用了全身的力气。武吉叫人记账，说往后内海里见了这面旗的船，一律放行。盖完我才发现手心里全是印泥的红，在潮水里搓到第五回还透着粉。"

[[tracks.chapters.choices]]
key = "own_flag"
text = "挂一条家自己的旗：字我自己写"
next = "a12_forged_flags"
effects = [{ kind = "flag", flag = "c13_main_mio_own_flag" }, { kind = "reputation", faction = "ichijo", value = 3 }, { kind = "reputation", faction = "murakami", value = -2 }]
reply = "我借了关所的砚，在一面没写字的旗上写下“一条”两个大字，墨点溅到了袖口。武吉拿指节敲那两个字，一下一下敲到墨干了，才问我回程走哪条水道、吃水几尺。问完，他叫账房把我的小早从“熟船”那一页挪到最后。通康在门边想笑，看了他一眼，没笑出来。"

[[tracks.chapters.choices]]
key = "mediate"
text = "替能岛与来岛说和：这一仗，内海不替谁卖命"
check = { attr = "eloquence", base = 5, per = 8 }
next = "a12_forged_flags"
effects = [{ kind = "reputation", faction = "murakami", value = 2 }, { kind = "reputation", faction = "kurushima_murakami", value = 2 }, { kind = "affinity", person = "murakami_takeyoshi", value = 6 }]
reply = "宫里调停公卿争席位的那一套，我全搬了出来：谁先坐、谁的扇子先打开，一样一样跟两个老海贼掰扯。讲到最后，通康也笑了，说宫里那一套他一半没听懂，酒倒是听懂了，抢着先举了杯。武吉往我杯里倒酒，倒得满出了杯沿。"
fail = { next = "a12_forged_flags", effects = [{ kind = "reputation", faction = "kurushima_murakami", value = -2 }], news = "能岛关所里，一条家的姬君想替能岛和来岛说和，来岛通康冷冷回了一句：公家的姬君，管好自己家的事。" }

[[tracks.chapters.variants]]
key = "ushio_friend"
when = [{ kind = "flag", flag = "c7_bond_ushio_landing_friend" }]
text = "能岛小得一眼望得到头，四周的潮一天掉四回头，漩涡就在城脚下打转。关所下面泊着汐的关船，我进门前，正听见她在船头跟武吉的船头吵潮：“你说申时转，那是大潮的日子。今天小潮，晚半个时辰，你看那根桩子，水才到第二道绳。”她吵赢了，跟着我进了关所，站在我身后，一路没再开口。村上武吉头一句问的是船：“几根桅？这一趟吃水几尺？”问完才敲了敲面前那叠还没写字的旗，旗旁边是一方石刻的印。窗外，对岸来岛的船一条条往西去：门司城下，舅舅宗麟的兵围着城，来岛村上在帮毛利运兵。来岛通康靠在门边，问能岛还要看到几时的潮。武吉没理他：“毛利给得多，我靠毛利近些；大友给得多，我靠大友。”他把石印推到我手边。我伸手去够印泥盒的时候，汐在背后扯了扯我的袖子，下巴朝窗外她那条关船抬了一下，又摇了摇头。武吉的账房已经在门外研好了墨。"

[[tracks.chapters.variants]]
key = "ushio_love"
when = [{ kind = "flag", flag = "c7_bond_ushio_landing_love" }]
text = "能岛小得一眼望得到头，四周的潮一天掉四回头，漩涡就在城脚下打转。关所下面泊着汐的关船，缆绳打的还是阿濑教我们的那种结。汐跟我进了关所，站在门边，离来岛通康两步远。村上武吉头一句问的是船：“几根桅？这一趟吃水几尺？”问完才敲了敲面前那叠还没写字的旗，旗旁边是一方石刻的印。窗外，对岸来岛的船一条条往西去：门司城下，舅舅宗麟的兵围着城，来岛村上在帮毛利运兵。通康笑：“门司那边打得正紧。能岛还要看到几时的潮？”武吉没理他：“毛利给得多，我靠毛利近些；大友给得多，我靠大友。”汐手里捏着一截缆头，打了个死结，眼睛还看着缆头，跟我说她那条船的泊钱是她自己交给能岛的，印的事别算上它。武吉这才把石印推到我手边。"

# a12 假旗：打赢一仗，逮住卖假旗的船。无 at，相对期限。
[[tracks.chapters]]
key = "a12_forged_flags"
title = "假旗"
hint = "一百二十天内在海上打赢一仗，咬住卖假旗的船。撞上海盗，别急着躲。"
text = "伊予滩上有人卖假过所旗：商船花钱买了旗，过了海峡，又被卖旗的人自己劫了。我追了半个多月，在海上把那条船咬住。舱里一箱叠得整整齐齐的假旗，一方木头刻的印。木头刻的印边该是毛的，这一方却刻得比石头的真印细。武吉早传过话，人和印一起押回能岛。船主是个被能岛关所赶出去的老账房，跪在甲板上：“真的那方，也是我刻的。石头是大三岛的青石，刀是我自己磨的，刀口往左偏……您拿去对着灯看，两方印‘岛’字收尾那一笔，都缺一个口子。”他两只手摊在膝上，指甲缝里的印泥洗不掉。"
cast = ["murakami_takeyoshi"]
speaker = "captain"
mood = "tense"
objectives = [{ kind = "battle", wins = 1, text = "在海上打赢一仗，逮住卖假旗的船" }]
deadline_days = 120
news = "伊予滩上专卖假过所旗的那条船被一条家的小早逮住了，舱里一箱假旗，还有一方木头刻的印。"

