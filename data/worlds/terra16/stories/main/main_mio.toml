# ───────────── 第一幕「启航」1557—1566 ─────────────

# a00 门槛见闻：只有选了澪的家庭才会在这里开轨道。
[[tracks.chapters]]
key = "a00_gate"
title = "一条家的小早"
hint = "正月初在下田听听河口的人怎么传；初七以后，栈桥上会有人来找你。"
go = { port = "shimoda_tosa" }
text = "下田河口，四万十川的水跟海潮在沙洲前撞出一道白线，渔家门口的松枝还没撤。补网的女人们说，御所那位上过京的姬君，开春不等风稳就要自己掌舵出河口。撑渡船的老船夫把篙往沙里一插：“她七八岁蹲在能岛滩上数帆别钱，收钱的还没数完，她先报出了数。”渡口边泊着一条小早，桅上系着一根红白两色的绳子，是缝过所旗剩下的边角。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "shimoda_tosa"
cast = ["mio"]
mood = "cheerful"
news = "下田河口的人说，一条家那位上过京的姬君正月里就要驾小早出海，桅上系着一根红白的绳子。"
when = [{ kind = "flag", flag = "c12_voyage_mio" }]

[tracks.chapters.default]
next = "a01_sakai_ship"
effects = [{ kind = "flag", flag = "c13_main_mio" }]

# a01 第一单生意：堺的船主要人护送绕足摺岬，又舍不得先付旗钱。“旗钱，先付”有分量的第二次（养成期听见是第一次），澪自己说。
[[tracks.chapters]]
key = "a01_sakai_ship"
title = "堺船的旗钱"
hint = "1月7日以后到下田的栈桥，见那位堺来的船主；他最多等到4月15日。"
go = { port = "shimoda_tosa" }
text = "下田的栈桥上北风还硬。一条堺来的大商船吃水很深，舱里压着土佐的杉木和纸，等南风一起就绕足摺岬回去。船主是会合众底下的小商人，袖口磨得发亮。他要人护送过岬：黑潮在那里把船往礁上推，宿毛湾外还有零星的海贼。他看看我的小早，又看看我：“这么小的船，浪大一点就看不见了。旗钱嘛……到了堺，一文不——”“旗钱，先付。”我从袖子里抖开那面过所旗，是乳母阿濑从娘家带来的，“过岬一程，进堺一程，两程一起付。熟客我们抹个零头，您这是头一回，零头也要。”船主身后的老舵手一直蹲在缆桩上剔牙，这会儿凑过来，手指顺着旗边摸了一遍：“这针脚……阿濑家的？那年我在来岛的水道口领旗，也是这样锁的边。”船主回头瞪他，他又蹲回去剔牙了。"
at = "shimoda_tosa"
cast = ["mio"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1557, 1, 7] }]
deadline = [1557, 4, 15]
news = "下田的栈桥上，一条家的姬君跟堺来的船主为旗钱磨了半天嘴，老舵手认出了她那面旗的针脚。"

[tracks.chapters.timeout]
next = "a03_uncle"
effects = []
news = "下田栈桥上那条堺来的商船等不及，到宿毛另雇了别家的旗绕岬，船主临走还嫌土佐的姬君架子大。"

[[tracks.chapters.choices]]
key = "his_price"
text = "照他的价接下，先把船护到堺再说"
next = "a02_ashizuri"
effects = [{ kind = "cash", value = 300 }]
reply = "船主笑得合不拢嘴，当场数了一半，剩下的写在一张欠条上，按了个油乎乎的手印。老舵手在一旁摇头：“姬君心软。往后在内海，要吃亏的。”"

[[tracks.chapters.choices]]
key = "flag_first"
text = "按能岛的规矩：旗钱先付，不付不开船"
check = { attr = "eloquence", base = 20, per = 7 }
next = "a02_ashizuri"
effects = [{ kind = "cash", value = 600 }, { kind = "reputation", faction = "murakami", value = 2 }]
reply = "船主磨了半个时辰，从堺的米价讲到他家老母的病，最后还是把旗钱倒进我手心。他还在一枚一枚地数，我已经报了数：“差七文。”他把两只袖子翻过来才凑齐。老舵手接过旗爬上桅杆，替我挂到了最顶上。"
fail = { next = "a02_ashizuri", effects = [{ kind = "cash", value = 300 }], news = "下田栈桥上的人说，堺来的船主只肯先付一半旗钱，一条家的姬君咬着牙认了，在船舷上用炭记下这一笔。" }

[[tracks.chapters.choices]]
key = "go_alone"
text = "不接这一单，自己驾小早先去堺看行情"
next = "a03_uncle"
effects = []
reply = "我解了缆就走。船主在栈桥上喊我回来，喊声被北风吹散了一半。出河口时我回头看了一眼那条大船，杉木压得它吃水快到第三道漆线。"

# a02 绕足摺岬，到堺交船；一箱钉得死紧的硫磺。
[[tracks.chapters]]
key = "a02_ashizuri"
title = "足摺的黑潮"
hint = "护着商船绕过足摺岬，5月底以前把它送进堺。"
go = { port = "sakai" }
text = "绕足摺岬那一夜，黑潮往东北推，商船被推得直往臼碆的礁上去。我那几个桨手换了四回班，舵柄上缠的麻绳磨起了毛，金刚福寺的钟从崖顶一声一声传下来。船主说，寺里的僧人管那片海叫“补陀落东门”。我的小早在前头打灯，硬是把大船从礁线外拖了过去。到了堺，会合众的仓库沿海排开，查货的伙计拿着账一船一船对。卸到最后，有一只箱子钉得死紧，比别的沉一倍。船主压低声音：“这箱子，你没看见。到了平户，自有人认得它，是徽王要的硫磺。”伙计已经走过来了，拿指节敲了敲箱盖，问账上写的是纸和木头，这一箱怎么敲着发闷。他手里那本账，已经翻到了土佐这一船。"
at = "sakai"
cast = ["mio"]
speaker = "captain"
mood = "tense"
objectives = [{ kind = "at", at = "sakai", text = "把商船平安送到堺" }]
deadline = [1557, 5, 31]
news = "堺的码头说，土佐来的一条小早在足摺岬下把一条大商船从礁线外拖了出来，金刚福寺的钟敲了一夜。"

[tracks.chapters.timeout]
next = "a03_uncle"
effects = []
news = "堺的会合众说，土佐那条小早没把商船送到，船主在纪伊另雇了旗，进港时还在骂。"

[[tracks.chapters.choices]]
key = "honest"
text = "连船带货交给会合众，一箱也不瞒"
next = "a03_uncle"
effects = [{ kind = "fame", value = 2 }, { kind = "reputation", faction = "sakai", value = 2 }]
reply = "伙计撬开箱盖，黄澄澄的一箱硫磺，呛得他直咳。船主被罚了一笔，看我的眼神像要把我推下海。会合众的账房倒记住了这条小船，在往来的簿子上添了一行，“一条”两个字写得端端正正。"

[[tracks.chapters.choices]]
key = "sell_flags"
text = "趁在堺，把带来的几面能岛旗卖给要进内海的船"
next = "a03_uncle"
effects = [{ kind = "cash", value = 400 }, { kind = "reputation", faction = "murakami", value = 1 }]
reply = "等着进濑户内海的船挤了半个码头。我一面一面卖，最后一面卖给一个满口博多腔的人，他想赊账，我没让。钱分成两份，一份用纸包好，纸上写“能岛”。那只发闷的箱子怎么过的关，我没回头去看。"

[[tracks.chapters.choices]]
key = "hide_crate"
text = "替船主把那箱硫磺瞒过去，换他一个人情"
check = { attr = "intrigue", base = 20, per = 7 }
next = "a03_uncle"
effects = [{ kind = "cash", value = 500 }, { kind = "flag", flag = "c13_main_mio_sulfur" }]
reply = "我叫水手把箱子跟一捆杉木绑在一处，又请伙计先去看隔壁那船的纸。他回来敲了两下木头，听着一样闷，就走了。船主多塞了一份钱给我，凑在耳边说：“到了平户，提我的名字。”"
fail = { next = "a03_uncle", effects = [{ kind = "cash", value = 200 }, { kind = "reputation", faction = "sakai", value = -2 }], news = "堺的码头上，查货的伙计还是撬开了土佐那条船上的一箱硫磺。船主挨了罚，一条家的姬君也被会合众记了一笔。" }

# a03 舅舅大内义长的信，人死了才到。H06 余波，不经玩家。
[[tracks.chapters]]
key = "a03_uncle"
title = "长府来的信"
hint = "6月到8月中旬留在堺，博多来的船会捎来长府的消息。"
go = { port = "sakai" }
text = "博多来的船进了堺，带来长府的消息，还带来一封信。信是舅舅大内义长几个月前写给我的，人已经不在了，信才到。封口压着大内家的菱纹印，舱顶漏了一夜梅雨，墨洇了一角。信不长，开头说长府今年的梅子酸，腌了也酸；中间一行：“听说你会挂能岛的旗。若海上还有一条路能到丰后，替我留着。”末了问土佐的鲣鱼几月最肥。博多的船头蹲在船板上拧袖子：“长福寺的和尚说，大内殿走的时候很安静。毛利家的人连寺门都没进。丰后的船，我们在海上一条也没碰见。”我掐着指头算：他落笔那天，我还在京里给弟弟磨墨。"
stage = "witness"
window = [[1557, 6, 1], [1557, 8, 15]]
at = "sakai"
cast = ["mio"]
speaker = "captain"
mood = "sad"
news = "堺的码头上都在说，长府的大内殿在寺里自尽了，大内家就这么没了，毛利家的旗插到了山口。"

[tracks.chapters.default]
