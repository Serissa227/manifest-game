# p1 来信：受洗那天的水。不带地点（守住幡多与否都讲得通）。变体读养成期“人死了去哪儿”的回答，三者互斥。
[[tracks.chapters]]
key = "p1_water"
title = "水是凉的"
hint = "1575年11月中以后，兼定会写信来，收信不挑港口。"
text = "渡川以后的头一封信，是兼定寄来的，用的是假名，字一个个立得很正，只有“姊上”两个字还往右倒。他不提渡川，也不提中村，从受洗那天写起：神父把水从他头上浇下来，水顺着青皮往下流，流进领子里。“凉。我从小摔了不疼，折了手不疼，那天水一浇，我觉得凉。姊上，我原来是会觉得的。”信的后半，他说住处附近有些渔家的孩子，想学写字，问我能不能捎一刀纸去。"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "c13_main_mio_act2" }, { kind = "date", from = [1575, 11, 15] }]

[[tracks.chapters.choices]]
key = "paper"
text = "捎一刀杉原纸去"
requires = [{ kind = "cash", ge = 100 }]
hint = "这一刀纸和墨，眼下的钱买不起。"
next = "p2_confession"
effects = [{ kind = "cash", value = -100 }, { kind = "affinity", person = "ichijo_kanesada", value = 4 }, { kind = "flag", flag = "rw_mio_paulo_paper" }]
reply = "我在堺买了一刀杉原纸，又添了一包墨、十支笔，托顺路的鲣船捎去。回信里他说，纸分给了七个孩子，一人一叠，教他们写自己的名字。有个孩子把“鱼”字写成了一条真的鱼，他没改，还夸了。“姊上从前也夸过我画的鱼。”我不记得夸过。"

[[tracks.chapters.choices]]
key = "scold"
text = "回信骂他：渡川才过，就去念南蛮的经"
next = "p2_confession"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = -2 }, { kind = "flag", flag = "rw_mio_paulo_scolded" }]
reply = "我写得很冲：渡川死了那么多人，你去念南蛮的经，念给谁听。信寄出去就后悔了。他的回信很平静：“念给死了的人听，也念给姊上听。”他说他每天替渡川两岸死的人各念一遍，一条家的、长宗我部的，名字记不全，就念“那边的人”。"

[[tracks.chapters.choices]]
key = "ask"
text = "回信问他：除了凉，还觉得别的吗"
next = "p2_confession"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 3 }, { kind = "flag", flag = "rw_mio_paulo_asked" }]
reply = "我问他，除了凉，还觉得别的没有。他隔了很久才回信，信里列了一张单子，像小时候列行装：怕。疼。饿。想母上。想弥平次。最后一行：“想宗珊。”这个名字他写得很重，墨洇了一大块。"

[[tracks.chapters.variants]]
key = "ans_west"
when = [{ kind = "flag", flag = "rw_mio_kane_ans_west" }]
text = "渡川以后的头一封信，是兼定寄来的，用的是假名，字一个个立得很正，只有“姊上”两个字还往右倒。他从受洗那天写起：神父把水从他头上浇下来，水顺着青皮往下流，流进领子里。“凉。我从小摔了不疼，那天水一浇，我觉得凉。”又写：“那年姊上说，人死了往西去，念过佛的才收。神父说，不念的也收，只要信。我想了很久，选了不用念的那个。”信的后半，他说住处附近有些渔家的孩子想学写字，问我能不能捎一刀纸去。"

[[tracks.chapters.variants]]
key = "ans_sea"
when = [{ kind = "flag", flag = "rw_mio_kane_ans_sea" }]
text = "渡川以后的头一封信，是兼定寄来的，用的是假名，字一个个立得很正，只有“姊上”两个字还往右倒。他从受洗那天写起：神父把水从他头上浇下来，水顺着青皮往下流，流进领子里。“凉。我从小摔了不疼，那天水一浇，我觉得凉。”又写：“那年姊上说，人死了往海那边去，船到不了。神父说有一条路，不用船。我上了那条路。”信的后半，他说住处附近有些渔家的孩子想学写字，问我能不能捎一刀纸去。"

[[tracks.chapters.variants]]
key = "ans_none"
when = [{ kind = "flag", flag = "rw_mio_kane_ans_none" }]
text = "渡川以后的头一封信，是兼定寄来的，用的是假名，字一个个立得很正，只有“姊上”两个字还往右倒。他从受洗那天写起：神父把水从他头上浇下来，水顺着青皮往下流，流进领子里。“凉。我从小摔了不疼，那天水一浇，我觉得凉。”又写：“那年我问人死了去哪儿，姊上说不知道。神父知道，他跟我说了，我信了。姊上，你别笑。”信的后半，他说住处附近有些渔家的孩子想学写字，问我能不能捎一刀纸去。"

# p2 告解：鹿与宗珊。在下田接到口信（at 下田），正文里澪开船过去。变体读养成期春日野那头鹿（三者互斥）。
[[tracks.chapters]]
key = "p2_confession"
title = "告解"
hint = "1577年3月至10月在下田，兼定那边会派船来请你过去。"
go = { port = "shimoda_tosa" }
text = "开春，一条小船靠上下田的栈桥，船头说一条殿请姬君去一趟：“殿下说有话要当面讲，信里讲不清。”我去了。他住的地方有一间小庙，改成了南蛮的样子，门楣上钉着一个木十字，屋里原先的佛龛还在，佛像搬走了，龛里空着。兼定跪在十字底下，等我坐定了，才转过身来：“我在神父面前告解过了。”头一件说的是鹿，春日野的那头小鹿。“神父不知道鹿是什么。我讲了一个晚上，他懂了。”第二件是宗珊。说到这个名字，他把两只手平放在膝上，手背上的青筋一根根鼓着。"
at = "shimoda_tosa"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1577, 3, 1] }]
deadline = [1577, 10, 31]
news = "下田的人说，户岛来了条小船接一条家的姬君，说那位受了洗的殿下有话要当面讲。"

[tracks.chapters.timeout]
next = "p3_blade"
effects = []
news = "下田的渡口说，那条来接姬君的小船等了些日子，空着回去了。"

[[tracks.chapters.choices]]
key = "owe"
text = "问他：神父说认了就算了？"
next = "p3_blade"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 2 }, { kind = "flag", flag = "rw_mio_paulo_owe" }]
reply = "我问他，神父说认了就算了吗。兼定摇头：“神父说，主赦了，人那边还欠着。”他说宗珊有个老仆，还活着，在中村的渡口一带讨饭，他托人找过，找不着。我知道是谁：那年夜里抱着黑漆文匣跪在我栈桥上的那个老人。“姊上的船走得远，替我留意。找着了，我给他磕头。”"

[[tracks.chapters.choices]]
key = "shrine"
text = "什么也不说，帮他把空佛龛抬出去"
next = "p3_blade"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 3 }, { kind = "flag", flag = "rw_mio_paulo_shrine" }]
reply = "我没接他的话，起身去搬那个空佛龛。龛是樟木的，沉，我一个人搬不动，兼定过来抬另一头。我们把它抬到屋外，放在檐下，他又回去拿了一块布，把龛上的灰擦干净。“佛像送回寺里了，”他说，“这个龛，母上用得着。”"

[[tracks.chapters.choices]]
key = "scold"
text = "骂他：鹿是鹿，宗珊是人"
next = "p3_blade"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = -1 }, { kind = "flag", flag = "rw_mio_paulo_rebuked" }]
reply = "我说鹿是鹿，宗珊是人，你把两件放在一起讲，宗珊在地下也不答应。兼定听完，没争：“是。神父也这么说。鹿那一件，我那时候不懂；宗珊那一件，我懂。懂了还做，罪更重。”说完他低下头，像小时候临坏了一页帖，等着我叫他重来。"

[[tracks.chapters.variants]]
key = "confess"
when = [{ kind = "flag", flag = "rw_mio_deer_confess" }]
text = "开春，一条小船靠上下田的栈桥，船头说一条殿请姬君去一趟：“殿下说有话要当面讲，信里讲不清。”我去了。他住的地方有一间小庙，改成了南蛮的样子，门楣上钉着一个木十字，屋里原先的佛龛还在，龛里空着。兼定跪在十字底下，等我坐定了才转过身：“我在神父面前告解过了。”头一件说的是春日野的那头小鹿。“那年姊上按着我的头叫我认，我认了，心里什么也没有。这回认，心里有了。”第二件是宗珊。说到这个名字，他把两只手平放在膝上，手背上的青筋一根根鼓着。"

[[tracks.chapters.variants]]
key = "hid"
when = [{ kind = "flag", flag = "rw_mio_deer_hid" }]
text = "开春，一条小船靠上下田的栈桥，船头说一条殿请姬君去一趟：“殿下说有话要当面讲，信里讲不清。”我去了。他住的地方有一间小庙，改成了南蛮的样子，门楣上钉着一个木十字，屋里原先的佛龛还在，龛里空着。兼定跪在十字底下，等我坐定了才转过身：“我在神父面前告解过了。”头一件说的是春日野的那头小鹿。“那年姊上和弥平次把它拖进林子里盖上了。我站在旁边看，那是我欠的头一笔。”第二件是宗珊。说到这个名字，他把两只手平放在膝上，手背上的青筋一根根鼓着。"

[[tracks.chapters.variants]]
key = "buried"
when = [{ kind = "flag", flag = "rw_mio_deer_buried" }]
text = "开春，一条小船靠上下田的栈桥，船头说一条殿请姬君去一趟：“殿下说有话要当面讲，信里讲不清。”我去了。他住的地方有一间小庙，改成了南蛮的样子，门楣上钉着一个木十字，屋里原先的佛龛还在，龛里空着。兼定跪在十字底下，等我坐定了才转过身：“我在神父面前告解过了。”头一件说的是春日野的那头小鹿。“那年姊上叫我合掌，我合了，问鹿还疼不疼。神父说，疼的是我，那时候我不知道。”第二件是宗珊。说到这个名字，他把两只手平放在膝上，手背上的青筋一根根鼓着。"

# p3 来信：遇刺以后，他不许人去捉砍他的人。不带地点。变体 held 读 HIST（刺客摸进的是中村御所，见 b10）。
[[tracks.chapters]]
key = "p3_blade"
title = "砍他的人"
hint = "1578年开春，户岛会有信来。钱袋里多留三百金币，回信时也许用得上。"
text = "开春，户岛那边来了信，不是兼定写的，是庙里那个会念南蛮经的人代笔，字写得笨，意思倒清楚：殿下的刀口合上了，左手抬不起来，腿也不大听使唤，每天让人扶着坐到门口晒太阳。砍他的那个旧臣没跑远，躲在对岸的山里，渔家的后生们要去捉，殿下不许。“殿下说，那人跟了他十几年，砍他那一刀，是替宗珊大人砍的。”信的最后一行是兼定自己添的，字歪得厉害，像是拿不惯笔的那只手写的：“姊上别来报仇。”"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1578, 3, 1] }]

[[tracks.chapters.choices]]
key = "hunt"
text = "还是托人去山里找那个人"
requires = [{ kind = "cash", ge = 300 }]
hint = "许出去的赏钱，你眼下拿不出来。"
next = "p4_visitor"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "rw_mio_paulo_hunted" }]
reply = "我没听他的。我托中村的旧识，许了赏钱，叫人去山里找。找了一个月，找着了，人已经死了，吊在一棵栗树上，脚底下放着他的刀，刀鞘上缠着一条家的旧藤纹。来报信的人问我，这赏钱还给不给。我给了。这件事，我没告诉兼定。"

[[tracks.chapters.choices]]
key = "obey"
text = "照他说的，不去"
next = "p4_visitor"
effects = [{ kind = "flag", flag = "rw_mio_paulo_obeyed" }]
reply = "我把那封信叠好收起来，没派人去山里。夜里在船上睡不着，起来看潮，潮照常涨，照常退。我想起他小时候折了手腕不哭，接完骨还要去爬树。这一回，他不许人去捉砍他的人。"

[[tracks.chapters.choices]]
key = "doctor"
text = "写信请府内的南蛮医院派人去"
requires = [{ kind = "cash", ge = 300 }]
hint = "请人去一趟的钱，你眼下拿不出来。"
next = "p4_visitor"
effects = [{ kind = "cash", value = -300 }, { kind = "affinity", person = "ichijo_kanesada", value = 3 }, { kind = "flag", flag = "rw_mio_paulo_doctor" }]
reply = "我写信去府内的南蛮医院，求他们派一个懂刀伤的人去，钱我出。医院回信说，会派一个日本的修士，跟送米的船一起走。三个月以后兼定来信，说修士到了，替他换了药，还教岛上的人拿滚水洗伤口。“姊上又替我付了钱。”信尾画了一条小船，船尾写着“澪”。"

[[tracks.chapters.variants]]
key = "held"
when = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }]
text = "开春，中村那边来了信，不是兼定写的，是御所里一个会念南蛮经的人代笔，字写得笨，意思倒清楚：殿下的刀口合上了，左手抬不起来，腿也不大听使唤，每天让人扶着坐到廊下晒太阳。砍他的那个旧臣没跑远，躲在中村北边的山里，家臣们要去捉，殿下不许。“殿下说，那人跟了他十几年，砍他那一刀，是替宗珊大人砍的。”信的最后一行是兼定自己添的，字歪得厉害，像是拿不惯笔的那只手写的：“姊上别来报仇。”"

# p4 巡察使（1581）：在府内码头。变体 held 改去中村。
[[tracks.chapters]]
key = "p4_visitor"
title = "巡察使"
hint = "1581年5月至10月在府内卸货，南蛮寺的人会到码头上找你。"
go = { port = "funai" }
text = "夏天，我的船在府内卸货，南蛮寺的人找到码头上来，说巡察使大人要去宇和海的户岛，看一位受了洗的老殿下，问我的船去不去。巡察使是个高个子的意大利人，比南蛮寺的门框还高半个头，日本话只会几句，见了我先合掌，又画了个十字，弄得我不知道该回哪一种礼。他说听人讲，那位唐·保罗在岛上教渔家的孩子写字，“用他自己的字，不是我们的”。他想去看一看。"
at = "funai"
cast = ["alessandro_valignano", "ichijo_kanesada"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1581, 5, 1] }]
deadline = [1581, 10, 31]
news = "府内的人说，南蛮的巡察使要去看那位受了洗的一条殿，一条家姬君的船也在码头上。"

[tracks.chapters.timeout]
next = "p5_cross"
effects = []
news = "府内南蛮寺的人说，巡察使搭了别家的船，去看了那位受了洗的一条殿。"

[[tracks.chapters.choices]]
key = "carry"
text = "载他去，船钱不收"
next = "p5_cross"
effects = [{ kind = "affinity", person = "alessandro_valignano", value = 4 }, { kind = "affinity", person = "ichijo_kanesada", value = 3 }, { kind = "flag", flag = "rw_mio_paulo_carried" }]
reply = "船走了五天。到的那天，兼定让人把他抬到岸边，左手搭在膝上，右手举起来画了个十字，画得歪。巡察使跪下来，跟他说了很久的话，用的是葡萄牙话，兼定一句也听不懂，一直在点头。孩子们排在后头，每人手里捧着一张纸，纸上写着自己的名字。巡察使一张张看过去，看到一个把“鱼”字写成了一条鱼的，笑出了声。"

[[tracks.chapters.choices]]
key = "charge"
text = "载他去，照南蛮船的价收船钱"
next = "p5_cross"
effects = [{ kind = "cash", value = 400 }, { kind = "affinity", person = "ichijo_kanesada", value = 1 }, { kind = "flag", flag = "rw_mio_paulo_charged" }]
reply = "我照长崎南蛮船的价报了船钱，一文不让。巡察使的书记脸都绿了，巡察使倒笑了，说日本的女船头比葡萄牙的商人还会算，叫人照数付了。到了地方，兼定听说我收了钱，叫人把他那份口粮折成钱补给我。我不要，他硬塞，塞不过我，就叫孩子们往我船上扔鱼干。"

[[tracks.chapters.choices]]
key = "map"
text = "不载，把去的水路画给他"
next = "p5_cross"
effects = [{ kind = "skill", skill = "cartography", value = 5 }, { kind = "flag", flag = "rw_mio_paulo_map" }]
reply = "我说我的船这一季要去堺，去不了，把去那边的水路画了一张图给他：哪里有暗礁，哪里要等潮。巡察使把图叠好，放进胸口，说他会替我在那位殿下面前说一句话。后来兼定来信，说巡察使带着一张女人画的图来的，图画得比神父们的地图准。"

[[tracks.chapters.variants]]
key = "held"
when = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }]
text = "夏天，我的船在府内卸货，南蛮寺的人找到码头上来，说巡察使大人要去土佐的中村，看一位受了洗的殿下，问我的船去不去。巡察使是个高个子的意大利人，比南蛮寺的门框还高半个头，日本话只会几句，见了我先合掌，又画了个十字，弄得我不知道该回哪一种礼。他说听人讲，那位唐·保罗在御所里教家臣和渔家的孩子写字，“用他自己的字，不是我们的”。他想去看一看。"

# p5 往右倒的字：c08 户岛的灯以后去看坟（终章）。在下田出发；变体 held 改为中村。
[[tracks.chapters]]
key = "p5_cross"
title = "往右倒的字"
hint = "1585年9月至来年正月在下田，从那里去户岛走一趟。"
go = { port = "shimoda_tosa" }
text = "秋凉以后，我去了一趟户岛。渔家把兼定葬在小庙后头的坡上，坟前立着一个木十字，横木上刻着几行字，是他生前自己写好、叫人照着刻的：一行南蛮字，我不认得；底下一行假名，是他的教名；再底下是“一条兼定”。刻工照着他的手刻，刻得很老实，连他的毛病也刻了上去——每个字都往右倒，像顶着风走路。坡下几个孩子在礁石上晒网，有一个看见了我，跑上坡来，指着十字说：“殿下教的字。”"
at = "shimoda_tosa"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1585, 9, 1] }]
deadline = [1586, 1, 31]
news = "下田的渡口说，一条家的姬君开船去看了弟弟的坟，坟前立着一个木十字。"

[tracks.chapters.timeout]
next = "done"
effects = []
news = "宇和海的渔家说，那位受了洗的一条殿坟前的木十字，字刻得往右倒，孩子们照着学。"

[[tracks.chapters.choices]]
key = "rubbing"
text = "拓一张，带去足摺给母亲"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_paulo_rubbing" }]
reply = "我向渔家借了纸和墨，蹲在十字前头拓了一张。墨不够浓，有几个字拓得发虚，那几道往右倒的笔画倒拓得最清楚。我把拓本卷好，开船去了足摺。母亲那时候已经起不来了，我把拓本展开在她眼前，她看了很久，伸出一根手指，顺着“兼”字最后那一捺，往右划了一下。"

[[tracks.chapters.choices]]
key = "wind"
text = "在沙上写一个正的“兼”，教那孩子"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_paulo_wind" }]
reply = "我在滩上拿树枝写了一个“兼”字，写得端端正正，叫那孩子照着写。他写了三遍，三遍都往右倒。我问他为什么。他说殿下就是这么教的，殿下说，字往右倒，是因为风从左边来。我把树枝还给他，没再教。"

[[tracks.chapters.choices]]
key = "dusk"
text = "在十字前坐到天黑"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_paulo_dusk" }]
reply = "我在十字前坐到天黑。孩子们收了网，回家了。坡下亮了一盏灯，是那个会念南蛮经的人点的，他每天傍晚来点一回，点完了念一会儿经，用的是土佐话。我听不懂他念什么，只听出里头有兼定的名字，两个都有，教名和他原来的名字，挨在一起念。"

[[tracks.chapters.variants]]
key = "held"
when = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }]
text = "秋凉以后，我去了一趟中村。兼定葬在御所后头的寺边，坟前立着一个木十字，横木上刻着几行字，是他生前自己写好、叫人照着刻的：一行南蛮字，我不认得；底下一行假名，是他的教名；再底下是“一条兼定”。刻工照着他的手刻，刻得很老实，连他的毛病也刻了上去——每个字都往右倒，像顶着风走路。渡口那边几个孩子在河滩上晒网，有一个看见了我，跑过来，指着十字说：“殿下教的字。”"

# ───────────── 旁轨（剧情增写 11-11，Claude）：乳母的最后一桨（阿濑与村上，第二幕木津川前后） ─────────────
# 母本：《平家物语》斋藤实盛（老了还上阵的武者，死后才被人认出）；文化：海贼的规矩（交了旗钱就护到底）与乳母的忠；
# 张力：她把奶给了一条家，把血还给了村上；最后一桨划给谁，她自己说了算。汐不伤（C7 的结局旗标不读，汐只在正文里替她娘写信、守着她）。
