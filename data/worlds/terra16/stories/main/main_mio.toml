#         养成期第一次听见、本线 a01 澪自己说（第二次）、渡川前夜（C21d 新加）；c09 那一处待 C21d 定（改作行话或删）。
#         收旗钱场合的行话照常出现，不计数。“再来一局。”在 b06 与 c10。
# 秘密：父亲房基之死只在 b03 揭开（只到“是自尽，不是狂疾”与辞世的一句歌意，不点名任何人）；
#       隐藏志向（补陀落）不点破，只用 a13 的船、c05 的回想、c06 的海兑现。见闻里两件都不写。
