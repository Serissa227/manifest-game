# a09 即位礼：紫宸殿前的雪。缺省正文是挤在门外；变体 paid 是女房的末席。
[[tracks.chapters]]
key = "a09_coronation"
title = "紫宸殿前的雪"
hint = "1560年2月、3月留在堺，即位礼就在这两个月里。"
go = { port = "sakai" }
text = "我从堺上京。即位礼那天下了一场晚雪，紫宸殿前的白砂上落了薄薄一层。我挤在建礼门外的人堆里，隔着墙只看得见香烟一缕一缕往上飘，听得见公卿的靴子踩雪。旁边卖炭的町人缩着脖子嘀咕：“办一回即位礼，京里的炭价涨了三成。”那张引见帖还夹在言继的信里，约见的时辰早过了。散场时一个老女房从门里出来，一眼认出了我，把我从人堆里拽到廊檐底下，塞过来一只金纸包的点心：“土佐来的那个孩子？晒成这样了。进来，廊下没有雪。……当年那张小几，还收着呢。”我跟她进了廊下，点心的金纸上沾着雪水。"
stage = "witness"
window = [[1560, 2, 1], [1560, 3, 31]]
at = "sakai"
cast = ["ogimachi"]
speaker = "captain"
mood = "tender"
news = "京里来的人说，正亲町天皇的即位礼总算办成了，钱多半是毛利家和本愿寺出的；那天紫宸殿前下了雪。"

[tracks.chapters.default]
next = "a10_wang_echo"
effects = []

[[tracks.chapters.variants]]
key = "paid"
when = [{ kind = "flag", flag = "c13_main_mio_coronation_paid" }]
text = "我从堺上京。即位礼那天下了一场晚雪，紫宸殿前的白砂上落了薄薄一层，公卿们的靴子踩出一行行黑印。钱箱里有一份是我经手的，这一回我站在女房们的最后一排，看得见高御座的帐子，香烟从帐缝里一缕一缕往外飘。身边一个年轻女房扯了扯我的袖子：“别踮脚，帘子里看得见。”散场时，前排一个老女房回过头，一眼认出了我，把我拉到廊檐底下，塞过来一只金纸包的点心：“土佐来的那个孩子？晒成这样了。……当年那张小几，还收着呢。”到了廊下我才想起言继信里夹的那张引见帖，约见的时辰早过了。"

# a10 结果回响（H14）：王直的结局。无 at；选项按 HIST 互斥，恰好一项可选。
[[tracks.chapters]]
key = "a10_wang_echo"
title = "杭州的告示"
hint = "平户来的船头会把王直的下落带给你，不必特意去哪儿。"
text = "平户来的船头带来一张抄下的告示，纸边被海风吹卷了：王直在杭州官巷口被斩，首级示众，余党四散。船头把纸递过来时说：“岑港的人都散了，就弥七还守在平户。”随告示来的还有弥七的一句口信，他照旧不肯写字，船头替他转述：“船主说：姑娘的潮看得准。”船头伸手要那张告示，我没给，问他平户今年的生丝什么价，白丝、黄丝、捻丝，一样一样问。"
cast = ["mio"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1560, 2, 1] }]

[[tracks.chapters.choices]]
key = "lived"
text = "收下他的谢帖，回一封信去宁波"
requires = [{ kind = "flag", flag = "h14_wang_zhi_return_wang_zhi_amnestied" }]
hint = "宁波没有来信。"
next = "a11_noshima"
effects = [{ kind = "flag", flag = "c13_main_mio_wangzhi_alive" }, { kind = "reputation", faction = "wang_zhi", value = 5 }]
reply = "我照宫里的格式回信，客套写满了半张纸，正经事只问了一件：舟山的潮，跟平户的一样不一样。信交给去宁波的船，船头问要不要添一句贺他受封的话，我说不用，他自己知道。"

[[tracks.chapters.choices]]
key = "died"
text = "等退潮，把告示折成纸船，替他点一炷香"
