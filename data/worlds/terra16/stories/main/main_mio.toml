next = "b04_exile"
effects = [{ kind = "flag", flag = "c13_main_mio_told_brother" }, { kind = "affinity", person = "ichijo_kanesada", value = 6 }, { kind = "reputation", faction = "ichijo", value = 2 }, { kind = "memory", memory = "mem-main_mio-b03", title = "宗珊收着的辞世" }]
reply = "我换了宫里的衣裳上中村。御所的大厅里，弟弟坐在上座，内基大人坐在侧面，两个人谁也不看谁。我按礼数跪下，把那张纸推到他膝前，一句责备的话也没说。兼定读到第二行，手就抖得拿不住纸了。他问我：宗珊为什么不早给他看。我说：家老怕你以为是在骂你。他把纸按在膝上，按了很久，指节都白了。出门的时候，内基大人在廊下叹了口气，什么也没说。那天夜里，御所的人到船上传话：殿下要把那张纸抄一份留着，原件明早还我。"
fail = { next = "b04_exile", effects = [{ kind = "flag", flag = "c13_main_mio_told_brother" }, { kind = "affinity", person = "ichijo_kanesada", value = -6 }, { kind = "memory", memory = "mem-main_mio-b03", title = "宗珊收着的辞世" }], news = "中村御所里，大姬君跟殿下吵起来了，话说得太重，殿下把一张旧纸扔回给她，叫人送客。" }

[[tracks.chapters.choices]]
key = "into_fan"
text = "收下辞世，什么也不说，夹进那把桧扇"
next = "b04_exile"
effects = [{ kind = "flag", flag = "c13_main_mio_poem_in_fan" }, { kind = "memory", memory = "mem-main_mio-b03", title = "宗珊收着的辞世" }]
reply = "我把那张纸折成扇骨那么窄，夹在七夕那首歌的旁边。老仆看着我折，一直没出声。折完了，他朝我磕了个头，问殿下那边要不要知会一声。我说不用，家老交给我的，就在我这里。他又磕了个头，划着空船回中村去了，船上的灯笼越来越小。那一夜我坐在栈桥上没回屋。潮涨上来，漫过最下面一级石阶，又退下去，我一直没把扇子打开。扇子合上的时候比从前厚了一点，打开要多用一分力。"

[[tracks.chapters.choices]]
key = "to_uchimoto"
text = "把辞世交给本家来的内基，让京都的一条家来判"
next = "b04_exile"
effects = [{ kind = "affinity", person = "ichijo_uchimoto", value = 5 }, { kind = "reputation", faction = "imperial_court", value = 2 }, { kind = "reputation", faction = "ichijo", value = -2 }, { kind = "memory", memory = "mem-main_mio-b03", title = "宗珊收着的辞世" }]
reply = "我连夜上中村，把文匣交给本家来的内基大人。他在偏殿里借着一盏灯读，读完，叹了一口气，说本家早就疑心先代不是狂疾。他叫人抄了一份收下，原件还给我，叠得比我交给他的时候还整齐。抄本的墨还没干，他就叫人锁进了从京里带来的箱子。临走他说：“这样，就更不能让兼定再当这个家了。”我站在御所门外，听见里头弟弟在摔东西，一样，又一样。"

# b04 落发的弟弟到府内；舅舅在臼杵，只派了个管事。
[[tracks.chapters]]
key = "b04_exile"
title = "落发的弟弟"
hint = "1574年2月至5月去府内的码头，有自家人要在那里上岸。"
go = { port = "funai" }
text = "早春的府内码头，一条借来的船靠了岸，下来一个戴斗笠的年轻和尚——我的弟弟，土佐一条家的前当主，头刚剃过，青皮上还有刀口。他的妻子是宗麟舅舅的女儿，他来投奔岳父。可舅舅如今住在臼杵的岛城，派到码头来接的只是个小管事：“主公在臼杵，说一条殿远来辛苦，先在寺里歇着。”兼定袖子上一条家的藤纹被人剪掉了，剪口还没锁边。他下船头一句话不是谢我，是问：“大姬君的船，几时能送我回去？”又说：“我还是土佐一条家的当主。剃了头也是。”剪掉的纹，剪口还毛着，像他。"
stage = "involve"
window = [[1574, 2, 1], [1574, 5, 31]]
at = "funai"
cast = ["ichijo_kanesada", "otomo_sorin"]
speaker = "captain"
mood = "sad"
news = "府内的码头上，一条家的姬君接她落了发的弟弟下船，大友家只派了个管事来接。"

[tracks.chapters.default]
next = "b05_dom_paulo"
effects = []
news = "府内的码头上，有人认出了那个戴斗笠下船的年轻和尚——是土佐的一条殿。"

[[tracks.chapters.choices]]
key = "speak_for_him"
text = "从府内去臼杵见舅舅，替弟弟讨一处宅子和几个人"
check = { attr = "etiquette", base = 20, per = 7 }
next = "b05_dom_paulo"
effects = [{ kind = "flag", flag = "c13_main_mio_exile_housed" }, { kind = "reputation", faction = "otomo", value = 2 }, { kind = "reputation", faction = "ichijo", value = 2 }, { kind = "affinity", person = "ichijo_kanesada", value = 5 }]
reply = "我在臼杵城里规规矩矩地求，从女儿的面子说到大友家的体面，一句也没提长府。宗麟听完，给了一处带院子的宅子和十几个人，说是看在女儿的面上。回府内的路上，管事悄悄跟我说，主公这一年头一回松口松得这么快。"
fail = { next = "b05_dom_paulo", effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 2 }], news = "府内的人说，土佐来的大姬君去臼杵替落发的弟弟求宅子，大友殿只给了寺里一间屋，说宅子要留给打仗的人。" }

[[tracks.chapters.choices]]
key = "give_crew"
text = "把船上最好的两个水夫留给他"
next = "b05_dom_paulo"
effects = [{ kind = "flag", flag = "c13_main_mio_exile_crew" }, { kind = "affinity", person = "ichijo_kanesada", value = 8 }]
reply = "两个水夫，一个会看潮，一个会使枪。我叫他们跪下认了新主。兼定没道谢，只看了他们一眼。那天晚上，他头一回跟我坐在一处吃饭，吃完了才说了一句：“使枪那个，手稳。”"

[[tracks.chapters.choices]]
key = "go_home"
text = "不留下，回中村陪母亲"
next = "b05_dom_paulo"
effects = [{ kind = "reputation", faction = "ichijo", value = 1 }, { kind = "affinity", person = "ichijo_kanesada", value = -3 }]
reply = "我把他送进寺门就走了。他站在门里，没送。寺里的小僧追到码头，塞给我一包柿饼，说是殿下给中村的母亲的，话一句也没带。回程的船上，我把扇子开了又合，合了又开，扇骨磨得手心发烫。"

[[tracks.chapters.variants]]
key = "asked_sorin"
when = [{ kind = "flag", flag = "c13_main_mio_asked_sorin" }]
text = "早春的府内码头，一条借来的船靠了岸，下来一个戴斗笠的年轻和尚——我的弟弟，土佐一条家的前当主，头刚剃过，青皮上还有刀口。他的妻子是宗麟舅舅的女儿，他来投奔岳父。可舅舅如今住在臼杵的岛城，派到码头来接的只是个小管事：“主公在臼杵，说一条殿远来辛苦，先在寺里歇着。”管事又压低声音补了一句，说是主公的原话：“又是那个丫头？上回问我要一条船，这回要什么？”兼定袖子上一条家的藤纹被人剪掉了，剪口还没锁边。他下船头一句话不是谢我，是问：“大姬君的船，几时能送我回去？”剪掉的纹，剪口还毛着，像他。"

# b05 唐·保罗：兼定受洗，要打回土佐，向她要船。H44 前奏；设杠杆钥匙。
[[tracks.chapters]]
key = "b05_dom_paulo"
title = "唐·保罗"
hint = "1575年正月至7月去府内，兼定在南蛮寺等你。只想出钱的话，备好两千金币。"
go = { port = "funai" }
text = "春天的府内，兼定在南蛮寺受了洗，教名唐·保罗，脖子上挂着一串念珠，僧衣还没换干净。他从幡多的旧臣、伊予的法华津家、岳父的大友家凑了几千人，要从宿毛登岸，沿四万十川打回中村。他把一张自己画的河口图摊在我面前：“神父说，天主会给我一条回土佐的路。大姬君，你的船就是那条路。”图画错了，下田的沙洲画到了河的另一边。我拿过笔，把沙洲改回它该在的地方。兼定盯着那一笔看了很久，叫了我一声：“姐姐。”舅舅从臼杵捎来的话说得漂亮：“兵我借了。船嘛——土佐的海，土佐人熟。”念珠挂在他脖子上，比家纹还沉。"
at = "funai"
cast = ["ichijo_kanesada", "otomo_sorin"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1575, 1, 1] }]
deadline = [1575, 7, 31]
news = "府内的南蛮寺边上，土佐那位受了洗的一条殿摊开一张河口图，跟他姐姐吵到天黑。"

[tracks.chapters.timeout]
next = "b06_watari"
effects = []
news = "府内的人说，受了洗的一条殿等不到姐姐的船，自己凑了船渡海回土佐了。"

[[tracks.chapters.choices]]
key = "pledge"
text = "把整支船队押上：渡川口，我去封"
next = "b06_watari"
effects = [{ kind = "flag", flag = "c13_main_mio_watari_pledge" }, { kind = "affinity", person = "ichijo_kanesada", value = 8 }, { kind = "reputation", faction = "ichijo", value = 3 }, { kind = "reputation", faction = "chosokabe", value = -3 }]
reply = "我当场把能调动的船一条一条写给他：几条小早，几条关船，谁家的船头，各装多少人。兼定把那张单子折好揣进怀里，跟念珠贴在一处：“河口交给姐姐。”这一声他叫得很顺，像是从来就这么叫。"

[[tracks.chapters.choices]]
key = "money_only"
text = "只出钱，不出船"
requires = [{ kind = "cash", ge = 2000 }]
hint = "你拿不出这么一袋钱。"
next = "b06_watari"
effects = [{ kind = "cash", value = -2000 }, { kind = "affinity", person = "ichijo_kanesada", value = 3 }, { kind = "reputation", faction = "ichijo", value = 1 }]
reply = "我把一袋钱放在念珠旁边。兼定盯着钱袋看了一会儿，说了声“够了”，声音冷得像井水。那张改过的图，他没让我带走。我走到门口，听见他叫人把钱袋拿去换火药，一句也没再提船。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不出：一条家的事，该归一条家自己"
next = "b06_watari"
effects = [{ kind = "flag", flag = "c13_main_mio_watari_refused" }, { kind = "affinity", person = "ichijo_kanesada", value = -8 }, { kind = "reputation", faction = "chosokabe", value = 1 }]
reply = "兼定把那张改过的图卷起来，没再看我一眼。我出门的时候，隔壁南蛮寺里有人在唱一首我听不懂的歌，调子很慢，一句一句往上走，走到最高处就停了。"

[[tracks.chapters.variants]]
key = "housed"
when = [{ kind = "flag", flag = "c13_main_mio_exile_housed" }]
text = "春天的府内，舅舅给的那处宅子里，兼定的十几个人正在院里练枪，枪尖戳得稻草人直晃。兼定在南蛮寺受了洗，教名唐·保罗，脖子上挂着一串念珠，僧衣还没换干净。他从幡多的旧臣、伊予的法华津家、岳父的大友家凑了几千人，要从宿毛登岸，沿四万十川打回中村。他把一张自己画的河口图摊在廊下：“神父说，天主会给我一条回土佐的路。大姬君，你的船就是那条路。”图画错了，下田的沙洲画到了河的另一边。我拿过笔，把沙洲改回它该在的地方。兼定盯着那一笔看了很久，叫了我一声：“姐姐。”舅舅从臼杵捎来的话说得漂亮：“兵我借了。船嘛——土佐的海，土佐人熟。”念珠挂在他脖子上，比家纹还沉。"

# b06 渡川（H44 现场）。default：史实照常，结果在 b07 分叉。口头禅②第一次在 find_brother。
[[tracks.chapters]]
key = "b06_watari"
title = "渡川"
hint = "1575年8月至10月守在下田的河口，渡川一带要开仗。"
go = { port = "shimoda_tosa" }
text = "秋雨刚停，四万十川涨了水，河面宽得像海。弟弟的人马在西岸的栗本城一带列阵，对岸七片酢浆草的旗排成一线，长宗我部的七千人正从上游往下压。我的小早停在下田的河口，就在那道沙洲外头。潮在退，河水往外冲，两股水撞出一道白线。舱里有火绳枪，也有空着的地方，能装兵，也能装伤号。弟弟隔着河喊：“姐姐，封住河口！别让他们的船绕到后面！”潮退到底的那一刻，对岸的人马偏偏选在沙洲最浅的地方下了水。隔着河，我都听得见他们的足轻在喊：“跟着那个渔夫走，水只到腰。”那条路，只有在下田长大的人才知道。沙洲还在老地方，看沙洲的人换了。"
stage = "involve"
window = [[1575, 8, 1], [1575, 10, 31]]
at = "shimoda_tosa"
cast = ["ichijo_kanesada", "chosokabe_motochika"]
speaker = "captain"
mood = "tense"
news = "四万十川渡川口那一仗，下田的人说有条一条家的小早从早到晚横在河口的白线上，一步没退。"

[tracks.chapters.default]
next = "b07_watari_echo"
effects = []
news = "四万十川一仗，长宗我部的人马趁退潮涉水过了河，河口的沙洲上漂着两家的旗。"

[[tracks.chapters.choices]]
key = "seal_mouth"
text = "把几条小早连起来，横在河口的白线上"
check = { attr = "command", base = 5, per = 8 }
next = "b07_watari_echo"
effects = [{ kind = "flag", flag = "c13_main_mio_watari_sealed" }, { kind = "fame", value = 4 }, { kind = "reputation", faction = "ichijo", value = 3 }, { kind = "reputation", faction = "chosokabe", value = -4 }]
reply = "我叫人把四条小早用缆绳首尾连成一排，横在那道白线上，船头一律朝外。长宗我部绕后的船来了三回，三回都在缆绳跟前打横，一条也没进来。可我守得住河口，守不住河的上游：对岸的人马过了沙洲，西岸的旗一面一面倒下去，我在船上只能看着，缆绳勒得掌心出了血。"
fail = { next = "b07_watari_echo", effects = [{ kind = "fame", value = 1 }, { kind = "reputation", faction = "chosokabe", value = -2 }], news = "四万十川口有人看见，一条家的小早用缆绳横在河口，急流冲断了一根，两条长宗我部的船从缺口钻了过去。" }

[[tracks.chapters.choices]]
key = "rescue"
text = "在下游救人：落水的，不管挂谁家的旗"
check = { attr = "medicine", base = 20, per = 7 }
next = "b07_watari_echo"
effects = [{ kind = "fame", value = 3 }, { kind = "reputation", faction = "chosokabe", value = 2 }, { kind = "reputation", faction = "ichijo", value = 1 }]
reply = "我的船在下游来回，捞上来的人在船板上一排躺着，一条家的、长宗我部的都有。我挨个按住伤口，按完一个，手上的血没擦就去按下一个。有个长宗我部的少年醒过来，看清了船上的旗，想爬下船去，被我一把按了回去。后来长宗我部家的人到下田，说起这条船，都要低一低头。"
news = "四万十川一仗打完，下田的人说，河口那条一条家的小早捞了一整天落水的人，两家的都捞。"
fail = { next = "b07_watari_echo", effects = [{ kind = "fame", value = 1 }], news = "四万十川下游有条一条家的小早捞了一整天落水的人，捞上来的太多，船板上的血洗了三天才洗掉。" }

[[tracks.chapters.choices]]
key = "find_brother"
text = "冲进阵里去找弟弟"
check = { attr = "arms", base = 20, per = 7 }
next = "b07_watari_echo"
effects = [{ kind = "flag", flag = "c13_main_mio_saved_brother" }, { kind = "affinity", person = "ichijo_kanesada", value = 10 }]
reply = "我提着薙刀从西岸的芦苇里杀进去，在乱军里看见那串念珠在他胸前晃，一把把他拽上了船。兼定在船底坐了很久，头盔丢了，青皮上全是泥。他说：“姐姐，再打一次，我能赢。”我把薙刀插回船舷：“再来一局。”他愣了一下，笑了，笑得跟小时候下双六输了一个样。"
news = "四万十川那一仗，有人看见一条家的大姬君提着薙刀冲进西岸的芦苇，把殿下从乱军里拽上了船。"
fail = { next = "b07_watari_echo", effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 3 }], news = "四万十川那一仗，一条家的大姬君提着薙刀冲进西岸的芦苇，没冲到殿下身边；殿下骑马往西逃了，回头看了她的船一眼。" }

[[tracks.chapters.variants]]
key = "crew"
when = [{ kind = "flag", flag = "c13_main_mio_exile_crew" }]
text = "秋雨刚停，四万十川涨了水，河面宽得像海。弟弟的人马在西岸的栗本城一带列阵，我当年留给他的两个水夫站在他身边，一个正蹲着看潮。对岸七片酢浆草的旗排成一线，长宗我部的七千人正从上游往下压。我的小早停在下田的河口，就在那道沙洲外头。潮在退，河水往外冲，两股水撞出一道白线。弟弟隔着河喊：“姐姐，封住河口！别让他们的船绕到后面！”潮退到底的那一刻，对岸的人马偏偏选在沙洲最浅的地方下了水。隔着河，我都听得见他们的足轻在喊：“跟着那个渔夫走，水只到腰。”那条路，只有在下田长大的人才知道。沙洲还在老地方，看沙洲的人换了。"

[[tracks.chapters.variants]]
key = "pledge"
when = [{ kind = "flag", flag = "c13_main_mio_watari_pledge" }]
text = "秋雨刚停，四万十川涨了水，河面宽得像海。河口停的不止我一条船：我押上的整支船队排在白线外，弟弟的兵从我的船上一船一船登岸，在西岸的栗本城一带列了阵。对岸七片酢浆草的旗排成一线，长宗我部的七千人正从上游往下压。潮在退，河水往外冲，两股水撞出一道白线。弟弟隔着河喊：“姐姐，封住河口！别让他们的船绕到后面！”潮退到底的那一刻，对岸的人马偏偏选在沙洲最浅的地方下了水。隔着河，我都听得见他们的足轻在喊：“跟着那个渔夫走，水只到腰。”那条路，只有在下田长大的人才知道。沙洲还在老地方，看沙洲的人换了。"

[[tracks.chapters.variants]]
key = "refused"
when = [{ kind = "flag", flag = "c13_main_mio_watari_refused" }]
text = "我说过不出船，可那天早上，我还是把小早开到了河口。秋雨刚停，四万十川涨了水，河面宽得像海。弟弟的人马在西岸的栗本城一带列阵，对岸七片酢浆草的旗排成一线，长宗我部的七千人正从上游往下压。潮在退，河水往外冲，在沙洲外头撞出一道白线。弟弟看见了我的船，隔着河喊：“姐姐，封住河口！别让他们的船绕到后面！”潮退到底的那一刻，对岸的人马偏偏选在沙洲最浅的地方下了水。隔着河，我都听得见他们的足轻在喊：“跟着那个渔夫走，水只到腰。”那条路，只有在下田长大的人才知道。沙洲还在老地方，看沙洲的人换了。"

# b07 结果回响（H44）：幡多的秋天。无 at；选项按 HIST 互斥，恰好一项可选。
# 基础正文 = 缺省（一条家覆灭、兼定去户岛）；变体 a_held_sealed / b_held 读 HIST 写守住幡多，sealed 是缺省 + 缆绳。
[[tracks.chapters]]
key = "b07_watari_echo"
title = "幡多的秋天"
hint = "渡川以后，幡多的消息会有人送到船上，不必去哪儿。"
text = "渡川以后，幡多的稻子没人割，田里横着两家的旗杆。消息追到我手里：弟弟带着几十个人坐船去了伊予宇和海的户岛，中村御所的门上换了长宗我部的封条。送信的脚夫抹着汗说：“封条贴了两层，御所里养的猫都是翻墙头出来的。”母亲搬去了足摺的一间小庵，托人把一串钥匙送到我船上，是中村御所的，铜环磨得发亮，说御所用不着了。她只捎了一句话：“钥匙给你。门开着关着，你看着办。”钥匙一样沉，开的门不一样。"
cast = ["ichijo_kanesada"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1575, 11, 1] }]

[[tracks.chapters.choices]]
key = "held"
text = "回中村，一个村子一个村子点清守住的地方"
requires = [{ kind = "flag", flag = "h44_shimanto_ichijo_holds_hata" }]
hint = "中村的门上，贴的是别家的封条。"
next = "b08_kizugawa1"
effects = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }, { kind = "reputation", faction = "ichijo", value = 3 }]
reply = "我带着那串钥匙走遍幡多。每到一个村子，就把一条家的幔幕重新挂起来，挂歪了自己爬上去扶正。村里的老人跟在后头数，数到第十几个村子，有个老人哭了，说先代那年也这样走过一遍。"

[[tracks.chapters.choices]]
key = "fell"
text = "送弟弟去伊予的户岛，再回来接母亲"
requires = [{ kind = "flag", flag = "h44_shimanto_ichijo_holds_hata", value = false }]
hint = "一条家还守着幡多，用不着去户岛。"
next = "b08_kizugawa1"
effects = [{ kind = "affinity", person = "ichijo_kanesada", value = 3 }]
reply = "我掌舵把兼定送到户岛。岛上只有一片渔村和一座小庙，码头是几块垒起来的石头。他下船时把念珠绕在手腕上，回头说：“明年春天，再来接我。”我说好。回程的船上，那串钥匙在怀里硌了我一路。"

[[tracks.chapters.variants]]
key = "a_held_sealed"
when = [{ kind = "flag", flag = "h44_shimanto_ichijo_holds_hata" }, { kind = "flag", flag = "c13_main_mio_watari_sealed" }]
text = "渡川以后，幡多的稻子没人割，田里横着两家的旗杆。渡川口那道白线上，我的缆绳还拴在两岸的木桩上，没人去解。消息追到我手里，是好的：长宗我部的人退回了渡川东边，中村御所门口照旧挂着一条家的幔幕。送信的脚夫抹着汗说：“幔幕是连夜挂回去的，挂歪了，没人顾得上扶。”母亲搬去了足摺的一间小庵，托人把中村御所的一串钥匙送到我船上，铜环磨得发亮。她只捎了一句话：“钥匙给你。门开着关着，你看着办。”钥匙一样沉，开的门不一样。"

