text = "夏天，秀吉的大军渡海进了四国，长宗我部降了。同一个月，宇和海来的渔船带来消息：户岛上的兼定过世了，四十出头，岛上的渔家照南蛮的规矩给他立了一个木十字。渔夫说：“殿下走的时候手里攥着念珠，嘴里念的是土佐话。临终前叫人把一张旧纸抄了一份，要捎给土佐的姐姐。”我不用打开，就知道是父亲的辞世。我在下田的河口点了一盏灯，放在那道沙洲上，等潮把它带出去。补网的老婆婆在旁边看着：“涨潮放灯，它走不了的。”灯没有走，在沙洲上搁浅了，一直亮到天明。灯不肯走，像他。"

# c09 海贼停止令（H62 前夜）。口头禅①第二次也是最后一次。
[[tracks.chapters]]
key = "c09_edict"
title = "海贼停止令"
hint = "1588年下半年去能岛的关所。阿濑缝的那面过所旗，一直带在身上。"
go = { port = "noshima" }
text = "夏末的能岛，关所的门上钉着一张新告示：从今往后，海上不许收帆别钱，不许卖过所旗，违者以海贼论。武吉前年已经被迁去了筑前，岛上只剩几个看房子的老水夫。武吉托人带来的口信是：“交了的旗，关白会还你一张文书；烧了的旗，海会记得。”老水夫把关所屋里那捆没卖出去的旗搬出来，最上面一面盖着能岛的石印。他问我：“姬君，旗不作数了，船还作数吧？”我袖子里还揣着阿濑缝的那面过所旗，旗边的针脚磨得发白。我对着空关所说了一句：“旗钱，先付。”说完自己先笑了，老水夫也跟着笑。旗是布，潮不是。"
stage = "involve"
window = [[1588, 7, 1], [1588, 12, 31]]
at = "noshima"
cast = ["mio"]
speaker = "captain"
mood = "sad"
news = "能岛的关所门上钉了关白的告示，一条家的姬君在空关所里坐了一下午。"

[tracks.chapters.default]
next = "c10_epilogue"
effects = []
news = "关白下了海贼停止令，能岛关所的门上钉了告示，村上家卖了几十年的过所旗从此不作数了。"

[[tracks.chapters.choices]]
key = "yield"
text = "交出阿濑缝的那面旗，替新的天下做事"
requires = [{ kind = "item", item = "mio_pass_flag", qty = 1 }]
hint = "阿濑缝的那面旗，已经不在你手里了。"
next = "c10_epilogue"
effects = [{ kind = "item", item = "mio_pass_flag", qty = -1 }, { kind = "flag", flag = "c13_main_mio_edict_yield" }, { kind = "reputation", faction = "toyotomi", value = 5 }, { kind = "memory", memory = "mem-main_mio-c09", title = "最后一面旗" }]
reply = "我把旗叠成四折，针脚朝里，交给奉行的人。他给我一张盖着朱印的文书，准我的船在内海运兵粮。文书很新，墨味还冲。我把它塞进袖子，原先放旗的地方换成了一张硬纸，怎么塞都不服帖。"

[[tracks.chapters.choices]]
key = "abroad"
text = "挂上自己的旗，去琉球和南洋"
next = "c10_epilogue"
effects = [{ kind = "flag", flag = "c13_main_mio_edict_abroad" }, { kind = "reputation", faction = "toyotomi", value = -3 }, { kind = "memory", memory = "mem-main_mio-c09", title = "最后一面旗" }]
reply = "我把一条家的旗挂上桅顶，绳子拉到最紧。老水夫仰着头看：“内海不让挂了。”我说内海不让挂，海外总让挂。他们帮我把船推下水，推到水没过了膝盖还不肯松手。"
news = "能岛的老水夫说，关白的告示贴出来那天，一条家的姬君把自家的旗挂上桅顶，往南去了。"

[[tracks.chapters.choices]]
key = "burn"
text = "在能岛的码头上把旧旗全烧了，一面也不留"
next = "c10_epilogue"
effects = [{ kind = "reputation", faction = "murakami", value = 3 }, { kind = "memory", memory = "mem-main_mio-c09", title = "最后一面旗" }]
reply = "火烧了一下午，烟飘到来岛都看得见。老水夫们站在火边，一个一个说出自己领过的第一面旗是哪一年、谁替他挂上桅的。轮到我，我说那一面不在这堆里，在我袖子里。没有人叫我把它也扔进去。"
news = "能岛的关所贴了关白的告示，听说那天码头上烧了一堆旧旗，烟飘到来岛都看得见。"

[[tracks.chapters.variants]]
key = "nobunaga"
when = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives" }]
text = "夏末的能岛，关所的门上钉着一张新告示，落款是安土：从今往后，海上不许收帆别钱，不许卖过所旗，违者以海贼论。信长的天下下的令，来执行的是他的大将羽柴秀吉。武吉前年已经被迁去了筑前，岛上只剩几个看房子的老水夫。武吉托人带来的口信是：“交了的旗，安土会还你一张文书；烧了的旗，海会记得。”老水夫把关所屋里那捆没卖出去的旗搬出来，最上面一面盖着能岛的石印。他问我：“姬君，旗不作数了，船还作数吧？”我袖子里还揣着阿濑缝的那面过所旗，旗边的针脚磨得发白。我对着空关所说了一句：“旗钱，先付。”说完自己先笑了，老水夫也跟着笑。旗是布，潮不是。"

[[tracks.chapters.variants]]
key = "own_flag"
when = [{ kind = "flag", flag = "c13_main_mio_own_flag" }]
text = "夏末的能岛，关所的门上钉着一张新告示：从今往后，海上不许收帆别钱，不许卖过所旗，违者以海贼论。武吉前年已经被迁去了筑前，岛上只剩几个看房子的老水夫。武吉托人带来的口信是：“交了的旗，关白会还你一张文书；烧了的旗，海会记得。”老水夫把关所屋里那捆没卖出去的旗搬出来，最上面一面，是我当年在这间屋里写的“一条”，墨早褪成了灰。他问我：“姬君，旗不作数了，船还作数吧？”我袖子里还揣着阿濑缝的那面过所旗，旗边的针脚磨得发白。我对着空关所说了一句：“旗钱，先付。”说完自己先笑了，老水夫也跟着笑。旗是布，潮不是。"

# c10 终章：潮之扇。无 at；任何时刻只有一组落点可选；恰好一面 end 旗标。口头禅②第二次只在 abroad 的回复里。
# 扇子留在律法柱下的局（c13_main_mio_fan_left）不走这一章，由旁轨 main_mio_fan_left 的 f2 收尾并用 end_track 结束本轨道。
[[tracks.chapters]]
key = "c10_epilogue"
title = "潮之扇"
hint = "1590年8月以后，小田原开城的消息会传到平户，回平户等它。"
text = "小田原开城的消息传到平户，天下归了一家。我五十岁了，坐在平户的码头上，膝上放着那把桧扇，扇骨被海风磨得发亮，扇纸补过两回。港里的孩子们在赛小船，一个扎红白束发绳的女孩输了，嚷着要再比一回，嗓门比赢的那个还大。她不服气，跑过来盯着我的扇子：“婆婆，扇子上写的是什么？”我把扇子打开。这么多年，那首歌我在船上读过，在潮边读过，在弟弟的灯旁读过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，扇子只有这一把。"
cast = ["mio"]
speaker = "captain"
mood = "tender"
at = "hirado"
when = [{ kind = "date", from = [1590, 8, 10] }, { kind = "flag", flag = "c13_main_mio_fan_left", value = false }]

[[tracks.chapters.choices]]
key = "service"
text = "把扇子插在腰带里，去大坂教新天下的船手众认潮"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield" }]
hint = "你没有交出那面旗。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_service" }]
reply = "我的船挂着朱印旗，在内海运兵粮，从大坂到博多，一年跑四趟。船上总有几个新来的船手，手比心快，舵扳得太猛。那天过明石海峡，潮正转，一个年轻船手把舵往右死压，压得船身都歪了。我没骂他，走过去，连他的手带舵柄一起往左扳了一寸。船身一下就正了。他回头看我，脸红到耳根。我说潮转的时候别跟它较劲，让它推你一寸，你再还它一寸。后来他在舵柄上刻了一道浅浅的印子，谁问也不说是什么。扇子插在腰带里，扇骨硌着肋骨，硌了一下午。"

[[tracks.chapters.choices]]
key = "abroad"
text = "趁着北风，挂一条家的旗出平户"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_abroad" }]
hint = "你没有决定出海。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_abroad" }]
reply = "北风起的那天早上，我解了缆。桅顶那面一条家的旗被风扯得笔直，船头朝着琉球。那霸的港口里，没人问我的旗盖的是谁家的印，泊船的唐人只问我舱里有没有土佐的纸。再往南是吕宋，是暹罗，海上没有停止令，只有风和潮。那边的潮也是一天转四回，跟能岛城脚下一样，只是转得慢些，慢得叫人犯困。过宫古那一晚，我站在船头看西边的天，桧扇插在腰带里。舵手问往哪里走。我说：“再来一局。”他咧嘴一笑，把舵往南一扳。"

[[tracks.chapters.choices]]
key = "flagless"
text = "不挂旗了：在平户教孩子们认潮"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield", value = false }, { kind = "flag", flag = "c13_main_mio_edict_abroad", value = false }]
hint = "你的旗已经有了去处。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_flagless" }]
reply = "我把船上的旗杆卸了下来，劈了一半当柴，留一半插在码头的石阶边上量水。船不挂旗，照样出海，回来就泊在平户。码头上的孩子们管我叫看潮的婆婆，每天傍晚排成一排蹲在石阶上，看水线一寸一寸地退。那个扎红白束发绳的女孩学得最快，也最不服输。有一天她问我，扇子上的歌能不能教给她。我教了，一句一句。她背的时候不肯坐，非要站在石阶最下面一级，脚泡在水里，念错了就跺脚，溅我一身水。念对的那天，潮正好转了，她自己没看见，是我先看见的。"

[[tracks.chapters.choices]]
key = "late_abroad"
text = "还是走：没有旗，也能出海"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield", value = false }, { kind = "flag", flag = "c13_main_mio_edict_abroad", value = false }]
hint = "停止令那天，你已经替自己的旗定了去向。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_abroad" }]
reply = "我没挂旗就出了平户，往南去。桅顶空着，风照样从那里过，老舵手说船上少了一面旗，倒跑得快了。出港的时候，那个扎红白束发绳的女孩一路追到码头尽头，鞋跑掉了一只也不回去捡，两手拢在嘴边冲我喊：“下回我赢你！”我没回头，只把扇子举起来晃了晃。我七八岁在能岛滩上跟收钱的人抢着报数，大概也是这样冲人嚷的。船过了生月岛，回头已经看不见码头。我把扇子收回腰带，叫舵手往南。下回，那孩子大概真能赢我。"

[[tracks.chapters.variants]]
key = "v1_nobunaga"
when = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives" }]
text = "安土的天下定了，小田原开城的消息从安土传到平户。我五十岁了，坐在平户的码头上，膝上放着那把桧扇，扇骨被海风磨得发亮，扇纸补过两回。港里的孩子们在赛小船，一个扎红白束发绳的女孩输了，嚷着要再比一回，嗓门比赢的那个还大。她不服气，跑过来盯着我的扇子：“婆婆，扇子上写的是什么？”我把扇子打开。这么多年，那首歌我在船上读过，在潮边读过，在弟弟的灯旁读过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，扇子只有这一把。"

[[tracks.chapters.variants]]
key = "v2_abroad_wang"
when = [{ kind = "flag", flag = "c13_main_mio_edict_abroad" }, { kind = "flag", flag = "c13_main_mio_wangzhi_alive" }]
text = "小田原开城的消息传到平户，天下归了一家。我五十岁了，坐在平户的码头上，膝上放着那把桧扇，扇骨被海风磨得发亮，扇纸补过两回。王直当年在舟山的旧泊位，如今还有人替我留着，每年捎信来问我几时去。港里的孩子们在赛小船，一个扎红白束发绳的女孩输了，嚷着要再比一回。她不服气，跑过来盯着我的扇子：“婆婆，扇子上写的是什么？”我把扇子打开。这么多年，那首歌我在船上读过，在潮边读过，在弟弟的灯旁读过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，扇子只有这一把。"

