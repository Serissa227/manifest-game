# b10 户岛的刺客（见闻；守住幡多时改为中村）。
[[tracks.chapters]]
key = "b10_togashima"
title = "户岛的刺客"
hint = "1577年冬到来年2月，宇和海的渔船会把户岛的消息带到下田。"
go = { port = "shimoda_tosa" }
text = "冬天，宇和海来的渔船把消息带到下田：户岛上那位受了洗的一条殿，夜里被身边的旧臣砍了，命保住了，人却起不来了。岛上的渔家把他抬进小庙，庙里没有大夫，只有一个会念南蛮经的人。渔夫蹲在船头补网，说：“砍他的是跟了他十几年的人。他倒下去的时候，手里还攥着那串念珠。”"
stage = "rumor"
window = [[1577, 11, 1], [1578, 2, 28]]
at = "shimoda_tosa"
cast = ["ichijo_kanesada"]
