fail = { next = "c02_mimikawa", effects = [{ kind = "flag", flag = "c13_main_mio_act3" }], news = "堺的人说，土佐的姬君劝能岛这回别出海，村上武吉只回了一句：能岛的船，从来不看别人的炮。" }

