reply = "轮到我献歌，潮正在转，船底下的水一会儿往东拉，一会儿往西拉。那首歌我前一夜就在船上想好了，只等潮转。我站上船头念：　　满珠一颗，干珠一颗——　　潮转了，该我落子。　　神官听完，问我是哪一家的。祭礼完了，他把社里旧藏的一幅两岛图摹了一份给我，说这是海神的回礼。"
