# c01 第二次木津川口（H50 现场，本章不读结果）。第三幕开始：default 与每个选项设 act3。
[[tracks.chapters]]
key = "c01_iron_ships"
title = "铁做的船"
hint = "1578年11月中至年底在堺，九鬼家的大船横在木津川口。"
go = { port = "sakai" }
text = "初冬的大阪湾，九鬼嘉隆的六条大安宅船横在木津川口，比堺的寺塔还高。奈良来的僧人在码头上跟人说：“铁做的船，铳打不穿。寺里的日记都记上了。”可谁也没摸过。堺的铁匠铺日夜打铁板，说是九鬼家订的，码头边就堆着一摞，一块块带着锤印。能岛的小早又来了，船上还是一筐筐焙烙。武吉托人捎来一句话：“再烧一回，跟两年前一样。”我伸手敲了敲那摞铁板，九鬼家的船匠在旁边直嚷：“姬君别摸，那是我们主公的船皮。”声音发空。铁板是薄的，是包在船舷上的一层皮，船不是整条铁打的。可大船上的炮，比焙烙扔得远。船皮是铁的，船里坐的还是人。"
stage = "involve"
window = [[1578, 11, 15], [1578, 12, 31]]
at = "sakai"
cast = ["kuki_yoshitaka", "murakami_takeyoshi"]
speaker = "captain"
mood = "tense"
news = "木津川口那六条大船横了一冬，有条土佐的小早在码头上敲了敲铁板，说是空的。"

[tracks.chapters.default]
next = "c02_mimikawa"
effects = [{ kind = "flag", flag = "c13_main_mio_act3" }]
news = "堺的人都去看九鬼家的六条大船，说是铁皮包的，铳打不穿——奈良的和尚也这么说。"

[[tracks.chapters.choices]]
key = "night_raid"
text = "跟村上的小早，夜里去摸大船"
check = { attr = "command", base = 5, per = 8 }
next = "c02_mimikawa"
effects = [{ kind = "flag", flag = "c13_main_mio_act3" }, { kind = "fame", value = 3 }, { kind = "reputation", faction = "murakami", value = 3 }, { kind = "reputation", faction = "oda", value = -3 }]
reply = "我带着三条小早，贴着大船的船底摸过去。离得近了才看清，那船舷高得像城墙，焙烙得拴在绳子上甩着扔。甩到第四个，一条大船的帆烧着了，火把湾口映得通红。可天一亮，大船上的炮一齐响，村上的小早一条一条往外漂。回到堺，我带出去的三条船，只剩两条。"
fail = { next = "c02_mimikawa", effects = [{ kind = "flag", flag = "c13_main_mio_act3" }, { kind = "fame", value = 1 }], news = "木津川口那一夜，九鬼大船的炮先响了，一条土佐的小早没摸到跟前就被打退，船尾挨了一下。" }

[[tracks.chapters.choices]]
key = "sell_iron"
text = "替织田送一船铁板去鸟羽"
next = "c02_mimikawa"
