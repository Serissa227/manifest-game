reply = "我接过笔，写了“土佐一条”四个字，一个字占了两格。言继捋着胡子看了看，没叫我改，只说墨用得太费。本愿寺的使者凑过来嘀咕了一句“土佐也有钱”，被言继咳嗽一声堵了回去。"

