# 主线：一条澪（mio）·「潮之扇」（故事 2.0，A5 / E37 契约）
# 2026-11-12 Q03：每章补了 hint（目标文字，照本章的 at / when / window / deadline 写）与 go（去处，等于本章的 at；没有 at 的来信章不写 go）。改条件时请同步改 hint。
