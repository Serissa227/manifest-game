# a13 补陀落渡海：钉死的船。隐藏志向的伏笔（不点破）。
[[tracks.chapters]]
key = "a13_fudaraku"
title = "钉死的船"
hint = "1565年11月至来年正月在堺，那智有条船要出海。道德到六十、诗到四十，能多两种做法。"
go = { port = "sakai" }
text = "我从堺沿纪伊的海岸南下，到了那智山下的浜之宫。补陀洛山寺前的沙滩上北风刮得紧，停着一条小船，船上钉着一间木箱似的屋子，四角立着小小的鸟居，缠着白布。要往南海观音净土去的老僧进了屋，外头的人拿钉子把门钉死，我数到第十二颗就不数了。屋里留了三十天的米和水，一盏灯，灯油也是三十天的。拖船会把船拖到纲切岛，在那里砍断绳子。木板里的念经声一直没停。跟着他的小沙弥站在水边，脚泡在海里也不肯走：“师父说那边有观音的岛。……姬君，海上真有那样的岛吗？”小时候在足摺岬，我听老人讲过“补陀落东门”。拖船已经动了。"
stage = "involve"
window = [[1565, 11, 1], [1566, 1, 31]]
at = "sakai"
cast = ["mio"]
speaker = "captain"
mood = "mystic"
night = true
news = "那智浜之宫又送走了一条补陀落的渡海船，岸上的人说，有条土佐的小早一直在旁边看着。"

[tracks.chapters.default]
next = "a14_kanju"
