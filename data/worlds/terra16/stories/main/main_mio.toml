# o4 钟：母亲之死（终章）。到期未至，静默结束。
[[tracks.chapters]]
key = "o4_bell"
title = "钟"
hint = "1586年2月以后、年底以前回足摺的清水，庵里捎信来请你。"
go = { port = "shimizu_tosa" }
text = "兼定死了以后，母亲就不大说话了。庵里的老尼捎信到平户，说夫人这个冬天怕是过不去。我的船顶着北风走了二十天，到足摺的时候，崖上的樒开了白花。母亲躺在檐下，脸朝西，手里攥着念珠，攥得指节发白。老尼说她三天没念出声了，嘴一直在动。我跪到她身边，她睁开眼，看了我很久，像是在认一个离得很远的人。金刚福寺的钟响了，她的嘴唇跟着钟声动了一下。"
at = "shimizu_tosa"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1586, 2, 1] }]
deadline = [1586, 12, 31]
news = "足摺的渔家说，金刚福寺下头那间庵里的夫人过了，她女儿的船在崖下泊了七夜。"

[tracks.chapters.timeout]
next = "done"
effects = []
news = "足摺的渔家说，金刚福寺下头那间庵里的夫人过了，庵里的老尼照她的交代，没立碑。"

[[tracks.chapters.choices]]
key = "hold"
text = "握着她的手，替她念完"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_cape_end_hold" }]
reply = "我握着她的手，替她念，一声，一声。念到第一百零七声，她的手松开了。我停了一下，接着念了第一百零八声，念完才哭出来。老尼在旁边敲着小磬，一下也没乱。那串念珠，我替她放进了棺里，空着的那一处朝上。"

[[tracks.chapters.choices]]
key = "sea"
text = "把她的念珠放进崖下往南的水里"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_cape_end_sea" }]
reply = "葬礼以后，我把那串念珠带到崖下，等潮退。黑水从西南冲过来，在崖脚拐一个弯，往东北去。我把念珠放在水面上，它没有沉，被水推着，绕过崖角就看不见了。老尼在崖上看着，说夫人一辈子没坐过远船，这回算是坐了一回。"

[[tracks.chapters.choices]]
key = "vigil"
text = "照老尼转述的遗言办，我只守灵"
next = "done"
effects = [{ kind = "flag", flag = "rw_mio_cape_end_vigil" }]
reply = "老尼说夫人早交代过：不立碑，不请人，骨灰一半送回中村，一半撒在崖下。我照着办，守了七夜灵，每夜坐在檐下听崖下的水。第七夜，水声跟头一夜一模一样。我才知道，她这些年夜里听的，就是这个。"

[[tracks.chapters.variants]]
key = "recited"
when = [{ kind = "flag", flag = "rw_mio_cape_recited" }]
text = "兼定死了以后，母亲就不大说话了。庵里的老尼捎信到平户，说夫人这个冬天怕是过不去。我的船顶着北风走了二十天，到足摺的时候，崖上的樒开了白花。母亲躺在檐下，脸朝西，手里攥着念珠，攥得指节发白。老尼说她三天没念出声了，嘴一直在动。我跪到她身边，凑近了听，她念的不是佛号，是父亲那首辞世，舵的那一句，一遍又一遍。金刚福寺的钟响了，她停了一下，跟着钟声又接上。"

# ───────────── 旁轨（剧情增写 11-11，Claude）：唐·保罗（兼定受洗以后到死，与 b04—b06、b10、c08 相照而不重复） ─────────────
# 母本：奥古斯丁《忏悔录》（无缘无故的恶；后来白白得来的恩）、能乐《隅田川》（在念佛声里看见）；文化：南蛮的神与公家的空心，武家的冷与教中的赦；
# 张力：一个什么都不怕、不疼的人，把剩下的命全押给了一个神——澪恨他荒唐，又心疼他终于有了能哭、能疼的地方。不写成笑话，也不写成圣人。
# 入口：c13_main_mio_act2 + 1575-11-15（b07 以后）；五章，终章 next = done。变体读养成期 rw_mio_kane_ans_*（人死了去哪儿）、rw_mio_deer_*（鹿）与 HIST 的 c13_main_mio_ichijo_held。
# 史实：卡布拉尔 1575 年在丰后为兼定施洗；1577 年在户岛遇刺重伤（砍他的旧臣不点名）；巡察使范礼安 1581 年探望（TERRA16 记）；1585 年死。宗教人物照信众看自己的方式写。
