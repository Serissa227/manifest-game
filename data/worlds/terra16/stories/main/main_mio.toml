text = "小田原开城的消息传到平户，天下归了一家。七月里，从罗马回来的少年们捎来一句话——如今他们已经是青年了：那封没写收信人的信，交给了一个在罗马码头上画船的人。我五十岁了，坐在平户的码头上，两只手空着搁在膝上，腰带上那道印子这些年一直没磨掉。港里一个扎红白束发绳的女孩赛小船输了，不服气，跑过来，眼睛盯着我的腰：“婆婆，你这里怎么有一道白印子？”我说从前插过一把扇子，留在很远的地方了。她又问扇子上写的什么。这么多年，那首歌我在船上默过，在潮边默过，在弟弟的灯旁默过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，歌只有这一首。"

# ───────────── 旁轨（剧情增写 11-11，Claude）：岬上的庵（母亲大友夫人，第二幕家门倾覆以后到她死） ─────────────
# 母本：《平家物语·灌顶卷》大原御幸——家门覆灭后，建礼门院在大原的庵里念佛，来访者问起，她讲自己经过的六道，最后在念佛声里死去；
# 文化：净土的慈悲与无常，物哀；张力：替亡夫念了三十年佛的人，到最后才听见丈夫自己留下的话。庵放在足摺的金刚福寺下头（“补陀落东门”）。
# 入口：c13_main_mio_act2（b01 必设）+ 日期；四章，终章 next = done。读养成期 rw_mio_box_*（砚箱）、主线 b03 的 c13_main_mio_poem_in_fan 与 HIST 守住幡多的 c13_main_mio_ichijo_held（只在变体）。
# 秘密：b03 已经揭开“不是狂疾”；这里只到母亲说出“那一夜，他是醒着的”与那颗珠子的去处，不点名任何人。
[[tracks]]
key = "main_mio_rw_cape"
name = "岬上的庵"
kind = "main"
start = "o1_cape"
auto = true
cast = ["mio"]

# o1 头一回去庵里：家门倾覆（或守住）以后，母亲搬去足摺。变体 held 读 HIST 守住幡多。
[[tracks.chapters]]
key = "o1_cape"
title = "岬上的庵"
hint = "1576年3月以后、1577年2月底以前，绕到足摺岬下的清水，去岬上的庵里坐坐。"
go = { port = "shimizu_tosa" }
text = "开春，我从下田绕到足摺。母亲搬出中村御所以后，就住在金刚福寺下头的一间小庵里，庵后是崖，崖下是那道往南流的黑水。庵门口站着两个长宗我部家的足轻，看见我的船旗，客客气气让开了路，一个还替我掀起门帘。母亲正跪在檐下摘樒，篮子里铺着一层青叶，指头染得发绿。她头上的布巾旧了，人比我记得的小了一圈。看见我，她先问的不是我，是兼定：“户岛冷不冷？那边的人给不给他炭？”"
at = "shimizu_tosa"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "c13_main_mio_act2" }, { kind = "date", from = [1576, 3, 1] }]
deadline = [1577, 2, 28]
news = "土佐清水的人说，一条家的姬君把船泊在足摺岬下头，上崖去看了住在庵里的母亲。"

[tracks.chapters.timeout]
next = "o2_crosses"
effects = []
news = "足摺的渔家说，金刚福寺下头那间庵里的老尼，这一年没等来船，倒是长宗我部的足轻按月送米。"

[[tracks.chapters.choices]]
key = "rice"
text = "把船上的米卸一半给庵里"
requires = [{ kind = "cash", ge = 200 }]
hint = "船上的钱，这会儿凑不出这半舱米。"
next = "o2_crosses"
effects = [{ kind = "cash", value = -200 }, { kind = "affinity", person = "mio_mother", value = 4 }, { kind = "flag", flag = "rw_mio_cape_rice" }]
reply = "我叫水夫把半舱米扛上崖。母亲没拦，只叫他们放在庵后，别挡着佛前的路。那两个足轻也帮着扛了几袋，扛完站在门口，不肯进来喝水。母亲说长宗我部的人待她很周到，每月送一回米，多的她都转给了寺里。“你送的这些，我也转，”她说，“你别恼。”"

[[tracks.chapters.choices]]
key = "bungo"
text = "请她上船，去府内投舅舅"
next = "o2_crosses"
effects = [{ kind = "flag", flag = "rw_mio_cape_declined" }]
reply = "我说舅舅在府内，宅子大，比这里暖和。母亲把樒叶一片片理齐：“义镇那里有南蛮的寺，钟声跟这里的不一样。”她抬头看了看崖上的寺，“我在这里，听得见金刚福寺的钟，也听得见底下的水，够了。”我没再劝。临走她塞给我一把樒枝，叫我插在船头。"

[[tracks.chapters.choices]]
key = "vigil"
text = "留一夜，陪她做晚课"
next = "o2_crosses"
effects = [{ kind = "affinity", person = "mio_mother", value = 4 }, { kind = "flag", flag = "rw_mio_cape_vigil" }]
reply = "那一夜我留在庵里。母亲做晚课，我跪在她后头，跟着念。崖下的水声一阵一阵涌上来，念佛的声音就一阵一阵被压下去。念到一半她停了，侧着耳朵听了一会儿。我问她听什么。她说：“风。”然后接着念。庵里的灯油不多，念完就熄了，黑里她伸手摸了摸我的头，像我还小。"

[[tracks.chapters.variants]]
key = "held"
when = [{ kind = "flag", flag = "c13_main_mio_ichijo_held" }]
text = "开春，我从下田绕到足摺。幡多守住了，中村御所门口又挂起了藤纹的幔幕，母亲却没有回去，还是住在金刚福寺下头那间小庵里，庵后是崖，崖下是那道往南流的黑水。“御所里那么多人伺候他，用不着我。”母亲正跪在檐下摘樒，篮子里铺着一层青叶，指头染得发绿。她头上的布巾旧了，人比我记得的小了一圈。看见我，她先问的不是我，是兼定：“御所的炭够不够？那孩子怕冷，又不肯说。”"

# o2 来信：宗麟（1578 年受洗）与兼定都投了南蛮的神。不带地点。变体读养成期“南蛮的神收谁”那封回信（互斥）。
[[tracks.chapters]]
key = "o2_crosses"
title = "两个十字"
hint = "1578年9月中以后，足摺那边会有一封代笔的信来。"
text = "秋天，母亲的信追到我船上，是庵里的老尼代笔，母亲口述，末尾才是她自己的几个字。丰后来了人，说义镇在臼杵受了洗，取了个南蛮名字，跟兼定一样。“一个是我的弟弟，一个是我的儿子，都去了那个神那里。我坐在阿弥陀佛前头，倒成了一家人里最后一个。”这一句，代笔的老尼大概不敢写，字抖得厉害。母亲自己的那几个字在最后：“他们的神收不收我？我又不要。”"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1578, 9, 15] }]

[[tracks.chapters.choices]]
key = "letter"
text = "回信抄兼定说过的话给她"
next = "o3_bead"
effects = [{ kind = "affinity", person = "mio_mother", value = 3 }, { kind = "affinity", person = "ichijo_kanesada", value = 2 }, { kind = "flag", flag = "rw_mio_cape_kane" }]
reply = "我把兼定寄来的一封信抄给她，抄的是那几行：他从小摔了不疼，受洗那天水浇在头上，头一回觉得凉。“母上若是问起，就说我如今怕冷了。”信寄走两个月，老尼代笔回信：母亲读完，叫人给他送了两捆炭。"

[[tracks.chapters.choices]]
key = "ledger"
text = "回信：佛要不收，是佛欠你的账"
next = "o3_bead"
effects = [{ kind = "affinity", person = "mio_mother", value = 3 }, { kind = "flag", flag = "rw_mio_cape_ledger" }]
reply = "我写：弥陀收不收你，我答不上来；可你念了这些年，佛要是不收，那是佛欠你的账。账我会算，这一笔，我替你记着。母亲回信只有她自己的字：“胡说。”底下又添了一个字：“记。”"

[[tracks.chapters.choices]]
key = "visit"
text = "不回信，开船去足摺"
next = "o3_bead"
effects = [{ kind = "affinity", person = "mio_mother", value = 4 }, { kind = "flag", flag = "rw_mio_cape_came" }]
reply = "信我没回，船直接开去了足摺。到了庵门口，母亲正坐在檐下晒经，看见我，愣了一下：“信呢？”我说我就是信。她笑了，笑得咳起来，咳完了说：“你这脾气，像他。”她说的是谁，我没问。"

[[tracks.chapters.variants]]
key = "amida"
when = [{ kind = "flag", flag = "rw_mio_creed_amida" }]
