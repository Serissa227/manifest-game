go = { port = "hakata" }
text = "我从博多往东，绕到长府外海。忌宫的祭礼船在满珠、干珠两座小岛外绕行，船头挂着白幡，岛上不许人登。海面平得很，潮却在两岛之间转。神官回头扫了一眼跟着的船：“船上的人，不许出声。”一个老渔夫划着小船贴到我旁边，压着嗓子：“潮满珠在那边，潮干珠在这边。别指，指了要倒霉。”说完他自己拿下巴朝那边点了一下。绕到第二圈，两岛之间的水翻了向，祭船的船头被推得往一边偏，满船的白幡一齐倒向东边。那道翻过来的水线，我第一个看见。"
