# f1 那以后：腰上空了。无 at；基础正文 = 没赶上会议；变体先读 C11 的判决，再读会议开过（判词交给了某一家）。
# 门槛另要 c13_main_mio_after_seen 为假（主线 c07 已经走过的局不再出这一章）；期限 1590-08-01，到期静默进 f2，终章照样由 f2 收。
[[tracks.chapters]]
key = "f1_after"
title = "腰上那道印子"
hint = "1583年10月以后，回程路上靠一次港就行。"
text = "秋天，船出了雾，泊进回程的头一个港口。缆还没系好，我照老习惯往左腰一按，按了个空。扇子留在雾那边一根柱子的脚下了，扇骨朝里，是我自己放的。腰带是旧的，扇骨插了快三十年的地方磨出一道发亮的印子，比别处薄，指甲一刮就知道。码头上有人在讲亚速尔那个夏天，讲往西去的船，讲得比我知道的还热闹。舵手说，回了平户，去町里另买一把，堺来的，扇面泥金。我说不用。歌我背得出，一个字也没丢，往后只是不能用手翻开了。"
cast = ["mio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_mio_fan_left" }, { kind = "flag", flag = "c13_main_mio_after_seen", value = false }, { kind = "location", port = true }]
deadline = [1590, 8, 1]

[tracks.chapters.timeout]
next = "f2_epilogue"
effects = []

[[tracks.chapters.choices]]
key = "song"
text = "把那首歌抄在舱里的板壁上，谁问都不解释"
next = "f2_epilogue"
effects = [{ kind = "skill", skill = "poetry", value = 10 }]
reply = "我凭记性一行一行往板壁上抄。木纹横着走，字只好竖着挤，抄到银河那一句，墨干了，又研了一回。抄完，我在最边上添了半句自己的：歌留在柱下，人回到潮边。第二天舵手在那块板壁前站了很久，回头问我添的是什么意思。我说是抄错的地方，别管它。"

[[tracks.chapters.choices]]
key = "belt"
text = "不换腰带，那道印子就留着"
next = "f2_epilogue"
effects = []
reply = "舵手不知从哪个港口换来一条新腰带，叠好了放在我的箱盖上。我没系，还系那条旧的。印子在左腰，年头久了，颜色比周围浅一截。夜里在舱里睡不着，我拿拇指在那道印子上来回摸，像摸一道快长好的疤。摸着摸着，就听见潮转了。"

[[tracks.chapters.choices]]
key = "tell_ushio"
text = "回能岛去，把扇子的去处讲给汐听"
next = "f2_epilogue"
effects = [{ kind = "affinity", person = "ushio", value = 5 }]
reply = "汐听完，把梭子往网眼里一插：“扇子给了外人，你倒舍得。”我说不是给，是留。她哼了一声，过了一会儿又问那根柱子朝哪边。我说朝东。她点点头，像是这样就放心了，低头接着补网。我要走的时候，她从网堆里扯出一截刚编好的细绳扔给我：“腰上空着难看，先拿这个系着。”"

[[tracks.chapters.variants]]
key = "v1_verdict_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "秋天，船出了雾，泊进回程的头一个港口。那边的判词说门要合上，一路上海草在船尾后面又铺满了，像那条缝从没开过。往后再没有船去得了那根柱子，柱子脚下那把扇子，只剩柱子自己看着。缆还没系好，我照老习惯往左腰一按，按了个空。腰带是旧的，扇骨插了快三十年的地方磨出一道发亮的印子，比别处薄，指甲一刮就知道。舵手说，回了平户，去町里另买一把，堺来的，扇面泥金。我说不用。歌我背得出，一个字也没丢，往后只是不能用手翻开了。"

[[tracks.chapters.variants]]
key = "v2_verdict_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "秋天，船出了雾，泊进回程的头一个港口。金板上刻下的是航路要开，往后谁的船都去得了那边，去了，都看得见律法柱脚下那把扇子。十王不许人动它，看一眼总是许的。缆还没系好，我照老习惯往左腰一按，按了个空。腰带是旧的，扇骨插了快三十年的地方磨出一道发亮的印子，比别处薄，指甲一刮就知道。港口酒馆里的人缠着我讲那块金板，我讲了半夜，扇子的事一个字没提。歌我背得出，往后只是不能用手翻开了。"

[[tracks.chapters.variants]]
key = "v3_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "秋天，船出了雾，泊进回程的头一个港口。那场会最后把那片海交到了谁手里，我记得清清楚楚，往后谁问都不说。缆还没系好，我照老习惯往左腰一按，按了个空。扇子留在雾那边一根柱子的脚下了，扇骨朝里，是我自己放的。腰带是旧的，扇骨插了快三十年的地方磨出一道发亮的印子，比别处薄，指甲一刮就知道。舵手说，回了平户，去町里另买一把，堺来的，扇面泥金。我说不用。歌我背得出，一个字也没丢，往后只是不能用手翻开了。"

# f2 终章：隔水的歌。无 at；落点、门槛与效果同 c10（恰好一面 end 旗标）；口头禅②第二次只在 abroad 的回复里。
# 门槛另要 c13_main_mio_fan_left：f1 到期以后别的局里这一章也停着不出。
[[tracks.chapters]]
key = "f2_epilogue"
title = "隔水的歌"
hint = "1590年8月以后，东边的消息会传到平户，人要在平户。"
text = "小田原开城的消息传到平户，天下归了一家。我五十岁了，坐在平户的码头上，两只手空着搁在膝上，腰带上那道印子这些年一直没磨掉。港里的孩子们在赛小船，一个扎红白束发绳的女孩输了，嚷着要再比一回，嗓门比赢的那个还大。她不服气，跑过来，眼睛盯着我的腰：“婆婆，你这里怎么有一道白印子？”我说从前插过一把扇子，留在很远的地方了。她又问扇子上写的什么。这么多年，那首歌我在船上默过，在潮边默过，在弟弟的灯旁默过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，歌只有这一首。"
cast = ["mio"]
speaker = "captain"
mood = "tender"
at = "hirado"
when = [{ kind = "date", from = [1590, 8, 10] }, { kind = "flag", flag = "c13_main_mio_fan_left" }]

[[tracks.chapters.choices]]
key = "service"
text = "去大坂，教新天下的船手众认潮"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield" }]
hint = "那面旗你没交出去，大坂的文书上就没有你的名字。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_service" }, { kind = "end_track", track = "main_mio" }]
reply = "我的船挂着朱印旗，在内海运兵粮，从大坂到博多，一年跑四趟。船上总有几个新来的船手，手比心快，舵扳得太猛。那天过明石海峡，潮正转，一个年轻船手把舵往右死压，压得船身都歪了。我没骂他，走过去，连他的手带舵柄一起往左扳了一寸。船身一下就正了。他回头看我，脸红到耳根。我说潮转的时候别跟它较劲，让它推你一寸，你再还它一寸。后来他在舵柄上刻了一道浅浅的印子，谁问也不说是什么。我看见了，没问，手往自己左腰上摸了一下。"

[[tracks.chapters.choices]]
key = "abroad"
text = "趁着北风，挂起一条家的旗，出平户往南"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_abroad" }]
hint = "停止令那天，你没有说要往海外去。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_abroad" }, { kind = "end_track", track = "main_mio" }]
reply = "北风起的那天早上，我解了缆。桅顶那面一条家的旗被风扯得笔直，船头朝着琉球。那霸的港口里，没人问我的旗盖的是谁家的印，泊船的唐人只问我舱里有没有土佐的纸。再往南是吕宋，是暹罗，海上没有停止令，只有风和潮。那边的潮也是一天转四回，跟能岛城脚下一样，只是转得慢些，慢得叫人犯困。过宫古那一晚，我站在船头看西边的天，手按着腰带上那道印子。舵手问往哪里走。我说：“再来一局。”他咧嘴一笑，把舵往南一扳。"

[[tracks.chapters.choices]]
key = "flagless"
text = "不挂旗了，留在平户教孩子们看潮"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield", value = false }, { kind = "flag", flag = "c13_main_mio_edict_abroad", value = false }]
hint = "你在能岛已经替那面旗拿了主意。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_flagless" }, { kind = "end_track", track = "main_mio" }]
reply = "我把船上的旗杆卸了下来，劈了一半当柴，留一半插在码头的石阶边上量水。船不挂旗，照样出海，回来就泊在平户。码头上的孩子们管我叫看潮的婆婆，每天傍晚排成一排蹲在石阶上，看水线一寸一寸地退。那个扎红白束发绳的女孩学得最快，也最不服输。有一天她问我，那首歌能不能教给她。我教了，一句一句。她背的时候不肯坐，非要站在石阶最下面一级，脚泡在水里，念错了就跺脚，溅我一身水。念对的那天，潮正好转了，她自己没看见，是我先看见的。"

[[tracks.chapters.choices]]
key = "late_abroad"
text = "还是走，没有旗也出海"
requires = [{ kind = "flag", flag = "c13_main_mio_edict_yield", value = false }, { kind = "flag", flag = "c13_main_mio_edict_abroad", value = false }]
hint = "旗的去向，能岛那天就定下了。"
next = "done"
effects = [{ kind = "flag", flag = "c13_main_mio_done" }, { kind = "flag", flag = "c13_main_mio_end_abroad" }, { kind = "end_track", track = "main_mio" }]
reply = "我没挂旗就出了平户，往南去。桅顶空着，风照样从那里过，老舵手说船上少了一面旗，倒跑得快了。出港的时候，那个扎红白束发绳的女孩一路追到码头尽头，鞋跑掉了一只也不回去捡，两手拢在嘴边冲我喊：“下回我赢你！”我没回头，只把手举起来晃了晃。我七八岁在能岛滩上跟收钱的人抢着报数，大概也是这样冲人嚷的。船过了生月岛，回头已经看不见码头。我把手放下来，按在腰带那道印子上，叫舵手往南。下回，那孩子大概真能赢我。"

[[tracks.chapters.variants]]
key = "v1_nobunaga"
when = [{ kind = "flag", flag = "h54_honnoji_nobunaga_survives" }]
text = "安土的天下定了，小田原开城的消息从安土传到平户。我五十岁了，坐在平户的码头上，两只手空着搁在膝上，腰带上那道印子这些年一直没磨掉。港里的孩子们在赛小船，一个扎红白束发绳的女孩输了，嚷着要再比一回，嗓门比赢的那个还大。她不服气，跑过来，眼睛盯着我的腰：“婆婆，你这里怎么有一道白印子？”我说从前插过一把扇子，留在很远的地方了。她又问扇子上写的什么。这么多年，那首歌我在船上默过，在潮边默过，在弟弟的灯旁默过，从没念出声。这一回我念了出来。歌里说的是银河这边与那边，中间隔着一条看不见的水路，有人在这边等潮。女孩听完，皱着眉想了一会儿，说：“那游过去不就行了。”旁边赢了的男孩笑她，她踢了他一脚。旗换过好几面，歌只有这一首。"

[[tracks.chapters.variants]]
key = "v2_abroad_wang"
when = [{ kind = "flag", flag = "c13_main_mio_edict_abroad" }, { kind = "flag", flag = "c13_main_mio_wangzhi_alive" }]
