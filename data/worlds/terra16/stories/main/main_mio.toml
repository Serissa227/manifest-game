# c06 黑暗之海（1583 汇合，H53 现场）。default = absent。
[[tracks.chapters]]
key = "c06_dark_sea"
title = "亚速尔以西"
hint = "1583年4月至9月赶到亚速尔的安格拉，从日本走要大半年。听说要进西边的海草，得带着醒过来的《翠玉录》。"
go = { port = "angra" }
text = "夏天的安格拉，特塞拉岛的港口里全是烟。圣克鲁斯侯爵的舰队刚在岛东登了岸，法国兵和唐·安东尼奥的人往山里退。我的船在海上走了大半年才到这里，泊在一群西班牙大船的影子里。侯爵的军官挨船传令：“没有许可，任何船不准往西。西边什么也没有。”码头上一个葡萄牙老领航啐了一口：“什么也没有？那每年夏天往西去的船，都去哪儿了？”往西半天的海上，海草一层层浮上来，风停了，罗经的针在盘里乱转。我把桧扇打开，放在船头的罗经旁边，扇骨上的歌被月光照得发白。针转到最后，停在扇子指的方向上，不是北。七夕那夜隔着白绢递纸，也是这样看不见对面。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["mio", "alvaro_de_bazan"]
speaker = "captain"
mood = "mystic"
night = true
news = "安格拉的人说，圣克鲁斯侯爵拿下特塞拉的那个夏天，西边海草边上来过一条日本的小船，船头站着个拿扇子的女人。"

[tracks.chapters.default]
next = "c07_after"
effects = [{ kind = "flag", flag = "c13_main_mio_absent" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }]
news = "特塞拉岛一仗打完，亚速尔以西的海上全是船，有人说看见海草在夜里发光。"

[[tracks.chapters.choices]]
key = "cross"
text = "照《翠玉录》抄片上那一句，把船开进海草里"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "你手里没有能让海草让路的东西。"
next = "c07_after"
effects = [{ kind = "flag", flag = "c13_main_mio_crossed" }, { kind = "memory", memory = "mem-main_mio-c06", title = "海草里的扇子" }]
reply = "我照抄片上那一句念了一遍，念得很慢。海草先是不动，后来像有人在底下拨，一层一层往两边让，让出一道缝，刚够一条小早过去。我回头看，安格拉的灯一盏一盏灭了。扇子上的歌还白着。船头进了缝。过去了。"

[[tracks.chapters.choices]]
key = "turn_back"
text = "掉头：这片海，今年不是我的"
next = "c07_after"
effects = [{ kind = "flag", flag = "c13_main_mio_turned_back" }, { kind = "memory", memory = "mem-main_mio-c06", title = "海草里的扇子" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }]
reply = "我把扇子合上，叫人掉转船头。舵手松了一口气，没敢让我听见。回程的风来得很快，一下子鼓满了帆，像有人在背后推。我没回头。到了安格拉，那个葡萄牙老领航在码头上问我看见了什么，我说：海草。"

[[tracks.chapters.choices]]
key = "wait_fog"
text = "在海草边上等一夜，看雾开不开"
check = { attr = "astronomy", base = 20, per = 7 }
next = "c07_after"
effects = [{ kind = "flag", flag = "c13_main_mio_turned_back" }, { kind = "skill", skill = "astral_navigation", value = 10 }, { kind = "memory", memory = "mem-main_mio-c06", title = "海草里的扇子" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }]
reply = "雾没有开。可半夜雾薄的那一刻，西边低空露出两颗挨得很近的亮星，一黄一白，像挂在同一根竿上的两盏灯。我拿炭笔把它们的位置描在扇子背面，刚描完，雾又合上了。天亮以后，我叫人掉了头。"
fail = { next = "c07_after", effects = [{ kind = "flag", flag = "c13_main_mio_turned_back" }, { kind = "memory", memory = "mem-main_mio-c06", title = "海草里的扇子" }, { kind = "flag", flag = "c13_main_mio_atlantis_over" }], news = "安格拉的人说，有条日本的小船在西边海草边上等了一夜，雾一夜没散，天亮时它掉头回来了。" }

[[tracks.chapters.variants]]
key = "rw_chidori"
when = [{ kind = "flag", flag = "rw_mio_chidori_dove" }, { kind = "flag", flag = "c13_main_mio_dragon_met", value = false }, { kind = "flag", flag = "c13_main_mio_fudaraku_seen", value = false }]
text = "夏天的安格拉，特塞拉岛的港口里全是烟。圣克鲁斯侯爵的舰队刚在岛东登了岸，法国兵和唐·安东尼奥的人往山里退。我的船在海上走了大半年才到这里，泊在一群西班牙大船的影子里。侯爵的军官挨船传令：“没有许可，任何船不准往西。西边什么也没有。”码头上一个葡萄牙老领航啐了一口：“什么也没有？那每年夏天往西去的船，都去哪儿了？”往西半天的海上，海草一层层浮上来，风停了，罗经的针在盘里乱转。海草底下有多深，谁也说不上来，千鸟要是在船上，头一句准问：在几寻？我把桧扇打开，放在船头的罗经旁边，扇骨上的歌被月光照得发白。针转到最后，停在扇子指的方向上，不是北。七夕那夜隔着白绢递纸，也是这样看不见对面。"

[[tracks.chapters.variants]]
key = "a_dragon_fudaraku"
when = [{ kind = "flag", flag = "c13_main_mio_dragon_met" }, { kind = "flag", flag = "c13_main_mio_fudaraku_seen" }]
text = "夏天的安格拉，特塞拉岛的港口里全是烟。圣克鲁斯侯爵的舰队刚在岛东登了岸，法国兵和唐·安东尼奥的人往山里退。我的船在海上走了大半年才到这里，泊在一群西班牙大船的影子里。港口里有一条船的桅顶挂着一面旗，旗上一条咬住自己尾巴的龙，跟小浜那枚戒指上的一样。侯爵的军官挨船传令：“没有许可，任何船不准往西。西边什么也没有。”码头上一个葡萄牙老领航啐了一口：“什么也没有？那每年夏天往西去的船，都去哪儿了？”往西半天的海上，海草一层层浮上来，风停了，罗经的针在盘里乱转。这片海跟那智的海一样，往一个说不出名字的地方流。我把桧扇打开，放在船头的罗经旁边。针转到最后，停在扇子指的方向上，不是北。七夕那夜隔着白绢递纸，也是这样看不见对面。"

