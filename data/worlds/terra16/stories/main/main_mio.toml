text = "追到我手里的是一封宁波来的谢帖，红纸，折痕压得笔直。王直受了封，朝廷许了互市，字是火长代写的，比他本人客气得多。信里没提官职，只问了一句：土佐的潮，这一年可还准？随帖来的还有弥七的一句口信，他照旧不肯写字，船头替他转述：“船主说：姑娘的潮看得准。”我留送帖的船头吃了顿饭，问了一晚上宁波港里的泊钱，一条唐船几文，一条倭船几文。"

