[[tracks.chapters.variants]]
key = "a3_asked"
when = [{ kind = "flag", flag = "rw_lieve_candles_asked" }]
text = "母亲是在一个星期五的下午走的，太阳还没落。她走以前醒过来一回，让莉芙扶她坐起来，看了看窗台。窗台那一角空着。“几点了？”她问。莉芙说快五点了。母亲点点头，像在算什么，算完了，说：“还来得及。”她没说来得及做什么，就又躺下了。屋里很静，猫趴在床脚，一动不动。莉芙想起上船那天母亲扣着她的扣子说的话：我信说对一个字。柜子里有蜡烛，枕头底下还压着那封黑蜡封的信。"

[[tracks.chapters.choices]]
key = "light"
text = "太阳落山以前，点上两根"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_candles_end_lit" }]
reply = "她在太阳落山以前点上两根蜡烛，放在窗台那一角，手掌在火上拢了三下。她不知道该念什么，就什么也没念。火苗直直的，屋里一点风也没有。母亲没有再睁眼，可是嘴角松开了，像终于对上了一笔账。"

[[tracks.chapters.choices]]
key = "name"
text = "从枕头底下拿出那封信，拆开"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_candles_end_name" }]
reply = "信里只有一行字，几个字母，从右往左写，她念不出来，不是她学过的任何一种话。她看了很久，把它记住，像记一个价钱，然后把信凑到火上。纸烧完以前她才看见，那几个字母底下，母亲用很小的葡萄牙文注了一句：我母亲的名字。"

[[tracks.chapters.choices]]
key = "sit"
text = "什么也不点，握着她的手坐到天黑"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_candles_end_sat" }]
reply = "她没有点蜡烛，也没有拆信，只是坐着，握着母亲的手，看窗外的光一点一点退下去。天黑透的时候，对面教堂敲了钟。母亲一辈子都在说对每一个字，最后这一个钟头，她什么也不用说了。"

# ───────────── 旁轨（2026-11-12 剧情增写）：圆规（普朗坦与拜因斯，两种信走到头） ─────────────
# 母本：普朗坦自己的一生（国王出钱的多语圣经 1568—72、西班牙之怒里被兵勒索、1583 年去莱顿、1589 年死在星期五市场边的印坊）与他的印记：握着圆规的手，“劳作与恒心”；
#       拜因斯 1575 年死在安特卫普。照史料写，不编私情；兵进印坊几回、勒了多少，用传闻口吻。
#       文化：国王的印刷商与“爱之家”；热烈的信与小心的体面；张力：圆规的一只脚扎在纸上给人看，另一只走得再远也要回来——他死的时候，哪一本账跟他走。
# 入口：m1—m3 用 c13_main_lieve_act2，m4 用 c13_main_lieve_act3，各加日期；各章无 at。
# 读养成期旗标：rw_lieve_lied_for_plantin / told_bijns / told_clerk（人物线 C 书记官的问话）、book_bijns（两本书）；读“炉灰”h6 的 rw_lieve_ashes_grain_*。
# 本轨设：rw_lieve_compass_*、rw_lieve_bijns_*，给本轨 m4 的变体读。
[[tracks]]
key = "main_lieve_rw_compass"
name = "圆规"
kind = "main"
start = "m1_polyglot"
auto = true
cast = ["lieve"]

[[tracks.chapters]]
key = "m1_polyglot"
title = "国王的圣经"
text = "九月，普朗坦先生的印坊里十几台压机一起转，印的是国王出钱的那部大圣经，一页上并排五种文字：希伯来文、希腊文、拉丁文、阿拉米文、叙利亚文。国王的钱一向晚到，纸钱却要现付。他来找莉芙，帽子拿在手里：“小姐，国王的圣经，要借一个兑换商的钱才印得完。”他说完笑了一下，又说，“印坊后面那间小屋，这几年也没闲着。”她听懂了：同一个印坊，一边印国王的经，一边印爱之家的书。"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1570, 9, 1] }]

[[tracks.chapters.variants]]
key = "a1_lied"
when = [{ kind = "flag", flag = "rw_lieve_lied_for_plantin" }]
text = "九月，普朗坦先生的印坊里十几台压机一起转，印的是国王出钱的那部大圣经，一页上并排五种文字：希伯来文、希腊文、拉丁文、阿拉米文、叙利亚文。国王的钱一向晚到，纸钱却要现付。他来找莉芙，帽子拿在手里：“小姐，国王的圣经，要借一个兑换商的钱才印得完。”他进门先说的却是另一件事：“小姐十五岁那年在北廊替我报过一个汇率，那一笔，我还没还。”他说完笑了一下，又说，“印坊后面那间小屋，这几年也没闲着。”她听懂了：同一个印坊，一边印国王的经，一边印爱之家的书。"

[[tracks.chapters.variants]]
key = "a2_bijns"
when = [{ kind = "flag", flag = "rw_lieve_told_bijns" }]
text = "九月，普朗坦先生的印坊里十几台压机一起转，印的是国王出钱的那部大圣经，一页上并排五种文字：希伯来文、希腊文、拉丁文、阿拉米文、叙利亚文。国王的钱一向晚到，纸钱却要现付。他来找莉芙，帽子拿在手里：“小姐，国王的圣经，要借一个兑换商的钱才印得完。”拜因斯女士当年那张担保的纸条，他后来还是知道了，说他欠那个老太太一条命，可她一辈子没进过他后面那间小屋。他说完笑了一下，又说，“印坊后面那间小屋，这几年也没闲着。”她听懂了：同一个印坊，一边印国王的经，一边印爱之家的书。"

[[tracks.chapters.variants]]
key = "a3_clerk"
when = [{ kind = "flag", flag = "rw_lieve_told_clerk" }]
text = "九月，普朗坦先生的印坊里十几台压机一起转，印的是国王出钱的那部大圣经，一页上并排五种文字：希伯来文、希腊文、拉丁文、阿拉米文、叙利亚文。国王的钱一向晚到，纸钱却要现付。他来找莉芙，帽子拿在手里：“小姐，国王的圣经，要借一个兑换商的钱才印得完。”他在门槛上站了一会儿才进来。十四年前查印坊的那一个月，他没让她进后面那间小屋，两个人都记得。他说完笑了一下，又说，“印坊后面那间小屋，这几年也没闲着。”她听懂了：同一个印坊，一边印国王的经，一边印爱之家的书。"

[[tracks.chapters.choices]]
key = "lend"
text = "借给他，利息照国王借钱的规矩算"
next = "m2_bijns"
requires = [{ kind = "cash", ge = 2000 }]
hint = "国王的圣经要的纸钱，你的钱箱这会儿垫不起。"
effects = [{ kind = "cash", value = -2000 }, { kind = "flag", flag = "rw_lieve_compass_lent" }]
reply = "她借了，利息照国王借钱的规矩算，十二分。普朗坦先生签借据时手很稳，签完在落款旁边画了一把小圆规：“国王付了，我就付。”国王后来付了一部分，晚了三年。他把那一部分原样转给她，一个斯图弗也没扣，还附了一部刚装订好的样书，五种文字并排。"

[[tracks.chapters.choices]]
key = "paper"
text = "只借后面那间小屋要用的纸钱"
next = "m2_bijns"
requires = [{ kind = "cash", ge = 300 }]
hint = "连一令纸的钱，你这会儿都拿不出来。"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "rw_lieve_compass_paper" }]
reply = "“国王的圣经，国王自己付。”她说，“后面那间小屋的纸，我来出。”普朗坦先生看着她，看了很久，把帽子戴回头上：“小姐，你比我想的还会分账。”那笔纸钱他没写借据。往后每年春天，她门口都会多出一包没有书名页的书，拿布包着，捆书的绳打的是装订匠的结。"

[[tracks.chapters.choices]]
key = "refuse"
text = "不借：两本账，我只认一本"
next = "m2_bijns"
effects = [{ kind = "flag", flag = "rw_lieve_compass_refused" }]
reply = "“两本账，我只认一本。”她说，“国王那一本，你找国王。”他没有恼，点点头，说这一句他听拜因斯女士讲过，原话差不多。走到门口他又回头：“小姐，你家里也有两本。”她没有回答。门关上以后，她想起地窖，想起父亲用红字记的那一本。"

[[tracks.chapters]]
key = "m2_bijns"
title = "叠句的最后一节"
text = "四月，安娜·拜因斯死了，八十多岁。圣母大教堂里给她做的弥撒不大，来的多是她教过的女孩，如今都做了母亲，有的已经做了祖母。棺材上盖着一块素布，没有花边。莉芙站在后排，看见普朗坦先生也来了，站在柱子后面，帽子拿在手里，一直没有往前走。散场时他从她身边过，低声说：“她骂了我二十年，我一句也没回。今天想回一句，没人听了。”"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1575, 4, 15] }]

[[tracks.chapters.variants]]
key = "a1_book"
when = [{ kind = "flag", flag = "rw_lieve_book_bijns" }]
text = "四月，安娜·拜因斯死了，八十多岁。圣母大教堂里给她做的弥撒不大，来的多是她教过的女孩，如今都做了母亲，有的已经做了祖母。棺材上盖着一块素布，没有花边。那本叠句集跟着莉芙跑了十八年海，扉页那行小字，她早就背得出。她站在后排，看见普朗坦先生也来了，站在柱子后面，帽子拿在手里，一直没有往前走。散场时他从她身边过，低声说：“她骂了我二十年，我一句也没回。今天想回一句，没人听了。”"

[[tracks.chapters.choices]]
key = "recite"
text = "走到前面，念一节她的叠句"
next = "m3_ransom"
effects = [{ kind = "flag", flag = "rw_lieve_bijns_recited" }]
reply = "她走到前面念了一节，念的是骂路德的那一首。念到末句，满堂的女人都跟着念，声音一下子大起来，震得烛火往一边倒。教士皱了皱眉，没有拦。念完她退回后排，普朗坦先生已经走了。柱子后面的石板上，落着一小摊蜡油。"

[[tracks.chapters.choices]]
key = "follow"
text = "追出去，问他想回她什么"
next = "m3_ransom"
effects = [{ kind = "flag", flag = "rw_lieve_bijns_plantin_word" }]
reply = "他站在大教堂门口的台阶上，想了很久：“我想回她：小心的人，也是可以救的。”他戴上帽子，“可她要是还活着，一定会说：那你先说说，你小心的是什么。”他笑了一下，下了台阶，走得很慢。那一年他五十多岁了，背也弯了。"

[[tracks.chapters.choices]]
key = "lace"
text = "把姑母织的那条领子放在她棺上"
next = "m3_ransom"
effects = [{ kind = "flag", flag = "rw_lieve_bijns_lace" }]
reply = "她把领子从颈上解下来，叠好，放在那块素布上，没有念过经的那一行朝上。管事的修女看了一眼，问这是什么。她说是贝居安院的老针法。修女点点头，没有拿开。棺材抬出去的时候，领子还在上面，那一行在太阳底下，跟别的行一样白。"

[[tracks.chapters]]
key = "m3_ransom"
title = "空着数的票"
text = "西班牙之怒那几天，兵进了普朗坦先生的印坊三回，码头上的人都这么讲。头一回要银子，他给了；第二回要更多的银子，他也给了；第三回他拿不出了，兵就要放火烧纸库。他派一个学徒摸黑来找莉芙，学徒手里攥着一张汇票，签的是普朗坦的名字，数目空着。“先生说，”学徒喘着气，“小姐填多少，就是多少。”她捏着那张空白的票，觉得它比哪一张都重。"
