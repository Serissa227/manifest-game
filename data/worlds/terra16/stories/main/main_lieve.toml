# c09 保险局楼上：无敌舰队那年，英格兰的船东与热那亚中间人在保险局排队。
[[tracks.chapters]]
key = "c09_armada"
title = "保险局楼上"
text = "伦敦王家交易所楼上的保险局，书记在大簿子上登记保单，一张保单上签着几个承保人的名字，各认一份。七月，西班牙的舰队进了英吉利海峡；英格兰的船东排着队求保。一个热那亚中间人也来了，经里斯本替西班牙的船求保，背书上压着一枚火漆印。“第一行没人签，后面谁也不敢签。”英格兰船东说。热那亚中间人笑着：“保费照付，背书就不必看了吧？”楼顶的金蚱蜢在风里转。莉芙心里想：保单是一张赌风的票。她只赌算得清的事，今年的风，谁算得清？"
stage = "involve"
window = [[1588, 6, 1], [1588, 9, 30]]
at = "london"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
news = "伦敦交易所楼上的保险局，无敌舰队那个夏天，保单一天签出去几十张。"

[tracks.chapters.default]
next = "c10_epilogue"
effects = []

