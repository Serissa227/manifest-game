text = "秋天的圣巴沃节集市，交易所里每张桌子都在对账，鹅毛笔沙沙响，楼梯口挤满讨债的伙计。富格尔商行的代理人坐在父亲那张期票后面，等一万二。莉芙抱着钱箱进来：钱箱里的三万，一万二是洞，剩下的一万八是船和本钱。父亲坐在她身边一起点钱，点到一半手抖，她接过去点完。“一万二，今天。要么换个持票人——热那亚人出价很体面。”代理人把笔转了一圈，说：“别拖到明年。”莉芙心里想：洞是一万二，船是一万八。把船填进洞里，明年就没有洞，也没有船。她把钱箱的钥匙在手里转了两圈。"

[[tracks.chapters.choices]]
key = "pay_all"
text = "一次结清一万二。"
next = "a04_gresham"
requires = [{ kind = "cash", ge = 12000 }]
reply = "代理人数了两遍。老宅的契据回到她手里，墨还没干，她就把它夹进了账簿。她问代理人，收据能不能写上父亲的名字。代理人说，只能写她的。她看着那几个字，心里没有觉得轻松，只觉得账终于平了。"
effects = [{ kind = "cash", value = -12000 }, { kind = "flag", flag = "c13_main_lieve_hole_closed" }]

[[tracks.chapters.choices]]
key = "roll"
text = "付一年利息，本金展期，留着本钱做生意。"
next = "a04_gresham"
requires = [{ kind = "cash", ge = 2400 }]
reply = "期票当场转了手。新持票人一栏写的是一个热那亚人的名字，她把那几个字母的笔画记下了。利息她按天算，一分不少地付了现钱。这张票从此不再来敲她的门，可它会去敲别人的门。"
effects = [{ kind = "cash", value = -2400 }, { kind = "flag", flag = "c13_main_lieve_hole_rolled" }]

[[tracks.chapters.choices]]
key = "pawn_paper"
text = "把压着的西班牙票交给热那亚人，再补六千现钱，抵掉一半。"
next = "a04_gresham"
requires = [{ kind = "flag", flag = "c13_main_lieve_held_paper" }, { kind = "cash", ge = 6000 }]
hint = "停付那天你已经把票卖了，手里没有可押的。"
reply = "热那亚人收票时只看了一眼背书，像早知道这叠票会来。她数出六千的现钱推过去，他又把那叠票一张张翻到背面，每张背书都看了一遍，才收进皮包。她把收据折好，心里算着剩下那一半，还要从哪里来。"
effects = [{ kind = "cash", value = -6000 }, { kind = "flag", flag = "c13_main_lieve_paper_to_genoese" }]

# a04 金蚱蜢：格雷沙姆在交易所抬英镑的汇价，莉芙认不认债。
[[tracks.chapters]]
key = "a04_gresham"
title = "金蚱蜢"
text = "十一月底，伊丽莎白即位的消息过了海。交易所里英格兰人常站的那根柱子下，格雷沙姆戴着刻金蚱蜢的戒指，一手托账簿，一手招人：新女王的旧债要转期，他想把英镑的汇价从十六先令往上抬。他不找热那亚人，他找“记性好的”。“利息十二分，一年为期。我替女王说一句：一天也不拖。”莉芙问：“您替她说的话，算不算进本金？”他压低声音，说抬汇率的法子是同一天里让几家同时买进英镑，要一个算得比他还快的人。"
at = "antwerp"
cast = ["lieve", "thomas_gresham"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1558, 11, 17] }]
deadline = [1560, 12, 31]

[tracks.chapters.timeout]
next = "a05_bianca"
effects = []

[[tracks.chapters.variants]]
key = "v_known"
when = [{ kind = "flag", flag = "c13_main_lieve_gresham_known" }]
text = "十一月底，伊丽莎白即位的消息过了海。交易所里英格兰人常站的那根柱子下，格雷沙姆戴着刻金蚱蜢的戒指，一手托账簿，一手招人：新女王的旧债要转期，他想把英镑的汇价从十六先令往上抬。他一眼认出了她：停付那个月替他记汇率、一位也没错的姑娘。“利息十二分，一年为期。我替女王说一句：一天也不拖。”莉芙问：“您替她说的话，算不算进本金？”他压低声音，说抬汇率的法子是同一天里让几家同时买进英镑，要一个算得比他还快的人。"

