key = "v4_alba"
when = [{ kind = "flag", flag = "c13_main_lieve_lent_alba" }]
text = "夏末，哗变的西班牙兵占了阿尔斯特，放话说欠饷付清就不来安特卫普。交易所大厅的一块黑板上用粉笔写着欠饷的数，一天擦一次、改一次，越改越大。她把阿尔瓦军需官那张欠条拿出来，又放了回去——西班牙的钱一向晚到。城堡里来了一个军官，挨桌找银行家借钱。“付清了，他们就去别处。”莉芙说：“别处也有交易所，先生。”军官承认，就算付清了，也只能管住一部分人。莉芙心里算的是：八千够一条街，不够一座城。她把算盘推到一边，用笔在账簿上写下这个数。"

[[tracks.chapters.variants]]
key = "v5_outbid"
when = [{ kind = "flag", flag = "c13_main_lieve_bianca_outbid" }]
text = "夏末，哗变的西班牙兵占了阿尔斯特，放话说欠饷付清就不来安特卫普。交易所大厅的一块黑板上用粉笔写着欠饷的数，一天擦一次、改一次，越改越大。那年从比安卡手里抢回来的包税，西班牙王室还欠她两年的账。城堡里来了一个军官，挨桌找银行家借钱。“付清了，他们就去别处。”莉芙说：“别处也有交易所，先生。”军官承认，就算付清了，也只能管住一部分人。莉芙心里算的是：八千够一条街，不够一座城。她把算盘推到一边，用笔在账簿上写下这个数。"

[[tracks.chapters.choices]]
key = "pay_all"
text = "替西班牙付清那笔欠饷。"
next = "b08_fury"
requires = [{ kind = "cash", ge = 8000 }]
reply = "军官给她写了一张收据，盖的是城堡的印。她把收据和停付那年的旧票夹在了一起。军官说，这张收据能抵的，只有城堡里的兵。她说，那就请在收据上写清楚是哪一条街。收据的边上，她还用铅笔写了一个小数字：八千。"
effects = [{ kind = "cash", value = -8000 }, { kind = "flag", flag = "c13_main_lieve_paid_arrears" }]

[[tracks.chapters.choices]]
key = "pay_street"
text = "只替自己这条街付，交给巡街的军官。"
next = "b08_fury"
requires = [{ kind = "cash", ge = 2000 }]
reply = "巡街的军官数完钱，在街口的墙上用粉笔画了一个记号。记号画在她家门框的正上方，墙上还有别的记号，有的画着圈，有的画着叉，她的那个是一条线。那一条街的人到第二天才知道，街口的墙上，是谁替他们画了那条线。"
effects = [{ kind = "cash", value = -2000 }, { kind = "flag", flag = "c13_main_lieve_paid_street" }]

[[tracks.chapters.choices]]
key = "move_money"
text = "把钱转去伦敦，账房里只留空箱子。"
next = "b08_fury"
reply = "三天里，四只钱箱分三条船过了海。账房里剩下的箱子，她特意上了锁。有人在码头上问她箱子里装的是什么，她说：是空的，锁是给人看的。箱子走的那天，码头上下着小雨，箱角的铜包被雨淋得发亮。"
effects = [{ kind = "flag", flag = "c13_main_lieve_moved_to_london" }]

# b08 劈开的钱库门：西班牙之怒的三天；基础正文是缺省，变体读前面的选择。
[[tracks.chapters]]
key = "b08_fury"
title = "劈开的钱库门"
text = "十一月四日，城堡里的兵和哗变的兵一起冲下来，交易所的大厅成了兵营，市政厅那边烧起来了。莉芙在钱库里，三只猫里有两只钻在柜台下，钱库的铁门被斧头一下一下劈。门外的兵喊：“银子！别的都不要！”邻居在门缝外压着嗓子：“小姐，去河边！”楼梯间里有人哭，哭声一会儿近一会儿远，她分不清是哪一家的。莉芙心里算的是：银子带得走，账带不走。可没有账，银子就只是银子。"
stage = "involve"
window = [[1576, 11, 4], [1576, 11, 10]]
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
night = true
news = "十一月初，哗变的西班牙兵到了安特卫普城下，交易所整整三天没有开门。"

[tracks.chapters.default]
next = "b09_fury_echo"
effects = []

[[tracks.chapters.variants]]
key = "v1_spared"
when = [{ kind = "flag", flag = "h47_antwerp_fury_arrears_paid" }]
text = "十一月四日，哗变的兵到了城门下，城堡的守将带着凑齐的饷银出了城。交易所关了三天门，她守在钱库里听了三天的脚步声。外面的人喊的是“银子”，喊到最后没人再喊。莉芙心里算的是：银子带得走，账带不走。可没有账，银子就只是银子。"

[[tracks.chapters.variants]]
key = "v2_house"
when = [{ kind = "flag", flag = "c13_main_lieve_house_sold" }]
text = "十一月四日，城堡里的兵和哗变的兵一起冲下来，市政厅那边烧起来了。老宅早卖了，她住在交易所楼上，所以这一切就发生在她床底下：钱库的铁门被斧头一下一下劈，门外的兵喊：“银子！别的都不要！”莉芙心里算的是：银子带得走，账带不走。"

[[tracks.chapters.variants]]
key = "v3_moved"
when = [{ kind = "flag", flag = "c13_main_lieve_moved_to_london" }]
text = "十一月四日，城堡里的兵和哗变的兵一起冲下来，交易所的大厅成了兵营。莉芙在钱库里，三只猫里有两只钻在柜台下。钱库里只有上了锁的空箱。兵劈开门，骂了一句：“空的！”转身去了下一家。莉芙心里算的是：银子已经过了海，账也跟着过了海。"

[[tracks.chapters.variants]]
key = "v4_paid"
