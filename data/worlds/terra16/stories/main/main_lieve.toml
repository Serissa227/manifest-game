effects = [{ kind = "reputation", faction = "spain", value = 1 }]

# a05 掌灯以后：夜里的竞价单，宿敌比安卡登场，身份不揭。
[[tracks.chapters]]
key = "a05_bianca"
title = "掌灯以后"
text = "冬夜，交易所背后一条窄巷，一间只在掌灯以后开门的账房。三支蜡烛，桌上摊着布拉班特一笔王室包税的竞价单：热那亚的寡妇银行家比安卡·马雷出价比莉芙多一成。她戴黑丝手套，说话很轻，很慢，记得莉芙家每一笔账的日子。“你父亲的字很好看，小姐。我收他的票，有一半是为了看字。”莉芙回敬：“您收的利息里，哪一半是钱？”比安卡不急着赢，她想看的是莉芙落笔前那一下迟疑。"
at = "antwerp"
cast = ["lieve", "bianca_mare"]
speaker = "captain"
mood = "tense"
night = true
when = [{ kind = "date", from = [1560, 1, 15] }]
deadline = [1561, 11, 30]

