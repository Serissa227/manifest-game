# a07 十二天的书：迪伊在她楼上写书，欠纸钱，用一个符号抵账。
[[tracks.chapters]]
key = "a07_dee"
title = "十二天的书"
text = "正月，印书坊楼上的窗一夜不灭：一个英格兰学者十二天里买光了莉芙仓房里存的纸和墨，在上面写一本谁也看不懂的书。一张草稿从窗缝飘到街上，纸上是月、日、十字与白羊合成的一个符号。普朗坦已经回来，换了合伙人重新开张。纸钱迪伊一个子儿还没付。“十二天。第十三天我就走，所以纸钱我只能欠你——或者，你收一个符号抵账？”莉芙说：“符号在交易所里兑不了。”迪伊说：“在别处能。”"
at = "antwerp"
cast = ["lieve", "john_dee"]
speaker = "captain"
mood = "mystic"
night = true
when = [{ kind = "date", from = [1564, 1, 2] }]
deadline = [1564, 5, 31]

[tracks.chapters.timeout]
next = "a08_torches"
effects = []

[[tracks.chapters.variants]]
key = "v_press"
when = [{ kind = "flag", flag = "c13_main_lieve_plantin_press" }]
text = "正月，印书坊楼上的窗一夜不灭：一个英格兰学者十二天里买光了莉芙仓房里存的纸和墨，在上面写一本谁也看不懂的书。一张草稿从窗缝飘到街上，纸上是月、日、十字与白羊合成的一个符号。普朗坦回来以后，照原价把印机从她仓房里赎了回去，还多付了利息，又送了一令好纸——正是迪伊买走的那一批。纸钱迪伊一个子儿还没付。“十二天。第十三天我就走，所以纸钱我只能欠你——或者，你收一个符号抵账？”莉芙说：“符号在交易所里兑不了。”迪伊说：“在别处能。”"

[[tracks.chapters.choices]]
key = "room"
text = "把楼上的空屋借他住到写完。"
next = "a08_torches"
reply = "他写完那天在门框上用炭笔画了那个符号，说是房租。她没擦。那一个月，她夜里醒来，总听见楼上有人在念一串没有意思的数。他住在楼上的第一晚，她听见他半夜起来，一页一页地翻纸，翻到天亮。"
effects = [{ kind = "affinity", person = "john_dee", value = 5 }, { kind = "flag", flag = "c13_main_lieve_dee_met" }]

[[tracks.chapters.choices]]
key = "lend"
text = "借他钱，先把印书坊的账付了。"
next = "a08_torches"
requires = [{ kind = "cash", ge = 800 }]
hint = "你的钱箱这会儿借不出这一笔。"
reply = "他写了一张借据，落款旁边又画了一个符号。钱后来是从伦敦汇回来的，晚了一年。借据上的数她一直留着，纸边卷起来，像一只合不上的小手。她把那张借据收进账簿的最后一页，和父亲的字挨着。"
effects = [{ kind = "cash", value = -800 }, { kind = "affinity", person = "john_dee", value = 10 }, { kind = "flag", flag = "c13_main_lieve_dee_met" }]

[[tracks.chapters.choices]]
key = "copy_sign"
text = "不借，但把他写的符号抄进账簿。"
next = "a08_torches"
reply = "她在账簿后面几页还没写字的地方描下那个符号。描完才发现，父亲在同一页的边上也画过一个相似的六角。她把两个图案并排放着，看了很久，没有想出它们算不算同一种账。她把纸角压平，又在上面写了一个日期。"
effects = [{ kind = "skill", skill = "lang_latin", value = 20 }, { kind = "flag", flag = "c13_main_lieve_dee_met" }]

# a08 两扇门：圣像破坏的夜里，两家人敲门，一条船。
[[tracks.chapters]]
key = "a08_torches"
title = "两扇门"
text = "八月二十日夜，大教堂里传出砸东西的声音，火把从街口一路涌过来，石膏碎屑落在门槛上。一个钟头里，德克莱尔克家的门被敲了两回。先是大教堂的唱诗班长带着妻子和四个孩子，“他们说下一个就砸管风琴。小姐，我那几个孩子只会唱歌。”再是一户加尔文派的染布匠，人没砸东西，“我们一块石头都没扔。可明天，谁信？”交易所的大门还关着，门房一个人提着灯。地窖只藏得下一家，河边有一条去伦敦的鲱鱼船，底舱今夜就要开。莉芙心里只有一句：两家人，一间地窖，一条船。"
stage = "involve"
window = [[1566, 8, 18], [1566, 9, 10]]
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
night = true
news = "那一夜安特卫普城里的教堂差不多都被砸了，第二天交易所照常开门，可价钱一天一个样，没人敢报。"

[tracks.chapters.default]
next = "a09_exchange_lock"
effects = []

[[tracks.chapters.choices]]
key = "hide_catholics"
text = "把唱诗班长一家藏进地窖。"
next = "a09_exchange_lock"
reply = "四个孩子在地窖里一声不出。天亮时最小的那个睡着了，嘴里还在哼弥撒的调子。唱诗班长站在台阶上，一直没有问她为什么，只在她的手心里塞了一把钥匙，说是大教堂的。她把地窖的门闩从里面插上，又去门口看了一眼。"
effects = [{ kind = "reputation", faction = "spain", value = 3 }, { kind = "flag", flag = "c13_main_lieve_hid_catholics" }, { kind = "memory", memory = "mem-main_lieve-a08", title = "两扇门" }]

[[tracks.chapters.choices]]
key = "ship_calvinists"
text = "包下鲱鱼船的底舱，送染布匠一家去伦敦。"
next = "a09_exchange_lock"
requires = [{ kind = "cash", ge = 600 }]
hint = "鲱鱼船的底舱今夜要现钱，你手里不够。"
reply = "船在潮水退前开了。染布匠把那袋靛青塞给她抵船钱，她收下了，记在账上，没收利息。船一离岸，她站在河边，看见那个染布匠的小儿子从舱口探出头，冲着岸上挥手。她站在河边数着船上的人头，数到最后一个，才回身。"
effects = [{ kind = "cash", value = -600 }, { kind = "reputation", faction = "netherlands", value = 3 }, { kind = "flag", flag = "c13_main_lieve_shipped_calvinists" }, { kind = "memory", memory = "mem-main_lieve-a08", title = "两扇门" }]

[[tracks.chapters.choices]]
key = "guard_exchange"
text = "提着灯守在交易所门口，谁也不让进。"
next = "a09_exchange_lock"
reply = "人群到了台阶下，看见一个提灯的姑娘在念门楣上的铭文，骂了几句，绕开了。门楣上的字她念得很慢，念到“献给各民族、各语言的商人”，声音就哑了。那一夜门房一直没有合眼，天亮的时候，他才把灯吹灭了。"
effects = [{ kind = "fame", value = 3 }, { kind = "flag", flag = "c13_main_lieve_kept_exchange" }, { kind = "memory", memory = "mem-main_lieve-a08", title = "两扇门" }]

# a09 一天一张告示：第一幕的收尾见闻，变体读前面的选择。
