[[tracks.chapters.choices]]
key = "tell"
text = "等父亲回来，把第二本账摊在他面前。"
next = "a03_hole"
reply = "父亲回来时脸上还带着布鲁塞尔的风。她把羊皮账簿放在他面前，一句话也没说。“本来想等你回来再说。”父亲说。她答：“是你把钥匙挂在猫脖子上的。”两人把两本账并排对了一夜，天亮时猫睡在账簿上。"
effects = [{ kind = "flag", flag = "c13_main_lieve_told_father" }, { kind = "memory", memory = "mem-main_lieve-a02", title = "第二本账" }]

[[tracks.chapters.choices]]
key = "patch"
text = "不说破，自己悄悄去补。"
next = "a03_hole"
reply = "她把账放回夹层，原样压上印泥。从此她的小账簿里多了一栏，只写一个字：洞。父亲回来时翻开钱箱，印泥的痕迹一点没变，他也没有说什么。她没有告诉任何人，连账房的猫都没有惊动。"
effects = [{ kind = "flag", flag = "c13_main_lieve_hid_hole" }, { kind = "memory", memory = "mem-main_lieve-a02", title = "第二本账" }]

[[tracks.chapters.choices]]
key = "burn"
text = "把第二本账烧了，往后家里只有一本账。"
next = "a03_hole"
reply = "羊皮烧起来很臭。数字她早就背下了，烧掉的只是父亲的字。烧到最后一页的角上时，那只小猫的画还在，她看了一眼，没有伸手去救。火灭以后，她把灰烬扫进炉膛，什么也没留下。"
effects = [{ kind = "flag", flag = "c13_main_lieve_burned_ledger" }, { kind = "memory", memory = "mem-main_lieve-a02", title = "第二本账" }]

# a03 巴瓦集市的结账日：限期章，目标是手里攒够三万；期限到了卖宅。
[[tracks.chapters]]
key = "a03_hole"
title = "巴瓦集市的结账日"
text = "秋天的圣巴沃节集市，交易所里每张桌子都在对账，鹅毛笔沙沙响，楼梯口挤满讨债的伙计。富格尔商行的代理人坐在父亲那张期票后面，等一万二。莉芙抱着钱箱进来：钱箱里的三万，一万二是洞，剩下的一万八是船和本钱。“一万二，今天。要么换个持票人——热那亚人出价很体面。”代理人把笔转了一圈，说：“别拖到明年。”莉芙心里想：洞是一万二，船是一万八。把船填进洞里，明年就没有洞，也没有船。她把钱箱的钥匙在手里转了两圈。"
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
objectives = [{ kind = "cash", ge = 30000, text = "秋天的巴瓦集市结账以前，手里攒够三万" }]
deadline = [1558, 10, 15]

[tracks.chapters.timeout]
next = "a04_gresham"
effects = [{ kind = "flag", flag = "c13_main_lieve_house_sold" }]
news = "巴瓦集市一过，德克莱尔克家的老宅贴出了出售的告示，买主听说是个热那亚人。"

[[tracks.chapters.variants]]
