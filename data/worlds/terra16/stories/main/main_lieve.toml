text = "冬夜，她把父亲的账簿和自己三十年的小账簿并排摊开，从停付那年一页一页对下来。页角上还有父亲的一行小字：“欠的账，总会还。”那年夏天退回去的那批保单，她留了一张抄本，夹在账簿里，龙印朝下。三只猫的孙辈趴在桌角，耳坠摘下来放在秤盘里。她的笔悬在那个数上，掌心还留着灰绿山铜的那股凉。对到最后一页，父亲那一笔还开着。她这辈子借出去的，大多回来了，回来的样子却和借出去时不一样：一只银杯，一条熏鳗鱼，一张没写字的纸条。窗外运河上的船在靠岸，桨声一下一下，像有人在对数。她坐着没动，手指按在最后一页上。她想起停付那年，父亲把西班牙的票一张张对着窗光看，看完说：“纸会烂，名字不会。”莉芙心里想：到期日是哪天？父亲，你那一笔，到期日是哪天？"

