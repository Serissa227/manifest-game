# b06 比信重的银子：澳门的表舅来信，明朝欠饷半年，借还是劝。
[[tracks.chapters]]
key = "b06_ming_silver"
title = "比信重的银子"
text = "一封从里斯本转来的信，火漆上印着葡萄牙商人团体的章，纸里有一股樟脑味。写信的是她母亲那边的表舅，在澳门替葡萄牙人记账。他在信里写：明朝在辽东打仗，兵欠饷半年，广州的官托澳门的葡萄牙人先垫一笔银子，拿日后的生丝作押。“明朝的官说，银子到了，兵就不乱。我问几时要，他说：昨天。”表舅问，安特卫普的银子肯不肯一起来。信走了十四个月，银子比信重，到那边至少还要一年。表舅在信末又添了一句：“你的账，别算得太清。”"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1573, 9, 1] }]
deadline = [1574, 5, 31]

[tracks.chapters.timeout]
next = "b07_arrears"
effects = []

[[tracks.chapters.variants]]
key = "v_liaoyang"
when = [{ kind = "flag", flag = "l07_shenyang_liaoyang_liaoyang_holds" }]
text = "一封从里斯本转来的信，火漆上印着葡萄牙商人团体的章，纸里有一股樟脑味。写信的是她母亲那边的表舅，在澳门替葡萄牙人记账。他在信里写：明朝在辽东打仗，兵欠饷半年，广州的官托澳门的葡萄牙人先垫一笔银子，拿日后的生丝作押。信里多一句：辽阳守住了以后，那边的官说话硬气了些，开价也高了。“明朝的官说，银子到了，兵就不乱。我问几时要，他说：昨天。”表舅问，安特卫普的银子肯不肯一起来。信走了十四个月，银子比信重，到那边至少还要一年。表舅在信末又添了一句：“你的账，别算得太清。”"

[[tracks.chapters.choices]]
key = "lend"
text = "借——写成年金，拿明年的生丝作押。"
next = "b07_arrears"
requires = [{ kind = "cash", ge = 5000 }]
hint = "五千的银票，你这会儿开不出。"
reply = "她把一张汇往里斯本、再转果阿的票封进回信。封蜡时想起那张被拒付的旧票，手停了一下。票的数写得很大，她看着看着，又在旁边用小字补了一句：先付饷，再论利。她没有在信上写名字，只写了一个日期，那是下一次结算的日子。"
effects = [{ kind = "cash", value = -5000 }, { kind = "flag", flag = "c13_main_lieve_lent_ming" }]

[[tracks.chapters.choices]]
key = "warn"
text = "不借钱，回一封信：兵欠饷半年必乱，先补饷，再谈别的。"
next = "b07_arrears"
reply = "她把安特卫普这些年的兵饷账抄了一页附在信后，末尾写：欠到第六个月，就该数城门了。信寄出去的那天，码头上的风很大，她没有等船开，只站在岸边看着那封信被风吹得翻了几页。"
effects = [{ kind = "flag", flag = "c13_main_lieve_warned_ming" }]

[[tracks.chapters.choices]]
key = "refuse"
text = "回绝，信里只问表舅的身体。"
next = "b07_arrears"
reply = "她写了三页，两页半是问澳门的天气和表舅的咳嗽。最后半页她只写了一句：银子的事，你自己拿主意，我不替你算。她把信封上的火漆掰下来一小块，留在了桌上，像一个小小的印。"
effects = []

# b07 黑板上的欠饷：哗变的西班牙兵欠饷，目标是攒够八千；期限到了就是西班牙之怒。
[[tracks.chapters]]
key = "b07_arrears"
title = "黑板上的欠饷"
text = "夏末，哗变的西班牙兵占了阿尔斯特，放话说欠饷付清就不来安特卫普。交易所大厅的一块黑板上用粉笔写着欠饷的数，一天擦一次、改一次，越改越大。城堡里来了一个军官，挨桌找银行家借钱。“付清了，他们就去别处。”莉芙说：“别处也有交易所，先生。”军官承认，就算付清了，也只能管住一部分人。莉芙心里算的是：八千够一条街，不够一座城。她把算盘推到一边，用笔在账簿上写下这个数。"
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1576, 7, 26] }]
objectives = [{ kind = "cash", ge = 8000, text = "在哗变的兵进城以前，手里攒够八千" }]
deadline = [1576, 11, 3]

[tracks.chapters.timeout]
next = "b08_fury"
effects = []

