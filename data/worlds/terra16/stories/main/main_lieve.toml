key = "v_hid"
when = [{ kind = "flag", flag = "c13_main_lieve_hid_hole" }]
text = "秋天的圣巴沃节集市，交易所里每张桌子都在对账，鹅毛笔沙沙响，楼梯口挤满讨债的伙计。富格尔商行的代理人坐在父亲那张期票后面，等一万二。莉芙抱着钱箱进来：钱箱里的三万，一万二是洞，剩下的一万八是船和本钱。父亲不知道她来，她在期票背面签的是自己的名字。“一万二，今天。要么换个持票人——热那亚人出价很体面。”代理人把笔转了一圈，说：“别拖到明年。”莉芙心里想：洞是一万二，船是一万八。把船填进洞里，明年就没有洞，也没有船。她把钱箱的钥匙在手里转了两圈。"

[[tracks.chapters.variants]]
key = "v_letter"
when = [{ kind = "flag", flag = "c13_main_lieve_father_wrote" }]
text = "秋天的圣巴沃节集市，交易所里每张桌子都在对账，鹅毛笔沙沙响，楼梯口挤满讨债的伙计。富格尔商行的代理人坐在父亲那张期票后面，等一万二。莉芙抱着钱箱进来：钱箱里的三万，一万二是洞，剩下的一万八是船和本钱。父亲的信里夹着期票的抄本，字迹比账上的还小。“一万二，今天。要么换个持票人——热那亚人出价很体面。”代理人把笔转了一圈，说：“别拖到明年。”莉芙心里想：洞是一万二，船是一万八。把船填进洞里，明年就没有洞，也没有船。她把钱箱的钥匙在手里转了两圈。"

