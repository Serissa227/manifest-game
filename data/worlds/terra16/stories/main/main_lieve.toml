# 标签：C13a 主线（莉芙），三幕 30 章。门槛章 a00_gate（轨道 start）；终章 c10_epilogue（c13_main_lieve_done + 恰好一面 end 旗标）。
# 依据（史实，从人物嘴里、行情板、告示与押据上透出，不开口讲历史课）：
#   1557 西班牙王室停付（a01）；1558 伊丽莎白即位与英格兰王室债转期、格雷沙姆在交易所抬汇率（a04）；
#   1562 普朗坦印书坊的拍卖与出逃（a06）；1564 迪伊在安特卫普十二天写成一本谁也看不懂的书（a07）；
#   1566 圣像破坏（a08、a09）；1567 阿尔瓦与血腥议会、除暴委员会（b01）；1569 十分之一税与海上乞丐（b03）；
#   1570 奥特柳斯的《寰宇概观》与上色坊（b04）；1572 布里尔与弗利辛恩（b05）；1573—74 明廷欠饷的来信（b06）；
#   1576 西班牙之怒（b07、b08、b09）；1577 比安卡·马雷与铸币所的秤（b10）；1578 热那亚大教堂的圣器室（c01）；
#   1581 唐·安东尼奥在英格兰押卖王冠的珠宝（c02）；1583 特塞拉岛与黑暗之海（c03、c04）；
#   1584—85 帕尔马围城与地狱燃烧船（c06、c07）；1585 北迁（c08）；1588 无敌舰队的保险（c09）。
#   原创：德克莱尔克一家、第二本账、比安卡的身份、莉斯贝特、龙印、那一箱“爱之家”的字模。
# 待核（正文一律传闻口吻）：热那亚圣杯在祝圣日示人的具体节日；唐·安东尼奥那颗钻石的去向；布拉班特包税的名目。
