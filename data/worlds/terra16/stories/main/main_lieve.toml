# a06 按磅卖的铅字：普朗坦的印机在拍卖，莉芙买、藏或不去。
[[tracks.chapters]]
key = "a06_plantin"
title = "按磅卖的铅字"
text = "春天，普朗坦印书坊的店招上，那只握着圆规的手还在，门口贴着拍卖告示：他去巴黎时，工人背着他偷印了加尔文派的祷文，他被牵连出逃，家当充公。拍卖人在院子里一件件叫价，铅字按磅卖，一台带两副框的印机还没人出价。“印机一台，带两副框——有人出价没有？”普朗坦的妻子让娜站在自家蕾丝店门口，低声说：“他走前说过，那台机子比房子要紧。”书记官的人正在院里翻。莉芙知道印机后面压着一箱“爱之家”的字模与纸。铅一磅几个斯图弗，木框值几个，她都知道，她不知道的是那一箱的价。"
stage = "involve"
window = [[1562, 3, 1], [1562, 6, 30]]
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
news = "安特卫普的人说，普朗坦出逃以后，他的印书坊在院子里拍卖，铅字都按磅卖了。"

