[[tracks.chapters.choices]]
key = "hand"
text = "带上账簿：这笔账交给守得住它的人。"
next = "c04_dark_sea"
reply = "她在信纸背面写了一行：账我带去，交给谁，到了再称。第二天一早，码头上来了个孩子取信，说是威尼斯船上的人叫他来的。信送走以后，她想的是谁守得住一本只写了一半的账。"
effects = [{ kind = "flag", flag = "c13_main_lieve_keepsake" }, { kind = "flag", flag = "c13_main_lieve_stance_hand" }, { kind = "memory", memory = "mem-main_lieve-c03", title = "最后一页" }]

[[tracks.chapters.choices]]
key = "close"
text = "把账簿留在家里：有些账不该有人去讨。"
next = "c04_dark_sea"
reply = "她把账簿锁进钱箱，钥匙挂回猫的脖子上；自己还是上了船，去看看，不去讨。猫在钱箱上趴了一夜，她起来的时候，发现那只猫把头埋在了账簿的封皮下面。第二天早上，她在钱箱的锁孔里发现一根猫毛，没有去拔。"
effects = [{ kind = "flag", flag = "c13_main_lieve_stance_close" }, { kind = "memory", memory = "mem-main_lieve-c03", title = "最后一页" }]

# c04 海草与罗经：黑暗之海的边上。穿进去、掉头、或没赶到（缺省）。
[[tracks.chapters]]
key = "c04_dark_sea"
title = "海草与罗经"
text = "特塞拉岛的安格拉，城头还挂着唐·安东尼奥的旗，港外圣克鲁斯侯爵的舰队在集结。从这里往西走两天，海面铺满海草，风停了，罗经的针一刻钟一转。莉芙在账簿上一格一格记罗经的偏差，像记一天三次的汇率。老水手盯着针：“针转成这样，是海底下有东西在拽。”船尾有人喊：“掉头！淡水只剩两桶了！”舵手把舵柄压得发白，船身还是一点点往西偏。莉芙心里想：每一刻钟偏一点，从不往回。这是利息，风不会这样一直偏。她把这一格记在最前面，像是要给这笔账留一个位置。"
stage = "involve"
window = [[1583, 4, 1], [1583, 9, 30]]
at = "angra"
cast = ["lieve"]
speaker = "captain"
mood = "mystic"
news = "特塞拉岛外今年夏天全是船，安格拉的渔夫说，往西两天的海上连风都停了。"

[tracks.chapters.default]
next = "c05_after"
effects = [{ kind = "flag", flag = "c13_main_lieve_absent" }, { kind = "flag", flag = "c13_main_lieve_atlantis_over" }]

[[tracks.chapters.variants]]
key = "v_crato"
when = [{ kind = "flag", flag = "c13_main_lieve_crato_loan" }]
text = "特塞拉岛的安格拉，城头还挂着唐·安东尼奥的旗，港外圣克鲁斯侯爵的舰队在集结。安格拉港里那几条挂安东尼奥旗的船，有一条的桅杆是她的钱买的；她远远认出了那根新漆的桅。从这里往西走两天，海面铺满海草，风停了，罗经的针一刻钟一转。莉芙在账簿上一格一格记罗经的偏差，像记一天三次的汇率。老水手盯着针：“针转成这样，是海底下有东西在拽。”船尾有人喊：“掉头！淡水只剩两桶了！”莉芙心里想：每一刻钟偏一点，从不往回。这是利息，风不会这样一直偏。她把这一格记在最前面，像是要给这笔账留一个位置。"

[[tracks.chapters.variants]]
key = "v_map"
when = [{ kind = "flag", flag = "c13_main_lieve_map_atlantis" }]
text = "特塞拉岛的安格拉，城头还挂着唐·安东尼奥的旗，港外圣克鲁斯侯爵的舰队在集结。从这里往西走两天，海面铺满海草，风停了，罗经的针一刻钟一转。莉芙在账簿上一格一格记罗经的偏差，像记一天三次的汇率。罗经偏差最大的那一格，正落在她当年点的金点上。老水手盯着针：“针转成这样，是海底下有东西在拽。”船尾有人喊：“掉头！淡水只剩两桶了！”莉芙心里想：每一刻钟偏一点，从不往回。这是利息，风不会这样一直偏。她把这一格记在最前面，像是要给这笔账留一个位置。"

[[tracks.chapters.choices]]
key = "cross"
text = "打开《翠玉录》抄片，让船穿进去。"
next = "c05_after"
requires = [{ kind = "item", item = "tabula_smaragdina", qty = 1 }]
hint = "你手里没有能让这片雾让路的东西。"
reply = "她把抄片压在罗经旁边，针停了。海草向两边分开，像有人翻过了一页。船身擦着海草过去的时候，船上没有人说话，连水手的喘气声都停了。罗经的针在她手里一动不动，她记下了那一刻的时间。"
effects = [{ kind = "flag", flag = "c13_main_lieve_crossed" }]
news = "安格拉的人说，有条安特卫普来的船一头扎进了西边的海草，罗经针转了一夜，那条船到今天还没回港。"

[[tracks.chapters.choices]]
key = "turn"
text = "掉头，回安格拉。"
next = "c05_after"
reply = "船掉头的那一刻，针一下子回了正北。她把最后一格偏差圈起来，没写结论。回安格拉的两天里，海面一直很平，平得让人不敢看，直到岛的影子重新出现在船尾。她让舵手把船头稳住，连回头看一眼也没有。"
effects = [{ kind = "flag", flag = "c13_main_lieve_turned_back" }, { kind = "flag", flag = "c13_main_lieve_atlantis_over" }]

[[tracks.chapters.choices]]
key = "count"
text = "停在雾边，把每一条进去的船记进账簿。"
next = "c05_after"
reply = "三个月里她记下了十一条船的旗。进去的，没有一条出来记账。每天清晨她都在甲板上数一遍。数到第十一条的时候，雾就合上了，像有人把书页翻了过去。她数的时候，手指在账簿上按出了一排小坑。"
effects = [{ kind = "flag", flag = "c13_main_lieve_turned_back" }, { kind = "flag", flag = "c13_main_lieve_counted_ships" }, { kind = "flag", flag = "c13_main_lieve_atlantis_over" }]

# c05 那以后的账：普通章，无 at；变体读 C11 的判决与前面的选择。
[[tracks.chapters]]
key = "c05_after"
title = "那以后的账"
text = "秋天，消息追到她手里：亚速尔以西的雾今年薄过一阵，又合上了。码头上的水手只说一句：“回来的人，不肯说海上的事。”有的船回来了，回来的人不说话。账簿最后一页那一笔，还是没写完。莉芙心里想：收，还是付？这么多年，她头一回不知道这一页该记在哪一栏。"
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1583, 10, 1] }, { kind = "flag", flag = "c13_main_lieve_atlantis_over" }]
deadline = [1584, 6, 30]

[tracks.chapters.timeout]
next = "c06_blockade"
effects = []

[[tracks.chapters.variants]]
key = "v1_close"
when = [{ kind = "flag", flag = "atlantis_verdict_close" }]
text = "秋天，她想起在十王的会上亲手写下的那一行：合上黑暗之海。亚速尔以西的雾一层层合拢，像有人合上了账簿。水手说：“账簿合上，就没有人再问了。”回来的人不说话。账簿最后一页那一笔，还是没写完。她回来时，雾在船尾合拢，她心里想：收，还是付？"

[[tracks.chapters.variants]]
key = "v2_open"
when = [{ kind = "flag", flag = "atlantis_verdict_open" }]
text = "秋天，她想起在十王的会上亲手写下、刻上金板的那一行：航路打开。她在账簿上给那一笔加了一栏“往来”。有的船回来了，回来的人不说话。账簿最后一页那一笔，还是没写完。"

[[tracks.chapters.variants]]
key = "v3_council"
when = [{ kind = "flag", flag = "atlantis_council_met" }]
text = "秋天，消息追到她手里：亚速尔以西的雾今年薄过一阵，又合上了。码头上的水手只说一句：“回来的人，不肯说海上的事。”她见过了那场在熄了火的黑暗里开的会，回来以后一个字也没往外说，只在账上记了一笔日期。账簿最后一页那一笔，还是没写完。"

[[tracks.chapters.variants]]
key = "v4_counted"
when = [{ kind = "flag", flag = "c13_main_lieve_counted_ships" }]
text = "秋天，消息追到她手里：亚速尔以西的雾今年薄过一阵，又合上了。码头上的水手只说一句：“回来的人，不肯说海上的事。”十一条船的旗，她又对了一遍：回来的只有三条，三条都不肯说。账簿最后一页那一笔，还是没写完。"

[[tracks.chapters.variants]]
key = "v5_crossed"
when = [{ kind = "flag", flag = "c13_main_lieve_crossed" }]
text = "秋天，消息追到她手里：亚速尔以西的雾今年薄过一阵，又合上了。码头上的水手只说一句：“回来的人，不肯说海上的事。”她穿进去又回来了；回来以后，她把那几个月的账一笔一笔重抄了一遍，谁问都不说。账簿最后一页那一笔，还是没写完。"

[[tracks.chapters.variants]]
key = "v6_turned"
when = [{ kind = "flag", flag = "c13_main_lieve_turned_back" }]
text = "秋天，消息追到她手里：亚速尔以西的雾今年薄过一阵，又合上了。码头上的水手只说一句：“回来的人，不肯说海上的事。”她在雾边掉了头。那一格罗经偏差，她到现在还圈着。账簿最后一页那一笔，还是没写完。"

[[tracks.chapters.choices]]
key = "record"
text = "把这一笔记进账簿，写上到期日。"
next = "c06_blockade"
reply = "她在“欠”字后面补了一个日期：会议再开的那年。补完日期，她又在旁边画了一个小小的六角，和父亲画的那个一模一样。她把那一页的日期又看了一遍，觉得这一笔从来没有到过期，只是一直在等她算。"
effects = [{ kind = "flag", flag = "c13_main_lieve_wrote_west" }]

[[tracks.chapters.choices]]
key = "tear"
text = "把那一页撕下来烧了。"
next = "c06_blockade"
reply = "纸烧得很快，火舌最后舔掉的，是父亲画在页角的那个小六角。灰落进墨水瓶里，她把瓶盖拧紧，没有再看那一页。撕下来的时候，纸边割破了她的手指，血滴在账簿的封皮上，她用袖子擦了一下，留下一道淡淡的印子。"
effects = [{ kind = "flag", flag = "c13_main_lieve_tore_page" }]


# c06 浮桥合拢以前：限期章，目标是三十舱粮进港；三种卖法。
[[tracks.chapters]]
key = "c06_blockade"
title = "浮桥合拢以前"
text = "那年夏天，帕尔马公爵的工兵在斯海尔德河上打桩，浮桥从两岸往中间合，一天比一天窄。城里面包一天比一天小，市政厅贴出了限价。她的船趁两岸桥头之间还有一道口子，压着粮食进了港。码头上三拨人同时围上来：市政厅的官、穷人家的女人、出得起高价的粮商。“限价是全城的价，小姐，不只是你一家的价。”市政厅的官说。码头边的女人伸手：“我不要你的价，我要你的面包。”她的手上还沾着面粉。"
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1584, 7, 1] }]
objectives = [{ kind = "goods", good = "grain", qty = 30, at = "antwerp", text = "浮桥合拢以前，把三十舱粮食运进安特卫普" }]
deadline = [1585, 2, 24]

[tracks.chapters.timeout]
next = "c07_hellburners"
effects = []
news = "斯海尔德河上的浮桥合拢了，安特卫普城里的面包一天比一天小，码头上的粮船都绕到了北边。"

[[tracks.chapters.variants]]
key = "v_heyns"
when = [{ kind = "flag", flag = "c13_request_peeter_heyns_done" }]
text = "那年夏天，帕尔马公爵的工兵在斯海尔德河上打桩，浮桥从两岸往中间合，一天比一天窄。月桂树女校的窗子钉上了木板，海恩斯先生的书箱已经走了。城里面包一天比一天小，市政厅贴出了限价。她的船趁两岸桥头之间还有一道口子，压着粮食进了港。码头上三拨人同时围上来：市政厅的官、穷人家的女人、出得起高价的粮商。“限价是全城的价，小姐，不只是你一家的价。”市政厅的官说。码头边的女人伸手：“我不要你的价，我要你的面包。”她的手上还沾着面粉。"

[[tracks.chapters.variants]]
key = "v_london"
when = [{ kind = "flag", flag = "c13_main_lieve_to_london" }]
text = "那年夏天，帕尔马公爵的工兵在斯海尔德河上打桩，浮桥从两岸往中间合，一天比一天窄。她是从伦敦开船来的，船上的英格兰水手第一次见这么窄的河道。城里面包一天比一天小，市政厅贴出了限价。她的船趁两岸桥头之间还有一道口子，压着粮食进了港。码头上三拨人同时围上来：市政厅的官、穷人家的女人、出得起高价的粮商。“限价是全城的价，小姐，不只是你一家的价。”市政厅的官说。码头边的女人伸手：“我不要你的价，我要你的面包。”她的手上还沾着面粉。"

[[tracks.chapters.variants]]
key = "v_spared"
when = [{ kind = "flag", flag = "c13_main_lieve_antwerp_spared" }]
text = "那年夏天，帕尔马公爵的工兵在斯海尔德河上打桩，浮桥从两岸往中间合，一天比一天窄。这座城八年前躲过了一劫，这回躲不躲得过，交易所里没人敢赌。城里面包一天比一天小，市政厅贴出了限价。她的船趁两岸桥头之间还有一道口子，压着粮食进了港。码头上三拨人同时围上来：市政厅的官、穷人家的女人、出得起高价的粮商。“限价是全城的价，小姐，不只是你一家的价。”市政厅的官说。码头边的女人伸手：“我不要你的价，我要你的面包。”她的手上还沾着面粉。"

[[tracks.chapters.choices]]
key = "council"
text = "照市政厅的限价卖给市政厅。"
next = "c07_hellburners"
reply = "官把收据盖了章，说城破那天这张纸也许一文不值。她说，那就让它值到城破那天。市政厅的书记在一旁加了一句：这笔粮，记在城的账上。她点头，签了字。她把收据折好，放进了钱箱的最底层。"
effects = [{ kind = "cash", value = 400 }, { kind = "reputation", faction = "netherlands", value = 3 }]

[[tracks.chapters.choices]]
key = "poor"
text = "不收钱，分给码头边的穷人家。"
next = "c07_hellburners"
reply = "她站在跳板上一舱一舱点名，点到最后自己嗓子哑了。账簿上这一行，她记的是：免收。分到粮的人里，有个女人把面包掰成两半，一半塞给了她，说：这一半是你的利息。那天夜里，她的钱箱里一个子儿也没有多。"
effects = [{ kind = "fame", value = 5 }, { kind = "flag", flag = "c13_main_lieve_fed_poor" }]
news = "安特卫普码头边的人说，浮桥合拢以前有条船运进来几十舱麦子，船主一个子儿也没收。"

[[tracks.chapters.choices]]
key = "dear"
text = "只卖给出得起价的。"
next = "c07_hellburners"
requires = [{ kind = "price", good = "grain", at = "antwerp", ge = 24 }]
hint = "城里的粮价还没涨到那一步。"
reply = "粮商的钱袋很沉。她数完钱，看见码头边那个女人还站着，没走。钱是热的，像是在粮商怀里揣了很久。她把它数成一叠，放进钱箱，心里没有一点高兴。她没有回头，只把那一叠钱压在桌上，压得很实。"
effects = [{ kind = "cash", value = 900 }, { kind = "fame", value = -3 }, { kind = "flag", flag = "c13_main_lieve_sold_dear" }]

# c07 地狱燃烧船：1585 年 4 月的火船；出钱、冒险或走色标里的路。
[[tracks.chapters]]
key = "c07_hellburners"
title = "地狱燃烧船"
text = "四月四日夜，意大利工程师詹贝利的两条火船顺着退潮漂向浮桥。船舱里砌着砖，砖里封着火药和石块，引信用钟表计时。一条搁浅了，另一条撞上浮桥：一声响，半座桥和桥上的兵飞上了天，城墙上的人欢呼。烧着的木板一块块掉进水里，嘶的一声，灭了。一个守城的老兵在烟里喊：“别停，趁烟大！”“桥断了！桥断了！”可约好跟在后面的船队没有来。莉芙心里想：口子开着，可钱不会自己从口子里游进来。河堤上挤满了人，有人哭，有人笑，她只听见一个声音，是钟表在一下一下地走。"
stage = "involve"
window = [[1585, 4, 1], [1585, 4, 15]]
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
night = true
news = "安特卫普的人说，四月那一夜斯海尔德河上一声响，浮桥炸开了一个口子，可后面的船没有跟上来。"

[tracks.chapters.default]
next = "c08_north"
effects = []

[[tracks.chapters.choices]]
key = "fund"
text = "出钱给詹贝利，再装一条船。"
next = "c08_north"
requires = [{ kind = "cash", ge = 3000 }]
hint = "装一条火船的钱，你一时拿不出。"
reply = "詹贝利拿钱买了火药，第二条船却没来得及下水。他把一只计时的钟送给她，说至少钟是准的。钟上刻着一个意大利人的名字，她没问，只把钟放进了钱箱，压在父亲的账簿上面。"
effects = [{ kind = "cash", value = -3000 }, { kind = "reputation", faction = "netherlands", value = 3 }, { kind = "flag", flag = "c13_main_lieve_funded_giambelli" }]

[[tracks.chapters.choices]]
key = "ride"
text = "自己押一条跟在后面的船，桥一断就冲过去。"
next = "c08_north"
check = { attr = "arms", base = 20, per = 7 }
reply = "她的船冲进了缺口，回头时看见两岸的火把一齐亮起。只有她一条船冲了过去。船身撞上浮桥的残骸时，她听见有人在水里喊。她没有停，只让舵手把船再往北偏一点。上岸以后，她的衣服湿透了，船员们却都在笑。"
effects = [{ kind = "fame", value = 5 }]
fail = { next = "c08_north", effects = [{ kind = "fame", value = 1 }], news = "浮桥断的那一夜，有条安特卫普的船想从缺口冲出去，被两岸的火枪打了回来。" }

