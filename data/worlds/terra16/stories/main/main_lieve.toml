reply = "她照着火漆描了一张图，折成四折，夹进父亲账簿的封皮里。图上的龙只描了一半，另一半她留给了比安卡自己去想。她把折好的图放进父亲账簿的封皮里，封皮上的裂口正好能盖住它。"
effects = [{ kind = "flag", flag = "c13_main_lieve_bianca_known" }, { kind = "flag", flag = "c13_main_lieve_bianca_leverage" }, { kind = "memory", memory = "mem-main_lieve-b10", title = "秤上的龙印" }]

[[tracks.chapters.choices]]
key = "circle"
text = "把这个印的样子交给莉斯贝特，让她转给在找这条龙的人。"
next = "c01_catino"
reply = "莉斯贝特把描图对着炉火照了照。“威尼斯有个圈子在找这条龙，我替他们验过两回银子，钱给得爽快，名字一个不留。”莉芙问那些人会不会来找她。莉斯贝特已经低头去验下一张票：“那要看你的账干不干净。”"
effects = [{ kind = "flag", flag = "c13_main_lieve_bianca_known" }, { kind = "flag", flag = "c13_main_lieve_told_circle" }, { kind = "memory", memory = "mem-main_lieve-b10", title = "秤上的龙印" }]

# ── 第三幕「更远之处」1578—1590 ──────────────────────────────

# c01 六角绿盘：热那亚圣洛伦佐的祝圣日，描它、称它、或买它的印记；比安卡来搅局。
[[tracks.chapters]]
key = "c01_catino"
title = "六角绿盘"
text = "热那亚圣洛伦佐大教堂，施洗者约翰节前后的祝圣日。圣器室里点着一排蜡烛，那只六角的绿盘搁在丝绒上。人们说它是最后晚餐用过的盘子，两百多年前就定了规矩：不许抵押，不许出这间屋。老教士攥着钥匙，莉芙带着一杆小秤和一卷描图纸；秤的另一头，她摘下耳坠（父亲兑给她的第一枚金币）当砝码。“看可以，描可以，称——你的秤要是比它重，就别放上去。”门口的人影一动，比安卡·马雷站在那里：“热那亚人的圣物，向来不给北方人称。”耳坠在秤的那头轻轻晃，像父亲兑给她那天一样。"
stage = "involve"
window = [[1578, 6, 1], [1579, 7, 15]]
at = "genoa"
cast = ["lieve", "bianca_mare"]
speaker = "captain"
mood = "mystic"
news = "热那亚圣洛伦佐的祝圣日，圣器室里那只绿盘子照例只许看、不许碰。"

[tracks.chapters.default]
next = "c02_crown_jewels"
effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }]

[[tracks.chapters.variants]]
key = "v_confronted"
when = [{ kind = "flag", flag = "c13_main_lieve_bianca_known" }, { kind = "flag", flag = "c13_main_lieve_confronted_bianca" }]
text = "热那亚圣洛伦佐大教堂，施洗者约翰节前后的祝圣日。圣器室里点着一排蜡烛，那只六角的绿盘搁在丝绒上。人们说它是最后晚餐用过的盘子，两百多年前就定了规矩：不许抵押，不许出这间屋。老教士攥着钥匙，莉芙带着一杆小秤和一卷描图纸；秤的另一头，她摘下耳坠（父亲兑给她的第一枚金币）当砝码。“看可以，描可以，称——你的秤要是比它重，就别放上去。”比安卡·马雷已经收到了那封一行字的信，她站在门口，第一次没有戴手套：“热那亚人的圣物，向来不给北方人称。”耳坠在秤的那头轻轻晃，像父亲兑给她那天一样。"

[[tracks.chapters.variants]]
key = "v_known"
when = [{ kind = "flag", flag = "c13_main_lieve_bianca_known" }]
text = "热那亚圣洛伦佐大教堂，施洗者约翰节前后的祝圣日。圣器室里点着一排蜡烛，那只六角的绿盘搁在丝绒上。人们说它是最后晚餐用过的盘子，两百多年前就定了规矩：不许抵押，不许出这间屋。老教士攥着钥匙，莉芙带着一杆小秤和一卷描图纸；秤的另一头，她摘下耳坠（父亲兑给她的第一枚金币）当砝码。“看可以，描可以，称——你的秤要是比它重，就别放上去。”门口的人影一动，比安卡·马雷站在那里：“热那亚人的圣物，向来不给北方人称。”这一回，莉芙看比安卡的黑丝手套，像看一张早就到了期的票。耳坠在秤的那头轻轻晃，像父亲兑给她那天一样。"

[[tracks.chapters.variants]]
key = "v_unmet"
when = [{ kind = "flag", flag = "c13_main_lieve_bianca_met", value = false }]
text = "热那亚圣洛伦佐大教堂，施洗者约翰节前后的祝圣日。圣器室里点着一排蜡烛，那只六角的绿盘搁在丝绒上。人们说它是最后晚餐用过的盘子，两百多年前就定了规矩：不许抵押，不许出这间屋。老教士攥着钥匙，莉芙带着一杆小秤和一卷描图纸；秤的另一头，她摘下耳坠（父亲兑给她的第一枚金币）当砝码。“看可以，描可以，称——你的秤要是比它重，就别放上去。”门口的人影一动，是个戴黑手套的寡妇：“热那亚人的圣物，向来不给北方人称。”门口那个寡妇，她是第一次见；她却叫得出她父亲的名字。耳坠在秤的那头轻轻晃，像父亲兑给她那天一样。"

[[tracks.chapters.choices]]
key = "chapter"
text = "向教士会陈情，求准在祝圣日描它、称它。"
next = "c02_crown_jewels"
requires = [{ kind = "flag", flag = "c13_mark_genoa", value = false }]
check = { attr = "etiquette", base = 20, per = 7 }
reply = "老教士听她用意大利语背完圣器室的规矩，点了头。她描了三遍，称了三遍，三遍一样重。描图纸在烛光下泛着淡黄，她把耳坠从秤盘上拿下来的时候，手心里全是汗。教士的抽屉上放着一本旧的圣器登记簿，她没有去翻。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "flag", flag = "c13_mark_genoa" }, { kind = "memory", memory = "mem-main_lieve-c01", title = "六角绿盘" }]
news = "热那亚圣洛伦佐的教士说，今年有个安特卫普来的女人在圣器室里把那只绿盘子称了三遍。"
fail = { next = "c02_crown_jewels", effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "flag", flag = "c13_mark_genoa" }, { kind = "memory", memory = "mem-main_lieve-c01", title = "六角绿盘" }, { kind = "reputation", faction = "genoa", value = -3 }], news = "圣洛伦佐的教士会准了那个北方女人描圣杯，可也记下了她的名字：说话太快，规矩背得太熟。" }

[[tracks.chapters.choices]]
key = "donate"
text = "给圣器室捐一笔灯油钱。"
next = "c02_crown_jewels"
requires = [{ kind = "cash", ge = 3000 }, { kind = "flag", flag = "c13_mark_genoa", value = false }]
hint = "圣器室的灯油钱，你一时捐不出这么多。"
reply = "灯油钱记在圣器室的簿子上，她的名字后面跟着“安特卫普”。老教士把钥匙在她面前转了一圈。教士收下了钱，在簿子上写了她的名字，然后说：这盏灯，明年还要她来点。她数钱的时候，手有点抖，数了两遍。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "cash", value = -3000 }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "flag", flag = "c13_mark_genoa" }, { kind = "memory", memory = "mem-main_lieve-c01", title = "六角绿盘" }]

[[tracks.chapters.choices]]
key = "favor"
text = "向比安卡讨那年欠下的人情。"
next = "c02_crown_jewels"
requires = [{ kind = "flag", flag = "c13_main_lieve_bianca_favor" }, { kind = "flag", flag = "c13_main_lieve_bianca_leverage", value = false }, { kind = "flag", flag = "c13_mark_genoa", value = false }]
hint = "包税那回你没让给比安卡，她不欠你人情；手里攥着她把柄的人，她也不会还这份情。"
reply = "比安卡在自己的账本上划掉了一行，对老教士说了一句热那亚话。门开了。“两清。”她说。她们走出圣器室的时候，比安卡没有回头，只把手套戴上了，像在收拾一笔已经结清的账。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "affinity", person = "bianca_mare", value = 5 }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "flag", flag = "c13_mark_genoa" }, { kind = "memory", memory = "mem-main_lieve-c01", title = "六角绿盘" }]

[[tracks.chapters.choices]]
key = "leverage"
text = "把那张龙印的描图在她面前展开，请她让路。"
next = "c02_crown_jewels"
requires = [{ kind = "flag", flag = "c13_main_lieve_bianca_leverage" }, { kind = "flag", flag = "c13_mark_genoa", value = false }]
hint = "铸币所那天你没把龙印的事攥在手里，眼下没有能让她让路的东西。"
reply = "比安卡看了描图很久，慢慢让开了门。“这张票，”她说，“你最好永远别兑。”门在身后关上，莉芙听见里面的老教士问了一句什么，比安卡没有回答。比安卡站在门里，没有回头，手里还攥着那张旧票的抄本。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "affinity", person = "bianca_mare", value = -10 }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "flag", flag = "c13_mark_genoa" }, { kind = "memory", memory = "mem-main_lieve-c01", title = "六角绿盘" }]

# c02 见过三位国王的石头：唐·安东尼奥的珠宝匠在伦敦押钻石，莉芙要不要借。
[[tracks.chapters]]
key = "c02_crown_jewels"
title = "见过三位国王的石头"
text = "伦敦的王家交易所，楼顶立着格雷沙姆的金蚱蜢。他前年死了，楼还是照安特卫普的样子盖的。一个葡萄牙珠宝匠找到她的桌子：自称葡萄牙国王的克拉图院长唐·安东尼奥要钱，特塞拉岛还认他，他要在法国人的帮助下送一支船队去亚速尔。押的是一颗切成方形的大钻石，说是从王冠上取下来的。“这颗石头见过三位国王。”珠宝匠先说葡萄牙语，她用母亲的话回他：“它见过几位债主？”他要的是一个肯等的债主，买主倒在其次。"
at = "london"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1581, 6, 1] }]
deadline = [1582, 5, 31]

[tracks.chapters.timeout]
next = "c03_summons"
effects = []

[[tracks.chapters.variants]]
key = "v_holds"
when = [{ kind = "flag", flag = "h52_iberian_union_antonio_rules_portugal" }]
text = "伦敦的王家交易所，楼顶立着格雷沙姆的金蚱蜢。他前年死了，楼还是照安特卫普的样子盖的。一个葡萄牙珠宝匠找到她的桌子：院长在里斯本保住了王位，可钱箱是空的。唐·安东尼奥派人来伦敦借钱，要守亚速尔。押的是一颗切成方形的大钻石，说是从王冠上取下来的。“这颗石头见过三位国王。”珠宝匠先说葡萄牙语，她用母亲的话回他：“它见过几位债主？”他要的是一个肯等的债主，买主倒在其次。"

[[tracks.chapters.choices]]
key = "pawn"
text = "收下钻石作押，借钱给他的船队。"
next = "c03_summons"
requires = [{ kind = "cash", ge = 6000 }]
hint = "押这样一颗石头，钱箱里得先有足够的银子。"
reply = "她给钻石称了重，写了一张押据，用葡萄牙语念了一遍给珠宝匠听。押据上的到期日，她写的是“国王回到里斯本那天”。押据她留了一份，原件交给珠宝匠带回里斯本，说是给那位院长看的。"
effects = [{ kind = "cash", value = -6000 }, { kind = "flag", flag = "c13_main_lieve_crato_loan" }]
news = "伦敦交易所的人说，葡萄牙那位院长的一颗钻石，押在了一个安特卫普女人的钱箱里。"

[[tracks.chapters.choices]]
key = "buy"
text = "照市价买下钻石，不管他的仗。"
next = "c03_summons"
requires = [{ kind = "cash", ge = 4000 }]
hint = "这颗石头的市价，你一时付不出。"
reply = "珠宝匠数钱时手在抖。她把钻石收进耳坠旁边的小盒，没告诉任何人它值多少。盒子是父亲留下的，上了锁，钥匙她一直挂在颈间。她没有问钻石是从哪一顶王冠上取下来的，只问了一句：这颗石头要什么时候赎？"
effects = [{ kind = "cash", value = -4000 }, { kind = "flag", flag = "c13_main_lieve_crato_diamond" }]

[[tracks.chapters.choices]]
key = "appraise"
text = "只写一张估价单给他，原样奉还。"
next = "c03_summons"
check = { attr = "commerce", base = 35, per = 6 }
reply = "她的估价单比珠宝匠自己开的价低三成，却每一条都写得清楚。后来他拿着这张单子，在巴黎多押出了一笔钱。估价单的末尾，她还写了一行：此价不含王位。她把估价单折成两折，用火漆封好，交给了那个葡萄牙人。"
effects = [{ kind = "reputation", faction = "portugal", value = 3 }]
fail = { next = "c03_summons", effects = [], news = "唐·安东尼奥的珠宝匠在伦敦交易所转了一圈，估价单收了三张，没一张让他满意。" }

# c03 最后一页：信物的选择与立场（恰好一面）；超时缺省 hand。
[[tracks.chapters]]
key = "c03_summons"
title = "最后一页"
text = "夏夜的账房，窗开着。父亲的账簿摊到最后一页：一笔只有日期、没有对家的账，“西方——欠——”，后面没写完；旁边画着一个小小的六角。桌上压着一封从威尼斯来的信，没有署名，信里说明年夏天木星与土星会合，雾最薄，账在亚速尔以西，请她把账簿带上。这是她见过的唯一一笔没有利息、也没有到期日的账。她把那一页翻回来又翻过去，纸角卷得很厉害。她心里想：这样的账，我从来没见过。"
cast = ["lieve"]
speaker = "captain"
mood = "mystic"
night = true
when = [{ kind = "date", from = [1582, 7, 1] }]
deadline = [1583, 2, 28]

[tracks.chapters.timeout]
next = "c04_dark_sea"
effects = [{ kind = "flag", flag = "c13_main_lieve_stance_hand" }]

