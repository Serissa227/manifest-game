[[tracks.chapters.choices]]
key = "banker"
text = "在阿姆斯特丹开一张自己的兑换桌。"
next = "done"
requires = [{ kind = "cash", ge = 20000 }]
hint = "一张自己的桌子，钱箱还撑不起。"
reply = "开张那天，她在桌上摆了一杆秤、一本空账簿和一块蜂蜜蛋糕。第一位客人问她利息几分，她把秤往客人那边推了推：先称称你的消息。"
effects = [{ kind = "flag", flag = "c13_main_lieve_done" }, { kind = "flag", flag = "c13_main_lieve_end_banker" }, { kind = "memory", memory = "mem-main_lieve-c10", title = "到期日" }]
news = "阿姆斯特丹新开了一张兑换桌，桌主是从安特卫普来的女人，三只猫轮流趴在秤边。"

[[tracks.chapters.choices]]
key = "underwriter"
text = "在伦敦交易所楼上挂保险商的牌子。"
next = "done"
requires = [{ kind = "flag", flag = "c13_main_lieve_insured_english" }]
hint = "你的名字还没有签在任何一张保单的第一行。"
reply = "牌子是铜的，上面刻着她的名字和一只很小的猫。她说蚱蜢已经有人用了。挂牌那天，书记在簿子上又添了一行，写的是她的名字，后面跟着：安特卫普，已付。她没有多解释，只说：记账的。"
effects = [{ kind = "flag", flag = "c13_main_lieve_done" }, { kind = "flag", flag = "c13_main_lieve_end_underwriter" }, { kind = "memory", memory = "mem-main_lieve-c10", title = "到期日" }]
news = "伦敦交易所楼上的保险局多了一块铜牌，承保人是个安特卫普来的女人，牌子上刻着一只猫。"

[[tracks.chapters.choices]]
key = "settled"
text = "把父亲那一笔结掉：在最后一页写上“已收讫”。"
next = "done"
reply = "她写完“已收讫”，吹干墨，把两本账并排合上。屋里只剩猫的呼噜声。写完以后，她数了数，这一笔从停付那年欠到今天，正好三十二年，比她想的长，也比她想的近。猫跳上来，把爪子搭在最后一页上。"
effects = [{ kind = "flag", flag = "c13_main_lieve_done" }, { kind = "flag", flag = "c13_main_lieve_end_settled" }, { kind = "memory", memory = "mem-main_lieve-c10", title = "到期日" }]

# ───────────── 旁轨（2026-11-12 剧情增写）：炉灰（彼得之死，与莉芙怎么还那几张空白汇票） ─────────────
# 母本：浮士德传说（后世的民间书，1587：与看不见的人立约，最后在约满的那一夜死去）；《每个人》（Elckerlijc，1495：死神来召，财货只陪到坟边，跟着走的只有善行）；
#       文化：低地国家纸做的信用与新学问的狂热，好的是敢想，坏的是把灵魂也当成可以贴现的票据；张力：炉子没熄——他给出去的都回来了，连同毒。
# 入口：c13_main_lieve（a00 缺省）加日期；h5、h6 用 c13_main_lieve_act2，h7 用 c13_main_lieve_act3。各章无 at，进入即弹出（不写死所在港口）。
# 读养成期旗标：rw_lieve_key_kept / key_returned / grain_taken（人物线 A 熄炉）、rw_lieve_aunt_paid（人物线 D）；读主线已有的 c13_main_lieve_house_sold、_lent_alba、_lent_beggars。
# 本轨设：rw_lieve_ashes_*，给本轨后面几章的变体读。时间上避开了已有主线：a01—a03 父亲还在兑换桌后面；b08 西班牙之怒那三天正文不提他，他死在之后第八天被人发现；
#       c10（1589）“父亲那一笔还开着”与 h7 的三个落点都对得上。
[[tracks]]
key = "main_lieve_rw_ashes"
name = "炉灰"
kind = "main"
start = "h1_relit"
auto = true
cast = ["lieve"]

[[tracks.chapters]]
key = "h1_relit"
title = "炉子又热了"
text = "十月，离巴瓦集市的结账日还有一年。父亲从布鲁塞尔回来以后，夜里又开始不睡。莉芙下地窖取泥炭，摸到里间那扇门是温的。她把耳朵贴上去：噼、噼，炉膛里压着火。门上的锁换了一把新的，比原来那把大一圈。她上船以前，父亲当着她的面往炉膛里泼过一桶水，白汽冲上房梁。楼梯顶上父亲在咳嗽，咳完了，压着嗓子问：“莉芙，是你吗？今天的英镑，几先令？”"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
night = true
when = [{ kind = "flag", flag = "c13_main_lieve" }, { kind = "date", from = [1557, 10, 15] }]

[[tracks.chapters.variants]]
key = "a1_key"
when = [{ kind = "flag", flag = "rw_lieve_key_kept" }]
text = "十月，离巴瓦集市的结账日还有一年。父亲从布鲁塞尔回来以后，夜里又开始不睡。莉芙下地窖取泥炭，摸到里间那扇门是温的。她把耳朵贴上去：噼、噼，炉膛里压着火。门上的锁换了一把新的，比原来那把大一圈——她贴身钱袋里那把黄铜钥匙，开的是一把已经不在了的锁。楼梯顶上父亲在咳嗽，咳完了，压着嗓子问：“莉芙，是你吗？今天的英镑，几先令？”"

[[tracks.chapters.variants]]
key = "a2_returned"
when = [{ kind = "flag", flag = "rw_lieve_key_returned" }]
text = "十月，离巴瓦集市的结账日还有一年。父亲从布鲁塞尔回来以后，夜里又开始不睡。莉芙下地窖取泥炭，摸到里间那扇门是温的。她把耳朵贴上去：噼、噼，炉膛里压着火。门上还是那把黄铜锁，钥匙是她上船前亲手还给他的，还说了一句“我信你”。楼梯顶上父亲在咳嗽，咳完了，压着嗓子问：“莉芙，是你吗？今天的英镑，几先令？”"

[[tracks.chapters.variants]]
key = "a3_grain"
when = [{ kind = "flag", flag = "rw_lieve_grain_taken" }]
text = "十月，离巴瓦集市的结账日还有一年。父亲从布鲁塞尔回来以后，夜里又开始不睡。莉芙下地窖取泥炭，摸到里间那扇门是温的。她把耳朵贴上去：噼、噼，炉膛里压着火。门上的锁换了一把新的，比原来那把大一圈。账簿封皮里那一粒“金子”跟着她跑了一趟海，父亲却等不及她回来替他证明。楼梯顶上父亲在咳嗽，咳完了，压着嗓子问：“莉芙，是你吗？今天的英镑，几先令？”"

[[tracks.chapters.choices]]
key = "smash"
text = "拿铁钎把炉子砸了"
next = "h2_cologne"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_smashed" }]
reply = "砖比她想的结实，砸到第七下才裂。父亲站在门口看，没有拦，也没有走近，等她砸完才说：“砖钱是你母亲的。”第二天他去砖窑订了四百块新的。她把碎砖一块块搬到河边扔了，扔到最后一块，手心磨破了。她在账簿上记了一行：砖，四百，又一回。"

[[tracks.chapters.choices]]
key = "seal"
text = "收走他的汇票本和签名章"
next = "h2_cologne"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_sealed" }]
reply = "她把兑换桌的抽屉整个抽出来，汇票本、签名章、印泥，一样一样装进自己的钱箱，钥匙挂在脖子上。父亲没有争，只问：“那我拿什么买汞？”她说：“拿你自己的手，抖着去写。”话出了口她就后悔了。父亲点点头，像认了一笔该认的账。往后半年，再没有一张德克莱尔克家的票流到科隆去。"

[[tracks.chapters.choices]]
key = "bellows"
text = "坐到炉前，替他拉一夜风箱"
next = "h2_cologne"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_bellows" }]
reply = "她推开门，在炉前那只矮凳上坐下，握住风箱的柄。父亲愣了很久，才在她对面坐下，开始报数：“一、二……”他的声音又抖又轻，报到一百就喘。她一直拉到天亮。天亮时坩埚里什么也没有，父亲却笑了，像是想起了什么，说：“你小时候……”他没说完。她不知道自己是在帮他，还是在陪他。"

[[tracks.chapters]]
key = "h2_cologne"
title = "里昂回来的票"
text = "春天，里昂集市上回来一个熟识的经纪人，在交易所北廊把莉芙拉到柱子后面，递给她一张票：德克莱尔克家的纸，父亲的签名，数目一栏写着三千，见票后三个月付。“科隆一个卖药的寡妇转出来的，”经纪人说，“转了三道手，到我这里已经贴了两成。我先拿来给你看。拿去给别人，你们家那张桌子就不用摆了。”票背面背书的最后一个名字，是个热那亚人。"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve" }, { kind = "date", from = [1559, 5, 1] }]

[[tracks.chapters.variants]]
key = "a1_sealed"
when = [{ kind = "flag", flag = "rw_lieve_ashes_sealed" }]
text = "春天，里昂集市上回来一个熟识的经纪人，在交易所北廊把莉芙拉到柱子后面，递给她一张票：德克莱尔克家的纸，父亲的签名，数目一栏写着三千，见票后三个月付。她前年秋天就收走了父亲的汇票本，可这一张的出票日子写在那以前——是他早就签好、早就送出了门的。“科隆一个卖药的寡妇转出来的，”经纪人说，“转了三道手，到我这里已经贴了两成。我先拿来给你看。拿去给别人，你们家那张桌子就不用摆了。”票背面背书的最后一个名字，是个热那亚人。"

[[tracks.chapters.variants]]
key = "a2_house"
when = [{ kind = "flag", flag = "rw_lieve_ashes_sealed", value = false }, { kind = "flag", flag = "c13_main_lieve_house_sold" }]
text = "春天，里昂集市上回来一个熟识的经纪人，在交易所北廊把莉芙拉到柱子后面，递给她一张票：德克莱尔克家的纸，父亲的签名，数目一栏写着三千，见票后三个月付。老宅卖了以后，父亲把炉子搬进了河边一间租来的地窖，房租是从她的钱箱里出的。“科隆一个卖药的寡妇转出来的，”经纪人说，“转了三道手，到我这里已经贴了两成。我先拿来给你看。拿去给别人，你们家那张桌子就不用摆了。”票背面背书的最后一个名字，是个热那亚人。"

[[tracks.chapters.choices]]
key = "pay"
text = "照票面付清，把票收回来"
next = "h3_everyman"
requires = [{ kind = "cash", ge = 3000 }]
hint = "三千现钱，你的钱箱这会儿凑不齐。"
effects = [{ kind = "cash", value = -3000 }, { kind = "flag", flag = "rw_lieve_ashes_paid_cologne" }]
reply = "她数出三千，经纪人数了两遍，把票递过来，又补了一句：“这几年北廊上转过这种票的，不止我一个。”她把票夹进父亲的账簿，和那几行汞挨在一起。夜里她拿着票下地窖，放在炉子边上。父亲看了一眼，没有认，也没有不认，只说：“那个寡妇的丈夫，是个好人。”"

[[tracks.chapters.choices]]
key = "buy"
text = "按贴过的价，从经纪人手里买下"
next = "h3_everyman"
requires = [{ kind = "cash", ge = 2400 }]
hint = "贴过两成也要两千四，你手里不够。"
effects = [{ kind = "cash", value = -2400 }, { kind = "flag", flag = "rw_lieve_ashes_bought_back" }]
reply = "她按贴过两成的价把票买下来，经纪人没有还价，收钱时叹了口气：“你父亲当年替我担过一回保。”票到了她手里，就不再是父亲欠别人的，是父亲欠她的。她在账簿上新开一栏，写着“父亲”，后面空着，没写数。这一栏后来越记越长。"

[[tracks.chapters.choices]]
key = "protest"
text = "当众拒付：数目不是他写的"
next = "h3_everyman"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_protested" }]
reply = "公证人在北廊念拒付证书：出票人的签名属实，数目与出票人无涉。念到一半，人群里有人笑。那一年德克莱尔克家的票在交易所贴的水，从一分半涨到四分。父亲三天没上楼吃饭。第四天她下地窖送汤，看见炉子灭了，炉门上贴着那张拒付证书的誊本，是他自己贴上去的。"

[[tracks.chapters]]
key = "h3_everyman"
title = "每个人"
text = "八月，各城的修辞会都来了安特卫普，大广场上搭起十几座戏台，紫罗兰会的花车从早演到晚。父亲非要去看，莉芙扶着他。他走路已经要拄杖，一步重一步轻。大戏台他不看，偏在一条侧街停住：一个小城来的修辞会在车板上演一出老戏，《每个人》。死神来召“每个人”去算总账，“每个人”去求“财货”同行，“财货”说，我只陪你到坟边。车板底下的孩子们在笑。父亲没有笑，拄着杖一直站到戏散，问她：“你说，到时候谁跟我走？”"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve" }, { kind = "date", from = [1561, 8, 1] }]

[[tracks.chapters.choices]]
key = "me"
text = "说：我跟你走"
next = "h4_gilt"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_with_you" }]
reply = "“你不行，”父亲说，“戏里说了，亲戚也不肯同行。”她说戏是戏。他摇头：“戏是几十年前写的，账还是那本账。”回家的路上，他倒比来时走得稳。到了门口，他把拐杖递给她，自己扶着门框进去。那一夜地窖里没有生火。"

[[tracks.chapters.choices]]
key = "deeds"
text = "说：戏里跟着走的，是善行"
next = "h4_gilt"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_deeds" }]
reply = "他想了很久：“那我的善行在哪一栏？”她说在她的账簿里：他替邻居担过的保，冬天赊给码头工人的那几回炭，北廊的老约斯倒了以后，他偷偷替约斯的寡妇付过一季房租。他听着，一笔一笔点头，听到最后问：“加起来，抵得上地窖吗？”她没有回答。他也没有再问。"

[[tracks.chapters.choices]]
key = "gold"
text = "说：财货不肯走，金子是你自己炼的"
next = "h4_gilt"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_gold" }]
reply = "她本想说句宽他的话，说出口才觉得刺。父亲却笑了，笑得咳起来：“你也知道它不是金子。”他从背心里摸出一个小布包，捏了捏，又放回去，“可它是我炼的。财货不肯走，它肯。”她扶着他往回走，那一路他一直把手按在背心上。"

[[tracks.chapters]]
key = "h4_gilt"
title = "圣徒的金箔"
text = "砸圣像的那几夜过去以后，大教堂里只剩光秃秃的墙和满地的碎石膏。第五天早上，莉芙在地窖里找到父亲：他坐在炉前，面前摆着一只铜盆，盆里是一层金箔的碎屑，有的还粘着木头和颜料，是从砸碎的圣徒身上刮下来的。他的指甲缝里全是金粉，手抖得像筛子。“他们不要了，”他说，“扔在街上，没人捡。圣徒的金子也是金子，拿它做引子，这一回一定成。”炉膛里的火很旺，烤得他满脸是汗，牙床上一圈发黑。"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve" }, { kind = "date", from = [1566, 8, 25] }]

[[tracks.chapters.choices]]
key = "return"
text = "把金屑收起来，送回大教堂"
next = "h5_almaden"
effects = [{ kind = "reputation", faction = "spain", value = 1 }, { kind = "flag", flag = "rw_lieve_ashes_returned_gold" }]
reply = "她把那一盆金屑包进一块干净的麻布，送到大教堂，交给一个正在清点残物的教士。教士打开看了看，说这些已经补不回去了。她说那就让它待在该待的地方。回到家，父亲问金子呢，她说还给圣徒了。父亲沉默了很久：“也好。他们也是被人砸了，才不要的。”"

[[tracks.chapters.choices]]
key = "let"
text = "让他烧"
next = "h5_almaden"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_let_burn" }]
reply = "她在楼梯上坐了一夜，听炉膛里的火响。天亮时她下去，坩埚里凝着一小片暗黄的东西，薄得像指甲。父亲把它举到窗缝透进来的光里，看了又看，递给她：“你拿去称。”她没有去称。她把那一片和他从前炼出来的那几粒放在一起，拿同一块布包好。"

[[tracks.chapters.choices]]
key = "doctor"
text = "去布鲁塞尔请大夫，不管他愿不愿意"
next = "h5_almaden"
requires = [{ kind = "cash", ge = 200 }]
hint = "布鲁塞尔的大夫出诊要先付钱，你手里不够。"
effects = [{ kind = "cash", value = -200 }, { kind = "flag", flag = "rw_lieve_ashes_doctor" }]
reply = "大夫看了父亲的牙床和手，又看了地窖，直起身说：“汞。他要活，就得离开这间屋子。”父亲听完，客客气气付了诊金，送大夫到门口。大夫一走，他就回了地窖。那一年冬天，他在楼上睡的夜，一只手数得过来。"

[[tracks.chapters]]
key = "h5_almaden"
title = "阿尔马登的封条"
text = "夏天，阿尔瓦的十分之一税叫交易所的北廊空了一半，父亲的汞却照样送到：一只铁瓶，封口压着西班牙王室的封条，阿尔马登的矿如今由王室的人直接收账。送瓶的是城堡军需处的一个文书。他把铁瓶放下，没有走，掏出一张父亲签过名的空白汇票：“德克莱尔克先生拿这张付的账。军需官说，数目他可以不填，只要小姐的兑换桌往后替城堡兑饷银的时候，秤上松一松。”"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1570, 6, 1] }]

[[tracks.chapters.variants]]
key = "a1_alba"
when = [{ kind = "flag", flag = "c13_main_lieve_lent_alba" }]
text = "夏天，阿尔瓦的十分之一税叫交易所的北廊空了一半，父亲的汞却照样送到：一只铁瓶，封口压着西班牙王室的封条，阿尔马登的矿如今由王室的人直接收账。送瓶的是城堡军需处的一个文书，他的主子莉芙认得：去年冬天在弗利辛恩，借据上那个印盖得很重的人。他把铁瓶放下，没有走，掏出一张父亲签过名的空白汇票：“德克莱尔克先生拿这张付的账。军需官说，数目他可以不填，只要小姐的兑换桌往后替城堡兑饷银的时候，秤上松一松。”"

[[tracks.chapters.variants]]
key = "a2_beggars"
when = [{ kind = "flag", flag = "c13_main_lieve_lent_alba", value = false }, { kind = "flag", flag = "c13_main_lieve_lent_beggars" }]
text = "夏天，阿尔瓦的十分之一税叫交易所的北廊空了一半，父亲的汞却照样送到：一只铁瓶，封口压着西班牙王室的封条，阿尔马登的矿如今由王室的人直接收账。送瓶的是城堡军需处的一个文书。他把铁瓶放下，没有走，掏出一张父亲签过名的空白汇票，又压低嗓子提了一句弗利辛恩，显然知道她的钱借给过谁。“德克莱尔克先生拿这张付的账。军需官说，数目他可以不填，只要小姐的兑换桌往后替城堡兑饷银的时候，秤上松一松。”"

[[tracks.chapters.choices]]
key = "redeem"
text = "说秤不会松，把那张票照价赎回"
next = "h6_hearth"
requires = [{ kind = "cash", ge = 1500 }]
hint = "一千五百现银，你的钱箱这会儿拿不出。"
effects = [{ kind = "cash", value = -1500 }, { kind = "flag", flag = "rw_lieve_ashes_redeemed" }]
reply = "她把一千五百现银推过去，说这是那张票按今天行情的全数，多一分也不要他让。文书数了钱，把票留下，走时说：“军需官会记得。”她说：“记得不算钱。”那张票她当着父亲的面烧了。父亲看着火，说：“西班牙的封条，烧起来跟别的纸一样。”"

[[tracks.chapters.choices]]
key = "loosen"
text = "答应他：秤上松半分"
next = "h6_hearth"
effects = [{ kind = "reputation", faction = "spain", value = 2 }, { kind = "reputation", faction = "netherlands", value = -1 }, { kind = "flag", flag = "rw_lieve_ashes_loosened" }]
reply = "她说半分，只此一回。文书笑着把票收回袖子，说半分就够了。那一个月，城堡来兑的饷银，她每一袋都少称半分，称的时候手很稳。月底她把那半分的数一笔一笔记进第二本账，用的是父亲的红字。那本账，她本来以为再也不会有人往里写了。"

[[tracks.chapters.choices]]
key = "dump"
text = "当着文书的面，把铁瓶倒进河里"
next = "h6_hearth"
effects = [{ kind = "reputation", faction = "spain", value = -2 }, { kind = "flag", flag = "rw_lieve_ashes_dumped" }]
reply = "她提着铁瓶走到码头，拧开王室的封条，把那一汪银倒进斯海尔德河。汞落进水里，一颗一颗沉下去，像撒了一把钉子。文书站在后面看，脸色发白：“那是王室的货。”她说：“付过钱了，是我家的。”回到家，父亲在楼梯上等她，什么也没问，只问河水凉不凉。"

[[tracks.chapters]]
key = "h6_hearth"
title = "炉边"
text = "西班牙之怒过后第八天，邻居在地窖里找到了父亲。抢东西的兵进来过，炉门被撬开，坩埚摔在地上，墙角的汞瓶滚了一地。他们要的是银子，炉子边上那个老人他们没碰，他也没跑。他坐在炉前的矮凳上，背靠着凉了的砖，右手攥成一个拳头。莉芙把他的手指一根一根掰开，掌心里是一小粒黄东西，比豌豆还小。母亲按她自己的规矩给他净身，拿白亚麻裹好，又把家里水罐里的水全倒了，一滴不剩。没有人问为什么。"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1576, 11, 12] }]

[[tracks.chapters.variants]]
key = "a1_house"
when = [{ kind = "flag", flag = "c13_main_lieve_house_sold" }]
text = "西班牙之怒过后第八天，邻居在河边那间租来的地窖里找到了父亲。抢东西的兵进来过，炉门被撬开，坩埚摔在地上，墙角的汞瓶滚了一地。他们要的是银子，炉子边上那个老人他们没碰，他也没跑。他坐在炉前的矮凳上，背靠着凉了的砖，右手攥成一个拳头。莉芙把他的手指一根一根掰开，掌心里是一小粒黄东西，比豌豆还小。母亲按她自己的规矩给他净身，拿白亚麻裹好，又把屋里水罐里的水全倒了，一滴不剩。没有人问为什么。"

[[tracks.chapters.variants]]
key = "a2_aunt"
when = [{ kind = "flag", flag = "c13_main_lieve_house_sold", value = false }, { kind = "flag", flag = "rw_lieve_aunt_paid" }]
text = "西班牙之怒过后第八天，邻居在地窖里找到了父亲。抢东西的兵进来过，炉门被撬开，坩埚摔在地上，墙角的汞瓶滚了一地。他们要的是银子，炉子边上那个老人他们没碰，他也没跑。他坐在炉前的矮凳上，背靠着凉了的砖，右手攥成一个拳头。莉芙把他的手指一根一根掰开，掌心里是一小粒黄东西，比豌豆还小。姑母拄着杖下来，在炉边站了很久，只说了一句：“他欠我的那一笔，不记了。”母亲按她自己的规矩给他净身，拿白亚麻裹好，又把家里水罐里的水全倒了，一滴不剩。没有人问为什么。"

[[tracks.chapters.choices]]
key = "keep"
text = "把那一粒收进自己的账簿"
next = "h7_last_bill"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_grain_kept" }]
reply = "她把那一粒包进父亲账簿的封皮里，和她这些年替他记下的那一栏放在一起。那一栏后面一直空着，现在她写上了日子：一五七六年十一月。数目那一格，她还是空着。猫跳上桌，闻了闻封皮，走开了。"

[[tracks.chapters.choices]]
key = "bury"
text = "放回他手里，让他带着走"
next = "h7_last_bill"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_grain_buried" }]
reply = "她把那一粒放回他掌心，把他的手指一根根合上。母亲看见了，没有拦。下葬那天，教士念到“尘归于尘”，她心里想的是另一句：财货只陪到坟边，这一粒肯陪他进去。坟土盖上以后，她在账簿上父亲那一栏底下画了一道线，线底下什么也没写。"

[[tracks.chapters.choices]]
key = "assay"
text = "拿去铸币所，让秤说一句话"
next = "h7_last_bill"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_grain_assayed" }]
reply = "试金房在劫后的废墟里重新生了火。验银的女人把那一粒在试金石上划一道，滴一滴酸，黄色退下去，底下是灰白。“铜，砷，拿汞熏过的。”她说完抬头看了莉芙一眼，又低下头，用很小的秤把它称了，在纸条上写下分量，连那一粒一起还给她：“分量是真的。”"

[[tracks.chapters]]
key = "h7_last_bill"
title = "最后一张"
text = "春天，科隆来了一封信，信封里没有信，只有一张汇票：德克莱尔克家的纸，父亲的签名，数目一栏、期限一栏都是空的。另附一张很小的字条，是个女人的字：“先夫生前收下这一张，说德克莱尔克先生已经付过了，付的是一粒金子。先夫知道那不是金子，他说那是他见过最老实的一笔假账。如今两个人都不在了，票还给你。”这些年她找回来的票，加上这一张，正好对上父亲账簿后页那一串编号，一张不差。只有这一张，从来没写过数。"
speaker = "captain"
mood = "tender"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "date", from = [1580, 3, 1] }]

[[tracks.chapters.variants]]
key = "a0_grete_bought"
when = [{ kind = "flag", flag = "rw_lieve_grete_left" }, { kind = "flag", flag = "rw_lieve_ashes_bought_back" }]
text = "春天，科隆来了一封信，信封里没有信，只有一张汇票：德克莱尔克家的纸，父亲的签名，数目一栏、期限一栏都是空的。另附一张很小的字条，是个女人的字：“先夫生前收下这一张，说德克莱尔克先生已经付过了，付的是一粒金子。先夫知道那不是金子，他说那是他见过最老实的一笔假账。如今两个人都不在了，票还给你。”信封上的地址写得又小又挤，是格蕾特的字；她在那家药铺里记了二十多年账，数一直写得很小。她在账簿上开的那一栏“父亲”，从里昂那张记起，记到这一张为止。这些年她找回来的票，加上这一张，正好对上父亲账簿后页那一串编号，一张不差。只有这一张，从来没写过数。"

