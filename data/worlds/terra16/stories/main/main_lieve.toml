text = "把那张票原样空着，送回给他"
next = "m4_two_books"
effects = [{ kind = "flag", flag = "rw_lieve_compass_returned_blank" }]
reply = "她没有填。她把那张空着的票折好，让学徒带回去，附了一句话：签了名的空白票，一张也别往外送。学徒走了以后她才想起，这句话是说给谁听的。那一夜印坊的纸库烧了一间，不是最要紧的那一间。普朗坦先生后来见了她，只说：“小姐那句话，我裱起来了。”"

[[tracks.chapters]]
key = "m4_two_books"
title = "哪一本跟他走"
text = "七月，普朗坦先生死在星期五市场边上那座大印坊里。他前几年去过莱顿，替那边的大学印书，安特卫普开城以后又回来了，像圆规那只走远了的脚，最后还是回到扎在纸上的那一点。葬礼上，女婿们抬着棺材，印坊的工人站了两排，每人手里拿着一根铅条。有人说他一辈子是国王的印刷商；也有人压低嗓子说，他后面那间小屋里的书，够烧他十回。莉芙站在人群里，两种话她都听见了。"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "date", from = [1589, 7, 5] }]

[[tracks.chapters.variants]]
key = "a1_paper"
when = [{ kind = "flag", flag = "rw_lieve_compass_paper" }]
text = "七月，普朗坦先生死在星期五市场边上那座大印坊里。他前几年去过莱顿，替那边的大学印书，安特卫普开城以后又回来了，像圆规那只走远了的脚，最后还是回到扎在纸上的那一点。葬礼上，女婿们抬着棺材，印坊的工人站了两排，每人手里拿着一根铅条。有人说他一辈子是国王的印刷商；也有人压低嗓子说，他后面那间小屋里的书，够烧他十回。每年春天她门口那一包没有书名页的书，今年没有来。莉芙站在人群里，两种话她都听见了。"

[[tracks.chapters.variants]]
key = "a2_lent"
when = [{ kind = "flag", flag = "rw_lieve_compass_lent" }]
text = "七月，普朗坦先生死在星期五市场边上那座大印坊里。他前几年去过莱顿，替那边的大学印书，安特卫普开城以后又回来了，像圆规那只走远了的脚，最后还是回到扎在纸上的那一点。葬礼上，女婿们抬着棺材，印坊的工人站了两排，每人手里拿着一根铅条。有人说他一辈子是国王的印刷商；也有人压低嗓子说，他后面那间小屋里的书，够烧他十回。那部五种文字并排的样书，还压在她的书桌上，沉得要两只手才捧得动。莉芙站在人群里，两种话她都听见了。"

[[tracks.chapters.choices]]
key = "lead"
text = "往他的棺上放一根铅条"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_compass_end_lead" }]
reply = "她从一个工人手里借了一根铅条，放在棺盖上，和别的铅条排在一起。铅条是凉的，排得整整齐齐，像一行还没排完的字。她想起他说过，铅字比刀轻。到最后压在他身上的，也只是这么一点铅。"

[[tracks.chapters.choices]]
key = "book"
text = "回家翻出他当年送的那本空账本"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_compass_end_book" }]
reply = "她回家把那本深棕色的账本找出来，三十多年了，一百二十页只用了一半。她翻到最后一页，对着光看那个水印：一只手，握着一把圆规。她在水印底下写了一个日子，又写了他的名字，写完才发现，这是她头一回在这本账上写一个不是数的东西。"

[[tracks.chapters.choices]]
key = "ask"
text = "去问他的女婿：哪一本账跟他走"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_compass_end_asked" }]
reply = "女婿想了很久，说先生临终前叫人把两本账都拿到床前，一本是印坊的总账，一本谁也没见过。他把那本谁也没见过的翻到最后一页，写了几个字，合上，交给了一个从埃姆登来的人。“写的什么，”女婿说，“我没看。”她点点头，说这样最好。"
