reply = "她替他说动两家安特卫普的商行同时买进。佣金不多，英格兰人从此记住了她的名字。两家商行的人都问她是谁家的，她只说：德克莱尔克，记账的。那一天她在交易所里走了十几趟，每一趟都记下了一个名字。"
effects = [{ kind = "cash", value = 600 }, { kind = "reputation", faction = "england", value = 3 }]
