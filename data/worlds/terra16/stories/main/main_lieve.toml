[[tracks.chapters.variants]]
key = "a1_bought"
when = [{ kind = "flag", flag = "rw_lieve_ashes_bought_back" }, { kind = "flag", flag = "rw_lieve_grete_left", value = false }]
text = "春天，科隆来了一封信，信封里没有信，只有一张汇票：德克莱尔克家的纸，父亲的签名，数目一栏、期限一栏都是空的。另附一张很小的字条，是个女人的字：“先夫生前收下这一张，说德克莱尔克先生已经付过了，付的是一粒金子。先夫知道那不是金子，他说那是他见过最老实的一笔假账。如今两个人都不在了，票还给你。”她在账簿上开的那一栏“父亲”，从里昂那张记起，记到这一张为止。这些年她找回来的票，加上这一张，正好对上父亲账簿后页那一串编号，一张不差。只有这一张，从来没写过数。"

[[tracks.chapters.choices]]
key = "burn"
text = "把它烧了，父亲那一栏合上"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_end_burned" }]
reply = "她把那张票放进烧饭的炉子里，纸卷起来，签名最后才黑。她在账簿上父亲那一栏写了一个“清”字，写得很小，像他当年在页角写的那些字。那一夜她头一回梦见父亲：他坐在兑换桌后面，手不抖，正在称一枚金币。"

[[tracks.chapters.choices]]
key = "keep"
text = "夹进自己的账簿，空着"
next = "done"
effects = [{ kind = "flag", flag = "rw_lieve_ashes_end_kept" }]
reply = "她把那张空白的票夹进自己账簿的第一页。往后每开一本新账，她都把它挪到新账的第一页。有人问那是什么，她说是一张还没到期的票。没有人知道它的到期日，她也不知道。她只知道，账簿开头留着一张空的，往后写下的每一个数，就都得是真的。"

[[tracks.chapters.choices]]
key = "widow"
text = "照一粒金子的分量，汇一笔钱给那个寡妇"
next = "done"
requires = [{ kind = "cash", ge = 60 }]
hint = "一粒金子的钱不多，可你这会儿连这一点也拿不出。"
effects = [{ kind = "cash", value = -60 }, { kind = "flag", flag = "rw_lieve_ashes_end_widow" }]
reply = "她照铸币所纸条上的分量，按那一年的金价，算出一粒真金子值多少，一分不差地汇给科隆的寡妇，附了一行字：欠的账，总会还。寡妇没有回信。第二年有人从科隆捎来一小包东西，打开是一块旧砖，烧得发黑，是那间药铺里的炉砖。她把砖放在兑换桌底下，压着最旧的那本账。"

# ───────────── 旁轨（2026-11-12 剧情增写）：蜡烛（母亲与宗教裁判的阴影，接 b01 名单上的名字） ─────────────
# 母本：《以斯帖记》（孤女进宫，不说出自己的族类，直到族人临难）；文化：安特卫普葡萄牙商人团体里的新基督徒、里斯本隔海的大判、阿尔瓦的委员会与边疆伯爵查书；
#       张力：她把“说对每一个字”当作活下去的办法，又把它当作信本身；她信什么，到死也不点破，女儿只看得见蜡烛、白桌布、倒掉的水与一个名字。
# 入口：k1 用 c13_main_lieve，k2、k3 用 c13_main_lieve_act2，k4—k6 用 c13_main_lieve_act3，各加日期；各章无 at。
# 读养成期旗标：rw_lieve_bill_ferrara / refused_ferrara（人物线 B 查名册）、esther_plantin / esther_sewn / esther_heard（换皮的书）、
#       name_seen（黑火漆的信）、candles_kept / candles_left / candles_asked（带上船的蜡烛）、lied_for_plantin（人物线 C）；读主线已有的 c13_main_lieve_hid_catholics。
# 本轨设：rw_lieve_candles_*（只给本轨与交接记录用）。母亲死在 1587 年，c10（1589）的正文本来就不提她。
[[tracks]]
key = "main_lieve_rw_candles"
name = "蜡烛"
kind = "main"
start = "k1_ferrara"
auto = true
cast = ["lieve"]

[[tracks.chapters]]
key = "k1_ferrara"
title = "去费拉拉的路"
text = "大斋期，葡萄牙商人团体的书记夜里来敲门，找的不是莉芙，是她母亲。两人在后屋说了很久，说的是一种莉芙只听得懂一半的葡萄牙语，夹着几个她从没听过的词。书记走后，母亲把她叫进去，桌上摊着一张名单，七户人家，每户后面写着一个数。“里斯本又办了一回大判，”母亲说，“这七家的亲戚在名单上。人要走，钱得先走，走威尼斯那条路，到费拉拉，或者更远。”她顿了顿，“团体里会写这种票、又不会多问的人，只有你。”"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
night = true
when = [{ kind = "flag", flag = "c13_main_lieve" }, { kind = "date", from = [1560, 3, 1] }]

[[tracks.chapters.variants]]
key = "a1_wrote"
when = [{ kind = "flag", flag = "rw_lieve_bill_ferrara" }]
text = "大斋期，葡萄牙商人团体的书记夜里来敲门，找的不是莉芙，是她母亲。两人在后屋说了很久，说的是一种莉芙只听得懂一半的葡萄牙语，夹着几个她从没听过的词。书记走后，母亲把她叫进去，桌上摊着一张名单，七户人家，每户后面写着一个数。“里斯本又办了一回大判，”母亲说，“这七家的亲戚在名单上。人要走，钱得先走，走威尼斯那条路，到费拉拉，或者更远。”她顿了顿，“你十五岁那年替你表姨写过一张，那张票到了，人也到了。团体里会写这种票、又不会多问的人，只有你。”"

[[tracks.chapters.variants]]
key = "a2_refused"
when = [{ kind = "flag", flag = "rw_lieve_refused_ferrara" }]
text = "大斋期，葡萄牙商人团体的书记夜里来敲门，找的不是莉芙，是她母亲。两人在后屋说了很久，说的是一种莉芙只听得懂一半的葡萄牙语，夹着几个她从没听过的词。书记走后，母亲把她叫进去，桌上摊着一张名单，七户人家，每户后面写着一个数。“里斯本又办了一回大判，”母亲说，“这七家的亲戚在名单上。人要走，钱得先走，走威尼斯那条路，到费拉拉，或者更远。”表姨那个走散的孩子，到底没有找着；母亲一个字也没提，只把名单往她这边推了一寸。“团体里会写这种票、又不会多问的人，只有你。”"

[[tracks.chapters.choices]]
key = "seven"
text = "七张票，今夜就写"
next = "k2_shutters"
effects = [{ kind = "flag", flag = "rw_lieve_candles_wrote_seven" }]
reply = "她写了一夜。七张票走七条路，收款的商号一个比一个不起眼，有一张写的是威尼斯一个卖玻璃珠的。母亲坐在旁边一张一张地看，看完一张，就在名单上那户人家后面画一个小圈。天亮时七个圈画齐了，母亲把名单凑到蜡烛上烧了，灰倒进炉膛。"

[[tracks.chapters.choices]]
key = "fee"
text = "写，但照行规收汇水"
next = "k2_shutters"
effects = [{ kind = "cash", value = 300 }, { kind = "flag", flag = "rw_lieve_candles_fee" }]
reply = "她照行规收了汇水，一分不少，只是没收加急的钱。书记有点吃惊，母亲却点头：“收了钱，就是生意；是生意，就查不到情分上去。”七张票写完，母亲在每一张背面摸了摸，像在摸一个孩子的头。那一年德克莱尔克家的账上，多了七笔干干净净的汇水。"

[[tracks.chapters.choices]]
key = "one"
text = "只写一张，担保人写自己"
next = "k2_shutters"
effects = [{ kind = "flag", flag = "rw_lieve_candles_one_bill" }]
reply = "七张票要过七双眼睛，她说太多了。她只写一张，收款人一个，数目是七家的总和，担保人一栏写的是她自己的名字。“到了那边，他们自己分。”母亲看着那一栏看了很久：“你把七家人的命，写成了一笔账。”莉芙不知道母亲是在怪她，还是在谢她。"

[[tracks.chapters]]
key = "k2_shutters"
title = "关上的百叶窗"
text = "十二月，除暴委员会的名单贴到了第五张。葡萄牙商人团体里有两户人家半夜搬走了，空房子的门上贴着封条。一个面生的人在德克莱尔克家对面租下一间阁楼，窗子正对着后屋。星期五傍晚，母亲照旧换上白桌布，拿出那两只矮烛台，打起火石。莉芙看见对面阁楼的窗帘动了一下。母亲也看见了。她的手停在半空，火石的火星落在桌布上，烫出一个小黑点。"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1567, 12, 1] }]

[[tracks.chapters.variants]]
key = "a1_lied"
when = [{ kind = "flag", flag = "rw_lieve_lied_for_plantin" }]
text = "十二月，除暴委员会的名单贴到了第五张。葡萄牙商人团体里有两户人家半夜搬走了，空房子的门上贴着封条。一个面生的人在德克莱尔克家对面租下一间阁楼，窗子正对着后屋。十一年前，她在交易所北廊对着一个书记官说过一句谎，说得像报汇率；那时候她只替一个法国装订匠担着，现在窗子后面是她母亲。星期五傍晚，母亲照旧换上白桌布，拿出那两只矮烛台，打起火石。莉芙看见对面阁楼的窗帘动了一下。母亲也看见了。她的手停在半空，火石的火星落在桌布上，烫出一个小黑点。"

[[tracks.chapters.choices]]
key = "shutters"
text = "去把百叶窗关上，让她点"
next = "k3_cover"
effects = [{ kind = "flag", flag = "rw_lieve_candles_shutters" }]
reply = "她走过去，把后屋的百叶窗一扇一扇关上，插上闩。屋里一下子暗了，只剩那两根蜡烛的光。母亲看着她，没有说谢，把蜡烛点完，手掌在火上拢了三下。往后每个星期五，莉芙都比太阳早一步去关窗。对面阁楼那个人住到开春就搬走了，走的时候，窗帘再没动过。"

[[tracks.chapters.choices]]
key = "stop"
text = "把火石接过来：今天不点了"
next = "k3_cover"
effects = [{ kind = "flag", flag = "rw_lieve_candles_stopped" }]
reply = "她把火石从母亲手里接过来，放回柜子。母亲没有争，在桌边坐下，坐了很久，看着那两只空烛台。“你外祖母说过，”她开口，声音很平，“有一年不点，就有一年记不得。”那天晚上她们没有点灯，母女俩在黑里吃完了晚饭。第二个星期五，那两只烛台被收进了箱底。"

[[tracks.chapters.choices]]
key = "choir"
text = "请唱诗班长一家星期五来家里吃饭"
next = "k3_cover"
requires = [{ kind = "flag", flag = "c13_main_lieve_hid_catholics" }]
hint = "唱诗班长欠你家的是地窖里的一夜；那一夜，你没有开地窖的门。"
effects = [{ kind = "flag", flag = "rw_lieve_candles_choir" }]
reply = "唱诗班长带着妻子和四个孩子来了。孩子们在后屋唱了一支圣母的歌，唱得整条街都听得见。桌上点着四根蜡烛，两根是母亲的，两根是唱诗班长带来的。对面阁楼的窗帘拉开了一条缝，又合上了。那个人第二个月就搬走了，委员会的名单上，始终没有母亲的名字。"

[[tracks.chapters]]
key = "k3_cover"
title = "换过皮的书"
text = "布里尔换了旗以后，城里搜得更紧了。四月的一个早上，边疆伯爵的人挨家查书，说是找北边乞丐的传单。查到德克莱尔克家，书记把书架上的书一本本抽出来，翻开，抖一抖，再塞回去。抽到一本旧小牛皮的时辰祈祷书，烫金的书脊，他翻开第一页，停住了，又往后翻了十几页。母亲站在门边，背挺得很直，两只手交握在身前，握得指节发白。书记抬起头：“这是谁的书？”"
speaker = "captain"
mood = "tense"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "date", from = [1572, 4, 15] }]

[[tracks.chapters.variants]]
key = "a1_plantin"
when = [{ kind = "flag", flag = "rw_lieve_esther_plantin" }]
text = "布里尔换了旗以后，城里搜得更紧了。四月的一个早上，边疆伯爵的人挨家查书，说是找北边乞丐的传单。查到德克莱尔克家，书记把书架上的书一本本抽出来，翻开，抖一抖，再塞回去。抽到一本旧小牛皮的时辰祈祷书，书脊上的烫金是普朗坦先生十七年前亲手压的，一点没褪。书记翻开第一页，停住了，又往后翻了十几页。母亲站在门边，背挺得很直，两只手交握在身前，握得指节发白。书记抬起头：“这是谁的书？”"

[[tracks.chapters.variants]]
key = "a2_sewn"
when = [{ kind = "flag", flag = "rw_lieve_esther_sewn" }]
text = "布里尔换了旗以后，城里搜得更紧了。四月的一个早上，边疆伯爵的人挨家查书，说是找北边乞丐的传单。查到德克莱尔克家，书记把书架上的书一本本抽出来，翻开，抖一抖，再塞回去。抽到一本旧小牛皮的时辰祈祷书，皮子是莉芙十四岁那年一针一针缝上去的，针脚歪的那一行，到今天还歪着。书记翻开第一页，停住了，又往后翻了十几页。母亲站在门边，背挺得很直，两只手交握在身前，握得指节发白。书记抬起头：“这是谁的书？”"

[[tracks.chapters.variants]]
key = "a3_heard"
when = [{ kind = "flag", flag = "rw_lieve_esther_heard" }]
text = "布里尔换了旗以后，城里搜得更紧了。四月的一个早上，边疆伯爵的人挨家查书，说是找北边乞丐的传单。查到德克莱尔克家，书记把书架上的书一本本抽出来，翻开，抖一抖，再塞回去。那本从费拉拉来的书，母亲压在冬被底下压了十几年，皮一直没换；今早听说要查，才匆匆裹上一张时辰祈祷书的旧皮，塞进书架。书记抽出它，翻开第一页，停住了，又往后翻了十几页。母亲站在门边，背挺得很直，两只手交握在身前，握得指节发白。书记抬起头：“这是谁的书？”"

[[tracks.chapters.choices]]
key = "mine"
text = "说：是我的，十四岁那年买的"
next = "k4_name"
effects = [{ kind = "flag", flag = "rw_lieve_candles_claimed" }]
reply = "“我的。”她说，“十四岁那年在旧书摊上买的，买的是皮子，里面是什么，我没细看。”书记看看她，又看看那本书，合上，递还给她：“小姐该细看看。”他在本子上记了一笔，带着人走了。母亲一直等到他们出了街口，才把交握的手松开，手心里全是指甲印。"

[[tracks.chapters.choices]]
key = "pay"
text = "往书记手里塞一袋钱"
next = "k4_name"
requires = [{ kind = "cash", ge = 800 }]
hint = "书记的胃口不小，你手里这点钱塞不满他的袖子。"
effects = [{ kind = "cash", value = -800 }, { kind = "flag", flag = "rw_lieve_candles_paid_clerk" }]
reply = "她把一袋钱放进书记手里，说书是旧货，旧货的价钱，她替他估过了。书记掂了掂，把书塞回书架，连看都没再看一眼。他们走后，母亲把书从架上取下来，抱在怀里坐了一下午。傍晚她对莉芙说：“这一回是钱。下一回，你未必有钱。”"

[[tracks.chapters.choices]]
key = "truth"
text = "说：是一本西班牙文的旧约，换了皮"
next = "k4_name"
effects = [{ kind = "flag", flag = "rw_lieve_candles_book_lost" }]
reply = "她说是一本西班牙文的旧约，换了一身好看的皮。这一句一字不假。书记把书翻到中间，翻到以斯帖那一卷，看了一会儿，读不懂，又翻回去，说圣经要送去主教那里验。书被带走了，一直没有还回来。母亲没有哭，只是那一年的星期五，她点蜡烛的时候，嘴唇动得比往年久。"

[[tracks.chapters]]
key = "k4_name"
title = "黑蜡封的信"
text = "父亲走了三年，母亲老了很多，走路要扶着墙。十月的一个晚上，她把莉芙叫到床前，从枕头底下拿出一封信，信封用黑蜡封着，没写收信人。“我死了以后再看。”她说，“里面是一个名字。我抹了一辈子。”她把信放在莉芙手里，又加了一句：“看完了，记住，再烧掉。名字是记在人身上的，不是记在纸上的。”窗外有人在唱晚祷的歌，她跟着哼了两句，哼的是拉丁文，一个音也不错。"
speaker = "captain"
mood = "tender"
cast = ["lieve"]
night = true
when = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "date", from = [1579, 10, 1] }]

[[tracks.chapters.variants]]
key = "a1_seen"
when = [{ kind = "flag", flag = "rw_lieve_name_seen" }]
text = "父亲走了三年，母亲老了很多，走路要扶着墙。十月的一个晚上，她把莉芙叫到床前，从枕头底下拿出一封信，信封用黑蜡封着，没写收信人。“我死了以后再看。”她说，“里面是一个名字。你小时候在桌上看见过一个 B，那是你表姨。这个不是。我抹了一辈子。”她把信放在莉芙手里，又加了一句：“看完了，记住，再烧掉。名字是记在人身上的，不是记在纸上的。”窗外有人在唱晚祷的歌，她跟着哼了两句，哼的是拉丁文，一个音也不错。"

[[tracks.chapters.choices]]
key = "now"
text = "说：我现在就想知道"
next = "k5_after_fall"
effects = [{ kind = "flag", flag = "rw_lieve_candles_asked_name" }]
reply = "母亲摇头，把她的手合上，合在那封信上：“现在知道了，你就要替我怕。等我不在了你再知道，就只剩记得。”她说完闭上眼，像是累了。莉芙在床边坐到她睡着，信一直攥在手里，攥得蜡封都暖了。"

[[tracks.chapters.choices]]
key = "promise"
text = "答应她：看完就烧"
next = "k5_after_fall"
effects = [{ kind = "flag", flag = "rw_lieve_candles_promised_burn" }]
reply = "她答应了。母亲点点头，伸手摸了摸她的耳坠，那枚父亲兑给她的金币。“你父亲给你的是金子，”她说，“我能给你的只有一个名字。金子能兑，名字不能。”莉芙把信收进账簿的封皮，和父亲留下的那一栏放在一起。"

[[tracks.chapters.choices]]
key = "decline"
text = "说：我不看，你自己留着"
next = "k5_after_fall"
effects = [{ kind = "flag", flag = "rw_lieve_candles_declined_name" }]
reply = "“你抹了一辈子，”她说，“我不替你翻出来。”母亲看了她很久，眼睛里有一点湿，又有一点像是放了心。她把信从莉芙手里拿回去，压回枕头底下。“也好，”她说，“我们家不知道任何名字。”她说这句话的口气，像在念一个早就背熟了的动词。"

[[tracks.chapters]]
key = "k5_after_fall"
title = "开城以后"
text = "帕尔马公爵的兵进城那天，街上很静。告示说，不肯回到罗马教会的人，有四年工夫收拾东西走。葡萄牙商人团体分成了两半：一半说要往北，去阿姆斯特丹，去汉堡，那里没人查谁家星期五点不点蜡烛；一半说留下，帕尔马公爵要的是安特卫普的钱，不是安特卫普的魂。母亲坐在窗边听着。她六十七岁了，耳朵还很灵。莉芙问她走不走。母亲说：“我这辈子只搬过一回家，七岁那年，从里斯本到这里。”"
speaker = "captain"
mood = "sad"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "date", from = [1585, 9, 15] }]

[[tracks.chapters.choices]]
key = "north"
text = "把她带去阿姆斯特丹"
next = "k6_friday"
effects = [{ kind = "flag", flag = "rw_lieve_candles_north" }]
reply = "船是她租的，箱子是她一只只封的，箱盖上用粉笔写着老街的名字。母亲一路坐在舱里，没往外看。到了阿姆斯特丹，头一个星期五，她在新屋的窗台上点了两根蜡烛，没有找角落，就摆在窗台正中。她看了很久，说：“这里的窗，太亮了。”"

[[tracks.chapters.choices]]
key = "stay"
text = "陪她留在安特卫普"
next = "k6_friday"
effects = [{ kind = "flag", flag = "rw_lieve_candles_stayed" }]
reply = "她把北边的账房托给了别人，自己留下。帕尔马公爵的人来查过一回，母亲领着他们看家里的圣母像和念珠，一样一样，念得端端正正。他们走后，母亲对她说：“你本来可以走。”她说：“账在这里。”母亲笑了：“你父亲也这么说过。”"

[[tracks.chapters.choices]]
key = "ask"
text = "问她自己想去哪里"
next = "k6_friday"
effects = [{ kind = "flag", flag = "rw_lieve_candles_both" }]
reply = "母亲想了很久，久到窗外的钟敲了两回。“我想去一个，”她说，“星期五点蜡烛不用关窗的地方。”说完她自己先笑了，“没有这样的地方，你别去找。”莉芙没有说话。那一年她在北边和南边各留了一间屋子，每个星期五，两边的窗台上都有人替她点蜡烛。"

[[tracks.chapters]]
key = "k6_friday"
title = "星期五"
text = "母亲是在一个星期五的下午走的，太阳还没落。她走以前醒过来一回，让莉芙扶她坐起来，看了看窗台。窗台那一角空着。“几点了？”她问。莉芙说快五点了。母亲点点头，像在算什么，算完了，说：“还来得及。”她没说来得及做什么，就又躺下了。屋里很静，猫趴在床脚，一动不动。柜子里有蜡烛，枕头底下还压着那封黑蜡封的信。"
speaker = "captain"
mood = "tender"
cast = ["lieve"]
when = [{ kind = "flag", flag = "c13_main_lieve_act3" }, { kind = "date", from = [1587, 3, 1] }]

[[tracks.chapters.variants]]
key = "a1_kept"
when = [{ kind = "flag", flag = "rw_lieve_candles_kept" }]
text = "母亲是在一个星期五的下午走的，太阳还没落。她走以前醒过来一回，让莉芙扶她坐起来，看了看窗台。窗台那一角空着。“几点了？”她问。莉芙说快五点了。母亲点点头，像在算什么，算完了，说：“还来得及。”她没说来得及做什么，就又躺下了。屋里很静，猫趴在床脚，一动不动。那只半个巴掌大的锡烛台在莉芙的箱子里，跟着她在海上走了三十年，三十年的星期五，她一个也没漏过。枕头底下还压着那封黑蜡封的信。"

