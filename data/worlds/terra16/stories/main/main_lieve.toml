effects = [{ kind = "fame", value = 3 }, { kind = "reputation", faction = "netherlands", value = 3 }, { kind = "flag", flag = "c13_main_lieve_route_used" }]

# c08 北去的船：目击；1585 年安特卫普开城，新教徒北迁阿姆斯特丹。
[[tracks.chapters]]
key = "c08_north"
title = "北去的船"
text = "八月十七日，安特卫普开了城门。城里的新教徒有几年工夫收拾东西离开。阿姆斯特丹的码头上，从斯海尔德河来的船一条接一条，卸下的箱子上用粉笔写着安特卫普的街名：交易所街、奥古斯丁街、鞋匠街。她站在码头上数箱子，像在数一本账的页。“又是安特卫普的！这城里的人是要把整条斯海尔德河搬过来吗？”卸货的脚夫嚷着。一个抱孩子的女人从她身边走过，低声说：“这一箱是我家的，写的是我们家的街。”"
stage = "witness"
window = [[1585, 8, 17], [1585, 12, 31]]
at = "amsterdam"
cast = ["lieve"]
mood = "sad"
news = "阿姆斯特丹的码头这几个月卸下的箱子上，写的都是安特卫普的街名。"

[tracks.chapters.default]
next = "c09_armada"
effects = [{ kind = "memory", memory = "mem-main_lieve-c08", title = "北去的船" }]

