# ── 第二幕「潮涌」1567—1577 ──────────────────────────────

# b01 名单上的名字：阿尔瓦的除暴委员会传唤名单上的人；一个名字，或一笔钱，或一个担保。
[[tracks.chapters]]
key = "b01_council"
title = "名单上的名字"
text = "九月，阿尔瓦公爵进了布鲁塞尔，“除暴委员会”开审。安特卫普市政厅门口贴出传唤的名单，第三张上有一户和她家做了二十年汇兑的人家。城南新修城堡的工地上，打桩的声音从早到晚。委员会的一个书记找上她的兑换桌：她的账上记着谁往北边汇过钱，他只要一个名字。“小姐，我们只要一个名字。您账上有那么多名字，少一个也不打紧。”莉芙：“我的账上每个名字都打紧，先生。少一个，账就不平。”他说的不像威胁，倒像一笔买卖。"
stage = "involve"
window = [[1567, 9, 5], [1567, 11, 30]]
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
news = "阿尔瓦的委员会在安特卫普市政厅门口贴了名单，城南修城堡的木桩一天打进去几十根。"

[tracks.chapters.default]
next = "b03_beggars"
effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }]

[[tracks.chapters.variants]]
key = "v_crate"
when = [{ kind = "flag", flag = "c13_main_lieve_familists_hidden" }]
text = "九月，阿尔瓦公爵进了布鲁塞尔，“除暴委员会”开审。安特卫普市政厅门口贴出传唤的名单，第三张上有一户和她家做了二十年汇兑的人家。城南新修城堡的工地上，打桩的声音从早到晚。委员会的一个书记找上她的兑换桌：她的账上记着谁往北边汇过钱，他只要一个名字。“小姐，我们只要一个名字。您账上有那么多名字，少一个也不打紧。”莉芙：“我的账上每个名字都打紧，先生。少一个，账就不平。”那箱“爱之家”的字模还压在她仓房最里面，书记的眼睛扫过仓房门时，她把账簿翻到了另一页。"

[[tracks.chapters.choices]]
key = "evacuate"
text = "连夜送名单上那户人家出城，往伦敦去。"
next = "b02_london_run"
reply = "后半夜，一辆运呢布的车出了北门，车底下躺着五个人。她坐在车夫旁边，手里攥着一张伦敦的信用状。车经过城门时，守门的兵掀开了呢布，她把信用状递上去，兵看了一眼，挥了挥手。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "flag", flag = "c13_main_lieve_evacuated" }]

[[tracks.chapters.choices]]
key = "bribe"
text = "给书记塞一笔钱，让名单晚贴三天。"
next = "b03_beggars"
requires = [{ kind = "cash", ge = 1500 }]
hint = "书记要的价，你今天付不出。"
reply = "书记把钱收进袖子，说三天。那户人家用这三天走了。书记的名字，她记在了账簿最后。收钱的时候他没有抬头，只说了一句：“这笔钱，我不记在账上。”她回：“我记。”她把钱数进书记的袖口，动作很轻。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "cash", value = -1500 }, { kind = "flag", flag = "c13_main_lieve_bribed_clerk" }]

[[tracks.chapters.choices]]
key = "keep_both"
text = "替两边守住秘密：账上该有的有，不该有的没有。"
next = "b03_beggars"
requires = [{ kind = "flag", flag = "c13_main_lieve_hid_catholics", value = false }]
check = { attr = "intrigue", base = 20, per = 7 }
reply = "她当着书记的面把账翻了一遍，每一笔都对得上，就是找不到他要的那一笔。书记合上本子，说今天到此为止。她合上账簿时，手指压在一页上，没有抬起来。书记走后，她把那一页又翻了出来，看了很久。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "reputation", faction = "netherlands", value = 2 }]
fail = { next = "b03_beggars", effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "reputation", faction = "spain", value = -3 }], news = "除暴委员会的书记在安特卫普一个兑换商的账上翻了一下午，走时在本子上记了她的名字。" }

[[tracks.chapters.choices]]
key = "choirmaster"
text = "请当年藏过的唱诗班长替你作保。"
next = "b03_beggars"
requires = [{ kind = "flag", flag = "c13_main_lieve_hid_catholics" }]
hint = "那一夜你没把唱诗班长一家藏进地窖，他犯不着替你去委员会作保。"
reply = "唱诗班长穿着白袍去了委员会，说德克莱尔克家那一夜救过教会的人。书记再没来过。那天晚上，唱诗班长的小女儿送来一盒面包，放在她的门口，盒子上写着：谢谢账房。那一个月里，她每个早上都会在市政厅的门口停一下。"
effects = [{ kind = "flag", flag = "c13_main_lieve_act2" }, { kind = "reputation", faction = "spain", value = 2 }, { kind = "reputation", faction = "netherlands", value = 2 }]

# b02 雾里的教堂门：把那户人家送到伦敦的荷兰人教会，限期到年底。
[[tracks.chapters]]
key = "b02_london_run"
title = "雾里的教堂门"
text = "初冬的伦敦，泰晤士河上的雾压到桅顶。奥斯丁修士会的旧教堂如今是伦敦的荷兰人教会，门口排着从低地来的人家。她带来的那户人家只有一张她写的信用状、一口染锅和三个孩子。教会的长老在门里说：“房子已经住满了，能收的只有名字。名字写下来，屋子等开春。”莉芙问：“开春以前的利息，谁付？”她把这句话又问了一遍，声音比刚才轻。"
at = "london"
cast = ["lieve"]
speaker = "captain"
mood = "tender"
objectives = [{ kind = "at", at = "london", text = "年底以前把那户人家送到伦敦" }]
deadline = [1567, 12, 31]

[tracks.chapters.timeout]
next = "b03_beggars"
effects = []

[[tracks.chapters.variants]]
key = "v_dyer"
when = [{ kind = "flag", flag = "c13_main_lieve_shipped_calvinists" }]
text = "初冬的伦敦，泰晤士河上的雾压到桅顶。奥斯丁修士会的旧教堂如今是伦敦的荷兰人教会，门口排着从低地来的人家。来开门的是去年她送走的那户染布匠，他围裙上还是那种靛青。她带来的那户人家只有一张她写的信用状、一口染锅和三个孩子。教会的长老在门里说：“房子已经住满了，能收的只有名字。名字写下来，屋子等开春。”莉芙问：“开春以前的利息，谁付？”她把这句话又问了一遍，声音比刚才轻。"

[[tracks.chapters.choices]]
key = "church"
text = "送到荷兰人教会门口，交给长老。"
next = "b03_beggars"
reply = "长老在登记簿上添了五个名字，又看了她一眼，在旁边注了一句“安特卫普，德克莱尔克担保”。她没有说话，只把那张信用状也夹进登记簿，以后要用时好找。长老还问她，这户人家的孩子会不会写字。她说：会，我教过。"
effects = [{ kind = "reputation", faction = "netherlands", value = 2 }]
news = "伦敦奥斯丁修士会的荷兰人教会这个冬天又收了一户安特卫普来的人家，担保的是个说话句句带数的姑娘。"

[[tracks.chapters.choices]]
key = "lodging"
text = "替他们在河边租下住处，先付半年。"
next = "b03_beggars"
requires = [{ kind = "cash", ge = 400 }]
hint = "伦敦的房东只收现钱，你手里不够半年的。"
reply = "她跟房东讲价讲到房东自己笑了。钥匙交到孩子手里那一刻，她才发现自己没问过他们的名字。回家的路上她一直在算，半年的房钱加上柴火，还剩多少。算到最后，她把数字划掉，只记了一句：先问名字。"
effects = [{ kind = "cash", value = -400 }, { kind = "fame", value = 1 }]

[[tracks.chapters.choices]]
key = "books"
text = "把他们的账也一起理好，让他们在伦敦重开铺子。"
next = "b03_beggars"
requires = [{ kind = "skill", skill = "double_entry", ge = 60 }]
hint = "你算得出他们欠多少，却理不清英格兰人的记账法。"
reply = "她用英格兰人看得懂的格式重抄了一遍账。重抄的时候，她在每一笔旁边加了一个小小的日期。英格兰人以为是她的习惯，只有她知道那是还款的日子。第二天一早，就有布商来问她要不要在伦敦开一个账房。"
effects = [{ kind = "reputation", faction = "england", value = 2 }, { kind = "flag", flag = "c13_main_lieve_london_ties" }]

# b03 两封借据：海上乞丐的书记与阿尔瓦的军需官同一天来借钱。
[[tracks.chapters]]
key = "b03_beggars"
title = "两封借据"
text = "冬天的弗利辛恩码头，咸风把告示的角吹得直拍木桩：阿尔瓦要收“十分之一税”，卖一样东西抽一成。同一天，两个人来敲她船舱的门。一个是奥兰治亲王的书记，揣着亲王签发的私掠许可，替“海上乞丐”借钱买火药：“殿下的船现在没有港口，以后会有。”莉芙：“‘以后’算不得一个日子，先生。”另一个是阿尔瓦的军需官，替城堡里的兵买过冬的粮，也要借：“西班牙的钱一向晚到，可从来不会不到。”两张借据摊在同一张桌上，一张盖着奥兰治的印，一张盖着西班牙的。两人都说“以后一定还”，却都说不出是哪一天。"
at = "flushing"
cast = ["lieve"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1569, 1, 1] }]
deadline = [1570, 4, 30]

[tracks.chapters.timeout]
next = "b04_theatrum"
effects = []

[[tracks.chapters.variants]]
key = "v_gresham"
when = [{ kind = "flag", flag = "c13_main_lieve_gresham_share" }]
text = "冬天的弗利辛恩码头，咸风把告示的角吹得直拍木桩：阿尔瓦要收“十分之一税”，卖一样东西抽一成。同一天，两个人来敲她船舱的门。一个是奥兰治亲王的书记，揣着亲王签发的私掠许可，替“海上乞丐”借钱买火药：“殿下的船现在没有港口，以后会有。”莉芙：“‘以后’算不得一个日子，先生。”另一个是阿尔瓦的军需官，替城堡里的兵买过冬的粮，也要借：“西班牙的钱一向晚到，可从来不会不到。”两张借据摊在同一张桌上，一张盖着奥兰治的印，一张盖着西班牙的。桌角压着格雷沙姆从伦敦来的信，女王的债连本带利结清了；他照安特卫普的样子在伦敦盖了一座交易所，问她要不要在那边开户。两人都说“以后一定还”，却都说不出是哪一天。"

[[tracks.chapters.choices]]
key = "beggars"
text = "借给海上乞丐。"
next = "b04_theatrum"
requires = [{ kind = "cash", ge = 3000 }]
hint = "这一笔，你的钱箱借不出。"
reply = "书记把借据折好，说等亲王有了港口，头一个请她去收账。她在借据背面写了一个日期，说过了这天就算利息。书记走了几步又回头，问她到底收不收利息。她说：“收，不收我的账就平不了。”"
effects = [{ kind = "cash", value = -3000 }, { kind = "reputation", faction = "netherlands", value = 3 }, { kind = "reputation", faction = "spain", value = -3 }, { kind = "flag", flag = "c13_main_lieve_lent_beggars" }]

[[tracks.chapters.choices]]
key = "alba"
text = "借给阿尔瓦的军需官。"
next = "b04_theatrum"
requires = [{ kind = "cash", ge = 3000 }]
hint = "军需官要的也是三千现银，你的钱箱里现在拿不出。"
reply = "军需官的印盖得很重；他走时说西班牙会记得她。她回了一句：记得不算钱。他在门口停了一下，说这笔钱会记在阿尔瓦公爵的账上。她点头，说公爵的账她一向算得清。他临走时还回头看了一眼那张借据，像在数上面的数。"
effects = [{ kind = "cash", value = -3000 }, { kind = "reputation", faction = "spain", value = 3 }, { kind = "reputation", faction = "netherlands", value = -3 }, { kind = "flag", flag = "c13_main_lieve_lent_alba" }]

[[tracks.chapters.choices]]
key = "neither"
text = "谁也不借，只把两边出的价都记下来。"
next = "b04_theatrum"
reply = "两个人在门口撞了个照面，都不肯先让路。她把两张借据上的数抄进账簿，原件还给了他们。抄完最后一笔，她把两张借据并排放在桌上：一张的印是金色的，一张的印是红的，颜色不一样，数却一样。"
effects = []

# b04 先上哪片海：奥特柳斯的地图与安娜的上色坊，颜料钱与色标里的路。
[[tracks.chapters]]
key = "b04_theatrum"
title = "先上哪片海"
text = "五月下旬，奥特柳斯的地图集刚在安特卫普印出来：几十幅一样大小的图装订成册，翻一页就从葡萄牙到了日本。他妹妹安娜的上色坊里，十几个女工一笔一笔给图上色，黄给沙洲，绿给森林，蓝颜料最贵，要先付钱。“每张图我都写明是从谁那里来的。这一张，可以写从你的钱来。”奥特柳斯说。安娜看着莉芙：“蓝颜料比金子贵，小姐。您要哪片海先上色？”莉芙：“先上我借过钱的那几片。”安娜压低声音，说图边的色标谁也不细看。在那里藏一条路、点一个记号，比藏在箱子里还稳。"
at = "antwerp"
cast = ["lieve", "abraham_ortelius"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1570, 5, 20] }]
deadline = [1570, 12, 31]

[tracks.chapters.timeout]
next = "b05_brielle"
effects = []

[[tracks.chapters.choices]]
key = "fund"
text = "出钱给安娜的上色坊。"
next = "b05_brielle"
requires = [{ kind = "cash", ge = 1500 }]
hint = "蓝颜料的钱你这会儿垫不起。"
reply = "安娜把一张墨卡托在杜伊斯堡印的世界图卷起来塞给她，说是谢礼：“越往北越宽，别信北边。”图卷的一角还沾着上色坊的蓝颜料，蹭在她的手指上，洗了两天才洗掉。安娜还问她，要不要在图的背面签一个名字。她说：不用，色标就够了。"
effects = [{ kind = "cash", value = -1500 }, { kind = "item", item = "mercator_chart", qty = 1 }, { kind = "reputation", faction = "netherlands", value = 1 }]
news = "奥特柳斯的地图集在安特卫普开卖了，上色坊的女工说，有一笔颜料钱是交易所那个姑娘付的。"

[[tracks.chapters.choices]]
key = "route"
text = "把一条送人出城的路，藏进图边的色标里。"
next = "b05_brielle"
check = { attr = "intrigue", base = 20, per = 7 }
reply = "她和安娜商量出一套颜色：哪段堤能走、哪个闸夜里不关，都藏在图边一排小方块里。那排小方块有十二个，每一个颜色都对应一道闸口，安娜说，只有会看账的人才认得出来。安娜看完，把颜料盒推到她面前，说：先画这一排。"
effects = [{ kind = "flag", flag = "c13_main_lieve_map_route" }]
fail = { next = "b05_brielle", effects = [], news = "奥特柳斯的上色坊里有人把色标涂乱了一排，安娜说要重印那一页。" }

[[tracks.chapters.choices]]
key = "atlantis_mark"
text = "在亚速尔以西的海上，替那个英格兰学者点一个小记号。"
next = "b05_brielle"
requires = [{ kind = "flag", flag = "c13_main_lieve_dee_met" }]
hint = "你不认得会在那片海上点记号的人。"
reply = "她用最细的笔在亚速尔西南点了一个金点，安娜问那是什么，她说是一笔还没到期的账。金点很小，淹没在图边的蓝色里。她盯着它看了很久，才放下笔，心里想着那个英格兰学者的符号。"
effects = [{ kind = "flag", flag = "c13_main_lieve_map_atlantis" }]

# b05 换了颜色的旗：目击，布里尔与弗利辛恩的旗换色。
[[tracks.chapters]]
key = "b05_brielle"
title = "换了颜色的旗"
text = "四月一日，海上乞丐拿下了布里尔。几天后弗利辛恩的市民赶走了西班牙的守军，城门上挂起奥兰治的旗。码头上，私掠船一条接一条靠岸，甲板上堆着从西班牙船上缴来的酒桶与呢布，水手在跳板上唱歌。莉芙站在木桩边看。一个私掠船的水手从她身边跑过，喊着：“拿下布里尔那天是愚人节——西班牙人到今天还以为是个笑话！”一个妇人在船边骂：“旗换了颜色，税还是一样收。”"
stage = "witness"
window = [[1572, 4, 1], [1572, 5, 31]]
at = "flushing"
cast = ["lieve"]
mood = "cheerful"
news = "海上乞丐拿下了布里尔，弗利辛恩的人跟着关上了城门，码头上的旗一夜换了颜色。"

[tracks.chapters.default]
next = "b06_ming_silver"
effects = []

