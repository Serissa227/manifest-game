[[tracks.chapters.choices]]
key = "open_vault"
text = "打开钱库，拿银子赎下这一条街。"
next = "b09_fury_echo"
requires = [{ kind = "cash", ge = 3000 }]
hint = "钱库里剩下的银子，不够买下一条街。"
reply = "她把银子一袋一袋递出门，领头的兵在街口插了一根长矛：这条街买过了。后来她数过，剩下的银子只够买下一扇门，她把那扇门留给了自己。门框上的粉笔字，她一直没有擦掉，那是她自己写的一个数。"
effects = [{ kind = "cash", value = -3000 }, { kind = "fame", value = 3 }]
news = "西班牙之怒那几天，安特卫普交易所旁有一条街没被烧，街口插着一根长矛。"

[[tracks.chapters.choices]]
key = "save_books"
text = "抢出账册和三只猫，从后门走。"
next = "b09_fury_echo"
reply = "她抱着账册钻过后门，两只猫从她裙底窜出去。第三只是在河边才找到的，蹲在一只翻倒的木桶上。抱着账册的手臂一直在抖。等她走到河边，才发现有一本账的封皮烧焦了一角。她把账册放在胸口，走得很慢。"
effects = [{ kind = "memory", memory = "mem-main_lieve-b08", title = "三只猫" }]

[[tracks.chapters.choices]]
key = "lead_out"
text = "领邻居去河边，挤上停在那里的船。"
next = "b09_fury_echo"
check = { attr = "command", base = 20, per = 7 }
reply = "她站在码头的木桩上喊名字，一家一家点；船开时她数过，一个没少。喊到最后嗓子只剩一丝气，她还是一个一个把名字喊完，像在对账。船上的人问她自己怎么不上船，她说：账还没数完。"
effects = [{ kind = "fame", value = 5 }, { kind = "reputation", faction = "netherlands", value = 2 }]
fail = { next = "b09_fury_echo", effects = [{ kind = "fame", value = 2 }], news = "安特卫普出事那几天，有个姑娘在斯海尔德河边喊着名字往船上塞人，喊哑了嗓子。" }

# b09 留下，或者过海：结果回响（hub，无 at），两项按 HIST 旗标互斥，恰好一项可选。
[[tracks.chapters]]
key = "b09_fury_echo"
title = "留下，或者过海"
text = "一个星期以后，她坐在交易所楼上的窗边，把这几天的账一笔一笔补进账簿。补到一半停下来，看斯海尔德河上来来往往的船。窗台上落了一层灰，她用指尖在上面画了一个小圈，又抹掉了。船夫在窗下喊：“过了潮就不等人了！”一个孩子拽着他的袖子问：“那条船开了没有？”账可以补。城，补不补得上？"
cast = ["lieve"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1576, 11, 11] }]

[[tracks.chapters.variants]]
key = "v1_london"
when = [{ kind = "flag", flag = "c13_main_lieve_london_ties" }]
text = "一个星期以后，她坐在交易所楼上的窗边，把这几天的账一笔一笔补进账簿。补到一半停下来，看斯海尔德河上来来往往的船。窗台上落了一层灰，她用指尖在上面画了一个小圈，又抹掉了。船夫在窗下喊：“过了潮就不等人了！”一个孩子拽着他的袖子问：“那条船开了没有？”伦敦那户人家托人捎信来，说楼上给她留了一间屋。账可以补。城，补不补得上？"

[[tracks.chapters.variants]]
key = "v2_jan"
when = [{ kind = "flag", flag = "c7_bond_jan_landing_friend" }]
text = "一个星期以后，她坐在交易所楼上的窗边，把这几天的账一笔一笔补进账簿。补到一半停下来，看斯海尔德河上来来往往的船。窗台上落了一层灰，她用指尖在上面画了一个小圈，又抹掉了。船夫在窗下喊：“过了潮就不等人了！”一个孩子拽着他的袖子问：“那条船开了没有？”扬托人捎话，书都搬出来了，一本没湿。账可以补。城，补不补得上？"

[[tracks.chapters.choices]]
key = "stay"
text = "留下，把交易所的门重新打开。"
next = "b10_scales"
requires = [{ kind = "flag", flag = "h47_antwerp_fury_arrears_paid" }]
reply = "城没有被劫。她第一个把兑换桌搬回柱廊下，在行情板上写下那天的英镑价，比上礼拜高了一点。柱廊下的人看她一眼，没说话，只是把每个人的票据拿出来，排在她的桌子旁。她把兑换桌的腿擦了一遍，才坐下。"
effects = [{ kind = "flag", flag = "c13_main_lieve_antwerp_spared" }]

[[tracks.chapters.choices]]
key = "london"
text = "去伦敦，把账房搬过海。"
next = "b10_scales"
requires = [{ kind = "flag", flag = "h47_antwerp_fury_arrears_paid", value = false }]
reply = "交易所的柱廊塌了一半。她把剩下的账册装进两只箱子，箱盖上写着：伦敦，暂存。箱子上了船，她回头看了一眼交易所的门楣，铭文被烟熏黑了一半，她认得那几个字。车夫问她要不要回头，她说：不回。"
effects = [{ kind = "flag", flag = "c13_main_lieve_to_london" }]

# b10 秤上的龙印：莉斯贝特的秤揭开比安卡的身份（秘密，不进见闻）。
[[tracks.chapters]]
key = "b10_scales"
title = "秤上的龙印"
text = "春天，安特卫普铸币所的试金房，炉火映着一排秤。白银检验师莉斯贝特戴着浆得笔挺的白麻帽，把一叠从劫后废墟里拾来的西班牙票据一张张验火漆。“火漆是热那亚的，蜡里掺了朱砂。银子我验了二十年，这种蜡只见过三回。”她把其中一张放上秤：票背面的火漆里，一条龙把尾巴绕在自己颈上，背脊裂开一道红十字。这种印，只在热那亚寡妇比安卡·马雷账房里的票上出现过。“莉芙，她借出去的不全是钱。那家账房替人收账，收账的人自称龙骑士团，这三回都是他们的票。”莉芙心里想：我跟她赌了十几年，一直以为桌上只有我们两个。"
at = "antwerp"
cast = ["lieve", "liesbeth_devries"]
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1577, 3, 1] }]
deadline = [1578, 4, 30]

[tracks.chapters.timeout]
next = "c01_catino"
effects = []

