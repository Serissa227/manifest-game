# ── 第一幕「启航」1557—1566 ──────────────────────────────

# a00 门槛见闻：只在莉芙一家是主角时才会走到这里；默认设 c13_main_lieve。
[[tracks.chapters]]
key = "a00_gate"
title = "带账簿上船的人"
text = "正月初的安特卫普交易所门口，石阶结了霜，门楣上那行铭文被呵气熏得发白。跑单的伙计和卖热酒的女人在柱廊下议论：兑换商德克莱尔克家的女儿昨天带着一本旧账簿上了一条小卡拉维尔，舱里只压了十包呢布。“那丫头上船前押了我两个斯图弗。我收了——她那张嘴，我赢了也讨不着好。”伙计说，她把每块行情板背了一遍才走，说回来要对账。"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "antwerp"
cast = ["lieve"]
mood = "cheerful"
news = "安特卫普交易所门口都在说，兑换商德克莱尔克家的女儿开春前就带着账簿出海了。"
when = [{ kind = "flag", flag = "c12_voyage_lieve" }]

[tracks.chapters.default]
next = "a01_default"
effects = [{ kind = "flag", flag = "c13_main_lieve" }]

# a01 停付：历史现场，缺省（你不在时）父亲压着票没卖。
[[tracks.chapters]]
key = "a01_default"
title = "四成的票"
text = "六月，马德里的信差把西班牙王室停付的诏令带进交易所。大厅里的西班牙汇票一个上午就成了废纸。热那亚人坐在柱廊下，按票面四成收票，只问几时交割，从不还价。“四成，现钱。小姐，明天就是三成。”莉芙问：“到期日是哪天？你们收了这票，打算几时去马德里兑？”父亲的兑换桌上压着一叠西班牙的票，家里摊在明面上的账，一夜少了一半。大厅另一头，英格兰的代理人格雷沙姆正四处找肯借过桥钱的人。莉芙心里算了一笔：不讲价的人，是知道底价的人。他们赌王室会把旧票换成新的年金。"
stage = "involve"
window = [[1557, 6, 10], [1557, 7, 31]]
at = "antwerp"
cast = ["lieve", "thomas_gresham"]
speaker = "captain"
mood = "tense"
news = "停付的消息到了安特卫普，热那亚人坐在交易所柱廊下四成收西班牙的票，一整天没还过价。"

[tracks.chapters.default]
next = "a02_second_ledger"
effects = [{ kind = "flag", flag = "c13_main_lieve_held_paper" }]

[[tracks.chapters.choices]]
key = "sell_now"
text = "现在就按四成把西班牙的票卖给热那亚人。"
next = "a02_second_ledger"
requires = []
reply = "现钱落进钱箱。父亲一下午没说话。傍晚票价跌到三成半，她在小账簿上记下这个数，没有得意。第二天的行情板上，西班牙票的价又跌了一截，她没有去看。她数了两遍，才把钱锁进钱箱。"
effects = [{ kind = "cash", value = 4000 }, { kind = "flag", flag = "c13_main_lieve_sold_paper" }]
news = "停付那天，安特卫普的兑换商德克莱尔克家头一个把西班牙的票卖给了热那亚人。"

[[tracks.chapters.choices]]
key = "hold"
text = "压着不卖，赌王室会把旧票换成新年金。"
next = "a02_second_ledger"
reply = "她把那叠票锁回钱箱，在账簿上写“押着”二字，后面画一个问号。父亲拍了拍她的肩，什么也没说。第二天一早，交易所里的人都在问西班牙票还能不能卖，她只摇头，把钥匙转了两圈。"
effects = [{ kind = "flag", flag = "c13_main_lieve_held_paper" }]

[[tracks.chapters.choices]]
key = "bridge"
text = "去找格雷沙姆借一笔过桥钱，撑到秋天的集市。"
next = "a02_second_ledger"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "他借了，条件是她替他记一个月的英镑汇率，一天三次，不许错一位。她把小账簿翻到新的一页。那一个月里，她每天三次站在格雷沙姆的桌边，念一个数，他写一个数，两人谁也不肯看谁的脸。"
effects = [{ kind = "cash", value = 2000 }, { kind = "flag", flag = "c13_main_lieve_gresham_known" }]
fail = { next = "a02_second_ledger", effects = [], news = "格雷沙姆听完只说：等你有东西押给我再来——交易所的人都听见了。" }

# a02 第二本账：普通章，来自 1557-08-01；期限到了父亲写信，自动进入 a03。
[[tracks.chapters]]
key = "a02_second_ledger"
title = "第二本账"
text = "八月的夜里，父亲去布鲁塞尔讨账，莉芙在账房找印泥。手指在钱箱的夹层里碰到一本薄薄的羊皮账簿，字是父亲的。从前年那张被拒付的汇票起，每一页都是红字：借了富格尔代理人的钱，押了老宅，利滚着利。红字中间夹着几行不像账的东西：阿尔马登的汞，巴塞尔的方子，炉砖四百块，每一行后面记着一张空白汇票的编号。最后一页写着秋天巴瓦集市结账日要还一万二，字越写越小，旁边的页角上还有一行更小的：“集市以前一定还上。”再旁边画着一只小猫，像他给自己打的气。家里的三只流浪猫蹲在桌上，一只踩翻了墨水，墨一路淌到账簿边上。页脚另有一句：“别让莉芙看见。”"
at = "antwerp"
cast = ["lieve"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1557, 8, 1] }]
deadline = [1557, 12, 31]

[tracks.chapters.timeout]
next = "a03_hole"
effects = [{ kind = "flag", flag = "c13_main_lieve_father_wrote" }]

[[tracks.chapters.variants]]
key = "v_held"
when = [{ kind = "flag", flag = "c13_main_lieve_held_paper" }]
