# C11：接受与拒绝均可选择；逆转无地点、材料、窗口或随机门槛，无奖励。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[tracks]]
key = "c11_inherit_cain_kin"
name = "该隐的族类"
kind = "request"
start = "choice"
auto = true

[[tracks.chapters]]
key = "choice"
title = "夜里的借据"
text = "威尼斯的夜里，一家只在无月的晚上开门的放贷铺子，把一张写满旧名字的借据摊在桌上。利息不收钱，收的是人情与把柄。那人说，你读过的书够多，该懂得欠账的人最怕什么。签下这一纸的人，夜里走路不必点灯，白天却总在檐下躲日头。"
choices = [{ key = "accept", text = "同意接下这笔血债", reply = "那人把借据折成两半，一半递给你，一半收进自己的袖子。从今夜起，雾会向你靠拢，夜里看得比平时远，正午的日头却刺得眼睛发酸。", next = "done", effects = [{ kind = "transform", lineage = "cain_kin" }], requires = [] }, { key = "decline", text = "先不签，留着现在的身份", reply = "借据没有签，仍留在桌上。那人没有动怒，只把烛芯拨亮了一点，说下个月还在这里，账不急着算。", next = "done", effects = [], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 30 }, { kind = "books", ge = 5 }]

[[tracks]]
key = "c11_reverse_cain_kin"
name = "解除传承"
kind = "request"
start = "release"
auto = false

[[tracks.chapters]]
key = "release"
title = "血债清账"
text = "账房里没有窗，烛火压得很低。那人把账本翻到最后一页，一笔笔划掉欠下的血债，墨干了才抬起头，说明天正午，你可以站到太阳底下去。"
choices = [{ key = "release", text = "卸下记号，还做凡人。", reply = "手臂上的记号一点点淡下去，最后只剩一道白印。夜里的力气也一起走了，白天的太阳照在手背上，只是普通的暖。", next = "done", effects = [{ kind = "transform" }], requires = [] }]
when = [{ kind = "lineage", lineage = "cain_kin" }]

[[tracks]]
key = "c11_inherit_lilith_daughters"
name = "莉莉丝的女儿们"
kind = "request"
start = "choice"
auto = true

[[tracks.chapters]]
key = "choice"
title = "沿海的夜鸟"
text = "威尼斯的夜里，运河边的石阶上坐着一个女人，长发散到水面。她说你在书商那里买的书太多，名字都记进了账，该去沿海诸城看看她的姐妹。她能让你在夜里飞过屋脊，只是飞之前，要先解开头发。"
choices = [{ key = "accept", text = "接受，学她们的夜飞。", reply = "夜飞的本事你接下了，门闩拦不住你，还能化作一只猫头鹰停在钟楼上。门楣上若写着三位天使的名字，你就进不去那户人家。", next = "done", effects = [{ kind = "transform", lineage = "lilith_daughters" }], requires = [] }, { key = "decline", text = "不接，照旧做白天的人。", reply = "你谢过她，站在石阶上没有动。她没有勉强，只把长发撩到肩后，朝运河的方向走了。你还是白天的人，门闩拦得住你。", next = "done", effects = [], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 30 }, { kind = "books", ge = 5 }]

[[tracks]]
key = "c11_reverse_lilith_daughters"
name = "解除传承"
kind = "request"
start = "release"
auto = false

[[tracks.chapters]]
key = "release"
title = "潮声里束发"
text = "堤岸上风很大。你把散开的长发一点点拢起来，一圈圈绕成发辫，然后面朝大海，说了一句“回去吧”。浪头在石堤下碎开，身上那股轻飘飘的劲儿，也像潮水一样退了。"
choices = [{ key = "release", text = "重新束发，回到白天。", reply = "长发重新编成一股，夜里的飞行停了，门闩又拦得住你。只是那晚站在水边，耳边还响着海浪的声音，很久才散。", next = "done", effects = [{ kind = "transform" }], requires = [] }]
when = [{ kind = "lineage", lineage = "lilith_daughters" }]

[[tracks]]
key = "c11_inherit_good_society"
name = "东方夫人的\"好会\""
kind = "request"
start = "choice"
auto = true

[[tracks.chapters]]
key = "choice"
title = "夫人的请帖"
text = "威尼斯的一条窄巷里，几个女人请你喝茶。桌上摆着草药与一小碗清水，她们说东方夫人的“好会”不收钱，只收一份人情。米兰的案卷里有两个妇人，供认自己夜里去过这样的聚会，后来都被处死了。"
choices = [{ key = "accept", text = "入会，学草药与祝福。", reply = "草药的配方与祝福的话都教给了你，那只刻着草叶的木碗也归你收着。屋里收拾得整洁的人家，你可以上门祝福；死了的鸡鸭，能让它再站起来一会儿。宗教裁判所的人来查，你的名字会先上他们的单子。", next = "done", effects = [{ kind = "transform", lineage = "good_society" }], requires = [] }, { key = "decline", text = "客气地谢绝这份邀请。", reply = "你没收那只木碗，只说家里的药箱已经够用。东方夫人的人没有恼，只在你门口的台阶上放了一把晒干的艾草，便转身走了。往后的夜里，你仍是寻常人家的一员。", next = "done", effects = [], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 30 }, { kind = "books", ge = 5 }]

[[tracks]]
key = "c11_reverse_good_society"
name = "解除传承"
kind = "request"
start = "release"
auto = false

[[tracks.chapters]]
key = "release"
title = "归还木碗"
text = "巷子尽头的门半开着，里面的女人正在收拾碗筷。你把那只刻着草叶的木碗还给她，她没有问为什么，只点点头，说夫人那边自会有人替你去说。门关上以后，巷子里只剩下潮湿的石板味。"
choices = [{ key = "release", text = "退出东方夫人的好会。", reply = "你退出了那个聚会，此后不再有人上门请你喝茶。药方还留在脑子里，可祝福的话说出口就和普通的话一样，牲畜也不会再站起来。", next = "done", effects = [{ kind = "transform" }], requires = [] }]
when = [{ kind = "lineage", lineage = "good_society" }]

[[tracks]]
key = "c11_inherit_wind_sellers"
name = "北方卖风的人"
kind = "request"
start = "choice"
auto = true

[[tracks.chapters]]
key = "choice"
title = "三结皮绳"
text = "卑尔根的码头上，一个裹着厚皮袄的芬兰人向你兜售三条皮绳，每条都打着三个结。他说解开第一个，来的是和风；解开第二个，风就猛了；第三个……他没有说完，只把绳子往你手里一塞，又去招呼下一条船。"
choices = [{ key = "accept", text = "收下三条绳，学怎么解结。", reply = "三条皮绳你都收下了。第一个结和第二个结，你学会了怎么解；第三个结你记在心里，没有解。往后出神的时候，身边不能有活物碰到你的身子。", next = "done", effects = [{ kind = "transform", lineage = "wind_sellers" }], requires = [] }, { key = "decline", text = "不买，推回绳子。", reply = "绳子没有收，你把它推回摊子上。那人咧嘴笑了，把皮绳收进怀里。码头上的风大，他说，你会再来买的。", next = "done", effects = [], requires = [] }]
at = "bergen"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 30 }, { kind = "books", ge = 5 }]

[[tracks]]
key = "c11_reverse_wind_sellers"
name = "解除传承"
kind = "request"
start = "release"
auto = false

[[tracks.chapters]]
key = "release"
title = "风停之后"
text = "船舱里很暗，三条皮绳摊在桌上。你照卖绳人说的顺序，先解开第一个结，又解开第二个，最后一个结解得很慢，指节都发白。结散开的时候，窗外的风停了，连帆布都不响了。"
choices = [{ key = "release", text = "解开三个结。", reply = "三个结依次解开，绳子里的风散了，海面重新平下来。那之后你不再能卖风，出神的本事也没了，身边的人想碰你就碰你。", next = "done", effects = [{ kind = "transform" }], requires = [] }]
when = [{ kind = "lineage", lineage = "wind_sellers" }]
