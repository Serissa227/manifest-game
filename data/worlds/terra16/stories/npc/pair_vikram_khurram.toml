# 马先喝水（pair_vikram_khurram）——配角线，标签 BL；恋爱线（先对头，再心照不宣，1564 年成为恋人，1566 年重逢）。
# 人物：维克拉姆（vikram，1530-12-20 生，纯 BL），维查耶纳伽尔的马匹经纪人，常驻巴特卡尔替王国买战马，嘴快、爱讲价，一急就算账；
#       胡拉姆（khurram，1531-10-10 生，纯 BL），往来巴特卡尔的波斯马商，慢性子，谈买卖之前先看马有没有水喝。
#       全线两人 32—35 岁，早已成年；crush 出现在 1563 年末（两个成年人之间），lovers 与一个吻出现在 1564 年 5—6 月（两人都满 18，且晚于 1557-01-01）。
# 依据（史实）：维查耶纳伽尔帝国靠西海岸港口（巴特卡尔等）进口波斯与阿拉伯战马；1565 年 1 月塔利科塔之战，维查耶纳伽尔大败，都城被洗劫数月，逃难的人涌向海边。
# 依据（原创）：两人与全部情节；水桶、蹄边的碎石与松掉的蹄铁、四匹不肯凑数的马、替马夫凑的回乡路钱、拴马桩、失散的第五个马夫（乌代）。
# 待核：塔利科塔之后巴特卡尔马市的光景与内陆路况为原创想象，正文一律用传闻口吻。
# 秘密：cast 没有写明，不另编。见闻里不写两人的私事。
# 口头禅：胡拉姆“先喂马，再问谁出钱。”只在 meeting 用一次；维克拉姆“账有尾款，人得有退路。”只在 choice 用一次；其余章节只换说法回响。
# 缺省走向（玩家不在场也照样发生）：1563 年初马市上为先喂马还是先讲价吵架，维克拉姆第二天提了水桶来（rivals）
#   → 1563 年末一块蹄边的碎石与一枚松蹄铁，他不再骑最漂亮的马出来（crush）
#   → 1564 年 5—6 月为四匹不肯凑数的马被罚钱，吵完一起替马夫凑回乡的路钱，当晚在马厩里成为恋人，一个吻（lovers，设 _together）
#   → 1565 年 2—3 月传言（塔利科塔）→ 4—6 月胡拉姆要进内陆找马夫、维克拉姆要带账簿先撤：缺省是两人吵到半夜，天亮分头走，各在拴马桩上拴一根绳
#   → 1566 年开春在巴特卡尔的马厩重逢（圆满）。没有坏结局。
#   帮助（_helped，探两条路）：epilogue 变体里胡拉姆骑回来的是维克拉姆最好的那匹马；
#   帮助（_matched，陪胡拉姆进内陆）：epilogue 变体里拴马桩上多了第五个马夫的名字。三个分支都通向同一个结局。
# 共享旗标：写 c7_pair_vikram_khurram_together（together 章）、_helped、_matched；不读任何外部旗标。
# 日程与 ties（整合方）：两人日程都在巴特卡尔（bhatkal），无需改动；
#   cast/ties.toml 的 vikram_khurram 现为 since [1564, 12, 31]，与本线 1564 年 5—6 月的恋人落点对不上，请改为 since [1564, 6, 30]；
#   note 里“德干诸苏丹合兵的消息先到”仍可用（对应 1565 年初的 turning 章）。

[[tracks]]
key = "pair_vikram_khurram"
name = "马先喝水"
kind = "request"
start = "pair_vikram_khurram_meeting"
auto = true
cast = ["vikram", "khurram"]

# 相识：1563 年初，巴特卡尔马市。一匹累坏了的马，一只水桶。
[[tracks.chapters]]
key = "pair_vikram_khurram_meeting"
title = "先喂马"
text = "海上颠了二十天的灰马刚下船，腿还在打晃。维查耶纳伽尔来的经纪人维克拉姆围着它转了三圈，已经催到第四遍：“七岁口，牙我看过了，你到底要多少——”“先喂马，再问谁出钱。”波斯马商胡拉姆头也没抬，蹲下去解开嚼子，牵着马往水槽走。“日头都偏了！”“它喝，你等。”马喝了很久。胡拉姆听着咽水的声音，直到够了，才拍拍手站起来：“现在报价吧。”第二天一早，维克拉姆提着一只木桶来了，往灰马蹄边一放，嘴上照旧：“价钱还是高。”可他先让马喝了水。"
stage = "witness"
window = [[1563, 1, 15], [1563, 3, 31]]
at = "bhatkal"
cast = ["vikram", "khurram"]
speaker = "khurram"
mood = "cheerful"
news = "巴特卡尔马市上，维查耶纳伽尔的经纪人跟波斯马商为先喂马还是先讲价吵了一架，第二天自己提了桶水来。"

[tracks.chapters.default]
next = "pair_vikram_khurram_closer"
effects = [{ kind = "tie", a = "vikram", b = "khurram", relation = "rivals" }]

# 靠近：1563 年末，同一片马市。碎石与松蹄铁；crush 只算心照不宣。
[[tracks.chapters]]
key = "pair_vikram_khurram_closer"
title = "松掉的蹄铁"
text = "沟不宽，那匹枣红马却前蹄刨地，死活不过。维克拉姆讲得正兴头：“胸口有旋毛，我外祖父那一路传下来的看法，这样的马最——”胡拉姆已经蹲到马腿边，从蹄叉里抠出一粒带棱的碎石，在掌心滚了滚，又指指另一只蹄子：“铁松了，钉子翘着。它不犟，它疼。”维克拉姆的话断在半截。他蹲下去看那枚钉子，看了半天：“……我昨天怎么没摸到。”“昨天你在讲价。”那匹漂亮的枣红马从此留在了棚里。马市上再见到维克拉姆，他牵的是一匹还要慢慢练的小马，嘴里照旧跟胡拉姆争草料该称几斤，散的时候，走的是同一条路。"
stage = "witness"
window = [[1563, 10, 1], [1563, 12, 31]]
at = "bhatkal"
cast = ["vikram", "khurram"]
speaker = "vikram"
mood = "tender"
news = "巴特卡尔那个爱吵架的经纪人如今不骑最好看的马了，听说是被波斯马商从一块碎石上教会的。"

[tracks.chapters.default]
next = "pair_vikram_khurram_together"
effects = [{ kind = "tie", a = "vikram", b = "khurram", relation = "crush" }]

# 落点：1564 年 5—6 月，马厩。只有缺省一条路；两人成为恋人（lovers），一个吻为止。
[[tracks.chapters]]
key = "pair_vikram_khurram_together"
title = "同一个方向"
text = "王国要的战马一批比一批多，买主催得像追债。胡拉姆把四匹蹄铁松了的马牵到一边，不肯凑数。维克拉姆气得算盘珠子啪啪响：“罚金多少你知道吗？四匹，整整四匹！”“知道。”“知道你还——”吵到天黑，两人照样一起把钱袋倒在草料堆上，数出马夫们回乡的路钱，一份一份用布包好。马厩里只剩一盏灯。维克拉姆靠着柱子，半天才开口：“做了这么多年买卖，我从来没先离开过谁。”胡拉姆没接话。他把最后一个布包放好，走过去，握住了他的手。过了一会儿，吻了他。"
stage = "witness"
window = [[1564, 5, 1], [1564, 6, 30]]
at = "bhatkal"
cast = ["vikram", "khurram"]
speaker = "khurram"
mood = "tender"
news = "巴特卡尔的马厩里那两个天天吵架的马贩子，听说一起替马夫们凑了回乡的路钱，吵完还是往同一个方向走。"

[tracks.chapters.default]
next = "pair_vikram_khurram_turning"
effects = [{ kind = "tie", a = "vikram", b = "khurram", relation = "lovers" }, { kind = "flag", flag = "c7_pair_vikram_khurram_together" }]

# 转折（传闻）：1565 年 2—3 月。塔利科塔的败讯。
[[tracks.chapters]]
key = "pair_vikram_khurram_turning"
title = "塔利科塔"
text = "海边的人都在传：维查耶纳伽尔在塔利科塔一场大仗里败了，都城被洗了个遍，火烧了好几个月。往西海岸逃的人一天比一天多，巴特卡尔的马市上拴满了从内陆跑出来的马，鞍子还没卸，没有人问价，也没有人买。有人说，那些马里有几匹，去年冬天刚从这儿卖出去。"
stage = "rumor"
window = [[1565, 2, 1], [1565, 3, 31]]
at = "bhatkal"
cast = ["vikram", "khurram"]
mood = "sad"
news = "维查耶纳伽尔在塔利科塔大败，都城被洗劫，巴特卡尔马市上全是从内陆跑出来的马，没人买。"

[tracks.chapters.default]
next = "pair_vikram_khurram_choice"
effects = []

# 抉择：1565 年 4—6 月，马厩。玩家可以探两条路、陪胡拉姆进内陆，或者不插手。
[[tracks.chapters]]
key = "pair_vikram_khurram_choice"
title = "城破的消息"
text = "马厩里摊着账簿，旁边是胡拉姆手绘的内陆地图，圈着四个村子，是他失散的马夫最后捎信的地方。“我去。”胡拉姆在给一匹马刷背，没回头，“人在那边。”“山路上有溃兵，还有雨。”维克拉姆把算盘推到一边，“我带剩下的马夫和账簿走海边，一天也不能再拖。账有尾款，人得有退路。”“那你走你的退路。”刷子的声音停了。维克拉姆先转过身，看着我：“这两条路，你替我们都探一探。”"
stage = "involve"
window = [[1565, 4, 1], [1565, 6, 30]]
at = "bhatkal"
cast = ["vikram", "khurram"]
speaker = "vikram"
mood = "tense"
news = "塔利科塔以后，巴特卡尔那两个马贩子一个往山里去找人，一个往海边撤，听说走之前在同一根拴马桩上各拴了根绳。"

[tracks.chapters.default]
next = "pair_vikram_khurram_epilogue"
effects = []

[[tracks.chapters.choices]]
key = "two_roads"
text = "内陆和海边两条路都探一遍，给他们一张能走的图"
reply = "我背着三天的干粮，把内陆那条道走到头一个渡口，又沿海岸数了一遍能歇脚的村子，回来画了一张纸，上面满是记号。内陆的路三天后会被雨冲断，海边那条还通。胡拉姆看完，把出发的日子提前了两天。维克拉姆没拦他，把自己最好的那匹枣红马牵了出来：“骑它。路上让它先喝。”"
next = "pair_vikram_khurram_epilogue"
effects = [{ kind = "flag", flag = "c7_pair_vikram_khurram_helped" }, { kind = "affinity", person = "khurram", value = 4 }, { kind = "affinity", person = "vikram", value = 3 }, { kind = "memory", memory = "mem-pair_vikram_khurram-map", title = "画满记号的纸" }]
news = "巴特卡尔有人沿着两条路各走了一遍，画回一张满是记号的纸，听说波斯马商看完就把动身的日子提前了。"

[[tracks.chapters.choices]]
key = "guide"
text = "陪胡拉姆进内陆找人，再把他带回来"
reply = "我陪胡拉姆进了内陆。头一个村子空了，第二个村子烧了半边，第三个村子的井边坐着两个马夫，认出他以后站起来又蹲下去，哭得说不出话。前后找回四个，第五个只有一个村民说见过，往北去了。回来的路上胡拉姆一句话没说。到了巴特卡尔城外，他开口问的头一句是：“维克拉姆走了没有？”"
next = "pair_vikram_khurram_epilogue"
effects = [{ kind = "flag", flag = "c7_pair_vikram_khurram_matched" }, { kind = "affinity", person = "khurram", value = 5 }, { kind = "affinity", person = "vikram", value = 2 }, { kind = "memory", memory = "mem-pair_vikram_khurram-grooms", title = "找回的四个马夫" }]
news = "巴特卡尔有个人陪着波斯马商进了内陆，找回四个失散的马夫。听说回城那天，他头一句问的是经纪人走了没有。"

[[tracks.chapters.choices]]
key = "watch"
text = "不插手，坐在马厩门口等他们吵完"
reply = "我坐在门口的草料堆上。两人从账簿吵到雨，又从雨吵回账簿，嗓子都哑了，灯芯剪了两回。天亮时胡拉姆背着水囊往山里去，维克拉姆赶着剩下的马夫和车往海边去。走之前，他们在门口那根拴马桩上各拴了一根绳，一根在上，一根在下，两根都没动过。"
next = "pair_vikram_khurram_epilogue"
effects = [{ kind = "affinity", person = "vikram", value = 1 }, { kind = "affinity", person = "khurram", value = 1 }]

# 重逢：1566 年开春，马厩。三个分支同一个结局；帮助时多一个物件。
[[tracks.chapters]]
key = "pair_vikram_khurram_epilogue"
title = "马厩里重逢"
text = "开春了，马厩里还是草料和马汗的味道。维克拉姆先到的，蹲在水槽边给一匹小马饮水，水是自己提来的，桶还是那只旧桶。门口响起脚步，一队风尘仆仆的人牵着马进来。是胡拉姆，身后跟着他找回来的马夫。两人隔着水槽，在拴马桩旁边站了很久。最后是胡拉姆先开口：“马喝过水了？”“喝过了。”维克拉姆的声音有点哑，“你呢？”"
stage = "witness"
window = [[1566, 1, 15], [1566, 3, 31]]
at = "bhatkal"
cast = ["vikram", "khurram"]
speaker = "vikram"
mood = "tender"
news = "巴特卡尔的马厩里，那两个马贩子又凑到了一块，听说重逢那天波斯马商开口第一句问的是马喝水了没有。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_pair_vikram_khurram_helped" }]
text = "开春了，马厩里还是草料和马汗的味道。维克拉姆先到的，蹲在水槽边给一匹小马饮水，水是自己提来的，桶还是那只旧桶。门口响起脚步。一队风尘仆仆的人进了门，领头的是胡拉姆，身后跟着他找回来的马夫，他骑的正是那匹枣红马，瘦了一圈，蹄铁却是新的。维克拉姆先去摸马蹄。摸完，才抬头看他。“铁没松。”胡拉姆说，“马喝过水了？”“喝过了。”维克拉姆的声音有点哑，“你呢？”"

[[tracks.chapters.variants]]
key = "matched"
when = [{ kind = "flag", flag = "c7_pair_vikram_khurram_matched" }]
text = "开春了，马厩里还是草料和马汗的味道。维克拉姆先到的，蹲在水槽边给一匹小马饮水，水是自己提来的，桶还是那只旧桶。门口响起脚步，一队风尘仆仆的人牵着马进来。是胡拉姆，身后跟着四个马夫。他没急着说话，先走到拴马桩前，掏出小刀，在桩上刻了一个名字。“那是谁？”维克拉姆问。“乌代。第五个。”胡拉姆吹掉木屑，“马喝过水了？”“喝过了。”维克拉姆的声音有点哑，“你呢？”"
