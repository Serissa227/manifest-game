# 抉择：1556 年秋，小屋。第三次上门，要写最后一封回信。
[[tracks.chapters]]
key = "tie_kikuchiyo_kogo_choice"
title = "把笔交回去"
text = "柿子熟了，门口落了一地。城北那户人家第三次上门，话说得直了：这回要一句准话，写明白，别再让人猜。小督磨好墨，铺开长纸：“长歌，三升。这回我写到没人能读歪。”她翻开米账，找到两年前那一页，页边抄着那句“我的鞠还没落地”，指尖点在“还”字上：“当初我就该拦你。”笔尖刚蘸饱，一只手按住了纸角。鞠千代的手指在抖，声音也在抖：“这回……这回我自己写最后一句。”小督的笔停在半空。她看看他，又看看站在门口的我。"
stage = "involve"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "kyoto"
cast = ["kikuchiyo", "kogo"]
speaker = "kikuchiyo"
mood = "tense"
news = "京都飞鸟井家的少年要写最后一封回信，听说他拦住了代笔的姑娘，说末尾一句想自己写。"
rumor_days = 60

