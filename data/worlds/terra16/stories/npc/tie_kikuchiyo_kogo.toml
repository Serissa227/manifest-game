# 相识：1554 年春夜，柿子树下的小屋。
[[tracks.chapters]]
key = "tie_kikuchiyo_kogo_meeting"
title = "不敢念的回信"
text = "城北一户人家托媒人来飞鸟井家提亲，家里只回了一句话：让鞠千代自己回一首歌，明早当着来人的面念出来。天黑以后，他抱着一小袋米敲开柿子树下的小屋：“替、替我写。”“一升一首，改稿另算。”小督头也不抬，灯下写了半个时辰，把折好的纸推给他。他念到第二句，嗓子像被鞠堵住了，试了几回，回回停在同一个地方。小督从米袋里舀出半升推回去：“米只买得到字。念不出口的那半，我不收钱。不敢念的地方，你自己改。”他蹲在门槛上改，纸边被拇指捏得起了毛。改到第五回，那一句成了“我的鞠还没落地”。小督点点头：“这首现在像你了。改稿另算，算你半升。”他把纸摊在膝盖上，眼睛定在门外那棵柿子树上，从头念起，这一回念到了最后一句。"
stage = "witness"
window = [[1554, 3, 1], [1554, 6, 30]]
at = "kyoto"
cast = ["kikuchiyo", "kogo"]
speaker = "kogo"
mood = "cheerful"
night = true
news = "京都公家町有人上门替飞鸟井家的少年提亲，少年拿着一首自己改过好几回的歌回了过去。"
rumor_days = 60

[tracks.chapters.default]
