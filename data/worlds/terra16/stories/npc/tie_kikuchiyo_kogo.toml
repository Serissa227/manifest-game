# 落点：1557 年春，鞠会散场的院子里。
[[tracks.chapters]]
key = "tie_kikuchiyo_kogo_landing"
title = "朋友的报酬"
text = "飞鸟井家的鞠会散场，樱花落了一院子。嫡出的兄长们都推说嗓子不好，没人肯念首歌收场，目光落到廊下那个少年身上。鞠千代站起来，袖口攥得发皱，念了一首自己写的歌，念得很慢，到最后一句，声音没有抖。满院子静了一会儿，才有人拍手。他穿过院子，走到墙角替飞鸟井家誊诗稿的小督面前，把一袋米放在砚台旁边：“这是报酬。”小督掂了掂，解开口看了一眼，一升，足数。“这首不是我写的。”“是、是谢你教我改的那五回。”他脸红到耳根。小督没再推回去，解开袋口抓了一把，看了看米色：“今年的新米。改稿另算，下回收你钱。”"
