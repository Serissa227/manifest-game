# 转折（传闻）：1555 年夏，那句回歌被读歪了。
[[tracks.chapters]]
key = "tie_kikuchiyo_kogo_turning"
title = "传错了意思"
text = "京都的女房局这个夏天只议一件事：飞鸟井家那首回歌。歌里那句“我的鞠还没落地”，城北那户人家读成了“还小，再等两年”，老老实实等了一年，这个夏天实在等不住，又托人上了门。女房们嚼着嚼着添了一层：少年脸皮薄，嘴上说没落地，心里早接住了。“害羞的人都这么写，这叫欲迎还拒。”一位女房说得斩钉截铁，没人拦她。鞠场边的人说，这一夏天少年一次也没来踢，春天踢飞的那只鞠卡在樱树杈里，一直没人去取。有人在墙根听见他对着墙说：“我没有答应。”说了好几遍，墙没理他。有人拿这些闲话去问柿子树下替人写信的姑娘，她正低头磨墨：“歌是他自己改的，我只是点了头。”问的人又问她收了多少米，她报了个数，比实收的多半升。"
stage = "rumor"
window = [[1555, 5, 1], [1555, 8, 31]]
at = "kyoto"
cast = ["kikuchiyo", "kogo"]
mood = "tense"
news = "飞鸟井家少年那首回绝的歌被人读成了欲迎还拒，京都的女房们传得有声有色，都说他是害羞，其实应了。"
rumor_days = 60

