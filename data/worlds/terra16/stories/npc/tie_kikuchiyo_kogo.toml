text = "飞鸟井家的鞠会散场，樱花落了一院子。嫡出的兄长们都推说嗓子不好，鞠千代站起来，念的是一首新写的，不是去年秋天那首。他念得很慢，到最后一句，声音没有抖。小督站在人群最后面，袖着手，一个字没漏地听完，头一个转身，从侧门出去了。第二天一早，柿子树下的门槛上放着一袋米，压着一张歪歪扭扭的字条：“一升，足数。谢五回。”树后传来一声：“报、报酬。”半个脑袋探出来，又缩回去。小督拎起米袋，对着树干说：“字难看，念得不难看。”字条被她夹进了书里。"
