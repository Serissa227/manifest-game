# C7 配角线（故事 2.0，A5 / E37 契约）：替你写不替你答——鞠千代 × 小督，朋友。
# 走向：雇主→朋友（一升米买字，到一升米谢她教他自己改）。
# C21b 改（2026-11-12，Claude Opus）：“改三遍”改成不整齐的数（改到第五回；手册 4.2 第 14 条）；鞠千代的口头禅原句只在 bond_kikuchiyo C2，这里换掉；
#   落点的段尾（规范 N2 的例句“樱花落在诗稿上，她把米袋压了上去”）改掉；“手停了停”去掉。剧情、旗标、效果不动。
# 标签：友情（学院同学之间的友情线；全线不写心动、不写暧昧，也没有任何恋爱效果）。cast/ties.toml 里旧的 BG 标签应去掉，见整合须知。
# 人物：鞠千代（1541-04-10，飞鸟井家的庶子，蹴鞠的神童，romance with=f，心动对象另有其人，归主角线）；
#   小督（1540-06-16，地下官人家的见习，宫外赁屋替人代笔，纯 GL）。生年相差不到一年，窗口内鞠千代 12 到 16 岁、小督 13 到 16 岁。轨道 academy = true。
# 依据·史实：飞鸟井家是蹴鞠与和歌的师范家；鞠场四角种樱、柳、枫、松；公家子弟年少时就有人上门提亲，回答由本人用一首歌作。
# 依据·原创：两人的交往；柿子树下的小屋（与 tie_new_kogo_mae_sumi、tie_new_ayame_kogo 里小督赁的是同一间，在上京）；
#   “一升一首，改稿另算”的价钱；那句“我的鞠还没落地”和它被读歪的经过；末句把“已”写成“己”的错字；鞠会上小督受雇誊诗稿。
# 待核：十六世纪中叶长歌已经少见，这里取“长篇的回歌”之意，只在鞠千代的口头与小督的价目里出现，不涉及格律。
# 缺省走向（玩家始终不在场）：1554 年春鞠千代请小督代写回绝提亲的歌，改到第五回才念得出口（friends）→ 1555 夏那句“还没落地”被对方读成“过两年再议”，
#   女房局把它传成欲迎还拒（传闻）→ 1556 秋对方第三次上门，小督写全篇，鞠千代在末尾添了一句，对方读懂了 →
#   1557 春鞠会上他当众念了自己写的歌，把一升米放到小督的砚台旁，说是“改了五回”的报酬（friends，设 _landing，记回忆）。
#   插手：劝小督只查错字（设 _helped，鞠千代情谊 +5）；请小督照旧写全篇（设 _ghost，小督情谊 +3，落点章用 variant）。
#   三条路都通向同一个落点，关系效果相同。
# 旗标：设 c7_tie_kikuchiyo_kogo_helped / _ghost / _landing；落点章只读本文件的 _ghost。不读外部旗标。
# 日程：不改。
# 去重与秘密：七夕梶叶归 bond_kikuchiyo A1；小督替菖代笔归 bond_kogo 与 tie_new_ayame_kogo，本线只写她为鞠千代代笔，不提别的委托人；
#   鞠千代“会背整本《古今集》却怕在人前念长歌”只出现在正文的动作里，见闻不写。

