# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BG（男女恋人；陆归帆 romance=any，卡塔丽娜 romance=m）。
# 人物：陆归帆（lu_guifan，1536-11-27 生，濠镜的葡语通事，租约上的小字从不含混带过）；
#       卡塔丽娜·佩雷拉（catarina_pereira，1537-12-05 生，定居澳门的葡萄牙船长之女，熟悉每一户开门的时辰）。
#       生年差 1 年；相识（1557 春）时 20 与 19 岁，靠近（1560 夏）23 与 22 岁，落点（1574 年初）37 与 36 岁，门禁全过。
#       两人 1557—1590 都在澳门，窗口都晚于 1557-01-01，不用改日程。
# 依据·史实：1557 年前后葡萄牙人获准在澳门定居；1570 年代起，葡萄牙人每年向香山县交五百两银子的惯例，
#       后来入县库、算作地租（说法不一，正文一律用“听说”的口吻，不写名目的来历）。
# 依据·原创：两家的反对、通事与船长之女的相识与往来、货单上“某某之女”的半行字、鱼栏的后墙争执、
#       妈阁庙前榕树下的铜钥匙、山脚下的新屋与门牌、租约第七条、旧铜灯与年糕。
#       待核：1573 年澳门缴租的具体做法（正文只写“五百两”“地租”“县里的库”）；1573 年澳门是否已有烟斗（回忆标题沿用任务单的写法）。
#       不写 cast persona 里陆归帆对“地租起初是什么名目”的秘密。卡塔丽娜与林蕙的生意归 tie_new_catarina_pereira_lin_hui，本文件不写。
# 缺省走向：meeting（1557 春，货单上不写“某某之女”）→ closer（1560 夏，翻软了的一句，crush）→
#       turning（1573 春，五百两算地租的传闻）→ choice（1573 秋，妈阁前的钥匙；缺省：两人自己约定）→
#       together（1574 年初，新屋门牌，lovers + 旗标）。圆满，没有坏结局。
# 玩家能做的：choice 里去两家说和（mediated）、庙前把风（matched）、旁观。只改回应、好感、回忆与 together 的变体，不改结局；
#       两人的恋爱写在 together 的 default 里，与玩家在不在场无关。
# 旗标：写 c7_pair_lu_guifan_catarina_pereira_together（共享）、_mediated、_matched（本文件 together 的变体读）。不读外部旗标。
# 整合：cast 日程里澳门写作 "macau"，端口表与本文件用 "macao"，请核对；
#       cast/ties.toml 的 lu_guifan_catarina_pereira 现为 lovers、since = [1558, 12, 31]，与本线对不上，
#       应改为 since = [1574, 3, 31]（together 的窗口止日），如要展示心照不宣，可另加一段 crush（自 1560-08-31 起、到 1574-03-31 止）。

[[tracks]]
key = "pair_lu_guifan_catarina_pereira"
name = "地租以外的约"
kind = "request"
start = "pair_lu_guifan_catarina_pereira_meeting"
auto = true
cast = ["lu_guifan", "catarina_pereira"]

# 相识（1557 春）：货单上不写“某某之女”。
[[tracks.chapters]]
key = "pair_lu_guifan_catarina_pereira_meeting"
title = "不写某某之女"
text = "一船胡椒靠了澳门的码头，陆归帆摊开货单，笔悬在纸上：“货主写谁？”佩雷拉船长刚要张口，他女儿先报了名字，只报她自己的。老账房咳了一声，船长沉下脸，唐人那边的掌柜也皱起眉。卡塔丽娜不理，指甲点着秤上的数：“麻袋受了潮，折一成半，从我名下扣。”她算得比账房还快。陆归帆已经落了半行“佩雷拉船长之女”。“先把名字写并排，再谈是谁家的。”她说。他看了看那半行字，把纸揉了，另取一张。这一回没写那几个字。"
stage = "witness"
window = [[1557, 3, 1], [1557, 5, 31]]
at = "macao"
cast = ["lu_guifan", "catarina_pereira"]
speaker = "catarina_pereira"
mood = "cheerful"
news = "澳门码头上，葡萄牙船长的女儿让唐人通事把货单写在她自己名下，不写她父亲的，两家长辈脸都黑了。"

[tracks.chapters.default]
next = "pair_lu_guifan_catarina_pereira_closer"
effects = []

# 靠近（1560 夏）：翻软了的一句，心照不宣。
[[tracks.chapters]]
key = "pair_lu_guifan_catarina_pereira_closer"
title = "翻软了的一句"
text = "佩雷拉家的后墙和邻居的鱼栏吵了半夜，请陆归帆来翻话。鱼栏老板一拍墙头，骂了一句“番鬼的墙脚也敢伸过来”。陆归帆转身对佩雷拉家的人说：“他说，墙脚像是过了界。”卡塔丽娜站在门后，听得懂唐话：“他说的是‘番鬼’。”陆归帆耳根红了：“两家的话，我都原样说——这一句没有。”“为什么？”“那是骂你家的。”她没再问。第二天晌午她走进通事棚，请他吃面，钱先拍在桌上：“下回骂人的话也翻，我听得惯。”"
stage = "witness"
window = [[1560, 6, 1], [1560, 8, 31]]
at = "macao"
cast = ["lu_guifan", "catarina_pereira"]
speaker = "lu_guifan"
mood = "tender"
news = "澳门的唐人通事替两家翻话时把一句骂人的话翻软了，被葡萄牙船长的女儿当场听出来。"

[tracks.chapters.default]
next = "pair_lu_guifan_catarina_pereira_turning"
effects = [
  { kind = "tie", a = "lu_guifan", b = "catarina_pereira", relation = "crush" },
]

# 转折（1573 春，传闻）：五百两算了地租，两人想自己租屋。
[[tracks.chapters]]
key = "pair_lu_guifan_catarina_pereira_turning"
title = "五百两"
text = "码头上的人这阵子都在算同一笔账：葡萄牙人每年交给香山县的五百两银子，听说从今往后算作地租，进的是县里的库。那澳门的地算谁的、屋算谁的，两边的人都在重新数。茶摊上又传一桩小的：替人翻话的那个陆通事，同佩雷拉船长的女儿想自己租一间屋，租约都拿去请人看过了。两家的老人没一个点头。"
stage = "rumor"
window = [[1573, 4, 1], [1573, 6, 30]]
at = "macao"
cast = ["lu_guifan", "catarina_pereira"]
mood = "tense"
news = "葡萄牙人交给香山县的五百两从此算地租了，澳门的屋子算谁的又得重算；听说有对年轻人想自己租屋，两家都不答应。"
rumor_days = 60

[tracks.chapters.default]
next = "pair_lu_guifan_catarina_pereira_choice"
effects = []

# 抉择（1573 秋）：妈阁庙前的钥匙。
[[tracks.chapters]]
key = "pair_lu_guifan_catarina_pereira_choice"
title = "妈阁前等一等"
text = "妈阁庙前的榕树下，卡塔丽娜问陆归帆：“搬出旧屋，你肯不肯？”他一条一条数：“家里要我娶同乡的姑娘。你家的神父说这不合规矩。澳门的地租年年变，租约上的小字，我每看一回怕一回。”她听完，从袖里摸出一把铜钥匙，还没磨亮：“屋我看好了，山脚下，隔壁卯时才开门，吵不着。你数的这些，我都记着。”两人一齐转过来看我。"
stage = "involve"
window = [[1573, 9, 1], [1573, 11, 30]]
at = "macao"
cast = ["lu_guifan", "catarina_pereira"]
speaker = "catarina_pereira"
mood = "tense"
news = "妈阁庙前那棵榕树底下，听说有个葡萄牙姑娘拿着一把钥匙等一个唐人通事，等了大半天。"

[tracks.chapters.default]
next = "pair_lu_guifan_catarina_pereira_together"
