text = "新屋的门牌上写着两个名字，一个汉字，一个葡萄牙字，写在同一行。两家都没来人，只有一只竹篮搁在门槛上，橘子压着红纸，送篮子的人没进门。陆归帆把租约挂在门后，小字一条不漏，他念给她听：“第七条，墙脚往后退半尺。”卡塔丽娜说：“从今往后，这间屋里的话，你不用翻。”他闩上门，转身时她已经凑上来，吻了他。"
