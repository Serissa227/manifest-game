# 落点（1574 年初）：新屋的门牌，恋人。
[[tracks.chapters]]
key = "pair_lu_guifan_catarina_pereira_together"
title = "自己的门牌"
text = "新屋的门牌上写着两个名字，一个汉字，一个葡萄牙字，写在同一行。两家都没来人，邻居倒来了不少。陆归帆把租约挂在门后，小字一条不漏，他念给她听：“第七条，墙脚往后退半尺。”卡塔丽娜说：“从今往后，这间屋里的话，你不用翻。”他闩上门，转身时她已经凑上来，吻了他。"
