# 谁的坏脾气（tie_extra_08_gu_zhao_genroku）——配角线，标签：无（宿敌线）；类别 rival。
# 人物：顾昭（gu_zhao，1530-06-02 生），俞大猷麾下的把总，1556—57 年随明朝招抚使团短住平户；
#       南蛮屋源六（genroku，1534-08-12 生），堺的南蛮商家之子，到平户买货。
#       两人都是纯 BL，各有恋人（顾昭×弥七见 pair_gu_zhao_yashichi，源六×若昂见 pair_genroku_joao_fernandes）；
#       本线只写宿敌，不写暧昧，不碰汪直受招抚的信与弥七（归 pair_gu_zhao_yashichi）。
#       全线都在成年以后（1556 年顾昭 25 岁、源六 21 岁），关系只用 rivals。
# 依据（史实）：1555—57 年胡宗宪遣使赴日招抚汪直，汪直的据点在五岛与平户；种子岛铳（铁炮）由堺的工匠打造，
#       在东亚海上转卖；堺由会合众（商人的合议会）自治；堺的商家好茶，茶会上生客先上淡的、熟客才上浓的。
# 原创：二十挺铳的货单、货单背面“船工抵债”的条款与十二个船工、两份各写各的证词、买主赖账。
#       买主只写“汪直船队里的一个名字”，不给名字。
# 待核：明朝使团在平户停留的月份（正文只写“要回去了”“开春的船”）；堺商人到平户买火器的细节；会合众收商号账册的做法。
# 缺省走向（无人插手）：仓库里初次对账（rivals）→ 货单背面的条款闹成传闻 → 使团临行各写一份证词，不情愿地在对方的纸上签名，
#       十二个船工放走一半 → 1557 年春使团启程，源六提茶来送，顾昭照旧嫌淡（rivals，旗标 _landing，回忆“可以信的宿敌”）。
#   _helped（两份证词原样各带一份）：买主后来赖账，两张纸一摆赖不掉；落点变体里他把银子送来，顾昭把那碗茶喝了。
#   _freed（我拿货替十二个船工还债）：落点变体里十二个船工站在码头，源六一个个点名递茶。
# 共享旗标：读 无；写 c7_tie_extra_08_gu_zhao_genroku_landing、_helped、_freed（本文件内的变体读 _helped、_freed）。
# 日程（整合方改 cast，都是故事内的出行）：顾昭现有日程 1553—56 舟山、1557 起台州，章节窗口 1556-03 至 1557-06 在平户，
#       宜把舟山段缩到 1556-02-28 止，插一段 1556-03-01 至 1557-06-30 的平户，台州从 1557-07-01 起
#       （同日期的段不能重叠；与 pair_gu_zhao_yashichi 的日程改动一起协调）。
#       源六现有日程 1553—69 堺，宜加一段平户的出行：1556-03-01 至 1557-06-30（或分两段买货季）。
#       cast/ties.toml 的 extra_08_gu_zhao_genroku：since 现为 [1568,12,31]，与本线 1556 年相识冲突，宜改到 [1556,6,30]；
#       note 里“头一回意见一样、一起划掉”与本线不符，宜改成“顾昭要拿十二个船工，源六关了仓门，后来在对方的证词上签了名”。
# 秘密：cast 未写明与本线相关的秘密；顾昭没告发冒功一事不进本线，更不进见闻。

[[tracks]]
key = "tie_extra_08_gu_zhao_genroku"
name = "谁的坏脾气"
kind = "request"
start = "tie_extra_08_gu_zhao_genroku_meeting"
auto = true
cast = ["gu_zhao", "genroku"]

# 相识：1556 年春夏，平户的仓库。一碗不肯喝的淡茶，一张二十挺铳的货单。
[[tracks.chapters]]
key = "tie_extra_08_gu_zhao_genroku_meeting"
title = "不肯喝的茶"
text = "平户海边的仓库里，二十挺种子岛铳躺在稻草上，枪管抹了油。明朝使团的把总顾昭蹲下去，一挺一挺数过去；堺来的南蛮屋源六在旁边捧着茶盘，笑得像收了定钱。“军爷远道来，先喝口茶。头一回见面，没敢上浓的，怕呛着您。”顾昭看了一眼碗：“淡。”碗没碰，直接开口：“兄台，买主是谁？几时付的银？成色如何？铳是哪条船卸的？”“军爷这话太咸了，得拿茶冲一冲。”顾昭不理，抽走货单。买主那一栏，写的是汪直船队里的名字，底下压着朱印，顾昭拿拇指一抹，印泥早干透了。两人站着把单子对到最后一行，两只草垫始终空着。顾昭把货单拍在桌上：“印信是真的，人也得活着回来。”“货可以晚，人别失约。”源六说着，把那碗没人碰的茶端走了。"
stage = "witness"
window = [[1556, 3, 1], [1556, 6, 30]]
at = "hirado"
cast = ["gu_zhao", "genroku"]
speaker = "genroku"
mood = "tense"
news = "平户海边的仓库里，明朝来的军官和堺来的商人对着二十挺铳的货单站了一下午，一碗茶放凉了，没人碰。"

[tracks.chapters.default]
next = "tie_extra_08_gu_zhao_genroku_turning"
effects = [{ kind = "tie", a = "gu_zhao", b = "genroku", relation = "rivals" }]

# 转折（传闻）：1556 年夏秋，货单背面的小字。顾昭要拿十二个人，源六关了仓门。
[[tracks.chapters]]
key = "tie_extra_08_gu_zhao_genroku_turning"
title = "船工不是抵物"
text = "码头上传开了：那张二十挺铳的货单，翻过来背面还有一行小字——买主付不出银子，就拿船上十二个船工抵债，唐人倭人都在里头。渡口的人说，顾军爷看到那一行，当场就要拿人：“替贼运铳的，十二个，一个不落，顾某全带走。”卖鱼的说，堺来的源六笑着把仓门关了，隔着门板回话：“军爷，在这张纸上画押的是买主。那十二位只是被写了进去，一个也没画过押。”有人说他护的是那十二个人，也有人说他护的是自己手里的抵押。反正那天夜里，一个在门里，一个在门外，隔着门板吵到嗓子都哑了。"
stage = "rumor"
window = [[1556, 7, 1], [1556, 9, 30]]
at = "hirado"
cast = ["gu_zhao", "genroku"]
mood = "tense"
news = "平户那张二十挺铳的货单，背面竟写着拿十二个船工抵债；明朝的军官要拿人，堺来的商人把仓门关了。"

[tracks.chapters.default]
next = "tie_extra_08_gu_zhao_genroku_choice"
effects = []

# 抉择：1556 年冬，使团临行。两份说法不一样的证词推到“我”面前。
[[tracks.chapters]]
key = "tie_extra_08_gu_zhao_genroku_choice"
title = "各留一份证词"
text = "使团定下了开春回去。顾昭在仓房里摊开军报，源六在对面铺开商号的账册，同一批铳，两样说法：军报写“查获”，账上写“寄存”。“你写你看见的，我写我看见的，”源六蘸着墨，“谁也别替谁改。”顾昭冷着脸点头，手指戳在账册上：“十二个人的名字，你漏了一行。你也得签上你漏看的地方。”“军报里那个‘贼’字，下得也太快了些。”两张纸一左一右，被推到了我面前。"
stage = "involve"
window = [[1556, 10, 1], [1557, 1, 31]]
at = "hirado"
cast = ["gu_zhao", "genroku"]
mood = "tense"
news = "使团定了开春回去，平户的仓房里，明朝军官和堺来的商人各写各的证词，写完还得在对方的纸上签字。"

[tracks.chapters.default]
next = "tie_extra_08_gu_zhao_genroku_landing"
effects = []
news = "平户的仓房里，明朝军官和堺来的商人在对方的证词上签了名，签得老大不情愿；十二个船工放走了一半。"

[[tracks.chapters.choices]]
key = "both_testimonies"
text = "两份证词一个字不动，我分头送：军报交使团，账册送堺的会合众。"
reply = "“原样，一个字不动。”我说。顾昭盯着我把军报卷好，哼了一声。源六对着军报里那个“贼”字苦笑，还是画了押。军报进了使团的行囊，账册我带去堺，交到会合众手里。后来那个买主翻脸赖账，两边把两张纸往桌上一摆，他连“记岔了”都没得说。"
next = "tie_extra_08_gu_zhao_genroku_landing"
effects = [{ kind = "flag", flag = "c7_tie_extra_08_gu_zhao_genroku_helped" }, { kind = "affinity", person = "gu_zhao", value = 3 }, { kind = "affinity", person = "genroku", value = 3 }]
news = "平户有人把明朝军官的军报和堺商人的账册一字不改地分头送出，军报进了使团的行囊，账册去了堺的会合众。"

[[tracks.chapters.choices]]
key = "free_boatmen"
text = "拿我船上的货，替那十二个船工把债还了。"
reply = "我叫人从船上抬来货，在仓门口一箱箱点清。源六提笔，把十二个名字一个个划掉，划到最后一个，仓后的门开了，十二个人低着头走出来。源六合上账：“这笔另起一页，不跟黑船的账混。”顾昭绷着脸：“这不合规矩。”“规矩管不到船主的货。”源六答得飞快。顾昭鼻子里哼了一声，嘴角抽了一下；源六也笑出声来。两人撞见彼此的笑，同时板起脸。"
next = "tie_extra_08_gu_zhao_genroku_landing"
effects = [{ kind = "flag", flag = "c7_tie_extra_08_gu_zhao_genroku_freed" }, { kind = "affinity", person = "genroku", value = 5 }]
news = "平户有位船主拿自己的货替十二个船工还了债，堺来的商人把十二个名字一笔划掉，明朝军官在旁边说不合规矩。"

# 落点：1557 年春夏，使团启程。宿敌的关系写在缺省里，玩家不在场也照样发生。
[[tracks.chapters]]
key = "tie_extra_08_gu_zhao_genroku_landing"
title = "可以信的宿敌"
text = "使团的船要开了。源六一早就等在平户码头上，一手提铁壶，一手拎着两只茶碗。顾昭走过来，源六倒了一碗递上去。顾昭低头看看：“淡。”“下回您来，我泡浓的。”“下回我来，还是查你的货。”顾昭踏上跳板，走到一半又回过头，“货单要是再写船工抵债，顾某第一个找你。”“这话像催债。”源六举着碗，笑眯眯地点头，“我收下了。”船离了岸，他把那碗淡茶一口喝光，皱起眉：“……真是淡。”"
stage = "witness"
window = [[1557, 3, 1], [1557, 6, 30]]
at = "hirado"
cast = ["gu_zhao", "genroku"]
speaker = "gu_zhao"
mood = "cheerful"
news = "明朝使团离开平户那天，堺来的商人提着一壶茶到码头送行，军官照旧说茶淡，临上船还撂下一句狠话。"

[tracks.chapters.default]
next = "done"
effects = [{ kind = "tie", a = "gu_zhao", b = "genroku", relation = "rivals" }, { kind = "flag", flag = "c7_tie_extra_08_gu_zhao_genroku_landing" }, { kind = "memory", memory = "mem-tie_extra_08_gu_zhao_genroku-landing", title = "可以信的宿敌" }]

[[tracks.chapters.variants]]
key = "freed"
when = [{ kind = "flag", flag = "c7_tie_extra_08_gu_zhao_genroku_freed" }]
text = "使团的船要开了。码头上多站了一排人，是那十二个船工，有唐人，有倭人，衣裳还是旧的。顾昭一眼没看他们。源六提着铁壶，抱着一摞茶碗，一个个点名，点一个，递一碗，十二碗递完，才轮到顾昭：“军爷，您的。”“淡。”“下回您来，我泡浓的。”“下回我来，还是查你的货。货单要是再写船工抵债，顾某第一个找你。”十二个人低头喝茶，没有一个皱眉。"

[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_tie_extra_08_gu_zhao_genroku_helped" }]
text = "使团的船要开了。源六一早就等在码头上，一手提铁壶，一手捏着张折好的纸：“那位买主昨天把银子送来了，当着两份证词的面，一锭一锭称过，一文不少。”“成色呢？”顾昭问。“验过了，足色。”顾昭接过茶碗，一口喝完，皱眉：“淡。”“您喝了？”“渴。”“下回您来，我泡浓的。”“下回我来，还是查你的货。货单要是再写船工抵债，顾某第一个找你。”他踏上跳板，没再回头。"
