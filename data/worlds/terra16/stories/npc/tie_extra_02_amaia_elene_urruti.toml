# 转折（传闻）：1566 年正月，红湾回来的水手死了，寡妇喊“女巫”。不重复沉船的传闻。
[[tracks.chapters]]
key = "tie_extra_02_amaia_elene_urruti_turning"
title = "女巫的话"
text = "正月里，毕尔巴鄂的码头上都在传同一件事：红湾回来的那批人里，有个水手在酒馆后屋喝了阿玛娅的药，还是没熬过月底。他的寡妇站在桶匠街口喊“女巫”，喊得半条街都探出头来。也有人替后屋说话：“那人下船时腿肿得套不上靴子，牙一碰就出血，换谁的药都晚了。”酒馆老板怕惹事，把后屋的门闩上了。有人隔着门板听见阿玛娅说：“关就关着，药照样煎。”第四天一早，埃莱内拔了门闩，把门板推到墙根：“看病的进来。要骂人的，站外面骂。”"
stage = "rumor"
window = [[1566, 1, 1], [1566, 2, 28]]
at = "bilbao"
cast = ["amaia", "elene_urruti"]
mood = "tense"
news = "红湾回来的一个水手没熬过正月，他的寡妇在毕尔巴鄂桶匠街口喊“女巫”，酒馆后屋关了三天门，第四天又开了。"
rumor_days = 60

