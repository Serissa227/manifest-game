# 落点：1566 年秋，阿玛娅把早上的病人交给埃莱内。所有路径同一个结局：mentor。
[[tracks.chapters]]
key = "tie_extra_02_amaia_elene_urruti_landing"
title = "交出去的药臼"
text = "入秋那天，阿玛娅把药臼推到埃莱内面前。石臼的边沿磨得发亮，杵柄上有一道她握了二十年的凹痕。“早上的病人归你，晚上的归我。”“为什么是早上？”“早上的人疼得轻，骂人也轻，你受得住。”埃莱内没再问，抓了一把晒干的车前叶，捣了很久，捣出来细得像灰，她自己先皱了眉。阿玛娅看了一眼，一句话也没说，从罐里捏了一撮粗的撒进去，搅了两下，把杵递回她手里。"
