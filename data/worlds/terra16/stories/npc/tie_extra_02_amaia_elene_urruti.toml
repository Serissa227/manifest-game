# 抉择：1566 年春，教区来问话。玩家可以去作证，或把簿子里的几页抄给船医；不插手时埃莱内自己去教区。
[[tracks.chapters]]
key = "tie_extra_02_amaia_elene_urruti_choice"
title = "后屋的证人"
text = "教区来了两个人，一个执事，一个拿着纸笔的年轻神父，说要问问正月里死的那个水手。阿玛娅坐在药臼后头，杵都没停：“治不好就是治不好。要问什么，问吧。”她不替自己辩，埃莱内却先一步堵在后屋门口：“那几天给他换布的是我。要问，先问我。”她把簿子翻开，举到神父眼前。纸还是废账纸，叉已经少了；这几页一个叉也没有，一天一行：三日，肿到脚踝；七日，过了膝盖；十二日，牙床出血，药咽不下去。神父的笔停在纸上。阿玛娅看了她一眼，没叫她让开。"
stage = "involve"
window = [[1566, 3, 1], [1566, 5, 31]]
at = "bilbao"
cast = ["amaia", "elene_urruti"]
speaker = "elene_urruti"
mood = "tense"
news = "毕尔巴鄂的教区来问后屋的草药女，挡在门口的是她的徒弟，手里举着一本簿子。"
rumor_days = 60

