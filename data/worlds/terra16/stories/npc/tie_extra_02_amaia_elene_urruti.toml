# 相识：1554 年春夏，鱼叉手被绳子勒开了手掌。
[[tracks.chapters]]
key = "tie_extra_02_amaia_elene_urruti_meeting"
title = "后屋的盆"
text = "后屋的门被撞开，十四岁的埃莱内拽着她父亲进来。鱼叉手的右掌叫鱼叉绳勒开一道口子，血顺着指缝往下滴。“撒把盐就好，用不着进这屋。街上都说——”“手搁桌上，摊开。”阿玛娅头也没抬，“别跟我说外面怎么传的——流言不会看病。”他还想走，埃莱内两手把他按回凳子上：“伤口要洗，逞强留到岸上。”阿玛娅这才抬头：“谁教你的？”“没人教，我自己想的。”阿玛娅把一盆温水推到她面前：“那你端着。手别抖。”缝了七针，盆里的水没晃出来一滴。临走，阿玛娅让他把泡着草叶的盆端回家去。第二天一早，埃莱内把盆送回来了，刷得发亮，人却站在门口不走。"
stage = "witness"
window = [[1554, 4, 1], [1554, 7, 31]]
at = "bilbao"
cast = ["amaia", "elene_urruti"]
speaker = "amaia"
mood = "cheerful"
news = "毕尔巴鄂酒馆后屋来了个十四岁的姑娘，把她那鱼叉手父亲按在凳子上缝手，端盆的手一点没抖。"
rumor_days = 60

