# 抄过船医的那条路：新地回来的第一条船上，船医来道谢。
[[tracks.chapters.variants]]
key = "handbook"
when = [{ kind = "flag", flag = "c7_tie_extra_02_amaia_elene_urruti_handbook" }]
text = "第一条从新地回港的船靠岸那天，有个船医找到后屋，从怀里掏出那份抄本给埃莱内看，纸角卷了，沾着鲸油：“上头那几页，救了两个人。”过了几天，阿玛娅把药臼推到她面前。石臼的边沿磨得发亮，杵柄上有一道握了二十年的凹痕。“早上的病人归你，晚上的归我。”“为什么是早上？”“早上的人疼得轻，骂人也轻，你受得住。”埃莱内抓了一把晒干的车前叶，捣得细得像灰，自己先皱了眉。阿玛娅一句话也没说，捏了一撮粗的撒进去，搅了两下，把杵递回她手里。"
