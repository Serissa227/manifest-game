# C7 重写：故事 2.0，遵循 A5 / E37 契约（DECISIONS“第九批 A5 / E37 开工：故事 2.0 TOML 契约”）。
# 标签：GL（女性之间的非恋爱线）；类别：师徒（mentor）。全线没有恋爱效果。
# 改名：本文件替代 stories/npc/tie_extra_02_amaia_radhika.toml（旧线连同英文覆盖退役，人物与情节都不保留）。
# 人物：
#   阿玛娅（amaia，1530-06-26）——毕尔巴鄂酒馆后屋的草药人，纯 GL；她的恋人是塞西莉亚（见 tie_cecilia_amaia），本线不写。
#   埃莱内·乌鲁蒂（elene_urruti，1540-02-13）——鱼叉手家的女儿，毕尔巴鄂捕鲸学院的同学；她的恋爱线是马丁（见 tie_new_martin_itsas_elene_urruti），本线不写。
# 年龄：1554 年相识时埃莱内十四岁，1555 年十五岁，1566 年二十六岁；未成年的几年只写师徒。
# 依据（史实）：
#   比斯开与纳瓦拉一带的草药人常被叫作女巫（1525—27 年纳瓦拉的大审巫是阿玛娅母亲那一代的事）；
#   1565 年巴斯克捕鲸船圣胡安号满载鲸油沉在拉布拉多的红湾，船员搭别的船陆续回乡；
#   远洋回来的人腿肿、牙床出血（坏血病），岸上的药常常来不及。
# 依据（原创）：师徒二人；废账纸缝的药草簿；正月里死去的水手和他喊“女巫”的寡妇；教区问话；抄给船医的几页；交出去的药臼。
# 待核：柠檬干在 1560 年代巴斯克船上作药的普及程度（只在一个回复里出现，按行里人的经验写）；新地船队回港的月份（落点变体写“第一条回港的船”）。
# 归属：圣胡安号沉没的传闻、“带药去红湾”、马丁的冻伤归马丁线；本线只写回来以后的病与“女巫”的话。
# 窗口：阿玛娅 1556-03..06、1557-11..1558-01 在威尼斯（塞西莉亚线），本线窗口已避开。
# 秘密：埃莱内的簿子是废账纸缝的——正文里由她拿给阿玛娅看，见闻（news）一律不提；阿玛娅的老祷词不写。
# 缺省走向：玩家不在场，故事照样走完——1554 相识，1555 簿子，1566 正月“女巫”的话与关门，春天教区问话（埃莱内去教区说完就回来捣药），
#   秋天阿玛娅把早上的病人交给她。落点的 default 写 mentor 关系、落点旗标与回忆。
# 旗标（只设不读外部）：c7_tie_extra_02_amaia_elene_urruti_helped（去教区作证）、
#   c7_tie_extra_02_amaia_elene_urruti_handbook（抄给船医；落点的 variants 读它）、c7_tie_extra_02_amaia_elene_urruti_landing（落点）。
# 日程：不改。称呼：埃莱内叫她“阿玛娅”。埃莱内的人设卡现写“跟姨妈认草药”，整合时改为“跟酒馆后屋的阿玛娅认草药”；
#   若保留姨妈，回头把本线的称呼改成“姨妈阿玛娅”，并改相识一章“谁教你的”那几句。

