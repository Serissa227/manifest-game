# 靠近：1555 年夏，废账纸缝的药草簿。秘密只在正文，见闻不提。
[[tracks.chapters]]
key = "tie_extra_02_amaia_elene_urruti_closer"
title = "废账纸缝的簿子"
text = "埃莱内把簿子往桌上一丢，好像那是件不要了的东西。线是补帆的粗麻线，纸翻过来，背面全是船东的字：“鲸油四十二桶，漏三桶。”“船东扔了的旧账，我捡的。”她抢在阿玛娅开口前说，“好纸我买不起。”阿玛娅没接这句，一页一页往下翻，画错的叶子就拿炭笔打叉：这片锯齿多了，那片叶脉画反了。“画错的不许撕。划掉，旁边重画。”“那我这本就全是叉了。”“全是叉的簿子才有用。”翻到最后一页，一株车前草画得一丝不差。阿玛娅没打叉，只在旁边点了个点，把簿子推回去。到夏天过完，簿子又缝进去十几张废账纸，叉一页比一页少。"
stage = "witness"
window = [[1555, 5, 1], [1555, 8, 31]]
at = "bilbao"
cast = ["amaia", "elene_urruti"]
speaker = "elene_urruti"
mood = "tender"
news = "鱼叉手乌鲁蒂家的姑娘拜了毕尔巴鄂酒馆后屋的草药女做师傅；听说画错一片叶子，都得在旁边老老实实重画一遍。"
rumor_days = 60

[tracks.chapters.default]
next = "tie_extra_02_amaia_elene_urruti_turning"
