# 抉择：1576 秋。比安卡出价买全部账簿，价钱公道；契约最后一条只写“照看”名字。乌尔苏拉看的是“我”。
[[tracks.chapters]]
key = "tie_new_ursula_bianca_mare_choice"
title = "出价买账簿"
text = "天黑以后，比安卡又来了。账房里只点着一盏灯，她把一份契约摊在灯下：乌尔苏拉的全部账簿——放出去的款、存进来的钱、每一个客户的名字——一并买走。价钱公道，比交易所里谁出的都高。乌尔苏拉把算筹在契约旁边排开，排完抬起头：“你出的价，比我自己估的还多一成。”比安卡把笔搁在契约上：“签字以前，你可以慢慢想清楚，自己已经欠了谁。”算筹推过去，又拨回来，碰着桌面嗒嗒地响——乌尔苏拉的手在抖。她没看比安卡，看的是我。"
stage = "involve"
window = [[1576, 8, 1], [1576, 10, 15]]
at = "antwerp"
cast = ["ursula", "bianca_mare"]
speaker = "bianca_mare"
mood = "tense"
night = true
news = "安特卫普交易所里传开了：那个热那亚寡妇要买乌尔苏拉的账簿，放出去的款、存进来的钱，连客户的名字一起买。"

[tracks.chapters.default]
next = "tie_new_ursula_bianca_mare_landing"
