# 靠近：1562 秋冬。挂自己名字的账房开张；第一个存钱的是天黑以后来的比安卡。钱袋过两遍秤。
[[tracks.chapters]]
key = "tie_new_ursula_bianca_mare_closer"
title = "挂自己名字的账房"
text = "门上的新牌子漆的是乌尔苏拉自己的名字，没带富格尔三个字。开张头一天，进门的都是来看热闹的，没人存钱。天黑以后，灯已经点上了。比安卡推门进来，把一只钱袋放在桌上：“不用数。”乌尔苏拉解开袋口，把钱倒在秤旁，一枚一枚过秤点数，点完一遍，又点一遍，一个斯图弗不差。“你不信我？”“我信秤。”比安卡头一回笑出了声，说五年前那摞汇票，第二年就跌到了她出的价底下。乌尔苏拉没接这句话，把砝码收回了盒里。比安卡看了一眼门上的牌子：“这间账房，撑得过三年。”乌尔苏拉把这袋钱记在账簿第一页第一行：“三年以后，你来对账。”"
stage = "witness"
window = [[1562, 10, 1], [1563, 1, 31]]
at = "antwerp"
cast = ["ursula", "bianca_mare"]
speaker = "ursula"
mood = "cheerful"
night = true
news = "安特卫普新开了一间挂女人名字的账房，头一个来存钱的是天黑以后上门的热那亚寡妇，那袋钱还被当面过了两遍秤。"

[tracks.chapters.default]
next = "tie_new_ursula_bianca_mare_turning"
