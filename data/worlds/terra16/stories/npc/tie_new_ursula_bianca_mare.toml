# 转折（传闻）：1575 秋。国王又停付了；账房门口排的都是来取钱的，钱箱一天比一天轻。
[[tracks.chapters]]
key = "tie_new_ursula_bianca_mare_turning"
title = "又一次停付"
text = "九月中，消息从马德里传到安特卫普交易所：西班牙国王又停付了。上一回伤得最重的是奥格斯堡的商行，这一回听说热那亚人也有几家要关门。那间挂女人名字的账房还开着，门口天天排队，排的全是来取钱的。乌尔苏拉自己站在柜台后面，一个一个兑，兑到天黑才关门，柜台下的钱箱一天比一天轻。有人在队里骂她慢，她头也不抬：“排着。今天轮不到的，明天第一个。”交易所里另有个热那亚口音的经纪，逢人就打听那间账房的现钱还够兑几天。问他替谁打听，他学着东家的腔调，轻轻地说：“东家只想知道，她那盏灯还点得起几夜。”"
stage = "rumor"
window = [[1575, 9, 15], [1575, 12, 31]]
at = "antwerp"
cast = ["ursula", "bianca_mare"]
mood = "tense"
news = "西班牙国王又停付了，安特卫普那间挂女人名字的账房门口排满了来取钱的人，东家自己站柜台，兑到天黑。"

