# 账还没结（tie_new_ursula_bianca_mare）——C7 新线，2026-10-11，Claude（Opus）；没有旧稿，章节 key 照总决定：meeting / closer / turning / choice / landing。
# 标签：GL 标签下的非恋爱线：对手 → 宿敌而敬重（rivals）。两人都不开放恋爱（romance 为空），全线不写心动、不写暧昧，也不写说明两人关系的句子。
# 人物：乌尔苏拉 ursula（1540-08-22，女，学院同学，富格尔商行驻安特卫普代理人的女儿，1562 年起有挂自己名字的账房）；
#       比安卡·马雷 bianca_mare（1510-10-19，女，热那亚的寡妇银行家，只在掌灯以后见客）。
#       全线 1557-09—1577-08：乌尔苏拉 17—37 岁，比安卡 46—66 岁。效果只有 tie rivals 与情谊，不涉及恋爱年龄门禁。
# 依据：
#   史实——1557 年西班牙王室停付，富格尔等奥格斯堡商行受重创，此后热那亚银行家成了王室的主要债主；1557 年腓力二世在尼德兰，宫廷多在布鲁塞尔；
#         1575 年 9 月王室再次停付，这一回主要冲着热那亚人；1576 年 11 月西班牙之怒（本线只写此后的账：账簿上一半的名字没人来对）；
#         安特卫普交易所（1531 年落成）；斯图弗是布拉班特的小钱；纽伦堡算筹是当时账桌上通用的计数筹码；1561 年起西班牙宫廷在马德里。
#   原创——两人的较量；比安卡几次在掌灯以后登门；票面四成的出价、灯座下的纸条、钱袋过两遍秤、买账簿的契约与最后一条“照看”名字、热那亚的那瓶酒。
#   待核——代理人“赶去布鲁塞尔找国王的财政官”是本线的安排；1557 年王室汇票在安特卫普的折价、1575 年热那亚哪几家关门，正文只用传闻与人物口吻，不写成定数。
# 缺省走向：1557 乌尔苏拉替父亲回绝比安卡的低价（tie rivals）→ 1562 自己的账房开张，比安卡天黑后来存第一笔钱 →
#           1575 再次停付，账房门口排满取钱的人（传闻）→ 1576 秋比安卡出价买全部账簿；没人插手时乌尔苏拉不卖，卖了自己住的房子，账房搬上楼 →
#           1577 比安卡带一瓶热那亚的酒来：“我没输，账还没结呢。”“那就别结。”落点 default 写 tie rivals + 旗标 + 回忆。
#           所有路径同一个结局；玩家帮忙只换落点的正文（variants）：helped 账房没缩小，refused 比安卡改问那句“我的人，不卖”。
# 旗标：写 c7_tie_new_ursula_bianca_mare_helped（choice·bridge_loan）、c7_tie_new_ursula_bianca_mare_refused（choice·read_terms）、
#       c7_tie_new_ursula_bianca_mare_landing（落点）；落点 variants 读 _helped / _refused。不读外部旗标。
# 日程：比安卡的日程整段在热那亚，她来安特卫普都是故事里的出行，不改日程；乌尔苏拉 1557 年起在安特卫普，相符。
# 整合：cast/ties.toml 新增 ursula × bianca_mare，kind = rivals，tags = ["GL"]，story = "tie_new_ursula_bianca_mare"，since 取 1557-12-31。
# 不碰：乌尔苏拉父亲借她名义藏的坏账（归 bond_ursula；1557 年那摞是王室汇票，与它无关）；比安卡的秘密（全线不写、不暗示）；
#       西班牙之怒的街道与门板（归 pair_kaspar_griet）。

