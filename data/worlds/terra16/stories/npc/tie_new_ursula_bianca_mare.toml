# 相识：1557 秋。停付以后，热那亚寡妇天黑后来收王室汇票；十七岁的乌尔苏拉替父亲看账，算筹排了三遍，不卖。
[[tracks.chapters]]
key = "tie_new_ursula_bianca_mare_meeting"
title = "掌灯以后"
text = "西班牙王室停付以后，安特卫普交易所里人人急着把王室的汇票脱手。富格尔家的代理人赶去布鲁塞尔找国王的财政官，家里替他看账的，是十七岁的女儿乌尔苏拉。天黑以后有人敲门，进来一个穿黑衣的热那亚寡妇，自己把桌上的灯点亮，倒像她才是主人：“请坐。灯够亮吗？”她要收抽屉里那一摞汇票，出票面的四成。乌尔苏拉没坐。她把纽伦堡算筹在桌上排开，推乱，再排，一共排了三遍，然后把汇票锁回抽屉：“这个价不卖。我没输，账还没结呢。”寡妇没还价，在灯座底下压了一张纸条，上面写着“比安卡·马雷”和热那亚的一条街名：“我这里不急。”"
stage = "witness"
window = [[1557, 9, 1], [1557, 12, 31]]
at = "antwerp"
cast = ["ursula", "bianca_mare"]
speaker = "bianca_mare"
mood = "tense"
night = true
news = "西班牙王室停付以后，一个热那亚寡妇天黑后到安特卫普收王室汇票，出价票面四成，被富格尔代理人家十七岁的姑娘回绝了。"

