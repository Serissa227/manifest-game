# 落点：1577 春夏。西班牙之怒以后，账簿上一半的名字没人来对。比安卡带一瓶热那亚的酒来；宿敌而敬重。
[[tracks.chapters]]
key = "tie_new_ursula_bianca_mare_landing"
title = "账还没结"
text = "去年十一月以后，安特卫普的账簿上有一半的名字，再也没人来对过账。乌尔苏拉的账房还开着，搬到了楼上，只有原来一半大。掌灯以后，楼梯响了。比安卡这回没带契约，只提来一瓶热那亚的酒，放在算筹中间：“你还欠我一个拒绝我的理由。”乌尔苏拉把算筹拢到一边，倒了两杯，推一杯过去：“我没输，账还没结呢。”比安卡举起杯子，灯光在酒面上晃了一下：“那就别结。”"
