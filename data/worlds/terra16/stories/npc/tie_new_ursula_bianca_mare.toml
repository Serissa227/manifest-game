news = "安特卫普那间挂女人名字的账房没把账簿卖给热那亚人，东家卖了自己住的房子，账房搬到了楼上一间小屋。"

[[tracks.chapters.choices]]
key = "bridge_loan"
text = "用我船上的货作押，替她从别处借一笔现钱周转。"
reply = "比安卡听我说完，把契约叠好收起，走之前把灯芯捻低了一点。我把货单押给交易所另一头的一家兑换商，第二天中午，现钱装在两只箱子里抬进了账房。排队的人领完钱，有几个站了一会儿，又把钱存了回去，其余的也就散了。乌尔苏拉把我的货单翻了三遍：“你的货估高了，照今天的行情，高了不止一成。下回押货，先来问我。”她把货单还给我，在账簿上添了一行，写的是我的名字：“这笔，我记着。”"
next = "tie_new_ursula_bianca_mare_landing"
