[[tracks.chapters]]
key = "tie_extra_07_hasan_selim_kereste_meeting"
title = "记得来处的木头"
text = "哈桑来木料场要一根做肘材的弯木。管垛的人眼皮也没抬，随手指了指垛顶那根。新来的学徒塞利姆一步跨过去，手悬在半空，像怕碰疼了谁：“兄弟，这根不行——伊兹米特山阴面砍的，干得慢，现在用，明年就裂。”他蹲下去，从垛底拖出另一根，拇指顺着断面摸了一圈：“这根黑海岸来的，晾了三个冬天。”哈桑接过来，用手斧背敲了两下，侧着耳朵听。没夸他。“图纸能折，龙骨不能。”他把木头扛上肩，“明天你来船台。”塞利姆把山阴面那根推回垛顶，盖了两层麻布，回头想应一声，哈桑已经扛着木头走远了。"
stage = "witness"
window = [[1558, 4, 1], [1558, 8, 31]]
at = "istanbul"
cast = ["hasan", "selim_kereste"]
speaker = "selim_kereste"
mood = "cheerful"
news = "金角湾兵工厂的木料场里，有个学徒记得每根弯木是哪座山砍的，船匠哈桑把他要去了船台。"
rumor_days = 60

