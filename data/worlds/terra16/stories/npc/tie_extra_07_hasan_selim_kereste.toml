text = "帮哈桑把这些料改记进废料账，账做得严丝合缝。"
reply = "那天夜里我们三个守着一盏油灯。塞利姆一根一根报来处，哪座山，哪年伐的，连虫眼在哪一头都记得；我和哈桑照着往废料账里补，补到墨迹干透。第二天账房点数，数目对得上，没人多问一句。塞利姆低声说他欠师傅一回。哈桑把簿子合上：“龙骨不能折。这回折的是账，下不为例。”"
