[[tracks.chapters]]
key = "tie_extra_07_hasan_selim_kereste_choice"
title = "救生艇的木料"
text = "我在兵工厂等修船的料，哈桑去木料场最里头挑一根肘材，我跟在后面。一块帆布盖着什么东西，挡了路，他伸手掀开一角，人就站住了。底下是一条快做好的小艇，板子颜色深浅不一，全是军船剩下的边角，接缝细得插不进一片指甲。哈桑蹲下去摸艇底那根龙骨，手停住了：“这是三年前我从船台上锯下来的料头。”塞利姆从垛子后面出来，低着头，声音很轻：“军船翻了，人得有条小船爬上去。顺着纹下刀，别硬劈。督造官那块木头，我找不着纹，就先攒着，攒了三年。”这些料账上都有数，攒下来，就是偷料。哈桑看了很久，没骂，转头问我：“船长，你有办法没有？”"
stage = "involve"
window = [[1562, 4, 1], [1562, 7, 31]]
at = "istanbul"
cast = ["hasan", "selim_kereste"]
speaker = "hasan"
mood = "tense"
news = "金角湾兵工厂木料场这阵子点数点得凶，废料账翻了一遍又一遍，船匠和学徒轮着被叫去问话。"
rumor_days = 60

