[[tracks.chapters]]
key = "tie_extra_07_hasan_selim_kereste_turning"
title = "杰尔巴的捷报"
text = "这个夏天，金角湾的酒馆里全是杰尔巴的消息：皮亚莱帕夏在海上打了大胜仗，拖着一长串缴来的船进了港。兵工厂从那天起日夜点火修船，木料吃紧，督造官派账房一根一根点数，木料场的账一天查三遍，谁的数目对不上，就要挨板子。咖啡摊上的船匠学着哈桑的口气说，船台上他就一句：“缴来的船，先看龙骨，再看旗号。”木料场那边，账房报一根，塞利姆答一根的来处，哪座山，哪年伐的，晾了几个冬天。账房合上簿子：“你怎么记得这么清？”塞利姆想了想：“摸过的，就忘不了。”账房在簿子上圈了他的名字，说这孩子报的数，不用再核一遍。"
stage = "rumor"
window = [[1560, 6, 15], [1560, 9, 30]]
at = "istanbul"
cast = ["hasan", "selim_kereste"]
mood = "tense"
news = "皮亚莱帕夏从杰尔巴拖回一串缴来的船，金角湾兵工厂日夜修船，木料一根根点数，对不上账的要挨板子。"
rumor_days = 60

