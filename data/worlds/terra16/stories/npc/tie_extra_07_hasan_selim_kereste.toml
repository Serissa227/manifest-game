# C7 配角线（故事 2.0，A5 / E37 契约）：省下来的好木料——哈桑 × 塞利姆·凯雷斯特，师徒（mentor）。
# 标签：师徒线，全线不写暧昧、不写恋爱。哈桑（纯 BL）的恋人是阿尔维塞，见 pair_alvise_hasan，1570 年代以后；塞利姆（any）的恋人是皮耶罗，见 tie_new_piero_vetro_selim_kereste。
# 人物：哈桑（1531-10-04，金角湾兵工厂的船匠）；塞利姆·凯雷斯特（1540-03-16，兵工厂木料场的学徒，学院同学，对每根弯木都记得来处）。
#   1558 年哈桑二十六岁、塞利姆十八岁；1563 年一个三十一岁、一个二十三岁。哈桑在这些年里是刚出师的船匠，称不上“老”。
# 依据：奥斯曼兵工厂在金角湾，造船的橡木多来自伊兹米特一带的山林与黑海南岸；肘材要用天然弯木顺纹取料，龙骨接口顺纹受力，逆纹下刨会起毛；
#   1560 年 5 月杰尔巴之战奥斯曼舰队大胜，皮亚莱帕夏带着缴获的船回伊斯坦布尔（回港月份正文不写死，只用酒馆传闻的口吻），此后兵工厂忙着修船、点数木料。
#   原创：哈桑与塞利姆的师徒关系，省下的好木料与救生艇，督造官（官名为原创称呼，不对应具体职务），试航与废料账，橡叶与直刻痕两个记号。
#   待核：桨帆船是否配过救生用的小艇（史实上大船多拖带小艇，“救生”的用法是本线的原创设定）。
# 去重：阿尔维塞与图纸（1571—73）不在本线；皮埃尔·卡尔东（旧线对象）已不出场；救生艇的母题只在本线与 bond_selim_kereste 的“补齐一条小艇”一致，不重复其学院场景。
# 缺省走向：1558 相识（mentor）→ 1559 学接龙骨（回忆）→ 1560 杰尔巴之后木料点数（传闻）→ 1562 哈桑发现小艇，缺省是他把木料记在自己名下的废料账上、替学徒挨骂
#   → 1563 小艇下水（mentor、旗标、回忆）。玩家不在场时每章照走 default，结局相同：师徒二人和第一条救生艇。
# 旗标：写 c7_tie_extra_07_hasan_selim_kereste_helped（替他们求督造官定了试航日）、_covered（帮着改记进废料账）、_landing（落点）；
#   落点章的 variants 读本文件的 _helped 与 _covered。不读外部旗标。
# 日程：不改。哈桑 1553—1590、塞利姆 1557—1590 的日程都在伊斯坦布尔。
# 整合：见交付说明——cast/ties.toml 的 extra_07 换成 hasan × selim_kereste（mentor），旧文件 tie_extra_07_hasan_pierre_cardon（含英文）删除，人设卡同步。

