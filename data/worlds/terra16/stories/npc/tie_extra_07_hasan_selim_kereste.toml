[[tracks.chapters.choices]]
key = "trial_day"
text = "去求督造官：定个日子当众试航，把小艇算成兵工厂的试样。"
reply = "督造官听完，只问了一句：“翻了算谁的？”我说算我的。日子定在月底，金角湾，当着全厂的人。十二个船匠挤上那条小艇，舷边离水只剩一掌，没有一个人掉下去。督造官问是谁出的主意，哈桑说是学徒的，塞利姆说是师傅的。督造官笑出了声，提笔在簿子上记下：“兵工厂试样一条。”"
next = "tie_extra_07_hasan_selim_kereste_landing"
