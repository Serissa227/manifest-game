[[tracks.chapters]]
key = "tie_extra_07_hasan_selim_kereste_landing"
title = "第一条救生艇"
text = "小艇从栈桥下水，在金角湾里慢慢转了一圈，吃水很稳。船尾刻着一片小小的橡叶，是塞利姆的记号；旁边一道直直的刻痕，是哈桑用斧刃划的。管垛的人也挤在栈桥上看，抱着胳膊，难得没说话。哈桑背着手站在水边：“图纸能折，龙骨不能——这条的龙骨，是你的。”塞利姆张了张嘴，想说的话堵在喉咙里，出来的只有一句：“……纹是顺的。”他蹲下去，顺着木纹把船舷摸了一遍，才发现手心全是汗。"
stage = "witness"
window = [[1563, 4, 1], [1563, 8, 31]]
at = "istanbul"
cast = ["hasan", "selim_kereste"]
speaker = "hasan"
