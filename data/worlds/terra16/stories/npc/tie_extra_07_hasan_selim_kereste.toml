[[tracks.chapters]]
key = "tie_extra_07_hasan_selim_kereste_closer"
title = "读弯木的纹"
text = "船台上架着一截龙骨，哈桑拿炭条沿着接口的木纹画了一道线：“纹顺着力走。逆着，一刨就起毛。”塞利姆接了一回，起毛，拆了。再接，又起毛。他小声问：“师傅，是刨子钝了？”哈桑头也没抬：“刨子是好的。你看纹。”第三回还是起毛，哈桑只看了一眼：“你这一刨，木头都替你难受。”拆了第三回，第四回刨花卷着落下来，薄得透光。哈桑拿拇指抹过接缝，没摸到缝：“再来一根。”收工时，塞利姆把刨花和锯下来的料头一样样捡进麻袋。哈桑在船台那头看见了，转身去收他的手斧，什么也没问。"
stage = "witness"
window = [[1559, 5, 1], [1559, 9, 30]]
at = "istanbul"
cast = ["hasan", "selim_kereste"]
speaker = "hasan"
mood = "tender"
news = "金角湾的船台上，船匠哈桑让一个木料场来的学徒把龙骨的同一处接口拆了三回，第四回才点头。"
rumor_days = 60

