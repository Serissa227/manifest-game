key = "m1"
title = "对岸的渔村"
text = "科苏梅尔的货岸。一条外国小船昨夜掳走了对岸渔村的九个人，往北去了，说是要卖到哪个岛上的种植园去。伊希的独木舟追不上帆船，她站在岸上等你的船，身后蹲着那九个人的家里人，没有人哭。“它往北去了，吃水很深。”她说，“追不追，你一句话。”说到这里她停了停，把手按在桨柄上，又说：“我求你——”话只到这里，她把后面的话咽了回去，换了一句：“我欠你一回。这句话我一辈子没说过几次。”"
speaker = "ix_nikte"
mood = "tense"
at = "cozumel"
cast = ["ix_nikte"]
when = [{ kind = "date", from = [1568, 11, 1] }, { kind = "flag", flag = "c13_npc_ix_nikte_mate", value = false }]
deadline = [1575, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "chase"
text = "追上去。"
next = "done"
check = { attr = "command", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "flag", flag = "c13_npc_ix_nikte_corsair_helped" }, { kind = "affinity", person = "ix_nikte", value = 4 }], news = "科苏梅尔对岸被掳的渔民，外来的船只只追回了四个。剩下的五个，女船主一个一个刻在了桨柄上。" }
effects = [{ kind = "flag", flag = "c13_npc_ix_nikte_corsair_helped" }, { kind = "affinity", person = "ix_nikte", value = 8 }, { kind = "fame", value = 2 }]
reply = "你在第二天傍晚追上了那条船，没打几炮它就把人放进了小艇。伊希在码头上一个一个数，九个，数了两遍。"
news = "科苏梅尔对岸被掳走的渔民，让一条外来的船追了回来，码头上的人说，女船主数人数的时候，手指头都在发抖。"

[[tracks.chapters.choices]]
key = "ransom"
text = "出钱赎人，托哈瓦那的掮客去办。"
next = "done"
requires = [{ kind = "cash", ge = 600 }]
hint = "赎九个人的钱，你的箱子里还凑不出来。"
effects = [{ kind = "cash", value = -600 }, { kind = "flag", flag = "c13_npc_ix_nikte_corsair_helped" }, { kind = "affinity", person = "ix_nikte", value = 6 }]
reply = "两个月后，九个人坐着一条运糖的船回来了。伊希在舷梯下接人，没有看你一眼。过了几天，她让人把一袋可可豆搁在你的舷梯上。你没去拿，第二天它就到了你的船舱里，一颗不少。"
news = "对岸渔村的九个人，被一位外来的船长出钱从哈瓦那的掮客手里赎了回来。"

[[tracks.chapters.choices]]
key = "decline"
text = "这一仗你不打，钱你也不出。"
next = "done"
effects = [{ kind = "affinity", person = "ix_nikte", value = -4 }]
reply = "她点了点头，什么也没说，回身把渔村的人领走了。之后你再靠科苏梅尔，她的桨手卸你的货，都慢半拍。"

# ---------------------------------------------------------------
# 交汇旁轨四：在主教面前（1573—1578）。
[[tracks]]
key = "npc_ix_nikte_landa"
name = "在主教面前"
kind = "request"
start = "m1"
auto = false
cast = ["ix_nikte", "diego_de_landa"]

[[tracks.chapters]]
key = "m1"
title = "在主教面前"
text = "坎佩切方济各会修院的前廊，主教巡视到港口时住在这里，前廊上排着等见主教的人。科苏梅尔要出钱铸一口新钟，老庙的石头要拆去砌墙。伊希不肯进去，十来年前马尼的火她看见了。她把一张纸递给你，上面是她亲手算的账：岛上一年产多少盐，拆一块石头要误几天渔季，钟铸三年，欠的可可税怎么还。她说，主教对外来的船长，比对岛上的玛雅人客气。“你进去。我在外头等。他看见我，就想起马尼。”"
speaker = "ix_nikte"
mood = "tense"
at = "campeche"
cast = ["ix_nikte", "diego_de_landa"]
when = [{ kind = "date", from = [1573, 10, 15] }, { kind = "flag", flag = "c13_npc_ix_nikte_mate", value = false }]
deadline = [1578, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "speak"
text = "照她的账替岛上说。"
next = "done"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "affinity", person = "ix_nikte", value = 3 }], news = "坎佩切的修院里，有个外来的船长拿着一张账替科苏梅尔说情，主教把那张账收进了袖子。" }
effects = [{ kind = "affinity", person = "ix_nikte", value = 8 }, { kind = "reputation", faction = "new_spain", value = 1 }]
reply = "兰达听你说完，问的第一句是：“这些数，是谁替你算的？”你说是伊希。主教把账折了一折，说钟分三年铸，石头先不动。你出来的时候，伊希还站在台阶下，听完只问：“他问是谁算的？”她笑了一下，很短。"
news = "坎佩切的修院里，主教答应科苏梅尔的新钟分三年铸，老庙的石头先不拆。"

[[tracks.chapters.choices]]
key = "gift"
text = "带上一份可可的礼，再替岛上说。"
next = "done"
requires = [{ kind = "cash", ge = 400 }]
hint = "空着手进主教的门，你知道是什么结果。"
effects = [{ kind = "cash", value = -400 }, { kind = "affinity", person = "ix_nikte", value = 5 }, { kind = "reputation", faction = "new_spain", value = 3 }]
reply = "礼收下了，钟的事主教说“再议”，石头那一年没人来拆。伊希知道了礼的事，把一袋可可豆硬塞回你手里：“岛上的事，不让外人出钱。”"
news = "坎佩切的修院里，有个外来的船长送了一份可可的礼，主教说了句“再议”。"

[[tracks.chapters.choices]]
key = "decline"
text = "这句话，我不替岛上去说。"
next = "done"
effects = [{ kind = "affinity", person = "ix_nikte", value = -2 }]
reply = "她把账收回去，自己进了门。半个时辰以后她出来，脸色和进去时一样，什么也没说。"

# ---------------------------------------------------------------
# 交汇旁轨五：那是玉（1576—1588）。
[[tracks]]
key = "npc_ix_nikte_jade"
name = "那是玉"
kind = "request"
start = "m1"
auto = false
cast = ["ix_nikte"]

[[tracks.chapters]]
key = "m1"
title = "那是玉"
text = "科苏梅尔她家的屋檐下，雨季，屋里飘着加辣椒的可可的味道。你随口提起，在哪个港口听人说，戈马拉写的书里，科尔特斯带回五块雕好的祖母绿：一朵玫瑰、一只号角、一条金眼的鱼、一只小铃、一只小杯，后来沉在了阿尔及尔外海。伊希听完，把自己的玉耳珰摘下来，放在你手心里。“书上那条鱼，我在韦拉克鲁斯见过画。”她说，“墨西加的匠人手里没有祖母绿。他们雕的绿石头是玉，西班牙人认错了。”她又压低了声音：“你要是去那片海，别找祖母绿，找玉。玉在水里不会发亮，要拿手摸。”"
speaker = "ix_nikte"
mood = "mystic"
at = "cozumel"
cast = ["ix_nikte"]
when = [{ kind = "date", from = [1576, 1, 1] }, { kind = "affinity", person = "ix_nikte", ge = 40 }, { kind = "flag", flag = "c13_npc_ix_nikte_mate", value = false }]
deadline = [1588, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "note"
text = "把她的话记下来。"
next = "done"
effects = [{ kind = "flag", flag = "c13_npc_ix_nikte_jade_hint" }, { kind = "affinity", person = "ix_nikte", value = 3 }]
reply = "你记在航海日志的最后一页。伊希探头看了一眼，把“玉”字圈了起来，说这个字她在修院里练过，写得比你的还端正。"

[[tracks.chapters.choices]]
key = "ask_how"
text = "问她：你怎么知道？"
next = "done"
check = { attr = "perception", base = 35, per = 6 }
fail = { next = "done", effects = [{ kind = "flag", flag = "c13_npc_ix_nikte_jade_hint" }, { kind = "affinity", person = "ix_nikte", value = 1 }], news = "科苏梅尔的码头上，有人问那个女船主凭什么说玉，她只回一句：摸过就知道。" }
effects = [{ kind = "flag", flag = "c13_npc_ix_nikte_jade_hint" }, { kind = "affinity", person = "ix_nikte", value = 5 }]
reply = "她让你闭上眼睛，把玉耳珰和一块绿玻璃轮流放进你手心。玉是凉的，凉得慢；玻璃一下就热了。"

# ---------------------------------------------------------------
# 交汇旁轨六：离岛（1580—1590）。
[[tracks]]
key = "npc_ix_nikte_join"
name = "离岛"
kind = "request"
start = "m1"
auto = false
cast = ["ix_nikte"]

[[tracks.chapters]]
key = "m1"
title = "离岛"
text = "春分前几天，科苏梅尔的货岸。伊希的两条老独木舟拖在沙滩上，一条补过七回。她坐在船舷上，问你这一趟往哪里去、多久回来。她从没在别人的船上待过超过一个月，腰间那面黄铁矿镜用布包着，她没拿出来。她先把条件摆在前面：每年春分以前，船要送她回岛，替伊希切尔节剩下的老妇人捧香。“我这辈子只在自己的船上睡过觉。”她说，“春分以前送我回来。别的，路上说。”"
speaker = "ix_nikte"
mood = "tender"
at = "cozumel"
cast = ["ix_nikte"]
when = [{ kind = "date", from = [1580, 1, 1] }, { kind = "flag", flag = "c13_npc_ix_nikte_mate", value = false }]
deadline = [1590, 6, 30]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "invite"
text = "请她上船，答应春分以前送她回岛。"
next = "done"
requires = [{ kind = "affinity", person = "ix_nikte", ge = 60 }]
hint = "她看了你很久，说：再跑几趟买卖，再来问。"
effects = [{ kind = "join", person = "ix_nikte" }, { kind = "flag", flag = "c13_npc_ix_nikte_mate" }]
reply = "她把黑曜石小刀用软布擦了一遍，收进母亲缝的布袋，扛着一捆草药上了你的船。上船以后第一件事，是把你的货舱从头到尾数了一遍。"
news = "科苏梅尔的女船主上了一条外来的船，岛上的人说她走以前，把两条老独木舟的缆绳系在了一起。"

[[tracks.chapters.choices]]
key = "not_now"
text = "不请她走，只问岛上今年缺什么。"
next = "done"
effects = [{ kind = "affinity", person = "ix_nikte", value = 3 }]
reply = "她说缺鱼钩和一个会写字的年轻人。说完自己笑了：“鱼钩你带得来。年轻人，你带不来。”"
