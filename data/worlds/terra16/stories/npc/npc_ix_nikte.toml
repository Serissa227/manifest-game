# 沿岸的伊希：NPC 线（故事 2.0，A5 / E37 契约）
# 标签：伊希不是玩家时跑的线。玩家是任何主角或自由船长，正文只写“你”，不写玩家的性别与外貌；伊希是 NPC。
# 人物：伊希·妮克特（ix_nikte，1540 年生），科苏梅尔独木舟商队首领的女儿。
# 轨道：npc_ix_nikte（request，脊轨，auto）：s00_gate 门槛 → s01_mani（1562 马尼）→ s02_census（1570 普查）→ s03_end（1588 结尾）。
#       交汇旁轨（auto = false，由脊轨 default 开启）：npc_ix_nikte_cocoa（铁器与可可豆，1 章）、npc_ix_nikte_refuge（哈瓦那的船舱，2 章）、
#       npc_ix_nikte_corsair（对岸的渔村，1 章）、npc_ix_nikte_landa（在主教面前，1 章）、npc_ix_nikte_jade（那是玉，1 章）、
#       npc_ix_nikte_join（离岛，1 章）。共 11 章：脊轨 4 章、旁轨 7 章。
# 依据：
#   史实：1562 年 7 月坎佩切的马尼，兰达修士把各村收来的玛雅书与神像堆进火里烧了（烧了多少，尤卡坦的人各说各的）；
#         1570 年神父挨家挨户登记科苏梅尔的名册，名字写成教名加玛雅姓；1573 年兰达以主教身份回到尤卡坦；
#         1579 年兰达死于梅里达（只在闲话里提一句）；戈马拉（1552）书中记科尔特斯带回的五块雕石，写作祖母绿；
#         1541 年皇帝的舰队沉在阿尔及尔外海（印记线索，见 jade）；1568 年以后私掠船在尤卡坦东岸出没。
#   原创：伊希的商队与两条独木舟、耳珰、那一串打结的棉绳、对岸渔村被掳的九个人、伊希切尔节剩下的老妇人。
#   待核（正文一律传闻或人物嘴里的口吻）：1570 年普查的主持人；1562 年马尼被烧书籍的数量。
# 旗标：设 c13_npc_ix_nikte（门槛，s00 default）、c13_npc_ix_nikte_refuge_done（refuge m2）、c13_npc_ix_nikte_corsair_helped（corsair 追上、追不上或赎回都设）、
#       c13_npc_ix_nikte_jade_hint（jade m1）、c13_npc_ix_nikte_mate（join 请她上船；之后旁轨因门槛静默结束）。
#       读 c12_voyage_ix_nikte、upbringing_graduated、mate ix_nikte（整合时对一下 mate key 与人物 key 的对应）、r03_mani_codices_people_and_codices_sheltered（C10 提供，s01 变体）。
# 回忆插画：mem-npc_ix_nikte-refuge「一串结绳」：哈瓦那码头上，一个玛雅老妇把包袱打开一角，里面是一串串打结的棉绳，孩子们挤在她身后。
# 禁区：本线不写伊希家的书与抄本、她的两个名字、亚特兰蒂斯、任何恋情（不用 heart / relation / tie / bond）；见闻里不写秘密。
#       “你是谁派来的”只在 cocoa m1 用一次；“我欠你一回”只在 corsair m1 用一次；求人的话在 refuge（说成买卖）与 corsair（改成“我欠你一回”）各一次，写法不同。
# 交付：C10 的 r03_mani_codices_people_and_codices_sheltered；mate 的 key 与人物 ix_nikte 对应（整合时对一下）；A9 门槛的否定形式（可选）。

[[tracks]]
key = "npc_ix_nikte"
name = "沿岸的伊希"
kind = "request"
start = "s00_gate"
auto = true
cast = ["ix_nikte"]

# 1557 春 · 门槛见闻：科苏梅尔与坎佩切的码头闲话。
[[tracks.chapters]]
key = "s00_gate"
title = "商队首领家的女儿"
text = "科苏梅尔的码头上有人说，独木舟商队首领家的女儿从梅里达的修院回来了，领着两条刷了红土的独木舟跑沿岸，贩盐和蜂蜡。生船靠岸，她先打量三遍，问清来路才肯谈价；认下的人，一个也不丢。坎佩切的船夫把话传过来：“想跟她做买卖？先把来路说清楚，别绕弯子。她这辈子听够了软话。”"
stage = "rumor"
window = [[1557, 3, 11], [1557, 3, 18]]
at = "cozumel"
cast = ["ix_nikte"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c12_voyage_ix_nikte", value = false }, { kind = "flag", flag = "upbringing_graduated" }]
news = "科苏梅尔的独木舟商队换了个年轻的领头人，是首领家从梅里达回来的女儿，听说对生船问得比税吏还细。"

[tracks.chapters.default]
next = "s01_mani"
effects = [{ kind = "flag", flag = "c13_npc_ix_nikte" }, { kind = "start_track", track = "npc_ix_nikte_cocoa" }, { kind = "start_track", track = "npc_ix_nikte_refuge" }]

# 1562 夏 · 马尼的火。NPC 线只写火，不写她救了几部书（那是主线的事）。
[[tracks.chapters]]
key = "s01_mani"
