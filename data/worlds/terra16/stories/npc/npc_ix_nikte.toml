# 1570 春 · 普查：神父与书记挨家挨户登记。
[[tracks.chapters]]
key = "s02_census"
title = "岛上的名册"
text = "科苏梅尔的码头闲话：神父带着书记挨家挨户登记，岛上两个村子三四百人，名字都写成教名加玛雅姓。商队首领家那个女儿跟在书记后头走了一上午，每一家她都替书记叫得出名字。书记的册子上，有一家的名字拼得不对，她没吭声，只把那一页的边角折了一下。书记在码头上说：“有她在后头跟着，我一个名字也没写错。那一页边角的折痕，是她折的，我回去就改。”"
stage = "rumor"
window = [[1570, 3, 1], [1570, 6, 30]]
at = "cozumel"
cast = ["ix_nikte"]
mood = "tender"
news = "科苏梅尔来了个神父挨家挨户记名字，岛上两个村子的人一家一家排着队，报上自己的名字。"

[tracks.chapters.default]
next = "s03_end"
effects = [{ kind = "start_track", track = "npc_ix_nikte_jade" }, { kind = "start_track", track = "npc_ix_nikte_join" }]

[[tracks.chapters.variants]]
