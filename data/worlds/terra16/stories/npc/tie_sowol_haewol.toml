# ── 转折（rumor）：水营的新军报划掉渔户一栏 ──
[[tracks.chapters]]
key = "tie_sowol_haewol_turning"
title = "只问战船"
text = "入冬，庆尚道水营发下新的军报格式：战船几艘，军士几名，铳筒几门。原先末尾“沿海渔户”那一栏，叫人用朱笔划掉了。釜山浦官署里有书吏拿这事说笑：“译官家的姑娘湿着裙子跑了一个秋天，跑出一本没人要的册子。”听说朴素月头也不抬：“三十七户，哪一户白记了，你指给我看。”说完拿油纸把渔户册包好，锁进了自己的箱子。第二天一早，官署门口多了一筐海带，还滴着水。看门的说，放筐的是个济州口音的女人，只撂下一句：“给译官家的，别给书吏。”"
stage = "rumor"
window = [[1564, 11, 1], [1565, 2, 28]]
at = "busan"
cast = ["park_sowol", "ko_haewol"]
mood = "sad"
news = "听说庆尚道水营的新军报只问战船和军士，渔户那一栏划掉了；第二天釜山官署门口多了一筐湿海带。"

