# ── 靠近（witness）：海女村里挨家数人 ──
[[tracks.chapters]]
key = "tie_sowol_haewol_closer"
title = "水下的人数"
text = "海月带素月去海边的海女村，一家一家地数：谁家的网烧了，谁家的男人出海没回来，谁家的女儿今年才学下水。素月问：“这家的女儿几岁？”“十一。比我那年下水还早一年。”素月把裙角掖进腰带，还是湿到了膝盖，可她在礁石上记得比在官署里快。数到湾口，有个海女在远处换气，素月提着册子就往石头上爬，要去问她的名字。海月一把拽住她：“上岸再逞强，水下听我的。”她自己扎进水里游了过去，回来时先吹一声长哨，把名字喊上岸，又往素月手里塞了一只鲍鱼，壳上还挂着海草：“这个你拿回去，当今天的笔墨钱。”素月拿鲍鱼压住册页，记下名字，在旁边添了一行小字：“湾口，水里问来的。”"
stage = "witness"
window = [[1564, 7, 1], [1564, 10, 31]]
at = "busan"
cast = ["park_sowol", "ko_haewol"]
speaker = "park_sowol"
mood = "tender"
news = "釜山海边的海女村，有人看见译官家的女儿挽着裙子挨家记人数，带路的济州海女还往她手里塞了一只鲍鱼。"

[tracks.chapters.default]
