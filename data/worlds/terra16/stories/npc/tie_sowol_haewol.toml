text = "海月把渔户册借回海边过了一个夏天，秋天才抱回官署，往素月案上一摊。册子从中间摊开，“万石”两个字旁边按着一个朱红的指印——绝影岛的老海女那天蘸了素月的朱砂，说名字改对了，得按一下。海月往后翻到折了角的那一页：“念。”素月念到第六行：“……其网，乙卯年为倭船所焚。”“停。这一家的网是风刮的，我没说过是倭船。”满屋书吏都抬起了头，有人小声笑：“译官家的册子也有错。”素月没理他，当众划掉那一行，重写“为风所坏”，又在页边另抄一句：“济州高氏说的。”海月看不懂：“写的什么？”素月念了一遍。海月点点头，把折起来的那个角抚平了。"
