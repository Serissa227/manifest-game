# C7 重写（2026-10-11，Claude Opus）：配角线 tie_sowol_haewol「军报背面的人家」，替换被退回的 GPT 稿。
# 标签：GL 友情线，不是恋爱线。两人都只对男性动心（素月的恋人线是 pair_mokichi_park_sowol，海月的是 pair_ko_haewol_shin_gyeong），这里全线写好友。
# 人物：朴素月 park_sowol（1537-02-09 生，釜山译官之女，替官府誊写文书）；高海月 ko_haewol（1535-03-14 生，济州海女，1564 年搬到釜山）。
#   本线 1564-03 至 1565-12，素月二十七到二十八岁，海月二十九到三十岁，都已成年。
# 依据（史实）：1555 年乙卯倭变——倭船犯全罗道，六月攻济州；济州人苦于贡役，常有人举家出陆到南海岸；
#   东莱 1547 年升为都护府；庆尚道设水营；铳筒是朝鲜水军的火炮。
# 依据（原创）：东莱府发下的渔户名册与素月记的三十七户；水营新军报划掉渔户一栏（虚构情节，不对应具体公文）；
#   海女村里的人名（万石）与各章人物都是虚构。多大浦、绝影岛是釜山的真实地名。
# 缺省走向：春天在官署相识，结为朋友 → 秋天挨家记人数 → 入冬军报只问战船，册子锁进箱子（rumor）→
#   次年春素月一个人沿海念了九家，遇雨，剩下二十八家托海月转告 → 秋天海月指出一处错，素月当众改正，好友落点。
#   玩家不在场也照样发生；落点的关系效果写在 default 里。
# 玩家能做的：陪她们挨家念回去（帮助）；替她们誊一份送东莱府（帮助，结局相同，旗标不同）。
# 旗标（只写不读外部）：c7_tie_sowol_haewol_helped（落点变体读它）、c7_tie_sowol_haewol_filed、c7_tie_sowol_haewol_landing。
# 日程：不改 cast（素月 1556 起、海月 1564 起都在 busan）；ties.toml 的 sowol_haewol since 由 1555-12-31 改为 1564-03-01 以后（相识章窗口起日）。
# 1590 年通信使归 pair_mokichi_park_sowol，这里不写。

