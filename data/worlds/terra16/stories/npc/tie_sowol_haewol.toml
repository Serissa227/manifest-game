# ── 相识（witness）：报损失的海女与誊公文的译官之女 ──
[[tracks.chapters]]
key = "tie_sowol_haewol_meeting"
title = "先别改她的词"
text = "东莱府发下新的渔户册，济州搬来的人家都得到釜山浦的官署报一回。轮到一个晒得黝黑的海女，她不肯坐，一开口就是乙卯年：“那年六月，倭船半夜进了湾，阿妈把我们往山上赶。回头一看，晾在礁石上的三张网烧得像过年的火堆。九年了，没人赔过一根线。”译官家的女儿朴素月替书吏誊写，笔下不停，写完念给她听：“济州民高氏，乙卯倭变，失网三张。”海女等了半天，没等到下一句：“这是谁家的事？”素月把纸翻到背面：“官话写完，家书还得送。你再说一遍，这回我先写你的话。”高海月又说了一遍，比头一回还长。背面写满了，正面一个字没改。"
stage = "witness"
window = [[1564, 3, 1], [1564, 6, 30]]
at = "busan"
cast = ["park_sowol", "ko_haewol"]
speaker = "ko_haewol"
mood = "cheerful"
news = "听说釜山官署里，译官家的女儿把一个济州海女的话抄满了公文背面，正面那三行官话一个字没动。"

[tracks.chapters.default]
next = "tie_sowol_haewol_closer"
