# ── 落点（witness）：当众改正的一页 ──
[[tracks.chapters]]
key = "tie_sowol_haewol_landing"
title = "能被改正的一页"
text = "海月把渔户册借回海边过了一个夏天，叫书堂的孩子一页页念给她听。秋天她抱着册子回到官署，往素月案上一摊，翻到折了角的那一页：“念。”素月念到第六行：“……其网，乙卯年为倭船所焚。”“停。这一家我没说过网是倭船烧的，是风刮的。那年夏天的大风，他家老二还记得。”满屋书吏都抬起了头，有人小声笑：“译官家的册子也有错。”素月没理他，当众把那一行划掉，重写“为风所坏”，又在页边另抄一句：“济州高氏说的。”海月看不懂那几个字：“写的什么？”素月念了一遍。海月点点头，伸手把折起来的那个角抚平了。"
