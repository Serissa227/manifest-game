# ── 插手（involve）：册子往上送，还是先念回给写进去的人 ──
[[tracks.chapters]]
key = "tie_sowol_haewol_choice"
title = "把回音送来"
text = "开春，我到釜山浦的官署办船引，素月在后院拦住了我。她怀里抱着那本从箱子里取出来的渔户册，油纸还没拆：“水营不要，我就往东莱府送；东莱府不要，我送观察使。”海月蹲在台阶上剥海带，手上没停：“写进去的人，还不知道你把他们写成了什么。”素月想了想：“那就再走一趟，一家一家念给他们听。”“绝影岛那几家得雇船，雇船要钱。”海月瞥了一眼她的绣花鞋，“多大浦那段石头路，你走不了半里。”两个人吵到一半，一起转过头来看我。"
