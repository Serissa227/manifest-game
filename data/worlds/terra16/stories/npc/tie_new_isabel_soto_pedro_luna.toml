# 她署名的海图（tie_new_isabel_soto_pedro_luna）——配角线，标签 GB；新线，恋爱线。
# 人物：伊莎贝尔·德·索托（isabel_soto，1541-03-25 生，女，只对男性开放恋爱），贸易总署领航考官的孙女，画海岸比谁都准，领不到执照；
#       佩德罗·卢纳（pedro_luna，1540-05-13 生，男），塞维利亚星盘作坊的学徒，别人量星之前总要先替人核一遍刻度，怕远海。
#       两人生年相差不到一年。全线都在成年以后：1559 年相识（friends，两人 18 岁上下）；1565 年知己（confidants）；
#       1584—85 年恋人（lovers，窗口起日 1584-10-01，伊莎贝尔 43 岁、佩德罗 44 岁；两人都满 18 的最早可用日是 1559-03-25）。
#       落点以前不写告白，可以走向爱情、也可以停在深交，两条结局都接得上。
# 依据（史实）：塞维利亚贸易总署（Casa de la Contratación）保管标准海图（padrón real），领航员上船的海图要照它抄、经总署核过；
#       领航执照经考试发给，女人领不到。1581 年 9 月迭戈·弗洛雷斯·德·巴尔德斯的船队从桑卢卡尔出发去麦哲伦海峡（要在海峡里筑堡守住它），
#       出港后遇风暴折回加的斯，12 月再出发；船队 1584 年陆续回到西班牙。
# 原创：两人的故事、那只窄了一格的星盘、署着她名字的航路图与海峡图、外衣里子的暗袋、纬度旁的小箭头、图上并排的两个名字；
#       无名的书记与老考官（伊莎贝尔的爷爷，1559 年还在总署验仪，1581 年已不在，正文只称“考官的孙女”）。
# 待核：1581 年夏天总署门口招领航的细节（长桌与册子）是虚构；领航总长不具名，避开 1586 年前后的人选之争。
# 去重与禁写：伊莎贝尔把海图署上别人名字的事归 bond_isabel_soto，本线一字不提；本线写的是她署自己名字的图。全线不提诺埃尔。
# 秘密：佩德罗怕远海——在 closer 里被伊莎贝尔看穿；见闻只写图和人，不写他怕什么。
# 缺省走向：相识（他认了那一格窄了）→ 1565 她把署着自己名字的航路图塞给他，看穿他怕 → 1581 传闻：国王派船队去麦哲伦海峡，
#       他报了名、做领航的副手管仪器 → 开船前她把海峡图塞给他（无人插手：他自己缝进外衣里带上船）
#       → 1584 年秋他回来，两人校图，她先开口，成为恋人（圆满）。
#   帮助：替他去总署讨一张领航执照（_helped）→ 落点变体：图夹在执照里带回来，执照上的海水印子比图上的还多。
#   调解：替她说一句“名字一笔不许刮”（_mediated）→ 落点变体：外衣里子上有她缝的歪针脚。
# 并肩：主角在 bond_isabel_soto 或 bond_pedro_luna 的 S 章立了约（promise / heart 设 c7_tie_new_isabel_soto_pedro_luna_taken），
#       主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_isabel_soto_pedro_luna_side 写图上并排两个名字的朋友。
# 共享旗标：读 c7_tie_new_isabel_soto_pedro_luna_taken；写 c7_tie_new_isabel_soto_pedro_luna_together、_side、_helped、_mediated。
# 日程：两人 1557-01-01 起一直在塞维利亚（cast 已是），不用改；佩德罗 1581—84 年随船队出海只发生在故事里，
#       落点章在 1584 年 10 月以后，那时他已回港。
# 关系（整合方加到 cast/ties.toml）：isabel_soto × pedro_luna，GB；静态 lovers 的 since 对齐落点窗口起日 1584-10-01，
#       并带 when = taken 为假（主角与其中一人立约时，改走 _side 的 confidants）。

[[tracks]]
key = "tie_new_isabel_soto_pedro_luna"
name = "她署名的海图"
kind = "request"
start = "tie_new_isabel_soto_pedro_luna_meeting"
auto = true
cast = ["isabel_soto", "pedro_luna"]

# 相识：1559 年春夏，贸易总署验仪厅。一只新星盘，三十七度那一格窄了一根头发。
[[tracks.chapters]]
key = "tie_new_isabel_soto_pedro_luna_meeting"
title = "先看刻度"
text = "贸易总署的验仪厅里，书记把星盘一只只排上长桌。星盘作坊的学徒佩德罗捧着师傅新做的那只进来，桌后的老考官还没伸手，他孙女伊莎贝尔先抢了过去。她拎到窗口，两脚规往刻度上一卡，换个地方再卡：“谁刻的？刻错了——三十七度这一格，比邻格窄了一根头发。”佩德罗的脸红到耳根，那一格是他刻的。他没争，接回来对着光又看了一遍：“纬度不看姓氏。你说得对，我拿回去重刻。”伊莎贝尔张着嘴，后半句挑错的话卡在了喉咙里。"
stage = "witness"
window = [[1559, 4, 1], [1559, 8, 31]]
at = "seville"
cast = ["isabel_soto", "pedro_luna"]
speaker = "isabel_soto"
mood = "cheerful"
news = "塞维利亚贸易总署验仪那天，考官的孙女挑出一只新星盘有一格刻窄了，刻的学徒当场认了账，拿回去重刻。"

[tracks.chapters.default]
next = "tie_new_isabel_soto_pedro_luna_closer"
effects = [{ kind = "tie", a = "isabel_soto", b = "pedro_luna", relation = "friends" }]

# 靠近：1565 年，星盘作坊。她把署着自己名字的航路图塞给他；他的手指停在大洋中间，她看穿了。
[[tracks.chapters]]
key = "tie_new_isabel_soto_pedro_luna_closer"
title = "她画的路"
text = "伊莎贝尔把一卷图摊在星盘作坊的工作台上，四角压着铜砝码和两脚规：往西印度的航路，从桑卢卡尔出港，过加那利，一路画到圣多明各。右下角签着她的名字，墨还没干透。“你拿去考执照，用这张。”佩德罗照老习惯先替她核纬度线，一条一条对过去，挑不出错。他的手指顺着航线往西走，走到大洋中间停住了。那里没有岛，没有礁，只有几道细线。他半天没有动。“你怕。”伊莎贝尔说。他没有否认，嗓子发紧：“恐怕是。”她把图卷起来塞进他怀里：“那就先拿着。我要是能上船，我自己去。”"
stage = "witness"
window = [[1565, 4, 1], [1565, 8, 31]]
at = "seville"
cast = ["isabel_soto", "pedro_luna"]
speaker = "pedro_luna"
mood = "tender"
news = "塞维利亚的星盘作坊里，学徒佩德罗领到一张往西印度的航路图，是考官的孙女画的，右下角签着她自己的名字。"

[tracks.chapters.default]
next = "tie_new_isabel_soto_pedro_luna_turning"
effects = [{ kind = "tie", a = "isabel_soto", b = "pedro_luna", relation = "confidants" }, { kind = "memory", memory = "mem-tie_new_isabel_soto_pedro_luna-closer", title = "她画的路" }]

# 转折（传闻）：1581 年夏天，国王派大船队去麦哲伦海峡，总署门口招人。他报了名，做领航的副手管仪器；她改了他的生辰。
[[tracks.chapters]]
key = "tie_new_isabel_soto_pedro_luna_turning"
title = "海峡船队招人"
text = "这个夏天，塞维利亚的码头上只有一件事：国王要派一支大船队去麦哲伦海峡，在海峡边上筑堡，不叫外国船再钻进太平洋。九月，桑卢卡尔开船。贸易总署门口摆了张长桌，书记收领航，收木匠，也收懂仪器的人。队尾站着的那个，是星盘作坊里磨了二十几年刻度、从没出过海的老学徒。“出过几趟海？”书记问。“……一趟也没有，”佩德罗说，“恐怕我只会看刻度。”“要的就是看刻度的，”书记在册子上写下，“领航的副手，管仪器。”写到生辰，书记写成了五月三十一，考官的孙女从人堆里挤进来，抢过笔划掉：“五月十三，不是五月三十一！”佩德罗低声说：“多谢。”她把笔扔回桌上：“我是看不下去。”"
stage = "rumor"
window = [[1581, 5, 1], [1581, 7, 15]]
at = "seville"
cast = ["isabel_soto", "pedro_luna"]
mood = "tense"
news = "国王要派大船队去麦哲伦海峡，塞维利亚贸易总署门口摆桌收人，星盘作坊里那个从没出过海的学徒也报了名。"

[tracks.chapters.default]
next = "tie_new_isabel_soto_pedro_luna_choice"
effects = []

# 抉择：1581 年夏末，开船前三天。她把署着自己名字的海峡图塞给他；船上只许带总署的标准海图。
[[tracks.chapters]]
key = "tie_new_isabel_soto_pedro_luna_choice"
title = "带不带那张图"
text = "开船前三天，伊莎贝尔把佩德罗堵在作坊后门，塞给他一卷图：海峡一带的海岸，她把去过的人问了个遍，自己画的，角上照旧签着她的名字。“船上只许带总署的标准海图，”佩德罗展开看了一眼，又卷上，声音低下去，“领航总长要是看见一张女人署名的图，恐怕要罚。”他攥着那卷图，拇指在她的签名上来回蹭了两下，手又抖起来。伊莎贝尔不劝，只说：“纬度不看姓氏——这是你说的。”然后她转过头来看着我：“你说，他带不带？”"
stage = "involve"
window = [[1581, 7, 16], [1581, 9, 20]]
at = "seville"
cast = ["isabel_soto", "pedro_luna"]
mood = "tense"
news = "海峡船队开船前，塞维利亚考官的孙女把一卷自己画的图塞给星盘匠，两人在作坊后门站了好一阵。"

[tracks.chapters.default]
next = "tie_new_isabel_soto_pedro_luna_landing"
effects = []
news = "海峡船队在塞维利亚登船那天，考官的孙女把星盘匠送到栈桥尽头，伸手把他外衣里子鼓起的一块拍平，这才转身。"

[[tracks.chapters.choices]]
key = "get_license"
text = "去总署替佩德罗讨一张领航执照，有了执照，带什么图由他自己定。"
reply = "我在总署的长廊里等到天黑，领航总长才肯见我。我说，全塞维利亚的领航员手里，有一半的星盘是佩德罗刻的度。他听着，没有表态，最后在一张新执照上盖了印。回到作坊，佩德罗接过那张纸，手居然没抖。他把伊莎贝尔的图夹进执照的折页，合上，用手掌压平。开船那天，伊莎贝尔站在栈桥上没有挥手，等船离了岸，才对着甲板喊了一嗓子：“刻度先看！”"
next = "tie_new_isabel_soto_pedro_luna_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_isabel_soto_pedro_luna_helped" }, { kind = "affinity", person = "pedro_luna", value = 5 }]
news = "总署给塞维利亚的星盘匠佩德罗盖了领航执照的印；海峡船队开船那天，考官的孙女在栈桥上冲着甲板喊了一句“刻度先看”。"

[[tracks.chapters.choices]]
key = "argue_signature"
text = "对佩德罗说：带不带随你，她的名字一笔不许刮。"
reply = "“我没想刮，”佩德罗抢先开口，“那是她的名字。”伊莎贝尔哼了一声：“那你抖什么？”“怕你叫我别带。”她盯了他一会儿，从袖口里抽出针线：“脱外衣。”当着我的面，她在里子上缝了个扁扁的口袋，针脚歪歪扭扭。缝完咬断线头，把图卷成细条塞进去，拍平：“总长要是翻出来，就让他念一遍我的名字。念出来，舌头又不会烂。”"
next = "tie_new_isabel_soto_pedro_luna_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_isabel_soto_pedro_luna_mediated" }, { kind = "affinity", person = "isabel_soto", value = 5 }]
news = "考官的孙女蹲在塞维利亚星盘作坊的后门，给随海峡船队出海的匠人外衣缝了个里袋，针脚歪得很，缝完还拍了两下。"

# 落点（恋爱，缺省即圆满）：1584 年秋以后，船队陆续回港。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "tie_new_isabel_soto_pedro_luna_landing"
title = "回来校图"
text = "海峡船队的船陆续回到了塞维利亚。佩德罗瘦了一圈，脸晒成了皮色，进了阿雷纳尔码头边伊莎贝尔的铺子，话也不说，先从外衣里子拆开几针，抽出那卷图摊上案子。海峡一带的海岸还是她画的，旁边添满了小字，是他一路量的纬度，每一行末尾都带个小箭头，指向陆地。她拿笔一行行对，对到第十一行停住：“谁画的？画错了——这里你记错了一分。”“那你改。”佩德罗笑了。她改了那一分，箭头一个也没动，把笔一放：“三年，你的话全写在这上头了。这回该我说了。”她绕过案子，吻了他。"
stage = "witness"
window = [[1584, 10, 1], [1585, 3, 31]]
at = "seville"
cast = ["isabel_soto", "pedro_luna"]
speaker = "isabel_soto"
