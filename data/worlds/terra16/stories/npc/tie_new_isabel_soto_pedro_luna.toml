key = "side"
title = "刻度与海图"
text = "海峡船队回来了。佩德罗拆开外衣里子，抽出一卷被海水泡皱的图，摊在伊莎贝尔的案上，一路量的纬度密密写在她画的海岸旁边。她一行行校，只挑出一处记岔的，用小字自己改了。校完，她把笔蘸饱墨，在自己的签名旁边划出一块地方，笔杆朝他递过去：“写。”“写在你下头就好。”佩德罗说。“纬度是你量的，写前头。”“排哪儿都行，”他还是推让，“图是对的就行。”“那就排一行。”伊莎贝尔说。两个名字并成一行，她吹干墨，把图钉在了案子上方的墙上。"
