# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GB（恋爱线；艾希林、彼得都对任何人开放，两人都空着，本线是他们各自唯一的恋情）。
# 人物：艾希林·奥弗莱厄蒂（aisling，1530-04-22），康诺特海上氏族奥弗莱厄蒂家的女儿，在戈尔韦外海带船，嗓门大，嘴上说“请”、实际从不问人愿不愿意；
#       彼得·范·德·费尔德（pieter，1531-05-27），安特卫普奥特柳斯圈子里的制图师，画浪很准，却怕船真的摇起来，1567—1570 在戈尔韦，1571 起去杜伊斯堡投墨卡托。
#       生年差 1 年。crush 章窗口 1568-05-01 起，两人 38、37 岁；lovers 章窗口 1571-04-01 起，两人 40、39 岁，都早已成年，也远晚于 1557-01-01。
# 依据·史实：墨卡托 1552 年起在杜伊斯堡开工坊；奥特柳斯 1570 年在安特卫普出版《寰宇概观》，其中有一幅不列颠群岛图，爱尔兰西岸画得很粗。
#       正文只用传闻口吻写“新图集传到戈尔韦”，不宣称彼得的稿进了这部图集，也不让他与图集里任何一幅图发生关系。
# 依据·原创：两人；氏族藏船的海湾（海湾的名字与位置一概不写，见闻也不写）；桅杆上的水手结；“老蹲”（像狗的礁石）；
#       落潮时露出来的那块礁与图边的小字旁注；炭笔圈出的几处底稿；油布包与船印封口；每年夏天一条爱尔兰船进安特卫普。
# 待核：奥弗莱厄蒂家在戈尔韦外海带船的氏族传统（正文只写“她家的船”，不写年代细节）；杜伊斯堡到安特卫普走莱茵河水路的行程（正文只写“顺莱茵河下来”）；
#       1574 年前后墨卡托工坊是否放人夏天出远门（传闻口吻，不给日期）。
# 地点：杜伊斯堡没有地点 key，只经来信、传闻与台词写；章节 at 用 galway（戈尔韦码头、外海、氏族藏船的海湾）和 antwerp（epilogue）。
# 缺省走向（玩家什么也不做）：1567 春艾希林“请”彼得上船，他吐了一路却把像狗的礁石画得分毫不差（见证）→ 1568 夏她为一块画错位置的礁等了一整个落潮，
#       他在图边写下她的名字（crush）→ 1570 新图集传到戈尔韦，传闻（rumor）→ 1570 秋墨卡托工坊请彼得去，底稿里有艾希林家的海湾，她不留他
#       → 默认：彼得收拾画匣，开春动身 → 1571 春他走前一天，艾希林带他进了从没让他画过的海湾，两人成为恋人（lovers，远距相守，圆满）
#       → 1574 夏每年一条爱尔兰船进安特卫普（传闻）。玩家的帮助不改变结局，只改变落点章的一个变体。没有坏结局。
#   帮助：把刮掉圈出几处的底稿替彼得送去安特卫普（_helped）→ 落点变体：书商回信“下一版再看”。
#   撮合：答应替两人捎信（_matched），只留回忆与好感，不改落点。旁观：无旗标，只加好感。
# 读的旗标：无。设的旗标：c7_pair_aisling_pieter_helped、_matched（choice）、_together（landing 的 default）。落点的 helped 变体读 _helped。
# 日程（整合方改 cast）：彼得 1571-06-30（landing 窗口末日）起常驻 duisburg_city（无地点 key，沿用 cast 里已写的日程）；艾希林不动，她每年夏天开船去一次（只在台词与传闻里）。
# 整合：cast/ties.toml 的 aisling × pieter 改为两段，起日对齐缺省路径的窗口末日——crush（since 1568-07-31，to 1571-06-29）、lovers（since 1571-06-30）。
# 不写：艾希林与尤哈尼的生意（归 tie_extra_11_aisling_juhani）；氏族海湾的位置与名字。

[[tracks]]
key = "pair_aisling_pieter"
name = "她的船，他的海岸"
kind = "request"
start = "pair_aisling_pieter_meeting"
auto = true
cast = ["aisling", "pieter"]

# 一、相识：1567 年春，戈尔韦码头。画匣已经绑在桅杆上。
[[tracks.chapters]]
key = "pair_aisling_pieter_meeting"
title = "被“请”上船的人"
text = "戈尔韦的商人出钱，请人画康诺特的海岸。画图先生彼得到码头时，他的画匣已经绑在一条船的桅杆上，绳结打得又紧又漂亮。“我请你上船！”桅杆底下的女人嗓门大得半个码头回头，笑着朝他伸手，“上不上船你自己说了算——上了船，往哪儿开就是我说了算。”彼得看看画匣，看看跳板，上了船。出港不到一个时辰，他趴在舷边吐，吐完擦擦嘴，接着画。船擦过一片礁岸，他画完一页，指着岸边：“那块石头，像一条蹲着的狗。”“狗！”艾希林拍着舷板笑，“我们管它叫老蹲，你一根毛都没画错！”过一处窄湾，她一把按住他的笔：“这一个不画。”彼得抬头看她一眼，什么也没问，用小刀尖把刚起的那一笔刮了，当着她的面，刮得干干净净。"
stage = "witness"
window = [[1567, 4, 1], [1567, 6, 30]]
at = "galway"
cast = ["aisling", "pieter"]
speaker = "aisling"
mood = "cheerful"
news = "戈尔韦那位奥弗莱厄蒂家的女船长“请”了个低地来的画图先生上船，听说吐了一路，画倒是画得准。"

[tracks.chapters.default]
next = "pair_aisling_pieter_closer"
effects = []

# 二、靠近：1568 年夏，一块画错位置的礁，等一整个落潮。
[[tracks.chapters]]
key = "pair_aisling_pieter_closer"
title = "落潮时的礁"
text = "彼得把一处暗礁画错了位置，偏出去半个船身。艾希林在甲板上看图，只看一眼就知道了：“你上回是趴着画的，礁可没怪你。”她没笑他。第二天她把船停在那片礁外面，下了锚，说等。这一等就是一整个落潮，水退得慢，船上的人从晌午闲到傍晚，嘴里骂骂咧咧，没人敢走。礁石一点点露出水面，黑的，湿的，比图上的位置偏西。彼得蹲在船舷边改图。锚索一松，船身转了半圈，岸上的参照点滑出去老远，他急得头也不回：“岸线先别动，让我画完。”艾希林在后头嚷：“岸线归海管，不归我！”改完，他在图边写了一行小字：“此处由艾希林·奥弗莱厄蒂指出。”她凑过来看，看得比看礁石还久，伸出一根手指点点那行字：“字写小了。”"
stage = "witness"
window = [[1568, 5, 1], [1568, 7, 31]]
at = "galway"
cast = ["aisling", "pieter"]
speaker = "pieter"
mood = "tender"
news = "戈尔韦外海有条船为了等落潮，在一块礁外停了半天，船上的人说是为了让画图的先生看清楚。"

[tracks.chapters.default]
next = "pair_aisling_pieter_turning"
effects = [{ kind = "tie", a = "aisling", b = "pieter", relation = "crush" }]

# 三、转折：1570 年夏，安特卫普新图集的传闻（rumor）。
[[tracks.chapters]]
key = "pair_aisling_pieter_turning"
title = "图集里的爱尔兰"
text = "安特卫普印了一部新图集，奥特柳斯先生的《寰宇概观》。低地来的商人带了一本回戈尔韦，摊在酒馆的桌上传着看。翻到爱尔兰那一页，满桌的人笑：“西岸画得像被老鼠啃过的奶酪！”奥弗莱厄蒂家那一带的几个海湾，图上一片空。“怪不得这家人的船老是从海里冒出来！”这话传到艾希林耳朵里，她拍着桌子笑，说画得好，一个字别改。倒是她船上那个画图的先生，听说看了一夜图没睡，灯亮到天明。第二天有人在码头上瞧见他捏着一封信，封口的蜡是个陌生的印，信是从杜伊斯堡来的——听说那里有位墨卡托先生，专门做图。"
stage = "rumor"
window = [[1570, 6, 1], [1570, 8, 31]]
at = "galway"
cast = ["aisling", "pieter"]
mood = "tense"
news = "安特卫普新印的图集传到戈尔韦，西岸画得一塌糊涂；听说奥弗莱厄蒂船上那个画图的先生看了一夜没睡。"

[tracks.chapters.default]
next = "pair_aisling_pieter_choice"
effects = []

# 四、选择：1570 年秋，杜伊斯堡来请人，底稿里有她家的海湾。
[[tracks.chapters]]
key = "pair_aisling_pieter_choice"
title = "炭笔圈出来的湾"
text = "杜伊斯堡的墨卡托工坊来信请彼得去，开春动身。他想把这几年画的康诺特海岸底稿一并带去，署自己的名。可底稿里有艾希林家藏船的海湾。艾希林抱着底稿闯进我的船舱，彼得跟在后头。她把底稿摊满了铺位和桌面，拿炭笔一处一处地圈，圈得很重：“这几处，你画了也得给我刮掉。”彼得站着没动，一只手按在最上面那张的角上，纸边已经被他摸得起毛：“没圈过的，我可以先带走。”“带去。署你自己的名，图是你画的，湾是我家的。”她把炭笔往桌上一扔，没有一句软话，“我只‘请’人上船，不‘请’人留下。”两人同时看向我。"
stage = "involve"
window = [[1570, 9, 1], [1570, 11, 30]]
at = "galway"
cast = ["aisling", "pieter"]
speaker = "aisling"
mood = "tense"
news = "戈尔韦码头上传开了：奥弗莱厄蒂船上那个画图先生要去杜伊斯堡，女船长连一句留人的话都没说。"

[tracks.chapters.default]
next = "pair_aisling_pieter_together"
effects = []

