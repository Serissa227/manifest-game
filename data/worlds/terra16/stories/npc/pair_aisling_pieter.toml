window = [[1574, 6, 1], [1574, 8, 31]]
at = "antwerp"
cast = ["aisling", "pieter"]
mood = "cheerful"
news = "安特卫普码头的人说，每年夏天有条爱尔兰船进港，船长是个大嗓门的女人，杜伊斯堡的画图先生总在码头等。"

