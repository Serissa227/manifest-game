# 五、落点：1571 年春，仍由她开船。缺省即圆满（远距相守）。
[[tracks.chapters]]
key = "pair_aisling_pieter_together"
title = "仍由她开船"
text = "彼得动身的前一天，艾希林最后一次“请”他上船。他以为是送行，抱着画匣上去，船却没往外海开，一直开进了那个连底稿上都没有、他从没获准画过的海湾。两岸的崖把风挡得干干净净，水面平得像一块磨过的铁。她收了帆，让船滑着走，低声说出这个湾的名字，只说了一遍。彼得没有掏笔。他站在她旁边，手里什么也没拿，把那个名字在嘴里默念了两遍，记在纸以外的地方。艾希林先低头吻了他，只一下，快得像收帆。他愣了愣，低声说：“信里我只画你的船，不画湾。”她退开一步，嗓门又大起来：“你去画你的图。每年夏天我开船去找你——开船的还是我。”"
stage = "witness"
window = [[1571, 4, 1], [1571, 6, 30]]
at = "galway"
cast = ["aisling", "pieter"]
speaker = "aisling"
mood = "tender"
news = "戈尔韦码头上有人看见，奥弗莱厄蒂家的女船长送画图先生上了去低地的船，自己掌的舵，回来时一路没骂人。"

