# 六、尾声：1574 年夏，安特卫普码头的传闻（rumor）。
[[tracks.chapters]]
key = "pair_aisling_pieter_epilogue"
title = "每年一条爱尔兰船"
text = "安特卫普码头上的人都认得一条爱尔兰船。它每年夏天进港，不用看旗，听嗓门就知道：船长是个女人，卸货时骂人比夸人动听，夸起人来又比骂人还响。说来也怪，那条船靠岸的同一个礼拜，莱茵河上总有一条驳船晚到，下来个瘦瘦的画图先生，脸是青的，晕着船也要赶到码头，怀里的画匣却抱得稳稳的。老搬运工拿这事打过赌。有人问过那位船长，那先生是谁。她朝码头上抱着画匣的那位努努嘴：“喏，我请上船的。每年请一回。”"
