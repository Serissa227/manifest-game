# C7：故事 2.0，遵循 A5 / E37“故事 2.0 TOML 契约”。
# 标签：GL（恋爱）·配角线。两人都是纯 GL，只对女性，不转向异性。
# 人物：安娜·德·拉·克鲁斯（ana_cruz，1536-03-26），墨西哥城羽毛画坊的女画师；
#       卢西娅（lucia，1537-04-04），奥恰尔特印书坊的女排字工。生年差 1。
#       恋人效果只在 together（1566-08-01..10-31）：两人分别 30 与 29 岁，都已成年，也晚于 1557-01-01。closer 只写 crush（两人都已成年）。
# 依据：
#   史实——1563 年起佩德罗·奥恰尔特在墨西哥城印书；1566 年阿维拉—科尔特斯密谋案，8 月阿隆索·德·阿维拉兄弟在主广场被斩首，城里宵禁搜捕同党；
#         1571 年新西班牙设宗教裁判所，1572 年奥恰尔特被捕（据说与一部西班牙文祈祷书里的句子有关）；纸从西班牙经韦拉克鲁斯运上高原，价贵；
#         墨西加人相信战死的武士过四年化作蜂鸟、回来吮花（《佛罗伦萨手抄本》第三卷）；殖民时期的拼法 huitzitzilin，中文写“维齐齐林”。
#   原创——两人、反刻的铅字、排倒的一个字母、窗台上那行字、改刻成蜂鸟的铅字、礼拜天的饭。
#   待核——奥恰尔特被捕后“印书匠的妻子带工人撑起印书坊”，turning 只用街坊传言的口吻；被捕的具体缘由同样只作传言。
# 秘密：安娜记得祖辈说的每种羽毛的意思，从不讲给修士——closer 只对卢西娅说一个词；
#       卢西娅悄悄拆掉过校样里一句会惹祸的话——together 由她自己说出。两件事都不进见闻。
#       卢西娅的口头禅原话只在 choice 用一次（她拦着安娜卖圣像时说，和她拆掉过的那一行互相照着）；安娜的口头禅原话只在 meeting 用一次。
# 缺省走向：1563 相识 → 1565 互教、心照不宣（crush）→ 1566 宵禁夜成为恋人（lovers，设 c7_pair_ana_cruz_lucia_together），不对外人说
#           → 1572 奥恰尔特被捕（传闻）→ 1572 秋缺纸，安娜卖了圣像撑住印书坊 → 1573 扉页上的蜂鸟，每个礼拜天在画坊后院吃饭（圆满）。
# 玩家能做的：choice 章运纸（_helped）或替安娜把圣像卖个好价（_sold），结局同缺省、epilogue 用变体；
#             告诉裁判所的书记（_apart）→ 印书坊被查、关门，卢西娅失业，礼拜天的饭停了一冬（apart，仍是恋人，没有拆散的关系效果）。
# 共享旗标：设 c7_pair_ana_cruz_lucia_together（其他文件可读）、_helped、_sold、_apart；本文件不读外部旗标。
# 日程：安娜 1555 起、卢西娅 1563 起都在 mexico_city（章节地点用 tenochtitlan），本线不改日程。
# 与 tie_extra_05_ana_cruz_xochitl 的分工：那条线写安娜带表妹看三种光、讲羽毛的意思；本线不写授徒，closer 的重点放在摸铅字和那一个词上。

