# 1565 夏 · 靠近：摸铅字、看羽毛；一个那瓦特词排成了一行字
[[tracks.chapters]]
key = "pair_ana_cruz_lucia_closer"
title = "摸字与看光"
text = "礼拜天画坊关了门，两人在后屋换着当师傅。卢西娅把一把铅字倒进安娜手心：“闭眼。摸身上的刻槽，槽朝外，字就是正的。”安娜摸错了四个，第五个摸对了，得意得睁开了眼。轮到安娜，她把一片蜂鸟胸羽插在窗框上，叫卢西娅早上、正午、点了蜡烛各看一回。卢西娅学得快，嘴也不饶人：“你们那几种绿，名字比颜色还多。”安娜掩上门，低声说了一个词：维齐齐林。祖辈说，战死的人过了四年，变成蜂鸟回来喝花。这话她没对修士说过。下个礼拜天，卢西娅带来一个纸包，里头是那个词，排成了一行铅字。安娜闭着眼一个一个摸过去，摸到第四个停了：“这个倒了。”卢西娅抢过去一看，耳根红透。那行字第二天摆上了窗台，倒着的那个，安娜不许她改。"
stage = "witness"
window = [[1565, 5, 1], [1565, 7, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "lucia"]
speaker = "lucia"
mood = "tender"
news = "墨西哥城印书坊的排字工这一年礼拜天常往羽毛画坊跑，说是去学看羽毛的颜色，回来排字时嘴里还念着那瓦特话。"

