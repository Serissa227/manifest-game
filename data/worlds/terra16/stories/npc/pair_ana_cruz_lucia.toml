# 1566 秋 · 落点（恋人）：密谋案后的宵禁夜，画坊后屋
[[tracks.chapters]]
key = "pair_ana_cruz_lucia_together"
title = "宵禁的那几夜"
text = "八月，阿维拉家两兄弟在主广场掉了脑袋，城里天一黑就宵禁，巡夜的挨家敲门搜同党。卢西娅赶完一张告示出来，街口已拉了绳子，只好折回画坊后屋。蜡烛点到一半，她忽然开口：“有一回校样上有句话，我越读越怕。没跟谁说，夜里把那一行拆了，拿别的字补齐。印出去，没人看出来。”“说的什么？”“忘了。”“你不会忘。”卢西娅不吭声，手指在桌面上一下一下地摸，像在摸铅字。安娜没劝她：“我拼圣母的袍子，也把祖辈的意思拼在里头。修士夸好看，我就让他夸。”她把蜡烛推到两人中间，“我们俩都偷偷拿过东西。”门外敲到了隔壁。卢西娅拈掉安娜鬓边一根绒羽，吻了她。敲门声一家一家过去，没在画坊门口停。天亮徒弟问起，安娜只说：“宵禁。”"
stage = "witness"
window = [[1566, 8, 1], [1566, 10, 31]]
at = "tenochtitlan"
