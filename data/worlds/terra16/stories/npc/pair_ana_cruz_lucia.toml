text = "印书坊库里的纸只够印一本教理书。西班牙的纸从韦拉克鲁斯运上来，一令的价钱够一家人吃一个月。铺子白天关着门，夜里偷偷开压床，赶出一页是一页。卢西娅来画坊借钱。安娜手里没有现钱，只有一幅刚完工的羽毛圣母，总督府的人订的，要送回西班牙。“我卖了它。”“你敢。”卢西娅把手按在画框上，“一个字也别悄悄拿走，一片羽毛也是。这一幅你贴了半年。”“圣像我能再拼。铺子关了，就开不了了。”两人一个按着画框，一个扯过了包画的麻布，吵得徒弟都躲进了院子。我推门进来，她们同时转过头，同时开口：“你来评评。”"
