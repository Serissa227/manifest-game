title = "压床停了"
text = "新西班牙设了宗教裁判所，头一批抓进去的就有印书匠奥恰尔特，听说是他印的一部祈祷书里有一句不该有的话。印书坊门上贴了封条，过了半个月又揭了。街坊说，如今是印书匠的妻子带着几个工人撑着，压床停着，纸也快见了底，铺子里只听得见拣字的声音。那个排字的女人天天去，一天也没缺。对门卖蜡烛的说她瘦了一圈，后窗的灯常点到鸡叫。酒馆里有人嘀咕：“她怕什么？书又不是她写的。”旁边的人没笑：“字是她一个一个排的。”傍晚常有个羽毛画坊的女人提着篮子过去，在门口站一会儿，篮子留下，人走了。"
