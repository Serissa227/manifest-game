# 1573 春 · 落点（传闻，告发之后）：印书坊关着，礼拜天的饭停了一冬
[[tracks.chapters]]
key = "pair_ana_cruz_lucia_apart"
title = "停了一冬的礼拜天"
text = "印书坊被查以后一直关着，门上的封条风吹日晒，褪成了白的，街坊说怕是要关满一整年。那个排字的女人没了活计，去城东运河边的码头替人抄卸货的单子，一张两个铜板。管货的说她抄得比谁都快，就是爱挑错，船主的名字拼错一个字母，她也要划出来。羽毛画坊后院礼拜天的那顿饭停了一冬。邻居说那阵子后院一直没生火，女画师一个人坐在院里拣羽毛。开了春，烟囱又冒烟了，院里还是摆两副碗。只是打那以后，总督府的人再来订圣像，女画师一概说羽毛不够。那幅没卖出去的圣母，一直挂在她后屋的墙上。"
stage = "rumor"
window = [[1573, 3, 1], [1573, 5, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "lucia"]
mood = "sad"
news = "墨西哥城那间被查的印书坊到今天还关着；排字的女人去运河码头替人抄货单，羽毛画坊后院礼拜天的饭停了一冬，又接着吃了。"

