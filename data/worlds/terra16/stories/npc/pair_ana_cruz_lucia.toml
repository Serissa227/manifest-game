# 1573 春 · 尾声：扉页上的蜂鸟；礼拜天后院的饭
[[tracks.chapters]]
key = "pair_ana_cruz_lucia_epilogue"
title = "扉页上的蜂鸟"
text = "开春，印书坊又印出了一部祈祷书。扉页右下角多了一只指甲盖大的蜂鸟，翅膀张着，嘴朝下，像要去啄那一行书名。城里没人说得清是谁刻的。安娜一眼就认出来了：画坊窗台上那行铅字少了一个字母，正是当年排倒的那一个。“你不是说，一个也不许少？”“我拿的是我自己排错的。”卢西娅把书往她面前一推，“这不算。”从那以后，每个礼拜天两人在画坊后院吃一顿饭。卢西娅带书来，安娜挑后院最亮的那个时辰，自己背着光坐，把亮的那一面让给书。卢西娅读到错字就念出来，拿炭条在页边打个钩，安娜说她连吃饭都在校书。"
