# 1563 春 · 相识：太蓝的羽样，反刻的铅字
[[tracks.chapters]]
key = "pair_ana_cruz_lucia_meeting"
title = "换个方向看"
text = "奥恰尔特印书坊要印一部祈祷书，封面嵌一小块羽毛画，交给安娜的画坊做。来取羽样的是个排字的女人，围裙上全是油墨点子，一进门就举起羽样：“颜色不对，太蓝。神父要的是绿。”安娜手上没停：“别站在那儿挡光。”她接过羽样往窗边一转，那片蓝立刻沉成了绿，像一池水忽然深了下去。卢西娅闭了嘴。半晌，她从围裙兜里摸出一枚铅字，搁在案上：“那你也换个方向看。”安娜捏着它左转右转，那颗反刻的字头怎么转也认不出来。“L，卢西娅的L。反着刻的字，你转到天黑也正不过来——又不是你的羽毛。”安娜把铅字揣进自己兜里：“这个我收了。羽样的钱，照算。”说完先笑了，卢西娅也笑。后屋两个徒弟探出头来：师傅被人噎住了，居然在笑。"
stage = "witness"
window = [[1563, 3, 1], [1563, 5, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "lucia"]
speaker = "ana_cruz"
mood = "cheerful"
news = "墨西哥城羽毛画坊的女画师，被印书坊来取羽样的排字工拿一枚铅字噎住了，两人对着笑了半天，徒弟们说头一回见师傅笑。"

