text = "马累赶走葡萄牙人以后，兄弟手下的人去翻商馆的旧账，翻出一张供货的名单，上头有一个本地女贝商的名字，墨迹还新。码头上说她替葡萄牙人送过货，说得有鼻子有眼；也有人小声说，那几趟货压根不是她的。她自己一句也没辩，当月就搭坎贝的船走了，仓里剩下的贝一袋也没带。坎贝那边的船夫说，她如今住在玛瑙匠拉迪卡的珠铺楼上，楼下磨盘响一天，她在楼上记一天账，不再碰贝。那条穿着一枚贝的珠链她还戴着。从前一年等一个船期添一颗，如今不用等船了，每年到了那个日子，楼下的人上楼来，替她数一颗，穿上去。"
