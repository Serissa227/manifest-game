# 1573 年初 · 抉择：封了十五年的仓；一船玛瑙，赎还是等
[[tracks.chapters]]
key = "pair_radhika_aishath_choice"
title = "等风还是乘风"
text = "往年拉迪卡带来一袋珠子，这一季带来整整一船玛瑙，船吃水深了一掌。城外，塔库鲁法努兄弟的人从北边的环礁一路打过来，葡萄牙守兵夜里添了岗。阿伊莎图的仓封了十五年，商馆放出话来，开春就把封着的贝全数收走。“卖了这船，赶在打起来以前把仓赎出来。”拉迪卡说。“再等等。”阿伊莎图合上账本，“等看清谁赢。赎回来又让人封了，这船玛瑙就白磨了。”“等到商馆把仓搬空，你还等什么？”阿伊莎图没答，手指拨着颈上的链子，一颗一颗往下数，数到第十六颗停住。拉迪卡也不说话了。屋里静了一阵，两人一齐转过头来看我。"
