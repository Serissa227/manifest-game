# C7：故事 2.0，遵循 A5 / E37“故事 2.0 TOML 契约”。
# 标签：GL（恋爱）·配角线。两人都是纯 GL，只对女性，不转向异性。
# 人物：拉迪卡（radhika，1531-09-05），坎贝的玛瑙珠匠；
#       阿伊莎图（aishath，1533-07-22），马累的贝币商人。生年差 2。
#       恋人效果只在 together（1560-12-01..1561-02-28）：两人分别 29 与 27 岁，都已成年，也晚于 1557-01-01。
#       meeting 只写 friends；其余章节不写关系效果（已是恋人，不降级）。
# 依据：
#   史实——马尔代夫的贝币成捆运去孟加拉当钱使；坎贝的玛瑙珠顺季风卖到东非与红海；
#         东北季风在冬天、西南季风在夏天，船期跟着季风换向（四五月、十月前后）；
#         1558 年葡萄牙人占领马累，1573 年塔库鲁法努兄弟起兵把他们赶走（正文只写“那年”“去年”，不写月份）；
#         贝币论“库塔”计数——伊本·白图泰《游记》记马尔代夫人一库塔为一万二千枚。
#   原创——两人、最小的那枚贝、两颗红玛瑙中间的珠托、一年添一颗的珠链、亏损单与“你吃饭了没有”的回信、
#         葡萄牙税官抽一成、缆绳里的信与补网的老人、朝海的珠铺、商馆旧账上的名字。
#   待核——塔库鲁法努兄弟入城的具体月份；choice 章只写“城外越打越近”的传言，不写哪一天。
# 秘密：cast 里两人没有写明的秘密，本文件不另编。两人在一起的事，见闻里只写“珠子给了女贝商”一类街上看得见的事。
# 口头禅：阿伊莎图的原话只在 meeting 用一次；拉迪卡的原话只在 together 用一次；其余章节换说法呼应。
# 珠数：1557 约好“第一颗”，1558 春随船寄到；占领后没送出的三颗在 1560 冬一起穿上，连最初那颗共四颗；
#       此后一年添一颗：1573 年初十六颗，1574 年第十七颗。
# 缺省走向：1557 坎贝相识（friends）→ 1558 马累被占、仓被封（传闻）→ 1560 冬拉迪卡第一次来马累，两人成了恋人
#           （lovers，设 c7_pair_radhika_aishath_together）→ 1573 年初等风 → 1574 葡萄牙人走了，仓里剩的贝够一条船钱，
#           照旧一年见一面，链子上一年多一颗（远距相守）。
# 玩家能做的：choice 章
#   redeem（帮着卖玛瑙、赶在开战前赎仓）→ _helped，落点 landing_b：赎回的仓改成挂阿伊莎图名字的珠铺；
#   brothers（替塔库鲁法努兄弟的人送信）→ _letters，落点同缺省，epilogue 用变体写补网的老人；
#   both_sides（两头做买卖）→ _apart，落点 apart：阿伊莎图被疑替葡萄牙人供货，去坎贝住在珠铺楼上（仍是恋人，离开了家乡）。
# 共享旗标：设 c7_pair_radhika_aishath_together（其他文件可读）、_helped、_letters、_apart；本文件不读外部旗标。
# 日程：两人日程不改（拉迪卡在坎贝，阿伊莎图在马累）；只有 apart 分支用 schedule 效果把阿伊莎图迁去 khambhat。
