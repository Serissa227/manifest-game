title = "第十七颗"
text = "去年马累赶走了葡萄牙人。商馆的旗子扯下来那天，阿伊莎图的仓也撕了封条：十五年的贝，剩下的不到当年一半，压在底下的几袋还泛了黄。东北季风一起，拉迪卡照旧来了，从怀里摸出第十七颗。阿伊莎图顾不上看，蹲在仓里一捆一捆地数，数到天黑，账本一合：“够了。”“够什么？”“够一条船钱。”她站起来，拍掉膝盖上的贝壳屑，“明年你别搭人家的船了，坐我的。”拉迪卡笑了，把第十七颗穿上链子。链子已经垂过了心口，她替阿伊莎图扣好搭扣：“那明年这一颗，我在你船上磨。”“船上颠，磨歪了我可不收。”"
