# 1558 秋 · 转折（传闻）：马累被占，贝币仓贴了封条；一张亏损单，一封回信
[[tracks.chapters]]
key = "pair_radhika_aishath_turning"
title = "封了的仓"
text = "今年葡萄牙人的船进了马累，城里的贝币仓一个挨一个贴上了封条。商馆的书记搬张桌子坐在码头上：贝要卖，只能卖给商馆，价钱他们定。卖椰绳的老汉说，有个女贝商的仓也封在里头，她天天趁守兵换岗去门口站一会儿，站完就走，不吵也不求人。她没往外写过一封求救的信，只托去坎贝的船捎了一张单子：仓里存着几库塔，按商馆的价亏多少，按孟加拉的价又亏多少，一行一行，算到最后一库塔，连贴封条那天的日子也写上了。捎信的船夫嘴不严，说坎贝那边回了信，信很短，开头一句不提钱：“你吃饭了没有？”女贝商看完把信揣进怀里，第二天照旧去仓门口站着。"
