# 1557 春 · 相识：坎贝珠铺，最小的一枚贝和两颗红玛瑙的托
[[tracks.chapters]]
key = "pair_radhika_aishath_meeting"
title = "最小的贝"
text = "季风换向前，最后几条马尔代夫船靠了坎贝的码头。马累来的贝币商人阿伊莎图借拉迪卡珠铺的长案数贝，一千枚倒在案上，一枚一枚翻过来看背面。替她扛货的伙计在门口跺脚：“这么数，船都要开了。”她手没停：“别嫌小，船钱也是这样攒的。”数到最后，她捏出最小的一枚，走到磨盘边：“这个，穿得了孔吗？”拉迪卡对着门口的光看了看：“一钻就碎。”她从箱底摸出两颗从来不卖的红玛瑙，另磨了一个小托，把那枚贝嵌在两颗红珠中间，磨盘的水换了两回。阿伊莎图把链子挂上脖子，低头看了很久：“钱可以花，这一颗先不花。”拉迪卡擦着磨盘上的石粉：“下个船期，我再给你磨一颗。”“那我记上了。”阿伊莎图翻开账本，在最后一行写：第一颗。"
stage = "witness"
window = [[1557, 4, 15], [1557, 5, 31]]
at = "khambhat"
cast = ["radhika", "aishath"]
speaker = "aishath"
mood = "cheerful"
news = "坎贝的玛瑙匠给马累来的贝币商人磨了一个珠托，托住一枚最小的贝；听说那枚贝，那个女商人说什么也不肯花。"

