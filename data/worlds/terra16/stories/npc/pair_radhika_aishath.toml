# 1560 冬 · 落点（恋人）：拉迪卡第一次来马累；油布包里的三颗，链子上的四颗
[[tracks.chapters]]
key = "pair_radhika_aishath_together"
title = "第四颗珠"
text = "占领的第三年冬天，拉迪卡头一回随东北季风到了马累。葡萄牙税官把她的玛瑙一袋袋倒在码头的木板上，十颗拣走一颗。阿伊莎图在栈桥尽头等着，一句没提那间封着的仓，开口先问：“吃了没有？”拉迪卡愣了愣：“你倒先问上我了。”当年拉迪卡那封回信，头一句写的就是这个。夜里在阿伊莎图租来的小屋，拉迪卡解开一个油布小包，倒出三颗红玛瑙，是占领以后磨好、一直没能送来的。她把阿伊莎图颈上的链子取下来，一颗一颗往上穿，连同占领前随船捎来的头一颗，一共四颗。“这一颗磨好，就快到船期了。”阿伊莎图按住她的手：“那就别磨那么快。”油灯晃了一下。拉迪卡没再穿，低下头吻了她。链子搁在席子上，当中那枚贝，还嵌在当年那个托里。"
stage = "witness"
window = [[1560, 12, 1], [1561, 2, 28]]
at = "male"
cast = ["radhika", "aishath"]
