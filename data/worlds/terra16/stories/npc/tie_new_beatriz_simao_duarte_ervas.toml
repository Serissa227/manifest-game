# 相识：1559 年春夏，医生家外间。一个先问名字，一个先画叶子。
[[tracks.chapters]]
key = "tie_new_beatriz_simao_duarte_ervas_meeting"
title = "先问名字"
text = "医生家外间的长凳上躺着个发热的水手，嘴唇干得起了皮。贝阿特丽丝没碰药，先翻开病案簿：“你叫什么？”水手哑着嗓子：“……维森特。”“维森特。”她一笔写下，起身把窗板一扇扇推开，“先把窗打开。”药铺的学徒正好送药来，篮子往桌上一搁，没看病人，先在纸角画了一片叶子，叶缘裂得细碎。“苦艾。先认叶，再背名——这一味两面都发灰，别跟叶背发白的艾草弄混，抓错一把，热就退不下来。”贝阿特丽丝回头：“他有名字，你先记名字。”杜阿尔特的笔停了停，在叶子旁边写下三个字：维森特。"
stage = "witness"
window = [[1559, 4, 1], [1559, 8, 31]]
at = "lisbon"
cast = ["beatriz_simao", "duarte_ervas"]
speaker = "beatriz_simao"
mood = "cheerful"
news = "里斯本一户医生家来了个发热的水手：邻家的姑娘先问他叫什么，药铺的学徒先在纸角画了一片苦艾叶。"

[tracks.chapters.default]
