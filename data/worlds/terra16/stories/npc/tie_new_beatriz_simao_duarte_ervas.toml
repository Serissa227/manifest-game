# 落点（恋爱，缺省即圆满）：1570 年春夏，河边的仓库与隔壁的药房。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "tie_new_beatriz_simao_duarte_ervas_landing"
title = "不去印度了"
text = "疫过去了。河边那间仓库的租约是贝阿特丽丝去签的，窗板钉了铁钩，一年到头敞着。杜阿尔特把研钵搬进了仓库的里间，药柜最下层压着一叠祖母口授的方子，每张笔迹都不一样，她认得出来，全是他一个人写的。他把果阿来的那本书摆上架子，合上封面：“我不去印度了。藤和叶子书里有，里斯本的病人得在这里认。”贝阿特丽丝靠在门框上问：“你留下，是为了病房，还是为了我？”他把最后一包药粉归进抽屉：“先认叶，再背名。”抬起头，“先认你。”她笑出了声，走过去吻了他。"
