# 先开窗的病房（tie_new_beatriz_simao_duarte_ervas）——配角线，标签 GB；新线，恋爱线。
# 人物：贝阿特丽丝·西芒（beatriz_simao，1540-10-01 生，女，romance any），里斯本医生家的邻女，学院同学，帮忙记录看诊，最先问病人叫什么；怕血，从不推掉换布的活。
#       杜阿尔特·埃尔瓦斯（duarte_ervas，1540-09-25 生，男，romance any），里斯本药铺的学徒，学院同学，背药名时总画一片叶子，想去印度看书里写的药草。
#       两人生年相差六天。全线都在成年以后：1559 年相识（friends，十八九岁）；1564 年知己（confidants）；
#       1570 年恋人（lovers，窗口起日两人都 29 岁；最早可用日 1558-10-01）。落点以前不写告白，两种结局都接得上。
# 依据（史实）：加西亚·达·奥尔塔的《印度药物对话》1563 年在果阿印行，葡萄牙文，两位医生一问一答，首版没有插图；
#       1569 年里斯本大疫，城里能走的人都走了；按当时的瘴气说法，街谈巷议里叫人关门关窗、熏香避气的一派占多数；开往果阿的船队每年三月前后离开里斯本。
# 原创：两人与“先开窗的病房”（河边一间原先堆胡椒麻袋的空仓库）；门边墙上写名字、没熬过去的划线；水手维森特；药铺学徒排进来年三月果阿船名单的名额；
#       杜阿尔特以不同笔迹抄写祖母口授的方子。
# 待核：奥尔塔的书 1564 年夏经哪条船到里斯本（正文只写“刚到”，不写船）；1569 年大疫在里斯本的起讫月份（正文取夏到秋）；
#       当时医生对开窗与否的主张并不一致，正文只让街谈巷议里出现“叫人关窗”的一派，“开窗”只是贝阿特丽丝自己的坚持，没有人证明她对。
#       closer 与见闻点名“奥尔塔医生在果阿印行的书”（cast 里有他，historical_03_indian_ocean），不写书名与船。
# 缺省走向：1559 先问名字（witness：friends）→ 1564 果阿来的书（witness：confidants；杜阿尔特替她换布）→ 1569 大疫（传闻：她不走，他把名额划了）
#       → 1569 秋 仓库病房（involve）→ 1570 他说不去印度了，两人成为恋人（lovers，设 c7_tie_new_beatriz_simao_duarte_ervas_together；圆满）。
#   帮助（送两份药剂，雇三个脚夫，设 _helped，扣两份 herbal_draught）→ 落点变体：窗台上摆着两只空药葫芦。
#   撮合（留下来替她在墙上记名字，设 _names）→ 落点变体：墙没刷，活下来的人回来描自己的名字。
#   两条路与缺省都通向同一个落点，关系效果相同，只用 variants 改正文。
#   主角在羁绊 S 章与其中一人立约（bond_beatriz_simao 或 bond_duarte_ervas 的 promise / heart 设 c7_tie_new_beatriz_simao_duarte_ervas_taken）时，
#   主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_beatriz_simao_duarte_ervas_side 写病房与药房做邻居的朋友（confidants，不把 closer 已设的知己降回朋友；设 _side）。
# 旗标：设 c7_tie_new_beatriz_simao_duarte_ervas_helped / _names / _together / _side；读 c7_tie_new_beatriz_simao_duarte_ervas_taken（bond_beatriz_simao、bond_duarte_ervas 的 S 章设）。
# 物品：choice 章的 bring_supplies 需要 2 份 herbal_draught（药剂）并扣除；另一个选项不要求物品。
# 日程：不改。两人 1557—1590 年在 cast 里都常驻 lisbon。
# 秘密：贝阿特丽丝怕血，只在 closer 里被杜阿尔特看见；杜阿尔特用不同笔迹抄祖母的方子，只在 landing 里提一句。两件都不进见闻。

