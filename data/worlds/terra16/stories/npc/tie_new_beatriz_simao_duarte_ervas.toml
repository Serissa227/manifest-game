# 靠近：1564 年春夏，医生家后间。奥尔塔的书没有图；杜阿尔特看见她手抖，替她换布。
[[tracks.chapters]]
key = "tie_new_beatriz_simao_duarte_ervas_closer"
title = "果阿来的书"
text = "医生家刚到了一本奥尔塔医生在果阿印行的书，葡萄牙文，两个医生一问一答地谈药，书脊还带着船上的潮气，一页图也没有。杜阿尔特趴在桌上翻到胡椒那一页，手指停住了：“书里写了藤怎么爬、叶子多宽，就是没有图。我想去看看，回来替它画。”“去呀，”贝阿特丽丝头也不抬，“船票我帮你问。”她蹲在一个码头工人的腿边拆绷带，布被干了的血粘在伤口上，一圈一圈往下揭，手指抖得捏不住布角。杜阿尔特看见了。他合上书，蹲下去：“你按着，我来换。”换完，他在盆里洗手：“先认叶，再背名。你先认你自己怕什么。”贝阿特丽丝没答话，起身把窗推开了。"
stage = "witness"
window = [[1564, 3, 1], [1564, 7, 31]]
at = "lisbon"
cast = ["beatriz_simao", "duarte_ervas"]
speaker = "duarte_ervas"
mood = "tender"
news = "奥尔塔医生在果阿印行的药书传到了里斯本，书里一页图也没有；药铺的学徒翻着它说，他要去印度，亲眼看看那些藤和叶。"

[tracks.chapters.default]
next = "tie_new_beatriz_simao_duarte_ervas_turning"
effects = [{ kind = "tie", a = "beatriz_simao", b = "duarte_ervas", relation = "confidants" }, { kind = "memory", memory = "mem-tie_new_beatriz_simao_duarte_ervas-closer", title = "果阿来的书" }]

# 转折（传闻）：1569 年夏，里斯本大疫。她不走；他攒了五年才排上的名额，划了。
[[tracks.chapters]]
key = "tie_new_beatriz_simao_duarte_ervas_turning"
title = "大疫"
text = "里斯本这个夏天一条街一条街地死人。有钱的人家雇了车往山里走，剩下的把门窗钉死，说是不能放瘴气进来；几位医生也这么讲：关窗，熏香，少出门。只有医生家隔壁的姑娘，天天把整排窗板推开，被对门的邻居骂作疯子。她隔着街喊回去：“屋里闷着，人喘不上气！你们关你们的，我开我的！”药铺的学徒攒了五年的钱，好不容易排进来年三月果阿船的名单。前些天有人看见他站在管名册的书记桌前。书记问：“杜阿尔特·埃尔瓦斯，划不划？”他盯着那一行看了半天：“划。等疫过了再说。”"
stage = "rumor"
window = [[1569, 6, 1], [1569, 8, 31]]
at = "lisbon"
cast = ["beatriz_simao", "duarte_ervas"]
mood = "tense"
news = "里斯本闹大疫，医生们都叫各家关窗熏香，医生家隔壁的姑娘偏把窗全推开，被骂作疯子；药铺的学徒把去果阿的名额划了。"

[tracks.chapters.default]
next = "tie_new_beatriz_simao_duarte_ervas_choice"
effects = []

# 抉择：1569 年秋，河边的空仓库。窗已经开了；药和人手要玩家帮。
[[tracks.chapters]]
key = "tie_new_beatriz_simao_duarte_ervas_choice"
title = "先开窗的病房"
text = "河边那间空仓库，原先堆胡椒麻袋，如今高窗全推开了，灰在光柱里翻。贝阿特丽丝站在门口，炭条夹在指缝里，抬进来一个就问一个名字，写在门边的墙上，没熬过去的划一道线。换布的活她一件也不推，手还在抖，抖着换完。门边的墙写满了，名字又排到了第三根柱子上。里间传来杜阿尔特哑了的嗓子：“苦艾昨天就见底了。艾草我不敢给，抓错一把要命。”他在那里配了一整夜的药。“医生不肯来，药铺也被抢空了，”她把炭条递到我手边，“先把窗打开——这个我做完了。剩下的两样，药和人，你能不能帮我们弄点？”"
stage = "involve"
window = [[1569, 9, 1], [1569, 11, 30]]
at = "lisbon"
cast = ["beatriz_simao", "duarte_ervas"]
mood = "tense"
news = "里斯本河边有间窗全开着的病房，门边的墙上写满了病人的名字，没熬过去的都划了线。"

