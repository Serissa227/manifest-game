  { kind = "flag", flag = "c7_tie_esther_zaynab_helped" },
  { kind = "affinity", person = "zaynab", value = 5 },
]
news = "非斯南门外的盐队这回一个人也没丢：金子从萨累装了船，驼夫们走山路回来，女首领当天就卖了一头骆驼。"

[[tracks.chapters.choices]]
key = "carry_letter"
text = "替她把金子和一封信一起带去伊斯坦布尔。"
reply = "那一夜她在灯下坐到鸡叫，一句话也没憋出来。天亮时她让我拿笔，只说了一句：“我不走了。来不来由你。”我写完，她从袖子里摸出一张发黄的旧纸，照着上面的字母，在信尾一笔一笔签了名，歪得像骆驼踩出来的印子。这是她头一回签名。她吹干墨，把信塞进我手里：“金子进了城，连它一起带走。”"
next = "tie_esther_zaynab_landing"
