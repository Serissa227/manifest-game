# 落点：1579，宰娜卜卖了驼队在非斯落脚。缺省是远距相守；撮合让埃丝特当年冬天回来，帮助让驼夫一个不少。
[[tracks.chapters]]
key = "tie_esther_zaynab_landing"
title = "收队的晚饭"
text = "宰娜卜卖了驼队，只留下一头母骆驼，在梅拉区外头赁了个带井的小院。收队那晚，她请驼夫们吃最后一顿饭，席上多摆了一只碗，给去年秋天没走回来的那一个。埃丝特的回信也到了：伊斯坦布尔的柜台离不开人，往后她每年冬天回非斯一次。信封里照旧夹着一枚回信钱。信差念了一遍就走了。宰娜卜坐到井边，对着那头母骆驼把信从头背到尾，一句不落。背到“路费先留出来”，她自己先笑了：“又是这句。”她攥着那枚银币站起来，朝门外喊：“信差走远了没有？”"
