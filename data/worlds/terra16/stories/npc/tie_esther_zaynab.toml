# 转折（传闻）：1569，格拉西亚·纳西去世，埃丝特被派去伊斯坦布尔守柜台。
[[tracks.chapters]]
key = "tie_esther_zaynab_turning"
title = "伊斯坦布尔来信"
text = "开年不久，伊斯坦布尔来了信：人称“夫人”的格拉西亚去世了。这些年从葡萄牙、意大利逃出来的犹太商人，一半搭过她的船。梅拉区的商号得派人去那边守柜台，派的是埃丝特。到了夏天，街上还有人念叨：那个把几种钱念成一首歌的姑娘走了，走前把街上的小账一笔笔结清，连卖油的两个铜子也没落下——“路上不想欠着谁。”南门外客栈的掌柜知道得更多：埃丝特在他柜上留了一袋银子，袋口用线缝着“回信钱”。“宰娜卜回一封信，你就拿一枚给信差。”掌柜说，宰娜卜每回进城，头一句问草料，第二句问：“梅拉区有东西给我没有？”这一季盐队没进城。那袋银子还挂在柜台后头的钉子上，一枚没少。"
stage = "rumor"
window = [[1569, 4, 1], [1569, 8, 31]]
at = "fez"
cast = ["esther", "zaynab"]
mood = "sad"
rumor_days = 60
news = "非斯梅拉区那个算账像唱歌的姑娘去了伊斯坦布尔，走前在南门外客栈留了一袋银子，专付给替盐队女首领捎回信的信差。"

[tracks.chapters.default]
next = "tie_esther_zaynab_choice"
effects = [{ kind = "flag", flag = "c7_tie_esther_zaynab_istanbul" }]

# 抉择：1578 秋，三王之战以后的最后一趟金子。玩家可以帮着换路，或替宰娜卜带信。
[[tracks.chapters]]
key = "tie_esther_zaynab_choice"
title = "战后换路"
text = "八月里三王之战打完，往南的路上全是收兵的人，见骆驼就牵，见驼夫就拉去当差。宰娜卜把驼队从廷巴克图带了上来，最后一批金子留在南边的绿洲，自己只带两个驼夫先进了城。她在南门外的客栈找到我，从怀里摸出埃丝特的信。她不识字，信是掌柜念给她听的，只听了一遍，她就一句不差地背给我：伊斯坦布尔的金价，柜台上新来的伙计，今年的船期。背到最后一行，她把手指按在纸上——那一行的样子她认得。“路费先留出来。”她把信折好，“她每回都写这句，从来不写别的。”院里的骆驼嚼着草。她问我，金子该走哪条路。"
stage = "involve"
window = [[1578, 9, 1], [1578, 12, 15]]
at = "fez"
cast = ["esther", "zaynab"]
speaker = "zaynab"
mood = "tense"
news = "三王之战以后，非斯南门外的盐队要换路，女首领说今年是她最后一趟。"

[tracks.chapters.default]
next = "tie_esther_zaynab_landing"
effects = []
news = "非斯南门外的盐队绕了远路才回来，路上丢了四头骆驼、一个驼夫；女首领说，这是她最后一趟。"

[[tracks.chapters.choices]]
