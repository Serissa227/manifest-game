[[tracks.chapters.variants]]
key = "v1_matched"
when = [{ kind = "flag", flag = "c7_tie_esther_zaynab_matched" }]
text = "驼队卖了，宰娜卜只留下一头母骆驼，在梅拉区外赁了个带井的小院，院里还有一间空屋。收队的晚饭吃到一半，伊斯坦布尔的信差敲了门。回信只有一行。信差念完，又把纸翻过来看了看背面，确实只有一行：“等风向一转就来。”信封里照旧夹着一枚回信钱。宰娜卜把它塞回信差手里：“这回不用回了。”她对着母骆驼把那一行说了三遍，起身去把那间空屋扫了出来。这年冬天，埃丝特真的来了，住满了整整一季。"

[[tracks.chapters.variants]]
key = "v2_helped"
when = [{ kind = "flag", flag = "c7_tie_esther_zaynab_helped" }]
text = "宰娜卜把驼队卖给了南门外的牙人，自己只牵回一头母骆驼，拴在梅拉区外新赁的小院里。收队的晚饭，去年秋天从萨累走回来的驼夫全来了，一个不少，围着锅抢锅底的羊油。埃丝特的信是早上到的：伊斯坦布尔那边的柜台走不开，她往后每年冬天回来一趟；信里照例夹着一枚回信钱。宰娜卜坐在井沿上，把信背给母骆驼听。驼夫们起哄叫她大点声，她背到“路费先留出来”，自己先笑出来：“又是这句。”她拿银币敲了敲锅沿：“明天谁进城，替我把回信捎上。”"
