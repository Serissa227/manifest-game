# C7 配角线：埃丝特 × 宰娜卜——盐路上的回信钱（故事 2.0，A5 / E37 契约）
# 标签：GL，恋爱线；两人都是纯 GL（romance.with = f）。
# 人物：埃丝特（esther，1539-06-11）：非斯梅拉区塞法迪商号的女儿，学院同学；1557—59 在阿尔及尔，1560—68 在非斯，1569 起在伊斯坦布尔。
#       宰娜卜（zaynab，1537-05-06）：撒哈拉盐队的女首领，塔加扎的岩盐换廷巴克图的金；1556—60 常驻非斯，1561—78 廷巴克图，1579 起回非斯。
# 年龄：相识章（1556 春）埃丝特 16 岁，只写借贷、争执与佩服；恋人效果放在 1560-09-15 起的靠近章（埃丝特 21、宰娜卜 23，生年差 2），
#       与 cast/ties.toml 的 since 1560-12-31 对齐。
# 依据：史实——塔加扎岩盐换廷巴克图黄金的商路；1556—57 年萨阿德王朝的兵到过塔加扎，盐矿换了主人；
#       格拉西亚·纳西 1553 年起在伊斯坦布尔，1569 年去世（月份不详，正文只写“开年不久来信”）；
#       1578 年 8 月 4 日三王之战（凯比尔堡），葡萄牙国王塞巴斯蒂昂战死。
#       推想——战后散兵与征发人畜堵了南下的路（写成行旅的传言）。
#       原创——两人的相遇、四十天的盐路、回信钱、宰娜卜的头一回签名。
#       待核：塔加扎换主后宰娜卜改走的“东边的盐井”不指名（陶代尼大规模开采在 1580 年代以后）。
# 缺省走向：1556 借贷相识 → 1560 埃丝特跟盐队走了四十天，两人成了恋人 → 1569 埃丝特去伊斯坦布尔，在南门外客栈留下回信钱
#       → 1578 战后宰娜卜绕远路收队，丢了四头骆驼和一个驼夫 → 1579 宰娜卜卖了驼队在非斯落脚，埃丝特每年冬天回来一次（远距相守，仍是恋人）。
# 玩家能做的：帮助（另找一条路、金子从萨累上船，驼夫一个不少）→ _helped；撮合（替宰娜卜把金子和信带去伊斯坦布尔，她头一回签名）
#       → _matched，埃丝特当年冬天回来住满一季。两条都不改变两人的关系，只改变最后一趟的代价和见面的早晚。
# 旗标：设 c7_tie_esther_zaynab_met / _istanbul / _helped / _matched / _together；落点章的 variants 读 _helped / _matched；不读外部旗标。
# 日程：不改（埃丝特 1569 起伊斯坦布尔、宰娜卜 1579 起非斯，与落点一致）。
# 秘密：埃丝特抄进账本的旧地名只写“一行谁也看不懂的地名”，本线不揭开，也不进见闻。

[[tracks]]
key = "tie_esther_zaynab"
name = "盐路上的回信钱"
kind = "request"
start = "tie_esther_zaynab_meeting"
auto = true
cast = ["esther", "zaynab"]

# 相识：1556 春，梅拉区商号的账房。埃丝特未满 18，只写生意。
[[tracks.chapters]]
key = "tie_esther_zaynab_meeting"
title = "不会签的名"
text = "宰娜卜来晚了，袖口还湿着——驼队在南门外喝足了水，她才肯进梅拉区。她不坐，站在账桌前报去年的账：“灰脖子，死在塔加扎北边第三口井。瘸腿的，第五口。还有一头小母驼，没来得及起名字。”十六岁的埃丝特替父亲坐在桌后，抬起头：“死骆驼也要算进利息里？”“死的是我的本钱。”“那你先签名。名字都不会签，叫我拿什么去见我父亲？”宰娜卜把拇指往水碗里一沾，按在契约末尾，纸面皱起一个小圆。“沙漠不认印章，认水。”埃丝特低头接着算，算到一半停了笔，划掉利钱那一行，改低了半成：“路费先留出来，人才走得成。”"
stage = "witness"
window = [[1556, 2, 1], [1556, 5, 31]]
at = "fez"
cast = ["esther", "zaynab"]
speaker = "zaynab"
mood = "cheerful"
news = "非斯梅拉区有家商号借钱给南下的盐队，账是个十六岁的姑娘算的；盐队的女首领不会签字，在契约上按了个湿拇指印。"

[tracks.chapters.default]
next = "tie_esther_zaynab_closer"
effects = [{ kind = "flag", flag = "c7_tie_esther_zaynab_met" }]

# 靠近：1560 秋，四十天的盐路走完回城。两人都已成年，恋人效果在缺省分支。
[[tracks.chapters]]
key = "tie_esther_zaynab_closer"
title = "四十天的账"
text = "埃丝特从阿尔及尔一回来，就说要亲眼看一回盐路：塔加扎的盐矿换了主人，宰娜卜改走东边的盐井，换了路的账，她不走一遍不肯放钱。她跟着驼队往南走了二十天，又往回走了二十天。进非斯那天，她鼻梁上晒脱了一层皮，账本边上记满了星名——宰娜卜每晚指着天念，她就着火光写。星名中间夹着一行谁也看不懂的地名。宰娜卜的袖子里也多了一张纸，埃丝特在上面写了“宰娜卜”，同一堆火边，宰娜卜照着描了四十个晚上。到了梅拉区的门洞，骆驼先进去了。宰娜卜站住：“账算完没有？”埃丝特低下头，手指顺着数目往下划，一直划到底：“还差一行。”然后她合上账本，吻了宰娜卜。"
stage = "witness"
window = [[1560, 9, 15], [1560, 12, 31]]
at = "fez"
cast = ["esther", "zaynab"]
speaker = "esther"
mood = "tender"
news = "南边的盐队回到非斯，队里多了个晒脱了皮的书记姑娘——梅拉区商号家的女儿，跟着驼队走了整整四十天。"

[tracks.chapters.default]
