text = "替驼队找一条避开征兵的小路，金子到萨累上我的船。"
reply = "我替驼队找了条路：从绿洲往西绕，躲开大路上的兵，顺着山里的牧道下到萨累。金子上了我的船，驼夫一个不少，走回了非斯。进城那天，宰娜卜把驼队里最老的那头骆驼牵到客栈门口，当场卖了，钱也没数。“我不走了。”"
next = "tie_esther_zaynab_landing"
