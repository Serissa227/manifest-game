news = "非斯安达卢斯区一个洗衣婆，把山里老人找了一年的后半首歌唱了出来，唱完自己先哭了。"

[[tracks.chapters.choices]]
key = "client_roll"
text = "请埃丝特翻商号的旧客户名册，找卡迪亚尔村来的人。"
reply = "埃丝特把名册摊在账房的桌上，用手掌压住别的名字，只念同村的那几行。卡迪亚尔来的有三户：两户早搬去了特莱姆森，第三户还在非斯，男主人记得他娘当年唱过的四句，唱得结结巴巴。我领他去见娜拉，四句先唱给她听。埃丝特把四句抄进曲本，在波浪旁边写了一行小字：“还差两句。”娜拉说：“你这是记账。”埃丝特说：“记了账，才知道还欠多少。”"
next = "tie_esther_nala_landing"
effects = [{ kind = "flag", flag = "c7_tie_esther_nala_roll" }, { kind = "affinity", person = "esther", value = 5 }]
news = "非斯梅拉区的商号翻了旧名册，替安达卢斯区那个山里老人找着一个同村人，那支娶亲的歌又多出四句。"

# 落点：1557 春。埃丝特随家里去阿尔及尔，走前一晚。所有路径同一结局，只按旗标换正文。
[[tracks.chapters]]
key = "tie_esther_nala_landing"
title = "会算的听众"
text = "埃丝特家的箱子钉好了，明早就跟商队去阿尔及尔。走前一晚，娜拉在院子里把那支娶亲的歌弹给她听，前半首弹得清清楚楚，后半首还是用琴声哼过去。埃丝特坐在三年前那级台阶上，膝头没摊账本。她第一次没数拍子，只是拍手，拍得比谁都响。弹完，娜拉把曲本翻到最后，撕下一页递给她：上面是三年前那个礼拜五她跑调唱的那支曲，曲名前写着“梅拉区的埃丝特”。“跑调的地方，我照原样记的。”埃丝特把纸折了两折，塞进装路费的钱袋：“这回先装这个，路费往后排。”"
stage = "witness"
window = [[1557, 2, 1], [1557, 5, 31]]
at = "fez"
cast = ["esther", "nala"]
speaker = "nala"
mood = "tender"
news = "非斯梅拉区的埃丝特要跟家里去阿尔及尔了。走前一晚，安达卢斯区的院子里弹了半夜琴，台阶上那姑娘一直在拍手。"

