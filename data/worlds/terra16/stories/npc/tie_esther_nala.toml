# 相识：1554 春。礼拜五下午，一个弹，一个数；数不齐就画波浪。
[[tracks.chapters]]
key = "tie_esther_nala_meeting"
title = "算不齐的拍"
text = "礼拜五下午，安达卢斯区的院子里，娜拉抱着乌德琴练一支老曲。埃丝特坐在台阶上替她数拍子，在账本上一拍记一笔，记到第三行就对不上了：“刚才是八拍，这回怎么成了七拍半？”“这个拍子，老人们叫它‘一个又半个’。”娜拉手没停，“你非要数成整的，它就不对。”埃丝特又数两遍，越数越乱。娜拉把琴一放：“这一遍你唱，别又用笑话混过去。”埃丝特张嘴想找个笑话，没找着，只好唱，跑调跑到隔壁的狗都叫了。唱完，她在那一行旁边画了一道波浪：“算不齐的地方，就画这个。”娜拉歪头看了看：“那下个礼拜五，你接着画。”"
stage = "witness"
window = [[1554, 2, 1], [1554, 5, 31]]
at = "fez"
cast = ["esther", "nala"]
speaker = "nala"
mood = "cheerful"
news = "非斯安达卢斯区有户乐师家，礼拜五下午总有个梅拉区的姑娘坐在台阶上替他家女儿数拍子，数不齐就唱，唱得隔壁的狗直叫。"

[tracks.chapters.default]
next = "tie_esther_nala_closer"
effects = []

# 靠近：1555 春。曲名前面添上教唱的人；娜拉补上两个名字，口音照原样拼。
[[tracks.chapters]]
key = "tie_esther_nala_closer"
title = "名字写在曲名前面"
text = "娜拉的曲本越抄越厚，可每支曲是跟谁学的，她只记在脑子里。埃丝特借去三天，还回来时，每个曲名前面都多了一行小字：“马拉加来的面包师傅”“阿尔普哈拉斯山里的洗衣婆”。娜拉一页一页翻，脸沉了下来：“曲子不是账，这里头谁也不欠谁。”“不写，过几年就没人知道是谁唱的了。”埃丝特说，“你脑子里那本，又借不出去。”翻到一半，娜拉不说话了。她拿过笔，在两支没写名字的曲前面补上：一支是钉马掌的老铁匠，一支是卖薄荷的婆婆。婆婆管老家叫“加尔纳塔”，娜拉就照这么拼，没写格拉纳达。"
stage = "witness"
window = [[1555, 2, 1], [1555, 5, 31]]
at = "fez"
cast = ["esther", "nala"]
speaker = "esther"
mood = "tender"
news = "非斯安达卢斯区乐师家那本曲本，如今一页两种字：曲子是女儿抄的，教唱的人名是梅拉区一个姑娘一笔一笔添的。"

[tracks.chapters.default]
next = "tie_esther_nala_turning"
effects = [{ kind = "tie", a = "esther", b = "nala", relation = "friends" }]

# 转折（传闻）：1555 秋。山里老人挨家找一支娶亲的歌，只记得前半首。
[[tracks.chapters]]
key = "tie_esther_nala_turning"
title = "半首老歌"
text = "入秋以后，非斯安达卢斯区都在说一个从阿尔普哈拉斯山里来的老人。他挨家敲门，不讨水也不讨饭，进门就问：“卡迪亚尔村娶亲时唱的那支歌，你们谁会？”他自己只记得前半首，唱到新娘出门就断了。听说他是偷偷渡海过来的，身上有两个名字，一个是神父起的，一个是他娘起的。乐师家的女儿娜拉跟着他走了三条巷子，一路只说了一句：“再唱一遍，慢一点。”回来，她把前半首记进曲本，后面空着大半页。梅拉区那个姑娘往曲名前头添名字，问老人：“两个都写？”老人说都写。他在区里的客栈住下，跟店主说：“找不着后半首，我不走。”"
stage = "rumor"
window = [[1555, 9, 1], [1555, 12, 31]]
at = "fez"
cast = ["esther", "nala"]
mood = "sad"
news = "非斯安达卢斯区来了个山里老人，挨家敲门找一支娶亲时唱的歌，只记得前半首，说找不着就不走。"

[tracks.chapters.default]
next = "tie_esther_nala_choice"
effects = []

# 抉择：1556 秋。老人病倒，想在走以前把歌听全；“我”去找后半首。
[[tracks.chapters]]
key = "tie_esther_nala_choice"
title = "先给她听"
text = "老人病倒在客栈里，咳得说不成整句，只说想在走以前把那支歌听全。娜拉坐在床边，把前半首弹了三遍，第三遍到新娘出门那一句，手停在弦上：“后面的，我不会。”老人闭着眼说：“后半首是女人们唱给新娘的。那天我站在门外，就听过一遍。”埃丝特翻开曲本，在那一页画了一道很长的波浪，一直画到纸边：“算不出来的，总有人记得。找着了，先给她听，别在路上替人家改了口音。”她们一起看向我。"
stage = "involve"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "fez"
cast = ["esther", "nala"]
mood = "sad"
news = "非斯安达卢斯区的山里老人病了，乐师家的女儿天天去客栈，给他弹那半首歌。"

[tracks.chapters.default]
next = "tie_esther_nala_landing"
effects = []
news = "非斯安达卢斯区的客栈里，乐师家的女儿给病倒的山里老人弹那支歌，后半首没人会，她就用琴声哼过去；老人说，够了。"

[[tracks.chapters.choices]]
key = "ask_elders"
text = "去区里挨家问上了年纪的女人，谁的村子也唱过这支歌。"
reply = "我从客栈那条巷子问起，前六家都摇头。第七家的门半天才开，是曲本上那位阿尔普哈拉斯山里的洗衣婆——她白天都在河边，老人敲过两回门都没人应。我把娜拉叫来。娜拉弹了前半首，洗衣婆擦干手，靠着门框接了下去，口音和老人一模一样。娜拉一句一句记，拖长的尾音也照样记下。唱完，洗衣婆说那是她出嫁那年唱的，然后捂着脸哭了。"
next = "tie_esther_nala_landing"
