# 账里留一段乡音（tie_esther_nala）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用轨道名与三个章节 key。
# 标签：GL 标签下的友情线（学院同学，academy = true）。全线只写友情：埃丝特纯 GL、娜拉只对男性，两人都不写心动。
# 人物：埃丝特 esther（1539-06-11，女，romance.with = f）；娜拉 nala（1540-06-07，女，romance.with = m）。
#       全线 1554-02—1557-05，埃丝特 14—17 岁、娜拉 13—16 岁；没有任何恋爱效果，年龄门禁不涉及。
# 依据：
#   史实——1492 年格拉纳达陷落以后，安达卢斯的穆斯林与塞法迪犹太人陆续流亡北非，非斯有安达卢斯区与梅拉区（犹太区）；
#         1550 年代仍有摩里斯科人从阿尔普哈拉斯山区偷渡北非，受过洗的人多有一个教名、一个家里叫的名字；
#         非斯的安达卢斯音乐（努巴组曲）节拍周期不规整；格拉纳达在阿拉伯语里叫 Gharnata（加尔纳塔）；卡迪亚尔是阿尔普哈拉斯山里的真实村子。
#   原创——两人的交情、山里老人、洗衣婆、马拉加的面包师傅、钉马掌的铁匠、卖薄荷的婆婆、卡迪亚尔的三户人家与那支娶亲的歌。
#   待核——“一个又半个”取自安达卢斯音乐 qa'im wa nisf（站一个又半个）的叫法，五种节拍体系的定型晚于 16 世纪，这里只当老人口中的俗称；
#         “后半首由女眷唱给新娘”是本世界线的写法（摩里斯科婚俗有女眷合唱，细节未核）；埃丝特是犹太人，约在礼拜五下午、日落安息日之前，合乎情理。
# 缺省走向：玩家不插手时，娜拉只给病中的老人弹前半首，后半首用琴声哼过去，老人说够了；1557 年春埃丝特随家里去阿尔及尔，
#           走前一晚娜拉把曲本最后一页撕给她。落点 default 写 tie friends + 旗标 + 回忆；所有路径同一个结局，帮忙的两个选项只换落点的正文（variants）。
# 旗标：写 c7_tie_esther_nala_helped（choice·ask_elders）、c7_tie_esther_nala_roll（choice·client_roll）、c7_tie_esther_nala_landing（落点）；
#       落点 variants 读 _helped / _roll。不读外部旗标。
# 日程：落点在 1557-02-01..05-31 的非斯。cast 里埃丝特 1557-01-01 起就在阿尔及尔，需整合方把她在非斯的日程延到 1557-05-31，
#       阿尔及尔从 1557-06-01 起。cast/ties.toml 的 esther_nala（friends）不变。
# 不碰：娜拉母亲卖掉的旧琴、埃丝特账本里的旧地名（归她们的羁绊线）。

