text = "埃丝特家的箱子钉好了，明早就跟商队去阿尔及尔。走前一晚，院子里坐满了人：山里的老人裹着毯子坐在井边，洗衣婆挨着他。娜拉弹那支娶亲的歌，这回弹的是整首；到了后半首，洗衣婆跟着唱，老人张着嘴，没出声。埃丝特坐在三年前那级台阶上，第一次没数拍子，只是拍手，拍得比谁都响。弹完，娜拉把曲本最后一页撕下来递给她：上面是三年前那个礼拜五她跑调唱的那支曲，曲名前写着“梅拉区的埃丝特”。“跑调的地方，我照原样记的。”埃丝特把纸折了两折，塞进装路费的钱袋：“这回先装这个，路费往后排。”"

