# 落点：1586 春。瓦伊蕾南行一年回来，这回往西，库西替她把七根绳系上桅杆；约在十一年后的今天。
[[tracks.chapters]]
key = "tie_extra_12_vaiere_kusi_wayna_landing"
title = "各记一种海"
text = "瓦伊蕾的船从南边回了卡亚俄，这回是要往西去了。双体船的两个船身之间铺着木板，库西盘腿坐在上面，把她看过的七根绳一根根系上桅杆，绳头朝西。另一束缠着红线，搁在他自己膝头，用杖头压着。瓦伊蕾瞧了那一束一眼，没问，抬手指着天边刚升起的一颗星：“它升到这个高度的那天，我回来。”“它天天升到这个高度。”库西说，“哪一天？报个数。”“十一年以后的今天。”他点点头：“不是整数，我信。”"
