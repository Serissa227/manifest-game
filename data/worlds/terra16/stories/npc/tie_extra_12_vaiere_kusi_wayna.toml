# 选择：1585 春。瓦伊蕾又要出海一年，笔记摊在桌上；银商带着兵站的人再来，问“我”这一角给不给。
[[tracks.chapters]]
key = "tie_extra_12_vaiere_kusi_wayna_choice"
title = "画一圈浪纹"
text = "瓦伊蕾的船后天又要出海，一去就是一年。答应留给我的笔记摊在我的舱桌上：十七颗星的名字和升起的方向，一条航线也没有。她拉过树皮布，用小木棍蘸了石栗烟灰，在最角上画一圈浪纹：“这一角不许抄，别处随你。”库西从绳束里抽出五根，缠上红线：“五根，我数过。这五根，我不讲。”舱门响了，还是那个银商，这回身后站着两个兵站的人。“总督府也想看看这块布。价钱，三千五百零三。”瓦伊蕾没看他们，看着我：“你说，这一角，给不给？”"
