# 相识：1583 春，卡亚俄码头。一块没有字的树皮布，一串写着远航的结绳；各问一句，各答一半。
[[tracks.chapters]]
key = "tie_extra_12_vaiere_kusi_wayna_meeting"
title = "不能全解开的结"
text = "码头的石阶上坐着个从西边来的女人，膝头摊着一块树皮布，布上只有点和线，没有一个字。钦查来的老记事官拄杖站在一旁，腋下夹着一串结绳，图帕克·尤潘基出海的一去一回都在上面。“你的货，报个数。”他说，“别报整数——报整数的，不是懒，就是在撒谎。”“我没有货。”瓦伊蕾没抬头，“坐下，先别说话，听。”他坐下了。她问：“哪一根是海？”“没有哪一根。”他抖开绳子，指着两簇结中间那一长段光溜溜的绳，“去的人结在这头，回来的结在那头，中间九个月，没有结。”轮到他问：“哪颗星是家？”她的手掌盖住布上一个点，只露出旁边那颗：“这颗，夏天贴着水面升起来。”老人弯腰看了很久，没去挪她的手，也没松开绳尾那个拳头大的结。"
stage = "witness"
window = [[1583, 2, 1], [1583, 5, 31]]
at = "callao"
cast = ["vaiere", "kusi_wayna"]
speaker = "kusi_wayna"
mood = "mystic"
news = "卡亚俄码头的石阶上，西边来的女人摊开一块树皮布，钦查的老记事官抖开一串结绳，两人隔着它们坐到天黑。"
rumor_days = 60

