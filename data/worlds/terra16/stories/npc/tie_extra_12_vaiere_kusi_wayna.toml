# 两种不会卖的海（tie_extra_12_vaiere_kusi_wayna）——C7 重写，2026-10-11，Claude（Sonnet）；旧 GPT 稿作废，只沿用轨道名与章节 key。
# 标签：同道之交（friends），不写恋爱——库西不开放恋爱，两人生年相差三十三年；瓦伊蕾的恋人线是 pair_vaiere_tomas_mendoza，本线不碰。
# 人物：瓦伊蕾 vaiere（1538-12-11，女，塔希提的星航者，romance.with = m）；
#       库西·瓦伊纳 kusi_wayna（1505-09-23，男，印加的结绳记事官，钦查人，不开放恋爱）。
#       全线 1583—86 年，瓦伊蕾 44—47 岁，库西 77—80 岁；没有任何恋爱效果，年龄门禁不涉及。
# 依据：
#   史实——1567—69 年门达尼亚（Álvaro de Mendaña）从卡亚俄出发西航，找到一片岛，后来再也没能找回；
#         1572 年萨米恩托·德·甘博亚（Sarmiento de Gamboa）记下图帕克·尤潘基（Túpac Yupanqui）远航大海、
#         约九个月（一说一年）后返回的传说；钦查人以筏子商旅闻名，安第斯人用结绳（奇普）记数；
#         16 世纪的银比索是卡亚俄—利马一带通行的钱，卡亚俄港属利马的总督府管辖。
#   原创——瓦伊蕾 1583—86 年乘双体船到卡亚俄，库西从钦查来见她。这是本线的原创航行情节，不声称太平洋诸岛与秘鲁在史实上有过接触。
#         树皮布星图、银商与书记、石栗烟灰的浪纹、被留下的五根绳、“十一年”之约，都是本线虚构。
#   待核——银商口中“门达尼亚找到又丢了的岛”（所罗门群岛一带）；1580 年代卡亚俄兵站与总督府的叫法；“九个月”取萨米恩托的一说。
# 缺省走向：玩家不插手时，1583 春两人在码头坐到天黑，各讲一半（tie friends）→ 1584 年 5—8 月传闻：银商出到三千二百一十七比索，两样都没买成，
#           两人第一次同时笑出声 → 1585 春银商带兵站的人再来，两人都没松口，银商撂下一句还会再来 → 1586 春瓦伊蕾西行，
#           库西把她看过的七根绳系上桅杆，另一束留在自己膝头，约定十一年后的今天（tie friends + 旗标 + 回忆“各记一种海”）。
#           所有路径同一个结局；两个选项只换落点的正文（variants）。
# 旗标：写 c7_tie_extra_12_vaiere_kusi_wayna_helped（choice·turn_away）、_notes（choice·keep_notes）、_landing（落点）；
#       落点 variants 读 _helped / _notes。不读外部旗标。
# 日程：不改 cast。瓦伊蕾（日程塔希提）1583—86 年到卡亚俄（1585 年出海南行一年，1586 年回来再西行）、库西（日程钦查）来卡亚俄见她，都是故事里的出行。
#       cast/ties.toml 的 extra_12（friends，since 1583-12-31）不变；相识章的 tie 效果落在 1583-02—05，早于 since，整合方留意即可。
# 不写：比尔卡班巴的账、瓦伊蕾家乡附近有人住的岛在哪——正文里一律不提；1583 年利马教务会议对结绳的禁令，本线也不写。
# 用词：瓦伊蕾说“这一角不许抄”“画一圈浪纹”，不借用别人的口头禅。

