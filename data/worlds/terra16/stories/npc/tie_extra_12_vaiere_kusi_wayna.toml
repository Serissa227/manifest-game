# 传闻：1584 夏。银商要买整套星路和绳上的解释，报了个整数，又报了个零头。
[[tracks.chapters]]
key = "tie_extra_12_vaiere_kusi_wayna_turning"
title = "不肯抄的地图"
text = "这顿饭，卡亚俄码头上的人讲了好些天。银商请西边来的女人和钦查的老头吃饭，带了个书记，桌上摆着一袋比索：星路他要抄，绳上的解释他也要，好凑一支船队，去找门达尼亚找到又丢了的那些岛。老头只问：“多少？”“三千。”老头摇头：“整数。”银商回去数了一夜，第二天报：“三千二百一十七。”老头点点头，像是把这个数记下了，顺手把绳塞进袖子。女人问：“买了去，路归谁？”“归船队。”她便把树皮布一层层卷了起来。听说书记的笔还没落下，两个人已经一块儿笑出了声。"
stage = "rumor"
window = [[1584, 5, 1], [1584, 8, 31]]
at = "callao"
cast = ["vaiere", "kusi_wayna"]
mood = "cheerful"
news = "卡亚俄的银商出到三千二百一十七比索，想买西边来的女人的星路和老记事官的绳，一样也没买到。"
