# 转折（传闻）：总署里说，最准的两张河口图都是女人画的。
[[tracks.chapters]]
key = "tie_new_isabel_soto_leonor_ruiz_turning"
title = "总署里的闲话"
text = "贸易总署门口卖水的人说，这阵子领航员们凑在一块儿，总爱比一比手里的河口图。比到最后，最准的两张没有一张出自总署的匠人：一张是老考官的孙女画的，一张是码头地图铺画的。老领航员们听了直笑：“往后过沙洲，是不是还得请她们上船？”新来的宇宙志讲席没笑。他把那张测深图举到窗口看了半天，说他没见过更好的。话传回码头。有人问伊莎贝尔听说了没有，她正在削笔：“听说什么？”笔尖削断了，她又拿起一支。有人去铺子里问莱昂诺尔，她头也不抬，接着往图上描一条水深线：“等涨潮再说。”"
stage = "rumor"
window = [[1575, 5, 1], [1575, 9, 30]]
at = "seville"
cast = ["isabel_soto", "leonor_ruiz"]
mood = "tense"
news = "塞维利亚贸易总署里传开了：领航员手里最准的两张河口图，一张出自老考官的孙女，一张出自码头的地图铺，都是女人画的。"
