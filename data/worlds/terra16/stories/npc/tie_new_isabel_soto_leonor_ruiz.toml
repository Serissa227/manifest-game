# 相识：总署院子的井栏上，同一段海岸的两张图。
[[tracks.chapters]]
key = "tie_new_isabel_soto_leonor_ruiz_meeting"
title = "同一段海岸"
text = "贸易总署的院子里，一个领航员坐在井栏上等着买图。先到的是老考官家的孙女伊莎贝尔，十个指头有一半是黑的；后到的是码头地图铺的莱昂诺尔，图卷用一截湿麻绳捆着。两张图并排摊在井栏上，画的是同一段海岸：从圣维森特角到河口。伊莎贝尔只扫了一眼：“谁画的？画错了。这个岬角往南偏了半里格。”莱昂诺尔没抬头，把麻绳一圈圈缠回去：“量过了再说。”领航员两张都没要：女人画的图他不敢带上船，总署查出来，执照就没了。两个姑娘一个把图夹在腋下，一个扛在肩上，在门洞里面对面站着。看门的拎着钥匙等了半天，只好侧身从她们中间挤过去，先关上半扇院门。第二天，码头的船家先后被两个姑娘拦住，问的是同一句：“有船去圣维森特角吗？”"
stage = "witness"
window = [[1558, 4, 1], [1558, 8, 31]]
at = "seville"
cast = ["isabel_soto", "leonor_ruiz"]
speaker = "isabel_soto"
mood = "tense"
news = "塞维利亚贸易总署的院子里，老考官家的孙女和码头地图铺的姑娘拿着同一段海岸的图，找的是同一个领航员，结果两张都没卖出去。"

