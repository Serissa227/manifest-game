# 同一段海岸（tie_new_isabel_soto_leonor_ruiz）——C7 新线，2026-10-11，Claude（Opus）执笔。
# 标签：GL 标签下的非恋爱线：对手兼同行。伊莎贝尔只对男性（romance.with = m），莱昂诺尔 with = any；
#       两人之间全线不写心动、不写暧昧，没有任何恋爱效果，关系从头到尾是 rivals。
# 人物：伊莎贝尔·德·索托 isabel_soto（1541-03-25，女，贸易总署领航考官的孙女）；
#       莱昂诺尔·鲁伊斯 leonor_ruiz（1540-06-16，女，阿雷纳尔码头地图铺的人）。
#       1558 年相识时一个十七岁、一个快满十八；1586 年抉择时都已四十五岁上下。没有恋爱效果，年龄门禁不涉及。
# 依据：
#   史实——塞维利亚贸易总署保管标准海图（padrón real），领航员上船的海图要照它抄、经总署核过；领航执照经考试发给，女人领不到。
#         阿隆索·德·查韦斯任领航总长到 1586 年；其子赫罗尼莫·德·查韦斯讲宇宙志，1574 年去世；
#         罗德里戈·萨莫拉诺 1575 年接宇宙志讲席，1586 年任领航总长并重核标准海图。
#         瓜达尔基维尔河口的沙洲年年移动，是西印度船队出入的险处；船从塞维利亚趁退潮下行、趁涨潮上行。
#   待核——萨莫拉诺接讲席与任领航总长的年份、1586 年重核海图的范围。正文只说“新来的宇宙志讲席”“新来的领航总长”，
#         choice 章借码头传闻把两者说成同一个人（与上面的年份一致；若核出不同，删去 choice 正文第二句即可，不动玩法）。
#   原创——两人的较量、两张图、伊莎贝尔的纬度表与莱昂诺尔的测深本、标准海图图框角上的两个签名、门缝里的纸条，全部台词。
# 去重：伊莎贝尔把海图署上别人的名字归 bond_isabel_soto；桑卢卡尔沙洲的实测、莱昂诺尔的第一张错图归 bond_leonor_ruiz
#       与 tie_new_margarita_leonor_ruiz——本线一字不提，河口的沙洲也不点桑卢卡尔的名字，不写铅锤抹牛油、测深绳打结。全线不提诺埃尔。
# 缺省走向：1558 总署院子里同找一个领航员，两张都没卖出去（rivals）→ 1563 为河口沙洲吵到点灯，划莱昂诺尔的小船下去量，两人各对一半，
#           回到码头交换纬度表与测深本，当夜两张图各刮改一处（回忆）→ 1575 传闻：领航员手里最准的两张河口图都出自女人之手，新来的宇宙志讲席夸了测深图
#           → 1586 新领航总长重核标准海图，同一段海岸只收一张，女人的图要有执照的人署名转呈（玩家：两张都签 _helped；
#           只递伊莎贝尔的 _one_isabel；只递莱昂诺尔的 _one_leonor；不插手则两人熬一夜拼成一张，托肯认账的老领航员转呈）
#           → 1587 落点：缺省与“两张都签”——同一张图上两个芝麻大的签名（landing，_landing）；
#           只递一张——没被收的那个来指错，被收的那个去改，从此见面转脸、互相挑错（landing_b，_landing_cold）。两个落点都是 rivals。
# 旗标：写 c7_tie_new_isabel_soto_leonor_ruiz_helped / _one_isabel / _one_leonor / _landing / _landing_cold；
#       landing_b 的变体 isabel_taken 读 _one_isabel（基础正文写的是 _one_leonor 的情形）。不读外部旗标。
# 日程：两人 1557 年起都在塞维利亚（cast 已是），不用改。
# 关系：cast/ties.toml 需新增 isabel_soto × leonor_ruiz rivals（tags GL），由整合方加。

