# 靠近：河口的沙洲，一个按纬度、一个按测深，量完交换本子。
[[tracks.chapters]]
key = "tie_new_isabel_soto_leonor_ruiz_closer"
title = "沙洲到底在哪"
text = "这年春天，河口的沙洲又不对了，两条下行的货船先后在那里搁了浅。伊莎贝尔把她爷爷的旧图拍在地图铺的桌上：“在东边。纬度摆在这儿，你自己算。”莱昂诺尔只翻开一本泡皱了的测深本：“西边。三月里我下过锤。”两人从午后吵到铺子点灯，最后说定：天一亮，划莱昂诺尔的小船趁退潮下去量。在河口量了两天，测深锤一回回落下去：东头还是浅的，西头新淤出一片。沙洲在往西爬，两个人都只说对了一半。回来的船上，一句软话也没有。船靠上阿雷纳尔码头，伊莎贝尔从怀里掏出一张纬度表，塞进莱昂诺尔手里；莱昂诺尔把测深本塞了回去，封皮上的水迹还没干。当天夜里，两张图上都有一处被小刀刮掉，重新画过。"
stage = "witness"
window = [[1563, 4, 1], [1563, 8, 31]]
at = "seville"
cast = ["isabel_soto", "leonor_ruiz"]
speaker = "leonor_ruiz"
mood = "cheerful"
news = "塞维利亚码头上的人说，考官家的孙女跟地图铺的莱昂诺尔为河口的沙洲吵了一晚上，天亮划小船下去量，回来一路没说话。"

