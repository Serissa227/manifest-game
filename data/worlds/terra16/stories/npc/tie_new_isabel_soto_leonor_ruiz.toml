# 抉择：新领航总长重核标准海图，同一段海岸只收一张。
[[tracks.chapters]]
key = "tie_new_isabel_soto_leonor_ruiz_choice"
title = "只挑一张"
text = "新来的领航总长要重核标准海图，同一段海岸只收一张。码头上都说，他就是十一年前夸过那张测深图的宇宙志讲席。两张图摊在码头酒馆的长桌上，都画了二十多年，都比总署墙上挂的那张准。伊莎贝尔按住自己那张的纬度表：“一分不差。”顿了顿，又说：“他夸过你的，我知道。”莱昂诺尔用指甲沿着测深线一路点下去：“一寸不差。”可两张都递不进去：女人画的图，得有一个领过执照的人署名转呈。两个人同时把图往我这边推了一寸，手都没松开。"
