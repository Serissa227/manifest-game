speaker = "leonor_ruiz"
text = "新的标准海图挂进了总署，河口那一段用的是老考官孙女的图。莱昂诺尔来看过一次。她在图前站了很久，久到抄图的书记抬头看了她两回，才拿测深绳上的铅坠尖，轻轻敲了敲河口东头：“这里。去年冬天又淤了。不信，你去量。”话当天就传到了伊莎贝尔耳朵里。她没去总署争，雇船下河，一锤一锤量了两天，回来进了总署，对书记说：“笔给我。我画的，我改。”那以后，两人在码头上碰见，都把脸转开。一个月后，地图铺的门缝里塞进来一张纸条，只有一行字：你铺子里那张加那利图，纬度偏了两分。谁画的？"
