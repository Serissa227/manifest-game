# 落点（恋爱，缺省即成）：1560 年春，西南季风前的最后一晚。卡比尔 20 岁、莎迪娅 19 岁，都已成年；写到一个吻为止。
# 主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "pair_kabir_shadia_together"
title = "两只小牛"
text = "西南季风就要来了，卡比尔明天一早回坎贝。最后一晚，莎迪娅划着小船带他出港，收了桨，两个人并排躺在船底。北极星旁边有两颗小星，守着它慢慢绕。“你们阿拉伯人叫它们两只小牛，”卡比尔说，“坎贝的老领航叫守极的。”“小牛守着北极，一圈都不偷懒。”莎迪娅说，“你呢，输了就赖风。”“这回我认输。”他望着天，“风没动。”莎迪娅侧过头。“每年季风前，我在马斯喀特等你赛一场，”她说，“赛完，一起看它们。”说完，她吻了他。船底的水轻轻拍着木板。"
