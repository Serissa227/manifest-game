# 转折（传闻）：1559 年夏，鲁姆人的兵去围巴林，一条兵船到马斯喀特买水。
[[tracks.chapters]]
key = "pair_kabir_shadia_turning"
title = "鲁姆人的船"
text = "码头上这几天只谈一件事：鲁姆人的兵从拉赫萨出来，去围巴林了。港里人人提着心。前天有条载着鲁姆兵的船靠上栈桥，要买淡水，价钱出得不低。赛船的那个姑娘站在井台上，一桶也不让打，听见的人说，她原话是：“七年前我家的房子，是你们的炮烧的。井里有水，给狗喝也不给你们。”井边还站着个坎贝来的年轻领航员，腋下夹着牵星板，一句话没说，也没走。那条船在栈桥边耗到傍晚，空着水桶开走了。"
stage = "rumor"
window = [[1559, 5, 1], [1559, 7, 31]]
at = "muscat"
cast = ["kabir", "shadia"]
mood = "tense"
news = "鲁姆人去围巴林了，马斯喀特港里有条兵船来要淡水，听说赛船的那个姑娘带头不卖，旁边还站着个坎贝来的领航员。"

[tracks.chapters.default]
next = "pair_kabir_shadia_choice"
