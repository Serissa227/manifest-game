# 输家与好桨（pair_kabir_shadia）——配角线，标签 BG；同学（学院期同学，成年后各走各路）。
# 人物：卡比尔（kabir，1540-01-10 生），坎贝来的古吉拉特领航学徒，1557 起回坎贝当领航员；
#       莎迪娅（shadia，1540-08-21 生），马斯喀特的三角帆赛船手，一直在马斯喀特。生年差不到一年。
# 分段：1555 年初相识（rivals，15 岁与 14 岁）；1556 年夏星图（心照不宣，不写效果）；1559 年传闻与抉择（19 岁）；
#       1560 年春落点（卡比尔 20 岁、莎迪娅 19 岁，都已成年，窗口起日不早于 1557-01-01）。
# 依据（史实）：1552 年皮里·雷斯率奥斯曼舰队攻打马斯喀特（莎迪娅家的房子因此烧掉）；
#       1559 年奥斯曼的拉赫萨总督出兵围攻巴林，没有攻下；东北季风约十到十一月起，西南季风四五月前后，印度洋上的船随风而行。
#       “两只小牛”是阿拉伯人对小熊座 β、γ（北极星旁的两颗星）的叫法。
# 原创：两人、赛船与滩上的事、那支最后的好桨、没署名的星图与歪船、牵星板作赌注、“守极的”之说。
# 待核：1559 年奥斯曼兵船到马斯喀特买水一事为虚构，正文用传闻口吻，不写成史事。
# 缺省走向（无人插手）：相识（rivals）→ 星图 → 传闻 → 季风前又赛一场，卡比尔又输 → 1560 年春成为恋人，约好每年季风前在马斯喀特赛一场、赛完看星（远距相守）。
#   抉择：公平的赛（_helped，落点变体：回头提那场一模一样的船）；去海上看星（_matched，落点变体：回头提那一晚）；旁观（无旗标）。
# 并肩：主角在 bond_kabir 或 bond_shadia 的 S 章立了约（promise / heart 设 c7_pair_kabir_shadia_taken）时，
#       主轨道落点的 when 不满足、静默失败；第二条轨道 pair_kabir_shadia_side 写两人成为公平的对手，不写嫉妒，不提主角。
# 共享旗标：读 c7_pair_kabir_shadia_taken；写 c7_pair_kabir_shadia_together（bond_kabir、bond_shadia 的重逢读）、_side、_helped、_matched。
# 口头禅：卡比尔“风变了。”、莎迪娅“再来一趟，敢不敢？”，各只在 meeting 里完整说一次。
# 日程（整合方改 cast）：卡比尔的日程学院期在 zabid_city、1557 年起在 cambay，而本线各章在 muscat——
#       需给卡比尔补 1555-01..03、1556-05..07 的 muscat（学堂船泊港）与 1559-09..11、1560-03..04 的 muscat（随季风船来），或确认故事章节不查在场；
#       cast/ties.toml 里 adult_kabir_shadia 的 lovers 起日 1558-12-31 应改到 1560-03-01 之后，并加 taken=false 的条件。
# 秘密：卡比尔偷背纳吉玛家的航路诗、莎迪娅撞礁没写进航簿（归 bond_kabir、bond_shadia），本线不写。
# 地点（2026-11-01 close-places）：学院期两章 witness（1555、1556）正文写学堂的船泊在马斯喀特，at 保留 muscat：养成期纳吉玛在扎比德，看不到，只作见闻（witness 本来可看可不看）。

