[[tracks.chapters]]
key = "pair_kabir_shadia_side_landing"
title = "公平的对手"
text = "西南季风前，卡比尔要回坎贝了。临走前两人又赛了一场，这回他赢了，站在齐腰的水里，半天说不出话。莎迪娅涉水过去，把自己用了五年的桨塞进他怀里，桨柄已经磨出一个凹。“明年用这个。赢了也不许说是桨的功劳。”“我赢了，”卡比尔说，说完又愣了愣，“真的赢了，没有风的事。”“风今天没偏心，我认。”莎迪娅笑着拍他的肩，“明年我赢回来，你再编。”"
