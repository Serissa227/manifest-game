# 抉择：1559 年秋，季风之前。他拿牵星板押一场赛，她问能不能先不比。
[[tracks.chapters]]
key = "pair_kabir_shadia_choice"
title = "季风之前"
text = "东北风快起了，滩上的船一条条抢着装货。卡比尔在沙地上划了道线，把他爹留下的牵星板往线上一放：“开航前再赛一场。我押它。”莎迪娅没看那块牵星板，低头盯着自己的脚尖：“这回先不比，行不行？”卡比尔愣住了，转头对我说：“你听见没有？她怕输。”“我赢你十几回了，怕什么。”莎迪娅这才抬头，没笑，“这一场先放着。”两个人一起看向我。"
stage = "involve"
window = [[1559, 10, 1], [1559, 11, 30]]
at = "muscat"
cast = ["kabir", "shadia"]
speaker = "shadia"
mood = "tender"
news = "东北季风快起了，马斯喀特滩上，坎贝来的领航员拿牵星板押了一场赛，赛船的姑娘却问能不能先不比。"

