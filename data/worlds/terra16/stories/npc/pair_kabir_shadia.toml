# 相识：1555 年初，马斯喀特的滩上。三场败仗，一支好桨。
[[tracks.chapters]]
key = "pair_kabir_shadia_meeting"
title = "输了三次的人"
text = "学堂的船泊在马斯喀特，滩上赛船的人都散了。坎贝来的少年卡比尔坐在翻扣的船底上，用湿手指试风，一遍又一遍。莎迪娅拎着两支桨走过来，一支裂了，一支是这季剩下的最后一支好桨。她也输了三场，输给的和他是同一条蓝边帆的船。这副一身盐、一脸不服的样子，她一眼就认得。她把好桨往他怀里一塞，自己留下裂的：“再来一趟，敢不敢？”卡比尔握上桨柄，磨破的掌心一疼，嘴却不停：“坎贝的领航人不输三场。刚才那是风变了。”莎迪娅一屁股坐进沙里，笑得拿不住那支裂桨。"
stage = "witness"
window = [[1555, 1, 15], [1555, 3, 31]]
at = "muscat"
cast = ["kabir", "shadia"]
speaker = "shadia"
mood = "cheerful"
news = "马斯喀特的赛船滩上，有两个各输了三场的年轻人，听说一个递桨一个嘴硬，递桨的那个笑得坐进了沙里。"

[tracks.chapters.default]
next = "pair_kabir_shadia_closer"
effects = [{ kind = "tie", a = "kabir", b = "shadia", relation = "rivals" }]

# 靠近：1556 年夏，学堂的图桌。两张没署名的星图，两条歪船。学院期，到心照不宣为止。
[[tracks.chapters]]
key = "pair_kabir_shadia_closer"
title = "没有署名的星图"
text = "两人打赌谁的星图画得准，各画一张，不署名，交给图桌上的人混在一堆里。发回来那天，莎迪娅抽出一张就笑：“北极星旁边这两颗小的，描了三遍墨。除了你，谁怕它们跑掉？”卡比尔抽出的那张，图角画着条歪船，盖住一处画错的浅滩。“遮错处遮得这么大方，也只有你。那两颗小星，你描得也不比我马虎。”他拿起笔，在那条船旁边添了一条，比她的还歪。莎迪娅看了半天，把赌注的一袋椰枣推过去：“退你。下回再赌。”卡比尔又推回来：“下回你先出题。”两个人的耳朵都红了，一个盯着墙，一个盯着自己的鞋。"
stage = "witness"
window = [[1556, 5, 1], [1556, 7, 31]]
at = "muscat"
cast = ["kabir", "shadia"]
speaker = "kabir"
mood = "tender"
news = "马斯喀特泊着的学堂船上，有人拿两张没署名的星图打赌，画图的两个一眼认出了对方那张，赌注只好原样退回去。"

[tracks.chapters.default]
next = "pair_kabir_shadia_turning"
