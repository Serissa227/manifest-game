# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BG（男女恋人；卡斯帕 romance=f，格里特 romance=m）。
# 人物：卡斯帕（kaspar，1521-08-15 生，退伍的德意志雇佣兵炮手）；
#       格里特（griet，1523-12-08 生，安特卫普码头酒馆的寡妇老板娘）。生年差 2 年多，成为恋人时 54 与 51—52 岁，门禁全过。
#       隔壁的三个孩子是本线虚构的小人物，不进 cast。两人 1553—1590 都在 antwerp，不用改日程。
# 依据·史实：西班牙王室 1575 年 9 月再次宣布停付（国家破产），驻尼德兰的兵饷断了；1576 年秋安特卫普人心惶惶，
#       城堡（西班牙兵驻守）久不得饷，十一月初尼德兰议会的兵进城、对着城堡筑工事；1576 年 11 月 4—5 日“西班牙之怒”，
#       哗变的士兵洗劫安特卫普。当时的兵用火绳枪与长枪，所以门板上扎的是铅弹，不是箭。
# 依据·原创：粉笔写在门背后的酒账、修瘸腿椅子的钉子、后巷一步一步量出来的宽度、后屋里邻居家的三个孩子、
#       斜着卡在巷口的门板、门板上嵌的两颗铅弹、“已还”两个字。1574 年的初遇只写在本线（其他文件不写他们怎么认识）。
#       待核：1574 年安特卫普寡妇酒馆赊账的写法（正文只写“账”和“粉笔”）；城堡冲出来的兵走哪条街（正文只写“沿河那条街”）。
# 缺省走向：meeting（1574 春，门背后的账，椅子修好）→ together（1575 秋停付，量后巷，成为恋人，lovers + 旗标）→
#       turning（1576-10 传闻，土袋与新门闩）→ choice（1576-11-04，门板与孩子；缺省：卡斯帕卸门板挡巷口，格里特从后巷送走孩子）→
#       epilogue（1577 春，门板装回去，账上写“已还”，卡斯帕留下）。圆满，没有坏结局。
# 玩家能做的：choice 里带孩子（children）、扛门板（door）、守着等（watch）。前两条设 _helped，只改那一夜的做法与落点章变体，
#       不改结局；两人的恋爱写在 together 的 default 里，与玩家在不在场无关。
# 旗标：写 c7_pair_kaspar_griet_together（tie_extra_10 读，它止于 1576-10，所以 together 必须在 1575 年内：窗口 1575-10..12）、
#       c7_pair_kaspar_griet_helped（本文件落点章变体读）。不读外部旗标。
# 整合：cast/ties.toml 的 kaspar_griet 现为 lovers、since = [1576, 12, 31]，与本线对不上，应改为 since = [1575, 12, 31]（together 的窗口止日），
#       note 里的“把门板拆下来当了掩体”仍可用，可补一句“第二年春天又装了回去”。1576 年 7 月阿尔斯特哗变的军饷成色归 tie_extra_10，
#       扬运书归 bond_jan，乌尔苏拉×比安卡只写账，本线均不写。

[[tracks]]
key = "pair_kaspar_griet"
name = "门板还要装回去"
kind = "request"
start = "pair_kaspar_griet_meeting"
auto = true
cast = ["kaspar", "griet"]

# 相识（1574）：粉笔写的酒账，修好的椅子。
[[tracks.chapters]]
key = "pair_kaspar_griet_meeting"
title = "门后的账"
text = "门背后是格里特的账本。新来的炮手赊了三个月的啤酒，她拿粉笔一笔一笔写在木头上，字有巴掌大。卡斯帕站在门口读完，说：“字太大。东头第三家隔着街都读得出。”“就是要他们读得出。”格里特拿起粉笔，在末尾又添一笔，比前面的更大。第二天晌午，他没拿钱来，拿来一包钉子，把那把总往一边歪的椅子翻过来，一颗一颗敲进榫缝。放回原处，椅子不晃了。卡斯帕说：“坐坏的，总得修好。”格里特拿脚尖试了试椅腿：“这不抵酒钱。”门背后那一行，她一个字没动。"
stage = "witness"
window = [[1574, 1, 15], [1574, 3, 31]]
at = "antwerp"
cast = ["kaspar", "griet"]
speaker = "griet"
mood = "cheerful"
news = "安特卫普码头那家寡妇酒馆的门背后又添了一笔酒账，欠账的炮手没还钱，倒把店里那把瘸椅子修好了。"

[tracks.chapters.default]
next = "pair_kaspar_griet_together"
effects = []

# 落点之一（1575 秋）：王室停付，量后巷，成为恋人。
[[tracks.chapters]]
key = "pair_kaspar_griet_together"
title = "停付的那个秋天"
text = "王室停了付款，城堡里的兵拿不到饷，这些天街上的脚步声一天比一天乱。这晚打烊以后，卡斯帕没走。他提起灯，领格里特推开后门，顺着窄巷一步一步量过去：“这里过一个人。这里过一辆车，转角得卸一个轮子。”到了巷口，他回头看了一眼酒馆的后门。“先找退路，再摆炮。我年轻时反着来过一回。”格里特把存粮一袋一袋挪进后屋，挪完数了数：“够吃到开春。你那份我算进去了。”她在炉边他身旁坐下。炉火响了一声，他低头吻了她，她仰起脸接住。门背后那笔酒账还在。她起身时看了一眼粉笔，没拿，留在钉子上。"
stage = "witness"
window = [[1575, 10, 1], [1575, 12, 31]]
at = "antwerp"
cast = ["kaspar", "griet"]
speaker = "kaspar"
mood = "tender"
news = "王室又停了付款，安特卫普的兵拿不到饷；码头那家寡妇酒馆打烊以后炉火还亮着，常客说是那个炮手没走。"

[tracks.chapters.default]
next = "pair_kaspar_griet_turning"
effects = [
  { kind = "tie", a = "kaspar", b = "griet", relation = "lovers" },
  { kind = "flag", flag = "c7_pair_kaspar_griet_together" },
]

# 转折（1576-10，传闻）：土袋与新门闩。
[[tracks.chapters]]
key = "pair_kaspar_griet_turning"
title = "对着城堡的土袋"
text = "码头上的人这个月只说一件事：城堡里的西班牙兵几个月没拿到饷，外头哗变的兵又朝安特卫普这边看。听说市政厅的人在城堡对面堆起了土袋，议会请来的兵也快到了。码头那家寡妇酒馆换了后门的门闩，新的，铁的，比旧的粗一圈。常客说，那个赊账的炮手每天晌午沿着码头走一遍，边走边数街口，嘴里念念有词，像在点名。"
stage = "rumor"
window = [[1576, 10, 1], [1576, 10, 31]]
at = "antwerp"
cast = ["kaspar", "griet"]
mood = "tense"
news = "安特卫普城堡里的兵几个月没拿到饷，城里有人对着城堡堆土袋；码头那家寡妇酒馆换了后门的门闩。"
rumor_days = 30

[tracks.chapters.default]
next = "pair_kaspar_griet_choice"
effects = []

# 抉择（1576-11-04）：门板与孩子。
[[tracks.chapters]]
key = "pair_kaspar_griet_choice"
title = "门板先卸下来"
text = "十一月四日，城堡的门开了，哗变的兵像水一样漫上街。卡斯帕站在窗边听了一会儿：“南边来的，沿河那条街，两队，第二队乱了拍子。”他二话不说，把酒馆的门板从合页上卸下来，扛起就往巷口走。格里特一把拽住门板的边：“欠酒钱可以，欠人命不行。后屋还有隔壁的三个孩子，得先送出去。”“巷口不挡，走不脱。”他没松手。“那你挡你的，孩子我送。门板日后再装。”后屋的门缝里，三双眼睛正看着我。"
stage = "involve"
window = [[1576, 11, 1], [1576, 11, 10]]
at = "antwerp"
cast = ["kaspar", "griet"]
speaker = "griet"
mood = "tense"
news = "西班牙之怒那一夜，安特卫普码头那家寡妇酒馆的门板被拆下来挡在了巷口，听说后巷里送出去好几个孩子。"

[tracks.chapters.default]
next = "pair_kaspar_griet_epilogue"
effects = []

[[tracks.chapters.choices]]
key = "children"
text = "我抱起最小的孩子，领着另外两个钻进后巷"
reply = "最小的那个搂着我的脖子，另外两个攥住我的衣角。临出后门，卡斯帕扔过来一句：“贴右边墙，到第二个拐角停。”我们钻进窄巷，走到拐角回头，门板已经竖在巷口，格里特站在板后，正往他手里递楔子。"
next = "pair_kaspar_griet_epilogue"
news = "安特卫普那一夜，有个外乡人抱着最小的孩子钻出码头酒馆的后巷，据说巷口有块门板斜着立到了天亮。"
effects = [
  { kind = "flag", flag = "c7_pair_kaspar_griet_helped" },
  { kind = "affinity", person = "griet", value = 5 },
  { kind = "affinity", person = "kaspar", value = 3 },
  { kind = "memory", memory = "mem-pair_kaspar_griet-alley", title = "后巷里的三个孩子" },
]

[[tracks.chapters.choices]]
key = "door"
text = "我去扛门板的另一头，帮他立在巷口"
reply = "门板比看着重得多，背面还留着格里特的粉笔字。我们把它斜着卡进巷口，卡斯帕拿脚试了试：“斜一指，三个人的视线都挡住。”格里特已经转身回了后屋，把孩子一个一个领出来，从门板后面送进河边那头的小巷。"
next = "pair_kaspar_griet_epilogue"
news = "安特卫普码头酒馆的门板被斜着卡在巷口，听说有个外乡人帮着扛的；酒馆里的孩子一个接一个从板后送走了。"
effects = [
  { kind = "flag", flag = "c7_pair_kaspar_griet_helped" },
  { kind = "affinity", person = "kaspar", value = 5 },
  { kind = "affinity", person = "griet", value = 3 },
  { kind = "memory", memory = "mem-pair_kaspar_griet-door", title = "斜卡在巷口的门板" },
]

[[tracks.chapters.choices]]
key = "watch"
text = "我留在酒馆里，把前门闩上等天亮"
reply = "我闩好前门，坐到柜台后头。街上的脚步一阵近，一阵远。格里特给后屋的孩子一人发了截粉笔，让他们在地板上画船，不许出声。天快亮时，后门响起三长一短的敲门声。卡斯帕扛着门板回来，板子缺了一个角，板面上嵌着两颗铅弹，他身上一处伤也没有。"
next = "pair_kaspar_griet_epilogue"
news = "西班牙之怒那一夜，安特卫普码头那家寡妇酒馆前门闩到天亮，炮手扛着缺了角的门板回来，人没伤着。"
effects = [
  { kind = "affinity", person = "griet", value = 1 },
  { kind = "affinity", person = "kaspar", value = 1 },
]

# 落点之二（1577 春）：门板装回去，账上写“已还”。
[[tracks.chapters]]
key = "pair_kaspar_griet_epilogue"
title = "装回去的门"
text = "开春，卡斯帕把那块门板抬到院子里，刨平，挖出铅弹，弹孔用楔子填死，缺的角补上一块新橡木，又装回酒馆门口，合页拿羊油擦过。门背后的粉笔字被蹭花了边，1574 年那笔账的数目还认得出。格里特站上凳子，在最底下写了两个字：“已还。”卡斯帕仰头看：“拿什么还的？”“你自己知道。”她跳下凳子，把粉笔放回钉子上。打烊时，他把帽子挂在楼梯口的钩子上，没再走向柜台去记账。"
stage = "witness"
window = [[1577, 4, 1], [1577, 6, 30]]
at = "antwerp"
cast = ["kaspar", "griet"]
speaker = "griet"
mood = "cheerful"
news = "安特卫普码头那家寡妇酒馆的门板装回去了，门背后那笔老酒账底下写了两个字：已还。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_pair_kaspar_griet_helped" }]
text = "开春，卡斯帕把那块门板抬到院子里，刨平，挖出铅弹，弹孔用楔子填死，缺的角补上一块新橡木。隔壁的三个孩子跑来了，两个大的扶着门板，最小的踮着脚递钉子，递一颗，卡斯帕说一声“好”，门就装回了酒馆门口。门背后的粉笔字被蹭花了边，1574 年那笔账的数目还认得出。格里特站上凳子，在最底下写了两个字：“已还。”卡斯帕仰头看：“拿什么还的？”“你自己知道。”她跳下凳子，把粉笔放回钉子上。打烊时，他把帽子挂在楼梯口的钩子上，没再走向柜台去记账。"
