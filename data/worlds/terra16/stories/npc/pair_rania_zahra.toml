title = "第一张许可"
text = "扎赫拉要第一次自己开讲、自己发许可了，讲席设在摩卡港边的清真寺。日子定下来，偏偏和拉妮娅家书船离岸撞在同一天——东北季风刚起，船主说一天也等不得。拉妮娅在码头上拦住我，手里一张船期单攥得发皱：“船主是我爹的老伙计，我一开口，他就拿季风堵我的嘴。你替我去问问，船能不能晚开一天。”我先绕到讲席，把开船的日子告诉扎赫拉。她正点学生的名，手里的笔没停：“她来不来，与我何干。”说完转身吩咐学生，把前排靠柱子的那个座位留出来，垫子摆正，垫子上压一张签条，只写一个“留”字。学生问留给谁。扎赫拉翻开名册：“留给一个会迟到的人。”"
