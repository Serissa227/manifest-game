window = [[1556, 8, 1], [1556, 9, 25]]
at = "zabid_city"
cast = ["rania", "zahra"]
speaker = "rania"
mood = "tender"
news = "扎比德有人每天往女学者门下送一罐杜安谷的蜂蜜，送了一个多月，罐上什么也没写。"

