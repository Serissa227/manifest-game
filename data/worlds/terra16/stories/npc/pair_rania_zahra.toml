# —— 靠近：1556 年八九月，扎比德，许可考试以前（学院期，到心照不宣为止）——
[[tracks.chapters]]
key = "pair_rania_zahra_closer"
title = "每天一罐蜂蜜"
text = "传授许可的日子定在十月。八月里，扎赫拉的嗓子哑了，她没跟任何人提，照样头一个到，照样挑别人的错，只是挑得一回比一回短，挑完就抿一口水。拉妮娅看出来了，没说破。从第二天起，扎赫拉的书案边每早多一罐杜安谷的蜂蜜，罐上不写诗，也不留名。第三天，拉妮娅又搬来一块枣木板，往案上一搁：“我念传述链，你跟着默背。哪条没记牢，你敲一下，我替你记，省得你开口。”扎赫拉瞪她：“我用不着。”说完拿指节在板上敲了一下。那几天，两人之间只有笃、笃的声音。有一回扎赫拉敲得特别重——是拉妮娅把一条传述链里的两个名字念反了。拉妮娅瞪回去，扎赫拉用口型说了三个字。那三个字拉妮娅听了两年，一看就懂，笑出了声，被隔壁的人嘘了一下。"
