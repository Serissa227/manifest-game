title = "骆驼的韵脚"
text = "课歇的时候，有个女孩念起一首航路诗的头两句，说的是从亚丁到吉达。拉妮娅不等人请，站起来一口气续了六句，韵脚东倒西歪，念完还冲大家扬下巴。角落里的扎赫拉头也不抬：“你的韵押得像骆驼走路——左脚，右脚，瘸一下。”满屋子的人都去看拉妮娅的脸。拉妮娅一拍巴掌：“别停！下半句我来接。”当场又续了四句，把骆驼、瘸腿和扎赫拉的名字全押了进去，末一句是：瘸腿的骆驼也走得到吉达，只要扎赫拉在前头骂着它走。屋里笑翻了。老夫人放下念珠，把两个人一起赶出了门。到了廊下，两人还在争末一句该不该短两个字。扎赫拉问：“出处呢？”拉妮娅说：“出处是你。”廊外卖水的人收了摊，挑着空罐子走了，她们还没争完。"
