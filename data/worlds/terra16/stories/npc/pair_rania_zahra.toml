title = "书船与讲席"
text = "书船从吉达回到摩卡的第二天，拉妮娅扛着一部开罗的抄本进了港边的讲席，往扎赫拉的书案上一放：“开罗书市最贵的一部，抄书匠拍着胸口说一个错字都没有。”扎赫拉翻了不到一盏茶的工夫，用指甲在页边划了三道：“这里，这里，还有这里。”拉妮娅凑过去一看，脸涨得通红，当场编了四句诗骂那个抄书匠，骂到第三句，韵又歪了。“第三句，”扎赫拉说，“瘸了。”两人从讲席吵到后面的台阶上，吵了一下午，跟十二三岁时在廊下一模一样。太阳落下去，拉妮娅的肚子先叫了。扎赫拉站起来拍拍衣裳：“吃饭。下一趟的书，装船以前先把目录寄给我。”"
stage = "witness"
window = [[1560, 4, 1], [1560, 6, 15]]
at = "mocha"
cast = ["rania", "zahra"]
speaker = "rania"
mood = "cheerful"
news = "红海书船上那个哈德拉毛女人，每回到摩卡都给扎比德的扎赫拉老师捎书，两人见面就吵，吵完一起吃饭。"
