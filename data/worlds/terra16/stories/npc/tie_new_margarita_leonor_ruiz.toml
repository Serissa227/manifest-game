# —— 相识：1560 年春，塞维利亚码头的地图铺 ——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_meeting"
title = "订一张庄园图"
text = "侯爵府派来订图的侍女叫玛格丽塔，袖口镶着一圈旧花边，进门先把墙上的图挨张看了一遍，才说正事：乡下的庄园要一张新图。她一边报地界，一边把半条街的闲话都带了进来——管家的老婆说东边那块橄榄地是侯爵的，邻村的神父说是教堂的，两家为一棵树吵了三年，去年连骡子都踢起来了。帮工莱昂诺尔趴在桌上量尺子，头也不抬：“画出来，再争。”玛格丽塔被噎住了，坐在凳子上扯了半天花边，又凑过去，声音压得只有图纸听得见：“管家扣了我们三个月的工钱——我可没说是我说的。”莱昂诺尔的笔停了一下。东边那块地，她画成了一道虚线。"
stage = "witness"
window = [[1560, 3, 1], [1560, 6, 30]]
at = "seville"
cast = ["margarita", "leonor_ruiz"]
speaker = "margarita"
mood = "cheerful"
news = "塞维利亚码头的地图铺接了侯爵府一张庄园图，来订图的侍女在铺子里坐了一下午，半条街的闲话都让她说遍了。"

[tracks.chapters.default]
next = "tie_new_margarita_leonor_ruiz_closer"
effects = [{ kind = "tie", a = "margarita", b = "leonor_ruiz", relation = "friends" }]

# —— 靠近：1565 年秋，赶一张沙洲图的夜 ——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_closer"
title = "举灯的人"
text = "河口的沙洲又挪了，船队等着出港，船主们轮番来拍桌子要新图。莱昂诺尔把领航员送来的测深记录摊了一桌，一个数一个数往图上落，嘴里骂：“该死的沙洲，一年挪三回。”玛格丽塔下了工就来了，端起油灯站在她肩后。往常她一进门，府里谁跟谁吵了、谁的信写给了谁，一张嘴全倒出来；这一夜她说的是自己：床底下有只钱匣子，攒了九年，每一枚都记了账。“等攒够了，我就再也不替别人传话了。”莱昂诺尔没抬头：“灯低一点。”灯油添了三回。天快亮时，莱昂诺尔搁下笔，从怀里摸出一个叠得方方正正的纸块，展开是一张发黄的图，有一处浅滩画偏了。“我画的第一张。错的。留着提醒自己。”玛格丽塔把灯凑过去，照着那处浅滩看了很久。"
stage = "witness"
window = [[1565, 9, 1], [1565, 12, 31]]
at = "seville"
cast = ["margarita", "leonor_ruiz"]
speaker = "leonor_ruiz"
mood = "tender"
night = true
news = "塞维利亚码头地图铺的灯亮了一整夜，新的沙洲图赶在船队出港前交了；侯爵府那个爱说闲话的侍女在里头举了一夜的灯。"

[tracks.chapters.default]
next = "tie_new_margarita_leonor_ruiz_turning"
effects = [{ kind = "tie", a = "margarita", b = "leonor_ruiz", relation = "confidants" }, { kind = "memory", memory = "mem-tie_new_margarita_leonor_ruiz-closer", title = "举灯的人" }]

# —— 转折：1571 年，侯爵死在那不勒斯（传闻）——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_turning"
title = "那不勒斯来的信"
text = "那不勒斯来的信说，侯爵死在了副王任上。没过几天，彼拉多之家的门口贴出名单：新主人要遣散一半的侍女和杂役，剩下的调去乡下的庄园。码头上卖炸鱼的婆子说，那天傍晚，府里那个嘴最快的侍女抱着一只钱匣子，坐在地图铺门口的台阶上，从日落坐到点灯，一句话也没说。画图的那个女人出来过一回：“进来坐，台阶凉。”侍女摇摇头：“我在算账。”过了几天，婆子又在鱼摊上听见她开口了：遣散的工钱领到了，跟匣子里的一凑，正好一笔整数。“这话可是她自己说的。”婆子说。"
stage = "rumor"
window = [[1571, 5, 1], [1571, 8, 31]]
at = "seville"
cast = ["margarita", "leonor_ruiz"]
mood = "sad"
news = "那不勒斯来信说侯爵死了，塞维利亚的侯爵府要遣散一半的侍女和杂役；有人看见府里那个嘴快的侍女抱着钱匣子，在码头的台阶上坐到天黑。"

[tracks.chapters.default]
next = "tie_new_margarita_leonor_ruiz_choice"
effects = []

# —— 抉择：1572 年，抱着钱匣子来入股 ——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_choice"
title = "揣着积蓄来的人"
text = "玛格丽塔抱着那只钱匣子进了地图铺，往绘图桌上一放，震得墨水瓶跳了一下。“我要入股。”老东家死后，铺子是莱昂诺尔一个人撑下来的。她看都没看匣子：“不收。”拿朋友十六年攒下的钱撑自己的门面，她丢不起这个人；再说，行会的册子上从来没写过女侍做合伙人。“册子是人写的。”玛格丽塔掀开匣盖，里头的钱一摞一摞码得齐齐整整，每摞底下压着一张小纸条，写着哪年哪月。“画出来，再争——你自己说的。”莱昂诺尔把笔往桌上一放。铺子里只剩河上的号子声。两个人僵着，一起转过头来看我。"
stage = "involve"
window = [[1572, 1, 15], [1572, 5, 31]]
at = "seville"
cast = ["margarita", "leonor_ruiz"]
mood = "tense"
news = "侯爵府遣散的那个侍女抱着钱匣子进了塞维利亚码头的地图铺，开口就要入股，铺主连匣子都没看，说不收。"

[tracks.chapters.default]
