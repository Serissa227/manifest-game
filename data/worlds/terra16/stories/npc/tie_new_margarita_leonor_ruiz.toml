# —— 转折：1587 年，加的斯的火（传闻）——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_turning_b"
title = "加的斯的火"
text = "加的斯港里的焦船壳还没拖干净。码头上的人说英格兰人烧了二十条船，到了酒馆就成了三十条；那个英格兰人，这里的人只叫他“龙”。往后，船主们一窝蜂往塞维利亚跑，要新图，还要备一份。从塞维利亚回来的领航员说，码头那间地图铺的灯天天亮到半夜，两个女人一个画、一个记账，订单从桌上堆到了地上。他去取图那天，记账的那个在里头喊：“加的斯的三张，今天交！”画图的那个把笔一放：“催，催，再催你来画！”隔着一条街都听得见。领航员交了定金，他那张图排到了明年开春。"
stage = "rumor"
window = [[1587, 5, 1], [1587, 8, 31]]
at = "cadiz"
cast = ["margarita", "leonor_ruiz"]
mood = "tense"
news = "英格兰人烧了加的斯一港的船，船主们都跑去塞维利亚订新图；码头那间地图铺接单接到半夜，两个女人吵架隔街都听得见。"

