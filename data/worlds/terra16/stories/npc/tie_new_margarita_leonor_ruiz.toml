# —— 落点：1588 年，换招牌（缺省即发生；主角与其中一人立了 S 约定时静默失败，由 _side 轨道接）——
[[tracks.chapters]]
key = "tie_new_margarita_leonor_ruiz_landing"
title = "招牌上的两个名字"
text = "最后一张订单交出去那天，莱昂诺尔扛着梯子出了门，把铺子的旧招牌卸下来，换上一块新刷的。新招牌上是两个名字，玛格丽塔的在前头。玛格丽塔站在街当中，仰着脖子看了很久，看得半条街的人都停下来跟着看。“谁让你这么写的？借据上可没这一条。”莱昂诺尔在梯子上拿刷子指了指她：“画出来，再争。”“我可没说我愿意。”玛格丽塔一边笑一边提起裙子，上了梯子，在招牌底下当着半条街吻了她。卖炸鱼的婆子拍着巴掌喊：“这一笔记谁账上？”那天以后，楼上那间说是租给房客的屋子，只放书。"
stage = "witness"
window = [[1588, 1, 15], [1588, 6, 30]]
at = "seville"
cast = ["margarita", "leonor_ruiz"]
speaker = "margarita"
mood = "cheerful"
news = "塞维利亚码头的地图铺换了招牌，写着两个女人的名字；换招牌那天，当年侯爵府的那个侍女爬上梯子，当着半条街亲了画图的那个。"
