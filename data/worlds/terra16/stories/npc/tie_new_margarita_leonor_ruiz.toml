title = "地图铺的合伙人"
text = "最后一张订单交出去那天，莱昂诺尔换了铺子的招牌，两个名字并排刷在上头，一般大。玛格丽塔站在街当中，叉着腰看了半天：“这下好了，全塞维利亚都知道这铺子有我一半。”“全塞维利亚早就知道了。”莱昂诺尔在梯子上描最后一笔，“谁让你逢人就说。”“我可没说是我说的！”两个人一个在梯子上、一个在梯子下，从晌午吵到天黑。吵完了，玛格丽塔锁门，莱昂诺尔扛梯子，一起去码头吃炸鱼。卖鱼的婆子照旧给她们留了两条最大的，钱记在玛格丽塔的账上。"
stage = "witness"
window = [[1588, 1, 15], [1588, 6, 30]]
at = "seville"
