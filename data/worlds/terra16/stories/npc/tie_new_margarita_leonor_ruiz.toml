# C7 重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。新线，没有旧版。
# 标签：GL（恋爱线；两人都是 romance.with = any）。
# 人物：玛格丽塔 margarita（1540-01-19，塞维利亚塔里法侯爵府的侍女，1572 年离开侯爵府）
#     × 莱昂诺尔·鲁伊斯 leonor_ruiz（1540-06-16，塞维利亚码头地图铺的帮工，后来撑起这间铺子）；生年差不到半年。
#   各章年龄：1560 相识时都已满 19；靠近期只用 friends / confidants，不写告白；
#   恋人效果在 1588-01-15 起的落点章：两人都 47 岁（最早可用日 1558-06-16）。
# 依据：
#   史实——第二代塔里法侯爵佩尔·阿凡·德·里韦拉（1558 年封阿尔卡拉公爵）1559—71 年任那不勒斯副王，常年不在塞维利亚，
#         府邸“彼拉多之家”由管家照管；1571 年 4 月 2 日死于那不勒斯。
#         1587 年 4 月底至 5 月初，德雷克的船闯进加的斯港，烧掉港内二十余条船（西班牙方面的数字；他自称三十余条）。
#   原创——两人与码头的地图铺；府里遣散侍女、调人去乡下庄园（侯爵死后府中人事变动的细节没有查到，写成传闻）；
#         加的斯之后塞维利亚船主争订新图、铺子接单到半夜；卖炸鱼的婆子；钱匣子里每摞钱底下压的日期纸条。
#   待核——侯爵死讯传到塞维利亚的确切时间（正文只写“那不勒斯来的信”，不写日子）。
#   与人设对齐：莱昂诺尔的第一张错图照人设卡“叠成小方块揣在怀里”，所以 closer 里她是从怀里摸出来的，不是从抽屉里。
# 去重：桑卢卡尔沙洲的实测归 bond_leonor_ruiz，本线只写“河口的沙洲又挪了”、照领航员送来的测深记录画；
#   把海图署上别人的名字归 bond_isabel_soto，不写；全线不提诺埃尔、“那位骑士”与针线盒里的缎带（玛格丽塔的羁绊线）。
# 缺省走向：1560 订庄园图，成为朋友 → 1565 替莱昂诺尔举灯画了一夜，成为知己 → 1571 侯爵死在那不勒斯，府里遣散侍女（传闻）
#   → 1572 抱着钱匣子来入股：没人插手时吵了一个礼拜，莱昂诺尔把钱当借款收下，玛格丽塔搬进铺子楼上当“房客”
#   → 1587 加的斯被烧，订单堆满桌（传闻）→ 1588 换招牌，两个名字，成为恋人（落点，缺省即发生，圆满）。
#   玩家能做的：去行会作保，玛格丽塔作为合伙人记进行会的册子（_helped，落点 variants 读）；
#   或劝莱昂诺尔收下——她收一半、推回一半（_mediated，落点 variants 读）。都不改变结局。
#   主角与其中一人立了 S 约定（_taken）时，主轨道在落点静默失败，由 _side 轨道写两人做了一辈子的合伙人（confidants，不把 closer 已设的知己降回朋友）。
# 设旗标：c7_tie_new_margarita_leonor_ruiz_helped、c7_tie_new_margarita_leonor_ruiz_mediated、
#   c7_tie_new_margarita_leonor_ruiz_together、c7_tie_new_margarita_leonor_ruiz_side。
# 读旗标：c7_tie_new_margarita_leonor_ruiz_taken（bond_margarita、bond_leonor_ruiz 的 S 章 promise / heart 设）。
# 整合：cast/ties.toml 新增 margarita × leonor_ruiz（GL）：1560 friends → 1565 confidants → 1588-01-15 起 lovers；
#   玛格丽塔 1572 年起离开侯爵府，仍在塞维利亚（地点不变、身份变），日程不用改；人设卡“按当前年份”的说法照此。

