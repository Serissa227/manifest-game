[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_tie_new_margarita_leonor_ruiz_helped" }]
text = "行会的册子上，这两个名字十六年前就并排写着了，只有铺子的招牌一直没改。最后一张订单交出去那天，莱昂诺尔扛着梯子出了门，换上一块新刷的招牌：两个名字，玛格丽塔的在前头。玛格丽塔站在街当中看了很久，看得半条街的人都停下来跟着看。“册子上我在后头，招牌上倒让我在前头？谁让你这么写的？”莱昂诺尔在梯子上拿刷子指了指她：“画出来，再争。”“我可没说我愿意。”玛格丽塔一边笑一边提起裙子，上了梯子，在招牌底下当着半条街吻了她。卖炸鱼的婆子拍着巴掌喊：“这一笔记谁账上？”楼上玛格丽塔住了十六年的那间屋子，从那以后只放书。"

[[tracks.chapters.variants]]
key = "mediated"
when = [{ kind = "flag", flag = "c7_tie_new_margarita_leonor_ruiz_mediated" }]
text = "最后一张订单交出去那天，莱昂诺尔扛着梯子出了门，换上一块新刷的招牌：两个名字，玛格丽塔的在前头。玛格丽塔站在街当中看了很久，看得半条街的人都停下来跟着看。“我才入了一半的股，谁让你这么写的？”莱昂诺尔在梯子上拿刷子指了指她：“画出来，再争。”“我可没说我愿意。”玛格丽塔一边笑一边提起裙子，上了梯子，在招牌底下当着半条街吻了她。当天晚上，她把那一半钱倒在柜台上——十六年前推回来的那一堆，每摞底下的纸条都还在，一枚没动。“这回入全了。”楼上她住了十六年的那间屋子，从那以后只放书。"

