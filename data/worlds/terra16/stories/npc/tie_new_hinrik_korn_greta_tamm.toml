key = "side"
title = "粮栈与账房"
text = "船主公会的大厅里，天花板上吊着一圈船模。格蕾塔把誊好的两份副账放在长桌上，一份留给公会，一份带回自己的账房：“往后每条船出港以前，水手名册和工钱各留一份存底。纸墨钱我算过，每条船二十个芬尼。”老会长咳了一声，转向欣里克：“科恩，你不是要当船长的吗？怎么站在账房丫头后头？”“晕船。”欣里克答得干脆，“海上的数我不管了，岸上的我管到底。二十个芬尼，还不够买半桶麦子。”会长看看他，看看她，把印盖了。回到街上，他进了粮栈的门，她进了对面账房的门。两边的窗先后亮起灯，她推开窗喊：“你今天的数，我今晚来对！”“你的，我明早去对！”他喊回去。"
stage = "witness"
window = [[1567, 4, 1], [1567, 8, 31]]
at = "lubeck"
