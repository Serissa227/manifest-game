# 靠近：1563 年夏，补给船试航。他说海风冷，她塞了姜片，在名册上添了一行。
[[tracks.chapters]]
key = "tie_new_hinrik_korn_greta_tamm_closer"
title = "补给船"
text = "这阵子，打仗的风声一天紧似一天：丹麦人要和瑞典人动手，吕贝克出船，也出粮。粮栈招补给船的书记，欣里克头一个举手，嘴上说的是三年大副、五年船长。试航那天，船顺河下到特拉沃明德，在外头的海面上转一圈就回。他从跳板上下来，脸白得像一页纸，袖子抹了抹嘴：“海风冷。”正午的太阳晒着码头，扛包的人光着膀子。格蕾塔抬头看看天，什么也没问，往他口袋里塞了一小包用旧货单折的纸：“姜片，含着，别嚼。”随后她在发饷桌上翻开水手名册，在他的名字底下添了一行字：“家属：账房塔姆。”那一栏他交上来时是空着的。欣里克隔着桌子倒着读了两遍，没说话，把姜片含进嘴里，辣得眼眶发红。"
stage = "witness"
window = [[1563, 6, 1], [1563, 9, 30]]
at = "lubeck"
cast = ["hinrik_korn", "greta_tamm"]
speaker = "hinrik_korn"
mood = "tender"
news = "吕贝克给舰队送粮的补给船在招人，粮栈的学徒头一个报了名，账房的女儿在码头上往他口袋里塞了一包姜片。"

