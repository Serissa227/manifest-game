# 落点（恋爱，缺省即圆满）：1567 年春，隔着一条街。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "tie_new_hinrik_korn_greta_tamm_landing"
title = "认了晕船"
text = "一个晴天的上午，粮栈门口滚着新到的黑麦桶。欣里克系着围裙站在门槛上，隔着一条街，账房二楼的窗开着。“塔姆！”他喊得像在念账，“我晕船。一上船就晕，次次吐在舱底，擦了嘴再上来。去年在维斯比被抬下船，我就该认。当不了船长！”窗口里的人没缩回去：“我知道。姜片是我塞的。”街上过了一辆运砖的车。他等车过去，穿过街，仰着脸站到窗下：“往后我管粮栈，船我不上了。桶可以空——”“数不能空。”格蕾塔替他说完，下楼来，在账房门口吻了他。"
