# 转折（传闻）：1566 年 7 月底哥得兰外海的风暴。他前一天被放上岸，回来了；很多人没回来。
[[tracks.chapters]]
key = "tie_new_hinrik_korn_greta_tamm_turning"
title = "哥得兰外海的风暴"
text = "七月底，丹麦人和吕贝克的舰队停在维斯比外海，一夜风暴，十几条船没了，淹死的人没人数得清。消息搭着渔船一天天往回传，栈桥上站满了等人的女人，一级级站进水里。账房塔姆家的闺女每天傍晚来，不哭，提一罐热汤，挨个递过去。听说粮栈那个学徒没在船上：出事前一天，他被放上了维斯比的岸，船医说是吃坏了东西，他自己说是天冷。后来他搭渔船回来，一上栈桥，女人们齐刷刷转过头。“几个？”塔姆家的闺女问。“我们那条船四十三个人，”他说，“就剩我一个。数不对。”她把汤罐塞进他手里：“趁热。”"
