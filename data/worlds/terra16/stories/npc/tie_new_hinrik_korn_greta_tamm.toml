# 抉择：1566 冬—1567 初，塔姆家账房的前厅。船东说册子沉了，寡妇们没有凭据；格蕾塔摆出副账。
[[tracks.chapters]]
key = "tie_new_hinrik_korn_greta_tamm_choice"
title = "沉了的账簿"
text = "雨夹雪下到第三天，塔姆家账房的前厅挤满了淹死水手的寡妇，湿披肩在地板上滴出一圈水。我来取提单，被挤在柜台边。船东靠着墙，两手一摊：发饷的册子跟船一起沉了，没有凭据，一个芬尼也付不了。抱孩子的女人问：“我男人哪天上的船？”没人答得出。格蕾塔蹲下去，从柜子最底层抽出一本副账，封皮磨毛了，页边沾着粉笔灰：谁哪天上船、每月几马克，一个芬尼不差。她把账推到船东面前，手在抖：“把小数目也算上。”欣里克不知何时站到了她身后：“桶可以空，数不能空。”船东盯着账看了很久，咬牙认下一半，剩下的不松口。欣里克说粮栈柜里的余钱先垫着，东家那边他去说。满屋的脸转向我。"
