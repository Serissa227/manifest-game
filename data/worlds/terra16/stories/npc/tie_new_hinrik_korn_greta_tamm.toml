# 相识：1558 年夏秋，特拉韦河边的粮栈。差半桶，桶里压着沙。
[[tracks.chapters]]
key = "tie_new_hinrik_korn_greta_tamm_meeting"
title = "空桶与满桶"
text = "特拉韦河边的粮栈卸一船但泽来的麦子。欣里克蹲在桶堆当中，指节在桶板上一只只敲过去，嘴里报数：“满。满。空，勾掉。”格蕾塔抱着货单站在跳板头，一行行对，对到末行笔停了：“差半桶。”“半桶？”他头也没抬，“路上洒的，塔姆。”“把小数目也算上。从头再敲。”他叹口气，从头再敲。敲到第三十几只，指节停住了：上半截发闷，往下，声音忽然硬得像敲在石板上。桶一倒，半桶麦子底下压着半桶沙。“桶可以空，数不能空，”欣里克盯着那堆沙，“这只桶连空都不是，它撒谎。”格蕾塔拍了一下手，在货单边上记：沙，半桶。他慢半拍才笑出来，笑完把沙一捧捧装回桶里，扣上盖：“留着，对质要用。”当天下午，卖麦的那家进了粮栈的黑账。"
stage = "witness"
window = [[1558, 5, 1], [1558, 9, 30]]
at = "lubeck"
cast = ["hinrik_korn", "greta_tamm"]
speaker = "greta_tamm"
mood = "cheerful"
news = "吕贝克的粮栈对出半桶掺沙的麦子，是一个敲桶的学徒和账房的女儿一起对出来的。"

