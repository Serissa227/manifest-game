[[tracks.chapters]]
key = "pair_hans_brock_solveig_meeting"
title = "念错的地名"
text = "“把帽子摘了，这是汉萨的船。”汉斯拎着一条干鱼，一脚迈进草皮屋。索尔维格坐在炉边，眼皮都没抬：“这是我的屋，你的船还在码头上漂着。”她用指头掂了掂那条鱼，“鱼也嫌小。坐近点，我嗓子不如从前了……先说你拿什么换。”鱼换成了两条。她讲到西边那块石板铺的地，汉斯一拍大腿：“赫尔兰！我们那儿的话，赫尔就是亮，亮堂堂的地！”“赫卢兰。石板的地，一点也不亮。”三遍都是这样。老头搬出他的船龄：“我跑了四十年船——”“你在那儿住过吗？”汉斯张着嘴愣了半天，忽然笑出声，第四遍念得一字不差，顺手把帽子摘下来，扣在膝盖上。"
stage = "witness"
window = [[1562, 6, 15], [1562, 8, 31]]
mood = "cheerful"
news = "哈夫纳夫约杜尔草皮屋里，说书老太太把吕贝克来的老船长纠正了三回地名，第四回他念对了，笑着把帽子摘了。"
at = "hafnarfjordur"
speaker = "solveig"

