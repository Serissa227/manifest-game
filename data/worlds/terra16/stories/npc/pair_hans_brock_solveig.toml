[[tracks.chapters]]
key = "pair_hans_brock_solveig_closer"
title = "最后一桶面粉"
text = "北边的仗眼看要打起来，汉斯说今年的船怕是最后一趟。他让人把舱里剩下的最后一桶面粉抬进草皮屋，往地上一墩：“格陵兰那段萨迦的结尾，换这个。”索尔维格掀开桶盖看了看，盖回去，开口就讲：船驶出峡湾，雾从海面升起来，桅杆一根一根被雾吞掉——她停了。“结尾下回再讲。”“你收了面粉！”汉斯拍着桌子，“这是赖账！”“那你下回就得来。”老头瞪着她，半天没接上话。他端起酒杯，举到半空，没敲桌子，又轻轻放下了。"
stage = "witness"
window = [[1563, 6, 15], [1563, 8, 31]]
mood = "tender"
news = "吕贝克的老船长用舱里最后一桶面粉换一段萨迦，说书老太太只讲了一半，说结尾要等他下回来。"
at = "hafnarfjordur"
speaker = "hans_brock"

