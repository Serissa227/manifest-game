[[tracks.chapters]]
key = "pair_hans_brock_solveig_choice"
title = "膝盖也有一票"
text = "汉斯真来了，说是顶了三天的逆风，进门先问有没有热酒。草皮屋里摊着一张海图，西边用炭条圈了一圈。“老人们讲，格陵兰那条船是在雾里不见的。”索尔维格敲敲炭圈，“我们去看看雾里有什么。不过，”她转向汉斯，“走到一半不行了，回得来吗？”汉斯先嫌她扫兴。他低头揉了揉膝盖——阴天它就疼，今天正是阴天——嘟囔一句：“膝盖也有一票，它说圈大点，离冰远些好掉头。”然后拿起炭条，在那个圈外头又描了一圈大得多的：“到了这道线，随时掉头。”索尔维格的嗓子在海风里撑不了几天。两个老人一起转过头，看着我。"
stage = "involve"
window = [[1571, 6, 15], [1571, 8, 15]]
mood = "cheerful"
news = "哈夫纳夫约杜尔两个快八十岁的老人要往西去看格陵兰，码头上的人都在打赌他们几天回来。"
at = "hafnarfjordur"
speaker = "solveig"

[tracks.chapters.default]
