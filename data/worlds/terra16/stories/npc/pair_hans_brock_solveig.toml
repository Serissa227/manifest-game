[[tracks.chapters]]
key = "pair_hans_brock_solveig_turning"
title = "斯德丁以后"
text = "斯德丁的和约签了，波罗的海上打了七年的仗总算收场。吕贝克码头这几天议论得最多的是船台上那条老船，和约倒排在后头：七十八岁的汉斯·布罗克又在刮船底，桅顶汉萨的旗换了一根新绳。“老头，你这岁数还出海？”有人问。“去冰岛。”他头也不抬，“听一个故事的结尾。”赌他开春走不走的，码头上已经凑了一桌。"
stage = "rumor"
window = [[1570, 12, 15], [1571, 2, 28]]
mood = "cheerful"
news = "斯德丁和约签了，吕贝克码头上那个快八十岁的老船长又在刮船底，说开春要去冰岛听一个故事的结尾，码头上已有人开赌。"
at = "lubeck"

[tracks.chapters.default]
