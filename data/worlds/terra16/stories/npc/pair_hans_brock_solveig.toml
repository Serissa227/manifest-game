# C7 故事线（重写）：汉斯·布罗克 × 索尔维格《再往西看一眼》
# 标签：BG（异性）；两位都是原创人物，晚年的爱，写得朴素、好笑。
# 人物：汉斯·布罗克（m，1492-07-04，吕贝克老船长，汉萨旗）；索尔维格（f，1493-08-09，冰岛哈夫纳夫约杜尔的说书人）。生年差 1 年，全程都是成年人。
# 依据：
#   史实——16 世纪汉萨（德意志）商人在冰岛哈夫纳夫约杜尔一带收鱼、卖面粉；1563—1570 北方七年战争（吕贝克与丹麦一边对瑞典）；1570-12-13 斯德丁和约。
#   原创——汉斯与索尔维格这两个人、他们的交情与西行；文兰的萨迦只取“石板地（赫卢兰）”这一个地名。
#   格陵兰的诺斯定居者“去了哪里”只作萨迦里的谜：本线不写找到他们，也不写找到房子，只写冰和鸟。
#   待核：16 世纪后期汉萨商人在哈夫纳夫约杜尔的具体货物；赫卢兰（Helluland）的德语“hell = 亮”只是汉斯的误会，不作考据。
# 缺省走向：不论有没有人插手，1563 夏两人心照不宣（crush）；1570 年和约后汉斯修船去冰岛；1571 夏两个老人往西看了一眼，回来后成为伴侣，汉斯留在冰岛（圆满）。玩家的帮助只改变路上的样子。没有坏结局。
# 读写的共享旗标：
#   写 c7_pair_hans_brock_solveig_helped（choice 选“借船与补给”）、c7_pair_hans_brock_solveig_matched（choice 选“画折返线”）、c7_pair_hans_brock_solveig_together（landing 缺省）。
#   不读外部旗标；landing 的两个 variants 读上面的 helped / matched。
# 日程变更：
#   汉斯的静态日程在 lubeck；landing 缺省用 schedule 效果把他留在 hafnarfjordur（dock），自落点日起，不设止期。
# 整合须知：
#   cast/ties.toml 的 hans_brock_solveig 目前写“partners，since 1570-12-31”，早于本线落点；整合时应改到 1571-10-31 之后（或改成 friends / crush 到那天），否则静态关系会在 choice 之前就先于故事生效。
# 口头禅各用一次：汉斯“把帽子摘了，这是汉萨的船。”（meeting）；索尔维格“坐近点，我嗓子不如从前了……先说你拿什么换。”（meeting）、“故事比账本诚实。”（landing）。

