[[tracks.chapters.choices]]
key = "watch"
text = "不插手，只在码头送他们出海"
reply = "我站在码头上。汉斯掌舵，索尔维格坐船头，船开得比走路还慢，帆都没敢全升。身后有人喊：“三天就回来！”赌注是一条干鱼，案板上已经摆了一排。我没押，只看着那条船拐过防波堤，帆慢慢小了。"
next = "pair_hans_brock_solveig_together"
