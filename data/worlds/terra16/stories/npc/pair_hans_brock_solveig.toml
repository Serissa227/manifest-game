[[tracks.chapters.choices]]
key = "supplies"
text = "借给他们一条结实的小船，再备足够过冬的补给"
reply = "我把船上一条结实的小艇拨给他们，又搬上最厚的毯子和两桶腌肉。汉斯清点了三遍，哼了一声：“汉萨的人不欠人情。”索尔维格说那就拿故事抵，蹲在跳板上当场讲了一段。讲完，汉斯抱起那床最厚的毯子，先送到了她的铺位上。"
next = "pair_hans_brock_solveig_together"
