[[tracks.chapters.choices]]
key = "turnback"
text = "陪他们在海图上画好折返的线：见了冰就回"
reply = "我们在海图上拉了一道线。汉斯盯着它看了半天：“这是我这辈子画过的最没出息的线。”说完拿炭条在线边添了一笔，又往回挪了一指宽。索尔维格没接话，把海图卷起来，用自己的围巾捆好，收进了怀里。"
