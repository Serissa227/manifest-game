[[tracks.chapters]]
key = "pair_hans_brock_solveig_together"
title = "只看见冰和鸟"
text = "他们回来了。冰一路排到天边，冰上落满海鸟，叫得人耳鸣；没有炊烟，没有房顶，没有人。索尔维格在船上一句话没说，站在船头，手攥着栏杆，看着那片冰，直到它看不见。上了岸，她把汉斯按在炉边，讲出了格陵兰的结尾。和她讲过的每一回都不一样：雾里那条船上，多了一个吕贝克来的老船长，嘴里骂骂咧咧，膝盖疼。“你又在编。”汉斯说。“故事比账本诚实。”第二天，汉斯把桅顶那面汉萨的旗取下来，钉在她的门框上堵风。他的箱子已经搬进了屋里，没人再提吕贝克的船期。"
stage = "witness"
window = [[1571, 9, 1], [1571, 10, 31]]
mood = "tender"
news = "哈夫纳夫约杜尔那两个老人往西看了一眼回来了，只看见冰和鸟；吕贝克的老船长这回没走，把汉萨的旗钉在了老太太的门框上。"
at = "hafnarfjordur"
speaker = "hans_brock"

