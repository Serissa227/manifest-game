text = "娜拉要去阿尔及尔演奏，骡队在东门外等着。伊德里斯没有交出批注本。他抄了一整个冬天，抄出一本副本，装订的线还是新的，扉页上用尺子划了一条竖线，左边写“字”，右边写“歌”。“唱到哪座城，就在页边改到哪座城。”他把副本塞进她的鞍囊，“改完托商队捎回来，我抄进正本。”娜拉看了看那条线：“你这边比我这边挤。”“批注就是挤的。”她翻身上鞍，把乌德琴往背后一甩：“那我这边就多写点。下回捎回去的，你抄进正本，口音一个点也别动。”他追着骡子走了几步：“一个点也不动！”"
