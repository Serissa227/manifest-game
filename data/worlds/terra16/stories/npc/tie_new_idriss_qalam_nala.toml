title = "批注本跟着她走"
text = "东门外，去阿尔及尔的骡队等着出城，娜拉的乌德琴已经捆在鞍上。伊德里斯把批注本塞进她怀里：“往后你唱到哪里，就在哪里改。”她翻开。每一页的边上都是他的字，小得要凑近了才看得清。翻到“山坡”那一页，抄错的那个词旁边多了一行：“以乐师所唱为准。”“这一本，你舍得？”“哪一页我都记得。”娜拉踮起脚吻了他。骡夫在后头咳嗽。伊德里斯伸手往怀里摸书，摸了个空；娜拉在鞍上笑出声：“这一遍你说，别又翻书混过去。”他空着手站了一会儿：“你回来那天，我在东门等。”此后隔几个月，东门外就有一头骡子驮着乌德琴进城，那本书每回都比出城时厚一点。"
