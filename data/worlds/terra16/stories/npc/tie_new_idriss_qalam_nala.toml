# 相识：1559 年春夏，娜拉家的院子。她唱一遍，他唱回去；他在“家”字上点错了一个点。
[[tracks.chapters]]
key = "tie_new_idriss_qalam_nala_meeting"
title = "抄错的一句"
text = "伊德里斯抱着批注本坐在娜拉家院子里的橙子树下，请她把老人们传下来的乡曲一支一支唱给他抄。娜拉有条规矩：她唱一遍，他得原样唱回来，一个字不许改，口音也不许。唱到第三支，他开始往别处躲，清清嗓子：“从前有个抄书匠，把‘苏丹的骆驼’抄成了——”娜拉把乌德琴往膝上一放：“抄书匠的笑话留到唱完再讲。这一遍，你唱。”他红着脸唱了。调子跑出去三条街，巷口驮水的驴都回头看他。娜拉笑得拨错了弦，笑完还是一个音一个音地纠。最后一句是“山坡上有个家，门朝着海”，他听一句抄一句，笔尖一抖，“家”字中间的点跑到了线的另一边，纸上成了“姑娘”。他吹干墨：“下一支。”那一年，批注本里添了二十支曲。"
stage = "witness"
window = [[1559, 3, 1], [1559, 7, 31]]
at = "fez"
cast = ["idriss_qalam", "nala"]
speaker = "nala"
mood = "cheerful"
news = "非斯安达卢斯区的院子里，抄书匠家的学生请乐师的女儿唱乡曲，自己照着唱回去那一遍，惹得巷口驮水的驴都回了头。"

