# 转折（传闻）：1576 年春，新苏丹带着奥斯曼的兵进了非斯，宫里要找乐师。
[[tracks.chapters]]
key = "tie_new_idriss_qalam_nala_turning"
title = "新苏丹进城"
text = "开春，新苏丹带着奥斯曼的兵，从阿尔及尔那边进了非斯。卖橄榄的说，这位在伊斯坦布尔长大，别的不稀罕，就爱听曲子。裁缝说宫里的乐班缺人，书记们满城抄曲词，抄不全的，就往民间找。茶摊上有人朝河那边努努嘴：“找曲子？去安达卢斯区，那儿的老人肚子里装着半个格拉纳达。”没过几天，宫里的人真的挨门问到了那条巷子：哪家的姑娘，乌德琴弹得最好？巷子里后来都传，抄书铺的少东家听到风声，跑掉了一只鞋，赶去娜拉家问：“你去不去？”娜拉头也没抬，还在拧弦：“先问他们要听哪一支。”"
stage = "rumor"
window = [[1576, 3, 1], [1576, 5, 31]]
at = "fez"
cast = ["idriss_qalam", "nala"]
mood = "tense"
news = "阿卜杜·马利克带着奥斯曼的兵从阿尔及尔进了非斯，听说新苏丹爱听曲，宫里的人已经在安达卢斯区挨门打听乐师。"

