# 抉择：1576 年夏秋，娜拉家的院子。书记拿来的曲词抄自他的批注本，错字原样在上面。
[[tracks.chapters]]
key = "tie_new_idriss_qalam_nala_choice"
title = "第四十一页"
text = "我替娜拉捎来一包琴弦，赶上宫里的书记也到了。他在石桌上摊开一张方方正正的纸，是上殿要唱的曲词：“苏丹要听这一支，一个字不许动。词是从抄书匠家的批注本誊的，错不了。”娜拉的指尖停在最后一行：“我母亲不是这么唱的。她唱‘家’，不是‘姑娘’。”伊德里斯是被叫来对本子的，脸一下白了，手已经在翻书：“从哪一页誊的……”“四十一。”书记说。翻到了。那是他自己的字，他自己点的点。他往前翻，往后翻，想找一份比它早的抄本。没有。“格拉纳达的人带过海的册子，早散在阿尔及尔的旧书摊上了，”他喃喃地说，“谁去翻？又是一条没有出处的。”书记把纸一按：“苏丹设宴的日子还没定。定了我来接人，照纸唱。”"
stage = "involve"
window = [[1576, 6, 1], [1576, 10, 31]]
at = "fez"
cast = ["idriss_qalam", "nala"]
