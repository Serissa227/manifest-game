# 靠近：1563 年，抄书铺后间，夜里。她找一支老曲的出处，他说出找了十年的那条引文。
[[tracks.chapters]]
key = "tie_new_idriss_qalam_nala_closer"
title = "哪一页都没有"
text = "宵礼过后，娜拉背着琴敲开抄书铺的后门。她要找一支老曲的出处：婚宴上有人问这是谁写的，她答不上来。伊德里斯翻开批注本，一页一页翻，翻到耳根发红：“出处呢？哪一页，第几行？”“哪一页都没有，”娜拉坐下调弦，“在我娘嘴里。”她唱，他记。她纠一个字，他就划掉重写；她说“这里要拖长，像船过海”，他就在字旁拉一条长线。帘子后头他父亲的鼾声起了又歇，灯油添了两回。后半夜，他忽然搁下笔：“我这本书里有一条引文，找了十年，没找到原本。旁边我一个字也没注出处。这事我没跟别人说过。”娜拉把琴放平：“那就接着找。我唱的，你也接着记。”他蘸了墨，她起了下一句。"
stage = "witness"
window = [[1563, 3, 1], [1563, 7, 31]]
at = "fez"
cast = ["idriss_qalam", "nala"]
speaker = "idriss_qalam"
mood = "tender"
night = true
news = "非斯安达卢斯区有家抄书铺的灯，昨夜亮到后半夜：铺子的少东家和乐师的女儿，一个唱一句，一个记一句，对了大半宿。"

