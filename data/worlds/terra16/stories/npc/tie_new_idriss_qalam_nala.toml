# 抄错的一句（tie_new_idriss_qalam_nala）——配角线，标签 BG；新线，恋爱线（异性）。
# 人物：伊德里斯·卡拉姆（idriss_qalam，1540-05-22 生），非斯抄书匠家的儿子，学院同学，批注写得比正文还密；
#       娜拉（nala，1540-06-07 生），安达卢斯区乐师的女儿，学院同学，弹乌德琴，后来往返非斯与阿尔及尔演奏。
#       全线都在成年以后：1559 年相识（friends，两人 18—19 岁）；1563 年知己（confidants）；
#       1577 年恋人（lovers，窗口起日两人都 36 岁；最早可用日 1558-06-07）。落点以前不写告白，两种结局都接得上。
# 依据（史实）：1576 年 3 月阿卜杜·马利克借奥斯曼兵力进入非斯，他早年长期在阿尔及尔与伊斯坦布尔一带，传说爱听曲子（正文只用街谈巷议的口吻）；
#       安达卢斯区是格拉纳达陷落后渡海来的流亡者聚居处；阿拉伯文里点的位置一偏就是另一个词（bayt“屋子”与 bint“姑娘”），正文不写原文，只写“家”变成“姑娘”。
# 原创：两人、那本批注本、“家”被点成“姑娘”的那一笔、宫里的书记、阿尔及尔港边的旧书摊与那册格拉纳达来的旧抄本、扉页上的那条竖线。
# 待核：新苏丹 1576 年夏秋是否设宴听乐（正文不写日期，只说“日子没定”）；阿卜杜·马利克“在伊斯坦布尔长大”的说法（正文用传闻口吻）。
# 缺省走向：相识（他唱回去，抄错一个点）→ 半夜对曲（他说出找了十年的那条引文）→ 新苏丹进城（传闻：宫里找乐师）
#       → 书记拿来抄着错字的曲词（无人插手：娜拉照母亲的唱，伊德里斯当着书记在页边改正）
#       → 1577 年娜拉去阿尔及尔演奏，批注本跟着她走，两人成为恋人（远距相守，圆满）。
#   帮助：去阿尔及尔的旧书摊找最早的抄本（_helped）→ 落点变体：书里夹着那份旧抄本，那个字用红墨圈着。
#   旁观：陪娜拉上殿（_stood）→ 落点变体：封皮上有他在宫廊下攥出来的汗印。
# 并肩：主角在 bond_idriss_qalam 或 bond_nala 的 S 章立了约（promise / heart 设 c7_tie_new_idriss_qalam_nala_taken），
#       主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_idriss_qalam_nala_side 写他抄一本副本给她，一半是字、一半是歌。
# 共享旗标：读 c7_tie_new_idriss_qalam_nala_taken；写 c7_tie_new_idriss_qalam_nala_together、_side、_helped、_stood。
# 日程（整合方改 cast）：无。娜拉往返阿尔及尔只在台词和正文里，cast 日程（1557 起常驻 fez_city）不动。
#       cast/ties.toml 新增 idriss_qalam × nala（BG，story 指向本轨道，since 对齐落点窗口 1577-03-01）。
# 秘密：伊德里斯没找到原本的那条引文（closer 里他自己对娜拉说出口，choice 里他慌乱中失口一句“又是一条没有出处的”，只有娜拉听得懂；不进见闻）；娜拉赎旧琴的事归她的羁绊线，本线不写。

