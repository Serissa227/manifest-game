# 转折（传闻）：1567 年诏书。通事烧了一夜的纸，只留下一张。
[[tracks.chapters]]
key = "pair_diego_lorenzo_turning"
title = "被禁的字"
text = "马拉加港边的人都在传：新年头一天，格拉纳达把诏书念出来了。摩里斯科人不许再说阿拉伯话，不许穿旧式的衣裳，违令的要罚。港边一连几个晚上有烟味。有人说，格拉纳达有个替人写状子的通事，夜里蹲在院子里烧纸，烧的全是自己的阿拉伯文练习纸，一张一张拆开烧，烧到天亮，只剩下一张，折了几折塞进怀里。隔壁老太婆隔着墙问他烧什么，他说废纸。后来有人瞥见过那张留下来的，上头写的是一个西班牙人的名字。"
stage = "rumor"
window = [[1567, 1, 15], [1567, 4, 30]]
at = "malaga"
cast = ["diego", "lorenzo"]
mood = "tense"
news = "禁说阿拉伯话的诏书从格拉纳达传到了马拉加，港边摩里斯科人家夜里都在烧旧书旧衣，烟味飘了半条街。"

[tracks.chapters.default]
next = "pair_diego_lorenzo_choice"
