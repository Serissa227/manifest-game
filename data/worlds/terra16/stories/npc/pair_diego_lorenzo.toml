# 尾声（传闻）：1570 年哈瓦那要塞，远距相守；见闻不写纸片藏在哪里。
[[tracks.chapters]]
key = "pair_diego_lorenzo_epilogue"
title = "钱袋里的阿拉伯字"
text = "哈瓦那要塞的兵都在传，他们那个从不笑的军官从西班牙回来了。回来以后话更少，钱袋最里层夹着一张写着外国字的旧纸片，谁的手伸过去，他就跟谁急。上回一个新兵想看看是不是情书，被他按在了墙上。又有人说，格拉纳达那边每年都有一封信寄到要塞，写信的人字写得极好，学谁的口吻都像。有一年的信，念出来活脱脱是总督大人，军官看了半天，一个人在炮台上笑出了声。"
