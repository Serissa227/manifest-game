# 相识：1554 年春，塞维利亚侯爵府的侍童房。剑架后头的阿拉伯文书，别滴蜡在我的护手上，轮流守门。
[[tracks.chapters]]
key = "pair_diego_lorenzo_meeting"
title = "剑架后的书"
text = "半夜，迭戈摸到剑架后头，要取自己藏的那把练习剑，摸到的却是一本书。书页上的字从右往左爬，他一个也不认得。一截蜡烛头亮起来，洛伦索扑过来抢：“是替管家抄的谚语。”他笑得很甜，指节却白了。“谚语用得着藏在剑架后头？”迭戈没松手，就着烛光看了两眼，把书拍回他怀里。洛伦索盯着他的脸，等他喊人。“看什么看？练你的去。”迭戈把自己的油灯推过去，蹲下摸出剑，“蜡别滴在我的护手上。”从那晚起，两人轮流守门：一个练剑，一个读书，听见脚步就咳一声。"
stage = "witness"
window = [[1554, 2, 1], [1554, 4, 30]]
at = "seville"
cast = ["diego", "lorenzo"]
speaker = "diego"
mood = "tense"
news = "塞维利亚塔里法侯爵府的侍童房里，听说剑术最好的那个和嘴最甜的那个半夜都不睡，管家查了几回没查出什么。"

[tracks.chapters.default]
