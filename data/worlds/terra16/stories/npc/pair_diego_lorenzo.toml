# 恋人：1558 年夏，特里亚纳码头。迭戈去西印度的前一晚，两人都满十八。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "pair_diego_lorenzo_together"
title = "特里亚纳码头"
text = "迭戈去西印度的任命下来了，船队明早就开。最后一晚，两人坐在特里亚纳的码头边，脚下是黑沉沉的瓜达尔基维尔河。迭戈憋了半天：“别让我在海那边听说你出了事。”洛伦索笑着岔开：“我这样的人，能出什么事？”迭戈不接话，只盯着河面。洛伦索收了笑，从怀里摸出一张小纸片，上面用阿拉伯字写着迭戈的名字。“写了三十遍才写对。”他说，“被人搜出来是要命的，所以你也别叫人搜着。”迭戈把纸片塞进钱袋最里层，扣紧。河对岸的钟敲了十一下，洛伦索先凑过来，这一回没学谁的口音。"
stage = "witness"
window = [[1558, 5, 1], [1558, 7, 31]]
at = "seville"
cast = ["diego", "lorenzo"]
speaker = "diego"
mood = "tender"
when = [{ kind = "flag", flag = "c7_pair_diego_lorenzo_taken", value = false }]
news = "去西印度的船队开走前一晚，塞维利亚特里亚纳码头上有两个侯爵府出来的年轻人坐到了天亮。"

