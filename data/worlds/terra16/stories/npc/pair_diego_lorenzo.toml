# 抉择：1569 年，阿尔普哈拉斯的山路。洛伦索带人家下山，迭戈穿着另一边的军服；缺省两人在泉边相遇，剑都在鞘里。
[[tracks.chapters]]
key = "pair_diego_lorenzo_choice"
title = "两边的路"
text = "阿尔普哈拉斯的山里打起来了。一天之内，两个人先后找到我。上午是洛伦索，他替山里的摩里斯科人家当通事，图上从山口画到马拉加海边，只在有水的地方画了圈：“老人和孩子走不了夜路，圈里的井是他们的命。”傍晚是迭戈，随舰队回了国，调去格拉纳达，披着驻军的外套。他也摊开一张图，也只圈了有水的地方，圈得和洛伦索的一模一样。“巡逻队要饮马。”他的指头压在最后一口井上，“后天，我的人到这儿。”"
stage = "involve"
window = [[1569, 2, 1], [1569, 4, 30]]
at = "malaga"
cast = ["diego", "lorenzo"]
speaker = "lorenzo"
mood = "tense"
news = "马拉加港口这阵子到处是从山里下来的人家，都说山路上有个通事在领路。"

[tracks.chapters.default]
