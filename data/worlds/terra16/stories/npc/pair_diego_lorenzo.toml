# 山路认得人（pair_diego_lorenzo）——配角线，标签 BL；同学线，恋爱线（纯 BL 两人）。
# 人物：迭戈（diego，1540-02-22 生），塔里法侯爵府的侍童，侍童里剑术第一，家里穷得只剩一个姓；1559 年起在哈瓦那当军官。
#       洛伦索（lorenzo，1540-04-01 生），同府的摩里斯科侍童，听一句话就猜得出人打哪儿来；1567 年起在格拉纳达当通事。
#       学院期（1554—1556）只写到心照不宣；两人 1558-04-01 起都满 18 岁，恋人效果只在 1558 年的 together 章（窗口 1558-05-01—07-31），
#       最早可用日 1558-04-01（窗口起日两人都 18 岁，且不早于 1557-01-01）。其余章不写 relation 升级，最多 friends。
# 依据（史实）：1567 年 1 月 1 日在格拉纳达公布的国事诏书（禁摩里斯科人说阿拉伯语、穿旧式衣裳）；
#       1568 年圣诞夜起的阿尔普哈拉斯起义（1568—1571）；塞维利亚特里亚纳隔瓜达尔基维尔河与老城相望，是去西印度的船队装货启航的地方。
# 原创：两人的故事、剑架后的书、补袜子、写着迭戈名字的小纸片、两张只在水源处画圈的图。
# 待核：迭戈“随舰队回国、调去格拉纳达”（1568—1569）只在一句话里带过，不细写；塞维利亚船队装货的码头具体在河哪一岸，正文只称“特里亚纳码头”。
# 缺省走向：meeting（互相替对方守门，设 friends）→ closer（学院期，到心照不宣为止）
#       → together（1558 年成为恋人，迭戈去西印度；主角若与两人之一立过 S 约定、c7_pair_diego_lorenzo_taken=true，此章 when 不满足、整条轨道静默结束，改走 _side）
#       → turning（1567 年诏书，传闻）→ choice（1569 年阿尔普哈拉斯，缺省：两人在泉边相遇，剑都在鞘里）→ epilogue（1570 年哈瓦那，远距相守）。
#   帮助（route / berths）：设 c7_pair_diego_lorenzo_helped，各给一条回忆；旁观（watch）只加一点好感。三者都走向 epilogue，关系不变（仍是恋人）。
# 并肩：taken=true 时第二条轨道 pair_diego_lorenzo_side 一章 witness，写 1558 年码头送行，设 friends 与 c7_pair_diego_lorenzo_side；不写嫉妒、不提主角。
# 共享旗标：读 c7_pair_diego_lorenzo_taken（bond_diego、bond_lorenzo 的 S 章设）；写 c7_pair_diego_lorenzo_together、_helped、_side。
# 日程（整合方改 cast，可选）：迭戈的日程 1559 年起写 havana；正文 1568—1569 年他在格拉纳达驻军，可把 1568-06-01—1569-12-31 的 at 改为 malaga（venue 任选）。
#       洛伦索 1567 年起 granada_city（无地点 key），场面一律用 malaga。章节的 at 决定玩家要在哪里，日程不改也能跑通。
# 秘密：迭戈夜里补袜子、洛伦索夜里读母亲留下的阿拉伯文，都只出现在正文里，不进见闻；见闻也不写藏东西的地方。

