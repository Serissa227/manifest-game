# 靠近：1556 年春，学院期。补袜子，学裁缝，针线包；到心照不宣为止，不写 relation。
[[tracks.chapters]]
key = "pair_diego_lorenzo_closer"
title = "夜里补袜子的人"
text = "洛伦索半夜醒来，窗下坐着迭戈，借月光补袜子，针脚歪得像虫爬。迭戈一把将袜子塞到背后。洛伦索翻个身，装睡。第二天一早，管家来查侍童的袜子。洛伦索第一个站出来，学侯爷的裁缝，拖着长腔量管家的小腿：“这位大人的腿肚，还欠一寸缎子——”满屋子笑翻了，管家红着脸摔门走了，再没人提查袜子。晚上，一个针线包落在迭戈床上。“让我猜猜，你是打哪儿来的？”洛伦索靠着门框，“这种结，补渔网的。塔里法。”“……我姑母教的。”迭戈的耳朵根红了，“闭嘴。”那盏灯没熄。迭戈穿针，洛伦索端灯，难得一个字也没评。"
stage = "witness"
window = [[1556, 3, 1], [1556, 5, 31]]
at = "seville"
cast = ["diego", "lorenzo"]
speaker = "lorenzo"
mood = "cheerful"
news = "塞维利亚塔里法侯爵府里那个会学口音的侍童，当着管家的面学了回侯爷的裁缝，满屋子笑翻，管家红着脸摔门走了。"

