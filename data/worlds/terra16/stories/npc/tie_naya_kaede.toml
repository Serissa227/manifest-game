# 转折：1581 年秋，天正伊贺之乱（传闻）。
[[tracks.chapters]]
key = "tie_naya_kaede_turning"
title = "回不去的山"
text = "伊贺的事是卖柴的从山那边带下来的：织田的大军分几路进山，烧了一个多月，寺和村子都没剩下。堺的茶屋里没人接这个话头。倒是住在纳屋家对门的挑水汉说，有一夜他起来了好几回，回回看见那家的护卫抱着行囊坐在门槛上，没挪过窝。屋里的人端热水出来，前后换了三回，每回只说一句：“水凉了。”天快亮时，护卫开了口：“我要是再也当不了护卫，还能坐在这儿吗？”屋里那位没答，又点了一碗，放在门槛上。"
stage = "rumor"
window = [[1581, 10, 1], [1581, 11, 30]]
at = "sakai"
cast = ["naya_sayo", "momochi_kaede"]
mood = "sad"
news = "伊贺那边的山烧了一个多月，堺的茶屋里没人敢提；只听说纳屋家的护卫抱着行囊，在门槛上坐了一整夜。"
rumor_days = 60

[tracks.chapters.default]
next = "tie_naya_kaede_choice"
