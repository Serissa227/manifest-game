[[tracks.chapters.choices]]
key = "inform_oda"
text = "把伊贺余众的去向报给织田的人，只换枫一个人平安。"
reply = "我把在船上听来的几个地名写给了奉行所。过了几天，织田的人从纪伊的山里押回一串伊贺人，枫的名字从册子上划掉了。她平安了。半个月后，她不知从谁嘴里听说了消息是怎么漏出去的。那天夜里纳屋家的门照旧闩着；第二天一早枫不见了，门闩拔下来横在门槛上，木头上多了一道新刻的刀痕。后来我再去纳屋家，小夜照样请我喝茶，那一碗苦得难以下咽。"
next = "tie_naya_kaede_landing"
