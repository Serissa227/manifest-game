# 落点（帮助：藏船或卖茶入）：1582 年秋，后巷的小茶室。
[[tracks.chapters]]
key = "tie_naya_kaede_landing_b"
title = "门向里面开"
text = "本能寺的消息传到堺，町里乱了一阵，又静了下来。小夜和枫在后巷赁了两间屋，开了一间小茶室，只坐得下四个客人。枫没去领护卫的工钱，月底两人各倒出半袋钱，凑在一起算作家用。木匠问门往哪边开。“往外，”枫说，“踢不开。”“往里，”小夜说，“客人推一下就进来了。”门最后是往里开的。头一晚打烊，枫照老习惯起身去插门闩，小夜按住她的手，自己去了：“这回你坐着，门有我。”枫没动，看着她把闩推到底，又推了一下。"
