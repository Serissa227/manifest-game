text = "替小夜把那只茶入卖给织田家的茶头，换枫的路费。"
reply = "织田家的茶头把茶入翻过来，看了三遍底，出的价够枫走到纪伊、再折回来。枫接过钱袋，看了小夜很久，才系进腰带最里面。小夜把空了的仕覆叠成四折，收进柜子最里头。后来那只茶入在别人家的茶会上露过面，小夜去看了一回，坐在末座，喝完那碗就走了，一个字也没说。"
next = "tie_naya_kaede_landing_b"
