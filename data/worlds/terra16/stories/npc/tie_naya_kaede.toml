# C7 配角线（重写）：第二只茶碗——纳屋小夜 × 百地枫。
# 标签：GL（恋爱）。纳屋小夜（1534-04-13，堺的茶家女儿，纯 GL）× 百地枫（1533-06-23，伊贺来的护卫，纯 GL）；生年相差不到一年。
# 依据·史实：1568 年织田信长入京后向堺索要两万贯矢钱，会合众一度主张挖壕抵抗，翌年屈服；1569—70 年名物狩，1570 年到堺“求购”名物；
#   1581 年秋天正伊贺之乱，织田军分几路入山；1582 年 6 月本能寺之变。正文里的“奉行所”泛指织田在堺的代官衙门。
# 依据·原创：两人；纳屋家的三件名物与小夜母亲留下的肩冲茶入；枫藏茶入、奉行所查伊贺人、门闩与两只粗碗。
#   不写真实名物被藏（九十九发茄子等另有去向）。待核：1581—82 年堺是否奉命搜查伊贺余众——正文只写挨家问话。
# 缺省走向：1568 相识（friends）→ 1570 名物狩那年成为恋人（lovers，与 cast/ties.toml naya_kaede 的 since 1570-12-31 对齐）
#   → 1581 伊贺陷落（传闻）→ 枫独自离开 → 1582 小夜在伊贺出事那天点两碗茶（遗憾，仍是恋人，设 c7_tie_naya_kaede_apart）。
#   帮助（藏进货舱 / 卖掉茶入）→ 1582 两人在堺后巷开小茶室（圆满，设 c7_tie_naya_kaede_together）；
#   告密 → 枫离开，门闩上留一道刀痕（遗憾，仍是恋人）。三条结局都保留恋人关系。
# 旗标：设 c7_tie_naya_kaede_helped / _sold / _betrayed / _apart / _together；只在本文件的 variants 里读 _sold 与 _betrayed；不读外部旗标。
# 日程：不改。枫的日程仍在堺；缺省路径下她“下落不明”只是故事里的说法。
# 秘密：枫的出身全线只写“伊贺来的护卫”，标题、选项、见闻里都不点破。

