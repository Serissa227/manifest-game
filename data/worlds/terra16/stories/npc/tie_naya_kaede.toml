# 抉择：1581 年冬至 1582 年春，奉行所查伊贺来的人。玩家在堺时可以插手。
[[tracks.chapters]]
key = "tie_naya_kaede_choice"
title = "卖哪一只"
text = "奉行所的人在町里挨家问话，问的都是伊贺来的人。枫的名字被人报了上去，是谁报的，没人肯说。小夜把我请进茶室，这回没有点茶。她面前摊着家里茶器的账，一页页往后翻，翻到最后一页停住。枫伸手按住账本：“你母亲那只不许卖。”“那你说卖哪一只。”小夜的声音还是很轻，“剩下这些加在一起，也买不起一个人出海的船位。”枫不说话，手也不挪开。两个人都转过来看我。"
stage = "involve"
window = [[1581, 12, 1], [1582, 3, 31]]
at = "sakai"
cast = ["naya_sayo", "momochi_kaede"]
speaker = "naya_sayo"
mood = "tense"
news = "堺的奉行所在挨家查伊贺来的人，纳屋家闭门谢客了三天，茶室里一点声响都没有。"
rumor_days = 60

[tracks.chapters.default]
next = "tie_naya_kaede_landing"
effects = []
news = "堺的奉行所上纳屋家拿人，扑了个空：那个伊贺来的护卫前一夜自己走了，去哪儿没跟任何人说，门闩上只留着她的几个指印。"

[[tracks.chapters.choices]]
key = "hide_on_ship"
text = "让枫躲进我的货舱，风头过了再送她回堺。"
reply = "船出了港，枫在货舱的米袋后面蹲了十二天。送下去的饭她只吃一半，另一半包好揣着，说万一要跑。风声松了，我把船开回堺。她跳上栈桥，没问奉行所的事，头一句是：“小夜这些天喝茶了没有？”小夜就站在栈桥尽头，手里捧着一只粗碗，上头盖着布。"
next = "tie_naya_kaede_landing_b"
