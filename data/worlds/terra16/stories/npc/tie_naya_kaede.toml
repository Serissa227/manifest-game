# 落点（缺省 / 告密）：1582 年秋，枫没有回来。仍是恋人。
[[tracks.chapters]]
key = "tie_naya_kaede_landing"
title = "每年那天的茶"
text = "本能寺那场火以后，京都乱了一整个夏天。从北边来的人什么消息都带，就是没有枫的。寺里的和尚上门来问，要不要替那位护卫做一场法事。小夜把他送到门口：“没人报过她的死讯，我不替她编一个。”到了伊贺出事的那一天，她点了两碗茶。一碗自己喝了；另一碗放在门边，等它凉透，端出去倒在门外的石阶上。“茶凉了可以换。”她把那只空碗洗净，扣在架上，挨着自己那只。"
stage = "witness"
window = [[1582, 8, 1], [1582, 12, 31]]
at = "sakai"
