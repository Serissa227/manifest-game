# 靠近：1570 年名物狩到堺。两人此时三十五六岁，从这一章起是恋人。
[[tracks.chapters]]
key = "tie_naya_kaede_closer"
title = "半夜的行囊"
text = "织田的人拿着单子在堺挨家“求购”名物，价钱由他们开。到纳屋家的前一夜，枫把那只肩冲茶入裹进自己的行囊，天亮前出了町。上门的人只拿走两件，老爷说第三件早几年就摔碎了。傍晚枫回来，行囊瘪了，草鞋上的泥一直糊到脚踝。小夜没问她藏在哪儿，等她把门闩插好，才开口：“你图什么？”“茶凉了可以换，人走散了不行。”枫在门边坐下，“那只是你母亲的。”那天小夜点了两碗。第二碗她没端到门边去，放在了自己身旁的席上：“这一碗不是给护卫的。”枫看了那只碗一会儿，起身离开门边，在她身旁坐下。那一晚，她只回头看了门闩一次。"
stage = "witness"
window = [[1570, 4, 1], [1570, 9, 30]]
at = "sakai"
cast = ["naya_sayo", "momochi_kaede"]
speaker = "momochi_kaede"
mood = "tender"
news = "织田的人在堺挨家“求购”名物，纳屋家只交出两件，说第三件早年就摔碎了——碎片倒没人见过。"
rumor_days = 60

