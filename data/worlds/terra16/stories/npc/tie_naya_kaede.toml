# 相识：1568 年冬，矢钱风波。
[[tracks.chapters]]
key = "tie_naya_kaede_meeting"
title = "不懂茶的人"
text = "织田的人进了堺，开口就要两万贯矢钱。会合众吵了半个月，有人说挖壕守町，有人说花钱消灾。纳屋家的老爷没等吵出结果，先从伊贺请来一个护卫，叫百地枫。枫进了茶室，先把门闩推了两回，又蹲下去看门槛底下的缝，架上的茶器一眼没瞧。小夜偏把家里最贵的那只肩冲茶入挪到她膝前。“这东西摔了，”枫问，“人是不是得赔命？”小夜把茶入收回柜里，另拿出两只粗碗，一只碗沿缺了个口。“今天喝这个。茶先喝完，再谈要不要卖。”“卖了交矢钱？”“那得看町里吵出个什么来。”枫端起缺口的那只，一口喝干；喝的时候挪了挪位子，背靠着墙，脸朝着门。"
stage = "witness"
window = [[1568, 11, 1], [1569, 2, 28]]
at = "sakai"
cast = ["naya_sayo", "momochi_kaede"]
speaker = "naya_sayo"
mood = "cheerful"
news = "堺的会合众为两万贯矢钱从冬天吵到开春；纳屋家新请的那个伊贺护卫，也就在他家门口站了一整个冬天。"
rumor_days = 60

[tracks.chapters.default]
