# 落点：1571 春。巷子尽头那间屋子；木牌上只有屋子的名字。当着女孩们分面包和盐，结为姐妹。所有路径同一结局，按旗标换正文。
[[tracks.chapters]]
key = "tie_new_nala_aisha_landing"
title = "一间屋子"
text = "开春，安达卢斯区巷子尽头那间屋子收拾停当了：墙上挂着乌德琴，墙根摞着石板。上午阿伊莎在这里教女孩们认字母，下午娜拉教她们唱老家的歌，哪个村子的口音，就照哪个村子唱。门口的木牌是阿伊莎写的，只有一行：“哈芙莎的屋子”。娜拉念了两遍：“哈芙莎是谁家的？”“她自己家的。也是格拉纳达人，过了海，教女人念诗。”那天傍晚，当着一屋子女孩，两人结为姐妹：掰开一块面包，蘸了盐分着吃了。阿伊莎说：“从今往后，我们之间有面包和盐。”娜拉弹，阿伊莎念，念完一首，娜拉朝门边那个去年什么也没带来的女孩扬了扬下巴。女孩站起来，唱她那首歌。"
