text = "开春，安达卢斯区巷子尽头那间屋子收拾停当了：墙上挂着乌德琴，琴旁挂着一块石板，拼着那首歌，有几个音是两个字母叠着写的。上午阿伊莎在这里教女孩们认字母，下午娜拉教她们照着那块石板唱，唱出来是那个村子的口音。门口的木牌是阿伊莎写的，只有一行：“哈芙莎的屋子”。娜拉念了两遍：“哈芙莎是谁家的？”“她自己家的。也是格拉纳达人，过了海，教女人念诗。”那天傍晚，当着一屋子女孩，两人结为姐妹：掰开一块面包，蘸了盐分着吃了。阿伊莎说：“从今往后，我们之间有面包和盐。”娜拉弹，阿伊莎念，念完一首，去年什么也没带来的那个女孩站起来唱她的歌，满屋子的女孩看着墙上的石板，跟着她唱。"

