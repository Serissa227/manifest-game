# 抉择：1570 春。难民女孩只带着一首歌；一个要写下来，一个说写下来就变了。“我”在门口。
[[tracks.chapters]]
key = "tie_new_nala_aisha_choice"
title = "只带着一首歌"
text = "那个女孩是年初被一个赶驴人送到阿伊莎院子里的。她什么也没带，脚上的鞋是半路别人给的，只会唱一首她村子里的歌，口音重得连区里最老的人都只听得出一半。阿伊莎把一块新石板放到她膝上：“先认字。认了字，把这首歌写下来，就丢不了。”娜拉伸手把石板拿开：“写下来就变了。你那几个字母，拼得出她的音？”“拼不出来就多拼几遍。”“拼几遍也是你的口音。”两人的声音越来越高。女孩缩在门边，攥着衣角，嘴唇还在动，是那首歌的调子。阿伊莎一转头看见门口的我：“你来评评。”娜拉说：“先别评，你听她唱一遍。”"
stage = "involve"
window = [[1570, 2, 1], [1570, 6, 30]]
at = "fez"
cast = ["nala", "aisha"]
mood = "tense"
news = "非斯安达卢斯区来了个难民女孩，什么也没带，只会唱一首她村子里的歌，口音重得连区里的老人都听不全。"

