# C7 配角线（新线，Claude）：tie_new_nala_aisha「乌德琴与石板」——遵循 A5 / E37 故事 2.0 契约。
# 标签：GL（ties.toml 记 GL），女性之间的非恋爱线：结义姐妹。全线不写心动、不写暧昧，也不写说明两人关系的句子。
# 人物：娜拉 nala（1540-06-07，女，romance.with = m；非斯安达卢斯区乐师的女儿，弹乌德琴，收集流亡者的乡曲，不许人改口音）；
#   阿伊莎 aisha（1541-08-13，女，romance.with = m；格拉纳达流亡学者的女儿，在家里教邻舍的女孩认字，借出去的书都记得在谁手里）。
#   全线 1557-06—1571-05，娜拉 16—30 岁、阿伊莎 15—29 岁；没有任何恋爱效果，年龄门禁不涉及。
#   娜拉与埃丝特的友情归 tie_esther_nala（1554—57），与伊德里斯的恋爱线归 tie_new_idriss_qalam_nala，赎旧琴归 bond_nala；
#   阿伊莎与塔里克归 bond_aisha。本线一概不写。
# 依据：C7 总决定 §4.2 第 12 条、§三、§五；cast/classmates_fez.toml 两人的 persona 与口头禅（各用一次：娜拉在 meeting，阿伊莎在 closer）。
#   史实：1492 年以后格拉纳达的流亡者在非斯聚居，城里有安达卢斯区；1568 年 12 月阿尔普哈拉斯山区的摩里斯科人起事，
#     1569—71 年间陆续有人渡海逃到北非，得土安是格拉纳达流亡者落脚最多的港口之一。正文只写难民到了非斯，不写战事。
#     哈芙莎·宾特·哈吉·拉库尼娅（约 1135—1190/91），格拉纳达的女诗人，后来到了马拉喀什，教穆瓦希德王室的女眷
#     （伊本·赫蒂卜《格拉纳达志》等有载）；落点门口的木牌取她的名字。注意与苏莱曼之母哈芙莎苏丹不是一人，正文借阿伊莎一句话点明是格拉纳达人。
#     “我们之间有面包和盐”是阿拉伯语里结下情义的老说法。
#   原创：两人的交情；五年前唱歌憋红了脸、后来把曲子拼在石板上的小姑娘；难民女孩和她村子的歌；巷子尽头那间屋子与木牌；两个叠写的字母。
#   待核：1569 年到非斯的难民人数与路线（正文只用传闻口吻：“上百口人”“从得土安赶驴过来的人说”）；
#     以面包和盐为结拜姐妹的仪式（取俗语，本世界线的写法）；1571 年非斯的安达卢斯区有女子开的识字屋（本世界线的写法）。
# 缺省走向（玩家什么也不做）：meeting（1557 夏，阿伊莎去隔壁敲门；娜拉答应上午不弹，女孩们下午隔墙听琴；friends）
#   → closer（1562 春夏，当年那个小姑娘照石板上拼的字唱娜拉的曲，娜拉只扳调子不改口音；阿伊莎借她诗集；confidants + 回忆）
#   → turning（1569 春夏，传闻：阿尔普哈拉斯的难民到了非斯，两家各腾出半个院子）
