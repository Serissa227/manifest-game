[[tracks.chapters.choices]]
key = "find_room"
text = "替她们在区里找一间空屋子：给女孩住，也放得下石板和琴。"
reply = "我在区里问了两天，问到巷子尽头一间上了锁的屋子。主人是个老人，去年投奔特莱姆森的儿子去了，钥匙寄在隔壁油坊。屋里只剩一张草席和一扇朝南的窗。阿伊莎一趟一趟搬来石板和两箱书，沿墙摞好；娜拉在窗边钉了根木橛子，把琴挂上去：“琴挂在这儿，歌也住在这儿。”阿伊莎看了她一眼，没还嘴，在最上面那块石板上写了女孩的名字。头一天夜里，女孩一个人睡在屋里。我们站在巷子里，听她把那首歌从头唱到了尾。"
next = "tie_new_nala_aisha_landing"
