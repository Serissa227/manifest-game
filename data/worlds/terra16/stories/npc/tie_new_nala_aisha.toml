# 相识：1557 夏。隔壁的琴声让写字的女孩们停了笔；阿伊莎去敲门。
[[tracks.chapters]]
key = "tie_new_nala_aisha_meeting"
title = "琴声与石板"
text = "六月晌午，阿伊莎家的院子里坐着七个女孩，膝上各搁一块石板，描她写的字母。隔壁乐师家的乌德琴响起一支慢调子。最小的那个先停了手，不到一行，七个脑袋全朝墙那边歪过去。阿伊莎拍掉手上的白垩，过去敲门，女孩们抱着石板跟在后头。娜拉抱着琴出来，阿伊莎朝身后偏了偏头：“这一段，她们记得比字母快。”娜拉看看一排仰着的小脸，用琴颈点了点最小的那个：“你刚才跟着哼了。”小姑娘咯咯笑，说她一开口，奶奶就装聋。“奶奶装聋，我可不装。这一遍你唱。”小姑娘憋红了脸唱了。阿伊莎蹲下，把她唱的词一个个写在石板上。娜拉看了一眼：“第二句你写快了，她拖了半拍。”阿伊莎在那个字后头添了道短横。娜拉转身进门，又回头：“上午我不弹。”"
stage = "witness"
window = [[1557, 6, 1], [1557, 9, 30]]
at = "fez"
cast = ["nala", "aisha"]
speaker = "aisha"
mood = "cheerful"
news = "非斯安达卢斯区有户人家的院子，上午女孩们在石板上写字，下午就隔着墙听乐师家的女儿弹乌德琴。"

[tracks.chapters.default]
next = "tie_new_nala_aisha_closer"
effects = [{ kind = "tie", a = "nala", b = "aisha", relation = "friends" }]

# 靠近：1562 春夏。当年那个小姑娘把娜拉的曲拼在石板上，唱出了阿伊莎的口音。
[[tracks.chapters]]
key = "tie_new_nala_aisha_closer"
title = "按字学会的曲"
text = "五年前在院子里憋红了脸唱歌的小姑娘，如今认全了字母。她把娜拉的一支曲拼在石板上，没有谱，一个音一个字母，正反两面都写满了。这天下午，她抱着石板站在娜拉的院子里，照着字唱。调子歪了好几处，口音却一听就是阿伊莎的：格拉纳达城里读书人家的念法，每个字都咬得端端正正。娜拉的嘴角动了动，没笑出来。她拨着琴，把歪了的地方一处一处扳回来，那些字怎么念，她一个也没碰。阿伊莎靠在墙边，等女孩跑远了才问：“这支曲是山里人唱的，你不改改她的口音？”娜拉低头拧弦：“这是她自己的唱法。”阿伊莎从袖子里抽出一本薄薄的诗集，搁在琴箱上：“这本书可以借，下一位也在等。”娜拉翻开，扉页上一溜名字，划掉了七个，最后一个是她的。"
stage = "witness"
window = [[1562, 3, 1], [1562, 7, 31]]
at = "fez"
cast = ["nala", "aisha"]
speaker = "nala"
mood = "tender"
news = "非斯安达卢斯区有个女孩，照着石板上拼的字母唱会了一支曲；弹琴的娜拉只给她扳了调子，口音一个字没动。"

[tracks.chapters.default]
next = "tie_new_nala_aisha_turning"
effects = [{ kind = "tie", a = "nala", b = "aisha", relation = "confidants" }, { kind = "memory", memory = "mem-tie_new_nala_aisha-closer", title = "按字学会的曲" }]

# 转折（传闻）：1569 春夏。阿尔普哈拉斯的难民渡海来到非斯；两家各腾出半个院子。
[[tracks.chapters]]
key = "tie_new_nala_aisha_turning"
title = "山里来的人"
text = "开春以后，非斯的安达卢斯区天天有生人敲门找亲戚。听说格拉纳达那边的山里起了事，阿尔普哈拉斯的人摸黑下到海边，挤上渔船往这边划。从得土安一路赶驴过来的人说，路上那些人，有的只背出来一口锅，有的光着脚，什么也没带。一夜之间，区里多了上百口人，清真寺的院子睡满了，井边打水的队排到天亮。巷子里都在说乐师家和教书的那家：两家的院子都腾出了一半，石板挪到墙根，席子铺到门槛。有人看见阿伊莎在门口记名字，碰上不肯开口的孩子，她就蹲下来：“想好了再说，我等着。”娜拉抱着琴一个棚子一个棚子地走，见人就问：“谁还记得村里的歌？”"
stage = "rumor"
window = [[1569, 3, 1], [1569, 7, 31]]
at = "fez"
cast = ["nala", "aisha"]
mood = "sad"
news = "格拉纳达山里起了事，阿尔普哈拉斯的难民渡海逃到非斯，安达卢斯区一夜多了上百口人，有的只背出来一口锅。"

