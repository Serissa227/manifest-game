# 落点二（缺省与帮助）：1572 年季风前，卡利卡特炮台。两人守同一班。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_epilogue"
title = "河口的炮台"
text = "季风前，那门炸坏过火门的炮重新上了炮位，新凿的火门边留着一圈亮铜。迪奥戈趴在炮尾后头瞄了一眼河口，直起身：“能打。”库提坐在矮墙上盯着水，嘴里的号子慢了半拍，在数浪。“你看那条巡逻船，”他拿下巴一指，“吃水那么深，进来一步就坐沙。”外海远处，葡萄牙巡逻船的帆斜斜划过，没有转头。“它看见炮了。”迪奥戈说。“它看见的是我。”库提笑，“我这条小船，它追不上。”他把号子唱完整了。迪奥戈跟着拍子，拍错了一下，库提也没指出来。"
stage = "witness"
window = [[1572, 5, 1], [1572, 7, 31]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
speaker = "kutti"
