text = "季风前，那门炸坏过火门的炮重新上了炮位，新凿的火门边留着一圈亮铜。迪奥戈趴在炮尾后头瞄了一眼河口，直起身：“能打。”浅滩上那三根竹竿还插着。库提每次涨潮前都蹚过去扶一扶，回来时裤腿湿到膝盖，嘴里的号子慢了半拍，在数浪。“你看那条巡逻船，”他拿下巴一指，“吃水那么深，进来一步就坐沙。”外海远处，葡萄牙巡逻船的帆斜斜划过，没有转头。“它看见炮了。”迪奥戈说。“它看见的是我。”库提笑，“我这条小船，它追不上。”他把号子唱完整了。迪奥戈跟着拍子，拍错了一下，库提也没指出来。"

# 落点三（劝他回去的后果）：1572 年夏，科钦。迪奥戈回到旧旗下，两人仍是恋人。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_apart"
title = "回到旧旗下"
text = "传言说，那个叛逃的炮手回了科钦，在堂上认了罪，得了赦，如今在葡萄牙人的船厂里修炮，干活不多说话。可每年季风一转，总有一条小船从北边下来，在科钦河口停一夜，船上是个马拉卡尔家的水手。船厂的人见过那炮手夜里提着灯去河边，天亮前回来，袖口是湿的。两个人仍是恋人，隔着两面旗。"
stage = "rumor"
window = [[1572, 5, 1], [1572, 7, 31]]
at = "cochin_port"
cast = ["kutti", "diogo_rocha"]
mood = "sad"
rumor_days = 60
news = "那个叛逃的葡萄牙炮手回科钦认了罪；听说每年季风一转，总有条马拉卡尔的小船来科钦河口停一夜。"

