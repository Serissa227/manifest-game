# 落点一：1560 年秋，卡利卡特炮台。一块油布；两人成为恋人，写到一个吻为止。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_together"
title = "交班之后"
text = "季风过去，河口的守夜排了新轮次。交班的鼓敲过两遍，库提还坐在炮台矮墙上晃着腿，看迪奥戈拿油布擦炮身。“你们教堂不是有名册吗？”库提终于问，“人走了，名字呢？”“划了。”迪奥戈头也没抬，“划得很干净。”“我家里也有人不认我。”库提说得很快，像报浅滩的水深，“上个月叔叔在礼拜寺门口，当着人就绕开走了。”迪奥戈的手停了。他把油布扔过去：“擦那头。”库提擦到炮口，一抬头，迪奥戈已站在面前，鼻尖上有一点炮灰。库提伸手去抹，没抹干净，手腕被握住了。迪奥戈吻了他。远处守夜的鼓第三遍响起，没有人去交班。"
stage = "witness"
window = [[1560, 10, 1], [1560, 12, 31]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
speaker = "kutti"
mood = "tender"
news = "卡利卡特河口的炮台换了守夜的轮次，听说那个葡萄牙炮手和马拉卡尔家的小水手总排在同一班。"

