# 相识：1557 年春，卡利卡特河口的沙滩。一根树枝，沙上的名字，涨上来的潮。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_meeting"
title = "先教名字"
text = "河口的沙滩上，新来的葡萄牙炮手对着三条船喊炮令，船工一个也没动。库提从船舷跳下来，把他拽到沙地上蹲下，捡了根树枝。“炮令谁都会喊。”他在沙上划出一个名字，“摇橹的阿里，拉缆的库尼。大船转不过来，小船可别慌——你连谁在摇橹都不知道，慌了喊谁？”迪奥戈念：“阿利。”“阿里。”“阿……里。”念了两遍都不对。库提笑得树枝掉在地上，又捡起来：“你老家那个地名，我也念不出。写给我看。”迪奥戈写下“塞图巴尔”。库提一个音一个音地念，念到第三遍，潮水漫上来舔到脚跟，两人同时退了一步。"
stage = "witness"
window = [[1557, 2, 1], [1557, 4, 30]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
speaker = "kutti"
mood = "cheerful"
news = "卡利卡特河口新来的葡萄牙炮手，被马拉卡尔家的小水手罚在沙滩上背船工的名字，背到潮水涨上来。"

[tracks.chapters.default]
next = "pair_kutti_diogo_rocha_closer"
effects = []

# 靠近：1558 年秋，卡利卡特炮台。一块炭条画的木板；撤人的小船比炮位还大。crush 只算心照不宣。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_closer"
title = "两种叛徒"
text = "岸上有人冲库提喊：“你舅舅的骨头还泡在海里，你倒陪着法兰克人守夜！”又有人冲迪奥戈啐了一口，说他换旗比换衣裳还勤。炮台上，两人为射程吵了半夜。“第三道沙洲一露头，大船就搁浅了，你用不着打那么远！”“搁了浅，它的舷炮照样够得着你。”吵累了，库提拿炭条在木板上画河口，迪奥戈补炮位。画着画着，那条撤人的小船被库提描了又描，比炮位还大。守夜的老水手凑过来，指着炮位问迪奥戈：“这炮到底朝谁？”“炮口朝哪边，我自己负责。”库提没吭声。他用拇指抹掉木板上那道浅水，照两人吵出来的射程，重新画了一遍。"
stage = "witness"
window = [[1558, 10, 1], [1558, 12, 31]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
speaker = "diogo_rocha"
mood = "tense"
news = "卡利卡特河口那个葡萄牙炮手被人骂叛徒，听说他画的河口图上，撤人的小船画得比炮位还大。"

[tracks.chapters.default]
next = "pair_kutti_diogo_rocha_together"
