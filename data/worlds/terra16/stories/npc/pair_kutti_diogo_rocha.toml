# 抉择：1571 年冬，卡利卡特炮台。母亲的信与坏了火门的炮；玩家可以陪库提查浅水，也可以劝迪奥戈回去。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_choice"
title = "留一条撤路"
text = "悬赏的告示贴到了科钦，消息顺着季风传回河口。迪奥戈的母亲托人捎来一封信，蜡封上压着十字：他肯回去认罪，总督就肯赦免。炮台上，迪奥戈蹲在那门炸坏了火门的炮前，信塞在腰带里，露着一角。库提在矮墙下数落潮后露出来的沙洲，号子唱得断断续续。“浅滩能留一条路，”库提说，“小船过得去。”“嗯。”迪奥戈拿凿子敲了敲火门，“这炮今晚能好。”信的事，两人一个字没提。库提抬头看见了我，嗓门忽然高起来：“你来得正好！”"
stage = "involve"
window = [[1571, 11, 15], [1572, 1, 31]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
speaker = "diogo_rocha"
mood = "tense"
news = "葡萄牙人在科钦贴了悬赏捉叛逃炮手的告示，听说卡利卡特河口那个炮手收到了一封他母亲的信。"

