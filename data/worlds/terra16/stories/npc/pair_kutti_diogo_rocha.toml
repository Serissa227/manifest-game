# 河口不问旧旗（pair_kutti_diogo_rocha）——配角线，标签 BL；纯 BL 的一对，恋爱线。
# 人物：库提（kutti，1538-06-17 生），马拉卡尔家的年轻水手，认得卡利卡特河口每一道浅滩；
#       迪奥戈·罗沙（diogo_rocha，1537-01-25 生），投奔扎莫林的葡萄牙炮手，守河口的炮台。
#       生年差一年；全线都在成年以后：1558 年秋 crush（库提 20、迪奥戈 21 岁），1560 年秋 lovers（库提 22、迪奥戈 23 岁，窗口起日晚于 1557-01-01）。
#       落点章只写到一个吻为止。
# 依据（史实与原创的界线）：马拉卡尔家族为扎莫林在海上打游击，对抗葡萄牙巡逻舰队；葡萄牙人叛逃到印度本地王公手下铸炮、教炮，是真实存在的现象；
#       1571 年扎莫林的军队围攻并拿下葡萄牙人的查利亚姆堡，马拉卡尔的船堵海口。科钦是葡萄牙人的据点，告示与赦免在科钦办。
#       原创：这两个人、河口的炮台与浅滩、沙上的名字、炭条画的河口图、三根竹竿、母亲的信与纸船。
# 待核：查利亚姆之战里叛逃炮手铸炮的具体数量与悬赏数目（正文只写“听说”）；1570 年代科钦赦免叛逃者的具体办法（正文只写“认罪、被赦”）；
#       迪奥戈老家塞图巴尔是本文件取的出身地，cast 未写，整合时若有冲突请改地名。
# 缺省走向：meeting（沙上学名字）→ closer（两种叛徒，crush）→ together（1560 年成为恋人）
#       → turning（传闻：1571 年查利亚姆堡破、葡萄牙人悬赏）→ choice（无人插手：两人留在河口修炮，母亲的信没有回）
#       → epilogue（1572 年季风前，两人守同一班，圆满）。
#   帮助：陪库提查浅水、插竹竿（_helped）→ 落点变体：竹竿还插着。
#   劝他回去（_apart，有后果）：迪奥戈回科钦认罪受赦，在葡萄牙人的船厂修炮，库提留在河口，仍是恋人，隔着两面旗。
# 共享旗标（写）：c7_pair_kutti_diogo_rocha_together（together）、_helped、_apart；不读外部旗标。
# 日程：两人静态日程都在卡利卡特。pardon 选项与 apart 章的 default 用 schedule 效果把迪奥戈迁到 cochin_port（不设止期）；
#       cochin_port 若不能当日程地点，请整合方改成科钦的城市 key。
# 整合须知：cast/ties.toml 里 kutti_diogo_rocha 目前写 lovers、since 1557-12-31，早于本线 together（1560-10..12）；整合时应改到 1560-12-31 之后。
# 口头禅各用一次：库提“大船转不过来，小船可别慌”（meeting）；迪奥戈“炮口朝哪边，我自己负责”（closer）；别处换说法。
# 迪奥戈 cast 里的 secret（科钦炮台上的旧事）不写，也不进见闻；apart 只写“认了罪、被赦”，不说为什么。

