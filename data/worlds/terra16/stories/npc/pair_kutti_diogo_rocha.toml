# 转折（传闻）：1571 年夏秋，卡利卡特。查利亚姆堡破，葡萄牙人悬赏捉叛逃的炮手。
[[tracks.chapters]]
key = "pair_kutti_diogo_rocha_turning"
title = "查利亚姆"
text = "听说扎莫林的大军围了葡萄牙人的查利亚姆堡，马拉卡尔家的船堵死了海口，堡里的粮船进不去。城墙下打得最响的几门炮，据说是叛逃的葡萄牙炮手铸的，铸炮的人认得堡里的每一垛墙。堡破以后，科钦的葡萄牙人放了话要报复，悬赏捉那些替扎莫林造炮的叛徒。卡利卡特河口的人说，悬赏的数目够买半条船。"
stage = "rumor"
window = [[1571, 7, 1], [1571, 10, 31]]
at = "calicut_port"
cast = ["kutti", "diogo_rocha"]
mood = "tense"
