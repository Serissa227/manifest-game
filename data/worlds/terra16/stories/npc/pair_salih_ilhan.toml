# 抉择：1559 年涨水节前，爱资哈尔与总督府。约了三遍的日子；缺省两人读完书、抄完文书，夜里在岛上碰头。
[[tracks.chapters]]
key = "pair_salih_ilhan_choice"
title = "谁能离席"
text = "涨水节只剩十来天。萨利赫在爱资哈尔的廊下找到我，手里攥着一张日子写了又划的纸：“先生那天要听整整一天的书。伊尔汗那边，总督府的文书正堆着……我不想叫他为这个扔下事。”他顿了顿，“我的兄弟，你就说我什么时候都行，别说是我催的。”傍晚，伊尔汗在总督府门口把我拦住，也塞来一张纸，日子已经改到了第三遍：“告诉那个外省来的，我随时都行。……你看他方便不方便，别叫他丢下先生。”两人都想约在罗达岛的水尺边，两人都不肯叫对方让路。"
