# 靠近：1555 年 8 月，罗达岛。抢着报数，错了一格，请他再看一遍。学院期，到心照不宣为止，不写 relation。
[[tracks.chapters]]
key = "pair_salih_ilhan_closer"
title = "水尺上的刻度"
text = "尼罗河涨水的时节，先生打发两个学生去罗达岛看水位尺，回来讲给他听。伊尔汗一路走在前头，到了摆渡口停下来，回头见萨利赫落下一大截，等人走近，抢先开口：“我只是顺路，别多想。”水尺在岛的南头，石壁砌得深，台阶一级一级没进水里。“外省来的，没见过这么大的河吧？”萨利赫望着水：“我们那儿的河，一年只来三天。”伊尔汗伸着脖子报数：“十五腕尺，又六格！”“再看一遍？”萨利赫轻声说。伊尔汗瞪他一眼，趴下去又看，耳朵红了：“……五格。”回到先生屋里，两人把石壁怎么凉、台阶上的青苔怎么滑都讲了，先生听得直笑，问：“水到多少了？”伊尔汗张嘴之前，先看了萨利赫一眼。"
stage = "witness"
window = [[1555, 8, 1], [1555, 8, 31]]
at = "cairo"
cast = ["salih", "ilhan"]
speaker = "ilhan"
mood = "tender"
news = "开罗那位盲先生派两个学生去罗达岛看水位尺，听说回来讲得连台阶上的青苔都说了。"

