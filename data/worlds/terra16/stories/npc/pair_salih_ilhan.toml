key = "pair_salih_ilhan_together"
title = "罗达岛的夜"
text = "夜里的罗达岛只有水声。伊尔汗提着灯在台阶上等，萨利赫夹着一本书来，手指在书页里翻了很久，才停住：“就这一页。你听。”纸上是他自己抄的一首诗，边角磨毛了，折过许多次，先生的书里没有它。伊尔汗听完，张了张嘴，那句顺路的话没有出来。他把灯放下，又提起来：“外省来的，你念得比先生那本好听。”萨利赫笑了，没有躲开他的眼睛。吻是伊尔汗先凑过去的。分开以后他红着脸去看水尺，嘴硬：“十六腕尺到了。”“你再看一遍？”萨利赫问。伊尔汗低头看了很久：“……差一格。”两人约好，往后每年涨水节都来这一级台阶，水涨得早也来，涨得迟也来。"
