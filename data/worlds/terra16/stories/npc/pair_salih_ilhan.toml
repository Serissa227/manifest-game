# 转折（传闻）：1558 年 8—9 月，开罗。据说那年涨得迟；不指认具体年份的灾情。
[[tracks.chapters]]
key = "pair_salih_ilhan_turning"
title = "迟到的十六腕尺"
text = "据说那年尼罗河涨得迟。过了该到的日子，十六腕尺还差着几格，运河口的堤一天没掘，开罗的粮价一天一个样，面铺门口排起了长队。总督府里新来的那个年轻书记，禁卫军家的少爷，抄水位的文书抄到后半夜，抄坏的纸扔了一地，旁人只当他嫌笔慢。城那头，爱资哈尔的也门学生替盲先生读书，一夜读完三卷，嗓子都哑了。涨水节前后，罗达岛上什么人都有，偏偏没见那两个年轻人一块儿来，守水尺的人说，这些年里头一遭。"
stage = "rumor"
window = [[1558, 8, 1], [1558, 9, 30]]
at = "cairo"
cast = ["salih", "ilhan"]
mood = "tense"
news = "那年尼罗河涨得迟，十六腕尺迟迟不到，开罗粮价天天涨；听说罗达岛的水尺边少了两个每年都来的年轻人。"

