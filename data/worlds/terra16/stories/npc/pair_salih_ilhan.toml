# 相识：1554 年春，爱资哈尔的廊下。抢来的书，页边的小字，停在漏掉那一行上的手指，旁边空着的凳子。
[[tracks.chapters]]
key = "pair_salih_ilhan_meeting"
title = "页边的小字"
text = "天不亮，廊下，盲先生靠着柱子听萨利赫读书。萨利赫读得慢，一句一顿，伊尔汗听了半页就忍不住：“这样读到日落也读不完。”他一把抽走书，又快又亮地念下去，翻页像在追什么。念完，他扬着下巴等夸。先生摇了摇头：“页边的小字，你一行没念。我听书，听的就是那些前人留下的批语。”伊尔汗的脸红到了耳根。萨利赫没去夺书，只走过来，把手指停在被漏掉的那一行上：“我的兄弟，是这里。先生说过，耳朵比眼睛记得牢。”第二天天没亮，伊尔汗已经坐在离先生最近的凳子上，旁边那张最好的凳子空着，他拿袍角压着。萨利赫进门时，他头也不抬：“那张给仆人留的，外省来的，别误会。”"
stage = "witness"
window = [[1554, 2, 1], [1554, 4, 30]]
at = "cairo"
cast = ["salih", "ilhan"]
speaker = "ilhan"
mood = "cheerful"
news = "开罗讲席上禁卫军家的少爷抢着替盲先生读书，读得飞快，先生却说他把最要紧的页边全漏了。"

