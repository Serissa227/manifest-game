# 水尺上没有名字（pair_salih_ilhan）——配角线，标签 BL；同学线，恋爱线（纯 BL 两人）。
# 人物：萨利赫（salih，1540-12-25 生），也门来的穷学生，天不亮先替失明的老先生读书；成年后做学者，编完老先生的书目。
#       伊尔汗（ilhan，1539-03-07 生），驻开罗禁卫军人家的少爷，嘴上说成绩无所谓，却总先到讲席；成年后在埃及总督府做书记。
#       生年差不到两年。学院期（1554—1556）只写到心照不宣：meeting（萨利赫 13、伊尔汗 15 岁）与 closer（14 / 16 岁）不写任何 crush / lovers 效果，
#       meeting 的缺省只设 rivals。恋人效果只在 together 章：窗口 1559-08-15—09-15，萨利赫 18 岁（1558-12-25 满 18）、伊尔汗 20 岁，
#       起日两人都已成年，且晚于 1557-01-01。其他章不写 relation 升级。
# 依据：罗达岛的水位尺（Nilometer）是开罗真实的老建筑；每年八月尼罗河水涨到十六腕尺，开罗庆祝涨水节、掘开运河堤口，是史实的传统。
#       奥斯曼治下的埃及有总督与驻防的禁卫军，禁卫军家的孩子进爱资哈尔读书不算稀奇。
#       两人的故事、老先生、读数的玩笑、手抄的诗都是原创。哪一年涨得迟只写“据说那年”，不指认具体年份的灾情，也不写灾情的数字。
# 待核：水位尺的读数在正文里用“腕尺”和“格”（不展开真实刻度的细分）；十六世纪涨水节的官方仪式（谁到场、谁掘堤）正文一概不写，只写民间看水的人。
#       总督府的书记抄水位文书这件事是推想，正文用“听说”。
# 缺省走向：meeting（抢书，页边的小字；设 rivals）→ closer（1555 年去看水尺，心照不宣）→ turning（传闻：迟到的十六腕尺，两人没能一起去）
#       → choice（1559 年涨水节前，约日子约了三遍；缺省：读完书、抄完文书，夜里在岛上碰了头）
#       → together（成为恋人，一个吻）→ epilogue（传闻：每年涨水节的两个年轻人）。没有坏结局；玩家只改变 together 章的一句变体。
#   帮助（cover_ilhan / read_for_salih）：设 c7_pair_salih_ilhan_helped，各给一条回忆；旁观（watch）只加一点好感。三者都走向 together，关系不变。
# 并肩：主角在 bond_salih / bond_ilhan 的 S 章与两人之一立了约，c7_pair_salih_ilhan_taken=true，together 的 when 不满足，主线静默结束，改走 _side：
#       1559 年涨水节两人各带一份记录去罗达岛，设 friends 与 c7_pair_salih_ilhan_side；不写嫉妒，不提主角。
# 共享旗标：读 c7_pair_salih_ilhan_taken（bond_salih、bond_ilhan 的 S 章设，不在本文件）；写 c7_pair_salih_ilhan_together、_helped、_side。
#       c7_pair_salih_ilhan_together 由 bond_ilhan 的 1562 重逢、bond_salih 的 1563 重逢读。
# 去重：“每年一起去看水位尺”只归本线；1556 年 8 月涨水节之夜读诗归 bond_salih，本线 closer 用 1555 年，不写 1556 年的涨水节；
#       bond_ilhan 的 A1 不在水位尺旁。
# 口头禅（照人物卡）：萨利赫“先生说过，耳朵比眼睛记得牢。”（meeting 一次，别处换说法）；伊尔汗“我只是顺路，别多想。”（closer 一次，别处换说法）。
# 日程：两人 1554—1560 年的日程在 cairo_city；章节的 at 用 cairo（罗达岛、讲席、总督府都按 cairo 判断在场），不需要改 cast。
# 秘密：萨利赫为巴拉卡练诗、伊尔汗替萨利赫占座的来龙去脉归各自的羁绊线；本线只写占座这个动作（meeting），见闻里不写。

