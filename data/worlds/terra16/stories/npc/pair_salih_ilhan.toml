# 尾声（传闻）：1560 年涨水节，罗达岛看水尺的老人说的。名字哪儿也没刻。
[[tracks.chapters]]
key = "pair_salih_ilhan_epilogue"
title = "每年的约"
text = "罗达岛看水尺的老人说，这两年每到涨水节，总有两个年轻人来，一个穿着书记的袍子，一个夹着书。一个抢着报数，一个让他再看一遍，报错的那个脸就红，也不改口说是风大。他们在台阶上坐到很晚，有时夹书的读，穿袍子的听，有时换过来，读得又快又错，另一个也不拦。老人每年涨水节前刷一遍水尺上的刻度，一年比一年清楚，两个人的名字倒哪儿也没刻。台阶上的青苔他不刷，说那两个人坐惯了那一级。"
