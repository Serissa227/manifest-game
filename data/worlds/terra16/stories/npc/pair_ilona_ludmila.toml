# 一、相识：1570 年冬春，一笔赏钱把猎人引进夜间书库，带回来的是一张书单。
[[tracks.chapters]]
key = "pair_ilona_ludmila_meeting"
title = "猎物的书单"
text = "赏钱是个戴皮手套的人出的：找一个夜里出没、脸色苍白的人。伊洛娜看得见这种东西。她半夜从侧门摸进旧城图书馆，先数门窗，两扇窗、一道门，再数人。我在阅览室抄书，只看见一个女人贴着书架走过去，手按在刀柄上。书库最里面点着一支蜡烛。管理员柳德米拉坐在烛下，头也不抬：“嘘——轻一点，那一页我还没读完。”伊洛娜没收刀。柳德米拉也没装睡，读完那页，才抽出一张纸推过桌子，纸上只有一个书名、一个页码：“明天白天，帮我看一页。只看一页。”伊洛娜问：“为什么是白天？”“我已经很久没见过白天的字了。”刀尖垂下去一寸。“你叫什么？”“柳德米拉。你呢？”“伊洛娜。”她把书单折了两折，塞进腰间的皮袋。那笔赏钱，她没去领。"
stage = "witness"
window = [[1570, 1, 15], [1570, 3, 31]]
at = "prague"
cast = ["ilona", "ludmila"]
speaker = "ludmila"
mood = "mystic"
night = true
news = "布拉格旧城图书馆夜里来了个黑海口音的女人，听说进去时手按在刀上，出来时手里拿着一张书单。"

[tracks.chapters.default]
next = "pair_ilona_ludmila_closer"
effects = []

# 二、靠近：1571 年夏，朝南的窗边念《魔鬼圣经》抄本的那一页（friends）。
[[tracks.chapters]]
key = "pair_ilona_ludmila_closer"
title = "窗边的一页"
text = "一年多了，伊洛娜每个月来一回，白天来。她站在书库朝南的窗边念一页，柳德米拉坐在书架最深的阴影里听，从不往窗边挪一步。我在隔壁桌等书，听了一上午。这个月念的是一份游记抄本。抄的人去过布劳瑙修道院，见过那部要两个修士才抬得动的《魔鬼圣经》，说书页用了一百多张兽皮，修士们讲是一夜写成的。抄本里照着描了一页：一个绿脸的魔鬼，伸着爪子，舌头分叉。伊洛娜停下来，把抄本对着阴影举了举：“你们这种人，是不是都爱看这个？”阴影里静了一会儿。“你们这种人，是不是都爱问这个？”伊洛娜第一次笑出了声。日班的老管理员从柜台后探出头，她赶紧捂住嘴。“接着念。”柳德米拉说，“魔鬼对面那一页画的是天上的城，那页也要念。”"
stage = "witness"
window = [[1571, 5, 1], [1571, 7, 31]]
at = "prague"
cast = ["ilona", "ludmila"]
speaker = "ilona"
mood = "tender"
news = "布拉格旧城图书馆这一年白天也开一扇窗，有个外乡女人站在窗边念书，念的是什么，借书的人都没听懂。"

[tracks.chapters.default]
next = "pair_ilona_ludmila_turning"
effects = [{ kind = "tie", a = "ilona", b = "ludmila", relation = "friends" }]

# 三、转折（传闻）：1575 年秋，鲁道夫加冕以后，城里的生人里有打听两人的骑士。
[[tracks.chapters]]
key = "pair_ilona_ludmila_turning"
title = "加冕以后的生人"
text = "九月，鲁道夫在布拉格加冕做了波希米亚的国王。城门口的车马堵了半个月，城里多了贵族、侍从、看星象的、配药的，还有些说不清是做什么的。旧城几家客栈的老板说，有几个说匈牙利话的骑士住下来就不走了，不看游行，也不进教堂，只挨家挨户地问：有没有一个黑海边来的女人，话少，背对着窗户就坐不住。问完了，又问图书馆夜里管书的那位住在哪儿，几点开门，几点走。面包铺的老婆子说，骑士塞给她一枚银币，她收了，照样说不知道。河边酒馆的伙计说，那个黑海来的女人这阵子每晚都坐在靠门的位子，酒只叫一杯，一直坐到打烊。"
stage = "rumor"
window = [[1575, 9, 15], [1575, 11, 30]]
at = "prague"
cast = ["ilona", "ludmila"]
mood = "tense"
news = "鲁道夫加冕以后布拉格多了许多生人，有几个说匈牙利话的骑士在旧城挨家打听，问的是图书馆夜里开门的事。"

[tracks.chapters.default]
next = "pair_ilona_ludmila_choice"
