# 五（交人的后果）：1576 年春夏，书库烧了半间，夜间管理员搬去城外的地窖，两人仍是知己。
[[tracks.chapters]]
key = "pair_ilona_ludmila_apart"
title = "烧了半间的书库"
text = "旧城图书馆的书库烧了半间，是开春前一个夜里的事。救火的人说，火是从最里面那排书架烧起来的，那里平常只点一支蜡烛。夜间管理员不见了一个月，借书的人都以为她烧在了里头，有人还替她押在柜上的书钱犯愁。后来城外有人说，一处地窖夜里又亮了灯，只开到鸡叫，只借给熟人，押金照旧按页数算，烧黑了边的书也照样借。那个黑海来的女人找到了那里，照旧每个月去念一页书。河边那家酒馆，她再也没进过。伙计说，有一回她走到门口，看了看里头坐着的人，转身就走了，连门都没替人关上。"
stage = "rumor"
window = [[1576, 4, 15], [1576, 6, 30]]
at = "prague"
cast = ["ilona", "ludmila"]
mood = "sad"
news = "布拉格旧城图书馆书库烧了半间，夜间管理员不见了一个月，后来在城外又开了门，只在夜里，只借给熟人。"

