# 五、落点：1576 年春夏，书搬回来，伊洛娜第一次说了实话（缺省即知己）。
[[tracks.chapters]]
key = "pair_ilona_ludmila_together"
title = "同是不被接住的人"
text = "风头过去，书一箱一箱从城外搬回了书库。我帮着抬最后一箱，柳德米拉在架子前对页码，一本也没少。那晚伊洛娜没走。柳德米拉合上账簿，第一次问她：“你是从哪里来的？别说黑海，黑海很大。”伊洛娜数了一遍门窗，又数了一遍人。三个。她的目光在我脸上停了一下：“你不用走。”然后她说了。说了很久，蜡烛换过一支。柳德米拉听完，把手边的书翻到中间，又合上：“书上说……算了，书上没写过这个。”她停了一会儿：“我们都是不被这个世界接住的人。”伊洛娜没接话，把烛台往她那边推了推。从那以后，伊洛娜每个月来念一页书。走的时候，书里总夹着一张柳德米拉写的书单，第一行是：“给伊洛娜。白天读，不必念给我听。”"
stage = "witness"
window = [[1576, 4, 15], [1576, 6, 30]]
at = "prague"
cast = ["ilona", "ludmila"]
