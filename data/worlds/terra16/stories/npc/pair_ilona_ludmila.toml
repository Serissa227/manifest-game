# C7 配角线（重写，Claude，2026-10-11）：pair_ilona_ludmila「白天读给她听」——遵循 docs/DECISIONS.md“第九批 A5 / E37 开工：故事 2.0 TOML 契约”。
# 标签：friendship（ties 的编辑标签仍是 GL——女性之间的关系——但如实标为非恋爱）；相识 → 朋友 → 知己，全线不写心动、恋人、亲吻。
# 人物：伊洛娜 ilona（1531-11-24，女，纯 GL；对人只说是从黑海边来的女人，1560 年起在布拉格）；
#   柳德米拉 ludmila（1330-05-21，女，纯 GL；布拉格旧城图书馆的夜间管理员，天黑才开门，借书按页数留押）。
#   两人生年相差两百年，内核拒绝一切恋爱效果；本线只用 friends / confidants。
# 依据：docs/TERRA16.md §14（两人的人设）；C7 总决定 §一（伊洛娜唯一的恋情归 tie_extra_06，1577 起，本文件不写、不暗示）、§2.6、§三、§五。
#   史实背景：1575 年 9 月 22 日鲁道夫在布拉格加冕为波希米亚国王，城里来了许多贵族、侍从与外乡人；
#   《魔鬼圣经》（Codex Gigas）1594 年以前藏在布劳瑙（布鲁蒙夫）的本笃会修道院；书页用一百多张兽皮，魔鬼像对面那一页画的是天上的城；
#   “一夜写成、魔鬼帮的忙”是修士们流传的说法。
#   原创：龙骑士团的追兵（本世界的组织，正文只写“说匈牙利话的骑士”“养大她的骑士团”）、那份描述《魔鬼圣经》的游记抄本、押条、
#   往维也纳的谎话、伞与面纱、城外的地窖、书库失火。
#   待核：布劳瑙的游记抄本是虚构藏书，不指明哪一部。
# 秘密：伊洛娜看得见回魂者（正文只写“她看得见这种东西”）；柳德米拉是回魂者（正文只写她不肯到窗边、天黑才开门、阴天撑伞戴面纱）。
#   news 一律不写这两样，也不写书藏在哪里。
# 缺省走向（玩家什么也不做）：meeting（1570 春，书单）→ closer（1571 夏，窗边念《魔鬼圣经》的抄本，friends）
#   → turning（1575 秋，传闻：加冕后的生人里有打听两人的骑士）
#   → choice（1576 春，伊洛娜不交人，连夜把书搬去城外）→ together（1576 春夏，知己，confidants）。
#   帮助（挡追兵 / 伞与面纱）也走 together，只是 variants 不同；交人走 apart（书库烧了半间、柳德米拉迁到城外的地窖），两人仍是知己。
# 旗标：choice 设 c7_pair_ilona_ludmila_helped / _parasol / _apart；两个落点的 default 都设共享旗标 c7_pair_ilona_ludmila_confidants
#   （tie_extra_06_magdalena_ilona 第一章 variants 读）。together 的 variants 读 _parasol / _helped。不读外部旗标。
# 整合：cast/ties.toml 的 ilona_ludmila 由 lovers 改为 confidants，since 改为落点日 1576-06-30（或拆成 friends 1571-07-31 起、confidants 1576-06-30 起两段），
#   免得 1571 年 closer 的 friends 落在已是 confidants 的关系上。日程不必改：两人 1560—1590 都在布拉格；城外地窖仍按图书馆处理。

