# 四、选择：1576 年冬春，骑士团给伊洛娜开了价——交出图书馆里那个“东西”。
[[tracks.chapters]]
key = "pair_ilona_ludmila_choice"
title = "一页也要回来"
text = "伏尔塔瓦河边的酒馆快打烊了。伊洛娜推门进来，先看窗，再看我，脚跟抵住门槛：“别关门。……好，你就站那儿。”她从怀里摸出一张押条拍在桌上，是旧城图书馆的押条，柳德米拉的字：“十二页，银币一枚。”“他们找到我了。养大我的那个骑士团。”她说得很快，“条件是把图书馆里那个‘东西’交出去。交了，以前的账一笔勾销。”我问柳德米拉知不知道。“知道，我跟她说了。”伊洛娜把押条翻过来，背面一行小字，“她让我带给你看。”那行字写的是：“押金照收，书也照借。你们总是急。”“今晚她照样开门。”伊洛娜这才坐下，背贴着墙，刀放在手边，“你说，我怎么办。”"
