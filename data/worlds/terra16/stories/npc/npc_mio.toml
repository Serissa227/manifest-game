text = "关白殿下的停止令下来以后，能岛的过所旗就不作数了。平户的人说，一条家那位老姬君从此不挂旗，船照样出海，回来就坐在码头的石墩上看潮。孩子们管她叫“看潮的婆婆”，背着手学她的口气：“旗会旧，潮不会旧。”她记性好得很：木津川口那一夜，九鬼那边有条外来的船，炮口一整夜对着她的小早，那条船的样子她到今天还记得。有人跟她提起，她把扇子在手心里一敲：“下回海上见了——再来一局。”"

[[tracks.chapters.variants]]
key = "ryukyu"
when = [{ kind = "flag", flag = "c13_npc_mio_ryukyu" }]
text = "关白殿下的停止令下来以后，能岛的过所旗就不作数了。那位一条家的老姬君去了那霸，那边的海还认得旧旗。琉球的船每回来平户，都捎来她一两句话，有一回只有一句：“那霸的潮比下田的软。”码头上的孩子们没去过下田，也没去过那霸，天天争哪边的潮软，争到滚在沙滩上打成一团。"


