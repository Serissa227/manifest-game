[[tracks.chapters.variants]]
key = "mate"
when = [{ kind = "flag", flag = "c13_npc_mio_mate" }]
text = "关白殿下的停止令下来以后，能岛的过所旗就不作数了。平户的孩子们好些日子没见那位一条家的老姬君坐在码头上看潮，跑去问大人。码头上的人朝港外一指，指的是你的船：她如今在那条船上替你看潮。孩子们追到栈桥尽头，只看见桅顶上系着一截红白的绳子，在风里一甩一甩。一个孩子冲着帆喊：“看潮的婆婆，回来教我们认浪！”"

[[tracks.chapters.variants]]
key = "rival"
