[[tracks.chapters]]
key = "s04_tojima"
title = "户岛的木十字"
text = "宇和海来的渔船捎来消息：户岛上的一条殿过世了。岛上的渔家不会念南蛮的经，就照他活着时比划过的样子，削了两根木头钉成十字，插在坟头。他的姐姐从平户赶回土佐，还是晚了三天。那天夜里，她在下田河口的沙洲上点了一盏灯，自己坐在旁边的船上守着。下田的老船夫说：“灯放在沙洲上，潮来了两回都没带走。”天亮，灯油烧干了，她才撑船走了。"
