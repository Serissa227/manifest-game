[[tracks.chapters]]
key = "s00_gate"
title = "下田的姬君"
text = "正月里，下田河口的鱼干摊前围着一圈人，说的都是御所那位大姬君：从京里回来了，开春要驾一条小早出河口，替能岛卖旗，替大名跑官位。卖鱼干的老汉把一串鲷鱼干挂上绳子，说她拨算盘比街口算命的掐指头还快。“一条家那位姬君，旗钱一文不让，”他压低了嗓子，“可谁家的船出了事，她头一个去捞。”"
stage = "rumor"
window = [[1557, 1, 2], [1557, 1, 6]]
at = "shimoda_tosa"
cast = ["mio"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c12_voyage_mio", value = false }, { kind = "flag", flag = "upbringing_graduated" }]
news = "下田的鱼干摊上都在说，御所的大姬君开春要驾小早出海，替能岛卖旗，算旗钱比算命的还快。"

[tracks.chapters.default]
