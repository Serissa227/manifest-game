[[tracks.chapters]]
key = "m1_pass"
title = "一面过所旗"
text = "下田的栈桥上铺着一张草席，几面叠好的旗压在一块圆石头底下，旗角露出半方能岛的印。一条家的姬君盘腿坐在席子后头，扇子插在腰带里，左手拨算盘，右手捏着一条晒干的鲷鱼，咬一口，拨一珠。我的船要进濑户内海，来岛那段水道，不挂这面旗的船十条要被拦下九条。我开口问价，她没抬头：“吃水几尺？”我报了数。她这才看了我的船一眼，从桅顶看到水线，把算盘往前一推：“行，过得去。旗钱，先付。”旁边一条大商船的船主也挤过来问，她摆摆手：“你那船进来岛要搁浅，给你旗也是送你上礁。不卖。”船主骂骂咧咧走了，她接着啃鱼干。我问能不能便宜些，她总算笑了：“砍价？可以。砍一句，我加一句。”"
