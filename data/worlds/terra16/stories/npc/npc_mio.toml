# NPC 线：一条澪——一条家的船（故事 2.0，A5 / E37 契约）
# 标签：NPC 线（澪不是玩家主角时才跑）。玩家在交汇旁轨里是“我”，不写玩家的性别、外貌与出身；脊轨是下田、堺、平户码头上的街谈巷议。
# 轨道：npc_mio（脊轨，auto，rumor 六章，门槛章 s00 写身份）+ 交汇旁轨 npc_mio_pass、_goto、_court、_tides（s00 打开）、_watari（s01 打开）、_kizugawa（s02 打开）、_embassy（s03 打开）、_edict（s04 打开）；旁轨 auto=false，每条一章，有 at、有期限，超时静默失败。
# 依据：史实——土佐一条兼定 1568 年伊予之败、1574 年出奔丰后、受洗、1575 年渡川（四万十川）之战、流亡伊予户岛、1585 年死于户岛；1557 年前后王直的船队在平户；能岛村上家卖过所旗、收帆别钱；1578 年第二次木津川口九鬼家的大船；1581 年京都马揃与信长身边的弥助；1582 年天正遣欧使节自长崎出发；1588 年海贼停止令；长府忌宫的满珠、干珠两岛与海上遥拜。
#   原创——澪的过所旗生意与草席摊、平户木桶上的谈价与木印假旗、茶屋楼上改书状、遥拜图的摹本、渡川前夜的借贷、木津川口那一夜的两边、弥助托的信与小铜铃、平户空旗杆的小早、“看潮的婆婆”。
#   兼定的姐姐、乳母家的过所旗都是原创人物线上的事；伊东满所与澪的亲缘照主线（妹妹阿喜多的婆家）只说“婆家那边的孩子”。
# 待核（正文一律传闻或人物口吻）：兼定受洗与渡川的确切月份；户岛上木十字的说法；马揃那天弥助与澪的相遇（原创）；会院邮包的季节。
# 日程（cast 已登记）：1557—1575 中村（内陆，不可达：场面放在下田，正文写她从中村顺流下来或来下田办事）；1576—1582 能岛；1583—1590 平户。npc_mio_edict 的 ryukyu 选项把她改到那霸，到 1590-12-31。
# 口吻与秘密：澪话短、爱抢话、好胜，谈旗钱寸步不让，先问“吃水几尺”再说价；京都腔只在 m3 宫里的事上露一下。口头禅“旗钱，先付。”只在 m1_pass 用一次；“再来一局。”只在 s05 的 rival 变体用一次。
#   NPC 线永远不揭开父亲之死与补陀落的志向；见闻里不写任何秘密；弥助与巴拉卡的往事不点破，信的内容不写。
# 恋爱：不用 heart / relation / tie / bond 效果；招募（m8 join）只是请一位航海士上船。历史人物只写史料里的友情与合作；伊东满所十三岁，只写送行。
# 读的共享旗标：c12_voyage_mio（=false，澪不是玩家）、upbringing_graduated；c13_main_lin_wandeng（=false，m2 排除林晚灯）；c13_main_baraka（=false，m7 排除巴拉卡；s03 照跑，它是 main_baraka c05_yasuke_letter 的信源）；h44_shimanto_ichijo_holds_hata（C10，s02、s04 变体）；item chart_japan_inland（m4）。
# 设的旗标：c13_npc_mio（s00）；c13_npc_mio_pass（m1 → m6 变体）；c13_mark_tides（m4，印记一局只发一次）；c13_npc_mio_watari_help（m5 → s02 变体；C10 可作 H44 杠杆钥匙）；c13_npc_mio_rival（m6 → s05 变体）；c13_npc_mio_yasuke_letter（s03 → main_baraka c05_yasuke_letter 的变体）；c13_npc_mio_mate / _ryukyu（m8 → s05 变体；_mate 另由 main_noel_roster r3 的变体读）。
# 结尾的优先级：s05 变体 mate > ryukyu > rival > 缺省。引擎按变体 key 的字母序取第一个满足的（mate < rival < ryukyu），所以 rival 变体的条件里加了 c13_npc_mio_ryukyu=false，保证她去了那霸时显示 ryukyu。
#   s02 的变体：both（守住幡多 + 借过东西）< held < helped，按字母序先取 both，两件事都发生时两句都在。
# 整合：upbringing_graduated 由引擎在结业时设（core upbringing/graduation.rs），故事里没有设置者，审计报“旗标没有来源”；须在 runtime_links 登记为引擎旗标或让校验认它，门槛不改。
# 等待的包：A8 / C11（第七级试炼读 emerald_mark_tides；mark_tides 发现物的许可流程定了以后，m4 可以加 discovery 目标）；A9（门槛章可加 protagonist 条件排除澪，届时 auto 改 false）；C10（h44_shimanto_ichijo_holds_hata 的 key 表；H44 杠杆可选读 c13_npc_mio_watari_help）。
# HIST 占位清单：h44_shimanto_ichijo_holds_hata（s02 变体：一条家守住幡多；s04 变体：兼定死在中村）。
# 回忆插画清单（mem-* 与画面描述）：
#   mem-npc_mio_tides「两座岛的摹本」：能岛关所的案上，炭笔描的两座小岛与白幡祭船，角上一个小小的“澪”字。

