[[tracks.chapters]]
key = "s01_iyo"
title = "一条家的船少了"
text = "这一年从下田出港的一条家的船，比往年少了一半。殿下在伊予吃了败仗，回来的船上躺满了伤兵。大姬君把自己的小早借给几个家在宿毛的伤兵，让他们划回去见老娘，她自己在栈桥底下蹲了一整个夏天，跟船匠一块儿敲钉子、刮船底，两只手泡得全是桐油味。有人问那条小早几时还回来，栈桥上的船匠替她答了：“姬君说，船是借出去的，又不是送出去的。”"
stage = "rumor"
window = [[1568, 6, 1], [1568, 12, 31]]
at = "shimoda_tosa"
cast = ["mio", "ichijo_kanesada"]
mood = "sad"
news = "下田的栈桥上说，一条家的大姬君把小早借给伊予回来的伤兵，自己蹲在岸上修了一夏天的船。"

[tracks.chapters.default]
next = "s02_watari"
effects = [{ kind = "start_track", track = "npc_mio_watari" }]

[[tracks.chapters]]
key = "s02_watari"
title = "渡川口的小早"
text = "渡川一仗打完，一条家的兵散了，殿下渡海去了伊予的户岛。下田的人说，开仗那天，大姬君的小早在河口横了一整天，水里漂着谁就捞谁，捞上来的有穿一条家号衣的，也有背着酢浆草旗印的。河口的渔夫说：“她捞人不看旗。捞上来的长宗我部的兵，后来还给她磕了头。”开春，她把小早撑出河口，往能岛去了。"
stage = "rumor"
window = [[1575, 11, 1], [1576, 2, 28]]
at = "shimoda_tosa"
cast = ["mio", "ichijo_kanesada", "chosokabe_motochika"]
mood = "sad"
news = "渡川一仗以后，一条家的大姬君把船开去了能岛，下田的人说，河口那一天是她的船在捞人。"

[tracks.chapters.default]
next = "s03_letter"
effects = [{ kind = "start_track", track = "npc_mio_kizugawa" }]

[[tracks.chapters.variants]]
key = "both"
when = [{ kind = "flag", flag = "h44_shimanto_ichijo_holds_hata" }, { kind = "flag", flag = "c13_npc_mio_watari_help" }]
text = "渡川一仗打完，长宗我部的人马退回了河东，一条家守住了幡多，殿下回了中村。下田的人说，开仗那天，大姬君的小早在河口横了一整天，水里漂着谁就捞谁。河口的渔夫说：“她捞人不看旗。捞上来的长宗我部的兵，后来还给她磕了头。”渔夫还说，开仗前一夜她上过一条远来的船；那天河口用上的东西，有那条船的一份。家里刚打赢，开春她还是把小早撑去了能岛。有人问她走什么，她说：“土佐的事有弟弟，内海的事得有人。”"

