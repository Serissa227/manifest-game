text = "中村顺流下来的船捎来消息：一条殿死在御所里了。那天河上撑渡船的，篙头都缠了一截白布。他的姐姐从平户赶回土佐，还是晚了三天。那天夜里，她在下田河口的沙洲上点了一盏灯，自己坐在旁边的船上守着。下田的老船夫说：“灯放在沙洲上，潮来了两回都没带走。”天亮，灯油烧干了，她才撑船走了。"

[[tracks.chapters]]
key = "s05_after"
title = "旗以后"
text = "关白殿下的停止令下来以后，能岛的过所旗就不作数了。平户的人说，一条家那位老姬君从此不挂旗，船照样出海，早上出去，傍晚回来，回来就坐在码头的石墩上看潮。码头上的孩子们都管她叫“看潮的婆婆”，一群跟在她后头学认浪。一个孩子学着她的口气，背着手说：“看潮的婆婆说，旗会旧，潮不会旧。”"
stage = "rumor"
window = [[1589, 6, 1], [1590, 6, 30]]
at = "hirado"
cast = ["mio"]
mood = "tender"
news = "平户的人说，一条家的老姬君不挂旗了，船照样出海，孩子们管她叫看潮的婆婆。"

[tracks.chapters.default]
