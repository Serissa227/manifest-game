text = "渡川一仗打完，一条家的兵散了，殿下渡海去了伊予的户岛。下田的人说，开仗那天，大姬君的小早在河口横了一整天，水里漂着谁就捞谁，两家的号衣都有。河口的渔夫说：“她捞人不看旗。捞上来的长宗我部的兵，后来还给她磕了头。”渔夫还说，开仗前一夜，她上过一条远来的船，下来时脚步快得像跑；那天河口用上的东西，有那条船的一份。开春，她把小早撑去了能岛。"

[[tracks.chapters]]
key = "s03_letter"
title = "弥助的信"
text = "从堺上京看马揃的人回来，在茶屋里讲了好几天：信长身边那个高个子的南蛮家臣，站在人堆里，旁人才到他肩膀，散场以后在柳树底下拦住了一条家的姬君，托她带一封信，带去很远的地方——东非一个叫基尔瓦的港口，交给一个金商的儿子。姬君问基尔瓦在哪边，那人朝西南指了指，手臂伸得笔直。她当场拿油纸把信裹了三层。茶屋老板说：“那个高个子说，信走一年两年都行，那边的人会等。”"
stage = "rumor"
window = [[1581, 4, 1], [1581, 9, 30]]
at = "sakai"
cast = ["mio", "yasuke"]
mood = "cheerful"
news = "堺的人说，信长身边那个高个子的南蛮家臣，托一条家的姬君带一封信去东非。"

