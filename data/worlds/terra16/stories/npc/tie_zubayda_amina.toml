# C7 配角线（重写，Claude）：tie_zubayda_amina「妹妹留下的白天」——遵循 A5 / E37 故事 2.0 契约。
# 标签：family（亲姐妹），归在 GL 名下的女性关系线；全线只写姐妹之情，不写恋爱、不写心动。
# 人物：祖贝达 zubayda（1540-01-01，女，取向 m，书商之女，守摊卖书）；阿米娜 amina（1538-04-10，女，不开放恋爱，抄书人）。
#   两人都是原创人物、爱资哈尔学院的同学；阿米娜 1556-04-10 满 18，祖贝达 1558 年才满 18——本线没有任何恋爱效果，年龄门禁不涉及。
# 依据：docs/TERRA16.md §12.11、§14.7；cast/classmates_cairo.toml 两人的 persona 与 secret；C7 总决定 §三、§五。
#   史实背景：奥斯曼治下（1517 年起）的开罗，爱资哈尔清真寺一带的书商与抄书行当；十六世纪埃及用纸多是经亚历山大港进口的意大利纸，
#   纸价随船期涨落；抄书人用芦苇笔、烟墨，撒细沙吸墨。
#   原创：姐妹二人与书摊、1554 年纸船晚到一个月（情节传闻，不对应具体史料）、爱资哈尔老师的注释抄本订单、也门来的老学者。
#   待核：1550 年代开罗市面上的意大利纸常见船锚水印（三弯月水印要到十六世纪末才多见，故不用）。
# 缺省走向（玩家什么也不做）：meeting（1554 春，抄书桌搬到窗下，设 sisters）→ turning（1554 秋，纸价传闻，祖贝达多接活）
#   → closer（1555 春夜，祖贝达自己看见姐姐凑着灯认字，挂出“夜里不接急活”）→ choice（1556 秋，祖贝达自己把老师的期限谈到五十天）
#   → landing（1557 春，三只钱袋，抄本署上抄书人的名字；sisters + 落点旗标 + 回忆）。玩家插手只改变那部抄本怎么接下，不改变落点。
# 旗标：设 c7_tie_zubayda_amina_helped、c7_tie_zubayda_amina_mediated（choice 的两个选项）、c7_tie_zubayda_amina_landing（落点 default）；不读外部旗标。
# 秘密：阿米娜的眼睛只写在正文、选项与回复里，见闻（news）一律不写；巴拉卡的残本归祖贝达的羁绊线，本线不提。
# 整合：cast/ties.toml 的 zubayda_amina 由 friends 改为 sisters；日程不变（两人 1557 年起都在开罗的书摊）。

