[[tracks.chapters]]
key = "tie_zubayda_amina_meeting"
title = "灯油又用完了"
text = "灯芯噗地一跳，灯油又见了底。祖贝达把空油壶倒过来甩了甩：“客人明天一早就来取！还剩几页？三页——你一晚上才抄了一页半。”阿米娜没抬头，拿针把灯芯挑高一点，火苗亮了一下：“墨还没干，谁也别翻这一页。”祖贝达一把抽走刚抄好的那页，捏着两个角在灯上扇。扇到一半，她看见姐姐揉了一下眼睛，蘸墨，又揉一下，笔尖悬在纸上，揉到第三回才落笔。她把那页搭上晾绳，一句话也没说，去隔壁借了半壶油。书晚交了半天，客人翻了几页，看不出哪几页是天亮以后抄的。当天下午，祖贝达把里屋那张抄书桌拖到了临街的窗下，桌腿在门槛上磕掉一块漆。"
stage = "witness"
window = [[1554, 1, 15], [1554, 4, 30]]
at = "cairo"
cast = ["zubayda", "amina"]
speaker = "zubayda"
mood = "cheerful"
news = "开罗书商街有家书铺把抄书桌拖到了临街的窗下，姐姐抄书、妹妹守摊，听说一个月的灯油省了一半。"

[tracks.chapters.default]
