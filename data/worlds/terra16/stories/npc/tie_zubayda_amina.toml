[[tracks.chapters]]
key = "tie_zubayda_amina_turning"
title = "贵起来的纸"
text = "书商街这阵子三句话不离纸。亚历山大港的纸船晚到了一个月，纸铺门口的价钱早上一个样，过了晌午又是一个样。有人说法兰克人的纸越做越薄，有人说港口的税吏又加了一成。书铺家的小女儿一天跑了五家纸铺。卖纸的说，她把一张纸举到太阳底下，船锚水印后面就是他的脸：“薄成这样，我都看得见你在笑，还好意思要这个价？”傍晚她抱回一刀最便宜的，脸比纸还白。邻居隔着窗听见她姐姐慢吞吞地说：“薄纸吃墨，我写慢些就是。”第二天，书摊边上多挂了一块木板：收抄书的活，价钱好商量。"
stage = "rumor"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "cairo"
cast = ["zubayda", "amina"]
mood = "tense"
news = "开罗书商街的纸价一天一个样，听说亚历山大港的纸船晚到了一个月；书铺家的小女儿跑了五家纸铺，只抱回一刀最薄的。"

[tracks.chapters.default]
next = "tie_zubayda_amina_closer"
effects = []

[[tracks.chapters]]
key = "tie_zubayda_amina_closer"
title = "少接的夜活"
text = "法官家的书童来问，退回去的那份急活还能不能再接。祖贝达这才知道，三份夜里赶工的活早退了，定钱也还了回去。她当着书童的面就数落开了：“三份！我磨了半个月嘴皮子才接来的，你一声不吭全退了？纸钱谁补？要躲懒也挑个日子！”阿米娜没辩，把手上那一页抄完，撒上一把细沙吸墨，才抬起头：“退了。灯油贵。”半夜祖贝达起来喝水，窗下的灯还亮着。姐姐把一页纸举到离灯一寸的地方，嘴唇跟着动，一个字一个字地认。祖贝达端着水罐站了一会儿，回去躺下了。第二天，摊边那块木板上，“收抄书的活”底下添了一行：“夜里不接急活。”有客人嫌慢，说了一车好话想加塞，她拍了拍木板：“缺哪页，先写在头一页上。好话省着，要快的去别家。”"
stage = "witness"
window = [[1555, 3, 1], [1555, 6, 30]]
at = "cairo"
cast = ["zubayda", "amina"]
speaker = "amina"
mood = "tender"
night = true
news = "开罗书商街有个书摊在木板上添了一行字：夜里不接急活。有人嫌慢，卖书的小女儿把木板一拍，说要快的去别家。"

