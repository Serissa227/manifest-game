news = "爱资哈尔那位老师订的注释抄本，开罗书商街的祖贝达磨了两个下午，磨到五十天才接；她家书摊如今天黑一个时辰才收，姐姐只在白天抄。"

[[tracks.chapters.choices]]
key = "daylight_buyer"
text = "我去爱资哈尔问问，有没有肯等六十天的买主。"
reply = "我在爱资哈尔的回廊里问了三天，问到一位从也门来的老学者。他听说要等六十天，捋着胡子笑了：“这部注我等了二十年，不差这二十天。”祖贝达去把老师那张单子退了，回来一路念叨少赚了多少纸钱。两个月后，阿米娜抄完最后一页，在页尾写下自己的名字，字写得很小，像怕人看见。"
next = "tie_zubayda_amina_landing"
