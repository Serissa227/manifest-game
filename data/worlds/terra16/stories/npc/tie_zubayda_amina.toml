[[tracks.chapters.choices]]
key = "tell_her"
text = "对阿米娜说：眼睛的事，该由你告诉她。"
reply = "阿米娜看了我一眼，转过身对着妹妹，只说了一句：“天黑以后，我看不清字了。”祖贝达半天没出声。那一夜灯前的样子她见过，可话从姐姐嘴里出来，还是头一回。她把老师的单子撕成两半，另铺开一张纸：“那就六十天。谁嫌慢，谁去别家。”"
next = "tie_zubayda_amina_landing"
effects = [{ kind = "flag", flag = "c7_tie_zubayda_amina_mediated" }, { kind = "affinity", person = "zubayda", value = 3 }, { kind = "affinity", person = "amina", value = 3 }]

[[tracks.chapters]]
key = "tie_zubayda_amina_landing"
title = "姐妹各得一份"
text = "月底，祖贝达把一个月的进账倒在柜台上，拨成三堆：“姐姐的工钱，我的工钱，家用。”阿米娜把中间那堆推回去一半：“守摊坐着收钱，算什么工。”“那抄书人的眼睛算不算本钱？”祖贝达又把那一半推回来，“这两年你那双眼睛，我是按本钱记的账。”钱推了三个来回，一个子儿也没挪地方。最后三堆钱各装进一只布袋，阿米娜那只的袋口缝了一道蓝线，好认。从那部注释抄本起，姐姐抄的书，页尾都多了一行小字：抄书人阿米娜。"
stage = "witness"
window = [[1557, 3, 1], [1557, 6, 30]]
at = "cairo"
cast = ["zubayda", "amina"]
speaker = "zubayda"
mood = "cheerful"
news = "开罗书商街那对姐妹如今月底分三只钱袋；听说姐姐抄的书，页尾都写上了抄书人的名字。"

