[[tracks.chapters]]
key = "tie_zubayda_amina_choice"
title = "替谁留好时辰"
text = "爱资哈尔的一位老师在书摊上留下一张单子：一部注释抄本，四十天交，给的钱够买一年的纸。祖贝达在柜台上算了三遍，每一遍都算出夜工来：“白天抄到日落，夜里再点两个时辰的灯，就这一回。四十天，能成。”阿米娜把单子拿过去看了看，放回柜台上，指了指摊边那块写着“夜里不接急活”的木板：“白天抄得完。六十天。”“六十天？老师早找别家去了！”“那就让他找。”两人一个在摊子里，一个在摊子外，僵着不动，过路的学生都绕着走。祖贝达把单子往我面前一推：“你说，接还是不接？”"
stage = "involve"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "cairo"
cast = ["zubayda", "amina"]
speaker = "zubayda"
mood = "tense"
news = "爱资哈尔的一位老师订了一部注释抄本，开罗书商街那对姐妹为了接不接，隔着书摊吵了一个下午。"

[tracks.chapters.default]
next = "tie_zubayda_amina_landing"
