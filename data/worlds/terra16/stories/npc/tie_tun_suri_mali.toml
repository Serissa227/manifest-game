# —— 转折：1569 年大城陷落，北大年的传闻 ——
[[tracks.chapters]]
key = "tie_tun_suri_mali_turning"
title = "往南的脚印"
text = "大城陷落的消息顺着海岸往南传。北大年河口的渔夫说，前些天从北边走下来一头母象，牵象的是个暹罗女人，草鞋都磨穿了。她自己走在象前头，象背上只驮着一袋米和三个孩子，说是大城象厩里的。有个识字的渔夫凑过去看那袋米。袋口缝着一行马来字，他念了两遍，念不成句：“缝错了一个字。”牵象的女人把米袋往怀里拢了拢，声音低得像在哄象：“马来字缝的暹罗话，问疼不疼的。错的那个字，我认得。”她在河边住了下来，挨条船去问，问了半个月，没有一条船肯装一头象。"
stage = "rumor"
window = [[1569, 8, 20], [1569, 10, 31]]
at = "pattani"
cast = ["tun_suri", "mali"]
mood = "sad"
news = "北大年的渔夫说，有个暹罗女人牵着母象从北边走来，象背上驮的是大城象厩里的三个孩子。"

[tracks.chapters.default]
next = "tie_tun_suri_mali_choice"
effects = []

# —— 抉择：北大年，一封来信 ——
[[tracks.chapters]]
key = "tie_tun_suri_mali_choice"
title = "不是借兵"
text = "柔佛的商船捎来一封信。玛莉不识马来字，找到我，请我念给她听。信里一个字没提国事，只写柔佛河口哪块高地干、哪块涨潮会淹，象睡在哪儿，夜里不怕水漫上来。最后一行是用马来字拼的暹罗话：“疼不疼？”玛莉听完，点了点头：“这回拼对了。”她把信折好，塞进米袋。母象怕水，站在河滩上，不肯朝小船再走一步。港里倒有人出价：把象卖进宫里的象队，船钱就有了，还有剩。玛莉摸着象耳朵，声音压得很低：“它是驮孩子的，不是驮兵的。”三个孩子蹲在象腿边上，都抬头看着我。"
stage = "involve"
window = [[1569, 11, 1], [1570, 1, 31]]
at = "pattani"
cast = ["tun_suri", "mali"]
speaker = "mali"
mood = "tense"
news = "北大年港有个暹罗女人挨船打听，哪条船装得下一头怕水的母象和三个孩子，到今天还没问着。"

[tracks.chapters.default]
next = "tie_tun_suri_mali_landing"
