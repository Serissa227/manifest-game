[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_tie_tun_suri_mali_helped" }]
text = "船比走陆路早到了两个多月。母象踩着跳板下到浅水里，玛莉骑在它脖子上，一路贴着它的耳朵哼歌；三个孩子跳下船，脸都是圆的，没有一个生病。敦·苏丽站在齐膝深的水里，仰着头说：“先下来。”玛莉滑了下来。王女先伸手摸象肚子边那道旧鞍伤，早结了疤；再看人：“疼不疼？”这回一个音也没念歪。“晕。四天的船，吐了三天。”王女吩咐随从先给孩子煮饭，自己扶着她的胳膊，一步一步走上高地的树荫。随从在后头咳嗽，她红着脸，手没松：“往后哪里难受，先跟我说。”“在船上吐的时候，”玛莉说，“就想着你这一句。”那天夜里，两人在高地上立起第一间象厩。母象侧身躺下，打起鼾来；她们坐在新铺的草上，听了一整夜。"

[[tracks.chapters.variants]]
key = "stable"
when = [{ kind = "flag", flag = "c7_tie_tun_suri_mali_stable" }]
text = "母象走了三个月，才踩上柔佛河口的泥滩。高地上，象厩的四根柱子早立好了，每根柱上都用马来字刻着同一句暹罗话——当年在大城，玛莉一个字一个字教王女的那句。玛莉不识字，可那个样子她认得：米袋口上缝过，信尾写过。这回是敦·苏丽站在象下，仰着头说：“先下来。”玛莉滑了下来。王女先摸象的旧鞍伤，再看人：“疼不疼？”玛莉说：“脚疼。”王女蹲进泥里，去解她的草鞋，随从在后头咳嗽也不管：“往后哪里疼，先跟我说。”“走了三个月，”玛莉低头看着她，“就等你这一句。”那天夜里，两人给四根柱子搭上了顶。母象侧身躺下，打起鼾来；她们坐在新铺的草上，听了一整夜。"

# —— 尾声：1587 年柔佛旧都被攻破，随王廷迁往上游（缺省即圆满）——
[[tracks.chapters]]
key = "tie_tun_suri_mali_epilogue"
title = "一起迁上游"
text = "葡萄牙人攻破柔佛旧都那年，王廷沿河往上游撤，走在最前头的是象厩。当年那头母象早不在了，驮东西的是它的女儿。玛莉先爬上河岸看地，蹲下摸了摸土，又看象的耳朵：“这块高，它肯睡。”敦·苏丽跟在后头铺草。新来的随从问起旧事：十三年前，王女是不是差点跟扎巴拉女王的船队去打马六甲？“差一点。”玛莉慢慢说，“殿下在码头上喊得比谁都响，是我把她拽回来的。”“人家女王自己都没随船。”敦·苏丽红着脸，手里的草没停，“我去做什么。”草铺好了，她拿炭在象厩的木柱上写粮单：几袋米，几篓盐，几张嘴。末一行照旧是那句：“想回去，先让同行的人吃饱。”"
stage = "witness"
window = [[1587, 9, 1], [1587, 12, 31]]
at = "johor_port"
cast = ["tun_suri", "mali"]
speaker = "mali"
mood = "sad"
news = "柔佛旧都破了，王廷往上游迁。走在最前头的是象厩：一头母象领路，那两个女人跟在后头，一个看地，一个铺草。"

