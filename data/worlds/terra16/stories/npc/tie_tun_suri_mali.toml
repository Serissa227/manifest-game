# C7 重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GL（恋爱线；两人都是纯 GL）。
# 人物：敦·苏丽 tun_suri（1533-01-10，马六甲流亡王廷的王女，住柔佛）× 玛莉 mali（1534-02-15，大城象厩的驯象师）；生年差一年。
#   恋人效果在 1570-02-01 起的落点章：敦·苏丽 37 岁、玛莉 35 岁。
# 依据：
#   史实——1563 年东吁的莽应龙向大城索要白象，引出 1563—64 年的白象之战；1569 年 8 月大城陷落；
#         1574 年扎巴拉（日巴拉）的卡林亚玛特女王派舰队围马六甲，女王本人没有随军；1587 年葡萄牙人攻破柔佛旧都，王廷迁往上游。
#   原创——两人的相遇、那头母象和它的女儿、象厩里的三个孩子、用马来字拼写的暹罗话“疼不疼”（米袋、来信、象厩柱子）。
#   待核——大城陷落的确切日子有八月上旬、下旬两说，正文不写日子；1587 年王廷迁去的上游地点，正文只写“上游”。
# 缺省走向：1563 相识，成为朋友 → 1569 大城陷落，玛莉牵象南逃，困在北大年（传闻）→ 没人插手时，她牵象沿半岛走三个月到柔佛
#   → 1570 年在柔佛河口成为恋人（落点，缺省即发生）→ 1587 年随王廷迁往上游（尾声，圆满）。
#   玩家能做的：派船（母象与孩子早到两个多月，旗标 helped）或先去柔佛谈下象厩的地（柱子先立好，旗标 stable）；都不改变结局。
# 设旗标：c7_tie_tun_suri_mali_helped、c7_tie_tun_suri_mali_stable（落点章 variants 读）、c7_tie_tun_suri_mali_together、c7_tie_tun_suri_mali_upriver。
#   不读外部旗标。
# 整合：cast/ties.toml 的 tun_suri_mali 静态恋人 since 由 1569-12-31 对齐到落点 1570-02-01；无日程改动。

