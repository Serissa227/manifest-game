[[tracks.chapters.choices]]
key = "stable_land"
text = "先去柔佛，替王女把河口那块高地谈下来做象厩。"
reply = "地主张口要的价，够再买一头象。我陪他嚼了一下午槟榔，压下一半。敦·苏丽当场折了根树枝，在地上画出象厩的四根柱子，画完才停住，脸一下红了：“价钱……我还没问玛莉合不合她的意。”当晚她又写了一封信去北大年，末尾还是那一句。"
next = "tie_tun_suri_mali_landing"
news = "柔佛河口那块高地叫人谈下来了，价钱压掉一半，听说是给一头还在北大年的母象盖象厩。"
