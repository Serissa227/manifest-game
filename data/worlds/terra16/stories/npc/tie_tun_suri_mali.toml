# —— 落点：1570 年柔佛河口（缺省即发生）——
[[tracks.chapters]]
key = "tie_tun_suri_mali_landing"
title = "河口的高地"
text = "母象走了三个月，踩上柔佛河口的泥滩时，耳朵软软地耷拉着，累透了。玛莉骑在它脖子上，三个孩子趴在她身后的米袋上。这回是敦·苏丽站在象下，仰着头说：“先下来。”玛莉滑了下来。王女先伸手摸象肚子边那道旧鞍伤，早结了疤；再看人：“疼不疼？”这回一个音也没念歪。“脚疼。”王女回头吩咐随从先给孩子煮饭，自己蹲进泥里，去解玛莉的草鞋。随从咳嗽了一声，她红着脸，手没停：“往后哪里疼，先跟我说。”“走了三个月，”玛莉低头看着她，“就等你这一句。”那天夜里，两人在高地上立起第一间象厩。母象侧身躺下，打起鼾来；她们坐在新铺的草上，听了一整夜。"
stage = "witness"
window = [[1570, 2, 1], [1570, 6, 30]]
at = "johor_port"
cast = ["tun_suri", "mali"]
speaker = "tun_suri"
mood = "tender"
news = "柔佛河口来了一头暹罗母象。王女连夜在高地上给它搭象厩，牵象的暹罗女人陪着她，一夜没睡。"

