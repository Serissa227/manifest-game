# —— 相识：1563 年大城象厩 ——
[[tracks.chapters]]
key = "tie_tun_suri_mali_meeting"
title = "先下来"
text = "缅甸的莽应龙派人来大城要白象，宫里吵成一团，没人腾得出手见柔佛来的王女敦·苏丽，就把她领进了象厩。她坐在一头母象背上，隔着栏杆跟通事讲借兵、讲粮船，讲到一半，缰绳被人一把攥住。“先下来。”驯象师玛莉的声音又低又慢，“鞍带勒的伤还没好。它也怕，你先别喊。”王女脸一红，话断在半截，还是顺着象腿滑了下来。她弯腰去看象肚子底下那道磨破的皮，学着通事教的暹罗话问它：“疼不疼？”有一个音念歪了，听着像在问它饿不饿。玛莉笑出了声，一个字一个字教她重念。援兵没借到。王女走那天，象厩门口多了一袋米，袋口用马来字缝着那句“疼不疼”，拼的还是她念歪的那个音。"
stage = "witness"
window = [[1563, 5, 1], [1563, 10, 31]]
at = "ayutthaya_port"
cast = ["tun_suri", "mali"]
speaker = "mali"
mood = "cheerful"
news = "大城象厩的驯象女把柔佛来的王女从象背上叫了下来，说母象的鞍伤还没好；王女红着脸，还真照办了。"

[tracks.chapters.default]
