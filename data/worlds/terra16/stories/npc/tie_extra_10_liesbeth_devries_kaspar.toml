text = "十月，卡斯帕把莉斯贝特拉进码头的酒馆，坐下先立规矩：“今天不许谈银子。”找回的零钱刚到手，她已经举到灯下转着看边。他敲了一下桌子。面包上来，她还在说掺了铜的银搁久了会发红。他敲第二下。第三回她刚张嘴说“证词那页我想再加一行”，他的指节落下去，碗里的汤都晃了。吃到一半，他从炉边摸来一截炭条，在桌布上画起城里的街：这条巷子通河，那道门夜里不锁。格里特端着汤过来，低头看了一眼：“又画。这块布记你账上。”他头也不抬。线是抖的，路口一个没漏。“先找退路，再摆炮。你记着。”莉斯贝特看了很久，没去找夹具，把桌布叠起来，收进了口袋。"
