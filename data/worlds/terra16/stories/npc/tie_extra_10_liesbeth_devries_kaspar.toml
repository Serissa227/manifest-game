# 靠近：分开钱袋，年轻兵洗清罪名。
[[tracks.chapters]]
key = "tie_extra_10_liesbeth_devries_kaspar_closer"
title = "分开的钱袋"
text = "兵站送来的钱袋混作一堆，袋口的名签早磨掉了。卡斯帕站在窗边，朝院子里候着的兵看一眼，就把袋子和人对上：“靠墙那个，头一礼拜没吃过热饭，这袋轻的是他的。”莉斯贝特捏着钱边对着窗光转：“锉过。没锉。锉过。”兵站的文书把一个年轻兵推到桌前：“他袋里的全是锉薄的，就是他干的。”卡斯帕看了孩子一眼：“不像。锉边得手稳，他连帽子都攥不住。”“我验完以前，谁的话都不算数，”莉斯贝特头也不抬，对文书说，“包括你的。”她再倒出九袋，锉痕全是同一把锉子留的，深浅一个样，发饷以前就锉好了。“不是他。”帽子掉在地上，卡斯帕弯腰捡起来，拍了拍灰，塞回孩子手里。"
stage = "witness"
window = [[1576, 1, 15], [1576, 5, 31]]
at = "antwerp"
cast = ["liesbeth_devries", "kaspar"]
speaker = "kaspar"
mood = "tense"
news = "安特卫普铸币所的女试金师和一个老炮手把军饷一袋袋分开，替一个年轻兵洗清了锉币的罪名。"

