# 转折（传闻）：国王又停付，钱袋一袋袋送进试金房。
[[tracks.chapters]]
key = "tie_extra_10_liesbeth_devries_kaspar_turning"
title = "又停付了"
text = "码头酒馆里这几天只说一件事：国王又停付了，银行家把门一关，城堡里的西班牙兵一年多没拿过全饷。眼下发下来的钱，听说一袋里总混着几枚被锉薄的旧币。当兵的骂铸币所，铸币所的人骂兵站。前天有人在兵站门口看见铸币所那个戴白麻帽的女试金师，嗓门大得半条街都听见：“没上过秤的钱，我一个字也不替它担保！”她身边站着个半聋的老炮手，凑近她耳朵说：“先验，骂的话留到晚上。”她闭了嘴。第二天起，兵站的人拎着钱袋，一袋接一袋往试金房里送。"
stage = "rumor"
window = [[1575, 9, 15], [1575, 12, 31]]
at = "antwerp"
cast = ["liesbeth_devries", "kaspar"]
mood = "tense"
news = "西班牙国王又停付了，安特卫普兵站发的军饷里混着被锉薄的旧币；兵骂铸币所，铸币所骂兵站，钱袋一袋袋往试金房里送。"
rumor_days = 60

