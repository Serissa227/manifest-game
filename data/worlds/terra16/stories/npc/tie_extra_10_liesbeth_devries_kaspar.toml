[[tracks.chapters.choices]]
key = "deliver_testimony"
text = "把证词送到城里的议会，当面交给管军饷的人。"
reply = "管军饷的官员当着我的面把证词从头看到尾，抬头问：“十枚里三枚？谁验的？”莉斯贝特的名字他念了两遍，把纸收进柜子，上了锁：“我会报上去。”出了市政厅，卡斯帕说：“至少有人收了。”莉斯贝特说：“收是收了，看了没有？”那天晚上，铸币所的窗子比平时早暗了一个钟头。"
next = "tie_extra_10_liesbeth_devries_kaspar_landing"
news = "安特卫普市政厅管军饷的官员收下了铸币所女试金师的一份证词，说是要报上去；至于他看了没有，酒馆里的人拿不准。"
effects = [{ kind = "flag", flag = "c7_tie_extra_10_liesbeth_devries_kaspar_helped" }, { kind = "affinity", person = "liesbeth_devries", value = 5 }]

[[tracks.chapters.choices]]
key = "read_aloud"
text = "在码头酒馆里把证词念给当兵的听。"
reply = "我站上长凳，一页念完，满屋没人出声。先动的是个独眼的老兵，一把钱拍在桌上：“验这个。”接着是第二个、第三个。莉斯贝特骂我不先打声招呼，手上已经打开秤盒，铺开手巾，一枚一枚验到钟敲十二下。卡斯帕背靠门板站着，有人想挤进来，他只说一句：“排队。”"
next = "tie_extra_10_liesbeth_devries_kaspar_landing"
news = "安特卫普码头酒馆里有人把铸币所的军饷证词念给当兵的听，念完，几个老兵把钱拍在桌上，要女试金师当场验。"
effects = [{ kind = "flag", flag = "c7_tie_extra_10_liesbeth_devries_kaspar_read" }, { kind = "affinity", person = "kaspar", value = 5 }]

# 落点：桌布上的退路。
[[tracks.chapters]]
key = "tie_extra_10_liesbeth_devries_kaspar_landing"
title = "一顿不谈银子的饭"
text = "十月，卡斯帕把莉斯贝特拉进码头的酒馆，坐下先立规矩：“今天不许谈银子。”找回的零钱刚到手，她已经举到灯下转着看边。他敲了一下桌子。面包上来，她还在说掺了铜的银搁久了会发红。他敲第二下。第三回她刚张嘴说“证词那页我想再加一行”，他的指节落下去，碗里的汤都晃了。吃到一半，他从炉边摸来一截炭条，在桌布上画起城里的街：这条巷子通河，那道门夜里不锁。线是抖的，路口一个没漏。“先找退路，再摆炮。你记着。”莉斯贝特看了很久，没去找夹具。她在盘子底下压了一枚验过的钱，把桌布叠起来，收进口袋。"
stage = "witness"
window = [[1576, 9, 16], [1576, 10, 31]]
at = "antwerp"
cast = ["liesbeth_devries", "kaspar"]
speaker = "kaspar"
mood = "tender"
news = "安特卫普码头的酒馆里，老炮手在桌布上画了一张城里的街，女试金师把桌布带走了。"

