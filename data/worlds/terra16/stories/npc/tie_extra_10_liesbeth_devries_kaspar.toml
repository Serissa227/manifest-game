# 相识（认识十几年，头一回看见他的手抖）：木夹夹住试金石。
[[tracks.chapters]]
key = "tie_extra_10_liesbeth_devries_kaspar_meeting"
title = "手别抖"
text = "试金房的长桌上摆着一袋军饷，麻绳扎了三道，是卡斯帕替同营的老弗里茨送来的。莉斯贝特倒出十枚，先上秤，再把试金石搁到桌上：“按住，我要划痕。”卡斯帕把手压上去，黑石在桌面上嗒嗒地跳。她抬眼，看见那只手抖得像压在风口的一张纸。认识十几年，头一回。她什么也没问，拉开抽屉取出一只木夹，把石头夹死在桌沿：“银子放这儿，人往后站。”卡斯帕退了一步，手背到身后。划痕出来，这袋钱比足色少了一成的银。“弗里茨说袋子轻，我说他数错了。”“他没数错。”第二天他又来，掌心里是一枚磨得发亮的旧币：“这回不用夹具。”石头在他手底下响了两声，不响了。"
stage = "witness"
window = [[1575, 2, 1], [1575, 5, 31]]
at = "antwerp"
cast = ["liesbeth_devries", "kaspar"]
speaker = "liesbeth_devries"
mood = "tense"
news = "安特卫普铸币所的女试金师替一个老炮手验了一袋军饷，少了一成的银。"

