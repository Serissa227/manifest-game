# 抉择：证词送去哪里。
[[tracks.chapters]]
key = "tie_extra_10_liesbeth_devries_kaspar_choice"
title = "成色的证词"
text = "阿尔斯特的西班牙兵哗变了，消息一到，铸币所门口的人比往常多出一倍。莉斯贝特把一页纸拍在试金房的桌上，墨还没干，她撒了一把沙。纸上是军饷的证词：兵站发下去的钱，十枚里有三枚不够分量，每一袋都验过，每一枚都记着。卡斯帕拿起来，读得很慢：“这得送到议会去，越快越好。先找退路，再摆炮——城里得先知道兵为什么闹。”“送去也未必有人看，”莉斯贝特把沙吹掉，“看了也未必认。”卡斯帕把纸放回桌上，不再说话。两个人一起转过头，看着我。"
stage = "involve"
window = [[1576, 7, 26], [1576, 9, 15]]
at = "antwerp"
cast = ["liesbeth_devries", "kaspar"]
speaker = "liesbeth_devries"
mood = "tense"
news = "阿尔斯特的西班牙兵哗变了，安特卫普铸币所的门上钉出一张军饷成色的证词，围了一天的人。"

