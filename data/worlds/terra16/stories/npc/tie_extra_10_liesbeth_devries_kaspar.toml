# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：无（朋友线；不写恋爱，全线只有 friends）。
# 人物：莉斯贝特·德弗里斯（liesbeth_devries，1528-02-12 生，安特卫普铸币所的白银检验师，不开放恋爱）；
#       卡斯帕（kaspar，1521-08-15 生，退伍的德意志炮手，恋人是格里特，见 pair_kaspar_griet）。
#       两人是认识十几年的熟人：不写初遇（卡斯帕与格里特的第一次见面归 pair_kaspar_griet 1574），不写求爱。
#       老弗里茨、被冤枉的年轻兵、兵站的文书、市政厅里管军饷的官员都是本线虚构的小人物，不进 cast。
# 依据·史实：西班牙王室 1575 年 9 月再次宣布停付，驻尼德兰的兵饷拖欠；1576 年 7 月下旬驻阿尔斯特（Aalst）的西班牙兵哗变；
#       低地的银币成色按德涅尔与格令计，验银用天平、试金石与骨灰皿；锉边、剪边是当时市面坏钱的常见来源；
#       城里有西班牙兵驻守的城堡，斯海尔德河穿城而过。窗口止于 1576-10-31，不写十一月的“西班牙之怒”
#       （门板与街道归 pair_kaspar_griet，运书归 bond_jan 重逢）。
# 依据·原创：木夹夹住试金石、卡斯帕的手抖（不解释，也没人提）、一排拴着名字的钱袋、同一把锉子的锉痕、
#       被冤枉的年轻兵与他的帽子、一页撒了沙的证词、念给老兵听的那一晚、桌布上用炭条画的街图。
#       待核：1575 年停付以后安特卫普兵站怎样发饷（正文只写“兵站”）；1576 年夏天军饷的证词该递哪个衙门
#       （正文写“城里的议会”“管军饷的官员”）；阿尔斯特哗变的日期（按 7 月 25 日前后）。
# 缺省走向：meeting（1575 春，试金房，friends）→ turning（1575 秋传闻：又停付，钱袋一袋袋送进试金房）→ closer（1576 春，
#       分开钱袋，年轻兵洗清罪名）→ choice（1576 夏，缺省：莉斯贝特把证词钉在铸币所的门上）→ landing（1576 秋，一顿不谈银子的饭，
#       桌布上的退路；friends、_landing、回忆）。
# 玩家能做的：deliver_testimony 把证词当面交给管军饷的官员（_helped）；read_aloud 在码头酒馆念给当兵的听（_read）。两条路都不改结局，
#       只改证词落在谁手里。
# 旗标：写 c7_tie_extra_10_liesbeth_devries_kaspar_landing、_helped、_read；读 c7_pair_kaspar_griet_together（落点章 griet 变体；
#       pair_kaspar_griet 在 1575 年 Q4 设它，早于本线落点）。
# 日程：不改 cast。两人 1553—1590 都在 antwerp（莉斯贝特 market，卡斯帕 dock），不用动。
# 整合：cast/ties.toml 的 extra_10：friends 不变，since 改为 1575（建议 [1575, 1, 1]，第一章的 friends 效果同日生效）；
#       tags 现为 ["BG"]，简报标签为“无”，改为 []；note 里“逐个补开凭据”“讨饷的兵闹到安特卫普那年”与本线对不上，可换成：
#       “卡斯帕替一个老兵拿军饷来请莉斯贝特验，成色少了一成。后来兵站的钱袋一袋袋送进试金房，两个人把它们一个个分开。”

