# 相识：1573 年秋，穆拉诺玻璃坊。一排按颜色分好的小罐，一片带纹的绿玻璃。
[[tracks.chapters]]
key = "tie_new_piero_vetro_selim_kereste_meeting"
title = "按颜色收的碎片"
text = "和约签了半年多，穆拉诺的小码头上泊了条东边来的柴船，船主是奥斯曼的木料商。跟船的塞利姆抱着单子进玻璃坊找人签字，窑边的地上蹲着个人，面前一排小罐，正把碎玻璃往里分：蓝的，乳白的，潟湖绿的。“扔了不就完了？”塞利姆问，嗓子压得很低，像怕惊着谁。皮耶罗头也不抬，手没停：“扔了它就白裂了。裂了也能告诉我们什么。来，你是管柴的，看这块，它想说什么？”塞利姆蹲下来，捏起那片绿的，对着窗光转了半圈，里头横着一道浑纹，裂口正顺着它走。“顺着纹下刀，别硬劈。”他说得很慢，“劈柴是这个理。你这块没人劈，是窑里的火不匀，它自己顺着纹裂了。”皮耶罗的手这才停了，眼睛亮得像捡了钱：“再顺着纹说一遍，我拿本子记！”那天的柴，他挑了一个下午，每一根都要问是哪座山上长的。"
stage = "witness"
window = [[1573, 9, 1], [1573, 12, 31]]
at = "venice"
cast = ["piero_vetro", "selim_kereste"]
speaker = "piero_vetro"
mood = "cheerful"
news = "穆拉诺的玻璃坊里，奥斯曼木料商的一个伙计蹲在地上，陪一个把碎玻璃按颜色分罐的吹玻璃人聊了一下午的柴。"

