reply = "我装了一船黑面包、干豆和醋，船舷挂着卫生官的凭证，从官码头靠岸。岛上的管事让人把箱子一只只抬进去，那条窄纸在醋里浸过、拿硫黄熏了，才递进铁栅。三天后我去取空箱，管事递出一条皱纸，字被醋泡得发糊，只有一句：“顺着纹，不硬劈——我在熬。”皮耶罗在码头上念了三遍，念到“熬”字，用袖子擤了一下鼻子：“熬了好几个月，开口还是木头。”"
