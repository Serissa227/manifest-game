# 落点（恋爱，缺省即远距相守）：1577 年 7 月，头一回过救主节，朱代卡运河上的浮桥。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "tie_new_piero_vetro_selim_kereste_landing"
title = "浮桥上的木料"
text = "瘟疫退了。七月，威尼斯头一回过救主节，朱代卡运河上用船并排搭起浮桥，一晃一晃通到对岸临时搭的木头小堂。桥板里有一批是塞利姆运来的伊兹米特橡木，没刷漆，纹路露着。皮耶罗一块块踩过去：“这块是你的？”“这块也是。”“这块呢？”“这块是别家的，你踩轻点。”走到桥中央，皮耶罗停下来，当着满桥看灯的人握住了塞利姆的手。“有人看。”塞利姆压低声音。“看就看，”皮耶罗说，“他们脚下的板子是你的。”他没松手，凑过去亲了塞利姆一下。往后每年救主节，塞利姆的木料船都赶在浮桥搭起来之前靠岸。"
