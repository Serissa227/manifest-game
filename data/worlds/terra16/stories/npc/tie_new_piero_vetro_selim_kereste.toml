# 转折（传闻）：1575 年秋冬，瘟疫。东家死在客栈，塞利姆被官差送去隔离岛；皮耶罗被炉头拽住。
[[tracks.chapters]]
key = "tie_new_piero_vetro_selim_kereste_turning"
title = "封了门的客栈"
text = "今年夏天城里起了瘟疫，卫生官一条街一条街地封门，门上钉死木板。外来的商人走了一大半，没走成的都被官差记了名。里亚尔托后头那家客栈的老板娘说，店里头一个倒下的是奥斯曼木料商，三天就没了；他的伙计塞利姆守了三夜没合眼，官差来抬人，他先把东家的鞋摆正，才让抬走，又说了一句：“我是他的伙计，他去哪儿，我跟到哪儿。”穆拉诺的人接着讲，皮耶罗听到消息，扔了吹管就往码头跑，被炉头一把拽住：“你去了也进不去！”“那我在外头等！”傍晚的船往隔离岛开，名册上添了一行。"
