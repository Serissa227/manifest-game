# 靠近：1575 年春夏。三十只杯子裂在杯脚，一根湿山毛榉。皮耶罗的料钱在这里被塞利姆知道。
[[tracks.chapters]]
key = "tie_new_piero_vetro_selim_kereste_closer"
title = "木纹与裂纹"
text = "皮耶罗那一窑杯子又裂了，三十只，裂的全是杯脚。窑头的小徒弟拿粉笔往他名下添了一笔，他挠着头笑：“连上回烧坏的那炉料钱，我得在这儿吹到八十岁。”塞利姆没接钱的话，蹲到窑口的柴堆前，一根一根劈开看：山毛榉的芯是黑的，断口还往外渗水。“裂了也能告诉我们什么，”他学着皮耶罗的腔调，只是慢了不止一倍，“它告诉你，柴是湿的。”小徒弟嚷嚷这批柴付过钱，非烧不可。塞利姆连说了三声对不起，一步没让：“这批不能进窑。”下一窑烧的是他挑的柴。开窑那天，三十只杯子一只没裂，皮耶罗抱着整排杯子，笑得说不出话。"
stage = "witness"
window = [[1575, 3, 1], [1575, 6, 30]]
at = "venice"
cast = ["piero_vetro", "selim_kereste"]
speaker = "selim_kereste"
mood = "tender"
news = "穆拉诺有个吹玻璃的，杯子回回裂在脚上；奥斯曼木料商的伙计劈开窑边的柴一看是湿的，换了柴，这回一只没裂。"

