# 抉择：1576 年春夏，穆拉诺小码头。石台上的面包，一封只有一句话的信。
[[tracks.chapters]]
key = "tie_new_piero_vetro_selim_kereste_choice"
title = "石台上的面包"
text = "四月的夜里，皮耶罗在穆拉诺的小码头等我，怀里揣着半个黑面包，两只手掌磨出了血泡。“每晚一个，”他说，“放在隔离岛码头的石台上，不许靠岸，放下就划走。第二晚去，有时上一个还在，有时不在了，我不知道是他拿的，还是别人拿的。”他从围裙里摸出一条窄纸，折了又折：“信我送不进去。你有船，有卫生官给的凭证。就一句，我想了三个晚上。”纸上写着：“裂了也能告诉我们什么——你别裂。”他把纸塞给我，又拿回去看了一遍，才重新递过来。"
stage = "involve"
window = [[1576, 4, 1], [1576, 8, 31]]
at = "venice"
cast = ["piero_vetro", "selim_kereste"]
mood = "tense"
news = "威尼斯隔离岛的码头石台上，每天夜里都有人放一块面包，放下就划船走；划船的是穆拉诺来的。"

