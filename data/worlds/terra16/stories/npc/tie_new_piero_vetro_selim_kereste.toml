# 浮桥上的木料（tie_new_piero_vetro_selim_kereste）——配角线，标签 BL；新线，恋爱线。
# 人物：皮耶罗·韦特罗（piero_vetro，1540-07-19 生），穆拉诺玻璃坊里的吹玻璃人，学院同学，爱把烧裂的碎片按颜色收进小罐，欠着一炉烧坏的料钱。
#       塞利姆·凯雷斯特（selim_kereste，1540-03-16 生），伊斯坦布尔木料场出身的学院同学，1573 年和约后随奥斯曼木料商来威尼斯。
#       全线都在成年以后：1573 年相识（friends，两人 33 岁）；1575 年知己（confidants）；1577 年 7 月落点（lovers，窗口起日 36、37 岁）。
#       落点以前不写告白，两种结局都接得上。落点章只有一个吻，一句带过。
# 依据（史实）：1573 年 3 月威尼斯与奥斯曼单独议和，商路重开；穆拉诺的炉子烧木柴，柴由船从对岸与内陆运来；
#       1575—77 年威尼斯大疫，卫生官按街封门，病人与接触者被送往潟湖里的隔离岛（两座检疫所：老的收病人，新的收接触者），隔离期名义上四十天，疫情反复时一再延长；
#       1576 年元老院为退疫许愿建救主堂，1577 年 7 月头一回过救主节，朱代卡运河上用船并排搭浮桥通到对岸，对岸先搭了一座临时的木头小堂。
# 原创：两人的全部故事——柴船、湿山毛榉、窑头的粉笔账、客栈里摆正的鞋、石台上的面包、桥板里的伊兹米特橡木与那片刻出来的碎玻璃。
# 待核：奥斯曼木料商 1573 年后到穆拉诺卖窑柴的细节（写成故事内的事，正文不说成通例）；浮桥的搭法与临时小堂的样子；
#       隔离岛上收信的办法（正文写“醋里浸过、硫黄熏过”，不写具体哪一座岛）。
# 缺省走向：相识 → 湿柴与干柴 → 瘟疫（传闻：东家死在客栈，塞利姆被送去隔离岛）
#       → 无人插手：皮耶罗一人每夜划船放面包，划了四个月，塞利姆出岛时瘦了一圈
#       → 1577 年 7 月救主节的浮桥上成为恋人，之后塞利姆随木料船来回、每年救主节必到（远距相守）。
#   帮助：按规矩把一船吃的和信交给岛上的管事（_helped）→ 落点变体：皮耶罗口袋里揣着那封被醋泡糊了的回信。
#   陪划：夜里替皮耶罗看潮（_rowed）→ 落点变体：桥中央的木板上刻着一小片碎玻璃。
# 并肩：主角在 bond_piero_vetro 或 bond_selim_kereste 的 S 章立了约（promise / heart 设 c7_tie_new_piero_vetro_selim_kereste_taken），
#       主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_piero_vetro_selim_kereste_side 写两人成为窑柴与木料的一辈子的朋友。
# 共享旗标：读 c7_tie_new_piero_vetro_selim_kereste_taken；写 c7_tie_new_piero_vetro_selim_kereste_together、_side、_helped、_rowed。
# 日程：塞利姆的日程在伊斯坦布尔，1573—77 年在威尼斯是故事内的出行，不改 cast。
# 秘密：皮耶罗欠一炉料钱（只在 closer 里被塞利姆知道，不进见闻）；塞利姆省下好木料造救生艇的事归 tie_extra_07，本线不写。
# 口头禅：皮耶罗“裂了也能告诉我们什么”（meeting、closer 里塞利姆学舌、choice 的信各一次）；
#       塞利姆“顺着纹下刀，别硬劈。”（照人物卡，原句只在 meeting 用一次；choice 的回信与落点 helped 只用“顺着纹，不硬劈”半句呼应）。

