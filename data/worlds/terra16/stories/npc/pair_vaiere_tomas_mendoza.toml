# 四、落点：1570 年秋，出发前一夜，写到一个吻为止。缺省即圆满。
[[tracks.chapters]]
key = "pair_vaiere_tomas_mendoza_together"
title = "舵在她手里"
text = "往西走的前一夜，瓦伊蕾把舟划到潟湖中间，让浪托着，两个人仰面躺着看星。“这座岛在哪儿，现在告诉你。”她说得像下命令，“不许拿笔。”托马斯把航簿推到舟尾。她凑到他耳边，一颗星一道浪地说，说完：“再说一遍。”他错了一处，被她捏住耳朵：“再来。”说到第三遍，一个字也没错。“好。”她仰着脸看星，“现在，你可以吻我。”他吻了她，她回吻，比他久。天亮，她把桨插进水里，头也不回：“坐前面。”"
