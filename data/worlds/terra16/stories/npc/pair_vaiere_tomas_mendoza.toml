# 六、尾声：1574 年春，关岛乌马塔克的锚地，远距相守。
[[tracks.chapters]]
key = "pair_vaiere_tomas_mendoza_epilogue"
title = "关岛的锚地"
text = "乌马塔克的锚地，大帆船停下来取水，一桶一桶的水沿着绳子往上吊。托马斯站在船舷边，往南边的海上看了一下午。傍晚，一条双体舟从南边的浪里出来，帆是旧的，掌舵的是瓦伊蕾。她没上大船，把舟靠在船舷下面，仰着头：“这回跟不跟我走一段？”水手们探出头来看，有个老舵手伸出三根指头，说隔三年了。托马斯朝大副喊：“借我十天！”大副摆手：船反正要泡十天。他顺着绳梯下去，落进舟里。“那一行呢？”她看了一眼他怀里的航簿。“没写。”“留着。”她已经把桨插进了水里。"
