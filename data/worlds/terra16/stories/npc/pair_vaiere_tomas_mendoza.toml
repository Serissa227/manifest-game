# C7 故事线重写（2026-10-12，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GB（恋爱线；瓦伊蕾 romance=m，托马斯 romance=any，两人都空着，本线是他们唯一的恋情）。
# 人物：瓦伊蕾（vaiere，1538-12-11），塔希提的星航者，说话慢、爱用命令句，岛在哪里、什么时候告诉他，都由她定；
#       托马斯·德·门多萨（tomas_mendoza，1538-05-03），大帆船的混血领航员，什么都往航簿里记，1571 起在马尼拉。
#       生年差 0 年。crush 章（closer）窗口 1569-09-01 起，两人 30、31 岁；lovers 章（together）窗口 1570-09-01 起，31、31 岁，都早已成年，远晚于 1557-01-01。
# 依据·史实：1565 年乌达内塔找到从菲律宾回墨西哥的回程航线；此后马尼拉大帆船往来，西行途中在关岛取水（乌马塔克是后来常用的锚地）；1571 年 6 月西班牙人在马尼拉建城。
# 依据·原创：两人；托马斯在塔希提遇救；椰壳碗、石子摆的星圈、航簿里没写的那一行、装鱼钩的小匣子、一半钉一半绳的小艇、双体舟每隔几年来关岛接他。
#       正文不写欧洲人“发现”塔希提，也不写托马斯把岛报告给任何人；岛的方位（那座附近有人住的岛）任何文字与见闻都不写，只写“她说了、他没有拿笔”。
# 待核：1574 年乌马塔克作为取水锚地的叫法（正文用“乌马塔克的锚地”）；大帆船在关岛停多久（正文只写“船要泡十天”）。
# 不写：瓦伊蕾与库西·瓦伊纳的星航之交（归 tie_extra_12_vaiere_kusi_wayna）。
# 地点：tahiti（前四章，马塔瓦伊湾的潟湖与沙滩）、manila（turning 传闻）、guam（epilogue，乌马塔克的锚地）。
# 缺省走向（玩家什么也不做）：1569 春她从礁外捞起抱着船板的托马斯（见证）→ 1569 秋教他看星，航簿里本该写岛方位的那一行他没写（crush）
#       → 1570 春她给了他一条真能离开的路，让他再留一季（involve，缺省无效果）→ 1570 秋她领他往西走前一夜告诉他岛在哪里，成为恋人（lovers，设 _together）
#       → 1571 夏马尼拉酒馆里的传闻（rumor）→ 1574 春关岛锚地，她驾双体舟来接他走一段，此后每隔几年一次（远距相守，圆满）。没有坏结局。
#   帮助：运来木料与铁钉（_helped）→ epilogue 变体：她舟尾的绑绳里夹着一根当年的铁钉。
#   撮合：请他立誓（_matched）→ epilogue 变体：撕下的那一页在她舟上的小匣子里。旁观：无旗标，只加好感。
# 读的旗标：无。设的旗标：c7_pair_vaiere_tomas_mendoza_helped、_matched（choice）、_together（together 的 default）。
# 日程（整合方改 cast）：托马斯 1569-03-01 至 1571-06-14 在 tahiti（现 cast 里他 1571-01-01 起才在 manila），1571-06-15 起在 manila，
#       1574-02-01 至 1574-04-30 在 guam；瓦伊蕾同一时段（1574-02-01 至 04-30）在 guam，其余时间留在 tahiti。
# 整合：cast/ties.toml 的 vaiere × tomas_mendoza 改为两段——crush（since 1569-11-30，to 1570-11-29）、lovers（since 1570-11-30，对应 together 窗口末日）。

