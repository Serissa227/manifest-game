# 一、相识：1569 年春，礁外一块船板，一只椰壳碗。
[[tracks.chapters]]
key = "pair_vaiere_tomas_mendoza_meeting"
title = "先喝水"
text = "礁外有个人抱着一块船板，在浪里一沉一浮。瓦伊蕾划舟过去，用桨勾住他的腰带，拖上了舷。他吐了半天海水，睁眼就问：“这是哪里？岛在什么方位？”手同时往怀里摸，摸出一本泡软的航簿。她把一只椰壳碗按到他嘴边：“你的船偏了两天的路，自己还不知道吧？坐下，先别说话，听。”他灌下半碗，才看清自己坐的是一条舟，船舷上的绳扎都是新的，湿的，打得很紧。“这条舟昨夜刚修好。”她拿桨敲了敲舷，“你先知道自己坐在哪儿，再问岛在哪儿。浪是从哪边来的，听得出来吗？”托马斯合上航簿，把笔放回去，侧着耳朵听。"
stage = "witness"
window = [[1569, 3, 1], [1569, 5, 31]]
at = "tahiti"
cast = ["vaiere", "tomas_mendoza"]
speaker = "vaiere"
mood = "tender"
news = "马塔瓦伊湾的星航者从礁外捞起一个抱着船板的外乡人，听说那人醒过来第一句就问岛在哪里，被她用一碗水堵了回去。"

[tracks.chapters.default]
