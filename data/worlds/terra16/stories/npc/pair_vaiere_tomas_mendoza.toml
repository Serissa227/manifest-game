# 二、靠近：1569 年秋，沙滩上的石子圈，航簿里没写的一行。
[[tracks.chapters]]
key = "pair_vaiere_tomas_mendoza_closer"
title = "没写的那一行"
text = "夜里，瓦伊蕾在沙滩上用石子摆了个圈，一颗石子是一颗星升起的地方。托马斯蹲着看，一边记，一边讲那条回程的路：从菲律宾往北走得很高，再顺着风向东，一直回到墨西哥，书上已经有了。“书上画了路，这片海可没答应归图纸。”她用脚尖挪了一颗石子，“这颗你记，那颗不用。”“这颗星，我叫不出名字。”“那就记它从哪里升起来。”他一颗一颗写下去，写到最后一行，本该写这座岛在哪里的那一行，笔尖停住，纸上什么也没落。他合上航簿，没有解释。瓦伊蕾看着他合上，把最后一颗石子放进圈里，第一次对他笑了。"
stage = "witness"
window = [[1569, 9, 1], [1569, 11, 30]]
at = "tahiti"
cast = ["vaiere", "tomas_mendoza"]
speaker = "tomas_mendoza"
mood = "tender"
news = "马塔瓦伊湾那个外乡领航员跟着星航者学看星，听说他的航簿上有一行一直没写。"

