# 三、选择：1570 年春，拖上沙滩的小艇，钉子锈了一半。
[[tracks.chapters]]
key = "pair_vaiere_tomas_mendoza_choice"
title = "她定航路"
text = "我把船靠进马塔瓦伊湾，托马斯和瓦伊蕾正站在一条拖上沙滩的小艇旁。艇是用他那条船漂上岸的碎料拼的，钉子锈了一半，缝里塞着她编的椰壳纤维。“这条艇能出外海了。”瓦伊蕾拍了拍艇帮，“路我告诉你。什么时候走，你自己定。走，我不拦；留，你得说清楚是你想留。”托马斯拿袖子擦了擦手，才开口：“我想接着跟你学。”他看着她，“这一段，你来领；我会记。”瓦伊蕾没点头，也没摇头，眼睛转向了我。"
