# NPC 线：诺埃尔·德·卡德纳——海峡的骑士（故事 2.0，A5 / E37 契约）
# 标签：NPC 线（诺埃尔不是玩家主角时才跑）。
# 轨道：npc_noel（脊轨，auto，rumor 五章，门槛章 s00 写身份）+ 交汇旁轨 npc_noel_duel、_roster、_malta、_toledo、_algiers、_azores、_join（auto=false，由脊轨 start_track 打开）。
# 依据：史实——1557 圣康坦之后的圣母骑士团（原创延续）；1565 马耳他之围（H22）；1571 勒班陀（H37，桨座上的划手）；1578 三王之战（H49）；1580—82 亚速尔与科尔武（H53，安格拉奉克拉图院长为王）；1588 无敌舰队（H60）。
#   原创——塔里法点名、红缎带、名册与七十七个名字、丰沙尔的糖坊与锡星、特里亚纳的绳铺、阿尔及尔三一会门房的赎俘簿、科尔武的石座。
#   托莱多赫拉克勒斯洞口的刻痕是流传的传说，正文只作老人口述；查探的年份照传说写。
#   塞万提斯只在变体里作一句，不展开。胡安修士、让·德·拉瓦莱特、克拉图院长的人物与 cast 一致。
# 待核：托莱多洞口 1546 年的查探是否真有大主教派人（写成老人的说法）；勒班陀划手的锁由谁在哪一夜砍开（写成个别的一件事）。
# 日程（cast 已登记）：1557—1567 塔里法；1568—1580 阿尔及尔（以赎俘人的身份住在阿尔及尔）；1581—1590 里斯本。
# 口吻与秘密：诺埃尔是 NPC 时永不揭开性别与来历；全文不用他 / 她 / Sir / Lady / Miss 指诺埃尔，只叫“诺埃尔”或“那位骑士”；外貌只写“讨厌被人盯着脸看”。
# 恋爱：不用 heart / relation / tie / bond 效果；招募只是请一位航海士上船，不是告白。
# 读的共享旗标：c12_voyage_noel（=false，诺埃尔不是玩家）、upbringing_graduated、c13_main_tariq（=false，塔里克当玩家时 malta、algiers、azores 排除；toledo 的变体读它为真时）、h22_malta_siege_ottoman_takes_malta、h49_three_kings_sebastian_returns。
# 设的旗标：c13_npc_noel（s00）；c13_npc_noel_duel_won 与 _roster_asked（d1）；c13_npc_noel_name_found（r1，s04 变体读）；c13_mark_toledo（t1，印记一局只发一次）；c13_npc_noel_ransomed（a1，s03 变体读）；c13_npc_noel_corvo（z1，j1 变体读）；c13_npc_noel_mate（j1 招募，之后各交汇旁轨静默，s04 变体读）。
# 等待的包：A8（mark_* 发现物的许可流程；印记章目前只发物品）；A9（门槛章可加 protagonist 条件，届时 auto 改 false）；C10（h22_malta_siege_ottoman_takes_malta、h49_three_kings_sebastian_returns 的 key 表）。C11 无。
# HIST 占位清单：h22_malta_siege_ottoman_takes_malta（s01 变体：马耳他丢了）；h49_three_kings_sebastian_returns（s03 变体：国王从非洲回来了）。
# 回忆插画清单（mem-* 与画面描述）：
#   mem-npc_noel_duel-d1「红缎带的线头」：退潮的沙滩上两把剑交错，一根红缎带的线头飘在风里，远处是城堡和金枪鱼网桩。
#   mem-npc_noel_toledo-t1「一张描下的纸」：绳铺门口的长凳上，一张画满小锁的旧纸，两只手一只按纸一只描，旁边一卷缆绳。
#   mem-npc_noel_azores-z1「科尔武的石座」：风很大的山顶，一座空石座，系红缎带的骑士背对着坐在石座边，望着西边的海。
#   mem-npc_noel_join-j1「第七十八个名字」：河边小屋的桌上摊着旧名册，最后一行新添一个名字，红缎带压在页边。

[[tracks]]
key = "npc_noel"
name = "海峡的骑士"
kind = "request"
start = "s00_gate"
auto = true

[[tracks.chapters]]
key = "s00_gate"
title = "城堡里的点名"
text = "塔里法城堡里点了名，名册上七十七个名字，只有一个人应了一声。鱼市上的人都看见了：应声的是刚授剑的那位骑士，剑穗上拴着一根红缎带，走起路来一甩一甩。点完名，骑士头一句话是问管事：名册上那些空着的格子，从哪个港口找起？管事回了一句：“从睡醒找起。”"
stage = "rumor"
window = [[1557, 1, 24], [1557, 1, 31]]
at = "tarifa"
cast = ["noel"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c12_voyage_noel", value = false }, { kind = "flag", flag = "upbringing_graduated" }]
news = "塔里法城堡里念名册，只有一个人应声。那位系红缎带的骑士说，要照着名册满世界找人。"

[tracks.chapters.default]
next = "s01_malta_rumor"
effects = [{ kind = "flag", flag = "c13_npc_noel" }, { kind = "start_track", track = "npc_noel_duel" }, { kind = "start_track", track = "npc_noel_roster" }, { kind = "start_track", track = "npc_noel_toledo" }, { kind = "start_track", track = "npc_noel_malta" }]

[[tracks.chapters]]
key = "s01_malta_rumor"
title = "围城里出来的名单"
text = "墨西拿的码头上传开了消息：马耳他的围城散了。跟“小援军”一道进城的人里，有个系红缎带的海峡骑士。那位骑士出城时什么也没抢，只带出一张名单，城墙上死掉的人，一个一个写着家乡。修院的老修士看了一遍，说：“死人也要写家乡，别只写一个数。”"
stage = "rumor"
window = [[1565, 9, 10], [1565, 12, 15]]
at = "messina"
cast = ["noel"]
mood = "tense"
news = "墨西拿的人说，马耳他围城里出来一个海峡骑士，什么都没抢，只带出一张死人的名单。"

[tracks.chapters.default]
next = "s02_lepanto_rumor"
effects = [{ kind = "start_track", track = "npc_noel_algiers" }]

[[tracks.chapters.variants]]
key = "falls"
when = [{ kind = "flag", flag = "h22_malta_siege_ottoman_takes_malta" }]
text = "马耳他丢了。逃出来的船上有个系红缎带的海峡骑士，抱着一张名单，上面是城里所有人的名字，活着的、没活着的。修院的老修士看了一遍，什么也没说，把名单收进了箱底，又搬了块石头压在箱盖上。"

[[tracks.chapters]]
key = "s02_lepanto_rumor"
title = "桨座底下的骑士"
text = "舰队回到墨西拿，酒馆里人人讲自己抢了哪面旗。有个从阿尔及尔来的赎俘骑士也上了同盟的船，一面旗都没碰。有人看见，那位骑士蹲在土耳其船的桨座底下，一根一根砍划手脚上的锁，砍了一整夜。一个被放出来的老划手还在念叨：“砍完我的锁，那位骑士说：自己走，别叫我扶。”"
stage = "rumor"
window = [[1571, 10, 15], [1572, 1, 31]]
at = "messina"
cast = ["noel"]
mood = "sad"
news = "墨西拿的酒馆里，人人讲自己抢了哪面旗。只有一个老划手讲，是谁砍开了自己脚上的锁。"

[tracks.chapters.default]
next = "s03_lisbon_rumor"
effects = []

[[tracks.chapters]]
key = "s03_lisbon_rumor"
title = "问船期的人"
text = "里斯本换了国王，码头上挂起了西班牙的旗。那位在阿尔及尔住了十几年的赎俘骑士搬进了里斯本，在河边租了一间小屋。骑士逢船就问去亚速尔的船期，说要去科尔武，看一个老人死的地方。问完不走，坐在码头上等，一等就是一下午。河边的船夫说：“像是怕回屋。”"
stage = "rumor"
window = [[1581, 3, 1], [1581, 8, 31]]
at = "lisbon"
cast = ["noel"]
mood = "tender"
news = "里斯本河边新来了一个系红缎带的骑士，逢船就问去亚速尔的船期。"

[tracks.chapters.default]
next = "s04_strait_rumor"
effects = [{ kind = "start_track", track = "npc_noel_azores" }, { kind = "start_track", track = "npc_noel_join" }]

[[tracks.chapters.variants]]
key = "king_back"
when = [{ kind = "flag", flag = "h49_three_kings_sebastian_returns" }]
text = "里斯本的国王从非洲回来了，比走时瘦了一圈，码头上挂起的还是西班牙的旗。那位在阿尔及尔住了十几年的赎俘骑士搬进了里斯本，在河边租了一间小屋。骑士逢船就问去亚速尔的船期，说要去科尔武，看一个老人死的地方。问完不走，坐在码头上等，一等就是一下午。河边的船夫说：“像是怕回屋。”"

[[tracks.chapters.variants]]
key = "ransomed"
when = [{ kind = "flag", flag = "c13_npc_noel_ransomed" }]
text = "里斯本换了国王，码头上挂起了西班牙的旗。那位在阿尔及尔住了十几年的赎俘骑士搬进了里斯本，在河边租了一间小屋。骑士逢船就问去亚速尔的船期，说要去科尔武，看一个老人死的地方。问完不走，坐在码头上等，一等就是一下午。河边的船夫说：“像是怕回屋。”骑士在码头上碰见了当年托你赎回来的那个瓦伦西亚人，两个人站着说了很久的话。"

