text = "里斯本的国王从非洲回来了，比走时瘦了一圈，码头上挂起的还是西班牙的旗。那位在阿尔及尔住了十几年的赎俘骑士搬进了里斯本，在河边租了一间小屋。骑士逢船就问去亚速尔的船期，说要去科尔武，看一个老人死的地方。问完不走，坐在码头上等，一等就是一下午。河边的船夫说：“像是怕回屋。”骑士在码头上碰见了当年托你赎回来的那个瓦伦西亚人，两个人站着说了很久的话。"

[[tracks.chapters]]
key = "s04_strait_rumor"
title = "没上船的骑士"
text = "无敌舰队从里斯本出港那天，码头上挤满了送行的人。有人看见那位系红缎带的骑士没上任何一条船，背着名册往南走了，有人说是回塔里法，站到城墙上去看海峡。一个征来的领航员说：“我问骑士去不去，骑士说：海峡总得有人看着。”"
stage = "rumor"
window = [[1588, 8, 1], [1588, 12, 31]]
at = "lisbon"
cast = ["noel"]
mood = "sad"
news = "里斯本码头上，无敌舰队出港那天，有个系红缎带的骑士抱着一本旧名册，一句话没说，看了满河的帆。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "v1_mate"
when = [{ kind = "flag", flag = "c13_npc_noel_mate" }]
text = "无敌舰队从里斯本出港那天，码头上挤满了送行的人，你的船也在其中。那位系红缎带的骑士就站在船尾，看着满河的帆，不吭声，只把名册抱得更紧。你问要不要回塔里法看一眼，骑士说：“海峡的事，等船靠了岸再说。”"

[[tracks.chapters.variants]]
key = "v2_found"
when = [{ kind = "flag", flag = "c13_npc_noel_name_found" }]
text = "无敌舰队从里斯本出港那天，码头上挤满了送行的人。有人看见那位系红缎带的骑士没上任何一条船，背着名册往南走了，有人说是回塔里法，站到城墙上去看海峡。一个征来的领航员说：“我问骑士去不去，骑士说：海峡总得有人看着。”丰沙尔那个糖坊的管事也来送行，胸前别着一枚锡星。"


