# 相识：1559 年狂欢节，剧团库房。一件补了三次的袍子，一张写着“谢”字的废纸。
[[tracks.chapters]]
key = "tie_tommaso_alvise_meeting"
title = "借错的衣裳"
text = "狂欢节的第三个晚上，阿尔维塞夹着一捆封了蜡的公文爬上剧团的库房，要借件戏衣混进宴会。托马索翻到箱底，抖出一件袍子，肘上、袖口、下摆各补过一回。“你想扮人，还是扮一匹布？”阿尔维塞皱起眉：“补丁比布还多。”“穿得最好的人，宴会上谁都盯着。这块是蜡烛烧的，那块是帕多瓦的仆人拽的，借出去的衣服我一件不忘。”托马索伸手想把箱盖上那捆公文挪开，阿尔维塞的手先按住了它。“这封信，先问谁有权拆。”“我只拆衣箱。”那晚阿尔维塞穿着补丁袍子走进宴席，没一个人多看他一眼。第二天袍子叠得方方正正还回来，口袋里多了张废纸，只写一个“谢”字，背面写满了字，托马索没翻过来。"
stage = "witness"
window = [[1559, 1, 10], [1559, 3, 10]]
at = "venice"
cast = ["tommaso", "alvise"]
speaker = "tommaso"
mood = "cheerful"
news = "威尼斯狂欢节上，有个秘书向剧团借了件补了三次的戏衣，穿着混进宴会，没一个人多看他一眼。"

[tracks.chapters.default]
next = "tie_tommaso_alvise_turning"
effects = [{ kind = "tie", a = "tommaso", b = "alvise", relation = "friends" }]

# 转折（传闻）：1559 年夏，一封落款借了演员名字的信招来债主，托马索被追了三条街。
[[tracks.chapters]]
key = "tie_tommaso_alvise_turning"
title = "被借走的姓名"
text = "这个夏天，威尼斯的酒馆里都在传一件事：一封不该拆的信落到了外人手里，信尾的落款是个演员的名字。债主们照着名字找上剧团，守在台口，等戏演到一半。“演潘塔洛内的欠我们二百杜卡特！”有人喊。观众当是新添的笑料，拍着巴掌叫好。“潘塔洛内不欠钱，只欠人一顿打！”托马索在台上接得飞快，直到债主举起那张纸，念出信里的句子：“余款随下一班船到，不另立据。——托马索。”台上的潘塔洛内摘下面具，露出托马索的脸。他被追出广场，追了三条街，从一家客栈的后门钻进去，没敢点灯。"
stage = "rumor"
window = [[1559, 5, 1], [1559, 8, 31]]
at = "venice"
cast = ["tommaso", "alvise"]
mood = "tense"
news = "威尼斯酒馆里都在传：有封信的落款用了演员托马索的名字，债主们守在台口，等戏演到一半，把他追了三条街。"

[tracks.chapters.default]
next = "tie_tommaso_alvise_choice"
effects = []

# 抉择：1560 年冬，里亚托桥边的客栈。托马索拿两张纸堵住阿尔维塞；玩家能陪他更正，或替剧团结账。
[[tracks.chapters]]
key = "tie_tommaso_alvise_choice"
title = "当众说清"
text = "阿尔维塞又带着公文回了威尼斯。他在里亚托桥边的客栈刚放下行李，托马索就堵在门口，手里捏着两张纸：一张是债主拿来当借据的那封信，一张是去年那个写着“谢”的纸片。托马索把他拽到院子里的酒桶边，两张纸并排拍在桶盖上。“看收尾那一勾。”他说，“这一句是台词，下一句才是真的——那个名字是你借的。”阿尔维塞把借据翻过来看了看背面。“公事上的事，我不能说。”“那就说你能说的。”阿尔维塞没有开口。院子里的人都停了手里的活。托马索先转过头来，阿尔维塞过了一会儿才跟着转，两个人一起看着我。"
stage = "involve"
window = [[1560, 1, 10], [1560, 3, 31]]
at = "venice"
cast = ["tommaso", "alvise"]
speaker = "tommaso"
mood = "tense"
news = "威尼斯那个被借了名字的演员，在客栈院子里把一个秘书堵在酒桶边，要他当众说清楚。"

[tracks.chapters.default]
next = "tie_tommaso_alvise_landing"
effects = []
news = "威尼斯那个演员的债主们一夜之间都撤了，没人看见谁付的钱；剧团的名声却一直没洗干净。"

[[tracks.chapters.choices]]
key = "clear_name"
text = "陪阿尔维塞去债主的账房，让他署上自己的名字写一份更正。"
reply = "债主的账房在鱼市后头，桌上一边是秤砣，一边是缺了口的墨水瓶。阿尔维塞要了张新纸，两面看过才落笔。更正只有一句：那封信的落款，与演员托马索无关。他签的是自己的全名。账房先生挑起眉毛：“就这一句？”“就这一句。”托马索拿指头弹了弹账房抄给他的副本，“够你们撕掉三张借据了。”回到库房，他把副本钉进了戏衣箱的盖子里。"
next = "tie_tommaso_alvise_landing"
