[[tracks.chapters.choices]]
key = "pay_creditors"
text = "替剧团付清债主手里那张假借据。"
reply = "债主数完我递过去的银币，把借据撕成两半，一半收进钱袋，一半塞给托马索。托马索捏着那半张纸，转向阿尔维塞：“钱是船长出的，人情得你还。”“我记着。”“这一句，是台词还是真的？”阿尔维塞没有答，把那半张借据要过去，翻到背面看了看，又还给他。"
next = "tie_tommaso_alvise_landing"
effects = [{ kind = "flag", flag = "c7_tie_tommaso_alvise_paid" }, { kind = "affinity", person = "alvise", value = 3 }]
