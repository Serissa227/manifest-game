# 落点：1561 年，剧团库房。借衣先签单子，单子上写着“不许借名字”。缺省走向即上面的 default 路径。
[[tracks.chapters]]
key = "tie_tommaso_alvise_landing"
title = "能再借的戏衣"
text = "第三个冬天，阿尔维塞又爬上了剧团库房的楼梯。托马索没去开箱子，先从怀里掏出一张折过的单子拍在箱盖上：去哪里，穿几天，几时还。最末一行是他自己添的：不许借名字。债主们去年一夜之间撤得干干净净，托马索没问是谁付的钱，只把这一行写得比别的字都大。“你连这个都写。”“潘塔洛内最会记账。”托马索把笔递过去，“不签，衣服不出这个门。”阿尔维塞从头看到尾，签了，随手把单子翻过来——背面什么都没有。他抬头，托马索正忍着笑。“你翻什么？”“习惯。”托马索从箱底提出一件新袍子，肘上一个补丁也没有，料钱是他自己掏的，账上记的是潘塔洛内的新行头。“这回扮人。”"
stage = "witness"
window = [[1561, 1, 15], [1561, 4, 30]]
at = "venice"
cast = ["tommaso", "alvise"]
speaker = "alvise"
mood = "cheerful"
news = "威尼斯那个剧团如今借戏衣要先签单子，单子上有一行写着“不许借名字”。"

