# 戏衣要还（tie_tommaso_alvise）——配角线，旧识（friends）；两人各有恋人，本线不写暧昧，也没有任何恋爱效果。
# 人物：托马索（tommaso，1530-06-05 生，纯 BL），职业喜剧团里演吝啬鬼潘塔洛内的演员；恋人是西奥多（见 pair_theodoros_tommaso），本线不写。
#       阿尔维塞·特龙（alvise，1530-09-26 生，取向不限），威尼斯巴伊洛的年轻秘书，常驻伊斯坦布尔，冬天带公文回威尼斯；1571 年后的恋人线是哈桑（见 pair_alvise_hasan），本线不写。
#       全线两人 28—30 岁。托马索自 1557 年起在威尼斯（cast 日程）。
# 依据（史实）：1545 年帕多瓦的剧团契约是最早的职业剧团记录；威尼斯狂欢节在大斋期前结束；潘塔洛内是即兴喜剧里的威尼斯老商人，吝啬、多疑，总被仆人耍弄；杜卡特是威尼斯的金币。
# 依据（原创）：借戏衣与“被借走的姓名”；补了三次的袍子、写着“谢”的纸片、“不许借名字”的单子；债主与借据。
# 待核：无硬史实；“里亚托桥边的客栈”为泛指，不对应具体店名。
# 窗口：从旧稿的 1554—57 挪到 1559—61。学院期（1554—1556）主角不在威尼斯，旧稿的 involve 章没人能回应。
# 秘密：阿尔维塞的秘密（见 cast 人设卡）全线不写、不暗示，只写“公事”；见闻里同样不出现。
# 缺省走向（玩家不在场也照样发生）：1559 狂欢节借一件补了三次的袍子（friends）→ 1559 夏天一封落款借了演员名字的信招来债主（传闻）
#   → 1560 托马索在客栈门口堵住阿尔维塞；没人插手时，阿尔维塞私下把债主打发走、没露面，剧团的名声一直没洗干净 → 1561 借衣要先签单子，“不许借名字”（落点，friends，设 _landing）。
#   帮助：陪阿尔维塞去债主账房署名更正（_helped，托马索好感 +5）→ 落点变体：更正的副本钉在戏衣箱盖里，单子上那一行从它抄来。
#   替付：替剧团结清债主手里那张假借据（_paid，阿尔维塞好感 +3）→ 落点变体：半张借据别在单子角上，那一行算利息。
#   三条路都通向同一个落点与同一个关系，只用 variants 改正文。
# 共享旗标：写 c7_tie_tommaso_alvise_landing / _helped / _paid；不读任何旗标。
# 日程与 ties（整合方）：阿尔维塞的日程在伊斯坦布尔，冬天带公文回威尼斯是故事内的出行，不改 cast 日程；
#   cast/ties.toml 的 tommaso_alvise 保持 friends，since 改为 [1559, 1, 10]，tags 里旧的 BL 去掉（旧识，不是恋人）。

