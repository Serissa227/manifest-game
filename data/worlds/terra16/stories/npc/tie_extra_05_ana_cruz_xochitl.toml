# 1563 春夏 · 相识：第一次站在主广场上；第一片羽毛被撕掉
[[tracks.chapters]]
key = "tie_extra_05_ana_cruz_xochitl_meeting"
title = "别站在那儿挡光"
text = "霍奇特尔在主广场上站了快一个时辰。大教堂、总督府的拱廊、东南天边那两座雪山，她一样一样看过去，一句话也没说，脚边的羽毛匣子一直没拎起来。到了表姐的画坊，她总算缓过劲，把匣子往桌上一搁：“这算什么？墨西……”后半句咽了回去。安娜头也不抬：“别站在那儿挡光。换到这边——好，现在看。”窗下摊着一幅圣像的底子，棉纸上刷了兰根熬的胶。霍奇特尔拈起一片蜂鸟羽毛按上去，歪了半分。安娜伸手把整块撕了下来：“重来。”那天她一共重贴了十一回。第十一回，安娜没伸手。"
stage = "witness"
window = [[1563, 4, 1], [1563, 7, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "xochitl"]
speaker = "ana_cruz"
mood = "cheerful"
news = "墨西哥城羽毛画坊来了个梅里达的表妹，头一天就被女画师撕掉了十一块羽毛，听说眼睛都没红。"

