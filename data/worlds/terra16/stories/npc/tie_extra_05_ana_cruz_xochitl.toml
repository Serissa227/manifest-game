[[tracks.chapters.variants]]
key = "ines"
when = [{ kind = "flag", flag = "c7_pair_xochitl_ines_solis_together" }]
text = "伊内斯抱着霍奇特尔的羽毛匣子站在画坊门槛外，怎么叫也不进来——安娜门口那块亮地方站不得人，她早记住了。霍奇特尔这天头一回被叫到表姐的正桌前，站定了就开口：“这算什么？墨西……”门外的伊内斯先笑出了声。安娜头也不抬：“别站在那儿挡光。换到这边——好，现在看。”棉纸上刷着兰根熬的胶。霍奇特尔按上去的第一片蜂鸟羽毛歪了半分，安娜伸手把整块撕了下来：“重来。”那天她一共重贴了十一回，伊内斯在门外一回一回替她数着。"

# 1564 春夏 · 靠近：清晨、正午、烛火下的同一根格查尔尾羽；外婆说过的羽毛
[[tracks.chapters]]
key = "tie_extra_05_ana_cruz_xochitl_closer"
title = "外婆说过的羽毛"
text = "安娜把一根格查尔鸟的尾羽插在窗框的缝里，叫霍奇特尔从天亮看起。清晨那绿像湖水，到了正午硬得像玉。“客人只认得一种绿，”安娜说，“你得三种都认得。”霍奇特尔盯着羽毛，忽然问：“外婆说过的那几种羽毛，到底都是什么意思？”安娜看了一眼门口，起身把门掩上，凑到她耳边一种一种讲。讲到格查尔，霍奇特尔没忍住出了声：“外婆叫我们‘我的绿羽毛’，原来是这个意思？”安娜在她胳膊上拧了一把，讲完才坐直：“这些不许写下来。”霍奇特尔半天没吭声。晚上点起蜡烛，那根尾羽黑得几乎看不见了，她才开口：“诺克纽。”"
stage = "witness"
window = [[1564, 3, 1], [1564, 7, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "xochitl"]
speaker = "xochitl"
mood = "tender"
news = "墨西哥城羽毛画坊的窗框上插着一根格查尔尾羽，女画师叫表妹从天亮看到点蜡烛，说一根羽毛有三种绿。"

