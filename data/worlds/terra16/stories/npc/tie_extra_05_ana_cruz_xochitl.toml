# 1567 春夏 · 落点：清晨、正午、烛火下各看一遍，没撕
[[tracks.chapters]]
key = "tie_extra_05_ana_cruz_xochitl_landing"
title = "没撕的那一幅"
text = "开春以后，霍奇特尔交上一幅圣母小像，袍子是格查尔的绿，底下压着一层蜂鸟的紫。安娜拿到窗边，清晨看一遍，正午看一遍，晚上点了蜡烛，举着烛台又看一遍，一句话也没说。霍奇特尔在桌子那头站了一整天，手边一碗新熬的兰根胶，等着撕了重贴。安娜把画放下：“挂到门口去。”霍奇特尔张了张嘴，这回连前半句也没有。她抱起画往门口走，走到门槛又回过头：“钉子呢？”安娜头也不抬：“左手第二个抽屉。”"
stage = "witness"
window = [[1567, 4, 1], [1567, 8, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "xochitl"]
speaker = "ana_cruz"
mood = "tender"
news = "墨西哥城羽毛画坊门口新挂了一幅圣母小像，是那个梅里达表妹做的。女画师看了一整天，居然没撕。"

