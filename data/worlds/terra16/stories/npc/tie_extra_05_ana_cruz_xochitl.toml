# C7：故事 2.0，遵循 A5 / E37“故事 2.0 TOML 契约”。
# 标签：GL（非恋爱）·师徒兼表姐妹。替代旧线 tie_extra_05_ana_cruz_maria_da_luz（改名，旧文件连同英文覆盖一并删除）。
# 人物：安娜·德·拉·克鲁斯（ana_cruz，1536-03-26，纯 GL，恋人线归 pair_ana_cruz_lucia，本线不写）；
#       霍奇特尔（xochitl，1540-09-07，纯 GL，恋人线归 pair_xochitl_ines_solis，本线不写）。1563 年霍奇特尔已满 22，全线只写师徒与亲情，没有任何恋爱效果。
# 依据：
#   史实——墨西加的羽毛镶嵌（amanteca）：棉纸或龙舌兰纸作底，刷兰根熬的胶，蜂鸟、格查尔鸟、鹦鹉的羽毛逐片叠贴，换个角度颜色就变；
#         老人们的训诫辞里把孩子叫作“我的玉、我的格查尔羽毛”（huehuetlatolli 的常见譬喻）；
#         1566 年阿维拉—科尔特斯密谋案：阿隆索·德·阿维拉兄弟据说要拥第二代谷地侯爵马丁·科尔特斯为王，8 月 3 日在主广场被斩首，宅子拆平撒盐，城里搜捕同党。
#   原创——师徒二人、画坊的印章与落款之争、三种光下看格查尔羽毛、两幅小像。
#   待核——1563 年主广场一带的建筑（旧大教堂、1562 年起改作总督府的科尔特斯新宅）只作背景一笔带过；“宅子撒盐”在 turning 里只用传闻口吻。
# 秘密：霍奇特尔从没去过墨西哥城——meeting 只写她在广场上站了半天不说话、口头禅说到一半咽回去，不点破；
#       安娜记得祖辈说的每种羽毛的意思——closer 只写她掩上门低声讲给表妹，内容只漏出一句。两件事都不进见闻。
# 缺省走向：玩家什么也不做，故事照样走完——1563 相识（tie mentor）→ 1564 三种光 → 1566 密谋案传闻 → 1566 冬落款之争（小像盖画坊的印，表妹在背面用炭条写名字）
#           → 1567 安娜第一次没撕她的画（tie mentor，设 c7_tie_extra_05_ana_cruz_xochitl_landing）。
# 玩家能做的：choice 章运来羽毛（_helped）或替霍奇特尔说话（_signed），只改变落款与回应，不改变师徒的结局。
# 共享旗标：设 c7_tie_extra_05_ana_cruz_xochitl_landing / _helped / _signed；
#           读 c7_pair_xochitl_ines_solis_together（meeting、landing 的 variants：伊内斯在画坊门口）。
# 变体：together 路径下两人 1562 年秋就从梅里达出走、1563 年初已在画坊（pair_xochitl_ines_solis 的 together 章），
#       meeting 的窗口整合时从 1563-04-01 起（together 窗口止于 1563-03-31，保证读得到）；所以 meeting 的 ines 变体写霍奇特尔头一回被叫到表姐正桌前，不写初到广场；landing 另加 both（两个旗标都在时）。
#       内核在满足条件的变体里取 key 字典序最小的一个（story2_variant 的 min_by_key），所以合写的变体用排在 ines、signed 之前的 key：both。
# 日程：霍奇特尔 1563 起在 mexico_city（人设卡已有），章节地点用 tenochtitlan；本线不改日程。

