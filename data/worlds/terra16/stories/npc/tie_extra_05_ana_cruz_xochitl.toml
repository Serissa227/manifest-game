# 1566 冬—1567 初 · 抉择：画坊只有一个名字；玩家可以运羽毛，或替表妹说话
[[tracks.chapters]]
key = "tie_extra_05_ana_cruz_xochitl_choice"
title = "画坊只有一个名字"
text = "入了冬，南边的羽毛还是没来。安娜那幅圣像停在圣徒的袍子上，一半贴好了，另一半还露着刷过胶的棉纸。霍奇特尔倒是做完了自己的第一幅小像：巴掌大的圣方济各，脚边停着一只蜂鸟。她拿炭条在角上比划：“这边写那瓦特字，这边写卡斯蒂利亚字。”安娜把画坊的印章往她面前一推：“画坊只有一个名字。”“那是你的名字。”“对。”霍奇特尔放下炭条，不说话了。表姐妹隔着一张桌子坐了一下午。我推门进来的时候，屋里只听得见安娜刮胶的声音。"
