# 1566 夏秋 · 转折（传闻）：阿维拉兄弟在主广场被斩，订单退了，脚夫不来了
[[tracks.chapters]]
key = "tie_extra_05_ana_cruz_xochitl_turning"
title = "广场上的刑台"
text = "八月里，阿维拉家的两兄弟在主广场上被砍了头，说是要拥那位侯爵做新西班牙的王。他们家的宅子听说要拆平了撒盐。城里天天有人被带走，订了羽毛圣像的几家老爷都关了大门，管家上门退订，羽毛画坊一连退了三份。南边背羽毛的脚夫也不来了，说路上查得紧，背篓都要倒出来翻。街坊问女画师还开不开门，她说：“照开。羽毛不够，就先做小的。”她那个梅里达来的表妹在后头嘀咕：“小的才费眼睛。”"
stage = "rumor"
window = [[1566, 7, 15], [1566, 10, 31]]
at = "tenochtitlan"
cast = ["ana_cruz", "xochitl"]
mood = "tense"
news = "墨西哥城主广场斩了阿维拉家的兄弟，城里天天抓人。羽毛画坊一连退了三份圣像的订单，女画师说门照开。"

