# 抉择：1583 夏。烧掉的是一批赊进来的生丝；船主要钱，买主要货；账的线烧断，一人攥着一沓。
[[tracks.chapters]]
key = "tie_new_catarina_pereira_lin_hui_choice"
title = "谁先付钱"
text = "火后，林家在烧剩的石脚上搭了个草棚，长桌照旧摆在门口，桌上只剩那本燎了角的合账。装订的线烧脆了，一碰就散，成了两沓。仓库里烧掉的是一批生丝，是林蕙趁卡塔丽娜在澳门时赊进来的，账上照例写着两个名字。如今福建船主天天来要钱，订了货的西班牙商人天天来要货。卡塔丽娜攥着前一沓：“货没过我的手。按葡萄牙人的规矩，没交到我手上的，烧了也不算我的。”林蕙攥着后一沓：“按八连的规矩，账上写了谁就是谁的。你的名字在这一行，跟我的一般高。”两人头一回吵翻，草棚外围了一圈人。末了一个转过身来，另一个也转过来，两沓账一左一右，一齐递到我面前。"
stage = "involve"
window = [[1583, 5, 1], [1583, 8, 31]]
at = "manila"
cast = ["catarina_pereira", "lin_hui"]
speaker = "lin_hui"
mood = "tense"
news = "马尼拉大火以后，八连那两个合记账的女人为一批烧掉的生丝该谁先付钱吵翻了，一人攥着半本账。"

[tracks.chapters.default]
next = "tie_new_catarina_pereira_lin_hui_landing"
effects = []
news = "马尼拉八连那两个合记账的女人吵了七天，烧掉的生丝钱最后对半分了：葡萄牙女人找澳门的船东借，林家女儿找同乡借。"

[[tracks.chapters.choices]]
key = "front_payment"
text = "先替她们垫上生丝钱，让福建船主回船上去。"
reply = "我把银子数在草棚的桌上，福建船主一锭一锭验过，回船去了，门口一下子清静下来。卡塔丽娜先开口：“这笔钱算我们两个借的，一人还一半。”林蕙已经把两沓账摞回一处，拿麻线一针一针重新穿：“还的时候，借据也写两个名字，一般高。”穿好了，她翻到新的一页记下这笔借款，把笔递给我：“债主的名字，写最上头那一行。”"
next = "tie_new_catarina_pereira_lin_hui_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_catarina_pereira_lin_hui_helped" }, { kind = "affinity", person = "catarina_pereira", value = 3 }, { kind = "affinity", person = "lin_hui", value = 3 }]
news = "马尼拉八连那两个合记账的女人，有个过路的船长替她们垫了生丝钱，福建船主当天就收了银子回船。"

[[tracks.chapters.choices]]
key = "one_rule"
text = "替她们定个规矩：火是两个人的，烧掉的按账上并排的名字对半。"
reply = "两人一齐瞪着我，又转过去瞪着对方。草棚外有人笑出了声。林蕙先绷不住，也笑了，把手里那沓往桌上一拍：“名字都写并排了，还吵什么。”卡塔丽娜哼了一声，没接话，从袖子里摸出一截麻线，把两沓账对齐，一针一针重新穿起来。穿到最后一个眼，她才开口：“丝钱我出一半。下回赊货，先等我回来。”"
next = "tie_new_catarina_pereira_lin_hui_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_catarina_pereira_lin_hui_mediated" }, { kind = "affinity", person = "lin_hui", value = 5 }]
news = "马尼拉八连那两个吵翻的女人，听外乡船长说了一句，把烧掉的生丝钱对半分了，散成两沓的账又穿回了一本。"

# 落点：1584 春夏。两种字的合伙契约（照合账的样子，落款一边一个）；旧账钉上新墙。所有路径同一结局，只按旗标换正文。
[[tracks.chapters]]
key = "tie_new_catarina_pereira_lin_hui_landing"
title = "并排的名字"
text = "八连的铺子盖起来了，新门板还透着松木的生味。开张这天，卡塔丽娜从澳门带来一张合伙的契约，照那本合账的样子，左边汉字，右边葡萄牙字，中间一道线，落款的地方一边一个，一般高。卡塔丽娜先签，把笔递过去：“先把名字写并排——”林蕙接过笔：“——欠账就不会算两遍。”签完，她从柜底取出那本燎了角的旧账。线是火后重穿的，结打得歪歪扭扭。卡塔丽娜扶着，林蕙踮起脚，拿铁钉把它钉上新墙，正对着长桌。钉到最后一根，卡塔丽娜说：“翻到生丝那一页，朝外。”林蕙瞪了她一眼，还是翻了。"
stage = "witness"
window = [[1584, 3, 1], [1584, 7, 31]]
at = "manila"
cast = ["catarina_pereira", "lin_hui"]
speaker = "catarina_pereira"
mood = "cheerful"
news = "马尼拉八连新盖的一间铺子，墙上钉着一本燎了角的旧账，朝外那页记的是一批烧掉的生丝；铺主是林家的女儿和澳门来的葡萄牙女人。"

