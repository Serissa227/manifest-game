text = "八连的铺子盖起来了，新门板还透着松木的生味。开张这天，卡塔丽娜从澳门带来一张合伙的契约，照那本合账的样子，左边汉字，右边葡萄牙字，落款的地方一边一个，一般高。末一行记着火后借我的那笔银子：一人还一半，已清。卡塔丽娜先签，把笔递过去：“先把名字写并排——”林蕙接过笔：“——欠账就不会算两遍。”签完，她又把笔递给我：“清了的账，也得有债主的名字。”然后她从柜底取出那本燎了角的旧账，线是她在草棚里重穿的。卡塔丽娜扶着，林蕙踮起脚，拿铁钉把它钉上新墙。钉到最后一根，卡塔丽娜说：“翻到生丝那一页，朝外。”林蕙瞪了她一眼，还是翻了。"

