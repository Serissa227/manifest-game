# 依据：
#   史实——1580 年葡萄牙王位归西班牙国王腓力二世（1581 年托马尔议会承认），此后澳门与马尼拉之间渐有船来往；
#         1581 年前后总督龙基略在马尼拉城外划出八连（Parián）安置华商；1583 年 2 月龙基略出殡时教堂起火，
#         大半个马尼拉城烧毁，八连也在其中。马尼拉的大船停在外港，货要用驳船运进城下。
#   原创——两人的合伙；林家门口两种字的账；驳船钱在两本账里各记一遍；合记的第三本账；赊进来的生丝；
#         火后的草棚、照合账样子写的两种字的合伙契约、钉在新墙上的旧账。
