# 靠近：1582 春夏。合记一本账，中间一道线，货主一栏两个名字一般高；林家老爷子看不懂。
[[tracks.chapters]]
key = "tie_new_catarina_pereira_lin_hui_closer"
title = "第三本账"
text = "第二年开春，卡塔丽娜又来了。林家的门板刚卸下第一块，她已经站在桌前——八连哪家几时开门，她来过一趟就记住了。她把一本新订的账簿拍在两本旧账中间：“两本账对来对去，太累。往后合记这一本。”林蕙翻开，回头用闽南话叫伙计磨墨，又转过来：“货主写谁？谁写前头？”卡塔丽娜拿笔在页当中竖着划了一道。左边林蕙写汉字，右边她自己写葡萄牙字；货主一栏，两个名字隔着那道线，一般高。头一笔记的是二十担胡椒。林蕙的父亲背着手出来，拿起账簿翻了翻，又倒过来看：“这样的账，谁看得懂？”“那正好。”卡塔丽娜把笔递给林蕙，“看得懂的，就这张桌子两边的人。”老人把账簿放下，把算盘往两人中间推了推，回屋去了。"
stage = "witness"
window = [[1582, 3, 1], [1582, 7, 31]]
at = "manila"
cast = ["catarina_pereira", "lin_hui"]
speaker = "catarina_pereira"
mood = "cheerful"
news = "马尼拉八连林家有一本账，左边汉字，右边葡萄牙字，货主一栏两个女人的名字一般高，林家老爷子倒过来看也没看懂。"

