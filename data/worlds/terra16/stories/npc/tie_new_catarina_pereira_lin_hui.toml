when = [{ kind = "flag", flag = "c7_tie_new_catarina_pereira_lin_hui_mediated" }]
text = "八连的铺子盖起来了，新门板还透着松木的生味。开张这天，卡塔丽娜从澳门带来一张合伙的契约，照那本合账的样子，左边汉字，右边葡萄牙字，落款的地方一边一个。头一条是我那天在草棚里说的话：遇火遇水，按账上的名字对半。第二条是卡塔丽娜添的：赊货，等两个人都在。卡塔丽娜先签，把笔递过去：“先把名字写并排——”林蕙接过笔：“——欠账就不会算两遍。”签完，她从柜底取出那本燎了角的旧账，线是卡塔丽娜在草棚里重穿的，结打得歪歪扭扭。卡塔丽娜扶着，林蕙踮起脚，拿铁钉把它钉上新墙。钉到最后一根，卡塔丽娜说：“翻到生丝那一页，朝外。”林蕙瞪了她一眼，还是翻了。"
