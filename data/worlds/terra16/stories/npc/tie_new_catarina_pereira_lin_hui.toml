# 转折：1583 年 2—4 月，传闻。总督出殡那天的大火；账抢出来了，仓库烧光。
[[tracks.chapters]]
key = "tie_new_catarina_pereira_lin_hui_turning"
title = "大火"
text = "总督出殡那天，城里的教堂点满了蜡烛。有人说是灵前的烛火燎着了帷幔，火顺着竹墙草顶一路烧过去，大半个马尼拉城成了黑地，八连的铺子也烧了一排。码头上传得最多的是林家的女儿。挑水的说，火到门口，她没去抱钱匣，抱出来的是一本账，蹲在街当中拿袖子拍账皮上的火星。邻居骂她糊涂，她头也不抬：“银子烧化了，捡起来还是银子。账烧了，谁欠谁就说不清了。”两个女人合租的那间港口仓库，没人顾得上，只剩几根石柱。半个月后澳门的船进港，那个葡萄牙女人一上岸就往八连跑，站在烧黑的门框前问：“货呢？”林家女儿把账举起来：“在账上。”"
stage = "rumor"
window = [[1583, 2, 15], [1583, 4, 30]]
at = "manila"
cast = ["catarina_pereira", "lin_hui"]
mood = "tense"
news = "总督出殡那天马尼拉起了大火，八连烧了一排铺子；挑水的说，林家女儿从火里只抢出一本账，钱匣子留在了屋里。"

[tracks.chapters.default]
next = "tie_new_catarina_pereira_lin_hui_choice"
