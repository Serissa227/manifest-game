#           → 1583 年 2—4 月传闻：大火，账抢出来了，港口仓库烧光 → 1583 夏为烧掉的生丝谁先付钱吵翻，
#           吵了七天对半分 → 1584 春夏签合伙契约，旧账钉上新铺子的墙（tie friends，回忆“并排的名字”）。
