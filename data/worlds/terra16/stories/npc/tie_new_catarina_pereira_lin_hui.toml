# 人物：卡塔丽娜·佩雷拉 catarina_pereira（1537-12-05，女，romance.with = m；定居澳门的葡萄牙船长之女；
#       恋人是陆归帆，见 pair_lu_guifan_catarina_pereira，本线不写）；
#       林蕙 lin_hui（1538-06-08，女，romance.with = any；马尼拉八连的华商之女；
#       恋人是佩德罗·德·奥坎波，见 pair_lin_hui_pedro_ocampo，本线不写）。
