# 相识：1581 春夏。澳门来的头一条船；一笔驳船钱，汉字账叫“水脚”，西文账叫“驳船钱”，各扣了一遍。
[[tracks.chapters]]
key = "tie_new_catarina_pereira_lin_hui_meeting"
title = "两种账簿的桌子"
text = "八连的泥墙还没干透，林家门口的长桌先摆了出来：左边汉字账，右边卡斯蒂利亚文账，算盘横在中间。葡萄牙归了西班牙国王，码头上都说这是澳门来的头一条船。押货的卡塔丽娜来对账，开口一句唐话。林蕙听了半天：“你这是广府话，我是漳州人。”两人索性一个说葡萄牙话、一个回卡斯蒂利亚话，也通了七八成。卡塔丽娜把两本账翻了三遍：“先把名字写并排，再谈是谁家的。我这船货，在你这儿有两个名字。”林蕙把两本账推到一处，书脊碰着书脊：“字不同，欠账不能算两遍。”对到点灯，她的指头停在“水脚”上，又挪到对面的“驳船钱”：同一趟驳船，同一个数。银子推过去，卡塔丽娜一把扫进荷包：“八连哪家馆子关门最晚，我早问清了。这顿我请。”"
stage = "witness"
window = [[1581, 3, 1], [1581, 7, 31]]
at = "manila"
cast = ["catarina_pereira", "lin_hui"]
speaker = "lin_hui"
mood = "cheerful"
news = "马尼拉八连林家门口那张摊两种账的桌子，跟澳门来的葡萄牙女人对到点灯，对出一笔扣了两遍的驳船钱。"

[tracks.chapters.default]
next = "tie_new_catarina_pereira_lin_hui_closer"
