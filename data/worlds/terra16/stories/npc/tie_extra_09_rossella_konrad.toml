# 五、落点：1562 年，白印洗得掉。缺省即圆满。
[[tracks.chapters]]
key = "tie_extra_09_rossella_konrad_landing"
title = "白印洗得掉"
text = "康拉德拎着旧皮箱到了塞图巴尔，韦尔泽的差事辞了，来替盐田记账，箱里是几本他自己记的小账。他在盐田的田埂上站定，第二次问：“收工以后，我能不能见你？”“能。”罗塞拉答得很快，像她的手一样快，“先、先把这个洗了。”她把一件盐渍的工衣塞进他怀里，自己端起木盆往水边走。两人并排蹲在石头上搓衣服。她看了一会儿就笑：“你搓得太轻，盐、盐不会走的。”他脸红了，老实又搓一遍，工衣袖口的白印一圈一圈淡下去。“金子没到，”他说，“人先到了。”“我、我早就把你算进去了。”她在他嘴角碰了一下，咸的。"
stage = "witness"
