# 三、转折：1560 年，韦尔泽烂账的传闻（rumor）。
[[tracks.chapters]]
key = "tie_extra_09_rossella_konrad_turning"
title = "租约结束以后"
text = "塞维利亚来的赶骡人在塞图巴尔的盐田边歇脚，说起韦尔泽家：委内瑞拉的租约早几年就收了，留下一屁股烂账，一笔滚着一笔。商行想叫驻塞维利亚的那个年轻代理人，拿黄金国的故事去哄新的出资人。他把笔一搁：“黄金国的故事我爱讲，讲给孩子听。拿它去收人家的本钱，不行。”商行就扣了他半年的薪水。秤边蹲着数袋子的盐田长女听到一半，手里数袋子的结绳掉在了地上。“又、又掉了，”她小声说，“偏偏赶上今年。”赶骡人不知道她说的是绳子还是运气。那以后收盐的日子，秤旁边他歇腰的那块石头常常空着。"
stage = "rumor"
window = [[1560, 3, 1], [1560, 6, 30]]
at = "lisbon"
cast = ["rossella", "konrad"]
mood = "tense"
news = "塞图巴尔盐田边传开了：韦尔泽在委内瑞拉的烂账越滚越大，塞维利亚的年轻代理人因为不肯拿黄金国的故事去招本钱，被扣了半年薪水。"

