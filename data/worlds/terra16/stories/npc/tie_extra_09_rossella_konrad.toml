# 二、靠近：1559 年收盐的季节，眼泪被看穿。
[[tracks.chapters]]
key = "tie_extra_09_rossella_konrad_closer"
title = "收盐的季节"
text = "收盐的季节，康拉德自己扛盐袋，扛到第三趟，靠着秤边的石头直不起腰。罗塞拉蹲在秤旁等他，先抓一撮洒了的盐往左肩后扔，才开口：“你、你的佣金每袋三个铜子，太贵了……我家十一张嘴……”声音越说越细，一颗眼泪掉进秤盘，又一颗。康拉德没见过谁哭得这么安静，慌忙翻开账本：“减半！减半行不行？”第二天他来取最后一批盐，远远看见罗塞拉盘腿坐在堤上，把撒了粗盐的饼分给一排弟妹，笑声传遍盐田。最小的那个浑身扑满盐粉，举着两只白手喊：“我是黄金国的国王！”那是康拉德歇脚时讲的故事。他站在堤下想起秤盘里那两颗眼泪，上去在她身边坐下，揉着腰：“我、我下回不让了。”罗塞拉的脸从脖子红到耳根。她把最大的一块饼塞进他手里。"
stage = "witness"
window = [[1559, 7, 15], [1559, 10, 15]]
at = "lisbon"
cast = ["rossella", "konrad"]
speaker = "konrad"
mood = "cheerful"
news = "塞图巴尔收盐的季节，韦尔泽的代理人自己扛盐袋，被盐田的长女哭着砍掉了一半的佣金。"

[tracks.chapters.default]
