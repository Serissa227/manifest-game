# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BG（恋爱线；罗塞拉只对男性开放，康拉德对任何人开放，两人都空着，本线是他们各自唯一的恋情）。
# 人物：罗塞拉·萨利纳（rossella，1534-01-07，塞图巴尔盐田人家的长女，底下一串弟妹）；
#       康拉德（konrad，1533-07-10，奥格斯堡韦尔泽商行驻塞维利亚的年轻代理人）。
#       生年相差半年；第一章窗口起日 1558-03-01 时两人都是 24 岁，落点窗口起日 1562-03-01 时都是 28 岁，lovers 无年龄障碍。
# 依据·史实：奥格斯堡的韦尔泽家 1528 年起承租委内瑞拉，1556 年租约被收回，留下一堆烂账与寻找黄金国的传说；
#       塞图巴尔是葡萄牙最大的海盐产地，海盐七到九月收，盐货经里斯本装船北运；欠条（汇票）与金币的区别是商行里人人要学的功课。
# 依据·原创：两个人；盐田人家的长女与她的十一张嘴；袖口的盐印、水桶、每袋三个铜子的佣金、弟妹玩的“黄金国国王”、四十杜卡特的欠条（康拉德当金子收下的）、
#       账本最后一页的“分期还”、并肩洗衣。
# 待核：韦尔泽驻塞维利亚的代理人是否经手葡萄牙的盐货（本线这样写；佣金只给“每袋三个铜子”这一个数，欠条四十杜卡特是虚构的数目）；葡萄牙盐工的专称（正文只写“盐工”）；
#       “租约被收回”之后韦尔泽家的烂账细节（见闻与传闻只写“越滚越大”，不给数字）。
# 地点：塞图巴尔没有单独的地点 key，盐货经里斯本出货，章节 at 一律用 lisbon，正文与见闻写塞图巴尔的盐田。
# 秘密：罗塞拉有时是故意哭的——只在第二章被康拉德看穿，别处不再提；见闻写成“哭着砍价”，不替她解释。
# 缺省走向（玩家什么也不做）：1558 春相识（friends）→ 1559 秋收盐季，眼泪被看穿（crush）→ 1560 韦尔泽烂账的传闻，
#       康拉德来得少了 → 1561 欠工钱，他把佣金划到最后一栏，慢慢还欠商行的一张欠条，来年春天才辞得掉
#       → 1562 他到塞图巴尔替盐田记账，成为恋人（lovers，圆满）。玩家能做的：替他还欠条（helped）或陪她对账（listened），
#       只让他早些辞掉、让她少熬几夜；两人爱上对方，不取决于玩家。
# 读的旗标：无。设的旗标：c7_tie_extra_09_rossella_konrad_helped、_listened（choice）、_together（landing 的 default）。
#       landing 的 helped 变体读 _helped。
# 日程：康拉德从缺省落点日 1562-07-31（landing 窗口末日）起由 seville 改到塞图巴尔（缺省路径；cast 里 setubal 若不是合法地点 key，则用 lisbon）；
#       罗塞拉 cast 日程里写的是 setubal，整合时与地点表对一遍。
# 整合：cast/ties.toml 的 extra_09_rossella_konrad 现为 friends，since 1558-12-31；改为三段，起日对齐缺省路径各章的窗口末日——
#       friends（since 1558-06-30，to 1559-10-14）、crush（since 1559-10-15，to 1562-07-30）、lovers（since 1562-07-31）。
# 不写：罗塞拉追查的“怪盐”（她自己的请托轨道）；康拉德旧账里把人记在布匹旁边的细节（只用口头禅轻轻带一笔）。

