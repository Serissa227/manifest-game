# 一、相识：1558 年春，袖口的白印与一只水桶。
[[tracks.chapters]]
key = "tie_extra_09_rossella_konrad_meeting"
title = "袖口的白"
text = "康拉德踩着潮泥进了盐田，来谈一船盐的买卖。他一身体面，只有右边袖口一圈白印，硬挺挺的——下过盐仓的人才有。罗塞拉蹲在盐堆后头一眼瞧见，手比眼快，抓过他的手腕翻来看：“你、你自己下去的？”康拉德以为要挨夸，胸一挺，讲起韦尔泽这笔大生意。她拎来一只木桶，往他脚边一放。“先、先洗。盐干在袖子上会硬，会割手。”他蹲下去搓，嘴里没停：“船是有了，工钱要等塞维利亚的汇票。金子没到，先别把人算进去。”罗塞拉只听懂一半：装船的人不算，那就全是她家的人扛。她细声细气报了价，比平时高一成。康拉德洗到第三遍才回过味来，叹口气，在契约上签了名。袖口淡了，没净。"
stage = "witness"
window = [[1558, 3, 1], [1558, 6, 30]]
at = "lisbon"
cast = ["rossella", "konrad"]
speaker = "rossella"
mood = "cheerful"
news = "塞图巴尔的盐田里，长女让韦尔泽的代理人先洗袖子再谈价，洗完才发现，盐价已经涨了一成。"

[tracks.chapters.default]
next = "tie_extra_09_rossella_konrad_closer"
