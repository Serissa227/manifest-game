# 四、选择：1561 年，欠了三个月的工钱，和一张当金子收下的欠条。
[[tracks.chapters]]
key = "tie_extra_09_rossella_konrad_choice"
title = "先还小账"
text = "盐田的工钱欠了三个月。我来取货单，赶上账房棚里点着灯，罗塞拉把铜子一堆一堆码在桌上，快得像洗牌，嘴里念着：“老若昂，十二天。两个阿丰索，各九天……”先发工人，再算康拉德的佣金，这是她定的。康拉德把自己那一栏划到最后，笔尖停了停，抬头问：“收工以后，你能不能见我一面？”他说他想辞了韦尔泽。可有一张欠条——四十个杜卡特，他前些年当金子收下的，商行说谁收的谁认——不还清，辞呈递不上去。罗塞拉的手停在半空，结巴了半天：“先、先把账做完。”说完，她和康拉德一起看向我。"
stage = "involve"
window = [[1561, 4, 1], [1561, 7, 31]]
at = "lisbon"
cast = ["rossella", "konrad"]
speaker = "rossella"
mood = "tender"
news = "塞图巴尔盐田发工钱，韦尔泽的代理人把自己的佣金划到了最后一栏。"

