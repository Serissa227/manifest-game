# 靠近：赛后台阶上的对歌，一首只唱了上半句。
[[tracks.chapters]]
key = "tie_wati_nyai_closer"
title = "台阶上的对歌"
text = "这一年的班顿大赛散了场，评判和看热闹的人都下了山。吉里山上清真寺的石阶还留着白天的热气，几个女孩没走，坐在台阶上接着对，不记输赢。瓦蒂起兴只用班达的岛，奈拉、隆托尔、艾岛、伦岛，十一座轮着来；奈·加玛拿万丹那一路的码头回她，蓬当、吉格德、丹格朗，一句比一句快。月亮从海上升起来，两边还没断过一回。最后一首，瓦蒂唱了上半句：“艾岛的潮退到礁石外，伦岛的船还没有回来——”就停了。旁边的女孩催奈·加玛接。她等了很久，没有接：“第一，这一句你自己留着。”说着解下割麻袋绳的小刀，在瓦蒂脚边那个椰子顶上削开一个口，“第二，一人一半。”瓦蒂接过去，喝到一半，停下来递了回去。"
stage = "witness"
window = [[1555, 6, 1], [1555, 9, 30]]
at = "gresik"
cast = ["wati", "nyai_gama"]
speaker = "wati"
mood = "tender"
night = true
news = "格雷西克的吉里山上，散了赛的女孩们坐在清真寺台阶上对班顿，对到月亮出来；有一首只唱了上半句，没人接。"

