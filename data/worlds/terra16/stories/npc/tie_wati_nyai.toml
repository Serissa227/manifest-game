# 不相让的下半句（tie_wati_nyai）——C7 重写，2026-10-11，Claude（Opus）执笔。
# 标签：GL（非恋爱）；对手兼知己。瓦蒂不开放恋爱，奈·加玛只对男性：全线没有心动、没有恋爱效果，也不写“心照不宣”。
# 人物：瓦蒂（wati，1540-04-25，班达长老的女儿）；奈·加玛（nyai_gama，1540-03-20，万丹胡椒商家的女儿）。两人同在吉里学院，1554 年都是十三四岁。
# 依据（史实）：
#   - 班顿（pantun）四行一首，前两行起兴、后两行点题，韵脚多为 ABAB，也有四行同韵。
#   - 班达群岛通常数作十到十一座岛：奈拉、隆托尔（大班达）、火山岛（古农阿皮）、艾岛、伦岛……；火山岛常年冒烟。
#   - 蓬当、吉格德、丹格朗是巽他—万丹沿岸的旧港，托梅·皮雷斯《东方志》（1512—1515）列巽他诸港时有记（中文译名待核）。
#   - 格雷西克附近的吉里山上有苏南·吉里的清真寺与学堂（吉里学院以此为原型）。
#   - 一至四月爪哇海刮西季风：往班达顺风，往万丹逆风、只能贴岸走。
# 依据（原创）：独占契约、两人的译本与十份抄本、学院里的对歌、全部台词与班顿。史实上葡萄牙人始终没能在班达立住独占，
#   这里的契约是本世界线的事，正文只用码头传闻的口吻讲。
# 去重：班顿大赛的决赛（bond_raja_muda）与台下挑错（bond_suma）不写，这里只写女孩们自己的对歌；
#   瓦蒂的秘密（算错丁香斤两、借影戏认错）与奈·加玛的秘密（未寄的买船信）都归她们的羁绊线，本线不碰——落点的对骂用豆蔻价，避开丁香。
# 缺省走向：码头吵价（rivals）→ 吉里山台阶上的对歌 → 传闻：马六甲商人的独占契约 → 十份抄本（玩家可替她们找快船 _helped，
#   或劝两人合写一首班顿随抄本走 _mediated；不插手则抄本晚到两个月）→ 1557 年初两条船同时解缆，隔水对歌（rivals、_landing、回忆）。
# 旗标：写 c7_tie_wati_nyai_helped、c7_tie_wati_nyai_mediated、c7_tie_wati_nyai_landing；不读外部旗标。
# 日程：cast 里两人 1557-01-01 起已分别在班达奈拉、万丹；落点窗口 1557-01-15..04-30 写的是离开格雷西克那一天（窗口沿用简报）。

