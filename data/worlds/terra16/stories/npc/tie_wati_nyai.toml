# 抉择：十份抄本，学院不放她们出海。
[[tracks.chapters]]
key = "tie_wati_nyai_choice"
title = "先送给种树的人"
text = "讲堂后面的长桌上摊着十份抄本。瓦蒂和奈·加玛熬了三个晚上，找码头上的通事一句一句问，把那张契约连后面几条葡萄牙文一起译成马来话，一份份抄齐——字圆的是瓦蒂，字方的是奈·加玛。可学院不放学生出海。瓦蒂把十份都拢到自己那边：“先送班达。种树的人还不知道后面写的是什么。”奈·加玛伸手抽走四份：“第一，班达要送。第二，万丹也要送。班达不按手印，那人下一趟就去万丹。”她们头一回站在同一张桌子后面，对面是我。瓦蒂把六份推到我面前，奈·加玛把她那四份码齐，压在上面。"
stage = "involve"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "gresik"
cast = ["wati", "nyai_gama"]
mood = "tense"
news = "格雷西克吉里学院的两个女学生抄了十份契约译文，要送到班达和万丹种树的人手里，可学院不放她们出海。"

