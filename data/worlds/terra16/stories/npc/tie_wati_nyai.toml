# 落点：结业后两条船同时解缆，一东一西，隔水对歌。
[[tracks.chapters]]
key = "tie_wati_nyai_landing"
title = "隔海还嘴"
text = "结了业，瓦蒂回班达，奈·加玛回万丹。两条船在格雷西克一起解缆，一条借着西风往东，一条逆着风贴岸往西，中间的水一点点宽起来。奈·加玛先唱，把账本卷成筒凑在嘴边，上半句骂的是班达的豆蔻价：“火山的烟往东飘，班达的豆蔻贵过金——”瓦蒂站在船尾，等她唱完，才慢慢接下半句，骂万丹的胡椒秤：“万丹的秤砣做得巧，一斤胡椒少半……”后面那个字让风吹走了，码头上的船工伸长脖子也没听全。“下回哪天到港？”奈·加玛隔着水喊。“先让种树的人说！”"
