# 转折（传闻）：独占契约的抄本传到学院。
[[tracks.chapters]]
key = "tie_wati_nyai_turning"
title = "独占的字"
text = "格雷西克码头的槟榔摊前，这些天都在传一张纸。马六甲来的商人要去班达，找种豆蔻的头领按手印：全岛的豆蔻只卖他一家，价钱十年不变。纸上马来文和葡萄牙文对照着写，写到后面几条，就只剩葡萄牙文了。抄本在码头上转了一圈，转进了吉里学院。有人说，班达长老家的瓦蒂看到一半，把自己替岛上拟的明年价目撕了，只说了一句：“十年。他连明年都替我们说了。”又有人说，万丹的奈·加玛蹲下去，把碎纸一片片捡起来拼好，拿秤砣压住：“先别撕。看清哪几个头领还没拿到这张纸。”"
stage = "rumor"
window = [[1556, 3, 1], [1556, 6, 30]]
at = "gresik"
cast = ["wati", "nyai_gama"]
mood = "tense"
news = "马六甲来的商人带着一纸独占契约要去班达找种豆蔻的头领，后面几条只有葡萄牙文；格雷西克码头上抄本传了一圈。"
