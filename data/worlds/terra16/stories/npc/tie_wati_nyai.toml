# 相识：码头上的价目牌。
[[tracks.chapters]]
key = "tie_wati_nyai_meeting"
title = "价钱不押韵"
text = "散了课，格雷西克码头上的货摊还没收。奈·加玛的胡椒摊前竖着一块刷白的木板，炭笔写着两行：“东风送船到万丹，胡椒一担七百钱。”隔壁豆蔻摊的瓦蒂念了一遍，慢慢摇头：“你这价目像一首坏班顿。起头是海，点题是钱，中间什么也没有。”奈·加玛的手还按在秤杆上，眼都不抬：“那我补下半句——谁嫌胡椒压秤底，先去班达称瓦蒂。”卸货的船工笑得直拍麻袋。瓦蒂也笑，笑够了，把一捧豆蔻倒进秤盘：“先让种树的人说价。”奈·加玛把钱匣一扣：“下回哪天到港，先说清。”一个船工趁乱想压价，两个女孩同时转过头。“七百。”“一千四。”"
stage = "witness"
window = [[1554, 2, 1], [1554, 5, 31]]
at = "gresik"
cast = ["wati", "nyai_gama"]
speaker = "nyai_gama"
mood = "cheerful"
news = "格雷西克码头上，班达长老家和万丹胡椒商家的两个女孩拿班顿吵价，船工收了工也不走，等着听下一句。"

