# m1_tables：马六甲的星表。L23 的日期由 C10 按日食表定，deadline 与 m2 的期限随之调。
[[tracks.chapters]]
key = "m1_tables"
title = "一包星表"
text = "马六甲克林人街后面的清真寺，正午的日头晒得石板发白，门口的水缸边搭着一根晾布的竹竿。她把一包油布裹好的星表推到你面前，包角压着一小块铅，压得很死。广州的回回人等着它，要拿它跟大统历比一场日食。她自己被马六甲的税官盯上了，这几天走不开。门口的孩子拿竹签在地上画星图，画到一半被税官的靴子踩花了。她说你的船往东去，正好。你伸手去拿，她却先把你的罗经拿过去看了一眼：“偏东半指，不碍事。”然后才松手，“表到了不会推的人手里，就是一叠纸。给老教长，别给别人。”"
at = "malacca"
speaker = "najma"
mood = "tense"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1573, 1, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1574, 1, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "carry"
text = "接下星表，替她送去广州"
next = "m2_guangzhou"
effects = [{ kind = "affinity", person = "najma", value = 3 }]
reply = "她把油布包的结又紧了一扣，交到你手里，嘱咐你别让海水沾着，也别让税官的眼睛沾着。这一包要是湿了，广州的老教长就得拿一叠纸去跟太阳对，对不上，就只能照旧历报。她说完，又看了一眼你的罗经，没有再说什么。"

[[tracks.chapters.choices]]
key = "pay_tax"
text = "替她把马六甲的税付了，让她自己去"
next = "done"
requires = [{ kind = "cash", ge = 600 }]
effects = [{ kind = "cash", value = -600 }, { kind = "affinity", person = "najma", value = 6 }]
hint = "你的钱袋不够。"
reply = "她数了数你付的税单，揣进袖子，话也没说一句，当夜就开了船。税官在岸上站了半天，最后只得放她走。船离岸时她在艄上站了一会儿，朝你喊了一句：“到广州我替你说一声。”风把后半句吹散了，你只听见一个“声”字。"

[[tracks.chapters.choices]]
key = "decline"
text = "不接：这一程你不往东"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = -2 }]
reply = "她点了点头，把表收回包里，一句也没有多说，转身去找下一条船。那一包星表她自己背着，一步一步走上码头。走到码头口，她又回头看了一眼你停在湾里的船，像是在记它的吃水。她背着包的肩膀往下沉了一寸，走得却还是很稳。"

# m2_guangzhou：限期到港；星表在日食前送到。
[[tracks.chapters]]
key = "m2_guangzhou"
title = "怀圣寺的老教长"
text = "广州城西，怀圣寺的光塔顶上立着一只金鸡风向标，风一转，鸡头就对着海。光塔底下一排卖香料的摊子，摊主们把扇子拍得啪啪响，眼睛全盯着这边。一个小童捧着纸灯笼从人群里挤过去，灯笼上画着一条鲤鱼。老教长在寺门口等着，手里的念珠没停过。门外站着一个穿青袍的大统历书吏，也在等，攥着一只鼓鼓的钱袋，袋口的绳子已经解开一半。老教长问：“她托的人，就是你？”青袍书吏抢着说：“交给我，对谁都好。”他开的价，比运一船胡椒还多。"
at = "guangzhou"
mood = "tense"
cast = ["najma"]
objectives = [{ kind = "at", at = "guangzhou", text = "在日食之前把纳吉玛的星表送到广州" }]
deadline = [1574, 5, 31]
timeout = { next = "done", effects = [{ kind = "affinity", person = "najma", value = -5 }], news = "广州怀圣寺的人说，马六甲托来的星表晚到了，日食那天他们只能照旧历报。" }

[[tracks.chapters.choices]]
key = "deliver"
text = "把表交给老教长"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = 12 }, { kind = "flag", flag = "c13_npc_najma_eclipse_data" }]
reply = "老教长捧着油布包上了光塔，一级一级走得很慢，说要在塔顶念一遍经再交出去。风把念经的声音吹下来，断断续续的。他没有问你走了多少日子，只说了一句：“她托的东西，到了。”后来有船从马六甲来，带来她一句话：“那个人可靠。”"
news = "广州怀圣寺的老教长说，马六甲来的星表是一个外国船长替那个阿拉伯女领航送到的。"

[[tracks.chapters.choices]]
key = "sell"
text = "把表卖给青袍书吏"
next = "done"
effects = [{ kind = "cash", value = 2000 }, { kind = "affinity", person = "najma", value = -10 }]
reply = "书吏把表锁进雕花匣子，钱袋递过来时，一个铜子也没有掉。匣子上的雕花是新刻的，漆味还没散。他拍了拍匣子，像是在拍一笔已经落袋的账，走出寺门时还回头看了一眼光塔的窗。老教长看了你一眼，什么也没说，关上了寺门。"
news = "广州城西的书吏买下了一部马六甲来的星表，怀圣寺的老教长在光塔上站了一下午。"

