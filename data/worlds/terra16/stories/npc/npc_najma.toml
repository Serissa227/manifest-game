next = "done"
effects = [{ kind = "affinity", person = "najma", value = 3 }, { kind = "affinity", person = "baraka", value = 3 }]
reply = "两人端着杯子，还在吵，只是声音小了。吵到杯底，巴拉卡把阿拉伯名念对了一回，她没有纠正，只把自己的杯子推过去，又推回来。你的咖啡凉了，没有人再去续，码头上的鸽子倒是飞过来，啄走了一粒糖。"
news = "蒙巴萨码头上有个外国船长请吵架的两人喝咖啡，两人吵到杯底，声音一句比一句低。"

