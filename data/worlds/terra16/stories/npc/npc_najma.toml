# 纳吉玛：NPC 线（故事 2.0，A5 / E37 契约）
# 标签：NPC 线·纳吉玛。玩家不是纳吉玛时才跑的线；玩家是任何主角或自由船长，正文只写“你”，不写玩家的性别、身份与外貌。
# 人物：纳吉玛（najma，1540-08-24 生，尤尔法人，采珠船长拉希德的女儿）。日程：1557—1575 霍尔木兹，1576—1584 马斯喀特，1585—1590 基尔瓦。
# 轨道：npc_najma（脊轨，auto，4 章）：s00_gate 门槛（1557-02）→ s01_yemen（1567—68 也门起义，摩卡）→ s02_hajj（1577 朝觐与麦加的争辩，吉达）→ s03_east（1590 上半年，基尔瓦，结尾）。
#       交汇旁轨（auto = false，由脊轨 default 开启）：npc_najma_pilot（雇她领航，1 章）、npc_najma_cartaz（描歪的印，1 章）、npc_najma_eclipse（星表，2 章）、
#       npc_najma_seal（铅封，1 章）、npc_najma_muscat（红旗进了湾，1 章）、npc_najma_mombasa（星叫什么，1 章）、npc_najma_join（上船，1 章）。共 12 章。
# 依据：史实（只作传闻与背景）：1557 前后霍尔木兹的葡萄牙商馆与通行证（卡塔兹）；1567—68 也门宰德派起义、扎比德被围、港边的书箱；
#       1577 莫卧儿女眷的朝觐船（只作闲话）；1581 米尔·阿里袭取马斯喀特；1586—89 蒙巴萨与基尔瓦的斗嘴与津巴人。
#       L23 日食之争（1574，马六甲到广州的星表，日期由 C10 按日食表定）。
#       原创：尤尔法的采珠船、铜星盘与牵星板、铅封的铜瓶、怀圣寺的光塔与风向标、基尔瓦码头的那些夜晚。
# 待核（正文一律传闻或人物嘴里的口吻）：扎比德被围的确切月份；L23 日食的日期；米尔·阿里 1581 年袭击的规模；津巴人屠基尔瓦的年份。
# 读写的共享旗标：
#   设：c13_npc_najma（门槛 default）、c13_npc_najma_hired（雇她领航）、c13_npc_najma_shielded（替她作证或交罚银）、
#       c13_npc_najma_eclipse_data（星表送到广州的老教长手里）、c13_npc_najma_muscat_helped（借船或报信）、c13_npc_najma_mate（请她上船）、
#       c13_half_solomon_bottle（铅封的拓片，或两半对上）。
#   读：c12_voyage_najma（门槛，选中纳吉玛的那一局她不是 NPC）、upbringing_graduated；c13_npc_najma_eclipse_data（s02 变体）；
#       c13_half_solomon_gate（巴拉卡组设，m1_seal 的 show_gate 选项）；c13_main_baraka（巴拉卡是玩家时 m1_quarrel 不跑）；
#       mate najma（s03 变体，整合时核对 mate key）；h59_mir_ali_coast_coastal_autonomy（C10，s03 变体）。
#   本文件不设、不读 heart / relation / tie / bond 效果：纳吉玛的恋爱归 C7。
# 等待的包：C10（L23 日食的日期与杠杆钥匙 c13_npc_najma_eclipse_data 用不用；H59 的结果 h59_mir_ali_coast_coastal_autonomy）；
#       若 C10 不做 swahili_free，删掉 s03 的 swahili_free 变体。
# 回忆插画：没有（NPC 线不发回忆）。
# 禁区：没有她的心里话（旁白里没有“我”，她的话只在引语里）；不写“马莱莫·卡纳”与任何反证（她只为外曾祖父的名字争过）；不写星路（majid_hidden_route）与黑暗之海；
#       招募不写成恋爱；“差一指，就差一百里”全文件只用一次（m1_hire）。

[[tracks]]
key = "npc_najma"
name = "印度洋的领航人"
kind = "request"
start = "s00_gate"
auto = true
cast = ["najma"]

# s00_gate：霍尔木兹码头的门槛见闻。选中纳吉玛的那一局这条线静默失败；default 开启雇人、通行证两条交汇旁轨。
[[tracks.chapters]]
key = "s00_gate"
title = "出了师的领航女"
text = "霍尔木兹运淡水的码头上，脚夫们在传同一件事：尤尔法采珠船长拉希德的女儿出了师，桑布克归她掌舵，报的星位比她父亲还准。古吉拉特的船主排着队想雇她，她在码头上摆了一张矮凳，先问来人从哪里来。一个脚夫学她的口气说：“报错了，她当场改。”"
stage = "rumor"
window = [[1557, 2, 11], [1557, 2, 18]]
at = "hormuz_port"
cast = ["najma"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c12_voyage_najma", value = false }, { kind = "flag", flag = "upbringing_graduated" }]
news = "霍尔木兹码头上说，尤尔法采珠船长拉希德的女儿出了师，报星位从不含糊，想雇她得先报对自己的纬度。"

[tracks.chapters.default]
next = "s01_yemen"
effects = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "start_track", track = "npc_najma_pilot" }, { kind = "start_track", track = "npc_najma_cartaz" }]

# s01_yemen：摩卡港边的书箱，远景；只写传闻，老夫人不起名。
[[tracks.chapters]]
key = "s01_yemen"
title = "摩卡港边的书箱"
text = "摩卡的咖啡摊上，老板一边冲壶一边说：扎比德被宰德派围住那个冬天，港边堆满了书箱，没有一条船肯载。后来有个尤尔法来的女领航，把讲圣训的老夫人和三箱书一起运去了亚丁。奥斯曼的军官在码头上骂她误了运兵，她不还口，只说：“三箱书压舱正好，兵太沉。”"
stage = "rumor"
window = [[1567, 9, 1], [1568, 6, 30]]
at = "mocha"
cast = ["najma"]
mood = "sad"
news = "摩卡的人说，扎比德被围那年，有个尤尔法的女领航把讲圣训的老夫人和三箱书一起运去了亚丁。"

[tracks.chapters.default]
next = "s02_hajj"
effects = [{ kind = "start_track", track = "npc_najma_seal" }, { kind = "start_track", track = "npc_najma_eclipse" }]

# s02_hajj：吉达港的朝觐船与麦加的争辩。变体：若她托人送过星表去广州，闲话里带一句。
[[tracks.chapters]]
key = "s02_hajj"
title = "领朝觐船的人"
text = "吉达港的人说，今年莫卧儿那条朝觐船，是一个阿拉伯女领航带进港的。船上的女眷下船那天，码头上的人都站住了看。那领航后来上了麦加，在禁寺边为她外曾祖父的名字，跟写也门史的纳赫拉瓦利争了一场。争赢没有，各说各的。有人问她凭什么，她只问了对方一句：“谁看见的？”"
stage = "rumor"
window = [[1577, 1, 1], [1577, 12, 31]]
at = "jeddah"
cast = ["najma"]
mood = "tender"
news = "吉达的人说，莫卧儿女眷的朝觐船是一个阿拉伯女领航带进港的，她后来在麦加为外曾祖父跟纳赫拉瓦利争了一场。"

[tracks.chapters.default]
next = "s03_east"
effects = [{ kind = "start_track", track = "npc_najma_muscat" }, { kind = "start_track", track = "npc_najma_mombasa" }, { kind = "start_track", track = "npc_najma_join" }]

[[tracks.chapters.variants]]
key = "eclipse"
when = [{ kind = "flag", flag = "c13_npc_najma_eclipse_data" }]
text = "吉达港的人说，今年莫卧儿那条朝觐船，是一个阿拉伯女领航带进港的。船上的女眷下船那天，码头上的人都站住了看。那领航后来上了麦加，在禁寺边为她外曾祖父的名字，跟写也门史的纳赫拉瓦利争了一场。争赢没有，各说各的。有人问她凭什么，她只问了对方一句：“谁看见的？”有人还说，几年前她托人把一部星表送去了广州，那边的回回人至今记得。"

# s03_east：基尔瓦的结尾。诗里没有的星，她自己起名字。变体 mate：她在你的船上；swahili_free：诸城没有落进葡萄牙人手里（C10）。
[[tracks.chapters]]
key = "s03_east"
title = "诗里没有的星"
text = "基尔瓦的码头上，老水手们说，那个阿拉伯女领航还住在南边，没有回北边去。季风转向的夜里，她把船开到礁外，对着南边的天量星，量完在本子上记一行。有人问她量给谁看，她说：“外曾祖父的诗只写到这片海的北边。往南那几颗星，我要自己起名字。”"
stage = "rumor"
window = [[1590, 1, 1], [1590, 6, 30]]
at = "kilwa"
cast = ["najma"]
mood = "tender"
news = "基尔瓦的人说，那个阿拉伯女领航夜里总把船开到礁外，量诗里没写过的南边的星。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "mate"
when = [{ kind = "mate", mate = "najma" }]
text = "基尔瓦的码头上，老水手们说，那个阿拉伯女领航上了一条外国船，船上是谁，没人说得清。每到一个新港，她先在海图箱上量一回南边的星，量完往本子后面添一行。有人问她量给谁看，她说：“外曾祖父的诗只写到这片海的北边。往南那几颗星，我要自己起名字。”"

[[tracks.chapters.variants]]
key = "swahili_free"
when = [{ kind = "flag", flag = "h59_mir_ali_coast_coastal_autonomy" }]
text = "基尔瓦的码头上，老水手们说，诸城没有落进葡萄牙人手里，那个阿拉伯女领航还住在南边。季风转向的夜里，她把船开到礁外，对着南边的天量星。有人问她量给谁看，她说：“外曾祖父的诗只写到这片海的北边。往南那几颗星，得用诸城的话起名字。”"

# ---- 交汇旁轨 ----

# m1_hire：雇她领航。玩家在霍尔木兹付 1500 银子，挑一片海。
[[tracks]]
key = "npc_najma_pilot"
name = "雇一位领航人"
kind = "request"
start = "m1_hire"
auto = false
cast = ["najma"]

[[tracks.chapters]]
key = "m1_hire"
title = "先报纬度"
text = "霍尔木兹运淡水的码头上，她坐在一只翻扣的箩筐上。腰里挂着牵星板，手里攥着一只磨亮的铜星盘，盘边的刻度被几代人的拇指摸得发亮。面前排着一队想雇领航的船主，个个脸上写满了价钱。轮到你，她不看你的船，先抬起头：“你说你从哪里来？报个纬度。差一指，就差一百里。”你报了。她把铜星盘对着太阳又量了一回，说错在第二位，当场替你改，改完才问船开多快。谈价的时候她一文不让。最后她翻过你的航簿，挑出三处错，一处一处用指甲点在页边上，然后说：“一程只领一片海。领完我就下船。”"
at = "hormuz_port"
speaker = "najma"
mood = "cheerful"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1557, 6, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1575, 12, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "arabian_sea"
text = "请她领你认阿拉伯海"
next = "done"
requires = [{ kind = "cash", ge = 1500 }]
effects = [{ kind = "cash", value = -1500 }, { kind = "chart", region = "arabian_sea" }, { kind = "affinity", person = "najma", value = 5 }, { kind = "flag", flag = "c13_npc_najma_hired" }]
hint = "她报的价，你的钱袋还差一截。"
reply = "她领你横穿阿拉伯海，一路只说星名和指数，哪颗星该在船头哪一指的高度，她都要你报回来。夜里量星时不许人出声，舵手咳嗽一下，要挨一句骂。下船那天，她把你航簿里改过的地方又看了一遍，点了点头，把页角折了一个小印。"
news = "霍尔木兹码头上，一个尤尔法的女领航先让船长报纬度，报错的当场改，然后领一条船横穿了阿拉伯海。"

[[tracks.chapters.choices]]
key = "persian_gulf"
text = "请她领你认波斯湾"
next = "done"
requires = [{ kind = "cash", ge = 1500 }]
effects = [{ kind = "cash", value = -1500 }, { kind = "chart", region = "persian_gulf" }, { kind = "affinity", person = "najma", value = 5 }, { kind = "flag", flag = "c13_npc_najma_hired" }]
hint = "她的价码你的钱袋凑不齐，今天不谈。"
reply = "湾里的浅滩她闭着眼都认得，哪片水下有珠贝床，哪片底下躺着沉船，一一报给你听。进巴士拉那天，她站在船尾看你靠岸，说你的舵手手太重，舵要顺着浪走，不要跟浪顶。那个舵手后来在码头上跟人说，她是他见过最难伺候的领航。"
news = "有船长在霍尔木兹雇了尤尔法的女领航，她带船进波斯湾，一路报的全是浅滩和沉船的位置。"

[[tracks.chapters.choices]]
key = "red_sea"
text = "请她领你认红海"
next = "done"
requires = [{ kind = "cash", ge = 1500 }]
effects = [{ kind = "cash", value = -1500 }, { kind = "chart", region = "red_sea" }, { kind = "affinity", person = "najma", value = 5 }, { kind = "flag", flag = "c13_npc_najma_hired" }]
hint = "钱袋里的银子不够她开的价。"
reply = "过曼德海峡那夜，她让你的船上全部闭嘴，自己贴着一道礁把船带了进去。礁石擦着船底过去，声音像刮锅底。到吉达外礁，天刚亮，她才开口：“你的罗经偏东一指。”说完把罗经拿过去，拨了一下，又拨回来，像是怕伤着它。"
news = "有船长在霍尔木兹雇了尤尔法的女领航，过曼德海峡那夜，全船闭嘴，只听她一个人的声音。"

[[tracks]]
key = "npc_najma_cartaz"
name = "描歪的印"
kind = "request"
start = "m1_inspect"
auto = false
cast = ["najma"]

# m1_inspect：葡萄牙商馆门口，通行证上描歪的印。超时与站在一边不见闻；替她作证或交罚银才有见闻。
[[tracks.chapters]]
key = "m1_inspect"
title = "描歪的印"
text = "霍尔木兹的葡萄牙商馆门口，她的桑布克还泊在外面，帆没落。一个书记员揪着一张通行证不放。印上十字的一个角描歪了，书记员说：“除了她，谁的手这么稳？”那个女领航站在台阶下，脸冷得像井水，一句替自己辩白的话都没有。直到她瞥了那张纸一眼，就说出那个角差了多少：“描歪的角差了半粒米。我描，不会歪。”书记员的脸色变了，扣船的单子已经叫人去拿。旁边站着的文书拿鹅毛笔蘸了又蘸，不敢抬头。你恰好排在后面，等着领自己的通行证。"
at = "hormuz_port"
mood = "tense"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1558, 1, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1562, 12, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "vouch"
text = "替她作证：那张纸是商馆自己抄错的"
next = "done"
requires = [{ kind = "reputation", faction = "portugal", ge = 10 }]
effects = [{ kind = "affinity", person = "najma", value = 10 }, { kind = "reputation", faction = "portugal", value = -2 }, { kind = "flag", flag = "c13_npc_najma_shielded" }]
hint = "商馆的人不认得你，你的话他们不听。"
reply = "你说你见过商馆的底簿抄错过一个角，那是前一季的事，底簿就压在你船上的箱子底下。书记员骂骂咧咧地放了人，临走还回头瞪了你一眼。她没有道谢，只问了你的船名，用指甲在蜡板上刻下来，刻得很深，像是要记很久。"
news = "霍尔木兹商馆门口，有个外国船长替尤尔法的女领航作证，说那张描歪的通行证跟她无关。"

[[tracks.chapters.choices]]
key = "pay_fine"
text = "替她把罚银交了"
next = "done"
requires = [{ kind = "cash", ge = 800 }]
effects = [{ kind = "cash", value = -800 }, { kind = "affinity", person = "najma", value = 6 }, { kind = "flag", flag = "c13_npc_najma_shielded" }]
hint = "你的钱袋交不起。"
reply = "她看着你数银子，一句话也不说，只在你数完的时候，把钱袋的绳子替你系紧。三个月后，一条从尤尔法来的船在霍尔木兹靠了岸，船主捎来一张纸条，上面只写着你的船名和一个纬度。银子没有捎回来，纸条倒是一张不少。"
news = "霍尔木兹商馆门口，一个外国船长替那个尤尔法的女领航交了罚银，她没道谢，只看了看那条船。"

[[tracks.chapters.choices]]
key = "stand_by"
text = "站在一边看"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = -3 }]
reply = "她自己把那个角的歪处一笔一笔讲给书记员听，讲到第三遍，书记员才放了人。书记员走后，她把那张通行证卷起来收进袖子里，又从袖子里摸出蜡板，在上面记了一笔什么。她从你身边走过，连看都没看你一眼。"

