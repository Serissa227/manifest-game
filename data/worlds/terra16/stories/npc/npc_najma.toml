# m1_raid：米尔·阿里袭取马斯喀特的那个清晨。NPC 线只写撤人与报信，不写米尔·阿里登场讨情。
[[tracks.chapters]]
key = "m1_raid"
title = "红旗进了湾"
text = "天没亮，城墙上的鼓一下一下敲起来，三条桨帆船挂着红旗划进马斯喀特的小海湾，城里的人往海里跑。她的桑布克泊在湾口，正一船一船地往外送人，船太小，送不完。船舷边的水手扯着嗓子喊：“再送一船，就到礁边了！”她没有回头。你的船也在湾里。岸上的孩子被大人一把一把抱起来，往山坡上送，有一个哭得背过气去。码头上是抢来的货，堆得比人还高，没有人看着。她冲着你的船喊过来，喊的是潮转的时辰，一句求人的话也没有：“潮还有半个时辰转！你的船吃水多深？”"
at = "muscat"
mood = "tense"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1581, 8, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1581, 10, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "lend_ship"
text = "把你的船借给她撤人"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = 12 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_npc_najma_muscat_helped" }]
reply = "她跳上你的船，替你的舵手报水道，一句话说一遍，不重复。两条船一前一后把人送出了湾口，湾里的水越来越浅，船底擦着沙。潮转的那一刻，礁露出来，最后一条船刚好擦过去。岸上的人替她数着船，数到第七条，才有人哭出声来。"
news = "马斯喀特被劫那天，一个外国船长把自己的船借给尤尔法的女领航撤人，两条船抢在潮转之前出了湾。"

[[tracks.chapters.choices]]
key = "warn_town"
text = "替她进城去报信"
next = "done"
check = { attr = "perception", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "najma", value = 8 }, { kind = "flag", flag = "c13_npc_najma_muscat_helped" }]
fail = { next = "done", effects = [{ kind = "affinity", person = "najma", value = 2 }], news = "马斯喀特被劫那天，有个外国船长进城挨家报信，晚了一步，红旗已经插上了蓄水池。" }
reply = "你挨家敲门，报的是她喊的那句：还有半个时辰。有人不信，你就把她的船指给人看。等红旗插上蓄水池，城里的人已经走了一大半，剩下的几户，是你一扇门一扇门拍出来的。有一户的老头不肯走，你把他的门板也拍了，才把他拉出来。"
news = "马斯喀特被劫那天，有个外国船长挨家敲门报信，城里的人走了一大半，红旗插上蓄水池时，最后几户刚关上门。"

[[tracks.chapters.choices]]
key = "loot"
text = "趁乱收下码头上没人看的货"
next = "done"
effects = [{ kind = "cash", value = 1500 }, { kind = "affinity", person = "najma", value = -10 }]
reply = "货装上了你的船。她远远看见了，没有说话，转身又送了一船人出去。那天之后，在霍尔木兹到马斯喀特的码头上，她不再跟你报纬度。有人问她为什么不跟你计较，她说：“拿错的东西，装得再稳也是错的。”"

