# m1_quarrel：蒙巴萨码头上为一颗星吵架。c13_main_baraka 为真（巴拉卡是玩家）时本章不跑，由 main_baraka c06 负责。两人之间不写恋情。
[[tracks.chapters]]
key = "m1_quarrel"
title = "星叫什么"
text = "蒙巴萨的码头，天刚黑，灯笼一盏盏挂上桅杆。基尔瓦的金商巴拉卡坐在一只黄铜小箱上，和那个阿拉伯女领航为头顶一颗星叫什么吵了一下午：一个报阿拉伯名字和指数，一个报斯瓦希里的名字和他父亲的说法。码头边的炭炉上烧着一壶咖啡，没有人去看它开没开。米尔·阿里的水手在旁边下注，赌的是谁先认输，铜币压在黄铜箱的边上，谁也不肯先收。两人同时转过头来，要你评理。巴拉卡说：“船长，你评评理，星又不识字，叫哪个它都亮！”她说：“它不识字。可他量少了半指。”"
at = "mombasa"
mood = "cheerful"
cast = ["najma", "baraka"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1586, 1, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }, { kind = "flag", flag = "c13_main_baraka", value = false }]
deadline = [1586, 6, 30]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "measure"
text = "拿牵星板当场量给他们看"
next = "done"
check = { attr = "astronomy", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "najma", value = 6 }, { kind = "affinity", person = "baraka", value = 6 }]
fail = { next = "done", effects = [{ kind = "affinity", person = "baraka", value = 3 }], news = "蒙巴萨码头上，一个外国船长替两个吵架的人量星，量出了第三个数，三个人一起吵到半夜。" }
reply = "你量出来的数跟她的一样，差一丝都没有。巴拉卡认了，接着讲了一段史诗，说的是一个量错星的金商，讲到一半自己先笑了。她没有笑，只是嘴角动了一下，把牵星板从你手里接过去，又量了一遍。量完她把牵星板还给你，板子的边已经被她的拇指摸亮了。"
news = "蒙巴萨码头上，基尔瓦的金商和尤尔法的女领航为一颗星吵了一下午，一个外国船长拿牵星板当场量给两人看，两人都不吭声了。"

[[tracks.chapters.choices]]
key = "side_her"
text = "站在她那边"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = 8 }, { kind = "affinity", person = "baraka", value = -3 }]
reply = "巴拉卡捂着胸口说他被两个人欺负了，然后请大家喝酒，钱从黄铜小箱里拿。她没有笑，也没有坐下，只是等他把酒喝完。然后她端起杯子，第一次主动跟他碰了杯，碰完说：“下一颗星，你先报。”码头上的鸽子被碰杯声惊起，绕着灯笼飞了一圈。"
news = "蒙巴萨码头上，基尔瓦的金商和尤尔法的女领航为一颗星吵了一下午，一个外国船长被拉去评理。"

[[tracks.chapters.choices]]
