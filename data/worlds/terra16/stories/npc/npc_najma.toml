# m1_seal：铅封的拓片，七件翠玉印记里所罗门那一件的另一半（与巴拉卡组对齐）。不撬瓶子，不偷。
[[tracks.chapters]]
key = "m1_seal"
title = "铅封的拓片"
text = "马斯喀特她租的屋子里，墙上挂着牵星板，架子最高一层放着一只封着铅的铜瓶，窗下的矮桌上摊着她量星用的小本子，边角已经卷了。铜瓶是尤尔法一个老渔夫网上来的，瓶口压着铅，铅面上刻着六角星和一圈细字，肚子上还留着网绳勒出的印子。新月夜，她说：“瓶子会出声。我从来不开。”她用灯烟拓过几张，夹在外曾祖父的诗抄里，抽出来摊在你面前。那圈字和她见过的任何字都不像。她用指尖点着其中一个说：“只有南边一个金商说过，他在一座石门上见过差不多的。”你问她，开瓶的人该怎么办。她把铜瓶往架子里推了推：“开它的人，得先想好放出来的是什么。”"
at = "muscat"
speaker = "najma"
mood = "mystic"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1576, 1, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1584, 12, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "ask_rubbing"
text = "请她借你一张铅封的拓片"
next = "done"
requires = [{ kind = "affinity", person = "najma", ge = 40 }]
effects = [{ kind = "flag", flag = "c13_half_solomon_bottle" }]
hint = "她看了你一眼，把拓片收回袖子里，还不到时候。"
reply = "她从诗抄里抽出最清楚的一张，又在背面用灯烟补了一个角，补得很小心，怕把纸烤裂。交给你时她说：“另一半在南边。找着了，告诉我它像什么。你别跟别人说这一张是我给的。”纸是温的，她的手指按在上面按了很久，才松开。"
news = "马斯喀特的人说，那个阿拉伯女领航肯借一张拓片给人了，纸上是一圈谁也不认得的字。"

[[tracks.chapters.choices]]
key = "show_gate"
text = "把你拓的那行门铭拿给她看"
next = "done"
requires = [{ kind = "flag", flag = "c13_half_solomon_gate" }]
effects = [{ kind = "flag", flag = "c13_half_solomon_bottle" }, { kind = "affinity", person = "najma", value = 10 }]
hint = "你手里没有能跟它对上的东西。"
reply = "她把两张纸并排摊在桌上，看了一夜，没有说话。油灯添了两回油，她的手指在两圈字之间来回移，一次也没有碰到纸边。天亮时她把自己那张推给你，手背上有一道被灯烟熏黑的印子：“两半该放在一处。”"

[[tracks.chapters.choices]]
key = "just_look"
text = "只看，不借"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = 3 }]
reply = "她把油灯挪近，让你看清那圈字，一个一个指给你看，指到第四个字就停住了，不往下指。她没问你看懂了没有，也没有再提拓片。油灯熄灭前，你看见她的手指还按在桌面上，按着一个没有说出口的数。黑暗里，铜瓶安安静静，没有出声。"
news = "马斯喀特的人说，那个阿拉伯女领航屋里有只封着铅的铜瓶，新月夜会响，她从来不开。"

