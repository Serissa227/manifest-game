# m1_join：基尔瓦的招募。invite 走内核的招募检查（情谊够才行）；join 效果在条件不够时整项被挡。
[[tracks.chapters]]
key = "m1_join"
title = "你的船值不值得量"
text = "基尔瓦的码头，她这几年住在南边。船卖了，只留着牵星板和铜星盘，牵星板用绳子挂在门框上，板子的边被手指磨得发白。每天傍晚她在码头尽头量星，把数字写进一本航路书。书的封皮被海风泡软了，她用布条又缝了一回。你问她肯不肯上你的船。她先问：“你最远到过哪里？报个纬度。”你报了。她不看你，码头尽头的晒鱼架在风里吱呀作响，她却报了一串你从没去过的纬度，一个接一个，报到末了指了指南边低空的一颗星：“南边还有几颗星，我没量。”"
at = "kilwa"
speaker = "najma"
mood = "tender"
cast = ["najma"]
when = [{ kind = "flag", flag = "c13_npc_najma" }, { kind = "date", from = [1585, 1, 1] }, { kind = "flag", flag = "c13_npc_najma_mate", value = false }]
deadline = [1590, 12, 31]
timeout = { next = "failed", effects = [] }

[[tracks.chapters.choices]]
key = "invite"
text = "请她上船做领航"
next = "done"
requires = [{ kind = "affinity", person = "najma", ge = 60 }]
effects = [{ kind = "join", person = "najma" }, { kind = "flag", flag = "c13_npc_najma_mate" }]
hint = "她听完你的请求，摇摇头，说这条船还不值得量。"
reply = "她把航路书夹在胳膊下面上了船，第一件事是把你的罗经拆下来擦了一遍，擦完装回去，只说了一句：“偏东的毛病还在，你自己知道。”第一夜，她站在船头量星，不许人说话。航路书的第一页，她写下了你船的吃水。"
news = "基尔瓦的人说，那个每天傍晚在码头尽头量星的阿拉伯女领航，上了一条外国船。"

[[tracks.chapters.choices]]
key = "invite_old_debt"
text = "提起霍尔木兹那一回，再请她"
next = "done"
requires = [{ kind = "flag", flag = "c13_npc_najma_shielded" }, { kind = "affinity", person = "najma", ge = 45 }]
effects = [{ kind = "join", person = "najma" }, { kind = "flag", flag = "c13_npc_najma_mate" }]
hint = "她不记得欠过你什么。"
reply = "她想了一会儿，说那个描歪的角她还记得差了多少。然后她回屋收拾，只拿了牵星板、星盘和那本书。锁门的时候，她把钥匙留在门框上，没有给房东，也没有带走。她上船前，把你的船名又念了一遍，像是要记牢。"
news = "基尔瓦的人说，那个阿拉伯女领航上了一条船，船主是个她早前在霍尔木兹见过的人。"

[[tracks.chapters.choices]]
key = "ask_star"
text = "不强求：问她最远量到过哪颗星"
next = "done"
effects = [{ kind = "affinity", person = "najma", value = 3 }, { kind = "skill", skill = "astral_navigation", value = 4 }]
reply = "她指给你看南边低空的一颗星，说那是她这辈子量得最远的一颗。星在海面上贴得很低，像要沉下去。你记下了那个数，回船后在罗经旁边写了一行，写完又划掉，重新写了一遍。那一行字后来没有抄进航簿，只留在罗经旁边的木板上。"
news = "基尔瓦的人说，那个每天傍晚在码头尽头量星的阿拉伯女领航，这几年常有船长来请她，她一个也没应。"

[[tracks.chapters.variants]]
key = "hired"
when = [{ kind = "flag", flag = "c13_npc_najma_hired" }]
text = "基尔瓦的码头，她这几年住在南边。船卖了，只留着牵星板和铜星盘，牵星板用绳子挂在门框上，板子的边被手指磨得发白。每天傍晚她在码头尽头量星，把数字写进一本航路书。书的封皮被海风泡软了，她用布条又缝了一回。她翻出一本旧蜡板，上面还记着你那年报错的纬度。你问她肯不肯上你的船。她先问：“你最远到过哪里？报个纬度。”你报了。她不看你，码头尽头的晒鱼架在风里吱呀作响，她却报了一串你从没去过的纬度，一个接一个，报到末了指了指南边低空的一颗星：“南边还有几颗星，我没量。”"

[[tracks.chapters.variants]]
key = "muscat"
when = [{ kind = "flag", flag = "c13_npc_najma_muscat_helped" }]
text = "基尔瓦的码头，她这几年住在南边。船卖了，只留着牵星板和铜星盘，牵星板用绳子挂在门框上，板子的边被手指磨得发白。每天傍晚她在码头尽头量星，把数字写进一本航路书。书的封皮被海风泡软了，她用布条又缝了一回。她认出了你的船，是马斯喀特那天替她撤人的那一条。你问她肯不肯上你的船。她先问：“你最远到过哪里？报个纬度。”你报了。她不看你，码头尽头的晒鱼架在风里吱呀作响，她却报了一串你从没去过的纬度，一个接一个，报到末了指了指南边低空的一颗星：“南边还有几颗星，我没量。”"
