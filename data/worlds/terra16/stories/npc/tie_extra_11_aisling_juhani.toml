# 相识：1570 年夏，卑尔根栈桥与货栈后头的客房。卖风的人话没讲完，先去修窗。
[[tracks.chapters]]
key = "tie_extra_11_aisling_juhani_meeting"
title = "你先别卖风"
text = "艾希林的船载着一舱爱尔兰牛皮，在卑尔根靠上栈桥，要换木料和鳕鱼干。缆绳还没系牢，她已经跳上岸找住处。栈桥尽头蹲着个萨米人，脚边摊开一条打了三个结的皮绳，见她过来就起身：“船长，听我讲。头一个结，解开是和风。第二个结，风紧。第三个——”“传说留着，”她手一摆，嗓门大得隔壁船的人都探出头来，“先说今晚住哪。”尤哈尼愣了愣，指指汉萨商馆货栈的后墙：“有一间。漏风。”她去看了。窗框歪着，缝里塞得进两根手指，外头正下雨。“那先修窗，”她说，“风的价明天再谈。”他回去取了锤子和木楔。她一把抢过锤子，他扶着窗框，第三下，木楔就牢了。“卖风这些年，”尤哈尼说，“头一回替人把风关在外头。”"
stage = "witness"
window = [[1570, 5, 15], [1570, 8, 31]]
at = "bergen"
cast = ["aisling", "juhani"]
speaker = "aisling"
mood = "cheerful"
news = "卑尔根货栈后头，卖风结的萨米人话没讲完，就被一个爱尔兰女船长拽去修了一扇漏风的窗，风的价到第二天才谈。"

