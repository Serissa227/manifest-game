# 转折（传闻）：1571 年，有个船长把第三个结也解了。只说酒馆里的闲话，萨米人这一季不再卖第三个结。
[[tracks.chapters]]
key = "tie_extra_11_aisling_juhani_turning"
title = "第三个结"
text = "卑尔根的酒馆这几天只讲一条船。船长买了三个结，嫌风小，出港没多远就把第三个也解了，桅杆当场折成两截，船是被人拖回来的，帆一片不剩。“我在岸上看着，”一个水手说，“船头先歪，像有人拿门板从侧面拍过去。”卖风的萨米人听说以后，对来问第三个结的人只回一个字：“不。”有人把价加了一倍，他又说一遍，声音更轻。货栈后头客房里住的那个爱尔兰女船长，听人讲完把那个船长骂了个遍，骂到一半又转过来夸：“买卖人里还有把银子往外推的！这个我服。”那条三个结的皮绳在摊上挂了半个月，连第一个结也没人来问。"
stage = "rumor"
window = [[1571, 5, 15], [1571, 8, 31]]
at = "bergen"
cast = ["aisling", "juhani"]
mood = "tense"
news = "卑尔根有个船长出港没多远就把风结的第三个也解了，桅杆当场折断，船被拖回来；卖风的萨米人这一季不卖第三个结。"

