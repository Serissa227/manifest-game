[[tracks.chapters.choices]]
key = "buy_two"
text = "劝艾希林：结只买两个，他说不开就不开。"
reply = "我劝她：两个结够跑一趟，他喊停，就停。艾希林一巴掌拍在桌上，骂了一长串，从英格兰人骂到卑尔根的雨，骂完把手伸了过去：“成交！”往北那一趟，尤哈尼喊了两回不开。第一回，傍晚北边的云压了下来；第二回，船在锚地多等了一天，外头的浪头比桅杆还高。两回都让他说中了。"
