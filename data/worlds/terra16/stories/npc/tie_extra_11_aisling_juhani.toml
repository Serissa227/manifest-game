# 落点（生意伙伴，缺省即此结局）：1573 年，那扇窗还是不漏风。合伙单子签下，“说不开就不开”写进单子。
# 缺省路径（艾希林去年一个人往北，少了两个水手）是正文；_helped 与 _third 各有一个变体。
[[tracks.chapters]]
key = "tie_extra_11_aisling_juhani_landing"
title = "修好的窗"
text = "第三年夏天，艾希林的船又靠了卑尔根。她先上货栈后头那间客房，伸手摸窗缝：窗还是她当年让修的那扇，木楔四角咬得死死的，一丝风也不漏。去年他们没谈拢，她一个人往北走了一趟，回来点人头，少了两个。这件事她一个字没提，只把一张纸拍在桌上：头一行，粮先算他的；往下，回程的货分他一成，船归她管，天归他管。“你那个价里老算着回程的粮，”她说，“这回我写在头一行。”末尾还有一行：尤哈尼说不开，就不开，船长不得改口。“上不上船你自己说了算。字，我先签了。”尤哈尼把纸从头念到尾，指甲在“粮先算他的”底下划了一道，收进怀里：“这回我说上。”"
stage = "witness"
window = [[1573, 5, 15], [1573, 8, 31]]
at = "bergen"
cast = ["aisling", "juhani"]
speaker = "juhani"
mood = "cheerful"
news = "卑尔根那间客房的窗子三年没漏过风。爱尔兰女船长跟卖风的萨米人签了合伙的单子，她管船，他管天。"

