text = "第三年夏天，艾希林的船又靠了卑尔根。她先上货栈后头那间客房，伸手摸窗缝：窗还是她当年让修的那扇，木楔四角咬得死死的，一丝风也不漏。她把一张纸拍在桌上：头一行，粮先算他的；往下，回程的货分他一成，船归她管，天归他管。“你那个价里老算着回程的粮，”她说，“这回我写在头一行。”末尾一行字写得比别的都大：尤哈尼说不开，就不开，船长不得改口。底下又添了一行小的：去年两回，他都说中了。“上不上船你自己说了算。字，我先签了。”尤哈尼把纸从头念到尾，指甲在“粮先算他的”底下划了一道，收进怀里：“这回我说上。”"

