[[tracks.chapters.choices]]
key = "buy_third"
text = "替艾希林把第三个结也买下，挂着当压舱的保险，不解。"
reply = "我掏钱买下第三个结，说挂在舱里就行，不解。尤哈尼盯着那根皮绳看了很久：“不卖风。卖个挂着的结，可以。”价钱里照旧算着回程的粮。上船那天他踩着凳子，把结挂在船长室最高的那颗钉子上：“不许碰。”艾希林仰着脖子骂他挂得太高，可那一整趟，没人去碰它。她后来说，那是全船最金贵的一根绳子。"
next = "tie_extra_11_aisling_juhani_landing"
