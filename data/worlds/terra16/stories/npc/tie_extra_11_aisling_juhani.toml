# 抉择：1572 年，客房里。艾希林要请他上船，他要一条规矩；桌上三个结，两人一起看向主角。
[[tracks.chapters]]
key = "tie_extra_11_aisling_juhani_choice"
title = "这趟同不同行"
text = "又是夏天，货栈后头那间客房的窗子关得严严实实。艾希林这趟要往北跑，进门就把一袋银子拍在桌上：“我请你上船，替我看天。三个结，我全包了。”尤哈尼没碰银子，把皮绳摊开，三个结排成一行：“上船可以。结，两个。第三个，这一季不卖。哪天我说不开船，就不开。谁说了都不算，船长也不算。”艾希林笑得灯焰直晃：“上了船，往哪儿开是我说了算。”“结可以解，”尤哈尼说，“天色先看。”两个人隔着桌子僵住了。灯焰慢慢站直了。她先转过头，他跟着转过来，两双眼睛一起落在我身上。"
stage = "involve"
window = [[1572, 5, 15], [1572, 8, 31]]
at = "bergen"
cast = ["aisling", "juhani"]
speaker = "aisling"
mood = "tense"
news = "卑尔根货栈后头，爱尔兰女船长要请卖风的萨米人上船，萨米人要一条“说不开就不开”的规矩，两边都不松口。"

