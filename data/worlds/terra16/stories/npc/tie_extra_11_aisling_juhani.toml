# 风结不替人答应（tie_extra_11_aisling_juhani）——配角线，标签：无（生意伙伴，不是恋爱线）；旧稿全部重写。
# 人物：艾希林·奥弗莱厄蒂（aisling，1530-04-22 生），康诺特海上氏族奥弗莱厄蒂家的女儿，在戈尔韦外海带船；
#       她的恋人是彼得，见 pair_aisling_pieter，本线不写，也不提他。
#       尤哈尼（juhani，1530-11-03 生），北方的萨米卖风者，从托尔尼奥一路卖到卑尔根。
#       1570—1573 年两人都是四十岁上下的成年人；全线只写生意上的往来与信得过（friends），不写暧昧。
# 依据（史实）：北方卖风结的民俗——一条绳打三个结，解开第一个得和风，第二个得强风，第三个得风暴
#       （奥劳斯·马格努斯 1555 年《北方民族史》）；卑尔根布吕根码头是汉萨商馆的货栈区，鳕鱼干出口，多雨，商馆里不许生火。
# 原创：两人的合伙与整个故事；爱尔兰牛皮换卑尔根木料与鳕鱼干的买卖；货栈后头那间漏风的客房和那扇窗；
#       合伙单子上“说不开就不开，船长不得改口”一条；第三个结“挂着，不解”的买法。
# 待核：爱尔兰与卑尔根之间的直接贸易（史上北海的爱尔兰船多往西班牙、法国、英格兰）；
#       尤哈尼夏天从托尔尼奥赶到卑尔根的路线（正文不写路线，只写他人在卑尔根）。
# 缺省走向：1570 修窗（friends）→ 1571 传闻：有个船长把第三个结也解了，桅杆折了，萨米人这一季不卖第三个结
#       → 1572 艾希林要请他上船，他要“说不开就不开”（无人插手：艾希林一个人往北跑了一趟，回来少了两个水手）
#       → 1573 合伙单子签下，“说不开就不开”写进单子（落点，缺省即此结局；玩家不在场也照样发生）。
#   帮助：劝她只买两个结、认下他的规矩（_helped）→ 落点变体：往北那一趟他喊过两回不开，两回都对，单子上添了一行。
#   另一条路：替她买下第三个结，挂着不解（_third）→ 落点变体：结在船长室的钉子上挂了一年，没人碰过。
# 共享旗标：本文件写 c7_tie_extra_11_aisling_juhani_landing、_helped、_third；落点的变体读 _helped、_third；没有读外部旗标。
# 日程：不改 cast。艾希林的日程在戈尔韦、尤哈尼的在托尔尼奥，两人夏天在卑尔根相会是故事内的出行（窗口 5 月中到 8 月底）。

