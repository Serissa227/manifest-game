# 一、相识：1566 年春，画坊里磨得很慢的最后一点蓝，画角上提篮子的女人。
[[tracks.chapters]]
key = "pair_yasmin_miriam_meeting"
title = "提篮子的女人"
text = "宫里的画坊开春就敞着窗晾纸。我送来一包巴达赫尚的青金石，在门边等管事结账。凳子另一头坐着替后宫女眷采买、传信的基拉米丽娅姆，来取一批小画。她从不催。画坊里唯一的女画师亚斯明在磨最后一点蓝，磨得很慢，像是成心的。庭院都画满了，只剩右下角巴掌大一块没落笔——她的画，那一角从来不画满。这回她蘸了那点蓝，在角上添了个女人的背影，挎着篮子，正往门外走。米丽娅姆看了很久，没问是谁：“这一张能不能留下？”“画坊的画都登了册。”亚斯明吹了吹那一角，“一张也不能少。”米丽娅姆挎好篮子，起身：“信没拆开，也能把事办好。”第二天我来领钱，管事说册子上的数目对上了。米丽娅姆从门口过，篮子的布底下露出一角蓝。"
