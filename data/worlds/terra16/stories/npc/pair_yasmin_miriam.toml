# 二、靠近：1567 年春夏，米丽娅姆记得每个封口；亚斯明把一张小画封进信封，按上自己的印（crush）。
[[tracks.chapters]]
key = "pair_yasmin_miriam_closer"
title = "多等的一会儿"
text = "这一年，米丽娅姆往画坊来了二十几回，每回都多等一会儿。亚斯明数过。她还看出来，这个女人记得画坊里每一个封口。管事那只装金箔的匣子，有一回蜡上的绳结换了个方向，米丽娅姆进门扫一眼：“有人开过。”管事查了三天，果然是个学徒。那晚灯快熄了，亚斯明问她：“替女眷传信，信里的事漏出去，倒霉的是传信的人。你不怕？”米丽娅姆把篮子放在膝上：“我只记封口，不记里面。”亚斯明从画箱底下抽出一张巴掌大的小画，折进信封，就着灯烤软了蜡，按上自己的印。印面没有字，只刻着一朵石榴花。她把信放进那只篮子。“那你记一下我的。”那封信后来一直压在米丽娅姆的篮子底下，蜡上的石榴花磨得发亮，一回也没拆过。"
