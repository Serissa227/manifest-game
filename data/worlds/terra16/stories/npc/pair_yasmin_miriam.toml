title = "提前的远行"
text = "伊斯坦布尔宫里画坊那桩缺页的案子，到头来坐实了：那一页叫人从宫外卖给了威尼斯人。波斯来的女画师被赶出画坊，限她开春以前出城。走之前，她托人往犹太区给基拉捎了一封信，封口按的是她那枚只刻一朵花的印。送信的小厮说，基拉当着他的面没拆，揣进怀里，给了他双倍的赏钱。犹太区的老太太们咂着嘴说，那样贴着心口揣的，只能是情书。开春，女画师跟着驼队往东走了，听说是去霍尔木兹替人画书。她前脚出城，基拉的信差后脚也上了那条路，往后每一季都得去一趟。加拉塔那个威尼斯人把那页画挂在账房里，逢人就说马的眼睛画得活。"
