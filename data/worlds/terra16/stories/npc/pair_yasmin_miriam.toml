text = "我在画坊后门卸一车纸，门开了一道缝。亚斯明站在门槛里头，脚尖抵着门槛，一步也不往外迈——禁足的人出了这道门，就说不清了。米丽娅姆站在外头，篮子上盖着布。“临本那一页，十天里找不回来，她就得出宫。”米丽娅姆说得很平，像报一笔账，“我手里还有一封信，要送出宫去，封口不能有人碰过。”信是宠妃交下来的，她只说了这一句，把篮子往身后挪了挪。前门的守卫这几天挨个翻篮子，连卖饼的也不放过。亚斯明隔着门缝看我：“那一页画的是拉赫什，鲁斯塔姆的马。马的眼睛是我点的。少了它，整首诗就缺一句韵。”米丽娅姆看看她，又看看我：“你是宫外的人。”"
