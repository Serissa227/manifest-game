# C7 配角线（重写，Claude，2026-10-12）：pair_yasmin_miriam「末页的署名」——遵循 docs/DECISIONS.md“第九批 A5 / E37 开工：故事 2.0 TOML 契约”。
# 标签：GL（恋爱）·配角线。两人都是纯 GL（romance.with = f），只对女性，不转向异性。
# 人物：亚斯明 yasmin（1530-01-19，女）：波斯女抄写员兼画家，大不里士陷落后随波斯画师进了奥斯曼宫廷画坊，画坊不许她署名；1577 起在霍尔木兹。
#   米丽娅姆 miriam（1532-02-24，女）：替后宫女眷采买、传信的犹太女代理人（宫里称“基拉”），记得每个封口的样子。生年差 2。
# 年龄：全线两人都已成年（1566 年 36 与 34 岁）。closer（1567-04-01..06-30）只写 crush；
#   lovers 只在两个落点（1569-04-01..06-30，39 与 37 岁，晚于 1557-01-01）。together 写到一个吻为止；apart 是传闻，不写吻。
# 依据：
#   史实——1514 年起大不里士几度被奥斯曼攻占，一批波斯画师被带进伊斯坦布尔的宫廷画坊；
#     1568 年塔赫马斯普沙的使团给新即位的塞利姆二世送来一部《列王纪》抄本（两百多幅插图）作贺礼；
#     “基拉”是替后宫女眷与宫外打交道的女代理人，多为犹太女性；努尔巴努此时是塞利姆二世的宠妃（1574 年才成太后），正文只称“宠妃”；
#     于斯屈达尔是往东商路的起点；石榴花波斯语作 golnar，也用作女孩的名字。
#   原创——画坊自己那份临本缺了一页（不是御赐原书）；那页画的拉赫什、装订匠铺子的衬纸、亚斯明那枚无字的石榴花印、
#     她的乳名“古尔纳尔”、诗集末页的花、霍尔木兹王府的画活。宫里的信写了什么，一律不写。
#   待核——使团 1568 年初在埃迪尔内觐见，贺礼何时入伊斯坦布尔宫中，正文只说“进了宫”，不报日子；
#     奥斯曼宫廷画坊是否有女画师，属本世界的设定。
# 秘密：亚斯明的乳名（新设的物件）只在 together 揭开；见闻不写乳名、不写名字藏在哪朵花里、不写信的内容与寄信人。
# 口头禅：米丽娅姆的“信没拆开，也能把事办好。”原话只在 meeting 用一次；亚斯明原口头禅里的词归哈迪贾，改写成动作——她的画总有一角不画满，只在 meeting 点明。
# 缺省走向：1566 春画坊相识（提篮女人）→ 1567 春夏封了印的小画（crush）→ 1568 夏临本缺页（传闻）
#   → 1568 秋后门（无人插手：米丽娅姆在出入登记上找到错记，罪名不成立，信也送出）
#   → together：1569 春诗集末页的石榴花，两人成了不公开的恋人 → epilogue：1577 春的传闻——亚斯明 1576 年入秋动身去霍尔木兹，信差开春带回第一封信，往后每季跑一趟。
# 玩家能做的：帮助——去装订匠铺子找回那一页（find_page，_helped），或把宠妃的信带出宫（carry_letter，_matched），都走 together，变体不同；
#   卖页给威尼斯人（sell_page，会有后果，_apart）→ apart：亚斯明 1569 年被逐出画坊、提前去霍尔木兹，两人仍是恋人。
# 旗标：两个落点的 default 都设共享旗标 c7_pair_yasmin_miriam_together；choice 设 _helped / _matched / _apart；together 的变体读 _helped / _matched。不读外部旗标。
# 日程：缺省与帮助路径不改 cast（亚斯明 1577 起在霍尔木兹，静态日程已写）。apart 的 schedule 效果把亚斯明提前迁去 hormuz_port 的 workshop（落点结算时生效，约 1569 年夏）。
#   米丽娅姆与法蒂玛的交情归 tie_new_fatima_miriam；亚斯明与玛尔塔在霍尔木兹的合伙归 tie_extra_03，本文件都不写。

