# 谁先开船（pair_karim_mansur）——配角线，标签 BL；纯 BL 的一对，恋爱线。
# 人物：卡里姆（karim，1535-02-03 生），摩加迪沙船主家的长子，哈米德的哥哥，正在学把舵交出去；1554—1563 日程在摩加迪沙，1564 起常驻霍尔木兹。
#       曼苏尔（mansur，1534-11-15 生），吉达的朝圣船船东，舱位表最后一栏写的是饮水。
#       生年差一年；全线都在成年以后：1556 年 crush（卡里姆 21、曼苏尔 21 岁），1558 年 1—3 月落点 lovers（卡里姆 22→23、曼苏尔 23 岁，窗口起日晚于 1557-01-01）。
#       落点章只有一个吻，一句带过。
# 依据（史实与原创的界线）：葡萄牙人在印度洋对船只发放通行证（cartaz），没有通行证的船会被巡逻船扣下；东非与红海之间有朝圣船往来，
#       回程的客人趁东北季风南下；霍尔木兹的海关由葡萄牙人把持，船主在那里办通行证。
#       被扣的朝圣船、舱位表、水桶的讲究，以及两人的全部故事都是原创，正文用“听说”。
# 待核：吉达水道的暗礁与引水小船的细节；朝圣回程客的人数与备水量（正文取整数，不当通例讲）；通行证在红海内外各管到哪里（正文不下定论）。
# 缺省走向：meeting（推水桶）→ closer（交出去的舵，crush）→ turning（传闻：朝圣船被扣，两人头一回同桌）
#       → choice（无人插手：错开船期、互留一桶救急的水）→ together（1558 年合伙置船，成为恋人）
#       → epilogue（传闻：1564 年后卡里姆常驻霍尔木兹，两人随季风往返）。没有坏结局，玩家只改变落点章的变体。
#   帮助：替他们查清巡逻船的时辰和海域（_helped）→ 落点变体：墙上钉着那张写满时辰的纸。
#   撮合：劝他们合用一条船（_matched）→ 落点变体：曼苏尔提起当初那句疯话。
# 共享旗标：写 c7_pair_karim_mansur_together（落点）、_helped、_matched；不读外部旗标。
# 日程：卡里姆 1554—1563 的日程在摩加迪沙，曼苏尔一直在吉达；1555—1558 年 1—3 月两人在吉达的见面是回程季的出行，章节按 at 判断在场，不改 cast。
#       epilogue 的 at 用港口 key hormuz_port；cast 里卡里姆 1564 起的日程写的是 at = "hormuz"（势力 key，不是港口），由整合方核对。
# 口头禅：曼苏尔“少载一包货，多留一桶水”（meeting 一次，别处换说法）；卡里姆“这趟你来掌，我看着帆”（closer 一次，别处换说法）。
# 哈米德：closer 里卡里姆提一句“家里那个小弟”，不写他的事。

[[tracks]]
key = "pair_karim_mansur"
name = "谁先开船"
kind = "request"
start = "pair_karim_mansur_meeting"
auto = true
cast = ["karim", "mansur"]

# 相识：1555 年初，吉达码头。一只水桶，一块舱位板。
[[tracks.chapters]]
key = "pair_karim_mansur_meeting"
title = "同一批客人"
text = "回程的东非朝圣客在吉达码头的席棚底下坐成一排，四十六个人，都等着乘东北风回摩加迪沙。卡里姆和曼苏尔隔着他们吵了半个时辰，吵的是船价：卡里姆压得低，曼苏尔一文不让。吵到一半，曼苏尔瞥见卡里姆手里的舱位板，皱了眉：“四十六个人，二十天的路，你写了十一桶水。该十二桶。”“我船上的水够。”“够你喝。”曼苏尔转身从自己船上滚下一只桶，一路推到卡里姆脚边：“少载一包货，多留一桶水。你舱里有包胡椒该下来了。”卡里姆黑着脸，先说了声“谢了”，才补上后半句：“价钱，我照压。”“我照一文不让。”曼苏尔说。"
stage = "witness"
window = [[1555, 1, 15], [1555, 3, 31]]
at = "jeddah"
cast = ["karim", "mansur"]
speaker = "mansur"
mood = "cheerful"
news = "吉达码头上两个船主争一批回程的朝圣客，吵得半个码头来看；吵完，一个把自己船上的水桶推给了另一个，价钱却一文没让。"

[tracks.chapters.default]
next = "pair_karim_mansur_closer"
effects = []

# 靠近：1556 年初，吉达水道。一块被礁石蹭掉的漆，一双被帆脚索勒红的手。crush 只算心照不宣。
[[tracks.chapters]]
key = "pair_karim_mansur_closer"
title = "交出去的舵"
text = "卡里姆的船驶进吉达水道，舵柄握在一个十六七岁的水手手里，船腹贴着暗礁蹭过去，刮掉一块漆，露出白木。曼苏尔的引水小船从港里冲出来，一路喊着绕到船头，把他们领进了锚地。上了岸，曼苏尔劈头就问：“你疯了？让个孩子掌舵进吉达？”卡里姆靠着缆桩，两只手还留着帆脚索勒出的红印：“我对他说的是，这趟你来掌，我看着帆。我爹当年就这么对我。总得有人先松手，家里那个小弟，早晚也轮到。”曼苏尔没再骂。他解下腰间的水囊，拔了塞，拽过卡里姆的手，把水浇在那两道红印上。“吉达的水不便宜。”卡里姆说。“我的水，我爱浇哪儿浇哪儿。”水囊空了，卡里姆的手还伸着。"
stage = "witness"
window = [[1556, 1, 15], [1556, 3, 31]]
at = "jeddah"
cast = ["karim", "mansur"]
speaker = "karim"
mood = "tender"
news = "摩加迪沙来的船让个毛头小子掌舵进吉达，差点撞上礁；听说是吉达那个老对头开着引水小船出去，把它领进来的。"

[tracks.chapters.default]
next = "pair_karim_mansur_turning"
