# 落点：1558 年初，吉达账房。倒数第二栏的一个空格；一个吻。
[[tracks.chapters]]
key = "pair_karim_mansur_together"
title = "一个空舱位"
text = "新船的舱位表钉在吉达账房的墙上，四十个铺位排得满满当当，最后一栏照例写饮水：十桶。倒数第二栏却空着一格。卡里姆拿指节敲了敲：“这格留给谁？客人我都点过了。”曼苏尔在磨笔，头也不抬：“留给船东。两个船东，一个舱。”“你算了多久？”“从去年错开船期那天起。通行证买一张就够，水也不用备两份，账上怎么算都合算。”他放下笔，走过去，吻了卡里姆。卡里姆手里还捏着那块舱位板，没松。"
