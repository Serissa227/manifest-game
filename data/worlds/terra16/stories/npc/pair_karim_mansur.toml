# 尾声（传闻）：1565 年初，霍尔木兹。随季风往返。
[[tracks.chapters]]
key = "pair_karim_mansur_epilogue"
title = "随季风往返"
text = "霍尔木兹码头上的人都认得那个索马里来的船主，摩加迪沙船主家的长子，去年起住在城里。可每年季风一转，他的船必往红海走一趟，在吉达停足一个朝圣季。吉达那个朝圣船东也一样，季风再转，他的船就靠上了霍尔木兹的栈桥。海关里那个葡萄牙书记官说，他用不着看天：索马里人一到窗口办通行证，风就要变了。今年他早早在抽屉里备好了两份表格，一份给索马里船主，一份给吉达来的那位。"
stage = "rumor"
window = [[1565, 1, 15], [1565, 3, 31]]
at = "hormuz_port"
cast = ["karim", "mansur"]
mood = "cheerful"
news = "霍尔木兹海关的葡萄牙书记官说，那个索马里船主一来办通行证，季风就要转；吉达的朝圣船东跟着也到，年年如此。"

