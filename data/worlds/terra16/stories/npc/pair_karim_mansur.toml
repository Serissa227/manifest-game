# 转折（传闻）：1556 年夏，吉达。巡逻船扣了一条没有通行证的朝圣船，两个老对头头一回同桌。
[[tracks.chapters]]
key = "pair_karim_mansur_turning"
title = "通行证"
text = "听说葡萄牙人的巡逻船在海峡外扣下了一条没有通行证的朝圣船，船上的人被带去了哪里，说法不一：有人讲亚丁，有人讲更远。吉达码头上就出了怪事：两个吵了一年多的船主，在码头边的饭铺里同坐一张桌子，一直坐到伙计来收桌板。曼苏尔摊开海图，卡里姆掏出一张盖着火漆的通行证，是别人的，借来看的。这回桌上不谈分客，只谈那张纸：红海里头要不要，海峡外头多远开始要，没人说得准，两个人就一条一条地抠。散的时候，卡里姆那张借来的纸留在了曼苏尔桌上，曼苏尔把它夹进了自己的账本。"
stage = "rumor"
window = [[1556, 6, 1], [1556, 8, 31]]
at = "jeddah"
cast = ["karim", "mansur"]
mood = "tense"
news = "葡萄牙人在海峡外扣了一条没有通行证的朝圣船，吉达码头饭铺里那两个老对头船主，头一回坐到了同一张桌上。"

[tracks.chapters.default]
