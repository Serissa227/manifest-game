# 抉择：1557 年初，吉达。舱位表的最后一栏。
[[tracks.chapters]]
key = "pair_karim_mansur_choice"
title = "排两条船"
text = "这一季的回程客比往年多，两条船的船期撞在了同一个礼拜。曼苏尔把舱位表铺在桌上，指头点着日子：“我要错开。两条船挤在同一片海里，巡逻船来一趟，两条都拿走。”卡里姆拿过笔，在最后一栏——饮水那一栏——下面空处停住：“错开可以。再添一行，救急的水，你的船缺了我送一桶，我的船缺了你送一桶，不收钱。”曼苏尔盯着那块空处，没说行，也没说不行，转头问我：“你走的海比我们俩都多。这一季，你帮着排一排？”"
stage = "involve"
window = [[1557, 1, 15], [1557, 3, 31]]
at = "jeddah"
cast = ["karim", "mansur"]
speaker = "mansur"
mood = "tense"
news = "吉达那两个老对头船主排今年的船期，吵到半夜才定：两条船错开着走，还各给对方的船留一桶救急的水。"

[tracks.chapters.default]
next = "pair_karim_mansur_together"
