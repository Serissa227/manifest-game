news = "吉达那两个老对头船主没找人帮忙，自己吵到后半夜，把两条船的船期错开了五天，还各给对方的船留了一桶救急的水。"

[[tracks.chapters.choices]]
key = "routes"
text = "替他们查清巡逻船的时辰和要通行证的海域。"
reply = "我在亚丁和摩卡各待了几天，向港务书记、向引水人一条一条打听，半个月后带回一张写满时辰的纸：巡逻船哪几天靠港补水，哪一片海要查通行证，哪一片海看都不看。曼苏尔读完，把自家船的开船日子往后挪了三天，好让卡里姆的船先走。卡里姆盯着那张纸：“这些时辰，你怎么问出来的？”“请书记吃了一晚上的饭。”我说。"
