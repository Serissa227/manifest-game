# 三、转折：1583 年宫廷迁到布拉格（传闻）。
[[tracks.chapters]]
key = "tie_extra_06_magdalena_ilona_turning"
title = "宫廷搬来了"
text = "这一年，皇帝把宫廷从维也纳搬来了布拉格。城堡山脚下一夜多出许多招牌：炼金的、占星的、卖“哲人石”的，还有些说不清做什么营生的生面孔，天天在查理桥上转。坩埚和木炭的价钱翻了一倍。老城那间工房照旧只卖药。听说有个穿天鹅绒的人上门，要买“能点金的粉”，女主人头也没抬：“金子不卖。退烧的、止血的，有。”门边椅子上坐着的黑海女人站起来，把门拉开一半：“买药的进来。别的，出去。”那人走了。没过几天，半条街都管这家叫“不肯点金的那家”。"
stage = "rumor"
window = [[1583, 5, 1], [1583, 9, 30]]
at = "prague"
cast = ["magdalena", "ilona"]
mood = "tense"
news = "皇帝的宫廷搬来以后，布拉格的木炭贵了一倍，炼金的比面包师还多，老城只有一家不肯点金。"

[tracks.chapters.default]
next = "tie_extra_06_magdalena_ilona_choice"
