# 一、相识：1577 年春，半夜治肩伤。
[[tracks.chapters]]
key = "tie_extra_06_magdalena_ilona_meeting"
title = "药先别喝"
text = "后半夜，工房的门被撞开，一个女人带着一身寒气进来，左肩的衣服湿了一大片。玛格达莱娜起身去关门。“别关门。……好，你就站那儿。”女人背贴着门框，一只手按在腰间的刀上，不肯坐，先把窗户看了一圈。玛格达莱娜把刚熬好的药碗推到桌子另一头：“药先别喝。哪里疼？”“少啰嗦。药给我。”“不说哪里疼，我就不猜。”玛格达莱娜翻开账本，“少一分就写少一分，别拿愿望凑。”炉膛噼啪响了好一阵。女人咬着牙，抬手指了指左肩。剪开衣服，洗净，上药。伤是新的，边上却已经收了口，像三五天前的。玛格达莱娜照实记下剂量和这一笔，没在后面打问号，也没问她杀过什么。女人说她叫伊洛娜。走到门口，她回过头：“往后夜里，别关门。”"
stage = "witness"
window = [[1577, 2, 1], [1577, 5, 31]]
at = "prague"
cast = ["magdalena", "ilona"]
speaker = "magdalena"
mood = "tense"
night = true
news = "布拉格老城有间炼金工房，后半夜还亮着灯，听说是在给一个黑海边来的女人治肩伤。"

[tracks.chapters.default]
next = "tie_extra_06_magdalena_ilona_closer"
effects = [{ kind = "tie", a = "magdalena", b = "ilona", relation = "friends" }]

[[tracks.chapters.variants]]
