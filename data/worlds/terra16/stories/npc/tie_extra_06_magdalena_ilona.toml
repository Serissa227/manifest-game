text = "后半夜，工房的门被撞开，一个女人带着一身寒气进来，左肩的衣服湿了一大片。玛格达莱娜起身去关门。“别关门。……好，你就站那儿。”女人背贴着门框，一只手按在腰间的刀上，不肯坐。玛格达莱娜问：“谁让你来的？”“旧城图书馆夜里管书的那个。她说你这里的药不撒谎。”玛格达莱娜哼了一声：“她借了我三本书，一本没还。”她把刚熬好的药碗推到桌子另一头：“药先别喝。不说哪里疼，我就不猜。少一分就写少一分，别拿愿望凑。”女人咬着牙，抬手指了指左肩。伤是新的，边上却已经收了口，像三五天前的。玛格达莱娜照实记下，没问她杀过什么。女人说她叫伊洛娜。走到门口，她回过头：“往后夜里，别关门。”"

# 二、靠近：1578 年秋冬，互教认脚印与称药。
[[tracks.chapters]]
key = "tie_extra_06_magdalena_ilona_closer"
title = "门边那把椅子"
text = "肩上的伤早好了，伊洛娜还是隔几天来一回，有时说还药钱，有时说肩又疼了。入冬前，门外的泥地上一连三夜多出脚印。第四夜她在门槛外撒了一层炉灰，天亮蹲下去看：“这只是新靴子，跟还没磨平。这只拖左脚，走了远路。”玛格达莱娜蹲在旁边学，认错一回，伊洛娜就把灰抹平，重印一遍。回到屋里轮到伊洛娜称药，差一钱，玛格达莱娜把药倒回罐里：“重来。”伊洛娜不服，临走借了一只铜量杯回去练。墙上画着两行道道，谁教一回谁画一道。门边那把椅子渐渐只有伊洛娜坐。有一晚她坐着说了一刻钟的话，才发觉自己背对着窗，愣了一下，先笑了：“你这屋子，把我教坏了。”"
stage = "witness"
window = [[1578, 9, 1], [1578, 12, 31]]
at = "prague"
cast = ["magdalena", "ilona"]
speaker = "ilona"
mood = "tender"
news = "布拉格老城那间炼金工房的女主人，最近天一亮就蹲在门口学认脚印；常来的黑海女人在屋里学称药。"

[tracks.chapters.default]
next = "tie_extra_06_magdalena_ilona_turning"
