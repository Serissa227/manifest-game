# 四、选择：1583 年冬，借炉账的人与桥头的人挤在同一个月。
[[tracks.chapters]]
key = "tie_extra_06_magdalena_ilona_choice"
title = "两张单子"
text = "那个穿天鹅绒的又来了。如今他在城堡山上给贵人炼金，这回不买粉，要借炉账：“借我抄三页。你的数字，替我的金子作个证。”他留下一张字据，说月底来取。同一个月，伊洛娜从查理桥回来，往桌上拍了一张纸：三道杠，其中一道底下画了只歪脚。玛格达莱娜认得那只脚。她把两张纸并排摊开，拿秤砣压住。“我这张能等，你那张不能。”伊洛娜按住那张字据：“你那张也不能。他拿你的数去骗皇帝，骗穿了，先砸的是你的炉子。”那天夜里，工房没点灯。"
stage = "involve"
window = [[1583, 10, 1], [1584, 2, 28]]
at = "prague"
cast = ["magdalena", "ilona"]
speaker = "magdalena"
mood = "tense"
night = true
news = "布拉格查理桥头这些天总站着几个外乡人，老城那间炼金工房一到夜里就不点灯了。"

