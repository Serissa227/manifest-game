# 五、落点：1584 年，恋人，同住工房楼上（缺省即圆满）。
[[tracks.chapters]]
key = "tie_extra_06_magdalena_ilona_landing"
title = "各有一把椅子"
text = "墙上那两行道道画到了门框边，再画不下了。伊洛娜把那只铜量杯擦亮了还回来，搁在账本旁边。玛格达莱娜添了一把椅子，和门边那把并排。伊洛娜放下碗，把刀搁在灶台上，不挡门的地方：“吃完了。我是走，还是留？”玛格达莱娜翻开账本写了一行，推过去。伊洛娜认得的字不多，看了很久：“写的什么？”“少一分就写少一分。我写的是‘愿意’，一分不少。”伊洛娜坐下了，这回没说肩疼。后来她们搬到工房楼上住。那年夏末，窗外有人在讲，两个英格兰人带着一面黑镜子进了城，说是要见皇帝。"
