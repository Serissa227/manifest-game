# C7 故事线重写（Claude，2026-10-11）：故事 2.0 轨道，遵循 docs/DECISIONS.md“第九批 A5 / E37 开工：故事 2.0 TOML 契约”。
# 标签：GL（恋爱，伊洛娜唯一的恋人；两人都是纯 GL）。
# 人物：玛格达莱娜（magdalena，1529-10-25，布拉格老城的炼金术士）× 伊洛娜（ilona，1531-11-24，黑海边来的女人，1560 年起住布拉格）。
#   生年相差两岁；第一章 1577 年两人四十多岁，恋人效果在 1584-03 以后（54 岁、52 岁），远晚于最早日期 1577-01-01。
# 依据：
#   史实——1576 年鲁道夫二世即位；1583 年他把宫廷从维也纳搬到布拉格，城里的炼金术士、占星者与卖“哲人石”的骤增；
#   1584 年 8 月迪伊与凯利来到布拉格，9 月见皇帝（落点章只作窗外闲话，“黑镜子”取坊间说法）。
#   原创——两人的相遇、工房、互教认脚印与称药、门边的椅子、铜量杯、借炉账的“吹炉匠”、查理桥头追她的人。
#   待核——坩埚与木炭“价钱翻了一倍”是街谈口吻，没有具体物价出处；“查理桥”在当时叫石桥或布拉格桥（1870 年才改今名），沿用今名方便辨认。
# 秘密：伊洛娜的来历全线只写“追她的人”“桥头那几个人”“拖左脚的那个”；第一章留一处伏笔（新伤收口快得反常），不点破。
#   见闻、标题、选项、回复都不写她的来历；柳德米拉只以“旧城图书馆夜里管书的”出现在第一章的 variants。
# 缺省走向（玩家什么也不做）：1577 相识（friends）→ 1578 心动（crush）→ 1583 宫廷迁来（传闻）
#   → 1583—84 骗子借账、桥头追兵，她们自己扛过去 → 1584 成为恋人，同住工房楼上（lovers，圆满）。玩家的帮助只让她们少熬几夜。
# 旗标：设 c7_tie_extra_06_magdalena_ilona_together（落点 default）、_helped（choice：挡骗子）、_hidden（choice：引开追兵）；
#   读 c7_pair_ilona_ludmila_confidants（由 npc/pair_ilona_ludmila.toml 设，只用于第一章 variants）。
# 整合：cast/ties.toml 的 extra_06_magdalena_ilona 由 mentor 改为两段——friends（since 1577-05-31，to 1584-08-30）与 lovers（since 1584-08-31，即缺省落点日）；
#   ilona_ludmila 由 lovers 改为 confidants。日程不必改：两人 1560 年起都在布拉格。

