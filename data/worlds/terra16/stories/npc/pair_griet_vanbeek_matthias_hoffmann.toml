# 一起做坏（pair_griet_vanbeek_matthias_hoffmann）——配角线，标签 GB；赫丽特只对异性开放，马蒂亚斯同；恋爱线。
# 人物：赫丽特·范贝克（griet_vanbeek，1535-03-17 生），米德尔堡眼镜坊的学徒，爱磨镜片，想叠两片做一支能看远的筒；
#       马蒂亚斯·霍夫曼（matthias_hoffmann，1534-02-06 生），纽伦堡来的钟表匠，1557 年起在安特卫普，要做一只到了海上也不乱走的钟。
#       1557 年春相识时她 21—22 岁、他 23 岁，全线都在成年以后：1558 年心动（crush），1560 年春起伴侣（partners）。
# 依据（史实）：纽伦堡钟表匠彼得·亨莱因（1542 年卒）；1559 年 8 月腓力二世的船队从弗利辛恩启程回西班牙；
#       米德尔堡是荷兰沿海的眼镜与玻璃行当所在，弗利辛恩是它的出海口。
# 原创：两人的故事、那两本工簿、海上试钟与叠镜的失败、贵族管事的"已成"证书、招牌上的顺序。
#       不宣称提前造出望远镜或航海钟：筒与钟全线都没做成，做成的是作坊。
# 待核：16 世纪中叶弗利辛恩船上试钟的具体办法（正文只写钟在甲板上走乱、镜片看远处是一团亮）。
# 缺省走向：相识（无关系）→ 海上试验失败、她按住那一页不许撕（crush）→ 国王船队走后，贵族管事来打听海上定经度的钟（传闻）
#       → 管事要他们写一纸"已成"的证书、预付当场给（无人插手：两人回绝，作坊靠眼镜与桌钟撑下来）
#       → 1560 年春招牌挂出"范贝克与霍夫曼"（partners，合开工坊，圆满）。没有坏结局。
#   帮助一：在交易所替他们办一场公开试验（_helped），赫丽特当众念误差，落点同缺省。
#   帮助二：替他们找老实买主（_helped），落点同缺省。
#   玩家的帮助只改变作坊撑下来的方式，不改变两人的结局。
# 共享旗标（写）：c7_pair_griet_vanbeek_matthias_hoffmann_helped、c7_pair_griet_vanbeek_matthias_hoffmann_together。不读外部旗标。
# 日程：赫丽特的静态日程在 middelburg（无地点 key）；落点章的 default 用 schedule 效果把她迁到 antwerp（venue workshop）。
#       整合方若更愿意改静态日程，请把她 1560-04 起的日程改成 antwerp / workshop，并同步此处。
#       cast/ties.toml 里这一对的 since 写 1560-12-31，落点章在 1560-04..06，整合时请改成不晚于 1560-06-30 的日期。
# 秘密：赫丽特爱从阁楼上用镜片看港口，写成习惯，不写成偷窥；马蒂亚斯缺钱时夸口、最怕承认失败，closer 写他第一次承认。

