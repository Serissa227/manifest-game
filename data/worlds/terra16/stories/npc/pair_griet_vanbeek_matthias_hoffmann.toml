# 落点：1560 年春，安特卫普作坊。两人都已成年（25 岁、26 岁），伴侣。
[[tracks.chapters]]
key = "pair_griet_vanbeek_matthias_hoffmann_together"
title = "招牌上的顺序"
text = "安特卫普街角的铺面换了招牌，漆还没干：“范贝克与霍夫曼”。她的名字在前。“钟没成，筒没成，”马蒂亚斯扳着手指数，“失败记了两本，写满了。作坊倒是成了。”赫丽特站在梯子上摸那块牌子：“顺序是我定的，你没意见吧？”“你进门头一天就定了。”他取下架上一只小钟，上满发条，放到阁楼窗下她的磨镜台边，台角那片镜片正对着河上的桅杆。台子和那箱镜片是上个月从米德尔堡运来的，她的外衣挂在他的钉子旁边。“这只不上船，放这儿。”赫丽特把耳朵凑近听了听。“走慢了一点。”她说，“我记下来。”"
stage = "witness"
window = [[1560, 4, 1], [1560, 6, 30]]
at = "antwerp"
