# 相识：1557 年春，安特卫普，马蒂亚斯刚搬来的作坊。
[[tracks.chapters]]
key = "pair_griet_vanbeek_matthias_hoffmann_meeting"
title = "她先说一起"
text = "安特卫普街角的铺面刚租出去，墙上的钉子还空着一半。一个额头上推着镜片的姑娘闯进来，手直接伸向工台上那只带摆轮的铜钟。“别碰那个！发条还没上紧。”马蒂亚斯把钟抢进怀里，“要上船的，你碰歪一个齿，我三天白干。”“赫丽特，米德尔堡来买玻璃的。”她的眼睛已经转到他腰间，“你那个罗盘，能借我拆开看看吗？”他挺直腰：“亨莱因的传人，罗盘不借外行拆。”两人从罗盘吵到摆轮，吵到两片镜片叠起来能不能看远，吵了一刻钟，赫丽特一拍工台：“一起做。你做钟，我做能看远的筒。”“做成了署谁的名？”“我的先写。”她从架子上抽出两本空工簿，“失败也记两份，一人一本。”"
stage = "witness"
window = [[1557, 3, 1], [1557, 5, 31]]
at = "antwerp"
cast = ["griet_vanbeek", "matthias_hoffmann"]
speaker = "griet_vanbeek"
mood = "cheerful"
news = "安特卫普新来的纽伦堡钟表匠和米德尔堡来的磨镜姑娘在作坊里吵了一刻钟，最后说要一起做东西。"

[tracks.chapters.default]
next = "pair_griet_vanbeek_matthias_hoffmann_closer"
effects = []

# 靠近：1558 年夏，弗利辛恩外的水道。两人都已成年，只写心照不宣。
[[tracks.chapters]]
key = "pair_griet_vanbeek_matthias_hoffmann_closer"
title = "晃过才算"
text = "弗利辛恩外的水道上，一条运呢布的船答应让他们上去试一趟。钟在岸上走得准，上了甲板就乱，针追着浪头跳。赫丽特把叠好的两片镜片举到眼前，对着远处的塔尖看了半天：“一团亮。”一个浪头打来，钟箱滑向舷边，马蒂亚斯伸手拽住的是赫丽特的袖子。钟撞上缆桩，针又歪了半格。回到舱里，他翻开工簿，捏住那一页的角：“撕了吧，下回再试。”赫丽特的手掌拍在纸上，压住他的指头：“晃过才算数。”他盯着那页看了很久，终于开口：“没成。”“对，没成。记下来。”她把笔塞给他，手没抽走。"
stage = "witness"
window = [[1558, 6, 1], [1558, 8, 31]]
at = "flushing"
cast = ["griet_vanbeek", "matthias_hoffmann"]
speaker = "matthias_hoffmann"
mood = "tender"
news = "弗利辛恩有条船载过一只钟和一个磨镜的姑娘出海，回来时钟走乱了，姑娘倒笑得很高兴。"

[tracks.chapters.default]
next = "pair_griet_vanbeek_matthias_hoffmann_turning"
effects = [{ kind = "tie", a = "griet_vanbeek", b = "matthias_hoffmann", relation = "crush" }]

# 转折（传闻）：1559 年 8 月起，国王的船队从弗利辛恩启程，有个管事在打听海上定经度的钟。
[[tracks.chapters]]
key = "pair_griet_vanbeek_matthias_hoffmann_turning"
title = "国王的船队"
text = "国王的船队从弗利辛恩起锚，回西班牙去了，码头上空出一大片水面，酒馆里的话题却没跟着走。有人说，船队启航前，一位老爷家的管事在弗利辛恩、安特卫普两头打听：谁能做一只在海上也定得准经度的钟？说国王的领航员用得上，价钱好商量，先付后交也行。问到后来，有人给他指了安特卫普街角那个纽伦堡来的钟表匠，说那人张口就是“快成了”。"
stage = "rumor"
window = [[1559, 8, 15], [1559, 10, 31]]
at = "flushing"
cast = ["griet_vanbeek", "matthias_hoffmann"]
mood = "tense"
rumor_days = 60
news = "国王的船队从弗利辛恩走了，听说有个贵族管事在打听能在海上定经度的钟，出价好商量。"

[tracks.chapters.default]
next = "pair_griet_vanbeek_matthias_hoffmann_choice"
