# 抉择：1559 年冬，安特卫普作坊。管事要一纸"已成"的证书；玩家可以插手，也可以看着。
[[tracks.chapters]]
key = "pair_griet_vanbeek_matthias_hoffmann_choice"
title = "卖不卖希望"
text = "管事找上门来，把一袋定金放在工台上，沉得压住了摊开的图纸：“写一纸证书，说这只钟在海上已经试成。预付当场给。”马蒂亚斯没吭声，手在桌下攥着，上个月的房租还欠着。“其实，已经——”他的嘴张开又合上。赫丽特把工簿翻到弗利辛恩那一页，啪地摊在管事面前：“这页读过没有？钟在船上乱成这样，我们写什么‘已成’？这笔谎钱不赚。”管事转向我，像在找一个讲道理的人。赫丽特也转过来：“你路子广——除了这袋钱，还有别的路吗？”"
stage = "involve"
window = [[1559, 11, 1], [1560, 1, 31]]
at = "antwerp"
cast = ["griet_vanbeek", "matthias_hoffmann"]
speaker = "griet_vanbeek"
mood = "tense"
news = "那个打听海上钟的贵族管事在安特卫普碰了钉子，听说被一个磨镜的姑娘当面拒了，摔门走的。"

[tracks.chapters.default]
next = "pair_griet_vanbeek_matthias_hoffmann_together"
