# 相识：1558 年夏秋，卡亚俄码头。两串绳差三个结，错的是迈塔。
[[tracks.chapters]]
key = "tie_new_mayta_qipu_ika_meeting"
title = "对不上的绳"
text = "钦查的筏靠上卡亚俄的码头，迈塔蹲在跳板边对账，膝头摊着家里的货绳。伊卡替老师送交货绳来，往旁边一摆，两串差了三个结。“是你错了，快点数，筏等着呢！”伊卡一催，迈塔反倒数得更慢了。他伸手想去数伊卡那串，伊卡一把按在胸口：“别碰那串绳，是老师的！”“没碰。”迈塔收回手，“先数结，再装货。”两人一人一串，一个结对一个结往下数，数到第四十个结，错处出来了：一包三串的海菊蛤，迈塔数成了两包。“三个结！迈塔数错了三个结！”伊卡得意得满码头喊。迈塔脸红到耳根，把那个结拆开，重新打紧。伊卡伸指头捏了捏新结：“这回紧了。”扛起自己的绳走出老远还在笑，迈塔又把那个结捏了一遍，才喊人装货。"
stage = "witness"
window = [[1558, 6, 1], [1558, 10, 31]]
at = "callao"
cast = ["mayta_qipu", "ika"]
speaker = "ika"
mood = "cheerful"
news = "卡亚俄码头上，两个钦查小伙子为三个绳结蹲着数了一下午，错的那个红着脸重打了结，另一个笑得半个码头都听见了。"

[tracks.chapters.default]
next = "tie_new_mayta_qipu_ika_closer"
effects = [{ kind = "tie", a = "mayta_qipu", b = "ika", relation = "friends" }]

# 靠近：1563 年，卡亚俄石阶。迈塔替伊卡把造筏的账打成一串绳。
[[tracks.chapters]]
key = "tie_new_mayta_qipu_ika_closer"
title = "自己的筏"
text = "伊卡逢人就说，他要有一只自己的筏，好叫那些笑他“只会摸绳子”的人闭嘴。这天在卡亚俄的码头上他又说了一遍，迈塔等他说完才开口：“九根巴尔萨木，两张帆，一根桅。欠两百比索，一年还四十，五年。”“你就不能让我痛痛快快做一晚上梦？”伊卡嚷嚷。迈塔没接话，蹲在石阶上，拿一截新绳把这些数一样一样打上去，末尾系了个记号：三个短结夹一个长结，是伊卡。他把绳递过去：“先数结，再装货。这是你的筏。”伊卡用指尖一个结一个结摸过去，半天没出声，耳朵先红了，最后把绳塞进腰里，和老师那串并排。"
stage = "witness"
window = [[1563, 5, 1], [1563, 9, 30]]
at = "callao"
cast = ["mayta_qipu", "ika"]
speaker = "mayta_qipu"
mood = "tender"
news = "卡亚俄码头上有个嗓门最大的筏手，逢人就说要造自己的筏；昨天他的朋友蹲在石阶上，替他把造筏的账打成了一串绳。"

[tracks.chapters.default]
next = "tie_new_mayta_qipu_ika_turning"
effects = [{ kind = "tie", a = "mayta_qipu", b = "ika", relation = "confidants" }, { kind = "memory", memory = "mem-tie_new_mayta_qipu_ika-closer", title = "自己的筏" }]

# 转折一（传闻）：1571 年，阿里卡客栈。银子下山，伊卡去了阿里卡。
[[tracks.chapters]]
key = "tie_new_mayta_qipu_ika_turning"
title = "去了阿里卡"
text = "阿里卡的客栈里，赶驼人一边脱靴子一边讲：波托西的银锭一队驼羊接一队驼羊下山，到了这里全要靠筏子摆渡到大船上，筏手一天挣的，抵得上钦查三天。“钦查那位库西·瓦伊纳的徒弟，嗓门最大的那个，上个月才到，”卖鱼的接话，“满码头嚷，说波托西的银子都从他脚底下过。”“他腰里揣着一串绳，”赶驼人说，“谁伸手，他按谁：‘别碰，这是我的筏！’”刚从钦查来的筏手笑了：“我走之前去过迈塔家，说伊卡到阿里卡了。迈塔头也没抬，说：‘知道，账上记着。’”"
stage = "rumor"
window = [[1571, 3, 1], [1571, 7, 31]]
at = "arica"
cast = ["mayta_qipu", "ika"]
mood = "cheerful"
news = "阿里卡的客栈里都在说，波托西的银子如今全从这里下海，钦查那个嗓门最大的筏手也来了，腰里揣着一串绳。"

[tracks.chapters.default]
next = "tie_new_mayta_qipu_ika_turning_b"
effects = []

# 转折二（传闻）：1572 年秋冬，卡亚俄酒馆。库斯科的消息只写传闻，不写刑场。
[[tracks.chapters]]
key = "tie_new_mayta_qipu_ika_turning_b"
title = "库斯科的消息"
text = "库斯科来的骡夫在卡亚俄的酒馆里压低了嗓门：山里最后那位印加，图帕克·阿马鲁，被押到库斯科的广场上处死了。酒馆里静了很久。第二天码头上记绳账的人收绳都比往常早，巡查的官员也放了话：往后各村的账，要一根绳一根绳念给他们听。“钦查的迈塔这几天住在码头客栈，夜里点着灯，把带来的账绳全数了一遍，”卖酒的说，“我问他数什么，他说：‘明天要是有人问，我得答得上。’”阿里卡来的筏手还捎了伊卡的话：“告诉那个慢吞吞的，慌什么，慌了也没人替他数！”"
stage = "rumor"
window = [[1572, 10, 15], [1573, 1, 31]]
at = "callao"
cast = ["mayta_qipu", "ika"]
mood = "tense"
news = "库斯科来的消息说山里最后那位印加被处死了，卡亚俄的记账人收绳收得比平时早，巡查的官员说往后各村的账都要念给他们听。"

