news = "卡亚俄的衙门里，钦查筏商的后生一个结一个结把账绳念完了，念得慢，巡查官不耐烦，却没挑出错；阿里卡来的筏手散堂就回去了，他那只筏的木料还得再等一冬。"

[[tracks.chapters.choices]]
key = "testify"
text = "站到堂上，替迈塔作证：这串绳的每个结，我的船都对过货。"
