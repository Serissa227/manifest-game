# 抉择：1574 年，卡亚俄衙门。迈塔当堂卡住；伊卡的筏缺木料。两件事等着，主角在门口。
[[tracks.chapters]]
key = "tie_new_mayta_qipu_ika_choice"
title = "念成西班牙话"
text = "卡亚俄的衙门里，巡查官案前摊着钦查筏商的账绳，旁边坐着书记和通译。“念。念成西班牙话，念不出来，就算瞒报。”迈塔站在堂中央。这套话他夜里对着墙练过不知多少遍，真一开口——“这一串是……”——嗓子就像被绳子勒住了。堂下挤进来的是伊卡，一身阿里卡的海风味，嗓门压得前所未有地低：“先数结，迈塔，先数结。”说完他回头朝门口的我使了个眼色，又把袖口里露出的一角木料单按回去：“我那只筏，木料还差一半。不急……你先看他。”"
stage = "involve"
window = [[1574, 4, 1], [1574, 8, 31]]
at = "callao"
cast = ["mayta_qipu", "ika"]
mood = "tense"
news = "卡亚俄的巡查官要筏商把结绳账当堂念成西班牙话，堂下站着一个从阿里卡赶来的筏手。"

[tracks.chapters.default]
next = "tie_new_mayta_qipu_ika_landing"
