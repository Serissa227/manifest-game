# 记在账绳上的筏名（tie_new_mayta_qipu_ika）——配角线，标签 BL；新线，恋爱线。
# 人物：迈塔·基普（mayta_qipu，1540-03-25 生），钦查筏商之子，学院同学，把每根绳结当作不能改口的约；
#       伊卡（ika，1540-02-21 生），钦查筏家的儿子，结绳记事官库西·瓦伊纳的徒弟，1571 年起常驻阿里卡。
#       全线都在成年以后：1558 年相识（两人 18 岁，friends）；1563 年知己（confidants）；
#       1575 年恋人（lovers，窗口起日 1575-03-01，迈塔 34、伊卡 35；最早可用日 1558-03-25）。落点以前不写告白，两种结局都接得上。
# 依据（史实）：1570—75 年总督托莱多的大巡查与集村，官员要各村把结绳账念给书记和通译听；
#       1572 年 9 月图帕克·阿马鲁在库斯科被处死（只写传闻，不写刑场）；
#       阿里卡成为波托西白银下山后装船出海的港口；钦查的筏商做海菊蛤与干货的生意，巴尔萨木来自瓜亚基尔一带。
# 原创：两人的故事；筏名“狐狸”（取自安第斯人在银河里看到的黑影）；三个短结夹一个长结的记号；账绳上的赭红线。
#       库西·瓦伊纳只在台词里出现，他的秘密与伊卡偷拆过一个结的事都不写；迈塔夜里对着墙练习给外行讲结绳账，只在 choice 章里派上用场，见闻不写。
# 待核：1574 年卡亚俄堂审的具体程序（正文取通译与书记在旁记录的大意）；1571 年阿里卡下银的规模（正文一律用传闻口吻）。
# 缺省走向：相识 → 数错的结 → 自己的筏 → 去了阿里卡（传闻）→ 库斯科的消息（传闻）
#       → 1574 年念成西班牙话（无人插手：迈塔自己慢慢念完，没出错；伊卡的筏又晚一冬）
#       → 1575 年伊卡的筏在阿里卡下水，筏名打进迈塔的账绳，两人成为恋人（远距相守：一个在钦查，一个在阿里卡，账绳来回带着走）。
#   帮助：站到堂上作证（_helped）→ 落点变体：账绳头上拴着书记留下的纸条。
#   撮合：从瓜亚基尔运巴尔萨木给伊卡（_timber）→ 落点变体：筏底最粗的那根木头上刻着结。
# 并肩：主角在 bond_mayta_qipu 的 S 章立了约（promise / heart 设 c7_tie_new_mayta_qipu_ika_taken），
#       主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_mayta_qipu_ika_side 写两人成为账绳与筏的搭档（confidants，不把 closer 已设的知己降回朋友）。
# 共享旗标：读 c7_tie_new_mayta_qipu_ika_taken；写 c7_tie_new_mayta_qipu_ika_together、_side、_helped、_timber。
# 日程（整合方）：迈塔日程在钦查，去卡亚俄、阿里卡是故事内的出行，不改日程；伊卡 1559—1570 在钦查、1571 年起在阿里卡，去卡亚俄同样是出行。
# 秘密（不进见闻）：迈塔练习把结绳账讲给外行；伊卡拆过老师远航绳上的一个结。

[[tracks]]
