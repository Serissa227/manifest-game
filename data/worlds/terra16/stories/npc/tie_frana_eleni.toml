# 树皮上的小口（tie_frana_eleni）——配角线，标签 GL；两人都是纯 GL，恋爱线。
# 人物：芙拉娜·卢基奇（frana，1534-12-02 生），拉古萨共和国的年轻女使者；
#       埃莱妮（eleni，1535-09-14 生），希俄斯南部玛蒂克树园的姑娘，在城里集市卖树脂。
#       1564 年相识时两人都已二十八九岁，全线都在成年以后：1565 年心动（crush），1567 年起恋人（lovers）。
# 依据（史实）：玛蒂克只产在希俄斯南部的村子，买卖由热那亚人的马奥纳商团（朱斯蒂尼亚尼家）包揽；
#       七月在树皮上划口，树下扫平、撒一层白土接着，八九月收凝住的“眼泪”（简报写“白布”，按实际做法改成白土）。
#       1565 年夏奥斯曼舰队围马耳他不下；1566 年 4 月皮亚莱帕夏率舰队到希俄斯，岛上没有抵抗，
#       商团主事人被押走，马奥纳解散，此后玛蒂克归苏丹宫廷。拉古萨向奥斯曼纳贡、也和威尼斯通商；威尼斯在伊斯坦布尔常驻巴伊洛。
# 原创：两人的故事、那份条约、埃莱妮的父亲替商团账房掌秤的旧事、新税吏的户籍册。
# 待核：皮亚莱到港的日子（多说 1566-04-14，正值复活节）；商团主事人押往伊斯坦布尔、再流放卡法的细节——正文只用传闻口吻。
# 缺省走向：相识（friends）→ 第二季心动（crush）→ 换旗（传闻）→ 留还是走（无人插手：芙拉娜自己带走条约，
#       埃莱妮一家留在岛上，那杆秤交给了税吏）→ 每年割树脂的月份相见（lovers，远距相守）。
#   帮助一：替芙拉娜把条约送回拉古萨（_helped），芙拉娜腾出手保住埃莱妮家，落点同缺省。
#   帮助二：把埃莱妮一家接去拉古萨（_ragusa），埃莱妮在拉古萨港边开铺，落点 landing_b（圆满）。
#   会有后果：把条约卖给威尼斯的巴伊洛（_sold），芙拉娜被召回、三年不许出使；两人仍是恋人，她自己掏钱搭商船来（landing 的 variants）。
# 共享旗标（写）：c7_tie_frana_eleni_together（两个落点都设）、c7_tie_frana_eleni_ragusa（tie_extra_01_cecilia_frana 读）、
#       c7_tie_frana_eleni_helped、c7_tie_frana_eleni_sold。不读外部旗标。
# 日程：缺省不改；只有 take_family 选项用 schedule 效果把埃莱妮搬到 ragusa_port。
# 秘密：埃莱妮瞒着商团把树脂卖给外国船——不进任何见闻，本线正文也不写。

[[tracks]]
key = "tie_frana_eleni"
name = "树皮上的小口"
kind = "request"
start = "tie_frana_eleni_meeting"
auto = true
cast = ["frana", "eleni"]

# 相识：1564 年割树脂的季节，希俄斯南部树园。
[[tracks.chapters]]
key = "tie_frana_eleni_meeting"
title = "别割这么深"
text = "拉古萨来的使者要谈一批玛蒂克。埃莱妮不急着报价，先领她上了南边的树园，递过去一把弯头小刀：“想压我的价，先给树划一道口子。”芙拉娜握刀像握印玺，端端正正往下一按，刀尖吃进去半指深，树皮翻起一片白茬。埃莱妮一把按住她的手腕：“树不是纸！划坏了你重抄一份？它明年还得流眼泪呢。”使者看着那道口子，半天才说：“对不起。”说完自己先愣住了。她在议事厅里道过很多次歉，每一次都是替一句话。下午回到集市，埃莱妮吵价钱吵得半条街都听得见，使者句句是好话。埃莱妮吵赢了，把一包树脂拍在她面前：“这一包是最好的眼泪。……别听隔壁的，他那是去年的货。”拍完又往她手心里塞了一小块。芙拉娜上船的时候，那一小块还攥在手里。"
stage = "witness"
window = [[1564, 7, 1], [1564, 9, 30]]
at = "chios"
cast = ["frana", "eleni"]
speaker = "eleni"
mood = "cheerful"
news = "希俄斯南边的树园里，拉古萨来的女使者学割树脂，一刀下去割得太深，被园里卖树脂的姑娘一把按住了手腕。"

[tracks.chapters.default]
next = "tie_frana_eleni_closer"
effects = [{ kind = "tie", a = "frana", b = "eleni", relation = "friends" }]

# 靠近：1565 年割树脂的季节，同一棵树下。两人都已成年，可以写心动。
[[tracks.chapters]]
key = "tie_frana_eleni_closer"
title = "第二季的眼泪"
text = "第二年割树脂的季节，拉古萨的船一靠岸，芙拉娜没去商栈，先上了南边的树园。树底下扫得平平的，撒了一层白土，早先划的口子正往下淌，一滴一滴落在白土上，凝成泪珠的样子。两人蹲着数，数到四十几，埃莱妮忽然问：“你这回说的，是真话，还是使者的话？”“真话。所以说得很难听。”芙拉娜没抬头，“苏丹的舰队在马耳他城下啃不动，明年开春再出海，总要找一块好啃的。我怕明年再来，这座岛换了主人，我找不到这棵树。”埃莱妮没回嘴。她捉过芙拉娜的手，把指缝里粘的树脂一点一点抠干净，抠完了也没松开。"
stage = "witness"
window = [[1565, 7, 15], [1565, 10, 15]]
at = "chios"
cast = ["frana", "eleni"]
speaker = "frana"
mood = "tender"
news = "拉古萨的女使者今年又来了希俄斯，这回没先去码头谈价钱，先去了南边的树园，在一棵树底下蹲了一下午。"

[tracks.chapters.default]
next = "tie_frana_eleni_turning"
effects = [{ kind = "tie", a = "frana", b = "eleni", relation = "crush" }]

# 转折（传闻）：1566 年 4 月皮亚莱帕夏不战而取希俄斯，马奥纳解散。
[[tracks.chapters]]
key = "tie_frana_eleni_turning"
title = "换旗的码头"
text = "码头上的人都说，皮亚莱帕夏的舰队是复活节那天进港的，船多得把港口塞满了。“连条舢板都挤不进来，”卖鱼的说，“可岛上一枪也没放。”热那亚人账房的门贴了封条，主事的几位老爷被押上船，听说往伊斯坦布尔去了。树脂还是要收的，苏丹宫里也嚼这个，只是秤换了人掌。集市上卖玛蒂克的那个姑娘，全岛嗓门最亮的那个，这几天谁跟她还价，她都只回一句：“就这个数，爱买不买。”一句也不多吵。又有人说，港里见着了拉古萨的船旗。"
stage = "rumor"
window = [[1566, 4, 15], [1566, 6, 30]]
at = "chios"
cast = ["frana", "eleni"]
mood = "tense"
rumor_days = 60
news = "希俄斯换了旗，一枪没放；热那亚人的账房贴了封条，可南边的树园到了七月，照样得有人蹲到树下划口子。"

[tracks.chapters.default]
next = "tie_frana_eleni_choice"
