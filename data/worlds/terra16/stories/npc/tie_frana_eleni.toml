# 落点 B（把埃莱妮一家接去拉古萨）：1567 年，拉古萨港边的玛蒂克铺子。
[[tracks.chapters]]
key = "tie_frana_eleni_landing_b"
title = "一小袋树脂"
text = "拉古萨港边新开的那间铺子不大，柜台上一排敞口陶罐，装的全是希俄斯的玛蒂克，旁边挂着那杆用了二十年的秤。老板娘讲价照旧像吵架，吵得隔壁的威尼斯商人宁可绕到后街去进货。芙拉娜每回出使前都来，只要一小袋，揣进斗篷里离条约最近的那只口袋。“这是贿赂？”埃莱妮一边称一边斜眼看她，“拿去给帕夏的人尝尝？”“这是眼泪。”芙拉娜把袋口系紧，“谁也不给。”埃莱妮哼了一声，秤杆还没平，又往袋里丢了一小块。"
