# 落点（缺省、帮助一、卖条约）：1567 年割树脂的月份，埃莱妮留在希俄斯，芙拉娜每年来住一个月。
[[tracks.chapters]]
key = "tie_frana_eleni_landing"
title = "每年的树影"
text = "割树脂的月份，拉古萨的船又来了。芙拉娜在岛上住一个月，月底就走，年年如此。埃莱妮把今年的头一滴眼泪留着，用无花果叶包好，等她进了园子才拿出来：“你每回都晚来三天。”“使者总要晚三天，”芙拉娜把叶子揭开一角，“显得体面。”“体面能当饭吃？”埃莱妮嘴上不饶，人已经挨着她坐下了。两个人在树影里一直坐到天黑，坡下谁家的狗叫了半天，也没起身。第二天一早，芙拉娜接过那把弯头小刀，在树皮上划了一道。不深不浅，正好。"
