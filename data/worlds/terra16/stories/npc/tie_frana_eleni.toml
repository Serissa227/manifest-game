# 抉择：1566 年夏秋，希俄斯码头。芙拉娜带着条约赶到；埃莱妮家不在新户籍册上。
[[tracks.chapters]]
key = "tie_frana_eleni_choice"
title = "留还是走"
text = "“阁下远道而来，拉古萨不胜荣幸。……好了，客套话说完了，这回是我有求于你。”芙拉娜把我拉到码头背风的角落，掀开斗篷一角，衬里缝了一道新线，针脚细得像绣花。“条约。落到帕夏手里，是拉古萨私通威尼斯；落到威尼斯人手里，是拉古萨私通苏丹。哪边拿到，都够打一仗。”埃莱妮站在她身后，攥着一张户籍册的抄页。新造的册子上，她那个村子少了一户，正是她家：她父亲替热那亚人的账房掌了二十年秤，新来的税吏正拿着旧账挨家敲门。“我只能管一件。”芙拉娜说。“那你管你的纸，我管我的树。”两人都没走开，一齐看着我。"
stage = "involve"
window = [[1566, 7, 1], [1566, 10, 31]]
at = "chios"
cast = ["frana", "eleni"]
speaker = "frana"
mood = "tense"
news = "希俄斯换旗以后，港里总有个拉古萨女人进进出出，说是来收树脂的，可一包也没见她买。"

[tracks.chapters.default]
