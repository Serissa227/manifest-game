# 上岸再说（pair_nikos_murad）——配角线，标签 BL；恋爱线（先心照不宣，1557 春成为恋人）。
# 人物：尼科斯（nikos，1531-01-13 生，纯 BL），亚历山大港的希腊潜水人，夜里下水摸法罗斯灯塔的残石，捞上来的碎石先擦净刻字；
#       穆拉德（murad，1532-03-02 生，纯 BL），盖特贝伊城堡的年轻守兵，夜班时认得每一盏归航的灯。
#       全线两人 21—26 岁，早已成年；crush 出现在 1554 夏（两个成年人之间），lovers 与一个吻出现在 1557 春（最早可用日 1557-01-01，窗口在其后）。
# 依据（史实）：盖特贝伊城堡 1477—1479 年建，用了倒塌的法罗斯灯塔的残石；亚历山大港的水下有灯塔与古城的碎石；1517 年起埃及属奥斯曼，港口有守军。
# 依据（原创）：两人与全部情节；绳头、新绳、半个刻字的碎石、带字的铅板、拓本与抄写员。铅板上的字读出了什么，全线一概不写（与 cast 里尼科斯的人设呼应，留给别处）。
# 秘密：cast 没有写明，不另编。见闻里不写藏铅板的地方。
# 口头禅：穆拉德“巡更到这里，我还没走。”只在 meeting 用一次；尼科斯“水下的字，别在岸上替它编。”只在 choice 用一次；其余章节只换说法回响。
# 与 cast 人设的对应：人设说 1556 年那块铅板让两人“头一回在白天说话”，所以 choice 章写在白天的城堡后墙根。
# 缺省走向（玩家不在场也照样发生）：1553 春夜里相识 → 1554 夏一根新绳、一块只有半个字的碎石，心照不宣（crush）
#   → 1555 夏传言（铅板与被盘问一夜的守兵）→ 1556 秋铅板怎么办：缺省是穆拉德逼尼科斯答应不再一个人夜里下水，铅板仍收着
#   → 1557 春白天并肩走东港，城堡背风的墙下一个吻，成为恋人（lovers，设 _together）。没有坏结局。
#   帮助（_helped，找抄写员）：together 变体里尼科斯怀里揣着抄下来的几个字；
#   帮助（_matched，公开拓本）：together 变体里拓本挂在清真寺书库的墙上。三个分支都通向同一个结局。
# 共享旗标：写 c7_pair_nikos_murad_together（together 章）、_helped、_matched；不读任何外部旗标。
# 日程与 ties（整合方）：两人日程都在亚历山大（alexandria），无需改动；
#   cast/ties.toml 的 nikos_murad 现为 since [1556, 12, 31]，与本线的 1557 春对不上，请改为 since [1557, 5, 31]，
#   note 里“头一回在白天说上话”仍可用（对应 1556 秋的 choice 章）。
# 窗口（2026-11-01 close-places）：choice（involve）由 1556-09..11 挪到 1557-01-01..02-28——玩家 1557 年才掌船，亚历山大港也没有养成家庭，
#   原窗口谁也到不了，找抄写员、做拓本两条路与 together 的 _helped / _matched 变体都走不到。正文不写季节，“铅板睡了一年”改“睡了一年多”（1555 年夏捞上来）；
#   cast 人设里“若已到 1556 年……头一回在白天说了话”的说法未改，早一两个月，不影响章节。

[[tracks]]
key = "pair_nikos_murad"
name = "上岸再说"
kind = "request"
start = "pair_nikos_murad_meeting"
auto = true
cast = ["nikos", "murad"]

# 相识：1553 春，城堡脚下的礁石。绳头，干衣。
[[tracks.chapters]]
key = "pair_nikos_murad_meeting"
title = "绳头别松"
text = "盖特贝伊城堡脚下的礁石上拴着一根绳。夜夜有人顺着它下水，摸法罗斯灯塔掉进海里的石头；夜夜有个守兵从城墙上走过，只当没看见，每回走回来，绳头却比先前离他的脚近一截。这天夜里绳子终于动了。潜水人尼科斯爬上礁石，牙关打战：“你这样……不怕挨罚？”守兵穆拉德板着脸，一件干衣当头扔过去。“巡更到这里，我还没走。先别冻着。”尼科斯接住衣服，先把手里那块碎石上的泥擦净，才擦自己的头发。"
stage = "witness"
window = [[1553, 4, 1], [1553, 6, 30]]
at = "alexandria"
cast = ["nikos", "murad"]
speaker = "murad"
mood = "tender"
news = "亚历山大港盖特贝伊城堡脚下夜里常有人下水，守夜的兵说从没看见过，可礁石上的绳头天天换个地方。"

[tracks.chapters.default]
next = "pair_nikos_murad_closer"
effects = []

# 靠近：1554 夏，同一块礁石。新绳，半个字；crush 只算心照不宣。
[[tracks.chapters]]
key = "pair_nikos_murad_closer"
title = "换掉的绳"
text = "礁石上那根旧绳磨出一段毛茬。穆拉德摸了一夜，第二天揣来一捆新的，往尼科斯怀里一塞。“下回再用旧的，我就喊人。”“你怎么……知道它要断？”“我每夜都摸一遍。”穆拉德说完，耳根有点红，只管看海。尼科斯没急着下水。他坐下来，把当天捞的一块碎石擦干净递过去，断面上刻着半个字，像个钩子。穆拉德捧着它，像捧一碗烫手的汤，捧了很久才还回去。"
stage = "witness"
window = [[1554, 5, 1], [1554, 7, 31]]
at = "alexandria"
cast = ["nikos", "murad"]
speaker = "nikos"
mood = "tender"
news = "亚历山大港盖特贝伊城堡的守夜兵不知从哪儿弄来一根新绳，听说拴在了城堡脚下的礁石上。"

[tracks.chapters.default]
next = "pair_nikos_murad_turning"
effects = [{ kind = "tie", a = "nikos", b = "murad", relation = "crush" }]

# 转折（传闻）：1555 夏。铅板的传言，守兵被问一夜。
[[tracks.chapters]]
key = "pair_nikos_murad_turning"
title = "带字的铅"
text = "港里传开一件事：有个希腊潜水人从灯塔的老石头堆里捞上来一块铅板，刻满了谁也不认得的字。卖鱼的说是宝藏图，磨坊的老婆子说是邪书，念过几年经的说，铅这东西，不会无缘无故刻字。前几天城堡里还把一个守夜的兵叫去问话，问有没有人偷城墙底下的石头，一问问到后半夜，那个兵一个字也没吐。"
stage = "rumor"
window = [[1555, 7, 1], [1555, 9, 30]]
at = "alexandria"
cast = ["nikos", "murad"]
mood = "mystic"
news = "亚历山大港有个潜水人捞上来一块刻满字的铅板，港里人说是宝藏图；城堡守夜的兵被问了一夜话，一字没说。"

[tracks.chapters.default]
next = "pair_nikos_murad_choice"
effects = []

# 抉择：1557 年初，白天的城堡后墙根（人设里的“头一回在太阳底下说话”）。玩家可以找抄写员、做拓本，或者不插手。
[[tracks.chapters]]
key = "pair_nikos_murad_choice"
title = "交给谁读"
text = "铅板在穆拉德屋里的床板底下睡了一年多。这天晌午，尼科斯头一回在白天来到城堡后墙根，穆拉德用帆布裹着它抱出来，放在石头上，两人一起看向我。“交出去，就被收走了。”尼科斯说，“我不想它躺在别人架子上，一个字都没人读。”穆拉德把手按在铅板上：“你不交，就要去捞第二块。再一个人夜里下水，我拦不住你。”尼科斯低头看了看铅板。“水下的字，别在岸上替它编——得找认得它的人。”"
stage = "involve"
window = [[1557, 1, 1], [1557, 2, 28]]
at = "alexandria"
cast = ["nikos", "murad"]
speaker = "nikos"
mood = "tense"
news = "亚历山大港那块刻字的铅板听说还在，有人看见希腊潜水人和城堡守兵为它在后墙根吵了大半天。"

[tracks.chapters.default]
next = "pair_nikos_murad_together"
effects = []
news = "亚历山大港的守兵逼着那个希腊潜水人点了头，往后不许一个人夜里下水；铅板的事，两人都没再提。"

[[tracks.chapters.choices]]
key = "scribe"
text = "替他们找一个认得古字的抄写员来读铅板"
reply = "我托人从老城请来一位抄写员。他对着铅板看了三天，摇头晃脑，只认出几个字：“剩下的，我要是瞎讲，就是糟蹋它。”尼科斯把认出的几个字抄在一张纸上，折了四折。穆拉德把铅板重新包好，放回了原处。"
next = "pair_nikos_murad_together"
effects = [{ kind = "flag", flag = "c7_pair_nikos_murad_helped" }, { kind = "affinity", person = "nikos", value = 4 }, { kind = "affinity", person = "murad", value = 3 }, { kind = "memory", memory = "mem-pair_nikos_murad-scribe", title = "认出的几个字" }]
news = "亚历山大港来了个认古字的抄写员，待了三天，出来只说了一句“太老了”。"

[[tracks.chapters.choices]]
key = "rubbing"
text = "劝他们做份拓本公开存起来，别再碰城墙的石头"
reply = "拓本拓了两份，一份送进港里清真寺的书库，管书的老先生用镇纸压着，看了很久。尼科斯答应不再碰城墙底下的石头，穆拉德答应白天陪他去别处下水。“说好了。”穆拉德的脸还板着。尼科斯嘴上应着，眼睛往礁石那边溜了一下。"
next = "pair_nikos_murad_together"
effects = [{ kind = "flag", flag = "c7_pair_nikos_murad_matched" }, { kind = "affinity", person = "murad", value = 4 }, { kind = "affinity", person = "nikos", value = 2 }, { kind = "memory", memory = "mem-pair_nikos_murad-rubbing", title = "公开的拓本" }]
news = "亚历山大港的清真寺书库新添了一份拓本，听说是个希腊潜水人和城堡的守兵一道送去的。"

[[tracks.chapters.choices]]
key = "watch"
text = "不插手，让他们自己商量"
reply = "我退到墙角。那边吵了很久，穆拉德的嗓门高了一回，尼科斯的话断了三回。最后铅板被抱了回去，尼科斯跟在后面，说得很轻：“你守着它。我守着你。”穆拉德没有回头，脚步却慢了。"
next = "pair_nikos_murad_together"
effects = [{ kind = "affinity", person = "nikos", value = 1 }, { kind = "affinity", person = "murad", value = 1 }]

# 落点：1557 春，东港与城堡背风的墙。三个分支同一个结局（lovers）；帮助时多一个物件。
[[tracks.chapters]]
key = "pair_nikos_murad_together"
title = "白天并肩走"
text = "春天的一个早晨，穆拉德刚交班，尼科斯在城堡正门外等他，没带绳子，也没带湿衣服。“大白天走？”穆拉德把四下看了一圈。“大白天。从东港走，慢慢走。”卖鱼的叫了穆拉德三回，他三回板着脸说“守夜的，不买”，尼科斯笑得蹲到地上。回来时他们绕到背风的那面墙下，海风被石头挡住了。穆拉德先伸的手，尼科斯凑过去，吻了他。墙是用灯塔的旧石砌的。“这里头也有我捞不上来的字。”“今天不捞。”"
stage = "witness"
window = [[1557, 3, 1], [1557, 5, 31]]
at = "alexandria"
cast = ["nikos", "murad"]
speaker = "murad"
mood = "cheerful"
news = "亚历山大港的人说，那个夜里偷偷下水的希腊潜水人，如今大白天和城堡的守兵并肩走在东港边上。"

[tracks.chapters.default]
next = "done"
effects = [{ kind = "tie", a = "nikos", b = "murad", relation = "lovers" }, { kind = "flag", flag = "c7_pair_nikos_murad_together" }]

[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_pair_nikos_murad_helped" }]
text = "春天的一个早晨，穆拉德刚交班，尼科斯在城堡正门外等他，没带绳子，也没带湿衣服，只在怀里揣着一张折了四折的纸。“大白天走？”穆拉德把四下看了一圈。“大白天。”尼科斯隔着衣服按了按那张纸，“从东港走，慢慢走。”卖鱼的叫了穆拉德三回，他三回板着脸说“守夜的，不买”，尼科斯笑得蹲到地上。回来时他们绕到背风的那面墙下，海风被石头挡住了。穆拉德先伸的手，尼科斯凑过去，吻了他。墙是用灯塔的旧石砌的。“这里头也有我捞不上来的字。”“今天不捞。”穆拉德说。"

[[tracks.chapters.variants]]
key = "matched"
when = [{ kind = "flag", flag = "c7_pair_nikos_murad_matched" }]
text = "春天的一个早晨，穆拉德刚交班，尼科斯在城堡正门外等他，没带绳子，也没带湿衣服。“大白天走？”穆拉德把四下看了一圈。“大白天。”尼科斯说，“顺路去书库。”清真寺书库的墙上挂着那份拓本，尼科斯每回路过都要进去看一眼。穆拉德靠着门框等：“看了多少回了。”“还差一回。”回来时他们绕到城堡背风的那面墙下，海风被石头挡住了。穆拉德先伸的手，尼科斯凑过去，吻了他。"
