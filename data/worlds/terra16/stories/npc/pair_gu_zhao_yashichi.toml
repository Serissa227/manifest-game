[[tracks.chapters.choices]]
key = "carry"
text = "替弥七带一封回信去宁波。"
reply = "弥七磨了很久的墨，只写了一行，没有称呼，也没有署名，墨干了才递给我。纸上是三个字：“人还在。”他又说：“缝进帆里，别让人看。”我当晚就把它缝进船帆的折边。到了宁波，我剪下那截帆边，交给一个卖鱼的。卖鱼的掂了掂，说他认得那位把总。"
next = "pair_gu_zhao_yashichi_epilogue"
