# 落点之二（缺省与 carry、watch）：1561 年春，一年一封。两人仍是恋人，隔着海禁。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_epilogue"
title = "一年一封"
text = "街上传的是：海禁一年比一年严，平户的唐人船一年比一年少。可每到开春，总有一条走私船从浙江捎来一封信，收信的是汪直船上从前那个通事。他也回信，每回只写一行。有人问送信的，那一行写的什么，送信的说看不懂，字少得像怕被谁抄去。船上的老水手瞄过一眼，笑了笑，没往下说。听人讲，写信的人在台州，收信的人在平户。"
stage = "rumor"
window = [[1561, 3, 1], [1561, 5, 31]]
at = "hirado"
cast = ["gu_zhao", "yashichi"]
mood = "sad"
news = "海禁一年比一年严，平户的唐人船少了，可每年总有一封浙江来的信送到一个通事手里。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "matched"
when = [{ kind = "flag", flag = "c7_pair_gu_zhao_yashichi_matched" }]
text = "街上传的是：海禁一年比一年严，平户的唐人船一年比一年少。可每到开春，总有一条走私船从浙江捎来一封信，收信的是汪直船上从前那个通事。他回信只写一行，去年是三个字，今年是四个字。送信的说，照这样写下去，要写到头发白了才凑得出一封信。船上的老水手瞄过一眼，笑了笑，没往下说。听人讲，写信的人在台州，收信的人在平户。"

# 落点之三（meet）：1561 年夏，双屿废港的一夜。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_landing_b"
title = "双屿的一夜"
text = "双屿的港十几年前叫官军捣毁了，只剩半截栈桥，潮退时露出烧黑的桩子。顾昭的巡哨船泊在北边，弥七的走私船泊在东边，两条船都没挂灯。栈桥尽头有一盏罩着碗的油灯，只漏出一指宽的光。“来得比我想的早，”弥七先开口，“骂你的话我在海上备了三条，一条也用不上了。”“印信救不了人，”顾昭说，“这回是人来了。”他们并排坐在黑桩子上，坐到潮水涨过脚面。天亮前顾昭揭掉灯上的碗，一指宽的光灭了。他踏上往北的巡哨船，弥七在后面喊：“明年的信，我写两行。”"
stage = "witness"
window = [[1561, 5, 1], [1561, 7, 31]]
at = "shuangyu"
cast = ["gu_zhao", "yashichi"]
speaker = "gu_zhao"
mood = "tender"
news = "双屿那片废港夜里有过灯火，渔夫说看见两条船靠过一夜，一条官船，一条倭船，天亮就各走了。"

[tracks.chapters.default]
next = "done"
effects = []
