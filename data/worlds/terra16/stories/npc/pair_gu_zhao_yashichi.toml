# 信送到，人还在（pair_gu_zhao_yashichi）——配角线，标签：BL；悲剧向的远距，两人都活着。
# 人物：顾昭（gu_zhao，1530-06-02 生），俞大猷麾下的把总，1553—56 在舟山、1557 起在台州；
#       弥七（yashichi，1531-07-07 生），汪直船队的通事，1553—56 在五岛、1557 起在平户。
#       两人都是纯 BL，年龄差一岁；恋人效果写在 1557-11 的岑港章，两人都已 27、26 岁，写到一个吻为止。
#       顾昭与源六的宿敌线归 tie_extra_08_gu_zhao_genroku，本文件不提源六。
# 依据（史实）：1555—56 年胡宗宪遣人赴五岛劝汪直归降；1557 年秋汪直率船到舟山岑港受抚；不久在杭州被扣（1557 年末至 1558 年初），
#       毛海峰在岑港烧船突围；汪直于嘉靖三十八年十二月二十五日（公历 1560 年 1 月）在杭州处斩；
#       双屿港 1548 年被明军捣毁，此后是废港；海禁在汪直死后更严。
# 原创：顾昭、弥七两人及其往来，三封信、栅栏边的火、纸边的小字、缝进船帆的那一行字；两人的生死不改变史实，日程到 1590，不写死亡。
# 待核：岑港受抚期间守栅军官与船上通事隔栅传话的细节；宁波、岑港、台州在地点表里只有宁波（at 一律用 ningbo 代表浙东沿海）。
# 缺省走向（无人插手，玩家不在场也照样发生）：1556 春弥七送三封信到浙东军营，顾昭先问他脚上的伤；1557 年冬岑港的栅栏边成为恋人；
#       1558 年汪直被扣、岑港的船烧了，弥七跟着船走了；1560 年汪直被斩，顾昭只捎来一行字，弥七压了一年才回；
#       此后一年一封，一个在台州、一个在平户，隔着海禁。
#   meet（很难的帮助：安排双屿废港的会面）：landing_b，1561 夏两人在双屿的栈桥上见了一夜，之后仍隔海，旗标 _helped，回忆“双屿的一夜”。
#   carry（带回信去宁波）：同缺省走向，旗标 _matched，一年一封的变体里那一行字每年多一个字，回忆“缝进船帆的一行字”。
#   watch（陪他坐一会儿）：同缺省走向，只加一点好感。
# 共享旗标：写 c7_pair_gu_zhao_yashichi_together（岑港章）、_helped、_matched；读 _matched（一年一封章的变体）。
# 日程（整合方改 cast，都是故事内的出行）：
#   1. 章节 at 一律是 ningbo（浙东沿海的代称）与 hirado、shuangyu；顾昭现有日程 1557 起在台州，岑港章（1557-11/12）和宁波传闻章（1558）
#      写的是他在舟山岸上守栅、被上官盘问，可视为日程内的出行，不必改；
#   2. 与 tie_extra_08_gu_zhao_genroku 协调：那一线要顾昭 1556-03-01 至 1557-06-30 在平户，而本线相识章窗口 1556-04-01..06-30 在宁波
#      （弥七从五岛送信到浙东军营）。两处同一时段不在同一地，建议把本线相识章当作 1556 年 3 月前后的回忆来排，或把顾昭的平户段改到 1556-07-01 起；
#   3. 弥七 1553—56 在五岛，相识章里他到浙东送信，也是故事内的出行。
# 秘密：cast 未写明与本线相关的秘密；顾昭没告发冒功一事不进本线，更不进见闻。

[[tracks]]
key = "pair_gu_zhao_yashichi"
name = "信送到，人还在"
kind = "request"
start = "pair_gu_zhao_yashichi_meeting"
auto = true
cast = ["gu_zhao", "yashichi"]

# 相识：1556 年春夏，浙东军营的门槛。三封信、一把椅子、一碗热水。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_meeting"
title = "先问脚上的伤"
text = "弥七从五岛来，一路把三封信举过头顶，过营门槛时手还举着，像捧一碗滚汤。顾昭没伸手接信，先低头看他的脚：“怎么伤的？”“跳板滑了。信不能湿，脚算什么。”“兄台坐。”顾昭拖来一把椅子，自己站着，“坐着也能骂我。”弥七真骂了，先是汉话，再是九州话，最后是船上的行话，骂到喘气才发现，三封信的火漆一封也没被人动过。顾昭只问海上是不是起了横风，翻过信看了一眼印：“印信是真的，人也得活着回来。”弥七把最后半句骂咽了回去，接过他递来的热水碗，手还在抖。"
stage = "witness"
window = [[1556, 4, 1], [1556, 6, 30]]
at = "ningbo"
cast = ["gu_zhao", "yashichi"]
speaker = "gu_zhao"
mood = "tense"
news = "宁波城外的军营里来了个汪直船上的通事，三封信一路举过头顶，听说营里的把总进门先问他的脚，还给他搬了把椅子。"

[tracks.chapters.default]
next = "pair_gu_zhao_yashichi_together"
effects = []

# 落点之一：1557 年冬，岑港的栅栏。成为恋人写在缺省里，玩家不在场也照样发生。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_together"
title = "岑港的冬天"
text = "汪直的船泊进岑港，说是来受抚，谈判一拖再拖。顾昭在岸上守栅栏，弥七是船上派来传话的通事，这个冬天，两人隔着几根木桩说话，栅栏边那堆火每晚烧到半夜。这晚弥七从缝里接过顾昭的回信，纸边密密麻麻写着小字：此条顾某保不了，此条须问上官，此条不知。“这是我见过最老实的回信，”弥七用九州话骂了一句，“老实得当不了凭据。”“凭据是别人的事。”顾昭拔了门闩，“火在这边，冷。”弥七进了栅栏，在火堆旁坐下，信还捏在手里。火矮下去的时候，顾昭凑过去吻了他，那张纸的边被攥出一道深褶。"
stage = "witness"
window = [[1557, 11, 1], [1557, 12, 31]]
at = "ningbo"
cast = ["gu_zhao", "yashichi"]
speaker = "yashichi"
mood = "tender"
news = "岑港受抚的事拖了一冬，栅栏边那堆火每晚都烧到半夜，听说守栅的把总和船上的通事常坐在一起。"

[tracks.chapters.default]
next = "pair_gu_zhao_yashichi_turning"
effects = [{ kind = "tie", a = "gu_zhao", b = "yashichi", relation = "lovers" }, { kind = "flag", flag = "c7_pair_gu_zhao_yashichi_together" }]

# 转折（传闻）：1558 年春，汪直被扣，岑港的船烧了。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_turning"
title = "下了狱的船主"
text = "街上传开了：汪直去杭州受抚，一进城就叫人扣下了。岑港的船上乱成一团，毛海峰点火烧了自己的船，杀出一条路往日本去，船上的通事也跟着走了。岸上守栅栏的那位顾把总倒没走成，上官叫他进去问了三天话：栅栏边夜夜烧的那堆火，是谁添的柴？和船上的人有没有私下往来？卖鱼的说，三天里他只答一句“柴是营里的”，旁的一个字不多。第四天他出来，栅栏边的火堆已经凉透了。"
stage = "rumor"
window = [[1558, 2, 1], [1558, 4, 30]]
at = "ningbo"
cast = ["gu_zhao", "yashichi"]
mood = "sad"
news = "宁波一带传开了：汪直在杭州被扣，岑港的船烧了一半，剩下的人往日本跑；守栅的把总被上官问了三天话。"

[tracks.chapters.default]
next = "pair_gu_zhao_yashichi_choice"
effects = []

# 抉择：1560 年春，平户。汪直被斩，顾昭的信到了。
[[tracks.chapters]]
key = "pair_gu_zhao_yashichi_choice"
title = "纸保不了人"
text = "汪直被处斩的消息传到平户，码头上的唐人沉着脸，几天没人开口。一条走私船捎来一封浙江的信，信里只有一行：“顾某写过的，一条也没保住。”弥七读了三遍，对着海面骂了三种话，转过身来对我说：“回信我写不出。这话我亲口转，不让纸替人背命——可人在海那边，我嘴够不着。”他把信按在膝盖上，一遍遍抚平。"
stage = "involve"
window = [[1560, 2, 15], [1560, 4, 30]]
at = "hirado"
cast = ["gu_zhao", "yashichi"]
speaker = "yashichi"
mood = "sad"
news = "汪直被斩的消息传到平户，码头上的唐人都沉着脸，听说有个通事收到一封从浙江来的信，一直没回。"

[tracks.chapters.default]
next = "pair_gu_zhao_yashichi_epilogue"
effects = []
news = "平户那个通事收了浙江的信，压在袖子里整整一年，到第二年开春才回，回了一行字。"

[[tracks.chapters.choices]]
key = "meet"
text = "冒险替他们安排一次海上的见面，就在双屿的废港。"
