# 抉择：1578 年秋，战后的名单。穆萨出城找失散的人，雅库布留在金匠铺认遗物；缺省两人各做各的，关系不变。
[[tracks.chapters]]
key = "pair_musa_yaqub_choice"
title = "战后的名单"
text = "金匠铺的柜台上摆满了别人的东西：戒指、银扣、刻着名字的护身符，每样底下压着半张写了字的纸条。穆萨靠着柜台，行囊已经捆好。“行会里有四家的儿子没回来。”他说，“我去阿尔卡萨尔那边，一个村子一个村子问。”“野地里没有灯油铺子。”雅库布没抬头，一枚一枚擦着银扣，“该我去。”“你走了，谁替人认东西？”两人争到后半夜，灯油见了底。穆萨撕了一张纸，雅库布也撕了一张，各写一份名单，末尾各留下回信的地方，换着收好。然后他们一起转过来看我。"
