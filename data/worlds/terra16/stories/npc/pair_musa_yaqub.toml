window = [[1578, 10, 1], [1578, 12, 15]]
at = "fez"
cast = ["musa", "yaqub"]
speaker = "yaqub"
mood = "tense"
news = "三王之战以后，非斯寻宝行会那个爱讲笑话的出城找人去了，犹太区的金匠铺天天替人认遗物。"

