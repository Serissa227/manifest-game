# 尾声：1579 年春，穆萨又出一趟远门，回来照旧先去金匠铺，敲门三下。
[[tracks.chapters]]
key = "pair_musa_yaqub_epilogue"
title = "回来先敲哪扇门"
text = "穆萨又出了一趟远门。回来那天，金匠铺刚点灯，三下敲门声，不轻不重。灯上那枚穿孔的银币被擦得发亮，雅库布开了门，袖口沾着灯油：“晚了两天。”“路上遇到一场沙暴。”穆萨掸着肩上的沙，“我和骆驼抢一张毯子，它赢了。”“灯油我添了四回。”雅库布侧身让开门。穆萨张了张嘴，把后头的笑话咽了回去，先跨过门槛。"
