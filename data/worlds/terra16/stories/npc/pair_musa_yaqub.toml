# 坏银币的好去处（pair_musa_yaqub）——配角线，标签 BL；同学线，恋爱线（纯 BL 两人）。
# 人物：穆萨（musa，1540-05-04 生），非斯寻宝行会“领事”的儿子，笑话总比绳梯先下地窖；成年后继续寻宝。
#       雅库布（yaqub，1540-07-10 生），非斯犹太区金匠的儿子，先听银币落桌的声音；成年后守着金匠铺。
#       学院期（1554—1556）只写到心照不宣（closer 章：借口、记钟点、秤砝差了半钱，不写任何 relation）。
#       恋人效果只在 together 章（窗口 1559-03-01—05-31）：窗口起日穆萨 18 岁、雅库布 18 岁（1558-07-10 满），生年差 0，
#       都满 18 且不早于 1557-01-01；写到一个吻为止。meeting 章的 friends 发生在 1554 年（两人 13—14 岁，只是朋友）。
# 依据（史实）：萨阿德王朝初年（1554 年前后）市场上流通掺了铅的银币；市场督察（muhtasib）管市场秤尺与钱色，衙门里设锁房；
#       非斯犹太区（梅拉）是金匠聚居的地方；1578 年 8 月 4 日三王之战（马哈赞河、凯比尔堡，今称阿尔卡萨尔凯比尔）：
#       葡萄牙国王塞巴斯蒂昂、摩洛哥苏丹阿卜杜勒·马利克战死，被赶下台的旧苏丹穆罕默德·穆塔瓦基勒淹死在河里；俘虏与赎俘持续数月。
# 原创：两人的故事、锁房里扔银钱猜真假、挂在灯上的穿孔银币、一袋沙土里的两枚锈铜钱、画满圈的名单、刻字的银扣、敲三下门的敲法。
# 待核：锁房设在督察衙门后院，史料没有细节，正文只称“锁房”；1578 年战后非斯寻找失散者的做法，正文一律用传闻与动作，不写具体官方程序。
# 去重：古罗马地窖困一夜归 bond_musa；验出假银币出自哪一炉归 bond_yaqub；1578 年替赎俘的钱过秤的场面归 bond_yaqub 的重逢，
#       本线 turning 里只一笔带过金匠们在过秤，不写雅库布与主角过秤。
# 缺省走向：meeting（锁房一夜，设 friends）→ closer（学院期，挂灯的银币、记关门的钟点，心照不宣）
#       → together（1559 年成为恋人，设 c7_pair_musa_yaqub_together；主角若与二人之一立过 S 约定、c7_pair_musa_yaqub_taken=true，此章 when 不满足、整条轨道静默结束，改走 _side）
#       → turning（1578 年三王之战，传闻）→ choice（战后的名单；缺省：一个出城找人、一个留城认遗物，关系不变）
#       → epilogue（1579 年，穆萨远行归来先敲金匠铺的门）。没有坏结局。
#   帮助（lists）：设 c7_pair_musa_yaqub_helped，epilogue 的 variants 写名单钉在柜台后；撮合（relay）：设 c7_pair_musa_yaqub_matched，variants 写银扣的拓样；
#   旁观（watch）：只加一点好感。三者都走向 epilogue，关系仍是恋人。
# 并肩：taken=true 时第二条轨道 pair_musa_yaqub_side 一章 witness（1559 年春），写穆萨第一次远行归来先去金匠铺报平安，两人是借灯的朋友，
#       设 friends 与 c7_pair_musa_yaqub_side；不写嫉妒、不提主角。
# 共享旗标：读 c7_pair_musa_yaqub_taken（bond_musa、bond_yaqub 的 S 章设）；写 c7_pair_musa_yaqub_together（bond_musa 1561 重逢、bond_yaqub 1578 重逢读）、
#       _helped、_matched、_side。
# 口头禅各用一次：雅库布“银会响，账不能哑”在 meeting；穆萨“这回真有宝，至少有我”在 together（side 章只换说法）。
# 日程（整合方改 cast，可选）：两人的日程地点是 fez_city，章节的 at 用 fez；cast/ties.toml 里 adult_musa_yaqub 的 since 现为 1558-12-31，
#       应改到 1559-03-01 以后（与 together 章对齐）；两条 ties 的 note 里“地窖”应改为“市场督察的锁房”（地窖归 bond_musa）。
# 秘密：穆萨怕黑（meeting 里只写他笑话越讲越快，不写他承认）；雅库布替穆萨藏了一枚牵涉假币案的银钱（closer 里只写他挂上去，不写来历）。两者都不进见闻。

