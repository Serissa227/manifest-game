# 相识：1554 年春，市场督察衙门的锁房。一枚掺铅的银币转到两个少年手里，一起被关一夜；穆萨越黑越爱讲，雅库布扔银钱给他猜。
[[tracks.chapters]]
key = "pair_musa_yaqub_meeting"
title = "锁房里的一夜"
text = "一枚掺了铅的银币，从布市转到鞋匠手里，又转到两个少年手里。市场督察不问来路，一手拎一个，丢进衙门后院的锁房，门闩落下。没有窗。穆萨先开口：“这屋比我爹的行会还安静。”接着是第二个笑话，第三个，一个比一个快，门缝里最后一线光灭掉以后，他连气都不换。雅库布靠墙坐着，听了好一阵，没拆穿。他从怀里摸出几枚银钱，在掌心掂了掂：“银会响，账不能哑。我扔，你听，猜真假。”银钱落在石板上，叮的一声。穆萨的嘴停了：“真的。”“对。再来。”后来换成穆萨扔，雅库布猜。天亮开门，督察的火把照进来，雅库布说：“我猜错了三回。”穆萨揉着眼睛：“你一回也没错。”"
stage = "witness"
window = [[1554, 3, 1], [1554, 5, 31]]
at = "fez"
cast = ["musa", "yaqub"]
speaker = "yaqub"
mood = "tense"
news = "非斯市场督察为一枚假银币关了两个少年一夜，听说锁房里叮叮当当响了一宿。"

[tracks.chapters.default]
next = "pair_musa_yaqub_closer"
effects = [{ kind = "tie", a = "musa", b = "yaqub", relation = "friends" }]

# 靠近：1556 年春，学院期。金匠铺的灯上多了一枚穿孔的银币；穆萨记下关门的钟点，雅库布的砝码差了半钱。到心照不宣为止，不写 relation。
[[tracks.chapters]]
key = "pair_musa_yaqub_closer"
title = "挂在灯上的银币"
text = "金匠铺的小油灯下头，多吊了一枚打了孔的银币，细麻线一转，闪一下，又闪一下。穆萨伸手拨了拨：“值多少？”“什么也换不来。”雅库布头也不抬，往秤盘里添砝码，“只换一样东西：按时回来。”“哪来的？”“问价钱，别问来历。”穆萨笑起来，说那他每回出门，都得先来看一眼这盏灯。雅库布没接话，把灯芯剪短了一截。穆萨走到门口，又回头：“你家几时上门板？”“日落后一个钟点。”他念了两遍，摸出一块炭，在手背上划了一道。身后的秤盘晃了一下：雅库布称错了半钱，他从来没称错过。"
stage = "witness"
window = [[1556, 3, 1], [1556, 5, 31]]
at = "fez"
cast = ["musa", "yaqub"]
speaker = "musa"
mood = "tender"
news = "非斯犹太区一家金匠铺的油灯上，挂着一枚打了孔的银币，铺里的少东家说多少钱也不换。"

[tracks.chapters.default]
next = "pair_musa_yaqub_together"
effects = []

# 恋人：1559 年春，穆萨第一次随行会远行三个月归来，先去金匠铺。两人都满十八。主角与二人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "pair_musa_yaqub_together"
title = "先去金匠铺"
text = "穆萨跟着行会出了三个月的远门，回来那天没回家。离关门的钟点还差一刻，金匠铺的门板才上了一半，他侧着身子挤进来，把一只布袋倒扣在柜台上，沙土哗地铺开。“这回真有宝，至少有我。”沙土里滚出两枚铜钱，锈得认不出面额。雅库布没笑，一枚一枚放上秤盘，砝码加了又减，减了又加。“值多少？”穆萨问。“我见过最贵的两枚。”穆萨想接一个笑话，没接出来。油灯上那枚穿孔的银币转了半圈。雅库布绕过柜台，把剩下的门板推回去闩好，回过身，穆萨的手还悬在半空，不知道往哪儿放。他一把握住，吻了他，短短一下，身后的秤盘还在晃。"
stage = "witness"
window = [[1559, 3, 1], [1559, 5, 31]]
at = "fez"
cast = ["musa", "yaqub"]
speaker = "musa"
mood = "tender"
when = [{ kind = "flag", flag = "c7_pair_musa_yaqub_taken", value = false }]
news = "非斯寻宝行会领事家的儿子出远门三个月，回来没回家，先去了犹太区的金匠铺。"

[tracks.chapters.default]
next = "pair_musa_yaqub_turning"
