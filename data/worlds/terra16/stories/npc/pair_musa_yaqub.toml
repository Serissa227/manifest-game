# 转折（传闻）：1578 年 8 月三王之战。马哈赞河边三个君主战死；非斯城里多了俘虏，也多了找人的人家；金匠铺夜里过秤。
[[tracks.chapters]]
key = "pair_musa_yaqub_turning"
title = "三王之战"
text = "街上都在传：马哈赞河边那一仗打完，三个君主一个也没回来。葡萄牙的年轻国王没回来，摩洛哥的苏丹没回来，那个被赶下台、跟着葡萄牙人打回来的旧苏丹，也淹死在河里了。后来又说，俘虏一队一队押进非斯，多了上千张要喂的嘴，也多了上千户挨个城门问人的人家。犹太区的金匠铺夜里不熄灯，赎身的银子一袋一袋抬进去，秤杆压下去，抬起来，路过的人说，里头砝码的响声比唤礼还勤。"
stage = "rumor"
window = [[1578, 8, 10], [1578, 9, 30]]
at = "fez"
cast = ["musa", "yaqub"]
mood = "tense"
news = "马哈赞河那一仗死了三个君主，非斯城里多了上千个俘虏，也多了上千户找人的人家。"

