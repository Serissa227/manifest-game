# —— 相识：1565 年春，月港镖局的柜台 ——
[[tracks.chapters]]
key = "pair_qin_hongying_shen_zhiwei_meeting"
title = "三倍的镖价"
text = "月港镖局的柜台上摊着一本蓝布面的账：官样青花二十箱，要护到海口上船。秦红缨看都没看，竖起三根指头。“三倍？”沈知微笑了，“秦镖头把自己看得也太贵了。”“是你把他们看得太便宜。”秦红缨朝门外一抬下巴。六个伙计蹲在箱子边上啃饼，她一个一个点过去：“阿旺，石码人，娘眼睛不好；老蔡，海沧的，上个月刚添了闺女；最瘦那个叫水生，浯屿人，水性最好，走旱路最没用……”点完六个，她把三根指头收回去：“镖能赔，人得回来。”沈知微不笑了。她蘸了墨，把六个名字一个一个写进账里，每个名字底下另起一行：路钱。写到老蔡那一行，笔停了停，又添两个小字：添丁。"
