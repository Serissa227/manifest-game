text = "沈知微要回景德镇交账了。她来客栈找我，把一叠收据摊在桌上：那三回里伙计没拿到的脚钱，她已经一文不少补齐，每张收据上都按着伙计的红手印，老蔡那张的手印旁边，还歪歪扭扭画了个小娃娃。剩下的是御器厂的窟窿，三百两银子，四十箱瓷。“还有四十箱官样青花压在我手里，没出洋。”她说得很客气，客气得过了头，“能卖，只是买家都要问来路。”秦红缨抱着胳膊靠在门框上，左袖口露出一截疤：“要圆谎，别找我的镖局。”沈知微没回头，把收据一张一张叠齐，压在茶碗底下，等我开口。"
