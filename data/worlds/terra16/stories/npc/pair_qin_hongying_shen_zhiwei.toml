title = "开海以后的旧账"
text = "隆庆元年，月港开了海。从前半夜摸黑往小船上搬的瓷器，如今领一张船引，大白天就从码头上船，挑夫喊着号子，书办站在跳板边上念船引。茶棚里的话却拐回了旧事：景德镇督陶官家的小姐又来了，住在镖局斜对面的客栈，天天抱着账本进进出出。说是来补账的——瓷能光明正大地卖了，御器厂账上那几年记的“遇劫损耗”可还在。前些天有个景德镇口音的人到镖局门口打听，那几年从景德镇下来的镖，到底被劫了几回。伙计们说记不清了。卖鱼丸的阿婆说，秦镖头在里头听见，一声没吭，起身把门关了。"
