# —— 靠近：1566 年春，镖局里换药（沈知微说出前三回“劫镖”）——
[[tracks.chapters]]
key = "pair_qin_hongying_shen_zhiwei_closer"
title = "这一刀不算货损"
text = "去年冬天从景德镇下来那一路，镖车被“劫”了三回，每回少两三箱瓷，人一个没伤，劫道的连刀都不出鞘。秦红缨看在眼里，没说破，只在每回过后站上车辕，扯着嗓子把箱子从头数一遍。第四回刀出了鞘，她替沈知微挡了一下，左臂上开了一道口子。开春，沈知微抱着账本来镖局看伤，笔尖悬着：“这一路，我记成货损。”秦红缨把袖子挽上去：“这一笔不能写成货损。”沈知微蹲下来替她换药，手一直抖，布条缠歪了两回：“箱数可以重数，手别再伤了。”缠好了，她把前三回是自己雇的人、自己挑的山口，一样一样说了，说完盯着药碗。秦红缨只问：“那三回，伙计的脚钱你记了没有？”"
