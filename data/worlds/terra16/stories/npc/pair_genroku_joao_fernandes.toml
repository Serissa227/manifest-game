# 落点（恋爱，缺省即圆满）：1571 年夏秋，长崎新码头。两人成为恋人，同住长崎。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_together"
title = "新码头"
text = "1571 年，第一艘葡萄牙船驶进长崎新开的港口。若昂在没铺完的码头上迎风站了半个时辰：“西南风，明天能出港。”船队的人在码头那头喊他，他没应。源六蹲在小木匣旁，把系在匣上的纸签翻过来，划掉“澳门”，写上“长崎”，写得很慢。脚边摞着三本词本，最底下那本有一角是横濑浦那年烤焦的。晚上，两人坐在没盖完的仓库里，梁上的杉木还冒着树脂味，雨点打在没封的屋顶上。“这一回，”若昂说，“我不走了。”源六没答话，把灯挪远了些，伸手托住他的后颈，吻了他。"
stage = "witness"
window = [[1571, 7, 1], [1571, 9, 30]]
at = "nagasaki"
cast = ["genroku", "joao_fernandes"]
speaker = "joao_fernandes"
mood = "tender"
news = "长崎新码头头一回来了黑船，听说船上有个领航员之子下了船就没再上去，住进了一个堺商人的仓库。"

[tracks.chapters.default]
next = "pair_genroku_joao_fernandes_turning"
effects = [{ kind = "tie", a = "genroku", b = "joao_fernandes", relation = "lovers" }, { kind = "flag", flag = "c7_pair_genroku_joao_fernandes_together" }, { kind = "memory", memory = "mem-pair_genroku_joao_fernandes-landing", title = "新码头" }]

# 转折（传闻）：1580 年夏，长崎酒馆。寄进给耶稣会，街名与名牌重写。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_turning"
title = "寄进"
text = "长崎的酒馆里这阵子只有一个话题：大村殿下把长崎和茂木寄进给了耶稣会，哪条街归谁管、哪家铺子该向谁交钱，没人说得清。昨天后街两个伙计为一块铺路的石板吵了半条街。“寄进是寄进，”卖鱼的说，“港口的地归传教士，我的鱼还是我的鱼。”靠海那间合住的屋子，门口的木牌今早又重写了一回，街名换了新写法。路过的人说，那个堺来的商人在牌子前站了很久，拿指头把新漆摸了一遍，另一个人在旁边笑他：“干了，不会掉。”"
stage = "rumor"
window = [[1580, 6, 1], [1580, 8, 31]]
at = "nagasaki"
cast = ["genroku", "joao_fernandes"]
mood = "tense"
news = "大村家把长崎寄进给了传教士，城里的规矩天天变，连门口的名牌都要重新写。"

[tracks.chapters.default]
next = "pair_genroku_joao_fernandes_choice"
effects = []

# 抉择：1587 年秋，长崎。追放令只赶传教士，可名单上有若昂的名字。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_choice"
title = "离开的期限"
text = "追放令的告示贴到长崎那天，我正在若昂屋里等一份货单。告示写得清楚：传教士二十天内离开日本，商人不在其内。可衙门另有一张名单，抄的是随传教士住宿的人，若昂的名字也在上面——这些年他替教会的船领过航。“上了名单的，自己去证明。”衙役说完就走。源六把十几年的货单一本本摞上桌，摞得比词本还高。若昂蹲在屋角收箱子，罗盘装进去：“船长借的。”教会送的星表也装进去：“该还的。”“货单是我记的，”源六说，“可收单的人认不认，我说了不算。”若昂站起来，手里转着那只信匣，没把它放进箱子。"
stage = "involve"
window = [[1587, 8, 15], [1587, 10, 31]]
at = "nagasaki"
cast = ["genroku", "joao_fernandes"]
speaker = "genroku"
mood = "tense"
news = "追放令到了长崎，传教士们收拾行李上船；听说有个领航员之子被写进了名单，正拿着货单到处证明自己是商人。"

