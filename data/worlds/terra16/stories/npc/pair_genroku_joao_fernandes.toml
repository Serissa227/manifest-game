# 靠近：1563 年夏秋，横濑浦。词本里加的第一批词；傘 / casa。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_closer"
title = "横濑浦的词本"
text = "黑船靠上横濑浦新修的栈桥，木头还在渗松脂。若昂下船先不点货，从怀里摸出一本厚本子，封面包着蜡布。“记生意上的词，”他说，“盘、押、赊、退。”源六翻了两页，拿笔杆敲桌子：“光记这些，你一辈子只会跟人吵价。”他在后面添：修屋顶，烧糊了饭，忘带伞。掌柜在门口探头：“这几样，哪一样卖得出钱？”两人笑得按不住本子。若昂指着门边的油纸伞：“卡萨。”“伞，かさ。”“卡萨！我们的卡萨是房子。”“伞。”念到第四遍，源六不再纠正了。他在“伞”字旁边写了个 casa，中间划一道线：“下雨的时候，是一个意思。”"
stage = "witness"
window = [[1563, 7, 1], [1563, 9, 30]]
at = "yokoseura"
cast = ["genroku", "joao_fernandes"]
speaker = "genroku"
mood = "tender"
news = "横濑浦来了黑船，听说有个葡萄牙领航员和堺来的商人在栈桥边编一本词书，连“烧糊了饭”都要记。"

[tracks.chapters.default]
next = "pair_genroku_joao_fernandes_together"
