# 黑船回来的日子（pair_genroku_joao_fernandes）——配角线，标签 BL；恋爱线。
# 人物：南蛮屋源六（genroku，1534-08-12 生），堺的南蛮商家之子，1570 年起在长崎，纯 BL；
#       若昂·费尔南德斯（joao_fernandes，1535-09-17 生），葡萄牙领航员之子，1557—1569 年在澳门、1570 年起在长崎，纯 BL。
#       生年差 1 岁。全线都在成年以后：1563 年心照不宣（crush，源六 28—29 岁、若昂 27—28 岁）；
#       1571 年恋人（lovers，窗口起日 1571-07-01，源六 36、若昂 35；最早可用日 1557-01-01）。
# 依据（史实）：1562 年大村纯忠开横濑浦港，1563 年横濑浦被焚（正文只写新栈桥渗松脂，词本的焦角在后面的章里露出来）；
#       1571 年第一艘葡萄牙船进长崎（任务单大纲写 1570，按 1571）；1580 年大村纯忠把长崎与茂木寄进给耶稣会；
#       1587 年 7 月丰臣秀吉的伴天连追放令——赶的是传教士，不赶商人，所以若昂拿商船的货单证明自己是商人就能留下；
#       1588 年长崎收为秀吉的直辖地，户籍重新登记。
# 原创：两人的故事；一封被当成货单念出来的信、不收运费的小木匣、词本（傘 / casa）、门口的名牌；
#       “葡萄牙船队的船长司令”与衙役、书吏都是无名角色。
# 待核：1587 年长崎衙门编名单、认商人凭照的具体做法（正文取大意）；1588 年户籍登记的程序（正文取大意）。
# 缺省走向：1560 澳门念错信 → 1563 横濑浦编词本（心照不宣）→ 1571 长崎成为恋人
#       → 1580 寄进（传闻）→ 1587 追放令：若昂拿商船货单证明自己是商人，留下 → 1588 户籍重登，两人同住长崎（圆满）。
#   帮助：去找船长司令开商人凭照（_helped）→ 尾声变体：凭照钉在门后。
#   撮合：把词本与信匣藏到玩家的船上（_matched）→ 尾声变体：匣子秋天回到屋里。
#   旁观：在码头看传教士上船，不改变结局。没有坏结局。
# 共享旗标：写 c7_pair_genroku_joao_fernandes_together（lovers 落点）、_helped、_matched；不读外部旗标。
#       这两人不是学院同学，没有 _taken 门禁，也不用 _side 轨道。
# 日程（整合方）：不需要改。1560 年的澳门与 1563 年的横濑浦是两人的出行（源六日程在堺，若昂在澳门）；1571 年起两人都在长崎。
#       cast/ties.toml 里 genroku_joao_fernandes 的 lovers since 是 1571-12-31，故事的落点在 1571 年 7—9 月，请把 since 提前到 1571-07-01。
# 秘密（不进见闻）：本线人物没有写明的秘密；见闻只写码头上看得见的事，不写他们的关系。

[[tracks]]
key = "pair_genroku_joao_fernandes"
name = "黑船回来的日子"
kind = "request"
start = "pair_genroku_joao_fernandes_meeting"
auto = true
cast = ["genroku", "joao_fernandes"]

# 相识：1560 年夏，澳门码头。一封私信混在货单里，被当成货单念了出来。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_meeting"
title = "多装的一封信"
text = "生丝的货单收上来，最底下夹着一封葡萄牙文的信。堺来的买家看也没看就当货单念：“……一个堺来的买家，夹着算盘站在雨里数箱子，数到第三遍还要拨一遍……”念到这里，他的耳朵红了。若昂被人从码头那头叫来，先用闽南话朝他喊了句“食饱未”，这才看见他手里是什么，一把按住信：“这一航次，信比货先卸！这不是货。”源六把信举高。“念了就得回，要好好回。回信晚几天不要紧，可你说了哪天，就得哪天。”那个下午，两人蹲在栈桥的木桩边，若昂写“chuva”，源六写“雨”，一个词两样字，摆在一张纸上，谁也不肯先擦。天黑前，源六让伙计买来一只小木匣，在盖上刻了道缝：“不收运费，只装信。”"
stage = "witness"
window = [[1560, 6, 1], [1560, 7, 31]]
at = "macao"
cast = ["genroku", "joao_fernandes"]
speaker = "joao_fernandes"
mood = "cheerful"
news = "澳门码头上有个堺来的商人把一封葡萄牙私信当货单念了出来，念到半句红了耳朵，写信的领航员之子追着他要信。"

[tracks.chapters.default]
next = "pair_genroku_joao_fernandes_closer"
