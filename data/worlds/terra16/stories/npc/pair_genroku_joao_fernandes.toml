# 尾声：1588 年夏，长崎。户籍重登，地址换了，名牌上的名字没换。
[[tracks.chapters]]
key = "pair_genroku_joao_fernandes_epilogue"
title = "换地址不换名字"
text = "1588 年，长崎收归关白直辖，衙门的书吏挨户重登户籍。桌子摆在门口，书吏问：“户主？”“南蛮屋源六。”“同住的？”“若昂·费尔南德斯，葡萄牙领航员。”书吏皱眉头，说夷名没处写。源六接过笔，先写片假名，又在旁边照葡萄牙字母描了一遍。他把册子推到若昂面前：“签吧。货可以晚，人别失约。”若昂握着笔数手指：“澳门说过，横濑浦说过……二十八年，我一直当你在催货。”“催货的话，”源六说，“我不会说二十八年。”门外钉牌子的匠人敲着锤子问：“地址换了，名字改不改？”两人一起答：“不改。”"
stage = "witness"
window = [[1588, 5, 1], [1588, 7, 31]]
at = "nagasaki"
cast = ["genroku", "joao_fernandes"]
speaker = "genroku"
mood = "tender"
news = "长崎重新登记户籍，海边有间屋的地址又换了，门牌上一个日本名字、一个葡萄牙名字，十几年没改过。"

