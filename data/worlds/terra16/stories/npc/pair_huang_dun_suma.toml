# 转折（传闻）：1571 年夏秋，马尼拉建城，月港的船往吕宋跑。
[[tracks.chapters]]
key = "pair_huang_dun_suma_turning"
title = "吕宋的银"
text = "西班牙人在吕宋的马尼拉建了城，拿成箱的银子换丝，月港的船今年都往那边跑，来爪哇的少了一半。“一船丝在马尼拉换回来的银子，顶爪哇三趟。”码头上的人这么算。又说常来格雷西克的那个胖船主也被家里催着改道，前几天他的船靠了岸，人没进作坊，蹲在栈桥上啃一块糕，啃了一下午。有人问他去不去吕宋，他嚼着，没说去，也没说不去。"
stage = "rumor"
window = [[1571, 6, 15], [1571, 9, 30]]
at = "gresik"
cast = ["huang_dun", "suma"]
mood = "tense"
news = "马尼拉有了西班牙人的城，月港的船都往吕宋去换银子了；格雷西克常来的那个胖船主也被家里催着改道，在栈桥上蹲了一下午。"

