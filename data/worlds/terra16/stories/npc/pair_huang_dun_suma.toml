# 明年几月到（pair_huang_dun_suma）——配角线，标签 GB；原创人物，恋爱线（远距相守）。
# 人物：黄墩（huang_dun，1540-08-04 生），漳州社学林晚灯的同窗，海商之子；1567 年开海后成了月港的船主，常往格雷西克。胖、爱吃、讲义气，算账马虎。
#       苏玛（suma，1541-10-19 生），吉里学院凯奇利的同窗，蜡染商之女，一直在格雷西克；嘴快爱笑，笑着也能把价谈得一文不差。
#       两人不同学院，成年后才在格雷西克相遇，本线没有学院期的章节。全线都在成年以后：
#       1568 年相识；1569 年心照不宣（crush，两人 28 / 27 岁）；1572 年恋人（lovers，窗口起日两人 31 / 30 岁，生年差 1；最早可用日 1559-10-19）。
# 依据（史实）：1567 年明廷开海，月港准许民间海商出洋；1571 年 6 月西班牙人在吕宋的马尼拉建城，
#       月港的船从此大批往吕宋去换银子，往爪哇的船相应少了。格雷西克是东爪哇的港口，以布匹与海上转运著称。
# 原创：两人的故事、红鲤漆盒与盒里的染样、对街的糕饼摊。旧稿的“给他认真拒绝的空处”“做得好的买卖”一类说教已删。
# 待核：爪哇蜡染作坊在十六世纪的行规与工钱算法（正文只写“一个人一行”的工钱单，不写具体数目）。
# 缺省走向：相识 → 收布的下午（crush）→ 吕宋的银（传闻：他被家里催着改道）→ 苏玛当面问“明年几月到”，
#       无人插手她也照样把日子写进账本 → 1572 年二月十五他准时进港，苏玛拿出洗净的漆盒，两人成了恋人，此后他年年来（圆满，远距相守）。
#   帮助：替黄墩的船在格雷西克揽回程的货（_helped）→ 落点变体：船上装着胡椒进港。
#   撮合：替苏玛把一封“像合约的信”带去月港黄家（_matched）→ 落点变体：黄老爷子也替他排好了船期。
#   旁观：只多一点好感。
# 并肩：主角在 bond_suma 的 S 章立了约（设 c7_pair_huang_dun_suma_taken）时，closer 与 together 的 when 不满足、轨道静默失败；
#       第二条轨道 pair_huang_dun_suma_side 写 1572 年两人是算得清账的老同行，不写嫉妒，不提主角。
#       黄墩的羁绊线是林晚灯的友情线，不设 taken。
# 共享旗标：读 c7_pair_huang_dun_suma_taken；写 c7_pair_huang_dun_suma_together、_side、_helped、_matched。
# 口头禅（照人物卡）：黄墩“天塌下来，也先吃饱了再说。”与苏玛“笑归笑，价不让。”都只在 meeting 用一次；choice 里苏玛定日子是这一幕自己的话，其他地方换说法。
# 秘密：苏玛把黄墩第一年送的点心盒洗净，当作装染样的小匣，在 together 章由她自己拿出来；news 不写。
# 日程（整合方）：黄墩 1568 年起每年二至四月在 gresik，苏玛常驻 gresik（章节 at 都是 gresik，在场由章节判断）。

