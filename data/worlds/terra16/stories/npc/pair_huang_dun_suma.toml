# 相识：1568 年春，格雷西克蜡染作坊。工钱单、糕饼与一只红鲤漆盒。
[[tracks.chapters]]
key = "pair_huang_dun_suma_meeting"
title = "先把价写好"
text = "黄墩的船头一回靠格雷西克，他笑呵呵进了蜡染作坊。苏玛不接他的笑，推过去一张单子：“笑归笑，价不让。先写染工的工钱，一个人一行。”他写得飞快，第三行的数加岔了，被她用指甲点了一下。改完，他凑近小声问：“对街那家糕饼，能算进船费吗？”“你自己吃的，自己付。”她头也不抬。黄墩摸摸肚子：“天塌下来，也先吃饱了再说。”第二天他拎来一只描着红鲤的漆盒，月港的绿豆糕，给染工们分。柜台角上扣着一只碗，碗底压着对街的一块糕。“记你账上。”苏玛说。"
stage = "witness"
window = [[1568, 2, 1], [1568, 4, 30]]
at = "gresik"
cast = ["huang_dun", "suma"]
speaker = "suma"
mood = "cheerful"
news = "月港来的胖船主头一回进格雷西克，被蜡染作坊的女掌柜按着写了一张工钱单；第二天他提了一盒绿豆糕来，分给了全作坊的染工。"

