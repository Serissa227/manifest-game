# 靠近：1569 年初，院子里晾满了布。晚到一船，收布，不肯赶工。
[[tracks.chapters]]
key = "pair_huang_dun_suma_closer"
title = "晚到一船"
text = "黄墩晚了一船。他在作坊门口站定，一肚子的道歉刚要出口，苏玛先丢来一句：“来得正好，布干了，收。”满院子的蜡染布挂在竹竿上，他抱着收了一下午，有一匹收反了，手背挨了她一下。他揉着手背问，能不能赶一赶，多染几匹带走。“染工的手赶不得，”苏玛把布抖平，“赶出来的颜色不正，宁可少卖。”黄墩把那匹布重新折好，折得很慢：“那我明年早点来。”她没应声，翻开账本，在边角记了一笔，没让他看。"
stage = "witness"
window = [[1569, 1, 15], [1569, 3, 31]]
at = "gresik"
