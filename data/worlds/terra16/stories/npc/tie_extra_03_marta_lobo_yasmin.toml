[[tracks.chapters]]
key = "tie_extra_03_marta_lobo_yasmin_turning"
title = "被刮掉的一行"
text = "码头上有人摆出一张上了金的海图，铺在倒扣的鱼筐上，说是“不知谁画的旧图”，要价是新图的三倍。海峡画得准，花边上的金线晃人眼。总督府画室的学徒路过，认出了那片蓝。回去一说，画室里的人都记起来了：那张图是波斯画师自己贴颜料钱上的色，在画室墙上晾了一冬，开春就不见了；右下角本来有两个名字，一行波斯字，一行歪歪扭扭的葡萄牙字，像不会写的人照着描的。如今两行都被人用刀刮了，纸刮得透光。那一季玛尔塔恰好又从果阿过来，听完就往码头走：“刮的是名字，涨的是价钱。”亚斯明拉住她的袖子：“刮掉的地方，还能再写。”"
stage = "rumor"
window = [[1578, 3, 1], [1578, 6, 30]]
at = "hormuz_port"
cast = ["marta_lobo", "yasmin"]
mood = "tense"
news = "霍尔木兹码头有人卖一张上了金的海图，说是无名的旧图，要价三倍；总督府画室的人说，角上那块刮薄了的纸，原来写着两个名字。"

