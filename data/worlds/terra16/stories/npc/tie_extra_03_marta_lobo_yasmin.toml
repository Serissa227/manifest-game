[[tracks.chapters]]
key = "tie_extra_03_marta_lobo_yasmin_meeting"
title = "图上的蓝太贵"
text = "说好来买图的书记迟迟不来，玛尔塔把从果阿带来的霍尔木兹海峡图摊在总督府画室的长桌上，用两只铜镇纸压住上边。屋里新来的波斯女画师从颜料碟后面探过身，看了一眼。“海岸线是好的。”亚斯明说，“可整张图像没吃饱。”玛尔塔不看她，看的是她刚画完的那条花边：缠枝、金线，角上一个撑船的小人扭着头，望向画外。“你把青金石用在没用的地方。”“他望的是你这片海。”亚斯明不紧不慢，“海太淡，他看不见。”她的手指悬在海图右下角上方，没碰到纸：“这一角是留给名字的。你的名字呢？”玛尔塔没答，拿起一只镇纸，正好压在那一角上。书记到天黑也没来。玛尔塔走时，图和镇纸都留在桌上：“颜料钱我不出。”"
stage = "witness"
window = [[1577, 10, 1], [1578, 1, 31]]
at = "hormuz_port"
cast = ["marta_lobo", "yasmin"]
speaker = "yasmin"
mood = "cheerful"
news = "霍尔木兹总督府的画室里，果阿来的制图女人和波斯女画师为海图上的蓝吵了一下午；图没卖成，留在了画室，制图的撂下话：颜料钱她一个拉林也不出。"

