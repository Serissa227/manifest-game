[[tracks.chapters]]
key = "tie_extra_03_marta_lobo_yasmin_choice"
title = "不刮名字的买主"
text = "两张新图卷在油布筒里，靠着画室的门框。右下角的两个名字都是亚斯明写的；玛尔塔的那一行，是从一张收据上照着签名描的，一笔不差。玛尔塔只肯卖给不刮名字的人。前天一个马斯喀特来的买主刚问了一句“角上能不能去掉”，就被她连人带价钱请了出去。“这样的人，霍尔木兹找不出三个。”亚斯明说。玛尔塔说：“那就找三个。”亚斯明把图卷紧，扎上一根丝线，转头问我：“你走的港口多。认不认识这样的人？”"
