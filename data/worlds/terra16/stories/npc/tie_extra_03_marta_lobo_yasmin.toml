[[tracks.chapters]]
key = "tie_extra_03_marta_lobo_yasmin_landing"
title = "两个名字"
text = "新的一张图画完了，从霍尔木兹一直画到格什姆岛的背面。亚斯明把笔递过去，笔杆朝着玛尔塔。玛尔塔接了，在右下角写下自己的名字。她替人画了三十年图，这是头一回在自己画的图上落自己的名，字小得挤在角落里，像怕被人瞧见。亚斯明挨着签她的，比玛尔塔的大了一倍，最后一笔拖进花边，落在撑船小人的脚下——她的花边上总有这么一个小人，扭头望着画外。玛尔塔看看两行字，又看看那碟青：“蓝太贵。”“名字不贵。”亚斯明把图挪到窗下晾着，“下一季画哪儿？”“一季两张。”玛尔塔把炭笔收进袖子，“一张跟我回果阿，一张留在霍尔木兹。”"
