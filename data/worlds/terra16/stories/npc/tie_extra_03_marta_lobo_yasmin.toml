[[tracks.chapters]]
key = "tie_extra_03_marta_lobo_yasmin_closer"
title = "一人一半"
text = "两人把画室最里面那张桌子收拾出来，先立规矩。玛尔塔拿炭笔在桌面正中划了一道：“海岸线归我。看图可以，别伸手。”“花边和颜色归我。”亚斯明把颜料碟一字排开，“那你一个字也别说。”头两天相安无事。第三天傍晚，玛尔塔盯着那碟刚调开的青，还是没忍住：“蓝太贵。”亚斯明没回嘴，笔尖蘸了一点青金石，越过炭线，在玛尔塔画的岬角外头点了一下，米粒那么大。玛尔塔看了很久，翻开自己的测深簿，手指顺着一列数字往下走，停住了。“……那里确实是深水。”"
stage = "witness"
window = [[1578, 7, 1], [1578, 9, 30]]
at = "hormuz_port"
cast = ["marta_lobo", "yasmin"]
speaker = "marta_lobo"
mood = "cheerful"
news = "霍尔木兹总督府的画室里，两个女人守着一张桌子画了一夏天，一个画海岸，一个上颜色，一路吵着画完了第一张，角上空出两块地方。"

