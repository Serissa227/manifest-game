# C7 故事 2.0（A5 / E37 契约）· 配角线 · 友情（生意伙伴）· 标签 GL
# 人物：玛尔塔·洛博（marta_lobo，1530-03-11，在果阿替商人画海图的制图师，纯 GL）；
#       亚斯明（yasmin，1530-01-19，1577 年起在霍尔木兹总督府画室的波斯抄写员兼细密画家，纯 GL）。
#       两人各有恋人（玛尔塔×玛丽亚·达·卢斯、亚斯明×米丽娅姆，见两条 pair 线），本线只写合伙与交情，不写暧昧；
#       玛尔塔的恋人只在 choice 章 to_goa 一处以“账房里的人”带过。
# 依据：葡萄牙人治下的霍尔木兹（1515 年起），波斯湾与印度之间的转口；波斯细密画用金与巴达赫尚的青金石；
#       海湾一带通用的银币拉林；玛尔塔的图向来署父亲的名（cast 人设），亚斯明在宫廷画坊不许署名（cast 人设）。
#       两人的合伙、画室里的争执、被刮掉名字转卖的海图、马斯喀特与设拉子的买主、格什姆岛那张图都是本线虚构。
#       待核：霍尔木兹的葡萄牙长官实为要塞司令（capitão），本线照简报沿用“总督府”的叫法。
# 缺省走向：1577 冬画室相识（tie friends）→ 1578 春传闻：留在画室、由亚斯明上了色的那张图被人刮掉两个名字转卖
#       → 1578 夏同桌合画，第一张画成 → 1578 冬两人守在码头自己卖，卖出一张、名字后来被刮掉半行
#       → 1579 春夏玛尔塔第一次在自己的图上签名，约好每季合画两张（tie friends，回忆“两个名字”）。
#       玩家能做的：找设拉子的老商人（_helped）或把一张图带去果阿（_goa），都不改结局，只改买主与回音。
# 旗标：只写不读——c7_tie_extra_03_marta_lobo_yasmin_landing、_helped、_goa。
# 日程：不改 cast。玛尔塔 1577—79 年数次搭船来霍尔木兹，是故事里的往来；cast/ties.toml 的 extra_03 为 friends，since 改为 1577。
# 不写：玛尔塔偷抄王国标准海图的事（正文、见闻都不写）；亚斯明原口头禅里那个只归哈迪贾的词不用，本线改说“这一角是留给名字的”。

