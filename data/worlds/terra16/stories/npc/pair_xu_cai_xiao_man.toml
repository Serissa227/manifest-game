text = "西南风一起，小蛮的船就回来了。舱里是吕宋的银锭和一捆捆苏木；舱壁上钉着去年那张船引，红印叫潮气洇开了一圈，旁边并排钉着许采抄的一份，字比官府的还工整。这一趟跑下来，原先的船主把船盘给了她，如今她是船主了。她跳上岸，头一件事是把许采从学塾里拉到船头：“给它起个名字，你来写。”许采在新刨的横板上写了“安澜”。这回“澜”字左边的三点，一点也没落下。船工正要上钉，小蛮把横板翻了过来：“这边，再写一个。”“写什么？”“你知道。”许采写了一个“蛮”，占满了半块板。码头上的人笑：“前头叫安澜，背后藏个蛮，这算哪门子船名？”小蛮看着横板钉上船头，“安澜”朝外，拍了拍那块板：“背面那个才是。”"

