# —— 相识：1554 年春，天妃宫前的符匣 ——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_meeting"
title = "写错的符"
text = "天妃宫前的石阶上摆着一只旧木匣，黄纸朱字的平安符码得齐齐整整，每张都写着“天妃护佑，四海安澜”。许采替要搭船出海的父亲来求符，拉了我同来。她拈起一张看了半天：“‘佑’字多了一横，‘澜’字的三点水少了一点。”卖符的渔家女一把将符抽回去，梗着脖子：“符挂上，舵还得自己掌。字多一笔少一笔，妈祖认得。”“妈祖认得，买符的人不认得。至少让我把字改对。”“改字？你先学会撑船。”两人从这句讲到日头偏西：改一张字抵几文，学一回撑船算几张符，翻了船算谁的。渔家女忽然看了站在一旁的我一眼，又看了许采一眼，笑了一下，抽出一张符塞进我衣襟里：“保平安的。”许采数出六文钱放进匣里，挑走那张多了一横的：“明天辰时，江口见。”“找小蛮就行，天妃宫前问谁都知道。”"
stage = "witness"
window = [[1554, 3, 1], [1554, 5, 31]]
at = "yuegang"
cast = ["xu_cai", "xiao_man"]
speaker = "xiao_man"
mood = "cheerful"
news = "月港天妃宫前卖符的渔家女，被社学教读家的女儿挑出符上两个错字，两人在宫门口讲价讲了一下午。"

[tracks.chapters.default]
