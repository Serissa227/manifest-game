# —— 尾声：1568 年夏，船从吕宋回来 ——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_epilogue"
title = "船头的字"
text = "西南风一起，小蛮的船就回来了。船吃水很深，舱里是吕宋的银锭和一捆捆苏木，牙人们围着船舷报价。这一趟跑下来，原先的船主把船盘给了她，如今她是这条船的船主。她跳上岸，货还没交，先把许采从学塾里拉出来，拉到船头：“给它起个名字，你来写。”许采研了一碗墨，在新刨的横板上写了“安澜”两个大字。这回“澜”字左边的三点，一点也没落下。船工正要上钉，小蛮把横板翻了过来，背面朝上：“这边，再写一个。”“写什么？”“你知道。”许采蘸饱了墨，写了一个“蛮”，占满了半块板。码头上看热闹的人笑：“船主，前头叫安澜，背后藏个蛮，这算哪门子船名？”小蛮看着船工把横板钉上船头，“安澜”朝外。她拍了拍那块板：“背面那个才是。”"
