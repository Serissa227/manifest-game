title = "堡里的识字课"
text = "那几年，据说倭警没断过，月港沿江的人家筑起土堡，夜里轮着守。守夜的人闲得发慌，许采就在谷仓前支了一块门板，开了识字课，头一课只教写自己的名字。第一个学生是小蛮。她不光自己来，还撑着舢板沿江一家一家去拉人：“教读家的小姐不收钱，白捡的便宜还不要？”拉来的船户蹲了一地，有人握笔像握鱼叉，有人把墨蘸到了胡子上。许采挨个点名。点到小蛮，她大步上前，在门板上写了一个“蛮”：笔画还是粗，可一笔是一笔，规规矩矩待在格子里。“这个字你会了。”许采说，“今天换你教。”小蛮把笔塞进一个老船户手里，握着他的手往下按：“你叫什么？”“陈水生。”“三个字。今晚学会一个，明早我给你烤鱼。”许采在门板那头笑出了声，又裁开一张纸递过去。"
