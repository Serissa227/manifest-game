# —— 转折：1567 年春，开海（传闻）——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_turning"
title = "开海"
text = "去年冬天月港升了海澄县，今年开春，县衙的告示又贴到了码头上：往后商船可以领船引，堂堂正正出洋。告示底下挤满了人，识字的念，不识字的听。茶摊上的人说，告示贴出去不满三天，天妃宫前那个卖符的就把这些年攒的钱全掏了出来，入了一条洋船的股——船上三十股，她占两股。“她一个卖符的，看得懂股契？”“看不懂。契是教读家的女儿写的。”卖鱼丸的阿婆接过话头：那天她就在船边，教读家的女儿把底稿给船户们念了一遍，谁出多少，赚了怎么分，船翻了怎么算，没一句绕弯的话。几个连名字都不会写的老船户听完就按了手印。“我活了六十岁，头一回听懂一张契。”阿婆说，“末了那个卖符的署名，是她自己写的，好大一个‘蛮’字。”"
stage = "rumor"
window = [[1567, 1, 15], [1567, 4, 30]]
at = "yuegang"
cast = ["xu_cai", "xiao_man"]
mood = "cheerful"
news = "月港开海头一年，天妃宫前卖符的渔家女入股了一条洋船，听说契约是教读家的女儿写的，船户都听得懂。"

