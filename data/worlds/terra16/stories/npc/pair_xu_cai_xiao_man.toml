# —— 抉择：1567 年秋冬，船引与符 ——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_choice"
title = "船引与符"
text = "小蛮入了股的那条船，这年冬天要第一次出洋，等东北风一起就去吕宋。货舱订满了，水柜修好了，偏偏船引还卡在县衙：今年发的船引有数，排在后头的，只能等明年。小蛮在码头上拿篙敲着缆桩算日子：“再过一个月风就起了。错过这一季，船空泊一年，三十股的钱都泡在水里。”许采站在缆桩边上，手里捏着一卷货单——她抄了两份，一份给船上，一份自己留着。“我去天妃宫求一张符。”小蛮停下来瞪她：“符挂上——”“舵得自己掌。我知道。”许采替她接下去，把那卷货单塞进她怀里，“符我去求，船引也得有人去跑。”小蛮低头看着货单，一个字也认不全，却抱得很紧。两人一起来找我的时候，小蛮一手篙一手货单，许采的袖口上还沾着墨。"
