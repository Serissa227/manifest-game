# —— 靠近：1555 年夏，九龙江口的舢板（学院期，到心照不宣为止）——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_closer"
title = "第一个字"
text = "江口退了潮，小蛮的舢板歪在泥滩边。“篙要斜着下，借水的劲。”许采照着做，一篙下去就拔不出来了，整个人挂在篙上，舢板从脚底下溜走。小蛮笑得前仰后合，一脚踩空掉进江里，冒出头来还在笑：“教读家的小姐，篙比你还犟。”轮到许采教了。她在船板上铺开纸，先写记账用的“银”“米”。小蛮把纸推回去：“先教我写我自己。”许采写了一个“蛮”给她描。小蛮握笔像握篙，一笔下去就是一团，笔画挤在一块儿，占满了半张纸。她红着脸要揉，许采按住了，又从袖子里抽出一张——她出门总多带一张纸：“大一点也放得下。先把自己的名字写会，别人就骗不了你一半。”小蛮没揉。她把那张纸对折，再对折，塞进卖符的木匣底下。“明天还来？”许采问。“来。一天一个字——你少教我一个，我就少教你一篙。”"
stage = "witness"
window = [[1555, 5, 1], [1555, 7, 31]]
at = "yuegang"
cast = ["xu_cai", "xiao_man"]
speaker = "xu_cai"
mood = "tender"
news = "九龙江口有人看见教读家的女儿学撑船，篙插进泥里拔不出来，卖符的渔家女笑得掉进了水里。"

[tracks.chapters.default]
next = "pair_xu_cai_xiao_man_together"
effects = []

# —— 落点：1561 年春，江边土堡守夜（成为恋人；主角与其中一人立了 S 约定时此章静默失败，由 _side 轨道接）——
[[tracks.chapters]]
key = "pair_xu_cai_xiao_man_together"
title = "第二个字"
text = "据说那几年倭警一阵紧似一阵，月港沿江的人家筑了土堡，夜里轮着守。这一夜江上起雾，小蛮撑着舢板往堡里运米，一趟，两趟，三趟，肩上勒出一道红印。许采坐在堡门里，就着油灯点名；不会写名字的，她替人写好，再让人按手印。点到最后，名册上只差一行。小蛮卸下最后一袋米，喘着气凑过来：“还差谁？”许采把笔递给她。小蛮愣了一下，在那一行上写了一个“蛮”。还是歪的，可只占了一格。她没把笔还回去，拉住许采的手：“再教我一个字。”“教哪个？”“你说呢。”许采握着她的手，一笔一笔，在“蛮”旁边写了一个“采”。两人出了门洞，在墙根底下站住，守夜的梆子远在堡那头。小蛮凑过去，很快地亲了她一下；许采没让她退开，伸手把她搂住了。"
