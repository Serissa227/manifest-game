# —— 转折：1582 年马尼拉码头的传闻 ——
[[tracks.chapters]]
key = "tie_new_amihan_dagat_sisa_mullu_turning"
title = "不许再来的船"
text = "马尼拉码头上都在说那条秘鲁船：在汤都修了两个月，修好就回去了，押贝壳货的那个女人没跟上。开船那几天她烧得认不出人，是汤都船匠家的女儿背着她去找的大夫。今年从阿卡普尔科来的大帆船又捎来一句话：国王下了令，往后秘鲁的船不许再到这边来。要回去，只能先坐大帆船去阿卡普尔科，再往南找船，顺当也得两年。一个扛货的说，他听见那女人问：“两年？”船匠家的女儿掰着指头替她数：“先等季风，再等大帆船，再等……”数到一半，不数了。那女人如今借住在船匠家。有人看见她坐在船坞边上，从退潮看到涨潮，看了一下午。"
stage = "rumor"
window = [[1582, 6, 1], [1582, 10, 31]]
at = "manila"
cast = ["amihan_dagat", "sisa_mullu"]
mood = "sad"
news = "马尼拉码头上的人说，国王下了令，往后不许秘鲁的船再来。汤都河口那个押贝壳的秘鲁女人病了一场，没赶上船，这下回不去了。"

[tracks.chapters.default]
