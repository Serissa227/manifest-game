text = "阿卡普尔科来的船带回了消息：去年十一月，圣安娜号在加利福尼亚外海叫英格兰人劫了，货被搬空，船被点了火，听说船上的信一封也没剩下。消息传到船坞时，阿米汉正在给一条船补缝。西萨听完，回屋拿出一只小布包，解开来，是一枚旧海菊蛤，红色褪得只剩边上细细一线。还在钦查的时候，有人出三倍的价要买，她没松手。她把贝壳放进阿米汉的手心，把那几根满是老茧的手指一根一根合上：“不回去了。”阿米汉握着它，等了很久才开口：“这条水路，涨潮才开门。”她低头看着自己合拢的手，“你等到了。”那天夜里，是阿米汉先吻了西萨。"
