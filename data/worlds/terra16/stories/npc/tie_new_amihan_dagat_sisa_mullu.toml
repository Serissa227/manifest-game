# —— 相识：1581 年汤都河口的船坞 ——
[[tracks.chapters]]
key = "tie_new_amihan_dagat_sisa_mullu_meeting"
title = "先看手"
text = "从秘鲁来的船在马尼拉卸了银子，才叫人看出船底的毛病：吃水线下的板子让船蛆蛀成了筛子。船拖进汤都河口的船坞，阿米汉领着一队伐木人先扛来几根样木。船主嫌汤都人要价狠，打发押贝壳货的西萨去压价。西萨不看木头，先把伐木人的手一只只翻过来看，最后翻到阿米汉的——满掌老茧，指甲缝里嵌着黑的树脂。“木头再好看，也得算上人家扛了几里山路。”她的卡斯蒂利亚话比伐木人还生硬，“价钱，往上加。”伐木的人你看我、我看你，有人笑出了声，船主在后头直跺脚。阿米汉等了一会儿才开口，指着河口露出来的泥滩：“排筏还在上游，水涨了才进得来。在这儿讲价得等。这条水路，涨潮才开门。”西萨点点头，在木料堆上坐下了，一直坐到水漫过泥滩。"
stage = "witness"
window = [[1581, 5, 1], [1581, 9, 30]]
at = "tondo"
cast = ["amihan_dagat", "sisa_mullu"]
speaker = "sisa_mullu"
mood = "cheerful"
news = "汤都河口在修一条秘鲁来的船。押贝壳货的秘鲁女人去压木料的价，先把伐木人的手一只只翻过来看了一遍，倒把价钱往上加了。"

