# —— 抉择：1587 年一封回家的信 ——
[[tracks.chapters]]
key = "tie_new_amihan_dagat_sisa_mullu_choice"
title = "一封回家的信"
text = "六年了，西萨头一回往钦查写信。信不长：她还活着，在汤都，住船匠家，手上十个指头一个不少。头两遍写坏了，她都塞进了灶膛：“写坏的信寄出去，犯冲。”阿米汉在一旁裁油布，把第三遍折好，包了两层，拿麻线扎紧，扎得比捆船板还用力：“海上潮气重。”这封信只能跟今年的大帆船走——圣安娜号，七月出马尼拉，到阿卡普尔科，再托往南去的商人转到秘鲁，到不到得了，看运气。西萨把油布包翻过来，又翻过去：“你说它能到吗？”阿米汉没答。她咬断麻线头，抬起眼，看着我。"
stage = "involve"
window = [[1587, 5, 1], [1587, 7, 15]]
at = "tondo"
cast = ["amihan_dagat", "sisa_mullu"]
speaker = "sisa_mullu"
mood = "tender"
news = "汤都河口有个秘鲁女人写了一封家信，包了两层油布，要跟今年的大帆船去阿卡普尔科，再转回秘鲁。"

