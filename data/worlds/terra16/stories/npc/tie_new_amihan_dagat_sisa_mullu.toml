# C7 新线（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GL（恋爱线；两人的 romance.with 都是 any，这条线写的是她们之间）。
# 人物：阿米汉·达加特 amihan_dagat（1540-02-22，汤都河口船匠的女儿）× 西萨·穆柳 sisa_mullu（1540-04-01，钦查海菊蛤商人的女儿）；同年生，差一个多月。
#   两人不同学（一个在汤都家学，一个在钦查筏屋），1581 年才在汤都相识，时年 41 岁。
#   恋人效果在 1588-06-01 起的落点章：两人都 48 岁（最早可行日 1558-04-01）。
# 依据：
#   史实——1571 年西班牙人在马尼拉立城，汤都在巴石河口北岸；1580 年代初有秘鲁的船载银直航马尼拉，随后王室下令禁止秘鲁与菲律宾直接通商，只许经阿卡普尔科；
#         1587 年 11 月英格兰的卡文迪什在下加利福尼亚圣卢卡斯角外截住从马尼拉开往阿卡普尔科的圣安娜号，搬空货物后放火，消息 1588 年才传回马尼拉。
#   待核——秘鲁直航马尼拉的船与禁令的确切年份（常见的说法有 1581 年的直航船、1582 年与 1587 年前后的敕令、1593 年的重申）；圣安娜号离开马尼拉的月份。
#         正文一律写成马尼拉码头上的传闻，信件“听说一封也没剩下”。
#   原创——两人；那条秘鲁船的船主与修船；伐木人的手；潮水给水道起的名字（涨潮“集市”、退潮“泥巴”）；拿欠债逼来的采贝人；
#         油布包的家信与抄本、信尾的“不回去”；钦查的歌；收贝壳的小棚。船蛆、树脂补缝、排筏顺水运木料是当地修船的寻常做法，不指具体史料。
#   口头禅：阿米汉“这条水路，涨潮才开门。”；西萨用 cast 里现行的“壳再好看，也得算上人家潜了几回。”（简报里是改写前的旧句）。
#   秘密：阿米汉私记的水道图全文不写；西萨那枚褪色的旧海菊蛤只在两条落点里出现，见闻不写。
# 缺省走向：1581 相识，成为朋友 → 1582 秘鲁的船回去了，她病着没赶上，又听说以后不许秘鲁的船再来（传闻）→ 1584 知己
#   → 1587 托圣安娜号带家信 → 1588 听说圣安娜号被劫、信全丢了，她说“不回去了”，成为恋人（落点，缺省即发生，圆满）。
#   玩家能做的：替她再抄一份交给自己的船走别的路（旗标 helped，落点变体：那一份的信尾写着“不回去”）；或跟她们去马尼拉码头送信（旗标 saw_off）。都不改变结局。
#   主角与两人之一立了 S 约定（c7_tie_new_amihan_dagat_sisa_mullu_taken）时，主轨道在落点静默失败，由 _side 轨道写两人在河口一起收贝壳，成为并肩的朋友。
# 设旗标：c7_tie_new_amihan_dagat_sisa_mullu_helped（落点变体读）、c7_tie_new_amihan_dagat_sisa_mullu_saw_off、
#   c7_tie_new_amihan_dagat_sisa_mullu_together、c7_tie_new_amihan_dagat_sisa_mullu_side。
# 读旗标：c7_tie_new_amihan_dagat_sisa_mullu_taken（由 bond_amihan_dagat、bond_sisa_mullu 的 S 章设）。
# 整合：西萨的日程 1581-05-01 起改在汤都（两条轨道都是）；cast/ties.toml 新增 amihan_dagat × sisa_mullu（GL）。

