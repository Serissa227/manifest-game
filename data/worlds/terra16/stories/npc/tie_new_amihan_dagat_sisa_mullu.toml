# —— 靠近：1584 年河口的水路 ——
[[tracks.chapters]]
key = "tie_new_amihan_dagat_sisa_mullu_closer"
title = "潮的街名"
text = "阿米汉划着小船，带西萨认河口的水路。“这条，涨潮叫‘集市’。”桨尖点了点两排高脚屋中间那道水，“退了潮，叫‘泥巴’。”西萨跟着念了一遍，又指着下一条问。小船靠上码头，一个商人掀开一篓贝壳给她看，个头匀，颜色正。西萨没看壳，看的是旁边几个采贝的人——手上全是血口子，指头泡得发白。问了几句，才知道这几个人欠着商人的债，潜一天水，抵一天的利。“不要。”她把篓盖扣上，“壳再好看，也得算上人家潜了几回。”商人骂她一个外乡女人多管闲事，叫人把篓子扛去别的船。阿米汉把船往岸边一横，桨搁在膝上：“她不买，这里的船也不载。”码头上的船夫一个也没动。西萨回头看她，笑了——到汤都三年，头一回笑得像在钦查的家里。"
stage = "witness"
window = [[1584, 3, 1], [1584, 7, 31]]
at = "tondo"
cast = ["amihan_dagat", "sisa_mullu"]
speaker = "amihan_dagat"
mood = "tender"
news = "汤都河口有个秘鲁女人不肯买欠债的采贝人捞上来的贝壳。商人要换条船运走，船匠家的女儿把小船往岸边一横，码头上没一条船肯载。"

