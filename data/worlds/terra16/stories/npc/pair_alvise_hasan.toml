# 抉择：1572 年冬春，塔赫塔卡莱的咖啡馆。商人要新战船的图纸；玩家可以偷、可以掩护、可以回绝。
[[tracks.chapters]]
key = "pair_alvise_hasan_choice"
title = "借看与偷走"
text = "威尼斯来的商人在咖啡馆门口截住我，往我手里塞了一封蜡封的信，压低了嗓子：“金角湾新下水的战船，一张图，龙骨线就够。价钱你开。”邻桌的阿尔维塞听见了，脸色发白，没看那封信，也没看我。“这封信，先问谁有权拆。”他说得很轻，指尖在桌沿敲了两下——那枚封蜡的印，他认得。门一响，哈桑夹着一卷图纸进来，在老位置坐下，把糖罐往秘书那边推。“图纸不留在厂里过夜，我带回去，搁床头。”他打了个哈欠，“三晚没合眼了。”"
