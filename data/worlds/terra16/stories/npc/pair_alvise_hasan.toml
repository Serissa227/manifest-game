# 相识：1570 年春，塔赫塔卡莱的咖啡馆。一口没喝的咖啡，一罐糖，面包屑摆的屋梁。
[[tracks.chapters]]
key = "pair_alvise_hasan_meeting"
title = "咖啡凉了"
text = "塔赫塔卡莱的咖啡馆里，威尼斯巴伊洛的秘书绕了三个弯，才问到正题：“金角湾的船台，是一百二十步长，还是一百三十步？替朋友问的。”船匠哈桑没答，只指了指他面前的杯子：“咖啡，一口没动。”“太苦。”阿尔维塞说。哈桑把自己的糖罐推过去，接着低头刨手里的木片。咖啡凉了，船台也没人再提。哈桑说他家有扇门，一下雨就漏；阿尔维塞说威尼斯的窗也这样，两人为哪种木头经得住水争了起来。秘书拿面包屑在桌上摆屋梁，摆歪了一根，哈桑伸手拨正：“这根是龙骨。图纸能折，龙骨不能。”店主来收杯，两只都是满的。阿尔维塞问：“不知下回若还想打听船台，该往哪里打听？”“就这张桌子。”"
stage = "witness"
window = [[1570, 2, 1], [1570, 4, 30]]
at = "istanbul"
cast = ["alvise", "hasan"]
speaker = "hasan"
mood = "cheerful"
news = "塔赫塔卡莱的咖啡馆里，威尼斯巴伊洛的秘书和金角湾的船匠为一扇漏雨的门争了一下午，两杯咖啡都凉透了。"

