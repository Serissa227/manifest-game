# 转折（传闻）：1571 年勒班陀以后的冬天。一包针和布条，一张摊开的图纸和没有往下看的眼睛。
[[tracks.chapters]]
key = "pair_alvise_hasan_turning"
title = "一个冬天"
text = "勒班陀的消息一传回来，金角湾的锤声就没停过，夜里点着火把接着敲。船厂里针线告罄，工匠的衣裳破了只能拿绳子扎。咖啡馆里的人讲，前两天有个威尼斯巴伊洛的秘书托人送去一包东西，收件的是一个船匠：一卷针，几条干净布条，连张字条也没附。船匠拆开看了半天，把布条分给同组的人，针也分了，只给自己留下最细的一根，别在头巾里。又有人说，昨天傍晚那个船匠把新战船的图纸摊在塔赫塔卡莱的桌上改尺寸，秘书就坐在对面，端着杯子，一眼也没往纸上看。"
