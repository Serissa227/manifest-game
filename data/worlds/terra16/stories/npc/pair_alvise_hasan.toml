# 落点二（传闻）：1573 年春。偷图的后果——隔着金角湾一年多，仍是恋人。
[[tracks.chapters]]
key = "pair_alvise_hasan_apart"
title = "隔着金角湾"
text = "传言说：丢了图纸的那个冬天以后，金角湾的船匠整整一年没进过塔赫塔卡莱的咖啡馆。威尼斯巴伊洛的秘书倒是天天去，坐到店主上门板，面前摆两只杯，一只喝，一只凉着。还有人说，船匠那一年每个月托人往宅邸送一块新刨的木片，带着松脂味，什么话也不附。和约签了的这个春天，有人看见船匠到了咖啡馆门口，没进来，站在台阶下面，隔着门槛同秘书说了几句话。店里人只听清最后一句：“糖放够。别又说苦。”说完他沿着坡道往金角湾走了。秘书把那杯凉的推到桌子对面，空着的那头。"
stage = "rumor"
