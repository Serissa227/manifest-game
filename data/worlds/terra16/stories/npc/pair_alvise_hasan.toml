# 图纸不画的地方（pair_alvise_hasan）——配角线，标签 BL；恋爱线（不公开的恋人）。
# 人物：阿尔维塞·特龙（alvise，1530-09-26 生，取向不限），威尼斯驻伊斯坦布尔巴伊洛的年轻秘书，说话绕、客气；
#       哈桑（hasan，1531-10-04 生，纯 BL），金角湾造船厂的船匠，话少，手上不停。
#       全线两人 38—42 岁，早已成年；lovers 效果出现在 1570-10 的 closer 与 1573 的 together / apart（最早可用日 1557-01-01，窗口都在其后）。
# 依据（史实）：1555 年起伊斯坦布尔有了咖啡馆（塔赫塔卡莱一带最早）；1570 年塞浦路斯战争开打，威尼斯巴伊洛的宅邸被兵看管；
#       1571 年 10 月勒班陀海战，奥斯曼在 1571—72 年冬天日夜重建舰队；1573 年 3 月威尼斯与奥斯曼签和约，宅邸的守卫撤去。
# 依据（原创）：两人与全部情节；漏雨的门、面包屑摆的屋梁、糖罐、针和布条、装钉子的箱子、箱底刻的小船。
# 待核：无硬史实；1570 年宅邸看管的松紧、修门是否需要衙门批准，正文取大意，一律是传闻口吻。
# 秘密（不进见闻，也不明写）：阿尔维塞暗中替威尼斯那边的人搜集情报，正文只写“威尼斯那边的人”与“报告”，见闻里永远没有；
#       哈桑也是塞利姆·凯雷斯特的师傅（tie_extra_07_hasan_selim_kereste），本文件不写塞利姆。
# 口头禅：哈桑“图纸能折，龙骨不能。”只在 meeting 用一次；阿尔维塞“这封信，先问谁有权拆。”只在 choice 用一次。
# 缺省走向（玩家不在场也照样发生）：1570 春咖啡馆相识 → 1570 冬天一扇门修了三天，成为不公开的恋人（lovers，设 _together）
#   → 1571 年底勒班陀以后的传闻（针和布条）→ 1572 冬天商人想买新战船的图纸，没人接，阿尔维塞给威尼斯的报告里只写岸上看得见的事
#   → 1573 年春和约后大白天坐一桌（together，lovers）。
#   掩护（_helped）：让哈桑以船上木匠的名义进出宅邸 → together 变体：装钉子的箱子还回来，箱底刻着一只小船。
#   回绝（_refused）：把商人的蜡封信交给阿尔维塞 → together 变体：哈桑推来一杯已经放了糖的咖啡。
#   偷图（_apart，会有后果）：哈桑认定是阿尔维塞拿的 → 走 apart（传闻，隔着金角湾一年多，仍是恋人，关系效果同样是 lovers）。
# 共享旗标：写 c7_pair_alvise_hasan_together（closer、together、apart 都写）、_helped、_refused、_apart；不读任何旗标。
# 日程与 ties（整合方）：两人日程都在伊斯坦布尔，无需改动；cast/ties.toml 的 alvise_hasan 现为 since [1571, 12, 31]，
