# 靠近：1570 年冬，加拉塔的巴伊洛宅邸。一扇修了三天的门，写到门后一个吻为止。
[[tracks.chapters]]
key = "pair_alvise_hasan_closer"
title = "守卫门口的木匠"
text = "塞浦路斯开了战，加拉塔的巴伊洛宅邸门口换了兵，进出都要验牌子。偏偏那晚风大，侧门的门轴断了。管事去衙门报修，领活的木匠是金角湾来的哈桑——他自己去揽的。第一天，他量门框，阿尔维塞抱着一摞公文坐在台阶上看。第二天，他刨门板，阿尔维塞端来了水。“恕我多问一句，这门板，可是松木的？”“橡木进不来了，打着仗。”哈桑头也不抬，“松木的门，推得开，也关得上。”第三天傍晚，最后一颗木钉敲进去，哈桑放下锤子，没去拿工具袋。“修好了。”“修好了。”阿尔维塞说，手却按在新门板上，没有让开。哈桑把那只手连同门板一起按住，吻了他。很短，像在查一道缝。门外的守卫听见锤声停了，等了一阵，再没响起来，就蹲下去系鞋带，系了很久。"
stage = "witness"
window = [[1570, 10, 1], [1570, 12, 31]]
at = "istanbul"
cast = ["alvise", "hasan"]
speaker = "alvise"
mood = "tender"
news = "加拉塔那座被兵看着的威尼斯宅子换了扇新门，修门的是金角湾来的船匠，修了三天。"

