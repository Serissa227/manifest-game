# 1559 秋 · 相识：印度船队到港，借宿不报姓的女人，油布筒里的一角
[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_meeting"
title = "逃的不是婚"
text = "九月底，印度船队进了果阿港，季风的尾巴还在下雨。下船的人里有个女人，行李只有一个油布筒，抱在怀里不让脚夫碰。她在码头上问的头一句是：哪里能借宿，不用报姓。玛丽亚正在仓库门口点一船胡椒，看她一眼，就当她是从里斯本逃婚出来的——这样的姑娘，船队每年都要捎来一两个。她把账本往腋下一夹：“先进去避雨，货明天再点。”仓库楼上有间不用写姓的空屋。玛尔塔进门头一件事，是把油布筒搁上桌，解开绳子。滑出来的不是嫁妆单子，是一卷厚纸的一角，密密的线，墨色还新。玛丽亚端着灯凑过去，玛尔塔一只手按住纸角：“看图可以，别伸手。”玛丽亚把手缩回围裙里，又看了一眼那些线，转身把窗关小了一半：“那更该先吃饭。”"
stage = "witness"
window = [[1559, 9, 15], [1559, 11, 30]]
at = "goa"
cast = ["marta_lobo", "maria_da_luz"]
speaker = "maria_da_luz"
mood = "tender"
news = "果阿码头那个寡妇女商人又收留了一个外乡姑娘，住仓库楼上，进门的时候只带了一个油布筒，问她姓什么也不说。"

