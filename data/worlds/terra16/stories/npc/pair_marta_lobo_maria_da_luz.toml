# 1561 春 · 抉择：图和人不能再待在同一道墙后；两人都想先保对方的东西
[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_choice"
title = "谁拿原图"
text = "开春以后，敲门的人来得更勤了，前天隔壁的仓库连楼板都被撬开。图和人不能再待在同一道墙后——查出一样，另一样也保不住。两人吵到灯芯烧短，吵完一起来码头找我。玛尔塔先开口，话短得像刀：“先送她姑母走。图我自己会藏。”“你藏？你连饭都要我端上楼。”玛丽亚转向我，“图先走。图在一天，她就一天睡不着。”“人先走。”“图先走。”两人都在替对方的东西讨一条船。玛丽亚攥着夹层那把小铜锁的钥匙，玛尔塔抱着那个油布筒，谁也不肯先松手。码头另一头，那个替安特卫普商号打听航路的佛兰德人又在转悠。上个月他还拦住玛尔塔问过：图卖不卖。"
