[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_apart"
title = "每年一张船票"
text = "码头上的人说，那个会画图的房客走得很急，连夜搭上一条去霍尔木兹的船，行李还是来时那个油布筒，只是筒里轻了。审判官的人第二天就到了正街上的仓库，问了一下午，账房里的人只管给他们倒酒，什么也没问出来。后来又来过一回，照旧喝了酒，照旧没上楼。寡妇女商人的仓单上从此每年多了一行：霍尔木兹，船票一张。有时是她自己去，回来时晒黑了一层；有时是那边来人，在仓库楼上住一个月，住到季风转向才走。码头上的伙计说，两个女人在跳板前分手从来不哭，只互相把对方的头巾系紧一点。"
stage = "rumor"
window = [[1561, 6, 1], [1561, 8, 31]]
at = "goa"
cast = ["marta_lobo", "maria_da_luz"]
mood = "sad"
news = "果阿那个会画图的房客连夜走了，听说去了霍尔木兹；寡妇女商人的仓单上从此每年多记一张船票。"

