text = "姑母和表妹去了科钦，墙后面只剩玛尔塔自己的东西。“一卷纸，”她说，“查出来再说。”她反倒敢拿起笔了。她替商人画海图，不署名——这回连父亲的名字也不署——画得比官家的准。价钱玛丽亚开，一文不让；她翻账本的那只手上戴着姑母留下的旧戒指，指根缠的线换过两回了。上个月科钦来了信，只有一行：都好，饼吃完了。雨季的一个夜里，玛尔塔把一张新图摊在长桌上，叫她过来。图的一角，果阿的岸边多了一间小小的仓库，屋顶上一盏灯。“这是什么？”“记号。买图的人看不懂，你看懂就行。”玛丽亚看了很久，说灯画小了，楼上那盏比这亮。玛尔塔搁下笔，凑过去，在她嘴角碰了一下：“那你去把它拨亮一点。”"

