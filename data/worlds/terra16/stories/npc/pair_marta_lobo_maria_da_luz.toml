# C7 配角线：玛尔塔·洛博 × 玛丽亚·达·卢斯——夹层里的两个人（故事 2.0，遵循 A5 / E37“故事 2.0 TOML 契约”）。
# 标签：GL（恋爱）·配角线。两人都是纯 GL（romance.with = f），只对女性，不转向异性。
# 人物：玛尔塔·洛博（marta_lobo，1530-03-11）：里斯本印度商馆一位制图师的女儿，图画得比父亲好，署的却一直是父亲的名字；1559 起在果阿。
#       玛丽亚·达·卢斯（maria_da_luz，1529-05-12）：果阿的寡妇女商人，正街上有一间仓库。生年差 1。
# 年龄：全线两人都已成年（1559 年 29 与 30 岁）。closer（1560-03-01..05-15）只写 crush；
#       lovers 只在三个落点（1561-06-01..08-31，两人 31 与 32 岁，晚于 1557-01-01）。两个 witness 落点写到一个吻为止，apart 是传闻，不写吻。
# 依据：
#   史实——葡萄牙去印度的船队春天离开里斯本，九月底前后到果阿，正赶上季风的尾巴；1560 年果阿设立宗教裁判所，
#         矛头先对着新基督徒（改宗的犹太人后裔），守安息日、不吃猪肉一类的事会被人告发；科钦有新基督徒；
#         葡萄牙王室把标准海图（padrão）锁在里斯本，严禁外传；果阿的正街（Rua Direita）是商铺与仓库最多的一条街。
#   原创——两人、油布筒、墙里的回声、给姑母画的小路图、掌心里的航线、图角上的灯、仓单上的船票；
#         那个替安特卫普商号打听航路的佛兰德人（“荷兰人的先驱”的影子，不指名任何真人）。
#   待核——审判官到任的确切月份按 1560 年下半年的传闻写，正文不报日子。
# 秘密：玛尔塔偷抄的标准海图（基督骑士团与钻研赫尔墨斯之书的人都在找）；玛丽亚把改宗前的姑母与表妹藏在仓库楼上的夹层。
#       正文可写“海图”“夹层”；见闻永远不写海图的来历与下落、不写夹层、不写亲人。
#       两人的口头禅原话各只在 meeting 用一次，其余各章换说法呼应。
# 缺省走向：1559 秋相识（以为逃婚）→ 1560 春墙里的回声、两人共守一道墙（crush）→ 1560 秋裁判所来了（传闻）
#           → 1561 春谁拿原图（无人插手：玛尔塔把原图藏到只有她知道的地方，姑母与表妹熬过雨季）
#           → together：玛尔塔不再画图，记账，以房东与房客的名义同住，成了恋人（遗憾而相守）。
# 玩家能做的：帮助——把原图带上我的船交给可靠的人（keep_chart），或把姑母与表妹送去科钦（relatives）→ landing_b：
#             玛尔塔替商人画不署名的海图，玛丽亚管账（圆满；relatives 有变体）。
#             卖图给佛兰德人（sell，会有后果）→ apart：玛尔塔流亡霍尔木兹，仍是恋人，玛丽亚每年记一张船票。
# 旗标：三个落点都设共享旗标 c7_pair_marta_lobo_maria_da_luz_together；choice 设 _helped / _relatives / _apart；
#       landing_b 的变体读 _relatives。不读外部旗标。
# 日程：缺省与帮助路径不改 cast（两人 1559 起都在 goa）。apart 的 schedule 效果把玛尔塔迁去 hormuz_port（落点触发时生效，约 1561 年夏）。
