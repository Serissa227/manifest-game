# 1561 雨季 · 落点 B（帮助后，恋人）：不署名的海图，图角上的一盏灯
[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_landing_b"
title = "非官方的海图"
text = "原图不在果阿了，玛尔塔反倒敢拿起笔。她替商人画海图，不署名——这回连父亲的名字也不署——画得比官家的准：从果阿到马六甲那一路的浅滩，官图错了两处，她的没错。价钱玛丽亚开，一文不让。有个船主嫌贵，玛丽亚把图卷起来往回收：“嫌贵就买官家的。搁了浅，官家可不赔。”船主又把钱袋掏了出来。雨季的一个夜里，玛尔塔把一张新图摊在长桌上，叫她过来。图的一角，果阿的岸边多了一间小小的仓库，屋顶上一盏灯。“这是什么？”“记号。买图的人看不懂，你看懂就行。”玛丽亚看了很久，说灯画小了，楼上那盏比这亮。玛尔塔搁下笔，凑过去，在她嘴角碰了一下：“那你去把它拨亮一点。”"
