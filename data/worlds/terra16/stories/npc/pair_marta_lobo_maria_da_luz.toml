title = "裁判所来了"
text = "这年秋天，果阿来了审判官，街上一下子多了穿黑袍的人。码头上的人说，新来的审判官要查新基督徒的家，谁家礼拜六不生火、谁家不碰猪肉，都有邻居去告，告的人里有不少是欠了债的。正街上的仓库一家家被敲门问话。有个卖丁香的被带走了，铺门当天就贴上了封条。卖鱼的女人说，那个寡妇女商人的仓库也被敲过门，她把问话的人请进账房，倒了一杯葡萄酒，陪着讲了半天胡椒的行情，人走的时候空着手，连楼梯都没上。也有人说，那天下午她楼上的房客一直坐在窗口，手里捏着笔，一笔也没落。"
