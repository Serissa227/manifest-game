# 1560 春 · 靠近：夜里敲墙，敲出回声；两个藏东西的人互相看穿（crush）
[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_closer"
title = "敲出回声的墙"
text = "玛尔塔夜里举着蜡烛，替油布筒找地方。床板底下太浅，梁上有老鼠。她用指节沿墙一寸寸敲，敲到挨着楼梯那一面，声音空了。耳朵刚贴上去，墙里有人咳了一声。木板挪开，烛光照进去：一个老妇人搂着个瘦姑娘，缩在胡椒袋后面，眼睛都睁着。玛丽亚端着一罐粥上楼，看见墙开着，顿了顿，还是把粥递了进去。那老妇人的眉眼和她一个样。玛丽亚什么也没解释，只看着玛尔塔怀里的筒：“你那筒东西，要不要也放进来？”玛尔塔张了张嘴，平日那些刺一根也没出来。她把筒递过去：“往里放，别压着她的脚。”第二天，姑母枕边多了一张小路图：从果阿往南回科钦，一年前她们走的就是这条路；哪里有渡口，哪座教堂的神父不查人，比她给商馆画的哪一张都细。"
stage = "witness"
window = [[1560, 3, 1], [1560, 5, 15]]
at = "goa"
cast = ["marta_lobo", "maria_da_luz"]
speaker = "marta_lobo"
mood = "tender"
night = true
news = "果阿那个寡妇女商人的仓库，听说楼上的灯一夜没熄，房客和东家在里头说了一夜的话，天亮才睡下。"

