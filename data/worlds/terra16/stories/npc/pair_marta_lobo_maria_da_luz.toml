# 1561 雨季 · 落点（缺省，恋人）：不再画图的人，在掌心里画了一条航线
[[tracks.chapters]]
key = "pair_marta_lobo_maria_da_luz_together"
title = "房东与房客"
text = "原图的下落只有玛尔塔知道。她没说，玛丽亚也没问。从那以后她不再碰画笔，在仓库的账房里记账，字小而齐，一笔不歪，看得出是画图的手。外人问起，两人是房东和房客。雨季的一个夜里，雨把屋顶打得发闷，账房里只剩一盏灯。玛丽亚算完最后一页，伸手去拿灯，玛尔塔捉住她的手腕，把手掌翻过来，用指甲在掌心里划。“痒。”“别动。这是里斯本。”指甲往下走，沿着一片海岸，到了尽头拐一个大弯，走得极慢，“好望角。”“怎么这么慢？”“风大。”她一路划到掌根，停住，“果阿。”玛丽亚把手攥成拳，像怕那条线漏出去。玛尔塔看着那只拳头：“这条航线欠我的工钱，这回算是讨回来了。”玛丽亚低下头，吻了她。"
