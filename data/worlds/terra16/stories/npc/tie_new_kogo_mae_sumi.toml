# C7 配角线（新线）：替别人写信的人——小督 × 真栄澄。
# 走向：隔信→见面（三十年只靠书信，1589 年第一次见面；远距相守）。
# C21b 改（2026-11-12，Claude Opus）：只删腔调。小督的口号“字我替你写，心事你自己留着”只许 bond_kogo 米铺一场，closer_b 里换成她自己报价的话；
#   去掉“看了很久”“攥”一类。剧情、旗标、效果不动。
# 标签：GL（恋爱）。小督（1540-06-16，京都，地下官人家的女儿，宫外赁屋替人代笔，纯 GL）× 真栄澄（1540-12-16，那霸，祝女亲族的女儿，替出海人家记家信，romance any）；
#   生年相差半年。两人分属京都与那霸的学院，学院期互不相识，三十年只靠书信往来，1589 年才第一次见面。
# 依据·史实：十五、十六世纪堺的商人走南海路与琉球通商；1575 年琉球的“绫船”使者到鹿儿岛贺岛津义久，萨摩方面以礼数不周当面责问，两地往来随后紧张；
#   1588 年尚永王去世、尚宁即位，1589 年琉球派首里天龙寺的僧人桃庵为使，由岛津家引路经萨摩上京，贺丰臣秀吉。正文一律用传闻口吻写这几件事，不写谒见的日期与地点。
# 依据·原创：两人与她们的三十年书信；1559 年死在堺的琉球水手与那封没有“死”字的报丧信；琉歌“晚潮”与和歌“砚里一汪海”（两首都是原创，按八八八六、五七五七七的格律译成中文）；
#   上京柿子树下的小屋（与 tie_new_ayame_kogo、tie_kikuchiyo_kogo 里小督赁的小屋是同一间）；梯梧花；使团书记临行病倒、真栄澄顶替的事。
# 待核：1575 年以后琉球往北的船停了多久（正文只说“停了多久，没人说得准”）；1589 年使团在京都停留的时长与回程（正文只说“住了些日子”，在淀川的码头道别——
#   不写伏见，伏见的河港要到 1594 年筑城以后才兴起）；使团里有无女性随员（原创，正文写成托人说情或临时顶替的破格）。
# 缺省走向：1559 堺的报丧信（传闻）→ 1560 那霸回信问写信人（friends）→ 1563 第一首写给自己的歌（confidants）→ 1575 萨摩断船（传闻）
#   → 1589 春真栄澄想随使团上京；没人插手时，书记临行病倒，她顶替上后一条船 → 1589 秋京都第一次见面，成为恋人（lovers，设 c7_tie_new_kogo_mae_sumi_together）；
#   之后仍一个在京都、一个在那霸，照旧写信（远距相守）。
#   帮助（替她在随员名单上争到书记的位置，设 _helped）→ 在京都住满一个月；撮合（替她先把信带到京都，设 _matched）→ 小督早早等在使团借住的寺门外。
#   三条路都通向同一个落点，只用 variants 改正文，关系效果相同。
#   主角在羁绊 S 章与其中一人立约（bond_kogo 或 bond_mae_sumi 的 promise / heart 设 c7_tie_new_kogo_mae_sumi_taken）时，主轨道的落点静默失败，
#   由第二条轨道 tie_new_kogo_mae_sumi_side 写两人对完三十年的旧信，做一辈子的笔友（confidants，不把已设的知己降回朋友；设 _side）。落点以前的各章只到 confidants，不写告白，两条结局都接得上。
# 旗标：设 c7_tie_new_kogo_mae_sumi_helped / _matched / _together / _side；读 c7_tie_new_kogo_mae_sumi_taken（bond_kogo、bond_mae_sumi 的 S 章设）。
# 日程：不改。真栄澄 1589 年随使团上京是故事里的出行，日程仍在那霸。
# 秘密：小督替菖代笔的那首恋歌全线不提（归 bond_kogo 与 tie_new_ayame_kogo）；真栄澄另抄名字的名簿只在正文里出现，见闻里不写。

