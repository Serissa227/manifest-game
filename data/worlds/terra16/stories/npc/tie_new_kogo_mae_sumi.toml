title = "写这封信的人是谁"
text = "那封信在路上走了将近一年，才到那霸一个卖鱼的老妇人手里。老人不识字，请真栄澄来念。真栄澄念得很慢，念到“他睡下的时候脸朝着南边，朝着家”，嗓子一转，后头几行是唱出来的。老人听完，攥着信纸问：“写信的，是我儿子的什么人？”真栄澄张了张嘴，答不上来：“……我替您问问。”她替老人写回信，老人说一句，她写一句：“他的衣裳别寄回来了，给船上缺衣裳的人穿。”老人的话写完了，她另起一行，添了自己的一句：“写这封信的人是谁？”那天夜里，她翻开名簿，记下一行：京都的代笔人。"
