title = "一首和歌，一首琉歌"
text = "三年里，京都和那霸之间的信都在替别人捎话，只在末尾各夹一句自己的。这年开春从堺转来的那封，头一回没有别人的事，只有一首琉歌：“三重城下的晚潮水，每天傍晚往北边涨，涨到石堤就回了头——这封信不回头。”小督替人写了十年的歌，头一回有人写给她。她回一首和歌，写了三个晚上，写坏的纸塞满了半个书箱。第三夜我来取托她写的信，书箱口还搭着一张没塞进去的，上头只有一句“京里没有海”，又被一笔划掉。小督伸手抽回去抚平，压在砚台底下。“这一封不收钱，”她把写好的那封封上，“纸钱我自己出，三张，写坏了的不算。”"
