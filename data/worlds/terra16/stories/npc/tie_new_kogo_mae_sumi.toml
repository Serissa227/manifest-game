text = "真栄澄顶了病倒的书记，坐后一条船赶到京都，使团只剩最后几天。她照着落款底下那一行找进上京的小巷，柿子树底下站着一个女人。她们隔着三步站住，谁也没见过谁。真栄澄先开口：“京里没有海，只剩砚里一汪海，今夜也起潮——”小督接得一字不差：“那霸港口的晚浪，一路涨到笔尖上。”“回来时，也把故事带回来。”真栄澄笑了，“这回，我自己带来了。”那几夜，她们把信里没写过的话一夜一夜说完；第三夜，小督在灯下握住她的手，吻了她。使团回程那天，在淀川的码头，小督塞给她一封信，叫她上了船再拆。里头只有一行：“下一封，我对着你的脸写。”"
