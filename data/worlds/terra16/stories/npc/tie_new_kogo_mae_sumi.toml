# 相识（传闻）：1559 年夏，一个琉球水手死在堺。小督只在传闻里出现，真栄澄还不知道有她。
[[tracks.chapters]]
key = "tie_new_kogo_mae_sumi_meeting"
title = "替死人写的信"
text = "堺的码头上这阵子都在说一件事：一条琉球船上的年轻水手发了热，躺了九天，没再起来。船东要给他那霸的老娘报丧，提笔写了两行，自己看着都嫌丑，托人从京都请来一个替人写信的姑娘。姑娘不急着动笔，先问：“他躺下的时候，脸朝哪边？”船东想了半天：“朝南。他说南边暖和。”她又问水手爱吃什么、走前说过什么，问了一下午，写了一夜。第二天账房的老先生替船东念，念到一半拿袖子按了按眼角，念完又从头翻了一遍：“怪了，一个‘死’字也没有。”信跟着下一条去那霸的船走了。"
