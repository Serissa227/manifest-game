title = "摊了一屋子的信"
text = "琉球使团在京都那些天，真栄澄找到了上京那棵柿子树底下的人家。她们顾不上寒暄，先把三十年的信从两只箱子里倒出来，摊满一屋子，按年份一封封对。萨摩断船的那一年，那一格是空的；挨着的一年，并排放着两封。有一封里夹着一朵压扁的梯梧花，红得发黑了。“这朵是我寄的？”真栄澄拿起来对着光看。“你寄的。我信里说京都没有这种花，你下一封就寄来了。”第三天，真栄澄翻开名簿，把“京都的代笔人”那一行划掉，在第一页工工整整写上“小督”。临别时她们约好，往后谁先收到信，谁先把那首歌唱一遍。“我不会唱。”小督说。“那就念。念不出口的地方，改成唱——我教你。”"
