# 靠近：1556 年夏，水营外的石阶。另一本册子；改一个数；先看潮。crush（两人 21 岁）。
[[tracks.chapters]]
key = "pair_ko_haewol_shin_gyeong_closer"
title = "另一本册子"
text = "倭变过后，水营的军报只数战船。申景另记了一本册子，一家一户，写济州的渔户丢了什么：网，船，人。这回高海月来釜山卖鲍，他在水营外的石阶上把册子递给她。每一行末尾都有小字：某月某日，某某说。她一页页翻，翻到一处停住：“这家丢的不是两条船，是一条船、一个儿子。”申景接回册子，当着她的面划去，改了，吹干墨。“下回什么时候来，方便么？我好把日子空出来。”“先看潮，”她把册子合上还他，“不看你们官署点卯。”他翻开封皮里页，添了一行小字，抄的是这个月的潮汛。"
stage = "witness"
window = [[1556, 6, 1], [1556, 8, 31]]
at = "busan"
cast = ["ko_haewol", "shin_gyeong"]
speaker = "shin_gyeong"
mood = "tender"
news = "釜山水营有个年轻军官另记了一本济州渔户的册子，听说是照着一个海女的话一家一家改的。"

