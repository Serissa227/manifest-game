key = "pair_ko_haewol_shin_gyeong_choice"
title = "她挑的日子"
text = "申景的信托我送，写了满满一页，前半页全是天气：开春的风，鱼市的潮气，水营院里发芽的柳。后半页才绕到想见她。我在鱼市找到高海月，她正蹲着补网，接过信从头看完，用指甲在纸边压出一道折痕：“这人总怕问得太直。”她看完没收起，拿在手上拍了拍，眼睛落在我的包袱上。里头还有他留的那本渔户册子的抄底，他没交代怎么处置。她不开口，等我先动。"
stage = "involve"
