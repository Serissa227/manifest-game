# 转折（传闻）：1556 年秋冬，进贡的鲍鱼。他递册子挨了骂；海女们改了下海的时辰。
[[tracks.chapters]]
key = "pair_ko_haewol_shin_gyeong_turning"
title = "进贡的鲍鱼"
text = "码头上传开一件事。倭变过后，朝廷照旧要济州的海女交足进贡的鲍鱼，一个都不少。水营里那个另记渔户册子的年轻军官，把册子递了上去，说济州今年交不齐，被上官骂了一顿，听说是站着挨的，从头到尾没改口。济州来的船客说，海女们知道了这件事，一个个都不吭声，只是那一冬下海的时辰全改了，谁问也不说为什么。釜山鱼市上有人看见高海月那几天一直在编绳，编好的，一条也没卖。"
stage = "rumor"
window = [[1556, 10, 1], [1556, 12, 31]]
at = "busan"
cast = ["ko_haewol", "shin_gyeong"]
mood = "tense"
news = "倭变以后济州海女的鲍鱼贡一个不少，听说釜山水营有个军官替她们递了册子，挨了上官一顿骂。"

