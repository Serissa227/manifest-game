# 落点（恋爱，缺省即圆满）：1557 年夏，海边的平石。一个吻，此后每次见面都由她定。
[[tracks.chapters]]
key = "pair_ko_haewol_shin_gyeong_together"
title = "平石上"
text = "海边那块平石晒得发白。高海月把网袋、铁钎和水眼镜摆成一排，下水去了。申景来得太早，在石头边站了一个时辰，靴子都没敢脱，水刚漫过脚踝就不肯再往前。她浮上来时先吹一声长哨，手里攥着一只拳头大的鲍鱼，湿漉漉塞给他：“报恩到此为止。往后的事，上岸再逞强，水下听我的。”他想答话，她已经踮起脚亲了他，一嘴的海盐味。他举着那只鲍鱼，不知该放哪儿。“放网袋里，”她说，“下回见面，我去叫你。”"
