# 相识：1555 年夏秋，釜山鱼市。报恩的米布、一捆干麻绳、一个打死的结。
[[tracks.chapters]]
key = "pair_ko_haewol_shin_gyeong_meeting"
title = "先学打结"
text = "鱼市上，一个穿水军袍的年轻人抱着半袋米、一卷布，在济州来的海女摊前站了半天。“乙卯年夏天倭船打济州，我落了水，是姑娘把我拖上岸的，这点米布——”高海月没看米，从摊下抽出一捆晒干的麻绳扔给他：“旱地人的谢礼我吃不了。先学打结。落水那天你抓的是我的手腕，差点两个都沉。”申景把绳头打成死扣，越拉越紧，急出一头汗。她不替他解，只把另一段绳放慢了绕给他看：绕一圈，穿一回，拉一下。第三遍他解开了。他攥着绳头，认认真真说：“这片海你熟，我先听。”"
stage = "witness"
window = [[1555, 7, 15], [1555, 9, 30]]
at = "busan"
cast = ["ko_haewol", "shin_gyeong"]
speaker = "ko_haewol"
mood = "cheerful"
news = "釜山鱼市上，水营的年轻军官抱着米布去谢济州来的海女，米没收下，倒被罚学了一下午的绳结。"

