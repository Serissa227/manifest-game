[[tracks.chapters]]
key = "pair_ko_haewol_shin_gyeong_epilogue"
title = "她搬来了"
text = "水营下头的石滩边新住进来一户人家，搭了间矮屋，屋檐下晾着一排网袋和海带。有人说，这是济州来的海女高海月，搬来釜山了，照旧天一亮就下海。水营里那位申军官如今出巡前，总要先拐到石滩上问一句今天的潮。她说浪大，他就把船期往后推半天。营里的人拿这当笑话讲，他听见了，也不争，只说：“她说浪大，那就是浪大。”"
