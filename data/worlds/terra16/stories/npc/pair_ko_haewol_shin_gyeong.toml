text = "海边那块平石晒得发白。申景抱着三捆干绳来的，在石头边一捆一捆码齐，码了两遍，才发现她早把网袋、铁钎和水眼镜摆好，已经下水去了。他站了一个时辰。她浮上来时先吹一声长哨，手里攥着一只拳头大的鲍鱼，看了看那堆绳，湿漉漉塞给他：“报恩到此为止。往后的事，上了岸随你怎么逞强，下了水就归我管。”他想答话，她已经踮起脚亲了他，一嘴的海盐味。绳子滚了一地。“捡起来，”她说，“下回见面，我去叫你。”"

