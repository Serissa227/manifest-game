# 由她定潮时（pair_ko_haewol_shin_gyeong）——配角线，标签 GB；原创人物，恋爱线（圆满）。
# 人物：高海月（ko_haewol，1535-03-14 生，女），济州的海女，几时下水、谁能跟来都由她说了算；1564 年起住釜山。
#       申景（shin_gyeong，1534-10-22 生，男），朝鲜水军的年轻军官，1553—1559 在济州营里，1560 年起在釜山；写字比说话利索。
#       两人生年差 1。全线都在成年以后：1555—1557 年两人 20—22 岁。
#       1556 年夏心照不宣（crush，两人 21 岁）；1557 年夏恋人（lovers，窗口起日 1557-06-15，两人 22 / 22 岁，晚于最早可用日 1557-01-01）。
#       lovers 章只写到一个吻，两人都已满 18。
# 依据（史实）：1555 年（乙卯年）五六月倭寇大举侵犯全罗道，也打到了济州（乙卯倭变）；
#       济州海女采鲍、向朝廷进贡鲍鱼，负担很重（正文只用“听说”的口吻写）。
# 原创：申景在倭变中落水、被海月救起；他另记的渔户册子；平石；三成的减免只是本线的设定。
# 待核：1556—1557 年济州牧使的称呼与鲍鱼贡的具体数目（正文只写“牧使”“三成”）；
#       釜山水营外石阶、鱼市的格局（只写“石阶”“鱼市”，不写具体建筑）。
# 地点：济州没有地点 key，济州的事只经传闻写；所有章节的 at 都是 busan。
#       1555—1557 年两人的日程都在 jeju，这几年的釜山场面写成他们来办事（她来卖鲍、他来送军报）；章节在场由 at 判断，不要求改日程。
# 缺省走向：相识（学打结）→ 靠近（另一本册子，crush）→ 进贡的鲍鱼（传闻）→ 申景写信，海月挑歇工的日子和平石 →
#       1557 年夏平石上成了恋人，此后每次见面都由她定 → 1564 年她搬到釜山（圆满）。没有坏结局，玩家的帮助只改变变体。
#   撮合：把信送到、日子由她定（_matched）→ 落点变体：申景带着干绳。
#   帮助：把册子的抄底送给济州牧使（_helped）→ 济州的鲍鱼贡减了三成；落点变体：海月带着这个消息，不说谢字。
#   旁观：只多一点好感。
# 口头禅：申景的在 meeting 用一次；海月的在 together 的基础文本用一次，两个变体换说法。
# 秘密：cast 没有写明，不另编；cast 里海月藏珍珠的事不进本线，news 也不写。
# 共享旗标：写 c7_pair_ko_haewol_shin_gyeong_together、_matched、_helped；不读外部旗标。
# 整合方：cast/ties.toml 里 ko_haewol_shin_gyeong 的 since = 1556-12-31 早于本线的 lovers 落点（1557 夏），请改到 1557-06-15 之后。

