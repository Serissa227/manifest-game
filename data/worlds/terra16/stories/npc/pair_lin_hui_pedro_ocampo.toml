# 尾声（1581 夏，传闻）：八连门口的桌子。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_epilogue"
title = "八连"
text = "传言说，马尼拉的唐人都被迁到了城墙外新划的八连里，一家挨一家，门口有兵守着，进出要验牌子。林蕙家那张摊两种账簿的桌子也搬了过去，摆在八连的门口。搬家那天桌子太长，过不了新门，锯短了一截，左边那本汉文账簿底下垫了块砖，摊开来照旧一般平。每天傍晚，有个西班牙书记照旧来，手里的牌子磨得没了边，兵见了他，就把门推开。他坐在右边，翻开册子。"
stage = "rumor"
window = [[1581, 6, 1], [1581, 8, 31]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
mood = "cheerful"
news = "马尼拉的唐人都搬进了八连，听说那张摊两种账簿的桌子也搬过去了，西班牙书记每天傍晚照旧去对名字。"
rumor_days = 30

