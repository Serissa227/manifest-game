# 落点（1575 春）：两种账簿的桌，成为恋人。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_together"
title = "两种账簿的桌"
text = "林蕙家门口换了一张更大的桌子，左边摊汉文账簿，右边摊西文账簿，中间放一碗茶。佩德罗下了值就来，坐右边，把当天问明白的名字一个个念给她听，她在左边对。念完最后一个，天已经黑了。他伸手去摸笔，笔早已横放在册子上了。“今天问明白的就这些。明天……我还能来吗？”“你哪天没来过？”她说着把茶碗推到一边，隔着两本账簿倾过身去，吻了他。算盘珠在桌角响了一声。"
stage = "witness"
window = [[1575, 4, 1], [1575, 6, 30]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
speaker = "pedro_ocampo"
mood = "tender"
news = "马尼拉城墙外有张大桌子，一边摊唐人的账，一边摊西班牙人的账，听说书记每天下了值就来对名字。"

