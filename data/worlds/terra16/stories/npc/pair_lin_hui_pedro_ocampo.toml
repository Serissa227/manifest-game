]

[[tracks.chapters.choices]]
key = "watch"
text = "我留在城墙边，等他们回来"
reply = "我在城墙根的石墩上坐了半天。傍晚两个人回来，佩德罗的鞋又磨破了一只，林蕙手里的名单上多了许多新写的字。他们一路没说话，到城门口才站住。林蕙把名单折好，塞进他手里：“明早岗口见。”"
next = "pair_lin_hui_pedro_ocampo_together"
