# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BG（男女恋人；林蕙 romance=any，佩德罗 romance=f）。
# 人物：林蕙（lin_hui，1538-06-08 生，马尼拉华商之女，管账，门口总留一张能摊开两种账簿的桌子）；
#       佩德罗·德·奥坎波（pedro_ocampo，1537-07-13 生，马尼拉的西班牙书记，册子上只写见过面、问过话的人）。
#       生年差 1 年；1572 年相识时 33 与 34 岁，1575 年成为恋人时 36—37 与 37 岁，门禁全过。两人 1571—1590 都在 manila，不用改日程。
# 依据·史实：1571 年西班牙人在马尼拉建城；1574 年 11 月底到 12 月初，林凤（Limahong）的船队两次进攻马尼拉，城里的华人被怀疑；
#       1581 年前后马尼拉的华人被迁到城墙外的“八连”（Parián）。
#       待核：八连的确切年份（正文只在 1581 年的传闻里出现这个名字，早段一律写“城墙外的华人住处”）；1572 年书记房登记华商货物的做法
#       （正文只写货单与名字）。林凤之乱只写成背景，不写屠杀细节。
# 依据·原创：西文货单边角被挤的名字、她把纸转过来写满正中、油布角上的“林蕙，漳州”、十一个船工的名单与乳名、画了圈的两个名字、
#       乳名旁的大名、两种账簿的桌子、八连门口锯短的桌腿与磨没了边的牌子。佩德罗的口头禅在本线只化成动作：册子上只写他见过面、问过话的人。
#       cast 里两人的秘密本线不写、不暗示。林蕙与卡塔丽娜的生意（1580 年葡西合并、1583 年大火）归 tie_new_catarina_pereira_lin_hui，本线不写。
# 缺省走向：meeting（1572 春，货单）→ closer（1573 夏，走一遍；crush）→ turning（1574-11 传闻，林凤的船）→ choice（1574-12 至 1575-02，
#       过岗找人；缺省：佩德罗与林蕙自己过岗，找回大半）→ together（1575 春，两种账簿的桌，成为恋人；lovers + 旗标）→ epilogue（1581 夏传闻，八连门口的桌）。
#       圆满，没有坏结局。
# 玩家能做的：choice 里作保（vouch）、陪着找人（walk）、旁观（watch）。前两条分别设 _helped / _matched，只改落点章 together 的变体，
#       不改结局；两人的恋爱写在 together 的 default 里，与玩家在不在场无关。
# 旗标：写 c7_pair_lin_hui_pedro_ocampo_together（共享）、_helped、_matched（本文件 together 变体读）。不读外部旗标。
# 整合：cast/ties.toml 的 lin_hui_pedro_ocampo 现为 lovers、since = [1573, 12, 31]，与本线对不上（1573 夏只到 crush，成为恋人在 1575 春），
#       应改为 since = [1575, 6, 30]（together 窗口止日）；note 里“林蕙念一个名字，佩德罗记一个名字”仍可用。

[[tracks]]
key = "pair_lin_hui_pedro_ocampo"
name = "先念她的名字"
kind = "request"
start = "pair_lin_hui_pedro_ocampo_meeting"
auto = true
cast = ["lin_hui", "pedro_ocampo"]

# 相识（1572 春）：被挤到边角的名字。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_meeting"
title = "挤在边上的名字"
text = "漳州的船靠岸第三天，书记房才轮到林家那一栏。佩德罗·德·奥坎波一行行誊成西班牙字，林蕙的名字被他挤在边角，只剩半行。她推门进来，没说话，把整张纸转了半圈，拿笔在正中写满：名字，货数，缎八十匹，瓷四箱。“字不同，欠账不能算两遍。”门口来催货的人嫌耽误工夫，她头也不抬：“名字写错了，究竟该叫谁来领货？”佩德罗摸了摸笔杆：“我的册子只写见过面、问过话的人。你站在这里，我却写在边上，是我的错。”他另取一张纸，把她的名字放在第一行，又问：“我的名字，你们的字怎么写？”她写给他看。他照着描，第一笔很歪。"
stage = "witness"
window = [[1572, 2, 1], [1572, 4, 30]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
speaker = "lin_hui"
mood = "cheerful"
news = "马尼拉城里的西班牙书记被华商的女儿当面改了货单，听说第二天他重写了一张，把她的名字写在第一行。"

[tracks.chapters.default]
next = "pair_lin_hui_pedro_ocampo_closer"
effects = []

# 靠近（1573 夏）：走一遍，油布；心照不宣。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_closer"
title = "走一遍"
text = "城墙里的册子，城墙外的住处，名字常常对不上。林蕙在书记房门口拦住佩德罗：“书记大人，自己走一遍。”他真走了，三天，一家一家敲门，只把见了面、问过话的人写下来，脚底起了泡，才知道册子上一行“外商”漏掉了多少人。第三天傍晚下起雨，他把册子抱在怀里往回赶，林蕙追上来，把包货的油布扔给他：“别把刚问明白的名字又淋没了。”第二天油布送回来，叠得方方正正，角上多了一行小字：林蕙，漳州。她问：“你什么时候知道的？”“头一天，你对开门的老太太说你是漳州人。”佩德罗又摸了摸笔杆，“我记下了。”"
stage = "witness"
window = [[1573, 4, 1], [1573, 6, 30]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
speaker = "pedro_ocampo"
mood = "tender"
news = "马尼拉的西班牙书记在城墙外的华人住处一家家走了三天，听说脚底都磨破了，就为把名字记对。"

[tracks.chapters.default]
next = "pair_lin_hui_pedro_ocampo_turning"
effects = [
  { kind = "tie", a = "lin_hui", b = "pedro_ocampo", relation = "crush" },
]

# 转折（1574-11，传闻）：林凤的船。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_turning"
title = "林凤的船"
text = "传言说，海上来了一支唐人的船队，船主叫林凤，两回打到马尼拉城下，放火烧了半个城。仗还没歇，城里就有人看唐人的眼神不对了。城墙外的住处被兵围了起来，听说要拿着名册，一个一个叫去问话。书记房的灯整夜亮着，有人从窗下过，看见那位奥坎波书记坐在名册前，笔拿起来，又放下。"
stage = "rumor"
window = [[1574, 11, 25], [1574, 12, 15]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
mood = "tense"
news = "林凤的船打进了马尼拉，烧了半个城，城墙外的唐人住处被兵围了，听说要照着名册一个个叫去问话。"
rumor_days = 30

[tracks.chapters.default]
next = "pair_lin_hui_pedro_ocampo_choice"
effects = []

# 抉择（1574-12 至 1575-02）：兵来时的名单。
[[tracks.chapters]]
key = "pair_lin_hui_pedro_ocampo_choice"
title = "兵来时的名单"
text = "仗打完了，城墙外还有十一个船工没回家。林蕙把他们列成一张名单，有的只写了乳名：阿满，大鱼，老七。佩德罗提起笔：“岗口的兵认册子上的字，乳名他们念不出来。我替他们换个好登记的名字——”林蕙一把按住纸：“换了，他娘就不认得了。先去找认得他的人。”佩德罗要带名单过岗，林蕙要一起去，两人在岗口外的棚子下拦住了我。“船长，”林蕙把纸举到我面前，“借你半天。”"
stage = "involve"
window = [[1574, 12, 16], [1575, 2, 28]]
at = "manila"
cast = ["lin_hui", "pedro_ocampo"]
speaker = "lin_hui"
mood = "tense"
news = "林凤退去以后，马尼拉有个西班牙书记陪着华商女儿拿名单过岗找人，听说十一个名字找回了大半。"

[tracks.chapters.default]
next = "pair_lin_hui_pedro_ocampo_together"
effects = []
news = "林凤退去那阵，马尼拉岗口天天有个书记带着个华商女儿递名单，兵起先不认，见得多了，也就放了行。"

[[tracks.chapters.choices]]
key = "vouch"
text = "我拿船籍文书去岗口，替这张名单作保"
reply = "岗口的军官把我的船籍文书翻了两遍，又看了担保书上的印，朝兵挥了挥手。名单上十一个名字，当天找回来九个。剩下两个，林蕙在名字旁边画了个圈，没有划掉。佩德罗盯着那两个圈，笔尖压在纸上，没有落下去。“明天还去。”林蕙说。"
next = "pair_lin_hui_pedro_ocampo_together"
news = "马尼拉岗口有位船长拿船籍文书替一张唐人的名单作保，听说当天就找回了九个船工。"
