[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_pair_raja_muda_daeng_helped" }]
text = "王廷的船队十月里顺河往上游去了，桨声过了第三道弯才听不见。拉惹·穆达没有上那些船。他站在达昂的船头，把剩下的称号一个一个念出来：马六甲诸王之后，柔佛河之主，海上七百条船的……念到最后一个，嗓子哑了。达昂蹲在舱口编缆绳的绳头，从头听到尾，手没停。岸上，王廷最后一条小艇还等着，艇上的老侍从伸长了双手。拉惹·穆达褪下印戒，抛过去。“都留给他们吧。”小艇划走了。他钻进舱里，把那份被火燎了角、删光了箱笼的名单折好，放进木箱，压在达昂的旧衣服下面。出来时一截帆脚索迎面飞来，他接了个满怀。“戒指抛了，船钱可没抛。拉着，风转了。”达昂说。帆升上去，鼓满了。他回头望了一眼上游，转回来，坐在船头，还是那个位置。"

[[tracks.chapters.variants]]
key = "matched"
