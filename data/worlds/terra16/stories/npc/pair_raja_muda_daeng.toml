# 河口那条船（pair_raja_muda_daeng）——配角线，标签 BL；同学线，恋爱线（纯 BL 两人）。
# 人物：拉惹·穆达（raja_muda，1540-09-16 生），柔佛流亡王廷的少年，把称号背得比行李重；在吉里学院念书，成年后回柔佛。
#       达昂（daeng，1539-11-22 生），望加锡来的布吉斯少年水手，替人掌舵时也记着自己的船；成年后有了自己的船。
#       生年差不到一年；学院期（1554—1556）只写到心照不宣（meeting 只设 friends，closer 不设任何关系）。
#       恋人效果只在 together 章（窗口 1559-04-01—06-30）：窗口起日拉惹·穆达 18 岁（1558-09-16 满）、达昂 19 岁（1558-11-22 满），
#       都满 18 且不早于 1557-01-01；写到一个吻为止。
# 依据（史实与原创的界线）：马六甲 1511 年落入葡萄牙人手中，苏丹一系退到柔佛河上重建王廷；1587 年 8 月葡萄牙舰队（保罗·德·利马）
#       攻破柔佛旧都（Johor Lama），王廷迁往上游（史实）。班顿（pantun）是马来的四行对歌，前两行起兴、后两行说意思。
#       两人的故事、河口的泊位、吃水线上的记号、竹筹上的刻痕、两个铜板的船钱、宫人名单，全部是原创，正文用“听说”。
# 待核：1587 年攻城的月份与王廷迁往何处（正文只说“往上游”，不写地名）；柔佛河口的码头细节。
# 去重：班顿对歌的决赛归 bond_raja_muda、台下挑错归 bond_suma、女孩们的对歌归 tie_wati_nyai；本线只写那年散场以后的河边，不写谁赢、不写决赛的句子。
#       “1587 河口等人”只归本线，bond_daeng 不写。
# 缺省走向：meeting（渡口的船钱，设 friends）→ closer（学院期，竹筹与班顿的下半句，心照不宣）
#       → together（1559 年第一条船下水，成为恋人，设 c7_pair_raja_muda_daeng_together；主角若与二人之一立过 S 约定，
#         c7_pair_raja_muda_daeng_taken=true，此章 when 不满足、整条轨道静默结束，改走 _side）
#       → turning（1587 年传闻：葡萄牙舰队与河口的布吉斯船）→ choice（攻城那天的名单；缺省：达昂一个人等到最后，王子最后一个上船）
#       → epilogue（1587 年底，王廷迁往上游，拉惹·穆达留在达昂的船上）。没有坏结局。
#   帮助（list）：设 c7_pair_raja_muda_daeng_helped，epilogue 的 variants 写名单折进船舱的木箱；
#   撮合（second_boat）：设 c7_pair_raja_muda_daeng_matched，variants 写下游来的渔夫送来一篮鱼；旁观（watch）：只加一点好感。
#   三者都走向 epilogue，关系仍是恋人。
# 并肩：taken=true 时第二条轨道 pair_raja_muda_daeng_side 一章 witness（1559 年春），写王子是第一个乘客、补付了五年前的船钱；
#       设 friends 与 c7_pair_raja_muda_daeng_side；不写嫉妒、不写惩罚、不提主角。
# 共享旗标：读 c7_pair_raja_muda_daeng_taken（bond_raja_muda、bond_daeng 的 S 章设）；写 c7_pair_raja_muda_daeng_together
#       （bond_daeng 1565、bond_raja_muda 1575 的重逢读）、_helped、_matched、_side。
# 口头禅各用一次（照人物卡）：拉惹·穆达“论起来，马六甲本该是我家的。”在 closer；达昂“你说去哪儿，我说怎么去。”在 choice；别处只换说法。
# 秘密：拉惹·穆达羡慕达昂可以只为自己的一条船活着（正文不点破，news 不写）；达昂早量好木料、钱差一半（closer 只露竹筹的刻痕，
#       together 写他自己造起船，不写王子付钱，news 不写）。
# 日程（整合方改 cast，可选）：两人的日程在 gresik 到 1590 年底；1587 年三章的 at 用 johor_port（玩家所在地），
#       可把 1587-06 起两人的日程改到 johor_port。cast/ties.toml 的 adult_raja_muda_daeng 的 since 现为 1558-12-31，
#       宜改到 1559-04-01 以后（与 together 章对齐）。

[[tracks]]
key = "pair_raja_muda_daeng"
name = "河口那条船"
kind = "request"
start = "pair_raja_muda_daeng_meeting"
auto = true
cast = ["raja_muda", "daeng"]

# 相识：1554 年春，吉里的渡口。“我的船”、收桨、晒了半天、欠两个铜板。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_meeting"
title = "船是谁的"
text = "渡口只拴着一条小船，船尾坐着个布吉斯少年，桨尖在水里一圈一圈地画。岸上来了个穿绸衫的男孩，脚边一只箱子，下巴抬得老高：“我的船怎么还不过来？我要过河。”桨尖停了。达昂把桨提出水面，横在膝头，往船尾一靠，不动了。风把船从岸边推开一尺，又推回来。拉惹·穆达站在晒烫的泥滩上，额头冒汗，箱子换了两回手，嘴唇动了几次。“……能搭你的船吗？”达昂这才把桨放回水里：“上来。”到了对岸，王子摸遍袖袋，只摸出一枚金戒指。“找不开。”达昂说，“船钱两个铜板。”“我没有铜板。”“那就欠着。”"
stage = "witness"
window = [[1554, 2, 1], [1554, 4, 30]]
at = "gresik"
cast = ["raja_muda", "daeng"]
speaker = "daeng"
mood = "cheerful"
news = "吉里河边那个布吉斯小水手不肯让柔佛的王子用“我的船”这三个字，王子在岸上晒了半天才改口。"

[tracks.chapters.default]
next = "pair_raja_muda_daeng_closer"
effects = [{ kind = "tie", a = "raja_muda", b = "daeng", relation = "friends" }]

# 靠近：1555 年秋，班顿对歌散场以后的河边。竹筹上刻到一半的痕；王子把下半句留给他。学院期，不设任何关系。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_closer"
title = "留给他的下半句"
text = "对歌散场，灯一盏盏灭了。两个人坐在河边，脚悬在水面上。达昂用小刀在一片竹筹上添了一道刻痕，那一排痕已经刻到一半。“论起来，马六甲本该是我家的。”拉惹·穆达望着河口，说得像在念诏书，“我将来要把它拿回来。你呢？”“一条船。”达昂吹掉竹屑，“不欠债的。”路过的几个同学笑出声：“就这点志气？”达昂没抬头，刀也没停。王子没笑。他清了清嗓子，起了班顿的上半句：“潮退桩还在，缆绳换了三回——”停了一下，“下半句留给你，你来对。”刀停住了。过了好一阵，达昂慢慢念：“我要的船不大，不挂谁的旗，不欠谁的账。”竹筹滑下膝头，拉惹·穆达伸手一捞，袖子湿到了肘。“就这句，一个字不改。”停了停，他又低声说：“我的箱子，哪样东西装进去，都是别人定的。”他把竹筹递回去，指头在上面多停了一会儿。"
stage = "witness"
window = [[1555, 9, 1], [1555, 11, 30]]
at = "gresik"
cast = ["raja_muda", "daeng"]
speaker = "raja_muda"
mood = "tender"
news = "吉里对歌散场后，柔佛的王子在河边起了个上半句，听说把下半句留给了一个布吉斯小水手。"

[tracks.chapters.default]
next = "pair_raja_muda_daeng_together"
effects = []

# 落点：1559 年春夏，吉里河滩。竹筹刻满，第一条船下水，坐船头的是第一个客人；两人都满十八，一个吻。
# 主角与二人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_together"
title = "第一条自己的船"
text = "竹筹上最后一道刻痕是四月里刻的。攒够的另一半钱买来一批新木料，和晾了几个月的旧料一起，在吉里的河滩上摊了一地。拉惹·穆达天天来，不提钱，也不提王家，只刨木头。第三天手上起了泡，他拿布缠上，接着刨，刨花卷到脚踝。达昂看了两回，没劝，扔给他一小罐椰子油。船是五月下水的，没有仪式，几个船匠推着船尾，船滑进河里，晃了晃，稳住了。“上来。”达昂站在浅水里，朝船头抬了抬下巴。“船头是……”“第一个客人坐船头，王子的座位我这儿没有。”达昂说，“五年前的船钱，你还欠着。”“记着呢。”拉惹·穆达坐上去，手心的泡蹭在新上了松脂的船舷上，疼得抽了口气。达昂把船撑到河心，搁下篙，由水慢慢把船转了半圈，俯过身，吻了他，很短。"
stage = "witness"
window = [[1559, 4, 1], [1559, 6, 30]]
at = "gresik"
cast = ["raja_muda", "daeng"]
speaker = "daeng"
mood = "tender"
when = [{ kind = "flag", flag = "c7_pair_raja_muda_daeng_taken", value = false }]
news = "吉里河滩上下水了一条新船，船主是那个布吉斯水手，听说坐船头的第一个乘客是柔佛的王子。"

[tracks.chapters.default]
next = "pair_raja_muda_daeng_turning"
effects = [{ kind = "tie", a = "raja_muda", b = "daeng", relation = "lovers" }, { kind = "flag", flag = "c7_pair_raja_muda_daeng_together" }]

# 转折（传闻）：1587 年夏，柔佛旧都。葡萄牙人在马六甲集舰队；河口停着一条不装货的布吉斯船。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_turning"
title = "马六甲来的舰队"
text = "柔佛河口的饭摊上，船夫们把嗓子压得很低：马六甲的葡萄牙人在集舰队，帆多得数不过来，听说是冲着旧都来的。王廷里吵了十几天，老臣里有人要守到最后一个人，也有人早把家当装了箱，只等一声往上游撤的令。吵归吵，河口倒有条船安静得很，是布吉斯人的船，从春天起就泊在那里，不装货，也不接客，缆绳换了新的，船帮上的青苔刮得干干净净。有人去问船主在等什么，他朝王宫的方向看了一眼，没答话。"
stage = "rumor"
window = [[1587, 6, 1], [1587, 7, 31]]
at = "johor_port"
cast = ["raja_muda", "daeng"]
mood = "tense"
news = "葡萄牙人在马六甲集了舰队要打柔佛，听说有条布吉斯船在柔佛河口停了几个月，不装货也不走。"

[tracks.chapters.default]
next = "pair_raja_muda_daeng_choice"
effects = []

# 抉择：1587 年 8 月，柔佛旧都被攻破那天。船不能超载，两趟装得下一半多；玩家排班次、另找船，或者在河口等。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_choice"
title = "上游的退路"
text = "炮声是午后传来的。傍晚河口的码头已经挤满了人：宫里的女眷，书记，抱着孩子的乳母，每人脚边一只箱子。拉惹·穆达攥着一卷名单挤过来，王袍的下摆沾满了泥。达昂的船泊在最外头，吃水线上刻着一道记号。他拿手指点了点那道线：“你说去哪儿，我说怎么去。可船上只有这么多位置。”“名单上五十八个人。”“这条线以下，一趟装得下二十个。来回要一个时辰，火要是天亮前烧到码头，我跑得了两趟，第三趟看天。”两人对着名单看了很久。拉惹·穆达蘸了墨，从最上面起，一行一行划掉“箱笼”两个字，划到自己那一行时手顿了一顿，也划了。名字一个没动。达昂把名单往我这边一递：“你来排。”"
stage = "involve"
window = [[1587, 8, 1], [1587, 8, 31]]
at = "johor_port"
cast = ["raja_muda", "daeng"]
speaker = "daeng"
mood = "tense"
news = "柔佛旧都被葡萄牙人攻破了，河口那条布吉斯船等到最后一趟，听说最后一个上船的是个丢了箱笼的王子。"

[tracks.chapters.default]
next = "pair_raja_muda_daeng_epilogue"
effects = []

[[tracks.chapters.choices]]
