text = "达昂的第一条船在吉里的河滩上下了水，船帮还带着新刨的木头味。拉惹·穆达是头一个客人，在船头坐得笔直，一只手始终扶着船舷。船到对岸，他站起来，伸手进袖袋，摸出两枚铜板放进达昂手心：“船钱。欠了五年。”达昂咬了咬一枚，收了：“以后王子坐我的船，照样收钱。”“应该的。”拉惹·穆达板着脸，“下一趟几时开？”“急什么，水还没退。”两人在河边坐下，拉惹·穆达起了班顿的上半句，达昂对了下半句，说的还是那条船。"
