news = "柔佛旧都被攻破那天，河口那条布吉斯船来回跑了三趟，听说最后一个上船的是个王子。"

[[tracks.chapters.choices]]
key = "second_boat"
text = "到下游另找一条船，接走装不下的人"
reply = "我顺着河往下游跑，天擦黑时在泥滩边找到一条渔船。船主瞥了一眼河口的火光，要价是平时的三倍，我没还价。渔船摇到码头，达昂的第一趟刚装满。他看见那条船，在船头朝我点了一下头，把缆绳抛给船主，让它跟在自己后面。"
next = "pair_raja_muda_daeng_epilogue"
effects = [{ kind = "flag", flag = "c7_pair_raja_muda_daeng_matched" }, { kind = "affinity", person = "daeng", value = 5 }, { kind = "affinity", person = "raja_muda", value = 2 }, { kind = "memory", memory = "mem-pair_raja_muda_daeng-boat", title = "跟在后面的渔船" }]
news = "柔佛旧都被攻破那天，河口的布吉斯船后头跟着一条下游来的渔船，听说最后一个上船的是个王子。"

[[tracks.chapters.choices]]
key = "watch"
text = "不插手，在河口等"
reply = "我在河口的石阶上坐了一夜。火烧到后半夜，岸上的人声一点点远了。天快亮时，达昂的船从烟里撑了出来，吃水压得很低，船头坐着拉惹·穆达，王袍不见了，只剩一件湿透的短衫。"
next = "pair_raja_muda_daeng_epilogue"
