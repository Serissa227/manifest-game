text = "照吃水线排班次，一趟一趟送人上船"
reply = "我站在跳板头，照吃水线点人：乳母抱着孩子先上，书记捧着账册跟上，箱子留在岸上。两趟装满，第三趟开出去时城里已经起火，船舷压得贴着水面。达昂一声不吭，伸手把最后两个孩子接了过去。拉惹·穆达是最后一个跳上船的，手里那卷名单被火燎黑了一个角。"
next = "pair_raja_muda_daeng_epilogue"
