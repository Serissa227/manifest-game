# 尾声：1587 年底，王廷迁往上游。印戒留给王廷，人留在船上。
[[tracks.chapters]]
key = "pair_raja_muda_daeng_epilogue"
title = "不欠王廷"
text = "王廷的船队十月里顺河往上游去了，桨声过了第三道弯才听不见。拉惹·穆达没有上那些船。他站在达昂的船头，把剩下的称号一个一个念出来：马六甲诸王之后，柔佛河之主，海上七百条船的……念到最后一个，嗓子哑了。达昂蹲在舱口编缆绳的绳头，从头听到尾，手没停。岸上，王廷最后一条小艇还等着，艇上的老侍从伸长了双手。拉惹·穆达褪下印戒，抛过去。“都留给他们吧。”小艇划走了。一截帆脚索迎面飞来，他接了个满怀。“戒指抛了，船钱可没抛。拉着，风转了。”达昂说。他拉了一下，没拉动，换了只手。帆升上去，鼓满了。他回头望了一眼上游，转回来，坐在船头，还是那个位置。"
stage = "witness"
window = [[1587, 10, 1], [1587, 12, 31]]
at = "johor_port"
cast = ["raja_muda", "daeng"]
speaker = "raja_muda"
mood = "tender"
news = "柔佛的王廷迁去了上游，听说有个王子没跟着走，上了一条布吉斯船，再没穿过王袍。"

[tracks.chapters.default]
next = "done"
