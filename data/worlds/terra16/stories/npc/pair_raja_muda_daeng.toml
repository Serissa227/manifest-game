text = "王廷的船队十月里顺河往上游去了，桨声过了第三道弯才听不见。拉惹·穆达没有上那些船。他站在达昂的船头，把剩下的称号一个一个念出来：马六甲诸王之后，柔佛河之主，海上七百条船的……念到最后一个，嗓子哑了。岸上，王廷最后一条小艇还等着，艇上的老侍从伸长了双手。拉惹·穆达褪下印戒，抛过去。“都留给他们吧。”小艇划走了。码头另一头，下游来的那个渔夫蹲了半天，这时提着一篮鱼走过来：“上回那位客人给的钱，够买半条船了。这篮鱼算找的零。”达昂接过篮子，看了看拉惹·穆达，没说话，转手把一截帆脚索扔给他。“船钱可没抛。拉着，风转了。”帆升上去，鼓满了。他回头望了一眼上游，转回来，坐在船头，还是那个位置。"

# 并肩：主角与二人之一立过 S 约定时，1559 年春，达昂的第一条船下水，王子是第一个客人，补付了五年前的船钱。
