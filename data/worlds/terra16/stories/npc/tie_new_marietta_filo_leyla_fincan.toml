title = "扣下的威尼斯人"
text = "船匠街这阵子只谈一件事：苏丹要塞浦路斯，跟威尼斯开了战。加拉塔那边的威尼斯商人一个个被带走，货封了，船扣了，巴伊洛关在自己宅子里，门口守着兵。“名册上的人都点齐了，”替官府跑腿的说，“就差一个做玻璃的女人。”卖鱼的说：“开战前一个月就坐船走了。”船匠说：“没见她上船。”清真寺里那十二盏威尼斯灯照样夜夜点着，没人去摘，第三道花纹有裂的那盏也亮着。兵工厂门口的咖啡摊照常开张，只是摊主的女儿收摊一天比一天晚。"
