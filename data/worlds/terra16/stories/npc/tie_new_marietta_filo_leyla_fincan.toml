# 咖啡摊旁的灯（tie_new_marietta_filo_leyla_fincan）——配角线，标签 GL；新线，恋爱线。
# 人物：玛丽埃塔·菲洛（marietta_filo，1540-08-22 生），穆拉诺卖玻璃珠人家的女儿，学院同学；押送玻璃灯到伊斯坦布尔，后来留在那里。
#       莱拉·芬詹（leyla_fincan，1540-04-19 生），金角湾兵工厂门口咖啡摊家的女儿，学院同学，替船匠把口述的订单写成字。
#       全线都在成年以后：1566 年相识（friends，两人二十五六岁）；1568 年知己（confidants）；
#       1574 年恋人（lovers，窗口起日两人都 33 岁；最早可用日 1558-08-22）。落点以前不写告白，两种结局都接得上。
# 依据（史实）：奥斯曼宫廷与清真寺向威尼斯订玻璃灯；伊斯坦布尔的咖啡摊与咖啡馆 1550 年代已有；
#       1570 年为塞浦路斯开战，伊斯坦布尔的威尼斯商人被扣、货与船被封，巴伊洛（马尔坎托尼奥·巴尔巴罗）软禁在佩拉的宅子里；
#       1573 年 3 月威尼斯与奥斯曼单独议和；威尼斯严禁穆拉诺的玻璃匠到外地做工，违者受罚、连累家人。
# 原创：两人的故事、十二盏灯与那张收据、灯坊；父亲的铜印与那只眯眼的猫（猫记号沿用 bond_marietta_filo 的设定）。
# 待核：威尼斯人被扣的具体月份（多说 1570 年初）；和约后巴伊洛宅子给穆拉诺匠人开探亲文书一事是虚构，正文只写书记翻旧例，不写成制度。
# 缺省走向：相识 → 气泡与签名 → 开战（传闻：名册上只差一个做玻璃的女人，不写她在哪里）
#       → 和约后她不回穆拉诺（无人插手：工具袋搁进咖啡摊隔壁的空屋子）→ 1574 年灯坊开张，两人成为恋人（圆满，代价是故乡的禁令）。
#   帮助：去巴伊洛的宅子讨一张探亲文书（_helped）→ 落点变体：明年夏天回穆拉诺看母亲，莱拉同去。
#   撮合：替她带信回穆拉诺交给母亲（_matched）→ 回信一行“记号刻深一点”，落点变体：猫刻得很深。
# 并肩：主角在 bond_marietta_filo 或 bond_leyla_fincan 的 S 章立了约（promise / heart 设 c7_tie_new_marietta_filo_leyla_fincan_taken），
#       主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_marietta_filo_leyla_fincan_side 写两家铺子共用一面墙的朋友。
# 共享旗标：读 c7_tie_new_marietta_filo_leyla_fincan_taken；写 c7_tie_new_marietta_filo_leyla_fincan_together、_side、_helped、_matched。
# 日程（整合方改 cast）：玛丽埃塔 1573 年起常驻 istanbul（两条轨道都是）；正文写她在金角湾“磨了三年的灯”，宜提前到 1570 年初。
# 秘密：玛丽埃塔想在自己做的东西上刻自己的记号（落点里实现）；莱拉替不识字的母亲练过签名（只在 closer 里她自己说出口）。两件都不进见闻。

