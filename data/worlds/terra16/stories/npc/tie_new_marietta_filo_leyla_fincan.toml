# 相识：1566 年夏秋，金角湾码头。十二盏清真寺的灯，一盏细裂。
[[tracks.chapters]]
key = "tie_new_marietta_filo_leyla_fincan_meeting"
title = "第十二盏灯"
text = "金角湾码头上撬开一只木箱，稻草里躺着十二盏穆拉诺的玻璃灯，底座上敲着菲洛家的铜印，是清真寺订的。收货的书记挑出一盏，说有裂，整箱不签。押货的玛丽埃塔把那盏灯举到太阳底下，慢慢转了半圈：“再磨一圈，别急着说看不清——裂在第三道花纹，头发丝那么细，挂上去看不见。”书记把笔一搁：“看不见也是裂。”兵工厂门口卖咖啡的莱拉在旁边听了半天，这时端来两杯，一杯塞给书记，一杯塞给玛丽埃塔，顺手把纸和芦笔拿了过去：“喝完再吵，字还没写清。”她一笔一画地写：十一盏完好，一盏细裂，裂在第三道花纹。写完把纸掉了个头。书记从头看到尾，挑不出毛病，签了。玛丽埃塔没急着回船，在咖啡摊坐到天黑，喝了四杯。"
stage = "witness"
window = [[1566, 5, 1], [1566, 9, 30]]
at = "istanbul"
cast = ["marietta_filo", "leyla_fincan"]
speaker = "leyla_fincan"
mood = "cheerful"
news = "金角湾码头上，清真寺的书记嫌一盏威尼斯玻璃灯有裂，整箱不签；兵工厂门口咖啡摊的姑娘重写了一张收据，他就签了。"

