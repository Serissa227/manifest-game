# 抉择：1573 年和约之后，咖啡摊。回穆拉诺要受罚，不回去就见不着母亲。
[[tracks.chapters]]
key = "tie_new_marietta_filo_leyla_fincan_choice"
title = "回不去的那一边"
text = "和约是三月签的。加拉塔的威尼斯人排着队上船，码头吵了一个月。玛丽埃塔没去。她把工具袋摊在咖啡摊的矮桌上，一件一件往外拿：钢錾，两块磨石，一小包细砂，一副圆规。穆拉诺的规矩，玻璃匠不许在外地做工。她在金角湾磨了三年的灯，回去要受罚；不回去，往后连她娘的面也见不着。“罚就罚，”她说，“又没少挨过。”拿到袋底，是那张对折过两回的纸，她的手停住了。莱拉把一杯咖啡推到她手边：“喝完再吵。”玛丽埃塔没喝，也没吵，抬头看着我。"
