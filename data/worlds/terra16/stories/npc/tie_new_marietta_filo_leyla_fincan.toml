# 靠近：1568 年，咖啡摊上。一个教看气泡，一个教写名字；莱拉自己说出替母亲练签名的事。
[[tracks.chapters]]
key = "tie_new_marietta_filo_leyla_fincan_closer"
title = "气泡与签名"
text = "两年后，玛丽埃塔又押着灯来了。交了货，她在咖啡摊上摸出一块碎玻璃，对着太阳举到莱拉眼前：“看里头。好料气泡少，像清早的海，一点雾都没有。”莱拉眯着眼看了半天：“我只看见你的手指头。”玛丽埃塔把玻璃挪了半寸，莱拉才“哦”了一声。换莱拉教。她在纸头写下自己的名字作样子，再握着玛丽埃塔的手，用奥斯曼字一笔一笔写“玛丽埃塔”，从右往左。写到第五遍，玛丽埃塔用刚学的土耳其话数了一声“贝什”，名字总算不歪了。莱拉松开手：“我娘不识字。小时候账上要她画押，都是我替她签的，背着人练了几百遍。她的名字，我写得比我自己的名字还熟。”玛丽埃塔没接话，把那张写满两个人名字的纸对折，再对折，夹进了工具袋。"
stage = "witness"
window = [[1568, 4, 1], [1568, 9, 30]]
at = "istanbul"
cast = ["marietta_filo", "leyla_fincan"]
speaker = "marietta_filo"
mood = "tender"
news = "金角湾兵工厂门口的咖啡摊上，摊主的女儿握着一个威尼斯女人的手，教她用奥斯曼字写名字，一写就是一下午。"

