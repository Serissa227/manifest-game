# 靠近：1558 年夏，威尼斯剧团后台。账桌上的工钱，垫了戏单的鞋底，一件旧披风；crush 只算心照不宣。
[[tracks.chapters]]
key = "pair_theodoros_tommaso_closer"
title = "演吝啬鬼的人"
text = "台上的潘塔洛内连一根蜡烛头都要数。后台账桌上，托马索却把一个月的工钱倒出来，一个子儿不留，全推给请来的大夫：“皮波的烧再不退，今晚谁来演挨揍的仆人？”大夫点完钱走了。西奥多在门边，看见托马索的鞋底垫着两张旧戏单。他什么也没说。第二天一早，一件褪了色的披风搭在戏箱上，边角补过三回，雨水的味道还没散。托马索拎起来抖了抖：“哪位皇帝穿过的？”“我穿过。”西奥多靠着门框，没往里走，“从科孚穿到这儿，一滴雨没漏。你们的戏服倒是又新又漏。”托马索没接话，把披风搭到肩上，袖口垂过了指尖，他一圈一圈卷了上去。"
stage = "witness"
window = [[1558, 6, 1], [1558, 8, 31]]
at = "venice"
cast = ["theodoros", "tommaso"]
speaker = "theodoros"
mood = "tender"
news = "威尼斯那个剧团多了一件旧披风当戏服，听说是那个自称皇孙的骑兵送的，比剧团所有的戏服都旧。"

