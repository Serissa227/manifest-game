# 落点：1560 年狂欢节，威尼斯剧团后台。戏单上不再有《落难皇孙》；两人成为恋人，写到一个吻为止。
[[tracks.chapters]]
key = "pair_theodoros_tommaso_together"
title = "只用本名"
text = "狂欢节最后一晚，戏单上已经没有《落难皇孙》。后台只剩一盏灯，西奥多卸了借来的绣金外套，坐在门口的凳子上，债主在外头转了一个月，他没挪过地方。托马索摘下潘塔洛内的皮面具，鼻梁上压出一道红印。“这一句是台词，下一句才是真的。”他把面具扔进戏箱，停了停，“西奥多。”西奥多站起来，凳子翻倒在地，没人去扶。“那一长串姓我自己报过多少遍，”西奥多说，“单念这三个字，倒是头一回听。”托马索吻了他。门外债主敲了三下，没人应。"
