# 抉择：1559 年秋，威尼斯剧团后台。《皇孙谢恩》的戏本；玩家可以找公证人、替剧团还债，或不插手。
[[tracks.chapters]]
key = "pair_theodoros_tommaso_choice"
title = "不许演我的话"
text = "班主把新戏本摔在后台的桌上，封皮写着《皇孙谢恩》：落难皇孙被演员救了命，当众表白，观众哭完掏钱。托马索把戏本推回去：“我的话不许演。”班主说你演什么不是演，托马索说演什么都行，这一段不行。门口，西奥多正顶着门板挡债主，听见了，没回头。托马索转向我，嗓子有点哑：“帮剧团想个别的法子，行吗？”西奥多这才开口，话是对着门板说的：“血统若有用，也得先替人挡一剑——要挡，我来挡。”"
