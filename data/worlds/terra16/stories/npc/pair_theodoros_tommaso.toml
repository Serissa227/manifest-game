# 相识：1558 年狂欢节前，威尼斯剧团后台。把剑拿远，皇孙不摸剑柄，学不会摆手，接住滑下台的人。
[[tracks.chapters]]
key = "pair_theodoros_tommaso_meeting"
title = "皇孙的站法"
text = "狂欢节的戏还有三天开演，班主请来个自称皇孙的骑兵撑场面。后台的木台边上还露着钉子头，托马索把西奥多腰间的剑摘下来，插进道具架：“落难皇孙不摸剑柄，摸了，观众就知道你想动手。”“我家祖上就算落难，也是端着落难的。”西奥多把肩膀绷得笔直。“手呢？像撒面包渣那样摆一摆。”托马索示范了三遍，西奥多的手每回都落到腰上，去找那把不在那里的剑。托马索倒退着讲站位，脚跟踩空，仰面从台边滑了下去。西奥多一步抢上，单手把人拎住，稳稳放回地上。托马索拍着衣襟笑出声：“这一下不用演。”"
stage = "witness"
window = [[1558, 1, 15], [1558, 2, 28]]
at = "venice"
cast = ["theodoros", "tommaso"]
speaker = "tommaso"
mood = "cheerful"
news = "威尼斯狂欢节上，剧团请了个自称皇孙的骑兵撑场面，听说戏没学好，倒在台边接住了一个摔下来的演员。"

