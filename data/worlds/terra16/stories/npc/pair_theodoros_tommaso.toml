# 转折（传闻）：1559 年春，威尼斯。债追到后台，借家谱吓人，债主把家谱要去看了半天，戏服照扣。
[[tracks.chapters]]
key = "pair_theodoros_tommaso_turning"
title = "追到后台的债"
text = "听说那个剧团欠了一屁股债，债主们追到后台，要扣戏服抵账。班主没了办法，把那个自称皇孙的骑兵推出去，叫他披上旧披风吓一吓：欠皇族的钱，是要遭报应的。债主里有个管账的老头不吃这一套，只问了一句：“家谱呢？”骑兵真把家谱掏了出来。老头戴上眼镜，一页一页翻了大半个钟头，末了说字写得倒整齐，戏服照扣不误。"
