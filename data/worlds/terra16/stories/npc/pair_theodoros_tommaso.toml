# 台下的姓名（pair_theodoros_tommaso）——配角线，标签 BL；纯 BL 的一对，恋爱线。
# 人物：西奥多·帕莱奥洛戈斯（theodoros，1531-09-20 生），自称拜占庭皇族后人的轻骑兵，1553—1557 在科孚，1558 年起在威尼斯；
#       托马索（tommaso，1530-06-05 生），职业剧团的演员，演吝啬鬼潘塔洛内，1557 年起在威尼斯。
#       生年差一年；全线都在成年以后：1558 年夏 crush（西奥多 26、托马索 27→28 岁），1560 年狂欢节 lovers（西奥多 28、托马索 29 岁，窗口起日晚于 1557-01-01）。
#       落点章只写到一个吻为止。
# 依据（史实与原创的界线）：1545 年 2 月帕多瓦的职业剧团契约是意大利即兴喜剧最早的同伴契约之一；
#       十六世纪的意大利常有自称帕莱奥洛戈斯后裔的人，巴尔干来的轻骑兵（斯特拉迪奥蒂）替威尼斯打仗是史实；威尼斯狂欢节上有戏班搭台演出。
# 原创：这两个人、“落难皇孙”的戏、扣下戏服的债主、那件旧披风、皮面具、用本名签的契约。
# 待核：无硬性史实待核；公证人铺子的行规只写到“念契约、签本名”。
# 不揭晓：“皇孙”凭证的真假。本线不写、不暗示，真假皇孙的故事里只有这段感情是真的。
# 缺省走向：meeting（狂欢节排戏，皇孙的站法）→ closer（旧披风，crush）→ turning（债追到后台，传闻）
#       → choice（班主要排《皇孙谢恩》；缺省：戏没排成，西奥多在后台门口挡了一个月的债主）
#       → together（1560 年狂欢节，两人成为恋人，设 c7_pair_theodoros_tommaso_together）。圆满，没有坏结局。
#   帮助：notary（签本名的契约）、debts（替剧团还债）都设 c7_pair_theodoros_tommaso_helped，并各给一条回忆；
#       helped 时落点章换一段变体（门外已没有债主）；旁观（watch）只加一点好感，落点用基础文本。三条路关系效果相同（lovers）。
# 共享旗标（写）：c7_pair_theodoros_tommaso_helped、c7_pair_theodoros_tommaso_together；不读外部旗标。
# 日程：不需要改。两人静态日程都在威尼斯（托马索 1557 起、西奥多 1558 起）。
# 整合须知：cast/ties.toml 里 theodoros_tommaso 目前写 lovers、since 1558-12-31，早于本线 together 章（1560-01-15—02-28）；
#       整合时 lovers 的 since 应改到 1560-02-28 之后，此前可写 crush（1558-06 起）。
# 口头禅各用一次：西奥多“血统若有用，也得先替人挡一剑”（choice）；托马索“这一句是台词，下一句才是真的”（together 基础文本，helped 变体换说法）；别处换说法。
# 秘密：cast 没有写明的秘密，本线不另编。托马索与阿尔维塞的旧识归 tie_tommaso_alvise，本文件不写。

