[[tracks.chapters.choices]]
key = "fund"
text = "掏钱交给三一会的修士，记在他的赎金上"
next = "done"
requires = [{ kind = "cash", ge = 800 }]
hint = "你这点钱，在他的赎价面前像一枚铜子。"
effects = [{ kind = "cash", value = -800 }, { kind = "affinity", person = "miguel_de_cervantes", value = 5 }, { kind = "affinity", person = "fray_juan", value = 4 }, { kind = "flag", flag = "c13_npc_tariq_cervantes_helped" }]
reply = "修士在名册上那一行旁边记下了你的船名，又拿笔圈了一圈，说这个名字他念了就不忘。塞万提斯托塔里克带话，说欠你一个故事，出去以后写，写成了先寄给你。"
news = "阿尔及尔的人说：三一会的修士在名册上多记了一个外乡船长的名字，说是替城东花园里那个西班牙人凑的赎金。"

[[tracks.chapters.choices]]
key = "listen"
text = "不掺和，只坐下来听他讲完一个故事"
next = "done"
effects = [{ kind = "affinity", person = "miguel_de_cervantes", value = 3 }, { kind = "affinity", person = "tariq", value = 1 }]
reply = "他讲的是一个骑着瘦马的乡绅，马怎么瘦的，乡绅怎么不肯服老。讲到一半看守来了，他说剩下的下回讲。塔里克靠在墙上听了前半截，笑着摇头，说这人讲故事比打仗还难缠。"
news = "阿尔及尔的人说：俘虏院后墙那晚有人讲故事，讲得看守都忘了换岗，讲到一半就断了。"

# 交汇旁轨六：请他上船。普通章；限期 1590-06-30，超时静默失败。
