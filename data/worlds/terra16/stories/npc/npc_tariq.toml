[[tracks.chapters.choices]]
key = "invite"
text = "请他上船，做你的航海士"
next = "done"
requires = [{ kind = "affinity", person = "tariq", ge = 60 }]
hint = "他的船长们还离不开他。"
effects = [{ kind = "join", person = "tariq" }, { kind = "flag", flag = "c13_npc_tariq_mate" }]
reply = "他把“鸥”交给大副，只带了琴、一把弯刀和一个小布包。上了你的船，第一件事是去看桨手吃什么，看完才肯把布包打开，里面是一沓旧信和一把旧钥匙。他说：“你的桨手要是饿着，我先拿琴砸你。”"
news = "阿尔及尔的人说：那个弹琴的老海盗把“鸥”交给了大副，自己背着琴上了一条外乡人的船。"

[[tracks.chapters.choices]]
key = "drink"
text = "不勉强，请他喝一杯，听他把这支曲子再弹一遍"
next = "done"
effects = [{ kind = "affinity", person = "tariq", value = 3 }]
reply = "第二遍弹得比第一遍慢，几个音停得很久，像在等谁接下去。弹完他拍了拍弦：“熟面孔，今晚的酒是你请的，曲子是我的。”他说哪天真想走了，会先来找你，不会一声不响地把“鸥”开走。"
news = "阿尔及尔的码头上，有人看见那个弹琴的老海盗在一条外乡船的船头，把同一支曲子弹了两遍。"

