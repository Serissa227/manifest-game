[[tracks.chapters]]
key = "m01_join"
title = "请他上船"
text = "黄昏，“鸥”的船头。塔里克鬓角有了白，琴弦是新换的。他说船长团的人越来越像商人，西班牙的巡逻船越来越像海盗，他在中间夹了快三十年，有点闷。码头上的孩子在缆桩下面抢一只螃蟹，没人去管。你开口问他要不要换一条船。他没马上答，先把一支曲子弹完，手指停在最后一根弦上，才抬起头。“上你的船？那我的规矩也跟着上。只劫货——不，算了，你的船不劫。”他把琴靠在缆桩上：“歌唱到最后一句，人就到了门口。我祖母说的。”"
at = "algiers"
cast = ["tariq"]
speaker = "tariq"
mood = "tender"
when = [{ kind = "date", from = [1580, 1, 1] }, { kind = "affinity", person = "tariq", ge = 50 }, { kind = "flag", flag = "c13_npc_tariq_mate", value = false }]
deadline = [1590, 6, 30]

