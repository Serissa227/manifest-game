# C7 重写（2026-10-11，Claude Opus）：配角线 tie_ismene_silver_branch「学生也会问老师」，替换被退回的 GPT 稿。故事 2.0（DECISIONS“第九批 A5 / E37 开工：故事 2.0 TOML 契约”）。
# 标签：GL 人物之间的师徒线（mentor），不是恋爱线。伊斯梅妮不开放恋爱；带银枝的女人生年不明（C11 定义），全线没有任何恋爱效果。
# 人物：伊斯梅妮 ismene（1564-06-14 生，女，亚特兰蒂斯波塞冬神庙守山铜柱的“克莱托”里最年轻的一位；本线 1583—1586，十八九岁到二十一岁）；
#   带银枝的女人 silver_branch_woman（女，女人之国的精灵，生年不明，由 C11 定义；不说名字、不碰铁、话极少，常以一句歌或一个反问代替回答）。
# 依据（古典文献）：柏拉图《克里提亚斯篇》119c—120d——刻着律法与誓词的山铜柱、十王捕牛“不用铁器，只用木棍与绳套”、在柱前献牛起誓；
#   《布兰航海记》——带开白花银枝的女子唱西方大洋里的“三倍五十座岛”（只取这一句的意思，自行转述）。
#   精灵不说名字、不碰铁、七岛作客不过三夜（TERRA16 §6.6、§8.6）；外港与七岛的地貌照 ports_realm.toml。
# 依据（本世界线 / 原创）：1583 年十王会议（TERRA16 §8.5）。柱上第七行少一个字、会上跳过的那一句、那页问题、1585 年外港三个月的雾、
#   问笺与花瓣、改过的迎客律文、神庙扫地的老婆婆，都是原创。无史实待核项。
# 缺省走向（玩家不在场也照样发生）：1583—84 会议散后，那页问题压在柱脚的石板下（mentor）→ 1585 春柱前读律文，老师把伊斯梅妮的口头禅还给她（回忆）→
#   1585 夏外港三个月的雾，老师一次没来，伊斯梅妮写了问笺（传闻）→ 1585 秋问笺压在柱脚，老师来看一眼、唱一句就走 →
#   1586 春老师来听改过的迎客律文，学生反问，老师笑了，留下一朵白花（mentor、回忆、落点旗标）。
# 玩家能做的：choice 章替她把问笺送到七岛的白船（helped），或劝她自己去一趟（went）；两条与缺省都走到同一个落点，差别在回复、好感与旗标。
# 旗标：写 c7_tie_ismene_silver_branch_helped、c7_tie_ismene_silver_branch_went、c7_tie_ismene_silver_branch_landing；
#   读 atlantis_council_met（第一章 when：玩家参加过十王会议）。
# 秘密：带银枝的女人的往事，本线一律不提；见闻只说外港看得见的事。
# 整合：silver_branch_woman 由 C11 定义，定义以前本文件不登记。第一章窗口到 1584-12-31 为止：玩家没参加十王会议时本线静默失败。不改日程。

[[tracks]]
