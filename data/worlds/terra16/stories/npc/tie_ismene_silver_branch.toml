# ── 落点（witness）：学生反问，老师笑了 ──
[[tracks.chapters]]
key = "tie_ismene_silver_branch_landing"
title = "还可以反问"
text = "开春时雾薄了，带银枝的女人从七岛过来，手里只有那根银枝。伊斯梅妮站在铜柱前，把改过的迎客律文念给她听：“外海来的船，先问来意，给水，给面包；誓词念给船上的人听，念完了，再问是哪位王的客。”念完，女人只问了一句：“听不懂的呢？”伊斯梅妮没答。她从柱脚的石板底下抽出那页旧纸，翻到页尾，指着自己抄下的那句歌：“您唱‘三倍五十座岛’给我的时候，知道我听不懂吗？”女人笑了。在神庙扫了四十年地的老婆婆后来说，她头一回见这女人笑。银枝上的白花一阵轻响，女人摘下最小的一朵，放在柱脚下：“这一课，换你来问。”"
stage = "witness"
window = [[1586, 1, 1], [1586, 5, 31]]
at = "atlantis_port"
