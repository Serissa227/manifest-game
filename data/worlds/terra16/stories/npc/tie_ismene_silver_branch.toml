# ── 相识（witness）：一页没回答的问题，一句外海的歌 ──
[[tracks.chapters]]
key = "tie_ismene_silver_branch_meeting"
title = "没回答的一课"
text = "十王的会议散了，柱前献牛的石槽也刷干净了。伊斯梅妮坐在铜柱下的石台上，膝头摊着一页纸，正反两面写满，页边也挤着小字。“这几年问她、她没答的，都在这儿。”她一行行点给我看：柱上第七行为什么少一个字；外海新来的人，该不该先听完誓词再上岸。最上面一行划掉了，我凑近才认出是“您叫什么”。带银枝的女人从柱子后面出来，雾跟着她，脸看不清，只觉得亮，比正午的太阳还亮。她接过那页纸，从头看到尾，还给伊斯梅妮，唱了一句：“西边的大海上，有三倍五十座岛。”唱完就走了。伊斯梅妮把这一句也抄在页尾，转头问我：“你听懂了吗？”我摇头。她咬着笔杆看了半天：“我也没有。”她把纸叠好，压进石台边一块松动的石板底下。"
stage = "witness"
window = [[1583, 6, 1], [1584, 12, 31]]
at = "atlantis_port"
cast = ["ismene", "silver_branch_woman"]
speaker = "ismene"
mood = "mystic"
news = "亚特兰蒂斯外港的人说，十王的会议一散，守铜柱的小祭司就把一页写满问题的纸压在了柱脚的石板底下，神庙扫地的都绕着走。"
when = [{ kind = "flag", flag = "atlantis_council_met" }]

[tracks.chapters.default]
next = "tie_ismene_silver_branch_closer"
effects = [{ kind = "tie", a = "silver_branch_woman", b = "ismene", relation = "mentor" }]

# ── 靠近（witness）：会上跳过的那一句，老师还回来的口头禅 ──
[[tracks.chapters]]
key = "tie_ismene_silver_branch_closer"
title = "会议后的柱子"
text = "这年开春，伊斯梅妮又从柱上第一行读起。她念一个字，指头隔着一指宽往下挪一个字，从不贴到铭文上。念到捕牛那一段，她停住了：“‘十王捕牛，不用铁器。’下一句，会上的人一口气跳过去了。”带银枝的女人站在她身后。她进神庙从不带铁，连挽头发的簪子都是骨头削的。她看着那一行看了很久，头一回开口说话，没有唱：“你读得比我当年听到的慢。”伊斯梅妮回过头：“慢，是好还是不好？”她的指头已经朝跳过去的那一句伸了过去。女人看着那根指头，把她平日拦外人的那句话原样还给了她：“把誓词读完，再碰那根柱子。”伊斯梅妮缩回手，转回柱子前，从会上跳过的那一句接着往下念。"
stage = "witness"
window = [[1585, 1, 1], [1585, 4, 30]]
at = "atlantis_port"
cast = ["ismene", "silver_branch_woman"]
speaker = "silver_branch_woman"
mood = "mystic"
news = "亚特兰蒂斯神庙扫地的老婆婆说，守铜柱的小祭司在柱子前头一句一句地念律文，拿花枝的那个女人在她身后站着听，一直站到天黑，灯都没点。"

[tracks.chapters.default]
next = "tie_ismene_silver_branch_turning"
effects = [{ kind = "memory", memory = "mem-tie_ismene_silver_branch-closer", title = "会议后的柱子" }]

# ── 转折（rumor）：三个月的雾，拿花枝的女人一次没来 ──
[[tracks.chapters]]
key = "tie_ismene_silver_branch_turning"
title = "雾里不来的人"
text = "外港的雾从五月起就没散过，桅杆顶都看不见，渔船进出要一路摇铃。码头上的人说，那个拿花枝的女人一回也没来。“七岛的人就这样，”补网的老头说，“来的时候不打招呼，走的时候也不打。”有人说夜里在雾里听见过唱歌，从西边飘过来，就一句，翻来覆去：“……三倍五十座岛……”守铜柱的小祭司天天傍晚下到码头，在系缆的石桩边站一会儿，朝西看。有人问她等谁，她先反问人家来码头做什么；人家答了，她自己的却不说。站够了，她就回神庙，接着读她的柱子。七月底，看灯的人见她在码头边借了张桌子，写了一张问笺，折成窄窄一条，揣进袖子里：“雾一散，托第一条往西去的船。”"
stage = "rumor"
window = [[1585, 5, 1], [1585, 7, 31]]
at = "atlantis_port"
cast = ["ismene", "silver_branch_woman"]
mood = "sad"
news = "亚特兰蒂斯外港起了三个月的雾，拿花枝的那个女人一次也没来过；守铜柱的小祭司倒是天天傍晚到码头的石桩边站一会儿。"

[tracks.chapters.default]
next = "tie_ismene_silver_branch_choice"
effects = []

# ── 插手（involve）：问笺交到“我”手里 ──
[[tracks.chapters]]
key = "tie_ismene_silver_branch_choice"
title = "把问题带回去"
text = "雾在西边裂开了一角，七岛那边停着一条白船，没有桨手，也不挂帆，船头有一点亮，像有人举着一根开花的枝子。伊斯梅妮把问笺交到我手里，还是那窄窄的一条，没有封蜡：“不用封，她看得见。”她怕我不肯接，先把问的事说了：外海来的船一年比一年多，迎客那一段还是祖辈刻下的老话，该先叫船上的人听誓词，还是先给水给面包。第二条她念得很轻——守柱的人，能不能不同意自己的老师。“我想听她怎么答，”她把手缩回袖子里，“可港口的事得我来定。”码头上的老水手提醒我：七岛不许带铁上岸，刀、钉子、锚链，都得留在船上。"
stage = "involve"
window = [[1585, 8, 1], [1585, 11, 30]]
at = "atlantis_port"
cast = ["ismene", "silver_branch_woman"]
speaker = "ismene"
mood = "tender"
news = "亚特兰蒂斯外港守铜柱的小祭司写了一张问笺，托一个外来的船长送进雾里的七岛，回来时纸里多夹了一片白花瓣。"

