# 靠近：1561 年春夏，晾在胡椒袋上的订货纸。损失算得一文不差，字条第一句问病。
[[tracks.chapters]]
key = "pair_nyai_gama_huang_shouguan_closer"
title = "晾开的订货纸"
text = "黄寿官又误了约，舱底进水，一摞订货纸泡得发软。奈·加玛把它们一张张揭开，摊在胡椒袋上晾，边晾边念数：“这张十二担，这张二十担。湿的是船东的纸，赔的也是船东的钱，我不替他吞。”黄寿官说：“认。风向我算准了，舱板漏水我没算到。”他接过了损失单。单子底下压着一张折小的纸条，他回到船上才拆开，头一行是：“病好了没有？”下面写着：听别家船上说，你冬天在汤都躺了二十来天，病了也该捎个话，我又不会为这个扣你的货。他把纸条折回去，夹进账本里船期的那一栏。"
stage = "witness"
window = [[1561, 4, 1], [1561, 6, 30]]
at = "banten_port"
cast = ["nyai_gama", "huang_shouguan"]
speaker = "huang_shouguan"
mood = "tender"
news = "万丹码头上晾了一地受潮的订货纸，胡椒商家的女儿一张张算账，一分损失也不替吕宋来的船主担。"

