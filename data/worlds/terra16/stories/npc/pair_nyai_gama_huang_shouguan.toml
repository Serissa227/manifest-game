# 迟到一个月（pair_nyai_gama_huang_shouguan）——配角线，标签 GB；原创人物，恋爱线（圆满，1572 年成为伴侣）。
# 人物：奈·加玛（nyai_gama，1540-03-20 生），吉里学院凯奇利的同窗，万丹胡椒商家的女儿，1557 起自己在万丹做胡椒生意；干脆，先定价、先定船期。
#       黄寿官（huang_shouguan，1538-04-19 生），吕宋的福建商人，1557—1570 在汤都、1571 起在马尼拉；和气老实，永远在算风向，船期记在货价前头。
#       奈·加玛的羁绊线 bond_nyai_gama 是友情线，不设 taken 旗标，本线没有 side 轨道；两人成年后的故事不依赖主角。
#       年龄核对：meeting 1559 年春，她 18—19、他 20—21；closer 1561 年（crush），她 21、他 22—23；choice 1571 年底，她 31、他 33；
#       landing 1572 年（partners），她 32、他 33—34；生年差 2 年，窗口均不早于 1558-03-20（她满 18），也不早于 1557-01-01。
# 依据（史实）：万丹是爪哇西部的胡椒港，港里有华人聚居的街，福建商人年年来贩胡椒；1571 年 6 月西班牙人在吕宋的马尼拉建城，
#       汤都一带的福建商人改往马尼拉，往万丹的船相应变得不稳。
# 原创：两人的相识与婚约、半仓胡椒、泡湿的订货纸与病好了没有的字条、画了圈的船期、一个字的回信。
# 待核：十六世纪万丹胡椒码头上称重与交货的行规（正文只写“一担”“半仓”这样的说法）；闽南商船的舱位凭条在当时的叫法（正文用“凭条”）。
# 缺省走向：相识（她把迟到一个月的船晾在一边，先请他吃饭）→ 泡湿的订货纸（crush）→ 马尼拉建城的传闻 → 她当着主角写信，
#       问他愿不愿成家、日子她定、迟到了怎么传话；无人插手时她把信托给路过的船，他回信说一定到 →
#       1572 年成亲的日子他照旧晚了一个月，她把日子往后挪，两人成为伴侣（圆满，此后他每年来一次）。
#   帮助：在马尼拉替他订下船期改不了的舱位（_helped）→ 落点变体：他只晚了三天，是风晚了，船没晚。
#   撮合：替她把信先送到马尼拉（_matched）→ 记一段只有一个字的回信，落点文字不变。
#   旁观：只多一点好感。
# 共享旗标：写 c7_pair_nyai_gama_huang_shouguan_together、_helped、_matched；不读外部旗标。
# 口头禅：奈·加玛“下回哪天到港，先说清。”在 meeting 用一次，其他章换说法；黄寿官“这回准时，先让我把风向算清。”在 together 用一次（他照旧晚了）。
# 秘密：cast 没有为本线写明的秘密，不另编。奈·加玛没寄出的买船信归 bond_nyai_gama，本线不写。
# 与别处的分工：奈·加玛与瓦蒂的班顿对歌归 tie_wati_nyai，与凯奇利的友情归 bond_nyai_gama，本线不写。
# 日程（整合方）：不改日程。他在吕宋（1571 起马尼拉），她在万丹；每年他来一次，章节 at 都是 banten_port（rumor 在 manila），在场由章节判断。

