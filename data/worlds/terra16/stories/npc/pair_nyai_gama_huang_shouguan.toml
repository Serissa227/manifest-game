# 落点（恋爱，缺省即圆满）：1572 年春夏，成亲的日子。他照旧晚到，口信先到；两本账并成一本。
[[tracks.chapters]]
key = "pair_nyai_gama_huang_shouguan_together"
title = "等的人来了"
text = "成亲的日子到了，黄寿官没到。奈·加玛照旧开铺、称胡椒，账本上只写了一行：待。他的口信倒是三天前到的，一条小船捎来五个字：“晚，约一个月。”一个月后，他的船进港，船还没靠稳，他就在船头喊：“这回准时——先让我把风向算清！”码头上的人笑成一片。她没笑，翻开账本，把定好的日子往后挪了一个月，旁边写上口信到的那天。当晚，两本账并成了一本。从此他年年晚到一个月，她年年多等一个月。"
