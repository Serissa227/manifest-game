# 相识：1559 年春，万丹的胡椒码头。半仓胡椒、一碗饭、一文不让的价。
[[tracks.chapters]]
key = "pair_nyai_gama_huang_shouguan_meeting"
title = "晚到的一个月"
text = "黄寿官的船晚了一个月才靠万丹，说好留给他的半仓胡椒，头天夜里已经装上了别人的船。他站在栈桥上，一肚子风向还没来得及开口，奈·加玛先端来一碗饭，上面盖着煎小鱼：“吃。”他蹲在胡椒袋边上吃完，才被叫进账房。价钱她报了一遍，一文没让。他刚说起那几天的逆风，她把算盘往旁边一推：“风的事我不懂。下回哪天到港，先说清。”黄寿官攥着空碗，没想出一句能回的话。"
stage = "witness"
window = [[1559, 3, 1], [1559, 5, 31]]
at = "banten_port"
cast = ["nyai_gama", "huang_shouguan"]
speaker = "nyai_gama"
mood = "cheerful"
news = "万丹码头上，胡椒商家的女儿把迟了一个月的吕宋船晾在一边，半仓货早卖了别家，倒先请船主吃了碗饭才谈价。"

