# 抉择：1571 年底，万丹账房。她先问愿不愿成家，日子她定，迟到怎么传话要写在前头。
[[tracks.chapters]]
key = "pair_nyai_gama_huang_shouguan_choice"
title = "她先定日子"
text = "这十年，奈·加玛自己置了两条船，价钱、船期、交货的日子，都是她一个人说了算。这天她把我叫进账房：“马尼拉到万丹，哪条船的开船日子改不了，你替我打听。”话没说完，她已经铺开信纸写起来：愿不愿成家？愿意，日子由我定。迟到可以，迟到了拿什么传话，成亲前先写明白，不许再有一个月不见人。她吹干墨，把信折好：“送信的人，我还没找。”"
stage = "involve"
window = [[1571, 10, 1], [1571, 12, 31]]
at = "banten_port"
cast = ["nyai_gama", "huang_shouguan"]
speaker = "nyai_gama"
mood = "tense"
news = "万丹的胡椒女商给马尼拉写了封信，听说是定成亲的日子，连迟到了怎么通知都写清楚了。"

