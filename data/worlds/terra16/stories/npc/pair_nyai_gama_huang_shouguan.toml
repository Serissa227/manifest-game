# 转折（传闻）：1571 年夏秋，马尼拉建城，汤都的福建商人搬家。
[[tracks.chapters]]
key = "pair_nyai_gama_huang_shouguan_turning"
title = "马尼拉的新城"
text = "码头上传开了：西班牙人在马尼拉筑起了城，汤都的福建商人成帮往城里搬，铺子、船、账房都换了地方。听说有个年年去万丹贩胡椒的船主也搬了，搬家那天别的东西都装了车，万丹的订货册子却揣在怀里，一路没松手。今年去万丹的船，怕是又要晚。万丹那头，胡椒商家的女儿这十年自己置了船、自己定价，人人问她几时出嫁，她只答一句：先看船期。"
stage = "rumor"
window = [[1571, 6, 15], [1571, 9, 30]]
at = "manila"
cast = ["nyai_gama", "huang_shouguan"]
mood = "tense"
news = "西班牙人在马尼拉建了城，汤都的福建商人都往那边搬；有个年年去万丹的船主今年怕是又要晚了。"

