# 金商巴拉卡：NPC 线（故事 2.0，A5 / E37 契约）
# 标签：巴拉卡不是玩家时跑的线。玩家是任何主角或自创船长，正文只写“你”，不写玩家的性别与外貌。
# 人物：巴拉卡·宾·萨利姆（baraka），基尔瓦金商萨利姆的儿子，1540 年前后生，家乡港基尔瓦（kilwa）；母亲娘家在蒙巴萨。
# 人物日程：1557—1568 基尔瓦（kilwa）；1569—1578 索法拉（sofala）；1579—1590 蒙巴萨（mombasa）。
# 轨道：npc_baraka（request，脊轨，auto）：s00_gate 门槛（1557 春）→ s01_sofala（1561 春夏）→ s02_barreto（1573 夏秋）→ s03_kilwa（1587 夏）→ s04_mombasa（1589 收尾）。
#       交汇旁轨（auto = false，由脊轨 default 开启）：npc_baraka_caravan（金市的布，1 章）、npc_baraka_rubbing（门上的字，1 章）、
#       npc_baraka_league（替他捎一句话，1 章）、npc_baraka_yasuke（往东的信，2 章）、npc_baraka_join（上船讲故事，1 章）、npc_baraka_zimba（城门与潮水，1 章）。
#       共 12 章：脊轨 5 章、旁轨 7 章。
# 依据：
#   史实（只从人物嘴里、告示与物件上透出）：1561 年葡萄牙耶稣会士西尔韦拉在穆塔帕王廷被杀，石堡的官员追查城里的摩尔商人；
#         1573 年巴雷托死在塞纳，远征散了；1587—89 年津巴人与葡萄牙人、米尔·阿里之间的蒙巴萨与基尔瓦战事（H59，缺省结果：葡萄牙人留在海岸）；
#         1579 年范礼安带非洲随从到日本，此人后名弥助，随织田信长（史实）。
#   原创：巴拉卡的黄铜砝码箱与母亲的铜币、母亲娘家的院子与井、基尔瓦的布船、诸城的同盟与盟誓、所有交汇旁轨的情节与台词。
#   待核（正文一律传闻或人物嘴里的口吻）：津巴人屠基尔瓦的年份；巴雷托远征散去的确切月份。
# 旗标：设 c13_npc_baraka（s00 default）、c13_npc_baraka_mate（join 请上船；之后各旁轨因门槛静默结束）、c13_npc_baraka_league_helped（league 说服或担保）、
#       c13_npc_baraka_zimba_helped（zimba 装船、守街口或借钱，检定失败不设）、c13_half_solomon_gate（rubbing 的两个选项）、c13_mark_solomon（rubbing 合成印记）。
#       读：c12_voyage_baraka、upbringing_graduated；c13_half_solomon_bottle（纳吉玛组：main_najma b05_bottle_seal / npc_najma_seal）；
#       c13_main_mio（yasuke 排除玩家是澪）；c13_main_najma（zimba 排除玩家是纳吉玛）；c13_main_mio_yasuke_letter（s04 变体 v3，玩家是澪时）；
#       h59_mir_ali_coast_coastal_autonomy（s04 变体 v2，C10 占位）。
# 等待的包：A9（s00 门槛加“当前主角不是 baraka”；若引擎接管开轨道，auto 改 false）；C10（h59_mir_ali_coast_coastal_autonomy 换成实际 key，不做就删 v2）；
#       纳吉玛组（c13_half_solomon_bottle 的来源）；整合（take_copy 与 join_now 会开或合成印记，main_baraka_solomon 在 stories/main/main_baraka.toml，两个文件一起登记）。
# 秘密：马库阿男孩就是弥助。只在 y1 由巴拉卡自己讲出，见闻与脊轨里永远不写。
# 回忆插画：无（本线不发回忆）。
# 禁区：不写恋爱（不用 heart / relation / tie / bond）；不写血腥（西尔韦拉之死、塞纳的处决、基尔瓦被屠只写结果）；
#       圣物只看只拓；见闻不泄露秘密；口头禅“Haba na haba”留给主线，本线不用。

[[tracks]]
key = "npc_baraka"
name = "金商巴拉卡"
kind = "request"
start = "s00_gate"
auto = true
cast = ["baraka"]

# 1557 春 · 门槛见闻：基尔瓦码头的布商闲话。
[[tracks.chapters]]
key = "s00_gate"
title = "萨利姆的儿子"
text = "基尔瓦的码头上，金商萨利姆家的儿子又回来了，从开罗带回一肚子的故事。他找的是货舱够宽的船，要替家里的布去索法拉的金市，运费照付。他爹当年在这码头卖一匹布能讲半个时辰，布商们说，儿子比老子还能讲。“那小子说，运费照付，故事白送——可他的故事比运费还长。”"
stage = "rumor"
window = [[1557, 3, 2], [1557, 3, 9]]
at = "kilwa"
cast = ["baraka"]
mood = "cheerful"
when = [{ kind = "flag", flag = "c12_voyage_baraka", value = false }, { kind = "flag", flag = "upbringing_graduated" }]
news = "基尔瓦码头上说，萨利姆的儿子从开罗回来了，正找一条肯替他把布运去索法拉的船。"

[tracks.chapters.default]
next = "s01_sofala"
effects = [{ kind = "flag", flag = "c13_npc_baraka" }, { kind = "start_track", track = "npc_baraka_caravan" }]

# 1561 春夏 · 索法拉的街谈：神父死在内陆，石堡要抓摩尔商人，萨利姆的儿子连夜把人运走。
[[tracks.chapters]]
key = "s01_sofala"
title = "索法拉的货舱"
text = "索法拉的人说，那个从海上来的神父死在了内陆的王廷，说是被当成了施法的巫师。石堡的长官要抓城里的摩尔商人抵罪，码头上关了三天门。萨利姆的儿子把三家人藏进了他爹的货舱，埋在象牙堆里，两夜不敢点灯，第三夜开船往北走了。石堡的门房说：“长官去抓人那天，码头上只剩一条基尔瓦的船，吃水深得出奇。”"
stage = "rumor"
window = [[1561, 4, 15], [1561, 9, 30]]
at = "sofala"
cast = ["baraka"]
mood = "sad"
news = "索法拉的人说，神父死后石堡要抓摩尔商人，萨利姆的儿子把三家人藏进货舱，连夜开船往北走了。"

[tracks.chapters.default]
next = "s02_barreto"
effects = []

# 1573 夏秋 · 莫桑比克岛：巴雷托死了，当年不肯给他带路的金商正要进内陆。
[[tracks.chapters]]
key = "s02_barreto"
title = "不带路的金商"
text = "莫桑比克岛上的人说，巴雷托死在了塞纳，远征散了，船上的人四下走散。当年巴雷托要一个基尔瓦金商给他带路去找金矿，那人不肯，说金商不给兵带路。如今那个金商住到了索法拉，听说正要跟商队进内陆，去看石头砌的房子。岛上的水手说：“巴雷托到死都记着那个不肯带路的基尔瓦人，说他砍价砍到牛都饿瘦了。”"
stage = "rumor"
window = [[1573, 6, 1], [1573, 12, 31]]
at = "mozambique_island"
cast = ["baraka", "francisco_barreto"]
mood = "tense"
news = "莫桑比克岛上的人说，巴雷托死在了塞纳；当年不肯给他带路的基尔瓦金商，正要进内陆去看石头房子。"

[tracks.chapters.default]
next = "s03_kilwa"
effects = [{ kind = "start_track", track = "npc_baraka_rubbing" }, { kind = "start_track", track = "npc_baraka_league" }, { kind = "start_track", track = "npc_baraka_yasuke" }, { kind = "start_track", track = "npc_baraka_join" }]

# 1587 夏 · 基尔瓦：津巴人趁退潮过了浅滩，金商的儿子把岸上的人一船一船运走。
[[tracks.chapters]]
key = "s03_kilwa"
title = "基尔瓦以后"
text = "基尔瓦的人说，津巴人是趁退潮从浅滩过来的，带路的是城里的人。萨利姆的儿子带着几条缝板船赶下来，把岸上剩下的人一船一船往北运。他在船头讲了一路笑话。没人笑，他也没停。渔夫说：“他讲了一路笑话。没人笑，他也没停。”"
stage = "rumor"
window = [[1587, 5, 1], [1587, 10, 31]]
at = "kilwa"
cast = ["baraka"]
mood = "sad"
news = "基尔瓦的人说，津巴人是趁退潮从浅滩过来的；萨利姆的儿子带着船赶来，把岸上剩下的人一船一船运走了。"

[tracks.chapters.default]
next = "s04_mombasa"
effects = [{ kind = "start_track", track = "npc_baraka_zimba" }]

[[tracks.chapters.variants]]
key = "v1_mate"
when = [{ kind = "flag", flag = "c13_npc_baraka_mate" }]
text = "基尔瓦的人说，津巴人是趁退潮从浅滩过来的，带路的是城里的人。那时金商萨利姆的儿子在你的船上。是你的船把他送到基尔瓦外海的，他下船以前，把黄铜砝码箱交给你保管，说这是他身上唯一不怕水的东西。岸上的人一船一船被运走。渔夫后来说：“他讲了一路笑话。没人笑，他也没停。”"

[[tracks.chapters.variants]]
key = "v2_league_helped"
when = [{ kind = "flag", flag = "c13_npc_baraka_league_helped" }]
text = "基尔瓦的人说，津巴人是趁退潮从浅滩过来的，带路的是城里的人。萨利姆的儿子带着几条缝板船赶下来，把岸上剩下的人一船一船往北运。马林迪的船也来了，他说是因为当年有人替他去马林迪说过一句话。渔夫说：“那一夜他讲的笑话，马林迪的船上也有人笑了。”"

# 1589 夏以后 · 蒙巴萨：收尾。他在母亲娘家的院子里写自己的书。
[[tracks.chapters]]
key = "s04_mombasa"
title = "蒙巴萨的院子"
text = "蒙巴萨的人说，津巴人和葡萄牙人一前一后走了。葡萄牙人在岸上量地，说要筑石堡。那个基尔瓦金商住在他母亲娘家的院子里，院墙塌了一截，井还在。他得空就坐在井边写一本书，写的是诸城自己的事。隔壁的女人说：“他写一页念一页，念到好笑的地方自己先笑。”"
stage = "rumor"
window = [[1589, 6, 1], [1589, 12, 31]]
at = "mombasa"
cast = ["baraka"]
mood = "tender"
news = "蒙巴萨的人说，津巴人和葡萄牙人一前一后走了，岸上的人还在谈那个写书的基尔瓦金商。"

[tracks.chapters.default]
next = "done"
effects = []

[[tracks.chapters.variants]]
key = "v1_mate"
when = [{ kind = "flag", flag = "c13_npc_baraka_mate" }]
text = "蒙巴萨的人说，津巴人和葡萄牙人一前一后走了，葡萄牙人在岸上量地，说要筑石堡。那个基尔瓦金商却不在蒙巴萨。他在你的船上，给水手们讲诸城的故事，讲到一半就伸手要钱。码头上的人说：“这种人我们蒙巴萨没见过。”"

[[tracks.chapters.variants]]
key = "v2_free"
when = [{ kind = "flag", flag = "h59_mir_ali_coast_coastal_autonomy" }]
text = "蒙巴萨的人说，葡萄牙人的旗从城堡上降下来了，没人量地，也没人说要筑堡。津巴人走了，岸上的人家又开了门。那个基尔瓦金商住在他母亲娘家的院子里，院墙塌了一截，井还在。他得空就坐在井边写一本书，写的是诸城自己的事。隔壁的女人说：“他写一页念一页，念到好笑的地方自己先笑。”"

[[tracks.chapters.variants]]
key = "v3_mio_letter"
when = [{ kind = "flag", flag = "c13_main_mio_yasuke_letter" }]
text = "蒙巴萨的井边，那个基尔瓦金商得空就写他的书。第一页夹着一封日本来的信，是你当年在堺收下、托往西去的船捎来的。隔壁的女人说：“他请神父念了三遍，念完把信压在石头底下，一句话也不说。”那本书的后半本，一个字也没有。"

[[tracks.chapters.variants]]
key = "v4_helped"
when = [{ kind = "flag", flag = "c13_npc_baraka_zimba_helped" }]
text = "蒙巴萨的人说，津巴人和葡萄牙人一前一后走了，葡萄牙人在岸上量地，说要筑石堡。那个基尔瓦金商住在他母亲娘家的院子里，院墙塌了一截，井还在。他得空就坐在井边写一本书，写的是诸城自己的事。他逢人就说，那一夜是一条外来的船把他母亲那条街上的人运走的。隔壁的女人说：“他写一页念一页，念到好笑的地方自己先笑。”"

