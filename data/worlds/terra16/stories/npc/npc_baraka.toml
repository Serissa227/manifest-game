[[tracks]]
key = "npc_baraka_league"
name = "替他捎一句话"
kind = "request"
start = "c1"
auto = false
cast = ["baraka"]

[[tracks.chapters]]
key = "c1"
title = "去马林迪说一句话"
text = "马林迪的苏丹府，白墙，院子里晒着葡萄牙人送的一面旗。巴拉卡托你捎来一封信，信里画了五枚砝码，一城一枚，还有一句话：“请马林迪来吃一顿饭。饭钱我出，话你们说。”打仗的事，饭桌上不谈。苏丹的书记读完信，抬头看你：“蒙巴萨的人也去吗？”他等你替那个金商把话说完。"
at = "malindi"
cast = ["baraka"]
mood = "cheerful"
when = [{ kind = "date", from = [1575, 7, 1] }, { kind = "flag", flag = "c13_npc_baraka_mate", value = false }]
deadline = [1577, 9, 30]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "persuade"
text = "替他把话说圆：饭桌上不谈打仗"
next = "done"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "done", effects = [{ kind = "affinity", person = "baraka", value = 2 }], news = "马林迪的书记收下了基尔瓦人的信，说苏丹会想一想。城里人都知道，那是马林迪说“不”的法子。" }
effects = [{ kind = "flag", flag = "c13_npc_baraka_league_helped" }, { kind = "affinity", person = "baraka", value = 6 }, { kind = "reputation", faction = "swahili_cities", value = 2 }]
reply = "书记笑了，说马林迪去，坐在离蒙巴萨最远的那一头。"

[[tracks.chapters.choices]]
key = "vouch"
text = "以葡萄牙人朋友的身份担保：这顿饭不碍事"
next = "done"
requires = [{ kind = "reputation", faction = "portugal", ge = 10 }]
effects = [{ kind = "flag", flag = "c13_npc_baraka_league_helped" }, { kind = "affinity", person = "baraka", value = 4 }]
reply = "书记看了看院子里那面旗，又看了看你，说有葡萄牙人的朋友作保，马林迪就放心吃这顿饭了。"
hint = "马林迪的书记不认得你，也不认得你的朋友。"

[[tracks.chapters.choices]]
