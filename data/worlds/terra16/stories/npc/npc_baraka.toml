# 1574 起 · 门上的字：拓纸只拓不卖，两半齐了才合成。
[[tracks]]
key = "npc_baraka_rubbing"
name = "门上的字"
kind = "request"
start = "c1"
auto = false
cast = ["baraka"]

[[tracks.chapters]]
key = "c1"
title = "他留着的拓纸"
text = "索法拉，巴拉卡从内陆回来，砝码箱的夹层里多了一卷拓纸：大津巴布韦门楣上那行刻痕，葡萄牙人的史书说连有学问的摩尔商人也读不懂。他把拓纸摊在你面前，说那不像字，像一枚戒指按出来的半个印。另一半，他听尤尔法的一个领航女说过，在一只渔网里捞上来的铜瓶上。“葡萄牙人出了个好价钱。我说，你们找的是金子，这上面只有一道门。”他把卷子往你这边推了推：“另一半在尤尔法那个领航女手里——她跟我吵了一辈子，你去要，她说不定肯给。”他又说：“我拓了两份。一份留着，一份给肯把它带去凑齐的人。”"
