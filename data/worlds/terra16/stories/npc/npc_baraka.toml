# 1584 起 · 蒙巴萨的院子：情谊够，他就想在你的船上写完那半本书。
[[tracks]]
key = "npc_baraka_join"
name = "请他上船"
kind = "request"
start = "c1"
auto = false
cast = ["baraka"]

[[tracks.chapters]]
key = "c1"
title = "上船讲故事"
text = "蒙巴萨，巴拉卡母亲娘家的院子，井边摆着他的史书和黄铜砝码箱。他听说你要出远海，就问你船上缺不缺一个会算账、会讲故事、会称金子的人。“三样都会的，这条海岸只剩一个。”他说这话的时候，手里正数着砝码，数到最小那枚，停住了。“我的书写到一半了。剩下一半，我想在你的船上写。”"
at = "mombasa"
speaker = "baraka"
cast = ["baraka"]
mood = "cheerful"
when = [{ kind = "date", from = [1584, 1, 1] }, { kind = "affinity", person = "baraka", ge = 60 }, { kind = "flag", flag = "c13_npc_baraka_mate", value = false }]
deadline = [1590, 12, 31]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "invite"
text = "请他上船，做账房也做说书人"
next = "done"
effects = [{ kind = "join", person = "baraka" }, { kind = "flag", flag = "c13_npc_baraka_mate" }]
reply = "他把砝码箱扛上船，史书夹在胳膊底下，站在舷边跟岸上的街坊挥手，挥到看不见还在挥。第一晚他就给水手们讲了三个故事，收了两个人的钱。"
hint = "他还不肯把砝码箱搬上一个外人的船。"

[[tracks.chapters.choices]]
key = "stay"
text = "请他留在蒙巴萨，替你照看这边的货"
next = "done"
effects = [{ kind = "affinity", person = "baraka", value = 3 }]
reply = "他说也好，史书在井边写得快些。你出港那天，他在码头上替你称了最后一包货，称完说：“轻了一点。不过轻的那一点，算我送你的。”"
