# 1557 起 · 索法拉的金市：布换金，他先说实话再讲价。
[[tracks]]
key = "npc_baraka_caravan"
name = "金商的商队"
kind = "request"
start = "c1"
auto = false
cast = ["baraka"]

[[tracks.chapters]]
key = "c1"
title = "跟他进金市"
text = "索法拉的金市边，巴拉卡的骡队刚从内陆回来，骡子身上的泥还没干。他把你运来的布一匹一匹过手，像在数一首诗的韵脚。黄铜砝码箱开着盖，摊在驮鞍的毡子上，芭蕉叶里包着金砂，其中一包颜色发暗。“布是好布。金子嘛，有一包我得先跟你说实话，说完再讲价。”他说这包本来打算留着自己吃这个亏，看你懂不懂行。“故事不要你的钱，可这包金砂要你的眼睛。”"
at = "sofala"
speaker = "baraka"
cast = ["baraka"]
mood = "cheerful"
