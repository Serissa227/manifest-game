# 1579 起 · 往东的信：那个马库阿男孩的往事只在这里由巴拉卡自己讲出。
[[tracks]]
key = "npc_baraka_yasuke"
name = "往东的信"
kind = "request"
start = "y1"
auto = false
cast = ["baraka"]

[[tracks.chapters]]
key = "y1"
title = "往东的信"
text = "蒙巴萨，巴拉卡住到了他母亲娘家的那条街上。一个从果阿来的耶稣会士念过一段信给他听：巡察使身边那个高个子的非洲随从，跟着去了日本。巴拉卡说，很多年前在索法拉的海边，他从一条奴隶贩子的船上换下过一个马库阿男孩，让他攥着一枚最小的砝码别抖。他觉得就是这个人。他写了一封信，问你往东去不去。“这是我第一封不讲笑话的信。你别偷看，偷看了也别告诉我写得怎么样。”他把信封好，又拆开，在末尾添了一枚小砝码的画：“他不认得字，认得这个。”"
at = "mombasa"
speaker = "baraka"
cast = ["baraka"]
mood = "tender"
when = [{ kind = "date", from = [1579, 6, 1] }, { kind = "flag", flag = "c13_main_mio", value = false }, { kind = "flag", flag = "c13_npc_baraka_mate", value = false }]
deadline = [1581, 6, 30]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "take"
text = "收下信，往东去时带上"
next = "y2"
effects = [{ kind = "affinity", person = "baraka", value = 4 }]
reply = "他把信用油纸包了三层，说海上潮，纸怕水，字更怕。“他要是不记得我，你就把信烧了，回来告诉我他过得好就行。”"

[[tracks.chapters.choices]]
key = "copy_pt"
text = "替他把信誊成葡萄牙文，好让神父念给那人听"
next = "y2"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_portuguese", ge = 60, hard = true }]
effects = [{ kind = "affinity", person = "baraka", value = 6 }]
reply = "你誊的时候他在旁边一句一句念，念到“砝码”那个词，葡萄牙文里找不到合适的，你们俩争了半天，最后画了一个。"
hint = "你的葡萄牙文还写不成一封信。"

[[tracks.chapters.choices]]
key = "decline"
text = "我不往东走，帮不了这个忙"
next = "done"
effects = []
reply = "他说没关系，信先放在砝码箱里，等一条往东的船。他讲了个笑话给你送行，讲得有点长。"

# 1582 初 · 长崎：范礼安接过信，说那个人如今在安土，有了日本名字。
[[tracks.chapters]]
key = "y2"
title = "长崎的巡察使"
text = "长崎，耶稣会的住院。巡察使范礼安正忙着给去罗马的几个少年备船。他接过巴拉卡的信，看了看末尾那枚砝码的画，说那个人如今在安土，跟在织田大人身边，有了一个日本名字，叫弥助。信可以托去京都的神父带过去。“织田大人给他起的名字，他很喜欢。”他合上信，又说：“他从不提来日本以前的事。也许这封信会让他提一句。”"
at = "nagasaki"
cast = ["alessandro_valignano"]
mood = "tender"
deadline = [1582, 2, 15]

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "hand_over"
text = "把信交给巡察使，请他托人带去安土"
next = "done"
effects = [{ kind = "affinity", person = "alessandro_valignano", value = 3 }, { kind = "affinity", person = "baraka", value = 6 }]
reply = "范礼安把信放进一摞要带去京都的信里，压在最上面。你出门时，他说会让带信的神父念给那个人听，连那枚砝码的画一起。"

[[tracks.chapters.choices]]
key = "add_line"
text = "在信封上添一句：基尔瓦的人还记得你"
next = "done"
effects = [{ kind = "affinity", person = "baraka", value = 8 }]
reply = "你在信封背面写了一行，写的是巴拉卡的口气。范礼安看了，没说什么，只把那一面朝上放好。"

# 1589 初 · 蒙巴萨的街口：津巴人来了，他要一条船，或者一个肯守到天亮的人。
[[tracks]]
key = "npc_baraka_zimba"
name = "城门与潮水"
kind = "request"
start = "c1"
auto = false
cast = ["baraka", "mir_ali_bey"]

[[tracks.chapters]]
key = "c1"
title = "城门与潮水"
text = "蒙巴萨，米尔·阿里第二回来了，在岛上筑了土墙。葡萄牙的船堵着海，对岸大陆上津巴人的营火一直烧到浅滩边。巴拉卡在他母亲娘家那条街口拦住你：街上有十几户人家，他要一条船，或者一个肯陪他守到天亮的人。米尔·阿里的水手拦在码头上：“船？船都是苏丹的！”巴拉卡把黄铜砝码箱塞到你手里：“替我拿着。我两只手要扶人。”"
at = "mombasa"
speaker = "baraka"
cast = ["baraka", "mir_ali_bey"]
mood = "tense"
when = [{ kind = "date", from = [1589, 1, 1] }, { kind = "flag", flag = "c13_main_najma", value = false }, { kind = "flag", flag = "c13_npc_baraka_mate", value = false }]
deadline = [1589, 5, 31]

[tracks.chapters.timeout]
