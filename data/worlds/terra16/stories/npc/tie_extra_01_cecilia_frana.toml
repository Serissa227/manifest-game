[[tracks.chapters]]
key = "tie_extra_01_cecilia_frana_meeting"
title = "使者不笑"
text = "芙拉娜·卢基奇是来核外乡人居留文书的。在箍桶匠楼上这两间赁房里，她一页一页对着印看，眉头从进门起就没松过。对完了，她顺口说要订一张面具。“墙上这些，哭的笑的，挑一张？”塞西莉亚问。“随你。”使者已经在翻下一份了。十天后她来取。盒子里是一张皱眉的脸，眉心一道竖纹，刻得很深。芙拉娜气笑了：“我在你眼里就长这样？”“这张是你来的时候的。”塞西莉亚说，“走的时候那张，我还没见过。”芙拉娜合上盒盖，夹在胳膊底下走了。那张脸后来挂在她书房里，正对着书案。"
stage = "witness"
window = [[1583, 2, 1], [1583, 6, 30]]
at = "ragusa_port"
cast = ["cecilia", "frana"]
speaker = "cecilia"
mood = "cheerful"
news = "拉古萨港边新来的面具师给使者做了一张皱眉的面具，使者没退，拿回去挂在了自己书房里。"
when = [{ kind = "tie", a = "cecilia", b = "amaia", relation = "lovers" }]

