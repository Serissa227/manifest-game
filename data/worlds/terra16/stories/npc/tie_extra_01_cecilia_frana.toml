text = "冬至夜，后屋的墙上挂满了塞西莉亚的纸面具，炉火一照，哭的笑的都红了脸。埃莱妮从隔两家的铺子端着一罐树脂过来，一坐下就跟阿玛娅争汤里该放几片姜，像在集市上讲价：“三片！多一片我就不喝。”“七片。”阿玛娅头也不抬，“你不喝，有人喝。”芙拉娜在中间劝：“五片，两边各让一步。”两边都不理她，她就自己倒酒。两杯下去，使者靠着墙睡着了，眉心那道竖纹松开了。埃莱妮要去推她，塞西莉亚拦住：“别叫。这张脸难得见。”她摸出炭条，在一张包药的纸上照着画。"

[[tracks.chapters]]
key = "tie_extra_01_cecilia_frana_turning"
title = "卫生署的告示"
text = "港门边的柱子上贴出了卫生署的告示，墨还没干，就围了一圈水手。认字的念给不认字的听：凡外乡来的行医人，须有两位本城人作保，不然一律不许开药。念完了，好几个人回头去看港边那间铺子。比斯开草药女晒药的那扇窗这几天关着，只有晾面具的那扇开着。有人去讨退烧的药，面具师递给他一张笑脸：“药的钥匙在行会手里。脸倒是现成的。”鱼市上的人说，使者在总督府里跟医生行会吵了一个上午，出来时还笑着，见人就问好。箍桶匠的老婆听见她傍晚进门说的头一句：“行会要第二个保人。”"
stage = "rumor"
window = [[1584, 1, 15], [1584, 3, 31]]
at = "ragusa_port"
cast = ["cecilia", "frana"]
mood = "tense"
news = "拉古萨卫生署贴出告示，外乡行医的人要有两位本城人作保；港边那间药铺这几天只卖面具，不卖药。"

