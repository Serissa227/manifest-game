[[tracks.chapters]]
key = "tie_extra_01_cecilia_frana_choice"
title = "替外乡人作保"
text = "芙拉娜的书案上压着两张纸。一张是阿玛娅的保书，头一行是使者自己的名字；第二行的保人递上去，被行会退了回来，说那人欠着使者的人情，不作数。另一张是共和国的单子：明年圣布莱斯节要用的一批面具，等着发给塞西莉亚。她把面具的单子往底下一压，先抽出保书。塞西莉亚靠在门框上：“使者也会把公事往后放？”“你别告诉大议会。”芙拉娜这才看见我，起身让座：“阁下的船一进港我就看见了，满港数它的桅杆站得最直。……客套话说完了。你要什么？”塞西莉亚笑出了声：“她缺一个保人，又不肯先开口。”"
