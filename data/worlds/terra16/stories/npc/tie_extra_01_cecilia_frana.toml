# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GL（知己线，不写恋爱；两人都是纯 GL，各有恋人）。
# 人物：塞西莉亚·达尔·波佐（cecilia，1528-01-01 生，1582 年起住在拉古萨的面具师，恋人是阿玛娅，见 tie_cecilia_amaia）；
#       芙拉娜·卢基奇（frana，1534-12-02 生，拉古萨共和国的女使者，恋人是埃莱妮，见 tie_frana_eleni）。
#       同桌的还有阿玛娅（amaia）与埃莱妮（eleni，只在 c7_tie_frana_eleni_ragusa 的变体里亲自到场），不进本轨道 cast。
# 依据·史实：拉古萨共和国向奥斯曼纳贡、也和威尼斯通商；城里设卫生官管检疫与外来的人；大议会只有贵族男子能坐；
#       2 月 3 日圣布莱斯节是城市主保的节日，游行抬着圣徒的银圣髑匣从总督府（即 Rector's Palace）门前经过。
# 依据·原创：“外乡行医须两位本城人作保”的告示、医生行会退保人、共和国为圣布莱斯节订面具、游行队伍戴面具、四个女人的冬至夜饭。
# 待核：拉古萨当时管行医的是城邦雇的公医还是另有行会（正文只写“医生行会”）；圣布莱斯节游行里有没有戴面具的队伍（本世界线这样写）。
# 年龄：两人之间只有 friends → confidants，不涉恋爱门禁；1583 年塞西莉亚 55 岁、芙拉娜 48 岁。
# 与旁线一致：缺省路径她们住港边箍桶匠楼上的两间房（前窗晒药、后屋归塞西莉亚的面具）；ragusa 路径是芙拉娜写的许可钉在门框上的铺子（左窗晒药、右窗晾面具）——见 tie_cecilia_amaia 落点。
# 缺省走向：meeting（1583，朋友）→ closer（1583 冬至，知己）→ turning（1584 卫生署告示，传闻）→ choice（缺省：芙拉娜拿薪俸作押，面具单子晚发一个月）→ landing（1585 圣布莱斯节，知己）。
# 玩家能做的：stand_surety 替阿玛娅做第二个保人（helped）；festival_masks 从威尼斯运金箔与纸胎（masks，落点的面具就是那张没上色的）。
# 第一章 when：塞西莉亚与阿玛娅是恋人（tie 条件；不满足时本线在窗口末日静默失败）。简报原定读 c7_tie_cecilia_amaia_together，
#       但 story_audit 按轨道单独走、不替跨轨道的旗标作弊，写旗标就永远走不到 done；改用关系条件。两人自 1557 年起是恋人（ties.toml），
#       所以这一条实际上很少挡住什么；塞西莉亚 1583 年人在拉古萨靠整合方改的日程保证。审计工具支持跨轨道旗标后应改回旗标。
# 读的共享旗标：c7_tie_cecilia_amaia_ragusa、c7_tie_frana_eleni_ragusa（变体；两个都有时用 both 变体）。
# 设的旗标：c7_tie_extra_01_cecilia_frana_helped、c7_tie_extra_01_cecilia_frana_masks、c7_tie_extra_01_cecilia_frana_landing。
# 日程：本文件不改日程；塞西莉亚与阿玛娅 1582 年起在 ragusa_port 由 tie_cecilia_amaia 的整合项负责。cast/ties.toml 的 cecilia–frana：since 改到 1583，friends → 落点后 confidants。

