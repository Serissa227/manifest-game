text = "芙拉娜·卢基奇是来核外乡人居留文书的。港边这间铺子左窗晒药、右窗晾面具，门框上钉着一张许可，纸边黄了。她认出那是自己的字：“这张我八年前就写好了，你们倒真让我等。”对完了文书，她顺口说要订一张面具。“墙上这些，哭的笑的，挑一张？”塞西莉亚问。“随你。价钱先说定——隔两家有间卖玛蒂克的铺子，老板娘讲起价来跟人吵架一样，你别学她。”十天后她来取。盒子里是一张皱眉的脸，眉心一道竖纹。芙拉娜气笑了：“我在你眼里就长这样？”“这张是你来的时候的。走的时候那张，我还没见过。”芙拉娜合上盒盖，夹在胳膊底下走了。那张脸后来挂在她书房里，正对着书案。"

