[[tracks.chapters]]
key = "tie_extra_01_cecilia_frana_closer"
title = "四个女人的桌子"
text = "冬至夜，后屋的墙上挂满了塞西莉亚的纸面具，炉火一照，哭的笑的都红了脸。阿玛娅的草药汤在炉上滚着。桌边第四个位子空着，前面摆一小包玛蒂克树脂，是希俄斯每年托船捎来的，捆包的绳子底下别着一封信。芙拉娜拆开信念给她们听：“今年割口子早，眼泪少，最好的都在这包里。别拿去送人。”“她每年都这么写，”芙拉娜说，“我每年都拿去送人。”她把树脂掰成三块，推到每人面前。两杯下去，使者靠着墙睡着了，眉心那道竖纹松开了。阿玛娅伸手要推她，塞西莉亚拦住：“别叫。这张脸难得见。”她摸出炭条，在一张包药的纸上照着画。"
