text = "内里的新殿搭着脚手架，木匠的号子越过宫墙，一直传到上京。我到柿子树下取一封托小督写的信，她刚封好，门口的光一暗，进来的是菖。这些年她从没进过这间屋子。她没看小督，先看我，跪坐下来，两手放在膝上，袖口压出一道褶也没理。“那年歌会上那一首的草纸，在您手里。”她说得一句比一句工整，“明年开春修好的内里要办头一场歌会，我想当众认下。认下以后，那张纸请您不要拿出来。”她俯下身去，额头离席子只差一寸。小督在一旁磨墨，砚里的水添过一回。"

