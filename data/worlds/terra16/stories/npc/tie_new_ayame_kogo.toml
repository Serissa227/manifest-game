[[tracks.chapters.variants]]
key = "cosigned"
when = [{ kind = "flag", flag = "c7_tie_new_ayame_kogo_cosigned" }]
text = "内里修好了，新殿的柱子还透着木香，春天办了头一场歌会。小督收到一张请帖，是菖写的，字端端正正，请她来作客人；帖子末尾另添一行小字：这回不必带笔。小督借了邻家一件旧袿，坐在末席，请帖平放在膝上。轮到菖，她站起来，没念歌，先说了一句：“当年那首歌，不是我写的。”满座都愣住了，扇子停在半空。上臈没有笑，把扇子合上，叫换人念下一首。菖没坐下，把今年那首也念了：上句是她的，下句是末席那位客人接的，满场只有这一首署了两个名字。上臈听完，没说判词。那以后，宫里再没人提上臈那个位子往后归谁。散会时菖在廊下等着，没去碰小督的衣领：“米价涨了。往后，一首两升。”小督说：“这一首两个名字，一人一升。”她伸手，菖把一升的钱放进她手里。"
