# 转折（传闻）：1568 年冬，织田奉新将军入京，说要出钱修内里。
[[tracks.chapters]]
key = "tie_new_ayame_kogo_turning"
title = "织田的兵进了京"
text = "上京的米铺门口，说的都是一件事：尾张的织田奉着新将军进了京，满城都是兵。有人说他的兵抢一文钱就砍头；有人说那位织田进宫看了一回，看见宫墙塌着，当场叫人量尺寸，要出钱修内里。柿子树下替人写信的那个姑娘，门口天天排到天黑——兵要给尾张的老娘报平安，京里人要给乡下的亲戚报平安。有个兵说不出要写什么，憋了半天：“告诉她，我没死。”她照写了，又替他添了两行京都的天气。大炊御门家的侍女也来排过一回，没带信，只替她家姬君问一句：“柿子树下的人，还好吗？”姑娘头也没抬：“替我回她，米价翻了一番，我的字还是一封一升。”"
stage = "rumor"
window = [[1568, 10, 15], [1569, 1, 31]]
at = "kyoto"
cast = ["ayame", "kogo"]
mood = "tense"
news = "尾张的织田奉着新将军进了京都，满城都是兵；上京柿子树下替人写平安信的姑娘，门口天天排到天黑。"
rumor_days = 60

[tracks.chapters.default]
next = "tie_new_ayame_kogo_choice"
effects = []

# 抉择：1570 年春夏，上京柿子树下的小屋。菖头一回进门，说出当年那首歌。玩家在京都时可以插手。
[[tracks.chapters]]
key = "tie_new_ayame_kogo_choice"
title = "当年那首歌"
text = "内里的新殿搭着脚手架，木匠的号子越过宫墙，一直传到上京。我到柿子树下取一封托小督写的信，她刚封好，门口的光一暗，进来的是菖。这些年她从没进过这间屋子，袖口压出一道褶也没理，就那么坐下了。“修好的内里，明年开春要办头一场歌会。”她看着砚台，不看人，“那年歌会上赢的那一首，是我拿米换来的。十五年了，我没对任何人说过。”她的脸色发白，句子一句比一句工整，“这回我想当众认下，可写它的人，我不能供出去。”小督把笔搁回笔架：“供出去也行，一首两斗，当年的价，我认。”屋里静下来，两个人都看着我。"
stage = "involve"
window = [[1570, 3, 1], [1570, 7, 31]]
at = "kyoto"
cast = ["ayame", "kogo"]
speaker = "ayame"
mood = "tender"
news = "京都上京替人写信的那间小屋，宫里的菖头一回进了门，一坐就是一下午，出来时袖口皱着也没理。"
rumor_days = 60

