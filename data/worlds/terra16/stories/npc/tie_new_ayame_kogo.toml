# C7 配角线（新线，Claude）：tie_new_ayame_kogo「退回去的米」——遵循 A5 / E37 故事 2.0 契约。
# 走向：欠→换一种算法（一袋米，一首歌，一辈子的嘴；交情在，换了一种算法）。
# C21b 改（2026-11-12，Claude Opus；研究 3.3 第 5 场、手册第五节第 7 组、裁决第 5 条）：落点不再同场和解——上臈不笑，合上扇子叫换人念下一首，
#   菖接班的事从此没人再提（她当了一辈子女房，没当上上臈）；散会后她在廊下等小督，不扶衣领，说“米价涨了，往后一首两升”。
#   小督收不收：缺省收；读 bond_kogo 的 c7_bond_kogo_kept_draft（澪留下了那张草纸）时，choice 一章菖是来求的，落点里小督不收。
#   删掉三处：choice 的“字是我替你写的。心事，是你自己的”（小督的口号只许米铺一场）、两处“脸红到耳根”（只归鞠千代）。
# 标签：GL（ties.toml 记 GL），女性之间的非恋爱线：从冷淡的旧同窗到朋友。全线不写心动、不写暧昧，也不写“她们不是恋人”一类的说明句。
# 人物：大炊御门菖 ayame（1540-03-07，女，不开放恋爱，宫中跟着上臈的女房）；
#   小督 kogo（1540-06-16，女，纯 GL，在宫外上京赁屋替人代笔）。两人同年，本线没有任何恋爱效果，年龄门禁不涉及。
# 依据·史实：天文、弘治、永禄年间朝廷穷困，内里的土墙年久失修；1568 年（永禄十一年）秋织田信长奉足利义昭入京，
#   义昭随即就任将军，信长的兵在京中军纪极严（“抢一文钱就砍头”是街谈，只用传闻口吻）；1569 年起信长出钱修缮内里，1571 年（元龟二年）完工。
# 依据·原创：两人的十几年；1554 年秋那场歌合上菖付米请小督代写、赢了的那一首（与 bond_kogo B1 是同一件事；本线不写它赢了谁）；
#   1557 年建礼门边塌了的土墙与守门仕丁的家书；1563 年秋退回的米袋、袋口那张“这回请您自己写”、那盒没附话的点心；
#   1568 年的平安信与“米价翻了一番，字还是一封一升”；1570 年菖头一回进小督的小屋、压出褶的袖口；1571 年修好的内里头一场歌会与那张请帖。
# 待核：战国时的土御门内里南门是否沿称“建礼门”；修缮完工后头一场歌会的确切日子（正文只说“春天”）；1568 年京中米价（正文只说“翻了一番”）。
# 缺省走向（玩家什么也不做）：meeting（1557 夏，建礼门前一个行礼、一个不回头）
#   → closer（1563 秋，米原样退回，菖自己写、输得很难看，送去一盒点心，换回“写得不坏”；friends）
#   → turning（1568 冬，传闻：织田入京、要修内里；小督门口排满写平安信的人，菖遣侍女来问一声）
#   → choice（1570 春夏，菖头一回进小屋，说出当年那首歌是拿米换的；缺省：没拿定主意，回宫翻出旧米账补了一行）
#   → landing（1571 春，修好的内里头一场歌会，菖请小督作客，当众说“当年那首歌，不是我写的”，不说写的人是谁；friends + 落点旗标 + 回忆）。
#   玩家插手只改变她怎样拿定主意（替她去问上臈／劝两人合写一首并排署名），不改变落点；合写的那首在落点用 variants 提一句。
# 旗标：设 c7_tie_new_ayame_kogo_helped（choice：替她去问上臈）、c7_tie_new_ayame_kogo_cosigned（choice：合写一首）、
#   c7_tie_new_ayame_kogo_landing（落点 default）；choice 与落点的 variants 读 bond_kogo 的 c7_bond_kogo_kept_draft，落点另读 _cosigned。
# 去重：小督向主角道歉的场面归 bond_kogo B1，本线不写；bond_ayame 不写代笔——本线是菖唯一的一次承认。
#   与 tie_kikuchiyo_kogo、tie_new_kogo_mae_sumi 是同一个小督，上京柿子树下的小屋是同一间。
# 秘密：代笔一事在 1570 年 choice 之前只留伏笔；所有见闻（news）都不写代笔、不写那首歌是谁写的。
# 日程：不改（两人 1557—1590 都在 kyoto_city）。整合：cast/ties.toml 新增 ayame × kogo（relation = friends，tags GL，story = tie_new_ayame_kogo）。

