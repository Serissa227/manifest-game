# 靠近：1563 年秋，宫里的歌会。米原样退回，菖自己写，输了。
[[tracks.chapters]]
key = "tie_new_ayame_kogo_closer"
title = "退回去的米"
text = "秋天的歌会前两天，菖的侍女提着一袋米出了宫，敲开上京那间柿子树下的小屋。第二天一早，米原样扛了回来，袋口的草绳上系着一张纸，是那笔谁也舍不得烧的假名：“这回请您自己写。”菖把纸摊在灯下坐了一夜，墨磨干了两回。歌会上她念了自己写的那首，判者读判词时停了两次，满座的人都低头看扇子。散会后她叫来侍女：“去宫外送一盒点心。”侍女问附什么话。“什么也不附。”隔天，侍女带回一张纸，只有一句：“写得不坏。”菖把那四个字看了又看，夹进了自己的歌书。"
stage = "witness"
window = [[1563, 9, 1], [1563, 12, 31]]
at = "kyoto"
cast = ["ayame", "kogo"]
speaker = "ayame"
mood = "tender"
news = "京都宫里秋天的歌会上，大炊御门家的菖输得很难看；散会后她的侍女提着一盒点心出了宫门，不知送给了谁。"
rumor_days = 60

[tracks.chapters.default]
