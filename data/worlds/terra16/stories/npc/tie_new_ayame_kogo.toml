# 相识：1557 年夏，建礼门前。结业后头一回碰面。
[[tracks.chapters]]
key = "tie_new_ayame_kogo_meeting"
title = "宫门内外"
text = "结业后的头一个夏天，菖跟着一位上臈进了宫，小督在上京的巷子里赁了间小屋，替人写信。建礼门边的土墙塌了一截，拿竹篱草草挡着。小督来给守门的仕丁送家书——他娘在近江，他不识字。门里出来一行人，菖捧着上臈的文匣走在最后，看见她，眼睛移开了，袖口一丝不乱地走过去。小督退到竹篱边，冲着那个背影端端正正行了个礼：“上臈要是缺个代笔的，上京的柿子树下找我。”菖的脚步停了一下，没回头：“仕丁的家书，该走侧门。”仕丁捏着那封家书，看看门里，又看看门外。"
stage = "witness"
window = [[1557, 5, 1], [1557, 8, 31]]
at = "kyoto"
cast = ["ayame", "kogo"]
speaker = "kogo"
mood = "tense"
news = "京都建礼门前，捧文匣的宫中见习和替人写信的姑娘擦肩而过；一个冲背影行礼，一个头也没回，守门的仕丁看得直发愣。"
rumor_days = 60

[tracks.chapters.default]
