# 落点：1571 年春，修好的内里头一场歌会。玩家不在场也照样发生（菖 31 岁，小督 30 岁，6 月满 31）。
[[tracks.chapters]]
key = "tie_new_ayame_kogo_landing"
title = "宫里的请帖"
text = "内里修好了，新殿的柱子还透着木香，春天办了头一场歌会。小督收到一张请帖，是菖写的，字端端正正，请她来作客人；帖子末尾另添一行小字：这回不必带笔。小督借了邻家一件旧袿，坐在末席，请帖平放在膝上。轮到菖，她站起来，没念歌，先说了一句：“当年那首歌，不是我写的。”满座都愣住了，扇子停在半空。上臈没有笑。她把扇子合上，说了下一首歌的题，叫菖后头那个女房先念。菖站了一会儿，坐下了，今年的歌到散会也没轮到她念。写的人是谁，她一个字没提。那以后，宫里再没人提上臈那个位子往后归谁。散会时菖在廊下等着，没去碰小督的衣领，两只手放在身前：“米价涨了。往后，一首两升。”小督看了看她：“两升就两升。先付。”菖从袖里摸出钱来，数了两回。"
