# —— 尾声：1567 年秋，里斯本，从埃姆登寄来的半本 ——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_epilogue"
title = "从埃姆登寄来的半本"
text = "书记家在里斯本的新房子看得见特茹河。伊内丝把一个包裹搁在窗台上拆开，是从埃姆登寄来的半本子，封皮让海水泡得起了皱。她一页一页翻到最后，停住了。那里抄着一行葡萄牙语：门边那张椅子，今天空着。十一年前她写完又划掉的半句，索菲一个字不差地抄了回来，后面用法语续上：我在埃姆登，也挑了靠门的那张。伊内丝把这一行念给我听，念到一半停下，拿手背碰了碰鼻子：“她连我当年划掉的那半句都记得。”她在下一页提笔写了一整行，没给谁留半行，写完吹干：“这回写全了，让她背去。”封好，交给码头上头一条北上的船。"
stage = "witness"
window = [[1567, 9, 1], [1567, 11, 30]]
at = "lisbon"
cast = ["ines_costa", "sophie_lemaire"]
speaker = "ines_costa"
mood = "tender"
news = "里斯本那户葡萄牙书记家，每年总有一本旧本子从埃姆登寄来，又寄回去，邮差说里头是诗。"

