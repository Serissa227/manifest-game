# —— 靠近：1556 年春，阁楼的楼梯口（学院期，到心照不宣为止）——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_closer"
title = "一人一行"
text = "半年来，本子每个礼拜在两人之间走一个来回，一人一行，续的还是去年秋天那一首。这天散了会，伊内丝在阁楼的楼梯口拦住索菲，要把上礼拜那一行撤回来：“写坏了。我再想想，换一句。”索菲没接本子，闭上眼，把那一行一字不差背了出来。背完没睁眼，又背了半行：“门边那张椅子，今天空着。”上个月索菲病了三天没来，这半行是伊内丝写完又用一道横线划掉的。伊内丝的脸从脖子红到耳根：“你连划掉的都记？”“划掉的也是你写的。”索菲把本子合上，塞回她怀里，转身下楼。走到第三级，她回了头。"
stage = "witness"
window = [[1556, 4, 15], [1556, 6, 15]]
at = "antwerp"
cast = ["ines_costa", "sophie_lemaire"]
speaker = "sophie_lemaire"
mood = "tender"
news = "安特卫普有两个女学生续一首诗续了半年，一个只写葡萄牙话，一个只写法国话，谁也不肯先收尾。"

[tracks.chapters.default]
next = "pair_ines_costa_sophie_lemaire_together"
effects = []

# —— 落点：1560 年春，斯海尔德河边的码头仓库（成为恋人；主角与其中一人立了 S 约定时此章静默失败，由 _side 轨道接）——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_together"
title = "第一百行"
text = "那首诗续到第一百行，本子换到了第三册。伊内丝替父亲的书记房抄完一天的货单，袖口沾着墨，到斯海尔德河边码头仓库的背风处等。索菲带来新的一册，第一页上只有一个半行，是她从旧本子里替伊内丝抄过来的：我想一直续下去。“这一行你来写全，”索菲把笔递给她，“别只写半行。”伊内丝提着笔，笔尖在纸上抖出一个小墨点：“我……再想想。”“你想了五年了。”索菲把笔拿回去，在那半行底下写了很短一行法语：Moi aussi。我也是。伊内丝盯着那两个词：“这样就不算诗了。”“算。”索菲合上本子，“剩下的，以后慢慢写。”河风把仓库的门吹得哐哐响。伊内丝踮起脚，很轻地吻了她，吻完马上低头去看本子，耳朵红得跟当年在阁楼上一样。"
stage = "witness"
window = [[1560, 4, 15], [1560, 6, 15]]
at = "antwerp"
cast = ["ines_costa", "sophie_lemaire"]
speaker = "ines_costa"
mood = "tender"
news = "安特卫普码头仓库后头常有两个姑娘对着一本本子念诗，一个葡萄牙口音，一个里尔口音，念着念着就笑。"
when = [{ kind = "flag", flag = "c7_pair_ines_costa_sophie_lemaire_taken", value = false }]

