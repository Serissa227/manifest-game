# —— 抉择：1566 年冬，两张船票，三个人 ——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_choice"
title = "一张船票"
text = "伊内丝家年后回里斯本。书记房在一条去埃姆登的汉萨货船上订了两个舱位，原是给留在北边收账的伙计的。伊内丝把两张票拍在桌上，推到索菲面前：“伙计的事，我去跟父亲说。”索菲不接：“你家也要人走。”“我家走的是另一条船。”“另一条船，”索菲一个字一个字地重复，“上个月你说的是，你家等的那条船还没订下来。”伊内丝不吭声了。两张票，可索菲家是三个人：她、她母亲，还有一个弟弟。桌上摊着诗社的本子，线已经挑开，分成两半，两张船票夹在中间。两个人谁也不看谁，一起转过头来看我。"
stage = "involve"
window = [[1566, 10, 1], [1566, 12, 31]]
at = "antwerp"
cast = ["ines_costa", "sophie_lemaire"]
speaker = "sophie_lemaire"
mood = "tense"
news = "安特卫普的葡萄牙书记家要回里斯本了，书记房订下两个去埃姆登的舱位，书记的女儿揣着船票去了一户里尔人家。"

