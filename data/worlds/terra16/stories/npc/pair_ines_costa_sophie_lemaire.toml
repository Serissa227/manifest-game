text = "书记家在里斯本的新房子看得见特茹河。我把油布包搁在伊内丝的窗台上——油布还是走时那一块，绳结换成了索菲打的死结。她解了半天才解开，一页一页翻到最后，停住了。那里抄着一行葡萄牙语：门边那张椅子，今天空着。十一年前她写完又划掉的半句，索菲一个字不差地抄了回来，后面用法语续上：我在埃姆登，也挑了靠门的那张。伊内丝念给我听，念到一半停下，拿手背碰了碰鼻子：“她连我当年划掉的那半句都记得。”她在下一页写了一整行，吹干，用同一块油布包好，推回到我面前：“往北，还是你。”"

