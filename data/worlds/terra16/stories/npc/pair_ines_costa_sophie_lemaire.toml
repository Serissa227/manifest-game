# —— 转折：1566 年 8 月 20 日以后，圣母大教堂那一夜（传闻）——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_turning"
title = "圣母堂那一夜"
text = "八月二十日夜里，一伙人涌进了圣母大教堂。天亮以后，扫街的老头说，他从台阶上扫下来的石膏碎块和金箔屑装了三车。往后几天，城里的话就没离开过船：从里尔、图尔奈搬来的人家挨个去码头问北去的船，埃姆登也好，别处也好，船价一天一个样；葡萄牙商人团体的书记房接到了里斯本的信，叫书记带着家小回去。卖鲱鱼的女人说，那天傍晚她从书记家门口过，看见书记的女儿坐在窗下，拿一把小剪刀，把一本旧本子的线一针一针挑开，分成两半，一半搁在窗台上，一半搂在怀里。“那本子我见过，”女人说，“常有个里尔口音的姑娘跟她对着念。”"
stage = "rumor"
window = [[1566, 8, 20], [1566, 9, 30]]
at = "antwerp"
cast = ["ines_costa", "sophie_lemaire"]
mood = "tense"
news = "圣母堂被砸那夜以后，安特卫普的里尔人家都在打听去埃姆登的船，葡萄牙书记家也收拾箱子要回里斯本了。"

