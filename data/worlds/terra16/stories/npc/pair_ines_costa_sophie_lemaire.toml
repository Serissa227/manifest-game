# —— 相识：1555 年秋，诗社借来的阁楼 ——
[[tracks.chapters]]
key = "pair_ines_costa_sophie_lemaire_meeting"
title = "半行葡萄牙语的海"
text = "月桂树女校开学后，诗社搬进一间借来的阁楼，这是在阁楼上开的第二次会。本子传到伊内丝手里，她照例只写半行，葡萄牙语：“海从特茹河口一直涨到这里——”写完往旁边一推，声音轻得像怕吵醒谁：“剩下半行，归你。”她本是推给对面的人，坐在最后一排靠门的索菲却先伸手拿了过去，用法语续了一句雨：雨落在里尔的屋顶上。有人笑出声：一个海一个雨，两种话押不上韵。伊内丝的脸一下红了，拿起笔要划掉自己那半行。索菲按住纸：“你上回可不是这么说的——你说诗社的本子谁都能写。”伊内丝的笔悬在半空，到底没落下去——她头一回没把自己的口音擦掉。散会时，本子留在两张椅子中间。伊内丝伸手去拿，索菲也伸了手，两只手在封皮上碰了一下。"
stage = "witness"
window = [[1555, 9, 15], [1555, 11, 30]]
at = "antwerp"
cast = ["ines_costa", "sophie_lemaire"]
speaker = "ines_costa"
mood = "cheerful"
news = "安特卫普那个姑娘诗社的本子上，一行葡萄牙话、一行法国话，念起来像两条船隔着河在喊话。"

[tracks.chapters.default]
next = "pair_ines_costa_sophie_lemaire_closer"
