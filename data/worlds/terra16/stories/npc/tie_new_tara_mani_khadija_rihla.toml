# —— 相识：1569 年朝觐季，吉达 ——
[[tracks.chapters]]
key = "tie_new_tara_mani_khadija_rihla_meeting"
title = "这是哪里的颜色"
text = "朝觐季的吉达，码头到集市只有一条街，人挨人往前挪。非斯的商队在街边摊开一地黄皮拖鞋，哈迪贾坐在麻袋上记账，抬头看见邻摊的女人拎着一根线，线上三十几颗珠子，颗颗不同。哈迪贾指着一颗灰绿的：“这是哪里的颜色？”“霍尔木兹。”塔拉拨过一颗橙红的，“这颗叫马林迪。都是坎贝磨的，谁磨的、磨几天，我都记着。颜色有名字，工钱也该有。”“名字谁起的？”“我。”“‘我’是谁？”“塔拉·玛尼。”哈迪贾抽出袖里那卷画了一半的图，照着珠子一颗颗添港口，边上各注一行小字：坎贝的塔拉说。画完，她把图转过去：“图上空着的地方，也有人在过日子。你这根线，比我的图还全。”散集前，两人换了住址：一个写在珠串标签上，一个写在图的背面。"
stage = "witness"
window = [[1569, 4, 1], [1569, 6, 30]]
at = "jeddah"
cast = ["tara_mani", "khadija_rihla"]
speaker = "khadija_rihla"
mood = "cheerful"
news = "朝觐季的吉达集市上，非斯商队卖拖鞋的女人照着隔壁坎贝珠摊的样珠，把一个个港口画进了自己的图。"

