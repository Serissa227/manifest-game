# —— 转折：1572 年末阿克巴到坎贝看海（传闻）——
[[tracks.chapters]]
key = "tie_new_tara_mani_khadija_rihla_turning"
title = "皇帝来看海"
text = "阿克巴的兵进了古吉拉特，苏丹降了。码头上的人说，皇帝随后到了坎贝，只为看一眼海——他这辈子还没见过。他叫人撑了条小船，趁着涨潮往海湾里漂了一段，才回来。珠市关了三天，摊子全收进屋里。珠匠家的女儿挤在河堤的人堆里，只看见一顶伞、一条船、一个人在船头站了很久。回到作坊，她翻出非斯来的上一封信，信尾问：“坎贝的海是什么颜色？你还没给它起名。”老匠人问她皇帝长什么样。“脸没看清。”她铺开纸，“看清的是他看海的样子——跟非斯那个人头一回看我的珠子，一模一样。”这一句，她原样写进了回信。海是什么颜色，她还是没写。"
stage = "rumor"
window = [[1572, 11, 15], [1573, 2, 28]]
at = "khambhat"
cast = ["tara_mani", "khadija_rihla"]
mood = "tender"
news = "阿克巴的兵进了古吉拉特，皇帝本人到坎贝看了一眼海，还坐了条小船；坎贝珠市因此关了三天。"

