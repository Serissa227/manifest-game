# C7 重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。新线，没有旧稿。
# 标签：GL（恋爱线；两人的 romance.with 都是 any）。
# 人物：塔拉·玛尼 tara_mani（1540-08-04，坎贝珠匠家的女儿，学院同学）× 哈迪贾·里赫拉 khadija_rihla（1540-06-25，非斯商队人家的女儿，学院同学）；生年差一个多月。
#   1569 年吉达相识时两人二十八九岁；恋人效果在 1574-01-01 起的落点章：两人都 33 岁（最早可写恋人的日子是 1558-08-04）。
# 依据：
#   史实——坎贝的玛瑙与红玉髓珠经红海、东非海岸行销；1569 年朝觐季（伊历 976 年 12 月，约公历 5 月）吉达挤满朝觐与贩货的人；
#         1572 年阿克巴进兵古吉拉特，苏丹穆扎法尔三世投降，阿克巴随后专程到坎贝看海、坐小船出海（《阿克巴本纪》）；
#         1573 年古吉拉特归莫卧儿。
#   原创——两人的相遇与那根样珠线；用港口起名的珠色（“非斯蓝”“丹吉尔白”“西吉尔马萨的沙”）与塔拉回寄的码头珠色；
#         珠市关门三天、“坎贝的海是什么颜色”；新官要外乡人到官署登记、路引上的“记路程的人”；哈迪贾的游记与夹在书页里的红玉髓。
#   待核——阿克巴到坎贝的确切日子（1572 年末），正文只写“随后”；1573 年新官登记外乡人是原创情节，正文用传闻与在场口吻。
# 缺省走向：1569 吉达相识（friends）→ 1570 书信往来，一个寄地名、一个寄珠色（传闻，confidants）→ 1572 阿克巴到坎贝看海（传闻）
#   → 1573 哈迪贾瞒着家里从吉达来到坎贝，没人插手时珠匠行会拖了两个月才作保 → 1574 她在塔拉的作坊写游记，两人成为恋人（落点，缺省即发生，圆满）。
#   主角与其中一人立了 S 约定（taken）时，主轨道在落点静默失败，改由 _side 轨道写两人合写一本游记、成为并肩的朋友；不写嫉妒，不提主角。
#   玩家能做的：替她讨一张路引（helped），或替她往非斯捎信（family）；两个旗标都由落点 variants 读，都不改变结局。
# 秘密：塔拉的裂珠只在落点出现，见闻不写；哈迪贾怕被叫回去守货栈，只在抉择章写她瞒着家里上船，见闻不写。
# 设旗标：c7_tie_new_tara_mani_khadija_rihla_helped、c7_tie_new_tara_mani_khadija_rihla_family（两个都由落点 variants 读）、
#   c7_tie_new_tara_mani_khadija_rihla_together、c7_tie_new_tara_mani_khadija_rihla_side。
# 读旗标：c7_tie_new_tara_mani_khadija_rihla_taken（bond_tara_mani、bond_khadija_rihla 的 S 章设）。
# 整合：cast/ties.toml 新增 tara_mani × khadija_rihla（GL）；哈迪贾的日程 1573 年起改到坎贝（khambhat；cast 里写的 cambay 由整合方统一）。

