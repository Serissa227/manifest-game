# —— 抉择：1573 年坎贝，新官登记外乡人 ——
[[tracks.chapters]]
key = "tie_new_tara_mani_khadija_rihla_choice"
title = "外乡人的登记"
text = "新来的莫卧儿官员要坎贝的外乡人一个个到官署登记：没有保人、没有生计的，下一条船送走。门口排着长队，哈迪贾排在最后，怀里只抱着那卷图。她是从吉达直接上的船——非斯的家信叫她回去守货栈，那封信她没回，卷在图里。塔拉从珠匠行会跑回来，满头是汗：“行会肯保，可头儿说要等。等他对完账，等新官认得他的印。”“等多久？”“他没说。”塔拉转过来看我，“你常跟官署打交道。你说，她这样算不算有生计？”哈迪贾把图卷抱紧了一点：“我会记路程。哪段路是谁讲的，我一个不落。这算不算？”"
