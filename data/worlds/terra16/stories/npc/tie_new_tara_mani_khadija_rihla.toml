# —— 并肩：1574 年坎贝（主角与其中一人立了 S 约定时才走到；缺省即发生）——
[[tracks.chapters]]
key = "side"
title = "一章一颗珠子"
text = "哈迪贾在坎贝住了下来，借珠匠家作坊的后屋写游记，每一页都写明是谁讲的路。每写完一章，塔拉就从样线上挑一颗珠子，夹进那一章：写非斯的那章是“非斯蓝”，写吉达的那章是一颗灰绿的“霍尔木兹”。写到坎贝的码头，塔拉挑了半天，挑出一颗还没起名的。“叫什么？”哈迪贾问。“你写完这章再起。磨它的工钱我付过了，名字归你。”哈迪贾摊开那卷图，在坎贝那一格写上塔拉的名字，旁边注上三个字：讲述人。“这本书，你一半，我一半。路是我记的，颜色是你给的。”塔拉又挑出一颗珠子，在手心里掂了掂：“那封面上写两个名字。我的写小点，省墨。”"
