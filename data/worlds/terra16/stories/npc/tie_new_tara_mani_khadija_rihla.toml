title = "夹在书页里的珠子"
text = "哈迪贾的游记写到第三十页。每一页的页脚都写着讲述人：吉达的船户、开罗的驼夫、坎贝磨珠的老匠人；她自己走过的几段，页脚只写一个“我”字。她在塔拉的作坊里写，桌子挨着磨盘，墨水里落了一层石粉。这天收工，塔拉从荷包里摸出一颗红玉髓。打眼时裂了一道纹，她带了好些年。她把珠子夹进书页：“当书签。这颗不算进任何人的账。”哈迪贾看着那道裂纹，难得没问来历。她从箱底抽出那卷从非斯带来的图，摊开，在坎贝那一格蘸墨写下：塔拉·玛尼。“讲述人？”塔拉问。“住在这里的人。”哈迪贾吹干了墨，“这一格，有人了。”那天夜里熄灯以前，她吻了塔拉。"
