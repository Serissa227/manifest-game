# —— 靠近：1570 年坎贝珠市的传闻 ——
[[tracks.chapters]]
key = "tie_new_tara_mani_khadija_rihla_closer"
title = "非斯蓝"
text = "坎贝珠市今年多了几样新颜色，摊主报名字报得舌头打结：“非斯蓝”“丹吉尔白”“西吉尔马萨的沙”。磨珠巷的人说，名字是从非斯寄来的，信跟着季风走，一年到不了几封。珠匠家的女儿每收到一封，先站在作坊门口念给大家听。上一封写的是：“非斯的瓷碗就是这种蓝。这句是我娘说的，她天天拿那只碗盛汤。”念完，她当天就去窑上挑石头，烧一回新料。老匠人问，烧坏了算谁的。“算我的。烧成了，磨它的工钱一颗一颗记上。”她回寄到非斯的珠子，名字全是坎贝的码头，一颗一个，系着纸条。"
stage = "rumor"
window = [[1570, 3, 1], [1570, 10, 31]]
at = "khambhat"
cast = ["tara_mani", "khadija_rihla"]
mood = "cheerful"
news = "坎贝珠市出了几样新颜色，叫“非斯蓝”“丹吉尔白”，磨珠巷的人说，名字是从非斯一封封信里寄来的。"

