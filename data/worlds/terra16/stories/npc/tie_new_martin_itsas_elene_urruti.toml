# 相识：1558 年春夏，栈桥上。一根弹起来的铁箍，一道口子，洗了三遍。
[[tracks.chapters]]
key = "tie_new_martin_itsas_elene_urruti_meeting"
title = "淡水桶"
text = "淡水桶在栈桥上排了四十来只，泡了一夜，出海的船等着装。马丁从头一只敲起，蹲着一路挪过去，木槌敲一下，耳朵贴上去听一下，嘴里小声数着。一根松了的铁箍忽然崩起来，在他手背划开一道口子，血滴在桶板上。他甩甩手，接着敲。埃莱内挎着给船上药箱送的草药篮路过。同窗三年，她只记得这个人上课也在敲桌沿。她把篮子一撂，一把拽过他的手：“血都滴到桶板上了，你还数？”马丁盯着桶，不看手：“桶还没数完。船上的水，先数三遍。”埃莱内哼了一声：“那你的血也数数。”她拧开水囊就往伤口上冲，冲一遍，他数一声，冲到第三遍，她拿布一裹，打了个死结。他回头把四十只桶敲完，数了三遍，一只不差。"
stage = "witness"
window = [[1558, 4, 1], [1558, 8, 31]]
at = "bilbao"
cast = ["martin_itsas", "elene_urruti"]
speaker = "elene_urruti"
mood = "cheerful"
news = "毕尔巴鄂栈桥上，桶匠家的儿子让铁箍划了手，蹲着不肯停，非要数完淡水桶；后屋草药人的徒弟冲过来，当着一码头人把伤口洗了三遍。"

