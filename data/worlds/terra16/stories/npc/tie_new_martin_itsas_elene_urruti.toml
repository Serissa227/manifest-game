# 靠近：1562 年开春，后屋。出海前一晚，一桶写了字的药，和那包只画了月牙的草。
[[tracks.chapters]]
key = "tie_new_martin_itsas_elene_urruti_closer"
title = "包药"
text = "开春去新地的前一晚，马丁抱着一只自己箍的小药桶，站在酒馆后屋的案子边上，看埃莱内包药。她一包一包包好，在纸皮上写字：“冻伤”“牙床出血”“发热”。炭笔又快又稳，写完一包，往桶里码一包。“我夜里老梦见冰。”马丁说着，指节在桶箍上敲了一下，两下，“看不清，可是知道它在那儿。”炭笔停住了。埃莱内没笑。她转身又抓了一把草叶包成一包，这包不写病名，只画了一弯月牙，塞到桶底。“梦见了就喝这个。”她把桶盖按紧，“船上的水，你自己数三遍。”"
stage = "witness"
window = [[1562, 3, 1], [1562, 5, 31]]
at = "bilbao"
cast = ["martin_itsas", "elene_urruti"]
speaker = "martin_itsas"
mood = "tender"
news = "毕尔巴鄂开春出海的捕鲸船上，桶匠家的儿子抱着一只小药桶，里头的药是后屋草药人的徒弟一包一包写好字的。"

