# 转折（传闻）：1565 年入冬，圣胡安号沉在红湾，马丁搭别的船回来。不写他的梦。
[[tracks.chapters]]
key = "tie_new_martin_itsas_elene_urruti_turning"
title = "红湾的消息"
text = "入冬以后，从新地回来的船一条接一条靠岸，带回同一个消息：圣胡安号装满了鲸油，在红湾的风暴里沉了。“沉在港里，水不深，”水手在酒馆里说，“人都爬上了岸，船和油没了。”船东的账房连着三天没开门。栈桥上的女人们没散，一条船接一条船地等，一个人一个人地数。桶匠街的人说，鱼叉手家的姑娘挎着药篮在桥头站了两天，每条船靠岸就喊一声：“马丁·伊萨斯在不在？”喊完先看下来的人的手。最后那条船靠岸，下来的人里有马丁·伊萨斯。他的手揣在袖子里，被埃莱内一把拽出来——十个指头，冻坏了两个。“还剩八个，”他说，“够箍桶。”埃莱内没接话，拉着他进了后屋。"
stage = "rumor"
window = [[1565, 11, 1], [1566, 1, 31]]
at = "bilbao"
cast = ["martin_itsas", "elene_urruti"]
mood = "tense"
news = "新地回来的船说，圣胡安号满载鲸油沉在了红湾，人都上了岸，船和油没了；毕尔巴鄂栈桥上的女人们一条船一条船地等。"

