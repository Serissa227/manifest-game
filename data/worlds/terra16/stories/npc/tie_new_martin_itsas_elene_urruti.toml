# 抉择：1566 年春，桶匠街。船东贴告示招人去红湾打捞，马丁的手好了一半。玩家替留下的人做一件事；不插手时他自己退了定钱。
[[tracks.chapters]]
key = "tie_new_martin_itsas_elene_urruti_choice"
title = "还去不去"
text = "我去桶匠街订船上的水桶，进门时马丁没抬头，指节一下一下敲着桶箍。我问他眼底怎么一圈青，他说阁楼漏风。门板上新贴了船东的告示：红湾水底下还有一船鲸油，开春回去打捞，招人。“桶匠家的儿子不去，谁去数那些桶。”他说。右手好了一半，布缠到腕子，手背那道旧疤旁边，两根手指裹得鼓鼓的。埃莱内蹲在他旁边揭旧药，一句话不说，洗，上药，缠紧，缠完把药包往桌上一搁：“伤口我洗了。逞不逞强，你自己选。”桶箍上的指节停了。"
