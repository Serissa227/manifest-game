# 桶铺兼药铺（tie_new_martin_itsas_elene_urruti）——配角线，标签 BG；新线，恋爱线。
# 人物：马丁·伊萨斯（martin_itsas，1540-01-10 生），毕尔巴鄂制桶匠家的儿子，学院同学；1562 年起随捕鲸船去新地，口头禅“船上的水，先数三遍”。
#       埃莱内·乌鲁蒂（elene_urruti，1540-02-13 生），鱼叉手家的女儿，跟酒馆后屋的阿玛娅认草药，学院同学；口头禅“伤口要洗，逞强留到岸上”。
#   全线都在成年以后：1558 年相识（friends，两人十八岁）；1562 年知己（confidants，二十二岁）；
#   1567 年恋人（lovers，窗口起日两人都 27 岁；最早可用日 1558-02-13）。落点以前不写告白，两种结局都接得上。
# 依据（史实）：巴斯克捕鲸船每年春天去新地（拉布拉多、纽芬兰一带），秋冬回乡，船上带拆散的桶板，到了再箍成鲸油桶；
#       1565 年秋，满载鲸油的圣胡安号在拉布拉多红湾的风暴里沉在港中，船员搭别的船回乡；次年有船东回红湾打捞沉油。
# 原创：两人的故事；栈桥上的淡水桶与那根弹起来的铁箍；写了字的药包与画月牙的那一包；桶匠街上左边箍桶、右边卖药的铺子。
# 待核：圣胡安号沉没的月份与船员回乡的班次（正文只说“入冬以后”“一条接一条”）；1566 年打捞船开春启程的细节（正文不写船名与人数）。
# 归属：圣胡安号沉没的传闻与“带药去红湾”归本线；阿玛娅的师徒线（tie_extra_02_amaia_elene_urruti）只写回来以后的病与“女巫”的话。本线只在台词里提到她的后屋，不写她出场。
# 缺省走向：玩家不在场，故事照样走完——1558 相识，1562 马丁出海前包药，1565 红湾的消息，1566 春天马丁退了打捞船的定钱，
#   1567 年两人在桶匠街开桶铺兼药铺，成为恋人（圆满）。落点章的 default 写 lovers、落点旗标与回忆。
#   帮助：把药剂和药单送上打捞船（_helped）→ 落点变体：墙上钉着船医抄回来的药单副本。
#   陪同：陪马丁把打捞船的淡水桶敲完一遍（_counted）→ 落点变体：门框上钉着那只桶的盖板。
# 并肩：主角在 bond_martin_itsas 或 bond_elene_urruti 的 S 章立了约（promise / heart 设 c7_tie_new_martin_itsas_elene_urruti_taken），
#   主轨道落点的 when 不满足、静默失败；第二条轨道 tie_new_martin_itsas_elene_urruti_side 写两家铺子共用一个门廊的朋友，不写嫉妒与惩罚，不提主角。
# 共享旗标：读 c7_tie_new_martin_itsas_elene_urruti_taken；写 c7_tie_new_martin_itsas_elene_urruti_together、_side、_helped、_counted。
# 日程：不改（两人 1557 年起都在 bilbao）。
# 秘密：马丁夜里梦见没看清的冰——只在 closer 里由他自己对埃莱内说出口；埃莱内的第一本药草簿归 tie_extra_02，本线不写。两件都不进见闻。

