# 转折（传闻）：1561 年 8 月，修辞大会。没署名的小戏，台下一个没鼓掌的排字匠。
[[tracks.chapters]]
key = "pair_mathijs_jan_turning"
title = "紫罗兰的那出戏"
text = "修辞大会在安特卫普开了，各城的修辞学会扛着旗和布景进了城，街上从早到晚有人排队看戏。酒馆里传得最热的，是紫罗兰学会那出没署名的小戏。演主角的是那个从小专演女角的年轻人，戏里有一段话说得太真，前排的老太太哭湿了两条手帕，隔壁学会的老演员追着问：这词是谁写的？台上没人答。倒是有人瞧见后排坐着个印书坊的排字匠，别人拍红了手，他一下没拍，手里攥着戏单，折了又折。散场了，他是最后一个出门的，还回头问收凳子的人：“这出……明天还演吗？”"
stage = "rumor"
window = [[1561, 8, 3], [1561, 8, 31]]
at = "antwerp"
cast = ["mathijs", "jan"]
mood = "tender"
news = "修辞大会上紫罗兰学会演了一出没署名的小戏，听说台下有个印书坊的排字匠一直没鼓掌，散场最后一个走。"

[tracks.chapters.default]
