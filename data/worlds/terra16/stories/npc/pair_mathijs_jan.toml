text = "三月的傍晚，印书坊收了工，晾纸绳上挂着一排湿样。扬把马蒂斯叫到绳子底下，这回没结巴：“秋天我说明天答你，一拖拖到了开春。那句‘我等的人，手上总带着墨’，你当年排练时说了一半，样张我排了三遍，每一遍手都在抖。”他从绳上摘下一张小纸递过去。正着印的，只有一行：“我等的人手上总带着墨。我在这儿，墨还没干。”马蒂斯想用台上的嗓子念，念到第二个字就走了调，张嘴要打哈哈，哈哈没打出来。拇指在纸边蹭上一块黑：“真没干……”“这回没放反。”扬说。他往前迈了半步，吻了马蒂斯。第二天，马蒂斯在新戏稿末页用笔写上自己的名字，写得很大。"
