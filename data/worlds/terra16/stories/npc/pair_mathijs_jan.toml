# 相识：1555 年初，印书坊。一块倒着的排字盘，一个借走的句点。
[[tracks.chapters]]
key = "pair_mathijs_jan_meeting"
title = "倒着的铅字"
text = "马蒂斯推门进了印书坊，要借一行活字印戏单。扬头也不抬，往他手里塞了一块排字盘：“字在盘里都是倒着的，你先学着反过来认。”马蒂斯当着一屋子学徒念起来，越念越乱，戏单上的“国王”被他念成了“鳗鱼”。扬笑出了声，笑到一半低头看了看盘里那行字，脸色变了：“等等，这个重音符号放反了。”“你也会排错？”马蒂斯捧着盘子，像捧着一场胜仗。“那、那是排给你练手的！”扬把盘里的字推平，顺手添了一行，倒着的，是马蒂斯的名字。马蒂斯没把名字拿走，只从字盒里拈起一个句点：“借这个就够了。我的戏还没写完。”"
stage = "witness"
window = [[1555, 1, 15], [1555, 3, 31]]
at = "antwerp"
cast = ["mathijs", "jan"]
speaker = "jan"
mood = "cheerful"
news = "安特卫普印书坊的学徒把紫罗兰学会那个演女角的少年的名字排成了反字，那少年只借走了一个句点。"

