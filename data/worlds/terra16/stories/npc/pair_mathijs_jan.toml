# 没有署名的戏（pair_mathijs_jan）——配角线，标签 BL；学院同学，恋爱线（圆满）。
# 人物：马蒂斯·佩特斯（mathijs，1540-10-01 生），安特卫普紫罗兰修辞学会的少年演员，专演女角，纯 BL；
#       扬（jan，1540-09-25 生），安特卫普印书坊的学徒，排希腊字最快，说到自己就结巴。
#       两人生年差 0；1555 年相识时 14 岁，只写朋友；1556 年排练那一章 15 岁，只写心照不宣；
#       恋人效果只在 1562-03-01 以后（两人都 21 岁，满 18、不早于 1557-01-01），落点章写到一个吻为止。
# 依据：1561 年 8 月安特卫普的修辞大会（Landjuweel），东道主是紫罗兰修辞学会，各城修辞学会入城演出、街上挂布（史实：大会的时间、地点与东道主）；
#       马蒂斯那出没有署名的小戏、扬的回答、两人的全部来往为原创，不涉及大会的比赛题目与名次。
# 待核：16 世纪排字盘（composing stick）里字是倒着的、一块盘能装几行；1561 年大会期间小戏是否在正式戏台之外另演（正文只用传闻口吻）。
# 缺省走向：1555 春相识（friends）→ 1556 夏排练（马蒂斯念到一半卡住，扬递抄本；crush，与 cast/ties.toml 的 mathijs_jan_crush 一致，
#       bond_mathijs 重逢的 mutual 变体读这条 crush——整合时加，见 DECISIONS）
#       → 1561 年 8 月大会上的小戏（传闻）→ 1561 秋散场后的信（无人插手：扬自己去找马蒂斯，说明天再答）
#       → 1562 春扬排出正着印的小纸作答，成为恋人（lovers），设 c7_pair_mathijs_jan_together 与 mathijs_jan_mutual。
#   帮助：把信交给扬（_matched）或替马蒂斯约扬见面（_helped）→ 落点章的变体换开头，结局相同。
# 并肩：主角在 bond_jan 的 S 章立了约（设 c7_pair_mathijs_jan_taken）时，choice 与 together 的 when 不满足、静默失败；
#       第二条轨道 pair_mathijs_jan_side 在 1561 秋写马蒂斯第一次署自己的名字，两人仍是朋友（tie friends，设 c7_pair_mathijs_jan_side）。
# 共享旗标：读 c7_pair_mathijs_jan_taken（bond_jan 的 S 章设；bond_mathijs 是友情线，不设）；
#       写 c7_pair_mathijs_jan_matched、_helped、_together、_side，以及 mathijs_jan_mutual（cast/ties.toml 的 adult_mathijs_jan 用它门禁）。
# 日程：两人全程在安特卫普，无需改 cast。
# 秘密：马蒂斯把想对扬说的话写成台词、藏进没署名的戏里——1561 年大会以前不点破，news 不写；
#       扬把自己的小诗夹进账本归 bond_jan，本线不写。莉芙在台下看戏归 bond_mathijs 的重逢，本线不写。
# 口头禅：扬“等等，这个重音符号放反了”只在 meeting 用一次；马蒂斯“嘘，这是戏，别当真”只在 closer 用一次；别处只用别的话呼应。

