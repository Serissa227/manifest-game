# 靠近：1556 年夏，排练厅与印书坊。念到一半卡住的一句台词；洗不掉的墨。
[[tracks.chapters]]
key = "pair_mathijs_jan_closer"
title = "不是台词"
text = "排练到第三幕，马蒂斯扮的少女站在窗前，念到“我等的人，手上总带着墨——”忽然停住了。台下抱着抄本对词的扬以为他忘了词，翻开那一页递上去，手指点着一行：“这儿写的是‘从海上来’，重音在‘海’上。”满厅的人都等着。马蒂斯接过抄本，看了看，笑着打了个哈哈：“嘘，这是戏，别当真。”人们跟着笑了。下了场，他脸上的胭脂没卸就去了印书坊，帮着搬了一下午的纸，扬在旁边点数，点错了两回。傍晚洗手，胭脂洗得干干净净，指缝里的墨却不肯下去。"
stage = "witness"
window = [[1556, 5, 1], [1556, 7, 31]]
at = "antwerp"
cast = ["mathijs", "jan"]
speaker = "mathijs"
mood = "tender"
news = "紫罗兰学会那个演女角的少年排练时卡了一句词，听说下了场就去印书坊搬了一下午的纸。"

[tracks.chapters.default]
