text = "戏本要付印了。扬把排字盘端到桌上，抬头问马蒂斯：“封面上署谁的名？”马蒂斯想了很久，久到街角的钟敲了两遍。“署我的，”他说，“马蒂斯·佩特斯，一个字母也别少。”这是他头一回在自己写的东西上留名。那封改了又改、没打算交出去的信，他折成四折，夹进自己那本样书的最后一页，合上了。扬一枚一枚拣出铅字，把他的名字排得端端正正，正着排的，最后一个字母还多擦了一遍。“校样我替你看，”扬说，“错一个字，罚我请你吃饼。”“那我天天来盯你错不错。”“那你得先学会反着认字。”两个人都笑了。"
