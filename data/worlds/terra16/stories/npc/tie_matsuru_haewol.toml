# ── 转折（rumor）：使船北上，祝女没来送 ──
[[tracks.chapters]]
key = "tie_matsuru_haewol_turning"
title = "北上的船"
text = "码头上都在传，王府的使船趁南风往北去，顺路把去年漂来的那船济州人捎回去。上船那天，那个海女走在最后，腰里系着一条白手巾，结打得又小又紧，是她自己的打法。挑夫跟她打趣，说那是祝女给出海的男人系的东西。她把结一拍：“给谁的，我说了算。”祝女没来送。拜所看门的老婆婆说，她在里头坐了一整天，只出来过一回，问风打哪边来。听说是南风，她点点头：“那就好走。”又进去了。"
stage = "rumor"
window = [[1559, 4, 1], [1559, 8, 31]]
at = "naha"
cast = ["matsuru", "ko_haewol"]
mood = "sad"
news = "那霸的使船趁南风北上，把去年漂来的济州人捎了回去。码头上都说，那个海女腰里系着祝女的手巾，祝女却没来送。"

[tracks.chapters.default]
next = "tie_matsuru_haewol_choice"
effects = []

# ── 插手（involve）：海月来信要二十条手巾 ──
[[tracks.chapters]]
key = "tie_matsuru_haewol_choice"
title = "谁的平安"
text = "一条唐船辗转捎来一封信。字是济州一个老书吏代写的，真鹤念给我听，念到第二句就笑了——句句是那个嗓门：“旱地人，你那手巾我下水也系着。我们这边下水，岸上送的全是女人，老的、小的、潜不动的，手里什么也没有。你那手巾，也给她们一条。”真鹤剪了一匹白布，在灯下折了二十条。折到最后一条，手停在一半，布角还翘着。“折了这些年，都是给出海的人。”她看着那条，“给自己折，倒想不起手势了。”她把那条压在包袱最上面，抬头问我：“这一包，能不能替我往北边带一程？”"
stage = "involve"
window = [[1560, 4, 1], [1560, 7, 31]]
at = "naha"
cast = ["matsuru", "ko_haewol"]
speaker = "matsuru"
mood = "tender"
news = "那霸的祝女剪了一匹白布，一晚上折了二十条手巾，说是给济州送海女下水的女人，一人一条。"

[tracks.chapters.default]
next = "tie_matsuru_haewol_landing"
effects = []
news = "那霸祝女折好的一包手巾没赶上今年往北的船，就搁在拜所的架子上，她说等明年的使船。"

[[tracks.chapters.choices]]
