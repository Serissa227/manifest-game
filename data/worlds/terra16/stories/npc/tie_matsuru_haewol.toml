# ── 落点（witness）：回信与画，知己 ──
[[tracks.chapters]]
key = "tie_matsuru_haewol_landing"
title = "两边都留一条"
text = "北边的回信到了，还是那个老书吏的字，还是那个嗓门：“二十条，岸上送行的一人一条。往后下水的系一条，岸上的也系一条，两边都有了。”信里夹着一张画：一排女人站在岸边，腰里都是一样的白。画角上另有一行字，歪歪扭扭，跟书吏的字不是一路：“海藻往外倒，别下水。”真鹤用指头描了一遍那几个字：“她学写字了。”她把画贴在拜所的柱子上。第二天一早退潮，她走到礁盘边蹲下，照着那行字，看了一回海藻往哪边倒。"
stage = "witness"
