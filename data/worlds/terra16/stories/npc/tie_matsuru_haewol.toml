# ── 相识（witness）：漂来的济州船，认不出的结 ──
[[tracks.chapters]]
key = "tie_matsuru_haewol_meeting"
title = "认不出的结"
text = "一条济州渔船漂进那霸港，桅杆断了半截，船上七八个人说的话，港里没人听得懂；王府派来的通事只会几句朝鲜话，问一句要比划三下。只有船上那个海女不怕生，脚一沾岸就讨绳子，蹲在石滩上修网，结打得又快又牢。真鹤在旁边看了很久，解下自己的手巾学着系。海女瞥了一眼，摇头，把那个结往水桶里一按，捞出来抠了半天，抠不开：“那样一浸水，就解不开了。”真鹤换了手势重打一个，系在自己腕上，先指指海，又指指脚下的岸：“这个结，能不能替人留一条回来的路？”通事译得磕磕绊绊。海女愣了愣，笑出声来，一把抓过绳头：“能。下水的结，得照我的打。”"
stage = "witness"
window = [[1558, 3, 1], [1558, 6, 30]]
at = "naha"
cast = ["matsuru", "ko_haewol"]
speaker = "ko_haewol"
mood = "cheerful"
news = "那霸港漂进来一条济州渔船，船上有个海女，脚一沾岸就讨绳子修网；御岳那边的祝女蹲在旁边，跟她学了一下午的结。"

[tracks.chapters.default]
