# ── 靠近（witness）：礁盘上数气，第一条手巾 ──
[[tracks.chapters]]
key = "tie_matsuru_haewol_closer"
title = "潮的名字"
text = "那霸外头的礁盘退了潮，礁上的水只到腰，礁沿外头一步就深了。海月下水前指着脚边的海藻：“旱地人，看好了。往里倒是涨，往外倒是退，退急了就得上来。”真鹤问这一潮在济州叫什么，她想了想：“叫‘该上来了’。”真鹤坐在礁石上替她数气。数到一百，水面还是平的；数到一百二十，她站起来正要喊，海月从三丈外冒出头，一声长哨，手里攥着个海胆，刺还在动。那天夜里，真鹤照姊妹神的规矩折了一条手巾，折成能掖进腰带的窄条：“平安回来，不必带贵的东西。”海月捏着它翻来翻去：“这是给哥哥的。我又不是你哥哥。”“那就当是姐姐给的。”"
stage = "witness"
window = [[1558, 7, 1], [1558, 10, 31]]
at = "naha"
cast = ["matsuru", "ko_haewol"]
speaker = "matsuru"
mood = "tender"
news = "那霸外头的礁盘上，济州来的海女下水，祝女在岸上替她数气，数到一百二十她才冒头，手里还攥着个海胆。"

