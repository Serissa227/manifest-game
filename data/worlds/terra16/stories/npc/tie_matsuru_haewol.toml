reply = "真鹤把最后那条折完，塞进包袱：“那就二十条，一条不少。”包袱跟着我的船到了釜山，第二天就搭上济州来的鱼船。开船前，我看见船上一个女人拆开包袱，抽出一条往腰上一绕一勒——是那个浸了水也解得开的结。她冲南边扬了扬下巴，满船的女人都笑了。"
