# C7 重写（2026-10-11，Claude Opus）：配角线 tie_matsuru_haewol「手巾到了北岸」，替换被退回的 GPT 稿。故事 2.0（DECISIONS“第九批 A5 / E37 开工：故事 2.0 TOML 契约”）。
# 标签：GL 人物之间的知己线，不是恋爱线。真鹤是纯 GL，海月只对男性（她的恋人线是 pair_ko_haewol_shin_gyeong），两人之间不开放恋爱，全线写知己。
# 人物：真鹤 matsuru（1534-07-01 生，那霸的祝女）；高海月 ko_haewol（1535-03-14 生，济州的海女，1564 年起住釜山）。
#   本线 1558-03 至 1561-09，真鹤二十三到二十七岁，海月二十二到二十六岁；没有任何恋爱效果。
# 依据（史实）：琉球的“姊妹神”（onari-gami）信仰——姊妹给出海的兄弟一缕头发或一条手巾护身；祝女（noro）受王府之命主持村里的祭祀；
#   朝鲜漂流民经琉球送还的旧例；济州海女（潜女）下海采鲍，出水时吹一声长哨换气；唐船往来那霸。
# 依据（原创）：1558 年那条漂到那霸的济州渔船；海月在那霸住到 1559 年随使船北返；二十条手巾、济州老书吏代写的信、回信里的画。
# 待核：1559 年送还漂流民走哪条路（十五世纪多由琉球使船直送朝鲜，十六世纪多随进贡船经福州、北京转交朝鲜使臣）。
#   正文只用码头传闻的口吻写“王府的使船趁南风往北去”，不写航线。
# 缺省走向（玩家不在场也照样发生）：1558 春漂流船到港，学结（friends）→ 1558 夏秋礁盘看潮、真鹤折第一条手巾（confidants，回忆）→
#   1559 使船北上（传闻）→ 1560 海月来信，真鹤折了二十条，default 是这包手巾等到第二年的使船 → 1561 回信与画（confidants，回忆，落点旗标）。
# 玩家能做的：choice 章替真鹤把手巾送到釜山再转济州（helped），或劝她把最后那条留给自己（kept；落点用 variants 改回信的最后一句）。
# 旗标（只写，不读外部）：c7_tie_matsuru_haewol_helped、c7_tie_matsuru_haewol_kept（落点变体读它）、c7_tie_matsuru_haewol_landing。
# 日程：cast 里海月 1554—1563 在 jeju；1558-03 至 1559 夏住那霸是故事内的事，不改 cast。整合方若要在 cast 里体现，可加一段 1558-03-01..1559-08-31 的 naha
#   （2026-10-11 波次检查：简报原定 1557—1560，与 pair_ko_haewol_shin_gyeong 1557 年在釜山的 choice / together 撞期，整条后移一年；正文没有年份，不受影响）。cast/ties.toml 的 matsuru_haewol 可由 friends 改为 confidants。

