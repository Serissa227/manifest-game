# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：GL（恋爱线；两人都是纯 GL）。
# 人物：塞西莉亚·达尔·波佐（cecilia，1528-01-01 生，威尼斯码头后头面具铺的老板娘，弗留利乡下出身）；
#       阿玛娅（amaia，1530-06-26 生，毕尔巴鄂酒馆后屋的草药人，冬天随比斯开的运铁船来威尼斯替水手治热病）。
# 依据·史实：弗留利的本南丹蒂（阿奎莱亚—康科迪亚宗教法庭的档案，金茨堡《夜间的战斗》所据）——1575 年起审问加斯帕鲁托等人，1581 年判决（认罪、苦行、监禁半年）；
#       供词里的“生来带着衣胞”、斋日夜里拿茴香秆与女巫作战、魂出去时身子不能被人翻动；四季斋日，将临期的斋日在 12 月 13 日圣露西亚节之后。
# 依据·原创：两人的相遇与借水、面具铺、比斯开的运铁船、欠人情的贵族、芙拉娜的许可、拉古萨的落脚。
# 待核：1575 年的传票怎样从阿奎莱亚送到威尼斯（正文只写“传票钉在门板上”）；判决细节只写认罪、苦行、坐牢半年。
# 年龄：恋人效果在 closer（窗口起日 1557-11-15：塞西莉亚 29 岁、阿玛娅 27 岁，生年差 2），不早于 1557-01-01；与 cast/ties.toml 的 since 1557-12-31 对齐。
# 秘密：塞西莉亚生来带着衣胞、斋日夜里出门，阿玛娅药不灵时念的老祷词——只在 closer 两人独处时由她们自己说出来；标题、选项、见闻都不写。
# 缺省走向：meeting（朋友）→ closer（恋人）→ turning（传闻）→ choice（缺省：她独自去作证，阿玛娅在桥上等）→ landing（1582 年同在拉古萨，恋人）。没有“不成”的结局。
# 玩家能做的：noble 请欠她人情的贵族在法庭外说一句话（helped：名字不进卷宗，走得从容）；ragusa_ship 订船并求芙拉娜写居留许可（ragusa：拉古萨开药铺兼面具铺）；listen 陪她坐到天亮（回忆）。
# 设的共享旗标：c7_tie_cecilia_amaia_together（落点；tie_extra_01_cecilia_frana 与 tie_frana_eleni 读）、c7_tie_cecilia_amaia_ragusa（tie_extra_01 读）、c7_tie_cecilia_amaia_helped。读的旗标：无。
# 日程（整合方改 cast）：塞西莉亚与阿玛娅 1582 年起在拉古萨（ragusa_port），缺省与帮助两条路径都是。

