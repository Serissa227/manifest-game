[[tracks.chapters]]
key = "tie_cecilia_amaia_landing"
title = "药铺的第二扇窗"
text = "去年冬天，阿奎莱亚的判决下来了：那几个弗留利人认了罪，罚了苦行，坐了半年牢。开春，塞西莉亚和阿玛娅带着一只药箱、一箱面具模子，在拉古萨上了岸。她们在港边箍桶匠的楼上赁了两间房。阿玛娅白天在码头替水手看病，前屋的窗口晒满了草药；后屋那扇窗归塞西莉亚，只在狂欢节前晾几张面具，天黑以后谁来敲窗都不开。毕尔巴鄂酒馆的后屋从此空着，那边的人要打听她们，只能等拉古萨来的信。阿玛娅把最后一捆艾草挂上窗棂，回头说：“这里没人认得我们的脸。”塞西莉亚把一张湿纸按进模子，抹平了才开口：“那就做张新的。”"
stage = "witness"
window = [[1582, 3, 1], [1582, 9, 30]]
at = "ragusa_port"
cast = ["cecilia", "amaia"]
speaker = "amaia"
mood = "tender"
news = "拉古萨港边住进两个外乡女人，一个替水手看病，一个只在狂欢节前接面具的活。听说她们是从威尼斯过来的。"

