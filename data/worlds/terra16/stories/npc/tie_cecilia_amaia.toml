text = "去年冬天，阿奎莱亚的判决下来了：那几个弗留利人认了罪，罚了苦行。开春，塞西莉亚和阿玛娅到芙拉娜案头取回了那张许可，纸边已经黄了，印还是红的。拉古萨港边一间铺子开了张，许可钉在门框上，旁边挂一小把干茴香。铺子有两扇窗，左边晒药，右边晾面具。来看病的水手顺手买一张狂欢节的脸，来买面具的太太走时多拿一包退热的药。阿玛娅擦着捣药罐说：“这里没人认得我们的脸。”塞西莉亚把一张新面具挂上右边的窗：“那就做张新的。”"

[[tracks.chapters.variants]]
key = "v2_helped"
when = [{ kind = "flag", flag = "c7_tie_cecilia_amaia_helped" }]
text = "去年冬天，阿奎莱亚的判决下来了：那几个弗留利人认了罪，罚了苦行，卷宗里找不到塞西莉亚的名字。她们走得不慌，雇了一条船，把面具铺的模子一块不落地装了箱。临走前，塞西莉亚还替那位老爷的女儿做完了最后一张面具，钱是那姑娘自己付的。到了拉古萨，她们在港边赁了两间房，前窗晒药，后窗晾面具。阿玛娅数着箱子说：“这里没人认得我们的脸。”塞西莉亚打开最上面那一箱，把模子一张张码在桌上：“那就做张新的。”"
