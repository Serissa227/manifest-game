[[tracks.chapters]]
key = "tie_cecilia_amaia_meeting"
title = "借一盆水"
text = "比斯开的运铁船靠岸第三天，船上倒了三个水手，烧得满嘴胡话。跟船来的草药女沿着码头挨家借盆，门一扇扇关上，有人隔着门板啐了一句“女巫”。她走进码头后头的面具铺时，塞西莉亚正往一张纸胎上刷石膏。老板娘笑盈盈地递过去一张没上色的白面具：“要张什么脸？哭的笑的都有。名字留着自己用。”“阿玛娅。”她没接，“借一盆清水。我要洗的是手。”塞西莉亚脸上的笑停住了。她去后间端来水，搁在门口，看对方把袖子挽到肘上，自己也把手伸了进去。盆里漾开一股茴香味，跟她枕头底下那束茴香秆一个味道。她没作声，把盆往阿玛娅那边推了推。半个月后，三个水手都下了床。铁船走的那天早上，面具铺的门框上挂着一小把干茴香。"
stage = "witness"
window = [[1556, 3, 1], [1556, 6, 30]]
at = "venice"
cast = ["cecilia", "amaia"]
speaker = "cecilia"
mood = "tender"
news = "威尼斯码头后头的面具铺借了一盆水给比斯开船上的草药女。那三个烧得说胡话的水手，半个月后都下了床。"

