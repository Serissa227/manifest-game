[[tracks.chapters]]
key = "tie_cecilia_amaia_choice"
title = "给谁留船位"
text = "传票是一个穿黑袍的差役钉在门板上的：请塞西莉亚·达尔·波佐到庭，说说她那些弗留利同乡斋日夜里做了什么。后间里，阿玛娅头也不抬地捣药：“你去说你知道的，别替他们说他们没做的。”“那要是问到我自己呢？”塞西莉亚在桌上摊开三张面具，一张笑，一张哭，一张什么表情也没有，“你说我戴哪张去？法官大概喜欢哭的。”柜子最里头还压着第四张，镶金边的——那年狂欢节，一位老爷欠了她一回人情，拿它作押。她没去拿，笑着笑着停住了，抬起头来看我。"
stage = "involve"
window = [[1575, 9, 1], [1575, 12, 15]]
at = "venice"
cast = ["cecilia", "amaia"]
speaker = "cecilia"
mood = "tense"
news = "威尼斯码头后头面具铺的老板娘，这一冬常往法庭跑；比斯开来的草药女就在对面桥上等她，一等一整天。"

[tracks.chapters.default]
next = "tie_cecilia_amaia_landing"
effects = []

[[tracks.chapters.choices]]
key = "noble"
text = "去找押下金边面具的那位老爷，请他在法庭外替她说句话。"
reply = "那位老爷在法庭外的廊下站了一刻钟，跟人说了几句什么，我隔得远，没听清。塞西莉亚只被叫进去问了一回，天黑前就出来了，卷宗上没留她的名字。回到铺子，她从柜子最里头摸出那张金边面具，看也没看，一把塞进了炉膛：“人情还清了。”"
next = "tie_cecilia_amaia_landing"
news = "威尼斯的法庭只传了面具铺的老板娘一回，当天就放她回去了。听说那天廊下站着一位戴金戒指的老爷。"
effects = [
  { kind = "flag", flag = "c7_tie_cecilia_amaia_helped" },
  { kind = "affinity", person = "cecilia", value = 5 },
]

[[tracks.chapters.choices]]
key = "ragusa_ship"
text = "替她们订一条去拉古萨的船，再求拉古萨的使者芙拉娜写一张居留许可。"
reply = "船位我订了两个。芙拉娜听完来意，当场把许可写好，盖了印，却压在自己案头：“等你们真要走的那天，再来拿。”阿玛娅把两张船票对折，塞进药袋最底下：“先放着。”那条船按期开往拉古萨，舱里空着两个铺位。"
next = "tie_cecilia_amaia_landing"
news = "威尼斯码头上的人说，有人替面具铺的老板娘和比斯开来的草药女订了两个去拉古萨的铺位，船开那天，两个铺位都空着。"
effects = [
  { kind = "flag", flag = "c7_tie_cecilia_amaia_ragusa" },
  { kind = "affinity", person = "amaia", value = 5 },
]

[[tracks.chapters.choices]]
key = "listen"
text = "陪她坐到天亮，听她讲头一回在斋日夜里出门的事。"
reply = "我什么也没做，只是听。她讲头一回出门是十几岁的冬夜，田埂上起了雾，手里那根茴香秆抖得握不住；讲到一半自己笑起来，一直讲到窗纸发白。第二天她独自去了法庭，傍晚回来，把三张面具原样收进柜子：“他们问的我都答了，没问的，我一个字也没说。”"
next = "tie_cecilia_amaia_landing"
