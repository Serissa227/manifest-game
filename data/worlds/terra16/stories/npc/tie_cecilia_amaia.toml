[[tracks.chapters]]
key = "tie_cecilia_amaia_closer"
title = "替她醒着"
text = "第二年冬天，铁船又来了。圣露西亚节过后的一个傍晚，面具铺早早上了门板，塞西莉亚的脸白得像刚刷的石膏。“坐下，把手伸出来。”阿玛娅说。塞西莉亚伸过来的手里却攥着一束茴香秆，塞进她掌心：“我要是叫不醒，别找神父，也别找大夫。别翻我的身。”她躺下就像死了，半天才吸一口气。阿玛娅攥着茴香秆守了一夜。天快亮时，塞西莉亚的手凉得吓人，阿玛娅拿两只手捂着，低声念起母亲教的老祷词。塞西莉亚睁开眼，先看见那双治人的手：“我在外头打了一夜，原来你在这儿替我守着门。”“跟谁打？”“女巫。”她笑了，“放心，她们没一个会治热病。我生下来就裹着衣胞——你那几句祷词，我也听见了。够烧咱们俩的。”阿玛娅没松手，低头吻了她。"
stage = "witness"
window = [[1557, 11, 15], [1558, 1, 31]]
at = "venice"
cast = ["cecilia", "amaia"]
speaker = "cecilia"
mood = "tender"
night = true
news = "将临期斋日那一夜，威尼斯码头后头面具铺的灯一直没灭；比斯开来的草药女天亮才推开门板出来。"

