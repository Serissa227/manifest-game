[[tracks.chapters]]
key = "tie_cecilia_amaia_turning"
title = "生来带着衣胞的人"
text = "里亚尔托桥下卖针线的弗留利货郎，这一夏逢人就讲家乡的新鲜事：阿奎莱亚的法庭把几个乡下人叫去问话，问他们斋日夜里去了哪儿。“被问的都一个说法，”货郎压低嗓子，“说自己生来带着衣胞。”码头后头的面具铺这一季天没黑就上门板。邻居问起，老板娘笑着说：“狂欢节还远着呢，脸卖不动。”跑比斯开铁船的水手说，她托他们往毕尔巴鄂带了三封信，一封比一封薄，最后那封捏在手里像是空的。阿玛娅在码头上拆开看了一眼：“就一个字。”她没等入冬的铁船，搭上了最早一条去地中海的船。"
stage = "rumor"
window = [[1575, 5, 1], [1575, 8, 31]]
at = "venice"
cast = ["cecilia", "amaia"]
mood = "tense"
news = "里亚尔托桥下的弗留利货郎说，阿奎莱亚的法庭在盘问他家乡几个乡下人：斋日夜里，你们都去了哪儿？"

[tracks.chapters.default]
next = "tie_cecilia_amaia_choice"
