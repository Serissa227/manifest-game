# —— 相识：1554 年春，梅里达修院学校的前院 ——
[[tracks.chapters]]
key = "pair_xochitl_ines_solis_meeting"
title = "两扇门"
text = "修院学校的前院，霍奇特尔蹲在台阶边理一包羽毛，嘴里哼着一首那瓦特语的歌。伊内斯抱着她的小册子凑过去，听了半段，挨着她坐下：“等一下——这个词我还没有。刚才那句，再唱一遍。”霍奇特尔斜了她一眼：“这算什么？墨西哥城的比这大十倍。”吹完了，她还是从头唱了一遍，比刚才慢。唱到一个词，伊内斯又打断她：“nochān，是什么？”“我的家。”“房子那个家，还是家里人那个家？”霍奇特尔张了张嘴，手里的羽毛转了两圈：“……都是。”伊内斯在小册子上画了两扇门，一扇底下写“房子”，一扇底下写“人”，两扇门中间，一个字母一个字母地拼上 nochān。廊下的嬷嬷拍了两下手。霍奇特尔把羽毛塞回布包，压低声音：“后半首，明天再教你。”"
stage = "witness"
window = [[1554, 2, 1], [1554, 4, 30]]
at = "merida_city"
cast = ["xochitl", "ines_solis"]
speaker = "ines_solis"
mood = "cheerful"
news = "梅里达修院学校的前院，监护主家的小姐跟着一个墨西加姑娘学那瓦特语的歌，嬷嬷说再唱就罚抄经。"

