# —— 转折：1562 年春，梅里达集市上的传闻 ——
[[tracks.chapters]]
key = "pair_xochitl_ines_solis_turning"
title = "第二辈的贡赋"
text = "梅里达的集市上，这阵子人人都在替索利斯家算账。尤卡坦的监护征赋按规矩只传两代，老索利斯就是第二代，他一闭眼，那几个村子的玉米和棉布就该归国王了。卖蜂蜡的女人说，办法总是有的：巴利亚多利德有位监护主，年纪是索利斯家小姐的两倍，前头死过一个太太，女儿嫁过去，两家的村子拴在一根绳上，贡赋就能再吃一辈子。婚期听说定在圣诞。“小姐要是不肯呢？”“不肯就送去墨西哥城的修院。梅里达到现在还没有收女人的修院，要关，只能关到那么远去。”挑水的老头插了一句：那个墨西加辅兵家的女儿，这几个月常在索利斯家的后门转，手里总拿着一卷东西，有时候是羽毛，有时候是纸。厨房的女佣开门接过一回，转身就揣进了围裙。"
stage = "rumor"
window = [[1562, 1, 15], [1562, 4, 30]]
at = "campeche"
cast = ["xochitl", "ines_solis"]
mood = "tense"
news = "索利斯家要把女儿嫁去巴利亚多利德，听说新郎的年纪是她的两倍；梅里达的人都说这门亲是为了贡赋。"

