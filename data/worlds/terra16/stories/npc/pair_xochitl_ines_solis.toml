# —— 抉择：1562 年夏，坎佩切码头后头的盐仓 ——
[[tracks.chapters]]
key = "pair_xochitl_ines_solis_choice"
title = "去墨西哥城的路"
text = "坎佩切码头后头的盐仓里，伊内斯把小册子翻到最后一页，摊在一袋盐上给我看。那一页的字比前面都小：缝补，一天两个雷亚尔；抄写，按页算；教孩子念书，管饭。每一行后面都打着问号，有几个问号已经划掉了。“这一页，我父亲没见过。”她说，“骑士出门以前，总得先知道路上吃什么。”霍奇特尔靠在门框上，捏着她表姐安娜从墨西哥城寄来的信：画坊缺一个会写西班牙字的帮手，记账、写扉页，肯来就先试工三个月。“我会贴羽毛，她会写字。”霍奇特尔说完停了一下，盯着地上的盐粒，“我从没去过墨西哥城。”伊内斯没抬头，把小册子合上：“那我们一起第一次去。”她把册子往我这边推了推：“你是走海的。从这儿到韦拉克鲁斯，要几天？”"
