#         《路得记》1:16“你往哪里去，我也往那里去……你的国就是我的国”；那瓦特语 nochān（我的家）。
#   原创——两人、那首那瓦特语的歌、小册子上的两扇门、巴利亚多利德那位监护主与婚期、运盐的小船、两页的木画夹。
#   待核——无（监护主的名字、婚约的条款都不写实）。
