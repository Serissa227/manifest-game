# —— 落点：1563 年初，墨西哥城安娜画坊的后屋与城外的湖（成为恋人；主角与其中一人立了 S 约定时静默失败，由 _side 轨道接）——
[[tracks.chapters]]
key = "pair_xochitl_ines_solis_together"
title = "扉页上的两种字"
text = "安娜画坊的后屋只有一扇朝北的窗。安娜探头丢下一句“边角料随你们用，柜子里的别动”，就回了前头。桌上摊着她们合做的头一件东西：一只能合上的木画夹，像一本只有两页的书。右边那页贴羽毛，霍奇特尔贴了七天，一只蜂鸟停在两扇门中间——一扇门框是棕的，一扇是蓝的，跟九年前小册子上那两扇一模一样。左边那页是扉页，要落款。“你先写。”伊内斯把笔递过去。霍奇特尔用那瓦特语写了一行，写得很慢。伊内斯在底下用西班牙语写同一句：你的国就是我的国。礼拜天，她们头一回出城去看湖。霍奇特尔站在堤上看了很久：“比我说的小。”“你吹了十年。”“九年。”霍奇特尔不肯认，转过脸来，“诺克纽——”话没说完，伊内斯踮起脚吻了她。湖上有人撑着独木舟过去，霍奇特尔没躲。"
