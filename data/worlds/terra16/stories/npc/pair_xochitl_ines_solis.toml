title = "撕下的那一页"
text = "坎佩切码头上，一条去韦拉克鲁斯的船正在装盐。霍奇特尔的行李只有一个布包和一只装羽毛的木匣，她把匣子的搭扣开了又扣，扣了又开。“墨西哥城的湖，”她说，“我闭着眼都认得路。”伊内斯“嗯”了一声，由着她说。她从怀里掏出小册子，翻到画着两扇门、写着 nochān 的那一页，顺着装订线一点一点撕下来，塞进霍奇特尔手里：“到了那边，替我看看，是不是真的比这儿大十倍。看完写信来，用那瓦特字写，我认得。”霍奇特尔没接话，掀开木匣，把那一页压在最底下一层绿羽毛下面，扣上搭扣。船上有人喊要开了。她走出两步，又回头：“那你呢？”“修院学校缺一个教女孩子念书的。”伊内斯晃了晃少了一页的册子，“我去试试。”霍奇特尔哼了一声，上了跳板。船出了港，伊内斯还站在码头的石阶上。"
