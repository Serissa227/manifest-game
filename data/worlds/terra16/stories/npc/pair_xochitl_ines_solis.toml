# —— 靠近：1556 年春，教理课上的《路得记》（学院期，到心照不宣为止）——
[[tracks.chapters]]
key = "pair_xochitl_ines_solis_closer"
title = "你的国就是我的国"
text = "教理课上，嬷嬷点伊内斯起来念《路得记》：“你往哪里去，我也往那里去……”后排忽然有人用那瓦特语哼了一句，是前院那首歌里的，意思差不多。霍奇特尔低着头，装作在数念珠。伊内斯念到“你的国就是我的国”，抬眼正撞上后排那双眼睛，下一句就念串了行。嬷嬷合上书：“抄十遍。”下了课，霍奇特尔抢过一半纸去抄，抄到第五遍，在页边添了一行那瓦特语，停了笔：“我们那首歌，比你们的书早。”“你怎么知道？”“我外婆说的。外婆的外婆就唱。”伊内斯没跟她争：“那我把两句都抄上。”她翻到画着两扇门的那一页，在门中间一行写卡斯蒂利亚语，一行写那瓦特语。霍奇特尔凑过来念给她拼，两人的头快碰到一块儿，又同时躲开。霍奇特尔抽出一根绿羽毛夹进那一页，合上册子，塞回她怀里。"
stage = "witness"
window = [[1556, 3, 1], [1556, 5, 31]]
at = "merida_city"
cast = ["xochitl", "ines_solis"]
speaker = "xochitl"
mood = "tender"
news = "梅里达修院学校的嬷嬷罚一个小姐抄《路得记》，帮她抄的是个墨西加姑娘，抄本页边多了一行谁也看不懂的话。"

[tracks.chapters.default]
next = "pair_xochitl_ines_solis_turning"
