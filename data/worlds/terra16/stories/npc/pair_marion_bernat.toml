# 五、落点：1559 年秋，圣约翰斯，最后一条回欧洲的船。缺省即圆满。
[[tracks.chapters]]
key = "pair_marion_bernat_together"
title = "没上船的人"
text = "回欧洲的最后一条船起锚了，桅杆一根根往外海退。贝尔纳特没有上船。他扛着鱼叉站在晒鱼的石滩上，站得像根桩子，一直站到帆变成一小片白。玛丽昂在棚屋门口算冬粮，算了三遍，把账本合上。“两份并作一份，省柴。”她没抬头。“棚屋只有一个炉子。”“所以才省柴。”她朝门里偏了偏头，“鱼叉别靠墙，靠门边，进来吃饭。”他把叉子靠在门边，进去了。"
