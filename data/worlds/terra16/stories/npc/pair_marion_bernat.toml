# 一、相识：1557 年夏，红湾码头。
[[tracks.chapters]]
key = "pair_marion_bernat_meeting"
title = "漏油的桶"
text = "红湾的码头上排着一溜空油桶。玛丽昂一到就拿指节敲桶板，敲一只报一个价，头也不回地对贝尔纳特说：“鳕鱼按担算，盐另算，耽误我晒鱼的工夫也算。你的桶，漏不漏？”他想，这女人眼里只有数。还没来得及回嘴，头顶滑轮的绳子崩了一股，吊着的桶往下一沉，他伸手去挡。“别用手挡！”她抢先拽住绳头，脚抵着木桩，“你的手是扎鲸用的。”桶落稳了，缝里却渗出一线油。“木头刚从冷处搬来，”他说，“要等一会儿才合缝。”玛丽昂搬了张凳子坐下：“那就一起等。”油还在滴，他骂了一句“arraio”，蹲下去把桶箍重新敲紧。"
stage = "witness"
window = [[1557, 7, 15], [1557, 9, 15]]
at = "red_bay"
cast = ["marion", "bernat"]
speaker = "marion"
mood = "cheerful"
news = "红湾的巴斯克鱼叉手被圣约翰斯来的布列塔尼女渔场主当面挑出一只漏油的桶，两人坐在码头上等了半个时辰。"

[tracks.chapters.default]
next = "pair_marion_bernat_closer"
effects = []

# 二、靠近：1558 年夏末，红湾滩上，雾里走散的小艇。
[[tracks.chapters]]
key = "pair_marion_bernat_closer"
title = "点人数"
text = "雾是午后涌上来的，天黑了也没散。出海的小艇少了一条，贝尔纳特站在滩上，回来一个人就点一个，点得比谁都慢。管事跑来问今年的油能不能照去年的价算，他头也不回：“我只管扎鲸，油价去问船东。找人就报名字——我数数他回来没有。”玛丽昂本是来对账的，回屋提了盏灯，在滩上陪他站着，一句没劝，灯油添了两回。半夜雾里有了桨声，他把名字一个个叫过去，叫到最后一个才吐出一口长气。第二天船东送来新的分成契约，他接过去，纸是倒着的。玛丽昂瞥了一眼，什么也没说，抽过来从头念，念得很慢：“这一条是油价。你要问，就问这一条。”"
stage = "witness"
window = [[1558, 8, 1], [1558, 9, 30]]
at = "red_bay"
cast = ["marion", "bernat"]
speaker = "bernat"
mood = "tender"
news = "红湾有条捕鲸小艇在雾里走散了一夜，听说滩上提灯陪鱼叉手站到半夜的，是圣约翰斯来的那个布列塔尼女人。"

[tracks.chapters.default]
next = "pair_marion_bernat_turning"
