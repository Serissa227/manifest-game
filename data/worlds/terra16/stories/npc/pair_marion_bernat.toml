# 三、转折：1559 年冬，圣约翰斯的粮食见底（街谈）。
[[tracks.chapters]]
key = "pair_marion_bernat_turning"
title = "只喝汤的冬天"
text = "街上传得最多的是这个冬天。圣约翰斯留下过冬的人，粮吃到二月就见了底，棚屋里的人开始数饼干。听说那个布列塔尼女渔场主把自己的盐肉全搬了出来，一块块分掉，自己只喝汤，连肉渣都不捞。有伙计说：“分肉的时候她还在念数呢。”伙计们打赌，开春第一条船进港时她准瘦了一圈，账本上却一笔不少，连她自己喝掉的那几勺汤也记着，欠自己的。"
stage = "rumor"
window = [[1559, 1, 15], [1559, 3, 31]]
at = "st_johns"
cast = ["marion", "bernat"]
mood = "sad"
news = "圣约翰斯留守过冬的人，粮吃到二月就见了底；听说布列塔尼女渔场主把自己的盐肉都分了，自己只喝汤。"

[tracks.chapters.default]
next = "pair_marion_bernat_choice"
effects = []

# 四、选择：1559 年夏，圣约翰斯，账页与过冬的粮。
[[tracks.chapters]]
key = "pair_marion_bernat_choice"
title = "账页的第一行"
text = "玛丽昂把账页摊在石滩边的木桌上，先列伙计的份额：几个人，几担粮，几块盐肉，一行行排下来，没有一行是她自己的。她转头对我说：“今年还留人过冬，粮要从外面运。你走一趟，我照市价付，一个子儿不少。”送油来的贝尔纳特站在桶边没动。她又补一句，眼睛仍盯着账页：“你今年回不回吉普斯夸？不回的话，冬天没有鲸可扎，活我不派你，粮照给，记账。”鱼叉手看了她半天。“我不要免工。”他说，“我要的是，以后也能说一声累。”玛丽昂没答话，笔尖在账页最上面悬了一会儿，落了下去。"
stage = "involve"
window = [[1559, 7, 1], [1559, 8, 31]]
at = "st_johns"
cast = ["marion", "bernat"]
speaker = "marion"
mood = "tense"
news = "圣约翰斯的布列塔尼女渔场主今年要留人过冬，听说她当着伙计的面，问红湾来的鱼叉手肯不肯不回老家。"

