# C7 故事线（重写）：玛丽昂 × 贝尔纳特《冰海里的热汤》
# 标签：GB（异性）；两位都是原创人物，一个抠门的渔场主和一个点人数点得最慢的鱼叉手。
# 人物：玛丽昂（f，1530-11-06，布列塔尼人，在纽芬兰圣约翰斯开渔场）；贝尔纳特（m，1531-01-16，吉普斯夸的巴斯克人，拉布拉多红湾捕鲸站的鱼叉手）。生年差 1 年，全程都是成年人（1557 年起 26—27 岁）。先开口的是玛丽昂。
# 依据：
#   史实——16 世纪巴斯克人在拉布拉多红湾设捕鲸站，夏末到初冬捕鲸、熬油装桶；布列塔尼人在纽芬兰沿岸捕鳕、晒鳕鱼；1576—77 年冬天红湾有几条船被冰封、不少人死在那里（据考古与档案，正文只用“据说”）。
#   原创——玛丽昂与贝尔纳特这两个人、两份冬粮、雾里走散的小艇、冬天里的盐肉与汤；晒鱼的石滩与棚屋格局是想象。
#   不写 1565 年圣胡安号沉没（归 tie_new_martin_itsas_elene_urruti）。
#   待核：16 世纪 50 年代圣约翰斯是否已有人留下过冬（据说有零星的守棚人，本线只写小规模）；红湾捕鲸分成契约的具体形式。
# 缺省走向：不论有没有人插手，1558 年雾夜之后两人心照不宣（crush）；1559 年秋最后一条回欧洲的船开走时，贝尔纳特没有上船，两人在圣约翰斯同炉过冬，成为伴侣（圆满）；1576—77 年红湾的冰封之冬，他那条艇的人靠两份冬粮活了下来。玩家的帮助只改变路上的样子（落点的变体）。没有坏结局。
# 读写的共享旗标：
#   写 c7_pair_marion_bernat_helped（choice 选 grain）、c7_pair_marion_bernat_mediated（choice 选 ledger）、c7_pair_marion_bernat_together（together 缺省）。
#   不读外部旗标；together 的两个 variants 读上面的 helped / mediated。
# 日程变更：无。together 只写贝尔纳特“留在圣约翰斯过冬”，静态日程（玛丽昂 st_johns、贝尔纳特 red_bay）不改。
# 整合须知：cast/ties.toml 里 marion_bernat 写“partners，since 1560-12-31”，晚于本线落点（1559-10 起）；整合时建议改到 1559-12-01 之前，或保持原样（静态关系只是晚了一年生效，不冲突）。
# 口头禅各用一次：玛丽昂“鳕鱼按担算，盐另算，耽误我晒鱼的工夫也算。”（meeting）；贝尔纳特“我只管扎鲸，油价去问船东。找人就报名字——我数数他回来没有。”（closer）。
# 保密：贝尔纳特不识字，只写动作与玛丽昂的举动，正文不点明，news 永远不写。

[[tracks]]
key = "pair_marion_bernat"
name = "冰海里的热汤"
kind = "request"
