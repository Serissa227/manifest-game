key = "pair_marion_bernat_epilogue"
title = "封冰的海湾"
text = "据说去年冬天红湾封了冰，几条船困在湾里出不去，开春才有人上岸去数，熬油的人死了不少。有一条小艇的人全活了下来，艇头那个巴斯克鱼叉手秋天上艇时背了两份冬粮，麻袋口缝着一圈红线。有人问他怎么想得到的，他说：“有人非要我带。”那个人在圣约翰斯，是个算账的布列塔尼女人，每年入秋都往他艇上塞这一份。"
