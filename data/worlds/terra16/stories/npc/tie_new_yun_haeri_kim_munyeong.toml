# 相识：1559 年春夏，釜山纸铺。她当面改了他草稿里的“怒”字，他认了。
[[tracks.chapters]]
key = "tie_new_yun_haeri_kim_munyeong_meeting"
title = "改了一个字"
text = "金文永抱着草稿来纸铺配纸，要誊一封给倭馆的回函。海梨从架上抽出一张楮皮纸，在手心里抹了一把：“滑的是正面，写字要用涩的这面，才吃墨。”她低头，看见柜台上摊开的草稿，没等想完，指头已经戳在末一行：“这个字错了——纸有正反，话别翻错。”那一行写的是“伏乞怒之”。她改别人的稿子向来趁人不在，这回话出了口，收不回来。金文永盯着看了半天，耳根一点点红了上去，没恼，把草稿往她那边推了推：“请把原话，一字不差地再说一遍。你说该是哪个字？”“恕。”海梨拿裁纸刀的刀背点着，“女字旁边你写成了又，该是口。倭馆的人读到这儿，只当你请他们发怒。”他提笔改了，又要了三十张纸。海梨多数了两张塞给他：“涩面朝上。”"
stage = "witness"
window = [[1559, 3, 1], [1559, 7, 31]]
at = "busan"
cast = ["yun_haeri", "kim_munyeong"]
speaker = "yun_haeri"
mood = "cheerful"
news = "釜山浦纸铺的女儿给译官家的学徒配纸，一眼看出他草稿里把“恕”写成了“怒”；学徒红着脸认了，回函照改。"

