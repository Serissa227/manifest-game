news = "釜山通事房的头目看了纸铺女儿校过的三页稿子，一个错字也挑不出，破例放她进了值房。"

[[tracks.chapters.choices]]
key = "carry_proofs"
text = "替她把校好的稿子连夜送进值房，赶在回书封口以前。"
reply = "我赶到值房时，回书已誊到末页，蜡盘也端上来了。海梨在稿子上圈了三处朱笔，头一处就在抬头：岛主姓宗，誊写的人给“宗”字头上添了座山，成了“崇”，信就写给了别人。金文永接过去，凑着灯一个字一个字地核，三处都补上了。蜡还烫手，他抬头看我：“她圈的是哪三个？你念给我听。”我把三个字念给他听。他点点头，封了口。"
