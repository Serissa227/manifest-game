# 转折（传闻）：1587 年春，倭船袭损竹岛以后，釜山值房的文书堆成山。不写 1592 年。
[[tracks.chapters]]
key = "tie_new_yun_haeri_kim_munyeong_turning"
title = "损竹岛"
text = "二月里，倭船摸到全罗道的损竹岛，守将死在岛上。消息走了半个月才到釜山，倭馆那边先是静得出奇，接着往来的文书像涨潮一样涌进值房：问罪的，辩白的，打听消息的，封封都要配纸、校字。“纸铺的架子都空了，”隔壁卖鱼的说，“尹家那位还在一张张挑，说新到的楮皮纸涩面不匀。”值房门口的差役说，纸铺的女儿来得比点卯的还勤：“我问她急什么，她说，这个当口错一个字能要人命。”金通事也没闲着，倭馆送来的一封书契，他叫送信的人重念了三遍：“‘不胜惶恐’，是赔不是，还是问罪？先说清这个，我再往下译。”"
stage = "rumor"
window = [[1587, 3, 1], [1587, 6, 30]]
at = "busan"
cast = ["yun_haeri", "kim_munyeong"]
