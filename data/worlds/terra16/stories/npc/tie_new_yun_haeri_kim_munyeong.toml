# 抉择：1589 年夏，纸铺。回书要从釜山过，通事的头目不让她进值房；帮她进门，或把她校好的稿子赶在封口前送进去。
[[tracks.chapters]]
key = "tie_new_yun_haeri_kim_munyeong_choice"
title = "国书的纸"
text = "对马的宗氏来了，请朝鲜派使，去见日本的新主人。朝廷的回书走到釜山，要配最好的纸，过最挑剔的眼。海梨把楮皮纸一刀一刀码齐，拇指被裁纸刀划了道口子，缠着布条。“头目说女人进不了值房，”她说得很快，“纸，他们照样拿去用；校字的人，他们另找。”金文永靠在门框上，行李已经捆好：“回书一封口，我就得跟船走。”海梨抱起一沓纸放到我面前，纸上朱笔密密麻麻，是她夜里校过的。“纸有正反，”她说，“这回我想自己翻。”"
stage = "involve"
