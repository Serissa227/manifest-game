[[tracks.chapters.choices]]
key = "plead"
text = "去找通事的头目说情，让她当面配纸、校字。"
reply = "头目是个脸瘦得像刀背的老人。我只说了一句“请您先看三页”，他没吭声，把海梨校过的稿子拉到灯下，一行行看，指头一路点到末页，一个错字也没挑出来。“女人家，认得几个字？”“认得错的。”海梨说。头目咳了一声，把门让开了。她在值房里校了三夜，我在门外守着。第三夜，金文永端着灯出来，把一页纸举给我看：背面最角落，一个极小的“尹”字，墨还没干。“她说，回书是朝廷的，纸是尹家的。”他压低了声音。"
next = "tie_new_yun_haeri_kim_munyeong_landing"
