# 靠近：1565 年夜里，纸铺后院的焙房。她替他校两边道歉的小册子，说出想亲自出使；父亲的鼾声就在隔壁。
[[tracks.chapters]]
key = "tie_new_yun_haeri_kim_munyeong_closer"
title = "两边怎么道歉"
text = "夜里，纸铺后院的焙房烘着一壁的纸，每隔半个时辰要翻一次面。海梨翻完一遍，就回灯下看一眼他的册子。册子分三栏：这边怎么说，倭馆那边怎么说，哪一句说重了会出事。“惶恐”两个字，倭馆有三种讲法，每一种差一级，他誊到第三遍，笔还是悬着。“这句轻了，”海梨拿朱笔在页边画圈，“人家会听成你不认账。”“重了呢？”“重了，他们拿去当字据，你认的罪就记进账里。”她放下朱笔，忽然说：“我想自己去一回。站在对马的码头上，把这些话一句一句说给他们听。”金文永没笑，把笔搁下：“你再说一遍。”她又说了一遍，声音比头一遍大。铺面那头她爹的鼾声顿了一下，又接上了。"
stage = "witness"
window = [[1565, 3, 1], [1565, 7, 31]]
at = "busan"
cast = ["yun_haeri", "kim_munyeong"]
speaker = "kim_munyeong"
mood = "tender"
night = true
news = "釜山译官家的学徒在编一本记两边人怎样赔不是的小册子，替他校字的是纸铺的女儿，两人常常对着灯到三更。"

