[[tracks.chapters]]
key = "tie_extra_04_naya_sayo_matsuru_landing"
title = "磨毛的手巾"
text = "小夜又到那霸，进门先听见茶筅响。真鹤跪在席上点茶，手腕松了，碗面浮起一层匀匀的细沫。她拿手巾擦过碗沿，才把碗推过来——那手巾白麻洗得发灰，边上磨出了毛，正是三年前小夜搭在架子上的那条。“都成这样了。”小夜伸手要拿去扔。真鹤按住：“还能用。”小夜把茶喝干净：“那明天一起去挑条新的，旧的你留着。”第二天在港口的布摊前，小夜一眼挑中最细的那块苎麻，真鹤从她手里抽走：“不必带贵的东西。”两个人为一条手巾跟摊主讲了半天价，摊主最后抹了零头，催她们快走。"
