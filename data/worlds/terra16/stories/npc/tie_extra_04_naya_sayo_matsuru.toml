[[tracks.chapters.choices]]
key = "carry_tea"
text = "我这趟正好去那霸，茶和信纸交给我。"
reply = "到那霸那天，真鹤坐在檐下，膝上摊着几条折了一半的手巾。她先揭开茶罐闻了闻，才去翻那沓信纸。最上面一张有字，是小夜的笔迹：“这张是给你自己的。”真鹤捏着它，对着檐外的光照了照，折成小小一方，搁回茶罐里，只对我说：“替我告诉她，这罐我不煮。”其余的纸，她当天下午就挨家送了出去。"
next = "tie_extra_04_naya_sayo_matsuru_landing"
