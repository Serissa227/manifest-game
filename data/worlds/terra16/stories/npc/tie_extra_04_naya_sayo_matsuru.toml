news = "那霸的祝女收到了堺捎来的新茶和一沓信纸，是个顺路的船长送上门的；当天下午，三户等船的人家都拿到了纸。"

[[tracks.chapters.choices]]
key = "wait_for_letter"
text = "先讨一碗茶，坐等她给真鹤写上一句。"
reply = "小夜给我点了一碗，自己提起笔。写一张，揉了；又写一张，又揉了。我那碗见了底，第三张才写成，只有一句：“下回你来堺，我替你看一次门。”门框那边，枫低低笑了一声。小夜头也不回：“笑什么，你又不懂茶。”说完把那张纸折好，别在了茶罐的封口上。"
next = "tie_extra_04_naya_sayo_matsuru_landing"
