# C7 配角线（故事 2.0，A5 / E37 契约）：会磨毛的手巾——纳屋小夜 × 真鹤，朋友。
# 走向：客→友（一罐茶到一条手巾）。
# C21b 改（2026-11-12，Claude Opus）：只删腔调（“看了很久”“压到底下”“一张一张裁得齐齐整整”一类）。剧情、旗标、效果不动。
# 标签：GL 人物之间的友情线（两人都是纯 GL；小夜的恋人是百地枫，见 tie_naya_kaede；真鹤没有恋人）。全线不写恋爱。
# 人物：纳屋小夜（1534-04-13，堺的茶家女儿）；真鹤（1534-07-01，那霸的祝女）。1573 年起两人都已三十九岁上下。
# 依据：十六世纪堺与琉球之间的商船往来；琉球的祝女（noro）替出海的人祈平安；奄美当时归琉球管，北上南下的船在那里避风；
#   琉球的苎麻与芭蕉布；点茶用茶筅、擦碗用白麻布，粗茶（番茶）可以煮。
#   原创：两人的交往、1574 年那条迟到的堺船（船上三个那霸水手）、奄美避风的经过、手巾与信纸。
#   去重：1575 年萨摩责备琉球使船归 tie_new_kogo_mae_sumi，本线 1574 年只写一条迟到的商船；真鹤折姊妹神手巾送济州归 tie_matsuru_haewol，
#   本线的手巾是小夜留下的擦碗布。枫只在堺的茶室门口出现，只说是护卫。
# 缺省走向：1573 相识（friends）→ 1574 船迟到（传闻）→ 1575 茶与信纸照样寄到那霸，晚一个月 → 1576 那霸布摊前挑新手巾（friends，回忆）。
#   玩家不在场时每章照走 default，结局相同：茶与手巾之交。
# 旗标：写 c7_tie_extra_04_naya_sayo_matsuru_helped（替小夜送茶到那霸）、_letter（等小夜写完给真鹤的那句话）、_landing（落点）；
#   落点章的 variants 读本文件的 _helped / _letter。不读外部旗标。
# 日程：不改。小夜 1573、1576 年到那霸是故事里的往来，cast 日程照旧；cast/ties.toml 的 extra_04 friends（since 1573）不变。

