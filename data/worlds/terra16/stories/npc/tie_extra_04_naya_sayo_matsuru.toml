[[tracks.chapters]]
key = "tie_extra_04_naya_sayo_matsuru_turning"
title = "没到的船"
text = "入秋以后，堺的码头上常有人打听：开春去那霸的那条船，怎么还没信儿？它赶着最后一阵北风出的港，算日子早该到了，可那霸那边说，连帆影都没见着。船上有纳屋家托带的茶，还有三个在堺船上跑了好些年的那霸水手。从那霸回来的船家说，那边的祝女这阵子挨家挨户地走，水手的老娘说一句、媳妇说一句，她记一句，原话照记。“收齐了一起寄，”她说，“船要是先回了堺，话就先在那儿等着。”立冬前，纳屋家的伙计在茶屋里漏了口风：小姐收到那霸的信了，三家人的话，字写得端端正正。小姐翻了两遍，只说：“她自己的话，一个字也没写。”"
stage = "rumor"
window = [[1574, 8, 1], [1574, 11, 30]]
at = "sakai"
cast = ["naya_sayo", "matsuru"]
mood = "tense"
news = "堺的码头上都在说，开春去那霸的那条船到秋天还没见帆影；那霸的祝女替船上水手的家里人把话收齐，托船捎到了堺。"
rumor_days = 60

