text = "小夜又到那霸。真鹤点了一碗茶推过来，这回起了沫；擦碗沿用的还是三年前小夜留下的那条白麻手巾，边上早磨出了毛。小夜伸手要扔，真鹤按住：“还能用。”她从茶罐底下抽出一张折成小方的纸，是去年那沓信纸最上面的一张，如今写了一行字：“想要一罐煮了也不苦的茶，自己喝。”小夜盯着那行字：“那是番茶，算不得茶。”隔了一会儿又说：“下回给你带。”第二天两个人去港口的布摊挑新手巾，旧的真鹤留着。小夜看中最细的苎麻，真鹤说不必带贵的东西，她们跟摊主讲了半天价。"

[[tracks.chapters.variants]]
key = "letter"
when = [{ kind = "flag", flag = "c7_tie_extra_04_naya_sayo_matsuru_letter" }]
text = "小夜又到那霸，还没进门，真鹤就指了指门槛：“信上说替我看一次门。堺我去不成，就看这扇吧。”小夜在门槛上坐了一个时辰，打发走两个来问船期的人，里头的茶筅才停。那碗起了沫；擦碗的是三年前小夜留下的白麻手巾，边上磨出了毛。“都成这样了。”小夜要拿去扔。真鹤按住：“还能用。”小夜说：“那明天一起挑条新的，旧的你留着。”第二天在港口的布摊前，真鹤把小夜挑的那块细苎麻放了回去：“不必带贵的东西。”两个人为一条手巾跟摊主讲了半天价。"
