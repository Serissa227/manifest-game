[[tracks.chapters]]
key = "tie_extra_04_naya_sayo_matsuru_choice"
title = "替谁带茶"
text = "那条船总算有了下落：开春遇上大风，被推回北边，在奄美的一个小湾里修舵等风，一躲就是一年，人都在。北上的船把消息捎到堺，还捎来那三个那霸人各一句口信。纳屋家的茶室里，新茶已经装罐封好。小夜跪在席上裁纸，裁了二十几张，一笔没写，是给那三家人回话用的。枫靠在门框上，眼睛只看着巷口。“她替所有人收话，”小夜把最后一张压平，“就没人替她收。”她这才抬头看我：“你这一趟，去不去那霸？”新茶的罐子在她手边，封口的纸还潮着。"
