[[tracks.chapters]]
key = "tie_extra_04_naya_sayo_matsuru_meeting"
title = "茶怎么这么苦"
text = "去年，堺的商船回来说，那霸有位祝女替一船人祈过平安。小夜托船给她捎去一罐新茶，回信只有三个字：“苦得很。”开春，小夜自己搭船来了。还没进门就闻见一股药味——灶上的陶罐咕嘟作响，真鹤把茶叶当药煎，说要煎足半个时辰才出味。小夜把罐子端下灶，取出茶筅教她点。真鹤的手腕太硬，头两碗打出一层浑水，第三碗才浮起细沫。她盯着那层沫看了一会儿，没夸一句，起身推开竹窗，浪一下一下拍在礁上：“你的茶室里，有没有这种静？”小夜端起碗：“茶先喝完，再谈有没有。”她在那霸住了半个月。走的那天，茶筅留在真鹤的架子上，擦碗的白麻手巾也搭在旁边。"
stage = "witness"
window = [[1573, 3, 1], [1573, 6, 30]]
at = "naha"
cast = ["naya_sayo", "matsuru"]
speaker = "matsuru"
mood = "cheerful"
news = "那霸港边传开了：堺的茶家女儿专程搭船来教祝女点茶。祝女先前把茶当药煎了半个时辰，这回点到第三碗，总算起了沫。"
rumor_days = 60

