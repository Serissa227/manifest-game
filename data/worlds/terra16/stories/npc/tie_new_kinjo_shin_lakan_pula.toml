# 唐人船带来的信（tie_new_kinjo_shin_lakan_pula）——配角线，标签 BL；新线，恋爱线（遗憾的远距，仍是恋人）。
# 人物：金城真（kinjo_shin，1540-11-13 生），那霸进贡船书记家的少年，学院同学，口头禅“先认岛，再认旗”；
#       拉坎·普拉（lakan_pula，1540-01-19 生），汤都大督家旁支的少年，学院同学，口头禅“先听船夫怎么说”。
#       两人不同学（一个在那霸使节家，一个在汤都家学），1566 年在汤都头一回见面，时年 25、26 岁。
#       全线都在成年以后：1566 年相识（friends）；1568 年知己（confidants）；
#       1572 年恋人（lovers，窗口起日两人 31、32 岁；最早可用日 1558-11-13）。落点以前不写告白，两种结局都接得上。
# 依据：
#   史实——琉球王府的南洋官方贸易 1570 年前后停止；1571 年 6 月汤都与马卡贝贝的船队在邦库赛迎战黎牙实比的西班牙人，汤都失利，
#         随后西班牙人在马尼拉立城。正文不写战场，只写开战前的河口，“最后一趟官船”写成那霸港的传闻。
#   待核——琉球官船是否直航吕宋汤都、船上书记的编制、沿途岛名（宫古、八重山、与那国、巴丹、巴布延）取的是常见的航路说法。
#   原创——两人的故事；册子上两种字的潮汐页（“东头退得快”）；七十二文铜钱；船舷上的一炷香；舱里那张折起来的纸；
#         唐人船带回的油布信与信尾的话。
#   秘密——金城真把渔火认成港口灯的耻事，只在 closer 里对拉坎说出口，见闻不写；
#         拉坎不肯拿家里放出去的债逼邻人白划船，不明写，只留 meeting 里“记在账上就行”和“现钱”两句。
# 缺省走向：1566 汤都相识（friends）→ 1568 夜里认潮，金城真说出那件耻事（confidants）→ 1570 那霸港的传闻，南下的官船怕是最后一趟，金城真还是上了船
#   → 1571 邦库赛开战前，琉球船要走（缺省：船走了，金城真最后看见的是拉坎举起的一只手）
#   → 1572 唐人船从吕宋带来拉坎的信，他们成为恋人（落点，缺省即发生；遗憾的远距，往后靠唐人船通信）。
#   玩家能做的：把自己的船泊在河口守着水道，替琉球船多讨一潮，舱里说完没说完的话（旗标 helped，落点变体：信里提到那一夜）；
#   或答应替拉坎往那霸带一封信（旗标 matched，落点变体：这是第二封，第一封压在册子最底下）。都不改变结局。
#   主角与两人之一立了 S 约定（c7_tie_new_kinjo_shin_lakan_pula_taken）时，主轨道在落点静默失败，由 _side 轨道写两人成为隔海的朋友。
# 设旗标：c7_tie_new_kinjo_shin_lakan_pula_helped、_matched（落点变体读）、_together、_side。
# 读旗标：c7_tie_new_kinjo_shin_lakan_pula_taken（由 bond_kinjo_shin、bond_lakan_pula 的 S 章设）。
# 整合：cast/ties.toml 新增 kinjo_shin × lakan_pula（BL）；金城真日程在那霸，随船到汤都是故事内的出行，不改日程。

