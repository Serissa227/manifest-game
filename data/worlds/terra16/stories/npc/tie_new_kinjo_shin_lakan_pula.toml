# 抉择：1571 年夏，汤都河口。邦库赛开战前，琉球船只等一潮。不写战场。
[[tracks.chapters]]
key = "tie_new_kinjo_shin_lakan_pula_choice"
title = "船要走"
text = "湾口外，西班牙人的船一条挨一条列开。汤都的战船在河口点起火把，要去邦库赛拦他们，拉坎家的船也在里头。琉球船的管事往船舷上插了一炷香：“就等这一潮。香烧完就起锚，开战以前我们得出湾。”金城真站在船头，拉坎站在码头上，中间隔着一片退下去的水，泥滩上晃着火把的影子。“拉坎！”金城真喊，“先认岛，再认旗——这回我认不出了！”拉坎手里攥着木盾，没有笑：“你认不出什么？”金城真张了张嘴。册子里什么都记了，偏偏没有这一页。两个人同时转过头，看向泊在河口边的那条船。我的船。"
stage = "involve"
window = [[1571, 5, 15], [1571, 7, 31]]
at = "tondo"
cast = ["kinjo_shin", "lakan_pula"]
mood = "tense"
news = "西班牙人的船在马尼拉湾外列开，汤都的战船在河口点起火把；河口那条琉球船的管事说，只等这一潮。"

