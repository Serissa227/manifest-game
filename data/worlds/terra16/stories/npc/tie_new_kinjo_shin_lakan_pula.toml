# 靠近：1568 年春夏，马尼拉湾里的一条小船。认潮，认灯；金城真说出那件耻事。
[[tracks.chapters]]
key = "tie_new_kinjo_shin_lakan_pula_closer"
title = "一起认潮"
text = "琉球的船又来了。拉坎划着一条小船，带金城真认马尼拉湾的潮：“东头的水退得快，一落潮就是泥滩。北边那片礁，涨满了就沉下去看不见，吃水深的船最爱往那里撞。”金城真一条一条记进册子，拉坎看了一眼，抢过笔在页边添了五个字：东头退得快。字丑得像螃蟹爬。夜里小船泊在湾心，岸上的灯火星星点点。金城真忽然说：“十七岁那年夜航，我把一盏渔火认成了港口的灯，报了一声‘到了’。舵手抛下铅锤，船离礁只剩半个船身。这事我没对人说过。人人都夸我认路准，我一听就想起那盏灯。”拉坎没有笑，抬手指向远处水面上的一点亮：“那盏呢？”金城真看了很久：“……渔火。”“那你这回认对了。”拉坎把桨递给他，“划过去看看。”"
stage = "witness"
window = [[1568, 3, 1], [1568, 6, 30]]
at = "tondo"
cast = ["kinjo_shin", "lakan_pula"]
speaker = "kinjo_shin"
mood = "tender"
night = true
news = "马尼拉湾心夜里泊着一条小船，船上两个人一盏灯一盏灯地认，认到天亮才划回汤都。"

[tracks.chapters.default]
next = "tie_new_kinjo_shin_lakan_pula_turning"
