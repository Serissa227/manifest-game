# 转折（传闻）：1570 年冬，那霸港。南洋官船怕是最后一趟，书记家的少年还是上了船。
[[tracks.chapters]]
key = "tie_new_kinjo_shin_lakan_pula_turning"
title = "最后一趟南下"
text = "那霸港的船坞里，管仓的老头一边验缆绳一边叹气：“往南洋去的官船，这一趟怕是最后一趟了。南边的买卖一年不如一年，王府早不想再派。”卖缆的接话：“书记家那个小子倒还上了船。”“我劝过，”老头说，“他把册子往我眼前一拍——马尼拉湾的潮水，一页上两种字，一种工整，一种像螃蟹爬。‘东头退得快，’他念出来，‘汤都的拉坎写的。我答应过他，开春就到。’”卖缆的摇头：“答应的事，他倒都写在纸上。”北风起了，船乘着风往南去了。"
stage = "rumor"
window = [[1570, 10, 1], [1571, 1, 31]]
at = "naha"
cast = ["kinjo_shin", "lakan_pula"]
mood = "sad"
news = "那霸港的人说，往南洋去的官船这一趟怕是最后一趟了，王府不想再派；书记家的儿子还是上了船，说是答应过人。"

