# 落点（恋爱，缺省即发生）：1572 年春夏，那霸港。唐人船带来一封信。主角与两人之一立过 S 约定时此章静默失败，改走 _side。
[[tracks.chapters]]
key = "tie_new_kinjo_shin_lakan_pula_landing"
title = "唐人船带来的信"
text = "那霸港来了一条从吕宋回航的唐人船，船夫举着油布包，在码头上喊：“哪位是金城书记？”金城真拆开。字很丑，横不平竖不直，沿途的岛名却一个不错——巴布延，巴丹，与那国，八重山，一路排回那霸，像有人用手指在海图上走过一遍。他读了两遍，第二遍读得很慢，像在背岛名。底下才是正事：拉坎活着，汤都换了主人，他仍旧在河口替船夫谈价。信尾一句：“下回你来，先认我。”南下的官船不再开了，往后十年，信只有唐人船肯带。金城真先把信抄进书记的册子，再托下一条往南去的唐人船带回信。回信他当场写在原信的页边，只有一行：“先认你，再认岛，再认旗。”"
