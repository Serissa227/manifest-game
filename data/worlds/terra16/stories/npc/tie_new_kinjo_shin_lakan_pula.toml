# 相识：1566 年春夏，汤都河口。筵席里背岛名，筵席外数铜钱。
[[tracks.chapters]]
key = "tie_new_kinjo_shin_lakan_pula_meeting"
title = "筵席外的价"
text = "大督的筵席摆在河口，铜锣一声接一声。琉球船的书记金城真站在席边，合着铜锣的拍子报沿途的岛：“宫古，八重山，与那国，巴丹，巴布延——”一个不差，席上没几个人在听。他退出来透气，嘴里还在往下背。石阶下蹲着一圈船夫，当中那个年轻人衣襟缝着大督家旁支才有的窄蓝边，人却蹲在泥里，一枚一枚往船夫手里数铜钱。“记在账上就行，少爷。”老船夫说。“现钱。”那人把最后一枚拍进老船夫掌心，“数清了再动桨。”拍掉膝上的泥，他笑着去船边找琉球的管事，三句话压下两成价。金城真等他回来，迎上去：“我们那边讲，先认岛，再认旗。你这里，是先认船夫。”“先听船夫怎么说。”那人笑出了牙，“拉坎。”“金城真。七十二文，我数了。”"
stage = "witness"
window = [[1566, 3, 1], [1566, 6, 30]]
at = "tondo"
cast = ["kinjo_shin", "lakan_pula"]
speaker = "lakan_pula"
mood = "cheerful"
news = "汤都河口来了条琉球船。大督的筵席上书记把岛名背了一路，筵席外的旁支少爷却蹲在河边，先给船夫数了钱，才去谈货价。"

