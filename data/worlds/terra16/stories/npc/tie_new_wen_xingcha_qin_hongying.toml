# C7 故事 2.0（A5 / E37 契约）· 配角线 · 友情（知己）· 标签 GL（女性之间的非恋爱线）
# 人物：温星槎（wen_xingcha，1498-07-07，月港的老领航，不开放恋爱）；
#       秦红缨（qin_hongying，1532-11-21，月港镖局的女镖头，纯 GL；恋人是沈知微，见 pair_qin_hongying_shen_zhiwei，本线不写）。
#       两人是老少知己：全线不写心动、不写暧昧，也不写解释两人关系的话。
# 依据：史实——1562 年秋戚继光率浙兵入闽，八月攻宁德横屿（士卒负草填泥、乘退潮过滩），九月破福清牛田；
#       1567 年（隆庆元年）月港开海，准贩东西洋，私船改为领船引出洋。
#       原创——两人的交情、码头边的“今天不开船”、望海楼（泛称，不指史载的哪一座楼）、刀鞘上的刻痕、
#       最后一趟私船、船引上多出来的一个人。
#       待核：开海头一年船引的格式（船名、去处、人数）与发引的月份；1566 年那一季“最后一趟私船”之说，正文只作码头上的说法。
# 缺省走向：1555 码头相识（tie friends）→ 1559 望海楼上学看云脚（tie confidants，回忆“云脚”）
#       → 1562 戚家军入闽的传闻，镖局生意少了一半 → 1566 最后一趟私船，老领航没上成船，腿疼了一冬
#       → 1567 开海后头一批领船引的船，老领航是客、女镖头押货（tie confidants，回忆“第一张船引”）。
#       玩家能做的：替她另找一条稳当的船（_helped），或劝她等开海（_waited）；都不改结局，落点章按旗标换正文。
# 旗标：写 c7_tie_new_wen_xingcha_qin_hongying_landing、_helped、_waited；_helped / _waited 只在本文件落点章的变体里读。
#       不读任何外部旗标。
# 日程：不改 cast。两人 1553—1590 都在月港码头；1566 年那一个月的出海、1567 年的开船都是故事里的往来。
# 不写：宝船队的过洋牵星图（林晚灯的支线），老领航只看云脚与眼前的天；1567 年小蛮出洋、假账变真账、周砚的开海账一概不借；
#       1555 年在场的“我”可能还是学院期的林晚灯，不写主角的性别与外貌。
# 窗口（2026-11-01 close-places）：choice（involve，“最后一趟私船”）由 1566-08..11 挪到 1567-01-01..02-08（还是嘉靖四十五年腊月，冬季东北风下南洋）：
#   月港 1567 年以前休眠，玩家进不了港，选项与落点的 _helped / _waited 变体都走不到。正文“明年要开海”改“开了春就要开海”，
#   劝等的选项、回复与见闻随之改“开春开海”“等几个月”；落点章（1567-05..09）的“去年”改“年初”，“连着第二年出海”改“这一年第二回出海”。

