[[tracks.chapters]]
key = "tie_new_wen_xingcha_qin_hongying_choice"
title = "最后一趟私船"
text = "都说开了春就要开海，往后出洋得先领船引；这一季下南洋的私船，就是月港最后一趟了。温星槎在码头上站了一早上，见人来，就把竹杖往身后藏。她说她还想上一回船，看一眼外头的星，就搭秦红缨押货的这一条。她今年六十八了。“不行。”秦红缨嘴上说不行，手却已经在点船上的人：火长、舵工、水手，点完一遍，又从头点起。老领航不理她，转过头来看着我：“你说，我这把骨头，还认得外头的星吗？”"
