[[tracks.chapters]]
key = "tie_new_wen_xingcha_qin_hongying_meeting"
title = "今天不开船"
text = "船主站在跳板上连声催，说潮水不等人。秦红缨照老规矩，先点人：六个伙计，一个不少；再点银箱：一口，封条完好。码头边的石墩上坐着个老婆婆，嚼着槟榔，仰头看了好一阵天，开口道：“今天不开船。”“婆婆，这船不归您管。”秦红缨头也没回。老婆婆也不恼，像打更似的，一句一顿：“别急着问西洋之西，先把眼前的星认全。你看那云脚，拖得像扫帚。”船主笑出了声。秦红缨朝西南看了一眼，弯腰把银箱扛上肩，下了跳板。船主骂了句晦气，自己解缆走了。当夜起了大风，港外翻了两条船。第二天一早，秦红缨提着一包糕满码头找人，卖鱼的朝石墩那边一努嘴：“温婆婆？月港最老的领航。”"
stage = "witness"
window = [[1555, 3, 1], [1555, 7, 31]]
at = "yuegang"
cast = ["wen_xingcha", "qin_hongying"]
speaker = "wen_xingcha"
mood = "tense"
news = "月港码头有个嚼槟榔的老婆婆，看了好一阵天，说今天不开船；女镖头当场把银箱扛下了跳板，当夜港外就翻了两条船。"

