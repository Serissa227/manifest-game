[[tracks.chapters.variants]]
key = "helped"
when = [{ kind = "flag", flag = "c7_tie_new_wen_xingcha_qin_hongying_helped" }]
text = "这是温星槎这一年第二回出海了。年初她搭别的船回来说的那句“外头的星，跟我年轻时一样”，秦红缨拿刀刻在了镖局的门板上，伙计们进进出出都看得见。今年月港开了海，头一批领了船引的船挂帆待发。秦红缨押着舱里的货，跟着书办念的船引点人，点到最后多出一个。“客不算。”书办说。“我这儿算。”她把那一个添在镖单末尾，往跳板前一蹲。走到跳板中间，老领航在她背上说：“镖能赔，人得回来——这回我是镖，你得把我带回来。”“少废话，看云。”温星槎在船头坐定，抬头看了一眼：云底是平的。"

[[tracks.chapters.variants]]
key = "waited"
when = [{ kind = "flag", flag = "c7_tie_new_wen_xingcha_qin_hongying_waited" }]
text = "月港开了海，头一批领了船引的船挂帆待发。年初说好的等到开海，温星槎一天也没多等：船引刚发下来，她就拄着竹杖坐到了码头上。秦红缨押着舱里的货，跟着书办念的船引点人，点到最后多出一个。“客不算。”书办说。“我这儿算。”秦红缨把那一个添在镖单末尾，往跳板前一蹲。走到跳板中间，老领航在她背上说：“镖能赔，人得回来——这回我是镖，你得把我带回来。”“少废话，看云。”温星槎在船头坐定，抬头看了一眼，云底是平的：“我说什么来着，星又不会跑。”"
