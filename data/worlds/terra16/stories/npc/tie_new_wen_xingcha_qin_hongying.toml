[[tracks.chapters]]
key = "tie_new_wen_xingcha_qin_hongying_closer"
title = "云脚"
text = "望海楼的楼梯陡，温星槎走到第三级就站住了，说这楼梯修歪了。秦红缨不跟她争，往她跟前一蹲。到了楼顶，老领航拿蒲扇点着天，一句一句地考：“那片，底是平的——”“好天。”“那片底下拖着丝——”“要变。”“拖得像扫帚呢？”“别出门。”老领航只给了两个字：“还行。”秦红缨的拇指在刀鞘上蹭了蹭。鞘上刻着一道印子：前年她把拖丝看成了平底，那趟镖在九龙江上淋了三天雨，湿了两箱茶，回来她拿刀刻上的。天擦黑，她又把人背下楼，放在码头的石墩上：“镖能赔，人得回来。你也算一趟镖。”温星槎拍了拍膝盖：“是那楼梯修歪了。”"
stage = "witness"
window = [[1559, 4, 1], [1559, 8, 31]]
at = "yuegang"
cast = ["wen_xingcha", "qin_hongying"]
speaker = "qin_hongying"
mood = "tender"
news = "月港镖局的女镖头隔三岔五背着老领航爬望海楼，两个人在楼顶指着云说话，一说说到天黑，再背下来。"

