[[tracks.chapters]]
key = "tie_new_wen_xingcha_qin_hongying_turning"
title = "戚家军到了"
text = "月港码头的茶棚里，人人都在说浙江来的戚家军：横屿的倭巢隔着一片烂泥滩，兵丁每人背一捆草，趁退潮铺着走过去，一天就破了；转过月，福清的牛田也破了。有人拍着桌子说海上要太平了，也有人压着嗓子说，太平了，官府就该来管船了。镖局冷清了一季，来请镖的船主少了一半，伙计们蹲在门槛上掷骰子。秦红缨坐在门里擦刀，擦完往鞘里一送，拇指在那道印子上停了停：“生意少一半，人一个没少。”温星槎在茶棚里听完，把茶碗往桌上一搁：“管船也好。船总得有人看天。”"
stage = "rumor"
window = [[1562, 9, 1], [1562, 12, 31]]
at = "yuegang"
cast = ["wen_xingcha", "qin_hongying"]
mood = "tense"
news = "月港茶棚里都在说，浙江来的戚家军背着草捆踩过烂泥滩，破了横屿的倭巢，牛田也破了；码头上的镖局倒冷清了一半。"

