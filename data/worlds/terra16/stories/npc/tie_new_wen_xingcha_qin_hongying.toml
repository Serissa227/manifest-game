[[tracks.chapters]]
key = "tie_new_wen_xingcha_qin_hongying_landing"
title = "第一张船引"
text = "月港开了海，头一批领了船引的船挂帆待发。年初那趟私船，温星槎到底没上成，腿疼了一冬；船回来时断了一根桅杆。开春以后，她天天拄着竹杖来码头。秦红缨押着舱里的货，跟着书办念的船引点人，点到最后多出一个。“客不算。”书办说。“我这儿算。”秦红缨把那一个添在镖单末尾，往跳板前一蹲。走到跳板中间，老领航在她背上说：“镖能赔，人得回来——这回我是镖，你得把我带回来。”“少废话，看云。”温星槎在船头坐定，抬头看了一眼：云底是平的。"
