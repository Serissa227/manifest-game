title = "留下的那一页"
text = "风头过去了。打烊时我是最后一位客人，坐在炉边等一杯续茶。法蒂玛擦完最后一只杯子，从旧书里抽出一页纸，放到苏莱曼面前，纸边被炉火烘得微黄，写的是打烊以后那盏灯。“以后要写，就写在这儿，写给我一个人看。”苏莱曼捏着纸角：“夫人，这算求婚吗？”“算你运气好，我的眼睛。”她隔着桌子吻了他，很短，才转头看我：“杯子明早来收。外头问起，就说炉火旺。”"
