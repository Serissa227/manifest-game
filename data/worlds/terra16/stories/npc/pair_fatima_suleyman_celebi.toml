# 相识：1557 年早春，塔赫塔卡莱的咖啡馆。他拿新写的诗抵三杯咖啡的账，她把账本翻给他看。
[[tracks.chapters]]
key = "pair_fatima_suleyman_celebi_meeting"
title = "赊诗不赊咖啡"
text = "傍晚的咖啡馆挤满了挑夫和书记。靠炉的矮桌边，宫里的书记苏莱曼·切莱比喝空了第三只杯子，从袖口抽出一张纸按在桌角：“夫人，波斯的诗人说，一首诗抵得过一座城。我只想抵三杯咖啡——新写的，抵今天的账。”法蒂玛没接，把账本翻到当日那页推给他。“远客，诗可以慢慢写，伙计今晚要吃饭。”他脸红到领口，一枚一枚数出银币。她这才拿起那张纸，夹进手边的旧书，没有夹进账本。我坐在门边的凳子上，看她把书页压平。"
