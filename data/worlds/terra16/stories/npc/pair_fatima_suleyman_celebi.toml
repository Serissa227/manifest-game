title = "打烊以后"
text = "打烊以后，法蒂玛留下了苏莱曼。凳子翻上桌面，炉里只剩红炭，一盏油灯放在两人中间。这是她定的规矩：新诗只念给她一个人，念完再走。这一晚他念到写宫里的那一句，忽然收了声。“怎么停了？”“这句写的是宫里的事。”苏莱曼把纸放低，“诗可以删，写过这件事不能装没有。”法蒂玛没叫他删。她把灯往他那边挪近一掌：“念完。我听着。”"
