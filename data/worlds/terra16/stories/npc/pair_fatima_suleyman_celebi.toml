# 烧哪一页（pair_fatima_suleyman_celebi）——配角线，标签 GB；恋爱线（成年人之间）。
# 人物：法蒂玛夫人（fatima，1526-03-23 生，女，只对男性开放恋爱），伊斯坦布尔塔赫塔卡莱咖啡馆的女主人，守寡多年；
#       苏莱曼·切莱比（suleyman_celebi，1527-12-14 生，男，对男女皆可），宫廷书记兼诗人，白天誊诏书、夜里写自己的诗。
#       生年相差一岁九个月。全线两人都已成年：1557 年相识（法蒂玛 30—31 岁、苏莱曼 29 岁）；1558 年心照不宣（crush）；
#       1560 年恋人（lovers，窗口起日 1560-01-15，法蒂玛 33 岁、苏莱曼 32 岁；两人都满 18 且不早于 1557-01-01 的最早可用日是 1557-01-01）。
# 依据（史实）：1555 年前后伊斯坦布尔有了第一批咖啡馆（塔赫塔卡莱一带）；1559 年 5 月巴耶济德王子在科尼亚兵败，
#       夏天逃往波斯，1561 年在波斯被处死；据说他曾写诗向父亲求情，宫里追查过替他抄信、藏他诗稿的人。
#       正文只用“据说”，不引原诗。
# 原创：两人的故事、青布裹着的诗集、写伙计与常客名字的几页、只写了一盏灯的一页、“诗抵账”与“后屋读诗”的规矩；
#       伙计与差役无名。诗集不影射任何史实人物的恋情。
# 秘密：cast 没有写明法蒂玛、苏莱曼各有什么要隐瞒的秘密（法蒂玛“大维齐尔府里的事”属于她自己的请托，本线不碰）。
# 缺省走向（无人插手）：meeting 苏莱曼用诗抵账被拒，成了常客 → closer 1558 打烊后念诗，他念到宫里的句子自己停下，
#       法蒂玛不叫他删（crush）→ 1559 夏天科尼亚兵败的传闻（rumor）→ 秋天他把诗集交给她；她一页页翻，
#       烧掉写伙计与宫里的几页、王子的诗，只留下写灯的那一页夹进自己的书 → 1560 春，她把那页给他看，
#       两人成为不公开的恋人（lovers，圆满；写到一个吻为止）。没有坏结局。
#   帮助：把诗集缝进帆布带上船（_helped）→ 落点变体：诗集在船上，“海上比宫里安全”。
#   岔开：差役来问时替苏莱曼把话岔开，说他欠货钱（_covered）→ 落点变体：苏莱曼把货钱塞给玩家。
#   旁观：不插手，亲眼看她一页页决定；只加好感，结局与缺省相同。
#   玩家不替两人决定爱不爱；选项只影响诗集的去向和落点章的一段变体。
# 共享旗标：写 c7_pair_fatima_suleyman_celebi_together（落点）、_helped、_covered；不读外部旗标。
# 不需要 _taken 门禁：这两人都不是学院同学。法蒂玛与米丽娅姆的友情归 tie_new_fatima_miriam，本文件不写米丽娅姆。
# 日程：两人 1553—1590 一直在伊斯坦布尔（cast 已是），不用改。
# 关系（整合方改 cast/ties.toml）：fatima_suleyman_celebi 的静态 lovers 的 since 由 [1559,12,31] 改为 [1560,1,15]，
