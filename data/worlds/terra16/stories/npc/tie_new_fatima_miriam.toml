[[tracks.chapters]]
key = "tie_new_fatima_miriam_closer"
title = "压下来的一句话"
text = "宫里账房的一个书记坐在炉边，喝到第二杯，嗓门就大了：“那个基拉拆过一位夫人的信——”法蒂玛提着壶过来给他添杯。壶嘴压得极低，咖啡细细一线往下淌，半天才满。她这才开口：“我的眼睛，你科尼亚老家那几峰骆驼，今年下崽了没有？”书记说起骆驼，一说就是一顿饭的工夫，那封信再没提起。礼拜四米丽娅姆来，法蒂玛把那半句话原样学给她听。米丽娅姆的杯子停在嘴边：“哪位夫人？”法蒂玛说了。“那封是绿蜡，压着石榴印。我交到她侍女手里时，石榴叶子一片没缺。那是假话。”“我知道。”法蒂玛把壶搁回炉上，“所以没让它出这个门。”米丽娅姆看了看怀里的包裹，弯腰把它放在了门口那张凳子上。人还站着，那杯咖啡头一回是两手捧着喝完的。"
stage = "witness"
window = [[1570, 3, 1], [1570, 7, 31]]
at = "istanbul"
cast = ["fatima", "miriam"]
speaker = "miriam"
mood = "tender"
news = "宫里账房一个书记在伊斯坦布尔塔赫塔卡莱的咖啡馆说基拉的闲话，女主人给他添杯添得极慢，又问起他家的骆驼，话就转走了。"

