[[tracks.chapters]]
key = "tie_new_fatima_miriam_choice"
title = "咖啡馆里的话"
text = "那句话是从别家咖啡馆传过来的：替太后跑腿的那位基拉拿太后的人情换钱，谁想谋个差事，先往她的包裹里塞金币。这一回压不住了，塔赫塔卡莱一条街上三家咖啡馆都在说，说到后来，连塞的是威尼斯金币还是匈牙利金币都有人说得出。礼拜四米丽娅姆来了，脸白得跟她怀里那摞封好的信一个颜色。她站在门口，只说了半句：“信没拆开……”后半句就接不上了。法蒂玛放下壶走过去，两只手扶住她的肩，把她按在门口那张凳子上。十五年了，米丽娅姆头一回坐上这张凳子，只坐了半边，腰还挺得笔直。法蒂玛转过身来对我说：“火我看着。你替我去看看，这话是从哪个门里出来的。”"
stage = "involve"
window = [[1578, 4, 1], [1578, 8, 31]]
at = "istanbul"
cast = ["fatima", "miriam"]
speaker = "fatima"
mood = "tense"
news = "伊斯坦布尔的咖啡馆里传一句对基拉不利的话；塔赫塔卡莱有一家的女主人把传话的人请出了门，不许他再来，那句话还是传了一整个夏天。"

