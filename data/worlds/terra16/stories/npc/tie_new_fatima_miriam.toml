[[tracks.chapters]]
key = "tie_new_fatima_miriam_turning"
title = "新太后的门槛"
text = "入冬以后老苏丹没了，新苏丹从马尼萨赶回来即位，他的母亲成了太后。塔赫塔卡莱的挑夫们说，宫里的门槛一夜之间高了三寸：从前替贵妇跑腿的那位基拉，如今替太后办事，进出要过三道门，每道门都有人翻她的包裹、记她的时辰。宫门外卖芝麻圈的听见她对翻包裹的人说：“封蜡别碰，碰坏了你去跟太后解释。”有人说她发了，太后赏的一匹料子够买半条街；也有人在鱼市远远见过她一回，说她瘦了，走得飞快，谁喊都不回头。咖啡馆门口那张凳子上，礼拜四照旧摆着一杯，拿碟子盖着，一连好几个礼拜没人来喝。常客们看见女主人等过了晌午，揭开碟子，站在门口把凉了的咖啡喝掉，杯子扣回凳子上。有人问她等谁，她反问：“我倒一杯咖啡，还得跟你报账？”"
stage = "rumor"
window = [[1575, 1, 1], [1575, 4, 30]]
at = "istanbul"
cast = ["fatima", "miriam"]
mood = "tense"
news = "伊斯坦布尔新苏丹即位，太后的门槛高了三寸；塔赫塔卡莱那家咖啡馆门口礼拜四的那一杯，好几个礼拜没人来喝。"

