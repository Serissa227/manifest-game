[[tracks.chapters]]
key = "tie_new_fatima_miriam_meeting"
title = "多停一会儿"
text = "塔赫塔卡莱这家咖啡馆门口有张矮凳，是给挑夫歇脚的。每个礼拜四晌午，宫里的基拉米丽娅姆抱着一摞封好的包裹从门前过，走到凳子边总要停一停，一回比一回停得久，却从没坐下过。门口的常客爱逗她：“今天又是哪位夫人的？”她笑着拿西班牙话回一句，常客里没一个听得懂。法蒂玛在炉子后头看了好些个礼拜四，什么也没问。这天她又在凳子边停下，法蒂玛端了一杯出来，脚尖把凳子往前一拨：“火我看着，你先把信收好。”米丽娅姆没坐。她把包裹从右臂换到左臂，封蜡朝着自己，站着小口小口地喝完，把杯子递回去：“信没拆开，也能把事办好——你的咖啡也是。”“我问过你什么没有？”“就是没问。”下一个礼拜四，凳子上先摆好了一杯，拿碟子盖着。"
stage = "witness"
window = [[1563, 4, 1], [1563, 8, 31]]
at = "istanbul"
cast = ["fatima", "miriam"]
speaker = "fatima"
mood = "cheerful"
news = "伊斯坦布尔塔赫塔卡莱那家咖啡馆，每个礼拜四门口的凳子上都多摆一杯；替宫里跑腿的那位基拉路过，站着喝完就走。"

