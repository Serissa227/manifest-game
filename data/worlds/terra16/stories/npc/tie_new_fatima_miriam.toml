# C7 配角线（新线，Claude）：tie_new_fatima_miriam「门口那张凳子」——遵循 A5 / E37 故事 2.0 契约。
# 标签：GL（ties.toml 记 GL），女性之间的非恋爱线：知己。全线不写心动、不写暧昧，也不写“她们不是恋人”一类的说明句。
# 人物：法蒂玛夫人 fatima（1526-03-23，女，取向 m，塔赫塔卡莱咖啡馆的女主人，守寡多年）；
#   米丽娅姆 miriam（1532-02-24，女，纯 GL，替后宫女眷采买、传信的犹太女代理人“基拉”）。
#   两人差六岁，本线没有任何恋爱效果，年龄门禁不涉及。两人的恋人（苏莱曼·切莱比、亚斯明）与诗集、《列王纪》
#   各归 pair_fatima_suleyman_celebi、pair_yasmin_miriam，本线不写；落点那卷要烧要留的诗是一个年轻禁卫军落下的，与苏莱曼无关。
# 依据：C7 总决定 §4.2 第 8 条、§三、§五；cast/story_islamic.toml 两人的 persona（法蒂玛称熟客“我的眼睛”、不高兴就把杯子推远；
#   米丽娅姆记得每一个封口，会几种话）。
#   史实：1554—55 年前后伊斯坦布尔的塔赫塔卡莱开了最早的咖啡馆；后宫的犹太女代理人称“基拉”（kira），替后宫女眷和太后采买、传信——
#   职位是史实，本线不用任何真实基拉的姓名与遭遇，不写 1600 年的事，不预言。1574 年 12 月塞利姆二世去世，穆拉德三世从马尼萨赶回即位，
#   母亲努尔巴努成为太后（valide sultan）。托普卡帕宫外朝有三道门（帝王门、致敬门、吉祥门），正文只作街谈。
#   原创：两人的友情；门口给挑夫歇脚的凳子与礼拜四的那杯咖啡；1570 年账房书记的闲话与他科尼亚老家的骆驼；
#   1578 年咖啡馆之间的传言、放话的书记（就是 1570 年那一个，被撵出账房后报复）；绿蜡石榴印；皮匠家的女儿；禁卫军的诗。
#   待核：1575 年起太后是否已住进托普卡帕宫的后宫（正文不写，只说“门槛高了”）；1570 年代加拉塔的酒馆（只在回复里一笔带过）。
# 缺省走向（玩家什么也不做）：meeting（1563 春夏，门口凳子上多一杯，friends）
#   → closer（1570 春夏，法蒂玛慢慢添杯把书记的闲话转走，米丽娅姆第一次把包裹放在凳子上；confidants + 回忆）
#   → turning（1575 年初，传闻：新太后的门槛高了三寸，礼拜四的那杯好几个礼拜没人喝）
#   → choice（1578 春夏，三家咖啡馆传她卖太后的人情；缺省：法蒂玛把传话的人请出门，话传了一个夏天才淡）
#   → landing（1579 春夏，十六年来米丽娅姆第一次自己坐下，坐了两杯咖啡的工夫；confidants + 落点旗标 + 回忆）。
#   玩家插手只改变那句话怎样平息（查出放话的人／站在法蒂玛身边），不改变落点。
# 旗标：设 c7_tie_new_fatima_miriam_helped（choice：查出放话的人）、c7_tie_new_fatima_miriam_stood（choice：留在法蒂玛身边）、
#   c7_tie_new_fatima_miriam_landing（落点 default）；不读外部旗标。
# 秘密：cast 里米丽娅姆的秘密（多年前拆过一封信，又封好）只在 closer 留一处含蓄的伏笔——她只替书记说的那一封作证；
#   见闻（news）一律不写。法蒂玛知道的大维齐尔府的事不提。
# 整合：cast/ties.toml 新增 fatima × miriam（relation = confidants，tags GL，story = tie_new_fatima_miriam；落点日期以前可记 friends）；
#   日程不变（两人 1553—1590 都在 istanbul 的 tavern）。

