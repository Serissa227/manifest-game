[[tracks.chapters.choices]]
key = "trace_rumor"
text = "顺着这句话一家家问回去，找出头一个放话的人。"
reply = "我从街口那家问到街尾那家，又一路问到加拉塔的一间酒馆，问出来的都是同一个人：一个刚被宫里账房撵出来的书记。他经手的太后采买账里，有三处虚价是基拉挑出来的。酒馆里有人记得他拍着桌子说：“她挑我的账，我就挑她的名声。”我把这句话一字不改带回塔赫塔卡莱，站在炉边念了一遍。满屋子先是没人出声，后来有人噗地笑了。法蒂玛问：“科尼亚有骆驼的那个？”第二天，三家咖啡馆都在说别的事了。米丽娅姆从凳子上站起来，从法蒂玛手里接过壶，把我的杯子添满。"
next = "tie_new_fatima_miriam_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_fatima_miriam_helped" }, { kind = "affinity", person = "miriam", value = 5 }]
news = "伊斯坦布尔传基拉卖太后人情的那句话，查到一个被宫里账房撵出来的书记头上；塔赫塔卡莱有人把他的原话当众念了一遍，第二天就没人提了。"

[[tracks.chapters.choices]]
key = "stand_by_fatima"
text = "留下来给法蒂玛端碟子，看她怎么对付这一屋子闲话。"
reply = "法蒂玛提着壶一桌一桌添过去，不快不慢，每桌都问一句家常，我跟在后面端碟子。添到靠窗那桌，正有人说到“太后的人情”，她把壶往桌上一放，把那人的杯子往外推了一寸：“这桌的咖啡，今天我不卖。”那桌三个人愣了半晌，扔下几枚铜钱走了，从此再没来过。法蒂玛回到炉边，接着看她的火。我把这半天的咖啡钱放在柜台上，她又推了回来。"
next = "tie_new_fatima_miriam_landing"
effects = [{ kind = "flag", flag = "c7_tie_new_fatima_miriam_stood" }, { kind = "affinity", person = "fatima", value = 5 }]
news = "塔赫塔卡莱那家咖啡馆的女主人提着壶一桌桌添杯，添到说基拉闲话的那桌，把壶一放：今天这桌不卖。伊斯坦布尔人说，那三个人再没去过。"

[[tracks.chapters]]
key = "tie_new_fatima_miriam_landing"
title = "第一次坐下"
text = "礼拜四晌午，米丽娅姆照旧在门口停下。这张凳子她路过了十六年，去年被人按着坐过半边；今天她看了它一会儿，把包裹放在脚边，自己坐了下去，裙摆铺满了凳面。法蒂玛端来一杯，又拖了只小凳坐在她对面，眼睛隔一会儿就往那包裹上扫一下，像看着炉上的火。她们说的都是别的事：皮匠家的大女儿要嫁到布尔萨去，嫁妆箱的锁是米丽娅姆替她挑的；一个年轻的禁卫军在店里落下一卷诗，法蒂玛拿不准哪首该烧、哪首该留，一首首念给她听。“这首烧了，韵押得像点名。”“那这首呢？”“留着，写的是你这炉子。”两杯咖啡的工夫过去，米丽娅姆才起身，把包裹抱回怀里：“下礼拜我还坐。”法蒂玛把她的杯子扣在凳子上：“凳子给你留着。”"
