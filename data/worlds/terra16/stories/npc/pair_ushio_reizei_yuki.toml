# —— 抉择：1556 年秋，结业前的空信封（学院期，只到心照不宣）——
[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_choice"
title = "空着的信封"
text = "结业前，行李摊满了廊下：汐的是一只缠着麻绳的木箱，雪的是三摞用包袱皮捆好的歌稿。两人一道来找我，雪手里拿着一个信封，封面一个字也没写。里头是这一年两人合抄的歌，一首汐的，一首雪的，交替着往下排，汐那一半的字，越往后越稳。“以后她的信，”雪先开口，眼睛只看着信封，“都托你转？”汐不看她，看院子里那棵松：“船上没人认得冷泉家的门。”“那就让她认得。”雪的口气比平时还客气，客气得像在跟谁置气。汐的脚尖在廊板上一下一下地点，一块、两块、三块，像在数船板。信封递到我面前，两个人都不出声了，等我开口。"
