text = "冷泉家下向中村传歌，歌会的船在四万十川口靠岸。汐的船在下田港等了三天。雪上了船，把一个油纸包摊在舱板上：两年里汐的每一封信，按日子叠好。封面上冷泉家的门，从第一封起就是汐自己写的，头一封的字大得占了半个信封，一封比一封小，到最近几封，已经和雪的字一般大了。最底下一叠更旧，是宫里那几年汐写坏了扔进纸篓的字纸，一张一张抹平了。汐一把按住那叠字纸：“这些你也捡？”“《兰亭》上还涂了好几处呢，后人照样当宝贝。何况纸是好纸。”雪指着信封上的门：“门写对了，名字还没写过。写我的名字。”汐挑亮灯，写了一个“雪”，第三个才端正。她还要写，雪握住了她拿笔的手，把头靠在了她肩上。"

# —— 尾声：1566 年起，过能岛交帆别钱的船（传闻）——
[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_epilogue"
title = "帆别钱的船"
text = "村上家的女儿回了能岛，有了自己的船，船头插着村上家的过所旗。内海跑船的人说，这几年在能岛交帆别钱，钱交完，岛上的人总要多问一句：往京都去不去？去的，就多揣一封信上路，帆别钱照收，一文不少。十条船里，总有一条替京都捎过信。京都那头，冷泉家的门房如今隔着半条街就认得能岛的旗，船家还没开口，他已经伸手来接信了。又有人说，村上家的女船头每年秋天必上一趟京都，回来时舱里多一册新抄的歌，油纸包了三层，塞在罗盘匣子底下，不许人碰。有个新上船的伙计不懂规矩，伸手去摸，被她一句话骂了回去：“那是我的海图。”"
stage = "rumor"
window = [[1566, 5, 1], [1566, 7, 31]]
at = "noshima"
cast = ["ushio", "reizei_yuki"]
mood = "cheerful"
news = "能岛的船家说，这几年过岛交钱的船，十条里有一条替京都捎信，收信的是冷泉家，寄信的是村上家的女船头。"

