key = "pair_ushio_reizei_yuki_together"
title = "不经第三人的信"
text = "冷泉家下向中村传歌，歌会的船在四万十川口靠岸。汐的船在下田港等了三天。雪上了船，把一个油纸包摊在舱板上：两年里汐寄来的每一封信，按日子叠好，字一封比一封稳；最底下一叠更旧，是宫里那几年汐写坏了扔进纸篓的字纸，一张张抹平了，一张没少。汐抽出最底下那张歪字，手一下攥紧了：“这些你也捡？”“《兰亭》上还涂了好几处呢，后人照样当宝贝。”雪说，“何况纸是好纸。”她拣出一封，指着封面上“请人转交”四个字：“往后别写这个。写我的名字。”汐挑亮灯，铺开新纸，写了一个“雪”。头一个太大，第二个墨洇了，第三个才端正。她还要写，雪握住了她拿笔的手。灯芯噼地响了一声，雪没松手，另一只手把那张写坏的“雪”抽过去，压在了油纸包的最底下。"
