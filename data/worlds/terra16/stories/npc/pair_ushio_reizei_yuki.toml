# —— 转折：1555 年秋，严岛的消息传进宫里（传闻）——
[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_turning"
title = "严岛的消息"
text = "十月里西边来了消息：毛利家在严岛打垮了陶晴贤，据说替毛利封海的，是能岛村上家的船。话传进宫里，女房们才对上号——那个走路太响、一口濑户内口音的侍女，就是村上家的女儿。“海贼家的丫头”从背后的话成了当面的话，听说有人在廊下拦住她，问她家里那几天杀了多少人。她没答，转身走了。第二天的歌会上，冷泉家的小姐不等点名就站起来，念了一首咏濑户内海的旧歌，出处一句一句报得清清楚楚：《万叶集》卷十五，遣新罗使的船从那片海上过时作的。念完，她问满座的人：“这片海，如今是谁家的船在守？”没人接话。守夜的老女官说，那天夜里她看见村上家的侍女在廊下给家里写信，冷泉家的小姐坐在一旁替她研墨，研到砚里的墨浓得化不开。"
stage = "rumor"
window = [[1555, 10, 16], [1555, 11, 30]]
at = "kyoto"
cast = ["ushio", "reizei_yuki"]
mood = "tense"
news = "严岛那一仗传到京都，宫里有人笑村上家的侍女，冷泉家的小姐当众念了首濑户内海的旧歌，把笑声压了下去。"

