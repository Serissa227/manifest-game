# —— 相识：1554 年春，宫中女房的局里练歌合 ——
[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_meeting"
title = "划掉的三个字"
text = "月底有歌合，女房的局里先练，题是“春夜”。汐跪在最末一席，轮到她，也写了一首：夜里退潮，船底一寸一寸搁到沙上。年长的女房传着看，笑了：“海边人家的字，像缆绳打的结。”冷泉雪接过去看了看：“侍女也能写歌。”话音没落，她已经提了笔——“潮”改成“松风”，“沙”改成“苔”，“船底”改成“衣袖”，海边的歌成了宫里的歌。末了她把最后一个字也划了：“少一个字更好。”汐把纸拿回去，当着她的面，三处一道一道划掉，旁边写回自己的字：“你听过夜里退潮么？”满屋子等着冷泉家的小姐发作。雪拿指甲点了点那三道墨杠，一道一道点过去，把笔搁回砚边：“划得好。下回别让我改得动。”我在帘后看见，汐写回了三处，唯独那个被划掉的末字，没有添回去。"
stage = "witness"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["ushio", "reizei_yuki"]
speaker = "reizei_yuki"
mood = "cheerful"
news = "京都宫里传，冷泉家的小姐改了一个侍女的歌，侍女当场划了回去，两人谁也不让谁，满屋女房看了一下午热闹。"

[tracks.chapters.default]
next = "pair_ushio_reizei_yuki_closer"
effects = [{ kind = "tie", a = "ushio", b = "reizei_yuki", relation = "rivals" }]

# —— 靠近：1555 年七夕散场以后，鸭川上的川舟（白绢后的赠答归 bond_reizei_yuki，这里不写）——
[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_closer"
title = "撑船回去的路"
text = "七夕的流之座散了。冷泉雪从袖子里摸出一张折好的纸，塞进汐手里，什么也没说。汐展开看了一眼，是一首歌，写的是退潮以后船搁在沙上、等下一次涨潮的那种等——汐想过许多回、一句也念不出口的话。她把纸折回去，跑到鸭川边，跟渔家借了一条浅底的川舟，篙往岸上一点：“上来，我送你。”雪提着衣摆踏上船板，船身一晃。汐伸手扶住她的胳膊：“这船底是平的，一晃就往一边歪，你往船中间站，脚分开，别抓船舷，抓了它更歪。”雪低头，看见扶着自己的那只手，指缝里嵌着没洗净的墨，新的压着旧的。她没有问。一路只有篙点水的声音。到了出町的河岸，汐把那张歌纸叠成拇指大的方块，没还，也没道谢，说的是鸭川今晚的水比昨天低了半尺。雪下了船，又回头：“念不出来就别念，我知道写的是什么。”汐把篙往岸上一点，船退回了河心。"
stage = "witness"
window = [[1555, 8, 15], [1555, 8, 31]]
at = "kyoto"
cast = ["ushio", "reizei_yuki"]
speaker = "ushio"
mood = "tender"
news = "七夕夜里，鸭川上有人看见一条小舟，撑篙的是宫里一个侍女，坐船的是冷泉家的小姐，一直撑到出町的河岸，一路没出声。"

