text = "冷泉家下向中村传歌，歌会的船在四万十川口靠岸。汐的船在下田港等了三天。雪上了船，把一个油纸包摊在舱板上：两年里汐的每一封信，按日子叠好，封面上一律是那个转信人的名字，底下一个小小的“转”字，旁边一道歪浪；最底下一叠更旧，是宫里那几年汐写坏了扔进纸篓的字纸，一张一张抹平了。汐一把按住那叠字纸：“这些你也捡？”“《兰亭》上还涂了好几处呢，后人照样当宝贝。何况纸是好纸。”雪把那个画着浪的信封抽出来：“托人转了两年，该告诉那位了。往后写我的名字。”汐挑亮灯，写了一个“雪”，头一个太大，第二个洇了，第三个才端正。她还要写，雪握住了她拿笔的手，灯花又爆了一回。"

