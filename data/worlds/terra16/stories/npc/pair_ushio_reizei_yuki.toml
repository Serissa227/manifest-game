[[tracks.chapters]]
key = "pair_ushio_reizei_yuki_side_landing"
title = "并排的两个名字"
text = "汐押着一船土佐的鲣节上京，交了货，顺路拐进冷泉家。雪正在廊下晾新抄的歌册，墨还没干透，一页一页摊在竹席上，拿镇纸压着。汐蹲下去看，翻到中间一页停住了：一首写夜里退潮的歌，署名“土佐的汐”，挨着雪自己的一首，排在一处。冷泉家的歌册，从没收过侍女出身的人的歌。“字太丑了，”汐说，“你抄的时候不会替我改改？”“改了，你又要划回去。”雪把镇纸挪开一寸，“丑也是你的。”汐不吭声，在竹席边上坐下，从怀里摸出一张皱巴巴的纸：“船上写的，你挑挑。”雪看了一行就皱眉，提笔要改，汐伸手按住。两人就这么在廊下对了一下午的歌，一首也没让过，天黑时，竹席上又多了三张划满墨杠的纸。"
stage = "witness"
window = [[1558, 9, 1], [1558, 11, 30]]
at = "kyoto"
cast = ["ushio", "reizei_yuki"]
speaker = "reizei_yuki"
mood = "cheerful"
news = "冷泉家新抄的歌册里有一首写退潮的，署名是土佐的汐，排在冷泉雪的歌旁边，京都的歌人说这是头一回。"
