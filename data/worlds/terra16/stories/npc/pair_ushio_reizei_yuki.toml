# 人物：汐 ushio（1540-01-01，能岛村上家的女儿，澪的乳姐妹，学院期扮作侍女进宫；1557—1565 在土佐中村，1566 起回能岛做女船头）
#     × 冷泉雪 reizei_yuki（1540-02-04，歌道冷泉家的小姐，一直住京都）；生年差 0 年。
#   各章年龄：meeting（1554 春）两人 14；closer（1555-08）15；turning（1555 秋）15；choice（1556 秋）16——学院期，只到心照不宣，不写任何恋爱效果；
#   together（1558-09-01 起）汐 18、雪 18，恋人效果最早可用日 1558-02-04，此章窗口不早于它；epilogue（1566）两人 26。
# 依据：
#   史实——1555 年（弘治元年）十月的严岛之战，毛利元就破陶晴贤；能岛村上水军替毛利封海一说（正文用“据说”）；
#         《万叶集》卷十五的遣新罗使歌（濑户内海的旧歌，正文只报出处、不引原文）；能岛村上家的过所旗与帆别钱；
#         土佐一条氏的中村被叫作“小京都”；冷泉家的人常下向诸国传歌；土佐下田港在四万十川口。
#   原创——练歌合时雪改汐的歌（“潮”改“松风”）、汐划回三处、留下被划掉的末字；七夕散场后雪替汐写的歌与鸭川上的川舟；
#         空着的信封与合抄的歌；1558 年冷泉家这一趟下向土佐（具体行程原创）；雪收着的字纸；冷泉家歌册里“土佐的汐”那一首。
#   待核——冷泉家在 1550 年代后半是否确有人下向土佐一条家（正文只写“冷泉家下向中村传歌”，不写是哪一位当主）。
