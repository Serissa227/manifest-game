# 抉择：1560 夏，一个要回勒阿弗尔，一个要往北进林子。玩家可以把两人一起送去巴伊亚，或替他们捎信。
[[tracks.chapters]]
key = "pair_jean_leblanc_pierre_cardon_choice"
title = "林子还是船"
text = "科利尼堡失守以后，让和皮埃尔跟着往北迁的图皮南巴人沿海岸走，一路躲着人，到了巴伊亚。萨尔瓦多是葡萄牙人的城，他们不敢进，只在城外的海湾里找到我的船，它正泊着等风。两人一前一后走到船边。皮埃尔先开口：北面的海湾里有一条偷运巴西木的法国船，肯捎他回勒阿弗尔，船钱他付得起。“我不会住在一个看不见上帝的地方。”让蹲在跳板的一头，手里编着一截绳子。村里人要往北边的林子深处去，他得跟着走。“我也不会回一个把我当外人的国家。”两人隔着一块跳板，都没开口叫对方跟自己走，眼睛却一起看着我。"
stage = "involve"
window = [[1560, 6, 1], [1560, 8, 31]]
at = "salvador"
cast = ["jean_leblanc", "pierre_cardon"]
speaker = "jean_leblanc"
mood = "sad"
news = "从瓜纳巴拉湾逃到巴伊亚的法国人走的走、散的散，听说那个通事和那个木匠还没定下谁跟谁走。"

