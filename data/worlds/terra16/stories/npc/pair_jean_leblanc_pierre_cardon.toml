# 落点：1558 年 1 月，“雅克号”开船那天。皮埃尔没上船，两人成了恋人。
[[tracks.chapters]]
key = "pair_jean_leblanc_pierre_cardon_together"
title = "那条船走了"
text = "“雅克号”要载新教徒回法国了，名单上有皮埃尔的名字。开船那天，滩上的人排队登小艇，他却没去——长屋的门还差一块板。让在海边找到他。他蹲在一地刨花里，把那块板刨得很慢，刨一下，拇指摸一遍。“船在等。”让说。“板还没好。”皮埃尔没抬头。海湾那头，“雅克号”升起了帆。他把刨子放下，又拿起来。夜里他在长屋外祷告了很久，让蹲在旁边等。祷告完，让伸手拉他起来，他站起来，却没有松开。“明天我还要为这个祷告。”皮埃尔说。“我知道。”让说。皮埃尔低下头，吻了让。"
stage = "witness"
window = [[1558, 1, 1], [1558, 2, 28]]
at = "rio_de_janeiro"
cast = ["jean_leblanc", "pierre_cardon"]
speaker = "pierre_cardon"
mood = "tender"
news = "“雅克号”载着新教徒回法国了，名单上的一个木匠没上船，听说留在岸上的村子里刨一块门板。"

