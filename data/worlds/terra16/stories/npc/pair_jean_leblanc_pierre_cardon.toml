# 相识：1557 春，瓜纳巴拉湾岸边。新教徒的船刚到，一条漏水的独木舟。
[[tracks.chapters]]
key = "pair_jean_leblanc_pierre_cardon_meeting"
title = "钉子太多"
text = "新教徒的船刚靠岸，皮埃尔就蹲在滩上盯着一条裂了缝的独木舟。他从工具袋里倒出一把铁钉；村里的通事拎着一罐树脂、抱着一捆树皮绳，在舟的另一头蹲下。“站远点，刨花会进眼睛。”皮埃尔头也不抬。“我这边不出刨花。”让把绳子在裂缝上绕了一圈，“村里人造舟，从来不用钉子。”两人从晌午争到太阳偏西，最后一人补一边，推下水去试。皮埃尔那一边先渗了水，袖口湿到手肘；让没笑，把自己的干布递了过去。棕榈树荫里的老人问了一句图皮语，大概是问这个白人还要往舟上钉多少铁。让笑着答他：“我能翻话，不能替他答应。”"
stage = "witness"
window = [[1557, 3, 15], [1557, 5, 31]]
at = "rio_de_janeiro"
cast = ["jean_leblanc", "pierre_cardon"]
speaker = "pierre_cardon"
mood = "cheerful"
news = "瓜纳巴拉湾新来的法国木匠和住在村里的通事，为修一条独木舟争了一下午，最后一人补了一边。"

[tracks.chapters.default]
next = "pair_jean_leblanc_pierre_cardon_closer"
effects = []

# 靠近：1557 冬，新教徒被赶出岛上的堡垒，住进岸上的村子。crush。
[[tracks.chapters]]
key = "pair_jean_leblanc_pierre_cardon_closer"
title = "岸上的饭"
text = "被维勒加尼翁赶出堡垒的新教徒在岸上搭起棚子，雨一下就漏。让把皮埃尔领回自己住的长屋。开饭了，皮埃尔低头合掌，满屋子的人都停下手看他。让压低声音，一句一句把祷告译成图皮语，译得很慢，慢得像在拖时间。译到“日用的饮食”，旁边的女人把一块烤鱼推到皮埃尔面前。饭后他不肯闲着，找来两块板和一根横木，给长屋的门装了道闩，装在里面。“门要能从里面打开。”他说。“这里没人关你，装它做什么？”让靠在门框上问。皮埃尔敲紧最后一个楔子：“我怕被关住。装上了，我才睡得着。”"
stage = "witness"
window = [[1557, 11, 1], [1557, 12, 31]]
at = "rio_de_janeiro"
cast = ["jean_leblanc", "pierre_cardon"]
speaker = "jean_leblanc"
mood = "tender"
news = "被赶下岛的新教徒住进了岸上的村子，听说有个木匠给图皮南巴人的长屋装了一道从里面闩的门。"

