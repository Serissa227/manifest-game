# 落点 B（帮助）：1560 秋，巴伊亚南边的村子，皮埃尔留在那里。
[[tracks.chapters]]
key = "pair_jean_leblanc_pierre_cardon_landing_b"
title = "同一边"
text = "巴伊亚南边的村子里，长屋的门又添了一道。皮埃尔装的，门闩照旧在里面。礼拜天他一根钉子也不碰，坐在门槛上翻那本卷了边的《圣经》，翻一页，抬头往院子里看一眼。院子那头，让正替一个商人和村里的女人翻一桩买卖，布换巴西木。女人说了一长串，让只译了一句：“她说，价钱可以谈，先吃饭。”说到一半，他回头看了门槛上的人一眼。皮埃尔举起书晃了晃：看着呢。夜里让站在门外问：“今晚这道门，从哪边开？”“里面。”皮埃尔说，“你进来。”门闩响了一声。"
