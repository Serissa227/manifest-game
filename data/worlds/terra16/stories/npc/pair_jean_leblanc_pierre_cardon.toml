title = "科利尼堡"
text = "码头上传开了消息：葡萄牙人打下了岛上的科利尼堡，法国人四散，有的钻进林子跟图皮南巴人走了，有的在到处打听回家的船。卖鱼的说，他看见那个留下来的木匠和住在村里的通事蹲在海边拆一条独木舟，一边的钉子一颗颗起出来，另一边的树脂原封不动。打渔的却发誓，那两个人天黑以后还在码头上，挨着问每一条法国船几时开。"
