# C7 配角线：让·勒布朗 × 皮埃尔·卡尔东——留下哪条独木舟（故事 2.0，A5 / E37 契约）
# 标签：BL，恋爱线；两人都是纯 BL（romance.with = m）。
# 人物：让（jean_leblanc，1533-10-01）：诺曼底来的法国通事，少年时被留在巴西海岸，从此与图皮南巴人同住；1557—60 在瓜纳巴拉湾，1561 起回巴伊亚一带的村子。
#       皮埃尔（pierre_cardon，1534-05-09）：1557 年随新教徒来到瓜纳巴拉湾的木匠；日程上 1561 起在勒阿弗尔船厂。
# 年龄：全线两人都已成年（1557 年 23 与 22 岁，生年差 1）。crush 放在 1557-11 起的 closer；lovers 放在 1558-01-01 起的 together
#       （双方都满 18，不早于 1557-01-01）。其余章节不再写关系升级。together 写到一个吻为止。
# 依据：史实——1555—60 年维勒加尼翁在瓜纳巴拉湾建“南极法兰西”；1557 年 3 月日内瓦派的新教徒到达；1557 年 10 月前后与维勒加尼翁决裂，
#       被赶出岛上的堡垒，在岸上图皮南巴人的村子里住了约两个月；1558 年 1 月搭“雅克号”回法国；1560 年 3 月梅姆·德·萨的葡萄牙人攻下科利尼堡。
#       原创——两人的相识与恋情，皮埃尔没有上“雅克号”，独木舟与门闩，巴伊亚南边的小湾。
#       待核：独木舟的补法（树脂、树皮绳）按当地做法推想，不指名具体树种；图皮语只写“图皮语”，不写具体词句。
#       不写主人们处置战俘的仪式，不写新教与天主教之争的细节；皮埃尔的信条与感情的矛盾只写祷告的动作。
# 缺省走向：1557 修舟相识 → 1557 冬住进岸上的长屋 → 1558 年 1 月皮埃尔没上“雅克号”，两人成了恋人
#       → 1560 年科利尼堡陷落，一个进了林子、一个上了回法国的船（apart）：仍是恋人，隔着大洋，靠过路船的信。
# 玩家能做的：帮助（same_side：用我的船把两人一起送到巴伊亚南边的村子）→ landing_b，皮埃尔留在巴伊亚；
#       撮合（letters：答应替他们往返捎信）→ 仍走 apart，变体里每年有一条船捎一次信；旁观（watch）→ apart。
#       三条路都不改变两人相爱这件事，只改变最后他们在不在同一片陆地上。
# 旗标：设 c7_pair_jean_leblanc_pierre_cardon_together（together）/ _helped（same_side）/ _matched（letters）；apart 的变体读 _matched；不读外部旗标。
# 日程：landing_b 的 schedule 效果把皮埃尔留在 salvador（自 1560-09 起）；缺省路径不改 cast，皮埃尔 1561 起在 le_havre。
#       地点 key：瓜纳巴拉没有地点 key，用 rio_de_janeiro；巴伊亚用 salvador。
# 秘密：皮埃尔对让的感情在他的信条里是罪，他为它祷告，却放不下——只在 together 里由他自己的动作写出，news 永远不写。
# 地点（2026-11-01 close-places）：抉择章（involve）由 rio_de_janeiro 改 salvador——瓜纳巴拉 1565 年以前没有能泊的港（rio_de_janeiro 休眠），
#   玩家永远帮不上，landing_b 也走不到。改写为科利尼堡陷落后两人北上到巴伊亚、在萨尔瓦多城外找上“我”的船。
#   相识、靠近、在一起三章 witness 仍挂 rio_de_janeiro，只作见闻（1565 年里约开港以后，到港打听时才听得到）。
#   转折（rumor，科利尼堡陷落的消息）改挂 salvador：攻下堡垒的葡萄牙人回的就是萨尔瓦多，消息在那里的码头传开，正好给抉择章铺垫；
#   两岸（rumor，木匠在勒阿弗尔做门）改挂 le_havre，见闻说的就是勒阿弗尔船厂。两章 rumor 的正文不显示，不改字。
#   抉择章的见闻与选项里的“瓜纳巴拉湾”改成萨尔瓦多一带，“顺路往北”改“顺路往南”（巴伊亚南边的小湾在萨尔瓦多以南）。
#   cast：让 1560-06 起在 salvador；皮埃尔 1560-06..08 在 salvador、1560-09 起在 le_havre（缺省路径），landing_b 照旧把他留在 salvador。

