# 17 西行前添人（每人 30；小早上限 35 人）。
[[tracks.chapters]]
key = "v17_hire"
title = "西行的水手"
text = "开春那个纪伊来的水手还在酒馆里，见了我就站起来，说六月了。他还带了个同乡，说两个一起雇便宜。“两个六十，便宜在哪儿？”“他吃得少。”那个同乡在一旁点头，手里的饭团已经啃掉一半。"
hint = "往西去平户的路远。在堺的酒馆添一两个水手，每人三十。"
teaches = ["hire_crew"]
go = { port = "sakai", panel = "tavern" }
at = "sakai"
objectives = [{ kind = "deed", deed = "hire_crew", ge = 1, since_entered = false }]

