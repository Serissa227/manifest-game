title = "博多的海图"
text = "卖海图的是个唐人，图上的字一半汉字一半南蛮字。他指着若狭那一块说，那边冬天的浪比这里高一倍，图只管画岸，不管浪。他开价，我还了两回，他只让了头一回的。"
hint = "在博多的酒馆买一张海图，挑一片还没去过的海。往后去若狭、越前，日本海那张用得上。"
