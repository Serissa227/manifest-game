# 18 能岛：途中下锚上岸、做一件岸上差事（汲水等）。
[[tracks.chapters]]
key = "v18_noshima"
title = "濑户内的锚地"
text = "锚地是一处小河口，岸上有两户人家。水手们抬着桶去河边，一个老婆婆出来问是哪家的船。我说能岛的旗。她就不问了，回屋端出一盆煮芋头，一盆三十文。我还到二十五，她从盆里拣出两个，说二十五就这么多。"
hint = "沿濑户内海往西去能岛。路上找一处锚地下锚上岸，汲一回水。"
teaches = ["landing", "shore_task"]
