# 19 海上三件事：喊话、所见、下网。喊话与所见没有保底，所以给 120 天期限；过期走 timeout，next 相同，只是不发奖励。
[[tracks.chapters]]
key = "v19_at_sea"
title = "海上的事"
text = "喊过去的那条船是博多的，船头说前面有海贼，又说他也没见着，是听人说的。网里上来半筐小鱼和一只破草鞋。阿权把草鞋扔回海里，鱼当晚就煮了。"
hint = "往西的路上：靠近商船就喊话，海上漂着东西就过去看，收帆下一回网。120天内办完有赏。"
