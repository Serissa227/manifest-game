title = "金板上的判词"
text = "东边发白的时候，火重新点了起来。十王脱下深蓝的长袍，叠好了放在金板旁边。最老的那位王说，祖先的故事停在宙斯召集众神、正要开口的地方，城里没有人知道他说了什么；这一夜外面的世界该说的都说了，判词的第一行，该由一个外面来的人写。伊斯梅妮把刻刀递到你手里。带银枝的女人站在门边，像是早就知道你会写什么。"
choices = [{ key = "close", text = "合上黑暗之海", reply = "你写下：雾合上。十王挨个在金板上按了手印。外港的船陆续起锚，各国的人骂骂咧咧，海草在船尾重新铺开。伊斯梅妮送你到运河口，说往后的雾会一年比一年厚，外面的人会慢慢忘了这条水路。“七岛不归我们管，”她说，“那边的人还肯不肯见你，要看她们。”", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = true }, { kind = "flag", flag = "atlantis_verdict_open", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = false }], requires = [] }, { key = "open", text = "打开亚特兰蒂斯的航路", reply = "你写下：航路打开。判词刻上金板的那一刻，运河口拦水的绳网就沉进了水里。消息传出去以后，外港很快挤满了各国的商船，山铜在里斯本的市场上露了面，价钱一天三变。伊斯梅妮站在码头上看着，说：“往后谁都能来了。律法，得再从头读一遍。”", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = false }, { kind = "flag", flag = "atlantis_verdict_open", value = true }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = false }, { kind = "open_realm", realm = "atlantis" }], requires = [] }, { key = "hand_hermetic", text = "把航路交给赫尔墨斯圈子", reply = "你写下：交给赫尔墨斯圈子。圈子里守秘的那一派当场脸色发白，公开的那一派已经在商量把律文印成书。十王把金板的抄本交到他们手里，附了一句话：书可以印，柱子不许碰。那天夜里，他们的船上灯一直亮着，两派的人吵到半夜，隔着水都听得见。", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = false }, { kind = "flag", flag = "atlantis_verdict_open", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = true }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = false }], requires = [] }, { key = "hand_christ", text = "把航路交给基督骑士团", reply = "你写下：交给基督骑士团。骑士团的人捧着金板的抄本跪了很久，说要送回托马尔的修院。可他们自己也分成了两拨：一拨听腓力国王的，一拨还认唐·安东尼奥为王。葡萄牙的港口从此待你客气了许多，只是这份情该记在哪一位国王的账上，谁也说不清。", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = false }, { kind = "flag", flag = "atlantis_verdict_open", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = true }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = false }, { kind = "reputation", faction = "portugal", value = 10 }], requires = [] }, { key = "hand_ottoman", text = "把航路交给奥斯曼", reply = "你写下：交给奥斯曼。舰队的旗舰当天就升起新月旗，开进了内港。十王把判词另抄了一份，装进一只银匣，要送往伊斯坦布尔，呈给穆拉德苏丹。从此奥斯曼的港口见了你的船都格外客气；外港的葡萄牙人和西班牙人却连夜起锚，一句话也没留。", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = false }, { kind = "flag", flag = "atlantis_verdict_open", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = true }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = false }, { kind = "reputation", faction = "ottoman", value = 10 }], requires = [] }, { key = "hand_dragon", text = "把航路交给龙骑士团", reply = "你写下：交给龙骑士团。那一刻谁也没出声。正午时分，外港那条船上的人头一回收起了黑伞，站在太阳底下眯着眼睛，像在尝阳光的味道。伊斯梅妮转过身去，没有送你。带银枝的女人一言不发地走出门去，枝上的白花全都合上了。", next = "done", effects = [{ kind = "flag", flag = "atlantis_verdict_close", value = false }, { kind = "flag", flag = "atlantis_verdict_open", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_hermetic", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_christ", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_ottoman", value = false }, { kind = "flag", flag = "atlantis_verdict_hand_dragon", value = true }], requires = [] }]
news = "海上传来消息：大西洋中央那座城的王在天亮时写下判词，刻在一块金板上。至于判了什么，各国的使者回来说的都不一样。"
at = "atlantis_port"
window = [[1583, 3, 1], [1583, 11, 30]]
stage = "involve"
cast = ["ismene", "silver_branch_woman"]
default = { next = "failed", effects = [{ kind = "flag", flag = "c11_council_missed", value = true }], news = "入秋，亚速尔西南的雾合拢了。听说那座城的金板到最后还空着一行，外来的客人谁也没在上面落刀。" }
