# C7 羁绊线（2026-10-11，Claude Opus 重写）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：any——主角性别由玩家定：女主角时为 GL，男主角时为 BG。阿米汉的 romance.with = any。
# 人物：阿米汉·达加特 amihan_dagat（1540-02-22，汤都河口船匠的女儿，学堂同学）；
#   主角 custom_tondo_datu（1540 年生，汤都大督家的学堂）。第一人称“我”不写性别、外貌与家族专名。
#   年龄：学院期 1554—1556 两人 14—16 岁；S 的 heart 选项要求双方 16—17 岁；1563 年重逢两人 23 岁，恋人落点要求双方满 18。
# 依据：
#   史实——汤都在巴石河口北岸，由拉坎杜拉一系的大督治理，与文莱、唐人船、日本船往来；高脚屋、竹柱、带舷外浮杆的船；
#         西南季风 habagat（6—9 月多雨涨水）、东北季风 amihan（12—2 月干爽，正是她名字的意思）；1563 年西班牙人还没到马尼拉（1571 年立城）。
#   原创——人物与全部情节：潮水给街巷起的名字（早潮巷、螃蟹门、歪脖子）、竹柱上的水位刻痕、红树林里的近路、
#         家族不外传的水道图（油纸卷）、画了水路的风筝、平底双浮杆的救人船与踏板、船棚下的石阶、1563 年的大水。不指具体战事。
#   待核——无。
#   口头禅：“这条水路，涨潮才开门。”原句只在 C1 用一次；S、重逢与来信里只用改过字句的呼应。
#   秘密：私记的水道图只在 B2 由她自己给主角看一角，A2 化成一只风筝；本文件不写见闻（羁绊章没有 stage）。
#   与 cast 人设的衔接：人设写图卷塞在她小船的底板下，B2 写她因雨季太潮把它挪到了船棚屋梁上。
# 缺省走向：玩家一章也不回应时，故事照走、没有收获；S 缺省设 c7_bond_amihan_dagat_parted 并开启重逢；
#   重逢缺省是一封写在风筝纸上的来信（救人船下水，第一趟救了七个人，附新画的水道），设 c7_bond_amihan_dagat_missed。
# 落点：redraw（friends，一起重画水道）／race_again（rivals，再赛一场）／stay_on_boat（lovers，要 S 选 heart、心动 ≥ 24、双方成年）。
#   心动来源：A1 hold_lantern +6、A2 keep_kite +6、S heart +12，合计 24。
# 设旗标：c7_bond_amihan_dagat_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#   S 的 promise 与 heart 设 c7_tie_new_amihan_dagat_sisa_mullu_taken（tie_new_amihan_dagat_sisa_mullu 的落点读，阿米汉与西萨改走并肩的朋友）。
# 读旗标：本文件的 _promise / _romance / _own（重逢的变体与恋人落点）。1563 年的重逢不写西萨（她 1581 年才到汤都）。
# 日程：不需要改。

