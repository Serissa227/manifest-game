# —— A1：1556 年干季，芒果树下的沙地 ——
[[tracks.chapters]]
key = "a1"
title = "她想造的船"
text = "东北风吹了一个多月，河口的泥晒得发白。学堂散了，阿米汉在芒果树下蹲着，用一根树枝在沙地上画船。船是平底的，两边各伸出一根浮杆，比她家造过的哪一条都宽、都矮。“大水那年，”她头也不抬，“湾里的人在屋顶上坐了两天。尖底船进不去，高脚屋中间的水太浅，柱子又密。”她在船肚里画了几道横线，“平底，吃水浅；两根浮杆，人从一边爬上来也翻不了。”她把树枝递给我：“你挑错。挑不出来，就在这儿蹲到天黑。”我绕着沙地上的船走了一圈。她在船尾空着的地方写了几个字，抹掉，又写上。“它以后叫阿米汉。”她说，“干季的风最稳，一整季不改方向。救人的船，就得那样。”风从北边过来，沙地上的船边起了一层细沙。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

