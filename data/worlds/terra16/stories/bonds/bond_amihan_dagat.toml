# —— 重逢：1563 年雨季，汤都发大水 ——
[[tracks.chapters]]
key = "reunion"
title = "水路仍在变"
text = "那年雨季的水比哪一年都大。我的船进河口时，高脚屋只剩半截露在水上，竹柱上旧年的刻痕全泡在了底下。一条平底船从两排屋子中间斜插过来，两根浮杆贴着水皮，船舷上一块木板放下来，正搭在一户人家的窗台上。撑船的人朝我扬起竹篙：“发什么愣！过来搭把手！”是阿米汉。她晒得更黑了，胳膊上多了一道疤，喊人的嗓门一点没变。我跳上她的船，一户一户地接人。老人踩着那块踏板走上来，一个孩子抱着一只鸡死活不撒手，阿米汉连鸡一起接了。船满了就送到唐人船主家的二楼，卸了人再回来。天快黑时，我指着两排屋子中间一条窄道：“从这儿穿过去，近。”阿米汉只看了一眼：“那条早不通了。前年大水冲下来一棵树，横在里头，泥全淤在树后面。”她拿篙敲了敲船舷，“你记得的那些水路，一大半都改了道。我给你重画。”"
window = [[1563, 6, 1], [1563, 9, 30]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1563, 6, 1], to = [1563, 9, 30] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "amihan_dagat", text = "信是写在风筝纸上的，折成四折，纸面结实，不怕潮。“船下水了，就叫阿米汉。第一趟进湾里，接出来七个人，还有一个才生下三天的娃娃，是他娘抱着踩踏板上来的。踏板好用。附一张新画的水路。前年大水冲下来一棵树，横在早潮巷里，那条道死了；螃蟹门往南挪了两根柱子。你从前记的那些，别再用，用了准卡在根上。这张是拿风筝纸画的，你在哪儿都能放起来看。下回要来，先托船带个话，潮我替你算。——阿米汉”" }, { kind = "flag", flag = "c7_bond_amihan_dagat_missed" }]

[[tracks.chapters.choices]]
key = "redraw"
text = "跟她一起把改了道的水路重画一遍，标上新的泊位。"
reply = "雨一直下，我们就在船棚里画。她报，我画；我画错了，她拿炭头敲我的手背。新图上多了七处泊位，都是大水时小船拴得住、人爬得上屋顶的地方，哪一家的柱子最结实，她一处一处说给我听。画到雨停，天边发白，她把图抄成两份，一份卷起来塞给我，一份拿竹钉钉在船棚最外面那根柱子上，面朝着河。“我爹会骂的。”她拍了拍钉牢的那张，“让他骂。去年湾里淹死了两个人，就因为撑船的不知道那条道改了。”第二天一早，柱子前头已经站了三个撑船的，正一笔一笔往自己的竹片上抄。"
next = "done"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 5 }, { kind = "relation", person = "amihan_dagat", relation = "friends" }, { kind = "flag", flag = "c7_bond_amihan_dagat_landing_friend" }, { kind = "memory", memory = "mem-bond_amihan_dagat-reunion", title = "水路仍在变" }]

[[tracks.chapters.choices]]
key = "race_again"
text = "雨停了，跟她再赛一场：她的救人船对我的小艇。"
reply = "雨停的第二天，河口的人听说我们要赛船，屋顶上站满了看热闹的。还是从渡口划到深水，她那条平底船笨得像一块门板，起步就落后了两个船身。我一路领先，到红树林口想也没想就钻了进去——又卡住了，卡在一条新长出来的根上。等我撬出来，她早绕远到了，正坐在船头拧衣服上的水。她把桨往肩上一扛：“出海这么多年，还是没学会等水。”她跳到我的船上看了看那条根，用指甲在上面掐了一道：“这一道是你的。下回你再来，看它长了多粗。”"
next = "done"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 3 }, { kind = "relation", person = "amihan_dagat", relation = "rivals" }, { kind = "flag", flag = "c7_bond_amihan_dagat_landing_rival" }, { kind = "memory", memory = "mem-bond_amihan_dagat-reunion", title = "水路仍在变" }]

[[tracks.chapters.choices]]
key = "stay_on_boat"
text = "那晚不回船上，留在她的船棚里，把当年的话说完。"
requires = [{ kind = "flag", flag = "c7_bond_amihan_dagat_romance" }, { kind = "heart", person = "amihan_dagat", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "amihan_dagat", ge = 18 }, { kind = "romance_open", romance_open = "amihan_dagat" }]
hint = "这样的话，要当年在石阶上起过头、心里也准备好了，今天才说得出口。"
reply = "那天夜里我没回自己的船。船棚里点着一盏灯，雨打在棕榈顶上，像有人在上头一把一把地撒米。我把当年在石阶上说过的那句话又说了一遍，这一回没加“等长大了”。阿米汉听着，手里一直在削一块浮杆上用的木楔，削到最后一刀才放下。“早猜到你要再说一遍。”她说，“我等潮呢。”她在我身边坐下，头靠在我肩上，头发里有桐油味。棚子外头，水一级一级往上涨，漫过了那几级石阶，只剩最上面一级还露着。她握住我的手：“到这一级了。我答你。”然后她转过脸来，吻了我。"
next = "done"
