# —— S：1556 年 12 月，船棚下的石阶 ——
[[tracks.chapters]]
key = "s"
title = "能靠岸的地方"
text = "东北风又起来了，河口的水一天比一天清。我要上船的事，阿米汉是从她父亲那儿听来的，那天下午她没来学堂。傍晚她在船棚底下等我。棚子临水的一边有几级石阶，一直伸进河里。“我找了好几天。”她蹲在石阶上，“码头退潮就露泥，渡口涨潮就淹。只有这儿——”她拍了拍身边那一级，“涨潮也露一级，落潮也露一级。你什么时候回来，都有一级能站。”我数了数，水面上露着四级，最上面那级长着一层青苔。“以后要见，就在这儿。”她说，“回来以前先托船捎个信，我好算潮。”北风灌进棚子，挂在梁下的渔网一下一下地拍着柱子。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_amihan_dagat" }, { kind = "flag", flag = "c7_bond_amihan_dagat_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好她那条救人的船下水那天，我回来坐第一趟。"
requires = [{ kind = "bond", person = "amihan_dagat", level = "A" }]
hint = "这样的约，要交情够深才许得下，一生也只许得一次；这一回，只能握握手。"
reply = "“那得好几年。木料要等，钱要攒，我爹还没点头。”“我等。”阿米汉看了我好一会儿，从腰上抽出那把刻水位的小刀，在最上面那级石阶上刻。石头比竹柱硬，她刻得很慢，一刀一刀，刻出来是个我没见过的名字。我问那是哪条巷。“哪条也不是。”她把刀收回去，“是这一级的名字。只有我们两个叫得出。”她不肯告诉我怎么念，说等船下水那天，我站在这儿，她划着船来接我，到时候再说给我听。水涨上来，漫过了下面三级，刻着字的那一级还露在外头。"
next = "done"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 5 }, { kind = "bond", person = "amihan_dagat", level = "S" }, { kind = "relation", person = "amihan_dagat", relation = "friends" }, { kind = "flag", flag = "c7_bond_amihan_dagat_promise" }, { kind = "flag", flag = "c7_tie_new_amihan_dagat_sisa_mullu_taken" }, { kind = "memory", memory = "mem-bond_amihan_dagat-s", title = "能靠岸的地方" }, { kind = "start_track", track = "reunion_amihan_dagat" }]

[[tracks.chapters.choices]]
key = "heart"
text = "告诉她：等我们都长大了，回来时想第一个看见的是她。"
requires = [{ kind = "bond", person = "amihan_dagat", level = "A" }, { kind = "heart", person = "amihan_dagat", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "amihan_dagat", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "amihan_dagat" }]
hint = "这句话还说不出口——你们还没走到那一步。"
reply = "阿米汉愣住了，愣了很久，久得水又涨上来半级，漫过了她的脚背，她也没挪。“水还没涨到呢，”她终于开口，声音很低，“你急什么。等你回来，站在这一级上，我再答你。早一天都不答。”她站起来，拍掉膝上的青苔，伸手过来，很快地牵了一下我的手，指头上全是桐油和沙子，然后就放开了，背过身去理缆绳，越理越乱，最后打成了一个死结。“回去吧，起风了。”她没回头。我走上岸，回头看时，她还站在最上面那一级，一只手攥着另一只手。"
next = "done"
effects = [{ kind = "heart", person = "amihan_dagat", value = 12 }, { kind = "relation", person = "amihan_dagat", relation = "crush" }, { kind = "bond", person = "amihan_dagat", level = "S" }, { kind = "flag", flag = "c7_bond_amihan_dagat_romance" }, { kind = "flag", flag = "c7_tie_new_amihan_dagat_sisa_mullu_taken" }, { kind = "memory", memory = "mem-bond_amihan_dagat-s", title = "能靠岸的地方" }, { kind = "start_track", track = "reunion_amihan_dagat" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好再赛一场：看谁先有自己的船。"
reply = "阿米汉从石阶上一下子站起来，伸手跟我击掌，拍得啪一声响。“输的刮一年船底。”“谁的船底？”“赢的那个的。”她跳下石阶钻进船棚，拿出一根打了结的绳子和一块炭——那是她父亲量船用的，一个结一肘——开始量墙边堆着的木料，一根一根，量完就在柱子上记个数。我在石阶上站了半天，她都没回头，嘴里一直数着结，直到我要走了，才隔着棚子喊一声：“一年！别忘了！”第二天一早我就听说，她跟她父亲讨了船坞边上一块地，说要自己开工，木料先赊着。"
next = "done"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 2 }, { kind = "relation", person = "amihan_dagat", relation = "rivals" }, { kind = "flag", flag = "c7_bond_amihan_dagat_own" }, { kind = "memory", memory = "mem-bond_amihan_dagat-s", title = "能靠岸的地方" }, { kind = "start_track", track = "reunion_amihan_dagat" }]

