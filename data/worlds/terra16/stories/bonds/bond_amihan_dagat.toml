# —— C2：1554 年雨季，头一场大雨 ——
[[tracks.chapters]]
key = "c2"
title = "低处先湿"
text = "西南风一起，雨就没停过。头一场大雨的第二天，阿米汉在学堂门口叫我：“会撑船吗？不会也来，替我撑。”她挨家挨户在高脚屋的竹柱上刻今年的水位，刻一道，就在一片棕榈叶上记一笔——她要找出哪一家的地板最先进水。刻水位的小刀是她父亲的，刀柄缠着鱼线，她刻得又快又浅，说刻深了伤柱子。我撑着船看她的叶子，数到河湾那头，少了一户。“湾里那个婆婆家呢？”阿米汉的刀停在半空。那间屋子我们都见过，比左右两家矮了半截，独门独户，只住着一个婆婆。“她家去年就淹过。”阿米汉咬住嘴唇，把叶子翻过来又翻过去，“我怎么会漏了她。”雨点打在船篷上，河湾那头的水已经发黄了。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

