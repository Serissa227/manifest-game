[[tracks.chapters]]
key = "a2"
title = "画了水路的风筝"
text = "西南风要来的前几天，阿米汉抱着一样东西在学堂门口等我，拿芭蕉叶包着，比她的胳膊还长。是一只风筝。竹骨削得极细，纸面上画满了弯弯曲曲的线，线边写着小字：早潮巷、螃蟹门、歪脖子，还有几个我没听过的名字和几个数。我看了好一会儿才认出来，那是从渡口到她家船棚的一段水路，哪里深、哪里浅都标着，比她父亲嘴上说的还细，角上还添了一条鱼。“图不能给人。”阿米汉把风筝线在指头上绕了两圈，“可风筝谁都能放，对不对？放风筝的又不是领航的。”她把线轴塞进我手里。“你以后出了海，回来的时候在船上看见风筝，就知道该走哪一条。”"
