requires = [{ kind = "affinity", person = "amihan_dagat", ge = 80 }, { kind = "bond", person = "amihan_dagat", level = "B" }, { kind = "heart", person = "amihan_dagat", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "amihan_dagat", le = 17 }, { kind = "romance_open", romance_open = "amihan_dagat" }]
hint = "这种话，现在还说不出口。"
reply = "阿米汉别过脸去，使劲扯了扯风筝线，扯得竹骨咯吱响。“你少说这种话。”过了一会儿，她又转回来，指着纸面上一条细线：“这条近路只有满月后第三天才开，别的日子钻进去就卡在根上——你最好记住。”她说完就走，走出去十几步，又回头喊了一句：“第三天！”"
