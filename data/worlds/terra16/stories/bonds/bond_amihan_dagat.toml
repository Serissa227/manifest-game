effects = [{ kind = "affinity", person = "amihan_dagat", value = 3 }, { kind = "heart", person = "amihan_dagat", value = 6 }, { kind = "bond", person = "amihan_dagat", level = "A" }, { kind = "item", item = "painted_kite", qty = 1 }, { kind = "memory", memory = "mem-bond_amihan_dagat-a2", title = "画了水路的风筝" }]

[[tracks.chapters.choices]]
