# —— B2：1555 年，船棚屋梁上的油纸卷 ——
[[tracks.chapters]]
key = "b2"
title = "卷起来的图"
text = "那年开春，一条唐人船在河口外下了锚，托人来问能不能找个熟水路的领进来。阿米汉的父亲把来人送到门口，话说得客气，脚却没挪一步：“水路是家里吃饭的本事。”那天夜里，阿米汉把我叫到她家船棚。棚里一股桐油味，她踩着船架爬上去，从屋梁上取下一卷油纸。“原先塞在我小船的底板下，雨季太潮，挪上来了。”她蹲下来，只解开一角，用手掌压着其余的。纸上是河口：一道道水路，旁边标着小字和数，有的是她父亲嘴里的名字，有的是她自己起的。“我爹不知道有这张。”她指着一处转弯，“这里，我记的是齐腰深。可上回退潮看着像更浅，我拿不准。”油灯晃了一下，她把那一角又往怀里收了收。“这图谁也不许给。我只是想知道，我画得对不对。”"
