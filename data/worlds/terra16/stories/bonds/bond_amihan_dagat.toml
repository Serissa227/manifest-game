requires = [{ kind = "affinity", person = "amihan_dagat", ge = 80 }, { kind = "bond", person = "amihan_dagat", level = "B" }]
hint = "这只风筝她还没画完——还要再熟一点，她才肯交到你手上。"
reply = "河口的风正大，风筝一松手就蹿了上去，纸上的水路在天上抖。我不会收线，越拽越紧，阿米汉从背后握住线轴，替我松了半圈：“线松一点，像等潮。拽得太紧，它就跟你犟。”收回来的时候天快黑了，她拿指甲在竹骨上掐了几道印子，是今天的日子。"
next = "s"
