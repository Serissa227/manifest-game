text = "劝她这么要紧的东西，还是自己留着。"
reply = "阿米汉想了想，把风筝包回芭蕉叶里：“也对。挂在我家船棚上，谁也想不到。”我以为这事就这么过去了。第二天她又塞给我一只小的，巴掌大，纸面上只画了一道弯，写着三个字：早潮巷。“这个不要紧，”她说，“这个你拿着。”"
next = "s"
