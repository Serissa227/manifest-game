text = "跟她打赌：不等潮，踩着泥也走得过去。"
reply = "“赌什么？”“你说。”我跳下船，第二步就陷到了膝盖，第三步拔不出脚。阿米汉笑得桨都差点脱了手，笑够了才把桨伸过来，让我抓着桨叶爬回船上。“赌注我定了。”她拿篙尖敲了敲船底，“这块板，替我刮一个月。”我坐在船头抠腿上的泥，水正好漫过刚才那两个脚印。"
