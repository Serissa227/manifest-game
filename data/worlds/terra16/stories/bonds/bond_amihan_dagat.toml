# —— C1：1554 年初，河口的高脚屋之间 ——
[[tracks.chapters]]
key = "c1"
title = "潮水的街名"
text = "大督家差我给河口一户唐人船主送信。家里给的图画得明明白白：过两座竹桥，左拐，第三排高脚屋。可第二座桥底下只有一沟黑泥，左边也没有路，只有一根根竹柱插在泥里，柱脚爬满了小螃蟹。我捏着信站在泥边，一条小舢板从柱子中间滑了出来。撑船的女孩赤着脚，看看我的图，又看看我的鞋。“你找的那条叫早潮巷。”她拿竹篙点了点那沟泥，“现在是泥，过一个时辰才是巷。上来，等着。”我上了船。她叫阿米汉，船匠家的。我们坐在船里等水，她指着竹柱上一道道刻痕报名字：这根是“螃蟹门”，那根是“歪脖子”，再往里那根刻了三道的，大水年才用得上。水是一指一指涨上来的，先没了螃蟹，再没了刻痕。等我回过神，刚才的死路已经连成一条街，两边的人家正从窗口往下递篮子。阿米汉一篙撑开船：“这条水路，涨潮才开门。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_tondo_house_school" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

