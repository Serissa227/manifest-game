# —— B1：1554 年雨季过后的赛船 ——
[[tracks.chapters]]
key = "b1"
title = "近路的时辰"
text = "雨季一过，河口照例赛船：从渡口划到唐人船泊的那片深水，谁先摸到船舷谁赢。我早看好了一条近路，从红树林中间穿过去，能省下小半程。前半截确实快，我回头还看得见阿米汉在外头的大水道上绕远。再往里，水忽然浅了，船底咔的一声，卡在两条拱出水面的红树根中间，进不得也退不得。远处一阵喊声，阿米汉已经摸到了船舷。过了一会儿，她又划回来了，满头是汗，把桨插进根缝里一撬，我的船晃了两晃，滑回水里。“近路是退潮时候的近路。”她喘着气，“今天是满月后第五天，这个时辰，林子里的水只到脚踝。”“你怎么知道是第五天？”“数的。”她伸出手指，“从满月那天起，潮水一天晚来一点。你数着，就知道它什么时候在。”卡过我的那条红树根上，留下了一道新鲜的白印。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "tondo"
cast = ["amihan_dagat"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

