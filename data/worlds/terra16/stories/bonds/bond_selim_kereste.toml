# 重逢：1562 年，金角湾兵工厂的船台尽头。搁在滚木上五年没下水的救生艇，船舷上那道座位槽。
[[tracks.chapters]]
key = "reunion"
title = "下了水的救生艇"
text = "五年以后我回到金角湾。兵工厂的船台又接长了一截，帆桨船一排排架着，锯木坑还在老地方。船台尽头的水边，一条小艇搁在两根滚木上，船头拿缆绳拴在桩子上，船身上过好几遍油，黑得发亮。船舷靠尾的地方，那道座位槽还在。塞利姆就在小艇旁边。他如今是船台上带人的匠头，跟着船匠哈桑学看图纸，腰上插着一卷图。他正抓着一个新学徒的手往一根弯木上按：“摸。从粗的那头摸起。锡诺普来的，腊月砍的——”还是当年那一套，一个字没改。“——砍的人下手急，第三圈年轮上有道伤。”我站在他身后，替他说完了。他按在弯木上的手停住了，过了好一会儿才回过头。他没说话，走到桩子边上，把小艇的缆绳一圈一圈解下来，递到我手里。“你的座位，”他说，“空了五年了。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "istanbul"
cast = ["selim_kereste"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

