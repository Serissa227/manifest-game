# A2：1556 年夏秋，工棚里。救生艇第一根肘木的边角刻的木勺（赠礼 carved_spoon + 回忆）。
[[tracks.chapters]]
key = "a2"
title = "弯木刻的勺"
text = "救生艇的第一根肘木装上去那天，塞利姆比我先到工棚。那根肘木是从一根弯木上锯出来的，弯得正好贴住龙骨，锯下来的边角他一块也没扔。傍晚他从怀里掏出一把木勺，塞到我手里。勺子不大，勺柄带一点弯，木纹从柄头顺下来，一路弯进勺底，中间没有一处断。“前头刻了三把，”他说，“都裂了。没顺着纹刻，刻到勺底一使劲，啪。”他拿手比画了一下，又把手收回去，“这一把，是顺着纹的。”我拿勺子在半空里舀了一下。他站在旁边看着，两只手在围裙上擦了又擦，好像勺子还在他手里，还没刻完。"
