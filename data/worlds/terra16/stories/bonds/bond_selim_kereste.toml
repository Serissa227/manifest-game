# S：1556 年 12 月，工棚里快要完工的救生艇。船舷靠尾的一道座位槽。
[[tracks.chapters]]
key = "s"
title = "先造完一条船"
text = "我在码头上找好了一条商船，开春去亚历山大港，跟着船学跑海。塞利姆不走。他要留在兵工厂，从龙骨到桅杆，把一条大船的活从头到尾学一遍。救生艇只差船舷上最后几块板了。工棚里冷，他呵着手刨一块舷板，刨花一卷一卷落到我脚边。“你回来的时候，”他说，“它就该下水了。”他把刨好的舷板钉上去，又拿刨子在船舷靠尾的地方推了几下，推出一道浅浅的槽。槽不长，刚够一个人坐进去，背靠着船舷。他拿手掌抹掉槽里的木屑，拍了拍。“这是你的座位。”"
