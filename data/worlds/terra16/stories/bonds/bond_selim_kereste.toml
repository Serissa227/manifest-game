text = "跟他赌：重逢的时候，看谁先当上船台的头。"
reply = "“你在海上，当不了船台的头。”塞利姆把刨子往船舷上一搁。“那我当一条船的头。”“船头不算，船台是船台。”“船长呢？船长算不算？”他想了想，觉得不能吃这个亏，又想不出驳我的话，只好说：“那就比一比。你当上船长，我当上船台的头，谁先谁赢。”“输的呢？”“输的给赢的造一条船。”“一条小艇也算船。”“一条小艇也算。”他把手掌摊开，我狠狠拍了上去，啪的一声，房梁上积了一冬的木屑哗地落了我们一头一脸。他也不擦，抄起那块还没钉的舷板接着刨，刨得比刚才快了一倍。"
