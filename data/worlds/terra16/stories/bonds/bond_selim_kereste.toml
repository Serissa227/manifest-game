text = "五年以后我回到金角湾。兵工厂的船台又接长了一截，帆桨船一排排架着，锯木坑还在老地方。船台尽头的水边，一条小艇搁在两根滚木上，船头拿缆绳拴在桩子上，船身上过好几遍油，黑得发亮。船舷靠尾的地方，那道座位槽还在。塞利姆就在小艇旁边，腰上插着一卷图，正抓着一个新学徒的手往弯木上按，教的还是锡诺普、腊月那一套。我在他身后接了一句：“第三圈年轮上有道伤。”他头都没回：“船长当上了没有？”我还没开口，他已经走到桩子边上，把缆绳解下来，往我手里一递：“先别说。座位空了五年，你先坐，坐完再算账。”"

[[tracks.chapters.variants]]
key = "v2_mark_covered"
when = [{ kind = "flag", flag = "c7_bond_selim_kereste_romance" }]
text = "五年以后我回到金角湾。兵工厂的船台又接长了一截，帆桨船一排排架着，锯木坑还在老地方。船台尽头的水边，一条小艇搁在两根滚木上，船头拿缆绳拴在桩子上，船身上过好几遍油，黑得发亮。船舷靠尾的地方，那道座位槽还在；槽边钉着一小块皮子，四个角打着铜钉，把底下的什么盖得严严实实。塞利姆就在小艇旁边，腰上插着一卷图，正教一个新学徒摸木纹，教的还是锡诺普、腊月那一套。我在他身后替他说出了下半句。他回过头，眼睛先往那块皮子上飞快地瞟了一眼，才看向我，耳朵根一点一点红了。他走到桩子边上，把缆绳解下来，递给我。“你的座位，”他说，“空了五年了。”"

[[tracks.chapters.variants]]
key = "v3_last_plank"
when = [{ kind = "flag", flag = "c7_bond_selim_kereste_parted" }]
text = "五年以后我回到金角湾。兵工厂的船台又接长了一截，帆桨船一排排架着，锯木坑还在老地方。船台尽头的水边，一条小艇搁在两根滚木上，船头拿缆绳拴在桩子上，船身上过好几遍油，黑得发亮。船舷靠尾的地方，那道座位槽还在，最后一块舷板的钉帽比别处的都新。塞利姆就在小艇旁边，腰上插着一卷图，正教一个新学徒摸木纹，教的还是锡诺普、腊月那一套。我在他身后替他说出了下半句。他回过头，半天才开口：“你走那天，我在钉这一块。”他拿指节敲了敲那块舷板，“钉完跑到码头，船已经出了金角湾。”他把缆绳从桩子上解下来，递给我：“你的座位，空了五年了。”"
