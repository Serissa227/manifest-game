# 塞利姆·凯雷斯特：弯木的来处（bond_selim_kereste / reunion_selim_kereste）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用轨道与章节 key、地点与年份、C1 标题。
# 标签：BL（羁绊线，可恋爱）。塞利姆 romance.with = any；主角性别由玩家定，男主角时为 BL、女主角时为 BG。适用主角：自创主角（金角湾兵工厂的孩子 custom_istanbul_shipyard）。
# 人物：塞利姆·凯雷斯特 selim_kereste（1540-03-16，男）；自创主角（模板生年 1540-01-01，“我”，不写性别、外貌与家族专名；懂船上的叫法、爱抬杠、字写得丑）。
#       学院期 1554—1556：主角 14—16 岁，塞利姆 13—16 岁（1556-03-16 满 16）。A1（1556-01..05）塞利姆 15—16 岁，A1 的心动只写扶龙骨、待到天黑。
#       S 章（1556-12）双方都是 16 岁，心动选项只到牵手与 crush；重逢 1562：主角 22、塞利姆 21—22，双方成年，恋人落点合法。生年相差两个半月。
# 依据：
#   史实——金角湾的奥斯曼兵工厂（船台、锯木坑、木料场）；造船的橡木多从黑海南岸锡诺普、卡斯塔莫努一带的山林运来；
#         肘材要用天然弯木顺纹取料；帆桨船的桨手多是用链子锁在桨凳上的苦役与俘虏；帆桨船多在开春下水。
#   原创——塞利姆其人；木料场的烙印牌（写产地与砍伐的月份）；锯木坑后面草席盖着的省下来的好料；船底的补丁与重上的整块板；
#         戴戒指的验料官与烙印的抄单；废弃工棚里的救生艇、墙上木板画的小艇图；弯木边角刻的木勺；船舷上的座位槽与槽边的两个记号；船尾烙的下水日子。
#   待核——十六世纪帆桨船是否配专门的救生小艇（大船拖带小艇是常例，“救生艇”的用法是本线与 tie_extra_07 共用的原创设定）；
#         木料场是否给每根料挂产地牌，按常理拟写。
# 缺省走向：C1—A2 的 default 无收获（弯木第二天上了船台；那堆木料挪了地方，再没找着；船下水时接缝还渗水，监工骂了两人一顿；他到底没签，那批料换没换成也不知道；工棚一直锁着；木勺挂在墙上）；
#           S 的 default 开启重逢并设 c7_bond_selim_kereste_parted（他在工棚钉最后一块板，没来码头）；
#           重逢的 default 是塞利姆寄来的信与一块烙着下水日子的小木牌（letter），设 c7_bond_selim_kereste_missed。
# 旗标：写 c7_bond_selim_kereste_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       S 的 promise 与 heart 另设共享旗标 c7_tie_new_piero_vetro_selim_kereste_taken（配角线 tie_new_piero_vetro_selim_kereste 读，据此改走“并肩的朋友”）。
#       重逢的三个 variant 读本文件的 _own / _romance / _parted。
# 羁绊阶梯：C2 cover_and_log 给 C、B1 redo_your_half 补签 C；B2 copy_brands 给 B、A1 keep_it_secret 补签 B；A2 take_spoon / trace_the_grain 给 A + 木勺 carved_spoon + 回忆。
# 心动：A1 hold_the_keel +6；A2 trace_the_grain +6（要求已有 6）；S heart +12（要求已有 12）→ 全选心动正好 24，重逢 love 落点要 24（简报把决定表的 S +10 改为 +12）。
#       心动只能由故事效果产生，本文件以外没有给塞利姆加心动的来源；不走 S 的 heart 选项，心动至多 12，所以“心动 ≥ 24”已经蕴含 c7_bond_selim_kereste_romance。
#       重逢 love 的 requires 因此只写心动与双方年龄，不再重复写 romance 旗标（审计机器人单独跑重逢轨道时不能伪造本文件的分支旗标，写了会报分支错误）。
# 口头禅：“顺着纹下刀，别硬劈。”只在 C1 原样出现一次；B2 的 sign_now_check_later 里他只说了半句就停住。
# 秘密：省下的好木料留给一条救生艇——C2 撞见、A1 他说出缘故；本文件的羁绊章没有 stage，不写见闻。
# 与 tie_extra_07_hasan_selim_kereste 的衔接：学院里这条小艇造好后一直搁在船台尽头的滚木上没下水（等主角回来坐第一个座位）；
#       extra_07 里 1562 年哈桑掀开帆布看见的，是塞利姆 1559 年起另攒的一条，1563 年作为兵工厂的“第一条救生艇”下水。重逢里哈桑只作“他跟着学看图纸的船匠”提一句，不出场。
# 日程：重逢在 1562 年的伊斯坦布尔，塞利姆按 cast 留在伊斯坦布尔，无需改日程。莱拉、皮耶罗不在本文件出场。

