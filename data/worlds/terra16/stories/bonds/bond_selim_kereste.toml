# B1：1554 年秋冬，船台上一条赶着开春下水的帆桨船。船底一块漏水的板。
[[tracks.chapters]]
key = "b1"
title = "重上一整块板"
text = "一条帆桨船要赶在开春下水，往船底灌水试漏，有一道接缝渗水。监工把我和塞利姆一起赶到船底下：“明天以前给我堵上。”塞利姆拿指节敲了敲那块板，侧着耳朵听：“整块拆下来，重上。”“拆什么，”我说，“抠掉那一截，嵌一块新的就行。拆一块板要拆半天，钉子还得重打。”“补过的地方，水记得。”“水记得个什么？”我们在船底下吵了一下午，吵得船匠们都探头下来看笑话。最后各干各的：他把他那半边的板拆了，从头刨、从头上；我把我这半边的烂处抠掉，嵌进一块新木头，敲得严严实实。第二天再灌水，船底下站了一圈人。他那一半一滴不漏。我这一半，补丁四周慢慢洇出一圈水印，像有人拿湿手指在木头上画了个圈。"
