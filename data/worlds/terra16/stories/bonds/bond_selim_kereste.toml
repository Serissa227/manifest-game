# B2：1555 年，木料场。戴戒指的验料官要换军船用料；烙印账簿上那一行他不肯签。
[[tracks.chapters]]
key = "b2"
title = "不肯签的名字"
text = "木料场来了个新验料官，右手戴着三个戒指。他在料垛中间转了一圈，挑出一批给军船用的上等橡木，叫人运进后面的库房；又拉来一批又湿又带节疤的，记在账上，说就是那一批。差价进了谁的口袋，场子里人人心里有数。烙印账簿摊在一只木桶上，验料官叫木料场的学徒一个一个签字作证。前头几个都签了，签完低着头走开。轮到塞利姆，他拿起笔，看了一眼那一页，又看了一眼料垛，把笔放下了。“这批料我认得，”他说，“卡斯塔莫努的山阴面，去年腊月进的场。不是这个数。”验料官笑了一声：“一个学徒，认得几根木头？”塞利姆没接话。他的手攥着账簿的边，指节攥得发白，那一页纸被他攥出了一道折痕。"
