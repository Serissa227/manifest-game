reply = "我借了他的刻刀，在那道槽的边上刻了一个记号，小小的，歪歪扭扭，我自己也说不好它像什么。“这是什么？”“等我成年回来，再告诉你。”塞利姆拿拇指去摸那个记号，顺着刻痕摸过去，又摸回来，摸了很久。工棚里只听得见金角湾的浪一下一下拍着船台。“那我在旁边也刻一个。”他把刻刀要回去，背过身，不让我看，刻得很快，刻完拿袖子一挡：“你回来再看。”开春上船那天，他来码头送我，一句话也没说。收跳板以前，他忽然抓住我的手，攥得死紧，又松开了。船出了金角湾，我才摊开手，掌心里还沾着几粒木屑，我没舍得拍掉。"
