# A1：1556 年春，锯木坑后头的废弃工棚。一根龙骨，墙上木板画的小艇图；他说出缘故。
[[tracks.chapters]]
key = "a1"
title = "救生艇"
text = "开春以后，塞利姆终于带我去看那堆木料的新去处。是锯木坑后头一间没人要的工棚，门上的锁比工棚还新。他开了锁，侧身让我先进。木料一块也没少，码在墙根。地当中架着一根龙骨，两头拿木楔顶着；墙上靠着一块刨平的木板，炭条画了一条小艇，船身胖胖的，旁边写着一串数目。“我八岁那年，”他说，“在马尔马拉海边看过一条帆桨船沉下去。船上只有一条小艇，军官先上，满了就划走。桨手锁在桨凳上，一个也没上去。”他拿手掌抹掉龙骨上的一层木屑，“兵工厂一年造一百条大船，不肯多造一条小艇。我就自己造。”工棚的顶漏了一块，傍晚的日头从那个窟窿里照下来，正好落在龙骨中段，把木纹照得一道一道的。"
