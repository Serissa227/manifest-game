# C1：1554 年初，兵工厂的木料场。一根挂着烙印牌的弯木。
[[tracks.chapters]]
key = "c1"
title = "弯木的来处"
text = "开春要下水的帆桨船还缺几根肘材，监工打发我去木料场挑弯木。料垛边上蹲着塞利姆，学院里跟我坐一张长凳的那个木料场学徒，正拿一块破布擦一根弯木上的泥。我拍了拍那根木头：“擦什么，不就是一根橡木。”他没抬头，把手掌贴上去，从粗的一头慢慢摸到细的一头，摸得跟裁缝量布似的。“锡诺普来的，”他说，“冬天砍的。砍的人下手急，头一斧落偏了——第三圈年轮上有道伤。”我不信。哪有摸一摸就知道是哪座山的。垛子上钉着一块烙印牌，被烟熏得发黑，我一把翻过来：上头烙着两个记号，锡诺普，腊月。塞利姆把牌子从我手里拿回去，挂回钉子上，挂正了，才抬眼看我。“顺着纹下刀，别硬劈。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "istanbul"
cast = ["selim_kereste"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_golden_horn_yard" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "bet_a_mark"
text = "不服，跟他赌：下一根木头，我先找出砍伐的记号。"
reply = "他说行，往垛底一指。我把那根木头从头翻到尾，翻了一下午，最后在树皮缝里翻出一窝蚂蚁，喊他来看。塞利姆笑得一屁股坐到木堆上，半天直不起腰。笑够了，他拉过我的手，按在木头根部一处平平的地方：斧口是斜的，砍的人站在坡下头。“下回，”他说，“先摸，再翻。”"
next = "c2"
effects = [{ kind = "affinity", person = "selim_kereste", value = 2 }]

[[tracks.chapters.choices]]
key = "learn_rings"
text = "请他教我怎么看年轮。"
reply = "他找来一截锯下来的木墩，拿指甲一圈一圈点给我看：宽的是雨水足的年头，窄的是旱年。他讲得慢，一圈能讲半天，讲到日头落到兵工厂的院墙后面，我才把十几圈认全。最里头有一圈细得几乎看不见，挤得发黑。“旱年。”他拿指甲在那一圈上按了按，“人也是这样，旱年的那一圈最紧。”"
next = "c2"
effects = [{ kind = "affinity", person = "selim_kereste", value = 3 }, { kind = "skill", skill = "shipbuilding", value = 8 }]

# C2：1554 年夏，锯木坑后面的荒地。一堆用草席盖着的好木料；他的秘密从这里开始。
[[tracks.chapters]]
key = "c2"
title = "锯木坑后面"
text = "傍晚收了工，我回锯木坑找丢了的刨子。坑里只剩锯末，刨子没找着，坑后面那片荒地上倒多了一堆东西，拿草席盖着，席角压着砖。我掀开一角。底下码得整整齐齐，全是好料：纹路一指宽，没有节疤，没有虫眼。每一块都不大，看得出是从别的料上省下来的——这儿一截肘材的头，那儿一段船板的尾，锯口还是新的。照规矩，这些边角是要送去灶房烧火的。“别动。”塞利姆站在我身后，脸色难看得吓人。他一把把草席拉回去，盖严，又把砖一块一块压回席角。“你攒这些做什么？”他不说。压好最后一块砖，他才开口，声音比平时还慢：“没偷。省下来的。”"
