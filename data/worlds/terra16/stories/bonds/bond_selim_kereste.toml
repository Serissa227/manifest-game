reply = "“下水那天，”我说，“我回来，第一个坐上去。”塞利姆没马上答。他把刨子又放进那道槽里，推了一下，再推一下，刨花细得像头发。槽深了一指。“刨深了，”他说，“你就得回来。不然它空着，难看。”“要是我回来晚了呢？”“那就晚着。”他吹掉槽里的刨花，“锡诺普的橡树，长一百年才砍下来，它还在乎你多走几年？”我坐进槽里试了试，背正好靠住船舷，腿却伸不直，得蜷着。我说他量错了。他说没量错，是照我在学院长凳上蜷着打瞌睡的样子刨的。开春我走那天，他到码头来送，手里还拎着那把刨子，好像一转身就要回工棚接着刨。"
