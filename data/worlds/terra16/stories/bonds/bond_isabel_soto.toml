# C1：1554 年春，总署回廊。口头禅原句；物件：没有落款的海图。
[[tracks.chapters]]
key = "c1"
title = "图上没有名字"
text = "总署的回廊底下，伊莎贝尔把一张海图拍在石栏上，四个角拿东西压住，其中一角压的是她的墨水瓶。“谁画的？画错了。你找。”图上是从圣文森特角到直布罗陀海峡的海岸，岬角、沙洲、河口，线细得像头发。我从西往东看了一遍，又从东往西看了一遍，连水深的小数字都对过了，没找着。夹着卷宗的书记从回廊里走过，有一个回头多看了我两眼，我把帽檐往下一压。“找不到？”她的指甲敲在图的右下角。那里该写绘图人的名字，什么都没有，只有一块蹭花的墨。“错在这儿。”“你画的？”“我画的。爷爷拿去给考生描，描完挂在考场里，谁也不问是谁的手。”她把图卷起来，卷得很紧，拿一根麻绳扎上。“女孩领不到执照，名字签上去也要刮掉。所以每一张我都留一份底。总有一天，我把它们一张一张摆出来。”扎绳子的时候，她在图卷上又按了一个黑指印。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["isabel_soto"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_seville_tarifa" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

