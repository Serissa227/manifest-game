reply = "“签了有什么用？考场里又不挂这一张。”她瞪我一眼，把图卷夹在胳膊底下走了。第二天一早，她在讲席门口堵住我，把图卷抖开一角：右下角多了一行字，伊莎贝尔·德·索托，比图上的海岸线描得还工整。“我练了半夜，”她说，“签坏了三张纸。不许笑。”"
