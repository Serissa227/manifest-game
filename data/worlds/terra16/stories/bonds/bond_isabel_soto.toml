# A1：1556 年春，钟楼朝南的窗。物件：画板。
[[tracks.chapters]]
key = "a1"
title = "上面的星"
text = "开春头一个晴夜，伊莎贝尔来敲我的窗，没扔石子，敲了三下，等我开窗。“今晚上钟楼，你来不来？”她两只手各提一盏灯，“不来也行，我一个人去。”这回她先问了。我说来。她把画板塞给我，自己提灯。还是那扇朝南的窗。她把纸钉在画板上，让我托着，对着窗外描春天的星：一颗，连一条线，再一颗。描到第四颗，她停了笔，笔尖悬在纸上不动。“怎么不画了？”“等你。”她说，“你先看清下一颗在哪儿，再告诉我。我画快了，你跟不上。”我凑到窗口找星。找着了，一回头，她没在看星，在看我。我说看我干什么，星在外头。她把眼睛挪回纸上，笔尖落下去，那条线画得有点歪。"
