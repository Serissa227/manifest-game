# C2：1554 年夏夜，吉拉尔达钟楼的坡道。物件：偷来的星盘。
[[tracks.chapters]]
key = "c2"
title = "钟楼的坡道"
text = "夏夜，有人往我窗上扔石子。我刚睡着，探头一看，伊莎贝尔站在街上，斗篷底下鼓起一块。“爷爷的星盘。”她掀开一角，黄铜在月光下亮了一下，“今晚测南边那颗红星，天亮前放回去。走。”大教堂的钟楼夜里没人守，侧门虚掩着。塔里没有台阶，是一道接一道的坡，宽得能骑马上去，转一个弯，又是一个弯。她提着一盏小油灯走在前头，走得飞快。走到第十几道坡，灯芯噼地响了一声。“油不多了。”她说。“出门时你就知道？”“出门时我急着走。”她没回头，“上面的钟还远着。半路有一扇朝南的窗，那颗星从那里看得见，不登顶也够。”灯苗越来越小，照得见脚下的砖，照不见下一个弯。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["isabel_soto"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

