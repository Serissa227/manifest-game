# A2：1556 年夏，总署后院。借名交图（秘密只在这里正面写出）；物件：只署了她名字的小星图。
[[tracks.chapters]]
key = "a2"
title = "你的名字比我的有用"
text = "夏天，总署给新修的标准海图收一批副本，考官们的学生都能交。我去总署抄讲席要用的星表，书记一边找一边跟我搭话：“你那张图交得好，安达卢西亚那一段，连领航总长都点了头。”我从来没交过图。我去找伊莎贝尔。她在后院的台阶上削笔，看见我的脸，就知道我听说了。她没站起来。“是我签的。”她说，“签我的名字，他们连打开都不会打开。签你的，就挂上去了。”她把削好的笔在指头上转了一圈，“反正你的名字比我的有用。”我等她说对不起。她没说。她从怀里掏出一张折成四折的小纸，塞进我手里：一幅小星图，画的是钟楼那扇窗里的春天，右下角一行字，是她自己的名字，签得端端正正。“这张是我的，”她说，“谁也拿不走。”"
