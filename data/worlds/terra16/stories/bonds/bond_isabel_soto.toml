# B1：1554 年秋，总署后院的台阶。物件：图上两条挨着的细线。
[[tracks.chapters]]
key = "b1"
title = "不准擦的线"
text = "秋天，讲席的先生让我们各测一处纬度，交上去比。我在河边的黄金塔底下测塞维利亚，比她图上标的多出几分。我拿着数去找她。她在总署后院的台阶上铺开图，听完，没争，先把笔递给我：“几时测的？站在哪儿？测的太阳还是星？手上的测天仪是谁的？全写下来。”“写这么多干什么，再测一遍不就知道了。”“再测一遍，错的还是错的。”她把笔往台阶上一放，“若只找赢的人，不如去比剑。”我只好一条一条写。写到第三条，她咬着指甲凑过来看。重测在三天以后的正午，两个人各带一副测天仪，站在同一块石头上。数一出来，我的横杆是松的；她那张图照着旧表算，表里的赤纬抄错了一行。图上那个地方，现在挨着两条细线，中间隔不了一根头发。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["isabel_soto"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

