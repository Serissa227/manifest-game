# S：1556 年 12 月，瓜达尔基维尔河边的码头。物件：她攥在斗篷里的东西（各分支不同）。
[[tracks.chapters]]
key = "s"
title = "你的船，我来画路"
text = "十二月的码头冻得人缩脖子。船泊在瓜达尔基维尔河边，顺流下到桑卢卡尔，开春往西出海。伊莎贝尔来了，没带图，两只手揣在斗篷里。她站在我跟前，不看我的脸，盯着我的帽檐。“爷爷说，考官们缺一个描图的，”她说，“明年起我去总署后面那间屋子画。照旧没有执照，照旧没有名字。”“你答应了？”“答应了。那屋里有全西班牙最新的海岸，一张都不许带出门。我不进去，谁替我看？”她吸了吸鼻子，鼻尖冻得通红，“你往西走，那边的海岸还没人画准过。看见了就记下来，写信给我。写错了，我会挑出来的。”船上有人喊开舱。她的手在斗篷里动了动，像攥着什么东西。"
