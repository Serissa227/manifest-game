# C7 重写（2026-10-12，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。旧版（GPT）整篇作废，只沿用轨道 key、章节 key、地点与窗口。
# 标签：GB（伊莎贝尔主动推进；羁绊线，可恋爱）。主角：诺埃尔·德·卡德纳（noel，1540-11-11）。
# 人物：伊莎贝尔·德·索托 isabel_soto（1541-03-25，塞维利亚贸易总署一位领航考官的孙女；romance.with = [m]，对诺埃尔开放）。
#   各章年龄：C1（1554-01..04）伊莎贝尔 12—13、诺埃尔 13；A1（1556-01..05）14—15 / 15；A2（1556-06..11）15 / 15—16；
#   S（1556-12）诺埃尔 16、伊莎贝尔 15：心动选项只写交换信物与攥手，“约好成年相见时再答”；
#   重逢（1564）伊莎贝尔 22—23、诺埃尔 23—24，恋人落点合法。学院期（C1—S）只到 heart / crush。
# 依据：
#   史实——塞维利亚贸易总署（Casa de la Contratación）掌管标准海图（padrón real）与领航员考试，1552 年设宇宙志讲席；
#         领航员用星盘（带照准规）与十字测天仪测纬度，正午测太阳要查赤纬表；
#         大教堂的吉拉尔达钟楼塔身里是三十几道坡道，宽得能骑马上去；河边的黄金塔；对岸特里亚纳的船坞。
#   原创——伊莎贝尔一家、无署名的海图与留底、半夜爬钟楼、朝南的窗、两条挨着的细线、凹了的照准规与特里亚纳的老匠人、
#         借名交图、小星图、铅锤笔与星盘挂坠、总署后屋的“无名的手”。总署收副本、考场挂图都是为故事设的情节。
#   待核——1556 年总署是否向学生征集标准海图的副本（正文只写“收一批副本”，不写制度）。
# 秘密：A2 那张交上去的图署的是诺埃尔的名字，是伊莎贝尔自己签的。只在 A2 正面写出；任何见闻、标题、回忆标题都不提借名。
# 诺埃尔的伏笔（DECISIONS 2.2）：学院期只有三处——C1 回廊里的书记多看了两眼、我压低帽檐；A1 她不看星看我，我嫌她看；
#   S 她不看我的脸，盯着我的帽檐。标题、选项、回复、回忆标题里不放；中文不用“他/她”指诺埃尔。
#   重逢基础文本不点破；揭开后她那一句只写在 variants.unveiled 里。
# 口头禅“谁画的？画错了。”原句只在 C1 用一次；S 的“写错了，我会挑出来的”与重逢来信的“谁画的？我画的。”是改了字句的呼应。
# 羁绊阶梯：C2 count_ramps → C；B2 fix_it → B；A2 keep_sketch / witness_it → A + star_sketch + 回忆。
#   心动：A1 hold_board +6、A2 witness_it +6（要求已有 6）、S heart +12 = 24，正好到重逢恋爱落点的门槛。
# 各章 default（玩家没来，正文不显示，写在这里备查）：
#   C1 她拿图去问讲席上的同学，没人找得出错，她把图卷起来收进留底的匣子；C2 她一个人上了钟楼，灯在半路灭了，摸到那扇窗测完才下来；
#   B1 两条线她都留着，注脚只写了她自己那一条；B2 她一个人去了特里亚纳，修是修好了，工钱欠了半年；
#   A1 她一个人画完了春天的星；A2 那张小星图她夹进了自己的留底匣子；
#   S 开舱那天她没来码头，托水手捎来一卷圣文森特角的草图（_parted，照样开启重逢）；
#   重逢 我没去总署后屋，她托人寄来一封信和一张航路图（_missed）。
# 落点：朋友 friends（_landing_friend，永远可选）；恋人 lovers（_landing_love，要 c7_bond_isabel_soto_romance、心动 ≥ 24、双方满 18）。
