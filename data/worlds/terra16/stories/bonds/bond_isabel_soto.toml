# B2：1555 年开春，讲席门口。物件：凹了的照准规。
[[tracks.chapters]]
key = "b2"
title = "凹了的照准规"
text = "开春的一个清早，伊莎贝尔在讲席门口等我，眼圈是青的。她把一个布包往我怀里一塞，自己不肯再碰。我解开布包，是她爷爷的那只星盘。照准规的一头凹进去一块，像被人咬了一口。“昨晚又上了钟楼，”她说，“下坡的时候脚底一滑，我抱着它摔下去，它先着的地。”她把袖子撸起来，胳膊肘擦破了一大片，她看都没看。“爷爷明天要用。考场里新来了一批领航员，他要当着他们的面拿它测正午。”她的脸白得吓人。我以为她要哭，她没哭，吸了一下鼻子，问的是：“你认不认得会修黄铜的人？要手稳的，刻度一分都不能动。”"
