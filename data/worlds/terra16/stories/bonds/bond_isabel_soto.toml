[[tracks.chapters]]
key = "reunion"
title = "无名的手"
text = "八年以后，我的船又停进了瓜达尔基维尔河。总署的书记换了一茬，领航员也换了一茬，可考场里挂的海图，谁都说最准的那几张出自同一只手。没人知道是谁的手，大家就管它叫“无名的手”。我在总署后面那间屋子里找到了伊莎贝尔。屋里一股墨和胶的味道，她坐在长桌一头，手指还是黑的，比当年黑得更深。桌上并排摊着两张图：一张是总署的底稿，右下角是我的名字；一张是她自己的原稿，纸边磨毛了，右下角是她的名字。两张图上的海岸，一根线都不差。“这是第九张。”她头也没抬，拿尺子比着两张图的边，“前八张，我都要回来了。书记说，要回来得有证人。”她这才抬起头，把笔往桌上一放。“这一张上头写的是你。”她说，“这回你来不来作证？”"
window = [[1564, 1, 1], [1564, 12, 31]]
at = "seville"
cast = ["isabel_soto"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1564, 1, 1], to = [1564, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "isabel_soto", text = "诺埃尔：你的船来了又走，我在后屋听书记说起，追到码头，只看见河口的帆。先说正事。第九张图，我要回来了。没等到你作证，我找了三个老领航员，让他们拿我的原稿去对海岸，对了一个月，一根线都不差。书记没话说，在底稿上添了我的名字。字写得太小，我让他重写了一遍。现在总署里叫我“无名的手”的人少了，叫我“索托家那个挑错的”人多了，我觉得后一个好听些。随信附一张航路图，从加那利往西到伊斯帕尼奥拉，风向和水深都标了，是我拿十几本航海日志一笔一笔对出来的。谁画的？我画的。署名这回是我自己的，你看右下角。用的时候要是发现哪里不对，写信来，我改。你要是看出来了却不写，那更糟。伊莎贝尔·德·索托" }, { kind = "flag", flag = "c7_bond_isabel_soto_missed" }]

