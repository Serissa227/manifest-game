reply = "我在桌边坐到第三天的半夜。最后一袋称完，他把最后一枚码上去，摞得整整齐齐，在账上画了最后一道。然后他放下秤，看着我。我站起来，走到门里，离门槛一步的地方。“当年我说过，有一句话，要进了门再说。”他没让我往下说。他绕过柜台，拉住我的手腕，把我拉进铺子里，回身把门关上了。门闩落下去，响得整条街都听得见。那扇说好开着等我的门，这是头一回闩上。灯在柜台上晃了一下。他吻了我，很慢，像他做什么事都慢，好像要称准了才肯放手。然后他退开一点，额头还抵着我的额头：“这扇门，我开了二十二年。”"
