next = "s"
effects = [{ kind = "affinity", person = "yaqub", value = 3 }]

# S：1556 年 12 月，我回阿尔及尔以前。金匠铺的门。
[[tracks.chapters]]
key = "s"
title = "回来先敲门"
text = "十二月里，阿尔及尔来了信：开春，船长们给我一条自己的小船。雅库布不走，金匠铺是他父亲的，往后是他的。我去辞行那天，铺子里正忙，柜台上摊着一堆待称的银子，他让我在桌边坐着，等他称完手里那一把。称完了，他还是没抬头：“你回来，先敲门。我要是在忙，你就在桌边先坐着，像今天这样。”我说那我回来得带点什么，带一船货给你称。“不用每次都带贵重的东西来。”他把一枚币放上秤盘，“带你自己来就行。”说完他低下头去称那枚币，加一个砝码，减一个，又加回去，称了很久。那是一枚再普通不过的币。我听得出来，它落在桌上的时候，是“叮”的一声。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

# 无人回应：开春我上船那天，雅库布在铺子里称银子，门开着。只开重逢，不改关系。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_yaqub" }, { kind = "flag", flag = "c7_bond_yaqub_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "跟他约好：每次回非斯，先敲他的门，再去别处。"
requires = [{ kind = "bond", person = "yaqub", level = "A" }]
hint = "先敲他的门，是要敲一辈子的。我们的交情还压不平这杆秤；要么，回来先敲哪扇门，我已经答应了另一个人。"
reply = "“先敲你的门，再去别处。”我说，“清真寺、澡堂、我欠着钱的那家烤肉铺，都排在后头。”他放下秤，从抽屉里拿出那把錾子，走到门口，在门框齐肩的地方刻了一道，刻得很深，木屑落在他的鞋面上。“敲一回，刻一道。”我说照这么刻下去，门框迟早被你刻烂。他吹掉錾子上的木屑，想了想：“那就换一扇门。”他把錾子递给我，叫我在旁边也刻一道，算头一回。我刻歪了，歪得像一条蛇。他看了半天，没让我重刻，用指头顺着那道歪痕摸了一遍：“这样也好。歪的那一道，一看就是你。”开春动身那天，我绕路走了一趟梅拉。铺子的门开着，门框上并排两道痕，一道直，一道歪。"
next = "done"
effects = [{ kind = "bond", person = "yaqub", level = "S" }, { kind = "relation", person = "yaqub", relation = "friends" }, { kind = "memory", memory = "mem-bond_yaqub-s", title = "回来先敲门" }, { kind = "flag", flag = "c7_bond_yaqub_promise" }, { kind = "flag", flag = "c7_pair_musa_yaqub_taken" }, { kind = "start_track", track = "reunion_yaqub" }]

[[tracks.chapters.choices]]
key = "heart"
text = "跟他说：成年回来那天，敲了门，有一句话要进了门再说。"
requires = [{ kind = "bond", person = "yaqub", level = "A" }, { kind = "heart", person = "yaqub", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "yaqub", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "yaqub" }]
hint = "他还在称那枚币，加一个砝码，减一个；我那句话也跟着称来称去，落不下来：心里还不够分量；要么，同样的话，我已经许给了另一个人。"
reply = "“等我成年回来那天，”我说，“敲了门，有一句话，我要进了门再说。”他手里的秤盘停在半空。他放下秤，看着我，看了很久，久到门外一头驮水的驴走过去，又走了回来。我以为他要问是什么话，他没问。“那我把门开着等。”我说门开着，风要把你的灯吹灭。他说灯灭了再点。临走那天早上，驮队在梅拉门口等着，他送我到门边，伸出手。我以为是要握一握，像商人成交那样。他握住了，握得很稳，没有马上松开，像是在掂它的分量，掂了一下，又掂一下。赶驮队的人吹了第二声口哨，他才松手，把手揣回袖子里：“去吧。门开着。”"
next = "done"
effects = [{ kind = "bond", person = "yaqub", level = "S" }, { kind = "heart", person = "yaqub", value = 12 }, { kind = "relation", person = "yaqub", relation = "crush" }, { kind = "flag", flag = "c7_bond_yaqub_romance" }, { kind = "memory", memory = "mem-bond_yaqub-s", title = "回来先敲门" }, { kind = "flag", flag = "c7_pair_musa_yaqub_taken" }, { kind = "start_track", track = "reunion_yaqub" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟他赌：十年里，看谁先让自己的名字值钱。"
requires = []
reply = "“十年，”我伸出两只手比划，“十年以后，我的名字在海上值一条船，你的名字在梅拉值多少？”他想了想：“金匠的名字，要一辈子才值钱。”我说海盗的名字一夜就值钱，劫一条船，第二天整个阿尔及尔都知道。他笑了，难得笑出了声：“那你一夜之间也可能不值钱。”他从柜台底下抽出一张纸，写上赌约，叫我按手印。我按了，他也按了，两个印子一大一小，我的那个按歪了。他把纸折好，没锁进柜子，压在了秤底下：“十年以后，拿出来称一称。”"
next = "done"
