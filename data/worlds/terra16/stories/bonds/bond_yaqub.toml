reply = "“我只劫货，不劫人。”我拍拍木匣，“劫来的货，上船先称。”“那你可得称准，”他说，“称不准的，拿回来，我替你重称。”我说那你得一直在这儿等着。他看了看门外的街，又看了看我，把那句话说得像在报一个分量：“我能去哪儿。”"
next = "s"
