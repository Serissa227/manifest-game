text = "答应替他去找那个姑娘，问她花纹改一改行不行。"
requires = [{ kind = "affinity", person = "yaqub", ge = 50 }, { kind = "bond", person = "yaqub", level = "C" }]
hint = "这种事要有交情垫着。他还没肯把主顾的名字告诉我，更别说让我替他去开这个口。"
reply = "姑娘住在梅拉另一头，家里正缝嫁妆。我把画着新花纹的纸给她看，先给她弹了一段乌德琴，再说叶子卷起来是因为风大，风大的人家日子旺。她笑得针扎了手，说改了更好看。我跑回去告诉雅库布，他听完，长长出了一口气，肩膀一下子松了：“你这张嘴，原来不光会讲笑话。”"
next = "a2"
effects = [{ kind = "affinity", person = "yaqub", value = 2 }, { kind = "bond", person = "yaqub", level = "B" }]

[[tracks.chapters.choices]]
key = "tell_a_story"
text = "给他讲格拉纳达老匠人的故事：打坏的东西，怎么修成了宝贝。"
requires = []
reply = "我讲阿尔拜辛一个老铜匠，把一只摔瘪的水壶敲了三年，敲成了一盏灯。我讲得很慢，学我祖母的口气，一句一顿。他手里的锉没停，耳朵却偏过来了。讲完他问：“你祖母讲的？”我说是。他把锉放下，想了想：“那这个故事，值一枚真银币。”"
next = "a2"
effects = [{ kind = "affinity", person = "yaqub", value = 3 }]

# A2：1556 年夏秋。一副对过官秤的小天平与砝码（balance_weights）。
[[tracks.chapters]]
key = "a2"
title = "小天平与砝码"
text = "雅库布送我一只小木匣，巴掌长，盖子上刻着一杆秤。打开，里面是一副小天平，铜秤盘擦得能照见人，底下一排砝码从大到小，最小的一枚比麦粒大不了多少。他说这些砝码，每一枚他都拿去官秤房对过。“你以后在海上劫……”他停了一下，把那个字咽回去，“……收到的东西，先称一称。”我笑出声来：“连一个‘劫’字都替我省了？”他没理我，把木匣扣好，又打开，把砝码一枚一枚拿出来，看一眼，放回去，最小的那枚他捏起来对着门口的光看了两回。最后他扣上盖子，推到我面前，手却还按在盖子上，过了一会儿才拿开。"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

# 无人回应：那副天平雅库布自己留着，摆在铺子的柜台上。
[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "keep_scales"
text = "收下天平，答应他：劫来的货，上船先称。"
requires = [{ kind = "affinity", person = "yaqub", ge = 80 }, { kind = "bond", person = "yaqub", level = "B" }]
