# 无人回应（错过非斯）：雅库布寄来一封信，附一枚新王头一炉的银币和一张写着成色的纸。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "yaqub", text = "塔里克：今年你没来非斯。海上的人忙，我知道；我这边也忙，饭都端到秤边上吃。这几个月，梅拉的金匠铺夜里都不熄灯。河边那一仗以后，葡萄牙人赎俘的银子一袋一袋送来，我称了四个月，秤杆磨亮了一截。有一袋里掺了三枚铅的，是一个侍从的赎金，他娘在里斯本当了嫁妆才凑齐。我拿自己的银子补上了，算在你名下——你要是在，也会这么做。信里夹的这一枚，是新王登基以后头一炉铸的，我从铸币坊换来的第一把里挑的。纸上写着它的成色：十二分里十一分是银，余下的是铜，铅一分也没有。我在试金石上划过，痕是亮的。你拿去，往桌上一扔，听一听，长的那一声就是它。铺子还在老地方，门开着。下回你的船再靠岸，进城来，先敲门；我要是在忙，你就在桌边先坐着。——雅库布" }, { kind = "flag", flag = "c7_bond_yaqub_missed" }]

