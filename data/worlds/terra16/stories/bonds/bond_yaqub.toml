# A1：1556 年春，金匠铺打烊以后。一枚刻坏了一刀的银戒指。
[[tracks.chapters]]
key = "a1"
title = "打烊以后"
text = "那天金匠铺上了门板，雅库布没让我走，叫我坐一会儿。他从柜台底下拿出一个布包，打开，是一枚没打完的银戒指。戒面上刻了一半的花纹，两枝缠在一起的石榴，左边那枝的叶子上多了一刀，深了，斜了，把一片叶子劈成了两半。“替一个要远嫁的姑娘打的，”他说，“下个月就要。打坏了，不敢交。”他把戒指卡进木夹子，拿起最细的那把锉，一点一点修那一刀。锉一下，吹一口气，凑到灯底下看，再锉一下。修得很慢，慢得我听得见灯芯在烧。我坐在他对面，手里转着乌德琴的拨片，转了一圈又一圈，一个笑话也没讲。他抬头看了我一眼：“今晚怎么这么安静？”我说：“怕吵着你的锉。”他没接话，低下头去，锉得更慢了。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

