# 先听声音（bond_yaqub）——羁绊线，标签 BL；雅库布纯 BL，与男主角塔里克可走恋爱落点。C1 C2 B1 B2 A1 A2 S + 主线重逢 reunion_yaqub。
# 人物：雅库布（yaqub，1540-07-10 生），非斯梅拉金匠的儿子，先听银币落桌的声音；说话慢、稳，像在称东西；口头禅“银会响，账不能哑。”只在 C1 用一次。
#       塔里克·加尔纳蒂（tariq，1540-01-02 生），主角，“我”；格拉纳达阿尔拜辛出生的摩里斯科少年，1554 年随萨拉赫·雷斯的军队到非斯，留在卡拉维因读书；“只劫货，不劫人”只在 A2 的回复里用一次。
#       年龄：C1（1554 春）塔里克 14、雅库布 13；A1（1556-01..05）塔里克 16、雅库布 15；A2（1556-06..11）雅库布 7 月 10 日满 16；S（1556-12）两人 16；重逢 1578 年两人 38。
#       学院期最多到心照不宣：A1 heart +6、A2 heart +6（要已有 6）、S heart +12 与 crush（要已有 12，双方 16—17，只到牵手）；恋人只在重逢，要 romance 旗标、heart ≥ 24、双方 ≥ 18。
#       简报原定 S 心动 +10，算下来全选心动只到 22，到不了重逢的 24；照简报改为 +12。
# 依据（史实）：1554 年 1 月萨拉赫·雷斯率阿尔及尔的奥斯曼军队护送瓦塔斯的阿布·哈松进非斯，城中遭劫；同年 9 月萨阿德的穆罕默德·谢赫夺回非斯，新王铸新币。
#       非斯的犹太区（梅拉）在新城，紧挨王宫，金匠多聚居于此；市场督察（muhtasib）管秤尺与钱色。试金石：黑色的燧石类石头，金银在上面划出的痕按成色深浅不同。
#       1578 年 8 月 4 日三王之战（马哈赞河，阿尔卡萨尔凯比尔）：葡萄牙国王塞巴斯蒂昂、苏丹阿卜杜勒·马利克、旧苏丹穆塔瓦基勒同日身亡；
#       被俘的葡萄牙贵族多经非斯与得土安的犹太中间人赎回，赎金要过秤验色；艾哈迈德·曼苏尔继位后铸新币。拉腊什是萨阿德王朝的港口。
# 原创：两枚“叮”与“嗒”的银币、镀银的杯子与杯底的锉痕、东头第三座炉子与督察的妻舅、卡拉维因的老法官、刻坏一刀的石榴纹戒指、
#       对过官秤的小天平、门框上的刻痕、赎金里掺的三枚铅币、新王头一炉的银币。
# 待核：萨阿德初年铸币坊的炉子数目与管炉人的身份没有细节，正文只写“东头第三座炉子”；1578 年赎金在非斯的过秤规模写成传闻与动作。
# 缺省走向：C1—A2 的 default 只往下走、不加数值（无人回应时的情节写在各章 default 上方的注释里）；
#       S 的 default 开启重逢并记 c7_bond_yaqub_parted（开春我上船那天，雅库布在铺子里称银子，门开着）；
#       重逢的 default：雅库布寄来一封信，附一枚新王头一炉的银币和写着成色的纸（c7_bond_yaqub_missed）。
# 共享旗标：写 c7_pair_musa_yaqub_taken（S 的 promise 与 heart；pair_musa_yaqub 据此改走“并肩的朋友”）；
#       读 c7_pair_musa_yaqub_together（重逢的变体 with_musa：桌边坐着满身尘土的穆萨在帮他数袋子，不写两人的事；由 pair_musa_yaqub 设）。
#       本线自有：c7_bond_yaqub_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#       重逢的变体 knock_marks 读本线的 c7_bond_yaqub_promise（门框上的刻痕只在立过“先敲门”之约时才有）。
#       with_musa 与 knock_marks 互斥：立过约就设了 taken，配角线不会设 together。
# 归属：验出假银币出自哪一炉归本线（B1—B2）；因假币被关进锁房归 pair_musa_yaqub；地窖困一夜归 bond_musa；1578 年战后的名单归 pair_musa_yaqub，本线只写替赎金过秤。
# 秘密：雅库布替穆萨藏了一枚牵涉假币案的银钱——属 pair_musa_yaqub，本线不写。
# 日程：不改。

[[tracks]]
key = "bond_yaqub"
name = "雅库布：先听声音"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["yaqub"]

# C1：1554 年开春，新城梅拉的金匠铺。两枚长得一模一样的银币。
[[tracks.chapters]]
key = "c1"
title = "先听声音"
text = "进城头一个月，我兜里揣着两枚银币，是船上一个老水手分给我的，说够我在非斯吃半个月。梅拉有家金匠铺能换零钱，门板上还留着前些天被枪托砸出的裂口。我挤进去，把两枚币拍在柜台上。柜台后头是个跟我差不多大的少年，袖口挽到肘弯，看也不看花纹，先捏起一枚，松手，让它落在桌上；又捏起另一枚，松手。一枚“叮”的一声，余音拖得很长；一枚“嗒”的一声，短得像敲在木头上。他把“嗒”的那一枚推回给我：“这枚掺了铅。”我笑出声来，说非斯的金匠原来靠耳朵吃饭，你这是装神弄鬼，下回是不是该请个瞎子来看秤。他不恼，把一杆小秤推到我面前，秤盘擦得发亮：“银会响，账不能哑。”顿了顿，又说：“耳朵会骗人，秤不会。你不信我的耳朵，就信它。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 无人回应：那两枚币我花掉了，后来才知道有一枚是假的。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "weigh_it"
text = "把“嗒”的那一枚放上秤，看它到底差多少。"
requires = []
reply = "秤杆晃了几晃，停下来，差了指甲盖那么一点。我说就这么一点，谁会在乎。“一点也是差。”他拿起錾子，在那枚币的边上划了一道，划得很深，把币还给我：“拿去给骗你的人看。”我真拿去给那个老水手看了。他盯着那道划痕骂了一句，又补了我一枚。"
next = "c2"
effects = [{ kind = "affinity", person = "yaqub", value = 3 }]

[[tracks.chapters.choices]]
key = "drop_more"
text = "把兜里所有的币都倒在桌上，让他一枚一枚听。"
requires = []
reply = "铜的、银的，叮叮当当倒了一桌子。他也不嫌烦，一枚一枚捏起来、松手、侧着耳朵听，听到太阳偏西，挑出三枚，排在一边。我说你这耳朵比海盗还灵，海盗隔着三里海，听得出哪条船吃水深。“海盗的耳朵听的是船，”他把那三枚推给我，“我听的是钱。”"
next = "c2"
effects = [{ kind = "affinity", person = "yaqub", value = 2 }]

# C2：1554 年夏。父亲在海上得来的一只“银”杯，杯底锉出一线铜。
[[tracks.chapters]]
key = "c2"
title = "镀银的杯子"
text = "我把一只银杯揣在怀里，一路小跑进了梅拉。杯子是我父亲当年在海上得来的，杯身錾着葡萄藤，我从阿尔及尔带到非斯，夜里枕着它睡。我把它往柜台上一墩：“雅库布，你给估估。我说它值一条船。”雅库布没接话，把杯子放上秤，加砝码，减砝码，看了半天。然后他拿起一把细锉刀，在杯底靠边的地方轻轻锉了一下。锉痕底下露出一线黄澄澄的颜色。是铜。我张着嘴，一句笑话也找不着。他没笑，把杯子放回我面前，说他十二岁那年也收过一只这样的杯子，赔了一个月的工钱。“那一个月，”他说，“我天天称自己的手，看它是不是也是镀的。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

