# B2：1555 年。铸币炉里扫出来的一捧炉渣。
[[tracks.chapters]]
key = "b2"
title = "哪一炉"
text = "雅库布查出来了。他托一个给铸币坊送炭的脚夫扫回来一捧炉渣，跟试金石上那排发乌的痕一比，颜色一样，掰开闻，铅的味道也一样。“铸币坊东头，第三座炉子。”他报出来，平得像报一个分量，“管那座炉子的，是市场督察的妻舅。”他把炉渣和试金石并排摆在柜台上，摆得整整齐齐，像摆一桌货。他父亲从里屋出来，看了一眼，拿块布把两样东西盖住：“一个犹太人去告王的铸币坊，你知道会怎样。”老人回了里屋，门帘落下来，半天没有动静。雅库布坐着没动，掀开布，把那块炉渣攥进手心里，攥得指节发白。我站在柜台外面，看见黑灰从他的指缝里一点一点漏下来。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

