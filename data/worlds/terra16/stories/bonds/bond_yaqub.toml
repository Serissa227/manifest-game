# B1：1554 年秋冬，萨阿德的新王进城以后。一块黑色的试金石。
[[tracks.chapters]]
key = "b1"
title = "试金石"
text = "九月，新王的马队进了非斯，城头换了旗。没过多久新王铸了新币，集市上跟着冒出一批掺了铅的。市场督察在集市口贴了告示，一口咬定是梅拉的金匠干的，有两家铺子当天就被封了门板。我去找雅库布，他的铺子还开着，门只开了半扇。他坐在柜台后面，面前摆着一块黑石头，巴掌大，磨得像漆。他拿新币挨个在石头上划过去，每划一道，石头上就留下一道银痕，有的亮，有的发乌。“我要找出是哪一炉掺的。”他说。他的手很稳，划出来的痕一样长、一样直；眼睛却是红的，眼底发青，几夜没睡了。他把手边的新币拢成一堆，数给我看：“十一枚。石头会说话，可十一枚，它说不清。”"
window = [[1554, 10, 1], [1554, 12, 31]]
at = "fez"
cast = ["yaqub"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 10, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

