# 重逢：1578 年夏秋，三王之战以后，非斯梅拉的金匠铺。一桌子赎俘用的银币。
[[tracks.chapters]]
key = "reunion"
title = "战后的秤"
text = "一五七八年夏天，马哈赞河边打了一仗，三个王死在同一天。葡萄牙的少年国王没有回来，他带来的贵族，一半躺在河滩上，一半成了俘虏，等着家里拿银子来赎。赎金从丹吉尔、从休达、从里斯本一路转过来，最后都要到非斯的梅拉，过一遍金匠的秤。我的船停在拉腊什，我骑了两天马进城。金匠铺的门开着，跟当年一样。柜台上的银币堆成了小山，一袋拆开，倒出来，一枚一枚上秤，称完的码成一摞，再拆下一袋。雅库布的鬓角白了，袖口还是挽到肘弯，眼睛熬得通红，听说已经称了半个月没停。他称一枚，念一声数，偶尔说一句：“这一袋是一个伯爵的，他娘卖了两座庄子。”我敲了门。他没抬头，手里的秤也没停：“在桌边先坐着。”"
