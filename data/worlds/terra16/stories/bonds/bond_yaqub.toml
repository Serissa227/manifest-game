next = "s"
effects = [{ kind = "affinity", person = "yaqub", value = 2 }, { kind = "bond", person = "yaqub", level = "A" }, { kind = "item", item = "balance_weights", qty = 1 }, { kind = "memory", memory = "mem-bond_yaqub-a2", title = "小天平与砝码" }, { kind = "heart", person = "yaqub", value = 6 }]

[[tracks.chapters.choices]]
key = "pay_in_silver"
text = "说要拿一枚真银币跟他换，免得欠他。"
