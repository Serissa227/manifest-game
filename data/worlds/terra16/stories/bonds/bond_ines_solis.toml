at = "merida_city"
cast = ["ines_solis"]
speaker = "captain"
mood = "cheerful"
news = "梅里达修院学校的前院里，监护主家的小姐捧着一本小册子，挨个问同学“家”怎么说，问一个记一个，记的字谁也认不全。"
