# B1：1554 年 9 月，索利斯家的大门外。门房只放她进；墙头的鸡蛋花。
[[tracks.chapters]]
key = "b1"
title = "门房只放一个人"
text = "九月，雨季的尾巴上，伊内斯说她家庭院里那棵鸡蛋花又开了一茬。“你的名字，就是那棵树。”她说，“我在册子上查到的——nikte'。你一定得去看。”索利斯家的大门朝着广场，门房是个上了年纪的西班牙人，拄着一根白蜡木棍。他让伊内斯进去，棍子一横，拦在我面前：“老爷的规矩，印第安人不走这道门。”伊内斯在门里站住了。我以为她要拉着我硬闯，她没有。她回头问门房：“是父亲说的？”门房说是。她就从门里退了出来，裙边扫过门槛，一句也没争。我们在墙外的台阶上坐下。墙不算高，墙头探出一枝鸡蛋花，白瓣黄心，雨水还挂在花瓣上。“我去求他。”伊内斯看着那枝花，声音很低，“求他改了这条规矩。”她说得很认真。可我在她家门口见过她父亲一回，那一回她低着头站在他身后，从头到尾，一个字也没说。"
