[[tracks.chapters]]
key = "a1"
title = "骑士的台词"
text = "春天，前院那棵月桂树底下最凉快。伊内斯把《高卢的阿玛迪斯》夹在《教理问答》里，念给我听。她念书跟说话不一样，一句一句拖着长腔，念到骑士要出征，还站起来拿手比了一下剑。“‘我的公主，纵然隔着七重大海，我的心也留在您的窗下。’”念到这里她停了一下，抬眼看我，再低头念下去，念出来的却不是书上的字了：“‘我的……玛丽亚，纵然隔着七重大海——’不对，你家本来就在海那边。‘纵然你回了你的岛，我的册子也留在……’”她一本正经，眉头皱着，像在认真批改一份卷子。我笑出了声，她也笑了，笑得书差点从《教理问答》里滑出来。可她没有停。她把那一页按平，清了清嗓子，从头又念了一遍，这一回，一个字也没笑。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "merida_city"
cast = ["ines_solis"]
speaker = "captain"
mood = "tender"
news = "梅里达修院前院的月桂树下，有个监护主家的小姐捧着《教理问答》念得抑扬顿挫，路过的修士直夸她用功。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

