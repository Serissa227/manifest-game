key = "new_words"
text = "坐下来，跟她把这些年攒下的新词换完。"
reply = "我们从下午换到修院敲晚钟。她教我十一个：抄经房里的行话，墨西哥城传来的新词，还有一个骂人的，念之前她先看了看门口。我教她九个：一种风的名字，两种只在科苏梅尔岸外才见得到的鱼，还有一个水手们收帆时喊的号子。“你欠我两个。”她在册子最后记下数目，“下回来还。”然后她翻回最前头“otoch”那一页。底下是她当年的拼法，两个点还在；再往下一行是“in wotoch”。她提笔在下面添了第三行：nochan。“那瓦特话，‘我的家’。”她吹了吹墨，“三种话，三个家。我还要往下写。”她把册子推过来，让我看那三行字排在一起的样子，等我看够了，才合上。"
