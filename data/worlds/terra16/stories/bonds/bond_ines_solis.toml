# 重逢：1564 年，坎佩切的方济各会修院。抄经房靠窗那张桌子；那个词她找到了。
[[tracks.chapters]]
key = "reunion"
title = "两种字的桌子"
text = "1564 年，我的船在坎佩切停了五天。第三天我去城边的方济各会修院，抄经房的修士说，伊内斯·德·索利斯在后头那间屋里教女孩子认字。她到底没有嫁给那位捻胡子的监护主。她在修院替人抄写，工钱从一页两个铜板涨到了四个，下午教城里的女孩子念书。靠窗那张桌上并排摆着两摞纸，左边是卡斯蒂利亚话，右边是玛雅话，玛雅话用的是修士的字母，有几个字母上还加着两个点——她自己的拼法，一直没改。我进门时，她正弯腰看一个新来的女孩抄名册。“先别写。”她按住女孩的笔，“先去问她，家里人怎么叫她。问清楚了，再动笔。”她直起身，看见了我。那本旧册子就在她手边，封面磨得发白。她翻到靠后的一页，拿指头夹着。“从前我老跟你说缺一个词。”她说，“有一个，我缺了好些年。现在找到了。”"
window = [[1564, 1, 1], [1564, 12, 31]]
at = "campeche"
cast = ["ines_solis"]
speaker = "captain"
mood = "tender"
news = "坎佩切方济各会修院的抄经房里，有位小姐的桌上摆着两种字的纸，她教新来的女孩先问清人家怎么称呼，再下笔。"
when = [{ kind = "date", from = [1564, 1, 1], to = [1564, 12, 31] }]

[[tracks.chapters.variants]]
key = "with_xochitl"
when = [{ kind = "flag", flag = "c7_pair_xochitl_ines_solis_together" }]
text = "1564 年，我的船在坎佩切停了五天。第三天我在城边方济各会修院的抄经房里找到了伊内斯·德·索利斯。她是从墨西哥城回来探亲的，借了修院靠窗的一张桌子，桌上并排摆着两摞纸，一摞卡斯蒂利亚话，一摞那瓦特话。她如今在墨西哥城一家羽毛画坊做事，画坊出的画，扉页上落两种文字的款，卡斯蒂利亚那一行是她写的。另一行是谁写的，她没说。霍奇特尔靠在门边，手里捏着一根绿羽毛，冲我抬了抬下巴，算是打过招呼——她们是一起回来的。修院里一个女孩捧着名册过来请教，伊内斯按住她的笔：“先去问她家里人怎么叫她，问清楚了再写。”她转过身看见我，从包袱里摸出那本旧册子，封面磨得发白。她翻到靠后的一页，拿指头夹着。“从前我老跟你说缺一个词。”她说，“有一个，我缺了好些年。现在找到了。”"

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "ines_solis", text = "伊希·妮克特：（这一半用卡斯蒂利亚话写。）坎佩切码头上的船家说起一位科苏梅尔的船长，报的名字是 Ix Nikte'，没有人叫她玛丽亚。我当时就猜着是你。今年我在坎佩切住了些日子，常坐在修院抄经房靠窗那张桌子边上，码头上每靠一条船，我都抬头看一眼，你的船一回也没往这边来。（下面这一半用玛雅话写，拼法还是我的，那两个点你别笑。）在井边那几年，我总念叨少一个词。那个词，我找到了。不写在这儿——写下来就成了纸上的东西，谁都能拆开看。我要当面说。当年在井边说好一换一，这回我先给，你欠着。附五个新词：一、pauta，抄经前用尺子打的格线。二、legajo，一捆用绳子扎起来的文书。三、alfajor，修院厨房做的蜜饼，我欠你一块。四、aguacero，坎佩切六月下午那种说来就来的急雨。五、amanuense，替人执笔的人——就是我。要找我，就到坎佩切方济各会修院的抄经房打听，修士们知道我在哪儿。——伊内斯（署我自己的名字）" }, { kind = "flag", flag = "c7_bond_ines_solis_missed" }]
news = "坎佩切修院抄经房的小姐寄出一封信，一半卡斯蒂利亚话、一半玛雅话，捎信的骡夫拿着翻来覆去，一个字也认不全。"

