# C2：1554 年夏，前院井边。一换一地换词，换到 k'iin 对不上；册子上的那个圈。
[[tracks.chapters]]
key = "c2"
title = "对不上的词"
text = "我们定了规矩：她教我一个卡斯蒂利亚词，我教她一个玛雅词，一换一，谁也不许赖账。她教我“ventana”，我教她“ha'”；她教我“mañana”，我教她“sáamal”。换到“k'iin”，事情不对了。我指指天上：“k'iin。”又指指她册子上记的日子：“这也是 k'iin。”再拍拍井栏，告诉她嬷嬷快来接人了，到时候了——“还是 k'iin。”伊内斯的笔悬在半空。“太阳是 sol，日子是 día，时候是 tiempo，三个词。你们怎么能只用一个？”“我们就用一个。”她把三个卡斯蒂利亚词写成一行，划掉，又写。最后她在纸上画了一个圈，把“k'iin”写在圈当中，圈里别的什么也没写。“嬷嬷说记词要整整齐齐，一个对一个。”她盯着那个圈，“这个不行。往后也许得拿一整段话来讲它。为了整齐把它删了，太可惜。”"
