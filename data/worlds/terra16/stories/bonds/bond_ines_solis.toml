text = "问她：那个词是什么？"
requires = [{ kind = "flag", flag = "c7_bond_ines_solis_romance" }, { kind = "heart", person = "ines_solis", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "ines_solis", ge = 18 }, { kind = "romance_open", romance_open = "ines_solis" }]
hint = "当年没有约下那句话，今天她不会把那个词说出口。"
reply = "她先没答话。她起身把门掩上，回来坐下，把旧册子合上推到一边。“我找了八年。”她说，“卡斯蒂利亚话里没有，书里也没有。骑士小说里有一百句，都是对公主说的，不算数。”她看着我，“后来我发现，它在你们的话里。没有人教，是我自己找到的。”她说了。是玛雅话，不长，她念得很慢，中间那一下停住的气停得一点不差，比我当年教她的哪一个词都念得好。我没有出声。她伸过手来握住我的手，跟那年在井边一样紧，这一回没有抖。“这个词，我不写进册子。”她说，“只说给一个人听。”修院敲了晚钟。她倾过身来，在我额头上轻轻碰了一下，像在给一个新学的词点上那两个点。"
