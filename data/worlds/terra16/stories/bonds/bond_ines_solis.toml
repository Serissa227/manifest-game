# S：1556 年 12 月，前院井边。学校散了；这几年的词纸分成两份，各留原稿。
[[tracks.chapters]]
key = "s"
title = "不是谁的附注"
text = "嬷嬷来接人之前，伊内斯把我拉到井边，摊开一摞纸。明天一早我就动身去坎佩切，科苏梅尔派来的独木舟在那儿等我；名册上那个“玛丽亚”，要留在梅里达了。那摞纸是这三年我们互相教的词：她教我的写在左边，我教她的写在右边，有的画着圈，有的夹着压干的花瓣。“分成两份。”她说，“你一份，我一份，都是原稿。谁也不许只拿个抄本走。”我们一张一张地分。分到“otoch”那一张，她拿起来看了一会儿，放到我那一摞上，又拿回来，放到她那一摞上。“我想好了。”她把纸边一张张对齐，“我要找一份活，做出来的东西，底下署我自己的名字。不署索利斯家的女儿，也不署谁家的太太。”她说这话的时候没有看我，看的是手里那张“otoch”。"
