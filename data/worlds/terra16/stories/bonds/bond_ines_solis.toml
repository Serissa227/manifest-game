# A2：1556 年秋，前院井边。她缝的鹿皮书衣，皮面上压着“Ix Nikte'”（赠礼 leather_bookwrap）。
[[tracks.chapters]]
key = "a2"
title = "皮书衣"
text = "秋天，我替家里记账的本子散了线，纸页一张一张往外掉。过了几天，伊内斯在井边把一个布包塞给我，塞完就把手背到了身后。布包里是一个书衣，鹿皮的，边上用麻线缝得密密的，针脚有大有小，一看就是一针一针自己缝的。皮面上压着一行字。不是“María”。是“Ix Nikte'”。末尾那一撇压得很深，还压歪了一点。“我问了三个人才问清楚怎么写。”伊内斯说，眼睛看着井里，“嬷嬷说印第安名字没有正经写法。抄经房的老书记写得出来，可他说不清最后那一撇是什么。后来我去问了修院里那位玛雅人助教，他教了我半个下午。”她顿了一下。“他说，那一撇，是你名字里停住的那一下气。”"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "merida_city"
cast = ["ines_solis"]
speaker = "captain"
mood = "tender"
