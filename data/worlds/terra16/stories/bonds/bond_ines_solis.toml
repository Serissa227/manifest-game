# C1：1554 年初，梅里达修院学校前院的井边。她问“家”怎么说；那句失言；她的小册子。
[[tracks.chapters]]
key = "c1"
title = "家怎么说"
text = "修院学校的前院有一口井，女孩子们念完教理，就在井栏边等家里来接。伊内斯·德·索利斯每天都比别人等得久，因为她要拿着那本小册子挨个问人。今天轮到我。“玛丽亚，你们的话里，‘家’怎么说？”“otoch。”她第一遍念成了“奥托奇”，第二遍咬到了舌头，第三遍才把尾音收住，收得又轻又短，跟岛上的人说的一样。她高兴得在井栏上拍了一下，提笔就记，用的是她自己编的拼法，一个字母上头加两个点。“等一下——这个词我还没有，‘我的家’呢？前面加个‘我的’就行吧？”不等我答，她又说，“那我们家的印第安人回家，也说这个词？”说完她自己先愣住了。笔尖停在纸上，洇出一个墨点。红晕从她的耳根一直漫到领口。“我是说……给我们家干活的……不对，是给我们家交玉米的那些……”她越说声音越小，小册子攥在手里，纸边被指头捏皱了。"
