title = "黑色的羊驼"
text = "夜里我们躺在一只拖上岸的木筏上，背底下的巴尔萨木还留着白天的热。迈塔指着银河：“别看亮的，看黑的。”他说那些黑的地方也是星座：一只羊驼，伸着长脖子；一条蛇，从南边游过来；羊驼脚边还蹲着一只小狐狸。“我祖父把星星也打进过绳里。哪颗星什么时候出来，海上该往哪边走。”他停了一会儿，“那根绳，我父亲小时候让神父烧了。”浪一下一下拍着筏尾。“我就记得一个结，”他说，“是羊驼眼睛的位置。”他的手指举在半空，对着那一片黑比了很久，一直没放下来。"
