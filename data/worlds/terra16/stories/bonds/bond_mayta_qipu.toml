# B1：1554 年秋冬，钦查海边。比谁先记清一船鱼；绳快，纸慢，船主两样都看不懂。
[[tracks.chapters]]
key = "b1"
title = "比快的绳"
text = "家学的先生想出一个比法：渔船一靠岸，谁先把一船鱼的数记清楚，谁赢。迈塔用绳，我用纸。船上的鱼一筐一筐往下递，鲣鱼、鲻鱼，还有几条认不出的。迈塔的手指在绳上翻得看不清，一筐一个结，大鱼另打一个，比我早了半刻喊“好了”。先生让我们念给船主听。迈塔一个结一个结地摸着念，船主听得直皱眉；我念纸上的数，船主不认得西班牙字，眉头皱得更紧。最后船主把我们俩都推开，自己蹲下去又数了一遍，数出来跟迈塔的绳一条不差，跟我的纸差了两条。先生判迈塔赢，奖品是船上最大的那条鲣鱼。他拎着鱼尾巴走到我面前晃了晃，下巴朝着天：“纸上的鱼，煮得熟吗？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "chincha"
cast = ["mayta_qipu"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

