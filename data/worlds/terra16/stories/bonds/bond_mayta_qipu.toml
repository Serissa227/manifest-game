text = "太阳节过后的一个下午，迈塔拿来两股丝线，一股红，一股蓝，是从利马的布商那里换来的。“编一根绳，”他说，“一种颜色我挑，一种你挑。”他挑了红的。我挑了蓝的，说海是蓝的，他说这理由不算理由。我们坐在海边的木筏上编，红压蓝，蓝压红。他编得快，我编得慢，编到一半，他手上慢下来等我，嘴里还挑我那股蓝的拉得太松。太阳快落进海里的时候，绳子编到了头，只剩收尾的那个结。这个结一打，绳就定了，再也改不了。迈塔捏着两股绳头，没往下打。“谁来打？”他问。他的眼睛看着绳，等我回答。"
