# C2：1554 年夏，钦查海滩。兵征走了筏、玉米和那口锅；迈塔一样一样打进绳里。
[[tracks.chapters]]
key = "c2"
title = "被征走的筏"
text = "利马那边打起了仗，听说是一个叫希龙的人在南边造了反，利马派出来的兵到处征船征粮。这天一队兵到了钦查的海滩，领头的念了一张纸，就把钦查筏户拖上岸的三只木筏推下了水，又从棚子里搬走二十袋玉米，连煮奇恰的那口大锅也抬了出来。“仗打完了再说。”领头的只撂下这一句。没人敢拦。迈塔一言不发地跟在兵后面，走一步打一个结：三只筏，一只一个大结；玉米，二十个小结串成一串。两个兵抬着锅往路上走，他打到锅，打了一个我没见过的结，打得很用力。他转过身，把那根绳塞到我手里，绳头还是湿的。“你会写西班牙字。在旁边写一份，”他说，“将来他们赖不掉。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "chincha"
cast = ["mayta_qipu"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

