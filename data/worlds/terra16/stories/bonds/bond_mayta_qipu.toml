# B2：1555 年，钦查海边的礁石。撞见他对着礁石讲账；“你演那个书记官。”
[[tracks.chapters]]
key = "b2"
title = "讲给不懂的人听"
text = "我去海边捡筏上掉下来的木楔，绕过一块礁石，听见有人在说话。是迈塔，一个人对着礁石，手里捏着一根短绳，一句一句地讲：“这一股是钦查，这一股是派塔。挂在下面的这个结是十，十包海菊蛤……”讲到一半，他停下来，像在等礁石回话，等不到，又从头讲起。他回过头看见了我，脸一下子红到脖子根。“练习。”他说得很快，“明年利马的书记官要来核钦查的账。库西老人老了，他说的话书记官听不懂，书记官说的话他也不想懂。”他把那根练习绳往我手里一塞，绳上的结还是潮的。“你演那个书记官，”他说，“往死里问。”"
