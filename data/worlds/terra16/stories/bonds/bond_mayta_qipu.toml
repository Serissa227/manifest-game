# S：1556 年 12 月，钦查海滩。“我”随筏队北上前一天；两截新绳，把约定打进去。
[[tracks.chapters]]
key = "s"
title = "不改的结"
text = "年底我要随家里的筏队北上，去派塔，再往北，不知道哪一年回来。迈塔留在钦查。出发前一天，他在海滩上找到我，手里拿着两截新绳，一个结也还没打。“新总督到利马了，听说规矩要变。”他把绳子在膝盖上抻直，“结绳官一年比一年少，库西老人的眼睛也不行了。我要学着把结跟西班牙字对上账，一个结配一个字，让绳子在新规矩底下也有人认。”他把一截递给我，自己留一截。“我们的约，打进去。一人一截。”他看着我，“打进绳里的，就不能悄悄改。”海风把两截绳头吹到了一块儿，他没去分开。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "chincha"
cast = ["mayta_qipu"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

