# 重逢：1563 年，卡亚俄海滩。迈塔有了三只筏，筏头的记号一半是结、一半是字母；伊卡在跟他吵哪只先下水。
[[tracks.chapters]]
key = "reunion"
title = "筏上的新记号"
text = "1563 年，我又回到卡亚俄。海滩上排着一溜巴尔萨木筏，最外头三只是新的，筏头刻着记号：一半是结的样子，一圈压一圈；一半是西班牙字母，M 和 Q，刻得端端正正。迈塔就站在那三只筏中间，正跟一个年轻筏夫吵哪只该先下水。那筏夫嗓门大得半个海滩都听得见：“东边那只吃水浅，先下它！”“西边那只货重，”迈塔说，“先数——”他看见了我，话没说完，把筏夫晾在一边，朝我走过来。筏夫在后头嚷：“迈塔！话说一半算什么！”“伊卡，等着。”迈塔站到我面前，从怀里掏出一截绳，旧了，结还是紧的。“那年你北上，两截绳都带走了，”他说，“我又打了一截。你哪年没回来，我就打一个结。”"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "callao"
cast = ["mayta_qipu"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "mayta_qipu", ge = 18 }]

