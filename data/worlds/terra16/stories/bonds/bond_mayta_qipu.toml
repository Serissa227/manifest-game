reply = "“一年一回。”我说。迈塔点点头，在他那一截上打了一个结，结身短，尾巴上拖一个小圈，那是“一年一回”。轮到我，我想打一个“不许失约”，可我只学过数数的结，打出来的东西歪着身子，谁也认不出是什么。迈塔拿过去看了半天：“你这个结打错了。这是‘十’。”“那就照错的算，”我说，“十年里，一年也不许少。”他张嘴想驳，又闭上了，把我那一截翻过来，在“十”的旁边补了一个小小的结，说那是给我留的改口的地方，又补了一句：“不许用。”他把两截绳并在一起比了比，长短一样，结的位置也对得上。第二天我上筏的时候，他站在齐膝深的潮水里，把他那一截举起来晃了晃。我也举起我的。筏离岸很远了，他还举着。"
next = "done"
