reply = "我跪在沙上写：三只木筏，二十袋玉米。写到那口锅，迈塔按住我的笔：“写‘村子里唯一的大锅’。”我照他的话写了。他把纸拿过去看了半天，又看看自己的绳，说：“你的字也能当结用。”他把纸折成四折，用绳尾拴住，和那串结捆在一起。"
