# 迈塔·基普：先数结（bond_mayta_qipu / reunion_mayta_qipu）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用轨道 key、章节 key、地点与年份。
# 标签：BL（羁绊线，可恋爱）。迈塔 romance.with = any；主角性别由玩家定：男主角时为 BL，女主角时为 BG。适用主角：custom_chincha_rafts（钦查筏商家学的学生，“我”不写性别、外貌、家族专名）。
# 人物：迈塔·基普 mayta_qipu（1540-03-25，男）；主角模板生年 1540-01-01。
#       学院期 1554—1556：主角 14—16 岁、迈塔 13—16 岁；A1（1556-01..05）心动选项双方未成年，只写头挨着头；
#       A2（1556-06..11）双方 16 岁；S（1556-12）双方 16 岁，心动选项只到牵手与 crush，告白约在成年再见时再答。
#       重逢 1563：双方 23 岁，恋人落点合法；生年相差不足三个月。
#       伊卡 ika（1540-02-21）只在重逢里作为跟迈塔吵架的年轻筏夫出场，不进 cast，不写两人的感情（他们的线在 tie_new_mayta_qipu_ika）。
# 依据：
#   史实——1553 年底弗朗西斯科·埃尔南德斯·希龙在库斯科起兵，1554 年利马的检审庭（当时总督出缺）四处征船征粮，年底希龙在利马被处死（C2 只写“听说”）；
#         1556 年新总督卡涅特侯爵到任（S 只写“听说”）；钦查人以巴尔萨木筏做沿海生意，安第斯人用结绳（奇普）记数；
#         安第斯人在银河的暗处看到羊驼、蛇、狐狸等“黑色星座”；图帕克·尤潘基乘筏西航、约一年后回来的传说（萨米恩托 1572 年记下）；
#         神父烧毁结绳的事在 16 世纪屡见，祖父的那根绳是本线虚构。
#   原创——海滩上的四十二包棉花与两包稻草、被征走的锅、比记鱼数、对着礁石练习、红蓝两股丝线编的绳（braided_cord）、
#         两截记约定的绳、筏头半结半字母的记号、那个“记着一个日子”的结。
#   待核——1554 年征船是否到过钦查海滩（正文用“听说”与兵的一句话带过）；太阳节在 1556 年的钦查是否还公开过（正文只用作时间）。
# 缺省走向：C1—A2 的 default 没有收获，故事照走：两包稻草被扔进海里；那根记被征物件的绳挂了起来，兵再也没回来；
#           迈塔自己烤了那条鲣鱼，嫌不够咸；他又对着礁石练了一个月；他一个人看了一夜羊驼的眼睛；红蓝绳由他自己收尾，挂在家学门口。
#           S 的 default：“我”北上那天，迈塔把两截空绳挂上“我”那只筏的桅杆；开启重逢，设 c7_bond_mayta_qipu_parted，不改关系。
#           重逢的 default：迈塔托北上的筏队捎来一根结绳与几行伊卡代写的西班牙字（letter），设 c7_bond_mayta_qipu_missed。
# 羁绊阶梯：C2 write_beside 给 C；B1 learn_fast_knot 补签 C；B2 play_the_clerk 给 B；A1 witness_for_him 补签 B；
#           A2 you_tie / tie_together 给 A + braided_cord + 回忆“两股丝线”。心动：A1 +6，A2 tie_together +6（要 ≥ 6），S heart +12（要 ≥ 12），
#           全选心动正好 24，够重逢的 love 落点（决定表原写 S +10，只能到 22，按简报改为 +12）。
# 旗标：写 c7_bond_mayta_qipu_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       S 的 promise 与 heart 另设共享旗标 c7_tie_new_mayta_qipu_ika_taken（tie_new_mayta_qipu_ika 读，改走“并肩的朋友”）。
#       重逢的 variants 读本文件的 _promise / _romance / _own；不读外部旗标。
# 日程：迈塔的学院日程在钦查（chincha_raft_house），各章 at 沿用旧稿的卡亚俄（钦查筏户的出海口），由整合方确认在场判定；重逢 1563 在卡亚俄，同样是出行。
# 口头禅：“先数结，再装货。”只在 C1 用一次；别处只作呼应，不重复原句。
# 秘密：迈塔偷偷练习把结绳账讲给不懂的人听——B2 是“我”撞见、陪他练；不进任何见闻（本文件的羁绊章没有 stage，不写 news）。
# 地点（2026-11-01 close-places）：养成期主角在钦查（家庭阶段 chincha），学院章 at 由 callao 改 chincha（海滩、换货集是筏商家学自己的场所）；
#   C1、C2 正文“卡亚俄的海滩”改“钦查的海滩”，上面“日程”一条作废。重逢 1563 仍在卡亚俄。

