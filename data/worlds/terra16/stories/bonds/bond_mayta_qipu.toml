text = "替商人的单子说话，跟迈塔赌他数错了。"
reply = "我赌了一罐奇恰酒。稻草从棉包里抽出来的时候，先红脸的是商人，跟着红的是我。那罐酒当天傍晚就送到了迈塔家。他喝的时候下巴抬得老高，喝完把空罐子推回给我：“下回别跟绳子赌。”"
next = "c2"
