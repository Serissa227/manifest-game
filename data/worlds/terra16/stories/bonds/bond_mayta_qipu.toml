# C1：1554 年初，钦查海滩。四十二包棉花，绳上只有四十个结。
[[tracks.chapters]]
key = "c1"
title = "先数结"
text = "家里的巴尔萨木筏刚在钦查的海滩上拖稳，一个西班牙商人摇着单子过来，要把四十二包棉花装上筏，运去北边的派塔。单子上的字又直又密，他拿指头敲着最后一行：“四十二，公证人画过押的。”跳板前头站着迈塔·基普，家学里跟库西老人学结绳的那个，平时一天说不了十句话。他拎起一根打满结的绳，挡住了跳板：“先数结，再装货。”那根绳是前一天在棉仓里打的，上面只有四十包。商人笑了，骂他是不识字的乡下小子，问一根草绳能不能比公证人的墨水还准。迈塔不吭声，把绳往肩上一搭，蹲下去一包一包地摸，摸一包，拇指在绳上掐一下。摸到第四十包，他停了停，又去摸后面那两包，把手插进最后一包的棉花里，抽出来一把稻草。他抬头看着商人，下巴一点一点地抬了起来。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "chincha"
cast = ["mayta_qipu"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_chincha_raft_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "count_with_him"
text = "蹲下来，从另一头跟他一包一包数过去。"
reply = "我从另一头数起，数得比他快，先喊出了“四十二”，又在第四十一包里掏出一把稻草。迈塔斜了我一眼：“数得快不算本事，数得准才算。”商人最后赔了两包棉花的钱。迈塔把钱在手心里掂了掂，分了一半塞给我，什么也没说。"
