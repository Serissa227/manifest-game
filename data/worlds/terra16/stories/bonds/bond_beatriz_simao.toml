# C1：1554 年初。巴西船上下来的老水手，儿子替他说症状；她按住我的笔，自己去开窗。物件：高窗的插销。
[[tracks.chapters]]
key = "c1"
title = "先问名字"
text = "诸圣医院的水手病房在十字形大楼的东翼，床挨着床，窗开得比人还高。巴西船上下来的老水手烧得嘴唇起皮，他儿子蹲在床边替他说：“夜里冷，白天烫，吃不下，咳出来是黄的。”我一句一句往纸上抄，抄得飞快。一只手按住了我的笔。贝阿特丽丝没看我，看的是床上的人：“先问他叫什么。”说完她搬了张凳子到高窗底下，踩上去掰插销：“先把窗打开。这屋里的气，好人进来都要闷出病。”插销吱的一声松了。风从罗西奥广场那边灌进来，带着烤栗子的烟味。老水手眯着眼吸了两口，推开儿子的手：“我叫若昂。”又讲船过赤道那天，厨子把最后一只鸡放跑了，全船追了半天，鸡飞上了桅顶，船长不许人开枪，说它比咱们都有本事。他咳着笑，笑得儿子直拍他的背。贝阿特丽丝从凳子上下来，仰头看另一扇高窗——那扇的插销锈成了一坨。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "lisbon"
cast = ["beatriz_simao"]
speaker = "captain"
mood = "cheerful"
news = "罗西奥广场边的诸圣医院，水手病房的高窗关了一冬，叫医生家隔壁的姑娘踩着凳子掰开了，病号们都说喘气松快多了。"
when = [{ kind = "flag", flag = "family_access_lisbon_medical_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

