# B1：1554 年秋。印度船队回港，见习们比谁记得快、记得全；我先交，她最后交，她赢。物件：那一行“问：安东尼奥还活着吗”。
[[tracks.chapters]]
key = "b1"
title = "九月的船"
text = "九月，印度船队进了特茹河，水手病房一天之内就塞满了。害坏血病的人牙龈肿得发黑，一张嘴就是血，腿上一按一个坑。医生忙不过来，叫我们几个见习各记一本，看谁记得快、记得全。我第一个交：二十一张床，名字、哪儿疼、上船几个月，一样不落。医生翻了翻，点头。贝阿特丽丝最后一个交，交的时候天都黑了。“第七床那个，我多写了一行。”医生把两本并排摊开，念她那一行：“问：安东尼奥还活着吗。”第七床的人也跟我提过安东尼奥，我当他烧糊涂了在说胡话。“他问了三遍。”贝阿特丽丝说，“同一条船上的，他在甲板上看着安东尼奥被抬走，后来再没见着。”医生把她那本压在上面：“这本算数。”我的那本还摊在桌上，字比她的整齐。"
