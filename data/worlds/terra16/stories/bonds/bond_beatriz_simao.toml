#         她七岁那夜的事；熬坏三锅的迷迭香皂；门后写名字的木板；画着图的药单；每张床边一扇窗的新病房图。
#   待核——1554—1562 年诸圣医院是否单设“水手病房”（本世界线照这么写）；病历是否须本人同意才给外人看，是本世界线里她自己立的规矩。
