# A1：1556 年大斋期。她忙得忘了喝水；第一次讲自己：七岁那夜。物件：桌边那杯水。
[[tracks.chapters]]
key = "a1"
title = "怕血的缘故"
text = "大斋期，病房里空出几张床。贝阿特丽丝从早上忙到下午，记了十一个人，换了四回布，一口水没喝，嘴唇干得起了白皮。我倒了一杯水，搁在桌角她一抬眼就看得见的地方，没叫她。她又写了半页，才看见那杯水。端起来喝了一半，坐下了，手在围裙上蹭了两下。“你早看出来了吧。”她说，“换布那回。”我没吭声。“我七岁那年，我娘生我弟弟。”她转着杯子，“接生婆不让我进去，我就在门外坐了一夜。屋里一盆一盆往外端水，都是红的。天亮的时候，弟弟没了，我娘活下来了。”她把杯子放下，“打那以后，我一见血就发晕。所以我偏要学换布。晕就晕，手不能停。”她摊开左手给我看，手心里一排月牙印子，新的压着旧的。"
window = [[1556, 2, 15], [1556, 4, 30]]
at = "lisbon"
cast = ["beatriz_simao"]
speaker = "captain"
mood = "tender"
news = "大斋期诸圣医院的病号少了，记簿子的姑娘照样一天换四回布。药房的人说，她一整天连口水都顾不上喝。"
when = [{ kind = "date", from = [1556, 2, 15], to = [1556, 4, 30] }, { kind = "age", le = 17 }]

