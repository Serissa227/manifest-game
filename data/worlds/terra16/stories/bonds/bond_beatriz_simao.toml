at = "lisbon"
cast = ["beatriz_simao"]
speaker = "captain"
mood = "tense"
news = "九月印度船回港，诸圣医院的水手病房一天塞满。听说医生叫见习们比赛记病号，交得最晚的那个姑娘反倒得了夸。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

