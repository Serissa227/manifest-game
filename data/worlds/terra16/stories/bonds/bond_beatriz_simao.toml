text = "十二月，开春的船定下了，我要出海。最后一天去病房，贝阿特丽丝正把一卷卷布摊在长桌上，一块一块对折，用麻绳扎成小捆。桌角压着一张纸，写得密密麻麻：发烧怎样，牙龈出血怎样，腿肿怎样，每一条后头画着个小图，一片叶子、一只碗、一扇窗。“船上的人大半不识字。”她头也不抬，“看图总看得懂。”她要留在诸圣医院。医生答应了，开春起水手病房的簿子归她记。往后每条出海的船，她都想塞一捆干净布、一张这样的单子上去。“你那条船，我头一个塞。”她扎好最后一捆，抬头看了看那扇高窗。插销上的锈早叫人磨亮了。“哪天开船，你给我说准了。”她说，“布我得算着日子扎。”"
