# B2：1555 年。贵人家的管家要翻水手的记录好扣工钱；她挡住，转身把记录塞给我。物件：那本记录。
[[tracks.chapters]]
key = "b2"
title = "管家要的那一页"
text = "有个穿黑呢的管家来病房，袖口熨得笔直，说是替一位贵人家里办事。他要看第十二床那个水手的记录：水手说腿是在船上摔断的，贵人家里说他上船前就瘸，工钱该扣一半。“记录不给外人看。”贝阿特丽丝说。管家笑了笑：“小姑娘，这医院是国王的。”“病是他的。”管家不笑了，说他明天去找院长，看院长是不是也这么讲。走之前他在门口站了站，把病房里的人一个一个看过去，最后多看了第十二床一眼。门一关上，贝阿特丽丝转身就把那本记录塞进我怀里，封面上还留着她刚才攥出来的汗印。“替我藏一个晚上。”她压低了声音，“我家里，他会去翻。”"
