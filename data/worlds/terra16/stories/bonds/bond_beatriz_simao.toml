# C2：1554 年夏。腿伤化脓要换布；她脸白了，手却稳，另一只手死攥着床栏。物件：一盆染红的水。
[[tracks.chapters]]
key = "c2"
title = "换布的手"
text = "米纳回来的船上有个水手，腿上的口子化了脓，裹布跟肉粘成一片。医生说今天非换不可。贝阿特丽丝端着一盆温水走过去，走到床边，脸一下子白了，白得跟她的围裙一个颜色。可她揭布的手一点也不抖，一层一层往下揭。揭到最后一层，水手嗷地叫起来：“轻点！你这是剥鱼皮！”我这才看见她的另一只手：攥着床栏，指节都发青了。“布。”她说。我递过去。“再一块。”盆里的水没一会儿就红透了。换完，她把盆往我手里一放，自己走到窗边，背对着屋子站了很久，久到走廊里的修士念完了一段经。回来的时候，脸上还是没有血色，声音倒跟平常一样：“下一个。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "lisbon"
cast = ["beatriz_simao"]
speaker = "captain"
mood = "tense"
news = "诸圣医院的水手病房这个夏天换布换到天黑。都说医生家隔壁那姑娘换得又快又干净，挨了她骂的水手还得跟她道谢。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

