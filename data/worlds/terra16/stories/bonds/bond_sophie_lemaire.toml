# C1：1554 年春，城里的女塾。一支笔杆缠着旧线的鹅毛笔；口头禅在这里用唯一一次。
[[tracks.chapters]]
key = "c1"
title = "最后一排"
text = "城里这间女塾，每天早课前要先唱一首圣歌。女先生打拍子，十几个女孩站成三排，我站第一排，唱得最响。最后一排靠门的位子上，那个从里尔来的女孩站得笔直，嘴唇抿成一条线，从头唱到尾，一个音也没出。女先生没看见，我看见了。下课要做账目练习，我的笔尖劈了。我走到最后一排，敲了敲她的桌子：“借支笔。我这辈子还没跟人借过笔，你是头一个。”她抬起眼睛看了我一会儿。“你上回可不是这么说的。”“哪个上回？”“上个月十四号，交易所门口的文具摊。你跟摊主借了一支鹅毛笔，签完一张票据就揣走了。”她把我的口气学得一模一样，“‘下回还你，记我账上。’”我张着嘴站在那里。那件事我自己都忘了。她低下头，从笔盒里抽出一支鹅毛笔，笔杆上缠着一圈旧线。她把笔搁在桌角，没递给我，也没收回去。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_antwerp_laurel" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那支笔我最后跟前排的人借了，最后一排的女孩一整天没抬头。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "pay_the_debt"
text = "认这笔账，当场把那支笔的钱算给她，托她转交摊主。"
reply = "我掏出钱袋，一枚一枚数铜板：一支鹅毛笔两个斯泰弗，欠了一个月，再加半个算利息。她看着我数，一直没出声。数到最后一枚，她说：“你倒是算得清楚。”她把铜板包进手帕，打了个结，那支缠线的笔推到我面前。线缠得很紧，是怕笔杆裂开。那天的账目练习，我写得比哪天都工整。"
next = "c2"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 3 }, { kind = "skill", skill = "double_entry", value = 8 }]

[[tracks.chapters.choices]]
key = "bet_she_misremembered"
text = "跟她打赌，赌她记错了人。"
reply = "“赌一个铜板，”我说，“你记错人了。”她想都没想：“赌。”放了学，我们一前一后走到交易所门口。摊主正在削笔，一看见我就乐了：“兑换商家的小姐，你还欠我一支笔呢。”我把一个铜板放进索菲手心。她攥住，转身就走，走出两步，嘴角动了一下，又压了回去。"
next = "c2"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 2 }]

# C2：1554 年夏，下雨天的教室。书衣开了线，一页法文诗落在我脚边。
[[tracks.chapters]]
key = "c2"
title = "书衣里的一页"
text = "那天下了一整天雨，教室里白天也点着灯。索菲收拾书的时候，一本课本从桌沿滑下去，啪地落在地上。书衣是她自己缝的粗麻布，接缝开了一道口子，一页纸从里头滑出来，正好落在我脚边。我低头看了一眼。是法文，分行排着，每一节前面标着数字，像歌。可教堂里从来不唱法文的歌。上个月市政厅门口又贴了一遍皇帝的诏令，父亲带我路过，让我别停下来念。索菲弯腰去捡，手抖得比纸还厉害，捡了两下才捏住。她没有抬头看我，把纸按在膝盖上，从袖口里摸出针线。窗边坐着肉铺家的女儿，正往这边伸脖子：“掉了什么？”“账页，”索菲说，声音平得像念课文，“我的。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 缺省：那一页纸她捡回去了，窗边的人什么也没看清。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "block_the_window"
text = "把账本立起来，挡住窗边那道目光，等她缝好。"
requires = [{ kind = "affinity", person = "sophie_lemaire", ge = 20 }]
hint = "她还不信任何人。我这时候凑过去，她只会把书抱得更紧。"
reply = "我把账本竖在桌上，拿墨水瓶压住一角，正好挡住窗边那颗脑袋。“第七道利息题我算不出来，”我大声说，“谁借我看看？”身后，针穿过麻布的声音细细的，一下，又一下。她缝好了，一句谢也没说。第二天，我的座位上多了一叠笔记，是那天我一个字没听的修辞课，抄得清清楚楚，连先生咳了两声都记在页边。"
next = "b1"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 2 }, { kind = "bond", person = "sophie_lemaire", level = "C" }]

[[tracks.chapters.choices]]
key = "turn_away"
text = "装作在看账本，把脸转开。"
reply = "我把脸转向黑板，一根一根数先生写上去的数字。身后，纸塞回去的声音，针穿过麻布的声音，线拉紧的声音，我都听见了。下课时她从我身边走过去，脚步停了一下。我等着她说点什么。她没说，把那本书往怀里又收了收，走了。"
next = "b1"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 3 }]

# B1：1554 年秋冬，伊内丝家的后屋。少女诗社（创办归 bond_ines_costa），索菲第一次念自己的诗。
[[tracks.chapters]]
key = "b1"
title = "第一次念诗"
text = "修辞会不收女孩，伊内丝就在自己的本子上办了一个少女诗社，每月一回，在她家后屋点两根蜡烛，谁有新诗谁念。我是被她拖去的，进门就说清楚了：“我只记账，不写诗。”索菲来了三回，坐在门边，一回也没念过，只听。散会时谁念错了哪个词，她一个一个报出来，报得人脸红。这一回轮到她。她站起来，手里的纸折成四折，没打开，是背的。诗写的是里尔的一扇门：门环是一只铜手，门框上有母亲给她量个子刻的一道线，最后一句是：“那道线以上，现在住着别人。”念完了。屋里没有一点声音，蜡烛油滴在烛台上。索菲站着，一只手攥着裙角，攥出了褶，脸白得跟那张纸一样。我在心里数：一，二——"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那天没人鼓掌，伊内丝替她把那首诗抄进了诗社的本子。
[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "start_the_applause"
text = "数到三还没人出声，我先鼓掌。"
requires = [{ kind = "affinity", person = "sophie_lemaire", ge = 20 }]
hint = "她还当我是那个等着看她笑话的兑换商家的女儿，我的掌声她不会信。"
reply = "“三。”我拍了第一下，拍得太响，把自己都吓了一跳。伊内丝跟着拍，接着满屋子都响起来。索菲坐下的时候差点坐空。散会以后，她裹着披肩在门口等我：“你数了三下。我看见你嘴唇在动。”我说两下太急，四下太晚，三下刚好。她笑了。我第一次看她笑，笑完她马上把脸转过去看街。"
next = "b2"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 2 }, { kind = "bond", person = "sophie_lemaire", level = "C" }]

[[tracks.chapters.choices]]
key = "ask_the_door"
text = "散会后问她，诗里那扇门在里尔哪一条街上。"
reply = "她说了一条街名，法文的，我跟着念了两遍才念对。“铜手门环，街口第三家，”她说，“我们家的门。现在住的是别人。”她把那张折成四折的诗稿塞进书衣里，压平，又按了按。“你记那个街名做什么？”我说兑换商的女儿什么都记，万一哪天用得上。她看了我一眼，没说信，也没说不信。"
next = "b2"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 3 }, { kind = "skill", skill = "poetry", value = 8 }]

# B2：1555 年，查禁书的风声。一把新住处的门钥匙。
[[tracks.chapters]]
key = "b2"
title = "搬家的夜"
text = "那几天，官府又在查私藏禁书的人家，一条街一条街地问。索菲家租住的那条巷子被点了名，房东一早就把她们的箱子搬到了门外：“我不替谁担干系。”我赶到巷口时天已经黑了。她母亲蹲在地上捆行李，绳子勒得手指发白。索菲抱着一只书箱站在街口，箱角磕掉了一块漆。她没开口求我，只是看着我，看了很久，久到我数清了她母亲捆了几道绳：七道。我知道父亲认得一个葡萄牙商人，他在斯海尔德河码头边有间仓房，楼上空着，冬天堆过羊毛。我也知道父亲最怕跟“禁书”两个字沾边，这种人情，他一年只肯欠一回。“我们去城外，”索菲的母亲说，没看我，“那边有间屋子，能挡雨。”索菲还看着我。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那一夜索菲一家住进了城外一间破屋，书箱在路上丢了一只。
[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "find_lodging"
text = "用父亲的门路，连夜把那间仓房楼上的钥匙要来。"
requires = [{ kind = "affinity", person = "sophie_lemaire", ge = 50 }, { kind = "bond", person = "sophie_lemaire", level = "C" }]
hint = "她还不肯欠一个兑换商家的人情。这把钥匙递过去，她不会接。"
reply = "我跑回家，在父亲的账房门口站了半个钟头才敲门。他听完，叹了口气，在一张票据背面写了两行字。仓房的葡萄牙人看了字条，把钥匙交给我，一句也没问。我把钥匙放进索菲母亲的手里。她先上楼检查门栓，推了三下，才回头叫女儿上来。索菲一直抱着书箱，等箱子落了地，她才开口：“你上回说的那件事，我会还你。”我想了一路，也想不起自己上回说过什么。"
next = "a1"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 2 }, { kind = "bond", person = "sophie_lemaire", level = "B" }]

[[tracks.chapters.choices]]
key = "carry_boxes"
text = "先帮她们把书箱搬到我家后院，明天再想办法。"
reply = "书箱沉得要命，我们两个人抬，走三十步歇一回。我家后院的柴棚底下有块干地方，我把箱子塞到柴堆后头，又盖了一张旧帆布。书箱在那里放了三天。第四天她们在城墙根下找到了住处。来搬箱子的时候，索菲往我手里塞了一张纸，折得方方正正。我打开，一个字也没有。翻过来，背面也是白的。我把它夹进了账本的最后一页。"
next = "a1"
effects = [{ kind = "affinity", person = "sophie_lemaire", value = 3 }]

# A1：1556 年五月节清晨（旧历 5 月 1 日，世界日历约 5 月 11 日），城外的林子。一片带露水的草叶。
[[tracks.chapters]]
key = "a1"
title = "五月的露水"
text = "五月节，天还没亮，城门一开，女孩们就提着篮子往城外的林子里跑，要赶在太阳出来以前采山楂花，用五月的头一捧露水洗脸，说这样一年脸上都不长斑。索菲来敲我家后门，敲了三下：“再磨蹭，露水就让别人洗光了。”我还在系鞋带。林子里的草齐小腿高，每片叶子上都挂着水珠。她扯下一片带露的草叶，啪地贴在我脸上。凉得我一哆嗦，往后一退，脸上蹭了一道泥，袖口也挂在了一丛荆条上，越扯越紧。她没笑，蹲下来，一根刺一根刺地替我解，解得很慢，生怕勾坏了线。林子那头传来别的女孩的笑声，有人在唱五月歌。索菲解开最后一根刺，没有马上站起来。“里尔的五月，”她低声说，“早上也这么凉。”这是她头一回自己说起里尔。"
window = [[1556, 5, 1], [1556, 6, 30]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 5, 1], to = [1556, 6, 30] }, { kind = "age", le = 17 }]

