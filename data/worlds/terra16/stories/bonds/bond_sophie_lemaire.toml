text = "约好各走一路，去找一座容得下诗社的城，看谁先找到。"
reply = "“我出海，见的城多，”我说，“赌一个金币，我先找到一座城，女孩们在那儿念诗不用关窗。”“我会先找到的，”她说，“我走过的城比你多。里尔，图尔奈，安特卫普，三座了。你才一座。”“船一年能停二十个港。”“港不是城。”她把她那一半花名册叠起来，“找到了写信告诉我：城名，街名，门朝哪边开，一样都别漏。”“一字不差？”“一字不差。”她伸出手，我们照交易所的规矩拍了一下掌，算是成交。她拍得比我还响，拍完把那一金币的赌注写在她那一半花名册的背面，底下签了两个人的名字。"
