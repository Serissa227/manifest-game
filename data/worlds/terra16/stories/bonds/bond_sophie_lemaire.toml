reply = "我在最后一行写下：索菲·勒梅尔。写到“勒梅尔”，墨水洇开了一点，我没有重写。她盯着那一行，没出声，过了一会儿才拿起笔，在她那一半的最后一行写我的名字。她写得很慢，一个字母一个字母地描，描到最后那个弯弯的字母，停了一停，像怕写错。写完，她把两份花名册并排摆好，推着纸边对齐。最后一行的两个名字正好并在一起，中间只隔着一道纸缝。她伸手握住了我的手，什么也没说。楼下她母亲在烧水，水开了，壶盖一下一下地响。她一直握着，握到水不响了，握到蜡烛矮下去一截。“开春你走的时候，”她终于开口，“这一行，我不给别人看。”"
