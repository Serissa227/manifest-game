#       重逢的 with_ines 变体读 c7_pair_ines_costa_sophie_lemaire_together（配角线 together 章设）。
# 本文件写的旗标：c7_bond_sophie_lemaire_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed。
