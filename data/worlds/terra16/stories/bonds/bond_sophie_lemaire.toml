reply = "“你写一首，我挑三个错，”我说，“我写一首，你挑多少都行。隔着海也一样，信走到哪儿算哪儿。”索菲停了笔。“你在伊内丝家后屋说过，你只记账，不写诗。”她把那句话原样背了出来，连我那天撇嘴的样子都学上了。“那是那会儿。”她看着我，嘴角一点一点松开，终于笑了。她把她那一半花名册对齐、叠好，放进那本书的书衣里，和别的纸压在一起，按平。然后她从抽屉里拿出一叠白纸，裁成信的大小，数了十二张推给我：“一个月一张。头一封你寄，我挑错。”那天晚上回家，我对着蜡烛写了平生第一行诗，写完就涂掉了。第二天早上，又从涂掉的地方接着写。"
next = "done"
effects = [{ kind = "bond", person = "sophie_lemaire", level = "S" }, { kind = "relation", person = "sophie_lemaire", relation = "friends" }, { kind = "memory", memory = "mem-bond_sophie_lemaire-s", title = "两份花名册" }, { kind = "flag", flag = "c7_bond_sophie_lemaire_promise" }, { kind = "flag", flag = "c7_pair_ines_costa_sophie_lemaire_taken" }, { kind = "start_track", track = "reunion_sophie_lemaire" }]

