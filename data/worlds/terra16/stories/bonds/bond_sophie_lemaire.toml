text = "在那张椅子上坐下，说这一回我不走了。"
requires = [{ kind = "flag", flag = "c7_bond_sophie_lemaire_romance" }, { kind = "heart", person = "sophie_lemaire", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "sophie_lemaire", ge = 18 }, { kind = "romance_open", romance_open = "sophie_lemaire" }]
hint = "当年没说出口的话，隔了十二年，坐在这张椅子上，也还是说不出口。"
reply = "我坐下了，没有把椅子往后挪，从怀里掏出我那一半花名册，摊在她的登记簿旁边。“这一回我不走了。船交给大副，账交给伦敦的代理。我在这条巷子里租间屋子，替你记门口那条队。”索菲看着我，手里的笔停在半空。门口有人在等，她没去叫下一户。“你知道我的毛病，”她说，“谁说过什么，我都原样背回去。”她停了停，“这一句，我不背给你听。我收着。”她笑了，笑到一半，眼泪掉下来，砸在我那半本花名册上，正落在最后一行她自己的名字上。她没去擦，俯过身来吻了我。嘴唇上有墨水和冷茶的味道，很轻，像在确认一个字写对了没有。门口那个人咳嗽了一声。索菲直起身，抹了一把脸，蘸了墨：“下一户。从哪座城来？”她写字的时候，左手一直压在桌子底下，压着我的手。"
