# 最后一排（bond_sophie_lemaire）——羁绊线，标签 GL（索菲纯 GL，romance.with = ["f"]；主角莉芙为女性）。
# 人物：索菲·勒梅尔（sophie_lemaire，1541-11-04 生），从里尔搬来安特卫普的新教徒难民之女，坐最后一排靠门的位子。
#       主角：莉芙·德克莱尔克（lieve，1540-10-12 生），安特卫普兑换商的女儿；第一人称“我”，说话带数，只赌算得清的。
#       伊内丝·达·科斯塔（ines_costa，1540-07-19 生）只在 B1 作背景（诗社是她办的），重逢的 with_ines 变体里出现一次，不展开。
#       年龄：C1（1554 春）莉芙 13、索菲 12；A1（1556-05）15 / 14；S（1556-12）莉芙 16、索菲 15——学院期只到心照不宣，
#       S 的心动选项写成在花名册最后一行互写名字、握手，不告白；重逢（1568）27 / 26，都已成年。
# 依据（史实）：1550 年查理五世的“血腥诏令”，私藏、私读法文的经书可判死罪，市政厅门口反复张贴；
#       1555 年 8 月彼得·海恩斯在安特卫普开办“月桂树”女子法语学校（C1—B1 是在那以前的城里女塾）；
#       修辞会不收女子；低地的五月节清晨进林子采花、用五月的露水洗脸；
#       1567 年阿尔瓦公爵到布鲁塞尔，设“除暴委员会”（民间叫它“血腥议会”），低地新教徒大批流亡埃姆登、伦敦、诺里奇、桑威奇、韦瑟尔、科隆；
#       伦敦的尼德兰流亡者以奥斯丁会旧院的“外乡人教堂”（1550 年起）为中心聚居。
# 原创：索菲、她的母亲、里尔门上的铜手门环与量个子的刻线、借笔的旧账、仓房楼上的住处、亲绣手帕与母亲的胸针、
#       诗社花名册的两份抄本、伦敦门口那条登记的队、六座城的诗社、桌边那张垫了木片的椅子。
# 待核：1568 年伦敦流亡者登记的具体做法（正文只写她自己在门口一户户记名字，不写官方名册）。
# 改动（与简报不同处，均为与其他文件对齐）：
#   1. 简报 S 写“索菲家要去埃姆登了”。但 cast 日程写索菲 1557—1566 在安特卫普、1567 起埃姆登，
#      配角线 pair_ines_costa_sophie_lemaire 也写她 1560、1566 年仍在安特卫普，1566 冬才随母亲北上。
#      所以 S 改为“开春我（莉芙）要上船了”，花名册照样各抄一半；索菲家屋角那只“去埃姆登用的”箱子捆着不拆，作为伏笔。
#      default 相应改为我上船那天她没来码头、整本花名册留在她手里。事件（分抄花名册、最后一行、三种约定）不变。
#   2. 重逢写索菲“开年才从埃姆登搬过来”，与配角线 1567 年在埃姆登一致；需要整合方把她 1568 年起的日程改到 london（见下）。
#   3. S 回复里“你上回说你从来不写诗”改为她背出我在 B1 说过的“我只记账，不写诗”（B1 正文先种下这句）。
# 秘密：母亲的法文经书拆成散页缝在书衣里——C2 只写“每节前面标着数字的法文诗”，不点书名；永远不进见闻、标题与回忆标题。
#       本文件的章节都没有 stage，不写 news。
# 口头禅：“你上回可不是这么说的。”只在 c1 出现一次；别处只换说法呼应（背出别人原话、“一字不差”）。
# 羁绊阶梯：C2 block_the_window 给 C；B1 start_the_applause 补签 C；B2 find_lodging 给 B；A1 hear_about_lille 补签 B；
#       A2 keep_kerchief / pin_it_on_her 给 A + 亲绣手帕（embroidered_kerchief）+ 回忆“母亲的胸针”。
#       心动：A1 let_her_wipe +6；A2 pin_it_on_her +6（要求 ≥ 6）；S heart +12（要求 ≥ 12）——全选心动正好 24，够重逢的 love 落点。
#       （决定表写 S +10，算下来只有 22，永远到不了 24，这里按简报用 +12。）
# 缺省走向：每章 default 都往下走、不加任何东西；S 的 default 设 c7_bond_sophie_lemaire_parted 并开启重逢；
