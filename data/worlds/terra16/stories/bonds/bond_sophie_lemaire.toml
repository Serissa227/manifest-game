key = "with_ines"
when = [{ kind = "flag", flag = "c7_pair_ines_costa_sophie_lemaire_together" }]
text = "一五六八年，伦敦。前一年阿尔瓦公爵进了布鲁塞尔，设了那个人人叫它“血腥议会”的衙门，低地的人一船一船往外逃，挤在奥斯丁会旧院那座外乡人教堂周围的几条巷子里。索菲就住在其中一条巷子里，开年才从埃姆登搬过来。她门口排着队，每进来一户，她都问三样：“从哪座城来？几口人？谁没跟上？”诗社没有自己的屋子了，墙上钉着一张纸，写着六座城的地址。我进门时，她正替一个从根特走来的朋友念完一首诗。桌边原本有一张空椅子，现在坐着一个从里斯本来的女人，低着头，在一个旧本子上续一首诗，写一行，停一停，等索菲念完再写。索菲抬头看见我，起身从里屋又搬出一张椅子，一条腿底下垫着木片。“她来了以后，椅子就不够了，”她说，“这张是你的，留了十二年。”"

