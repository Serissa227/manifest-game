# 重逢：1568 年，伦敦。流亡者的街上，桌边一张垫了木片的空椅子。
[[tracks.chapters]]
key = "reunion"
title = "隔海的一席"
text = "一五六八年，伦敦。前一年阿尔瓦公爵进了布鲁塞尔，设了那个人人叫它“血腥议会”的衙门，低地的人一船一船往外逃，逃到这边，挤在奥斯丁会旧院那座外乡人教堂周围的几条巷子里。索菲就住在其中一条巷子里，开年才从埃姆登搬过来。她门口排着队，每进来一户，她都问三样：“从哪座城来？几口人？谁没跟上？”她问得快，记得更快，不看纸也能把前一户的话原样复述一遍。诗社没有自己的屋子了，墙上钉着一张纸，写着六座城的地址：伦敦，诺里奇，桑威奇，埃姆登，韦瑟尔，科隆。我进门时，她正替一个迟来的朋友念完一首诗。那人从根特一路走来，坐在角落里，念不动了。念完，索菲才抬头看我。桌边有一张空椅子，一条腿底下垫着木片。“这是给你留的，”她说，“留了十二年。”"
window = [[1568, 1, 1], [1568, 12, 31]]
at = "london"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1568, 1, 1], to = [1568, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "sophie_lemaire", ge = 18 }]

# 缺省：我错过了伦敦；她寄来一封信和花名册最后一页的抄本，最后一行是我的名字。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "sophie_lemaire", text = "莉芙：你没来。你的船在哪个港，我问了三个从泽兰来的水手，三个人说了三个地方，我一个也不信。我在伦敦，奥斯丁会旧院后头的巷子里，门口每天排着人。我替他们记名字：从哪座城来，几口人，谁没跟上。记到今天，四百一十二户。你要是在，准说这个数不好看，要凑个整。我不凑。诗社还在。没有自己的屋子了，有六座城。伦敦这一席在每月第一个礼拜天，诺里奇的在第三个。随信寄去一页抄本，是十二年前那本花名册的最后一页。最后一行是你的名字，我写的。你别说我记错了，我没记错。桌边那张椅子还在，一条腿短，我垫了木片。你回来就坐。不回来，我也不搬走它。你说过的话我都记着，连那句“只记账，不写诗”也在。哪天你到伦敦来，我从头背起。——索菲·勒梅尔，于伦敦" }, { kind = "flag", flag = "c7_bond_sophie_lemaire_missed" }]

# 配角线里伊内丝与索菲成了恋人（together）时：桌边坐着从里斯本来的伊内丝，不展开两人的事。
