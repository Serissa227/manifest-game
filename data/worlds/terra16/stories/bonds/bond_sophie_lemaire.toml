key = "friend"
text = "在那张椅子上坐下，答应做她隔海的姐妹。"
reply = "我坐下了。椅子还是有点晃。索菲把那本旧花名册翻开，纸边已经卷了，一页页都是十二年前的字。她找到我的名字，蘸了墨，在旁边写了两个字：姐妹。写得很重，笔尖把纸划破了一点。“诗社的规矩，名字旁边写什么，就是什么，写了不改。”她把笔递给我。我在账本最后一页写下她的名字，旁边也写了这两个字，写歪了，她看了一眼，没挑。那天下午我没走，替她记门口那条队：她问，我写。轮到一个从里尔来的老妇人，说起她家那条街，索菲停了一下，替她报出了街口第三家的门环——一只铜手。傍晚关门，她把我那张椅子推回桌边。“明天还来？”“来。”“你说的，”她说，“我记着。”"
