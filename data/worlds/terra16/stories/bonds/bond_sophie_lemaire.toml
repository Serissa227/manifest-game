# S：1556 年 12 月，索菲家的桌子。诗社的花名册抄成两份；开春莉芙要上船（见文件头“改动 1”）。
[[tracks.chapters]]
key = "s"
title = "两份花名册"
text = "诗社只有一本花名册，记着两年多里来过的每一个人，一直是伊内丝收着。开春我就要上船了。索菲说：“那就再抄两份，你带一份走。”我们在她家那张唯一的桌子上，一人抄一半，再交换过来互相挑错、补齐。她抄得快，我抄得慢，她每抄完一行就停下来等我。抄到后面，有些名字我停住了：搬去科隆的，嫁了人的，被家里叫回去再也没来的。那些椅子空了好久，我不知道还该不该写。索菲把笔从我手里抽过去，给每个人都留了一行，名字写全，连谁在哪一回念过什么诗都记在后面。屋角立着一只捆好的木箱，捆了一年多没拆。她母亲说：“那是去埃姆登用的，总有一天用得上。”轮到最后一行。索菲把那支缠着旧线的笔递给我。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

