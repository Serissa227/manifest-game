# A2：1556 年夏秋。亲绣手帕（embroidered_kerchief）与母亲的胸针；胸针本身只进回忆。
[[tracks.chapters]]
key = "a2"
title = "母亲的胸针"
text = "索菲送我一方手帕，亚麻的，四角各绣一朵勿忘我。左下角那朵比另外三朵大了一圈，她说拆了三回，越拆越大，最后认了。手帕的内角别着一枚胸针，银的，小小一枚，上面一片花叶已经磨平了。是她母亲的。“背面的扣子坏过，”她把胸针翻过来给我看，“我拿镊子一点一点掰回去的，掰了一个晚上。”我伸手想摸，她先一步按住了。“胸针给你看，”她说，“手帕给你留着。”她低头检查那枚扣子扣牢了没有，指尖在扣上停了一瞬，没有马上拿开。远处交易所的钟敲了四下，她数完了，才抬起头来。"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "antwerp"
cast = ["sophie_lemaire"]
speaker = "captain"
mood = "tender"
