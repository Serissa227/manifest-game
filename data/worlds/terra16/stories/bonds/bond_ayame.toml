[[tracks.chapters]]
key = "c1"
title = "不许乱的袖口"
text = "天文二十三年春，我进宫的头一天。上臈的局在廊子尽头，纸门关着，门前已经跪着一个和我差不多大的女孩。她把左手的袖口理了一遍，右手的理了一遍，又从左边重来，理到第三遍，才把手放回膝上。我在她旁边跪下。她的目光落在我右手上：虎口一片墨，是早上在淀川的船上替船家对账蹭的。她从袖里抽出一块叠成方块的湿布，递到我面前。“这一块布记下了，”我说，“船上的账，不记清楚要吵架的。”“这里不是船上。”她声音很轻，每个字都落在该落的地方，“袖口理好了，再开口。”话说得稳，递布的那只手却在抖。她自己也觉出来了，把手收回去，连指头带湿布的凉气，一起藏回了袖子里。纸门里头，上臈咳了一声。"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["ayame"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_kyoto_court" }, { kind = "date", from = [1554, 3, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
