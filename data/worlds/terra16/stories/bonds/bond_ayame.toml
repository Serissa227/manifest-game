[[tracks.chapters.choices]]
key = "wipe_ink"
text = "接过湿布，当着她的面把墨擦干净，跟她一起进门。"
reply = "我把虎口擦到发红，摊开手给她看。她点了一下头，把湿布接回去，叠回原来的方块。纸门拉开，她侧过身，让我跟在她后面半步。上臈问起家门，她先答：“大炊御门家，菖。”一个字不错，连停顿都像量过。轮到我，我照着她的停顿也答了。上臈看看她，又看看我，没挑出毛病。出了门，菖低声说：“您刚才第二个字咬得太重。土佐的口音，往后改。”"
next = "c2"
effects = [{ kind = "affinity", person = "ayame", value = 3 }, { kind = "skill", skill = "court_etiquette", value = 6 }]

[[tracks.chapters.choices]]
key = "hand_back"
text = "笑说土佐的海风比墨难洗，把湿布递回去，请她先擦擦自己的指尖。"
reply = "她的脸一下子白了，低声说了句“失礼”，把手连布一起缩回袖里。进门以后上臈问话，她答得一字不差，眼睛没往我这边看。那天她一整天没理我，第二天把同局一个小见习的坐姿挑了七处错，挑得那孩子哭了。傍晚我回到局里，砚台边多了一块新墨，拿一张折得方方正正的纸包着，纸上写着：袖口。"
next = "c2"
effects = [{ kind = "affinity", person = "ayame", value = 4 }]

[[tracks.chapters]]
key = "c2"
title = "请我挑错"
text = "梅雨刚过，局里闷得像蒸笼。菖在廊下摆了一张膳台，台上一只空碗，她捧着它练端膳时的转身。“请您看着。”她说，“只许挑错，不许夸。”第一回，她转得太急，衣摆扫过膳台，台脚“咯”地响了一声。我说了。她点头，退回原处，重来。下一回是肩先动了。再下一回是膝盖落得慢了半拍。我说一处，她应一声“是”，一句不辩。后来我得眯起眼才找得出毛病，最后只好说她的气喘重了。“那也是错。”她说，“再来。”中间她让我也试一回。我捧起那只空碗，脚下一拧，碗沿磕上了下巴，衣摆缠住脚踝，差点连人带碗跪进膳台里。菖伸手扶住了碗，没扶我。她把碗放回原处，把袖口理平，跪回起手的位置：“第七回。请您接着挑。”我的下巴还在疼。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "kyoto"
cast = ["ayame"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

