[[tracks.chapters]]
key = "a1"
title = "不作第一的下午"
text = "弘治二年春，宝镜寺的尼僧都去了别院，庭里只剩一树晚开的山樱和我们两个。菖坐在廊下，膝上什么也没有，手藏在袖里。过了一阵，她开口：“一条大人在船上学的那些，在这里一样也用不上。上臈说您数钱的时候嘴唇在动。”我转身从里间抱出一摞抄本，往她身边一放：寺里存的旧歌集，借来没还的《伊势》，不知谁抄了一半的《源氏》，纸头卷着，前后颠倒，好几年没人理过。“帮我分。”她看看那摞纸，又看看我，跪坐端正，一册一册翻起来。歌集归左，物语归右，残本放中间。分了半个时辰，日头挪了过来，她的一只脚不知什么时候从衣摆底下伸了出去，伸出廊檐的阴影，搁在了太阳地里。她自己先看见了，收回来，又把那一册残本的书脊对齐。“您分错了一册，”她说，“《古今》混进物语里了。”她把那一册抽出来，放到左边那一摞的最上头。"
