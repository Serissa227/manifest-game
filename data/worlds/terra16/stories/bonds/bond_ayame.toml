[[tracks.chapters.choices]]
key = "read_judgment"
text = "陪她把判词一句一句读下去，读到天黑。"
reply = "她念一句，我说一句：哪句是判者的场面话，哪句是真心。读到“无情”两个字，我说判者自己的歌也没什么情。她把判词合上：“判者的歌好不好，不是今日的事。今日的事，是我负了。”火盆里的炭塌下去一块，她拿火箸拨平，拨完把判词叠好，四个角对齐，起身告辞，走到纸门那里回头：“一条大人，您刚才那句话，往后在宫里不要说。”"
next = "b2"
effects = [{ kind = "affinity", person = "ayame", value = 3 }, { kind = "skill", skill = "poetry", value = 6 }]

[[tracks.chapters.choices]]
key = "enter_next"
text = "告诉她，下个月的歌会我也报名，跟她比一场。"
reply = "她抬起头，眼睛一下子亮了，亮得不像刚输过的人。“那就照规矩比过。”她把判词收好，“别指望我让您。”那一夜，局里数她那盏灯熄得最晚。我隔着纸门听她一回一回低声念歌，念到后来，连我都背得出她改了哪个字。"
next = "b2"
effects = [{ kind = "affinity", person = "ayame", value = 4 }]

[[tracks.chapters]]
key = "b2"
title = "补过的单衣"
text = "改元弘治以前的那个正月，朝廷连元日的节会都差点凑不出钱来办。上臈说起这事，只叹了一声：“天下如此。”大炊御门家的日子也紧。局里的人小声传，菖的母亲把压箱底的那件好衣裳送进了当铺。从那以后，菖当值穿一件旧单衣，颜色洗得发浅，袖口照旧一丝不乱，折痕是刀裁出来的样子。那天她跪在我前头收拾香具，背弓下去，我看见她两片肩胛之间有一道缝补，针脚又粗又密，线色还差了一截，一看就是夜里就着灯赶出来的。她觉出我在看，把手里的香盒放下，背一下子挺直了，没回头。“补过的也是衣服。”她说。“我没说不是。”“您的眼睛说了。”她把香盒盖好，袖口又理了一回，“今日的香，请您来点。”香盒里只剩小半块沉香。"
