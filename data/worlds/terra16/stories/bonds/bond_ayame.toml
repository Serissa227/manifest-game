[[tracks.chapters.choices]]
key = "teach_counting"
text = "倒出一把铜钱，教她船上数钱的法子：五个一叠，眼睛不看手。"
reply = "我五个一叠，手指一捻一放，眼睛只看着她。她学得出奇地快，数到第三叠就比我利落，得意得忘了拿袖子遮嘴。“这个比和歌容易。”话一出口，她又赶紧压低声音，“学过这个，千万别对人讲。”她把几叠钱推回来，又挑出一枚：“这一枚是私铸的，边上薄。您收钱的时候也不看。”"
next = "a2"
effects = [{ kind = "affinity", person = "ayame", value = 3 }]

[[tracks.chapters]]
key = "a2"
title = "一把改过的扇"
text = "重阳过后，菖拿来一把扇子，是她自己写的：正面一首旧歌，背面一首她新作的。我对着灯翻到背面，第三行有一处纸面比别处薄，起了细毛，是拿小刀刮过，重写了一个字。刮得极细心，不凑近看，看不出来。“那处是我写错了。”她说得很快，“本想重写一把，可扇骨只剩这一副。”她从袖里取出一小片裁好的纸，边角修得圆圆的，颜色和扇面一般无二，“贴上去，就看不见了。”“不用贴。”她捏着那片纸，看看扇子，看看纸，又看看扇子，手指把那片纸的边捏起了皱。最后她把纸对折，再对折，收回了袖子里。"
