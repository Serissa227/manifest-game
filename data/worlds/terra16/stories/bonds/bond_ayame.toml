[[tracks.chapters.choices]]
key = "ask_perfect"
text = "还是请她另写一把，一处刮痕也不要。"
reply = "过了十来天，她真的又写了一把，扇骨是从哪里借来的，她不肯说。两把扇子并排摆在我面前：“请您自己挑。”我挑了没刮痕的那把。她点点头，把另一把合上收好，起身告辞。第二天，局里新来的两个见习被她挑了一上午的袖口。"
next = "s"
effects = [{ kind = "affinity", person = "ayame", value = 1 }]

[[tracks.chapters]]
key = "s"
title = "还会较量"
text = "十二月，土佐来的船在堺等我，开春就要出海。临走前一晚，菖到局里来送我，带来一叠怀纸，裁得齐齐整整，说是给我路上作歌用的。“往后的歌合，我照样要和您比。”她跪坐着，手藏在袖里，“只是信里，不必每回都写上谁胜谁负。”“那你怎么知道自己赢了没有？”“我自然知道。您也知道。写出来，倒像要请上臈来判似的。”我把那叠怀纸数了一遍，二十张。她看我数，等我数完才问：“船上的人数纸也这么快？”“船上的人，什么都数得快。”她把那叠怀纸往我这边推了一寸：“船上的纸潮，第七张往后的您先用。”那叠纸是她从上臈那里讨来的，边上压着上臈局里的印。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "kyoto"
cast = ["ayame"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

