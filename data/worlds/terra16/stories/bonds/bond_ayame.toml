next = "b1"
effects = [{ kind = "affinity", person = "ayame", value = -3 }]

[[tracks.chapters]]
key = "b1"
title = "输了以后"
text = "十一月的月次歌会，题是“初时雨”。我没报名，坐在末席替上臈磨墨，看得一清二楚。菖的歌念出来，满座都点头；判者却在判词末尾添了四个字：“工而无情。”那一番，记了她负。散了场，别人三三两两去烤火，她留在原位叠自己的怀纸。先对折，再对折，每一道折痕都拿指甲压一回，四个角对得严丝合缝。我走过去，她头也不抬：“您是来看笑话的？”“来看你叠纸。”她的手停了一下，把判词抽出来，摊在膝上，指着末尾那四个字。“前头的都是客气话。只这一句说得对。我认。”廊外下起了今年头一场时雨，打在竹帘上沙沙地响。"
window = [[1554, 11, 1], [1554, 12, 31]]
at = "kyoto"
cast = ["ayame"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1554, 11, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

