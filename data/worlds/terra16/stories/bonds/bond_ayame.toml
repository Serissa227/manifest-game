[[tracks.chapters.choices]]
key = "say_nothing"
text = "装作没看见，当值时站在她身后，替她挡住那道缝。"
reply = "那一整天，她走到哪里，我就跟在她背后半步。上臈终于忍不住问：“澪，你几时成了菖的影子？”局里的人都笑了。菖回头看我一眼，没笑，也没像平日那样说我走路手臂摆得太开。第二天她把这一条补上了，说得一处不落。"
next = "a1"
