# C7 故事线重写（2026-10-11，Claude 写）；C21b 重写（2026-11-12，Claude Opus）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 走向：看不上→服她的歌，到不了喜欢（看不上她；一辈子没当上上臈，见 tie_new_ayame_kogo 与 classmates_kyoto 的 after）。
# 标签：对手（rival）羁绊线；只写较量，不开放恋爱，全线不写心动。
# 人物：大炊御门菖（ayame，1540-03-07 生，被上臈寄予厚望的见习女房）；主角一条澪（mio，1540-06-21 生，“我”）。
#   声音（手册 3.9）：端正，每个字落在该落的地方；当面挑错，说规矩条文；用“您”，敬语是她的墙，只在 A1 那个下午掉过一次；
#   生气时脸色发白，气出在第二天、出在别人身上；高兴了笑一下马上理袖口；说谎越合礼。理袖口理三遍是她一个人的毛病。
#   称呼：叫澪“土佐来的姬君”→“一条大人”→“一条澪”，从不叫“澪”。不说“请您帮我”，不说“喜欢”。
# 依据·史实：天文末年朝廷穷困，节会常因无钱停办；1555 年 10 月改元弘治；正亲町天皇 1557 年践祚，
#       即位礼拖到永禄三年（1560）正月，靠毛利元就的献金才办成；宫中的月次歌会、女房的局、宝镜寺（尼门迹）。
# 依据·原创：菖与澪的全部场面（湿布、空碗、判词、补过的单衣、抄本、刮改的扇、二十张怀纸、小见习、改过折法的礼单）。
# 关系会退（C21b）：c2 just_praise 情谊 -3，她第二天请了别人去挑错，不在当场和解。
# 撞车改法（手册 4.2 第 4 条、裁决第 2 条）：S 的 promise 不再“每年寄一首歌”，改成澪往内里递的礼单、奉书先寄给她改折法，
#   她只改规矩，不读内容，回信两个字“收到”。重逢的落点去掉“朋友”（裁决第 5 条）：tell_bows 撤掉 friends，只留情谊。
# 不写：菖花米请小督代写和歌（归 bond_kogo B1 与 tie_new_ayame_kogo）；1554 年秋菖赢澪的那场歌合（归 bond_kogo B1）；1555 七夕（归 bond_reizei_yuki A1）。
# 缺省走向：c1 → c2 → b1 → b2 → a1 → a2 → s（缺省：设 c7_bond_ayame_parted，开启重逢）→ reunion（缺省：菖来信，设 c7_bond_ayame_missed）。
# 落点：S 的 promise（bond S + friends）/ own（rivals）；重逢的 tell_bows（撤 friends）/ one_more_match（rivals）。
# 设的旗标：c7_bond_ayame_promise、_own、_parted、_landing_friend、_landing_rival、_missed（键名照旧；_landing_friend 现在不带 friends 关系）。
# 读的旗标：c7_bond_ayame_promise、c7_bond_ayame_own（重逢的 variants）。不读、不写别的线的共享旗标。

