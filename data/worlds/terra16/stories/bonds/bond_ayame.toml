next = "b1"
effects = [{ kind = "affinity", person = "ayame", value = 4 }, { kind = "skill", skill = "court_etiquette", value = 4 }, { kind = "bond", person = "ayame", level = "C" }]

# just_praise（C21b 改）：情谊 -3。她请了别人来挑错，到 b1 才再跟澪说话。
[[tracks.chapters.choices]]
