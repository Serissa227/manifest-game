# 重逢：1561 年，内里。她如今在上臈跟前，还在等接班（1570 年认错以后就没人再提，见 tie_new_ayame_kogo）。
[[tracks.chapters]]
key = "reunion"
title = "我先请教"
text = "永禄四年，我为一桩生意回京都，要去一位公卿家递礼单。递法我记得七八分，剩下两三分拿不准，就先去了内里找菖。她如今在上臈跟前当差，局里的人都说，上臈那个位子往后是她的。我到的时候，她正跪在一个八九岁的小见习对面，教那孩子理袖口：“先左，再右。理完了，手放回膝上，不许再碰。”孩子理了三遍，第三遍才平。旁边的老女房还在说去年的事：正亲町天皇的即位礼拖了几年，总算办成了，靠的是西国毛利家献的钱。菖接过我的礼单看了一眼：“您的歌，我前年读了，好。这礼单是武家的折法，在内里递出去，人家要笑一条家的。我给您改，您站着别动。”她改了一处折法，示范了一回递单的手势，又俯身把小见习歪了的坐垫扶正，这才转过身来，看着我。“一条大人如今见的人，都是怎么行礼的？”小见习偷偷把袖口又理了一回。"
window = [[1561, 1, 1], [1561, 12, 31]]
at = "kyoto"
cast = ["ayame"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1561, 1, 1], to = [1561, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "ayame", text = "一条大人：今年没能见上一面。上臈把新来的见习交给我带，八岁，袖口理三遍才平。去年御即位总算办成，宫里过了一个不必向人借灯油的冬天。您寄来的礼单，第二折反了，已改，随信寄回。下回递公卿家，先右后左，不可颠倒。别的事，信里不必写。菖" }, { kind = "flag", flag = "c7_bond_ayame_missed" }]

[[tracks.chapters.choices]]
key = "tell_bows"
text = "把这些年各地见过的行礼，一样一样做给她看。"
reply = "我从澳门的葡萄牙人做起：脱帽，退半步，弯腰；再是明国官员的作揖，两手抱拳，从胸前推出去；再是琉球使者的跪拜。菖跪坐着看，看得比当年看我端膳还认真，一样一样挑出我做错的地方。做到暹罗人那一种，跪下，合掌举过额头，再伏身三回，她抬手止住我：“这个，宫里没有。请再做一回。”我又做了一回。她招手叫来那个小见习，让孩子跟着我学，自己在一旁看。孩子学得歪歪扭扭，她伸手把那双小手扶平：“先照着做对，好看不好看，往后再说。”她把暹罗那一拜画在一张怀纸上，四角对齐，放进教见习用的册子里。送我到廊下，她行了一个礼，是宫里送外客的礼。“一条大人路上小心。”"
next = "done"
effects = [{ kind = "affinity", person = "ayame", value = 5 }, { kind = "relation", person = "ayame", relation = "friends", remove = true }, { kind = "flag", flag = "c7_bond_ayame_landing_friend" }, { kind = "memory", memory = "mem-bond_ayame-reunion", title = "我先请教" }]

[[tracks.chapters.choices]]
key = "one_more_match"
text = "约她当晚比一场歌，判者就请那个小见习来当。"
reply = "她说宫里的歌合不许这么胡来，说完就去取了怀纸。题是小见习抽的：“归帆”。我写了船尾的风，她写了宫墙外看不见的海。孩子捧着两张纸念了半天，指了菖那张。“不算。”菖说，“这孩子是我教的，偏心。”“那算我赢？”“算平局。”我们为“平局”两个字争到灯油见底，小见习早伏在坐垫上睡着了。菖解下外衣给孩子盖上，孩子翻了个身，梦里还嘟囔了一声“菖大人赢”。菖装作没听见：“下回请个不认识我的判者。您那一首，第二句的‘帆’字用重了。”"
next = "done"
effects = [{ kind = "affinity", person = "ayame", value = 3 }, { kind = "relation", person = "ayame", relation = "rivals" }, { kind = "flag", flag = "c7_bond_ayame_landing_rival" }, { kind = "memory", memory = "mem-bond_ayame-reunion", title = "我先请教" }]

[[tracks.chapters.variants]]
key = "promised"
when = [{ kind = "flag", flag = "c7_bond_ayame_promise" }]
text = "永禄四年，我为一桩生意回京都，要去一位公卿家递礼单。这几年我往内里递的礼单、奉书，都先寄给她，她改了折法寄回来，回信只有两个字：“收到。”有一回我在礼单里夹了一首歌，她改好礼单寄回，歌原样夹着，回信还是那两个字。这一回我直接去了内里。菖在上臈跟前当差，正跪在一个八九岁的小见习对面，教那孩子理袖口：“先左，再右。理完了，手放回膝上，不许再碰。”她接过我的礼单，看也不看上面写的什么，翻过来先看折痕：“这一折，您还是折反了。我写信说过两回。”她改好了，又俯身把小见习歪了的坐垫扶正，这才转过身来：“一条大人如今见的人，都是怎么行礼的？”我手里那张礼单，折痕被她压得笔直。"

[[tracks.chapters.variants]]
key = "rematch"
when = [{ kind = "flag", flag = "c7_bond_ayame_own" }]
text = "永禄四年，我为一桩生意回京都，要去一位公卿家递礼单。临走那年记下的那一场歌，一直还没比。递礼单的法子我拿不准，就先去了内里找菖。她在上臈跟前当差，正跪在一个八九岁的小见习对面，教那孩子理袖口：“先左，再右。理完了，手放回膝上，不许再碰。”旁边的老女房还在说去年的事：即位礼拖了几年，总算办成了，靠的是西国毛利家献的钱。菖看见我，第一句话是：“那一场，我还记着。”她把我的礼单看过，改了一处折法，示范了一回手势，又俯身把小见习歪了的坐垫扶正，这才转过身来：“一条大人如今见的人，都是怎么行礼的？比歌以前，我得先知道您在外头学坏了多少。”"
