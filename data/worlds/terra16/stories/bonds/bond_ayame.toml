# promise（C21b 改，裁决第 2 条）：不寄歌。往内里递的礼单、奉书先寄给她改折法，她只改规矩，不读内容，回信“收到”。
[[tracks.chapters.choices]]
key = "promise"
text = "约好往后往内里递的礼单、奉书，先寄给她改折法。"
requires = [{ kind = "bond", person = "ayame", level = "A" }]
hint = "羁绊 A。一生一回的约若已许给别人，这回只能互道珍重。"
reply = "“只改折法。”她说，“写的是什么，我不看。哪一家递给哪一家，我也不问。”“你不看，怎么改？”“折法有折法的规矩，与写的什么无关。”她从袖里取出一张纸，问清了我在土佐的住处，一笔一画写下来：国名、郡名、船家的名号，连那个渡口的旧称也问明白了才落笔。写完她把墨吹干，叠好，交到我手里，袖口一点墨都没沾。“寄来的我改好寄回，回信只写两个字。您别嫌短。”廊外又下起了时雨，像那年歌会散场的时候。"
next = "done"
effects = [{ kind = "affinity", person = "ayame", value = 5 }, { kind = "bond", person = "ayame", level = "S" }, { kind = "relation", person = "ayame", relation = "friends" }, { kind = "flag", flag = "c7_bond_ayame_promise" }, { kind = "flag", flag = "c7_mio_heart_1" }, { kind = "memory", memory = "mem-bond_ayame-s", title = "还会较量" }, { kind = "start_track", track = "reunion_ayame" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好下回见面，正正经经再比一场歌，照规矩比过。"
reply = "“好。”她答得干脆，“到时请个判者来，输了不许讨饶。也不许拿船上的大白话作歌。”“那可说不准。海上的话，有时候比宫里的好听。”她瞪着我，瞪了一会儿，笑了，不拿袖子掩，笑得肩膀直抖。笑完她赶紧把袖口理平，从那叠怀纸里抽出一张，写上“弘治二年十二月，约歌一番，未比”，折好压进我行李的最底下：“这一场，先记下。到时候拿出来，别赖。”"
next = "done"
effects = [{ kind = "affinity", person = "ayame", value = 2 }, { kind = "relation", person = "ayame", relation = "rivals" }, { kind = "flag", flag = "c7_bond_ayame_own" }, { kind = "memory", memory = "mem-bond_ayame-s", title = "还会较量" }, { kind = "start_track", track = "reunion_ayame" }]

