# S：1556 年 12 月，马斯喀特码头。我随东北季风出海，她开春跑父亲的船；一张只写了港口的赛约。
[[tracks.chapters]]
key = "s"
title = "日子空着的赛"
text = "十二月，东北风稳了，学堂的船要往南去，我跟着走。莎迪娅开春也要上她父亲的船，跑霍尔木兹。最后一个傍晚，她在码头上摊开一张纸，拿炭条写赛约，一笔一画写得很用力：比的人，莎迪娅、纳吉玛；地方，马斯喀特港，绕黑礁回来。日子那一栏，她没写。“你回来的那天，”她说，“就是开赛的那天。”炭条在纸上敲了两下，“可别为了赶回来跑坏天气。翻在半路上的人不算输，算没来。”她把赛约折成四折，塞进我手里，又攥着我的手腕不放，扬起下巴补了一句：“敢不敢？”"
window = [[1556, 12, 1], [1556, 12, 31]]
cast = ["shadia"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：开春我出海那天，莎迪娅在港湾里一个人跑了一趟，回来把帆收了。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_shadia" }, { kind = "flag", flag = "c7_bond_shadia_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "跟她约好：回来那天，先报平安，再开赛。"
requires = [{ kind = "bond", person = "shadia", level = "A" }]
hint = "赛约捏在手里，“先报平安”这句却说不出口：你们的交情还没绕过一整圈黑礁；要么，一辈子的约，你已经跟另一个人赛定了。"
reply = "“先报平安？”莎迪娅哼了一声，“那你得活着回来才报得了。”我说当然活着回来，领航家的人不翻在半路上。她把赛约从我手里抽回去，摊在膝盖上，借着码头上的灯，在日子那一栏旁边画了个小圈。圈画得很圆，大小、位置，都跟她画在我航图上的那个一模一样。“这个圈，”她拿炭条点着它，“就是你回来那天。哪天你的船进了港，先上岸来找我，当着我的面说一句你没事。然后——”她把纸重新折好，这回折得整整齐齐，塞进我胸前的衣襟，隔着布按了按，“然后你就等着输吧。”她站起来，拍掉身上的沙，往岸上走了几步，又回过头：“我说真的。先报平安。”"
next = "done"
effects = [{ kind = "bond", person = "shadia", level = "S" }, { kind = "relation", person = "shadia", relation = "friends" }, { kind = "memory", memory = "mem-bond_shadia-s", title = "日子空着的赛" }, { kind = "flag", flag = "c7_bond_shadia_promise" }, { kind = "flag", flag = "c7_pair_kabir_shadia_taken" }, { kind = "start_track", track = "reunion_shadia" }]

[[tracks.chapters.choices]]
key = "heart"
text = "在日子那一栏写上“成年以后”，说那天除了比赛，还有一句话。"
requires = [{ kind = "bond", person = "shadia", level = "A" }, { kind = "heart", person = "shadia", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "shadia", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "shadia" }]
hint = "炭条到了你手上，你却写不下去：要么你们还没熟到能写这样的日子，要么同样的话，你已经许给另一个人了。"
reply = "我接过炭条，在日子那一栏写了四个字。莎迪娅凑过来念：“成年以后。”念完她就不出声了，盯着那四个字看了很久。码头的灯照在她脸上，她的脸慢慢红上来，红得跟帆上那块旧头巾一个颜色。“什么话？”她问。我说到那天再说。她低头去折赛约，折了两回都没对齐，干脆揉成一团攥在手心，然后伸过手来，握住我的手，那团纸就夹在我们两个的掌心中间。“那句话，”她说，“我先替你留着一半。”她就那样握着，一直握到学堂的船上有人喊我的名字，才松开手，把那团纸展开，顺着日子那一栏一撕两半，一半揣进自己怀里，一半塞回给我：“另一半，你自己收好。丢了，就算你认输。”"
next = "done"
effects = [{ kind = "bond", person = "shadia", level = "S" }, { kind = "heart", person = "shadia", value = 12 }, { kind = "relation", person = "shadia", relation = "crush" }, { kind = "flag", flag = "c7_bond_shadia_romance" }, { kind = "memory", memory = "mem-bond_shadia-s", title = "日子空着的赛" }, { kind = "flag", flag = "c7_pair_kabir_shadia_taken" }, { kind = "start_track", track = "reunion_shadia" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟她约好：往后十年，每年回马斯喀特比一场。"
requires = []
reply = "“十年？”莎迪娅瞪大了眼睛，掰着指头算，“十年以后我们都二十六了，老了，划不动了。”我说那就比到划不动为止。“那你得输十场。”“说不定是你输。”她一把抢过炭条，在日子那一栏写了个“十”，后面画了十道短杠：“比一场划掉一道，谁赢得多谁算赢。”我问划掉的那道记在谁头上。她想了想，说记赢家的，又说不对，记输家的，省得输家赖账，说着说着自己也糊涂了，笑着一推，把我推下了沙坡。我滚了一身沙，她叉着腰站在坡上喊：“第一场，你已经输了！”"
next = "done"
effects = [{ kind = "affinity", person = "shadia", value = 2 }, { kind = "relation", person = "shadia", relation = "rivals" }, { kind = "flag", flag = "c7_bond_shadia_own" }, { kind = "start_track", track = "reunion_shadia" }]

