# 重逢：1562 年，马斯喀特港湾。她教一群孩子赛船，一条新漆的竞渡船；那片礁已经画进她父亲的航簿。
[[tracks.chapters]]
key = "reunion"
title = "旧对手的码头"
text = "1562 年，我的船在马斯喀特下了锚。港湾里一群孩子在赛三角帆小船，乱成一锅粥，一个女人站在一条新漆的竞渡船上，拿桨指着他们骂：“帆角！收那么紧做什么，想翻吗？”是莎迪娅。她骂到一半抬头看见我的帆，桨一收，丢下那群孩子，一个人划着船冲了过来，船头差点撞上我的船舷。她扒着船舷翻上来，晒得比当年还黑，先从怀里抽出一封信，在我面前晃了晃：“古吉拉特一个领航员下的竞航书。这个人每年都来挑战，每年都输。”她把信揣回去，抱着胳膊打量我：“你呢？这回是来比的，还是来坐坐的？”我还没答，她往港口东边扬了扬下巴：“那片礁，我画进我爹的航簿了。他骂了我一整天。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "muscat"
cast = ["shadia"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "shadia", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "shadia", text = "纳吉玛：你的船今年没进马斯喀特。港务的人说你在马六甲那边，也有人说你去了更远的地方。我不管，反正你没来。这张图是我自己画的，画得难看，你们领航家的人看了不许笑。石阶、黑礁、港口东边那片礁，都在上头。那片礁我画得清清楚楚——你说过差一点点就差出去老远，我记着，量了三回才落的笔。我爹的航簿上也有它了。他骂了我一整天，问我为什么早不说，骂完了，自己拿笔又描了一遍。我现在教港湾里的孩子赛船，他们收帆收得跟你当年一样紧，我一看就想笑。有个古吉拉特来的领航员每年都来下竞航书，每年都输，输了还来，脸皮比你还厚。那条补了三块的旧船我拆了，帆留着，三块补丁都在，挂在我屋里的墙上。那年说好的那一场，还欠着。我不催你，别为了赶回来跑坏天气。可哪天你的船进了港，先来找我。图上那片礁旁边我写了三个字，你认得。——莎迪娅" }, { kind = "flag", flag = "c7_bond_shadia_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "说来坐坐，跟她分一把椰枣，把这几年的海讲给她听。"
requires = []
reply = "莎迪娅冲那群孩子吼了一嗓子，叫他们自己把船拖上岸，然后拉着我在沙滩上坐下，从布袋里抓出一把椰枣，一人一半，跟当年一样。我从霍尔木兹讲到卡利卡特，讲到马六甲外海那一场风：帆刚收到一半，桅杆就叫起来，船侧着身子在浪里滑了半夜，天亮时舵手的手都僵了。她听得椰枣都忘了嚼，听到最后一拍大腿：“那场风我要是在，一定比你跑得好。”我说你又没见过那么大的风。“没见过才要去见。”她把枣核往海里一弹，弹得老远，又问那场风是从哪边来的、帆收到了哪儿、舵往哪边压，一样一样问得比港务的人还细。太阳落下去，孩子们早散了，她还在拿手指在沙上画那场风的方向，画完了指着它说：“下回你出海，带我一程。就一程。”"
next = "done"
effects = [{ kind = "affinity", person = "shadia", value = 5 }, { kind = "relation", person = "shadia", relation = "friends" }, { kind = "flag", flag = "c7_bond_shadia_landing_friend" }, { kind = "memory", memory = "mem-reunion_shadia", title = "旧对手的码头" }]

[[tracks.chapters.choices]]
key = "rival"
text = "说来比的——绕黑礁，跟当年一样再跑一趟。"
requires = []
reply = "她笑得露出了一口白牙：“就等你这句。”她把那条新漆的竞渡船让给我，自己跳上一条孩子的旧船，说这样才公平。孩子们挤在石阶上，有一个自告奋勇地喊开赛。出了港湾，我才发现这些年我的手一直记着那根索的分量，帆角收到哪里，不用想。绕黑礁的时候我们几乎并排，她还是抢在我里头掉了头，帆一甩就满了。回到石阶，她赢我半个船身，跟当年一模一样。孩子们哄地叫起来。她从船上站起来，冲我扬起下巴，笑得比孩子们还响。上了岸，她把孩子们凑给赢家的一把椰枣分了我一半：“这回输得像样多了。明年还来不来？”"
next = "done"
effects = [{ kind = "affinity", person = "shadia", value = 3 }, { kind = "relation", person = "shadia", relation = "rivals" }, { kind = "flag", flag = "c7_bond_shadia_landing_rival" }, { kind = "memory", memory = "mem-reunion_shadia", title = "旧对手的码头" }]

