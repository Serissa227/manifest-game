# 再来一趟（bond_shadia）——羁绊线，编辑标签 GL（莎迪娅 romance=any，主角纳吉玛为女）。
# 人物：莎迪娅（shadia，1540-08-21 生），马斯喀特的三角帆赛船手，赢了不走，非要把输家喊回来再比；
#       主角：纳吉玛（najma，1540-08-24 生），大领航家伊本·马吉德的曾外孙女，领航世家的船上学堂学生；沉静，执拗于精确，用诗记航路。
#       年龄：C1（1554 春）两人 13；A1（1556 春）两人 15；S（1556-12）两人 16；重逢（1562）两人 21—22。
# 情谊尺度 D：莎迪娅住马斯喀特，只在船上学堂靠港时与纳吉玛相见，交谈、赠礼加不了情谊，
#       每章选项自带 +15/+15/+15/+17/+17/+19，全部回应可到 98，漏一章仍能到 A。
# 结构：bond_shadia（request，academy）C1 → C2 → B1 → B2 → A1 → A2 → S；S 的选项与 default 都开 reunion_shadia（main，1562）。
# 羁绊阶梯：C2 keep_the_rope 给 C，B1 tell_her 补签 C；B2 stay_ashore 给 B，A1 swear_her_secret 补签 B；
#       A2 take_palm / hold_her_hand 给 A + 缝帆掌皮（sailmakers_palm）+ 回忆。每章都有不带 bond 的选项。
#       效果顺序：affinity 写在 bond 前面（内核按顺序在试算副本上执行，bond 检查的是加过情谊以后的值）。
# 心动：A1 come_till_it_sets +6 → A2 hold_her_hand +6（要 ≥ 6）→ S heart +12（要 ≥ 12）→ 重逢 love 要 ≥ 24。
#       决定表写 S +10，算下来只到 22、永远够不着 24，这里按简报改为 +12。学院期只到 heart 与 crush，S 不写 dating。
# 依据（史实）：1552 年皮里·雷斯率奥斯曼舰队攻下并劫掠马斯喀特（莎迪娅家的房子因此烧掉；当地人把奥斯曼人叫“鲁姆人”）；
#       1554 年 8 月塞伊迪·阿里·雷斯的奥斯曼舰队在马斯喀特外海与葡萄牙舰队交战后被风暴打散——纳吉玛家的船在阿曼湾救起一条奥斯曼小艇即在此时，
#       所以 B1（1554 秋冬）说“今年八月”，不照简报写“前年夏天”。
#       阿拉伯领航人以昴宿的晨出、昏没定航海的节令：春末傍晚昴宿在西边沉入日光，此后西南季风起，印度西岸诸港“关海”；初夏昴宿又在黎明前从东方升起。
#       领航人量星高用“指”（isba‘）。肉眼看昴宿，有人数六颗，有人数七颗。
# 原创：莎迪娅一家、补了三块的帆、断索、烧焦的门框与柠檬树、没升起来的红旗、港外的礁与那个炭笔小圈、掌皮、只写了港口的赛约。
# 秘密：莎迪娅独自出海时撞过港外一片礁，一直没敢写进父亲的航簿；B2 露出端倪，A2 她把礁画在纳吉玛的图上。永远不进见闻（本文件的章都没有 stage，不写 news）。
# 老人星归 bond_kabir，本文件 A1 看昴宿西沉。卡比尔的事归 pair_kabir_shadia，重逢只提一封古吉拉特领航员的竞航书；
#       variants with_kabir 读 c7_pair_kabir_shadia_together，只换这一句，不展开两人的事。
# 缺省走向：每章 default 照走下一章（缺省时发生的事写在各 default 上方的注释里）；S 不选 → 开重逢并记 c7_bond_shadia_parted；
#       重逢错过 → 她托一条阿曼船捎来一张航图与一封信（来信），记 _missed。
# 共享旗标：S 的 promise 与 heart 设 c7_pair_kabir_shadia_taken（配角线 pair_kabir_shadia 据此改走“并肩的朋友”）；重逢读 c7_pair_kabir_shadia_together。
#       本文件自有：c7_bond_shadia_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed。
# 口头禅：莎迪娅的（cast 里的 catchphrase）只在 C1 完整说一次；纳吉玛量星高的那句只在 A2 完整说一次；别处（S 的“敢不敢？”、重逢来信）只作呼应。
# 地点（2026-11-01 close-places）：学院章正文都写学堂的船靠马斯喀特，养成期纳吉玛只在扎比德，七章都去掉 at（不限地点），正文不动；
#   重逢 1562 仍在马斯喀特。配角线 pair_kabir_shadia 学院期的两章 witness 仍挂 muscat，只作见闻。

[[tracks]]
key = "bond_shadia"
name = "莎迪娅：再来一趟"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["shadia"]

# C1：1554 春，马斯喀特港湾。港里的孩子拉学堂的学生赛三角帆小船；补了三块的帆。
[[tracks.chapters]]
key = "c1"
title = "再来一趟"
text = "船上学堂在马斯喀特停了三天。第二天下午，港湾里的孩子划着小船来挑我们：一人一条三角帆小船，从停船的石阶跑到港口那块黑礁，绕过来再跑回去。学堂的人一个接一个上去，一个接一个输回来，赢他们的都是同一个晒得黝黑的女孩，岸上的孩子扯着嗓子喊她莎迪娅。轮到我，我先看她的帆。帆上补了三块，一块靛蓝，一块土黄，一块是褪了色的红头巾，风一吹，三块补丁鼓得各不一样。绕黑礁的时候她抢在我里头掉了头，帆一甩就吃满了风，我还贴着礁石找角度。到了石阶，她赢我半个船身。赢了也不靠岸，她把船横过来，咧着嘴冲我笑：“领航家的学生，就这点本事？”她拿桨拍了拍我的船头。“再来一趟，敢不敢？”"
window = [[1554, 1, 1], [1554, 4, 30]]
cast = ["shadia"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_shipboard_zabid" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那天船上学堂的人都输给了她，她一个人在港湾里来回跑了三趟。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "race_again"
text = "掉转船头，跟她再跑一趟。"
requires = []
reply = "第二趟我输了一整个船身，比头一趟还多。莎迪娅笑得往后一仰，差点翻进水里，一把抓住船舷才坐稳：“越比越远！你是往回划的吧？”上了岸，她从腰上的布袋里抓出一把椰枣，分了我一半，自己嚼着说：“明天还来。你们的船走以前，我天天在这儿。”"
next = "c2"
effects = [{ kind = "affinity", person = "shadia", value = 15 }]

[[tracks.chapters.choices]]
key = "ask_the_turn"
text = "先问她：刚才绕黑礁那一下，是怎么抢到风的？"
requires = []
reply = "她愣住了，桨停在半空。过了一会儿，她把船拖上沙滩，蹲下来拿手指在湿沙上画：礁石，风，她的船，船头先往下风让一点。“不能硬掰，得让它自己转过去。”画完她拍掉手上的沙，斜着眼看我：“你是头一个问我怎么赢的输家。别的输家只会骂礁石。”"
next = "c2"
effects = [{ kind = "affinity", person = "shadia", value = 15 }, { kind = "skill", skill = "rigging", value = 8 }]

# C2：1554 夏，马斯喀特港外。她让我掌舵，帆索却不替我拉；一根磨破了的帆索。
[[tracks.chapters]]
key = "c2"
title = "她的帆，你的手"
text = "学堂的船再靠马斯喀特，莎迪娅已经蹲在码头上等着了。她把那条补了三块的小船让给我掌舵，自己往船头一坐：“帆索你自己拉，我只管看。”出了港湾，风一下子硬起来。我把帆角收得太紧，船身猛地一歪，船舷吃进一口水。“松！”她在船头喊。我一松就松过了头，帆哗啦啦地抖，船停在浪里打转。她抱着膝盖，一动不动，就那么看着。我收一点，再收一点，收到帆不抖了，船也正了，手里那根索忽然变得很轻。她这才笑：“就是这儿。记住你手上是什么分量。”上了岸，她从船底摸出一截磨破的帆索扔给我，断口毛毛的。“我头一回也收得这么紧，紧到索断了，是我爹划船把我拖回来的。”"
window = [[1554, 5, 1], [1554, 8, 31]]
cast = ["shadia"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 缺省：那根断索莎迪娅扔进了海里，说留着不吉利。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "keep_the_rope"
text = "收下这截断索，跟她说下回靠港还要上她的船。"
requires = [{ kind = "affinity", person = "shadia", ge = 5 }]
hint = "她还当你是学堂里来看热闹的。断索她转手就会扔进海里，她的船你也上不去第二回。"
reply = "莎迪娅挑起眉毛：“下回你拉帆，我掌舵。看你会不会把我扔进海里。”我把那截断索在腰上绕了两圈，打了个结。她瞧了一眼，说结打得倒好看，可惜不顶用，伸手扯开，替我重打了一个水手结，又使劲拽了两下：“这样才掉不了。”"
next = "b1"
effects = [{ kind = "affinity", person = "shadia", value = 15 }, { kind = "bond", person = "shadia", level = "C" }]

[[tracks.chapters.choices]]
key = "thank_and_go"
text = "谢过她，回船上把刚才那个帆角记进本子。"
requires = []
reply = "我在本子上记了一页：风从哪边来，帆角收到哪里，手上是多重的分量。为了好记，我把它编成了两行押韵的句子。莎迪娅扒着我们的船舷探进头来，磕磕绊绊地念了一遍：“你们领航家的人，连输了都要写诗？”我说这不是诗，是记性。她把本子推回来：“念出来像。”"
next = "b1"
effects = [{ kind = "affinity", person = "shadia", value = 15 }]

# B1：1554 秋冬，鱼市后头的沙地。她家原来的房子，只剩一截烧焦的门框。
[[tracks.chapters]]
key = "b1"
title = "烧过的门框"
text = "这一回莎迪娅没提赛船。她领我穿过鱼市后头的巷子，走到一片沙地上。沙子里立着一截门框，黑的，顶上烧得只剩一个尖。“我家。”她说，“门原来在这儿，院子里有棵柠檬树。”两年前鲁姆人的船进了港，炮先打在码头上，她家是头一批烧起来的。她跟着母亲在港口的礁石后头蹲了一夜，看着火从这条巷子烧到那条巷子。她伸手掰下门框上一块焦木，在指头里捻成了粉。“鲁姆人。”她把粉吹掉，“我看见他们的帆就想吐。”我站在门框旁边，想起今年八月，我家的船在阿曼湾救起过一条鲁姆人的小艇。艇上的人渴得说不出话，我端水给其中一个，他的手抖得厉害，水洒了一半。"
window = [[1554, 9, 1], [1554, 12, 31]]
cast = ["shadia"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那截门框莎迪娅后来拔了，扔进海里，说留着看着心烦。
[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "tell_her"
text = "告诉她，我家的船救过鲁姆人，然后等她骂完。"
requires = [{ kind = "affinity", person = "shadia", ge = 5 }]
hint = "她还没信你到能听这种话的地步。你一开口，她只会转身就走。"
reply = "她骂了很久。骂鲁姆人，骂我家的船，骂那天阿曼湾怎么不起一阵风把小艇掀翻，骂到嗓子哑了，一脚踢在门框上，又疼得抱着脚跳。然后她蹲下来，背对着我问：“那条艇上的人，后来呢？”我说送到了霍尔木兹，放他们上了岸。她盯着那截门框看了半天：“那他们比我们运气好。”"
next = "b2"
effects = [{ kind = "affinity", person = "shadia", value = 15 }, { kind = "bond", person = "shadia", level = "C" }]

[[tracks.chapters.choices]]
key = "scrape_the_char"
text = "什么也不说，帮她把门框上的焦木刮干净。"
requires = []
reply = "我跟鱼市的摊主借了一把剖鱼刀，她拣了一片蚌壳，一人一边刮。焦木一层层往下掉，黑灰落了我们一身。刮到底下，露出来的木头是浅黄的，一圈一圈的纹路还在。莎迪娅把手掌贴上去，贴了很久。“它还活着。”说完她低下头去刮另一边，刮得比刚才更用力。"
next = "b2"
effects = [{ kind = "affinity", person = "shadia", value = 15 }]

# B2：1555 年，马斯喀特的大赛。风硬浪高，她第一个收帆不比；桅杆下一面没升起来的红旗。
[[tracks.chapters]]
key = "b2"
title = "没开的赛"
text = "这一年马斯喀特的人办大赛，码头那根旗杆底下备了一面红旗，旗一升就开赛。那天风太硬，浪一层一层翻过港外的礁石，白沫溅得老高。别的船都在拉帆，莎迪娅第一个把帆收了，把船往沙滩上拖：“我不比。”几个小子在旁边起哄：“赢了一年的人，今天怕输了？”“鲁姆人来的那晚她也是躲着的！”她的脸一下子涨红了，嘴张了张，一个字也没回，低头去解船上的索。我站在她旁边，看见她解索的手停了一下，眼睛越过那些人，盯着港外东边一片翻白的浪。那里什么都看不见，只有浪。她看那片浪的样子，像在看一个欠了她债不还的人。"
window = [[1555, 1, 1], [1555, 12, 31]]
cast = ["shadia"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那天的赛照常开了，翻了两条船；莎迪娅在岸上一个人坐到天黑。
[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "stay_ashore"
text = "留在岸上帮她收船，跟起哄的人说：我也不比。"
requires = [{ kind = "affinity", person = "shadia", ge = 33 }, { kind = "bond", person = "shadia", level = "C" }]
hint = "她不想让人看出她为什么不比。你这时候站过去，她只会更难堪。"
reply = "那几个小子笑得更响了，说领航家的人也是胆小鬼。我没理他们，帮莎迪娅把帆卷好，把船拖到潮水够不着的地方。那天出港的船在东边的礁上翻了两条，人都捞了回来，有一个断了胳膊。天黑以后莎迪娅来找我，往我怀里塞了一卷红布：“这面旗，今天没升起来，归你了。”我问她从哪儿拿的。“偷的。”"
next = "a1"
effects = [{ kind = "affinity", person = "shadia", value = 17 }, { kind = "bond", person = "shadia", level = "B" }]

[[tracks.chapters.choices]]
key = "ask_the_reef"
text = "悄悄问她：你看的是港外哪一片礁？"
requires = []
reply = "她猛地转过头来，像被人踩了脚。她看了我很久，久到起哄的人都散去拉帆了，才压低声音说：“你看出来了。”我等她往下说。她把解下来的索一圈一圈盘好，盘得整整齐齐，放进船底。“以后告诉你。现在别问。”"
next = "a1"
effects = [{ kind = "affinity", person = "shadia", value = 17 }]

# A1：1556 年春末，马斯喀特的沙滩。傍晚西边的昴宿一天比一天低，快要沉进日光里。
[[tracks.chapters]]
key = "a1"
title = "昴宿西沉"
text = "这一场她赢，我只输了一个船头。我们把两条船拖上沙滩，背靠着船舷坐下。太阳刚落，西边天上还亮着，昴宿挂在那片亮光里，小小的一团，比十天前又低了一截。我在本子上记它离海面的高度，莎迪娅凑过来看：“又记？”“再过几晚，它就沉进日光里，看不见了。”她“嗯”了一声，把手垫在脑后躺下去：“我奶奶说，昴宿一沉，海就要关门。”往后西南风一起，印度那边的港口都封了，船只能等。她没问下一场什么时候比，这是头一回。过了好一会儿，她看着那团星说：“它沉下去以前，你还会来吗？”"
window = [[1556, 4, 1], [1556, 5, 31]]
cast = ["shadia"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 4, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

# 缺省：那一年昴宿沉下去的那一晚，莎迪娅一个人在沙滩上看。
[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "come_till_it_sets"
text = "说会。往后每个傍晚都来陪她看，看到它沉下去那一晚。"
requires = [{ kind = "affinity", person = "shadia", ge = 15 }, { kind = "romance_open", romance_open = "shadia" }]
hint = "她只是随口一问。你们还没熟到能许下每个傍晚的约。"
reply = "学堂的船那几天恰好不走。我每个傍晚都去，她每个傍晚都在，靠着同一条船。昴宿一晚比一晚低，到最后一晚，只剩贴着海面的一点光，闪了两下，就没了。她没说话，我也没说。她从布袋里摸出一颗椰枣，放进我手心，手指在我掌心停了一下，才拿开。"
next = "a2"
effects = [{ kind = "affinity", person = "shadia", value = 17 }, { kind = "heart", person = "shadia", value = 6 }]

[[tracks.chapters.choices]]
key = "swear_her_secret"
text = "说会。再告诉她：港外那片礁的事，我等她自己开口。"
requires = [{ kind = "affinity", person = "shadia", ge = 33 }, { kind = "bond", person = "shadia", level = "C" }]
hint = "那片礁是她碰都不让人碰的事。你们还没到能提起它的那一步。"
