# A2：1556 年夏秋，马斯喀特码头。她送我缝帆用的掌皮，又在我的航图上画了那片礁。
[[tracks.chapters]]
key = "a2"
title = "缝帆掌皮"
text = "夏天学堂的船再进马斯喀特时，昴宿已经在天亮前从东边升起来了。莎迪娅在码头上等我，一见面就往我手里塞了一样东西：她缝帆用的掌皮。皮带磨得发亮，掌心那块铁片上全是针顶出来的小坑，密密麻麻。“你的帆以后破了，自己补。”说完她抽走我夹在胳膊底下的航图，摊在一只倒扣的鱼筐上，拿炭条在港口东边画了个小圈：“就这儿，差不多。”“差一指，就差一百里。”我说。她瞪我一眼，炭条往左挪了一点，重画一个，压得纸都起了毛。“这回不差了。那年我一个人出海，船底就是在这儿撞开的。我爹的航簿上没有它。”她把炭条往筐上一丢，“你的图上，有了。”"
window = [[1556, 6, 1], [1556, 11, 30]]
cast = ["shadia"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

