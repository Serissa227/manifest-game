key = "play_match"
text = "先下场跟他踢一场，踢完坐在树下谈这些年。"
reply = "我伸手要鞠，他把鞠递给我。我踢了十几脚，歪了三回，三回他都接住了，起脚时轻轻喊一声“呀”。踢完他看着我的脚，摇头：“还、还是不平。”我们坐到树底下。他讲京都，讲嫡出的兄长们后来也肯让他上正中的鞠庭了，讲拿免许那天他一个人在鞠庭站到天黑；我讲下田的船，讲九州的雨，讲丰后水道里的急流。讲到后来，他站起来，对着那棵树念了一首长歌，从头念到尾，一回也没卡住。念完他坐回来，说这首是写给中村的，写这里的河、这里的白沙，还有一个总把鞠踢歪的人。“抄、抄一份给你，你带上船。”"
next = "done"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 5 }, { kind = "relation", person = "kikuchiyo", relation = "confidants" }, { kind = "flag", flag = "c7_bond_kikuchiyo_landing_friend" }, { kind = "memory", memory = "mem-bond_kikuchiyo-reunion", title = "树下的师范" }]

[[tracks.chapters.choices]]
key = "let_him_speak"
text = "什么也不说，站在树下等他先开口。"
requires = [{ kind = "flag", flag = "c7_bond_kikuchiyo_romance" }, { kind = "heart", person = "kikuchiyo", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "kikuchiyo", ge = 18 }, { kind = "romance_open", romance_open = "kikuchiyo" }, { kind = "flag", flag = "c7_mio_heart_2", value = false }]
hint = "要当年把半页纸给过他、心动 24，而且心意只许给了他一个人。"
reply = "我站在树下等。他吸了一口气，又吸了一口，然后说了。说的是那年鞠庭里的雪，说那两个半页，说他在京都七年，每回起脚以前，先想一想土佐在哪个方向。他说得很慢，一个字也没有结巴。说完了，他自己先愣住，低头看着脚下的白沙：“说、说出来了。”他从怀里取出抄簿，抽出最前面那两个半页，翻到背面，向我借了笔，在背面写了一个日子，是今天。写完他把纸递过来，我没接纸，握住了他的手。那天中村下着小雨，白沙上一个脚印也没有。"
next = "done"
