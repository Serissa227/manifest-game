# C1：1554 年春，女房局后头的小院。墙那边飞来的鞠，踢歪进了山茶丛。
[[tracks.chapters]]
key = "c1"
title = "墙外的鞠"
text = "进宫的第三天，我在女房局后头的小院里认路。墙那边有人喊了一声“呀”，一只白鞠越过墙头，在石板上弹了两下，停在我的脚边。鹿皮缝的，腰上箍着一道皮子，磨得起了毛。墙头冒出一张脸，是个比我还小些的少年，额头上全是汗。他张了张嘴，没出声；又张了张，还是没出声。“你的？”我问。他点头，点得太急，差点从墙头滑下去。“那接着！”我抬脚就踢。鞠擦着鞋尖歪出去，一头钻进了墙根的山茶丛。墙头的脸不见了。过了一会儿，他从院门那边绕过来，跑得直喘，头一件事是蹲下来看我的脚踝：“扭、扭到没有？脚尖朝外踢，十个有八个扭。”我说没有。他这才转过身，拿袖子裹住手，去拨山茶的枝子。"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "cheerful"
news = "京都内里女房局的后院，飞鸟井家那边飞过墙来一只鞠，新进宫的姬君一脚踢进了山茶丛，那家的少年钻进去找了半天。"
when = [{ kind = "flag", flag = "family_access_kyoto_court" }, { kind = "date", from = [1554, 3, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
