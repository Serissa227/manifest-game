# A1：1555 年七夕。水盆边一片没挂上竹枝的梶叶，无名的歌，起笔处一个停顿。
[[tracks.chapters]]
key = "a1"
title = "梶叶上的歌"
text = "七夕的晚上，宫里在院中摆了水盆，盛满了水映星，又采来梶叶，让人在叶背上写歌。女房们写了一片又一片，系在竹枝上。有人塞给鞠千代一片：“飞鸟井家的，不来一首？”他双手接了，攥着笔站了半天：“我、我写不好这个。”人散了以后，我回去收水盆，看见盆沿上搁着一片梶叶，没系上竹枝。叶背一首歌，没有署名，写的是隔着一道墙的两颗星。字写得工整，可每一句起笔的地方，墨都比别处浓一点，笔尖在那里停过一下，他每回开口以前，也要先吸一口气。远处有人在收竹枝，喊我回去。"
window = [[1555, 8, 4], [1555, 10, 3]]
at = "kyoto"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "tender"
news = "京都宫里过七夕，水盆边落下一片没系上竹枝的梶叶，叶背写着一首没署名的歌，女房们猜了一晚上是谁的手笔。"
