# B1：1554 年秋，内里的鞠会。上臈笑他是“飞鸟井家的哑巴”，我要跟他同队。物件：他那只缀着紫穗的鞠。
[[tracks.chapters]]
key = "b1"
title = "同一队"
text = "秋天的鞠会设在内里的鞠庭，四角的樱、柳、枫都换了颜色，只有松还青着。分队的时候，一位上臈拿扇子掩着嘴笑：“飞鸟井家的哑巴也要上场？鞠场上可是要出声的。”几个女房跟着笑。鞠千代站在场边，手里托着他那只鞠，腰革上缀着一小绺紫穗，他低着头。我走过去：“我跟他一队。”上臈的扇子停住了：“一条家的姬君，鞠会上谁跟谁同队，是有规矩的。你倒说说，凭的是哪一条？”满庭的人都等着我开口。鞠千代走过来，把鞠放到我手里，蹲下身，用两根手指把我站偏了的右脚尖拨正，对准了场心。"
