reply = "他把鞠找出来递给我。我退后三步，一脚踢出去，这回鞠飞得又高又歪，越过墙头落到墙那边去了。墙那边一个老女官骂起来：“哪个不懂规矩的！”他捂着嘴，肩膀一抖一抖，笑完了才蹲下来比划给我看：“脚背要平，托着一碗水那样。脚背一歪，碗就翻了，鞠就往墙那边去，墙那边是典侍家的院子，典侍家的老女官最会骂人。”他说得结结巴巴，比划的手一点不抖。"
