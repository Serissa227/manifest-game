# 重逢：1563 年，土佐中村一条家的宴席（外港下田）。拿了免许的师范先拾净庭里的石子；这回他先开口。
# variants：shared（许过两份以上心意的局：他知道了，记在抄簿里，不说；“这回我先”说不出来了）。
[[tracks.chapters]]
key = "reunion"
title = "树下的师范"
text = "这一年，一条家在中村的馆里摆宴，京都下来的公家带了一位鞠道师范，说是飞鸟井家的人，刚拿到免许不久。我从下田坐船溯四万十川上去，赶到时宴已经开了。庭里铺着白沙，师范站在场心行礼。行完礼，他弯下腰，把沙里的石子一颗一颗拾起来，拾进袖子里，拾了小半个时辰，满座的人都等着。拾完了，他直起身，朝我这边看过来。是鞠千代。他高了，肩也宽了，跟上首的公家讲起中村这片庭子的朝向、白沙该铺几寸、四角该补种哪几棵树，一口气讲了一大篇，一个磕巴都不打；转向我，那句话却断了两回：“澪、澪姬。要、要不要再接一次？”散了宴，他在庭角的树底下等我，开口以前先吸了一口气：“当、当年那个鞠庭，是你先说的话。今天……”树底下那块平石头，他事先擦过了。"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "shimoda_tosa"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "cheerful"
news = "土佐中村一条家的宴上，京都来的鞠道师范没急着踢鞠，先弯腰把庭里的石子一颗颗拾干净，才请主家的姬君下场。"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }]

