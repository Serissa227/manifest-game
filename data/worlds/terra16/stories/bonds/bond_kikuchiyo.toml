next = "done"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 5 }, { kind = "bond", person = "kikuchiyo", level = "S" }, { kind = "relation", person = "kikuchiyo", relation = "friends" }, { kind = "flag", flag = "c7_bond_kikuchiyo_promise" }, { kind = "flag", flag = "c7_mio_heart_1" }, { kind = "memory", memory = "mem-bond_kikuchiyo-s", title = "先开口的人" }, { kind = "start_track", track = "reunion_kikuchiyo" }]

