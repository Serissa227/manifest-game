# B2：1555 年春，女房局当值。女官的日记缺了二十多年；两人把一张纸裁成两半，记那场鞠会。物件：两个半页。
[[tracks.chapters]]
key = "b2"
title = "不存在的那一页"
text = "开春以后，轮到我在女房局当值，管笔墨和抄写。鞠千代来送鞠会的名册，在廊下站了半天才进门。他望着架上那一排《御汤殿上日记》，小声说：“这、这里头，缺了二十多年。永正到大永，整段没有。那些年宫里办过几回鞠会，谁赢了，谁起脚喊的第一声，都没人知道了。”他从怀里摸出一张空纸，折痕压得平平整整：“去年秋天那一场，我、我想记下来。”正本是女官们轮着写的，我们谁也不敢往里添一个字。我把纸对折，沿着折痕裁成两半，一半推给他，一半留给自己：“一人写半页，各自留着。”他接过那半张，先拿指头摸了摸裁口。"
