# C2：1554 年夏，歌会。他在我身后解了古语，说完就跑；我追到廊下，故意猜错，让他忍不住纠正（COPY-STYLE J7 的改写）。口头禅原句在此。
[[tracks.chapters]]
key = "c2"
title = "说完就跑"
text = "六月的歌会上，先生拈出古歌里的一个词，问满席的人怎么解。大家你看我、我看你。我身后有人小声说了一串，是鞠千代，说得又快又轻，连前后几首都背了出来，像在念给自己听。我回过头，他已经起身往门外走了。我追到廊下：“你再讲一遍，我没听全。”他站住了：“那、那个词，前头还有一首……”廊那头走过来两个女房，他的话就断了。我等她们拐过弯，自己先猜了一个，猜得离谱。他皱了皱眉。我又猜一个，比头一个还离谱。他听不下去，压着嗓子一口气纠正下来，哪一卷、谁作的、前一首写什么、后一首接什么，连判者当年的判词都背了出来，说到一半才想起自己在跟人说话，又卡住了。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "kyoto"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "tense"
news = "京都宫里夏天的歌会，满席的人被一句古语难住；后来有人说是飞鸟井家那个话少的少年解开的，可他本人早跑没影了。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

