# speak_first：许过两份以上心意的局。当年那一点进步退回去了，要他说那句话，又得澪先开口（手册第六节）。
[[tracks.chapters.choices]]
key = "speak_first"
text = "这回还是我先开口。"
requires = [{ kind = "flag", flag = "c7_bond_kikuchiyo_romance" }, { kind = "heart", person = "kikuchiyo", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "kikuchiyo", ge = 18 }, { kind = "romance_open", romance_open = "kikuchiyo" }, { kind = "flag", flag = "c7_mio_heart_2" }]
hint = "要当年把半页纸给过他、心动 24；心意若只许了他一个，就等他先说。"
reply = "我先开口，说那年鞠庭里的雪，说那两个半页，说我这些年在海上，有几回想起京都，想起的是墙那边飞过来的那只鞠。他听着，听到一半，翻开抄簿，指着那个“晴”字底下的空白：“那、那天，我听说了。我没、没写。”“你可以写。”“写、写错的事，我不写。”他把抄簿合上，过了一会儿又打开，拿我的笔在那个日子旁边添了一行小字，写的什么我没看清，他也没给我看。然后他伸手过来，握住我的手，握得很紧。庭里有人在收白沙上的席子。"
