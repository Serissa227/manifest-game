# C7 重写（2026-10-12，Claude Opus）；C21b 重写（2026-11-12，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 走向：冷→热（起初隔墙递鞠，被打动，到在人前念完一首长歌）。日本线“起初冷淡，被澪打动，敞开心扉”只留给他这一次（手册 4.2 第 12 条）。
# 标签：GB（羁绊线，可恋爱；由主角推进）。主角：一条澪（mio，1540-06-21，土佐一条家的女儿，学院在京都内里）。
# 人物：鞠千代 kikuchiyo（1541-04-10，飞鸟井家的庶子，蹴鞠的神童；romance.with = [f]，对澪开放）。
#   声音（手册第八节）：结巴；一谈鞠或古歌就滔滔不绝，句子极长；看别人出错忍不住直说。耳朵红是他一个人的毛病，每章至多一次。
#   各章年龄：1554 年澪 13—14、鞠千代 12—13；A1（1555-08-04）澪 15、鞠千代 14；A2（1555-12..1556-02）澪 15、鞠千代 14；
#   S（1556-12）澪 16、鞠千代 15——心动选项只是交换那天各写的半页纸，不告白、不牵手；重逢 1563 年两人都已成年。
# 依据：
#   史实——飞鸟井家是蹴鞠与和歌的师范家；鞠是鹿皮缝的，腰上有一道腰革；鞠庭四角种松、樱、柳、枫（“懸”的四本树）；
#         蹴鞠起脚时的三声“呀”“阿利”“噢”；七夕宫中在梶叶上写歌、以水盆映星；《御汤殿上日记》1500—1526 年整段缺失。
#   原创——鞠千代与澪的全部情节：墙外飞来的鞠、故意猜错的古语、上臈的嘲笑与抄经、裁成两半的纸、水盆边的梶叶、雪夜的长歌与布鞠、
#         腊月鞠庭的半页纸、中村宴上拾石子的师范。
#   待核——1563 年中村一条家宴请飞鸟井家师范一事无确证，正文只写“京都下来的公家带了一位鞠道师范”。
# 秘密：会背整部《古今集》，却怕在人前念长歌。C2 由澪发现，A2 他第一次在人前念完。秘密不进任何见闻。
# 口头禅“再、再来一次。这回我只看鞠。”原句只在 C2 用一次。
# 关系会退（C21b）：c2 credit_him 改成情谊 -2（当众被所有人回头看，正是他最怕的），他躲着澪，到 b1 才肯走过来。
# 信物（手册第八节、裁决第 2 条）：扇子换成 b2 那天两人各写的半页纸。S 的心意是澪把自己那半页给他；重逢时他在背面写一个新日子。
# 心意（C21b，数值见 docs/BALANCE.md）：心动来源 A1 reply_leaf +6、A2 say_it_was_good +6、课后同行。
#   heart（头一份：心动 ≥ 12，带 bond S）/ heart_second（已许一份：心动 ≥ 18、口才 eloquence ≥ 5）/
#   heart_third（已许两份及以上：心动 ≥ 26、口才 ≥ 7、b2 写过半页 c7_bond_kikuchiyo_halfpage）。
#   瞒不住（手册第六节）：许过两份以上的局，重逢里他“这回我先开口”说不出来了，let_him_speak 锁上，换成 speak_first（澪先开口）。
# 缺省走向：玩家不在场时故事照走、没有收获；S 缺省 → 设 c7_bond_kikuchiyo_parted 并开启重逢；重逢缺省 → 鞠千代的一封信，设 c7_bond_kikuchiyo_missed。
# 落点：知己 confidants（_landing_friend，永远可选）、恋人 lovers（_landing_love；要 c7_bond_kikuchiyo_romance、心动 ≥ 24、双方满 18）。
# 旗标：c7_bond_kikuchiyo_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed / _halfpage；共用 c7_mio_heart_1 / _2 / _3。
