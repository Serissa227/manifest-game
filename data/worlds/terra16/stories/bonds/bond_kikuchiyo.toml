[[tracks.chapters.choices]]
key = "ask_him"
text = "拿着梶叶去问他：这是谁写的？"
reply = "第二天我在鞠庭边上找到他，把梶叶托在掌心递过去。他看了一眼，眼睛就挪开了，盯着地上一片落叶：“不、不知道。”“那我替写歌的人收着。”他点头。过了一会儿又说：“第、第三句的‘隔’字，写歌的人大概写错了，该用另一个，那个字的意思是隔着水，不是隔着墙。”说完他又补了一句，说那片梶叶也采错了，梶叶要背面朝上写，写在正面墨吃不进去，所以第四句洇了。"
next = "a2"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }]

[[tracks.chapters.choices]]
key = "reply_leaf"
text = "在另一片梶叶上回一首，也不署名，放回水盆边。"
requires = [{ kind = "age", le = 17 }, { kind = "age", person = "kikuchiyo", le = 17 }, { kind = "romance_open", romance_open = "kikuchiyo" }]
hint = "这时候回他一首，只怕他再也不敢往水盆边放叶子。"
reply = "我借着星光写了一首，也写墙，写墙这边有人等着鞠飞过来。写完把叶子搁回盆沿，压上一颗小石子。第二天一早，那片叶子不见了，石子还在。那天下午他在鞠庭练鞠，见了我，脸红到了耳根。那一下午他踢了上百脚，脚背平得托得住一碗水。"
next = "a2"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "heart", person = "kikuchiyo", value = 6 }]

# A2：1555 年冬到 1556 年初，雪夜的小歌席。他第一次在人前念完长歌，先看我、再看先生。物件与赠礼：布鞠（cloth_ball）。
[[tracks.chapters]]
key = "a2"
title = "雪停以前"
text = "雪下了一整天。先生在偏殿开了个小歌席，只请了七八个人，炭盆烧得正旺。轮到鞠千代，他站起来，手里的扇子攥得发白，开口第一句就卡住了。上首的女房咳了一声。他闭了一下眼睛，从头念起。念的是一首长歌，一句接着一句，中间他喘了两口气，没有停。念完最后一句，窗外的雪落在竹叶上，满席的人才回过神来。他第一个转头看的是我，然后才转向先生，行了一礼。散席时雪还没停。他追到廊下，从袖子里掏出一只布缝的小鞠，针脚又细又密：“我、我自己缝的。练、练脚用。里头塞的是荞麦壳，一两二钱，比鹿皮的轻四成，踢歪了也不、不疼。”他托着那只布鞠，雪落在上面，化了一点。"
window = [[1555, 12, 1], [1556, 2, 28]]
at = "kyoto"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "tender"
news = "京都宫里下雪那天，偏殿开了个小歌席，飞鸟井家那个见人就躲的少年念了一首长得出奇的歌，散了席还追到廊下去找人。"
when = [{ kind = "date", from = [1555, 12, 1], to = [1556, 2, 28] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "catch_ball"
text = "接住布鞠，当着他的面颠三下。"
requires = [{ kind = "affinity", person = "kikuchiyo", ge = 80 }, { kind = "bond", person = "kikuchiyo", level = "B" }]
hint = "情谊 80、羁绊 B。布鞠捧在他手里，你一伸手，他又往回缩了缩。"
reply = "一下，两下，第三下颠歪了，鞠往雪里掉。他一伸脚，鞋尖一挑就接住了，递回我手里：“太、太轻了。我再缝一只给你，里头多塞些。”“就要这只。”他看了看鞠，点了点头。雪落在他头上，他也不拍，两只耳朵红在一片白里，隔着半条廊都看得见。"
next = "s"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 4 }, { kind = "bond", person = "kikuchiyo", level = "A" }, { kind = "item", item = "cloth_ball", qty = 1 }, { kind = "memory", memory = "mem-bond_kikuchiyo-a2", title = "雪停以前" }]

[[tracks.chapters.choices]]
key = "say_it_was_good"
text = "告诉他：你念完先看的是我，我看见了。"
requires = [{ kind = "affinity", person = "kikuchiyo", ge = 80 }, { kind = "bond", person = "kikuchiyo", level = "B" }, { kind = "heart", person = "kikuchiyo", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "kikuchiyo", le = 17 }, { kind = "romance_open", romance_open = "kikuchiyo" }]
hint = "情谊 80、羁绊 B、心动 6。这时候说这种话，他会躲到墙那边去。"
reply = "他愣在廊下：“你、你看见了？”“看见了。满席的人，你头一个看的是我。”他低下头，把布鞠放进我手里。他的手指碰到了我的手，冰凉的，没有缩回去，就那么搭着。廊外的雪落了又落，直到炭盆那边有人喊收拾，他才把手拿开，说了一句：“第、第九句我念快了。”"
next = "s"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "heart", person = "kikuchiyo", value = 6 }, { kind = "bond", person = "kikuchiyo", level = "A" }, { kind = "item", item = "cloth_ball", qty = 1 }, { kind = "memory", memory = "mem-bond_kikuchiyo-a2", title = "雪停以前" }]

[[tracks.chapters.choices]]
key = "ask_next"
text = "问他：下回歌会，还念不念？"
reply = "“念、念不念……”他望着廊外的雪，“要看有、有没有你在。”说完他自己吓了一跳，赶紧补一句：“在、在下面听的意思。”我说我当然在下面，难道还上去替你念不成。他把布鞠往袖子里一揣，转身就走，走得太急，在廊角滑了一跤，爬起来说廊板该打蜡了。"
next = "s"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 2 }]

# S：1556 年腊月，飞鸟井家的鞠庭。他留京争免许，我回土佐出海。他三次张嘴没出声，这回由我先开口。物件：那天的半页纸。
[[tracks.chapters]]
key = "s"
title = "先开口的人"
text = "腊月里，飞鸟井家的鞠庭扫出一片空地，雪堆在四角的树底下。鞠千代一个人在场心颠鞠，腰革上那绺紫穗跟着一起一落。开春他要去争鞠道的免许；我过了年就回土佐，船已经在下田等着。我在场边站着，他一直没发现，直到鞠落下来时一眼看见我，脚下一偏，鞠滚到了我的脚边，跟那年春天一样。他走过来，没弯腰去捡，张了一次嘴，又张了一次。第三次张嘴，还是没出声。我把鞠捡起来，拍掉上面的雪。这一回，我先开口。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "kyoto"
cast = ["kikuchiyo"]
speaker = "captain"
mood = "tender"
news = "腊月的京都，飞鸟井家的少年要留下来争鞠道的免许；土佐一条家的姬君过了年就回乡出海，临走前在他家鞠庭边站了好一会儿。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

