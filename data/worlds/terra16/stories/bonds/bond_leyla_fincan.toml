title = "芦笔与西亚克特"
text = "兵工厂的书记官闲得发慌，在库房门口摆了张矮桌，念一串木料出入的账，看学徒们谁记得又快又对。船匠们起哄，把莱拉也推了上来：“摊上的丫头写字快，叫她来！”她用西亚克特的写法，一个数缩成一个小钩，头一个写完，把芦笔往嘴里一咬，冲我扬下巴。我慢吞吞地写到最后一行。书记官两张纸一对：“七根橡木，你写成了七十。”“我写的是七！”“这一钩就是七十。”他不再理她，判我赢。赏的是一杯咖啡，正是莱拉家摊上的。她去端了来，往我面前一放，汤溅出来一半。那支芦笔还咬在她嘴里，咬得扁扁的。"
