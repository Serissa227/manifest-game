# S：1556 年 12 月，咖啡摊。开春我要上去亚历山大港的船；她推来一张收据，最后一行等我来写。
[[tracks.chapters]]
key = "s"
title = "收据的最后一行"
text = "年底兵工厂给学徒分船，我的名字写在一条去亚历山大港的商船底下，开春就走。消息传到咖啡摊，莱拉什么也没说，照旧给船匠们倒咖啡、记账。收摊的时候，她把一张收据推到我面前。抬头是我的名字，一笔没歪；金额那一栏写着“一杯”；底下一行一行列着日子，从那年春天订货单上的杯底圈算起，最后一行只起了个头，后面空着。“我留下，”她说，“替码头上那些小作坊写收据，写到谁也赖不掉。你走以前——”她把芦笔掉过头，笔杆朝我递过来，“这一行，你自己来。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "istanbul"
cast = ["leyla_fincan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_leyla_fincan" }, { kind = "flag", flag = "c7_bond_leyla_fincan_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "在最后一行写：每次靠港，先到她的摊子把账结清。"
requires = [{ kind = "bond", person = "leyla_fincan", level = "A" }]
hint = "笔递到你手边，你却落不下去：这一行要记一辈子，你们的交情还撑不起这一笔；或者同样的一笔，你早已记进了别人的账里。"
reply = "我写得很慢，她在旁边看着，一个字也没催。“每次靠港，先来结账。”写完我把纸转过去。莱拉从头念了一遍，又拿指甲在“先”字底下划了一道，像是怕我日后装作看不见。然后她把收据对折，压平，塞进围裙前襟的口袋，隔着布拍了两下。“这一张我替你收着。”她说，“船停在哪儿我管不着。哪天停回金角湾，你要是没先拐到这儿来——”她端起早凉了的咖啡，一口喝干，“就是赖账。赖我的账，金角湾还没人敢。”她母亲在摊子后头听见了，笑着摇摇头，往炭盆里又添了一块炭。"
next = "done"
effects = [{ kind = "bond", person = "leyla_fincan", level = "S" }, { kind = "relation", person = "leyla_fincan", relation = "friends" }, { kind = "memory", memory = "mem-bond_leyla_fincan-s", title = "收据的最后一行" }, { kind = "flag", flag = "c7_bond_leyla_fincan_promise" }, { kind = "flag", flag = "c7_tie_new_marietta_filo_leyla_fincan_taken" }, { kind = "start_track", track = "reunion_leyla_fincan" }]

[[tracks.chapters.choices]]
key = "heart"
text = "把最后一行留着不写，说等两个人都长大了，再回来填。"
requires = [{ kind = "bond", person = "leyla_fincan", level = "A" }, { kind = "heart", person = "leyla_fincan", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "leyla_fincan", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "leyla_fincan" }]
hint = "你想说“留着，等长大了回来填”，嘴张开又合上：心里那点意思还填不满这一行；要么，这句话已经许给了另一个人。"
reply = "我把芦笔还给她，说这一行先留着，等我们都长大了，我回来填。莱拉看着我，看了很久，久到炭盆里的火暗下去一截。她没问要等多久，也没问到时候填什么，只把芦笔在指间转了一圈。她把收据对折，再对折，折成小小一方，拉过我的手放进掌心，再把我的手指一根一根合上。她的指尖在我掌心里停了一下，才抽回去。我攥着那一小方纸，攥得指节发白。“那你得回来。”她说，“欠着的账，我记性好得很。”那天我走出去很远，回头看，她还站在摊子边上，围裙的带子被海风吹得飘起来。"
next = "done"
effects = [{ kind = "bond", person = "leyla_fincan", level = "S" }, { kind = "heart", person = "leyla_fincan", value = 12 }, { kind = "relation", person = "leyla_fincan", relation = "crush" }, { kind = "flag", flag = "c7_bond_leyla_fincan_romance" }, { kind = "memory", memory = "mem-bond_leyla_fincan-s", title = "收据的最后一行" }, { kind = "flag", flag = "c7_tie_new_marietta_filo_leyla_fincan_taken" }, { kind = "start_track", track = "reunion_leyla_fincan" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟她约好各记各的账，看谁先有一间自己的铺面。"
requires = []
reply = "“我先。”莱拉想都没想，“你在海上，连张桌子都没有。”我说船上的桌子也是桌子，书记的桌子钉在舱板上，浪再大也翻不了。她说钉死的桌子不算铺面，算船的。我们从铺面吵到门窗，从门窗吵到招牌该用什么字，一直吵到她母亲端着炭盆出来赶人：“要吵去码头上吵，我要收摊了。”嘴上赶人，手里却往我们俩的杯子里各添了半杯。莱拉抓起笔，在收据最后一行写了个“赌”字，把纸拍在我胸口：“拿着。输了的人，请一年的咖啡，一天都不能少。”"
next = "done"
effects = [{ kind = "affinity", person = "leyla_fincan", value = 2 }, { kind = "relation", person = "leyla_fincan", relation = "friends" }, { kind = "flag", flag = "c7_bond_leyla_fincan_own" }, { kind = "start_track", track = "reunion_leyla_fincan" }]

