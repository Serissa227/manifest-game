# C1：1554 春，兵工厂门口的咖啡摊。老船匠口述肋材尺寸，她写不过来，我替她翻船上的叫法。
[[tracks.chapters]]
key = "c1"
title = "杯底的口述"
text = "兵工厂午间收工，一个老船匠蹲到咖啡摊前，一口气往下报：“弯木十二根，龙骨肘两副，肋材从第三档起，每档收两指——”报得比博斯普鲁斯的急流还快。莱拉的芦笔追了三行，追不上了，把杯子往桌上一顿：“喝完再吵，字还没写清。”老船匠端起来喝了一口，接着报。她拿笔杆敲桌子：“弯木是什么木？龙骨还长胳膊肘？”我从小在船台底下捡刨花，听不得这个，张嘴就替她翻：“弯木是天生长弯的橡木，做船肋用的；龙骨肘是龙骨接艏柱的那一块。”莱拉瞪了我一眼，像嫌我插嘴。下一刻她把杯子推到我面前，订货单压在杯底下，纸上落了个褐色的圈。“你念，我写。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "istanbul"
cast = ["leyla_fincan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_golden_horn_yard" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "teach_terms"
text = "把船上的叫法一个个念给她，换她教我写这些字。"
requires = []
reply = "那一下午我念了十二个叫法：弯木、龙骨肘、肋材、艏柱、舷墙……她一个一个写成字，再按着我的手，教我写我的名字。我写出来的笔画东倒西歪，像被浪打过的桅杆，她笑得一抖，半杯咖啡泼在了订货单上。“这下好，”她拿袖子去擦，越擦越开，“杯底一个圈，又添一大块。”那张单子后来照样送进了木料场，两块褐印一直没洗掉。"
next = "c2"
effects = [{ kind = "affinity", person = "leyla_fincan", value = 3 }, { kind = "skill", skill = "calligraphy", value = 8 }]

[[tracks.chapters.choices]]
key = "slow_the_shipwright"
text = "拦住老船匠，请他把尺寸慢慢再报一遍。"
requires = []
reply = "老船匠把杯子一搁：“摊上的丫头写个字，也要人伺候？”骂归骂，第二遍报得一个数一个数，中间还停下来等她蘸墨。莱拉一个字一个字写完，吹干了递过去。等他背着手走远，她冲他的背影皱鼻子做了个鬼脸，转过头来，又冲我做了一个。"
next = "c2"
effects = [{ kind = "affinity", person = "leyla_fincan", value = 2 }]

# C2：1554 夏，卡瑟姆帕夏的码头。桶匠拿潦草的收据赖账，母亲说算了。
[[tracks.chapters]]
key = "c2"
title = "赖账的桶匠"
text = "卡瑟姆帕夏码头上的桶匠赊了莱拉家三个月的咖啡豆，到了结账的日子，捏着收据说上面写的是两袋，不是五袋。收据是莱拉写的，那一笔拖得太急，看成二也行，看成五也行；数字底下盖着她母亲的木戳，边都磨圆了。莱拉在摊子后头把收据攥成一团，又一点点展平，眼眶红了一圈：“我写的五，我自己知道。”她扯下围裙就要走。母亲拉住她的袖子，说三袋豆子，算了，跟码头上的人吵不起。莱拉把袖子一甩，回头看我：“你在船台上听惯了桶匠吹牛，陪不陪我去？”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "istanbul"
cast = ["leyla_fincan"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

