# 杯底的口述（bond_leyla_fincan）——羁绊线，编辑标签 GL（莱拉 romance=any：女主角时为 GL，男主角时为 BG）。
# 人物：莱拉·芬詹（leyla_fincan，1540-04-19 生），金角湾兵工厂门口咖啡摊家的女儿，替船匠把口述的订单写成字。
#       主角：自创主角 custom_istanbul_shipyard（模板生年 1540-01-01），兵工厂船匠家的学徒，懂船上的叫法、不太会写字；“我”不写性别与外貌。
#       年龄：C1（1554 春）主角 14、莱拉 13；A1（1556 春）主角 16、莱拉 15—16；S（1556-12）两人都 16；重逢（1562）两人 21—22。
# 结构：bond_leyla_fincan（request，academy）C1 → C2 → B1 → B2 → A1 → A2 → S；S 的选项与 default 都开 reunion_leyla_fincan（main，1562）。
# 羁绊阶梯：C2 go_with_her 给 C，B1 share_the_cup 补签 C；B2 buy_two_cups 给 B，A1 keep_her_secret 补签 B；
#       A2 keep_the_lid / write_back 给 A + 糖无花果（sugar_figs）+ 回忆。每章都有不带 bond 的选项。
# 心动：A1 sit_till_done +6 → A2 write_back +6（要 ≥ 6）→ S heart +12（要 ≥ 12）→ 重逢 love 要 ≥ 24。
#       决定表写 S +10，算下来只到 22、永远够不着 24，这里按简报改为 +12。学院期只到 heart 与 crush，S 不写 dating。
# 依据（史实）：奥斯曼兵工厂在金角湾（卡瑟姆帕夏一带）；奥斯曼财政用西亚克特（siyakat）记账，数码是缩写的字形，
#       七与七十的写法相近；市场督察（muhtesib）查秤、查执照；1554 或 1555 年，两个叙利亚人（相传一个来自阿勒颇、一个来自大马士革）
#       在塔赫塔卡莱开了城里第一家咖啡馆（正文用“听说”）。
# 原创：莱拉一家、订货单上的杯底圈、赖账的桶匠、比记账、母亲的签名与小船记号、盒盖上的炭字、那张收据。
# 秘密：莱拉的母亲不识字，摊子执照上的签名是莱拉带着母亲练出来的（A1 她告诉主角）；不进任何见闻。本文件的章都没有 stage，不写 news。
# 缺省走向：每章 default 照走下一章；S 不选 → 开重逢并记 c7_bond_leyla_fincan_parted；重逢错过 → 她寄来一张“一杯，欠着”的收据（来信），记 _missed。
# 共享旗标：S 的 promise 与 heart 设 c7_tie_new_marietta_filo_leyla_fincan_taken（配角线 tie_new_marietta_filo_leyla_fincan 据此改走并肩的朋友）。
#       本文件自有：c7_bond_leyla_fincan_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed。
# 玛丽埃塔 1566 年才到伊斯坦布尔，本文件不写她。口头禅“喝完再吵，字还没写清。”只在 C1 用一次。

