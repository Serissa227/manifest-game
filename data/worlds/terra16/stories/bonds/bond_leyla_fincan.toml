text = "六月的一个傍晚，莱拉站在船台工棚门口，手里托着一只小木盒，盒子是旧的，原先装过咖啡豆，缝里还透着一股焦香。“我娘熬的糖无花果，给你的。”盒盖上用炭写着一行字，笔画粗一截细一截，有个字的勾拐反了方向：“天热，三天内吃完。”我念出了声。她一直盯着我念，等我念完才说：“这是我娘自己写的。头一回，没照着我写的描。”说得满不在乎，一只手的指头却在门框上敲个不停，敲得木屑往下掉。“三天，”她又补一句，“过了三天放坏了，可别说是她熬得不好。”"
