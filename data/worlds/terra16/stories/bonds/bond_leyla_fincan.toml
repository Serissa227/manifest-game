reply = "桶匠的徒弟从前在船台上替我们刨过桶箍，我递过去一块芝麻饼，三句话就问出来了：那个月作坊里进了五袋豆子，空袋子还堆在后墙根。桶匠的脸一阵红一阵白，数了钱拍在桌上。回到摊上，莱拉把收据上那个数描了一遍又一遍，描到墨都发亮，像刻进纸里去的。"
next = "b1"
effects = [{ kind = "affinity", person = "leyla_fincan", value = 2 }, { kind = "bond", person = "leyla_fincan", level = "C" }]

