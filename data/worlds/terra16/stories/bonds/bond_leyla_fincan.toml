# 重逢：1562 年，兵工厂门口。咖啡摊旁多了一张写字桌；那张收据还在。variants 按 S 的结局换收据的下落。
[[tracks.chapters]]
key = "reunion"
title = "摊旁的写字桌"
text = "1562 年，我的船靠进金角湾。兵工厂门口的咖啡摊还在，旁边多了一张写字桌，一条桌腿短了一截，垫着两块砖。桌前排着三四个小作坊的伙计，手里攥着货单，等着请人写收据。莱拉坐在桌后，一边听一边写，写完把纸一转：“念一遍，没错就按手印。”她母亲在后头煮咖啡，手边的木板底下压着一张执照，签名写得端端正正。莱拉一抬头，看见了我，笔停住了。她把芦笔往耳后一夹，从围裙里摸出一张折了好几折的收据，边角都磨毛了，在桌上慢慢展开。“你欠的那一杯，”她说，“利息我还没算。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "istanbul"
cast = ["leyla_fincan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "leyla_fincan", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "leyla_fincan", text = "收据。付款人：船台的学徒。金额：一杯，欠着。我娘说，收据不能光写这几个字，那就往下写。今年你的船没进金角湾。码头上有人说你在亚历山大港耽搁了，也有人说你去了更远的地方，我不信他们，只信港务的船名册，名册上没有你。摊子旁边如今有一张写字桌了，一条腿短一截，垫着两块砖。我替码头上十一家小作坊写收据，卡瑟姆帕夏那个桶匠也在里头，他现在付钱比谁都快，大概是怕我把他的名字写上牌子。我娘的名字早不用我带了，她写得比我慢，可比我工整，督察来过两回，一回也没挑出毛病。塔赫塔卡莱那边的咖啡馆又多开了两间，船匠们去坐了坐，回来说那边的人说话太斯文，订不了木料。你欠的那一杯，利息照算，一年一成，利滚利。我不催你。可你哪天回来，先来这儿，别叫我从别人嘴里听说你到了。——莱拉。又：这张收据我写了三遍，前两遍都写坏了。喝完再看，我等着。" }, { kind = "flag", flag = "c7_bond_leyla_fincan_missed" }]

