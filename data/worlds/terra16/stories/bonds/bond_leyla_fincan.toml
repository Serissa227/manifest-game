text = "劝她先回摊上，一起想个桶匠赖不掉的写法。"
requires = []
reply = "我们在摊子后头试了半晌，想出来的法子很笨：数目先用数码写一遍，后头再用字写一遍，“五袋整”。第二天她就照着改，每张收据都写两遍，写到手腕发酸，嘴里一直骂那个桶匠，骂一句，落一个“整”字。"
next = "b1"
