# B2：1555 年，菲洛家。父亲的铜印按在牛角镜框上；“磨的是我，刻的是他。”主角从这里知道她的秘密。
[[tracks.chapters]]
key = "b2"
title = "父亲的记号"
text = "一个帕多瓦来的书商订了一打镜片，要配成六副眼镜。玛丽埃塔磨了半个月，夜里借灯，白天看摊，十二片镜片配进牛角框，用软布包着，一副一副码进木匣。交货那天早上，她父亲从柜子里取出自家的铜印，在炭盆上烤热了，往每副镜框上一按，嗤的一声，冒一缕焦味。一下，一下，按了六下。他按得很稳，按完把匣子一合：“行会认这个。”说完抱着匣子出了门。玛丽埃塔一直站在磨盘旁边，手里还捏着那块软布。等门关上，她从桌上拣起一片磨坏了的废片，对着窗户举起来，看了很久。“磨的是我，”她说，“刻的是他。”她把废片放回桌上，伸手去摸炭盆边上那枚还烫着的铜印，指尖刚碰到，又缩了回来。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "venice"
cast = ["marietta_filo"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

