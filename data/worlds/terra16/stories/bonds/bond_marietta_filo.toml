# A1：1556 年狂欢节将尽，圣多纳托钟楼下的码头。一片刚磨好的透镜，边上划着那只猫。心动 +6 在 look_at_her。
[[tracks.chapters]]
key = "a1"
title = "潟湖上的黄昏"
text = "狂欢节快完了，岛上的人都划船过潟湖，去威尼斯看最后一夜的热闹，穆拉诺一下子空了。玛丽埃塔拉我坐在圣多纳托钟楼下的码头边，两条腿垂在水面上。她从围裙里摸出一片刚磨好的透镜，边上用针尖划着一只很小的眯眼猫。“看对岸。”我把透镜举到眼前。对岸的钟楼一下子近了好几步，砖缝都数得清，钟楼底下谁家晾了一排衣裳，有件衬衫的袖子破了个洞。我叫了一声，差点从码头上栽下去。她在旁边笑：“看清了没有？”我把透镜慢慢转过来。镜片里先是一片水，然后是她的围裙、她的手，然后是她眯着一只眼、等我回话的那张脸，近得连睫毛上沾的一点玻璃粉都看得见。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "venice"
cast = ["marietta_filo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

