# C1：1554 年春，穆拉诺。珠子摊后头那盏借来的灯，一片磨了一半的镜片。口头禅在这里用唯一一次。
[[tracks.chapters]]
key = "c1"
title = "借来的灯"
text = "收了摊，菲洛家的珠子摊就黑了，只有摊子后头还亮着一盏油灯。灯是隔壁卖鱼的婆婆家的，玛丽埃塔每晚去借，天亮前送回去，灯油她自己添。她脚踩一只小磨盘，盘面抹着湿砂，指头捏着一片磨了一半的镜片。我从熔炉那边给她捎来一块料，是师傅嫌颜色发青、要扔回炉里的碎块，透得像井水。她接过去对着灯举起来，眯着一只眼看了半天，又把磨了一半的那片递给我：“你看看。”我凑到灯底下，看什么都是一团雾，连她的手指头都胖了一圈。“看不清，”我说，“白磨了。”她把镜片拿回去，按在磨盘上，脚底一踩，转了一圈。“再磨一圈，别急着说看不清。”砂子沙沙地响。灯芯爆了个火星，她眼皮都没抬。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "venice"
cast = ["marietta_filo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "family_access_murano_workshop" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那片镜片磨到第二天天亮，她还是说看不清。
[tracks.chapters.default]
next = "c2"
