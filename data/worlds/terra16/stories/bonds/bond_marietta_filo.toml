text = "开春我要搭一条去亚历山大港的船，出海见世面。玛丽埃塔留在穆拉诺。腊月里一个傍晚，她抱着一只木匣来码头找我，匣子里是她攒下的家当：一块磨石，一包细砂，一根镶了金刚石尖的划针，都是拿卖镜片的零钱一点一点换来的。“还差一张工桌，”她说，“我要争一张自己的。哪怕在厨房里，哪怕挨着灶台。”说完她拉过我的手，把一片镜片放进我手心。镜片凉凉的，磨得很匀，边上用划针划着那只眯眼的猫。只有猫，没有她父亲的记号。“这是第一片，”她说，“你先拿着。”码头上有人在收缆绳。我握着那片镜片，手心慢慢把它焐热了。"
