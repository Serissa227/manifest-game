[[tracks.chapters.choices]]
key = "bring_more_glass"
text = "答应她：往后熔炉里出了好料，都给她留一块。"
reply = "“熔炉的料是你爹的，”她头也不抬，“为几块碎玻璃挨打，不值。”我说我爹数不清炉子边上有几块碎料。她没再接话。第二天傍晚，我把一块透亮的料塞进她的珠子筐。那天夜里，摊子后头那盏借来的灯一直亮到鸡叫，隔壁婆婆来要了两回。"
next = "c2"
effects = [{ kind = "affinity", person = "marietta_filo", value = 3 }]

[[tracks.chapters.choices]]
key = "try_the_wheel"
text = "学她的样子，自己踩一圈磨盘。"
reply = "我踩得太猛，磨盘一甩，那片镜片从指缝里飞出去，“扑通”一声掉进了运河。我愣在那里。玛丽埃塔先瞪着水面，接着笑得趴在摊子上，珠子筐都撞翻了。笑够了，她抹着眼角说：“明天再来，我教你怎么踩。脚要慢，手才快得起来。”"
next = "c2"
effects = [{ kind = "affinity", person = "marietta_filo", value = 2 }]

# C2：1554 年夏，威尼斯，阿尔丁印书坊。藏在珠串里的老花镜，一页希腊文校样。
[[tracks.chapters]]
key = "c2"
title = "老校对的眼睛"
text = "威尼斯的眼镜匠有行会，没入会的人不许卖镜片，一个卖珠子的女孩更别想。可阿尔丁印书坊有个老校对，校了一辈子希腊文，近来把校样贴着鼻尖看还会看漏。玛丽埃塔给他磨了一副老花镜，两片镜片穿进一串玻璃珠里，当念珠送过去。我陪她过了潟湖，在印书坊门口等。老校对拆开珠串，把镜片架上鼻梁，拿起一页密密麻麻全是希腊字母的校样，举到窗前，忽然笑出了声：“这个字母，我十年没看清过了。”他指着一个弯弯绕绕的小字念了一遍，又念一遍。玛丽埃塔站在门边，没往里走，手里攥着那串拆空了的珠子，攥得珠子咯咯响。回去的船上，她把珠子一颗一颗重新穿好，只说了一句：“他念出来了。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "venice"
cast = ["marietta_filo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

