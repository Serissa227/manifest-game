reply = "我送了三回。头两回，老校对只收下珠串，朝我点点头。第三回，他从架子上抽出一本旧书，书脊都磨白了，塞进我怀里：“给她。”回到穆拉诺，玛丽埃塔翻开扉页，上面一行墨字：“给看得清的人。”她把书垫在磨盘底下，说这样磨盘就不晃了。"
next = "b1"
effects = [{ kind = "affinity", person = "marietta_filo", value = 2 }, { kind = "bond", person = "marietta_filo", level = "C" }]

[[tracks.chapters.choices]]
key = "wait_with_her"
text = "陪她在摊子后头，等老校对来取下一副。"
reply = "等了四个傍晚，第五天他来了。老校对一句话没说，在摊子上放下两枚银币，拿起包好的镜片就走。玛丽埃塔把银币翻过来又翻过去，在围裙上擦了擦：“这是我头一回挣到镜片钱。”她没把银币放进家里的钱匣，塞进了自己的鞋底。"
next = "b1"
effects = [{ kind = "affinity", person = "marietta_filo", value = 3 }]

# B1：1554 年秋，穆拉诺作坊。按编号摆好的碎玻璃板；她认条纹，我认颜色（气泡归配角线，这里不写）。
[[tracks.chapters]]
key = "b1"
title = "玻璃里的条纹"
text = "一批杯子出炉没几天就开了裂，师傅抡起锤子全砸了，碎片铺在一块长木板上，每块底下用粉笔写个编号，让学徒们认是哪一炉出的。玛丽埃塔不是学徒，扒在作坊窗口看。我趁师傅转身，一把把她从窗口拉了进来。“比一比，”我说，“你认条纹，我认颜色。”她把袖子一挽：“输的人搬一天碎料。”她拿起碎片对着窗光，一眼一块；我凭颜色，绿里泛黄的是第三炉，发灰的是第五炉。末了一数，她认对十一块，我认对九块，可有两块她报错的，我报对了。她咬着嘴唇盯着那两块，好像要把它们瞪回第五炉去。师傅背着手看完板子，从怀里摸出一小块乳白玻璃，那是给认得最多的人的。他看看她，又看看我，“咔”一声，掰成了两半。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "venice"
cast = ["marietta_filo"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

