# 借来的灯（bond_marietta_filo）——羁绊线，标签 GL（自创主角性别由玩家定：女主角时为 GL，男主角时为 BG）。
# 人物：玛丽埃塔·菲洛（marietta_filo，1540-08-22 生，romance = any），穆拉诺卖玻璃珠人家的女儿，收摊后借邻居的灯偷练磨镜片。
#       主角：自创主角·穆拉诺的玻璃匠之子（custom_murano_glass，模板生年 1540-01-01），熔炉边长大的学徒；第一人称“我”不写性别与外貌。
#       年龄：学院期（1554—1556）两人都未满 18；S 章（1556-12）主角 16、玛丽埃塔 16；重逢（1562）两人 21—22，都已成年。
# 依据（史实）：穆拉诺的玻璃行会规矩严，工匠的记号由行会登记；1549 年前后穆拉诺出现金刚石尖划刻玻璃的手艺；
#       威尼斯的眼镜多用牛角、骨头做框；阿尔丁印书坊 1550 年代由保罗·马努齐奥主持，以印希腊文书籍出名；
#       布拉诺的女人编花边；穆拉诺有圣多纳托教堂与钟楼；狂欢节在大斋期前结束。
# 原创：玛丽埃塔、她的父亲与布拉诺的姨妈、阿尔丁印书坊的老校对、猫记号、行会因老校对们联名写信而认下她的记号。
# 待核：眼镜匠行会是否明文禁止女子卖镜片（正文只写“没入会的人不许卖”）；1561 年保罗·马努齐奥去了罗马，重逢只写“印书坊的老校对们”。
# 改动：简报写父亲在“镜片的边上”敲铜印；玻璃经不起敲，改为把烤热的铜印按在牛角镜框上，她自己的猫记号用划针划在镜片边上。事件与结果不变。
#       A1 的透镜边上先写出那只猫，使 B2 走哪个选项都接得上 A1“替她瞒着那只猫”、A2 的花边猫、S 与重逢的镜片。
# 秘密：她想在镜片上刻自己的记号，不刻父亲的（B2 主角知道）——永远不进见闻；本文件的章节没有 stage，不写 news。
# 口头禅：“再磨一圈，别急着说看不清。”只在 c1 出现一次；别处只换说法呼应。
# 羁绊阶梯：C2 smuggle_lenses 给 C；B1 write_her_number 补签 C；B2 carve_her_mark 给 B；A1 keep_the_mark 补签 B；
#       A2 take_lace / kiss_the_cat 给 A + 亲编饰边（lace_edging）+ 回忆。心动：A1 look_at_her +6，A2 kiss_the_cat +6（要求 ≥ 6），
#       S heart +12（要求 ≥ 12）；全选心动正好 24，够重逢的 love 落点。
# 缺省走向：每章 default 都往下走、不加任何东西；S 的 default 设 c7_bond_marietta_filo_parted 并开启重逢；
#       重逢的 default 是她的一封来信（附一片划着猫的小镜片）并设 c7_bond_marietta_filo_missed。
# 共享旗标：S 的 promise 与 heart 两个选项都设 c7_tie_new_marietta_filo_leyla_fincan_taken（配角线 tie_new_marietta_filo_leyla_fincan 据此改走“并肩的朋友”）。
