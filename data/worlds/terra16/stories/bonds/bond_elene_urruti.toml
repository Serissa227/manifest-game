# B2：1555 年冬初，捕鲸船回港。散了线的药草簿（秘密：废账纸；不进见闻）。
[[tracks.chapters]]
key = "b2"
title = "废账纸缝的书"
text = "入冬头一场冷雨里，新地的船回来了。跳板上下来的人，有的十个指头冻得发紫，有的胳膊上一圈一圈全是鱼叉绳勒烂的肉。埃莱内在栈桥头支了一只木盆，挨个按住人洗。一个水手往回缩手，说撒把盐就好，洗什么洗。“伤口要洗，逞强留到岸上。”她头也不抬，把他的胳膊按回盆里。她腾不出手，把药草簿塞给我：“翻到冻伤那页，念。”簿子的线早松了，一翻就往外掉页。我捡起一张，背面是码头商行的字：“铁锭四十，交讫。”再翻一张，还是货单，墨色深深浅浅，是好几年的旧账。她画的叶子、写的方子，全挤在别人的账背面。我还没念出声，簿子就被一把抢了回去。“别看。”她把簿子按在胸口，手上的水洇湿了纸，“念个方子都念不利索。”"
window = [[1555, 10, 1], [1555, 12, 31]]
at = "bilbao"
cast = ["elene_urruti"]
speaker = "captain"
mood = "tense"
news = "毕尔巴鄂的捕鲸船从新地回港，冻伤的、勒伤的排了半条栈桥；鱼叉手家的姑娘支了只木盆，挨个按着人洗伤口。"
when = [{ kind = "date", from = [1555, 10, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

