# B1：1554 年秋，学堂比采药。仓库门梁上的一杆秤。
[[tracks.chapters]]
key = "b1"
title = "谁收得好"
text = "学堂的见习这回比采药。教草药的老水手把一杆秤挂在仓库门梁上，谁的篮子挂上去，秤砣往外推几格，他就拿炭在墙上划几道。我的篮子挂上去，秤砣推到了头。埃莱内的轻了将近一半，后头有人笑出了声。十天以后再比晒干的。老水手把每人的叶子倒在木板上，拿指头一拨：我的碎了一半，捏起来像炉灰；她那一堆一片没碎，叶边还卷着。老水手想了想，在墙上另起一行，分开记：分量，我头一名；成色，她头一名。“这算谁赢？”有人问。“两样都是真的，你自己挑。”散了以后，埃莱内绕到秤底下，装作看秤星，眼睛却往我这边瞟：“你那片坡，在哪儿？”我正想问她：“你的叶子是怎么晒的？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "bilbao"
cast = ["elene_urruti"]
speaker = "captain"
mood = "cheerful"
news = "毕尔巴鄂捕鲸学堂比采药，仓库门梁上挂了杆秤；分量的头名和成色的头名不是一个人，教课的老水手在墙上分两行记了。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

