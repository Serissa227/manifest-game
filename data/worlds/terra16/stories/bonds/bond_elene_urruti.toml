# A1：1556 年春，阿玛娅去了威尼斯。药箱盖里的一张清单。
[[tracks.chapters]]
key = "a1"
title = "姨妈不在时"
text = "阿玛娅搭一条往威尼斯运铁的船走了。临走只交代一句“开春的药箱你来备”，埃莱内问她几时回来，她说不一定。今年头一条去新地的船，药箱摆在酒馆后屋的桌上，箱盖里头钉着一张清单。埃莱内一包一包往里放，手比我快一倍，放完了却不合盖，把清单取下来，推到我面前。“你念，我答。念一样，问一样。”“你闭着眼都能装，还用得着我？”她低头拨了拨灯芯：“你不懂的，会问出来。”过了一会儿，她又说：“我现在什么都不敢问了。问了，也没人答。”"
window = [[1556, 2, 1], [1556, 5, 31]]
at = "bilbao"
cast = ["elene_urruti"]
speaker = "captain"
mood = "tender"
news = "毕尔巴鄂酒馆后屋的草药人搭运铁的船去了威尼斯；今年开春去新地的头一条船，药箱是她那个徒弟一个人备的。"
when = [{ kind = "date", from = [1556, 2, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

