# C7 重写：故事 2.0，遵循 A5 / E37 契约（DECISIONS“第九批 A5 / E37 开工：故事 2.0 TOML 契约”）。
# 标签：any——女主角时 GL，男主角时 BG；羁绊线（C1 C2 B1 B2 A1 A2 S）+ 成年重逢。适用主角：custom_basque_whaling（毕尔巴鄂捕鲸学堂）。
# 人物：
#   埃莱内·乌鲁蒂（elene_urruti，1540-02-13）——鱼叉手家的女儿，捕鲸学堂的同学；跟酒馆后屋的阿玛娅认草药，叫她“姨妈”（不是亲的）。
#     口头禅“伤口要洗，逞强留到岸上。”原句只在 B2 正文出现一次；C2、A2、S、重逢与来信里只用改过字句的呼应。
#   阿玛娅（amaia，1530-06-26）——酒馆后屋的草药人，只在 C2 露面一次；A1 写她 1556 年随一条运铁的船去了威尼斯。她与塞西莉亚的事归 tie_cecilia_amaia，本文件不写。
#   主角（custom_basque_whaling，1540 年生）——第一人称“我”，不写性别、外貌与家族专名。
# 年龄：埃莱内 1554 年 1—2 月十三岁、此后十四岁；1556 年 2 月满十六；1562 年二十二岁。
#   A1、A2 的心动选项要求双方 ≤ 17；S 的告白要求双方 16—17，只是“约好成年相见时再答”，最多碰手；恋人只在 1562 年重逢（双方 ≥ 18）。
# 依据（史实）：巴斯克捕鲸船春末（5—6 月）去新地（拉布拉多红湾一带），秋末冬初回港，带回冻伤与鱼叉绳勒伤的人；毕尔巴鄂是内尔比翁河口的铁与羊毛码头，常有运铁的船去地中海。
# 依据（原创）：看天的三样记号；油布药包里晕船药的位置；仓库门梁上的秤与墙上分两行的炭字；废账纸缝的药草簿与学堂账房的旧皮封；
#   药箱盖里的清单；捕鲸船叠法的亚麻手巾；伤病手册（第十二页冻伤，1562 年写到第八十页）；重逢的雨与屋檐。
# 待核：冻伤“不许拿火烤、揣进怀里捂”按行里人的经验写，只在一个回复里出现。
# 秘密：第一本药草簿是码头商行扔掉的废账纸缝的——B1 的一个回复里只露一角，B2 正文由主角发现；见闻（news）一律不提。
# 与配角线的一致：阿玛娅的师徒线（tie_extra_02_amaia_elene_urruti）写她 1555 年夏天见过这本簿子，主角到 B2 才发现；
#   重逢里来取药包的“制桶匠家的年轻人”是马丁（tie_new_martin_itsas_elene_urruti 的 1562 年包药），只这一笔，不点名、不写两人的事。
# 缺省走向：玩家不在场，故事照样走——C1 到 A2 没有收获地往下走；S 的 default 开启重逢并设 c7_bond_elene_urruti_parted；
#   重逢的 default 是埃莱内的一封来信，设 c7_bond_elene_urruti_missed。
# 落点：friends（S 的 promise / own、重逢的 add_chapter）；crush（S 的 heart）；lovers（重逢的 stay_ashore，要 c7_bond_elene_urruti_romance + 心动 ≥ 24 + 双方 ≥ 18）。
#   心动只来自本文件：A1 lamp_till_out +6、A2 fold_together +6、S heart +12，合计 24。旗标条件照简报与 decisions §3.3 写上（波次检查补回）；
#   故事审计单跑重逢轨道、读不到 S 章设的旗标，会把它报成“准备后条件仍不满足”，那是审计的局限，不是错。
# 旗标：写 c7_bond_elene_urruti_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#   写共享旗标 c7_tie_new_martin_itsas_elene_urruti_taken（S 的 promise 与 heart；马丁×埃莱内的主轨道落点读它，改走并肩的朋友）；
#   重逢的变体读本文件的 c7_bond_elene_urruti_promise。
# 日程：不改。

