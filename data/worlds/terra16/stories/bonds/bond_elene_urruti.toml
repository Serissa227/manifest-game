# S：1556 年腊月，学堂散了。一小包油布药。
[[tracks.chapters]]
key = "s"
title = "伤口要洗"
text = "腊月里，学堂的仓库清空了，门梁上那杆秤也摘了下来。开春我要跟一条捕鲸船去新地，船东上个月来点过名，我的名字排在倒数第三。埃莱内留在毕尔巴鄂。酒馆后屋靠窗那张桌子归了她，一头摞着晾药的筛子，一头摊着伤病手册，写到了第二十几页。“新地回来的人，十个里有三个说不清自己哪儿疼。”她蘸着墨，不看我，“说不清，我就写不对。写不对，下一船的人照着治，越治越糟。”她写完一行，把笔搁下，从抽屉里摸出一小包药，油布包着，绳结打得方方正正，推到我面前，又用一根手指按住，没松。“开春以前，你还有什么话，现在说。”"
