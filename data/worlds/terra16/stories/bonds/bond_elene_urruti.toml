# 重逢：1562 年，毕尔巴鄂的雨。写到第八十页的伤病手册。
[[tracks.chapters]]
key = "reunion"
title = "坏天气的屋檐"
text = "毕尔巴鄂的雨下了三天。我找到码头时，埃莱内正在屋檐底下抢药篓，一只一只往里拖，篓底淌着水。她看见我，下巴一抬，算是招呼过了，手上没停：“站着干什么，搭把手。”七只篓子拖完，她才直起腰，甩了甩手上的水，上下打量我：“没缺胳膊，没缺腿。行。”码头上的人路过都冲她点头。一个制桶匠家的年轻人跑来取药包，她叮嘱一遍；他走出三步，她又喊回来叮嘱一遍；第三遍是隔着雨喊的。屋檐下的木箱上摊着伤病手册，厚了好几倍，写到了第八十页。她擦干手，翻到冻伤那一页给我看。那段方子是从旧药草簿上抄过来的——当年在栈桥上，她让我念、我没念出口的就是它。如今句子改短了，短得像号子，页边一行小字：念的人念不利索，改短。"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "bilbao"
cast = ["elene_urruti"]
speaker = "captain"
mood = "tense"
news = "毕尔巴鄂连下三天雨，码头上的草药人埃莱内把药篓全拖进了屋檐底下；听说她那本给水手看的伤病手册，写到第八十页了。"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

