# C1：1554 年春，城外的山坡。一篮摊在石头上的叶子。
[[tracks.chapters]]
key = "c1"
title = "先看天"
text = "城外的山坡上露水还没干。埃莱内不急着弯腰，先站在坡顶，把天看了好一阵。“云从海那边压过来了。”她把篮子往地上一放，“下午有雨。容易闷坏的先收，收了就摊开。”我抬头看，天蓝得发白，只有河口那边挂着一道灰边。我说那么远的云，走到这儿天都黑了。她没理我，掐下一片车前叶举到我眼前。叶脉的沟里卧着一颗没干的水珠。“这样的叶子塞进篮子，捂到晚上就黑了。”说完她把自己那一篮倒在一块平石头上，一片一片摊开，摊得像晒鱼干。我的篮子早压得冒了尖，湿的干的全挤在一处。她瞥了一眼，嘴角一撇：“你这是采药，还是腌菜？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "bilbao"
cast = ["elene_urruti"]
speaker = "captain"
mood = "cheerful"
news = "毕尔巴鄂城外的山坡午后下了场急雨，采药的学生篮子捂黑了一半，只有鱼叉手家的姑娘一早把叶子摊在了石头上。"
when = [{ kind = "flag", flag = "family_access_bilbao_whaling_yard" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "follow_hill"
text = "跟她把山坡走一遍，把她看天的记号一样样记下来。"
reply = "她走几步停一停，指给我看：海鸥往河里飞，远山发青，风里带鱼腥。“三样占两样，就收。”我蹲在石头边一条条记。她探头看了一眼：“字这么丑，雨一淋你自己都认不出。”午后雨果然压了过来。我那一篮倒出来，全捂黑了；她石头上那些叶子，落雨前就收进了干布里。"
next = "c2"
effects = [{ kind = "affinity", person = "elene_urruti", value = 3 }, { kind = "skill", skill = "herbal_medicine", value = 6 }]

[[tracks.chapters.choices]]
key = "bet_rain"
text = "跟她打个赌：今天一滴雨也不会下。"
reply = "她眼睛一亮：“输了的替赢的背一个月篮子。”雨在午后砸下来，我们挤在一棵橡树底下躲了一个时辰，我那篮叶子在脚边慢慢捂黑。第二天起我替她背篮子。篮底每天多一块石头，我问她放石头做什么，她说：“压秤。省得你背得太轻松，忘了是怎么输的。”"
next = "c2"
effects = [{ kind = "affinity", person = "elene_urruti", value = 4 }]

# C2：1554 年初夏，捕鲸船出发前。油布包好的药包。
[[tracks.chapters]]
key = "c2"
title = "给父亲的药包"
text = "码头上的人在往船上滚空桶，捕鲸船过几天就要开去新地。埃莱内蹲在缆桩边，膝盖上摊着一块油布，把药一包一包往里码：洗伤口的醋，止血的粉，冻疮膏；最底下压着一小包止吐的。她父亲是鱼叉手，正站在跳板上跟人吵绳子的事，没往这边看一眼。酒馆后屋的阿玛娅提着篮子路过，停下来看了看，一声不吭，把最底下那包抽出来，跟最上面那包换了个位置。“先用的放上面。船上没人有工夫翻到底。”埃莱内的脸一下涨红了：“晕船也算病？洗伤口才是要紧的！”“吐上三天的人，连鱼叉都握不住。”阿玛娅说完就走了。埃莱内瞪着那包药，嘴里嘟囔“又不是你出海”，手却把油布拆开，从头码了一遍。"
window = [[1554, 5, 1], [1554, 6, 30]]
at = "bilbao"
cast = ["elene_urruti", "amaia"]
speaker = "captain"
mood = "tense"
news = "毕尔巴鄂的捕鲸船开去新地了。鱼叉手乌鲁蒂的女儿在栈桥上给她父亲塞了一包药，油布包得比谁家的都方正。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 6, 30] }, { kind = "age", le = 17 }]

