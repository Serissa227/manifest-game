# C2：1554 年夏，码头上拖上岸刮底的进贡船旁。画着圈与点的岛名单。
# default：那一刻你不在，金城真自己把单子分完了记号，满纸的点。
[[tracks.chapters]]
key = "c2"
title = "听来的航段"
text = "夏天，进贡船拖上岸刮船底，码头上满地碎贝壳。金城真蹲在船边，又在背他的单子。我问他：“这些路，你自己走过哪几段？”他背到一半停住了。“去年随我爹的船去过一趟福州。”“那就是都走过了。”“走是走过，可没都看见。”他从怀里摸出笔墨，把单子摊在膝盖上，一段一段地问自己：这一段是白天过的，还是夜里？我在舱面，还是在舱底？问一段，画一个记号。亲眼看见的画圈，听人讲的点一个点。画完了，满纸都是点，圈只有三个：庆良间到渡名喜，渡名喜到粟国，东涌到五虎门。我以为他要恼，他却把笔一搁：“早该这么分。听来的当成看见的，迟早要出事。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "naha"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
