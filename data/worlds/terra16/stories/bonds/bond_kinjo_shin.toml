# A1：1556 年春，新王即位以后，港外退潮才露出来的礁石。礁石上晒干的海藻。
# default：那天你没去，金城真一个人在礁石上坐到涨潮，回来时袖子里塞满了干海藻。
[[tracks.chapters]]
key = "a1"
title = "今天不考岛名"
text = "开春，听说新王即位了，满城的素服换了下来，港里的进贡船又开始往上搬货。金城真约我出港，去外头那片退潮才露出来的礁石，路上说：“今天不考岛名。”礁石上晒着一片一片的海藻，干得发脆，踩上去沙沙响。我们挑了块平的坐下。我一坐下，就抬手往西一指：“庆良间在这边，再偏一点是渡名喜——”说到一半，自己停住了。金城真看着我，我看着他，两个人一起笑出声来，惊得礁缝里的一只螃蟹横着逃了。他笑完，从石头上揭下一片干海藻，捏在指间转着：“你看，我说不考，是你自己要考。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "naha"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

