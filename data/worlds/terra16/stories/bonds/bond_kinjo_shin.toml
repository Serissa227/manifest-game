# B1：1554 年秋冬，学堂里比背航路。先生手里的记分木片。胜负已定：各错一处。
# default：那一刻你不在，两块木片照样各刻了一道，并排摆在先生桌上。
[[tracks.chapters]]
key = "b1"
title = "漏报的停处"
text = "秋天，学堂里比背航路。先生手里攥着一把记分的木片，错一处，就在那人名下的木片上刻一道。我抢在金城真前头背完，背得飞快，自己都觉得顺。先生却拿起我的木片，刻了一道。金城真在旁边说：“粟国背风那一面，船要泊一夜等风。你漏了这个停处。”这是规矩，我认。轮到他背，一个字不差，只是念到久米岛，三个字挤成了一团，快得像要从嘴边溜过去。他坐下时，我举起手：“久米岛，他念含糊了。”屋里静了一下。金城真看了我一眼，站起来对先生说：“含糊。记我一处。”先生在他的木片上也刻了一道，把两片并排摆在桌上，一样长，一样一道缺口。"
