text = "六年以后，我的船进那霸港。码头上泊着一条进贡船，正在装货，跳板底下站着两个人。高些的那个是金城真，穿着书记的衣裳，手里捧着一叠文书，不急着递，先问对面的小学徒：“去哪儿？”“福州。”“从哪个口进？”“五虎门。”“过了粟国呢？”“泊一夜，等风。”他这才把文书交出去。旁边一个老水手正跟人说，去年有条使船在西边的礁屿上断了水，是照着金城真的岛屿水源表，在第二块礁上挖出了泉。我的船正在落帆。金城真抬起头，先看见的是桅顶的旗。他盯着那面旗看了好一会儿，目光才往下落，落到船头，落到我身上。他手里的笔掉在了地上。"
