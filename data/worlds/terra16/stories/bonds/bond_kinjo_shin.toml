# S：1556 年 12 月，港口石堤。一张写全日期的字条。正文不以“结业时”开头。
# default：那一夜你不在，进贡船照常启程；字条后来夹在他的第一封信里寄到（开重逢，记 parted，无关系变化）。
[[tracks.chapters]]
key = "s"
title = "哪一次潮"
text = "冬月里，学堂散了。港里那条进贡船装满了货，码头上的人都在传，这一趟还要把秋天从倭寇船上救下来的几十个唐人一并送回福州。金城真跟着学使船的文书，就上这一条。我开春要随另一条船往南走。他把我叫到港口的石堤上，递给我一张字条，上头只有一行：嘉靖三十五年十一月十九日，那霸，潮落，北风。“以后写信，开头就照这样。”他说，“年、月、日、在哪儿、什么潮、什么风，一样不能少。信走得慢，迟到半年也不怕，拆开就知道是哪一次潮。”堤头那盏灯已经点上了。他看着我把字条收好，又补了一句：“写俗称的，我不回。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "naha"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

