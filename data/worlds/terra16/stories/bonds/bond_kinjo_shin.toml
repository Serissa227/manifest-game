# C1：1554 年春，久米村的学堂。他手抄的岛名单。口头禅在这里原样出现，全文件仅此一次。
# default：那一刻你不在，金城真照样把单子念完；跳过的那一行没人问。
[[tracks.chapters]]
key = "c1"
title = "岛名先念全"
text = "久米村的学堂里，通事先生问去福州沿途有哪些岛。我答了庆良间、久米岛，接着就是福州。后排有人“嗤”了一声，是金城真。他站起来，也不看纸，一口气往下念：“那霸，庆良间——唐人叫马齿山；渡名喜，粟国……”再往西是几处没人住的礁屿，他连船上给它们起的诨名都念了，一直念到闽江口的五虎门。先生点点头，又低头看书去了。散了学，他把一张手抄的岛名单推到我面前，纸边磨得起了毛：“小的也要念全。有的岛小得放不下一个村子，可风急的时候，能留船一夜。先认岛，再认旗。”我顺着单子往下看。粟国底下那一行，墨写得最浓，是久米岛。他刚才念到粟国，停了一口气，就跳到了礁屿上。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "naha"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_naha_envoy_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "recite_all"
text = "跟他一起，把单子从那霸一路念到五虎门。"
requires = []
reply = "我念错了四个。把渡名喜念成渡嘉敷，他马上打断：“渡嘉敷在庆良间里头，是另一个岛。”把东涌念成东山，他又打断。到后来我一张嘴，他的手指就先点在了下一行上。念完，他把单子叠成四折：“你比去年来学的那个小书记快。”我问他，刚才跳过去的是不是久米岛。他把单子塞进袖子里：“下回再说。”"
next = "c2"
effects = [{ kind = "affinity", person = "kinjo_shin", value = 3 }, { kind = "skill", skill = "astral_navigation", value = 4 }]

[[tracks.chapters.choices]]
key = "ask_skipped"
text = "问他：念到粟国，怎么就把久米岛跳过去了？"
requires = []
reply = "他的脸色变了一下：“没跳。”“你停了一口气。”他不说话了，把单子翻过来扣在桌上，手掌压着。外头有人喊收船，喊了两遍。过了很久，他才开口，声音很低：“那个岛上有一盏灯。我不想提它。”说完他起身走了，单子忘在桌上。第二天我把它还给他，他接过去，什么也没问，夹进了书里。"
