[[tracks.chapters.choices]]
key = "promise"
text = "约好每封信都写全日期，再写上船停在哪个岛。"
requires = [{ kind = "bond", person = "kinjo_shin", level = "A" }]
hint = "这样的约，得把一个人认得比岛还熟才许得下。你们还没走到这一步；又或者，一生一次的约你已经许了别人，这回只能互道顺风。"
reply = "我说好。他立刻说：“岛名要写全，不许写俗称。”我说：“那你得先教我全名。”他想了想：“那就还得再背一遍。”我们就站在石堤上，从那霸背起。风很冷，他背一个，我跟一个。背到粟国，我说泊一夜，等风；他点点头，接下去念久米岛，念得清清楚楚，没有停，也没有快。一直背到五虎门，堤头的灯还亮着。他从袖子里又摸出一张字条，是一封信的开头，日期那一格空着，底下只写了“那霸”两个字。“这一封，等你的船停了，你来填。”我把两张字条叠在一起收好。他转身往回走，走出几步又回过头：“岛名写错一个，我也回。可我要圈出来。”"
next = "done"
effects = [{ kind = "affinity", person = "kinjo_shin", value = 5 }, { kind = "bond", person = "kinjo_shin", level = "S" }, { kind = "relation", person = "kinjo_shin", relation = "friends" }, { kind = "flag", flag = "c7_bond_kinjo_shin_promise" }, { kind = "flag", flag = "c7_tie_new_kinjo_shin_lakan_pula_taken" }, { kind = "memory", memory = "mem-bond_kinjo_shin-s", title = "哪一次潮" }, { kind = "start_track", track = "reunion_kinjo_shin" }]

[[tracks.chapters.choices]]
key = "heart"
text = "告诉他：等我们都长大了，我的船回来时，要他第一个认出来。"
requires = [{ kind = "bond", person = "kinjo_shin", level = "A" }, { kind = "heart", person = "kinjo_shin", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "kinjo_shin", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "kinjo_shin" }]
hint = "要他第一个认出你的船，这话现在还说不出口——你们还没走到那一步；又或者，一生一次的约，你已经给了别人。"
reply = "他看了我一眼，又去看港外：“我认船比认岛还准。”我说那就好。我又说，到那时候，我还有一句话要问他，现在先不问。他没有追问。风把堤头的灯吹斜了一下，又立直了。过了很久，他伸手握住了我的手，握得很紧，手心是凉的。“岛认过了，旗也认过了，”他说，“往后还得认人。”他的声音比背岛名时轻得多，“等你回来问，我再答。”我们就那样站着，一直站到进贡船上的人收了跳板，喊他回去。他松开手，走了几步，又回头看了一眼，看的是我，不是灯。"
next = "done"
effects = [{ kind = "heart", person = "kinjo_shin", value = 12 }, { kind = "relation", person = "kinjo_shin", relation = "crush" }, { kind = "bond", person = "kinjo_shin", level = "S" }, { kind = "flag", flag = "c7_bond_kinjo_shin_romance" }, { kind = "flag", flag = "c7_tie_new_kinjo_shin_lakan_pula_taken" }, { kind = "memory", memory = "mem-bond_kinjo_shin-s", title = "哪一次潮" }, { kind = "start_track", track = "reunion_kinjo_shin" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟他比一比：看谁先亲眼把去福州的全程走完。"
requires = []
reply = "“我先。”他答得很快，“下一趟进贡船我就上，就是这一趟。”我说那我不跟你挤一条船，我走另一条路去。他皱起眉：“去福州只有这一条路。”我说那是你单子上只有这一条。他盯着我看了一会儿，从怀里掏出那张满是圈和点的单子，在最底下另起一行，写上我们两个人的名字，名字后面各留一格。“谁先把点都描成圈，谁就在格子里填日期。”他说，“到福州的城门底下为止。”我们在石堤上击了一掌，他的手比我想的有劲，拍得掌心发麻。他甩着手走了，一路没回头，走到堤口，才扬起那张单子晃了晃。"
next = "done"
