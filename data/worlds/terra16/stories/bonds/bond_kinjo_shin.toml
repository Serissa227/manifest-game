# 金城真：岛名先念全（bond_kinjo_shin）+ 那霸的新文书（reunion_kinjo_shin）——羁绊线，标签 any：
#   金城真 romance = any，主角性别由玩家定；男主角时为 BL，女主角时为 BG。
# 人物：金城真（kinjo_shin，1540-11-13 生），那霸进贡船书记家的少年，使节家学的同学；认真、一板一眼，背岛名像念经，
#       别人念错岛名会立刻纠正，难过时不说话，去港口看灯。口头禅（认岛与认旗的那一句）全文件只在 c1 原样出现一次，
#       s 的 heart 回复里有一次改了字句的呼应。
#       主角：自创主角（custom_naha_envoy，模板 1540-01-01 生），那霸使节家学的学生；第一人称“我”不写性别、外貌与家族专名。
#       书中提到的加那老爹（船头）、真牛（管舵）、陈火长（久米村的唐人火长）只是被提起的名字，不进 cast。
# 年龄：学院期 1554—1556 主角 14—16 岁、金城真 13—16 岁；s（1556-12）两人都满 16，heart 选项写双方 16..17；
#       重逢 1562 年两人都已 21 岁以上，恋人落点另写双方 ≥ 18。学院期效果最多到 heart / crush（羁绊轨道设 academy）。
# 依据：
#   史实——琉球两年一贡，进贡船从那霸出港，经庆良间（唐人叫马齿山）、渡名喜、粟国、久米岛往西，过东涌入闽江口五虎门到福州；
#         船上的火长多出自久米村的闽人后裔；尚清王 1555 年去世、尚元王次年即位；1556 年琉球在近海打退一股倭寇，
#         把被掳的明人送回福州。三件大事在正文里都只作港口的传闻，不写王府细节。
#   待核——1556 年送还明人是否正搭这一年年底的进贡船；船上书记学徒的编制；久米岛当年有无夜灯（正文写作岛上的灯）。
#         久米岛以西的几处无人礁屿不写名字，只说“船上给它们起的诨名”。
#   原创——全部人物与情节：手抄的岛名单、圈与点两种记号、记分木片、港口石堤尽头的灯、礁石上的干海藻、
#         标着北辰与帝星的简明星图（赠礼 star_sketch）、写全日期的字条、岛屿水源表。
#   秘密——金城真曾在夜里把渔火错认成久米岛的灯，船差点转错了向：c1 起只留伏笔（跳过久米岛、念得含糊），
#         b2 由他自己说出；本文件的章节都没有 stage，不写 news，秘密不进见闻。
# 心动阶梯：a1 no_names +6 → a2 his_words +6（要求已有 6）→ s heart +12（要求已有 12）= 24，正好够重逢的 love 落点。
# 羁绊阶梯：c2 mark_mine 给 C；b2 not_shame 给 B；a2 find_stars / his_words 给 A + 简明星图 + 回忆；s 的 promise / heart 给 S。
# 缺省走向：c1 → c2 → b1 → b2 → a1 → a2 → s（default：开重逢，记 parted，无关系变化）
#   → 1562 重逢（default：金城真托南边来的船捎一封日期写全的信，记 missed）。
# 设旗标：c7_bond_kinjo_shin_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#   c7_tie_new_kinjo_shin_lakan_pula_taken（s 的 promise 与 heart 设，配角线 tie_new_kinjo_shin_lakan_pula 读，据此改走“并肩的朋友”）。
# 读旗标：重逢的 variants 读 _promise（他压着的那叠旧信）与 _own（那张点都描成了圈的旧单子）；love 落点读 _romance。
# 日程：不改。

