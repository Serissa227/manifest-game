text = "照他的样子，把我知道的航段也分成圈和点。"
requires = [{ kind = "affinity", person = "kinjo_shin", ge = 20 }]
hint = "圈和点是他家里记航路的规矩。你们还没熟到能往他的单子上添一笔。"
reply = "我只画得出一个圈：那霸到庆良间，小时候跟家里的船去过一回。他看了看：“那也算一段。”又低头看自己的单子，那霸到庆良间，他点的是点。“出港那天是夜里。”他把我的单子和他的并排压在一块石头底下，数了两遍：“四个圈。”他用指甲在四个圈上各掐了一下，“等出了海，听来的要一段一段改成圈。”"
next = "b1"
effects = [{ kind = "affinity", person = "kinjo_shin", value = 4 }, { kind = "skill", skill = "astral_navigation", value = 4 }, { kind = "bond", person = "kinjo_shin", level = "C" }]

