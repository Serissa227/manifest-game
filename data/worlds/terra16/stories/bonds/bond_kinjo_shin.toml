# A2：1556 年秋，学堂灯下。简明星图（赠礼 star_sketch + 回忆）。
# default：那一夜你不在，星图第二天出现在你的桌上，那两颗星还没圈。
[[tracks.chapters]]
key = "a2"
title = "简明星图"
text = "秋天，金城真送了我一张星图。纸是学堂里裁剩的，画得极简，只有北边天上十几颗星，连成船上人用的几条线。最底下写着一行小字：别像我一样认错灯。可哪两颗最容易认混，他没有标。我拿着星图翻来覆去地看，他坐在对面，手里的笔一直没放下。“哪两颗？”我问。“你自己找。”他说，“找出来，我再圈上，才算画完。”我找了很久，他也不催，只是每过一会儿，就伸手把灯芯拨亮一点。窗外，港里的进贡船已经装到了第二层货，舱口还亮着一盏灯。他朝那盏灯看了一眼，又低头看我。"
