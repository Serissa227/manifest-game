# B2：1555 年夏以后，老王去世，港里的进贡船停着。港口石堤尽头的一盏灯。秘密在这里由他自己说出，不进见闻。
# default：那一夜你不在，金城真一个人在堤头站到灯油烧干。
[[tracks.chapters]]
key = "b2"
title = "认错的灯"
text = "六月，王城那边传出话来，老王去了。那霸满城换了素服，市上不敲锣，港里的进贡船卸了一半的货，就那样停着。金城真好几天没开口。一天夜里他来敲我的门，什么也不解释，拉着我一直走到港口石堤的尽头。堤头点着一盏灯，风吹不动。他看着那盏灯，看了很久。“前年我随我爹的船去福州。”他说，“过了粟国就是夜里，我在舱面上守着看灯。左边亮起一点火，我喊：久米岛的灯，在左舷。舵已经转了半边，是加那老爹一把扳住了。”他停了停，“那是渔火。它在动，我没看出来。”水一下一下拍着堤脚。“从那以后，每个岛名，我都背三遍。”"
