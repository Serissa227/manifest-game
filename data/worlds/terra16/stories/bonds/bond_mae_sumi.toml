# 重逢：1562 年，明朝册封使来那霸。码头上登记随员的长桌，三册名簿，第一册封面写着“船上的人”。
[[tracks.chapters]]
key = "reunion"
title = "册封使来的那一年"
text = "这一年，那霸港从来没这么挤过。听说明朝的册封使从福州来，要给新王行册封礼，大船一条接一条进港，随员、兵丁、厨子、乐工，几百人下了船，首里城忙得人仰马翻。码头上搭了一张长桌，替册封使的随员登记名字，坐在桌后的是真栄澄。她面前摞着三册名簿，最底下那一册最旧，封面上终于写了字：“船上的人”。她抬头看见我，放下笔，先不说话，把最旧那一册抽出来，翻到最后一页，找到我的名字，在后面写了一个“回”字。写完她才笑：“回来了？”她的袖口里露出一角很薄的信纸。我多看了一眼，她说是京都来的，一个替别人写和歌的人寄的：“那人也替人写信。我们俩比赛，看谁写得慢。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }]

