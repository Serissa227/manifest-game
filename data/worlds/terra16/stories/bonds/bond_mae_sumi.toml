hint = "她还不好意思欠使节家的人情。课本递过去，她只会笑着推回来。"
reply = "三天后课本还了回来，一页也没折。每页的边上却多了一行细细的假名，写的是这一页的公文用琉球话该怎么说。我拿去给先生看，先生翻了好几页，叹了口气：“这丫头，可惜进不了官生。”我回去学给她听，她低着头磨墨：“那我就在页边上当官生。”"
next = "b1"
effects = [{ kind = "affinity", person = "mae_sumi", value = 2 }, { kind = "bond", person = "mae_sumi", level = "C" }]

[[tracks.chapters.choices]]
key = "read_a_letter"
text = "请她挑一封家信念给我听，学那种说话的口气。"
reply = "她挑了一封渔夫写给妻子的信。信是她代笔的，念起来却是那渔夫的嗓音，粗声粗气。念到“你那边下雨没有”，我忽然想起家里屋檐下接雨的那口瓮，喉咙一紧。她停下来看了我一会儿，把一张白纸推到我面前：“要不要也写一封？这封不收钱。”"
next = "b1"
effects = [{ kind = "affinity", person = "mae_sumi", value = 3 }]

# B1：1554 秋冬，去暹罗的船过了归期。那叠按船名排好的纸，七个名字被红笔圈起来。
[[tracks.chapters]]
key = "b1"
title = "没回来的船"
text = "一条去暹罗的船过了归期半个月，还没有回来。码头上那几户人家一天比一天安静，有个妇人站在米铺门口，忘了自己要买几升。真栄澄照常给他们写信，写好了不封，收进一只木匣：“等船回来，一起交。”那天我去她家还书，她不在屋里，桌上压着一叠纸，就是她袖子里那些纸片，攒成了厚厚一叠，按船名一沓一沓排好，每沓用细绳扎着。最上面那一沓写着去暹罗那条船的名字，底下七个名字，都被红笔圈了起来。她端着茶进门，看见我在看，没有去收，只把茶放在我手边。“要是船回不来，”她说，“总得有人知道船上是谁。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

