# S：1556 年 12 月，北风起，进贡船出港。名簿最后一页，我的名字后面还空着。
[[tracks.chapters]]
key = "s"
title = "带回来的故事"
text = "北风起了，进贡船赶在年底出港，我跟船去福州。起锚前，真栄澄到码头来送我，名簿夹在胳膊底下，比开春时又厚了一指。她说过了年，她要去首里城替女官们抄文书：“听说新王的册封使迟早要来，首里缺会写字的人。”名簿她会一直记下去。她把簿子翻到最后一页给我看。最末一行是我的名字，后面还空着。“等你回来，我在这后面写个‘回’字。”她说，“要是回不来……”她没说下去。码头上的风很大，把她的头发吹进了嘴里，她用手指勾出来，又被吹了进去。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_mae_sumi" }, { kind = "flag", flag = "c7_bond_mae_sumi_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好每一趟回来，先把一路上船上人的名字带给她。"
requires = [{ kind = "bond", person = "mae_sumi", level = "A" }]
hint = "每趟回来先报船上人的名字——这样的约要记一辈子，你们的交情还没记到那一页；要么，名簿上一辈子的那一行，你已经留给了另一个人。"
reply = "她听完，没说好，也没说不好，从发髻上拔下那支细笔，舔了舔笔尖，在我的名字后面写了一笔，又一笔，写到一半停了。“这是什么字？”“半个‘回’。”她把笔插回发髻，“另一半，等你回来再写。”我说船上那么多人，一个个抄下来，怕是要抄到手软。她说那正好：“你手软了，就知道我这几年是怎么过的。”船上在喊人了。她把名簿合上，抱在胸前，低头用额头碰了碰封面，碰得很轻，像在神龛前低头。然后她把簿子夹回胳膊底下，退后两步，冲我挥手，挥的是那只空着的手。"
next = "done"
effects = [{ kind = "bond", person = "mae_sumi", level = "S" }, { kind = "relation", person = "mae_sumi", relation = "friends" }, { kind = "memory", memory = "mem-bond_mae_sumi-s", title = "带回来的故事" }, { kind = "flag", flag = "c7_bond_mae_sumi_promise" }, { kind = "flag", flag = "c7_tie_new_kogo_mae_sumi_taken" }, { kind = "start_track", track = "reunion_mae_sumi" }]

[[tracks.chapters.choices]]
key = "heart"
text = "把昨夜从廊下船旗上剪下的、写着我名字的那一角递给她，换她一截红线，什么也不说。"
requires = [{ kind = "bond", person = "mae_sumi", level = "A" }, { kind = "heart", person = "mae_sumi", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "mae_sumi", le = 17 }, { kind = "romance_open", romance_open = "mae_sumi" }]
hint = "这样的东西，要熟到一定的份上才换得出手；又或者，一生的约，你已经许给了另一个人。"
reply = "旗角剪得不齐，上面我的名字是她写的，墨被雨打得有点花。我递过去，什么也没说。她看了一眼就认出是谁的字，也什么都没问，从袖子里摸出一小绞红线，是绣那两朵扶桑剩下的，没剩多少。她抽出一截，在我左手的小指上绕了三圈，打了个结，线头用牙咬断，跟那天在后院石凳上一样。那角旗布，她缠在自己的手腕上，缠得很紧，袖口一放就遮住了。船上在喊人。她送我走到跳板前，手搭在我的手背上，停了很久，久到船上又喊了一遍。她才松开，往后退了一步：“去吧。”"
next = "done"
effects = [{ kind = "bond", person = "mae_sumi", level = "S" }, { kind = "heart", person = "mae_sumi", value = 12 }, { kind = "relation", person = "mae_sumi", relation = "crush" }, { kind = "flag", flag = "c7_bond_mae_sumi_romance" }, { kind = "memory", memory = "mem-bond_mae_sumi-s", title = "带回来的故事" }, { kind = "flag", flag = "c7_tie_new_kogo_mae_sumi_taken" }, { kind = "start_track", track = "reunion_mae_sumi" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好各走各的路：她去首里当书记，我去海上，十年后比谁记下的名字多。"
reply = "“比就比。”她把名簿往胳膊底下一夹，“我会赢的。”我问凭什么。“你在船上，一趟只记得下一船人。”她掰着手指，“我在首里，城里进进出出的，从王府的厨子到册封使带来的轿夫，一个都跑不掉。”我说海上的船多，十年里我能跑几十趟。她说那你就跑：“跑得越多，我记你越省事。一个人，写一遍就够了。”船上在喊人。她伸手在我背上一推，推得我差点踩空了跳板。我回头时，她已经转身往回走了，走了几步又转回来，冲我喊：“十年！不许耍赖！”"
next = "done"
effects = [{ kind = "affinity", person = "mae_sumi", value = 2 }, { kind = "relation", person = "mae_sumi", relation = "friends" }, { kind = "flag", flag = "c7_bond_mae_sumi_own" }, { kind = "start_track", track = "reunion_mae_sumi" }]

