# B2：1555 年五月初四，爬龙船。船旗上的名字；落水的少年也要写上去。
[[tracks.chapters]]
key = "b2"
title = "爬龙船的旗"
text = "五月初四爬龙船，使节家学也凑了一条船，我坐第三排划桨。前一晚，真栄澄替我们写船旗，把每个桨手的名字照琉球的读音写上去，念错一个，就罚自己喝一口凉水。只有我的名字，她照汉字的官样写了：“你是使节家的，写土了不好看。”坐我旁边的少年是开赛那天早上才顶上来的，旗上没有他。比赛划到一半，他一桨划空，整个人翻进了水里，两手死死抓着我的桨杆。船一歪，后面两条船擦着我们过去了。我们拖着他划到终点，船靠了岸，他还挂在船帮外头，呛得说不出话，岸上一片哄笑。真栄澄已经把船旗从竹竿上解下来，摊在岸边的石板上，在最下面添了一个名字，就是他。旁边有人嘀咕：“掉下去了，还算划过？”“他也划了，”她头也不抬，“名字得在上面。”"
window = [[1555, 5, 25], [1555, 7, 24]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1555, 5, 25], to = [1555, 7, 24] }, { kind = "age", le = 17 }]

