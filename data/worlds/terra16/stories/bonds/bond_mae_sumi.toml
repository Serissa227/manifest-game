# C1：1554 春，进贡船出港前三天。码头上排队写家信；她袖子里的小纸片。口头禅只在这里出现。
[[tracks.chapters]]
key = "c1"
title = "替人写的家信"
text = "进贡船出港前三天，那霸码头的石阶上排起了长队，都是来找真栄澄写家信的水手家人。她跪坐在一张矮几后面，拿砚台压着纸角。轮到一个卖鱼的老妇人，老人说一句，她写一句。老人说到“你要是敢在福州学坏，就别回来”，她的笔尖顿了顿，照样写下去；写完一句一句念回去，那一句到了她嘴里，成了“在福州别学坏，早点回来”。老人愣了愣，点了头。她这才折好封口，递给老人身后那个要上船的年轻水手，笑着说：“回来时，也把故事带回来。”水手红着脸接了。我在旁边站了一下午，看出一件怪事：每封信封好，她都从袖子里摸出一张小纸片，飞快地记下一个名字，再塞回去，袖口越来越鼓。队伍还有半条街长，她抬头看见我，拿笔杆朝我一点：“使节家的学生，闲着就来磨墨。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "family_access_naha_envoy_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "grind_ink"
text = "坐下替她磨墨，排队的人念一句，我也帮着写一句。"
reply = "我写的汉字一笔一画，横平竖直。她凑过来看了一眼，笑得肩膀直抖：“你这是写信，还是刻碑？”我只好把字写得圆一点，写到后来，手腕酸得提不起来。天黑时队伍总算排完了，她提起茶壶，壶里只剩一个碗底。她倒出来，自己喝了一半，把碗推到我面前。"
next = "c2"
effects = [{ kind = "affinity", person = "mae_sumi", value = 3 }, { kind = "skill", skill = "calligraphy", value = 8 }]

[[tracks.chapters.choices]]
key = "ask_the_slip"
text = "问她袖子里那些纸片上写的是什么。"
reply = "她把袖口一拢，笑眯眯地说：“是名字，不给你看。”我又问是谁的名字，她就换了琉球话，又快又密，一个字也不让我听懂。一串话说完，她把袖口又拢紧了些，冲队伍里招招手，叫下一个人上前。"
next = "c2"
effects = [{ kind = "affinity", person = "mae_sumi", value = 2 }]

# C2：1554 夏，久米村的屋檐下。官话公文换假名家信；“你奶奶会以为你欠了她钱”。
[[tracks.chapters]]
key = "c2"
title = "候文与官话"
text = "家学的先生叫我练写给福州官府的公文，课本是早年官生从南京带回来的，纸边都翻毛了。真栄澄来借这本课本：她写家信用的是假名，一句一个“候”，写给官府的那一套，她一个字也不会。我们在久米村一户人家的屋檐下摆开纸笔，做起了交换。我教她公文怎么起头、怎么称呼、碰到“布政司”三个字要另起一行抬头写；她教我假名信里怎么问候家里的长辈。我照她教的给祖母写了一段，她拿过去念，念到第二句就笑得直不起腰：“你这样写，你奶奶会以为你欠了她钱。”“哪里不对？”“哪里都对，”她擦着眼角，“就是太对了。”她把我开头那句“谨启”划掉，在旁边写了一行：“家里的芭蕉结果了没有？”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

