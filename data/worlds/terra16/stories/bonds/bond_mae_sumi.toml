key = "copy_names_back"
text = "答应她：以后每到一个港口，就把船上人的名字抄回来给她。"
requires = [{ kind = "affinity", person = "mae_sumi", ge = 50 }, { kind = "bond", person = "mae_sumi", level = "C" }]
hint = "她这一问问得很轻。你们还没熟到能接下这件托付的份上，这时候答应，她也只当是一句客气话。"
reply = "她没道谢，把簿子翻到最后一页，用指甲在纸上划了一道浅浅的印子：“从这里往后，是你的。”我问抄错了怎么办。“抄错了，也比没人抄好。”她又把那道印子描了一遍，像是怕风把它吹平了。"
next = "a2"
effects = [{ kind = "affinity", person = "mae_sumi", value = 2 }, { kind = "bond", person = "mae_sumi", level = "B" }]

[[tracks.chapters.choices]]
key = "first_name"
text = "问她：名簿上的第一个名字是谁？"
reply = "她翻到第一页。第一行的字歪歪扭扭，墨也淡。“是我父亲。”他随进贡船去福州，回程病死在船上；船回到那霸，王府的簿子上只记了船回来了。“那年我八岁，刚学写字。”她用指头摸了摸那一行，“我学会写的头一个名字，就是他。”"
next = "a2"
effects = [{ kind = "affinity", person = "mae_sumi", value = 3 }]

# A2：1556 夏秋。姊妹神的手巾，左边那朵扶桑拆了三回。
[[tracks.chapters]]
key = "a2"
title = "姊妹神的手巾"
text = "琉球的女人送兄弟出海，要送一方自己绣的手巾，说姊妹的魂会附在上面，跟着船走，替他挡风浪。真栄澄在家学后院的石凳上咬断最后一根线头，把一方手巾递过来。白麻布，一角绣着两朵扶桑花，左边那朵比右边大了一圈，针脚密得对着太阳也透不过光。“左边那朵拆了三回，”她说，“越拆越大。”我还没伸手，她的脸先红了，把手巾往我面前一推，嘟囔道：“我又不是你姊妹。”停了一会儿，她又补了一句，声音低下去：“可你要是走远了，总得有一样东西跟着。”"
