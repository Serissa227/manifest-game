# A1：1556 春，三重城的石堤。麻绳装订的名簿；“朝廷记船，不记人”。
[[tracks.chapters]]
key = "a1"
title = "一册名簿"
text = "开春的一个傍晚，真栄澄带我上了三重城的石堤。她怀里抱着一册书，麻绳装订，封面一个字也没写。翻开来，是那些纸片：这两年她袖子里的、桌上的、木匣里的，一张张誊清了，一条船一页，没回来的人，名字上画着红圈。“我想给那些出了海就没回来的人家，留一本查得到的簿子。”她说，“朝廷记船，不记人。哪条船沉了，王府的簿子上写一行；船上是谁，没人写。”她翻到最后一页。那一页只写了一半，下半截还白着。海风把页角掀得哗哗响，她伸手按住。“你以后跟着使节的船走，”她没看我，看着港口，“能不能把每条船上的名字，抄回来给我？”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "naha"
cast = ["mae_sumi"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

