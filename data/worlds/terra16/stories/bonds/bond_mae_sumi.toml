# 真栄澄：替人写的家信（bond_mae_sumi）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用两条轨道 key、章节 key、at = naha 与各章窗口。
# 标签：GL（自创主角性别由玩家定：女主角时为 GL，男主角时为 BG；真栄澄 romance = any）。学院同学羁绊线，academy = true；重逢轨道不设 academy。
# 人物：真栄澄 mae_sumi（1540-12-16，女，祝女亲族的女孩，替出海人家写家信）；主角 custom_naha_envoy（模板生年 1540-01-01，性别由玩家定）。
#   学院期 1554-01—1556-12：主角 14—16 岁，真栄澄 13—15 岁（1556-12-16 才满 16）。A1、A2 的心动与 S 的 crush 都只写在意、脸红、递信物、手背上停一下；
#   S 的 heart 选项写成交换信物、不说破，不告白。重逢 1562 年两人 21—22 岁，love 落点才写吻，要 romance 旗标 + 心动 ≥ 24 + 双方满 18。
# 依据·史实：那霸的进贡船往福州（琉球馆）；久米村是闽人后裔聚居、教汉文的地方，琉球派官生入南京国子监；三重城是那霸港口的石堤与城台，送船的人在那里挥手巾；
#   琉球“姊妹神”（をなり神）的信仰：姊妹的灵力护佑出海的兄弟，女人送出海的人一方手巾（ティサージ）；那霸的爬龙船在五月初四；
#   1555 年尚清王去世、1556 年尚元继位，1562 年明朝册封使郭汝霖、李际春到那霸册封尚元；十六世纪琉球仍有船往暹罗、马六甲。正文一律用“听说”的口吻，不写日期细节。
# 依据·原创：真栄澄袖子里的名字纸片与那册名簿（封面后来写上“船上的人”）；卖鱼的老妇人与要上船的年轻水手；官生课本页边的假名小字；
#   去暹罗的船与出港簿上少记的两个少年；爬龙船的船旗与落水的少年；她父亲的名字；扶桑花手巾；半个“回”字。
# 待核：1555 年五月初四约当公历 6 月上旬（窗口 05-25..06-10 照简报）；册封使到港的月份（正文只说“这一年”）；三重城的筑成年代（十六世纪中叶，正文只当作港口的石堤）。
# 与简报的出入：S 章把“开春随进贡船走”改为“北风起时、年底出港”，码头送别与缺省“船已出港”才都落在 12 月的窗口里；
#   S 的 heart 选项把“船上的一角旗子”写成家学廊下那面爬龙船旗上写着主角名字的一角（B2 的旗，所有路径都挂在廊下）；
#   A2 的 not_a_sister 没有 item 效果，回复里手巾由她捡回去先收着，不写塞进主角手里。
#   B2 的落水少年是开赛当天早上才顶上来的、旗上原本没有他，船拖着他划到终点、靠岸时他还挂在船帮外，pull_him_out 与岸上添名字两件事才接得上。
# 秘密：名簿在 B1 露出一叠、A1 给主角看；本文件的羁绊章都没有 stage，不写见闻；名簿永远不进见闻。
# 缺省走向：C1—A2 的 default 不写效果，故事照走（她照样写信、记名字、绣手巾）；S 的 default 是船提前起锚、她赶到时船已出港——开重逢、设 c7_bond_mae_sumi_parted；
#   重逢的 default 是她寄来名簿的一页抄本，主角名字后面写着“回”（letter），设 c7_bond_mae_sumi_missed。
#   C1 default：那天的信写到天黑，她的袖子鼓鼓的。C2：课本没借出去，她照我念的格式记了几行。B1：那条船第二个月回来了，少了一个人。
#   B2：船旗挂在家学廊下，最下面那个名字墨色最浅。A1：石堤上只有她一个人，名簿抱回家，封面还是没写字。A2：那方手巾挂到家学廊下，挨着那面船旗。
# 羁绊阶梯：C2 lend_textbook 给 C；B1 match_the_roster 补签 C；B2 your_name_too 给 B；A1 copy_names_back 补签 B；A2 两个“收下”给 A + embroidered_kerchief + 回忆。
#   心动：A1 your_name_last +6；A2 bigger_flower +6（要求已有 6）；S heart +12（要求 12）→ 全选心动正好 24，够重逢的 love。
#   （简报决定表原写 S +10，算下来只有 22，永远到不了 24；照简报改为 +12。）
#   重逢 love 的 requires 只写心动 ≥ 24 与双方满 18，不再另写 c7_bond_mae_sumi_romance：心动只由故事效果产生，本文件里到 24 的唯一一条路就是 S 的 heart（同时设 romance），
#   两者等价；故事审计把重逢轨道单独跑，读不到另一条轨道设的旗标，写上它会报分支错误。
# 旗标：设 c7_bond_mae_sumi_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#   S 的 promise 与 heart 另设 c7_tie_new_kogo_mae_sumi_taken（配角线 tie_new_kogo_mae_sumi 据此改走“并肩的朋友”）。重逢 variants 读 _promise / _romance。
# 日程：不改。真栄澄 1557 年起在首里城抄文书、1562 年在那霸码头登记册封使随员，都是故事里的差事，日程仍在那霸。

