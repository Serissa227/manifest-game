# C7 重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。旧版（GPT）整篇作废，只沿用轨道 key、章节 key、地点与窗口。
# 标签：GB（玛格丽塔主动推进；主角诺埃尔）。
# 人物：玛格丽塔 margarita（1540-01-19，塞维利亚塔里法侯爵府的侍女）
#     × 诺埃尔·德·卡德纳 noel（1540-11-11，塔里法海峡骑士团最后的见习，在侯爵府当侍童）；生年差不到一年。
#   各章年龄：C1（1554 春）玛格丽塔 14、诺埃尔 13；A1（1556 春）16 / 15；S（1556-12）两人都是 16，心动选项的 16..17 成立；
#   重逢（1562）两人都已 21 以上，恋人效果合法。学院期（C1—S）只到 heart / crush。
# 依据：
#   史实——第二代塔里法侯爵佩尔·阿凡·德·里韦拉 1554—1558 年任加泰罗尼亚副王，常驻巴塞罗那，塞维利亚的府邸“彼拉多之家”由管家照管；
#         胡安·德·马尔·拉腊在塞维利亚开人文学校，搜集西班牙谚语（后来成书《俗语哲学》，1568）；
#         《高卢的阿马迪斯》（蒙塔尔沃本，1508）是当时最风行的骑士小说。
#   原创——扣工钱、请愿书、公账本、剑匣藏账、针线盒与红缎带、锚纹饰边、府门口的雨、洗衣房墙上的账；
#         马尔·拉腊给侯爵写信评理一事是虚构，只在一个选项里出现。
#   待核——马尔·拉腊学校开办的确切年份（正文只说“城里的学堂”）。
# 诺埃尔的伏笔（DECISIONS 2.2）：学院期只有 C1（她看呆了一瞬、诺埃尔嫌她盯着看）与 A1（她盯着诺埃尔的脸，诺埃尔别过脸）两处；
#   标题、选项、回复、回忆标题里不放；正文不用“他/她”指诺埃尔。揭开后的反应只在重逢的 variants.unveiled 与 laugh_at_her 回复里。
#   laugh_at_her 的选项文字被挡下时也会显示，所以写成“当年那笔糊涂账”，不点破。
# 羁绊阶梯：C2 finish_and_review → C；B1 make_grid 补签 C；B2 hide_in_sword_case → B；A1 keep_it_quiet 补签 B；
#   A2 take_lace / keep_the_knot → A + lace_edging + 回忆；心动 A1 +6、A2 +6、S +12 = 24，正好到重逢恋爱落点的门槛。
# 各章 default（玩家没来，正文不显示，写在这里备查）：
#   C1 请愿书最后签的是马厩里一个识字的马夫，管家记恨了他半年；C2 那本书被管家没收，玛格丽塔说她早背下来了；
#   B1 公账记到年底，管家扣的钱少了一半；B2 管家搜出那个旧枕头，里面只有羽毛——账本已经缝进她胸衣的衬里；
#   A1 针线间只剩她一个人，缎带一根根理好，最底下那条没动；A2 饰边缝在了她自己的领口上，打错的结朝里；
#   S 开春授剑那天没收到塞维利亚的信，红缎带还压在盒底（_parted，照样开启重逢）；重逢 没去塞维利亚，她托车夫捎来一封信（_missed）。
