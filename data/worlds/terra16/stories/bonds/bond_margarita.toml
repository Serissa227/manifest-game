text = "嫌书太厚，请她挑一段念给我听"
reply = "她挑了骑士在城堡底下守夜的那一段，站在木盆上念，念到情人在窗口露面，还换了一副细嗓子，比广场上的戏班子还卖力。念完她自己先红了脸，把书往洗衣篮底下一塞，拿湿床单盖住：“下回你自己看。”"
next = "b1"
