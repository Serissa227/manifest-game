[[tracks.chapters]]
key = "reunion"
title = "侯爵府的旧门"
text = "六年以后我回到塞维利亚。彼拉多之家的门还是那扇门，门环上的铜狮子掉了一只耳朵，也没人修。管家换了人。洗衣房的墙上钉着一块木板，板上用绳子拴着一本账，谁都能翻：谁哪天领了多少工钱，扣了多少，为什么扣，一笔一笔，字又大又歪。玛格丽塔从晾衣绳底下钻出来，腰上挂着一串钥匙，身后跟着两个小侍女。她看见我，愣在那里，手里的床单掉了一角在地上。然后她照旧冲了过来。“你听说了吗？——不，你肯定没听说。”她抓住我的袖子，“当年那笔碗碟钱，旧管家走的时候吐出来一大半。还剩最后一笔，新管家说要有人签字作保才肯付。”她晃了晃钥匙串，“这回签字的人，我还没找着。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "seville"
cast = ["margarita"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "margarita", text = "诺埃尔：听说今年有塔里法的骑士路过塞维利亚。我在府门口站了一下午，把过路的骑士都看了一遍，没有一个是你。告诉你几件事。旧管家走了，走之前把碗碟钱吐出来一大半，是我堵在他马车前头一笔一笔算出来的，车夫都看傻了。新管家是个瘦子，看字的时候鼻尖贴着纸，人倒不坏。公账挂在洗衣房的墙上，谁都能翻。小侍女们认字是我教的，先认“钱”，再认“扣”。还差最后一笔。瘦子说要有人签字作保，我说我认识一位骑士。瘦子说，那就叫骑士来。我说骑士忙。所以这封信托去塔里法的车夫捎给你。车夫叫胡安，爱喝酒，你给他一杯，别给两杯。哪天路过塞维利亚，就进来签个字；不路过也行，单子我钉在墙上，等着。那条红缎带还在我的针线盒底下——要不就在你那儿，你自己知道。玛格丽塔。又及：上面这些，你就当是风里听来的，别说出处。" }, { kind = "flag", flag = "c7_bond_margarita_missed" }]

