text = "六年以后我回到塞维利亚。彼拉多之家的门还是那扇门，门环上的铜狮子掉了一只耳朵。洗衣房的墙上钉着一块木板，用绳子拴着一本账，谁都能翻，字又大又歪。玛格丽塔从晾衣绳底下钻出来，腰上挂着一串钥匙，身后跟着两个小侍女。她看见我，冲到一半停住了。“小姐骑士”的事早传到了塞维利亚。她从我的帽子一直看到靴子，又从靴子看回来，脸一点一点红到了耳根。然后她扶着门框笑了起来，笑得弯下腰去。“我在针线盒里压了那么多年的缎带，你知道我当年以为……”她摆摆手，“算了，不说了。”笑够了，她擦擦眼角，照旧抓住我的袖子：“你听说了吗？——不，你肯定没听说。旧管家走的时候把碗碟钱吐出来一大半，还剩最后一笔，新管家要有人签字作保。”她晃了晃钥匙串，“签字的人，我还没找着。”"

