hint = "她跑出两步又折回来，把书要走了。偷读的书在侍童屋里过夜，她还放不下心。"
reply = "我熬了三个晚上读完，在最后一页夹了张纸条，只写一句：“巨人那一段太假。”过了两天，书又出现在我枕头底下，纸条下面多了一行，字比我的还歪：“那是你没见过巨人。”书底下还压着第二卷。"
next = "b1"
