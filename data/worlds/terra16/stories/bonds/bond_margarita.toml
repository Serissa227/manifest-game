# —— B1：1554 年秋冬，窗台上对账 ——
[[tracks.chapters]]
key = "b1"
title = "公账本"
text = "玛格丽塔开始记一本账。不记府里的进出，只记侍女们的：谁哪天被扣了多少，管家说是为了什么。本子是拿旧账簿的背面订的，字写得又大又用力。可她算不清进位，九个铜板加五个铜板，扳着指头算了三遍，三遍不一样。她抱着本子闯进侍童的屋子，那会儿我还在被窝里。“起来，”她掀我的被角，“你在宇宙志的课上学过算数。”“学的是算星星。”“星星不也是一颗一颗数的？”我从厨子那儿借来厨房的破损簿，两个人趴在窗台上对：她念一笔，我翻一页。对到十月，我的手停了。管家说打碎的那些碗碟，有一半在破损簿上根本找不到。玛格丽塔没出声，用指甲在那几行底下划了一道，又一道，纸都快划破了。“我就知道。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["margarita"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

