[[tracks.chapters.choices]]
key = "promise"
text = "约好她讨回工钱那天写信来，我回来替她作证"
requires = [{ kind = "bond", person = "margarita", level = "A" }]
hint = "这样一辈子的约，她还没把你当成能托付的人；又或者，你这一辈子的担保，已经押给了另一个人。"
reply = "“那天你一定得来。”她把针线盒夹在胳膊底下，“作证的名字，我已经用过你一回了，再用一回，不收钱。”“头一回你也没收钱。”“头一回你喝到了肉汤。”雨打在门洞的拱顶上。她伸出手，掌心朝上，我拍了上去，啪的一声。她的手冰凉，湿漉漉的，可拍得比我还响。车夫又咳嗽了一声，她瞪过去：“催什么，人又跑不了。”我上了车。走出老远，我回头看，她还站在门洞里，针线盒抱在胸前，盒盖关得好好的。开春的时候，塔里法收到一封信，信封上的字又大又歪，里面只写了一行：“讨回来一半。另一半，等你来签。”"
next = "done"
effects = [{ kind = "bond", person = "margarita", level = "S" }, { kind = "relation", person = "margarita", relation = "friends" }, { kind = "memory", memory = "mem-bond_margarita-s", title = "府门口的雨" }, { kind = "flag", flag = "c7_bond_margarita_promise" }, { kind = "flag", flag = "c7_tie_new_margarita_leonor_ruiz_taken" }, { kind = "start_track", track = "reunion_margarita" }]

[[tracks.chapters.choices]]
key = "heart"
text = "站在雨里，等她把盒底那条红缎带拿出来"
requires = [{ kind = "bond", person = "margarita", level = "A" }, { kind = "heart", person = "margarita", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "margarita", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "margarita" }]
hint = "那条缎带还压在盒底，她的手指碰了碰，又缩回来：雨里站得再久，你们的心也还没近到能等她拿出来；又或者，你的心意已经给了另一个人。"
reply = "我没上车，站在雨里等。车夫叹了口气，把帽檐拉低了。她终于从盒底抽出那条红缎带，抽得很慢，像怕扯断了。整只盒子都潮了，只有它是干的。她把缎带塞进我手心，又把我的手指一根一根按拢。“为什么是红的，”她说，“等成年了再见面，我再告诉你。”“现在说不行？”“不行。现在说了，你一路上都要笑话我。”雨水顺着她的睫毛往下淌，她也不擦。她握住我的手，握得很紧，像在心里数了三下，才松开，退回门洞里。“走吧，诺埃尔。别在车上睡着了，口水滴到缎带上。”马车动起来，我把攥着缎带的那只手揣进怀里，一路没松开。"
next = "done"
effects = [{ kind = "bond", person = "margarita", level = "S" }, { kind = "heart", person = "margarita", value = 12 }, { kind = "relation", person = "margarita", relation = "crush" }, { kind = "flag", flag = "c7_bond_margarita_romance" }, { kind = "memory", memory = "mem-bond_margarita-s", title = "府门口的雨" }, { kind = "flag", flag = "c7_tie_new_margarita_leonor_ruiz_taken" }, { kind = "start_track", track = "reunion_margarita" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好她离开侯爵府那天，我来接她，请她喝一杯"
reply = "“一杯？”她把针线盒啪地合上，“我在这儿忍了这么多年，一杯就想打发我？”“那就一桶。”“一桶，还得你扛着。”她笑出了声，雨水顺着下巴往下滴。她从针线盒里摸出一截划布用的粉笔头，在我的剑匣盖上写了两个大字：“欠一桶。”写完把粉笔塞给我：“画押。骑士说话不算数，我就拿着这只匣子去塔里法要账。”我在字底下画了个十字，她才满意，伸手把我往车门里一推：“快走，车夫的胡子都湿透了。”我坐稳了再掀开帘子，她已经跑回庭院，针线盒顶在头上挡雨。"
next = "done"
