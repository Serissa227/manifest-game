# —— C1：1554 年春，庭院里的请愿书 ——
[[tracks.chapters]]
key = "c1"
title = "管家扣的工钱"
text = "侯爵去了巴塞罗那，彼拉多之家归管家管。这个月发工钱，侍女们一人少了三成，管家说是打碎碗碟的钱。我被马厩的钟敲醒，披着外衣、打着哈欠穿过庭院。喷泉边站着一个侍女，举着一张纸挨个拦人：厨子摆手，马夫装聋，账房的书记绕着柱子走了。纸上的墨还没干，被她一甩一甩，滴在了瓷砖上。她看见我，几步冲过来，话到嘴边却停了，就那么看着我，看了好一会儿。“看够了？”我说，“我还没睡醒，脸上没长字。”她眨了眨眼，把纸拍在我胸口：“你识字吧？签个名。这上面写着，厨房这个月一只碗也没碎。我叫玛格丽塔，我的名字已经签了，就缺一个识字的作证。”纸上她的名字又大又歪，后面跟着七个画的十字。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["margarita"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_seville_tarifa" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "sign_it"
text = "签。签完回去接着睡。"
reply = "我在七个十字底下签了名。手还没醒，字歪得像被马踩过。她举起来对着太阳照了照：“骑士的字就这样？”说完转身就拿进了管家的屋子。那天中午，我的汤里多了一块肉。第二天，全府都知道侍童诺埃尔替侍女们作了证。她抱着一摞床单跟我在走廊里擦肩而过，眨了一下眼：“我可没说是我说的。”"
next = "c2"
effects = [{ kind = "affinity", person = "margarita", value = 3 }]

[[tracks.chapters.choices]]
key = "ask_the_endgame"
text = "先问她：闹大了，打算怎么收场？"
reply = "“收场？”她笑出了声，“我还没开场呢。”她把笔往我手里一塞，墨水顺着笔杆淌到我指头上，甩了两下没甩掉，我只好签了。第二天全府都在猜签名的是哪个侍童。她端着一盆水从我身边过去，嘴抿得紧紧的，眼睛在笑。"
next = "c2"
effects = [{ kind = "affinity", person = "margarita", value = 2 }]

# —— C2：1554 年夏，洗衣房后面的骑士小说 ——
[[tracks.chapters]]
key = "c2"
title = "阿马迪斯"
text = "洗衣房后头晾着一院子床单。玛格丽塔坐在两排床单中间一只倒扣的木盆上，膝盖上摊着一本书，书角卷得像晒干的菜叶，页边一圈肥皂水的黄印。我是来找丢了的袜子的，她吓得把书往背后一藏，看清是我，又拿了出来。“《高卢的阿马迪斯》。”她压低声音，“管家知道了，又要扣钱。”她把书塞进我怀里：“你们侍童将来都要当骑士，先学学人家。阿马迪斯为了一个约定，走遍了天涯海角。”我翻了几页：“他一天打三场仗，一口饭也不吃。我饿一顿就站不住。”“还给我！”她伸手来抢，我把书举高，她够不着，气得跺脚。“府里也有一位骑士，就像书里写的。”她忽然说，“你知道是谁吗？”我还没开口，她已经抱起洗衣篮，从床单底下钻出去跑了。书还在我手里。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["margarita"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

