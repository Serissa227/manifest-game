# —— A2：1556 年夏秋，一段锚纹饰边 ——
[[tracks.chapters]]
key = "a2"
title = "一小段饰边"
text = "府里谁都知道，玛格丽塔领口上那圈花边是夫人赏下的旧东西，她偏说是自己挑的。这一回她来找我，手背在身后，背了半天才拿出来：一小段新编的饰边，白线，花样是一串小小的锚。线轴她绕了一个月，我见过她夜里就着灯，一下一下地挑线。边上有个结打错了，鼓起一个小疙瘩。“这是我自己编的，”她说，“不是夫人的。”“我听见了。”“我自己编的。”她又说了一遍，把饰边拍在我手心里，“缝在你的领子上。怎么缝，你自己看着办。”说完她就站在那里，不走，也不看我，只盯着那个打错的结。"
