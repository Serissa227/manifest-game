# —— S：1556 年 12 月，府门口 ——
[[tracks.chapters]]
key = "s"
title = "府门口的雨"
text = "年底我要回塔里法，开春授剑。马车停在府门外，雨从早上下到中午，车夫在车辕上缩成一团。我刚把剑匣塞上车，身后有人喊我的名字。玛格丽塔从庭院里跑出来，没披斗篷，头发湿了一半贴在脸上，怀里抱着她的针线盒。“我想好了，”她喘着气，“要么把姐妹们的工钱一文不少讨回来，要么揣着攒下的钱走出这扇门。总之，我不会一辈子替管家缝扣子。”“就为说这个，淋成这样？”“还有。”她低头打开针线盒，又合上，又打开。雨点打在盒盖上，噼噼啪啪。车夫咳嗽了一声。“你别催，”她头也不抬，“我在找东西。”"
