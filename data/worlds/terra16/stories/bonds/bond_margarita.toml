key = "friend"
text = "陪她去讨最后一笔工钱，在单子上签下现在的名字"
reply = "新管家是个瘦子，坐在账房里，鼻尖快贴到纸上。我在单子末尾签了名，后面添上塔里法海峡骑士团的头衔。瘦子看看签名，又看看我腰上的剑，一句话没说，开柜子数钱。玛格丽塔把钱一枚一枚数进布袋，数完，把墙上那本账取下来，在最后一行写了两个字：“讨回。”写完把笔一扔。那天晚上，洗衣房里拼了两张桌子，侍女们吃了一锅炖羊肉。席上玛格丽塔讲当年那张请愿书，讲了三遍：头一遍，我是被她从被窝里拽出来的；第二遍，我是自己从楼上冲下来的；到第三遍，我是骑着马进的庭院。“你记错了。”我说。她举起杯子，冲小侍女们眨眼：“我从来也没说过我记得清楚。”"
