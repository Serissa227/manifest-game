# S：1556 年 12 月，长屋与河岸。一份刻着拉坎本名的分账木牍。
# default：开春我出海那天拉坎没来河岸，木牍挂在了他家的柱子上，挂在欠债木牌旁边（开重逢，记 parted，无关系变化）。
[[tracks.chapters]]
key = "s"
title = "自己的名字"
text = "年底，拉坎第一次替家里跟桨手们立分账。木牍摊在长屋的桌上，该刻的是叔叔的名号；他握着刀，刻下的却是自己的名字，一笔一笔，刻得很深。叔叔站在门口看着，没进来，也没走开。刻完他把刀往桌上一放，手还在抖。见我盯着他的手，他先笑了：“刀太沉。”桨手们挨个过来，在名字底下按了手印。我开春就要随船出海。他送我到河岸，木牍夹在胳膊底下，一路没说话。到了水边，他才开口：“以后汤都谁的船最公道，你回来就知道是谁的。”潮水在脚下来来回回。他把木牍举到我眼前，名字朝着我，等我说点什么。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "tondo"
cast = ["lakan_pula"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

