[[tracks.chapters.choices]]
key = "promise"
text = "约好：等我们成年，一起跑一趟桨手都拿工钱的船。"
requires = [{ kind = "bond", person = "lakan_pula", level = "A" }]
hint = "木牍上刻的都是一辈子的账。你们的交情还刻不进去；要么，这样一辈子的账，你已经和另一个人立过了。"
reply = "我说，等我们都成年了，一起跑一趟船：从汤都到民都洛，桨手每人一根签，刻满了就发工钱。拉坎听完，没像平常那样先来一串漂亮话。他低头盯着木牍上自己的名字，半天没动，然后握住一角，用力一掰。木头“咔”地断了，断口参差。他把掰下来的那一角塞进我手里，剩下的又夹回胳膊底下。“这个给你当凭据。”他说，“我身上没有好东西，这块是我头一回用自己的名字刻的。少了一角的约，看你敢不敢不来。”我把那一角木头攥在手里，断口硌着掌心。他已经转过身，背对着我站在水边，过了一会儿才说：“到时候我掌舵，你算账。我算不拢的价，还得你来。”"
next = "done"
effects = [{ kind = "bond", person = "lakan_pula", level = "S" }, { kind = "relation", person = "lakan_pula", relation = "friends" }, { kind = "memory", memory = "mem-bond_lakan_pula-s", title = "自己的名字" }, { kind = "flag", flag = "c7_bond_lakan_pula_promise" }, { kind = "flag", flag = "c7_tie_new_kinjo_shin_lakan_pula_taken" }, { kind = "start_track", track = "reunion_lakan_pula" }]

[[tracks.chapters.choices]]
key = "heart"
text = "说等我们都长大，我回汤都时，有一句话要当面问他。"
requires = [{ kind = "bond", person = "lakan_pula", level = "A" }, { kind = "heart", person = "lakan_pula", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "lakan_pula", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "lakan_pula" }]
hint = "潮水退了又涨，那句要留到长大再问的话还是没浮上来：心还没靠得那么近；要么，同样的话你早已留给了另一个人。"
reply = "我说，等我们都长大了，我回汤都，有一句话要当面问他。现在先不问。拉坎愣住了，举着木牍的手慢慢放下来。他张了两回嘴，头一回什么也没说出来；第二回，他说：“那我先不告诉你，我会怎么答。”说完他就不看我了，看河。我也看河。巴石河上的帆一张一张收了，对岸长屋的灯一盏一盏点起来，我们并肩站着，从第一盏看到最后一盏。天黑透的时候，他的手背碰了我的手背一下。就那么一下，很快就挪开了，像是不小心。他把木牍换到另一只胳膊底下，清了清嗓子：“潮要退了。”我说是。我们又站了一会儿，才往回走。"
next = "done"
effects = [{ kind = "bond", person = "lakan_pula", level = "S" }, { kind = "heart", person = "lakan_pula", value = 12 }, { kind = "relation", person = "lakan_pula", relation = "crush" }, { kind = "flag", flag = "c7_bond_lakan_pula_romance" }, { kind = "memory", memory = "mem-bond_lakan_pula-s", title = "自己的名字" }, { kind = "flag", flag = "c7_tie_new_kinjo_shin_lakan_pula_taken" }, { kind = "start_track", track = "reunion_lakan_pula" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟他赌：成年以后在汤都码头比一比，谁的船先装满。"
requires = []
reply = "“赌什么？”他把木牍往胳膊底下一夹，眉毛已经挑起来了。我说赌一顿筵席。他“嗤”了一声：“筵席我家天天有。”他想了想，伸出手，“赌一条船。输的人，把赢家船上桨手一季的工钱全包了。”“你家的船，还是你的船？”“我的船。”他答得很快，答完自己也怔了一下，像是头一回听见这三个字从自己嘴里出来。我们在河岸上击了掌，声音很响，惊得水边的白鹭飞起来两只。然后转身，一个往长屋，一个往码头。走出十几步，我回头，他也正回头，两个人都装作在看别处。"
next = "done"
effects = [{ kind = "affinity", person = "lakan_pula", value = 2 }, { kind = "relation", person = "lakan_pula", relation = "rivals" }, { kind = "flag", flag = "c7_bond_lakan_pula_own" }, { kind = "start_track", track = "reunion_lakan_pula" }]

