text = "收下第四把，也把刻裂的那三把一起要走。"
requires = [{ kind = "affinity", person = "lakan_pula", ge = 80 }, { kind = "bond", person = "lakan_pula", level = "B" }]
hint = "这份东西太重。你们还没熟到这一步，这时候收下，他反倒要后悔拿了出来。"
