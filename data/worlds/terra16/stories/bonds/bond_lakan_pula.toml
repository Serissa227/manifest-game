# 重逢：1563 年，巴石河口与筵席外的树荫。桨手们按过手印的分账木牍。
# variants：promise（船头那块木牍缺了一角）、own（他先提赌约）；落点关系只在这里出现。
# default：错过了这一季，拉坎托福建帆船捎来一封信（letter + missed）。
[[tracks.chapters]]
key = "reunion"
title = "河口的新桨手"
text = "隔了七年，我的船又回到汤都。拉坎的船泊在巴石河口，船身新漆过，桨架上的桨却只剩从前的一半。他本人不在船上，在筵席外头的树荫底下盘腿坐着，跟一圈桨手一人一根签地分账，小刀在他手里转得很顺。我隔着人喊：“拉坎，筵席在里头，你坐错地方了。”他抬头，手一松，一捆签子撒了一地。他瘦了，颧骨都出来了，笑声倒没变，隔着十几步就听得见。他也不捡签子，跨过来一把抓住我的胳膊：“你来得正好，有个价我算不拢。”桨手们在后头一根一根捡签子，捡一根，看我一眼。他的船头挂着一块分账木牍，日晒雨淋得发了黑，上头那个名字还认得出来。"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "tondo"
cast = ["lakan_pula"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "lakan_pula", text = "你今年没回来。福建船的船主说你的船在南边过冬，我就托他捎这封信。他问我写什么，我说写账。先说账。今年我头一回拿自己的船跟桨手签分账，签的是我的名字，不替家里，也不替叔叔。十一个人，十一根签，每根签头上我都刻了一道桨的记号，签底下刻名字，他们的在左边，我的在右边。有三个不会刻字，按的手印，手印比字还大。叔叔去年走了。柱子上那块木牌，我摘下来烧了，烧了半个早上，那木头比我想的硬。船小了，桨只有从前一半，桨手都拿工钱，所以出一趟河口我要算三遍。算不拢的时候我就想，要是你在，准先笑我，再替我算。眼下就有一个价我算不拢，留着等你回来。那截断桨剩下的木头，我削了一根新签，上头刻的是你的名字，挂在船头。桨手问这是谁的份，我说是还没回来的那个人的。拉坎。又：船夫们说今年东北风来得早，你回来，记得赶这一阵风。" }, { kind = "flag", flag = "c7_bond_lakan_pula_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "坐下听他跟桨手分完账，再跟他去吃一顿不用撑场面的饭。"
requires = []
reply = "我在树荫下找了块石头坐下。他分得很慢，每一根签都先递给桨手，桨手刻完了，他再刻自己的；刻错一道，就当着所有人刮掉重来。分到天黑，他没开筵席，只在河滩上生了一堆火，烤了几条鱼，请我和桨手们一起吃。鱼烤得有点焦。他拿手撕着吃，说起叔叔去年死了。“柱子上那块木牌，”他说，“我摘下来，当着那些人烧的。烧了半个早上才烧透，那木头太硬。”他说得很平常，像在报一个价。火边的老桨手往火里添了一根柴，什么也没说。吃完了，他把鱼骨头往河里一扔，问我：“我那个算不拢的价，明天还来帮我算吗？”我说来。他点点头，往沙上一躺，看着天，过了很久才说：“七年，你倒一点没变。”"
next = "done"
effects = [{ kind = "affinity", person = "lakan_pula", value = 5 }, { kind = "relation", person = "lakan_pula", relation = "friends" }, { kind = "flag", flag = "c7_bond_lakan_pula_landing_friend" }, { kind = "memory", memory = "mem-reunion_lakan_pula", title = "河口的新桨手" }]

[[tracks.chapters.choices]]
key = "rival"
text = "跟他赌这一季：谁的船先装满蜂蜡。"
requires = []
reply = "他一拍大腿，刚捡回来的签子又撒了一半：“就等你这句！”那一季，汤都的码头都知道河口有两条船在较劲。他天不亮就带桨手上游收蜡，我就去民都洛截福建帆船要的货；他压我的价，我抬他的价，有一回在同一个蜡户门口撞上，两个人同时开口，把蜡户吓得关了门。季风快转的时候，两条船并排泊在河口过秤。我的船差他半船蜂蜡。他赢了一坛酒，抱着坛子在码头上走了一圈，见人就说。走完一圈，他回到我船边，把坛子往船舷上一搁，倒了两碗，一碗推给我：“半坛。剩下半坛留着，下一季你赢回去。”我喝了一口，酒很冲。他眯着眼看我：“你那半船，不是故意差的吧？”我说不是。他说那就好，不然赢得没意思。"
next = "done"
effects = [{ kind = "affinity", person = "lakan_pula", value = 3 }, { kind = "relation", person = "lakan_pula", relation = "rivals" }, { kind = "flag", flag = "c7_bond_lakan_pula_landing_rival" }, { kind = "memory", memory = "mem-reunion_lakan_pula", title = "河口的新桨手" }]

[[tracks.chapters.choices]]
key = "love"
text = "把那把断桨刻的勺放回他手心，说这回我不急着走。"
requires = [{ kind = "flag", flag = "c7_bond_lakan_pula_romance" }, { kind = "heart", person = "lakan_pula", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "lakan_pula", ge = 18 }, { kind = "romance_open", romance_open = "lakan_pula" }]
hint = "当年那句话没有说出口，到今天也说不出口了。他只是笑着，弯腰去捡地上的签子。"
reply = "桨手们散了，树荫底下只剩我们两个。我从怀里掏出那把勺，勺边被我用了七年，磨得比当初更圆。我把它放进他手心，说：“当年那句话，我回来问了。这回我不急着走。”他低头看着勺子，拇指在勺边上来回摸了两遍。然后他合上手，连勺带我的手一起握住，握得很紧，指节都白了。“我刻了七年勺子，”他说，嗓子有点哑，“刻坏的堆了半间屋子。就等这一天。”我还没开口，他就凑过来吻了我，很快，像怕我躲。我没躲。他又吻了一次，这回慢了。那晚河口涨潮，水漫上了石阶。我们坐在他的船上，听潮水一下一下拍着船底，听到后半夜，都没回长屋。"
next = "done"
