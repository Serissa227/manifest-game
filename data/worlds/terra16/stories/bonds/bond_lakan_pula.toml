hint = "这句话要等你们更近一些才说得出口。今天说了，他只会当你在客气。"
reply = "他没接话，只“嗯”了一声。下一回大督家开筵，他旁边的位置一直空着，谁来坐都说有人。我进门时，满座的人看着我从他们中间走过去坐下。我从怀里掏出那把木勺，他低头看了一眼，把盘里最好的一块鱼拨进了我的碗。"
next = "s"
