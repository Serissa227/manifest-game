next = "b2"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 3 }, { kind = "skill", skill = "cartography", value = 6 }]

[[tracks.chapters.choices]]
key = "argue_detour"
text = "跟她争：口述里一个字没提的那一弯，凭什么要多绕。"
reply = "“凭那儿有个强盗窝。”她说，“驼夫都绕。”我说口述里一个字也没提。“讲路的人不好意思说自己怕。”我们去客栈问，问到第三个赶驼人，他一愣，压低嗓子说那个山口确实没人走，前年有一支驼队在那里丢了一半的货。哈迪贾没再说什么，回去把那一弯描粗了些，旁边写：驼夫都绕，讲的人不肯留名。"
next = "b2"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 4 }]

# —— B2：1555 年，仓门的钥匙 ——
[[tracks.chapters]]
key = "b2"
title = "仓门的钥匙"
text = "帘子后头那个位置，连着三回没有人。第四回，我在去讲席的路上看见了她：头巾底下露出一截皮绳，绳上挂着一把铁钥匙，长得能当门闩。她走到染坊街口，站住，又掉头往回走。我跟着她一直走到城门边的货仓。仓门开着，盐袋码到了房梁，她父亲不在柜台后头。“他病了。”她背对着我开柜子，“病了一个多月。我叔叔说，仓里不能没人，讲席也不缺我一个。”她把钥匙从脖子上摘下来，攥在手里，攥得指节发白。“我从小就怕这一天。怕哪天他们开口说：别念了，回来数盐袋。”她转过身来。“今天，他们开口了。”"
