# —— S：1556 年腊月，城门洞底下 ——
[[tracks.chapters]]
key = "s"
title = "别替我走完"
text = "腊月，卡拉维因的讲席散了。往海边去的骡队后天出城，我跟着去上船；哈迪贾家的驼队开春南下，她父亲答应了：她跟着走，一边守货，一边记路。她来送我，带着那张图，在城门洞底下摊开，捡了两块石子压住纸角。“先说好一件事。你寄来的路，我画；我走过的路，寄给你。可你寄来的，我不当成我去过的；我寄去的，你也别当成你去过的。”“画在一张图上，怎么分？”“你的用你的记号，我的用我的。”她把炭笔塞给我，“别替我走完。”风从城门外灌进来，一块石子滚开了，她伸脚踩住了纸角。"
