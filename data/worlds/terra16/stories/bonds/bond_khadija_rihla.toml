[[tracks.chapters.choices]]
key = "draw_camels"
text = "趁她追出去看驼队，在那条弯路旁边画几峰骆驼。"
reply = "我画了三峰，腿太短，脖子太粗。哈迪贾回来，凑近看了看：“你的骆驼像狗。”我伸手要擦，她把我的手拨开：“别擦。有它们在，谁一看都知道这是商路，不是城里的巷子。”第二天我再去，那三只“狗”旁边多了一行小字，写的是我的名字，后头跟着两个字：所画。"
next = "b1"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 3 }]

# —— B1：1554 年秋，先生出的画图题 ——
[[tracks.chapters]]
key = "b1"
title = "画错的井"
text = "萨阿德家的人进了城，讲席停了半个月。重开那天，先生出了一道题：他照一位旅人的口述，念一段从非斯往南到绿洲的路，走几天，经几口井，在哪里过河，我们照着画，画完拿来对。帘子里外各交上一张。先生把两张图并排举到窗前，看了很久，用笔杆敲了敲我那张：“你漏了一口井，那是歇脚的地方。照你这么走，第三天夜里没水喝，睡石头上。”又敲哈迪贾那张：“你多绕了半天。口述里没有这一弯。”帘子后头传出她的声音，一点也不服：“口述里也没说要直着走。”讲席上好几个人笑出了声。散了讲，两张图并排摆在窗台上，一张少一口井，一张多一弯。她隔着帘子叫住我：“你漏的那口井，是没听见，还是觉得不要紧？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "fez"
cast = ["khadija_rihla"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

