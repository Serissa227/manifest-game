[[tracks.chapters]]
key = "reunion"
title = "多了脚印的图"
text = "七年后，城门边那间货仓换了新门，钥匙还挂在哈迪贾脖子上。她坐在盐袋码成的桌子后头，面前站着一个刚回城的赶驼人，她问一句，写一句：“到塔菲拉勒特几天？哪口井有水？这是你自己走的，还是听人说的？”那本路程表已经写满了半本，每一段末尾都落着一个名字。她的图大了一倍。往南的路上画着一串小脚印，一直走到塔菲拉勒特，往东还有短短一截。我把这几年画的海图摊在她的图旁边。她挪了挪，两张纸的边对上了：她的沙漠，我的海岸。中间还隔着一大片，从她最后一个脚印，到我最后一个港口。“那里有人。”她用指甲在那片空白上点了点，“只是我们俩都还没去。”"
