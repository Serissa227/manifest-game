# —— A2：1556 年秋，骆驼皮的旅信匣 ——
[[tracks.chapters]]
key = "a2"
title = "旅信匣"
text = "秋天，我上船的事定了下来。哈迪贾托人带话，叫我去仓里一趟。她从盐袋后头拿出一只皮匣子：骆驼皮的，四角缝着双线，扣上盖子翻过来倒过去，里头的东西一点不晃。“驼队装信用的。骆驼颠一路，信也不折一个角。”她说，“缝了一个夏天，断了五根针。”匣子里放着一张图。非斯在正中，四周画满了路，往南的，往东的，往海边的，每条路旁都写着讲路人的名字。最外面一圈却一笔没画，只有纸的本色。我问那一圈怎么不画。“那一圈有人。”她把图抚平，“我还没去过，也还没人讲给我听。留白，是留给要去的人的。”"
