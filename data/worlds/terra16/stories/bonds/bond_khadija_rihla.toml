reply = "领头的赶驼人看了那张图半天，指着第二个点：“这口，干了。”他说他们在那儿挖了一下午，挖出来的只有湿沙，两峰骆驼就是在那之后倒下的。哈迪贾在那个点上画了个叉，旁边写：一五五四年夏，干，领头的说。她又问下一口井要走多久，他伸出四个手指头。回去的路上她一直攥着炭笔。“路会变。”她说，“图不跟着变，就会把人领到干井边上。”"
