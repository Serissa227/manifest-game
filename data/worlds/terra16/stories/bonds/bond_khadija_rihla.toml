# —— C1：1554 年春，讲席上没听清的那个盐矿 ——
[[tracks.chapters]]
key = "c1"
title = "地名在页边"
text = "开春，先生在讲席上讲往南的商路：出城翻过阿特拉斯，到锡吉尔马萨，再往南走二十多天，是一个挖盐的地方。帘子后头，哈迪贾膝上压着一张纸，先生每说一个地名，她就在页边添一笔，城画个圈，河画道弯。偏偏说到那个挖盐的地方，先生咳了一阵，她没听清，纸上那一块就空着，指甲盖大小。散了讲，我凑到帘边：“塔加扎。驼夫都这么叫。那儿除了盐什么也没有，不画也不要紧。”她的笔没落下去。“你听谁说的？”“客栈里一个驼夫。”“哪家客栈？哪个驼夫？”她把纸折起来塞进袖子，“盐总得有人挖。图上空着的地方，也有人在过日子。”她已经起身往外走，走了两步又回头：“还愣着？他要是明早跟驼队走了，那三个字就只能算你说的。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "fez"
cast = ["khadija_rihla"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin_custom" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "go_ask"
text = "跟她去客栈找那个驼夫，当面把地名问清。"
reply = "驼夫阿里蹲在骆驼边上补鞍子，叫他说一遍，他说一遍。头一遍像“塔加扎”，第二遍舌头一卷，成了另一个音；第三遍他自己也笑了，说反正就是那个盐坑。哈迪贾把三种念法都写在那一小块旁边，底下添了一行小字：驼夫阿里说。“往后谁翻到这一页，”她把纸转给阿里看，“就知道该来找谁。”阿里乐了，问她要不要把他的骆驼也写上。"
next = "c2"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 4 }]

[[tracks.chapters.choices]]
key = "own_spelling"
text = "咬定我的拼法没错，用不着再跑这一趟。"
reply = "她也不跟我争，把纸摊在门槛上，那一小块从中间划开：左边写我的，右边写她照先生的口音猜的。“你写你的，我写我的。回头找个去过的人对。”第二天，城门边卸货的一个盐商被她拦住。他眯着眼看了半天，说两个都不对，又念了第三种。她把第三种写在正中间。盐商摇着头走了，我们俩靠在门洞里，笑得直不起腰。"
next = "c2"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 3 }, { kind = "skill", skill = "cartography", value = 4 }]

# —— C2：1554 年夏，晚到的驼队 ——
[[tracks.chapters]]
key = "c2"
title = "井和歇脚的地方"
text = "入夏，城门边的客栈一连十几天没有南边来的驼队。哈迪贾每天散了讲都去转一圈，回来就把她的图摊在自家货仓的盐袋上。我拿过炭笔，从非斯到锡吉尔马萨，画了一条直线：“这样最近。”她笑出了声，把炭笔要回去，在直线上点了三个点：“井。”又画了两个小方块：“歇脚的地方，有棚子，有人卖枣。”她顺着那几个点重描了一遍，线就弯了，弯到山那边，又绕回来。“商队不是一支笔，从这头一下划到那头。人要喝水，骆驼也要。”话音没落，外头有人喊南边的驼队到了。我们挤到仓门口。进城的骆驼比开春出城时少了两峰，赶驼的人嘴唇裂着血口子，一句话不说，先找水喝。哈迪贾手里的炭笔停在第二口井上。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["khadija_rihla"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

