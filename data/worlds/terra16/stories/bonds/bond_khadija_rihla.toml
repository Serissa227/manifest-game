# —— A1：1556 年春，角豆树下的井 ——
[[tracks.chapters]]
key = "a1"
title = "城门外第一个驿站"
text = "开春，她父亲能下床了，每天坐在仓门口晒太阳，替她看半天货。哈迪贾把图摊在我面前，手指从非斯往外走：“这条是阿里讲的，这条是那个盐商讲的，这条是先生念的那位旅人。”她停了停。“全是别人走的。我在这张图上画了两年，一步也没走过。”她指着城门外的一个小点：往塞夫鲁去的路上头一个歇脚的地方，一口井，一棵角豆树，驼队出了城在那儿饮头一回水。“早上出城，天黑前回来，一天够了。我父亲答应了，只要天黑前回来。”她把一张新纸铺在图旁边，一笔还没画。“这一段，我想自己画。”"
