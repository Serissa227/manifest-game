# 重逢：1569 年，月港码头上的一长桌。
[[tracks.chapters]]
key = "reunion"
title = "开海后的饭桌"
text = "开海第三年，月港的帆多得数不过来。我的船刚下锚，码头那头就有人扯着嗓子喊“林兄”。全月港只有一个人这么叫我。黄墩又胖了一圈，穿着船主的绸衫，袖口沾着酱油。他的船昨天从吕宋回来，就泊在旁边，船板是新的，船头的“黄”字也是新漆的。他在码头上摆了一长桌。我要过去，他伸手把我拦在一边：“等一下。”然后一个一个叫船工的名字，叫一个，坐一个，碗递到手里，才叫下一个。头一个坐下的是个黑瘦的汉子，左手缺一根指头。“阿福，”黄墩说，“在吕宋找着的。当年叫倭寇卖到那边，替人撑了十三年船。”阿福冲我点点头，捧着碗没说话。等每个人手里都有了碗，黄墩才端着自己那碗过来，跟我的碗一碰，汤都洒了出来：“船上的账，第一行还是饭。”"
window = [[1569, 1, 1], [1569, 12, 31]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1569, 1, 1], to = [1569, 12, 31] }]

# 缺省：我错过了这一年的月港，他寄来一封错字三个的信。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "huang_dun", text = "林兄：船回来了，阿福也回来了。阿福是在吕宋找着的，人瘦了，左手还是缺那根指头，我一眼就认出来。他说那年给卖到吕宋，替番人撑船，一年记一道，船板上刻了十三道。我在码头摆了一卓，船工门先坐，给你留了坐，你没来。菜凉了，下回再热。船上的账，第一行还是饭，你放心。今年米贵，我多备了十天的。你家的船要是路过月港，先写信来，我叫我阿娘做一筐芝麻饼。输的人挑点心，这话还算。——黄墩。又：蔡家小子看了这信，说有三个错字，我找了半天找不出来，你自己挑。" }, { kind = "flag", flag = "c7_bond_huang_dun_missed" }]

[[tracks.chapters.choices]]
key = "swear"
text = "当着一桌船工跟他结拜，对着天妃宫拜一拜"
reply = "我说：“阿墩，咱们拜个把子。”他愣了一下，一拍桌子站起来：“拜！”又压低了嗓子，“结拜要喝酒，我喝不了。”他喝了三碗，脸红得像供桌上的红龟粿。船工们把桌子挪开，腾出一块地。我们对着天妃宫的方向跪下，没有香，阿福从船上拿来三截缆绳头点着了，冒的烟比香还呛。黄墩磕头磕得砰砰响，起来的时候额头上粘着一粒饭。“往后，”他扶着我的肩膀，舌头已经大了，“你的船，我的船，都是一家的船。饭钱一起算。”我说那账谁记。“我记。第一行写饭。”他一屁股坐回凳子上，抓起一块米糕塞进嘴里，“吃饱了，再讲。”"
next = "done"
effects = [{ kind = "affinity", person = "huang_dun", value = 5 }, { kind = "relation", person = "huang_dun", relation = "sworn" }, { kind = "flag", flag = "c7_bond_huang_dun_landing_friend" }, { kind = "memory", memory = "mem-bond_huang_dun-reunion", title = "开海后的饭桌" }]

[[tracks.chapters.choices]]
