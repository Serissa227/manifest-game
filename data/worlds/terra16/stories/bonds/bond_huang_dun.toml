text = "开海第三年，月港的帆多得数不过来。我的船刚下锚，码头那头就有人扯着嗓子喊：“晚灯！”一桌船工全回过头来，有人吹口哨，有人拍桌子起哄。黄墩又胖了一圈，穿着船主的绸衫，把眼一瞪：“起什么哄！这是我同窗，当年社学比珠算，头名就是她！”起哄的人缩了回去。桌上铺着一块蓝底的蜡染布，染着一排小船，折痕叠得方方正正。我问哪儿买的。“格雷西克一家蜡染作坊。”他摸摸布角，摸得很轻，“掌柜的说，染工的手赶不得。明年我得早点去。”然后他一个一个叫船工的名字，叫一个，坐一个，碗递到手里，才叫下一个。头一个坐下的是个黑瘦的汉子，左手缺一根指头。“阿福，”黄墩说，“在吕宋找着的。当年叫倭寇卖到那边，替人撑了十三年船。”阿福冲我点点头，捧着碗没说话。等每个人手里都有了碗，黄墩才端着自己那碗过来，跟我的碗一碰，汤都洒了出来：“船上的账，第一行还是饭。”"

