[[tracks.chapters.choices]]
key = "take_cakes"
text = "收下饼，当着他的面先拆开吃一块"
requires = [{ kind = "affinity", person = "huang_dun", ge = 80 }, { kind = "bond", person = "huang_dun", level = "B" }]
hint = "你伸手要解麻绳，他一把按住：“回家再吃！”当着他的面拆他的饼，你们还没熟到这一步。"
reply = "我当场解开麻绳，拿了一块就咬，芝麻落了一前襟。饼皮酥，里头的糖和猪油还是软的。他盯着我嚼，比我还紧张：“好吃吧？我阿娘做的，她说外头买的都是骗人。”我说好吃。他一下就高兴了，在我背上拍了一巴掌，差点把饼拍掉：“下回出门，上我家来拿。我阿娘一做就是一大筐。”"
next = "s"
