[[tracks.chapters.choices]]
key = "look_away"
text = "装作没看见，转身走；第二天在他桌上放一碗咸粥"
reply = "我转身就走，一路没回头。第二天一早，我从家里端了一碗咸粥，加了虾米，搁在他桌上，自己坐回去背书。他来了，看看粥，看看我，呼噜呼噜喝了个精光。散学时他在门口拦住我：“林兄，谢谢。”“谢什么？”“粥。”“什么粥？”他愣了愣，笑出声来。他家的船出事以后，我头一回听见他笑。"
next = "a2"
effects = [{ kind = "affinity", person = "huang_dun", value = 3 }]

# A2：一包芝麻饼（A2 赠礼 sesame_cakes）。
[[tracks.chapters]]
key = "a2"
title = "一包芝麻饼"
text = "社学年底就要关门，堂上背书的声音一天比一天稀，谁都在盘算往后。黄墩肩上那块垫布换了新的，扛包的事他没再提，我也没问。这天散学，他把一个油纸包往我怀里一塞，沉甸甸的，还是温的。“芝麻饼，我阿娘做的，”他说，“出门总要带点吃的。”我掂了掂：“这么多？我一个人吃到过年也吃不完。”“又不是全给你吃的。”他掰着指头数，“路上碰见饿肚子的，分一块；后头来的人，再分一块。”说到这儿他停了停，挠挠后脑勺，“可也得留够你自己的。你老把好的给别人，自己瘦得跟竹竿似的。”油纸包上的麻绳捆了两道，结打得又大又笨，一看就是他自己捆的。"
