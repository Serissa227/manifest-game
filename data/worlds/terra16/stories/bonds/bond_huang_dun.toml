# 黄墩：最后一块点心（bond_huang_dun）+ 开海后的饭桌（reunion_huang_dun）——C7 重写，2026-10-12，Claude（Opus）执笔。
# 标签：羁绊·友情线（损友）。黄墩只对女性心动，但本线设计上只写友情：
#   全线没有心动选项、没有恋爱效果，也不写“心照不宣”的段落；S 只有 promise 与 own，重逢落点是结拜（sworn）或老友（friends）。
#   他与苏玛的事归 npc/pair_huang_dun_suma.toml，本文件只在重逢的 variants 里提一句。
# 人物：黄墩（huang_dun，1540-08-04，月港海商之子，龙溪社学同窗）；主角林晚灯（lin_wandeng，1540-03-23，社学里自称“林兄”）。
#   学院期（1554—1556）两人十三到十六岁；重逢 1569 年两人都二十八九岁。
# 依据（史实）：
#   - 月港在九龙江口，1567 年以前属龙溪县，私船出洋犯禁却从未断过；1567 年（隆庆元年）开海，同年析置海澄县。
#   - 1550 年代中期漳泉沿海倭患最烈，浯屿一带是海寇与私商出没之处；被劫船上的人多被掳走、转卖，下落难查。
#   - 月港与吕宋之间的唐船往来早于西班牙人据马尼拉（1571）；1569 年的“吕宋”指吕宋岛上的港口。
#   - 闽南吃食：绿豆糕、碗糕、面线、蚵仔煎、麻粩、红龟粿；南音以拍板击节。“加一”在闽南买卖话里多指加一成。
#   - 月港有天妃宫（林晚灯的母亲在那里看香火，见人设卡）。
# 依据（原创）：全部情节与台词；蔡家小子、阿福（左手缺一根指头）、“扛包鬼”的传说、漏了“成”字的珠算题、十七封询问信、三个错字的来信。
# 与简报的差异：A2 的标题与回忆标题由“一包麻糍”改为“一包芝麻饼”，与 A2 赠礼 sesame_cakes（芝麻小饼）和章内物件一致。
# 秘密：黄墩夜里替人扛货还债——A1 被“我”撞见；本文件的章没有 stage，不写见闻，秘密不进任何 news。
#   林晚灯扮男装：1556-07 揭开事件（bond_zhou_yan 的 wandeng_unmasked）以前的正文一字不提；揭开以后只在 known 变体里写他改口。
#   kept 分支不写任何东西（不加 kept 变体）。
# 缺省走向：c1 → c2 → b1 → b2 → a1 → a2 → s（default：开重逢、记 _parted）→ 重逢（default：他寄来一封有三个错字的信、记 _missed）。
#   C1—A2 的缺省没有效果，只在注释里写“玩家不回应时发生了什么”。
# 旗标：写 c7_bond_huang_dun_promise / _own / _parted / _landing_friend / _missed；
#   读 c7_wandeng_unmasked_known（由 bond_zhou_yan 的 wandeng_unmasked 设；A2、S、重逢的 variants）、
#   另用 tie 条件读黄墩与苏玛的 crush（pair_huang_dun_suma 的 closer 在 1569 年春设；重逢的 variants）。
#   不读 c7_pair_huang_dun_suma_together：那个旗标 1572 年才设，1569 年的重逢读不到（波次检查改）。
#   黄墩是友情线，S 立约不设任何 _taken 旗标。
# 日程：不改。全线在月港（yuegang）。

[[tracks]]
key = "bond_huang_dun"
name = "黄墩：最后一块点心"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["huang_dun"]

# C1：社学课间，一只空纸袋。
[[tracks.chapters]]
key = "c1"
title = "最后一块点心"
text = "社学的课间，先生出去喝茶，堂上比对对子。蔡家最小的那个对不上“月港潮”，罚站在门边，脸皱得像晒干的咸菜。黄墩从纸袋里摸出一块绿豆糕，往他嘴里一塞：“天塌下来，也先吃饱了再说。哭什么，下回你替我对。”蔡家小子含着糕直点头，眼泪还挂在下巴上。我手里攥着我娘早上塞给我的一块碗糕，凑过去问：“阿墩，你自己不吃？”“早吃过了。”他拍拍肚子，拍得砰砰响。他把纸袋往袖子里塞，袋口敞着，里头连渣都没剩。早上我从街口的糕仔铺过，看见他在铺前把铜钱数了两遍，只够一块。他察觉我在看，把袖口一折：“看什么，林兄，你也想吃？没了。”"
window = [[1554, 1, 1], [1554, 4, 30]]
# 地点（2026-11-10 S01）：c1 由 yuegang 改 zhangzhou_city——入学事件一答完，阶段就切到社学、人到了漳州城，窗口内再没回过月港，这一章改之前从未出场。
at = "zhangzhou_city"
cast = ["huang_dun"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_zhangzhou_shexue" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那天下半天黄墩的肚子叫了两回，先生以为外头要打雷。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "bring_two"
text = "第二天揣两块绿豆糕来，一大一小，让他先挑"
reply = "第二天我把两块绿豆糕往他桌上一放：“你先挑。”他伸手拿了大的，想了想换成小的，又换回大的，最后干脆两块都掰成两半：“一人一半，公道。”我们蹲在廊下分着吃完，他舔舔指头，上下打量我：“林兄，你人不错，就是太瘦。明天我带豆干来。”"
next = "c2"
effects = [{ kind = "affinity", person = "huang_dun", value = 4 }]

[[tracks.chapters.choices]]
key = "say_full"
text = "撒个谎说我也吃过了，把碗糕推给他"
reply = "“我也吃过了，撑得很。”我把碗糕往他手里一推。他不接，眯着眼看我的肚子：“你这谎撒得不像月港人。月港人撒谎，肚子要先鼓起来。”他把碗糕掰开，大的那半硬塞回我手里：“撒谎的人要多吃，脑子才转得快。”他自己那半一口就没了，又把掉在桌上的渣一粒粒捡起来吃了。"
next = "c2"
effects = [{ kind = "affinity", person = "huang_dun", value = 3 }]

# C2：从饭钱算起的草稿。
[[tracks.chapters]]
key = "c2"
title = "先算饭钱"
text = "入夏，先生在板上出了道算学：“船一只，自月港往吕宋，往返七十日，船工二十人，问一趟盘缠几何。”写完压低声音补一句：“这题出了，不许往外讲。”满堂都笑，谁家没有一两份船上的股子。同窗们第一行写的都是货：苏木几担，胡椒几担，生丝几斤。黄墩的草稿第一行写的是：“饭。二十人，七十日，日食米一升半。”我凑过去笑他：“阿墩，你连算船钱都先算吃。”他把笔一搁，指着板上的题：“你看清楚，七十日。少算一天饭，船上就有二十个人饿肚子。饿肚子的人摇橹不出力，风来了收帆也慢，货再多，船到不了也是白搭。”他说得太响，先生在前头咳了一声。黄墩缩缩脖子，在草稿上又添了一行：“咸菜。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 缺省：那张从饭钱算起的草稿得了个“中”，黄墩把它折起来夹进了书里。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "redo_meals"
text = "跟他把账从头重列：先写每个人的饭，再写货"
requires = [{ kind = "affinity", person = "huang_dun", ge = 20 }]
hint = "他把草稿揉成一团塞进袖子。你们还不熟，他怕你接着笑他。"
reply = "我们照他的草稿从饭起，一行一行往下排：米、咸菜、柴、淡水，再是货，最后才是利钱。排完一算，我们的盘缠比别人多出一成。交上去，同窗笑我们算得贵。先生翻来覆去看了两遍，批了个“上”，底下又添一行小字：“船上无饭，货不算货。”黄墩得意得一下课就拉我去港仔口吃面线，一人一碗。付钱的时候他说：“这碗记进下回的盘缠。”"
next = "b1"
effects = [{ kind = "affinity", person = "huang_dun", value = 4 }, { kind = "skill", skill = "negotiation", value = 4 }, { kind = "bond", person = "huang_dun", level = "C" }]

[[tracks.chapters.choices]]
key = "tease_glutton"
text = "笑他算盘缠也惦记着吃"
reply = "我说：“你算的是船上的盘缠，还是你自己的点心钱？”他也不恼，把笔往耳朵上一夹：“惦记吃怎么了？人是铁，饭是钢。”那张草稿他照样交了，先生给了个“中”。下课他从袖子里摸出一包炒花生塞给我：“你嘴贫，要多吃。嘴里有东西，就没空贫了。”"
next = "b1"
effects = [{ kind = "affinity", person = "huang_dun", value = 3 }]

# B1：漏了一个字的珠算题。
[[tracks.chapters]]
key = "b1"
title = "输了也不躲"
text = "秋天社学比珠算，先生念题，大家拨珠，谁先报对谁得分。最后一道：“米三十石，石价五钱，船脚加一，问该银几何。”我报“十六两五钱”，黄墩报“十六两”。先生说我对。名次就这么定了：我头名，他第六。散了以后，输的人都绕着头名走，他倒拿着草稿一屁股坐到我对面：“林兄，你看我错在哪儿？我算了三遍，都是十六两。”他的草稿上写着：“船脚加一，加银一两。”我说“加一”是加一成。他瞪眼：“我阿爸跟船老大讲价，‘加一’就是多给一两，哪来的成？”我们把两种算法并排抄在一张纸上，两种都算得通，差的只是题目里没写的那一个字。他盯着那道题看了半天，忽然笑了：“这道题，比我还糊涂。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那张纸黄墩折成方块收着，第六名他照认，那道题后来没人再提。
[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "ask_teacher"
text = "拿着那张纸，跟他一起去问先生这道题到底什么意思"
reply = "先生把题念了两遍，捻着胡子承认，题里漏了一个“成”字。黄墩问名次改不改，先生说不改，比的是当场。黄墩想了想：“不改就不改。题改了就行，免得下一届有人跟我一样冤。”先生真拿笔在题底补了个“成”。出了门，他从袖袋里摸出一块麻粩，掰了一大半给我：“你陪我来问，够义气。”"
next = "b2"
effects = [{ kind = "affinity", person = "huang_dun", value = 3 }, { kind = "skill", skill = "negotiation", value = 4 }]

[[tracks.chapters.choices]]
key = "rematch_abacus"
text = "跟他再比一场，这回题目由我们俩自己出"
reply = "他出的题全是吃的：“一斤蚵仔几只？”“一碗面线几根？”“十个肉粽三个人分，剩下的归谁？”我一道也答不上来。他边拨算盘边报数，赢了还不够，又拿算盘当拍板，噼噼啪啪敲了一段南音，敲得隔壁斋舍的先生探出头来。最后那道题，他说剩下的肉粽归出题的人。"
next = "b2"
effects = [{ kind = "affinity", person = "huang_dun", value = 4 }]

# B2：捏碎的米糕。
[[tracks.chapters]]
key = "b2"
title = "船没有回来"
text = "这年夏天，消息先到的是码头：黄家的船在浯屿外头叫倭寇截了，货抢光，船烧了半边，漂回来的只有一块刻着“黄”字的船板。船上的人，一个也没回来。那天下午黄墩没来上课。傍晚他站在我家门口，手里捏着一块米糕，捏得粉碎，渣从指缝里往下掉，他也不吃。“林兄，”他嗓子哑了，“你认得的字多，帮我打听打听。”我以为他要问货，问船，问家里还剩多少。他开口第一句是：“阿福还活着没有？”阿福是他家船上撑篙的，十九岁，左手缺一根指头，每回出海回来都给黄墩带一包番薯干。“阿福不识字，”黄墩说，“他要是活着，没法写信回来，得有人去问。”说完他低头看了看手里的碎糕，好像这才想起自己捏着什么。"
window = [[1555, 5, 1], [1555, 9, 30]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1555, 5, 1], to = [1555, 9, 30] }, { kind = "age", le = 17 }]

# 缺省：黄墩自己写了三封信托码头上的人带出去，一封回信也没有等到。
[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "write_letters"
text = "点上灯，陪他把询问信一封封写完，托船送到各个码头"
requires = [{ kind = "affinity", person = "huang_dun", ge = 50 }, { kind = "bond", person = "huang_dun", level = "C" }]
hint = "他把信纸往身后一藏，说自己写得来。他的字在发抖，这副样子他还不肯让你看见。"
reply = "我们点了一盏油灯，从漳州写到泉州，从南澳写到金门，凡是有船靠的地方都写一封：“黄家船工阿福，十九岁，左手缺一指，见者请回信月港黄家。”他念，我写，写到第十七封，外头鸡叫了。他把最后一封折好，用米汤封了口，这才摊开手掌，把那块碎糕一点一点吃掉，吃得很慢。"
next = "a1"
effects = [{ kind = "affinity", person = "huang_dun", value = 4 }, { kind = "bond", person = "huang_dun", level = "B" }]

[[tracks.chapters.choices]]
key = "ghost_story"
text = "讲个鬼故事，先把他的心思岔开"
reply = "我讲浯屿的水鬼，夜里找替身，专拉落水人的脚。讲到一半我自己先起了一身鸡皮疙瘩，他一把揪住我的衣领：“这时候你讲这个！”骂着骂着，眼泪就下来了，哭得满脸都是。哭完他拿袖子一抹：“好多了。你讲得真难听。”那天夜里他自己坐在灯下写信，写错了字也不改，一共写了五封。"
next = "a1"
effects = [{ kind = "affinity", person = "huang_dun", value = 3 }]

# A1：磨破的垫肩布。
[[tracks.chapters]]
key = "a1"
title = "夜里扛货的人"
text = "开春以后，码头上传说夜里出了个“扛包鬼”：三更半夜，一个黑影一趟一趟地扛麻袋，不吭声，天一亮就不见了。我最怕鬼，可越怕越想看，那天夜里揣了一把盐出门，听人说盐能驱鬼。货栈后头刚靠了一条糖船，火把插在桩子上。那个影子从跳板上下来，肩上压着一袋糖，走到亮处——是黄墩。他光着膀子，肩上垫着一块布，布磨得透了亮，底下的皮全红了。工头在旁边喊：“黄家仔，还有四十袋，天亮前卸完，一袋一文！”他家的船没了，欠货主的债还没还清，社学里没有一个人知道，是他夜里一袋一袋扛着还。他闷声应了句“晓得”，一转身看见我，整个人僵在那里，肩上的麻袋往下一滑，他赶紧拿手托住。“林兄……”他半天才挤出一句，“你半夜来码头做什么？”我手心里那把盐全攥湿了。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

# 缺省：我被工头当成看热闹的赶了出去；第二天黄墩来上课，肩膀一碰桌沿就皱眉，码头的事我们都没提。
[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "carry_too"
text = "二话不说，扛起另一袋，跟他一起卸到天亮"
reply = "我把盐往兜里一塞，扛起一袋，头一袋就差点把我压趴下。他骂我逞强，伸手把麻袋在我肩上挪了挪：“顶在这儿，用腰走，别用脖子。”天亮时我们坐在码头的石阶上，他数手里的铜钱：“你这身板，扛不了几袋。”“九袋。”我伸出九根手指。他数出九文推给我。我不要，他硬塞进我手心：“讲义气就得收。不收，就是看不起我。”"
next = "a2"
