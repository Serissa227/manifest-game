[[tracks.chapters.choices]]
key = "promise"
text = "约好他的船回来那天，在月港码头摆一桌，先叫船工上桌"
requires = [{ kind = "bond", person = "huang_dun", level = "A" }]
hint = "这样的约一辈子只许得起一回：要么你们的交情还没走到这一步，要么这句话你已经许了别人。这回只能跟他说一声顺风。"
reply = "“一言为定。”他把手在衣襟上擦了擦，跟我击了一掌，“船回来那天，码头上摆一桌。头一碗给阿福，他要是回来了的话；没回来，也给他摆一副碗筷。”我问那桌饭钱谁出。“我出。”“你哪来的钱？”“到时候就有了。”他拍拍那条旧船的船帮，拍下来一片干了的藤壶，“肚子饱了，义气才讲得响；饿着肚子讲的，不算数。那桌饭，就是我讲义气的地方。”船上又在喊。他跳上跳板，走到一半回过头：“你也把你家的船管好！到时候你迟到，你挑点心！”我说输的人才挑。他已经钻进了舱里，只听见他在里头喊：“那你就输！”"
next = "done"
effects = [{ kind = "affinity", person = "huang_dun", value = 5 }, { kind = "bond", person = "huang_dun", level = "S" }, { kind = "relation", person = "huang_dun", relation = "friends" }, { kind = "flag", flag = "c7_bond_huang_dun_promise" }, { kind = "memory", memory = "mem-bond_huang_dun-s", title = "各自把船管好" }, { kind = "start_track", track = "reunion_huang_dun" }]

[[tracks.chapters.choices]]
key = "own"
text = "不立约：他管他的船，我管我家那条鸟船，碰上了就一起吃饭"
reply = "我说：“约就不立了。你管你的船，我管我家那条鸟船。饭总要吃，碰上了就一起吃。”他想了想，点点头，倒像松了口气：“也好。立了约，我怕还不上。我阿爸当年跟人立的约，到今年还没还完。”他把手里那个油纸包塞给我，里头是一包炒花生，还热着。“路上吃。别分给别人，这回是给你一个人的。”我说我开春才出海。“那就留到船上吃。”他踩上跳板，脚下一滑，船上的人哄笑起来。他站稳了，回头冲我挥挥手，又指指那包花生，嘴型是“别分”。船出了港口，我剥了一颗。那年冬天的花生，炒得有点焦。"
next = "done"
effects = [{ kind = "affinity", person = "huang_dun", value = 2 }, { kind = "relation", person = "huang_dun", relation = "friends" }, { kind = "flag", flag = "c7_bond_huang_dun_own" }, { kind = "memory", memory = "mem-bond_huang_dun-s", title = "各自把船管好" }, { kind = "start_track", track = "reunion_huang_dun" }]

