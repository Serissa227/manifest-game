reply = "我没提结拜，坐下来就吃。蚵仔煎、卤面、炸五香，一盘接一盘地上。船工们吃饱了，一个个拍着肚子回船上睡觉，阿福走的时候冲我弯了弯腰。天黑了，桌上只剩我们两个，他还在叫厨子添菜。“结不结拜都一样，”他剔着牙说，“一桌饭吃过了，就是兄弟。”我说：“那我是什么？”他把牙签一放，认真地打量我：“你是吃饭最快的那个。当年在社学就是，一块绿豆糕，我还没看清，你已经咽下去了。”我说那块绿豆糕是你塞给蔡家小子的。他“哦”了一声，又给我添了一碗：“那你还欠我一块。”"
