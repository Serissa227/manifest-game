text = "当场数出一半，推回给他"
reply = "我把油纸包拆开，数了一半推回去。他往后一缩：“送人的东西，哪有分回来的？”“讲义气。”我说。他瞪着那半包饼，嘴里嘟囔了几句，到底伸手收下了：“那这一半，算我借你的。”他从袖子里摸出笔，真在油纸上写了一行：“欠林兄芝麻饼六块。”写完自己先笑了。"
next = "s"
effects = [{ kind = "affinity", person = "huang_dun", value = 2 }]

# 变体：揭开事件公开以后（c7_wandeng_unmasked_known），他第一次见“我”时改口。不写揭开的场面。
[[tracks.chapters.variants]]
key = "known"
when = [{ kind = "flag", flag = "c7_wandeng_unmasked_known" }]
text = "社学年底就要关门，堂上背书的声音一天比一天稀，谁都在盘算往后。七月那件事以后，黄墩躲了我好几天，这天散学，他终于在门口把我拦住了。他张嘴叫：“林……”卡在那里，脸憋得通红，半天又改口：“算了，我还叫你林兄，叫惯了。”说完他把一个油纸包往我怀里一塞，沉甸甸的，还是温的。“芝麻饼，我阿娘做的，出门总要带点吃的。”我掂了掂：“这么多？我一个人吃到过年也吃不完。”“又不是全给你吃的。”他掰着指头数，“路上碰见饿肚子的，分一块；后头来的人，再分一块。”说到这儿他停了停，挠挠后脑勺，“可也得留够你自己的。你老把好的给别人，自己瘦得跟竹竿似的。”油纸包上的麻绳捆了两道，结打得又大又笨，一看就是他自己捆的。"

# S：一条长了藤壶的旧船。
[[tracks.chapters]]
key = "s"
title = "各自把船管好"
text = "十二月，北风刮得码头上的旗子啪啪响。社学门上贴了告示，开春不再开课。黄墩要跟他阿叔上船了。家里只剩一条船，旧得船板上长满了藤壶，今天开去南澳。他站在跳板边上，手里拎着一个油纸包，捏得很紧。“我阿叔说，船上的账往后归我算，”他说，“第一行，我还是写饭。”我说你要是敢不写饭，我从月港追到南澳去骂你。他笑，笑完又不笑了，看看那条船，又看看我：“林兄，往后再见面，比一场。输的人挑点心。”“挑点心不是赢的人的事吗？”“输的人挑，”他说得很认真，“输了心里难受，挑一样爱吃的，就好了。”船上有人喊他的名字。他没动，等我回话。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "yuegang"
cast = ["huang_dun"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

