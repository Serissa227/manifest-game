# B2：1555 年，先生的屋子。沙拉尼道堂只借三天的书，一盏点了三夜的灯。
[[tracks.chapters]]
key = "b2"
title = "三天的借书"
text = "沙拉尼长老的道堂里有一部书，城里找不到第二本。道堂的规矩是只借三天，第四天日出前送回去，过时不候。萨利赫想抄下来给先生，可一个人三天抄不完。他来杰巴尔提找我：“我的兄弟，你念，我抄。困了就换。”我们在先生那间屋子里点了一盏灯，灯芯剪了又剪，油添了又添。第一夜他抄得飞快；第二夜他的手开始抖，墨点溅到页边，他就用指甲轻轻刮掉。第三夜我念着念着，额头磕在了书上。醒来时灯还亮着，窗外已经泛白。他还在抄，抄的正是我念到一半的那一页——后半页我没念出来，他对着原本自己认，嘴唇一动一动，不出声。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "cairo"
cast = ["salih"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

