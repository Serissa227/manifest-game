# A1：1556 年 8 月，开闸放水的夜，布拉克码头的石阶。河面上的灯船。
[[tracks.chapters]]
key = "a1"
title = "开闸的夜"
text = "尼罗河涨足了，开罗人要掘开运河口的堤，放水进城。那一夜河面上全是挂灯的船，岸上全是人，卖甘蔗的、卖炒鹰嘴豆的、敲手鼓的。萨利赫拉着我挤到布拉克码头，在一段没人坐的石阶上坐下，脚底下就是水。他从怀里掏出一本小小的诗集，封皮磨得发亮，翻到一页，用手掌压平：“这一页，我想念给你听。”这是他头一回不替先生读，是读给我。他读得很顺，一个磕绊也没有，顺得不像头一回读。灯船从我们脚下漂过去，一条，又一条。我侧过脸看他，才发现他根本没看书页，眼睛一直看着河。"
window = [[1556, 8, 12], [1556, 10, 11]]
at = "cairo"
cast = ["salih"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 8, 12], to = [1556, 10, 11] }, { kind = "age", le = 17 }]

