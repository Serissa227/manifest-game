# 替谁读书（bond_salih）——羁绊线，标签 BL；萨利赫纯 BL，与男主角巴拉卡可走恋爱落点。C1 C2 B1 B2 A1 A2 S + 主线重逢 reunion_salih。
# 人物：萨利赫（salih，1540-12-25 生），爱资哈尔也门住宿区的穷学生，天不亮先替失明的老先生读书；想趁先生还记得，给他整理一份口述书目。
#       说话慢、声音好听、不爱争，称人“我的兄弟”；口头禅“先生说过，耳朵比眼睛记得牢。”原句只在 C1 用一次，别处换说法；A1 涨水夜那句“这一页，我想念给你听。”是这一幕自己的话。
#       巴拉卡·宾·萨利姆（baraka，1540-07-23 生），主角，“我”；基尔瓦金商之子，住杰巴尔提住宿区；爱讲笑话，伤心事拿笑话岔开。
#       年龄：C1（1554 春）两人 13；A1（1556-08-12..25）巴拉卡 16、萨利赫 15；A2 同；S（1556-12）巴拉卡 16，萨利赫到 12 月 25 日才满 16；
#       重逢 1563 年两人都 22。学院期最多到心照不宣：A1 heart +6、A2 heart +6（要已有 6）、S heart +12 与 crush（要已有 12，
#       写成不说破的信物交换，只到握手）；恋人只在重逢，要 romance 旗标、heart ≥ 24、双方 ≥ 18。
#       决定表里 S 心动写 +10，累计只到 22、到不了重逢的 24；简报已改为 +12，这里照简报。
# 依据（史实）：爱资哈尔按籍贯分住宿区（也门、杰巴尔提等）；布拉克是开罗的尼罗河码头；涨水足时掘开运河口的堤放水进城，城里过节，
#       1556 年约在 8 月中。巴罗斯《亚洲》第一部 1552 年在里斯本印行，写了 1505 年葡萄牙人攻下基尔瓦、苏丹出逃、筑堡。
#       基尔瓦人自己的编年史是阿拉伯文，开头讲设拉子来的人用彩布围岛一圈换下这块地，后面列历代苏丹，写到大清真寺。
#       沙拉尼（阿卜杜·瓦哈卜·沙拉尼，1565 年卒）在开罗有道堂。基尔瓦的苏丹铸过铜币。
# 原创：盲先生、他的书目与扎比德借的书、空水壶、念错的读法记在旁边、猴子骗鲨鱼的笑话、道堂只借三天的书、点了三夜的灯、
#       涨水夜的诗集、倒拿的书、五支芦笔与第五支、铜币拓片、书目最后一行，全部台词。
# 待核：基尔瓦编年史的抄本是否到过开罗（写成“先生这里有”）；沙拉尼道堂借书的规矩（写成道堂的规矩，不写他本人出场）。
# 缺省走向：C1—A2 的 default 只往下走、不加数值（无人回应时的情节写在各章 default 上方的注释里）；
#       S 的 default 开启重逢并记 c7_bond_salih_parted，不改关系；
#       重逢的 default：萨利赫寄来书目的最后一页，最后一行是“基尔瓦”（c7_bond_salih_missed）。
# 共享旗标：写 c7_pair_salih_ilhan_taken（S 的 promise 与 heart；pair_salih_ilhan 据此改走“并肩的朋友”）；
#       读 c7_pair_salih_ilhan_together（重逢变体 with_ilhan：讲席外等着一个穿总督府书记袍子的人，不写水位尺的场面，由 pair_salih_ilhan 设）。
#       本线自有：c7_bond_salih_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed。
# 归属：每年去罗达岛看水位尺归 pair_salih_ilhan，本文件不写水位尺、伊尔汗不出场；1556 年涨水节之夜读诗归本线（A1）。
# 秘密：A1 那首诗萨利赫早练过许多遍——A1 只写“顺得不像第一次”“眼睛一直看着河”，巴拉卡看出来、不说破；
#       只在重逢的 love 回复里由他自己说出。没有见闻。
# 专名：基尔瓦照港口与人物卡的写法（简报写作“克卢瓦”）。
# 日程：不改。

[[tracks]]
key = "bond_salih"
name = "萨利赫：替谁读书"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["salih"]

# C1：1554 年开春，爱资哈尔的讲席后排。先生手边的空水壶。口头禅原句在这里。
[[tracks.chapters]]
key = "c1"
title = "替先生读书"
text = "我到爱资哈尔的第三天，挤在讲席最后一排，听一个也门学生给失明的老先生读书。他嗓子好，读得慢，一句一停，像怕字从嘴里掉下去。旁边的人在打哈欠，我忍不住，压着声音，阿拉伯话里夹着斯瓦希里话，讲我们海边猴子骗鲨鱼的故事——猴子说：“我的心忘在树上了，得回去拿。”两个桑给巴尔来的学生扑哧笑出了声。读书声停了。先生的脸朝我们这边转过来：“重读。”那个学生没回头，也没叹气，只低声说了一句：“先生说过，耳朵比眼睛记得牢。”他把书翻回这一页的开头，从第一个字又读了一遍。散课以后人都走空了，他还跪坐在先生旁边，等先生午睡。先生手边那只陶水壶，他拿起来晃了晃，是空的，又轻轻放回原处。他没起身去打水，舔了舔嘴唇，把下一页先翻好了。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "cairo"
cast = ["salih"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "family_access_cairo_azhar" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 无人回应：那天的书萨利赫读到天黑，水壶一直是空的。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "refill_and_sorry"
text = "去井边替他把水壶打满，再道个歉。"
