# C2：1554 年夏，先生堆满书的半间屋子。一张写了一半的书目。
[[tracks.chapters]]
key = "c2"
title = "先生的书目"
text = "萨利赫想给先生做一份书目：先生这辈子读过的、背过的、借了没还的，先生念书名，他来记。“先生说，人老了，书会比人先走。”他说这话的时候没看我，低着头磨墨。先生的书堆了半间屋子，许多封皮早掉了，只能从书脊上认字。他请我帮忙念。我念得磕磕绊绊，基尔瓦的口音把喉音全念扁了。他不笑，也不催，把那个字放慢了念给我听，念到第三遍我才念对。纠正完了，他低头在书目上写下正确的读法，又在旁边用更小的字，把我念错的那个也记了上去。那张纸写了一半，左边一列书名，右边一窄条小字，现在多了一行基尔瓦的歪读。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "cairo"
cast = ["salih"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 无人回应：那份书目萨利赫一个人记了半年，记到第二张纸。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "read_all_spines"
text = "陪他把这半间屋子的书都念完，一本也不漏。"
requires = [{ kind = "affinity", person = "salih", ge = 20 }]
hint = "这是没完没了的活。我们还不算熟，他不会让我陪着熬。"
reply = "念了一个月。我每天下了讲席就钻进那间屋子，从门边那一摞念到窗下那一摞，念到点灯，念到我的口音被他磨平了一半。书目写满了三张纸。最后一天，萨利赫把三张纸从头念给先生听。念到一个书名，先生抬起手：“这一本，是我年轻时在扎比德借的，还没还。”萨利赫在那一行旁边画了个小圈。我问圈是什么意思，他说：“要还的。”"
next = "b1"
effects = [{ kind = "affinity", person = "salih", value = 2 }, { kind = "bond", person = "salih", level = "C" }]

[[tracks.chapters.choices]]
key = "why_my_reading"
text = "问他：我念错的读法，为什么也要记下来。"
requires = []
reply = "“先生说，”他把笔搁在砚台边上，“有人这样念，就该有人记着。”他说基尔瓦来的人念这个字，想必不止我一个。我说那往后我多念错几个，替基尔瓦多占几行。他笑着摇头，又把笔拿了起来：“不用多。一个就够了。”"
next = "b1"
effects = [{ kind = "affinity", person = "salih", value = 3 }]

# B1：1554 年秋冬，书商街与杰巴尔提住宿区。一本葡萄牙人写的史书。
[[tracks.chapters]]
key = "b1"
title = "外人写的基尔瓦"
text = "书商街有家铺子收了一本葡萄牙文的书，巴罗斯写的《亚洲》，前年才在里斯本印出来。掌柜听说我是基尔瓦人，特意翻到那几页给我看。我的葡萄牙话是在码头上跟水手学的，读得很慢，一个晚上才读完：葡萄牙人的船怎么进的港，苏丹怎么逃的，城怎么烧的，烧完又在岸上盖了一座堡。我们自己人怎么过日子，一句也没有。那天夜里我在住宿区的院子里讲笑话，说葡萄牙人把我们的城墙记矮了三尺，因为他们是跪着量的。满院子的人都笑，只有萨利赫坐在井台边上，没笑。半夜有人敲我的门。他抱着一卷阿拉伯文的抄本站在门外，灯举得低低的：“这是你们自己人写的那一本。先生这里有。我念给你听。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "cairo"
cast = ["salih"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

