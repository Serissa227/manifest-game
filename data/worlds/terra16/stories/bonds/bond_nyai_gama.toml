# B1：按日子下的棋。
[[tracks.chapters]]
key = "b1"
title = "棋盘上的日子"
text = "学堂里的人都知道我下棋没输过。一个午后，奈·加玛搬了张凳子坐到我对面，把棋子一摆，先放下一枚铜钱：“输了的给一枚。”她下棋跟谈生意一个样，不贪子，只抢先手。我吃她一个兵，她不理，往前推一步：“这一步算初三。”我再吃一个，她又推：“这一步算初五。”我越吃越多，心却越来越慌。数到“初九”，我的王被她的车和马堵在了角上，旁边看棋的同学一声不吭。她把我的铜钱拿过去，棋子一枚枚收进盒子：“你们王子下棋，总想着吃掉对面的王。我只想着哪天到港。”"
