reply = "“两斤。”她立刻说，“提手编了两层。”我说篮底只编了一层，她说篮底不用提。我们从午后一直讲到太阳落进海里，最后成交：一斤半丁香，外加一盘棋，输的人去买椰子水。那盘棋她赢了，椰子水是我扛回来的。"
