next = "c2"
effects = [{ kind = "affinity", person = "nyai_gama", value = 3 }, { kind = "skill", skill = "negotiation", value = 8 }]

[[tracks.chapters.choices]]
key = "prince_voice"
text = "端起架子：“苏丹家的船，从不误期。”"
reply = "“那好。”她又把账本翻开，“误一天，你赔我一斤丁香。写上，按个手印。”我按了。那一季的船误了三天，我托人捎了三斤丁香到她的摊子上。她收下，回给我一张收条，上面写着“王子赔”，三个字写得端端正正。"
next = "c2"
effects = [{ kind = "affinity", person = "nyai_gama", value = 2 }]

# C2：一袋泡过水的胡椒。
[[tracks.chapters]]
key = "c2"
title = "湿胡椒"
text = "东风起了，格雷西克的码头上停满了等胡椒的中国帆船。一个从内地来的胡椒贩子把一袋胡椒往秤上一放，秤砣滑到了头，比同样大的袋子沉出一截。帆船的船主是泉州人，站在船舷上直跺脚，说潮水不等人。奈·加玛从人堆里挤过来，抓起一把，挑一粒放进嘴里咬开，“呸”地吐在地上：“泡过水。”贩子脸红脖子粗，说雨季收的胡椒本来就沉。她不跟他吵，转过身来看我——我在特尔纳特跟福建船上的伙计学过几句他们的话。“你会说他们的话。第一，跟船主说，再等半天。第二，别说是我说的，他不听女孩子的。”贩子一把按住了袋口。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "gresik"
cast = ["nyai_gama"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

