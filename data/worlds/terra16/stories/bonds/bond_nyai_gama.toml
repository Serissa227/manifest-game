effects = [{ kind = "affinity", person = "nyai_gama", value = 3 }]

# S：两张船期表。
[[tracks.chapters]]
key = "s"
title = "两张船期表"
text = "十二月，学堂最后一回点了名。开春我要回特尔纳特，她要回万丹，两条船往两头走。码头上堆着待装的货箱，奈·加玛把两张船期表摊在一只箱盖上，拿两块秤砣压住纸角。一张是我家科拉科拉船的，一张是她家胡椒船的。她用指头顺着两张表往下比，脚夫在旁边催了两回，她一眼也没看。比到一处，她停住了：明年有一个月，两张表上的船都在万丹。她用指甲在那个月上划了一道，划得很深，纸都起了毛。“这个月，你的船要是到了万丹，”她说，“我请你喝茶。”我问是什么茶。“到了再说。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "gresik"
cast = ["nyai_gama"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

