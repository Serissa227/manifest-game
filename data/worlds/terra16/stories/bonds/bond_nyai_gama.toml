# 重逢：1563 年，万丹的胡椒市。
[[tracks.chapters]]
key = "reunion"
title = "价由她开"
text = "六年以后，我的船进了万丹。这里的胡椒市比格雷西克大，秤也大，人声更大。码头边泊着一条不大的船，吃水浅，我估了估，装得下两百担胡椒；船头用爪威字写着一个名字：奈·加玛。她本人坐在船边的摊子后面定价，买家说一句，她回一个数，一个字也不让。旁边有人说起那个姓黄的福建商人，今年又晚了一个月。“我再等他一个月，”她头也没抬，“最后一个月。”她把秤砣挂好，这才看见我。账本还在膝盖上摊着，她先问：“这回是哪天到的港？”"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "banten_port"
cast = ["nyai_gama"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }, { kind = "age", ge = 18 }]

# 缺省：我错过了万丹，她寄来一封信，附着她自己那条船下一季的船期。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "nyai_gama", text = "凯奇利：你没来。第一，这回不罚你丁香，今年东风来得晚，往西的船个个误期，我的账上记的是风。第二，船期抄在下面，你照着改你的。我的船你没见过：不大，装两百担，船头写着我的名字。买它那天，卖船的古吉拉特人问我父亲在哪里，我说在家，船是我的。他看了我半天，收了钱。签字的时候我的手没抖，回家以后抖了一晚上。今年它跑了两趟马六甲，一趟巴邻旁，一天也没误。胡椒今年一担涨了六十文；你那边的丁香要是还按去年的价，我先订三十担，价钱等见了面再压。下一季：东风起后第十天出万丹，二十天到马六甲，在那里过季；西风一起就往回走，顺路到格雷西克，停八天，大约在十二月。你要是在那一带，先写信说清你哪天到，别让我在码头上白等一个月。那年在货箱盖上划掉的那个月，我账本里也记着一行。——奈·加玛，于万丹" }, { kind = "flag", flag = "c7_bond_nyai_gama_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "先把货谈完，再上她的船坐下，喝那杯茶"
reply = "我报丁香的价，她报胡椒的价，两边都笑，两边都不动。从晌午谈到太阳偏西，丁香我让了一成，胡椒她一文没让。成交以后，她合上账本，领我上了她的船。舱里很窄，一张矮桌，一只铜壶。茶是她跟中国帆船换来的，汤色很清。我喝了一口，问她这茶多少钱一斤。“不卖。”她给我续上，“生意是生意，茶是茶。”我说当年船期表上划过的那个月，我的船没赶上。她说她知道，那个月她在码头上等到月底，茶自己喝了。“今年这一杯，”她把杯子往我这边推了推，“算你补上的。”"
next = "done"
effects = [{ kind = "affinity", person = "nyai_gama", value = 5 }, { kind = "relation", person = "nyai_gama", relation = "friends" }, { kind = "flag", flag = "c7_bond_nyai_gama_landing_friend" }, { kind = "memory", memory = "mem-reunion_nyai_gama", title = "价由她开" }]

[[tracks.chapters.choices]]
key = "escort"
text = "这一季让我的船替她押头一趟货，去马六甲"
reply = "她的船在前，我的船在后，从万丹往北，贴着苏门答腊的海岸走。每天傍晚她都把船靠过来，隔着船舷问我今天走了多少里，记进账本。过邦加海峡那天起了大雾，我叫人敲了一夜的锣，她的船跟着锣声走，一支桨也没碰着礁。第二十天早上，马六甲的城墙从海上浮出来，和她账本上写的那一天，一天不差。卸货的时候，税吏想照船的大小多收一笔，她把账本摊开跟他一条一条对，对到他不说话。她站在码头上，看着自己的胡椒一袋袋过秤，回过头对我说：“王子的日子，这回不打折。”"
next = "done"
