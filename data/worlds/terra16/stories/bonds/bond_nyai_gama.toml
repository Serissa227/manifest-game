# 奈·加玛：哪天到港（bond_nyai_gama）+ 价由她开（reunion_nyai_gama）——C7 重写，2026-10-11，Claude（Opus）执笔。
# 标签：羁绊·友情线。奈·加玛只对男性心动，但本线设计上只写友情（她的恋情归 pair_nyai_gama_huang_shouguan）：
#   全线没有心动选项、没有恋爱效果，也不写“心照不宣”的段落；S 只有 promise 与 own，重逢只有朋友落点。
# 人物：奈·加玛（nyai_gama，1540-03-20，万丹胡椒商家的女儿）；主角凯奇利·劳特（kaicili，1540-09-09，特尔纳特苏丹的儿子）。
#   学院期（1554—1556）两人十三到十六岁；重逢 1563 年两人都二十出头。
# 依据（史实）：
#   - 万丹在 16 世纪中叶兴起为胡椒大港，有胡椒市集，中国帆船来收购（皮雷斯《东方志》、后来的荷兰航海记都有记）。
#   - 格雷西克是爪哇北岸的香料转运港，近旁吉里山有苏南·吉里的学堂（吉里学院以此为原型）。
#   - 马鲁古的科拉科拉船（多桨快船）；丁香出特尔纳特一带。
#   - 爪哇海季风：约十二月到三月刮西风，船往东走顺、往万丹难；五月前后转东风，马鲁古的船才往西来。
#   - 古吉拉特船主在东南亚各港买卖船只与货；东南亚港口的女商人不少见（Reid《东南亚的贸易时代》）。
#   - 担 ≈ 六十公斤；港务官即沙班达尔（syahbandar）；船头的爪威字即阿拉伯字母写的马来文。
# 依据（原创）：全部情节与台词；买船信、舅舅定的日子、放信的篮子、两张船期表；重逢时她自己的船。
# 去重：瓦蒂与奈·加玛的班顿对歌归 tie_wati_nyai；与黄寿官的事归 pair_nyai_gama_huang_shouguan，这里只在重逢作背景。
# 秘密：那封落款是她自己名字的买船信——A1 给“我”看；本文件的章没有 stage，不写见闻，秘密不进任何 news。
# 缺省走向：c1 → c2 → b1 → b2 → a1 → a2 → s（default：开重逢、记 _parted）→ 重逢（default：她寄来一封附船期的信、记 _missed）。
#   C1—A2 的缺省没有效果，只在注释里写“玩家不回应时发生了什么”（无 stage，不出见闻）。
# 旗标：写 c7_bond_nyai_gama_promise / _own / _parted / _landing_friend / _missed；
#   不读别的旗标。原有的 with_huang 变体读 c7_pair_nyai_gama_huang_shouguan_together，那个旗标 1572 年才设，
#   1563 年的重逢永远读不到，整合时中英一起删去（她与黄寿官的事归 pair_nyai_gama_huang_shouguan）。
# 日程：不改。重逢在万丹（banten_port），cast 里她 1557 年起就在万丹。

[[tracks]]
key = "bond_nyai_gama"
name = "奈·加玛：哪天到港"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["nyai_gama"]

# C1：码头上吹的牛。
[[tracks.chapters]]
key = "c1"
title = "哪天到港"
text = "格雷西克的码头上，胡椒袋子码得比人高。一个万丹来的胡椒商人问我丁香几时到，我笑着说：“我父亲的科拉科拉船，季风一转就到。三十条桨一齐划，比风还快。”商人还没接话，秤杆底下坐着的一个女孩把账本一合，抬起头来。她穿着学堂的衣裳，指头上沾着炭灰。“下回哪天到港，先说清。”我说风到了就到。她把账本夹到胳膊底下，站起来拍掉纱笼上的胡椒末：“风不听王子吹牛。”她叫的是王子，没加那个“小”字。我还在想这算不算客气，她已经走出去十几步了。商人在旁边咂嘴：“那是奈·加玛，万丹胡椒行家的闺女。她那本账里，迟到的人都有一行。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "gresik"
cast = ["nyai_gama"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_giri" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那一季的丁香晚到了五天，奈·加玛在账本上记了一笔。
[tracks.chapters.default]
