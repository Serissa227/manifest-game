[[tracks.chapters.choices]]
key = "promise"
text = "约好每年先写信，把下一季的船期告诉她"
requires = [{ kind = "bond", person = "nyai_gama", level = "A" }]
hint = "这样的约，一辈子只许得起一回：要么你们还没走到这一步，要么这句话，你已经对另一个人说过了。"
reply = "“写错一天，罚一斤丁香。”她说得很快，像是早就想好了。我说那她也得写。“我从来不写错。”她撕下船期表的一角，叫我当场写明年的头一条：哪个月从特尔纳特开船，几时过安汶，几时到万丹。我写一行，她看一行，看到第三行，伸手把“十五”改成了“十八”：“你忘了在安汶要停三天。”我认了。她把那一角纸收进账本，又从账本里撕下同样大的一角，写上她家胡椒船的日子递给我。字方方正正，一处也没改过。“每年一封，先写日子，再写别的。”我把纸收好，她已经去盯脚夫装箱了，隔着三只货箱喊过来：“丁香要好的！”"
next = "done"
effects = [{ kind = "bond", person = "nyai_gama", level = "S" }, { kind = "relation", person = "nyai_gama", relation = "friends" }, { kind = "memory", memory = "mem-bond_nyai_gama-s", title = "两张船期表" }, { kind = "flag", flag = "c7_bond_nyai_gama_promise" }, { kind = "start_track", track = "reunion_nyai_gama" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好她买下第一条船那天，我的船去万丹替她押第一趟货"
reply = "她看着我，好一会儿没说话，手里那块秤砣转了两圈。“那得等好几年。”我说我等得起。她低头又去看那两张表，这一回没有找哪个月对得上，只是把两张纸叠起来，对折，再对折，塞进我手里。“第一，船是我的，货是我的，价也是我开。”她说，“第二，你只管押货，不许替我讲价。”我说好。她没说是哪一年，也没说是哪一个月，难得一回没算日子，只说：“那你可别迟到。”她翻开账本，在最后一页添了一行：“凯奇利，押第一趟货。”合上账本，她又补了一句：“迟到也记账。”"
