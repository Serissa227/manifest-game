reply = "他愣住了，捧着盒子半天没动。“什么话？”“等碗吹成了再说。”“大碗最难吹，”他慢慢地说，“越大越容易裂，裂了还没法补。”他低头看着盒盖上那几个炭字，过了好一会儿才开口：“那我得练好多年。”“我也得走好多年。”开船那天他来了，站在跳板边上，一句话也没说，伸手握了一下我的手。他的手心全是炉边磨出来的茧，烫得很。握完他没马上松开，把一样东西按进我掌心，才转身走了。船出了潟湖，我才摊开手：是升天节那天的那块蓝碎片，边角磨得圆圆的。"
