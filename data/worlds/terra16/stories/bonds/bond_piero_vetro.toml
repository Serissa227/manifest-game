# A2：1556 年夏秋，熔炉间的窗台。照着窗外讨食的海鸥刻的木雕海鸥（wooden_gull）。
[[tracks.chapters]]
key = "a2"
title = "照着窗外刻的海鸥"
text = "熔炉间的窗外，每天中午都有一只海鸥落在窗台上讨面包。它左脚少一根趾头，学徒们管它叫“瘸子”。这天皮耶罗把一个布包推到我面前。包里是一只木头海鸥，收着翅膀，缩着脖子，左脚——我数了——也少一根趾头。“碎片会割手，不能送人。”他说，“就照着它刻了。”他把海鸥翻过来，底座又宽又平，刨得光溜溜的：“你以后上了船，桌子晃，它也倒不了。”他说话的时候，左手食指上缠着一圈布，布上洇着一点干了的红。我问他怎么弄的，他把手往背后一藏：“木头里有个节，刀走到那儿拐了个弯。”窗外，“瘸子”又来了，歪着脑袋看我们。"
