text = "六年后我回到穆拉诺。熔炉还是那座熔炉，窗台上讨食的海鸥已经换了一只。皮耶罗出了师，自己管一个炉口。作坊靠里的一整面墙钉满了按颜色排好的木盒，最旧最破的那一只摆在正当中；最高一层架子上另有一样东西，拿布蒙着，看不出形状。他正捧着那只旧盒子教一个新学徒认裂纹，说的还是当年那几句。新学徒先看见了我，拿手肘碰他。他回过头，话说到一半停住了，眼睛先落到我手上，又飞快地往最高那层架子上瞟了一眼。“碎片带来了没有？”我把一个布包递过去，里头是这些年在海滩上捡的碎陶片。那块蓝的，我没放进去，还贴身揣着。"

[[tracks.chapters.variants]]
key = "box_on_sill"
when = [{ kind = "flag", flag = "c7_bond_piero_vetro_parted" }]
text = "六年后我回到穆拉诺。熔炉还是那座熔炉，窗台上讨食的海鸥已经换了一只。皮耶罗出了师，自己管一个炉口。作坊靠里的一整面墙钉满了按颜色排好的木盒，最旧最破的那一只摆在正当中。旁边一只盒子我认得——我走的那年开春，把它落在了窗台上。盒盖上原来的炭字被擦掉了，重新写着：没带走的。他正捧着那只旧盒子教一个新学徒认裂纹，说的还是当年那几句。新学徒先看见了我，拿手肘碰他。他回过头，看了我很久，抬下巴朝那只盒子点了点：“这回，带走不带走？”我没答，先从行李里掏出一个布包，里头是这些年在海滩上捡的碎陶片。他接过去，两只手托着，像托着一包金子。"
