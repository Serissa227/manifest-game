# B2：1555 年，炉主的管事上门。追讨料钱的条子；他往火里扔碎片。
[[tracks.chapters]]
key = "b2"
title = "料钱"
text = "炉主的管事踩着午饭的钟点来的，手里捏着一张条子。条子上写着皮耶罗的名字、那一炉的料、一个数目，底下一行：限月底一次还清，还不清，熔炉不许他再碰。皮耶罗把每只口袋都翻了过来，铜钱、小银币，连兜里那把糖杏仁都倒在桌上。数来数去，只够一半。管事把那一半收进钱袋，条子却没收，压在一只空杯子底下：“月底我再来。”炉子还没熄。皮耶罗坐到炉口前，从盒子里一块一块拿出碎片往火里丢，看它们软下去，塌成一滴，再也认不出原来是什么颜色。“要是吹不了玻璃，”他眼睛没离开火，“我还会什么？”"
