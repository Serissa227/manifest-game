# C1：1554 年初，穆拉诺作坊的熔炉边。按颜色收碎片；一盒绿色的碎玻璃。
[[tracks.chapters]]
key = "c1"
title = "碎片也有颜色"
text = "熔炉一天要清三回渣。别的学徒把吹坏的杯子、断掉的瓶颈、掉在地上的料滴一铲子铲进筐里，抬到码头边，哗啦一声倒进潟湖。皮耶罗不铲。他蹲在炉边的石地上一块一块地捡：绿的放一只木盒，琥珀色的放一只，乳白的放一只，盒子在他脚边排了一溜。“捡破烂也要分颜色？”我拿铲子柄敲了敲他的盒子。他没恼，从绿盒子里拈出两块，凑到我眼前。一样的绿，一块的裂纹笔直，一块弯得像虫子爬过。“裂了也能告诉我们什么。”他说，“直的，是出炉冷得太快；弯的，是料里混了沙。一股脑倒进水里，下回还是不知道毛病出在哪儿。”铲渣的学徒在后头喊他让开。他把两块碎片放回去，盒盖也没合，又去捡下一块。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "venice"
cast = ["piero_vetro"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_murano_workshop" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

