# 重逢：1562 年，穆拉诺的作坊。满墙的碎片盒子；最旧的一盒在正当中。
[[tracks.chapters]]
key = "reunion"
title = "越来越多的盒子"
text = "六年后我回到穆拉诺。熔炉还是那座熔炉，窗台上讨食的海鸥已经换了一只。皮耶罗出了师，自己管一个炉口。作坊靠里的一整面墙钉满了架子，架子上全是木盒，按颜色排：从乳白排到琥珀，从琥珀排到绿，再排到几乎是黑的。最旧最破的那一只摆在正当中。他正把那只盒子捧在手里，给一个十二三岁的新学徒看两块碎片：“直的，是冷得太快；弯的，是料里有沙——”还是当年那几句，一个字没改。新学徒先看见了我，拿手肘碰他。他回过头，眨了两下眼睛，第一句话是：“碎片带来了没有？”我从行李里掏出一个布包，里头是这些年在好几个港口的滩上捡的碎陶片，有釉的、没釉的、带半截花纹的。他接过去，两只手托着，像托着一包金子。"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "venice"
cast = ["piero_vetro"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

[tracks.chapters.default]
