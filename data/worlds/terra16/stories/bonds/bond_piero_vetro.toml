# S：1556 年 12 月，穆拉诺的码头。一盒“赢了也裂”的碎片；做坏的也寄来。
[[tracks.chapters]]
key = "s"
title = "做坏的也寄来"
text = "我搭的那条船开春离港，往东走，先到科孚，再看风往哪边吹。皮耶罗明年出师，要守穆拉诺的炉子，一年到头走不出这座岛。离开船还有好些日子，他抱着一只木盒到码头来找我，盒盖上用炭写着几个歪字：赢了也裂。“你拿着。”他把盒子塞过来，“在海上看见什么做坏的东西，也寄来。别光挑好的寄，好的谁都会做。”“海上做坏的，多半是船。”“那就寄船的碎片。”他说得理直气壮，“一块船板也行，我看得出它是怎么裂的。”盒子不重，晃一晃，里头哗啦啦地响，有一声特别脆，像是一截杯脚。"
