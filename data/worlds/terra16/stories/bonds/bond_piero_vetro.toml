# A1：1556 年耶稣升天节，潟湖上的小船。一块透亮的碎片，手背上的一小块蓝。
[[tracks.chapters]]
key = "a1"
title = "与海成婚的那天"
text = "升天节那天，总督的金船从圣马可出来，船身金得晃眼，几十支桨一齐落下去，又一齐抬起来。潟湖上的船挤得船帮碰着船帮，划不动，也没人想划，都等着看总督往海里扔那枚戒指。皮耶罗不知从哪儿借来一条漏水的小船，载着我挤进船堆，一路拿木勺往外舀水。到了地方，他把勺子一扔，从兜里掏出一块碎片。金船那边吹起了号角，他头也不回，把碎片举起来对着太阳，眯着一只眼睛调角度：“手伸出来。”我伸了。光从碎片里穿过来，在我手背上落下一小块蓝，指甲盖那么大，边上镶着一圈白。四周的人都在喊，戒指大概已经沉下去了。“看见没有，”他说，“海是这个颜色的。”"
