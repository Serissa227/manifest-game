reply = "七只杯子藏进了柴堆底下。我们找了三天：换过吹管，查过料，最后是他拿手背一寸一寸去试炉膛边上的砖——靠窗那半边比里头凉。“炉温不匀，”他说，“我站的那个口，偏偏是凉的。”他把七只杯子按裂纹排在一块木板上，从直的排到弯的，排完蹲在那儿看了半天：“这一炉，也算没白烧。”"
next = "b1"
effects = [{ kind = "affinity", person = "piero_vetro", value = 2 }, { kind = "bond", person = "piero_vetro", level = "C" }]

[[tracks.chapters.choices]]
key = "tell_master"
text = "劝他明天一早去跟师傅说实话。"
reply = "“说了也是扣钱。”“扔了也是扣钱，”我说，“还多一样心虚。”他第二天一早去了。隔着两道门，我都听得见师傅骂了他足足一个时辰，骂到嗓子都哑了，才甩下一句“料钱慢慢扣”。皮耶罗出来的时候头发上还沾着炉灰，脸上倒松快了：“挨骂比往潟湖里扔东西好受。扔一只，心里就跟着沉一只。”"
next = "b1"
effects = [{ kind = "affinity", person = "piero_vetro", value = 3 }]

# B1：1554 年秋冬，作坊里的比试。最薄的高脚杯与杯脚上的一道细裂。
[[tracks.chapters]]
key = "b1"
title = "最薄的一只"
text = "师傅定了个比法：每个学徒吹一只高脚杯，谁的最薄，谁这个月多拿两天工钱。我那只吹得最快，杯壁薄得我自己都得意，放进退火炉没多久，“啪”的一声，齐腰裂成了两半。旁边有人笑出声，我回头瞪了一眼，笑声更大了。皮耶罗的那只最后出炉。师傅把它举到窗前，午后的光从杯身里穿过去，在地上落下淡淡的一圈，连杯壁里一根细细的气纹都看得见。满屋的学徒拍着桌子叫好，师傅当场点了头：“这才叫杯子。”皮耶罗上前接杯子，嘴里还说着“谢师傅”，可他的手指捏住杯脚的那一下停住了，拇指在接口上来回蹭了半下。我站得近，看见了：那儿有一道裂，细得像一根头发。"
