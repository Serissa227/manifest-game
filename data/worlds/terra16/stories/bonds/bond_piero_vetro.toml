# C2：1554 年夏，夜里的码头。一整炉裂了的杯子；他的秘密从这里开始。
[[tracks.chapters]]
key = "c2"
title = "夜里倒进潟湖的杯子"
text = "师傅打发我夜里去码头取一捆明早要用的苏打灰。月亮很亮，潟湖平得像一块还没吹开的料。码头尽头蹲着一个人，抱着一只筐，从里头拿起一只杯子，看一眼，扔进水里，“咚”的一声，再拿下一只。是皮耶罗。筐里是他白天吹的一整炉，二十几只，只只都裂了。那一炉的料是从炉主那边赊来的，师傅作的保，要从他的工钱里扣——我替他算过，扣到明年开春也扣不完。他听见脚步，一回头，手上一松，筐子歪了下去，差点连筐带杯滑进水里。我抢上去一把揪住筐沿：“连筐也要扔？”他没道谢，把筐子抱回怀里，盯着我说：“你什么都没看见。”筐底还剩七只。"
