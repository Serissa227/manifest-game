# C7 羁绊线（Claude 重写）：bond_ines_costa「伊内丝：剩下半行」+ reunion_ines_costa「伊内丝：寄来寄去的本子」——遵循 A5 / E37 故事 2.0 契约。旧稿（GPT 版）整篇作废，只沿用章节 key、地点与窗口。
# 标签：GL（纯 GL；可恋爱的羁绊线）。
# 主角：莉芙·德克莱尔克 lieve（1540-10-12，安特卫普兑换商之女，母亲是葡萄牙商人团体通事的女儿）；第一人称“我”，账本体，说话带数，爱打赌（只赌算得清的）。
# 人物：伊内丝·达·科斯塔 ines_costa（1540-07-19，女，romance.with = ["f"]，葡萄牙商人团体书记的女儿）。
#   各章年龄：C1（1554 春）她 13、莉芙 13；A1（1556-01—02）都是 15；S（1556-12）她 16、莉芙刚满 16（heart 选项要求双方 16—17）；
#   重逢（1568）她 27—28、莉芙 27—28（恋人落点要求双方满 18）。
#   学院期只写在意、借口与牵手：A1 的心动是一路抓着袖子，S 的 heart 只是握手、约好成年相见时再答；不写交往、恋人与亲吻。
# 依据·史实：安特卫普的葡萄牙商人团体（nação）与它的书记房；1531 年落成的新交易所与回廊；修辞会（紫罗兰会）不收女孩；
#   1555 年 8 月彼得·海恩斯开办的“月桂树”女子法语学校（开学以前伊内丝跟家庭教师念书）；城墙外的护城河冬天结冰、全城下冰；
#   伊内丝家 1566 年以后回里斯本（TERRA16 §12.11），重逢在里斯本阿尔法玛坡上看得见特茹河的房子。
# 依据·原创：只写半行的本子与诗社的花名（她是“半行”，我是“账房”）；后屋的四把椅子与诗社的第一页账；三个星期的罚诗；
#   冰上的半行与被抓皱的袖子；压花诗笺上的真名；S 章她挑了一下午才买下的第二个本子；重逢书架上的三本旧本子与桌上的第四本。
#   待核：1554 年安特卫普到里斯本的客舱船价（正文“十一个弗罗林上下”是莉芙心算的数，只作人物口吻）；1556 年初护城河结冰的确切日子。
# 秘密：伊内丝家藏着旧信仰的祈祷文。正文只在 C2 用“开门前的停顿、进门后换了声调、‘这里可以大声读’”暗示，B1 有一句“头一回听她在家里笑出声”的呼应；
#   永远不点明，不进见闻、标题、选项、回忆标题。本文件各章不设见闻（news）。
# 口头禅“剩下半行，归你。”原句只在 C1 正文出现一次；A2、重逢用别的字句呼应，来信不照搬。
# 缺省走向（玩家什么也不做）：c1 → c2 → b1 → b2 → a1 → a2 → s，各章 default 无效果；
#   s 的 default 设 c7_bond_ines_costa_parted 并开启重逢；重逢 default 是伊内丝的一封来信（附里斯本的门牌与第四本的第一页），设 _missed。
# 旗标：写 c7_bond_ines_costa_promise / _romance / _own / _parted（S）、_landing_friend / _landing_love / _missed（重逢）；
#   S 的 promise 与 heart 另写共享旗标 c7_pair_ines_costa_sophie_lemaire_taken（pair_ines_costa_sophie_lemaire 的落点读它，两人改走并肩的朋友）。
