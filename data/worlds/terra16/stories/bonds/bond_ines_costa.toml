# B1：1554 年秋，伊内丝家的后屋。修辞会不收女孩，两个人自己办诗社。第四把椅子。
[[tracks.chapters]]
key = "b1"
title = "第四把椅子"
text = "紫罗兰修辞会的门房说得客气：姑娘们可以坐在台下听，上台念是不成的。伊内丝谢过他，转身就走。第二天她把我领到她家后屋，一间堆过布匹的小屋，窗子朝着院子，墙上还留着钉货签的钉眼。她端来一盆水，一把一把擦椅子。擦完第二把我以为够了，她又从隔壁搬来第三把、第四把。“我们只有两个人。”“先让后来的人有地方坐。”她拧干抹布，把第四把椅子摆在门边，椅背靠着门框。我掏出随身的小账簿，翻到新的一页，替诗社记下第一笔：椅子四把，社员二人，诗半首。伊内丝凑过来看，手指点着“诗半首”：“这半首是我的。”“那就写清楚：欠诗半首，债主德克莱尔克。”她笑出了声。这是我头一回听她在家里笑出声。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "antwerp"
cast = ["ines_costa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

