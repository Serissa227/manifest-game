# B2：1555 年 8 月 15 日以后，“月桂树”开学。她客气得像对外商，诗社的本子三个星期没交。
[[tracks.chapters]]
key = "b2"
title = "客气得过分"
text = "“月桂树”开学那天，海恩斯先生在门口点名，五十来个女孩，一半寄宿。头一个礼拜我就认全了半个班：谁家做蕾丝，谁家放债，谁的法语带着里尔腔。午饭时我坐在长桌中间，跟人赌布丁里有没有葡萄干，一连赌赢三回，周围笑成一片。伊内丝坐在长桌那一头。从那以后，她跟我说话像对一个来谈生意的外商：“劳驾您把盐递过来。”“谢谢您。”“您说得对。”诗社的本子轮到她交，她没交。头一个礼拜我当她忘了；第二个礼拜，我在账簿上记了一个“欠”字；第三个礼拜，那个“欠”字后面已经排了三行。放学时我在门廊叫住她，她站定，规规矩矩行了个礼：“您还有什么吩咐？”"
