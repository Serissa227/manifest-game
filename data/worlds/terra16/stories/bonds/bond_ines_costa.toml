# A2：1556 年秋，诗社散会以后。压花诗笺上署的是她的真名；赠礼 pressed_flower 与回忆在给 bond A 的选项上。
[[tracks.chapters]]
key = "a2"
title = "压在诗笺里的花"
text = "九月，护城河边的柳叶落了一层。诗社散了会，别人都下了楼，伊内丝把我留下，从韵书里抽出一张对折的诗笺递给我：“先看，看完再说话。”笺里压着一朵小花，早干了，薄得透光，颜色褪成旧蕾丝那样的淡黄。诗是一整首——她头一回写满了一整首，一行也没给我剩。落款也不对。诗社的规矩，大家都署花名：她是“半行”，我是“账房”。这一张上面署的是她自己的名字，一笔一画，伊内丝·达·科斯塔。“诗社的规矩，我破了，”她说，“罚多少，你记。”她把笔蘸好墨，搁在诗笺旁边，笔杆朝着我，然后就站在那儿，两只手背在身后，等着。"
