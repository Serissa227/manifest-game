# S：1556 年 12 月，伊内丝家后屋（阁楼冬天不生火，诗社的四把椅子搬了回来）。我正月出海，她家在谈以后回里斯本的船。
[[tracks.chapters]]
key = "s"
title = "船票以外"
text = "十二月，“月桂树”散了学，寄宿的女孩一个个被家里接走。借来的阁楼冬天不生火，诗社那四把椅子又搬回了伊内丝家的后屋，靠墙排着。我正月就要上船，父亲的账簿已经锁进了我的箱子。伊内丝家也在谈船——不是今年，是“以后”：里斯本来的信一封比一封催得紧，她父亲每天晚饭后把船期表摊在桌上，用指甲顺着一行一行划。我们并排坐着，她坐的是门边那把，第四把。诗社的本子摊在两人膝头，最后一页还是她的半行。“船票我算过了，”我说，“安特卫普到里斯本，一个人，舱位带伙食，十一个弗罗林上下。”“你算这个做什么？”“总得知道将来要花多少，才见得着你。”伊内丝没接话。她把本子从中间翻开，手指顺着装订线走了一遍，线是她自己缝的，针脚很密。“那船票以外的呢？”她问，“你也算过吗？”"
