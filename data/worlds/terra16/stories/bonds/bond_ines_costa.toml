# C2：1554 年夏，科斯塔家门口。开门前的停顿、进门后换了的声调——只写到这里，不点明。
[[tracks.chapters]]
key = "c2"
title = "门口的停顿"
text = "我去还她借我的那本韵书。科斯塔家在会馆后面那条巷子里，门漆成深绿色。伊内丝来开门，一只手搭在门框上，停了一下——不长，像过门槛前先数一步——才侧身让我进去。进了门，她说话换了一种声调，很轻，每个字都压得低低的。屋里并没有人在睡觉，厨房里还有锅铲响。我把韵书放在桌上，也跟着压低了嗓子，压着嗓子说交易所的胡椒价，说到一半自己先觉得好笑。她没笑，从架上抽出一本诗集塞给我，翻到中间，手指点着一首：“这一首好。”送我出门时，她已经站在门槛外头，声音回到了平常的样子：“这里可以大声读。”我抱着诗集走到巷口，回头看了一眼那扇绿门。她说的是“可以”。"
