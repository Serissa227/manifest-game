# 重逢：1568 年，里斯本阿尔法玛坡上看得见特茹河的房子。书架上三本旧本子，桌上第四本，最后一页只有半行。
[[tracks.chapters]]
key = "reunion"
title = "寄来寄去的本子"
text = "伊内丝的房子在阿尔法玛的坡上，窗子对着特茹河，河面上停满了等风的船。门房说，来信的商人都是女主人自己见，不经书记的手。我上楼时，她正坐在窗前写回信，桌角摞着一沓拆过的信：安特卫普的、伦敦的、科隆的，都是诗社散了以后流落各处的人寄来的，有人问家里人的下落，有人只寄一首诗。她听见脚步，抬头，笔就停在了半个字上，那封信也不写了。“你晒黑了。”书架上并排立着三本旧本子，牛皮面磨得发白。第四本摊在她桌上。她没有起身，用两根手指把它推过桌面，推到我跟前，翻到最后一页。那一页上只有半行，墨色还新：河水换了一年又一年，船还没有——她把笔搁在本子旁边。“十二年，”她说，“你算算，欠了我多少行。”"
