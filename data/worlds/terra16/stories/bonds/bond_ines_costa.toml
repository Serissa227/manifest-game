# C1：1554 年春，葡萄牙会馆二楼的楼梯口。每页只写半行的本子。
[[tracks.chapters]]
key = "c1"
title = "剩下半行"
text = "母亲替外祖父给葡萄牙会馆送一份译稿，我在二楼的楼梯口等她，数交易所的钟敲到第几下。书记家的女儿伊内丝从里间出来，在我旁边坐下，一句话没说，先把一个本子推到我膝上。牛皮面，四角磨得起毛。我翻了几页：每一页的诗都只写半行，葡萄牙语的、佛兰芒语的，写到句子中间就停，右边一截干干净净。“你家缺纸？”我说，“一刀纸十二个斯图弗，照你这么写，一本亏掉一半。”她摇头，声音轻得像怕楼下的人听见：“剩下半行，归你。”她那半行写的是：斯海尔德河涨潮的时候——我在后面挤了一句“胡椒也跟着涨价”，写得太挤，末一个字掉到了下一行，韵也押错了。我去摸刮刀，她按住我的手：“别擦。”她在下一行换了个方向，把我押错的那个音当成新的韵脚，又往下写了半行。“我找了半年，”她说，“才找到一个肯接的人。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "antwerp"
cast = ["ines_costa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_antwerp_laurel" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "ledger_rhyme"
text = "照记账的格式把她下一个半行补完：进项、出项、结余。"
reply = "她写：“潮水退下去，留下——”我接：“进项，蛤蜊三只；出项，鞋一双；结余，一个下午。”她念了一遍，笑得弯下腰，本子从膝头滑到了地上。她捡起来，拍掉灰，又念一遍：“我从没见过这么会算计的诗。”她用指甲按着那一行数了数音节，“可韵是对的。”她把那一页的右上角折了个角，折得很仔细，压了两下。"
next = "c2"
effects = [{ kind = "affinity", person = "ines_costa", value = 4 }]

[[tracks.chapters.choices]]
key = "bet_rhyme"
text = "跟她赌一个斯图弗：猜她下一个半行押什么韵。"
reply = "我赌她押“海”——前三页有两页押的都是海。她想了一下，写了“船”。我输了，从钱袋里摸出一个斯图弗放在本子上。她没推回来，把那枚钱夹进了书脊旁边，合上本子压了压：“等有了诗社，这是第一笔进项。”我说诗社还没影子呢，账倒先记上了。她说：“你记账，我写诗，不就有了。”"
