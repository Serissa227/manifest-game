# A1：1556 年 1—2 月，城墙外结冰的护城河。她第一次在人群里念诗；我被抓皱的袖子。
[[tracks.chapters]]
key = "a1"
title = "冰上的半行"
text = "正月里冷得出奇，城墙外的护城河冻实了，半个安特卫普都下了冰：卖热葡萄酒的推着小车，学徒绑着骨头磨的冰刀，几个孩子拿扫帚追一只木球。伊内丝是头一回滑冰，脚上的冰刀是向她表哥借的，大了一号，用布条缠在鞋上。她一下冰就抓住我的袖子，抓得死紧，我往哪边滑，她就往哪边歪。“松一点，”我说，“这是我最好的一件。”“松了我就躺下了。”她没松。滑到城门边，人挤着人，有人撞了她的肩膀，她晃了一下，嘴里忽然冒出半行诗：“冰上的人都忘了，脚下是水——”声音不大，可是在外头，在一大群人中间。我愣了一下，接上：“——水也忘了，它欠春天一笔账。”她转过头看我，鼻尖冻得通红：“我从来没在外面念过。”她顿了顿，“当着这么多人。”我的袖子在她手里攥成一团，皱得像一张揉过的账单。"
window = [[1556, 1, 1], [1556, 3, 2]]
at = "antwerp"
cast = ["ines_costa"]
speaker = "captain"
mood = "tender"
