[[tracks.chapters.choices]]
key = "own"
text = "把绳还给他：这截绳，该留给你自己船上的人。"
reply = "我把绳递回去。他接住，在手里掂了掂，好一会儿没出声。“也对。”他终于说，“你是领航，我是潜水的。一个在上头看星，一个在底下摸蚌。”他把那截绳系回自己腰上，跟原来的拉绳接在一起，接头打的还是那个结。“那就祝你的船别碰礁。碰了也别慌，喊一声，巴林的人水性都好。”他咧开嘴，这回是真笑。第二天开船，他在码头上冲我挥手，挥的是拴着绳子的那只手。"
