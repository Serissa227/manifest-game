# C2：夜里值更，石子摆成的星图。纳吉玛的那句“差一指”只在这里用一次。
[[tracks.chapters]]
key = "c2"
title = "没有字的星"
text = "夜里轮到我们值更。我把星图摊在舱口上教星名，阿卜杜拉看了半天，说那些字像一群蚂蚁在搬家。他从压舱的袋子里抓来一把石子，在甲板上一颗一颗摆开。“这颗亮的，叫钉子，钉在那儿就不动。这两颗挨着的，骆驼的膝盖。”我说书上不是这么叫的。“书上的名字又不会掉进海里。”轮到他教我换气。“先吐，吐干净，肚皮贴到脊梁上。再慢慢吸，三口。”他捏住我的鼻子数数，数得比我的心跳还慢。后半夜我对着石子核星图，有一颗他摆得比我画的低。我伸直胳膊，拿手指去量它离海面多高——错的是我的图，错了一指。我低声说：“差一指，就差一百里。”他头也不抬：“那颗啊。在巴林外海，我看它一头扎进珊瑚礁里，看了好几年。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "zabid_city"
cast = ["abdullah"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

