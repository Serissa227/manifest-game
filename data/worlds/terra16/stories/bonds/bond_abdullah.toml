[[tracks.chapters.choices]]
key = "count_aloud"
text = "告诉他：八十七下。"
reply = "“八十七。”他愣了一下，接着笑得差点又滑回海里：“下回数大声点，让整条船都听见！”笑够了，他凑过来，压低了嗓子：“八十七……算多吗？”我说，比二十拓可信。他抹了一把脸上的水，往后再没提过二十拓。"
next = "c2"
