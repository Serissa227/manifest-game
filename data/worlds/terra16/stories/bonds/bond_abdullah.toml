# 重逢：1561 年采珠季的巴林。友情落点永远可选；恋爱落点要 _romance、心动 ≥ 24、双方成年。
[[tracks.chapters]]
key = "reunion"
title = "珠子与名字"
text = "采珠季的巴林，岸上全是晒贝的腥气。一条采珠船刚靠过来，船头的人没等跳板放下就跳进海里，蹚着齐腰的水往岸上走，嗓门比在学堂时还大：“纳吉玛！来得正好，帮我看账！”阿卜杜拉现在是这条船的股东了。那笔债三年前就清了——他当着卡迪的面，把借据从头念到尾，念到那句连刮风天也算进去的利钱，停下来，请卡迪自己看。他的账本第一页写满了潜水人的名字，字还是歪的，一个挨着一个。“你看看，有没有把谁拼错。名字拼错了，下了海，海里的东西认不出人，不知道该还给谁。”岸边晒贝的人还在说两年前的事：奥斯曼人从巴士拉打过来，围了些日子，又退回去了。他听着，只摆摆手。他从舱里的箱底翻出一样东西，展开给我看。是那张星图，边角磨得像布一样软，背面结着盐花。他还在用。"
window = [[1561, 6, 1], [1561, 9, 30]]
at = "bahrain"
cast = ["abdullah"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1561, 6, 1], to = [1561, 9, 30] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "abdullah", text = "纳吉玛：你今年没来。没关系，巴林又跑不了。债清了，三年前就清了。我当着卡迪念的借据，念到刮风那一句，卡迪的胡子都翘起来了。船上今年添了三个潜水人：优素福、哈米斯、小拉希德，名字我写在最后头，你替我看看拼对没有。小拉希德才十四，憋气比我当年还长，这个我不认。那张星图还在我箱子里，钉子旁边我添了两颗新的，外号是我自己写上去的。今年替我拉绳的还是我舅舅，他老了，手还稳。明年你若来，换你。阿卜杜拉。这封是我自己写的，拼错了两处，我知道是哪两处，你别笑。" }, { kind = "flag", flag = "c7_bond_abdullah_missed" }]

[[tracks.chapters.choices]]
key = "partner_charts"
text = "替他把潜水人的名单逐个核对，约好合做一张给采珠船用的礁图。"
reply = "我们坐在晒贝的席子边上，一个名字一个名字地对。他念，我核，错了两个：一个多了个点，一个少了一笔。他改的时候，嘴里念叨着给那两个人赔不是。核完了，我在每个名字旁边记下他们常下的礁。他报一个，我写一个：北边的浅滩，灯塔外那片黑礁，他舅舅年轻时下过的“老井”。他报得飞快，哪片礁多深、底下是沙是石，张嘴就来；报的深浅，后来我拿测深锤一处处量过，差不过半拓。天黑透了，写满了两页。他把账本合上，又打开，指着第一页最上头：“这张图，要署两个名字。你的写前头。”他顿了一下，“拼错了，算我的。”"
next = "done"
