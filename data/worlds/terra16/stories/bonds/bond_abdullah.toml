text = "认了错，再教他一个手势：在水底下用手指“钉子”的方向。"
reply = "他照着学了三遍，手指一回比一回指得准。“水底下又看不见星。”“看不见，也得知道它在哪儿。”他想了想，把手放下来：“这话像我娘念的经。”第二天下水前，他先朝北边指了一下，才去摸绳结。"
next = "b2"
effects = [{ kind = "affinity", person = "abdullah", value = 3 }, { kind = "skill", skill = "astral_navigation", value = 4 }]

# B2：借据。他念的那句纸上没有。秘密只在两人之间，不写见闻。
[[tracks.chapters]]
key = "b2"
title = "珠船的债"
text = "巴林来了一封信，是托集市上的代笔人写的。阿卜杜拉捏着信在甲板上转了两圈，才塞给我：“你念。”信里说，他父亲要他把随身带的那张借据，拿给学堂里有学问的人看一看。他从贴身的布袋里掏出借据，摊开：“这个不用你念。我念给你听，你看对不对。”他念得很顺，一个磕绊也没有：“本钱若干，利钱按出海的日子算，歇风日不计息……”他的手指一直按在第三行上。他念的那几句，在第五行。我照着纸念了一遍：利钱按天算，连刮大风出不了海的日子也算在里头。“歇风日不计息”，纸上没有这一句。“是收账的人当面说的。”他的声音低下去，“我爹在场，我也在场。”海风把借据掀起一角，他伸手按住，按了很久。“我爹以为我认得。”他说，“我跟他说，我核过了。”"
