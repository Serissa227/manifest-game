# A2：签名的星图与贝壳手串。bond A、赠礼与回忆在 read_his_name 与 wear_bracelet 上。
[[tracks.chapters]]
key = "a2"
title = "认得自己的名"
text = "大采季要开了，巴林的船六月就得下海。阿卜杜拉要回去一趟，走的前一晚，他把我们画了两年的那张星图从舱里抱出来，铺在甲板上，四个角拿石子压住。图上是我的字，他摆过石子的地方画着一个个小圈，他起的外号挨在圈边上：钉子，骆驼的膝盖，瞎了一只眼的。“你收着。”他说，“我……能不能在这儿签个名？”他握笔像握一把刀，一笔一笔地写，写到一半停下来喘气，像刚从水底上来。写完了，是一个完整的名字：阿卜杜拉。歪得厉害，可一个字母也没少。他又从腰带里摸出一串东西，在手里攥了一会儿才摊开：贝壳，大大小小，拿麻线穿着。“我自己潜下去捡的。”他赶紧补一句，“不值钱，里头没有珠子。”他看看手串，又看看那个名字。“你念一下。我想听听，别人念我写的字，是什么声音。”"
