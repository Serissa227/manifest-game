[[tracks.chapters.choices]]
key = "promise"
text = "收下这截绳，约好每年采珠季过后在巴林见，他念一封自己写的信给我听。"
requires = [{ kind = "bond", person = "abdullah", level = "A" }]
hint = "这根绳，你已经答应过替别人握着；这一回，你只能祝他一路平安。"
reply = "我把绳绕在手腕上：“每年采珠季完了，我到巴林去。你写一封信，念给我听。”他转过脸来，愣了好一会儿，从包袱里把那张星图抽出来，翻到背面，借着灯写。写得比哪一回都慢，写一个字，抬头看我一眼，像怕一低头我就走了。写完他推过来，让我念。我念了：采珠季过后，巴林，一封信。短短一行，错了一个点。我没改。他点点头，把刀收回鞘里：“一年一封。写不完的，我就念给海听。”第二天开船前，他站在码头上，抬手朝北边指了一下，钉子的方向。"
next = "done"
effects = [{ kind = "affinity", person = "abdullah", value = 5 }, { kind = "bond", person = "abdullah", level = "S" }, { kind = "relation", person = "abdullah", relation = "friends" }, { kind = "flag", flag = "c7_bond_abdullah_promise" }, { kind = "memory", memory = "mem-bond_abdullah-s", title = "握绳的人" }, { kind = "start_track", track = "reunion_abdullah" }]

[[tracks.chapters.choices]]
key = "heart"
text = "收下绳，告诉他：等你能把一整封信念完，再把今晚这句话说一遍。"
requires = [{ kind = "bond", person = "abdullah", level = "A" }, { kind = "heart", person = "abdullah", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "abdullah", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "abdullah" }]
hint = "这句话，要等你们再熟一些、心里也更确定的时候，才说得出口。"
reply = "他转过来，脸一下子红到耳根，月光底下都看得出来。他笑了，笑声比平时小得多：“那得好多年。”“我等得起。”我把那截绳收进袖子里，“差一个点，我都等得起。”他不笑了。他伸手过来，握了一下我的手，很快又松开，像怕把什么结握松了。然后他站起来，在船尾走了一个来回，又坐下，坐得离我近了一拳。“那你记着，”他说，“是一整封。一个字都不许替我念。”后半夜他一直在小声念字母，念一遍，问我一遍对不对。"
