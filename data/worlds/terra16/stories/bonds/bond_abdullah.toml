# A1：船头的炭字。心动选项不要求已有心动。
[[tracks.chapters]]
key = "a1"
title = "差一个点"
text = "季风转向的那天清晨，船头的木板上多了一行炭写的字，歪歪扭扭，像被浪推过一样。我认出来了，是我的名字：纳吉玛，星。阿卜杜拉蹲在缆桩边，装作在理绳子。“我就是喜欢星。”他抢在我开口之前说，“学的头一个词刚好是星，刚好而已。你别多想。”那几个字母里，有一个点落错了地方，落在了底下，不在上头。差这一个点，就成了另一个字。我向来是要较真的。可我站在那儿，看着那个点，看了很久。“怎么了？”他终于忍不住，站起来，手上的炭灰在裤腿上蹭了两道，“写错了你就说。先生的骂我都挨惯了，还怕你？”"
