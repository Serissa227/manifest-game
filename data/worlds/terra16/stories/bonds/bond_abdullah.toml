# S：东北季风起，学堂的船要散了。他给我一截绳，我把星图塞进他的包袱。只有 promise 与 heart 带 bond S。
[[tracks.chapters]]
key = "s"
title = "握绳的人"
text = "东北风起来的第三天，学堂的船要散了。他要回巴林，亲自到收账人面前念那张借据；我要出海。我把那张签了两种笔迹的星图卷好，塞进他的包袱。他要推回来，我说那些星我背得出，他背不出。最后一夜，月亮很薄。他坐在船尾，拿刀割下一截拉绳，刀刃在绳上锯了好几个来回。他在那截绳上打了一个结，采珠人的结，拽了拽，又拽了拽，递过来。“我下水的时候，”他说，“拉绳的人要是你就好了。”说完他自己先把脸转过去，看海。海上什么也没有。我握着那截绳。结打得很紧，比他教我的时候哪一回都紧。“拿着吧，”他还是对着海说话，“多大点事……一截绳子的事。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "zabid_city"
cast = ["abdullah"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

