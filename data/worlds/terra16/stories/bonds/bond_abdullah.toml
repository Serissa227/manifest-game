# C1：测深锤落水，他重打了我的结。口头禅原句只在这里用一次。
[[tracks.chapters]]
key = "c1"
title = "结还松着"
text = "测深锤从小艇边上滑了下去，绳子断在一处旧磨口上。先生骂了一句，问谁肯下去捞，阿卜杜拉的手已经举起来了。备用的绳是我系的。他光着脚走过来，没看我，先拿手指把我的结捋了一遍，眉头就皱了：“这个一沾水就滑。”他当着全船的面拆了，重打，把绳头塞进我手里：“拽。拽到你拽不动为止。”我拽了，结纹丝不动。“这片锚地才多深？我在巴林潜过二十拓。”有人笑出声。他改口：“十五。十五总有吧。”他坐上船舷，低声念了几句护身的经文，回头冲我咧嘴：“多大点事，一口气的事。”一翻身就沉了下去。我把绳搭在掌心，数自己的心跳。数到八十七，水面破开，他举着锤子冒出来，头一个看的不是先生，是我。他扒着船舷喘了两口，第一句话是：“你刚才是不是在数？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "zabid_city"
cast = ["abdullah"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_shipboard_zabid" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

