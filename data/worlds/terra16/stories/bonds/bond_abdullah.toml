# C7 羁绊线：阿卜杜拉——握绳的人（故事 2.0，A5 / E37 契约）
# 标签：BG；主角纳吉玛（najma，1540-08-24）；同学阿卜杜拉（abdullah，1540-02-13，romance.with = f），生年差半岁。
# 轨道：bond_abdullah（request，academy，C1 C2 B1 B2 A1 A2 S，1554—1556，摩卡外锚地的船上学堂）
#       + reunion_abdullah（main，一章，1561 年采珠季的巴林）。
# 年龄：学院期两人都不满 18，只写在意、借口、约好明天还来；A1 / A2 的心动选项与 S 的 heart 选项在 requires 里写双方年龄；
#       S（1556-12）两人都是 16 岁，heart 只是“等你念完一整封信再说一遍”，最多握一下手；
#       重逢（1561）纳吉玛 20、阿卜杜拉 21，恋人落点要 c7_bond_abdullah_romance + 心动 ≥ 24（A1 6 + A2 6 + S 12）。
# 依据：史实——波斯湾的采珠季（夏季大采，六到九月）；采珠船主预支、潜水人按季抵债的借据；
#       1559 年奥斯曼人从巴士拉出兵围巴林未下（重逢里只作岸上人的两年前旧闻）。
#       原创——学堂、测深锤、石子星图与外号（“钉子”即北极星）、两下拉绳的约定、借据上多念的那句“歇风日不计息”、
#       船头的炭字、贝壳手串、那截拉绳与五年的信。
#       待核：无。卡迪当面核账只写结果，不写具体的诉讼程序。
# 秘密：阿卜杜拉不识字、却对父亲说借据核过了——B2 由纳吉玛发现，只在两人之间；全线不写见闻。
# 缺省走向：玩家不在场时故事照走、没有收获；S 无人在场 → c7_bond_abdullah_parted，重逢照样开启；
#       重逢不在场 → 他的亲笔信（c7_bond_abdullah_missed）。
# 旗标：设 c7_bond_abdullah_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#       重逢的 variants 读 _romance。本线无配角恋人线，不设也不读 _taken；不读其他外部旗标。
# 日程：重逢在 bahrain（1561-06..09）；cast 里阿卜杜拉 1557 年起仍写 zabid_city，须由整合方改到巴林（见交付说明）。
# 地点（2026-11-01 close-places）：养成期纳吉玛的所在地是家庭阶段的 zabid_city（学堂的船泊在师傅的海湾），学院章 at 由 mocha 改 zabid_city；
#   B1 正文点名“摩卡南边的浅礁”，去掉 at（不限地点，养成期就在学院期触发），正文不动。

[[tracks]]
