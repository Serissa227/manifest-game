# B1：浅礁练潜，我没理他拉的两下。胜负已定：是我错了。
[[tracks.chapters]]
key = "b1"
title = "两下拉绳"
text = "摩卡南边的浅礁，先生让我们轮流练潜。阿卜杜拉守我的绳头，下水前一句一句讲定：“拉一下，平安。拉两下，上来。听见没有？两下就上来。”礁底的光是绿的。我数着时辰，想破自己上回的数，腰上的绳猛地一紧，又一紧。我装作没觉出来，伸手去够前头一丛海扇。下一刻我整个人被往上拖，背擦过礁石，脑袋撞出水面。他跪在小艇里，两手攥着绳，指节发白。“我拉了两下。”他没有笑。我从没见过他不笑。“海里的东西，不等你逞强。”我说我还剩一口气。他把绳往艇底一扔，掌心横着一道勒出来的血印。过了很久，他才又开口：“我小时候，替我拉绳的是我舅舅。”他低头看着那道印子，“我最怕的，就是手里的绳子忽然一点分量都没有了。”"
window = [[1554, 9, 1], [1554, 12, 31]]
cast = ["abdullah"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

