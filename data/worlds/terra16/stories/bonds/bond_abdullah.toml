text = "认错，把“两下就上来”的手势画在本子第一页。"
reply = "我把本子翻到第一页，画了一只手，两根手指朝上。他探过头来看：“你这画的是两条鳗鱼。”我没改。他看了一会儿，也没再叫我改，只把那根绳在自己手腕上多绕了一圈，打了个结，拽紧。"
next = "b2"
effects = [{ kind = "affinity", person = "abdullah", value = 4 }, { kind = "skill", skill = "diving", value = 6 }]

