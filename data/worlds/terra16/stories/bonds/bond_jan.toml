# A2：1556 年秋，我回了一张账目格式的诗，故意拼错“散步”；他重排了，没改那个错；送我一枚反刻的梨木小印。赠礼 carved_seal。
[[tracks.chapters]]
key = "a2"
title = "账目格式的诗"
text = "九月，我回了他一张。照账目的格式写，左边借方，右边贷方：借走的鹅毛笔一支，未还；欠我的笑，三回，见二月、五月、七月；替他挨掌柜的骂一回，作价两个斯图弗。最底下结余一栏，我写的是“一次散步”——散步那个词，我故意拼错了一个字母。过了三天，扬把那张纸还给我，旁边多了一张：他用铺子里最好的那副罗马体原样重排了一遍，借方贷方中间的竖线一丝不歪。只有那个拼错的词，他没改。我指给他看。他红着脸说：“我、我看见了。”说着从围裙兜里摸出一个小东西，放进我手心：一枚梨木小印，刻的是我名字的头一个字母 L，反着的。“印出来才是正的。”"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 9, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

