#   1576-11-04 至 06 西班牙哗变兵洗劫安特卫普（西班牙之怒），普朗坦几次拿钱打发上门的兵（正文只用“听说”）。
# 依据·原创：扬与莉芙的全部情节；漏算的裁边钱与小钱袋；希腊试样上放反的重音、混了两种重音的那一格字；
#   压在字盘边的铜子；“未核实”那一行；账本里字距很宽的六行小诗；账目格式的回诗与故意拼错的“散步”；反刻的梨木小印 L；
