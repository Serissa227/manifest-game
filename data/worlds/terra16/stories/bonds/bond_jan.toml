[[tracks.chapters.choices]]
key = "promise"
text = "请他在这份约上签名：一辈子的合伙人。"
requires = [{ kind = "bond", person = "jan", level = "A" }]
hint = "这样的约，得是交情到了底的人才签得下去；你若已经跟别人许过一生一次的约，这回就只能签一份寻常的合伙。"
reply = "我说那一行以后再写，先签上面的。他拿起笔，签得很慢，名字比平常大了一圈，签完还在尾巴上多勾一下，像怕它跑了。“末尾那一行，到底写什么？”我说那是以后的账，现在算不出来。他想了想，从字盘里拣出几枚铅字，在手心里排了排，又一枚一枚放回去：“那我先给它排好字。等你想好了写什么，我不用再拣。”门外马蒂斯敲了敲门框，问台词还对不对。扬把约折好，塞进放钱袋的围裙兜，跑出门去，跑到一半又回头：“明天，明天开始记账！”"
next = "done"
effects = [{ kind = "affinity", person = "jan", value = 5 }, { kind = "bond", person = "jan", level = "S" }, { kind = "relation", person = "jan", relation = "friends" }, { kind = "flag", flag = "c7_bond_jan_promise" }, { kind = "flag", flag = "c7_pair_mathijs_jan_taken" }, { kind = "memory", memory = "mem-bond_jan-s", title = "合伙的签名" }, { kind = "start_track", track = "reunion_jan" }]

[[tracks.chapters.choices]]
key = "heart"
text = "告诉他：末尾那一行，等我们都长大了，我来写。"
requires = [{ kind = "bond", person = "jan", level = "A" }, { kind = "heart", person = "jan", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "jan", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "jan" }]
hint = "末尾那一行你还落不下笔——你们还没走到那一步，或者一生只签一次的名字，你已经签在了别人那里。"
reply = "他先把上面签了，签完才抬头。我说末尾那一行我来写，等我们都长大了。他的脸一下子红透了，红到耳根，又红到脖子，半天才挤出一句：“那、那我等着。”我说别结巴，这句是要记账的，再说一遍。他深吸一口气，把笔放下，看着我：“我等着。”这一回一个字也没卡。他伸出手，又停在半路。我先握住了。他手上全是铅灰，凉的，握紧了才慢慢暖过来。门外，马蒂斯敲门框敲到第二下，停住了，把戏本夹到胳膊底下，转身沿着街走了。扬没看见。他还在看那一行。"
next = "done"
effects = [{ kind = "heart", person = "jan", value = 12 }, { kind = "relation", person = "jan", relation = "crush" }, { kind = "bond", person = "jan", level = "S" }, { kind = "flag", flag = "c7_bond_jan_romance" }, { kind = "flag", flag = "c7_pair_mathijs_jan_taken" }, { kind = "memory", memory = "mem-bond_jan-s", title = "合伙的签名" }, { kind = "start_track", track = "reunion_jan" }]

[[tracks.chapters.choices]]
key = "own"
text = "把约收回来：他开他的印书坊，我做我的买卖。"
reply = "我把约从柜台上抽回来，对折。“你攒你的铅字，我攒我的船。合伙的事，等你有了自己的铺子再谈。”扬愣了一下，像松了口气，又像少了点什么：“也、也好。我还没攒够铅字，签了也是拖累你。”说这话的时候，他的手一直按在腰上那个小钱袋上，按得袋口的绳子都歪了。他送我到门口，跟马蒂斯说了几句今晚对哪一幕，又追出来两步：“行情单我还替你印。按价算，一个铜子也不少收。”我说那当然，我也一个铜子不少给。他站在门口笑了，笑完才想起来冷，缩着脖子跑回去。"
next = "done"
