# 重逢：1576 年 11 月，西班牙之怒之后。扬的印书坊砸了一半；先搬书稿还是名册。不写屠杀的细节，只写搬书与名册。
[[tracks.chapters]]
key = "reunion"
title = "先搬哪一箱"
text = "1576 年 11 月，我的船靠上安特卫普的码头，城里的烟还没散干净。交易所回廊里的柜台被劈开了，街上散着账页和碎瓷片。听说普朗坦先生是拿银子把上门的兵打发走的；扬没有那么多银子。他的印书坊在离码头两条街的巷子里，招牌劈成两半，只剩一半还挂着。屋里两台印机倒了一台，字盘翻了，铅字撒了一地，他和两个学徒正蹲着一枚一枚往回捡。他看见我，站起来，膝盖上全是灰，第一句话是：“你的船，装、装得下几箱？”装不下几箱。他指着墙角两只箱子：一只是没卖出去的书稿，校过三遍；一只是铺子的名册，十四个工人的工钱、家住哪条街，都在里头。“先搬哪一箱？”我说书稿，那是钱。他说名册：“铺子砸了还能再开，人散了就找不回来。”出门前，他在字盘边上摸了摸，把一枚旧铅字放进我手心。是那个希腊字，头上的小撇朝着对的那一边。"
window = [[1576, 11, 8], [1576, 12, 31]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1576, 11, 8], to = [1576, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "jan", text = "这封信是排印的，字排得极整齐，连行距都量过。“莉芙：十一月那几天你不在城里，这是好事。铺子砸了一半，两台印机倒了一台，铅字撒了一地，我跟学徒捡了三天，一枚不少——只有希腊字那一格少了一枚，大概让哪个兵当银子揣走了，他会失望的。工人的名册保住了。十四个人，十四户，我一家一家去问过，都还在。普朗坦先生那边是拿银子买的平安，我这儿只有满屋子的纸——当兵的翻了一遍，嫌纸不值钱，踢倒一台印机就走了。书稿丢了两箱，可以再印。附一首诗，账目格式的，你认得这个格式。借方：一个冬天，一台印机，两箱书稿。贷方：名册，十四户。结余：等你。——扬”" }, { kind = "flag", flag = "c7_bond_jan_missed" }]

[[tracks.chapters.choices]]
key = "both_crates"
text = "两箱都搬：先搬名册，再搬书稿。"
reply = "名册那只箱子轻，我们俩抬着就走；书稿那只沉，叫来了四个水手。搬到天黑，又从倒了的印机底下抢出两盘排好的版，舱里满了。扬站在船头，看着码头那边的烟，问我：“当年那份合伙的约，还、还作不作数？”我说利润、亏损那几行，一直作数。他点点头，把名册那只箱子往里推了推：“那这一船，书稿算我们俩的。名册算工人的，一个铜子也不许记进去。”我在账上记了两行。他探头看了一眼，手指点在一个词上：“这、这儿少了个字母。”我没改。他也没再提，伸手把那页账抹平了。"
