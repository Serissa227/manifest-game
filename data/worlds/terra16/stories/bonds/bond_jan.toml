# C7 羁绊线（Claude 重写）：bond_jan「扬：格纸的价」+ reunion_jan「扬：先搬哪一箱」——遵循 A5 / E37 故事 2.0 契约。
# 标签：GB（女主角莉芙 × 扬）；可恋爱的线，由莉芙先开口。
# 人物：扬 jan（1540-09-25，男，安特卫普普朗坦铺子的学徒：1554 年在装订台打杂、卖纸，1555 年铺子开印书坊后排字；
#   排希腊字最快，一说到自己就结巴；爱挑字眼；一提禁书就脸色发白；攒铜板想凑一副自己的铅字）；
#   莉芙·德克莱尔克 lieve（1540-10-12，女，主角，第一人称“我”；账本体，说话带数，只赌算得清的）；
#   马蒂斯·佩特斯 mathijs（1540-10-01，男，紫罗兰修辞学会的少年演员）只在 S 的门外与重逢 variant 里出现，他对扬的心意本文件不写破。
