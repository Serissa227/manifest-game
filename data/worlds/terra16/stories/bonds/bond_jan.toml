# S：1556 年冬，学校散了。我递给扬一份长久合伙的约，末尾空着一行。马蒂斯在门外等扬对台词，没有催。GB：由我开口。
[[tracks.chapters]]
key = "s"
title = "合伙的签名"
text = "十二月，学堂上完了最后一课。我把课本捆好搬回父亲的兑换桌，那份约却抄了三遍才揣到铺子里：合伙印行情单，长久的。纸钱、跑交易所的腿归我，排字与印刷归他；赚的我先写二八分，他二我八，又划掉，改成对半；亏的也对半，写在下一行。末尾空着一行，没写。扬接过去一行一行地读，读到亏损那一行，抬起头：“你、你连亏多少都算好了？”“算了三遍。最坏的一年，亏二十个斯图弗。”他低头摸了摸腰上的小钱袋——攒了两年，离一副自己的铅字还差三十个斯图弗——又看看那张约，没说话。门外，马蒂斯靠着墙，手里卷着一本戏本，在等扬去对台词。他看见我，冲我点了点头，没有催，只把戏本又卷紧了一圈。扬把约平放在柜台上，指尖按着空着的那一行：“这一行，写、写什么？”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
