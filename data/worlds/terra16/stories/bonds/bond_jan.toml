# C1：1554 年，订账簿用的格纸。扬漏算了裁边钱，从自己的小钱袋里补上。
[[tracks.chapters]]
key = "c1"
title = "格纸的价"
text = "1554 年，父亲打发我去普朗坦的铺子订账簿用的格纸，十二刀，每页二十八行。铺子一半是装订台，一半是纸垛，牛皮胶熏得人眼睛发酸。来算价的学徒叫扬，跟我差不多大，手上全是胶，石板上的数却一笔不歪。“十二刀纸，画、画格另算……一共九个斯图弗。”报完他又补一句，“等铺子开了印书坊，我就去排字，不用再干这种零活。”我没把他的志气算进账，只把石板转过来：“裁边呢？十二刀，一刀都没算。”他看了一遍，又看了一遍，脸一点一点红上来。他没去喊掌柜，从腰上解下一个小钱袋，袋口的绳子磨得发亮，倒出两枚斯图弗，推进了钱匣。耳根比柜台上那条火漆还红。"
window = [[1554, 1, 1], [1554, 12, 31]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 1, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "point_out"
text = "钱补上了，只指着裁边那一行说一句：下回记牢。"
reply = "钱匣合上了他才抬头：“谢、谢谢。”我说不用谢，下回算对就行。他点头点得很重：“下回一定。下回我、我排一张价目表，钉在墙上，谁来都算不错。”我抱着格纸出门的时候，他已经在石板背面一行一行抄价钱了，抄到裁边那一行，描了两遍。"
next = "c2"
effects = [{ kind = "affinity", person = "jan", value = 3 }]

[[tracks.chapters.choices]]
key = "bet_second"
text = "跟他赌一个斯图弗：这张单子上还有第二处错。"
reply = "他把石板翻来覆去找了一刻钟，连我写的名字都核了一遍，没有第二处。我把一个斯图弗放在柜台上。他往回推：“不、不能收，是我先算错的。”我说赌是赌，账是账，我只赌算得清的——这一回我算得很清楚。他盯着那枚钱看了半天，到底收了，攥在手心里：“那我拿它去买一枚铅字。我自己的。”"
next = "c2"
effects = [{ kind = "affinity", person = "jan", value = 4 }]

# C2：1555 年初，扬偷偷排的希腊文试样，一个重音放反了。口头禅原句在这里用一次。
[[tracks.chapters]]
key = "c2"
title = "放反的重音"
text = "1555 年刚开年，格纸送来了，送货的是扬本人。他码好纸垛，没走，从怀里抽出一张折了两折的纸，又塞回去，又抽出来。“铺、铺子夏天就要开印了。这是我夜里偷偷排的，你……你看看。”是一段希腊文，字小得像芝麻，排得齐齐整整。我在学堂只学过一年希腊字母，看到第三行，指着一个字母头上的小撇：“这个是不是放反了？”“印出来本来就是这样，”他说得飞快，“字在盘里是倒着的，印出来才正。”我说那拿原稿来对。原稿是他从掌柜那里借来抄的一页诗。他把试样摊在旁边，一个字一个字往下比，比到第三行，手指停住了。他盯着那个字看了很久，久到我把一刀格纸数完了，才开口：“等等，这个重音符号放反了。”“这句是我先说的。”"
window = [[1555, 1, 1], [1555, 4, 30]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 4, 30] }, { kind = "age", le = 17 }]

