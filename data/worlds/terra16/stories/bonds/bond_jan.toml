reply = "舱里装满以后，我把那份约从箱底翻出来。二十年，纸边黄了，末尾那一行还空着。我借了他的笔，写：合伙，终身，含一切。写完递过去。扬看了很久，这回一个字没卡：“这一行我等了二十年。铅字早就排好了，在铺子第三个抽屉里，拿线捆着，砸成那样都没散。”他托起我的手，在手背上吻了一下；又低下头，在我额头上吻了一下。码头上有人喊开船。他退开半步，耳根还是红的，声音却稳：“现在，先开船。名册在舱里，工人家里一家一家地送。”我说好，账从今天起记两个人的名字。"
