reply = "我们沿着斯海尔德河往下走，一直走到天黑，码头上的灯一盏一盏点起来。他一句话都没结巴，讲了一路的希腊字母：哪个像船锚，哪个像倒挂的秤钩，哪个在盘里最容易跟别的混。回到铺子门口，他说：“这笔账，今天清了。”我说没清，明天还有。他愣了一下，耳朵红了，说那明天还从这儿走。"
