# A1：1556 年 8 月，大游行散后，账本里掉出一张字距很宽的小诗。扬的秘密在这一章发生，不进见闻。
[[tracks.chapters]]
key = "a1"
title = "账本里的小诗"
text = "1556 年 8 月，圣母升天节后的大游行散了，街上满是踩烂的花瓣和蜡油。我回家对当天的流水，翻到七月那一页，掉出一张纸。是排印的，六行，像一首诗。字距比我们的行情单宽了一倍，每个字母都隔得远远的，像怕挤坏了什么。没署名，也没写给谁。第四行说，有个人数钱的时候，会把舌尖抵在门牙后头。我把钱匣里的钱数了一遍——我确实这样，我自己都不知道。第二天我把那张纸夹在账本里，去铺子问扬：“你们铺子的剩纸，怎么跑到我账本里来了？”“剩、剩纸。”他说，“游行那天人多，纸到处飞。”说完他转身去搬纸，把柜台底下一叠同样大小的废样全塞进柜子最底层，又拿脚把柜门踢严了。"
window = [[1556, 8, 1], [1556, 8, 31]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 8, 1], to = [1556, 8, 31] }, { kind = "age", le = 17 }]

