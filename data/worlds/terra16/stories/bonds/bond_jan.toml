# B1：1555 年夏，我出纸钱，他出手艺，印第一张交易所行情单。压在字盘边的那枚铜子。
[[tracks.chapters]]
key = "b1"
title = "第一张行情单"
text = "1555 年夏天，普朗坦先生的印书坊挂了招牌，扬到底站到了字盘前头。我出纸钱，八个斯图弗；他出手艺，借铺子收工后的一个钟头。我们印了一张交易所的行情单：胡椒、明矾、英格兰呢绒、但泽黑麦，一行一个价。拿到交易所门口，第一个买主是葡萄牙商馆的伙计，看了半天，问：“这些价，什么时候会变？”我和扬都愣住了。扬张了张嘴，什么也没说出来。回到铺子，我在单子顶上添了日期。他拿过去看了看，又在每一类货后头添上询价的地方：胡椒问的是葡萄牙商馆，呢绒问的是英格兰人的院子。“谁那儿问来的，就写谁，”他说，“出了错，找、找得着人。”卖完挣了十一个铜子，分了十个，剩下一个，他压在字盘边框上：“下回重印的本钱。别动。”"
window = [[1555, 5, 1], [1555, 10, 24]]
at = "antwerp"
cast = ["jan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1555, 5, 1], to = [1555, 10, 24] }, { kind = "age", le = 17 }]

