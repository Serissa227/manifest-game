reply = "“什么话？”“现在说出来，就校不准了。”我说，“等我们都长大了，我回来那天再说。”佩德罗的手停在星盘上，不动了。炉膛里噼啪响了一声，他才开口，声音比刻刀还轻：“那句话……我先替你留一格。”他从工作台上拿起一把最细的刻刀，在星盘背面最外圈、刻度够不着的边上，划了一道短短的线。“就这儿。回来的时候，看它还在不在。”我走的时候，他送到作坊门口，伸过手来握了一下我的手，握得很紧，指头上的老茧硌着我的掌心，像握着一把刻刀。然后他松开，往后退了一步：“去吧。别把它泡了。”"
