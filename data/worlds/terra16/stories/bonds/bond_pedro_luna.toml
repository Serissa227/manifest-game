# C1：1554 年春，瓜达尔基维尔河岸，正午测太阳高度。口头禅在这里说一次。
[[tracks.chapters]]
key = "c1"
title = "纬度不看姓氏"
text = "正午前，讲席的先生把我们领到瓜达尔基维尔河岸上，一人发一只借来的星盘，量太阳的高度。我那只是修道院捐给讲席的，铜面让修士们摸得发亮。太阳一到顶，穿天鹅绒短衣的那个学生头一个报了数，嗓门最大。先生正要点头，旁边一个指头上沾着铜屑的学徒伸手把那人的星盘拿了过去，拇指按住一格刻度：“差了半度。这一格磨平了。”“我家三代领航。”那学徒把星盘还给他：“纬度不看姓氏。”先生咳了一声，叫大家再量一遍。轮到我，那学徒也把我的星盘拿过去，正面看了看，翻过来又看了看，一格一格摸到底才递回来。后来我才知道，他叫佩德罗·卢纳，是特里亚纳星盘作坊的学徒。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["pedro_luna"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_seville_pilot_school" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "let_him_check"
text = "把星盘交给他，请他教我怎么看出磨平的刻度。"
requires = []
reply = "他教得一丝不苟：拿指甲顺着刻线轻轻刮过去，刮到哪一格不卡指甲，哪一格就是磨平了。他让我闭着眼刮了一整圈，刮错一格就从头来。教完，他把星盘还给我：“你这只，比天鹅绒那只好。”我说是修道院捐的。他点点头，又摸了一下那圈刻度：“那位修士，比他们家三代都懂。”"
next = "c2"
effects = [{ kind = "affinity", person = "pedro_luna", value = 3 }, { kind = "skill", skill = "astral_navigation", value = 8 }]

[[tracks.chapters.choices]]
