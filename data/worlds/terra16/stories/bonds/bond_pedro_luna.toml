# B2：1555 年春夏，顺河而下到河口试罗盘。过了博南萨见海，他的怕在这里发作。
[[tracks.chapters]]
key = "b2"
title = "河口见海"
text = "师傅让佩德罗跟一条卡拉维尔船顺河下去，到河口试一只新罗盘，我跟着去当帮手。头两天河面平得像磨过的铜，佩德罗一路都在给我讲罗盘，讲到磁石擦针，还抓着我的手比画：“顺着一个方向擦。来回擦，就白擦了。”船过了博南萨，两岸忽然往后退，河一下子宽得看不见边，前面就是海。第一个浪涌上来，船头抬起，又重重砸了下去。佩德罗不说话了。他抱着罗盘缩在船舷边，脸白得像纸，嘴唇动了几下，没有声音。罗盘的针在他怀里乱转，转得比浪还快。船长在后面喊：“针稳了没有？报数！”他攥着罗盘的边，指节发白，摇了一下头，又摇了一下。"
