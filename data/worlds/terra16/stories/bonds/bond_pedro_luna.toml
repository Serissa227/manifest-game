reply = "“每一趟。”我说，“不管从哪里回来，先过河到特里亚纳，再回住处。”佩德罗把皮套的带子从我手里拿回去，系了个结，又拆开重系：“校不准的我可不收。你要是把它摔了、泡了、拿去砸核桃——”“那你就修。”“那我就修。”他把带子又系了一遍，这回系得死紧，“那你就得一直回来。”“那你就得一直在这儿等。”他抬头看了我一眼，像被这句话绊了一下，随即低下头，把带子系了第三遍。系完他拍拍皮套，推回我怀里，转身进了作坊。炉火边传来锉刀的声音，一下一下，比平常快。开春上船那天，我在甲板上回头看了一眼。特里亚纳的河岸上站着一个人，手里攥着什么，隔得太远，看不清是不是一把锉刀。"
