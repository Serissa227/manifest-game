# S：1556 年 12 月，作坊门口。我领到随船实习的文书，他把校好的星盘交给我。
[[tracks.chapters]]
key = "s"
title = "回来还要重校"
text = "十二月头一天，总署的书记把随船实习的文书发到我手里，开春就上船。文书上写着船名、船长的名字，末尾一行小字：仪器自备。那天傍晚，佩德罗在作坊门口等我，怀里抱着一只皮套。打开来是一只星盘，铜面新擦过，背面的刻度细得像头发。“我校了一个月，”他说，“每一格都对过三遍。”他没有马上递给我，手指先在星盘上摸了一遍，从顶上的吊环摸到最底下的刻度，像在检查最后一格，又像在跟它告别。“跑过长路回来，”他终于把星盘放进我手里，“要先拿来给我重校。海上潮气重，铜会走样。”炉火照得他半边脸发红。开春他去不去码头，他一个字也没提。"
