# A1：1556 年春，讲席的观天平台。他自己说出怕海。
[[tracks.chapters]]
key = "a1"
title = "平台上的星"
text = "讲席的观天平台在总署的屋顶上，夜里风从河上吹过来，带着沥青味。先生要我们记下天狼星几时过子午线。我记到一半，旁边的笔声停了。佩德罗把那只旧星盘搁在栏杆上，手指在背面那圈刻度上来回摸，一圈，又一圈。“我怕海。”他说，“从小就怕。”我没接话。他也没看我，盯着河口那个方向，那边黑得什么也看不见。“我爹刻星盘，我也刻。一辈子刻别人带到海上去的东西，自己连河口都过不去。”他的指甲卡进一道刻线里，“师傅要是知道了，恐怕会把我赶出去。一个怕海的人刻的星盘，谁敢带上船？”天上的星一颗一颗出来了。他一颗也没有记。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "seville"
cast = ["pedro_luna"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

