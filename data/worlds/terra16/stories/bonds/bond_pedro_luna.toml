# 佩德罗·卢纳：纬度不看姓氏（bond_pedro_luna）——羁绊线，标签 any（男主角为 BL，女主角为 BG）；学院期 C1—S + 成年重逢。
# 人物：佩德罗·卢纳（pedro_luna，1540-05-13 生，男，romance = any），特里亚纳星盘作坊的学徒，父亲也是刻星盘的；
#       认真、爱较劲，一紧张就摸工具，习惯先替别人检查刻度。口头禅“纬度不看姓氏”只在 c1 说一次。
#       主角：自创的塞维利亚孤儿领航学徒（custom_seville_pilot，模板生年 1540-01-01），修道院长大，贸易总署讲席的预备学徒。
#       “我”不写性别、外貌与家族专名。
# 年龄：c1—a2 两人 13—16 岁，只写朦胧（心动 heart）；S（1556-12）两人都是 16 岁，告白只约好成年再答，最多牵手（crush）；
#       重逢 1562 年两人都已 22 岁上下，恋人落点（lovers）要 romance 旗标 + 心动 ≥ 24 + 双方满 18。
# 心动来源：a1 just_watch +6 → a2 stamp_his_hand（要求 ≥ 6）+6 → s heart（要求 ≥ 12）+12 = 24。
#       决定表的 S 写 +10，算下来只有 22、永远到不了重逢的 24；照简报改为 +12。
# 秘密：佩德罗怕远海，不敢告诉师傅。b2 在河口发作（玩家亲眼看见），a1 他自己说出口；本线没有见闻，秘密不进任何 news。
# 依据（史实）：贸易总署（Casa de la Contratación）1552 年设宇宙志与航海讲席，领航学徒在塞维利亚受训；
#       特里亚纳在河对岸，陶窑与工匠作坊多；瓜达尔基维尔河下行到桑卢卡尔一带才入海，博南萨是河口的泊地。
#       正午用星盘量太阳高度求纬度；用象限仪与影长求塔高是当时课堂上的常见题目。
# 原创：佩德罗与他的师傅、借来的星盘、刻歪的一格、吉拉尔达塔下的炭笔叉、河口的新罗盘、黄杨木小印、星盘背面那道短线。
# 避开的年代错位：吉拉尔达塔顶的风信子铜像与文艺复兴钟楼 1558—1568 年才加上，b1 只写塔上的钟，不写风信子。
# 去重：桑卢卡尔沙洲（归 bond_leonor_ruiz）与“把海图署上别人的名字”（归 bond_isabel_soto）本线不写；莱昂诺尔不出场；不提诺埃尔。
#       伊莎贝尔只在重逢里作背景（考官的孙女，当年在讲席后排偷听；点名但不写恋情），与配角线 tie_new_isabel_soto_pedro_luna 的
#       1559 年相识、三十七度那一格相接。
# 缺省走向：c1—a2 无人回应时只往下走，不加任何数值；S 缺省开启重逢并设 c7_bond_pedro_luna_parted；
