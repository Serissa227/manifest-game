text = "不服气，跟他比一比，看谁先量出塞维利亚的纬度。"
requires = []
reply = "先生拿出一枚铜板当彩头。我快了半刻，他准了半度。先生掂着铜板想了想，判他赢。佩德罗接过铜板，在拇指上转了一圈，弹到我怀里：“快也算本事。下回再快一点，也准一点。”我把铜板攥在手心里，还是热的。"
