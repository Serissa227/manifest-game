# B1：1554 年秋冬，大教堂前的广场。用象限仪和影子量吉拉尔达塔。
[[tracks.chapters]]
key = "b1"
title = "吉拉尔达塔的影子"
text = "先生把题目出在大教堂前的广场上：用象限仪量太阳的高度，再步量吉拉尔达塔的影子，算出塔有多高。我量了一遍就算完了，蹲在台阶上等。佩德罗量了三遍：每一遍都用炭笔在石板上给影子的尽头画个叉，再从塔脚一步一步走过去，走歪了就回头重走。卖水的骡子从他的叉上踩过去两回，他也重画了两回。日头偏西，先生拿出大教堂工匠的旧记录一对：佩德罗差了一掌，我差了一臂。“一掌胜一臂。”先生把记录一合，判他赢。他脸上却没半点得意，从我手里抽走那张算草，蹲下来就着台阶看了半天，手指在一行数上点来点去。“你哪一步快的？”他问，“影子我走了三趟，你只走了一趟。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["pedro_luna"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

