reply = "我没出声，两只手照旧按着铜盘。作坊里只剩窑那边传来的敲打声。过了很久，他把刀尖放回那道斜线的末端，吸了一口气，刻下了下一格，比前面的都直。收工的时候，他拿布把铜盘一层层包好，头也不抬：“今天你什么都没看见。”“我只看见了刻度。”他包布的手停了一下，又多系了一个结。"
