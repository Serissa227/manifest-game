# C2：1554 年夏，特里亚纳的作坊。师傅说日后要派他上船，刻刀抖了一下。
[[tracks.chapters]]
key = "c2"
title = "手在抖"
text = "特里亚纳的作坊在陶窑后面，门一开，满屋子铜屑和松香的味道。佩德罗让我坐在工作台对面，两手按住一块还没刻度的黄铜盘。“别动，喘气也轻一点。”他顺着直尺一格一格往下划，每划一下，就用指甲刮一刮，听那一声细响。刻到第四十几格，师傅掀帘子进来，手里拎着一只刚修好的象限仪：“过两年你出了师，船队出港，你跟着上船。领航员的仪器，在海上得有人校。”“是，师傅。”佩德罗应得很快。刻刀却在铜面上一滑，划出一道斜线，把两格连成了一格。师傅转身要走。佩德罗盯着那道斜线，刀尖停在半空，脸色比铜还黄。我按着铜盘的手，一动也不敢动。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["pedro_luna"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

