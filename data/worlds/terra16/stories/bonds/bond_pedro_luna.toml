# A2：1556 年夏秋，作坊的刻印课。他刻的第一方印，刻的是我的名字。赠礼 carved_seal。
[[tracks.chapters]]
key = "a2"
title = "第一方印"
text = "作坊一年只开一回刻印课，教学徒在黄杨木上刻反字。别人刻的都是自己的名字。佩德罗刻了三天，刻好了不给人看，攥在手心里揣了一路，到讲席门口才摊开。一方小小的木印，印面刻的是我的名字。笔画有点歪，最后一笔收得太急，刀口还毛着。“以后你画的图、测的数，要盖你自己的印。”他说得很快，像在路上背了好多遍，“印泥我也调好了，在作坊第二个抽屉里。”他把印放进我手心，又一根一根把我的手指合上。他指头上的铜屑蹭在我手背上，有点痒。“什么时候盖，盖在哪里，”他说，“你自己定。”"
