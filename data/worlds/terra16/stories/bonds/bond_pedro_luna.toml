# 重逢：1562 年，特里亚纳的作坊。他出师了，桌上是他第一只署名的星盘；我那只旧星盘歪了一度半。
# 考官的孙女伊莎贝尔（学院同学）只作背景，接配角线 1559 年“三十七度那一格”的相识，不写恋情。
[[tracks.chapters]]
key = "reunion"
title = "作坊里的新星盘"
text = "一五六二年我回到塞维利亚，行李还在码头上，人先过了桥，去了特里亚纳。作坊的门换了新漆，门楣上多了一块小木牌，刻着佩德罗的名字——他出师了。我进门时，一个姑娘正抱着一只象限仪往外走，边走边回头：“三十七度那一格，你明天自己再量一遍！”是考官家的伊莎贝尔，当年总躲在讲席后排偷听的那个，看样子如今是这里的常客。她风风火火地从我身边挤了过去。工作台正中摆着一只新星盘，背面刻着一行小字：佩德罗·卢纳造。是他头一只自己署名的。佩德罗还冲着门口皱眉，看见我，眉头一下子松开了。他接过我那只跑了五年的星盘，翻过来对着窗口眯眼看了一会儿，拇指按住一格刻度。“歪了一度半。”他抬起头，“你这几年，是怎么活着回来的？”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "seville"
cast = ["pedro_luna"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "pedro_luna", text = "这封信托往你那条船去的人带。听说你今年没回塞维利亚。作坊的门换了漆，门楣上有我的名字了。我出了师，做的头一只星盘自己署了名，背面刻着“佩德罗·卢纳造”。刻到“造”字，手还是抖了一下，你看见了准要笑。考官家的伊莎贝尔常来借仪器，就是当年躲在讲席后排偷听、海岸画得比谁都准的那个，跟我争三十七度那一格，争了三年还没争完。她嫌我刻得死板，我嫌她画的海岸线太野。你要是在，准站她那边。随信附一张刻度表，照你那只星盘的样子画的，一度一格。海上潮气重，铜会走样，那只星盘跑了这么些年，我猜至少歪了一度。别自己拿锉刀去修，你修不好；我知道你会去试。我这里一切照旧：天亮开炉，正午量一回太阳，夜里刻到灯油烧干。河口，我还是没再去过。表上最后一格旁边，我写了几个字，你翻过来就看得见：等你回来校。佩德罗" }, { kind = "flag", flag = "c7_bond_pedro_luna_missed" }]

