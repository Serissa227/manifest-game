text = "戚家的兵进闽以后，倭船少了，闽江口的卡子倒多了，查私船比查倭还紧。我的船排在第三条。轮到我，卡子的条桌后头坐着个穿卫所袍子的军官，腰里挂刀，手边靠着一根棍，棍身擦得发亮。是陈栋。他宽了一圈，眉梢多了一道疤。我把货单递过去。他没接，先从腰上解下一块腰牌，啪地拍在条桌上——还是当年我推回去的那块，边角磨得更亮了。“当年你说海上见，”他说，“这就见着了。”这才伸手：“货单。”胡椒、苏木、象牙，我一项一项念，他一项一项对，问得又细又冷。念完最后一项，他抬起眼睛：“林兄。”只叫了这一声，就没了下文。桌上，腰牌压着货单；他的兵在后头等他发话。"

[[tracks.chapters.variants]]
key = "v4_kept"
when = [{ kind = "flag", flag = "c7_wandeng_unmasked_kept" }]
text = "戚家的兵进闽以后，倭船少了，闽江口的卡子倒多了，查私船比查倭还紧。我的船排在第三条。轮到我，卡子的条桌后头坐着个穿卫所袍子的军官，腰里挂刀，手边靠着一根棍，棍身擦得发亮。是陈栋。他宽了一圈，眉梢多了一道疤。我把那块揣了七年的腰牌放到条桌上。他看了一眼，没碰，先伸手：“货单。”我把货单摊开，胡椒、苏木、象牙，一项一项念。他一项一项对，问得又细又冷，好像从没跟我在校场边的青石上坐过。念完最后一项，他抬起眼睛盯着我，一直盯到后头的兵都咳嗽起来。“林兄——”他把声音压得只有我听得见，“还是该叫你别的？”我手里的货单停在半空。桌上那块腰牌，他还是没碰。"

