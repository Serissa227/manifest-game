reply = "我掏出手帕，把腰牌包了两层，塞进贴身的口袋。“你什么时候在卫所？”“哪天都在。”“那我挑一个你不在的日子去，把牌子交给门口的兵，叫他转给你。”“你敢。”他瞪着我，“送回来，就交到我手上。少一个角，我找你算账。”我说海上风大浪大，少个角也说不定。他想了想，从怀里摸出一截细麻绳，把手帕包着的那一团又捆了一道，打了个死结，打完又在上头压了一个。“这回少不了。”他转身往卫所那边走，走到巷子拐角，又回头喊：“记着，先报你自己的名字！”"
