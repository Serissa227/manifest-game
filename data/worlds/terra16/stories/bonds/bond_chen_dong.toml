# A1：1556 春，夜雨，社学屋檐下。物件：屋檐滴下的水线。心动选项 heart +6。
[[tracks.chapters]]
key = "a1"
title = "屋檐下"
text = "散学晚了，一出门就是夜雨。陈栋一把将我拽到社学的屋檐底下，手一松，自己退到檐口站着。檐上的水连成一条线，正好落在他左肩上，不一会儿就洇湿了半边衣裳。“你进来点。”我往里让了半步。“不冷。”檐下就这么宽，我让出来的那半块干地方一直空着。雨声很大，巷子里一个人也没有，对门人家的灯一盏一盏灭了。他不说话，我也不说话，只听见檐口的水线砸在石阶上，砸出一排小坑。石阶上那排小坑积满了水，雨才小下来，水线断成一滴一滴。他开口了，眼睛看着巷子那头：“明天还练不练？”“练啊。”“那就练。”他顿了一下，“你那第三步还是落早。总得有人提醒林兄脚下。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tender"
news = "开春以来月港夜雨不断，社学的檐沟又堵了，散学晚的学生只能挤在屋檐底下等雨停，等到更夫都出来了。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "dash_out"
text = "把衣襟往头上一顶冲进雨里，回头喊：明天再比！"
reply = "我跑出三步，他在檐下喊：“站住！”我没站，踩着水一路跑回家，鞋里灌满了雨。第二天他一见我就皱眉，说这样迟早着凉；又说往后下雨天不去校场了，改在学堂里练步子，不用出门。他说这话的时候，左边袖子还没干透。"
next = "a2"
effects = [{ kind = "affinity", person = "chen_dong", value = 3 }]

[[tracks.chapters.choices]]
key = "share_eaves"
text = "不说话，把让出来的那块干地方再往他那边让一点。"
