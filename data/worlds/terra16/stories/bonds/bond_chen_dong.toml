hint = "这时候让他靠近，他只会扭头走进雨里——还不够熟。"
reply = "他看看那块干地方，又看看我，犹豫了一下，往里挪了半步。檐口的水线从他肩上滑开，落到他脚后跟。我们靠着同一根柱子站着，肩膀隔着一拳。雨一直下到二更天，更夫敲着梆子从巷口过，他才开口：“走吧，送你。”"
next = "a2"
effects = [{ kind = "affinity", person = "chen_dong", value = 3 }, { kind = "heart", person = "chen_dong", value = 6 }]

# A2：1556 秋，搜港之后卫所的兵来社学问林家的事。基础文本＝kept（一个字不说破）；variant known 读揭开旗标。
# 物件：木带扣（carved_buckle）。bond A 的两个选项给赠礼与回忆。
[[tracks.chapters]]
key = "a2"
title = "挡在前面"
text = "七月搜港，林家的船在港里烧了，烧剩的半截桅杆到九月还戳在水里。卫所的人又来了，这回进了社学。三个兵堵在学堂门口，领头的翻着一本册子：“月港林家那个小子，是在这儿念书吧？叫出来，有话问。”屋里没人吭声。我手里的笔停在纸上，墨洇开一个圆点。陈栋先站了起来。他拎着棍走到门口，往兵跟前一站：“问我。”“你又是谁？”“镇海卫陈千户的儿子。林兄跟我比了三年棍，他左手使棍还是右手使棍，一顿吃几碗饭，听了鬼故事夜里怕成什么样，我比他爹还清楚。有话，问我。”领头的兵越过他的肩膀往屋里看。陈栋往旁边挪了半步，正好挡住那一眼。他一只手拄着棍，另一只手背在身后，攥着个什么东西，攥得指节发白。"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tense"
news = "月港林家的船烧了以后，卫所的兵到社学打听林家的事，陈千户家的儿子拄着棍堵在门口，说有话先问他。"
when = [{ kind = "date", from = [1556, 9, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

