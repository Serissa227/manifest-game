[[tracks.chapters.choices]]
key = "wrap_tight"
text = "帮他把棍头的布重新缠紧，打两个一样的结。"
reply = "我拿过布，照船上捆缆的法子绕了三道，打了两个一模一样的结。他蹲下来，把结翻过来又翻过去：“漳州人不这么打。”“月港人这么打。越扯越紧，海上风浪都扯不开。”他哼了一声，手指在结上拨了两下，没拆。第二天那根棍靠在学堂门边，两个结还在上头。"
next = "c2"
effects = [{ kind = "affinity", person = "chen_dong", value = 3 }, { kind = "skill", skill = "staff_fujian", value = 6 }]

[[tracks.chapters.choices]]
key = "fake_wrist"
text = "揉着手腕说扭着了，改天再比。"
reply = "他眯起眼睛看我的手腕，看了很久，久到巷口看热闹的都散了：“改天就改天。”第二天一早，他在巷口等着，手里攥着一只小瓷瓶。进了学堂，他把瓶子往我桌上一放，瓶身贴着红纸，写着“跌打”两个字，墨还没干透。他回到自己的座位，一上午没往我这边看。"
next = "c2"
effects = [{ kind = "affinity", person = "chen_dong", value = 4 }]

# C2：1554 夏，卫所校场边。物件：磨平的青石。他替“我”挡掉同窗的问题。
[[tracks.chapters]]
key = "c2"
title = "同一个破绽"
text = "陈栋总打我同一个地方：我右脚一上步，左肋就空出来，他的棍尖跟着就点到。一个下午点了九回。第十回，我把棍一收：“你站着别动，让我把这一步走熟。”“站着？”他把棍拄在地上，“我又不是木桩。”“木桩不会还手，你会，所以要你。”他没再说话，真站住了。我对着他一步一步地上，他的棍尖悬在我左肋前一拳的地方，不进也不退。校场边那块青石被太阳晒得发烫，面上磨出一层亮，不知是多少年的兵坐出来的。墙头探出一个同窗的脑袋：“怎么不打了？陈栋，你让他了？”陈栋头也不回：“规矩没讲完。”那人还要问什么规矩，他把棍往地上一顿，墙头的脑袋就缩回去了。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tense"
news = "月港卫所校场边那块青石，这个夏天总被社学的孩子占着；陈千户家的儿子天天在那儿陪人对棍，营里的兵都绕着走。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "drill_step"
text = "请他就这么站着当靶子，练到他说“行了”为止。"
requires = [{ kind = "affinity", person = "chen_dong", ge = 20 }]
hint = "他把棍往肩上一扛就走了——还没熟到肯站着陪你练。"
reply = "他站了一个时辰，棍尖没晃过一下。我问行了没有，他说“再来”；又问，还是“再来”。太阳落到营房后头，他才把棍收回去：“行了。”我腿一软，坐在那块青石上，石头还是热的。他也坐下来，跟我隔着一个人的位置，拿袖子擦棍上的汗。"
next = "b1"
effects = [{ kind = "affinity", person = "chen_dong", value = 4 }, { kind = "skill", skill = "staff_fujian", value = 4 }, { kind = "bond", person = "chen_dong", level = "C" }]

[[tracks.chapters.choices]]
key = "ghost_story"
text = "练累了，坐在青石上给他讲一个月港的水鬼故事。"
reply = "我讲到水鬼从船底伸手攥人脚踝，压低了嗓子，自己先起了一身鸡皮疙瘩。陈栋嚼着一根草：“我不怕。”天黑透了，他却拎着棍跟在我后头，一直送到社学巷口，才说他家也走这条路。他家在卫所，跟这条巷子隔着半座城。"
next = "b1"
effects = [{ kind = "affinity", person = "chen_dong", value = 3 }]

# B1：1554 秋，校场上当众比棍，陈栋赢。物件：被他捡起来递还的那根棍。胜负已定，选项不改。
[[tracks.chapters]]
key = "b1"
title = "谁先认输"
text = "秋社那天，社学的人都挤到校场边看热闹。陈栋跟我对了三十几招，第三十七招，他的棍从我的棍底下挑上来，我的棍脱了手，在地上滚了两圈。有人起哄：“陈家少爷好威风！”陈栋一棍敲在石板上，脆得吓人，起哄的那几个一下没了声。他弯腰把我的棍捡起来，握着棍中间递还给我，棍头朝下：“你自己说，输在哪儿。”我接过棍，手心还在发麻。“第三步。脚落早了，重心压在前头，你一挑就起来了。”我顿了顿，“还有你。你收势慢了半拍。我要是不慌，那半拍够我敲你手背。”四周的人都去看他的脸。他没吭声，退回原地，把最后那一挑一收重新做了一遍，做得很慢。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tense"
news = "月港秋社，社学的孩子在卫所校场比棍，陈千户家的儿子赢了；有人起哄喊他威风，他倒一棍敲在地上，叫人闭嘴。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
