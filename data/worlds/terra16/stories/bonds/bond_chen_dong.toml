key = "v5_known"
when = [{ kind = "flag", flag = "c7_wandeng_unmasked_known" }]
text = "戚家的兵进闽以后，倭船少了，闽江口的卡子倒多了，查私船比查倭还紧。我的船排在第三条。轮到我，卡子的条桌后头坐着个穿卫所袍子的军官，腰里挂刀，手边靠着一根棍，棍身擦得发亮。是陈栋。他宽了一圈，眉梢多了一道疤。我把那块揣了七年的腰牌放到条桌上。他看了一眼，没碰，先伸手：“货单。”我把货单摊开，胡椒、苏木、象牙，一项一项念。他一项一项对，问得又细又冷，好像从没跟我在校场边的青石上坐过。念完最后一项，他抬起眼睛：“林晚灯。”他叫得很顺，跟念货单上的一项一样，像这三个字在嘴里早就念熟了。桌上，腰牌和货单挨在一起；他的兵在后头等他发话。"
