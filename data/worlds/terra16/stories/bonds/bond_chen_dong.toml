reply = "他把腰牌拿起来，在袖子上擦了擦，挂回腰上，系得跟当年一样紧。然后拿指甲在货单上划了两道：“苏木不是六十担，是七十。象牙两对，舱底还压着一根断的，也得报。”我瞪着他。他说：“你的船吃水多深，我站在岸上就看得出来。”我改了。他盖了印，叫人端来两碗卫所的粗茶，茶梗子浮了一层。我们隔着条桌喝茶，他问我这些年去过哪儿，我问他眉梢那道疤是哪一年落的。他说去年，在浯屿，别的不肯多讲。茶喝到见底，他把碗一扣：“下回别让我抓住。”“你抓不住。”“那就试试。”他把空碗往我这边推了推，“茶钱你出。”"
