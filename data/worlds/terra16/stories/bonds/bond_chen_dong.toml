# B2：1555 夏，倭船犯漳泉沿海，卫所催他回营。物件：他擦得发亮的棍。两个问题谁也没答完。
[[tracks.chapters]]
key = "b2"
title = "两个问题"
text = "五月里，海上的消息一天比一天坏：倭船进了九龙江口外头的几个澳子，烧了两个村，卫所的人连夜调去守海边。陈栋家里来人，催他回营。走的前一天，他坐在学堂廊下擦棍。棍身原是灰的，擦到后来泛出一层暗红的亮，照得见廊柱。他擦着擦着停了手：“林兄，问你一句。往后你看见穿卫所衣裳的，会不会一概当成拦路的？”我没马上答。我家的船上个月刚从南边回来，就泊在月港，船舱里的东西，卫所的人见了是要扣的。“那我也问你一句，”我说，“往后你看见海上来的人，会不会一概当成贼？”他抬头看我。廊外下起了雨，檐水滴进天井里的水缸，一下，又一下。他把棍横在膝上，又擦了一遍本来已经擦干净的地方。"
window = [[1555, 5, 1], [1555, 10, 31]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tense"
news = "倭船进了九龙江口外的澳子，烧了两个村，月港卫所连夜调兵守海；社学里那个千户家的儿子也被叫回了营。"
when = [{ kind = "date", from = [1555, 5, 1], to = [1555, 10, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "swap_answers"
text = "跟他约好：认人以前先问名字；下回见面，各答对方一个问题。"
requires = [{ kind = "affinity", person = "chen_dong", ge = 50 }, { kind = "bond", person = "chen_dong", level = "C" }]
hint = "他把棍收进布套就起身了——这种约，他还不会跟你打。"
reply = "他伸出手，我一巴掌拍上去，啪的一声。“我先答，”他说，“卫所里也有好人。比如我。”“那我也答：海上也有好人。比如我。”他笑出了声——认识一年多，我头一回听他笑出声来。笑完又板起脸：“名字还没问。”“林——”“知道。”他把棍扛上肩，走进雨里。"
next = "a1"
effects = [{ kind = "affinity", person = "chen_dong", value = 4 }, { kind = "bond", person = "chen_dong", level = "B" }]

