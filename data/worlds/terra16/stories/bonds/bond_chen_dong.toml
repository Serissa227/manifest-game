text = "七月以后，全社学都知道了“林兄”原来是林家的女儿。到了九月，背后的闲话还没歇：有人说难怪比棍老输，有人说林家的船烧得不冤。卫所的兵也来了，堵在学堂门口：“林家那个丫头在不在？叫出来，有话问。”屋里一下子静了，好几双眼睛往我这边转。陈栋拄着棍站起来，走到我桌子前头，背对着我，脸朝着门：“先把棍立端正——要问话，排在后头。”后排有人小声问：“陈栋，你是不是早就知道？”他头也没回：“早知道又怎样。”领头的兵往这边迈了一步。陈栋的棍往地上一顿，没让。他一只手拄着棍，另一只手背在身后，攥着个什么东西，攥得指节发白。"

# S：1556 腊月，社学散了。他把卫所的腰牌借给“我”。基础文本＝kept（仍叫“林兄”）；variant known 叫全名。
[[tracks.chapters]]
key = "s"
title = "借用的腰牌"
text = "腊月，社学散了。先生在门上贴了封条，学堂里的桌子都摞到墙角。我要回月港去。林家的船烧了，海还得出，搭别人的船也得出。陈栋在巷口等我。他从腰上解下一块木牌，牌上烙着镇海卫的字号，边角磨得发亮。“拿着。往南的路上有卫所的卡子，过卡的时候先报你自己的名字，再给他们看这个。”他把牌子按进我手心，“不必冒充谁。”“这是你的腰牌。”“借你的。等你平平安安过了那段路，再还我。”他把手缩回去，背在身后，往后退了一步，像比棍之前先拉开距离。“林兄，路上小心。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "yuegang"
cast = ["chen_dong"]
speaker = "captain"
mood = "tender"
news = "龙溪社学腊月散了学，镇海卫陈千户家的儿子在巷口送一个要出海的同窗，把自己腰上的牌子解了下来。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

