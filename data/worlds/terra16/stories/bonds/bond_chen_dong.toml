# C1：1554 春，社学门口的巷子。物件：缠了布的棍头。口头禅原句只在这里出现。
[[tracks.chapters]]
key = "c1"
title = "棍下的规矩"
text = "散学的锣刚敲过，社学门口那条巷子就被一根练习棍拦住了。陈栋一只脚蹬着墙根，棍横在半人高的地方：“林兄，敢不敢？”巷子两头已经有人探头。我把书袋往背后一甩，先问：“伤了人，算谁的？”他愣住了，像头一回听见有人比武之前问这个。愣完，他一声不吭跑进灶间，讨来两条旧布，把棍的两头一圈一圈缠上，缠得鼓鼓囊囊：“先过三棍，再讲道理。”比起来，他一招也不让。第三棍，我的棍被他压到地上，输了一个身位。可他收棍那一下，棍头明明冲着我的手腕来，半路偏开一寸，敲在我脚边的石板上。我甩着手腕看他。他已经蹲下去拆棍头的布，拆得很慢，没抬头。"
window = [[1554, 1, 1], [1554, 4, 30]]
