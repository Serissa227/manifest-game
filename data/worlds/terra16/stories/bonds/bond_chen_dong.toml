news = "月港社学门口的巷子里，镇海卫陈千户家的儿子又拿棍拦人比试，这回棍头还缠了布，说是怕伤着人。"
when = [{ kind = "flag", flag = "family_access_zhangzhou_shexue" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
