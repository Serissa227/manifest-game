# C7 羁绊线：陈栋——棍下的规矩（故事 2.0，A5 / E37 契约）
# 标签：BG，可恋爱的羁绊线；主角林晚灯（lin_wandeng，1540-03-23，女，社学里扮男装、自称“林兄”）。
# 人物：陈栋（chen_dong，1540-05-22，男，romance.with = f）：镇海卫千户之子，龙溪社学同窗，见面先比棍。
#       他早看出“林兄”是女孩，故意把别人的盘问引到自己身上；1556-07 揭开以前只用动作与沉默表现（C1 让开手腕、C2 替她挡问题），一个字不说破。
# 年龄：学院期两人 13—16 岁，心动只写在意与借口，S 的告白只是“等还腰牌那天再说”，最多握一下手；
#       重逢 1563 年两人都 23 岁，恋人落点要 c7_bond_chen_dong_romance + 心动 24（A1 6 + A2 6 + S 12）。
# 依据：史实——1550 年代漳泉沿海的倭患，镇海卫（漳州）的卫所兵；1556 年七月官兵搜港、林家的船被烧（TERRA16 §12.4，
#       揭开事件写在 bond_zhou_yan 的 wandeng_unmasked，本文件只读旗标）；1562—63 年戚继光的兵入闽之后，九龙江口查私船更紧；
#       浯屿是当年私船与海寇出没的岛。
#       原创——陈栋一家、缠布的棍、校场边的青石、木带扣、借出的腰牌、卡子上的货单。
#       待核：1563 年闽江口卡子的具体设置与陈栋的官阶（正文只写“卫所的军官”）。
# 缺省走向：每章玩家不在场时故事照走、没有收获；S 缺省他托社学看门的老伯把腰牌转交给她（_parted），重逢照样开启；
#       重逢缺省是陈栋托私船捎来的三行信（_missed）。
# 旗标：读 c7_wandeng_unmasked_known / c7_wandeng_unmasked_kept（bond_zhou_yan 设）；
#       设 c7_bond_chen_dong_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed。
