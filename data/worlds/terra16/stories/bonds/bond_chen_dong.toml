# 重逢：1563，戚继光的兵入闽之后，福州闽江口的卡子。陈栋是卫所的军官，“我”是跑私船的船主。
# 基础文本：腰牌在“我”手里（promise / heart / parted），不读揭开旗标时的写法。
# variants：own_kept / own_known / own（S 推回了腰牌，由他把腰牌拍在桌上）在前；kept（“还是该叫你别的？”）、known（直接叫名字）在后。
[[tracks.chapters]]
key = "reunion"
title = "站在两边"
text = "戚家的兵进闽以后，倭船少了，闽江口的卡子倒多了，查私船比查倭还紧。我的船排在第三条。轮到我，卡子的条桌后头坐着个穿卫所袍子的军官，腰里挂刀，手边靠着一根棍，棍身擦得发亮。是陈栋。他宽了一圈，眉梢多了一道疤。我把那块揣了七年的腰牌放到条桌上。他看了一眼，没碰，先伸手：“货单。”我把货单摊开，胡椒、苏木、象牙，一项一项念。他一项一项对，问得又细又冷，好像从没跟我在校场边的青石上坐过。念完最后一项，他抬起眼睛：“林兄。”只叫了这一声，就没了下文。桌上，腰牌和货单挨在一起；他的兵在后头等他发话。"
window = [[1563, 5, 1], [1563, 12, 31]]
at = "fuzhou"
cast = ["chen_dong"]
speaker = "captain"
mood = "tense"
news = "戚家的兵进闽以后，福州闽江口新设了卡子，查私船比查倭还紧；守卡的是个姓陈的卫所军官，手边总靠着一根棍。"
when = [{ kind = "date", from = [1563, 5, 1], to = [1563, 12, 31] }]

