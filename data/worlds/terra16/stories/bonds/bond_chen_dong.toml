[[tracks.chapters.choices]]
key = "own_fault"
text = "拉住他，把那一挑一收掰开来，一步一步争个明白。"
reply = "他听我一步一步拆，听到第三步就点头：“这一步，我也看见了。”拆到他收势那半拍，他把下巴一抬：“不认。”“你方才自己重做了一遍。”“做给你看归做给你看，认不认是我的事。”我们从校场争到巷口，从巷口争到天黑，卖豆花的担子都收了。分手的时候他说：“明天看谁先改好。”"
next = "b2"
effects = [{ kind = "affinity", person = "chen_dong", value = 3 }, { kind = "skill", skill = "staff_fujian", value = 6 }]

