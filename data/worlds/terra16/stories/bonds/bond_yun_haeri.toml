title = "灯下的倭歌"
text = "倭馆的一封旧书契里夹着一首倭歌，三十一个音，写在一张折得很小的纸上。先生看了一眼，说那不是公事，不必译，随手搁在一边。尹海梨来收废纸，把它抄了下来。打烊以后，她在纸铺后屋点了一盏灯，叫我过去，把抄本摊在灯下：“你要逐字听，还是只听意思？”我说两样都要。她就念得很慢，倭语一个音一个音地念，念一句，停下来，用朝鲜话说一遍字面，再说一遍她猜的意思。念到最后一句，前头有人拍门，是她父亲在催着上门板。“海梨！”她没应声，手指压着那一行，像怕它跑了。"
