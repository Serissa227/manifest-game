# B2：1555 年夏，乙卯倭变的消息传到釜山。她站在我家门口问：通事里会派谁去对马。秘密在这一章由主角说破。
[[tracks.chapters]]
key = "b2"
title = "南边的倭变"
text = "六月歇暑，城里没人歇得下来。南边传来消息，倭船打进了全罗道，达梁丢了，官兵死了好些人；早上说丢了一座城，傍晚就传成了三座。倭馆的门关了半扇，对马的商人不大出来走动；我父亲和几个通事整天关在屋里，写急报，誊急报，纸用得飞快。尹海梨来送纸，送完没走，在我家门口站了好一阵，看着窗纸上通事们低头写字的影子。“要是朝廷派人去对马问罪，”她问我，“通事里头，会派谁去？”我抢着说，大概是老通事，懂规矩的。“年轻的呢？懂纸的呢？”她问得太认真，眼睛一直盯着那扇窗，问完自己先笑了一下：“我就是问问。”"
