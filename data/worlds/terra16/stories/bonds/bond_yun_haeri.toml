# 重逢：1562 年，釜山纸铺。门口多了一块“校字”的木牌，校样上押着她的名字，常用语小册印出来了。
[[tracks.chapters]]
key = "reunion"
title = "自己的校样"
text = "六年以后我回到釜山，头一个去的就是纸铺。门口多挂了一块小木牌，写着“校字”两个字，是她的笔迹。柜台上堆着通事房送来的书契草稿，每一份都夹着纸条，纸条上是朱笔的校注，末尾押着一个小小的“尹”字。墙边码着一摞蓝布面的小册子，是那本港口常用语，印出来了；刚才在码头上，我就见一个卖鱼的老汉揣着一本，边角都卷了。尹海梨头也没抬，说：“先坐。”我就坐着，等她把手头那一页校完。她搁下笔，才把灯挪到我们中间，抽出一本小册子，翻开扉页给我看：三行小字，一行倭语，一行汉文，一行谚文，说的是同一句话。“那年写在书衣里的，”她说，“如今印在这儿了。”她把小册子合上，推到一边：“这回，想听你自己的原稿。”"
