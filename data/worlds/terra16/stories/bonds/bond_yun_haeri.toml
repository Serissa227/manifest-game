# C7 羁绊线（Claude 重写）：bond_yun_haeri「尹海梨：纸有正反」+ reunion_yun_haeri「尹海梨：自己的校样」——遵循 A5 / E37 故事 2.0 契约。
# 标签：any（女主角时 GL，男主角时 BG）；可恋爱的线。
# 人物：尹海梨 yun_haeri（1540-10-10，女，釜山纸商的女儿，替通事配纸，也偷偷校字；想编一本给渔民用的港口常用语小册；romance any）；
#   主角 custom_busan_interpreter（1540 年生，釜山通事家学的学生；第一人称“我”，嘴快、爱抢着译、常译得太直；不写性别、外貌、家族专名）。
#   各章年龄：C1—B1（1554）尹海梨 13—14 岁；B2（1555-06..08）14 岁；A1（1556-01..05）15 岁；A2（1556-06..11）15—16 岁；
#   S（1556-12）16 岁；重逢（1562）21—22 岁。主角同年（1540-01-01）。
#   学院期只写在意与借口：A1 心动 +6、A2 心动 +6（要求已有 6）、S 心动 +12，合计 24，正好够重逢的恋人落点；
#   S 的 heart 选项要求双方 16—17 岁，只约好“成年回釜山时再听她念那一句”，最多握手；恋人效果只在重逢（双方已满 18）。
# 依据·史实：1547 年丁未约条以后对马的船只许到釜山浦，对马人住在釜山的倭馆，往来靠书契；朝鲜纸以楮纸为主，日本有雁皮纸。
#   1555 年 5 月乙卯倭变：倭寇大举犯全罗道，达梁失守，官兵多有死伤；本文件只在 B2 用传闻口吻写，不写战场。
#   倭歌（和歌）五七五七七，三十一音。
# 依据·原创：尹海梨与主角的全部情节；对着光的那张薄纸；联句会上诗笺的指甲印；“不”字的回笺；
#   秋考那封冒名书契（“对马宗家用厚楮纸、博多商人用雁皮纸”是她的判断，属原创细节）；七种纸的口诀；
#   书契里夹着的倭歌与三稿汉译；A2 赠礼鹿皮书衣（leather_bookwrap）与里层三种文字的一行话；柿子树下的皱纸与朱墨；
#   1562 年纸铺门口“校字”的木牌、印出来的港口常用语小册、校样上的通事印。
#   待核：釜山纸铺是否替通事房校书契（正文只写“通事房送来的草稿先过她的手”）；1560 年代釜山能否刻印这样的小册。
# 秘密：她想亲自出使，从不在父亲面前说。B1 只露一点（说多了、咬住嘴唇），B2 的 guess_her_wish 由主角说破；不进任何见闻。
# 口头禅：“纸有正反，话别翻错。”原句只在 C1 正文用一次；A2 书衣里层的一行字只用后半句；A1 三稿与重逢只换说法呼应。
# 缺省走向（玩家什么也不做）：学院各章照走、没有收获——
#   C1 我随手买了一刀纸，誊书契时洇了两张；C2 那个字没改，先生说韵不稳；B1 照字面译了，先生说译对了字、没译对人；
#   B2 那个夏天她没再来送纸，纸铺换了个伙计；A1 她一个人念完那首倭歌，夹进她的小册子；A2 那只书衣她留着自己用，包着没编完的小册；
#   S 她没来柿子树下，伙计送来一刀纸，最上面一张留着很宽的纸边（开启重逢并设 c7_bond_yun_haeri_parted）；
#   重逢缺省寄来她一封信与一页校好的小册，翻到背面是倭语（设 c7_bond_yun_haeri_missed）。（羁绊章没有 stage，缺省没有显示文字，只记在这里。）
# 落点：friend 朋友 friends（_landing_friend，校样上按下通事印）；love 恋人 lovers（_landing_love，要 _romance、心动 ≥ 24、双方满 18）。
