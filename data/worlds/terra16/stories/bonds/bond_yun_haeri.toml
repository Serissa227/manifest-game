# C1：1554 年春，纸铺。一张对着光的韩纸，薄得快透了。口头禅原句在这一章。
[[tracks.chapters]]
key = "c1"
title = "透光的纸"
text = "父亲要誊一封回对马的书契，打发我去纸铺买纸。我一进门就说要最白的，越白越体面。柜台后头的女孩没应声，抽出一张，走到窗前，举起来对着光：“你看这儿。”纸上有一块薄得发亮，光从那里漏过来，像指甲盖大的一枚月亮。“写上去会洇。倭馆的人最挑这个，一个墨团，他们能说成是我们看轻了对马。”我说那就写另一面，哪一面不都一样。她把纸翻过来，指头顺着纸纹抹过去，又翻回来再抹一遍，一面涩，一面滑。“纸有正反，话别翻错。”她把纸放回那一刀里压平，像这句话是说给纸听的。里屋有人喊：“海梨，称纸！”她应了一声，没动，还在等我挑。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "busan"
cast = ["yun_haeri"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_busan_interpreters" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

