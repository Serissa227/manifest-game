# C2：1554 年 5 月 20 日，家学的汉诗联句会。我错了一个韵，她用指甲在字底下划了一道。
[[tracks.chapters]]
key = "c2"
title = "联句会上的一个字"
text = "家学办汉诗联句会，纸铺来送纸，尹海梨跟在她父亲身后，替先生们研墨、换笺。轮到我接句，我抢着落笔，写完才觉出不对：韵脚错了一个字，押到隔壁的韵上去了。诗笺要从她手里过一道，换新笺给下一位。她接过去，低头看了一眼，用指甲在那个字底下轻轻划了一道，划痕浅得只有斜着看才看得见，又把笺递回给我：“这张起了折痕，您另誊一张吧。”她父亲在旁边赔笑：“小孩子手笨，纸是好纸。”我对着那道指甲印改了一个字，重新誊好。先生念了一遍，捋着胡子说：“这一句接得稳。”我抬头去找她，她已经低头研墨了，墨条在砚台里转得不紧不慢。"
window = [[1554, 5, 10], [1554, 7, 9]]
at = "busan"
cast = ["yun_haeri"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 10], to = [1554, 7, 9] }, { kind = "age", le = 17 }]

