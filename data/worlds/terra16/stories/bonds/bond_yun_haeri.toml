# B1：1554 年 10 月 26 日秋考，当面译一封对马来的书契。纸是雁皮纸，信是冒名的。她说多了，咬住了嘴唇。
[[tracks.chapters]]
key = "b1"
title = "雁皮纸的书契"
text = "秋考是当面译一封书契。先生从匣子里取出一封对马来的信，纸薄得透得过指影，摸上去却韧，扯也扯不破。我译得飞快，译到一半卡住了：信里自称宗家，口气却像个讨价还价的掌柜，敬语东一层西一层。我照字面硬译完交了卷，心里不踏实。考完我跑去纸铺，把记下的几句念给尹海梨听，又比画那张纸的样子。她从柜子最底下翻出一张差不多的，举到窗前一照：“这是雁皮纸。宗家的书契用厚楮纸，盖印的地方还衬一层。这种薄的，是博多的商人拿来记账的。”她说得又快又准，说完才看见她父亲站在门口，一下子咬住了嘴唇，把那张纸塞回了柜子底下。"
