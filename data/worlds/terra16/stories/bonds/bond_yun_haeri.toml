text = "柿子树的叶子落光了，枝头还挂着十几个柿子，没人去摘，冻得通红。十一月的结业考，我在倭馆门前当场传译，一句也没出错，先生只说了声“去吧”。年底这天，家学的人聚在院里那棵柿子树下，你一言我一语，约以后在哪里见。尹海梨来了，手里攥着一张纸，纸边折得整整齐齐。“以后你寄信，”她说，“每页留一指宽的纸边，我好回注。”我说海上潮气重，信到你手里早皱了。她把那张纸摊开给我看，是我前年丢在纸铺的一页旧稿，被她校过，又被雨打湿过，皱得像柿子皮。“只要字还在，”她说，“就能慢慢读。”太阳斜照过来，枝头的柿子红得透光。"
