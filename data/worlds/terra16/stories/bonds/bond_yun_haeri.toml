[[tracks.chapters.choices]]
key = "buy_her_pick"
text = "请她替我挑一刀最合适的，顺便教我怎么分正反。"
reply = "她挑得很慢，一张一张举到窗前看，挑到三十几张，里屋又喊了一回。她用纸绳把一刀扎紧，在最上面那张的右角折了个小角：“折角的是正面。这一刀，你译错了，也怪不到纸上。”我笑出了声，她也笑了，笑完又板起脸，朝我伸手要纸钱。"
