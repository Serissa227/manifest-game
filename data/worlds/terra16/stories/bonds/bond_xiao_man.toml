# S：1556 腊月，江口石岸下（A1 避雨的地方）。物件：“我”那盏红纸灯笼底下的穗子，和她新求的一张符。
# 基础文本不读揭开旗标；variant known 她叫“晚灯”，kept 她照旧叫“林兄”。heart 选项是信物交换，不告白，最多握手（她这时 15 岁）。
[[tracks.chapters]]
key = "s"
title = "自己选的港"
text = "腊月的江口风硬。我提着那盏红纸灯笼去石岸下找小蛮，灯笼底下坠着一绺红穗子——我从小怕黑，这盏灯跟了我好些年。她已经在那里了，就是那年下雨我们躲过的地方。社学散了。开春我跟着鸟船走，她不走。她要留在港里跟老船主学掌船，攒钱买自己的第一条渔船。“等我有了船，先去吕宋。听说那边的风跟这边不一样，是从南边来的，暖的。”“你怎么知道是暖的？”“回来的船，帆都是潮的，摸着不凉。”她把手伸出石岸，让风吹了一下就缩回来，“你摸摸，我们这边的，冻手。”说着，她从怀里摸出一张新求的符，没缝，也没折，平平地放在我手心上，又把我的手指一根一根替我合拢：“这一张不许挂。等你回来再挂。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_xiao_man" }, { kind = "flag", flag = "c7_bond_xiao_man_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "跟她约好：往后谁先有了船，就带另一个出一趟海。"
requires = [{ kind = "bond", person = "xiao_man", level = "A" }]
hint = "谁先有船就带另一个出海——这话说出口就是一辈子。你们的交情还没到能同船的份上；又或者，同船一辈子的约，你已经跟别人许下了。"
reply = "“那肯定是你先，”小蛮说，“你家有船。”“家里的船烧了，就剩一条，开春还得拿它去讨生活。”她愣了一下，酒窝慢慢冒了出来：“那就是我先。”她伸出巴掌，我也伸出巴掌，在石岸底下啪地一击，震得灯笼直晃。她还不放心，拉过我的手，用指甲在我掌心划了一道：“船，一条。海，一趟。去哪里我说了算。”“凭什么你说了算？”“船是我的嘛。”我们又坐了很久，把将来那条船的样子说了一遍又一遍：船头要高，舱底要干，桅杆上不挂灯，免得被人当成鬼船。说到后来，潮水涨到了脚边。她站起来拍拍裤腿：“回去了。你走那天我不送，我在摊子上卖符——你从码头一回头就看得见。”"
next = "done"
effects = [{ kind = "bond", person = "xiao_man", level = "S" }, { kind = "relation", person = "xiao_man", relation = "friends" }, { kind = "memory", memory = "mem-bond_xiao_man-s", title = "自己选的港" }, { kind = "flag", flag = "c7_bond_xiao_man_promise" }, { kind = "flag", flag = "c7_pair_xu_cai_xiao_man_taken" }, { kind = "start_track", track = "reunion_xiao_man" }]

[[tracks.chapters.choices]]
key = "heart"
text = "割下灯笼上的一截穗子放进她手心，换这张符，什么也不说。"
requires = [{ kind = "bond", person = "xiao_man", level = "A" }, { kind = "heart", person = "xiao_man", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "xiao_man", le = 17 }, { kind = "romance_open", romance_open = "xiao_man" }]
hint = "小刀借到了手里，穗子却割不下去：心里那盏灯还没点得这么亮；又或者，那样的约，你已经许给了另一个人。"
reply = "我向她借了剖鱼的小刀，把灯笼底下那绺红穗子割下一截，放在她手心里，再把那张符收进怀里。我一句话也没说，她也没有问。她低头看着那截穗子，拿拇指捻了捻散开的线头，然后把它绕上自己的手腕，一圈，两圈，系了个死结——渔家的结，解不开的那种。系完，她伸手握住了我的手，握得很紧，指节都白了。灯笼少了穗子，在风里转得更厉害，光一会儿照在江上，一会儿照在她脸上。江水一直在我们脚底下响。过了不知多久，她才开口，声音比平时小：“穗子短了一截，你夜里还敢走路吗？”“不敢。”“那就别走夜路。等天亮了再走，我在码头上看得见。”她没有松手，一直握到潮水漫上了石阶。"
next = "done"
effects = [{ kind = "bond", person = "xiao_man", level = "S" }, { kind = "heart", person = "xiao_man", value = 12 }, { kind = "relation", person = "xiao_man", relation = "crush" }, { kind = "flag", flag = "c7_bond_xiao_man_romance" }, { kind = "memory", memory = "mem-bond_xiao_man-s", title = "自己选的港" }, { kind = "flag", flag = "c7_pair_xu_cai_xiao_man_taken" }, { kind = "start_track", track = "reunion_xiao_man" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟她比一比：看谁的船先到吕宋。"
reply = "“我先，”小蛮想也不想，“我看风比你准。”“我划船是你教的。”“那更是我先——哪有师傅输给徒弟的？”她把那张符从我手心里抽回去一半，又塞了回来：“这张你带着。到了吕宋，挂在你船上，我一进港就认得出来，好笑话你晚到。”我们在石岸下拉了钩。拉完她还不放心，捡了块碎瓦，在石壁上划了两道杠，一道长，一道短：“长的是我。”“凭什么？”“我先划的。”她把碎瓦在衣襟上擦了擦，揣进怀里：“这块我留着。等你晚到那天，拿出来给你看。”"
next = "done"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "relation", person = "xiao_man", relation = "rivals" }, { kind = "flag", flag = "c7_bond_xiao_man_own" }, { kind = "start_track", track = "reunion_xiao_man" }]

