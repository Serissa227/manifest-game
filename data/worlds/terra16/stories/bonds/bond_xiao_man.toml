# A1：1556 春，江口的石岸下避雨。物件：一块干手巾。心动选项 heart +6（不要求已有心动）。
[[tracks.chapters]]
key = "a1"
title = "雨里靠船"
text = "开春的江口说变天就变天，前一刻还看得见对岸的渡头，后一刻雨点子就砸下来，砸得江面全是白坑。小蛮一句话没说，抢过桨，三两下把舢板塞进一处凹进去的石岸底下，石头像屋檐一样罩住了我们。她从舱里的油布包抽出一块干手巾扔给我：“擦！书淋湿了，看你先生打不打你。”我忙着把怀里那本《论语》往干处掖，她忙着把缆绳绕上石头，绕了三道，又使劲拽了拽。等两个人都坐稳了，我才看出来：石岸底下只有一小块地方淋不着，她让给了我，自己半边身子露在外头，雨水顺着辫梢往下滴，滴进衣领里。“你过来一点。”“船会歪。”她说着，又往外挪了半寸。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "share_the_towel"
text = "把手巾撕成两半分她一半，挪过去挨着她坐。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 20 }, { kind = "age", le = 17 }, { kind = "age", person = "xiao_man", le = 17 }, { kind = "romance_open", romance_open = "xiao_man" }]
hint = "你才挪了半寸，她就瞪了过来——还没熟到能这样挨着坐，再挪，她真会把你推下船。"
reply = "船果然歪了一下，又稳住了。小蛮接过那半块手巾，没擦自己的脸，先替我把书角上的水吸干。雨下了整整一个时辰，我们就肩膀挨着肩膀坐了一个时辰。雨停的时候，她看着天说：“明天要是还下雨，我们还来这里。”我说明天刮东北风，不会下。她说：“那我去求妈祖下。”"
next = "a2"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "heart", person = "xiao_man", value = 6 }]

[[tracks.chapters.choices]]
key = "row_her_home"
text = "等雨小了，换我来划，把她送回天妃宫。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 50 }, { kind = "bond", person = "xiao_man", level = "C" }]
hint = "你伸手去拿桨，她把桨抱得更紧了——这样的雨里，她还不放心把船交给你。"
reply = "雨小成了雾，我把桨接过来。手腕是松的，桨叶贴着水，船一路没打转。小蛮裹着那块手巾坐在船头看我，一直看到天妃宫的码头才开口：“这船你划得比我还好了。”我说是她教的。她把手一伸：“那学费呢？两年了，一个铜板都没见着。”"
next = "a2"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "bond", person = "xiao_man", level = "B" }]

[[tracks.chapters.choices]]
key = "tell_ghost_story"
text = "给她讲一个鬼故事，讲到她也害怕为止。"
reply = "我讲的就是江口那条鬼船：桅上一盏红灯，灯底下没有人，只有一行湿脚印，从船头走到船尾……讲到脚印走上了我们这条舢板，我自己先打了个哆嗦，往她那边缩。小蛮笑得船都在晃：“书生，你讲的鬼，专吓你自己。”"
next = "a2"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }]

# A2：1556 秋，搜港之后林家的船烧了，“我”开春要带家里最后一条鸟船出海。物件：缝进衣襟的妈祖平安符（mazu_charm）。
# 基础文本不读揭开旗标、一个字不点明；variant known 加她得意的一句，kept 加一笑。bond A 的两个选项给赠礼与回忆。
[[tracks.chapters]]
key = "a2"
title = "缝进衣襟的符"
text = "搜港以后，林家停在港里的几条船只剩几截烧黑的龙骨。开春，我要带着家里最后一条鸟船出海。小蛮听说了，什么也没问，第二天就提着针线篮来了。她叫我坐在门口的石墩上别动，把一张平安符折成指甲盖大，塞进我衣襟的夹层，一针一针地缝，针脚密得像渔网。“船上的老人讲，遇了大风要喊‘妈祖’，别喊‘天妃’。”她咬着线说，“喊天妃，她要梳头、戴冠、换好衣裳才肯来；喊妈祖，她披着头发就来了。”“那两个一起喊呢？”“那她就不知道该穿哪身，在家里急死。”缝到最后一针，针尖扎进了她的指头。她“嘶”了一声，把指头含进嘴里，另一只手拍了拍我的衣襟，拍得很重。"
window = [[1556, 9, 1], [1556, 11, 30]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 9, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "keep_charm"
text = "收下符，跟她说：出海遇了大风，我第一个喊的是她。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 80 }, { kind = "bond", person = "xiao_man", level = "B" }]
hint = "她缝完就收了针，只当是街坊之间的寻常人情；“第一个喊她”这样的话，你们的交情还担不起。"
reply = "“喊我没用，”她把头一扭，“我又不会披着头发飞过去。喊妈祖。”可她的脸红到了耳根，把针线往篮子里收，收进去一回又掉出来，再收一回，顶针滚到了石墩底下。她弯腰去捡，半天没直起身来。"
next = "s"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "bond", person = "xiao_man", level = "A" }, { kind = "item", item = "mazu_charm", qty = 1 }, { kind = "memory", memory = "mem-bond_xiao_man-a2", title = "缝进衣襟的符" }]

[[tracks.chapters.choices]]
key = "hold_her_needle_hand"
text = "收下符，握住她那根被针扎破的手指。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 80 }, { kind = "bond", person = "xiao_man", level = "B" }, { kind = "heart", person = "xiao_man", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "xiao_man", le = 17 }, { kind = "romance_open", romance_open = "xiao_man" }]
hint = "你的手抬起来又放下了——这份东西太重，你们还没熟到能收下，更别说去握她的手。"
reply = "她的指尖冒出一粒血珠，红得像符上的朱砂。我握住了，她没有抽回去，也没有看我，只盯着江上一条进港的渔船，一直看到它靠上码头、缆绳绕上了桩，她才开口：“这一针，算我替妈祖扎的。你记着疼，就记得喊她。”"
next = "s"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "bond", person = "xiao_man", level = "A" }, { kind = "item", item = "mazu_charm", qty = 1 }, { kind = "memory", memory = "mem-bond_xiao_man-a2", title = "缝进衣襟的符" }, { kind = "heart", person = "xiao_man", value = 6 }]

[[tracks.chapters.choices]]
key = "ask_bai"
text = "问她：这一张，也是白道长盖过印的吗？"
reply = "“这一张不是买的。”小蛮把针别回线团上，“我去天妃宫里跪着求的，跪了一下午，膝盖到现在还青着。”她说得随随便便，像在说今天的鱼价。我把衣襟按住，按了很久，按得那张符的四个角都摸得出来。"
next = "s"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }]

