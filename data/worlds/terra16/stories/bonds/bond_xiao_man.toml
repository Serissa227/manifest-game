effects = []

[[tracks.chapters.choices]]
key = "bargain_minnan"
text = "接着用闽南话跟她磨，磨到她松口为止。"
reply = "我从潮水讲到鱼价，从鱼价讲到天妃宫的香火钱，讲到她的赤脚在石板上冻不冻。她终于把手一摊：“五文，五文！你这书生，嘴比渔婆还利。”我把符揣进怀里就走，她在后头扯着嗓子喊：“挂稳一点！别揣着揣着就丢了！”"
next = "c2"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }]

[[tracks.chapters.choices]]
key = "does_it_work"
text = "问她：这符到底管不管用？"
reply = "她歪着头想了一下，像是头一回有人当面问她这个。“管不管用，要看你会不会划船。”她把符塞进我手里，只从我掌心拈走五文：“剩下五文先欠着，等你学会了划船再来还。”我说我不会划船。她说：“那你就还得来。”"
next = "c2"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }]

# C2：1554 夏，九龙江口。物件：阿公传下来、磨得发亮的桨。全文件第二处也是最后一处“看穿”：keep_rowing 的回复里她看了一眼“我”的手。
[[tracks.chapters]]
key = "c2"
title = "第一根桨"
text = "小蛮说那张符我白买了：“挂着符不会划船，妈祖看了都要笑。”她把我拉上她家的小舢板，桨是她阿公传下来的，握手的地方磨得发亮，比我的砚台还亮。九龙江口的水浑黄浑黄，我两手攥紧了桨，使出全身的劲，船头却一圈一圈地转，转得我头晕。小蛮坐在船尾，一只脚踩着船舷，等我转到第三圈，才伸手按住桨柄：“手腕松一点。划船跟撒谎一样，太用力就露馅。”“我从来不撒谎。”她又笑出两个酒窝：“你看，又露馅了。”我松了手腕，桨叶贴着水推出去，船身轻轻一沉，不转了，顺着水往前走。我得意地回头，她却指着岸上：“你看那棵榕树。”那棵榕树还在原地，一寸也没挪。我划了半天，原来只是跟涨潮打了个平手。她笑得前仰后合，差点翻进江里。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "keep_rowing"
text = "不上岸，一直划到能自己把船划回码头。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 20 }]
hint = "小蛮把桨收回了船尾——她还当你是来消遣的书生，阿公的桨不会交给你。"
reply = "我从午后划到太阳偏西，岸上的榕树终于一棵一棵往后退了。船擦着码头的石阶靠上去，我两只手掌各磨出一个水泡。小蛮先跳上岸，回身拉我，拉到一半，低头看了一眼我的手，看得比看风还久。她什么也没说，从怀里掏出一块干净的蓝布，撕成两条，一圈一圈替我缠上，打了个渔家的死结。"
next = "b1"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "bond", person = "xiao_man", level = "C" }]

[[tracks.chapters.choices]]
key = "ask_her_row"
text = "说今天先看她划，明天再学。"
reply = "小蛮哼了一声，把桨接过去。她不像在划船，倒像拿桨在江面上写字，一撇一捺，舢板贴着浪尖滑过去，连水声都是轻的。我看得嘴都忘了合上。她一直划到江心才回头：“看够了没有？明天你划，我坐船尾嗑瓜子。”"
next = "b1"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }]

# B1：1554 秋冬，九龙江口外的夜海。物件：桅杆上那盏灯，以及“我”壮胆提着的、写着“林”字的红纸灯笼。
[[tracks.chapters]]
key = "b1"
title = "江口的鬼船"
text = "小蛮说，九龙江口外夜里有鬼船：“没人掌舵，没人摇橹，桅杆上就挂一盏红灯。谁划过去看，就再也回不来。”我怕鬼，最怕的就是这种没人的船；可我更想知道那盏灯后来怎么样了。我缠了她三天，她才挑了个没月亮的晚上，把舢板划出江口。我提着自家那盏红纸灯笼壮胆，灯笼上一个墨写的“林”字。海上黑得像打翻了墨汁，我抓着船舷，牙齿打架，嘴上还在问：“回不来的人，后来去哪了？”“被鬼请去喝酒了。”那盏灯真的出现了，悬在半空，一动不动。小蛮把桨放慢，一点一点靠过去，灯底下慢慢显出一条福船的黑影，船舷上站着几个人，手里有刀。火把照过来，照见我手里的灯笼，有人“咦”了一声，收了刀，朝我们直挥手：“林家的？快走，快走！”小蛮掉转船头。划出去好远，她才回过头来看我，眼睛里全是笑。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "mystic"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "tell_her_truth"
text = "回来的路上告诉她：那条船，跟我家是一伙的。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 20 }]
hint = "船上那几把刀还在你眼前晃。家里的事，她还不知道你肯不肯说；你开了口，她也只会装没听见。"
reply = "“我早猜到了。”小蛮头也不回，“月港半夜敢点着灯出江口的，还有谁家？灯还挂那么高，生怕自己人看不见。”她把桨往我怀里一塞：“你家的鬼，你自己划回去。”那一路我划得歪歪扭扭，她坐在船头哼渔歌，一句也没再问。"
next = "b2"
effects = [{ kind = "affinity", person = "xiao_man", value = 2 }, { kind = "bond", person = "xiao_man", level = "C" }]

[[tracks.chapters.choices]]
key = "keep_scared"
text = "装作吓得要命，揪着她的袖子一路回到码头。"
reply = "我揪着她的袖子，从江口一直揪到码头。她笑了一路：“书生胆子真小，人家都挥手了，你还抖。”上了岸，她却伸手从我衣襟里把那张平安符拽出来，红绳绕了两圈，重新打了个结，挂得比原先还稳：“抖成这样，符都要抖掉了。”"
next = "b2"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }]

# B2：1555，倭寇打到南京城外的消息传来，买符的人排到庙门外。物件：刻着反字的符版。她的秘密（符的来历）在这里解开，永远不进见闻。
[[tracks.chapters]]
key = "b2"
title = "白道长的符"
text = "那年倭寇一路打到南京城外的消息传到月港，天妃宫前买符的人排到了庙门外。有个船户逢人就讲，挂了小蛮的符，他的船三年没翻过。第二天，小蛮的符涨到二十文，还是不够卖。她却早早收了摊，拉着我绕到天妃宫后头，去找从宁波来、在那里借住的白道长。一路上她揪着自己的辫梢：“我卖的符，我自己都不知道打哪来的。万一人家真当它能挡浪呢？”白道长听完，捋着胡子，从柜子里抱出一块巴掌宽的木版，上面刻着反写的符文，朱砂渗进了木纹里。“漳州城里刻书铺印的，一印就是一百张。贫道不过在上头盖个印。”“就……这样？”“就这样。”小蛮盯着那块木版，半天没说话。她伸手摸了摸那些反着的字，又把手缩了回来。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "change_her_sign"
text = "陪她回去，把摊前的木牌改成“符是念想，开船靠自己”。"
requires = [{ kind = "affinity", person = "xiao_man", ge = 50 }, { kind = "bond", person = "xiao_man", level = "C" }]
