# 重逢：1568，月港开海的第二年，小蛮的船第一次出洋，从吕宋回来。物件：她那条刚从吕宋回来的船。
# 基础文本不写穗子（只有 S 换过穗子的人才看得见，variant tassel 读 _romance）；variant with_xu_cai 读配角线的 _together，只提一句许采在码头等她。
# 落点：friend（friends，永远可选）、rival（rivals）、love（lovers，要 _romance + 心动 24 + 双方满 18）；default 是她托渔船捎来的信。
[[tracks.chapters]]
key = "reunion"
title = "第一次出洋回来"
text = "月港开海的第二年，九龙江口的帆多得数不过来。我在码头上等一条从吕宋回来的船，等了三天。船进港的时候吃水压得很深，舱口堆着苏木，船舷上站满了晒得黝黑的水手，一声一声地喊“船主”。被喊的那个人站在舵边，赤着脚，正指着缆桩骂一个系错了结的后生。“小蛮！”她没回头。她把那个结拆了，重新系好，又吩咐先卸苏木、后卸银子，水柜今晚就得刷干净。一件一件吩咐完了，她才转过身来，眯着眼往码头上扫——就扫了一眼——两个酒窝冒了出来，抬起胳膊冲我使劲挥：“提灯的！站那么远干什么，怕我的船是鬼船？”"
window = [[1568, 1, 1], [1568, 12, 31]]
at = "yuegang"
cast = ["xiao_man"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1568, 1, 1], to = [1568, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "xiao_man", text = "林兄：船从吕宋回来，我在码头上数日子，数到了，你不在。港里的人说你的船往南去了，不知道哪天回。我等不得，船还要赶下一趟，只好托一条去南澳的渔船把这封信捎给你——他们每个月跑一回，你要是在那一带，总碰得上。信是请庙里的先生替我写的，我说一句，他写一句，嫌我话多。吕宋的风是暖的，跟我那年猜的一样，从南边来，帆一夜都不干。那边岸上也有福建人供的妈祖，草棚子搭的，香火比不上我们天妃宫，可船一靠岸，水手们头一件事就是去给她磕头。船是我的了——一半是，另一半的钱还欠着。水手十一个，有两个爱偷懒，我都盯着。信里夹着一张新求的妈祖符。这回不是买的，也不是刻书铺印的，是我跪着求的，跪了一个下午，你别嫌它皱。符背面我画了一盏灯，画得丑，你认得就行。遇了大风，记得喊妈祖，别喊天妃。还有，你那手划船的本事别丢了，下回见面我要考。下回进月港，到天妃宫前问一声卖符的小蛮——早就不卖了，可人人还这么叫我。小蛮" }, { kind = "flag", flag = "c7_bond_xiao_man_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "上她的船，听她讲吕宋的风到底哪里不一样。"
reply = "她把我拽上船，按在舵边一只空水桶上，自己盘腿坐在船板上，从午后一直讲到点灯。吕宋的风果然是从南边来的，暖的，暖得帆一夜都不干。马尼拉湾的拉惹收税比月港的税关还狠；听说更南边的宿务来了一伙西班牙人，穿着铁衣裳，热得直冒汗。那边的福建船户在岸边搭了个草棚，供着一尊小小的妈祖，“脸比我们天妃宫的黑，”她一本正经地说，“晒的。”讲到后来，她把一只手按在舵柄上，像按着一匹马的脖子：“这条船，是我的了。原先的船主老了，盘给了我，钱还欠着一半。”天黑透了，水手们在舱里划拳。小蛮站起来伸了个懒腰，忽然转身指着我：“下一趟，你跟我去。我掌舵，你坐船头，路上给我讲鬼故事——讲你自己先怕的那种。”"
next = "done"
effects = [{ kind = "affinity", person = "xiao_man", value = 5 }, { kind = "relation", person = "xiao_man", relation = "friends" }, { kind = "flag", flag = "c7_bond_xiao_man_landing_friend" }, { kind = "memory", memory = "mem-bond_xiao_man-reunion", title = "第一次出洋回来" }]

[[tracks.chapters.choices]]
key = "rival"
text = "告诉她：我去年就到过吕宋，这一局她输了。"
reply = "小蛮的酒窝一下子收了回去：“你是坐谁的船去的？”“……搭的一条泉州船。”“那不算。”她把手里的缆绳往桩上一甩，“你是坐别人的船去的，我是开自己的船去的。坐船的不算到，开船的才算到。”“这规矩谁定的？”“我。”我们在码头上吵了半个时辰，从谁先看见吕宋的山，吵到谁的船吃水深，吵到最后，她的水手卸完了苏木，蹲成一排看热闹。小蛮吵不赢，也不肯认输，转身从舱口拎来一把棕刷，塞进我手里：“下一趟，比谁先到。输的那个，替赢的那个把水柜刷干净。”“这一趟还没比呢。”“这一趟算你输——你是站在码头上看着我进港的。”她把我往水柜那边一推：“刷吧，提灯的。”"
next = "done"
effects = [{ kind = "affinity", person = "xiao_man", value = 3 }, { kind = "relation", person = "xiao_man", relation = "rivals" }, { kind = "flag", flag = "c7_bond_xiao_man_landing_rival" }, { kind = "memory", memory = "mem-bond_xiao_man-reunion", title = "第一次出洋回来" }]

[[tracks.chapters.choices]]
key = "love"
text = "把那张一直没挂的符拿出来，请她挂到我的船上。"
requires = [{ kind = "flag", flag = "c7_bond_xiao_man_romance" }, { kind = "heart", person = "xiao_man", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "xiao_man", ge = 18 }, { kind = "romance_open", romance_open = "xiao_man" }]
hint = "那张符在怀里揣了这些年，当年那句话没有说出口，今天站在她的船边，也还是说不出口。"
reply = "那张符在我怀里揣了十一年，边角都磨毛了，朱砂褪成了淡红。我把它放在她手心上，就像她当年放在我手心上那样：“你说等我回来再挂。我回来了。”小蛮把那张符翻过来，又翻回去，一个字也没说，跟着我上了我的船。她挑了舵边的一根横木，红绳绕了三道，系紧，又拽了拽，拽得横木都响了。挂好了，她的手却没有从符上拿开。“这回挂上了，”她背对着我说，“舵你也掌得了。那你还走不走？”我还没想好怎么答，她已经转过身来，手腕上那截褪了色的穗子擦过我的脸，她吻了我。很快，像怕被水手们看见；又不太快。码头上有人吹了一声口哨。小蛮头也不回：“看什么看！卸货！”然后她低下头，在我耳边说：“要走，就坐我的船走。”"
next = "done"
effects = [{ kind = "affinity", person = "xiao_man", value = 5 }, { kind = "relation", person = "xiao_man", relation = "lovers" }, { kind = "flag", flag = "c7_bond_xiao_man_landing_love" }, { kind = "memory", memory = "mem-bond_xiao_man-reunion", title = "第一次出洋回来" }]

[[tracks.chapters.variants]]
key = "v1_with_xu_cai"
when = [{ kind = "flag", flag = "c7_pair_xu_cai_xiao_man_together" }]
text = "月港开海的第二年，九龙江口的帆多得数不过来。我在码头上等一条从吕宋回来的船，等了三天。船进港的时候吃水压得很深，舱口堆着苏木，船舷上站满了晒得黝黑的水手，一声一声地喊“船主”。被喊的那个人站在舵边，赤着脚，正指着缆桩骂一个系错了结的后生。“小蛮！”她没回头。她把那个结拆了，重新系好，又吩咐先卸苏木、后卸银子。码头另一头，许采举着一张天妃宫的符在等她；小蛮先冲那边笑了一下，才转过身来，眯着眼往我这边扫——就扫了一眼——两个酒窝冒了出来，抬起胳膊冲我使劲挥：“提灯的！站那么远干什么，怕我的船是鬼船？”"

[[tracks.chapters.variants]]
key = "v2_tassel"
when = [{ kind = "flag", flag = "c7_bond_xiao_man_romance" }]
text = "月港开海的第二年，九龙江口的帆多得数不过来。我在码头上等一条从吕宋回来的船，等了三天。船进港的时候吃水压得很深，舱口堆着苏木，船舷上站满了晒得黝黑的水手，一声一声地喊“船主”。被喊的那个人站在舵边，赤着脚，正指着缆桩骂一个系错了结的后生。“小蛮！”她没回头。她把那个结拆了，重新系好，又吩咐先卸苏木、后卸银子，水柜今晚就得刷干净。一件一件吩咐完了，她才转过身来，眯着眼往码头上扫——就扫了一眼——两个酒窝冒了出来，抬起胳膊冲我使劲挥。她的手腕上系着一截红穗子，颜色早褪成了旧砖的颜色，结还是那个死结。“提灯的！站那么远干什么，怕我的船是鬼船？”"
