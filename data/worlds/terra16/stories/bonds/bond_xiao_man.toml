# C1：1554 春，天妃宫前的符摊。物件：一张平安符。全文件第一处“看穿”：她在“我”袖口多停了一眼。口头禅原句只在这里出现。
[[tracks.chapters]]
key = "c1"
title = "符上的价"
text = "天妃宫前的石阶底下铺着一张竹席，席上一只木匣，匣里码着一叠黄纸符，朱砂印还没干透。卖符的是个渔家女孩，赤着脚，眼睛又黑又亮，一声吆喝，半条街都回头。我蹲下去挑了一张平安符，问多少钱。她没答，先把我从头看到脚，看到袖口时多停了一眼，然后两个酒窝一起冒了出来：“十文。”“隔壁阿婆才卖五文。”“那是渔婆的价。你穿着长衫，是书生的价。”我改用闽南话跟她算：五文一张，我买两张，算我九文。她笑得更厉害了，捏着那张符在我眼前晃：“符挂上，舵还得自己掌。这张纸挡不住风浪的，书生，挂着是个念想。”“那你还要十文？”“念想也要钱的嘛。”"
window = [[1554, 1, 1], [1554, 4, 30]]
# 地点（2026-11-10 S01）：c1 由 yuegang 改 zhangzhou_city——入学事件一答完，阶段就切到社学、人到了漳州城，窗口内再没回过月港，这一章改之前从未出场。
at = "zhangzhou_city"
