# C7 羁绊线：小蛮——符上的价（故事 2.0，A5 / E37 契约）
# 标签：GL，可恋爱的羁绊线；主角林晚灯（lin_wandeng，1540-03-23，女，龙溪社学里扮男装，同窗叫她“林兄”）。
# 人物：小蛮（xiao_man，1541-07-01，女，pure_gl，romance.with = f）：月港天妃宫前卖妈祖符的渔家女，看风比看人还准；教“我”划船。
#       她第一眼就看穿了“林兄”，但从不说破：全文件只有两处——C1 她在“我”袖口多停了一眼，C2 keep_rowing 的回复里她看了一眼“我”的手。
#       1556-07 揭开（bond_zhou_yan#wandeng_unmasked）以前，正文、标题、选项、回复都不写林晚灯是女孩；A2、S 用 variants 读揭开旗标。
# 年龄：C1—A1 小蛮 12—14、林晚灯 13—16；A2（1556-09..11）林晚灯 16、小蛮 15；S（1556-12）林晚灯 16、小蛮 15——
#       学院期只到心照不宣：A1 heart +6、A2 heart +6、S heart +12（信物交换，不告白，最多握手）。
#       重逢 1568 两人 26—28 岁；恋人落点要 c7_bond_xiao_man_romance + 心动 24（6 + 6 + 12）+ 双方满 18。
#       （决定表原写 S +10，合计 22 到不了 24，按简报改为 +12。）
# 依据：史实——嘉靖三十四年（1555）一小股倭寇流窜到南京城外；1556 年官兵搜港、林家的船被烧（TERRA16 §12.4，揭开写在 bond_zhou_yan）；
#       隆庆元年（1567）月港开海、商船领船引出洋；1565 年起西班牙人据宿务，马尼拉 1568 年仍在当地拉惹治下（重逢里只写“南边宿务来了西班牙人”）；
#       漳州的刻书业。
#       民间说法——“遇风喊妈祖，神披发即至；喊天妃，则冠帔而来、迟”，见清代闽台笔记所记船家之言，这里前移作月港老船工的口传。待核：最早的书证。
#       原创——小蛮的符匣与“书生的价”、阿公传下来的桨、江口那条挂灯的走私福船、刻着反字的符版、石岸下避雨、缝进衣襟的符、灯笼穗子与新求的符、信里画的一盏灯。
#       白道长（bai_daozhang）在 cast 里住宁波；本文件只在 B2 正文里写他“从宁波来、在天妃宫后头借住”，不进 cast。
# 去重：“第一个字是蛮”“船头挂许采写的字”“许采教小蛮认字、小蛮教许采划船”都归 pair_xu_cai_xiao_man，本文件不用；本文件写小蛮教“我”划船、符的来历。
# 口头禅：人物卡的“符挂上，舵还得自己掌。”原句只在 C1 出现一次，其余章节换说法呼应。
# 缺省走向（玩家不在场时故事照走、没有收获）：C1 符没买成，她说书生明天再来 → C2 她一个人划到天黑 → B1 鬼船那夜没去 → B2 符照旧卖、卖时多说一句话
#       → A1 雨下到天黑，她一个人把船划回天妃宫 → A2 她把符缝好，托人送到林家，“我”出海以后才发现
#       → S 开春出海那天她在天妃宫前卖符、没来码头，新求的符托人送上船（_parted，重逢照样开启）
#       → 重逢缺省：她托一条渔船捎来一封信和一张新求的妈祖符，符背面画着一盏灯（_missed）。
# 旗标：读 c7_wandeng_unmasked_known / c7_wandeng_unmasked_kept（bond_zhou_yan 设）、c7_pair_xu_cai_xiao_man_together（pair_xu_cai_xiao_man 设）；
#       设 c7_bond_xiao_man_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       S 的 promise 与 heart 设 c7_pair_xu_cai_xiao_man_taken（配角线改走“并肩的朋友”）。
#       重逢另读本文件的 _romance：只有 S 换过穗子的人，重逢时才看见她腕上的穗子（variant tassel）。
# 秘密：她怕自己卖的符来历不明，B2 两人去问白道长——这件事与 kept 分支都不进见闻；本文件的羁绊章都没有 stage，不写 news。
# 日程：不改。（cast 日程 1554—1556 把小蛮放在 zhangzhou_city，本线照简报写 yuegang，与 pair_xu_cai_xiao_man 相同，请整合方统一处理学院期的在场。）

