[[tracks.chapters.choices]]
key = "finish_slowly"
text = "把这一页一字一字抄完，抄完念给她听。"
requires = [{ kind = "affinity", person = "zubayda", ge = 20 }]
hint = "笑话后面的东西，你还不想让她看见；这一页念出来，你怕自己的嗓子先不听使唤——你们还没熟到能让她听见那样的声音。"
reply = "我念得很慢，念到“建得最好”，嗓子卡了一下，还是念完了。祖贝达把那页拈过去，对着灯看了一会儿：“等你回去，把你看见的基尔瓦写下来，补在这一页后面。”我说书上没地方了，后面紧接着就是下一座城。“我给你订一张进去，”她说，“书是我家的，订几张我说了算。”"
next = "b2"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "bond", person = "zubayda", level = "C" }]

[[tracks.chapters.choices]]
key = "joke_again"
text = "再讲一个笑话，把这一页糊弄过去。"
reply = "我讲了个索法拉金市上的笑话：有个商人把铜砝码刷了金粉，称了一辈子金子，最后连自己的棺材都是按铜价卖的。我讲得比平常还响。祖贝达没笑，拿指甲敲了敲那滴墨：“这一页，笑话补不上。”我低下头把剩下几行抄完，一个字也没错，那滴墨也拿小刀刮干净了。她收纸的时候，在账本上我名字后面画了个小钩。我问那是什么，她说：“这页算数。”"
next = "b2"
effects = [{ kind = "affinity", person = "zubayda", value = 3 }]

[[tracks.chapters]]
key = "b2"
title = "姐姐的署名"
text = "阿米娜是祖贝达的姐姐，书铺的书大半是她抄的，字匀，错少。可卖出去的时候，书的最后一行写的是书铺的名号，从来不是她的名字。这天祖贝达抱着一本刚装订好的《玛卡梅》来找我，书页上还有一股新浆糊的酸味。她翻到最后，书铺名号底下还能再写一行。“我想在这儿添一句，写明是谁抄的。”她压着嗓子，眼睛往临街窗下的抄书桌瞟，生怕姐姐听见，“我父亲说，买书的人不认女人的名字，写上去，书就卖不动了。”“你姐姐怎么说？”“她说随便。”祖贝达把书合上又打开，“她说随便的时候，就是不随便。”她把书推到我面前，“你是做买卖的。你说，这行字写上去，卖不卖得动？”"
