# C7 羁绊线：祖贝达（缺页的书）。故事 2.0，遵循 A5 / E37 契约。
# 标签：GB（由祖贝达先开口、她定条件）。章节：C1 C2 B1 B2 A1 A2 S，另有成年重逢一章。
# 人物：祖贝达（zubayda，1540-01-01 生，女，取向 m），开罗书商街书铺的小女儿；
#       主角巴拉卡·宾·萨利姆（baraka，1540-07-23 生），基尔瓦金商之子，住爱资哈尔的杰巴尔提住宿区，“我”；
#       阿米娜（amina，1538-04-10 生，不开放恋爱）只在 B2、S、重逢里被提到，不进 cast。
#       重逢在天黑以后：按 tie_zubayda_amina（1555 起夜里不接活）与 bond_amina（1561 抄书房只在白天开门），
#       阿米娜已收笔，只写她当天抄完、署了名的那本书（简报写“在后间抄书”，为与两条线一致而改）。
# 年龄：C1（1554 春）主角 13、祖贝达 14；A1（1556 春）主角 15、祖贝达 16；S（1556-12）两人都 16；重逢（1564）两人 23—24。
#       学院期只到 heart 与 crush（S 的 heart 选项只到牵手）；lovers 只在重逢，要 romance 旗标 + heart ≥ 24 + 双方 ≥ 18。
# 羁绊阶梯：C2 wait_for_ink 给 C，B1 finish_slowly 补签 C；B2 design_colophon 给 B，A1 read_for_her 补签 B；
#       A2 keep_lid / need_a_reason 给 A + 糖无花果（sugar_figs）+ 回忆。每章都有不带 bond 的选项。
# 心动：A1 come_next_week +6 → A2 need_a_reason +6（要 ≥ 6）→ S heart +12（要 ≥ 12）→ 重逢 love 要 ≥ 24。
#       决定表写 S +10，算下来只到 22、永远够不着 24，这里按简报改为 +12。
# 依据（史实）：伊本·白图泰 1331 年到过基尔瓦，《游记》里说它是世上最美、建得最好的城之一，屋顶用红树木杆搭，
#       苏丹（艾布·穆扎法尔·哈桑）把身上的衣裳脱给一个讨衣裳的人；1505 年阿尔梅达的葡萄牙舰队攻进基尔瓦，城遭劫掠，
#       苏丹出逃，葡萄牙人在港口筑堡。开罗爱资哈尔一带的书商与抄书行当；撒细沙吸墨；哈里里的《玛卡梅》是书市上的常销书；
#       往苏伊士的商队、红海的船与东北季风南下东非。
# 原创：祖贝达一家的书铺、缺一百一十七页的残本与每周一页的账、扉页注明缺页、阿米娜的第一行署名、瞎眼的老主顾、
#       盒盖上的炭字、柜子里按收到次序码放的信、留着的最后一页。
# 待核：十六世纪中叶开罗书市上是否流通伊本·白图泰《游记》的全本（正文写成“我家那本全的”，不说来历）。
# 与简报的出入：港名按专名冻结写“基尔瓦”（简报作“克卢瓦”）；B1 简报写“第七周”，与一周一页、九月才到的时间对不上，
#       改为“补到第三十一页”；C2 标题改为“蹭花的半行”，避开阿米娜线的“墨未干”；A2 的盒盖字与标题改为“过期不退”，
#       因为莱拉线（bond_leyla_fincan）的 A2 已用“天热，三天内吃完”与“盒盖上的炭字”；重逢不写“先办完客人的事再叙旧”。
# 口头禅：cast 里的“缺哪页，先写在头一页上。”只在 S 用一次；C1 的交易条件是她自己的话（每周一页、照原本补），不照搬简报旧句。
# 秘密：残本定价低得出奇的原因（“我想让你每周都来”），只在重逢正文与重逢 default 的来信里说出；本文件的章都没有 stage，不写任何见闻。
# 缺省走向：每章 default 照走下一章、没有收获；S 不选 → 开重逢并记 c7_bond_zubayda_parted；
#       重逢错过 → 她寄来一页补抄的书，最后一行不是书里的话（来信），记 c7_bond_zubayda_missed。
# 设的旗标：c7_bond_zubayda_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed。不读外部旗标。
# 与 tie_zubayda_amina 的衔接：那条线 1557 年起阿米娜的抄本页尾都署名；本线 B2（1555）只是第一本，重逢（1564）时已成常例。
# 日程：不需要改。

[[tracks]]
key = "bond_zubayda"
