reply = "她看了我很久。然后转身拉开柜子最底下一格，取出一张书页，纸已经有点黄了，四边裁得整整齐齐，一个字也没有。她把它铺在柜台上，压上镇纸，又把笔和墨推到我手边。“这一页不用每周补，”她说，“一次写完。”我问写什么。“当年说了，那时候再告诉你。”她靠在柜台边上，“现在就是那时候。你想写什么，就写什么。写坏了，这回不加价。”我写了很久。写我母亲排在席子上的砝码，写基尔瓦塌了半边的城墙，写每一条往北开的船，写我在每封信末尾写了又划掉的那一句。最后一行，我写的是她的名字。她拿起来看，从第一行看到最后一行，看完没说话，把纸放下，探过身来吻了我。柜台上的灯芯噼啪响了一声。楼梯上有人下到一半，又轻手轻脚地退了回去。"
