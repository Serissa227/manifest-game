next = "a2"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "bond", person = "zubayda", level = "B" }]

[[tracks.chapters.choices]]
key = "tell_kilwa"
text = "反过来，给她讲一个基尔瓦的故事。"
reply = "我讲的是我母亲。她在我三岁那年死了，我记得的只有一件事：她把称金子的砝码在席子上排成一排，一个一个教我认，认错了，就拿最小的那个轻轻敲我的指头。我讲的时候一直在笑，说她敲得一点也不疼。祖贝达把手里的饼放下了。“这个，”她说，“你得写下来，补在书里。”我说那得补好多页。“那就接着来。”她说，“账本上给你另开一行。”"
next = "a2"
effects = [{ kind = "affinity", person = "zubayda", value = 3 }]

[[tracks.chapters]]
key = "a2"
title = "过期不退"
text = "书补齐的那一周，最后一页是我抄的。祖贝达拿针线把它缝进去，打了个结，咬断线头。第二天她提着一只小木盒来住宿区找我，门房拦着不让进，她就站在门口喊我的名字，喊得整个院子的窗户都探出头来。盒子里是糖熬的无花果，一个挨一个码得整整齐齐。盒盖上用炭写着一行字，又快又利索，跟她记账一个手笔：“糖无花果一盒，不收钱。三天内吃完，过期不退。”“我自己熬的。”她说，“书补完了，你下周就没理由来了。”她把盒子塞进我手里，“这一盒，够你吃三天。”说完她也不走，也不看别处，就站在门房那条板凳旁边，看着我，等我说点什么。"
