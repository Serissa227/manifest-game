[[tracks.chapters.choices]]
key = "own"
text = "约好她开她的书铺、你跑你的金子，十年后比谁的名字先被人记住。"
reply = "“书铺的名字，”她马上接上，“会写在每一本书的最后一行。卖到大马士革，卖到非斯，人家翻到底都看得见。”我说金子上也能留名字，基尔瓦的苏丹从前就把名字铸在钱上。“钱会熔掉，”她说，“书会被人抄。”我说抄书的人要是把名字抄错了呢。她噎了一下，随即把账本翻到最后，写下一行：“十年后，比名字。”底下签上她的，又把笔递给我。我签了，签得比她大一号。她拿笔杆戳着我的名字：“字大不算赢。”说完把账本往柜台里一收，上了锁，钥匙挂回脖子上，“十年。到时候少一年都不算。”"
