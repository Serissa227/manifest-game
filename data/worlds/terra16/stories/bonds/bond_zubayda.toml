reply = "我在废纸上试了四回，最后写的是：“此书由书铺之女阿米娜手抄，一字一校。”祖贝达把“一字一校”改成“逐字校过”，说买书的人认这个说法。阿米娜在窗下把那行字誊上去，誊完把笔一搁：“随便。”那本书上架三天就卖了，比同一架上的都快。买主是法官家的书记，付钱时指着最后一行说：“有名有姓的，靠得住。”祖贝达把这句话原样学给她父亲听，学了两遍。"
next = "a1"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "bond", person = "zubayda", level = "B" }]

[[tracks.chapters.choices]]
key = "buy_first_copy"
text = "说署了阿米娜名字的这一本，你买，你第一个买。"
reply = "祖贝达攥着我的定钱进了里屋。隔着帘子，我听见她跟她父亲说：“已经有人要了，人家点名要有抄书人名字的。”她父亲咕哝了半天。第二天书交到我手里，最后一行写着“抄书人阿米娜”，墨还亮着。付钱的时候我照例砍价，砍下来两个铜子。祖贝达把那两个铜子单独拿布包了，说要拿给姐姐。"
next = "a1"
effects = [{ kind = "affinity", person = "zubayda", value = 3 }]

[[tracks.chapters]]
key = "a1"
title = "先开口"
text = "收摊的时候，我照例去翻账本，看我名字后面还欠几页。祖贝达伸手把账本合上了。“下周，”她说，“你能不能不为了缺页来？”我愣在那儿，手还按在账本封皮上。她自己先笑了，从柜台底下拿出一块拿布包着的饼，掰成两半：“先吃点东西。坐。”我们坐在书铺的屋檐下。街对面卖蚕豆泥的担子在收摊，铜锅敲得叮当响。她讲今天的读者：一个瞎了眼的老人，每月来一回，让她把一整本诗从头念到尾，念到他喜欢的地方，就拿拐杖敲地，敲几下，就要她再念几遍。“今天敲了十一下，”她说，“我嗓子都哑了。”我张嘴想讲一段海上的事接她的话，她摆摆手：“你的船，留着下回。今天我讲，你听。”她讲到天黑，饼吃完了，屋檐下的灯是她起身去点的。"
