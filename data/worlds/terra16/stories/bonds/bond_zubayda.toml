[[tracks.chapters.choices]]
key = "wait_for_ink"
text = "以后每抄完一页，就坐着等墨干透再交给她。"
requires = [{ kind = "affinity", person = "zubayda", ge = 20 }]
hint = "她还当你是个毛手毛脚的南方金商家的孩子，不会搬凳子陪你干坐着等墨干。"
reply = "等一页墨干，要一盏茶的工夫。头一回我干坐着；第二回她搬了张凳子坐到对面；第三回就聊开了：基尔瓦的房子拿什么石头砌，开罗的纸为什么一年比一年贵，隔壁书铺的老板怎么把同一本《卡里来和笛木乃》卖了三回。一页墨干的工夫，半条书商街的闲话都让我们说完了。“下周早点来，”她临走说，“隔壁那本书第三回卖给谁，还没讲到。”"
next = "b1"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "bond", person = "zubayda", level = "C" }]

[[tracks.chapters.choices]]
key = "blot_it"
text = "问她借一把吸墨的细沙，图个快。"
reply = "她从柜台底下摸出一只小陶罐，往我面前一顿：“沙子也记账。”我抓了一大把撒下去，撒多了，沙子溅了一桌，钻进全本的书缝里。她骂了一声，蹲下去捏着书脊一下一下往外抖，抖着抖着自己先笑了：“下回撒半把。半把就够。”"
next = "b1"
effects = [{ kind = "affinity", person = "zubayda", value = 3 }]

[[tracks.chapters]]
key = "b1"
title = "基尔瓦的那一页"
text = "补到第三十一页，正好补到掉了的那三张。全本上，伊本·白图泰说基尔瓦是世上最美、建得最好的城之一，屋顶搭着红树的木杆；苏丹出手大方，有个人当面讨他身上的衣裳，他就脱下来给了。“我要是生在那时候，”我一边抄一边说，“天天去讨，一天换一身，迟早让苏丹光着膀子上朝。”祖贝达笑得拿账本拍柜台：“你这么讨，苏丹早把你扔进海里了。”我接着往下抄，抄到那些房子，笔停了。我见过基尔瓦现在的样子：城墙塌了半边，港口立着葡萄牙人的堡子，好些院子里长着草。五十年前他们的船进了港，城被抢、被烧，苏丹连夜跑了。书上这一页，写的是一座已经没有了的城。笑话讲不下去了，一滴墨落在纸边上。祖贝达没说话。她起身把柜台上那盏灯端过来，搁在我手边，拨亮了灯芯，又坐回去低头翻账本，一页也没翻过去。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "cairo"
cast = ["zubayda"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

