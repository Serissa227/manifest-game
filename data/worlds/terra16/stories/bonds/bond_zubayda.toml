[[tracks.chapters]]
key = "c1"
title = "缺页的书"
text = "书商街拐角那家书铺，门楣上挂着一串麻绳穿起来的旧书页，风一吹哗哗响。我在架子最底下翻出一本伊本·白图泰的《游记》，书脊开了线，往后一翻，一叠一叠地缺页。我先找东非那一段：摩加迪沙在，蒙巴萨在，再往后——基尔瓦没了，连着掉了三张。“一共缺一百一十七页。”柜台后面的女孩头也不抬，拿芦笔在账本上点着数，“我数过两遍。”她叫祖贝达，书商的小女儿。她报了个价，低得我差点以为这书是偷来的。“条件是，每周来铺子里补抄一页，照我家那本全的抄，从头一处缺的补起，按页码来。”我说我只要基尔瓦那三张，先补那三张行不行。“插队加价。”她把书推到我面前，这才抬眼看我，“每周一页，照着原本补，别拿几句好听的凑数。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "cairo"
cast = ["zubayda"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_cairo_azhar" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "take_the_deal"
text = "成交，约好下周这个时辰来抄第一页。"
reply = "她翻开账本，在一长串欠账底下另起一行，写上我的名字，后面跟着“每周一页”。“少来一周，加价。”我说那她得把全本留好，别哪天让人买走了。“全本比你金贵，”她吹了吹墨，“卖谁也不卖你。”"
next = "c2"
effects = [{ kind = "affinity", person = "zubayda", value = 3 }]

[[tracks.chapters.choices]]
key = "why_so_cheap"
text = "问她：这本书为什么卖得这么便宜？"
reply = "“因为它缺页。”她脸上一点表情也没有。我说缺页的书我见得多了，没见过这个价的。她把书往我怀里一塞，书脊上掉下一截线头：“要不要？不要的话，门口那个也门人已经看了它三天。”我抱着书没撒手。她低头记账，嘴角动了一下，没让我看清。"
next = "c2"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }]

[[tracks.chapters]]
key = "c2"
title = "蹭花的半行"
text = "第一回补抄，祖贝达让我坐在柜台后面那张矮桌边，全本摊在左手，残本摊在右手。我抄得飞快，抄完一页，捏着两个角就举起来给她看。墨还没干，顺着纸往下淌，蹭了我一手，也把最后半行蹭成了一团黑。我抬起袖子就要擦。“别动！”她一把按住我的手腕，从柜台底下抽出一张干净纸，“袖子一擦，这一页就废了，纸钱记你账上。”我说不就半行字，读的人猜也猜得出来。她没答，朝门口抬了抬下巴。门口排着三个人：一个学生，一个抱孩子的妇人，一个拄拐的老人，都是来借书回去抄的。“你的急，”她说，“不能让他们再猜一遍那半行写的是什么。”我把那一页重抄了。这回抄完，我没敢举起来。她也不收，就站在桌边，看着墨一点一点由亮变暗，才伸手把纸拈走。"
