[[tracks.chapters]]
key = "reunion"
title = "书铺留着灯"
text = "1564 年我回到开罗，天已经黑了。书商街的铺子都上了门板，只有祖贝达家的还亮着灯。我推门进去，她趴在柜台上记账，听见门响，头也不抬：“打烊了，明天——”抬眼看见是我，笔掉在了账本上。她领我到柜子前面。柜子里一格一格码着我的信，最早的一封在最上面，纸边都黄了。“按收到的次序放的，”她说，“不按你写的日期。海风把先后弄乱了，你前年写的一封，比大前年写的先到。”楼上抄书房的窗子早黑了，阿米娜天一黑就收笔；她今天抄完的那本搁在柜台一角，最后一行写着她自己的名字。我问起那本缺页的游记，问她当年为什么卖得那么便宜。这回她没说“因为它缺页”。“我想让你每周都来。”她说，“我父亲问起来，我说是清旧货。”说完，她把柜门关上一半，又拉开了。"
window = [[1564, 1, 1], [1564, 12, 31]]
at = "cairo"
cast = ["zubayda"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1564, 1, 1], to = [1564, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "zubayda", text = "（一页书。正面是伊本·白图泰写基尔瓦的那一段，字是祖贝达的，抄得一笔不错。翻过来，背面接着写：）巴拉卡：今年开罗的船都到齐了，你没到。我不骂船了，船没错。书铺换了招牌，新招牌底下多一行小字：缺页必注。上个月来了个大马士革的书商，买书前问我缺不缺，我把头一页翻给他看，从第几页缺到第几页，写得清清楚楚。他说他跑了二十年书市，头一回见卖书的自己招认，一口气买了三本。姐姐抄的书都署名了，父亲如今逢人就说是他的主意。随他。你的信我都留着，按收到的次序。上一封是蒙巴萨来的，说那边金价跌了，说你跟一个葡萄牙人砍价，砍到他请你吃饭。笑话照旧多。每封信我都一个字一个字抄进那本书后面，已经订进去第三张了。这一页是补给你的。正面是书上的话，你从前抄过。最后一行不是。（最后一行，字比上面的都小：）当年那本书卖你那么便宜，是想让你每周都来。现在你知道了。下回来，照原价付。" }, { kind = "flag", flag = "c7_bond_zubayda_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "留下来，跟她把那些迟到的信按写下的日期重排一遍。"
reply = "她又点了一盏灯，我们把信全摊在柜台上。我的字她认得比我自己还熟：哪封是在船上写的，墨让浪晃过，一行高一行低；哪封是在蒙巴萨的客栈里写的，纸上有一圈茶碗印。我记得的日子好些对不上，她就翻账本，每封信哪天到的都记着，旁边还有一句批注：“短。”“又是笑话。”“这封好。”理到半夜，剩下三封怎么也排不出先后。我写的时候没落日子，她收到时又偏偏是同一条船捎来的。“那就按收到的算。”她说。我说那这三封就算她的，不归日子管。她笑了，把三封信叠齐，拿一根装订线捆好，单独放进柜子最上面那一格：“那这一格，归我。”她把柜门关严，钥匙在锁眼里拧了一圈，转过身来问我，明天还来不来帮她理剩下的账。"
