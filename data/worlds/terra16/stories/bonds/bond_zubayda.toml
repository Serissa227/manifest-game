requires = [{ kind = "affinity", person = "zubayda", ge = 50 }, { kind = "bond", person = "zubayda", level = "C" }]
hint = "那位老人是她的老主顾，他的诗她还不放心交给你——你连他爱听哪几句都还不知道。"
