reply = "“那饼钱你出。”她说得很快，说完拿手里那半块饼挡了一下脸。下一周我去，屋檐下已经摆好了两块饼，一块撒了黑籽的，一块椰枣馅的，就是上回我在饼铺门口多看了一眼的那种。我没说过我爱吃椰枣馅。她也没问。"
