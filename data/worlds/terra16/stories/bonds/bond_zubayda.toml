[[tracks.chapters.choices]]
key = "promise"
text = "约好每逢有船就写信来，信里补一页基尔瓦。"
requires = [{ kind = "bond", person = "zubayda", level = "A" }]
hint = "每逢有船就补一页——这是要补一辈子的。你们的交情还写不满这本账；要么，这样一辈子的信，你已经答应写给另一个人。"
reply = "“补的是基尔瓦，”她说，“笑话不收。”我说一个笑话也不写，那信会很短。“短就短，”她说，“短的我也按页算。”她从柜台下抽出一张纸，裁成手掌宽的一条，写上书铺的地址、她父亲的名字、她的名字，又在最底下写了三个港口：苏伊士、吉达、亚丁。“信从哪儿上的船，你在封皮上写清楚。哪条船慢，我好去骂。”我把纸条叠好，塞进装砝码的黄铜小箱，压在最重的那个砝码底下。她看见了，没说什么，翻开那本补齐的游记，翻到基尔瓦那三张。后面果然订进了一张新纸，还没落一个字。“这一页，我替你留着。”她把书合上，“你的信到一封，我就抄一段上去。抄满了，我再订一张。”"
next = "done"
effects = [{ kind = "bond", person = "zubayda", level = "S" }, { kind = "relation", person = "zubayda", relation = "friends" }, { kind = "memory", memory = "mem-bond_zubayda-s", title = "每周以外" }, { kind = "flag", flag = "c7_bond_zubayda_promise" }, { kind = "start_track", track = "reunion_zubayda" }]

[[tracks.chapters.choices]]
key = "heart"
text = "什么也不说，等她先开口。"
requires = [{ kind = "bond", person = "zubayda", level = "A" }, { kind = "heart", person = "zubayda", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "zubayda", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "zubayda" }]
hint = "她在等，你却接不住这份沉默：要么你们还没走到这一步，要么同样的话，你已经许给另一个人了。"
reply = "我没答。祖贝达等了一会儿，见我不开口，自己把账本合上了。“那我先说。”她说，“那本书，最后还有一页，我一直没让你补。”我说书不是补齐了吗，最后一页是我抄的，她缝的。“那是书的最后一页，”她说，“不是我留着的那一页。”她看着我，“等你长成大人，回开罗来，把那一页补上。”“写什么？”“那时候再告诉你。”她的手伸过来，握住我的手，握得很紧，手心里有墨，也有一点熬糖留下的黏。我们就在书铺门口站着。街上的灯一盏一盏点起来，隔壁书铺的老板出来上门板，看了我们一眼，又缩回去了。走的日子，她没提，我也没提。站到灯全点亮，她才松开手，转身进了铺子，在门里说：“走吧。船到了，记得写信。”"
