[[tracks.chapters]]
key = "s"
title = "每周以外"
text = "十二月里，父亲从基尔瓦捎来口信，叫我赶这一季的东北季风回家。往后，我再不能每周来书铺了。我去告诉祖贝达。她没吭声，把账本翻到我那一行：“巴拉卡·宾·萨利姆，每周一页。”底下密密麻麻记着日子，少来的那几周后面都写着“加价”，一回也没真加过。她提起笔，把“每周一页”划掉，在旁边写：“每逢有船。”“我想好了，”她说，“以后姐姐抄的书，最后一行都写她的名字。我们卖出去的每一本，缺哪几页、从第几页缺到第几页，写得明明白白，一页也不瞒。缺哪页，先写在头一页上。”她一口气说完，把笔搁下，“书铺的事，我讲完了。你呢？你想要什么？”"
