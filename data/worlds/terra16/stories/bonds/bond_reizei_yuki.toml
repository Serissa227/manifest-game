# B1：1554 年秋，宫中歌合，三条西公条判。一张写着判词的纸。
[[tracks.chapters]]
key = "b1"
title = "歌合的判词"
text = "秋天宫里办歌合，请三条西公条做判者，题是“月前风”。我和雪分在左右两方，各出一首。判词当场念出来，右方胜。念到我的歌，判者把纸放低，看了我一眼：“气太盛。风还没起，先把月亮吹跑了。”女房们低低地笑，右方那一排已经在分胜者的点心。我跪坐着，扇骨在手心里攥得咯吱响，眼睛不往右边看。散了席，雪来找我，手里拿着那张抄好的判词。她脸上一点得意也没有，在我对面坐下，扇子扇得飞快：“你交上去以前，删过一句吧。原来是怎么写的？”十一月的天，她扇得额头上出了汗。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "kyoto"
cast = ["reizei_yuki"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

