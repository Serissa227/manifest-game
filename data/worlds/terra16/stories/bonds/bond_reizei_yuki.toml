# A1：1555 年七夕（学院校历 1555-08-04），宫中乞巧奠。象征银河的白绢。
[[tracks.chapters]]
key = "a1"
title = "流之座"
text = "七月初七，宫里办乞巧奠。庭前摆着供台，铜盆里盛满了水，好照星星。女房们在殿里坐成两排，当中垂下一道长长的白绢，算作银河。和歌写在纸上，从绢底下推过去，那边的人接了，写回一首再推回来，这叫“流之座”。我写了一首推过去，跪坐着等。灯在绢那边，照出一排低着头的影子。纸推回来了。那笔字我认得，瘦，硬，收笔像刀。我的歌一个字也没被划，后头只接了一句，接得很轻，银河那边有人应了一声。绢底下传过来一句，压得很低：“别念出声。”正对着我的那个影子还低着头，笔没放下。旁边的女房凑过来问：“谁写的？”我把纸折起来，压在膝下：“不告诉你。”白绢那边的灯挪了一下。"
