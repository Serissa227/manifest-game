# C1：1554 年春，宫中女房的小歌会。一张被划掉一半的短册。口头禅在这里原样出现，全文件仅此一次。
[[tracks.chapters]]
key = "c1"
title = "删掉的一半"
text = "上京还不到一个月，女房们在局里办小歌会，题是“春海”。我在短册上写得满满当当：土佐的浪，下田的船，退潮时满滩的螺，一个字也舍不得少。短册传到冷泉家的小姐手里。她只看了一眼，提笔就把后半首划了，一道，又一道，划得干干净净，才递还给我：“这句删了，剩下的才听得见。”满屋子的女房都拿袖子掩着嘴笑。有人小声说：“土佐来的姬君，歌也是一船一船运来的。”我捏着短册，指甲在纸边掐出了印子，差一点当场撕了。那晚我对着灯看。后半首压在墨杠底下，前半首一个人站在纸上，一句浪，一句船，没了后头那一大串，倒真听得见水声。我把灯芯挑高了些，越看越气：她划对了。"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["reizei_yuki"]
speaker = "captain"
mood = "tense"
when = [{ kind = "flag", flag = "family_access_kyoto_court" }, { kind = "date", from = [1554, 3, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "rewrite_defiant"
text = "第二天重写一首，偏把她划掉的那半首写回去，摊在她面前。"
requires = []
reply = "我把那半首一字不改写了回去，还多添了一句，墨磨得浓浓的，当着她的面摊开。她从头读到尾，提笔又划，这回划得更快，划完在旁边添了三个小字：“还是多。”我气得在廊板上跺了一脚，满廊的女房都回过头来。她又划了一道，划的是我添的那一句。"
next = "c2"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 2 }]

[[tracks.chapters.choices]]
key = "ask_why"
text = "去她的局里问个明白：被划掉的那半首，到底哪里不好。"
requires = []
reply = "她让我在对面跪坐下。我说螺是下田的螺，船是我家的船，满滩是真满滩。“满滩是真满滩。”她把我的话说回来，删掉了一半，“螺不该进歌，船不该一条条数，‘满滩’两个字是鱼市上的吆喝。你的海写得太吵。海本来就吵，用不着你替它喊。”我回去改了一夜，改到灯油见底，第二天交上去。她拿笔从头划到尾，划掉的比留下的多，划完在旁边添了三个小字：“这回近。”"
next = "c2"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 3 }, { kind = "skill", skill = "poetry", value = 8 }]

# C2：1554 年夏，雪的局里。一本被浪打湿过、满是她批注的《古今集》。
[[tracks.chapters]]
key = "c2"
title = "泡过水的古今集"
text = "我从土佐带上京的那本《古今集》，在船上叫浪打湿过一回，晒干以后纸页一张张起了皱，翻起来哗哗响。为了卷头那首年内立春的歌，那一年的春天该算去年的还是今年的，我抱着它去找雪。她翻开，眉头皱得比纸还紧：“这书是从海里捞上来的？”“是从海上带来的。读法也是从海上带来的。”“读法也是。”她只留了这三个字，提笔在页边写了一行小字。我指着原文驳回去，她又写一行。从午后辩到女官来点灯，砚台添了两回水，谁也不肯认输。灯点上了，她把书合上，又翻开，在我那一页的纸背上，把我的读法也工工整整写了进去。写完，她把笔往笔架上一搁：“明天接着辩。”那本书在她案上放了一夜。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "kyoto"
cast = ["reizei_yuki"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

