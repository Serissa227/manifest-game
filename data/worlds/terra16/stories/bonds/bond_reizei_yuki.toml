requires = [{ kind = "affinity", person = "reizei_yuki", ge = 20 }]
hint = "情谊 20。她刚赢了你，这时候凑过去问，她只当你要说她赢得不公。"
reply = "我念了。她听完点点头，说删得对，又说删得可惜。轮到她，她犹豫了一阵，才拿扇尖点了点自己的第三句。我说那里的“露”字压住了月光，她马上点头，点得很快，早就知道、只等人说出来的样子。我们把判词翻过来，在背面各写了一句，一句“我服”，一句“我不服”。哪一句是谁写的，判者不知道，满屋的女房也不知道。"
