# 冷泉雪：删掉的一半（bond_reizei_yuki）+ 给远客的一页（reunion_reizei_yuki）——羁绊线，标签 GL：
#   冷泉雪 romance = ["f"]（pure_gl），与女主角一条澪可走恋爱落点；也是澪在宫中歌会上的对手。
# 走向：改她→等她（想把她变成另一个人：留在京都，把海写安静；从头一章起就是“改你”，不冷）。
# 人物：冷泉雪（reizei_yuki，1540-02-04 生），歌道冷泉家的小姐。
#   声音（手册 3.11）：短，可她的短是删出来的——你说一句，她把你的话原样说回来，删掉一半；只删字，从不挑礼数（礼数归菖）；
#   生气是不删了，原样退回；高兴是删得更狠，划完在旁边添三个小字；说谎用季语岔开。不说“我输了”（她说“这句删了”），不说海好（她说海“吵”）。
#   耳朵红从她身上拿掉。称呼：叫澪“土佐的那位”→“一条”→信里“中君”；不回下向土佐那封信的局，改称“一条殿”。
#   口头禅：“这句删了，剩下的才听得见。”全文件只在 c1 原样出现一次（手册示范 1）。
#   主角：一条澪（mio，1540-06-21 生），土佐一条家的长女；第一人称“我”。三条西公条只在 b1 做判者、说一句判词，不进 cast。
# 年龄：c1（1554 春）两人 14；a1（1555-08 七夕）两人 15；s（1556-12）两人都 16，心动选项只到牵手；重逢 1563 年两人都 23。
# 依据：
#   史实——七夕乞巧奠与“流之座”；三条西公条常做歌合的判者；冷泉家与骏河今川家有歌道往来；紫式部与女友互称“姐君”“中君”（《紫式部集》）；
#         一条房通卒于 1556 年冬；1560 年桶狭间之战今川义元战死；公家下向大名处授歌在当时是常事。
#   原创——全部情节与物件：被划掉一半的短册、泡过水的《古今集》、判词背面的“我服 / 我不服”、断成两截的笔与八十首的私集、
#         桧扇上抄的接句（主线 c05 的 yuki 变体读它）、联句小卷（poetry_scroll）、写着“姐君”的信、1561 年冈丰的来信、歌集最后一页给远客的那一行。
# 新加（C21b；手册第九节第 3 条、裁决第 1 条、研究 3.3 第 12 场）：
#   reunion_reizei_yuki 的起点改成 okou（1561 春，雪来信问去不去冈丰给长宗我部家的女眷授歌）：
#   tell_go（她去了，冈丰从此有一个替澪说话的人，一条家的旧臣骂澪）/ tell_stay（她不去，冷泉家这一年没进项，歌稿推迟付印）/
#   缺省不回信（她去了，信里改称“一条殿”）。旗标 c7_bond_reizei_yuki_okou_go / _okou_stay / _okou_silent，重逢的变体读。
#   瞒不住（手册第六节）：许过两份以上心意的局（_romance 且 c7_mio_heart_2），okou 那封信换成 count 变体，她先问数：
#   “那封写着姐君的信，你写了几封？”answer_true（照实答，情谊 -4，她去冈丰、改称“一条殿”）/ answer_one（答“一封”，设 _lied，她去冈丰）/
#   不答、只答冈丰的事（go / stay / 缺省）也算答了。重逢时流之座的位子都已撤了（lied 变体：她从堺的商人那里知道了），不和解；
#   重逢的 love 要求她是唯一的一份（c7_mio_heart_2 为假）。原想单开一条 1557 年秋的小轨道，因英文覆盖的闭合校验（新轨道要整条英文）改并进 okou。
# 关系会退（C21b）：b2 ask_why_not 改成澪花钱去打听，雪把点心钱包好还回来，情谊 -3，不和解；okou 的 answer_true -4。
# 心意（数值见 docs/BALANCE.md）：心动来源 a1 write_only_for_her +6、a2 call_her_sister +6、课后同行。
#   heart（头一份：心动 ≥ 12，带 bond S）/ heart_second（已许一份：心动 ≥ 18、口才 eloquence ≥ 5）/
#   heart_third（已许两份及以上：心动 ≥ 26、口才 ≥ 7、当面叫过“姐君” c7_bond_reizei_yuki_sister）。信物是那封写着“姐君”的信。
# 羁绊阶梯：c2 / b1 给 C；b2 / a1 给 B；a2 前两个选项给 A + 联句小卷 + 回忆；s 的 promise / 头一档 heart 给 S。
# 缺省走向：c1 → … → s（default：开重逢，记 parted）→ 1561 okou（default：不回信）→ 1563 重逢（default：雪寄来一封信，记 missed）。
# 设旗标：c7_bond_reizei_yuki_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed /
#   _sister / _okou_go / _okou_stay / _okou_silent / _lied；c7_mio_heart_1 / _2 / _3；
#   c7_pair_ushio_reizei_yuki_taken（s 的 promise 与三档 heart 设）。主线 main_mio 读 _promise（键不变）。
# 读旗标：okou 与重逢的 variants 读 c7_mio_heart_2、c7_pair_ushio_reizei_yuki_together、本文件的 okou 旗标与 _lied；love 落点读 _romance 与 c7_mio_heart_2。
# 日程：不改。1561 年冈丰之行是故事里的出行，cast 日程照旧在京都。

