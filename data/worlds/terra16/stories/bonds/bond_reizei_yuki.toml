key = "answer_one"
text = "在那一截空白里写：一封。冈丰，去。"
requires = [{ kind = "flag", flag = "c7_bond_reizei_yuki_romance" }, { kind = "flag", flag = "c7_mio_heart_2" }]
hint = "只在她来信问数的时候。"
reply = "我在那一截空白里写了“一封”，两个字，写得端端正正，旁边写了一个“去”。她去了冈丰。入夏她来信，抄了一首今年的歌，后半首照例划掉了，旁边添着三个小字：“还是多。”信的末尾仍称我“中君”。"
next = "reunion"
effects = [{ kind = "flag", flag = "c7_bond_reizei_yuki_lied" }, { kind = "flag", flag = "c7_bond_reizei_yuki_okou_go" }]

# 重逢：1563 年，冷泉家授歌的屋子。她歌集最后特意留下的一页。
# variants（取第一个对上的）：lied → told（照实答）→ seat_removed（问了数、没答）→ stayed（歌稿没印出来）→ silent（不回信，“一条殿”）→ went（叫她去了）→ with_ushio。
[[tracks.chapters]]
key = "reunion"
title = "给远客的一页"
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。雪在里间授歌。五六个女孩跪坐成一排，一人面前一张短册。她提笔在一个孩子的歌上划了一道，那孩子咬着嘴唇，眼圈都红了。雪抬头看见我，笔停在半空。她叫学生们先散了，等最后一个孩子出了门，才开口：“晒得像个船夫。”她从架上取下一册书递给我。是那年要付印的歌稿，印出来了，封面上题着她的名字，“冷泉雪”三个字写得大。她一页一页往后翻，翻到最后一页。那一页上没有歌，只在页角有一行小字：给远来的人。她把笔递给我，笔杆上缠着一圈旧线：“海上的歌，拿来我听。”砚里的墨是新磨的，还温着。"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "kyoto"
cast = ["reizei_yuki"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "reizei_yuki", text = "今年你没有来京都。你的船在哪一片海，我向堺的商人打听过两回，两回说的不一样，我就不再打听了。歌稿印出来了。印坊的人把我的名字刻得太小，我叫他们重刻了一回。最后一页我没让他们刻歌，只在页角写了一行，给远来的人。今年没有远来的人，那一页就先这么放着。我有了学生，五个，都比当年的你规矩，也都比你写得差。有个孩子把歌写得满满当当，我替她划了半首，她哭了一下午。第二天她拿来一首新的，前半首站得住了。宫里的七夕还办，白绢那边换了好几回人，接歌接得都很客气。你在海上要是写了歌，好的寄来，我替你删；写得不好的，我替你收着，等你回来当面笑你。今年这一首写得不好，我没有划，一并附上。冷泉雪。又及：坏歌也寄来。" }, { kind = "flag", flag = "c7_bond_reizei_yuki_missed" }]

[[tracks.chapters.variants]]
key = "lied"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_lied" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。雪在里间授歌，五六个女孩跪坐成一排。她抬头看见我，笔没停，把那个孩子的歌划完了，才叫学生们散了。“晒得像个船夫。”她从架上取下那册印好的歌稿，翻到最后一页，页角一行小字：给远来的人。她没把笔递给我。“堺的商人话多，”她说，“哪年哪月，谁家的船捎过几封写着姐君的信，他们记得比我清楚。你那张纸上写的是一封。”她把书合上，“流之座上那个位子，我前年撤了。席子空着，女官每年问一回，我懒得答。”那册书她放回了架子最高的一格。"

[[tracks.chapters.variants]]
key = "told"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_told" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。门房说小姐前年从冈丰回来，在长宗我部家教了两年女眷。雪在里间授歌，看见我，笔停在半空，叫学生们散了。“一条殿。”她这两年的信里也是这样写的。她取下那册印好的歌稿，翻到最后一页，页角那一行“给远来的人”还在，旁边空着的那一截，填了一首冈丰写的歌。她把笔递给我：“海上的歌，拿来我听。写在别的纸上。”她推过来的是一张冈丰的楮纸。"

[[tracks.chapters.variants]]
key = "seat_removed"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_romance" }, { kind = "flag", flag = "c7_mio_heart_2" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。雪在里间授歌，五六个女孩跪坐成一排。她抬头看见我，把那个孩子的歌划完了，才叫学生们散了。“晒得像个船夫。”她从架上取下那册印好的歌稿，翻到最后一页，页角那一行小字拿墨杠划掉了。“那年我问你一个数，你回信写了别的，那一截空白原样寄回来了。”她把书合上，“流之座上那个位子，我那年就撤了。”她把笔递给我：“海上的歌，拿来我听。”外头的学生在廊下等着，有一个探头看了两回。"

[[tracks.chapters.variants]]
key = "stayed"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_okou_stay" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。雪在里间授歌。五六个女孩跪坐成一排，一人面前一张短册，短册是旧纸裁的，背面还看得见别人的字。雪抬头看见我，笔停在半空，叫学生们先散了。“晒得像个船夫。”她从架上取下一叠订起来的稿子，没有封面。“印坊说明年。前年也说明年。”她把稿子翻到最后一页，那一页上没有歌，只在页角有一行小字：给远来的人。她把笔递给我，笔杆上缠着一圈旧线：“海上的歌，拿来我听。”订稿子的线断了一处，她拿指头压着。"

[[tracks.chapters.variants]]
key = "silent"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_okou_silent" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。门房说小姐前年去了土佐的冈丰，在长宗我部家教了两年女眷，开春才回来。雪在里间授歌，看见我，笔停在半空，叫学生们先散了。“一条殿。”她这样叫我，这两年的信里也是这样写的。“冈丰的米是好米。”她从架上取下那册印好的歌稿，封面上题着她的名字，翻到最后一页，页角一行小字：给远来的人。她把笔递给我：“海上的歌，拿来我听。”门外有人叫“一条殿的船到了没有”，是堺来的脚夫。"

[[tracks.chapters.variants]]
key = "went"
when = [{ kind = "flag", flag = "c7_bond_reizei_yuki_okou_go" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。门房说小姐前年去了土佐的冈丰，教了两年女眷，开春才回来。雪在里间授歌，案上放着一包冈丰的米，袋口拿草绳扎着。她看见我，叫学生们散了。“晒得像个船夫。冈丰的女眷问起你，问得比她们家的主人还细。”她取下那册印好的歌稿，翻到最后一页，页角一行小字：给远来的人。她把笔递给我：“海上的歌，拿来我听。”冈丰那包米她叫人送去了厨下，说今晚煮。"

[[tracks.chapters.variants]]
key = "with_ushio"
when = [{ kind = "flag", flag = "c7_pair_ushio_reizei_yuki_together" }]
text = "七年后，我的船泊进堺，我走陆路上京，去了冷泉家。雪在里间授歌。五六个女孩跪坐成一排，一人面前一张短册。她提笔在一个孩子的歌上划了一道，那孩子咬着嘴唇，眼圈都红了。雪抬头看见我，笔停在半空，叫学生们先散了。“晒得像个船夫。”案上压着一封土佐来的信，字有点歪。她看见我在看，把信往书底下推了推，推进去一半。她从架上取下那册印好的歌稿，翻到最后一页。那一页上没有歌，只在页角有一行小字：给远来的人。她把笔递给我：“海上的歌，拿来我听。”那封土佐的信还有一半露在书外头。"

[[tracks.chapters.choices]]
key = "friend"
text = "在那一页写一首海上的歌，请她接下半首。"
requires = []
reply = "我写了上半首：夜里起风，帆吃满了，整条船都在响。写完自己读一回，还是吵。她接过笔，没划我一个字，在后头接了下半首。她接的是风停以后：船还在走，听得见水从船底下滑过去。她在页脚并排写下两个名字，她的在左，我的在右，又在我的名字上描了一笔：“你的字还是太潦草，我替你补一笔。”傍晚学生们回来上课，她把那一页翻给她们看，说这是她的歌友。有个孩子问，哪一半是先生写的。她说：“你猜。”"
next = "done"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 5 }, { kind = "relation", person = "reizei_yuki", relation = "confidants" }, { kind = "flag", flag = "c7_bond_reizei_yuki_landing_friend" }, { kind = "memory", memory = "mem-reunion_reizei_yuki", title = "给远客的一页" }]

[[tracks.chapters.choices]]
key = "rival"
text = "这一页先不写，约她到歌会上当着判者再比一回。"
requires = []
reply = "我把笔还给她：“这一页先不写。到歌会上，当着判者写。”“当着判者写。”她看了我一会儿，笑了：“还是要比。”她把那一页的页角折了一下，拿指甲压平。“那就十年。从你离京那年算起，一天也不许少。”“还有三年。”“还有三年，”她说，“够你把海写安静了。”她把书合上，放回架子最高的那一格，那一格只放着这一册。送我到门口时，她又加了一句：“判者我已经想好请谁了。你输了，别在人前跺脚。”我说输了我就回船上跺。她想了想，说那也算。"
next = "done"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 3 }, { kind = "relation", person = "reizei_yuki", relation = "rivals" }, { kind = "flag", flag = "c7_bond_reizei_yuki_landing_rival" }, { kind = "memory", memory = "mem-reunion_reizei_yuki", title = "给远客的一页" }]

# love：要她是唯一的一份（手册第六节：许过两份以上的局只能走 rival 或 friend）。
[[tracks.chapters.choices]]
key = "love"
text = "在那一页写一首只给她的歌，再向她要那封回信。"
requires = [{ kind = "flag", flag = "c7_bond_reizei_yuki_romance" }, { kind = "heart", person = "reizei_yuki", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "reizei_yuki", ge = 18 }, { kind = "romance_open", romance_open = "reizei_yuki" }, { kind = "flag", flag = "c7_mio_heart_2", value = false }]
hint = "要当年把那封写着姐君的信交给过她、心动 24，而且心意只许给了她一个人。"
reply = "我在那一页写了，一个浪字也没有，写的是七夕那一晚，白绢那边低着头的影子。写完我没有读，把书推了过去。她读完，拿笔在我的歌上划了一道，划掉的是“影子”两个字，旁边添了三个小字：“是我的。”她起身从书架上的漆匣里取出一封信，封皮磨得发软，上头是我的字：姐君。封口没拆过。“说好那天才拆。”她拆开了，里头是我十六岁的字。看完，她从匣子底下抽出另一张纸递给我，纸已经发黄：“回信。那年就写好了。”回信只有一句歌，接的是七夕那一晚我从白绢底下推过去的那一首。她那晚只接了一句；这是第二句。那晚冷泉家的廊下，院子里的灯一盏一盏熄了。她叫了我一声“中君”，不等我答，吻了我。"
next = "done"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 5 }, { kind = "relation", person = "reizei_yuki", relation = "lovers" }, { kind = "flag", flag = "c7_bond_reizei_yuki_landing_love" }, { kind = "memory", memory = "mem-reunion_reizei_yuki", title = "给远客的一页" }]
