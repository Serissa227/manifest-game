# B2：1555 年春夏，雪的局里。骏河今川家请冷泉家下向教歌的名单。一支被折断的笔。
[[tracks.chapters]]
key = "b2"
title = "骏河的名单"
text = "开春，骏河的今川家遣使上京，请冷泉家派人下去教歌。名单要誊一份正本交使者带回，冷泉家把这差事交给了雪。她在局里誊了一上午。名单上是她的叔父、她的堂兄，还有一个去年才元服的远房侄子。没有她。她一笔不乱地誊完，盖印，封好，交到使者的随从手里，还行了一个礼。傍晚我在隔壁的局里听见“啪”的一声。推门进去，她跪坐在案前，那支笔断成了两截，断口毛毛糙糙，墨顺着指缝往下滴。她看着我，声音平得像在念名单：“歌写得最好的人，不在名单上。”我还没开口，她又说：“把门拉上。”断笔的一截滚到了我脚边。"
