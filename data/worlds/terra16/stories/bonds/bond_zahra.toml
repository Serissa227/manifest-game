text = "讲席散了，老夫人回了内院，同门还围着不肯走。有人问领航世家的诗怎么念，我便念了外曾祖父的一句，记的是出了亚丁，北边那颗星该有几指高。念完，书堆后面抬起一个头来。是个比我还瘦的女孩，膝上摊着一卷抄本，纸边发黄，行间挤满了小字。她叫扎赫拉，是扎比德学者家的孙女。“你刚才那句，引错了两个字。”她把那两个字念出来，一个字一个字地念，好像怕我听不清。同门都笑了。我说我从小就是这么背的。她用指甲压住抄本上的那一行：“出处呢？”“伊本·马吉德的手稿，”我说，“在我母亲的嫁妆箱里。”她愣了一下，指甲还压在纸上，压得指尖发白。“那我要看。”"
