# S：1556 年 12 月。开年我随季风出海，她留在讲席上；她写了一张送书的路线，最后添上自己的名字。
[[tracks.chapters]]
key = "s"
title = "你记海，我记书"
text = "东北季风起了，开年我就要随船出海；扎赫拉要留在老夫人的讲席上，再过几年，她自己也要开讲。走之前的那个傍晚，她把一张纸摊在书案上，是一张送书的路线：吉达有谁替她收书，亚丁有谁替她送书，霍尔木兹的书商靠得住，坎贝的靠不住。每个港后面都写着人名，人名后面还注着那人是从哪里来的。最底下一行，是她自己的名字，写得比平时大。“书从这几处走，”她说，“你到了哪一港，就去问这几个人。”我把纸拿起来，从头看了一遍。“你记书，我记海。”她把笔在砚台边上刮了刮：“海里听来的故事，也得标出是谁说的。别拿一堆没来历的话回来糊弄我。”"
