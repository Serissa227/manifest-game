# 重逢：1564 年，摩卡港边清真寺的讲席。她已能自己发许可；递来的书四边留着宽边，写满了不同意我的地方。
[[tracks.chapters]]
key = "reunion"
title = "宽边的书"
text = "1564 年我回到摩卡。船刚靠岸，就有个学生来问我的名字，说是从扎比德来的，把我领到港边清真寺的讲席。扎赫拉坐在讲席上，已经能自己发传授许可了。学生从塔伊兹、从萨那、从哈德拉毛来，一排一排坐到门口，前排一个男孩正结结巴巴地背传述链。“慢点，”她对那个男孩说，“传述人又不会跑。”她看见了我，眉毛动了一下，没停，让那个男孩背完，又让后面三个学生把问题问完，才招手叫我过去。她递给我一本书。是我这些年从各港寄回来的航路诗和见闻，她让学生誊抄装订成册，四边都留着宽边，宽得像另一本书。宽边上密密麻麻全是她的字，一条一条，全是不同意我的地方，一页也没扔。“这一回，”她笑着问，“你又是从哪里听来的？”"
