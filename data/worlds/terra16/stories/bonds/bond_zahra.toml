key = "a2"
title = "传授许可"
text = "传授许可那一天，讲席里坐满了人，前头是扎比德的学者，后头是学生和来看热闹的商人，最后一排坐着拉妮娅。老夫人一个一个考问：问传述链，问字义，问哪一段和哪一段相抵。我和扎赫拉并排跪在她面前。扎赫拉答得一字不差；轮到我，她一个字也没替我答。“风，”老夫人说，“从头背。”是那段讲风的圣训。我张开嘴，头一个字卡在了喉咙里，满堂都在等。扎赫拉的手搁在膝上，袖子垂着。袖子底下，她的指尖在席子上敲了三下，一重两轻——是那一段头一个字的拍子。后面的话跟着就出来了。老夫人把两张许可交到我们手里。出了门，扎赫拉才笑：“你停的那一下，比海上没风的时候还长。”说着往我手里塞了一张折成小方块的纸。"
