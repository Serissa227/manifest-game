text = "老夫人让我们交一篇功课，讲一段圣训的字义。发回来时，我那一页的边上多了四行批评，字细得像针尖，一行挑一处，最后一行连我的标点也挑了。不用问，是扎赫拉。我没去找老夫人，抱着自己的航路诗去了她的书案：“照这个办法，也替我挑一挑。”她挑起来一点情面也不留，第一处是韵，第二处是一个星名的写法。挑到第三处，她的笔停住了：“‘扎姆’——字书里没有这个意思，是错字。”“船上一更就叫一扎姆，整条红海都这么叫。”“书上不这么写。”“海上就是这么走的。”她说的是书，我说的是海。最后我们各誊了一份带走，她那份边上留着我的字，我这份边上留着她的，都没擦。"
