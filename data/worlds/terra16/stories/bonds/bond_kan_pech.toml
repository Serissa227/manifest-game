[[tracks.chapters.variants]]
key = "v2_own"
when = [{ kind = "flag", flag = "c7_bond_kan_pech_own" }]
text = "这几年坎的信，一年两三封，每一封头一行都是两种日子，底下常常只说一件事：哪家的老人过世了，名字已经记下。一五六二年六月的那封只有一句：“我来科苏梅尔。别问。”信到的第三天他就到了，瘦了，穿着书记的黑衣裳，身后两个挑夫挑着三只箱子。马尼那边，修士在各村搜旧书，问不出来就把人吊起来问。他没先说别的，先数人：船主一个，桨手六个，我一个。数完，又从头数了一遍，才把箱盖封上。“送去哪儿？”“先送到还能教孩子认字的地方。往南，修士一年来不了一回的村子。”他抬头看天：“年尾那五天没名字的日子快到了。”"
