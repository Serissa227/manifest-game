# 坎·佩奇（bond_kan_pech / reunion_kan_pech）——C7 重写，2026-10-12，Claude（Opus）执笔；旧 GPT 稿作废，只沿用章节 key、地点与年份。
# 标签：friend（友情·羁绊线）。坎·佩奇不开放恋爱，全线只写友情与信义，不写心动选项，也不写心照不宣的段落。
# 人物：坎·佩奇 kan_pech（1539-12-16，男，romance 关闭）——尤卡坦玛雅贵族佩奇家的少年，梅里达方济各会学校内院的模范学生，修士派他管前院的名册；
#       伊希·妮克特 ix_nikte（1540-03-21，女，主角，“我”；学校名册上叫“玛丽亚”）——科苏梅尔独木舟商队首领的女儿，母亲是接生婆。
#       学院期 1554—1556：伊希 13—16 岁、坎 14—17 岁；重逢 1562 年两人都是 22 岁。
# 依据：
#   史实——玛雅的两种历：二百六十天的 tzolk'in（13 个数 × 20 个日名）与三百六十五天的 haab'（18 个月 × 20 天 + 年尾 5 个无名日 Uayeb）；
#         方济各会修士在尤卡坦用拉丁字母拼玛雅语：c 记平的 k 音、k 记带喉塞的 k' 音（kan“四”与 k'an 日名靠这个区分），另造反写的 c（ɔ）记 tz' 音，带喉塞的 p'、t' 写成 pp、th（字母连写两遍）；
#         梅里达的方济各会修院学校教贵族子弟拉丁文与教理，平民孩子在前院听讲；佩奇家（Ceh Pech 一带的贵族）里有人用拉丁字母写本族的编年；
#         玛雅数字用点与横杠记（一杠为五）；1518 年格里哈尔瓦的四条船沿尤卡坦沿岸航行；
#         1562 年 5 月起兰达等修士在马尼一带搜查旧书与偶像、以刑讯问话，7 月 12 日在马尼焚书。重逢只写焚书以前，不写现场。
#   推算——C1 的“五 Kan”（按 1554-03-13）、A2 的“十二 Imix”（按 1556-09-15）、来信的“二 Akbal”（1562-07-08），
#         一律以兰达记的“1553 年 7 月 16 日（儒略历）= 12 Kan、1 Pop”为锚点推算；按此锚点，7 月 8 日是 Cumku 月最后一天，1562 年的 Uayeb 是 7 月 9—13 日，
#         正文只说“年尾那五天没名字的日子快到了”（来信说“明天就进”），不写日期换算。
#         C1、A2 的章节窗口有几个月，哪天触发不定，正文不写公历的月日，只写玛雅的日子；来信是信里自署的日子，不受触发日影响。
#   原创——坎其人、点名册与课本边角、uac 念成 uuc 的那一行、十九对易混的字母、西班牙书记借书、准许抄的那一页、
#         修士要“细看”的课本与夹页、复活节为什么挪日子、木棉树下的老人与曾祖父画的四朵云、两摞抄本与淡水桶、树皮纸封皮的本子、
#         墙里的抄本、只写人家不写“书”的线索纸、独木舟夹板、“日子到了”的传话、割发入海、第四天学扯帆，全部台词。
#   待核——佩奇家与 1518 年船队的关系只作家里的口传；“往南修士一年来不了一回的村子”不指具体地名。
# 秘密：家里的历书抄在拉丁文课本的夹页里——B2 差点被修士翻到；任何见闻都不写课本与夹页，也不写墙里的抄本。
# 口头禅：“日子说错了。”原句只在 C2 正文用一次；S 的 promise 回复用“日子错了不要紧”呼应，来信里不照搬。
# 缺省走向：C1—A2 的 default 无收获、故事照走 → S 主角不在场：设 c7_bond_kan_pech_parted，照样开启重逢
#           → 重逢（1562-06-01..07-11，科苏梅尔）主角不在场：收到坎写于 7 月 8 日的信，设 c7_bond_kan_pech_missed。
# 羁绊阶梯：C2 list_sounds（bond C）→ B2 distract（bond B）→ A2 take_copy（bond A、赠礼 apprentice_notebook 与回忆）→ S promise（bond S，一生一约）。
# 落点：结义（swear_brothers：sworn）或一起开船的老友（just_sail：friends），两者都设 c7_bond_kan_pech_landing_friend。
# 旗标：写 c7_bond_kan_pech_promise / _own / _parted / _landing_friend / _missed；重逢的变体读本文件的 _promise 与 _own。不读外部旗标，不设共享 _taken。
# 日程：学院期各章 at = campeche（简报所定；正文写梅里达的修院学校与佩奇家宅院，S 写坎佩切的海滩）。cast 里坎的学院日程在 merida_city，
#       若在场判定要求人物到场，需整合方补坎佩切的日程；重逢在 cozumel，需整合方让坎 1562-06..07 在 cozumel（或由故事 schedule 效果另补）。
# 地点（2026-11-01 close-places）：C1—A2 的 at 由 campeche 改 merida_city；S 写坎佩切海滩送行，去掉 at（不限地点）。正文不动。

