# A1 · 1556 春 · 城外村口的木棉树下：老人停住的地方，我放下的笔
[[tracks.chapters]]
key = "a1"
title = "没说完的往事"
text = "开春，坎带我出城，走了大半天，到佩奇家老辈人住的村子去。村口一棵木棉树底下住着佩奇家辈分最高的老人，眼睛已经看不清了，讲起祖上的事，一个名字也不错。坎说：“我来听，来记。带上你，是因为你抄得快。”我把纸铺在膝盖上，笔蘸好了墨。老人从第一个佩奇讲起，讲他们从哪里来，在哪口井边住下。讲到某一处，他停了。屋里只剩吊床的绳子吱呀吱呀响。他把脸转过来，朝着我坐的方向。我把笔放下了。老人又讲下去，讲的是另一件事。回城的路上天快黑了，坎走在前头，忽然问：“走了一天，只记下半张纸。你会不会觉得白跑？”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "merida_city"
cast = ["kan_pech"]
speaker = "captain"
mood = "tender"
news = "梅里达城外有个村子，村口木棉树下住着佩奇家最老的长辈，眼睛看不见了，祖上几代人的名字倒一个不差。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
