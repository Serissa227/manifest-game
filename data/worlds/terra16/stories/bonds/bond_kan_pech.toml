[[tracks.chapters.choices]]
key = "not_wasted"
text = "告诉他：老人不让写的那一段，教会了我在哪儿停笔。"
reply = "“不白跑。”我说，“老人不让写的那一段，我听见他不说了。往后谁托我什么，我知道该在哪儿停笔。”坎没接话，走了好一段路，忽然站住，从怀里掏出他的抄本，就着最后一点天光，在第一页上写了一行拉丁字母。“以后谁翻开这本，先读你的话。”“那你得写上是谁说的。”他又添了一行。我凑过去看：伊希·妮克特。名册上那个“玛丽亚”，他一个字母也没写。"
next = "a2"
effects = [{ kind = "affinity", person = "kan_pech", value = 4 }]

[[tracks.chapters.choices]]
key = "ask_one_thing"
text = "问他：那讲一件能讲的给我听，就一件。"
reply = "坎想了很久，久到我以为他不打算开口。后来他讲了他曾祖父：那年曾祖父在北边的海滩上收盐，看见海上停着几朵云，不动，也不散。他数了数，四朵。第二天云近了，底下是木头。曾祖父没有跑，蹲在盐堆边上，把它们一条一条画了下来。坎讲得很慢，一句一句，像在往纸上抄。讲完他说：“这一件能讲。那张画还在家里。”"
next = "a2"
effects = [{ kind = "affinity", person = "kan_pech", value = 3 }]

# A2 · 1556 秋 · 佩奇家的后院：两摞抄本，油布包与树皮纸封皮的本子（赠礼 apprentice_notebook 只在 take_copy）
[[tracks.chapters]]
key = "a2"
title = "两处藏书"
text = "雨季里，坎把我叫到佩奇家的后院，地上摆着两摞一模一样的抄本。“同一份东西只放一处，”他说，“就像把一船的淡水全装在一只桶里。桶一漏，全船的人都渴着。”家里的老人们商量了三个晚上，定下来：一摞留在梅里达，一摞送走——送到科苏梅尔，接生婆家。坎把要送走的那一摞用油布包好，上面压了一本新本子，一起推到我面前。本子里一个字也没有，封皮是他自己用树皮纸裱的，线是蓝棉线，缝得极密。“书是我家的，”他说，“本子是给你的。你也记点什么。”油布包很沉。我还没伸手，他又补了一句：“老人们说，拿了这个，往后要是轮到你转交，得把佩奇家的名字一起交出去。”"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "merida_city"
cast = ["kan_pech"]
speaker = "captain"
mood = "tense"
news = "梅里达佩奇家的少年今年在学里装订本子，线缝得又密又匀，修士夸他手巧，他一本也不肯送人。"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "take_copy"
text = "收下油布包和本子：哪天要转交，佩奇家的名字一起交出去。"
requires = [{ kind = "affinity", person = "kan_pech", ge = 80 }, { kind = "bond", person = "kan_pech", level = "B" }]
hint = "油布包推到了你面前，他的手却一直没从上面拿开——这一摞，他还不放心交到你手里。"
reply = "我把油布包抱起来，本子揣进怀里：“哪天要转交，我连佩奇家的名字一起交。少一个字母，你来找我。”坎点点头，又把本子从我怀里抽出去，翻开第一页，蘸了墨。“名字比书要紧。”他一边写一边说，“书烧了，有人记得，还能再抄。名字丢了，就没了。”他写的是今天，两种算法：先是修士的年月日，后面是十二 Imix。写完吹干墨，又塞回我怀里。"
next = "s"
effects = [{ kind = "affinity", person = "kan_pech", value = 4 }, { kind = "bond", person = "kan_pech", level = "A" }, { kind = "item", item = "apprentice_notebook", qty = 1 }, { kind = "memory", memory = "mem-bond_kan_pech-a2", title = "两处藏书" }]

[[tracks.chapters.choices]]
key = "hide_together"
text = "先不拿，陪他把留下的那一摞藏进宅院的墙里。"
reply = "“送走的不急。”我说，“留下的那一摞先藏好。”我们等到半夜，在厨房背面的墙上撬下三块石头，把抄本包了三层油布塞进去，再和了灰抹平。坎抹得比泥瓦匠还仔细，抹完拿手掌按了按：“这件事，只有我们两个知道。”“还有墙。”“墙不会说话。”他把手上的灰蹭在裤腿上，“修士会。”那本新本子他收回去了，说等我想好要记什么，再来拿。"
next = "s"
effects = [{ kind = "affinity", person = "kan_pech", value = 3 }]

# S · 1556 年 12 月 · 坎佩切的海滩：只写人家、不写“书”的线索纸
[[tracks.chapters]]
key = "s"
title = "名字不烧掉"
text = "十二月，我在坎佩切的海滩上等家里的独木舟装货。学里的课散了，坎要留在梅里达，进市政厅给西班牙人当书记，抄地契，抄状子。他骑骡子走了两天来送我，到的时候货还没装完，他就站在旁边帮着数桨，数了两遍。装完货，他从袖子里抽出一张纸，折得方方正正：“书在哪几家，都在这上面。”我打开看。纸上没有“贵重”两个字，连“书”字也没有，一行只写一户人家：谁家的老人记得求雨的日子，谁家的女人记得祖上的名字，谁家的墙里放着什么人的记忆。最后一行是科苏梅尔，接生婆家，后面还空着半行。“修士要的是书，”坎说，“我写的是人家。”海风把纸角掀起来，他伸手按住了。"
window = [[1556, 12, 1], [1556, 12, 31]]
cast = ["kan_pech"]
speaker = "captain"
mood = "tender"
news = "坎佩切的海滩上，一条回科苏梅尔的独木舟等着装货，梅里达来的一个少年书记在边上站了一下午，帮着数桨。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

