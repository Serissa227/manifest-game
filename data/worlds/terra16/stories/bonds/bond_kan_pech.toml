# C1 · 1554 春 · 修院学校的前院：点名册与课本边角，Can 还是 Kan
[[tracks.chapters]]
key = "c1"
title = "两种算法的日子"
text = "我抱着替母亲换来的一包蜂蜡跑进修院学校的前院，背教理的声音已经停了。廊柱底下坐着佩奇家的坎，内院念拉丁文的贵人孩子，修士派他来管我们前院的名册。他头也不抬：“你迟到了。我记下了——今天是哪一天，两种算法都记了。”名册上记的是修士的日子，一个月份、一个数。他那本拉丁文课本摊在膝盖上，边角挤满了小字，一行一个日子，每行两截，一截二百六十天的算法，一截三百六十五天的，全用新学的字母拼。今天这一行，后半截的“Mac 月”已经写好，前半截只写到“五 Can”。他盯着那个 C，又在旁边写了个 K。“修士说这两个字母念一个音。”他终于抬头看我，“可写成 Can 是‘四’。我祖父念到这里，会以为今天是五、四。”笔尖悬在纸上，“这样写，他还认不认得？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "merida_city"
cast = ["kan_pech"]
speaker = "captain"
mood = "cheerful"
news = "梅里达修院学校的前院换了个管名册的，是佩奇家的少年，谁迟到他都记，名字拼错一个字母也要当场改过来。"
when = [{ kind = "flag", flag = "family_access_merida_franciscan" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
