effects = []

[[tracks.chapters.choices]]
key = "both_ways"
text = "请他把 C 和 K 两种写法并排留着，一个也不删。"
reply = "“那就两个都留着。”我说，“C 写给修士看，K 写给你祖父看。”他皱着眉，在课本后面另起半张纸，把今天的日子写了两遍，一遍 Can，一遍 Kan，底下注一行小字：念法不同。“修士要是问，”他说，“就说是练字。”“那你练得真勤。”他没笑，把纸夹回课本里。过了一会儿又抽出来，推到我面前叫我再看一遍——这回是要我看他的字有没有写歪。"
next = "c2"
effects = [{ kind = "affinity", person = "kan_pech", value = 3 }, { kind = "skill", skill = "arcana_maya_calendar", value = 4 }]

[[tracks.chapters.choices]]
key = "correct_him"
text = "挑他一个错：Mac 月拼得不对，科苏梅尔的老人不这么念。"
reply = "“Mac 不对。”我指着那一行，“我们岛上的老人念得重，尾巴是硬的。”他的脸一下子沉下去：“那是佩奇家的念法。是你们岛上念歪了。”我们一个比一个嗓门大，争到修士从回廊那头走过来。坎腾地站起身，换上背经的声音，一口气背完了整段《天主经》，比内院谁都响。修士点点头走了。他坐回去，把课本合上，过了半天才小声说：“你们岛上那么念……也对。”"
next = "c2"
effects = [{ kind = "affinity", person = "kan_pech", value = 4 }]

# C2 · 1554 夏 · 回廊底下：替他叔叔抄的那张纸，uac 念成了 uuc
[[tracks.chapters]]
key = "c2"
title = "错了一天"
text = "今年雨来得晚，前院的课挪到了回廊底下。坎拿来一张纸，说是替他叔叔抄的：叔叔在城里给西班牙人赶骡子，记不住旧历，哪天该回村求雨，全指望这张纸。“你念。”他说，“你念得出来，我叔叔就念得出来。”我一行一行往下念，念到第五行：“uuc……”“日子说错了。”他嘴角先动了，像是要笑，“那是 uac，六。你念成了七。”我凑近一看，他的 a 尾巴卷得太短，跟 u 一模一样。他笑到一半，笑声自己停了。他把纸拿回去，盯着那一行：“我叔叔要是照你这么念，就晚一天回村。求雨的人不等晚到的。”檐上的水一串一串往下掉。他拿指甲在那个 a 底下掐了一道印子，掐得纸都起了毛。"
