# 重逢 · 1562-06-01..07-11（马尼焚书以前）· 科苏梅尔码头：三只箱子，数两遍的人
[[tracks.chapters]]
key = "reunion"
title = "火以前的船"
text = "一五六二年六月，马尼那边的消息一天比一天坏：修士在各村搜旧书，挨家问话，问不出来就把人吊起来问。科苏梅尔的码头上，说话的人都压低了嗓门。坎就是这时候到的。他瘦了，穿着书记的黑衣裳，身后两个挑夫挑着三只箱子，里面是老人们挑过、准许送走的那一批抄本，一家几页。他没先说别的，先数人：船主一个，桨手六个，我一个。数完，又从头数了一遍，才蹲下去把箱盖封上，封得严严实实。“送去哪儿？”我问。“先送到还能教孩子认字的地方。”他说，“往南，那几个修士一年来不了一回的村子。认字的孩子在，书就有人读。”他抬头看了看天：“年尾那五天没名字的日子快到了。得在那以前走。”"
window = [[1562, 6, 1], [1562, 7, 11]]
at = "cozumel"
cast = ["kan_pech"]
speaker = "captain"
mood = "tense"
news = "科苏梅尔码头这些天来了个梅里达的书记，带着三只封得严严实实的箱子，挨个问船主往南走不走，问他装的什么，一个字也不说。"
when = [{ kind = "date", from = [1562, 6, 1], to = [1562, 7, 11] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "kan_pech", text = "伊希·妮克特：今天是七月八日，二 Akbal。Akbal 是夜，老人说这样的日子不出门。我还是出了门。我去科苏梅尔等过，没等到你的船。两只箱子我托一个盐贩子往南带走了，他不认字，不知道里面装的是什么，这样最好。第三只带不走，放回了家里那面墙里。马尼那边，修士把各村收来的东西都堆到了一处，我没有去看。明天就进年尾那五天没名字的日子，村里家家已经关了门。我给你的那张纸上的人家，我又抄了一份，夹在送走的箱子里——书可以再抄，名字我一个也没丢。你的船要是回来，别到梅里达找我，在坎佩切的海滩上等，我会知道。坎·佩奇，写于梅里达。日子核过两遍。" }, { kind = "flag", flag = "c7_bond_kan_pech_missed" }]

[[tracks.chapters.choices]]
key = "swear_brothers"
text = "在船边跟他结义：这批书和他的名字，我的船一起护。"
reply = "“坎，”我说，“我们结个义。往后这批书跟你的名字，我的船一起护。”他皱眉：“玛雅人不这么结拜。”“那就照科苏梅尔的规矩。”科苏梅尔哪有什么结拜的规矩，是我现编的。我拔出剥可可的小刀，割下一绺头发递给他。他看了我一会儿，接过刀，也割了一绺，比我那绺短，切口齐得像拿尺量过。两绺头发一起扔进船头底下的海里，打了两个转，沉不下去，漂走了。“漂走也算？”“算。海记着。”他点点头，从怀里摸出抄本，翻到最后一页，写下今天的日子，一种算法写完，又写另一种：“记下了。两样都记了。”然后他又数了一遍船上的人，这回把我也数了进去。"
next = "done"
effects = [{ kind = "affinity", person = "kan_pech", value = 5 }, { kind = "relation", person = "kan_pech", relation = "sworn" }, { kind = "flag", flag = "c7_bond_kan_pech_landing_friend" }, { kind = "memory", memory = "mem-bond_kan_pech-reunion", title = "火以前的船" }]

[[tracks.chapters.choices]]
key = "just_sail"
text = "什么也不多说，当天就把船开出去，越快越好。"
reply = "“上船。”我说，“别的话路上说。”当天下午我们就出了科苏梅尔，顺着海岸往南。头三天坎一直坐在箱子上，不说话，也不肯挪窝，饭都端到箱子上吃。夜里我起来看帆，他还坐着，两只手按着箱盖。第四天早上他忽然开口：“谢谢。”我等着下文。他又说：“你的帆打得歪。”“那你来。”他真来了，攥着帆索，照书上的样子一板一眼地扯，扯得比我还歪，帆兜不住风，船头直往岸边拐。桨手们笑得桨都拿不稳。坎绷着脸又扯了一回，这回正了。他把帆索还给我，坐回箱子上：“记一笔。第四天，学会一样。”"
next = "done"
