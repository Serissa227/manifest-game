# B1 · 1554 秋 · 佩奇家的宅院：西班牙书记来借书，准许抄的那一页
[[tracks.chapters]]
key = "b1"
title = "书不是他一个人的"
text = "秋天，市政厅的一个西班牙书记找到佩奇家的宅院来，帽子拿在手里，客客气气，说听闻府上藏着祖上的旧书，想借去看看，“只是看看”。坎站在门槛里，背挺得比在修士面前还直：“书不全是我的。家里的记载，我一个人说了不算。”书记笑了笑，说下回再来。人一走，我就拉住坎：“全藏起来，藏到他找不着的地方，藏得越多越好。”坎看了我一眼，没答，转身进了后院。我在院子里等到日头偏西，他才出来，手里只拿着一页。“老人们说，这一页你可以抄。别的，他们还要想。”“想什么？”“想留下什么。”他说，“我们家的规矩：先问书的主人，再说藏不藏。”那一页上画着求雨的日子，点和横杠排成一列，墨色发灰，中间一道很旧的折痕。"
