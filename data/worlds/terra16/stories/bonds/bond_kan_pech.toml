[[tracks.chapters.choices]]
key = "promise"
text = "答应他：哪天他托人来传话，我的船就来接书，不问为什么。"
requires = [{ kind = "bond", person = "kan_pech", level = "A" }]
hint = "这样的约，要么你们还没交到那个份上，要么一生一次的约已经许了别人；今天只能答应替他捎一封信。"
reply = "“哪天你托人来说一声，”我说，“我的船就来接书。不问为什么，也不问运去哪儿。”坎看了我很久：“我希望那一天不会来。”“那我就等着它不来。”他没笑，把那张纸折成四折，蹲下去，塞进我独木舟船舷的夹板缝里，又拿指头往里推，推到外头一点也看不见。“传话的人不会写字。”他说，“他只说一句：日子到了。你听见这句就开船。”“哪一天？用哪种算法？”他站起来，拍掉膝盖上的沙：“算错了也没关系。船来就行。”那是我头一回听他说日子错了不要紧。船离岸的时候，他还站在原地，没挥手，嘴唇在动——我猜他在数桨。"
next = "done"
effects = [{ kind = "affinity", person = "kan_pech", value = 5 }, { kind = "bond", person = "kan_pech", level = "S" }, { kind = "relation", person = "kan_pech", relation = "friends" }, { kind = "flag", flag = "c7_bond_kan_pech_promise" }, { kind = "memory", memory = "mem-bond_kan_pech-s", title = "名字不烧掉" }, { kind = "start_track", track = "reunion_kan_pech" }]

[[tracks.chapters.choices]]
key = "own"
text = "各守各的：他守书，我出海，有事写信。"
reply = "“你守你的书，我出我的海。”我说，“有事就写信。”“信要写两种日子。”他说。“那一封得写多久？”“书记写字快。”我把那张纸照原样折好，收进怀里。他又问，科苏梅尔的信送到梅里达要走几天。我说顺风六天，不顺风看天。“那我按十天算。”他点点头，像是把这个数记进了哪本册子里。船推下水以前，我说：“明年我在你名册上迟到的那一天，我在岛上替你记一笔，算你一回不迟到。”他张了张嘴，大概想说那一天换一种算法该叫什么，最后什么也没纠正，只说：“好。”独木舟离了岸，我回头看，他蹲在沙滩上拿指头写字，写完一行，又在旁边写一行。浪上来，两行一起抹平了。"
next = "done"
effects = [{ kind = "affinity", person = "kan_pech", value = 2 }, { kind = "relation", person = "kan_pech", relation = "friends" }, { kind = "flag", flag = "c7_bond_kan_pech_own" }, { kind = "memory", memory = "mem-bond_kan_pech-s", title = "名字不烧掉" }, { kind = "start_track", track = "reunion_kan_pech" }]

