text = "一五五五年，修士查课本查得勤了。有一堂课讲圣徒日，前院的孩子也被叫进内院，挤在后排。修士一边讲，一边在桌子之间走，走到坎跟前，顺手拿起他的拉丁文课本翻了两页。“神父，”坎的声音很稳，“我的字写得不好，污了您的眼。”我坐在坎斜后面，看见书页中间露出一角对折的薄纸，上面是他那种挤得密密的小字，一行一个日子，每行两截。坎的后颈一下子白了。修士没往下翻，把课本合上，往他桌上一放：“下了课留下，这本我要细看。”“是，神父。”修士转过身，拿木棍去指墙上的圣徒画像，圣安德肋，圣多默，一个一个念过去。坎跟着念，声音一点没抖，一只手平放在那本课本上，一动不动。"
