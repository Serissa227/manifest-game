[[tracks.chapters]]
key = "reunion"
title = "白天的抄书房"
text = "1561 年我再到开罗，书铺还在老地方，柜台后面站的是祖贝达。楼上多了一间抄书房，三张矮桌，两个学徒，朝南的窗子开得很大。门边墙上贴着一张纸，字大得隔着一屋子都看得清：“一、灯下不抄。二、纸钱另算。三、读者是谁，先说。”阿米娜坐在最亮的那扇窗下，鼻梁上架着一副威尼斯眼镜。她抬头看我，先把眼镜摘了，才认出是谁。“看远处要摘，看近处要戴，”她说，“我现在一天摘戴一百回。”楼下祖贝达扯着嗓子喊：“姐！有人送信来——哦，是人自己来了。”阿米娜没理她，指了指窗下一张凳子：“本子带来了？念给我听。”我说她戴着眼镜，自己看更快。“我看得清。”她把眼镜折好，搁在桌上，“我想听你念。”"
window = [[1561, 1, 1], [1561, 12, 31]]
at = "cairo"
cast = ["amina"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1561, 1, 1], to = [1561, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "amina", text = "巴拉卡：我是祖贝达，这封替姐姐写。她说一句我写一句，字丑了算我的。抄书房开起来了，就在书铺楼上，只在白天开门，太阳一落她就赶人。两个学徒，一个手稳，一个嘴快，嘴快的那个我打算要到楼下来卖书。生意还行，纸钱另算这一条，城里的抄书人有三家跟着学了。姐姐说：你今年没来，她猜你又在哪个港口跟人砍价砍忘了日子。下回来，带一句实话来，别带笑话。姐姐说完了，我再添一句：她戴眼镜了。眼镜是我替她砍的价，比威尼斯人开口的少了三成。这句她不让写，我写了。（末尾另起一行，字大得占了三行的地方）格子打好了。来。" }, { kind = "flag", flag = "c7_bond_amina_missed" }]

[[tracks.chapters.choices]]
key = "read_notebook"
text = "坐在窗下，把宽行本子从第一页念到最后一页。"
reply = "我从第一页念起：蒙巴萨一个替丈夫记账的寡妇，账上用的全是她自己发明的记号；马林迪一个造船匠，一辈子没写过一个字，造的船从没漏过水；霍尔木兹一个水手托我给他母亲写信，写到一半说算了，等他回去自己讲。念到霍尔木兹那段，阿米娜摘下眼镜擦了擦，擦了很久。“这一段要抄下来，”她说，“贴到楼下，给来买书的人看。”我念完最后一页，太阳已经偏西。学徒们收了笔，没人去点灯。她把本子推回给我，又递过来一支笔：“每一段后面，写上说话的人叫什么。读的人要知道是谁说的。”"
