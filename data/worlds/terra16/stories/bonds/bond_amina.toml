[[tracks.chapters.choices]]
key = "promise"
text = "约好每年托商队带一封信，写一件在别处见到的真事。"
requires = [{ kind = "bond", person = "amina", level = "A" }]
hint = "一年一件真事的约，要交情到了才许得下，一辈子也只许得一回——要么你们还没到那儿，要么它已经给了别人。这回只能说有空就写。"
reply = "“一件就够，”她说，“写不完的，回来讲。”她翻开那本记读者要求的账本。第一页上密密麻麻：谢赫要宽行，药商要拿红字标剂量，瞎了一只眼的船长要每页只写九行。她在最底下一行写上我的名字和基尔瓦的地址，跟那些读者排在一起。“你也算我的读者了。”她说，“给你回信，字写大一号。”我说那我也写大一号，省得她眯眼。她拿笔杆敲了一下我的手背，没反驳。合上账本之前，她又在我的名字后面添了一条，跟当初那张小纸条一个写法：“读者要求：每年一件，要真的。”"
next = "done"
effects = [{ kind = "affinity", person = "amina", value = 5 }, { kind = "bond", person = "amina", level = "S" }, { kind = "relation", person = "amina", relation = "friends" }, { kind = "flag", flag = "c7_bond_amina_promise" }, { kind = "memory", memory = "mem-bond_amina-s", title = "带一句实话来" }, { kind = "start_track", track = "reunion_amina" }]

[[tracks.chapters.choices]]
key = "own"
text = "不立约，只说：有空就写，忙就不写。"
reply = "“这样最好。”她点点头，“我最怕人许了又做不到，回头还得我替他圆。”她没再提信的事，低头把这一页抄完。傍晚她送我到杰巴尔提住宿区门口，门房在打瞌睡。她从袖子里抽出一卷纸，塞进我的行李：每张都打好了宽格，还没沾过墨。“忙的时候不用写。”她说，“不忙的时候，格子是现成的，省你一道工。”说完她就走了，没回头，走到街角才抬手挥了一下。那卷纸拿装订用的旧线捆着，打的是书铺捆书的死结。后来在去苏伊士的路上，我在骆驼背上拆了大半天才拆开。"
next = "done"
