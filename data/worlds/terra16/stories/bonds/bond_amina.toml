[[tracks.chapters]]
key = "b1"
title = "漏掉的一行"
text = "阿米娜的父亲接了两份短论文，周五一早要交。一份给她抄，一份给了我——是她替我说的情，说这个基尔瓦人打格打出了门道。“打个赌，”我说，“谁后抄完，谁请对方喝甘蔗汁。”“赌什么都行。”阿米娜蘸了墨，“漏字的算输。”周四傍晚我先交。她父亲一页页核，核到第六页，拿起红笔在中间圈了一个圈。两句话收尾是同一个词，我的眼睛从上一句的尾巴直接滑到下一句的尾巴，中间整整一行没了。阿米娜第二天清早才交，她父亲从头翻到尾，一个圈也没画。我等着她笑。她没笑，拿笔杆点了点那个红圈：“这叫眼睛偷懒。两句收尾一样，眼睛就想抄近路。我十二岁漏过一整段，我父亲让我把整本重抄了一遍。”"
