[[tracks.chapters]]
key = "a1"
title = "第三遍的笑话"
text = "基尔瓦的信是商队捎来的，路上走了四个月。信上说，我祖母走了，下葬那天下了雨。我把信折好塞进腰带，照常去阿米娜的摊子上打格子，给她讲骆驼过海关的笑话。讲完她没笑。过了一会儿我又讲了一遍，换了个结尾。第三遍讲到一半，她放下了笔。“你这个笑话，今天第三遍了。”我张了张嘴，后半截没讲出来。她没问为什么，也没说什么好听的，只朝摊子后面那块阴凉抬了抬下巴：“去那儿坐。”又倒了一碗水推过来，碗底在桌面上蹭出一道湿印。“喝完再坐一会儿。我这页还没抄完。”我坐在阴凉里，看她一行一行往下抄。笔尖刮纸的声音很稳，一直刮到宣礼声从爱资哈尔的宣礼塔上落下来。"
