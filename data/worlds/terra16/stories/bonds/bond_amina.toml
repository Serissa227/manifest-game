[[tracks.chapters]]
key = "a2"
title = "宽行的本子"
text = "夏天最热的那几天，阿米娜把一个布包放在我的线板上。“拆开。”是一本她自己装订的本子，羊皮封面，线是从书铺拿的旧线，缝得比我见过的哪一本都密。翻开，每一页都打好了格，行与行之间宽出一指。“你冬天要走。”她说，“出海以后，各地的人要写什么、读什么——商人记账用什么字，水手的老婆托谁写信，船上有没有人认字——记下来，回来告诉我。”封面内侧是她的字：“爱资哈尔门外，北墙第三根柱子下，抄书摊。”我笑她格子打得太宽，像是专给我这双慢眼睛备的。“给你？”她把本子翻到最后一页，那页也打好了格，一个字还没有。“是给我自己的。以后你念给我听，我坐在旁边，也要看得清。”"
