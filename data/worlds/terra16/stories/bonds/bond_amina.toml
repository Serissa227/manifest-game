title = "先问读者"
text = "爱资哈尔门外的抄书摊，只有一张矮桌和一块遮阳的旧帆布。我想买本便宜的诗选回去练字，问价钱，摊主头也不抬。“谁读？”“我。”“在什么灯下读？白天还是夜里？眼睛好不好？”她叫阿米娜，看着比我大不了几岁，问话却像收账的。我说读的人是个基尔瓦来的斯瓦希里人，念阿拉伯字比骆驼过桥还慢。她没笑，抽出一张巴掌大的小纸条，蘸墨写下：“读者：慢。”桌上晾着一页刚抄好的诗，字黑得发亮。我伸手想翻过去看下一页，她一掌按住纸角。“墨还没干，谁也别翻这一页。”她把那页挪进太阳里，又打量了我一眼，在纸条上添了一句。我凑过去，只认出一个“大”字。“给你抄大一号的。”她说，“价钱另说。”"
