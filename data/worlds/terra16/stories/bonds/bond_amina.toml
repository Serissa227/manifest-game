title = "带一句实话来"
text = "十二月头上，往苏伊士的商队定了日子。我要先回基尔瓦，开春再跟父亲的船出海。我去摊子上告别，顺便把肚子里攒的牛皮吹了一遍：我要去看会喷火的山，去比基尔瓦城墙还高的浪里捞珍珠，回来一样一样讲给她听。阿米娜等我吹完，把笔搁在砚台上。“这些留着讲给祖贝达的客人听，她能拿去换钱。”她说，“我要真的。哪个港口的人早饭吃什么，谁家的女人替丈夫记账，哪里的人一辈子没见过纸。”“真的没那么好听。”“好听的我自己会编。”她从账本上撕下一条纸，“你见过的人怎么过日子，一年带一件来就够。”那条纸上写着她的地址，字很大。"
