[[tracks.chapters.choices]]
key = "bring_paper"
text = "放下从威尼斯船上带来的两刀纸，把砍下的价钱写给她看。"
reply = "两刀纸是我在亚历山大港从一条威尼斯船上买的，砍了一下午，船上的管事最后说，再砍他就跳海。我把价钱写在最上面那张纸的角上，推过去。阿米娜戴上眼镜看了看，又摘下来看了看我。“比我上个月买的便宜两成，”她点头，“砍得好。”她把纸搬进柜子，拿炭条在柜门上写了一行：“白天用。”然后拍了拍手上的灰，下楼找祖贝达算账去了。我坐在窗下翻那本宽行的本子，翻到第三页，她上来了，把一小袋银币放在纸角那个数字旁边，一个子儿不多，一个子儿不少。“纸钱另算，”她说，“墙上写着的。”"
