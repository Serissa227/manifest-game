text = "香料商是天黑以后来的，抱着一本泡过水的账册，要阿米娜连夜誊一份新的，说船明早就走。“半价，”他说，“抄书人夜里本来闲着。”我以为她会把他轰出去。她点了点头。灯点起来，油烟一缕一缕往上爬，没多久陶灯的灯嘴就熏黑了一圈。我坐在旁边替她按住旧账册的页角，看见她每抄一行就往灯前凑一点，眯着眼，字比平时大出一圈。抄到第三页，她停下来，把灯往跟前又挪了一寸，拿袖子擦了擦眼睛。“别告诉祖贝达。”她声音压得很低，“夜里的活我已经推了好几家，眼睛受不住。可这个月家里要钱。”“那你还接？”“半价也是钱。”她蘸了墨，“按住纸，别说话，我在数行。”"
