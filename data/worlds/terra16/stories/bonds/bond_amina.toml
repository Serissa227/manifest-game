[[tracks.chapters]]
key = "c2"
title = "宽一指的行"
text = "为了还她多抄的情，我说要替她打格子。她递给我一块线板：木板上绷着一排细线，背面坠着小铅锤。“纸压上去，用指甲顺着线抹一遍，格子就出来了。”讲席后面住着一位老谢赫，订了一本祈祷书。我一口气打了二十张，阿米娜翻了翻，没说好也没说坏：“你自己拿去给他看。”老谢赫把纸贴到鼻尖，眯了半天眼：“孩子，这一行和下一行是在吵架吗？挤成这样。”我抱着纸往回走，路上想好了一个笑话。走到摊子边，看见阿米娜正拿手背揉眼睛，揉了两下，很快放下，又低头去抄。“他怎么说？”“他说行和行在吵架。”她伸手拨了拨线板上的铅锤，细线晃了一下。“那就让它们隔远一点。”"
