# 重逢 · 1562 · 班达奈拉：长老树下的长桌，先听种树的人说完
[[tracks.chapters]]
key = "reunion"
title = "岛上的议事桌"
text = "1562 年，我的船靠上了班达奈拉。港口对面的火山冒着一缕烟，岸上一股肉豆蔻衣晒干了的辛味。瓦蒂在码头上等我，比从前更黑也更瘦，说话还是那么慢。“货明天再看。”她没带我去货栈，先把我领到一棵大树底下：长老们议事的长桌就摆在那里，桌面是一整块木板，被手肘磨得发亮。“先坐下，”她说，“先听。”种肉豆蔻的人一个一个站起来说话：今年收了多少果子，葡萄牙人给的什么价，万丹的船来没来过，想卖给谁，不想卖给谁。有个老人说得特别长，从他父亲种下的第一棵树说起。我好几次想开口讲我的航路、我的船能装多少，每回瓦蒂都在桌子那头抬一抬眼皮。太阳偏西，最后一个人坐下了，长老冲我点头，我才站起来，说我的船能做什么。瓦蒂坐在桌子那头，冲我笑得很轻。"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "banda_neira"
cast = ["wati"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

# 缺省：我错过了班达，瓦蒂寄来一张岛名单，最后加了一座新的小岛。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "wati", text = "凯奇利：你没来。西风来了又走，奈拉码头上我等过三条特尔纳特的船，船上都没有你。不怪你，海大。今年的事，我写岛上人自己的话。那份五年的契约到期了，长老们没再按手印。隆托尔的老哈山说：“葡萄牙人的秤，杆子是弯的。”这句我原样抄给你。艾岛今年果子少，价开得高，没人压他们。我在码头上挂了白布，演给孩子们看。那出拿秤的戏，我演了十一回。有一回台下坐着特尔纳特来的水手，演完他什么也没说，第二天送来一小包丁香。岛名单附在后面，是新抄的一份，你认得原来那张的样子。最底下我又加了一座：一块退潮才露出来的沙洲，住着一对老夫妻，种了七棵树。他们说自己算不上一座岛。我说算。你以后来班达，先去比桑，再去这一座。名字我写了，念法你不会，等你来了我教。瓦蒂，于班达奈拉。" }, { kind = "flag", flag = "c7_bond_wati_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "就在议事桌上，照种树的人自己开的价，订下我的第一船肉豆蔻。"
reply = "我把那个老人开的价又念了一遍，比葡萄牙人给的高出一截。我的大副在后面咳嗽。我还是点了头，请长老把这一笔记下来。桌边静了一下，接着有人拍桌子，有人笑。那个老人走过来，两只手握住我的手，摇了很久，说的话我只听懂一半。瓦蒂在旁边替我把另一半说出来：“他说，他种了四十年树，头一回有人照他说的数买。”散会以后，我们坐在码头的石阶上看人往我的船上搬货，一袋一袋，肉豆蔻衣红得像炭火。瓦蒂捧着账本，一袋过一次秤，秤杆上的铜星她看得很慢，一颗也没看反。“这是班达第一船，”她说，“让种树的人自己开价的货。”“亏不亏，我回特尔纳特再算。”“你算吧。”她把账本递给我，“算错了，我编进戏里。”"
next = "done"
effects = [{ kind = "affinity", person = "wati", value = 5 }, { kind = "relation", person = "wati", relation = "friends" }, { kind = "flag", flag = "c7_bond_wati_landing_friend" }, { kind = "memory", memory = "mem-reunion_wati", title = "岛上的议事桌" }]

[[tracks.chapters.choices]]
key = "bring_the_play"
text = "散会后说起那出拿秤人的影戏：我要把它带到特尔纳特去演。"
reply = "议事散了，我跟瓦蒂说起那出戏：我想把它带回特尔纳特，演给种丁香的人看。她看了我一会儿：“你还记得。”那天夜里，她在长老的大树底下挂起白布，点上椰油灯，又是我举灯。拿秤的皮偶还是那张歪脸、长鼻子。岛上的孩子挤在最前面，大人站在后头，一边嚼槟榔一边笑那个数不清铜星的秤手。演到秤手背着钱袋划船去认错，后排有个老人站了起来。他说他如今跟着特尔纳特的船，运西米来班达换肉豆蔻，年轻时在一条丁香船上，有一年在格雷西克过秤，回家才知道一船人都少拿了一成；后来钱又一户一户送了回来。他问这出戏是谁编的。瓦蒂从白布后面站起来，灯把她的影子投在布上，比皮偶大得多。“是我编的。那一格，是我看反的。”老人看了她很久，摆摆手，又坐下了：“戏还没完。演完它。”我把灯举稳了。"
next = "done"
effects = [{ kind = "affinity", person = "wati", value = 5 }, { kind = "relation", person = "wati", relation = "friends" }, { kind = "flag", flag = "c7_bond_wati_landing_friend" }, { kind = "memory", memory = "mem-reunion_wati", title = "岛上的议事桌" }]

[[tracks.chapters.variants]]
key = "v1_promise"
when = [{ kind = "flag", flag = "c7_bond_wati_promise" }]
text = "这几年瓦蒂的信每年跟着西风到特尔纳特，写的都是岛上人的原话，谁家的树结了多少、开了什么价，一字不改；信末总有一个新词，叫我念熟。1562 年我的船到了班达，没进奈拉，先绕去了比桑。三户人家变成了五户，一个老妇人听我用比桑的话问好，愣了一下，回屋去叫人。瓦蒂从屋里走出来，手里还攥着一串刚摘的肉豆蔻：“你念对了。”她把我领回奈拉，领到一棵大树底下，长老们议事的长桌就摆在那里，被手肘磨得发亮。“先坐下，”她说，“先听。”种肉豆蔻的人一个一个站起来说话，说了一下午。我忍着没讲我的航路，等最后一个人坐下，才站起来说我的船能做什么。她坐在桌子那头，冲我笑得很轻。"

[[tracks.chapters.variants]]
key = "v2_own"
when = [{ kind = "flag", flag = "c7_bond_wati_own" }]
text = "我们约过：我的丁香，她的肉豆蔻，都等种树的人先开了价再谈。这几年她果然最难缠，我的船在安汶跟她撞上过两回，两回都是她先把价问到了种树的人嘴里。1562 年我的船到了班达奈拉，她在码头上等我，头一句话是：“今年带了多少钱？不够的话，别坐那张桌子。”她把我领到一棵大树底下，长老们议事的长桌摆在那里，桌面被手肘磨得发亮。“先坐下，先听。”种肉豆蔻的人一个一个站起来说话，说了一下午。我忍着没讲我的航路，等最后一个人坐下，才站起来说我的船能做什么。瓦蒂坐在桌子那头，冲我笑得很轻，像下棋的人等到对手终于走了那一步。"
