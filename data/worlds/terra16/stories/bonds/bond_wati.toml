next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "send_word"
text = "说我家的船下个月去特尔纳特，替她把少给的钱带回去。"
requires = [{ kind = "affinity", person = "wati", ge = 20 }]
hint = "她把账本合上了，没有看你——她还不想让一个王子替她收拾自己算错的账。"
reply = "她回家拿来一个布袋，把钱倒在货栈的秤盘上，一枚一枚数给我，数了三遍。我掂了掂，说多了。“多出来的是一成的利息，”她说，“他们白等了一个月。”她把袋口扎紧，打了个死结，又在结上按了按：“到了特尔纳特，先别说是谁算错的。等我自己去说。”"
next = "b1"
effects = [{ kind = "affinity", person = "wati", value = 2 }, { kind = "bond", person = "wati", level = "C" }]

[[tracks.chapters.choices]]
key = "check_the_scale"
