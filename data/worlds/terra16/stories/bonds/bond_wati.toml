effects = []

[[tracks.chapters.choices]]
key = "recite_again"
text = "请她从头念一遍，慢得让我每一座岛的名字都记得住。"
reply = "她真的从头念起，一座岛停一口气，像在码头上点货。念到比桑，她多说了一句：“那里的肉豆蔻最香。树老，没人舍得砍。”我在纸边记下“最香”两个字。她瞟了一眼，点点头：“王子也会听人说话。”我说别叫我王子。她想了想：“那等你下回一座不错地背完，我换个叫法。”"
next = "c2"
effects = [{ kind = "affinity", person = "wati", value = 3 }]

[[tracks.chapters.choices]]
key = "defend_list"
text = "说先生的单子上没有那座岛，我只背单子上的。"
reply = "“那就把它加上去。”她伸手拿过我的纸，又借了我的笔，在最底下写了“比桑”两个字。字很小，一笔一画，比先生的还端正。写完她把纸还给我，想了想，又拿回去补了一行：“三户人家，十一口人。”她把笔递回来：“这个也要背。”"
next = "c2"
effects = [{ kind = "affinity", person = "wati", value = 2 }]

# C2 · 1554 夏 · 格雷西克码头的货栈：看反的一格
[[tracks.chapters]]
key = "c2"
title = "丁香的斤两"
text = "特尔纳特来的丁香船靠了格雷西克码头。瓦蒂的舅舅在货栈收货，叫她帮着过秤。她算得快，一筐一筐挂上秤钩，报数不高不低，账房的笔都跟不上。船当天傍晚就趁着风走了。第二天我去货栈找她还书，她正对着那杆秤发呆。秤杆是乌木的，嵌着一排铜星。她拿指甲在其中一颗上刮了刮，抬起头来，脸是白的。“我看反了一格。”她说，“整整一船，每一筐都少记了一成。”账房在旁边说，钱已经付清，船也走了，这种事码头上天天有。瓦蒂没理他，把账本翻到昨天那一页，手指按在船主的名字上，又转过来看我。“那是你们家岛上的人。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

