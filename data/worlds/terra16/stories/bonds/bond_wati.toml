reply = "我们借了货栈的砝码，从最轻的一颗铜星校起，校到天黑。校完才发现，这杆秤本来就歪了半格，她看反的那一格，正好落在歪处。账房松了口气：“那就不怪你。”瓦蒂把秤杆横在膝盖上，拿小刀把歪的那一格刻深了一道：“那更该赔。”"
next = "b1"
effects = [{ kind = "affinity", person = "wati", value = 3 }]

# B1 · 1554 秋 · 学堂院子里的白布：举灯
[[tracks.chapters]]
key = "b1"
title = "影戏的白布"
text = "瓦蒂在吉里学会了演影戏。她用水牛皮刻了五个皮偶，薄得透光，手柄是牛角磨的；又在学堂的院子里拿竹竿绷起一块白布。演的人坐在布后面，前头得有人举灯，她挑了我。“灯要举得稳，”她说，“晃一下，影子就抖。”第一回排练，演到一半我的胳膊就酸了，椰油灯一晃，白布上的国王和他的大臣一齐打起了摆子。来看热闹的小孩笑得在地上打滚，有一个还学皮偶抖腿。我也想笑，探头去看她。瓦蒂没笑，从白布后面伸出一只手，把灯往我手里按了按。“再来。这回你看着影子，别看我。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

