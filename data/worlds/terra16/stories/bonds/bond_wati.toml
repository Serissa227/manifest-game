# S · 1556 年 12 月 · 西风起，回班达
[[tracks.chapters]]
key = "s"
title = "回班达"
text = "十二月西风一起，往马鲁古去的船就在格雷西克码头排开了。我开春回特尔纳特，瓦蒂这个月就走。她的行李只有一只木箱，装着皮偶和那块卷起来的白布。她说她回去，跟想家没多大关系：“那份契约，长老们还在争。岛上得有人一条一条念给种树的人听。”临走前一天，她把一张旧纸交给我。是三年前我背岛名的那张，不知什么时候从我的书箱里抽走的，边上起了毛，折痕都发白了。最底下一行是那座小岛的名字，墨是新的。“你以后来班达，”她说，“先去这座岛。”我说先去奈拉不是更顺路。她没接话，只把纸角压平，等着我把这句收回去。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：开春我回特尔纳特那天，瓦蒂的船早走了，岛名单留在我的桌上。只开重逢、记 parted，没有关系变化。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_wati" }, { kind = "flag", flag = "c7_bond_wati_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好往后的信只写岛上人自己的说法；来班达，先去那座小岛。"
requires = [{ kind = "bond", person = "wati", level = "A" }]
hint = "她把岛名单折了又折，没有等你说下去——这样一辈子的约，要么你们还没熟到能许，要么这句话你已经对另一个人说过了。"
reply = "“往后写信，”我说，“岛上的事就写岛上人自己怎么说。谁家的树结了多少，谁家开了什么价，照他们的原话。我要是来班达，头一个去比桑。”瓦蒂想了一会儿：“那你得学会他们的话。比桑的话跟奈拉的不一样，连‘肉豆蔻’都叫得不一样。”“那你教我。”“一座岛一座岛地教。”她从木箱里摸出一截炭条，在岛名单的背面写下第一个词，念给我听，叫我跟着念。我念错了，她摇头；再念，她又摇头。码头上的船工在喊装货了，她还在等我念对。念到第五遍，她终于点了头，把炭条塞进我手里：“下回见面，我考你。一个词也不许忘。”她上船的时候没回头。船过了沙洲，木箱里露出白布的一角，被风吹得一鼓一鼓。"
next = "done"
effects = [{ kind = "bond", person = "wati", level = "S" }, { kind = "relation", person = "wati", relation = "friends" }, { kind = "memory", memory = "mem-bond_wati-s", title = "回班达" }, { kind = "flag", flag = "c7_bond_wati_promise" }, { kind = "start_track", track = "reunion_wati" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好往后我的丁香、她的肉豆蔻，都等种树的人自己开了价再谈。"
reply = "“往后我的丁香，你的肉豆蔻，”我说，“不管谁来收，都等种树的人自己开了价，我们再谈。”瓦蒂把行李绳在手上绕了一圈：“那我们俩的生意，会是最难做的。”“难做的才值得做。”“你是下棋下惯了，专挑难走的格子。”她笑了，弯腰打开木箱，翻出一卷纸——是那出拿秤人的戏的台词，一句一句写着，边上全是改过的墨迹。她把它卷紧，塞进我的行李最底下。“到了特尔纳特，”她说，“有人问起那一船丁香，你就把这个念给他听。念慢一点，那几句我改了好多回。”"
next = "done"
