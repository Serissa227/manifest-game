# 瓦蒂（bond_wati / reunion_wati）——C7 重写，2026-10-12，Claude（Opus）执笔。故事 2.0，遵循 A5 / E37 契约。
# 标签：friend（只写友情）。章节：C1 C2 B1 B2 A1 A2 S，另有成年重逢一章。
# 人物：瓦蒂（wati，1540-04-25 生，女，不开放恋爱），班达长老的女儿，在格雷西克的吉里学堂读书；
#       主角凯奇利·劳特（kaicili，1540-09-09 生），特尔纳特苏丹的儿子，同在吉里。
# 年龄：学院期（1554—1556）两人 13 到 16 岁；重逢 1562 年两人都已二十出头。全线不写心动、不写心照不宣，S 与重逢只落在 friends。
# 依据（史实）：格雷西克的吉里在苏南·普拉彭治下收群岛各地的王子与学生；班达没有国王，大事由长老们坐着商量；
#   班达出肉豆蔻与肉豆蔻衣，葡萄牙人从马六甲来收货；特尔纳特种丁香，岛上有葡萄牙人的堡；特尔纳特的火山甘马拉马、
#   班达奈拉对面冒烟的火山岛；科拉科拉船；爪哇的皮影戏用水牛皮刻偶、牛角做柄、白布作幕、椰油灯照影；
#   西风（十二月起）送船东去马鲁古；比桑岛（Pisang）是班达北面真实的小岛。
# 依据（原创）：比桑岛只住三户人家、嵌铜星的乌木秤与看反的一格、五年包买的契约、拿秤人的影戏、画着班达的彩绘海贝、
#   退潮才露出的沙洲与七棵树、长老树下的议事长桌上的那一下午，以及全部台词。
# 秘密：瓦蒂把算错丁香斤两的事编进影戏、借台词认错——A1 上演、主角认出；本文件不写任何见闻。
#   口头禅原句只在 C1 正文出现一次；B2、S、重逢用改了字句的呼应。
# 缺省走向（default 没有文字，写在各章的注释里）：
#   C1 那天的岛名我背错了两座，瓦蒂一座也没错 → C2 那一成的钱，瓦蒂后来自己攒着，攒了一年
#   → B1 那块白布瓦蒂一个人绷了一下午，晚上收起来了 → B2 契约被葡萄牙商人带去了班达，按没按手印，瓦蒂一直不知道
#   → A1 戏演完，瓦蒂把那个拿秤的皮偶收进了木箱最底下 → A2 那枚画了班达的贝壳，瓦蒂自己留着（只有 keep_shell 送出 painted_shell）
#   → S 主角不在场：开春我回特尔纳特那天，瓦蒂的船早走了，岛名单留在我桌上（设 _parted，照样开启重逢）
#   → 重逢 1562 班达奈拉：主角不在场就收到她的一封来信，名单最后添了一座新的小岛（_missed）。
# 落点：只有友情（friends，_landing_friend），两个选项结果不同：一个在议事桌上照种树人开的价订货，一个替她把影戏演到当年那条船上的人面前。
# 旗标：写 c7_bond_wati_promise / _own / _parted / _landing_friend / _missed；重逢的两个变体读本文件的 _promise 与 _own。不读别线旗标。
# 日程：不改。瓦蒂 1557 年起在 banda_neira。女孩们的班顿对歌归 tie_wati_nyai，本文件不写。

[[tracks]]
key = "bond_wati"
name = "瓦蒂：还有一座岛"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["wati"]

# C1 · 1554 春 · 吉里学堂的廊下：背岛名，“还有一座”
[[tracks.chapters]]
key = "c1"
title = "还有一座岛"
text = "吉里学堂的先生叫我们把摩鹿加和班达的岛名抄在纸上，一个一个背。轮到我，我一口气背下来：特尔纳特、蒂多雷、莫蒂、马基安、巴占；奈拉、隆托尔、艾岛、伦岛、罗森艾因。背完把纸一卷，等着先生点头。后排一个晒得黑亮的女孩举起了手：“还有一座。”她说的是班达北面的比桑岛，岛上只住着三户人家。我笑着说那么小的岛，不用背吧。她看着我，不生气，说得很慢：“你去问问那三户人家，他们觉不觉得自己小。”先生咳了一声，换了个题目：这些岛上的丁香和肉豆蔻，价钱该由谁来定？有人说马六甲的葡萄牙人，有人说各岛的苏丹。那女孩又举了手，一个字一个字地说：“先让种树的人说价。”先生没说对，也没说不对。散学的时候我才问到她的名字：瓦蒂，班达长老的女儿。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_giri" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那天的岛名我背错了两座，瓦蒂一座也没错。
[tracks.chapters.default]
