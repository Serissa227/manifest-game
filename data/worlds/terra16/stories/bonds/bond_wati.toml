[[tracks.chapters]]
key = "a2"
title = "画在壳里的岛"
text = "瓦蒂托码头上的渔家留了一枚大海贝，壳里白得发亮。她拿刻皮偶剩下的细笔，蘸着红土和蓝靛，在壳里画了一个多月。画成那天，她把海贝放进我手心。壳里是班达：当中一座冒烟的火山，火山脚下一片肉豆蔻园，果子裂开，露出里头红色的衣；海上一条科拉科拉船，两排人在划桨，桨是一根一根画出来的。“把它贴在耳边，”她说，“能听见班达退潮的声音。”我贴上去，听见的是壳里嗡嗡的风声。她伸出小指，点了点壳边一个比芝麻还小的点。“这一座，是比桑。”"
