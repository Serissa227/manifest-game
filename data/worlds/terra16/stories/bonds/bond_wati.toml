# B2 · 1555 · 格雷西克：马六甲来的包买契约
[[tracks.chapters]]
key = "b2"
title = "葡萄牙人的契约"
text = "马六甲来的葡萄牙商人在格雷西克歇脚，带着一份契约，要找顺路的船送去班达，请长老们按手印：往后五年，园子里的肉豆蔻和肉豆蔻衣只许卖给他一家，价钱照纸上写的。他在货栈里把契约念给众人听，念得很快，念完往桌上一放，谁想抄就抄。瓦蒂抄了一份，回到学堂一句一句又看了一遍，脸色越来越难看。她说要给岛上的长老写一封信，赶在那艘船前头送到。可她的马来字写得歪，拼也拼不准。她把抄来的契约推到我面前，压上一块石头。“你是王子，你的字他们认。”我说我也就是个学生。“特尔纳特苏丹的儿子写来的信，”她慢慢地说，“长老们会念两遍。”"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

