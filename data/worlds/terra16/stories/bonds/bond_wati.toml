# A1 · 1556 春 · 学堂办节：拿秤的皮偶（秘密在这里由主角认出，不进见闻）
[[tracks.chapters]]
key = "a1"
title = "影戏里的认错"
text = "学堂办节，院子里点了一排椰油灯。瓦蒂排了一出新戏，把我按在台下的席子上：“这回不用你举灯。你就坐这儿，看。”戏里有个拿秤的人，秤杆上嵌着铜星。他给一船种丁香的人过秤，看反了一格，船走了才发现。后来他背着一袋钱，划着小船从这座岛到那座岛，一户一户去认错；每到一座岛，先被人赶出来一回，又被人喊回去吃一顿饭。台下的人笑得前仰后合，笑那个糊涂秤手连铜星都数不清。我没笑。白布上那杆秤，和她舅舅货栈里那杆一模一样。散场以后，她蹲在白布后面收皮偶，一个一个放进木箱，到最后一个，拿在手里看了很久。“台词是我写的。”她说，“可我还是没去成那些岛。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "gresik"
cast = ["wati"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

