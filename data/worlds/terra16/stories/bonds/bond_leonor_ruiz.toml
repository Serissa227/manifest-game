text = "去西印度的船队夏天就要出港。莱昂诺尔说，官家的河口图十年没改过一笔，桑卢卡尔的沙洲却年年吞船，她要自己去量。我们搭运盐的平底船顺流而下，在桑卢卡尔等落潮。潮水一退，沙洲露出脊背，她把测深绳绕在手腕上，每一布拉萨打一个结，踩着烂泥一路往水道里探，我抱着本子跟在后面记。量到天黑，那条能走大船的水道，比图上偏北了整整一链。回到岸上，她把湿透的绳子一圈圈从手腕上解下来，勒出一道道红印。领航船明天一早要出去探水道，可船上不收铺子里的女孩。她攥着那团绳子，结一个挨一个地硌在掌心里。“你是总署的学徒，”她说，“能不能替我在船上要一个位置？”"
