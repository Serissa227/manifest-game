# C2：总署窗外偷听宇宙志，一张潮水表的背面。
[[tracks.chapters]]
key = "c2"
title = "潮水表的背面"
text = "夏天，赫罗尼莫·德·查韦斯先生在贸易总署讲宇宙志。讲席不收女孩，莱昂诺尔就蹲在窗外的石台阶上，耳朵贴着窗缝听。那天先生在板上画黄道十二宫，一圈套一圈，她在窗外踮着脚也看不见，急得拿指甲抠窗框，抠下一小片绿漆来。散课时她在门口拦住我，把一张瓜达尔基维尔河的潮水表翻过来塞给我。正面印着每天涨落的时辰，背面空着。“你把先生画的抄给我。黄道那一圈，一笔也别少。”她说话快得像倒豆子，眼睛却一直盯着我夹在胳膊底下的笔记本。“你在窗外听了多久了？”“从先生讲第一课起。”她把潮水表往我手里又按了按，“窗台上那几只鸽子都认得我了。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["leonor_ruiz"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

