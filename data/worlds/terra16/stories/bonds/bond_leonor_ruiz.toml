# 莱昂诺尔·鲁伊斯：第一张错图（bond_leonor_ruiz）——C7 重写，2026-10-11，Claude（Opus）执笔。
# 标签：GL（自创主角为女性时）/ BG（为男性时）。莱昂诺尔 romance = any，主角性别由玩家定；第一人称“我”不写性别与外貌。
# 人物：莱昂诺尔·鲁伊斯（leonor_ruiz，1540-06-16，阿雷纳尔码头地图铺的帮工，船夫的女儿，偷听总署的领航课）；
#   主角：custom_seville_pilot（模板生年 1540-01-01，修道院长大的领航学徒）。
#   年龄核对：A1（1556-01..05）主角 16、莱昂诺尔 15；A2（1556-06..11）莱昂诺尔 6 月 16 日满 16；S（1556-12）双方 16；
#   重逢（1562）双方 21—22。心动只在学院期内由故事给出（A1 +6、A2 +6、S +12 = 24），学院期最多到 crush；恋人只在重逢。
# 依据（史实）：塞维利亚贸易总署（Casa de Contratación）设领航总长与宇宙志讲席，1553 年前后由阿隆索·德·查韦斯之子赫罗尼莫讲宇宙志；
#   阿雷纳尔是瓜达尔基维尔河边的码头区，黄金塔在其下游；特里亚纳在对岸，以陶窑与彩釉砖出名；科里亚在塞维利亚下游；
#   桑卢卡尔·德·巴拉梅达的河口沙洲是去西印度船队出入的险处，领航船在此引水；测深用抹牛油的铅锤取底质，水深按布拉萨（约一臂展）计。
# 依据（原创）：地图铺、错图、潮水表背面的黄道图、科里亚的搁浅、桑卢卡尔水道偏北一链的实测、钉在抽屉盖里的第一张错图、
#   特里亚纳的手绘砖（painted_tile，背面画沙洲水道）、给码头小船画的浅滩图、全部台词——TERRA16 §13 的游戏补全。待核：无。
# 秘密：她一直留着自己画错的第一张图提醒自己——A1 才拿给主角看；本文件的章节都没有 stage，不产生任何见闻。
# 去重：不写“把海图署上别人的名字”（归 bond_isabel_soto）；不写“核对迟到消息”；不提诺埃尔；佩德罗·卢纳不出场。
# 阶梯：C2 give_notebook / B1 jump_and_push 给 bond C；B2 get_her_aboard / A1 pin_your_mistake 给 bond B；
#   A2 take_the_tile / bubble_is_best 给 bond A + painted_tile + 回忆。心动：A1 hold_the_candle +6；A2 bubble_is_best +6（要求已有 6）；
#   S heart +12（要求已有 12）——全选心动的人正好 24，够重逢的 love 门槛。决定表写 S +10，算下来只有 22，到不了 24，这里依简报改为 +12。
# 缺省走向：C1—A2 不回应都只是错过一件事，轨道照走；S 不回应 → 开重逢、记 c7_bond_leonor_ruiz_parted；
#   重逢不回应 → 她寄来一封信和一张缩小的浅滩图，记 c7_bond_leonor_ruiz_missed。
# 旗标（写）：c7_bond_leonor_ruiz_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#   c7_tie_new_margarita_leonor_ruiz_taken（S 的 promise 与 heart 设；配角线 tie_new_margarita_leonor_ruiz 据此改走“并肩的朋友”）。
# 旗标（读）：只读本文件自己的 c7_bond_leonor_ruiz_romance（重逢 love）与 c7_bond_leonor_ruiz_parted（重逢变体）。
# 日程：不改。重逢正文里“侯爵府嘴快的侍女”是给玛格丽塔线的伏笔，不点名。

