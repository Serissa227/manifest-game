reply = "她看了我一会儿，把笔搁下了。“当年那句话，”她说，“你还问不问？”我问了。她没有马上答，起身去上了铺子的门板，把桌上那盏灯端起来，往楼梯口走。“楼上就一张桌子，”她回过头说，“图和晚饭得挤着放。”楼上果然只有一张桌子，一半压着图，一半摆着面包、橄榄和一小罐鱼汤。吃饭的时候，她的膝盖抵着我的膝盖，她也没打算挪开。吃到一半，她伸手过来把我的手翻过去，拇指在手背上找了一会儿。当年蜡油烫红的地方早就看不出了，她还是找着了，低下头，在那里吻了一下。“这就是我的答案，”她说，“晚了六年，你别嫌。”窗外的河在涨潮。那盏灯搁在图和面包中间，一直点到后半夜。"
