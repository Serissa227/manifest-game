# A1：秘密揭开——钉在抽屉盖里的第一张错图。
[[tracks.chapters]]
key = "a1"
title = "抽屉盖里的错图"
text = "铺子上了门板，老板回家去了。莱昂诺尔点上一根蜡烛，拉开柜台底下最里面那只抽屉，把盖板翻过来给我看。盖板里面钉着一张发黄的图，四个角各一颗铜钉。那片沙洲歪着，正是我头一天想花两个铜板买走的那张。从那天起它就钉在了这里，再没进过门口的筐。“这是我画的第一张图。”她说，“那年我十一岁，把沙洲画偏了。我爹拿它出过海，在桑卢卡尔的沙洲上搁了一夜，潮水再晚来一个时辰，船就散了。”她每画完一张新图，都要先拉开这只抽屉看它一眼，然后才拿去卖。蜡烛斜了，一滴蜡油落在柜台上。她用指甲把它刮下来；又一滴，又刮掉。她一直盯着那张图，没有看我。“你头一回来，说它白送都不要。”她说，“你说得对。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "seville"
cast = ["leonor_ruiz"]
