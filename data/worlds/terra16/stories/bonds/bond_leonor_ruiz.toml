# C1：码头地图铺，一张不卖的错图。口头禅只在这一章出现。
[[tracks.chapters]]
key = "c1"
title = "不卖的那张图"
text = "阿雷纳尔码头边那间地图铺，门口的筐里插着一卷卷旧图，最便宜的两个铜板一张。我挑了一张瓜达尔基维尔河口的，铜板刚落到柜台上，图还没卷好，就被一只满是炭灰的手抽了回去。“这张不卖。”抽图的是个跟我差不多大的女孩，围裙上全是黑手印。老板拍着脑门赔不是，说是他插错了筐，那是帮工莱昂诺尔的东西。我不服气，指着图上桑卢卡尔那片沙洲：“画成这样，白送我也不要，位置明明画错了。”她没恼，反倒笑出声来，从耳朵后面抽下一截炭笔塞进我手里，又把一张包货的废纸摊在柜台上：“画出来，再争。”我画了。画完一看，我的沙洲歪到了河对岸，比她那张还离谱。她趴在柜台上端详了半天，拿炭笔在我那片沙洲旁边打了个叉。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["leonor_ruiz"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_seville_pilot_school" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

