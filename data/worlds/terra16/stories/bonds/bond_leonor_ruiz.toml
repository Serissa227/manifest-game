key = "a2"
title = "特里亚纳的砖"
text = "入夏以后，莱昂诺尔每天傍晚过河去特里亚纳，在一家陶窑里和泥、搬柴，干了一个多月，换来窑主点头，让她烧一片自己的砖。砖出窑那天，她用一块蓝布包着，在阿雷纳尔的码头上等我。布一层层揭开：正面是一枝花，釉色还亮，花瓣上烧出一个小小的气泡。“窑火不匀，”她抢在我前头说，“不许笑。”她把砖翻过来。背面用釉笔画着桑卢卡尔的沙洲，水道从两片浅滩中间穿过去，比官家的图偏北一链，一笔不差，连那天量出来的几个数都写上了。她把砖重新包好，塞到我手里，布还是温的。“正面是给人看的，”她说，“背面是给你的。”"
