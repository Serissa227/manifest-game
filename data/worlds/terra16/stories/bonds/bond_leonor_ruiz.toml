# B1：秋雨后去科里亚测水深，船搁浅了。
[[tracks.chapters]]
key = "b1"
title = "雨后的浅滩"
text = "连下了几天秋雨，瓜达尔基维尔河涨了又落，河床底下的浅滩都挪了窝。莱昂诺尔拉我上了特里亚纳一个老船夫的小船，往下游科里亚一带去测水深。她的铅锤底下抹着一层牛油，放下去再拉上来，粘着什么沙，就知道底下是什么。我翻着早上记的本子报数，她看着刚拉上来的铅锤报数，报着报着就对不上了。“左边两布拉萨。”我说。“两布拉萨？”她把铅锤一甩，“那边连半布拉萨都没有，你那根绳子是泡水泡缩了吧。”争到第三回，船夫听烦了，往河里啐了一口，一篙把船撑到她说浅的那一侧。“咯”的一声，船底蹭上了沙，再也不动了。莱昂诺尔没生气，蹲在船头笑得直拍膝盖：“你看，河替我们评过了。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["leonor_ruiz"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

