# 小督：替人写的字（bond_kogo）——C7 重写，2026-10-12，Claude（Opus）；C21b 重写，2026-11-12，Claude（Opus）。
# 走向：交易→交情，账一直没清（各取所需；不敞开，到重逢还是一首一升米，心意局里只有那一首不收）。
# 标签：GL（纯 GL；小督 romance = [f]，主角一条澪为女）。学院同学羁绊线 bond_kogo（request，academy = true）+ 重逢 reunion_kogo（main）。
# 人物：小督 kogo（1540-06-16，女，地下官人家的女儿、宫中最末一等的见习，偷偷替人代笔恋歌换米）；一条澪 mio（1540-06-21，女，主角“我”）。
#   大炊御门菖 ayame 只在 B1 作为歌合的胜者被提到；小督从不叫她的名字，只说“那位”“付米的人”（手册 3.7）。
#   声音：轻快、快，一句话里常带一个价（米：升、斗）；碰到家里、碰到那首歌，先讲一个笑话岔开；不说“我写得好”。
#   年龄：学院期 1554-03—1556-12 两人 13—16 岁；A1、A2 的心动选项只写同撑一把伞、同照一面镜子；S 的 heart 只到 crush。重逢 1562 年两人 21—22 岁。
# 依据·史实：天文末年朝廷穷困，下级女房靠代笔、抄写补贴家用；女房词（水叫おひや、饭叫おだい、饿叫ひもじ）；
#   《伊势物语》第六段与第二十三段；歌合由判者判胜负；宝镜寺是京都的尼门迹；1562 年是永禄五年，丰后府内是大友家的居城下町。
# 依据·原创：米袋底下的歌纸与“看一眼也算钱”；“ひもじ”念成“ひめじ”的笑话；B1 那首歌第三句的梅香；纸边批注之间的细线；
#   宝镜寺讲经散后的夜雨石阶；铜镜的旧纹与自调的香饼；S 章她第一次替自己写的回帖与那一首不收米的歌；代笔的奉书与夹在信里的账。
# 口头禅：“字我替你写，心事你自己留着。”原句只在 C1 米铺这一场出现一次（手册 3.7）；她的口头禅改用价钱：“一升一首，改稿另算。”
# 关系会退（C21b；研究 3.3 第 4 场）：B1 加 keep_draft——澪把那张草纸留下，情谊 -4，设 c7_bond_kogo_kept_draft；
#   小督不哭，照常抄书，B2 起不再在纸边批注（B2 的 kept_draft 变体）。tie_new_ayame_kogo 读这个旗标：澪手里有原稿时，菖是来求的。
# 撞车改法（手册 4.2 第 4 条、裁决第 2 条）：七夕的歌只归雪。S 的 promise 改成代笔的生意：澪往后给大名递的奉书、礼状托她写，一封一个价，信里夹着账。
# 心意（C21b，数值见 docs/BALANCE.md）：心动来源 A1 share_umbrella +6、A2 look_together +6、课后同行。
#   heart（头一份：心动 ≥ 12，带 bond S）/ heart_second（已许一份：心动 ≥ 18、口才 eloquence ≥ 5）/
#   heart_third（已许两份及以上：心动 ≥ 26、口才 ≥ 7、镜子托给澪 c7_bond_kogo_mirror）。信物是一首不收米的歌。
#   瞒不住（手册第六节）：许过两份以上的局，她装不知道，价钱照旧；只是那一首不收米的歌，重逢时夹着一张账，写着“一升”。重逢加 pay_the_sheng。
# 缺省走向：C1—A2 的 default 不写效果；S 的 default 开重逢、设 c7_bond_kogo_parted；重逢的 default 是她从府内寄来的一封信，设 c7_bond_kogo_missed。
# 羁绊阶梯：C2 learn_all 给 C；B2 keep_arguing 给 B；A2 hear_mirror / look_together 给 A + blended_incense + 回忆“铜镜与香饼”。
# 旗标：设 c7_bond_kogo_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed / _mirror / _kept_draft / _paid；
#   共用 c7_mio_heart_1 / _2 / _3；S 的 promise 与三档 heart 另设 c7_tie_new_kogo_mae_sumi_taken。
# 日程：不改。小督 1557 年春去西边的歌道之家教一季（随后回上京，赁柿子树下的小屋），1562 年应邀在府内大友家教歌。
# 不写：菖本人的承认（归 tie_new_ayame_kogo，1570）；真荣澄与琉球（归新线，1559 年以后）。

