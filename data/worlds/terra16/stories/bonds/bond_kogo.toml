text = "宝镜寺的讲经散得晚，我们回局时下起了夜雨。石阶被雨水冲得发亮，一级一级往上，看不见头。小督撑伞，我提灯。灯光只照得见脚前两级，雨点打在油纸伞面上噼噼啪啪地响。每转一个弯，伞就往我这边偏一点。转到第三个弯，她的半边肩膀已经露在伞外头了。“你往里来些。”我说。“伞是我的，往哪边歪我说了算。这把伞是赁的，一晚五文，你要撑，另付。”我把灯换到两人中间，腾出一只手握住伞柄往回扶。她的手还在伞柄上，没有松开。“别动，”她说，“灯晃。”她那边的袖子湿到了肘弯。"
