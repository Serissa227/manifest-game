# B1：1554 秋的歌合，菖赢了我。散场后她递来揉软的草纸——代笔的事在这里揭开，归本文件。
[[tracks.chapters]]
key = "b1"
title = "赢了我的那首"
text = "秋天的歌合，题是“怨恋”。菖的那首，判者念了两遍；我的只念了一遍。散场以后，回廊里只剩收屏风的人。小督在柱子后面等我，递过来一张揉得发软的草纸。“赢了你的那首，是我写的。”她说得很快，“那位付了米，两斗，够我家吃到年底。你要骂就骂，骂完把纸还我，那是我最好的一首，就这一张。”我把草纸摊在膝上抹平。第三句涂掉了两个词，改上去的，正是判者念了两遍的那一处。别人写怨恋，都写袖上的露、秋夜的长；她写的是袖子上留下的梅香：人走了，香还在。“第三句，”我问她，“你怎么不用惯常的字？”她抬起头，把我的话又问了一遍：“惯常的字？”"
window = [[1554, 9, 1], [1554, 10, 31]]
at = "kyoto"
cast = ["kogo"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 10, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "so_good"
text = "对她说：第三句写得好，草纸还你。"
reply = "她愣住了：“你……不生气？”“输给这一首，我服气。付米的那一位，下回再算。”我把草纸还给她。她接过去叠成一个小方块，叠得很仔细，嘴上已经换了话：“下回你要赢她，来找我，我给你算便宜些。……不行，这话不算，我收回来。”"
next = "b2"
effects = [{ kind = "affinity", person = "kogo", value = 4 }, { kind = "skill", skill = "poetry", value = 6 }]

[[tracks.chapters.choices]]
key = "ask_why"
text = "问她：为什么要替那一位写？"
reply = "“米。”她说，“两斗。我娘前天还骂我淘米淘得太狠，说淘掉的都是钱。”说完就看着我，等我发火。我没发火，我说那下回我也付米，你替我写一首，赢回来。她把草纸从我膝上抽走：“不行。”我问为什么。“你那一首，我不替。你出三斗也不替。”"
next = "b2"
effects = [{ kind = "affinity", person = "kogo", value = 3 }]

