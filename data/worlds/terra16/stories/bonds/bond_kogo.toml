reply = "我们学到灯油见底。她拿小刀把散开的笔毫修齐，我在底下拢着剪落的毛，没让它掉进砚台。修完她试了一笔：“你是头一个肯学这些的上头的人。”我说我不是上头的人，我是土佐的。她在我的怀纸最后添了一个词，不肯告诉我是什么意思：“这个词另算，等你哪天用得上了，再来付钱。”"
