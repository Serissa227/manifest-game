text = "永禄五年，丰后府内。舅舅家的宴席摆在大厅，正中坐着家臣，屏风边另设了一席，坐的是请来教和歌的女先生。是小督。几个家臣的女儿围着她问东问西，她一个一个答，又低又快：“这个字又写错了，上回说过的。错一个字，罚抄十张，纸钱你家出。”问的人都问完了，她才抬起头，看向门边的我。那面她托我收着的铜镜我带来了，包镜的布换过两回，镜面那道旧痕还在。“一条家的姬君，”她说，“镜子带来了？保管钱我可没答应给。”她伸手把席边一张小案挪过来，往旁边推了推。"

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "kogo", text = "一条姬：府内的宴席，你舅舅家年年都摆，今年你又没来。府内的学生不笨，只是懒，一首歌问我十遍“这样行不行”，就是不肯自己回去再读一回。我教她们写体面的信，写给父亲，写给夫家，写给远处的人。前几天有个姑娘问我，先生自己写信给谁。我说给一个在海上的人，一年一两封，看风。她又问那人回不回信。我说回，字写得比你还难看。你舅舅家里谁写信给谁，我都看得见，你别问，这一样我不卖。米价这里比京都便宜，我如今一个月吃得起两回鱼。附一首，照价，一升，记你账上。小督" }, { kind = "flag", flag = "c7_bond_kogo_missed" }]

[[tracks.chapters.choices]]
key = "read_all"
text = "在小案边坐下，把这几年的信和账跟她对一遍。"
reply = "我把信一封封摊开，按年份排好。宴席那头在唱今样，劝酒的声音一阵高一阵低，我们俩低着头对账。对到第三年那一封，她伸手按住：“这封写得不好。那年家里出了事。”“那年的最短，纸也换了，是包米的纸。”她没接话，把那一封抽出来，翻到背面添了一行小字，又推回给我，写的是那一年家里的事，写得很平，像记账。我顺口问她，舅舅家里谁跟谁通信，哪一位家老常往山口那边写。她把笔搁下：“这一样不卖。”说完接着对账，对出来我还欠她两升半。“明年照旧。你欠的，我记着。”"
next = "done"
effects = [{ kind = "affinity", person = "kogo", value = 5 }, { kind = "relation", person = "kogo", relation = "confidants" }, { kind = "flag", flag = "c7_bond_kogo_landing_friend" }, { kind = "memory", memory = "mem-bond_kogo-reunion", title = "女先生的席位" }]

# that_poem：她念那一首不收米的歌，念完照样收别的米（手册第六节）。
[[tracks.chapters.choices]]
key = "that_poem"
text = "问她：当年那一首不收米的，还记不记得。"
requires = [{ kind = "flag", flag = "c7_bond_kogo_romance" }, { kind = "heart", person = "kogo", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "kogo", ge = 18 }, { kind = "romance_open", romance_open = "kogo" }, { kind = "flag", flag = "c7_mio_heart_2", value = false }]
hint = "要当年那一首是她亲手写给你的、心动 24，而且后头没夹账。"
reply = "她不看我，用教学生的那种又低又快的声音念了出来，一个字不差。念到第三句，她慢了下来，那一句写的是浦户的港口，一条船回来的时候。念完，她说：“你那张纸上有个字洇了，我知道是哪个，我当年就写重了。”她把手放在我的手背上，放得很稳。宴席那头有人在唱今样，她没有松手。过了一会儿，她用另一只手从袖子里抽出一张小账，压在小案上：这一回写的奉书三封，六升。"
next = "done"
effects = [{ kind = "affinity", person = "kogo", value = 5 }, { kind = "relation", person = "kogo", relation = "lovers" }, { kind = "flag", flag = "c7_bond_kogo_landing_love" }, { kind = "memory", memory = "mem-bond_kogo-reunion", title = "女先生的席位" }]

# pay_the_sheng：许过两份以上心意的局。她装不知道，只在那一首后头夹一张账，写着“一升”。付了，账清了，心意也成了生意。
[[tracks.chapters.choices]]
key = "pay_the_sheng"
text = "照她夹在那一首后头的那张账，付一升。"
requires = [{ kind = "flag", flag = "c7_bond_kogo_romance" }, { kind = "flag", flag = "c7_mio_heart_2" }]
hint = "只在那一首寄回来、后头夹着一张账的时候。"
reply = "去年她托商船寄来一张诗笺，抄的就是当年那一首，一字不改，后头夹了一张小账，她的字：一升。我把一升米的钱码在小案上。她看了一眼，收了，收得很利落：“清了。”她把那张小账从我手里抽回去，撕成两半，扔进火盆。“往后奉书两升，礼状一升半，照旧。”她低头去改学生的歌，一首改完，又拿过一首。"
next = "done"
