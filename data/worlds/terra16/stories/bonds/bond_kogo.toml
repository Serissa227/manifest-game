# B2：1555 年，局里抄《伊势物语》。纸边的批注，两句之间的一条细线。kept_draft 局：她不再批注。
[[tracks.chapters]]
key = "b2"
title = "纸边的批注"
text = "这一年，局里派我们抄《伊势物语》。小督抄得快，抄到不服气的地方，就在纸边批一行小字。第六段，男人带着女人私奔，夜里把她藏进仓里，自己守在门口，天亮一看，人已经被鬼吃了。她在纸边批：“她问草上白的是什么，是不是珠子，他都不答。活该。”我借过她的笔，在旁边添了一句：“他守了一夜，弓都没放下。”她没擦，提笔在两句之间画了一条细线：“你抄你的，别批我的批。批一句，算一文。”外头有衣裾擦过地板的声音。“上臈来了！”我们手忙脚乱，把那几页夹进书衣。书衣合上了，那条细线还露着一截在外头。"
