# C1：1554 春，宫外的米铺快关门。米袋底下压着的歌纸；口头禅原句只在这里。
[[tracks.chapters]]
key = "c1"
title = "米袋旁的歌"
text = "米铺的伙计已经在上门板了。我来替局里结这个月的米账，算完账才看见角落里蹲着个宫里装束的女孩，一只手按在米袋上。米袋底下压着一张叠成细条的薄纸，露出来的一角是连绵的假名，细得像檐下的雨丝。“到底买不买？”伙计问她。“等人。”她说得很快。我凑过去看那一角字。她的眼睛先落在我的袖口上，然后才抬起来。“一首歌，三升米，看一眼也算钱。您看了两眼了，我按一眼算，算您便宜。”米铺门口替人写信的老先生，一封收一升半；她报的是两倍。我问她这首歌是写给谁的。她把纸角往米袋底下推进去半寸：“字我替你写，心事你自己留着。”伙计举起了最后一块门板。"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["kogo"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_kyoto_court" }, { kind = "date", from = [1554, 3, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "buy_it"
text = "照她报的价买下这首歌，说我认不得这种连绵的假名，想看她写。"
reply = "我数出铜钱，码在米袋上。她收了钱，手停在半空：“买歌的人，从来不问怎么写。问怎么写，另算。”她跟伙计讨了一张包米的纸，笔尖在砚边舔匀，当着我的面写了一行，一笔连到底，写完才指给我看：这是“あ”，从“安”字草化来的。墨还没干，她就递到我手里，又把米袋底下那张抽出来，叠在上面：“两张，一个价。这一回不另算，下回算。”"
next = "c2"
effects = [{ kind = "affinity", person = "kogo", value = 3 }, { kind = "skill", skill = "calligraphy", value = 4 }]

[[tracks.chapters.choices]]
key = "haggle"
text = "跟她讲价，用船上管账的法子，一升一升地往下砍。"
reply = "我掰着指头跟她算：纸钱、墨钱、她蹲在这儿的工夫，再扣掉买主爽约的晦气。她起先板着脸，一升一升地退，退到一升半，笑出了声，赶紧拿袖子捂住嘴：“哪家的姬君这样讲价？”“跟船上的管账学的。”她又砍了一截：“一升。条件是你没在这儿见过我。没见过我的人，下回来买，照样三升。”我说成交。她把歌纸从米袋底下抽出来递给我，纸角上按出了一个指印。"
next = "c2"
effects = [{ kind = "affinity", person = "kogo", value = 4 }]

# C2：1554 夏，局与局之间的长廊。女房词；“ひもじ”念成“ひめじ”，笔尖按坏了。
[[tracks.chapters]]
key = "c2"
title = "女房词"
text = "我没去告发她。过了半个月，我在两个局之间的长廊上截住她，请她教我女房词。她先往廊子两头看了看，才压低声音：水不叫水，叫“おひや”；饭叫“おだい”；肚子饿了不能说饿，要说“ひもじ”。我一个个跟着念。念到第七个，她不往下说了，笔尖在纸上点了一个墨点。“外头的人拿这些当笑话讲，说宫里的女人连水都不敢叫水。你学它做什么？”我说船上也有船上的切口，听不懂就上不了船。说完我把“ひもじ”念了一遍，念成了“ひめじ”。她一怔，接着笑得整个人伏在纸上，笔尖压在纸面，散成了一把小扫帚：“姬路！你饿了，要去播磨吗？播磨的米倒是便宜，一斗比京里便宜三十文。”她把那支笔拿起来看，笔毫散了，修不回去了。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "kyoto"
cast = ["kogo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

