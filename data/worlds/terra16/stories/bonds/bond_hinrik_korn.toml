reply = "他手里的笔掉在账本上，滚了半圈。耳朵先红了，一路红到脖子根。他弯腰去捡笔，捡了两回才捡起来：“那、那我天天站门口。”我说不用天天。他想了一会儿：“那我挑风大的日子站。风大，船才回得来。”又过了一会儿，他伸手抓了一下我的手，抓得很快，马上就松开了，像碰了一下烧热的炉盖。“这话我记下了。”他没看我，盯着账本上那一滩墨，“等你回来……等咱们都再长大些，我再回你。”我说好。他点点头，把那滩墨描成了一个数。"
