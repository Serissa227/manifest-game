text = "跟他把这一排桶的盖子都撬开，一只一只看过去。"
reply = "撬到第九只，我两只手扎满了木刺。欣里克瞥了一眼，从围裙兜里摸出一根针，一边替我挑刺一边说：“上一个学徒撬到第三只就跑了，说他是来学算账的，不是来当木匠的。”挑完了，他让我把开盖前听出来的数，用粉笔补写在每只桶上，潮的画个圈。九只桶，我画了两个圈，开盖一对，两个都画对了。他没吭声，在圈旁边添了一道勾。"
