# S：冬天，学校散了。我要上船，他留在粮栈；东家开春要他跟船去但泽，他还没说晕船。
[[tracks.chapters]]
key = "s"
title = "桶可以空"
text = "河面结了薄冰，驳船都歇了。粮栈的门半掩着，欣里克在里头点最后一遍年账，听见我的脚步，头也没抬：“你的船哪天走？”我说过了年，从特拉沃明德走。他“嗯”了一声，在账上划了一道。“东家开春要派人跟船去但泽，问我去不去。”笔尖停住了，“我还没跟他说。”没说去，也没说不去。他把笔尖在墨水瓶口刮了又刮。他合上账本，拿指节在柜台上叩了叩，柜台是实心的，声音闷得很。“你走以后，我照样敲桶。敲到哪天站在船上敲也不吐了，我就去找你。”他抬起头，“找不着呢？”"
