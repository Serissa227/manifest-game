# A1：他没考我听桶，滚出一只空桶让我坐，看船进港，讲卑尔根、但泽和一条自己的船。
[[tracks.chapters]]
key = "a1"
title = "没敲桶的下午"
text = "那天下午欣里克没考我。他从仓里滚出一只空桶，立在河边的石阶上，拍了拍桶盖：“坐。”桶只够坐一个人，他自己蹲在旁边，看河口那头一条货船慢慢顶着水上来。“我最远到过特拉沃明德。”他说，“就那儿。走路半天，坐船更快。坐船……算了，走路也一样。”后半句他说得很快，像怕我接话。“卑尔根的码头是木头的，一整排房子，全是我们汉萨的商站。但泽的粮仓五层，五层！”他两只手往上比划，“我想要一条自己的船。不用大，装两百桶就够。在但泽装黑麦，到卑尔根换鳕鱼干，回来的时候……”船靠岸了，船上有人喊起了号子。他没往下说，捡起一颗小石子往桶上一敲，咚，空的。“这只桶，”他说，“等我有了船，第一只装上去。”"
