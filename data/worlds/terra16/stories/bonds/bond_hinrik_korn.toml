# B1：盘点比赛。我快一刻钟却漏一桶，他找出来；我找出他重了一个号。各认一处。
[[tracks.chapters]]
key = "b1"
title = "差了一桶"
text = "这一回仓里盘点，东家拿一枚芬尼当彩头：谁先把一个仓数完，归谁。我数完的时候，沙漏还剩一截，欣里克那边才到第四排；算下来，我快了一刻钟。我把石板一亮：“三百零二。”他不急着认输，把粉笔往耳朵后一夹，沿着我数过的那排慢慢走，走到最里头的角落，弯腰从两只大桶的缝里拖出一只小桶来。“三百零三。它躲着你。”我脸上发烫，接过他的石板翻看，翻到第二遍，指着两个一模一样的数：“一百一十七，你写了两回。”他盯着那两个数看了半天，嘴硬了一句“笔滑了”，到底还是点了头。一处漏，一处重。我们把两块石板并排摆着看，毛病出在一个地方：桶摆得乱，号是随手写的。欣里克把粉笔从耳朵后头拿下来：“那就重排。排到下一班那个最糊涂的也数得清。”"
