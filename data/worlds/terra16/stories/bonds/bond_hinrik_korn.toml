# A2：他把用旧的铜算筹装进自己缝的小袋送我；缺角的那枚是他推账打头用的。
[[tracks.chapters]]
key = "a2"
title = "旧算筹"
text = "欣里克把一只小布袋往我的账桌上一放，袋口的绳子打了个死结。“拿着。”我解了半天才解开。里头是铜算筹，纽伦堡打的那种，二十来枚，面上的花纹快磨没了。有一枚缺了个角，缺口也磨圆了——他推算筹，回回拿这一枚打头，我认得。“我换了一副新的，这副用不上了。”他说得飞快，眼睛看着别处，“袋子是我自己缝的，针脚不许笑。”针脚确实是歪的。我把算筹一枚枚摊在格子布上，捏起缺角的那枚：“这枚你也给我？”他愣了一下，嘴角慢慢翘起来，像一口憋了很久的气这会儿才吐出来。“我就知道你认得。”他把两只手往围裙上一擦，“那你说，怎么分。”"
