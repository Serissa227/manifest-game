# 重逢：1563 年秋冬，吕贝克随丹麦对瑞典开战，粮栈门口排着给舰队领粮的队。他自己报了名押粮，晕船的事还没跟东家说。
[[tracks.chapters]]
key = "reunion"
title = "战讯后的粮栈"
text = "仗是八月里打起来的：吕贝克跟着丹麦人，打瑞典。等我回到吕贝克，粮栈门口的队已经排到了街角，全是各条船派来领粮的人，手里攥着盖了章的条子。欣里克站在门槛上——如今整座仓归他管——比当年高出一个头，围裙换成了皮的，嗓门一点没变：“鹈鹕号，黑麦四十桶，咸肉十二！圣灵号下午来，别挤！”他看见了我，抬了一下下巴，没停，一条船一条船把份额念完，才跳下门槛，把一叠名单往我怀里一塞。“先帮我拿着。”口气像我昨天才走，“七年了，你倒是没变，还专挑最忙的时候来。”名单一页一页，人名、船名、桶数。最底下一页，用另一种墨水添了一行：押粮，科恩。我抬头看他。他伸手把那一页翻了过去。“下个月补给船出海，押粮的是我，我自己报的名。”他压低了声音，“有件事，我还没跟东家说。”他没说是什么事。"
