# C2：仓角受潮的一袋。颜色看不出，手指摸得出；墙后面在漏。
[[tracks.chapters]]
key = "c2"
title = "受潮的一袋"
text = "仓库最里头那一垛麻袋，看过去都是一个颜色。欣里克蹲下去，手伸到最底下那一袋的袋角捏了一捏，眉头就皱起来了。“你摸。”我摸了：麻布发软，发凉，比旁边的袋子沉一点点，像刚从井台上拿回来的抹布。眼睛看不出，手指头知道。“东家要是在，准说倒进干的里头匀一匀。一袋潮的掺进二十袋干的，吃不出来，账上也不少。”他已经把那一袋扛上了肩，“我不干。匀进去，下个月就是二十一袋潮的。”我们把它单搬到门口晾着。他回到原处，把手掌按在那袋子靠过的墙上，按了好一会儿，又屈起指节敲了敲，像敲桶。“听见没有？后头是空的。”他把手在围裙上擦了擦，“账能记一袋损失，记不了一面墙。”"
