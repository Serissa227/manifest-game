text = "约好比一比：看谁先当上船长，或者谁先管上一座仓。"
reply = "“那我先管仓。”他答得飞快，“船长慢慢来。”我说你怕了。他把账本一拍：“桶可以空，话不能说满。”说完，他先绷不住，笑出了声。我们隔着柜台击了一下掌，他手心全是粉笔灰，在我手背上留下一个白印子。“记着，”他说，“谁输了，谁请对方一桶啤酒，满的。我会敲的，别想拿半桶糊弄我。”我说那你也记着，船长也算数，到时候我站在码头上，看你自己走下跳板。他没接话，低头把那道账又划了一遍，划得很重，笔尖把纸都划毛了。"
