# B2：但泽来的粮船锚在特拉沃明德外，说少了六桶。他上船就吐，求我别说出去。
[[tracks.chapters]]
key = "b2"
title = "锚地上的船"
text = "但泽来的那条粮船吃水深，进不了河，锚在特拉沃明德外头，粮食靠驳船一趟趟往上运。卸完了，船主拿着提单找上门：装的一百二十桶，粮栈的收条上只有一百一十四。“你们粮栈的人，眼睛长哪儿去了？”欣里克把收条拍在桌上：“我自己点的。上船，看舱里还剩什么。”小艇一出河口，浪就上来了。他一路坐得笔直，盯着前头那根桅杆，一句话不说。爬上舷梯，脚刚落到甲板，他就扑到船舷边，吐得整个人弓起来。桅杆底下的水手哄地笑了。我挡在他和那帮人中间。他拿袖子抹了嘴，脸白得像没上漆的桶板，一把攥住我的胳膊，攥得很紧。“别说出去。”他声音压得很低，“谁也别说。我要当船长的。我……一上船就这样，从小就这样，一回都没好过。”舱口开着，底下垫桶的木架上，空着六个窝，一个挨一个。"
