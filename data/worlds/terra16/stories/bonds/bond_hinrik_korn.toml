reply = "“敢。”他答得比谁都快，“赌什么？”我说赌一桶黑麦，满的。出海那天天还没亮，补给船从特拉沃明德起锚，我站在岸上看。他站在船尾，站得笔直，一直站成了海上的一个小点。十几天以后船回来，他头一个下跳板，脸是青的，衣襟上全是盐霜。他走到我跟前，先喘了口气：“吐了一路。没跳下去。”我问这赌算谁赢。他想了半天：“我赢一半。上了船、没跳，是我的一半；吐了，算你的一半。”他把半桶黑麦的提货条塞给我，“另外半桶，等我下回出海回来再还。”"
