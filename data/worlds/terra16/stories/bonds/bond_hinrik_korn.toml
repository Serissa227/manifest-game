# C1：粮栈里听桶。第三只桶是满的，潮了，声音发闷。
[[tracks.chapters]]
key = "c1"
title = "空桶的声"
text = "粮栈里冷，黑麦的灰直往鼻子里钻。欣里克把两只桶并排推到我跟前，屈起指节各敲一下，一声空，一声实。“哪只是满的？新来的。”我指了左边。他挑了挑眉，没夸我，转身又从墙角滚来第三只，桶底在石板上咕噜噜响。“再来。桶可以空，数不能空——账上写一百桶，就得是一百桶，你的耳朵得跟着账走。”他敲了三下，声音又闷又短，像敲在湿木头上。我说空的。他咧嘴一笑，拿撬棍别开桶盖：满满一桶黑麦，上头一层结了块，灰绿色，一掰就碎成潮乎乎的渣。他抓一把搁进我手心：“满的。潮了就是这个声，哑得跟空桶差不多。你刚才猜对一回，别当自己学会了。猜对一回的人我见多了，第二回准栽。”我手心里那块麦子凉冰冰的，带着一股霉味。他已经把粉笔递了过来：“记上，潮的，第三十七。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "lubeck"
cast = ["hinrik_korn"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_lubeck_countinghouse" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

