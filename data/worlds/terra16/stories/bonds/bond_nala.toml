# S：1556 年腊月，屋顶。我开春回阿尔及尔上船；走以前，那首歌得唱完一遍。
[[tracks.chapters]]
key = "s"
title = "唱完的那一遍"
text = "年底，阿尔及尔来了信：开春，港里有一条加列奥特归我管。卡拉维因的先生叹着气，在我的书上签了字。娜拉听说了，什么也没问，傍晚把我拉上她家屋顶。琴已经调好，宣礼塔的声音刚落。“你要走，走就是了。”她把琴抱在怀里，“走以前，那首格拉纳达的歌，从头到尾唱一遍。这回不许忘词。”“要是忘了呢？”“忘了就别走。”她说得一本正经，手指已经搭在弦上。楼下她姨妈在骂猫，染坊的味道顺着风飘过来。那年夏天在院子里卡住的那一句，这些天我每晚睡前都念一遍——可真站在她面前，嗓子还是紧的。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "fez"
cast = ["nala"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

