text = "先讲条件：她赎回母亲那把琴的那天，我来当第一个听众"
reply = "我没急着唱，先跟她讲条件：等她把梅拉区橱窗里那把琴赎回来，第一首，得弹给我听。“那你可得付钱，”她说，“第一首最贵。”“我劫一船货来付。”“就知道你要说这个。”她拨了一下弦，“只劫货，不劫人——你这句天天挂在嘴上，比你祖母的诗记得牢。”我说那是自然，诗会忘词，饭碗不会。她骂了我一句，把琴往膝上一摆：“价钱以后再谈，歌今天得唱。”唱到当年卡住的地方，我又卡住了。她没接，弹了一段过门，等我自己找回下一段。"
