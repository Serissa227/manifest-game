reply = "客人散尽，主人家的仆人开始收灯。我从她手里接过琴囊，往背上一甩：“我送你。”她没推辞。我们走过安达卢斯区的窄巷，她一路给我讲这几年：在阿尔及尔的码头上唱过，在一个法官家的婚宴上把新郎的叔叔唱哭过，攒钱攒到最后那个冬天，饿着肚子去敲梅拉区那家铺子的门。我给她讲海上的事，讲到一半，发现她没在听，在看我。到了她家门口，她把琴从我背上接过去，抱在怀里：“你背得比我稳。”“剩下的半句呢？”她仰起脸，吻了我。这条街上住的都是格拉纳达人，有扇窗开了又关上。然后她贴着我的耳朵，把那半句唱完了。"
