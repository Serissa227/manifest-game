# C2：1554 年夏，乐师家的院子。口头禅只在这里用一次。
[[tracks.chapters]]
key = "c2"
title = "这一遍你唱"
text = "娜拉在乐师家的院子里教五六个孩子唱努巴，叫我坐在一边拿手鼓打拍子。打了不到半首，我就管不住嘴了：教孩子们把“夜莺”唱成“野猫”，又学隔壁卖油的老头咳嗽。孩子们笑得滚到地上，拍子早散了。娜拉把琴往膝上一放：“这一遍你唱，别又用笑话混过去。”院子一下静了，孩子们全盯着我。我清了清嗓子，唱祖母教我的那首格拉纳达的歌，唱的是城里的水渠和一扇朝南的窗。唱到第三段，下一句怎么也想不起来，我张着嘴愣在那儿。她接了下去，一个字都不差，连祖母唱到这里要换的那口气，都换在同一个地方。唱完那一句，她停下来看我：“你也会这首？”“我祖母教的。你呢？”“我娘。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["nala"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

