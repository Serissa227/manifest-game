# B1：1554 年秋，萨阿德的新王进城换了钱。梅拉区乐器铺的橱窗。
[[tracks.chapters]]
key = "b1"
title = "橱窗里的旧琴"
text = "九月里新王的兵进了城，换了旗，也换了钱。娜拉说梅拉区有家铺子卖好弦，带我穿过犹太区的窄街。到了那家乐器铺，她没进门，在橱窗前站住了。橱窗里挂着一把旧乌德琴，琴面镶着一圈螺钿，有一处缺了一小块，像月亮被咬了一口。她看了很久，久到店里的伙计探出头来。“那是我娘的琴。”她说，“前年家里断了粮，我娘拿它换了两袋麦子。”她从腰带里摸出一个小布袋，掂了掂，里面叮当响——旧王的铜钱，新王的银币，混在一起。她把袋口扎紧：“还差得远。”说完就走，走得很快，我得小跑才跟得上。到了街角，她才想起来，我们是来买弦的。"
