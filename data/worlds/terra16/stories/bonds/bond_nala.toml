# A2：1556 年夏秋。姨妈厨房里的玫瑰糖（赠礼 rose_sweets）。
[[tracks.chapters]]
key = "a2"
title = "玫瑰糖"
text = "娜拉从她姨妈的厨房里拿来一个小陶罐，罐口用油纸扎着，往我面前一放：“玫瑰糖。谢你这两年在院子里替我打拍子，别以为我会忘。”她又特意交代，姨妈这回把香调淡了：“不然你会以为在吃香水。”罐身上还沾着一点面粉，看得出是刚从灶台边拿来的。油纸一揭，屋里全是玫瑰味。糖切成小方块，粉红的，上头撒着碎杏仁。我捏起一块，她就盯着我看，看得很认真，跟诗会上听我有没有抢拍子时一个样子。我把糖放进嘴里。她往前倾了一点：“怎么样？”"
