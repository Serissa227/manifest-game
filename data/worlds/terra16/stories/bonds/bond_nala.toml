# 重逢：1562 年，安达卢斯区的诗会。她抱着那把螺钿旧琴，角落里有个学者在抄她的词。
[[tracks.chapters]]
key = "reunion"
title = "曲里的故乡"
text = "六年后我回到非斯。安达卢斯区一户人家办诗会，院子里坐满了人，门口还站了一圈。听说今晚唱的是娜拉，报酬开唱以前就谈定了，唱哪几首由她自己挑，主人家一句也插不上。我挤到墙根底下。她坐在院子当中，怀里抱着一把乌德琴。琴面那圈螺钿上缺的那一小块，我隔着半个院子就认出来了。角落里有个年轻学者，膝上摊着本子，她唱一句他抄一句，笔快得像在追她。她唱完一段，抬眼扫了一圈，看见了我。没笑，也没停，只冲我扬了扬下巴。下一首，她拨了两下弦，是那首格拉纳达的歌。唱到当年我卡住的那一句，她往我这边看了一眼，嘴角动了动。"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "fez"
cast = ["nala"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "nala", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "nala", text = "塔里克：你没来。今年非斯的诗会我唱了十一场，每一场都往门口看。不怪你，海上的事我知道，船比人难等。琴赎回来了。前年冬天，钱刚好够，我抱着它从梅拉区走回家，一路不敢走快，怕摔。琴面上那块缺口还在，我没让人补，补了就不是我娘那把了。赎回来那天，第一首弹给我娘。她听完没夸，伸手把琴颈上的弦轴拧回去半圈，说她当年就是这么调的。第二首本该轮到你，你不在，我就没弹，那一首还欠着。托人给你捎去一张曲谱，是那首格拉纳达的歌。我请抄书铺的人照我唱的一句句记下来，水渠那段、朝南的窗那段都记全了，连你祖母爱拖的那个尾音也画上了。你那边的调跟我家的不一样，两种我都写了，你那种写在上面。最后一句旁边，是我自己写的：这一遍你唱。你认得出我的字。下回船到了，先来唱，唱完再讲笑话。不来也行，曲谱别弄丢。——娜拉" }, { kind = "flag", flag = "c7_bond_nala_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "听她唱完；散场后约好，以后每回到非斯都先来听她唱"
reply = "散场以后，她把主人家给的钱数了两遍，数得仔仔细细，然后拉我去集市边上一家小馆子，要了一锅羊肉，说她请。我问那把琴。她说是前年冬天赎回来的，钱里有婚宴的赏钱、诗会的报酬，还有她这几年往返阿尔及尔走唱攒下的。“赎回来那天，第一首弹给我娘。”她用手指摸了摸琴面那块缺口，“第二首才轮到你。你不在，我就对着往阿尔及尔去的那条路弹了。”“那也算数。”“算数。”她给我添了一勺汤，“以后你每回到非斯，先来听我唱。听完了，笑话随你讲。”我说我攒了一肚子，海上的、阿尔及尔的、西班牙人的。她说那就一个一个讲，讲得不好笑的，罚唱一首。"
