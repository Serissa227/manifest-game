# C1：1554 年初，城里刚遭过兵。安达卢斯区的婚礼上，一根弦断了。
[[tracks.chapters]]
key = "c1"
title = "断弦"
text = "安达卢斯区一户人家娶亲。城里刚过完兵，巷口的墙还是黑的，这家的鼓却敲得比谁家都响。弹乌德琴的是乐师家的女儿娜拉，手指快得看不清。弹到新娘进门那一段，满院子的人跟着拍手，“嘣”的一声，一根弦断了，弦头抽在她手背上。拍手声一下停了，所有人都看她。我正愁没机会在人前露脸，抱着自己的琴挤过去：“用我的！阿尔及尔带来的，弦是新换的——”她看都没看我，用剩下的弦接着弹，缺的那几个音挪到别的弦上，弹得比刚才还好。弹完，新郎的老娘在台阶上嘟囔：“喜事上断弦，不吉利。”院子里跟着嗡嗡起来。娜拉蹲下去，把那截断弦一圈一圈卷好，塞进袖子里，抬头看我，像看一个多嘴的客人：“琴收好吧。你就是跟土耳其兵一块儿进城的那个？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "fez"
cast = ["nala"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

