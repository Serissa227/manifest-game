# 断弦（bond_nala）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用两条轨道 key、章节 key、at = fez、窗口与 1562 年重逢。
# 标签：BG 羁绊线。娜拉只对男性心动（romance.with = m）；塔里克（any）主动，或两人对等。
# 人物：娜拉 nala（1540-06-07，女）；主角塔里克·加尔纳蒂 tariq（1540-01-02，男），第一人称“我”，speaker = captain。
#       学院期 1554-01—1556-12：塔里克 13—16 岁，娜拉 13—16 岁，同为未成年、生年差不到半岁。
#       心动：A1（1556-01..05，塔里克 15—16、娜拉 15）+6；A2（1556-06..11，塔里克 16、娜拉 15—16）+6；S（1556-12，两人都 16）+12 与 crush，告白只到牵手。
#       恋人只在重逢（1562，两人 21—22 岁），要 c7_bond_nala_romance + 心动 ≥ 24 + 双方满 18。
# 依据：
#   史实——1554 年 1 月萨拉赫·雷斯带阿尔及尔的奥斯曼兵扶瓦塔斯王朝的布·哈松进非斯，城里遭了劫；同年 9 月萨阿德王朝夺回非斯，新王铸新币；
#         非斯老城的安达卢斯区住着格拉纳达陷落后渡海来的人家，梅拉区（犹太区）在新城；安达卢斯的努巴组曲在婚礼与诗会上唱；
#         格拉纳达阿尔拜辛的清真寺改作教堂以后，宣礼塔多改成钟楼（圣何塞教堂的塔即是）。
#   原创——两人的故事、断弦、祖母那首唱水渠与朝南窗子的歌、梅拉区乐器铺橱窗里那把缺了一块螺钿的旧琴、诗会的白胡子老乐师、屋顶调弦、姨妈的玫瑰糖。
#   待核——“对着宣礼塔的声音调琴、格拉纳达全城的琴是一个音”是娜拉母亲的说法，当作家传的讲究写，不当史实；非斯近处的宣礼跟着卡拉维因起，只作氛围。
# 缺省走向：玩家不选时，各章 default 无效果、照样往下走；S 的 default 开重逢并设 _parted；重逢错过时娜拉来信，捎来那首歌的曲谱，设 _missed。
# 羁绊阶梯：C2 finish_it 给 bond C；B1 ask_the_price 补签 C；B2 hold_steady 给 B；A1 coin_in_jar 补签 B；A2 take_the_jar / feed_her_one 给 A + 玫瑰糖 + 回忆。
#   心动：A1 hum_her_mistake +6 → A2 feed_her_one（要 ≥ 6）+6 → S heart（要 ≥ 12）+12 = 24，正好够重逢的 love（简报改 S 为 +12，照办）。
# 旗标：写 c7_bond_nala_coin（A1 coin_in_jar，A2 的 variants 读）、c7_bond_nala_promise / _romance / _own / _parted、
#       c7_bond_nala_landing_friend / _landing_love / _missed；重逢的 variants 读 _romance。
#       S 的 promise 与 heart 都写 c7_tie_new_idriss_qalam_nala_taken（配角线 tie_new_idriss_qalam_nala 据此改走“并肩的朋友”）。
# 重逢里角落抄词的年轻学者就是伊德里斯（他们 1559 年相识，1562 年还只是朋友），本文件不点名、不写两人的事。
# 秘密：娜拉攒钱赎回母亲那把琴——B1 起主角知道；本线没有 stage，不写见闻，这件事永远不进见闻。
# 日程：无需改动。

