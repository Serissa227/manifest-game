[[tracks.chapters.choices]]
key = "promise"
text = "唱完它；约好以后回非斯，先唱给她听，再讲笑话"
requires = [{ kind = "bond", person = "nala", level = "A" }]
hint = "这样的约，得先在她面前唱过、错过、熟透了才许得出口；又或者，这句话我已经对另一个人说过了。"
reply = "我从头唱起。水渠，朝南的窗，祖母拖长的那个尾音，一句一句唱过去。唱到当年卡住的地方，嗓子抖了一下，词没丢。她的琴一直跟着，跟到最后一个音，手掌按住了弦。“这回算你过关。”我说以后每回到非斯，船一靠岸，先来这屋顶上唱一遍，唱完再讲笑话。她说笑话可以免了。她从袖子里摸出一样东西放在我手心——一截卷得紧紧的羊肠弦，快三年前婚礼上断的那一根。“凭据。哪回你来了不唱，我就拿它勒你。”我把那截弦缠在祖母那把门钥匙上，绕了三圈，打了个结。她看着那把钥匙，没问它开哪扇门。"
