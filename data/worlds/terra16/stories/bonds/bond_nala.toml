[[tracks.chapters.choices]]
key = "heart"
text = "唱到最后一句停下，让她来接；约好长大再见时一起唱完"
requires = [{ kind = "bond", person = "nala", level = "A" }, { kind = "heart", person = "nala", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "nala", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "nala" }]
hint = "把最后一句留给她接，光熟还不够，得先有屋顶上那些黄昏、那罐糖垫在前头；又或者，这样的一句，我早已留给了另一个人。"
reply = "我一句一句唱下去，唱到最后一句，停了。她的琴也停了，抬头看我。我说：“最后一句你来。”她张口接了半句，又停住。屋顶上只剩晾着的毯子被风吹得扑扑响。她看着我，看了很久。“剩下的半句，等你回来。”她说，“等你长成个像样的大人，不靠笑话也敢站在人前，再来跟我一起唱完。”我说那得好几年。她说她等得起，攒琴钱都攒了四年了。下楼的时候楼梯很黑，她走在前面，伸手往后一摸，握住了我的手——弹琴的那只。到了院子里，灯光照过来，她才松开。"
