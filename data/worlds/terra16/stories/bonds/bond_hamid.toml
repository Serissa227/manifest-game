# 重逢 · 1562 · 摩加迪沙老城：门楣上的木牌，卡里姆喊的是“哈米德”
[[tracks.chapters]]
key = "reunion"
title = "自己的门牌"
text = "摩加迪沙老城的巷子窄，两边白墙晒得发烫。我在码头上问哈米德的铺子，脚夫没问是哪个哈米德，抬手就指了巷子。巷子尽头一扇新漆的门，门楣上钉着一块木牌，刀口还新：哈米德商号。没有“谁家的”，没有“谁的儿子”，只有他自己的名字。门里有人跟脚夫算账，声音还是那么轻，数却报得又快又准。我正要敲门，一个骑驴的男人从巷口过来，在门前勒住驴，冲里头喊：“哈米德！傍晚那批乳香你去点，我那边走不开。”是卡里姆。他喊完就走了，驴蹄子扬起一溜白灰。哈米德出来时怀里抱着一摞账本，看见我愣了一下，接着把整摞账本塞进我怀里：“来得正好。这几年的季风账，你从头核，看有没有算错的。”"
