hint = "这一生只许一回的约，你已经许给了别人；今晚只能跟他道一声顺风。"
reply = "“每年一封。”我说，“东北风来以前，你把你算的开船日写给我，我把我的写给你。谁算得准，下一年谁先写。”哈米德想了想：“输的先写，才对。”“那你得常常先写。”他没理我，从怀里掏出一张纸，叫我把基尔瓦的地址报一遍。我报了，他一边写一边皱眉，写完把纸转过来：“你家那条巷子，你自己都念错一个音。”他照写季风表的规矩，把巷名一个字母一个字母重拼了一遍，比我念的对。天快亮时他背上箱子，走到住宿区门口又回头：“第一封我先写。别以为是我认输。”“那是为什么？”“你的地址，只有我写得对。”"
