title = "早了一个月"
text = "家信是傍晚跟着苏伊士来的驼队到的。哈米德在廊下拆开，看了一遍，又看了一遍，然后上了屋顶。半夜我爬上去找他。杰巴尔提的屋顶平得能睡人，他坐在边上，信摊在膝盖上，拿一块碎瓦压着。“我哥写的。”他把信递给我，指着末尾几行。卡里姆的字写得很宽：“照你说的日子，我在船上给你留了铺位，船在亚丁等你。老领航说那个日子风还没转过来。我没跟他争——你算的，你说了算。”哈米德说，他把纳吾肉孜的日数换成回历的月份写回家，换错了一个月。差的不止一天，是整整一个月。他把碎瓦拿起来，又放下。“别告诉任何人。”过了一会儿，他又问：“这封回信……该怎么写？”"
