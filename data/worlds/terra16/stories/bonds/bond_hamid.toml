[[tracks.chapters.choices]]
key = "check_ledger"
text = "坐下来，把他的季风账从头核到尾。"
reply = "我在他铺子里坐了两个下午。账一年一册，摞了五册。头两册他抽走了：“那是替我哥记的，不算。”剩下三册，每册从纳吾肉孜那天起头，一格一天：风向、哪条船出港、哪条船迟了几天、为什么迟。字比在开罗时小，也比那时候稳。核到第二册，我找着一处：一条去霍尔木兹的船，回程他多记了一天。我把手指按在那一格上。他凑过来，盯着那一格，嘴唇动着把那几天又数了一遍，才拿笔改了。“三年来头一处。”“比我少。”我说，“我的账，一年能挑出三处。”他请我吃饭，羊肉饭配加了小豆蔻的茶。吃到一半，卡里姆掀帘子进来，自己找个位子坐下，抓了一块羊肉，冲我说：“我这个弟弟，现在算得比我准。”哈米德没抬头，把茶壶推到他哥面前。"
next = "done"
