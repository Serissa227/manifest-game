news = "开罗杰巴尔提住宿区这个月空了一半，东非来的学生都赶着东北风回家；摩加迪沙那个学生的箱子里，听说装的全是季风表。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

