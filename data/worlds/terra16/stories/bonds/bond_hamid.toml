# 哈米德（bond_hamid / reunion_hamid）——C7 重写，2026-10-11，Claude（Opus）执笔。
# 标签：对手（rival）·羁绊线。哈米德不开放恋爱，全线只写友情与较劲，不写心动选项，也不写心照不宣的段落。
# 人物：哈米德（hamid，1540-02-04），摩加迪沙船主家的次子，开罗爱资哈尔杰巴尔提住宿区的学生；
#       主角巴拉卡·宾·萨利姆（baraka，1540-07-23），基尔瓦人，同住杰巴尔提；
#       卡里姆（karim，1535-02-03），哈米德的哥哥，只在 B2 的家信与重逢里露面，不写他自己的事（归 pair_karim_mansur）。
#       学院期（1554—1556）主角 13 到 16 岁，哈米德 13 到 16 岁；重逢 1562 年两人都已二十出头。
# 依据（史实）：爱资哈尔按家乡分住宿区，杰巴尔提收泽拉与非洲之角来的学生；算学用撒沙的算板；
#   印度洋的领航人按“纳吾肉孜”起算的日数排开船日（伊本·马吉德一派的写法），季风账里一格一天；
#   基尔瓦与摩加迪沙在斯瓦希里—索马里海岸上争黄金与过路船，两边的人互相看不上；摩加迪沙老城是白墙窄巷；
#   利昂戈（Fumo Liongo）是帕泰、上加一带口传的诗人英雄：母亲不是正妻，王位给了兄弟姆林瓦里；被囚时母亲送来烤着锉刀的面包，
#   他请人在牢外吹号打鼓、自己唱歌，盖住锉铁链的声音；最后跪在井边死去，弓还拉满，城里人几天不敢去打水。
# 依据（原创）：季风表上跳掉的第九十七天、换算回历时错的一个月、卡里姆的家信、井边缺口的水罐、算板上的那一行、
#   被骗的铜盘、爷爷早了一年的朝觐、芝麻饼、门房墙上的小路图、刻坏的船头改成海鸥、商号的木牌、拉穆赛船，全部台词。
#   待核：利昂戈与姆林瓦里的长幼各本说法不一，A1 用主角爷爷那一路的讲法（国王是利昂戈的弟弟），正文只用“说书的”口吻。
#   简报 A1 写“吹着号角死在井边”，与传说不合（号角在越狱那一段，死时是拉弓），选项与回复照传说改写。
# 秘密：哈米德第一次独自算季风，把回家的日子算早了一个月——B2 由卡里姆的家信揭出、只让主角知道；任何见闻都不写。
#   口头禅“你有你的海，我有我的潮。”原句只在 C1 正文出现一次；S 的 own 回复与重逢变体用改了字句的呼应，来信里不照搬。
# 缺省走向：C1 被叫作“卡里姆的弟弟”→ C2 自排的季风表跳了一天 → B1 算板上输了、脱口提哥哥 → B2 家信揭出归期早了一个月
#   → A1 芝麻饼与“当不成船长算不算输” → A2 刻坏的小船（只有 read_name 送出 carved_boat）→ S 主角不在场：设 _parted，照样开启重逢
#   → 重逢 1562 摩加迪沙：主角不在场就收到他的一封来信（_missed）。
# 落点：友情（friends，_landing_friend）与对手（rivals，_landing_rival）两种；S 的 promise 为一生一约（bond S + friends），own 为约好较量（rivals）。
# 旗标：写 c7_bond_hamid_promise / _own / _parted / _landing_friend / _landing_rival / _missed；重逢的变体读本文件的 _promise 与 _own。不读别线旗标。
# 日程：不改。重逢在 mogadishu（哈米德 1557 年起在摩加迪沙）。

