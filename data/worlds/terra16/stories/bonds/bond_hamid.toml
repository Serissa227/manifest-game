text = "账先放着，约他比一程：明早出港，谁的船先到拉穆。"
reply = "“账先放着。”我说，“明早出港，比一程，看谁先到拉穆。”哈米德把账本往门里一扔：“你那条船吃水深，巴准群岛那片浅滩你得绕外海。”“绕就绕，我有风。”“风是大家的。”第二天天没亮，两条船前后脚出了摩加迪沙。他贴着岸走，钻礁石缝；我在外海追了三天，第四天中午才看见拉穆的沙丘。他已经坐在码头的石阶上，脚边一筐椰子，剥开了两个。“晚了半天。”他递给我一个，“今年潮在我这边。”“明年呢？”“明年你自己算。算对了再来。”"
