reply = "那张图钉在住宿区门房的墙上，是他前年替新来的学生画的：从爱资哈尔到哈利利市场，哪条巷子近，哪家铜匠不坑人，哪个水摊的水是刚从尼罗河挑来的。如今图上添满了别人的记号：有人画了颗星，有人在一家香料铺旁边写了个“贵”，角上还有个泽拉来的孩子歪歪扭扭写的“谢谢”。哈米德站在图前看了很久：“我都忘了画过这个。”“十几个人没忘。”我说，“开路的人，不一定非得当船长。”他伸手，在那个“贵”字旁边添了一个字：“很”。"
next = "a2"
effects = [{ kind = "affinity", person = "hamid", value = 3 }]

# A2 · 1556 秋 · 刻坏的船头改成海鸥；赠礼 carved_boat 只在 read_name
[[tracks.chapters]]
key = "a2"
title = "刻坏的小船"
text = "入秋以后，哈米德每天晚上都在廊下刻木头，刻一会儿就拿袖子盖住，不让我看。一天晡礼后，他把一块木头塞到我手里：“刻坏了。你拿去烧火。”是一条船。桅杆、船舷、缝船板的椰索都刻出来了，只有船头不对——刀走偏了，削掉一大块。他没扔，顺着那个缺口刻了一只海鸥，收着翅膀，正好落在船头上。“本来想刻我们家那种大船。”他说，“刻到一半又想，刻那么大干什么，又不是要跟我哥的船比谁长。”“那海鸥呢？”“补窟窿的。”他把脸转开，“船底下还刻了字，你别看。”我当然翻过来看了。"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "cairo"
cast = ["hamid"]
speaker = "captain"
mood = "tender"
news = "开罗杰巴尔提住宿区的廊下，那个摩加迪沙学生刻了一整个秋天的木头，扫出来的刨花能装一筐。"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

