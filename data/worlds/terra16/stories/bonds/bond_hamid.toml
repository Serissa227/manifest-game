at = "cairo"
cast = ["hamid"]
speaker = "captain"
mood = "tense"
news = "开罗杰巴尔提住宿区有个摩加迪沙学生，自己排了一张季风表，说是从纳吾肉孜那天起一天一天数出来的，谁借都不给。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

