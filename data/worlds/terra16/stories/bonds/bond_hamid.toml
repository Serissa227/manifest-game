[[tracks.chapters.choices]]
key = "introduce_again"
text = "抢过水罐，再大声介绍一遍：他叫哈米德。"
reply = "我把水罐从他手里拿过来，往井沿上一顿：“再说一遍，他叫哈米德。谁再叫错，这一罐水我替他泼。”老生们哄笑起来，有人学我的基尔瓦腔。哈米德的耳朵红到了脖子根，憋了半天憋出一句：“你们基尔瓦人，嗓门大就算赢？”可那天晚上，我在廊下听见他跟新来的泽拉学生搭话，开口第一句就是：“我是哈米德。”"
next = "c2"
effects = [{ kind = "affinity", person = "hamid", value = 4 }]

[[tracks.chapters.choices]]
key = "needle_him"
text = "用基尔瓦人的口气挖苦：摩加迪沙的船，等风等到胡子白。"
reply = "“会算季风有什么用？摩加迪沙的船等风，等到船老大胡子都白了。”哈米德把水罐往地上一放：“基尔瓦的船倒是不用等，风往哪吹往哪漂，一路漂到索法拉去。”我们从井边吵到廊下，从晌礼吵到晡礼。吵到后来，他蹲在地上画风向，我在旁边画我家的船走的路，两张图一对，讲的是同一阵东北风。他拿脚把图抹了：“明天接着吵。”"
next = "c2"
effects = [{ kind = "affinity", person = "hamid", value = 3 }]

# C2 · 1554 夏 · 他自己排的季风表：第九十六天下面就是第九十八天
[[tracks.chapters]]
key = "c2"
title = "从纳吾肉孜数起"
text = "晡礼过后，哈米德把一张纸摊在我床上，四个角拿我的鞋压住。纸上画满了格子，一格一个数。“印度洋的领航人从纳吾肉孜那天数日子，”他说，“第几天出亚丁，第几天过瓜达富伊角，第几天该看见摩加迪沙的白墙，全是数出来的。”他顿了顿，“这张是我自己排的。没抄我哥的。”念书我念不过他，数数却是在基尔瓦鱼市上练出来的。我顺着格子往下数，数到一半，手指停住了：第九十六天下面，紧跟着就是第九十八天。我没出声。哈米德看见了我的手指。他的脸一下子沉下去，伸手要卷那张纸，卷到一半又停住，盯着那一格看了很久：“……你数清楚了？”“我卖鱼从来不少找钱。”他没笑，把纸重新摊平了。"
