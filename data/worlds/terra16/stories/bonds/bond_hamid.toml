# B1 · 1554 秋 · 算学讲席：算板上的那一行
[[tracks.chapters]]
key = "b1"
title = "一行自己的账"
text = "讲席散了，教算学的老先生留下我们几个，在撒了细沙的算板上出题：一包胡椒从吉达运到开罗，过几道关、交几道税、路上受潮折掉几成，到了哈利利市场该卖多少。各人低头划沙，算完一个个报数。我报得不算离谱。哈米德报得最慢，老先生摇了摇头：“少了一大截。”哈米德盯着自己的算板，话冲口而出：“我哥哥不会算错这个——”说了一半，他自己先愣住了。后排有人噗地笑出声。老先生没笑，拿竹签在他算板上点了点：“我不认识你哥哥。这一行是谁算的？”哈米德的嘴张着，没合上。算板上那一行数歪歪扭扭，最末一个数被他的袖口蹭掉了一半。"
