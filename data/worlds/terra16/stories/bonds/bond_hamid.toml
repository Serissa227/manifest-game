text = "我们约过比一比，看谁先有一条自己的船。我的船靠上摩加迪沙码头时，我憋了一肚子炫耀的话。在码头上一问哈米德的铺子，脚夫没问是哪个哈米德，抬手就指了巷子。巷子尽头一扇新漆的门，门楣上钉着木牌：哈米德商号。我正要敲门，一个骑驴的男人在门前勒住驴，冲里头喊：“哈米德！傍晚那批乳香你去点。”是卡里姆。他喊完就走了。哈米德出来，怀里抱着一摞账本，先看了一眼我身后的港口：“你先有了船，我先有了门。”他把账本往我怀里一塞，“算平。不服的话，先把我这几年的季风账核一遍。”"
