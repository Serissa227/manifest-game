# C1 · 1554 春 · 杰巴尔提住宿区的井边：“卡里姆的弟弟”
[[tracks.chapters]]
key = "c1"
title = "另一个名字"
text = "杰巴尔提住宿区的院子当中有口井，井沿上搁着一只缺了口的水罐，谁打水谁用。我正蹲在井边洗脚，一个老生冲廊下喊：“卡里姆的弟弟，过来！”廊下站起一个瘦高的男孩，应了声“在”，走到半路又很轻地补了一句：“……哈米德。”轻得只有那只水罐听得见。我甩着湿脚站起来，拿出基尔瓦鱼市上叫价的嗓门：“诸位！这位是哈米德，摩加迪沙来的，听说会算季风！”满院子的人都扭过头来。哈米德瞪着我，声音压得更低：“你有你的海，我有我的潮。”老生倒来了兴致，问他今年亚丁往南的船哪天走。他答了，连哪几天风会打旋、哪一天千万别出港都说得清清楚楚，比问的人还细。老生听完一拍大腿：“卡里姆的弟弟，比卡里姆说得还细！”哈米德没接话，弯腰去拎那只水罐。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "cairo"
cast = ["hamid"]
speaker = "captain"
mood = "cheerful"
news = "开罗杰巴尔提住宿区的井边，有个基尔瓦来的学生扯着嗓子替一个摩加迪沙学生报名字，满院子的人都回头看。"
when = [{ kind = "flag", flag = "family_access_cairo_azhar" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
