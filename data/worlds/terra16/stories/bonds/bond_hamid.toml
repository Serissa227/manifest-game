# S · 1556 年 12 月 · 东北风稳了，井边最后一晚
[[tracks.chapters]]
key = "s"
title = "你有你的海"
text = "十二月，苏伊士那边捎来消息：东北风稳了，亚丁往南的船这个月就走。杰巴尔提住宿区一下子空了一半。哈米德的箱子比来时多出一只，装的是他三年来排的季风表，一年一卷，拿麻绳捆着。我的东西塞不下，在哈利利市场跟人砍了一下午的价，砍来一只旧皮袋。最后一晚我们又坐到井边，那只缺口的水罐还在老地方。“你回基尔瓦，我回摩加迪沙。”哈米德说，“中间隔着拉穆、帕泰、马林迪，一大片海。”“还隔着你们摩加迪沙人最看不上的基尔瓦口音。”“那个隔不住。”他说，“隔着半条海岸我都听得见你。”他把水罐转了半圈，缺口对着我：“说吧。往后怎么算？”"
