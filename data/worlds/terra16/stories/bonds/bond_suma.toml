# S：她染的纱笼，故意歪着的那一角。
[[tracks.chapters]]
key = "s"
title = "她染的纱笼"
text = "十二月，西风起了，学堂散了。我家的船已经进港，等货装齐就走。苏玛来码头的时候，怀里抱着一卷布，走到我跟前也不打开，一把塞进我怀里。是一条纱笼，靛蓝的底，褐色的花，是她自己画的蜡、自己下的染缸——我认得她描花的手势，起笔重，收笔轻。花纹一路对得齐齐整整，只在下摆的一角歪了一小块，像描的时候手抖了一下。我刚要开口，她先说了：“下回的船期，什么时候？”我说了。她点点头，又问：“那你想过什么样的日子？”我还没答上来，她又接着说：“先说好，我不会为了等谁一句话，就把作坊关了。你也别拿出海当借口，一年到头不回信。”脚夫在喊装货，她站着没动，等我回话。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

