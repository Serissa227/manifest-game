reply = "我说往后每一趟船，开船的日子、到港的日子，都先写信告诉她；两家的生意，价钱由她来开。“那你可得准时。”她说。我说准时。她看着我，像在估一匹布的成色，然后伸手把纱笼的下摆抖开，指着那一小块歪了的花纹：“看见没有？这里是你，歪的。”我说我还以为是她手抖。“我的手从来不抖。”她把下摆折回去，替我把纱笼卷紧，用一根草绳扎好，“整条都照着格雷西克的样子描，就这一块，我故意叫它歪着。哪天它跟别的花对齐了，就是你学会守日子了。”脚夫又喊了一声。她把草绳的结拉了拉，拉得结结实实：“第一封信，开春以前到。”"
