hint = "把她的日子抄进你家的船期表，叫你家的船长替她守着，她还没信你到这一步。"
reply = "老船长对着船期表看了半天，说风不一定肯。我说那就早几天动身。结果那一回我早到了两天，兴冲冲跑到作坊去。苏玛看见我，把门帘一放：“早到也不行，我说的是那一天。”我只好在码头边的客栈住了两夜。到了那一天的早上，她来敲客栈的门，手里拎着一包糯米糕。"
