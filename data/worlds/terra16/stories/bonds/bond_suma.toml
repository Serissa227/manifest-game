# 重逢：1565 年，格雷西克的集市。
[[tracks.chapters]]
key = "reunion"
title = "摊位还是她的"
text = "1565 年，我的船又进了格雷西克。集市还在老地方，苏玛的摊位却换大了，占了三个摊面，棚子底下挂满了晾干的蜡染。几个染工排在她案前领工钱，她把铜钱一枚一枚数进他们手心，数一枚，报一声。有个中间人凑上来，想替一个福建商人说价，她连眼皮也没抬：“要买布，叫他自己来。”那福建商人只好自己来了。两个人隔着案板谈了一盏茶的工夫，她一文不让。我穿着那条纱笼走过去。下摆那一角磨破过一回，补丁是我自己缝的，针脚歪歪扭扭。她先看见的是那块补丁，伸手捏起下摆翻过来，把针脚看了好一会儿，才抬起头：“这回的船，是准时到的吗？”"
window = [[1565, 1, 1], [1565, 12, 31]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1565, 1, 1], to = [1565, 12, 31] }, { kind = "age", ge = 18 }]

# 缺省：我错过了格雷西克，苏玛托一条爪哇船捎来一块新染的布样，布角写着下一季的日子。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "suma", text = "凯奇利：你的船没来。我在码头上问过，说是在安汶耽搁了，风不肯走。这回不记你的账，记风的。托这条爪哇船捎去一块布样，是今年新调的靛蓝，比你那条纱笼深一层。内地那家靛蓝我换掉了，新的这家走陆路，用牛车运，梭罗河水落了也不怕。作坊又添了四口缸，染工十一个，工钱每月初一我自己发，当面数清。中间人还是来，我还是不见。上个月有个福建商人压我的价，压了三天，最后照我的价买了，走的时候说格雷西克的女人比泉州的牙行还狠。我当他是夸我。你那条纱笼要是穿破了，别自己乱补，你拿针的样子我信不过。拿回来，我给你换一块好的补上；只有那一角歪的，不许换。布样的角上写着下一季的日子，写得清清楚楚，你照着开船。到了那天再见不着你的船，这块布样我就收回来，卖给别人。——苏玛，于格雷西克" }, { kind = "flag", flag = "c7_bond_suma_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "说准时到的，然后坐下来，跟她谈一笔丁香换蜡染的长久生意"
reply = "我说准时，比约的还早了半天，在港外等潮。她“嗯”了一声，把那个福建商人打发走，在案板对面给我腾出一张凳子。我们从丁香谈起。她要三年的约，每年两季，价钱照格雷西克的市价往下压一成；我要她的蜡染在马鲁古只走我一家，别家不许卖。她说我胃口大，我说她压得狠。一个下午过去，棚子底下的影子挪了半个摊面，她一文没让，我也一文没让，最后两边各添了一样：她多给一季的纱笼，我多给一担丁香。成交以后，她照规矩把定钱数给我。我当着她的面一枚一枚数完，一枚也没少。“王子终于会算钱了。”她把钱匣一合，笑出了那颗小虎牙。"
next = "done"
