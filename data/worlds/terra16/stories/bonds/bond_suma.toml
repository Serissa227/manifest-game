# A1：纸条上的日子。
[[tracks.chapters]]
key = "a1"
title = "日子我定"
text = "家里的科拉科拉船到格雷西克来接我，要趁西风还没歇赶回特尔纳特；父亲要我回家过斋月和开斋节。我去作坊辞行，苏玛正在门口晾布，听完只问了一句：“哪天回来？”我说风到了就回来。她没接话，转身进了作坊。我以为她恼了，正要走，她又出来了，往我手里塞了一张纸条，叠得只有指甲盖大。我打开看，上面是一个日子，炭笔写的，写得很重，纸背都透了。“日子我定了。船，准时开来。”说完门帘一甩，她人又进去了，没让我看见她的脸。晾布的竹竿还在晃，一匹靛蓝的布被风掀起一个角，又落了下去。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

