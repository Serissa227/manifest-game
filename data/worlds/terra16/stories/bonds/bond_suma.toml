reply = "她又裁了一块给我。这回我描完了，就蹲在布旁边等，等一炷香烧到底，拿指甲轻轻一碰，蜡硬了，才翻过来。那朵花清清楚楚，背面也透了。苏玛把两块布并排挂在作坊门口，一块糊的，一块好的：“都是你的。谁来问，我就说是特尔纳特的王子染的。”"
next = "b2"
