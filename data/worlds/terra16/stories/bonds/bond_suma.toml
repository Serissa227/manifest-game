# 苏玛：王子也要会算钱（bond_suma）+ 摊位还是她的（reunion_suma）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用轨道与章节 key、地点与年份。
# 标签：GB（羁绊线，可恋爱）：由苏玛主动推进——日子她定，价她开，话她先开口。适用主角：凯奇利（kaicili）。
# 人物：苏玛 suma（1541-10-19，女，romance.with = m）；凯奇利·劳特 kaicili（1540-09-09，男，主角，“我”）。
#       学院期 1554—1556：凯奇利 13—16 岁、苏玛 12—15 岁；S 章（1556-12）凯奇利 16、苏玛 15，
#       心动选项写成不说破的信物交换（丁香与纱笼），只到拉一下手与 crush，不告白。
#       重逢 1565：凯奇利 24、苏玛 23，双方成年，恋人落点合法；生年相差约一年。
# 依据：
#   史实——格雷西克是爪哇北岸的港口，近旁吉里山有苏南·吉里的学堂（吉里学院以此为原型）；爪哇集市通行中国铜钱（皮雷斯《东方志》记有）；
#         蜡染用竹柄小铜壶（canting，此处叫“蜡刀”）描蜂蜡、下靛蓝缸，蜡未凉透时翻布会糊纹；梭罗河在格雷西克附近入海，内地货物顺河而下，旱季水浅；
#         坎贝（古吉拉特）的靛蓝块经古吉拉特船贩到东南亚；班顿（pantun）四行一首，隔行押韵；爪哇海约十二月至三月刮西风，往马鲁古顺，五月后转东风。
#   本世界线——开斋节按伊斯兰历推，1556 年在八月前后，所以 A1 写“回特尔纳特过斋月和开斋节”，三月趁西风走、东风起后回。
#   原创——苏玛其人、扣下的那一枚铜钱、棕榈叶扇、做坏的样本布、一炷香、三张画圈的订单、纸条上的日子、蜂蜡小玫瑰、故意歪着的那一角花纹、丁香枝、补丁。
#   改动——B2 的靛蓝改由古吉拉特船带来（简报写中国帆船；印度靛蓝更合当时的货路），事件与结果不变。
# 去重：吉里的班顿对歌在 1554-05-20 同窗比赛日，本文件只写初赛时苏玛在台下挑错；决赛对出下半句归 bond_raja_muda，不重复同一句。
#       黄墩与苏玛的事归 pair_huang_dun_suma（1568 年起），1565 年的重逢早于它，不写 variant。
# 缺省走向：C1—A2 的 default 无效果（玩家不回应时发生了什么写在各章注释里，章节无 stage，不出见闻）；
#           S 的 default 开启重逢并设 c7_bond_suma_parted，不改关系；重逢的 default 是苏玛托爪哇船捎来的一封信（letter），设 c7_bond_suma_missed。
# 心动：A1 be_early +6 → A2 let_it_melt_joke +6（要求 ≥ 6）→ S heart +12（要求 ≥ 12）= 24，正好够重逢的 love 门槛（简报把 S 定为 +12，见简报 ladder）。
# 旗标：写 c7_bond_suma_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#       S 的 promise 与 heart 另设共享旗标 c7_pair_huang_dun_suma_taken（配角线 pair_huang_dun_suma 读，据此改走“并肩的朋友”）。
# 日程：不改。苏玛学院期在格雷西克（cast/classmates_giri.toml），重逢也在格雷西克。
# 口头禅：cast 里那句“笑归笑，价不让。”原样只在 C1 正文用一次；A1 纸条上的日子是这一幕自己的话，S 的心动回复与重逢换说法呼应。
# 物件：A2 赠 wax_flower（蜂蜡小花），S 三个选项都给 malay_sarong（马来蜡染纱笼）。

[[tracks]]
key = "bond_suma"
name = "苏玛：王子也要会算钱"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["suma"]

# C1：扣下的那一枚铜钱。口头禅在这里用一次。
[[tracks.chapters]]
key = "c1"
title = "王子也要会算钱"
text = "格雷西克的集市上，布摊夹在鱼摊和香料摊中间。我头一回自己出来买布，挑中一匹靛蓝的，问了价，把一串铜钱往案上一放，抱起布就走。没走出三步，袖子叫人从后面一把拽住了。是卖布的女孩，头上包着一块褐色的蜡染巾，个子还没我高。她把我拽回摊前，当着一圈人，把找回的铜钱一枚一枚放进我手心，放一枚，数一声。数完了，她摊开另一只手，掌心里还躺着一枚。“少了一枚，你都不知道吧？王子也要会算钱。”卖鱼的拍着大腿笑：“小王子，叫苏玛给教训了！”我最听不得那个“小”字，脸上发烫，偏要撑个场面，笑着问她：特尔纳特的称号能不能抵账？“笑归笑，价不让。”她“啪”的一声把布卷收回了案板底下。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_giri" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那天我没买成布，苏玛说王子下回带够了钱再来。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "count_again"
text = "蹲在摊前把铜钱重新数一遍，再跟她从头开价"
reply = "我把铜钱串回草绳上，数清了，才重新开口。我开一个价，她砍一刀，前后砍了三回，砍得卖鱼的都替我叫疼。最后成交的布只够做一条头巾。她把布叠成方块递过来：“够你学第一课了。”说完笑了，露出一颗小虎牙。"
next = "c2"
effects = [{ kind = "affinity", person = "suma", value = 3 }, { kind = "skill", skill = "negotiation", value = 8 }]

[[tracks.chapters.choices]]
key = "title_for_cloth"
text = "接着逗她：称号抵不了账，那就拿一首班顿来抵"
reply = "我清了清嗓子，念了一首说特尔纳特山上丁香开花的班顿。她歪着头听完，从布卷上量出半尺，剪下来扔给我：“这首值半尺。”我问另外半尺呢。她把剪子往案上一拍：“等你念出一首值一尺的。”那半尺布，我拿回学堂夹在书里，当了好些天的书签。"
next = "c2"
effects = [{ kind = "affinity", person = "suma", value = 2 }]

# C2：班顿对歌的初赛，台下的扇子。
[[tracks.chapters]]
key = "c2"
title = "台下挑错"
text = "吉里学堂的班顿对歌赛，讲堂前的空地上挤满了人。初赛轮到我，我念的是一首背熟了的：前两行说海上的丁香船，后两行说等人的心。念完了，满场还没回过味来，台下有个声音拔得老高：“第三行的韵押歪了！”我循声看过去，是集市上那个卖布的女孩。原来她也在学堂念书，坐在女孩们那一边，手里摇着一把棕榈叶扇。满场哄笑，先生看着我，等我开口。我当场把第三行末尾的字换了，重念一遍，这回押上了。苏玛点点头，扇子一合，像个评判。可她马上又把扇子打开，跟身边的女孩说话，声音大得半个讲堂都听得见：“押是押上了，就是不好听。”"
window = [[1554, 5, 15], [1554, 7, 14]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 15], to = [1554, 7, 14] }, { kind = "age", le = 17 }]

# 缺省：那一场初赛我过了，台下那个女孩的扇子一直在摇。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "invite_her_up"
text = "当场请她上台来，替我把那一句改得好听"
requires = [{ kind = "affinity", person = "suma", ge = 20 }]
hint = "她还当你是个只会摆架子的王子。这时请她上台，她只当你要她当众出丑。"
reply = "她愣了一下，真的提着裙边走上来了，站到我旁边，把那一行从头念了一遍，只换了一个字。那一行的音一下子顺了下去，台下叫好叫得比方才笑得还响。她把扇子插回腰带里，下台时从我身边擦过去，压低了声音：“你这王子，脸皮倒不薄。”"
next = "b1"
effects = [{ kind = "affinity", person = "suma", value = 2 }, { kind = "bond", person = "suma", level = "C" }]

[[tracks.chapters.choices]]
key = "steady_next"
text = "装作没听见，把下一首押得更稳"
reply = "第二首我念得很慢，每一行的尾音都咬实了。台下那把扇子越摇越快，她张了两回嘴，到底没挑出错来。散场的时候人挤着人，她在人堆里冲我喊了一声：“这一首还行！”喊完就被女孩们拉走了。"
next = "b1"
effects = [{ kind = "affinity", person = "suma", value = 3 }]

# B1：蜡刀与做坏的第一块布。
[[tracks.chapters]]
key = "b1"
title = "蜡还没凉"
text = "苏玛拉我去她家的作坊学蜡染。院子里晾满了布，靛蓝缸的气味冲得人眼睛发酸。她递给我一支蜡刀：竹柄上嵌着一只小铜壶，壶嘴细得像一根稻草。她教我在炭炉上把蜂蜡化开，舀满一壶，顺着布上的炭笔线描花，手要稳，气要匀。我描了一朵半，急着翻过布看背面透没透，蜡还没凉，指头一按，一小片纹全糊了。苏玛没骂我。她拿剪子把糊了的那一块剪下来，塞进我手里：“留着，当样本。王子做坏的第一块布。”我捏着那块布，问她这也能卖吗。“先学会知道什么不能卖。”她说着，又往炉上添了一块蜡。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：那块做坏的布苏玛挂在作坊门口，挂了好几天。
[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "do_it_again"
text = "请她再给一块布，这回等蜡凉透了再翻"
