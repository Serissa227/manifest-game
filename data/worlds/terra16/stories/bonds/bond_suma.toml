text = "隔着门帘跟她讨价还价，问能不能往后挪两天"
reply = "我隔着门帘问她，能不能往后挪两天，开斋节以后家里还有客。她把门帘掀开一条缝：“不能。日子跟价钱一样，我说了算。”我只好答应。她这才把门帘整个掀开，笑了，又从我手里把纸条拿回去，在那个日子底下重重画了一道。"
next = "a2"
effects = [{ kind = "affinity", person = "suma", value = 3 }]

# A2：蜂蜡捏的小玫瑰（a2_item = wax_flower）。
[[tracks.chapters]]
key = "a2"
title = "蜂蜡小花"
text = "苏玛把一样东西放在我的手心上：一朵蜂蜡捏的小玫瑰，只有铜钱那么大。是作坊里描花剩下的蜡，她攒了好些天。花瓣一片比一片薄，最里面那一片对着光，薄得透亮，看得见她留在上面的指纹。“上一朵我放在窗台上，”她说，“一个中午就化成了一摊。这一朵你放阴凉的地方。”我托着那朵花不敢合手，怕手心的热气把它焐软了。她看着我那副样子，嘴角动了一下，又往下说：“你们特尔纳特太热。它要是化了，你就回来找我，我再捏一朵。”作坊里的染工在喊她，她应了一声，人没动。"
