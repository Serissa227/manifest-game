[[tracks.chapters.choices]]
key = "love"
text = "说这回不谈生意，问她成年那年的开斋节，她定的日子是哪天"
requires = [{ kind = "flag", flag = "c7_bond_suma_romance" }, { kind = "heart", person = "suma", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "suma", ge = 18 }, { kind = "romance_open", romance_open = "suma" }]
hint = "她还捏着那块补丁在看针脚。当年码头上那句话你没说，隔了这些年，她定的那个日子你也还没问出口。"
reply = "她把账本放下，看了我很久。“今天。”她说。我说今天不是开斋节。“我说的是我定的日子。”她从钱匣底下拿出一枝丁香，晒得发黑了，花苞一个也没掉，“那年我就定好了：你的船进港那一天。你来得晚，日子却没错。”那天她早早收了摊，把账本交给伙计。傍晚，作坊后面晾布的竹竿底下，一匹匹靛蓝在风里慢慢地晃。她问我这些年身边有没有别人；我说没有。她点点头，像对完了一笔账，然后踮起脚吻了我。她的手捧着我的脸，指头上还有靛蓝的颜色。第二天早上我洗脸，水里映出来，颧骨上还沾着一点蓝。"
next = "done"
