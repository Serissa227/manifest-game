reply = "“给苏丹看？”她笑得直不起腰，扶着染缸喘气，“他会以为格雷西克的布都是这样的。”笑够了，她还是把那块布要了回去，坐在门槛上，拿针线把剪开的毛边一针一针锁好，才还给我。"
next = "b2"
effects = [{ kind = "affinity", person = "suma", value = 3 }, { kind = "skill", skill = "waxwork", value = 8 }]

# B2：见了底的染缸。
[[tracks.chapters]]
key = "b2"
title = "迟到的靛蓝"
text = "这一年旱季来得早，梭罗河的水落得快，从内地运靛蓝的船搁在半路的浅滩上，一个月没动。苏玛家作坊里最大的那只染缸见了底，缸壁上只剩一圈发黑的蓝印子。订单却一张也等不了：有办喜事的，有要赶船期的。苏玛把订单摊了一桌子，一张一张分成两堆，左边是能交的，右边是要延期的。我说何不先把定钱收齐，等靛蓝到了再说。她头也没抬：“钱收足了再拖着人家，那叫什么生意。”她把右边那一堆推到我面前，边角码得整整齐齐。“要延期的，得一家一家去说。你是王子，你去说，人家不好意思骂。”"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "gresik"
cast = ["suma"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

