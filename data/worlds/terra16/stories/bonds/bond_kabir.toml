# 重逢：1562 年，坎贝湾。潮退露滩、涨潮成墙；他是坎贝最好的领航员，登船第一句问吃水，不提当年胜负，指出我旧星图上挪了的沙洲。
[[tracks.chapters]]
key = "reunion"
title = "领航员的第一句"
text = "坎贝湾的潮水一退，能露出十几里泥滩，大船只敢泊在湾外候潮。领航的小船从滩间的水道里钻出来，靠上我的船舷，一个人攀着绳梯上来，头上缠着领航员的白头巾。六年没见，卡比尔高了，晒黑了，下巴上有了胡子。他站稳了，第一句话是：“吃水多少？”我报了数。他点点头，往船舷外看了一眼水色，没提当年谁赢谁输。“下一回涨潮，过了晌午。涌潮来的时候像一堵墙，得赶在它前头进水道。”他要我的海图看。我把那卷旧星图摊开，是学堂那几年画的。他的手指顺着海岸往下走，停在一处：“这儿早该重测了。你画的是六年前的沙洲，它往南挪了。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "khambhat"
cast = ["kabir"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "kabir", text = "纳吉玛：坎贝湾今年的潮时表附在后面，大潮小潮都抄了，比学堂那几年抄得工整。湾外候潮的船一个月比一个月多，有两条不肯等领航，自己往里闯，如今还坐在泥滩上晒桅杆。你的船要来，先派小船进来叫我，进港只能我领。听说你往别的海上去了。我爹那块牵星板还挂在我脖子上，天天擦。还有一场没比。风向转到哪边，这一场都得比。——卡比尔，坎贝" }, { kind = "flag", flag = "c7_bond_kabir_missed" }]

[[tracks.chapters.choices]]
