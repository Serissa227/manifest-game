[[tracks.chapters.choices]]
key = "promise"
text = "答应他：回来再比一场，输赢都回来报信。"
requires = [{ kind = "bond", person = "kabir", level = "A" }]
hint = "你们还没走到能许这种约的那一步，或者这一生一次的约，你已经许了别人；这回只能约一场赛船。"
reply = "“输赢都报？”他把那句还没出口的话咽了回去，换了个口气，“那你得活着回来输。”我说是你输。他笑出声来，又从怀里掏出一张纸——坎贝湾一个月的潮时，大潮小潮，几时涨几时落，一格一格抄得密密麻麻。“坎贝的湾口，外地舵手自己闯，十条船有三条要坐在泥上，等下一回潮。”他把纸塞给我，“你的船要进来，只能我领。别找别人。”我说那得看你那时候出师没有。“出了。”他说得很硬，“你来的那天，我已经是坎贝最好的领航员。”我把两张纸叠在一起折好，他看着我折，没再提那句话。他的船开那天，他站在船尾，一直站到看不见。"
next = "done"
effects = [{ kind = "affinity", person = "kabir", value = 5 }, { kind = "bond", person = "kabir", level = "S" }, { kind = "relation", person = "kabir", relation = "friends" }, { kind = "flag", flag = "c7_bond_kabir_promise" }, { kind = "flag", flag = "c7_pair_kabir_shadia_taken" }, { kind = "memory", memory = "mem-bond_kabir-s", title = "等你赢我一次" }, { kind = "start_track", track = "reunion_kabir" }]

[[tracks.chapters.choices]]
key = "heart"
text = "等他把那句话说完，回他：等你赢我一次。"
requires = [{ kind = "bond", person = "kabir", level = "A" }, { kind = "heart", person = "kabir", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "kabir", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "kabir" }]
hint = "这句话还轮不到他说——你们还没走到那一步，或者那一生一次的约，你已经许给了别人。"
reply = "他转过脸来，憋了半天，说得飞快：“我喜欢你。从你在沙上画帆角那天起。”说完就闭紧了嘴，像怕再漏出一个字。我看着他：“等你赢我一次。”他愣住了：“那得等多少年？”我说看你本事。他低头想了一会儿，拉起我那块新牵星板垂下的绳头，在上面又打了一个结，比别的结都靠里一点：“这一结是我的。”然后他握了一下我的手，握得很紧，马上就松开了。“那我回去天天练。”他倒退着走了两步，又站住，“赢了那天，你得把这句话接着答完。”我说好，等那天。他转身跑了，一脚踩平了沙上那个小坑。"
next = "done"
effects = [{ kind = "heart", person = "kabir", value = 12 }, { kind = "relation", person = "kabir", relation = "crush" }, { kind = "bond", person = "kabir", level = "S" }, { kind = "flag", flag = "c7_bond_kabir_romance" }, { kind = "flag", flag = "c7_pair_kabir_shadia_taken" }, { kind = "memory", memory = "mem-bond_kabir-s", title = "等你赢我一次" }, { kind = "start_track", track = "reunion_kabir" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好：下回见面就是对手，谁也不让谁。"
reply = "他眉毛一挑：“我什么时候让过你？”我说你让过——每回想从我嘴里套星表上的数，你都先让我赢一句。他一下子噎住了：“那是风向转了，不算。”说完自己先笑出来，笑弯了腰。笑够了，他把那句没说完的话咽回去，伸出手。我跟他击了一掌，啪的一声，惊起了滩头一群海鸥。“对手。”他说，“坎贝见。你要是到了湾口不敢进，就在外头挂三面旗，我划船出去看你笑话。”他走出老远，又回头喊了一声：“三面！”我把他的船期折成小方块，夹进了星表里。"
next = "done"
