# 卡比尔：风变了（bond_kabir）+ 卡比尔：领航员的第一句（reunion_kabir）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用章节 key、地点与年份。遵循 A5 / E37 故事 2.0 契约。
# 标签：BG（羁绊线，可恋爱）。适用主角：纳吉玛（najma，1540-08-24，女，第一人称“我”）。
# 人物：卡比尔 kabir（1540-01-10，男，romance.with = f），坎贝来的古吉拉特领航学徒，父亲留下的牵星板天天擦；输不起，口头禅“风变了。”（只在 C2 正文完整出现一次，别处换说法）。
#   莎迪娅 shadia（1540-08-21，女）只在重逢的 variant 里作“他身边的人”出现一句，本文件不写她的感情。
#   各章年龄：C1—B2（1554—1555）两人 13—15 岁；A1（1556-08-24）纳吉玛当天满 16、卡比尔 16；A2、S（1556-08-25..12-31）两人都是 16 岁；
#   重逢（1562）两人 21—22 岁。生年相差不到一年。
#   学院期只写在意与借口：A1 心动 +6、A2 心动 +6（要求已有 6）、S 心动 +12，合计 24，正好够重逢的伴侣落点；
#   S 的 heart 选项只是“等你赢我一次”——把回答推到成年再见，最多握一下手；伴侣效果只在 1562 年重逢（双方已满 18）。
# 依据·史实：印度洋领航人用牵星板（kamal）以“指”（isba，约一度半）为单位量北极星高度，一指折合的航程在三百里上下；纳吉玛的“差一指，就差一百里”是她的口头说法，不是换算；摩卡一带北极星约高八指；
#   老人星（Suhail）在阿拉伯南部八月下旬黎明前初升，正赶上纳吉玛的生日；冬季曼德海峡表层的水往红海里灌；
#   坎贝湾潮差极大，退潮露出大片泥滩，涨潮时有涌潮，大船在湾外候潮，由当地领航员带进水道；艾哈迈德·伊本·马吉德以诗记航路。
# 依据·原创：卡比尔与纳吉玛的全部情节；沙上的帆角图；记风向的纸与同一条线上的两块石头；星问里落在同一行的两根指头；
#   船尾的“二十三块船板”；照纳吉玛指宽重打绳结、留着旧绳的新牵星板；S 章绳头上靠里的那一结；重逢时往南挪了的沙洲。
#   领航人从纳吾鲁孜（波斯新年）起计日、按日数定开航，是史实；B1 里“第二百八十天”这个数是虚构的错答。
