# S：1556 年冬，学堂散了。他回坎贝，我出海；他交出船期，说还有一场没比，又说还有一句话——他先开口。
[[tracks.chapters]]
key = "s"
title = "等你赢我一次"
text = "锚地上的船一条条起了锚。卡比尔搭的那条船后天往坎贝去，那边有个老领航等着收他上船。我的船还要再等一个月的风。他父亲那块牵星板挂在脖子上，露在衣襟外头。他到沙滩上来找我，手里攥着一张纸，是他那条船的船期，日子、潮时，写得整整齐齐。“给你。”他说，“还有一场没比。”我接过来。他没走，站在原地，鞋尖往沙里拱，拱出一个小坑。“还有一句话，”他的声音比平常低，“不比，也想跟你说。”他看着海，不看我。潮水涨上来，漫过那个小坑，又退下去。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "zabid_city"
cast = ["kabir"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
