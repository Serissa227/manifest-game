title = "风变了"
text = "第二场赛船，我的船头先碰上沙。卡比尔晚了半个船身，他把帆绳一甩，跳上岸，第一句话就是：“风变了。”我从怀里掏出一张纸递过去。赛前我在锚地上守了一早晨，每过一刻钟记一回风向，一行一行，墨还没干透。“你挑。”我说，“哪一段算变。”他接过去，从头往下看，看到底又翻回来。太阳把纸晒干了，他还没开口。后来他把纸折好还给我，走到自己的船边，弯腰把船往浅水里又推了半尺，船底刮着沙子吱吱响。“下一回，”他背对着我说，“从同一条线出发。”"
