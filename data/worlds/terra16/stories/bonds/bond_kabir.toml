text = "卡比尔把一块牵星板放在我的星表上。木板是新刨的，四角磨圆了，样子跟他父亲那块一模一样。可绳上的结不一样，结和结之间，比他父亲那块的窄。“我量过你的手。”他说，“那天你拿板子，我看你指头压在哪儿。”我拿起来看。绳头上还接着一截旧绳，颜色发黑，是从他父亲那块上拆下来的，旧绳上的结一个也没解。“我爹的尺度合他的手，不一定合你的。旧绳我没扔，接在后头，两样你都能对。”我拿拇指捻着一个新结，捻了好一会儿：“差一指，就差一百里。”“所以，”他说，“得照你的指头打。”"
