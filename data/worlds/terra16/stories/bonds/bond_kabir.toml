# C1：1554 春，摩卡外锚地的三角帆赛船。他赢了，说女孩只配看星；我在沙上画他最后那一转。
[[tracks.chapters]]
key = "c1"
title = "只会看星"
text = "外锚地的三角帆小船赛了一上午，卡比尔的船头头一个冲上沙滩。他跳下水，裤腿湿到膝盖，冲岸上的同学扬起下巴：“古吉拉特的领航人，没有输给阿拉伯人的道理。”看见我手里夹着星表，他又补一句：“女孩看看星就好，掌舵是男人的事。”我没回嘴，捡起半截断桨，在湿沙上画他最后那一转：浮标、风从哪边来、帆横过去的那一刻。“这儿，你把帆角放到多大？”他以为我在找台阶下，哼了一声，蹲下来夺过断桨：“放大了。这么大——风压过来，帆吃满了，船头才甩得快。”他在沙上又添两道线，越讲越快，浪舔到脚后跟都没挪窝。讲完最后一笔，他抬起头看我，嘴张着，半天没合上。下个月还有一场，对手就蹲在他面前。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "zabid_city"
cast = ["kabir"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_shipboard_zabid" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

