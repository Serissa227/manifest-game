# B1：秋天的星问。两人一组答东北季风的开航日；他算日子，我看海峡口的水。不写胜负。
[[tracks.chapters]]
key = "b1"
title = "两个人的答案"
text = "秋天的星问，老领航把他的星表摊在舱里的长桌上，两头压上镇纸，把我和卡比尔叫到一组：“今年东北季风，哪天开航？说准日子，也说出道理。”卡比尔扳着指头算，从纳吾鲁孜往后数，数得又快又响：“第二百八十天。错不了。”我盯着星表边上那一栏水情：“那天走不了。海峡口的水正往里灌，船出不去。”他瞪了我一眼，没争，把手里的炭笔递过来：“那你说。”老领航问：“谁来答？”卡比尔先看我。我说了水，他才接下去说日子，一句咬着一句，像商量好的。老领航听完，拿指甲在星表上一划：“差了一处。”我们俩同时低头去找，他的指头和我的指头，落在了同一行上。"
