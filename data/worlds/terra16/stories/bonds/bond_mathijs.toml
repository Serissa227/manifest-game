# A2：1556 年 10 月 12 日，莉芙满十六岁。棉布小偶（cotton_doll）。
[[tracks.chapters]]
key = "a2"
title = "棉布小偶"
text = "十月十二日，我满十六岁。一早，马蒂斯在兑换桌上放下一个布包，打开来是个巴掌大的棉布小偶。小偶坐在一张用布景剩下的木条钉成的小兑换桌后面，手里捏着一枚黄铜扣子充当金币，眉毛是两针黑线，缝成一个八字，皱着。那个皱眉是谁的，我一眼就认出来了。“戏服剩下的料子。”他翻起小偶的裙子给我看，裙边是窄窄一条红底金线的花边，“这一截是旧纱丽的边，葡萄牙商人捐给修辞会的那只戏箱里翻出来的。你母亲那边的人带来的布，配你正好。”没等我开口，他已经把小偶举到柜台边，舔了舔拇指，学我捻银币：“一个斯泰弗，两个斯泰弗，这位先生，您这枚边上锉过。”学得那小偶像随时要张嘴骂人。我父亲在里屋笑出了声。"
