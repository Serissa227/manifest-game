text = "普朗坦先生的印书坊今年刚挂了招牌，我替父亲去订过两回记账用的格纸。马蒂斯不知从哪里听说了，在兑换桌前堵住我，手里捏着一页折了四折的纸。“你下回去印书坊，顺手带给扬。就说是戏单的样稿，请他看看排不排得下。”他说得很快，像背一段背熟了的台词。说到“看看”，他忽然把纸抽了回去。折缝松开一角，纸背朝着我：上面写着扬的名字，写一遍，划掉；又写一遍，又划掉，墨洇成一小团。他看见我在看。那张纸被他三下两下攥成一团，他竖起一根手指抵在嘴唇上，眼睛弯起来，又成了台上的人：“嘘，这是戏，别当真。”我父亲在柜台那头喊我去点一袋斯泰弗。马蒂斯没走，站在那儿等我回话，拳头里还攥着那团纸。"
