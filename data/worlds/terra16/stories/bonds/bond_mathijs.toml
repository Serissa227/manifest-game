hint = "这份礼太重。以我们眼下的交情，我收下了也坐不安稳。"
reply = "我把小偶摆在账本左边，正对着来兑钱的客人。那天来换钱的人，个个先看小偶，再看我，再看小偶，然后笑。我父亲笑了一整天，收账都多数了一遍。傍晚马蒂斯来了，蹲下来跟小偶平视了半天，说他下一出戏要演一个兑换商的女儿，问我肯不肯让他照着我演。我说可以，照我演一场，抽一个斯泰弗。"
