# S：1556 年 12 月，月桂树学校门口。手画的戏票。
[[tracks.chapters]]
key = "s"
title = "头排的座位"
text = "月桂树门口的石阶上结了一层薄霜。马蒂斯在那儿等了不知多久，鼻尖冻得通红，一见我出来，就从怀里掏出一张硬纸片，双手递上，像递一封国书。是一张戏票，他自己画的：边上一圈紫罗兰，中间用花体字写着“头排”，底下一行小字——剧目待定，作者待定，日期待定。“三样都待定，”我说，“这张票按行市一文不值。”“所以才便宜卖给你。”他搓着手，“我不想一辈子替别人演心事了。我要写我自己的戏，让它登上修辞大会的台，哪怕要等十年。”他把票往我手里又推了推。“到那天，头排得坐一个账算得比我清楚的人。不然我在台上数不清自己说错了几句。”他挪开脚，石阶上的霜化开了一小块，是他站了太久的地方。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "antwerp"
cast = ["mathijs"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", ge = 12, le = 17 }]

