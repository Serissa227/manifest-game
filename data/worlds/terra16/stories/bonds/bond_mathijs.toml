# B1：1554 年圣路加节，紫罗兰会比叠句诗。
[[tracks.chapters]]
key = "b1"
title = "被偷走的叠句"
text = "圣路加节，画家公会的大厅里挂满了新画，紫罗兰会在厅里比叠句诗。轮到会里的老修辞家范·赫斯特，他清了清嗓子，念出一句叠句：“我数过的星，都欠着天亮一个答复。”满堂叫好。我身边的马蒂斯一下子站直了，脸白得像他演戏时擦的粉。“那是我的。”他声音压得极低，“今早在回廊里写的。我念给他听过一遍，问他押韵行不行。”他笑了一声，比哭还难听：“谁会信一个演女角的小子？”我会。今早八点一刻，交易所的钟刚敲过，我在回廊另一头核汇票，听见他念这一句，念完咳了两声，又念一遍，把“欠着”改成了“欠着天亮”。台上，范·赫斯特正在鞠躬，捏着纸片的手指上沾着一点墨。"
