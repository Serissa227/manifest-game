# 重逢：1561 年 8 月，安特卫普修辞大会，紫罗兰会作东。
[[tracks.chapters]]
key = "reunion"
title = "大会的原稿"
text = "一五六一年八月，安特卫普办修辞大会。各城的修辞会排着队进城，彩车从大广场一直挤到斯海尔德河边。紫罗兰会是东道主，满城挂着紫色的布。头排正中那张凳子是给我留的，凳面上有人用粉笔写了两个字：账房。报幕的人只说“紫罗兰会新戏一出”，没念作者的名字。可开演前，马蒂斯从后台塞给我一本原稿，封面上头一回写着：马蒂斯·佩特斯。戏里还是那两个人，那句话一幕拖过一幕，拖到第五幕，那个人终于开了口。台下静得能听见河上的船铃。散场后，马蒂斯从后台跑出来，脸上的粉还没擦，一边眉墨蹭花了，喘着气站在我面前。“怎么样？”他问，“算得清吗？”"
window = [[1561, 7, 20], [1561, 9, 30]]
at = "antwerp"
cast = ["mathijs"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1561, 7, 20], to = [1561, 9, 30] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "mathijs", text = "莉芙：你没来。头排那张凳子我留到第五幕，凳面上用粉笔写了“账房”，结果一个从根特来的胖修辞家一屁股坐了上去，散场时裤子上印着两个白字，全场笑得比看戏还响。这一笔记你账上。戏演完了。报幕的没念作者，可原稿的封面我写了名字，马蒂斯·佩特斯，一个字母不少。普朗坦先生收了稿子，说印三百本。随信寄你一本，是头一批里的头一本。扉页我写了“给头排的看客”。除了你，没人配得上这几个字，那个胖子不算。戏里那个人最后说出口了。说的什么，你自己翻到第五幕看，我不在信里念。我在纸上念不好，这你知道，我得有台子。你在海上记账，记得给我留一页。哪天你回安特卫普，我在大广场上给你补演一场，只演给你一个人看，不收票钱。——这一句是真的，不是戏。马蒂斯，一五六一年九月，于安特卫普。" }, { kind = "flag", flag = "c7_bond_mathijs_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "陪他去印书坊晾纸院的台阶上坐着，听他把戏里没说的那一句说给我听。"
requires = []
reply = "我们从大广场一路走到普朗坦印书坊的后院。晾纸的绳子上挂满了明天要装订的大会戏单，一张张在夜风里翻。他在台阶上坐下，拿袖子擦脸上的粉，越擦越花。“戏里那一句，台上念的是改过的。原来那句，我没给任何人念过。”“现在念？”“你先发誓。不许记账，不许打赌，不许拿去换利息。”我举起右手发了誓。他凑过来，声音放得很轻，说了。是一句很短的话，比台上那句还短，没有韵脚，也没捏着哪个角色的嗓子。我没有接话，他也没要我接。我们并排坐着，看那些戏单在绳子上翻过来，又翻过去。天快亮的时候，看院子的老头来收纸，马蒂斯站起来，拍掉裤子上的灰，冲我鞠了一躬。审慎夫人鞠躬要提裙角，寡妇鞠躬要捂心口，这一躬两样都没有，就是弯下腰，再直起来。"
next = "done"
effects = [{ kind = "affinity", person = "mathijs", value = 5 }, { kind = "relation", person = "mathijs", relation = "confidants" }, { kind = "flag", flag = "c7_bond_mathijs_landing_friend" }, { kind = "memory", memory = "mem-reunion_mathijs", title = "大会的原稿" }]

[[tracks.chapters.choices]]
key = "to_the_press"
text = "第二天一早，替他把署了名的原稿送去普朗坦印书坊付印。"
requires = []
reply = "第二天天没亮，我揣着原稿去敲普朗坦印书坊的门。普朗坦先生戴上眼镜翻了二十页，问作者是谁，我指了指封面。他又翻了二十页，说印三百本，大会还没散，外地的修辞会走之前都要买。我替马蒂斯讲价：纸钱、排字钱、装订钱，一项一项算，算到普朗坦先生摘下眼镜笑了，说他没见过替别人砍价砍得这么狠的。十天后头一批书出来。马蒂斯站在印书坊门口接过第一本，翻开扉页，蘸了墨，手抖得写坏了一个字母，又重写：“给头排的看客。”底下签上马蒂斯·佩特斯。他把书往我怀里一塞，扭头就走，走出十几步又转过身来喊：“卖书的钱，分你一成！”“两成。”我说。他站在街当中跟我讲了一刻钟的价。"
next = "done"
