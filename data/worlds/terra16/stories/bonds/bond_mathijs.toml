[[tracks.chapters.choices]]
key = "pay_for_it"
text = "笑着说我只收算得清的礼，硬要付他布钱。"
requires = []
reply = "他报了个价：“三个金币。纱丽是从果阿漂洋过海来的。”我还价，他抬价，两个人隔着柜台讲了半个时辰，路过的客人都停下来听。最后讲定一个铜板。我从钱匣最底下摸出来的，正是那年在大广场赢鲱鱼小子的那一枚。他对着光看了看，揣进怀里，却把小偶也揣了回去：“铜板我收了。小偶先寄在戏箱上，哪天你肯白收人家的东西，再来领。”"
