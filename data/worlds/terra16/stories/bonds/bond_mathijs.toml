# C7 羁绊线（重写，Claude）：bond_mathijs「演女角的人」——遵循 A5 / E37 故事 2.0 契约。
# 标签：friend。马蒂斯纯 BL，对主角莉芙只有友情：全线不写心动、不写心照不宣；他暗恋扬，莉芙看得出，他不说破，本文件也不说破。
# 人物：马蒂斯·佩特斯 mathijs（1540-10-01，男，纯 BL，紫罗兰修辞学会专演女角的少年演员）；
#   莉芙·德克莱尔克 lieve（1540-10-12，女，主角，安特卫普兑换商的女儿）；扬 jan（1540-09-25）只被提到，不上场。
#   学院期（1554—1556）两人 13—16 岁，重逢（1561）两人 20 岁。本线没有任何恋爱效果，年龄门禁只用来限定学院章的主角年龄。
# 依据·史实：安特卫普大广场上修辞学会的寓意戏；紫罗兰会（De Violieren）是圣路加公会（画家公会）的修辞社，10 月 18 日圣路加节；
#   普朗坦 1555 年在安特卫普开印书坊；月桂树女子学校 1555 年 8 月开学；1561 年 8 月安特卫普办修辞大会（Landjuweel），紫罗兰会作东。
#   斯泰弗（stuiver）、佛罗林是当时尼德兰通行的钱。
# 依据·原创：鲱鱼小子的赌、审慎夫人的假发；借贷两栏的台词本；老修辞家范·赫斯特偷走的叠句；纸背上写了又划掉的名字；
#   锁进钱柜的无名戏稿；戏服边角缝的棉布小偶（裙边是葡萄牙人捐给修辞会戏箱的旧纱丽）；手画的“头排”戏票；大会上那出戏的第五幕。
# 待核：圣路加节当天紫罗兰会是否在画家公会大厅比叠句诗（正文只写“画家公会的大厅”）；1561 年大会上普朗坦是否印过戏本（正文只写他接下稿子）。
# 缺省走向（玩家什么也不做）：c1 → c2 → b1（叠句被偷，记在老修辞家名下）→ b2（那页诗塞进旧戏本）→ a1（戏稿他自己揣着）
#   → a2（小偶摆上修辞会的戏箱）→ s（戏票他自己留着；开启重逢，记 c7_bond_mathijs_parted）
#   → reunion（错过大会：马蒂斯寄来印好的戏本和一封信，扉页写“给头排的看客”；记 c7_bond_mathijs_missed）。
# 羁绊阶梯：c2 ledger_lines 给 C、b1 testify 补签 C；b2 fold_it_back 给 B、a1 lock_it_away 补签 B；a2 keep_doll 给 A + cotton_doll + 回忆；
#   s promise 给 S（一生一约，已与别人立约时被内核挡下）；s own 不带 S。重逢两个落点都是 confidants（知己），结果不同：一个听那句话，一个送去付印。
# 旗标：设 c7_bond_mathijs_promise / _own / _parted / _landing_friend / _missed。重逢的 mutual 变体读马蒂斯与扬的 crush 关系（pair_mathijs_jan 的 closer 1556 夏设；原先读 mathijs_jan_mutual，
#   那个旗标 1562 春才设，1561 年的重逢永远读不到，整合时改）。
#   本文件不设任何 _taken：友情线立约不影响马蒂斯与扬（decisions §1.4）。
# 去重：扬看懂那出戏、怎么回答，归 pair_mathijs_jan；莉芙与扬的事归 bond_jan；本文件都不写。口头禅原句只在 b2 用一次。
# 秘密：把想对扬说的话写进无名戏——a1 莉芙替他保管，不说是写给谁的；本线没有见闻（无 stage），秘密不进任何 news。
# 日程：不改。

