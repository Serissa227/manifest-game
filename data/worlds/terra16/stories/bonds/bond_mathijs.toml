# C2：1554 年夏，交易所的回廊。台词背不下来。
[[tracks.chapters]]
key = "c2"
title = "借贷两栏的台词"
text = "交易所的回廊底下，马蒂斯转到第十一圈的时候，我替他数清楚了。“《浪子》四百多行，我的有一百六十。”他把抄本拍在柱子上，“前天背到第四十行，昨天背到第三十行，越背越往回走。账房小姐，这叫什么？”“叫亏损。”我把账本翻到新的一页，从中间画一道竖线，“背台词跟记账一样。左边一栏是别人说的，右边一栏是你回的，一行对一行，对不上就是错账。”我替他排了一页。他捧着看了半天，嘴里念念有词，忽然抬起头：“你们开兑换桌的人，连谈恋爱都要分借贷吧？”话出了口，他自己先愣住，眼睛往装订铺那条街溜了一下，又笑起来，捏着嗓子学我：“左边一栏，别人说的——”“右边一栏，你欠的。”我把笔塞进他手里。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "antwerp"
cast = ["mathijs"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", ge = 12, le = 17 }]

