# C1：1554 年春，大广场的寓意戏。赌一个铜板。
[[tracks.chapters]]
key = "c1"
title = "演女角的人"
text = "大广场上，紫罗兰会搭了台演寓意戏。“审慎夫人”一出场，裙摆扫过台板，开口第一句，满场连卖热华夫饼的都住了嘴。旁边卖鲱鱼的小子看呆了：“这嗓子，准是哪家的小姐。”“男孩。”我说，“喉结藏在领巾底下，换气比女人深半拍。赌一个铜板。”散场时，那位夫人在台侧把假发一摘，底下是一头汗湿的短发。鲱鱼小子骂骂咧咧掏了钱。我还没把铜板揣好，那男孩已经拎着假发穿过人群走过来，冲我一歪头，把我方才跟鲱鱼小子讨价还价的样子从头演了一遍，连我报“一个”时拿指甲敲鱼桶的那一下都没落下。围着的人笑得前仰后合。我脸上烧得厉害，嘴上还得算账：“学得不坏，值半张戏票。”他把假发往臂弯里一搭，行了个审慎夫人的屈膝礼：“马蒂斯·佩特斯，紫罗兰会。夫人的账，下回再算。”"
