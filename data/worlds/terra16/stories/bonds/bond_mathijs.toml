title = "没署名的戏"
text = "正月里运河结了冰，兑换桌后面的炭盆烧得正旺。马蒂斯抱着一卷用细绳捆住的稿子进来，在我对面坐下，一句台词也没念，少见。“我写了一出戏。我自己的，不演女角，也不署名。”他把稿子推过来，“你家钱柜后面那一格锁得最严。替我锁着，那里比修辞会安全，会里的人连别人咳嗽都要偷。”我解开细绳，翻了一页。戏里有两个人。其中一个一直想对另一个说一句话：第一幕没说，第二幕张了嘴又咽回去，翻到第四幕，还是没说出口。“别读！”他劈手把稿子夺回去，压在胸口，脸涨得比炭盆还红，“读戏是要买票的，账房小姐。替我锁着就行。”炭盆里一块炭塌了下去，他没去拨，眼睛一直盯着钱柜上那把锁。"
