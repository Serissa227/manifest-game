[[tracks.chapters.choices]]
key = "promise"
text = "跟他约好：他的戏登台那天，我坐头排，一场不落。"
requires = [{ kind = "bond", person = "mathijs", level = "A" }]
hint = "要许这样的约，交情还差一截；又或者，一辈子只许一回的话，我已经对别人说出口了。"
reply = "我把票翻过来，在背面写：“兹约定：马蒂斯·佩特斯之戏登台之日，德克莱尔克家莉芙坐头排，场场到，不迟到，不中途退场。违约者赔一个金币。”写完签了名，把笔递给他。他签得龙飞凤舞，“佩特斯”的尾巴拖出了纸边。他把票夹进我的账本，夹在记全年结余的那一页，按平了才松手。“这张票不许转卖。”“不许转卖。”“也不许拿去抵债。”“利息照算也不行？”他狠狠白了我一眼。我把账本合上，咔嗒一声扣上铜扣。他忽然学起交易所门口的公证人，清了清嗓子，拖长了调子：“本约一式一份，由头排保管——”念到一半自己先笑场了，霜上的脚印被踩得一塌糊涂。"
next = "done"
effects = [{ kind = "bond", person = "mathijs", level = "S" }, { kind = "relation", person = "mathijs", relation = "friends" }, { kind = "memory", memory = "mem-bond_mathijs-s", title = "头排的座位" }, { kind = "flag", flag = "c7_bond_mathijs_promise" }, { kind = "start_track", track = "reunion_mathijs" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟他赌一个金币：五年之内，他会在修辞大会上署自己的名字。"
requires = []
reply = "“赌什么？”他问。“一个金币。五年。你在大会上署了自己的名字，算我输；没署，算你输。”“我输了拿什么赔？我连半个金币都没有。”“那你说。”他想了想，把那张戏票折起来塞回自己怀里：“我输了，就给你演一辈子的寡妇。你哪天账做亏了，我就穿着孝服到你兑换桌前哭一场，哭到你的客人都多付利息。”我说成交，伸出手。他握住了，手冰得像井水，握完不撒开，借着握手的架势把我上下晃了三晃，用审慎夫人的嗓子宣布：“赌约成立，概不反悔！”门房探出头来骂我们吵。我们跑下石阶，他跑到一半又回过身，冲门房行了个寡妇的屈膝礼。"
next = "done"
effects = [{ kind = "affinity", person = "mathijs", value = 2 }, { kind = "relation", person = "mathijs", relation = "friends" }, { kind = "flag", flag = "c7_bond_mathijs_own" }, { kind = "start_track", track = "reunion_mathijs" }]

