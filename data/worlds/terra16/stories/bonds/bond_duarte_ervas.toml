text = "拿出我在船上编的册子，跟他比谁的页多、错得少。"
reply = "两本册子并排摆在账桌上。他的多出二十页，我的少两处错。“算平手。”他说完，又把我那本拿过去翻了几页，“不对。你少的那两处错，是因为你压根没画叶背——没画的东西当然错不了。”“叶背在船上会被风吹翻。”“那就拿东西压住。”我们从叶背争到叶柄，又从叶柄争到花期，一直争到印度之家的看门人来敲窗，说要锁仓了。杜阿尔特冲窗外喊：“再给一刻钟！”看门人嘟囔着走开，我们又争了好一阵。最后他把两本册子摞在一起，抱在怀里不撒手：“明年接着比。这回我画花，你把叶背给我补齐。”"
