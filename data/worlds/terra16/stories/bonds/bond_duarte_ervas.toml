# B1：1554 年秋，印度船队回港，印度之家的药材仓。辨样比赛他赢一处。
[[tracks.chapters]]
key = "b1"
title = "印度船上的药"
text = "秋天，印度船队进了港，印度之家的药材仓一夜之间堆满了：肉桂一捆捆码得像柴火，大黄切成了块，樟脑装在锡罐里，还有一小匣牛黄，管仓的人连看都不让我们多看。师傅们让学徒比赛辨样，每人一只木盘，盘里十二格，每格一撮药，写上名字交上去。我错了两格：把一块桂皮当了肉桂，把一截姜黄认成了干姜。杜阿尔特只错一格，他把樟脑写成了明矾。名次贴出来，他第一。管仓的人念到他的名字，他只说：“樟脑那格我写错了，该扣。”他看着名次表，没有一点高兴的样子，回去就在册子上写自己那一处错，字比我那两处加起来还大，占了小半页。“错的人更该记住，”他说，“赢了的尤其。”说完他又把木盘端起来，凑近那格樟脑，闻了一遍又一遍。"
