# 重逢：1562 年秋，印度之家的码头与仓边的小账房（与贝阿特丽丝 1562 年春的重逢错开季节）。
[[tracks.chapters]]
key = "reunion"
title = "自己的笔迹"
text = "印度之家的码头上，刚靠岸的船正往下卸药材，麻袋一直堆到仓门口。杜阿尔特站在麻袋中间，身边跟着两个学徒，他念一个名字，写一张签，学徒就往袋口上贴，再没有人回头去问师傅。他看见我，手里的笔没放，先把那箱樟脑的签写完，才走过来。“你回来了。”他袖口上全是墨，“罗西奥那边医院的贝阿特丽丝托我送布过去，我正愁走不开。”天黑以后，他带我进仓边的小账房，搬出那本识别册，已经厚得合不拢了。“祖母前年冬天走了。”他一页页翻着，“她的方子，我现在用自己的字抄，抄在她教我认的那些草后面。”他一直翻到最后。最后几页什么也没压，只在页眉写着我的名字。“这几页，是给你的。”"
window = [[1562, 8, 1], [1562, 11, 30]]
at = "lisbon"
cast = ["duarte_ervas"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1562, 8, 1], to = [1562, 11, 30] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "duarte_ervas", text = "识别册编到第一百二十页了。最后几页还留着，页眉写了你的名字，你哪天回里斯本，哪天来压。祖母前年冬天走了。她的方子我已经用自己的字抄完，抄在她教我认的那些草后面，没有一张再换别人的手。今年印度来的樟脑成色不好，我认了三遍才敢贴签。随信附一片迷迭香叶，在河边晒药场采的，那天晴，风从海上来。——杜阿尔特" }, { kind = "flag", flag = "c7_bond_duarte_ervas_missed" }]

