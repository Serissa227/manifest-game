#       贝阿特丽丝·西芒（beatriz_simao，1540-10-01）只在重逢里提一句（托他往医院送布），不写她与他的事。
# 年龄：学院章（1554—1556）两人 13—16 岁。a1 的守夜给 heart +6（双方 ≤ 17）；a2 的回赠叶子给 heart +6（要求 heart ≥ 6）；
#       s 的 heart 选项要求双方 16—17 岁（1556-12 杜阿尔特 16 岁），给 heart +12、crush，告白只到“等你回来再说”，最多拉手；
#       恋人只在 1562 年重逢（杜阿尔特 21—22 岁），要 c7_bond_duarte_ervas_romance + heart ≥ 24 + 双方满 18。
# 依据：史实——新街（Rua Nova dos Mercadores）是里斯本的商铺街；印度之家（Casa da Índia）管香料与药材的入库，印度船队多在夏末秋初回港，
#       带回肉桂、大黄、樟脑、牛黄；葡萄牙的宗教裁判所 1536 年设立；1556 年的大斋期从 2 月 19 日起；罂粟糖浆、拉丁文的迪奥斯科里德斯是当时药铺常见的东西。
#       原创——杜阿尔特、他在阿连特茹乡下当草药婆的祖母与她的方子、换笔迹抄方、识别册、晒药场的“未辨”纸签。
#       待核：“肉桂有四种”是药铺学徒的行话（奥尔塔 1563 年的书才系统地分辨），正文只让杜阿尔特这么说；樟脑错认成明矾是虚构的失误。
# 宗教裁判所只作世界的阴影，不写审判场面；祖母的事只在 b2 由他自己说出，不进见闻（本文件各章无 stage，不写见闻）。
