# C7 羁绊线：杜阿尔特·埃尔瓦斯——药名旁的叶子（故事 2.0，A5 / E37 契约）
# 标签：any（主角为男时 BL，为女时 BG）。适用主角：custom_lisbon_medicine（里斯本医学之家的自创主角，1540 年生，“我”不写性别与外貌）。
# 人物：杜阿尔特·埃尔瓦斯（duarte_ervas，1540-09-25，男，romance any）：里斯本新街一家药铺的学徒，同学；认真、慢、爱画，被催急了会脸红却不改主意。
