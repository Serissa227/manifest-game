# C2：1554 年夏，河边的晒药场。野芹与毒芹，一张“未辨”的纸签。
[[tracks.chapters]]
key = "c2"
title = "太像的两片"
text = "河边的晒药场上，晒药的浅筐一排排摊到水边。杜阿尔特蹲在最后一只筐前，半天没动。筐里两片叶子挨着：一片是野芹，另一片也许是，也许不是。“毒芹，”我说，“你看它多细。”“野芹也有细的。”他把两片都翻过来，又翻回去，“要看茎上有没有紫斑，可送来的人只摘了叶子。”“师傅傍晚才回来。等他回来，全晒场都知道你认不出。”他的脸红到耳根，还是摇头。他从怀里掏出炭笔，把两片叶子都画下来，在旁边写了两个字：“未辨”。“宁可慢一天。慢一天，顶多挨一顿骂；认错一片，是有人要喝进肚里去的。”河风把纸签掀起一角，他捡了块卵石压住。"
