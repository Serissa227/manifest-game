# C1：1554 年春，新街的药铺。口头禅原句在这里用一次。
[[tracks.chapters]]
key = "c1"
title = "药名旁的叶子"
text = "新街的药铺里，杜阿尔特趴在柜台上背药名。他每写一个名字，就在旁边画一片叶子：“大黄”旁边是一片大得像扇子的，“鼠尾草”旁边那片画满了细毛。我笑他像小孩子描花样。他也不辩，起身把架上一排瓷罐挨个转过去，标签全朝着墙。“你背得比我快，那你认认看，哪一罐是甘菊？”我挑了两罐，揭开盖子，都错了。他没笑，从册子上撕下一张纸，把我认错的那两种叶子各画一片，又翻过来画叶背：一片的脉两两对着长，一片的脉一左一右错开。“名字是人起的，叶子自己就长成这样。先认叶，再背名。”师傅在后屋咳了一声。那排瓷罐还背对着我们。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "lisbon"
cast = ["duarte_ervas"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_lisbon_medical_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

