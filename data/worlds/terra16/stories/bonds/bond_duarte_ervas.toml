# 旗标：设 c7_bond_duarte_ervas_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       s 的 promise 与 heart 设共享旗标 c7_tie_new_beatriz_simao_duarte_ervas_taken（配角线 tie_new_beatriz_simao_duarte_ervas 读）；
