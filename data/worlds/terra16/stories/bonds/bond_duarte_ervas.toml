# S：1556 年 12 月，我要上船。promise / heart 带 bond S 并设配角线的 _taken；own 永远可选。正文不以“结业时”开头。
[[tracks.chapters]]
key = "s"
title = "识别册的第一页"
text = "十二月，我的船定了开航的日子。去药铺辞行那天，杜阿尔特正把一刀新纸裁成一样大小，每一张都对齐了才放下。“我要编一本册子，”他说，“铺子里用得着的草，一种一页，叶面、叶背、花、根都画上，名字写在最底下。学徒照着它认，就不会再把毒芹当野芹。”他把第一页给我看：野芹。叶背的脉比那年夏天晒药场上那张描得细多了，右下角写着两个字：“已辨”。“名字写在最后，先让人看叶子。”他低头接着裁纸，刀没停，“你走的那些地方，叶子大概跟这里都不一样吧。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "lisbon"
cast = ["duarte_ervas"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_duarte_ervas" }, { kind = "flag", flag = "c7_bond_duarte_ervas_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好在航路上替他收叶子，每一片都记清在哪里采的。"
requires = [{ kind = "bond", person = "duarte_ervas", level = "A" }]
hint = "这样的约，你们还没熟到能许，或者你已经许给了别人。对他，你只能说一句：路上看见好叶子，给你带几片。"
reply = "“还要记那天的天气，”他说，“晴天采的和下过雨采的，晒出来不一样。”我说好。他转身从柜子底下抽出一沓油纸，已经裁好了，边角对得齐齐的，塞进我怀里：“压叶子用。叶子比信难带——信湿了还认得出字，叶子一受潮就黑了。”我问他要给我留几页。他把册子翻到最后，数也没数：“你带回来多少，我就留多少。”我把油纸放进行李最上面一层。走到街口，他又追出来，递给我一截炭笔，说船上的墨水会洒。“炭笔画得粗，”他说，“叶背的脉，你描两遍。”"
next = "done"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 5 }, { kind = "bond", person = "duarte_ervas", level = "S" }, { kind = "relation", person = "duarte_ervas", relation = "friends" }, { kind = "flag", flag = "c7_bond_duarte_ervas_promise" }, { kind = "flag", flag = "c7_tie_new_beatriz_simao_duarte_ervas_taken" }, { kind = "memory", memory = "mem-bond_duarte_ervas-s", title = "识别册的第一页" }, { kind = "start_track", track = "reunion_duarte_ervas" }]

[[tracks.chapters.choices]]
key = "heart"
text = "告诉他：回来那天，想先看他画的叶子，再看他。"
requires = [{ kind = "bond", person = "duarte_ervas", level = "A" }, { kind = "heart", person = "duarte_ervas", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "duarte_ervas", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "duarte_ervas" }]
hint = "这句话到了嘴边，又咽了回去——你们还没走到那一步。"
reply = "杜阿尔特手里的刀停了。他的耳朵先红了，人却笑了：“你这句话里没有叶子。”“那你替它画一片。”他放下刀，把我的手拉过去摊开，用指尖在我手心里画：先画叶柄，再画叶尖，又翻过来似的画叶背的脉，比他画任何一页都慢，痒得我想缩手又不敢。画完了，他没松手。“等你回来，”他说，“剩下的回来再说。”师傅在后屋喊他去研药，他应了一声，手还是没松，等师傅喊到第二遍才放开。我把那只手攥起来，一路攥到码头，上了跳板才松开。"
next = "done"
effects = [{ kind = "heart", person = "duarte_ervas", value = 12 }, { kind = "relation", person = "duarte_ervas", relation = "crush" }, { kind = "bond", person = "duarte_ervas", level = "S" }, { kind = "flag", flag = "c7_bond_duarte_ervas_romance" }, { kind = "flag", flag = "c7_tie_new_beatriz_simao_duarte_ervas_taken" }, { kind = "memory", memory = "mem-bond_duarte_ervas-s", title = "识别册的第一页" }, { kind = "start_track", track = "reunion_duarte_ervas" }]

[[tracks.chapters.choices]]
key = "own"
text = "约他比一比：看谁先编完一本识别册。"
reply = "“你在船上编不完的。”“船上叶子多。”他把裁纸刀往桌上一放，伸出手来：“那说好了，输的人把赢的人那本从头到尾抄一遍，叶子也得画。”我跟他击了掌，掌心沾了一手纸屑。他当场在自己的第一页上写下日期，又撕下一张纸给我，让我也写上：“免得你回来说你早就开始了。”我把那张纸折成四折，塞进靴筒，又当着他的面拍了两下。他送我到门口，嘴里还在念：“叶背，别忘了画叶背。”我走出老远回头，他还站在门口，举着那页写了日期的纸冲我晃。"
next = "done"
