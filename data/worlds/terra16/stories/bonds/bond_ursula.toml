text = "离我们约好比账的那一年，还剩五年。一五六一年我回到安特卫普，头一件事就是去看乌尔苏拉的账房开得多大。她家的商行搬到了交易所后头一条窄街上，铺面比从前小了一半。五七年王室停付，她父亲垫出去的钱一个铜子也没回来，记在她名下的那一笔，热那亚人的代理人还上门讨过。她坐在最里头的桌子后面，算筹排成三列。桌腿边靠着一块橡木门牌，刻的是她自己的名字，后面跟着“账房”两个字，还没上漆——账房还没开出来。她看见我，下巴先抬了起来，把一本账推过来。“挑完错，才许坐。挑不出来，你就先站着。”"
