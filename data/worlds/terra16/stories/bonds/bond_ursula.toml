# A2 · 1556 夏秋 · 月桂树女校的自习：小一圈的黑马（赠礼 carved_chessman 只在 keep_knight）
# default：那只小马乌尔苏拉自己留着，补在了她家的棋盘上。
[[tracks.chapters]]
key = "a2"
title = "小一圈的马"
text = "月桂树女校午后的自习课上，乌尔苏拉在我桌上放下一只木头马。她家有一副从奥格斯堡带来的棋，搬家时丢了一只黑马。她照着剩下的那只刻了一个夏天，左手拇指上还缠着布条。新刻的马比旧的小了一圈，摆回她家的棋盘上，像跟在大马后头跑的一匹驹子。“这只配不上我家的棋，”她说，“你们家的棋，我上回看见也少了一只。”她说得很随便，眼睛看着窗外的院子。可那只马的鬃毛一根一根都刻出来了，我数了一遍，二十三根。“木头是梨木，”她又说，“在奥格斯堡，我们刻棋子只用梨木。你要是嫌小，就算了。”"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "antwerp"
cast = ["ursula"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "keep_knight"
text = "收下小马：下回下棋，就用这只马赢她。"
requires = [{ kind = "affinity", person = "ursula", ge = 80 }, { kind = "bond", person = "ursula", level = "B" }]
hint = "她刻了一整个夏天，拇指还缠着布——你们还没熟到让她放心把它交到你手里。"
reply = "我把小马攥进手心。“下回下棋，我就用它赢你。”“你赢不了，”乌尔苏拉说。“那就记账。”她终于把头转回来，笑了：“好。账上又多一笔。”那天晚上，我把家里棋盒中空着的那一格擦干净，把小马放进去。大小差了一圈，盒盖照样合得上。"
next = "s"
effects = [{ kind = "affinity", person = "ursula", value = 2 }, { kind = "bond", person = "ursula", level = "A" }, { kind = "item", item = "carved_chessman", qty = 1 }, { kind = "memory", memory = "mem-bond_ursula-a2", title = "小一圈的马" }]

[[tracks.chapters.choices]]
key = "pay_for_it"
text = "我只收算得清的礼——问她这只马值多少。"
requires = []
reply = "我问她开价。乌尔苏拉眼睛都不眨：“一个金弗罗林。”“木头的？”“一个夏天的工。”我还价，她不让，我们从一个弗罗林讲到六个斯泰弗，又从六个斯泰弗讲回八个，讲了半个时辰，门房来锁门了。最后成交价是一盘棋，她执白，她先走。棋还没下，小马先押在她那里。"
next = "s"
effects = [{ kind = "affinity", person = "ursula", value = 3 }]

# S · 1556 年 12 月 · 两栏的账纸：第一笔谁先记
# default：最后一天乌尔苏拉没来，那页账她自己收着，下面还空着——开启重逢，设 _parted。
[[tracks.chapters]]
key = "s"
title = "两间账房"
text = "十二月，月桂树女校只剩最后几天课了。乌尔苏拉把算筹袋往我桌上一放，从里面抽出一页对折的账纸。“我家商行开春要改做热那亚人的生意了，”她说，“替他们跑汇票，抽佣钱。我不跟着转。我要一间账房，门口挂我自己的名字。”“你父亲答应？”“他还不知道。”她把账纸摊平，“你开春出海，我知道。”纸上画着一条竖线，分成两栏，左栏顶上写着“乌尔苏拉”，右栏写着“莉芙·德克莱尔克”，底下一行字也没有。她把笔蘸了墨，横放在两栏中间。“第一笔，谁先记？”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "antwerp"
cast = ["ursula"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_ursula" }, { kind = "flag", flag = "c7_bond_ursula_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好：往后每一笔大账，都请对方来挑错。"
requires = [{ kind = "bond", person = "ursula", level = "A" }]
hint = "她把笔递过来，你却落不下去——要么你们还没走到能许这种约的地步，要么这一辈子只许一回的话，你已经对别人说过了。"
reply = "“往后每一笔大账，”我说，“做之前都拿来给对方挑错。你的给我，我的给你。”乌尔苏拉握着笔想了一会儿，在两栏中间横着写下第一笔：“互相挑错，永不收费。”她写得很慢，最后一个字的墨洇开了一点。“永不收费？”我说，“你家在奥格斯堡也这么做生意？”“奥格斯堡没人做这种生意。”她把笔递给我，“这是我做过最亏本的一笔。你签。”我在右栏底下签了名，她在左栏底下签了名。她把账纸对折，又对折，从算筹袋里倒出几颗算筹，把纸塞进去，再把算筹一颗颗装回去。“挑错要挑得狠，”她说，“你要是替我遮一处，这一笔就作废。”“你也一样。”“我从来不替人遮。”她把袋口扎紧，“你出海以后，头一封信别光写风浪，把你的账附上。”"
next = "done"
effects = [{ kind = "bond", person = "ursula", level = "S" }, { kind = "relation", person = "ursula", relation = "friends" }, { kind = "memory", memory = "mem-bond_ursula-s", title = "两间账房" }, { kind = "flag", flag = "c7_bond_ursula_promise" }, { kind = "start_track", track = "reunion_ursula" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好十年以后，比一比谁的账房更大。"
requires = []
reply = "“十年，”我说。乌尔苏拉的眼睛一下子亮了，比她算对哪一道题都亮。“怎么算大？”“看账面。一年过手的数，谁多谁大。”“借来的钱不算。”“借来的钱不算。”她在左栏写下：“一五六六年十二月，比账。”又在底下添了一行：“输的人，替赢的人记一年账。”写完把笔塞给我：“你签。”我签了，她也签了。她伸出手，我跟她击了一掌，她的掌心有一道硬茧，是这几年推算筹推出来的。“你要是在海上淹死了，”她说，“这一笔算你输。”“你要是门牌上挂的不是你自己的名字，算你输。”她哼了一声，把账纸收进算筹袋：“那你就等着替我记账吧。”"
next = "done"
effects = [{ kind = "affinity", person = "ursula", value = 2 }, { kind = "relation", person = "ursula", relation = "rivals" }, { kind = "flag", flag = "c7_bond_ursula_own" }, { kind = "start_track", track = "reunion_ursula" }]

