reply = "“规矩是你定的，”我说，“唱。”她瞪了我很久，还是唱了，唱的是奥格斯堡的一首儿歌，讲一只鹅过河。调子跑到河对岸去了，门房在门洞里笑得直咳嗽。唱完她把弓往我手里一塞：“这一段，我会还你的。”“我等着，”我说，“利息按月算。”"
