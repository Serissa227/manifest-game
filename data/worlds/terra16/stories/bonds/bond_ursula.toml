# 重逢 · 1561 · 交易所后街的窄铺面：靠在桌腿边、还没挂上去的门牌
# default：主角错过安特卫普，收到她一页账单式的来信，最后一行“未结”；设 _missed。
[[tracks.chapters]]
key = "reunion"
title = "挂自己名字的门牌"
text = "一五六一年我回到安特卫普。乌尔苏拉家的商行搬到了交易所后头一条窄街上，铺面比从前小了一半。这几年热那亚人挤得厉害；五七年王室停付那一回，她父亲垫出去的钱一个铜子也没回来，记在她名下的那一笔，热那亚人的代理人还拿着抄件上门讨过。她坐在最里头的一张桌子后面，袖子挽到手肘，算筹在算布上排成三列。桌腿边靠着一块橡木门牌，字刻好了，还没上漆，刻的是她自己的名字，后面跟着“账房”两个字。账房还没开出来。她抬头看见我，愣了一下，没站起来，把一本账从桌子那头推了过来。“挑完错，才许坐。”"
window = [[1561, 1, 1], [1561, 12, 31]]
at = "antwerp"
cast = ["ursula"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1561, 1, 1], to = [1561, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "ursula", text = "莉芙：你没回来，照记账的规矩，我记一笔。一五五七年，王室停付，我父亲那笔垫款，收回零。一五五八年，热那亚人的代理人拿着写我名字的那一页上门，要我认。我没认，他们的公证人到今天还在跑。那一页的原件锁在我自己的箱子里，钥匙我挂在脖子上，洗脸也不摘。一五五九年，父亲要我在替热那亚人跑汇票的契据上签字，我不签，他把我的桌子搬进了库房。一五六〇年，我在库房里替三家布商记账，一年过手的数，比商行还多。一五六一年，门牌刻好了，橡木，没上漆，靠在桌腿边上，明年开张那天挂。你出海这几年的账，我一笔也没看到，所以你那一栏我不知道怎么写。回来自己报给我。在奥格斯堡，我们不收没有凭据的账；在安特卫普也一样。——乌尔苏拉。你我之间：未结。" }, { kind = "flag", flag = "c7_bond_ursula_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "替她把这本账从头挑到尾，再帮她把门牌挂上。"
requires = []
reply = "她没说许坐，我就站着翻。账是她替三家布商代记的，一年过手一万四千镑，比她父亲的商行这一年还多。我挑出两处错：一处是安特卫普到里斯本的汇价抄错了一位，一处是一笔佣钱她少收了。头一处她看了一眼就认了，拿笔改了。第二处她不认：“那是我故意少收的，那家是寡妇。”“那就记成让利，别记成佣钱。”我们为这一行争到天黑，伙计点上了灯，最后她改成了“让利”，改完说我多事。然后我们把门牌搬到门口，比着门框试高低。我扶着，她踩在凳子上钉了两颗钉子，挂上去，退到街对面看了半天，不怎么歪。“这一块，”她说，“我先记你一笔。”她又把门牌摘下来，靠回桌腿边：“明年开张那天再挂，钉子先留着。”我走的时候，门框上那两颗钉子还在。"
