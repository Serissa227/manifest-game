reply = "乌尔苏拉听我说完，把算筹拨到一边，抬起头来看我，看得很仔细，像在看一张来路不明的汇票。“从离开月桂树那年的十二月算起，十年。还有五年。”她站起来，把门牌从桌腿边抱起来，搂在怀里，橡木的边硌着她的胳膊。“五年里我要是开不出来，就替你记一年账，一个字也不少记。”“我的账可多。”“那我就更得开出来。”她说，“热那亚人上回上门，我把这块牌子藏在柜子后头，怕他们看见了笑。往后不藏了。”她把门牌靠回去，正对着门口，进门的人头一眼就能看见。“五年以后你再来看。”我没坐，那本账也没挑，戴上帽子出了门。走到街口，她在里头喊了一声：“五年！”"
