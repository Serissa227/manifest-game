text = "新王登基还不到半年，交易所里人人都在算西班牙王室还付不付得起。我家兑换桌的墨水瓶底下压着一张王室的汇票，九百杜卡特，过期四个月了，父亲每天早上把它抽出来看一眼，再压回去。乌尔苏拉来找我，开口就是：“他还在垫。”她父亲上礼拜又替王室垫了一笔，比坏账那一页上的还多。“我跟他说了，他不听我的。”我们坐在交易所的回廊里，脚底下是四种话的吵嚷。她拿一颗算筹在指间转来转去，转到第七圈停住：“我们赌一把。圣诞节以前，王室付不付。”"
