# C7 羁绊线：乌尔苏拉（账还没结）。故事 2.0，遵循 A5 / E37 契约。2026-10-12 重写，Claude（Opus）执笔。
# 标签：rival（对手）·羁绊线。乌尔苏拉不开放恋爱：全线只写友情与较劲，不写心动选项，也不写心照不宣的段落。
# 章节：C1 C2 B1 B2 A1 A2 S，另有成年重逢一章（reunion_ursula，1561）。
# 人物：乌尔苏拉（ursula，1540-08-22 生，女），奥格斯堡富格尔商行驻安特卫普代理人的女儿；
#       主角莉芙·德克莱尔克（lieve，1540-10-12 生，女），安特卫普兑换商的女儿。
# 年龄：学院期（1554—1556）两人都是 13 到 16 岁；重逢 1561 年都已二十出头。
# 依据（史实）：纽伦堡是十六世纪打制计数铜片（算筹）的中心，商人在画了横线的算布上推算筹记数，一颗落错线就差十倍；
#   纽伦堡姜饼底下垫一层圣饼纸；佛兰德镑 = 20 先令 = 240 格罗特；里昂交易会的汇票以埃居计；
#   安特卫普的射手公会每年射竿顶的木鸟（射下者当一年的“王”），女孩不能入会；
#   1531 年落成的安特卫普新交易所有带回廊的内院，十一点开市报价；
#   1556 年 1 月腓力二世继承西班牙王位，王室汇票越付越慢，1557 年 6 月停付，富格尔损失惨重，热那亚人取而代之；
#   “月桂树”女子法语学校 1555 年 8 月开学，在此之前莉芙与乌尔苏拉在城里另一所私立法语女塾念书。
# 依据（原创）：三十一颗算筹与最旧的那一颗、伦敦汇价的第二题、动词抄一百二十行、红漆木鸟与屋顶的风信鸡、
#   1549 年开在九岁的乌尔苏拉名下的户头（四千二百杜卡特）与十七张凭据、墨水瓶底下九百杜卡特的汇票、
#   小一圈的黑马与二十三根鬃毛、两栏的账纸、橡木门牌与门框上的两颗钉子，全部台词。
#   待核：1549 年富格尔驻安特卫普的代理人能否以家人名义另立王室垫款的户头——正文只写成一家的旧账，不点名富格尔。
# 口头禅：“我没输，账还没结呢。”原句只在 C1 正文出现一次；别处用别的话呼应（“我还没认账”“未结”）。
# 秘密：父亲借她的名义藏了一笔坏账——B2 她拿来给莉芙核；本文件不写任何见闻（羁绊章没有 stage），来信只写给莉芙。
# 缺省走向（玩家不选时每章照走，没有收获）：
#   C1 先生判莉芙赢，乌尔苏拉一下午没跟人说话 → C2 那块姜饼她自己吃了，吃完又告了一回状
#   → B1 那天一只木鸟也没射下来，她说鸟做得太结实 → B2 那页坏账她锁进自己的箱子，一个字没说
#   → A1 那年圣诞节王室付了一半，她说算平局 → A2 小马她自己留着，补在她家的棋盘上
#   → S 最后一天她没来，那页账自己收着：开启重逢并设 c7_bond_ursula_parted，无关系变化
#   → 重逢 1561：主角不在安特卫普就收到她的一封账单式来信，最后一行“未结”，设 c7_bond_ursula_missed。
# 羁绊阶梯：C2 split_it 给 C、B1 make_her_sing 补签 C；B2 verify_with_her 给 B、A1 bet_no 补签 B；
#   A2 keep_knight 给 A + carved_chessman + 回忆；S promise 为一生一约（bond S + friends），own 为十年比账（rivals）。
# 落点：友情（friends，_landing_friend）与对手（rivals，_landing_rival）；重逢的变体读本文件的 _promise 与 _own。
# 旗标：写 c7_bond_ursula_promise / _own / _parted / _landing_friend / _landing_rival / _missed。不读别线旗标。
# 与别线的分工：成年后与比安卡·马雷的对手线归 tie_new_ursula_bianca_mare（1562 年账房开张），本文件不写比安卡；
#   重逢里门牌只试挂、明年开张那天才挂，与那条线的 1562 对齐。
# 日程：不改。全线在 antwerp。

[[tracks]]
