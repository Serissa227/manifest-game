# C1 · 1554 春 · 城里的法语女塾：里昂汇票的题，一颗算筹落在百位线上
# default：先生判我赢，乌尔苏拉一下午没跟人说话。
[[tracks.chapters]]
key = "c1"
title = "纽伦堡算筹"
text = "女塾的先生在石板上写了一道题：里昂来的汇票，三百埃居，一埃居折六十五格罗特，合多少佛兰德镑。乌尔苏拉把她那袋纽伦堡算筹倒在算布上，铜片哗哗地响，推了几下就举手：“八百一十二镑十先令！”我还在心里除二百四十，晚了一口气：“八十一镑五先令。”先生把两个数并排写上去。我一眼就看出来了：她起头那颗算筹就落高了一条线，后面一路跟着高上去，整整大了十倍。“题出得含糊，”乌尔苏拉说，“没说是哪一种埃居。”先生说里昂的汇票只认一种。她又说：“在奥格斯堡，我们是这么算的。”先生判我赢。她不再吭声，把算筹一颗一颗捡回袋子里，三十一颗，一颗也没落下，然后抬起下巴看着我：“我没输，账还没结呢。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "antwerp"
cast = ["ursula"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_antwerp_laurel" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "bet_next"
text = "跟她赌下一题，赌一块她家的姜饼。"
requires = []
reply = "“赌就赌。你押什么？”我说要是我输了，答数本子借她抄一天。下一题是伦敦的汇价，这回她先举手，一颗算筹也没摆错。我认了，把本子推过去，她看都不看又推回来：“谁要抄你的。你没押对东西。”姜饼自然也没有。我在本子边上记了一行：“头一题我，第二题她，姜饼零块。”她探过头看见了，鼻子里哼一声：“记就记。头一题那笔，我迟早讨回来。”"
next = "c2"
effects = [{ kind = "affinity", person = "ursula", value = 2 }]

[[tracks.chapters.choices]]
key = "show_your_work"
text = "把我的草算推给她，让她自己找错在哪一位。"
requires = []
reply = "我把草算的那张纸翻过来推给她，八十一镑五先令写在最底下。她不肯接，过了一会儿还是拉过去，手指沿着我那几行数一位一位往下对，刚对到头一行就停住了，脸一下子红到耳根。她一句话没说，把纸推了回来。第二天早上，我的桌上多了一颗算筹，铜面磨得发亮，印的帝国宝球只剩一个圈——是她那三十一颗里最旧的一颗。她的袋子里从此是三十颗。"
next = "c2"
effects = [{ kind = "affinity", person = "ursula", value = 3 }, { kind = "skill", skill = "double_entry", value = 8 }]

# C2 · 1554 夏 · 法语课上记胡椒价被告状，罚抄动词；门口的姜饼
# default：那块姜饼乌尔苏拉自己吃了，吃完又告了一回状。
[[tracks.chapters]]
key = "c2"
title = "告状的姜饼"
text = "交易所的钟一敲十一下，胡椒的报价就出来了。法语课上，我把今天的价钱记在书页边上：每磅二十二格罗特，比上礼拜涨了一个。乌尔苏拉坐在我斜后方，她举起手：“先生，莉芙在记交易所的价钱。”先生罚我把动词“是”的变位抄二十遍。六个人称，一遍六行，一共一百二十行，钟敲十二下我还没抄完。下课以后，乌尔苏拉在门口等我，手里托着一块姜饼，底下垫着一层薄薄的圣饼纸，是她家从纽伦堡捎来的。全女塾都知道，她的姜饼从来不分给别人，连先生都没尝过。她把姜饼往我手里一塞：“别当成道歉。是你抄得太慢，我在后头看着都饿了。”说完她瞄了一眼我抄红了的手指头，又把眼睛转开。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "antwerp"
cast = ["ursula"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "split_it"
text = "收下姜饼，掰一半还给她。"
requires = [{ kind = "affinity", person = "ursula", ge = 20 }]
hint = "她托着姜饼的手还僵着——刚告了你的状，她拉不下这个脸跟你分着吃。"
reply = "我把姜饼掰成两半，大的那半递回去。她接过去，愣了一下：“你这人，算账算到姜饼上来了。”“大半归你，”我说，“告状的人出力多。”她瞪我一眼，还是咬了一口。我们站在门口把姜饼吃完，碎屑掉了一地，招来两只麻雀。告状的事，那天一直到散，一句也没提。"
next = "b1"
effects = [{ kind = "affinity", person = "ursula", value = 2 }, { kind = "bond", person = "ursula", level = "C" }]

[[tracks.chapters.choices]]
key = "refuse_it"
text = "不收：我只收算得清的东西。"
requires = []
reply = "“一块姜饼，”我说，“抵不了一百二十行字。”乌尔苏拉想了想：“那就算清楚。二十遍动词，一遍值多少，你自己除——反正一共值一块姜饼。”她把姜饼搁在我桌上就走了。我对着它抄完最后一行，三口吃光了。挺甜的。"
next = "b1"
effects = [{ kind = "affinity", person = "ursula", value = 3 }]

# B1 · 1554 秋 · 女塾院子：借来的小弓、红漆木鸟、屋顶的风信鸡
# default：那一天的木鸟一只也没射下来，乌尔苏拉说那只鸟做得太结实了。
[[tracks.chapters]]
key = "b1"
title = "院子里的木鸟"
text = "射手公会每年在城墙根下射木鸟，射下来的人当一年的“王”。女孩只能站在绳子外头看，看完了还得回家。秋天开课的头一个礼拜，乌尔苏拉从表哥那里借来一张小弓，在女塾的院子里竖了一根竿子，顶上挂一只她自己涂了红漆的木鸟。“在奥格斯堡，我们射鸟是有规矩的，”她说，“射偏一箭，唱一段歌。我记分。”我射偏了三箭，唱了三段，唱得门房都探出头来。轮到她，头一箭擦着竿子飞进了邻家的菜园。“风向不对，”她马上说，“这一箭不算。”我唱第三段的时候，一直盯着对面屋顶上的风信鸡。“一刻钟里它只转过一回，”我说，“还是在我射头一箭之前。你这一箭的风，跟我那三箭是同一阵。”乌尔苏拉握着弓，脸慢慢红了。"
