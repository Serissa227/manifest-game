text = "乌尔苏拉是礼拜六下午来的，胳膊底下夹着一本皮面磨毛了的旧账。她翻到折了角的那一页，推到我面前。页首写着她的名字。户头开在一五四九年，那年她九岁；户里只有一笔，四千二百杜卡特，垫给西班牙王室的，到今天一个铜子也没收回来。“我翻家里的旧账翻出来的，”她说，“我父亲替王室垫的钱，记在我名下。”她把一叠凭据也带来了，拿麻绳捆着。“全安特卫普，我只信你算账不偏。你替我核一遍。”她先在算布上把那笔数推了一遍。算筹推得很慢，每推一颗，嘴唇就动一下，像在说一个“不”。"
