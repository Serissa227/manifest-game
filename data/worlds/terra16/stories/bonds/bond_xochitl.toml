# B2：1555 年，修院的廊下。莫利纳的那瓦特语词典；她夜里借着月光偷偷翻。
[[tracks.chapters]]
key = "b2"
title = "莫利纳的字典"
text = "1555 年，修院里来了一本新书。加斯帕尔·安东尼奥·奇从墨西哥城带回一本刚印出来的那瓦特语词典，是方济各会的莫利纳修士编的，一边卡斯蒂利亚话，一边那瓦特话，厚得像一块砖。修士们在前院传着看，有人叫霍奇特尔过去认几个字。她把手背在身后不肯去：“我才不用字典。我生下来就会。”那天我在修院里帮着晒书，走得晚。从廊下过的时候，看见廊柱后头蹲着一个人，膝盖上摊着那块砖头，借着月光，一个字一个字地往下念，念得很慢，嘴唇跟着动。是霍奇特尔。她听见脚步声，“啪”地合上书，抬头看见是我，又慢慢打开了。月光底下，看不出她脸红没红。她盯着书页问：“‘朋友’，在你们的话里怎么说？”"
