# C2：1554 年夏，圣克里斯托瓦尔区她家的院子。她母亲的那篮羽毛；蜂鸟羽毛在太阳底下转。
[[tracks.chapters]]
key = "c2"
title = "羽毛的光"
text = "霍奇特尔家在城西的圣克里斯托瓦尔区，院子里晒着一排竹匾。她母亲接了一桩活，要把一大篮羽毛分出等次。霍奇特尔在修院门口拦住我：“你手闲着吧？来帮忙。”口气像是赏了我一个差事。我按大小分，大的一堆，小的一堆，分得飞快。她在旁边看了一会儿，看不下去了，从我那堆里拈出一根蜂鸟羽毛，捏着羽杆举到太阳底下，慢慢地转。从这边看是绿的，像雨后的叶子；转一下，成了紫的；再转一下，红得像一块炭火。“大小有什么用。”她说，“我娘的手艺，就是把每一根羽毛贴在它最亮的那个角度上。贴歪一点，就是一根死毛。”她母亲在屋里咳了一声。她压低嗓子，把那根羽毛放回篮子里，又补了一句：“这个，墨西哥城的人也不一定会。”"
