[[tracks.chapters.choices]]
key = "brag_back"
text = "跟她比：我家的独木舟靠过的港口，比她说的街还多。"
reply = "她不服，我们就一个一个地数。她数墨西哥城的街，我数独木舟靠过的岸，从希卡兰戈一直数到洪都拉斯湾的河口。数到太阳偏西，两个人都不肯先停。最后她把下巴一抬：“那你那些港里，有羽毛市吗？”我想了想，说没有。她得意了一整个傍晚，走出修院大门还回过头来，冲我晃了晃那根羽毛。"
