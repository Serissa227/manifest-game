key = "hold_her_hand"
text = "握住她的手，陪她把脚一点一点伸进水里。"
requires = [{ kind = "affinity", person = "xochitl", ge = 20 }, { kind = "romance_open", romance_open = "xochitl" }]
hint = "她往后缩了半步——你们还没熟到她肯把手交给你。"
reply = "她蹲下来，把手交给我，攥得那么紧，指甲都掐进了我的手背。脚趾先碰到水，她“嘶”了一声；然后是脚背，脚踝。她就坐在石沿上，两只脚泡在深蓝的水里，一寸也不肯再往下。我在水里扶着石头陪她，手被攥得发疼，也没抽开。阳光从洞顶挪到了洞壁上。她低头看着自己的脚在水里变得又白又远，忽然说：“你们玛雅人，真敢。”洞里转了好几圈，才把这句话送回来。"
next = "a2"
effects = [{ kind = "affinity", person = "xochitl", value = 2 }, { kind = "heart", person = "xochitl", value = 6 }]

[[tracks.chapters.choices]]
key = "never_been"
text = "轻声问她：墨西哥城的湖，你真的见过吗？"
requires = [{ kind = "affinity", person = "xochitl", ge = 50 }, { kind = "bond", person = "xochitl", level = "C" }]
hint = "那句“浅的”还在洞壁上打转。这一问戳得太准，以你们现在的交情，还经不起。"
reply = "她没接话。她看着水面，水面上晃着洞顶那一块光。过了很久，久到我以为她不会答了，她说：“没见过。一次也没有。”她说她生在行军的路上，她爹跟着蒙特霍打进尤卡坦的那几年，她娘背着她走。墨西哥城的街、湖、市场，全是她娘讲的。说完她把脸埋进膝盖里，肩膀一下一下地动。我爬上石沿，湿淋淋地坐在她旁边，没出声，等她自己把头抬起来。"
next = "a2"
effects = [{ kind = "affinity", person = "xochitl", value = 2 }, { kind = "bond", person = "xochitl", level = "B" }]

[[tracks.chapters.choices]]
key = "swim_for_her"
text = "不逼她下水，自己潜到最深的地方，替她看看底下有什么。"
reply = "我吸足一口气往下潜。蓝变成黑，耳朵胀得生疼，摸到一块冰凉的石头，我才往上浮。冒出水面的时候，霍奇特尔已经趴在石沿上，哭得满脸是泪，喊的是我岛上的名字，伊希·妮克特——我都不知道她什么时候记住的。“底下什么也没有，”我喘着气说，“就一块石头。”“疯子！”她抹了一把脸，“你们玛雅人全是疯子。”骂完，她自己先笑了。"
next = "a2"
effects = [{ kind = "affinity", person = "xochitl", value = 3 }]

# A2：1556 年夏秋，修院前院。她绣的蜂鸟香袋，抽绳换了两回（赠礼 embroidered_pouch）。
[[tracks.chapters]]
key = "a2"
title = "换了两回的抽绳"
text = "霍奇特尔把一只香袋塞给我的时候，眼睛看着别处，好像那东西烫手。袋子只有巴掌大，粗棉布，上头绣着一只蜂鸟，蜂鸟的身子是用真羽毛贴的——她娘做活剩下的碎羽，一片一片地叠，在太阳底下一转，从绿到紫。抽绳是蓝的。这只袋子我在她家院子里见过两回：上个月系的是红绳，前几天换成了黄的。她从来没问过我喜欢什么颜色。袋里装着一小撮科巴脂香，凑到鼻子底下，是松脂混着烟的味道。“集上那个卖香的老头，”她说，“我磨了他三天。”她顿了一下：“拿着，诺——”说到一半咽了回去，改成，“拿着就是了，别问那么多。”"
