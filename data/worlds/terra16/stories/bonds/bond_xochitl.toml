# 重逢：1563 年，墨西哥城安娜的羽毛画坊。她教孩子在光下认羽毛；她贴的第一幅画，扉页上落款的地方。
[[tracks.chapters]]
key = "reunion"
title = "画坊的门"
text = "1563 年，我到了墨西哥城。城比霍奇特尔当年吹的还要大：堤道从湖上一直伸进城里，运河上挤满了独木舟，走一天也走不到头。我在圣胡安那一片的巷子里问了三个人，才找到安娜·德·拉·克鲁斯的羽毛画坊。门开着，屋里很亮，墙上挂着贴了一半的画。霍奇特尔坐在靠窗的长桌边，正教一个七八岁的孩子认羽毛。她捏着孩子的手腕，让他把一根蜂鸟羽毛对着窗户转：“这边，绿的。再转——停。这一下最亮，记住这个角度。”孩子问墨西哥城的人是不是都会这个。“不一定。”她说完抬起头，看见了我。她放下羽毛，在围裙上擦了擦手，什么也没说，领我进了里间。墙上挂着一幅羽毛画，一只蜂鸟停在一枝花上，在光底下从绿转到紫。“我自己贴的第一幅。画坊的活只盖表姐的印，这一幅是我夜里贴的，不算画坊的。”画背后衬着一页厚纸当扉页，右下角是落款的地方，那瓦特字写着她的名字，旁边空着一块。"
window = [[1563, 4, 1], [1563, 12, 31]]
at = "tenochtitlan"
cast = ["xochitl"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1563, 4, 1], to = [1563, 12, 31] }]

[[tracks.chapters.variants]]
key = "with_ines"
when = [{ kind = "flag", flag = "c7_pair_xochitl_ines_solis_together" }]
text = "1563 年，我到了墨西哥城。城比霍奇特尔当年吹的还要大：堤道从湖上一直伸进城里，运河上挤满了独木舟，走一天也走不到头。我在圣胡安那一片的巷子里问了三个人，才找到安娜·德·拉·克鲁斯的羽毛画坊。霍奇特尔坐在靠窗的长桌边，正捏着一个孩子的手腕，让他把一根蜂鸟羽毛对着窗户转：“这边，绿的。再转——停。记住这个角度。”另一张桌子边坐着从梅里达来的伊内斯，正往画的背面写卡斯蒂利亚字的标签。霍奇特尔看见我，朝那边扬了扬下巴：“她跟我一起来的。”说得很骄傲。然后她放下羽毛，领我进了里间。墙上挂着一幅羽毛画，一只蜂鸟停在一枝花上，在光底下从绿转到紫。“我自己贴的第一幅，夜里贴的，不算画坊的。”画背后衬着一页厚纸当扉页，右下角是落款的地方，那瓦特字写着她的名字，底下一行卡斯蒂利亚字，再往旁边，还空着一块。"

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "xochitl", text = "伊希·妮克特：画坊里的人说，今年有个岛上来的船长在圣胡安那一片打听羽毛画坊，问的是“霍奇特尔在哪儿”，没问安娜。除了你，谁还会这么问。偏偏那几天我跟表姐去特斯科科收羽毛，回来你的船已经走了。我气得打翻了一整盒碎羽，安娜骂了我半天。告诉你一件事：我到墨西哥城了。城真大。比我当年跟你吹的还大，大多少倍我数不过来，也不数了。湖是浅的，我下去过，水到膝盖，没哭。我贴了第一幅画，一只蜂鸟，扉页上落款的地方写了我的名字，旁边空着一块，留给谁，你自己猜。信里夹着一根蜂鸟羽毛。你对着太阳转，这边看是绿的；换个角度，是另一种颜色。是哪一种，等你来了，我当面告诉你。下回要来，先写信，写清楚哪个月到，我好在画坊门口等。我不想再打翻一盒羽毛。——霍奇特尔" }, { kind = "flag", flag = "c7_bond_xochitl_missed" }]

