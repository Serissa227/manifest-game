[[tracks.chapters]]
key = "a1"
title = "塞诺特"
text = "出城往东走一个时辰，有一口塞诺特。洞顶塌开一个口子，阳光从那里直直地照下去，照在水上，水是深蓝的，看不见底。岛上的孩子是在这样的水里泡大的，我一到洞口就脱了外衣，顺着树根爬下去，在石沿上一蹬，跳了进去。水凉得人一激灵。我浮上来，抹掉脸上的水，喊她下来。霍奇特尔站在上头的石沿上，一动不动，脸白得像修院的墙。“你下来啊。”“我看着就行。”“水里比上头凉快。”她的手攥着裙边，攥出了褶子。憋了好半天，她才说：“我怕深水。从小就怕。”说完又飞快地补一句，“墨西哥城的湖是浅的，站在里头水才到腰，谁用得着会游。”洞壁把“浅的”两个字撞了回来，听着比她本人有底气。我游到石沿底下，冲她伸出手。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "merida_city"
cast = ["xochitl"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

