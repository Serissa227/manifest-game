# B1：1554 年秋，礼拜天的市场。西班牙少年扯破她的袖子；在他们眼里，她跟我没有分别。
[[tracks.chapters]]
key = "b1"
title = "被撕破的袖子"
text = "礼拜天的市场人挤人，我在盐摊前头讲价，听见那边有人起哄。三四个西班牙少年围成一圈，圈当中是霍奇特尔，怀里抱着刚买的一捆棉线。领头的那个扯着她的袖子往外拽：“印第安丫头，跳个舞看看。”她一下子炸了，棉线一扔：“我爹是跟着蒙特霍大人打进尤卡坦的！”少年们笑得更响。袖子“刺啦”一声，从肩头撕开一大块，她母亲绣的那圈花边耷拉下来。有一个冲我这边努努嘴：“喏，那边还有一个。”平日在修院前院，霍奇特尔最爱说“乡下的玛雅人”怎样怎样，说她家跟我们不一样。可在这几个人眼里，她跟我没有分别。她也听见了那句话。她攥着撕破的袖子站在那里，脸上的神气一下子全没了，像一只当街被人拔了毛的鸟。"
