# S：1556 年 12 月，修院墙外的木棉树下。规矩一天比一天紧；她“现在还走不了”；放在我手心的蜂鸟羽毛。
[[tracks.chapters]]
key = "s"
title = "两条路"
text = "进了十二月，修院的规矩一天比一天紧。新来的监理立了好些条：女孩子散了课就得回家，不许在前院逗留；礼拜天望弥撒要点名，缺一回就跪在廊下念一晚上经。学校一散，我就要回科苏梅尔了。霍奇特尔约我在修院墙外那棵木棉树下见面，来了却不说话，蹲在地上拿树枝划土。过了好一阵，她才说她想去墨西哥城，进羽毛画坊学艺——她表姐安娜在那里开着一间。“可现在还走不了。”我问为什么，她把树枝一扔，没答。然后她从怀里摸出一根蜂鸟羽毛，放在我手心，捏着我的手腕，让我对着太阳转：绿，紫，火一样的红。“你回科苏梅尔，”她说，“就带着海的颜色回来给我看。我倒要看看，你们那片海，能变出几种颜色。”"
