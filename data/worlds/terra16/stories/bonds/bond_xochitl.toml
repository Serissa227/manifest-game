# 霍奇特尔：大十倍（bond_xochitl / reunion_xochitl）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用轨道与章节 key、地点与年份。
# 标签：GL（羁绊线，可恋爱；霍奇特尔是纯 GL，只对女孩子心动）。适用主角：伊希·妮克特（ix_nikte）。
# 人物：霍奇特尔 xochitl（1540-09-07，女，romance.with = f）——梅里达圣克里斯托瓦尔区一户墨西加辅兵人家的女儿，母家世代做羽毛活，生在行军路上；
#       伊希·妮克特 ix_nikte（1540-03-21，女，主角，“我”；学校名册上叫“玛丽亚”）。生年相差不到六个月。
#       学院期 1554—1556：两人 13—16 岁。A1（1556-01..05）伊希 3 月满 16、霍奇特尔 15，心动选项只写握手、把脚伸进水里；
#       A2（1556-06..11）霍奇特尔 9 月满 16；S（1556-12）两人都是 16，心动选项只到握手与 crush，告白只是“成年再见时当面说一句那瓦特话”。
#       重逢 1563：两人 22—23 岁，双方成年，恋人落点合法。
# 两个“外人”的处境不写成相同：伊希是被征服的玛雅人；霍奇特尔的父辈是随蒙特霍打进尤卡坦的墨西加辅兵，她看不起“乡下的玛雅人”，
#       可在西班牙少年眼里两人都是“印第安丫头”（B1）。
# 依据：
#   史实——梅里达的方济各会修院与学校；城西的圣克里斯托瓦尔区住着随征服者来的墨西加辅兵；墨西加的羽毛活（蜂鸟羽毛换个角度就变色）；
#         1555 年莫利纳修士的《卡斯蒂利亚语—墨西加语词汇》在墨西哥城印出；兰达 1556 年前后任尤卡坦方济各会的监理，修院规矩收紧；
#         塞诺特（石灰岩溶洞里的深水井）；科巴脂香；那瓦特语 nocniuh（我的朋友）、敬称 nocniuhtzin；墨西哥城的堤道、运河与浅湖；
#         科苏梅尔独木舟商人沿海岸往来希卡兰戈与洪都拉斯湾。
#   原创——霍奇特尔其人与她的绿羽毛、她母亲的那篮蜂鸟羽毛、市场上被扯破的惠皮尔袖子、廊下偷看的词典、城外那口塞诺特、
#         抽绳换了两回的香袋（赠礼 embroidered_pouch）、木棉树下的蜂鸟羽毛、画坊里她贴的第一幅画与扉页上的落款。
#   待核——加斯帕尔·安东尼奥·奇把词典从墨西哥城带到梅里达（简报所定，只作一笔带过）；兰达任监理的确切月份（正文只写“新来的监理”）。
