# C1：1554 年初，修院学校前院的石阶。她指着广场吹墨西哥城；那根“捡来的”绿羽毛。
[[tracks.chapters]]
key = "c1"
title = "大十倍"
text = "教理课一散，女孩子们挤在修院前院的石阶上等家里来接。一个梳着那瓦特式辫子的女孩站在最高那一级，指着门外的大广场，对围着她的几个人说：“这算什么？墨西哥城的比这大十倍。”她另一只手里攥着一根绿羽毛，羽杆都捏弯了。有人问羽毛是哪儿来的，她说是从鸟市上一个卖鹦鹉的手里抢的，顿了一下，又改口：“好吧，捡的。”我那时刚从科苏梅尔来，名册上那个“玛丽亚”我自己还叫不顺。我说，科苏梅尔岛上的神庙，比梅里达所有的教堂加起来都老。石阶上一下子静了。她从最高那一级低头看我，眼睛眯起来：“乡下来的？”“岛上来的。”她瞪着我，我也瞪着她。嬷嬷在门口摇了两遍铃。她没动，我也没动。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "merida_city"
cast = ["xochitl"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_merida_franciscan" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

