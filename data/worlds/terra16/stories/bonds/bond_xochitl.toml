key = "friend"
text = "在她的落款旁边，写下我的玛雅名字。"
reply = "她把笔递给我，墨已经蘸好了。我在那块空着的地方写下 Ix Nikte'，末尾那一撇写得有点抖。她凑过来看了很久，看我的名字和她的名字并排落在一页纸上，一个是她外婆那边的字，一个是我岛上的。“这一幅，”她说，“不卖。”安娜在外间喊她，她应了一声，没动。那天傍晚她关了画坊的门，领我出城，沿着堤道走到湖边。湖是浅的，夕阳照在上面，一片金红。她脱了鞋，提着裙子，一步一步走进去，水没到小腿，没到膝盖。她站在水里回头看我：“我现在敢下水了。浅的也算。”我也脱了鞋走进去，站到她旁边，从怀里摸出一片科苏梅尔的海螺壳，薄得透光，放在她手心里。她对着夕阳转来转去：“这就是海的颜色？”“一种。”“那剩下的，”她把螺壳攥紧，“你下回一样一样带来。”"
next = "done"
effects = [{ kind = "affinity", person = "xochitl", value = 5 }, { kind = "relation", person = "xochitl", relation = "friends" }, { kind = "flag", flag = "c7_bond_xochitl_landing_friend" }, { kind = "memory", memory = "mem-reunion_xochitl", title = "画坊的门" }]

