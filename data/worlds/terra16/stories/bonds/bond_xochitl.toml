key = "love"
text = "把那句留了七年的那瓦特话，当面说给她听。"
requires = [{ kind = "flag", flag = "c7_bond_xochitl_romance" }, { kind = "heart", person = "xochitl", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "xochitl", ge = 18 }, { kind = "romance_open", romance_open = "xochitl" }]
hint = "落款旁边空着一块。当年木棉树下，那句那瓦特话你没约下；七年过去，它还是卡在舌头底下。"
reply = "她把笔递过来，我没有接。我看着她，说了那句话：“诺克纽钦。”这七年我在船上念它，对着海念，对着帆念，船上的人都以为我在祷告。霍奇特尔举着笔的手停在半空。然后她的眼泪掉下来，一颗一颗砸在围裙上。“发音还是不对。”她说，嗓子全变了。“那你再教我。”“不教了。”她说，“我学的那句玛雅话，你先听着。”她说了。她念得很慢，喉咙里停住的那一下气，停得不太准。我笑了，她也笑了，一边笑一边哭。然后她走过来，捧住我的脸，吻了我。外间安娜在跟买画的人讲价，窗外运河上有人喊船，满墙的羽毛在光里一片一片地变颜色。她松开我的时候，脸上还是湿的。她拿起笔，在扉页上那瓦特字的旁边写下我的名字，写得很慢，写完把笔塞进我手里：“你也写我的。用你们岛上的写法。”"
next = "done"
