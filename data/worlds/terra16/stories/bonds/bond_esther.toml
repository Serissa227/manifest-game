# C1：1554 年春，阿尔及尔来的兵向梅拉摊钱。物件：桌上四堆钱。
[[tracks.chapters]]
key = "c1"
title = "几种钱的歌"
text = "阿尔及尔来的兵进了非斯，向梅拉摊了一笔钱。埃丝特家账房门口摆着一张矮桌，桌上四堆钱：非斯的第纳尔、土耳其的银币、葡萄牙的十字币、西班牙的里亚尔。她一边数一边唱，一种钱换一种钱，一句押一句韵，手指比嗓子还快。我在门口听了两句就跟着哼，唱到十字币，舌头打了结，十字币换里亚尔还是里亚尔换十字币，我自己也唱不清了。她抬头瞥我一眼：“阿尔及尔口音。”“阿尔及尔人也会算账。”“那你想买什么？”“一只罗盘，西班牙人卖的。”“那你只学第纳尔换里亚尔。”她把两堆钱往我这边推了推，“别的先别唱，唱乱了，罗盘就贵了。”门外，收钱的兵在敲隔壁的门。"
window = [[1554, 1, 15], [1554, 4, 30]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "cheerful"
news = "阿尔及尔的兵进了非斯，向梅拉摊钱。梅拉有户商人家的姑娘数钱时把四种钱的换算唱成了歌，一个阿尔及尔口音的学生跟着唱，唱到第三种就乱了。"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin" }, { kind = "date", from = [1554, 1, 15], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "learn_song"
text = "跟着她，把四种钱的歌一句一句唱完。"
reply = "唱到第四遍，我一个结也没打。埃丝特停了手，上下打量我：“这脑子拿去劫船，可惜了。”“我们家的船，只劫货，不劫人。”“货也是钱。”她把一枚十字币弹到我面前，“你连钱都算不清，劫了货也是赔本。”"
next = "c2"
effects = [
  { kind = "affinity", person = "esther", value = 3 },
  { kind = "skill", skill = "negotiation", value = 6 },
]

[[tracks.chapters.choices]]
key = "distract_soldiers"
text = "用阿尔及尔口音跟收钱的兵套近乎，替她拖一拖。"
reply = "我拿阿尔及尔码头上的腔调跟领头的兵聊他老家哪条街、哪家烤沙丁鱼最好，聊得他直拍我肩膀，临走少收了一成。兵一走，埃丝特没说谢：“别拿我们家的门开玩笑。下回他们认得你，就多收两成。”可她在账上那一成旁边，写了我的名字。"
next = "c2"
effects = [{ kind = "affinity", person = "esther", value = 3 }]

# C2：1554 年夏，账本页边的笨问题。物件：账本的页边。
[[tracks.chapters]]
key = "c2"
title = "页边的笨问题"
text = "入夏以后，我常坐在埃丝特家账房的门槛里头问她笨问题：“同一枚第纳尔，在染坊街换四十个银币，到了铜匠街怎么就只换三十八？”她没笑，蘸了墨，把我的问题一字不差写在账本的页边，后面添上我的名字。“写它干什么？”“留给下一个新来的。”我伸手要去划，她按住我的手：“不知道就是不知道。划掉了，下一个人还得从头不知道。”过了几天，账房来了个新学徒，是从得土安投奔亲戚的女孩，钱袋还系不利索。她翻账本翻到那一页，盯着页边看了半天，小声问：“那在梅拉里头换，又是多少？”埃丝特朝我一扬下巴：“问得好。他当时就没想到问这个。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "cheerful"
news = "非斯梅拉区一家账房的账本页边写满了问题，说是留给新学徒的，打头那一行是个阿尔及尔来的学生问的。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "ask_three_more"
text = "趁新来的女孩也在，再问埃丝特三个更笨的问题。"
requires = [{ kind = "affinity", person = "esther", ge = 20 }]
hint = "埃丝特把账本往怀里一收——你们还没熟到那个份上，她的账本不给外人翻。"
reply = "她笑得趴在账本上，笑完一个一个认真答，答一个写一个。第三个是：“同一枚第纳尔，梅拉里头的人拿出去换，为什么总比外头少两个银币？”她写完，在旁边画了个圈：“这个，我父亲也答不上来。”新来的女孩伸长脖子，把那个圈看了很久。"
next = "b1"
effects = [
  { kind = "affinity", person = "esther", value = 4 },
  { kind = "skill", skill = "negotiation", value = 4 },
  { kind = "bond", person = "esther", level = "C" },
]

[[tracks.chapters.choices]]
key = "beg_erase"
