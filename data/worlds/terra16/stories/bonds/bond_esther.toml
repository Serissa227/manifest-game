# A1：1556 年春，吵了一晚上海上的规矩；账本最后一页的旧地名。只写朋友。物件：最后一页的旧地名。
[[tracks.chapters]]
key = "a1"
title = "不必同意的朋友"
text = "那天晚上，我们在账房里吵到油灯添了两回油。“船上的规矩是货归船，人放走。”我说，“我父亲的船一向这样。”“货主也是人。”埃丝特把笔往桌上一拍，“丢了一船货的人家，一样揭不开锅。你们放走的人，回头还得拿钱来赎他的船。赎金也是生意。”“那你们家不也经手赎金？”她一下没了声。她父亲每年替阿尔及尔的俘虏过手好几笔赎金，这我知道，她也知道我知道。她没收回借我的那本旧账本，只在它的另一页写下几行她担心的事，推还给我。然后她翻开自己的账本，翻到最后一页，用手掌挡着，只露出一行：希伯来字母拼的西班牙话。她压低声音念给我听——格拉纳达，雷亚莱霍，达罗河上的桥。“我母亲老家。”她说，“她从来不提。家里有一张那边的旧欠据，我想弄清它的来处。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "tense"
news = "非斯梅拉区那家账房的姑娘跟阿尔及尔来的同学为海上的规矩吵了一整夜，隔壁说，吵到最后谁的嗓门都没小。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

