# C7 羁绊线：埃丝特——几种钱的歌 / 账外的座位（故事 2.0，A5 / E37 契约）
# 标签：友情线（friendship）。埃丝特是纯 GL（romance.with = f），对男主角塔里克全线只写友情：没有心动选项，也没有朦胧的段落。
# 人物：埃丝特（esther，1539-06-11）：非斯梅拉区塞法迪商人家的女儿，学院同学；1557—59 随叔父在阿尔及尔学生意，1560—68 回非斯开账房。
#       塔里克·加尔纳蒂（tariq，1540-01-02）：主角“我”，阿尔及尔人，父亲有船，祖母是格拉纳达出来的人；他的口头禅原句只在 C1 的 learn_song 回复里用一次。
#       宰娜卜（zaynab，1537-05-06）：撒哈拉盐队的女首领，只在重逢的 variant 里作“她身边的人”出现一句。
# 年龄：学院章 1554-01—1556-12，塔里克 14—16 岁、埃丝特 14—17 岁；重逢 1562 年，两人 22、23 岁。全线不写任何恋爱效果。
# 依据：史实——1554 年 1 月阿布·哈松借阿尔及尔的奥斯曼兵进非斯，向城里（连同梅拉）摊派钱；同年 9 月萨阿德王朝的穆罕默德·谢赫打回非斯，
#       阿尔及尔的兵撤走；葡萄牙宗教裁判所（1536 起）治下的新基督徒经摩洛哥港口出逃，不少人去萨洛尼卡；非斯的塞法迪商人替流亡者筹路费、
#       代收家信、经手阿尔及尔的赎金；1492 年 1 月格拉纳达易主、3 月颁布驱逐令；纽伦堡的铜算筹经安特卫普流通到地中海。
#       原创——四种钱的换算歌、页边的问题、新钱小考、去萨洛尼卡的那一家、账本最后一页的旧地名与 1491 年的欠据、账外的座位。
#       待核：1554 年非斯各种钱的实际比价（正文只写“差两个银币”一类的相对说法）；萨阿德王朝打回非斯后头一批新钱面市的确切月份（正文写“没过几天”）；
#       格拉纳达雷亚莱霍区与阿尔拜辛区的街巷细节（正文只写区名、达罗河与桥、井和下坡的巷子）。
# 缺省走向：玩家不回应时，C1—A2 各章没有收获、故事照走；S 缺省设 c7_bond_esther_parted 并开启重逢（埃丝特照常去阿尔及尔）；
#       重逢缺省是埃丝特的一封来信，设 c7_bond_esther_missed。
# 旗标：设 c7_bond_esther_promise / _own / _parted / _landing_friend / _missed；不读其他文件的旗标。
#       重逢的 variant with_zaynab 读的是关系 esther × zaynab = lovers（tie_esther_zaynab 的靠近章 1560 秋写下；
#       简报原定的 c7_tie_esther_zaynab_together 由该线 1579 年的落点章设置，1562 年永远读不到，所以改读关系）。
# 秘密：埃丝特抄在账本最后一页的旧地名与欠据——A1 只给塔里克看一行，重逢才讲出来历；不进任何见闻。
# 去重：掺假的萨阿德银币归 bond_yaqub，本线 B1 只写剪边的钱；B2 只写给流亡者筹路费、找不劫人的船，不写被劫水手的家（那归 bond_aisha）；
#       埃丝特的口头禅原句只在 B2 正文出现一次，S 的回复与来信只作改了字句的呼应。
# 日程：不改。

