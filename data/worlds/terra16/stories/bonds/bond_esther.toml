# 重逢：1562 年，非斯梅拉第三条巷，埃丝特自己的账房。只有友情落点；两个选项做的事不同。
[[tracks.chapters]]
key = "reunion"
title = "账外的座位"
text = "梅拉第三条巷多了一间账房。埃丝特坐在账桌后头，桌角压着一副算筹，就是当年那副纽伦堡的新货，如今也推旧了；桌上摊着一叠名单、一捆家信，都是从葡萄牙、从塞维利亚过来的人，要往萨洛尼卡、往伊斯坦布尔去。她一边核一边念，几种钱在她嘴里换来换去，还是当年那个调子，快了一倍。“坐。”她头也不抬，笔杆一指，“别坐那把，那把是谈生意的。”靠墙另有一张矮凳，凳面磨得发亮，旁边一只水罐。“这把在账外头。坐这儿的人，我不收他的钱，也不跟他讲价。”她核完一家，从算筹底下抽出一张旧纸，翻过来推给我。还是那一行希伯来字母拼的西班牙话，底下又添了好几行新的。“欠据的来处，查到了。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "tender"
news = "非斯梅拉第三条巷新开了一间账房，女掌柜替往东去的流亡者核路费、代收家信，账桌外头总摆着一张矮凳。"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [
  { kind = "letter", person = "esther", text = "塔里克：我回非斯了。账房开在梅拉第三条巷，桌角压纸的是那副纽伦堡算筹，铜上的花纹早磨平了，你一进门就认得。账桌外头有张矮凳，是给你留的，谈生意的人不让坐。今年过手的人多，从葡萄牙来的、从塞维利亚来的，都要往东走，名单比账本还厚，我一个人核到半夜。你哪天路过，水罐在凳子旁边，自己倒。还有一件：你的路费，我也替你留了一份，夹在账本最后一页，这一份不记在哪一栏里——等你坐到那张凳子上，再算。埃丝特" },
  { kind = "flag", flag = "c7_bond_esther_missed" },
]

[[tracks.chapters.choices]]
key = "settle_fares"
text = "坐到账外的矮凳上，帮她把这一批人的路费核完。"
reply = "我们一直核到天擦黑。最后一家是从塞维利亚出来的染匠，一家六口，算来算去差三个第纳尔。我从腰里摸出三枚，排在桌上。埃丝特照例抽出一张纸写字据：哪天、谁给的、算赠与。写到我的名字，她停了笔：“你这几年，少劫了好几条船。”“你怎么知道？”“我在阿尔及尔替叔父管了三年账，你们家卸下来的货，有一半是拿到他柜上兑的钱。”她把字据推过来让我签，“我回了非斯，他的信还是月月来。加尔纳蒂家拿来兑的货，一年比一年少。账上看得出来。”我签了名。她把字据夹进账本，起身给矮凳旁的水罐添满了水。"
next = "done"
effects = [
  { kind = "affinity", person = "esther", value = 5 },
  { kind = "relation", person = "esther", relation = "friends" },
  { kind = "flag", flag = "c7_bond_esther_landing_friend" },
  { kind = "memory", memory = "mem-bond_esther-reunion", title = "账外的座位" },
]

[[tracks.chapters.choices]]
key = "her_old_names"
text = "请她讲讲，那张欠据查到了哪里。"
reply = "她讲了一下午。欠据是一四九一年秋天写的：阿尔拜辛的一个织匠向她外祖父借了一笔钱，一年为期。期限没到，格拉纳达换了国王；没等到夏天，她外祖父就被赶出了西班牙。她托塞维利亚过来的人去打听，雷亚莱霍那条巷子还在，桥也还在，外祖父的房子住着别人；那织匠一家早改了教，后来搬去了哪里，没人说得上来。“欠据我不要了。”她把那张纸折好，“地名留着。”我拿过她的笔，在另一张纸上写我祖母念了一辈子的地名：阿尔拜辛的一口井，一条往下走的窄巷。写完，两张纸并排压在那副算筹底下。"
next = "done"
effects = [
