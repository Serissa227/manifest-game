[[tracks.chapters.choices]]
key = "own"
text = "各走各的：到了阿尔及尔，她做她的生意，我上我的船。"
reply = "“这样最好。”她一点也没犹豫，“你父亲的船，我可不想跟它打交道。哪天在码头上碰见，你装不认得我，我也装不认得你，账上干净。”她系好驮袋，从钱袋里摸出一枚算筹塞回我手里，把我的手指一根一根按拢：“路上的钱，先别花光。”她当着我的面在账本上记了一笔：交塔里克算筹一枚，赠与。底下又添一行小字：阿尔及尔碰见，不打招呼。骡队动了。走出去十来步，她又回头喊：“到了那边要是让人欺负，报我叔父的名字——就这一回，不记账。”"
next = "done"
effects = [
