# S：1556 年 12 月，埃丝特随叔父去阿尔及尔。只写友情：promise 带 bond S，own 永远可选。
[[tracks.chapters]]
key = "s"
title = "商路与友情"
text = "十二月，埃丝特家的骡子在梅拉门口装驮子。学堂一散，她就要跟叔父去阿尔及尔，学那边的生意：赎俘、兑钱、跟船商打交道。“你老家。”她把一本新账本塞进驮袋，“我连那边的面包怎么买都不知道。”“面包按个卖，鱼按筐卖，人按——”“别说完。”开春我也要回阿尔及尔，上我父亲的船。两个人往同一座城去，她跟着骡队走陆路，我等海上的风。她又把新账本从驮袋里抽出来，在头一页的页边写下一行：阿尔及尔的面包怎么买。写完抬头看我：“到了那边，咱们怎么算？”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "tender"
news = "入了冬，非斯梅拉区那个会唱账的姑娘跟着叔父的骡队往阿尔及尔去了，说是去学赎俘和兑钱的生意。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [
  { kind = "start_track", track = "reunion_esther" },
  { kind = "flag", flag = "c7_bond_esther_parted" },
]

[[tracks.chapters.choices]]
key = "promise"
text = "约好在阿尔及尔替她找一处不被人刁难的住处。"
requires = [{ kind = "bond", person = "esther", level = "A" }]
hint = "能许这种约的交情，你们还差一步——或者，这一生一次的约，你已经许给了别人。这回只能替她给房东写一封介绍信。"
reply = "“住处要离码头远一点，”她掰着手指，“离犹太人的街近一点，房东不能是放债的，窗子要朝院里开。”“我认得一个老寡妇，住在卡斯巴底下，房子漏雨，人好。”“漏雨的我自己修。”她把老寡妇的名字和那条巷子记在账本最后一页，就在旧地名下面一行，“人好的难找。”写完，她在那一行头上点了个墨点，跟当年记那条威尼斯船时一样：“这一行是约，不算赠与，也不算借。到了那边你要是找不着，我就记你欠我一处房子。”骡子打了个响鼻。她拍拍驮袋，翻身上去，又回头：“开春你的船进港，我去码头看你卸货——只看货。”"
next = "done"
effects = [
