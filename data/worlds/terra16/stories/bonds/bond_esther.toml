# B1：1554 年秋，萨阿德王朝打回非斯，换了新钱。物件：那枚新钱。
[[tracks.chapters]]
key = "b1"
title = "萨阿德的新钱"
text = "九月里，萨阿德家的人打回了非斯，阿尔及尔的兵连夜出了城。没过几天，市面上冒出一种新钱，银子白得发亮，边上的字没人认得全。埃丝特在账房里办了个小考：桌上一排钱，新的旧的、整的剪过的混在一起，谁认对得多谁赢。我认出了里亚尔的缺边、十字币的轻重，最后栽在一枚萨阿德的新银币上——我说它是假的。“真的。”她翻过来给我看，“今早才从造币坊出来。你输了。”“昨天还没有这种钱！”“市面上可不管你昨天见没见过。”她在账上写下我的名字，后面记了个“输”字，墨还没干，又抬起头：“给你三天。三天后再考一回。这回照记，下回的路不关。”那枚新钱就搁在我手边，亮得扎眼。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "fez"
cast = ["esther"]
speaker = "captain"
mood = "tense"
news = "萨阿德的人回了非斯，市面上换了新钱。梅拉有个姑娘拿新钱考同学，一个阿尔及尔来的学生当场把真钱认成了假的。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "retry"
text = "照她给的三天，把新钱认熟了再考。"
reply = "三天里我在兑换摊前头蹲了两个早上，看老兑换商怎么掂、怎么弹、怎么听声。再考那天，那枚新钱我一眼就认出来，顺手还挑出另一枚新钱——边上被人剪掉了细细一圈。埃丝特拿到窗下看了半天：“这枚我摆的时候都没看出来。”她把两枚都记下：“上回你输的照算。这一回，算你的。”"
