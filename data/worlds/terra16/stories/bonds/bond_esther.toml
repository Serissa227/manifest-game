next = "a2"
effects = [{ kind = "affinity", person = "esther", value = 3 }]

# A2：1556 年秋，一袋用了多年的算筹。赠礼 counting_tokens 与回忆在 take_tokens。物件：一袋算筹。
[[tracks.chapters]]
key = "a2"
title = "算筹"
text = "秋天，埃丝特的父亲给她换了一副新算筹，从安特卫普转来的纽伦堡货，铜上的花纹还扎手。旧的那袋，她倒在桌上一枚一枚数给我看：都磨得发亮，有几枚边上的字已经看不清了。“四十枚。”她把最旧的那一枚挑出来，搁进自己的钱袋，“这枚我留着，我刚学算账就是推它。”她又翻开账本记了一行：某月某日，埃丝特交塔里克·加尔纳蒂，算筹三十九枚。写完在后头补了两个字：赠与。“不算借？”“借要还，送的不用。我们俩之间，不记债。”她把账本转过来让我看清那一行，又把袋子推到我面前，等我开口。"
window = [[1556, 6, 1], [1556, 11, 30]]
