# B2：1555 年，一家新基督徒要去萨洛尼卡。口头禅原句在本章正文用一次。物件：一包家信。
[[tracks.chapters]]
key = "b2"
title = "去萨洛尼卡的路费"
text = "开春，一家人从拉腊什上了岸，走了十来天到非斯：一对夫妻、一个老母亲、两个孩子。他们在葡萄牙受过洗，夜里却偷偷点安息日的灯，裁判所的人上门以前跑了出来，要去萨洛尼卡投奔亲戚。埃丝特的父亲在灯下算了三遍，还差一截。老母亲怀里抱着一包家信，蜡封了好几层，谁伸手她都往后缩。“路费先留出来，人才走得成。”埃丝特在旁边说。她父亲点点头，把自家今年的一笔开销划了出去。可钱只是一半。往东去的船我心里有数：哪几条正经运货，哪几条在海上碰见落单的人就绑去卖。埃丝特转过身，声音压得很低：“你是阿尔及尔人。有没有一条不劫人的船？”"
