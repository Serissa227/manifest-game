at = "sakai"
cast = ["takamaru"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1576, 8, 20], to = [1576, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "takamaru", text = "澪：听说你今年没到堺。船队回能岛以前，我托一条顺路去土佐的船捎这封信，还有一块板。板是从我那条小早上拆下来的。木津川口那一仗，船舷挨了一下，烧黑了三块，换下来的就是这一块。上头的刻痕，最末一道是七月十三那天夜里刻的，刻的是我们烧了织田家的船。这一场不算我跟你的，可我想让你看看。旁边那一行字也是我写的：欠的那场，还欠着。十一个人出去，回来九个。一个会唱渔歌，一个欠我三十文。会唱渔歌的那个，前年还在下田的竞渡里替我打过鼓。三十文我不要了。那张潮时表我还带着，木津川口那一段添了三条新水道，等你来了画给你看。来岛那一段你当年抄过，大概早忘了，忘了也不要紧，我再画。你在海上，信不好送，这一封不知道几时才到你手里。下回我让你。鹰丸" }, { kind = "flag", flag = "c7_bond_takamaru_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "在他的船头坐下，听他把这一仗讲完，约好以后在海上互相照应。"
requires = [{ kind = "flag", flag = "c7_bond_takamaru_itsukushima", value = false }]
hint = "那年在岬角上，我说过能岛站错了边。"
reply = "我在船头坐下。他把木片搁在膝盖上，从头讲：他们怎么趁着夜潮贴近织田家的大船，船头的人点着焙烙，扬手扔出去，陶壳在甲板上摔碎，火一下就起来了。讲到扔出去的那一刻，他的手在膝盖上抖，炭灰往下掉，他拿另一只手把它压住。“活着回来的，比我想的多。”我叫人从岸上搬来一坛酒，没有杯子，就着坛口轮流喝。他说起那两个没回来的，一个会唱渔歌，一个欠他三十文。我说三十文我替那人还，他骂我公家人不懂规矩，哪有替死人还钱的。天快亮的时候我们说定：往后我的船过濑户内海，在能岛的水道口挂一块白布，他看见了就出来领路；他的船在堺、在土佐短了粮，报我的名字赊。他把这一条也写在木片上，写在那九个名字底下。"
next = "done"
effects = [{ kind = "affinity", person = "takamaru", value = 5 }, { kind = "relation", person = "takamaru", relation = "friends" }, { kind = "flag", flag = "c7_bond_takamaru_landing_friend" }, { kind = "memory", memory = "mem-reunion_takamaru", title = "木津川口之后" }]

[[tracks.chapters.choices]]
key = "rival"
text = "把欠着的那一场翻出来：明天一早，在堺的港外比一场。"
requires = []
reply = "第二天天刚亮，我们各带四个桨手，在堺的港外排开。能岛的船上来了好些人看热闹，有人押他，有人押我。我那条是从商船上借来的小艇，桨手是码头上现雇的，一起头就慢了半拍。我照老办法先看水。大阪湾的潮跟四万十川口不一样，我找了好一阵才找到那条线，追到最后，还差他半个船身。他靠了岸，蹲在船板前，在那一排刻痕的最末刻下新的一道，拿拇指抹了抹：“第五十四场。这一场，我等了二十年。”“下一场呢？”“下一场，等你雇的人学会划桨再说。”看热闹的能岛水夫笑成一片。押我的那几个垂头丧气，我解下钱袋，替他们把输的钱结了，一共四百二十文，我一口报出数，他们的管账还在掰指头。鹰丸在旁边看着，说公家的姬君输了钱倒挺大方。"
next = "done"
effects = [{ kind = "affinity", person = "takamaru", value = 3 }, { kind = "relation", person = "takamaru", relation = "rivals" }, { kind = "flag", flag = "c7_bond_takamaru_landing_rival" }, { kind = "memory", memory = "mem-reunion_takamaru", title = "木津川口之后" }]

# love（C21b 改）：“到门口没进去”（手册 4.2 第 6 条；研究 B-14 的示范）。他答了刮掉的那一句，事情不变，第二天各走各的船。不是坏结局。
[[tracks.chapters.choices]]
key = "love"
text = "问他：那些年信里最后一行，刮掉的是什么。"
requires = [{ kind = "flag", flag = "c7_bond_takamaru_romance" }, { kind = "heart", person = "takamaru", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "takamaru", ge = 18 }, { kind = "romance_open", romance_open = "takamaru" }]
hint = "要当年在他桅上系过手巾、心动 24。"
reply = "他先说起下田河口那一场，我赢了半个船身，他记的是半个，不是一个。说完了，我问他，那些年信里最后一行，刮掉的是什么。他拿炭笔在木片上画了一道，又画一道。“就是‘下回我让你’。底下原来写的什么，我自己也忘了。”又说：“没让成。”夜里他送我回码头边的宿屋，走到门口，他站住了，我也站住了。门里点着灯，宿屋的老板娘探出头来看了一眼，又缩回去。他把那方素麻手巾从怀里掏出来，边上烧焦了一角，是木津川口那一夜燎的。“桅上那块，我收下来了。”他把手巾放到我手里，“你那条船的桅高，系那儿。”他没进门。第二天一早，他的船回能岛，我的船往西走，出港的时候两条船挨得很近，我看见他船板上那一排刻痕，最末一道旁边多刻了半道。"
next = "done"
effects = [{ kind = "affinity", person = "takamaru", value = 5 }, { kind = "relation", person = "takamaru", relation = "crush" }, { kind = "flag", flag = "c7_bond_takamaru_landing_love" }, { kind = "memory", memory = "mem-reunion_takamaru", title = "木津川口之后" }]

[[tracks.chapters.variants]]
key = "v0_itsukushima"
when = [{ kind = "flag", flag = "c7_bond_takamaru_itsukushima" }]
text = "天正四年夏天，木津川口打了一仗，村上家的小早烧了织田家的船队，粮船进了石山本愿寺。仗打完半个月，我在堺最靠里的栈桥边找到了那条小早，船舷换了好几块新木。鹰丸坐在船头画木片，看见我，先说：“毛利家的船。我们这回站对了边，你算过没有？”他说帆别钱一成都没少收。我问他船上出去几个人。十一个，回来九个。他报名字，报得很快，报完把木片翻过去：“岸上的，你来堺做生意，别在这条栈桥上找人。”"

# 变体：S 选了 own（刻过“未比”）时，他先拿脚尖点那两个字；许过两份以上心意时，他这些年的信里只剩潮和船；_romance 时，桅上还系着那方手巾。只改正文。
[[tracks.chapters.variants]]
key = "v1_still_unraced"
when = [{ kind = "flag", flag = "c7_bond_takamaru_own" }]
text = "天正四年夏天，木津川口打了一仗。消息比船先到堺：村上家的小早把焙烙火矢一个接一个扔上织田家的大船，火从河口烧到半夜，粮船趁着火光进了石山本愿寺。仗打完半个月，堺的码头上挤满了能岛的船。我一条一条找过去，在最靠里的栈桥边找到了那条小早。船舷上换了好几块新木，白生生地夹在旧板中间，旧板上还有烧黑的印子。鹰丸坐在船头，拿炭笔在一块木片上画道道，看见我，先讲那一仗：哪一夜潮转，七十二只焙烙，他那条扔了九只。我问他船上出去几个人。他说十一个，回来九个。我一个一个问名字，对着他手里的木片点过去。点完了，他起身走到船尾，拿脚尖点了点一块旧板。那两个字还在：未比。二十年摸来摸去，字口都磨亮了。“十年说成了二十年。账还没清。”他把脚收回去，又在那两个字上踩了踩。"

[[tracks.chapters.variants]]
key = "v3_only_tides"
when = [{ kind = "flag", flag = "c7_bond_takamaru_romance" }, { kind = "flag", flag = "c7_mio_heart_2" }]
text = "天正四年夏天，木津川口打了一仗，村上家的小早烧了织田家的船队。仗打完半个月，我在堺最靠里的栈桥边找到了那条小早，船舷换了好几块新木。这些年鹰丸的信没断过，一年两封，写潮，写船，写哪条水道换了礁石的名字，最后一行那句“下回我让你”，从永禄头几年起就不写了，信纸的末尾干干净净，也没有刮过的痕迹。他坐在船头画木片，看见我，站起来，问我的船吃水几尺、走的哪条水道、在兵库停没停。我问他船上出去几个人。十一个，回来九个。我一个一个问名字，他一个一个报，报完了说：“你那条船的帆该换了，堺的帆布今年便宜。”他船上的旗，换成了毛利家给的那一面。"

[[tracks.chapters.variants]]
key = "v2_rope_in_the_fold"
when = [{ kind = "flag", flag = "c7_bond_takamaru_romance" }]
text = "天正四年夏天，木津川口打了一仗。消息比船先到堺：村上家的小早把焙烙火矢一个接一个扔上织田家的大船，火从河口烧到半夜，粮船趁着火光进了石山本愿寺。仗打完半个月，堺的码头上挤满了能岛的船。我一条一条找过去，在最靠里的栈桥边找到了那条小早。船舷上换了好几块新木，旧板上还有烧黑的印子。短桅上系着一块素麻，颜色发灰，一角烧焦了，结还是我当年打的那个船结。鹰丸坐在船头画木片，炭笔停住了。我爬上船，问他船上出去几个人。他说十一个，回来九个。我一个一个问名字，对着他手里的木片点过去。点完了，他从怀里掏出自己那份潮时表，指着木津川口那一段：“账还没清。”那截缆绳头从折缝里掉出来，他捡起来，塞回原处。"
