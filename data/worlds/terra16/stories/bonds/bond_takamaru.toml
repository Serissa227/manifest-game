# C2：1553 年秋，河滩上三个人修一条破小早。二十三根船钉，他扔掉两根。
[[tracks.chapters]]
key = "c2"
title = "破小早"
text = "汐拖着一个人来找我，说是她表兄，从能岛来，在下田的叔叔家过秋。我一看，就是竞渡那天刻船板的那个。他叫村上鹰丸。三个人围着河滩上一条快散架的小早，船底裂了一道缝，塞得进两根手指。鹰丸扔给我一只布袋：“你就递钉子，别的别碰。”袋里的船钉长短不一。我把它们倒在一块船板上，从短到长排成一行，一共二十三根，问他：“哪一根钉下去，会穿透船底？”他蹲下来挨根掂了，挑出最长的两根，扬手扔进了海里。“那你本来打算用哪根？”他不答，翻身钻到船底下，拿背撑住船板：“压住裂缝！我往上顶，你往下压，别松手。”汐在外头敲了敲船舷：“你那舵柄还是我十岁削的，你九岁，刀都拿反。修完这条，舵柄你自己削。”船底下的人闷声骂了一句能岛话。"
window = [[1553, 9, 1], [1553, 12, 31]]
at = "shimoda_tosa"
cast = ["takamaru"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1553, 9, 1], to = [1553, 12, 31] }, { kind = "age", le = 17 }]

