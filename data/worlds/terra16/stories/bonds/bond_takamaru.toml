# 重逢：1576 年第一次木津川口之战后的堺。船舷换了新板；十一个人出去，回来九个；他掏出自己那份潮时表。
# variants（取第一个对上的）：v1_still_unraced（own）→ v3_only_tides（许过两份以上心意，信里只剩潮和船）→ v2_rope_in_the_fold（_romance）。
[[tracks.chapters]]
key = "reunion"
title = "木津川口之后"
text = "天正四年夏天，木津川口打了一仗。消息比船先到堺：村上家的小早把焙烙火矢一个接一个扔上织田家的大船，火从河口烧到半夜，粮船趁着火光进了石山本愿寺。仗打完半个月，堺的码头上挤满了能岛的船。我一条一条找过去，在最靠里的栈桥边找到了那条小早。船舷上换了好几块新木，白生生地夹在旧板中间，旧板上还有烧黑的印子。鹰丸坐在船头，拿炭笔在一块木片上画道道。他抬头看见我，没站起来，先讲：哪一夜潮转、他们贴着哪条水道摸过去、九鬼家的船有几条、一共扔了多少只焙烙，七十二只，他那条扔了九只。我没先问他赢了多少，爬上船，问他船上出去几个人。他说十一个，回来九个。我一个一个问名字，对着他手里的木片点过去。点完了，他从怀里掏出自己那份潮时表，上面添了好些新画的水道，木津川口那一段画得最密。“账还没清。欠我那一场呢？”他问的时候，手指还按在木津川口上。"
