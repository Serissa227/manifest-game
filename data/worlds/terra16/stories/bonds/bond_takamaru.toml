# S：弘治二年腊月（1557-01），下田河口。他驾着当年修好的小早来接我。
[[tracks.chapters]]
key = "s"
title = "来接你的船"
text = "入冬，前关白房通公在京里过世。弟弟要回土佐，我跟着一起回来了，开春就要从下田出海。腊月的一个早上，阿濑进来说，河口停着一条船，船上的人不肯上岸，说是来接姬君的。我跑到岸边，是那条小早，那年秋天我们三个人修的那一条。船底补过的地方颜色发白，船板上的刻痕已经排到了船尾。鹰丸站在船头，穿着能岛船头的短褂，比夏天又黑了一层。“上来，带你去外海看看。开春你有了自己的船，总不能连外海的浪都没见过。来岛那段的浪是一丈二，外海的浪你没见过，见了腿软。”我没动，他也没动。憋了半天，他又开口：“做我的船——”说到一半自己先咬住了，“不，我做你的船。”说完他不看我，把缆绳从船头抛过来，绳头落在我脚边的石头上。"
window = [[1557, 1, 1], [1557, 1, 31]]
at = "shimoda_tosa"
cast = ["takamaru"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1557, 1, 1], to = [1557, 1, 31] }, { kind = "age", le = 17 }]

