# C1：1553 年夏，下田河口的竞渡。他赢了两个船身，在船板上刻下第十七场。
[[tracks.chapters]]
key = "c1"
title = "下田的潮"
text = "四万十川流到下田口，和涨上来的海潮顶在一起，竞渡的小船就在那片浑水里抢。我缠了乳母阿濑三天，她才把我塞进一条渔家的小船，再三叮嘱船主别让姬君掉下去。鼓一响我就拼命划，桨叶一半拍在水面上。前头有一条船不走正中，斜着贴向左岸一片发深的水，转眼就把所有人甩开。我追到最后，还差他两个船身。那人靠了岸，跳上船头，晒得黑红，一口白牙：“公家的姬君划不动桨。”岸上的渔夫都笑了。他从腰里抽出小刀，在自己船的船板上刻了一道。船板上已经排着一溜刻痕，长短不齐。“第十七场。你差两个船身，我记两个，不记一个半，你别跟我磨。”我把湿透的袖子拧干，水哗哗落在他脚边：“那一道，把我的名字也刻上。输给谁、差几个船身，都得写全，只记一半的账我不认。”岸上的渔夫笑得更响了。"
window = [[1553, 6, 1], [1553, 8, 31]]
at = "shimoda_tosa"
cast = ["takamaru"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1553, 6, 1], to = [1553, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "carve_my_name"
text = "逼他把我的名字刻在那一道旁边，一笔都不许少。"
requires = []
reply = "他嘟囔着“公家的字笔画真多”，到底还是刻了。“澪”字的三点水刻成了三个坑，右半边歪进了船板缝里。他把刀往腰里一插：“等你哪天赢了我，自己来刻。”“那你等着。”“等着就等着。到时候别哭。”阿濑在岸上喊我回去换衣服。我走出老远回头，看见他还蹲在船边，拿指头抠那个歪掉的字。"
next = "c2"
effects = [{ kind = "affinity", person = "takamaru", value = 15 }]

[[tracks.chapters.choices]]
key = "ask_shortcut"
text = "问他刚才贴着左岸走的那条路，是怎么看出来的。"
requires = []
reply = "他没想到输的人先问这个。他拉我蹲到岸边，指着河面上一条颜色发深的水线：“潮在那里转弯。河水往外推，海水往里顶，顶不过的地方水就软，船走那里省一半力。来岛水道口也有这么一道，比这个凶十倍，我爷爷那辈管它叫钱匣子，过路的船在那儿等潮，一等半天，我们就划过去收钱，一条船三百文。”我盯了半天，才看出那道线是在挪的。他站起来拍拍膝盖上的泥：“公家的姬君，眼睛倒不笨。”"
next = "c2"
