# B1：1554 年春，我要上京。他在退潮的沙滩上画濑户内海的潮时表，我拿贝壳压住画错的地方。
[[tracks.chapters]]
key = "b1"
title = "潮时表"
text = "开春我就要上京，进宫去学做女房。消息传到河口，第二天一早鹰丸就来了，手里攥着一根树枝。“京里的人坐船，命都交给船头。你得自己会看。”他蹲在退了潮的沙滩上，从左往右画濑户内海：哪个时辰涨，哪个时辰转，哪几处水道一转潮就把船往礁石上吸。来岛、能岛、因岛，一个岛一个小圈，水道画成弯线，画到能岛他多画了一圈，说那是番所。阿濑坐在岸边一条破船上缝我上京要穿的衣服，针走几下就抬头看我们一眼。我把来岛一处转潮的时辰说错了。他“啧”了一声，抬脚就要把那一整行抹平重画。我抢先拦住，跑去捡了一捧贝壳，把说错的地方一只一只压住：“留着。下回我就知道，船会在哪里搁浅。”他的脚停在半空。"
