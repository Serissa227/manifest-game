# A2：1556 年夏假，岬角看渔火。他要去能岛当船头，说起严岛那一仗；递来一方素麻手巾。
[[tracks.chapters]]
key = "a2"
title = "岬角的渔火"
text = "夏假我又回到土佐。鹰丸傍晚来找我，说带我去看样东西，一路把我领上岬角。天黑透了，海上一点一点亮起火来，先是一两盏，后来连成一片，是追鲣鱼的渔船点的松明。“开春回了能岛，我当小早的船头。”“恭喜。”“恭喜什么。”他踢了一块石头下去，好半天才听见水响，“去年严岛那一仗，能岛站在陶家那边，一条船也没出。陶家败了，我们一箭没放。站错了边，又没打，你说这算不算输？”我还没想好，他已经从怀里掏出一方叠得方方正正的素麻手巾，一角用白线缝着他名字的头一个字。“你以后出海，把它系在桅杆上，”他把手巾递到我面前，眼睛看着海，“我好认你的船。”海上的松明又亮了几盏。"
