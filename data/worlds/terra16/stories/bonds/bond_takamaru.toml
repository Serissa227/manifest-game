# 村上鹰丸：下田的潮（bond_takamaru）——羁绊线，标签 BG；学院期 C1—S（含家乡期）+ 成年重逢。
# 走向：一场输赢刻了二十年，账不清（有条件：她站在能岛这边；木津川口那处选择在主线 c01）。
# 人物：村上鹰丸（takamaru，1539-05-13 生，男，romance = f），能岛村上家的少年水夫，汐的表兄。
#       声音（照 docs/world/voices/japan.md 3.6）：讲村上家就长，讲自己就短；记场次、船身、人头；“算一半”只归他；
#       被夸了一句不回，转身去干活（不脸红）；叫澪“岸上的”“桨手”，信里写“澪：”。
#       口头禅“我记着账呢：你还欠我一场。”只在 a1 说一次，别处只换说法呼应（“账还没清”“欠的那场，还欠着”）。
#       主角：一条澪（mio，1540-06-21 生，女），土佐一条家的长女，1554 年起在京都做宫中女房的见习；话快、抢话，数钱飞快。
#       汐（ushio，1540-01-01 生）只在 c2 露面，说一句话，不进 cast。
# 年龄：c1（1553 夏）澪 12—13、鹰丸 14；a1（1555-08）澪 15、鹰丸 16；S（1557-01）澪 16、鹰丸 17——只到系手巾、牵手（crush）；
#       学院期以后到重逢以前不写任何恋爱互动。重逢 1576 年两人都已三十六七。
# 心意（C21b，数值见 docs/BALANCE.md）：心动来源 a1 keep_his_headband +6 → a2 tie_it_on_wrist（要求 ≥ 6）+6。
#       鹰丸在能岛，课后同行碰不到他，心动涨不过 12，所以他的第二、三档改用情谊：
#       heart（头一份：心动 ≥ 12，带 bond S）/ heart_second（已许一份：心动 ≥ 12、情谊 ≥ 90、意志 ≥ 5）/
#       heart_third（已许两份及以上：心动 ≥ 12、情谊 ≥ 96、意志 ≥ 7、手巾系过手腕 c7_bond_takamaru_wrist）。S 在 1557-01，五条里最晚，所以他最晚知道。
#       信物是那方素麻手巾（手册第六节）：S 里澪把它从手腕上解下来，系上他的桅；重逢时他答了刮掉的那一句，到门口没进去。
# 关系会退（C21b）：a2 about_itsukushima 改成澪说能岛站错了边，情谊 -10、手巾不给（这一章拿不到 A，S 的约与心意都锁上），不和解。
# 情谊尺度 D：鹰丸平时在能岛、澪在京都，交谈与赠礼加不了情谊，所以每章选项各给 +15/+15/+15/+17/+17/+19。
#       bond C：c2 press_the_crack，b1 shells_stay 补签；bond B：b2 ask_what_was_there，a1 carve_it_yourself 补签；
#       bond A：a2 两个“收下手巾”的选项（同时给 linen_handkerchief 与回忆）。
# 秘密：鹰丸每封信的最后一句都刮了又写，留下来的总是“下回我让你”。刮掉的是什么，全线不揭开（重逢里他自己也说忘了）。
# 依据（史实）：土佐一条家以幡多郡中村为本，四万十川在下田入海；能岛村上氏据芸予诸岛，来岛海峡潮流湍急，
#       小早是村上水军的快船；1555 年 10 月严岛之战，能岛村上的去就史家说法不一，本世界线定为站在陶方、没有出船；
#       一条房通 1556 年冬在京都去世（只写“前关白房通公过世”）；1576 年（天正四年）第一次木津川口之战，毛利与村上水军用焙烙火矢烧了织田的船队。
# 原创：鹰丸与他刻输赢的船板、下田河口的竞渡、二十三根船钉、贝壳压住的潮时表、刮过的信、头巾、素麻手巾、“未比”、十一个人回来九个。
# 缺省走向：c1—a2 无人回应时只往下走，不加任何数值；S 缺省开启重逢并设 c7_bond_takamaru_parted；
#       重逢缺省是鹰丸托能岛的船捎来的一封信和一块烧黑的船板，设 c7_bond_takamaru_missed。
# 旗标：写 c7_bond_takamaru_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed / _wrist；
#       c7_mio_heart_1 / _2 / _3（五条可许心意的羁绊共用）。重逢的变体读本线的 _own、_romance 与 c7_mio_heart_2。
#       主线 c01 读 _landing_friend（键不变）；_landing_love 现在是“到门口没进去”的落点（relation crush），c01 要读时照此写。
# 日程（整合方）：c1、c2（1553）、b1（1554 春）、a1、a2、S 都在下田（shimoda_tosa），b2 在京都（只是书信）；重逢 1576 在堺（sakai）。
# 窗口（2026-11-01 close-places）：S 在 1557-01-01..01-31（弘治二年腊月），结业后玩家就在下田。

