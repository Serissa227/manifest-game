# B2：1554 年夏到 1555 年夏，京都。一年两封信，只写潮和船，最后一行总是“下回我让你”，底下的纸刮过。
[[tracks.chapters]]
key = "b2"
title = "一年两封"
text = "上京以后，鹰丸一年寄两封信来，托能岛去堺的船捎到堺，再从堺转进京里。信纸是船上记账剩下的，背面看得见别人的数目。他只写潮和船：哪条小早在来岛的水道里翻了，捞上来四个人，丢了两支桨；今年春潮转得早，早了小半个时辰；他换了一支新桨，沉。宫里怎么样，一个字也没问。每封信的最后一行都是同一句：“下回我让你。”第二封信到的那天，我在灯下展开，灯光从纸背透过来，最后一行底下有一片发毛。我把信举到灯前侧着看：那里的纸被刀刮过，刮得快透了。原先写的是别的字，一笔也认不出来。同屋的女房问我笑什么。我说，能岛的潮今年转得早。"
