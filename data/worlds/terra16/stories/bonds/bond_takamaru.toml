# A1：1555 年盂兰盆，下田河口第二次竞渡。我抄了那条捷径，先碰了岸。口头禅在这里说一次。
[[tracks.chapters]]
key = "a1"
title = "第二次竞渡"
text = "盂兰盆我告了假回土佐。到下田的第二天，河口又办竞渡，鹰丸也从能岛回来了。船还是那一条，船板上的刻痕又多了一排。我向渔家借了一条小船。鼓响之前，我不看别的船，只盯着水色。左岸那道发深的水线还在，偏了一点。鼓一响，我贴了过去，桨一入水，船从底下被推了一把。后面有人喊，我没回头，一口气划到岸边，船头先撞上了石阶。鹰丸晚了半个船身。他靠岸以后从头上扯下头巾，团了团扔过来，正砸在我怀里，然后转身去扶他的船。岸上有人问谁赢了。他回过头，手指着我，指得笔直，然后冲我说：“我记着账呢：你还欠我一场。”“我赢了，怎么倒是我欠你？”“赢一场，就得再比一场。能岛的规矩。”他扶正了船，又去收他扔在岸上的桨。"
