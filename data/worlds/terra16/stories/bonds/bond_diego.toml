# S：1556 年 12 月，彼拉多之家门口的骡车。“别死在海上，我还没赢回来。”伏笔：他不看我的脸。秘密只用动作承认：车绳上拴着那只铜环。
[[tracks.chapters]]
key = "s"
title = "还没赢回来"
text = "十二月的一个早上，彼拉多之家门口停了一辆骡车，车上捆着迭戈的箱子。他先进城里的卫戍营，等有了船，就去西印度当军官。我的船开春往西走。我出来的时候，他正蹲在车边紧箱子上的绳，紧好了，又拽了两下。绳头上拴着一只小铜环，铜皮磨得发亮。套环那天，长院的绳上吊着的也是这样一只，那一只没人挑走。“剑带上船，”他说，“别让它生锈。”“那把是你的。”“借你的。”他站起来，拍掉膝盖上的土，“借了就得还，等我回来要。”车夫在前头催。迭戈走到门洞底下站住，眼睛一直盯着街对面的墙。“别死在海上。”他说，“我还没赢回来。”说完他咬住了嘴唇，像后面还有话，全让这一句堵了回去。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "tender"
news = "彼拉多之家这一批侍童散了。剑术最好的迭戈是坐骡车走的，先进塞维利亚的卫戍营，听说往后要去西印度当军官。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_diego" }, { kind = "flag", flag = "c7_bond_diego_parted" }]
news = "彼拉多之家门口一早停了辆骡车，侍童迭戈要走了。他在门洞底下站了很久，像在等谁，车夫催到第三遍才上车。"

[[tracks.chapters.choices]]
key = "promise"
text = "答应他：不死在海上，等他来赢。"
requires = [{ kind = "bond", person = "diego", level = "A" }]
hint = "这样的约，你们还没交到能许的份上；要么就是那个一生一次的约，已经许出去了。车夫在催，只来得及互道一声保重。"
reply = "“好。”我说，“你也别死在西印度。剑我替你带着，左脚的事你自己记着。”“早改好了。”他哼了一声，“剑要天天练，生了锈我可不认。”他把手伸过来，我握住了。他握得很重，像在掰手腕，谁也不肯先松，松开时两个人的手心里全是汗。“说好了。”他说，“到时候你要是敢让我，我拿你当海盗抓。”骡车走出去半条街，他从车篷里探出头，冲这边喊了一句什么。风从河上吹过来，没听清。我猜是“一言为定”，就也冲那边喊了一声“一言为定”，喊得门房都探出头来看。车拐过街角，那只铜环还在车尾晃。"
next = "done"
effects = [{ kind = "affinity", person = "diego", value = 5 }, { kind = "bond", person = "diego", level = "S" }, { kind = "relation", person = "diego", relation = "friends" }, { kind = "flag", flag = "c7_bond_diego_promise" }, { kind = "flag", flag = "c7_pair_diego_lorenzo_taken" }, { kind = "memory", memory = "mem-bond_diego-s", title = "还没赢回来" }, { kind = "start_track", track = "reunion_diego" }]

[[tracks.chapters.choices]]
key = "heart"
text = "回他一句：那你得活着回来赢，我等着。"
requires = [{ kind = "bond", person = "diego", level = "A" }, { kind = "heart", person = "diego", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "diego", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "diego" }]
hint = "“我等着”三个字卡在喉咙里——你们还没走到那一步；又或者，一生一次的约已经给了别人。"
reply = "他愣住了，转开脸去看门外的街，看了很久，久到车夫又催了一遍。“你这人，”他说，“怎么什么话都敢往外说。”然后他一把攥住我的手，攥得指节发白，疼得我差点叫出声，才松开。手背上四道红印子，到中午才褪干净。“这话我先记着，一个字也不许改。”他爬上车，背对着我，“等我回来，再答你。”车动起来以后，他一次也没回头，只把左手伸出车篷，冲后面摆了一下，又飞快地缩了回去，像怕被谁看见。拴在车绳上的那只铜环一直在晃，晃得街这头都看得见。"
next = "done"
effects = [{ kind = "heart", person = "diego", value = 12 }, { kind = "relation", person = "diego", relation = "crush" }, { kind = "bond", person = "diego", level = "S" }, { kind = "flag", flag = "c7_bond_diego_romance" }, { kind = "flag", flag = "c7_pair_diego_lorenzo_taken" }, { kind = "memory", memory = "mem-bond_diego-s", title = "还没赢回来" }, { kind = "start_track", track = "reunion_diego" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好在西印度的港口再比一场，谁先认输谁请酒。"
reply = "“我不会认输。”“那你请定了。”他拔出腰上那把府里新发的剑，在门框的石头上刻了一道，刻得火星直冒。“这是一道。”他把剑插回鞘里，“等你回来，刻第二道。”又补了一句：“酒钱先攒着，西印度的酒贵。”他瞟了一眼我背上那把旧练习剑，到底没开口要回去。门房在后头骂，说侯爵府的门框是给你们刻着玩的？迭戈已经跳上了车，冲我扬了扬下巴：“记着，左脚。”我低头看自己的左脚，再抬头，骡车已经走远了。门框上那道刻痕很深，白生生的，雨淋了一冬也没淡下去。"
next = "done"
effects = [{ kind = "affinity", person = "diego", value = 2 }, { kind = "relation", person = "diego", relation = "rivals" }, { kind = "flag", flag = "c7_bond_diego_own" }, { kind = "memory", memory = "mem-bond_diego-s", title = "还没赢回来" }, { kind = "start_track", track = "reunion_diego" }]

