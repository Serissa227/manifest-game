# C2：1554 年夏，第一场钝剑比试。“你左脚太慢。”物件：靴底的新印子。
[[tracks.chapters]]
key = "c2"
title = "太慢的左脚"
text = "六月，剑术教师头一回让我们换上钝剑。沙地中央画一个圈，出圈算输。迭戈三招就把我逼到了圈边，第四招剑尖点在我胸口的皮甲上，咚的一声。井边的侍童叫起好来。他刚把剑举过头顶，我说：“你左脚太慢。”剑停在半空。“输了的人话真多。”“转身那一下，左脚比右脚晚半拍。今天慢的是我，换个人，就不一定了。”他把钝剑往架子上一扔：“赢的是我。”说完就走了。往后三天，吃饭他坐得离我最远，在走廊里碰见，他就贴着另一边的墙过去。第四天清早，马厩后头有沙子响。迭戈一个人在那里转身，转过去，再转回来，左脚落地的那一下已经和右脚一样快。他看见我，没停，也没赶我走，只挪了挪地方，挪到我站的地方正好看得见的那一边。那天夜里，他的靴子脱在通铺门口。靴底前掌磨出一道新印子，斜斜的，正在转身吃力的地方。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "tense"
news = "彼拉多之家头一回换钝剑比试，迭戈三招就赢了，赢完却一连三天绕着人走；侍童们说，他每天天不亮就在马厩后头练转身。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

