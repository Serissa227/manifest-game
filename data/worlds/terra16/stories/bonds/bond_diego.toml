# 重逢：1563 年，哈瓦那，海堡工地后头的空院。通缉令与靠在墙根的剑。基础文本不点破；揭开后的反应只在 variant unveiled。
[[tracks.chapters]]
key = "reunion"
title = "港口的剑友"
text = "这一年的哈瓦那，满城石灰味，到处是凿子的声音。港口水道西岸、城边上在起一座新的海堡，墙才砌到一人高，监工的兵比干活的人还凶。字条是一个卖水的孩子塞给我的，只有一行：海堡工地后头的巷子，第三道门，日落。没有署名，字却认得——每一笔都往右歪，像个左脚落得慢的人写的。第三道门后头是个空院子，墙角长着野番石榴，没有卫兵。迭戈坐在一张旧桌子后头，腰上系着军官的红饰带，短外套的扣子照旧扣到最上面一颗。他比七年前高了，嘴角多了一道疤。他没起身，从怀里掏出一张纸摊在桌上，用手掌抹平。纸上盖着总督府的印，印底下是我的名字。然后他解下佩剑，走到院子另一头，把剑靠在墙根。护手上拴着一只小铜环，碰在石头上，叮的一声。他走回来坐下，那面墙离桌子有二十步。“坐。”他说，“今天早上送到我桌上的。上头说，见着了就抓。”"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "havana"
cast = ["diego"]
speaker = "captain"
mood = "tense"
news = "哈瓦那新海堡工地后头那个空院子，总督府里塞维利亚来的军官关着门待到天黑，出来时佩剑上的铜环叮当响；问他见了谁，他说谁也没见。"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }]

