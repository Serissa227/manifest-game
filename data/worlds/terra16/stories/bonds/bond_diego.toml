# B2：1555 年，银器间值夜。被冤枉的摩里斯科侍童（洛伦索，不点名）。物件：一只银盘。
[[tracks.chapters]]
key = "b2"
title = "银器的响声"
text = "府里丢了三只银盘。管家咬定是那个摩里斯科侍童，新来的，又总一个人待着。迭戈在通铺里把靴子踢得砰砰响：“他连银柜的钥匙挂在哪儿都不知道！”他拉我一起值夜。我们坐在银器间外头的楼梯底下，坐到三更，蜡烛灭了也没点新的。迭戈压着嗓子说：“今晚不来，明晚我还坐。”最先听见响动的是睡在厨房灶边的小杂役，他光着脚跑来扯迭戈的袖子。银柜那边果然轻轻响了一声。我们没拔剑。迭戈守在门外，我去叫管家。灯举进去的时候，那人正往怀里塞第四只银盘——是管家的外甥。管家的脸白了又红，说孩子糊涂，天亮再说，都回去睡。迭戈没动。他看着管家，把那个摩里斯科侍童的名字说了一遍，又说了一遍，第三遍说得很慢，像怕有人没听清。管家咳了一声，侧过身，让出了身后的门口。他外甥把银盘往桌上一搁，当啷一响，人已经往门边蹭了过去。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "tense"
news = "塞维利亚侯爵府丢的银盘找着了，是管家的外甥半夜从银柜里拿的；先前被冤枉的那个侍童，名字让迭戈当着管家的面念了三遍。"
