# C7 重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。旧版（GPT）整篇作废，只沿用章节 key、地点与窗口。
# 标签：BL（羁绊线，可恋爱）。主角：诺埃尔·德·卡德纳（noel，1540-11-11）。
# 人物：迭戈 diego（1540-02-22，塔里法侯爵府的侍童，侍童里剑术第一；穷绅士家的次子；romance.with = [m]，纯 BL，对诺埃尔开放）。
#   各章年龄：1554 年两人 13—14 岁；A1（1556-01..05）诺埃尔 15、迭戈 15—16；A2（1556-06..11）诺埃尔 15—16、迭戈 16；
#   S（1556-12）两人都 16，心动选项只给 crush 与“约好成年相见时再答”，最多攥手；重逢 1563 年两人都 22—23，恋人落点过门禁。
# 依据：
#   史实——塞维利亚的彼拉多之家是塔里法侯爵（恩里克斯·德·里韦拉家）的宅邸，大贵族府里养侍童、教剑术与骑术；
#         秋天的马上套环（sortija）：骑马持木枪冲过吊着的小环，挑下为中；
#         瓜达尔基维尔河上黄金塔以下、特里亚纳的船桥；哈瓦那的皇家力量堡 1558 年开工，1560 年代仍在修。
#   原创——迭戈与诺埃尔的全部情节：借剑、左脚、套环、银器间值夜、马厩的责罚、侍童竞渡翻船、门框上的刻痕、空院里的通缉令。
#         侍童竞渡是虚构的府中活动，不写成惯例。
#   待核——1563 年哈瓦那总督府军官的确切衔级（正文只写“军官”与西班牙军人的红饰带，不写制服——那时还没有统一军装）。
#   专名：宅邸照仓库通行写法作“彼拉多之家”（简报作“比拉多之家”）。
# 秘密：套环那一枪是迭戈故意偏的。B1 只埋下（“风大”），S 与重逢只用动作承认（他留着那只没被挑走的铜环），始终不明说。
# 诺埃尔的伏笔：学院期每章至多一处——C1 迭戈嘲讽“漂亮得过分”；A1 不肯让管家凑近看脸；S 迭戈不看我的脸。
#   中文不用“他/她”指诺埃尔，英文不用 he/she。重逢基础文本不点破；揭开后的反应只在 variant unveiled 与 ask_knew 里。
# 口头禅“看什么看？练你的去。”原句只在 C1 用一次；B1 回复与重逢 ask_knew 只作改了字句的呼应。“左脚”是两人的暗号，C2 起反复出现。
# 洛伦索：B2 被冤枉的摩里斯科侍童就是他，但不点名、不写他与迭戈的事（归 pair_diego_lorenzo）。
# 缺省走向：玩家不在场时故事照走、没有收获；S 缺省 → 迭戈照常启程，设 c7_bond_diego_parted 并开启重逢；
#   重逢缺省 → 迭戈的一封三行信，设 c7_bond_diego_missed。
# 落点：剑友 friends（_landing_friend，永远可选）、宿敌 rivals（_landing_rival，永远可选）、恋人 lovers（_landing_love，不公开；
#   要 c7_bond_diego_romance、心动 ≥ 24、双方满 18——A1 6 + A2 6 + S 12 = 24）。
# 共享旗标：写 c7_pair_diego_lorenzo_taken（S 的 promise 与 heart）；读 noel_unveiled（main_noel 第三章设，不存在即按未揭开）。
