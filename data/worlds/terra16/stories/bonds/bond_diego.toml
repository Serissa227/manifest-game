[[tracks.chapters.choices]]
key = "burn_warrant"
text = "跟他比一场不分输赢的剑，再看他怎么处置那张纸。"
reply = "他去墙根拿回了剑，我也拔出了自己的。头几招都是试探，像在彼拉多之家的沙地上走步子。到后来谁也不让谁，番石榴的叶子被剑风削下来好几片。比到第三十招，他收了剑：“够了。”他喘着气，低头看了看自己的脚，“左脚，不慢了吧？”“不慢了。”“你也没退步。”他说，“剑柄上的皮子换过了吧？”“换了两回。”他把那张纸对折，再对折，折成四折，塞进外套里头，贴着胸口按了按。“今天我没见过你。”走到门口，他又回过头来：“下回换个院子。这个太小，转不开身。”"
next = "done"
effects = [{ kind = "affinity", person = "diego", value = 5 }, { kind = "relation", person = "diego", relation = "friends" }, { kind = "flag", flag = "c7_bond_diego_landing_friend" }, { kind = "memory", memory = "mem-bond_diego-reunion", title = "港口的剑友" }]

[[tracks.chapters.choices]]
key = "draw_swords"
text = "走到墙根把他的剑拿过来：今天就把当年那一场比完。"
reply = "我把剑递给他的时候，他笑了一下，七年里我头一回见他笑。我们从日落打到天黑。他快了，我也快了，他的左脚再也找不出半拍的空子；他找我的空子，找到天黑也没找着。墙角的番石榴被削掉了两个，滚到桌子底下。最后两个人都拄着剑喘，分不出输赢。“你也没慢。”他说，听着有点不服气。“还没完。”“下回。”他把桌上那张纸揉成一团，扔进我怀里：“你自己收着。下回我亲自来抓，抓着了，才算我赢回来。”他把剑挂回腰上，铜环叮地响了一声，人已经出了门。"
next = "done"
effects = [{ kind = "affinity", person = "diego", value = 3 }, { kind = "relation", person = "diego", relation = "rivals" }, { kind = "flag", flag = "c7_bond_diego_landing_rival" }, { kind = "memory", memory = "mem-bond_diego-reunion", title = "港口的剑友" }]

[[tracks.chapters.choices]]
