# A2：1556 年夏，瓜达尔基维尔河上的侍童竞渡翻船。物件与赠礼：迭戈的侍童腰带（page_sash）。
[[tracks.chapters]]
key = "a2"
title = "翻船以后"
text = "六月底，府里在瓜达尔基维尔河上办侍童的竞渡，从黄金塔底下一直划到特里亚纳的船桥。我和迭戈分在一条船上，他在前，我在后。出发前，我那支桨的绳子系得松了。过河弯的时候，那支桨从桨栓里脱了出去。船身一歪，河水就灌了进来。我呛了一口，什么也抓不着。一只手从后面推了我一把，把我推到岸边一根木桩上。等我抱住桩子回头，迭戈还在水里，脑袋冒出来一下，又沉下去一下。他是自己扒着泥岸爬上来的，趴在草里咳，咳得整个背都在抖。他想骂人，嘴张了两回，一个字也骂不出来。我的胳膊被桨划开了一道口子，血顺着手腕往下滴。他看见了，伸手去解腰上的侍童腰带。湿布打了死结，他拿牙咬开，缠上我的胳膊，勒紧，系好。喘匀了气，他说的第一句是：“下回先把船上的绳子系牢。”第二句隔了很久：“你没事吧？”"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "tense"
news = "侯爵府在瓜达尔基维尔河上办竞渡，黄金塔和特里亚纳船桥之间的河弯翻了一条船；侍童迭戈呛得半死，先把同船的推到了岸桩上。"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "keep_sash"
text = "收下那条腰带，晾干了也不还他。"
requires = [{ kind = "affinity", person = "diego", ge = 80 }, { kind = "bond", person = "diego", level = "B" }]
hint = "这种时候，他只会把你拖上岸，转身就走——你们还不够熟。"
reply = "他来要过两回。头一回我说还没干，第二回我说找不着了。第三回他没来，跟管事又领了一条新的。可那条新的他一直没系，夜里挂在床头的钉子上。熄灯以前，他的眼睛总往那边溜一下，再往我这边溜一下。"
next = "s"
effects = [{ kind = "affinity", person = "diego", value = 4 }, { kind = "bond", person = "diego", level = "A" }, { kind = "item", item = "page_sash", qty = 1 }, { kind = "memory", memory = "mem-bond_diego-a2", title = "翻船以后" }]

[[tracks.chapters.choices]]
key = "pound_back"
text = "他又咳起来时，跪下去拍他的背，拍到他开口骂我。"
requires = [{ kind = "affinity", person = "diego", ge = 80 }, { kind = "bond", person = "diego", level = "B" }, { kind = "heart", person = "diego", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "diego", le = 17 }, { kind = "romance_open", romance_open = "diego" }]
hint = "这时候凑过去，他会一把推开你——还不够熟。"
reply = "“手……这么重……”他骂了半句，又咳出一口河水。咳完他没起来，额头抵在我的膝盖上，喘了很久。河面上有人喊我们的名字，一声比一声近，他才撑起身，把我胳膊上那条腰带解开，重新系了一遍，系得很紧，紧到我的手指都发麻。那条腰带后来一直在我这儿，他一回也没来要。"
next = "s"
effects = [{ kind = "affinity", person = "diego", value = 3 }, { kind = "heart", person = "diego", value = 6 }, { kind = "bond", person = "diego", level = "A" }, { kind = "item", item = "page_sash", qty = 1 }, { kind = "memory", memory = "mem-bond_diego-a2", title = "翻船以后" }]

[[tracks.chapters.choices]]
key = "scold_first"
text = "先骂他：自己都快淹死了，还顾得上推别人？"
reply = "他咳着笑出了声：“你骂人倒有力气。”我还想骂，他已经仰面躺倒在草里，不理我了。我也不理他。我们并排坐在河岸上，一个看河，一个看天，一直坐到太阳把两个人的衣裳都晒干，衣角硬得像纸。"
next = "s"
