# C1：1554 年春，庭院的沙地。迭戈的练习剑、全线唯一一次直说外貌、口头禅原句。物件：拖乱的脚印。
[[tracks.chapters]]
key = "c1"
title = "剑借来以前"
text = "彼拉多之家的庭院铺着细沙，清早洒过水，踩上去是软的。我从廊下的架子上取了一把练习剑，剑柄缠的皮子磨得发亮，比别的几把都旧。“那把是我的。”说话的是迭戈，侍童里剑使得最好的那个。他靠在柱子上，短褂的扣子扣到最上面一颗，“长得漂亮得过分的人，手腕都是软的，拿不稳剑。”井边几个侍童笑出了声。我没把剑放回去：“不比脸，比步子。你走一趟，我跟一趟。”他瞪着我，我也看着他。他走过来，从我手里把剑抽走，往沙地上一插：“看什么看？练你的去。”可他自己先摆开了架势：退三步，进两步，转身。我跟着走。一趟，两趟，那把剑一直插在沙里，没人去碰。他转身快，可每回转过来，左脚总落在同一个地方，脚跟先着地，比右脚晚半拍。太阳晒上廊檐的时候，院子里的沙已经被我们拖得乱七八糟，只有那一处被踩出了一个深坑。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "cheerful"
news = "塞维利亚彼拉多之家的侍童们说，迭戈那把练习剑从来不借人，今年开春却插在沙地里，陪人光比步子比了一上午。"
when = [{ kind = "flag", flag = "family_access_seville_tarifa" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

