# B1：1554 年秋，马上套环。迭戈那一枪偏得不像他——埋下秘密，只说“风大”。物件：没被挑走的铜环。
[[tracks.chapters]]
key = "b1"
title = "套环的空处"
text = "秋天的套环设在宅子后头的长院里。两根木杆之间拉一条绳，绳上吊一只铜环，比指环大不了多少。骑马冲过去，拿木枪把环挑下来，算中一枪。侍童们押注，全押迭戈。他骑那匹栗色的母马，前两轮枪枪不落空。第三轮环换小了一圈，场上只剩我们两个。迭戈勒住马，冲我抬了抬下巴：“你先跑。”枪尖碰上铜环的那一下，手腕一麻，环已经挂在了枪头上。院子里叫成一片。轮到迭戈。马跑得很稳，他的枪却从环底下一掌宽的地方穿了过去，偏得不像他。铜环晃了两晃，还挂在绳上。人散了，我去拴马桩那边找他。他在卸马鞍。“你是不是让我？”他把木枪往肩上一扛：“风大。”长院里的旗子垂着，一丝风也没有。那只没被挑走的铜环还吊在绳上，被太阳照得发亮。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "cheerful"
news = "塞维利亚彼拉多之家的秋季套环，人人押的迭戈那一枪偏了一掌宽，铜环叫别人挑走了；问他，他只说那天风大。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

