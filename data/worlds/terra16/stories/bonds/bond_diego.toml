# A1：1556 年春，我睡过头，迭戈说他也迟了。物件：那只最重的铁箍水桶。伏笔：不让管家凑近看脸。
[[tracks.chapters]]
key = "a1"
title = "同一份责罚"
text = "开春的一个早上，我睡过了头。等我边跑边系扣子赶到前院，晨间当值的钟早敲过了。管家拿着名册站在台阶上，凑过来端详我的脸，像要从上面找出枕头压的印子。我把脸偏开了。“罚。马厩扫三天，水槽挑满。”“还有我。”迭戈从队伍末尾走出来，“我也迟了。”管家翻名册：“你名字底下画过勾了。”“画错了。”马厩一进门就呛人。我们一人一把草叉，把旧草叉出去，再一桶一桶从井边提水。我直起腰，想去找管家讲理，刚迈出一步，迭戈的鞋尖在我的鞋帮上碰了一下，冲水槽抬了抬下巴：先干活。井边有四只水桶，三只是木头的，一只箍了铁，灌满了要两只手才提得动。提到第三趟我才看明白，那只铁箍桶一直在他手里，一趟也没轮到我。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "seville"
cast = ["diego"]
speaker = "captain"
mood = "tender"
news = "塞维利亚侯爵府的马厩这几天扫得格外干净，听说是在罚误了晨钟的人；迭戈非说自己也迟了，跟着挑了三天水。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

