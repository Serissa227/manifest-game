reply = "我绕过桌子。他坐着没动，手按在那张纸上，按得纸都起了皱。“我回来了，”我说，“你也活着。当年你说回来再答，现在答吧。”他抬起头看我，像在认一张七年没见的脸。“早就答了，”他说，“翻船那天就知道了。”他站起来，椅子在石板上刮出好长一声。他一把把我拉过去抱住，下巴磕在我肩上，抱得很紧，紧得我喘不上气。“这事不能让总督府知道。”他的声音闷在我的衣领里，“我不在乎。”那张通缉令从桌上滑下去，落在我们脚边，他一脚踩住了。院子外头传来换岗的鼓声，一下一下，他没松手。"
next = "done"
