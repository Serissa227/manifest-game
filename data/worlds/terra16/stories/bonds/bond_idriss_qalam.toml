# B1：萨阿德的人打回城以后，讲席上比引文。我快一筹，他准一筹；他把没见过原本的那条老实标上“转引”。
[[tracks.chapters]]
key = "b1"
title = "谁的出处准"
text = "萨阿德的人打回了城，城门上的旗又换了一回。讲席一开，教长出了个题目：他念一句，我们报出处，再去书库把原句找出来，拿回来对。我报得快。教长话音还没落，我已经说出了书名，跑去书库抱着书回来，伊德里斯还在架子中间转。可教长一对，我那句差了一个词——书没找错，句子是另一卷里的。伊德里斯回来得晚，翻开的那一页一字不差。算下来，我快一筹，他准一筹。教长让我们把报过的出处写在一张纸上交上去。伊德里斯写到第五条，笔停了。他想了一会儿，在那一行末尾添了两个字：转引。“这条我没见过原本。”他把纸递过去，声音不大，脸却红了，“是从别人的书里抄来的。”后排有人笑了一声。教长没笑，用指甲在“转引”两个字底下划了一道。"
