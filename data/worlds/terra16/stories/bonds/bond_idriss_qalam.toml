title = "芦苇书签"
text = "抄书匠的铺子里一股湿纸和胶的味道。伊德里斯坐在他父亲的案子后头，等我进了门，从袖子里摸出一样东西，往案上一放，又往我这边推了一寸。是一枚书签，芦苇削的，削成了他那支芦苇笔的样子：一头斜斜的笔尖，一头留着芦苇的节。节底下刻了一个字母，刻得很深——他那句老问话，打头就是这个字母。“削坏了好几根。”他说得飞快，眼睛盯着案上的墨盒，“刀不听话。”我拿起来对着门口的光看。芦苇削得很薄，透一点亮。“夹在书里。”他说，“夹在哪一页，我一翻就知道你读到了哪儿，用不着再问。”说完他自己愣了一下，像是发觉这句话把他往后的问题都省掉了，耳根又红了。"
