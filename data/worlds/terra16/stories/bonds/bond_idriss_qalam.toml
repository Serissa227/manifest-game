# A1：夜里，宣礼塔下的计时室，计时人睡着了。说好读完一页没批注的书再开口；疑问自己解开，两人同时笑出声。
[[tracks.chapters]]
key = "a1"
title = "计时室的星盘"
text = "计时室在宣礼塔底下，窄窄一间，墙上挂着水钟的铜碗，窗边的架子上立着一具星盘，黄铜磨得发亮。计时人每夜要守到晨礼，守到后半夜，就靠着墙打起鼾来。伊德里斯带来一本书，翻到一页，页边干干净净，一个字也没有。“这一页我还没批过。”他压低声音，“说好了：读完再开口。谁先开口谁输。”我们并排坐在窗下读。读到一半，我卡在一个算法上，抬头看他，他也正卡着，手已经摸到了芦苇笔。他把笔拿起来，又放下；拿起来，又放下；最后干脆把笔压在了膝盖底下。往下又读了三行，前头那个算法自己解开了——写书的人把答案搁在了后面，像存心等人着急。我们同时抬头，同时笑出了声。墙边的鼾声断了。计时人睁开眼，先看水钟，再看我们：“三更半夜，笑什么？”"
