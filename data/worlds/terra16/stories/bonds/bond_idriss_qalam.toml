# C2：批注归了堆，他一条也舍不得删，另开一页画箭头。我照着走，岔了两回；他不辩解，重画。
[[tracks.chapters]]
key = "c2"
title = "哪一层先读"
text = "分了几个月，批注总算按人归了堆，可他一条也舍不得删。他另开一张纸画箭头：这一条接正文第几行，那一条先读，读完跳到哪儿。箭头弯来弯去，有的绕过一个墨点，有的从另一支箭头肚子底下钻过去。“照着走，”他把纸塞给我，“走得通，就算排好了。”我照着走。头一回，箭头把我领到一条讲日食的批注上，正文那一行讲的却是月行。第二回，我在两支交叉的箭头中间挑错了一支，翻到了后面一张表上。我把纸摊回桌上：“这儿，我岔了。这儿，又岔了。”他没说是我看错了。他把纸拿过去，咬着笔杆看了半天，在头一支箭头上打了个叉，重新画，画得直了，起头添了个小圆圈。“我自己走当然走得通，路是我画的。”他吹干了墨，把纸推回来，“箭头是给不在场的人用的。再走一遍。”"
