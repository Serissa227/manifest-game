# C1：城里来了阿尔及尔的兵，书库照开。历表抄本的页边比正文还挤，他当场念错一处，脸红了，书没合。
[[tracks.chapters]]
key = "c1"
title = "批注比正文密"
text = "城里来了阿尔及尔的兵，城门上换了一面不认得的旗，卡拉维因的书库却照样开门，管钥匙的老人照样嫌我们脚步重。伊德里斯占着靠窗那张矮桌，面前摊着伊本·班纳的历表抄本。正文是老抄书人抄的，一行一行规规矩矩；页边全是他的，细字挤着细字，绕过正文的角又爬回来，有几处干脆钻进了行与行中间。我问他：“你自己还看得清吗？”“当然。”他把手指按在页边，念：“此处月行，较前表迟……”念到一半，他停住了，耳根一下子红透，“迟——不对，是疾。我写的是疾。”他的手指往下挪了一行，又停住：“这一条……出处呢？哪一页，第几行？”他问的是自己，答不上来的也是自己。他没合书，反倒把书往我这边推近了些：“刚才你看的是哪儿？我们从那儿来。”他从袖子里抽出一支芦苇笔，笔杆让他咬得坑坑洼洼：“帮我分一分。哪些是正文，哪些是我写的，哪些是我从别人那儿抄来的。我自己分不开了。”"
