# 重逢：1562 年，非斯。他在卡拉维因有了自己的讲席；那条当年没找到的引文，原本在一个特莱姆森商人的书箱里。
[[tracks.chapters]]
key = "reunion"
title = "找到的原本"
text = "六年没回非斯，卡拉维因的台阶还是那么滑。伊德里斯有了自己的讲席，坐在一根柱子底下，身边围着七八个学生，个个膝头摊着一本抄本。我挤到后头瞄了一眼：学生们在他的批注旁边又写批注，字更小，挤得更密。他讲完一段，抬头看见了我，嘴上没停，手指冲我勾了勾，像我只是去书库取了趟书。散了讲，他从柱子后头抱出一个布包。“特莱姆森来的一个商人，”他解开布包，里头是一本旧书，皮面裂了几道，“书箱底下压着这个。我翻了一夜。”他把书翻开，翻得飞快，停在一页上，手指落在页中间的一行上，这回按得很轻。是那一句。当年那一夜，他在灯下按着不肯挪手的那一句，原本在这儿。他没念。他把书转过来朝着我，抬起眼：“这回换你。你告诉我——在哪一页？”"
