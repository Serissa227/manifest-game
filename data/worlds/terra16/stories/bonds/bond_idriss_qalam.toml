# B2：有人借他的批注在讲席上证历表没说的事。夜里他把我叫到书库，承认那条“见某书”是照转引写的。
[[tracks.chapters]]
key = "b2"
title = "没找到的那一条"
text = "这一年，讲席上来了个梅克内斯的学生，拿着伊德里斯的批注，要证明伊本·班纳的历表早就算准了某一年的月食。正文没写这句，批注里写了，后面跟着一个书名、一个卷数，前头一个“见”字，一笔一画，像亲眼看过。那天夜里，伊德里斯在书库门口等我，提着一盏灯罩熏黑的油灯。管钥匙的老人睡了，他有钥匙，是他父亲往书库送书时配的。他把我领到靠窗那张矮桌，翻开抄本，手指按在那一条上，按得指甲发白。“这句我没见过原本。”他说得很快，像一口气不说完就再也说不出来，“是从我祖父的笔记里抄的。那是我头一年写批注，抄的时候本该写‘转引’，我写了‘见’。写了‘见’，看着就像我看过。”灯芯噼啪响了一声。他盯着那一行，没看我。“我要是说出来，以后谁还信我的批注？一条是假的，别人就会说，整页都是他编的。”他的手指还按着没挪，“可那个人明天还要拿它去讲。”"
