# B2：1555 年，北行过海口的前一晚。他怕水，怕了一整年；攥皱的帽檐。
[[tracks.chapters]]
key = "b2"
title = "腿软的人"
text = "三个月早就过了，巴兰还在船上。我问他什么时候回去跟他爹交账，他说再跟一趟，北边那一趟。往北要过一段海口，潮水从窄处挤出来，浪是竖着的。出发前一晚，他摸黑来到海滩，帽子攥在手里：“明天让我坐船尾。”“船尾要掌绳，你又不会。”“我学。”月光底下，我看见他攥着帽檐的那只手在抖，抖得帽子都跟着颤。我想起第一次出河口时他抠船舷的样子，想起这一年里每次过浪，他都抢着去舀水，背对着海。他怕水。怕了一整年，每一趟都来了。他看出我看出来了，脸先是涨红，接着发白：“别告诉别人。尤其别告诉我爹——我在铺子里跟他夸过，说那个海口我闭着眼都能过。”帽檐在他手里攥成了一团，那是他最心疼的一顶帽子。"
window = [[1555, 1, 1], [1555, 12, 31]]
cast = ["balam"]
speaker = "captain"
mood = "tense"
news = "坎佩切海边的人说，可可商的儿子跟着独木舟跑了一整年还不肯回铺子，他爹托人捎了三回口信，他回回都说再跑一趟。"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

