reply = "回去又要跨那道石缝。这回我先过去，回身把手伸给他。他看了看我的手，没说话，握住了。过了石缝，他没松，我也没松。我们就那样站在湿漉漉的礁石上，说哪道浪是黄的、哪道是蓝的，一直说到潮水漫上来打湿了脚背。“科苏梅尔，”我说，“我最想在那儿靠岸。”他点点头，好像那也是他的答案。"
next = "a2"
effects = [{ kind = "affinity", person = "balam", value = 3 }, { kind = "heart", person = "balam", value = 6 }]

# A2：1556 年秋，他头一桩自己的买卖。那只刻了记号的可可葫芦。
[[tracks.chapters]]
key = "a2"
title = "自己换来的可可"
text = "秋天巴兰从北边回来，晒黑了一圈，帽子也旧了。他跟我的船跑了两年多，攒下的工钱一直缝在钱袋的夹层里。这回他没去他爹的铺子，拿工钱在盐滩换了两袋盐，又背着盐走了三个村子，换回一只葫芦。他在海滩上拔开葫芦塞给我看。里面是满满的可可豆，颗颗饱满，油亮，敲开一颗，香得人鼻子发酸。“上好的。”他说，“没照我爹的价目表换。一颗一颗，都是我自己讲下来的价。”他把塞子塞好，抱在怀里，抱了好一会儿，才问：“这一葫芦，能不能算我在你船上的一份？”葫芦肚上刻着一道歪歪扭扭的记号，是他自己刻的，说怕跟他爹的货混了。"
window = [[1556, 6, 1], [1556, 11, 30]]
cast = ["balam"]
speaker = "captain"
mood = "tender"
news = "坎佩切的盐贩说，梅里达可可商的儿子背着两袋盐走了三个村子，换回一葫芦好可可，连他爹的铺子都没进。"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "accept_cacao"
text = "收下葫芦，告诉他：这是我收过最贵的东西。"
requires = [{ kind = "affinity", person = "balam", ge = 80 }, { kind = "bond", person = "balam", level = "B" }]
hint = "他把葫芦抱得紧紧的——你们还没熟到他肯整只交到你手里。"
reply = "他嘴一咧，张口就要报这葫芦值多少，话到嘴边又咽了回去。那天晚上我煮了一锅可可，放了辣椒，打出厚厚的沫。我们捧着碗蹲在火边，喝得太急，两个人都烫了舌头，咝咝地吸气。他舔着嘴唇说：“下一桩买卖，我要做得比这个大。”葫芦洗干净了，挂在我的船舱里。"
next = "s"
effects = [{ kind = "affinity", person = "balam", value = 4 }, { kind = "bond", person = "balam", level = "A" }, { kind = "item", item = "cacao_gift", qty = 1 }, { kind = "memory", memory = "mem-bond_balam-a2", title = "自己换来的可可" }]

[[tracks.chapters.choices]]
key = "half_back"
text = "倒出一半还给他：这一半，算你入股我的船。"
requires = [{ kind = "affinity", person = "balam", ge = 80 }, { kind = "bond", person = "balam", level = "B" }, { kind = "heart", person = "balam", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "balam", le = 17 }, { kind = "romance_open", romance_open = "balam" }]
hint = "这话现在说还太早——他也还没打定主意，把葫芦交到你手里。"
reply = "我把可可倒在帆布上，一颗一颗分成两堆，一堆装回葫芦，推回他怀里。他愣住了，接着笑起来，又照老习惯张嘴要讨价，我抢在前头：“不用开价了，就这么定。”他把那一半郑重地倒进钱袋，系了两道绳。“那以后船上的账，”他说，“我要记一半。”说这话时他没看我，看的是那只葫芦。"
next = "s"
effects = [{ kind = "affinity", person = "balam", value = 3 }, { kind = "heart", person = "balam", value = 6 }, { kind = "bond", person = "balam", level = "A" }, { kind = "item", item = "cacao_gift", qty = 1 }, { kind = "memory", memory = "mem-bond_balam-a2", title = "自己换来的可可" }]

[[tracks.chapters.choices]]
