# S：1556 年 12 月，坎佩切海滩。我回科苏梅尔，他回梅里达的铺子；这句话由我来说。
[[tracks.chapters]]
key = "s"
title = "跟我的船"
text = "十二月的风从海上来，岛上的父亲派了两条独木舟到坎佩切接我。学校散了，名册上那个“玛丽亚”留在了梅里达，我要回科苏梅尔，往后的盐路、可可路，都得我自己去跑。巴兰也要回去了。他爹捎了话：梅里达的铺子开春交给他，账本都备好了，他只管坐在柜台后头收豆子。船装满了，我站在船头，他站在岸上的湿沙里。那顶西班牙帽子已经旧得软塌塌的，帽檐上还留着那年被他攥出来的褶子。“你呢？”我先问他。“铺子挺好。”他答得飞快，“不用过海口，不用舀水。我爹说，一年挣的能抵你两条船。”他像在念一张价目表，眼睛却一直盯着我船舱里那几筐可可。浪一下一下舔着船底，桨手们都在等我发话。"
window = [[1556, 12, 1], [1556, 12, 31]]
cast = ["balam"]
speaker = "captain"
mood = "tender"
news = "科苏梅尔来的两条独木舟在坎佩切接上船家的女儿往东去了，梅里达可可商的儿子站在岸边的湿沙里，送了好一阵。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_balam" }, { kind = "flag", flag = "c7_bond_balam_parted" }]
news = "科苏梅尔来的两条独木舟在坎佩切装满了货往东去了；梅里达可可商的儿子被他爹叫回去看铺子，没赶上送行。"

[[tracks.chapters.choices]]
key = "promise"
text = "约好：等你自己的船造好那天，两条船结成一支商队。"
requires = [{ kind = "bond", person = "balam", level = "A" }]
hint = "这样的约一辈子只许一回——要么你已经许给了别人，要么你们还没走到能许的那一步。"
reply = "“那得攒好多可可。”他说。“你会攒。你在我船上攒了三年。”他低头看着沙子，脚尖在湿沙上画了两道并排的线，又画一道把它们连起来。然后他摘下那顶旧帽子，蹚着水走过来，把帽子放进我的船舱，压在可可筐上。“先压在这儿，当定金。”他说，“船造好了，我来赎。”桨手开始往外撑。我回头的时候，他还站在水里，没戴帽子，头发被风吹得乱七八糟，冲我比了个数豆子的手势，意思是：这笔账记着。我在船舱里把帽子翻过来，衬里缝了个小兜，兜里塞着一颗可可豆。"
next = "done"
effects = [{ kind = "affinity", person = "balam", value = 5 }, { kind = "bond", person = "balam", level = "S" }, { kind = "relation", person = "balam", relation = "friends" }, { kind = "flag", flag = "c7_bond_balam_promise" }, { kind = "memory", memory = "mem-bond_balam-s", title = "跟我的船" }, { kind = "start_track", track = "reunion_balam" }]

[[tracks.chapters.choices]]
key = "heart"
text = "对他说：跟我的船，别跟你父亲的。"
requires = [{ kind = "bond", person = "balam", level = "A" }, { kind = "heart", person = "balam", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "balam", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "balam" }]
hint = "这句话还说不出口——你们还没走到那一步，或是这辈子唯一的约，你已经许给了别人。"
reply = "他看着我，看了很久，久到桨手咳了一声。“那得先问问你的船，”他说，“要不要我。”“我的船听我的。”他笑了，笑得跟那年站在浅水里摊开一把可可豆时一个样。他蹚着水过来，握住我搭在船舷上的手，握得很紧，手心是热的，没有出汗。“我爹的铺子，我先去坐两年。”他说，“把跟西班牙人讲价的本事学会，把本钱攒够。等我十八岁，我就去科苏梅尔，到时候你再告诉我，你的船要不要我。”他松开手，退回岸上。船撑出去好远，我还看得见他站在那里，一只手按着胸口，好像那儿揣着一葫芦可可。"
next = "done"
effects = [{ kind = "heart", person = "balam", value = 12 }, { kind = "relation", person = "balam", relation = "crush" }, { kind = "bond", person = "balam", level = "S" }, { kind = "flag", flag = "c7_bond_balam_romance" }, { kind = "memory", memory = "mem-bond_balam-s", title = "跟我的船" }, { kind = "start_track", track = "reunion_balam" }]

[[tracks.chapters.choices]]
key = "own"
text = "各走各路：他回铺子，我回海上，谁也不欠谁。"
reply = "“也好。”他点点头，点得很用力，“我先学会自己挑航路。铺子是我爹的，往后走哪条路，得我自己挑。”我把他用了三年的那支桨从船里拿出来，递给他。桨柄上有他磨出来的两个凹，正好是他手指的位置。他接过去掂了掂：“这算送我的？”“不算送。这支桨认了你的手，别人握着不顺。”“那我可不付钱。”他把桨扛上肩膀，往后退了两步，又站住，“往后在哪片海碰上了，我还要跟你讲价，你别想占我便宜。”船撑出去了。他扛着桨站在岸上，像扛着一面旗。"
next = "done"
effects = [{ kind = "affinity", person = "balam", value = 2 }, { kind = "relation", person = "balam", relation = "friends" }, { kind = "flag", flag = "c7_bond_balam_own" }, { kind = "memory", memory = "mem-bond_balam-s", title = "跟我的船" }, { kind = "start_track", track = "reunion_balam" }]

