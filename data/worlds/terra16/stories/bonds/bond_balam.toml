reply = "他把可可豆一颗颗收回钱袋，系紧了绳：“成交。我爹知道了，牙都要笑掉。”“那你就别告诉他。”他想了想，弯腰从船里捞出那顶帽子，扣回头上，往城里走了。后来我才知道，他真的一个字也没跟他爹提。"
next = "c2"
effects = [{ kind = "affinity", person = "balam", value = 4 }]

[[tracks.chapters.choices]]
key = "silly_price"
