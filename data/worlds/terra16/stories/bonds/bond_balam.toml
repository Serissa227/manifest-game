reply = "我没去试他的船。我把两条船的缆绳拉过来，在两根船桩之间打了个结，打的是过海口时用的死结。“以后同一条路，”我说，“同一本账。”他看看那个结，又看看我，嘴唇动了动，大概又是那句讨价的老话。我先摇了头：“不用讲价了。”他笑了一声，低头吻了吻我的手背，吻完又慌了，耳朵通红：“这是西班牙人的规矩，我在梅里达学的，你别嫌——”“那就照玛雅人的规矩，再来一次。”他愣了一下，真的再来了一次，这回没吻手背。货岸上搬盐的人吹起了口哨，他也不管。后来他在船头那两个字底下补刻了一行小字：她除外。刻得歪歪扭扭，跟当年葫芦上的记号一个样。"
