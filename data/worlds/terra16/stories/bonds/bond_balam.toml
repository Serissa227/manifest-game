text = "跟他结成两条船的商队，回程走哪条路，轮流定。"
reply = "我先试了他的船。船底刮得干净，压舱石摆得正，盐袋摞得船头船尾一样沉——跟我当年摞的一模一样。他坐在船头，回过头冲我挑了挑眉毛。回到岸上，我们蹲在沙地上画账。他一颗可可都不让，我也一颗不让，从中午吵到太阳偏西，桨手们在旁边睡了一觉。最后拿树枝在沙上写定了：赚的对半，赔的对半；回程这一趟我定，下一趟他定；遇上风，先救人，后救货。他盯着沙上那几行字看了很久，伸出手来跟我一拍：“这是我做过最好的一桩买卖。”第二天一早，两条船一前一后出了港。“不卖”在前头，绳子盘在两条船中间，随时能系上。"
