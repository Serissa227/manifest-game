# A1：1556 年春分，坎佩切退潮的礁石。这回我先伸手；那块湿滑的礁石。
[[tracks.chapters]]
key = "a1"
title = "春分的岸"
text = "春分前后，坎佩切的潮退得特别远。船搁在浅水里，船底下露出一大片礁石，长满了滑溜溜的绿苔。我生在春分，母亲托人从岛上捎来一串贝壳，我挂在了船头。要上那片礁石，得跨过一道积水的石缝。我先伸出手：“扶我一把。”巴兰愣了一下，看看我的光脚板：“你？你在这片礁石上跑得比螃蟹还快。”嘴上这么说，他还是把手递过来，握稳了，等我两只脚都踩实，才松开。他没像平时那样说一句“这一扶也得算钱”，只把手在衣服上蹭了蹭。我们坐在礁石上看浪。近处的浪是黄绿的，远一点变成蓝，再远就看不清了。“你说，”他捡起一块小石子，在手里翻来翻去，“这么多片海，你最想在哪儿靠岸？”往常他问的，是哪片海最值钱。"
window = [[1556, 3, 18], [1556, 5, 17]]
cast = ["balam"]
speaker = "captain"
mood = "tender"
news = "坎佩切的人说，春分那几天潮退得老远，海边的礁石全露了出来，有两个梅里达学校的孩子在上头坐了一下午。"
when = [{ kind = "date", from = [1556, 3, 18], to = [1556, 5, 17] }, { kind = "age", le = 17 }]

