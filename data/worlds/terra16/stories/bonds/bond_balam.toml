# C1：1554 年初，坎佩切海滩。他要买船，我要他跟船三个月；那把汗湿的可可豆。
[[tracks.chapters]]
key = "c1"
title = "买不走的船"
text = "放假回到坎佩切，家里的独木舟搁在海滩上等货。我正蹲着刮船底的藤壶，一片影子罩过来。是巴兰，梅里达学校里坐我后排的可可商儿子，头上一顶簇新的西班牙毡帽，帽檐宽得能给半条船遮阴。“玛丽亚，这船我要了。”他摊开手，掌心一把可可豆，“你开多少，我爹都付得起。”“不卖。想坐它，先跟船三个月。搬货、舀水、守夜，一样不少。”“三个月算什么？”当天下午我们出河口试船，正撞上退潮的回流，船身猛地一侧。我回头，看见他的脸刷地白了，两只手死死抠住船舷。我什么也没说，把桨换到另一边，船正了。他也装作没事，靠岸时第一个跳下水，帽子落在了船里。他站在浅水里，把那把可可豆又摊开，豆子被手心的汗泡得发亮：“说个价。”"
window = [[1554, 1, 1], [1554, 4, 30]]
cast = ["balam"]
speaker = "captain"
mood = "cheerful"
news = "坎佩切的海滩上，梅里达可可商家的儿子捧着一把可可豆要买一条独木舟，船家的姑娘不卖，倒把他雇去跟船三个月。"
when = [{ kind = "flag", flag = "family_access_merida_franciscan" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

