# 重逢：1563 年，科苏梅尔的货岸。他有了自己的船，船头刻着“不卖”。
[[tracks.chapters]]
key = "reunion"
title = "两条独木舟"
text = "科苏梅尔的货岸边泊着一条新独木舟，船身刷了红土，船头刻着两个字，刻得很深：不卖。船主正蹲在船边往上搬盐袋，听见脚步声，抬起头来——是巴兰。他比当年黑了，肩膀也宽了，头上没戴帽子。“我就知道你得来看。”他站起来，拍掉手上的盐。去年马尼那件事以后，整个尤卡坦的人说话都压低了嗓子，好些人家的船搁在岸上不敢出。他照样跑他的盐路，从北边盐滩跑到这里，一个月一趟。“两条船结成一队。”他指指我的船，又指指他的，“遇上风，就把绳子系在一起，谁也翻不了。分利的事，坐下来慢慢讲。”他把桨往我手里一塞：“不过你先试试我的船。北边那个海口，我现在坐在船头过。我还会浮水了，浮得比你稳。”"
window = [[1563, 1, 1], [1563, 12, 31]]
at = "cozumel"
cast = ["balam"]
speaker = "captain"
mood = "cheerful"
news = "科苏梅尔的货岸边来了一条新独木舟，船头刻着“不卖”两个字。船主是梅里达可可商的儿子，从北边盐滩一个月跑一趟。"
when = [{ kind = "date", from = [1563, 1, 1], to = [1563, 12, 31] }]

