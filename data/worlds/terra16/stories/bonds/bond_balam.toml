# 巴兰：买不走的船（bond_balam / reunion_balam）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用章节 key、地点与年份。
# 标签：GB（羁绊线，可恋爱；由伊希先开口）。适用主角：伊希·妮克特（ix_nikte）。
# 人物：巴兰 balam（1540-11-13，男，romance.with = f）；伊希·妮克特 ix_nikte（1540-03-21，女，主角，“我”；学校名册上叫“玛丽亚”）。
#       学院期 1554—1556：伊希 13—16 岁、巴兰 13—16 岁；A1（1556-03-18..24）伊希在春分这几天满 16、巴兰 15，心动只写牵手；
#       A2（1556-06..11）巴兰 11 月满 16；S（1556-12）两人都是 16，心动选项只到握手与 crush，告白只是“等他十八岁再来问”。
#       重逢 1563：伊希 22—23、巴兰 22，双方成年，伴侣落点合法；生年相差不足一年。
# 依据：
#   史实——尤卡坦沿岸的玛雅贸易独木舟贩可可、盐、蜂蜜与棉布，可可豆当钱使；北部海岸有盐滩；
#         西班牙人禁止去科苏梅尔伊希切尔圣所朝拜，沿岸有巡查；伊希切尔与接生、草药相连；尤卡坦内陆的塞诺特（天然井）；
#         1562 年马尼的焚书之后尤卡坦人人噤声（只在重逢里作一句阴影，不写现场——现场归 bond_kan_pech 的重逢）。
#   原创——巴兰其人、那把汗湿的可可豆、换下一筐可可的淡水罐、他父亲的许可纸、攥皱的帽檐、春分退潮的礁石、
#         刻了记号的可可葫芦（赠礼 cacao_gift）、压在船舱里的旧帽子、船头刻的“不卖”、按字收钱的书记。
#   待核——坎佩切近岸“河口”的回流与北行途中“海口”的急流按常理拟写，不指具体地名；
#         1554 年西班牙巡查在科苏梅尔岸外用小船盘问独木舟的做法按常理拟写；盐滩换可可的比价不写数。
# 缺省走向：玩家不回应时故事照走（C1—A2 的 default 无收获）；S 的 default 开启重逢并设 c7_bond_balam_parted；
#           重逢的 default 是巴兰托梅里达广场上的书记代写的一封信（letter），设 c7_bond_balam_missed。
# 羁绊阶梯：C2 sit_on_load（bond C）→ B2 teach_float（bond B）→ A2 accept_cacao 或 half_back（bond A，赠礼与回忆）→ S promise / heart（bond S）。
# 心动：A1 reach_first +6 → A2 half_back +6（要求 ≥ 6）→ S heart +12（要求 ≥ 12）= 24，正好是重逢伴侣落点的门槛。
# 旗标：写 c7_bond_balam_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；
#       重逢的 variants 读本文件的 _promise、_romance。不读外部旗标；本线不设共享 _taken 旗标（JSON 未指定）。
# 日程：cast 里巴兰 1557—1590 在 merida_city；重逢在 1563 年的科苏梅尔，需整合方让他 1563 年在 cozumel（或在那一年加一段）。
#       学院期各章 at = campeche（放假回家的海滩），巴兰的学院日程在梅里达，若在场判定要求人物到场，需整合方补坎佩切的假期日程。
# 口头禅：“说个价。”只在 C1 正文末尾用一次；B1、A2、重逢里换说法呼应（“开个数”“讨价”）。
# 秘密：巴兰怕急流——B2 由“我”看出来；不进任何见闻。草药是给圣所旁的人——也不进见闻。
# 地点（2026-11-01 close-places）：学院章正文都写放假时坎佩切的海滩，养成期伊希只在梅里达，七章都去掉 at（不限地点），正文不动；
#   玩家回应时见闻照常记下，跳过养成时缺省的见闻没有地点、听不到。重逢 1563 仍在科苏梅尔。

