# B1：1554 年秋，坎佩切海滩的火堆边，回述科苏梅尔岸外的巡查。他父亲的许可纸。
[[tracks.chapters]]
key = "b1"
title = "巡逻的问话"
text = "从科苏梅尔回来的第三个晚上，我们在坎佩切的海滩上生了一堆火，烤巴兰从市场换来的鱼。那一趟是在岛上的圣所附近被拦下的。两个西班牙兵划着小船贴过来，问我们装的什么、去哪儿、见谁。船底压着母亲托我带的一包草药，是给圣所旁边的人的——那地方，西班牙人不许去。我刚要开口，巴兰抢了先：“我爹的盐，送镇上的。”他的声音比平时低，还从怀里掏出他父亲的许可纸，展开递过去，手稳得像在铺子里收钱。兵看了看纸上的印，挥手放了船。这会儿他把鱼翻了个面，才说：“那时候，我腿一直在抖。”“我看见了。”“你看见个鬼，你在看那包药。”他把树枝戳进火里，“那包草药，到底是给谁的？”火光里，那张许可纸还从他衣襟里露出一角，被海水洇湿了一块。药的事我没先答，先告诉了他另一件：“我不叫玛丽亚。我叫伊希·妮克特。”"
window = [[1554, 9, 1], [1554, 12, 31]]
cast = ["balam"]
speaker = "captain"
mood = "tense"
news = "坎佩切的船家说，西班牙人在科苏梅尔岸外拦了一条独木舟，梅里达可可商的儿子掏出他爹的许可纸，兵看了看印，就放过去了。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

