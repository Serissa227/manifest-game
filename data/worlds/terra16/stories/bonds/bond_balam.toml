# C2：1554 年夏，北行装货。他只挑贵的筐往船尾摞；换下一筐可可的那罐淡水。
[[tracks.chapters]]
key = "c2"
title = "少装一筐"
text = "往北的这一趟装可可和棉布。巴兰挽起袖子，专挑豆子最饱满的那几筐往船尾摞，摞到第五筐，船头翘了起来，船尾的水线快漫到舷边。“这几筐到了北边的盐滩，能换两倍的盐。”他拍着筐沿，“少装一筐，就少一笔。”我把最沉的那一筐从船尾掀下来，拍拍船头空着的横板：“这一筐的分量，你来顶。”他不情不愿地爬过去坐下，船头一沉，整条船一下子平了。他低头看看脚边的水线，又看看沙滩上那筐可可，嘴里念念有词，一颗一颗地算亏了多少。我去搬水罐。等我回来，他已经把另一筐可可也搬回了岸上，空处换上一罐淡水，罐口用芭蕉叶扎得紧紧的。“这罐水也得算价。”他抹了把汗，“我少挣的那一筐，你给我记在账上。”"
window = [[1554, 5, 1], [1554, 8, 31]]
cast = ["balam"]
speaker = "captain"
mood = "tense"
news = "坎佩切的脚夫说，可可商家的儿子跟独木舟装货，把一筐上好的可可搬回岸上，换了一罐淡水，都说这孩子把账算糊涂了。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

