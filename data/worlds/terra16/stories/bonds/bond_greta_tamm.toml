# B1：1554 年秋，开讲以后。各教一段，码头的孩子拿炭在门板上评。
[[tracks.chapters]]
key = "b1"
title = "孩子来评"
text = "秋天开讲，先生出了个主意：我和格蕾塔各教一段，听的是码头的孩子，评的也是码头的孩子。听不懂哪里，就拿炭在仓房的门板上画个记号。我讲怎么把零钱凑成整钱。讲完一看，门板上我这边多了一道歪歪扭扭的长线。年纪最大的那个孩子替大家说：“跑太快了，像赶车的。”格蕾塔讲保险——一条船出了事，几家商行分着赔。她讲得一点不快，可她那边也画了一条小船，船离岸画得老远。“保险是什么？”一个孩子问，“能吃吗？”格蕾塔愣了一下，接着拍了一下手：“好，这一处我输了。”她转过头看我，“那一处，你输了。”她拿炭条在两个记号旁边各写了当天的日子。"
