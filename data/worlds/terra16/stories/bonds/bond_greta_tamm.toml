# C1：1554 年初春，特拉沃河码头的仓檐下。她先涂掉货主的名字，再拿货单的背面当课本。
[[tracks.chapters]]
key = "c1"
title = "旧货单的背面"
text = "特拉沃河码头的仓檐下，鲱鱼桶码得齐肩高。格蕾塔坐在一只倒扣的空桶上，膝头摊着一摞作废的货单，搬运工的孩子们围着她蹲了一圈。她不急着开课，先拿笔蘸墨，把每张货单上货主的名字一行行涂黑。我问她涂它做什么。“这是人家的买卖，”她头也不抬，“几桶鲱鱼、欠谁多少，摊给孩子们看，就成了码头上的闲话。”涂完了，她把纸翻过来，背面才是课本。她在上头画一排小圈：“一个圈，一桶。你们的父亲今天扛了几桶？”最小的那个孩子没答，抢过笔，在纸角上画了一个圈，又在圈中间戳了一个点，像计数板上的一枚筹码。格蕾塔看了一会儿，把那张纸从一摞里抽出来，折了两折，夹进自己的本子。“这是他的第一笔账，”她说，“得有人替他收着。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "lubeck"
cast = ["greta_tamm"]
speaker = "captain"
mood = "cheerful"
