# 依据·史实：汉萨同盟走下坡路时的吕贝克；特拉沃河码头与河边的仓房、鲱鱼桶；圣母教堂（Marienkirche）一带的商人账房；
#   卡塔琳娜学校 1531 年开在方济各会的旧修院里，只收市民家的男孩（A2 格蕾塔那句“学校不收我”据此）；
#   吕贝克马克 = 16 先令、1 先令 = 12 芬尼；码头搬运工按桶计工钱（简报的设定）。
# 依据·原创：格蕾塔与她的副账；码头的孩子约斯特、摔死的搬运工克劳斯与他的寡妇；门板上的炭记号；铜炉边“不许说比例”的那道题；
#   旧账皮封缝的笔盒（皮子背面的 1531 是她父亲替学校记的第一本账）；S 章那张“人人能核的工钱账”；重逢的码头学堂与商行补发三年工钱。
#   待核：1550 年代特拉沃河码头的吊车形制（正文只写“吊车”“踏轮”）；搬运工每桶的工价（正文“一桶一芬尼”只是课上的例子）。
#   年代：吕贝克账房用计数板与铜筹码算账，C1、A1 不写算盘（简报 A1 原作“算盘掉了一颗珠”，改作筹码）；A2 不写“铅笔”（石墨铅笔要到 1560 年代才在欧洲流行），改作“铅条”——账房画格线用的金属铅条。
