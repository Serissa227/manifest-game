text = "吊车的踏轮停了半天。搬运工克劳斯从吊臂底下摔下来，抬走时已经没气了。月底，商行给他寡妇的工钱少算了九天，工头说那九天的账对不上。格蕾塔在码头上一句话也没说。傍晚她把我叫到圣母教堂旁边的账房，绕过她父亲的写字台，走到后面的柜子跟前蹲下，从最底下一层抽出一本薄账，封皮上没有字。每一页都是码头工人的名字，名字后面一排小数：哪天、几桶、该拿几个芬尼。克劳斯那一页，九天，一天不缺。“我父亲的账记商行的钱，”她说，“这一本记他们的。”她把克劳斯那九天一个数一个数念出来，念得很慢，很清楚，像念给一个听不见的人。念完，她合上账：“把小数目也算上。九天就是九天。”她抬头看我，“这本账，该不该拿出来？”"
