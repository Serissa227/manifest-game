reply = "“带人家的原账来，别带你自己抄的。”她说。我说原账锁在人家的账房里，要看只能偷。她想了想，伸手从我怀里摸出那个笔盒，把笔数了一遍，三支都在，才松口：“那就带你自己算的。在别的港口看见搬运工领钱，记下几个人、几桶、谁画押、短没短。算错了，我改。”她在那张大纸的最下面添了一行，写上我的名字，后面画了一个小圈。“这是你的格。每回回港，画一个圈。”她把那一行又描了一遍，描得比别的行都黑，“少画一个，我也记着。”"
