# A2：1556 年夏秋，账房。旧账皮封缝的笔盒，内侧写着“十一”。
[[tracks.chapters]]
key = "a2"
title = "旧皮封的笔盒"
text = "格蕾塔把一个笔盒放在我面前。皮子是旧的，磨得发亮，边上用麻线缝了一圈，针脚密得数不清。打开，里面躺着三支削好的鹅毛笔。“出了海，记账别用铅条，”她说，“铅条一擦就没了。到时候船主说你没记，你拿什么跟他争？”我把笔一支支拿出来看。笔盒内侧的皮子上，她用很小的字写了一个数：十一。“这是什么？”“你在码头教过的孩子。”她说，“约斯特算一个，克劳斯家的小女儿也算一个。你自己没数过，我替你数了。”她说完，把笔盒往我这边推了一寸，手指还压在盒盖上没拿开。"
