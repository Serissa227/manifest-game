# A1：1556 年正月前后，账房的铜炉边。不许说“比例”的一道题。
[[tracks.chapters]]
key = "a1"
title = "炉边的一道题"
text = "河面还封着冰，账房的铜炉烧得通红，炉盖上烘着一壶淡啤酒。格蕾塔在石板上出了一道题：三家商行合装一船盐，各出的袋数不一样，半路湿了一成，三家各赔多少。我扫了一眼：“这个容易。”“那你讲给我听。就当我是约斯特。”她把粉笔递过来，“他没学过比例，你也不许说‘比例’两个字。”我讲到第二家该赔多少，卡住了。不说那两个字，那一步怎么也绕不过去。我只好在石板上画了一条船，又画了三堆盐，盐画得像三堆雪。格蕾塔先笑出了声，我跟着笑。炉膛里的炭塌下去一块，火星溅到炉盖上。“你看，”她擦着眼角，“大人也有卡住的地方。”"
window = [[1556, 1, 1], [1556, 3, 31]]
at = "lubeck"
cast = ["greta_tamm"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 3, 31] }, { kind = "age", le = 17 }]

