# C2：1554 年夏，码头。约斯特一句话要停三回，攥着一枚铜币。
[[tracks.chapters]]
key = "c2"
title = "问得慢的孩子"
text = "来学数的孩子里有个叫约斯特的，手里攥着一枚铜币，攥得指节发白。轮到他问，他一句话要停三回：“为什么……我爹……那天……”我听出他问的是工钱，没等他说完就替他答了：“工钱按桶算，扛得多，拿得多。”格蕾塔没看我，只轻轻摇了摇头，把当石板用的那块木板往约斯特跟前推了推，等着。河边的吊车吱呀转了半圈，又转回来。“他还没问完，”她对我说，声音压得很低，“你答的是你听见的那一半。”约斯特把铜币放在木板上，又拿起来，又放下。"
