#   s 的 default 设 c7_bond_greta_tamm_parted 并开启重逢；重逢 default 是格蕾塔的一封来信（学堂开了、副账成了），设 _missed。
# 旗标：写 c7_bond_greta_tamm_promise / _romance / _own / _parted（S）、_landing_friend / _landing_love / _missed（重逢）；
#   S 的 promise 与 heart 另写共享旗标 c7_tie_new_hinrik_korn_greta_tamm_taken（tie_new_hinrik_korn_greta_tamm 的落点读它，改走并肩）。
