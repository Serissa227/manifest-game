# 重逢：1563 年春夏（北方七年战争 8 月宣战以前），码头仓边的小学堂。副账已经摆上台面；这回她做学生。
[[tracks.chapters]]
key = "reunion"
title = "码头的学堂"
text = "隔了六年多再回吕贝克，码头仓边多了一间小屋，门板上用炭画着一排圈。门敞着，里面坐满了搬运工的孩子，一人一块石板，讲台是一只倒扣的鲱鱼桶。格蕾塔站在桶边，比从前高了一点，说话还是那样慢。她看见我，没停课，只把手里的粉笔举了举。下了课，她从柜台上拿起那本封皮没字的薄账——如今它就摆在那儿，谁来都能翻。“商行认了，”她说，“照这本账，补了三年的工钱。克劳斯家那九天，一天不少。”柜台另一头摞着一叠新本子，是她这些年学的账法，威尼斯人的、安特卫普人的，抄得密密麻麻。她把那一叠推到我面前，自己在孩子的小凳上坐下，膝盖顶着下巴：“考我。这回轮到我做学生。”"
