# S：1556 年 12 月 8 日以后（她刚满 16），账房窗下。我要上船，她留下来画一张人人能核的工钱账。
[[tracks.chapters]]
key = "s"
title = "算进来的人"
text = "十二月，特拉沃河边结了一层薄冰，我的船月底就要出河口。格蕾塔没提送行。她坐在账房的窗下，面前摊着一张新裁的大纸，从左到右画好了格子：名字、日子、桶数、该付、实付。“码头上人人看得懂的账，”她说，“不识字也行，一桶画一个圈。工头一份，商行一份，钉在吊车底下一份。”“钉在吊车底下，雨一淋就烂了。”“那就每个月钉一张新的。”她把纸抚平，“纸钱我算过，一年不到三马克。我满十六了，这笔钱我出得起。”她说完才抬头看我，笔尖停在“实付”那一格上，一滴墨落下来，洇开了，她也没去擦。"
