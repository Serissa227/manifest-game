# C7 羁绊线（Claude 重写）：bond_greta_tamm「格蕾塔：零头也要记」+ reunion_greta_tamm「格蕾塔：码头的学堂」——遵循 A5 / E37 故事 2.0 契约。
# 标签：any（主角是女性时为 GL，男性时为 BG）；可恋爱的羁绊线。
# 主角：custom_lubeck_accounts（吕贝克账房与卡塔琳娜学校，1540 年生）；第一人称“我”，不写性别、外貌、家族专名。
# 人物：格蕾塔·塔姆 greta_tamm（1540-12-07，女，romance.with = any，账房先生的女儿，用作废的货单教码头搬运工的孩子认数）。
#   各章年龄：C1—A2（1554-01—1556-11）她 13—15 岁；S 窗口起日 1556-12-08，她刚满 16（heart 选项要求双方 16—17）；
#   重逢 1563-03—07 她 22 岁、主角 22—23 岁（恋人落点要求双方满 18）。
