[[tracks.chapters.choices]]
key = "promise"
text = "约好往后的生意都先寄真样：他照验，我照付。"
requires = [{ kind = "bond", person = "naran_vaniya", level = "A" }]
hint = "往后的货都先寄真样——这是要守一辈子的约。你们的交情还盖不上这枚印；又或者，这一辈子的印，你已经盖在了别人的约上。"
reply = "他从怀里掏出账本，翻到第一页。那一页一直空着，他说是留给头一笔自己的生意的。他蘸了墨，先写下年月和我的名字，再一笔一笔写：往后货到坎贝，先寄真样，验过再谈价；一方照验，一方照付。写完，他在底下按了自己的印号，又拉过我的手，在印泥里按了按，把我的手印按在他的印号旁边。我说手印不算数。他说：“在坎贝，手印比印号还算数——印号能刻假的，手印刻不了。”东北风起来那天，他没来码头送我。船出了湾，我打开行李，发现他把那一页账抄了一份，塞在我的鞋里，纸角上又按了一个印。"
next = "done"
effects = [{ kind = "bond", person = "naran_vaniya", level = "S" }, { kind = "relation", person = "naran_vaniya", relation = "friends" }, { kind = "memory", memory = "mem-bond_naran_vaniya-s", title = "先给真样" }, { kind = "flag", flag = "c7_bond_naran_vaniya_promise" }, { kind = "start_track", track = "reunion_naran_vaniya" }]

[[tracks.chapters.choices]]
key = "heart"
text = "让手背上的印留着不洗，说等成年回来，再让他按一次。"
requires = [{ kind = "bond", person = "naran_vaniya", level = "A" }, { kind = "heart", person = "naran_vaniya", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "naran_vaniya", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "naran_vaniya" }]
hint = "手背上的印泥还凉着，“留着不洗”这句却说不出口：心里搁得还不够久；又或者，同样的话已经有人先听你说过了。"
reply = "他看着我的手背，半天没说话。印泥已经干了，那杆小秤歪在我的指节上面。“会蹭掉的。”他终于说。我说那就不让它蹭。他又说海上要洗手、要拉缆绳，我说那就少拉缆绳。他笑了一声，笑到一半停了，低头去看那枚铜印：“等你回来，我刻一枚新的。”开船那天他来了，一直站在跳板边上。临上船，他把那枚铜印塞进我手里，我刚握住，他又把它抽了回去：“不行，这个我还要用。”他的手却没有抽回去。我们就那么握着，一直握到船上的人第三次喊我。"
next = "done"
effects = [{ kind = "bond", person = "naran_vaniya", level = "S" }, { kind = "heart", person = "naran_vaniya", value = 12 }, { kind = "relation", person = "naran_vaniya", relation = "crush" }, { kind = "flag", flag = "c7_bond_naran_vaniya_romance" }, { kind = "memory", memory = "mem-bond_naran_vaniya-s", title = "先给真样" }, { kind = "start_track", track = "reunion_naran_vaniya" }]

[[tracks.chapters.choices]]
key = "own"
text = "跟他赌：五年之内，看谁的印号先出现在霍尔木兹的码头上。"
requires = []
reply = "“赌什么？”他问。我说赌一包最好的布。他把铜印在手心里掂了掂：“那你可要输一包好布了。我的布，霍尔木兹的人认得。”我说他们认得的是你爹的印号，不是你的。他的脸一下子拉了下来，伸出手：“五年。”我一掌拍上去，他反手攥住，攥得很紧，像是怕我反悔。正好潮水涨上来，漫过泥滩，把两个人的鞋都泡湿了。他低头看了看两双湿透的鞋，说这一湿，赌约就算立下了，这是坎贝的规矩。我说坎贝从来没这规矩。他说：“从今天起有了。”"
next = "done"
