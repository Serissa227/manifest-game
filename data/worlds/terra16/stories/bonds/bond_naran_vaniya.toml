# C1：1554 春。波斯买主看布，纳兰先拆自己的包。口头禅只在这里出现一次。
[[tracks.chapters]]
key = "c1"
title = "拆自己的包"
text = "一个波斯买主在坎贝的码头上看布，要二十包白棉布，赶在雨季以前随船回霍尔木兹。经纪行的学徒一拥而上，个个把最好的一匹摊在包顶，请他摸。纳兰不挤。他蹲下去，用小刀挑开自己那包的麻绳，从当中抽出一匹，抖开半截，指着一处给买主看：纬线在那里跳了两根，留下一道比指甲还细的疵。“这一包里，这样的有三匹。”旁边有人嗤了一声。我凑过去看了半天才看清，忍不住说：“你这是来卖布，还是来砸自己的摊子？”纳兰没理我。他从腰上抽出一根坎贝的量布尺，往桌上一横：“尺先给你，价再给我。”买主盯着那根尺看了一会儿，转过头，去看剩下的十九包。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "khambhat"
cast = ["naran_vaniya"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_cambay_broker_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "point_flaws"
text = "蹲下帮他拆剩下的包，把找得到的疵一处处指给买主看。"
requires = []
reply = "我拆得比他快，找出来的也比他多——第七包里有一块浆斑，连他都没看见。纳兰瞪着我：“你是来拆我台的？”买主却一处一处记在纸上，按疵点给每包定了价，二十包全订了。临走他又问我手里有没有布，跟我也订了五包。散场的时候，别的学徒都拿眼睛瞪纳兰，纳兰瞪的是我。"
next = "c2"
effects = [{ kind = "affinity", person = "naran_vaniya", value = 3 }, { kind = "skill", skill = "negotiation", value = 8 }]

[[tracks.chapters.choices]]
key = "hide_bad_bolt"
text = "趁他跟买主说话，把那匹有疵的塞回包底。"
requires = []
reply = "我刚把布塞进去，纳兰的手就伸进了包底，又把它抽了出来，当着买主的面抖开，冲我挑了挑眉。买主哈哈大笑，二十包全订了。散场后他把麻绳一圈一圈绕回去，说：“这一回算你输。下回再来。”我说下回我塞得快一点。他说：“下回我看得更快。”"
next = "c2"
effects = [{ kind = "affinity", person = "naran_vaniya", value = 2 }]

# C2：1554 雨季。坎贝的尺和葡萄牙人的尺。
[[tracks.chapters]]
key = "c2"
title = "两把尺"
text = "雨季一来，坎贝湾里的船都下了锚，码头上没有生意，只剩吵架。一个葡萄牙商人把一匹布摔在纳兰的摊子上，说短了一截，要退钱。纳兰把布扯开，拿自己那根码尺一尺一尺地量，量完了说：“够数，一指都不短。”葡萄牙人从袖子里抽出他们商馆的尺，也一尺一尺地量，量完了说：“短了。”城里这几年换了好几回管事的，葡萄牙人的商馆倒一直没换过，他们的尺也没换过。两个人各举着各的尺，在雨棚底下越吵越响，看热闹的脚夫围了一圈。纳兰的头巾湿透了，分不清是雨还是汗。他忽然一把拉住我的袖子，压低声音：“你去过他们的商馆。他们的尺，到底有多长？”"
