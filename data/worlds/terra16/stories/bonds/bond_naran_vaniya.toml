# A1：1556 春。马希河口，今天不谈价。
[[tracks.chapters]]
key = "a1"
title = "河口不谈价"
text = "傍晚纳兰来家学门口找我，说去马希河口走走。一路上他还是改不了：看见一船盐，说今年盐贱；看见卖椰子的，说那人多收了买主两个铜子；看见河堤上晒的渔网，估了估，说新的值多少，补过的值多少。走到河口，他自己也听不下去了，笑出声来：“今天不谈价。”堤上风大，他把头巾往下拉了拉，说起内地的一间织坊——他父亲带他去过一回，那里的老师傅肯收新来的孩子，从纺纱教起，一直教到织最细的布，教不会也不赶走。“那里织一匹布要三个月，”他说，“三个月，一个铜子都不算。”他说他想去那里待一年，不收布，只看人织。他说话的时候，河口的潮又涨上来了，漫过了堤脚的石头。他往我这边让了让。"
