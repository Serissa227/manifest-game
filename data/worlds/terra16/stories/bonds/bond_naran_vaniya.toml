[[tracks.chapters]]
key = "b2"
title = "涨潮的码头"
text = "坎贝湾的潮是出了名的：退的时候露出几里泥滩，涨的时候像一堵墙推过来，比马跑得还快。那天下午码头上的锣敲得不对，泥滩边上堆货的人全在喊。纳兰头一回用自己的名义收了八包布，包上盖着他自己拿木头削的印号——一杆小秤，行会还没认，他先按上了。那八包就码在泥滩边上，离水最近。我的十包也在那里，隔着两步远。远处的水线已经白了，潮声一阵紧过一阵。他看了我一眼，没说话。我也没说话。两个人站在两堆货中间，都在算：先拖谁的。“你看什么？”他终于开口，嗓子是哑的，“快拖啊！”"
