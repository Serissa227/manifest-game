# B1：1554 秋冬。家学比本事，纳兰赢了；床底下那匹缩水的布。秘密只在这里撞破，永不进见闻。
[[tracks.chapters]]
key = "b1"
title = "缩水的那一批"
text = "家学请来教汇兑的拉迪卡出了个题目：每人领一笔一样的本钱，自己去买布、自己去卖，年底看谁的钱多，赢的人本钱和赚头都归自己。账一摊开，纳兰赢了，赢得漂亮，拉迪卡当着全家学的面夸了他两句。那天傍晚我去他住处还算盘，算盘滚进了床底。我趴下去摸，摸出来一匹布：洗过了，皱成一团，比该有的长短少了将近一成。布头上拴着货栈的签子，日子是七月——是他背着家里做的那笔小买卖，夏天跟我吹过一回，后来再没提。这批布要是都缩成这样，他赔进去的，差不多正是今天赢来的数。门响了。纳兰站在门口，脸一下子白了。我说：“算盘滚进去了。”他没问我看见了什么，只把门在身后关上。“别告诉我爹。”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "khambhat"
cast = ["naran_vaniya"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

