# A2：1556 雨季。缩水布拆成线，织成腰带。赠礼 woven_band。
[[tracks.chapters]]
key = "a2"
title = "缩水布拆出的腰带"
text = "一个下雨的下午，纳兰夹着一个油纸包来找我，在家学的廊下打开：是一条腰带，三指宽，白底上走着一红一蓝两道线。“你认得这白的。”他说。我认得。是床底下那匹缩水的布——他把它一根一根拆成了线，跟他母亲学着在腰机上重新织了起来。他说红的那一道是他母亲旧纱丽上拆下来的，蓝的那一道是他外婆的，两个人都不肯给，他磨了半个月。“赔钱的布，也得有个去处。”他不等我开口，就把腰带往我腰上一绕，打了个结，太紧；解开重系，又太松。廊外的雨下得哗哗响，他低着头跟那个结较劲，耳朵一点一点红了。"
