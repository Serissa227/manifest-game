# 拆自己的包（bond_naran_vaniya / reunion_naran_vaniya）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用两条轨道 key、章节 key、地点、窗口与 C1 标题。
# 标签：any（纳兰 romance.with = any；主角是自创的坎贝经纪人家学生 custom_cambay_broker，性别由玩家定——男主角时是 BL，女主角时是 BG）。
# 人物：纳兰·瓦尼亚 naran_vaniya（1540-07-01，男，坎贝棉布经纪人家的学徒，守戒人家）；主角 custom_cambay_broker（模板生年 1540-01-01）。
#       学院期 1554-01—1556-12：主角 14—16 岁，纳兰 13—16 岁（A1 时纳兰 15，1556-07-01 满 16）。
#       S 的 heart 选项要求双方 16—17：1556-12 主角 16、纳兰 16，可行；重逢 1562 年双方 21—22 岁，恋人效果合法。
# 依据：
#   史实——坎贝湾的大潮（涨潮时潮头成墙，退潮露出几里泥滩）、马希河在坎贝附近入湾；坎贝的棉布、玛瑙珠与往霍尔木兹的生意；
#         葡萄牙人在坎贝设商馆、发“通行证”；古吉拉特苏丹国这几年贵族互斗（正文只写“城里换了好几回管事的”）；腰机织带。
#   原创——纳兰一家、他的印号（一杆小秤，秤盘里一朵棉花）、波斯与亚美尼亚买主、量布的争执、缩水布与它拆出的腰带、家学的比本事、各处对白。
#   尺：坎贝的码尺与葡萄牙人的尺长短不同是寻常的事，“差了两指宽”是本线的写法，不指具体的度量史料。
# 秘密：纳兰背着父亲买进过一批会缩水的棉布、赔了钱，用家学比本事赢来的钱补上（B1 撞破）。永远不进见闻；本文件的羁绊章没有 stage，不写 news。
#   B1 的打赌选项里他只跟父亲说了“赔了钱”，没说是看走了眼买了缩水布——所以 A1 的“替他瞒着缩水布的事”对两种走法都说得通；重逢时他已全说了。
# 缺省走向：玩家什么都不选时，C1—A2 按 default 走完（无效果），S 的 default 开启重逢并设 _parted；
#   1562 年玩家不到坎贝，重逢的 default 是纳兰的一封来信（随信一块布样，布角盖着他的印号，旁边留着能按另一个印的地方）。
# 羁绊阶梯：C2 to_the_factory → C；B1 keep_and_lend → C（补签）；B2 save_his_first → B；A1 keep_his_secret → B（补签）；
#   A2 wear_it / tie_it_again → A + woven_band + 回忆；S promise / heart → S。
# 心动：A1 talk_other_things +6 → A2 tie_it_again +6（要 ≥ 6）→ S heart +12（要 ≥ 12）= 24，正好够重逢 love（≥ 24）。
#   简报原本的决定表写 S +10，算下来只有 22，到不了 24；这里照简报改为 +12。
# 设旗标：c7_bond_naran_vaniya_promise / _romance / _own / _parted（S）；_landing_friend / _landing_rival / _landing_love / _missed（重逢）。
#   重逢正文 variants 读 _own（当年的赌）与 _romance（手背上的印）。不读外部旗标；set_on_s_promise_or_heart 为空（纳兰没有配角线的恋人）。
# 整合：cast 里纳兰的日程写 at = "cambay"，本线的 at 是地点 key "khambhat"；若 cambay 不是同一地点的 key，日程需改指 khambhat。
#   本线不需要改日程；A2 的赠礼 woven_band 与塔拉的线共用（这里写成缩水布拆的线织的）。

