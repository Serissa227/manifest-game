# S：1556 年腊月。家里的船要出海，他的印号刻好了，按在我的手背上。
[[tracks.chapters]]
key = "s"
title = "先给真样"
text = "腊月，家里的船要趁东北风出海，去霍尔木兹，我跟船走。纳兰留下，跟他父亲的老主顾学做独立的经纪。开船前三天，他到码头上找我，手心里攥着一枚铜印。印面刻好了，是一杆小秤，秤盘里一朵棉花，行会上个月认了它。他往印泥里按了按，拉过我的手，在我手背上盖了一下。“以后你有货要卖到坎贝，”他说，“先寄真样来。我照验——是朋友，也照验。”我说：“你验得那么狠，谁还敢寄？”“敢寄的，才是我的主顾。”印泥是凉的。他的手按在我手背上，没有马上拿开，比那枚印还烫。码头那头有人在喊装货，他像是没听见。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "khambhat"
cast = ["naran_vaniya"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

