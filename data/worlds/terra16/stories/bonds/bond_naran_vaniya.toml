# 重逢：1562 年坎贝。一排布包盖着他的印号，他父亲坐在一边喝茶。
[[tracks.chapters]]
key = "reunion"
title = "自己的印号"
text = "五年多以后，我回到坎贝。潮水正退，码头上一排布包码得整整齐齐，每一包的麻布上都盖着同一个印号：一杆小秤，秤盘里一朵棉花。他父亲坐在货栈门口的凳子上，端着一碗茶，看他儿子验布。缩水布的事，纳兰到底全说了；他父亲还是让他自立了门户，只是每个月来坐一回，一句话不说，喝完茶就走。纳兰正在给一个亚美尼亚买主拆包。他照旧先拆自己的，从当中抽出一匹，抖开，找疵。抬头看见我，他手上停了一下，然后把那根量布尺往桌上一横——还没开口，自己先笑了。“你晚了，”他说，“我等着看你的货，等了一个雨季。”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "khambhat"
cast = ["naran_vaniya"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "naran_vaniya", text = "今年的货，我照旧先拆了自己的包。有个亚美尼亚买主跟我说，他在霍尔木兹的码头上见过一个人，验布的手法跟坎贝的一模一样，问是不是我的徒弟。我说不是。我自立门户了。缩水布的事，我跟我爹说了，从七月买进那批布说起，一直说到床底下。他听完没打我，只问那批布后来怎么样了。我说拆了，织了一条腰带。他问值多少钱。我说不卖。他就没再问。如今他每个月来货栈坐一回，喝一碗茶，看我验布，一句话不说，喝完就走。这一年我在码头上等了一个雨季，又等了一个旱季，你家的船没有来。拉迪卡说你们改走了别的港口，也许明年。随信寄一块布样，是今年最好的一批。布角上盖着我的印号，旁边那块我没盖——量过了，正好按得下另一个印。你回来的时候，把你的带上。真样我先给了。价，等你来了再谈。纳兰" }, { kind = "flag", flag = "c7_bond_naran_vaniya_missed" }]

