# B1：1554 秋冬，码头边晒网的空地。物件：糙纸订的识字课本。“我”的顺口溜。
[[tracks.chapters]]
key = "b1"
title = "船户的课本"
text = "入秋，许采拿糙纸订了个本子，封面上一个字也没写。她说码头上的船户签契约只会按手印，借了多少、该还多少，全凭牙人一张嘴。“先教五个字：船、货、钱、借、还。”散学后，她在码头边晒网的空地上摆一张小板凳，教船户家的孩子写。孩子们握笔像握鱼叉，一个“借”字写得四分五裂。我蹲在旁边看了半天，实在忍不住，拿闽南话念了一句：“借字一个人，企在旧日边；今日借来的，明日着还钱。”孩子们先是愣，接着笑得前仰后合，一边笑一边跟着念，念到第三遍，全记住了，比她教了一下午的还快。许采站在板凳后头，手里捏着那本糙纸本子，看了我很久，一句话也没说。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "yuegang"
cast = ["xu_cai"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

