# C2：1554 夏，县里来人查学生。物件：点名簿。她推开后窗，事后低声提醒两处小习惯（只写动作，不写她知道什么）。
[[tracks.chapters]]
key = "c2"
title = "推开的窗"
text = "六月里县里来了人，说要查社学的学生，站在门外捧着点名簿，一个一个点。我那时在后院打水，桶刚提到井沿上，就听见前头喊：“林——”我手一松，桶又掉回井里。靠后院的那扇窗“吱呀”一声推开了。许采探出半个身子，冲我摆手，压着嗓子：“就在这儿应。”我隔着窗应了一声“到”。门外的人探头往里看：“哪一个？怎么从后头应？”“后院的井要人看着，”许采说，“前些天掉进去一只鸡。”来人在簿子上勾了一笔，走了。等脚步声出了巷子，她还站在窗边：“你应名字，总先‘哎’一声，再应‘到’。这里的人不这么应。”停了停，又说：“写字的时候，小指别翘着。”说完把窗关上，回屋去了。井绳还在我手里，桶在井底，满满一桶水。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "yuegang"
cast = ["xu_cai"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

