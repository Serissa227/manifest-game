# A1：1556 春，晚归。物件：只烧了一半油的灯。心动 +6 不要求已有心动。
[[tracks.chapters]]
key = "a1"
title = "灯留一半"
text = "开春以后，我常替家里去码头看货，回来时天早黑透了。巷口那棵老榕树，阿嬷讲夜里树底下站着个没脚的，我回回都是一路小跑过去。那天跑过社学门口，看见学堂里还亮着一盏灯。许采坐在灯下抄书，听见门响也没抬头。“这么晚还不回去？”“灯油只烧了一半，”她说，“另一半是留着的。”留给谁，她没说，蘸了蘸墨，接着抄。我把上回借的一沓纸还给她。灯芯结了花，火苗一跳一跳的，我顺手拿剪子剪短一截，屋里一下亮了些。我又从怀里摸出一只小油壶——船上顺来的，本想带回家夜里看账用。她看看那只油壶，又看看我，笑了，把自己的书往旁边挪了挪，让出半张桌子。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "yuegang"
cast = ["xu_cai"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

