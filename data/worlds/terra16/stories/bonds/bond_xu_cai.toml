text = "七月搜港，林家的船烧了，烧得只剩一截龙骨泡在水里。回到社学，同窗看我的眼神都变了：有人躲着我走，有人在背后嘀咕林家是不是通了海寇。九月头一天，许采来得比谁都早。她从袖子里抽出一片压平的芦叶，裁成窄窄的一条，叶脉还看得清。“江边采的，压了一个夏天。我们读书社的，一人一片，书就不用折角了。”她翻开我的课本，一页一页往后翻，翻到中间停住——那一页我抄错得最多，墨团一块挨着一块。她把书签夹进去，按平：“从这里接着学。”她的手压在那页纸上，压了好一会儿，才拿开。"
