# B2：1555 秋，倭寇流窜到南京城外的消息传来，社学停课，先生病倒。物件：从漳州城里抓来的药。
[[tracks.chapters]]
key = "b2"
title = "父亲的药"
text = "那年秋天，北边来的船带回消息，说有一伙倭寇一路流窜，打到了南京城外。社学停了几天课。先生——许采的父亲——就在那几天病倒了，咳得整夜睡不着。许采一个人守着，白天抄书，夜里煎药。我搭家里的船去了一趟漳州城，郎中把三帖药包好递给我：“一日一帖，吃完不见好，再来。”我用油纸裹了两层揣在怀里，一路怕它受潮。进她家院子时，天已经黑了。药炉上的罐子咕嘟咕嘟响，许采坐在炉边的小凳上睡着了，头抵着墙。她手里还捏着一支笔，膝上摊着一页纸，抄到一半，最后一个字只写了一横。里屋的先生咳了一阵，哑着嗓子叫：“采儿？”她眉头皱了一下，没醒。我隔着门帘应了一声：“先生，药快好了。”"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "yuegang"
cast = ["xu_cai"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

