reply = "她把课本推过来，翻到扉页。扉页上一个字也没有，纸色比里头的新——她换过，大概不止一回。我提起笔，一笔一画写得很慢，写到最后一笔，手腕往下一沉，停一下，再走，像她当年教我的那样。写完，一笔也没拖出去。我把笔递给她。她接过去，在我的名字旁边写下“许采”两个字，和我的并排，挨得很近。墨还没干，她没去吹。天妃宫那边敲起了晚钟。她放下笔，隔着桌子凑过来，吻了我。钟一下一下地敲，敲到第七下，她才退回去，脸红到耳根，说话还是那副不声张的样子：“这一页，往后谁也不许撕。”"
next = "done"
effects = [{ kind = "affinity", person = "xu_cai", value = 5 }, { kind = "relation", person = "xu_cai", relation = "lovers" }, { kind = "flag", flag = "c7_bond_xu_cai_landing_love" }, { kind = "memory", memory = "mem-reunion_xu_cai", title = "教船户识字的人" }]

[[tracks.chapters.variants]]
key = "duo_kept"
when = [{ kind = "flag", flag = "c7_wandeng_unmasked_kept" }, { kind = "flag", flag = "c7_pair_xu_cai_xiao_man_together" }]
text = "隔了十年，我的船又进了月港。海禁刚开，港里的船比从前多了一倍。我打听许家，茶摊上的人往天妃宫那边一指：“教读家的女儿，在宫边上借了间屋，教船户认字，不收钱。”屋子很小，门口摆着一排草鞋，门外江边系着一条渔船，船主是从前在天妃宫前卖符的那个姑娘，蹲在船头等她下课，时不时往屋里看一眼。屋里坐着十几个人，膝上都摊着同一本册子——那本识字课本编完了，一百多个字，每个字底下一句顺口溜。许采念一个“借”，一屋子人跟着嚷：“借字一个人，企在旧日边！”有一大半是我当年胡诌的。她抬起头，放下戒尺，看着我叫了一声：“林兄。”叫完自己先笑了：“这个称呼，我替你守了十来年，现在不用守了。”然后才问：“你在海上，有没有人欺负你不识字？”"

