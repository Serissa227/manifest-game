# C1：1554 春，社学开课。物件：多抄的那张单页。口头禅原句只在这里出现。
[[tracks.chapters]]
key = "c1"
title = "多一份纸"
text = "开课头一天，先生的女儿许采抱着一摞课本挨桌发。课本是她自己抄的《三字经》，纸上的墨味还没散。发到我这一桌，她放下一份，又从底下抽出一张单页，压在上头。“这是什么？”“多的。怕有人忘带。”她说完就往下一桌去了。点名簿传到我手上，要学生自己写名字。我提笔写“林”字，最后一捺收不住，一路拖出格子，把下一个人的地方也占了。后排有人笑出声。我正要拿袖子去擦，许采走回来，按住簿子的一角，不让我擦。她低头看了那一捺好一会儿，轻声说：“先把自己的名字写会，别人就骗不了你一半。”她把自己那支刚洗过的笔搁在我砚台边上，笔杆还是湿的。"
window = [[1554, 1, 1], [1554, 4, 30]]
