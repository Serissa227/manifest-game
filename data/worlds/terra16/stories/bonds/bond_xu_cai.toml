text = "隔了十年，我的船又进了月港。海禁刚开，港里的船比从前多了一倍，桅杆挤得像一片竹林。我打听许家，茶摊上的人往天妃宫那边一指：“教读家的女儿啊，在宫边上借了一间屋，教船户认字，不收钱。”屋子很小，门口摆着一排草鞋。里头坐着十几个人，膝上都摊着同一本册子——那本识字课本编完了，一百多个字，用麻线订得结结实实，每个字底下一句顺口溜。许采念一个“借”，一屋子人跟着嚷：“借字一个人，企在旧日边！”有一大半是我当年在晒网的空地上胡诌的。她听见门响，抬起头，放下戒尺，看着我叫了一声：“林兄。”叫完自己先笑了：“这个称呼，我替你守了十来年，现在不用守了。”然后才问：“你在海上，有没有人欺负你不识字？”"

