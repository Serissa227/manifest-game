text = "年底，先生把点名簿收进书箱，说开春就不点我的名了。开春以后，我要带着家里剩下的最后一条鸟船出海；许采留在月港，接着编她那本识字课本，已经编到第六十个字。她递过来一张裁好的纸：“写个门牌。往后写信，不用再借课本的由头了。”我趴在桌上写：月港，林家，后巷弟三户，船不在就交隔壁阿伯。写完推给她。她看了一遍，拿起我的笔，在“弟”字头上添了个竹字头。往常她借我的笔，我总催她快还。这回我没催。她把纸转过去，在我那一行底下，一笔一笔，把她自己的门牌也补了进去。"
