# B2：1555。工钱簿被主人摔在泥地上，她拿来找我。
[[tracks.chapters]]
key = "b2"
title = "工钱簿"
text = "这一年塔拉开始记一本工钱簿。本子是拿旧账本拆了重订的，每一页竖着画五栏：烧石头、敲坯、磨圆、打眼、抛光。每一栏底下写着谁做、一天做多少、拿多少，最后还有一栏，是她自己算的“该拿多少”。她记了大半年，记满了三十几页，字越写越小。秋天的一个下午，作坊主人在库房里翻到了这本子。他站在院子当中一页一页地翻，翻到“该拿多少”那一栏，脸色就变了，手一扬，本子摔在泥地上，散开了半边。“工钱是行里几辈子的老规矩，”他说，“轮得到你一个丫头来算？”塔拉没吭声，蹲下去把本子捡起来，用袖子一点一点擦掉泥。傍晚她来家学找我，把本子往我桌上一放，封皮上还印着半个鞋印。“你是经纪人家的。”她说，“你算出来的数，他们肯听。”"
