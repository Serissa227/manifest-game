requires = []
reply = "主人数到她那一串，数了两遍，脸沉下来：“九十八。”她只说：“是九十八。”等人散了，我在门口找到她。她靠在门框上，把手从口袋里掏出来，摊开。那颗珠子躺在她手心，裂纹从孔边斜着劈下去，像一道小闪电。“这一颗是我打坏的。”她说，“拣一颗补上，客人多付一颗的钱，磨那颗散珠的人白磨一回。凭什么？”我说作坊里人人都这么干。“那就让他们干。”她把手合上，又揣回口袋，“我的账上，没有这一颗。”"
