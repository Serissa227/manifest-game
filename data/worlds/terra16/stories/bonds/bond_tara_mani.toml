# A1：1556 春。霍尔木兹外海天亮前的颜色，窗台上一排珠子挪了一下午。
[[tracks.chapters]]
key = "a1"
title = "给颜色起名字"
text = "开春以后，塔拉问我在海上见过什么颜色。“叫不出名字的那种。”我想了半天，说有一年跟家里的船去霍尔木兹，在外海等潮，天快亮的时候，海是一种又绿又灰的颜色，像……我像不出来。她没追问，起身从柜子里翻出一只木匣，倒出十几颗珠子，在窗台上排成一排：玉髓、绿松石、一颗磨得很薄的蛇纹石、几颗威尼斯的玻璃珠。“哪一颗？”我挨个看过去：“都不是。”她就把珠子一颗一颗地挪，挪到太阳底下，挪进阴影里，挪到窗棂的缝里，每挪一回问我一句。挪了一整个下午，没有一颗对得上。我说算了吧，那颜色也许只有海上才有。她把下巴搁在窗台上，眼睛跟珠子一般高：“那就等。等它自己出来。”"
