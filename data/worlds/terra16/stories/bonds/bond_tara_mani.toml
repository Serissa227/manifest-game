# C1：1554 春。作坊门口的一根样线，我挑了一颗灰的。口头禅只在这里出现一次。
[[tracks.chapters]]
key = "c1"
title = "一根样线"
text = "家学放半天假，我抄近路穿过珠匠街，被一根线拦住了去路。塔拉·玛尼坐在她家作坊的门槛上，两手各捏着线的一头，线上穿着三十几颗珠子，没有两颗一样：霍尔木兹来的青金石，马六甲来的锡灰小珠，威尼斯的玻璃珠里裹着一缕一缕白花，还有坎贝自己的红玉髓，红得像嚼过槟榔的嘴。“经纪人家的，”她冲我扬扬下巴，“你们天天挑石头，挑一颗给我看看眼光。”我顺着线摸过去，停在一颗灰扑扑的小珠上，不亮也不透，夹在两颗红的中间，像一片屋瓦。“这颗。别的是摆给客人看的，这颗是你给自己留的。”她愣了一下，笑出声来：“这颗最难磨圆，我磨坏了七颗，才成了这一颗。”她把灰珠捏起来，举到太阳底下，日光从珠孔里穿过去，在她指头上落下一个小亮点。“颜色有名字，工钱也该有。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "khambhat"
cast = ["tara_mani"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_cambay_broker_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

