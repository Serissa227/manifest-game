# 一根样线（bond_tara_mani / reunion_tara_mani）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用两条轨道 key、章节 key、地点、窗口、重逢年份与 C1 标题。
# 标签：any（塔拉 romance.with = any；主角是自创的坎贝经纪人家学生 custom_cambay_broker，性别由玩家定——女主角时是 GL，男主角时是 BG）。
# 人物：塔拉·玛尼 tara_mani（1540-08-04，女，坎贝玛瑙珠匠家的女儿）；主角 custom_cambay_broker（模板生年 1540-01-01）。
#       学院期 1554-01—1556-12：主角 14—16 岁，塔拉 13—16 岁（1556-08-04 满 16）。
#       S 的 heart 选项要求双方 16—17：1556-12 主角 16、塔拉 16，可行；只到牵手。重逢 1563 年双方 22—23 岁，恋人效果合法。
# 依据：
#   史实——坎贝的玛瑙与红玉髓珠：石料从内地矿上运来，装陶罐埋在牛粪火里烧一夜变红，再敲坯、磨圆、用弓钻打眼、抛光，
#         每道工序是不同的匠人；坎贝的珠子经霍尔木兹卖到波斯，波斯人看重红玉髓；威尼斯玻璃珠、青金石、马六甲的锡在印度洋各港流通；
#         古吉拉特的腰机织带、靛青与茜草染。
#   原创——塔拉一家、烧石头的戈文德与钻孔的苏莱曼、作坊主人、设拉子客人的九十九颗念珠、工钱簿、各颜色的名字、各处对白。
#   工钱的铜子数（一天三个、四个）是本线的写法，不指具体的工价史料。
# 秘密：塔拉留着一颗打眼时裂了的红玉髓，不肯算进客人的账（B1 主角看见）。永远不进见闻；本文件的羁绊章没有 stage，不写 news。
# 缺省走向：玩家什么都不选时，C1—A2 按 default 走完（无效果），S 的 default 开启重逢并设 _parted；
#   1563 年玩家不到坎贝，重逢的 default 是塔拉的一封来信，随信一颗用玩家走过的港命名的珠子。
# 羁绊阶梯：C2 write_his_wage → C；B1 give_your_bead → C（补签）；B2 make_numbers_hold → B；A1 keep_the_cracked → B（补签）；
#   A2 wear_band / find_your_color → A + woven_band + 回忆；S promise / heart → S。
# 心动：A1 wait_together +6 → A2 find_your_color +6（要 ≥ 6）→ S heart +12（要 ≥ 12）= 24，正好够重逢 love（≥ 24）。
#   决定表原写 S +10，算下来只有 22，到不了 24；照简报改为 +12。
# 设旗标：c7_bond_tara_mani_promise / _romance / _own / _parted（S）；_landing_friend / _landing_love / _missed（重逢）；
#   c7_tie_new_tara_mani_khadija_rihla_taken（S 的 promise 与 heart；配角线 tie_new_tara_mani_khadija_rihla 据此改走“并肩的朋友”）；
#   本文件自用的 c7_bond_tara_mani_bead_kept（A1 keep_the_cracked 设，A2 的变体读：裂珠在主角手里时，腰带上那颗是她借回去缀上的）。
# 与纳兰线的分工：两条线的 A2 赠礼都是 woven_band；纳兰那条写缩水布拆的线、母亲与外婆的旧纱丽，这里写靛青底、茜草红、缀满各港珠样，不重复。
# 整合：cast 里塔拉的日程写 at = "cambay"，本线的 at 是地点 key "khambhat"；若两者不是同一地点，日程需改指 khambhat。本线不需要改日程。

