# A2：1556 雨季末。缀满各港珠样的腰带，正中是那颗裂珠。赠礼 woven_band。
[[tracks.chapters]]
key = "a2"
title = "缀满珠样的腰带"
text = "雨季快过完的时候，塔拉来家学找我，手里攥着一卷东西，进门就往我腰上比。是一条窄窄的腰带，她在姑妈的腰机上织的：靛青的底子，走着一道茜草红，那道红她染了三回才匀。腰带的一边用细线缀着一排小珠子，一颗挨一颗：一颗青金石，是霍尔木兹；一颗锡灰的小珠，是马六甲；一颗裹着白花的玻璃珠，是威尼斯；一颗坎贝的红玉髓；还有一颗又绿又灰的蛇纹石，磨得很薄。正中间那一颗，孔边带着一道裂——是那年冬天比试时她打坏的那一颗。“别动。”她绕到我身后，把腰带在我腰上系了个结，拽了拽，又绕回来，退后一步看。“你走到哪个港，”她说，“就把那个港的珠子摸一摸。”"
