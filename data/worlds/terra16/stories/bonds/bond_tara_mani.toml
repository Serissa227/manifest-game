# 重逢：1563 年坎贝。作坊门口的工钱木板；两根穿满的线并在桌上。
[[tracks.chapters]]
key = "reunion"
title = "并在桌上的两根线"
text = "六年多以后，我回到坎贝。还没走到珠匠街，就看见塔拉家作坊门口钉着一块木板，上面用炭笔写得密密麻麻：烧石头的一天几个铜子，敲坯的几个，磨圆的几个，打眼的几个，抛光的几个。字是她的字，有几处让雨淋花了，又描过。两个挑担的珠匠从板子前走过，一个指着念：“抛光的，五个。”另一个点点头。塔拉坐在门里打眼，弓弦一推一拉。她抬头看见我，手停了，钻头还插在珠子里。她没站起来，也没说话，先朝我伸出一只手，掌心向上。我把那根线从怀里掏出来，放在她桌上。线已经穿满了，从头到尾，每一颗旁边都拴着一张小纸条，有的泡过海水，字都晕开了。她低头看着，半晌没动，然后转身从柜子里拿出另一根线，穿满了她这几年磨出的新颜色，放在我那根旁边：“对一对。”两根线并排躺在桌上，有好几颗，一模一样。"
