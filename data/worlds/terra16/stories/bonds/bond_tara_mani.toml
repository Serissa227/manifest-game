reply = "“裂的你最喜欢？”她眯起眼睛，像在验一颗来路不明的石头，“裂的最不值钱。”我说因为它是你的。她没接话，转过身去理腰机上剩下的线头。那一把线头本来就不乱，她理了很久，理到廊下的雨停了，还没理好。我系着腰带出了门，走出老远回头看，她还低着头在理。"
