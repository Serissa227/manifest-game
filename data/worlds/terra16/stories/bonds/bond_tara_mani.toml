text = "问她：这条腰带，每道工序该算多少工钱？"
requires = []
reply = "她真的算了。蹲在廊下，拿炭笔在地砖上一项一项列：纺线几天，染三回几天，上机几天，给那几颗珠子打眼几天，照坎贝珠匠的价乘出来。最后那个数吓了我一跳，够买小半船棉布。她拍拍手上的炭灰站起来：“这一条，工钱算你欠我的。”我问什么时候还。“慢慢还。”她伸手到我背后，把结解开，腰带抽回去，系在了她自己腰上，“还清以前，它先押在我这儿。”"
