key = "write_his_wage"
text = "蹲下问戈文德一天烧几罐、拿多少钱，替塔拉记在本子上。"
requires = [{ kind = "affinity", person = "tara_mani", ge = 20 }]
hint = "她还不知道你肯不肯在牛粪火边蹲上一整天。这时候掏出本子，她只当你是来看稀奇的。"
reply = "戈文德起先不肯说，说经纪人家的孩子问工钱，准没好事。我在坑边蹲到晌午，帮他勾了两罐，手背上也烫起一个泡，他才开口：一天七罐，三个铜子，雨大开不了火的日子没有。我用炭笔一笔一笔记下，回家学的路上又算了一遍——他烧一年，买不起一串他烧的珠子。我把本子递给塔拉。她盯着那个数看了很久：“这个数我早就想记下来。一个人记，记不完。”她把那一页折了个角，把本子还给我，“下回你带两支炭笔。”"
next = "b1"
effects = [{ kind = "affinity", person = "tara_mani", value = 2 }, { kind = "bond", person = "tara_mani", level = "C" }]

[[tracks.chapters.choices]]
key = "hold_the_stone"
text = "接过那块烫手的石头，攥紧了不放，等它自己凉下来。"
requires = []
reply = "石头比我想的烫得多。我咬着牙攥着，掌心先是疼，后来是麻。塔拉一把掰开我的手指，骂了声“傻子”，拖着我到水缸边，一瓢一瓢往我手上浇凉水。等石头凉透了，搁在缸沿上，是一种我从没见过的红：背着光发紫，迎着光又透出一点橙。她看看石头，又看看我烫红的掌心：“这个红，就叫‘你的手’。”戈文德在后头笑出了声。"
next = "b1"
effects = [{ kind = "affinity", person = "tara_mani", value = 3 }]

# B1：1554 冬。家学比试配念珠，她打坏了最后一颗，揣进了自己的口袋。秘密在这里被我看见，永不进见闻。
[[tracks.chapters]]
key = "b1"
title = "打坏的那一颗"
text = "冬天家学的比试，题目是作坊主人出的：一个设拉子来的客人要一串九十九颗的红玉髓念珠，颗颗要匀，谁配得又好又快，这桩生意就记在谁的名下。我和塔拉隔着一张长桌各坐一头，面前各摊一堆坯子，打眼的弓钻吱吱地响。太阳偏西时，她已经穿好了九十八颗，正给最后一颗打眼。我抬头看她，正看见她手里的钻头一歪，那颗珠子“嗒”的一声，从孔边裂到了腰上。她的手抖了一下，把裂珠攥进了手心。按作坊的老规矩，打坏一颗，就从库里的散珠中拣一颗补上，算作损耗，记进客人的账。散珠的盒子就在她手边，盒盖开着。她看了一眼，没伸手，把裂珠揣进自己的口袋，给九十八颗的那一串打了结，搁在桌边。主人从长桌那头一串一串数过来，离她还隔着三个座位。“少一颗，”我压低声音，“你不补？”她没回头：“我知道。”"
