# C2：1554 雨季。作坊后院开罐，灰石头烧成了红的；烧石头的老人一天的工钱。
[[tracks.chapters]]
key = "c2"
title = "烧红的石头"
text = "雨季的头一场雨下了三天，第四天放晴，塔拉一早就在家学门口喊我：“今天开罐，你来不来？”作坊后院挖着一排浅坑，坑里闷了一夜的牛粪火只剩一层灰白，看不见火苗。烧石头的老人叫戈文德，蹲在坑边，用一根弯铁钩把陶罐一只一只勾出来，敲开封口的泥。罐里是从内地矿上运来的玛瑙坯，进罐时灰白、土黄，像河滩上随手捡的石子；倒出来滚在湿地上，冒着白气，一块块红得发暗。戈文德两只手背上全是烫疤，一层压着一层，发亮。塔拉蹲在他旁边，压低了声音：“他烧一整天，挣的钱还买不起一颗他自己烧红的珠子。”说完她从地上捡起一块刚扒出来的石头，在两只手之间倒来倒去，吹了两口，递给我：“摸摸，还烫。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "khambhat"
cast = ["tara_mani"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

