reply = "她看了我一眼，把钻头从那颗珠子里拔出来，换上一块新坯。最后那一颗，她磨了三天。三天里我就坐在作坊门口，替她看着那块木板，有珠匠来问工钱，我照着板子念给他们听，念错了一回，被戈文德骂了。第三天傍晚她叫我进去，摊开手：一颗小小的珠子，颜色说不上来，有一点像霍尔木兹外海天亮前的那种灰绿，又透着一点坎贝的红。她把它穿在我那根线的尽头，打了个结。我问它叫什么。“你回来的那天。”她说完，凑过来吻了我。弓钻还搁在桌上，门外有人在念板子上的数，念错了一个，她没去管。"
