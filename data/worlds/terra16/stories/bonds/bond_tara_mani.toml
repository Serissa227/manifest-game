# S：1556 年 12 月。我随家里的船出海，她留在坎贝。一根没穿珠子的新线，线头一个结。
[[tracks.chapters]]
key = "s"
title = "一港一颗"
text = "年底，家里的船要趁东北风出海往霍尔木兹去，我跟船走。塔拉不走，她要留在坎贝接着记她的工钱簿——作坊里已经有七个人肯把自己的数报给她了。开船前两天，她到码头上找我，手里拿着一根线。是一根新的样线，棉的，捻得很紧，上面一颗珠子也没有，只在线头上打了一个结。“你拿着。”她把线绕在我的手指上，绕了三圈，“你每到一个港，就去找当地做珠子的人，问他们那里的珠子怎么做，一道工序多少工钱。问清楚了，寄一颗回来。”她顿了一下，捏了捏线头上那个结，“要有名字的。”码头上在装货，脚夫扛着棉包从我们身边挤过去。她没让开，就站在那里，等我说话。"
