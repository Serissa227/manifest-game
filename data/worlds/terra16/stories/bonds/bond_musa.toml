# 笑话先下去（bond_musa）——羁绊线，标签 BL；穆萨纯 BL，与男主角塔里克可走恋爱落点。C1 C2 B1 B2 A1 A2 S + 主线重逢 reunion_musa。
# 人物：穆萨（musa，1540-05-04 生），非斯寻宝行会“领事”的儿子，塔里克的损友；口头禅“这回真有宝，至少有我。”只在 C1 用一次。
#       塔里克·加尔纳蒂（tariq，1540-01-02 生），主角，“我”；1554 年随萨拉赫·雷斯的军队到非斯，留在卡拉维因读书；“只劫货，不劫人”只在 S 用一次。
#       年龄：A1（1556-01-28..02-06）塔里克 16、穆萨 15；A2 起两人都满 16；S（1556-12）两人 16；重逢 1561 年两人 21。
#       学院期最多到心照不宣：A1 heart +6、A2 heart +6（要已有 6）、S heart +12 与 crush（要已有 12，双方 16—17，只到拥抱）；恋人只在重逢，要 romance 旗标、heart ≥ 24、双方 ≥ 18。
# 依据（史实）：1554 年 1 月萨拉赫·雷斯率阿尔及尔的奥斯曼军队护送瓦塔斯的阿布·哈松进非斯，城中遭劫；同年 9 月萨阿德的穆罕默德·谢赫夺回非斯。
#       非斯城外约一日路程有古罗马城瓦利利的废墟；巴布·富图赫是老城东门；犹太区（梅拉）在新城；先知诞辰夜城里点大蜡烛（日期用学院校历的 1556-02-04 前后）。
#       北非用的纸多从意大利进口，纸里有水印。
# 原创：寻宝行会与“领事”、塌了半边的宅子、独眼老乞丐的假图、瓦利利的地窖与半壶油的灯、烧糊的塔吉、木雕海鸥、账簿上的“先欠着”。
# 待核：瓦利利废墟里是否真有可下的地窖（写成行会的传说）；非斯先知诞辰抬大蜡烛的规模在十六世纪中叶是否已如此（写成城里的风俗，不写年代）。
# 缺省走向：C1—A2 的 default 只往下走、不加数值（无人回应时的情节写在各章 default 上方的注释里）；
#       S 的 default 开启重逢并记 c7_bond_musa_parted（我出城那天，穆萨在账簿第一页添了一行“先欠着”）；
#       重逢的 default：穆萨托商队捎来一封信，信里夹着一枚瓦利利挖出来的古罗马铜币（c7_bond_musa_missed）。
# 共享旗标：写 c7_pair_musa_yaqub_taken（S 的 promise 与 heart；pair_musa_yaqub 据此改走“并肩的朋友”）；
#       读 c7_pair_musa_yaqub_together（重逢的变体 with_yaqub：桌边给金匠铺那个人留一副碗筷，不写两人的事；由 pair_musa_yaqub 设）。
#       本线自有：c7_bond_musa_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed。
# 归属：地窖困一夜归本线（B1）；因假币被关进锁房归 pair_musa_yaqub，萨阿德银币的发现归 bond_yaqub，本线不写。
# 秘密：穆萨怕黑，只在 B1 的地窖里由他自己说出；雅库布那一半（有雅库布在上面看着，他就不先爬出来）本线不写。
# 日程：不改。

[[tracks]]
key = "bond_musa"
name = "穆萨：笑话先下去"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["musa"]

# C1：1554 年开春，安达卢斯区一座塌了半边的宅子。一卷绳梯。
[[tracks.chapters]]
key = "c1"
title = "笑话先下去"
text = "开春，城里的土耳其兵还没走干净，穆萨就扛着一卷绳梯在学堂门口堵我，说安达卢斯区有座塌了半边的宅子，墙根底下埋着罗马人的钱。“罗马人到过非斯？”“罗马人到过哪儿，钱就到过哪儿。”他把绳梯往肩上一颠，“下去一看就知道。”宅子的后院只剩一个黑洞，洞沿长满荨麻。他人还蹲在洞边，笑话先下去了：“这回真有宝，至少有我。”话音没落，巷口传来靴子踩石板的声音，有人用土耳其话骂街——巡街的兵。我是跟着他们的队伍进城的，可他们不认得我，我也不想让他们认得。我们一头扎进塌了顶的灶膛，灰扑了满脸。穆萨一只手捂着我的嘴，自己憋笑憋得浑身发抖，绳梯的一头还拖在灶膛外面。靴子在院门口停了停，有人踢了一脚那截绳子，骂了一句，走远了。他松开手，喘着气问：“还挖不挖？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 无人回应：那天穆萨一个人下去了，爬上来说底下什么也没有，可他衣兜里鼓鼓的。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "go_down_first"
text = "等巡街的走远，抢过绳梯，先下去探路。"
requires = []
reply = "我抢过绳梯就往下爬。底下只有一窝老鼠，和半只烂了口的陶罐，罐里装的是土。我爬上来的时候头发、眉毛、睫毛全是灰，穆萨看了我一眼，笑得一屁股坐进荨麻里，又疼得跳起来：“宝没挖到，挖到一个灰人！”他一边替我拍头上的灰，一边说下回还让我打头：“灰人下地窖，老鼠都认不出你。”"
next = "c2"
effects = [{ kind = "affinity", person = "musa", value = 3 }]

[[tracks.chapters.choices]]
key = "tease_well"
text = "揶揄他：上个月那口井，你也说底下有宝。"
requires = []
reply = "“那口井里真有东西，”他说，“有我丢下去的一只鞋。”他还是顺着绳梯下去了，在底下翻了半天，上来时攥着一枚长满绿锈的铜钱，非说是罗马的。我对着太阳看了看，上面的字像是这几年才铸的。他一把抢回去揣进怀里：“这几年也是古时候。”"
next = "c2"
effects = [{ kind = "affinity", person = "musa", value = 2 }]

# C2：1554 年夏。一张画在新纸上的“古”藏宝图，纸里透出一只小手的水印。
[[tracks.chapters]]
key = "c2"
title = "假的藏宝图"
text = "穆萨把攒了一年的钱，全花在了一张藏宝图上。卖图的是集市上一个瞎了一只眼的老乞丐，说这图是从一个罗马将军的坟里带出来的。他把图摊在我床上，拿两块石头压住四角，手指头顺着上面的红线走：出巴布·富图赫门，过两棵橄榄树，左转，第三块大石头底下。“看见没有？连树都画了。”我把图举起来对着窗户。纸里透出一只小手的水印，五个指头分得清清楚楚——集市纸铺一刀一刀摞着卖的新纸，我们抄书用的就是这种。他的笑僵在脸上，僵了好一会儿，才把图从我手里抽回去，抹平了折痕：“图是新抄的，宝是旧的。”说完又加了一句，声音小了下去：“一年的钱呢。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 无人回应：那张图穆萨后来贴在了床头，说是“非斯最贵的一张纸”。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "follow_anyway"
text = "陪他照着图走到底，一路把卖图人的花招拆给他听。"
requires = [{ kind = "affinity", person = "musa", ge = 20 }]
hint = "他正下不来台。这时候我说要陪他去，他只会当我是去看笑话的。"
reply = "出了巴布·富图赫门，橄榄树倒是有两棵，只是隔着半里地。我一路数给他听：红线专拣有坟的地方走，好叫人不敢细挖；“第三块大石头”，满山都是大石头。他听一条，“嗯”一声。红线的尽头是一口废井，井沿上坐着那个独眼老乞丐，膝盖上摊着一沓新图，正跟一个挑水的讲罗马将军。穆萨看了他半天，竟然掏钱又买了一张，回来塞给我：“这张画得好看，留着。”"
next = "b1"
effects = [{ kind = "affinity", person = "musa", value = 2 }, { kind = "bond", person = "musa", level = "C" }]

[[tracks.chapters.choices]]
key = "get_refund"
text = "拉他回集市找那个老乞丐，把钱要回来。"
requires = []
reply = "老乞丐听我们把话说完，睁着那只好眼把穆萨从头看到脚，从破袍子里数出一半的钱，说另一半是“教训钱”，教一回，收一回。穆萨揣着那一半在集市上转了一圈，买了两串烤羊肉，一串塞给我。他吃得满嘴是油，吃完舔舔手指：“教训也挺香。”"
next = "b1"
effects = [{ kind = "affinity", person = "musa", value = 3 }]

# B1：1554 年秋冬，新王进城以后。瓦利利废墟里的地窖，一盏只剩半壶油的灯。穆萨怕黑，在这里由他自己说出来。
[[tracks.chapters]]
key = "b1"
title = "瓦利利的地窖"
text = "新王的马队进了城，街上换了一拨兵。穆萨说城外瓦利利的罗马废墟里有一间地窖，行会的老人都说没人下去过。我们牵着一头借来的驴走了一天。地窖口在一排倒了的柱廊底下，石阶往下十几级，地上铺着碎了一半的彩石，拼的是什么，灯照不全。我刚举灯照见墙角一只陶罐，头顶的土就塌了，轰的一声，石阶口堵得严严实实，连风都透不进来。灯是我们唯一的光，壶里的油只剩一半。穆萨起先还讲笑话，讲罗马人把金子埋这么深是为了躲税吏，讲完自己笑，笑声在石壁上撞来撞去。后来笑话越来越短，再后来他只问：“还能亮多久？”过一会儿又问一遍。灯芯噼啪响了一声，火苗一缩。他一把抓住我的袖子，攥得死紧，声音小得我差点没听见：“我怕黑。从小就怕。”"
window = [[1554, 10, 1], [1554, 12, 31]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 10, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 无人回应：天亮时放羊的人听见了喊声，把我们挖了出来；穆萨上来第一件事是看太阳。
[tracks.chapters.default]
next = "b2"
effects = []

[[tracks.chapters.choices]]
key = "give_the_key"
text = "把祖母的门钥匙放进他手里：它开过格拉纳达的门，也开得了这一扇。"
requires = [{ kind = "affinity", person = "musa", ge = 20 }]
hint = "他到了这一步还要面子。钥匙递过去，他准会说一句“我又不冷”，然后把手揣起来。"
reply = "那把铁钥匙比他的手掌还长，齿都磨圆了。我说祖母带着它渡过海，一路上什么都丢了，就这把没丢。穆萨把它攥在手心里，攥了一整夜，再没出声。灯灭了以后，我只听得见他喘气，一下，又一下，慢慢匀了。天亮的时候，头顶传来铁锹铲土的声音。他把钥匙塞回我手里，钥匙是热的，他手心全是汗。"
next = "b2"
effects = [{ kind = "affinity", person = "musa", value = 2 }, { kind = "bond", person = "musa", level = "C" }]

[[tracks.chapters.choices]]
key = "worse_joke"
text = "给他讲一个比他的还烂的笑话，烂到他笑出声。"
requires = []
reply = "“罗马人挖这么深的地窖，你知道为什么？”他摇头。“因为他们早算到了，一千年后有个叫穆萨的要来挖。”他愣了一下，笑出了声：“你比我还烂！”于是我们轮流讲，一个比一个烂，讲到灯芯“嗤”地灭了也没停。黑里他的声音越来越慢，后来没了，脑袋一歪，靠在我肩膀上睡着了。我一动不敢动，就这么坐到了天亮。"
next = "b2"
effects = [{ kind = "affinity", person = "musa", value = 3 }]

# B2：1555 年，路干以后。把两人挖出来的放羊人，一锅烧糊了底的塔吉。
[[tracks.chapters]]
key = "b2"
title = "烧糊的饭"
text = "把我们从瓦利利挖出来的，是城外几个放羊的。穆萨的父亲，寻宝行会的“领事”，骂了他一冬天，骂他丢了行会的脸，也骂他差点丢了命。等到路一干，他就要再去那间地窖，说要让行会的人看看，他不怕。我在城门口拦住他：“你是去找宝，还是去找面子？”他没答话，踢着一颗石子往前走，踢出去老远，又追上去踢，一直踢到桥那头。我以为他不回来了。日头偏了西，他才空着手走回来，石子也不见了：“那先请那几个放羊的吃顿饭。”饭是他自己烧的。他在院子里支起灶，炖了一大锅塔吉，羊肉、杏干、洋葱码得整整齐齐，盖上陶盖就去门口迎客。放羊的人到了，蹲了一院子，锅底已经冒起黑烟。他掀开盖子看了一眼，又盖上了。“领事”抱着胳膊站在门口，看看锅，又看看他。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

# 无人回应：那顿饭穆萨请了，放羊人吃得很高兴，没人提那一锅糊底。
[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "eat_first_bite"
text = "替他把那锅塔吉端上桌，自己先吃第一口。"
requires = [{ kind = "affinity", person = "musa", ge = 50 }, { kind = "bond", person = "musa", level = "C" }]
hint = "他还不肯让我看见他手忙脚乱的样子。灶台边，他连站都不让我站。"
reply = "我把锅端上桌，揭开盖子，舀了满满一勺，连焦的一起送进嘴里，嚼得慢慢的，嚼完还点了点头。放羊的几个人互相看看，也伸了手。那锅饭最后连焦底都刮干净了。散席的时候，年纪最大的那个放羊人拍拍穆萨的肩膀：“下回挖宝叫上我们，我们带铁锹。”穆萨应了一声，转过身去收碗，收了很久，眼圈是红的。"
next = "a1"
effects = [{ kind = "affinity", person = "musa", value = 2 }, { kind = "bond", person = "musa", level = "B" }]

[[tracks.chapters.choices]]
key = "take_the_blame"
text = "跟他父亲说：去瓦利利，是我出的主意。"
requires = []
reply = "“领事”瞪着我，瞪了很久。我又说了一遍，还说下地窖的时候是我举的灯。他哼了一声，转身往屋里走，走到一半又回过头：“那你也来吃饭。”那顿饭我吃得最多。穆萨一直往我碗里拨锅底那层焦的，拨一勺，看我一眼；我吃一勺，他再拨一勺。"
next = "a1"
effects = [{ kind = "affinity", person = "musa", value = 3 }]

# A1：1556 年先知诞辰夜，卡拉维因门口。点到天亮的大蜡烛，铜盘边上的蜡油。
[[tracks.chapters]]
key = "a1"
title = "点到天亮的大蜡烛"
text = "先知诞辰的夜里，城里抬着大蜡烛游行。蜡烛有一人高，裹着彩纸，从安达卢斯区过了河，一路抬到卡拉维因，要点到天亮。穆萨陪我坐在卡拉维因的门槛外头。去年这一夜，他的笑话一个接一个，能把旁边念经的老人逗得板起脸来。我用胳膊肘碰碰他：“今晚的笑话呢？”他“嗯”了一声，没往下接。蜡油顺着烛台往下淌，在铜盘边上结成一道一道的白棱。他伸出指甲去刮，刮下一点，捻碎，再刮。刮了很久。人群里有人领着唱赞词，一人起句，满街的人应。等那一阵过去，他才开口，眼睛还盯着蜡油：“在瓦利利那一夜，你怕不怕？”"
window = [[1556, 1, 28], [1556, 3, 29]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 28], to = [1556, 3, 29] }, { kind = "age", le = 17 }]

# 无人回应：那一夜穆萨一个人坐在卡拉维因门口看蜡烛，看到天亮。
[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "say_afraid"
text = "说怕，把他冻得冰凉的手拢进自己袖子里。"
requires = [{ kind = "affinity", person = "musa", ge = 20 }, { kind = "romance_open", romance_open = "musa" }]
hint = "他今夜连笑话都不讲，我再靠近一点，他就要起身走了——我们还没熟到能挨得这么近。"
reply = "“怕。灯灭的时候，我也怕。”我把他的手拉过来，塞进袖子里，冰得像井水。他的手在里面僵了一下，像要抽走，后来不动了。领唱的人又起了一句，满街的人跟着应。在那一片声音底下，他很小声地说：“那下回下地窖，我们俩都怕，就不怕了。”"
next = "a2"
effects = [{ kind = "affinity", person = "musa", value = 2 }, { kind = "heart", person = "musa", value = 6 }]

[[tracks.chapters.choices]]
key = "walk_behind"
text = "答应他：往后挖宝，我走在后面替他看着光。"
requires = [{ kind = "affinity", person = "musa", ge = 50 }, { kind = "bond", person = "musa", level = "C" }]
hint = "这样的话要有交情垫着。现在说出口，他只会当成又一个笑话。"
reply = "“那你可不能先跑。”他说。我说我将来上了船，抢货不抢人，像他这样的，抢回去还得管饭。他“噗”地笑出声，笑完了，又不笑了，盯着最高的那根蜡烛：“说定了。”"
