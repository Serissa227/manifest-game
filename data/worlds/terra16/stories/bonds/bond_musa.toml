# A2：1556 年夏秋。一只木雕海鸥（wooden_gull），底座削得又宽又平。
[[tracks.chapters]]
key = "a2"
title = "刻成海鸥的鹰"
text = "穆萨送了我一只木鸟，用破布包着，递过来之前先咳嗽了一声。“本来刻的是鹰，”他说，“寻宝人的鹰，飞得高，看得远，地底下埋着什么都看得见。刻着刻着，就成这个样子了。”那是一只海鸥，脖子短，肚子圆，翅膀收在身后，像刚吃饱。我把它摆在窗台上，一阵风过来，它就倒了，滚了半圈。穆萨一句话没说，捡起来，从腰里摸出小刀，坐在我床沿上削它的底座。木屑落了一地。他削一下，放在膝盖上试一下，再削一下，直到底座又宽又平，像一块小砧板。“你以后在船上，”他把海鸥立回窗台，用手指推了推，推不倒，“桌子晃，它也倒不了。”他刻木头的时候，比讲笑话认真得多。"
