# S：1556 年 12 月，我回阿尔及尔以前。一本新账簿，第一页一行字。
[[tracks.chapters]]
key = "s"
title = "金子的一半"
text = "年底我要回阿尔及尔了。船长们答应开春给我一条自己的小船；穆萨留在非斯，跟着行会当寻宝人。他来送我的时候，胳膊底下夹着一本新账簿，皮面，线装，纸白得扎眼。他翻开第一页，上面是他的字，一笔一画写得格外端正：“挖到金子，算塔里克一半。”“就一行？”“就一行。账簿是新的，字要省着写。”他把账簿转过来对着我，“那你呢？你劫到的东西怎么算？”我把乌德琴往背上一甩：“我只劫货，不劫人。”“那货里要是有书，”他说，“算我一半。罗马人的书里，准写着金子埋在哪儿。”他把笔递过来，笔尖上的墨快干了，他又往墨壶里蘸了一下。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

