# 重逢：1561 年，非斯城外新挖开的地窖口。摆在地窖口的一桌饭，那本账簿。
[[tracks.chapters]]
key = "reunion"
title = "地窖外吃饭"
text = "一五六一年，我又回到非斯，进城前在骡背上颠了两天。穆萨在城外一处新挖开的地窖口摆了一桌饭：碎石上铺一块毡子，一锅塔吉，一摞烤饼，几只陶碗，围着他那几个跟着挖宝的伙计。“坐，”他说，“这回谁也不用先掉进去才肯坐下。”这几年他挖到过几样东西：一盏青铜灯，半截刻字的石碑，一小罐看不出年代的铜钱，没一样让他变成传说里的富人。他倒肯拿自己的失败讲笑话了，讲他在一口井底守了三天，守来一只掉下去的羊。他说每回挖到东西回城，头一件事是去新城的梅拉，请犹太区金匠铺的人验一验：“真金假金，那双眼睛一看就知道。”那本账簿就摆在毡子上，边角磨毛了。第一页那一行底下，多了一行我没见过的字：“先欠着。”他说是我出城那天添的。"
window = [[1561, 1, 1], [1561, 12, 31]]
at = "fez"
cast = ["musa"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1561, 1, 1], to = [1561, 12, 31] }, { kind = "age", ge = 18 }]

