text = "一五六一年，我又回到非斯，进城前在骡背上颠了两天。穆萨在城外一处新挖开的地窖口摆了一桌饭：碎石上铺一块毡子，一锅塔吉，一摞烤饼，几只陶碗，围着他那几个跟着挖宝的伙计。“坐，”他说，“这回谁也不用先掉进去才肯坐下。”这几年他挖到过几样东西：一盏青铜灯，半截刻字的石碑，一小罐看不出年代的铜钱，没一样让他变成传说里的富人。他倒肯拿自己的失败讲笑话了，讲他在一口井底守了三天，守来一只掉下去的羊。他说每回挖到东西回城，头一件事是去新城的梅拉，请犹太区金匠铺的人验一验：“真金假金，那双眼睛一看就知道。”毡子上多摆了一副碗筷，没人去坐。我问给谁留的，他往城里扬了扬下巴：“金匠铺那个人。收了铺子就来。”那本账簿就摆在碗边，第一页多了一行字：“先欠着。”他说是我出城那天添的。"

