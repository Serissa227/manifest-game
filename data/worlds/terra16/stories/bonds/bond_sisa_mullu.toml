reply = "她没有马上答。她抬头看了看板子上那一格“不卖”，又看我，然后伸手握住了我的手，握得很紧，指腹上有秤杆磨出来的硬皮。“那我先把颜色调好，”她说，“要外婆那种红，难调。”“调多久？”“调到你回来。”她没松手，就那么牵着我，穿过集口，走过晒网的沙滩，一直走到海边。筏队在水里等着，有人在喊我的名字。她这才松开，把我的手指一根一根掰开，往我掌心里放了一样东西，是那回在鸟粪岛我摸上来的灰贝壳。“这个先给你揣着。等你回来，我再要回去。”筏子走远了，我回头看，她还站在退潮的沙上，一直站到筏子看不见。"
