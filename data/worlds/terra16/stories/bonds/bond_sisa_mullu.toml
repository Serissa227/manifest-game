[[tracks.chapters.choices]]
key = "pick_best_shell"
text = "只看壳，指着最红最大的那一只，说这只成色最好。"
reply = "西萨顺着我的指头看过去，点点头：“成色是好。”她把那只壳拿起来翻过去，给我看壳底一道新撬的白痕，“这一只长在最深的那块礁上，他下去三回才撬下来。”我再看那只壳，红得有点吓人。后来商人出最高的价买走了它。西萨收钱的时候，把多出来的那几个子儿另外数了一遍，塞进潜水人手里。"
next = "c2"
