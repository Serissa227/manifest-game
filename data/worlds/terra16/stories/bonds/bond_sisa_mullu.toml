reply = "“头一句报平安。”我说。“第二句才许说生意。”她竖起一根指头，“壳的价钱、秤的斤两、哪家商人又压了价，统统放到第二句。”“那第三句呢？”她张了张嘴，没说出来，脸先红了，一直红到耳根，跟板子上那一格深红的壳差不多。“第三句……第三句再说。”她从摊子底下翻出一只空的小布袋塞给我，叫我在北边每见到一种壳，就捡一只最小的放进去，回来一只一只告诉她是哪里的、什么价。筏队出了海，我才想起解开那只布袋。袋底已经躺着一只壳，比指甲盖还小，是钦查的，壳里用炭点了一个点子——价目板上的记法，一个点子，一个子儿。"
