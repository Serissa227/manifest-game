# 西萨·穆柳：先看采集人的手（bond_sisa_mullu / reunion_sisa_mullu）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用轨道 key、章节 key、地点与年份。
# 标签：GL（羁绊线，可恋爱）。西萨 romance.with = any；主角性别由玩家定：女主角时为 GL，男主角时为 BG。适用主角：custom_chincha_rafts（钦查筏商家学的学生，“我”不写性别、外貌、家族专名）。
# 人物：西萨·穆柳 sisa_mullu（1540-04-01，女）；主角模板生年 1540-01-01，两人相差三个月。
#       学院期 1554—1556：主角 14—16 岁、西萨 13—16 岁；A1（1556-01..05）的心动选项双方未成年，只写手覆在手上；
#       A2（1556-06..11）双方 16 岁；S（1556-12）双方 16 岁，心动选项只到牵手与 crush，“第二个人”约在成年回来时再画。
#       重逢 1563：双方 23 岁，恋人落点合法。本文件不让迈塔出场，也不写阿米汉（她们的线 1581 年才开始）。
# 依据：
#   史实——海菊蛤（Spondylus，红色的刺牡蛎）长在北边厄瓜多尔一带的暖海里，靠潜水的人撬采，安第斯人拿它敬神，钦查人曾以筏子做这门沿海生意；
#         钦查外海的鸟粪岛（今钦查群岛）海鸟成群；西班牙人在卡亚俄设秤收税。
#   原创——北边来的潜水人与他的手、黑木提秤与葫芦秤盘、官秤称第三遍、灰扑扑的小贝壳、画着价码与点子的旧船板、
#         外婆的旧海菊蛤与壳底的刻痕、画着钦查海岸的彩绘贝壳（painted_shell）、价目板上那一格“不卖”。
#   待核——征服以后海菊蛤的沿海买卖在 1550 年代还剩多大（正文只写零星的筏子与几个西班牙商人）；卡亚俄码头的官秤由谁掌管（正文只写“税吏”）。
# 缺省走向（default 不显示文字，只在这里记下故事照走的样子）：
#           C1 没人插话，那一篮壳照西萨报的价卖了，潜水人走前冲她弯了弯腰；C2 西萨没卖，提着那三篮壳回了家；
#           B1 只摸上来一只灰贝壳，西萨揣回去了；B2 木板没挂出去，靠在她家墙角；A1 她一个人在海边坐到天黑，手里攥着旧贝壳；
#           A2 画好的贝壳她自己留着，放在外婆那枚旧贝壳旁边。
#           S 的 default：开春“我”北上那天，西萨在集上替采壳人称壳，没来海边；开启重逢，设 c7_bond_sisa_mullu_parted，不改关系。
#           重逢的 default：西萨托往北的筏队捎来一只画着海岸的小贝壳，筏上两个人，附一封信（letter），设 c7_bond_sisa_mullu_missed。
# 羁绊阶梯：C2 argue_for_her 给 C；B1 dive_again 补签 C；B2 paint_with_her 给 B；A1 never_sell 补签 B；
#           A2 take_shell / who_on_raft 给 A + painted_shell + 回忆“画在壳里的海岸”。心动：A1 hold_it_with_her +6，A2 who_on_raft +6（要 ≥ 6），
#           S heart +12（要 ≥ 12），全选心动正好 24，够重逢的 love 落点（决定表原写 S +10，只能到 22，按简报改为 +12）。
# 旗标：写 c7_bond_sisa_mullu_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed；本线没有 rival 落点。
#       S 的 promise 与 heart 另设共享旗标 c7_tie_new_amihan_dagat_sisa_mullu_taken（tie_new_amihan_dagat_sisa_mullu 读，改走“并肩的朋友”）。
#       重逢的 variants 读本文件的 _promise / _romance / _own；不读外部旗标。
# 日程：西萨学院期的日程在钦查（chincha），各章 at 沿用旧稿的卡亚俄（钦查筏户的出海口），由整合方确认在场判定；重逢 1563 在卡亚俄。
# 口头禅：用 cast 里现行的“壳再好看，也得算上人家潜了几回。”（简报写的是改写前的旧句“漂亮的壳，也得算人家的辛苦”，意思相同），只在 C1 用一次。
# 秘密：外婆的旧海菊蛤（红只剩边上一圈、出过三倍的价也不卖），A1 才说出来历；本文件的羁绊章没有 stage，不写 news，秘密不进任何见闻。
# 地点（2026-11-01 close-places）：学院章 at 由 callao 改 chincha；B1“跟着家里的筏子南下”改“出海”，B2“卡亚俄集口”改“钦查集口”，上面“日程”一条作废。重逢 1563 仍在卡亚俄。

