text = "提议去码头税吏那里，借官秤来称第三遍。"
reply = "税吏正要吃饭，嫌我们耽误工夫。我说称完了这几篮，税照样交给他，他才叫人把官秤抬出来。官秤称出来的数，跟西萨的木秤只差一钱。商人没话说了，照数付钱，走的时候踢翻了一只空篮子。西萨把篮子扶起来，冲我笑得很甜：“原来官秤也有不偏的时候。”她把木秤收回腰间，又补了一句，“下回还得劳你去借。”"
