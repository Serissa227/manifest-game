# A1：1556 年初，海边的平礁。小布包里的旧海菊蛤：外婆自己潜下去采的，出三倍的价也不卖。
[[tracks.chapters]]
key = "a1"
title = "不卖的旧贝"
text = "西萨约我到海边那块平礁上，从腰间解下那只小布包。布包她从不离身，我一直当里头装的是钱。她解开系绳，倒出来的是一只旧海菊蛤：颜色早褪成了淡粉，红只在边上留着窄窄一圈，壳刺磨得光溜溜的，像被人握了很多年。跟着滚出来的，是那只灰扑扑的小贝壳。“这只是我外婆的，”她说，“她年轻的时候，自己潜到北边的海里采上来的。那时候我们家还没当商人。”前年有个从利马来的商人出过三倍的价，她父亲都点了头，她不肯。“不卖就是不卖。”她把旧壳放进我手心，捏着我的手腕，让我把它举起来对着太阳。“看里面。”壳里贴着一道细细的光，细得像一根头发，顺着纹路慢慢走，走到边上那一圈红里就不见了。"
