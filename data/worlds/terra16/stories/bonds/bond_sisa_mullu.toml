# A2：1556 年下半年，海边。她在一只贝壳里面画了钦查的海岸；筏上一个人在撑篙。
[[tracks.chapters]]
key = "a2"
title = "画在壳里的海岸"
text = "西萨拿给我一只扇贝壳，比巴掌还大，里面那一面已经画满了。用的是染布的颜料，赭红、靛蓝、炭黑，一层压一层：最底下是钦查的沙滩，弯成一道浅浅的弧；远处一团灰白，是鸟粪岛，岛上点着几只鸟；海上漂着两只巴尔萨木筏，前头那只筏上站着一个人，撑着一根长篙，身子往前倾。颜料干透了，摸上去有点涩。“你年底就要跟筏队北上了。”她没看我，看着那只壳，“以后走远了，就把它贴在耳边，能听见这里退潮的声音。”我把壳贴上去。里头真有声音，一阵一阵的，像潮水退下去，又涌上来。也许是我自己的心跳。"
