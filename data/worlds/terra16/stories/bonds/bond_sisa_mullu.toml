# C2：1554 年夏，钦查集口。西班牙商人的铜秤总称轻；西萨拿出自己的黑木提秤。
[[tracks.chapters]]
key = "c2"
title = "自己的秤"
text = "集上来了个新面孔的西班牙商人，带着一杆铜秤，秤杆擦得锃亮。他称海菊蛤，一篮称完报一个数，每一篮都比西萨估的轻。西萨蹲在旁边不吭声，一篮一篮地听。听完第三篮，她从腰间的布包旁边抽出一杆木秤：秤杆是黑木的，一头吊着磨圆的石砣，秤盘是半只葫芦。她当着围过来的人，把那三篮又称了一遍，每称一篮，在沙上划一道。三道划完，她抬起头，还是笑着：“少了两成。”商人的脸一下涨红了，说印第安人的秤不作数，谁知道那块石头有多重。围着的潜水人听不懂他的话，只看见他嗓门越来越大。西萨站起来，把木秤塞进我手里，秤杆上还留着她手心的热。“你会说他们的话，”她说，“你替我跟他说。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "chincha"
cast = ["sisa_mullu"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

