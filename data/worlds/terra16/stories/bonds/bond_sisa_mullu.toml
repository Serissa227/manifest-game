# B1：1554 年秋冬，钦查外海的鸟粪岛。她教我憋气；我摸上来一只灰扑扑的小贝壳。
[[tracks.chapters]]
key = "b1"
title = "鸟粪岛边的浅水"
text = "“想知道采壳的人有多辛苦，”西萨说，“就得自己下一回水。”我们跟着家里的筏子出海，又借了一只小筏，划到钦查外海的鸟粪岛。岛还没靠近，先闻到了味儿，熏得我眼泪直流；海鸟多得遮住半边天，吵得人说话要喊。西萨把头发拧成一股塞进领口，先下了水。浅处的水也冷得刺骨。她教我憋气：吸三口，第三口吸满，闭嘴，往下沉，别慌着往上蹿。第一回我刚沉下去就呛了上来；第二回摸到一手滑腻腻的石头；第三回，指头在石缝里碰到一个硬东西，攥住了往上蹬。是一只小贝壳，灰扑扑的，比指甲盖大不了多少，一点也不红。我举着它直喘气。西萨接过去，对着太阳翻看两眼：“不值钱。”说完拿衣角把它擦干净，揣进了自己腰间的小布包。那只布包她平时谁也不让碰。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "chincha"
cast = ["sisa_mullu"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

