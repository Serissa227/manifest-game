# S：1556 年 12 月，钦查集口。价目板终于挂在她家摊子正上方；“先报平安，再报壳价。”
[[tracks.chapters]]
key = "s"
title = "一趟一趟回来"
text = "年底我要跟着家里的筏队北上，先到派塔，再往北，不知道哪一年回来。走的前一天，我去集口找西萨。那块价目板终于挂起来了，挂在她家摊子的正上方，是她父亲叫人钉的，钉得端端正正。板上的壳比当初多了两行，最末一格画的是一只灰扑扑的小贝壳，价码那里写着“不卖”。北边来的采壳人一下筏，不先找商人，先站到板子底下仰着头看。西萨正替人称壳，称完一篮，把秤交给她父亲，朝我走过来。她今天没笑。“你每次回来，”她说，“先告诉我人都平安，再告诉我壳的价钱。”她停了停，又说，“北边的价，你替我记着。”"
