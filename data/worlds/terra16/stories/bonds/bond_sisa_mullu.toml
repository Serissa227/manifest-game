text = "问她：不值钱的壳，为什么还要揣起来？"
reply = "“因为是你摸的。”她答得太快，说完自己先怔住，耳朵红了。她低头去解筏绳，过了一会儿才改口：“因为是头一回。头一回摸上来的东西，扔了犯冲。”回程她让我掌桨，一路教我看水色找礁石：哪种颜色的水底下有壳，哪种底下只有沙，哪里的浪一打就翻，千万别下。"
