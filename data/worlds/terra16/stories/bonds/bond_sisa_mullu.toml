title = "放下货篮的人"
text = "1563 年，家里的筏队从北边回来，在卡亚俄靠了岸。集口那块价目板换了新的，比原来大一倍，用的是整张的船板，画满了壳：深红的、橙红的、带白斑的，还有几种我在北边见过、这里从前没人画过的。板子底下排着一队采壳人，背上都压着货篮。西萨站在队伍最前头，手里提着那杆黑木秤，石砣换了一块更大的。新到的一个采壳人刚要把篮子往秤盘上搁，她摆摆手，叫他先把篮子放到地上，旁边一个小姑娘舀来一碗水递给他。他喝完了，喘匀了，她才叫他把篮子提过来。称到一半，她抬头看见了我。秤没放，她也没笑，只问了一句：“人都平安吗？”"
