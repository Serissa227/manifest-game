# C1：1554 年初，钦查海滩。北边来的潜水人倒出一篮海菊蛤；西萨先看他的手。
[[tracks.chapters]]
key = "c1"
title = "先看采集人的手"
text = "北边来的筏子靠岸时已经过了晌午。筏上下来一个潜水的人，把一篮海菊蛤倒在沙滩上，壳上的刺还挂着海草，一滩红摊开来，红得像傍晚的天。两个西班牙商人抢着蹲下去，拿指头拨拉，专挑个大的往自己脚边扒。西萨·穆柳没有蹲。她走到那个潜水人跟前，把他垂着的右手拉起来，翻过来看：手指泡得发白，皮一层层起皱，指甲缝里全是细细的血口子，有几道还没长上。她看了很久，才放下那只手，从沙上拣起一只壳，托在掌心转给商人看。“壳再好看，也得算上人家潜了几回。”她声音不大，脸上带着笑。一个商人哈哈大笑：“印第安姑娘心这么软，还做什么买卖？”西萨也笑，报了一个价。商人往下压，她摇头；商人再压，她把那只壳轻轻放回篮里，笑着把原价又报了一遍，一个子儿也没让。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "chincha"
cast = ["sisa_mullu"]
speaker = "captain"
mood = "tender"
when = [{ kind = "flag", flag = "family_access_chincha_raft_house" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

