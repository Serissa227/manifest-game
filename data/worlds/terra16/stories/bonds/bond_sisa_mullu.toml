# B2：1555 年，钦查集口。画着贝壳与价码的旧船板；她父亲说“我们也是商人”。
[[tracks.chapters]]
key = "b2"
title = "市场上的价目板"
text = "西萨找木匠讨来一块旧船板，刨平了，用炭条打好格子：海菊蛤按大小分三行，按颜色分三列，深红的、橙红的、带白斑的，每一格画一只壳，壳旁边写价码。价码用西班牙数字写，底下再点上点子，不识字的人数点子也看得懂。她要把它挂到钦查集口那根柱子上，北边来的采壳人一下筏就能看见，用不着再听商人报价。她父亲看见了，没骂，只把木板翻过去扣在地上。“价一挂出来，谁还压得了价？我们也是商人，西萨。”那天他们吵了一架。她的声音一句也没抬高，说的话一句也没让。天黑以后，她抱着那块画了一半的木板来找我，板子上还沾着她父亲扣下去时蹭上的土。她把它靠在墙上，拍掉手上的炭灰：“还差六格。”"
