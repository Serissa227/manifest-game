[[tracks.chapters.choices]]
key = "look_at_hands"
text = "也蹲到潜水人跟前，先看他的手，再看壳。"
reply = "我蹲下去，想看看他的另一只手。他慌忙把手缩到背后，在裤腿上蹭了两下，像怕弄脏了什么。我只好去看壳，这才看出那些刺是一根根掰过的，掰断的地方还是白的。收工以后，西萨在集口的棚子底下等我，推过来一碗奇恰酒。“你蹲下去那一下，他记住你了。”她自己那碗端在手里，一口没喝，“我也记住了。”"
