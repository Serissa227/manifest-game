# 缺省：开春我出海那天，马丁在防波堤尽头挂了一盏灯，白天也点着。只开重逢、记 parted。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_martin_itsas" }, { kind = "flag", flag = "c7_bond_martin_itsas_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好将来一起出航的那一年：我掌舵，他管水。"
requires = [{ kind = "bond", person = "martin_itsas", level = "A" }]
hint = "灯底下，掌舵管水的约你说不出口：交情还没结实到能拴一辈子；要么，这样的一辈子，你已经跟另一个人结过了。"
reply = "“说定了？”马丁问。“说定了。我掌舵，你管水。”他点点头，把两截绳头并在一起，就着灯光打了一个接绳结，打得很慢，打完了用牙咬紧。然后他踩着灯架的横档爬上去，把那个整结系在挂灯的铁钩旁边，绕了三道。“就挂在这儿，”他从上头低头看我，“等那一年。”风一吹，结在灯底下打转。他从架子上下来，手背上的冻疮裂了口，他也不管，在裤腿上蹭了蹭。“要是我先当上船长呢？”我说。“那也一样，”他说，“船长的水，也归我管。”回去的路上，他走在靠河的那一边，替我挡着河面上来的风，一路数着桥上的灯，数到圣安东堂门口，正好十二盏。"
next = "done"
effects = [{ kind = "bond", person = "martin_itsas", level = "S" }, { kind = "relation", person = "martin_itsas", relation = "friends" }, { kind = "memory", memory = "mem-bond_martin_itsas-s", title = "圣尼古拉的灯" }, { kind = "flag", flag = "c7_bond_martin_itsas_promise" }, { kind = "flag", flag = "c7_tie_new_martin_itsas_elene_urruti_taken" }, { kind = "start_track", track = "reunion_martin_itsas" }]

[[tracks.chapters.choices]]
key = "heart"
text = "在灯下把两截结接上，说等两人都成年了，再说那句话。"
requires = [{ kind = "bond", person = "martin_itsas", level = "A" }, { kind = "heart", person = "martin_itsas", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "martin_itsas", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "martin_itsas" }]
hint = "两截绳头凑在一起，你的手却不肯去接：心里那一股还没拧紧；要么，同样的结，你已经和另一个人打过了。"
reply = "我把两截绳头凑在一起，打了一个接绳结。手指冻得不听使唤，打了两回才打紧。“等我们都成年了，”我说，“我有句话要跟你说。现在不说。”马丁看着那个结，看了很久。灯在风里晃，他的脸一会儿亮，一会儿暗。“那句话，”他说，“我也有。”他握住那个结，也握住了我的手。他的手比我的还凉，掌心全是茧，一块新结的痂硌着我的指节。我没抽手，他也没松。“那时候一起说。”他说。我们就这么站着，站到灯油烧下去一截，守夜的老水手提着油壶上来添油，冲我们咳了一声。马丁这才松开手，把接好的结揣进怀里，揣得很深。"
next = "done"
effects = [{ kind = "bond", person = "martin_itsas", level = "S" }, { kind = "heart", person = "martin_itsas", value = 12 }, { kind = "relation", person = "martin_itsas", relation = "crush" }, { kind = "flag", flag = "c7_bond_martin_itsas_romance" }, { kind = "memory", memory = "mem-bond_martin_itsas-s", title = "圣尼古拉的灯" }, { kind = "flag", flag = "c7_tie_new_martin_itsas_elene_urruti_taken" }, { kind = "start_track", track = "reunion_martin_itsas" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好谁先当上船长，谁请对方喝一桶苹果酒。"
reply = "“一桶？”马丁眯起眼睛，“谁家的桶？”“你家的。”“那桶我来箍，”他说，“酒你来买。”“凭什么是我买？”“因为你会输。”我伸出手，他一巴掌拍上来，拍得山响，灯架都跟着晃了晃。他掌心有一股鲸油味，洗了多少遍也洗不掉。“开春你出海，我也出海，”他说，“看谁的船先挂上自己的旗。”守夜的老水手在后头笑：“两个小崽子，酒还没影呢，先吵上了。”马丁没理他，把手在裤腿上擦了擦，又伸过来，跟我重新拍了一回。"
next = "done"
effects = [{ kind = "affinity", person = "martin_itsas", value = 2 }, { kind = "relation", person = "martin_itsas", relation = "rivals" }, { kind = "flag", flag = "c7_bond_martin_itsas_own" }, { kind = "start_track", track = "reunion_martin_itsas" }]

