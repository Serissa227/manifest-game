# 马丁·伊萨斯：听桶（bond_martin_itsas）——羁绊线，标签 BL（自创主角性别由玩家定：男主角为 BL，女主角为 BG）。
# 人物：马丁·伊萨斯（martin_itsas，1540-01-10 生），毕尔巴鄂制桶匠家的少年，船场学院的同学兼对手；话少、较真，一着急就数数、拿指节敲东西。
#       口头禅（淡水要数三遍的那一句）原话全文件只在 c1 出现一次，别处只用动作或别的说法呼应。
#       自创主角（custom_basque_whaling，模板 1540-01-01 生），巴斯克捕鲸人家的孩子，家里有人是站船头的鱼叉手；“我”不写性别、外貌与家族专名。
# 年龄：学院期 1554—1556 两人都在 14—16 岁；s 章（1556-12）两人都 16 岁，心动选项只到牵手；重逢 1562 年两人都 22 岁，恋人落点在这里。
# 依据（史实）：十六世纪中叶巴斯克捕鲸船每年初夏去新地（拉布拉多的红湾一带），船上带拆散的桶板，到了再箍成鲸油桶，入冬带油回乡；
#       桶箍多用劈开的栗木或榛木条；圣尼古拉（12 月 6 日）是水手的主保；毕尔巴鄂内尔维翁河边的圣安东堂与圣安东桥。
# 原创：两人的故事；船场在船东面前辩航海的旧规矩（1554-05-20）；防波堤尽头的灯架与学生替水手点灯的习俗；同行结（各打一半、剪开各留一截）；桶底的斜钩记号。
#       正文写“新地”“红湾”，不写具体船名；c2 里“去年少了四个人的船”不写名字。
# 缺省走向：玩家什么也不做，马丁照样长大——c1 他一个人拆了漏桶；c2 船东少带了水；b1 他一个人挂灯；b2 那条船少带三只桶出海；
#   a1 他一个人在桥上看河；a2 他一个人打完整个结挂在铺子门上；s 开启重逢并记 _parted；重逢错过时他托渔船捎来同行结与一封信（_missed）。
#   （羁绊章没有 stage，default 没有显示文字；各章缺省的情节写在 default 上方的注释里。）
# 羁绊阶梯：c2 / b1 各一个选项给 bond C（b1 是补签）；b2 / a1 各一个给 bond B（a1 是补签）；a2 两个“收下”选项给 bond A、同行结与回忆。
#   心动：a1 的 share_cloak +6；a2 的 tie_slowly +6（要求已有 6）；s 的 heart +12（要求已有 12）；全选心动正好 24，重逢的 love 要求 ≥ 24。
#   （决定表写 s +10，算下来到不了 24，按简报改为 +12。）
# 共享旗标：写 c7_bond_martin_itsas_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#   s 章 promise 与 heart 都写 c7_tie_new_martin_itsas_elene_urruti_taken（配角线马丁×埃莱内据此改走“并肩的朋友”）。
#   本文件私用：c7_bond_martin_itsas_knot_door（a2 缺省：结挂在铺子门上），只给 s 与重逢的变体读，保证同行结的下落前后对得上。
# 读：c7_bond_martin_itsas_romance（重逢 love 门槛）。
# 日程：不改（马丁 1554 起一直在 bilbao；1556 年六月到十一月他在船上，日程仍写 bilbao，本线 a2 以后到 s 以前没有章节）。
# 秘密：马丁夜里梦见没看清的冰——a1 由他自己说给“我”；本文件的章节都没有 stage，不写见闻；来信里只写他后来看清了。
# 埃莱内只在重逢里作背景（挎药篮包药的姑娘，不写名字）。

[[tracks]]
key = "bond_martin_itsas"
name = "马丁·伊萨斯：听桶"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["martin_itsas"]

# C1：箍桶铺门口，第七只淡水桶。口头禅只在这里用一次。
[[tracks.chapters]]
key = "c1"
title = "听桶"
text = "开春前，船东来箍桶铺验今年上船的淡水桶。二十只新桶在门口排成一行，闻得到栗木的生味。马丁拿指节一只一只敲过去，敲一下，偏头听一下。敲到第七只，他把耳朵贴了上去，贴了很久。“这只不能上船。”船东弯腰看了半天，看不见缝：“桶匠家的小子，你是在听桶，还是在听鬼？”马丁不吭声，舀了半桶河水灌进去，蹲在旁边等。我也跟着蹲下了。过了一顿饭的工夫，第七只桶的腰上，木纹里慢慢鼓出一滴水，挂了一会儿，啪地落在石板上。马丁站起来，拍掉手上的木屑：“船上的水，先数三遍。”船东的脸一直红到了脖子根。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_bilbao_whaling_yard" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那只桶被船东扔到一边，马丁晚上一个人把它拆了。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "ear_to_cask"
text = "也把耳朵贴到桶上，请他教怎么听。"
reply = "我什么也没听出来，只听见自己的心跳。马丁看了我一眼：“闭上眼。”他又敲了一遍，我还是没听出来。敲到第三遍，那声音闷闷的，像有人缩在桶里咳嗽。“听见了？”他问。我点头。他没再说什么，可从那天起，他敲桶的时候不再背对着我。"
next = "c2"
effects = [{ kind = "affinity", person = "martin_itsas", value = 3 }, { kind = "skill", skill = "shipbuilding", value = 8 }]

[[tracks.chapters.choices]]
key = "call_him_coward"
text = "笑他胆小：一只桶而已，海上有的是雨水。"
reply = "马丁没跟我争。他把那只渗水的桶放倒，滚到我脚边，桶在石板上咕噜噜转了半圈：“那这只给你。你带上船，试试。”那滴水又在木纹上鼓了出来。我没伸手。他等了一会儿，把桶滚回去，搁到了墙角。"
next = "c2"
effects = [{ kind = "affinity", person = "martin_itsas", value = 2 }]

# C2：五月二十日，船场请船东听学生辩航海的事；题目是一条捕鲸船该带多少桶水。
[[tracks.chapters]]
key = "c2"
title = "船东面前"
text = "五月二十日，船场照老规矩请船东们来听学生辩航海的事。今年的题目用炭写在木板上：一条去新地的捕鲸船，该带多少桶淡水。一个学生说四十，一个说三十五，船东们都点头——少带一只水桶，回来就多一只空桶装鲸油。轮到马丁，他站起来：“六十二。”满屋子笑出了声。有人问他是不是打算把船开到海底去喝。马丁攥着一张清单，耳朵红透了，一行一行往下念：船上几个人，走几个月，每人每天喝多少，雾天停船要多等几天，桶在路上要漏掉几成。念到“回程遇上逆风”，他的声音抖了，停下来，手指在桌沿上敲了三下，才接着往下念。前排一个船东打了个哈欠：“小子，鲸油比水值钱。”"
window = [[1554, 5, 10], [1554, 7, 9]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 10], to = [1554, 7, 9] }, { kind = "age", le = 17 }]

# 缺省：那一年船东们带的水比马丁报的少，回来时有一条船少了两个人。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "stand_with_him"
text = "站到他旁边，接着他的数往下念，把去年渴死人的那条船也念出来。"
requires = [{ kind = "affinity", person = "martin_itsas", ge = 20 }]
hint = "他还当你是来看他出丑的。这时候站过去，他只会更难堪。"
reply = "我接过清单，从“回程遇上逆风”往下念，念完了，又添了一句：去年秋天从新地回来的那条船少了四个人，靠岸时舱里的水桶没有一只是满的。屋里静了。一个白胡子的老船东摸着胡子说：“这孩子的数，我那条船用。”散场后马丁在门口追上我，憋了半天：“你念得比我好。”"
next = "b1"
effects = [{ kind = "affinity", person = "martin_itsas", value = 2 }, { kind = "bond", person = "martin_itsas", level = "C" }]

[[tracks.chapters.choices]]
key = "middle_number"
text = "报一个折中的数，让两边都下得来台。"
reply = "我说五十。船东们笑着点了头，这事就算定了。马丁没点头。散场时他从我身边走过去，低声说：“折中的数，海不认。”第二天我路过箍桶铺，看见他照五十这个数，又多箍了两只桶，搁在门口没人要的那一排里。"
next = "b1"
effects = [{ kind = "affinity", person = "martin_itsas", value = 3 }]

# B1：冬天，一条捕鲸船迟迟不归；防波堤尽头的灯架被风吹歪。
[[tracks.chapters]]
key = "b1"
title = "防波堤尽头的灯"
text = "十一月底，去新地的捕鲸船一条接一条回了内尔维翁河，只剩一条迟迟不见帆。我家里的人就在那条船上。那天夜里起了大风，防波堤尽头的灯架被吹歪，灯灭了两回。我跑过去的时候，马丁已经扛着梯子到了，扳手别在腰上。“扶着。”他说。我扶梯子，他往上爬。两个人在风里吵灯该挂多高。“高了，雾里看不见！”“低了，浪一上来就打灭！”他在上头系绳结，嘴里数着，一个，两个，三个，数乱了又从头数。我在底下吼他快点，嗓子都喊哑了。灯重新挂稳的时候，东边的天发了白。浪头那边，远远地有一面帆。"
window = [[1554, 11, 1], [1554, 12, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 11, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

