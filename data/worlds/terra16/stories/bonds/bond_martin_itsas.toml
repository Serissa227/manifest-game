# A1：1556 年开春，圣安东桥。他说出那个梦。
[[tracks.chapters]]
key = "a1"
title = "没看清的冰"
text = "开春的一个夜里，我睡不着，走到圣安东桥上，马丁已经在那儿了，两只胳膊撑着石栏，盯着底下的河水。“你也睡不着？”我问。“做梦了。”过了一会儿，他又说，“老是同一个梦。船在雾里走，前头有一片冰，白得发青。我知道它在那儿，可怎么也看不清它有多大。每回醒过来，被子都是湿的。”他拿指节在石栏上敲了一下，两下，三下，像在敲一只桶。“六月我就要上船了，”他说，“去新地，管全船的水。”桥头圣安东堂的钟敲了一下。他把两只手缩进袖子里，像是冷。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

