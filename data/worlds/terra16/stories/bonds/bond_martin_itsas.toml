# S：1556 年圣尼古拉节前夜，防波堤尽头替水手的主保点灯。主角开春要出海。
[[tracks.chapters]]
key = "s"
title = "圣尼古拉的灯"
text = "十二月初，马丁的船从新地回来了。他管的淡水桶一只也没漏，船东在码头上当众拍了拍他的肩。圣尼古拉节前夜，照船场的老规矩，学生要去防波堤尽头替水手的主保点灯。这是我们这一届最后一回去点灯，我在，他也在。灯点着了，风把火苗压得很低。马丁从手腕上解下那截同行结。半年的海风把麻绳吹得发白。“你那截呢？”我把我的掏出来。两截凑在灯底下比了比，断口对着断口，正好接得上。开春我就要跟家里的船出海了，他知道。他把两截绳头捏在一起，没有松手。“这回，”他说，“轮到我在灯底下等你。”"
window = [[1556, 12, 5], [1556, 12, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "tender"
