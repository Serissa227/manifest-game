next = "b2"
effects = [{ kind = "affinity", person = "martin_itsas", value = 3 }]

# B2：1555 年夏天，箍桶铺帮工；最后一条去新地的船明早开，还差十只鲸油桶。
[[tracks.chapters]]
key = "b2"
title = "箍桶铺的夏天"
text = "夏天船场放了假，我去马丁家的箍桶铺帮工，一天到晚削桶板、劈箍条、扫刨花。六月里，最后一条去新地的船明早就开，还差十只鲸油桶。船东堵在门口骂，骂得马丁的父亲都躲进了后屋。马丁一声不吭，把十只桶挨个灌满水，排在院子里。等到太阳偏西，有三只桶的腰上洇湿了一片。他拿起锤子就拆。船东抄起一块桶板要砸柜台：“明早就开船，你拆？”“漏的桶上了船，回来你拿什么装油？”马丁说。桶板哗啦啦倒了一地。他把拆下来的板子一片一片摆开，又从棚里拖出一捆新劈的栗木桶箍，回头看我：“今晚能不能睡，看你了。”"
window = [[1555, 6, 1], [1555, 8, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1555, 6, 1], to = [1555, 8, 31] }, { kind = "age", le = 17 }]

