# 重逢：1562 年，毕尔巴鄂箍桶铺。挎药篮的姑娘（埃莱内，不写名字）只作背景。
[[tracks.chapters]]
key = "reunion"
title = "桶上的旧记号"
text = "一五六二年，我又回到了毕尔巴鄂。马丁家的箍桶铺换了招牌，门口摞着新桶，刨花没过脚面。他父亲坐在门边晒太阳，伙计们都管马丁叫“师傅”。他正准备再去一趟新地，柜台边站着一个挎药篮的姑娘，替他包一小包草药，包好了往他怀里一塞，冲我点点头，出门走了。马丁在围裙上擦了擦手，把我领到铺子最里面。那里放着一只旧桶，桶板发黑，箍换过两回。他把桶翻过来，桶底刻着一道小小的斜钩——那年夏天赶上船的鲸油桶，每只底下都有这一道，跑了六趟新地，就剩这一只回来了。他拿指节敲了敲：“还响。”然后抬头看我，“你那截结，还在不在？”"
window = [[1562, 1, 1], [1562, 12, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1562, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "martin_itsas", ge = 18 }]

# 缺省：我错过了毕尔巴鄂，马丁托渔船捎来同行结和一封信。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "martin_itsas", text = "你没来。我在码头等了三条船，第四条来的时候，我没去。铺子我接了。父亲的手抖，箍不动了，天天坐在门口看我箍。门口新摞了四十只桶，下个月跟船去新地，我还是管水。同行结托这条渔船捎给你。我在上头拴了一块桶板，刻了今年的年份，好认。把它挂在你船上，挂哪儿都行，别挂在会淋湿的地方。有件事本来想当面说。我有好些年夜里梦见一片冰，在雾里，看不清有多大。去年在新地北边，雾散了一回，我看清了。没有梦里那么大，也没有那么白，边上脏兮兮的，跟铺子里放久了的鲸油一个颜色。回来以后，那个梦就不怎么做了。你船上的水，自己数。数够了再开船，别信船东的。铺子的门不上闩。哪一年回来，直接进来，炉子边有凳子。——马丁" }, { kind = "flag", flag = "c7_bond_martin_itsas_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "答应他：下一趟去新地，我掌舵，他管水。"
reply = "马丁听完，转身从柜子底下摸出一截新搓的麻绳。“旧的不动，”他说，“再打一个。”他打一半，我打一半。我那一半还是歪。他看了一眼，没让我重打，拿桶匠的小刀在那只旧桶的桶板上，挨着那道斜钩刻了个年份，把新结钉在旁边。第二年开春，我们的船出了内尔维翁河。我站在舵边，他蹲在舱底，一只一只敲桶，敲完一遍从头再敲，三遍敲完才上来喝口水。到了新地，他把带去的桶板箍成鲸油桶，箍好一只，就冲舵这边喊一声数。那一趟回来，船上的淡水一滴都没少。马丁在码头上开了一桶苹果酒，请全码头的人喝，自己只喝了半杯，坐在桶上看我跟码头上的人掰腕子。“下一趟，”他说，“还是你掌舵。”"
next = "done"
effects = [{ kind = "affinity", person = "martin_itsas", value = 5 }, { kind = "relation", person = "martin_itsas", relation = "friends" }, { kind = "flag", flag = "c7_bond_martin_itsas_landing_friend" }, { kind = "memory", memory = "mem-reunion_martin_itsas", title = "桶上的旧记号" }]

[[tracks.chapters.choices]]
key = "rival"
text = "翻出当年的赌约：这一季，看谁的桶先装满鲸油。"
reply = "“就等你这句。”马丁一把扯下围裙，扔在柜台上。那一季，我们两条船前后脚出的内尔维翁河，前后脚进的红湾。捕鲸站上的人都知道，毕尔巴鄂来的两条船在较劲：我的鱼叉手天不亮就下小艇，他的箍桶棚夜里点着灯，一夜能箍出六只桶。谁家装满一只，就往桅杆上挂一面小旗。到了秋天收账，他比我多出半桶。回到毕尔巴鄂，那桶苹果酒是我买的，就在他铺子里开。他喝到第二杯，拿指节敲着酒桶：“那半桶，是我箍得好。”“是你的鱼叉手运气好。”“运气也是箍出来的。”他又给我倒了一杯，倒得满满的，一滴都没洒出来。"
next = "done"
effects = [{ kind = "affinity", person = "martin_itsas", value = 3 }, { kind = "relation", person = "martin_itsas", relation = "rivals" }, { kind = "flag", flag = "c7_bond_martin_itsas_landing_rival" }, { kind = "memory", memory = "mem-reunion_martin_itsas", title = "桶上的旧记号" }]

[[tracks.chapters.choices]]
key = "love"
text = "说这回不急着走，想在毕尔巴鄂过一个冬天。"
requires = [{ kind = "flag", flag = "c7_bond_martin_itsas_romance" }, { kind = "heart", person = "martin_itsas", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "martin_itsas", ge = 18 }, { kind = "romance_open", romance_open = "martin_itsas" }]
