text = "一五六二年，我又回到了毕尔巴鄂。马丁家的箍桶铺换了招牌，门口摞着新桶，刨花没过脚面。门框上还挂着那个同行结，两半都是他打的，风吹日晒了六年，麻绳发了黑。他父亲坐在门边晒太阳，伙计们都管马丁叫“师傅”。他正准备再去一趟新地，柜台边站着一个挎药篮的姑娘，替他包一小包草药，包好了往他怀里一塞，冲我点点头，出门走了。马丁把我领到铺子最里面。那里放着一只旧桶，桶板发黑，箍换过两回，桶底刻着一道小小的斜钩——那年夏天赶上船的鲸油桶，每只底下都有这一道，就剩这一只回来了。他拿指节敲了敲：“还响。”又朝门口偏了偏头，“门上那个，到现在也没人来剪。”"
