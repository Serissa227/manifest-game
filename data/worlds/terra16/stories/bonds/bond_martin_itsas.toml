# A2：1556 年六月，开船前一天；同行结（friendship_knot）。
[[tracks.chapters]]
key = "a2"
title = "同行结"
text = "六月，捕鲸船要去新地了。马丁头一回上船，管全船的淡水。开船前一天傍晚，他来船场找我，手里拿着一根新搓的麻绳，还带着焦油味。“巴斯克的水手出海前要打同行结，”他说，“两个人各打一半，合起来才是一个整结。走的时候剪开，一人留一截，回来再接上。”他在绳子这头打完了他那一半，打得又紧又齐，像一只箍好的桶。然后他把另一头递过来。我去接的时候碰到了他的手指，上面全是新磨出来的茧，有一个还破着。“你那一半，”他说，“随你怎么打。”"
window = [[1556, 6, 1], [1556, 7, 31]]
at = "bilbao"
cast = ["martin_itsas"]
speaker = "captain"
