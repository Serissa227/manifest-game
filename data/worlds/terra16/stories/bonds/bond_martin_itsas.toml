reply = "马丁的手还搭在那只旧桶上，半天没动。“冬天的箍桶铺最暖和，”他说，“炉子一夜都不灭。”那年冬天，去新地的船都回来了，内尔维翁河边结了薄冰。我在他的铺子里过了一冬，白天帮他劈箍条，夜里两个人守着炉子烤栗子，听炉膛里的木头噼啪响。有一晚下了雪。他从柜子最里面拿出那个整结，就是那年在灯底下接上的那一个，麻绳已经发黄，结还是紧的。他把它套在我脖子上，手停在我的领口，没有拿开。“那句话，”他说，“我攒了六年。”他没往下说，低头吻了我。他身上有刨花和炉火的味道，手指却是凉的，跟那年在灯底下一样。那一夜，炉子果然没灭。"
