# 重逢：1560 年，下田的栈桥。她自己挑的那条关船，她自己谈下的运费。
# variants（取第一个对上的）：cane_silent / cane_confessed（替打的账，不加好感）→ shared（许过两份以上心意的局）→ with_yuki（配角线 together）。
# friend 落点永远可选（姐妹）；love 落点要 romance 旗标、心动 ≥ 24、双方满 18，_silent 局走 love_cane。
[[tracks.chapters]]
key = "reunion"
title = "先问船头"
text = "隔了三年多，我又回到下田。河口的沙洲还在老地方，涨潮时那条深色的水线一眼就看得见。栈桥边泊着一条关船，不大，船身漆得乌亮。汐站在栈桥上，跟一个堺来的商人谈一船纸的运费。商人嫌贵，说别家的船便宜两成。我张嘴就想替她报数，又咽了回去。“别家的船进不了这个河口。”汐说，“你去看那根桩子，今天小潮，水才到第二道绳。你那条船吃水五尺，到不了栈桥，只能搁在沙洲外头雇驳船，一船纸驳三趟，驳船钱比我这两成多，纸还得多淋一回雨。”商人算了半天，认了价。她这才转过头来，抬手招我上船：“船是我自己挑的。你先看看脚下。”栈桥的板子湿着，第三块松了。"
window = [[1560, 1, 1], [1560, 12, 31]]
at = "shimoda_tosa"
