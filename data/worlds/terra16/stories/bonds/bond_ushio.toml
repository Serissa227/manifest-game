# 缺省：我错过了中村，汐托一条能岛的船捎来一张潮时表，背面写着“先看看脚下”。
[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "ushio", text = "姬君：这封信是我自己写的，字丑，你认得。你没来。我在下田等了一个夏天，等到秋天的大潮过去，船要去堺装货，不能再等了。我现在是船头。船是我自己挑的，关船，不大，吃水浅，进得了下田的河口。别家的船进不了，所以我的运费比别家贵两成，堺的商人骂我，骂完还是雇我。水夫七个，两个是能岛来的，一个是你家的，就是小时候偷柿子被我娘追着打的那个，他现在会收帆了。我娘身子还好，盂兰盆还去河口点灯，说是给那年提灯的人点的。她问你什么时候回来，我说不知道。随信捎一张下田河口的潮时表，我自己记的，一天记两回，记了三年，中间病了四天，那四天是水夫替我记的，字更丑。你以后的船要进这个河口，照着它走。大潮那几天别硬闯，在外头等一夜，我在里头看得见你的灯。背面那句话，你听我说过。汐" }, { kind = "flag", flag = "c7_bond_ushio_missed" }]

[[tracks.chapters.variants]]
key = "cane_silent"
when = [{ kind = "flag", flag = "rw_mio_cane_silent" }]
text = "隔了三年多，我又回到下田。河口的沙洲还在老地方，涨潮时那条深色的水线一眼就看得见。栈桥边泊着一条关船，不大，船身漆得乌亮。汐站在栈桥上，跟一个堺来的商人谈一船纸的运费。商人嫌贵，说别家的船便宜两成。“别家的船进不了这个河口。”汐说，“今天小潮，水才到第二道绳，你那条船吃水五尺，只能搁在沙洲外头雇驳船，一船纸驳三趟，驳船钱比我这两成多。”商人认了价。她转过头来看见我，手没抬。“那年的竹子，我替你记着十下。”说完这句，她才招手叫我上船。"

[[tracks.chapters.variants]]
key = "cane_confessed"
when = [{ kind = "flag", flag = "rw_mio_cane_confessed" }]
text = "隔了三年多，我又回到下田。河口的沙洲还在老地方，涨潮时那条深色的水线一眼就看得见。栈桥边泊着一条关船，不大，船身漆得乌亮。汐站在栈桥上，跟一个堺来的商人谈一船纸的运费。商人嫌贵，说别家的船便宜两成。“别家的船进不了这个河口。”汐说，“今天小潮，水才到第二道绳，你那条船吃水五尺，只能搁在沙洲外头雇驳船，一船纸驳三趟，驳船钱比我这两成多。”商人认了价。她转过头来看见我，先笑了一下：“你那回认了，我白挨了。”这话她小时候就说过，一个字没改。然后她抬手招我上船。"

[[tracks.chapters.variants]]
key = "shared"
when = [{ kind = "flag", flag = "c7_bond_ushio_romance" }, { kind = "flag", flag = "c7_mio_heart_2" }]
text = "隔了三年多，我又回到下田。河口的沙洲还在老地方，涨潮时那条深色的水线一眼就看得见。栈桥边泊着一条关船，不大，船身漆得乌亮。汐站在栈桥上，跟一个堺来的商人谈一船纸的运费，商人嫌贵，她把桩子上的水痕、小潮的时辰、驳船的价钱一样一样摆出来，商人认了价。她转过头招我上船。舱口压着一封信，封皮上的字不是她的手。“半路上捎的，给你的。”她说，“送信那天我顺道见了那个人一面，说了一句话，别的没说。这条船跑下田到堺，你的船队往西，咱们不同路。你先看看脚下。”她舱里挂着的是能岛的过所旗。"

[[tracks.chapters.variants]]
key = "with_yuki"
when = [{ kind = "flag", flag = "c7_pair_ushio_reizei_yuki_together" }]
text = "隔了三年多，我又回到下田。河口的沙洲还在老地方，涨潮时那条深色的水线一眼就看得见。栈桥边泊着一条关船，不大，船身漆得乌亮。汐站在栈桥上，跟一个堺来的商人谈一船纸的运费。商人嫌贵，说别家的船便宜两成。“别家的船进不了这个河口。”汐说，“今天小潮，水才到第二道绳，你那条船吃水五尺，只能搁在沙洲外头雇驳船，驳船钱比我这两成多。”商人认了价。她招我上船：“船是我自己挑的。你先看看脚下。”舱里的横梁上压着一卷歌稿，纸是京都的薄样，字细细的，是冷泉家的手。她见我在看，咳了一声：“现在她的信，不经过你的手了。”她把歌稿往横梁里头推了推，推完又拉出来一点，让我看得见封皮。"

[[tracks.chapters.choices]]
key = "friend"
text = "上她的船，跟她出一趟海，看她怎么当船头。"
reply = "第二天一早我们出了河口，往西去绕足摺岬。她掌舵，我提灯，天还没亮，她非要我提，说船上的规矩，客人也得干活。浪比那年盂兰盆小，她比那年凶，一会儿嫌水夫收缆慢，一会儿嫌我灯举歪了。“往左一点。”“好，别动。”绕过岬角，太阳出来，她把舵交给水夫，走到船头挨着我站。回港以后她数一船的货钱，我在旁边报了个总数，她不理，从头数，数出来跟我报的差三文，是我错了。她把一串钱放到我手里，说是提灯的工钱。“你还是我的姬君，我也还是你的乳姐妹。可这条船是我的。”我说下回要涨价。她说：“那你先学会看水线。”"
next = "done"
effects = [{ kind = "affinity", person = "ushio", value = 5 }, { kind = "relation", person = "ushio", relation = "sisters" }, { kind = "flag", flag = "c7_bond_ushio_landing_friend" }, { kind = "memory", memory = "mem-reunion_ushio", title = "先问船头" }]

[[tracks.chapters.choices]]
key = "love"
text = "把那年空着的工钱那一栏，现在说清楚。"
requires = [{ kind = "flag", flag = "c7_bond_ushio_romance" }, { kind = "heart", person = "ushio", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "ushio", ge = 18 }, { kind = "romance_open", romance_open = "ushio" }, { kind = "flag", flag = "rw_mio_cane_silent", value = false }]
hint = "要当年许过心意、心动 24。"
reply = "我说我想把那年空着的那一栏说清楚。汐转身对水夫喊：“舵你看着。”她拉着我的手腕穿过堆着纸包的甲板，一直走到船头。船头的横木上刻着一个字，我在栈桥上没看见：一个“澪”，三点水一点比一点低。“刻坏了两块板，”她说，“这是换上去的那块。”她从怀里摸出那块旧手巾，解开，纸还在，工钱那一栏还空着。“不填了。这船是我的，你是坐我船的人，填什么都不对。”我说那我不填，我说别的。说得不慢，也不好听，说到一半她就笑了，笑着凑过来吻了我。一个浪打上船头，船晃了一下，她没松手。水夫在后头咳嗽，她头也不回：“看你的舵。”"
next = "done"
effects = [{ kind = "affinity", person = "ushio", value = 5 }, { kind = "relation", person = "ushio", relation = "lovers" }, { kind = "flag", flag = "c7_bond_ushio_landing_love" }, { kind = "memory", memory = "mem-reunion_ushio", title = "先问船头" }]

# love_cane：替打那夜沉默、后来在大三岛那回提过的局（研究 3.3 第 6 场的“真关上的门”在没提过的局）。
[[tracks.chapters.choices]]
key = "love_cane"
text = "先说那十下竹子，再把那年空着的那一栏说清楚。"
requires = [{ kind = "flag", flag = "c7_bond_ushio_romance" }, { kind = "heart", person = "ushio", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "ushio", ge = 18 }, { kind = "romance_open", romance_open = "ushio" }, { kind = "flag", flag = "rw_mio_cane_silent" }, { kind = "flag", flag = "c7_bond_ushio_cane_spoken" }]
hint = "要当年许过心意、心动 24，那十下竹子也得在京都时就跟她提过。"
reply = "我先说那十下竹子。汐脸朝着海听，听到一半打断我：“你在京都说过一回了。说过一回就够，再说就成了讨价。”她转身对水夫喊“舵你看着”，拉我去船头。横木上刻着一个“澪”，三点水一点比一点低，最后一点刻得太深，裂进了木纹。她从怀里摸出那块旧手巾，纸还在，工钱那一栏空着。我说我也有话要说。她说那你说，说慢些。我说了，说得很快，说到一半手巾让风掀起来，往舷边卷，她一脚踩住，弯腰捡起来，把它系在了我的手腕上，系的是船结。"
next = "done"
effects = [{ kind = "affinity", person = "ushio", value = 5 }, { kind = "relation", person = "ushio", relation = "lovers" }, { kind = "flag", flag = "c7_bond_ushio_landing_love" }, { kind = "memory", memory = "mem-reunion_ushio", title = "先问船头" }]
