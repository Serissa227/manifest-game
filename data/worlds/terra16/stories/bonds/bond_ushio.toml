# 先看看脚下（bond_ushio）——羁绊线，标签 GL（汐纯 GL；主角一条澪为女性）。
# 走向：一直在→各自一条船（无条件支持；她不肯的是在澪手下当差）。
# 人物：汐（ushio，1540-01-01 生，romance = 女性），能岛村上家的女儿，澪的乳姐妹；扮作侍女跟澪进京，在宫里被人看不起。
#       主角：一条澪（mio，1540-06-21 生），土佐一条家的长女，1554 年起在京都做宫中女房的见习；第一人称“我”。
#       年龄：学院期（1554—1556）两人都未满 18；A1（1555-08）两人 15；S 章（1556-12）汐 16、澪 16；重逢（1560）汐 20、澪 19—20，都已成年。
# 声音（照 docs/world/voices/japan.md 3.3）：人前憋着、打死结；没人时或吵潮时一口气连着说，摆证据；借娘的话（“我娘说”）；
#       人前叫“姬君”，人后叫“你”。不当面夸澪，不说“姬君待我好”，不“算一半”（归鹰丸）。
# 口头禅：“等着，潮会转的。”只在 c1；“先看看脚下”c1 起头、重逢呼应；“我娘说”全文件 4 处（c1 talk_back、b2、s heart、s heart_second）。
# 依据（史实）：一条本家在京都，土佐一条家以幡多郡中村为本据，下田在渡川（四万十川）河口；能岛村上家是濑户内的海上武家，
#       出船前参拜大三岛的大山祇神社；京都到堺可走淀川，堺到土佐要绕纪伊水道；岚山下有桂川；关船是村上水军常用的中型船。
# 原创：本线全部场面与对白——光滑的廊下、半夜描“澪”字、桂川上夺篙、能岛的叔父来信、盂兰盆夜里举灯过河口、
#       大三岛御守与船结、写着舵位的纸与空着的工钱一栏、汐每月退回的那一成、汐自己挑的关船。
# 待核：1554 年岚山一带桂川的游船走法（正文只写“岚山上头一段水急”）；盂兰盆按本游戏的历日放在 8 月上旬。
# 秘密：汐怕自己的字让澪在宫中丢脸，半夜偷偷描字（C2 澪撞见）——永远不进见闻；本文件没有 stage 章，不写 news。
# 羁绊阶梯：C2 teach_her 给 C；B1 back_her_up 补签 C；B2 count_the_fare 给 B；A1 learn_her_line 补签 B；
#       A2 wear_charm / tie_one_for_her 给 A + 大三岛御守（omishima_amulet）+ 回忆。
# 关系会退（C21b）：c1 talk_back 情谊 -2（挨罚的是汐）；b1 back_her_up 不加情谊，汐人后改口叫回“姬君”，到 b2 才改回来（不在当场和解）。
#       无条件支持者全线只此一处负值（R11）。
# 心意（C21b；裁决第 1 条“可以多份，每多一份更难”，数值见 docs/BALANCE.md 2026-11-12 C21b 一节）：
#       心动来源 A1 hold_lantern_all_night +6、A2 tie_one_for_her +6、课后同行（每回 2—4）。
#       S 的三档：heart（头一份，心动 ≥ 12，带 bond S）/ heart_second（已许一份，心动 ≥ 18、意志 resolve ≥ 5）/
#       heart_third（已许两份及以上，心动 ≥ 26、意志 ≥ 7、发绳 c7_bond_ushio_cord）。第二、三档不带 bond S（一生一约归引擎，只有一位）。
#       共用计数旗标 c7_mio_heart_1 / _2 / _3（五条可许心意的羁绊共用；后端加“已许心意的人数”条件以后改用它）。
# 替打的账（研究 3.3 第 6 场）：重逢读 rw_mio_cane_silent / _confessed 各一段变体（不加好感）；
#       _silent 局的 love 拆成 love（要 _silent 为假）与 love_cane（要 _silent 且 A2 speak_of_cane 设过 c7_bond_ushio_cane_spoken）。
# 缺省走向：每章 default 都往下走、不加任何东西；S 的 default 设 c7_bond_ushio_parted 并开启重逢；
#       重逢的 default 是汐的一封来信（附下田河口的潮时表）并设 c7_bond_ushio_missed。
# 共享旗标：S 的 promise 与三档 heart 都设 c7_pair_ushio_reizei_yuki_taken（配角线 pair_ushio_reizei_yuki 据此改走“并肩的朋友”）；
#       重逢的 variants 读 c7_pair_ushio_reizei_yuki_together（由配角线设）、c7_mio_heart_2（许过两份以上）。
# 本文件写的旗标：c7_bond_ushio_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed / _cord / _cane_spoken；
#       c7_mio_heart_1 / _2 / _3。主线 main_mio 读 _landing_friend、_landing_love（键不变）。
# 不写的事：七夕白绢归 bond_reizei_yuki，岬角渔火归 bond_takamaru，汐与雪的故事归 pair_ushio_reizei_yuki。
# 入口：bond_ushio 由与汐交谈（ask:bond_ushio）开启；reunion_ushio 由 S 章的任一选项与 default 开启。日程不需要改。

[[tracks]]
key = "bond_ushio"
name = "汐：先看看脚下"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["ushio"]

# C1：1554 年春，一条本家的廊下。擦得发亮的地板，光着的脚。口头禅在这里用唯一一次。
[[tracks.chapters]]
key = "c1"
title = "光滑的地板"
text = "进京第二个月，汐还是穿不惯本家宅子里的足袋。一条本家的廊下天天拿米糠擦，亮得照见人影，她走一步滑半步，索性把足袋脱了拎在手里，光着脚跟在我后头。拐过中庭，迎面撞上管衣裳的老女房。扇子“啪”地合上，指着汐的脚：“乡下来的丫头，连脚都不知道收着？这是本家的廊下，不是你们海贼的船板。”汐低着头，脚趾头抠住了地板。我一步跨上去要顶回去，脚底一溜，整个人往后仰。汐一把揪住我的胳膊拽稳了，凑在我耳边，声音压得只有我听得见：“先看看脚下。等着，潮会转的。”老女房的扇子又打开了半面，等我开口。"
window = [[1554, 3, 1], [1554, 4, 30]]
at = "kyoto"
cast = ["ushio"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_kyoto_court" }, { kind = "date", from = [1554, 3, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：那天汐被老女房罚跪了半个时辰，我偷偷给她送了一块点心。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "take_off_shoes"
text = "也把足袋脱了，光着脚陪她走完这条廊下。"
reply = "我蹬掉足袋，光着脚往前走。老女房张着嘴，扇子忘了合。汐跟在后头憋着笑，憋得肩膀直抖，脚底下倒一步也没再滑。走到廊下尽头她才凑过来：“你脚底下没茧，踩这种地吃亏。脚趾头要抓着，跟站船板一样，船一晃你先晃，别等它晃你。”她蹲下去，拿指头把我的脚趾头一个一个按下去。"
next = "c2"
effects = [{ kind = "affinity", person = "ushio", value = 3 }]

[[tracks.chapters.choices]]
key = "talk_back"
text = "用宫里最客气的话，把老女房顶回去。"
reply = "我理了理衣袖，笑着说：“劳您费心。本家的廊下擦得这样亮，原是要照人的；照见谁的脚，都是廊下的福气。”老女房的脸一阵青一阵白，扇子打不开了。罚下来的是汐：在廊下跪半个时辰，替老女房的局里剪灯芯。我隔着纸门问她冷不冷。她说：“我娘说，姬君顶嘴，挨罚的是跟着的人。你下回顶之前，先看看我站在哪儿。”"
next = "c2"
effects = [{ kind = "affinity", person = "ushio", value = -2 }]

# C2：1554 年夏，宫中女房的局。一张写满“澪”字的练习纸。汐的秘密在这里被澪撞见，永远不进见闻。
[[tracks.chapters]]
key = "c2"
title = "半夜描字"
text = "梅雨下了半个月，局里的纸窗潮得发软。半夜我醒过来，屏风后头还亮着一点灯，灯芯剪得只剩米粒大。汐趴在地上，手肘底下压着一张纸，纸角磨破了。纸上一个挨一个全是“澪”字：三点水歪歪扭扭，右边那个“零”底下总写散。她描完一个，拿指头量一量，再描一个。我踩响了一块地板，她慌忙把纸翻过去，墨还没干，在背面洇出一片影子。“你在宫里的信，”她盯着灯说，“要是我替你送，字丑了，人家笑的是你。”说完拿袖子去蹭指头上的墨，越蹭越黑。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "kyoto"
cast = ["ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 缺省：那一夜我装作没醒，汐描到灯油烧完。
[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "teach_her"
text = "在她旁边坐下，握着她的手，一笔一笔教她写。"
requires = [{ kind = "affinity", person = "ushio", ge = 20 }]
hint = "情谊 20。她把纸往身子底下一按，灯也吹了。"
reply = "我在她旁边跪坐下，握住她拿笔的手。她的手比我的硬，掌心一层茧，笔杆在里头直打滑。“三点水要像水，”我说，“一点比一点低，落笔轻，收笔快，你别拿它当钉子钉。”她照着点，点出来三块礁石。我们描到窗纸发白，最后一个“澪”是她自己写的，端端正正。“那以后你的信，我能替你写了。”“我的信我自己写。你要写，写你自己的。”她把那张纸叠成小块，起身去添灯油，添完才想起天已经亮了。"
next = "b1"
effects = [{ kind = "affinity", person = "ushio", value = 2 }, { kind = "bond", person = "ushio", level = "C" }]

[[tracks.chapters.choices]]
key = "read_her_letter"
text = "不看那张纸，请她把想写给家里的信念给我听。"
reply = "我没看那张纸，只问她想给家里写什么。她犹豫半天，把纸翻回来，背面还有几行，是写给她娘的：京都的水是死的，不咸；廊下太滑；今年的鲷鱼一条要六十文，宫里的人吃得眼都不眨。再往下一行涂成了黑块，涂了又写，写了又涂。她拿沾墨的指头按住那一块：“这句不念。写出来像假话。”"
next = "b1"
effects = [{ kind = "affinity", person = "ushio", value = 3 }]

# B1：1554 年秋，岚山的桂川。一根撑船的竹篙；宫里的人不听一个侍女的。
[[tracks.chapters]]
key = "b1"
title = "桂川的急流"
text = "十月，宫里的女房们去岚山看红叶，雇了两条船，从岚山上头顺着桂川往下放。我和汐坐后一条。转过一道弯，水声变粗，船夫一篙没撑住，船头被急流一推，横了过来。女房们尖叫成一团，有人去抓船舷，有人抱着衣箱不撒手，船晃得更厉害。汐从船夫手里夺过竹篙，脚往船底一蹬，几下把船头扳正了。可是没人听一个侍女的：管衣裳的老女房还在喊船夫的名字，两个年轻的女房挤到一边去看前头的石头，船又歪了。一块黑礁石从白浪里冒出来，越来越近。汐把竹篙抵上礁石，篙身弯了下去：“都别动！左边的往右挪，衣箱放下，放下！”船上的人还在喊船夫的名字。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "kyoto"
cast = ["ushio"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

# 缺省：船撞上一块小礁石，没翻；上岸以后，宫里的人只记得船夫救了船。
[tracks.chapters.default]
next = "b2"
effects = []

# back_her_up：给 bond C，但不加情谊——她怕的就是这个。人后改口叫“姬君”，b2 才改回“你”。
[[tracks.chapters.choices]]
key = "back_her_up"
text = "站起来，以一条家姬君的身份，喊所有人照汐说的做。"
requires = [{ kind = "affinity", person = "ushio", ge = 20 }]
hint = "情谊 20。她背对着我，肩膀绷着。"
reply = "我在晃荡的船上站起来，把嗓门提到在宫里从没用过的高度：“一条家的人在这条船上，照她说的做！”船上一下子静了。汐喊左，大家往左靠；喊蹲下，十几层衣裳一齐矮下去。船擦着礁石滑过了急流。上了岸，女房们围着我，说一条家的姬君好胆量，又说姬君的侍女手劲真大。汐把竹篙还给船夫，一个人走到前头去了。回局的路上我叫她，她站住，回过身，低着头：“姬君有什么吩咐。”回廊里一个旁人也没有。"
next = "b2"
effects = [{ kind = "bond", person = "ushio", level = "C" }]

[[tracks.chapters.choices]]
key = "hold_her_steady"
text = "什么也不说，从后面抱住她的腰，替她稳住身子。"
reply = "我扑过去，从后面抱住她的腰。她撑篙时整个人往前压，我就往后坠。船擦着礁石过去，翻进下面平缓的水里，我还没松手。她这才回过头，看见我的胳膊：“姬君，放手。岸上有人看。”我松开了。剩下那一段水，她背对着我撑完，篙一下一下戳得很重。"
next = "b2"
effects = [{ kind = "affinity", person = "ushio", value = 3 }]

# B2：1555 年春夏，京都。一封能岛家里寄来的信：回去学做船头。
[[tracks.chapters]]
key = "b2"
title = "能岛来的信"
text = "开春，能岛的盐船到了堺，捎来一封给汐的信，信封上的字比她的还歪。信是她叔父写的：她表兄鹰丸快当上船头了，她一个村上家的女儿在京都给人端茶倒水，是浪费；夏天以前回来，跟船学舵。汐把信给我看。我看完还给她，她叠起来，又打开。窗外有人晒被子，竹竿敲得啪啪响。“鹰丸那家伙，小时候连橹都摇不直，他那条破小早的舵柄还是我十岁那年削的。叔父说他快当船头了，快是几年？能岛只有一条好船，他当了，我回去也是跟在他后头收缆。”她把信往膝盖底下一垫，指头在榻上划来划去，划的是一条弯弯曲曲的水路。"
window = [[1555, 1, 1], [1555, 7, 31]]
at = "kyoto"
cast = ["ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 7, 31] }, { kind = "age", le = 17 }]

# 缺省：那封信汐没回，压在她的枕头底下压了半年。
[tracks.chapters.default]
next = "a1"
effects = []

[[tracks.chapters.choices]]
key = "count_the_fare"
text = "陪她把回能岛的路费一笔一笔算清，算完推到她面前。"
requires = [{ kind = "affinity", person = "ushio", ge = 50 }, { kind = "bond", person = "ushio", level = "C" }]
hint = "情谊 50、羁绊 C。那封信她不肯给我看第二回。"
reply = "我拿过算盘：下淀川的船四十文，堺到能岛搭盐船一人一百二，路上的饭钱、两道关钱，打到三百一十文，末尾添上我攒的私房钱，够，还多出九文。我把纸推过去。她把纸推回来：“路费我自己挣。学会掌舵以后，我再回来找你的水路。”当天夜里她回了信，只写了一句：“再等两年。”"
next = "a1"
effects = [{ kind = "affinity", person = "ushio", value = 2 }, { kind = "bond", person = "ushio", level = "B" }]

[[tracks.chapters.choices]]
key = "ask_what_she_wants"
text = "问她：她自己想去哪里。"
reply = "“海上。”她答得很快。停了一下又说：“我娘说，奶喂过的孩子走到哪儿，奶娘的女儿跟到哪儿。我娘说的，不是我。”说完她自己先瞪圆了眼睛，低头去叠那封信，叠成一个方方正正的小块，又拆开重叠。"
next = "a1"
effects = [{ kind = "affinity", person = "ushio", value = 3 }]

# A1：1555 年盂兰盆，回土佐的海路，下田的河口外。船头的一盏灯笼；汐掌舵，澪提灯。（七夕归雪，渔火归鹰丸，这里都不写。）
[[tracks.chapters]]
key = "a1"
title = "盂兰盆的海路"
text = "盂兰盆，我们回土佐。船从堺出来，绕过纪伊水道，沿着土佐的海岸往西走了七天。最后一夜正赶上大潮，下田的河口外，海水往里推，河水往外冲，两股水在沙洲前撞成一道白线，船在线外打转，进不去也退不开。船老大的手在抖。汐把他往旁边一推，接过了舵，回头冲我一扬下巴：“姬君，提灯，去船头，照水。”我提着灯笼爬到船头。浪一个接一个打上来，灯笼让风扯得横过来，我两只手攥着提杆举着。灯光底下，水面上有一条颜色发深的线，弯弯曲曲伸进河口。“往左一点，”她在船尾喊，“好，别动。”船头顺着那条深色的水线，一寸一寸挤了进去。"
window = [[1555, 8, 6], [1555, 10, 5]]
at = "shimoda_tosa"
cast = ["ushio"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1555, 8, 6], to = [1555, 10, 5] }, { kind = "age", le = 17 }]

# 缺省：那一夜的潮太大，船在河口外等到天亮才进港，汐一夜没合眼。
[tracks.chapters.default]
next = "a2"
effects = []

[[tracks.chapters.choices]]
key = "hold_lantern_all_night"
text = "把灯笼一直举着，举到船靠上栈桥为止。"
requires = [{ kind = "affinity", person = "ushio", ge = 20 }, { kind = "romance_open", romance_open = "ushio" }]
hint = "情谊 20。举到后半夜，胳膊抖得握不住提杆，灯笼换到了水夫手里。"
reply = "我一直举着。船过了沙洲，进了河口，靠上下田的栈桥，天边已经发白。汐跳过来把灯笼从我手里掰下来，我的两条胳膊一落下就再抬不起来。她蹲在船头替我揉，从手腕揉到肩膀，嘴里一路数落：“提杆要架在肘弯里，你拿手腕吊着，吊一夜，明天筷子都拿不住。浪打过来你要矮下去，你偏站着，灯油洒了半盏。”揉到肩膀，她的手停在那里没拿开，数落也停了。"
next = "a2"
effects = [{ kind = "affinity", person = "ushio", value = 2 }, { kind = "heart", person = "ushio", value = 6 }]

[[tracks.chapters.choices]]
key = "learn_her_line"
text = "上岸以后请她教我：那条深色的水线是怎么看出来的。"
requires = [{ kind = "affinity", person = "ushio", ge = 50 }, { kind = "bond", person = "ushio", level = "C" }]
hint = "情谊 50、羁绊 C。她累得眼睛都睁不开，看水线是村上家的看家本事。"
reply = "上了岸她倒头睡到中午，醒来就拉我去河口的沙滩，折一根芦苇在沙上画。“河水浑，海水清，两股水碰头的地方，底下冲出一道沟，水深，颜色就沉。大潮沟宽，小潮沟窄，你别看浪，浪骗人，你看浪底下那一层颜色。”她画沙洲，画沟，画浪从哪边来。潮水涨上来，把沙上的画一道道抹掉，她就往高处挪一挪接着画，一直画到点起火把。“以后你的船，我来看水线。”“那你得一直在船头。”她把芦苇插进沙里，去看潮水涨到哪儿了。"
next = "a2"
effects = [{ kind = "affinity", person = "ushio", value = 2 }, { kind = "bond", person = "ushio", level = "B" }]

[[tracks.chapters.choices]]
key = "thank_her_mother"
text = "上岸以后先去找乳母阿濑，告诉她是汐把船带进来的。"
reply = "阿濑在栈桥边等了一夜，头发被海风吹得乱糟糟的。我跑过去，话说得又快又乱：浪多大，水线多深，汐怎么把船老大推开接了舵。阿濑先把船老大骂了一大串，骂完才伸手摸了摸汐的头：“我的女儿。”汐站在后头任她摸，眼睛一直看着我。"
next = "a2"
effects = [{ kind = "affinity", person = "ushio", value = 3 }]

# A2：1556 年夏秋，京都。一只大三岛的御守（omishima_amulet），系在腰带上的船结。
[[tracks.chapters]]
key = "a2"
title = "大三岛的御守"
text = "入夏，能岛的盐船又到了堺，汐托船上的人带回一个小布包。打开，是一只大三岛大山祇神社的御守，布袋缝得密密实实，袋口用麻线扎了好几道。“泡过海水也不散，”她说，“我叫婶子拿缝帆的线缝的，一尺线两文，她多收了我一文，说是神前的线。”她让我站好，蹲下去，把御守系在我的腰带上。系的不是宫里的花结，是船上拴缆的结，她两只手一绕一穿一勒，我扯了一下，纹丝不动。“村上家的人出船以前，都要去拜那里的神，”她低着头还在调那个结，“你以后出海，也算村上家的船。”她拿牙咬断了线头。"
