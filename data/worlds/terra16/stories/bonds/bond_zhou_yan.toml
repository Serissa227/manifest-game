reply = "“没看见啊。”我说。趁他去先生那里借灯油，我把袖子里剩的一颗糖杨桃夹进那一页，合上。他回来翻开，脸先白了，又一下红到脖子，一整天不敢往我这边看，借墨都隔着桌子伸长了手。过了几天，我又偷看了一回：那一页底下添了一行小字，“果脯是谁放的？书上没说。”"
