[[tracks.chapters]]
key = "b2"
title = "龙舟边的一棍"
text = "端午前十天，社学的人天天在九龙江边练龙舟。练完上岸，陈栋就拎着练习棍来找我比。他是镇海卫千户家的，棍使得比桨好。那天江风大，鼓还没停，他一棍横扫过来，我往后一仰——那一棍没落到我身上。周砚不知什么时候站到了我前头，拿胳膊硬接了。“啪”的一声，打鼓的喊：“打着人了！”鼓停了。周砚抱着胳膊蹲下去，脸白得跟纸一样，嘴里还在说：“我、我站错地方了，站错了。”陈栋的棍停在半空。他看了我一眼，又看了周砚一眼，什么也没说，把棍扛上肩，走了。"
