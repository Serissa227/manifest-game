# 重逢：1567（隆庆元年）月港开海，海澄县衙门廊下。物件：新刻的申报纸式与磨软的结拜帖。
# 基础文本不写揭开；variants：known（他叫“晚灯”，《同窗记》后半本看完了）、kept（他是最后一个知道的）。
# 缺省：我错过了月港，他寄来一份申报纸式和一封信（_missed）。
[[tracks.chapters]]
key = "reunion"
title = "开海的账"
text = "隆庆元年，朝廷准了月港的船去东西二洋。周砚考中秀才以后，再没进过考场，如今在新设的海澄县衙门里替船户写申报。他的桌子摆在衙门廊下，排队的人从廊下一直排到街上。轮到我，他抬起头，笔停在半空。他从案底下抽出一叠新刻的纸式：船名、梁头几丈、舱口几个、往哪一洋、带什么货。又从怀里摸出一样东西，摊在纸式旁边，是那张结拜帖，磨得比当年还软。“船的事，我不替你担保一句不真的话。”他把我带来的旧船契、旧货单一张一张翻过，拿朱笔把缺的凭据圈出来，“这个要补，这个要补，这个……也要补。”我们一样一样补齐。傍晚，第一份由我自己署名的申报送了进去。"
window = [[1567, 1, 1], [1567, 12, 31]]
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1567, 1, 1], to = [1567, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "zhou_yan", text = "见字如面。今年开海，月港的船可以去东西二洋了。我在海澄县衙门的廊下替船户写申报，一天写四十份，手腕写肿了，字倒越写越正。你的船这一年没回月港，我先把新刻的纸式寄一份给你：船名、梁头、舱口、往哪一洋、带什么货，一栏一栏都要填真的。哪一栏不会填，就空着，回来我教你，不许瞎填。你家那几张旧船契，我替你去县里对过底册，两张对得上，一张对不上，回来要补。补的时候我在，不收你的润笔。海澄的新码头修到了第三段，你回来时船可以靠得更近些。那张结拜帖还在我这里，磨得比当年还软，我不敢再折，夹在《同窗记》里。后半本，我看完了。纸式背面我写了一句“书上这样说”，是当年在先生门口说过的那句话的前半截。后半截，等你回来，当面问我。——周砚，隆庆元年，于海澄" }, { kind = "flag", flag = "c7_bond_zhou_yan_missed" }]

[[tracks.chapters.choices]]
key = "friend"
text = "把那张磨软的结拜帖摊开，在上头再按一次手印。"
