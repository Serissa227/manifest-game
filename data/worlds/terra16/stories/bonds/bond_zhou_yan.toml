text = "当着先生与同窗，自己把头巾摘下来，说出自己是谁。"
reply = "我把陈栋的棍往下按了按，自己解开头巾。头发散下来，一直落到背上。“我是月港林家的女儿，林晚灯。”屋里静得能听见江上的橹声。领头的翻着点名簿，册子上写的是“林家子”，他把那一行看了又看，骂了一句，拿笔划了。周砚是最后一个明白过来的。他手里的书掉在地上，张着嘴看我，看了好半天。然后他站起来，走到那个兵跟前，挡在兵和我中间：“大、大明律里……没有一条，说女子不能读书！”他的声音抖得不成样子，腿也在抖，可他没让开。陈栋的棍一直横着。兵走了以后，许采走过来，从袖子里摸出一根木簪，一声不吭地替我把头发挽了起来。"
