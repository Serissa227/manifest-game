effects = []

[[tracks.chapters.choices]]
key = "press_thumb"
text = "在他的手印旁边按下我的，按得很重。"
requires = [{ kind = "affinity", person = "zhou_yan", ge = 20 }]
hint = "他把帖子往回收了收，说要先拿给先生过目——你们还没熟到能按这个手印。"
reply = "我把拇指在印泥里摁透，往他的手印旁边一按，按得指头发白。两个红手印并排在“兄弟”两个字底下，一大一小。周砚盯着那两个手印，半天没出声，盯得我都想把手缩回来。“林兄，从今天起，我们是兄弟了。”他说“兄弟”的时候，耳朵根一点一点红上去。我问他耳朵怎么了，他说天热。"
next = "b1"
effects = [{ kind = "affinity", person = "zhou_yan", value = 2 }, { kind = "bond", person = "zhou_yan", level = "C" }]

[[tracks.chapters.choices]]
key = "laugh_at_clauses"
text = "笑他：这哪是结拜帖，分明是一张田契。"
reply = "“田契哪有这么多条！”他不服，可越看越像，拿起笔一条一条地划，划到最后只剩一条：“遇事先报一声。”我问这一条出自哪本书，他把笔一搁：“哪本都没有，是我自己想的。”我按了手印。他把划得乱七八糟的帖子吹干，折好，说改天再誊一张干净的。"
next = "b1"
effects = [{ kind = "affinity", person = "zhou_yan", value = 3 }]

# B1：1554 秋冬。物件：摊开的日记。他的苦恼只在这里出现，永远不进见闻。bond C 补签。
# 缺省：那本日记他第二天就锁起来了，钥匙拿绳子挂在脖子上。
[[tracks.chapters]]
key = "b1"
title = "没合上的日记"
text = "那天周砚去井边打水，日记摊在桌上，镇纸压着一角。我本来只想看看他是不是又在记我的账——上回他记了我借他三支笔没还——一低头，满页都是字，比他的功课还密。“我是不是不正常，竟觉得林兄好看。”底下又是一大段：看了一眼就该罚抄，抄的时候又想起来，该罚两遍……我拿另一张纸盖上去，憋着笑收好书袋，一路憋回家，蒙着被子笑了一夜。第二天他来得最早，眼睛底下两团青，一见我就问：“昨天，有、有没有人动过我的书？”没等我答，他又小声补了一句：“我那本日记……我记得是合上了的。”"
