# A1：1556 元宵（世界日历约 2 月 6 日），月港灯街。物件：“心”字少一点的灯笼。心动选项 heart +6。
# 缺省：那盏灯他自己提回去了，挂在他的书桌上方。
[[tracks.chapters]]
key = "a1"
title = "写错字的灯"
text = "元宵夜，月港满街是灯，九龙江上也漂着灯。周砚提着一盏纸灯笼在社学门口等我，一路上拿袖子把灯面遮得严严实实。走到灯摊边，我趁他不防掀开袖子——灯上八个字：“青青子衿，悠悠我心。”那个“心”字，少了一点。“这是写给谁的？”“曹、曹孟德也引过这一句，是求贤的！”他的脸涨得通红，又拿袖子盖回去，“字写错了，见不得人。”“蜡烛点起来，谁看得清少一点多一点？”“看不清也是错。送你的东西，不能靠看不清蒙混过去。”我们跟卖灯的老伯借了一支笔。周砚捏着笔，对着那个“心”字比了好几回，人挤过来又挤过去，笔尖一直悬着没落。他张了几回嘴，又咽了回去。"
