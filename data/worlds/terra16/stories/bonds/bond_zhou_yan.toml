text = "隆庆元年，朝廷准了月港的船去东西二洋。周砚考中秀才以后，再没进过考场，如今在新设的海澄县衙门里替船户写申报。轮到我，我把头发绾得整整齐齐，报上船主的名字：林晚灯。他抬起头，愣在那里，手里那叠新刻的纸式哗啦一声掉了一地。全月港，他是最后一个知道的。他蹲下去捡，捡了半天，一张也没捡齐，最后抬起头看我：“原来……原来我没有不正常。”“你本来就不正常。”我说。他蹲在地上笑出声来，笑完，从怀里摸出那张磨软的结拜帖，摊在捡回来的纸式旁边，拿朱笔把我旧船契上缺的凭据一样一样圈出来：“船的事，我不替你担保一句不真的话。”傍晚，第一份由我自己署名的申报送了进去。"

