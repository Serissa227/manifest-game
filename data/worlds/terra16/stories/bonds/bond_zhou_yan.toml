# C1：1554 春，社学。物件：写着灯谜的纸条。口头禅原句只在这里出现。
# 缺省：那个灯谜他三天以后才猜出来，跑来找我，我不在。
[[tracks.chapters]]
key = "c1"
title = "林兄的灯谜"
text = "社学开课第三天，先生把我跟一个叫周砚的排在同一张桌子。他的笔按长短排成一列，砚台擦得照得见人。我看着手痒，撕半张纸写了个灯谜推过去：“一丁点火，守到天光。打一字。”他猜了一上午，午饭也没好好吃，到下午忽然一拍桌子：“谜面有错字！书上只有‘一点火’，哪来的‘一丁点火’？这个‘丁’，写错了。”“要是真有错字，就算你赢。”他把纸条举到窗前，正面看完看背面，连背面透过来的墨迹都一笔一笔对过。对完还不放心，攥着纸条往先生那里跑，跑到门口又回头：“书上这样说，可还得问问人。”先生只看了一眼：“谜面没错。”周砚捏着纸条走回来坐下，又把那个“丁”字看了一遍。"
window = [[1554, 1, 1], [1554, 4, 30]]
