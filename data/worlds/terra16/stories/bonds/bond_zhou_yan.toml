# C7 羁绊线：周砚——林兄的灯谜（故事 2.0，A5 / E37 契约）
# 标签：BG，可恋爱的羁绊线；主角林晚灯（lin_wandeng，1540-03-23，女，在龙溪社学扮男装，同窗叫她“林兄”）。
# 人物：周砚（zhou_yan，1540-06-25，男，romance.with = f）：同桌的书呆子，较真、爱引书、一急就结巴。
#       他的苦恼（日记里“我是不是不正常，竟觉得林兄好看”）只在 B1 被“我”偷看到，永远不进见闻。
#       许采（xu_cai，1540-04-19，女，社学教读许先生的女儿）、陈栋（chen_dong，镇海卫千户之子）只在揭开那一章出场。
# 年龄：学院期两人 13—16 岁，只写在意、脸红、借口；A1 / A2 各一个心动选项（heart +6），
#       S 的 heart 选项（1556-12，两人都 16 岁）只是“再见时告诉他那一点该落在哪里”，最多握手（heart +12、crush）；
#       重逢 1567 年两人都 26—27 岁，恋人落点要 c7_bond_zhou_yan_romance + 心动 24（6 + 6 + 12）。
# 依据：史实——明代社学；1567 年（隆庆元年）月港开海、准贩东西二洋，前后设海澄县，船引按梁头丈尺征水饷；
#       明代戏文《同窗记》演梁山伯、祝英台；“青青子衿，悠悠我心”出《诗经·郑风·子衿》，曹操《短歌行》引作求贤。
#       世界线——1556 年七月官兵搜港、林家的船被烧（TERRA16 §12.4）。
#       原创——周砚一家、灯谜“一丁点火，守到天光”（谜底“灯”）、红纸结拜帖、少一点的“心”字灯笼、墨匣、点名簿上的“林家子”。
#       待核：1555 年端午、1556 年元宵在世界日历上的日子（按学院校历取约 6 月 3 日、2 月 6 日）。
# 轨道：bond_zhou_yan（request，auto=false，academy=true，由 ask:bond_zhou_yan 开启）；
#       reunion_zhou_yan（main，auto=false，由 S 的三个选项与 default 开启）；
#       wandeng_unmasked（request，auto=false，academy=true，一章 unmasked）——全游戏唯一一次写林晚灯的身份揭开，
#       由本文件 c1 的 default 与每个选项 start_track 开启。
# 缺省走向：C1—A2 玩家不回应时故事照走、没有收获；S 缺省他去县里应考没来送船（_parted），重逢照样开启；
#       重逢缺省是他寄来的一份开海以后的申报纸式与一封信（_missed）。揭开那一章缺省：被搜港的兵当众认出（known）。
# 旗标：设 c7_wandeng_unmasked_known / c7_wandeng_unmasked_kept（陈栋、许采、小蛮、黄墩、许采×小蛮的文件读）；
