# A2：1556 四到六月。物件：墨匣（school_ink_case）。《同窗记》看到一半，他开始躲“我”。不写揭开。
# bond A 的两个选项给赠礼与回忆；find_him 另给 heart +6（要已有 heart 6）。
# 缺省：那只墨匣一直放在我桌上，他躲了我一个夏天。
[[tracks.chapters]]
key = "a2"
title = "同窗记"
text = "四月里，周砚从书坊借来一本《同窗记》的戏文，说是讲两个同窗结拜的事。他摊在桌上，念得摇头晃脑：“‘草桥结拜，情同手足’——你看，跟我们一样。”念到一半，他忽然不念了，脸色一点一点变了。他把书一合，推到我这边，再也没碰。那以后好几天，他不跟我对坐，搬到靠门的空桌上去，见了我就绕路，像我是江边的水鬼。我问他，他只说：“没、没事。”有一天我到社学，桌上放着他的墨匣，黑漆面磨掉了一角，一格放墨锭，一格放擦笔的碎布，底下压着一张纸条：“墨匣借你，不必还。”"
window = [[1556, 4, 1], [1556, 6, 30]]
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1556, 4, 1], to = [1556, 6, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "s"
effects = []

[[tracks.chapters.choices]]
key = "keep_inkcase"
text = "收下墨匣，在纸条背面写“兄弟的东西，不借，算送”，夹回他书里。"
requires = [{ kind = "affinity", person = "zhou_yan", ge = 80 }, { kind = "bond", person = "zhou_yan", level = "B" }]
hint = "墨匣底下压着一张“不必还”的纸条。他正躲着你，这时候收下，倒像替他把没说的话认了下来——你们还没熟到能这样替他认。"
reply = "第二天，那张纸条从他书里不见了。周砚坐在靠门那张桌子上，背对着我坐了一上午，先生问什么他一句也没答上来。散学前，他抱着书箱走过来，在我旁边坐下，坐回了原来的位置。他什么也没解释，我也没问，只把墨匣往我们两个中间推了推。"
next = "s"
effects = [{ kind = "affinity", person = "zhou_yan", value = 2 }, { kind = "bond", person = "zhou_yan", level = "A" }, { kind = "item", item = "school_ink_case", qty = 1 }, { kind = "memory", memory = "mem-bond_zhou_yan-a2", title = "合上的《同窗记》" }]

[[tracks.chapters.choices]]
key = "find_him"
text = "收下墨匣，带上那本《同窗记》去江边找他。"
requires = [{ kind = "affinity", person = "zhou_yan", ge = 80 }, { kind = "bond", person = "zhou_yan", level = "B" }, { kind = "heart", person = "zhou_yan", ge = 6 }, { kind = "age", le = 17 }, { kind = "age", person = "zhou_yan", le = 17 }, { kind = "romance_open", romance_open = "zhou_yan" }]
hint = "墨匣太重，你们还没熟到能收下；就算收得下，去江边找他那几步，你也还迈不出去。"
reply = "他坐在渡口的石阶上看船。我把书递过去：“后半本你还没看完。”他接过书，手在抖，书页哗啦啦地响。“后半本，我不敢看。”“那就别看。先跟我回社学，墨匣我收下了。”他跟在我后头走了一路，一句话也没有，快到社学门口才开口：“林兄，你等我想明白。”我说好，我等。"
next = "s"
effects = [{ kind = "affinity", person = "zhou_yan", value = 2 }, { kind = "bond", person = "zhou_yan", level = "A" }, { kind = "item", item = "school_ink_case", qty = 1 }, { kind = "memory", memory = "mem-bond_zhou_yan-a2", title = "合上的《同窗记》" }, { kind = "heart", person = "zhou_yan", value = 6 }]

[[tracks.chapters.choices]]
key = "return_it"
text = "把墨匣还到他桌上，问他到底在躲什么。"
reply = "我把墨匣“咚”一声放在他面前：“周砚，我欠你钱了？”他吓了一跳，看看墨匣，又看看我。“我在想一件书上没有的事，”他说得很慢，“没想明白以前，不好跟你对坐。”他把墨匣又推回来：“你先用着。”"
next = "s"
effects = [{ kind = "affinity", person = "zhou_yan", value = 3 }]

# S：1556 腊月，江边茶棚。物件：磨软的结拜帖。基础文本按“未揭开”写；variants known / kept 读揭开旗标。
# 缺省：开春我出海那天，他在县里应考，没来送；结拜帖压在他的书箱里（_parted，重逢照样开启）。
[[tracks.chapters]]
key = "s"
title = "不必替自己开脱"
text = "腊月初，先生说开春不再开课了。我也要走：开春，家里剩下的最后一条鸟船要出海，我得跟船。周砚在江边的茶棚里等我，面前摆着两样东西，一本县学的考题集，一本空账簿。“我想考县学，”他说，“也想给你的船记账。两件事我想了一个月，揉不到一块儿去，不想拿一句好听的话糊弄你。”他又说起夏天躲着我的事，说那时候自己糊涂。我把他的话头截住：“免啦，不必替自己开脱。”他从怀里摸出那张结拜帖。红纸褪成了粉色，折痕磨得发软，四个角都起了毛，不知被他翻过多少遍。他把帖子摊平，用手掌一下一下地抹：“林兄，你开春就走了。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_zhou_yan" }, { kind = "flag", flag = "c7_bond_zhou_yan_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "把结拜帖重新誊一份，各执一份，约好他考中那天我的船回来。"
requires = [{ kind = "bond", person = "zhou_yan", level = "A" }]
hint = "结拜帖誊一份，就是一辈子的兄弟。你们的交情还没到能重写这张帖子；又或者，结拜一辈子的帖子，你已经跟另一个人换过了。"
reply = "周砚跟茶棚老板借了笔墨，又讨了一张红纸，一个字一个字地誊。原帖上划掉的、补上的、洇了墨的，他都照样誊过来，一笔不差。誊完，他吹干墨，把新的那份推给我：“新的给你。海上潮气重，新纸经得住。”“那旧的呢？”“旧的这一份，我留着。”他把磨软的旧帖折好，放回怀里，隔着衣裳按了按。我在新帖上按了手印，他也按了。“你考中那天，我的船回来。”“要是考不中呢？”“那就考到中。我的船等得起。”他低头笑了一下，拿袖子把新帖上的印泥又吸了一遍，怕它在海上洇开。"
next = "done"
effects = [{ kind = "bond", person = "zhou_yan", level = "S" }, { kind = "relation", person = "zhou_yan", relation = "friends" }, { kind = "memory", memory = "mem-bond_zhou_yan-s", title = "不必替自己开脱" }, { kind = "flag", flag = "c7_bond_zhou_yan_promise" }, { kind = "start_track", track = "reunion_zhou_yan" }]

[[tracks.chapters.choices]]
key = "heart"
text = "把那盏写错字的灯还给他：再见那天，告诉他那一点该落在哪里。"
requires = [{ kind = "bond", person = "zhou_yan", level = "A" }, { kind = "heart", person = "zhou_yan", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "zhou_yan", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "zhou_yan" }]
hint = "那盏写错字的灯拎在手里，你却递不出去：那一点该落在哪里，你自己心里还没数；又或者，这样的约，你已经跟另一个人有了。"
reply = "我把那盏灯从包袱里取出来，搁在桌上。纸面黄了，竹骨松了一根，灯上那个“心”字，怎么看都还是不对劲。“灯还你。”我说，“那一点该落在哪里，等再见面那天，我告诉你。”周砚盯着那个字看了很久，看得茶都凉了。“那时候我再写一次，”他说，“写对。”他伸手过来，握住了我的手，握得很紧，手心全是汗，像那年拿胳膊去接那一棍。茶棚外头起了风，帘子一下一下拍着门框。他没松手，我也没往回抽。直到老板过来续水，他才松开，把灯抱进怀里，抱得跟抱书箱一样小心。"
next = "done"
effects = [{ kind = "bond", person = "zhou_yan", level = "S" }, { kind = "heart", person = "zhou_yan", value = 12 }, { kind = "relation", person = "zhou_yan", relation = "crush" }, { kind = "flag", flag = "c7_bond_zhou_yan_romance" }, { kind = "memory", memory = "mem-bond_zhou_yan-s", title = "不必替自己开脱" }, { kind = "start_track", track = "reunion_zhou_yan" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好他考中秀才那天，我的船在月港替他放一挂鞭炮。"
reply = "“那你得在月港，”他立刻较起真来，“鞭炮要在月港放。你在海上放，我听不见。”“那你得考中。”“书上……”他刚开口，自己先摆了摆手，“算了，不拿书说。我自己说的：我一定考中。”他从空账簿上撕下一角，写了“鞭炮一挂”四个字，又写了日子——空着，等发榜再填。我把纸角收进贴身的荷包里。他看着我收好，才端起早就凉了的茶，一口喝干，好像这样就算画了押。喝完他又想起什么，把账簿翻到第一页，在页眉上写了我那条鸟船的名字：“账我还是要记的。考中以前，先记你欠我的那一挂鞭炮。”"
next = "done"
effects = [{ kind = "affinity", person = "zhou_yan", value = 2 }, { kind = "relation", person = "zhou_yan", relation = "friends" }, { kind = "flag", flag = "c7_bond_zhou_yan_own" }, { kind = "start_track", track = "reunion_zhou_yan" }]

