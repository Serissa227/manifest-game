# 揭开：1556 年七八月，官兵搜港，林家的福船被烧，搜港的人进了社学。全游戏唯一一次写林晚灯的身份揭开。
# 章节 news 只写搜港本身（kept 分支用它）；known 的结果写在 own_up 与 default 的 news 里。kept 分支永远不进见闻。
[[tracks.chapters]]
key = "unmasked"
title = "搜港的那一天"
text = "七月里的一个夜里，官兵说林家通番，把我家泊在月港的那条福船点了。火烧了一整夜，九龙江红了半边，桅杆倒下去的时候，岸上的人都叫出了声。第二天，搜港的人进了社学。领头的捧着点名簿，一个一个盘问学生是哪里人、家里做什么。问到“林”字，他停住了。他身后一个兵绕过来，盯着我的脸看了很久：“这个后生，脸怎么这么白？”说着伸手就来扯我的头巾。陈栋提着练习棍，一步跨到我前头，棍横着，一句话也没说。许采站在她父亲许先生身后，脸白得像纸，手指攥着父亲的袖子。周砚还在翻书，把《大明律》从书箱里翻出来，一页一页地找，嘴里念念有词：“保、保结……同窗互保……”"
stage = "involve"
window = [[1556, 7, 1], [1556, 8, 31]]
at = "yuegang"
cast = ["zhou_yan", "xu_cai", "chen_dong"]
speaker = "captain"
mood = "tense"
news = "月港的官兵一连搜了三天港，烧了林家一条说是通番的福船，连龙溪社学的学生都被叫去，一个一个问了来历。"
when = [{ kind = "date", from = [1556, 7, 1], to = [1556, 8, 31] }, { kind = "age", le = 17 }]

