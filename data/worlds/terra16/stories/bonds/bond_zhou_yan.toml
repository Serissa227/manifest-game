reply = "许采松开父亲的袖子，往前走了一步。“他是我舅家的表兄，”她对着那个兵，也对着她父亲说，“龙溪乡下种田的林家，跟月港那个林家八竿子打不着。他从小在我家吃饭，我看着他念书的。”许先生看着女儿，看了很久，久到那个兵都不耐烦了。然后他点了点头：“是我内侄。”领头的在点名簿那一行旁边打了个勾，带着人走了。陈栋把棍收回去，什么也没问。那天夜里，许采坐在社学后院的井台边，我去找她，她的手一直在抖，抖得端不住碗。“我头一回跟爹撒谎。”她说。周砚还蹲在学堂里收拾翻乱的书，一边收一边懊恼：“明明有一条的，同窗互保，我记得有一条……”"
