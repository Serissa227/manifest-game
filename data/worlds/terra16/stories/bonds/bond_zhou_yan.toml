at = "zhangzhou_city"
cast = ["zhou_yan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_zhangzhou_shexue" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = [{ kind = "start_track", track = "wandeng_unmasked" }]

[[tracks.chapters.choices]]
key = "give_a_hint"
text = "在纸条的空处画一盏歪歪的灯，不说破。"
reply = "我画得歪七扭八，灯罩像顶倒扣的斗笠。周砚盯着那盏灯，一直盯到先生讲完一段书，忽然“啊”了一声，袖子扫过去，砚台翻了，墨泼了半张桌子。“火、火旁边一个丁——灯！”他顾不上擦墨，先把纸条护进怀里：“林兄，你这灯画得太丑，我是被它丑出来的。”先生在上头咳了一声，他才去找抹布。"
next = "c2"
effects = [{ kind = "affinity", person = "zhou_yan", value = 3 }, { kind = "start_track", track = "wandeng_unmasked" }]

[[tracks.chapters.choices]]
key = "bet_dried_fruit"
text = "跟他赌：今天猜不出来，明天请我吃糖渍果脯。"
reply = "到散学他也没猜出来。我把谜底写给他看，他张着嘴，半天合不上。第二天一早，我桌上多了个油纸包，折得方方正正，四个角对得齐齐的，里头是漳州的糖杨桃。“愿赌服输，”他说，“《论语》里没有这一句，可我认。”我拈一片放进嘴里，甜得牙酸。他一片也没吃，坐在旁边看我吃。"
next = "c2"
effects = [{ kind = "affinity", person = "zhou_yan", value = 2 }, { kind = "start_track", track = "wandeng_unmasked" }]

# C2：1554 夏。物件：红纸结拜帖。bond C 的选项要情谊 20。
# 缺省：那张帖子他自己收着，我没按手印。
[[tracks.chapters]]
key = "c2"
title = "结拜帖"
text = "周砚说同桌也该立个约。我说那就结拜，磕个头完事。他不肯，非要写帖子，说没有帖子的结拜不作数。他铺开一张红纸写了一下午，条款越写越长：吃饭迟到算不算背约，借书不还算不算背约，借了不还又弄脏了算几回背约。写到第十一条，他咬着笔杆想“背后说对方坏话”该怎么写才不冤枉人。我趴在桌边看，看到抬头那两个字——“兄弟”——他写得特别用力，墨都透到了纸背。“这两个字怎么写这么重？”“书上的结拜帖都这么写。”他答得很快，头也没抬。最后他自己先按了手印，把帖子推到我面前，手掌压着纸边，等我。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
