text = "让一步，用她那个好听的星名，再在旁边注上领航人的叫法。"
requires = []
reply = "我写下“朱代伊”，又在旁边用小字注了“贾赫”。她凑过来看了半天：“你可真啰嗦。”可后来她自己写诗，每颗星旁边都注着两个名字，大字是好听的那个，小字是准的那个。有一回她写到一半找不着小字该叫什么，跑来敲我的舱门，敲了三下就喊：“快说，我等着押韵。”"
next = "b2"
effects = [{ kind = "affinity", person = "rania", value = 3 }, { kind = "skill", skill = "poetry", value = 8 }]

# B2：1555 年。她借去抄的伊本·马吉德手稿找不着了；那一页是母亲嫁妆箱里的东西。
[[tracks.chapters]]
key = "b2"
title = "丢了的那一页"
text = "拉妮娅借了我外曾祖父的一页手稿去抄。那是伊本·马吉德亲笔写的航路诗，一直压在母亲的嫁妆箱底，我求了母亲三天才拿出来。第二天一早，她来找我，嘴张了两回才出声：“我……找不着了。”她借东西总忘了还，这回连放在哪儿都忘了。我的脸一下子白了，半天说不出话。她比我还慌，跪在甲板上，把每一卷缆绳都解开来翻，又爬进底舱翻米袋，翻得指甲缝里全是黑的。翻到第三卷缆绳，她停住了，眼泪掉在木板上，一滴一滴，洇成一个个深色的圆点。“我赔你，”她说，“我抄一百遍赔你。”她抄得再好，也不是那一页。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "zabid_city"
cast = ["rania"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

