[[tracks.chapters.choices]]
key = "take_turns"
text = "就这样，一人一句轮流往下写，写到索科特拉。"
requires = [{ kind = "affinity", person = "rania", ge = 20 }]
hint = "她还当你看不起她只会押韵，笔推过来是赌气。这首诗，她不会真跟你轮着写。"
reply = "我写一句星高，她押一句韵，写到天亮，正好写到索科特拉。念给老领航听，他捋着胡子听完，说：“一句准，一句好听，倒也是一首诗。”拉妮娅把那张纸卷起来，从旧缆绳上拆了一截细麻线扎好，塞进我手里：“留着。以后接着写，写到哪儿算哪儿。”"
next = "b2"
effects = [{ kind = "affinity", person = "rania", value = 2 }, { kind = "bond", person = "rania", level = "C" }]

