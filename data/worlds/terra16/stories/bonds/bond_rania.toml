key = "a2"
title = "谁都唱不上去的那一句"
text = "拉妮娅说要把水手们口口相传的海歌抄成一本书，“人人看得懂的那种，不识字的也能叫人念给他听”。她拿着笔追着水手们跑，起锚的歌、摇橹的歌、收帆的歌，一句一句记。有一天她把一张纸塞给我。纸上密密麻麻全是歌，有一句旁边画了个圈，圈旁写着：“这里谁都唱不上去。”“那一句，你唱得上去。”她说。“我从来没在人前唱过歌。”“我听见过。”她看着我，“守更那天夜里，你以为我睡着了。”船在摩卡外面轻轻晃着。我拿着那张纸，那个圈画得太用力，笔尖把纸划破了一道小口。"
