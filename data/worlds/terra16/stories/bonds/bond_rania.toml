# 重逢：1561 年霍尔木兹码头。她站在货箱上念新诗，留最后一句给我；书船一半货一半书。
[[tracks.chapters]]
key = "reunion"
title = "霍尔木兹的新韵"
text = "1561 年，我的船进了霍尔木兹。码头上码着一排货箱，拉妮娅站在最高的那一只上，给水手们念新诗。她念一句，底下的水手就接一句，接错了，她拿手里的书敲着箱子喊：“错了，重来！”水手们哄笑着又接一遍。她的书船刚从红海过来，就泊在旁边，舱口敞着，一半是货，一半是书，书捆上都苫着油布。她念到最后，留了一句没念，从货箱上跳下来，带起一片尘土。她把一本抄好的航路诗塞进我手里，封皮是新的，书脊上缝着三道线。“下半句——”她停了一下，看着我，“这回你来接。”"
window = [[1561, 1, 1], [1561, 12, 31]]
at = "hormuz_port"
cast = ["rania"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1561, 1, 1], to = [1561, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "rania", ge = 18 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "rania", text = "纳吉玛：你没来霍尔木兹。我在码头上念了一整季的诗，念到搬货的脚夫都会接了，最后那一句还是没人接得上。书船的舵手打听回来，说你的船去了别处。我没问去了哪儿，反正总在海上。我托往东去的船替我打听，有个水手回来说，在马斯喀特外面见过一条船，有人站在船头举着牵星板，举得端端正正。他说不准是不是你，我说是。书船今年跑了三趟红海，吉达的书市我熟得像自家后院。抄成的第一本航路诗，我托这条去红海的船先带一页给你，剩下的等你来拿。里程我自己校过一遍，校得头疼，肯定还有错。你看出来了别笑，记下来，下回一并算账。我现在量星都量两遍，第二遍要是跟第一遍不一样，就量第三遍。你别得意，这是跟你学的。叔叔们的船还是租的，不过今年租了两条。我把账也学会了一点，信上的字，也认全了。这一页的最后一行我没写。下半句你来。——拉妮娅" }, { kind = "flag", flag = "c7_bond_rania_missed" }]

[[tracks.chapters.choices]]
