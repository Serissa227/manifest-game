# C1：1554 春，摩卡港外的船上学堂。老领航念航路诗停在半句，她抢着接，星高说低了一指。
[[tracks.chapters]]
key = "c1"
title = "抢着接的下半句"
text = "船上学堂泊在摩卡港外。天刚擦黑，老领航坐在罗经柜边念一首记航路的长诗，念到“过了亚丁往东”，忽然停下，手里的藤条朝我们一点：“下一句，谁来？”我还在心里算那一程的星高，旁边一个女孩已经跳了起来：“别停！下半句我来接。”她是哈德拉毛商人家的女儿，叫拉妮娅，上船才三天。她接得又快又响，韵脚落得干脆，水手们拍着船舷叫好。可她报的那一程里程短了，星高少算了一指。我把牵星板举到眼前，对准北边刚亮起来的那颗星。板上的绳结是母亲替我打的。“差一指，就差一百里。”拉妮娅瞪着我，脸涨得通红。满船的人都在笑，老领航笑得藤条都掉在了甲板上，也不知道是在笑她，还是在笑我。"
window = [[1554, 1, 1], [1554, 4, 30]]
cast = ["rania"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_shipboard_zabid" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "praise_then_fix"
text = "先夸她的韵押得好，再把里程改对，念给她听。"
requires = []
reply = "“你的韵比我的好听，”我说，“只是那颗星还得再高一指，里程也得跟着往远里报。”我把改过的那一句念了一遍。她抿着嘴不吭声，过了一会儿凑过来，伸手要我的牵星板：“那一指是怎么量的？”我教她把绳结咬在嘴里，板子推到手臂尽头。她举反了，下沿对着星，上沿对着海，量出来那颗星该在水底下。两个人笑倒在甲板上，老领航在罗经柜边重重咳了两声。"
next = "c2"
effects = [{ kind = "affinity", person = "rania", value = 3 }, { kind = "skill", skill = "poetry", value = 8 }]

[[tracks.chapters.choices]]
key = "finish_yourself"
text = "不让，把正确的下半句自己念完。"
requires = []
reply = "我站起来把那一句念完，星高、里程、韵脚一样不差。老领航点了点头。拉妮娅一声不吭走到船尾，背对着所有人坐到天黑透。第二天一早我刚上甲板，她已经等在罗经柜边，手里攥着一张纸，纸角都捏软了：“昨天那一句，你是怎么算的？从头讲，不许跳。”"
next = "c2"
effects = [{ kind = "affinity", person = "rania", value = 2 }]

# C2：1554 夏，季风停了，船泊在摩卡岸边。她讲叔叔在坎贝的大船；信上的字她认不全。
[[tracks.chapters]]
key = "c2"
title = "叔叔的生意"
text = "季风停了，船上学堂泊在摩卡的岸边，等秋天再走。拉妮娅天天在甲板上讲她叔叔们的生意：亚丁有三间货栈，坎贝有一条大船，“比你们领航世家的船还大，桅杆有两层楼高”。我去码头问了一个刚从坎贝回来的水手。他说那条船是有，是租的，租了两季，船主是个古吉拉特人。那天傍晚，拉妮娅拿着一封信来找我，说是叔叔从坎贝寄来的，要念给我听那条船有多大。信纸边上沾着靛蓝的染料印子。她念了两行，第三行停住了，手指在一个字上来回地划。“这个字写得太潦草，”她说，“我叔叔的字一向难看。”她又往下念，念到一半，再也念不下去了，把信纸翻过来看背面，好像下半截写在那里。"
window = [[1554, 5, 1], [1554, 8, 31]]
cast = ["rania"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "help_reply"
text = "不戳穿她，帮她把信念完，再一起给叔叔回信问清楚。"
requires = [{ kind = "affinity", person = "rania", ge = 20 }]
hint = "她把信往身后一藏：“我自己念得出来。”她还不愿意让你看见她念不全叔叔的信。"
reply = "我接过信，从她停下的地方往下念：船是租的，租期到冬天，叔叔问家里明年还租不租。拉妮娅听完没说话。我们在舱里点着灯写回信，她说一句，我写一句，问叔叔船租多少钱、能装多少包棉布。信寄走以后，她再讲叔叔的船，说的是“租来的大船”。有人笑她，她把下巴一抬：“租来的也是大船。”说完自己先笑了。"
next = "b1"
effects = [{ kind = "affinity", person = "rania", value = 2 }, { kind = "bond", person = "rania", level = "C" }]

[[tracks.chapters.choices]]
key = "point_it_out"
text = "当面告诉她，那条船是租的。"
requires = []
reply = "“那条船是租的，”我说，“码头上的水手都知道。”拉妮娅把信折起来，越折越小，转身就走。她三天没理我，在甲板上碰见了就扭过头去，吃饭坐到离我最远的那一头。第四天傍晚，她捧着一碗枣子找到我，往我面前一放：“租的就租的。你吃不吃？”"
next = "b1"
effects = [{ kind = "affinity", person = "rania", value = 3 }]

# B1：1554 秋，船要往东走。合写亚丁到索科特拉的航路诗，为北极星的叫法吵起来。
[[tracks.chapters]]
key = "b1"
title = "亚丁到索科特拉"
text = "秋天船要往东走，老领航让我们俩合写一首诗，记从亚丁到索科特拉的这一程。我管星高和里程，拉妮娅管押韵。头几句写得很顺，写到北边那颗星，两个人吵了起来。她要用诗人的叫法“朱代伊”，小山羊，念着好听；我要用领航人认的“贾赫”，海上的人一听就懂。“朱代伊押得上韵，”她说，“贾赫押什么？押你的脾气？”“写给船上人看的。船上人只认贾赫。”吵到罗经柜的灯添了两回油，她把纸往我面前一推，笔也一并推过来：“那这一句你写，下一句我写，看谁写得好。”纸上多了一块墨渍，是她刚才拍桌子时溅上去的。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "zabid_city"
cast = ["rania"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

