# S：1556 年 12 月。开春我随季风出海，她留在扎比德再学一年。那首写了三年的诗，最后一行她留着没写。
[[tracks.chapters]]
key = "s"
title = "你记哪片海"
text = "船上学堂的最后一课上完了，水手们在甲板上卷讲席用的毯子。开春我要随季风出海；拉妮娅要留在扎比德再学一年，以后跟叔叔们做书船的生意，一舱货，一舱书。她把我们写了三年的那首航路诗摊在罗经柜上。纸接了好几回，亚丁到索科特拉那一段是最早的，墨已经发灰；守更那一夜的磷光也在上面，旁边拖着一道长长的墨线。“你以后要替哪片海写诗？”她问。我还没答，她又说：“想好了再说。你这个人，一句话说出口就改不了。”诗的最后一行，她留着没写。笔搁在旁边，笔尖还是湿的。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "zabid_city"
cast = ["rania"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
