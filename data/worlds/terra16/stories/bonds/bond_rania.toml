effects = [{ kind = "start_track", track = "reunion_rania" }, { kind = "flag", flag = "c7_bond_rania_parted" }]

[[tracks.chapters.choices]]
key = "promise"
text = "约好她每抄成一页航路诗，就寄给我校里程。"
requires = [{ kind = "bond", person = "rania", level = "A" }]
hint = "替她校一辈子的里程——你张口就想答，又停住了：你们的交情还没长到那首诗那么长；要么，一辈子的校勘，你已经答应了另一个人。"
reply = "“那你可得一直在海上，”她说，“不然我寄到哪儿？”“寄到霍尔木兹。那里的人都认得我们家的船，问一声就找得到我。”她没去碰最后那一行，把纸翻到背面，写下霍尔木兹，又写下亚丁、坎贝、马斯喀特，一个港一行，写到第五个，笔没墨了。“够了，”她说，“五个港，总有一个等得到你。”她又在纸角写了一个小小的“校”字，画了个圈：“每一页你都得在这里签字，签了才算数。错一处，我欠你一首诗。”我说那她要欠我好多首。她说那就慢慢还，一首一首还。我们把那首诗卷起来，用旧麻线扎了两道。她抱在怀里，说抄成第一页就寄出去，寄不到，就一直寄。"
next = "done"
effects = [{ kind = "bond", person = "rania", level = "S" }, { kind = "relation", person = "rania", relation = "friends" }, { kind = "memory", memory = "mem-bond_rania-s", title = "你记哪片海" }, { kind = "flag", flag = "c7_bond_rania_promise" }, { kind = "flag", flag = "c7_pair_rania_zahra_taken" }, { kind = "start_track", track = "reunion_rania" }]

[[tracks.chapters.choices]]
key = "heart"
text = "撕下歌笺的一角给她，换她在最后一行写一个字，谁也不念出来。"
requires = [{ kind = "bond", person = "rania", level = "A" }, { kind = "heart", person = "rania", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "rania", le = 17 }, { kind = "romance_open", romance_open = "rania" }]
hint = "你看着最后那一行，手没有伸过去。要么你们还没走到这一步，要么这样的心意，你已经交给了另一个人。"
reply = "我把那张海歌笺拿出来，沿着折痕撕下一角，正是画着圈的那一角，“这里谁都唱不上去”只剩下了半句。我把它推过去。拉妮娅看了看那一角，没问为什么。她拿起笔，在诗的最后一行写了一个字，写得很快，写完就把纸折起来，折了三折，塞进我手里，不许我当场打开。我把歌笺的那一角放进她手心。她握住我的手，握得很紧，指甲都掐进了我的掌心。甲板上有人在喊收毯子，喊了两遍，她没松手，我也没有。那个字，我到开春上了船才打开看。看完又按原样折回去，折痕对着折痕，一点不差。"
next = "done"
effects = [{ kind = "bond", person = "rania", level = "S" }, { kind = "heart", person = "rania", value = 12 }, { kind = "relation", person = "rania", relation = "crush" }, { kind = "flag", flag = "c7_bond_rania_romance" }, { kind = "memory", memory = "mem-bond_rania-s", title = "你记哪片海" }, { kind = "flag", flag = "c7_pair_rania_zahra_taken" }, { kind = "start_track", track = "reunion_rania" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好比一比，看谁先把一整条航路写成诗。"
requires = []
reply = "“我写红海，”她说，“你写别的海。”“红海那么长，你写得完吗？”“写不完就让我的书船接着写，船走到哪儿，诗写到哪儿。”她在最后一行旁边画了一道杠，算是起跑的线，又把笔塞给我：“你也画一道。谁先写到头，谁请对方吃一年的饭。”我画了，比她那道直。她看了一眼，抢过笔，把自己那道描了一遍。"
next = "done"
effects = [{ kind = "affinity", person = "rania", value = 2 }, { kind = "relation", person = "rania", relation = "friends" }, { kind = "flag", flag = "c7_bond_rania_own" }, { kind = "start_track", track = "reunion_rania" }]

