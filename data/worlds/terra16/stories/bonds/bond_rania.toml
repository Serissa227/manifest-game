# 抢着接的下半句（bond_rania）——羁绊线，编辑标签 GL（拉妮娅纯 GL；与女主角纳吉玛可走恋爱落点）。
# 人物：拉妮娅（rania，1540-12-07 生），哈德拉毛商人的女儿，跟着领航人的船上学堂走海，季风停歇时在扎比德听课。
#       主角：纳吉玛（najma，1540-08-24 生），伊本·马吉德的曾外孙女；“我”沉静、执拗于精确，用诗记航路。
#       年龄：C1（1554 春）两人都 13；A1（1556 春）都 15；A2（1556 夏秋）纳吉玛 8 月 24 日满 16、拉妮娅 15；
#       S（1556-12）纳吉玛 16，拉妮娅 12 月 7 日才满 16——所以 S 的心动选项写成不说破的信物交换，只到握手；
#       重逢（1561）两人都 20—21。
# 结构：bond_rania（request，academy）C1 → C2 → B1 → B2 → A1 → A2 → S；S 的选项与 default 都开 reunion_rania（main，1561 霍尔木兹）。
# 羁绊阶梯：C2 help_reply 给 C，B1 take_turns 补签 C；B2 search_whole_ship 给 B，A1 finish_together 补签 B；
#       A2 keep_sheet / sing_it_now 给 A + 海歌笺（sea_song_sheet）+ 回忆。每章都有不带 bond 的选项。
# 心动：A1 let_her_sleep +6 → A2 sing_it_now +6（要 ≥ 6）→ S heart +12（要 ≥ 12）→ 重逢 love 要 ≥ 24。
#       决定表写 S +10，算下来只有 22、永远到不了 24，这里按简报改为 +12。学院期只到 heart 与 crush，S 不写 dating。
# 依据（史实）：阿拉伯领航人用牵星板（kamal）量星高，以“指”（isba‘）计，一指约合一度半有余，南北一百多英里；口头禅里的“一百里”取整数，是她的说法，不作实测；
#       北极星领航人叫“贾赫”（al-Jāh），诗文里常叫“朱代伊”（小山羊）；伊本·马吉德以长诗记航路；
#       坎贝是古吉拉特的大港，靛蓝与棉布出口；亚丁、索科特拉、马斯喀特、霍尔木兹都在这条航路上。
# 原创：船上学堂与老领航、叔叔租来的大船、那一页手稿夹在凉鞋底、罗经柜边写诗的那一夜、海歌笺上画圈的那一句、
#       最后一行写下的那个字、霍尔木兹货箱上念诗、书船。
# 归属：“骆驼走路的韵”“每天一罐蜂蜜”“扎赫拉嗓子哑”归 pair_rania_zahra，本文件一律不用；拉妮娅剪下扎赫拉批错的小册子
#       是配角线的心事，本文件不揭开、不暗示。本文件的章都没有 stage，不写 news。
# 口头禅：拉妮娅“别停！下半句我来接。”只在 C1 用一次；纳吉玛“差一指，就差一百里。”只在 C1 用一次，别处换说法呼应。
# 缺省走向（default 不显示文字，写在这里备查）：C1 老领航自己念完那一句，拉妮娅赌气到晚饭；C2 她照旧讲叔叔的大船，越讲越大；
#       B1 老领航自己写完，她嫌他押的韵难听；B2 手稿第三天在她凉鞋底下找到，皱得像干树叶；A1 她守到一半回舱里睡了；
#       A2 歌笺她自己留着，那个圈越画越黑；S 开春我出海那天她在扎比德听课，开重逢并记 c7_bond_rania_parted；
#       重逢错过 → 她托去红海的船捎来一页航路诗（来信），记 c7_bond_rania_missed。
# 共享旗标：S 的 promise 与 heart 设 c7_pair_rania_zahra_taken（配角线 pair_rania_zahra 据此改走并肩的朋友）；
#       重逢读 c7_pair_rania_zahra_together（配角线设）走 with_zahra 变体，只提一句“扎比德的一位女学者”，不展开。
#       本文件自有：c7_bond_rania_promise / _romance / _own / _parted / _landing_friend / _landing_love / _missed。
# 日程：无改动。
# 地点（2026-11-01 close-places）：C1、C2、A2 正文点名摩卡，去掉 at（不限地点）；B1、B2、A1、S 的 at 由 mocha 改 zabid_city。正文不动。

