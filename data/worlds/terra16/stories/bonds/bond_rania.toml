# A1：1556 春，季风里的夜航。罗经柜边守更写诗，她靠着我的肩睡着了。
[[tracks.chapters]]
key = "a1"
title = "罗经柜边的夜"
text = "季风鼓着帆，船在夜里走，这一夜轮到我和拉妮娅守更。罗经柜里点着一盏小灯，灯罩熏得发黄，只照得见罗盘的针和两个人的手。“守更太闷，”她从怀里掏出纸笔，“去年那首写到索科特拉就停了，接着往下写，写到古吉拉特。”我念一句星高，她押一句韵。她押得快，常常我那句还没念完，她的韵已经在嘴边等着了。写到后半夜，船划过一片磷光，浪底下亮晶晶的。“这个要写进去。”“这跟里程无关。”“跟里程无关的才好看。”又写了几句，她没声了。我转头一看，她靠在我肩上睡着了，手里还捏着笔，笔尖在纸上拖出一道长长的墨线。灯芯噼啪响了一声，她没醒。"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "zabid_city"
cast = ["rania"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

