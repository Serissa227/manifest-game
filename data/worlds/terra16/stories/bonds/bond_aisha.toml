[[tracks.chapters.choices]]
key = "heart"
text = "把自己的拓片包进她绣的笔袋里，请她替我保管到下次见面。"
requires = [{ kind = "bond", person = "aisha", level = "A" }, { kind = "heart", person = "aisha", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "aisha", ge = 15, le = 17 }, { kind = "romance_open", romance_open = "aisha" }]
hint = "这只笔袋她不会替你收着——你们还没走到这一步，或者，你的约已经许给了别人。"
reply = "我把拓片折好，塞进石榴花笔袋，照她那天的样子系好绳子，打了个结，又拉了两下，递回给她。“替我收着。”我说，“下回见面再还我。”她看看笔袋，又看看我，脸一直红到耳根。“收着可以。”她说，“不许在信里问它好不好。”“那我问钥匙好不好。”她终于笑出了声，把笔袋揣进袖子里，又把她那张拓片塞到我手上：“这张你拿着。门是我家的，别弄丢了。”她送我到巷口，手背在我手背上碰了一下，很快又缩回去了。"
