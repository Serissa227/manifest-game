# —— S：1556 年十二月，两把格拉纳达的钥匙 ——
[[tracks.chapters]]
key = "s"
title = "祖母的钥匙"
text = "到了年底，卡拉维因的课散了，回阿尔及尔的商队定在月底。阿伊莎家和我家都留着一把格拉纳达老宅的门钥匙。我家那把，三年前祖母塞进我的行囊：“读书的人，带着它。”她家那把锁在她父亲的书箱里。她说，各拓一张吧。我们在她家院子里铺开纸，拿炭条拓。她拓得细，齿上的豁口都拓了出来；我拓得急，纸皱了一角。“你家的门在阿尔拜辛？”她问。“祖母说，在一棵橘子树后头。”“我家的在王宫底下那条坡上。”她把两张拓片并排晾在窗台上，拿两块小石头压住，“门早就不在了。”风把纸角掀起来，又放下。“钥匙还在。”"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "fez"
cast = ["aisha"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

