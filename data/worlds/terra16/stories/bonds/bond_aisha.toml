# —— A1：1556 年春，窗格 ——
[[tracks.chapters]]
key = "a1"
title = "窗格后的一句"
text = "开春，我送妹妹来上课，到早了。阿伊莎在门口洒水压土，看见我，停了手。“前天卡拉维因的一位先生来借书，”她说，“他问我是替谁抄的笔记。”她把水罐放下，说得很慢，像在试这句话站不站得住：“我想有一天在讲席上教。不只是在自家屋里，教邻居的女儿。”后半句她没说，进屋去了。我在门外等。窗子装着木窗格，一格一格雕成星形，声音从格子里漏出来。她在教诗——是祖母常念、我总背不全的那首。“这一句是塔里克念过的。”她说，“谁记得下一句？”屋里没人出声。小妹小声说：“哥哥也不记得。”一屋子都笑了。"
