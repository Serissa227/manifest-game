# —— C1：1554 年春，阿尔及尔的兵还在城里 ——
[[tracks.chapters]]
key = "c1"
title = "先让孩子读"
text = "开春了，阿尔及尔来的兵还驻在城里。我一开口，巷子里就有人把窗板拉上——打小在阿尔及尔学的口音，一时改不掉。我领着两个妹妹走到阿伊莎家门口，肚子里备好了一套说辞，等她问我父亲是做哪一行的。她没问。她蹲下来，蹲得跟最小的那个一样高：“你叫什么？”我替妹妹答了。阿伊莎抬起一只手，眼睛没离开孩子：“让她自己说。”小妹攥着我的衣角，憋了好一会儿，把自己的名字连着父亲、祖父的名字一口气报完，最后一个字差点没接上气，脸涨得通红。屋里几个女孩没有一个笑。阿伊莎这才站起来看我。她从墙边拿过一块石板、一截白垩，塞到我手里。“你扶着，她写。”"
window = [[1554, 2, 1], [1554, 4, 30]]
at = "fez"
cast = ["aisha"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_fez_qarawiyyin" }, { kind = "date", from = [1554, 2, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "hold_slate"
text = "蹲下去替妹妹扶住石板，一句话也不插。"
reply = "小妹的第一个字写歪了三回，白垩断了一截。我的手搭在石板边上，一动没动，嘴也闭得紧紧的——这比让我在船头站一夜还难。阿伊莎在旁边看了一会儿，把断掉的那截白垩捡起来，放回我手心：“扶石板的人，比写字的人难当。”她转身去看别的孩子，又补了一句，“下回还请你来扶。”"
next = "c2"
effects = [{ kind = "affinity", person = "aisha", value = 4 }]

[[tracks.chapters.choices]]
key = "recite_poem"
text = "背一段祖母教的安达卢斯诗，逗孩子们笑。"
reply = "我站起来，学着祖母的腔调背那首写赫尼尔河的诗，手还跟着比画。背到第三句，脑子里一空，漏了。阿伊莎头也没抬，替我往下念，一字不差——她家也背这首。女孩们笑成一团，小妹笑得最响。“你祖母教的没错，”阿伊莎说，“是你记岔了。”被人当场补了诗，我倒不觉得丢脸，回去的路上，把漏掉的那句念了三遍。"
next = "c2"
effects = [{ kind = "affinity", person = "aisha", value = 3 }, { kind = "skill", skill = "poetry", value = 6 }]

# —— C2：1554 年夏，一筐缠到一半的线 ——
[[tracks.chapters]]
key = "c2"
title = "两个上午"
text = "织工家的女儿连着三天没来。阿伊莎托人去问，回话说她母亲要她在家缠线，往后不来了。“你陪我去一趟。”阿伊莎说，“你会说话。”那家在染坊街后头，院里摆着一架纺车，脚边一筐线缠了一半，线头搭在筐沿上。那位母亲脚下踩着纺车不停，眼睛也不抬：“识字能当饭吃？她多缠一筐，家里多一块面饼。”我张嘴要接，阿伊莎先开了口，声音很平：“她缠线的时候，账是谁记的？”纺车慢了下来，停了。母亲低头看那只筐。筐沿上刻着一道一道的口子，一道是一筐，刻到后来挤成一片，她自己也数不清了。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "fez"
cast = ["aisha"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
key = "count_wages"
text = "替那位母亲算一笔账：会记账的织工，一年能多挣多少。"
requires = [{ kind = "affinity", person = "aisha", ge = 20 }]
hint = "这笔账轮不到你开口——阿伊莎还没把学生家里的事放心交给你。"
reply = "我掰着手指头算：线行按斤收线，压秤压掉的，少找的零钱，一年下来够买两筐好羊毛。母亲不信，叫我再算一遍。我又算了一遍，数没变。她盯着筐沿上那些口子看了很久：“一个礼拜，两个上午。多一个都不行。”回去的路上，阿伊莎走在前头：“算账的是你，开口的是我。”她回头看了我一眼，“正好。”"
next = "b1"
effects = [{ kind = "affinity", person = "aisha", value = 4 }, { kind = "skill", skill = "negotiation", value = 4 }, { kind = "bond", person = "aisha", level = "C" }]

[[tracks.chapters.choices]]
key = "play_oud"
text = "先借邻居的乌德琴弹一曲，把气氛弹软。"
reply = "隔壁的乌德琴弦松了，我拧了半天才弹成调。母亲笑了，手里的线跟着拍子绕，还哼了两句。可曲子一停，说到上学，她照样摇头。阿伊莎谢过她，领我走了。第二天傍晚她来还琴，顺口说：“两个上午。”我问她怎么说动的。“又去了一趟，”她说，“坐着帮她缠了一下午线。”"
next = "b1"
effects = [{ kind = "affinity", person = "aisha", value = 3 }, { kind = "skill", skill = "oud_playing", value = 6 }]

# —— B1：1554 年秋，萨阿德家打回非斯 ——
[[tracks.chapters]]
key = "b1"
title = "书从哪里来"
text = "九月，萨阿德家的人打回了非斯，阿尔及尔的兵连夜撤走。城里敲着鼓过节，听见我这种口音的，都要回头多看两眼。我走路把头埋得更低了。父亲的船从海上回来，捎来一箱书，说是货里挑剩的。我扛着它穿过半个城，放在阿伊莎家的院子当中，像放下一份大礼。她翻开最上面那本。扉页上一行字：瓦伦西亚，米格尔·卡西姆。墨色还新。“你家的船只拿货，我知道。”她用指尖按着那行字，“可这一页上写着一个人。”“书就是货。”我说。她没跟我争，又翻开第二本、第三本，每本扉页上都有名字。翻完，她合上箱盖，手按在上头。“学生等着用，我留下。这本书可以借，下一位也在等。”她抬起头，“这些名字，你记得住吗？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "fez"
cast = ["aisha"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

