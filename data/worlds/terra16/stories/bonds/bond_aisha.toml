[[tracks.chapters.choices]]
key = "own"
text = "收好自己的拓片，各走各的：她留在非斯，我回海上，谁也不许诺。"
reply = "“这样也好。”她点点头，从窗台上揭下我那张拓片，“不用掰着指头等船。”她拿过笔，在拓片背面写了一行，写完对着吹干，才叠好递给我。我没当场看。商队出了城门，我在驼背上打开——是那首诗的最后一句。那首诗我背了这些年，一到后半截就乱，从来没背到过那儿。我把拓片翻过来，钥匙的齿朝上，那句诗朝下，夹进了随身的书里。"
