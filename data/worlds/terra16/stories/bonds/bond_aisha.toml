# C7 羁绊线重写（2026-10-11，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BG（阿伊莎只对男性开放；恋爱只对主角塔里克）。适用主角：tariq（塔里克·加尔纳蒂）。
# 人物：阿伊莎 aisha（1541-08-13，格拉纳达流亡学者的女儿，在非斯安达卢斯区的家里教邻里女孩识字，也教塔里克的两个妹妹）；
#   塔里克 tariq（1540-01-02，主角“我”）。学院期 1554—1556：塔里克 14—16 岁，阿伊莎 12—15 岁；1556-12 的 S 章她 15 岁。
#   重逢 1564：塔里克 24 岁，阿伊莎 22—23 岁，双方都已成年。生年相差不到两年。
# 依据：
#   史实——1554 年 1 月瓦塔斯家的阿布·哈松借阿尔及尔的奥斯曼兵进入非斯，城里人对阿尔及尔口音侧目（c1）；
#         同年 9 月萨阿德家的穆罕默德·谢赫打回非斯，阿尔及尔兵撤走（b1）；格拉纳达流亡者家里留着老宅的门钥匙（s）；
#         瓦伦西亚的摩里斯科人常把受洗名与阿拉伯姓氏写在一起。
#   待核——非斯经学院侧室开女子讲席的具体先例（重逢里只写“一座经学院的侧室”，不点名哪一座）。
#   原创——阿伊莎一家与她的学堂；织工家的女儿与筐沿上的刻痕；书箱与扉页的原主名单（米格尔·卡西姆）；
#         水手家门上的催租木牌；石榴花笔袋；两张钥匙拓片；那首背漏的安达卢斯诗（不引原文）。
#   口头禅：阿伊莎“这本书可以借，下一位也在等。”只在 b1 用原句；s 的 promise 回应与重逢的 give_books 回应、来信各用一次改过字句的呼应。
#     塔里克“只劫货，不劫人。”只在 a2 用原句；b1 由阿伊莎换话说出。
#   秘密：阿伊莎想办自己的讲席——a1 由她自己说出一半，重逢里实现；本线没有见闻（章节都不是 stage），不进任何 news。
#   与简报的出入：重逢 the_key 的选项改为“拿出她当年给我的拓片，问她我那张还收不收着”——s 的 heart 分支里，
#     我的拓片连同笔袋已交给她保管，重逢时在她手里，不在我手里。效果与门禁照简报。
# 缺省走向：c1—a2 不在场只是没有收获，故事照走；s 不在场 → 设 c7_bond_aisha_parted，照样开启重逢；
#   重逢不在场 → 阿伊莎来信（讲席开了，二十一个学生，附书单），设 c7_bond_aisha_missed。
#   友情落点：给她的讲席送书的老朋友（friends）；恋爱落点：s 的 heart 交换信物且心动 ≥ 24、1564 年双方成年（lovers）。
# 心动来源：a1 finish_line +6，a2 stay_summer +6（要求已有 6），s heart +12（要求已有 12）——合计 24，正好是重逢的门槛。
# 设旗标：c7_bond_aisha_promise / _romance / _own / _parted（s），c7_bond_aisha_landing_friend / _landing_love / _missed（重逢）。
# 读旗标：c7_bond_aisha_romance（重逢 the_key）。不读写其他文件的共享旗标。本线不写娜拉（她与阿伊莎的姐妹线是 tie_new_nala_aisha）。

