text = "把每本书原主的名字抄成一张单子交给她。"
reply = "我借了她的笔，坐在台阶上，把十一本书的扉页一本本抄下来：名字，城，有的还写着年份。她把单子钉在墙上。第二天上课前，她叫女孩们一个一个先念一遍。我在门口听她们念，念得磕磕绊绊。念到第七个，是个女人的名字，我就出去了。"
next = "b2"
effects = [{ kind = "affinity", person = "aisha", value = 4 }, { kind = "skill", skill = "calligraphy", value = 4 }]

[[tracks.chapters.choices]]
key = "take_crate_back"
text = "说要把整箱书搬回去，等找到原主再送来。"
reply = "我弯腰去抬箱子，她一只手按住箱盖：“学生今天就要书。”原书她收着，找到原主就还；孩子们用的，她另抄一份。她当场把书一本本搬出来，码在窗台上。我扛着空箱子穿过半个城回去。来的时候装满书，没觉得怎样；空箱子倒压得肩膀发疼。"
next = "b2"
effects = [{ kind = "affinity", person = "aisha", value = 3 }]

# —— B2：1555 年，海峡里被劫的那条船 ——
[[tracks.chapters]]
key = "b2"
title = "缺课的那一个"
text = "坐第二排的那个女孩十天没来了。“十天。”阿伊莎说，“我去她家问过。”她父亲是水手，船在海峡里叫阿尔及尔的船劫了。人放回来了，工钱没了，房租交不上。她说这些的时候在削笔，没看我，没有一句怪罪。削完了，才问：“货没了，船上的人吃什么？”我答不上来。第二天我去城外阿尔及尔商人落脚的客栈问了一圈。劫那条船的船长，名字我认得——每年开斋节他都来我家吃饭，还送过我一把小刀。回城时我绕到那户人家门口。门板上钉着一块木牌，钉得歪歪的，写着欠几个月的租，最后一行是期限。我站在木牌前，把那几个数字念了两遍。"
