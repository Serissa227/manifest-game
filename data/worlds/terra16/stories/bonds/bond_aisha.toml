# —— 重逢：1564 年，非斯的讲席 ——
[[tracks.chapters]]
key = "reunion"
title = "多出来的名字"
text = "我从阿尔及尔带了一箱书，走了十几天陆路到非斯。阿伊莎的讲席开在安达卢斯区一座经学院的侧室里。来听的不只是邻居的女儿：后排坐着两个织工的妻子，膝上也放着石板。我把箱子打开，每本扉页上都写了来处。她先挑，挑出一本退给我：“太难，等她们再大两岁。”她领我到墙边。墙上钉着那箱书原主的单子，纸都黄了。瓦伦西亚，米格尔·卡西姆，后面添了一行新墨：书已还。往下数，这样的新墨有三行。“找了十年，找着三个。”她把退回的那本放在我手上，“那年夏天说好的，你还欠我。这些年，你劫的是谁的货？”"
window = [[1564, 1, 1], [1564, 12, 31]]
at = "fez"
cast = ["aisha"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1564, 1, 1], to = [1564, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "aisha", text = "塔里克：讲席开了，在安达卢斯区一座经学院的侧室里。二十一个学生，最大的那个比我母亲还大两岁，头一天把石板拿反了，第二天就自己正过来了。附一张书单，按难易排好，难的在后头，别买错。墙上那张单子又找着了三个人，书都还回去了；米格尔·卡西姆是头一个，他在拉巴特，回了一封信，说那本书他小时候读过三遍。你那年夏天欠我的话，我还记着账。书架上一直留着空位，后头总有人等着——这一回，等的人是你。阿伊莎" }, { kind = "flag", flag = "c7_bond_aisha_missed" }]

[[tracks.chapters.choices]]
key = "give_books"
text = "把这一箱交给她的讲席，答应以后每年送一批。"
reply = "我把这些年的船一条一条说给她听：劫过谁，放过谁，哪条船上的人后来在阿尔及尔被我赎了出来。她听完，没说好也没说不好，叫学生们坐好，当着她们的面，把每本书扉页上的来处念了一遍。念到一本从我父亲船上来的，她也没停，念得跟别的一样清楚。散了课，她把那张原主单子取下来，在最底下添了一行：今年的书，塔里克送。“每年一批。”她把单子钉回墙上，“后头还有人排着队，你别迟到。”我说迟到了罚什么。她想了想：“罚你扶石板。”"
