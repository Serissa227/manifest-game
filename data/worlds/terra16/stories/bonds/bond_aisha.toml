# —— A2：1556 年夏，石榴花笔袋 ——
[[tracks.chapters]]
key = "a2"
title = "绣花的笔袋"
text = "六月，父亲来信，叫我回阿尔及尔，暑里跟船出一趟海——十六岁了，该上船了。我去阿伊莎家辞行。她听完，没说话，从针线篮底下拿出一只小袋：青布的，袋面上绣着一枝石榴花，针脚密得看不见底布。“装笔的。”她说，“装不下战利品。”我伸手去接，她却没松手。“别去。”她头一回开口要我做什么。我愣了愣，笑着说出那句在阿尔及尔说了很多年的话：“只劫货，不劫人。”“那你回来的时候，”她说，“告诉我这一回劫了谁的货。”她没再劝。袋口的绳子松着，她低头替我系好，打了个结，又拉了两下，看它牢不牢。"
