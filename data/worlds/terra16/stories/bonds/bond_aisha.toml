[[tracks.chapters.choices]]
key = "promise"
text = "交换拓片，约好每次靠岸都给她的学生带一本书，扉页写清从哪里来。"
requires = [{ kind = "bond", person = "aisha", level = "A" }]
hint = "你已经许过别人一生一次的约——这张拓片，你只能当纪念收下。"
reply = "我把我那张递过去，她把她那张递给我。她把我的夹进她父亲那本最厚的书里，压平了。“每次靠岸，一本。”她说，“扉页上写清楚：从哪条船上来，原来是谁的。”“要是正经买来的呢？”“那就写哪个书摊，花了多少。”她已经拿过一张纸写书单：先是识字的，再是算术的，再是诗。写到第七本，她停下想了想，又添了一本给小妹的。“头一本别让她们等太久。”我把她的拓片折成四折，放进石榴花笔袋，大小正好。她写满了半张纸，墨还没干就塞给我，叫我路上背熟。"
