# S：1556 年 12 月，河口石堤。吉里的课散了；“河口给我留个位置，我会来。”
[[tracks.chapters]]
key = "s"
title = "河口留个位置"
text = "十二月，吉里的课散了。过几天有船回特尔纳特，我搭那一条；达昂要去望加锡，那边船多，木料也便宜。那堆刻了记号的木头，他说会找人一起运过去。最后一个傍晚，我们坐在河口的石堤上，脚底下是退潮露出来的泥滩，招潮蟹举着一只大螯跑来跑去。他把攒钱的小布袋掂了掂，又塞回腰里。“到了望加锡，先替人跑两年。”他说，“然后造船。”我问造好了去哪里。他看着海，没答这一句。过了一会儿才说：“你回特尔纳特，河口那么多泊位——”他转过头来，“河口给我留个位置，我会来。”潮水正往回涨，一点一点漫过蟹洞。他在等我回话。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "tender"
news = "吉里的课散了，格雷西克河口的石堤上，布吉斯水手达昂和特尔纳特来的同学坐到潮水涨上来。听说过几天他就去望加锡。"
when = [{ kind = "date", from = [1556, 12, 1], to = [1556, 12, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "start_track", track = "reunion_daeng" }, { kind = "flag", flag = "c7_bond_daeng_parted" }]
news = "吉里散学那几天，有个布吉斯水手每天傍晚坐在格雷西克河口的石堤上，等一个没来的同学，后来搭船去了望加锡。"

[[tracks.chapters.choices]]
key = "promise"
text = "答应他：特尔纳特的河口，给他的船留一个泊位。"
requires = [{ kind = "bond", person = "daeng", level = "A" }]
hint = "这样的泊位，只留给交情到了头的人；要不然，就是你这辈子唯一的约已经给了别人。这一回，只能在岸上目送他的船。"
reply = "我说泊位我留，特尔纳特河口最好的那一个。达昂摇头：“留在上风。下风的位置，我不停。”我说上风那几个泊位，停的是王族的船。“那正好。”他说得一本正经，像在跟人议木料的价。我笑出声来，伸出手掌。他看了看，也伸出手，啪地拍上来。他的掌心全是茧，绳子勒出来的，一道一道，硬得像船板。拍完他没马上收手，把我的手翻过来看了看：“你的也有了。”我低头看，是两年打结勒出来的，薄薄一层。潮水涨到石堤脚下，他站起来，拍掉裤腿上的泥：“上风。别忘了。”"
next = "done"
effects = [{ kind = "affinity", person = "daeng", value = 5 }, { kind = "bond", person = "daeng", level = "S" }, { kind = "relation", person = "daeng", relation = "friends" }, { kind = "flag", flag = "c7_bond_daeng_promise" }, { kind = "flag", flag = "c7_pair_raja_muda_daeng_taken" }, { kind = "memory", memory = "mem-bond_daeng-s", title = "河口留个位置" }, { kind = "start_track", track = "reunion_daeng" }]

[[tracks.chapters.choices]]
key = "heart"
text = "告诉他：我要留的，不只是一个泊位。"
requires = [{ kind = "bond", person = "daeng", level = "A" }, { kind = "heart", person = "daeng", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "daeng", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "daeng" }]
hint = "潮水漫过了蟹洞，这句话还是没说出来——你们还没走到那一步；也许那个一辈子只许一回的约，你已经许出去了。"
reply = "话说出口，我自己先愣住了。达昂也没动，看着我，看了很久，久到一只招潮蟹从他脚边爬过去，又爬回洞里。“我知道。”他说。他伸过手来，握住我的手，握得很紧，指节都发了白。他的手心是烫的。潮水漫上石堤脚，打湿了鞋，他没挪，我也没挪。“船造好那天，我先来特尔纳特。”他说，“别的话，等那天再说。”“那天是哪天？”“我也不知道。”他终于笑了一下，“所以你得等。”天黑透了他才松手。走回学院的路上，他一直走在我靠海的那一边，替我挡着从海上来的风。"
next = "done"
effects = [{ kind = "heart", person = "daeng", value = 12 }, { kind = "relation", person = "daeng", relation = "crush" }, { kind = "bond", person = "daeng", level = "S" }, { kind = "flag", flag = "c7_bond_daeng_romance" }, { kind = "flag", flag = "c7_pair_raja_muda_daeng_taken" }, { kind = "memory", memory = "mem-bond_daeng-s", title = "河口留个位置" }, { kind = "start_track", track = "reunion_daeng" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好等两人都有了自己的船，在海上比一程。"
reply = "达昂眼睛亮了一下：“比哪一段？”我说从望加锡到特尔纳特，顺风逆风都算。“输的请喝棕榈酒。”他想了想，又补一句，“一整罐。”我说一言为定，又问要是两条船一起到呢。他摇头：“不会一起到。风总站在一边。”他抬头看河口那根挂灯笼的竹竿，竹竿上的布条正往北飘，“到时候，看它站在谁那边。”走之前，他把我打结的手艺又考了一遍。结打完，他拽了拽，点头：“上了海，别给我丢人。”我说你也一样，别输给一个王子。他哼了一声，算是认了。"
next = "done"
effects = [{ kind = "affinity", person = "daeng", value = 2 }, { kind = "relation", person = "daeng", relation = "rivals" }, { kind = "flag", flag = "c7_bond_daeng_own" }, { kind = "memory", memory = "mem-bond_daeng-s", title = "河口留个位置" }, { kind = "start_track", track = "reunion_daeng" }]

