at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "tender"
news = "格雷西克河口傍晚常有条小船慢慢进港，掌舵的换成了特尔纳特来的学生，布吉斯水手达昂抱着胳膊站在一边，一路不出声。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

