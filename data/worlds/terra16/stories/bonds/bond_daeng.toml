# B1：1554 年秋，河口竞舟。胜负已定，他赢；再走一次最后那道弯。
[[tracks.chapters]]
key = "b1"
title = "最后一道弯"
text = "秋天，格雷西克河口赛小船，吉里的学生一人领一条。我和达昂分在两头。一路上我都咬着他的船尾。到最后一道弯，风从岸上斜着压过来，我的帆收晚了，船身一歪，水漫上船舷。等我把船扶正，他已经冲过了插旗的竹竿。岸上的人喊他的名字。他没举手，也没回头看那面旗，掉转船头划回来，停在我旁边：“再走一次最后那道弯。”“名次都定了。”“不计名次。”他抬手指了指我的帆，“只看你什么时候收。”他自己的帆还鼓着，被风撑得满满的，帆角上补过的那一块颜色比别处深。他就让它那么鼓着，等我把船划回弯口。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "cheerful"
news = "格雷西克河口的秋季竞舟，布吉斯少年达昂拿了头名，彩头都没去领，掉头就划回最后一道弯，陪输了的人重走了一遍。"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

