# B2：1555 年，木料场。船户的契约；他早量好的木料，龙骨上的刻痕。
[[tracks.chapters]]
key = "b2"
title = "自己的船钱"
text = "开年，格雷西克有个船户找上达昂，说愿意出钱替他造一条船，条件是十年里只替自家跑一条线：格雷西克到望加锡，来回运米和布。达昂没答应，也没回绝。那天傍晚他带我去河边的木料场，走到最里头一堆，蹲下拨开上面盖的棕榈叶。底下几根木头上都刻着记号，深浅不一，像是刻了好几回。“龙骨。”他摸着最长那根，“两边的肋材。这几根做船板。”他一根一根数过去，每数一根，就用拇指按一下那道刻痕，“够一条小船。钱差一半。”他从腰上的绳圈里抽出一张折得发软的纸，是船户的契约，递到我面前，手却不松：“你读得比我快。你告诉我该看哪几条——别告诉我签不签。”"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "tense"
news = "格雷西克有个船户放话，要替布吉斯水手达昂出钱造船，只要他十年里只跑格雷西克到望加锡这一条线。码头上都在猜他签不签。"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

