# A1：1556 年春，河口傍晚。他把舵交给“我”，站在一臂之外；磨得发亮的舵柄。
[[tracks.chapters]]
key = "a1"
title = "让舵的一刻"
text = "开春后一个风小的傍晚，我们把船从河口往外带。走到一半，达昂把舵柄往我这边一推，自己退开一步，站在一臂之外。“你说去哪儿，我说怎么去。”他抱起胳膊，“今天反过来——你说怎么去。”他把该叫他的时候挨个讲清：帆角抖起来，叫他；船头往下风偏、拉两下拉不回来，叫他；水色发浑、底下见沙，叫他。“别的时候，别叫。”河口的水被夕阳照成金色，一层一层往岸上推。舵柄被他握了两年，手握的那一截磨得发亮，还留着他掌心的热。我攥上去，船轻轻往右一偏。他没动，只说：“觉出来了？它在问你。”"
