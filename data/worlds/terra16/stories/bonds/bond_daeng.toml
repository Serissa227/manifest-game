# 重逢：1565 年，望加锡港。他自己的船，桅顶褪色的辨风绳，龙骨上的刻痕；先端一碗水。
[[tracks.chapters]]
key = "reunion"
title = "他自己的船"
text = "望加锡港里的船挤得桅杆连成一片林子。达昂的船泊在最外一排，不大，单桅，船尾高高翘起，新漆还没被海晒褪。桅顶系着一根辨风的细绳，两股拧成一股，褪得分不清哪一股是谁的。他看见我，没喊，先转身进舱，端出一碗水递过来：“喝了再上。”我喝完，他才伸手把我拉上船，从船头带到船尾，每根绳都说得出来处：这根是在格雷西克拿三天工换的，那根是一个马来船长跟他打赌输掉的。走到船中，他蹲下去，拍了拍龙骨露出来的那一截。那几道刻痕还在，最浅的那一道也还看得出。“九年。”他说，“木料一根没换。”他站起来，朝我泊在港外的船看了一眼：“你那条，如今舵交给谁？”"
window = [[1565, 1, 1], [1565, 12, 31]]
at = "makassar"
cast = ["daeng"]
speaker = "captain"
mood = "cheerful"
news = "望加锡港最外一排泊着布吉斯船主达昂的单桅新船，今年有个远道来的船长上了他的船，从船头一直看到船尾。"
when = [{ kind = "date", from = [1565, 1, 1], to = [1565, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "daeng", text = "船造好了。单桅，龙骨还是格雷西克那一根，刻痕一道没刨。桅顶系着辨风的绳，这几天它往东飘，正好往你那边走。上风的泊位，你还留着吗？——达昂（刻在一片棕榈叶上，托一条往东去的布吉斯船带到）" }, { kind = "flag", flag = "c7_bond_daeng_missed" }]
news = "望加锡港新下水一条单桅的布吉斯船，船主达昂托往东去的船捎了一片棕榈叶，码头上的人说，是问一个泊位。"

[[tracks.chapters.choices]]
key = "sail_together"
text = "跟他的船结伴，一起跑一趟马鲁古。"
reply = "我们在望加锡装了米和布，结伴往东走。他的船比我的轻，顺风时一不留神就拉出去半里，可每到傍晚，他总落了帆等着，等我的船跟上来，两条船的灯隔着一段水对着亮。第五天下了一场雨，我隔着雨听见他在那边喊布吉斯号子，喊得满船的桨都齐了。走到第九天，看见了特尔纳特的火山。进河口时，他的船径直往上风那一排泊位去，停进王族那几艘大船中间。守港的人追出来嚷。“问他。”达昂站在船头，指着我，“他是这儿的王子。”这是我头一回不嫌这个称呼。那天夜里我们在码头上分一罐棕榈酒，他说下一趟去万丹，问我去不去。"
next = "done"
effects = [{ kind = "affinity", person = "daeng", value = 5 }, { kind = "relation", person = "daeng", relation = "friends" }, { kind = "flag", flag = "c7_bond_daeng_landing_friend" }, { kind = "memory", memory = "mem-bond_daeng-reunion", title = "他自己的船" }]

[[tracks.chapters.choices]]
key = "race_him"
text = "当场约他比一程，从望加锡跑到格雷西克。"
reply = "他连手里的水碗都没放下：“现在？”第二天天没亮我们就出了港。头两天我咬得很紧；第三天过了一片浅滩，他抄进一条我不知道的水道，从那以后，我只看得见他的帆。我到格雷西克时已近傍晚。他坐在码头上，脚边一罐棕榈酒，已经下去了一截。看见我，他把另一只碗推过来，碗里倒得满满的。“赢了半天。”他说，“风站在我这边。下回未必。”我坐下喝酒，问那条水道是谁教他的。他想了想：“你下回赢了，我就告诉你。”不远处就是当年竞舟的河口，潮水正往回涨，最后那道弯还在老地方。"
next = "done"
effects = [{ kind = "affinity", person = "daeng", value = 3 }, { kind = "relation", person = "daeng", relation = "rivals" }, { kind = "flag", flag = "c7_bond_daeng_landing_rival" }, { kind = "memory", memory = "mem-bond_daeng-reunion", title = "他自己的船" }]

[[tracks.chapters.choices]]
key = "stay_aboard"
text = "那晚留在他的船上，把当年河口那句话说完。"
requires = [{ kind = "flag", flag = "c7_bond_daeng_romance" }, { kind = "heart", person = "daeng", ge = 24 }, { kind = "age", ge = 18 }, { kind = "age", person = "daeng", ge = 18 }, { kind = "romance_open", romance_open = "daeng" }]
hint = "当年在河口没说到那一步，今天这句话，只能留在心里。"
reply = "夜里港里的灯一盏一盏灭了。我们坐在船尾，脚垂在舷外，水轻轻拍着船板。我把九年前在河口没说完的话说完了。说得不好，比我在吉里念过的哪一首班顿都笨。达昂听着，没打断。等我说完，他才开口：“这句话，我等了九年。”他低头看着水，“其实那天就听见了。”“那你还让我等？”“船没造好。”他说，“说好船造好那天，我先去特尔纳特。结果你先来了。”他的肩靠过来，抵着我的肩，就那么靠着。后半夜风从东边转到北边，桅顶那根细绳跟着慢慢偏过去。我们一直坐到天亮，看它在晨光里飘向南边。"
next = "done"
effects = [{ kind = "affinity", person = "daeng", value = 5 }, { kind = "relation", person = "daeng", relation = "lovers" }, { kind = "flag", flag = "c7_bond_daeng_landing_love" }, { kind = "memory", memory = "mem-bond_daeng-reunion", title = "他自己的船" }]

[[tracks.chapters.variants]]
key = "with_raja_muda"
when = [{ kind = "flag", flag = "c7_pair_raja_muda_daeng_together" }]
text = "望加锡港里的船挤得桅杆连成一片林子。达昂的船泊在最外一排，不大，单桅，船尾高高翘起，新漆还没被海晒褪。桅顶系着一根辨风的细绳，两股拧成一股，褪得分不清哪一股是谁的。他看见我，没喊，先转身进舱，端出一碗水递过来：“喝了再上。”他带我从船头看到船尾，每根绳都说得出来处。走到船中，他拍了拍龙骨，那几道刻痕还在：“九年。木料一根没换。”舵柄底下压着一封信，封口是柔佛的火漆。他看见我在看，也不藏：“拉惹·穆达写的。”停了一下，又说，“他是我身边的人。”他把信往里推了推，朝我泊在港外的船看了一眼：“你那条，如今舵交给谁？”"
