# A2：1556 年夏秋，码头。两股棕榈纤维拧成的辨风绳；一股是他的，一股是“我”的。
[[tracks.chapters]]
key = "a2"
title = "辨风的绳"
text = "东南风吹了一整个夏天。一天下了课，达昂在码头上叫住我，摊开手心：一根细绳，比小指还细，两股棕榈纤维拧在一起，一股发黄，一股旧得发灰。“系在桅顶，风往哪边，它就往哪边飘。”他说，“没挂旗的船，也看得出风。”我认出了那股发灰的。前年秋天竞舟，我那条船上换下来的帆绳，我扔在船坞角落里，以为早被人拿去烧火了。“一股是我的。”他把两股掰开一点给我看，又拧回去，“一股是你的。”他把绳子在指头上绕了两圈，又松开：“以后不管上谁的船，系上它，就知道风从哪边来。”"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "tender"
news = "格雷西克码头上的人说，布吉斯水手达昂这个夏天总在编一根细绳，编了拆、拆了又编，问他编来做什么，他只说看风。"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

