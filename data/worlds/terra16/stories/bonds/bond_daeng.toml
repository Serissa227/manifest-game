effects = []

[[tracks.chapters.choices]]
key = "learn_knot"
text = "请他再教一遍，我打到他拽不松为止。"
reply = "我打了五遍。前四遍他都是一拽就开，一个字不多说，把绳头递回来。第五遍他两手攥住绳子往外一扯，结纹丝不动。他点点头：“可以上船了。”我问上谁的船。他拿脚跟在甲板上跺了跺：“先上这条。”停了一下，又说：“等我有了自己的，再说。”"
next = "c2"
effects = [{ kind = "affinity", person = "daeng", value = 3 }, { kind = "skill", skill = "knotwork", value = 8 }]

[[tracks.chapters.choices]]
key = "pantun_back"
text = "照班顿的规矩，回他四句。"
reply = "我清了清嗓子，用吉里集市上对歌的调子念：“风不认得王子，浪不认得船头；结打松了要走，绳子认得手。”同学们拍着船舷叫好。达昂愣了一下，笑出声来，那是我头一回听他笑：“最后一句还行，前两句是废话。”我说班顿的前两句本来就是拿来押韵的。他把绳子往我怀里一扔：“那你押韵的工夫，拿来打结。”"
next = "c2"
effects = [{ kind = "affinity", person = "daeng", value = 4 }, { kind = "skill", skill = "poetry", value = 4 }]

# C2：1554 年夏，船坞。闭眼敲船板；修船单上记的是“我”的名字。
[[tracks.chapters]]
key = "c2"
title = "哪块板在响"
text = "那条布吉斯船上了坞，船主说底下有几块板松了，可说不出是哪几块。达昂叫我们几个学生排在船边，闭上眼，拿木槌一下一下地敲。“松的那块，声音是空的。”他说，“像敲一只没装水的罐子。”我只听见一片乱响：槌子声、海鸟、岸上卖槟榔的吆喝，全搅在一起。达昂从船头敲过来，敲到第七块停住，在板上按了一下：“这块。下一块你找。”我敲了一下午，手掌震得发麻，终于听见一声发闷的空响。睁开眼，他已经在修船的单子上添了一行——写的是我的名字。同船的老水手探过头来：“头一块是你找的，怎么不记你自己？”达昂头也没抬：“谁找到的记谁。”他把单子折好，塞进腰上那圈绳里。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "tense"
news = "格雷西克船坞里，一条布吉斯船的伙计叫吉里的学生闭着眼敲船板找松的，修船单上记的全是学生的名字，没有一个是他自己的。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
