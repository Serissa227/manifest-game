# 达昂：风不认得王子（bond_daeng / reunion_daeng）——C7 重写，2026-10-11，Claude（Opus）；旧 GPT 稿作废，只沿用章节 key、地点与年份。
# 标签：BL（羁绊线，可恋爱）。适用主角：凯奇利（kaicili）。
# 人物：达昂 daeng（1539-11-22，男，romance.with = m，纯 BL）；凯奇利·劳特 kaicili（1540-09-09，男，主角，“我”）。
#       学院期 1554—1556：凯奇利 13—16 岁、达昂 14—17 岁；S 章（1556-12）凯奇利 16、达昂 17，心动选项只到牵手与 crush。
#       重逢 1565：凯奇利 24、达昂 25，双方成年，恋人落点合法；生年相差不足一年。
#       拉惹·穆达 raja_muda（1540-09-16）只在重逢的 variant 里作“他身边的人”被提起，不上场、不写其感情。
# 依据：
#   史实——16 世纪中叶望加锡与戈瓦苏丹国兴起，布吉斯与望加锡的船往来爪哇北岸；格雷西克是吉里（苏南·吉里的学府）旁的港口，
#         华人与爪哇商人放钱给船户、以长约换船本的做法常见；班顿（pantun）四行一首，前两句起兴押韵、后两句才是本意；
#         布吉斯人的单桅小船、椰棕与棕榈纤维的绳；马鲁古的特尔纳特是凯奇利的家乡，有火山。
#   原创——达昂其人、木料场与龙骨上的刻痕、船户的契约与“续约由东家定”、河口竞舟、两股拧成的辨风绳、上风的泊位之约。
#   待核——格雷西克秋季河口竞舟的习俗为本世界线的写法；契约条款的措辞按常理拟写。
# 缺省走向：玩家不在场时故事照走（C1—A2 的 default 无收获）；S 的 default 开启重逢并设 c7_bond_daeng_parted；
#           重逢的 default 是达昂托人带来的一片棕榈叶（letter），设 c7_bond_daeng_missed。
# 旗标：写 c7_bond_daeng_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       S 的 promise 与 heart 另设共享旗标 c7_pair_raja_muda_daeng_taken（配角线 pair_raja_muda_daeng 读）；
#       重逢的 variant 读 c7_pair_raja_muda_daeng_together（由 pair_raja_muda_daeng 设）。
# 日程：cast 里达昂 1557 年起在格雷西克；重逢在 1565 年的望加锡，需整合方让他 1565 年在 makassar（或整段改到望加锡）。
# 口头禅：人设里的“你说去哪儿，我说怎么去。”只在 A1 用一次；S 章“河口给我留个位置，我会来。”是这一幕的承诺，不当口头禅用。
# 秘密：量好的木料与差一半的钱，B2 由达昂自己给“我”看；不进任何见闻。

[[tracks]]
key = "bond_daeng"
name = "达昂：风不认得王子"
kind = "request"
start = "c1"
auto = true
academy = true
cast = ["daeng"]

# C1：1554 年初，格雷西克码头一条布吉斯船。先问谁会打结；那根绳。
[[tracks.chapters]]
key = "c1"
title = "风不认得王子"
text = "格雷西克码头下靠着一条布吉斯船，船主雇吉里的学生帮着装货。甲板上站着个比我高半头的少年，赤着脚，腰上缠一圈绳。船主喊他“达昂”，喊得像喊自家的一支桨。他没问我们是谁家的人，开口先问：“谁会打结？”我举起手，顺嘴添了一句：“特尔纳特的王子会，算不算？”几个同学笑起来。他没笑，把一根椰棕绳抛过来：“风不认得王子。打个系帆的结。”我打了。他接过去一拽，结滑开了半截。他一声不响，把它拆开摊在船板上，一圈一圈重打给我看。打到压住绳头那一下，他的手慢下来，停在那里，等我的眼睛跟上，才收紧。“这一道压反了。”他说，“越拉越松的结，到了海上比没有还坏。”他把绳子塞回我手里。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "gresik"
cast = ["daeng"]
speaker = "captain"
mood = "cheerful"
news = "格雷西克码头那条布吉斯船招学生装货，船上的布吉斯少年谁家的人都不问，只问会不会打结；听说有位王子打错了，被他当众拆开重打。"
when = [{ kind = "flag", flag = "family_access_giri" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
