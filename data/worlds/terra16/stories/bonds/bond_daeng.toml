reply = "第一遍我又收晚了，第二遍刚好，第三遍心一慌，收得太早，船在弯里慢得像在漂。达昂的船在旁边等着：“早比晚好。早了只是慢，晚了是翻。”回岸的路上，他用指节在船舷上敲：一下，一下，第三下停住——“这一下，收。”我跟着他敲了一路。"
next = "b2"
effects = [{ kind = "affinity", person = "daeng", value = 3 }, { kind = "skill", skill = "rigging", value = 6 }]

