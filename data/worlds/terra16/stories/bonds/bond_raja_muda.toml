effects = [{ kind = "affinity", person = "raja_muda", value = 3 }]

# A1：1556 年开斋节后的满月，格雷西克的海滩。漂木上的对歌；他说出羡慕达昂（秘密，只在这里由他自己说）。
[[tracks.chapters]]
key = "a1"
title = "节后的满月"
text = "开斋节过去两个礼拜，月亮又圆了。学堂里的人都跑到海滩上去对歌，一堆一堆围着火。拉惹·穆达跟我坐在一截冲上岸的漂木上，离火远一些。我们你一句我一句，他出上半句我接，我出他接，对到火堆那边的人散了大半，还是分不出输赢。他停下来，拿脚跟在沙上划了一道，又抹平。“你知道吗，”他说，“我羡慕达昂。”达昂是学堂里那个布吉斯同学，替人掌舵，一心只想有一条自己的船。“他只为一条船活。我身上背着一座城，丢了四十五年，我生下来的时候，它就已经不是我们的了。”月光落在水上，一直铺到礁石外头。他说这些话的时候没有抬下巴，脸朝着海，声音比对歌时低得多。"
window = [[1556, 8, 28], [1556, 10, 27]]
at = "gresik"
cast = ["raja_muda"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 8, 28], to = [1556, 10, 27] }, { kind = "age", le = 17 }]

