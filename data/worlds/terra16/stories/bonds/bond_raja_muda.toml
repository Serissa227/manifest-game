# 拉惹·穆达：下半句（bond_raja_muda / reunion_raja_muda）——C7 重写，2026-10-12，Claude（Opus）；旧 GPT 稿作废，只沿用轨道与章节 key、地点与年份。
# 标签：BL（羁绊线，可恋爱）。适用主角：凯奇利（kaicili）。
# 人物：拉惹·穆达 raja_muda（1540-09-16，男，romance.with = m，纯 BL），柔佛流亡王廷的王子，吉里学堂里“我”的对手；
#       凯奇利·劳特 kaicili（1540-09-09，男，主角，“我”），特尔纳特苏丹的儿子。两人生日只差一周。
#       年龄：C1—B2 两人 13—15；A1（1556-08-28..09-04）两人都是 15；A2（1556-09-05..11-30）先后满 16；
#       S（1556-12）两人都是 16，心动选项只到拥抱与 crush；重逢 1575 年两人 34—35，恋人落点合法。
# 依据：
#   史实——1511 年葡萄牙人夺取马六甲，马六甲王室流亡，后在柔佛立廷（到 1556 年约四十五年）；吉里（苏南·吉里的学府）在格雷西克旁；
#         班顿（pantun）四行一首，前两行起兴、后两行才是本意，隔行押韵；开斋节 1556 年约在 8 月 17 日，其后满月约在 8 月 30 日；
#         特尔纳特有葡萄牙人修的城堡；1574 年秋卡林亚玛特女王从扎巴拉（Jepara）派舰队围攻马六甲约三个月，
#         1575 年初无功而返，女王本人没有随军。
#   原创——学堂里的同窗比赛日（1554-05-20）与班顿对歌决赛、一头高一头低的长凳、掉进地板缝的白马与槟榔、乌木刻的小马、
#         柔佛来使的船位契约、刻在棕榈叶上的上半句；拉惹·穆达随扎巴拉舰队出征为本世界线的写法。
#   待核——学堂对歌赛的赛制按常理拟写；1574—75 年围城的细节只借人物之口说出，不作定论。
# 缺省走向：C1—A2 的 default 只往下走、不加数值（无人回应时的情节写在各章 default 上方的注释里）；
#           S 的 default 开启重逢并设 c7_bond_raja_muda_parted；
#           重逢的 default：拉惹·穆达托一条布吉斯船捎来一封信，信末一首班顿只有上半句（letter），设 c7_bond_raja_muda_missed。
# 旗标：写 c7_bond_raja_muda_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed；
#       S 的 promise 与 heart 另设共享旗标 c7_pair_raja_muda_daeng_taken（配角线 pair_raja_muda_daeng 据此改走“并肩的朋友”）；
#       重逢的 variant with_daeng 读 c7_pair_raja_muda_daeng_together（由 pair_raja_muda_daeng 设），只写码头另一头的一条布吉斯船。
# 归属：班顿对歌决赛对出下半句归本线；苏玛在台下挑错归 bond_suma，女孩们的对歌归 tie_wati_nyai；1587 年达昂在河口等他归 pair_raja_muda_daeng。
# 秘密：他羡慕达昂只为自己的一条船而活——A1 由他自己对“我”说出；本文件没有见闻，永远不进任何见闻。
# 口头禅：人物卡的“论起来，马六甲本该是我家的。”只在 C1 用一次（报完一长串称号时）；C2 对歌场上站起来那句是这一幕自己的话。
# 日程：cast 里拉惹·穆达 1557 年起一直在格雷西克；重逢在 1575 年的扎巴拉，需整合方让他 1574 年秋至 1575 年在 jepara。

