# B1：1554 年秋，学堂里那副旧棋。掉进地板缝的白马，顶替它的一颗槟榔。
[[tracks.chapters]]
key = "b1"
title = "丢了的马"
text = "入秋以后，我们开始一起下棋。学堂里只有一副旧棋，象牙刻的，好几个子缺了角。拉惹·穆达下棋像个王：一个子也不肯舍，每走一步先护着他的王，王身边围得像一道城墙。有一回他起身太急，袖子带翻了棋盘，一只白马蹦到地上，骨碌碌滚进了地板缝。我们趴下去看，缝太窄，手指伸不进去，只看得见里面一点白。他从腰间的小盒里摸出一颗槟榔，摆在那只马原来的格子上：“这就是马。”那一盘，我拿一个卒子换掉了他的车，又把另一个卒子一路拱到底，将死了他。他盯着棋盘看了很久，看看那个卒子，又看看自己围得严严实实、一步也挪不动的王，抬头问我：“你肯拿卒子去换王？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "gresik"
cast = ["raja_muda"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

