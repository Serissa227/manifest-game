key = "a2"
title = "补上的马"
text = "那只白马在地板缝里躺了两年。九月里，拉惹·穆达有好几天一下课就不见人影，回来时指头上缠着布条。一天傍晚，他把我叫到讲经处，从袖子里掏出一只新刻的马，放在槟榔原来的格子上。是乌木的，比棋盘上剩下的那只白马小了一圈，颜色也对不上，可马鬃一绺一绺刻得清清楚楚，连嘴边的缰绳都刻了出来。“它小，”他说，“可它是我刻的。”那个“我”字，他咬得很重。然后他伸出两根手指，把这只马从他那一边推过棋盘中线，一直推到我面前，手指停在马背上，没有收回去。"
