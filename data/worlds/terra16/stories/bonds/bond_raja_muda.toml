# 重逢：1575 年，扎巴拉港。围马六甲的舰队撤回以后；碎成几片的那片棕榈叶。
[[tracks.chapters]]
key = "reunion"
title = "没开的城门"
text = "扎巴拉的港里泊满了回来的船，有的桅杆断了一截，有的船舷上还留着烧焦的黑印。去年秋天卡林亚玛特女王派去打马六甲的舰队，围了三个月城，开春前撤了回来；女王本人没有随军，城门也没有为谁打开。我在码头最里头找到拉惹·穆达。他坐在一条搁浅的破船上，身上还穿着那件钉了铁片的皮甲，回来这么久也没卸。他瘦得厉害，脸上只剩一双眼睛。看见我，那双眼睛先认出了我，人却没动。我爬上破船，在他旁边坐下。他从怀里掏出一个油布包，一层层打开，里面是那片棕榈叶，已经碎成了五六片，边上都磨圆了。他把碎片一片片摆在膝盖上，拼好，拼出那两行：“潮水漫上旧城的台阶，台阶有几级没人数过。”他按住最碎的那一角，抬头看我：“城门没开。还对不对？”"
window = [[1575, 3, 1], [1575, 12, 31]]
at = "jepara"
cast = ["raja_muda"]
speaker = "captain"
mood = "sad"
when = [{ kind = "date", from = [1575, 3, 1], to = [1575, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "raja_muda", text = "凯奇利：舰队回来了。去年秋天我们从扎巴拉出发，女王出了船，出了钱，人没有来。马六甲围了三个月，城门一天也没开。我在城下站到最后，站到城墙上的葡萄牙兵都认得我的脸。回到扎巴拉，我在码头上等了你半年，每来一条东边的船都去看一眼。你没来。我想你的船大概正在别处，替人运丁香，或者替你自己。这样也好。我那片叶子碎成了六片，用油布包着，一片没丢。城门没开，我就不拼它，等你来了再拼。你那一片想必也还在，替我看看，你那边的潮水漫到第几级了。这封信托一条布吉斯船捎去，船主说他认得特尔纳特的码头。信末我刻了一首新的，规矩你知道，只有上半句：“退潮的沙上留着脚印，涨潮以前还数得清几行。”另外两行归你。别让我等到台阶都数完。——拉惹·穆达，写于扎巴拉" }, { kind = "flag", flag = "c7_bond_raja_muda_missed" }]

