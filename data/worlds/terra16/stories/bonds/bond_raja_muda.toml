text = "扎巴拉的港里泊满了回来的船，有的桅杆断了一截，有的船舷上还留着烧焦的黑印。去年秋天卡林亚玛特女王派去打马六甲的舰队，围了三个月城，开春前撤了回来；女王本人没有随军，城门也没有为谁打开。我在码头最里头找到拉惹·穆达。他坐在一条搁浅的破船上，身上还穿着那件钉了铁片的皮甲，人瘦得脸上只剩一双眼睛。码头另一头泊着一条布吉斯船，船主是他在吉里的旧同窗，从舰队回来就停在那里，不卸货，也不走。拉惹·穆达看见我，那双眼睛先认出了我，人却没动。我爬上破船，在他旁边坐下。他从怀里掏出一个油布包，里面是那片棕榈叶，已经碎成了五六片。他把碎片一片片摆在膝盖上，拼出那两行：“潮水漫上旧城的台阶，台阶有几级没人数过。”他按住最碎的那一角，抬头看我：“城门没开。还对不对？”"
