# B2：1555 年，格雷西克码头。柔佛来使要搭船去亚齐；一张空着名字的船位契约。
[[tracks.chapters]]
key = "b2"
title = "替来使找船位"
text = "开年不久，柔佛的王廷派了一位来使到格雷西克，要搭船去亚齐求援，拉惹·穆达奉命替他找船位。码头上的船主一听是流亡王廷的差事，都摇头：船钱不知哪年才结得清，路上万一撞见葡萄牙人的巡船，连船都保不住。他在码头上转了三天，每天回来，袍子下摆都沾着泥。第四天一早，他在讲经处门口等我，手里攥着一张船位契约，名字那一栏还空着，纸边被他攥得起了毛。“特尔纳特的船，”他说，“你说话管用。”他说这话的时候下巴还抬着，眼睛却看着门口那棵树。我问他要几个位子。“一个。来使，还有他的一只箱子。”他顿了顿，又补一句，“箱子比人要紧。”"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "gresik"
cast = ["raja_muda"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

