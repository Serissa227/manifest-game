reply = "“城门没开，”我说，“我的船还在。跟我走吗？”拉惹·穆达看着我，看了很久，久到码头下的潮水退下去一截。他没回答，低头把膝盖上的碎叶子一片片翻过来。最大的那片背面，有一角还折着，折痕被汗和海水浸得发黑，十九年，没拆开过。“说好成年再见才许打开，”他说，“我一直等着见你，就一直没拆。”他拆开了。我刻的下半句歪歪扭扭，刻坏的那个字还在旁边。他念了一遍，嗓子哑了。然后他把皮甲的绳扣一根根解开，扔在破船上。“我背了一辈子的城，”他说，“放下来一天，行不行？”那天夜里，在我的船上，舱里的灯熄了以后，他吻了我。他的嘴唇干裂，带着海盐的味道。天快亮时他醒过一回，伸手摸到枕边那片叶子还在，才又睡着。"
