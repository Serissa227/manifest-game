# C1：1554 年初，吉里学堂的讲经处。一长串称号与一个名字；一头高一头低的长凳。口头禅在这里用一次。
[[tracks.chapters]]
key = "c1"
title = "长长的称号"
text = "入学那天，苏南·普拉彭坐在讲经处的蒲席上，叫新来的王子们一个个报名字。轮到拉惹·穆达，他站起来，从柔佛的王廷报起，一个称号接一个称号，一直报到马六甲的老苏丹，报了足足一盏茶的工夫，末了还添一句：“论起来，马六甲本该是我家的。”先生闭着眼听完，说：“好。坐。”轮到我，我站起来说：“凯奇利。”说完就坐下了。拉惹·穆达冷笑了一声，声音不大，满屋子的人却都扭过脸来看我。先生抬手指了指墙边一条长凳，叫我们两个同坐。那条凳子一头高一头低，坐上去人就往一边滑。拉惹·穆达从地上捡起几块碎木片，弯腰垫好他那一头，坐稳了，又用脚尖把剩下的一块推到我这边，眼睛一直看着前面：“特尔纳特的王子，连个称号都不带。丢在路上了？”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "gresik"
cast = ["raja_muda"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_giri" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 无人回应时：那条长凳拉惹·穆达坐了三天，第四天自己换了一条平的。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "full_title"
text = "站起来，把特尔纳特的称号也一个字不少地报一遍。"
reply = "我又站了起来，从特尔纳特的火山报起，报到丁香园，报到我祖父的祖父，一口气没停。报到一半，后排有人憋不住笑出了声。先生睁开眼，也笑了：“两位殿下，都闭嘴。”下课时拉惹·穆达跟在我后面出门，走到台阶上才开口：“原来你也会背。”他说得很快，像是怕被别人听见。我说会背，平常懒得背。他哼了一声，这一回没冷笑。"
next = "c2"
effects = [{ kind = "affinity", person = "raja_muda", value = 2 }]

[[tracks.chapters.choices]]
key = "just_name"
text = "不报称号，捡起那块木片垫好我这头，坐下。"
reply = "我捡起木片，蹲下去塞在凳脚底下，按了按，不滑了，就坐好翻开经本。拉惹·穆达等着我回嘴，等了半天没等到。那天下午先生讲的经我记不全，只记得他一直斜着眼看我这头的凳脚，看那块木片，像在看一道没见过的题。散学时他站起来，把他那头垫的木片抽出来，跟我那块比了比，又塞了回去。"
next = "c2"
effects = [{ kind = "affinity", person = "raja_muda", value = 3 }]

# C2：1554-05-20，学堂的同窗比赛日，班顿对歌决赛。写在棕榈叶上的上半句。
[[tracks.chapters]]
key = "c2"
title = "下半句"
text = "五月二十日是学堂的同窗比赛日，班顿对歌一直唱到决赛。规矩是出题的人把上半句写在棕榈叶上，当众念出来，对手当场接下半句。我念的是两行起兴：“丁香落进退潮的水，水退到礁外它还在漂。”两行的尾音，我挑的是马来话里最难押的两个韵，前一晚翻了半夜才找齐。念完，台下没有一点声音，对手抓着头皮下了台。评判举起花环，刚开口说“这一回——”，长凳那头站起一个人。“下半句还没对上，花环先放着。”拉惹·穆达不看评判，只看着我，一个字一个字接下去：“船走远了不回头，岸上有人记得帆。”两个韵都押上了，一个字没差。我那两行写的是丁香，他接的两行写的却是一个不回头的人，比我的还轻，还远。场子里静得听得见外面的潮水声。我们隔着一屋子人对看，都愣在那里。"
window = [[1554, 5, 15], [1554, 7, 14]]
at = "gresik"
cast = ["raja_muda"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 5, 15], to = [1554, 7, 14] }, { kind = "age", le = 17 }]

