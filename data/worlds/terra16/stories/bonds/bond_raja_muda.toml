# S：1556 年 12 月，格雷西克码头，他开船的那天。两片刻着同一首上半句的棕榈叶，一人一片。
[[tracks.chapters]]
key = "s"
title = "城门下再对一首"
text = "十二月，柔佛的王廷来信催他回去。他的船月底就开，比我回特尔纳特的船早了整整一季。开船那天早上，我在码头上替家里点货，他找了过来，什么也没说，摊开手掌，掌心里并排放着两片棕榈叶。两片上用刀尖刻着同一首班顿，都只有上半句：“潮水漫上旧城的台阶，台阶有几级没人数过。”叶子的下半截空着，刻好了两道细线，等人往上写。他抽出一片塞进我手里，另一片收回自己怀里。“马六甲回来的那天，”他说，“我们在城门下，把它对完。”说到“回来”两个字，他的声音轻了下去，轻得像怕吵醒什么。跳板那头有人喊他的名字，他没回头。"
window = [[1556, 12, 1], [1556, 12, 31]]
at = "gresik"
