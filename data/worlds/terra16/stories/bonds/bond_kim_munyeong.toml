# B1：秋天学堂比口译。我快，他准；两份译稿并在一起。
[[tracks.chapters]]
key = "b1"
title = "比谁记得准"
text = "秋天学堂比口译。先生从倭馆请来一个商人，说一段讨价还价的话，我们两个当场译成朝鲜话，各写一份。我先交。我那份读起来顺，先生念了一遍，旁边的同窗都点头。金文永晚了小半炷香，他那份磕磕绊绊，有一处画了个圈，圈旁写着小字：“此处可作‘再议’，亦可作‘不卖’，原话未明。”先生判我快，判他准。我凑过去，把两份稿子并在一起看：商人那句含糊话，我译成了“价钱再压就不卖了”，文永只照原样写了半句。“他没说‘不卖’。”文永用指头点着我那一行，“你替他把主意拿了。”“他就是那个意思。”“你怎么知道？”他看着我，等我回答，好像这真是一个要答的问题。"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "busan"
cast = ["kim_munyeong"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

