# B2：1555 年乙卯倭变的风声。东莱府问话，他请我坐在旁边记下双方原话。
[[tracks.chapters]]
key = "b2"
title = "乙卯年的风声"
text = "五月底，消息从西边一路传过来：全罗道达梁那边来了七十多条船，烧了城，打了好些天。街上的说法一天一个样，有人说船是对马来的，有人说对马的船一条也没去。第三天，东莱府的人进了倭馆，把几个对马商人带回府里，叫到堂上问话，金文永被叫去译。官员拍着案子说一句，商人低着头答一句。歇气的时候，官员身边的书吏凑过来对文永耳语：译狠一点，叫他们知道厉害。转身又有个老商人托人塞给他一张纸，求他译软一些。文永把那张纸折起来揣进袖子，没看：“散了堂再还他。”他找到坐在门槛边的我，说话比平时还慢：“你坐到我旁边来。两边说的，一句一句照原样记下。我译出去的，你也记下。”他把一叠纸和一支笔推给我，手指在纸角上按了一会儿，没有马上松开。"
