reply = "我划掉“就不卖了”，后头只留一个“再压……”。译文短了一截，干巴巴的。“干巴巴的才是原话。”他说。我说那原话也太难听了。他把两份稿子叠齐，用镇纸压平：“难听也是人家说的，又不是你说的。”第二天先生把我们两份钉在一起，挂在学堂的墙上。"
next = "b2"
