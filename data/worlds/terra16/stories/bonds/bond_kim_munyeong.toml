# C2：倭馆门口的木牌。差了一层敬语，他不替我蒙混。口头禅原句在这一章。
[[tracks.chapters]]
key = "c2"
title = "差一层的敬语"
text = "倭馆门口挂着一块木牌，写着对马人进出的时辰，被海风吹得发白。门里，一个对马的老商人在验我们送去的回帖。我递帖子时顺口说了一句，老人的脸就沉下去了，把帖子往案上一放，不接。我不知道错在哪儿。金文永站在我旁边，没替我打圆场，只低声说：“敬语差了一层，你把他说成了跟你平辈。”老人又开口，嘟嘟囔囔，半句咽在喉咙里。屋里的人都等着文永译，他却朝老人欠了欠身：“请把原话，一字不差地再说一遍。”老人愣了愣，真的又说了一遍，这回字字清楚。文永听完，转过来对我说：“他说，年轻人不懂规矩，是带的人没教好。”他顿了一下，“这句骂的是我。”他朝门外抬了抬下巴：“出去。从木牌那里，重新进来。”"
