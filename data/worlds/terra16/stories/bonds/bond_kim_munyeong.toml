# A1：退潮后的礁石。他说了一句只对我讲、不必译的倭语。
[[tracks.chapters]]
key = "a1"
title = "不用译的一句"
text = "开春以后倭馆的公事多了，文永常被叫去对账，我跟着记。他还在翻倭馆的旧账，说里头有一笔货款当年译错了，早晚要核清。这天对完最后一笔，太阳已经偏西，我们顺着倭馆外头的海边往回走。潮退得很远，礁石一块块露出来，披着黑绿的海草。他走在前面，忽然停在一块礁石上，回过头说了一句倭语，很短，说得很轻。我只听懂一半——“明天”那个词我认得，后面的不认得。“这句不用记。”他说，“是对你讲的，不必译给别人。”他从礁石上跳下来，一脚踩进退潮留下的水洼，溅湿了裤脚，他也没低头看。我等他往下说，他只是望着海那边。对马在雾里，今天看不见。"
