# 重逢：1562 年，釜山倭馆的通事房。他译完一份文书的最后一句——那笔查了八年的错译货款，两清了。
[[tracks.chapters]]
key = "reunion"
title = "译完再坐"
text = "隔了六年，我又走进釜山倭馆，通事房的门开着。金文永坐在一张旧案后头，左边是对马来的商人，右边是东莱府的书吏，案上摊着一份文书。他比从前瘦了，说话还是那样慢。商人说一句，他转成朝鲜话；书吏问一句，他转回倭语。有一处书吏说得含糊，他抬手停住：“这一句，劳驾说清楚。”等书吏说清了才往下译。他看见了门口的我，目光停了一下，又落回文书上。我就在门口等。最后一句是书吏的：“这笔货款，两清。”文永译完，看着商人按了手印，才把笔搁下。那是倭馆旧账上一笔译错的货款，他从当学徒那年查起，查了八年。他起身倒了两碗水，一碗推给我，自己那碗端着没喝。“今天，”他说，“不用急着当别人的声音了。你坐。我想慢慢讲讲我自己。”"
