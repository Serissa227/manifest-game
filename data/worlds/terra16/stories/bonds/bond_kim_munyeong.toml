# C1：译官学堂的第一课。他先教两种道歉，纸条上点了墨点。
[[tracks.chapters]]
key = "c1"
title = "先学道歉"
text = "译官学堂的头一堂课，我以为会先学怎么跟对马来的商人打招呼——最响亮的那一句，进了倭馆的门就用得上。金文永却把两张纸条压在砚台底下，一张写朝鲜话，一张写倭语，写的都是道歉。“问候三天就学会了。”他说话很慢，一个字一个字往外放，“这两句要早学。真伤了人的时候，嘴里才不只剩一句‘听不懂’。”我嫌开头扫兴，还是对着他把倭语那张念了一遍。他摇头：“太轻，像踩了人家的脚。”我加重了。“太重，像要去投井。”他把纸条转过来，在一个字底下点了一个墨点：“在这里落下去，后面收住。听的人不该替你猜你有几分真心，分量你得自己放进去。”窗外倭馆那边有人在吆喝卖鱼，喊的正是那句最响亮的问候。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "busan"
cast = ["kim_munyeong"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_busan_interpreters" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

