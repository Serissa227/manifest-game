title = "失败稿背面的山水"
text = "入秋，文永叫我去学堂后头的书房。他从铺盖底下抽出四份纸，一份一份摆在案上，前三份的纸边都翻毛了。“一个对马商人的母亲，写给在釜山的儿子。”他说，“那人在学朝鲜话，想听听他娘的话换成我们的话是什么样子。”他指着前三份，“意思都对，口气不对。他娘说话不是这样的。”我问哪里不对。他想了很久：“她骂他，骂到一半就心软了。我译出来，要么全是骂，要么全是软。”他把第三份翻过来。背面是一幅水墨，淡淡几笔：釜山的海，远处一道灰影，是对马。墨还洇在纸纹里。“译不下去的时候画的。”他把画推到我面前，“给你。正面那些字，你别看。”第四份还压在他手底下，没有拿起来。"
