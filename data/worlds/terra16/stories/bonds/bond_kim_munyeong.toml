# S：腊月学堂散了，我要上船，他留在釜山。“以后信里有误会，先问，别猜着生气。”
[[tracks.chapters]]
key = "s"
title = "先问，别猜"
text = "腊月的海风从倭馆那边一直刮到学堂门口，把晾在檐下的译稿吹得哗哗响。先生收走了最后一批稿子，学堂从明天起就散了。我要上船，文永留在釜山，进通事房做译官。他替我把行囊里的纸一张张理平，理到那张写着两种道歉的旧纸条，停了一下，又塞了回去。“以后写信，”他说，“隔着海，一封信要走一个月。你读到一句不顺耳的，别猜我是什么意思，更别猜着生气。先写信来问。”“问一句，来回要两个月。”“那就等两个月。”他把行囊的绳子打了个结，勒得很紧，“两个月，总比猜错一辈子短。”海那边的雾散开一点，对马的影子露出来，又叫云吞了回去。"
