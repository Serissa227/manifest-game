# C1 · 1554 春 · 天不亮的讲席：磨圆了书角的《千行诗》
# 缺省：我拿了纸就走，他在背后又把书打开，一个人念到天亮。
[[tracks.chapters]]
key = "c1"
title = "先到的人"
text = "天还黑着，我摸到讲席的柱子底下借纸——先生的纸篓就搁在那儿，早来的人可以先拿两张。柱子底下已经点着一盏灯。伊尔汗一个人坐在第一排，膝上摊着一本《千行诗》，书角被拇指磨得发圆，正压着嗓子念昨天讲过的那几行。他一抬头看见我，啪地把书合上：“我只是顺路，别多想。”“我没多想。”我从纸篓里抽了两张纸，“我连你叫什么都没记住。”“伊尔汗。”他说得很快，像怕我记错，“禁卫军家的伊尔汗。外省来的，纸拿了就走。”我往外走。走到廊柱那儿，背后哗啦一声，书又打开了。“喂，基尔瓦的。”他没回头，“站那儿听着。我念，哪一句不顺，你说。”"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "cairo"
cast = ["ilhan"]
speaker = "captain"
mood = "cheerful"
news = "开罗爱资哈尔的讲席天不亮就点着灯，听说是禁卫军家那个少爷，回回比先生到得还早，还不许人说他早。"
when = [{ kind = "flag", flag = "family_access_cairo_azhar" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
