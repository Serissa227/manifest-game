[[tracks.chapters.choices]]
key = "listen"
text = "坐到他旁边听他念，挑出两处不顺的地方。"
reply = "我挑了两处：一处他把词尾吞了；一处是喉音——他家里说土耳其话，那个“哈”总是从嗓子眼外头出来。他皱着眉把第一处又念了两遍，念顺了。第二处他不认：“是你基尔瓦的耳朵听岔了。”宣礼塔上喊了晨礼，廊下的人多起来。他把书一合，夹在胳膊底下，走出两步又停住：“你明天还这么早？”"
