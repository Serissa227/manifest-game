# A1 · 1556 春 · 城堡的长台阶：空饭盒，一城的灯
# 缺省：他在最上面一级坐到天黑，一个人下山。
[[tracks.chapters]]
key = "a1"
title = "城堡的长台阶"
text = "1556 年春天，我替住宿区的老抄写匠往城堡里送一包誊好的文书，出来时太阳已经挨着西边的沙丘。城门外那段长台阶又陡又宽，一直通到底下的鲁梅拉广场。伊尔汗坐在最上面一级，膝上搁着一只空饭盒。“我爹今天在上头当值，我来送饭。”他站起来拍了拍袍子，“送完了，顺路。”“顺哪条路？”“下山的路。”他已经往下走了，“就这一条。”台阶的石头被几百年的靴子磨得中间凹下去。走到一半，苏丹哈桑清真寺的宣礼塔先亮了，接着是广场上的灯，接着是一整片屋顶，一盏一盏，一直亮到河边。伊尔汗停了一步，没回头：“从这儿看，开罗也就这么大。”"
window = [[1556, 1, 1], [1556, 5, 31]]
at = "cairo"
cast = ["ilhan"]
speaker = "captain"
mood = "tender"
news = "开罗城堡下的长台阶上，傍晚常有两个爱资哈尔的学生一级一级往下走，走得比挑水的人还慢。"
when = [{ kind = "date", from = [1556, 1, 1], to = [1556, 5, 31] }, { kind = "age", le = 17 }]

