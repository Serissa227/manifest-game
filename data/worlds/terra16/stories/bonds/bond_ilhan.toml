# C2 · 1554 夏 · 借书处的窗台：一溜木牌
# 缺省：他把木牌放回队尾，一个人排到天黑，借到的那本已经被翻烂了。
[[tracks.chapters]]
key = "c2"
title = "父亲的名字"
text = "借书处的窗台上摆着一溜木牌，一块牌子一个人，管书的老人按顺序叫。那天的队排到了院子里。伊尔汗的木牌在最末，他把它捏起来，沿着窗台一路往前走，走到窗口，清了清嗓子：“我父亲是城堡上的奥达巴什——”“排你前头那个怎么办？”我问。前头是个瘦得像芦苇的马格里布学生，抱着一张写满书名的单子，替他先生来借的。他听见“城堡”两个字，往旁边让了半步。伊尔汗瞪了我一眼。他把木牌往窗台上一拍，又捡起来，放回了那一溜木牌的最末，自己走到院子里，站在了队尾。“我没想插。”他说，“我是来看看还有多少人。”"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "cairo"
cast = ["ilhan"]
speaker = "captain"
mood = "tense"
news = "开罗爱资哈尔的借书处排到了院子里，禁卫军家的少爷捏着木牌走到窗口，又自己走回了队尾，看见的学生都说头一回见。"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

