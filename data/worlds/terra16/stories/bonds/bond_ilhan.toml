# C7 重写（2026-10-12，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。旧版（GPT）整篇作废，只沿用章节 key、地点与窗口。
# 标签：BL（羁绊线，可恋爱）。主角：巴拉卡·宾·萨利姆（baraka，1540-07-23），基尔瓦人，住爱资哈尔的杰巴尔提住宿区。
# 人物：伊尔汗 ilhan（1539-03-07），驻开罗禁卫军人家的少爷，爱资哈尔的学生；romance.with = [m]，纯 BL，对巴拉卡开放。
#   叫人“外省来的”，认作自己人才叫“约尔达什”（禁卫军同一口锅吃饭的人之间的叫法，S 的 promise 回复里第一次叫）。
#   各章年龄：1554 年巴拉卡 13—14、伊尔汗 14—15；A1（1556-01..05）巴拉卡 15、伊尔汗 16—17；A2（1556-06..11）巴拉卡 15—16、伊尔汗 17；
#   S（1556-12）巴拉卡 16、伊尔汗 17（1557-03-07 才满 18），心动选项只给 crush 与“等你下回来开罗再说一遍，那时我再答”，最多握手；
#   重逢 1562 年巴拉卡 21—22、伊尔汗 22—23，恋人落点过门禁。萨利赫（salih，1540-12-25）只在重逢变体里被提一句。
# 依据：
#   史实——奥斯曼治下的埃及，禁卫军驻开罗城堡，总督府与议事厅也在城堡里；禁卫军的饷按季发放；奥达巴什是禁卫军的营房头目；
#         城堡下是鲁梅拉广场与苏丹哈桑清真寺；布拉克是开罗的河港；爱资哈尔按出身分住宿区，有土耳其人的住宿区；
#         讲席上背伊本·马立克的《千行诗》（语法韵文）；辩问（munazara）；预购（salam）——先付钱、讲定斤两成色与交货日子的买卖，教法认可。
#   原创——伊尔汗与巴拉卡的全部情节：讲席上的早灯与磨圆书角的《千行诗》、借书处窗台上的木牌、鱼贩子告状的笑话、
#         胡椒能不能先卖的辩题、两张笔记、兵家孩子穆斯塔法与账房的欠账簿、城堡长台阶上的空饭盒、誊过两遍的诗、门洞里的下午、
#         书记房的凳子与十一年的欠账。
#   待核——十六世纪中叶爱资哈尔是否向学生收学费、欠费赶人（本世界的设定，正文只写账房的规矩）；禁卫军子弟进爱资哈尔读书的多寡；
#         借书处用木牌排号是虚构的做法。
# 秘密：伊尔汗替萨利赫留座、让出好位置——本文件不写。只写他的另一面：想不靠父亲的名号查清禁卫军子弟的学费欠账（B2 起，重逢查清）。
# 口头禅“我只是顺路，别多想。”原句只在 C1 正文用一次；A1、S 只说“顺路”；重逢正文只用前半句“我只是顺路。”呼应；来信不照搬。
# 罗达岛水位尺归 pair_salih_ilhan：本文件任何一章都不写水位尺旁的场景，重逢变体只提一句涨水节。
# 缺省走向：C1—A2 玩家不在场时故事照走、没有收获（各章情节写在章前注释里）；
#   S 缺省 → 伊尔汗照常去总督府报到，设 c7_bond_ilhan_parted 并开启重逢；重逢缺省 → 伊尔汗的一封来信，设 c7_bond_ilhan_missed。
# 落点：朋友 friends（_landing_friend，永远可选）、对手 rivals（_landing_rival，永远可选）、恋人 lovers（_landing_love；
#   要 c7_bond_ilhan_romance、心动 ≥ 24、双方满 18——A1 6 + A2 6 + S 12 = 24）。
