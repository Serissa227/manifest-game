# B2 · 1555 · 账房的欠账簿：兵家孩子穆斯塔法的学费
# 缺省：他一个人进账房吵了一架，月底穆斯塔法背着铺盖走了。
[[tracks.chapters]]
key = "b2"
title = "军属的学费"
text = "1555 年，账房门口贴出一张名单：欠了一年学费的，月底搬出住宿区。最末一个是穆斯塔法，十二岁，住在土耳其人的住宿区，父亲是城堡上的兵，前年调去了阿斯旺的戍堡，饷一季一发，回回拖。伊尔汗把我从廊下拽到墙角。“账房那个管事，我认得。我只要说一声我爹是谁，他明天就把名字划了。”“那你去说。”“不说。”他的下巴绷着，“穆斯塔法的爹欠的是饷，凭什么他儿子要靠我爹的脸面念书？说了，满开罗又只记得我爹。”他停了停，声音低下去，“你会砍价。基尔瓦人砍价，鱼市上都怕。”账房的门半开着，里头的管事把欠账簿翻到那一页，拿指甲在穆斯塔法的名字底下划了两道。"
