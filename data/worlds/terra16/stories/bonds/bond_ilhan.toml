text = "最后一堂课散了，先生把讲席上的芦席卷起来，立在柱子边。我从爱资哈尔的正门出来，伊尔汗站在门洞里，换了一身深蓝的新袍子，袖口硬得能立住。开春他就要去总督府的书记房当差。“我去城堡那边办点事，”他说，“从这儿走，顺路。”“城堡在那头。”我朝反方向指了指，“你这条路得绕半个开罗。”看门的老人坐在凳子上剥橘子，头也不抬：“晌礼以后就站在这儿了。”伊尔汗的脸一下子红到了新袍子的领口。他咳了一声，问我哪天走。我说后天，跟去苏伊士的驼队，到了亚丁等北风，开春到家。“基尔瓦有多远？”“走路的话，三年。坐船，看风的脾气。”他点点头，好像真在心里算那三年。"
