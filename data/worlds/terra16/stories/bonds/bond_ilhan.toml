# B1 · 1554 秋 · 讲席上的辩问：胡椒能不能先卖（我赢）
# 缺省：他照样交来两张笔记，我不在，他把两张都压在了我的铺盖底下。
[[tracks.chapters]]
key = "b1"
title = "这回我输了"
text = "秋天，先生在讲席上出了一道辩题：船还在红海上，船上的胡椒能不能先卖给开罗的商人？伊尔汗先站起来，说不能——货不在眼前，卖的是风和浪，是赌。我站起来说能：先把钱付了，把斤两、成色、交货的日子说死，这叫预购，基尔瓦的船一直这么做，先生的书上也这么写。他驳了三回，三回都绕回“货不在眼前”。先生说：“巴拉卡说得对。”伊尔汗没坐下。“他第二回答话时停了一下，”他说，“停了念三个字的工夫。辩问里停顿，算不算露怯？”先生说算。他又站了一会儿：“这回我输了。我错在根上，把预购当成了卖眼前没有的东西。”第二天，他把两张纸放在我膝上，一张写我的错，一张写他的错，字一样端正，连行距都一样。"
