reply = "我让船先回塔里法，自己留在了马拉加。白天我替他搬桌子、对名单、跟押送官吵架，吵架我比他在行；夜里我们睡在码头的仓房里，草垫子一股咸鱼味。第三天夜里，他从贴身的衣袋里摸出一张纸，折成四折又一折，折痕磨得快断了，正是那年在侯爵府的橘子树底下我按进他手心的那一张。“成年了，”他说，“我能打开了吧？”他点了一截蜡烛头，展开纸，看了很久。那行歪歪扭扭的字母是谣曲的下句：你出生的那一天，天上有过大征兆。有一个字母我写反了，他没笑。“十三年，”他说，“我一次也没猜。”他拉过我的手，摊开掌心，用指头蘸了一点白天对名单剩下的墨，从右往左写我的名字，弯弯的一串，末尾的尾巴甩到了我的手腕上。写完，他低下头，吻了那个名字。"
next = "done"
