hint = "调子到了嗓子眼又咽回去。这张纸太重，你们还没走到能收下它的那一步。"
reply = "这调子我只在塔里法的城墙上听渔夫唱过两回，一开口就跑了。洛伦索跟着我哼，想把调子拽回来，结果跑得更远，格拉纳达的摩尔人听了大概也认不出。哼完，他把额头抵在我肩膀上，抵了一会儿，声音闷在我的衣服里：“别告诉别人我哭了。”我说我什么也没看见。这倒是实话，他的脸埋在我肩上。"
next = "s"
