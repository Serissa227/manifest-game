reply = "我张口就接：“摩尔人，摩尔人，你家的驴跑了。”洛伦索笑得从麻袋上滚下去，捂着肚子说这是他听过最难听的下句，难听得够格拉纳达再丢一回。笑够了，他爬起来蘸墨，在那片干净的地方一笔一画抄上了我的驴，卡斯蒂利亚字一行，那种字母一行。"
next = "s"
effects = [{ kind = "affinity", person = "lorenzo", value = 3 }]

[[tracks.chapters]]
key = "s"
title = "两岸的地址"
text = "这年年底，我要回塔里法了，开春在城堡里授剑。洛伦索还得留在侯爵府。侯爵在巴塞罗那当副王，府里的侍童一个也没带走。“以后呢？”我问。“也许去格拉纳达当通事，也许渡海去非斯，”他说，“看哪边先赶我走。”他从怀里掏出一张纸，上面写着两个地址。一个在海这边，格拉纳达山坡上一家抄书铺；一个在海那边，非斯城里他一个远房舅舅的染坊。“信寄哪个都行，”他把纸递给我，“总有一个能收到。”庭院里的橘子树掉了一地的果子，烂熟的甜味直往鼻子里钻。马车已经停在门外。他踩着满地的橘子送我到门洞底下，一路没学任何人的口音，说话就是他自己的嗓子，有一点山里的腔调。"
