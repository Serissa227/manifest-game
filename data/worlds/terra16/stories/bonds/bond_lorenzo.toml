[[tracks.chapters]]
key = "a1"
title = "用那种字母写的名字"
text = "储藏间里点的还是蜡烛头。不是当年那一截了，可他总挑最短的点，说长的要留给管家查账。这一夜洛伦索没有把书往怀里揣。他把那本巴掌大的小书摊在麻袋上，推到我面前。满页都是弯弯的字母，从右往左爬，像退潮后沙滩上的虫子印。“念给你听。”他的指头从右边走到左边，念出来的却是我听得懂的话，卡斯蒂利亚话，带一点格拉纳达山里的腔调，讲一个人怎样在斋月里给邻居送面包。“我娘的外婆就这么写字，”他说，“字是那边的，话是这边的。”他蘸了墨，要教我用这种字母写自己的名字，握住我的手，一笔从右边起。写到第二个字母，他的手停了。我抬头，他正看着我，没在看纸。“看字，”我说，“别看我。”他咳了一声，低下头，把那个字母又描了一遍。"
