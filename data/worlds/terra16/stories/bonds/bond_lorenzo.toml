[[tracks.chapters.choices]]
key = "promise"
text = "约好：他有信要过海峡，就交给我，我的船替他带"
requires = [{ kind = "bond", person = "lorenzo", level = "A" }]
hint = "那张写着两个地址的纸攥在你手里，替他带信过海的话却说不出口：交情还没深到能让他把两岸都托给你；要么，替人渡海的约，你已经许给了另一个人。"
reply = "“你的船？”他笑了，“你连船都还没有。”“会有的，”我说，“骑士说话算话，船早晚会有。”他不笑了。他把那张纸铺在长凳的瓷砖上，借着门洞里的灯，把两个地址各抄了一遍，抄得比交给马尔·拉腊老师的谚语还工整。一份塞给我，一份他撕开自己左边的袖口，叠成窄窄一条缝了进去，针脚歪歪扭扭。他咬断线头，吐在地上：“这下我在两岸都有人了。”我上了马车。车轮碾着门洞口的烂橘子走远了，他右手还按着左边的袖口，像按着一封还没寄出去的信。"
next = "done"
effects = [{ kind = "bond", person = "lorenzo", level = "S" }, { kind = "relation", person = "lorenzo", relation = "friends" }, { kind = "memory", memory = "mem-bond_lorenzo-s", title = "两岸的地址" }, { kind = "flag", flag = "c7_bond_lorenzo_promise" }, { kind = "flag", flag = "c7_pair_diego_lorenzo_taken" }, { kind = "start_track", track = "reunion_lorenzo" }]

[[tracks.chapters.choices]]
key = "heart"
text = "在纸背写下谣曲的下句折好给他，说成年再见时才许打开"
requires = [{ kind = "bond", person = "lorenzo", level = "A" }, { kind = "heart", person = "lorenzo", ge = 12 }, { kind = "age", ge = 16, le = 17 }, { kind = "age", person = "lorenzo", ge = 16, le = 17 }, { kind = "romance_open", romance_open = "lorenzo" }]
hint = "你把纸翻过来，背面还空着，那句下句却写不上去：心还没走到那儿；要么，这样的话你已经写给了另一个人。"
reply = "两个地址我念了三遍，记熟了，才借他的笔，在那张纸的背面写了一行字。用的是他教我的那种字母，从右往左，写得歪歪扭扭，有一个字母我拿不准，描了两遍。写完我把纸折成四折，又折了一折，按进他手心里。“谣曲的下句，”我说，“等我们都成年了再见，那时候才许打开。”洛伦索看看纸，又看看我。我等着他猜。他什么都要猜，猜我写的是哪一句，猜我写对了没有，猜我是不是在捉弄他。他一句也没猜。他把那张纸按在胸口，按了好一会儿，才塞进衣服里面贴身的地方。马车在门外催。到了门洞底下，他忽然伸手抱了我一下，很快，一下就松开，飞快地朝廊下瞟了一眼，像怕被谁看见。“走吧，”他说，“塔里法的公鸡等着叫你起床呢。”"
next = "done"
effects = [{ kind = "bond", person = "lorenzo", level = "S" }, { kind = "heart", person = "lorenzo", value = 12 }, { kind = "relation", person = "lorenzo", relation = "crush" }, { kind = "flag", flag = "c7_bond_lorenzo_romance" }, { kind = "memory", memory = "mem-bond_lorenzo-s", title = "两岸的地址" }, { kind = "flag", flag = "c7_pair_diego_lorenzo_taken" }, { kind = "start_track", track = "reunion_lorenzo" }]

[[tracks.chapters.choices]]
key = "own"
text = "约好我练剑、他练字，下回见面各考对方一回"
requires = []
reply = "“我考你那种字母，”洛伦索说，“从右往左，一个也不许写反。你考我什么？”“考你骑马。”他的脸一下子白了。府里的侍童，就他一个见了马要绕着走，去年还被一匹骡子追过半条街。“换一样，”他说，“换什么都行。”“不换。”从庭院到门洞这几十步，他一直在跟我讨价还价，从骑马降到骑骡子，又从骑骡子降到摸一摸马鼻子。我笑了一路，上了马车还在笑，他扒着车窗喊：“鼻子！就摸鼻子！”车拐出街口以前，我回头看，他还站在门洞底下，伸着一只手在空里摸了摸，像在摸一只看不见的马鼻子。"
next = "done"
effects = [{ kind = "affinity", person = "lorenzo", value = 2 }, { kind = "relation", person = "lorenzo", relation = "friends" }, { kind = "flag", flag = "c7_bond_lorenzo_own" }, { kind = "start_track", track = "reunion_lorenzo" }]

