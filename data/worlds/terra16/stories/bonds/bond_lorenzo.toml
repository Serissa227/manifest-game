# C7 故事线重写（2026-10-11，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 标签：BL（羁绊线；主角诺埃尔，可恋爱；洛伦索纯 BL）。正文不点明诺埃尔的性别，也不点明洛伦索的取向——他的心动只用动作写。
# 人物：洛伦索（lorenzo，1540-04-01 生，塔里法侯爵府的摩里斯科侍童，替马尔·拉腊抄谚语）；
#       诺埃尔·德·卡德纳（noel，1540-11-11 生，塔里法海峡分团最后的骑士见习，在侯爵府当侍童）。
# 依据·史实：塞维利亚的彼拉多之家是塔里法侯爵府，侯爵 1554—1558 年在巴塞罗那任加泰罗尼亚副王；胡安·德·马尔·拉腊在塞维利亚开人文学校，
#       他的《俗语哲学》（1568）收一千零一条谚语；阿尔哈米亚多（用阿拉伯字母写的卡斯蒂利亚话）是摩里斯科人私下的书写；
#       十五世纪的边境谣曲《阿本那马尔》（国王问摩尔人城上的塔楼是谁的，下句“你出生的那一天，天上有过大征兆”）；
#       1567 年的禁令、1568—1571 年的阿尔普哈拉斯战争、山里的摩里斯科人被押往卡斯蒂利亚内地。
# 史实→本世界线：大规模迁徙在 1570 年 11 月；本线把一批押送提前到 1569 年的马拉加码头。
# 依据·原创：庭院里猜口音、储藏间的蜡烛头、特里亚纳老妇人的信、诗笺只抄上句、两岸的地址、马拉加码头的名单。
# 秘密：洛伦索夜里读母亲留下的阿尔哈米亚多小书——只在储藏间这类私下场景出现，正文只说“那种字母”，标题与回忆标题不写；本线没有见闻。
#       诺埃尔的伏笔全文件只有一处：A1 的“看字，别看我”。揭开后的反应只在重逢的 variants（noel_unveiled）。
# 心动阶梯：A1 let_him_guide +6 → A2 hum_the_tune +6（要已有 6）→ S heart +12（要已有 12）= 24，正好够重逢的 love（≥ 24）。
#       决定表写 S +10，算下来只有 22、永远到不了 24，这里按简报改为 +12。
# 年龄：S（1556-12）诺埃尔 16、洛伦索 16，heart 选项只到拥抱；重逢（1569）两人 28，lovers 合法。
# 缺省走向：C1—A2 不插手照样往下走；S 缺省开重逢并记 c7_bond_lorenzo_parted；重逢缺省是他托渔夫捎来的一封信（c7_bond_lorenzo_missed）。
# 设的共享旗标：c7_pair_diego_lorenzo_taken（S 的 promise 与 heart；配角线 pair_diego_lorenzo 据此改走“并肩的朋友”）。
# 读的旗标：noel_unveiled（main_noel 设）、c7_pair_diego_lorenzo_together（pair_diego_lorenzo 设），都只在重逢的 variants 里。
# 日程：洛伦索 1567 年起在 granada_city；重逢 at = malaga，若要他人在马拉加，需整合方给 1569 年加一段 malaga 日程。

[[tracks]]
key = "bond_lorenzo"
name = "洛伦索：猜不出的口音"
