[[tracks.chapters]]
key = "a2"
title = "只抄上句的诗笺"
text = "洛伦索塞给我一张诗笺，折得方方正正。展开来，上面抄着一句老边境谣曲：“阿本那马尔，阿本那马尔，摩尔地上的摩尔人。”一行卡斯蒂利亚字，底下一行那种字母，再往下是一大片干净的纸。“下一句你接，”他说，“接上了，这首歌才算完。”他说得很轻快，像在说明天吃什么。可这首谣曲马尔·拉腊老师在课上讲过：一个卡斯蒂利亚国王骑马到格拉纳达城下，指着山上闪闪发亮的塔楼，问一个摩尔人那都是谁的。摩尔人一座一座报给他听。国王说，格拉纳达，我想娶你。城回答，我已经嫁了，守着我的摩尔人待我很好。我捏着那张纸，纸角被他的指头压出一个小坑。两行字写得一样大，卡斯蒂利亚字没有压着那种字母，那种字母也没有压着卡斯蒂利亚字。"
window = [[1556, 6, 1], [1556, 11, 30]]
at = "seville"
cast = ["lorenzo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1556, 6, 1], to = [1556, 11, 30] }, { kind = "age", le = 17 }]

