next = "b1"
effects = [{ kind = "affinity", person = "lorenzo", value = 2 }, { kind = "bond", person = "lorenzo", level = "C" }]

[[tracks.chapters.choices]]
key = "ask_the_book"
text = "直接问他：那到底是什么书？他不说，就算了"
requires = []
reply = "“日课经。”他又说了一遍，眼睛盯着蜡烛头，不看我。我说那就日课经，打着哈欠回去睡觉。走到门口，身后传来一声猫叫，接着又是一声，一声比一声像。那半宿的猫叫一直跟到我的铺上，我不记得是什么时候睡着的。"
next = "b1"
effects = [{ kind = "affinity", person = "lorenzo", value = 3 }]

[[tracks.chapters]]
key = "b1"
title = "第一千零一条谚语"
text = "马尔·拉腊老师在编一本谚语集，说要凑够一千零一条，一条也不能少。他让侯爵府的侍童每人交一张抄纸，写家里老人常挂在嘴边的话。我交的是塔里法渔夫骂天气的那句，老师看了一眼，说粗是粗，收下了。洛伦索交的那张，老师念到一半就拍了桌子：“这才是地道的老卡斯蒂利亚话！”满屋的侍童都扭头看他。他低着头，说是听外婆讲的。我把那句话在嘴里过了一遍，脚底下跟着打拍子：三下短，一下长，再拖一个尾音。休达来的老医生给我念阿拉伯谚语的时候，就是这个拍子，一模一样。散学后，洛伦索在橘子树底下追上我，左右看了看，压低了嗓子：“你听出来了，对不对？”"
window = [[1554, 9, 1], [1554, 12, 31]]
at = "seville"
cast = ["lorenzo"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 9, 1], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

