reply = "他捏着书脊犹豫了很久，久到蜡油滴在了麻袋上，才把书递过来。“要是被人翻出来，你就说是在路上捡的。”我说骑士不说谎。他骂我笨，骂完又说：“那就别让人翻出来。”书垫在剑匣最底下，压在磨剑的油布下面，大小刚好。"
