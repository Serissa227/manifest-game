[[tracks.chapters]]
key = "c1"
title = "猜不出的口音"
text = "侯爵府的庭院里，新来的侍童挨着瓷砖长凳站成一排，等管家来分差事。凳面是绿白两色的瓷砖，冬天的早上冰得没人敢坐。有个黑眼睛的男孩从排头走到排尾，挨个凑上去听人说话。“让我猜猜，你是打哪儿来的？”他问一个，猜中一个：赫雷斯的，卡莫纳的，科尔多瓦城外磨坊里的。管家咳嗽着走过来，他连管家的老家也报了出来。“洛伦索！”管家揪着他的耳朵把他拎到一边，他还在笑。轮到我。我天没亮就被拖起来，正骂这府里的公鸡投错了胎。洛伦索歪着头听完，眉头皱起来：“元音是塔里法的，可‘海’这个字……”他卡住了，让我再说一遍“海”。“别费劲了，”我说，“从城堡门口来的。三岁，装在篮子里。”他张着嘴，那句准备好的笑话没有接上来。长凳上不知谁落下一个橘子，他拿起来，在手里转了两圈，又放回瓷砖上。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["lorenzo"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "flag", flag = "family_access_seville_tarifa" }, { kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

# 缺省：洛伦索后来再也没有当面猜过我的来路，只是有时候会盯着我念“海”这个字。
[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "ask_his_origin"
text = "反问他：那你自己呢，是哪儿的人？"
requires = []
reply = "“我？弥撒的第一排来的，”洛伦索笑着说，“不信你去问神父，他每回都嫌我‘阿门’喊得太响。”他答得太快，笑也来得太快，像一扇早就备好的门，敲一下就开，开了里面什么也没有。我认得这种快。有人问我爹娘是谁的时候，我也是这么答的。"
next = "c2"
effects = [{ kind = "affinity", person = "lorenzo", value = 3 }]

[[tracks.chapters.choices]]
key = "bet_an_orange"
text = "跟他赌一个橘子：一个月内猜出我的来路，就算他赢"
requires = []
reply = "他猜了整整一个月。加的斯，休达，直布罗陀，丹吉尔，有一回连威尼斯都说出来了，一次也没中。到月底那天早上，我枕头边放着一个剥好的橘子，一瓣一瓣摆成一圈，一个字也没留。我吃了，酸得眼睛都眯起来。"
next = "c2"
effects = [{ kind = "affinity", person = "lorenzo", value = 2 }]

[[tracks.chapters]]
key = "c2"
title = "蜡烛头"
text = "盛夏的塞维利亚，夜里也热得像压在面包炉的盖子底下。我平时是全府最难叫醒的那一个，这一夜偏偏睡不着，爬起来去井边找水。回来的路上，侍童堆杂物的储藏间门缝底下漏出一线黄光。我推开门。洛伦索盘腿坐在麻袋堆上，膝头摊着一本巴掌大的小书，旁边一截蜡烛头只剩指甲盖高。门一响，他“啪”地把书合上，揣进怀里。“我娘留下的日课经，”他说，“睡不着，念两段。”日课经用不着藏。这句话我没说出口。他已经笑起来了：“你也睡不着？那我给你学一段管家打呼噜。”他鼓起腮帮子，先是拉锯，再是漏气，最后像有人一脚踩扁了一只鹅。学得太像，我笑得撞翻了扫帚。走廊那头巡夜的人提着灯问是谁，我们一口吹灭了蜡烛头，在黑里憋得肚子疼。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["lorenzo"]
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

# 缺省：那一夜我回去接着睡了，储藏间的光什么时候灭的，我不知道。
