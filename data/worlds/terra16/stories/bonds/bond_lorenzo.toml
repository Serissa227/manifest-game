[[tracks.chapters]]
key = "reunion"
title = "山里下来的人"
text = "一五六九年，阿尔普哈拉斯山里的仗还没打完，马拉加的码头上已经挤满了从山里押下来的摩里斯科人。男人的手腕拴在一根长绳上，女人抱着孩子坐在包袱上，等着一批一批装船，送到卡斯蒂利亚的内地去。去哪儿，没人告诉他们。人群和官员的桌子中间站着一个穿旧外套的通事，外套的肘弯磨得发亮。他弯着腰听一个老汉说话，又转过去听一个女人哭，一个口音一个口音地听：这个是奥希瓦的，那个是乌希哈尔的，这一家的儿子拴在另一条绳上。他在官员的名单上一个名字旁边画个小记号，再在另一个名字旁边画个一样的。他直起腰擦汗，看见了我，愣住了。“这回不用猜了，”洛伦索说，“塔里法的元音，隔着半个码头我都听得出来。”他手里的名单被汗浸软了，那些小记号一个连一个，像一串只有他念得出的字。"
window = [[1569, 1, 1], [1569, 12, 31]]
at = "malaga"
cast = ["lorenzo"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1569, 1, 1], to = [1569, 12, 31] }, { kind = "age", ge = 18 }, { kind = "age", person = "lorenzo", ge = 18 }]

[[tracks.chapters.variants]]
key = "diego_unveiled"
when = [{ kind = "flag", flag = "noel_unveiled" }, { kind = "flag", flag = "c7_pair_diego_lorenzo_together" }]
text = "一五六九年，阿尔普哈拉斯山里的仗还没打完，马拉加的码头上挤满了从山里押下来的摩里斯科人，手腕拴在长绳上，等着装船送去卡斯蒂利亚的内地。人群和官员的桌子中间站着一个穿旧外套的通事，一个口音一个口音地听，在名单上一个名字旁边画个小记号，再在另一个名字旁边画个一样的。码头那头，一位卡斯蒂利亚军官正跟押送官争执，硬是把一家人从绳上解了下来。通事朝那边看了一眼，直起腰擦汗，看见了我。“这回不用猜了，”洛伦索说。他上下看了我一眼，笑了：“侯爵府里那些人当年猜了个遍，全猜错了。我没猜错过。你说‘我’的那个音，跟谁都不一样。”他朝码头那头偏了偏头，声音放轻了：“他替我挡了一上午。”"

