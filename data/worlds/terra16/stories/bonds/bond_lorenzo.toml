[[tracks.chapters]]
key = "b2"
title = "过海峡的信"
text = "特里亚纳的陶窑后面住着一个摩里斯科老妇人，洛伦索替她写过几回买盐的条子。这回她托的是一封信：她儿子十年前渡海去了非斯，从此再没有一个字回来。信写好了。信封上的名字，洛伦索用卡斯蒂利亚字写了一遍，底下又用那种弯弯的字母写了一遍。“那边的人只认这个，”他说，“可这边的人看见这个，信就上不了船。”城里的信差不肯接，码头上的船老大一看信封就摆手。洛伦索在侯爵府的马厩后面堵住我，手里一直搓着那封信的边，纸边都搓毛了。“你是塔里法来的，”他说，“海峡的船，你熟。”他没笑。我认识他一年多，这是头一回见他求人。"
