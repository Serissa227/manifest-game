hint = "这张纸太重了。你们还没熟到能让他把它交到你手里。"
reply = "“你一辈子也接不上。”他说。“那就接一辈子。”我说。他愣了一下，伸手把诗笺从我指头里抽回去，卷成细细的一卷，拿一根红线扎了，塞进我剑匣的缝里。“这下好了，”他拍了拍剑匣，“你走到哪儿，都得背着它。”"
