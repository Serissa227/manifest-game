# —— A2：1556 年下半年。母亲的丝绣的布套，里层一行字。物件：家书布套（travel_letter_case）。——
[[tracks.chapters]]
key = "a2"
title = "家书布套"
text = "老医生带来一个麻布小包，拆开是一只布套，比信纸宽一指，墨绿的丝，边上绣着一圈葡萄藤。塔里克的信夹在里头：“我娘绣的。丝是阿尔普哈拉斯的，她从格拉纳达带出来的最后一卷，留了十三年，说要留给要紧的东西。你的信纸角都磨破了，装进去。别跟我说谢——我娘听不见，我也不想听。”我把他这两年多的信理成一叠往里塞，塞到一半卡住了，只好抽出来重排。抽出来的时候，才看见里层有一行小字，绣得很密，要把信全倒出来、把布套翻过来才看得见：“见面以前，别死。”老医生凑过来看了看，说：“他娘绣的是外面。里头这一行，针脚不一样。”"
