# —— S：1556 年 12 月。把信交给过海峡的人。物件：一封要过海峡的信。——
[[tracks.chapters]]
key = "s"
title = "把约定寄出去"
text = "十二月，侯爵府的侍童走了一半，回家的回家，去巴塞罗那伺候侯爵的去巴塞罗那。院子里天天有人当面道别，抱一抱，拍拍肩膀。我的道别得交给一个过海峡的人。开春我就要回塔里法授剑，往后住在城堡里，信该寄到哪儿，得重新告诉他。塔里克上一封信写：“萨拉赫·雷斯死了，阿尔及尔的船长们正在分他的船。明年我回去，要一条自己的。”我把这三年的信从床底的木箱里搬出来，按日子排了一桌子。最早那几封还在争一个词：海峡那边该叫“海峡”，还是叫“我们的海”。争了三封信，后来两个人都忘了。新信写好了：城堡的地址，授剑的日子，哪个窗口朝着海。写到最后一行，我停住了，笔尖悬在纸上，一滴墨落下去。老医生在门口咳了一声：“船不等人，骑士。”"
