# —— A1：1556 年上半年。灯油溅在信上。物件：一张溅了灯油的信纸、一盏画歪的灯。——
[[tracks.chapters]]
key = "a1"
title = "灯油"
text = "冬夜长，我点着灯给塔里克写信，写到第三页，灯油溅出来一滴，正落在“塞维利亚”这个词上，洇开一个黄圈。我拿起纸想重写，又想起他上回骂我：“你的字整齐得像账房先生，看一眼就犯困。”我就把那一滴圈起来，在旁边写：“今日唯一的战伤。”半年以后回信到了。塔里克这回没骂人，信纸背面画了一盏灯，灯座是歪的，火苗往一边倒，像屋里在刮风。灯底下一行小字：“灯油别再洒到袖子上。洒在纸上不要紧，袖子难洗。”我把那张纸翻过来，又翻回去。我不知道他点灯的那间屋子在非斯哪条巷子里，窗户朝着哪边，夜里漏不漏风。老医生在一旁说：“他的意思是，他也是夜里写的。”"
