text = "回信把两封信的日子并排写上，问他：你现在还这么想吗？"
requires = [{ kind = "affinity", person = "tariq", ge = 5 }]
hint = "才吵了两封信，就问他现在怎么想，像是你先认了输。这句话你还写不出来。"
reply = "这一回他的信来得快。开头一行：“不想了。驴的事我原谅你，换一件事骂你。”换的那件事是塞维利亚人吃橄榄不吐核。我趴在灯下笑出了声，隔壁的侍童敲墙叫我小声点。那是我头一回因为他的信笑。"
next = "b1"
