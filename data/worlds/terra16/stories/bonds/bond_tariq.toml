reply = "我交出去的是头一封，通篇只骂拼法。他的回信开春才到：“你这封信写得太冷静了，不像你。是不是塞维利亚的冬天把你的嘴冻住了？”我骂了一句，把信扔到床上。夜里又摸出来，翻来覆去看了很多遍。"
next = "b2"
effects = [{ kind = "affinity", person = "tariq", value = 15 }]

# —— B2：1555 年。他要奴隶市场上的名字。物件：一张抄满人名的纸。——
[[tracks.chapters]]
key = "b2"
title = "名单"
text = "这一回的信很薄。我拆开先找骂人的话，一句也没找着。塔里克只问了一件事：“塞维利亚的奴隶市场上，有没有从我们这一岸掳去的人？我要名字。名字，哪个村子，谁家的儿子。有了名字，这边就有人凑钱去赎。”信末没问天气。礼拜天，我去了大教堂外头的台阶。台阶上什么都卖，布匹、旧剑、葡萄酒，还有人。我拿着纸笔一个一个问。有人不肯开口；有人说的地名我写不出来，我就照他比划的样子画下来：一座山，两条河，一棵枣椰。一个白胡子老人听我用阿拉伯话问他打哪儿来，愣了很久，问我是不是来赎他的。我说不是，是替人问名字。他攥着我的袖子哭，哭得一句话也说不出来，看守过来把他拽开了。那天夜里我把名单誊清，一共十九个名字。抄到老人那一行，笔怎么也落不稳，手一直在抖。"
window = [[1555, 1, 1], [1555, 12, 31]]
at = "seville"
cast = ["tariq"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1555, 1, 1], to = [1555, 12, 31] }, { kind = "age", le = 17 }]

