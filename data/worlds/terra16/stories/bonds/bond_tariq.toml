effects = []

[[tracks.chapters.choices]]
key = "send_the_pile"
text = "把一箱信都交给他，最上面那封只写：你还活着就回一个字。"
requires = [{ kind = "affinity", person = "tariq", ge = 5 }]
hint = "你还拉不下脸让他知道，这几个月你一直在担心。"
reply = "三个月后回信到了。一整张纸，正中间只有一个字：“活。”字底下画了一只鸟，歪歪扭扭，看不出是海鸥还是鸡。老医生说，城里打了三个月，那孩子在安达卢斯区一户同乡家的地窖里躲了半个冬天。我把那张纸夹进了剑匣，压在剑底下。"
next = "b2"
