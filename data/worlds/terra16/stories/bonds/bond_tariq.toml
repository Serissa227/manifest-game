next = "b1"
effects = [{ kind = "affinity", person = "tariq", value = 15 }]

# —— B1：1554 年秋。萨阿德王朝打回非斯，船没来。物件：一叠没寄出的信。——
[[tracks.chapters]]
key = "b1"
title = "没来的船"
text = "九月底，从桑卢卡尔上来的船夫说，非斯打起来了，萨阿德家的人从南边打回了城里，土耳其人留下的那点兵守不住。约好的船没有来，老医生也没有来。我照旧每个月写一封信，写完不封口，放进床底下的木箱。头一封骂他的拼法；第二封骂得少些，问非斯的城墙有多高、他住的那条巷子离城门远不远；第三封写到一半，我停了笔，把前面的话一行行划掉，另起一行：“你要是还活着——”后面的话我没写下去。侍童们来叫我去吃杏仁糖，我说不饿。箱子里的信摞起来，已经比他最厚的那封还厚。年底，老医生终于来了，一路咳嗽，说海峡上风大，船停了一个多月，刚通。他在门口跺掉鞋上的泥，问我：“有信要带吗？”"
window = [[1554, 9, 15], [1554, 12, 31]]
at = "seville"
cast = ["tariq"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1554, 9, 15], to = [1554, 12, 31] }, { kind = "age", le = 17 }]

