# —— C1：1554 年初，塞维利亚。老医生转来第一封信。物件：盖着非斯蜡印的信。口头禅原句在这里。——
[[tracks.chapters]]
key = "c1"
title = "海峡那边的第一封信"
text = "这年年初的一个早上，天还没亮透，休达来的老医生就敲开了我的门。我裹着被子骂了一句，他不恼，从袖子里摸出一封信。信封上写着：“塔里法城堡里最后那位骑士收。”蜡印是非斯的，压得歪歪扭扭。“写信的孩子姓加尔纳蒂，在卡拉维因念书，”老医生说，“他问起塔里法，我多了一句嘴。”信是卡斯蒂利亚文，拼得一塌糊涂。头一句就是：“听说塔里法的骑士团只剩一个小孩。那小孩会不会骑马？会不会游水？哪天在海峡上碰见，我该叫你骑士，还是叫你小孩？”底下又骂了三件事：骑士团的旗子太旧，塔里法的金枪鱼太贵，塞维利亚人说话太慢。落款塔里克·加尔纳蒂，名字底下另起一行，字比全信都大：“只劫货，不劫人。”我把信看了三遍，看到第三遍的“小孩”两个字，掀了被子坐起来。那天早上我没赖床，回信写了三页，墨水用掉半瓶。"
window = [[1554, 1, 1], [1554, 4, 30]]
at = "seville"
cast = ["tariq"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 1, 1], to = [1554, 4, 30] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "c2"
effects = []

[[tracks.chapters.choices]]
key = "circle_his_typos"
text = "把他信里拼错的字一个个圈出来，连信一起寄回去。"
reply = "我数过了，一共十一个。圈完在信末添一句：“你们海盗写字都这样吗？”老医生把两封信举到窗口对着光看，看到那一句，笑得胡子直抖：“他会气疯的。”他把两封信一起揣进袖子，下楼时还在笑，在楼梯上咳了好一阵。"
next = "c2"
effects = [{ kind = "affinity", person = "tariq", value = 15 }]

[[tracks.chapters.choices]]
key = "ask_what_he_robs"
text = "回信问他：只劫货，那你劫过什么货？"
reply = "前两页半我骂他的拼法、骂他的蜡印，骂非斯人连塔里法在哪一边都分不清。最后半页只有一行：“你说只劫货——你劫过什么货？”老医生封信的时候瞥了一眼：“前头那两页半，他会跳过去。这一句，他会回。”"
next = "c2"
effects = [{ kind = "affinity", person = "tariq", value = 15 }]

# —— C2：1554 年夏。他骂的是我半年前的话。物件：两封日期隔了半年的信。——
[[tracks.chapters]]
key = "c2"
title = "半年前的狠话"
text = "入夏，老医生又来了，这回的信比上回厚一倍。塔里克开头就骂：“你凭什么说我的蜡印像被驴踩过？驴踩的印子都比你的字端正！”接着骂了两页我的拼法，又骂了一页塞维利亚的橘子太酸。我看到一半才想起来，驴那一句是我写的。写在年初，写完就忘了。我翻出留底的草稿，把两封信的日子抄在一张纸上：我的那封写在冬天，他的写在春天，到我手里已经是夏天。他回的是我冬天的火气，我读到的是他春天的火气；等我这封寄到非斯，那边又快入冬了。老医生坐在一旁喝我的橘子水，酸得直皱眉：“你们俩啊，一直在跟半年前的对方吵架。”我把那张抄着日子的纸压在墨水瓶底下。他春天骂得这么凶，到了这会儿，兴许早换了主意，只是船还没到。"
window = [[1554, 5, 1], [1554, 8, 31]]
at = "seville"
cast = ["tariq"]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1554, 5, 1], to = [1554, 8, 31] }, { kind = "age", le = 17 }]

[tracks.chapters.default]
next = "b1"
effects = []

[[tracks.chapters.choices]]
