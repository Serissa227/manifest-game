hint = "笔尖停在纸上。一生只许一回的约，要么你们还没熟到那一步，要么这句话你已经对另一个人说过了。"
reply = "我写：“诺埃尔·德·卡德纳。下回在海峡上碰见，先报这个，再拔剑。”写完嫌太正经，又在旁边补一句：“你要是敢只报一个‘塔里克’，我就当不认识。”开春，授剑前七天，回信送到了塔里法。信纸很大，正中间是他的全名，一笔一画，一个字母也没拼错：“塔里克·加尔纳蒂。”底下一行：“货照劫，人照样不劫——这一句也算在全名里。到时候你也得报全，不许只报‘骑士’两个字就算完。”再往下，他骂了我半页：授剑这么大的事，怎么不早说，他来不及备礼。最后一行问塔里法这几天刮不刮东风。我把信折好，放进布套最里层，正压在那行“见面以前，别死”上头。"
