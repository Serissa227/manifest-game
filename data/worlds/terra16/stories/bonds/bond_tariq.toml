# C7 重写（2026-10-12，Claude Opus）：故事 2.0 轨道，遵循 DECISIONS“故事 2.0 TOML 契约”。旧版（GPT）整篇作废，只沿用轨道 key、章节 key、地点与窗口。
# 标签：BL（羁绊线，可恋爱；全线是书信，塔里克本人到重逢才出现）。主角：诺埃尔·德·卡德纳（noel，1540-11-11）。
# 人物：塔里克·加尔纳蒂 tariq（1540-01-02，阿尔及尔的摩里斯科少年，1554—1556 年在非斯的卡拉维因读书；romance.with = [any]）。
#   各章年龄：C1（1554-01..04）诺埃尔 13、塔里克 14；A1（1556-01..05）15 / 16；A2（1556-06..11）15—16 / 16；
#   S（1556-12）两人都 16，心动选项只给 crush 与“见面时当面答”的约；重逢 1560 年诺埃尔 19、塔里克 20，恋人落点过门禁。
# 依据：
#   史实——1554 年 1 月萨拉赫·雷斯替瓦塔斯王族攻下非斯，同年 9 月萨阿德王朝夺回；萨拉赫·雷斯 1556 年死于鼠疫（一说更晚）；
#         塞维利亚大教堂外的台阶（Gradas）是城里的大集市，奴隶也在那里拍卖；巴巴罗萨 1529 年拆了西班牙人的佩尼翁堡、
#         用它的石头修成阿尔及尔港的防波堤；阿尔普哈拉斯山区以养蚕缫丝出名；格拉纳达的摩里斯科人多有亲族流落北非。
#   原创——老医生转信、驴踩的蜡印、日期并排、“活”字与歪鸟、台阶上的十九个名字、灯油的战伤与两盏灯、
#         母亲的丝与里层那行字、塔里克的船“鸥”；重逢的决斗与两份名单。
#   待核——台阶市场在 1555 年拍卖奴隶的具体日子（正文只说“礼拜天”的集市，不写拍卖规矩）。
# 信的路线：非斯 → 得土安 → 休达 → 过海峡，由诺埃尔在塔里法时教过阿拉伯文的摩里斯科老医生（从休达来）上塞维利亚买药时转交；
#   一封信来回要半年。章内的月份只写季节，不写会和窗口打架的日子。
# 诺埃尔的伏笔（DECISIONS 2.2）：学院期书信里一处外貌也不写，七章不放任何暗示；中文不用“他/她”指诺埃尔，英文不用 he/she。
#   重逢基础文本只有一处（塔里克盯着诺埃尔的脸看得太久，诺埃尔说“看什么看”）；揭开后的反应只在 variants.unveiled。
# 口头禅“只劫货，不劫人”原句只在 C1 的落款用一次；S 的 promise 回复与重逢缺省来信只作改了字句的呼应。
#   信末问天气是塔里克的习惯，各处换着说法出现。
# 情谊尺度 D（塔里克不在塞维利亚，交谈与赠礼加不了情谊）：每章选项本身给 +15/+15/+15/+17/+17/+19。
# 羁绊阶梯：C2 date_side_by_side → C；B1 send_the_pile 补签 C；B2 go_to_market → B；A1 more_names 补签 B；
#   A2 use_it / write_inside → A + travel_letter_case + 回忆“家书布套”。
#   心动：A1 keep_the_lamp +6；A2 write_inside +6（要求已有 6）；S heart +12（要求已有 12）＝ 24，正好到重逢恋爱落点的门槛。
#   （决定表写 S +10，算下来只有 22，永远到不了 24；照简报改为 +12。）
# 各章 default（玩家没回应，正文不显示，写在这里备查）：
#   C1 那封信压在枕头底下，过了半年才想起来回；C2 回得很晚，回到时他大概又换了主意；
#   B1 那一叠信一封也没寄，开春才收到他的信，说城里打了三个月；B2 问名单的信没回，后来听说台阶上那个哭的老人被卖去了别处；
#   A1 画灯的那封没回，下一封他照旧骂人，灯没再画（简报原写“溅油的信纸没寄”，与本章正文他已回了灯图相抵，改成这样）；
#   A2 布套收着，没装信，里层那行字看了很多遍；
#   S 信写完没寄，开春授剑那天海峡那边来了他的信，问授剑的时候下没下雨（_parted，照样开启重逢）；
#   重逢 没去阿尔及尔，他托一个被赎回来的水手捎来一封信（_missed）。
# 设旗标：c7_bond_tariq_promise / _romance / _own / _parted / _landing_friend / _landing_rival / _landing_love / _missed。
# 读旗标：noel_unveiled（main_noel 第三章设，外部接口；不存在即按未揭开）；c7_bond_tariq_romance。
# 日程：塔里克 1554—1556 在 fez_city、1557 起 algiers；诺埃尔 1554—1556 在 seville。cast 已是如此，重逢不需改日程。
