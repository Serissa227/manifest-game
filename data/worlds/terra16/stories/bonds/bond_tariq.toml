# —— 重逢：1560 年，阿尔及尔的码头与防波堤。先决斗，平手；两份名单合在一起。基础文本只有一处伏笔。——
[[tracks.chapters]]
key = "reunion"
title = "第一次见面"
text = "阿尔及尔的码头白得晃眼。我的船刚靠上，跳板还没搭稳，就有人站在缆桩旁边拦住了路。他戴一只金耳环，腰上一条红腰带，宽得能缠两圈。“塔里克·加尔纳蒂。”报完名字，他不让路，也不说下一句，只盯着我的脸看，看得太久了。“看什么看。”我说，“全名报完了？该我了。诺埃尔·德·卡德纳。”他咧嘴一笑，拔了剑。我们从码头一路打到防波堤上。他出剑快，花样多，一边打一边骂：骂我的步法，骂我的船，骂塔里法的金枪鱼。我一句也没回，留着力气。打到防波堤尽头，两把剑尖各自抵着对方的衣领，谁也再进不了一寸。他先撤了剑，往石头上一坐，笑得直喘：“平手。行了，把你的名单拿来。”他从腰带里抽出一卷纸，我从怀里掏出我的。两张纸摊在石头上，拿两把剑压住边角。是同一条船上的人：他那份记着这些人从哪里被掳走，我这份记着他们被卖到了哪里。"
window = [[1560, 1, 1], [1560, 12, 31]]
at = "algiers"
cast = ["tariq"]
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1560, 1, 1], to = [1560, 12, 31] }]

[tracks.chapters.default]
next = "done"
effects = [{ kind = "letter", person = "tariq", text = "骑士：你没来。我在码头上站了三天，站到第三天，红腰带都站松了。名单我一个人对的，只对了一半——你那一份不在，船上有五个人，我只知道他们从哪个村子被带走，不知道被卖去了哪里。这五个人我接着找。找到了也不告诉你。算了，还是告诉你，不然你那张嘴不知道会骂成什么样。捎信的人叫阿里，去年赎回来的，在加的斯的船上划了七年桨。他说塞维利亚大教堂外头的台阶他见过，那天下着雨。我问他有没有见过一个拿着纸笔、挨个问名字的人，他说没有。我想也是，那时候你早不在那儿了。我有船了，叫“鸥”，船头刻了一只木头海鸥，刻得歪，你见了不许笑。下回来阿尔及尔，找红腰带就行，满码头只有我系这么宽的。货我还是只拿货。见面以前，别死。——塔里克·加尔纳蒂。又：塞维利亚这阵子下雨没有？我知道你早不住那儿了，就是问问。" }, { kind = "flag", flag = "c7_bond_tariq_missed" }]

