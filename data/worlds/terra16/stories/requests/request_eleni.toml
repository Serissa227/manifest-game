# 三、哪一棵，不告诉你：割脂季收尾，埃莱妮把第一等的树脂封进小陶罐，留了一罐给我。
[[tracks.chapters]]
key = "result"
title = "哪一棵，不告诉你"
text = "割脂的季节收了尾，南边的树园里只剩下一道道割口，树脂还在慢慢往外渗。埃莱妮坐在仓房门口的台阶上，把今年第一等的树脂装进一个小陶罐，封上口，又用蜡把封口压了一圈。蜡还是热的，她用拇指按了一下，留下一个指印。她掂了掂罐子，忽然说：“这一罐本该先给代理人。我留了一罐，你要不要？”她把罐子往前一推，“要玛蒂克？这一罐，是今年最好的眼泪。”"
speaker = "captain"
mood = "cheerful"
at = "chios"
objectives = [{ kind = "person", person = "eleni", text = "在仓房门口找到她" }]
when = [{ kind = "date", from = [1558, 1, 1], to = [1563, 12, 31] }, { kind = "alive", person = "eleni", value = true }]
news = "希俄斯的割脂季收了尾，树园的姑娘封了一罐第一等的玛蒂克，说是哪棵树流的，不告诉人。"

[[tracks.chapters.choices]]
key = "take_jar"
text = "收下那罐树脂，问她是哪一棵。"
next = "done"
reply = "她把罐子放进我手里，说这罐的树是哪一棵，她不告诉我。“告诉了你，你就要来割了。”工钱谈下来了，我那一份，她一枚一枚数给了我。"
effects = [{ kind = "cash", value = 400 }, { kind = "affinity", person = "eleni", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_eleni_done" }, { kind = "memory", memory = "mem-request_eleni-result", title = "封口的小陶罐" }]

[[tracks.chapters.choices]]
key = "refuse_jar"
text = "不要，留给工人们分。"
next = "done"
reply = "她想了想，把罐子打开，挨个给园子里的工人掰了一小块，最后才轮到我。钱她照付了，一个铜子也没少。“不要罐子的人，我记下了。”"
effects = [{ kind = "cash", value = 400 }, { kind = "affinity", person = "eleni", value = 6 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_eleni_done" }]

# 三′、今年就这样：代理人工钱照压，只让了一点；埃莱妮不闹，把罐子放在台阶上。
[[tracks.chapters]]
key = "result_partial"
title = "今年就这样"
text = "割脂的季节收了尾。代理人最后还是压了工钱，只是比册子上的数高了一截，算是给我留的面子。埃莱妮没有闹，她把一个小陶罐放在台阶上，封口压着蜡。“今年就这样。”她说，“工钱是他的。树是我挑的，明年也还是我挑。”她说完才看我，像是在等我也说一句。我没有接话。她的袖口上沾着一圈树脂，干了，发亮。"
speaker = "captain"
mood = "tender"
at = "chios"
when = [{ kind = "date", from = [1558, 1, 1], to = [1563, 12, 31] }, { kind = "alive", person = "eleni", value = true }]
news = "希俄斯割脂的工棚里，马奥纳的代理人工钱照压，树园的姑娘说今年就这样，明年她自己挑树。"

[[tracks.chapters.choices]]
key = "take_pay"
text = "收下工钱，罐子留给她。"
next = "done"
reply = "她把钱袋推过来，数也没数。“罐子你不要，那就留着。明年还来买，价钱我自己跟他谈。”她把罐子收回袖子里，封口的蜡又压了一遍。"
effects = [{ kind = "cash", value = 200 }, { kind = "affinity", person = "eleni", value = 4 }, { kind = "flag", flag = "c13_request_eleni_partial" }]

[[tracks.chapters.choices]]
key = "take_jar_only"
text = "钱不要了，只要那罐树脂。"
next = "done"
reply = "她愣了一下，把罐子放进我手里，手心还带着树脂的黏。“钱不要，那我就欠你一罐。”她说，“那是这一季最好的，别拿去换钱。”她说完，又看了一眼罐子上的蜡印。"
effects = [{ kind = "affinity", person = "eleni", value = 6 }, { kind = "flag", flag = "c13_request_eleni_partial" }]
