# 请托：借来的礼服（request_margarita）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：玛格丽塔（margarita，1540-01-19 生，女），塞维利亚塔里法侯爵府的侍女；势力 spain，身份档 1。cast：cast/classmates_seville.toml（学院同学，C7 bond_margarita）。
# 类型：找东西（find）。三章：offer（报价）、handin（试衣，送出或借出）、wedding（婚礼，收尾）。没有 stage 章，因此没有 window 与 default；窗口写在 when 的日期条件里。
# 报价：T（当面）。人物按日程在塞维利亚港口，玩家在港里“问请托”启动（ask:request_margarita），auto=false；offer 不写 at，目标是在仆役院找到她。
# 时限：offer 的 deadline 为 1570-12-31，到期走 timeout 直接 failed，不写见闻（没人知道这件事没成）。handin 与 wedding 的 when 卡在 1563-01-01..1572-02-24，之后静默等待，不设期限。
# 依据·史实背景：塞维利亚的大贵族府邸养着成群的侍女；佛兰德的饰边在西班牙是体面人家的标志。
# 依据·原创：玛格丽塔与侍女们凑的钱、新郎家的皮匠铺、特里亚纳小教堂的婚礼、管家站在门口的那一刻。
# 秘密：cast 里写明的 secret 永远不碰，正文与见闻都不写；C7 的其他段落（同一人的 C7 线、1571 年以后的事）归 C7。
# 读的旗标：bond margarita（至少 C，只在 offer 的变体里读，读的是 C7 的结果）；c13_request_margarita_partial（wedding 的变体，handin 借出检定失败时设）。
# 设的旗标：c13_request_margarita_accepted（offer 两条接法）、_declined（offer 回绝）、_given（handin 送出）、_partial（handin 借出检定失败）、_done（wedding 两条收尾）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不设 c13_main_*（玛格丽塔不是主角）。
# 报酬：现金最多 900、好感最多 +13、名声 +1、回忆 mem-request_margarita-wedding。礼服是玩家买来的，不是奖励；送出那条路 item -1 扣掉它。
# 依赖：cast/classmates_seville.toml 的 margarita 日程目前只到 1556-12-31，整合时要延到 1572 年在 seville（offer 与 handin 的 person 目标靠它）；物品 flemish_lace_dress（items/items_outfit_01.toml，有 shop）；检定属性 commerce。
# 回忆插画清单：
#   mem-request_margarita-wedding「门口一闪一闪的饰边」：特里亚纳小教堂门口的光里，一件佛兰德饰边礼服的袖口一闪一闪，侍女们挤在后排，管家站在门外。

[[tracks]]
key = "request_margarita"
name = "借来的礼服"
kind = "request"
start = "offer"
auto = false
cast = ["margarita"]

[[tracks.chapters]]
key = "offer"
title = "姐妹们凑的钱"
text = "玛格丽塔把一只小布袋往你手里一塞。布袋口拿灰线缝过，里头叮当响，是侍女们凑的钱，一人几枚。府里有个侍女要出嫁，嫁的是个皮匠，婚礼上总得有件像样的礼服。“要佛兰德饰边的，府里夫人穿的那种。”她说，“钱就这些，姐妹们一人一把凑的。不够的我来想办法。”说完朝管家的窗户看了一眼，窗帘没动。"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1563, 1, 1], to = [1570, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "margarita", ge = 18 }]
objectives = [{ kind = "person", person = "margarita", text = "在侯爵府的仆役院找到她" }]
deadline = [1570, 12, 31]
timeout = { next = "failed" }

