[[tracks.chapters]]
key = "wedding"
title = "皮匠的婚礼"
text = "婚礼在特里亚纳的一座小教堂里，新娘穿着那件礼服，饰边在门口的光里一闪一闪。石阶上还落着撒过的谷粒，几只麻雀在啄。府里的侍女们挤在后排，玛格丽塔站在最前面，比新娘还紧张，手里攥着一张折了又折的纸。散场的时候管家也来了。他是来抓偷跑出府的侍女的，可他站在门口看了很久，没进来，也没走。玛格丽塔凑过来，小声说：“后门的门闩今天没上。”又补一句：“你要是有空，去跟他说说天气。”"
speaker = "captain"
mood = "cheerful"
at = "seville"
when = [{ kind = "alive", person = "margarita", value = true }, { kind = "date", from = [1563, 1, 1], to = [1572, 2, 24] }]
objectives = [{ kind = "at", at = "seville", text = "在塞维利亚" }]
news = "塞维利亚特里亚纳的一座小教堂里，侯爵府的侍女嫁给了皮匠，穿的是佛兰德的饰边。"

