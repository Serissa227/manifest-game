text = "仆役院的小屋窗子开着，外头晒的床单一动一动。侍女们围着那件礼服，新娘不敢伸手去摸。玛格丽塔一边替她比腰身，一边说：“新郎家的皮匠铺上个月刚添了个学徒，是他舅舅硬塞进去的，天天晌午回家吃饭。”说完补一句：“我可没说是我说的。”礼服的腰身小了一指，新娘吸着气才系得上。"
