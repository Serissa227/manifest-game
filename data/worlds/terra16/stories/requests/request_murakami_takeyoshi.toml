# C13d 请托：验不过的扔进海（request_murakami_takeyoshi）。中文，Claude 写。
# 人物：村上武吉 murakami_takeyoshi（1533 生，男；能岛村上家的当主，濑户内海的主人，身份档 3 统帅，1604 卒）。
# 类型：送货（deliver）；brief 三章 offer → deliver → settle，另把 settle 按交货结果拆成 settle / settle_partial 两章（共 4 章）。
#   拆章的理由：brief 的 settle 要按旗标 clean / thrown 拆选项，可这两面旗标是本轨道 deliver 章在不同路径上设的，
#   用 requires 读它们会被审计报“准备后条件仍不满足”；改成 deliver 的各选项直接用 next 分流——验过的去 settle，
#   有布被扔进海的（检定失败、拿名字担保）去 settle_partial，两章各有自己的乘船检定与岸上旁观。
# 报价：当面（T）。人物按日程在能岛（noshima，dock，1553—1584），auto=false，玩家“问请托”（ask:request_murakami_takeyoshi）启动；
#   offer 章不写 at，用 person 目标。历史人物，先要过求见（audience：名声 40、村上家声望 20）。
# 窗口：报价 1579-01-15 至 1584-03-31（offer 的 deadline 即窗口止日，到期走 failed，不写见闻）；
#   交货进行中 120 天（同一片内海外加去宁波 / 热田 / 那霸买布）；交货后二十天棉帆下水，结账章 90 天，最晚约 1584 年 10 月，在他离开能岛（1584-12-31）以前。
# 货：棉布 cloth ×15（做帆，宁波、热田、那霸有）、米 rice ×30（船工的口粮，釜山、鹿儿岛、府内等多处有）；能岛不产米也不产布。
# 货款：Σ(15×80 + 30×12)×1.25 = 1950，交货章三个选项都付（goods 目标回应时扣货）。
# 依据·史实：1578 年第二次木津川口，九鬼家的大船击退毛利与村上水军；十六世纪后期日本的船帆从草席帆逐渐改用木棉帆（研究笔记）。
#   正文不写那一仗本身，只写“木津川口那一回”草席帆吸了水；brief 写的是“去年”，可报价窗口一直开到 1584 年，写死“去年”会错，改成不带年份的“那一回”。
# 依据·原创：船坞里刮藤壶的船工；滴水的草席帆；缺两根手指的老验货人、泡布条的海水桶与插米袋的竹签；码头水面上漂着的别人家的布；
#   帆角的三道麻绳；窄了一幅的帆与晾竿上留着的两匹烂布；能岛与来岛之间转流时的漩涡。
# 口吻：粗、快，开口先问船，管来客叫“船老大”；抢船说得像收鱼税（offer 里一句“抢来的船，帆也全是草席”）。
#   全轨道唯一要紧的一句“验不过的，我扔海里，钱照付——下回你就知道该带什么来了。”只在 offer 用一次。
# 不写：过所旗与帆别钱的收费（澪主线 5 与汐的请托）；汐、鹰丸（C7，都是能岛村上家的人）；cast 无 secret。
# 读的旗标：c13_main_mio（offer 的变体 v1_mio，只换一句，由澪的主线设，尚未写）；c13_request_murakami_takeyoshi_vouched（settle_partial 的变体 v1_vouched，只改正文）。不读 c7_*。
# 设的旗标：c13_request_murakami_takeyoshi_accepted（offer 接下）/ declined（回绝，终局）/ late（交货或结账超时，终局）/ done（验过的结账，终局）/ partial（有布被扔的结账，终局）；
#   分支（三面）：clean（布全过了：分过等检定成功或当场教绑帆）、thrown（有布被扔进海：检定失败或拿名字担保）、vouched（拿名字担保，只给 settle_partial 换正文）。
# 报酬：货款 1950；报酬至多 2600（验过的结账）、1300（有布被扔的结账）；好感至多 +2 +3 +8 = 13；声望 murakami +3；名声 +5；回忆一张——后三样只在验过的、跟他上船那一条路上。
#   超时：好感 −3（决定 §二）；交货超时有一封来信，结账超时没有信（全轨道来信只一封）。
# 依赖：港口 noshima（ports_east_asia.toml）；商品 cloth（goods/02_manufactures.toml）、rice（goods/05_terra_trade.toml）；技能 rigging（skills.toml）；
#   势力 murakami（factions/10_japan.toml，“村上水军”；人物与声望都在 murakami 上）；人物 murakami_takeyoshi（cast/historical_07_japan.toml）。
# 回忆插画清单：mem-request_murakami_takeyoshi-settle「棉帆的小早」，画面：能岛与来岛之间的转流里，一条挂白棉帆的小早贴着漩涡的边窜过去，船头的武吉仰头大笑。

[[tracks]]
key = "request_murakami_takeyoshi"
name = "验不过的扔进海"
kind = "request"
start = "offer"
auto = false
cast = ["murakami_takeyoshi"]

# 一、报价：1579—1584 年，能岛的船坞。他摔下一张滴水的草席帆，要十五匹好棉布和三十袋米。
[[tracks.chapters]]
key = "offer"
title = "吸了水的草席帆"
text = "能岛的船坞里，一排小早底朝天晾着，船工蹲在船肚子底下刮藤壶，碎壳落了一地。村上武吉从船底钻出来，两手腥泥，先问的是你的船：“几根桅？吃水多深？水手哪里人？”你一样样答了，他才从架子上扯下一张发黑的草席帆，往地上一摔，席缝里还在滴水。“木津川口那一回，就是这东西。吸饱了水，船慢得像拖着网。”他要试棉帆：外头织得密的棉布十五匹，再加三十袋米喂船工——能岛这块礁石上，米和布一样也不长。“这几年抢来的船，帆也全是草席，要块好布还得掏钱买。”货到了，在码头上一件件验。“验不过的，我扔海里，钱照付——下回你就知道该带什么来了。”"
speaker = "murakami_takeyoshi"
mood = "cheerful"
when = [{ kind = "date", from = [1579, 1, 15] }, { kind = "age", ge = 17 }]
objectives = [{ kind = "person", person = "murakami_takeyoshi", text = "在能岛找到武吉" }]
deadline = [1584, 3, 31]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_mio"
when = [{ kind = "flag", flag = "c13_main_mio", value = true }]
text = "能岛的船坞里，一排小早底朝天晾着，船工蹲在船肚子底下刮藤壶，碎壳落了一地。村上武吉从船底钻出来，两手腥泥，眯眼把你从头看到脚：“阿濑带大的那个姬君？好。几根桅？吃水多深？水手哪里人？”你一样样答了，他才从架子上扯下一张发黑的草席帆，往地上一摔，席缝里还在滴水。“木津川口那一回，就是这东西。吸饱了水，船慢得像拖着网。”他要试棉帆：外头织得密的棉布十五匹，再加三十袋米喂船工——能岛这块礁石上，米和布一样也不长。“这几年抢来的船，帆也全是草席，要块好布还得掏钱买。”货到了，在码头上一件件验。“验不过的，我扔海里，钱照付——下回你就知道该带什么来了。”"

[[tracks.chapters.choices]]
key = "accept"
text = "接下：十五匹棉布、三十袋米，运来能岛。"
