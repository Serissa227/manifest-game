# 三′、结账（有布被扔进海）：帆少了两匹布，窄了一幅；同样的试船，报酬折半。
[[tracks.chapters]]
key = "settle_partial"
title = "窄一幅的帆"
text = "二十天后，第一条挂棉帆的小早下了水。缝帆棚外的晾竿上，挂着那两匹泡开了线的布，水早就干了，没人收——武吉叫人留着的。帆少了两匹布，比他要的窄了一幅，帆角打着补丁。他站在船头朝你招手：“上来！布少两匹，帆小一圈，看看还跑不跑得过来岛的转流。”能岛和来岛之间的水道正在掉头，漩涡一个接一个往下拧。船工解了缆，窄帆鼓起来，小早晃了一下，才歪着身子冲进急流。"
