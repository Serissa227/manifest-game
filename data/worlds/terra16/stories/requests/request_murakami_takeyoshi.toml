# 二、交货：能岛码头。老验货人撕布条泡海水、插竹签查米；三种交法，货都扣走、钱都照付。
[[tracks.chapters]]
key = "deliver"
title = "码头上验布"
text = "货卸上能岛的码头，棉布一摞，米袋一垛。武吉的验货人是个缺了两根手指的老船工，从每匹布的边上撕下一条，泡进一桶海水，捞出来和徒弟一人捏一头，使劲对拉；米袋一袋袋插竹签，抽出来倒在掌心里，看有没有掺沙。码头边的水面上漂着一匹布，泡得发白，是前一条船送来的。武吉蹲在缆桩上啃鱼干，一句话不说，只盯着那两双手。"
speaker = "captain"
mood = "tense"
at = "noshima"
when = [{ kind = "alive", person = "murakami_takeyoshi", value = true }]
objectives = [{ kind = "goods", good = "cloth", qty = 15, at = "noshima", text = "十五匹棉布运到能岛" }, { kind = "goods", good = "rice", qty = 30, at = "noshima", text = "三十袋米运到能岛" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "murakami_takeyoshi", value = -3 }, { kind = "flag", flag = "c13_request_murakami_takeyoshi_late" }, { kind = "letter", person = "murakami_takeyoshi", text = "船老大：布我从别处弄到了，米也有人送了。你那船货还在半路的话，卖给别人去。下回别空着船过我的海，我的人认得你的帆。武吉" }] }

[[tracks.chapters.choices]]
key = "sorted"
text = "让他们验——货在船上就分过等了。"
news = "能岛码头上验布，一个外来船长的十五匹棉布泡过海水条条拉不断，村上家那个缺两根手指的老验货人，这回一匹也没往海里扔。"
next = "settle"
reply = "十五条布泡过海水，拉得绷绷响，一条也没断；竹签抽出来，掌心里只有米。老船工把最后一条布搭在桶沿上，朝缆桩那边点了点头。武吉把鱼干一口咬断：“船老大，你的舱比我的账房还干净。”他叫人把米扛去伙房，布直接抱进了缝帆的棚子。"
effects = [{ kind = "cash", value = 1950 }, { kind = "affinity", person = "murakami_takeyoshi", value = 3 }, { kind = "flag", flag = "c13_request_murakami_takeyoshi_clean" }]
