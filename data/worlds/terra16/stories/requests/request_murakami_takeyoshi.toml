reply = "他在你肩上拍了一巴掌，拍得你往前一栽，手上的泥全印在你衣服上。“船老大，别拿你们那边织坏了的布来。经线松的，泡一回海水就散，我这儿的人一拉就知道。”说完又钻回船底下去了，刮藤壶的声音比刚才响。"
