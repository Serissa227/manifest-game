text = "这趟货跑不了，你另找船。"
next = "failed"
reply = "他没再看你，把草席帆往架子上一甩，转身冲船底下吼：“刮了一上午才刮出半条船？手是借来的？”几个船工缩着脖子，铲子刮得火星直冒。"
