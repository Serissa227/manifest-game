# 三、结账（布全过了）：二十天后第一条棉帆小早下水，趁转流跑一趟来岛。
[[tracks.chapters]]
key = "settle"
title = "棉帆的小早"
text = "二十天后，第一条挂棉帆的小早下了水。帆是新缝的，白得晃眼，帆角绑着三道麻绳，是那个缺两根手指的老船工熬了一夜打的。武吉站在船头朝你招手：“上来！趁转流，跑一趟来岛再回来。”能岛和来岛之间的水道正在掉头，海面上一个漩涡挨着一个漩涡，像有人在底下搅一口大锅。船工解了缆，帆一下子吃满了风，小早贴着漩涡的边窜了出去，快得像一条鱼。"
speaker = "murakami_takeyoshi"
mood = "cheerful"
