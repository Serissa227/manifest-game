# 四、一次比一次乱：出海一个月，每天正午量一次太阳，再看一眼钟。
[[tracks.chapters]]
key = "sea"
title = "一次比一次乱"
text = "出海一个月，每天正午你都量一次太阳，再看一眼钟。前十天钟只慢一点，第二十天起，一次比一次乱，有一天快，有一天慢。册子的最后一页还空着，要你写一句总的话。"
speaker = "captain"
mood = "tense"
cast = ["matthias_hoffmann"]
when = [{ kind = "alive", person = "matthias_hoffmann", value = true }]
objectives = [{ kind = "wait", days = 30, text = "在海上走满一个月" }]

[[tracks.chapters.variants]]
key = "warm"
when = [{ kind = "flag", flag = "c13_request_matthias_hoffmann_warm" }]
text = "出海一个月，每天正午你都量一次太阳，再看一眼钟。箱底的铜盘一直是温的，前十天钟只慢一点。第二十天起，一次比一次乱，有一天快，有一天慢。册子的最后一页还空着，要你写一句总的话。"

[[tracks.chapters.choices]]
key = "honest"
text = "照实写：前十天可用，二十天以后不能信。"
next = "report"
reply = "你写完，把册子合上。箱子里的钟还在走，走得很认真。"
effects = [{ kind = "affinity", person = "matthias_hoffmann", value = 3 }, { kind = "flag", flag = "c13_request_matthias_hoffmann_honest" }]

[[tracks.chapters.choices]]
key = "star_check"
