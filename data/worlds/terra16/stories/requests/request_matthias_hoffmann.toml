hint = "夜里量星的仪器你还不会读，算出来的数只能是猜的。"
reply = "你算出二十天后的误差，在赤道上差不多有一百海里。你把这个数写在最后一页，写得很小。"
effects = [{ kind = "affinity", person = "matthias_hoffmann", value = 3 }, { kind = "flag", flag = "c13_request_matthias_hoffmann_honest" }]

[[tracks.chapters.choices]]
