effects = [{ kind = "flag", flag = "c13_request_oda_nobunaga_late" }, { kind = "letter", person = "sen_rikyu", text = "船主足下：安土来的那张纸，代官在会所里压了些日子，前几天收起来了，说不必再答。那只球，听说还摆在城里。您下回到堺，来茶室坐坐。——宗易" }]

