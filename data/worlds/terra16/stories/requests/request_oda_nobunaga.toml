text = "四十天后，代官又派人来请。还是那间里间，还是屏风后面两个书记。代官面前摊着一张安土来的纸，纸很厚，只写了一行，墨浓得发亮：从这里一直往西，要走几个月？代官用扇骨压住纸角，先说了另一件事：“你补画的那条海岸，上头看过了，问是谁的手，我报了你的名字。”然后才接着说：“上头拿着那只球转了半晚。球上往东，齐潘古隔一片海就是南蛮人的国；南蛮的船为什么偏偏往西绕？上头要的是数，不是故事。你想好了再说，后面有人记着。”"
