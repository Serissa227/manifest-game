# 请托：安土城的地球仪（request_oda_nobunaga）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude 执笔。仅中文。
# 人物：织田信长 oda_nobunaga（1534-06-23 生，男），1577—82 年是安土城的主人。cast：cast/historical_07_japan.toml。
#       本人始终不出场：他的话只经堺的代官转述（offer 那一句原话），或写在安土送来的纸上（use 的问题与两种回话）。
#       堺的代官、屏风后面的两个书记、脚夫与快马都是叙事人物，不起名、不建 cast。代官史实上是松井友闲（1575 年起任堺代官），正文只称“堺的代官”。
# 类型：找东西（find）。报价：来信／代理人（L），auto=true，报价港堺（sakai），family=c13_offer_sakai，冷却 20 天。
# 窗口：offer 1577-03-01 起（名声 25），deadline 1582-01-31，timeout 直接 failed、不写见闻。
#       handin（交球）与 use（答话）都在堺，deadline 都卡在 1582-05-31（本能寺之前）；两章 when 写 alive oda_nobunaga。
# 章节：offer 代官的传话（堺）→ handin 球上的日本（堺，带着 behaim_globe）→ use 往西要走几个月（堺，交球后等 40 天）→ done / failed。
# 结构：
#   - brief 三章照写，没有拆章。handin 的 redraw 用技能门槛（cartography ≥ 60），use 的 route 用技能门槛（astral_navigation ≥ 60），
#     两章各留一个无门槛的选项（give / unknown），不会堵住堺的请托队列。
#   - 检定失败不显示选项的回复（引擎在失败时改显示分支的见闻），所以 numbers 的失败经过（“说得太长，代官删了一半”）写在 fail 的见闻里。
#   - use 有一个变体 v1_redrawn，读本轨道 handin 设的 _redrawn 旗标，只改正文（代官说上头问过补画的人是谁）；选项不按旗标拆。
#   - item 目标只查持有、不扣：give 与 redraw 自己写 item behaim_globe −1；keep 不扣。
#   - 来信：handin 与 use 的 timeout 各写一封宗易（千利休，sen_rikyu，1577—82 在堺）的短信，两章互斥，任何一条路至多收到一封。
#     来信不用信长署名（超时时他可能已不在世），也不写原因、不写“本能寺”。
#     两个 timeout 各写自己的见闻：分支没写见闻时引擎会退用章节的见闻，那会把“球交上去了”“问过了”记成发生过。
# 好感：接下 +2；交球 +3（照原样）或 +5（补画）；最好结局 +8；折中 +4（照实说不知道）或 +2（检定失败）；扣下不交 −2。
#       brief 的 rewards 行写“好感至多 +13”，按选项逐条照写时补画那一路合计 +15（仍在 +25 的上限内），以选项为准。
# 依据（史实）：耶稣会士曾把地球仪带到信长面前，信长看懂了大地是圆的，并问过从日本往西航行要走多久（弗洛伊斯等人的书简与《日本史》）；
#       1492 年纽伦堡的贝海姆地球仪上还没有美洲，“齐潘古”（马可·波罗书里的日本）画成大洋当中离大陆很远的一个大岛，往东隔一片海就是欧洲；
#       葡萄牙船从日本回里斯本经澳门、马六甲、果阿、好望角，要等几回季风，顺利也要一年半以上。安土城 1576 年起筑。
# 依据（原创）：会所里间与屏风后的两个书记（记下名字、划掉名字）、代官那把合着的扇子、去年拿染石充琥珀被烧了船的唐人、
#       油布与杉木箱、补画海岸用的掺胶墨、安土送来的厚纸与浓墨、球上往东近而船往西走的那一问、回话里的“好”字。
# 不写：名物狩、矢钱、伊贺（C7 tie_naya_kaede 已写）；本能寺与信长的死；不设召见的旗标、不开新轨道（route 的回话只是一句话）。
#       cast 无 secret；有 fate（honnoji），只用 alive 条件与 deadline 避开，正文一字不提。不写恋爱；不用 relation / tie / bond / heart。
# 读写的旗标：读 c13_request_oda_nobunaga_redrawn（use 的变体，本轨道设）。不读、不设任何 c7_ 旗标；无主线门禁。
#       设 c13_request_oda_nobunaga_accepted / declined（offer）；分支 _gave（give、redraw）、_redrawn（redraw）；
#       终局 _done（numbers 成功、route）、_partial（numbers 失败、unknown）、_failed（keep）、_late（handin、use 的 timeout）、_declined（offer）。
# 报酬：现金最好 2600、折中 1300（只在 use 付一次）；声望 oda +3、名声 +5、回忆一张，只在最好结局。无唯一奖励物品、无技能奖励。
# 依赖：港口 sakai（ports_east_asia.toml）；物品 behaim_globe（items/items_instrument_01.toml）；势力 oda（factions/10_japan.toml）；
#       技能 cartography、astral_navigation（skills.toml）；人物 sen_rikyu（来信）。属性 eloquence。
#       整合问题：behaim_globe 的 shop.cultures 是 ["northern"]，寰宇没有 northern 文化的港口，商店里买不到；
#       眼下只有安特卫普星期五市场的拍卖（auctions.toml antwerp_vrijdagmarkt，七月）会出这一件。需要整合方给它配上 lowland / nordic 的商店，或另定来源。
# 回忆插画清单：
#   mem-request_oda_nobunaga-use「安土城里转动的球」：安土城的灯下，木架上的地球仪慢慢转着，一只手按在大洋当中那个叫齐潘古的岛上，看不见手的主人。

[[tracks]]
key = "request_oda_nobunaga"
name = "安土城的地球仪"
kind = "request"
