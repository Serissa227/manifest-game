# offer · 1577 起 · 堺的会所：代官转述安土的一句话
[[tracks.chapters]]
key = "offer"
title = "代官的传话"
text = "堺的代官派人到码头来请你，说会所里有话。里间点着两盏灯，一扇屏风后面坐着两个书记，你一进门就听见那边研墨。代官手里攥一把合着的扇子，先问你的名字和船名，屏风后面的笔跟着动了。然后才说正事：安土的上头前些日子看过伴天连带来的一只地球仪，海和地都画在一个球上，看了一下午，问了许多话。“南蛮人那只，他们拿回去了。我要一只不用还的。”代官说这是上头的原话。伴天连讲过，那只球是照北方一座城里的老样子做的，上头要的就是那种。代官把扇子在膝上点了点：“上头最恨拿假东西糊弄他的人。去年有个唐人拿染过的石头充琥珀，上头叫人把他的船烧了。人倒是放了。”他看着你，等你开口。"
mood = "tense"
at = "sakai"
when = [{ kind = "date", from = [1577, 3, 1], to = [1582, 1, 31] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 25 }]
deadline = [1582, 1, 31]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "答应下来：去北边的港口找一只那样的球"
next = "handin"
effects = [{ kind = "flag", flag = "c13_request_oda_nobunaga_accepted" }, { kind = "affinity", person = "oda_nobunaga", value = 2 }]
reply = "代官点了一下头，屏风后面又写了一行。他起身送你到里间门口，扇子挡住半边嘴，声音压得很低：“东西到了，先给我看。我看不出真假——但上头看得出。”说完他退回灯下，你出门时，那边研墨的声音还没停。"

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：这种东西，你弄不来"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_oda_nobunaga_declined" }]
reply = "代官没说话，扇子在膝上停住了。屏风后面轻轻一响，是笔在纸上拉过去的声音，书记把你的名字划掉了。代官朝门口抬了抬下巴，叫下一位进来。"

# handin · 堺的会所：地球仪摆上桌，球上找不到日本
[[tracks.chapters]]
key = "handin"
title = "球上的日本"
text = "我叫人把地球仪从船上抬进会所，木架子上蒙着油布，一掀开，代官先退了半步。他没叫书记过来，自己伸手一拨，球慢慢转起来：海是青的，地是褐的，满球弯弯曲曲的南蛮字。转了一圈，他按住球问我：“日本在哪里？”我找了一会儿才指给他：大洋当中孤零零一个大岛，旁边写着“齐潘古”，离唐土远得很，形状像一只竖着放的靴底。代官凑过去，手指在那个岛上来回摸。“九州呢？奥州呢？”他抬起头，“这是谁的日本？”"
speaker = "captain"
mood = "tense"
at = "sakai"
when = [{ kind = "alive", person = "oda_nobunaga", value = true }]
objectives = [{ kind = "item", item = "behaim_globe", qty = 1, text = "带来一只北方做的地球仪" }, { kind = "at", at = "sakai", text = "把球抬进堺的会所" }]
deadline = [1582, 5, 31]
news = "堺的会所里，代官把一只外国来的地球仪转了一圈也找不到日本，还是船主指给他：大洋当中一个写着“齐潘古”的岛。"

[tracks.chapters.timeout]
next = "failed"
news = "堺的人说，代官托人去找的那只外国地球仪，等到最后也没送进会所，屏风后面的书记再没记过这件事。"
effects = [{ kind = "flag", flag = "c13_request_oda_nobunaga_late" }, { kind = "letter", person = "sen_rikyu", text = "船主足下：代官那边，已不再问起地球仪的事了。是另托了人，还是上头不要了，我没有问。您若真找着那样一只球，来堺时抬到茶室，让我也看一眼。——宗易" }]

[[tracks.chapters.choices]]
key = "give"
text = "照原样呈上，岛画成什么样就是什么样"
next = "use"
effects = [{ kind = "item", item = "behaim_globe", qty = -1 }, { kind = "affinity", person = "oda_nobunaga", value = 3 }, { kind = "flag", flag = "c13_request_oda_nobunaga_gave" }]
reply = "代官没说那个岛画得对不对。他叫人用油布把球裹回去，装进一只杉木箱，箱角塞满稻草，绑在一匹快马的鞍后。马出了会所的门，他才转过身来：“上头若问起那个岛，我就说，南蛮人只见过这么一个日本。”"

[[tracks.chapters.choices]]
key = "redraw"
text = "要一支细笔，在球上把日本的海岸补画对"
next = "use"
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "你画不出从九州到奥州那一长条海岸，落笔只会多画错一个日本。"
news = "堺的会所里，有个船主拿细笔在一只外国地球仪上补画了日本的海岸，代官盯着看了半天，说安土那边一定要问。"
effects = [{ kind = "item", item = "behaim_globe", qty = -1 }, { kind = "affinity", person = "oda_nobunaga", value = 5 }, { kind = "flag", flag = "c13_request_oda_nobunaga_gave" }, { kind = "flag", flag = "c13_request_oda_nobunaga_redrawn" }]
reply = "我要来最细的笔，蘸了掺胶的墨，在“齐潘古”旁边的空海里，从九州南端起笔，往东北一路画到奥州，濑户内海留了一道细缝，四国和九州隔开。代官一声不出，盯着那条新画的海岸看了很久，久到屏风后面的书记咳了一声。“上头一定会问，这是谁画的。”他把我的名字又念了一遍，念得很慢，屏风后面一笔一画地记了下来。"

