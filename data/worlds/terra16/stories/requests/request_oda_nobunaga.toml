next = "failed"
news = "堺的人说，有个船主把一只外国地球仪抬进代官的会所，又原样抬回了船上，代官的脸色到天黑都没缓过来。"
effects = [{ kind = "affinity", person = "oda_nobunaga", value = -2 }, { kind = "flag", flag = "c13_request_oda_nobunaga_failed" }]
reply = "我把油布盖回去，叫人抬起木架。代官的脸冷了下来，扇子在膝上合得啪的一响。“你最好别在安土附近停船。”屏风后面，书记的笔停了很久，才又写起来。"

# use · 交球四十天后 · 堺的会所：安土送来一行字
[[tracks.chapters]]
key = "use"
title = "往西要走几个月"
text = "四十天后，代官又派人来请。还是那间里间，还是屏风后面两个书记。代官面前摊着一张安土来的纸，纸很厚，只写了一行，墨浓得发亮：从这里一直往西，要走几个月？代官把纸转过来给你看，又转回去，用扇骨压住纸角。“上头拿着那只球转了半晚。球上往东，齐潘古隔一片海就是南蛮人的国；南蛮的船为什么偏偏往西绕？”他停了一下。“上头要的是数，不是故事。你想好了再说，后面有人记着。”"
mood = "tense"
at = "sakai"
when = [{ kind = "alive", person = "oda_nobunaga", value = true }]
objectives = [{ kind = "wait", days = 40, text = "等安土的回音" }, { kind = "at", at = "sakai", text = "回到堺" }]
deadline = [1582, 5, 31]
news = "堺的人说，安土那边要了一只外国来的地球仪，转了半晚，又托代官问一个船主：从这里往西，要走几个月。"

[tracks.chapters.timeout]
