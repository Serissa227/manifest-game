# 三b、背面什么也没有（检定失败，或纸留在了长崎）：没有司令的字，还去不去念。
[[tracks.chapters]]
key = "reply_partial"
title = "背面什么也没有"
text = "平户，茂吉家门口。他把那本磨烂了边的词本摊在檐下晒，一页压一块小石子。我把纸还给他，他先翻到背面，背面什么也没有。我把长崎的事一五一十说了：司令听完，说认不认都一样，当年那个船长早不在了。茂吉听着，把纸翻回正面，看自己写的那两行，一行划掉的，一行新补的。“他说得也有道理。”他笑了笑，笑得不大像样。“那户人家，我想当面念给他们听。有司令的字，他们才肯信。”他把纸捏在手里，问我：“没有字，还去不去？”"
speaker = "captain"
mood = "sad"
at = "hirado"
objectives = [{ kind = "person", person = "mokichi", text = "回平户找到茂吉" }]
when = [{ kind = "alive", person = "mokichi", value = true }]
deadline_days = 365
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_left"
when = [{ kind = "flag", flag = "c13_request_mokichi_left" }]
title = "抄了四遍的底稿"
text = "平户，茂吉家门口。他把那本磨烂了边的词本摊在檐下晒，看我两手空着，先笑了：“留在司令那里了？”我说司令要想一想，再回话。茂吉点点头，从词本里抽出一张纸，同一句，同样一行划掉、一行新补，字比送去的那张还歪。“底稿。我抄了四遍，送出去的是最不歪的那张。”他把底稿摊平在膝盖上。“等司令想好，黑船也该走了。”他抬头看我：“没有他的字，这一张，还去不去念？”"

[[tracks.chapters.choices]]
key = "go_plain"
text = "陪他去，就念他自己重译的这一行。"
next = "done"
reply = "老人在船棚底下理网绳，听茂吉念完那一行，抬头看了他很久：“当年说‘大家商量’的，也是你。”茂吉说是。老人没再说话，把渔网往他那边推了推，叫他拽住一头。我在棚边坐到天黑，两个人一直没停手。回来的路上，茂吉把工钱塞给我，手掌上全是网绳勒出的红印子。"
effects = [{ kind = "cash", value = 600 }, { kind = "affinity", person = "mokichi", value = 4 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_mokichi_partial" }]
news = "平户浦边一户打鱼人家门口，通事茂吉念了一行旧译文，又陪那家的老人补网补到天黑。"

[[tracks.chapters.choices]]
key = "keep_it"
text = "劝他先别去：没有司令的字，那家人只当又是一句好听话。"
