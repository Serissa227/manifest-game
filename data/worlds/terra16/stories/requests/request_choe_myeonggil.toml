reply = "我只念米、豆、盐三样，念完就停。玄译官等了一会儿，见我不再开口，便在那四个墨点旁边各添了两个小字：未问。“大人认得出哪里是空的。”他说，“空着，他还能再找人去问；填错了，就没人去问了。”"
