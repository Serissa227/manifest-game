news = "釜山的玄译官往汉城寄了一张牛庄的价单，行里人说单子上的马价写得比去年使臣报的还冷清。"
reply = "我说马价想必还在跌，市面冷清，开市的事他们求着朝鲜。玄译官的笔停了：“大人说过，别替谁说好话。”我没改口。他把那四个墨点涂成四行字，照我说的填满了。填完他看了一会儿，说这一份跟去年使臣报的倒是一个样，然后不再说话。"

