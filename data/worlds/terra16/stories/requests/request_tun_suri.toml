reply = "大臣看了你一眼，又看了看盒盖上的纹，没有再伸手。他捧着漆盒，一步一步走进内殿，像捧着一只会晃的碗。"
news = "亚齐王廷的侍从说，柔佛来的漆盒原样呈进了内殿，没人先拆开看。"
