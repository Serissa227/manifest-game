# 三、回柔佛：苏丹的回信很短，她问的是他从哪一页看起。
[[tracks.chapters]]
key = "reply"
title = "从哪一页看起"
text = "回到柔佛，你把苏丹的回信交给敦·苏丽。她还坐在码头的木箱上，腿上压着那张粮单。回信很短：粮单上的东西，给一半；最后一行，他要再想想。她的指头沿着粮单一行一行划下去，划到米那一行停住。“他给的是米，”她说，“盐呢，麻绳呢？”她把信纸翻过来看了背面，背面什么也没写。她把纸折回去压在粮单底下，然后问你苏丹是从哪一页看起的。"
speaker = "captain"
mood = "tender"
at = "johor_port"
objectives = [{ kind = "person", person = "tun_suri", text = "把回信交给她" }]
when = [
  { kind = "date", from = [1571, 1, 1], to = [1586, 12, 31] },
  { kind = "alive", person = "tun_suri", value = true },
]

[[tracks.chapters.choices]]
