next = "done"
reply = "她点点头，说那就够了，一半的粮，比一整行的盟誓实在。“盟誓写在纸上，谁都能念；粮食得一袋一袋过秤。”她付了你酬金，说下回回家的路上，要有一条你的船。"
news = "柔佛的码头上传开了：亚齐苏丹的回信，粮单上的东西给了一半；王女说，一半比一行盟誓实在。"
