# 三之三、焦边的那一页（没借到的一支）：学生还在屋檐下等，问我那一页看见了没有。
[[tracks.chapters]]
key = "result_refused"
title = "焦边的那一页"
text = "从唐物商家出来，青侍还站在书肆的屋檐下。见我两手空空，他没再往前迎，只把那封信从怀里摸出来，又看了一遍，像要从里头再找出一句别的话。街那头，唐物商那间朝西的茶室正照着下午的日头，壁龛前那一页大概还摊着，香炉的烟往上飘。青侍脚边的地上，那天拿树枝画的五册书还在，涂黑的那一角让人踩掉了一半。“先生只说看一眼。”他抬头问我，“那一页，你看见了吗？”"
mood = "sad"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "回书肆门口找那个学生" }]
when = [{ kind = "alive", person = "sanjonishi_kineda", value = true }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_sanjonishi_kineda_late" }] }

[[tracks.chapters.choices]]
key = "plain"
text = "照实说：他不肯借"
next = "failed"
reply = "青侍听完，点点头，说明天一早就走陆路回京。“先生问起来，我就说堺的商人不借书。”他顿了一下，“先生大概会说，本来就不该去借。”他把信揣好，朝我弯了弯腰，往客栈那边去了。"
effects = [{ kind = "affinity", person = "sanjonishi_kineda", value = -2 }, { kind = "flag", flag = "c13_request_sanjonishi_kineda_failed" }]
news = "堺开口神社前那个等船的京里青侍空着手回去了，唐物商壁龛前的旧书，还翻在烧焦的那一页。"

[[tracks.chapters.choices]]
key = "describe"
text = "把那一页上的朱笔，照我看见的说给他听"
next = "failed"
reply = "我把那一页说给他听：朱笔有四处，都在行间，末一处挨着焦边，笔画往右斜；认得的几个字，我念给他听。青侍从怀里摸出纸笔，蹲在屋檐下一处一处记，记完念一遍给我听，又改了两个字。他说回京就念给先生。后来，京里来了一封信。"
effects = [{ kind = "affinity", person = "sanjonishi_kineda", value = -2 }, { kind = "flag", flag = "c13_request_sanjonishi_kineda_failed" }, { kind = "letter", person = "sanjonishi_kineda", text = "学生把你说的那一页念给我听了。末一处朱笔往右斜——先父晚年手抖，写到行末，笔总往右走。是他的字。你念的读法错了两处，学生替你改了，我又改回一处，他也错了。书就留在堺罢。堺的人喝茶的时候，总得有点东西看。" }]
news = "堺开口神社前的书肆门口，一个京里的青侍蹲在屋檐下，听一个船主讲一页书，一边听一边记了满满一张纸。"
