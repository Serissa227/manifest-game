text = "连歌集请他留给学生"
next = "done"
reply = "我没接那部连歌集，请青侍回京时替我问先生一句：这一部，能不能留给他读。他的脸一下涨得通红，嘴张了两回，没说出话，最后把书贴着胸口抱好，冲我深深弯下腰去，半天没直起来。"
effects = [{ kind = "cash", value = 1600 }, { kind = "affinity", person = "sanjonishi_kineda", value = 10 }, { kind = "flag", flag = "c13_request_sanjonishi_kineda_done" }]
news = "堺开口神社前的书肆门口，有个京里来的青侍抱着一部连歌集，脸红到了耳根，逢人就说是一个船主让给他的。"

# 三之二、留在京里的五册（买回的一支）：书不回来了，学生带回一个布包、一部连歌集和公条的信。
[[tracks.chapters]]
key = "result_bought"
title = "留在京里的五册"
text = "一个月后，青侍又站回书肆的屋檐下，背上的包袱轻了——那五册留在京里了。他带回一部连歌集、一个沉甸甸的布包，还有公条的信。布包是先生让带的：“上个月给武家讲书的谢礼。武家的钱，拿来赎书，正合适。”信里说，朱笔那几处他都抄进了自己的本子，抄到烧焦的那一页，搁了半天笔：先父在那里写错了一个字，“我七十多岁才看出来”。连歌集是给我的，先父当年参与编过。信的末尾，他又讲了一遍那个字的读法，比上回多写了半页。"
