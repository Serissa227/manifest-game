# 三、钥匙：钥匙交到阿伊莎手里。长老称她“先生”，她愣了一下。
[[tracks.chapters]]
key = "result"
title = "一把钥匙"
text = "你把钥匙交到阿伊莎手里，她握了很久，没有立刻说话。钥匙是铜的，柄上磨得发亮，是长老的管事一路从捐产的库房里翻出来的。长老又派人捎来一句话，说讲室归她用，称呼是“阿伊莎先生”。她愣了一下。随即把那张借书的名单翻过来，在背面写上一行新的：讲室开门的日子。门外的女孩们还坐在台阶上，有人探头往里看，又缩了回去。"
news = "得土安的码头上传开了：非斯清真寺旁那间空屋的钥匙，交到了一位女先生手里，讲室归她用。"
speaker = "captain"
mood = "cheerful"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "到得土安去" }]
when = [
  { kind = "date", from = [1572, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "aisha", value = true },
]

