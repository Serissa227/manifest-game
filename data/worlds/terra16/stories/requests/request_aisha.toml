# 请托：一间讲室（request_aisha）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：阿伊莎（aisha，1541-08-13 生，女），格拉纳达流亡学者之女，在得土安自家屋里教邻舍的女孩认字；cast 在 cast/classmates_fez.toml。
# 类型：说服（persuade）。四章：offer（报价）、persuade（见长老）、result（钥匙）、result_partial（只借两天的钥匙）。终点 done / failed。
#   结构说明：persuade 的检定失败分支转入 result_partial，由它自己的两个选项结账（现金 500）；不用 variant 改现金，因为 variant 只能改文字。
# 报价：V 到访（auto=true）。offer 章 at=tetouan，family=c13_offer_tetouan、冷却 20 天；deadline 为窗口止日 1590-06-30，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1572-01-01 至 1590-06-30；persuade 进入后 60 天期限；result 与 result_partial 1572-01-01 至 1590-12-31。
# 依据·史实背景：北非的宗教捐产（habous）由长老管理；得土安是格拉纳达流亡者重建的城。长老是叙事人物，不进 cast，正文不写名字。
# 依据·原创：阿伊莎、她的讲室、非斯清真寺旁那间空屋、门边的借书名单、学生们写的字、长老的帘子。
# 依赖：港口 tetouan（ports_north_africa.toml）；技能 calligraphy（skills.toml）；人物 aisha。B10b：无需改名。主线门禁：无（阿伊莎不是主线人物）。
# C7：不写娜拉、塔里克；C7 的家中学堂写作“家里那间屋子挤不下了”，本请托要的是清真寺旁的公家讲室。本文件不读也不设任何 c7_ 旗标。
# 读的旗标：bond aisha 至少 C（offer 的 variant，只改开场的一句问话）。
# 设的旗标：c13_request_aisha_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_two_days（persuade 检定失败，只借两天；只设不读）、_late（超时，终局）、_done（终局）、_partial（终局）。
# 秘密：她想有自己的讲席，堂堂正正被人叫一声先生。正文只在 result 章长老称她“先生”时写“她愣了一下”，不解释；见闻不写。
# 口头禅：阿伊莎的“这本书可以借，下一位也在等。”原句在 C7 的 bond_aisha 已用，跨文件不重复，所以本轨道只在 result 章 hang_key 的回复里用一次改字的呼应（“书可以借，下一位也在等。”）。
# 报酬：现金最多 900（折中 500）；好感最多 +13；名声 +1；回忆 mem-request_aisha-result（只给 result 章的两条最好的结局）。
# 回忆插画 mem-request_aisha-result：门边挂着一张借书的名单，名单旁边是一把黄铜钥匙，名单背面新写着一行字，窗外是得土安的白墙和晒着的布。

[[tracks]]
key = "request_aisha"
name = "一间讲室"
kind = "request"
start = "offer"
auto = true
cast = ["aisha"]

# 一、门边的名单：阿伊莎下到得土安，名单比她带来的书还长。
[[tracks.chapters]]
key = "offer"
title = "门边的名单"
text = "阿伊莎下到得土安的码头，手里拿着一张借书的名单，名单比她带来的书还长。“家里那间屋子挤不下了。”她说，“女孩们坐到门外去，念字的声音一路能传到巷口。”非斯清真寺旁有一间空屋，归一份捐产，管捐产的长老住在得土安，不肯借给一个女先生。她自己去了三回，长老都隔着帘子跟她说话。“你去，他至少得掀开帘子。”她把名单折成一条，塞进你手里。"
speaker = "captain"
mood = "tense"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "到得土安去" }]
when = [
  { kind = "date", from = [1572, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "aisha", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_tetouan"
family_cooldown_days = 20

