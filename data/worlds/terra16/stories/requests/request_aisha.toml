# 二、帘子后面：长老家的客厅。他在帘子后面说话，帘子后面传来翻纸的声音。
[[tracks.chapters]]
key = "persuade"
title = "帘子后面"
text = "长老家的客厅挂着一道帘子，他坐在帘子后面说话，声音不高，也不急。“捐产是给讲经用的。”他说，“讲经的得是先生，先生没有女的。”客厅里的茶凉了，侍从站在门边，没人出声。你站在帘子外头，看得见他的影子，看不见他的脸。说完这句，帘子后面传来翻纸的声音，他在看你递进去的那袋学生的字。"
speaker = "captain"
mood = "tense"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "到得土安去" }]
when = [
  { kind = "date", from = [1572, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "aisha", value = true },
]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "aisha", value = -3 }, { kind = "flag", flag = "c13_request_aisha_late" }, { kind = "letter", person = "aisha", text = "长老的帘子还挂着。我又借了一间邻居的屋子，女孩们坐得下了。——阿伊莎" }] }

[[tracks.chapters.choices]]
key = "argue"
text = "跟他讲：捐产的契上写的是“教人读书”，没写先生是男是女。"
next = "result"
reply = "帘子后面沉默了很久。长老掀开帘子一角，露出半张脸，说契他要再看一遍。第二天一早，他派人送来一把黄铜钥匙，钥匙上缠着一条旧纸，纸上是他自己抄的那一行“教人读书”。"
check = { attr = "eloquence", base = 20, per = 7 }
news = "得土安的书铺里有人说，管捐产的长老又把契看了一遍，松了口，派人送去一把钥匙。"
fail = { next = "result_partial", news = "得土安有人说，管捐产的长老把契又翻了一遍，往后那间空屋每周只肯借出两天。", effects = [{ kind = "flag", flag = "c13_request_aisha_two_days" }, { kind = "affinity", person = "aisha", value = -2 }] }
