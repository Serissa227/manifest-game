reply = "她写下来，写得很慢，每一笔都要问一遍读音。写完她付了钱，把小册子合上，又打开，手指压着那一行。“这本小册子今天有了两样外人给的东西，一部词典，一个词。”"

[[tracks.chapters.choices]]
