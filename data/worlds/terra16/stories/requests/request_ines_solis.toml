effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "ines_solis", value = 8 }, { kind = "fame", value = 1 }, { kind = "skill", skill = "lang_nahuatl", value = 20 }, { kind = "flag", flag = "c13_request_ines_solis_done" }, { kind = "memory", memory = "mem-request_ines_solis-use", title = "小册子里新添的两行" }]
reply = "她说那个词既是“家”，也是“有人等你的地方”。我们俩对着那一行看了半天，最后还是她先读出了声。她付了钱，又在那行字旁边画了一个小圈。"
