# 请托：多算的一年（request_mayta_qipu）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude 执笔。
# 人物：迈塔·基普 mayta_qipu（1540-03-25 生，男），钦查筏商人家的儿子，学院同学（cast/classmates_custom_chincha_rafts.toml）。
# 类型：说服某人（persuade）。章节：offer 报价 → persuade 书记听绳（三条路）→ result 改过的一行；argue 检定失败走 result_partial 推了一季。
# 报价：到访（V）。auto=true；offer 在卡亚俄（callao），窗口 1576-01-01 至 1590-06-30，到期走 failed，不写见闻。family c13_offer_callao，冷却 20 天。
# 身份档 1（匠人、小商、年轻的同学）：现金基数 900，中档 ×1.4 = 1250；推了一季的结局 700（brief 的数字）。
# 依据（史实）：1570—75 年托莱多大巡查与集村、贡额重定，只作背景；正文写“新册子”“巡查的人走后”，不写总督。待核的年份一律用传闻口吻。
# 依据（原创）：卡亚俄港务处的书记（叙事人物，不起名、不建 cast）；结绳账；替病了的邻户代交的那一结；“改过的一行”。
# 依赖：无改名依赖（mayta_qipu、callao 现成）；技能 quipu、lang_quechua 与属性 eloquence 现成。
# 读写的旗标：读 c7_tie_new_mayta_qipu_ika_together（只读，offer 的 variant）；读 bond_mayta_qipu 的 C 级（offer 的 variant）；只设 c13_request_mayta_qipu_*；不设 c7_ 旗标。
# 秘密：夜里对着墙练习（cast secret）。本请托只让玩家看见他讲得顺，persuade 章一句“像是讲过许多遍”带过；见闻不写。
# 回忆插画清单：
#   mem-request_mayta_qipu-result：书记桌边，一根新结的细绳压在改过的那一行册子上。
# 缺省走向：玩家不来，offer 到期走 timeout（不写见闻）；persuade 六十天内没有回应，走 timeout，迈塔来一封信；result 没有期限，可以一直等。
# 结构说明：persuade 与 result 不设 window，窗口由 when 的日期承担，persuade 的缺省由 timeout 承担（window 与 default 是成对的，这里不用 window）。检定失败的分支 next 到 result_partial，不靠互斥旗标门禁。
# 目标说明（checker 改）：persuade 的目标只留 at=callao，不写 person 目标——迈塔的日程在钦查（chincha，1564—1590），person 目标跟着日程走，会与“在卡亚俄”互相打架；他下到卡亚俄只在正文里陪着去。
# 旗标：终局 done / partial / declined / late；分支 accepted、list、delay。

[[tracks]]
key = "request_mayta_qipu"
name = "多算的一年"
kind = "request"
start = "offer"
auto = true
cast = ["mayta_qipu"]

# offer · 1576—1590 · 卡亚俄码头：一根主绳，几十根细绳
[[tracks.chapters]]
key = "offer"
title = "绳上的一年"
text = "卡亚俄的码头边，迈塔蹲在一根褐色的主绳前头，几十根细绳垂下来，每一根都打着结。钦查的筏户今年交贡，书记的新册子上写着欠了一年。可绳子上那一年早就交清了，结打在那里，一个不少。他的手指摸过一个结，停住了。“纸上的字能改，结改不了。”他说，“书记只认纸，绳子说的话，他听不见。”“明天他要扣我两只筏子抵贡。你陪我去，我念，你替我说成他听得懂的话。”"
speaker = "captain"
mood = "tense"
at = "callao"
objectives = [{ kind = "at", at = "callao", text = "在卡亚俄的码头" }]
when = [{ kind = "date", from = [1576, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "mayta_qipu", ge = 18 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_callao"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "go_with"
text = "接下，明天陪他去书记那里。"
next = "persuade"
effects = [{ kind = "affinity", person = "mayta_qipu", value = 2 }, { kind = "flag", flag = "c13_request_mayta_qipu_accepted" }]
reply = "他把绳子一圈一圈收好，收到最后一根，摸了摸上面那个结，说“这是去年的鱼干”。收完他说，明天一早在码头等。"

[[tracks.chapters.choices]]
key = "count_first"
text = "接下，先请他把这一年从头数给我听一遍。"
next = "persuade"
effects = [{ kind = "affinity", person = "mayta_qipu", value = 3 }, { kind = "flag", flag = "c13_request_mayta_qipu_accepted" }]
reply = "他数得很慢，一个结一个结地数，数完了抬头看我，像是在等我数错。我没数错，他才点头，又从头数了一遍，数给自己听。"

[[tracks.chapters.choices]]
key = "decline"
text = "劝他认下官府的册子，就此算了。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_mayta_qipu_declined" }]
reply = "他没说话，把绳子一根根收进麻布袋，收的时候一根也没数。袋口扎了个死结，他把袋子往肩上一甩，走到码头尽头才回头看了一眼港务处的窗口。"

