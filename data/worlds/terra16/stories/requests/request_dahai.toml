# 请托：画圈的地方（request_dahai）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：达海（dahai，1540-01-01 生，男），觉尔察氏的满洲人，九岁起学满、汉两种文字，1574 年起在沈阳文馆主持译书；势力 later_jin，身份档 2。cast：cast/historical_09_liaodong.toml。
# 类型：找东西（find）。四章：offer（来信）、handin（交书）、use（念书，书留给他）、use_lent（念书，借他抄）；没有 stage 章，因此没有 window 与 default。
#       简报是三章：handin 的“留下”与“借抄”两条路在 use 章要付不同的钱。引擎只能用 requires 区分，而“requires 读本轨道在别的路上设的旗标”会让故事机器人报“准备后条件仍不满足”，
#       所以改成按 next 分路：留下走 use，借抄走 use_lent，两章的场面不同（一个人对着书念，一个人对着抄本听），选项与检定相同。
# 报价：L（来信）。人物在沈阳，不下港口；出面的是一个无名的年轻旗下书手，送信到牛庄驿馆（niuzhuang）。auto=true；offer 写 family=c13_offer_niuzhuang、冷却 20 天，speaker 省略。
# 窗口：报价 1571-01-15 至 1576-06-30（deadline，超时直接 failed，不写见闻）；handin 到 1576-09-30（deadline，超时 failed，来信一封）；use / use_lent 进章后 90 天（deadline_days，超时 failed，来信一封）。
# 进行中：use 在 handin 之后 20 天（留下）；use_lent 在 handin 之后 28 天（借抄，抄一套要些日子）。
# 地点：牛庄 niuzhuang（辽河旧道上的驿馆；全轨道只用这一个港）。
# 依据·史实背景：达海译汉籍，后来改进满文（本世界线 1577）；本轨道止于 1576，不写满文已经定制，只在 handin 有书手一句话带过“想在字旁加点、点在哪里还没定”。
#       辽东战役链（TERRA16 §10.5，提前约 55 年）只写人、书与家信：不运兵器、火药、火炮、铁料，不传军情，不改任何战役变量，不给 jianzhou 加声望。
#       《三国志通俗演义》嘉靖元年（1522）刻本二十四卷，装十二册；“张飞据水断桥”一则是长坂坡一节里最有名的一幕。
# 依据·原创：旗下书手、牛庄驿馆的炭盆、念书时画的圈、八个人抄一套书、贝勒们听了两则嫌长。画圈是读书的圈，与满文的圈点是两件事。
# 秘密：译文里哪句硬、哪句软，由他照汗的意思斟酌——本请托一字不碰，见闻也不写。
# 检定失败时引擎显示的是失败分支的 news，不是选项的 reply，所以 plain 的两条 fail.news 兼作失败结果的文字（写成有人物有动作的酒馆闲话）。
# 读的旗标（只读，不设）：无。不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 设的旗标：c13_request_dahai_accepted（offer 接下）、_declined（offer 回绝）、_gave（handin 书留给他）、_lent（handin 借他抄）、_late（handin 或 use 超时）、_done（use 办成）、_partial（use 照字念检定失败）。
# 报酬：现金最多 1600（借抄 1000）、好感最多 +13、技能 lang_jurchen +20；无名声、无声望（辽东中立）；回忆一张；没有额外物品（书是玩家交出去的，不是奖励）。
#       检定失败的现金按简报给 800，不按“借抄”拆开（借抄成功为 1000，仍在上限内）。
# 依赖：港口 niuzhuang（ports_east_asia.toml）；物品 sanguo_jiajing（items/books_12_chinese.toml，商店可买）；技能 lang_chinese、lang_jurchen；属性 eloquence；人物 dahai。
# 回忆插画清单：
#   mem-request_dahai-use「桥上那一声与七个圈」（use 与 use_lent 共用同一个 key 和标题，二选一发生）：牛庄驿馆的长桌，摊开的《三国志通俗演义》，页边一排墨圈，一个圈旁写着小小的满文；窗外是辽河的冰。

[[tracks]]
key = "request_dahai"
name = "画圈的地方"
kind = "request"
start = "offer"
auto = true
cast = ["dahai"]

# 一、墨没干的信：牛庄驿馆，书手送来达海的信。
[[tracks.chapters]]
key = "offer"
title = "墨没干的信"
text = "牛庄驿馆的炭盆边，一个年轻的旗下书手候了半天，见我进门才站起来，双手递上一封信。信纸对折，一半是汉字，一半是满文，满文那半边的墨还没干透，蹭了他半个拇指。汉字写得极工整：“要一部《三国志通俗演义》，嘉靖年间刻的，朝鲜、日本的书铺里常有。书到了，请你念几段给我听。念到可笑的地方，我在旁边画个圈。译书的人最怕两样：一样是没有那个词，一样是有那个词、却不好笑。——达海”落款底下空着一行，像是写到一半，被谁叫走了。"
mood = "cheerful"
cast = ["dahai"]
at = "niuzhuang"
when = [{ kind = "date", from = [1571, 1, 15] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 5 }, { kind = "age", person = "dahai", ge = 18 }]
deadline = [1576, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_niuzhuang"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "答应：书到了，我念给他听。"
next = "handin"
reply = "书手问得一板一眼，像在背：“大人让我问，您念书的时候，会不会学人说话的腔调？”背完才发现自己忘了说别的，红着脸补了一句：“书到牛庄，我在驿馆等。”"
effects = [{ kind = "affinity", person = "dahai", value = 2 }, { kind = "flag", flag = "c13_request_dahai_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：念书不是我的行当。"
next = "failed"
reply = "书手把信折好塞回袖子，人没走。“回绝”这个词满文该怎么写，他站在炭盆边想了半天，最后说：“我就写‘船长忙’。大人要是嫌不准，他自己会改。”"
effects = [{ kind = "flag", flag = "c13_request_dahai_declined" }]

# 二、十二册书：书到牛庄，书手验过，书留下还是借抄。
[[tracks.chapters]]
key = "handin"
title = "十二册书"
text = "书到了，十二册，蓝布函套，船上的潮气没侵进去。书手在驿馆的长桌上摊开第一册，指着目录一个字一个字地念，念错了两个，脸红了，从头再来，才念顺。他说文馆里先前只有几则残抄本，贝勒爷们听人念过两则，都说好，只问能不能别念那么长；大人听完没吭声，回去把那两则又抄了一遍。末了他顺口提了一句：大人这阵子在满文的字旁试着加点，点在哪里还没定，下来时稿子上点子会很密，您别当成墨渍。"
speaker = "captain"
mood = "cheerful"
cast = ["dahai"]
at = "niuzhuang"
when = [{ kind = "alive", person = "dahai", value = true }]
objectives = [{ kind = "item", item = "sanguo_jiajing", qty = 1, text = "带来一部《三国志通俗演义》" }, { kind = "at", at = "niuzhuang" }]
deadline = [1576, 9, 30]
timeout = { next = "failed", effects = [{ kind = "affinity", person = "dahai", value = -3 }, { kind = "flag", flag = "c13_request_dahai_late" }, { kind = "letter", person = "dahai", text = "书从别处找到了，是个抄本，错字不少，我改了一遍。念书的人还没找到。该笑的地方，我先空着，没听人念过，不敢画。——达海" }] }

[[tracks.chapters.choices]]
key = "give"
text = "书留给达海。"
next = "use"
reply = "书手抱着函套，像抱着一只刚生的羊羔，弯着腰过门，不让函套的角碰到门框。到了院里他又折回来：“大人吩咐过，书要是留下了，就得有人把它念出声。二十天后他自己下牛庄。”"
effects = [{ kind = "item", item = "sanguo_jiajing", qty = -1 }, { kind = "affinity", person = "dahai", value = 3 }, { kind = "flag", flag = "c13_request_dahai_gave" }]

[[tracks.chapters.choices]]
key = "lend"
text = "借他抄一套，抄完原书还我。"
next = "use_lent"
reply = "书手立刻数了起来：文馆里有八个人，十二册分下去，抄一套用不了一个月。数完他才想起这是借，不是送，赶紧补上一句：抄的时候不许有一滴墨沾到原书，错一个字，整页重抄。"
effects = [{ kind = "flag", flag = "c13_request_dahai_lent" }]

# 三之一、张飞在桥上（书留给了他）：二十天后，达海本人下到牛庄。
[[tracks.chapters]]
key = "use"
title = "张飞在桥上"
text = "二十天后，达海自己下到牛庄。他带来一支笔、一摞白纸，那十二册书跟着他，函套的边已经磨白了。纸堆最上面压着一页满文稿，字旁点着细点，有的点了又划掉。他不寒暄，在长桌另一头坐下，把稿子翻过去：“从长坂坡念起。”我念到张飞立马桥头，横矛一声大喝，自报“燕人张翼德”，叫曹兵来决一死战，没一个敢上前。他的笔停在纸上方，抬起头：“这里该笑，还是该怕？”书手在门边屏着气，也在等。"
speaker = "dahai"
mood = "cheerful"
cast = ["dahai"]
at = "niuzhuang"
when = [{ kind = "alive", person = "dahai", value = true }]
objectives = [{ kind = "wait", days = 20 }, { kind = "at", at = "niuzhuang" }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "dahai", value = -3 }, { kind = "flag", flag = "c13_request_dahai_late" }, { kind = "letter", person = "dahai", text = "我在牛庄等了三天，念书的人没来。书我留下了，页边的圈一个也没敢画。——达海" }] }

[[tracks.chapters.choices]]
key = "voices"
text = "学着腔调念：张飞吼，曹兵退，一个人念出几个人。"
