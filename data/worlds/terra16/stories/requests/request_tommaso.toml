# 请托：戏箱里多出的人（request_tommaso）。Claude 写（C13d），仅中文。
# 人物：托马索（tommaso，1530-06-05 生，男），职业喜剧团的演员，专演潘塔洛内；势力 venice，身份档 1（匠人档），风险中。cast：cast/story_europe.toml。
# 类型：押运／带人（escort）。三章：offer（报价）、passage（路上一件事，检定）、arrive（到港）；没有 stage 章，因此没有 window 与 default。
# 报价：T（当面）。auto=false，玩家在威尼斯港里“问请托”（ask:request_tommaso）启动；offer 不写 at，objectives 为在港里找到他；
#       窗口 1562-01-01 至 1590-06-30。offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：passage 不设期限，可以一直等（只等开船两天的 wait）；arrive 设 deadline_days=60，超时走 failed，来信一封，好感 -3，旗标 _late。
# 依据·史实背景：1545 年帕多瓦的职业剧团契约（史实，职业剧团的最早记录）；潘塔洛内是即兴喜剧里的吝啬老商人；穆拉诺的玻璃匠不许离开共和国（史实禁令）；
#       那不勒斯的广场上临时搭台演戏。待核：1545 年契约的条文细节，正文只写剧团与戏箱，不引条文。
# 依据·原创：托马索与他的剧团、戏箱、伊斯特拉外海的巡逻船、那个偷渡的玻璃学徒、那不勒斯广场上的那一场戏。
# 秘密：cast 没有写秘密，本请托不处理；见闻只写那不勒斯的那场戏，不写学徒的事。
# C7：pair_theodoros_tommaso 与 tie_tommaso_alvise 不在本文件出现，不写西奥多、阿尔维塞，不写借戏衣的事；不写恋爱；不用 relation / tie / bond / heart 效果。
# 读的旗标：无。不读 C7 的旗标，不设 c7_ 旗标。
# 设的旗标：c13_request_tommaso_accepted（offer 两条接法）、_declined（offer 回绝）、_kept（passage 把学徒留在船上：hide 检定成功、let_tommaso）、
#           _caught（passage hide 检定失败，学徒被带走，罚金由托马索交；本文件新增的分支旗标，arrive 的变体读它）、_done（arrive 看完或不看完，两条收尾）、_late（arrive 超时）。
# 依赖：港口 venice（ports_east_med.toml）、naples（ports_west_med.toml）；属性 eloquence；人物 tommaso；无需 B10b 改名；无主线门禁（gate_main 为空）。
# 报酬：现金 1250（arrive 两条收尾互斥，各给一次）；好感最多 +13；名声 +2；回忆 mem-request_tommaso-arrive（只有看完那出戏时）。不发物品。
# 回忆插画清单：
#   mem-request_tommaso-arrive「台后那盏灯」：那不勒斯广场的小戏台，台后一盏油灯，灯罩在光里发亮；若学徒留在船上，灯罩是他自己吹的。

[[tracks]]
key = "request_tommaso"
name = "戏箱里多出的人"
kind = "request"
start = "offer"
auto = false
cast = ["tommaso"]

# 一、报价：威尼斯港里的小剧场，演完一出戏，托马索请全团喝酒。
[[tracks.chapters]]
key = "offer"
title = "一文也不能多"
text = "威尼斯的小剧场里，潘塔洛内刚在台上抠出一根蜡烛头，台下笑成一片。托马索卸了妆走下台，请全团喝酒，酒钱全是他付的。他坐到你对面，先说：“哎呀呀，又是讨债的？——说笑的。坐，今晚演潘塔洛内挨揍，前排给你留着。”剧团要去那不勒斯演一季，十二个人、五只戏箱。他把船钱一枚一枚数给你，数得很慢：“一文也不能少，也一文都不能多——多了，我就得请你喝酒。”"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1562, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }]
objectives = [{ kind = "person", person = "tommaso", text = "在港里找到他" }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "收下船钱，载剧团去那不勒斯。"
next = "passage"
reply = "他把最后一枚铜币放在你手心，又拿回去，换成了一枚亮一点的。"
effects = [{ kind = "affinity", person = "tommaso", value = 2 }, { kind = "flag", flag = "c13_request_tommaso_accepted" }]

[[tracks.chapters.choices]]
key = "ask_show"
text = "问他们要演什么戏。"
next = "passage"
reply = "“一个吝啬鬼丢了钱袋，满城找。”他眨眨眼，“结尾钱袋在他自己帽子里。那不勒斯人爱看这个。”"
effects = [{ kind = "affinity", person = "tommaso", value = 2 }, { kind = "flag", flag = "c13_request_tommaso_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "戏班子你不载。"
next = "failed"
reply = "他耸耸肩，说那就走陆路，戏箱得雇骡子，又是一笔钱。"
effects = [{ kind = "flag", flag = "c13_request_tommaso_declined" }]

# 二、开船第二天：戏箱里的学徒，巡逻船要查人数。
[[tracks.chapters]]
key = "passage"
title = "手上有烫疤的徒弟"
text = "开船第二天，一只戏箱里传出咳嗽声。托马索把箱盖掀开一条缝，里面蜷着一个十七八岁的小伙子，两只手上全是烫伤的疤。他是穆拉诺的玻璃学徒。共和国不许玻璃匠离开，他想去那不勒斯找活干。托马索把盖子压回去，低声说：“嘘，台词还没到，别出声。”话音没落，船过伊斯特拉外海，一条威尼斯的巡逻船靠了过来，要查人数。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "tommaso", value = true }, { kind = "date", from = [1562, 1, 1], to = [1590, 12, 31] }]
objectives = [{ kind = "wait", days = 2, text = "船出海两天" }]

[[tracks.chapters.choices]]
key = "hide"
text = "把他扮成剧团的人，戴上面具站在台口。"
next = "arrive"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "托马索塞给他一件潘塔洛内的旧袍子，巡逻船的人数了十三个人，剧团说多出来的那个是新来的徒弟。"
effects = [{ kind = "affinity", person = "tommaso", value = 3 }, { kind = "flag", flag = "c13_request_tommaso_kept" }]
fail = { next = "arrive", effects = [{ kind = "affinity", person = "tommaso", value = -2 }, { kind = "flag", flag = "c13_request_tommaso_caught" }] }

[[tracks.chapters.choices]]
key = "let_tommaso"
text = "让托马索决定。"
next = "arrive"
reply = "托马索想了很久，说剧团里正缺一个会做道具的。他把小伙子塞回了戏箱，自己坐在箱子上，跟巡逻船的人聊了半天天气。"
effects = [{ kind = "affinity", person = "tommaso", value = 3 }, { kind = "flag", flag = "c13_request_tommaso_kept" }]

[[tracks.chapters.choices]]
key = "hand_over"
text = "交给巡逻船，免得连累剧团。"
next = "arrive"
reply = "小伙子被带走了，一句话也没说。托马索那天晚上没请任何人喝酒。"
effects = [{ kind = "affinity", person = "tommaso", value = -2 }]

# 三、那不勒斯：广场上搭台，托马索拉你去看第一场。
[[tracks.chapters]]
key = "arrive"
title = "钱袋在帽子里"
text = "那不勒斯的码头上，剧团把戏箱一只只搬下船，当晚就在广场上搭台。两根杆子之间拉起一块旧帆布，台板是从船舱里拆下来的，台下半个广场的人站着看。托马索拉你去看第一场，潘塔洛内满城找钱袋，最后钱袋在他自己的帽子里。台下笑得前仰后合，卖柠檬水的老妇人笑得托盘都端不稳。台后没有那个学徒，托马索照样演得好。"
speaker = "captain"
mood = "cheerful"
at = "naples"
when = [{ kind = "alive", person = "tommaso", value = true }, { kind = "date", from = [1562, 1, 1], to = [1590, 12, 31] }]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "tommaso", value = -3 }, { kind = "letter", person = "tommaso", text = "剧团走陆路到了那不勒斯，骡子钱比船钱多。戏还是那出戏。" }, { kind = "flag", flag = "c13_request_tommaso_late" }] }
news = "那不勒斯的广场上，威尼斯来的剧团演吝啬鬼找钱袋，散场后演吝啬鬼的那个请全场喝了酒。"

[[tracks.chapters.variants]]
key = "v1_kept"
when = [{ kind = "flag", flag = "c13_request_tommaso_kept" }]
text = "那不勒斯的码头上，剧团把戏箱一只只搬下船，当晚就在广场上搭台。两根杆子之间拉起一块旧帆布，台板是从船舱里拆下来的，台下半个广场的人站着看。托马索拉你去看第一场，潘塔洛内满城找钱袋，最后钱袋在他自己的帽子里。台后那盏灯是那个玻璃学徒自己吹的，灯罩薄得像蛋壳。他现在管着剧团的道具，每样东西的账都记在托马索名下。"

[[tracks.chapters.variants]]
key = "v2_caught"
when = [{ kind = "flag", flag = "c13_request_tommaso_caught" }]
text = "那不勒斯的码头上，剧团把戏箱一只只搬下船，当晚就在广场上搭台。两根杆子之间拉起一块旧帆布，台板是从船舱里拆下来的，台下半个广场的人站着看。戏箱里少了一个人。托马索在伊斯特拉替那个学徒交了罚金，人还是被带走了。演到潘塔洛内满城找钱袋，他把那张罚金的收据掏出来，在台上晃了一晃，台下的人都以为是戏。"

[[tracks.chapters.choices]]
key = "watch"
text = "坐在台下看完。"
next = "done"
reply = "台下笑得最响的时候，你回头看了一眼台后那盏灯，灯罩在光里一晃一晃地发亮。散场后托马索请全场喝酒，你那杯他没让你付。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "tommaso", value = 8 }, { kind = "fame", value = 2 }, { kind = "memory", memory = "mem-request_tommaso-arrive", title = "台后那盏灯" }, { kind = "flag", flag = "c13_request_tommaso_done" }]

[[tracks.chapters.choices]]
key = "leave"
text = "看了一半就回船上，明早要开船。"
next = "done"
reply = "第二天一早，托马索来码头，把一壶酒放在你船上，说昨晚的酒钱，他替你付过了。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "tommaso", value = 5 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_tommaso_done" }]
