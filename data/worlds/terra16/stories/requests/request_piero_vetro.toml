# 三、两只杯子：两袋灰各烧一炉，窗台上冷着，天快亮时春灰的那只裂了。
[[tracks.chapters]]
key = "report"
title = "两只杯子"
text = "皮耶罗拿两种灰各烧了一炉，吹了两只杯子，并排放在窗台上冷。他守着看了一夜，也把我拉着守。“冷得慢，裂得慢。”他一会儿看一只，一会儿看另一只，嘴里念着数。天色发灰的时候，春灰那只“叮”地一声，从杯底裂上来。他笑出声：“裂了也能告诉我们什么。”老灰的那只没裂，他却不敢碰，手伸到一半又缩回去，怕一碰就裂。"
speaker = "captain"
mood = "cheerful"
at = "venice"
objectives = [{ kind = "person", person = "piero_vetro", text = "在穆拉诺的玻璃坊找到他" }]
when = [{ kind = "alive", person = "piero_vetro", value = true }]
news = "穆拉诺一家玻璃坊的窗台上，两只杯子冷了一夜，一只从杯底裂上来，另一只没有裂。"

[[tracks.chapters.choices]]
