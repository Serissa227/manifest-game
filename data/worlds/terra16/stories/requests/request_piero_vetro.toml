# 二、贝鲁特的灰作坊：城外海滩，草堆着晒，作坊主看了碎片，说灰没换，草也没换。
[[tracks.chapters]]
key = "arrive"
title = "割早了的草"
text = "作坊在城外的海滩上，一垛垛灰白的草堆着晒，坑里冒着烟。作坊主接过碎片，用指甲刮了刮裂纹，又捏一撮灰在手心搓。“灰没换，草也没换。”他说，把灰撒回坑里，“是割草的日子换了。今年威尼斯的买办催得急，草没等到夏末就割了。春天的草烧出来的灰发白，不够咸。”这话他没跟买办说过，说的时候眼睛看着海，没有看你。"
speaker = "captain"
mood = "mystic"
at = "beirut"
objectives = [{ kind = "at", at = "beirut", text = "到贝鲁特城外的作坊" }]
when = [{ kind = "alive", person = "piero_vetro", value = true }]
