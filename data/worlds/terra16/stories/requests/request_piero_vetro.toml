timeout = { next = "failed", effects = [{ kind = "affinity", person = "piero_vetro", value = -3 }, { kind = "flag", flag = "c13_request_piero_vetro_late" }, { kind = "letter", person = "piero_vetro", text = "贝鲁特的灰还是那样白。我把炉子烧慢了一点，裂得少了一点。——皮耶罗" }] }

