# 一、一排小罐：穆拉诺的玻璃坊，他先夸你的衣裳，再领你看架子。
[[tracks.chapters]]
key = "offer"
title = "一排小罐"
text = "皮耶罗先夸了我的衣裳，才领我看他的架子。一排排小罐，按颜色收着烧坏的碎片，罐口贴着手写的标签。这一季的杯子都在冷却时裂，裂纹细得像头发，一样从杯底往上爬。“杯子出窑的时候都好好的，放一夜就裂。”他把一只裂杯举到窗前又放下，“我疑心是苏打灰不对。贝鲁特城外那家烧海草灰的作坊，今年的灰发白。你去带一袋样灰回来，再问清他们烧的是哪一种草。灰不说话，烧灰的人会说。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "piero_vetro", text = "在穆拉诺的玻璃坊找到他" }]
when = [{ kind = "date", from = [1563, 1, 1], to = [1572, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "piero_vetro", ge = 18 }]
deadline = [1572, 6, 30]
timeout = { next = "failed" }

