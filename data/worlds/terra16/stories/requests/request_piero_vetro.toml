# 请托：冷却时裂开的杯子（request_piero_vetro）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：皮耶罗·韦特罗（piero_vetro，1540-07-19 生，男），穆拉诺玻璃坊的学徒，学院同学（自创）；势力 venice，身份档 1。cast：cast/classmates_custom_murano_glass.toml。
# 类型：去某处（gs，kind=go）。四章：offer（报价）、arrive（贝鲁特取样灰）、report（两袋灰，两只杯子）、report_partial（只有一袋灰）。
#   brief 写三章；按“路由而不是门禁”的规定，检定失败与花钱买的一袋灰拆进 report_partial，report 只接两袋灰的路。
# 报价：T（当面）。他按日程在威尼斯的玻璃坊，auto=false，玩家“问请托”（ask:request_piero_vetro）启动；offer 不写 at，目标是在港里找到他。窗口 1563-01-01 至 1572-06-30。
# 进行中：offer 的 deadline 为 1572-06-30，timeout 走 failed，不写见闻。arrive 期限 120 天，超时走 failed，来信一封，好感 -3，旗标 _late。report 与 report_partial 是普通章，可以一直等。
# 依据·史实背景：穆拉诺的透明玻璃用黎凡特（叙利亚沿海）的苏打灰，海滨草烧成；威尼斯与奥斯曼 1570—1573 年因塞浦路斯开战，期间威尼斯船不进黎凡特的港（arrive 的 v1_cyprus）。
# 依据·原创：皮耶罗与他的小罐、贝鲁特城外的灰作坊与作坊主、春草与夏末草的说法、两袋灰的绳子颜色、窗台上的两只杯子。
# 秘密：欠着一炉烧坏的料钱，不写；offer 里夸衣裳只是他的习惯，不解释。见闻不写秘密。
# 与 brief 的偏离：（1）report 的 pick_up 与 note_only 不再 requires 两袋灰旗标——两袋灰的路直接进 report，一袋灰的路进 report_partial；（2）report 与 report_partial 写 at=venice，让见闻能在穆拉诺公开（brief 写 null）；（3）arrive 的 1570—73 年变体只覆写文字，“commerce 检定改为难”引擎的变体不能改玩法，检定保持一般，留作后续；（4）arrive 的 v2_asked 为新增变体（读 offer 的 ask_cups 旗标）。
# 读的旗标：bond piero_vetro ≥ C（offer 的 v1_classmate，只读 C7 的重逢结果）；c13_request_piero_vetro_asked（arrive 的 v2_asked）。
# 设的旗标：c13_request_piero_vetro_accepted（offer 两条接法）、_asked（offer 的 ask_cups）、_declined（offer 回绝）、_two（arrive 两袋灰的路，未被读取，留给后续）、_late（arrive 超时）、_done（report 的 pick_up）、_partial（report 的 note_only；report_partial 两条收尾）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 报酬：现金最多 1250（只带回新灰 800；一袋灰 600—800）；好感最多 +13；名声 +1；唯一奖励 murano_beaker（只在 pick_up 给一次）；回忆 mem-request_piero_vetro-report。
# 依赖：港口 venice、beirut（ports_east_med.toml）；技能 lang_arabic（skills.toml）；属性 commerce（captain.toml）；物品 murano_beaker（items/items_curio_02.toml）；人物 piero_vetro。日程已是 venice，无需 B10b 改名。
# 回忆插画清单：
#   mem-request_piero_vetro-report「窗台上的两只杯子」：穆拉诺玻璃坊的窗台上，两只杯子并排冷着，天快亮时一只从杯底裂上来。

