  { kind = "affinity", person = "jean_de_valette", value = 8 },
  { kind = "memory", memory = "mem-request_jean_de_valette-arrive", title = "烟里的比尔古" },
  { kind = "flag", flag = "c13_request_jean_de_valette_done" },
]
