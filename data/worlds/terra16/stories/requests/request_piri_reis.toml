text = "你把三处的名字和数字交给老抄写员，他一条一条誊上去。誊到希俄斯那一条，他只誊了半行，誊到坎迪亚那一行，又是半行。两处旁边都画着小圈，他说：“下一个船长再补。”他拿袖口按了按没干的墨。誊完，他从柜子底下抽出另一部抄本，推到你面前。抄本的布角磨出了毛边。老人的书一共抄了三部，这一部，给替它跑腿的人。"

[[tracks.chapters.variants]]
key = "v2_chios"
