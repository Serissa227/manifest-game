text = "你把三处的名字和数字交给老抄写员，他一条一条誊上去。誊到希俄斯那一条，他只誊了半行，旁边画了个小圈，说“下一个船长再补”。罗得的旧港和坎迪亚的水深，他誊得又快又整齐，墨还没干，他就拿袖口去按。誊完，他从柜子底下抽出另一部抄本，推到你面前，纸角上还压着老人的那枚铅坠。抄本的布角磨出了毛边。老人的书一共抄了三部，这一部，给替它跑腿的人。"

[[tracks.chapters.variants]]
key = "v3_candia"
