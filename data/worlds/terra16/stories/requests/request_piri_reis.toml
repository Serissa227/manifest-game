text = "你把三处的名字和数字交给老抄写员，他一条一条誊上去。希俄斯的小湾、罗得的旧港都誊得整齐，誊到坎迪亚那一行，他只誊了半行，旁边画了个小圈，说“下一个船长再补”。他的手停了很久。墨还没干透，他拿袖口轻轻按了按。誊完，他从柜子底下抽出另一部抄本，推到你面前。抄本的布角磨出了毛边。老人的书一共抄了三部，这一部，给替它跑腿的人。"

[[tracks.chapters.choices]]
key = "accept"
text = "收下抄本，带上船。"
next = "done"
