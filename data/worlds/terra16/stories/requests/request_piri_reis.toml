# 五、誊到坎迪亚那一行：三处的名字交回去，老抄写员誊到坎迪亚那一行，手停了很久。
[[tracks.chapters]]
key = "back"
title = "誊到坎迪亚那一行"
text = "你把三处的名字和数字交给老抄写员，他一条一条誊上去。希俄斯的小湾，罗得的旧港，誊到坎迪亚那一行，他的笔停了停，手停了很久，才把数字写下去。墨还没干透，他拿袖口轻轻按了按。誊完，他从柜子底下抽出另一部抄本，推到你面前，纸角上还压着老人的那枚铅坠。抄本的封皮是旧布，布角磨出了毛边，里头的纸还是新的。老人的书一共抄了三部，这一部，给替它跑腿的人。"
mood = "sad"
at = "istanbul"
objectives = [{ kind = "at", at = "istanbul", text = "回伊斯坦布尔去" }]
news = "伊斯坦布尔兵工厂边上的老抄写员，续完了一部被处死的老船长的海书。"
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_piri_reis_late" }], news = "兵工厂边上的老抄写员，把《海事之书》的增订稿抄完了，有三处地名旁边画着小圈。" }

[[tracks.chapters.variants]]
key = "v1_both"
when = [
  { kind = "flag", flag = "c13_request_piri_reis_half_chios" },
