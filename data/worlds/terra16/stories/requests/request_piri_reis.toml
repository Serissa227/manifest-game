speaker = "captain"
mood = "tense"
at = "candia"
objectives = [{ kind = "at", at = "candia", text = "到坎迪亚去" }]
news = "坎迪亚港务处里，一个外国船长揣着罗得修士的信，港务官说这事要问修道院的院长。"
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_piri_reis_late" }], news = "坎迪亚的修道院门口，有人说罗得修士托带的那封信，蜡封还是完整的，一直没有送进门。" }

[[tracks.chapters.choices]]
key = "monk_route"
text = "把信送到修道院，请院长出面。"
