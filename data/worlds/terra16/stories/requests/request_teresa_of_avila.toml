news = "阿雷纳尔码头上，几个远亲请一个晒黑的秘鲁来客喝酒，喝到天黑，有人替他付了账。"

# 收尾：栅栏后面。兄弟到了，房子的事他会办；她问你要什么。
[[tracks.chapters]]
key = "settle"
title = "栅栏后的笑声"
text = "修院的会客栅栏是旧木头的，缝里塞着一张写了一半的单子，风一吹就晃。特蕾莎和兄弟在栅栏后面说了半天话。兄弟走了，她的眼睛有点红，嘴上还在开玩笑，说这个人在船上吐了一路，下了船还要跟脚夫讲价。房子的事，兄弟说会想办法。她隔着栅栏问你要什么：“说快些，厨房里的豆子还在火上。”"
mood = "tender"
at = "seville"
when = [{ kind = "alive", person = "teresa_of_avila", value = true }]
objectives = [{ kind = "person", person = "teresa_of_avila", text = "在修院的栅栏前找到她" }]
deadline = [1575, 12, 31]

