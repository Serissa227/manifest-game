  { kind = "letter", person = "teresa_of_avila", text = "兄弟自己找来了，箱子少了一样东西，不要紧。你不用再跑这一趟，修院的事我们自己办。" },
]

[[tracks.chapters.variants]]
key = "short"
when = [{ kind = "flag", flag = "c13_request_teresa_of_avila_short" }]
text = "从秘鲁来的船队上了瓜达尔基维尔河。房东只宽限了半个月，修院的箱子已经堆在门廊下。特蕾莎托你去阿雷纳尔码头接她的兄弟洛伦索：“别让他先去见别人。”船是傍晚靠的岸，码头上的灯一盏盏点起来，几个自称远亲的人已经等在那里，还有拿着账单的。洛伦索晒得黝黑，牵着几个孩子，行李里有一只沉甸甸的箱子，一路都没松手。"

[[tracks.chapters.choices]]
key = "escort"
text = "挡开那些远亲，直接把他领到修院"
next = "settle"
check = { attr = "eloquence", base = 35, per = 6 }
fail = { next = "settle", effects = [{ kind = "affinity", person = "teresa_of_avila", value = -2 }], news = "一个远亲在阿雷纳尔码头硬拉着洛伦索进了酒馆，等他出来，天已经快黑了。" }
effects = [{ kind = "affinity", person = "teresa_of_avila", value = 3 }]
reply = "他进门就跪下来，被特蕾莎一把拉起来。她没骂人，只叫人端来热水，让他先洗一洗码头上的灰。他眼圈红红的，嘴里说的全是路上的事，说船上的水喝起来像铁锈，她听着，一句也不打断。"
news = "阿雷纳尔码头上，一个晒黑的人被领出远亲的人群，进了修院的门。"

[[tracks.chapters.choices]]
key = "papers"
text = "帮他把行李从贸易总署的登记处快些领出来"
