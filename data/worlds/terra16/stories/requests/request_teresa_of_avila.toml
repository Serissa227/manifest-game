fail = { next = "settle", effects = [{ kind = "affinity", person = "teresa_of_avila", value = -1 }], news = "塞维利亚的贸易总署登记处，书记把那只箱子压到了明天，秘鲁来的洛伦索只好空着手先去修院。" }
effects = [
  { kind = "affinity", person = "teresa_of_avila", value = 3 },
  { kind = "flag", flag = "c13_request_teresa_of_avila_papers" },
]
reply = "书记翻了三遍登记簿，最后在箱子上盖了章，还嫌你来得太晚。箱子当天就领出来了，洛伦索抱着它，在码头上站了半天没动。"
news = "塞维利亚的登记处当天就放了一只箱子出来，一个从秘鲁来的人抱着它在码头上站了半天。"

[[tracks.chapters.choices]]
key = "let"
text = "让他先跟远亲们说几句"
next = "settle"
effects = [{ kind = "flag", flag = "c13_request_teresa_of_avila_late_brother" }]
