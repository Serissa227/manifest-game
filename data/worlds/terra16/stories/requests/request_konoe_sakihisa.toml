# 三之二、放鹰回来的人（家老回客气话的一支）：他读一句笑一声，笑了七回。
[[tracks.chapters]]
key = "reply_polite"
title = "七句客气话"
text = "雨停了。前久刚放鹰回来，袖口沾着几根灰羽，鹰在侍从手上抖着翅膀。他接过府内来的回信，是家老的笔迹。他读一句，笑一声，一路读下去，笑了七回：问候、天气、主公安好、府内安好、来使辛苦、改日再叙、恕不尽言。读完他把信往案上一丢，正好落在那六张废稿上头。“七句，句句挑不出错。”他抬头看我，“家老读我的信时，脸是什么样的？”"
