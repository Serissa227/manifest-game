next = "report"
check = { attr = "stewardship", base = 35, per = 6 }
reply = "你一笔一划抄完，小字也抄了，抄得比原页还齐。修士在抄本末尾盖了教堂的印，说：“这一页，有人对过。”"
effects = [{ kind = "affinity", person = "theodoros", value = 3 }, { kind = "flag", flag = "c13_request_theodoros_page" }]
fail = { next = "report", effects = [{ kind = "affinity", person = "theodoros", value = -2 }, { kind = "flag", flag = "c13_request_theodoros_page" }], news = "坎迪亚教堂的修士看不下去外来人歪歪扭扭的笔迹，替他重抄了那一页。" }

[[tracks.chapters.choices]]
