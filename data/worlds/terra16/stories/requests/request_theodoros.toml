# 四、你信不信：威尼斯营房，他拿抄本比着绣片看。抄了小字的一路走这里。
[[tracks.chapters]]
key = "report"
title = "你信不信"
text = "威尼斯的营房里，西奥多把你带回来的抄本摊在长凳上，一页一页地看。看到那只两个头的鸟，他的手停住了，把披风解下来铺在旁边，拿抄本的线和绣片的线一根根比。看到页边那行小字，他没出声，指腹在“未经认可”四个字上压了很久。“小字也抄在上面。”他终于说，“别人抄到家徽就停了。”他抬起头，看着你，像在等一句不会让他难堪的话。“照实说，你信不信？”"
speaker = "captain"
mood = "tender"
at = "venice"
when = [{ kind = "date", from = [1561, 1, 1], to = [1590, 12, 31] }, { kind = "alive", person = "theodoros", value = true }]
objectives = [{ kind = "person", person = "theodoros", text = "找到他，把抄本给他看" }]

[[tracks.chapters.choices]]
key = "truth"
text = "照实说：纹样是一样的，可那户人家自己画的，没人认。"
next = "done"
reply = "他笑了，笑得很轻松，说自己画的也好，至少是他们自己想当皇家。他把抄本折好，缝进了披风的衬里，付了钱，说这件披风现在又多了一层。"
news = "威尼斯营房里那个自称拜占庭皇族后人的轻骑兵，把一页坎迪亚的旧名册抄本缝进了披风衬里。"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "theodoros", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_theodoros_done" }, { kind = "memory", memory = "mem-request_theodoros-report", title = "缝进衬里的抄本" }]

[[tracks.chapters.choices]]
key = "hold_back"
text = "说：纹样一样，簿上有姓，这就够了。"
next = "done"
