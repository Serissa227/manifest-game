# 四之二：只抄了家徽和姓，那行小字没有抄。
[[tracks.chapters]]
key = "report_partial"
title = "没抄的那一行"
text = "西奥多把抄本拿在手里，先看家徽，又看那个姓。他看得很慢，像是怕那只鸟会从纸上飞起来。“有姓，有家徽。”他把纸按在长凳上压平，“够了。”说完他才想起什么，抬头问你，“那行小字呢？你抄了没有？”纸的右下角干干净净，小字那一行没有抄。他的手指还停在那个姓上，没有挪开。"
