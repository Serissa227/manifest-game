effects = [
  { kind = "affinity", person = "seble_wengel", value = 2 },
  { kind = "flag", flag = "c13_request_seble_wengel_accepted" },
  { kind = "flag", flag = "c13_request_seble_wengel_carried" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "奥斯曼人的仓房，我不去碰。"
