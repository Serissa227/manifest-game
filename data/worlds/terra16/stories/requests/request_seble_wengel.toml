# 三、修士上了船：太后的回信，一只磨圆了边的十字。
[[tracks.chapters]]
key = "result"
title = "修士上了船"
text = "修士在码头上等去吉达的船，他还要往亚历山大港去。他把包袱从肩上放下，又背起来，像是在试它的轻重。执事带来太后的回信，信很短，第一句是：“路上可还平安？”她问的是你。随信来的是一个铜铸的手持十字，边角已经被手磨圆了，是太后在崖顶修院那几年用过的。"
at = "massawa"
mood = "tender"
when = [{ kind = "alive", person = "seble_wengel", value = true }]
objectives = [{ kind = "wait", days = 15 }]
deadline_days = 120
timeout = { next = "done", effects = [{ kind = "flag", flag = "c13_request_seble_wengel_partial" }, { kind = "letter", person = "seble_wengel", text = "执事代笔：修士已经上路了。太后的谢礼留在修道院，等你来取。" }], news = "马萨瓦的码头上，等船等了一季的埃塞俄比亚修士，最后背着包袱上了去吉达的船。" }
news = "马萨瓦的码头上，一个埃塞俄比亚修士上了去吉达的船，手里握着一个铜十字。"

[[tracks.chapters.variants]]
key = "v1_books_kept"
when = [{ kind = "flag", flag = "c13_request_seble_wengel_books_kept", value = true }]
text = "修士在码头上等去吉达的船，他还要往亚历山大港去。几部经书留在了仓房里，修士说：“书会有人再抄。”他把空了一半的包袱从肩上放下，又背起来，像是在试它的轻重。执事带来太后的回信，信很短，第一句是：“路上可还平安？”她问的是你。随信来的是一个铜铸的手持十字，边角已经被手磨圆了，是太后在崖顶修院那几年用过的。"

