# 二、驻军长官的台阶：长官不想放人，也不想得罪山上的人。解法三条：检定、钱、文书。
[[tracks.chapters]]
key = "persuade"
title = "驻军长官的台阶"
text = "驻军的长官是个刚从吉达调来的年轻人，坐在仓房对面的办公室里，一条腿搁在桌子上。桌上摆着一只没剥完的橘子，他没碰。他不想放人，也不想为一个修士得罪山上的人。“放了，”他说，“上头问起来，我怎么交代？”书记在一旁低头写字，笔尖停了一下，又接着往下写。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "seble_wengel", value = true }]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "seble_wengel", value = -3 }, { kind = "flag", flag = "c13_request_seble_wengel_late" }, { kind = "letter", person = "seble_wengel", text = "执事代笔：修士被押去了吉达。太后说，再想别的办法。" }], news = "马萨瓦的码头上，奥斯曼驻军把一个关在仓房里的埃塞俄比亚修士押上了去吉达的船。" }
news = "马萨瓦的奥斯曼驻军，放了一个在码头仓房里关了许久的埃塞俄比亚修士。"

[[tracks.chapters.variants]]
key = "v1_carried"
when = [{ kind = "flag", flag = "c13_request_seble_wengel_carried", value = true }]
text = "驻军的长官是个刚从吉达调来的年轻人，坐在仓房对面的办公室里，一条腿搁在桌子上。你把执事的话转给他听：修士走了两个月才下到海边。他抬起头看了你一眼，手里的笔转了一圈。桌上摆着一只没剥完的橘子，他没碰。他不想放人，也不想为一个修士得罪山上的人。“放了，”他说，“上头问起来，我怎么交代？”书记在一旁低头写字，笔尖停了一下，又接着往下写。"

[[tracks.chapters.choices]]
key = "talk"
text = "跟他讲：扣一个修士，山上的人就不卖粮给驻军了。"
next = "result"
reply = "他想了一夜，第二天让人打开仓房的门。修士走出来，先抬头看了看天。"
effects = [
  { kind = "affinity", person = "seble_wengel", value = 3 },
  { kind = "flag", flag = "c13_request_seble_wengel_freed" },
]
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "result", effects = [{ kind = "flag", flag = "c13_request_seble_wengel_freed" }, { kind = "flag", flag = "c13_request_seble_wengel_books_kept" }], news = "马萨瓦的码头上传开了：驻军放了一个山上下来的修士，他带的几部经书却留在了仓房里。" }

[[tracks.chapters.choices]]
key = "pay"
text = "付一笔“保释金”，让他写修士交了保。"
next = "result"
reply = "他收了钱，写了张收据，说上头问起来，就说修士交了保。"
requires = [{ kind = "cash", ge = 500 }]
hint = "长官报的数目，你付不起。"
effects = [
  { kind = "cash", value = -500 },
  { kind = "affinity", person = "seble_wengel", value = 3 },
  { kind = "flag", flag = "c13_request_seble_wengel_freed" },
]

[[tracks.chapters.choices]]
key = "document"
text = "用土耳其文替他拟一份文书：修士是“过境的朝圣者”。"
next = "result"
reply = "他读了你拟的文书，笑了：“过境的朝圣者——这个好，上头最怕管朝圣的事。”他在文书上盖了印。"
