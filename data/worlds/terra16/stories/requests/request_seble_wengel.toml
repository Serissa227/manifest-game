# 请托：码头上的修士（request_seble_wengel）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：塞布莱·温格尔（seble_wengel，女），埃塞俄比亚的太后，先皇莱布纳·丹格尔的遗孀；生年不详（cast 占位 0 年，待核），1568 年卒（史料）。cast 在 cast/historical_04_africa.toml。
# 类型：说服（persuade）。三章：offer（报价）、persuade（驻军长官）、result（修士上了船，含 wait 15 天的目标）。终点 done / failed。
# 报价：L 来信／代理人。auto=true；offer 章 at=massawa，出面的是山上修道院的执事（写身份，不新建 cast，speaker 省略）；请托人只在信里说话。family=c13_offer_massawa，冷却 20 天。deadline 为窗口止日 1567-12-31，timeout 直接 failed，不写见闻。
# 窗口：offer 为 when 里的 date 条件 1557-10-01 至 1567-12-31；persuade 进入后 60 天期限；result 进入后 120 天期限。引擎里普通章没有 window，不写 window/default。
# 依据·史实背景：1557 年奥斯曼取马萨瓦、设哈贝什省（见 ports_east_africa.toml 的 massawa 与 setting）；埃塞俄比亚太后在崖顶修院的旧事只作人物来历，正文只写一只铜十字。修道院的名字不写。
# 依据·原创：执事、驻军长官与书记、仓房的铁条与气窗、几部经书与念珠、太后的几句话、被手磨圆边角的手持十字。驻军长官是叙事人物，不进 cast，正文不写名字。
# 依赖：港口 massawa（ports_east_africa.toml）；物品 ethiopian_hand_cross（items/items_curio_01.toml，唯一奖励）；技能 lang_turkish（skills.toml）；势力 ethiopia（factions/06_africa.toml）；人物 seble_wengel。B10b：无需改名。主线门禁：无。
# 主线旗标：offer 的变体读 c13_main_baraka（由主线第一章设，尚未写入，所以未设时这一句不出现）。
# C7：无。本文件不读也不设任何 c7_ 旗标；与巴蒂·德尔·万巴拉的请托互不引用，不写换俘。
# 读的旗标：c13_main_baraka（offer 变体，只多一句）；c13_request_seble_wengel_carried（本轨道自设自读，persuade 变体）。
# 设的旗标：accepted（offer 两条接法）、carried（offer 问过修士带着什么）、declined（offer 回绝，终局）、freed（persuade 三条解法与检定失败共用）、books_kept（检定失败，经书留在仓房）、document（用土耳其文书）、late（persuade 超时，终局）、done（result 终局）、cross_to_monk（十字给了修士）、partial（result 超时，终局）。
# 秘密：cast 无 secret，本条不写。太后“赎人先赎王子”的看法不评判、不写。
# 口头禅：“路上可还平安？”只在 result 章的信里用一次。
# 报酬：现金 3650（王侯档中等，基数 2600 × 1.4）；好感最多 2+3+8=13；名声 +5；埃塞俄比亚声望 +3；物品 ethiopian_hand_cross 一件（accept 一路）；回忆 mem-request_seble_wengel-result（accept 一路）。
# 回忆插画 mem-request_seble_wengel-result：一只边角被手磨圆的铜十字压在折好的信纸上，信纸边上落着一粒码头的沙，窗外是马萨瓦的白墙与海。

[[tracks]]
key = "request_seble_wengel"
name = "码头上的修士"
kind = "request"
start = "offer"
auto = true
cast = ["seble_wengel"]

# 一、执事带来的信：山上来的执事，信里是太后的话。
[[tracks.chapters]]
key = "offer"
title = "执事带来的信"
text = "马萨瓦的码头上，一个穿旧僧袍的执事从山上下来，怀里揣着一封信，火漆已经发白。他不寒暄，把信递过来，自己退到一边站着。信上的字写得很密，一笔一笔都很稳：“我派去亚历山大港的修士，被奥斯曼人扣在码头的仓房里，已经一个月了。他带着几部经书，还有一封给牧首的信。我不要你低头去求那位长官。我要你把他带出来。”执事说，仓房的门是用一根铁条别着的，修士每天只能从气窗里看一次海。"
at = "massawa"
mood = "tense"
when = [
  { kind = "date", from = [1557, 10, 1], to = [1567, 12, 31] },
  { kind = "age", ge = 17 },
]
deadline = [1567, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_massawa"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_baraka"
when = [{ kind = "flag", flag = "c13_main_baraka", value = true }]
text = "马萨瓦的码头上，一个穿旧僧袍的执事从山上下来，怀里揣着一封信，火漆已经发白。他听说你在开罗读过书，问你认不认得杰巴尔提住宿区的老人，问完也不等你答，就把信递了过来，自己退到一边站着。信上的字写得很密，一笔一笔都很稳：“我派去亚历山大港的修士，被奥斯曼人扣在码头的仓房里，已经一个月了。他带着几部经书，还有一封给牧首的信。我不要你低头去求那位长官。我要你把他带出来。”执事说，仓房的门是用一根铁条别着的，修士每天只能从气窗里看一次海。"

[[tracks.chapters.choices]]
key = "take"
text = "接下，去见驻军的长官。"
next = "persuade"
reply = "执事在胸前画了个十字：“太后说，修士的命比书要紧，书比信要紧。”"
effects = [
  { kind = "affinity", person = "seble_wengel", value = 2 },
  { kind = "flag", flag = "c13_request_seble_wengel_accepted" },
]

[[tracks.chapters.choices]]
