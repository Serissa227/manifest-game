text = "一个多月后，那船火药的钱回来了。小夜自己去了一趟土仓，把桐木箱抱回茶室，一路没让下人碰。她解开仕覆，用这只茶入点了一碗茶请我——茶粉从窄窄的口里倒出来，她拿茶杓刮了两下，刮得很轻。我喝完，她把那张写满主人名字的纸摊在榻榻米上，在末尾添了一行，笔尖停在名字该落的地方。“这一行，”她抬眼看我，“要不要写上您的名字？”"
