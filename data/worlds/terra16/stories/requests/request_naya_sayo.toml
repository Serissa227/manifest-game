effects = [{ kind = "cash", value = -300 }, { kind = "affinity", person = "naya_sayo", value = 3 }, { kind = "flag", flag = "c13_request_naya_sayo_kept" }, { kind = "flag", flag = "c13_request_naya_sayo_paid" }]
news = "堺町东的土仓里，有个外乡船长替纳屋家垫了一期利钱，掌柜说他坐柜二十年，头一回见这样的外人。"

# 三′、外人的钱先还：垫过利钱的那一路。火药船的钱先到一半，小夜先把我垫的利钱包好推回来，土仓的等后一半。
[[tracks.chapters]]
key = "result_paid"
title = "外人的钱先还"
text = "一个多月后，火药船的钱先到了一半。小夜请我进茶室，先不点茶，把一个纸包推到我面前，是我替她垫给土仓的利钱，用纸绳捆了两道，一文不少。“外人的钱先还，土仓的等后一半。”她说这话时没看纸包，看的是壁龛里那枝刚插上的山茶。我问她，家里正短着钱，何必急这一包。她把纸包又往前推了一寸：“记不清欠谁的人家，茶室开不长。”"
speaker = "captain"
mood = "tender"
at = "sakai"
objectives = [{ kind = "wait", days = 30, text = "等火药船回港" }, { kind = "person", person = "naya_sayo", text = "到茶室找她" }]
when = [{ kind = "date", from = [1559, 1, 1], to = [1567, 12, 31] }, { kind = "alive", person = "naya_sayo", value = true }]
deadline_days = 365
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "take_back"
text = "收下纸包，免得她心里搁着。"
next = "result"
news = "堺的纳屋家火药钱刚回来一半，就先把一个外乡船长垫的利钱包好还了，土仓那边倒还等着。"
reply = "我把纸包收进怀里。她这才松开一直按在膝上的手，起身去烧水，水屋里传来舀水的声音。“后一半到了，我再请您来。”她在门口回头，“那时候用的就是那只了。”"
effects = [{ kind = "cash", value = 300 }]

[[tracks.chapters.choices]]
key = "new_bag"
text = "不收，留着等茶入赎回来，给它缝个新仕覆。"
next = "result"
news = "堺的纳屋家火药钱刚回来一半，就先把一个外乡船长垫的利钱包好还了，土仓那边倒还等着。"
reply = "她看了我好一会儿，没再推，把纸包收进袖子。“旧仕覆的绳磨断过两回，是该换了。”过了几天，她托人捎话到船上：新仕覆用的是茶色的绢，绳结照旧打法，只是比旧的紧一些。"
effects = [{ kind = "affinity", person = "naya_sayo", value = 2 }]

# 三、多一段来历：火药船的钱回来了，小夜赎回茶入，用它点茶，问我名单末尾那一行要不要写上我的名字。
[[tracks.chapters]]
