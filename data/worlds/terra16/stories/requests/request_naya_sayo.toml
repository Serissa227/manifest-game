# 三″、只宽了一个月：掌柜不认名单，火药船只回来一半的钱；小夜拿母亲的竹花入换回了茶入，壁龛空着。
[[tracks.chapters]]
key = "result_partial"
title = "空着的壁龛"
text = "掌柜不认那张名单，只肯再宽一个月。一个月过去，火药船只回来一半的钱。到期前三天，小夜从家里的仓里取出一只竹花入，是她母亲生前插花用的，竹节上有一道细裂，她自己抱着去了土仓，把茶入换了回来。茶室里她照样点茶请我，用的是赎回来的那只，壁龛里却什么也没插。“花入押着，等船那一半回来再赎。”她说，“茶入等不得，京都的客人不等人。”"
speaker = "captain"
mood = "sad"
at = "sakai"
objectives = [{ kind = "wait", days = 25, text = "等宽限的一个月过去" }, { kind = "person", person = "naya_sayo", text = "到茶室找她" }]
when = [{ kind = "date", from = [1559, 1, 1], to = [1567, 12, 31] }, { kind = "alive", person = "naya_sayo", value = true }]
deadline_days = 365
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "take_pay"
text = "收下她给的那一份。"
next = "done"
news = "堺的纳屋家赶在当期前赎回了茶入，听说是拿家里一只旧竹花入押进土仓换的，茶室的壁龛这些天一直空着。"
reply = "她把钱用纸包好推过来，包得方方正正。“您替我去土仓说过一回话，这一份是该给的。”她看了一眼空着的壁龛，“花入的事您别惦记，那一半的钱回来，我自己去赎。”"
effects = [{ kind = "cash", value = 1000 }, { kind = "affinity", person = "naya_sayo", value = 4 }, { kind = "flag", flag = "c13_request_naya_sayo_partial" }]

[[tracks.chapters.choices]]
key = "refuse_pay"
text = "钱我不要了，拿去早点把花入赎回来。"
next = "done"
news = "堺的纳屋家赶在当期前赎回了茶入，听说是拿家里一只旧竹花入押进土仓换的，茶室的壁龛这些天一直空着。"
reply = "她看了我好一会儿，才把纸包收回去。“那花入回来的那天，它的来历里就多一行：有个船长替它付过一回当钱。”她另取了一张纸，裁得和茶入那张名单一样大，头一行写上“竹花入，母亲遗物”，第二行先空着，用指甲轻轻划了一道印。"
effects = [{ kind = "affinity", person = "naya_sayo", value = 6 }, { kind = "flag", flag = "c13_request_naya_sayo_partial" }]
