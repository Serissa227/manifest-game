[[tracks.chapters.choices]]
key = "carry"
text = "记下那句话，替她捎回京里。"
next = "done"
reply = "那是一句幡多土话，她教了我三遍。头一遍我学错了调，渔妇笑出了声；第二遍错了一个字；第三遍她点了头，又让我当着她的面再说一遍，才放心。她不肯告诉我是什么意思，只说：“主子听得懂。”"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "hirohashi_kuniko", value = 8 }, { kind = "reputation", faction = "imperial_court", value = 2 }, { kind = "fame", value = 3 }, { kind = "flag", flag = "c13_request_hirohashi_kuniko_done" }, { kind = "memory", memory = "mem-request_hirohashi_kuniko-arrive", title = "栈桥上的两个老人" }, { kind = "letter", person = "hirohashi_kuniko", text = "船家：捎来的那句话，到了。庵里来走动的几位旧日女房传着念了一下午，谁也没听懂，我也不给她们解。我听得懂。她进宫头一年冬天，端御汤烫了手，嘴里漏过一句这样的土话。我那时笑她，她就再没说过。四十年里，这是第二回。锦袋里的御足够不够船家的辛苦，她不会说，我也不问。船家的名字，我记进庵里的回向帐了，排在头几行。——落了发的国子 合掌" }]

[[tracks.chapters.choices]]
key = "refuse"
text = "把最后几枚钱推回去。"
next = "done"
reply = "她不肯收，我也不肯收，两个人在栈桥上把那几枚钱推过来又推过去。最后是渔妇拿了钱，转身进屋，提出一条刚上岸的鲈鱼，草绳穿了鳃，挂到我手上。老妇人这才笑了，一路上我头一回见她笑。那句话她到底没教我：“钱都不肯收的人，哪好再劳烦。我另托人捎去。”"
news = "下田河口那位京里回来的老婆婆，拿锦袋里最后几枚钱跟她姊妹换了条鲈鱼，硬挂在送她回来的船家手上。"
