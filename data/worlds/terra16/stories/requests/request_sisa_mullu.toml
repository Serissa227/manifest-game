# 请托：一季的潜水（request_sisa_mullu）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：西萨·穆柳（sisa_mullu，1540-04-01 生，女），海菊蛤商人的女儿，钦查的学院同学；势力 peru，身份档 1。cast：cast/classmates_custom_chincha_rafts.toml。
# 类型：去某处（go）。四章：offer（报价）、arrive（画圈的那一天）、report（一块木板）、report_partial（只记了一季的木板）。
#   brief 写的是三章。report_partial 是多出来的一章：变体只能改文字，不能改报酬，所以“只记了一季”的分支用 next 进这一章，现金与终局旗标各自写在它的选项里。
# 报价：V（到访）。人物从钦查下到卡亚俄港口，auto=true。offer 写 at=callao，when 为 1564-01-01 至 1580-06-30 的日期窗口与年龄门槛，deadline 为 1580-06-30，timeout 直接 failed，不写见闻。family c13_offer_callao，冷却 20 天。
# 进行中：arrive 在通贝斯的岸上蹲满一个月（wait 30）才出现，deadline_days=120，超时走 failed，来信一封，好感 -3，旗标 _late。
# 依据·史实背景：海菊蛤是安第斯沿海最贵的壳，自古从厄瓜多尔、通贝斯一带的暖水湾潜采，再南运。西班牙人来后，这门买卖仍由沿海的采壳人做。潜采的季节与深度是传闻口吻，待核。
# 依据·原创：钦查的价目墙、西萨的木板与炭条、通贝斯的头人、年轻的采壳人、报价时的那只秤。
# 秘密：收着的旧海菊蛤不写，见闻也不写。口头禅只在 report 章用一次。
# 读的旗标：bond sisa_mullu C（offer 的变体，只读 C7 的重逢结果）。不读任何 c7_ 旗标，不设 c7_ 旗标。
# 设的旗标：c13_request_sisa_mullu_accepted（offer 接下）、_declined（offer 回绝）、_full（arrive 问到整年的数）、_short（arrive 只记了一季）、_late（arrive 超时）、_done（report 收尾）、_partial（report_partial 收尾）。
# 不用 relation / tie / bond / heart 效果。
# 报酬：现金最多 1250（report 全年）、只记一季 750（report_partial）；好感最多 +13；名声 +1；技能 diving +20（只给一次）；回忆 mem-request_sisa_mullu-report。
# 依赖：港口 callao、tumbes（ports_americas.toml）；技能 diving（skills.toml）；属性 eloquence；人物 sisa_mullu。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_sisa_mullu-report「立在墙边的木板」：货栈墙边立着一块画满道道的木板，最后一道旁边画着一个圈。

[[tracks]]
key = "request_sisa_mullu"
name = "一季的潜水"
kind = "request"
start = "offer"
auto = true
cast = ["sisa_mullu"]

# 一、价目墙的第一行：卡亚俄的货栈，她翻海菊蛤，问这筐壳是潜了几回才有的。
[[tracks.chapters]]
key = "offer"
title = "价目墙的第一行"
text = "卡亚俄的货栈里，西萨把一筐海菊蛤倒在桌上，一只一只翻过去，翻到底才抬头问卖主：“这筐壳，是潜了几回才有的？”卖主答不上来，只说壳是好壳。她没接话，又拿起一只。“我要在钦查的换货集上立一面价目墙，”她说，“每种壳的价钱后面写明采它要潜几回，一年里淹死过几个人。北边的海湾，没人去数过。今年有家秤压了分量，我当面就说了，说完还要人家当众再称一遍，所以我走不开。你去通贝斯，蹲在岸上一季，替我数。”"
speaker = "captain"
mood = "tense"
at = "callao"
objectives = [{ kind = "at", at = "callao", text = "在卡亚俄的货栈找到西萨" }]
when = [{ kind = "date", from = [1564, 1, 1], to = [1580, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "sisa_mullu", ge = 18 }]
deadline = [1580, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_callao"
family_cooldown_days = 20

