# 三、一块木板：货栈墙边，她把板子立起来数，数到那个圈。全年的数，加价一成。
[[tracks.chapters]]
key = "report"
title = "一块木板"
text = "西萨把那块画满道道的木板立在货栈墙边，一道一道数过去。木板的边角被手摸得发亮。每个圈旁边都记着下去的是谁，哪一回上来得晚，哪一回要人拖。门框上挂着那杆秤，秤杆上有一道新刻的线。她没有抬头，只把炭条别到耳朵后面。数到那个圈，她的手指停住了。“好看的壳，先数人家潜了几回，再谈价。”她说。“今年收壳，加一成。”说着就要在收价的单子上添笔，卖主已经嚷起来，问凭什么。"
speaker = "captain"
mood = "tender"
at = "callao"
objectives = [{ kind = "at", at = "callao", text = "回卡亚俄的货栈，把木板交给西萨" }]
when = [{ kind = "alive", person = "sisa_mullu", value = true }]
news = "卡亚俄的货栈墙边立着一块画满道道的木板，海菊蛤的收价涨了一成。"

