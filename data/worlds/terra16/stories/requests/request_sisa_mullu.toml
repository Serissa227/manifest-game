# 二、画圈的那一天：通贝斯的海湾，一个年轻的采壳人下去以后很久没有上来。
[[tracks.chapters]]
key = "arrive"
title = "画圈的那一天"
text = "通贝斯的海湾水色发绿。采壳人腰上系着石头沉下去，上来时手里攥着带刺的红壳。你每见一回上来，就在木板上画一道，画满一面换一面。头人坐在礁石上，指着北边最深的那片礁说：“三个人下去，有一个耳朵会坏。”蹲满一个月的那天早上，一个年轻的采壳人下去以后，很久没有上来。拉绳的人把绳子绷得直直的，岸上没有人说话。"
speaker = "captain"
mood = "sad"
at = "tumbes"
objectives = [{ kind = "at", at = "tumbes", text = "在通贝斯的岸上" }, { kind = "wait", days = 30, text = "蹲满一个月" }]
when = [{ kind = "alive", person = "sisa_mullu", value = true }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "sisa_mullu", value = -3 }, { kind = "flag", flag = "c13_request_sisa_mullu_late" }, { kind = "letter", person = "sisa_mullu", text = "「通贝斯的数，我托北来的筏子问了，只问到一半。价目墙上那一行，我先写了个问号。——西萨」" }], news = "通贝斯的采壳湾，说好来数一季潜水的那个外乡船长没有露面，岸上的木板一道也没画。" }
news = "通贝斯的采壳湾，有个外乡的船长在岸上蹲了一个月，木板画满了一块又一块。"

