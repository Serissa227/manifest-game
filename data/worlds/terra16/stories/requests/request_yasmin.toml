# 三之二、规矩是规矩：总管看了画，说画得不错，可外人的画不挂廊下。画没有挂上去。
[[tracks.chapters]]
key = "result_partial"
title = "规矩是规矩"
text = "总管把画卷推了回来。“画得不错。”他说，“可规矩是规矩：外人的画不挂廊下。”他说完，目光落到门口的亚斯明身上，又收了回来，问你：“这是谁画的？”廊下的学徒都停了手，等你开口。画卷还在你手里，颜料没干透，蹭在了他的袖子上。亚斯明没有动，她也在等。"
speaker = "captain"
mood = "tense"
at = "istanbul"
objectives = [{ kind = "at", at = "istanbul", text = "到伊斯坦布尔去" }]
when = [
  { kind = "date", from = [1557, 6, 1], to = [1565, 12, 31] },
  { kind = "alive", person = "yasmin", value = true },
]

