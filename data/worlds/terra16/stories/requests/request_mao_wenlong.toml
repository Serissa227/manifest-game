effects = [
  { kind = "flag", flag = "c13_request_mao_wenlong_saw" },
  { kind = "flag", flag = "c13_request_mao_wenlong_caught" },
]

[[tracks.chapters.choices]]
key = "sleep"
text = "回去睡觉，什么也没看见"
next = "report_unseen"
reply = "我把窗板合上，蒙头躺下。绞盘声响了半夜。天亮时我推窗去看，小湾里只剩几道船底拖过的印子，被潮水舔平了一半。"
effects = [{ kind = "flag", flag = "c13_request_mao_wenlong_unseen" }]

