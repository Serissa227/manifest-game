# 请托：满仓的证词（request_mao_wenlong）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：毛文龙（mao_wenlong，1521 生，男），东江镇总兵，据皮岛（本世界线 1567 年开镇，提前约 55 年，TERRA16 §10.5、§11）；势力 ming，身份档 3；有 fate（1574 年被处死的可能，本请托一字不提）。
# 类型：去某处（go）。三章：offer（皮岛上见到总兵，他领人看满仓，要一纸证词）→ arrive（住到第三夜，岛背面小湾里的事）→ report（证词怎么写）；
#       report 因旗标分流拆成三章：report（夜里看见了）、report_blind（当场照他说的写）、report_unseen（睡过去），所以文件里共五章（另有保留终点 done / failed）。
# 报价：T（当面）。auto=false，玩家在皮岛“问请托”（ask:request_mao_wenlong）启动；offer 不写 at，目标是 person；窗口 1567-06-01 至 1573-06-30，
#       玩家满 17 岁；offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 这是一条“照实 / 遮掩 / 不下结论”的请托：照实写拿不到钱、好感 -10（对他的出卖），终局旗标仍设 done——它是故事上的最好结局，也是唯一有回忆的一支；
#       替他遮掩（只写白天的满仓）拿钱、好感 +8，终局旗标 partial；什么都不写好感 -2，旗标 failed，next 仍是 done。
#       当场照他说的写（sign）与睡过去的（sleep）什么都没看见：按 next 分流到 report_blind / report_unseen，那两章只有 day 与 none，没有 truth（选项里不用 requires 读本轨道的旗标）。
# 依据·史实平移：毛文龙据皮岛，被指虚报兵额、转卖粮货（1621 → 1566/67）；“牵制”是他自己的说法。史实与世界线的界线：只写他请一个外来商人写证词，不写战事、不写袁崇焕、不写他的死。
# 依据·原创：满仓的米袋（梁上有灰，袋上无灰）、石桌上的纸笔、两个不起名的义子、岛背面的小湾与朝鲜小船、人参与貂皮、石桌边煮茶的炭盆。
#       义子不新建 cast；“送回去”不写暴力。
# 秘密：饷银去向、兵额虚实、转卖粮食与人参——他本人一句不认，见闻里一字不写。本请托让玩家自己去看（arrive），但毛文龙的口里没有一句承认；
#       见闻整个文件一条都没有，唯一例外是 arrive 里 slip 检定失败分支的 news——失败时界面要显示一段文字，引擎取的就是这一条，写成只讲“客人走错了路”的闲话，不透露粮与船。
# 辽东战役链：只写人、粮与家信；不运兵器、火药、火炮、铁料，不传军情，不改任何战役变量，不给 jianzhou 加声望。
# 读的旗标：c13_request_mao_wenlong_caught（只读本轨道自己的旗标，report 的变体 v1_caught 读它）。其余旗标（_saw / _unseen / _blind）只设不读，靠 next 分流。
# 设的旗标：_accepted（offer 接下）、_declined（offer 回绝）、_blind（sign）、_saw（korean，slip）、_caught（slip 检定失败，同时设 saw）、_unseen（sleep）、
#       _late（arrive、report、report_blind、report_unseen 超时）、_done + _truthful（report 照实）、_partial + _covered（report 只写白天）、_failed（report 不写）。
#       终局旗标每条路径只设一面（done / partial / failed / late / declined）；不设 c7_ 旗标；不用 relation / tie / bond / heart / title / world / join / leave / start_track / end_track / growth。
# 报酬：现金至多 3650（只有替他遮掩的那一路）；好感 +2（接下）/ +8（遮掩）/ -2（不写）/ -10（照实）；无名声、无声望（隐秘，且不改战役变量）；回忆一张（照实写的那一路）；无物品。
# 依赖：港口 pidao（ports_east_asia.toml，1567 年起开港，dormant until 1567 by L08；若时间线 L08 改写使皮岛仍休眠，这条请托碰不到，属正常）；
#       技能 lang_korean 在 skills.toml；属性 arms；人物 mao_wenlong（日程 1567-01-01 至 1573-12-31 在皮岛）。无需 B10b 改名。
# 缺省走向（玩家什么也不做）：offer 到 1573-06-30 超时，走 failed，无见闻；arrive 与三个 report 章各 30 天不回应，走 failed，各一封毛文龙的短信。
# 回忆插画清单：
#   mem-request_mao_wenlong-report「炭盆里那一团纸」：皮岛，石桌边的炭盆上煮着一壶茶，一个嗓门很大的中年总兵把一团纸扔进火里，纸边卷起，一半黑一半亮；两个义子低头站在后面，海边的天是灰白的。

[[tracks]]
key = "request_mao_wenlong"
name = "满仓的证词"
kind = "request"
start = "offer"
auto = false
cast = ["mao_wenlong"]

# 一、报价：皮岛，毛总兵领人看粮仓。
[[tracks.chapters]]
key = "offer"
title = "满的粮仓"
text = "毛总兵听说来了外来的船，不等人通报，自己拎着一串钥匙下到码头，领我走到半山腰，一脚踢开仓门。米袋从地上码到房梁，梁上积着灰，袋子上却一粒灰也没有。“看见没有？岛上十几万兵，吃的就是这个！”他拍着最近的一袋，袋口的米粒震得直往下掉，又拽我到门外的石桌前：纸笔墨摆得齐齐整整，两个年轻的义子一边一个，站得笔直。“朝里有人参我卖粮，一本接一本。我不辩，我老毛不跟那帮人辩。你是外来的商人，进仓看过了，往这纸上写你看见的。”他压低嗓门，没压住，“奏本里写一句‘商人亲眼所见’，朝里那些人就闭嘴了。”"
objectives = [{ kind = "person", person = "mao_wenlong", text = "在皮岛见到总兵" }]
when = [
  { kind = "date", from = [1567, 6, 1] },
  { kind = "age", ge = 17 },
]
speaker = "mao_wenlong"
mood = "cheerful"
deadline = [1573, 6, 30]

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.choices]]
key = "watch"
text = "答应写，但要先在岛上住几夜"
next = "arrive"
reply = "“住！住三夜都行！”毛总兵一巴掌拍在我背上，回头吼人去东厢收拾铺盖。两个义子对看了一眼，其中一个转身就跑，不知是去铺床，还是去报信。"
effects = [
  { kind = "affinity", person = "mao_wenlong", value = 2 },
  { kind = "flag", flag = "c13_request_mao_wenlong_accepted" },
]

[[tracks.chapters.choices]]
key = "sign"
text = "当场照他说的写"
next = "report_blind"
reply = "“痛快！”他又是一巴掌，拍得我差点扑在石桌上，扭头叫人上酒。一个义子已经蘸好了笔递到我手里，墨汁滴在纸角，晕开一小团。另一个从仓后头搬出一坛酒来，拍开了泥封。"
effects = [
  { kind = "affinity", person = "mao_wenlong", value = 2 },
  { kind = "flag", flag = "c13_request_mao_wenlong_accepted" },
  { kind = "flag", flag = "c13_request_mao_wenlong_blind" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "这证词我不写"
next = "failed"
reply = "他的笑收了一半，另一半还挂在脸上。“行。”他自己把仓门踢回去，铁锁咔哒一声，“船明天一早走，潮不等人。”两个义子上来，一个收笔，一个收纸，手脚比来时快得多。"
effects = [{ kind = "flag", flag = "c13_request_mao_wenlong_declined" }]

# 二、第三夜：岛背面的小湾。三种做法：说朝鲜话（技能）、悄悄退回去（检定）、睡过去。
[[tracks.chapters]]
key = "arrive"
title = "夜里的小湾"
text = "在岛上住到第三夜，我被一阵绞盘声弄醒，推开窗，岛背面有火光。顺着礁石摸过去，小湾里泊着几条朝鲜小船，火把插在石缝里。白天仓里那样的粮袋，一袋接一袋，从栈桥上肩扛手递，上了船；船上卸下来的是成捆的人参，和用草绳扎着的貂皮，堆得比人高。我刚蹲下，一盏灯笼从礁石那头晃了过来，提灯的是个巡夜的义子，一边走一边哼着小调。"
when = [{ kind = "alive", person = "mao_wenlong", value = true }]
objectives = [
  { kind = "wait", days = 3 },
  { kind = "at", at = "pidao", text = "在皮岛住满三夜" },
]
at = "pidao"
speaker = "captain"
mood = "tense"
night = true
deadline_days = 30

[tracks.chapters.timeout]
next = "failed"
effects = [
  { kind = "flag", flag = "c13_request_mao_wenlong_late" },
  { kind = "letter", person = "mao_wenlong", text = "船主，仓门我叫人擦了三遍，等你等到酒都酸了。奏本我另找人写，岛上不缺肯写字的。下回路过皮岛，酒还有。" },
]

[[tracks.chapters.choices]]
key = "korean"
text = "用朝鲜话跟船上的人搭话"
requires = [{ kind = "skill", skill = "lang_korean", ge = 60 }]
hint = "船上的人说的话，我一句也接不上。"
next = "report"
reply = "我站起来，用朝鲜话问了一句。船夫吓了一跳，随即咧嘴笑了：这是换货，每个月都换，“总兵爷的买卖”。灯笼晃到栈桥头，他扬声喊了句什么，灯笼就拐了个弯。他抖出一根扎红绳的人参往我手里塞，当见面礼；我没收，他耸耸肩，又塞回了捆里。"
effects = [{ kind = "flag", flag = "c13_request_mao_wenlong_saw" }]

[[tracks.chapters.choices]]
key = "slip"
text = "趁灯笼没照过来，悄悄退回去"
next = "report"
reply = "我把脊背贴住礁石，听着灯笼的脚步，一步一步往后挪。碎贝壳在脚下硌得生疼，一声也没响。回到东厢，被窝里还是温的，巡夜的小调从窗外过去，又过去了。"
check = { attr = "arms", base = 20, per = 7 }
