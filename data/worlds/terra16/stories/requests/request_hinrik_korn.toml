  { kind = "date", from = [1568, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "hinrik_korn", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

