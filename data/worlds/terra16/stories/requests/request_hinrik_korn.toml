# 二、掌秤人的三袋：卑尔根布吕根的木头商站，掌秤人当众过秤。
[[tracks.chapters]]
key = "deliver"
title = "掌秤人的三袋"
text = "布吕根的木头商站一排排挤在码头边，屋里一股鳕鱼干的咸味。掌秤人一袋一袋过秤，过完了说只有三十七袋，另外三袋“受了潮，不算数”。你记着欣里克敲着桶说的那句：“桶可以空，数不能空。”还有他在粮栈里提的那几袋。往库房门口一望，那三袋好好的，干干净净码在掌秤人自己的门边。"
