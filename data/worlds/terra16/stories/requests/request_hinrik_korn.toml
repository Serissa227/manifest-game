mood = "tense"
at = "bergen"
objectives = [{ kind = "goods", good = "grain", qty = 40, at = "bergen", text = "四十袋谷物运到卑尔根的商站" }]
when = [
  { kind = "date", from = [1568, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "hinrik_korn", value = true },
