# 请托：卑尔根的四十袋（request_hinrik_korn）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：欣里克·科恩（hinrik_korn，1540-11-04 生，男），吕贝克粮栈的学徒，拿指节敲桶板听满空；cast 在 cast/classmates_custom_lubeck_accounts.toml。
# 类型：送货（deliver）。四章：offer（报价）、deliver（卑尔根交货）、settle（收单，全数）、settle_short（收单短了几袋）。终点 done / failed。
#   结构说明：短袋原本设想为 settle 的变体，但变体只能改文字，改不了现金与终局旗标，所以短袋做成独立的 settle_short 章，由 let_go 与交货的检定失败分支 next 过去。
# 报价：T（当面，auto=false）。玩家在吕贝克港问请托（ask:request_hinrik_korn）启动；offer 章不写 at，objectives 为 person hinrik_korn。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1568-01-01 至 1590-06-30，deadline 为窗口止日，timeout 直接 failed，不写见闻。
#       deliver 1568-01-01 至 1590-12-31，进入后 120 天期限；超时走 failed，附一封来信、好感 -3、旗标 _late。settle 与 settle_short 是普通章，没有 default，可以一直等。
# 地点：offer 在吕贝克粮栈（人物当面）；deliver 在卑尔根（bergen）的汉萨商站；settle 与 settle_short 回到吕贝克粮栈（at=lubeck，见闻才有人能听到）。
# 依据·史实背景：卑尔根的德意志商站（布吕根的汉萨木头商站）靠波罗的海与北德的粮换挪威鳕鱼干；北方七年战争（1563—1570，丹麦与吕贝克对瑞典）期间波罗的海有私掠船。掌秤人是叙事人物，不进 cast，正文不写名字。
# 依据·原创：欣里克、他的数单（每十袋画一个方框）、父亲留下的印章戒指、掌秤人库房门边那三袋“受了潮”的谷物。
# 依赖：港口 lubeck、bergen（ports_north.toml）；货物 grain；物品 hanse_signet（items/items_accessory_01.toml）；人物 hinrik_korn。无需 B10b 改名。主线门禁：无。
# C7：不写格蕾塔、不写哥得兰的风暴。本文件不读也不设任何 c7_ 旗标。
# 读的旗标：bond hinrik_korn 至少 C（offer 的 variant，只改开场的一句）；交货章的 variant 只读日期。
# 设的旗标：c13_request_hinrik_korn_accepted（offer 接下，两条接法）、_declined（offer 回绝，终局）、_short（let_go，或交货检定失败，分支旗标，settle_short 章用）、_late（超时，终局）、_done（settle 终局）、_partial（settle_short 终局）。
# 报酬：现金最多 1250（全数收单）+ 货款 600；短袋时工钱 700 + 货款 600、戒指不给；好感最多 +13；名声 +1（只有全数收单给）；唯一奖励 hanse_signet（只完整结局给一次）；回忆 mem-request_hinrik_korn-settle。
#   货款按 brief 放在收单章结算；decisions §二 的“交货章另付”未采用，由整合时决定。
# 秘密：他想当船长，可一上船就晕，每回都躲到舱底吐完。offer 章由他自己笑着说“我一上船就吐”，当笑话讲；此后各章不再拿来取笑；见闻一律不写。
# 口头禅：“桶可以空，数不能空。”只在 deliver 章，由玩家想起他敲桶时说过的这句。
# 回忆插画清单：
#   mem-request_hinrik_korn-settle「桌上的收单与戒指」：粮栈的木桌上铺着卑尔根的收单，每十袋一个方框，框里画满了勾；收单旁边放着一枚旧印章戒指，窗外是吕贝克的屋顶与晾着的麻袋。

[[tracks]]
key = "request_hinrik_korn"
name = "卑尔根的四十袋"
kind = "request"
start = "offer"
auto = false
cast = ["hinrik_korn"]

# 一、晕船的押运人：吕贝克粮栈，他拿指节敲着粮袋走过来。
[[tracks.chapters]]
key = "offer"
title = "晕船的押运人"
text = "欣里克拿指节敲着粮袋一路走过来，敲完一袋，才抬头看你。“我该押一船粮去卑尔根的商站。”他说，“可我一上船就吐，从特拉沃河口吐到斯卡恩，账本都吐湿了。”他自己先笑出了声，又敲了敲袋口。袋口的麻绳上挂着一块木牌，刻着粮栈的记号。“四十袋谷物，你替我运过去，账我在岸上记。卑尔根的掌秤人去年少算过吕贝克三袋，到港的数，一个也不能少。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "hinrik_korn", text = "在吕贝克的粮栈找到他" }]
