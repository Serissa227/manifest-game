# 请托：渡船的三趟（request_ushio）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：汐（ushio，1540-01-01 生，女），能岛村上家的女儿，京都学院同学；势力 imperial_court，身份档 1。cast：classmates_kyoto.toml。
# 类型：打一仗（fight）。三章：offer（报价）、battle（岛缝里的船）、after（渡船上的旗）；没有 stage 章。
#       offer 有两条不打的路：读潮（requires 技能 tide_reading ≥ 60）与引开（seamanship 检定，一般），成功都直接进 after；
#       引开失败，劫船的没上当，回头迎战进 battle。只有“接下来就打”与引开失败两条路会进 battle。
# 报价：T（当面）。人物 1566—1590 按日程在能岛（noshima）渡口；auto=false，玩家用 ask:request_ushio 启动。
#       offer 不写 at，目标是在港里找到她；窗口 1567-01-01 至 1587-06-30（同学重逢之后，丰臣的海贼停止令 1588 之前）。
#       deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：battle 章 deadline_days=90（同一片内海），超时走 failed，来信一封（好感 -3，旗标 _late）。
#       battle 章不设章级见闻（超时会继承章级见闻，“打退了”就成了假话），见闻写在各选项与 fail 分支上。
#       after 章是普通章，可以一直等；见闻写在章上，两个选项共用。
# 依据·史实背景：濑户内海的村上水军向过往船只收“帆别钱”、替交钱的船护航；不服村上家的零散海贼劫小船；
#       1576 年第一次木津川口之战，毛利与村上的船队开进大坂湾（offer 的 variants：那一年能岛的大船都去了大坂湾，内海空了）。
#       关船是村上水军的中型船。劫船的是叙事人物，不写姓名，不写成大海贼；那个后生是成年人。
# 依据·原创：汐的渡船与船头那面靛蓝底、白圈的小旗；炭条写在渡船坐板背面的三趟船期（都在早潮）；
#       早年在土佐下田渔港补网的孩子，如今是比她小几岁的渔家后生，喊她“汐姐”；船板上数了两遍的钱；装白漆的蛤壳与刷船的小漆刷；白圈底下那道潮线。
#       口头禅“等着，潮会转的。”全轨道只在 offer 你问她怎么办时用一次；battle 超时的来信与 after 的 hired 变体照任务单各带半句“潮会……”。
# 不写：冷泉雪、信（C7 的捎信）、过所旗、澪（C7 与主线）；村上武吉不出场，村上家只作背景；鹰丸在能岛的押运请托另有一件，不共用。
#       variants 的 bond 变体只换汐对玩家的称呼与一句“船头”的话，不提任何人名。
# 秘密：她夜里就着灯芯描假名——不碰；炭条写船期、拿漆刷画潮线都不评她的字；见闻一律不写。
# 读写的旗标：只读 c13_request_ushio_hired（after 的 variants）；不读不设任何 c7_ 旗标。
#       写 c13_request_ushio_accepted（三条接法都设，引开失败也设）、_declined、_tide（读潮或引开成功，没打）、
#       _fought（battle 的两个选项都设）、_hired（叫住后生、说动了）、_late（battle 超时）、_done（after）。
# 报酬：现金 1600（只在 after 给一次）；好感最多 +13（接下 +2、battle +3、after +8；读潮 / 引开 +3 再 after +8 = 11）；
#       名声 +1；回忆 mem-request_ushio-after。叫住后生说不动（检定失败）好感 +1。
# 窗口说明：battle、after 的世界窗口止于 1588-08-23；battle 从 offer 止日起最晚到 1587-09 便到期，after 没有期限，
#       引擎的普通章不写 window，所以这里不另加日期条件（加了又没期限会让轨道卡住）。
# 依赖：港口 noshima；人物 ushio（cast/classmates_kyoto.toml）；技能 tide_reading（skills.toml）。无需 B10b 改名。
# 回忆插画：mem-request_ushio-after：能岛渡口最下一级石阶，渡船系在铁环上，汐蹲着把一面靛蓝小旗摊在膝头，白圈下一道弯弯的白漆潮线。

[[tracks]]
key = "request_ushio"
name = "渡船的三趟"
kind = "request"
start = "offer"
auto = false
cast = ["ushio"]

# 一、专劫小船的人：能岛渡口，她的渡船坐满了人，她不解缆，先指给你看岛缝。
[[tracks.chapters]]
key = "offer"
title = "专劫小船的人"
text = "能岛的渡口开在岛的背风处，石阶最下一级长满了藤壶。汐的渡船就系在那里，船不大，船头插一面小旗，靛蓝底子上一个白圈，是她自己的旗号。船上已经坐了卖鱼的、走亲戚的、背着孩子的女人，都在等她解缆。她没解，先指给你看对岸那串小岛：“这一季丢了四条船，都跟我这条差不多大。拿了鱼和钱就走，钻进岛缝里，找不着。”港里泊着一排村上家的关船，桨都收着。她朝那边努努嘴：“他们护的是大船。小船的事，懒得管。”她要渡三趟，三趟都得过对岸那段窄水道。她托你守这三趟：打跑他们也行，赶在潮转之前把船带过去也行。你问她自己打算怎么办。她看着窄水道那头，水正往东退，礁头一块块露出来：“等着，潮会转的。”"
speaker = "captain"
mood = "tense"
when = [
  { kind = "date", from = [1567, 1, 1], to = [1587, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "ushio", ge = 18 },
]
objectives = [{ kind = "person", person = "ushio", text = "在能岛的渡口找到她" }]
deadline = [1587, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_old_friend_osaka"
when = [
  { kind = "bond", person = "ushio", level = "C" },
  { kind = "date", from = [1576, 1, 1], to = [1576, 12, 31] },
]
text = "能岛的渡口开在岛的背风处，石阶最下一级长满了藤壶。汐的渡船就系在那里，船头插一面小旗，靛蓝底子上一个白圈，是她自己的旗号。船上坐满了卖鱼的、走亲戚的、背着孩子的女人。她见了你，没行礼就开口：“姬君，我是你的船头。这回你替我当一回。”她指给你看对岸那串小岛：“这一季丢了四条船，都跟我这条差不多大。拿了鱼和钱就走，钻进岛缝里，找不着。”港里空了一大半，只剩几条旧船在修。“今年能岛的大船都去了大坂湾。内海空了，他们才敢出来。”她要渡三趟，三趟都得过那段窄水道。她托你守这三趟，打跑他们，或者赶在潮转前把船带过去。你问她自己打算怎么办。她看着窄水道那头，水正往东退，礁头一块块露出来：“等着，潮会转的。”"

