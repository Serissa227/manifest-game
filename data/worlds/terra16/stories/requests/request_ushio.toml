effects = [
  { kind = "affinity", person = "ushio", value = 3 },
  { kind = "flag", flag = "c13_request_ushio_accepted" },
  { kind = "flag", flag = "c13_request_ushio_tide" },
]

[[tracks.chapters.choices]]
key = "decoy"
text = "接下：我的船走前面引开他们，渡船从岛的另一边绕。"
next = "after"
check = { attr = "seamanship", base = 20, per = 7 }
reply = "你把帆全张开，大摇大摆地从窄水道口过去。岛缝里的小船跟着你的帆走了半个上午，绕过两座岛才回过神来，再掉头，渡船早就到了对岸。第二趟他们只跟了一个时辰，第三趟干脆没露面。你回到能岛，她正在渡口收缆绳，头也不抬：“他们追你的时候，我在对岸看着。追得真卖力。”"
