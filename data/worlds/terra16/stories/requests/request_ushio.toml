[[tracks.chapters.choices]]
key = "her_flag"
text = "旗是她的，潮线该她自己画。"
next = "done"
reply = "她捏着漆刷看了你一会儿，低头画了一道，笔直，像拿绳子绷过。她盯着那道线，拿袖子抹了，又画，这回是弯的，一头高一头低，跟窄水道早潮涨上来的样子一样。袖口沾了一片白，她也不管，把船板上的钱推过来：“弯的。”"
