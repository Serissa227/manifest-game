effects = [
  { kind = "affinity", person = "ushio", value = 3 },
  { kind = "flag", flag = "c13_request_ushio_accepted" },
  { kind = "flag", flag = "c13_request_ushio_tide" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "内海的事，村上家都不管，我也不管。"
next = "failed"
reply = "她没说什么，解了缆，一篙撑离了石阶。一船人跟着她晃，背着的孩子哭了一声，又不哭了。船头那面小旗被风吹得笔直，一直到窄水道口都没歪。"
effects = [{ kind = "flag", flag = "c13_request_ushio_declined" }]

# 二、岛缝里的船：第二趟早潮，你打退的那条船上有人喊她的名字。
[[tracks.chapters]]
key = "battle"
title = "岛缝里的船"
text = "第二趟早潮，水刚漫过窄水道的暗礁，岛缝里就钻出三条小船，橹摇得飞快，直扑渡船。你把船横过去，挡在渡船和岛缝之间。两条见势不对，掉头就跑；你打退的那条船被浪打横了，船上的人扒着船帮往水里跳。有人在水里喊了一声：“汐姐！”渡船上，汐的篙停在半空。那人晒得黝黑，比她小几岁，是她早年在土佐下田的渔港见过的孩子，那时他光着脚帮他爹补网。如今他攀着翻了的船底，不喊了，只看着她。汐没看他，看的是你：“你的船，你说了算。”"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "ushio", value = true }]
objectives = [{ kind = "battle", wins = 1, text = "在内海打退劫小船的人" }]
deadline_days = 90
timeout = { next = "failed", effects = [
  { kind = "affinity", person = "ushio", value = -3 },
  { kind = "flag", flag = "c13_request_ushio_late" },
  { kind = "letter", person = "ushio", text = "三趟我自己守了，丢了一船鱼，人没事。潮会转的。——汐" },
] }

[[tracks.chapters.choices]]
key = "let_go"
text = "让他们走，告诉他们这条航线有人守。"
next = "after"
reply = "你让人把翻了的船扶正，扔给他们两支橹，冲着他们喊：这条水道往后有人守。那后生爬上船，回头看了汐一眼，摇着走了，没再回来。第三趟早潮，渡船上的人比平常多出一倍，卖鱼的挤着走亲戚的，有个老婆婆坐在船头唱起了内海的船歌。汐撑着篙，跟着哼了两句，跑了调。"
news = "濑户内海能岛附近，专劫小船的那伙人被一条大船打退了，汐的渡船照常来回，第三趟船上还有人唱歌。"
effects = [
  { kind = "affinity", person = "ushio", value = 3 },
  { kind = "flag", flag = "c13_request_ushio_fought" },
]

[[tracks.chapters.choices]]
key = "talk"
text = "叫住那个渔家后生，问他为什么劫船。"
next = "after"
check = { attr = "eloquence", base = 35, per = 6 }
reply = "他攀着船底，半天才开口：今年鱼少，村上家的帆别钱又涨了，不劫，就交不上。说到帆别钱，汐的脸冷了下来，篙尖在水里搅了一圈，好一阵没说话。后来她把篙伸过去，杵在他手边：“上来。我船上缺个摇橹的。”他愣着没动。她又说了一遍，声音更冲：“上来。潮要转了。”"
news = "能岛附近的窄水道上，劫小船的被打退了，汐的渡船上倒多了个摇橹的后生，听说是从劫船的那边过来的。"
fail = { next = "after", effects = [
  { kind = "affinity", person = "ushio", value = 1 },
  { kind = "flag", flag = "c13_request_ushio_fought" },
], news = "能岛附近的窄水道上，劫小船的被打退了。有个后生被人叫住问话，骂了一句，翻身跳进海里游走了。" }
effects = [
  { kind = "affinity", person = "ushio", value = 3 },
  { kind = "flag", flag = "c13_request_ushio_fought" },
  { kind = "flag", flag = "c13_request_ushio_hired" },
]

# 三、渡船上的旗：渡口石阶，她数钱数得慢，然后要在旗上加一道潮线。
[[tracks.chapters]]
key = "after"
title = "渡船上的旗"
text = "三趟走完，汐把渡船系在能岛渡口最下一级石阶的铁环上，蹲在船帮边跟你算钱。她算得慢，一枚一枚数在船板上，数到一半忘了，又从头数；该起身道谢的时候她还蹲着，想起来了才站直，弯腰弯得比谁都急。钱一文不少，堆在船板上，她没推过来，先把船头那面小旗拔下来，摊在膝头。旗角的线脚被海风咬得起了毛，白圈也褪成了米色。“我想改一改。”她用指甲在白圈底下划了一道，弯的，“加一道潮线。让劫船的看见就知道，这条船看潮。”她从船舱里摸出一只盛白漆的蛤壳，一把刷船用的小漆刷。"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "alive", person = "ushio", value = true }]
objectives = [{ kind = "person", person = "ushio", text = "回能岛的渡口找她" }]
news = "能岛渡口汐的那条渡船换了旗，白圈底下多了一道弯弯的潮线。船家都说，劫小船的看见这道线，该绕着走了。"

[[tracks.chapters.variants]]
key = "hired"
when = [{ kind = "flag", flag = "c13_request_ushio_hired" }]
text = "三趟走完，汐把渡船系在能岛渡口最下一级石阶的铁环上，蹲在船帮边跟你算钱。船尾坐着那个下田来的后生，正把橹绳一圈一圈收好。她朝他扬扬下巴：“摇得不好，老往东偏。潮会教他的。”她算得慢，一枚一枚数在船板上，数到一半忘了，又从头数；该道谢了她还蹲着，想起来才站直，弯腰弯得比谁都急。钱一文不少，堆在船板上，她没推过来，先把船头那面小旗拔下来，摊在膝头。旗角的线脚被海风咬得起了毛，白圈也褪成了米色。“我想改一改。”她用指甲在白圈底下划了一道，弯的，“加一道潮线。让劫船的看见就知道，这条船看潮。”她从船舱里摸出一只盛白漆的蛤壳，一把刷船用的小漆刷。"

[[tracks.chapters.choices]]
key = "draw_line"
text = "替她在旗上画那道潮线。"
next = "done"
reply = "你蘸了漆，一刷下去，船被浪托了一下，潮线歪出了白圈。你要抹，她按住你的手腕：“别动。歪的才像潮。”她把旗插回船头晾着，这才把船板上的钱推过来。“往后你的船过能岛，到渡口来，有人给你指潮。”"
