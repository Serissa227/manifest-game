[[tracks.chapters.choices]]
key = "fight"
text = "接下：守她三趟，劫船的来了就打。"
next = "battle"
reply = "她抽出渡船上的一块坐板，翻过来，拿炭条在背面写了三行，是三趟的船期。日子不挨着，时辰都在早潮。你问为什么都挑早潮，她把坐板竖在你脚边：“他们也看潮。早潮涨上来，岛缝里的水才够深，他们的船才钻得出来。那时候你就在窄水道口。”说完她解了缆，篙往石阶上一点，渡船离了岸。"
effects = [
  { kind = "affinity", person = "ushio", value = 2 },
  { kind = "flag", flag = "c13_request_ushio_accepted" },
]

[[tracks.chapters.choices]]
key = "tide_route"
