# 请托：指向西方的骑像（request_damiao_de_gois）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：达米昂·德·戈伊斯（damiao_de_gois，1502-01-01 生，1574 年卒，男）。里斯本王家档案塔看守长，1558 年起奉命写编年史；势力 portugal；身份档 2（学者、官员）。cast：cast/historical_01_europe.toml。
# 类型：复合（mixed）。报价：T（当面，里斯本档案塔），auto=false，玩家“问请托”（ask:request_damiao_de_gois）启动；offer 不写 at，目标是在档案塔找到他。
# 窗口：报价 1557-01-15 至 1569-12-31，到期走 failed、不写见闻；亚速尔一章 deadline_days=180；收尾三章 deadline=1570-12-31。
# 章节路线：offer → borrower（里斯本，司铎）→ read（里斯本，档案塔）→ azores（安格拉，科尔武外海）→ 三选一收尾：report（崖下亲见 saw）、report_drawn（画下山脊 drawn）、report_unseen（没上岛或只问了人 tales / 登陆失败）。
#   brief 的 5 章按旗标拆成 7 个章节：引擎不允许对本轨道自己设的旗标写 requires（否则报“准备后条件仍不满足”），只能靠 next 分流，各自的选项各写。
# 依据·史实（传闻口吻，待核）：戈伊斯（Damião de Góis，1502—1574）任档案塔看守长，编《曼努埃尔王编年史》（1566—67 刊行）。史书记科尔武岛山上骑马石像的传说：国王派人去拆运，只带回几块碎片。石座与断崖上的细节为传说的转述，石人底座的字不知所终。
# 依据·原创：借阅簿、司铎的研究稿、报告里的领航员、三个老水手的三种说法、断崖下小艇的一次失败、画在纸上的山脊、安格拉的老水手。
# 秘密：早年的宗教问题与 1571 年的审讯一概不写，见闻也不写。“伊拉斯谟当年对我说”全轨道只用一次（offer）。
# 读的旗标：c13_main_noel（read 的变体，只加一句沉默，不解释；不写 noel_unveiled 的内容）。
# 设的旗标：c13_request_damiao_de_gois_accepted（offer 接下）、_declined（offer 回绝）、_back（司铎那边拿回原件或抄本谈成）、_saw（崖下亲眼看见石座）、_drawn（画下山脊）、_tales（安格拉问了老水手）、_partial（只写传说或不去）、_done（照实或石头收尾）、_late（超时）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不给 corvo_fragment，不触发 line_corvo_rider 发现物（石头只是崖下的普通石头）。
# 依赖：港口 lisbon（ports_iberia.toml）、angra（ports_atlantic_islands_west_africa.toml）；技能 negotiation、cartography；属性 eloquence、seamanship；势力 portugal；物品 chart_atlantic_isles（唯一奖励）。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_damiao_de_gois-report「空的石座」：黑色断崖顶上一个空的方形石座，海鸟绕着飞。（照实的两条结局共用这一张）

[[tracks]]
key = "request_damiao_de_gois"
name = "指向西方的骑像"
kind = "request"
start = "offer"
auto = false
cast = ["damiao_de_gois"]

# 一、借阅簿上的那一行：档案塔顶层，戈伊斯找一份八十年前的报告，找了三天。
[[tracks.chapters]]
key = "offer"
title = "借阅簿上的那一行"
text = "档案塔顶层的书架间，戈伊斯抱着一摞账簿，找一份八十年前的航海报告，找了三天没找到。他翻开借阅簿，手指按在一行墨迹上：十年前，大教堂的一位司铎借走了它，之后再没还。“伊拉斯谟当年对我说，书借出去就是嫁出去。”他把账簿往桌上一放，“这份报告是老水手自己写的，他见过什么就写什么。我要的就是这个。”他没有抬头，“你去一趟，替我把它要回来。”"
mood = "mystic"
objectives = [{ kind = "person", person = "damiao_de_gois", text = "在档案塔找到他" }]
when = [{ kind = "date", from = [1557, 1, 15], to = [1569, 12, 31] }, { kind = "age", ge = 17 }, { kind = "alive", person = "damiao_de_gois", value = true }]
deadline = [1569, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "接下：去大教堂找那位司铎"
next = "borrower"
reply = "他在借阅簿那一行旁边画了个小船，船头朝西。又把司铎住的那条巷子名字抄在纸角上，撕下来递给你：“门口有棵无花果，找得到。”"
effects = [{ kind = "affinity", person = "damiao_de_gois", value = 2 }, { kind = "flag", flag = "c13_request_damiao_de_gois_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：旧纸的差事，我不接"
next = "failed"
reply = "他又爬上了梯子，把账簿一本本推回架子，梯子晃了一下，他没有回头。推到第三层，他背对着你说：“不接也行。我自己再找三天。”"
effects = [{ kind = "flag", flag = "c13_request_damiao_de_gois_declined" }]

# 二、司铎的书桌：大教堂后巷，报告压在一本写了一半的书底下。
[[tracks.chapters]]
key = "borrower"
title = "司铎的书桌"
text = "大教堂后面的小巷里，那位司铎的书桌上压着那份报告，报告上压着他自己写了一半的书。他没有起身，只抬了抬眼：“这是我的研究，写完之前不能还。两年里，每一页都是从这份报告里一句一句拆出来的。”他把书稿又压了压，手指按在报告的边角上，不让你碰。钟楼敲过三下，他才又开口：“你们档案塔想要什么？”"
speaker = "captain"
mood = "tense"
at = "lisbon"
when = [{ kind = "alive", person = "damiao_de_gois", value = true }]
news = "大教堂后巷的司铎把档案塔那份八十年前的航海报告压在自己的书稿底下，说没写完不还。"

[[tracks.chapters.choices]]
key = "talk"
text = "跟他说：档案塔的东西，抄一份给他总可以"
next = "read"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "他想了很久，把报告从书稿底下抽出来，推到你面前。“原件还给档案塔，抄本归我。”说完又按住书稿，手指在书稿边上敲了两下，像是怕你连书一起拿走。"
effects = [{ kind = "affinity", person = "damiao_de_gois", value = 3 }, { kind = "flag", flag = "c13_request_damiao_de_gois_back" }]
fail = { next = "read", effects = [{ kind = "affinity", person = "damiao_de_gois", value = -2 }] }

[[tracks.chapters.choices]]
key = "copy"
text = "出钱请抄写员给他抄一份，原件带走"
next = "read"
requires = [{ kind = "cash", ge = 300 }]
hint = "钱袋太薄，请不起一个抄写员熬一整夜"
reply = "抄写员当晚就来了，司铎一边监督一边挑错，挑出一个错字，就让抄写员重抄一页。抄本他攥在手里，原件则由你收进了包里，压在最底下。"
effects = [{ kind = "cash", value = -300 }, { kind = "affinity", person = "damiao_de_gois", value = 3 }, { kind = "flag", flag = "c13_request_damiao_de_gois_back" }]

[[tracks.chapters.choices]]
key = "deal"
text = "跟他约定：他的书写成以后，档案塔替他存一部"
next = "read"
requires = [{ kind = "skill", skill = "negotiation", ge = 60 }]
hint = "你还不知道档案塔能许他什么，这话不能先开口"
reply = "他笑了，说这比还书划算。“书写成，档案塔存一部，我的名字印在第一页上。”他把报告推过来，手指在纸上按了按，像是在给这笔买卖盖章。"
effects = [{ kind = "affinity", person = "damiao_de_gois", value = 3 }, { kind = "flag", flag = "c13_request_damiao_de_gois_back" }]

# 三、窗边的报告：戈伊斯念那一段，然后问你肯不肯去亚速尔。
[[tracks.chapters]]
key = "read"
title = "窗边念的那一段"
text = "戈伊斯在窗边念那份报告。纸是八十年前的，墨色已经发了褐。一个领航员在里头写，科尔武岛西北的山脊上有一尊骑马的石人，手指着西方。念到最后一页，戈伊斯停住了：石人底座上刻着字，领航员抄在另一张纸上，那张纸不知去向。他放下报告，看着你：“我想让你去亚速尔走一趟，看看那座山现在还有什么。”"
speaker = "captain"
mood = "mystic"
at = "lisbon"
when = [{ kind = "alive", person = "damiao_de_gois", value = true }]
news = "里斯本档案塔的老看守长在窗边念一份八十年前的航海报告，念到石人的地方停了很久。"

[[tracks.chapters.variants]]
key = "both"
when = [{ kind = "flag", flag = "c13_main_noel" }, { kind = "flag", flag = "c13_request_damiao_de_gois_back", value = false }]
text = "戈伊斯在窗边念的是你在司铎桌边读到的那一段。报告还压在司铎的书稿底下，你只读了一个下午，纸页边角被他的手指磨得发毛。那一段里，一个领航员写，科尔武岛西北的山脊上有一尊骑马的石人，手指着西方。念到“科尔武”三个字，你没有接话，只把手里的笔转了一圈。戈伊斯听完没有生气，只把窗户推开一条缝：“最后一页呢？”你说没有读到。他沉默了一会儿：“那就去亚速尔看看。”"

