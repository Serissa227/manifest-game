effects = [{ kind = "cash", value = 1600 }, { kind = "item", item = "chart_atlantic_isles", qty = 1 }, { kind = "fame", value = 5 }, { kind = "affinity", person = "damiao_de_gois", value = 5 }, { kind = "flag", flag = "c13_request_damiao_de_gois_done" }]

