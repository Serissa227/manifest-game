reply = "你画下了那道山脊的轮廓，线条有几处抖，断崖的弯道画得太急。老水手拿指甲在画上点了一下：“座子在这儿。”他又看了看天，说这个方向没错。"
effects = [{ kind = "affinity", person = "damiao_de_gois", value = 3 }, { kind = "flag", flag = "c13_request_damiao_de_gois_drawn" }]

[[tracks.chapters.choices]]
key = "ask"
text = "回安格拉，听老水手们讲石人的样子"
next = "report_unseen"
reply = "三个老人讲了三个样子。一个说石人朝西，一个说朝北，第三个说那不是马，是一匹海马。你把三种说法记在一张纸上，每种后面写上是谁说的。"
effects = [{ kind = "flag", flag = "c13_request_damiao_de_gois_tales" }]

# 五之一、亲眼见过：照实说、石头、传说照传说写。
[[tracks.chapters]]
key = "report"
title = "草稿上的那一行"
text = "戈伊斯在档案塔等你，桌上摊着他编年史的草稿。窗外的船刚靠岸，搬箱子的脚夫在码头上喊。他没有听见，只盯着你的手。你的袖口还带着崖下的盐霜，硬得发白。“你在崖下看见了什么？只说你亲眼见过的。”他的笔悬在纸上，草稿停在传说那一段，后面还空着。怎么写进史书，他想听你的意见，可他先要的是你看见的。"
speaker = "captain"
mood = "mystic"
objectives = [{ kind = "person", person = "damiao_de_gois" }]
when = [{ kind = "alive", person = "damiao_de_gois", value = true }]
deadline = [1570, 12, 31]
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_damiao_de_gois_late" }, { kind = "letter", person = "damiao_de_gois", text = "编年史那一段，我照报告写了，没有等你的话。若路过档案塔，桌上那张草稿还在。——达米昂" }] }

