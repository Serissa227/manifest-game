effects = [{ kind = "cash", value = 1600 }, { kind = "affinity", person = "damiao_de_gois", value = 4 }, { kind = "flag", flag = "c13_request_damiao_de_gois_partial" }]

# 五之二、画下的山脊：只能照实说，或者把传说照传说写。
[[tracks.chapters]]
key = "report_drawn"
title = "画下的那道山脊"
text = "戈伊斯在档案塔等你。你把画下的山脊摊在他的草稿上，线条有些抖，断崖的弯道画得太急。他拿放大镜看了很久，指着山脊顶上一个小方框：“这是座子？”你说是老水手指给你看的。窗外的风把纸吹得翻了个边，他用镇纸压住，又问你是怎么想到要画它的。你说，是想让后来的人知道山脊在哪儿。他没有生气，把草稿翻到新的一页：“那就照你画的写。”"
