effects = [{ kind = "cash", value = 1000 }, { kind = "affinity", person = "damiao_de_gois", value = 2 }, { kind = "flag", flag = "c13_request_damiao_de_gois_partial" }]

# 四、断崖下：安格拉雇的老水手，船绕着科尔武的西北岬转。
[[tracks.chapters]]
key = "azores"
title = "断崖下的座子"
text = "在安格拉雇了一个熟悉西边两座小岛的老水手，船往科尔武去。岛的西北是一道黑色的断崖，浪在下面炸开，白沫溅得比桅杆还高。老水手说，上面原先立着一尊石人，后来让人拆了，只剩一个座子。“拆的人是国王派来的，”他把舵柄往回拉了一把，“拆下来的东西装了两车，走到半路车轮陷进泥里，最后只有几块碎片运进了王宫。”船在断崖外头打转，山脊的轮廓看得清，山顶却雾着，看不真切。"
speaker = "captain"
mood = "tense"
at = "angra"
objectives = [{ kind = "at", at = "angra" }]
when = [{ kind = "alive", person = "damiao_de_gois", value = true }]
deadline_days = 180
timeout = { next = "failed", effects = [{ kind = "affinity", person = "damiao_de_gois", value = -3 }, { kind = "flag", flag = "c13_request_damiao_de_gois_late" }, { kind = "letter", person = "damiao_de_gois", text = "编年史里那一段，我照报告写了，没有等你。科尔武的事就到这里。——达米昂" }] }
news = "安格拉港的老水手说，科尔武岛的断崖上原先立着一尊骑马的石人，后来让人拆了，只剩座子。"

[[tracks.chapters.choices]]
key = "land"
text = "等浪小一点，放小艇靠近断崖下"
next = "report"
check = { attr = "seamanship", base = 5, per = 8 }
reply = "小艇贴着礁石靠过去，浪把船抛起来又摔下去。你仰头看见山脊上一个方形的石座，空的，座面上连一根草都没有。水手们松了口气，有人在船尾骂了一句。"
