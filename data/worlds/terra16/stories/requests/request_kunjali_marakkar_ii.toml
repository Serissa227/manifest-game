# 二、潮水：1561—1569 年间，卡利卡特河口。三条路：正面冲过去、用葡萄牙话补全文书、装成漏水的商船。
[[tracks.chapters]]
key = "plan"
title = "潮水退之前"
text = "天亮前退潮，快船队要在潮水退尽之前出河口。巡船停在外海一里的地方，船头的灯一直亮着，灯影在水上晃来晃去。昆贾利的人在你的船上放了一张“迷路文书”，盖着葡萄牙人的印。印是真的，字是谁抄的，他们没说。船尾的舵手一直盯着水色，没有人催你。要不要用，看你。"
when = [{ kind = "alive", person = "kunjali_marakkar_ii", value = true }]
at = "calicut_port"
speaker = "captain"
mood = "tense"
deadline_days = 60

