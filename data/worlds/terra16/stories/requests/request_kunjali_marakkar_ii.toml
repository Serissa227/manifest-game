when = [{ kind = "flag", flag = "c13_request_kunjali_marakkar_ii_rescued" }]
text = "快船队回来了，拖着一条葡萄牙的小商船，桨手们一路喊着号子进的港。落水的三个葡萄牙水手，你放回了他们自己的小艇，那艇往南划走了，一次也没回头看。昆贾利在船坞里请你喝椰子酒，酒是拿椰子壳舀的，带着一股烟火味。他叫人从屋里抬出一只箱子，放在你脚边。船坞的木板缝里嵌着海沙，有人拿桶水冲了几遍，冲不干净。他把椰子壳往地上一扣，问你要钱，还是要别的。"
