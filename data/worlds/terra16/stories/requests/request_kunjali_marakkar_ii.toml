# C13d 人物的请托（2026-10-24，Claude 写）：故事 2.0 轨道格式，遵循 DECISIONS“故事 2.0 TOML 契约”。
# 人物：昆贾利·马拉卡尔二世（kunjali_marakkar_ii），生年不详（cast 占位 0），卒于 1569 年（cast 写 died 1569，待核）。
#       扎莫林的海军首领，马拉卡尔家第二代，住卡利卡特。话少、嗓子粗，谈船先问风向、吃水和水手，烧船扣人说得像说潮水。
# 类型：打一仗（fight）。4 章：offer（报价）→ plan（潮水退之前）→ battle（你打退的那条船）→ after（船坞里的账）。
#       plan 的 papers（文书）与 feign 检定成功两条路不打仗，直接到 after；engage 直接打，feign 检定失败也走 battle。
# 报价：T 当面，卡利卡特（calicut_port）。玩家“问请托”（ask:request_kunjali_marakkar_ii）启动，在港里找到他才会有 offer。
# 窗口：报价 1561-01-01..1568-12-31（offer 的 when 与 deadline）；plan 期限 60 天，battle 期限 30 天，after 期限 90 天。
# 依据·史实：马拉卡尔家世代任扎莫林的海军统帅，用浅吃水的帕劳快船在河口与回水里打葡萄牙人；葡萄牙人卖“卡塔兹”通行证，
#       不买的商船当海盗办（史实）。二世的卒年待核，正文只写传闻，不写具体年月。
# 依据·原创：河口外守了半个月的那条巡船、快船队出港的潮水、盖着印的“迷路文书”、船坞里的椰子酒与旧铁箱、拖回来的葡萄牙小商船。
# 待核：快船的吃水与船型。正文用行里人的口气带过。
# 旗标：读的旗标：无（不读 c13_main_* 与 c7_*）。
#       设的旗标：c13_request_kunjali_marakkar_ii_accepted / declined / chose_fight / chose_decoy / decoyed / fought / rescued / late / done / partial / pact / failed。
#       不写 relation / tie / bond / heart / title / world / join / leave / start_track / end_track / growth。
# 依赖：calicut_port 是现有港口，他的日程在 cast 里已经是 1553—1568 年在卡利卡特的船坞，不需要 B10b 改名。
#       1569 年以后他没有日程，after 的人物目标找不到人，走 timeout，这是设计内的。
# 缺省走向（玩家什么也不做）：offer 到 1568-12-31 超时，走 failed，无见闻；接下后 plan 到期，快船队从北边的浅滩出去，走 failed。
# 回忆插画清单：
#   mem-request_kunjali_marakkar_ii-after：卡利卡特船坞里一只旧铁箱，箱盖上扣着一只椰子壳，龙骨边搁着一把量船底的木尺。

[[tracks]]
key = "request_kunjali_marakkar_ii"
name = "引开巡船半天"
kind = "request"
start = "offer"
auto = false
cast = ["kunjali_marakkar_ii"]

# 一、报价：1561—1568 年间，卡利卡特的船坞。他蹲在快船的龙骨边，要一条外国船把河口外的巡船引开。
[[tracks.chapters]]
key = "offer"
title = "河口外的巡船"
text = "卡利卡特的船坞里，昆贾利蹲在一条帕劳快船的龙骨边，用手掌一块一块地摸船底的虫眼。他头也不抬，先问风从哪边来，再问你的船吃水几尺，船上的水手会不会划桨。问完才站起来：“进不了，就别跟我谈打仗。”河口外头，一条葡萄牙巡船守了半个月，船头的灯从天黑亮到天亮。他的快船队出不去。他要一条外国船去把它引开半天：打一仗也行，装成迷路的商船去送一张假文书也行。"
when = [
  { kind = "age", ge = 17 },
  { kind = "date", from = [1561, 1, 1], to = [1568, 12, 31] },
]
