# C13d 请托：照着实物画岬角（request_jan）。中文，Claude 写。
# 人物：扬 jan（1540-09-25 生，男；安特卫普印书坊的学徒，势力 netherlands，身份档 1）。
# 类型：去某处（go）；3 章，offer → arrive → report；没有 stage 章。
# 报价：当面（T）。人物按日程在安特卫普（antwerp），auto=false，玩家“问请托”（ask:request_jan）启动。
# 窗口：报价 1577-01-01 至 1584-06-30（同学重逢的止日 1576-12-31 之后开放）；结账与改版到 1585-08-24。
# 进行中：arrive 章 deadline_days=90；超时走 failed，寄一封信，不写见闻。offer 章到 1584-06-30 仍未接，走 failed。
# 地点：安特卫普 antwerp（报价与改版）；弗利辛恩外海 flushing（一章只查这一个港：西卡佩勒的堤、弗利辛恩港口、祖特兰德的沙丘）。
# 依据：史实背景，1584—85 年瓦赫纳尔《航海之镜》在莱顿刊行，海岸剖面图配航路说明；奖励物 waghenaer_leiden 是答谢，不是扬的图册。
#   扬的图册、格子纸、拓数、沙丘的缺角是原创。1577 年以后的安特卫普在“西班牙之怒”的余波里，本线不写那三天。
# 读的旗标（只读，不设）：c7_pair_mathijs_jan_together（offer 章 variants，戏单一句）；bond jan（C 级，offer 章 variants，老同学的口气）。
# 设的旗标：c13_request_jan_accepted / declined / true / pretty / rough / late / done / partial。
# 依赖：B10b 日程与港口 antwerp、flushing；人物 jan 在 cast/classmates_antwerp_printing.toml；奖励物在 items/books_04_navigation.toml。
# 秘密：扬夹进别人账本的那首小诗不写，news 也不写。
# 回忆插画：mem-request_jan-report，墙上三张画好的海岸纸钉在一排旧样张旁，沙丘那一角缺了一块。

[[tracks]]
key = "request_jan"
name = "照着实物画岬角"
kind = "request"
start = "offer"
auto = false
cast = ["jan"]

# 一、没出过海的岬角：1577 年起，人物在印书坊里，玩家来问。
[[tracks.chapters]]
key = "offer"
title = "没出过海的岬角"
text = "扬的印书坊在安特卫普老城的一条窄巷里，窗子朝北，工作台上摊着一张样张。领航用的海岸图册，雕版师照一本旧书描的岬角，轮廓圆得像一块面包。“我、我接了这单活，订金已经花在纸上了。”他一说到自己就卡住，手指在样张边上敲了两下，“可、可是这个岬角，没人出过海去看。”一说到雕版，他就不结巴了：三处海岸都要照着实物画，侧面什么样，离岸多远，哪座教堂的塔能当标，一条一条报给你听。最后他从抽屉里抽出一张格子纸，格子是照印版的尺寸打的。"
speaker = "captain"
mood = "cheerful"
cast = ["jan"]
when = [{ kind = "date", from = [1577, 1, 1], to = [1584, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "jan", ge = 18 }]
objectives = [{ kind = "person", person = "jan", text = "在港里找到他" }]
deadline = [1584, 6, 30]

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.variants]]
key = "v1_old_friend_playbill"
when = [{ kind = "bond", person = "jan", level = "C" }, { kind = "flag", flag = "c7_pair_mathijs_jan_together" }]
text = "扬的印书坊在安特卫普老城的一条窄巷里，窗子朝北，排字架上贴着一张戏单，边角卷了。工作台上摊着一张样张。领航用的海岸图册，雕版师照一本旧书描的岬角，轮廓圆得像一块面包。你一进门，他的话就先出了口，一句没卡：“你来得正好。订金已经花在纸上了，图要是错，钱就白花。”三处海岸都要照着实物画，侧面什么样，离岸多远，哪座教堂的塔能当标，他一条一条报给你听。最后他把格子纸推过来，格子是照印版的尺寸打的：“账你算过，图你也会算。”"

[[tracks.chapters.variants]]
key = "v2_old_friend"
when = [{ kind = "bond", person = "jan", level = "C" }]
text = "扬的印书坊在安特卫普老城的一条窄巷里，窗子朝北，工作台上摊着一张样张。领航用的海岸图册，雕版师照一本旧书描的岬角，轮廓圆得像一块面包。你一进门，他的话就先出了口，一句没卡：“你来得正好。订金已经花在纸上了，图要是错，钱就白花。”三处海岸都要照着实物画，侧面什么样，离岸多远，哪座教堂的塔能当标，他一条一条报给你听。最后他把格子纸推过来，格子是照印版的尺寸打的：“账你算过，图你也会算。”"

[[tracks.chapters.variants]]
key = "v3_playbill"
when = [{ kind = "flag", flag = "c7_pair_mathijs_jan_together" }]
text = "扬的印书坊在安特卫普老城的一条窄巷里，窗子朝北，排字架上贴着一张戏单，边角卷了。工作台上摊着一张样张。领航用的海岸图册，雕版师照一本旧书描的岬角，轮廓圆得像一块面包。“我、我接了这单活，订金已经花在纸上了。”他一说到自己就卡住，手指在样张边上敲了两下，“可、可是这个岬角，没人出过海去看。”一说到雕版，他就不结巴了：三处海岸都要照着实物画，侧面什么样，离岸多远，哪座教堂的塔能当标，一条一条报给你听。最后他从抽屉里抽出一张格子纸，格子是照印版的尺寸打的。"

[[tracks.chapters.choices]]
key = "take_it"
text = "接下，带着他的格子纸去弗利辛恩外海。"
next = "arrive"
reply = "他把纸卷好塞进一只铁皮筒，又塞进一支削好的炭笔，筒盖上用墨写了个“岸”字。削笔的小刀他不借，“那把是排字用的”，说完把手上的墨蹭在围裙上。"
effects = [{ kind = "affinity", person = "jan", value = 2 }, { kind = "flag", flag = "c13_request_jan_accepted" }]

[[tracks.chapters.choices]]
key = "ask_engraver"
text = "接下，问他为什么不让雕版师自己去看。"
next = "arrive"
reply = "“他晕船。”扬说完自己先笑了。其实是因为雕版师不信海图要跟岸上不一样，说岸是什么样，图上就是什么样。扬不信这一套，也没跟他争，只说：“那就你来看。”"
effects = [{ kind = "affinity", person = "jan", value = 2 }, { kind = "flag", flag = "c13_request_jan_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "这种活该找领航员，不该找我。"
next = "failed"
reply = "他点头，把样张收进抽屉，嘟囔说那就只能印面包了。过了一会儿又拉开抽屉，把格子纸拿出来看了一眼，“领航员要是肯接，报价我照付。”"
effects = [{ kind = "flag", flag = "c13_request_jan_declined" }]

# 二、三处海岸：1577 年起，你到弗利辛恩外海，照实物把三处画对。
[[tracks.chapters]]
key = "arrive"
title = "三处海岸"
text = "弗利辛恩外海风大，浪短，船身一抬一落。西卡佩勒的堤像一道灰线压在水面上，祖特兰德的沙丘一年一个样，港口的塔倒是一直在那儿。要画对，得在退潮时离岸一样远地来回跑三趟。水手长把格子纸按在海图桌上，问你：“三趟？跑到哪一段算一趟？”靠近第三处沙丘时，你发现它跟扬的样张上完全对不上，那一角去年冬天被风暴削掉了。"
speaker = "captain"
mood = "tense"
cast = ["jan"]
at = "flushing"
when = [{ kind = "alive", person = "jan", value = true }, { kind = "date", from = [1577, 1, 1], to = [1585, 8, 24] }]
objectives = [{ kind = "at", at = "flushing", text = "到弗利辛恩外海去" }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "jan", value = -3 }, { kind = "flag", flag = "c13_request_jan_late" }, { kind = "letter", person = "jan", text = "图册我先印了。岬角还、还是圆的。下一版再说。" }] }

[[tracks.chapters.choices]]
key = "map_it"
text = "按格子一格一格量着画，沙丘照今天的样子画。"
next = "report"
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "拓数的尺子你还不会用。水手长说，这种尺子要在海图桌上坐过很久才顺手。"
reply = "三张格子纸画满了，每处都标了离岸的拓数和塔的方位，西卡佩勒的堤上还多画了一座风车。沙丘那张，我在角上写了日子。"
news = "西卡佩勒的堤边，有个船长在退潮时一格一格地量，量完把纸卷进铁皮筒，带回了安特卫普。"
effects = [{ kind = "affinity", person = "jan", value = 3 }, { kind = "flag", flag = "c13_request_jan_true" }]

[[tracks.chapters.choices]]
key = "sail_it"
text = "把船一趟趟开近了看，让水手报数，我来描。"
next = "report"
check = { attr = "seamanship", base = 20, per = 7 }
reply = "水手长每报一个数，你就在格子纸上落一笔。跑到天快黑，炭笔磨得只剩指甲长，三处海岸都在纸上了，连沙丘的斜面都标了高。"
news = "弗利辛恩外海，有条船退潮时来来回回跑了三趟，船长趴在船舷上画沙丘。"
effects = [{ kind = "affinity", person = "jan", value = 3 }, { kind = "flag", flag = "c13_request_jan_true" }]
fail = { next = "report", effects = [{ kind = "affinity", person = "jan", value = -2 }, { kind = "flag", flag = "c13_request_jan_rough" }], news = "弗利辛恩外海浪大，有条船只来回跑了两趟就收帆回港，船长说第三处沙丘只画了个大概。" }

[[tracks.chapters.choices]]
key = "sketch_it"
text = "不量了，照我看到的样子画下来，线条画准。"
next = "report"
requires = [{ kind = "skill", skill = "painting", ge = 60 }]
hint = "线条要画得让雕版师认得，得先在画室里练过不少年。水手长正等你报数。"
reply = "画出来的岸像真的一样，堤的灰色、沙丘的斜面都在纸上，只是拓数空着。雕版师会喜欢，领航员未必。扬把纸对着窗子看了很久，说：“这个我能刻。”"
news = "弗利辛恩港外，有个船长不量水深，坐在船头照着岸画，画得像真的，拓数却空着。"
effects = [{ kind = "affinity", person = "jan", value = 3 }, { kind = "flag", flag = "c13_request_jan_pretty" }]

# 三、改版：三张纸钉在墙上，扬决定重刻还是只改一处。
[[tracks.chapters]]
key = "report"
title = "改版"
text = "扬把你画的三张纸钉在墙上，跟旧样张并排。他一张一张看，每张的拓数都标得清楚。看到沙丘那张，他忽然笑出声：“等等，这个重音符号放反了。”旧样张上的岬角朝向画反了，跟他排字时把重音放反一个样，他自己先笑个不停，说岬角也放反了。笑完他去摸雕版，刻了一半，改版要多花钱。他得决定是照你的画重刻，还是只改最错的那一处。"
news = "安特卫普一家印书坊重刻了一部海岸图册的版，沙丘缺的那一角照实刻上了。"
speaker = "captain"
mood = "cheerful"
cast = ["jan"]
when = [{ kind = "alive", person = "jan", value = true }, { kind = "date", from = [1577, 1, 1], to = [1585, 8, 24] }]
objectives = [{ kind = "person", person = "jan", text = "回安特卫普印书坊" }]

[[tracks.chapters.variants]]
key = "v1_rough"
when = [{ kind = "flag", flag = "c13_request_jan_rough" }]
text = "扬把你画的三张纸钉在墙上，跟旧样张并排。他一张一张看，沙丘那张只描了个大概，拓数标得含糊。看到沙丘那张，他忽然笑出声：“等等，这个重音符号放反了。”旧样张上的岬角朝向画反了，跟他排字时把重音放反一个样，他自己先笑个不停，说岬角也放反了。笑完他去摸雕版，刻了一半，改版要多花钱。他得决定是照你的画重刻，还是只改最错的那一处。"

[[tracks.chapters.variants]]
key = "v2_pretty"
when = [{ kind = "flag", flag = "c13_request_jan_pretty" }]
text = "扬把你画的三张纸钉在墙上，跟旧样张并排。他一张一张看，沙丘那张画得像真的，拓数却空着。看到沙丘那张，他忽然笑出声：“等等，这个重音符号放反了。”旧样张上的岬角朝向画反了，跟他排字时把重音放反一个样，他自己先笑个不停，说岬角也放反了。笑完他去摸雕版，刻了一半，改版要多花钱。他得决定是照你的画重刻，还是只改最错的那一处。"

[[tracks.chapters.choices]]
key = "recut_all"
text = "劝他三处全重刻，错一处也是错。"
next = "done"
reply = "他咬咬牙，把订金剩下的都给了雕版师。新印的样张上，沙丘缺了一角，跟海上一模一样。他又把一部瓦赫纳尔的《航海之镜》塞给我，说这本比他的好，“先拿去用”。"
effects = [{ kind = "cash", value = 900 }, { kind = "item", item = "waghenaer_leiden", qty = 1 }, { kind = "affinity", person = "jan", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_jan_done" }, { kind = "memory", memory = "mem-request_jan-report", title = "墙上缺角的沙丘" }]

[[tracks.chapters.choices]]
key = "fix_one"
text = "只改沙丘那一处，别的先印。"
next = "done"
reply = "他改了沙丘，另两处留着旧线。印出来的图册卖得不坏，只是他每次翻到那两页都皱眉。过了年底，他托人问你，下一版还画不画。"
news = "安特卫普一家印书坊改了一部海岸图册的版，只刻了沙丘那一角，另两处仍是旧线。"
effects = [{ kind = "cash", value = 550 }, { kind = "affinity", person = "jan", value = 4 }, { kind = "flag", flag = "c13_request_jan_partial" }]
