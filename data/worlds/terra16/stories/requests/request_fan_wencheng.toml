reply = "掌柜荐了街口一位落第的老秀才。抄了二十天，字是端正的馆阁体，每卷首页留一个方格，旁边小字注着：此处原有官印。掌柜翻着新抄的册子：“抄本也是书。只是那位爷要问的，未必都在这几卷里。”"
effects = [{ kind = "cash", value = -300 }, { kind = "flag", flag = "c13_request_fan_wencheng_copied" }]
news = "牛庄书铺请了一位落第的老秀才，二十天抄完几卷《大明会典》，抄本送往沈阳，原书留在了船上。"

[[tracks.chapters.choices]]
key = "refuse"
text = "这部书，不送了"
next = "failed"
reply = "掌柜把那封一条一条的信从抽屉里取出来，还给你。“留着吧，”他说，“当个念想。”信纸三折，第三条的折痕正压在那行小字上。"
effects = [{ kind = "affinity", person = "fan_wencheng", value = -2 }, { kind = "flag", flag = "c13_request_fan_wencheng_failed" }]
news = "牛庄书铺的掌柜说，有个船主把会典找来了，临到交货又不送了，那封没落款的信还给了他自己留着。"

# 三、一两处请教（原书一路）：书已经在他手里。
[[tracks.chapters]]
key = "use"
title = "一两处请教"
text = "两个月后，掌柜又递来一封信，纸是同一种，字也是一条一条的：“一、会典里写到官员交代，我有两处拿不准。二、一座城开了门，原来的县官是留是换；若留，印信交给谁，谁点收，仓里的册子谁来封。三、书在你船上走过一程，想必翻过几回，记得多少写多少，请照卷次。”信末照旧客气：若不便，不答也无妨。纸角有一点墨，像是写到这里停过很久。"
mood = "tense"
at = "niuzhuang"
when = [{ kind = "alive", person = "fan_wencheng", value = true }]
objectives = [{ kind = "wait", days = 60 }, { kind = "at", at = "niuzhuang" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_fan_wencheng_late" }], news = "牛庄书铺的柜台下压着一封没人来取回话的信。掌柜说，那位爷问的是会典里的一处，终究没等到回音。" }

