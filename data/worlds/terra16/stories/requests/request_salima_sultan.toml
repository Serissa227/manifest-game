# 请托：隐者的上半首（request_salima_sultan）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：萨利玛·苏丹（salima_sultan，1539 年生，女），莫卧儿宫中的女诗人，笔名“隐者”；势力 mughal。cast：cast/historical_03_indian_ocean.toml。
# 类型：送信（lt）。四章：offer（报价）、handover（海关书记的下半首）、reply（改得只剩几个字）、reply_helped（陪他改过韵时的回信，多出 confess / keep_quiet）；没有 stage 章，因此没有 window 与 default。
#   结构说明：原先 reply 的三个选项靠旗标 _helped 互斥门禁，审计机器人会报“准备后条件仍不满足”；改为 help_rhyme 直接走 reply_helped，reply 里只剩 present，不再有旗标门禁。
# 报价：L（来信／代理人）。出面的是苏拉特的波斯书商（只写身份，不新建 cast）；auto=true，offer 的 at=surat；窗口 1562-06-01 至 1575-10-31。
#       offer 写 family=c13_offer_surat、冷却 20 天；offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：handover 与 reply 各 deadline_days=150，超时走 failed，来信一封，好感 -3，旗标 _late。
# 依据·史实：萨利玛·苏丹是巴布尔的外孙女，早年嫁给拜拉姆汗，后来成了阿克巴的妃子；她以波斯文写诗，笔名“玛赫菲”（隐者）。
#           朝觐（1576—82，纳吉玛主线）在窗口之后，本条不提。卒年 1612 或 1613 待核，正文不涉及。
# 依据·原创：苏拉特的波斯书商、霍尔木兹海关的书记、洒金纸、纸上两处改字、哈菲兹诗集页边她的字。
#           诗的内容只谈海与字句，不谈恋情，书记也不被她评价。
# 秘密：cast 无 secret；嫁给拜拉姆汗的往事不碰。见闻只写诗的事。
# 读的旗标：无（没有 variants，门禁只有 fame、年龄与日期）。
# 设的旗标：c13_request_salima_sultan_accepted（offer 两条接法）、_declined（offer 回绝）、
#           _helped（handover 陪他改韵；现在只设不读）、_honest（handover 照原样收下，或再想一天的检定失败，reply 只剩 present 一路）、
#           _second_try（handover 再想一天检定成功）、_late（handover 或 reply 超时）、
#           _done（reply 照实说两条路）、_partial（reply 瞒下）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 报酬：现金最多 2600（reply 给一次）；哈菲兹《诗集》（present 一路，唯一奖励）或诗艺 +20（confess 一路）；好感最多 13；名声 +3；莫卧儿声望 +2（keep_quiet 不给）。
# 依赖：港口 surat（ports_india.toml）、hormuz_port（ports_red_sea_gulf.toml）；物品 hafiz_ms（items/books_14_islamic.toml）；技能 poetry；属性 eloquence；人物 salima_sultan。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_salima_sultan-reply「洒金纸上的改字」：苏拉特的货栈里，一张洒金纸摊在桌上，纸边有几个被划掉的字，旁边一行小楷改字。

[[tracks]]
key = "request_salima_sultan"
name = "隐者的上半首"
kind = "request"
start = "offer"
auto = true
