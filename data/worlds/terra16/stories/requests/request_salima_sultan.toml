# 一、洒金纸：苏拉特的货栈里，书商把上半首摊在桌上。
[[tracks.chapters]]
key = "offer"
title = "一首诗的上半首"
text = "苏拉特港口的波斯书商在货栈里等你，桌上摊着一张洒金纸，四行墨字写到一半停住。他说，这是宫里一位女诗人托他带出来的，笔名叫“隐者”。“上半首是她写的。下半首要请一位诗人接。霍尔木兹有一位，她读过他两首，只听过他的名字。”他把纸推过来，又收回去一寸：“她说，不必找写得最好的，找接得住的。”"
