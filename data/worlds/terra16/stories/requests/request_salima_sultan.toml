# 二、海关的书记：霍尔木兹，他接了一个晚上，交来的下半首押了韵，却像一张税单。
[[tracks.chapters]]
key = "handover"
title = "海关书记的下半首"
text = "霍尔木兹海关的书记，白天替商船记船税，晚上在小屋里写诗。你把洒金纸交给他，他读了两遍，脸上青一阵白一阵，袖口还沾着税册的墨。第二天一早，他把下半首递过来：押了韵，句句通顺，念起来却像一张税单，一项一项，平平的。他问：“接得怎么样？”"
