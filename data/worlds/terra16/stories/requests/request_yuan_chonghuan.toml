reply = "他看了我一眼，没推辞，转头对老先生说：“册子上空着的那几户，先领。米我从别处调，账记在我名下，不进仓。”老先生拿炭条，在那几户后面各点了一个点，点得很重。"
effects = [{ kind = "affinity", person = "yuan_chonghuan", value = 6 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_partial" }]
