effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "yuan_chonghuan", value = -2 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_lost" }]

# 三a、功劳簿：米走得干净，半个月后袁崇焕翻着账来结。
[[tracks.chapters]]
key = "settle"
title = "功劳簿"
text = "半个月后，袁崇焕又上了岛，腋下夹着账本，一边走一边翻，翻到哪页就用手指戳着念数。“米三十袋，对得上；布八匹，裁了三十二件，对得上。”他在我面前停下，从账本里抽出一张纸，纸角还留着海水的潮印。“难民里推出来的那个老先生，给我写了封谢帖。”他举着纸抖了抖，“字比我手下的书办写得好——这话别让书办听见。”他把账本翻到新的一页，笔悬着。“功劳簿上，我给你记一笔。你要什么，现在说。”"
speaker = "yuan_chonghuan"
mood = "tense"
at = "juehua"
objectives = [{ kind = "wait", days = 15 }, { kind = "at", at = "juehua", text = "回到觉华岛" }]
when = [{ kind = "alive", person = "yuan_chonghuan", value = true }]
deadline = [1570, 11, 30]
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_yuan_chonghuan_late" }], news = "觉华岛上，袁兵备把功劳簿翻了两遍，南边来的那位船主始终没再靠岸，那一页就这么留着。" }
news = "觉华岛上，南边来的米没进仓，直接交到了难民推出来的老先生手里；宁远城外的草棚里，这几天头一回有人说粥稠。"

[[tracks.chapters.choices]]
key = "take"
text = "收下谢礼。"
next = "done"
reply = "他数钱数得很快，一文不差，数完才抬头：“功劳的事，兵部那边我去说。”他说这话的声音，比数钱的声音还大。我没问他打算怎么去说，他也没往下讲，翻回前一页，又对了一遍数。"
effects = [{ kind = "cash", value = 3650 }, { kind = "affinity", person = "yuan_chonghuan", value = 8 }, { kind = "reputation", faction = "ming", value = 2 }, { kind = "fame", value = 5 }, { kind = "memory", memory = "mem-request_yuan_chonghuan-settle", title = "沙滩上画满圈的户册" }, { kind = "flag", flag = "c13_request_yuan_chonghuan_done" }]

