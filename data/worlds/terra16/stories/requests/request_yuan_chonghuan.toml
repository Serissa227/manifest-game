# 请托：觉华岛的难民米（request_yuan_chonghuan）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：袁崇焕（yuan_chonghuan，1529 生，男），宁前兵备，在宁远督修城墙（本世界线提前约 55 年，TERRA16 §10.5、§11）；势力 ming，身份档 3；有 fate（1575 年被处死的可能）。cast：cast/historical_09_liaodong.toml。
# 类型：送货（deliver）。任务单写的是三章，实际是四章：offer（报价）、deliver（交货）、settle（结账，米走得干净）、settle_partial（结账，米折了损耗）。
#   多出的一章是引擎的限制：交货的结果不同，谢礼不同，而选项的 requires 不能读本轨道在别的分支上设的旗标，所以走岔了的分支转到 settle_partial，那里有自己的选项与效果。
# 报价：V（到访）。袁崇焕下到觉华岛的粮仓，auto=true；offer 写 family=c13_offer_juehua、冷却 20 天；窗口 1568-03-01 至 1570-06-30，玩家名声 >= 20、满 17 岁。
#   offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻（没人知道这件事没成）。
# 进行中：deliver 章 deadline=1570-10-31，超时走 failed，来信一封（<=120 字），好感 -3，旗标 _late，另有一条见闻；settle 与 settle_partial 是普通章，deadline=1570-11-30，超时 failed。
#   所有期限都在 1570 年冬封冻、1571-02 宁远与觉华岛之战（L11）以前。每一章都读 alive：袁崇焕有 fate，人没了就走 timeout。
# 依据·史实背景：宁远、觉华岛的粮仓与难民；袁崇焕分粮于民的作风，以及他“话说得比做得快”的性子（许出去的常比做得到的多一步，刚愎，军法从事）。
# 依据·原创：三十袋米与八匹棉布；难民推出来的老先生与他的户册；书办“凡上岛的粮先入仓”的令；功劳簿与谢帖。
#   辽东战役链：只写人、书、粮与家信。不运兵器、火药、火炮、铁料，不传军情，不改任何战役变量，不给 jianzhou 加声望。
#   不写毛文龙、不写“款”、不写他私通关外、不写西洋大铳。
# 待核：无。正文只写传闻与人物口吻，不写具体年份的史实事件。
# 秘密：私下派人去关外通书信、对毛文龙的看法——本请托不碰，见闻一律不写。
# 读的旗标：只读本轨道自己的旗标（settle_partial 的变体读 _grabbed）。不设任何 c7_ 旗标；此人没有 C7 线。
# 设的旗标：c13_request_yuan_chonghuan_accepted（offer 接下）、_declined（offer 回绝）、_clean（米走得干净）、_lost（米折了损耗）、_grabbed（当场被兵抢了几袋，_lost 的子情形，只用于变体）、
#   _late（deliver 或 settle 超时）、_done（settle 终局）、_partial（settle_partial 终局）。
# 不用 relation / tie / bond / heart 效果。
# 报酬：货款 1250（交货时付，三个选项都付）；谢礼 3650（走得干净时；折了损耗时 1800）；好感 接下 +2、交货 +3、结账 +8（折成米 +10）；声望 ming +2；名声 +5；回忆 mem-request_yuan_chonghuan-settle。
#   雇小船的选项自付 200，所以那一支净得货款 1050。
# 依赖：港口 juehua（ports_east_asia.toml）；货物 rice、cloth（goods）；属性 stewardship；人物 yuan_chonghuan。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_yuan_chonghuan-settle「沙滩上画满圈的户册」：觉华岛北边的沙滩，黄昏，一个瘸腿的老先生坐在空米袋上，膝头摊着一本册子，每一行户名后面都有一个炭笔画的圈；远处，一个穿青袍的官员在数泊岸的船。

[[tracks]]
key = "request_yuan_chonghuan"
name = "觉华岛的难民米"
kind = "request"
start = "offer"
auto = true
cast = ["yuan_chonghuan"]

# 一、数船的人：觉华岛的粮仓前，袁崇焕数到我的船，走过来先问三个数。
[[tracks.chapters]]
key = "offer"
title = "数船的人"
text = "觉华岛的粮囤一座挨着一座，仓门口站着个穿青袍的人，手里没拿笔，嘴唇在动——他在数泊在滩边的船。我的船刚抛锚，他数到这一条，大步走过来，连招呼也省了：“几天到的？几条船？带了多少粮？”我答完，他点点头，像把数字一个个塞进肚子里。他是宁前兵备袁崇焕，对岸宁远的城墙是他在督修。城外这半年挤满了逃进关的人家，草棚搭到了海边，晾着的棉衣补丁摞补丁。“军粮之外的米，我都拨出去了，还是不够。”他用手指点着数，“要三十袋米，八匹棉布，从南边来，交到这片滩上。米熬粥，够三百口喝半个月；布絮上棉，一匹四件。”他回头看了一眼仓门，“不进仓。军粮是军粮，难民的米是难民的米。账一混，难民就成了兵，兵就成了难民。交给他们自己推出来的人。”"
speaker = "yuan_chonghuan"
mood = "tense"
at = "juehua"
when = [{ kind = "date", from = [1568, 3, 1], to = [1570, 6, 30] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 20 }, { kind = "alive", person = "yuan_chonghuan", value = true }]
deadline = [1570, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_juehua"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "接下：三十袋米、八匹棉布，交到这片滩上。"
next = "deliver"
reply = "他点头：“好。账上我记你一笔。”说着在本子上写了一行，我伸头看，是我的船名、日子，和“米三十，布八”，旁边还空着一格，没填。"
effects = [{ kind = "affinity", person = "yuan_chonghuan", value = 2 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：这趟不顺路。"
next = "failed"
reply = "他“嗯”了一声，已经转身去数下一条船了。我的缆绳还没系稳，他嘴里的数字又从一开始数起。"
effects = [{ kind = "flag", flag = "c13_request_yuan_chonghuan_declined" }]

# 二、难民推出来的人：米和布卸在沙滩上，书办来了。每个选项都会把货交出去。
[[tracks.chapters]]
key = "deliver"
title = "难民推出来的人"
text = "米袋和布匹卸在觉华岛北边的沙滩上，潮线以上，堆得比人高。逃难的人家每户派一个人坐渔船过来，蹲在滩那头，没有一个往前挤。他们推出来说话的是个教过几年书的瘸腿老先生，拄着半截船桨，怀里抱一本册子，纸页被海风吹得卷了边。册子上一户一行：户主，口数，有没有孩子。老先生刚翻开第二页，仓里的书办带着两个人走过来，竹筹敲着掌心：“上头有令，凡是上岛的粮，一律先入仓，再按册发。”老先生没跟他争，把册子合上，抱得紧了一点。“入了仓，发下来的就是仓里的数了。”他对我说，眼睛看着那些米袋。"
speaker = "captain"
mood = "sad"
at = "juehua"
objectives = [{ kind = "goods", good = "rice", qty = 30, at = "juehua", text = "三十袋米运到觉华岛" }, { kind = "goods", good = "cloth", qty = 8, at = "juehua", text = "八匹棉布运到觉华岛" }]
when = [{ kind = "alive", person = "yuan_chonghuan", value = true }]
deadline = [1570, 10, 31]
timeout = { next = "failed", effects = [{ kind = "affinity", person = "yuan_chonghuan", value = -3 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_late" }, { kind = "letter", person = "yuan_chonghuan", text = "登州的米先到了，岛上用不着你的了。我说过账上记你一笔，这一笔划掉。你答应得比船快。——袁崇焕" }], news = "觉华岛的粮仓前，登州调来的米船比南边答应的那条先到了，袁兵备账本上有一行被划掉了。" }
news = "觉华岛北边的沙滩上卸下了几十袋米和一堆棉布，仓里的书办和一个拄桨的老先生，为谁先点数站着争了半天。"

[[tracks.chapters.choices]]
key = "list"
text = "照老先生的户册，当场一户户分。"
