effects = [{ kind = "affinity", person = "yuan_chonghuan", value = 10 }, { kind = "reputation", faction = "ming", value = 2 }, { kind = "fame", value = 5 }, { kind = "memory", memory = "mem-request_yuan_chonghuan-settle", title = "沙滩上画满圈的户册" }, { kind = "flag", flag = "c13_request_yuan_chonghuan_done" }]

# 三b、减了一半的谢礼：米折了损耗，袁崇焕带着老先生上岛来认账。
[[tracks.chapters]]
key = "settle_partial"
title = "三层损耗"
text = "半个月后，袁崇焕上岛，没带账本，带了老先生。老先生拄着桨，把册子翻开给我看：二十几户的名字后面是空的，没有圈。“仓里的收条上写三十袋，”袁崇焕说得很快，“发到难民手里的是十九袋。入仓的损耗，搬运的损耗，点数的损耗——三层，我一层层查了。”他把收条拍在手心上。“米是你送到的，这笔账不赖你。可难民没吃到，这笔账我认。”他从袖里摸出一袋钱，数出一半。“谢礼只能给一半。另一半，记在管仓的人名下，叫他自己还。”"
