reply = "我把米袋一袋袋拆开，老先生念一户，我量一户，他用炭条在那户后面画一个圈。书办站着看了一会儿，起先跺脚，后来蹲了下来。分到天黑，册子上每一户后面都有了圈，最后一个画得很大，炭条断了。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "yuan_chonghuan", value = 3 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_clean" }]
fail = { next = "settle_partial", effects = [{ kind = "cash", value = 1250 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_lost" }, { kind = "flag", flag = "c13_request_yuan_chonghuan_grabbed" }], news = "觉华岛北边的沙滩上分米，分到一半有几个兵挤进来扯开袋口，四五袋米转眼没了，拄桨的老先生被推倒在沙里。" }

[[tracks.chapters.choices]]
key = "boats"
text = "雇渔船把米直接送到对岸难民的滩头，不经岛上。"
next = "settle"
requires = [{ kind = "cash", ge = 200 }]
hint = "你付不起三趟渔船的脚钱。"
reply = "渔家的小船一条装十来袋，来回跑了三趟。书办在岛上跺脚，喊这不合规矩，船已经划出去了。老先生跟着头一趟过了海，坐在船头抱着册子，到了对岸，念一个名字，就有一个人从草棚里出来领。"
effects = [{ kind = "cash", value = 1250 }, { kind = "cash", value = -200 }, { kind = "affinity", person = "yuan_chonghuan", value = 3 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_clean" }]

[[tracks.chapters.choices]]
key = "granary"
text = "交给仓里的书办，照上头的令办。"
next = "settle_partial"
