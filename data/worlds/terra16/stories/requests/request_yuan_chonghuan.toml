effects = [{ kind = "cash", value = 1800 }, { kind = "affinity", person = "yuan_chonghuan", value = 4 }, { kind = "flag", flag = "c13_request_yuan_chonghuan_partial" }]

[[tracks.chapters.choices]]
key = "refugees_partial"
text = "谢礼不要了，折成米，补给册上没分到的几户。"
