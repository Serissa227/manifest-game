news = "觉华岛上，袁兵备为一批少了数的难民米发了火，有人被叫去问话；宁远城外有几户人家，还在等米。"

[[tracks.chapters.variants]]
key = "grabbed"
when = [{ kind = "flag", flag = "c13_request_yuan_chonghuan_grabbed", value = true }]
text = "半个月后，袁崇焕上岛，身后跟着两个兵，手被反绑着，脸朝下跪在滩上。老先生拄着桨站在一边，把册子翻开给我看：二十几户的名字后面是空的，没有圈。“抢米的是城上轮值的人，”袁崇焕说得很快，“军法，每人二十棍。四五袋米，追回来两袋，另外三袋，他们说，进了肚子。”他看了一眼跪着的人。“米是你送到的，这笔账不赖你。可难民没吃到，这笔账我认。”他从袖里摸出一袋钱，数出一半。“谢礼只能给一半。另一半，我拿去补米。”"

