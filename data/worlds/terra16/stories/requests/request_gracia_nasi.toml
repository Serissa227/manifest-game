# 请托：不问名字的一家人（request_gracia_nasi）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：格拉西亚·纳西（gracia_nasi，1510-01-01 生，1569 年卒，女），伊斯坦布尔的“夫人”，门德斯家香料与汇兑生意的掌舵人；势力 ottoman，身份档 3。cast：cast/historical_01_europe.toml。
# 类型：复合（mixed）。五章：offer（报价）、pickup（拉古萨接人）、passage（海上一件事）、arrive（到伊斯坦布尔）、letter（威尼斯送信）；letter 的检定失败走 cold（多走一章的一句回话）。没有 stage 章，因此没有 window 与 default。
# 报价：T（当面）。auto=false，玩家在伊斯坦布尔“问请托”（ask:request_gracia_nasi）启动；offer 章不写 at，目标是在加拉塔的商号找到她。求见门槛（fame 25 或 ottoman 声望 10）由引擎的求见流程负责，本文件不再设门槛条件。
# 窗口：offer 1557-03-01 至 1567-12-31（deadline 为窗口止日，timeout 直接 failed，不写见闻）。pickup、arrive、letter 的窗口只是规划用的可能时间，不写进 TOML。
# 进行中：pickup 120 天、arrive 90 天、letter 150 天，超时各给一封来信（格拉西亚的口气），好感 −3，旗标 _late，走 failed。三封信互不相容，一局里至多收到一封。cold 没有期限，玩家不回应就一直挂着。
# 依据·史实：1556 年安科纳焚烧二十多个改宗者后，格拉西亚号召奥斯曼的犹太商人抵制那座教皇治下的港口；1558 年起苏丹把太巴列租给她（不写本人迁居）。本作里没有安科纳，信送到威尼斯与黎凡特往来的犹太商人手里。
# 依据·原创：拉古萨码头的一家人（不写名字、不写原来的城）、科孚外海的威尼斯商船、金角湾的管事与车、威尼斯犹太区小屋里的长老与年轻的商人、那枚刻着记号的铜牌。
# 待核：安科纳事件的人数与日期只作传闻口吻，正文不写；格拉西亚受租太巴列的确切年份（1558 年起）。
# 秘密：被接的一家人不写名字，见闻只说“一家人”；妹妹布里安达在威尼斯告发过她——不写。谁在哪条船上、走哪条路，正文只写到海上的事为止。
# C7：无本人 C7 线。相关：埃丝特的线里有 1569 年格拉西亚去世的传闻；本请托不碰埃丝特。
# 读的旗标：无（本请托不读 c7_ 旗标，也不读主角的主线旗标）。
# 设的旗标：c13_request_gracia_nasi_accepted（offer 接下）、_declined（offer 回绝）、_asked（pickup 问了来处）、_followed（passage 上有船一路跟着）、_partial（arrive 只收钱）、_late（三处超时之一）、_done（letter 或 cold 收尾）。每条轨道只设一面终局旗标 done；partial 是 arrive 的一条分支，之后直接 done。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不用 growth、title、world、join、leave、start_track、end_track。
# 报酬：现金最多 3650（接人 2400 + 送信 1250），可能自付 400（passage 的 pay 选项）；好感正向合计最多 +19；声望 ottoman +2（arrive 的 take 选项）；隐秘的请托不加名声；回忆 mem-request_gracia_nasi-letter。
# 依赖：港口 istanbul、ragusa_port、venice（ports_east_med.toml）；技能 lang_hebrew（letter 的 hebrew 选项）；属性 seamanship、eloquence（检定）；人物 gracia_nasi（日程在 istanbul）。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_gracia_nasi-letter「犹太区的小屋」：威尼斯犹太区一间低矮的屋子，几位长老围着一盏灯读信，桌角一只铜秤砣压着回信的一角。

