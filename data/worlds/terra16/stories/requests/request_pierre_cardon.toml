# 三、一把旧角尺：拉罗谢尔码头，老汉把家什一样一样摆开。
[[tracks.chapters]]
key = "arrive"
title = "一把旧角尺"
text = "拉罗谢尔的码头上，海风把木屑吹得满地都是。老汉把家什箱一样一样拿出来摆好：刨子、凿子，还有一把用旧了的角尺。每样都用布擦过，摆成一排。刨子柄上刻着一个歪歪扭扭的记号，老汉说那是皮埃尔的刀。两个孩子第一回在船外头站稳，大的那个一直拽着箱角不撒手。老汉一路没合眼，这会儿才坐下。他把角尺递给你，说这是给皮埃尔的：“告诉他，我到了。”"
speaker = "captain"
mood = "tender"
at = "la_rochelle"
when = [{ kind = "alive", person = "pierre_cardon", value = true }, { kind = "date", from = [1562, 7, 1], to = [1563, 12, 31] }]
news = "拉罗谢尔码头上，一户从勒阿弗尔逃出来的胡格诺派人家下了船，老汉先把一箱木工家什摆开。"
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "pierre_cardon", value = -5 }, { kind = "flag", flag = "c13_request_pierre_cardon_late" }, { kind = "letter", person = "pierre_cardon", text = "你没到拉罗谢尔。老汉一家在一个渔村下了船，自己走过去的，家什丢了一半。" }], news = "拉罗谢尔码头上，等一户从勒阿弗尔来的人家等了两个月，人没来。有渔夫说，他们在一个渔村下了船。" }

[[tracks.chapters.variants]]
