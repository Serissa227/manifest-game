# C13d 请托：围城里的邻居（request_pierre_cardon）。中文，Claude 写。
# 人物：皮埃尔·卡尔东 pierre_cardon（1534-05-09 生，男；随新教徒来到瓜纳巴拉湾的木匠，1561 年起在勒阿弗尔的船坞干活，势力 france，身份档 1）。
# 类型：押运／带人（es）；4 章，offer → passage → arrive（或 arrive_rough 降级一章）；没有 stage 章。
# 报价：当面（T）。人物按日程在勒阿弗尔（le_havre，1561—1590 的船坞日程），auto=false，玩家“问请托”（ask:request_pierre_cardon）启动；offer 章不写 at，目标是在港里找到他。
# 窗口：报价 1562-10-15 至 1563-07-25（英格兰人进驻以后，城降之前）；路上与到港章 1562-07-01 至 1563-12-31。
# 进行中：offer 章 deadline=1563-07-25，超时走 failed（不写见闻）；arrive 与 arrive_rough 章 deadline_days=60，超时走 failed，来信一封，见闻是拉罗谢尔码头上的闲话。
# 依据（史实背景）：1562 年 10 月英格兰军进驻勒阿弗尔；1563 年夏法王的军队围城，7 月底城降（史实）。胡格诺派人家趁夜出城，走海路去拉罗谢尔，是原创情节，只写出城那一夜。
#   巡逻的是“国王那边的小船”，不写围城的战斗与城降。皮埃尔的木匠身份、信仰与“主日不干活”是原创。
# 不写：皮埃尔与让·勒布朗的任何事（C7 的线只读不写，cast 里他对勒布朗的感情全轨道不写）；不写恋爱、不写心动。
# 读的旗标：无（gate_main 与 variant_main 都是空的，不依赖主线旗标）。
# 设的旗标：c13_request_pierre_cardon_accepted（接下，含载家什的分支）、declined（回绝）、done（到港，终局）、late（超时，终局）、
#   split（家什分成三个小包）、scared（巡逻船上的人上船看了一眼，只读它改 arrive 的文字）。终局旗标只有 done / late / declined；路上擦沙的降级用章节分开（arrive_rough）。
# 依赖：人物 pierre_cardon 在 cast/story_americas.toml；地点 le_havre、la_rochelle（ports_atlantic_eu.toml）；无物品、无技能奖励。
# 报酬：现金最多 1600（降级路线 1000）；好感最多 +13；名声 +2；回忆 mem-request_pierre_cardon-arrive（只给最好的结局）。
# 回忆插画清单：mem-request_pierre_cardon-arrive，拉罗谢尔码头，一箱木工家什摆开，一把旧角尺搁在最上头。

[[tracks]]
key = "request_pierre_cardon"
name = "围城里的邻居"
kind = "request"
start = "offer"
auto = false
cast = ["pierre_cardon"]

# 一、舱门往哪边开：1562 年秋，英格兰人占着港，皮埃尔来问你的船。
[[tracks.chapters]]
key = "offer"
title = "舱门往哪边开"
text = "工棚里刨花堆到门槛。皮埃尔在刨一扇门，听见脚步声，头也不抬：“站远点，刨花会进眼睛。要修什么？先说好，主日我不干活。”你还没开口，他先问你的船舱门往哪边开。城外是国王的兵，城里是英格兰人，他那户胡格诺派的邻居两边都不敢信。老汉要带两个孙子走，还要带一箱木工家什。“家什留下，人到了拉罗谢尔也是饿死。”皮埃尔把老汉的话学给你听，要你趁夜里开船。"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1562, 10, 15], to = [1563, 7, 25] }, { kind = "age", ge = 17 }]
objectives = [{ kind = "person", person = "pierre_cardon", text = "在港里找到他" }]
deadline = [1563, 7, 25]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应夜里开船，人和家什一起走。"
next = "passage"
reply = "他把刨了一半的门靠在墙上：“这扇门不刨完了。你的舱门往外开，我记住了。”"
effects = [{ kind = "affinity", person = "pierre_cardon", value = 2 }, { kind = "flag", flag = "c13_request_pierre_cardon_accepted" }]

[[tracks.chapters.choices]]
key = "no_chest"
text = "答应载人，可那箱家什太沉，劝他们留下。"
next = "passage"
reply = "皮埃尔不肯：“工具是他的手。”他自己把箱子拆开，分成三个小包，一人背一个。"
effects = [{ kind = "affinity", person = "pierre_cardon", value = 2 }, { kind = "flag", flag = "c13_request_pierre_cardon_accepted" }, { kind = "flag", flag = "c13_request_pierre_cardon_split" }]

[[tracks.chapters.choices]]
key = "decline"
text = "围城的港，你不进不出。"
next = "failed"
reply = "他点点头，没再问，回去接着刨那扇门。刨花从门缝里掉下来，落在你的鞋边。"
effects = [{ kind = "flag", flag = "c13_request_pierre_cardon_declined" }]

# 二、挂灯的小船：出港不久，国王那边的巡逻小船横在航路上。
[[tracks.chapters]]
key = "passage"
title = "挂灯的小船"
text = "船出港还不到两里，海上横着一条国王那边的巡逻小船，船头挂着灯，在喊口令。舵边的水手压低嗓子问：灯还点不点？舱门还敞着，老汉一把将两个孩子按进舱底。舱板一合，里头黑得伸手不见五指，孩子一声不出，只拿小手攥住了他的袖口。巡逻船上的灯晃了一下，转过来，朝你们这边划过来了。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "pierre_cardon", value = true }, { kind = "date", from = [1562, 7, 1], to = [1563, 12, 31] }]
objectives = [{ kind = "wait", days = 2, text = "在海上航行两天" }]

[[tracks.chapters.choices]]
key = "dark_run"
text = "灭了灯，贴着沙洲边上溜过去。"
next = "arrive"
check = { attr = "seamanship", base = 20, per = 7 }
reply = "小船上的灯从船尾晃过去，没停。老汉直到看不见港口的火光，才把孩子放出来。"
effects = [{ kind = "affinity", person = "pierre_cardon", value = 3 }]
