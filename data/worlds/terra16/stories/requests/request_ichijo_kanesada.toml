# 三（甲）、唐·保罗的回信：见过面或留了用法。一个月后老武士带着回信回到府内。
[[tracks.chapters]]
key = "settle"
title = "唐·保罗的回信"
text = "一个月后，户岛的小船又靠上府内的栈桥。老武士从怀里摸出一封信，信封上署的是“唐·保罗”，底下又添了小小的“一条”两个字。信写得又硬又客气：茶是好茶，离了京城以后没喝过这样的；樟脑照那张纸上写的研了，屋里的味淡了；岛上的雨下个没完，下得骨头缝里发霉。末尾另起一行，只有一句：“大友家的人提起我，是怎么说的？”老武士把一小包钱搁在我面前的箱盖上，等我开口。"
mood = "sad"
at = "funai"
when = [{ kind = "alive", person = "ichijo_kanesada", value = true }]
objectives = [{ kind = "wait", days = 30, text = "等户岛的小船再来府内" }]
deadline_days = 120
news = "户岛来的小船又到了府内，船上的老武士说，岛上那位前当主今年冬天咳得轻些了。"

