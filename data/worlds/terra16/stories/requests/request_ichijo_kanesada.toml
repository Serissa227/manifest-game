key = "settle_partial"
title = "结没动过"
text = "一个月后，户岛的小船又到了府内。那几只木箱是渔夫的船运上岛的，我没有上岛。老武士带回一封信，信封上署着“唐·保罗”。信很短：茶收到了，樟脑收到了，箱子上的结没人动过；岛上的雨照旧下。别的一个字也没有。老武士说，主上拆箱以前，先把绳结翻来覆去看了半天，才叫人拿刀。他从怀里掏出一个蓝布小包，搁在船舷上，推到我这边。"
mood = "sad"
at = "funai"
when = [{ kind = "alive", person = "ichijo_kanesada", value = true }]
objectives = [{ kind = "wait", days = 30, text = "等老武士从户岛带回音来" }]
deadline_days = 120
news = "户岛来的小船又到了府内，老武士说，岛上那位前当主拆箱以前，先把封绳上的结看了半天。"

[tracks.chapters.timeout]
