  { kind = "letter", person = "ichijo_kanesada", text = "东西不必送了。户岛什么都不缺，茶有，药也有。你的船若路过宇和海，不必靠岸。——唐·保罗 一条兼定" },
]
news = "府内栈桥外头那条户岛的小船，等了一季没等到货，前几天空着舱回了宇和海。"

