[[tracks.chapters.variants]]
key = "want_see"
when = [{ kind = "flag", flag = "c13_request_ichijo_kanesada_want_see" }]
text = "一个月后，户岛的小船又到了府内。那几只木箱是渔夫的船运上岛的，我没有上岛。老武士带回一封信，信封上署着“唐·保罗”。信很短：茶收到了，樟脑收到了，箱子上的结没人动过；岛上的雨照旧下。末了添了半句：“说要来见我的人，怎么没来？”老武士说，他替我答了一句“宇和海的雾大”，主上没再问，只把绳结翻来覆去看了半天。他从怀里掏出一个蓝布小包，搁在船舷上，推到我这边。"

[[tracks.chapters.choices]]
key = "take"
text = "收下钱，托他回去道一声谢。"
next = "done"
reply = "老武士点点头，把空了的布包叠成小方块塞回怀里。“主上说了，结没人动过，钱就该给。”他说谢字他会带到，主上听了多半只“嗯”一声。"
effects = [
  { kind = "cash", value = 1250 },
  { kind = "affinity", person = "ichijo_kanesada", value = 4 },
  { kind = "flag", flag = "c13_request_ichijo_kanesada_partial" },
]

[[tracks.chapters.choices]]
key = "return"
text = "钱推回去，给岛上的人买些东西。"
next = "done"
reply = "老武士看了我一会儿，把钱收回去，压在念珠底下。“岛上缺盐。我替主上收着，买盐。”他想了想又说，主上问起，他就说是船长落在船上忘了拿的，“这么说，他不骂人。”"
effects = [
  { kind = "affinity", person = "ichijo_kanesada", value = 6 },
  { kind = "flag", flag = "c13_request_ichijo_kanesada_partial" },
]
