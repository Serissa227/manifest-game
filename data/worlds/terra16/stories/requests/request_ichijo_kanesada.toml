# C13d 请托：户岛的茶与樟脑（request_ichijo_kanesada）。Claude 写（2026-10-25），仅中文。
# 人物：一条兼定 ichijo_kanesada（1543 生，男；土佐一条家的前当主，1576 年起寄居伊予宇和海的户岛，已受洗，教名唐·保罗；1577 年遭近臣行刺，伤后多病）。
#   势力 ichijo。cast：cast/historical_07_japan.toml。cast 没有 secret 字段；行刺是史实，只写伤，不写刺客是谁。
# 类型：送货（deliver）。四章：offer（报价）→ deliver（交货）→ settle（见过面或留了用法：回信）／settle_partial（只交了货：回信）。
#   brief 原为三章，settle 的 take 要按“见过面或留了用法／只交了货”拆开；照任务单的做法改成按 next 分流到两章，不在选项上用本轨道自设的旗标作 requires。
# 报价：L（代理人）。兼定住在户岛（cast 日程 togashima，不是港口），出面的是跟去户岛的老武士（不入 cast）；auto=true，at=funai（府内，大友家的港）。
#   offer：family=c13_offer_funai、冷却 20 天；名声门槛 25；窗口 1577-06-01 至 1584-06-30（deadline 为窗口止日，timeout 直接 failed，不写见闻）。
# 进行中：deliver 限 150 天，超时走 failed（好感 -3、旗标 _late、一封 ≤120 字的来信）；settle 与 settle_partial 先等 30 天，之后 120 天内回府内，超时走 failed（好感 -3、旗标 _late、见闻，不再写来信）。
# 依据·史实：1575 年渡川（四万十川）之战败走，1576 年住伊予户岛，受洗教名唐·保罗，1577 年在户岛遇刺重伤，1585 年卒于户岛（TERRA16 §12.1 主线 9、13；弗洛伊斯《日本史》）。
#   渡川之战本身、刺客的名字、他的死（1585 在窗口外）一概不写。
# 依据·原创：缠在老武士手腕上的木念珠、油纸裹的木箱、封绳上那个“主上认得”的结、宇和海夜里的暗礁与雾、一张樟脑的用法、兼定回信末尾那一句问话、廊下那声“哪国人”、蓝布钱包、退回去的钱买了盐。
# 货：茶 6 箱（月港 / 福州 / 澳门有）、樟脑 3 箱（鹿儿岛 / 长崎 / 博多有），府内都不产。brief 把原表的米 ×20、药剂 ×3 换掉：米是府内本地货，药剂东亚无港可买。
#   “米”只在老武士转述的那句话里出现（他的骄傲），玩家不送米。
# 货款：(6 × 60 + 3 × 100) × 1.25 = 825，按 50 取整 800，deliver 三个选项都付（goods 目标回应时扣货）。
# 报酬：货款 800；报酬至多 2250（settle 的 take）、只交了货 1250（settle_partial 的 take）；兼定好感至多 +15；声望 ichijo +2；名声 +3；回忆一张。
# 门禁：offer 写 c13_main_mio=false（澪的弟弟，对澪关闭；正文不提澪）；之后每章 alive ichijo_kanesada。
# 读的旗标：c13_main_mio（offer，由主线设，尚未写成）；c13_request_ichijo_kanesada_want_see（deliver、settle_partial 的变体）；_met（settle 的变体）。
# 设的旗标：c13_request_ichijo_kanesada_accepted（offer 两条接法）；终局 _declined（offer 回绝）/ _late（deliver、settle、settle_partial 超时）/ _done（settle）/ _partial（settle_partial）；
#   分支三面：_want_see（offer 要见他）、_met（deliver 跟船上岛成功）、_dose（deliver 留了樟脑的用法）。
#   brief 里的 _handed 不设：只交了货的两条路（跟船折回、原样封箱）直接 next 到 settle_partial，分支旗标控制在三面以内。brief 推荐的 _good 也不需要，同理靠 next 分流。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。来信全轨道两封：deliver 超时一封、settle 的 take 回信一封；settle 的 return 不写来信，改写一条盐商的见闻。
# 依赖：港口 funai（ports_east_asia.toml）；商品 tea（goods/01_staples_raw.toml）、camphor（goods/05_terra_trade.toml）；技能 herbal_medicine；属性 seamanship；势力 ichijo；人物 ichijo_kanesada。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_ichijo_kanesada-settle「户岛廊下的唐·保罗」：雨后的户岛，廊下坐着一个脸色发灰的男人，腿上搭一条旧褥子，捧着一把茶叶凑到鼻子底下，脚边一只撬开的油纸木箱。

[[tracks]]
key = "request_ichijo_kanesada"
name = "户岛的茶与樟脑"
kind = "request"
start = "offer"
auto = true
cast = ["ichijo_kanesada"]

# 一、旧臣的念珠：府内的码头，跟去户岛的老武士拦住“我”。
[[tracks.chapters]]
key = "offer"
title = "旧臣的念珠"
text = "府内的栈桥上，一个老武士拦住了我。腰里别着刀，左手腕缠着一串木念珠，珠子磨得发黑。他说他是跟着一条家的前当主去了伊予户岛的人，隔些日子就划小船过丰后水道，来府内买盐买针。“主上的伤，一到阴雨天就流脓，夜里睡不着。”他把念珠往上捋了捋，“神父说樟脑压得住那股味。主上自己呢，只要京里那样的好茶。”他顿了顿，像在学谁的口气：“‘别送米来。岛上的人看见米，会说我只剩一张嘴。’”茶和樟脑府内都买不到。他问我的船往不往唐土、往不往南边的萨摩走。“货到了，我们的小船来接。”"
mood = "sad"
at = "funai"
when = [
  { kind = "date", from = [1577, 6, 1], to = [1584, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "fame", ge = 25 },
  { kind = "age", person = "ichijo_kanesada", ge = 18 },
  { kind = "flag", flag = "c13_main_mio", value = false },
]
deadline = [1584, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_funai"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "接下：去外头带茶和樟脑来。"
next = "deliver"
reply = "老武士松了口气，把念珠绕回手腕上。“主上问起，我就说是从唐土来的。他只信远处来的东西。”他想了想又说，樟脑从哪里买的就不必提了，那是神父要的，主上只问茶。"
effects = [
  { kind = "flag", flag = "c13_request_ichijo_kanesada_accepted" },
  { kind = "affinity", person = "ichijo_kanesada", value = 2 },
]

[[tracks.chapters.choices]]
key = "see"
text = "接下，但要上岛去，当面见一见他。"
next = "deliver"
reply = "老武士犹豫了一下，手指在念珠上停了好一会儿。“主上不爱见生人——带着好茶的生人，他会见。”他说回岛上先替我问一声，问不问得下来，等货到了府内再说。"
effects = [
  { kind = "flag", flag = "c13_request_ichijo_kanesada_accepted" },
  { kind = "flag", flag = "c13_request_ichijo_kanesada_want_see" },
  { kind = "affinity", person = "ichijo_kanesada", value = 2 },
]

[[tracks.chapters.choices]]
key = "decline"
text = "往唐土和萨摩的货，我这一程顾不上。"
next = "failed"
reply = "老武士把念珠在手上绕了一圈，没再说话。他朝我点点头，转身下了栈桥。那条小船上的渔夫已经在解缆，船头堆着几袋盐，盐袋上压着一捆针线。他跳上船，没回头。"
effects = [{ kind = "flag", flag = "c13_request_ichijo_kanesada_declined" }]

# 二、过丰后水道的小船：户岛的小船在府内等货，老武士说主上会问是谁开过箱子。
[[tracks.chapters]]
key = "deliver"
title = "过丰后水道的小船"
text = "户岛的小船泊在府内栈桥的最外头，船身窄，桨柄上缠着新草绳。船上两个渔夫，一个老武士。茶叶和樟脑一箱箱搬下来，老武士叫渔夫先拿油纸裹严，再装进木箱，怕的是水道上的浪。他按着箱盖，压低了嗓子：“主上会问，是谁开过箱子。上一个替他办事的人，他到现在还疑心。”两个渔夫低头搓绳子，谁也不接这句话。老武士抬头问我，跟不跟船过去。"
speaker = "captain"
mood = "tense"
at = "funai"
when = [{ kind = "alive", person = "ichijo_kanesada", value = true }]
objectives = [
  { kind = "goods", good = "tea", qty = 6, at = "funai", text = "茶叶六箱运到府内" },
  { kind = "goods", good = "camphor", qty = 3, at = "funai", text = "樟脑三箱运到府内" },
]
deadline_days = 150
news = "府内的栈桥上，户岛来的小船装了几只油纸裹的木箱，船上的老武士守着箱子，渔夫碰一下都要挨骂。"

