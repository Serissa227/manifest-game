check = { attr = "commerce", base = 20, per = 7 }
next = "result"
effects = [{ kind = "affinity", person = "tu_zemin", value = 3 }]
news = "福州巡抚衙门的大堂上，有个船主把一条船的本利摊开来算，涂巡抚拨完算盘，叫书吏照抄在条陈上。"
fail = { next = "result_thin", effects = [{ kind = "flag", flag = "c13_request_tu_zemin_thin" }], news = "福州巡抚衙门的大堂上，有个船主把本利算得太细，涂巡抚听烦了，摆摆手，叫书吏只记个总数。" }

[[tracks.chapters.choices]]
key = "rules"
text = "按行规讲：保结、船引、回港验货"
reply = "你讲保结：五条船一结，一条出事，四条连坐；又讲回港验货，舱里与货单对不上的，船引收回。涂泽民让你停下，亲自提笔，写完问：“收回之后，船主怎么活？”你答，罚过再领。他点了一下头。堂下那个咳嗽的人，脸色不太好看。"
hint = "行里保结、验货的那几道规矩，你还讲不周全。"
