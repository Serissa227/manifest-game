[[tracks.chapters.choices]]
key = "talk"
text = "照实说：船引要多，税要轻，人才肯走正路"
reply = "你说，引发得少，人就去买别人的旗号；税抽得重，货就在外洋卸了，不进福州的港。涂泽民没有打断，等你说完才问：“税轻，轻到多少，船主肯把货运回福州来卸？”你报了个数。他在算盘上拨了一珠：“记下。”书吏的笔沙沙地响了很久。"
check = { attr = "eloquence", base = 20, per = 7 }
next = "result"
effects = [{ kind = "affinity", person = "tu_zemin", value = 3 }]
news = "福州巡抚衙门里，涂巡抚一条一条问跑南洋的船主，有个船长答得干脆，书吏记了满满一页。"
fail = { next = "result_thin", effects = [{ kind = "flag", flag = "c13_request_tu_zemin_thin" }, { kind = "affinity", person = "tu_zemin", value = -2 }], news = "福州巡抚衙门的大堂上，有个跑南洋的船主讲了一大篇，涂巡抚嫌是空话，只让书吏记了两句。" }

[[tracks.chapters.choices]]
