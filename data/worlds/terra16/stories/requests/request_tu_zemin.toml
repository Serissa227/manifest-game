# C13d 人物的请托：船引的条陈（L 来信／代理人模式，说服某人，3 章）
# 人物：涂泽民（生卒不详），福建巡抚都御史，驻节福州，cast 的 tu_zemin（historical）。
# 报价模式 L：求见门槛（名声 50）过高，由巡抚衙门的书吏出面传召，书吏只写身份、不起名、不新建 cast；hearing 章涂泽民本人在堂上说话（cast = tu_zemin）。
# 窗口：报价 1567-02-01 至 1567-12-31（offer 的 deadline 为窗口止日，timeout 不写见闻）；回话章限期 30 天；结算章先等 15 天，限期 120 天。
#   报价章 family = c13_offer_fuzhou，冷却 20 天；名声门槛 25（按 brief）；对林晚灯关闭（c13_main_lin_wandeng = false 才出现）。
# 依据：史实——隆庆元年（1567）月港开海，据说福建巡抚涂泽民奏请准贩东西二洋、唯独日本不许（晚出记述，正文只用“传说”口吻，不写开海的结果，不写日本贸易被允许）。
#   原创——传帖、书吏、案头的算盘、堂下几位不具名的大户、条陈里的一行字、那只布袋。
#   待核：涂泽民是否亲自当堂问过船主、上疏的月份（正文不提具体日子）；大户不起名，记恨只写成打听，没有后续惩罚。
#   与 C7 的关系：月港诸事（小蛮出洋、秦沈的账、周砚重逢）在月港，本轨道在福州，不碰；不写爱情，不设 c7_ 旗标。
# 读写旗标：读 c13_main_lin_wandeng（由林晚灯主线设，尚未写）；
#   写 c13_request_tu_zemin_accepted（接下）/ declined / done / partial / late（终局各一面），
#   分支 c13_request_tu_zemin_thin（回话只被记了两句）与 _noticed（行规一条被他亲自记下）。
# 旗标门禁改成 next 分流：回话被记得薄（thin）时 talk／accounts 的检定失败直接走 result_thin（取代 result 里的 thin 变体与 take_thin 的 requires），因为审计机器人对“选项 requires 本轨道旗标”报准备失败；章数由 3 变 4。
# 依赖：无 B10b 改名（fuzhou 已在港口表）；tu_zemin 的日程只有 1567 年，本请托不用 person 目标。
# 回忆插画：mem-request_tu_zemin-result——福州巡抚衙门大堂，案头一把算盘，堂下坐着几个穿素缎的大户。
# 只中文：terra16 先出中文，本文件不配英文覆盖。

[[tracks]]
key = "request_tu_zemin"
name = "船引的条陈"
kind = "request"
start = "offer"
auto = true
cast = ["tu_zemin"]

[[tracks.chapters]]
key = "offer"
title = "衙门的传帖"
text = "福州城里的船行门口，一夜之间贴出一张巡抚衙门的传帖：凡跑过南洋的船主，到衙门回话——船引怎么领，税银怎么纳，吕宋去得去不得，一条一条问。街上传说，涂巡抚递了本子上京，想把海禁松一松。纸角的浆糊还没干，书吏已经挤过看热闹的人，找到你的船，翻开簿子，指甲点在其中一行：“你的名字在这儿。明日卯时，巡抚亲自问。”他看了一眼左右，把声音压低：“堂上还坐着几位本地的大户。他们的船往哪边开，福州人没有不知道的。”"
mood = "tense"
at = "fuzhou"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1567, 2, 1], to = [1567, 12, 31] }, { kind = "fame", ge = 25 }, { kind = "flag", flag = "c13_main_lin_wandeng", value = false }]
deadline = [1567, 12, 31]
family = "c13_offer_fuzhou"
family_cooldown_days = 20

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.choices]]
key = "go"
text = "去回话"
reply = "书吏蘸了蘸笔，把你的船名写进簿子，墨迹还湿就合上了：“卯时，走侧门。巡抚不爱等人。”"
next = "hearing"
effects = [{ kind = "flag", flag = "c13_request_tu_zemin_accepted" }, { kind = "affinity", person = "tu_zemin", value = 2 }]

[[tracks.chapters.choices]]
key = "ask"
text = "去，先问书吏：说错了怎么办"
reply = "书吏想了想，把笔别到耳后：“说错了不要紧，说多了要紧。巡抚问一句，你答一句；他没问的，咽下去。”他又瞄了一眼衙门的方向，“那几位的事，更不用你提。”"
next = "hearing"
effects = [{ kind = "flag", flag = "c13_request_tu_zemin_accepted" }, { kind = "affinity", person = "tu_zemin", value = 2 }]

[[tracks.chapters.choices]]
key = "decline"
text = "不去"
reply = "书吏把你的船名划掉，笔锋很快，头也没抬，转身往隔壁那条船走去。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_tu_zemin_declined" }]

[[tracks.chapters]]
key = "hearing"
title = "堂上的算盘"
text = "巡抚衙门的大堂不深，案头一把算盘，珠子被手磨得发亮。涂泽民没让你跪，也没让你坐，只叫书吏把纸铺开。“一条船出洋，本钱几何？回来能纳多少税？船引发几张，才够福州的船主走正路？”他问一条，你答一条，书吏记一条。问到你跑过哪几处，你说了吕宋、暹罗，他的拇指没停：“日本呢？”你刚张口，他抬手截住：“不必答。日本不许去，去了按通番论，本院只讲这一句。”堂下左首坐着几个穿素缎的人，其中一个咳嗽了一声，没有人去看他。涂泽民低头拨了一颗珠：“若是开了海，饷银是朝廷的体面；出了事，就是船主不守法。本院可以保你，也可以不保。你要本院怎么记？”"
speaker = "tu_zemin"
mood = "tense"
at = "fuzhou"
cast = ["tu_zemin"]
when = [{ kind = "alive", person = "tu_zemin", value = true }]
deadline_days = 30

[tracks.chapters.timeout]
