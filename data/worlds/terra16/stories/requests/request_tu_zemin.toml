news = "福州巡抚衙门的大堂上，有个船主讲到回港验货，涂巡抚亲自提笔记了，堂下的大户脸色不太好看。"

[[tracks.chapters]]
key = "result"
title = "条陈上的一行字"
text = "十几天后，书吏到船行找你，提着一只小布袋，袖口还沾着墨。“条陈已经拜发了。”他把布袋放在柜台上，没解开，“巡抚说，几个船主的话，他都誊清了，往北京去。”走到门口，他又回过头，声音比进门时低：“那天堂下坐着的一位，打听过你的船名。不是衙门问的。”"
speaker = "captain"
mood = "cheerful"
at = "fuzhou"
when = [{ kind = "alive", person = "tu_zemin", value = true }, { kind = "flag", flag = "c13_request_tu_zemin_thin", value = false }]
