# 请托：三十年前的赎金（request_sayyida_al_hurra）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：赛义达·胡拉（sayyida_al_hurra，女，1485 生、约 1561 卒），得土安的旧女主，1542 年后被女婿夺位，退居舍夫沙万；cast 在 cast/historical_02_islamic.toml。
# 类型：信（letter）。四条线：offer（报价）→ handover（休达送信）→ reply（带回半张收条）、reply_bare（没带收条）、reply_face（她不下山，回一封信）。终点 done / failed。
#   结构说明：past_clerk 成功进 reply（收条在手），失败进 reply_bare；to_son 也进 reply_bare，两个变体只改正文；read_pt 进 reply_face，回信走 letter 效果。
#   每个结账章的两个选项各设一面终局旗标（done 或 partial）。
# 报价：V 到访（auto=true）。offer 章 at=tetouan，family=c13_offer_tetouan、冷却 20 天；deadline=1560-10-31，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1557-03-01 至 1560-10-31；之后的章节只要她还活着（alive）。
# 依据·史实背景：赛义达·胡拉（阿伊莎）1515—42 统治得土安，与海雷丁联手，掳人赎金是得土安的财源；1542 年后被女婿夺位，退居舍夫沙万，约 1561 年卒。赎俘的案子是虚构的，只写一户人家。
# 依据·原创：休达那户老寡妇与她的儿子、那张发黄的收条、赎金的账、两半收条的撕口、书记代笔的几封信。
# 依赖：港口 tetouan、ceuta（ports_north_africa.toml）；技能 lang_portuguese（skills.toml）；人物 sayyida_al_hurra。B10b：无需改名。主线门禁：无（她不是主线人物）。
# 日程：cast 日程写她 1553—1560 在 chefchaouen_city（court）。本条写她下山到得土安临港的宅子住着，与日程不符；整合时若要一致，由 B10b 调整日程，本文件不改。
# C7：无 C7 线。本文件不读也不设任何 c7_ 旗标。
# 读的旗标：c13_request_sayyida_al_hurra_read_public、_left_to_son（reply_bare 的两个变体，只改正文）。
# 设的旗标：_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_believed（past_clerk 成功）、_read_public（past_clerk 失败）、_want_face（read_pt）、_left_to_son（to_son）、_done / _partial（终局）、_late（超时，终局）。
# 秘密：她没有原谅谁，这是心里的事，正文不说破。赎金到底退给了谁，正文不下结论；见闻不写这一层。
# 口头禅：被夺位的事只说一句固定的话，全轨道只在 reply 章的最好结局里用一次。
# 报酬：现金最多 3650；好感最多 13（2+3+8）；名声 +5；摩洛哥声望 +3；回忆 mem-request_sayyida_al_hurra-reply（只在 reply 的最好结局给）。reply_face 的回信是 letter 效果，每封 ≤300 字。
# 回忆插画清单：
#   mem-request_sayyida_al_hurra-reply：灯下两张发黄的收条，撕口对在一起，窗外是临港的白墙和卸货的吊索。

