# 五、一部誊清的抄本：一个月后，书记送来抄本。
[[tracks.chapters]]
key = "epilogue"
title = "一部誊清的抄本"
text = "一个月后，书记抱着一部誊清的《列国之镜》来到码头。抄本是新的，纸边还带着墨香。书记说，这一个月将军几乎没出过海图房，抄的时候，错字都是他自己一个一个划掉的。书页里夹着将军的一张字条，字写得又小又直：“书送你。你去过的那些港口，书里也有。”书记把抄本翻到风暴那一页，停了停，又合上，“将军让我别多翻。”"
mood = "tender"
at = "istanbul"
when = [{ kind = "alive", person = "seydi_ali_reis", value = true }]
objectives = [{ kind = "wait", days = 30, text = "等一个月" }]
deadline_days = 120

