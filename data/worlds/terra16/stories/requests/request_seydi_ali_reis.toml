# C13d 人物的请托：风暴到底刮了几天（request_seydi_ali_reis）。中文，Claude 写。
# 人物：西迪·阿里·雷斯 seydi_ali_reis，奥斯曼海军将领、《列国之镜》的作者；男；势力 ottoman；生年不详（cast 占位 [0,1,1]）；1562 年卒。cast 在 cast/historical_02_islamic.toml，日程 1560—1561 在伊斯坦布尔（istanbul，trading_house）。身份档 2（官员）。
# 类型：复合（mx）；5 章，offer → muscat → diu → back → epilogue；终点 done / failed。
# 报价：来信／代理人（L）。auto=true；offer 章 at=istanbul，出面的是兵工厂海图房的书记（只写身份，不新建 cast，不写 speaker）。窗口 1560-02-01 至 1561-06-30（offer 的 when 与 deadline）；family c13_offer_istanbul，冷却 20 天；名声门槛 10。将军本人只在 back 章说话（求见门槛高，前面都是书记）。
# 依据·史实：1554 年他奉命把巴士拉的舰队带回苏伊士，两度遇上葡萄牙舰队，又遇上风暴，残船漂到古吉拉特，水手多半留下；他由陆路回伊斯坦布尔，1557 年写成《列国之镜》，1562 年卒。正文只写书里怎么写、水手怎么说之间的出入；1554 年的海上与救起的小艇不写（那是纳吉玛的养成事件）。
# 依据·原创：海图房的书记、马斯喀特葡萄牙堡下补网的老水手（设拉子人）、第乌堡里搓缆绳的老水手长、将军的字条与镇纸都是原创。
# 待核：风暴刮了几天没有定论，正文只用“书里说”与“水手说”两种口吻，不下结论。
# 秘密：cast 无 secret。将军为放行文书给君主写过颂诗、事后难为情；只在 back 章的 change 一支由他自己带过一句，不进见闻。
# 读的旗标：c13_main_najma（offer 的变体，主线第一章设；未设时不触发）。不读 c7_*，不写 C7 的任何人。
# 设的旗标：c13_request_seydi_ali_reis_accepted / declined / heard_passage / thin / detailed / exact / soft / greeting / done / book_changed / partial / book_kept / left_in_room / late。
# 依赖：无 B10b 改名（istanbul、muscat、diu 都是现有港口）；奖励物 seydi_mirror_ms（items/books_03_geography_02.toml）。整合时请把将军的日程延到 1562-10-31（back 章的窗口在 1562 年，表里只写到 1561-12-31）。
# 缺省走向：offer 不在场就一直挂着，到 1561-06-30 走 failed，不写见闻。muscat、diu、back 超时走 failed 并各来一封信；epilogue 超时走 done（事情已经办完了）。
# 回忆插画清单：
#   mem-request_seydi_ali_reis-epilogue（誊清的抄本）：一部新誊的抄本摊在海图房的桌上，书页翻到风暴那一页，纸边夹着一张小字条。

[[tracks]]
key = "request_seydi_ali_reis"
name = "风暴到底刮了几天"
kind = "request"
start = "offer"
auto = true
cast = ["seydi_ali_reis"]

# 一、海图房的书记：1560 年 2 月起，在伊斯坦布尔报价。
[[tracks.chapters]]
key = "offer"
title = "海图房的书记"
text = "兵工厂海图房的书记把一封信推到你面前，信封上压着将军的私章。“将军写《列国之镜》，写到 1554 年那场风暴，写的是刮了十天十夜。”书记用指甲敲着那一行，“他想知道，船上的水手们记得的，跟他写的是不是一样。”他停了停，把信往你这边又推了推，“不催你。只是将军问起来，我得有句话答。”他说，那年在船上的一个老水手，后来流落到马斯喀特，如今在葡萄牙人的堡下面补网。"
mood = "cheerful"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1560, 2, 1], to = [1561, 6, 30] }, { kind = "fame", ge = 10 }]
at = "istanbul"
deadline = [1561, 6, 30]
family = "c13_offer_istanbul"
family_cooldown_days = 20

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.variants]]
key = "najma"
when = [{ kind = "flag", flag = "c13_main_najma", value = true }]
text = "兵工厂海图房的书记把一封信推到你面前，信封上压着将军的私章。“将军写《列国之镜》，写到 1554 年那场风暴，写的是刮了十天十夜。”书记用指甲敲着那一行，“他想知道，船上的水手们记得的，跟他写的是不是一样。”他停了停，把信往你这边又推了推，“不催你。只是将军问起来，我得有句话答。”他说，那年在船上的一个老水手，后来流落到马斯喀特，如今在葡萄牙人的堡下面补网。书记多看了你一眼。“听说你是尤尔法人。那年阿曼湾的事，你小时候听过吧？”"

[[tracks.chapters.choices]]
key = "take"
text = "接下：去马斯喀特找那个老水手。"
next = "muscat"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 2 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_accepted" }]
reply = "书记把将军画的一张小图交给你，图上马斯喀特的海湾画得比真的还圆。“将军说，照这个找。”他把图卷起来塞进你手里，又补了一句，“我劝你照你自己的眼睛找。”"

[[tracks.chapters.choices]]
key = "read_passage"
text = "接下，先请书记把写风暴的那段念给你听。"
next = "muscat"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 2 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_accepted" }, { kind = "flag", flag = "c13_request_seydi_ali_reis_heard_passage" }]
reply = "书记念到“十天十夜，天与海不分”，停下来看你：“将军最喜欢这一句。”他又翻过一页，指着下面一行，“这一句他改过三遍。头一版写的是‘失算在舵手’，后来改成了‘不过是信了风’。”"

[[tracks.chapters.choices]]
key = "decline"
text = "葡萄牙人的堡下面，这一趟我不去。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_seydi_ali_reis_declined" }]
reply = "书记松了口气，把信收回信封。“那我就回将军，没人记得了。”他说这话时没看你，眼睛盯着窗外那几根桅杆，手指把信封的边角一点点压平。"

# 二、补网的老水手：马斯喀特，葡萄牙堡下面。进行中的章，200 天内要到。
[[tracks.chapters]]
key = "muscat"
title = "补网的老水手"
text = "马斯喀特的海滩上，老水手盘腿坐在网堆里，葡萄牙人的堡墙在他背后投下一截影子。他听说你是将军派来的，先冷笑了一声。“风是刮了。十天？五天。第六天早上就停了。”他的口音带着设拉子那一带的软调子，梭子在网眼里穿来穿去，“剩下那几天，船是漂着的，人是吵着的，没人知道往哪儿去。”他说完又笑，这回笑得有点难看，“你要问清楚，去第乌找老水手长。他那时候在将军身边。”"
speaker = "captain"
mood = "cheerful"
at = "muscat"
when = [{ kind = "alive", person = "seydi_ali_reis", value = true }]
deadline_days = 200

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = -3 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_late" }, { kind = "letter", person = "seydi_ali_reis", text = "海图房书记：将军等不到马斯喀特的话，自己又改了一遍那一段。" }]

[[tracks.chapters.choices]]
key = "listen"
text = "陪他补一下午网，让他慢慢讲。"
next = "diu"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 3 }]
check = { attr = "eloquence", base = 20, per = 7 }
reply = "他讲到天黑透，灯都点上了：哪条船先断了桅，谁在船上念经，谁偷偷吃了将军的干枣。他不肯说将军的坏话，只说：“将军那几天，一直在看星。”"
news = "马斯喀特葡萄牙堡下补网的老水手，跟一个外来的船长讲了一下午当年的风暴。"

[tracks.chapters.choices.fail]
next = "diu"
effects = [{ kind = "flag", flag = "c13_request_seydi_ali_reis_thin" }]
news = "马斯喀特葡萄牙堡下，外来的船长陪老水手补了一下午网，老水手只讲了“五天”两个字，就收网回家。"

[[tracks.chapters.choices]]
key = "in_tongue"
text = "用他家乡的波斯话问。"
next = "diu"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 3 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_detailed" }]
requires = [{ kind = "skill", skill = "lang_persian", ge = 60 }]
hint = "他的话你听得懂一半，另一半是哪里的口音你都分不清。"
reply = "他一听你开口，眼眶就红了。“十年了，这里没人跟我这样说话。”他讲得很细，连船哪天看见了陆地都记得，还比划着海鸟飞来的方向。"
news = "马斯喀特的海滩上，一个外乡船长用设拉子话问补网的老水手，老人眼眶红了，讲了很久。"

[[tracks.chapters.choices]]
key = "pay_debt"
text = "替他还了网铺的账，再问。"
next = "diu"
effects = [{ kind = "cash", value = -200 }, { kind = "affinity", person = "seydi_ali_reis", value = 3 }]
requires = [{ kind = "cash", ge = 200 }]
hint = "网铺的账你垫不起。"
reply = "他把账单折起来塞进头巾，骂了一句葡萄牙话，说这笔账他记着，以后请你喝酒。说话痛快多了，说完他问你：将军的书里，有没有写到他？"
news = "马斯喀特葡萄牙堡下，一个船长替补网的老水手还清了网铺的账，老水手这才肯开口。"

# 三、是谁先转的舵：第乌堡里，搓缆绳的老水手长。
[[tracks.chapters]]
key = "diu"
title = "是谁先转的舵"
text = "第乌堡里，搓缆绳的老水手长听你说完，放下手里的麻。“风暴前一天，是将军自己下令往东转，躲开葡萄牙人的船。转去古吉拉特，是将军先定的。风暴只是把这件事做完了。”他说这话一点也不像在告状，倒像替将军可惜。他把手在裤腿上擦了擦，又去拿麻。手上的老茧一道一道，缠着麻绳，像是绕了几十年。"
speaker = "captain"
mood = "tense"
at = "diu"
when = [{ kind = "alive", person = "seydi_ali_reis", value = true }]
deadline_days = 120

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = -3 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_late" }, { kind = "letter", person = "seydi_ali_reis", text = "海图房书记：第乌的话没带回来，将军说也好，书就照原样。" }]

[[tracks.chapters.choices]]
key = "write_exact"
text = "一字一字记下来，连他的口气也记。"
next = "back"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 3 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_exact" }]
reply = "他看你写完，叫你念一遍。念到“将军先定的”，他点点头：“对。那天往西就是死，他没有判错。可那道令是他先下的，这个你要写清楚。”"
news = "第乌堡里搓缆绳的老水手长说，有个船长专程来问他当年谁转的舵，问得一字不差。"

[[tracks.chapters.choices]]
key = "write_soft"
text = "记下来，但把谁下的令写得含糊一点。"
next = "back"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 2 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_soft" }]
reply = "他把你的纸拿过去，对着灯看了一眼。那一行被你写成了“船上定了往东”，他用指甲在“船上”两个字下面划了一道。他没说什么，把麻又拿起来。“书是将军的书。”"
news = "第乌堡里的老水手长说，有个船长来问当年的舵，问完低着头写了很久，写的什么没人看见。"

[[tracks.chapters.choices]]
key = "invite"
text = "请他跟你回伊斯坦布尔，当面跟将军说。"
next = "back"
effects = [{ kind = "affinity", person = "seydi_ali_reis", value = 3 }, { kind = "flag", flag = "c13_request_seydi_ali_reis_exact" }, { kind = "flag", flag = "c13_request_seydi_ali_reis_greeting" }]
reply = "他笑了：“我老婆在这里，孩子在这里，堡里的人给工钱。”他把麻团往你怀里一塞，“你替我问将军好。就说，那天的星他看得对。”"
news = "第乌堡里搓缆绳的老水手长说，有个船长请他去伊斯坦布尔，替将军把那场风暴当面讲一遍，他没应。"

# 四、书要不要改：伊斯坦布尔海图房，将军亲自见你。
