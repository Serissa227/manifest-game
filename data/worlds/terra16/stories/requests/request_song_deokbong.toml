reply = "码头上找来的私脚是个老兵，缺了半只耳朵。他说他去过钟城，那地方的雪埋得到窗户，夜里狼在城墙外头叫。他把包袱绑在胸前，说睡觉也不解。书吏站在船舷边看了一会儿，没再提念诗的事，只叮嘱老兵：到了兵营，先来找他。"
