# 三、收尾（诗原封到了）：老家人第二回到釜山，带来她的信和一页账。
[[tracks.chapters]]
key = "reply"
title = "北边来的回诗"
text = "老家人第二回到釜山，比上回瘦了一圈，背上的包袱换成了一只小木匣。匣里是宋德峰的信。钟城的回信先到了潭阳：冬衣收到了，那人回了一首诗，夸那件袍子比京里的皮裘还暖。她把这一句照抄给我，底下另起一行：“他从来只夸袍子，不夸缝袍子的人。三斤四两棉花，是我一两一两称的，他倒说得像是天上掉下来的。”信后附着一页账，前头是棉花、布、线，还有老家人路上的茶钱，最后一行写着我的名字，后面没写完。"
