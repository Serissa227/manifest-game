effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "song_deokbong", value = 10 }, { kind = "reputation", faction = "joseon", value = 1 }, { kind = "fame", value = 3 }, { kind = "flag", flag = "c13_request_song_deokbong_done" }, { kind = "memory", memory = "mem-request_song_deokbong-reply", title = "账上的最后一行" }, { kind = "letter", person = "song_deokbong", text = "老家人回来，把你说的海念给我听，念了三遍，第三遍把鱼念成了星星。我将错就错，写进了诗：船边一网，捞起半舱星斗。等下一回军布船北上，抄一份捎去钟城，看他这回是夸诗，还是又只夸袍子。账上你那一行，我补齐了：谢船主，说海一回，两不相欠。" }]

# 三′、收尾（诗被拆看过）：冬衣到了，可钟城兵营里先念起了她的诗。
