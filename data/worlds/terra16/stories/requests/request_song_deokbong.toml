text = "老家人第二回到釜山，背上的包袱换成了一只小木匣。宋德峰的信里说，冬衣收到了，那人回诗夸袍子比京里的皮裘还暖；她照抄了这一句，添一行：“他从来只夸袍子，不夸缝袍子的人。”往下一段，字就硬了：“钟城兵营里有人念我的诗，念得满营都知道潭阳有个会写诗的女人。抄的那位还抄错了字，两处‘寒’都写成了‘塞’。诗是写给一个人的，如今一营的人替他读了。”信后附着账，最后一行是我的名字，后面跟着半句没写完的话。"
