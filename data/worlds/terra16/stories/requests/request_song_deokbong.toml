# C13d 请托：寄往钟城的冬衣（request_song_deokbong）。Claude 写（2026-10-25），仅中文，不配英文覆盖。
# 人物：宋德峰 song_deokbong（1521 年生，1578 年卒，女；潭阳的女诗人，势力 joseon）。cast：cast/historical_08_korea_ryukyu.toml。
#   丈夫柳希春因 1547 年的壁书案流放极北的钟城（正文只说“那桩案子”）；她独自守家、记账、作诗。
#   日程 1553—1577 在潭阳（damyang_city），不下釜山；全轨道只在信里说话，出面的是潭阳来的一个老家人（无名，不进 cast）。
# 类型：送信（letter）。brief 三章 offer → handover → reply；reply 按交出时诗有没有被拆看拆成 reply / reply_read 两章（见“结构说明”），文件里共四章。终点 done / failed。
# 报价：L（来信）。auto=true，offer 章 at=busan，speaker 省略；family="c13_offer_busan"、family_cooldown_days=20。
#   规划窗口（不进 TOML，普通章没有 window）：offer 1557-03-01 至 1564-06-30；handover 约 1557-04 至 1564-10；reply 约 1557-10 至 1565-09。
#   offer 的 deadline 为 1564-06-30，timeout 直接 failed，不写见闻；handover 的 deadline_days=75；reply 的 deadline_days=300。
#   窗口止于 1564-06-30：1565 年柳希春移配恩津、1567 年宣祖即位后赦还，正文不写到那以后，也不写赦还。
# 依据·史实：柳希春 1547—1567 年流放（先钟城，1565 年移恩津），1567 年赦还；宋德峰与他隔着千里以诗相赠，事见柳希春《眉岩日记》；
#   宋德峰持家、记账极细，见 cast 的 persona。
# 依据·原创：老家人与他捆了三道麻绳的包袱；棉袍的账（棉花三斤四两、青布二丈一尺、白线五团，另两团从旧袍子上拆下）；
#   北道兵营的押运书吏（无名，不进 cast）与每年沿东岸北上的军布船；缺了半只耳朵的老兵私脚；“寒”抄成“塞”的两个错字；
#   柳希春回诗里“比京里的皮裘还暖”一句与宋德峰后来那首写海的诗——都是编的，不是两人诗作的原文。
# 不写的事：玩家与宋德峰之间没有任何暧昧；她的婚姻按史料写，只写她与丈夫的诗、账、冬衣；书吏抄诗不写成坏事，只是她不想。人物无 secret。
# 招牌话：信里那一句“诗你们念不念都行。冬衣不能晚——北边的雪，不等人读完诗才下。”全轨道只在 offer 正文出现一次。
# 结构说明：brief 的 reply 要按 sealed / read 拆选项。按本批约定，不用 requires 读本轨道自己设的旗标，改按 next 分章：
#   handover 的“原封带去”成功、“念一首”“雇私脚”去 reply（设 sealed）；“原封带去”检定失败去 reply_read（设 read）。两章各两个选项，都没有 requires。
#   检定失败的分支没有回复：书吏拆看、抄诗写进 fail 的见闻与 reply_read 的正文。
# 报酬（与 brief 一致，每份一次）：最好的结局（reply）现金 900、好感 +8（回赠见闻再 +2）、joseon 声望 +1、名声 +3、回忆一张；
#   折中（reply_read）现金 500、好感 +4（回赠见闻再 +2）。好感正向合计至多 2+3+8+2=15。唯一奖励物品：无。技能经验：无。
#   雇私脚的选项先 requires cash ≥ 100，再扣 100。
# 失败与超时（照 brief，不另加好感惩罚）：handover 超时设 _late 并来一封短信（≤120 字）；reply 超时只设 _late，不来信（冬衣已经送到）。
# 来信：全轨道两封——handover 超时一封；reply“回赠见闻”一封。一次游戏至多一封。
# 读的旗标：无。不读也不设任何 c7_ 旗标。
# 设的旗标（c13_request_song_deokbong_<事件>）：accepted；终局 declined / done / partial / late；分支 sealed、read。
# 依赖：港口 busan；技能 poetry；势力 joseon；属性 eloquence。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_song_deokbong-reply「账上的最后一行」：釜山码头的石阶上摊着一页账，棉花、布、线一行行记下来，最后一行是船主的名字，旁边搁着一只小木匣。

[[tracks]]
key = "request_song_deokbong"
name = "寄往钟城的冬衣"
