[[tracks.chapters.choices]]
key = "one"
text = "我挑一首念给他听，其余的封好。"
next = "reply"
requires = [{ kind = "skill", skill = "poetry", ge = 60 }]
hint = "那几首诗的平仄你拿不准，念走了调，反倒坏事。"
reply = "我挑了一首写北风的，念得很慢。念完，书吏半天没说话，拿油纸把剩下的几卷包回去，包了两层，又在封口按了自己的指印。“这一首我记住了，不用抄。”他把包袱抱上船，抱得像抱一只刚出炉的瓦罐。"
effects = [{ kind = "affinity", person = "song_deokbong", value = 3 }, { kind = "flag", flag = "c13_request_song_deokbong_sealed" }]
news = "釜山码头上有个船主给北道的押运书吏念了一首写北风的诗，书吏听完，把剩下的诗封了两层。"

[[tracks.chapters.choices]]
key = "private"
text = "另雇一个私脚跟船北上，包袱不经他的手。"
next = "reply"
