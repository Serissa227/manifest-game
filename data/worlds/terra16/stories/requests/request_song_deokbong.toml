# 一、报价：釜山码头，潭阳来的老家人背着一卷诗、一件棉袍、一页账。
[[tracks.chapters]]
key = "offer"
title = "一卷诗、一件棉袍"
text = "釜山码头的石阶上，一个老家人从天亮等到晌午，背上的包袱捆了三道麻绳。他说从潭阳来，走了九天。包袱解开一角：一卷诗，油纸包着；一件棉袍，絮得极厚，按下去半天才弹回来；还有一页账，字小而密——棉花三斤四两，青布二丈一尺，白线五团，另有两团是从旧袍子上拆下来的，也记上了。夫人的信只有几行：“诗你们念不念都行。冬衣不能晚——北边的雪，不等人读完诗才下。”老家人说，老爷因为那桩案子发配到钟城，一去好些年；驿递到那边要走两个月，夫人不放心。釜山每年有一条运军布的船沿东岸北上，押运的是北道兵营的书吏。夫人托我在釜山找着这个人，看着包袱上了船，赶在入冬以前。"
mood = "tender"
at = "busan"
when = [{ kind = "date", from = [1557, 3, 1] }, { kind = "age", ge = 17 }]
deadline = [1564, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_busan"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "接下包袱，替夫人找那个押运书吏。"
next = "handover"
reply = "老家人把那页账叠成四折，塞回包袱里，压在棉袍底下。“夫人交代，账也要一起带去——老爷得知道这件袍子花了多少。”他又说，老爷的信里总说北边的日子过得惯，夫人一个字也不信，回信里一条一条数给他听。说完他把三道麻绳重新勒紧，才把包袱递到我手上，重得往下一沉。"
effects = [{ kind = "flag", flag = "c13_request_song_deokbong_accepted" }, { kind = "affinity", person = "song_deokbong", value = 2 }]

[[tracks.chapters.choices]]
key = "decline"
text = "兵营的船我搭不上话，还是走驿递稳当。"
next = "failed"
reply = "老家人没争，把包袱重新捆了三道，背回肩上。“那就走驿递。夫人说过，船主肯不肯，账上都不记欠。”他往驿站那条路去了，走得比来时快，大概是在算两个月以后，钟城下了几场雪。"
effects = [{ kind = "flag", flag = "c13_request_song_deokbong_declined" }]

# 二、交出：军布船装舱，押运书吏是个爱诗的年轻人，想先听一听。
[[tracks.chapters]]
key = "handover"
title = "押运书吏想先念诗"
text = "军布船泊在釜山的旧码头，一捆捆青灰的布往舱里递，号子喊得震天。押运的书吏比我想的年轻，袖口沾着墨，账册夹在腋下。一听包袱是潭阳宋夫人的，他眼睛一亮，说夫人的诗他在汉阳抄过两首。随即又压低声音：“寄给钟城那位的东西，过兵营时上头多半要翻。诗里有一个字不妥，谁也担不起。”他盯着那卷油纸，“能不能先念给我听？我心里有数，到了上头也好替夫人说话。”"
speaker = "captain"
mood = "tense"
at = "busan"
when = [{ kind = "alive", person = "song_deokbong", value = true }]
objectives = [{ kind = "wait", days = 15, text = "等北上的军布船装舱" }, { kind = "at", at = "busan", text = "在釜山找到押运书吏" }]
deadline_days = 75

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_song_deokbong_late" }, { kind = "letter", person = "song_deokbong", text = "包袱老家人背回来了，冬衣还是交了驿递，到钟城晚了一个月。他来信说，那几天冻得握不住笔，诗也没写成。账上我记了一笔：潭阳到釜山，往返十八天的盘缠。" }]

[[tracks.chapters.choices]]
key = "sealed"
text = "劝他原封带去：夫人的诗，只写给一个人看。"
next = "reply"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "我说兵营要翻，是兵营的事；押运的先拆了，夫人那页账上就得添一笔，添的是他的名字。他想了一会儿，笑了，把包袱塞进自己行李的最底下，压上两捆军布。“到了钟城，我亲手交。上头要看，叫他们当着我的面拆。”"
effects = [{ kind = "affinity", person = "song_deokbong", value = 3 }, { kind = "flag", flag = "c13_request_song_deokbong_sealed" }]
news = "釜山北上的军布船上，押运书吏把一个潭阳来的包袱压在自己行李最底下，说到钟城以前谁也别碰。"

[tracks.chapters.choices.fail]
