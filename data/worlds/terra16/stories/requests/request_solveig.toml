# epilogue · 1572—1585 · 哈夫纳夫约杜尔：一屋子孩子听文兰萨迦，她没改词
[[tracks.chapters]]
key = "epilogue"
title = "这一回没改词"
text = "过了些日子，我在哈夫纳夫约杜尔的码头上又找到索尔维格。她坐在一屋子孩子中间，正讲文兰萨迦。孩子们把草垫坐得满满的，有个小子嚼着鱼干，眼睛却不离她的嘴。她讲到那些人在海边搭木屋，讲到一个冬天的大雪。嗓子比从前哑了，该停的地方，她还是停得准。讲到格陵兰那一段，她抬起头，看见门口的我，停了一下。屋里的孩子也跟着回头，像是等她把这一段讲完。"
speaker = "captain"
mood = "cheerful"
at = "hafnarfjordur"
when = [{ kind = "date", from = [1572, 1, 1], to = [1585, 12, 30] }, { kind = "alive", person = "solveig", value = true }]

[[tracks.chapters.choices]]
key = "sit"
text = "坐下来听她讲完。"
next = "done"
effects = [{ kind = "affinity", person = "solveig", value = 2 }]
reply = "她讲到格陵兰，说有个船长去看过——她指了指你。孩子们全回头看你，你只好点头。"

[[tracks.chapters.choices]]
key = "wave"
text = "摆摆手，让她接着讲，你去码头了。"
next = "done"
effects = [{ kind = "affinity", person = "solveig", value = 1 }]
reply = "你摆了摆手，退到门外，隔着门听见她讲：“岸上没有炊烟。”这一回，她没改词。"
