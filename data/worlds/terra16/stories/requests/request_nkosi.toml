# 请托：鞋上的尘（request_nkosi）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：恩科西（nkosi，1538-03-08 生，男），穆塔帕王廷的年轻信使，斯瓦希里文化；cast 在 cast/story_indian_ocean.toml，势力 mutapa。
# 类型：送货（deliver）。三章：offer（报价）、deliver（交货）、settle（结账）；没有 stage 章，因此没有 window 与 default。
# 报价：V（到访）。人物从内陆王廷下到索法拉（sofala），auto=true；报价章 at=sofala，窗口 1574-01-01 至 1590-06-30（以 when 的 date 条件表达）。
#       offer 写 family=c13_offer_sofala、冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：deliver 章 deadline_days=120，超时走 failed，来信一封、好感 -5、旗标 _late，并给一条短的见闻，免得码头上的人对这件事一无所知；settle 是等待两个月的普通章，没有期限。
# 依据·史实背景：1569—72 年葡萄牙远征穆塔帕（史实；远征本身归巴拉卡主线 3，本轨道只写“远征队过去以后”）；索法拉的棉布多从帕泰、摩加迪沙运来；穆塔帕的金与内陆的村子是史实的王国与村落框架。
# 依据·原创：恩科西这个人，他的口信与鞋上的尘，村里的粮仓，挑出的四匹颜色最鲜的布，第一茬高粱。
# 秘密：cast 没写秘密，本请托不碰。
# 读的旗标：c13_main_baraka（offer 的 variant，只换开场的一句话）。不读也不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 设的旗标：c13_request_nkosi_accepted（offer 两条接法）、c13_request_nkosi_declined（offer 回绝，终局）、c13_request_nkosi_late（deliver 超时，终局）、c13_request_nkosi_done（settle 两条收尾，终局）。
# 报酬：现金最多 1250（报酬，settle 付）+ 2000（布的货款，deliver 章另付）；好感最多 +15；名声 +2；回忆 mem-request_nkosi-settle（只给 keep_grain 一条）。
# 依赖：港口 sofala（ports_east_africa.toml）；货物 cloth（cities.toml 的商品表）；技能 lang_swahili（skills.toml）；属性 commerce（captain.toml）；人物 nkosi。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_nkosi-settle「手心里的一捧高粱」：索法拉的码头石阶上，一捧新收的高粱放在手心，穗子沾着山里的尘，远处是晒着的棉布。

[[tracks]]
key = "request_nkosi"
name = "鞋上的尘"
kind = "request"
start = "offer"
auto = true
cast = ["nkosi"]

# 一、码头上的信使：他从山里下来，鞋上的尘比信上的印章更说得清走了多远。
[[tracks.chapters]]
key = "offer"
title = "比印章说得清"
text = "码头边的石阶上坐着个年轻人，鞋上的尘厚得能看出走过几座山。他见你过来，先拍掉裤腿上的土，才站起身。“我刚从山里下来，三天的路跑了两天。要捎话？说慢点，我记在脑子里。”他从怀里掏出一封信，印章已经磨得看不清了。葡萄牙人的远征队过去以后，村子里的粮被拿走了一大半，今年的种子也吃了。“要二十匹棉布，带回内陆去换粮。布在山里比金子好换。金子不能吃，布能换能吃的。”"
speaker = "nkosi"
mood = "tense"
at = "sofala"
when = [
  { kind = "date", from = [1574, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_sofala"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_baraka"
when = [{ kind = "flag", flag = "c13_main_baraka", value = true }]
text = "码头边的石阶上坐着个年轻人，鞋上的尘厚得能看出走过几座山。他抬头看了你一眼，说他记得你，远征那几年你在山里见过他跑。他从怀里掏出一封信，印章已经磨得看不清了。葡萄牙人的远征队过去以后，村子里的粮被拿走了一大半，今年的种子也吃了。“要二十匹棉布，带回内陆去换粮。布在山里比金子好换。金子不能吃，布能换能吃的。”"

[[tracks.chapters.choices]]
key = "accept"
text = "接下，二十匹棉布运到索法拉来。"
next = "deliver"
reply = "他把鞋脱下来，在石阶上磕了磕，尘落了一地：“这是从王廷到这里的路。”他把鞋穿回去，系带子系得很紧，“下一趟，我等你的布。路上别让人把布拿去换了金砂。”"
effects = [
  { kind = "affinity", person = "nkosi", value = 2 },
  { kind = "flag", flag = "c13_request_nkosi_accepted" },
]

[[tracks.chapters.choices]]
key = "ask_road"
text = "接下，先问：布怎么运进山里？"
next = "deliver"
reply = "“我背。”他说得很平，“一次背四匹，走五趟。我跑得快。”他说完，伸出五根手指比给你看，又收回一根。“第五趟，顺路回家看一眼。家里的粮缸不知道还剩多少。”"
effects = [
  { kind = "affinity", person = "nkosi", value = 2 },
  { kind = "flag", flag = "c13_request_nkosi_accepted" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "这趟布我不运，你另找船吧。"
next = "failed"
reply = "他点点头，把鞋穿上，转身往山里跑了。跑出码头的石阶，他回头看了一眼海，才拐进巷子。脚下没停，像是早料到你会这么说。"
effects = [{ kind = "flag", flag = "c13_request_nkosi_declined" }]

# 二、颜色最鲜的四匹：二十匹布卸在码头上，他挑出四匹，码头上有人来说价。
[[tracks.chapters]]
key = "deliver"
title = "颜色最鲜的四匹"
text = "二十匹棉布卸在索法拉的码头上，恩科西一匹一匹抖开看，日头底下晃得人眼花。他挑出颜色最鲜的四匹，“给村里的女人换种子用的。”他说，“捆结实点，路上不能蹭脏。”其余的他重新码好，手指在每一匹的边上停一下。码头上一个斯瓦希里商人凑过来，蹲在麻袋边上，说愿意用金砂换他手里的布，价钱比王廷的老价高出一截。恩科西没应声，只看着你。"
speaker = "captain"
mood = "tense"
at = "sofala"
when = [
  { kind = "date", from = [1574, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "nkosi", value = true },
]
objectives = [{ kind = "goods", good = "cloth", qty = 20, at = "sofala", text = "二十匹棉布" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "nkosi", value = -5 }, { kind = "flag", flag = "c13_request_nkosi_late" }, { kind = "letter", person = "nkosi", text = "（托人代笔）布没等到。村里拿金砂跟海边换了一回粮，换得不多。" }], news = "索法拉的码头上，穆塔帕的信使等了一季没等到布，把鞋上的尘磕了又磕，往山里去了。" }
news = "索法拉码头上，穆塔帕来的信使背着四匹棉布往山里跑，说是给村里换种子的。"

[[tracks.chapters.choices]]
key = "swahili"
text = "用斯瓦希里话告诉那商人：这批布是换粮的，不卖。"
next = "settle"
requires = [{ kind = "skill", skill = "lang_swahili", ge = 60 }]
hint = "那商人说得快，你只听懂一半，话到嘴边说不出一句完整的拒绝。"
reply = "商人听你说完，点点头走了。临走他说，山里要是缺盐，他那里有，价钱好商量。恩科西记下了，把那四匹布往肩上一甩，脚步比来时还快，嘴里念念有词，像是在背路上的村名。"
effects = [
  { kind = "cash", value = 2000 },
  { kind = "affinity", person = "nkosi", value = 5 },
]

[[tracks.chapters.choices]]
key = "let_him"
text = "让恩科西自己决定，你在旁边帮他看价。"
next = "settle"
check = { attr = "commerce", base = 35, per = 6 }
reply = "他想了很久，摇了摇头，把布捆好，背起四匹往山里跑了。你看着那四匹颜色最鲜的布，一路晃进了巷子。走前他回头冲你喊了一句：“下回带个会算数的人来，我们一起看价。”"
effects = [
  { kind = "cash", value = 2000 },
  { kind = "affinity", person = "nkosi", value = 3 },
]
fail = { next = "settle", effects = [{ kind = "cash", value = 1800 }, { kind = "affinity", person = "nkosi", value = -2 }], news = "索法拉的码头上，穆塔帕的信使一口气卖了两匹布，换了金砂，说给村里留点钱也好。" }

# 三、第一茬：两个月后，他从山里跑下来，手心里是一捧高粱。
[[tracks.chapters]]
key = "settle"
title = "第一茬"
text = "两个月后，恩科西从山里跑下来，鞋上的尘比上回还厚。他没先喝水，先把鞋脱下来倒了倒，倒出一小把红土。然后解开背上的小布包，里面是一捧新收的高粱，穗子沉甸甸的，颗粒还带着晒过的暖气。他把高粱放进你手心。“用你的布换的种子，种出来的第一茬。”他说，“村里的女人一人抓了一把，说今年的粥能稠一点了。她们还问，下一批布是什么颜色的。”"
speaker = "captain"
mood = "tender"
at = "sofala"
when = [
  { kind = "date", from = [1574, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "nkosi", value = true },
]
objectives = [{ kind = "wait", days = 60, text = "等两个月" }]
news = "索法拉的码头上，穆塔帕的信使从山里背下来一捧新收的高粱，说是布换来的种子种的。"

[[tracks.chapters.choices]]
key = "keep_grain"
text = "收下那捧高粱。"
next = "done"
reply = "他笑了，把报酬交给你——一半是金砂，一半是银子。“这条路我记熟了，下次跑得更快。”他说完，把空布包叠成一块，塞回腰里，转身时脚步轻快，像是没走过三天的山路。"
effects = [
  { kind = "cash", value = 1250 },
  { kind = "affinity", person = "nkosi", value = 8 },
  { kind = "fame", value = 2 },
  { kind = "memory", memory = "mem-request_nkosi-settle", title = "手心里的一捧高粱" },
  { kind = "flag", flag = "c13_request_nkosi_done" },
]

[[tracks.chapters.choices]]
key = "give_back"
text = "说：带回去当明年的种子吧。"
next = "done"
reply = "他想了想，把高粱包好揣回怀里：“那明年，我再背一捧来。”报酬他照付了，数得很慢，每数一个数就看一眼那个布包。数完他又补了一句：“明年的布，颜色要比今年的还鲜。”"
effects = [
  { kind = "cash", value = 1250 },
  { kind = "affinity", person = "nkosi", value = 8 },
  { kind = "fame", value = 2 },
  { kind = "flag", flag = "c13_request_nkosi_done" },
]
