text = "自己跟管事讲：布是苏丹买的，不是卖给岛民的。"
next = "audience"
reply = "你把布的来路从头讲了一遍，讲得很慢。管事听着，手指在罚单上敲了几下，把它折起来揣进怀里。临走时他回头看了一眼你的船，然后带着两个兵下了码头。"
