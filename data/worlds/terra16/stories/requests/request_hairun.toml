# 五、新布的科拉科拉：二十天后，桨手们穿着新布赛船。
[[tracks.chapters]]
key = "rowers"
title = "新布的科拉科拉"
text = "过了二十天，桨手们穿着新布做的纱笼，在港里赛科拉科拉船。一条船上一百支桨，入水的声音齐得像一个人。岸上的孩子跟着船跑，喊着名字。领头那条船的头人探出身来朝你招手，请你上去，坐到鼓手旁边。船头挂着一截新布，蓝底白花，风一吹就鼓起来，像一面小旗。头人在船上喊了一声，桨手们的号子从港口一直传到堡墙下。"
speaker = "captain"
mood = "cheerful"
at = "ternate_port"
objectives = [{ kind = "wait", days = 20, text = "等二十天，桨手们赛船" }]
when = [
  { kind = "date", from = [1558, 4, 1], to = [1569, 12, 31] },
  { kind = "alive", person = "hairun", value = true },
]
deadline_days = 120
timeout = { next = "done" }

