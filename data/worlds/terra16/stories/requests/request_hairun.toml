# 请托：桨手的工钱（request_hairun）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：海伦 hairun（1522-01-01 生，1570 年卒，男；特尔纳特的苏丹；势力 ternate；cast 在 cast/historical_03_indian_ocean.toml）。
# 类型：混合（mixed）；5 章：offer（报价）、deliver（海滩上的布）、factor（商馆的管事）、audience（王宫里的笑）、rowers（新布的科拉科拉）。终点 done / failed。
# 报价：L 来信／代理人（auto=true）。offer 章 at=ternate_port，出面的是苏丹的书记官（只写身份，不进 cast，正文不写名字，之后只在引语里出现）；family=c13_offer_ternate_port，冷却 20 天；deadline 为窗口止日 1568-12-31，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1558-03-01 至 1568-12-31；deliver、factor 1558-03-01 至 1569-06-30；audience 1558-03-01 至 1569-09-30；rowers 1558-04-01 至 1569-12-31。
# 依据·史实背景：特尔纳特的苏丹与葡萄牙堡的关系；丁香是葡萄牙人留在岛上的理由；商馆垄断丁香、赊账付岛民（叙事概括）；科拉科拉是马鲁古的大划船。
# 依据·原创：木牌、印花布的分法、桨手的工钱、丁香花形胸针、商馆的管事与两个兵、丁香香包、书记官的来信。木牌的制度与具体数目为原创。
# 依赖：港口 ternate_port（ports_southeast_asia.toml）；商品 calico（印花棉布，goods/05_terra_trade.toml，本轨道由它交货）；物品 clove_brooch（唯一奖励）、clove_sachet（人情，稀有度 1）；势力 ternate、portugal（声望）。B10b：无需改名。
# 主线门禁：offer 的 when 写 c13_main_kaicili = false（凯奇利的父亲，TERRA16 §12）。本文不写凯奇利、巴布拉，也不写任何主线事件。
# C7：无 C7 线；本文件不读也不设任何 c7_ 旗标。
# 读的旗标：c13_request_hairun_complained、c13_request_hairun_sultan_smiled、c13_request_hairun_public（audience 的三条 variant，只改正文，不改选项；三者互斥，v1 > v2 > v3 显示）。
# 设的旗标：c13_request_hairun_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_public（deliver 在海滩上当众量布）、_complained（factor 的检定失败，管事告状）、_hid（factor 夜里起锚）、_sultan_smiled（factor 请苏丹出面）、_done（audience 收下，终局）、_partial（audience 先付桨手，终局）、_rowers_paid（audience 先付桨手的分支旗标，与 partial 同设）、_rode（rowers 上船）、_late（超时，终局）。分支旗标有六面，超过文件布局里“至多三面”的建议，因为 brief 逐条列出，保留；集成时可酌情删去 _rowers_paid（与 _partial 重复）。
# 秘密：cast 无 secret。fate 里的 1570 年事件不写，正文不写任何预兆。
# 口头禅：“在特尔纳特，我对每条船都笑”，只在 audience 当面用一次（三条 variant 也各用一次，同一次只会看到其中一条）。
# 报酬：货款 2550（deliver 交货时另付，不计入工钱上限）；工钱 3650（audience 收下），或 1800（先付桨手，另一半说下一季再给）；丁香花形胸针（唯一奖励，audience 收下）；丁香香包（rowers 选看，人情）；好感最多 +18；名声 +5；特尔纳特声望 +3、葡萄牙声望 −1；回忆 mem-request_hairun-audience。
# 回忆插画 mem-request_hairun-audience：王宫回廊下，苏丹亲手把一枚丁香花形的银胸针别在船长的衣襟上，院子里晒着一筐筐干丁香，远处是海和堡墙的白。
# 与 brief 的出入：audience 的见闻不写“别了一枚胸针”（先付桨手的那条路上胸针并不给），改成两条路都说得通的版本；audience 与 rowers 的正文按字数下限加了细节，其余照 brief。

[[tracks]]
key = "request_hairun"
name = "桨手的工钱"
kind = "request"
start = "offer"
auto = true
cast = ["hairun"]

# 一、赊账的木牌：报价（来信，书记官出面）。
[[tracks.chapters]]
key = "offer"
title = "赊账的木牌"
text = "特尔纳特的王宫里，苏丹的书记官从袖子里摸出一把小木牌，一块一块摆在你面前的矮几上。木牌烧过，边上刻着商馆的印。“葡萄牙人付给科拉科拉桨手的工钱，就是这个。”书记官说，“桨手们拿着它，只能到商馆去换米和布。换一次，价就涨一截。”他把最后一块翻过来，背面是一道道划痕，每欠一个月，就添一道。苏丹不想再让桨手拿木牌了。他要十二匹古吉拉特的印花棉布，运到特尔纳特，每家分一段，堂堂正正地拿回去。"
mood = "tense"
at = "ternate_port"
when = [
  { kind = "date", from = [1558, 3, 1], to = [1568, 12, 31] },
  { kind = "age", ge = 17 },
  { kind = "flag", flag = "c13_main_kaicili", value = false },
]
deadline = [1568, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_ternate_port"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "take"
text = "接下：十二匹印花棉布，运到特尔纳特。"
next = "deliver"
reply = "书记官把一块木牌塞进你手里，木牌边上的烧痕还是新的，指腹一蹭就沾了灰。“留着看。”他说，“苏丹的话是，等布到了，这些木牌就当柴烧。”"
effects = [
  { kind = "affinity", person = "hairun", value = 2 },
  { kind = "flag", flag = "c13_request_hairun_accepted" },
]

[[tracks.chapters.choices]]
key = "ask_fort"
text = "接下，先问：堡里的人自己不会替桨手换钱？"
next = "deliver"
reply = "“会。”书记官把木牌一块块收回袖子里，手指在最后一块上停了停，“所以才找外人的船。堡里的人跟苏丹说话，苏丹总是笑着听，然后照自己的意思办。”"
effects = [
  { kind = "affinity", person = "hairun", value = 2 },
  { kind = "flag", flag = "c13_request_hairun_accepted" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "这一趟不接。商馆的账，我不想碰。"
next = "failed"
reply = "书记官没有劝，把木牌收回袖子里，客客气气地送你到门口。门外有个脚夫扛着一袋米经过，他侧身让了让，像没看见你。“船长改了主意，码头上还找得到我。”"
effects = [{ kind = "flag", flag = "c13_request_hairun_declined" }]

# 二、海滩上的布：交货。每个选项都交走十二匹印花棉布，选的是怎么分。
[[tracks.chapters]]
key = "deliver"
title = "海滩上的布"
text = "十二匹印花棉布卸在特尔纳特的海滩上，蓝底白花，一卷一卷堆成小山。桨手们的头人都来了，光着脚站在沙子里，手里攥着木牌。每匹布要裁成几段，谁家划过几趟桨，谁家有几张嘴，都得算进去。头人们吵起来，声音一阵比一阵高。书记官站在布堆旁边，看着你：“分布的事，船长插不插手？”"
news = "特尔纳特的海滩上，桨手们的家人分到了古吉拉特的印花布，堡墙上有人看了一下午。"
speaker = "captain"
mood = "cheerful"
at = "ternate_port"
objectives = [{ kind = "goods", good = "calico", qty = 12, at = "ternate_port", text = "把印花棉布（12）运到特尔纳特" }]
when = [
  { kind = "date", from = [1558, 3, 1], to = [1569, 6, 30] },
  { kind = "alive", person = "hairun", value = true },
]
deadline_days = 300
timeout = { next = "failed", effects = [{ kind = "affinity", person = "hairun", value = -3 }, { kind = "flag", flag = "c13_request_hairun_late" }, { kind = "letter", person = "hairun", text = "苏丹的书记官来信：布的事苏丹另想了办法。木牌还在烧，烧得慢一点。" }] }

[[tracks.chapters.choices]]
key = "to_clerk"
text = "把布交给书记官，让宫里分。"
next = "factor"
reply = "书记官拿着名册，一家一家念，念到天黑才分完。中间有个名字念错了，他停下来改，头人们也都等着，没有人嚷。每家领到布，都在名册上按了手印。"
effects = [
  { kind = "cash", value = 2550 },
  { kind = "affinity", person = "hairun", value = 3 },
]

[[tracks.chapters.choices]]
key = "on_beach"
text = "当着所有人的面，在海滩上展开布，一家一段地量。"
next = "factor"
reply = "你和头人们一起拉着量尺，量到最后一段，海滩上的女人们笑成一片。堡墙上有人一直往这边看，看到日头落下去。"
effects = [
  { kind = "cash", value = 2550 },
  { kind = "affinity", person = "hairun", value = 3 },
  { kind = "flag", flag = "c13_request_hairun_public" },
