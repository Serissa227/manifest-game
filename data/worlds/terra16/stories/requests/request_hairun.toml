# 四、王宫里的笑：苏丹当面见你。丁香花形的胸针摆在矮几上，收不收由你。
[[tracks.chapters]]
key = "audience"
title = "王宫里的笑"
text = "苏丹在王宫的回廊下见你，身上是白布长衣，手里转着一串念珠。院子里晒着干丁香，一筐一筐的，香味从廊下一直飘到门口。他满面笑容：“在特尔纳特，我对每条船都笑——对你，笑得真心一点。”他让人抬来工钱，一半是银子，一半按岛上的价折了丁香的钱，秤是他自己的。然后他从袖子里摸出一枚小胸针放在矮几上：丁香花苞的形状，银的，还带着打银匠的锤痕。"
news = "特尔纳特的王宫回廊上，苏丹笑着见了一个外来的船长，堡里的人第二天就知道了。"
speaker = "hairun"
mood = "cheerful"
at = "ternate_port"
when = [
  { kind = "date", from = [1558, 3, 1], to = [1569, 9, 30] },
  { kind = "alive", person = "hairun", value = true },
]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "hairun", value = -3 }, { kind = "flag", flag = "c13_request_hairun_late" }, { kind = "letter", person = "hairun", text = "海伦苏丹的书记官来信：苏丹等你进宫，等到丁香都收完了。工钱记在账上。" }] }

