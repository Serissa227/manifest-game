key = "ride"
text = "上船，坐在鼓手旁边。"
next = "done"
reply = "鼓点一起，一百支桨一齐落水。船身晃了一下，鼓手一把拉住你的胳膊。你的船员在岸上喊，桨手们回过头来冲你笑，有人把新布的一角扯起来挥。"
effects = [
  { kind = "affinity", person = "hairun", value = 2 },
  { kind = "flag", flag = "c13_request_hairun_rode" },
]

[[tracks.chapters.choices]]
key = "watch"
text = "留在岸上，给他们喊号子。"
next = "done"
reply = "你站在海滩上扯着嗓子喊，桨手们的号子一句接一句，喊到后来连你的船员也跟着喊。赛完，你的嗓子哑了，有个桨手跑过来，塞给你一个丁香香包，说是家里的人缝的。"
effects = [{ kind = "item", item = "clove_sachet", qty = 1 }]
