# 三、商馆的管事上门：三天后，葡萄牙商馆的管事找上你的船。
[[tracks.chapters]]
key = "factor"
title = "商馆的管事上门"
text = "第三天一早，葡萄牙商馆的管事带着两个兵上了你的船，靴子踩在甲板上，一步一响。“岛上的买卖只能经商馆。”他说，“外国船把布直接卸给岛民，坏了规矩。”他手里的罚单上写着一个数目，却不肯说是按哪一条算的。王宫那边派人来传话：苏丹说，这事让他来。传话的小子站在码头上，眼睛一直往堡墙的方向看。"
news = "特尔纳特的葡萄牙商馆管事带着两个兵找上一条外国船，说它坏了商馆的规矩。"
speaker = "captain"
mood = "tense"
at = "ternate_port"
objectives = [{ kind = "wait", days = 3, text = "等三天，商馆那边有动静" }]
