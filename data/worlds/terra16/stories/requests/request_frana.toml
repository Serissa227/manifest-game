# 伊斯坦布尔：通译收下了抄本，要一个人作证。
[[tracks.chapters]]
key = "istanbul"
title = "还得有一个人作证"
text = "伊斯坦布尔，帝国议会的一位通译把抄本摊在桌上，一页一页读，读得很慢。他的指尖沾着墨，洗也洗不净。他说抄本没错，拉古萨的印，拉古萨的字，都对。“可议会要照它办事，还得有一个人作证：拉古萨这些年，真的没帮过威尼斯。”芙拉娜接过话头，给他留了个体面：“纸不会自己说话，通译先生要人作证，也是应该的。”然后她说，有这么一个人。希俄斯有个热那亚人留下的老公证人，替马奥纳记了三十年的账，什么船进过希俄斯，他都记得。"
at = "istanbul"
speaker = "captain"
mood = "tense"
news = "伊斯坦布尔帝国议会的一个通译，收下了拉古萨送来的一份旧约抄本，说要找证人。"
when = [{ kind = "date", from = [1570, 3, 1], to = [1573, 9, 30] }, { kind = "alive", person = "frana", value = true }]

[[tracks.chapters.choices]]
key = "go_chios"
text = "答应去希俄斯接他。"
next = "chios"
effects = [{ kind = "affinity", person = "frana", value = 3 }]
reply = "通译说三个月内带人来，议会就听。芙拉娜替他补了一句：“三个月不到，是我的错，不是拉古萨的。”"

[[tracks.chapters.choices]]
key = "letter_only"
text = "提议请老公证人写一份证词，不必本人来。"
next = "chios_paper"
check = { attr = "eloquence", base = 5, per = 8 }
effects = [{ kind = "affinity", person = "frana", value = 3 }, { kind = "flag", flag = "c13_request_frana_paper" }]
fail = { next = "chios", news = "伊斯坦布尔的通译说，议会不收没有本人的证词，拉古萨的人还得再跑一趟海路。" }
reply = "通译想了想，说证词也行，只要公证人的印在上面。芙拉娜看了你一眼，说你这样省了他一趟海路。"

# 希俄斯：老公证人的小屋，账册堆到房梁。他不想去伊斯坦布尔，也不想留在奥斯曼人的岛上。
[[tracks.chapters]]
key = "chios"
title = "三箱账册"
text = "希俄斯港口后面有一间小屋，屋里的账册从地上一直堆到房梁。老公证人坐在中间，镜腿用细线缠了又缠。他一开口就报出一条船的名字：几时来，装什么，往哪里去。“拉古萨的船，我都记着。”他说，又摆摆手，“伊斯坦布尔我不去，我老了，经不起颠。通译说议会只认当面的人，我听说过。这岛从热那亚人手里换到了奥斯曼人手里，我也不想留下。”芙拉娜放软了声音：“您要是不想走，就当是去拉古萨看看老朋友。”门外有人在催屋租，催了三回，他都装没听见。"
