# 拉古萨码头：老公证人下船，芙拉娜替他把账册搬上岸。报告里的名字由你定。
[[tracks.chapters]]
key = "back"
title = "名字要不要写进去"
text = "拉古萨的码头上，芙拉娜亲自来接老公证人，替他把三箱账册一只一只搬下船。她伸手摸过每只箱角，像在数人头。伊斯坦布尔那边回了话：拉古萨的船照旧通行。她把报酬交到你手里，手指在钱袋口停了一下。“议会要我写一份报告。”她说，“你的名字要不要写进去，你想清楚再说。不写，也没有人会怪你；写了，报告是我写的，怪不到你头上。”"
at = "ragusa_port"
speaker = "captain"
mood = "tender"
news = "拉古萨的女使者从伊斯坦布尔回来了，码头上多了一个带着三箱账册的老人。"
