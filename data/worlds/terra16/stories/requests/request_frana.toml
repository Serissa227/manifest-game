# C13d 请托：中立的抄本（故事 2.0，A5 / E37 契约；按 2026-10-12 的 C13d 总决定与任务单分片写，中文优先，不写英文覆盖）
# 人物：芙拉娜·卢基奇 frana（1534-12-02 生，cast 在 cast/story_europe.toml；拉古萨共和国的女使者，日程在 ragusa_port 的酒馆）。
# 类型与报价：押运／去某处／说服混合（mixed），5 章（offer / corfu / istanbul / chios 与 chios_paper / back）。kind=request，auto=false（T 当面）：人物按日程在 ragusa_port，玩家用“问请托”（ask:request_frana）启动；offer 章不写 at，目标是在港里找到她。
# 窗口：报价 1570-03-01 至 1573-03-31，offer 的 deadline 即止日，到期走 timeout（next=failed，不写见闻）。之后各章的窗口写成 when 里的 date 条件（1570-03-01 至 1573-09-30）。corfu 进入后 60 天、chios 与 chios_paper 进入后 90 天到期，走 timeout。
# 依据：史实背景——1570—73 年塞浦路斯战争，拉古萨向苏丹纳贡、保持中立（报价写在 1570 年春，正文只说“眼看要动刀兵”）；1566 年希俄斯由奥斯曼接管，此前是热那亚人的马奥纳公司所管，公证人替马奥纳记账；拉古萨同威尼斯与奥斯曼都有往来。1571 年勒班陀只作背景，不写。
#   原创——旧约抄本缝在斗篷衬里，科孚的威尼斯“朋友”，伊斯坦布尔帝国议会的通译，希俄斯的老公证人（叙事人物，不入 cast，正文不起名字），三箱账册与铜印。
# 读写的旗标：设 c13_request_frana_accepted（接下，分支）/ _paper（证词路线，分支）/ _declined / _late / _done（终局，每条只设一面）。不读任何 c7_* 或 c13_main_* 旗标；没有主线门禁，没有变体。
# 依赖：地点 corfu、istanbul、chios、ragusa_port 都是现有地点，无 B10b 改名。reputation 效果的势力 ragusa（factions/03_italy）、ottoman（factions/05_ottoman_persia）都已存在。
# 路线：chios 与 chios_paper 按 next 分开，不用 requires 区分——只有伊斯坦布尔的证词检定成功才进 chios_paper，其余都进 chios。
# 缺省走向：不接，拉古萨的女使者另找船（declined，failed）。接了但 60 天内没到科孚，抄本被人看了一眼，她从别的船去了伊斯坦布尔（late，failed）。到了希俄斯却在 90 天内没把人接上，老人去年冬天走了（late，failed）。其余走到拉古萨（done）。
# 回忆插画清单：
#   mem-request_frana-back「码头上的三箱账册」：拉古萨码头的傍晚，三只木箱排成一行，老公证人站在箱边，芙拉娜伸手摸着箱角。

[[tracks]]
key = "request_frana"
name = "中立的抄本"
kind = "request"
start = "offer"
auto = false
cast = ["frana"]

# 报价：拉古萨的酒馆。斗篷衬里里缝着一卷纸，她要把它送去伊斯坦布尔。
[[tracks.chapters]]
key = "offer"
title = "缝在衬里的抄本"
text = "芙拉娜从斗篷的衬里里抽出一卷纸，纸边被缝线勒出一道折。那是拉古萨向苏丹纳贡的旧约抄本，每一页的角上都盖着共和国的印。塞浦路斯那边眼看要动刀兵，威尼斯人想看它，奥斯曼人也想看它，路过的每个港口都有人想先摸一摸。“远道而来的阁下，拉古萨不胜荣幸。……好了，客套话说完了。你要什么？我们好谈价钱。”她把纸按回衬里，“我要送它去伊斯坦布尔。到了那边，要找一个肯收它、又肯照它办事的人。你要是觉得这活重，今晚就当没见过我。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "frana", text = "在港里找到她" }]
deadline = [1573, 3, 31]
when = [{ kind = "date", from = [1570, 3, 1], to = [1573, 3, 31] }, { kind = "age", ge = 17 }]

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.choices]]
key = "accept"
text = "答应送她去伊斯坦布尔。"
next = "corfu"
effects = [{ kind = "affinity", person = "frana", value = 2 }, { kind = "flag", flag = "c13_request_frana_accepted" }]
reply = "她先替你想好了退路：“路上要是有人逼你，就说你不知道我带了什么。这是实话，我一样也不会告诉你。”"

[[tracks.chapters.choices]]
key = "ask_text"
text = "问她：抄本上写的，真能让两边都不动拉古萨？"
next = "corfu"
effects = [{ kind = "affinity", person = "frana", value = 2 }, { kind = "flag", flag = "c13_request_frana_accepted" }]
reply = "“不能。”她笑了，用指甲在纸角的印上刮了刮，“可它能让两边都找不到动手的理由。”"

[[tracks.chapters.choices]]
key = "decline"
text = "两国打仗，你不走这条路。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_frana_declined" }]
reply = "她点点头，没有劝。替你把理由说完了，说得比你自己还周全，说完把那卷纸又往衬里里按了按。"

# 科孚：威尼斯的“朋友”请吃饭。他不想知道箱子里是什么，只想知道是哪一页。
[[tracks.chapters]]
key = "corfu"
title = "只想知道是哪一页"
text = "科孚的码头上，威尼斯的那位“朋友”早等在一间酒馆里。白酒是岛上自己酿的，煮章鱼一盘接一盘，炭烤的沙丁鱼连骨头都是脆的。芙拉娜先举杯：“您的酒是科孚最好的。今晚的账记在拉古萨头上，您要是只想吃顿饭，就只吃顿饭。”他笑着干了杯，眼睛却一直落在她的斗篷上。吃到一半，他把杯子放下：“我不想知道您带着什么。我只想知道是哪一页。”"
at = "corfu"
speaker = "captain"
mood = "tense"
news = "科孚的码头上，一个威尼斯人请拉古萨来的女使者吃饭，饭没吃完，她的船就开了。"
when = [{ kind = "date", from = [1570, 3, 1], to = [1573, 9, 30] }, { kind = "alive", person = "frana", value = true }]
deadline_days = 60

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "letter", person = "frana", text = "我从别的船去了伊斯坦布尔，抄本在科孚被人看了一眼。不要紧，看一眼的人，最难开口。" }, { kind = "affinity", person = "frana", value = -3 }, { kind = "flag", flag = "c13_request_frana_late" }]

[[tracks.chapters.choices]]
key = "excuse"
text = "说船要赶潮，先告辞。"
next = "istanbul"
check = { attr = "eloquence", base = 20, per = 7 }
