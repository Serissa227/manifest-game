text = "老公证人看完了证词稿，把抽屉拉开，取出一方铜印。印面刻的是马奥纳的旧徽，他用拇指摸了摸，又放回去。“马奥纳的人走了，这方印我替他们盖了三十年。”芙拉娜把稿子摊在他面前，逐条指给他看：哪一年，哪一条船，往哪里去。他一条一条点头，点到第三条停下来。“这船进港那天，我不在。”芙拉娜没有催，只把笔递过去：“那就写您在的那一天。”"
