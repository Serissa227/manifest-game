# 二、听不懂的船主：船舱里，船主装作看不懂马来文；桌上的货单有他自己的批注。
[[tracks.chapters]]
key = "persuade"
title = "听不懂的船主"
text = "唐人船的船主坐在舱里喝茶，舱门敞着，码头上的湿热一阵阵往里灌。他见你拿着合约进来，笑着把茶碗推过来：“马来字？我不识。合约是我的通事签的，通事回漳州了。”奈·加玛站在舷梯下没有上来，只隔着舱门说了一句：“他要是还说听不懂，就念第三条。”船主的桌上压着一张马来文的货单，纸角上有他自己用墨笔写的批注，字迹比他嘴上说的熟得多。"
speaker = "captain"
mood = "tense"
at = "banten_port"
objectives = [{ kind = "at", at = "banten_port", text = "到万丹港去" }]
when = [
  { kind = "date", from = [1573, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "nyai_gama", value = true },
]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "nyai_gama", value = -3 }, { kind = "flag", flag = "c13_request_nyai_gama_late" }, { kind = "letter", person = "nyai_gama", text = "那条船走了，没赔。我把它写进了“不要”那一栏。——奈·加玛" }] }

[[tracks.chapters.choices]]
key = "read_malay"
text = "当着他的面，把合约和货单并排念一遍。"
next = "result"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_malay", ge = 60, hard = true }]
hint = "那几行爪夷字你认不全，念不下去。"
reply = "你把合约念完，又把货单上他的批注念了一遍，一个字都没念错。船主手里的茶碗停在半空，半天才放下。“那就照合约。”他说，声音低了下去。"
news = "万丹港口的酒馆里有人说，一条漳州来的唐人船主被人当面念了一遍马来文的合约，念到他自己的批注，茶就凉了。"
effects = [{ kind = "affinity", person = "nyai_gama", value = 3 }]

[[tracks.chapters.choices]]
key = "in_chinese"
text = "用闽南话把赔法讲给他听，讲到他没法再装听不懂。"
next = "result"
requires = [{ kind = "skill", skill = "lang_chinese", ge = 60 }]
hint = "你的官话他听得懂，可他偏说只懂乡音。"
reply = "你用他家乡的话把赔法讲了一遍，讲到第三条，他把手按在了桌上。他听完叹了口气，说你们这些人都学会了，生意难做。他认了赔。"
news = "万丹的脚夫们说，有个外乡人用漳州话把合约的赔法讲给一条唐人船的船主听，讲到他没法装听不懂，他认了赔。"
