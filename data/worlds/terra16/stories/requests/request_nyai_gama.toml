# 请托：合约上的字（request_nyai_gama）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：奈·加玛（nyai_gama，1540-03-20 生，女），万丹一户胡椒商家的女儿，账本一条一条写在纸上；cast 在 cast/classmates_giri.toml。
# 类型：说服（persuade）。三章：offer（报价）、persuade（船舱里）、result（下一栏）；另有 result_partial（只赔一半）。终点 done / failed。
#   结构说明：persuade 的 argue 检定失败分支转入 result_partial，由它自己的两个选项结账（现金 500）；不用 variant 改现金，因为 variant 只能改文字。
# 报价：T 当面（auto=false）。人物按日程就在万丹港，玩家用 ask:request_nyai_gama 启动；offer 章不写 at，objectives 为找到她；
#   deadline 为窗口止日 1590-06-30，timeout 直接 failed，不写见闻（没人知道这件事没成）。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1573-01-01..1590-06-30；persuade 进入后 60 天期限，超时给一封信；
#   result 与 result_partial 1573-01-01..1590-12-31。
# 依据·史实背景：万丹的胡椒贸易；福建、广东的唐人船每年来装胡椒；合约用马来文（爪夷字）写，船主多半找通事读。港口 banten_port。
# 依据·原创：奈·加玛、她的胡椒栈与账本、那条漳州来的船、船舱里那张马来文的货单与墨笔批注。违约的船主是叙事人物（不进 cast，正文不写姓）。
# 依赖：港口 banten_port（ports_southeast_asia.toml）；技能 lang_malay、lang_chinese（skills.toml）；人物日程 key 随 B10b 从 banten 改为 banten_port。
#   主线门禁：无（奈·加玛不是主线人物，不写 c13_main_ 旗标）。
# C7：违约的船主不是黄寿官，正文不写黄寿官（他的请托是赶大帆船的生丝）。不写买船信（秘密）。本文件只读 bond_nyai_gama，不设任何 c7_ 旗标。
# 读的旗标：无 c7_ 旗标；bond nyai_gama 至少 C 只决定 offer 的 v1_bond_c 变体（只改开场）。
# 设的旗标：c13_request_nyai_gama_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_small（argue 检定失败，只赔小的那个数，只设不读）、
#   _late（超时，终局）、_done（终局）、_partial（result_partial 的终局）。
# 秘密：课本里夹着一封没寄出的买船信。正文不写，见闻不写。
# 口头禅：“下回哪天到港，先说清。”只在 result 章由她说出一次。
# 报酬：现金最多 900（只赔一半 500）；好感最多 +13；名声 +1；回忆 mem-request_nyai_gama-result（只给 result 与 result_partial 两条终局）。
# 回忆插画 mem-request_nyai_gama-result：胡椒栈的木匣开着，合约背面写着“已赔讫”，下面一行是明年到港的日子，窗外是万丹港的桅杆。

[[tracks]]
key = "request_nyai_gama"
name = "合约上的字"
kind = "request"
start = "offer"
auto = false
cast = ["nyai_gama"]

# 一、晚了两个月：奈·加玛在胡椒袋上摊开合约，托你去找船主。
[[tracks.chapters]]
key = "offer"
title = "晚了两个月"
text = "奈·加玛把一张合约摊在胡椒袋上，马来文的字一行一行写得很密。哪天到港装货，晚一天怎么赔，她的指甲在那一行底下划了一道。一条漳州来的唐人船晚了两个月，栈里的胡椒受了潮，发了霉。船主却说合约上没写赔，他不识马来字，签字的通事早就回了漳州。她没吵，也没恼，只说：“字是怎么写的，就怎么赔。”她托你去找那位船主。“我说，他就说听不懂。你去说。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "nyai_gama", text = "在万丹找到她" }]
when = [
  { kind = "date", from = [1573, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "nyai_gama", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_bond_c"
when = [{ kind = "bond", person = "nyai_gama", level = "C" }]
text = "奈·加玛站在胡椒栈的门口，先问你：“下一船哪天到港，你算过没有？”你答了，她才把那张合约从胡椒袋上拿起来。合约摊开，马来文的字一行一行写得很密。一条漳州来的唐人船晚了两个月，栈里的胡椒受了潮，船主却说合约上没写赔，签字的通事早就回了漳州。“字是怎么写的，就怎么赔。”她说，“你去跟他说。我说，他就说听不懂。”"

