[[tracks.chapters.choices]]
key = "argue"
text = "跟他说：万丹的胡椒栈不止一家，记得违约的，会是每一家。"
next = "result"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "他想了很久，说明年还想来装胡椒，赔就赔吧。"
news = "万丹的胡椒栈里传开了：一条唐人船的船主想着明年还要装胡椒，松了口，认了赔。"
