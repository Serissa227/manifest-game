text = "我晚到了十几天。福州城里一家染坊，后屋晾着一排排靛蓝的布，从梁上垂到地面，换过一茬了。一个手指染得发蓝的老人站在门口，手里的布角拧成了绳。他先看那只樟木箱，再看我，一句也没问路上的事。他用蓝手指敲了敲箱盖，侧耳听了听。“一箱子纸，”他说，“沉得很实。”他递过来一根搅染缸的木棍，棍头削扁了。“我替人收着东西，总想知道收的是什么。劳你当着我的面，撬开一角，让我看一页。一页就够了。”"

