reply = "你照信念，不添一个字。信比弥七说的短，“那年走得急”那几句，信上没有。念到“别等了，把船卖了”，老妇人点头：“早卖了。”念完她没让你走，叫孙子把信压到灶台的盐罐底下，招手要你凑近，说了一句话，要你带回平户，带给写信的人。"
effects = [{ kind = "affinity", person = "yashichi", value = 3 }, { kind = "flag", flag = "c13_request_yashichi_read" }]

[[tracks.chapters.choices]]
key = "leave_it"
text = "信交给孙子去认，你不多嘴。"
check = { attr = "eloquence", base = 35, per = 6 }
next = "reply_partial"
reply = "你把信还给孩子，只指了指最难认的两个字，让他别急。孙子认了一下午，认出了大半。弥七那几句话你没说出口，一直揣到天黑。走到河边回头看，孩子还蹲在乌桕底下念，老妇人坐在他旁边，网一眼也没补。"
news = "宁波灵桥门外，一户人家收到平户来的信，半大的孙子蹲在乌桕底下，捧着信认了一整个下午。"
