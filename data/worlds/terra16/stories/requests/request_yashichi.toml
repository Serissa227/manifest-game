# 三甲、别写，当面说：带着老妇人的一句话回平户。
[[tracks.chapters]]
key = "reply"
title = "别写，当面说"
text = "回到平户，船还没靠稳，弥七已经站在码头上了。他照着招呼生人的老规矩开口：“外人？船主不在。要传话，跟我说；要做买卖，明天再来。”说完自己先摇了摇头。船队散了这些年，这句话他还没改过口。他没问信送到没有，先问那家人：老太太身子怎样，孙子长多高了，门口那棵乌桕还在不在。你一样一样答了，想起老妇人托的那句话。你怕记岔，在宁波就把它写在了账本的末页，这会儿伸手去翻。弥七摆了摆手。“别写，当面说。”"
speaker = "captain"
mood = "tender"
at = "hirado"
when = [{ kind = "alive", person = "yashichi", value = true }, { kind = "date", from = [1562, 1, 1], to = [1590, 12, 31] }]
objectives = [{ kind = "person", person = "yashichi", text = "回平户找到他" }]
news = "平户的码头上，弥七等来一个从宁波回来的船长，只听了一句“送到了”，付了钱就回栈房去了。"

[[tracks.chapters.choices]]
key = "tell_him"
text = "合上账本，把老妇人的话说给他听。"
next = "done"
reply = "你学着老妇人的口气说：“谢谢你替他写。”弥七听完，背过身去看海，看了很久。回过头来，他把一只钱袋塞进你手里，右手又按回左边的袖口上，像那封信还揣在里头。“头一回，”他说，“觉得纸也有点用。”"
news = "平户码头上，汪直船队里的老通事听一个船长说完宁波的事，背过身看了很久的海。"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "yashichi", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_yashichi_done" }, { kind = "memory", memory = "mem-request_yashichi-reply", title = "背过身去看海的通事" }]

[[tracks.chapters.choices]]
key = "just_done"
text = "不提那句话，只说：送到了。"
next = "done"
reply = "他点点头，付了钱，没再问，转身回了栈房。账本还摊在你手上，末页那一行，他一眼也没看。"
effects = [{ kind = "cash", value = 600 }, { kind = "affinity", person = "yashichi", value = 4 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_yashichi_partial" }]

# 三乙、圈起来的字：信留给了孙子，没有带回的话。
