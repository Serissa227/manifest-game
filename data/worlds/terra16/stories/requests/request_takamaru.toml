effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "takamaru", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_takamaru_done" }, { kind = "memory", memory = "mem-request_takamaru-arrive", title = "码头上背着人的鹰丸" }]

