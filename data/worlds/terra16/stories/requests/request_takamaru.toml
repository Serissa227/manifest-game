# 三、不问哪条船：备后外海的小早只问一句；能岛码头上，他把腿伤的那个背起来。
[[tracks.chapters]]
key = "arrive"
title = "不问哪条船"
text = "船过备后外海，一条小早从岛影里斜插过来，帆上是一字三星。船头的人隔着水喊：船上是什么人？四个水夫缩在舱底，一声不吭。我答是在堺雇的伤病水手，回西边养伤。那人往舱口看了一眼，没再问，掉头走了。到能岛那天是个阴天。鹰丸站在码头最外头，船还没靠稳就跳了上来，一个一个把人扶下跳板，扶一个，数一个：“一。二。三。”数到腿伤的那个，他捏了捏那人的胳膊：“瘦了。堺的鱼贩没给你们鱼吃？”说着转过身蹲下，把人背到了背上。那条船的事，他一个字也没问。"
at = "noshima"
speaker = "captain"
mood = "tender"
news = "能岛的码头上，四个从堺回来的水夫被人扶下了船。鹰丸背着腿上带伤的那个，一路背上了石阶。"
objectives = [{ kind = "at", at = "noshima", text = "把人送到能岛" }, { kind = "person", person = "takamaru", text = "在码头上找到鹰丸" }]
when = [{ kind = "alive", person = "takamaru", value = true }]

[[tracks.chapters.variants]]
key = "delay"
when = [{ kind = "flag", flag = "c13_request_takamaru_delay" }]
text = "船过备后外海，一条小早从岛影里斜插过来，帆上是一字三星。船头的人隔着水喊：船上是什么人？四个水夫缩在舱底，一声不吭。我答是在堺雇的伤病水手，回西边养伤。那人往舱口看了一眼，没再问，掉头走了。到能岛那天是个阴天。鹰丸站在码头最外头，船还没靠稳就跳了上来，一个一个把人扶下跳板，扶一个，数一个：“一。二。三。”数到腿伤的那个，他停住了。那人在堺的番所多关了一夜，回来时一条腿肿得发亮，布换过两回，还是黑的。鹰丸看了一眼，什么也没说，转过身蹲下，把人背到了背上。那条船的事，他一个字也没问。"

