next = "failed"
effects = [{ kind = "flag", flag = "c13_request_kiyohara_ito_late" }, { kind = "affinity", person = "kiyohara_ito", value = -3 }]
news = "长崎教会后门那条窄巷，老神父隔几天就出来朝码头望一望，说有只从堺来的箱子，到了日子还没进门。"

[[tracks.chapters.choices]]
key = "hand_short"
text = "把剩下的交给神父，收条带回堺。"
next = "done"
effects = [{ kind = "cash", value = 1300 }, { kind = "affinity", person = "kiyohara_ito", value = 4 }, { kind = "flag", flag = "c13_request_kiyohara_ito_partial" }]
reply = "神父写的收条是日文，字很笨，末尾多了一行小字：“缺一册。”神父提着笔想了一会儿，没有划掉。回到堺，我把收条压在小旅店的柜台底下，托店家收着。店家说，来取的那位客人在店门口把收条看了两遍，折起来，站了好一会儿才走。"

[[tracks.chapters.choices]]
key = "copy"
text = "请神父把少的那本重抄一份，一起捎回大坂。"
