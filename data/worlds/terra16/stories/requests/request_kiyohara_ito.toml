reply = "神父说照着抄要一个月。我在长崎等了一个月，抄本到手，比原先那册厚，字写得大，行距也宽，像是怕念的人眼睛不好。封面上，他照样题了“和剂局方”四个字。我把它和收条包在一起带回了堺，托店家转交。店家说，取走的那位客人把抄本贴着胸口揣好，才系上头巾出门。"
