text = "两个月后，宁波码头的缆桩边，那个湖广年轻人已经等着，脚边一只空竹篮。耿家的老仆从北边坐船来，背有点驼，怀里抱着两个油布包，大的一个比去信厚出一指。“老爷说，信是你带去的，回信也得经你的手。”他把大包塞给你，小包叠在上头，“这是原信。封口是重新糊的，老爷看出来了，没说什么。洇的那几行，他叫人抄了留底，原件退回。”他转身上船，走了几步又站住：“老爷写完这封，一夜没睡。”"

[[tracks.chapters.choices]]
key = "sealed"
text = "原封交给年轻人"
next = "done"
reply = "年轻人双手接过去，洇了一角的原信在上，封蜡没动过的那封压在下面，一起抱在胸前。他蹲下身，从竹篮夹层里摸出一个蓝布包，塞进你手里：“先生交代，回信一到，这个就是你的，不用等他开口。”走出十几步，他回头喊了一声：“先生看了准高兴——他高兴起来，骂得更凶！”"
news = "宁波码头上，一个湖广来的年轻人收了从京里来的厚信，封蜡一点没动，听说是一封骂人的回信。"
effects = [
  { kind = "cash", value = 1600 },
  { kind = "affinity", person = "li_zhi", value = 8 },
  { kind = "item", item = "chuanxilu_ganzhou", qty = 1 },
  { kind = "fame", value = 3 },
  { kind = "memory", memory = "mem-request_li_zhi-reply", title = "两封互骂的信" },
  { kind = "letter", person = "li_zhi", text = "骂得好！比他做官的文章好看。他嘴上说“弟不敢辩”，一辩就是整整三页，我数过。去的信、回的信，你一个字都没动，麻城的读书人里找不出第二个。竹篮里那部书是赣州刻的，我年轻时读烂了，里头有一句我至今不骂：“知而不行，只是未知。”——卓吾" },
  { kind = "flag", flag = "c13_request_li_zhi_done" },
]

[[tracks.chapters.choices]]
key = "open"
text = "先拆开看看骂得有多难听"
next = "done"
reply = "你拇指一抵，封蜡裂开。第一页头一行就是：“……兄骂我假，弟不敢辩。”后面三页，字又密又齐，一笔不错。你把信合上，把裂开的蜡按回去。年轻人盯着那道缝，没说话，接信的手比刚才抱得更紧，还是从竹篮里把蓝布包拿出来给了你。"
news = "宁波码头上，一封京里来的厚信封蜡裂了一道缝，湖广口音的年轻人盯着缝看了半天，什么也没说。"
effects = [
  { kind = "cash", value = 1200 },
  { kind = "affinity", person = "li_zhi", value = 4 },
  { kind = "item", item = "chuanxilu_ganzhou", qty = 1 },
  { kind = "fame", value = 3 },
  { kind = "letter", person = "li_zhi", text = "封口是你拆的吧？蜡上有道指甲印，耿家的人封信，从不留印。拆了也好，省得我一个人生气。书照给，赣州的旧刻，我读过太多遍，该换人读了。——卓吾" },
  { kind = "flag", flag = "c13_request_li_zhi_partial" },
]

[[tracks.chapters.choices]]
key = "hide"
text = "劝年轻人先别给先生看，免得他气坏身子"
next = "done"
