[[tracks.chapters.choices]]
key = "watch"
text = "不出声，看他自己低头找那只鞠。"
next = "done"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "kikuchiyo", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_kikuchiyo_done" }, { kind = "memory", memory = "mem-request_kikuchiyo-arrive", title = "鞠庭上的开场" }]
reply = "过了好一会儿，他自己低下头，用脚尖把鞠挑了起来。鞠一离地，他的话就接上了，说完最后一句，正好起脚。“呀”“阿利”“噢”，他喊的是鞠里三位鞠精的名字，鞠在他脚上颠了一百多下没落地。散场后他来谢我，付了船钱，说：“下、下回你来看我当师范。”"

[[tracks.chapters.choices]]
key = "cheer"
text = "他卡住的时候，在廊下轻轻咳一声，提醒他看鞠。"
next = "done"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "kikuchiyo", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_kikuchiyo_done" }, { kind = "memory", memory = "mem-request_kikuchiyo-arrive", title = "鞠庭上的开场" }]
reply = "他听见我的咳声，低头看了一眼右脚边的鞠，离脚尖正好一拳。后面的话，他说得一点没卡。起了脚，那只鞠在四棵树中间上下翻飞，一百多下没沾沙，廊下叫好的声音一阵高过一阵。散场以后，他抱着鞠找到我，船钱一文不少，说那一声咳嗽，比十遍还管用。"

