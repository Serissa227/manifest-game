news = "府内一位重臣家的鞠庭上，京都来的鞠道先生当场说不出话，是同来的船长站起来替他圆了场。"
reply = "廊下的人都回头看我。老家主笑了，摆摆手，叫他先踢。鞠千代起了脚，鞠一百多下没落地，叫好声一阵接一阵。可该他开口说的那几句，到散场也没说出来，管事因此把谢礼扣下了一份。他把剩下的都拿来付了船钱，钱袋倒过来抖了抖。“下、下回，”他说，“我、我自己说完。”"

[[tracks.chapters.variants]]
key = "v1_tenth"
when = [{ kind = "flag", flag = "c13_request_kikuchiyo_tenth" }]
text = "府内那位重臣家的鞠庭，四角种着樱、柳、枫、松，中间一片新筛过的白沙。一院子的武士坐在廊下，腰刀解下来横在膝前，廊柱边坐着须发花白的老家主。鞠千代站在沙地正中，鞠放在右脚边。他开口了。船上练过十遍的那段话，从头到尾一个字没卡，老家主点了点头。说完，老家主忽然问了一句纸上没有的话：“京都的鞠，跟我们府内踢的，有什么不一样？”鞠千代张着嘴，看着廊下那一排人，一个字也没出来。"

[[tracks.chapters.variants]]
key = "v2_stuck"
when = [{ kind = "flag", flag = "c13_request_kikuchiyo_stuck" }]
text = "跳板上卡住那一回以后，鞠千代一路没再说话，那张纸攥在手里，攥成了一团。府内那位重臣家的鞠庭，四角种着樱、柳、枫、松，中间一片新筛过的白沙。一院子的武士坐在廊下，腰刀解下来横在膝前，来接他的年轻武士也在里头。他站在沙地正中，鞠放在右脚边。他开口了。头一句就卡住，“诸、诸、诸位”，廊下有人低头笑出了声。他张着嘴，眼睛看着廊下那一排人，一点声音也没有了。"

# arrive_ball · 府内：鞠庭（问过鞠的那一路）
[[tracks.chapters]]
key = "arrive_ball"
title = "鞠庭"
text = "府内那位重臣家的鞠庭，四角种着樱、柳、枫、松，中间一片新筛过的白沙。一院子的武士坐在廊下，腰刀解下来横在膝前。鞠千代站在沙地正中，先把鞠摆到右脚边，拿拳头量了一回，廊下有人看不懂，交头接耳。他开口了。头两句说得很稳，第三句说到一半，廊下有人挪了挪膝前的刀，刀鞘磕得一响，他抬了一下眼，看见那一排人，卡住了。他张着嘴，好一会儿出不来声。"
speaker = "captain"
mood = "cheerful"
at = "funai"
news = "府内一位重臣家的鞠庭上，京都来的鞠道先生先拿拳头量了鞠，再把鞠颠了一百多下没落地。"
objectives = [{ kind = "at", at = "funai", text = "在府内" }]
