# 请托：开场的十遍（request_kikuchiyo）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude（Opus）执笔。仅中文。
# 人物：鞠千代 kikuchiyo（1541-04-10 生，男），飞鸟井家的庶子，鞠庭上的神童。cast 见 cast/classmates_kyoto.toml。
#       同来的小厮、府内那位重臣家的老武士、来接人的年轻武士、廊下的武士们都是叙事人物，不起名、不建 cast。
# 类型：押运／带人（escort）。报价：到访（V），auto=true，报价港堺（sakai），family=c13_offer_sakai，冷却 20 天。
# 窗口：offer 1576-01-01 至 1586-06-30（when 与 deadline；与冷泉雪 1564—1575 的府内请托错开，且在 1586 年末府内被焚以前）。
#       passage 期限 60 天（同一海区）；arrive 与 arrive_ball 是普通章，不设期限。passage 起的各章 when 写 alive 与日期止于 1587-08-24。
# 章节：offer 抱鞠的公家人（堺）
#       → passage 第十遍（府内，航程写在正文里）→ arrive 鞠庭（府内）
#       → passage_ball 第十遍（问过鞠的那一路）→ arrive_ball 鞠庭（府内）
# 结构：简报写的是三章，arrive 的 cheer 选项要 requires c13_request_kikuchiyo_ball_idea——这面旗标由本轨道的 offer 设，
#       照整合方的要求不用 requires 读本轨道自己设的旗标，改成按 next 分路：ask_ball 走 passage_ball → arrive_ball，
#       只有 arrive_ball 有 cheer；take_him 走 passage → arrive。两路的航程写法不同（问过鞠的那一路，他从第一遍起就把鞠摆在脚边）。
#       arrive 没有 cheer，补一个第二选项 speak（替他圆场），走折中：谢礼被扣了一份，付 600、好感 +4、终局旗标 partial，无名声、无回忆。
#       检定失败不显示选项的回复，所以失败的经过写在 fail 分支的见闻与下一章的变体里（stuck 变体）。
#       简报要 tenth 时“watch 的回复去掉‘有一处卡了一下’”——回复不能随变体改，所以把开场白本身写进 arrive 的正文：
#       没有 tenth，他在开场白里卡住；有 tenth，开场白一字不卡，卡在老武士问的一句不在纸上的话。两个选项回答的都是“他卡住了”。
# 依据（史实）：飞鸟井家是蹴鞠的宗家，公家下向地方传授鞠道；鞠用白鹿皮缝成；鞠庭四角种樱、柳、枫、松（懸の木）；
#       起脚时的“呀”“阿利”“噢”，旧说是鞠里三位鞠精的名字。府内在大友氏治下兴盛，外港冲之浜在别府湾里。
# 依据（原创）：同来的小厮、叠得指甲盖大的那张开场白、“离脚尖一拳”、补帆的水手、牵马来接的年轻武士、老武士那句问话、被扣下的一份谢礼。
# 不写：大友宗麟本人（府内只写“一位重臣家”）；小督、澪（C7 的 tie_kikuchiyo_kogo、bond_kikuchiyo）一字不提。
#       秘密（《古今集》与长歌）永远不碰，见闻不写；只写开场白结巴，这是明面。不写恋爱与心动；不用 relation / tie / bond / heart 效果。
# 读写的旗标：读 bond kikuchiyo 至少 C（offer 的变体，老同学的口气，只读）。不读、不设任何 c7_ 旗标。
#       设 c13_request_kikuchiyo_accepted / declined / ball_idea / tenth / stuck / done / partial / late。
#       终局旗标每条路径只设一面：done（watch、cheer）、partial（speak）、late（passage 超时）、declined（回绝）；offer 超时不设旗标、不写见闻。
#       分支旗标三面：ball_idea（只作记录，分路靠 next）、tenth（arrive 的变体）、stuck（arrive 的变体）。
# 依赖：港口 sakai、funai（ports_east_asia.toml）现成；无唯一奖励物品、无技能奖励；无改名依赖；无主线门禁。
# 回忆插画清单：
#   mem-request_kikuchiyo-arrive「鞠庭上的开场」：府内鞠庭的白沙上，四角是樱柳枫松，一只白鹿皮的鞠悬在半空，廊下坐满解了刀的武士。

[[tracks]]
key = "request_kikuchiyo"
name = "开场的十遍"
kind = "request"
start = "offer"
auto = true
cast = ["kikuchiyo"]

# offer · 1576 起 · 堺的码头：抱着鞠问船价的公家人
[[tracks.chapters]]
key = "offer"
title = "说不利索的师范"
text = "堺的码头上，一个穿狩衣的公家人抱着一只白鹿皮缝的鞠，挨条问去九州的船。见你过来，他张口说了三个“我”，第四个字怎么也出不来，脸先红到了耳根。跟着的小厮替他说：府内一位重臣家请飞鸟井家的人去教鞠，开场要当着一院子的武士说一段话。他从京都下来，想搭你的船。小厮说完，他自己补了一句：“船、船上……我想练那段话，练十遍。你、你听着就行。”说着，他把鞠往石板上一放，脚尖一挑，鞠颠了起来，一下、两下、三下。“鞠在脚边，我就不怕。”这一句又快又稳。鞠一落地，他又低下头：“对、对不起。”"
speaker = "captain"
mood = "cheerful"
at = "sakai"
when = [{ kind = "date", from = [1576, 1, 1], to = [1586, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "kikuchiyo", ge = 18 }]
deadline = [1586, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "take_him"
text = "上船吧，十遍我都听着。"
next = "passage"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 2 }, { kind = "flag", flag = "c13_request_kikuchiyo_accepted" }]
reply = "他从袖子里摸出一张纸，叠得只有指甲盖大，展开来是那段开场白，字写得端端正正，有几处改过又描回去。“练、练到第十遍，”他说，“这张纸就扔了。”说完又把纸叠回去，叠得比原先还小。"

[[tracks.chapters.choices]]
key = "ask_ball"
text = "上船吧。先问一句：开场的时候，鞠能不能就放在脚边？"
next = "passage_ball"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 2 }, { kind = "flag", flag = "c13_request_kikuchiyo_accepted" }, { kind = "flag", flag = "c13_request_kikuchiyo_ball_idea" }]
reply = "他愣住了，抱着鞠想了很久，久到小厮已经去搬行李了。“规矩上……没写不许。”他先笑了，接着一口气往下说：“那我把它放在右脚边，离脚尖一拳，谁也挑不出错。”这几句，一个字也没结巴。"

[[tracks.chapters.choices]]
key = "decline"
text = "我这条船上，没地方踢鞠。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_kikuchiyo_declined" }]
reply = "他抱着鞠规规矩矩鞠了一躬，鞠差点从怀里滚出去。“那、那我走陆路，”他说，“路上也能练。”小厮叹了口气，去码头那头找挑夫了。"

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "kikuchiyo", level = "C" }]
text = "堺的码头上，一个穿狩衣的公家人抱着一只白鹿皮缝的鞠，挨条问去九州的船。见你过来，他站直了，抢在小厮前头：“这、这回我先开口。”然后真的先开了口：府内一位重臣家请飞鸟井家的人去教鞠，开场要当着一院子的武士说一段话。“船、船上……我想练那段话，练十遍。你、你听着就行。”说着，他把鞠往石板上一放，脚尖一挑，鞠颠了起来，一下、两下、三下。“鞠在脚边，我就不怕。”这一句又快又稳。鞠一落地，他又低下头：“对、对不起。”"

# passage · 府内：一路上在甲板上练，进港时第十遍还没练
[[tracks.chapters]]
key = "passage"
title = "第十遍"
text = "一路上，鞠千代每天天一亮就站到甲板上练。第一遍说到第二句就卡住，“诸、诸位”念了四回，桅杆底下补帆的水手憋着笑，针扎了手。第五遍，他把鞠放在脚边，说到了第三句。第九遍那天起了风，船身一歪，鞠骨碌碌滚过来，他想也没想伸脚一接，鞠停在脚背上。那一遍，他一口气说完了，水手们这回没笑，有人拍了一下船舷。船进别府湾，府内的冲之浜就在眼前。他攥着那张叠小的纸，嘴里念叨：“还、还差一遍。”可码头上已经站着一个牵马的年轻武士，是那位重臣家派来接人的。"
speaker = "captain"
mood = "cheerful"
at = "funai"
news = "府内冲之浜的跳板上，一个抱鞠的京都公家人对着脚边的鞠说了一长段话，来接他的武士听完朝他鞠了一躬。"
objectives = [{ kind = "at", at = "funai", text = "把船开到府内" }]
deadline_days = 60
when = [{ kind = "alive", person = "kikuchiyo", value = true }, { kind = "date", from = [1576, 1, 1], to = [1587, 8, 24] }]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "letter", person = "kikuchiyo", text = "我、我走陆路去了。开场说得不好，鞠踢得好。——鞠千代" }, { kind = "affinity", person = "kikuchiyo", value = -3 }, { kind = "flag", flag = "c13_request_kikuchiyo_late" }]

[[tracks.chapters.choices]]
key = "coach"
text = "叫他别看岸上的人，只看脚边的鞠，就在跳板上说完。"
next = "arrive"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "flag", flag = "c13_request_kikuchiyo_tenth" }]
fail = { next = "arrive", effects = [{ kind = "affinity", person = "kikuchiyo", value = -2 }, { kind = "flag", flag = "c13_request_kikuchiyo_stuck" }], news = "府内冲之浜的跳板上，一个抱鞠的京都公家人说话卡了好几回，红着脸下了船，来接他的武士只好装作没听见。" }
reply = "我把鞠踢上跳板，停在他右脚边。他站在跳板中间，看着那只鞠，说：“再、再来一次。这回我只看鞠。”第十遍，一个字没卡。岸上的武士听完，把缰绳换到左手，朝他鞠了一躬。下了跳板，他把那张纸塞到我手里：“你、你替我扔。”"

[[tracks.chapters.choices]]
key = "steady_ship"
text = "让船在港外慢慢兜一圈，多给他一刻钟。"
next = "arrive"
check = { attr = "seamanship", base = 35, per = 6 }
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "flag", flag = "c13_request_kikuchiyo_tenth" }]
news = "府内冲之浜外，一条船不急着靠岸，在湾里兜了半圈，船头有个公家人对着一只鞠念念有词。"
fail = { next = "arrive", effects = [{ kind = "affinity", person = "kikuchiyo", value = -2 }], news = "府内冲之浜，一条船靠岸靠得太急，撞得码头的木桩直响，船上一个抱鞠的公家人差点从跳板上摔下去。" }
reply = "我叫人松了帆，船在冲之浜外头兜了半圈。他站在船头，背对着码头，对着脚边的鞠练完了第十遍。练完，他把纸展开看了最后一眼，扔进了海里。纸在浪上漂了一会儿，沉下去了。岸上的武士牵着马，等得来回走了两趟。"

[[tracks.chapters.choices]]
key = "just_land"
text = "照常靠岸，第十遍留到鞠庭上再说。"
next = "arrive"
effects = [{ kind = "affinity", person = "kikuchiyo", value = 2 }]
news = "府内冲之浜，一个抱着鞠的京都公家人下了船，手里攥着一张纸，跟在牵马的武士后头，嘴里一直在念。"
reply = "他攥着那张纸下了船，跟着牵马的武士走了。走到码头尽头，他回头看了一眼船，又低头看手里的纸。纸已经被手心的汗浸软了，叠痕都快化开。"

# passage_ball · 府内：问过鞠的那一路，鞠从第一遍起就在脚边
[[tracks.chapters]]
key = "passage_ball"
title = "离脚尖一拳"
text = "在堺说定了鞠能放在脚边，鞠千代从第一遍起就把鞠摆在右脚边，拿拳头量过，离脚尖正好一拳。头几天，他看着鞠能说到第三句，一抬眼看见水手，又卡住。后来水手们学乖了，他一开口，满甲板的人都低头干活。第九遍说到一半，船吃了一阵横风，鞠贴着甲板滑出去，他脚尖一勾就勾了回来，嘴上没停，一直说到最后一句，说完自己愣了半天。到了别府湾，冲之浜的码头一点点近了。他把鞠摆好，又量了一拳，要练第十遍，码头上已经有人在挥手：一个牵马的年轻武士，府内那位重臣家派来接他的。"
speaker = "captain"
mood = "cheerful"
at = "funai"
news = "府内冲之浜的跳板上，一个京都来的公家人脚边摆着一只鞠，低着头说了一长段话，来接他的武士听完朝他鞠了一躬。"
objectives = [{ kind = "at", at = "funai", text = "把船开到府内" }]
deadline_days = 60
when = [{ kind = "alive", person = "kikuchiyo", value = true }, { kind = "date", from = [1576, 1, 1], to = [1587, 8, 24] }]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "letter", person = "kikuchiyo", text = "我、我走陆路去了。鞠摆在右脚边，离脚尖一拳，开场还是卡了两回。——鞠千代" }, { kind = "affinity", person = "kikuchiyo", value = -3 }, { kind = "flag", flag = "c13_request_kikuchiyo_late" }]

[[tracks.chapters.choices]]
key = "coach"
text = "把鞠踢上跳板，叫他照船上那样，眼睛不离鞠。"
next = "arrive_ball"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "flag", flag = "c13_request_kikuchiyo_tenth" }]
fail = { next = "arrive_ball", effects = [{ kind = "affinity", person = "kikuchiyo", value = -2 }, { kind = "flag", flag = "c13_request_kikuchiyo_stuck" }], news = "府内冲之浜的跳板上，一个京都来的公家人对着一只鞠说话，说到一半卡住了，红着脸下了船。" }
reply = "鞠滚上跳板，他弯腰把它摆到右脚边，又拿拳头量了一回。岸上的武士已经走到跳板脚下。他没抬头，只说：“再、再来一次。这回我只看鞠。”第十遍，一个字没卡。武士听完，朝他鞠了一躬。他把那张纸垫在鞠底下，抱起鞠的时候，纸被风吹走了，他看了一眼，没去追。"

[[tracks.chapters.choices]]
key = "steady_ship"
text = "收帆慢行，让他在港外把第十遍说完再靠岸。"
next = "arrive_ball"
check = { attr = "seamanship", base = 35, per = 6 }
effects = [{ kind = "affinity", person = "kikuchiyo", value = 3 }, { kind = "flag", flag = "c13_request_kikuchiyo_tenth" }]
news = "府内冲之浜外，一条船收了帆在湾里慢慢挪，船头有个公家人脚边摆着鞠，嘴里念念有词。"
fail = { next = "arrive_ball", effects = [{ kind = "affinity", person = "kikuchiyo", value = -2 }], news = "府内冲之浜，一条船收帆收晚了，靠岸靠得飞快，船头一只鞠滚了满甲板，有个公家人追着鞠直跑。" }
reply = "帆一收，船在湾里慢得像在漂。他在船头说完第十遍，把纸往海里一扔。风把纸吹回来，贴在了船舷上，他红着脸去够，够了三回才够着，又扔了一回。这回纸落进浪里，没再回来。"

[[tracks.chapters.choices]]
key = "just_land"
text = "先靠岸，第十遍到鞠庭上对着鞠说。"
