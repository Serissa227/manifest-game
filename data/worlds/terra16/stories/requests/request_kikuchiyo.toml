text = "跳板上卡住那一回以后，鞠千代一路没再说话，只把那只鞠抱在怀里。府内那位重臣家的鞠庭，四角种着樱、柳、枫、松，中间一片新筛过的白沙。一院子的武士坐在廊下，来接他的年轻武士也在里头。他把鞠摆到右脚边，拿拳头量了一回，手有点抖。他开口了。头一句说到一半，他抬眼看见了那个年轻武士，卡住了。他张着嘴，嗓子里像塞了团棉花。"
