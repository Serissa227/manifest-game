reply = "他抱着鞠下了船，跟着牵马的武士走。走了几步，他停下来，低头看了看怀里的鞠，又走。那张纸他没拿出来，一直压在鞠底下。"

# arrive · 府内：鞠庭（没问过鞠的那一路）
