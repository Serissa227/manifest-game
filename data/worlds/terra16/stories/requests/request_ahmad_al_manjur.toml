news = "得土安港口上，非斯来的学生抄了一页先生的批注，送给一个不肯收谢礼的外乡人。"

[[tracks.chapters.variants]]
key = "v1_short"
when = [{ kind = "flag", flag = "c13_request_ahmad_al_manjur_lent_short" }]
text = "过了一个多月，学生又来港口，带来先生的信。信上说，书没有在他那里留住，学生只替他抄下了目录，就把书原样带了回来。目录里有一个药名，他一眼就看出译错了，可译文他想亲眼看。他问你肯不肯下次来，把书里那一页念给他听，念慢一点，他要一个字一个字地记。"
