next = "done"
effects = [{ kind = "cash", value = 1600 }, { kind = "affinity", person = "ahmad_al_manjur", value = 6 }, { kind = "fame", value = 3 }, { kind = "skill", skill = "lang_arabic", value = 20 }, { kind = "flag", flag = "c13_request_ahmad_al_manjur_done" }]
news = "得土安的客栈里，一个非斯来的学生给一个外乡人讲了七晚的词尾变化，讲到第五晚，那人才不再把主格念成宾格。"

[[tracks.chapters.choices]]
key = "decline"
text = "不收谢礼，请他把先生的批注抄一页给你。"
reply = "学生抄得很慢，末了把纸递给你：“先生说，这一页你拿去，别拿它换钱。”纸角上有一行小字，是先生在页边写的一句诗。"
next = "done"
