# C13d 请托：进港的三处水深（request_leonor_ruiz）。中文，Claude 写。
# 人物：莱昂诺尔·鲁伊斯 leonor_ruiz（1540-06-16 生，女；塞维利亚码头地图铺的帮工，旁听过领航课，自己划小船去瓜达尔基维尔河量过水深；势力 spain，身份档 1）。
# 类型：去某处（go）；3 章 offer → arrive → report。arrive 的一般检定成功走 report（设 outline 旗标）；检定失败只量到一角，走 report_partial（没有 outline 旗标，报酬 800）。两条收尾互斥，终局 done。没有 stage 章。
# 报价：当面（T）。人物按日程在塞维利亚（seville），auto=false，玩家“问请托”（ask:request_leonor_ruiz）启动；offer 章不写 at，objectives 为找人。
# 窗口：报价 1576-01-01 至 1585-06-30，到期 timeout 直接 failed，不写见闻。进港之后 120 天内要去拉斯帕尔马斯量，到期 timeout 走 failed 并留一封信。
# 依据·史实背景：塞维利亚的海图买卖（替船长画港口图，领航员的图靠实测）；加那利群岛是去西印度船队的头一站，拉斯帕尔马斯的进港水道上有浅滩。
# 依据·原创：莱昂诺尔的图铺与旧港图的错处、叠成小方块的旧纸、去西印度的船长的订单、引水人的话、大潮低潮的量法。
# 待核：无（正文只写传闻口吻的浅滩与潮）。
# 读的旗标（只读，不设）：bond leonor_ruiz ≥ C（offer 的 variants）；c7_tie_new_margarita_leonor_ruiz_together（offer 的 variants，只写“楼上有人喊她吃饭”，不提名）。
# 设的旗标：c13_request_leonor_ruiz_accepted / declined / outline / late / done / partial。
# 秘密：她的第一张图把一处浅滩画偏了，那张图叠成小方块一直揣在怀里。report 与 report_partial 只写看见“叠成小方块的旧纸”，只在 old_map 选项（情谊 ≥ 30）里由她自己说出那是什么；见闻不写。
# 缺省走向：offer 到 1585-06-30 不接则 failed；arrive 到期 timeout，failed 并留一封信（timeout 不挂见闻，不让酒馆说一个没有发生的量测）；report 没有期限，等玩家回塞维利亚。
# 依赖：无 B10b 改名；不挂主线旗标。
# 回忆插画清单：
#   mem-request_leonor_ruiz-report（新图上的那一截）：一张新的港口图摊在桌上，第三处浅滩往东挪了一截，描得很深，角上署着她自己的名字；一张叠成小方块的旧纸压在图边。
# 注：memory 挂在两个 done 选项上（brief 如此），同一个 key，同一局只会拿到一次。

[[tracks]]
key = "request_leonor_ruiz"
name = "进港的三处水深"
kind = "request"
start = "offer"
auto = false
cast = ["leonor_ruiz"]

# 一、一单港口图：塞维利亚的图铺，玩家来问。
[[tracks.chapters]]
key = "offer"
title = "一单港口图"
text = "莱昂诺尔把一张拉斯帕尔马斯的旧港图拍在桌上。图上的水深是十几年前抄来的，进港水道中间画着一处浅滩，墨一团一团的，连它朝哪边伸都看不清。“一个去西印度的船长订了一张新图，要准的。”她拿指甲敲着那团墨，“三处水深，还有这处浅滩，你去量。量出来的数，我自己对。”窗边晾着一排量尺，刻度是她自己用小刀划的，有几根划歪了，她也没改。"
speaker = "captain"
mood = "tense"
cast = ["leonor_ruiz"]
when = [
  { kind = "date", from = [1576, 1, 1], to = [1585, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "leonor_ruiz", ge = 18 },
]
objectives = [{ kind = "person", person = "leonor_ruiz", text = "在塞维利亚的码头图铺找到她" }]
deadline = [1585, 6, 30]

[tracks.chapters.timeout]
next = "failed"

