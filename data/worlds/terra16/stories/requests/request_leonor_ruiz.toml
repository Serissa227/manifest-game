# 二、浅滩挪了：拉斯帕尔马斯的进港水道，玩家下小船打铅锤。
[[tracks.chapters]]
key = "arrive"
title = "浅滩挪了"
text = "拉斯帕尔马斯的进港水道风大浪急，我放小船下去，一处一处打铅锤。前两处跟旧图差不多，铅锤下去，数跟旧图上的对得上。第三处不一样：浅滩不在旧图画的地方，往东挪了一截，挪进了大船进港时最爱走的那条线。我一锤一锤打着，脑子里是她的两句话：“问号给你，答案带回来。”“量出来的数，我自己对。”港口的引水人站在码头上看我收锤，说这几年确实有船在那里擦过底，可没人把它画下来。"
speaker = "captain"
mood = "tense"
at = "las_palmas"
cast = ["leonor_ruiz"]
when = [{ kind = "alive", person = "leonor_ruiz", value = true }]
objectives = [{ kind = "at", at = "las_palmas", text = "到拉斯帕尔马斯的进港水道上量水" }]
deadline_days = 120

[tracks.chapters.timeout]
next = "failed"
effects = [
  { kind = "affinity", person = "leonor_ruiz", value = -3 },
  { kind = "flag", flag = "c13_request_leonor_ruiz_late" },
  { kind = "letter", person = "leonor_ruiz", text = "船长等不及，拿旧图走了。我在他的图角上写了一句：第三处小心。——莱昂诺尔" },
]

