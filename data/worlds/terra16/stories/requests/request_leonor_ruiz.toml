text = "图铺还是老样子，门口堆着没干透的图纸。我一进门，她就把一截炭笔塞进我手里：“你小时候划船比我慢，量水不许比我慢。”楼上有人扯着嗓子喊她吃饭，她应了一声，人没动。桌上拍着一张拉斯帕尔马斯的旧港图，水深是十几年前抄来的，进港水道中间那处浅滩墨团糊成一片。“一个去西印度的船长订了一张新图，要准的。三处水深，还有这处浅滩，你去量。量出来的数，我自己对。”"

