reply = "你把桦树皮包的活扣重新系上，系得跟原先一样紧。皮货客听你说完，手指在绳结上摩挲了好一阵，才把包背回肩上：“断须就断须，参是真的。”他说扎克丹那边由他去讲，出栅门前又把包往肩上颠了颠。"
