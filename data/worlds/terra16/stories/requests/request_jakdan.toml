effects = [{ kind = "cash", value = 550 }, { kind = "affinity", person = "jakdan", value = 8 }, { kind = "fame", value = 1 }, { kind = "memory", memory = "mem-request_jakdan-result", title = "熬鹰的皮手套" }, { kind = "flag", flag = "c13_request_jakdan_done" }]

[[tracks.chapters.choices]]
key = "short"
text = "说：你自己来看。"
next = "done"
