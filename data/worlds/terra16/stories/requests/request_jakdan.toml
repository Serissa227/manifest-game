# 三、海是什么样子：数须或翻话换来上等的价，皮货客带着手套回来。
[[tracks.chapters]]
key = "result"
title = "海是什么样子"
text = "一个月后，皮货客在栅门边等你，背上多了一个包。他把包放在你脚边：“扎克丹托我带的。”里面是一副熬鹰的皮手套，鹿皮鞣得发黑，虎口磨出了毛，一道旧爪痕被人拿细筋缝了起来。“他还有句话要问。”皮货客挠挠头，“海是什么样子？他没见过。你见过，你怎么说？”"
speaker = "captain"
mood = "cheerful"
at = "niuzhuang"
objectives = [{ kind = "wait", days = 30, text = "皮货客一个月后回来。" }]
when = [{ kind = "alive", person = "jakdan", value = true }]
news = "牛庄互市上，一个女真皮货客背来一副熬鹰的手套，说是送给一个外乡船长的。"

[[tracks.chapters.variants]]
key = "v1_asked"
when = [{ kind = "flag", flag = "c13_request_jakdan_asked" }]
text = "一个月后，皮货客在栅门边等你，背上多了一个包。他把包放在你脚边，没提盐和铁锅，你问过了。“扎克丹托我带的。”里面是一副熬鹰的皮手套，鹿皮鞣得发黑，虎口磨出了毛，一道旧爪痕被人拿细筋缝了起来。“他那句话，你想好了没有？”皮货客问，“海是什么样子。”"

[[tracks.chapters.choices]]
key = "describe"
text = "说：海像冬天的草原，一眼望不到边，风比鹰还急。"
next = "done"
