# 请托：两地的汇价（request_valentin_mennher）。中文，Claude 执笔（C13d）。
# 人物：瓦伦丁·门纳 valentin_mennher（1521 年生，男；生月日不详，TOML 里的 1 月 1 日只是占位；约 1570 年卒）。德意志肯普滕人，安特卫普算术学校的教师，1550 年代起在安特卫普出版算术与簿记书。cast/historical_01_europe.toml。
# 类型：去某处（go）。五章（brief 是四章，见下面的结构说明）：offer（安特卫普的算术学校，报价）→ lisbon（里斯本新街的兑换桌）→ venice（威尼斯里亚尔托桥边的银行柜台）→ report 或 report_terms（安特卫普，回报）→ done / failed。
# 报价：当面（T）。auto=false，玩家在安特卫普找到他（ask:request_valentin_mennher）。offer 窗口 1557-03-01 至 1568-06-30，止日即 deadline，超时走 failed，不写见闻（没人知道这件事没成）。offer 之后每章都要求他还在世。
# 进行中：lisbon、venice 各 150 天；两个回报章的期限都是 1569-12-31（日程到 1569 年底）。
# 身份档 1（低风险）：报酬上限 900，折中 450（50%）。
# 依据·史实：门纳 1550 年代起在安特卫普出版算术与簿记书（cast 出处：1550 年的法文记账书）；圣安布罗斯行会只作口吻里的背景。
# 依据·原创：里斯本新街的三张兑换桌与墙上的旧汇价表；威尼斯里亚尔托桥边的小黑板；热那亚人的四十天与六十天期票之说；格子纸上的五栏；报价人的名字（不写真名）。
# 待核：卒年约 1570，确切月日未核；正文不写具体的卒期。
# 结构说明（brief 与引擎的偏离）：brief 的 report 章有两个旗标门禁——explain 要 terms、names 要 clean。bot 审计要求门禁在每条到达该章的路径上都能满足（准备后仍不满足即分支错误），而 terms 只有热那亚人的成功分支会设，clean 只有里斯本的两个选项会设，所以：
#   1. explain 挪到 report_terms 章，只从 venice 的 genoese 成功分支到达（那条分支设 terms，章的 when 写 terms）；
#   2. names 改为检定（eloquence 一般），不再门禁 clean；
#   3. clean 改为 report 章的一个变体（只换正文，不换选项）：纸上写满了报价人的名字时，正文有一句不同。
# 读的旗标：c13_request_valentin_mennher_terms（report_terms 的 when）、c13_request_valentin_mennher_clean（report 的变体）。不读 c7_*、c13_main_*；不设任何 c7_* 旗标。
# 设的旗标：accepted / declined / clean / loud / signed / terms / done / partial / late。终局旗标：done（explain、names 成功）与 partial（shrug，names 失败）；late 只在超时时设。
# 依赖：无改名依赖（antwerp、lisbon、venice 现成）；技能 double_entry 现成；属性 numeracy、commerce、eloquence 沿用 captain 表。唯一奖励 ympyn_dutch（items/books_05_commerce.toml）。
# 回忆插画清单：
#   mem-request_valentin_mennher-report：教室的黑板上两行汇价，中间画着一个大大的问号。

[[tracks]]
key = "request_valentin_mennher"
name = "两地的汇价"
kind = "request"
start = "offer"
auto = false
cast = ["valentin_mennher"]

# offer · 1557—1568 · 安特卫普的算术学校：他要两地的新数，报价的人也要记下来
[[tracks.chapters]]
key = "offer"
title = "十年前的数"
text = "安特卫普的算术学校在行会大楼二楼。教室里一排学徒对着同一道例题皱眉：里斯本兑安特卫普的汇价，书上印的还是十年前的数。门纳把书往桌上一摔，书脊裂开一道缝。“账簿不撒谎，”他用德意志口音一字一顿地说，“可书会过时。所以我要新数。你去里斯本和威尼斯，各记一天当天真实的汇价。报价的人是谁，也要写上。报价的人比数还要紧，因为数是从他嘴里出来的。”"
mood = "tense"
objectives = [{ kind = "person", person = "valentin_mennher", text = "在安特卫普的算术学校找到他" }]
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1557, 3, 1], to = [1568, 6, 30] }, { kind = "alive", person = "valentin_mennher", value = true }]
deadline = [1568, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "接下：先里斯本，后威尼斯"
next = "lisbon"
effects = [{ kind = "affinity", person = "valentin_mennher", value = 2 }, { kind = "flag", flag = "c13_request_valentin_mennher_accepted" }]
reply = "他从抽屉里抽出一张画好格子的纸：日期、地点、报价人、买价、卖价，五栏。“报价人那一栏写全名。”他把笔递过来，笔尖已经削好了。"

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：一张汇价表，不值我跑两趟"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_valentin_mennher_declined" }]
reply = "他没有再劝。“旧数，你们自己去查。”他拿粉笔在黑板上把那道题改了个数，学徒们偷偷笑，他敲了两下黑板，让他们接着算。"

