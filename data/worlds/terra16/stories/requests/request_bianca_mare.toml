# 请托：能付到哪一步（request_bianca_mare）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：比安卡·马雷（bianca_mare，1510-10-19 生，女），热那亚的寡妇银行家，只在掌灯以后见客；cast 在 cast/story_europe.toml。
# 类型：说服（persuade）。六章：offer（掌灯以后）、persuade（造了一半的船）；persuade 的三条路各自转入自己的结算章：report_half（一半是实数）、report_list（写满名字的纸）、report_warn（先结了工钱）；检定失败转入 report_name（一个名字）。终点 done / failed。
#   结构说明：结算章只经 next 进入，选项不 requires 任何别的分支设下的旗标；检定失败由 persuade 的 fail 分支转入 report_name，它自己的两个选项结账（现金 1200，折中）。
# 报价：T 当面（auto=false），启动用 ask:request_bianca_mare。offer 章不写 at，objectives 为在港里找到她；offer deadline 1574-06-30，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1557-06-01 至 1574-06-30；persuade 1557-06-01 至 1574-12-30，进入后 90 天期限；结算章 1557-06-01 至 1574-12-30。
# 依据·史实背景：热那亚银行家的世纪——西班牙王室的借款由热那亚人的放贷网转手；那不勒斯的船坞要先付木料与工钱，船才下得了水。比安卡是原创人物。
# 依据·原创：比安卡的账房与灯座、借据、那不勒斯船坞里造了一半的加莱船、造船匠与他的名单、三十个工匠。
# 依赖：港口 genoa、naples（ports_west_med.toml）；技能 negotiation（skills.toml）；人物 bianca_mare。B10b：无需改名。主线门禁：无（比安卡不是主线人物）。
# C7：tie_new_ursula_bianca_mare 那条线在安特卫普，本请托只在热那亚与那不勒斯，不写乌尔苏拉，不写安特卫普；本文件不读也不设任何 c7_ 旗标。
# 读的旗标：无。
# 设的旗标：c13_request_bianca_mare_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_half（谈成一半）、_list（检定成功，写下名单）、_warned（通风报信）、_late（超时，终局）、_done（终局：一半、名单、一个名字）、_partial（通风报信，终局）。
# 检定失败（press 的 fail）只转入 report_name、不设旗标：分支旗标只有 _half、_list、_warned 三面，合乎“至多三面”。
# 秘密（cast persona）：她替人收账的来路。正文、见闻与来信一律不写，只写她收账时的样子。
# 口头禅：招呼语“请坐。灯够亮吗？”与“签字以前，你可以慢慢想清楚，自己已经欠了谁。”只在 offer 章用一次，全轨道不再重复。
# 报酬：现金最多 2250（谈成一半或写下名单 2250；一个名字 1200；通风报信只给路费 300）；好感最多 +13（通风报信时合计 −5）；名声 +3；回忆 mem-request_bianca_mare-result（只给 report_half 的第一条选项）。
# 回忆插画 mem-request_bianca_mare-result：灯座上压着一张借据，灯芯挑得很亮，借据旁边是一张写满名字的纸。

[[tracks]]
key = "request_bianca_mare"
name = "能付到哪一步"
kind = "request"
start = "offer"
auto = false
cast = ["bianca_mare"]

# 一、掌灯以后：比安卡把借据推过来。
[[tracks.chapters]]
key = "offer"
title = "掌灯以后"
text = "热那亚的账房只在掌灯以后开门。比安卡坐在灯座后头，把一张借据推到你面前，借款人是那不勒斯的一个造船匠，欠了三年。“请坐。灯够亮吗？”她没等你答，手指压着纸角，“签字以前，你可以慢慢想清楚，自己已经欠了谁。”她要的不是把钱全讨回来。“去看看他能付到哪一步。付不出的那一截，换成另一样东西：他还欠着谁，欠多少，一个一个写下来。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "bianca_mare", text = "在港里找到她" }]
when = [
  { kind = "date", from = [1557, 6, 1], to = [1574, 6, 30] },
  { kind = "age", ge = 17 },
]
deadline = [1574, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "接下，去那不勒斯。"
next = "persuade"
reply = "她把借据折好交给你，说：“他要是哭，你就等他哭完。”"
effects = [
  { kind = "affinity", person = "bianca_mare", value = 2 },
  { kind = "flag", flag = "c13_request_bianca_mare_accepted" },
]

[[tracks.chapters.choices]]
key = "ask_list"
text = "接下。先问她：那张名单要做什么？"
next = "persuade"
reply = "她看了你一眼，笑得很淡：“银行家知道谁欠谁，才知道谁快撑不住了。这是利息。”"
effects = [
  { kind = "affinity", person = "bianca_mare", value = 2 },
  { kind = "flag", flag = "c13_request_bianca_mare_accepted" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "讨债的事，我不做。"
next = "failed"
reply = "她把借据收回去，压在灯座底下：“那就等下一个肯去的人。”"
effects = [{ kind = "flag", flag = "c13_request_bianca_mare_declined" }]

