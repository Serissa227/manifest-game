text = "那不勒斯的船坞里，一条加莱船造了一半，肋骨露在风里。造船匠看了借据，脸色灰下去。“西班牙人订的船钱，一直没付。”他说，“木料商、铁匠，还有三十个工匠，工钱已经欠了一整个冬天。”他从工棚的柜子里拿出一本账，翻到夹着布条的一页，按在桌上。“名单在这里。交出去，那些人就要找上门。”"
speaker = "captain"
mood = "tense"
at = "naples"
objectives = [{ kind = "at", at = "naples", text = "到那不勒斯去" }]
