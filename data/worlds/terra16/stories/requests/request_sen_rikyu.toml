# C13d 请托：修过的旧茶碗（request_sen_rikyu）。Claude 写（2026-10-25），仅中文。
# 人物：千利休 sen_rikyu（1522 生，男；cast 里月日不详，按 1522-01-01 记；1591 卒）。堺的商人茶人，此时称宗易——1585 年才受赐“利休”之号，
#   本请托的窗口止于 1585 年，正文全程只称“宗易”。cast：cast/historical_07_japan.toml，势力 sakai，日程 1553—1590 在堺。
#   秘密（经手铅弹火药的货单）本请托不碰；也不写纳屋家、小夜、枫（C7），不写名物狩、矢钱，不用后世伪托的茶道格言。
# 类型：复合（mixed）。brief 五章（offer → inquire → turn → fetch → settle），实写八章：
#   offer（报价）→ inquire（博多问来历）→ turn（听全了：对照）／turn_name（只有寺名：对照）→ fetch ／ fetch_name（两箱瓷器）→ settle ／ settle_name（茶会末座）；终点 done / failed。
#   为什么拆：brief 的 settle 让“讲博多的事”用本轨道自设的旗标 _story 作 requires。照任务单的做法改为按 next 分流——inquire 里听全了的（陪她听完成功、买下字条）
#   走 turn → fetch → settle，只问到寺名的（陪她听完失败、只问名字）走 turn_name → fetch_name → settle_name；settle_name 不给“讲出来”这一条，只有“说漆匠是谁”与“一句不说”。
#   两条路的玩法、限期与报酬完全一样，只是正文与回复按“我”知道多少来写。
# 报价：T 当面。宗易在堺（日程 at=sakai），交谈话题 ask:request_sen_rikyu 启动，auto=false；求见门槛（名声 10、堺声望 5）由 cast 的 audience 判定，本文件不写。
#   offer 不写 at，用 person 目标；deadline 1584-03-31（窗口止日），timeout 直接 failed，不写见闻。
# 进行中：inquire 在博多（at=hakata）限 150 天，超时 failed（旗标 _late、宗易一封 ≤120 字的来信）；turn / turn_name 回堺见他，限 120 天；
#   fetch / fetch_name 在堺交两箱瓷器（goods 目标，回应任一选项都扣货，所以每个选项都付货款），限 180 天；settle / settle_name 先等 7 天、再见他，限 60 天。
#   后三处超时都走 failed、设 _late，不另写来信（brief 如此）。普通章不写 window / default。
# 依据·史实：堺与博多的商人茶会，茶人重唐物与茶器的“来历”（《天王寺屋会记》一类的会记里，器物的传来与前一任主人都要记）；
#   1551 年大宁寺之变，大内义隆死，大内家此后没落，博多易主、几经兵火（研究笔记 P_eastasia_1540）；圣福寺是博多的老禅寺（荣西所开）。
#   正文只说“大内家倒的那年”，不写具体战事与人名。
# 依据·原创：那只褐釉旧茶碗与碗身一道黑漆补过的裂线（“像一条河”）、博多浜后街守空仓的老寡妇与她剥的豆子、丢在半路的钱箱、
#   圣福寺的老漆匠觉了（原创人名，不冒用史料）与他那张“此碗不宜盛热汤”的字条、宗易挑走的那只素白盘、茶会上的盐商。
#   黑漆补裂（不描金）是照当时的做法写的；不写金缮。
# 商品：瓷器 porcelain ×2（月港 yuegang、广州 guangzhou、澳门 macao 有，堺不产）。货款 2 × 120 × 1.25 = 300，fetch / fetch_name 的每个选项都付。
#   brief 的 turn 回复写“挑完剩下的，您拿去卖”，与 goods 目标扣货对不上；改成宗易两箱照价收下、只留一件，其余转给堺的瓷器铺。
# 报酬：货款 300；报酬至多 1600（settle 的 tell / quiet、settle_name 的 quiet），只说漆匠 1300，转折处停下 900；
#   唯一物品 longquan_celadon（龙泉青瓷盘）——茶会后宗易所赠，正文写明是他自家旧藏的一只，不是“我”运来、他挑走的那只素盘
#   （brief 的 quiet 回复写“把那只素盘送给了我”，照 fixes 改正）；好感至多 +18（brief 记 +19，按各选项的数值逐项相加是 +18）；
#   声望 sakai 至多 +3；名声至多 +5；回忆一张（只在 settle 的 tell）。
# 门禁：offer 写日期起点 1570-01-15 与主角 ≥17 岁；之后每章 alive sen_rikyu（他没有 fate，1591 年才去世，窗口内一直在堺）。没有主线门禁，没有变体。
# 读的旗标：无（分流靠 next，不用旗标挡选项）。
# 设的旗标：c13_request_sen_rikyu_accepted / _declined；终局 _done / _partial / _late（每条路只设一面终局旗标）；
#   分支三面：_story（听全了：陪她听完成功、买下字条）、_name_only（只问到寺名或漆匠的名号）、_fetched（两箱瓷器交到了）。
#   brief 里还有一面 _second（turn 里答应再跑一趟），它与“走到了 fetch”同义、无人读取，为守住分支旗标至多三面的规矩不设。
#   brief 的 point 成功分支没写 _fetched；交货在三条分支里都发生了，统一设上。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart / title / world / join / leave / start_track / end_track / growth。来信全轨道一封（inquire 超时）。
# 引擎注：检定失败没有回复字段，结果显示的是 fail 分支的见闻，所以 listen 与 point 的失败经过写在 fail 的 news 里。
# 依赖：港口 hakata、sakai（ports_east_asia.toml）；商品 porcelain（goods/04_overseas_crafts.toml）；物品 longquan_celadon（items/items_curio_02.toml）；
#   势力 sakai（factions/10_japan.toml）；属性 eloquence、commerce；人物 sen_rikyu。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_sen_rikyu-settle「末座上的旧茶碗」：小小的茶室，壁龛里一枝花苞，席上并排一只素白瓷盘与一只褐釉旧碗，碗身一道黑漆裂线；满座的客人低头看碗，末座的人在说话。

[[tracks]]
key = "request_sen_rikyu"
name = "修过的旧茶碗"
kind = "request"
start = "offer"
auto = false
cast = ["sen_rikyu"]

# 一、漆线：堺，宗易的茶室。他要在下一回茶会上用一只碎过的碗。
[[tracks.chapters]]
key = "offer"
title = "漆线"
text = "宗易的茶室在仓房后头，门矮，进去得弯腰。炉上的水刚响，他不急着点茶，先解开一个布包，把一只旧茶碗放在我面前的席子上。碗是褐釉的，釉薄，碗身斜着一道黑漆补过的裂线，从碗口弯到碗底，像地图上的一条河。“下一回茶会，我想用它。”他停下来看了我一眼，“碗是好碗。可它碎过一回——谁修的、为什么修，我得知道。不然客人问起，我只能说它好看。”卖碗的人只交代过一句：上一任主人在博多，是一户老商家。“名号我有。”他说，“人还在不在，我不知道。”"
when = [
  { kind = "date", from = [1570, 1, 15] },
  { kind = "age", ge = 17 },
]
objectives = [{ kind = "person", person = "sen_rikyu", text = "在堺找到宗易" }]
cast = ["sen_rikyu"]
speaker = "sen_rikyu"
mood = "tender"
deadline = [1584, 3, 31]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "替他去博多，问这只碗的上一任主人"
next = "inquire"
reply = "他把碗包回布里，系了两道绳，没有交给我，只把写着那户人家名号的纸条推了过来。“慢慢问。”他又给我添了一碗茶，这一碗点得很浓，碗沿一圈都是绿的。"
effects = [
  { kind = "flag", flag = "c13_request_sen_rikyu_accepted" },
  { kind = "affinity", person = "sen_rikyu", value = 2 },
]

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：博多这一趟，我腾不出船"
next = "failed"
reply = "他点点头，把碗收回布包里，系好绳，放到身后的架子上。炉上的水已经滚过了头，他舀掉一勺，掺进一勺凉的，从头开始点茶，像我刚进门时那样。"
effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_declined" }]

# 二、博多的老寡妇：博多浜后街的空仓。她认得那道裂线。
[[tracks.chapters]]
key = "inquire"
title = "博多的老寡妇"
text = "纸条上的名号，在博多浜一条后街的尽头。仓房的门开着，里头是空的，只剩几只倒扣的米斗。守仓的老寡妇坐在门槛上剥豆子。我照宗易那只碗的样子，用指头在门槛上划那道裂线：从碗口斜下来，到底拐一个弯。她的手停了。“石阶上磕的。”她回头看了一眼空仓，“大内家倒的那年，城里起火，他抱着那只碗跑……”说到这里，她低下头，把一颗豆子剥了很久。"
when = [{ kind = "alive", person = "sen_rikyu", value = true }]
objectives = [{ kind = "at", at = "hakata", text = "去博多问茶碗的上一任主人" }]
at = "hakata"
speaker = "captain"
mood = "sad"
deadline_days = 150

[tracks.chapters.timeout]
next = "failed"
effects = [
  { kind = "flag", flag = "c13_request_sen_rikyu_late" },
  { kind = "letter", person = "sen_rikyu", text = "宗易字：茶会改了日子。那只碗先收进箱里了，裂线朝下放着。博多的事，您不必再跑。" },
]

[[tracks.chapters.choices]]
key = "listen"
text = "在门槛边坐下，陪她把那一年的事听完"
check = { attr = "eloquence", base = 20, per = 7 }
next = "turn"
reply = "她剥完了那一簸箕豆子，才讲完：丈夫跑到圣福寺前的石阶上滑了一跤，碗裂成两半，钱箱丢在了半路。寺里的老漆匠觉了师父把碎片捡回去，修了三个月，一文没要。“师父说，钱箱丢就丢了，碗还在你怀里，我来补。”她又想起一句：“补的地方别描金，黑的就好。”"
news = "博多浜后街守空仓的老寡妇，跟来问茶碗的人讲了一下午，讲大内家倒的那年，她丈夫抱着一只碗逃命的事。"
effects = [
  { kind = "affinity", person = "sen_rikyu", value = 3 },
  { kind = "flag", flag = "c13_request_sen_rikyu_story" },
]
fail = { next = "turn_name", effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_name_only" }], news = "博多浜后街的老寡妇讲起大内家倒的那年，讲到一半就哭了。来问茶碗的人没再往下问，只记下了圣福寺三个字。" }

[[tracks.chapters.choices]]
key = "receipt"
text = "出钱买下漆匠留给她家的那张字条"
requires = [{ kind = "cash", ge = 200 }]
hint = "钱袋太瘪，这个口开不得。"
next = "turn"
reply = "她进屋翻了半天，捧出一只装碗的空木箱，箱盖里面贴着一张发黄的字条：“此碗不宜盛热汤。漆三月始干。圣福寺觉了。”她指着“三月”两个字说，那年城里起火，她男人抱着碗跑，钱箱扔在半路也顾不上，摔在寺前的石阶上；觉了师父补了三个月，没收钱。她把字条揭下来给我，收了钱，说留着也没人看。"
news = "博多浜守空仓的老寡妇，把一只空木箱盖上发黄的字条卖给了外来的人，说那是圣福寺一个老漆匠留下的。"
effects = [
  { kind = "cash", value = -200 },
  { kind = "flag", flag = "c13_request_sen_rikyu_story" },
]

[[tracks.chapters.choices]]
key = "name"
text = "只问修碗的漆匠是谁，不多打扰"
next = "turn_name"
reply = "寡妇松了口气，像放下了一担水。“圣福寺的觉了师父。早不在了吧，我也没去问过。”她又低头剥豆子，剥得很快，没再抬头看我。"
news = "博多浜后街的老寡妇被人问起一只旧茶碗，只报了圣福寺一个老漆匠的名号，就低头剥她的豆子去了。"
effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_name_only" }]

# 三、对照（听全了）：回到堺。宗易要在旧碗旁边摆一件新的。
[[tracks.chapters]]
key = "turn"
title = "对照"
text = "回到堺，我把博多听来的事一样一样说给宗易：那年的火，寺前的石阶，丢在半路的钱箱，修了三个月的漆。他听完，半天没说话，炉上的水响了又停。后来他把那只旧碗挪到席子正中，在它旁边空出一掌宽的地方，用指头点了点。“这里，要摆一件新的。完好的，唐土的瓷。”他看了我一眼，“客人看了新的，才看得见旧的。”他要我从月港、广州或澳门运两箱瓷器来，由他挑一件。"
when = [{ kind = "alive", person = "sen_rikyu", value = true }]
objectives = [{ kind = "person", person = "sen_rikyu", text = "回堺见宗易" }]
cast = ["sen_rikyu"]
speaker = "sen_rikyu"
mood = "tender"
deadline_days = 120

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_late" }]

[[tracks.chapters.choices]]
key = "again"
text = "再跑一趟南边，运两箱唐土瓷器来"
next = "fetch"
reply = "“两箱我都照价收下。”他说，“我只用一件。剩下的，堺有的是人要。”说完他又看了一回那一掌宽的空处，像那里已经摆着什么了。"
effects = [{ kind = "affinity", person = "sen_rikyu", value = 2 }]

[[tracks.chapters.choices]]
key = "stop"
text = "到此为止，把博多的话交给他就好"
next = "done"
reply = "他点头，叫仓房的伙计取来这一半的谢礼，包得方方正正。“茶会照开。没有对照也行——客人看不见，是客人的事。”他把旧碗收回布包，这回系绳系得比上回慢。"
effects = [
  { kind = "cash", value = 900 },
  { kind = "affinity", person = "sen_rikyu", value = 4 },
  { kind = "fame", value = 3 },
  { kind = "reputation", faction = "sakai", value = 2 },
  { kind = "flag", flag = "c13_request_sen_rikyu_partial" },
]

# 三·二、对照（只有寺名）：回到堺，能交给他的只有一个寺名。
[[tracks.chapters]]
key = "turn_name"
title = "一个寺名"
text = "回到堺，我能交给宗易的不多：碗是在博多圣福寺补的，补它的是寺里一位老漆匠，别的寡妇没说下去。他要了纸笔，把寺名写下来，折好，放进那只碗的木箱里。“是谁的手，有了。”他合上箱盖，没往下说。过了好一阵，他把旧碗取出来摆在席子正中，旁边空出一掌宽。“那就让客人自己去看。这里摆一件新的、完好的唐土瓷——新的在旁边，旧的才显得出来。”他要我从月港、广州或澳门运两箱瓷器来。"
when = [{ kind = "alive", person = "sen_rikyu", value = true }]
objectives = [{ kind = "person", person = "sen_rikyu", text = "回堺见宗易" }]
cast = ["sen_rikyu"]
speaker = "sen_rikyu"
mood = "tender"
deadline_days = 120

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_late" }]

[[tracks.chapters.choices]]
key = "again"
text = "再跑一趟南边，替他运瓷器来"
next = "fetch_name"
reply = "“两箱都算我的。”他说，“我挑一件，其余的转给堺的瓷器铺，不叫您亏。”他把写着寺名的纸从箱里取出来又看了一遍，放了回去。"
effects = [{ kind = "affinity", person = "sen_rikyu", value = 2 }]

[[tracks.chapters.choices]]
key = "stop"
text = "到此为止，寺名交给他就算办完"
next = "done"
reply = "他点头，付了这一半的谢礼。“茶会照开，没有对照也行。”他把那张纸压到箱底，说博多那位师父的事，等以后有船去，他再托人问。"
effects = [
  { kind = "cash", value = 900 },
  { kind = "affinity", person = "sen_rikyu", value = 4 },
  { kind = "fame", value = 3 },
  { kind = "reputation", faction = "sakai", value = 2 },
  { kind = "flag", flag = "c13_request_sen_rikyu_partial" },
