# 四、两箱瓷器（听全了的路）：宗易的仓房，满满一席唐土瓷，他只拿起最素的那只。
[[tracks.chapters]]
key = "fetch"
title = "两箱瓷器"
text = "两箱瓷器在宗易的仓房里撬开，伙计把稻草一把把掏出来，一件件摆上草席：青花大盘、五彩的碗、开光的瓶，排了满满一席。宗易不看最贵的那几件，背着手绕着席子走了两圈，蹲下来，拿起一只最素的白盘子——没有花，只在盘心有一圈淡淡的旋纹——对着门外的光慢慢地转。"
when = [{ kind = "alive", person = "sen_rikyu", value = true }]
objectives = [{ kind = "goods", good = "porcelain", qty = 2, at = "sakai", text = "两箱唐土瓷器运到堺" }]
at = "sakai"
speaker = "captain"
mood = "tender"
deadline_days = 180

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_sen_rikyu_late" }]

[[tracks.chapters.choices]]
key = "let"
text = "让他自己挑"
next = "settle"
reply = "他挑走了那只素盘，用一块旧布包好。剩下的叫伙计原样封箱，照价记进账里，当天就抬去了街口的瓷器铺。从头到尾，他没问过一句哪件最值钱。"
news = "堺的宗易在仓房里看了满满一席唐土瓷器，只挑走一只最素的白盘，剩下的原样封箱，转给了街口的瓷器铺。"
effects = [
  { kind = "cash", value = 300 },
  { kind = "flag", flag = "c13_request_sen_rikyu_fetched" },
]

[[tracks.chapters.choices]]
key = "point"
text = "指给他看，哪一件是新窑仿的旧样"
check = { attr = "commerce", base = 20, per = 7 }
next = "settle"
reply = "我指的是一只青花盘：底足太白，旧款是后写上去的。他放下素盘，把青花盘翻过来看了很久，抬头看我一眼：“您的眼睛也是做买卖的。”他要的仍是那只素盘，青花盘随别的一起封了箱。"
news = "堺的宗易仓房里，运瓷器来的人一眼认出一只仿旧款的青花盘，宗易翻过盘底看了半天，笑了一下。"
effects = [
  { kind = "cash", value = 300 },
  { kind = "affinity", person = "sen_rikyu", value = 3 },
