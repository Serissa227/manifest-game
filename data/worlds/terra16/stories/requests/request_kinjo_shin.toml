# 十年的名单（request_kinjo_shin）——请托线，类型：送信（kind=letter），报价模式 T 当面（auto=false，玩家在那霸用 ask:request_kinjo_shin 启动；offer 章不写 at，objectives 为 person kinjo_shin，港口 naha）。
# 人物：金城真（kinjo_shin，1540-11-13 生，男），那霸进贡船书记家的少年，使节家学的同学（cast 见 cast/classmates_custom_naha_envoy.toml）。
#       一板一眼，说话像念航路：先说岛，再说事；自嘲时也一本正经。口头禅“先认岛，再认旗。”只在 offer 章用一次（变体 v1_bond_c 也是同一章的另一版文字，同样只出现一次）。
# 时间：offer 1573-01-01—1590-06-30（到期走 timeout，next=failed，不写见闻）；handover 福州柔远驿，期限 120 天；reply 回那霸，无期限（条件满足即进待决队列）。
# 依据（史实）：明代琉球两年一贡，进贡船经福州入贡；福州设柔远驿安置琉球使团与漂流难民，失事的琉球船员常由沿海官府送到福州，再随贡船回国。驿里的通事是叙事人物，不写名字。
# 原创：金城真手抄的按岛名单、通事的簿子、修船铺的那个人、“不愿归”的一行、所有台词与情节。
# 待核（正文一律只写驿里与港口的口吻）：琉球船员的遣返手续与驿馆簿籍的具体格式，正文不写条文，只写“簿子上对出了七个”。变体里“第三座岛”的答案（黄尾）按《使琉球录》的航路次序推的，待确认。
# 结构说明（引擎约束）：
#   · handover 的三条路各走各的章：读簿子与付钱走 reply；见修船铺那个人检定成功走 reply_word（“他还活着”的话只在那一章里说，tell_mother 不再需要旗标门槛）；
#     检定失败直接 failed，来信里给出他隔门说的一句话，报酬为 0（失败不罚钱）。
#   · reply 只接读簿子与付钱两条路（没有“带话”旗标），所以 reply 的第二个选项 keep_last（折中，现金 700）是原创补充，
#     原因：章节要求两个选项，而且读簿子的人与见过人的人报酬有别。
#   · 报价 offer 的 variant v1_bond_c 只改文字，不改效果；“答得上来”的考问在文字里一次完成（引擎没有问答检定）。
# 读写的旗标：设 c13_request_kinjo_shin_accepted / declined / full / word / failed / late / done / partial。不读任何主线旗标，不读任何 c7_ 旗标。
# 与 C7 的界线：拉坎、汤都、唐人船的十年信、1562 年重逢都不在本文件出现；本线不替任何人带东西给拉坎；拉坎的请托在汤都，不同港。
# 秘密：有一夜把岸上的一盏灯认错了，本文件不碰，见闻不写。
# 回忆插画清单：
#   mem-request_kinjo_shin-reply：那霸书记房的桌子上，一卷名单摊开，最后一行多出了“福州”两个字，墨还没干。

[[tracks]]
key = "request_kinjo_shin"
name = "十年的名单"
kind = "request"
start = "offer"
auto = false
cast = ["kinjo_shin"]

# 报价：那霸书记房。金城真把十年的名单按岛排好，托你送到福州的琉球馆。
[[tracks.chapters]]
key = "offer"
title = "按岛排的名单"
text = "那霸贡船书记房的桌上，金城真把一卷纸摊开。名单按岛排，不按人排：哪座岛外失的事，就写在哪座岛名下。这十年里从那霸往福州的船出过几回事，船员有的被渔船救起，有的被官府送进福州，有的再没有消息。“先认岛，再认旗。”他用指甲压住纸角，“家里人问起来，先得知道是在哪片海。”他把卷子往我这边推了一寸：“送去福州的琉球馆。请那边的人一个个对，谁还活着，谁葬在哪里。”"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "sad"
objectives = [{ kind = "person", person = "kinjo_shin", text = "在那霸的贡船书记房找到他" }]
when = [
  { kind = "date", from = [1573, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "kinjo_shin", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

# 变体：同窗的老交情（bond 金城真 ≥ C）。他先考一句，你答上了，他才把卷子摊开。
[[tracks.chapters.variants]]
key = "v1_bond_c"
when = [{ kind = "bond", person = "kinjo_shin", level = "C" }]
text = "那霸贡船书记房的桌上，金城真没有先摊开纸。他先问：“从那霸往福州，第三座岛叫什么？”我答：“黄尾。”他这才把卷子摊开。名单按岛排，不按人排：哪座岛外失的事，就写在哪座岛名下。这十年里从那霸往福州的船出过几回事，船员有的被渔船救起，有的被官府送进福州，有的再没有消息。“先认岛，再认旗。”他用指甲压住纸角，“家里人问起来，先得知道是在哪片海。”他把卷子往我这边推了一寸：“送去福州的琉球馆。请那边的人一个个对，谁还活着，谁葬在哪里。”"

[[tracks.chapters.choices]]
key = "take_list"
