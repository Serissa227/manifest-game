text = "接下，先请他把名单从头念一遍。"
next = "handover"
reply = "他念得很慢，念到一座小岛的名字，停了一下，说这座岛他小时候在贡船上见过，“岛上有口泉，水是甜的”。"
effects = [
  { kind = "affinity", person = "kinjo_shin", value = 3 },
  { kind = "flag", flag = "c13_request_kinjo_shin_accepted" },
]

[[tracks.chapters.choices]]
