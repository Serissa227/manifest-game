# 进行：福州柔远驿。120 天内没到，名单就由下一趟贡船带去，驿里对过了，没人再回头问这件事。
[[tracks.chapters]]
key = "handover"
title = "驿里的簿子"
text = "柔远驿的院子里晾着琉球人的衣裳，竹竿横过半个院子。通事是个福州人，琉球话说得比官话还顺。他把名单与驿里的簿子一行行对，对出了七个：四个回了那霸，两个葬在城外的义冢。第七个没死，也没回去。他在福州娶了亲，开了间修船的铺子，簿子上那一行写着“不愿归”。通事把簿子推过来，手指压在那一行上：“人还在城里，你要见，就得自己去找。”"
at = "fuzhou"
cast = ["kinjo_shin"]
speaker = "captain"
mood = "sad"
objectives = [{ kind = "at", at = "fuzhou", text = "到福州的琉球馆（柔远驿）" }]
when = [{ kind = "alive", person = "kinjo_shin", value = true }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "letter", person = "kinjo_shin", text = "名单我托下一趟贡船带去了。回来的人说驿里的簿子对过了，对出几个，他没记住。——金城真" }, { kind = "affinity", person = "kinjo_shin", value = -3 }, { kind = "flag", flag = "c13_request_kinjo_shin_late" }] }

[[tracks.chapters.choices]]
key = "read_register"
text = "自己读驿里的簿子，把义冢的位置、修船铺的街名都抄下来。"
next = "reply"
