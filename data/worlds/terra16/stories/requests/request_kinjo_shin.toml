# 收尾（读了簿子，或花钱誊了清单）：回那霸，他把名单挪到最后一行，问那个不是岛的名字该往哪里写。
[[tracks.chapters]]
key = "reply"
title = "七个名字"
text = "回到那霸的那天，金城真已经在书记房里等着。窗外贡船的水手正把晒干的帆布一卷卷收进舱里。他把带回来的清单铺在名单旁边，一个名字一个名字地挪过去：回来的，划一道；葬在义冢的，画一个圈。挪到第七个，他停住了。“这个人没死，也没回来。”他的手指按在那一行上，“名字该写在哪座岛名下？他不在海里，也不在那霸。”"
