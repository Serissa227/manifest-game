key = "report_colophon"
title = "差一个字"
text = "海关的木桌上摊着两张纸：一张是抄来的开头，一张是末页的题记，写着抄于开罗。萨利赫把老师口述的两句写在第三张纸上，和抄本并排放着。老师说的是“海”，抄本上写的是“路”，中间就隔着这一个字。他看了很久，手指停在那一格上。“这个字到底听谁的，你替我想想。”他说完，把题记又推过来给你看。"
speaker = "captain"
mood = "tender"
at = "alexandria"
