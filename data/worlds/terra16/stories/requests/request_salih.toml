# 请托：老师记得的两句（request_salih）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：萨利赫（salih，1540-12-25 生，男），也门来的穷学生，天不亮先给失明的老师读书，再去讲席；势力 ottoman，身份档 1。cast：cast/classmates_cairo.toml。
# 类型：去某处（gs）。四章：offer（报价）、arrive（吉达的书摊）、report 与 report_colophon（两种收尾）。没有 stage 章，因此没有 window 与 default。
# 报价：V（到访）。人物住在开罗，下到亚历山大港（alexandria）取寄错的书，auto=true；窗口 1564-01-01 至 1588-12-31，同学重逢之后开放。
#       offer 写 family=c13_offer_alexandria、冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：arrive 章 deadline_days=120，超时走 failed，来信一封，好感 -3，旗标 _late，见闻单独写；两个收尾章是普通章，可以一直等。
# 分章：题记旗标（colophon）只由 read_colophon 设。若 report 同时接 talk_him_round 与 pay_copy，两人的 both_lines 选项会永远挡住，所以念出题记的那条路单独通向 report_colophon（三个选项）；report 只给两个选项。两章各有自己的正文与回复。
# 检定：arrive 的 talk_him_round 用 eloquence（一般：base 20 / per 7）；失败走 fail 分支，设 _short。引擎的失败分支没有正文字段，失败的叙述由 report 的 v1_short 变体承担。
# 依据·史实背景：开罗与汉志之间的抄本流通；朝觐季吉达港边的书摊，朝圣客与书贩挤在帐篷之间。
# 依据·原创：那部没有书名的旧游记；萨利赫的老师；书贩与他的弟弟；开头两句（“海”与“路”只差一个字）；《卡布斯教诲录》作谢礼。
# 秘密：涨水节那首诗（归 bond_salih）不碰；见闻不写老师的名字，也不写萨利赫读过什么书。
# 读的旗标：bond salih 至少 C（offer 的 v1_bond 变体，只读）。
# 设的旗标：c13_request_salih_accepted（offer 两条接法）、_declined（offer 回绝）、_colophon（arrive 念出两句并抄到题记）、_short（arrive 检定失败，只抄到开头）、_late（arrive 超时）、_done（两个收尾章的两个最好结局之一）、_partial（两个收尾章的照老师的写）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不写恋爱。
# 报酬：现金最多 900（折中 600）；好感最多 +13（2 + 3 + 8）；名声 +2（只在两个最好结局之一）；唯一奖励 qabus_ms（只在两个最好结局之一给一次）；回忆 mem-request_salih-report。报酬数字不进正文。
# 依赖：港口 alexandria（ports_north_africa.toml）、jeddah（ports_red_sea_gulf.toml）；技能 lang_arabic（skills.toml）；属性 eloquence；物品 qabus_ms（items/books_05_commerce.toml）；人物 salih。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_salih-report「并排的两行开头」：海关的木桌上，两张纸并排，一张写着“海”，一张写着“路”，中间一道小斜线。report_colophon 的两个最好结局用的是同一幅。

[[tracks]]
key = "request_salih"
name = "老师记得的两句"
kind = "request"
start = "offer"
auto = true
cast = ["salih"]

# 一、开头两句：亚历山大港的海关门口，萨利赫抱着一摞书，等一包寄错地方的书。
[[tracks.chapters]]
key = "offer"
title = "开头两句"
text = "海关门口的木凳上，萨利赫抱着一摞没理完的书，见你来，先把最上面那本合起来。这包书是从开罗寄错了地方的。他替失明的老师编书目，编到一部旧游记，老师只记得开头两句，开罗的书市翻遍了也找不到。他把那两句念给你听，一字一顿，像是替老师念的。“风从哪边来，我就从哪边走；凡是我走过的海，都记在星星底下。”念完他停了停，“朝觐季的吉达，有人说书摊上见过这一部。可我走不开，先生每天的书都要有人念。”"
speaker = "captain"
mood = "tender"
at = "alexandria"
objectives = [{ kind = "at", at = "alexandria", text = "亚历山大港的海关门口" }]
when = [{ kind = "date", from = [1564, 1, 1], to = [1588, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "salih", ge = 18 }]
deadline = [1588, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_alexandria"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_bond"
when = [{ kind = "bond", person = "salih", level = "C" }]
text = "海关门口的木凳上，萨利赫抱着一摞没理完的书，看见你就笑了一下，把最上面那本往你这边推了推。“你记城，我记书，这回换你记书。”他说。这包书是从开罗寄错了地方的。他替失明的老师编书目，编到一部旧游记，老师只记得开头两句，开罗的书市翻遍了也没有。他念给你听，一字一顿：“风从哪边来，我就从哪边走；凡是我走过的海，都记在星星底下。”念完，他说朝觐季的吉达有人见过这部书，可他走不开，先生每天的书都要有人念。"

[[tracks.chapters.choices]]
key = "go_jeddah"
text = "接下，去吉达把那部书的开头抄回来。"
next = "arrive"
reply = "他把两句话写在一张纸上，又在下面画了一道短线，线下的地方留着不写。“抄到这里停。”他说，“后面的，老师要自己听。”"
effects = [{ kind = "affinity", person = "salih", value = 2 }, { kind = "flag", flag = "c13_request_salih_accepted" }]

[[tracks.chapters.choices]]
key = "ask_title"
text = "接下，先问：这部书总该有个名字吧？"
next = "arrive"
reply = "“老师说书名是后人加的，开头才是作者的。”他说完低下头，像是替老师不好意思。"
effects = [{ kind = "affinity", person = "salih", value = 2 }, { kind = "flag", flag = "c13_request_salih_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "朝觐季的吉达我挤不进去。"
next = "failed"
reply = "他点点头，没有再劝。“那就明年。”他说完，把那一摞书抱起来，往仓房那边走了。"
effects = [{ kind = "flag", flag = "c13_request_salih_declined" }]

# 二、朝觐季的书摊：吉达，书贩要你证明你认得那部书。
[[tracks.chapters]]
key = "arrive"
title = "朝觐季的书摊"
text = "吉达的书摊挤在朝觐客的帐篷之间，白天卖书，夜里跟着驼队走。一个也门书贩说，他见过那部游记，书在他弟弟手里，弟弟明天一早就上麦加。书贩打量你，手里转着一支芦管笔：“你认得那部书？认得，就念给我听。不认得的人，我不让他抄。”他的弟弟站在帐篷后头，抱着一摞还没捆好的纸，一句话也没说。"
speaker = "captain"
mood = "tense"
at = "jeddah"
objectives = [{ kind = "at", at = "jeddah", text = "吉达的书摊" }]
when = [{ kind = "alive", person = "salih", value = true }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "salih", value = -3 }, { kind = "flag", flag = "c13_request_salih_late" }, { kind = "letter", person = "salih", text = "吉达的书贩已经上了麦加。老师说，两句也够了，书目上那一行先空着。" }], news = "吉达的书摊早就收了摊，也门书贩的弟弟前一天就上了麦加，那部旧游记到底没人抄。" }
news = "朝觐季的吉达，一个也门书贩为了一部旧游记，让弟弟晚了一天上麦加，书摊前站满了来看热闹的人。"

[[tracks.chapters.choices]]
key = "read_colophon"
text = "当场念出那两句开头，再请他让我看末页的题记。"
next = "report_colophon"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_arabic", ge = 60, hard = true }]
hint = "书贩的弟弟写的是连笔，你只认得出一半的字，念不成句。"
reply = "我念完，书贩的弟弟听得很认真，没有插一句话。他转身回了帐篷，半夜把书连同末页一起送了来。开头果然是那两句，只差一个字。题记写着抄于开罗，哪年哪月都清清楚楚，我连题记一起抄了。"
effects = [{ kind = "affinity", person = "salih", value = 3 }, { kind = "flag", flag = "c13_request_salih_colophon" }]

[[tracks.chapters.choices]]
key = "talk_him_round"
text = "跟他讲失明的老师与那份书目，求他通融一夜。"
next = "report"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "书贩听完，掀开门帘往外看了一眼驼队，又把门帘放下。他说他的老师也瞎了一只眼，怕的就是书没人念。他让弟弟晚一天上麦加。弟弟抄了开头两句，末页的题记不肯让抄，说那是书贩自己的记号。"
effects = [{ kind = "affinity", person = "salih", value = 3 }]
fail = { next = "report", effects = [{ kind = "affinity", person = "salih", value = -2 }, { kind = "flag", flag = "c13_request_salih_short" }], news = "吉达的书摊上，一个说话很轻的也门学生求书贩通融，书贩摇摇头，说弟弟明天就上麦加。" }

[[tracks.chapters.choices]]
key = "pay_copy"
text = "照抄书的行价付钱，请书贩的弟弟抄。"
next = "report"
requires = [{ kind = "cash", ge = 200 }]
hint = "身上的钱不够这一趟的行价，书贩不肯赊。"
reply = "弟弟抄得很快，字也工整，抄完又从头数了一遍。书贩从箱底翻出一部《卡布斯教诲录》，说开罗人爱读这个，翻了两页又收回了箱子里。"
effects = [{ kind = "cash", value = -200 }, { kind = "affinity", person = "salih", value = 2 }]

# 三、差一个字：他又下到港口取书，两份开头并排放着。这一章是没有念出题记的两条路。
[[tracks.chapters]]
key = "report"
title = "差一个字"
text = "海关的木桌上只剩两张纸和一杯凉掉的咖啡。萨利赫把抄来的开头与老师口述的两句并排放着，手指一个字一个字地移。差了一个字：老师记的是“海”，抄本上是“路”。他没有马上说话。“先生说过，耳朵比眼睛记得牢。”说完，他自己也沉默了。“这一个字，我不敢替他改。”他抬起头，等你说话。"
speaker = "captain"
mood = "tender"
at = "alexandria"
objectives = [{ kind = "at", at = "alexandria", text = "亚历山大港的海关" }]
when = [{ kind = "alive", person = "salih", value = true }]
news = "亚历山大港海关门口，替盲先生取书的也门学生对着两张纸念了一下午，念到一半又停下来。"

[[tracks.chapters.variants]]
key = "v1_short"
when = [{ kind = "flag", flag = "c13_request_salih_short" }]
text = "海关的木桌上只剩两张纸和一杯凉掉的咖啡。萨利赫把抄来的两句与老师口述的两句并排放着，手指一个字一个字地移。差了一个字：老师记的是“海”，抄本上是“路”。书贩催得急，题记他一个字也没抄到。“没有题记，就只能照这两句写。”他说，声音很低，像在问自己。他抬起头，等你说话。"

