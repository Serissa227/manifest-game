mood = "tense"
at = "jepara"
when = [{ kind = "date", from = [1573, 6, 1], to = [1574, 5, 31] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 30 }]
deadline = [1574, 5, 31]
timeout = { next = "failed" }
family = "c13_offer_jepara"
family_cooldown_days = 20

