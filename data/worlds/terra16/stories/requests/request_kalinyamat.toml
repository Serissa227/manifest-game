# 请托：扎巴拉的火药（request_kalinyamat）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：卡林亚玛特女王（kalinyamat，生年不详，cast 占位 0；卒于 1579，女，扎巴拉之主）。cast：cast/historical_03_indian_ocean.toml。
# 类型：混合（mixed）。五章：offer（报价）、supply（送货：米五十袋、硫磺二十担，到扎巴拉）、strait（去某处：数马六甲外海的巡船）、patrol（巡船拦下，转折）、report（女王见客，收尾）。终点 done / failed。
# 报价：L（来信／代理人）。auto=true；offer 章 at=jepara，出面的是宰相（代理人，不新建 cast，offer 不写 speaker）。family=c13_offer_jepara，冷却 20 天；deadline 为 1574-05-31，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window、default）。offer 1573-06-01 至 1574-05-31；supply、strait、patrol 1573-06-01 起；report 至 1574-08-31。
# 进行中：supply 期限 180 天，strait 期限 90 天，超时走 failed，各一封来信、好感 −3 或 −5，旗标 _late；report 期限至 1574-08-31。patrol 没有期限，只等两天。
# 门禁：玩家 17 岁以上；名声 ≥ 30（表里 fame_gate）。请托人是历史人物，offer 之后的章节不写 age 条件。
# 依据·史实背景：1574-10 至 1575-03 卡林亚玛特的舰队围攻马六甲，女王本人没有随军（cast 写明）。本条止于 1574-08-31，舰队的结果不写。扎巴拉以柚木造船；硫磺从琉球一带向外输出；火药要用硫磺。
# 依据·原创：宰相、铜牌、粮仓管事、火药坊老匠人、马来渔夫、堡里的炮手、巡船军官、画了记号的木板。
# 改动：表里的 gunpowder×10 改为 sulfur×20（数据里火药只在伊斯坦布尔、威尼斯有货，路程太远；硫磺是做火药的原料）。货款按 1.25 倍重算为 1500。
# 秘密：“仇人不死便不着衣裳”的传说本条不写（没人敢当面提，她也不接）。
# 口头禅：“先说一件我不知道的事，再谈别的。”只在 report 当面用一次。
# 读的旗标：c13_main_kaicili（offer 的 variant：宰相认出凯奇利，只这一句；由主线第一章设，尚未写）；c13_request_kalinyamat_fort_weak（report 的 variant）；c13_request_kalinyamat_board_lost（report 的 variant）；c13_request_kalinyamat_half_count（patrol 的 variant）。
# 设的旗标：accepted（offer 接下）、declined（offer 回绝）、rice_gift（supply 米不收钱）、counted（strait 数清了）、half_count（strait 数船检定失败）、fort_weak（strait 炮手）、board_lost（patrol 木板没了）、late（超时）、done（report 实话）、partial（report 讨好）。其中 accepted、declined、rice_gift、counted、late、partial、done 只设不读，留给别处。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不写 bond 条件。
# 依赖：港口 jepara、malacca（ports_southeast_asia.toml）；商品 rice、sulfur；技能 lang_portuguese；属性 seamanship、eloquence；势力 kalinyamat、portugal；人物 kalinyamat。B10b 改名：无需。
# 报酬（各只给一次）：货款 1500（送米一路 750）＋报酬 4700（讨好 3000）；好感最多 +22（送米一路）；名声 +7；卡林亚玛特声望 +4、葡萄牙声望 −2；回忆 mem-request_kalinyamat-report。
# 回忆插画清单：
#   mem-request_kalinyamat-report「柚木船壳前的女王」：船厂高台上，女王站着，手边压着一张写满名字的纸；身后的柚木船壳一直架到棚顶。

[[tracks]]
