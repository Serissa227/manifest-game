# 二、粮仓与火药坊：米进仓，硫磺进火药坊，管事问钱怎么算。
[[tracks.chapters]]
key = "supply"
title = "粮仓与火药坊"
text = "米进了粮仓，一袋袋码到房梁下，袋口的麻绳上还挂着港口的湿沙。硫磺抬到火药坊，木桶一揭盖，黄色的粉末呛得人往后退。火药坊的老匠人捏起一撮，搓了搓，又凑近闻了闻，点头：“是干的。”粮仓的管事拿着铜牌对账，笔尖蘸了两次墨，抬头问你：“米钱和硫磺钱，是一起算，还是分开算？”"
speaker = "captain"
mood = "tense"
at = "jepara"
when = [{ kind = "alive", person = "kalinyamat", value = true }]
objectives = [{ kind = "goods", good = "rice", qty = 50, at = "jepara", text = "把稻米（50）运到扎巴拉" }, { kind = "goods", good = "sulfur", qty = 20, at = "jepara", text = "把硫磺（20）运到扎巴拉" }]
deadline_days = 180
