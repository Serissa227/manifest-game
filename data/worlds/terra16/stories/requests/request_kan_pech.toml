[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "kan_pech", level = "C" }]
text = "“你知道我写的是什么，别说出来。”坎·佩奇先说了这一句，才把门闩拉开一条缝。屋里的光只从板缝漏进来。桌上一张纸，写满了十种拼法，划掉的比留下的多。“玛雅话里有几个音，西班牙字母里没有，”他说，“修士给它添了一个倒过来的 c，我看着别扭。”他停了停，把纸往你这边推了推，“你的船上有没有西班牙人的书？讲他们怎么拼自己话的那种。他们拼不出来的时候，是怎么办的，我想看看。”"

# 二、西班牙人的办法：语法书交到他手里。他翻到讲字母的那一章，看见别人的难处。
[[tracks.chapters]]
key = "handin"
title = "西班牙人的办法"
text = "坎·佩奇接过语法书，没急着翻，先把封皮上的作者名念了一遍，一个字母一个字母地念。他翻到讲字母的那一章，指尖停在页边一行小字上。那里有人用细笔改过三次的写法，改掉的字母还看得清。“他也拼不出来。”他说，声音很低，“他是怎么办的？”你还没答，他已经读到了，嘴唇跟着动：“照着嘴里的音，定一个写法。定了，就不改。”他把书合上，手按在封面上，过了很久才抬起头。"
