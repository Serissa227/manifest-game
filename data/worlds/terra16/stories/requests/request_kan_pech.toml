# 请托：拼不准的十个词（request_kan_pech）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：坎·佩奇（kan_pech，1539-12-16 生，男，romance 关闭），佩奇家的少年书记，梅里达方济各会学校出身，1562 年起在坎佩切码头边抄写家族的编年。cast：classmates_merida.toml（tracks 已含 request_kan_pech）。
# 类型：找东西（find），三章：offer（报价）→ handin（交书，给或借）→ use（念词定写法，结账）。没有 stage 章。
# 报价：V 到访，auto=true，报价港 campeche。窗口 1562-07-12 至 1590-06-30 写在 offer 的 when 里，offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
#       窗口在 handin 与 use 的 when 里也写了日期段，但这两章没有 default，不设 window。
# 目标：nebrija_grammar（内夫里哈《卡斯蒂利亚语语法》，items/books_11_languages.toml，有 shop）。handin 的 objectives 只查持有；“把语法书送给他”的选项写 item -1，“借他抄”的选项不扣。
# 报酬：现金最多 900（只定七个写法 600）；好感最多 +13；名声 +1；回忆 mem-request_kan_pech-use（只在完整定下的结局）。不给技能、海图与物品。
# 依据·史实：殖民早期的尤卡坦，玛雅书记用拉丁字母写本族语，后来有《佩奇抄本》一类的家族编年（名字为后人所起，待核）；方济各会修士为玛雅语的塞音造了倒写的 c（ɔ）等记号。
#       内夫里哈的《卡斯蒂利亚语语法》1492 年印于萨拉曼卡；正文只说伊比利亚与中美的书铺有卖，用传闻口吻，不写年份。
# 依据·原创：坎的台词，十个词的具体写法，坎佩切码头边的那间屋，“定了就不改”这句话，七个写法与三个写法的分界。
# 秘密：家里的历书。本请托不碰，正文与见闻一律不写旧历、历书、夹页；请托只写“用拉丁字母记家族的编年”。
# 读写旗标：读 bond kan_pech ≥ C（offer 的 bond_c 变体，他先说一句提醒）；写 c13_request_kan_pech_accepted / _declined / _given / _done / _partial，分支旗标 _seven、_asked（_asked 由 offer 的 ask_friars 设，handin 的变体读）。不读不写任何 c7_ 旗标。
# 依赖：item nebrija_grammar；skill lang_yucatec（requires ≥ 60）；检定属性 eloquence；port campeche。B10b 改名：无。主线门禁：无。
# 日程：V 到访要求坎在报价期间能从近旁下到坎佩切港，整合方需查看 kan_pech 的 1562 年以后日程。
# 回忆插画：mem-request_kan_pech-use：一页编年上被划掉重写的一行日子，旁边一盏灯，两人并排对着念。

[[tracks]]
key = "request_kan_pech"
name = "拼不准的十个词"
kind = "request"
start = "offer"
auto = true
cast = ["kan_pech"]

# 一、拼不出来的音：坎佩切码头边的一间屋里。坎请你替他找一部西班牙人自己的语法书。
[[tracks.chapters]]
key = "offer"
title = "拼不出来的音"
text = "坎佩切码头边的一间屋子，门关着，窗也关着，只从板缝里漏进一条光。坎·佩奇趴在桌上，纸上一行词划了又写，写了又划。“十种写法，”他头也不抬，“一种都不对。”梅里达的修士教他拉丁字母，他拿来记家族的编年。可玛雅话里有几个音，西班牙字母里没有对应的，修士给它添了一个倒过来的 c，他看着别扭。“你的船上有没有西班牙人的书？讲他们怎么拼自己话的那种。”他把纸往你这边推了推，“他们拼不出来的时候，是怎么办的，我想看看。”"
speaker = "captain"
mood = "tense"
at = "campeche"
objectives = [{ kind = "at", at = "campeche", text = "在坎佩切的码头边" }]
when = [
  { kind = "date", from = [1562, 7, 12], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "kan_pech", ge = 18 },
]
