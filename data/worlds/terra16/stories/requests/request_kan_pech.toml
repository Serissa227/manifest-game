text = "接下，先问：修士们没教过怎么拼吗？"
reply = "“教过。修士拼的，玛雅人念不出来。”他把纸翻过去，“我不用别人造的字。我要看的是西班牙人自己怎么拼自己的话。”"
next = "handin"
