[[tracks.chapters.variants]]
key = "asked"
when = [{ kind = "flag", flag = "c13_request_kan_pech_asked", value = true }]
text = "坎·佩奇接过语法书，先看了一眼封面，没有急着翻开。“修士那一套，我不用。”他说，声音不高，却很硬。然后他才翻到讲字母的那一章，指尖停在页边一行小字上。那里有人用细笔改过三次的写法，改掉的字母还看得清。“他也拼不出来。”他说，声音很低，“他是怎么办的？”你还没答，他已经读到了，嘴唇跟着动：“照着嘴里的音，定一个写法。定了，就不改。”他把书合上，手按在封面上，过了很久才抬起头。"

# 三、定了就不改：念那十个词，定下写法。第十个是一个日子的名字，他在编年里找到自己抄错的那一行。
[[tracks.chapters]]
key = "use"
title = "定了就不改"
text = "坎·佩奇请你坐下，把桌上那叠编年推到中间。“我念玛雅话，你照着我定的新写法念拉丁字母，念得对上了，就算定了。”纸上十个词，每个词后面是新写法。头几个还顺，念到第七个，他的嘴角抽了一下，你跟着念偏了一个元音，他摇头，在纸上改掉一个字母。念到第十个，是一个日子的名字，他停下来，把编年翻到一行，皱起眉。“日子说错了。”他的指头按在那一行上，“我自己抄错了一天。”"
speaker = "captain"
mood = "tender"
at = "campeche"
objectives = [{ kind = "at", at = "campeche", text = "在坎佩切的屋里" }]
when = [
  { kind = "alive", person = "kan_pech", value = true },
  { kind = "date", from = [1562, 7, 12], to = [1590, 12, 31] },
]
news = "坎佩切码头边的一间屋里，梅里达来的书记把一本编年里的一天改了过来，改的是他自己抄错的那一天。"

[[tracks.chapters.choices]]
key = "read_yucatec"
text = "用玛雅话把那十个词跟他对一遍，帮他定写法。"
reply = "十个词，我念了三遍，他改了两处写法，最后一处是那个日子。他把错的那一天划掉，在旁边照新写法重写，说这一行，往后的人念得出来了。他付了钱。"
next = "done"
