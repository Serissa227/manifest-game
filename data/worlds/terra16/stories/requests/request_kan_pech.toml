]

[[tracks.chapters.choices]]
key = "decline"
text = "一部语法书，帮不了玛雅话。"
reply = "他点点头，没有再说什么，只把门又关严了一点。纸还摊在桌上，他把写满的那一张叠起来，压在编年底下。“那我再拼十种。”门里的笔尖声一直响到天黑。"
