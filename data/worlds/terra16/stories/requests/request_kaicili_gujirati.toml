when = [{ kind = "flag", flag = "c13_request_kaicili_gujirati_answered_well", value = true }]
text = "你回到特尔纳特，苏丹之弟亲自在回廊里等你。蒂多雷的回话只有一句：“账，一起算。”你念完，他把这句话在心里过了两遍，才抬起头。“老大臣说这句话的时候，脸朝哪边？谁亲眼看见的？”回廊外是港里的科拉科拉，桨都收着，一条挨着一条。柱子外的水声很响，有人在船上换帆，喊声一阵一阵地传过来。"

