# 请托：自己的那本账（request_catarina_pereira）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：卡塔丽娜·佩雷拉（catarina_pereira，1537-12-05 生，女），第一批在澳门落脚的葡萄牙船长之女；势力 portugal，身份档 1。cast：cast/story_eastasia.toml，日程 1557—1590 在澳门（macao，市集）。
# 类型：送货（deliver）。三章：offer（报价）、deliver（交货）、settle（结账）；没有 stage 章，因此没有 window 与 default。终点 done / failed。
# 报价：当面（T）。auto=false，玩家“问请托”（ask:request_catarina_pereira）启动；offer 章不写 at，目标是在港里找到她。窗口以 when 的 date 表达：offer 1575-01-01 至 1580-06-30（deadline 同日，timeout 直接 failed，不写见闻）；deliver 与 settle 1575-01-01 至 1580-12-30。
# 进行中：deliver 章 deadline_days=90，超时走 failed，来信一封，好感 -3，旗标 _late；settle 是普通章，可以一直等（先等 60 天）。
# 依据·史实背景：1570 年代起葡萄牙人每年去广州的交易会采买生丝，再装上去日本（长崎）与果阿的船；生丝按担论价，受潮的丝要吃亏，所以买家验货要从捆心抽。
# 依据·原创：卡塔丽娜与她的两本账、赌了一桶酒的管账（叙事人物，不进 cast，正文不写名字）、糖姜、舱单上的货主一栏。
# 结算章用“日本回来的头一条小快船”捎回账单和银子，不等大船返航——只为 wait 60 天的跨度说得通。
# 秘密：她最初的本钱从哪来，一字不写；账本只写“她自己的账”。见闻不写。
# C7：不写陆归帆（1557—74 的恋爱线）、不写林蕙与马尼拉（1581—84）；不写婚事。本文件不读也不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 口头禅（招呼语）：“刚下船？找哪一家、住哪条街，说吧——澳门没有我指不了的门。”只在 offer 章用一次。
# 读的旗标：c13_request_catarina_pereira_off_days（deliver 的 variant，只改文字）、_said（settle 的 variant，只改文字）。
# 设的旗标：_accepted（offer 两条接法，含检定失败）、_declined（offer 回绝，终局）、_off_days（offer 算日子检定失败；只设不碰选项）、_said（deliver 退到一边让她自己说）、_late（deliver 超时，终局）、_done（settle 两条收尾，终局）。全部为 c13_request_catarina_pereira_<事件>。
# 报酬：现金最多 900（settle）+ 2750（生丝货款，deliver 付一次）；好感最多 +16；名声 +2；回忆 mem-request_catarina_pereira-settle（只给 settle 的“给他看”）。
# 依赖：B10b 改名 macau→macao（当面模式，人物日程）；港口 macao、guangzhou（ports_east_asia.toml）；货物 raw_silk（goods/02_manufactures.toml）；检定属性 numeracy；人物 catarina_pereira。主线门禁：无。
# 回忆插画清单：
#   mem-request_catarina_pereira-settle「薄账上的第一笔」：一张厚重的旧木桌上并排放着两本账，左边厚、封皮裂了口，右边薄、封皮上写着一个女子的名字；桌角压着一小袋银子，窗外是澳门午后的海面和一排桅杆。

[[tracks]]
key = "request_catarina_pereira"
name = "自己的那本账"
kind = "request"
start = "offer"
auto = false
cast = ["catarina_pereira"]

# 一、薄的那本：栈桥口的酒桶上摆着两本账，她要找的是一扇自己的门。
[[tracks.chapters]]
key = "offer"
title = "薄的那本"
text = "“刚下船？找哪一家、住哪条街，说吧——澳门没有我指不了的门。”卡塔丽娜见谁都先来这么一句，说完才看清是你，自己笑了。她面前一只翻过来的酒桶上摆着两本账，厚的封皮裂了口，薄的封皮上是她自己的名字。“今天是我要找一扇门。”她拍拍薄账，“二十担生丝，从广州的交易会运回澳门，赶上去日本的船。我父亲的管账在码头上赌了一桶酒，说我头一笔就赔。”她把薄账翻开，第一页什么也没写。“赔了，记在这本上；赚了，也记在这本上。我不要你替我赚，只要你替我运。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "catarina_pereira", text = "在港里找到她" }]
when = [
  { kind = "date", from = [1575, 1, 1], to = [1580, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "alive", person = "catarina_pereira", value = true },
]
deadline = [1580, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "接下，替她运二十担生丝。"
next = "deliver"
reply = "她蘸了墨，在薄账第一页写下日期和你的船名。字比厚账上的小，一笔一笔压得很实。“丝你自己去广州挑，每捆从中间抽一绺看，面上那层，谁家的都是好的。”她吹干墨，“运回来先到我这儿。别让旁人的嘴比你的船先到。”"
effects = [
  { kind = "affinity", person = "catarina_pereira", value = 2 },
  { kind = "flag", flag = "c13_request_catarina_pereira_accepted" },
]

[[tracks.chapters.choices]]
key = "advise"
text = "先帮她算：去日本的船几时开，丝几时到才不压价。"
next = "deliver"
check = { attr = "numeracy", base = 20, per = 7 }
reply = "你把船期、江上的潮汐、别家的丝几时进澳门一样样摆开，推出一个日子。她没看你的纸，先翻到自己那页，指甲点着一行小字。两个日子是同一天。“你算得跟我一样快。”她笑了，在那天底下划了一道，“那就这一天。”"
effects = [
  { kind = "affinity", person = "catarina_pereira", value = 3 },
  { kind = "flag", flag = "c13_request_catarina_pereira_accepted" },
]
fail = { next = "deliver", effects = [
  { kind = "affinity", person = "catarina_pereira", value = -2 },
  { kind = "flag", flag = "c13_request_catarina_pereira_accepted" },
  { kind = "flag", flag = "c13_request_catarina_pereira_off_days" },
] }

[[tracks.chapters.choices]]
key = "decline"
text = "父女的账，我不插手。"
next = "failed"
reply = "她把薄账合上，压到厚账底下，只露出封皮的一角。“成。”她说，“那这一单我另找船。”说着她已经朝栈桥那头挥起了手，嗓子提了起来，去招呼另一条刚靠岸的船。"
effects = [{ kind = "flag", flag = "c13_request_catarina_pereira_declined" }]

# 二、按市价收了：码头上，她一捆一捆验丝，管账踱过来。
[[tracks.chapters]]
key = "deliver"
title = "按市价收了"
text = "你的船靠上栈桥，二十担生丝一捆捆卸成一排。卸货归脚夫，验货她不假手，自己蹲下去：解开麻绳，从捆心抽一绺，举到太阳底下看光，捻断一根听声，最后用手背贴一贴有没有潮。脚夫把一捆撂重了，她骂了一句“轻点，这是丝，不是麻袋”，转头从袖袋里摸出一块糖姜塞给他。验到第十二捆，她父亲的管账踱了过来，算盘夹在腋下。“小姐，这批丝我按市价收了。”他笑得很客气，“免得你赔。”"
speaker = "captain"
mood = "tense"
at = "macao"
objectives = [{ kind = "goods", good = "raw_silk", qty = 20, at = "macao", text = "二十担生丝运到澳门" }]
when = [
  { kind = "date", from = [1575, 1, 1], to = [1580, 12, 30] },
  { kind = "alive", person = "catarina_pereira", value = true },
]
deadline_days = 90
timeout = { next = "failed", effects = [
  { kind = "affinity", person = "catarina_pereira", value = -3 },
  { kind = "flag", flag = "c13_request_catarina_pereira_late" },
  { kind = "letter", person = "catarina_pereira", text = "去日本的船开了，丝没赶上。我这本账上，第一笔是赔。赔的缘由我写了“船不等人”，没写是谁的错。那个管账船开那天在码头上没笑，我倒有点不习惯。下一回，我自己去广州挑丝。——卡塔丽娜" },
] }
news = "澳门码头上，葡萄牙船长家的女儿自己验了一批生丝，装上了去日本的船，她父亲的管账没收成。"

[[tracks.chapters.variants]]
key = "v1_off_days"
when = [{ kind = "flag", flag = "c13_request_catarina_pereira_off_days" }]
text = "你纸上的日子比她写的晚了五天。她没跟你争，只说了句“照我的来”，你就是照她的日子赶的。船靠栈桥那天，她已经在缆桩上坐了好一阵，一个字没提那五天。二十担生丝一捆捆卸成一排，她蹲下去验：从捆心抽一绺，举到太阳底下看光，捻断一根听声，用手背贴一贴有没有潮。脚夫撂重了一捆，她骂了一句，转头塞给他一块糖姜。验到第十二捆，她父亲的管账踱了过来，算盘夹在腋下。“小姐，这批丝我按市价收了。免得你赔。”"

[[tracks.chapters.choices]]
key = "hers"
text = "说：丝是替她运的，交给她。"
next = "settle"
reply = "管账的嘴唇动了动，把算盘从左边腋下换到右边，悻悻地走了。卡塔丽娜叫人把丝抬上去日本的船，舱单上货主一栏，她写的是自己的名字。写完回到薄账上记了一笔，记完才转身，把货款数给你。"
effects = [
  { kind = "cash", value = 2750 },
  { kind = "affinity", person = "catarina_pereira", value = 5 },
]

[[tracks.chapters.choices]]
key = "let_her_decide"
text = "退到一边，让她自己跟管账说。"
next = "settle"
reply = "你退到缆桩后头。她站起身，拍掉膝盖上的灰，用葡萄牙话说了一句：“我的丝，用不着您的算盘。”声音不高，也不快。管账的脸一点点红到耳根，把算盘夹紧，走了。她回过头，对着你吐出一口气：“这一句，我憋了好几年。”然后才把货款数给你。"
effects = [
  { kind = "cash", value = 2750 },
  { kind = "affinity", person = "catarina_pereira", value = 3 },
  { kind = "flag", flag = "c13_request_catarina_pereira_said" },
]

# 三、第一笔是赚：长崎捎回的账单，茶摊条凳上摊着薄账。
[[tracks.chapters]]
key = "settle"
title = "第一笔是赚"
text = "日本回来的头一条是只小快船，没等大船，先把长崎的账单和一袋银子捎了回来。卡塔丽娜在码头边的茶摊上把薄账摊开，小指压着一行，一行念给你听：二十担，货主一栏是她的名字，第一笔，赚。她念完没笑，把算盘珠子拨回零。“我父亲这几天走过我摊子三回，一回也没问。”她看着你，“你说，这本账要不要给他看？他一看，保不齐就想替我记下一页。”"
speaker = "captain"
mood = "cheerful"
at = "macao"
objectives = [{ kind = "wait", days = 60, text = "等日本回来的船捎来账单" }]
when = [
  { kind = "date", from = [1575, 1, 1], to = [1580, 12, 30] },
  { kind = "alive", person = "catarina_pereira", value = true },
]
news = "澳门那位葡萄牙船长的女儿自己做的第一笔生丝赚了，听说账本一页也没让她父亲改。"

[[tracks.chapters.variants]]
key = "v1_said"
when = [{ kind = "flag", flag = "c13_request_catarina_pereira_said" }]
text = "日本回来的头一条是只小快船，没等大船，先把长崎的账单和一袋银子捎了回来。卡塔丽娜在茶摊上把薄账摊开，念完那一行——二十担，货主一栏是她的名字，第一笔，赚——才说：“管账那天在码头上挨的那句话，隔天就到了我父亲耳朵里。他让人带话来，要看看这本账。”她把算盘珠子拨回零，“你说，给，还是不给？他一看，保不齐就想替我记下一页。”"

[[tracks.chapters.choices]]
key = "show"
text = "给他看：赚了的账，没什么好藏。"
