# 收尾（不抄表）：两张图并排。迪伊的第三句直接引语在这里，他说要把它写进书里。
[[tracks.chapters]]
key = "report"
title = "两张图并排"
text = "我把小册子摊在迪伊的桌上，他把它和墙上的北方海图并排对着看。他一边念一边在旧图的边上画线，越画越快，线条歪到了纸外头也不管。朝廷那边只来信催稿，他说，连一张北方的图都拿不出来，还好意思催。忽然他停下笔，指着那一排一天一行的数：“这些能证明，女王该有一支自己的远洋船队，不必再求汉堡的船和荷兰人的船。”声音一下子高了起来，“我要把它写进书里。”"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "alive", person = "john_dee", value = true }]
objectives = [{ kind = "person", person = "john_dee", text = "回莫特莱克，把册子交到迪伊手里" }]
