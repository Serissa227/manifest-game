fail = { next = "report", effects = [{ kind = "affinity", person = "john_dee", value = -2 }, { kind = "flag", flag = "c13_request_john_dee_gaps" }], news = "卑尔根商站的人都在传：那个英格兰船的小册子空了好几天，风浪太大，罗盘读不稳。" }

[[tracks.chapters.choices]]
key = "copy"
text = "抄他的表，注明是谁的"
reply = "老领航员很得意，让我把他的名字写大一点。他一边看我抄，一边讲每道刻线的来历，讲到要紧处就拍一下桌子，说这是他父亲那一代人留下的规矩。"
news = "卑尔根商站的人都在笑：汉萨的老领航员让英格兰人抄去了表，得意得很，非要人家把他的名字写大一点。"
next = "copied"
