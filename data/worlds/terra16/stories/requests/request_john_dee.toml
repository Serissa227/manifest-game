text = "小册子里有几天是空的。迪伊一页页翻过去，翻到那几处停了停，我在旁边写了个“风”字，他看见了，没说什么。他拿笔尖点着别的数，一边念一边在旧图的边上画线。朝廷那些人只会催稿，他骂了一句，又回到图上。忽然他停下笔：“空着的那几天不碍事，风里的罗盘本来就不肯老实。其余的数能证明，女王该有一支自己的远洋船队。”他说要把它写进书里。"

# 收尾（抄了汉萨人的表）：只在 north 选了“抄他的表”时走到这里。
[[tracks.chapters]]
key = "copied"
