text = "那位重臣的宅子在府内城下的高处，院里晒着刚洗过的马具。老人是夫人的公公，坐在廊下擦一把短刀，听你说完，把雪的信接过去，看了一眼封口的家纹，搁在膝边，没拆。“武家的女人，管家，管账，管孩子。”他把刀翻过来接着擦，“歌是公家人的消遣。京都的小姐闲，我家的媳妇不闲。”你想起堺的老家仆说的删得掉的字，没急着答。屏风后面响了一声纸，很轻，又停了。老人也听见了，没回头，擦刀的布慢了半拍。"

# result · 堺的码头：老家仆接过老人的回信，拆开雪写给你的短笺
[[tracks.chapters]]
key = "result"
title = "回信"
text = "老家仆又下到堺，在码头上接过老人的回信，看了看封口，收进怀里。然后他从袖子里取出另一封，说是小姐写给你的，嘱咐要当着你的面拆。府内的使者比你的船先到京都，夫人寄去的第一首歌，小姐已经读过了。短笺只有一行：“删掉两个字，就好了。”下面附着夫人那首歌的原样，是小姐照抄的，写的是府内城下的晚潮。其中两个字旁边，各用极细的笔画了一个圈。没有删。"
speaker = "captain"
mood = "tender"
at = "sakai"
when = [{ kind = "alive", person = "reizei_yuki", value = true }]
objectives = [{ kind = "wait", days = 20, text = "等府内的第一首歌先到京都" }]
news = "堺的码头上，冷泉家的老家仆收下一封府内来的回信。听说京都那位小姐收了个丰后的学生，隔着一片海改歌。"

[[tracks.chapters.choices]]
key = "ask_circle"
text = "问家仆：小姐为什么只圈、不删？"
next = "done"
effects = [{ kind = "cash", value = 1600 }, { kind = "affinity", person = "reizei_yuki", value = 8 }, { kind = "fame", value = 2 }, { kind = "skill", skill = "poetry", value = 20 }, { kind = "flag", flag = "c13_request_reizei_yuki_done" }, { kind = "memory", memory = "mem-request_reizei_yuki-result", title = "圈出来的两个字" }]
reply = "老家仆笑了，皱纹挤到一起。他说小姐讲过，删是先生的事，圈是请学生自己删；圈了还删不掉的，那两个字就该留着。他把小姐的谢礼交给你，又说小姐让你也作一首寄去，“坏歌也寄来”。他说这句话时学着小姐的口气，学得不像，自己先摇了头。"

[[tracks.chapters.choices]]
key = "send_word"
text = "托家仆带一句话：夫人的歌，我在府内听她念过。"
next = "done"
effects = [{ kind = "cash", value = 1600 }, { kind = "affinity", person = "reizei_yuki", value = 7 }, { kind = "fame", value = 2 }, { kind = "skill", skill = "poetry", value = 20 }, { kind = "flag", flag = "c13_request_reizei_yuki_done" }, { kind = "memory", memory = "mem-request_reizei_yuki-result", title = "圈出来的两个字" }]
reply = "老家仆把这句话低声念了两遍，记下了。他说小姐听了会高兴，只是不会说，多半回一封信，比这句还短。他把小姐的谢礼交给你，收好那张短笺上船前，又折回来问你：夫人念的时候，那两个字念得重不重。"

# result_poem · 堺的码头：老人没准，只带回一首歌
[[tracks.chapters]]
key = "result_poem"
title = "只带回一首歌"
text = "老人没有松口。你起身告辞，走过屏风边上，底下伸出一只手，递出一张折得极小的纸，边上有一道指甲压出的印子，像是攥了很久。屏风后面一句话也没有，老人坐在廊下，擦刀的布停了停，没拦。到了堺，老家仆已经又下到码头，接过这张纸，没拆。他说小姐的东西他不拆，又从怀里取出一封早写好的短笺：他动身前，小姐交代过，要是只带回一首歌，就给船长看这一封。短笺上一行字：“学不学，歌已经在了。”"
speaker = "captain"
mood = "tender"
at = "sakai"
when = [{ kind = "alive", person = "reizei_yuki", value = true }]
news = "堺的码头上，冷泉家的老家仆从一个船长手里接过一张折得极小的纸，说是丰后一位夫人的歌，没拆就上了京都。"

[[tracks.chapters.choices]]
key = "as_is"
text = "什么也不添，请他把那张纸原样带上京都。"
next = "done"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "reizei_yuki", value = 8 }, { kind = "fame", value = 2 }, { kind = "skill", skill = "poetry", value = 20 }, { kind = "flag", flag = "c13_request_reizei_yuki_partial" }, { kind = "memory", memory = "mem-request_reizei_yuki-result", title = "圈出来的两个字" }, { kind = "letter", person = "reizei_yuki", text = "夫人的歌读了。删掉两个字，就好了。我只圈出来，没删，留给她自己删。老人那边，不必再去。——雪" }]
reply = "老家仆把那张纸包进油纸，包了两层，和来时包信的一样。他把小姐的谢礼交给你，说小姐读了歌会回信，回什么他猜不到。走到跳板边，他又回头说，小姐的信要是回得慢，就是还在删，请船长别急。"

[[tracks.chapters.choices]]
key = "screen_word"
text = "托他带一句：屏风后的纸响，老人听见了，没拦。"
next = "done"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "reizei_yuki", value = 7 }, { kind = "fame", value = 2 }, { kind = "skill", skill = "poetry", value = 20 }, { kind = "flag", flag = "c13_request_reizei_yuki_partial" }, { kind = "memory", memory = "mem-request_reizei_yuki-result", title = "圈出来的两个字" }, { kind = "letter", person = "reizei_yuki", text = "夫人的歌读了。删掉两个字，就好了。我圈了出来，没删。你带的那句话，我抄在她的歌后面，一个字也没删。——雪" }]
reply = "老家仆把这句话念了两遍，念到“没拦”停下来，点了点头。他说这一句，小姐会抄下来。他把小姐的谢礼交给你，把那张纸揣进怀里贴身放好，说这一回他走陆路上京，不坐船，怕纸受潮。"
