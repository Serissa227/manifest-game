# 请托：删两个字（request_reizei_yuki）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude（Opus）执笔。仅中文。
# 人物：冷泉雪 reizei_yuki（1540-02-04 生，女），京都冷泉家的小姐，歌道世家出身。cast 见 cast/classmates_kyoto.toml。
#       雪本人不出场（她在京都），只在信、短笺与来信里说话；出面的是冷泉家的老家仆（叙事人物，不起名、不建 cast）。
# 类型：说服某人（persuade）。报价：到访（V），auto=true，报价港堺（sakai），family=c13_offer_sakai，冷却 20 天。
# 窗口：offer 1564-01-01 至 1575-06-30（when 与 deadline；与鞠千代 1576 年起的府内押运错开）。
#       persuade 期限 90 天（同一海区）；result 与 result_poem 是普通章，不设期限。
# 章节：offer 一封短信（堺）→ persuade 老人的规矩（府内，三条路）
#       → result 回信（三条路成功进入）或 result_poem 只带回一首歌（argue 检定失败进入）。
# 结构：简报写的是三章，result 的“只带回歌”写成变体并改报酬与终局旗标。变体改不了选项效果，
#       所以照最接近的合法结构拆成第四章 result_poem：argue 失败走 next 进入它，报酬 900、终局旗标 partial。
#       result 只由设了 allowed 的三条路进入，所以 send_word 不写 requires（简报的 requires allowed 恒成立）。
#       检定失败时不显示选项的回复，失败的经过由 result_poem 的正文与失败分支的见闻交代。
#       result 加一个 20 天的 wait：府内的使者把夫人的第一首歌先送到京都，雪读过、写好短笺，老家仆再下到堺。
#       result_poem 不等：雪临走前写好了“只带回一首歌”时给船长看的短笺；她读过歌以后的话由来信带到（口头禅在信里）。
# 依据（史实）：战国时京都的公家常下向地方，给武家传授和歌与古典；连歌师往来各国。丰后府内在大友氏治下是九州的大城。
# 依据（原创）：冷泉家的老家仆、府内那位重臣家的老人与夫人（叙事人物，不起名、不建 cast）、油纸包了两层的信、
#       老人擦的那把短刀、屏风后的纸响、雪用细笔圈出的两个字、下九州的连歌师。
# 不写：大友宗麟本人（澪的主线）；府内只写“一位重臣家”。汐（C7 的 pair_ushio_reizei_yuki）一字不提，不送信给汐。
#       雪的秘密（cast 的 secret）永远不碰，见闻不写。不写恋爱与心动；不用 relation / tie / bond / heart 效果。
# 读写的旗标：读 bond reizei_yuki 至少 C（offer 的变体，澪的老同学口气，只读）。
#       设 c13_request_reizei_yuki_accepted / declined / asked / allowed / poem_only / done / partial / late。
#       终局旗标每条路径只设一面：done（result）、partial（result_poem）、late（persuade 超时）、declined（回绝）；
#       offer 超时不设旗标、不写见闻。asked 只给 persuade 的变体改一句话。不读、不设任何 c7_ 旗标。
# 依赖：技能 poetry、court_etiquette（skills.toml）与港口 sakai、funai（ports_east_asia.toml）现成；唯一奖励无物品，
#       技能奖励 poetry +20；无改名依赖；主线门禁无。
# 回忆插画清单：
#   mem-request_reizei_yuki-result：堺的码头上，一张抄得工整的短歌摊在老家仆掌心，两个字旁边各有一个极细的墨圈。

[[tracks]]
key = "request_reizei_yuki"
name = "删两个字"
kind = "request"
start = "offer"
auto = true
cast = ["reizei_yuki"]

# offer · 1564 起 · 堺的码头：冷泉家的老家仆捧着一封短信
[[tracks.chapters]]
key = "offer"
title = "一封短信"
text = "堺的码头上，一位白发的老家仆在等去九州的船。见你下船，他先报了冷泉家的名号，才把手里捧着的信递过来：是小姐写给府内一位夫人的，也写给你。信只有几行，字瘦得像每一笔都掂过分量。丰后府内一位重臣家的夫人，托一位下向的连歌师带话，想跟她学作歌；夫家的老人不许，说武家的女人学歌没用。“请带这封信去府内，见那位老人。说不动，就带一首夫人自己写的歌回来。”最后一行另起，只有六个字：“坏歌也带回来。”"
speaker = "captain"
mood = "tender"
at = "sakai"
when = [{ kind = "date", from = [1564, 1, 1], to = [1575, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "reizei_yuki", ge = 18 }]
deadline = [1575, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "take_letter"
text = "接下信，搭下一趟船去府内。"
next = "persuade"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 2 }, { kind = "flag", flag = "c13_request_reizei_yuki_accepted" }]
reply = "老家仆把信用油纸包了两层，又用细绳扎紧，才放进你手里。他说小姐写这封信，前后删了三回，“最后比头一回短了一半”。他在冷泉家待了四十年，头一回见小姐给不认识的人写信，写完还问他：短了，会不会失礼。"

[[tracks.chapters.choices]]
key = "ask_why"
text = "接下信，先问一句：小姐怎么肯收武家的学生？"
next = "persuade"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 2 }, { kind = "flag", flag = "c13_request_reizei_yuki_accepted" }, { kind = "flag", flag = "c13_request_reizei_yuki_asked" }]
reply = "老家仆想了好一会儿，像在替小姐挑字。他说小姐讲过，歌不分公家武家，“只分删得掉的字和删不掉的字”。那位夫人托连歌师捎来的话里有一句歌，只有半首，小姐读了，一个字没改。"

[[tracks.chapters.choices]]
key = "decline"
text = "武家的家事，外人插不进去。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_reizei_yuki_declined" }]
reply = "老家仆把信收回袖子里，按了按，像是怕它飞走。他说不碍事，那他就在堺等下一条去九州的船，船上总有肯捎信的人。说完他朝你行了个礼，礼数一丝不差，转身回了码头边的茶棚。"

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "reizei_yuki", level = "C" }]
text = "堺的码头上，一位白发的老家仆在等去九州的船。你认得他，学院那几年，他常在门口替小姐撑伞。他把手里捧着的信递过来：是小姐写给府内一位夫人的，也写给你。信头两个字是“中君”，字瘦得像每一笔都掂过分量。丰后府内一位重臣家的夫人，托连歌师带话，想跟她学作歌；夫家的老人不许，说武家的女人学歌没用。“请带这封信去府内，见那位老人。说不动，就带一首夫人自己写的歌回来。”最后一行另起：“坏歌也寄来，你的也是。”"

# persuade · 府内 · 一位重臣家的宅子：老人在廊下擦刀，屏风后有纸响
[[tracks.chapters]]
key = "persuade"
title = "老人的规矩"
text = "那位重臣的宅子在府内城下的高处，院里晒着刚洗过的马具。老人是夫人的公公，坐在廊下擦一把短刀，听你说完，把雪的信接过去，看了一眼封口的家纹，搁在膝边，没拆。“武家的女人，管家，管账，管孩子。”他把刀翻过来接着擦，“歌是公家人的消遣。京都的小姐闲，我家的媳妇不闲。”屏风后面响了一声纸，很轻，又停了。老人也听见了，没回头，擦刀的布慢了半拍。"
speaker = "captain"
mood = "tense"
at = "funai"
when = [{ kind = "alive", person = "reizei_yuki", value = true }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "reizei_yuki", value = -3 }, { kind = "flag", flag = "c13_request_reizei_yuki_late" }, { kind = "letter", person = "reizei_yuki", text = "府内的事，我另托了一位下九州的连歌师。他去了，老人没拆信。你手里那封，不必送了。——雪" }], news = "府内一位重臣家的老人，听说又收到一封京都冷泉家的信，照旧搁在膝边没拆；屏风后面的夫人，这一季没往京都寄过一首歌。" }
news = "府内有位重臣家的老人，擦着刀听完一个船长的话，准了屏风后面的夫人往京都寄歌，跟冷泉家学。"

[[tracks.chapters.choices]]
key = "poem_answer"
text = "当场作一首歌回他：管家和作歌一样，都要删字。"
requires = [{ kind = "skill", skill = "poetry", ge = 60 }]
hint = "你张口想作，三十一个音怎么也凑不齐。"
next = "result"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 3 }, { kind = "flag", flag = "c13_request_reizei_yuki_allowed" }]
reply = "你念完，老人擦刀的手停了。他想了想，说第三句删两个字会更好，说得又快又准，像是年轻时也作过。他把刀收进鞘里，拆开雪的信，读了两遍，朝屏风那边说了一声：“出来吧。”屏风后面的人出来时，手里还捏着一张纸。"

[[tracks.chapters.choices]]
key = "etiquette"
text = "照公家的礼数重新递一回信：冷泉家的请托，照冷泉家的规矩收。"
requires = [{ kind = "skill", skill = "court_etiquette", ge = 60 }]
hint = "你递信的手势，老人一眼就看出是现学的。"
next = "result"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 3 }, { kind = "flag", flag = "c13_request_reizei_yuki_allowed" }]
reply = "你双手捧信，退后半步再递，袖口压着信封的一角。老人看你的手，又看封口的家纹，沉默了很久。“冷泉家的面子，我得给。”他准了，一个月学两回，歌要先给他看过再寄。屏风后面的纸又响了一声，这回他没装听不见。"

[[tracks.chapters.choices]]
key = "argue"
text = "跟他说：媳妇会写歌，往后和京都往来，书信也体面。"
check = { attr = "eloquence", base = 20, per = 7 }
next = "result"
effects = [{ kind = "affinity", person = "reizei_yuki", value = 3 }, { kind = "flag", flag = "c13_request_reizei_yuki_allowed" }]
fail = { next = "result_poem", effects = [{ kind = "flag", flag = "c13_request_reizei_yuki_poem_only" }], news = "府内一位重臣家的老人到底没准媳妇学歌，倒是屏风后面递出来一张纸，被一个船长揣着带去了堺。" }
reply = "老人想了很久，刀搁在膝上。“书信体面，是真的。”他说去年给京都写贺信，家里没一个人写得出像样的一句，只好请寺里的和尚代笔。他准了，只是往后家里的信，要媳妇来写。"

