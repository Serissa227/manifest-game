# 二、严原的通事：信交到对马的通事手里，他问你，是对马认错，还是釜山认错。
[[tracks.chapters]]
key = "handover"
title = "严原的通事"
text = "严原的通事是个中年人，接过信，先看封口，再看字。他读到“许”字那一行，脸色沉了下去。十年来，他的上司就是照“准”字去跟宗家交代的。他把信放在桌上，没有收起来，只问你：“釜山那边，是要对马认错，还是要自己认错？”屋里的人都看着你，等你开口。"
news = "严原的酒棚里都在传，釜山来的通事捎了一封信，为的是十年前书契里的一个字。"
speaker = "captain"
mood = "tense"
at = "tsushima"
objectives = [{ kind = "at", at = "tsushima", text = "到对马的严原去" }]
when = [
  { kind = "date", from = [1566, 1, 1], to = [1587, 8, 24] },
  { kind = "alive", person = "kim_munyeong", value = true },
]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "letter", person = "kim_munyeong", text = "那封说明，我托倭馆的船送去了。成了公文，也就成了公事。" }, { kind = "affinity", person = "kim_munyeong", value = -3 }, { kind = "flag", flag = "c13_request_kim_munyeong_late" }] }

