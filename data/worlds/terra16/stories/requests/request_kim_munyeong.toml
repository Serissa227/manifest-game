# 请托：错了十年的一个字（request_kim_munyeong）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：金文永（kim_munyeong，1540-09-07 生，男），釜山倭馆的译官学徒；cast 在 cast/classmates_custom_busan_interpreter.toml。
# 类型：送信（letter）。主线三章：offer（许与准，报价）→ handover（严原的通事，对马）→ reply（一字不差，回釜山，带的是口信）；
#   带回回信的分支走 report（两边各一个字，回釜山）。终点 done / failed。
# 报价：T 当面（auto=false，玩家“问请托”启动，topic ask:request_kim_munyeong）。offer 章不写 at，objectives 为 person 目标“到釜山浦的倭馆通事房找他”。
#   offer 的 deadline 为窗口止日 1586-06-30，timeout next=failed，不写见闻（没人知道这件事没成）。
# 窗口：offer 以 when 的 date 条件表达 1566-01-01..1586-06-30；handover 到期 90 天（deadline_days），when 另带 1566-01-01..1587-08-24 的 date；
#   reply / report 没有 default：when 写 date 1566-01-01..1587-08-24（brief 的窗口，写成条件）加 alive；窗口之后不再出现，无缺省结算（普通章的窗口没有 window 字段可写）。
# 依据·史实背景：釜山倭馆与对马之间的书契往来；书契用汉文，措辞上的一字之差会变成礼数上的事。对马的宗氏通事替对马传话。
#   “许”译成“准”这件事是原创，只是一个译字的错，不牵涉任何真实的外交结果。严原的通事是叙事人物，不进 cast，正文不写名字。
# 依据·原创：金文永的通事房旧案、底稿上的“许”字、袖口里侧的生词、严原通事的沉默、回信上那一个字。
# 依赖：港口 busan、tsushima（ports_east_asia.toml）；技能 lang_japanese、court_etiquette（skills.toml）；人物 kim_munyeong。
#   B10b：无需改名。主线门禁：无（金文永不是主线人物）。
# C7：不写尹海梨，不替他带任何私信，不写他的成亲与通信；本文件不读也不设任何 c7_ 旗标。
# 读的旗标：bond kim_munyeong 至少 C（offer 的 variant，只改开场，“只说一遍”的口气）。
# 设的旗标：c13_request_kim_munyeong_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_plain（handover 原样交信）、
#   _saved（handover 替他说话，两条接法，带回回信，走 report）、_late（超时，终局）、_done（终局）、_partial（终局）。
# 分支说明：handover 的 add_word / bow_it 不带门槛地进 report，由 report 章自己的两个选项结账；reply 章只留不加门槛的选项。
#   理由：这条轨道的 saved 旗标在 handover 设，按旗标门槛写在 reply 上，会出现“准备后条件仍不满足”；改走 next 分流。
# 秘密：一封难译的家信，誊了三遍，压在铺盖底下，一份也没交出去。本文件一个字也不碰，见闻不写。
# 口头禅：“请把原话，一字不差地再说一遍。”只在 reply 与 report 两章各出现一次，两章互斥，一局只会听到一次。
# 报酬：现金最多 900（折中 500）；好感最多 +13；名声 +2；回忆 mem-request_kim_munyeong-reply（只给 report 章的 read_reply）。
# 回忆插画清单：
#   mem-request_kim_munyeong-reply：一张译稿的底页，页边的“许”字被红笔圈起，旁边是一只袖口，墨迹洗过几水，仍留着几个小字。

[[tracks]]
key = "request_kim_munyeong"
name = "错了十年的一个字"
kind = "request"
start = "offer"
auto = false
cast = ["kim_munyeong"]

# 一、许与准：通事房的旧案前，他翻到一页底稿，“许”译成了“准”。
[[tracks.chapters]]
key = "offer"
title = "许与准"
text = "金文永站在通事房的旧案前，手里是十年前书契的底稿。翻到一页，他的手指停住了。底稿上写的是“许”，译过去成了“准”。“对马那边照这个字办了十年。”他说。他已经重译了一份说明，墨迹还没干透，要送去对马严原的通事手里。“说明白，也别让人丢了面子。”他把纸折成两折，收进袖子。袖口里侧写满了生词，洗过几水，还看得出来。"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "kim_munyeong", text = "到釜山浦的倭馆通事房找他" }]
when = [
  { kind = "date", from = [1566, 1, 1], to = [1586, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "kim_munyeong", ge = 18 },
]
deadline = [1586, 6, 30]
timeout = { next = "failed" }

