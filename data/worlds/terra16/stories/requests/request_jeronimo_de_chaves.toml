fail = { next = "done", effects = [{ kind = "cash", value = 1000 }, { kind = "affinity", person = "jeronimo_de_chaves", value = 3 }, { kind = "flag", flag = "c13_request_jeronimo_de_chaves_partial" }], news = "塞维利亚贸易总署的讲堂里，一个最小的学徒量太阳时手抖，读数差了一度多，后排的老领航员笑出了声。" }
