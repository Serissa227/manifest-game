# 二、马栏边的老人：霍尔木兹的马栏阴凉里，他听见“皇帝”两个字，眼睛就睁开了。
[[tracks.chapters]]
key = "persuade"
title = "马栏边的老人"
text = "马栏的阴凉里，老人坐在草料堆上，眼睛半闭，嘴里嚼着一根草。你提起四十年前那个流亡的皇帝，他的眼睛就睁开了。“那人拿一块红宝石换了十匹马。”他说，“宝石太贵，马太瘦，我到现在还觉得占了便宜。”说完他又闭上眼，嘴角一动：“后来他的人又回来，用银子把宝石赎回去了，一文没少。”"
speaker = "captain"
mood = "tender"
at = "hormuz_port"
when = [{ kind = "alive", person = "gulbadan_begum", value = true }]
deadline_days = 150
timeout = { next = "failed", effects = [{ kind = "affinity", person = "gulbadan_begum", value = -3 }, { kind = "flag", flag = "c13_request_gulbadan_begum_late" }, { kind = "letter", person = "gulbadan_begum", text = "公主的管事：霍尔木兹的老人入冬就病了。公主说，那就照她记得的写。" }] }
[[tracks.chapters.variants]]
key = "asked"
when = [{ kind = "flag", flag = "c13_request_gulbadan_begum_knows_question" }]
text = "马栏的阴凉里，老人坐在草料堆上，眼睛半闭。你把公主那句话问出口：山口那年冬天，有没有人给过一匹好马。他嘴里的草停住了，过了好一会儿才开口。“那人拿一块红宝石换了十匹马。”他说，“宝石太贵，马太瘦，我到现在还觉得占了便宜。”说完他又闭上眼：“后来他的人又回来，用银子把宝石赎回去了，一文没少。”"

[[tracks.chapters.choices]]
key = "listen"
text = "坐在他跟前听，一个字不记，等他讲完。"
next = "result"
