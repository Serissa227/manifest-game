reply = "他讲了一下午，讲到那年冬天的山口，讲到他自己把最好的一匹母马牵给了一个抱着孩子的女人。你回船上，凭记忆把每一句写下来，写到半夜。"
effects = [{ kind = "affinity", person = "gulbadan_begum", value = 3 }, { kind = "flag", flag = "c13_request_gulbadan_begum_full" }]
