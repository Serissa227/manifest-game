# 请托：第一箱镜片（request_marietta_filo）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：玛丽埃塔·菲洛（marietta_filo，1540-08-22 生，女），穆拉诺卖玻璃珠人家的女儿，白天替母亲穿珠子，夜里磨镜片；势力 venice，身份档 1。cast：cast/classmates_custom_murano_glass.toml。
# 类型：押运（escort）。三章加收尾：offer（报价）、arrive（亚历山大港的集市）、report（小本子）；另有 report_half、report_effaced 两条收尾，由 arrive 的 next 直接分流。
#       结构与简报略有出入：简报的 report 只有一章、yes_clear 门控 sold、tell_effaced 门控 effaced，而 sold 与 effaced 都是 arrive 在同一轨道内设的旗标，按规则不能这样门控，所以按结果分到三个收尾章，每章 2 个选项。
# 报价：T（当面）。auto=false，玩家用 ask:request_marietta_filo 启动；offer 不写 at，人物日程在穆拉诺，objectives 为 person。港口 venice（ports_east_med.toml）。
#       offer 的窗口 1563-01-01 至 1565-12-31，deadline 为窗口止日，timeout 直接 failed，不写见闻。
#       同学重逢（bond_marietta_filo，1562）之后开放，对所有主角一样；offer 的变体读 bond ≥ C，换成老同学的口气。
# 进行中：arrive 章 deadline_days=120（跨一片海），超时走 failed，来信一封，好感 -3，旗标 _late。report / report_half / report_effaced 都是普通章，没有 default，可以一直等。
# 章节没有 stage，所以没有 window 与 default；窗口只写在上面的说明里。
# 依据·史实背景：威尼斯不许穆拉诺的匠人外流，人不能走，货可以走；眼镜片在地中海的集市上是稀罕货，买主多是懂得看字与抄经的人。
# 依据·原创：玛丽埃塔、她的小本子与格子、木箱里垫的稻草、磨坏的镜片、开罗来的眼镜贩子（未命名的叙事人物，不新建 cast）。不写禁令的刑罚。
# 秘密：她想在镜片上刻自己的记号，不刻父亲的。正文只写“箱子从她自己的门出去”，不点破她父亲知不知道；见闻一律不写记号的来历。
# 读的旗标：bond marietta_filo ≥ C（offer 的变体）。不读也不设任何 c7_ 旗标；与莱拉、伊斯坦布尔、灯坊不相干，正文不写。
# 设的旗标：c13_request_marietta_filo_accepted（offer 两条接法）、_declined（offer 回绝）、_sold（arrive 的 sell_by_piece 成功与 bad_lens）、_half（sell_by_piece 检定失败）、_effaced（arrive 的 sell_whole）、
#       _done（report 两条收尾）、_partial（report_half 与 report_effaced 的收尾）、_late（arrive 超时）。每条只设一面终局旗标。
# 不用 relation / tie / bond / heart 效果；不写恋爱、心动。bond 只出现在变体的条件里。
# 报酬：现金最多 1250（report 的 yes_clear 与 plain_sold 各给一次；半箱与整箱收尾分别给 700 与 1250）；好感最多 +13；名声 +1；回忆 mem-request_marietta_filo-report。
#       箱子是叙事里的货，不发物品，不用 goods 目标。
# 依赖：港口 venice（ports_east_med.toml）、alexandria（ports_north_africa.toml）；人物 marietta_filo（cast/classmates_custom_murano_glass.toml）。无需 B10b 改名；技能与物品均不用。
# 检定：arrive 的 sell_by_piece 用 commerce，一般（base 20 / per 7），失败走 report_half。
# 回忆插画清单：
#   mem-request_marietta_filo-report「刻在工桌边的记号」：穆拉诺的工桌边，一个小记号刻在玻璃的边上，旁边摆着一片最不坏的镜片，灯下能看清划痕的深浅。

[[tracks]]
key = "request_marietta_filo"
name = "第一箱镜片"
kind = "request"
start = "offer"
auto = false
cast = ["marietta_filo"]

# 一、一个小记号：穆拉诺的后屋，木箱推到你面前。
[[tracks.chapters]]
key = "offer"
title = "一个小记号"
text = "她把一只木箱推到你面前。箱里垫着稻草，一层层码着磨好的镜片，每一片边上都刻着一个小得要凑近才看得见的记号。“匠人走不得，货走得。”玛丽埃塔说，手上没停，把一片镜片翻过来对着窗口。箱子从她自己的门出去，运到亚历山大港的集市上，替她卖。她从围裙口袋里掏出一个小本子，前几页已经画好了格子：“每卖一片，记一行。卖给谁，多少钱，他看清了没有。”"
speaker = "captain"
mood = "tender"
objectives = [{ kind = "person", person = "marietta_filo", text = "在穆拉诺卖玻璃珠的铺子后屋找到她" }]
when = [{ kind = "date", from = [1563, 1, 1], to = [1565, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "marietta_filo", ge = 18 }]
deadline = [1565, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_bond_c"
when = [{ kind = "bond", person = "marietta_filo", level = "C" }]
text = "她先把一片镜片放在你眼前，隔着一个指头的距离。“看我，看得清吗？”你说看得清，她才把它收回去。木箱随后推到你面前，箱里垫着稻草，一层层码着磨好的镜片，每一片边上都刻着一个小得要凑近才看得见的记号。“匠人走不得，货走得。”玛丽埃塔说，手上没停。箱子从她自己的门出去，运到亚历山大港的集市上，替她卖。她从围裙口袋里掏出那个小本子，前几页已经画好了格子：“每卖一片，记一行。卖给谁，多少钱，他看清了没有。”"

[[tracks.chapters.choices]]
key = "take_crate"
text = "接下，运到亚历山大港，一片一片卖。"
next = "arrive"
