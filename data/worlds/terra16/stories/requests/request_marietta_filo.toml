timeout = { next = "failed", effects = [{ kind = "affinity", person = "marietta_filo", value = -3 }, { kind = "flag", flag = "c13_request_marietta_filo_late" }, { kind = "letter", person = "marietta_filo", text = "箱子我托一条去亚历山大港的船带去了，卖给谁、卖了多少，没人记。——玛丽埃塔" }] }
news = "亚历山大港的集市上，一个开罗来的眼镜贩子对着一片威尼斯镜片看了半天，说看不清。卖镜片的人一句话没争。"

[[tracks.chapters.choices]]
