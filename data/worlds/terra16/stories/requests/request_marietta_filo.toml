effects = [{ kind = "flag", flag = "c13_request_marietta_filo_declined" }]

# 二、亚历山大港的集市：贩子看得清，却说看不清。
[[tracks.chapters]]
key = "arrive"
title = "眼镜贩子"
text = "亚历山大港的集市上，一个从开罗来的眼镜贩子拿起一片镜片，对着太阳看了看，又对着自己的手指看，眼睛却一直停在镜片边上那个小记号上。“看不清。”他说。你想起玛丽埃塔被人催的时候总说的那句：“再磨一圈，别急着说看不清。”本子上还写着：“他看清了没有。”贩子又拿起一片，这回他抬起头，说：“整箱我全要。把边上的记号磨掉，刻我自己的。”"
speaker = "captain"
mood = "tense"
at = "alexandria"
objectives = [{ kind = "at", at = "alexandria", text = "到亚历山大港的集市" }]
when = [{ kind = "alive", person = "marietta_filo", value = true }]
