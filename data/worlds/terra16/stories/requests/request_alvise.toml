reply = "“没管就对了。”他把杯子转了一圈，没看你，“多问一句，就多欠一个人情。我欠的已经够多了。”"
effects = [{ kind = "cash", value = 1500 }, { kind = "affinity", person = "alvise", value = 2 }, { kind = "flag", flag = "c13_request_alvise_partial" }]
