news = "但泽城外的修院里，一个拄拐的吕贝克老船长把最后一个布袋交到洗衣女人手上，门外的人都听见了哭声。"
reply = "过了很久，汉斯出来了，眼睛是红的。他说她问父亲最后在船上说了什么，他照实说了，连那句没人听懂的笑话也说了。回吕贝克的路上，他把身上那件旧油布外套脱下来给你，说他不出海了，这件你穿得上。"

[[tracks.chapters.choices]]
key = "go_in"
text = "陪他一起进去，替他把话说完。"
next = "done"
check = { attr = "eloquence", base = 35, per = 6 }
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "hans_brock", value = 6 }, { kind = "fame", value = 2 }, { kind = "item", item = "oiled_sailor_coat", qty = 1 }, { kind = "flag", flag = "c13_request_hans_brock_done" }]
news = "但泽城外的修院里，一个吕贝克老船长替水手把话说完，洗衣的女人收下了父亲的布袋。"
reply = "你替他把话说完，说到大副怕猫的那一段，那女人先笑了一下，又哭了。她收下袋子，问汉斯还出不出海。汉斯说不出了。回去以后，他把旧油布外套给了你。"

