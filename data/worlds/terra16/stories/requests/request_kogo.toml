# 二、老夫人：博多夫家的宅子，老夫人读信读到署名，屏风后头跑出来一个孩子。
[[tracks.chapters]]
key = "handover"
title = "老夫人"
text = "博多，夫家的宅子离码头不远，廊下晾着一双小草鞋。接信的是老夫人，阿竹丈夫的母亲，头发全白了，坐得笔直。她拆信的手很稳。信不长，她却读了很久，读到最后一行，手指落在署名那两个字上，按着，没有挪开。屏风后头跑出来一个男孩，八岁上下，衣领是新浆过的。他大概在后头听见了“堺”字，站在榻榻米边上看我：“你是从堺来的？是母亲叫你来的吗？”老夫人没有回头，也没有叫他回去。"
speaker = "captain"
mood = "sad"
at = "hakata"
objectives = [{ kind = "at", at = "hakata", text = "在博多" }]
when = [{ kind = "alive", person = "kogo", value = true }]
deadline_days = 60
news = "博多码头附近一户武家的老夫人，收到一封堺来的信，信上的署名是描出来的，她拿着读了很久。"

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "affinity", person = "kogo", value = -3 }, { kind = "flag", flag = "c13_request_kogo_late" }, { kind = "letter", person = "kogo", text = "信我托下向九州的人送去了。老夫人回了一句：孩子在这里很好。——小督" }]
news = "博多一户武家收到一封从堺辗转捎来的信，老夫人只回了一句话，说孩子在这里很好。"

[[tracks.chapters.variants]]
