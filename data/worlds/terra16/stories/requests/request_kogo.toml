# 三a、回信的署名（老夫人许了住一季）：回信里一句没提，听见那句话的只有我。
[[tracks.chapters]]
key = "reply_visit"
title = "回信的署名"
text = "堺，还是油屋后头那间屋子。小督又从京都下来了，跪坐在阿竹身边，拆开博多的回信。阿竹不识字，小督念给她听。回信写得很规矩：孩子长高了一寸，每天早上习字，冬衣夫家已经备下，不必再寄。没有一句提到她来不来。阿竹听着，手在膝上越攥越紧。小督念到末尾，停住了。署名那一栏没有请人代笔，几个字歪歪扭扭，有一笔出了格。“这一行我不念了。”小督把信转过来，摊在阿竹膝上，“你自己看。”阿竹看了很久，抬起头来看我。小督也抬起眼睛：“你在博多，老夫人还说了什么？”"
speaker = "captain"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "在堺，等小督再下到港口" }]
when = [{ kind = "alive", person = "kogo", value = true }]
news = "堺一家油屋的女儿守了寡，听说要去博多夫家住上一季；博多来的回信，落款是那家老夫人自己写的。"

[[tracks.chapters.choices]]
key = "tell_visit"
text = "告诉阿竹：老夫人当着我的面说了，让她去住一季。"
next = "done"
reply = "阿竹哭了，哭得没有声音，只是肩膀一直在抖。小督把回信按原来的折痕叠好，放进她手里，按了按，说往后两边写信，“都署自己的名字”。她把一个小布包交给我，是阿竹凑的谢礼，不多。“多了，她过不去。”小督说完，低头去叠那块包袱布。"
