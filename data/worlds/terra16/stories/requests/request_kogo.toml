effects = [{ kind = "affinity", person = "kogo", value = 2 }, { kind = "flag", flag = "c13_request_kogo_accepted" }, { kind = "flag", flag = "c13_request_kogo_note" }]

[[tracks.chapters.choices]]
key = "ask_signature"
text = "接下。问她：为什么一定要阿竹自己署名？"
next = "handover"
reply = "“信是替人写的，名字不是。”小督低头收拾笔墨，把笔尖在水盂里涮了又涮。“博多那边认得我的字，京都替人写信的，就那么几个。阿竹的字，他们没认过。”她盖上砚台，“认不得的，才是真的。”"
effects = [{ kind = "affinity", person = "kogo", value = 2 }, { kind = "flag", flag = "c13_request_kogo_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "武家要孩子，一封信要不回来。"
next = "failed"
