# 请托：署她自己的名（request_kogo）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：小督（kogo，1540-06-16 生，女），地下官人家的女儿，宫里最末一等的见习，替人写假名信；势力 imperial_court，身份档 1。cast：cast/classmates_kyoto.toml。
# 类型：送信（letter）。任务单写的是三章，文件里是四章：offer（报价，堺）、handover（博多，交到老夫人手里）、reply_visit（堺，老夫人当面许了“住一季”）、reply（堺，只收到一封封得很严的回信）。
#   多出一章是引擎的限制：任务单里 reply 章的 tell_visit 要求本轨道在 handover 设的旗标 c13_request_kogo_visit，同轨道旗标不能做 requires，
#   所以 handover 里赢得“住一季”的两个选项（念给孩子听、指给老夫人看署名）走 next 到 reply_visit，其余（只交信、念信检定失败）走 next 到 reply；两章各有两个选项。
#   旗标 c13_request_kogo_visit 照任务单照样设，本轨道内不读，留给之后的变体。
# 报价：V（到访）。小督从京都下到堺（sakai），auto=true；窗口 1576-01-01 至 1588-12-31；offer 写 family=c13_offer_sakai，冷却 20 天；玩家满 17 岁、小督满 18 岁；名声门槛 0。
#   offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻（没人知道这件事没成）。
# 进行中：handover 章 deadline_days=60（堺到博多同一片海），超时走 failed，小督来信一封，好感 -3，旗标 _late；超时另写一条见闻（不写的话会套用本章“读了很久”的见闻）。
#   handover 没有 stage，不写 default。reply_visit 与 reply 是普通章，可以一直等。
#   念信的检定失败没有回应文字（引擎在失败时不显示 reply），所以失败的结果写在 fail 的 news 里（老夫人不许，把孩子领回屏风后面），并设旗标 _refused，reply 章的变体由“我”开头把这件事告诉小督。
# 依据·史实背景：战国时的代笔书信；武家的丈夫战死后，孩子归夫家是规矩，寡妇常被送回娘家，求夫家让她见孩子要靠书信与说情。
# 依据·原创：寡妇（阿竹，堺的油屋家的女儿）、她八岁上下的儿子、博多夫家的老夫人；废纸上写样子、寡妇照着描三遍的署名、老夫人自己写的歪扭落款。
#   孩子只出场一眼、问一句话；不写争抢、不写危险；孩子最终归谁不写死，只到“去住一季”。
# 秘密：替菖代笔、让她赢了澪的那首恋歌——永远不碰。正文不写菖、澪、真荣澄、鞠千代、代笔恋歌；不替任何人给真荣澄带信。见闻一律不写。
# 读的旗标：bond kogo ≥ C（offer 的变体，只读）；c13_request_kogo_note（handover 的变体，本轨道 offer 设，只改文字）；c13_request_kogo_refused（reply 的变体，本轨道 handover 设，只改文字）。不设任何 c7_ 旗标。
# 设的旗标：c13_request_kogo_accepted（offer 两种接法）、_declined（offer 回绝）、_note（接下并写了问候纸条，handover 变体读）、
#   _visit（老夫人许了住一季；本轨道内不读）、_refused（念信检定失败；reply 的变体读，补上失败时不显示的回应）、_late（handover 超时）、_done（reply_visit 与 reply 的终局）。
# 不用 relation / tie / bond / heart 效果；bond 只作条件读取。
# 报酬：工钱 900（每条终局一次）；好感最多 +13（接下 +2、送信 +3、最好的结局 +8）；念信失败 -2；超时 -3；名声 +1；回忆 mem-request_kogo-reply。无物品奖励。
# 依赖：港口 sakai、hakata（ports_east_asia.toml）；技能 calligraphy（skills.toml）；属性 eloquence；人物 kogo。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_kogo-reply「两封信的署名」：堺的矮几上并排摊着两封信，一封的署名描了三遍，一封的署名歪歪扭扭，小督的手指停在两封信中间。

[[tracks]]
key = "request_kogo"
name = "署她自己的名"
kind = "request"
start = "offer"
auto = true
cast = ["kogo"]

# 一、署名：堺的油屋后头，小督替寡妇写完了信，署名那一栏留给寡妇自己描。
[[tracks.chapters]]
key = "offer"
title = "署名"
text = "堺的一条窄巷，一家油屋后头的小屋。小督跪坐在矮几前，把一封信展开，推给对面的女人看最后一遍。女人叫阿竹，武家的寡妇，丈夫死在仗上，八岁的儿子被博多的夫家接走了，她自己被送回了娘家，就是前头这家油屋。信是求夫家把孩子还给她的。她认不得几个字，只拿指头一行一行摸过去。署名那一栏还空着。小督在一张废纸上写了两个假名，把笔递给她。阿竹握笔像握筷子，照着废纸一笔一笔描，描完一遍，又从头描一遍。小督等她搁下笔，才把那张废纸撕成两半。“字我替你写，心事你自己留着。”她把信叠成细长的一条，放进我手里，“博多，交给老夫人。”"
speaker = "captain"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "在堺的港里" }]
when = [{ kind = "date", from = [1576, 1, 1], to = [1588, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "kogo", ge = 18 }]
deadline = [1588, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "kogo", level = "C" }]
text = "堺的一条窄巷，油屋后头的一间屋子。我一进门，小督先递给我一张揉过的信纸，“孩子”两个字上洇了一团墨。“你认得我写坏的字。”她说完就收回去，压在砚台底下。矮几对面坐着阿竹，武家的寡妇，丈夫死在仗上，八岁的儿子被博多的夫家接走了。信是求夫家把孩子还给她的。署名那一栏还空着。小督在废纸上写了两个假名，把笔递过去。阿竹照着一笔一笔描，描完一遍，又从头描一遍。小督等她搁下笔，才把废纸撕成两半。“字我替你写，心事你自己留着。”她把信叠好，放进我手里，“博多，交给老夫人。”"

[[tracks.chapters.choices]]
key = "take_letter"
text = "接下，把信送到博多，交到老夫人手里。"
next = "handover"
