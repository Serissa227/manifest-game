# 请托：双屿的水道（request_hu_zongxian）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：胡宗宪（hu_zongxian，1512 生，1565 卒），总督浙直、福建军务，驻节杭州。本人不出场，话由宁波行署的幕僚转述（绍兴口音，不起名）。
# 类型：去某处（go）。四章：offer（报价）→ survey（到双屿废港量水道）→ report（回宁波交图）→ book（印成的书）；
#       比常规三章多一章 book，理由：唯一奖励《筹海图编》1562 年才刊行，报告章在 1562-03-31 前，书必须隔一年多才到。
# 报价：L（代理人出面）。宁波（ningbo）总督行署的偏厅，auto=true；窗口 1559-06-01 至 1561-12-31，名声门槛 5；
#       family=c13_offer_ningbo，冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 依据·史实：1548 年朱纨捣毁双屿、填塞港口（正文只用“朱都堂当年填了港”）；胡宗宪幕府中有人编海防图籍，其中的郑若曾所编《筹海图编》1562 年刊行；
#       双屿废港的妈祖庙与石线是传闻口吻的补笔。请托只决定“图上画不画渔民的水道”，不决定任何战事。
# 依据·原创：幕僚与袖口沾墨的瘦老头（不点名，是谁由读者自己认）、补网的老渔夫、东中西三条水道、标杆与刻痕、书童。
# 秘密：胡宗宪的秘密（招抚的真意、与京里的往来）本请托一字不提；也不写王直、徐海与招抚；不写下狱与死；book 章只写书。
# 读的旗标：c13_main_lin_wandeng（offer 的 variant wandeng，林晚灯玩家被问一句“月港来的？”，由林晚灯主线设）。
# 设的旗标：c13_request_hu_zongxian_accepted / declined（offer）、_precise（survey 读潮与绘图）、_partial_map（survey 驾船失败）、
#       _late（survey 与 report 超时）、_reported（report 三个选项都设，供 book 的 when 读）、_done（report 照实交）、_partial（report 略去与只交数字）。
#       终局旗标只设 done / partial / declined / late 之一的一面；不设 c7_ 旗标；不写 relation / tie / bond / heart / title / world / join / leave / start_track / end_track / growth。
# 依赖：ningbo、shuangyu 都是现有港口，不需要 B10b 改名；技能 tide_reading、cartography 都在 skills.toml；势力 ming 已有；
#       物品 chouhai_print 有 shop；胡宗宪的 cast 注释仍写着“核验王直招抚”的旧请托梗概，与本请托无关，整合时可改。
# 缺省走向（玩家什么也不做）：offer 到 1561-12-31 超时，走 failed，无见闻、不扣钱；survey 90 天不去，走 failed 并来一封行署的信。
# 回忆插画清单：
#   mem-request_hu_zongxian-report：宁波行署的案边，袖口沾墨的瘦老头俯在图上，三条水道的墨线穿过一道填港的石线。

[[tracks]]
key = "request_hu_zongxian"
name = "双屿的水道"
kind = "request"
start = "offer"
auto = true
cast = ["hu_zongxian"]

# 一、报价：1559—1561 年间，宁波总督行署偏厅，幕僚转述总督的话。
[[tracks.chapters]]
key = "offer"
title = "旧图上的岛"
text = "宁波总督行署的偏厅里，一个绍兴口音的幕僚把一张旧图铺在案上，舟山一带的岛画得像撒了一把豆子。他没让座，先压住图角：“总督说，军粮还差三千石，船还差二十条。你来得正好，咱们算算账。”可他要算的不是粮。昆山的郑先生在编一部讲海防的书，双屿那一带用的全是十几年前的旧图，朱都堂当年把港口填了，填完哪条水道还能进船，如今谁也说不清。“总督的意思，请老弟去双屿废港看一圈，行署出路费。”"
when = [
  { kind = "age", ge = 17 },
  { kind = "date", from = [1559, 6, 1], to = [1561, 12, 31] },
  { kind = "fame", ge = 5 },
]
at = "ningbo"
mood = "cheerful"
deadline = [1561, 12, 31]
family = "c13_offer_ningbo"
family_cooldown_days = 20

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.variants]]
key = "wandeng"
when = [{ kind = "flag", flag = "c13_main_lin_wandeng", value = true }]
text = "宁波总督行署的偏厅里，一个绍兴口音的幕僚把一张旧图铺在案上，舟山一带的岛画得像撒了一把豆子。他先多看了你两眼：“你是月港来的？那边的水，你比我熟。”这才压住图角：“总督说，军粮还差三千石，船还差二十条。你来得正好，咱们算算账。”可他要算的不是粮。昆山的郑先生在编一部讲海防的书，双屿那一带用的全是十几年前的旧图，朱都堂当年把港口填了，填完哪条水道还能进船，如今谁也说不清。“请老弟去双屿废港看一圈，行署出路费。”"

[[tracks.chapters.choices]]
