# 四、印成的书：1562 年秋以后，昆山郑先生家的书童送书。不写胡宗宪，只写书。
[[tracks.chapters]]
key = "book"
title = "印成的书"
text = "隔了一年多，一个书童在宁波码头的缆桩边找到你，背上驮着一函新印的书，蓝布套上还带着浆糊味。“昆山郑先生让送来的，”他把函套解下来，“先生说，当年宁波那一页，用这个还。”你抽出一册，翻到舟山那一页，双屿的三条水道印在上面，墨线比你画的还细。"
when = [
  { kind = "date", from = [1562, 9, 1] },
  { kind = "flag", flag = "c13_request_hu_zongxian_reported", value = true },
]
at = "ningbo"
speaker = "captain"
mood = "cheerful"

[[tracks.chapters.variants]]
key = "partial"
when = [{ kind = "flag", flag = "c13_request_hu_zongxian_partial", value = true }]
text = "隔了一年多，一个书童在宁波码头的缆桩边找到你，背上驮着一函新印的书，蓝布套上还带着浆糊味。“昆山郑先生让送来的，”他把函套解下来，“先生说，当年宁波那一页，用这个还。”你抽出一册，翻到舟山那一页，双屿的水道印在上面，墨线细得像头发。只是中间那一带，印的还是你交上去的样子。"

[[tracks.chapters.choices]]
key = "take"
text = "收下，道声谢"
next = "done"
reply = "书童鞠了一躬就走，没回头。你拎着函套回船，书页上新墨的味道，一路没散。"
news = "宁波码头上，昆山郑先生家的书童背着一函新印的海防书，挨个找当年替行署量过海的人。"
effects = [{ kind = "item", item = "chouhai_print", qty = 1 }]

[[tracks.chapters.choices]]
key = "look"
text = "当场翻到双屿那一页仔细看"
next = "done"
reply = "你找到自己量的那几个数，排在页脚的小字里，一个不差。数字旁边多了几行小注，字比你的小，也比你的细。书童站在一旁等你看完，才把函套重新系好递过来。"
news = "宁波码头上，有个船长当街翻开一册新印的海防书，对着双屿那一页看了半天。"
effects = [{ kind = "item", item = "chouhai_print", qty = 1 }]
