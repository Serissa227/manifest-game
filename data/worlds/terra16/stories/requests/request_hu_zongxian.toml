# 二、量水道：双屿废港。三种量法：读潮（技能）、驾船（检定）、画图（技能）。
[[tracks.chapters]]
key = "survey"
title = "填港的石头"
text = "双屿废港只剩几根烧黑的桩子和半截妈祖庙的墙，墙根下晒着渔网。落潮时水底露出一道石线，爬着青苔，是当年官兵沉下去堵港的船和石头。水道有三条：东边最宽，中间那条渔民常走，西边被石头卡死了一半。补网的老渔夫头也不抬：“要量你就量，没人拦你。可中间那条要是画进官府的图，我们这些人，就没处躲风了。”"
when = [{ kind = "alive", person = "hu_zongxian", value = true }]
objectives = [{ kind = "at", at = "shuangyu", text = "到双屿废港去" }]
at = "shuangyu"
speaker = "captain"
mood = "sad"
deadline_days = 90

[tracks.chapters.timeout]
next = "failed"
effects = [
  { kind = "affinity", person = "hu_zongxian", value = -3 },
  { kind = "flag", flag = "c13_request_hu_zongxian_late" },
  { kind = "letter", person = "hu_zongxian", text = "图等不及了。郑先生照着旧图把双屿那一页刻了，哪条水道能走，还是十几年前的说法。总督说，船不急，下回有事再来行署喝茶。（幕僚代笔）" },
]

[[tracks.chapters.choices]]
key = "tide"
text = "守着潮水，一刻一刻量水深"
next = "report"
reply = "你在妈祖庙的残墙边插了根标杆，每过一刻就刻一道。到第二个潮头，三条水道几时能过、过得了几尺吃水的船，都记在了本子上，连西边那条只容舢板的缝也量到了。"
news = "双屿废港的落潮线上，有个船长守着一根标杆站了两个潮头，一刻一刻往本子上记水深，补网的老渔夫看了半天没吭声。"
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "你对着水面看了半天，只看出潮在涨，说不出几时过得了什么船。"
effects = [
  { kind = "affinity", person = "hu_zongxian", value = 3 },
  { kind = "flag", flag = "c13_request_hu_zongxian_precise" },
]

[[tracks.chapters.choices]]
key = "sail"
text = "亲自驾船，试一遍东水道"
next = "report"
reply = "你让舵手压住速度，船贴着石线往里探，船底沙沙地响了一路。每进一段，吃水几尺，你就在本子上添一笔。"
news = "双屿废港东边的水道里，有条船贴着水底的石线开了个来回，补网的老渔夫在岸上直咂嘴。"
check = { attr = "seamanship", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "hu_zongxian", value = 3 }]

[tracks.chapters.choices.fail]
next = "report"
news = "双屿废港东水道的石线刮坏了一条船的底，船长退回滩头，落潮太急，只量成了两条。"
effects = [
  { kind = "affinity", person = "hu_zongxian", value = -2 },
  { kind = "flag", flag = "c13_request_hu_zongxian_partial_map" },
]

[[tracks.chapters.choices]]
key = "chart"
text = "画成图，把礁石一块块标上"
next = "report"
reply = "你借妈祖庙残墙下一块平地当画板，画了一整天。老渔夫凑过来看了半晌，伸出指头点了点：“这儿漏了一块，涨潮时它就在水皮底下。”你添上去，那是整张图里最小的一笔。"
news = "双屿废港的滩头，有个船长趴在一块旧船板上画了一整天的图，补网的老渔夫凑过去指给他一块暗礁。"
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "你手里的笔画得出岸线，画不出水底下的东西。"
effects = [
  { kind = "affinity", person = "hu_zongxian", value = 3 },
  { kind = "flag", flag = "c13_request_hu_zongxian_precise" },
]

# 三、交图：回宁波行署，瘦老头在案边等着记。
[[tracks.chapters]]
key = "report"
title = "哪条能进船"
text = "行署偏厅里，幕僚已经在等。案边多了个瘦老头，袖口沾着墨，不报姓名，只握着一支笔等你开口。“总督有话，”幕僚说，“水道的事，老弟怎么讲，图上就怎么画。”瘦老头把笔尖悬在一页白纸上。西边那条堵了，东边那条宽，都没什么可犹豫的。只有渔民常走的中间那条，写还是不写，你得现在定。"
when = [{ kind = "alive", person = "hu_zongxian", value = true }]
at = "ningbo"
speaker = "captain"
mood = "tense"
deadline = [1562, 3, 31]

[tracks.chapters.timeout]
next = "failed"
effects = [
  { kind = "affinity", person = "hu_zongxian", value = -3 },
  { kind = "flag", flag = "c13_request_hu_zongxian_late" },
  { kind = "letter", person = "hu_zongxian", text = "你没来交图，郑先生那一页只好先空着，另派了人去补。总督说，不碍事，行署的门没锁。（幕僚代笔）" },
]

