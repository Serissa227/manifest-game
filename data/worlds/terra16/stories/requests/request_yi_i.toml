reply = "你不跳着教，照书上的次第，一条讲完再讲下一条。孩子听得坐不住，听到第三条，忽然拿木炭敲着船板，把难字一个接一个编进了他那首数数的歌里。到天黑，单子上还剩十来个字。你把单子和那首歌的词一起抄下来，封进寄给李珥的信里。孩子把字书还给你，嘴里还在唱。"
effects = [{ kind = "cash", value = 600 }, { kind = "skill", skill = "lang_korean", value = 20 }, { kind = "affinity", person = "yi_i", value = 8 }, { kind = "reputation", faction = "joseon", value = 2 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_yi_i_done" }, { kind = "memory", memory = "mem-request_yi_i-use", title = "船板上的三天" }, { kind = "letter", person = "yi_i", text = "单子收到，十一个字，还有一首歌。歌我念了三遍才念顺：他把“理”“性”编在数网眼的地方，数一个网眼，认一个字。书照这样改三处。一，头一章先教的字太难，往后挪。二，讲“理”的那一段改短，短到一口气念得完。三，每章末尾留几个字，让读的人自己拿身边的东西去配。你照我的次第教，教得不错，错在我排的次第。那首歌，我抄给学生们了。" }]
