# 请托：父亲的分期（request_ilhan）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：伊尔汗（ilhan，1539-03-07 生，男），禁卫军老兵之子，在亚历山大港总督府当书记；cast 在 cast/classmates_cairo.toml。
# 类型：说服（persuade）。报价 V 到访（auto=true）：伊尔汗从近旁下到亚历山大港；offer 章 at=alexandria，family=c13_offer_alexandria、冷却 20 天。
#   章节：offer（报价）、persuade（谷仓门口）、result（契据上的名字，谈成或分期，由 pay_first 或 negotiate/talk 的路线分开）、
#   result_owes（先付了头一期的收尾）、result_partial（检定失败，只分六期）。终点 done / failed。
#   结构说明：brief 写了三章。引擎的规则是“已设旗标不能在同一轨道另一条路径上用 requires 卡”，而“先付”的 owes 旗标与
#   return_loan 的门禁同在 result 章，所以按 next 分出 result_owes；失败的六期路线同理分出 result_partial。变体（variant）只改文字，
#   现金与旗标不同，也必须走另一章。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1563-01-01 至 1588-12-31，deadline 1588-12-31，timeout 直接 failed、不写见闻；
#   persuade 与各收尾章 1563-01-01 至 1590-02-24。
# 依据·史实背景：奥斯曼埃及的禁卫军（老兵的军饷与借贷）、亚历山大港的谷仓与谷船、总督府的书记。谷商是叙事人物，不进 cast，正文不写名字。
# 依据·原创：伊尔汗、他父亲（不写名字）、谷商与谷仓门口的念珠、契据上的落款、钱袋上歪歪扭扭的补缝。
# 依赖：港口 alexandria（ports 表）；技能 negotiation（skills.toml）；人物 ilhan。B10b：无需改名。主线门禁：无（伊尔汗不是主线人物）。
# C7：不写萨利赫，不写水位尺，不写学院里的占座与柱子；请托从 1563 年起。本文件不读也不设任何 c7_ 旗标。
# 读的旗标：bond ilhan 至少 C（offer 的 v1_bond_c 变体，只改开场的一句话）。
# 设的旗标：c13_request_ilhan_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_failed（offer 超时，终局）、
#   _terms（谈成分期，四条路线都设）、_owes（先付头一期）、_hard（检定失败，六期）、_done（终局）、_partial（终局，六期的收尾）。
# 秘密：不进正文与见闻。正文不点破他在学院里的任何事。
# 口头禅：伊尔汗的那句“顺路”只在 persuade 章用一次（见该章正文）；其余章节不再出现。
# 报酬：现金最多 900（先付 400 再收 900，净得 500；或先付后两清只收 500）；好感最多 +14；名声 +2；回忆 mem-request_ilhan-result。
#   分期的六期路线：现金 600（或不收钱，好感 +4，不加名声）；不给回忆之外的物品。
# 回忆插画 mem-request_ilhan-result：木箱上搁着一只旧钱袋，缝口是新补的、针脚歪歪扭扭；旁边一角契据露在枕头边，落款是老兵的名字。

[[tracks]]
key = "request_ilhan"
name = "父亲的分期"
kind = "request"
start = "offer"
auto = true
cast = ["ilhan"]

# 一、总督府的名头：伊尔汗在码头上拦住你，借据的事说得又快又急。
[[tracks.chapters]]
key = "offer"
title = "总督府的名头"
text = "伊尔汗在亚历山大港的码头上拦住你，衣领浆得笔挺，话说得又快又急。他父亲是禁卫军的老兵，当年在港里押谷船时借过一笔钱，利上加利，滚了好几年。前两天谷商上门，把借据往桌上一拍：“令郎在总督府当书记，这点钱算什么。”“我不拿我爹的威风压人，”伊尔汗说，“也不拿我自己的。一年还清，我爹的脸和我的名字都别沾上。你去跟谷商谈分期。”"
speaker = "captain"
mood = "tense"
at = "alexandria"
objectives = [{ kind = "at", at = "alexandria", text = "到亚历山大港去" }]
