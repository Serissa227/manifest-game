# 二、谷仓门口：谷商在仓门口等你，伊尔汗站在街对面，假装在看一艘船。
[[tracks.chapters]]
key = "persuade"
title = "谷仓门口"
text = "谷商在仓门口等你，手里捻着一串念珠，说老兵的债拖了五年，早就不是当初那笔数。“一次还清，少一文也不行。”他说，“不然我就去总督府，问问令郎。”你刚要开口，就看见街对面站着伊尔汗，假装在看一艘船，眼睛却往这边瞟。他见你望过去，把领子又理了一遍：“我只是顺路，别多想。”"
news = "亚历山大港谷仓门口，一个老兵的债谈成了分期，契据是总督府一个年轻书记写的。"
speaker = "captain"
mood = "tense"
at = "alexandria"
