reply = "你让两个年轻人压住橹，船头顶着急流，一寸一寸挨着漩涡的边沿。白沫横过来的时候船身抖得厉害，桅脚上的三道麻绳勒得吱吱响，沙漏一下也没歪。十夜，十个转流都记上了。来岛通康看完船板，叫人一道一道解开麻绳，把沙漏还你。三道死结解了小半个时辰，他不许人拿刀割。“下回半夜过海峡，船头喊一声来岛，有人点灯。”"
