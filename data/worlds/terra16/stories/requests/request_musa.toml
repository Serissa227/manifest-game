effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "musa", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_musa_done" }, { kind = "flag", flag = "c13_request_musa_rubbing" }, { kind = "memory", memory = "mem-request_musa-dig", title = "城墙根下的半块碑" }]
