# C13d 请托：从海上看过去的哈瓦那（request_isabel_soto）。中文，Claude 写。
# 人物：伊莎贝尔·德·索托 isabel_soto（1541-03-25 生，女；塞维利亚领航考官的孙女，画海岸比谁都准，领不到执照）。cast 在 cast/classmates_seville.toml，日程 1557—1590 在塞维利亚的菜市场（seville / market）。
# 类型：去某处（gs）。章节：offer（报价）→ arrive（哈瓦那港外，三条路）→ 两种收尾。
#       report 收尾是量过礁或画过岬角侧影的一路（有 profile 旗标，才有“两个名字”）；report_partial 是只照旧图进港的一路（没有 profile，没有“两个名字”）。
#       结构说明：原设计 arrive 三个选项都走 report，其中“两个名字”要求 profile 旗标。按“同一轨道设的旗标不用来挡另一条路”的办法，收尾分成两章，各自两到三个选项。
#       超时（arrive 240 天）走 failed，寄一封信，不写见闻。
# 报价：当面（T）。auto=false，玩家“问请托”（ask:request_isabel_soto）启动；offer 章不写 at，目标是在塞维利亚找到她。
#       窗口 1566-01-01 至 1574-12-31（写在 when 的 date 里）；offer 的 deadline 为窗口止日，timeout 为 failed，不写见闻。
#       普通章不写 window，窗口以 when 的 date 条件表达（window 只与 stage/default 搭配）。
# 依据·史实背景：塞维利亚贸易总署的标准海图（padrón real）靠领航员回报修订；哈瓦那 1558—1577 年修拉富埃尔萨城堡，入口东岸的岬角上有瞭望台。城堡只作风景，不写军事测绘。
# 依据·原创：伊莎贝尔、她手上的墨、三张岸形草图、量礁的那一次、图角的署名之争、订图的船长（只在offer里提到，不出场）。
# 依赖：港口 seville（ports_iberia.toml）、havana（ports_americas.toml）；人物 isabel_soto；技能 cartography、tide_reading（skills.toml）；检定属性 seamanship。B10b：无需改名。主线门禁：无。
# C7：不写莱昂诺尔、佩德罗、诺埃尔；不写当年的署名。bond 等级只作为 offer 的 variant 条件（C 级以上换一段开场），不读任何 c7_ 旗标，不设任何 c7_ 旗标。
# 秘密（cast 里的 secret）：永不写进正文与见闻。本请托的署名之争只在她和玩家之间，只谈这一张新图。
# 写的旗标：c13_request_isabel_soto_accepted（接下，offer 两条接法都设）、_declined（回绝，终局）、_profile（量了岸形或礁）、_done（终局）、_partial（终局：只署自己的名字）、_late（超时，终局）。
# 读的旗标：无。profile 只由 arrive 章的两个选项设置、且只通向 report，所以 report 里的“两个名字”选项不写 requires（照“同一轨道设的旗标不用来挡选项”的办法，靠 next 分章）；profile 旗标留给以后的变体读取。
# 回忆插画 mem-request_isabel_soto-report：图角上的两个名字。一张新图的图角，一个名字写得很大，下面一行小字；桌上摊着旧图与量好的数，墨渍从指尖蹭到纸边。
# 口头禅“谁画的？画错了。”只在 report 章用一次。

[[tracks]]
key = "request_isabel_soto"
name = "从海上看过去的哈瓦那"
kind = "request"
start = "offer"
auto = false
cast = ["isabel_soto"]

# 一、上不了船的画图人：塞维利亚的菜市场，她接了一张哈瓦那港的图。
[[tracks.chapters]]
key = "offer"
title = "上不了船的画图人"
text = "塞维利亚的菜市场边上，伊莎贝尔趴在一张木桌上画图，手指上的墨一块一块的。桌角压着一封订单：一位船长要哈瓦那港口的图。“他要一张从海上看过去的图。”她拿笔尖点着纸，“岬角像什么，城堡在哪，入口有多宽。船长认港口，就认这个侧影。”她把笔一丢，抬起头，“可我上不了船。领航执照轮不到我，你知道的。”说完，她把一张白纸拍在你面前：“你去看，我来画。图上署谁的名，等你回来再吵。”"
speaker = "captain"
mood = "tense"
when = [
  { kind = "date", from = [1566, 1, 1], to = [1574, 12, 31] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "isabel_soto", ge = 18 },
]
objectives = [{ kind = "person", person = "isabel_soto", text = "在塞维利亚的菜市场找到她" }]
deadline = [1574, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "isabel_soto", level = "C" }]
text = "塞维利亚的菜市场边上，伊莎贝尔趴在木桌上画图，看见你，把笔往耳朵上一夹，没有起身。“哈瓦那的港口。订图的船长要从海上看过去的样子：岬角，城堡，入口的宽。”她用笔尖点着纸，“我上不了船。你的船，我来画路——这回是真的路。”她把白纸拍到你面前，“你去看，我来画。图上署谁的名，等你回来再吵。”"

[[tracks.chapters.choices]]
key = "take_it"
text = "接下，去哈瓦那看岸形、量入口。"
