# 二、岬角的侧影：船在哈瓦那港外，你从左到右看岸，量入口，记礁的深浅。
[[tracks.chapters]]
key = "arrive"
title = "岬角的侧影"
text = "船在哈瓦那港外的海上停住。你照她说的，从左到右看岸：一片低岸，一座岬角，岬角顶上一座瞭望台，再往里是入口。入口里面，城墙才砌到一半，石工的木架还搭在墙头上。舵手拿旧图对了半天，忽然叫出声来：“入口比图上窄，东边那片礁比图上浅。照着旧图的水深走，大船要擦底。”"
speaker = "captain"
mood = "mystic"
at = "havana"
when = [
  { kind = "date", from = [1566, 1, 1], to = [1576, 2, 24] },
  { kind = "alive", person = "isabel_soto", value = true },
]
objectives = [{ kind = "at", at = "havana", text = "到哈瓦那港外" }]
deadline_days = 240
timeout = { next = "failed", effects = [{ kind = "affinity", person = "isabel_soto", value = -3 }, { kind = "flag", flag = "c13_request_isabel_soto_late" }, { kind = "letter", person = "isabel_soto", text = "订图的船长等不及，拿旧图走了。我在图角写了一句：入口小心。——伊莎贝尔" }] }

[[tracks.chapters.choices]]
key = "draw_profile"
text = "照她说的从左到右，把岸形一笔笔画下来，量入口的宽。"
next = "report"
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "你画的岬角，怎么看都不像你眼前那一座"
reply = "你画了三张，一张比一张像。入口的宽用两次方位角量出来，跟旧图差了一截。"
news = "哈瓦那港外，有条船在海上停了半天，船上的人对着岸一笔笔地画，画到日头偏西。"
effects = [
  { kind = "affinity", person = "isabel_soto", value = 3 },
  { kind = "flag", flag = "c13_request_isabel_soto_profile" },
]

[[tracks.chapters.choices]]
key = "sound_reef"
text = "放小船下去，把入口那片礁的深浅量出来。"
next = "report"
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "这里潮差小，可你还是算不准几时最浅"
reply = "你挑最浅的时辰量了礁，比旧图上浅了一人深。数和时辰都记在本子上。"
news = "哈瓦那入口东边的礁，有人放小船下去，挑最浅的时辰量了水深，量完一行行记进本子里。"
effects = [
  { kind = "affinity", person = "isabel_soto", value = 3 },
  { kind = "flag", flag = "c13_request_isabel_soto_profile" },
]

[[tracks.chapters.choices]]
key = "sail_in"
text = "照着旧图开进港，凭手感记哪里不对。"
next = "report_partial"
check = { attr = "seamanship", base = 20, per = 7 }
reply = "你照旧图进港，在入口处觉得水道窄了，礁也近了。几处“旧图不对”记在纸边上。"
news = "哈瓦那入口比旧图窄，一条船照着旧图开进去，进港时一直盯着两岸的礁。"
effects = [{ kind = "affinity", person = "isabel_soto", value = 3 }]
fail = { next = "report_partial", news = "哈瓦那入口的礁边擦了一下，那条船量了一半就赶紧进港，记下的数也只有一半。", effects = [{ kind = "affinity", person = "isabel_soto", value = -2 }] }

# 三之一、署谁的名（量过礁或画过侧影的一路）：她照你的数画新图，图角只能署一个名。
[[tracks.chapters]]
key = "report"
title = "署谁的名"
text = "伊莎贝尔把你带回来的东西一样样铺开：纸上的岸形，或是记着时辰的礁深，哪样有就用哪样。她先拿起桌上的旧图，眯着眼看了一会儿：“谁画的？画错了。”然后她照你的数，一笔一笔画新图。画到入口，她把旧图的宽划掉，在旁边写上新的。她举到窗口看了一遍，指甲在入口那道线上划了划：“这道还是歪。”然后她把笔一放：“好了，吵吧。图角只能署一个名。”"
speaker = "captain"
mood = "tense"
when = [
  { kind = "date", from = [1566, 1, 1], to = [1576, 2, 24] },
  { kind = "alive", person = "isabel_soto", value = true },
]
