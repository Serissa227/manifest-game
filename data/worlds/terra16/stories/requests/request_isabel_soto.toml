reply = "她在纸上画了一道横线当海面，又在线上点了一个点当船，说：“你看见的，从左到右，一样一样记，别跳。”"
effects = [
  { kind = "affinity", person = "isabel_soto", value = 2 },
  { kind = "flag", flag = "c13_request_isabel_soto_accepted" },
]

[[tracks.chapters.choices]]
key = "ask_name"
text = "接下，先说清楚：署名的事现在就吵。"
next = "arrive"
