# reply_partial · 堺：第七个走了样，伊都替夫人问一句
[[tracks.chapters]]
key = "reply_partial"
title = "是谁的意思"
text = "船一靠堺，伊都就上了跳板。她接过神父的答案，当天就回了大坂。三天后她又来了，先传夫人的话：“答案读了。第七个，看了三遍。”她顿了顿，又补一句，说是夫人原样吩咐的：“第七个，是谁的意思？”她袖子里有一封折好的短信，按着没拿出来。“夫人说，有几句读着不像洋人神父的话，倒像寺里的和尚。哪几句是原话、哪几句经了别人的手，请您照实说。”"
speaker = "kiyohara_ito"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "回堺把答案交给伊都" }]
when = [{ kind = "alive", person = "hosokawa_tama", value = true }]
deadline = [1587, 6, 30]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_late" }]

[[tracks.chapters.choices]]
key = "honest"
text = "照实告诉她：哪几句是原话，第七个是怎么走了样的。"
next = "done"
reply = "我把长崎那天照实说了：哪几句是神父嘴里出来的，哪几句换了别人的说法，第七个为什么没能原样带回来。伊都一句也没打断，听完只说：“夫人最恨被人哄。您照实说了，她会记着。”她把那封短信往袖子里收深了些：“这一封是写给哄她的人的，用不上了。”第二天她送来一包谢礼，信没有来。"
effects = [{ kind = "cash", value = 1300 }, { kind = "affinity", person = "hosokawa_tama", value = 4 }, { kind = "flag", flag = "c13_request_hosokawa_tama_partial" }]

[[tracks.chapters.choices]]
key = "claim"
