# 请托：十三个问题（request_hosokawa_tama）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude 执笔。仅中文。
# 人物：细川玉 hosokawa_tama（1563 生，女），细川忠兴之妻，1584 年回大坂玉造的宅子后几乎出不了门，见客隔帘、由侍女传话；cast 见 cast/historical_07_japan.toml。
#       出面的是她的侍女清原伊都 kiyohara_ito（同一 cast 文件）；伊都的日程从 1587 年起，可说话人不受日程限制，1584 年就让她在堺出场。
#       长崎的老神父、屋角的日本同宿是叙事人物，不起名、不建 cast。
# 类型：送信（letter）。报价：到访（V），auto=true，报价港堺（sakai），family=c13_offer_sakai，冷却 20 天。
# 窗口：offer 1584-06-01 至 1586-12-31（when 与 deadline）；handover 期限 1587-04-30；reply / reply_partial 期限 1587-06-30。
#       全部期限卡在 1587 年夏以前：不写受洗，不称伽罗奢。
# 章节：offer 折成小方的纸（堺）→ handover 第七个问题（长崎）
#       → reply 帘后的回话（堺；原话带回来的一路）
#       → reply_partial 是谁的意思（堺；第七个走了样的一路）
# 结构：简报写三章，reply 的 claim 选项要 requires c13_request_hosokawa_tama_paraphrased——这面旗标由本轨道的 handover 设，
#       照整合方的要求不用 requires 读本轨道自己设的旗标，改成按 next 分路：verbatim、同宿笔录成功走 reply；同宿笔录失败、跳过第七个走 reply_partial。
#       reply 里只剩 honest 一个合用的选项，补一个 addvoice（添上自己对第七个的看法）：她最恨“替我想好的答案”，所以只付一半、退回那一页，终局 partial，无来信、无回忆。
#       reply_partial 有 honest 与 claim，照简报分别付折中的谢礼。
#       检定失败不显示选项的回复：offer 的背诵失败（背到第九个卡住，伊都只好把纸交出来）与接下同一结果，handover 的正文照“纸在手里”写，两条路都说得通；
#       同宿笔录失败（同宿把几处难懂的话改成自己的说法）写进 reply_partial 的正文（“有几句读着不像洋人神父的话，倒像寺里的和尚”），与跳过第七个共用一章；
#       跳过第七个的回复里，同宿在空着的圈底下添了两句自己的宽慰话，所以“第七个不是原话”对两条路都成立。
#       handover 里神父先用葡萄牙字笔答，选项选的是“谁把它译成日本字”，所以第一到第六个也在译的人手里。
# 改动：简报 offer 的 memorize 成功写好感 +3，可接下 +3、路上 +3、最好的结局 +8 合计 14，超过 rewards 一栏“好感至多 +13”；
#       这里把 memorize 成功改成 +2（与接下相同），检定的赌注是失败时连这 +2 也没有、成功时纸当场烧掉（旗标 no_paper）。最高正好 +13。
# 依据（史实）：细川玉 1584 年回大坂，1587 年春读教理书、托侍女向神父问学，同年受洗（耶稣会日本年报）；长崎当时是耶稣会的港，有日本人同宿在神父身边做事。
# 依据（原创）：十三个问题的内容、折成小方的纸与纸背面那一行、码头茶摊的炭炉、铜镇纸、老神父角上画的小十字、伊都指甲掐的两道印、帘后的回信。
# 不写：她父亲是谁、那一年的那件事、谋反——第七个问题只写那一句；不写受洗与教名；不写成爱情，夫人与“我”之间只有帘子与纸。
#       秘密（父亲的事、瞒着丈夫的信仰）不进正文与见闻；全轨道不写见闻（请托本身是宅里瞒着的事）。
# 招牌话：纸背面的那一句（“请把神父的原话带回来……”）全轨道只在 offer 正文出现一次。
# 读写的旗标：不读 c7_ 与主线旗标。读本轨道的 no_paper（handover 与 reply 的变体）。
#       设 c13_request_hosokawa_tama_accepted / declined / no_paper / verbatim / paraphrased / done / partial / late。
#       终局旗标每条路径只设一面：declined（回绝）、done（reply honest）、partial（reply addvoice、reply_partial 两个选项）、late（handover 与两章 reply 超时）；offer 超时不设旗标、不写见闻。
#       分支旗标三面：no_paper（变体）、verbatim、paraphrased（只作记录，分路靠 next）。
# 报酬：现金最多 2600（reply honest）或 1300（其余收尾）；好感最多 +13；无名声、无声望（隐秘的请托）；回忆一张；来信两封（handover 超时伊都的一封、reply honest 夫人的一封，互斥）；无唯一奖励物品、无技能奖励。
# 依赖：港口 sakai、nagasaki（ports_east_asia.toml）现成；技能 lang_portuguese（skills.toml）；属性 eloquence；无改名依赖；无主线门禁。
# 回忆插画清单：
#   mem-request_hosokawa_tama-reply「帘后的十三个问题」：玉造宅里一道垂下的竹帘，帘外地板上摊着答卷，写满正反两面的一页压在最上头，帘后只露出一只捏着纸角的手。

[[tracks]]
key = "request_hosokawa_tama"
name = "十三个问题"
kind = "request"
start = "offer"
auto = true
cast = ["hosokawa_tama", "kiyohara_ito"]

# offer · 1584—1586 · 堺的码头：侍女递来一张折成小方的纸
[[tracks.chapters]]
key = "offer"
title = "折成小方的纸"
text = "堺的码头，一个侍女打扮的女人站在我的跳板底下，等最后一包货抬上了船，才开口：“细川家的。夫人出不了门，我替她来。”她叫清原伊都，说话利落，一个多余的字也没有。她从袖子里取出一张纸，折成小方块，只有掌心大。展开来满满一页，字又快又密，有几处墨没干透就折上了，印到了对面：人死以后，还记不记得活着时恨过谁？一个女儿，该不该替父亲赎罪？神若是好的，为什么让人等这么久？……一共十三个，第七个写得最小。纸背面只有一行，字比正面大：“请把神父的原话带回来。替我想好的答案，我自己也想得出。”伊都说，大坂的神父答了一半，剩下的要问长崎那位老神父。“宅里的武士只会守门。您往西去，正好。”"
speaker = "kiyohara_ito"
mood = "tense"
at = "sakai"
when = [{ kind = "date", from = [1584, 6, 1], to = [1586, 12, 31] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 25 }, { kind = "age", person = "hosokawa_tama", ge = 18 }]
deadline = [1586, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "收下那张纸。"
next = "handover"
reply = "她看着我把纸收进贴身的油纸包，系好了绳，才说：“夫人不许我抄底稿。这一张丢了，她就再也不写了。”说完行了礼，转身就走，木屐在石板上响得很快，一次也没回头。"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_accepted" }, { kind = "affinity", person = "hosokawa_tama", value = 2 }]

[[tracks.chapters.choices]]
key = "memorize"
text = "纸不带了，我当场把十三个问题背下来。"
next = "handover"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "我背了一遍。伊都对着纸听，嘴唇跟着动，到第十三个，一个字也没错。她把纸折回小方块，走到码头茶摊的炭炉边，丢了进去。火苗舔上来，背面那一行最后才卷起来。“这样，世上就只剩夫人、您和我记得。”她说得很平，手却在袖子里攥了一下。"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_accepted" }, { kind = "flag", flag = "c13_request_hosokawa_tama_no_paper" }, { kind = "affinity", person = "hosokawa_tama", value = 2 }]

[tracks.chapters.choices.fail]
next = "handover"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "这样的事，我担不起。"
next = "failed"
reply = "伊都把纸折回原样，收进袖子里，向我行了一礼，礼数一点不少。“是我看错了船。”她走得很急，到了码头那头，又站住，像是在挑下一条往西去的船。"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_declined" }]

# handover · 长崎：老神父答到第七个，放下了笔
[[tracks.chapters]]
key = "handover"
title = "第七个问题"
text = "长崎岬角上，教会的屋子刷的是新白墙。老神父听说是大坂一位夫人的问题，先去洗了手，才把那张小方纸展平在桌上，拿一只铜镇纸压住一角。他戴上眼镜，一个一个答，用葡萄牙字写在另一张纸上，写一句，想半天，再写一句。外头的钟敲过两遍，他才答完第六个。到第七个，他放下笔，问我这位夫人的父亲是谁。我说不知道。他摘下眼镜，看了我很久，又戴上。“我答。可我写的是葡萄牙字，得有人译成她读得懂的字。”屋角站着一个剃了头的日本同宿，纸笔早已备好。"
speaker = "captain"
mood = "mystic"
at = "nagasaki"
objectives = [{ kind = "at", at = "nagasaki", text = "把问题带到长崎的老神父那里" }]
when = [{ kind = "alive", person = "hosokawa_tama", value = true }]
deadline = [1587, 4, 30]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_late" }, { kind = "letter", person = "kiyohara_ito", text = "船长：夫人说，不必了——她已经自己去问过了。那张纸若还在您手里，请烧掉，不必送回。——伊都" }]

[[tracks.chapters.variants]]
key = "v1_no_paper"
when = [{ kind = "flag", flag = "c13_request_hosokawa_tama_no_paper", value = true }]
text = "长崎岬角上，教会的屋子刷的是新白墙。老神父听说是大坂一位夫人的问题，先去洗了手，回来才问纸在哪里。我说没有纸，问题都在我脑子里。他愣了一下，翻开自己的本子：“那就念吧，念慢些。”我念一个，他戴上眼镜，用葡萄牙字记一行，底下接着写他的答话，写一句，想半天，再写一句。外头的钟敲过两遍，他才答完第六个。我念出第七个，他放下笔，问我这位夫人的父亲是谁。我说不知道。他摘下眼镜，看了我很久，又戴上。“我答。可我写的是葡萄牙字，得有人译成她读得懂的字。”屋角站着一个剃了头的日本同宿，纸笔早已备好。"

[[tracks.chapters.choices]]
key = "verbatim"
text = "我听他的葡萄牙话，一句句照原样译下来，不添不减。"
next = "reply"
requires = [{ kind = "skill", skill = "lang_portuguese", ge = 60 }]
hint = "神父的葡萄牙话又慢又绕，你一整句也跟不下来。"
reply = "神父照着他的纸念一句，我译一句。他念得慢，我写得更慢，有两处我请他再念一遍，他就一字不改地又念一遍。第七个他答得最长，我译出来，写满了一张纸的正反两面。最后一句是：“这个问题，该由她自己去问天主。”我照写了。他等我搁下笔，在那一页的角上画了个小十字。"
effects = [{ kind = "affinity", person = "hosokawa_tama", value = 3 }, { kind = "flag", flag = "c13_request_hosokawa_tama_verbatim" }]

[[tracks.chapters.choices]]
key = "dojuku"
text = "请屋角的同宿当场笔录，先跟他讲好别改字。"
next = "reply"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "我跟同宿讲好：神父怎么说，他就怎么写，哪怕不通顺也别替他顺。他点点头，笔下得又快又稳；神父停下来想的时候，他的笔也停着；有两处没听清，他请神父又说了一遍。写完他念了一遍，神父听着点了三回头。第七个写满了正反两面，末一句是神父一个字一个字慢慢说出来的。"
effects = [{ kind = "affinity", person = "hosokawa_tama", value = 3 }, { kind = "flag", flag = "c13_request_hosokawa_tama_verbatim" }]

[tracks.chapters.choices.fail]
next = "reply_partial"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_paraphrased" }]

[[tracks.chapters.choices]]
key = "skip"
text = "请神父跳过第七个。"
next = "reply_partial"
reply = "神父像是松了口气，在第七个旁边画了一个圈，接着答第八个。往后他答得快了，屋角的同宿也译得快。十三个答完，太阳还没落。同宿看那个圈底下空着一行，过意不去，自己添了两句宽慰人的话，字写得端端正正。我看见了，没有拦。"
effects = [{ kind = "flag", flag = "c13_request_hosokawa_tama_paraphrased" }]

# reply · 堺：原话带回来了，伊都按着一封信等回话
[[tracks.chapters]]
key = "reply"
title = "帘后的回话"
text = "回到堺，伊都已经在码头上等着，像是早算准了船期。她接过神父的答案，连同那张小方纸，一并收进怀里，当天就回了大坂。三天后她又来了，站在跳板底下，先传夫人的话：“答案读了。第七个，读了三遍。”接着从袖子里取出一封折好的短信，却不递过来。“夫人还要问一件事：哪几句是神父的原话，哪几句是记的人顺手改的。请您照实说，听了回话，这封信才给您。”她把信按在袖口上，等着。"
speaker = "kiyohara_ito"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "回堺把答案交给伊都" }]
when = [{ kind = "alive", person = "hosokawa_tama", value = true }]
deadline = [1587, 6, 30]

[tracks.chapters.timeout]
next = "failed"
