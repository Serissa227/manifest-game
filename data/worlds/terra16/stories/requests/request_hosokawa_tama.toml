[[tracks.chapters.variants]]
key = "v1_no_paper"
when = [{ kind = "flag", flag = "c13_request_hosokawa_tama_no_paper", value = true }]
text = "回到堺，伊都已经在码头上等着，像是早算准了船期。她接过神父的答案，先看最上头那十三行——那是我凭记性写下的问题——嘴唇跟着一行一行地动，对到最后一行，才收进怀里，当天回了大坂。三天后她又来了，站在跳板底下，先传夫人的话：“答案读了。第七个，读了三遍。”接着从袖子里取出一封折好的短信，却不递过来。“夫人还要问一件事：哪几句是神父的原话，哪几句是记的人顺手改的。请您照实说，听了回话，这封信才给您。”她把信按在袖口上，等着。"

[[tracks.chapters.choices]]
key = "honest"
text = "照实说：都是神父的原话，再说说是怎么记下来的。"
next = "done"
reply = "我把长崎那天说了一遍：神父说得多慢，哪两处请他说了第二遍，第七个写满了正反两面。伊都听完，只问：“说第二遍的是哪两处？请指给我看。”我指了，她用指甲在那两处各掐了一道印，这才把信递过来，又行了一礼，比上回那一礼低。"
effects = [{ kind = "cash", value = 2600 }, { kind = "affinity", person = "hosokawa_tama", value = 8 }, { kind = "flag", flag = "c13_request_hosokawa_tama_done" }, { kind = "memory", memory = "mem-request_hosokawa_tama-reply", title = "帘后的十三个问题" }, { kind = "letter", person = "hosokawa_tama", text = "船长：答案读了。神父说，第七个该由我自己去问。船长跑了一趟长崎，带回来一句我坐在帘子里也想得到的话——这一句写刻薄了。怪不到神父头上，更怪不到船长头上。纸只有这一张，我不涂了，船长就当它被海风吹皱了吧。这些年送进这道帘子的话，都先有人替我磨圆了边；这一回的边是毛的，我很喜欢。——玉" }]

