# 六之二、分不清（没看清提灯人）：灯是看见了，灯后面的人没有。
[[tracks.chapters]]
key = "settle_blind"
title = "没看清的夜"
text = "天亮以后，白道长没有去书生家贴符，叫道童提了一副退烧的药，送到柳汀街。道童回来说，吴伯接了药，没问价钱，只问那灯还来不来。湖面上的雾还没散，蒲扇上沾了一层露水，白道长把它搁在石凳边，坐下，让你也坐。湖心寺的钟这才敲了头一下。灯是看见了，灯后面的人，你和他都没看清。“骗子，病人，还是别的什么，”他问，“你给贫道一句。”"
news = "宁波月湖边闹牡丹灯，玄妙观的老道士守了一夜没下断语，退烧的药倒是先送去了书生家。"
