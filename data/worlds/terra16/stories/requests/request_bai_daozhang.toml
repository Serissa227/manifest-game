[[tracks.chapters.choices]]
key = "not_ask"
text = "不追问，把纸留下就走。"
next = "watch"
reply = "白道长接过纸，在指头上捻了捻，说居士是个懂规矩的人。第二天，观里订纸的铺子换了一家。"
effects = [{ kind = "affinity", person = "bai_daozhang", value = 3 }]

[[tracks.chapters.choices]]
key = "ask_straight"
text = "直接问他：那家道观，是不是您这儿？"
next = "watch"
reply = "白道长看了你一眼。“纸是一样的，画符的手不一样。”这句话说完，他闭上眼，像在打坐。炉里的香烧断了一截，掉进灰里。你坐了一会儿，起身告辞，他没有睁眼。"
effects = [{ kind = "affinity", person = "bai_daozhang", value = 1 }]

