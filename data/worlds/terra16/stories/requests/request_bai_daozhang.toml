[[tracks.chapters]]
key = "settle"
title = "分不清"
text = "天亮以后，白道长没有去书生家贴符，叫道童提了一副退烧的药，送到柳汀街。道童回来说，吴伯接了药，没问价钱，只问那灯还来不来。湖面上的雾还没散，蒲扇上沾了一层露水，白道长把它搁在石凳边，坐下，让你也坐。他看着水，半天没开口，湖心寺的钟这才敲了头一下。“骗子，病人，还是别的什么，”他终于问，“你给贫道一句。”"
news = "宁波玄妙观的老道士在月湖边守了一夜，第二天没贴符，只给书生家送了一副退烧药。"
speaker = "captain"
mood = "tender"
at = "ningbo"
objectives = [{ kind = "at", at = "ningbo", text = "到宁波月湖边去" }]
