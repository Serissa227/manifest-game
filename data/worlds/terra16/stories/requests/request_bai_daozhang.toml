hint = "那张符上的笔路，你看不懂。"
reply = "你把假符铺平，指给他看第三笔：起笔是倒着来的，懂行的人不这么画。白道长把符举到窗前，看了很久。“纸是一样的，画符的手不一样。”他说，说完把符放下，没有再往下说。"
effects = [
