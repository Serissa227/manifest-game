# 请托：渔家孩子的问学信（request_yi_hwang）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：李滉，号退溪（yi_hwang，1502 年生，1571 年卒，男），岭南安东礼安乡下的儒者；cast 在 cast/historical_08_korea_ryukyu.toml。
# 类型：送信（letter）。四章：offer（报价）→ handover（三页回信）→ reply（寄来的书稿，答了第三页的一路）
#   或 reply_half（同一件事，第三页没答全的一路）。终点 done / failed。
#   brief 写的是三章，收尾章按 answered / half 拆选项；引擎不许用本轨道另一路才设的旗标挡选项，
#   所以改成按 next 分流到两章收尾（reply / reply_half），两章各有两个选项，效果照 brief。
# 报价：L 来信（auto=true）。offer 章 at=busan（釜山），出面的是釜山的渔家孩子（不新建 cast，不写 speaker）；
#   老先生只在信里说话，信经东莱府的驿递往返，玩家不去内陆。
#   family=c13_offer_busan、冷却 20 天；offer 的 deadline 为窗口止日 1568-12-31，timeout 直接 failed，不写见闻。
# 窗口：offer 1559-01-15 至 1568-12-31，玩家满 17、名声 ≥ 5；handover 进入后等 60 天、150 天期限；
#   reply / reply_half 进入后等 60 天、150 天期限。最晚一路止于 1569 年秋，在他 1571 年去世之前；后续章都写 alive。
# 依据·史实背景：李滉书信问学，回信极勤，不分贵贱（《退溪集》）；《朱子书节要》是他从朱子书信里摘编的本子，
#   1556 年前后编成，先以抄本在门人间传（书目见 items/books_13_east_asia.toml 的 juseo_ms）。1568 年他被召到汉城，信仍经安东转递，正文不提。
# 依据·原创：釜山浦的渔家孩子（十二三岁，无名）、信角画的三道水、东莱府那个笑过孩子字的驿卒、
#   第二页的三句反问、油纸包、第二封信的文字。
# 依赖：港口 busan（ports_east_asia.toml）；物品 juseo_ms；势力 joseon（factions/09_eastasia.toml）；
#   技能 calligraphy / lang_chinese（skills.toml）；属性 eloquence。B10b：无需改名。主线门禁：无。
# C7：本条无 C7 线，不读也不设任何 c7_ 旗标。
# 读的旗标：c13_request_yi_hwang_copied（reply / reply_half 的 v1_copied 变体，只改文字）。
# 设的旗标：accepted（offer 两条接法）、declined（offer 回绝，终局）、copied（offer 誊信，分支）、
#   answered（handover 答了第三页，分支）、half（handover 没答全，分支）、
#   late（handover 或收尾超时，终局）、done（reply 两个选项，终局）、partial（reply_half 两个选项，终局）。
#   家族冷却 c13_offer_busan 与釜山别的请托共用。
# 秘密：无（cast 无 secret）。心学、佛老之争本条不写；老先生只反问，不训人。
# 要紧的一句（brief 的 voice）：“君在海上，见潮与月，可曾觉得它们是一物？老夫在溪边看了一辈子水，只看见了一半。”
#   全轨道只用一次，在 handover 章的第三页里。
# 未成年人：孩子只写字、问问题、跑腿，不写危险。
# 报酬：无现金（清贫，以书稿代报酬）；唯一奖励 juseo_ms（reply.keep 与 reply_half.keep；give_boy 两路不给玩家物品，书给了孩子，有意如此）；
#   好感：接下 +2、handover 答了 +3、收尾 keep +8 / give_boy +10（brief 各章的数；最多 15，在全表 +25 之内）；
#   reply_half 收尾 keep +4 / give_boy +6；朝鲜声望 +2、名声 +3 只在 reply 的两个选项；回忆一张只在 reply.keep。
#   来信：第二封信 letter 放在收尾两章的 done 选项——reply 两个选项是同一封（写给看海的君），reply_half 两个选项是另一封短信（大半写给孩子）；
#   每局只收到其中一封，全轨道两种文字，在 ≤2 封之内。超时只写见闻，不写来信（brief：孩子不是 cast，老先生不知道）。
# 回忆插画 mem-request_yi_hwang-reply：釜山码头的船边，渔家孩子抱着油纸包里的书稿，潮水正涨，天边挂着半个月亮。

[[tracks]]
key = "request_yi_hwang"
name = "渔家孩子的问学信"
kind = "request"
start = "offer"
auto = true
cast = ["yi_hwang"]

# 一、釜山浦的码头：渔家孩子攥着一封字歪的信，想请跑海的人添几句潮水的事。
[[tracks.chapters]]
key = "offer"
title = "歪歪扭扭的一封信"
text = "釜山浦的码头上晒着一排鱿鱼，一个十二三岁的渔家孩子从鱿鱼架子底下钻出来，拦住了你。他手里攥着一封信，纸被汗浸软了，字歪得认不出几个；“潮”字他不会写，画了三道水。信上问的是：潮水为什么一天来两次？书上说的“理”，管不管潮水？他听人说，安东乡下有个老先生，谁的信都回。可东莱府的驿卒看了他的字就笑，说是鸡爪子刨的。“你是跑海的，”孩子把信往你手里塞，“在后头添几句海上的事。先生没见过海。”"
mood = "cheerful"
at = "busan"
when = [
  { kind = "date", from = [1559, 1, 15], to = [1568, 12, 31] },
  { kind = "age", ge = 17 },
  { kind = "fame", ge = 5 },
]
deadline = [1568, 12, 31]
family = "c13_offer_busan"
family_cooldown_days = 20

[tracks.chapters.timeout]
next = "failed"
effects = []

[[tracks.chapters.choices]]
key = "copy"
text = "替他把信誊清，再添几句潮水的事。"
requires = [{ kind = "skill", skill = "calligraphy", ge = 60 }]
hint = "你的字比他的端正不了多少，誊了也是白誊。"
next = "handover"
reply = "你誊了一遍，孩子趴在船舷上看，看一笔念一个字。信角那三道水你照原样画上，没改。送到驿站，驿卒这回没笑，翻过来看了看，问是谁写的。孩子挺起胸：“我问的。”"
effects = [
  { kind = "affinity", person = "yi_hwang", value = 2 },
  { kind = "flag", flag = "c13_request_yi_hwang_accepted" },
  { kind = "flag", flag = "c13_request_yi_hwang_copied" },
]

[[tracks.chapters.choices]]
key = "add"
text = "原样寄出，后头添几行你在海上见过的潮。"
next = "handover"
reply = "你在信尾添了几行：哪片海一天两潮，哪片海一天只来一潮，哪处的潮一涨就是两丈。孩子把信折了三折，塞进驿卒的布袋，回头说：“先生要是不回，我就再写。”"
effects = [
  { kind = "affinity", person = "yi_hwang", value = 2 },
  { kind = "flag", flag = "c13_request_yi_hwang_accepted" },
]

[[tracks.chapters.choices]]
key = "decline"
text = "这是读书人的事，我只管船。"
next = "failed"
reply = "孩子把信塞回怀里，从鱿鱼架子底下钻过去，跑了。后来你在码头上又见过他一回，他蹲在驿站门口的石阶上，拿树枝在地上一遍一遍地写那个“潮”字。"
effects = [{ kind = "flag", flag = "c13_request_yi_hwang_declined" }]

# 二、三页回信：老先生回了，第三页是写给你的。
[[tracks.chapters]]
key = "handover"
title = "三页回信"
text = "两个月后，那孩子举着一封厚信在码头上跑，草鞋跑掉了一只也不回头捡。老先生回了三页。第一页夸他问得好，说字歪不要紧，问得正。第二页一句一句反问：潮来之前，岸边的石头先湿还是先干？月亮不圆的夜里，潮还来不来？你爹出海，看潮还是看月？孩子挠着头念，念一句，抬头看一眼海。第三页是写给你的，只有一行半：“君在海上，见潮与月，可曾觉得它们是一物？老夫在溪边看了一辈子水，只看见了一半。”“先生在等你回话。”孩子说。"
news = "釜山码头上有个渔家孩子，举着安东老先生写来的三页回信满码头跑，见人就念上头的问题。"
speaker = "captain"
mood = "tender"
at = "busan"
objectives = [
  { kind = "wait", days = 60, text = "等安东的回信" },
  { kind = "at", at = "busan", text = "回到釜山" },
]
when = [{ kind = "alive", person = "yi_hwang", value = true }]
deadline_days = 150

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_yi_hwang_late" }]
news = "釜山码头上那个渔家孩子，举着安东老先生的回信等一个外来的船长，等了好几个月，后来自己写了回信寄走了。"

[[tracks.chapters.choices]]
key = "hanmun"
text = "提笔用汉文写半页回答。"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_chinese", ge = 60, hard = true }]
hint = "那些字你都认得，提起笔来，却连不成一句文言。"
next = "reply"
reply = "你写了半页：潮跟着月走，可大潮小潮又不全跟着月；海上的人只知道它准，不知道它为什么准。写到这里你搁下了笔。孩子凑过来看了半天：“你也有不知道的？”"
effects = [
  { kind = "affinity", person = "yi_hwang", value = 3 },
  { kind = "flag", flag = "c13_request_yi_hwang_answered" },
]

[[tracks.chapters.choices]]
key = "dictate"
text = "我说，你写。"
next = "reply"
reply = "你说一句，他问三句：“一物”是什么物？“一半”是哪一半？你说月亮走到哪，潮就跟到哪，可初一十五的大潮也有不准的时候，跑船的只认它来得准。他停了笔：“那它为什么准？”你答不上来。他想了想，把这一问也写了上去，字比上回端正多了。"
check = { attr = "eloquence", base = 35, per = 6 }
effects = [
  { kind = "affinity", person = "yi_hwang", value = 3 },
  { kind = "flag", flag = "c13_request_yi_hwang_answered" },
]

[tracks.chapters.choices.fail]
