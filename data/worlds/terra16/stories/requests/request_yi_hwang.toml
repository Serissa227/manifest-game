effects = [{ kind = "flag", flag = "c13_request_yi_hwang_half" }]
news = "釜山码头上，一个渔家孩子替外来的船长代笔写回信，写到一半跟不上，哭了一场，那封信只寄出去半页。"

[[tracks.chapters.choices]]
key = "skip"
text = "这一页我不回，你回你那两页。"
next = "reply_half"
reply = "孩子点点头，像是松了口气，又像有点失望。他蹲在码头的石阶上，把第二页的三句问话抄到自己的纸上，说要先回家问他爹。"
effects = [{ kind = "flag", flag = "c13_request_yi_hwang_half" }]

# 三、寄来的一部书稿（第三页答了的一路）。
[[tracks.chapters]]
key = "reply"
title = "寄来的一部书稿"
text = "又过了两个月，东莱府的驿卒在码头上找到你，就是当初笑那孩子字的那一个。他递来一个油纸包，捆得方方正正。包里是老先生的第二封信，只有七八行；底下压着一部书稿，抄得一笔不苟，是他这些年从朱子的书信里一封一封挑出来、编成的节要。信里说，这部稿子送给“看海的君”，也让那孩子借去读。孩子不知从哪里听到了风声，早就蹲在你的船边等着，两只手在裤腿上擦了又擦。"
news = "釜山一个渔家的孩子收到了安东老先生的回信，听说信里还问起了海上的潮水。"
mood = "tender"
at = "busan"
