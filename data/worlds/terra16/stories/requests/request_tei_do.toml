# 四、波上的夜：老家臣来了那霸，护国寺后院隔着一盏灯，两个人都不先开口。
[[tracks.chapters]]
key = "meeting"
title = "波上的夜"
text = "那霸，波上崖下的护国寺。夜里后院只点一盏灯，郑迵和老家臣隔着灯坐着，我坐在中间。老人的布包放在膝上没解，郑迵的手按着一叠还没写字的纸。两个人都不先开口。灯芯爆了一下，寺外的浪一阵一阵拍着崖底。郑迵终于转过来看我：“他说一句，你传一句。他用萨摩话说，你别替他文雅；我答他，你也别替我客气。”老人听不懂这句，却像听懂了，把布包解开，把那方旧印放在灯下。"
speaker = "captain"
mood = "mystic"
at = "naha"
when = [{ kind = "alive", person = "tei_do", value = true }]
objectives = [{ kind = "at", at = "naha", text = "回那霸" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_tei_do_late" }], news = "那霸护国寺的和尚说，有位从萨摩来的老客人在寺里借住了好些日子，等的人一直没来，后来搭回程的船走了。" }

[[tracks.chapters.choices]]
key = "translate"
text = "在两人之间来回传话，一个字也不改。"
next = "settle"
reply = "我传了大半夜。老人说得慢，郑迵答得快，有两回郑迵的嗓门大起来，老人就停下，等他把那口气喘完。最后一句是：“印还是那方印，盖印的手换了。”说完，老人把旧印包好，起身走了，没让人送。郑迵坐着没动，就着那盏灯，把这句话用汉文写了三遍，每一遍换一个字。"
effects = [{ kind = "affinity", person = "tei_do", value = 3 }, { kind = "flag", flag = "c13_request_tei_do_met" }]

[[tracks.chapters.choices]]
key = "brush"
text = "把笔墨推到他们中间，让他们自己笔谈。"
next = "settle"
reply = "两个人都看得懂汉文，谁也用不着我。纸上的字越写越密，郑迵写得快，常常写到一半划掉重来；老人写得慢，一笔不改。我替他们添了两回灯油。天快亮时，老人在纸尾写下最后一行：“印还是那方印，盖印的手换了。”写完起身，把满纸的字留给郑迵，只带走了那方旧印。郑迵把那一行另抄在一张纸上，抄了三遍，每遍动一个字。"
effects = [{ kind = "flag", flag = "c13_request_tei_do_met" }]

# 四′、只带了话（酒馆的原话是准的）：郑迵听完那句话，问老人说话时的脸色。
[[tracks.chapters]]
key = "word"
title = "那句话"
text = "回到那霸，我先去了久米村。郑迵把酒馆里那几句原话听完，一句没打断，只叫学生在旁边记。轮到老家臣那句，我照着老人的停顿说了一遍：“印还是那方印，盖印的手换了。”郑迵半天没出声，手指在案上敲着，一下一下，像在数这句话有几个字。“他说这话的时候，”他问，“是什么脸色？”"
speaker = "captain"
mood = "mystic"
at = "naha"
when = [{ kind = "alive", person = "tei_do", value = true }]
objectives = [{ kind = "at", at = "naha", text = "回那霸" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_tei_do_late" }], news = "那霸久米村的人说，郑家那位等鹿儿岛来的消息等了几个月，后来不等了，又埋头去改给福州的咨文。" }

[[tracks.chapters.choices]]
key = "face"
text = "照实说：他说完就低头看自己的手。"
next = "settle"
reply = "郑迵听完，把学生打发出去，自己把那句话写在一张纸的角上。“老人家说话留了一半，”他说，“另一半，萨摩的船会替他说。”他把纸角折起来，压在砚台底下。"

[[tracks.chapters.choices]]
key = "words"
text = "说你只顾着记字，没看他的脸。"
next = "settle"
reply = "“字是死的，脸是活的。”他瞪了我一眼，又叹了口气，“也罢，字准就好，脸色我自己猜。”他在那句话旁边画了个圈，没写评语，圈画得很重，朱砂透到了下一张纸上。"

# 四″、只带了话（酒馆的话只有大意）：郑迵在拿不准的字旁边点了一排点。
[[tracks.chapters]]
key = "word_vague"
title = "哪一个字"
text = "回到那霸的久米村，我把酒馆里的话照大意说了。郑迵听到一半就搁了笔：“他们说的是‘贡’，还是‘献’？是‘晚了’，还是‘慢了’？”我答不上来。他没骂人，只把我说的那几句写下来，在拿不准的字旁边各点一个点，点了一排。然后是老家臣那句，我照着老人说话时的停顿念了：“印还是那方印，盖印的手换了。”这一句，郑迵没有点点。"
speaker = "captain"
mood = "mystic"
at = "naha"
when = [{ kind = "alive", person = "tei_do", value = true }]
objectives = [{ kind = "at", at = "naha", text = "回那霸" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_tei_do_late" }], news = "那霸久米村的学生说，郑家那位先生把鹿儿岛的事搁下了，说等来的话要是只剩个大意，不等也罢。" }

[[tracks.chapters.choices]]
key = "admit"
text = "认了：酒馆里的原话，你只记得大意。"
next = "settle_partial"
reply = "“记得大意，就说大意。”他把那一排点又描了一遍，描得更圆，“点在这里，首里的人看了就知道这几个字没人听准。总比编出来的强。”"

[[tracks.chapters.choices]]
key = "guess"
text = "把大意说得像原话，替那几个字拿个主意。"
next = "settle_partial"
reply = "我说是“贡”，说得很肯定。他看了我一会儿：“萨摩的船头说话，不会这样整齐。”他没擦掉那个点，反倒在旁边又添了一个，比先前那个小些，是记给我的。"
effects = [{ kind = "affinity", person = "tei_do", value = -2 }]

# 五、收尾（原话准，或两人见了面）：节略写完不封，问要不要原样报给国王。
[[tracks.chapters]]
key = "settle"
title = "要不要原样报给国王"
text = "久米村的书房，灯点到半夜。郑迵把酒馆里那几句原话、老家臣那句短话，一条一条写成节略，船头说“进贡”的那一处，他用朱笔在旁边画了一道。写到老人那句，他写了三遍，每遍换一个字，换完又都划掉，照原样誊了一遍。学生进来添灯油，他头也不回地把人轰了出去。节略写完，他没封，推到灯下。“首里那些人，萨摩话一句听不懂，难听的话也不爱听。”他看着我，“这些话，要不要原样报给国王？”"
