key = "v1_shaky"
when = [{ kind = "flag", flag = "c13_request_pedro_luna_shaky", value = true }]
text = "佩德罗把本子一页页翻过去，读数一行行对上他的刻度。有三行写着“风浪中不准”，字迹被海水洇开了，他对着窗口看了很久，才认出那是什么数，那几页他翻得最慢。翻到最后一页，他的手停住了：那一行是港里老领航说的话。他看了两遍，说：“我知道。”顿了顿，又说：“可我不敢。”他抬头看我，像在等我问，手里的绒布却一直在擦星盘。"

