reply = "布市上围了一圈人，我一匹一匹量，短的都短一掌，一匹都没有例外。银钱商的老主顾听见了，当场把布收了回去，说是织坊弄错了，回头就去找那位织坊的管事。"
effects = [{ kind = "affinity", person = "naran_vaniya", value = 3 }, { kind = "flag", flag = "c13_request_naran_vaniya_measured" }]
