# 请托：缩水的棉布（request_naran_vaniya）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：纳兰·瓦尼亚（naran_vaniya，1540-07-01 生，男），坎贝的棉布经纪学徒，学院同学；势力 gujarat，身份档 1。cast：cast/classmates_custom_cambay_broker.toml。
# C7：bond_naran_vaniya 在 1562 年坎贝重逢，本文件不写重逢，请托窗口从 1563 年起。
# 类型：说服（persuade）。五章：offer（报价）、persuade（银钱商的铺子）、result（布头上的字，量布或找大主顾的路线）、result_paid（还清以后的量布台，先付钱的路线）、result_partial（退回织坊的布，当众量布失败的路线）。
# 报价：T（当面）。人物按日程在坎贝，玩家用 ask:request_naran_vaniya 启动；auto=false；offer 不写 at，目标是在坎贝的棉布市找到他。窗口 1563-01-01 至 1590-06-30；offer 写 deadline=1590-06-30，timeout 直接 failed，不写见闻。
# 进行中：persuade 及之后各章都是普通章（没有 window 与 default，不设期限）。brief 的窗口 1563-01-01..1590-12-31 写在各章 when 的 date 条件里，过了这一天不再出现；轨道可以一直等。
# 依据·史实背景：古吉拉特的棉布经纪与银钱商（萨拉夫）；经纪行签的“足尺”是行里的信用，买主凭它收货。
# 依据·原创：纳兰、巷口的银钱商、那杆包铜的公尺、布头上的“短一掌”，以及三条解法。放贷的利率与借据的格式只用传闻口吻，正文不写具体数字。
# 秘密：背着父亲做过一笔小买卖，赔了；本钱是向巷口银钱商借的，每周从零用里抠几个铜子去还。只在 offer 章由银钱商当面说出（“你借我的那笔小账”）；纳兰的反应写口头禅与 stand_with 的回复；见闻永远不写债；父亲不出场、不知情。
# 读的旗标：只读 bond naran_vaniya ≥ C（offer 的 variant）。不读、不设任何 c7_ 旗标。
# 设的旗标：c13_request_naran_vaniya_accepted（offer 两条接法）、_declined（offer 回绝）、_paid（persuade 替他还债）、_measured（当众量布成功或找大主顾）、_stalled（当众量布失败，只设旗标，结局在 result_partial）、_done（result 与 result_paid 的收尾）、_partial（result_partial 的收尾）。
# 结构：pay_off 路线单独走 result_paid，measure_public 失败走 result_partial。没有选项靠本轨道另一路径设的旗标门禁，所以 result 的两个选项都不用 requires。
# 报酬：现金 pay_off 路线先付出，最好结局收 900；其余路线最好 900、折中 500。好感最多 +13；名声 +2（最好结局）；回忆 mem-request_naran_vaniya-result。
# 依赖：纳兰的日程已是 khambhat（cast/classmates_custom_cambay_broker.toml 1554—1590，港口 khambhat 见 ports_india.toml），无需 B10b 改名；技能 negotiation、属性 commerce。
# 回忆插画清单：
#   mem-request_naran_vaniya-result「印号旁的一掌」：经纪行的量布台上，布头盖着纳兰自己的印号，印旁有一道被尺子削去的小痕。

[[tracks]]
key = "request_naran_vaniya"
name = "缩水的棉布"
kind = "request"
start = "offer"
auto = false
cast = ["naran_vaniya"]

# 一、足尺：纳兰在棉布市拆开一匹布，巷口的银钱商过来逼他签字。
[[tracks.chapters]]
key = "offer"
title = "足尺"
text = "纳兰把一匹棉布拖到你面前，当着你拆开。布边上的印还是新的，墨没干透，他的手指沾了一截黑。他拿尺从头量到尾，量完指给你看：“短了一掌。”这批布要发去霍尔木兹，买主只认经纪行签的“足尺”。巷口的银钱商踱过来，笑眯眯地说：“签了吧。你借我的那笔小账，我也就不跟你父亲提了。”纳兰的脸一下子红了，却把尺往前一递：“尺先给你，价再给我。”他不签。"
speaker = "captain"
mood = "tense"
when = [{ kind = "date", from = [1563, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "naran_vaniya", ge = 18 }]
objectives = [{ kind = "person", person = "naran_vaniya", text = "在坎贝的棉布市找到他" }]
deadline = [1590, 6, 30]
timeout = { next = "failed", effects = [{ kind = "affinity", person = "naran_vaniya", value = -3 }] }

[[tracks.chapters.variants]]
key = "v1_bond_c"
when = [{ kind = "bond", person = "naran_vaniya", level = "C" }]
text = "纳兰见你走近，先把尺递过来：“你量，我信你的尺。”布边上的印还是新的，墨没干透，他的手指沾了一截黑。你拿尺从头量到尾，量完指给他看：“短了一掌。”这批布要发去霍尔木兹，买主只认经纪行签的“足尺”。巷口的银钱商踱过来，笑眯眯地说：“签了吧。你借我的那笔小账，我也就不跟你父亲提了。”纳兰的脸一下子红了，却把尺往前一递：“尺先给你，价再给我。”他不签。"

[[tracks.chapters.choices]]
key = "stand_with"
