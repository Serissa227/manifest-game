# 三之一、布头上的字：当众量布或找大主顾之后，布重新量过，纳兰付谢礼。
[[tracks.chapters]]
key = "result"
title = "布头上的字"
text = "纳兰在经纪行的量布台上，把那批布重新量过一遍。台上的灯擦得很亮，照着一排排布头，短的那几匹，布头上还留着“短一掌”的炭字。短的退回织坊，足的签上他自己的印号。他量得很慢，每量一匹都要抬头看你一眼。量到一半，有个织坊的管事凑过来想说情，他没抬头，只说：“短了就是短了，你去跟布说。”量完，他从钱袋里数出一些铜子，又数了一遍，推到你面前——“这是谢你的，不是还你的。还你的，另算。”"
speaker = "captain"
mood = "cheerful"
at = "khambhat"
when = [{ kind = "date", from = [1563, 1, 1], to = [1590, 12, 31] }, { kind = "alive", person = "naran_vaniya", value = true }]
objectives = [{ kind = "at", at = "khambhat", text = "在坎贝的经纪行找到他" }]
news = "坎贝经纪行的一个年轻人，宁可退回一批布，也不肯在布上签“足尺”。"

[[tracks.chapters.choices]]
key = "take_thanks"
