next = "persuade"
reply = "他报了一个数，一个铜子也不让，连上周还的那几个都算进去了。他把账本翻到那一页，指着自己的字给我看：“欠的就是欠的，别替我省。”"
effects = [{ kind = "affinity", person = "naran_vaniya", value = 2 }, { kind = "flag", flag = "c13_request_naran_vaniya_accepted" }]

[[tracks.chapters.choices]]
