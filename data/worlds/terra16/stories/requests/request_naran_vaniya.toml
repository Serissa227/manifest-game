# 二、银钱商的铺子：账本比人高，三种解法各有各的代价。
[[tracks.chapters]]
key = "persuade"
title = "银钱商的铺子"
text = "银钱商的铺子里，账本比人高。他坐在柜台后头拨着算盘，头也不抬。“纳兰的债不多，”他说，“可利钱也不少。我要的是那张‘足尺’的签字，卖这批布的，是我的老主顾。”纳兰站在门口没进来，隔着门说：“我的账，我自己还。”他身后的墙上挂着一杆尺，尺头包着铜，是城里经纪行公用的那杆。"
speaker = "captain"
mood = "tense"
at = "khambhat"
when = [{ kind = "date", from = [1563, 1, 1], to = [1590, 12, 31] }, { kind = "alive", person = "naran_vaniya", value = true }]
objectives = [{ kind = "at", at = "khambhat", text = "在坎贝的巷口找到银钱商的铺子" }]
news = "坎贝的布市上，有人拿着经纪行的公尺当众量了一批去霍尔木兹的棉布，匹匹短一掌。"

[[tracks.chapters.choices]]
key = "pay_off"
text = "替纳兰把那笔债还清，当场要回借据。"
next = "result_paid"
requires = [{ kind = "cash", ge = 400 }]
hint = "钱袋里的数，还够不着这笔债。"
reply = "银钱商数完钱，把借据推过来，脸上的笑一下子没了。我把借据拿到门口交给纳兰，他当着我撕成两半，又把两半收好。“这一笔记在我本子上，”他说，“我自己还。”"
news = "坎贝巷口的银钱商铺子里，有人一次数足了钱，银钱商脸上的笑一下子没了。"
effects = [{ kind = "cash", value = -400 }, { kind = "affinity", person = "naran_vaniya", value = 3 }, { kind = "flag", flag = "c13_request_naran_vaniya_paid" }]

[[tracks.chapters.choices]]
key = "measure_public"
