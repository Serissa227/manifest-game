effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "naran_vaniya", value = 7 }, { kind = "fame", value = 2 }, { kind = "memory", memory = "mem-request_naran_vaniya-result", title = "印号旁的一掌" }, { kind = "flag", flag = "c13_request_naran_vaniya_done" }]

