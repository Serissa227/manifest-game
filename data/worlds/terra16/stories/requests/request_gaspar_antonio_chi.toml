# 请托：岬角的名字（request_gaspar_antonio_chi）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：加斯帕尔·安东尼奥·奇（gaspar_antonio_chi，1531 年生，男），马尼人，兰达的学生，1573 年起在梅里达做总通事，替官府与玛雅乡人写呈报。cast 在 cast/historical_05_americas.toml。
# 类型：去某处（go）。章节：offer（报价）→ arrive（科苏梅尔的井边问地名）→ 三条收尾路：report（两份都有）、report_half（只记得一半）、report_register（只有官府的写法）；终局 done / failed。
# 报价：V 到访（auto=true）。他从梅里达下到坎佩切的税关，offer 与 report 系在坎佩切。窗口 1578-01-15 至 1582-12-31；family c13_offer_campeche，冷却 20 天。offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 依据·史实：1577 年王室发出的五十条地理问询，尤卡坦各镇 1579—81 年作答，奇在 1581—82 年替梅里达一带若干镇执笔。正文只写“印好的问题单”与“第十条”，不写标题与拉丁文。
# 依据·原创：科苏梅尔的礁石与井，海龟上岸的那个说法，老人们在井边念地名，塌石屋的名字（始终不写出来）。
# 待核：岛上地名的读法；那口井连着哪一家（正文只按传闻写，不落实）。
# 依赖：港口 campeche、cozumel（ports_americas.toml）；技能 lang_yucatec（skills.toml）；检定属性 eloquence。B10b 无需改名。主线门禁：无（不是主线人物）。
# C7：不涉及。本文件不读也不设任何 c7_ 旗标。
# 读的旗标（只读，不设）：c13_main_ix_nikte，offer 与 report 各一个 variant，只改伊希玩家听出口音的一句；由伊希主线设，尚未写。
# 写的旗标：accepted（接下）、declined（回绝）、elders（问到老人的名字）、half（只记下一半）、done（两份都交）、partial（只交了一份）、failed（不交）、late（超时）。elders 与 half 是分支记号，没有人读取。
# 秘密：cast 人设里有两件事他不主动提起，本请托不碰，见闻也不写。
# 口头禅：“Bix a beel？”只在 offer 说一次。
# 报酬：现金最多 900（两份都交）；好感最多 +13；lang_yucatec +20（交老人那份时）；名声 +2；new_spain 声望 +2；回忆 mem-request_gaspar_antonio_chi-report。
# 回忆插画 mem-request_gaspar_antonio_chi-report：烛下的长桌，一张纸折成两栏，左边是税关的印，右边是几个手写的地名，窗外是坎佩切的税关。
# 写法说明：普通章不写 window 与 default。三条收尾路由 next 分开，各自两到三个选项，不用 requires 门禁本轨道设过的旗标；只有“请老人念”一项要求技能。

[[tracks]]
key = "request_gaspar_antonio_chi"
name = "岬角的名字"
kind = "request"
start = "offer"
auto = true
cast = ["gaspar_antonio_chi"]

# 一、第十条问题：税关的长桌上，他先用玛雅话问候，然后请你去科苏梅尔问地名。
[[tracks.chapters]]
key = "offer"
title = "第十条问题"
text = "税关的长桌上摊着一张印好的问题单，纸边被手指磨得发毛。梅里达的书记官发下来的，五十条，尤卡坦各镇要一条条答。奇坐在桌子那头，第十条底下画了一道线。见你进来，他先用玛雅话问：“Bix a beel？”——你的路走得还好吗？接着把册子推过来，指头点在科苏梅尔那一栏上：“岬角、水井、岛屿，各是什么意思。公证人照耳朵拼的，一半我读不出来。请你去一趟科苏梅尔，让岛上的老人一个个念给你听。”他顿了顿，声音压低：“镇长要的是跟贡赋册对得上的那一份。老人们说的，多半对不上。”"
