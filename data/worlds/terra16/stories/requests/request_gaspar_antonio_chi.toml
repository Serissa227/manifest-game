# 二、井边的老人：科苏梅尔。老人的一份只能听，官府的一份在纸上。
[[tracks.chapters]]
key = "arrive"
title = "井边的老人"
text = "科苏梅尔海边的一口井旁，几个老人坐在石头上剥玉米，玉米皮扔了一地。官府册子上叫“白岬”的那块礁石，老人们管它叫另一个名字，意思是海龟上岸的地方。从前朝圣的船也在那儿靠岸。井的名字连着一个家族，哪家的井，哪家的人都知道。你把问题单摊在石头上，最老的那位一个个指过去，用玛雅话念。问到岛中央那座塌了的石屋，他闭了嘴，只说：“那个名字不往纸上写。”"
speaker = "captain"
mood = "mystic"
at = "cozumel"
objectives = [{ kind = "at", at = "cozumel", text = "到科苏梅尔的井边去" }]
