# C13d 请托：一部《广舆图》（request_martin_de_rada）。中文，Claude 写。
# 人物：马丁·德·拉达 martin_de_rada（1533 年生，男；奥斯定会修士，潘普洛纳人，精数学与天文；势力 new_spain，身份档 P 清贫，报酬按任务单走）。
#       cast 在 cast/historical_06_ming.toml，日程 1576-01-01 至 1577-12-31 在马尼拉（church）。
# 类型：找东西（fd）；3 章：offer →（接下）handin → use；（借书）offer 直接到 use；终点 done / failed。没有 stage 章，因此没有 window 与 default。
# 报价：当面（T）。auto=false，玩家“问请托”（ask:request_martin_de_rada）启动；offer 章不写 at，目标是在马尼拉找到他。
# 规划窗口（不进 TOML）：offer 1576-01-15 至 1577-12-31；handin 期限 1578-02-28；use 期限 1578-02-28（到期不付不罚，按折中收尾）。
# 解法：offer 三条路——买一部来（接下／接下并问缘由）、花钱借一部（八连的唐人书商，押金 400）；handin 两条路——留下（扣书）、借他描（不扣）；
#       use 三条路——自己念（lang_chinese 60，最好）、请八连的通事（雄辩检定 35/6，失败折中）、让他自己认（折中）。
# 结构说明：choice 的 fail 分支引擎不带 reply，所以 interpreter 的回复只写到通事进屋、开口念为止，成败的差别由报酬和见闻承担，不在回复里先说结果。
# 依据：
#   史实——拉达生于潘普洛纳，奥斯定会修士，精数学与天文；1575 年随明朝军官出使福建，带回一百多种中文书，回马尼拉后请通事一本本译读；
#         罗洪先《广舆图》约 1555 年刊，每幅画方格，一格百里（计里画方）；他相信中国就是马可·波罗的契丹。
#   原创——修院那间堆满书的屋子、闽南老通事只认账本上的字、拉丁数字编号的书脊、自编的汉拉字典、八连的老闽商与押金、总督府批给译书的钱。
# 不碰：林晚灯主线 8 写的使团那一路（只写使团回来以后的修院）；他写给新西班牙的信里的话（秘密，不写、不暗示、见闻不写）；他 1578 年的死（timeout 的信只说“往南边去了”）。
# 读的旗标（只读）：c13_main_lin_wandeng（offer 的 variant wandeng，林晚灯玩家被他认出福建见过；由林晚灯主线设）。
# 设的旗标（全部为 c13_request_martin_de_rada_<事件>）：accepted / declined（offer）；borrowed（offer 借书）；lent（handin 借他描）；late（handin 超时）；done / partial（use 收尾）。
# 依赖：guangyutu_print（items/books_03_geography_02.toml，有 shop）；技能 lang_chinese；检定属性 eloquence；日程港口 manila 已存在。
# 英文：不写（terra16 先只做中文，英文以后补）。
# 回忆插画清单：
#   mem-request_martin_de_rada-use「修院灯下的方格图」：马尼拉修院的灯下，一部方格地图摊在拉丁文经纬格旁边，两个人一个念一个算。

[[tracks]]
key = "request_martin_de_rada"
name = "一部《广舆图》"
kind = "request"
start = "offer"
auto = false
cast = ["martin_de_rada"]

# 一、一百多种书：修院里的一间屋子，他缺一部图。
[[tracks.chapters]]
key = "offer"
title = "一百多种书"
text = "马尼拉奥斯定会修院的一间屋子，中文书从地上堆到窗台：历书、律例、医书，最下面压着几册兵书，每册的书脊上都用墨水写着拉丁数字。窗边的通事是个闽南出身的老水手，两种话都会说，字只认得账本上那一类，正把一册医书的目录念给修士听。拉达盘腿坐在书堆中间，膝上一张纸，左边列着汉字地名，右边列着经纬度，两列对不上。他抬头看见你，笔尖还停在纸上。“你的船是从哪个港来的？你们量过那儿的纬度没有？量过的数报给我，没量过就报个大概，回头我拿星盘自己校。”你报了，他低头写下，写完摇头。“福建那几个港，我在海上量的数，跟书里差了将近一度。书错，还是我的星盘错，得有一部像样的图才知道。罗洪先的《广舆图》，一格一百里的那种。福建一带的港口有卖，你去买一部来。”"
speaker = "martin_de_rada"
mood = "cheerful"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1576, 1, 15], to = [1577, 12, 31] }]
objectives = [{ kind = "person", person = "martin_de_rada", text = "在港里找到他" }]
deadline = [1577, 12, 31]
cast = ["martin_de_rada"]

[tracks.chapters.timeout]
next = "failed"
