# 三、读第一页：灯下，念给他听，他来算。
[[tracks.chapters]]
key = "use"
title = "读第一页"
text = "修院的灯下，《广舆图》摊在桌上，旁边是一张他自己画的经纬格，比书上的方格密得多。拉达要有人把第一页的字念出来，他好对着算。第一幅画的是京师。老通事念出“京师”两个字，往下是图例的小注，他认得一半，用手指点了点，摇头。拉达的笔停在半空。“这一格的里数，得有人念给我听。”他从抽屉里抽出一本小册，翻到福建那几页，那是他自己量的数。“对不上，我听这个‘百里’，就知道对不上。”他说得很轻，眼睛却亮了，“要么书上的一里比我的一里长，要么我的星盘错了。我要一个数一个数地听。”"
speaker = "martin_de_rada"
mood = "mystic"
night = true
when = [{ kind = "alive", person = "martin_de_rada", value = true }]
objectives = [{ kind = "person", person = "martin_de_rada", text = "在修院找到他" }]
deadline = [1578, 2, 28]
cast = ["martin_de_rada"]

