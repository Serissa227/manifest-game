# 二、一格一百里：书放到了他桌上，他想留一阵。
[[tracks.chapters]]
key = "handin"
title = "一格一百里"
text = "你把《广舆图》放在他桌上。他没看字，先翻开第一页，笑出了声：满页都是方格，每一格注着“百里”。他用食指一格一格数过去，数到纸边才抬头：“等距的。画这图的人想得周到，读的人不用问路，数格子就行。”笔放下了，他才说到正事：修院里的抄写员描图最稳，他想让抄写员把全书一页页描下来，描完一页，他对一页。“书得在我手边放一阵。”他看着你，“留给修院，还是借我描完了还你？”"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "alive", person = "martin_de_rada", value = true }]
objectives = [{ kind = "item", item = "guangyutu_print", qty = 1, text = "带上那部《广舆图》" }, { kind = "person", person = "martin_de_rada", text = "在修院找到他" }]
deadline = [1578, 2, 28]
cast = ["martin_de_rada"]

