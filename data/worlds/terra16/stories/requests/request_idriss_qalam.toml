# 三、页边对页边：他在得土安接过抄回来的那页，先找那一行，再看位置。
[[tracks.chapters]]
key = "report"
title = "页边对页边"
text = "伊德里斯在得土安的书摊边等你，书还压在他手底下。你把抄回来的那页递过去。他先找那一行，找到了，脸上一松；再看它在哪里，脸色又变了。“在页边？”他抬起眼，“出处呢？哪一页，第几行？”你说就在页边，不在正文。他没再问，把书压平，手指在那一行上停了一会儿。然后他把自己那本批注翻开，翻到那一条。它也写在页边，字比别的都小，旁边空着，什么也没注。"
speaker = "captain"
mood = "tender"
at = "tetouan"
