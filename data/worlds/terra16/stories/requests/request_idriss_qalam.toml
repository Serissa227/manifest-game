# 二、书库的老人：突尼斯，那部书找到了，那一行在页边，不在正文里。
[[tracks.chapters]]
key = "arrive"
title = "书库的老人"
text = "宰图纳清真寺的书库在院子深处，管书的老人眼睛浑了，记性却好。你报上书名，他不问版本，抬手就指向第三架：“书不外借，抄可以，页角别折。”那部书摊在矮桌上，纸页脆得一碰就掉渣。你照着伊德里斯的纸找到那一行，字一个不差。可它不在正文里。它在页边，用一种发褐的墨，写得很小，像是另一个人的手。"
speaker = "captain"
mood = "mystic"
at = "tunis"
when = [{ kind = "alive", person = "idriss_qalam", value = true }, { kind = "date", from = [1563, 1, 1], to = [1576, 8, 23] }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "idriss_qalam", value = -3 }, { kind = "flag", flag = "c13_request_idriss_qalam_late" }, { kind = "letter", person = "idriss_qalam", text = "突尼斯的那一行，我托一个去讲席的学生去看了。他说书在，可他没找到那一页。——伊德里斯" }] }

[[tracks.chapters.variants]]
key = "v1_flags"
when = [{ kind = "date", from = [1569, 10, 1] }]
text = "宰图纳清真寺的书库照样开着。管书的老人先说了一句：“城里这几年换过几回旗，今年是这面，去年是那面，书库的门却一直没关。”开门的人换了三拨，他算最后一拨。他眼睛浑了，记性却好，你报上书名，他抬手就指向第三架。那部书摊在矮桌上，纸页脆得一碰就掉渣。你照着伊德里斯的纸找到那一行，字一个不差。可它不在正文里，在页边，用一种发褐的墨，写得很小。"

[[tracks.chapters.choices]]
key = "read_hand"
text = "细读那段批注的笔迹与前后文，连墨色一起记下。"
