# 请托：页边那一行（request_idriss_qalam）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：伊德里斯·卡拉姆（idriss_qalam，1540 年 5 月 22 日生，男），非斯抄书匠家的儿子，批注写得比正文还密。cast：cast/classmates_custom_fez_scholar.toml。
# 类型：去某处（gs）。三章：offer（报价）、arrive（到突尼斯，怎么记）、report（回来怎么说）。没有 stage 章，所以没有 window 与 default；普通章靠 deadline_days 与 timeout 结算。
# 报价：V（到访）。他从非斯下到得土安港口接一批寄来的书；auto=true，offer 的 at=tetouan；窗口 1563-01-01 至 1575-06-30。
#       offer 写 family=c13_offer_tetouan、冷却 20 天；offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：arrive 在突尼斯宰图纳清真寺的书库，deadline_days=90，超时走 failed：来信一封、好感 -3、旗标 _late。report 没有期限，可以一直等。
# 依据·史实：宰图纳清真寺是突尼斯最老的讲席之一，书库藏抄本。1569 年以后的 variant 只用一句话带过城里换旗，不写战事。
# 依据·原创：伊德里斯、书库里管书的老人、页边那句“此句闻之于师，未见其书”、得土安的书摊。老人的名字不写。
# 秘密：批注里有一条引文，他从没找到原本，照样写进去，页边一个字也没注。只在 report 章、情谊 ≥ 30 的 let_him_say 里由他本人说出口；见闻、来信永远不写。
# 读的旗标：bond idriss_qalam ≥ C（offer 的 variant，非斯的老同学）；c13_request_idriss_qalam_gloss、_keeper（report 的 variant 读 arrive 的结果）。
# 设的旗标：c13_request_idriss_qalam_accepted（offer 两条接法）、_asked（ask_page）、_declined（offer 回绝）、_gloss（read_hand）、_keeper（ask_keeper 检定成功）、_late（arrive 超时）、_done（report 两条收尾）、_confessed（let_him_say）、_partial（leave_it）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不写娜拉、不写曲本、不写非斯（C7 的章节）。
# 报酬：现金最多 900（leave_it 给 500）；好感合计不超过 +13；名声 +1；回忆 mem-request_idriss_qalam-report（let_him_say 与 suggest_note 两条收尾给同一幅）。没有物品。
# 依赖：港口 tetouan、tunis（ports_north_africa.toml）；技能 lang_arabic（skills.toml）；属性 eloquence；人物 idriss_qalam。无需 B10b 改名。不加 c13_main_ 门禁：伊德里斯不在主线名单里。
# 与 brief 的差异（为了引擎能表达）：
#   (1) 普通章不写 window 与 default，窗口由 when 里的日期条件表示。
#   (2) 检定失败时选项的回复不换，所以 ask_keeper 的回复写成成败都说得通；只有检定成功才有的那一句，放进 report 的 keeper 变体正文。
#   (3) 回复不随变体改，gloss 的那句“原来两百年前就有人跟我一样”放进 report 的 gloss 变体正文。
#   (4) 见闻写在各选项上而不写在章上，免得超时也报出“抄了一下午”。
#   (5) 名声门槛按 brief 的 when 不写；V 模式的名声门槛没有列进 brief 的 when，这里照 brief。
# 回忆插画清单：
#   mem-request_idriss_qalam-report「两本书的页边」：得土安的书摊边，一本书摊开，页边一行小字，旁边空着。

[[tracks]]
key = "request_idriss_qalam"
name = "页边那一行"
kind = "request"
start = "offer"
auto = true
cast = ["idriss_qalam"]

# 一、没注出处的一条：得土安港口的书摊边，他拦住你说一个引错的字，再说正事。
[[tracks.chapters]]
key = "offer"
title = "没注出处的一条"
text = "得土安港口的书摊边，伊德里斯蹲在一摞刚到的书中间，翻到一页就皱起眉。“这个字引错了。”他把书往你面前一摊，指给你看：有人把一个点落在了别的字上，整句的意思就歪了。他抬头才认出你，手里还攥着书脊。“你来得正好。”他说，“突尼斯宰图纳清真寺的书库里，有人说藏着一部书，里面有我那条引文的原句。你去看一眼，把那一行连同前后两行抄回来。”说到这儿，他把自己那本批注合上了：“是对是错，我都要知道。”"
speaker = "captain"
mood = "tense"
at = "tetouan"
when = [{ kind = "date", from = [1563, 1, 1], to = [1575, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "idriss_qalam", ge = 18 }]
deadline = [1575, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_tetouan"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_classmate"
when = [{ kind = "bond", person = "idriss_qalam", level = "C" }]
text = "得土安港口的书摊边，伊德里斯蹲在一摞刚到的书中间，翻到一页就皱起眉。他一眼认出你，把书往你面前一推：“这个字引错了，你看。”一个点落在了别的字上，整句的意思就歪了。他没停，手已经伸进书堆里，抽出一张没写字的纸递过来。“你抄东西从不漏字，这回别破例。”他说，“突尼斯宰图纳清真寺的书库里，有人说藏着一部书，里面有我那条引文的原句。你去看一眼，把那一行连同前后两行抄回来。”说到这儿，他把自己那本批注合上了：“是对是错，我都要知道。”"

