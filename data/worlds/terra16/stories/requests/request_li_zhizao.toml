  { kind = "flag", flag = "c13_request_li_zhizao_done" },
  { kind = "letter", person = "li_zhizao", text = "对了三个。错的九个我都认，其中两个错得比我想的还远，我对着纸骂了半个时辰。目录读了三遍。“以钟定经度”那一条，我不信海上的钟走得准，可这个想法，是我这几年见过最像样的一个。书我留下了，你写的“经度”那个字，也和我写的一样。——李之藻" },
]
reply = "你在书铺后间摊开纸，一条一条译。译到论经度的那一章，你问书商该用哪个字，书商直摇头：“这个字，李先生一准有话讲。”你把译稿和改过的单子交给他。又过半个月，他带着回信进门，门槛还没跨过就笑了：单子上错了九个。“李先生高兴得像赢了一场赌，”他说，“我问他赌的什么，他不肯讲。”"

