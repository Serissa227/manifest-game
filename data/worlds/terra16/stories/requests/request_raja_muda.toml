text = "格雷西克的寓所里，拉惹·穆达把一张海图铺在地上。你进门的时候，他先报了一长串称号，报到一半停住，斜眼看你，等你接下去。你接上了，他才笑着把手指按上海图，从吉里一路划过海峡，停在马六甲上：“论起来，马六甲本该是我家的。”柔佛王廷召他的随从回去，三条船，人和几箱文书都装好了。王廷的口信却只有一句：王子暂留吉里。海峡南口有一条葡萄牙巡船，专截柔佛的船。“替我的船队开一条路。打也行，绕也行，人到就行。”"

