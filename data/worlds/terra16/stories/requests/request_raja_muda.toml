# 二、截船的帆：打退的那条船逃了，柔佛的三条船都在身后。
[[tracks.chapters]]
key = "battle"
title = "截船的帆"
text = "葡萄牙巡船的帆在海峡口的晨雾里出来了，比柔佛的三条船都大。你让三条船退到你的船后面，迎上去。两边的炮声停了，你打退的那条船先掉了头，往马六甲的方向逃去，帆影很快没进雾里，船尾还拖着一截断了的缆。柔佛的三条船都在你身后。桅顶上的人数完了，朝甲板喊了一声：“一个不少。”拉惹·穆达的船从后面靠过来，他站在船头，把一长串称号喊了半截，又咽了回去，只问：“都在？”他点点头，又说：“回去的路还长。”"
speaker = "captain"
mood = "tense"
when = [
  { kind = "date", from = [1576, 1, 1], to = [1587, 8, 24] },
  { kind = "alive", person = "raja_muda", value = true },
]
objectives = [{ kind = "battle", wins = 1, text = "进入本章以后赢一场海战，不限地点" }]
deadline_days = 120
timeout = { next = "failed", effects = [
  { kind = "affinity", person = "raja_muda", value = -3 },
  { kind = "flag", flag = "c13_request_raja_muda_late" },
  { kind = "letter", person = "raja_muda", text = "船队等不到风，又回了吉里。随从们说王子的信使会再来。——拉惹·穆达" },
] }

