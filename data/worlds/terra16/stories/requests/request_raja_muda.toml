# 三、长长的称号：格雷西克，王廷的文书与一个称号。
[[tracks.chapters]]
key = "after"
title = "长长的称号"
text = "柔佛的文书先到了格雷西克。拉惹·穆达听你讲完，从一卷文书里抽出一页，上面是王廷写给他的话，很短，他念了两遍。门口站着他的老随从，手里还捧着一只没打开的箱子，没有进来。“我本想跟船队一起回去。王廷说暂留，我就暂留。”他把页子折起来，压在海图上，海图的一角卷了起来，他弯腰重新压好，“王子的事，都是别人替我定的。”说完这句，他把文书收起来，换了一副口气，清清嗓子，要赏你一个称号。"
speaker = "captain"
mood = "tender"
at = "gresik"
when = [
  { kind = "date", from = [1576, 1, 1], to = [1587, 8, 24] },
  { kind = "alive", person = "raja_muda", value = true },
]
objectives = [{ kind = "person", person = "raja_muda", text = "回格雷西克找他" }]

[[tracks.chapters.variants]]
key = "v1_slipped"
when = [{ kind = "flag", flag = "c13_request_raja_muda_slipped" }]
text = "柔佛的文书先到了格雷西克。拉惹·穆达听你讲完，没打仗，船队是悄悄绕过去的，他愣了一下，然后笑了。他从一卷文书里抽出一页，王廷写给他的话，很短，他念了两遍。门口站着他的老随从，手里捧着一只没打开的箱子，没有进来。“我本想跟船队一起回去。王廷说暂留，我就暂留。”他把页子折起来，压在海图上，海图的一角卷了起来，他弯腰重新压好，“王子的事，都是别人替我定的。可绕过去也是开路。”说完这句，他换了一副口气，要赏你一个称号。"

