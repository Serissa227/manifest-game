# 请托：海峡口的巡船（request_raja_muda）。Claude 写（C13d，2026-10-25），仅中文；寰宇先只做中文，不写英文覆盖。
# 人物：拉惹·穆达（raja_muda，1540-09-16 生，男）。柔佛流亡王廷的王子，来吉里时只带一只箱子和一长串称号。cast：cast/classmates_giri.toml；身份档 2。
# 类型：打一仗（fight）。三章：offer（报价）、battle（截船的帆）、after（长长的称号）；没有 stage 章。
#       offer 有三条不打的路：绕小岛（seamanship 一般，失败回头迎战）、读潮（tide_reading ≥ 60，直接进 after）、回绝（failed）。
# 报价：当面（T）。auto=false，玩家“问请托”（ask:request_raja_muda）启动；offer 不写 at，目标是在格雷西克找到他（他的日程整段在格雷西克）。
#       offer 写 deadline=1586-06-30，timeout 走 failed，不写见闻。
# 窗口：报价 1576-01-01 至 1586-06-30；battle 与 after 的 when 写 1576-01-01 至 1587-08-24（非 stage 章不写 window，窗口写进 when）。
# 进行中：battle 章 deadline_days=120，超时 failed，附一封来信（好感 -3，旗标 _late）。after 章是普通章，在格雷西克可以一直等。
# 依据·史实背景：柔佛与葡萄牙人长年交战，1570—80 年代柔佛、亚齐、葡萄牙三方互攻；葡萄牙巡船在马六甲海峡截柔佛的船。
#       柔佛王廷召回随从与文书，他本人留在吉里（“王子暂留吉里”是叙事里的口信）。巡船与船长都不对应史上某一条船或某一个人。
# 依据·原创：长串称号、海图上的马六甲、三条船与几箱文书、“论起来，马六甲本该是我家的。”（offer 的 variants 与正文只用一次，放在指马六甲的那一句）、
#       绕岛时“巡船的帆在远处晃了两回”。battle 正文只写“你打退的那条船”，不写对手的船名与船长名。
# 不写：达昂（他的心事、他的请托）；班顿相关的对歌；城门下的约定；1587 年柔佛城破。他羡慕达昂的心事永远不写，见闻也不写。
# 读的旗标：bond raja_muda（offer 的 variant，好感之外的情分，≥ C 时换成老相识的口气）。不设任何 c7_ 旗标。
# 写的旗标：c13_request_raja_muda_accepted（offer 三条接法，检定失败也设）、_declined（终局，回绝）、_slipped（绕岛或读潮成功，after 读它换一句）、
#       _fought（battle 的两个选项），_late（battle 超时，终局）、_done（after 的两个收尾，终局）。每条只设一面终局旗标。
# 报酬：现金最多 2900（after 的收尾各给一次）；好感最多 +13（接下 +2，办成 +3，收尾 +8）；名声 +2（身份档 2 的最好结局）；回忆 mem-request_raja_muda-after。无物品、无技能。
# 依赖：港口 gresik（after 的 at）；人物 raja_muda；技能 tide_reading（skills.toml）；检定属性 seamanship、arms。不涉及 B10b 改名。
#       非主线人物，不写 c13_main_ 门禁。
# 回忆插画：mem-request_raja_muda-after：格雷西克的寓所，海图的四角压着茶壶与靴子，一页折起来的文书压在马六甲上。

[[tracks]]
key = "request_raja_muda"
name = "海峡口的巡船"
kind = "request"
start = "offer"
auto = false
cast = ["raja_muda"]

# 一、暂留吉里：格雷西克的寓所，海图铺在地上。
[[tracks.chapters]]
key = "offer"
title = "暂留吉里"
text = "格雷西克的寓所里，拉惹·穆达把一张海图铺在地上，四角用茶壶和靴子压着。他的手指从吉里一路划过海峡，停在马六甲上：“论起来，马六甲本该是我家的。”柔佛王廷召他的随从回去，三条船，人和几箱文书都装好了。王廷的口信却只有一句：王子暂留吉里。海峡南口有一条葡萄牙巡船，专截柔佛的船。窗外的码头上，卸货的苦力在喊价。他把手指收回来，拍了拍图纸：“替我的船队开一条路。打也行，绕也行，人到就行。”"
speaker = "captain"
mood = "tense"
when = [
  { kind = "date", from = [1576, 1, 1], to = [1586, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "raja_muda", ge = 18 },
]
objectives = [{ kind = "person", person = "raja_muda", text = "在格雷西克的寓所找到他" }]
deadline = [1586, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_old_acquaintance"
