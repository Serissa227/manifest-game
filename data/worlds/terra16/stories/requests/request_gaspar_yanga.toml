  { kind = "affinity", person = "gaspar_yanga", value = 3 },
]

[[tracks.chapters.choices]]
key = "fight_after_all"
text = "算了，还是去打"
next = "battle"
reply = "你出门的时候，港务官在后面喊，说出了事别找他。"

# 四、回港讨工钱：皮袋，和一句关于山脊的话。
[[tracks.chapters]]
key = "after"
title = "讨回的工钱"
text = "骡栏里，高个子把一只沉甸甸的皮袋推到你面前。袋口没系紧，露出的银币有墨西哥城的戳，也有别处的，边缘磨得发亮。他说这是商队欠他们的工钱，他只是讨回来。“麦子晒过了头就发霉，工钱拖久了也一样。”他望着山脊，说有一天他们会有自己的镇子、自己的教堂，名字写在王的册子上。说这话的时候他没看你，看的是远处那道灰线，眼神像在量一段还没走完的路。"
speaker = "gaspar_yanga"
mood = "mystic"
at = "veracruz"
cast = ["gaspar_yanga"]
when = [{ kind = "alive", person = "gaspar_yanga", value = true }]
deadline_days = 120

[tracks.chapters.timeout]
next = "done"
effects = [
  { kind = "flag", flag = "c13_request_gaspar_yanga_partial" },
