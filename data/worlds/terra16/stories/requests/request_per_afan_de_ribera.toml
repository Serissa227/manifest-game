# 五、回信：两个月后，副王的亲笔信。
[[tracks.chapters]]
key = "settle"
title = "副王的回信"
text = "两个月后，那不勒斯来了一封副王的亲笔信，没有抬头，只有正文。信里他问：“以后还走不走那不勒斯？”"
mood = "tender"
when = [{ kind = "alive", person = "per_afan_de_ribera", value = true }]
objectives = [{ kind = "wait", days = 60 }]

[[tracks.chapters.variants]]
key = "v1_listed"
when = [{ kind = "flag", flag = "c13_request_per_afan_de_ribera_listed" }]
text = "两个月后，那不勒斯来了一封副王的亲笔信。信上说，那袋铜币是古物书记顺手塞进箱子的，正好补进他的钱币柜：“那几枚我让人一个个看过，成色都不差。古物书记做事细。”末了他问你以后还走不走那不勒斯。"

[[tracks.chapters.variants]]
key = "v2_asked"
when = [{ kind = "flag", flag = "c13_request_per_afan_de_ribera_asked" }]
text = "两个月后，那不勒斯来了一封副王的亲笔信。管家问的那件事，他答得很快，一页纸答了三条，口气里有一点高兴：“管家问得仔细，我喜欢这样的人。那袋铜币是我让人放的，押船的人本该有一枚。”末了他问你以后还走不走那不勒斯。"

[[tracks.chapters.variants]]
key = "v3_quiet"
when = [{ kind = "flag", flag = "c13_request_per_afan_de_ribera_quiet" }]
text = "两个月后，那不勒斯来了一封副王的亲笔信。信的开头他问的只有一件事：“三尊像立在院子哪一边？”信上没有别的话。末了他才问你以后还走不走那不勒斯。"

[[tracks.chapters.choices]]
