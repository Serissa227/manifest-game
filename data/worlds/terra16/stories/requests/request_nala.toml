news = "阿尔及尔旧城一户格拉纳达人家，廊下那把老乌德琴卖了。买主是得土安来的一个女乐师，钱是两袋凑起来的。"
next = "result"
reply = "商人掂了掂钱袋，叹了口气。钱他收下了，琴却得让他再摸一回。他的手顺着琴颈摸下去，摸到裂纹，停住，说：“琴是你们的了。”"
