# 二、商人的院子：阿尔及尔，商人不卖，只说要有人能让琴再响一回老家的声音。
[[tracks.chapters]]
key = "persuade"
title = "商人的院子"
text = "阿尔及尔，商人的宅子在旧城一条窄巷尽头。院子里一棵橘子树，那把老琴挂在廊下，琴面的漆裂了几道。商人请你坐，话说得客气：“琴我不卖。”他小时候在阿尔拜辛听过这把琴的声音，买下它，就是买下一点老家。娜拉站在你身后，攥着钱袋，一句话也不说。商人看了她很久，才说：“除非有人能让这把琴再响一回老家的声音。”"
speaker = "captain"
mood = "tender"
at = "algiers"
objectives = [{ kind = "at", at = "algiers", text = "到阿尔及尔商人的宅子里" }]
when = [{ kind = "alive", person = "nala", value = true }, { kind = "date", from = [1572, 1, 1], to = [1577, 2, 23] }]
deadline_days = 90
news = "阿尔及尔一户格拉纳达人家的院子里，一把老乌德琴响了一晚上阿尔拜辛的调子。"

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "affinity", person = "nala", value = -3 }, { kind = "flag", flag = "c13_request_nala_late" }, { kind = "letter", person = "nala", text = "我自己去了一趟阿尔及尔。他还是不卖，让我弹了一晚。——娜拉" }]
news = "阿尔及尔一户格拉纳达人家的院子里，有个得土安来的女人抱着一把借来的琴，弹了一晚上老调，商人还是不卖。"

[[tracks.chapters.choices]]
