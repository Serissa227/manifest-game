# 请托：母亲卖掉的琴（request_nala）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：娜拉（nala，1540-06-07 生，女），安达卢斯区乐师的女儿，弹乌德琴；势力 morocco，身份档 1。cast：cast/classmates_fez.toml。
# 类型：说服某人（persuade）。任务单三章（offer、persuade、result），文件里四章：result_partial 是 result 的“只弹一晚”版本。
#   引擎的变体只改文字、不改玩法，而这一支的现金、技能、终局旗标都不同，所以拆成两章；persuade 的检定失败直接 next 到 result_partial。
# 报价：V（到访）。娜拉随婚宴乐班下到得土安（tetouan）港口，auto=true；offer 写 family=c13_offer_tetouan，冷却 20 天；
#   玩家满 17 岁、娜拉满 18 岁、名声 ≥ 30（V 的名声门槛，1572 年已封顶）；窗口 1572-01-01 至 1575-12-31，offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻（没人知道这件事没成）。
# 日期：普通章不写 window（引擎只在 stage 章用窗口），起止日写进 when。persuade 与 result 的 when 为 1572-01-01 至 1577-02-23；
#   persuade 进入后限期 90 天（同一海区），超时 next=failed，娜拉来信一封，好感 -3，旗标 _late，超时另写一条见闻。
# 依据·史实背景：格拉纳达流亡者在北非的乐师传统（安达卢斯的努巴）；阿尔及尔有许多格拉纳达来的人家；阿尔拜辛是格拉纳达的老城区名。
#   待核：阿尔及尔这一户人家与那把琴的来历是原创；格拉纳达流亡者在阿尔及尔的具体街区不写地名以外的细节。
# 依据·原创：娜拉与母亲卖琴的旧事、琴肚里母亲偷偷刻下的一行小字、阿尔及尔的商人（不取名，他是格拉纳达流亡者的后代，阿尔拜辛区出来的）、廊下的橘子树。
# 秘密：母亲卖琴与娜拉攒赏钱的办法。正文只写“母亲卖掉的琴”与“剩下的赏钱”，攒了多少年、怎么攒的不写；见闻不写赏钱。
# 读的旗标：无。offer 的变体读 bond nala ≥ C（条件不是旗标）。不设任何 c7_ 旗标。
#   不写埃丝特、阿伊莎、伊德里斯、塔里克（C7）；不写曲本、学堂、批注本。
# 待决（编辑核对时发现，待裁定）：C7 的 bond_nala 1562 重逢（default 来信写“琴赎回来了”）与 c7_bond_nala_own（梅拉区橱窗里的那把琴）说琴在 1560 年前后已经赎回；本轨道的前提是琴 1572 年仍在阿尔及尔商人手里、娜拉还在攒钱赎琴。两者相冲突。本文件按任务单的前提写，没有改 C7。
#   offer 变体里曲谱末了一句写着“这一遍你唱”（只是写下的字，不是说出口）；口头禅只在 persuade 章 play_with 选项的回复里由娜拉说出口一次（任务单写她在 persuade 章一句话也不说）。
# 设的旗标：c13_request_nala_accepted（offer 接下，两种接法）、_declined（offer 回绝）；
#   分支旗标 _played（persuade 合琴或拨弦）、_one_night（argue 检定失败，只借一晚）；终局旗标 _late（超时）、_done（result）、_partial（result_partial），每条路只设一面。
# 不用 relation / tie / bond / heart 效果；bond 只作条件读取。
# 报酬：现金最多 900（只弹一晚 500）；好感最多 +13；名声 +1；技能 oud_playing +20（只一次）；回忆 mem-request_nala-result。
#   pay_more 的 600 是玩家自己出的钱，先用 requires 查过。
# 依赖：港口 tetouan、algiers（ports_north_africa.toml）；技能 oud_playing（skills.toml）；人物 nala。无 B10b 改名；无主线门禁（不写 c13_main_ 门禁）。
# 与 C7 的交叉：tie_esther_nala、tie_new_nala_aisha、tie_new_idriss_qalam_nala与本轨道无关，本轨道不写他们；bond_nala 的冲突见上面的待决。
# 回忆插画清单：
#   mem-request_nala-result「码头上的老琴」：得土安的码头石阶，娜拉把老琴转过来，指着琴肚里一行歪斜的小字。

[[tracks]]
key = "request_nala"
name = "母亲卖掉的琴"
kind = "request"
start = "offer"
auto = true
cast = ["nala"]

# 一、琴肚里的名字：得土安的婚宴散了场，娜拉过来跟你说话，要你替她去阿尔及尔谈那把琴。
[[tracks.chapters]]
key = "offer"
title = "琴肚里的名字"
text = "得土安的婚宴，乐班在院子里奏到第三遍。娜拉抱着一把借来的乌德琴，弹完最后一首，才穿过人群走到你跟前。她从袖子里摸出一小卷钱，放在桌上，又收回去。“我打听到了。我娘当年卖掉的那把老琴，在阿尔及尔一个商人手里。琴肚里刻着做琴人的名字，格拉纳达的。”她看着你，嘴角压得很平。“他不卖。我不会求人。你去。他要钱，给钱；他要理，讲理；他要听琴，我跟你去，弹给他听。”"
speaker = "captain"
mood = "tense"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "在得土安的港里" }]
when = [{ kind = "date", from = [1572, 1, 1], to = [1575, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "nala", ge = 18 }, { kind = "fame", ge = 30 }]
deadline = [1575, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_tetouan"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "nala", level = "C" }]
text = "得土安的婚宴，乐班在院子里奏到第三遍。娜拉抱着一把借来的乌德琴，弹完最后一首，才穿过人群走过来。她从琴袋里抽出一张曲谱，塞到你手里，末了一句用炭笔写着：“这一遍你唱。”她说：“我打听到了。我娘当年卖掉的那把老琴，在阿尔及尔一个商人手里。琴肚里刻着做琴人的名字，格拉纳达的。”她看着你，嘴角压得很平。“他不卖。我不会求人。你去。他要钱，给钱；他要理，讲理；他要听琴，我跟你去，弹给他听。”"

[[tracks.chapters.choices]]
key = "go_algiers"
text = "接下，带她去阿尔及尔见那个商人。"
next = "persuade"
