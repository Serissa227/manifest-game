# 三、自己的琴：得土安的码头上，琴赎回来了，娜拉把琴肚里那行小字指给你看。
[[tracks.chapters]]
key = "result"
title = "自己的琴"
text = "回到得土安，娜拉抱着那把老琴坐在码头的石阶上，琴面的裂纹她用指头一道一道摸过去。她调了弦，弹了一段，没弹完就停下来。“琴肚里还有一行字。”她把琴转过来，让你看。做琴人的名字底下，刻着一行更小的字，歪歪斜斜，只有一个女人的名字，没有姓。码头上有人挑着鱼筐走过去，扁担吱呀一响，她没有回头。“我娘卖琴前，偷偷刻上去的。”她说完，把琴抱紧了些。"
speaker = "captain"
mood = "cheerful"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "回到得土安" }]
when = [{ kind = "alive", person = "nala", value = true }, { kind = "date", from = [1572, 1, 1], to = [1577, 2, 23] }]
news = "得土安的码头上，安达卢斯乐师的女儿抱着一把赎回来的老琴弹了一下午。"

