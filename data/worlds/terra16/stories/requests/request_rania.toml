# 结算（只卖了一半）：检定失败后进入。货款照付，工钱只给一半，终局旗标为 partial。
[[tracks.chapters]]
key = "settle_half"
title = "只卖了一半"
text = "摩卡的码头上，拉妮娅听你讲吉达的事，只听到一半就停了笔。老学者只买了一半，其余的书被吉达的书贩压价拖走了。她没有笑。她把书单对着码头的光举起来，单子上的墨洇了一小块。账单铺在桌上，她一笔一笔往下看，看到工钱那一行，把笔搁在纸上。“货款照付，”她说，“工钱只给一半。你别这个表情，又不是你的错。”"
