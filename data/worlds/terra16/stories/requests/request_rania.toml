effects = [{ kind = "affinity", person = "rania", value = 3 }]

[[tracks.chapters.choices]]
key = "pull_it"
text = "把缺页的那本抽出来，其余的照常卖。"
next = "settle"
reply = "账房把那本缺页的书压到箱底。老学者翻完其余的书，一箱一箱都要了，只是没再多问。"
effects = [{ kind = "affinity", person = "rania", value = 2 }]

# 结算（全部卖出）：摩卡的码头上，她听你讲吉达的事，最后把账算给你。你念半句诗，她接不住，抢着接。
[[tracks.chapters]]
key = "settle"
title = "下半句"
text = "摩卡的码头上，拉妮娅听你讲吉达的事。讲到老学者一本本翻书，她笑得前仰后合，手里的算盘珠子拨乱了一片；讲到那本缺页的经注，她又板起脸。“箱子是谁封的？”她问，没等回答就自己算起账来：货款，工钱，吉达的脚力，一笔一笔写在单子背面。算完，她把数目推过来。你顺口念了半句在吉达书摊上听来的诗：“书箱压着潮水走，”她一把抓住你的手：“别停！下半句我来接。”"
at = "mocha"
cast = ["rania"]
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "at", at = "mocha", text = "回摩卡，找她算账" }]
when = [
  { kind = "alive", person = "rania", value = true },
  { kind = "date", from = [1563, 1, 1], to = [1575, 8, 24] },
]
news = "摩卡的码头上，哈德拉毛商人的女儿抢着接一句吉达书摊上的诗，接没接上，码头上的人争了半天。"

[[tracks.chapters.choices]]
