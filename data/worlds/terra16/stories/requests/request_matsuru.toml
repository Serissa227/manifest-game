next = "done"
news = "那霸的码头上，祝女真鹤把一条皱了的手巾重新折好，才去告诉几户人家，扣在萨摩的人都还平安。"
effects = [{ kind = "cash", value = 750 }, { kind = "affinity", person = "matsuru", value = 2 }, { kind = "flag", flag = "c13_request_matsuru_partial" }]
