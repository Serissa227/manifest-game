effects = [{ kind = "cash", value = 750 }, { kind = "affinity", person = "matsuru", value = 4 }, { kind = "flag", flag = "c13_request_matsuru_partial" }]
reply = "她听完点点头：“乱着到，也是到了。”她上了石阶，跟那几户人家说，手巾都到了，只是不一定到了自家人手里。几个人挤在一间长屋里，谁拿着都一样。人堆里一个老妇人听了，反倒笑出声来。"

[[tracks.chapters.choices]]
