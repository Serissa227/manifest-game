next = "report_rough"
reply = "你把手臂伸直，拇指和食指张开，一指一指往星的上头数，数了两遍。估出来的数也差半指，可你说不上这个数是量出来的，还是你想让它是这个数。你把它写在墨点旁边，写得很轻。"
