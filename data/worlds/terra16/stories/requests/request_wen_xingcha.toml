effects = [
  { kind = "affinity", person = "wen_xingcha", value = 3 },
  { kind = "flag", flag = "c13_request_wen_xingcha_measured" },
  { kind = "flag", flag = "c13_request_wen_xingcha_north" },
]

[[tracks.chapters.choices]]
key = "eyeball"
text = "不拿板子，凭眼力估一个数。"
