# 报价：墨西拿的舰队营地。威尼斯报上来的科孚船数对不上，唐·胡安要一个不属于任何一方的船长去数。
[[tracks.chapters]]
key = "offer"
title = "长凳上的名单"
text = "墨西拿港里桅杆密得像芦苇。奥地利的唐·胡安在码头边的帐篷里摊开一张名单，手指压在威尼斯人报上来的数字上。“科孚那边还有几条他们的船，报的是满员。”他抬起眼。二十四岁，帐篷里的陈设摆得讲究，目光却冷。“满员的船，我不信。”他要一个不属于任何一方的船长，去科孚数一数：长凳上到底坐了几个人，甲板上架着几支火绳枪。“九月中旬以前回来。路上别替任何人说话，只把看见的报给我。”"
mood = "tense"
objectives = [{ kind = "person", person = "don_juan_austria", text = "在墨西拿的舰队营地找到他" }]
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1571, 8, 24], to = [1571, 9, 8] }, { kind = "alive", person = "don_juan_austria", value = true }]
deadline = [1571, 9, 8]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "接下：去科孚，数完就回"
next = "count"
effects = [{ kind = "affinity", person = "don_juan_austria", value = 2 }, { kind = "flag", flag = "c13_request_don_juan_austria_accepted" }]
reply = "他把名单撕下半张递给你，指尖在纸边按了一下。“那边的人会说他们都在吃饭。你别信，也别急着回来说他们没吃。”"

[[tracks.chapters.choices]]
key = "decline"
text = "回绝：不替哪一方数别人的人"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_don_juan_austria_declined" }]
reply = "他笑了一下，没有挽留，把名单折起来压在铜镇纸下面。“也好。墨西拿不缺会算数的人，缺的是肯跑路的人。”"

[[tracks.chapters.variants]]
