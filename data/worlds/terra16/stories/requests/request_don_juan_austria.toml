text = "墨西拿港里桅杆密得像芦苇。奥地利的唐·胡安在码头边的帐篷里摊开一张名单，手指压在威尼斯人报上来的数字上。“科孚那边还有几条他们的船，报的是满员。”他抬起眼。二十四岁，帐篷里的陈设摆得讲究，目光却冷。“满员的船，我不信。”他要一个不属于任何一方的船长，去科孚数一数：长凳上到底坐了几个人，甲板上架着几支火绳枪。“九月中旬以前回来。路上别替任何人说话，只把看见的报给我。”他说完，目光在你衣襟上的星徽停了一瞬，什么也没问。"

