# C13d 请托：科孚的空桨位（故事 2.0，A5 / E37 契约；按 2026-10-12 的 C13d 总决定与任务单分片写，中文单语）
# 人物：奥地利的唐·胡安 don_juan_austria（1547-01-01 生，1578 年卒；cast/historical_01_europe.toml，faction spain）。1571 年夏二十四岁，神圣同盟舰队统帅，8 月 23 日到墨西拿接掌集结的联军。
# 类型与报价：去某处（gs），六章（offer / count / return / return_short / report / report_partial），kind=request，auto=false（T 当面，墨西拿）：玩家用 ask:request_don_juan_austria 启动；offer 章不写 at，objectives 为在墨西拿的舰队营地找到他。求见门槛由 cast 的 audience 承担，本文件不另写。
# 窗口（规划用，TOML 不写，普通章不写 window）：报价 1571-08-24 至 09-08（deadline 即 09-08）；数船 08-26 至 09-12（deadline_days 40）；回程等 3 天；回报 08-30 至 09-15（deadline 09-15）。
# 依据（史实）：1571-08-23 唐·胡安到墨西拿；威尼斯的加莱船人手不足，报上来的科孚船数是满员；09-16 舰队出航。本请托只写出航前的这一趟：不写海战，不上旗舰，不写分兵后的风波与勒班陀的结果。
# 依据（原创）：墨西拿帐篷里的名单与匕首，科孚城堡下的加莱船、书记官的名册与酒，北风里的海峡，两份名单并排压着的油灯；书记官的名字不点。
# 待核：科孚船上的桨位数与军饷拖欠的确切数字，正文只用传闻口吻、不写数字；请托人口头禅只用一次（report）。
# 读写的旗标：设 c13_request_don_juan_austria_accepted / declined（报价）、counted（数完了三条船的路线：走上船数、用威尼斯话、拿海图换，只作记录）、slow（回程的分支：换报回的开场）、done（照数报或建议分兵成功）、partial（遮一点或分兵失败）、late（超时）。每条路径只设一面终局旗标（done / partial / declined / late）。
#   读 c13_main_noel（offer 的一条 variant，只加一句，不提名册、不提旗舰）；report 与 report_partial 的 slow 变体读 slow。不读也不设任何 c7_ 旗标。
# 依赖：港口 messina、corfu 与技能 lang_italian、物品 chart_mediterranean 均为现有；无 B10b 改名；无主线门禁。
# 结构说明：检定的 fail 分支没有回复字段，所以失败的结果由后续章节承接。数船只数到一条船的（走上船数失败）走 return_short，再到 report_partial；数完的（走上船数成功、用威尼斯话、拿海图）走 return，再到 report。照数报只在 report 上给，不用 requires 去读本轨道在别的分支上设的旗标，按路线分章。split 的失败只体现在较少的银钱与 partial 旗标上。
# 回忆插画清单：
#   mem-request_don_juan_austria-report「墨西拿的帐篷」：帐篷里一盏油灯，两份名单并排压着一把匕首，门外桅杆如林。

