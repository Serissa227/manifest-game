# 一、报价：下田的政所分署，书役递上百年前裁决书的抄本与三份退回的诉状。
[[tracks.chapters]]
key = "offer"
title = "退回三次的诉状"
text = "下田的政所分署只有一间临河的屋子，门口晾着几张刚刷过浆的纸。年轻的书役把我让进去，先捧出一册抄本：百年前一条家的裁决书，写明下田渔户与清水渔户的海界，以海上一块刻了字的礁石为准。今年清水的人不认这块礁了。抄本边上有一行朱笔批语，字小而硬：“纸上写的是哪块礁，就是哪块礁。”书役又从匣底抽出三份诉状，每份封皮上都是同一个朱印、同四个字：格式不合。“源大夫在中村，只看纸。”他压低了声音，“下田的人去清水，话没说完就要动手。得有个外人去，跟那边的网元讲讲道理。”"
at = "shimoda_tosa"
mood = "cheerful"
when = [{ kind = "date", from = [1557, 3, 1] }, { kind = "age", ge = 17 }]
deadline = [1568, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_shimoda_tosa"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "mio"
when = [{ kind = "flag", flag = "c13_main_mio" }]
text = "下田的政所分署只有一间临河的屋子，门口晾着几张刚刷过浆的纸。年轻的书役抬头看见我，笔掉在案上：“姬、姬君——”他手忙脚乱地行了礼，好半天才想起正事，捧出一册抄本：百年前一条家的裁决书，写明下田渔户与清水渔户的海界，以海上一块刻了字的礁石为准。今年清水的人不认了。抄本边上有一行朱笔批语，字小而硬：“纸上写的是哪块礁，就是哪块礁。”匣底还压着三份诉状，封皮上同一个朱印、同四个字：格式不合。“源大夫只看纸。”他说话还有点结巴，“下田的人去清水，话没说完就要动手。姬君若、若肯去一趟，那边的网元总得听两句。”"

