# 请托：百年前的海界（request_minamoto_yasumasa）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude 执笔，仅中文。
# 人物：源康政 minamoto_yasumasa（生年不详，占位 0-1-1；男；中村“政所”的诸大夫，用奉书办理土佐一条家的政务；cast/historical_07_japan.toml）。
# 类型：说服某人（persuade）。brief 的三章：offer 退回三次的诉状（下田）→ persuade 清水的网元（土佐清水）→ result 格式合了（下田）。
#   result 按 persuade 的结果分成四个同名起头的章节，由 next 直接路由（不在同一轨道里用 requires 读本轨道另一条路设的旗标）：
#     result（讲赢：旧界照打到明年）、result_stone（看界石）、result_newstone（出钱立新石）、result_refused（讲输）。
#   每章各两个选项：照实写清 / 只报个大概（refused 那章是照实写 / 不答了），回复与效果各不相同。
# 报价：L（遗事式的代理人报价）。1557 年以后源康政没有日程，本人不出场，只有抄本上的批语与中村送来的回文；出面的是下田政所分署的年轻书役（不起名，不进 cast）。
#   auto=true；offer 写 at=shimoda_tosa、family=c13_offer_shimoda_tosa、冷却 20 天；when：1557-03-01 起、玩家满 17 岁；deadline=1568-06-30，timeout 直接 failed，不写见闻。
#   不写 alive 条件（人物 1557 年后无日程，按 brief）。
# 进行中：persuade 期限 120 天，超时 failed、设 _late，来一封源康政的短信（≤120 字）；四个 result 章各 120 天，超时 failed、设 _late，见闻交代下田的政所分署后来怎样。
# 依据：
#   史实背景：土佐一条家的政所以奉书裁决诉讼、发安堵状；中世渔村之间为海界打官司极常见（docs/research/terra16/P_eastasia_1540.md 与研究笔记）；
#             下田是四万十川口、中村一条家的外港；清水在足摺岬下，加久见一族的船队名义上奉一条家为主。
#   原创：百年前那份裁决书与刻字的礁石（界石）、礁背阴面的箭头、前年的大风、浅滩上的新石、三份退回的诉状、回文里的三问（日期、在场的人、谁按的印）。
#   正文只写人物与物件，不写出处。
# 报酬：身份档 2 的低风险档，现金至多 1600（只在 result / result_stone 的照实写）；newstone 的照实写付 1100（立石垫付的 200 之外再付 900），只报大概付 800；讲输的那条路 0。
#   好感：接下 +2；persuade 讲赢或看界石 +3；最好的结局 +8（合计 +13），newstone 照实写 +4；只报大概 −2；讲输照实写 −2，不答 −3。
#   声望 ichijo +2、名声 +3（只在最好的结局）；无唯一奖励物品；回忆一张（只在看界石那条路）。
# 招牌话：“纸上写的是哪块礁，就是哪块礁。”批在抄本边上，只在 offer 正文里出现（澪的变体与原文二选一显示，玩家只读到一次）。“格式不合”是他退回诉状的批语，不算招牌话。
# 读的旗标：c13_main_mio（offer 变体，玩家是澪时书役认出一条家的姬君；由澪的主线设，尚未写）。不读、不设任何 c7_ 旗标。
# 设的旗标：c13_request_minamoto_yasumasa_accepted（offer 接下）；分支三面：_agreed（讲赢）、_stone（看界石）、_newstone（立新石）；
#   终局一面：_declined（offer 回绝）/ _done / _partial / _failed / _late。
#   brief 里讲输的那面 _refused 没有设：讲输直接路由到 result_refused，终局记 _failed，分支旗标保持三面以内。
# 秘密：乡里关于他身世的传闻，正文与见闻一律不写。
# 网元：不起名；只有独眼、屋檐下晒鲣鱼这两样特征。
# 依赖：港口 shimoda_tosa、shimizu_tosa（ports_east_asia.toml）；技能 tide_reading（skills.toml）；势力 ichijo（factions/10_japan.toml）；属性 eloquence。无 B10b 改名依赖。
