text = "格蕾塔把卑尔根的抄本摊在膝上，一行一行看，看到扣数那一栏，从怀里摸出一个旧本子，翻开对了几行，又合上。“把小数目也算上。”她说。人名一栏一个不缺。抄本上，每个搬运工每个月都被扣了几个芬尼，名目写的是“炉火”，可商站的账房不许生火。她把《线上算法》翻到第一题，用指尖压平书页：“这一题，就用这几个芬尼出。”"
