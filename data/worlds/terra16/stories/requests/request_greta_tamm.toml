# 请托：给学生做的题（request_greta_tamm）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：格蕾塔·塔姆（greta_tamm，1540-12-07 生，女）；账房先生的女儿，学院同学（吕贝克）；势力 hanse，身份档 1。cast：cast/classmates_custom_lubeck_accounts.toml。
# 类型：找东西（find）。四章：offer（报价）、bergen（商站的账房）、handin（交书，账目抄到手）、handin_partial（只拿到一页、没有人名的数，另一条收尾）。
#   handin_partial 是 brief 里 handin 的 page 变体。变体只能覆写文字，不能改选项的现金与终局旗标，所以拆成独立章节，由 bergen 的分支 next 直接路由过去。
# 报价：T（当面）。人物按日程在吕贝克港，auto=false，玩家“问请托”（ask:request_greta_tamm）启动；offer 章不写 at，目标是在港里找到她。窗口 1568-01-01 至 1590-06-30；offer 写 deadline=窗口止日，timeout 直接 failed，不写见闻。
# 进行中：bergen 章 deadline_days=150，超时走 failed，来信一封，好感 -3，旗标 _late；handin 与 handin_partial 是普通章，书没交到之前可以一直等。
# 依据·史实背景：亚当·里斯《线上算法》（Rechnung auff der linihen，1518 年爱尔福特），德意志地区最通行的算术课本，北方与低地国家的书铺有卖（items/books_05_commerce.toml）；汉萨商站（卑尔根的布吕根）的账房、德意志书记与挪威搬运工，只作背景。
# 依据·原创：格蕾塔的小学堂、码头上用作废货单教数桶、卑尔根账房里的“炉火钱”（商站书记的一笔小账，不写成大贪污，书记不出场受罚）、搬运工自己报数的那一条路。
# 秘密：她背着人替码头工人的家里另记一本工钱副账。handin 与 handin_partial 只写她从怀里摸出一个旧本子、对几行、又合上，不说它是什么；见闻不写；不揭开。
# C7：不写欣里克，不与欣里克的运粮请托共用一件事；不设任何 c7_ 旗标；offer 的 variant 只读 bond greta_tamm 至少 C；不用 relation / tie / bond / heart 效果。
# 设的旗标：c13_request_greta_tamm_accepted（offer 两条接法）、_declined（offer 回绝）、_copy（bergen 书记让抄全本）、_page（bergen 只拿到一页或没有人名的数）、_late（bergen 超时）、_done（handin 收尾）、_partial（handin_partial 收尾）。
# 报酬：现金 900（partial 500）、好感最多 +13、名声 +1、技能 double_entry +20（只一次）、回忆 mem-request_greta_tamm-handin（handin 与 handin_partial 共用这一件）。ries_lines 是玩家自己买来交出或借出，不是奖励；give_book 写 item ries_lines -1，lend_book 不扣。
# 依赖：港口 lubeck、bergen（ports_north.toml）；技能 double_entry（skills.toml）；属性 eloquence；物品 ries_lines（有 shop，北方与低地国家书铺）。无需 B10b 改名。
# 待核：无。
# 回忆插画清单：
#   mem-request_greta_tamm-handin「货箱上的算术书」：吕贝克码头的货箱当讲台，摊开的算术书第一页写着小学堂的名字，三个孩子踮脚围在箱边数桶。

[[tracks]]
key = "request_greta_tamm"
name = "给学生做的题"
kind = "request"
start = "offer"
auto = false
cast = ["greta_tamm"]

# 一、一间小学堂：码头的货堆边，她拿作废的货单教孩子数桶。
[[tracks.chapters]]
key = "offer"
title = "一间小学堂"
text = "格蕾塔蹲在吕贝克码头的货堆边，拿作废的货单教三个搬运工的孩子数桶。最小的那个用手指头戳着桶箍，数到三就不肯往下了。“要开一间学堂，教人算账。”她头也不抬，“缺两样：一部好懂的算术书，里斯的《线上算法》；还有一本真账。拿货单能教会数数，教不了扣钱。真的工钱簿，扣在哪儿都写着。一个芬尼对不上，谁也别想走。”她把货单往膝上一拍，“你先去卑尔根的商站，把今年的工钱簿抄一份。回来顺路带书。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "greta_tamm", text = "在吕贝克码头边找到她" }]
when = [{ kind = "date", from = [1568, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "greta_tamm", ge = 18 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_old_schoolmate"
when = [{ kind = "bond", person = "greta_tamm", level = "C" }]
text = "格蕾塔蹲在吕贝克码头的货堆边，拿作废的货单教三个搬运工的孩子数桶。看见你走近，她抽出一张货单递过来：“你小时候在这张上算错过一笔，还记得吗？”最小的那个用手指头戳着桶箍，数到三就不肯往下了。“要开一间学堂，教人算账，缺两样：一部好懂的算术书，里斯的《线上算法》；还有一本真账。”她把货单往膝上一拍，“你先去卑尔根的商站，把今年的工钱簿抄一份。回来顺路带书。”"

[[tracks.chapters.choices]]
