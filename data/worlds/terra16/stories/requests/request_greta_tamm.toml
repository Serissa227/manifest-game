# 二、商站的账房：卑尔根，书记不肯让外人看工钱簿。
[[tracks.chapters]]
key = "bergen"
title = "商站的账房"
text = "汉萨商站的账房在二楼，窗户小，炉子冷着，商站的规矩怕火。管账的德意志书记说，工钱簿是商站的事，外人不看。楼下的挪威搬运工扛着鳕鱼干进进出出，没有一个抬头往这间屋里看。“吕贝克要拿它教孩子。”我说。他嘴上不松口，手却按在那本簿子上，指节压得发白，像是怕人看见里面的什么。"
speaker = "captain"
mood = "tense"
at = "bergen"
when = [{ kind = "alive", person = "greta_tamm", value = true }]
deadline_days = 150
timeout = { next = "failed", effects = [{ kind = "affinity", person = "greta_tamm", value = -3 }, { kind = "flag", flag = "c13_request_greta_tamm_late" }, { kind = "letter", person = "greta_tamm", text = "卑尔根的账我托回程的船问了，人家不给。孩子们先做货单上的题。——格蕾塔" }] }
news = "卑尔根汉萨商站的账房里，有人把一年的工钱簿抄了一份，说是拿回吕贝克教孩子。"

[[tracks.chapters.choices]]
key = "book_talk"
text = "跟书记聊复式簿记，说吕贝克要拿它教孩子，不外传。"
next = "handin"
requires = [{ kind = "skill", skill = "double_entry", ge = 60 }]
hint = "书记问你借贷怎么对，你说不清"
reply = "他跟我对了半天借贷，越说越来劲，最后把簿子推过来：“抄吧。抄完了，让孩子们找找我哪里记错了。”"
effects = [{ kind = "affinity", person = "greta_tamm", value = 3 }, { kind = "flag", flag = "c13_request_greta_tamm_copy" }]

[[tracks.chapters.choices]]
key = "persuade_clerk"
text = "跟他说：一本没人查的账，迟早出错；有人拿去当题做，等于替他查。"
next = "handin"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "他想了一会儿，把簿子翻到今年那几页，说：“人名不许抄错。”"
effects = [{ kind = "affinity", person = "greta_tamm", value = 3 }, { kind = "flag", flag = "c13_request_greta_tamm_copy" }]
fail = { next = "handin_partial", effects = [{ kind = "affinity", person = "greta_tamm", value = -2 }, { kind = "flag", flag = "c13_request_greta_tamm_page" }] }

[[tracks.chapters.choices]]
key = "ask_porters"
text = "不找书记，下楼请搬运工们自己报工数和实拿的钱。"
next = "handin_partial"
reply = "搬运工们七嘴八舌报了，我记下来，跟他们说吕贝克有人拿这个教孩子算账。他们笑，说那得教孩子算算商站扣了多少。"
