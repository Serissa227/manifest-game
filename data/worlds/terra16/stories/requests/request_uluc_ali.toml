[[tracks.chapters]]
key = "landing_named"
title = "那不勒斯的名单"
text = "那不勒斯港的总督府书记，已经听说阿尔及尔的酒馆里在讲一个统帅。他把三个渔夫叫到桌前，问得比别人细：在那边有没有人替他们说过话，是谁的船把他们带出来的。三个人挤在一起，不敢抬头。书记把名册翻到一页，指甲在纸上一顿。“船的事，问话到港务处去。”他说，“名字的事，港务处管不着。”"
speaker = "captain"
mood = "tense"
at = "naples"
when = [{ kind = "alive", person = "uluc_ali", value = true }]
deadline_days = 90
news = "那不勒斯港的总督府，书记把三个从阿尔及尔赎回的卡拉布里亚渔夫叫去问话，问到半夜才放人。"
timeout = { next = "failed", effects = [{ kind = "affinity", person = "uluc_ali", value = -3 }, { kind = "flag", flag = "c13_request_uluc_ali_late" }, { kind = "letter", person = "uluc_ali", text = "乌卢赤·阿里（书记代笔）：人在那不勒斯耽搁太久，三个人等不到你，雇了条渔船自己走的。名字的事，别再提了。" }] }

[[tracks.chapters.choices]]
key = "talk"
text = "跟书记讲清楚：船的事问港务处，名字的事不必问。"
next = "report_partial"
reply = "书记把名册合上，没再看那三个名字：“港务处的事，港务处去办。”三个人上了船，船老大把帆一扯，连桨都没下。"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "uluc_ali", value = 3 }]
fail = { next = "report_partial", effects = [{ kind = "affinity", person = "uluc_ali", value = -2 }, { kind = "flag", flag = "c13_request_uluc_ali_questioned" }], news = "那不勒斯港的书记听说了阿尔及尔的传言，把三个渔夫扣下问了七天话，才放他们回卡拉布里亚。" }

