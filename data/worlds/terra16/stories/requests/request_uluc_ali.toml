# 请托：勒卡斯泰拉的三个渔夫（request_uluc_ali）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：乌卢赤·阿里（uluc_ali，1519 年生，男；1587 年卒），奥斯曼海军统帅，1572 年起在金角湾兵工厂督造战船。出身卡拉布里亚勒卡斯泰拉的渔家，少年被掳、改宗，这两件事是公开的。cast：cast/historical_02_islamic.toml（其 faction 写的是 algiers；本条的声望只记奥斯曼）。
# 类型：混合（mixed）。任务单的五章是 offer（船台）、ransom（巴尼奥的赎价）、passage（海上的无花果树）、landing（那不勒斯的盘问）、report（金角湾回话）。
#   文件里是八章：passage、landing、report 为不点名的一路；ransom 的“压低声音”选项 next 到 passage_named，之后走 landing_named、report_partial 这一条平行的链。
#   原因：变体只能改文字，不能改选项的去处；选项的 requires 不能挡在本轨道另一条路才设的旗标上（点名旗标只在 ransom 的那个选项里设），所以两条路必须在 ransom 之后分开走。
# 报价：T（当面）。auto=false，玩家“问请托”（ask:request_uluc_ali）启动；offer 不写 at，目标为“在港里找到他”。玩家满 17 岁。
#   offer 的 deadline 为窗口止日 1585-10-31，timeout 直接 failed，不写见闻（没人知道这件事没成）。预计窗口 1572-03-01 至 1585-10-31（只是注释，引擎里非 stage 章不写 window）。
# 进行中：ransom 期限 120 天（阿尔及尔到金角湾，跨一片海）；landing 与 landing_named 期限 90 天；report 与 report_partial 期限 150 天。超时都走 failed，人的来信一封，好感 -3，旗标 _late。
#   passage 与 passage_named 只用 wait 5 天，不设期限。
# 依据·史实：乌卢赤·阿里生于卡拉布里亚的勒卡斯泰拉（原名乔万尼·迪奥尼吉·加莱尼），少年被北非的船掳去，在桨帆船上划桨，后来改宗，勒班陀之后任海军统帅，1572 年起在伊斯坦布尔金角湾兵工厂一冬之间重建舰队（传闻口吻）。阿尔及尔的赎俘有帕夏的抽成、港税与通事费。
#   不写勒班陀，不写三一会与塞万提斯，不写新舰队的图纸（C7 哈桑×阿尔维塞的舰队线不碰）。
# 依据·原创：三个渔夫（一个老的、两个年轻的）、老渔夫补的那张网、勒卡斯泰拉教堂后面的无花果树、那不勒斯港的书记、阿尔及尔巴尼奥的看守、船台上的饭锅。
#   任务单的梗概写的是“赎回三个渔夫”，场景与修正都以金角湾与阿尔及尔为准。
#   三个渔夫的年纪不写，只写是桨手与渔人；不写危险的打斗，不写恋爱。
# 秘密：“名字不许提他”。出钱的人是统帅，这件事不进见闻。正文里只在 ransom 的点名选项与 passage_named、landing_named、report_partial 里，岸上的传言碰到这件事；那是违背了他的条件的后果，不是见闻。
# 读的旗标：c13_main_tariq（offer 的变体，只改一句话；由塔里克主线第一章设，尚未写入，此前门禁等于不存在）。不读 c7_ 旗标，不设任何 c7_ 旗标。
# 设的旗标：c13_request_uluc_ali_accepted / _declined（offer）、_paid（ransom 付钱的两条）、_named（ransom 点名）、_word_taken（passage 与 passage_named 的两个选项）、_questioned（landing 与 landing_named 检定失败）、_at_sea（landing 海上换船）、_word_kept（report 只说人已到家）；
#   终局 _late / _done / _partial，每条路只设一面。
# 不用 relation / tie / bond / heart 效果；本轨道不写 requires 挡在另一条路的旗标上。
# 报酬：现金 3650 加上还垫付的赎金 900，合计 4550（done 路，单笔不超过 5000）；点名的一路只付 2200，不还赎金（本来也没花）。好感最多 19（offer +2、ransom +3、passage +3、landing +3、report +8）；名声 +7（统帅档 5 加复合 2，仅 done 路）；奥斯曼声望 +2（仅 done 路）；回忆 mem-request_uluc_ali-report。无物品奖励，无技能奖励。
#   haggle 一路压到 500，省下的 400 当场给三个人置办衣裳与干粮，合计仍垫 900，与结账对上（2026-10-26 整合时改）。
# 依赖：港口 istanbul（ports_east_med.toml）、algiers（ports_north_africa.toml）、naples（ports_west_med.toml）；属性 eloquence；技能 negotiation、lang_italian；人物 uluc_ali。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_uluc_ali-report「无花果树」：金角湾的船台，新龙骨的木架之间，墨斗线绷得笔直，线头压在一根木料上；旁边一只冷掉的饭碗。

[[tracks]]
key = "request_uluc_ali"
name = "勒卡斯泰拉的三个渔夫"
kind = "request"
