text = "告诉他：出钱的人不许提，我什么也不知道。"
next = "landing"
reply = "他看了你很久，笑了：“好，好。不知道。”然后他还是把那句话又说了一遍，慢慢地，像怕你记错。"
effects = [{ kind = "affinity", person = "uluc_ali", value = 2 }, { kind = "flag", flag = "c13_request_uluc_ali_word_taken" }]

