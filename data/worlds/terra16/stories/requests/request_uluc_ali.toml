[[tracks.chapters]]
key = "passage"
title = "无花果树"
text = "出海第五天，风转了向。老渔夫还坐在船尾补网，针脚很慢。他忽然抬头问：“出钱的人，是不是左边眉毛上有一道疤，小时候爬过教堂后面那棵无花果树？”你没答。他把针插进网眼里，自己往下说：“那孩子十几岁被掳上了船，家里人以为他死了。他母亲在门口那棵树底下坐了好些年。”网补到一半，他停了手，“我求你带一句话回去：树还结果子，房子的顶也还在。”"
speaker = "captain"
mood = "tender"
objectives = [{ kind = "wait", days = 5, text = "出海五天" }]
when = [{ kind = "alive", person = "uluc_ali", value = true }]

[[tracks.chapters.choices]]
key = "promise"
text = "答应把话带到，不说出钱的人是谁。"
next = "landing"
reply = "老人把补好的网叠起来，叠得方方正正：“那就够了。我不问是谁。”"
effects = [{ kind = "affinity", person = "uluc_ali", value = 3 }, { kind = "flag", flag = "c13_request_uluc_ali_word_taken" }]

[[tracks.chapters.choices]]
