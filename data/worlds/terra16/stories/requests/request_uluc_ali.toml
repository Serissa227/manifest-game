[[tracks.chapters]]
key = "offer"
title = "船台边的名字"
text = "金角湾兵工厂的船台上，一截新龙骨架在木架里立着。乌卢赤·阿里站在饭棚边，掀开大锅的盖子，拿木勺把豆子压散，数底下的肉。桨手们排成一队，他没回头，先问：“你的水手吃得饱吗？”不等你答，他从腰带里抽出一张折得发毛的纸，展开递过来。纸上是三个名字，都是勒卡斯泰拉的渔夫，关在阿尔及尔的巴尼奥里。“赎金我出，人送回卡拉布里亚的海边。”他把木勺搁在锅沿上，“只有一条：这话我只说一遍，谁也不许知道钱是谁的。”"
speaker = "uluc_ali"
mood = "tense"
objectives = [{ kind = "person", person = "uluc_ali", text = "在港里找到他" }]
when = [{ kind = "date", from = [1572, 3, 1], to = [1585, 10, 31] }, { kind = "age", ge = 17 }]
deadline = [1585, 10, 31]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_tariq"
when = [{ kind = "flag", flag = "c13_main_tariq" }]
text = "金角湾兵工厂的船台上，一截新龙骨架在木架里立着。乌卢赤·阿里站在饭棚边，掀开大锅的盖子，拿木勺把豆子压散。桨手们排成一队，他没回头，先问：“你的水手吃得饱吗？”你还没答，他转过身，目光在你脸上停了停。“阿尔及尔码头上那个替人数钱的孩子。”就这一句，没有下文。然后他从腰带里抽出一张折得发毛的纸，展开递过来。纸上是三个名字，都是勒卡斯泰拉的渔夫，关在阿尔及尔的巴尼奥里。“赎金我出，人送回卡拉布里亚的海边。”他把木勺搁在锅沿上，“只有一条：这话我只说一遍，谁也不许知道钱是谁的。”"

