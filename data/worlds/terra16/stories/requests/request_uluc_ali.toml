[[tracks.chapters]]
key = "report_partial"
title = "话带到了"
text = "金角湾的船台上，他已经听完了阿尔及尔的传言。你走过去，他没有抬头，手里的墨斗线压在一根新刨的木料上。“岸上的话，你听到了？”他问，又说，“别替我遮。”棚子那边传来桨手领饭的吵嚷，他听了一会儿，把墨斗线收进木匣里。船台边的工匠都低着头干活，没有人出声。"
speaker = "uluc_ali"
mood = "tense"
objectives = [{ kind = "person", person = "uluc_ali", text = "在港里找到他" }]
when = [{ kind = "alive", person = "uluc_ali", value = true }]
deadline_days = 150
news = "金角湾兵工厂的人说，统帅这几天在船台边话更少了，龙骨上的墨线弹了又擦。"
timeout = { next = "failed", effects = [{ kind = "affinity", person = "uluc_ali", value = -3 }, { kind = "flag", flag = "c13_request_uluc_ali_late" }, { kind = "letter", person = "uluc_ali", text = "乌卢赤·阿里（书记代笔）：人到了卡拉布里亚，那边的信我收到了。阿尔及尔的话我不解释。你垫的钱，下次来兵工厂领。" }] }

