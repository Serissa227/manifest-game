[[tracks.chapters]]
key = "ransom"
title = "巴尼奥的价钱"
text = "阿尔及尔的巴尼奥，铁栅门里一股烂稻草和尿的味道。看守把三个人领到门口：一个老的，两个年轻的，手上都是桨磨出来的茧，脚踝上还留着铁环的印子。看守伸出手，一根指头一根指头地数：“帕夏的抽成，通事费，港税，一人一份。”他说完，眼睛才往你身上溜，又去看那三个人，像在估他们还值不值。“要赎就快点，我这里不等人。”老的那个一直盯着你，一句话也不说。"
