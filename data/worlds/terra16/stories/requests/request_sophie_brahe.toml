# 药圃的书与籽（request_sophie_brahe）——C13d 人物的请托，故事 2.0 TOML。
# 人物：索菲·布拉赫（sophie_brahe，1556 年生，1643 年卒），第谷的妹妹；1588 年丈夫去世后管埃里克斯霍尔姆的庄园与花园，自己配药、替邻里看病。cast 已登记本轨道，日程为 1588—1590 埃里克斯霍尔姆。
# 类型：找东西（fd），offer（报价）→ handin（交书），收尾分三章：garden（带籽）、garden_marked（标了书）、garden_book（只交书），由 handin 选项的 next 分流。
# 报价：V 到访。auto=true；offer 在 copenhagen（哥本哈根药铺门口）；窗口 1588-02-01..1590-04-30，deadline 即窗口止日，超时 next=failed，无见闻；名声门槛 5；family=c13_offer_copenhagen，冷却 20 天。
# 报酬：现金 1600（身份档 2，低风险）；可能自付 100 买籽（不发物品，只在叙事里）；唯一奖励 tycho_copenhagen（第谷《论新星》，只当礼物）；技能 herbal_medicine +20；名声 +3；声望 denmark_norway +2；好感正向合计不超过 13（接下 +2，交书的三条路 +1／+3／+5，收尾 +5／+6）；回忆 mem-request_sophie_brahe-garden（只给种了东西的两条路）。
# 回忆插画：mem-request_sophie_brahe-garden——埃里克斯霍尔姆花园的一角，一排新苗旁插着写了名字的木牌，两块木牌被划掉。
# 依据——史实：索菲·布拉赫 1570 年代起协助第谷观测；1588 年丈夫奥特·托特去世后管埃里克斯霍尔姆的庄园与花园，自己配药。多东斯《草药书》在低地国家文化的港口有卖（items books_06_medicine 的 dodoens_antwerp）；第谷《论新星》1573 年在哥本哈根出版（books_04_navigation 的 tycho_copenhagen）。
# 原创：请托本身、南方的籽（四种里活了两种）、夜里标书的那一晚、港务处的来信、“种下去才知道”的口头禅（只在报价章用一次）。
# 不写：婚恋与追求者；幼子只在人物卡里；第谷的岛与仪器；书的内容只当礼物。
# 结构：收尾不用旗标门禁，而是三章分流（门禁写在选项上，审计的分支上会留下被挡住的选项）。seeds 与 marked 的旗标照 brief 设置，不再读取。
# 旗标：设置——报价 c13_request_sophie_brahe_accepted / declined；分支 seeds（带了籽）、marked（标了书）；终局 done（三章收尾都设，只设这一面）。读取——无。不设、不读任何 c7_ 旗标；不读 noel_unveiled；不依赖主线旗标。
# 英文覆盖：不写（本批仅中文）。

