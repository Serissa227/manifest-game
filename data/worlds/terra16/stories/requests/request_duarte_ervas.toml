[[tracks.chapters.choices]]
key = "go_goa"
text = "接下，去果阿的园子画三片叶子。"
next = "arrive"
reply = "他把三种叶子的名字抄在一张纸上，每个名字后面空出一大块，地方留得很宽。纸的边上又添了一行小字：“画错了的，擦掉重画，别涂。画满为止，我看得出来。”"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 2 }, { kind = "flag", flag = "c13_request_duarte_ervas_accepted" }]

[[tracks.chapters.choices]]
key = "ask_book"
text = "接下，先问：奥尔塔的书上为什么只有名字？"
next = "arrive"
reply = "“他是医生，不是画匠。”杜阿尔特说，那本书是写给认得叶子的人看的。“我们这边的人不认得，所以得有人去画。”他说这话时没有抬头，手里的笔还在画一片细长的叶子。"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 2 }, { kind = "flag", flag = "c13_request_duarte_ervas_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "去一趟果阿，就为画三片叶子？"
next = "failed"
reply = "他点点头，没有劝，只把那页识别册合上，放回柜台底下。“那就再等等。叶子不会跑。”他说完，又翻开册子看了看印度那几页，像是在数空着的地方。"
effects = [{ kind = "flag", flag = "c13_request_duarte_ervas_declined" }]

# 二、园丁的叫法：你到果阿，奥尔塔留下的园子。
[[tracks.chapters]]
key = "arrive"
title = "园丁的叫法"
text = "奥尔塔的园子比想象的小，墙根长满了草。看园子的是个裹着旧纱丽的老妇人，话说得慢，嗓子压着。你念那三个名字，她一个也不认得，摆摆手，用混着葡萄牙话的本地话说：“这几个名字，我没听过。”你比划叶子的样子，她就笑了，挨个指给你看，指一株，摘一片，揉碎了放进你手心。说起旧主人，她的声音更低：“他常坐在那棵树下问我叫法，问完写进小本子。”轮到第三种，你念出书上的名字，她摇摇头，朝墙角另一株抬了抬下巴：“书上那个名字，园子里叫的是那一株。”"
speaker = "captain"
mood = "mystic"
when = [{ kind = "alive", person = "duarte_ervas", value = true }]
at = "goa"
objectives = [{ kind = "at", at = "goa", text = "到果阿的奥尔塔园子去" }]
deadline_days = 400
timeout = { next = "failed", effects = [{ kind = "affinity", person = "duarte_ervas", value = -3 }, { kind = "flag", flag = "c13_request_duarte_ervas_late" }, { kind = "letter", person = "duarte_ervas", text = "果阿来的船带了一包干叶子，揉碎了，认不出。三页我先空着。——杜阿尔特" }] }

[[tracks.chapters.choices]]
key = "draw_both"
text = "两株都画，把叶脉、叶缘一条条描清。"
requires = [{ kind = "skill", skill = "painting", ge = 60 }]
hint = "叶脉太细，你画了两遍都画糊了。"
next = "report_both"
reply = "你画了一整天，两株的叶脉一条不差，叶缘的锯齿数到第十二个才停。旁边写上书上的叫法，又写上老妇人的叫法，两行并排。墨还没干，你就把纸对着光看了一遍。"
news = "果阿城边一座旧园子里，有个外乡船长对着三株草画了一整天，叶脉一条不差。"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 3 }, { kind = "flag", flag = "c13_request_duarte_ervas_both" }]

[[tracks.chapters.choices]]
key = "tell_apart"
text = "揉碎两种叶子闻气味，分清哪一株才是药。"
requires = [{ kind = "skill", skill = "herbal_medicine", ge = 60 }]
hint = "两种叶子的气味你分不出来。"
next = "report_both"
reply = "一株苦，一株涩。老妇人点头，说苦的那株治热，书上那个名字，园子里一直叫错了。你把两株都画下来，在苦的那株旁边打了个记号。"
news = "果阿城边一座旧园子里，外乡船长揉碎两株草闻了半天，园里的老妇人说，书上那个名字叫错了。"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 3 }, { kind = "flag", flag = "c13_request_duarte_ervas_both" }]

[[tracks.chapters.choices]]
key = "ask_her"
text = "请老妇人慢慢讲，我要本地的叫法和用处。"
check = { attr = "eloquence", base = 35, per = 6 }
next = "report_both"
reply = "她讲了很久，讲到旧主人，话停了一下，又接着讲下去。你照她指的画了，把两株的叫法都记在纸角上。她看了一眼纸，把你写歪的一个字用指甲划掉，重新写给你看。"
news = "果阿城边一座旧园子里，老妇人一种一种给外乡船长讲草药的本地叫法，讲了很久，讲到旧主人就停一停。"
effects = [{ kind = "affinity", person = "duarte_ervas", value = 3 }, { kind = "flag", flag = "c13_request_duarte_ervas_both" }]
fail = { next = "report_one", effects = [{ kind = "affinity", person = "duarte_ervas", value = -2 }] }

# 三之一、第三页：两株都辨过，由杜阿尔特决定写哪个名字。
[[tracks.chapters]]
key = "report_both"
title = "第三页"
text = "杜阿尔特把三张画铺在柜台上，拿放大镜一条一条看叶脉。前两张他看完就点头。看到第三张，两株并排，他停了很久。“先认叶，再背名。”他说，“书上的名字背了十年，叶子原来认错了。”他的指头在识别册那一页上来回按，那一页还空着。你站在柜台这边，看他把册子翻回印度那几页，名字一个个念过去，念到一半又停下来。“这两株，你是在哪儿采的？”他问，问得很慢，“我得知道写哪个名字。”"
speaker = "captain"
mood = "tender"
when = [{ kind = "alive", person = "duarte_ervas", value = true }]
objectives = [{ kind = "person", person = "duarte_ervas", text = "回里斯本，找到杜阿尔特" }]

[[tracks.chapters.choices]]
key = "both_names"
text = "劝他两个名字都写，注明哪株是园丁指的。"
next = "done"
reply = "他把两株都誊进册子，书上的名字写在上面，园里的叫法写在下面，中间画了一道线。他付了钱，又教你认那株苦叶背面的一层细毛。“下回不认得，先看这个。”"
news = "里斯本一家药铺的识别册上，印度那几页终于画上了叶子，两株并排，一个名字写在上面，一个写在下面。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "duarte_ervas", value = 8 }, { kind = "fame", value = 1 }, { kind = "skill", skill = "herbal_medicine", value = 20 }, { kind = "flag", flag = "c13_request_duarte_ervas_done" }, { kind = "memory", memory = "mem-request_duarte_ervas-report", title = "放大镜下的叶脉" }]

[[tracks.chapters.choices]]
key = "book_name"
text = "说书是奥尔塔写的，照书上的名字写。"
next = "done"
reply = "他想了想，照书写了，在那一页的角上画了个问号。他付了钱，说问号以后再擦，擦之前总得有人去看一眼。他把这一页夹在册子最前面，像是要每天翻一次。"
news = "里斯本一家药铺的识别册上，印度那几页终于画上了叶子，名字照书写，角上还留着一个问号。"
effects = [{ kind = "cash", value = 800 }, { kind = "affinity", person = "duarte_ervas", value = 4 }, { kind = "skill", skill = "herbal_medicine", value = 20 }, { kind = "flag", flag = "c13_request_duarte_ervas_partial" }]

# 三之二、只画了一株：ask_her 检定失败，第三种只有老妇人指的那一株。
[[tracks.chapters]]
key = "report_one"
title = "只画了一株"
text = "你回到里斯本，把三张画铺在柜台上。前两张都画全了，第三张上只有一株。老妇人肯指的只有这一株，另一株你没问出名字，画也没画全，纸上还留着半截没收住的叶柄。杜阿尔特拿放大镜看了很久，把纸翻过来又翻回去。“这一株，书上叫的是哪个？”他问，问得很慢。你答不上来。他没有怪你，只说：“没问出来就算了，别编一个给我。”笔悬在那一页的上方，迟迟没有落下。"
speaker = "captain"
mood = "tender"
when = [{ kind = "alive", person = "duarte_ervas", value = true }]
objectives = [{ kind = "person", person = "duarte_ervas", text = "回里斯本，找到杜阿尔特" }]

[[tracks.chapters.choices]]
key = "book_one"
text = "照书上的名字写，她指的那株只画个圈，不写名。"
next = "done"
reply = "他照书写了名字，在那株的旁边画了个圈，圈里什么也不写。钱比说好的少了一截，他没有讲价，只说：“这一株，我自己再去问。”他把那张纸的边折了一角，好找。"
news = "里斯本一家药铺的识别册，印度那几页写上了名字，有一株的角上还画着个小圈。"
effects = [{ kind = "cash", value = 600 }, { kind = "affinity", person = "duarte_ervas", value = 3 }, { kind = "skill", skill = "herbal_medicine", value = 20 }, { kind = "flag", flag = "c13_request_duarte_ervas_partial" }]

[[tracks.chapters.choices]]
key = "unfinished"
text = "先不写，这一页空着。"
next = "failed"
reply = "“那就空着。”他把纸收进册子，压在最后一页底下，手指在那一页上停了停，没再提果阿，也没问你为什么没写完。只说下回来的时候，把叶子带整株的。"
effects = [{ kind = "affinity", person = "duarte_ervas", value = -2 }, { kind = "flag", flag = "c13_request_duarte_ervas_failed" }]
