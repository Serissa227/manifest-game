# C13d 请托：三片叶子（request_duarte_ervas）。中文，Claude 写。
# 人物：杜阿尔特·埃尔瓦斯 duarte_ervas（1540-09-25 生，男；里斯本新街药铺的学徒，势力 portugal，身份档 1；cast 在 cast/classmates_custom_lisbon_medicine.toml）。
# 类型：去某处（go）；4 章：offer → arrive → report_both 或 report_one，终点 done / failed。
#   与总决定的 3 章不同：report 按 arrive 的分支拆成 report_both（两株都辨过，设 both）与 report_one（只画到一株），各自两个选项，避免选项用 requires 挡在 both 旗标上（同一轨道设、另一路径才有）。
# 报价：当面（T）。人物按日程在里斯本（lisbon，market，1557—1590 常驻）；auto=false，玩家“问请托”（ask:request_duarte_ervas）启动。offer 章不写 at，objectives 为 person duarte_ervas。
# 窗口：报价 1571-01-01 至 1590-06-30（offer 章 deadline，timeout next=failed，不写见闻）；arrive 章 deadline_days=400，超时走 failed 并来信。report 两章不设期限。
# 依据：加西亚·达·奥尔塔（Garcia de Orta）1563 年在果阿印出讲印度药物的对话体书，1568 年卒于果阿；园子由后人与旧仆照看（待核，正文只用传闻与园丁的转述）。奥尔塔不出场。老妇人、园子里的树、三种叶子的本地叫法与“苦的那株治热”都是原创。
# 读的旗标（只读，不设）：bond_duarte_ervas 的 bond duarte_ervas ≥ C（offer 章 v1、v2，老同学的口气）；c7_tie_new_beatriz_simao_duarte_ervas_together（offer 章 v1、v3，只一句“拿给隔壁看”，不提名）。
# 设的旗标：c13_request_duarte_ervas_accepted / declined / both / done / partial / late / failed。
# 路线：offer 接下 → arrive；arrive 的两种辨认与 ask_her 检定成功 → report_both（设 both）；ask_her 检定失败 → report_one（不设 both）。
# 依赖：B10b 无需改名（lisbon、goa 已有港口，duarte 日程已在 lisbon）；园丁与奥尔塔无 cast 条目，只在正文里出现。主线旗标：无。
# 秘密：祖母的方子、换笔迹抄册的事，本文件永不写，见闻也不写；园丁说起旧主人时的低声只作氛围。
# 回忆插画：mem-request_duarte_ervas-report，放大镜下的一页识别册：两株叶子并排，上面写书上的名字，下面写园丁的叫法，中间一道线。

[[tracks]]
key = "request_duarte_ervas"
name = "三片叶子"
kind = "request"
start = "offer"
auto = false
cast = ["duarte_ervas"]

# 一、书上没有的叶子：里斯本的药铺，玩家来问。
[[tracks.chapters]]
key = "offer"
title = "书上没有的叶子"
text = "杜阿尔特的识别册摊在柜台上，每个药名旁边一片叶子，画得比字还仔细。你进门，他先不问要什么，先问：“你身上这股草味，是在哪儿沾的？”你答不上来，他也不急，把册子翻到印度那几页。那几页只有名字，没有叶子。“果阿，奥尔塔先生留下的园子。园里有这三种，书上只写了名字，我要照着实物画下来。”他把自己画的一片叶子举到你眼前，叶脉细得像头发。“画错一条，我就认不出了。画错了，比没画还害人。”"
speaker = "captain"
mood = "tender"
when = [{ kind = "date", from = [1571, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "duarte_ervas", ge = 18 }]
objectives = [{ kind = "person", person = "duarte_ervas", text = "在里斯本的药铺找到他" }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_classmate_beatriz"
when = [{ kind = "bond", person = "duarte_ervas", level = "C" }, { kind = "flag", flag = "c7_tie_new_beatriz_simao_duarte_ervas_together" }]
text = "杜阿尔特的识别册摊在柜台上，翻开的是你们学院时一起画的那一页，你那张旧画还夹在里面，叶脉歪得很，他没抽出来。你进门，他先问：“你身上这股草味，是在哪儿沾的？”你答不上来，他笑了，把册子推过来：“这回你画，我认。”然后指着印度那几页，只有名字，没有叶子。“果阿，奥尔塔先生留下的园子。园里有这三种，要照着实物画下来。”他把自己画的一片叶子举到你眼前。“画错一条，我就认不出了。画错了，比没画还害人。”他说画完了，要先拿给隔壁看，说完又觉得多嘴，把册子合上了。"

