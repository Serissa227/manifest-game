news = "月港北门的老太太听一个船长用闽南话说完她男人走过的船路，自己站起来，让儿子去北大年。"
effects = [{ kind = "affinity", person = "raja_hijau", value = 3 }]

# 三、海上的巡船：出港第六天，哨船查船引。
[[tracks.chapters]]
key = "passage"
title = "海上的巡船"
text = "出港第六天，一条巡海的哨船靠过来查船引。船引上写的是货，没有一个带着铸炮模子的工匠，私自出洋是要追究的。哨船上的人踩上甲板，一箱一箱地翻。舱里只剩一盏油灯，油烟把人的脸熏得发黑。你站在舱口，手里的船引被汗浸软了一角。铸匠缩在舱底，抱着他的模子箱，一声不敢出。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "raja_hijau", value = true }]
objectives = [{ kind = "wait", days = 6 }]

[[tracks.chapters.choices]]
key = "hide"
text = "让他躲进货舱最里头，把模子混在货里。"
next = "arrive"
check = { attr = "stewardship", base = 20, per = 7 }
reply = "巡船的人翻了几箱瓷器，嫌舱里闷热，骂了一句，走了。铸匠从舱底钻出来，一身汗，手还抱着模子箱。"
effects = [{ kind = "affinity", person = "raja_hijau", value = 3 }]
fail = { next = "arrive", news = "从月港开出的船在北大年外海被查，模子箱翻了出来，只好认作货，船引上补了一笔税。铸匠没事，就是一身冷汗。", effects = [{ kind = "flag", flag = "c13_request_raja_hijau_taxed" }] }

[[tracks.chapters.choices]]
key = "crew"
text = "把他报成船上的木匠，给巡船的人塞一笔茶钱。"
next = "arrive"
requires = [{ kind = "cash", ge = 200 }]
hint = "你的钱袋太轻，塞不出一笔像样的茶钱。"
reply = "巡船的人收了茶钱，在船引上添了“木匠一名”，还提醒你南边海上有人劫船。"
effects = [{ kind = "cash", value = -200 }, { kind = "affinity", person = "raja_hijau", value = 3 }]

# 三之二、船上的一年：persuade 的承诺检定失败，老人只放一年。路线分开，choice 不另读旗标。
[[tracks.chapters]]
key = "passage_one_year"
title = "船上的一年"
text = "离开月港的第六天，一条巡海的哨船靠过来要看船引。船引上只写了货，一个工匠也没有。哨船上的人踩上甲板，朝舱口看了一眼。舱里点着一盏油灯，灯芯短得快要熄了。你挡在舱口，把船引往身后藏了藏。铸匠缩在舱底，抱着模子箱，嘴里小声数着：一年，还有一年。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "raja_hijau", value = true }]
