# 请托：月港的铸匠（request_raja_hijau）。Claude 写（C13d，2026-10-25），仅中文；寰宇先只做中文，不写英文覆盖。
# 人物：拉惹·希贾乌（raja_hijau，女，生年不详；1584 年即位，1616 年卒）。北大年的女王，人称“绿女王”。cast：cast/historical_03_indian_ocean.toml；身份档 3（王侯）。
# 类型：押运／带人（escort）。四章：offer（税馆报价）、persuade（月港的铸坊）、passage（海上的巡船）、arrive（城头的炮位）；一年支线另有 passage_one_year、arrive_one_year。
# 报价：来信／代理人。auto=true；offer 章 at=pattani，出面的是女王的港务官（写身份，不新建 cast）。offer 的 when 写 17 岁、1584-06-01 至 1590-04-30、名声 ≥ 30；deadline=1590-04-30，timeout 走 failed，不写见闻。family=c13_offer_pattani，冷却 20 天。
# 依据·史实：拉惹·希贾乌 1584 年即位；1567 年月港开海，出洋要船引。北大年的大铜炮与铸炮的唐人匠人见于后世传说，本条不写铸匠与炮的名字。
# 依据·原创：铸匠与他的老母亲、钥匙串、模子箱、税吏的红章、女王敲钟的那一下、城北的铸坊。巡船的哨船与船上的人都不对应史上某一条船或某一个人。
# 读的旗标：无（不读 c7_*，不读 noel_unveiled；gate_main 为空，不写 c13_main_ 门禁）。
# 写的旗标：accepted（offer 两种接法）、declined（终局，回绝）、late（persuade 与 arrive、arrive_one_year 超时，终局）、done（arrive 与 arrive_one_year 的收尾，终局）。
#       分支旗标共三面：bell（offer 问“为什么”，persuade 的变体读它）、one_year（persuade 的承诺检定失败，老人只放一年）、taxed（passage 的藏货检定失败，模子被认作货；arrive 与 arrive_one_year 的变体读它）。
# 报酬：现金 3650（arrive 与 arrive_one_year 的收尾各给一次）；好感：接下 +2，办成 +3，收尾 +8（visits 的收尾 +6，一年支线 +6 或 +4），检定失败 −2；名声 +5（身份档 3 的最好结局）；回忆 mem-request_raja_hijau-arrive。无物品、无技能；不给声望（见下）。
# 依赖：港口 pattani（offer、arrive、arrive_one_year）、yuegang（persuade）；技能 lang_chinese（skills.toml，hokkien 的门槛）；检定属性 eloquence、stewardship；不涉及 B10b 改名。
# 声望：本条不给。factions_runtime.toml 里已经有 pattani 这一条登记；整合时若确认，可在两个收尾各加 reputation pattani +3。
# 与旧设计的差别：一年路线拆成 passage_one_year 与 arrive_one_year 两章，choice 不再用 requires 读同一轨道里别的路径才设的旗标；承诺检定失败另给好感 −2（decisions 第二节）；mother_agreed 旗标省去（分支旗标上限三面，它没有读取者）。
# 回忆插画：mem-request_raja_hijau-arrive：北大年税馆的柜台，一只打开的木模箱，模子沾着泥，女王的指腹蹭上一道灰。

[[tracks]]
key = "request_raja_hijau"
name = "月港的铸匠"
kind = "request"
start = "offer"
auto = true
cast = ["raja_hijau"]

# 一、税馆里的差事：北大年税馆，女王的港务官报价。
[[tracks.chapters]]
key = "offer"
title = "税馆里的差事"
text = "北大年的税馆里，女王的港务官一边收你的税，一边把账本翻到新的一页。他说城头要架几尊有名有姓的大铜炮：暹罗请过炮匠，葡萄牙人的炮匠也请过，铸出来的炮口都不匀。“女王听说月港有个唐人铸匠，铸钟铸炮都好，就是不肯出海。”他合上账本，“要一条船，去把人请来，连人带模子。”柜台上的银币一枚一枚摆开，他数得很慢。"
at = "pattani"
mood = "cheerful"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1584, 6, 1], to = [1590, 4, 30] }, { kind = "fame", ge = 30 }]
deadline = [1590, 4, 30]
timeout = { next = "failed" }
family = "c13_offer_pattani"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "take"
text = "接下：去月港请铸匠。"
next = "persuade"
reply = "港务官把一封盖着女王印的请帖交给你，又低声补了一句：“女王不爱听‘请不来’三个字。”"
effects = [{ kind = "affinity", person = "raja_hijau", value = 2 }, { kind = "flag", flag = "c13_request_raja_hijau_accepted" }]

[[tracks.chapters.choices]]
key = "ask_why_him"
text = "接下，但问：为什么非要唐人的铸匠？"
next = "persuade"
reply = "“唐人的炉子烧得最匀。”港务官说，“女王看过他铸的一口钟，拿指节敲了一下，就定了。”"
effects = [{ kind = "affinity", person = "raja_hijau", value = 2 }, { kind = "flag", flag = "c13_request_raja_hijau_accepted" }, { kind = "flag", flag = "c13_request_raja_hijau_bell" }]

[[tracks.chapters.choices]]
key = "decline"
text = "这种差事我不接。"
next = "failed"
reply = "港务官把请帖收回去，税照收，一文不少。"
news = "北大年的税馆里，女王想从月港请一个铸炮的唐人，来托的船长一口回绝；港务官收回请帖，税一文不少。"
effects = [{ kind = "flag", flag = "c13_request_raja_hijau_declined" }]

# 二、铸匠的老母亲：月港北门的铸坊，老人手里的钥匙串。
[[tracks.chapters]]
key = "persuade"
title = "铸匠的老母亲"
text = "月港北门的铸坊里，炉火半灭，墙角堆着几块黄铜料，料上落着一层炭灰。铸匠听你说到北大年的女王，眼睛亮了一下，又暗下去。门槛上坐着他的老母亲，手里攥着一串钥匙。“他爹当年也是这样出的洋，”她说，“船开走了，人就没回来。”她把钥匙串往怀里收了收，“他要走，这间铸坊我就锁了。”"
at = "yuegang"
speaker = "captain"
mood = "tender"
when = [{ kind = "alive", person = "raja_hijau", value = true }]
deadline_days = 180
timeout = { next = "failed", news = "月港北门的铸坊关了炉。铸匠等不到北大年的船，自己雇了一条去南洋的船，他娘在码头上站到船看不见。", effects = [{ kind = "affinity", person = "raja_hijau", value = -3 }, { kind = "flag", flag = "c13_request_raja_hijau_late" }, { kind = "letter", person = "raja_hijau", text = "北大年的港务官来信：女王另从暹罗请到了人。月港那位，就让他守着他娘吧。" }] }

[[tracks.chapters.variants]]
key = "v1_bell"
when = [{ kind = "flag", flag = "c13_request_raja_hijau_bell" }]
text = "月港北门的铸坊里，炉火半灭，墙角堆着几块黄铜料，料上落着一层炭灰。铸匠听你说到女王敲了他铸的那口钟，手里的钳子停住，又慢慢放下。门槛上坐着他的老母亲，手里攥着一串钥匙。“他爹当年也是这样出的洋，”她说，“船开走了，人就没回来。”她把钥匙串往怀里收了收，“他要走，这间铸坊我就锁了。”"

[[tracks.chapters.choices]]
