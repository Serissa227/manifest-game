next = "arrive_one_year"
check = { attr = "stewardship", base = 20, per = 7 }
reply = "巡船的人在瓷器箱之间翻了一阵，嫌底下木板潮，甩手走了。铸匠把头从舱底探出来，额上全是汗，嘴里还在数那一年。"
