key = "report"
title = "灯下的纸"
text = "总兵府的偏厅里只点了一盏灯，案角搁着一只凉透的茶碗。戚继光把你记的纸摊在案上，看一行，用指头点一下，点到哪里，嘴里就念一个数：几座，塌哪面，离水几里。看到那座供着妈祖的墩台，他哼了一声：“守墩的人跑了，渔民倒替我守着。”他抬起头，等你把没写在纸上的话说完。"
