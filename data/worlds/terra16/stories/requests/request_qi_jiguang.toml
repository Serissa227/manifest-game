key = "manual"
title = "海上的人读得懂吗"
text = "他没放你走。窗外校场上收操的梆子刚响过，他从案头抽出一页刚改过的兵书，墨还没干，写的是船上怎么分哨、怎么传号：左翼右翼，击鼓为号，依次而进。字写得极小，一行挤着一行，纸边有三处墨团，是划了又写、写了又划的。“我在北边写的那一套，”他把笔蘸饱，“拿到海上来，水手读得懂吗？”他没等你想好，就把笔递了过来。"
