# 请托：退了三里的海（request_rossella）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：罗塞拉·萨利纳（rossella，1534-01-07 生，女），塞图巴尔盐田人家的长女；势力 portugal，身份档 0（平民）。cast：cast/story_europe.toml。
# 类型：去某处（go）。三章：offer（报价）、arrive（加的斯问第三个老人）、report（回里斯本交代）；终点 done / failed。没有 stage 章，因此没有 window 与 default。
# 报价：V（到访）。罗塞拉下到里斯本码头卸盐，auto=true；offer 写 at=lisbon，窗口 1563-01-01 至 1590-06-30（只写 when 的 date 与 age）。
#       offer 写 family=c13_offer_lisbon、冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：arrive 写 deadline_days=120，超时走 failed，来信一封，好感 -3，旗标 _late，见闻只写老人走了、耙子还靠在盐堆旁，不写墙与门。report 是普通章，可以一直等。
# 依据·史实背景：塞图巴尔与加的斯都是海边的晒盐盐田，平底池与堤、沙洲与河口，是这一带的日常。
# 依据·原创：“有一年海退了三里，盐田底下露出老墙，墙上有门，三天以后海又回来”是世界的背面第 6 节“潮盐”的口述。只记口述，不写真相；门后面的事一概不写，“门没人敢进”到此为止。
#       罗塞拉、加的斯的老人、三个人的说法、盐价跌了一半的那一年，都是原创。
# 待核：无。全部口述都用传闻口吻，不替“潮盐”的传说定论。
# 秘密：cast 没写秘密。C7 罗塞拉×康拉德（BG）的线在 1563 年以后不写，不写康拉德，不写“袖口的白”；见闻不写任何 c7_ 内容。请托不写心动，不用 relation / tie / bond / heart 效果。
# 读的旗标：无（不读 c7_*，gate_main 与 variant_main 都为空，不读 c13_main_*）。
# 设的旗标：c13_request_rossella_accepted（offer 两条接法）、_declined（offer 回绝）、_wall（offer 问墙，arrive 读它换一句开场）、
#   _exact（arrive 照原话记下，检定成功）、_gist（arrive 检定失败，只记下大概，report 读它）、_year（arrive 问年份，report 读它）、
#   _late（arrive 超时）、_done（report 两条收尾）。分支旗标 _wall 与 _gist 是本文件新增的，不属于终局旗标。
# 报酬：现金 400（report 一次）；好感最多 +13（accept 或 ask_wall 或 ask_year 或 exact 的路：2+3+8）；名声 +1；回忆 mem-request_rossella-report。无物品、无技能、无海图。
# 依赖：港口 lisbon、cadiz（ports_iberia.toml）；人物 rossella（cast/story_europe.toml）；检定属性 eloquence；无 B10b 改名；无主线门禁。
# 回忆插画清单：
#   mem-request_rossella-report「并排抄的三行」：里斯本的码头边，一张摊开的纸，三行字各带一个名字，纸角压着一袋盐，风把纸角掀起来。

[[tracks]]
key = "request_rossella"
name = "退了三里的海"
kind = "request"
start = "offer"
auto = true
cast = ["rossella"]

# 一、码头上的盐袋：罗塞拉在里斯本卸盐，先招呼你，再说老人的话。
[[tracks.chapters]]
key = "offer"
title = "一个说三天，一个说七天"
text = "码头上的盐袋堆到了桅杆下。罗塞拉站在袋子中间，一袋一袋点数，点得飞快。她抬头看见你的船，先开了口：“啊、你好……要、要买盐吗？先说好，价钱不、不能再低了。”没等你答，她又把数报了一遍，才说到正事。塞图巴尔盐田的老人讲过，有一年海退了三里，盐田底下露出一道老墙，三天以后海又涨回来了。她问过两个老人，一个说退了三天，一个说退了七天。第三个人搬去了加的斯的盐田。她的手指在袋子上停了一下，脸红起来：“我、我想请你去问。”"
speaker = "rossella"
mood = "mystic"
at = "lisbon"
when = [{ kind = "date", from = [1563, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_lisbon"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "答应去加的斯问第三个人。"
next = "arrive"
reply = "“加的斯的盐田在河口那一边，过了沙洲就到。别走大路，走盐田的堤。”她把前两个老人的话抄在纸上，字抄得很整齐，结巴的地方一个也没写进去。"
effects = [{ kind = "affinity", person = "rossella", value = 2 }, { kind = "flag", flag = "c13_request_rossella_accepted" }]

[[tracks.chapters.choices]]
key = "ask_wall"
text = "问她：那道墙，是什么样的墙？"
next = "arrive"
reply = "“老人说是石头的，比盐田的堤还高。”她低头算了一下，“要是真的，比盐田还老。”说完，她把账本往你这边推了推，“堤是我祖父砌的，比那道墙差远了。”"
effects = [{ kind = "affinity", person = "rossella", value = 2 }, { kind = "flag", flag = "c13_request_rossella_accepted" }, { kind = "flag", flag = "c13_request_rossella_wall" }]

[[tracks.chapters.choices]]
key = "decline"
text = "老人的闲话，你不去问。"
next = "failed"
reply = "她点点头，没再提。接着点盐袋，一袋一袋，嘴里数着，没点错一袋。你走出去的时候，听见她在后面把数又念了一遍。"
effects = [{ kind = "flag", flag = "c13_request_rossella_declined" }]

# 二、加的斯的盐田：第三个老人坐在盐堆的阴影里，只跟你说一次。
[[tracks.chapters]]
key = "arrive"
title = "墙上有门"
text = "加的斯的盐田边，风从海上吹过来，带着咸味。罗塞拉在纸上画过第三个人的位置：盐田西头，靠近沙洲的第三间棚子。那人坐在盐堆的阴影里，膝上横着一把木耙，正用湿麻绳补耙齿。你报了来意，他手没停：“那一年啊。”他说那一年海退得远，“走一个上午的路”才到水边。退下去的海底下，墙是有的，石头砌的，比盐田的堤还高。墙上有门。“门没人敢进。”他把麻绳打了个结，咬断，又补了一句：“这话我跟谁都没说过。说了，人家当我疯了。”"
speaker = "captain"
mood = "mystic"
at = "cadiz"
when = [{ kind = "alive", person = "rossella", value = true }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "rossella", value = -3 }, { kind = "flag", flag = "c13_request_rossella_late" }, { kind = "letter", person = "rossella", text = "加的斯那位老人，今年春天走了。我只记了两个人的。" }], news = "加的斯的盐田边，那个补耙子的老人今年春天走了，他的耙子还靠在盐堆旁，没人去拿。" }
news = "加的斯的盐田边，一个外乡船长坐在盐堆的阴影里，听一个补耙子的老人讲海退的那一年。"

[[tracks.chapters.variants]]
key = "v1_wall"
when = [{ kind = "flag", flag = "c13_request_rossella_wall" }]
text = "加的斯的盐田边，风从海上吹过来，带着咸味。第三个老人坐在盐堆的阴影里补耙子，你一走近，他就抬起头：“问墙的？”他没等你开口，说那一年海退得远，“走一个上午的路”才到水边。退下去的海底下，墙是有的，石头砌的，比盐田的堤还高。墙上有门。“门没人敢进。”他把麻绳打了个结，咬断，又补了一句：“这话我跟谁都没说过。说了，人家当我疯了。”"

[[tracks.chapters.choices]]
key = "write_exact"
text = "照他的原话记，一个字不改。"
next = "report"
check = { attr = "eloquence", base = 35, per = 6 }
reply = "你记下了“走一个上午的路”“墙上有门”“门没人敢进”。老人看你记，放慢了语速，一句一句等你写完。“记下来好。人一走，话还在纸上。”"
effects = [{ kind = "affinity", person = "rossella", value = 3 }, { kind = "flag", flag = "c13_request_rossella_exact" }]
fail = { next = "report", effects = [{ kind = "affinity", person = "rossella", value = -2 }, { kind = "flag", flag = "c13_request_rossella_gist" }] }

[[tracks.chapters.choices]]
key = "ask_year"
text = "追问是哪一年，那年还发生了什么。"
next = "report"
reply = "他想了半天，说是他娶老婆那年，那年盐价跌了一半。这个他记得清，老婆的脸他倒记不清了，他笑着说。你记下了，这比一个年份还好查。"
effects = [{ kind = "affinity", person = "rossella", value = 3 }, { kind = "flag", flag = "c13_request_rossella_year" }]

# 三、回到里斯本：三句话并排抄在一张纸上，她问你这件事该怎么写。
[[tracks.chapters]]
key = "report"
title = "以后的人自己去想"
text = "码头的风把纸吹得哗哗响。罗塞拉把一张纸压在一袋盐上，三个老人的话并排抄在上头：塞图巴尔的两个老人，一个说退了三天，一个说退了七天；加的斯那个说，“走一个上午的路”，墙上有门。纸边上沾着盐粒，她用指甲把每一行划过去，划得很慢，像是在数潮水。她的账本摊在旁边，记着这个月卖出去的每一袋盐，一袋也不差。划到最后，她抬起头问你：“这件事，我该怎么写下来？”"
speaker = "captain"
mood = "tender"
at = "lisbon"
when = [{ kind = "alive", person = "rossella", value = true }]
news = "里斯本码头上卸盐的塞图巴尔姑娘，把三个老人讲的海退的事抄在了一张纸上。"

[[tracks.chapters.variants]]
key = "v1_year"
when = [{ kind = "flag", flag = "c13_request_rossella_year" }]
text = "码头的风把纸吹得哗哗响。罗塞拉把一张纸压在一袋盐上。纸的最上头，她先写了一行：盐价跌了一半那年。底下是塞图巴尔两个老人的话，一个说退了三天，一个说退了七天；再下面，是加的斯那个说的，“走一个上午的路”，墙上有门。她点到最后，抬起头问你：“这件事，我该怎么写下来？”她的账本就摊在旁边，盐粒把页角都腌软了。"

[[tracks.chapters.variants]]
key = "v2_gist"
when = [{ kind = "flag", flag = "c13_request_rossella_gist" }]
text = "码头的风把纸吹得哗哗响。罗塞拉把一张纸压在一袋盐上：塞图巴尔的两个老人，一个说退了三天，一个说退了七天。加的斯那一段，你只记下了个大概，她对着那一行看了很久，问你：“他说的，是这个意思吗？”她没再追问，把那一行单独抄在纸角，抄完才抬起头：“这件事，我该怎么写下来？”纸角很快被盐粒压皱了。"

[[tracks.chapters.choices]]
key = "as_said"
text = "照三个人的原话写，谁说的就写谁。"
next = "done"
reply = "她写了三行，每行后面都写上说话的人和盐田的名字，笔画很稳，一个字也没涂改。写完，她把笔搁回纸边：“这样，以后的人自己去想。”"
effects = [{ kind = "cash", value = 400 }, { kind = "affinity", person = "rossella", value = 8 }, { kind = "fame", value = 1 }, { kind = "memory", memory = "mem-request_rossella-report", title = "并排抄的三行" }, { kind = "flag", flag = "c13_request_rossella_done" }]

[[tracks.chapters.choices]]
key = "no_conclusion"
text = "只写“有人说海退过，墙露过”，不写天数。"
next = "done"
reply = "她想了想，摇头，还是把天数也写上了：“天数是我的本事，不写，我心里不踏实。”她付了钱，又多说了一句：“路上要是缺盐，到塞图巴尔来找我。”"
effects = [{ kind = "cash", value = 400 }, { kind = "affinity", person = "rossella", value = 6 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_rossella_done" }]
