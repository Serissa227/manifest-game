# 请托：两本账一起摆上桌（request_lin_hui）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-25，Claude（Sonnet）执笔。
# 人物：林蕙 lin_hui（1538-06-08 生，女），八连（Parián）福建商人的女儿，门口总摆一张大桌，左边汉字账，右边西班牙账（cast/story_southeast_asia.toml）。
# 类型：说服某人（persuade）。章节：offer 谁也别想走 → persuade 天经地义（三条路：复式记账 / 卡斯蒂利亚语念条例 / 口才）→ 终章：result 对上了（条子上写的是“照旧”）、result_partial 只对上一半（口才失手，只肯少加一半）。
# 结构说明：分支靠 next 走到各自的章节，不靠互斥的旗标门禁。persuade 的 argue 检定成功走 result，失败走 result_partial；result 与 result_partial 的选项都不带 requires。
# 报价：当面（T）。auto=false，玩家在马尼拉八连找到她（ask:request_lin_hui）。窗口 1585-01-01 至 1590-06-30；persuade 期限 60 天，最迟 1590-08 底结束；result 没有期限，只写起日，免得过了年末没人收尾。
# 身份档 1（小商）、风险中：现金基数 900，×1.4 = 1250。最好的结局 1250；折中 700；失败 0。名声 +2 给 result 的两个选项（各一次，互斥），折中结局不给。好感正向合计：接下 2 + 路上 3 + 结局 8 = 13。
# 依据（史实）：1580 年代马尼拉城墙外的八连（Parián）是华商聚居与交易的地方，西班牙人向华商收执照钱与各样捐费（背景，传闻口吻）；1583 年马尼拉大火之后铺子重盖（只说“火后重盖”，大火本身归 C7）。
# 依据（原创）：林蕙门口的大桌与红绳捆着的两本账；隔壁卖线的老妇；市政厅偏厅里那个不起名字的书记（叙事人物，不建 cast）；账页脚上钉着的收据签条；书记批的那张条子；账本末页并排的两行字。
# 待核：八连执照钱的征收方式（按铺面还是按营业），正文一律用告示与书记的口吻，不下断语。
# 秘密：林凤手下有她一个远房堂兄（cast secret）。本请托永远不碰，正文不暗示，见闻不写。
# 不写：佩德罗·德·奥坎波、卡塔丽娜·佩雷拉（C7 的另一半）、C7 的章名“两种账簿的桌”；只写门口的大桌。不写恋爱，不用 relation / tie / bond / heart。
# 口头禅：「你那张单子，先报给我听，我两本账一起记。」只在 result 用一次（书记批的那张单子交到她手里）。
# 读写的旗标：只设 c13_request_lin_hui_*。终局 done / partial / late；分支 accepted / declined / kept；另三面分支旗标 rent（问过房租，persuade 变体读）、ledger / spanish（result 变体读）。不读任何 c7_ 旗标，不设 c7_ 旗标。
# 门禁：无（brief 的 gate_main 为空）。c13_main_* 不读。
# 依赖：技能 double_entry、lang_spanish 现成（skills.toml）；港口 manila 现成；无改名依赖。
# 回忆插画清单：
#   mem-request_lin_hui-result「对上了的两行」：门口的大桌上，两本账翻到末页并排摊着，汉字一行、西班牙字一行，写的是同一个日子。
# 缺省走向：玩家不来，offer 到期走 timeout（不写见闻）；persuade 超时，告示照贴，来信一封；result 没有期限，可以一直等。

[[tracks]]
key = "request_lin_hui"
name = "两本账一起摆上桌"
kind = "request"
