# result_partial · 1585— · 八连：书记划过的告示，只肯少加一半
[[tracks.chapters]]
key = "result_partial"
title = "只对上一半"
text = "我回到八连，把书记划过的那张告示放在大桌上。原先要加的数目被一道墨线拦腰截去，只剩一半。林蕙拿算盘把剩下的一半重新拨了一遍，珠子落得比平时重。“少加一半，账上也是个加字。”她说。可她还是翻开汉字那本的末页，写了一行，笔尖顿了顿，把笔朝我这边递过来。"
