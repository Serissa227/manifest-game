reply = "他案头就搁着市政厅的条例册子。我翻到收执照钱的那一条，一个字一个字地念：按营业征收。念完又往前翻一条，也是营业。没有哪一条写着按尺寸。书记的耳根红了，把告示翻过来看背面，手指在“尺寸”两个字上停了很久。“告示，”他说，“我回头改。”声音比刚才轻得多。"

[[tracks.chapters.choices]]
key = "argue"
