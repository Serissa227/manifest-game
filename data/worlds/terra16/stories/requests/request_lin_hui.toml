fail = { next = "result_partial", effects = [{ kind = "affinity", person = "lin_hui", value = -2 }], news = "马尼拉市政厅里，书记在八连执照钱的告示上划了一笔，原先要加的只加一半，两本账还摊在他桌上。" }
effects = [{ kind = "affinity", person = "lin_hui", value = 3 }, { kind = "flag", flag = "c13_request_lin_hui_kept" }]
reply = "书记没有马上答话。他走到窗边，八连的新瓦顶一片挨着一片，这个月进港的几条福建船正往那边卸丝。“告示先压一季。”他转回身，“看看再说。”他把两本账推回我面前，红绳散在桌角。"

