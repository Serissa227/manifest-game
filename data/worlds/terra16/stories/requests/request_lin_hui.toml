# result · 1585— · 八连：书记批的单子，两本账末页各添一行
[[tracks.chapters]]
key = "result"
title = "对上了"
text = "我回到八连，林蕙已经把大桌擦净了，两本账原样摊着。我把书记批给我的那张单子放在桌上，上头只有一行字：告示先压一季，执照钱照旧。她看也不看，把算盘往边上一推：“你那张单子，先报给我听，我两本账一起记。”我念给她听。她先在汉字那本的末页写了一行，墨迹未干，就把笔递过来，朝右边抬了抬下巴：“西班牙这本，你也写一行。”"
speaker = "captain"
mood = "cheerful"
at = "manila"
objectives = [{ kind = "person", person = "lin_hui", text = "回八连找林蕙" }]
when = [{ kind = "date", from = [1585, 1, 1] }, { kind = "alive", person = "lin_hui", value = true }]
news = "马尼拉八连，林蕙家门口那张大桌上的账本，最后一页多了一行：执照钱照旧。"

[[tracks.chapters.choices]]
key = "write"
text = "在西班牙那本上写：执照钱照旧，再添上日子。"
next = "done"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "lin_hui", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_lin_hui_done" }, { kind = "memory", memory = "mem-request_lin_hui-result", title = "对上了的两行" }]
reply = "我写得很慢，每个字母都怕歪。她等我收笔，把两本账的末页并排拉近，一个字一个字地对过去，连日子也对。“对上了。”她把酬金推到我手边，又把西班牙那本转向街口，朝来往的邻居扬了扬下巴：“都看见了？这一行是谁写的，八连的人记得住。”"

[[tracks.chapters.choices]]
key = "let_her"
text = "字不好看，让她自己写。"
next = "done"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "lin_hui", value = 6 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_lin_hui_done" }]
reply = "她笑了一声，说字好不好看不要紧，对得上就行。她的西班牙字写得圆，汉字写得方，两行并在末页，像两个人在门口并排站着。她吹干墨，把酬金数给我，数的时候没有看我，看的是账。"

