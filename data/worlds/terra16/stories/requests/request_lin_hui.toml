# offer · 1585—1590 · 八连街口：林蕙家门口的大桌，市政厅的告示压在算盘下面
[[tracks.chapters]]
key = "offer"
title = "谁也别想走"
text = "八连街口，林蕙家门口那张大桌上摊着两本账：左边汉字，右边西班牙字，中间压着市政厅刚送来的告示，拿算盘当镇纸。她左手拨珠，右手在西班牙那本上写，嘴里用闽南话念数，笔下出来的却是卡斯蒂利亚字。“铺子火后重盖，比从前大了。”她头也不抬，“告示就说，铺子大了，执照钱跟着涨。你去市政厅，找管这桩的书记，把两本账一起摆上他的桌。两本对不上，谁也别想走——他也一样。”隔壁卖线的老妇端着碗站在门边，汤也不喝，只看着她的算盘。"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "lin_hui", text = "在马尼拉八连找到林蕙" }]
when = [{ kind = "date", from = [1585, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应，去市政厅。"
next = "persuade"
effects = [{ kind = "affinity", person = "lin_hui", value = 2 }, { kind = "flag", flag = "c13_request_lin_hui_accepted" }]
reply = "她把两本账叠在一起，汉字的垫在下面，西班牙字的盖在上面，拿一根红绳捆了三道。“汉字的在下面。”她把绳结拍实，“他先看西班牙的，看不懂了，再翻下面的。”老妇在门边把碗里的汤喝完，算盘声又响了起来。"

[[tracks.chapters.choices]]
key = "ask_bigger"
text = "先问她：铺子真的比以前大了？"
next = "persuade"
effects = [{ kind = "affinity", person = "lin_hui", value = 2 }, { kind = "flag", flag = "c13_request_lin_hui_accepted" }, { kind = "flag", flag = "c13_request_lin_hui_rent" }]
reply = "“大了三尺。”她翻开汉字那本，指给我看一行红笔圈过的数，“可房租是以前的两倍，卖出去的货没多几件。账上都有。”她说完把两本账一叠，红绳绕上，往我手边一推。"

[[tracks.chapters.choices]]
key = "decline"
text = "市政厅的事，我不碰。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_lin_hui_declined" }]
reply = "她点点头，把红绳解开，接着对她的两本账。那张告示还压在算盘底下，边角被珠子硌出了一排小坑。卖线的老妇端着空碗走了。"

# persuade · 1585—1590 · 市政厅偏厅：书记念告示，账页脚上钉着市政厅自己的收据
[[tracks.chapters]]
key = "persuade"
title = "天经地义"
text = "市政厅的偏厅里，书记把告示从头念了一遍，念到“铺面既已加宽，执照钱照例增收”，抬眼说：“天经地义。”我没有争，解开红绳，把西班牙字的那本摊到他桌上。那一页的页脚钉着一排小小的签条，是市政厅去年收执照钱时开的收据，每张都盖着衙门的印。他的笔停了，眉头皱起来，手指不由自主地去摸其中一张的印。汉字的那本，仍压在我手底下。"
speaker = "captain"
mood = "tense"
at = "manila"
when = [{ kind = "date", from = [1585, 1, 1], to = [1590, 12, 31] }, { kind = "alive", person = "lin_hui", value = true }]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "letter", person = "lin_hui", text = "告示贴出来了，执照钱照加。账我还摊着，等下一个肯去的人。" }, { kind = "affinity", person = "lin_hui", value = -3 }, { kind = "flag", flag = "c13_request_lin_hui_late" }] }
news = "马尼拉市政厅里，有人把八连唐人商户的两本账摆上了书记的桌，执照钱的告示压了下来。"

[[tracks.chapters.choices]]
key = "ledger"
text = "照复式记账，把八连的进出一栏一栏摆给他看。"
next = "result"
requires = [{ kind = "skill", skill = "double_entry", ge = 60 }]
hint = "借方贷方，你只认得一边，翻到汉字那本就卡住了。"
effects = [{ kind = "affinity", person = "lin_hui", value = 3 }, { kind = "flag", flag = "c13_request_lin_hui_kept" }, { kind = "flag", flag = "c13_request_lin_hui_ledger" }]
reply = "我把两本账翻到去年同一个月，一栏进，一栏出，指给他看：铺面宽了三尺，房租翻了一倍，卖出去的货只多了零头。汉字那半他不认得，就拿手指在西班牙那本上一行一行地去对。对到最后一页，他把笔放下了。“进出是对得上的。”他说，“我没法说这铺子多赚了。执照钱，照旧。”"

[[tracks.chapters.choices]]
key = "spanish"
text = "用卡斯蒂利亚语，把市政厅自己的条例一条一条念给他听。"
next = "result"
