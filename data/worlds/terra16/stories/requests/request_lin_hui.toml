reply = "我把“加半”两个字写得很小。她看了看，没说我写得难看，只说少加一半也是少，账上照样写一行。她把两行对了对，酬金数得干脆，数完把算盘拨回了零。"

[[tracks.chapters.choices]]
key = "let_her"
text = "这一行不好落笔，让她自己写。"
next = "done"
effects = [{ kind = "cash", value = 700 }, { kind = "affinity", person = "lin_hui", value = 3 }, { kind = "flag", flag = "c13_request_lin_hui_partial" }]
reply = "她哼了一声，把笔收回去，西班牙字写得又快又重，写完在“半”字底下划了一道。“下回再碰上他，”她说，“账摊得比这回大。”酬金放在桌沿上，她没有递过来，我自己伸手去拿。"
