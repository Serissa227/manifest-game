# C13d 人物的请托：女王的礼服（2026-10-18，Claude 写）。
# 标签：find（找东西，目标物 venice_carnival_dress）；T 当面（安特卫普紫罗兰修辞学会的排练房，auto=false，玩家“问请托”或 ask:request_mathijs 启动）。
# 人物：马蒂斯·佩特斯（mathijs，1540-10-01 生），紫罗兰修辞学会的少年演员，专演女角；cast 日程 1554—1590 年全程在安特卫普（1557 年起多在市场），求见门槛低。
# 窗口：报价 1563-01-01 至 1580-12-31（offer 的 deadline 为窗口止日，到期走 timeout，不写见闻）；handin 与 use 的 when 只写 alive，窗口由 offer 的接受决定。
# 依据·史实：安特卫普修辞学会（紫罗兰 Violieren）的演出传统，男演员扮女角，街上与广场搭台；威尼斯狂欢节的礼服与面具（items_outfit_01 的 venice_carnival_dress，有 italian 商店）。
# 依据·原创：马蒂斯的新戏（女王在宫门口等一封信，不写给谁）、裁缝照版画缝的大袖子礼服、学会的司库、台阶上的灯。
# 待核：16 世纪安特卫普修辞学会的服装置办与司库的权限只用传闻口吻，正文不写具体的账目。
# 秘密：马蒂斯把想对扬说的话写成台词、藏进没署名的戏里——本请托不碰：新戏的内容只写“女王在宫门口等一封信”，不写给谁、不写扬；见闻一律不写他的心事。
# 同学：C7 bond_mathijs 的 C 级以上只在 offer 的 variant 里出一句（转圈时挤眼）；C7 pair_mathijs_jan 的 c7_pair_mathijs_jan_together 只在 use 的 variant 里读，写“后台有人替他拎着裙摆”，不写名字。
# 读的旗标：c7_pair_mathijs_jan_together（use 与 use_half 的 variant，只读）；bond mathijs ≥ C（offer 的 variant）。
# 设的旗标：c13_request_mathijs_accepted / declined / treasurer / given / guild / half / done / partial。
# 依赖：无 B10b 改名（antwerp 为现有港口）；无主线门禁（c13_main_<主角> 未设，对所有主角一样）。
# 实现说明：（a）variants 只能换文字，不能换效果；“司库只付一半”的现金差与“容易谈价”的检定差，用 next 走到各自的章节：先说好的走 handin_agreed（容易检定），谈价失败走 use_half（只付一半）。
#           引擎审计里互斥的旗标门禁会报“准备后条件仍不满足”，所以不用旗标挡选项。treasurer / half 两面旗标只设不读，留作分支登记。
#           （b）检定失败的回复取自 fail 分支的 news，所以失败的那一句同时作为见闻写出（安特卫普，不写数字）。
# 缺省走向：offer 不在港里就一直挂着，到 1580-12-31 走 timeout（马蒂斯另找了人，无见闻）；handin 与 use 没有期限，玩家不交就停在待决队列。
# 回忆插画清单：
#   mem-request_mathijs-use（台阶上的女王；use 与 use_half 共用）：大广场的灯一盏盏灭，穿着威尼斯礼服的少年坐在石阶上，裙摆搭在膝头，一只手套放在身边。

