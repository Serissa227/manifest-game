# 三、改潮表：潮退之后。他要去找老领航们改表，问你那天的风向。
[[tracks.chapters]]
key = "report"
title = "改潮表"
text = "卡比尔听你报完时刻，跳起来，抓起潮表就要去找老领航们。走到栈桥中间，他又折回来，问你潮头到之前，风是什么方向。“南风？”“跟往常一样。”他张了张嘴，那三个字到了嘴边，又咽了回去。“这回不能怪风。”他把潮表往怀里一揣，“表就是错了，我要改。”他说完就走，走得太急，差点撞翻码头边晒鱼的筐。码头上的人看着他的背影，有人笑，有人摇头。"
