# 二、一堵墙：十天之后的大潮。沙漏才漏到一半，潮头已经到了木桩上。
[[tracks.chapters]]
key = "watch"
title = "一堵墙"
text = "你在湾口的沙岬上等了十天。白天晒着，夜里起雾，木桩上的盐结成一层白壳。卡比尔每天下午来一趟，看一眼日头，把铜沙漏倒过来，只说一句：“还早。”然后又走了。第十天天没亮，湾外起了一道白线，白线越来越近、越来越高，变成一堵墙，轰隆隆推进湾里，沙岬都在抖。他在后头喊：“来了！看它到哪根桩！”声音被潮声压散了。沙漏才漏到一半，潮头已经撞上第一根木桩，比旧表上写的早了半个时辰，一点不差。"
speaker = "captain"
mood = "mystic"
at = "khambhat"
when = [
  { kind = "date", from = [1563, 1, 1], to = [1590, 12, 31] },
  { kind = "alive", person = "kabir", value = true },
]
objectives = [
  { kind = "at", at = "khambhat", text = "在湾口的沙岬上等着" },
  { kind = "wait", days = 10, text = "等满十天" },
]
deadline_days = 60
timeout = { next = "failed", news = "坎贝湾口的沙岬上，大潮那天只有卡比尔一个人守着。潮头早了半个时辰，老领航们却说是风的缘故。", effects = [{ kind = "affinity", person = "kabir", value = -3 }, { kind = "flag", flag = "c13_request_kabir_late" }, { kind = "letter", person = "kabir", text = "大潮我自己守了，潮头早到，我说对了。可老领航们说，是那会儿起了风。——卡比尔" }] }
news = "坎贝湾口的沙岬上，有人守了十天，第十天大潮的潮头像一堵墙推进湾里，据说比旧潮表早了半个时辰。"

