# 请托：差了半个时辰的潮（request_kabir）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：卡比尔（kabir，1540-01-10 生，男），坎贝来的古吉拉特领航学徒，1557 年起回坎贝当领航员；身份档 1；cast：classmates_ship.toml。
# 类型：去某处（go）。四章：offer（报价）、watch（守大潮）、report（改潮表，记得粗的那两支）、report_exact（改潮表，记得准的那一支）；没有 stage 章。
#       结构说明：原稿 go_with 挂着 c13_request_kabir_exact 的旗标门禁，机器人审计要求门禁在到达该章的每条路径上都能满足，所以 mark_exact 单开 report_exact 一章，门禁去掉；hold_boat 与 just_watch 仍去 report，那里另给一个“陪他去，先说是大概”的选项。
# 报价：T 当面（auto=false）。人物按日程在坎贝（khambhat），玩家用 ask:request_kabir 启动；offer 不写 at，objectives 为在港里找到他。
#       窗口 1563-01-01 至 1590-06-30；offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：watch 章 at=khambhat，objectives 为在沙岬上等满十天；deadline_days=60，超时走 failed，来信一封（好感 -3，旗标 _late，见闻一条）。
#       report 与 report_exact 是普通章，没有期限，可以一直等。
# 依据·史实背景：坎贝湾的涌潮（潮头像一堵墙推进湾里），湾口淤浅，船靠潮表进出；古吉拉特的领航人用潮表与星表。涌潮与湾口的沙岬是史实背景。
# 依据·原创：卡比尔、他师傅传下来的铜沙漏、沙岬上的木桩、那一行被改过的旧潮表、两条被潮头撵回港的船。
# 依赖：港口 khambhat（ports_india.toml）；技能 tide_reading（skills.toml）；人物 kabir。B10b：卡比尔的日程 key cambay→khambhat 改名后，“问请托”才找得到他。主线门禁：无（卡比尔不是主线人物）。
# 读写旗标：读 bond kabir ≥ C（offer 变体）；写 c13_request_kabir_accepted / _declined / _bet / _exact（只写不读）/ _late / _done，另写分支旗标 _rough（守潮时沙漏掉水，或只凭眼看记下，report 读它换一句话）。不设任何 c7_ 旗标。
# 秘密：卡比尔的私事一概不写，见闻也不写。口头禅“风变了。”只在 offer 章说一次（base 与 bond_c 变体各一次）；report 章他咽回去，不再说出口。
# 报酬：现金最多 1250（report 一次）；好感最多 +13；名声 +1；技能 tide_reading +20（只一次）；回忆 mem-request_kabir-report。
# 回忆插画：mem-request_kabir-report：潮退后的湾口沙岬，木桩上挂着那本改过一行的旧潮表，铜沙漏放在一旁，远处两个老领航站着看。

[[tracks]]
key = "request_kabir"
name = "差了半个时辰的潮"
kind = "request"
start = "offer"
auto = false
cast = ["kabir"]

# 一、旧潮表：坎贝湾口的码头上。卡比尔摊开潮表，托你去沙岬守一个大潮。
[[tracks.chapters]]
key = "offer"
title = "旧潮表"
text = "坎贝湾口的码头上，卡比尔把一张发黄的潮表摊在木桩上，指甲点着其中一行：大潮那天，潮头该在这个时辰到。可这两年，有两条船照着这张表进湾，都被潮头堵在湾里，进退不得。“表差了半个时辰。”他说，“师傅的老领航们说我胡说。”他抬眼看你，把表卷起来，又摊开：“湾口沙岬上守一个大潮，记下潮头到的时刻。要是我错了……”他停了一下，“那会儿风变了。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "kabir", text = "在坎贝的码头找到他" }]
when = [
  { kind = "date", from = [1563, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "kabir", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

