# 二、空匣子：码头边税吏的草棚，案上一只新漆的空匣子，他要一个理由。
[[tracks.chapters]]
key = "persuade"
title = "空匣子"
text = "税吏的棚子搭在码头边上，草席顶，四面透风。他坐在一张矮案后头，案上摆着一只匣子，漆是新上的，里头垫着红绸，空的。他说贡数是上头定下的，册子上写多少就是多少；海女先自己分了再交，那叫欺上。我把那串绳子搁在案上。他看了一眼，没碰。“你替她们来，就给我一个理由。”他把匣盖合上，又掀开，“说不出来，明天我自己下滩去收。”"
