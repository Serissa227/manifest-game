# 请托：珠子怎么分（request_ko_haewol）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：高海月（ko_haewol，1535-03-14 生，女），济州出身的海女，1564 年起按日程在釜山（busan）的码头；身份档 0（平民），中风险。cast：cast/story_eastasia.toml。
# 类型：说服某人（persuade）。任务单写的是三章，文件里是五章：offer（报价）、persuade（税吏棚子里的空匣子）、result（按规矩谈成）、result_paid（垫了贡银）、result_partial（检定失败，税吏只少收两成）。
#   多出两章是引擎的限制：同一轨道里不能用 requires 去挡本轨道别的路上才设的旗标，所以 result 的两个 requires 选项（_rule / _paid）拆成三章，由 persuade 的 next 与 fail.next 分别送到；每章两个无 requires 的选项。
#   检定失败没有回复文字（引擎在失败时不显示 reply），失败后的情形写在 result_partial 的正文与 fail 的见闻里。
# 报价：T（当面）。auto=false，玩家“问请托”（ask:request_ko_haewol）启动；offer 章不写 at，objectives 为在港里找到她（她的日程 1564—1590 在釜山的码头）。offer 的 deadline 为窗口止日 1590-06-30，timeout 直接 failed，不写见闻。
# 窗口：报价 1566-01-01 至 1590-06-30；之后的章节 1566-01-01 至 1590-12-31（when 的日期条件，普通章不写 window）。persuade 进行中 deadline_days=30，超时走 failed：她来信一封、好感 -3、旗标 _late，另有一条超时见闻（章级见闻挪到 argue 选项上，免得超时也报“按规矩收了贡”）。
# 依据·史实背景：朝鲜王朝的海女（潜女）要向官府进贡鲍鱼、珍珠等海产，贡数由地方官按册征收，历来是海女的重负；济州海女也出陆到半岛南岸作业。海女在岸边用石墙围起的火塘（불턱）烤火、换衣、商量下水的事。
# 依据·原创：高海月、新来的税吏、打结计人的绳子、“救一回，多一颗”的分法、税吏的空匣子与红绸、剩下的那一颗珠子。
# 待核：釜山一带海女采珠的规模与贡额（正文不写数目，只写“全数”“两成”）。
# 秘密：cast 写着她藏了最好的几颗珍珠没交——全轨道不写、不暗示，也不写她手里有多少；见闻同样不写。
# C7：她与申景、真鹤、朴素月的线都在 1566 年以前或另有归属；本轨道 1566 年起，不写这三人，不写恋爱与心动，不用 relation/tie/bond/heart。
# 口吻：招呼语“哟，旱地人。想下水？先看我潜一回，数数我憋了多久。”全轨道只用一次，在 offer 正文；长哨只在 offer 正文写一次（回绝的回复里是一声短哨）。
# 读的旗标：无。不读 c7_ 旗标，无主线门禁（gate_main 与 variant_main 为空）。
# 设的旗标：分支 c13_request_ko_haewol_accepted（offer 接下）、_rule（persuade 按规矩谈成）、_paid（persuade 垫了贡银）；终局每条路只设一面：_declined（offer 回绝）、_late（persuade 超时）、_done（result）、_partial（result_paid 与 result_partial）。
# 报酬：最好的结局 cash 550、好感合计 +15（接下 2 + 下水 5 + 收尾 8）、名声 +1、回忆一幅；垫了贡银的路先付 300、收尾还 850（300 垫款 + 550）；检定失败的路付一半 300。
# 依赖：港口 busan（ports_east_asia.toml）；技能 diving（skills.toml）；属性 eloquence；人物 ko_haewol。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_ko_haewol-result「按结分的珍珠」：釜山南滩石墙围起的火塘边，一块湿麻布上摊着珍珠，旁边一串打满结的绳子，海月指间捏着最后一颗。

