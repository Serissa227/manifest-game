# 一、一个结一个人：釜山浦的南滩，高海月潜了一回，上岸说起新来的税吏。
[[tracks.chapters]]
key = "offer"
title = "一个结一个人"
text = "釜山浦的南滩，海女们的小船泊在礁石外头。高海月扶着船帮朝岸上看了我一眼：“哟，旱地人。想下水？先看我潜一回，数数我憋了多久。”她一翻身没进水里。我在岸上数，数过了一百，水面还是平的。忽然一声长哨从水上炸开，半个海湾都听得见，船上的女人跟着笑起来。她上了岸，坐进礁石后头那圈石墙围着的火塘边，一把一把拧头发，水顺着辫梢滴进沙里。她说，新来的税吏昨天在滩头贴了告示：今年的珍珠，全数交上去。“我们有规矩。谁潜的，谁在水下救过谁，珠子按这个分。交贡的那一份，也按这个出。”她把头发甩到肩后，“全数交，就是说规矩不算数。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "ko_haewol", text = "在港里找到她" }]
when = [{ kind = "date", from = [1566, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应去税吏那里，替她们把规矩讲清楚。"
next = "persuade"
reply = "她从腰上解下一串绳子递给我。绳上没穿珠子，只打着一排结，有大有小，有两个挨得特别紧。“一个结一个人。你给他数。”她把绳头在我手腕上绕了一圈，打了个活扣，“别弄丢了。这上头的人，一个也不许少。”"
effects = [{ kind = "affinity", person = "ko_haewol", value = 2 }, { kind = "flag", flag = "c13_request_ko_haewol_accepted" }]

[[tracks.chapters.choices]]
key = "ask_rule"
text = "先问她：在水下救过人的，多分几颗？"
next = "persuade"
reply = "“救一回，多一颗。”她说得很快，又补一句，“被救的那个，不少分。”她拿树枝在沙上划了两道，挨得很近，“去年秋天，西边礁石底下，一个托着一个上来的。”说完她才把那串打满结的绳子扔给我。绳子中间，两个结紧紧挨着，跟沙上那两道一样。"
effects = [{ kind = "affinity", person = "ko_haewol", value = 2 }, { kind = "flag", flag = "c13_request_ko_haewol_accepted" }]

[[tracks.chapters.choices]]
