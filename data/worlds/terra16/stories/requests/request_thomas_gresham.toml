# 账房里的天平（汇价动了）：他问你下回能不能再替他捎东西。问“抽了几成”只能问，他笑而不答。
[[tracks.chapters]]
key = "settle"
title = "账房里的天平"
text = "他把你请上交易所楼上的账房，门一关，外头的喧闹就矮了下去。桌上摆着一架小天平，铜盘擦得发亮。墙上英镑的牌价还停在前几天那一格上，他瞥了一眼，没说话。他往一头放了一枚金币，又放一枚，指针晃了两下才停。“金子要称，人话也要称。”他把一盒砝码推过来，又把账本翻到最后一页，用指甲点着一行数：“下回去伦敦，肯不肯再替我捎两箱不必报关的东西？”问完他才想起来倒酒，酒是温的，他自己没喝。"
cast = ["thomas_gresham"]
objectives = [{ kind = "person", person = "thomas_gresham" }]
speaker = "captain"
mood = "cheerful"
when = [{ kind = "alive", person = "thomas_gresham", value = true }]
deadline = [1563, 12, 31]
timeout = { next = "done", effects = [{ kind = "flag", flag = "c13_request_thomas_gresham_partial" }, { kind = "letter", person = "thomas_gresham", text = "我回伦敦了，账已经结清。下回来伦敦，找交易所的人报我的名字。格雷沙姆" }] }

[[tracks.chapters.choices]]
key = "weights"
text = "掂一掂那枚砝码，说下回再说"
next = "done"
effects = [{ kind = "affinity", person = "thomas_gresham", value = 3 }, { kind = "memory", memory = "mem-request_thomas_gresham-settle", title = "金蚱蜢的砝码" }, { kind = "flag", flag = "c13_request_thomas_gresham_done" }]
reply = "他把一枚砝码放进你手心，沉甸甸的，上面刻着一只金蚱蜢。你掂了掂，他又拿回去，收进盒子里。“下回来，先跟我说清楚船哪天靠岸。”"

[[tracks.chapters.choices]]
key = "ask"
text = "问他这一趟自己抽了几成"
next = "done"
effects = [{ kind = "flag", flag = "c13_request_thomas_gresham_partial" }]
reply = "他大笑，说你该去当税吏。砝码盒合上了，桌上那杯温酒也被他收了回去。"

