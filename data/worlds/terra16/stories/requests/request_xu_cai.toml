effects = [{ kind = "affinity", person = "xu_cai", value = 1 }]
news = "月港海澄县城边的小学塾里，新订的纸本裁歪了几刀，许采说歪的也能写，船户的名字就写在那一本上。"

[[tracks.chapters.choices]]
key = "just_deliver"
text = "只交了纸，契约的事让她来。"
next = "settle"
reply = "许采把借据重新拿起来，从头念给船户听，念得很慢，每念一句，就用指头点一下那一句。我在一旁把纸码好，一刀一刀，码到边角齐整。"
effects = [{ kind = "affinity", person = "xu_cai", value = 2 }]

# 三、名字：过几天再去学塾。
[[tracks.chapters]]
key = "settle"
title = "名字"
text = "过了几天我再去学塾，最前面那张桌子换了人，就是那个船户，坐得笔直，面前摊着一张粗竹纸。他一笔一笔写自己的名字，写到最后一笔，手一抖，拖出个长尾巴。他盯着那张废纸，没吭声。许采从桌边抽出一张新的，轻轻放在旧的上面。“再来。”她说，“先把自己的名字写会，别人就骗不了你一半。”他写了第二张，这一回名字齐整地立在纸上。他拿着它走到墙边，在许采替他写的那一个上面，一点一点，把自己的贴了上去。"
speaker = "captain"
mood = "tender"
cast = ["xu_cai"]
when = [{ kind = "alive", person = "xu_cai", value = true }, { kind = "flag", flag = "c13_request_xu_cai_lesson", value = false }]
objectives = [{ kind = "person", person = "xu_cai", text = "回学塾看看她" }]

[[tracks.chapters.choices]]
key = "watch_wall"
text = "看着那面墙。"
next = "done"
reply = "墙上二十几个名字，横平竖直，只有一个笔画粗了一圈，收笔还留着一点抖，是本人的笔迹。许采站在它旁边看了很久。“这是第一个。”她说，口气像在点名。货款和工钱她一文不少地付了，又从箱底抽出一刀纸，塞进我怀里：“这是多备的那份里剩下的。你船上也有人不识字吧？”"
news = "月港海澄县城边的小学塾，墙上头一个船户的名字换成了他自己写的，字粗了点，贴得牢牢的。"
