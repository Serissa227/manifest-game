# 二、差了一倍：科伦坡外海，季风刚过，水还混。
[[tracks.chapters]]
key = "sound"
title = "差了一倍"
text = "科伦坡外海，季风刚过，水还混成黄绿色。港口外那一处好测，礁北那一处浪大，船晃得厉害，图纸在海图桌上翻了两回，舵轮吱呀地响，没人说话。你站在舷边看了半天水色，没看出深浅。等船稳下来，礁南那一处的数先出来了，跟她图上估的差了一倍。"
speaker = "captain"
mood = "tense"
at = "colombo"
when = [
  { kind = "date", from = [1562, 1, 1], to = [1576, 12, 30] },
  { kind = "alive", person = "marta_lobo", value = true },
]
news = "科伦坡外海季风刚过，一条外乡船在礁边测了半天水深，测完往果阿去了。"
deadline_days = 150
timeout = { next = "failed", effects = [
  { kind = "affinity", person = "marta_lobo", value = -3 },
  { kind = "flag", flag = "c13_request_marta_lobo_late" },
  { kind = "letter", person = "marta_lobo", text = "我托一个锡兰人去测了，他测的数我不信。图还是空的那一段。" },
] }

