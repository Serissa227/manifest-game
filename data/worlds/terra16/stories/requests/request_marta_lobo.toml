# 请托：署自己名字的那张图（request_marta_lobo）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：玛尔塔·洛博（marta_lobo，1530-03-11 生，女），里斯本制图师的女儿，在果阿替商人画海图。cast：cast/story_europe.toml。
# 类型：混合（mixed）；六章：offer（报价）、sound（测水深）、inspect（上船查图）、draw（补图、对数）、sign（署名）、thin（数不全时的收尾，只有 partial 一路）。没有 stage 章，因此没有 window 与 default。
#   结构说明：原先 draw 的 check_all 靠旗标 _sounded 门禁、sign 的 sign_it 靠旗标 _guessed=false 门禁，审计机器人会报“准备后条件仍不满足”。
#   现改为：rough 或 hide 检定失败直接走新章 thin（rough 失败跳过上船查图与补图，直接到 thin）；check_all 改为持有测深锤，另加 check_chart（绘图 ≥ 60）；sign_it 不再有门禁。
# 报价：T（当面）。人物在果阿，auto=false，玩家“问请托”（ask:request_marta_lobo）启动；offer 不写 at，objectives 为在港里找到她。
#       报价窗口 1562-01-01 至 1576-06-30；offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：sound 章 deadline_days=150，超时走 failed，来信一封，好感 -3，旗标 _late。其余章是普通章，可以一直等；draw 章有 wait 20 目标。
# 依据·史实背景：葡萄牙人的海图保密政策（标准海图由国王的制图师掌管，私画外传有罪）；商馆的检查官上船查图（待核：检查官的权限写成传闻）。
# 依据·原创：玛尔塔的画室、锡兰西岸科伦坡南北一段的空图、三处水深、胡椒样品袋、航海日志里夹着的那一页、“署自己的名字”。
#       只写新画的那张锡兰西岸图；她偷抄的标准海图、王国标准海图的来历不写，不写骑士团、不写赫尔墨斯。
# 秘密：cast 没写秘密。本请托不碰玛丽亚的亲戚与仓库夹层；玛丽亚本人不出场，只在 draw 的 variant 里写楼上的算盘声。
# 口头禅：“看图可以，别伸手”，全轨道只在 offer 用一次（招呼语，放在她第一次开口的地方）。
# 读的旗标：c7_pair_marta_lobo_maria_da_luz_together（只读，draw 的 variant）。不设任何 c7_ 旗标。
# 写的旗标：c13_request_marta_lobo_accepted（offer 两条接法）、_declined（回绝）、_answered（inspect 让她自己上船）、_sounded（sound 测过或重画水深）、
#       _late（sound 超时）、_done（sign 署名）、_partial（sign 记号）。分支旗标 c13_request_marta_lobo_guessed（rough 测败或 hide 失败：数字凭记，只拿折中）。
# 门禁：lead 与 check_all 要求持有 sounding_lead；chart 与 check_chart 要求绘图 60；旗标 _sounded 与 _guessed 现在只设不读。
# 报酬：现金最多 1250（折中 800）；好感最多 +21；名声 +4（复合，折中 +2）；回忆 mem-request_marta_lobo-sign。无额外物品。
# 依赖：港口 colombo、goa（ports_india.toml）；人物 marta_lobo；属性 seamanship、eloquence（captain.toml）；技能 cartography（skills.toml）；物品 sounding_lead（items_instrument_01.toml）。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_marta_lobo-sign「背面写得很大的名字」：画室的桌子，一张图翻过来背面朝上，一支笔悬在纸上，墨滴洇成一小点。

[[tracks]]
key = "request_marta_lobo"
name = "署自己名字的那张图"
kind = "request"
start = "offer"
auto = false
cast = ["marta_lobo"]

# 一、标准海图上空着的那段：果阿的小画室，她把图摊开一角。
[[tracks.chapters]]
key = "offer"
title = "标准海图上空着的那段"
text = "果阿旧城的一间小画室，门口没有招牌。玛尔塔·洛博把一张没署名的图摊开一角，画的是锡兰西岸，科伦坡南北一段，标准海图上那一段是空的。她用两只铜镇纸压住图角，抬头看你：“看图可以，别伸手。你是哪家派来的？——算了，派来的人都说没人派。”她要三处水深：港口外，礁北，礁南。手指停在礁南那一处。“图画得比我父亲好，署的却一直是他的名字。这一张，我想写自己的。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "marta_lobo", text = "在港里找到她" }]
when = [
  { kind = "date", from = [1562, 1, 1], to = [1576, 6, 30] },
  { kind = "age", ge = 17 },
]
deadline = [1576, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应去科伦坡外海测三处水深。"
next = "sound"
reply = "她把三处的方位抄在一张纸上，字写得很小。抄完把图卷起来，卷得很紧，用一根红线扎住。"
effects = [
  { kind = "affinity", person = "marta_lobo", value = 2 },
  { kind = "flag", flag = "c13_request_marta_lobo_accepted" },
]

[[tracks.chapters.choices]]
