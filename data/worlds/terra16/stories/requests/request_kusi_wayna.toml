# C13d 请托：远航的绳（request_kusi_wayna）。中文，Claude 写。
# 人物：库西·瓦伊纳 kusi_wayna（1505-09-23 生，男）：印加的结绳记事官，从钦查下到卡亚俄的集市，只信绳上的数，不信纸上的数。
# 类型：混合（mixed）；6 章：offer → pickup → voyage → compare 或 compare_drift（海流分支，按 next 分流）→ epilogue；终点 done / failed。
#   brief 原为 5 章；compare 的“照海流说”选项需要 drift 旗标，而 drift 由 voyage 的两条路设置，按规则改为 next 分流，故加一章 compare_drift。
# 报价：到访（V），报价港 callao，auto = true；offer 章 when 为 1557-06-01..1582-06-30 且主角满 17；family c13_offer_callao，冷却 20 天。
# 进行中：pickup 章 120 天限期，超时走 failed 并寄信，不写见闻；voyage 章 300 天限期，超时同上。
# 地点：卡亚俄 callao（报价与对账）；阿里卡 arica（取绳与收尾）；远航目标 discovery wonder_galapagos，正文只写“黑石头的岛、比人还大的龟”。
# 依据：史实背景，图帕克·尤潘基远航大海的传说（萨缅托·德·甘博亚记录，史实中的传说）；1560—70 年代追查偶像的风气只作影子，不写机构名。
#   库西、远航的绳、阿里卡的驼队、绳上的结与数、船夫的儿子，全部原创。
# 读的旗标：无。不读 c7_ 旗标；不写瓦伊蕾（C7 的 1583—86 年线在本轨道窗口之后）。
# 设的旗标：c13_request_kusi_wayna_accepted（offer 接下的两条）/ declined（回绝）/ done（最好结局）/ partial（折中）/ late（超时）；
#   分支旗标 drift（voyage 的海流或量星，只用于 compare_drift 的分流）/ cut（pickup 的检定失败，书记剪断底下那根垂绳，compare 两章读它换文字）。
# 依赖：cast/story_americas.toml 的 kusi_wayna 与日程（1557 起在卡亚俄）；ports_americas.toml 的 callao、arica；
#   discoveries_wonder 的 wonder_galapagos；skills.toml 的 quipu、tide_reading、astral_navigation。
# 秘密：比尔卡班巴托他记的那份账全轨道不写；compare 章只写一根压在别的绳底下的短绳，他说“那根是别人的账”，不解释。
#   伊卡拆过远航绳的事属于伊卡，本轨道不碰远航绳上任何一个结的来历。
# 回忆插画清单：
#   mem-request_kusi_wayna-compare：席子上摊着一捆旧绳和一本航海日志，两样并排，绳尾新打的结压着一页纸角。

[[tracks]]
key = "request_kusi_wayna"
name = "远航的绳"
kind = "request"
start = "offer"
auto = true
cast = ["kusi_wayna"]

# 一、冒烟的岛：1557—1582 年间，主角在卡亚俄靠港，库西来问。
[[tracks.chapters]]
key = "offer"
title = "冒烟的岛"
text = "卡亚俄集市的角落，库西·瓦伊纳把一捆旧绳摊在膝上，一根一根理。理到一根，就用拇指捻一下，捻完才放回去。他从钦查的山谷下来，脚上是驼队的皮鞋，身边没有人。他没抬头就开了口：“图帕克·尤潘基远航大海的那串绳，还在库斯科一户亲戚家里。绳上记着往西几天，能见到冒烟的岛。”亲戚不敢走王家大道，要跟着运银的驼队，下到阿里卡。“你去接。接到了，照绳上的日数往西开一趟。回来以后，我们一个结一个结地对。”"
speaker = "kusi_wayna"
mood = "mystic"
at = "callao"
when = [{ kind = "date", from = [1557, 6, 1], to = [1582, 6, 30] }, { kind = "age", ge = 17 }]
deadline = [1582, 6, 30]
family = "c13_offer_callao"
family_cooldown_days = 20

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.choices]]
key = "accept"
text = "答应去阿里卡接绳，再照着它往西开。"
next = "pickup"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 2 }, { kind = "flag", flag = "c13_request_kusi_wayna_accepted" }]
reply = "他把膝上那捆旧绳卷好，从里面抽出一根短绳系在你的手腕上：“到阿里卡给他看这个，他就知道是我。”"

[[tracks.chapters.choices]]
key = "ask_cord"
text = "先问：绳上记的是日子，还是话？"
next = "pickup"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 2 }, { kind = "flag", flag = "c13_request_kusi_wayna_accepted" }]
reply = "“日子。话会走样，日子不会。”他从绳里抽出一根短绳，系在你腕上，“岛的名字没记，记名字的绳早烧了。”"

[[tracks.chapters.choices]]
key = "decline"
text = "往西开空海的事，你不接。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_kusi_wayna_declined" }]
reply = "他把绳卷好，不再看你，像这桩买卖从没开过口。"

# 二、驼鞍底下的布包：到阿里卡取绳。书记查货，三条路。
[[tracks.chapters]]
key = "pickup"
title = "驼鞍底下的布包"
text = "阿里卡码头上，驼队刚卸完货。一个赶驼的汉子认出你腕上的短绳，从驼鞍底下抽出一个布包，外面裹着麻，里面一层层都是绳。码头的书记正挨个翻驼队的包，要查有没有“拜偶像的东西”。汉子的手按在布包上，不肯松。“库西说，腕上有绳的，就是自己人。”书记走过来，伸手要解那捆麻。"
news = "阿里卡码头上，书记翻驼队的包翻到一捆绳，最后让一个外乡船长把它带走了。"
speaker = "captain"
mood = "tense"
at = "arica"
when = [{ kind = "alive", person = "kusi_wayna", value = true }, { kind = "date", from = [1557, 6, 1], to = [1582, 12, 31] }]
deadline_days = 120

[tracks.chapters.timeout]
next = "failed"
news = "阿里卡码头上，一个赶驼的汉子等了一个月，驼队又翻山回去了，说是在等一个外乡船长。"
effects = [{ kind = "affinity", person = "kusi_wayna", value = -3 }, { kind = "flag", flag = "c13_request_kusi_wayna_late" }, { kind = "letter", person = "kusi_wayna", text = "驼队在阿里卡等了你一个月，又回山里去了。绳在亲戚家，一个结也没少。" }]

[[tracks.chapters.choices]]
key = "talk_ledger"
text = "说这是商队的货账，船长要的。"
next = "voyage"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "kusi_wayna", value = 3 }]
reply = "书记翻开布包看了几眼，满眼的结，嘴里念叨着“记账的东西我不管”。"
fail = { next = "voyage", effects = [{ kind = "affinity", person = "kusi_wayna", value = -2 }, { kind = "flag", flag = "c13_request_kusi_wayna_cut" }], news = "阿里卡码头上，书记扣了一捆驼队的绳一夜，第二天还回来，绳尾少了一截。" }

[[tracks.chapters.choices]]
key = "read_numbers"
text = "当着书记的面，照结念出几笔数。"
next = "voyage"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "quipu", ge = 60, hard = true }]
hint = "结上的数你念不顺。要在绳边上坐过几个月，才念得出这种数。"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 5 }]
reply = "你一个结一个结念：三百，四十，又是七。书记跟着记了两行，嫌慢，把册子合上了。赶驼的汉子看你的眼神变了。"

[[tracks.chapters.choices]]
key = "pay_fee"
text = "替驼队交一笔“验货钱”。"
next = "voyage"
requires = [{ kind = "cash", ge = 200 }]
hint = "钱袋里的钱不够书记要的数。书记看了看你的袋子，摇头。"
effects = [{ kind = "cash", value = -200 }, { kind = "affinity", person = "kusi_wayna", value = 3 }]
reply = "书记收了钱，在驼队的单子上画了个勾。汉子把布包塞进你怀里，一句话也没说就牵着驼走了。"

# 三、晚了两天的岛：照绳上的日数往西北开。
[[tracks.chapters]]
key = "voyage"
title = "晚了两天的岛"
text = "照绳上的日数，从卡亚俄往西北开。第十天，海上什么也没有，只有一群一群的鸟从头顶过去，都朝北飞。第十二天黄昏，海平线上起了一缕烟，船靠上了一座黑石头的岛。岸边趴着比人还大的龟，一动不动。绳上记的是第十日，你的船上记的是第十二天。岛是真的，差了两天，要从日志里找原因。"
speaker = "captain"
mood = "mystic"
when = [{ kind = "alive", person = "kusi_wayna", value = true }, { kind = "date", from = [1557, 6, 1], to = [1582, 12, 31] }]
objectives = [{ kind = "discovery", discovery = "wonder_galapagos", text = "照绳上的日数往西北开，找到冒烟的岛" }]
deadline_days = 300

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "affinity", person = "kusi_wayna", value = -3 }, { kind = "flag", flag = "c13_request_kusi_wayna_late" }, { kind = "letter", person = "kusi_wayna", text = "你没往西开。绳我收回来了，下回给愿意开的人。" }]

[[tracks.chapters.choices]]
key = "log_drift"
text = "照实记下：晚两天，海流把船往北推了。"
next = "compare_drift"
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "每天的海流和船头偏了几度，你记不下来，记下来也对不上。水手说，这要在潮水里练过。"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 3 }, { kind = "flag", flag = "c13_request_kusi_wayna_drift" }]
reply = "你把每天的海流和船头偏了几度都记下来，记到第十二天，晚的那两天正好对上。"

[[tracks.chapters.choices]]
key = "star_fix"
text = "夜里量一次星，算出岛到底在哪。"
next = "compare_drift"
requires = [{ kind = "skill", skill = "astral_navigation", ge = 60 }]
