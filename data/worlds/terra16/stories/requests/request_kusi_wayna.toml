# 五、多出来的那根绳：回阿里卡，汉子问绳上新添的一根。
[[tracks.chapters]]
key = "epilogue"
title = "多出来的那根绳"
text = "下一回到阿里卡，那个赶驼的汉子已经在码头等着，骡子在边上嚼着干草，要把远航的绳带回山里。他把绳一层一层摊开给你看，手上的动作比上回慢。绳上多了一根新垂绳，是库西添的，结打得很密，比别的都短。汉子的指头按在那根上，说库西打这个结的时候，只说了一句：“这一根，回来的人再数。”汉子问你：“这根记的是什么？”"
speaker = "captain"
mood = "tender"
at = "arica"
news = "阿里卡码头上，赶驼的汉子把一捆绳摊在骡背上，说库西在上头添了一根新垂绳，结打得很密。"
when = [{ kind = "alive", person = "kusi_wayna", value = true }, { kind = "date", from = [1557, 6, 1], to = [1582, 12, 31] }]

[[tracks.chapters.choices]]
key = "tell_days"
text = "告诉他：那是这一趟的日子，从卡亚俄数起。"
next = "done"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 2 }]
reply = "汉子把新垂绳缠在手指上绕了三圈，说回去以后，绳是要传给下一个人的。"

[[tracks.chapters.choices]]
key = "say_nothing"
text = "说你也不知道，让他去问库西。"
next = "done"
effects = [{ kind = "affinity", person = "kusi_wayna", value = 1 }]
reply = "汉子笑了，说库西要是肯说，早在山里就说完了，用不着等你来问。"
