# 三、科钦的树皮：他要一味树皮，本地叫“库尔奇”。老药师不说话，你得自己开口或者自己尝。
[[tracks.chapters]]
key = "cochin"
title = "库尔奇树皮"
text = "他又托你去科钦的药市问一种树皮。马拉雅拉姆的药贩管它叫“库尔奇”，说能止痢、退热；他手里那块干巴巴的，颜色像陈年的茶梗，不知道是不是同一种。“去问，问它叫什么，怎么剥，怎么晒。别问药贩，药贩只会报价。”他把树皮塞进你手里，又补一句，“买对的，别买贵的。”科钦的药市挤在河边，腥气、香料和晒干的鱼混在一起。最里头坐着一个老药师，嚼着槟榔，嘴角一片红。他看你手里的树皮，不说话。"
