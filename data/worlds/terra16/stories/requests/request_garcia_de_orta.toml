mood = "cheerful"
at = "goa"
when = [{ kind = "alive", person = "garcia_de_orta", value = true }]
objectives = [{ kind = "goods", good = "camphor", qty = 5, at = "goa", text = "把樟脑（5）运到果阿" }, { kind = "person", person = "garcia_de_orta", text = "在港里找到他" }]
deadline_days = 300
