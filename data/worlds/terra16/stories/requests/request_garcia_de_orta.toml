# C13d 请托：同名不同物（request_garcia_de_orta）。中文，Claude 写。
# 人物：加西亚·达·奥尔塔 garcia_de_orta（1501 生，男；葡萄牙医生，果阿的诊所与药草园，身份档 2 学者，1568 卒）。
# 类型：混合（mixed）；5 章 offer → samples → cochin → back → epilogue。送货（樟脑 5 担，运到果阿）＋ 去某处（科钦药市问树皮）＋ 收尾。
# 报价：当面（T）。人物按日程在果阿（goa，trading_house），auto=false，玩家“问请托”（ask:request_garcia_de_orta）启动；offer 章不写 at。
# 窗口：报价 1557-03-01 至 1567-12-31（offer 的 deadline 即窗口止日，到期走 failed，不写见闻）；
#   樟脑交货进行中 300 天；科钦树皮 90 天；回果阿结账 120 天；书印出来后的收尾只到 1568-06-30。
# 依据·史实：奥尔塔《印度草药与药物对话》（Coloquios dos simples），1563 年果阿印行；书中分辨了婆罗洲与中国的樟脑。
#   库尔奇（kurchi）是科钦一带止痢退热的本地树皮，不写成金鸡纳（那是美洲的，晚一百年）。
#   1560 年宗教裁判所到了果阿（史实），正文只在 back 章的 1560 年以后变体里写一句影子，不写家人，不写机构细节，不进见闻。
# 依据·原创：科钦药市最里头嚼槟榔的老药师；果阿那块假树皮的染色；烧樟脑的铜盘；印歪的几页；“信了的人”之外的一句“不留名的人，话往往最准”。
# 货款：樟脑 5 担 × 基准价 100 × 1.25 = 625，按 50 取整取 600（按 brief）。
# 读的旗标：无（不读 c7_* 与 c13_main_*；本轨道没有主线门禁，对六位主角都说得通）。
# 设的旗标：c13_request_garcia_de_orta_accepted（offer 接下）/ declined（回绝，终局）/ late（超时，终局）/ done（结账，终局）；
#   分支：pointed_out、he_guessed（樟脑）、true_bark、half_answer（树皮）、named、healer_credited（结账）、book_to_healer（收尾）。
#   结构说明：back 的 credit_healer 原先 requires 旗标 true_bark，审计机器人会报“准备后条件仍不满足”；按 brief 本来就没有门禁，现已去掉（half_answer 的玩家带回的是老药师的一句话，也可以请他写进书里）。
# 依赖：B10b 日程与港口 goa、cochin_port（ports_india.toml 已有）；商品 camphor（goods/05_terra_trade.toml）；
#   物品 orta_goa（items/books_06_medicine.toml，唯一奖励）；技能 herbal_medicine（skills.toml）；人物 garcia_de_orta（cast/historical_03_indian_ocean.toml）。
# 避开 C7：不写里斯本（贝阿特丽丝线），不写玛尔塔与玛丽亚的线；cast 没有秘密字段，本请托不碰宗教与家人。
# 回忆插画清单：mem-request_garcia_de_orta-back，画面：书稿最后一页写着一位船长的名字，墨迹未干，旁边是一块烧黑的樟脑印。

[[tracks]]
key = "request_garcia_de_orta"
name = "同名不同物"
kind = "request"
start = "offer"
auto = false
cast = ["garcia_de_orta"]

# 一、报价：1557—1567 年间，玩家在果阿找到他，他要五担樟脑，还要一味树皮。
[[tracks.chapters]]
key = "offer"
title = "两种樟脑"
text = "果阿的诊所门口晒着一排药草。你进去的时候，加西亚·达·奥尔塔一手按着病人的脉，一手把一块樟脑举到窗前，头也不回。“坐，别碰那块。”他说话比手快，“阿维森纳说樟脑只有一种，胡说。名字一样，东西未必一样。婆罗洲出的一种，中国的又是一种，我拿鼻子就闻得出来。”病人被他打发走，他才转过身，上下打量你的手：“从东边来的？替我跑一趟，要五担樟脑。码头上问清楚是哪个港买的，那一批我闻了就知道是哪一种。”"
speaker = "garcia_de_orta"
mood = "cheerful"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1557, 3, 1], to = [1567, 12, 31] }]
objectives = [{ kind = "person", person = "garcia_de_orta", text = "在港里找到他" }]
deadline = [1567, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "take"
text = "接下，去东边带五担樟脑来。"
next = "samples"
reply = "他把病人打发走，在一张纸上画了两块樟脑的样子，一块像冰糖，一块像盐。“带来了，我烧给你看哪块是哪块。钱的事你自己跟管事说，我只认货。”"
effects = [{ kind = "affinity", person = "garcia_de_orta", value = 2 }, { kind = "flag", flag = "c13_request_garcia_de_orta_accepted" }]

[[tracks.chapters.choices]]
key = "ask_avicenna"
text = "接下，但问：阿维森纳要是对的呢？"
next = "samples"
reply = "“那我就在书里认错。”他说得飞快，“认错也是一章，我还要把错的那一段抄给你看。可他不对——他没见过婆罗洲，我见过。”"
effects = [{ kind = "affinity", person = "garcia_de_orta", value = 2 }, { kind = "flag", flag = "c13_request_garcia_de_orta_accepted" }]

[[tracks.chapters.choices]]
