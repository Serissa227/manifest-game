effects = [{ kind = "flag", flag = "c13_request_garcia_de_orta_declined" }]

# 二、交樟脑：他在铜盘上烧两种樟脑，问你是哪个港买的。三种交法，都交出五担。
[[tracks.chapters]]
key = "samples"
title = "烧给你看"
text = "樟脑摆在他的桌上，一排灰白的块子，有的亮，有的碎。他掰下一小块凑到鼻子底下闻，又点一块放在铜盘上烧，烟一起来，屋里全是凉丝丝的气味。学徒捂着嘴往窗边躲。“你这批是哪个港买的？”他的眼睛盯着烟，手却在碎屑里扒拉，“婆罗洲的块儿大，结得亮；中国的碎，烧起来发甜。我闻了二十年药，没闻错过一回。商人要是混着卖，我可不替他们背锅。”"
