# 五、果阿印的书：1563 年印出来，他拿一本给你，翻到印歪的那几页。
[[tracks.chapters]]
key = "epilogue"
title = "果阿印的书"
text = "书印出来了，是果阿的印书坊印的，纸有点黄，有几页的字印歪了，油墨在角上晕开。奥尔塔拿着一本走到你跟前，翻到写樟脑和树皮的那几页，手指点着一行一行往下看。“印歪的那几页，我最喜欢。”他说，“错字都在里头，印的时候没人发现。等后来的人骂我，就从那几页骂起。”他把书合上，用拇指在书口上蹭了一下，蹭下一点油墨。"
speaker = "garcia_de_orta"
mood = "tender"
when = [{ kind = "alive", person = "garcia_de_orta", value = true }, { kind = "date", from = [1563, 4, 10] }]
objectives = [{ kind = "person", person = "garcia_de_orta", text = "在港里找到他" }]
deadline = [1568, 6, 30]
timeout = { next = "done", effects = [{ kind = "letter", person = "garcia_de_orta", text = "书印出来了，你没来取。我托下一条去科钦的船，把那一本带给了老药师。" }] }

[[tracks.chapters.choices]]
key = "accept"
text = "收下这本书。"
next = "done"
reply = "他在扉页上写了一行字，写完又划掉一半。“剩下的那半句才是真话，”他说，“你自己猜去。”"
effects = [{ kind = "item", item = "orta_goa", qty = 1 }]

[[tracks.chapters.choices]]
key = "send_healer"
text = "请他把这本送给科钦的那位老药师。"
next = "done"
reply = "他愣了一下，笑了：“他不识葡萄牙字。”可他还是把书包好，在封皮上写下科钦的地名，托下一条去科钦的船带去。“他要是看不懂，就拿去垫药碾子。”"
effects = [{ kind = "affinity", person = "garcia_de_orta", value = 2 }, { kind = "flag", flag = "c13_request_garcia_de_orta_book_to_healer" }]
