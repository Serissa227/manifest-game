# 收尾（打赢或逼回）：她递来皮酒壶，按船上的事说一句。
[[tracks.chapters]]
key = "after"
title = "黑帆下的酒壶"
text = "过了些日子，那条黑帆小艇又泊在戈尔韦的浅滩上。她递过来一只皮酒壶，壶口缠着一圈旧绳，绳结是克卢湾的渔户打的。“爱尔兰的烧酒，比英格兰人的火药还烈。”她笑着，短发在风里一翘一翘的。壶里的酒晃得响，是今早刚灌的，她把壶口对着你，又收回去，自己先灌了一口，才把壶推过来。港里的人说，她这些年拦下的船，数都数不清。"
speaker = "grace_omalley"
mood = "cheerful"
at = "galway"
when = [{ kind = "alive", person = "grace_omalley", value = true }]

[[tracks.chapters.variants]]
key = "fought"
when = [{ kind = "flag", flag = "c13_request_grace_omalley_fought" }]
text = "过了些日子，那条黑帆小艇又泊在戈尔韦的浅滩上。她递过来一只皮酒壶，壶口缠着一圈旧绳，绳结是克卢湾的渔户打的。“你的炮手是哪里人？”她问，眼睛盯着的是你的船舷。“炮打得那么准，我的人想知道是谁教的。”你还没答，她已经笑出了声，说那一炮要是打中了，这船粮食就只能进鱼肚子，她可舍不得。她伸手摸了摸船舷上新添的一道刮痕，说这一道不记账。"

[[tracks.chapters.variants]]
key = "turned"
when = [{ kind = "flag", flag = "c13_request_grace_omalley_turned" }]
text = "过了些日子，那条黑帆小艇又泊在戈尔韦的浅滩上。她递过来一只皮酒壶，壶口缠着一圈旧绳，绳结是克卢湾的渔户打的。“你的船比我想的快。”她说，把酒壶在手里掂了掂，“我的船要是有你的船一半快，英格兰人的桅杆早就断了。”她不谢你，只把壶口朝你这边转了一下，像是在说：喝吧。她先喝了一口，把壶底朝天给你看，壶里还剩半口，她说那是给你留的。"

