# 请托：拦下补给船（request_grace_omalley）。Claude 写（C13d，2026-10-18），仅中文。
# 人物：格蕾丝·奥马利（grace_omalley，1530 生、1603 卒），梅奥奥马利家的女儿，克卢湾的海上女首领。
# 类型：打一仗（fight）。主线四章：offer（报价）、battle（打退护航）、shadow（贴上去逼回港）、after（收尾）；
#       另有两个收尾章：after_bribe（花钱，partial）、after_missed（没拦住，failed）。
#       收尾拆成三章而不是一章加 requires 选项：带 requires 的版本会把被挡住的选项全部列出，一章只放得下两三个。路线由 next 决定。
# 报价：V（到访）。戈尔韦（galway）城外的浅滩，auto=true；窗口 1574-01-01 至 1577-06-30；
#       名声门槛 20；family=c13_offer_galway，冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 依据·史实：1574 年英格兰人从戈尔韦出兵围攻她在克卢湾的罗克弗利特城堡，被她击退（约年，正文只写“城堡还在”，不写战事经过，不定结果）。
#       1577 年她在利默里克被关押，不写。1574 年下半年以后的报价用 variant late，只说“又来了”。
# 依据·原创：补给船与护航小船、黑帆小艇、皮酒壶与旧绳、戈尔韦浅滩上的会面、一句带过的过路钱。
#       秘密：无单列秘密。拦船收钱、劫掠商船一事只在 offer 与 after 里各说一句，不洗白，见闻不提。
# 读写的旗标：写 c13_request_grace_omalley_accepted（offer 三条接法）、_fought（battle 两条）、_turned（shadow 成功）、
#       _late（battle 超时）、_done（after）、_partial（after_bribe）、_failed（after_missed）。
#       读 _fought / _turned（after 的 variant 换她那句话）。分支旗标另设 _bribe（花钱）与 _missed（shadow 失败）；终局旗标 _done / _partial / _failed 各只设一面。不读外部旗标，不设 c7_ 旗标。
# 依赖：港口 galway、人物 grace_omalley、势力 irish_lords / england 均已存在；不依赖 B10b 改名。
#       与 C7 无交叉：不写艾希林·奥弗莱厄蒂、彼得与海图。
# 回忆插画：mem-request_grace_omalley-after：戈尔韦城外浅滩，一条黑帆小艇，船舷上短发的女人递出皮酒壶。

[[tracks]]
key = "request_grace_omalley"
name = "拦下补给船"
kind = "request"
start = "offer"
auto = true
cast = ["grace_omalley"]

