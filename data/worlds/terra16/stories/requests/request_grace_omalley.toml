speaker = "grace_omalley"
mood = "tense"
at = "galway"
when = [
  { kind = "age", ge = 17 },
  { kind = "date", from = [1574, 1, 1], to = [1577, 6, 30] },
  { kind = "alive", person = "grace_omalley", value = true },
  { kind = "fame", ge = 20 },
]
