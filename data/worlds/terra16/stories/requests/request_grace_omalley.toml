# 花钱的路线：船主病了一个月，她来算账。
[[tracks.chapters]]
key = "after_bribe"
title = "病倒的船主"
text = "一个月过去，那条黑帆小艇从港口那边摇过来，在浅滩边上停住。她朝港口的方向歪了歪头，侧耳听了听那边的钟声，说船主家又请了一个大夫，第三个了。“船主真的病了，躺在床上起不来。他喝的是我送去的酒，烈得能放倒一头牛。”她说完先笑，递过来一只皮酒壶，壶身被摸得油亮。“这一个月的粮，一袋也没出港。账我记在船上，哪天你缺一条船，报我的名字。”"
speaker = "grace_omalley"
mood = "cheerful"
at = "galway"
when = [
  { kind = "wait", days = 30 },
  { kind = "alive", person = "grace_omalley", value = true },
]

[[tracks.chapters.choices]]
key = "drink"
text = "接过酒壶喝一口"
next = "done"
reply = "你喝下去，脸一下子红到耳根。她拍着船舷笑个不停，笑完才擦着眼角说：“让船主躺在床上，比让他挨刀省事。钱花在这种地方，我没看走眼。”她的笑声在浅滩上传得很远。"
news = "戈尔韦港的一条粮船，船主病倒了一个月，粮袋没能出港。嘴上都说是喝坏了肚子，没人愿意细问。"
effects = [
  { kind = "affinity", person = "grace_omalley", value = 4 },
  { kind = "fame", value = 3 },
  { kind = "flag", flag = "c13_request_grace_omalley_partial" },
]

[[tracks.chapters.choices]]
key = "next"
text = "问她下一回还有没有这样便宜的仗"
