effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "khadija_rihla", value = 8 }, { kind = "fame", value = 1 }, { kind = "skill", skill = "cartography", value = 20 }, { kind = "flag", flag = "c13_request_khadija_rihla_done" }, { kind = "memory", memory = "mem-request_khadija_rihla-report", title = "淡黄里的五个圆点" }]

