# 三甲（向导讲的那一路，设了 _guide）：她的笔停在第五口井上，问你讲的人是谁。
[[tracks.chapters]]
key = "report"
title = "写上他的名字"
text = "哈迪贾一条一条往图上誊。墨是从货栈账房里借来的，笔杆上缠着一截布，写久了手心会出汗，她就在裙子上擦一擦。淡黄的那一片里多了五个小圆点，每个圆点旁边一个井名、一户人家、一个讲的人。誊到第五口井，她停下笔问你：“这一条，是领队讲的，还是向导？”她说：“这一段，得在家里问起之前画完。”说完没解释，低头接着写。"
speaker = "captain"
mood = "cheerful"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan" }]
when = [{ kind = "alive", person = "khadija_rihla", value = true }]
news = "得土安一家货栈的后屋里，一张图往南多画了五口井，每口井旁都写着是谁讲的。"

