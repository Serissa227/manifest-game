# 二、领队与向导：盐队歇在萨累城外，领队讲井，向导只在第五口井开口。
[[tracks.chapters]]
key = "arrive"
title = "领队与向导"
text = "盐队歇在萨累城外，盐板一块块码成墙。领队是个嗓门很大的老商人，讲起井来头头是道。可他每讲一口井，都要回头看一眼蹲在骆驼边的年轻向导，向导点头，他才往下讲。讲到第五口井，领队摆摆手：“那口井早就没人了。”向导第一次开口，说得很慢：“那里住着一家人，井是这家人挖的。”"
speaker = "captain"
mood = "mystic"
at = "sale"
objectives = [{ kind = "at", at = "sale" }]
when = [{ kind = "alive", person = "khadija_rihla", value = true }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "khadija_rihla", value = -3 }, { kind = "flag", flag = "c13_request_khadija_rihla_late" }, { kind = "letter", person = "khadija_rihla", text = "盐队又南下了。我没去成萨累，只从路过的脚夫嘴里听来两口井，名字没听清。——哈迪贾" }], news = "萨累城外的盐队在城下歇了一季，没等来那个要记井的外乡人，还是南下走了。" }
news = "萨累城外的盐队里，一个年轻向导讲了一夜的井，外乡人在旁边一条条记。"

[[tracks.chapters.choices]]
key = "ask_guide"
text = "请向导自己讲，从第一口井讲起。"
next = "report"
check = { attr = "eloquence", base = 20, per = 7 }
reply = "向导讲得很慢，每口井都说了井边的人家叫什么、养什么、哪一年井干过。我在每一条后面写上他的名字，不写领队的。"
effects = [{ kind = "affinity", person = "khadija_rihla", value = 3 }, { kind = "flag", flag = "c13_request_khadija_rihla_guide" }]
fail = { next = "report_partial", effects = [{ kind = "affinity", person = "khadija_rihla", value = -2 }, { kind = "flag", flag = "c13_request_khadija_rihla_one" }] }

[[tracks.chapters.choices]]
