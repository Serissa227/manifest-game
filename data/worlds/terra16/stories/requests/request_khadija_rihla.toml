# 请托：井边住着谁（request_khadija_rihla）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：哈迪贾·里赫拉（khadija_rihla，1540-06-25 生，女），非斯商队人家的女儿，学院同学（在非斯隔着帘子旁听讲席）；势力 morocco，身份档 1。cast：cast/classmates_custom_fez_scholar.toml。
# 类型：去某处（go）。三章起的分支：offer（报价）、arrive（领队与向导）、report（写上他的名字，向导讲的那一路）、report_partial（名字记不全的那一路）。普通章不写 stage，因此没有 window 与 default；到期只走 timeout。
# 报价：V（到访）。哈迪贾的家在得土安（tetouan），她随家里的货下到港口，auto=true；窗口 1564-01-01 至 1568-12-31（同学的重逢在 1563 年非斯，之后才开放）。offer 写 family=c13_offer_tetouan、冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：arrive 在萨累（sale）等盐队，deadline_days=90，超时走 failed，来信一封，好感 -3，旗标 _late；report 与 report_partial 是普通章，可以一直等。
# 日程提示：cast 把她的日程定在非斯（1554—1572）。本文件里她不出城，报价与收尾都在得土安的货栈，只靠 offer 的 at 与她开口。整合时若要她在得土安现身，改 cast 日程；本文件不依赖它。
# 依据·史实背景：马格里布到廷巴克图的盐金商路（塔阿扎的盐、沿途的井）；盐队从萨累一带南下，驼队里总有一两个认得每口井的人。待核：萨累盐队的编成与具体路线，正文一律用传闻口吻。
# 依据·原创：哈迪贾的图与“谁讲的”的规矩；领队与向导（叙事人物，不进 cast）；五口井与其中那一户人家。井名与人家都是虚构的，不对应任何实有的井。
# 秘密：怕家里叫她别念了，回去守货栈。只在 report 留一句影子（“家里问起之前”），不解释，不进见闻。
# 读的旗标：bond khadija_rihla 至少 C（offer 的 variant）；c13_request_khadija_rihla_one（report_partial 的 variant）。
# 设的旗标：c13_request_khadija_rihla_accepted（offer 两条接法）、_declined（offer 回绝）、_guide（arrive 向导讲，或用阿拉伯话周旋）、_one（arrive 向导的检定失败）、_late（arrive 超时）、_done（report 写向导的名字）、_partial（名字记不全，两条路都设）。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果；不写塔拉、吉达、坎贝、游记。
# 报酬：现金最多 1250（名字记不全 800），arrive 的 tea_dates 付 100 作代价；好感最多 +13；名声 +1；技能 cartography +20（两种结局都给，只一次）；回忆 mem-request_khadija_rihla-report。不发物品。
# 依赖：港口 tetouan、sale（ports_north_africa.toml）；技能 cartography、lang_arabic（skills.toml）；人物 khadija_rihla。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_khadija_rihla-report「淡黄里的五个圆点」：货栈后屋的案上，图往南的一片淡黄里多了五个小圆点，每个圆点旁写着井名、人家与讲的人。

[[tracks]]
key = "request_khadija_rihla"
name = "井边住着谁"
kind = "request"
start = "offer"
auto = true
cast = ["khadija_rihla"]

# 一、一大片没人说过的地方：得土安的货栈后头，她的图摊在案上。
[[tracks.chapters]]
key = "offer"
title = "一大片没人说过的地方"
text = "哈迪贾在得土安的货栈后头摊开她的图。北边密密麻麻，每条路旁都写着是谁讲的，字小得要凑近了看。往南过了阿特拉斯，就只剩一大片淡黄。她用指尖点着那一片，说：“图上空着的地方，也有人在过日子。”一支盐队刚从南边回到萨累，她家里不许她出城，跟驼队的人说一句话也要先过家里的门。她托你去听领队讲：路过哪几口井，井边住着谁，每一条都要记下是谁说的。“你只管去听，回来我再问你。”"
speaker = "captain"
mood = "tender"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan" }]
when = [{ kind = "date", from = [1564, 1, 1], to = [1568, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "khadija_rihla", ge = 18 }]
deadline = [1568, 12, 31]
timeout = { next = "failed" }
family = "c13_offer_tetouan"
family_cooldown_days = 20

[[tracks.chapters.variants]]
