next = "done"
news = "堺北庄米商家的女儿进宫的事没了下文，京里的青侍后来又来过几回，再没提起荐书。"
reply = "青侍照着记了，荐书也带回了京里。回信只有一行：“改日再看。”此后青侍隔几个月来一趟堺，问的都是别的事，米商家托人去打听，只得回一句“快了”。北庄那户人家的字帖，后来又抄满了两本。"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "hirohashi_yasuko", value = 2 }, { kind = "flag", flag = "c13_request_hirohashi_yasuko_partial" }]
