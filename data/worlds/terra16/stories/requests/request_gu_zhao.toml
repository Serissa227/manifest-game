text = "你的帆升到一半，三条倭船就看穿了，调头压过来，没一条往沈家门去。一场硬仗打下来，舟山外头起了雾，倭船贴着岛脚走，桅尖时有时无。你打退的那条挂着破帆往东逃，另两条跟着散进了雾里。水面上漂着一条渔船，船头画的那只眼睛被刀劈掉了半边，网还拖在水里，船上有两个人，一个趴在舵上，一个抱着桅杆根，谁也没出声。"

[[tracks.chapters.choices]]
key = "rescue"
text = "先靠上渔船，把那两个人救起来。"
