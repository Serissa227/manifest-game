# 三、写你看见的：回到宁波，营房里的战报。
[[tracks.chapters]]
key = "after"
title = "写你看见的"
text = "宁波的营房里点着一盏油灯，顾昭坐在案前写战报，一个字一个字地落，写岔了就把整页重抄。写完他把纸推过来。上头有你追出去的那一段：“追敌十余里，雾失。”他没把“失”字改成别的。底下是：“倭船三，击退一，散二。哨船救渔民二。”“写你看见的。”他说，“顾某写的，你要是觉得不对，就别签。”"
speaker = "captain"
mood = "tender"
at = "ningbo"
when = [{ kind = "alive", person = "gu_zhao", value = true }, { kind = "date", from = [1562, 1, 1], to = [1566, 6, 30] }]
news = "宁波的营房里，台州营的顾把总熬了半夜写战报，一个字一个字地写，写完先给外乡船长看。"

[[tracks.chapters.variants]]
key = "v1_ambush"
when = [{ kind = "flag", flag = "c13_request_gu_zhao_ambush" }]
text = "宁波的营房里点着一盏油灯，顾昭坐在案前写战报，一个字一个字地落，写岔了就把整页重抄。写完他把纸推过来。上头是：“倭船三，诱入伏中。沈家门海面，当日无渔船被劫。”他指着前四个字：“这四个字，顾某是替你写的。想了一夜，总不能写外乡船绕了个圈。写你看见的，你要是觉得不对，就别签。”"

[[tracks.chapters.variants]]
key = "v2_rescued"
when = [{ kind = "flag", flag = "c13_request_gu_zhao_rescued" }]
text = "宁波的营房里点着一盏油灯，顾昭坐在案前写战报，一个字一个字地落，写岔了就把整页重抄。写完他把纸推过来。上头是：“倭船三，击退一，散二。救渔民二。”渔民的名字他问了两遍才写，一个姓陈，一个只有小名阿满，这几个字压得比别处都重。“写你看见的。”他说，“顾某写的，你要是觉得不对，就别签。”"

