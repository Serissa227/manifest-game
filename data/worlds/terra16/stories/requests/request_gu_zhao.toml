effects = [{ kind = "affinity", person = "gu_zhao", value = -3 }, { kind = "letter", person = "gu_zhao", text = "三条倭船入秋就散了，又劫了两条渔船。顾某答应渔户的话，今年没做到。" }, { kind = "flag", flag = "c13_request_gu_zhao_late" }]

[[tracks.chapters.variants]]
