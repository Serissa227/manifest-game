# 逼：汤都外的海湾，落潮的沙洲。读潮的人稳，抢风的人险。
[[tracks.chapters]]
key = "shoal"
title = "汤都外的沙洲"
text = "汤都外头的海湾浅，落潮时沙洲一片片露出来，灰白灰白的，像趴了一湾子的牛。过了半夜，那条运米的船果然贴着岸来了：不点灯，帆只升了一半，船头站着个人，手里的长竹竿不住往水里探——他认得这里的水道。竹竿每探一回，你的船就在黑里多等一回。要让它搁下，只能把它从水道里逼出去，逼向那片刚露出来的沙。"
speaker = "captain"
mood = "tense"
at = "tondo"
when = [{ kind = "alive", person = "wang_wanggao", value = true }]
objectives = [{ kind = "at", at = "tondo", text = "到汤都外的海湾守夜" }]
deadline_days = 60
timeout = { next = "failed", effects = [
  { kind = "flag", flag = "c13_request_wang_wanggao_late" },
  { kind = "affinity", person = "wang_wanggao", value = -3 },
] }

[[tracks.chapters.choices]]
key = "tide"
text = "算准落潮，把它逼上沙洲"
next = "report"
reply = "你不动，等潮。潮水一寸一寸地退，你数着船舷上的刻痕，等到那根竹竿探不到底了，才放帆压过去。它想转舵，船底已经吃了沙，斜斜地搁在那儿，帆还鼓着，船身却纹丝不动。船上的人跳下水，涉着水往北跑了，一路喊的是闽南话。"
news = "汤都外的海湾里，夜里运米的船在落潮时搁上了沙洲，船上的人涉水跑了。听说是被一条外来的船算准了潮，逼上去的。"
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "你分不清哪片沙是在退、哪片是在涨，这一夜赌不起。"
effects = [
  { kind = "affinity", person = "wang_wanggao", value = 3 },
  { kind = "flag", flag = "c13_request_wang_wanggao_shoal" },
]

[[tracks.chapters.choices]]
key = "wind"
text = "抢上风，硬逼过去"
next = "report"
reply = "你抢到它的上风，船头几乎擦着它的舷，逼得它没处转身。它的舵手一把推死了舵，船头一歪，扎进沙里，桅杆晃了三晃才站住。船上的人翻过船舷，一个接一个跳进黑水里，没人回头。"
news = "汤都外的沙洲上，夜里一条运米的船被一条外来的船抢了上风，船头扎进了沙里。第二天渔户划去看，船已经空了，只剩半袋米。"
