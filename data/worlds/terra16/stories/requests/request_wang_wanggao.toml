next = "report"
reply = "你把米袋一袋袋扛到村头的空地上。一个老汉抓起一把米，看了又看，放进嘴里咬了一下，才信是真的；他身后的人谁也不敢往前站。后来听说，王把总知道了，嘟囔一句“便宜了番人”，倒也没说别的。"
effects = [
  { kind = "affinity", person = "wang_wanggao", value = 3 },
