# 禀帖：他已经写好了“击沉贼船一艘，斩获无算”。实报，或由他去写。
[[tracks.chapters]]
key = "report"
title = "禀帖"
text = "你找到王把总的时候，他正趴在桌上给上司写禀帖，一句一念，念到得意处，笔尖在纸上顿出个墨点。桌角压着你带来的那张收条，只有你的船名，没有水寨的字号，他看一眼，皱一下眉。“来，你说说。”他头也不抬，“截下来的那条船，多大？船上几个人？”不等你开口，他把禀帖转过来，上头已经写着：击沉贼船一艘，斩获无算。“上司最爱看这个‘无算’。”"
