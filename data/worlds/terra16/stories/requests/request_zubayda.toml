# 1565 年以后 · 头一页：收尾。好结局的两个选项分别给现金、好感与名声，并写回一条回忆。
[[tracks.chapters]]
key = "result"
title = "头一页"
text = "库房门外的码头边，祖贝达接过诗集，先不看书，看单子。她把单子对着光翻过来又翻过去，满意了，才翻开书。“缺哪页，先写在头一页上。”她从袖子里抽出自己的笔，在头一页写下一行：“某年某月，亚历山大港海关扣三日，查无缺页。”写完吹干，她把书合上，拿给你看字迹的一角：墨是新的，纸边却已经被税吏的手指捻得发毛。"
speaker = "captain"
mood = "cheerful"
at = "alexandria"
