[[tracks.chapters.choices]]
key = "help_her"
text = "接下，替她去跟税吏谈。"
reply = "她把那箱书的清单塞给我，每一本后面都写着缺页：第三本缺七页，第九本缺扉页。被扣的那一本，什么也不缺。“你替我跑一趟，就把这张单子带去，一个字也别改。”"
next = "persuade"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "flag", flag = "c13_request_zubayda_accepted" }]

[[tracks.chapters.choices]]
key = "ask_lines"
text = "接下，先问她：书里到底有什么话？"
reply = "“一首骂酒馆老板的诗，骂得好。”她说完自己笑了，又板起脸，说好不好不归税吏管。她把扣押单翻过来，背面一个字也没有。"
next = "persuade"
effects = [{ kind = "affinity", person = "zubayda", value = 2 }, { kind = "flag", flag = "c13_request_zubayda_accepted" }, { kind = "flag", flag = "c13_request_zubayda_asked" }]

[[tracks.chapters.choices]]
key = "decline"
text = "海关的事，劝她算了。"
reply = "她把扣押单叠成一小块塞进腰带，说她自己会天天来。这一天她没走，在库房门口站到天黑，一句话也不再跟税吏说。"
next = "failed"
