text = "亚历山大港海关的书箱库房门口，你撞见开罗书商的小女儿。她从袖子里抽出一页书目递给你，说：“你认得我家的规矩，缺页写在头一页。”她另一只手里还攥着扣押单，上面只写了“诗集一部，内有不宜之语”。门里的税吏说，一个卖书的女人管不着官府的单子，门随即关上。她把单子展开给你看：“书要回来，我认。扣也行，缺了哪几页、为什么扣，一样一样写明。”"

# 1565 年以后 · 三天后库房重新开门：税吏的桌子。普通章，没有缺省分支；三天的等待是目标，不是窗口。
[[tracks.chapters]]
key = "persuade"
title = "税吏的桌子"
text = "三天后库房重新开门。税吏的桌上摊着那本诗集，他用一根细木棍点着一行字，说这首诗讥讽官人，不能放。其实他认不得这首诗的出处，只是有人跟他说过这种书不能放行。桌角压着一摞他没写完的扣押单，最上面那张只写了一半。祖贝达站在门外没进来，隔着门说：“别跟他吵。他要的是一句能写进单子里的话。”税吏听见了，把木棍在桌上敲了两下，没回头。"
speaker = "captain"
mood = "tense"
at = "alexandria"
when = [
  { kind = "alive", person = "zubayda", value = true },
  { kind = "date", from = [1565, 1, 1], to = [1590, 2, 24] },
]
objectives = [{ kind = "at", at = "alexandria", text = "在库房门口等三天" }, { kind = "wait", days = 3 }]
news = "亚历山大港海关的库房里，一本被扣的诗集发还了，扣押单也改过了。"

[[tracks.chapters.variants]]
key = "v1_asked"
when = [{ kind = "flag", flag = "c13_request_zubayda_asked" }]
text = "三天后库房重新开门。税吏的桌上摊着那本诗集，他用一根细木棍点着一行字，说这首诗讥讽官人，不能放。其实他认不得这首诗的出处，只是有人跟他说过这种书不能放行。你已经知道那首诗骂的是谁，这回只需要让他知道。祖贝达站在门外没进来，隔着门说：“别跟他吵。他要的是一句能写进单子里的话。”税吏听见了，把木棍在桌上敲了两下，没回头。"

[[tracks.chapters.choices]]
key = "argue"
text = "当着他念出这首诗的出处，说明骂的是酒馆老板，不是官人。"
