text = "笑她：连被扣过也要写进书里？"
reply = "“买书的人有权知道这本书去过哪儿。”她付了钱，又硬塞给我一杯咖啡的钱，说海关门口那家煮得最难喝，“喝完你就记得这天”。她把书收进箱子最上层，说以后谁来买，都要先给他看这一页。"
