# 祖贝达：请托“扣押单上的缺页”（故事 2.0，C13d 请托，类型 persuade）
# 人物：祖贝达（zubayda），1540-01-01 生，女，开罗书商的小女儿，替父亲在柜台后面站柜。cast 见 cast/classmates_cairo.toml。
#       C7 线 bond_zubayda 只读（变体读它的羁绊级别）；tie_zubayda_amina 与阿米娜本人一律不出场。
# 窗口与报价：offer 为到访（V 模式），auto=true，在亚历山大港（alexandria）。可接的窗口 1565-01-01 至 1588-12-31，
#       同一天为期限，到期走 timeout（next=failed，不写见闻）。family c13_offer_alexandria，冷却 20 天。
# 章节：offer（被扣下的一本）→ persuade（税吏的桌子，三天后库房开门）→ result（头一页）；
#       检定失败的分支走 result_half（书回来了，单子没改），二者都以 done 收尾。
# 依据：史实背景只到“奥斯曼埃及的书籍买卖、海关与税吏、送往伊斯坦布尔的书”这一层，不写具体税则与官员名。
#       原创：被扣的诗集（不写书名与原文，不写讥讽是哪一句）、税吏、海关的书记官、头一页上的那一行字。
#       待核：无。
# 旗标：设 c13_request_zubayda_accepted / declined（offer）；c13_request_zubayda_asked（offer 第二个选项，只由 persuade 的变体 v1_asked 读）；
#       c13_request_zubayda_slip（persuade 的三个成功选项）；c13_request_zubayda_half（persuade 检定失败，转入 result_half）；
#       终局 c13_request_zubayda_done / c13_request_zubayda_partial。不读任何主角的 c13_main_ 旗标，不设也不读任何 c7_ 旗标。
# 变体：offer 的 v1_bond 读 bond zubayda ≥ C（C7 羁绊）；persuade 的 v1_asked 读本线的 asked 旗标，只改一段话。
# 回忆插画清单：mem-request_zubayda-result——诗集头一页上新写的一行字，旁边压着扣押单的一角，窗外是亚历山大港的码头。
# 秘密：祖贝达卖给巴拉卡的那本残本（定价过低）不碰；见闻里一个字也不写。
# 禁区：不写书名与原文；税吏不写成坏人，只是不识出处、怕担责的小官；正文不写报酬数字；不写恋爱、心动。
#       检定与花钱的选项在 persuade 三条路：属性检定、钱、语言技能，各自的代价与结果不同。

[[tracks]]
key = "request_zubayda"
name = "扣押单上的缺页"
kind = "request"
start = "offer"
auto = true
cast = ["zubayda"]

# 1565 年以后 · 亚历山大港海关库房门口：报价。窗口以 when 的日期条件表示（窗口需要缺省分支，这里没有），到期即失败。
[[tracks.chapters]]
key = "offer"
title = "被扣下的一本"
text = "亚历山大港海关的书箱库房门口，你撞见开罗书商的小女儿。她手里攥着一张扣押单，单子上只写了“诗集一部，内有不宜之语”。门里的税吏说，一个卖书的女人管不着官府的单子，门随即关上。她没走，把单子展开给你看：“书要回来，我认。扣也行，缺了哪几页、为什么扣，一样一样写明。”她打量了你一眼，又说：“你是来买书的，还是来看热闹的？”"
speaker = "zubayda"
mood = "tense"
at = "alexandria"
when = [
  { kind = "date", from = [1565, 1, 1], to = [1588, 12, 31] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "zubayda", ge = 18 },
]
objectives = [{ kind = "at", at = "alexandria", text = "到亚历山大港海关的库房门口" }]
