# 请托：三年的旧账（request_ursula）。故事 2.0，遵循 A5 / E37 契约。C13d，2026-10-18，Claude（Opus）执笔。
# 人物：乌尔苏拉 ursula（1540-08-22 生，女），富格尔商行驻安特卫普代理人的女儿，学院同学（cast/classmates_antwerp.toml）。
# 类型：说服某人（persuade）。章节：offer 未结 → approach 空麻袋 → persuade 三条路（看清麻袋时走 persuade_seen）→ 终章：result 结清日（期票）、result_share 半个日子（股契）、result_pepper 十五袋胡椒。
# 结构说明：分支靠 next 走到各自的章节，不靠互斥的旗标门禁（引擎审计里互斥门禁会报“准备后条件仍不满足”）。approach 的 check_sacks 成功走 persuade_seen，那里的 take_pepper_seen 用“容易”检定；其余走 persuade，take_pepper 用“一般”检定。终章按纸的种类分开：期票走 result，股契（以及胡椒检定失败后的股契）走 result_share，胡椒走 result_pepper。
# 报价：当面（T）。auto=false，玩家在安特卫普找到她（ask:request_ursula）。窗口 1563-02-01 至 1574-12-31；进行中的章节 deadline_days 150，全部终局落在 1576 年 2 月以前。
# 身份档 2（富商、学者、官员）：现金基数 1600，中档 ×1.4 = 2250。期票路线 2250，股契路线 1350，胡椒路线 2250 报酬加 2250 货款。
# 依据（史实）：1557 年西班牙王室停付，安特卫普交易所的汇票与期票（只作口吻里的背景）；里斯本的王室胡椒专卖与印度船期，印度商馆（Casa da Índia）的船期册（传闻口吻，正文不写具体年月）。
# 依据（原创）：里斯本新街的香料商（叙事人物，不起全名、不建 cast）；仓里那排鼓起的麻袋；期票与船股契；结清日那一行空格；十五袋胡椒，最后一袋轻了半磅。
# 待核：王室汇票在安特卫普的折价；印度商馆船期册的登记方式。正文一律用传闻口吻。
# 秘密：父亲借她的名义藏了一笔坏账（cast secret）。本请托不碰，正文不暗示，见闻不写。
# 读写的旗标：读 bond_ursula 的 C 级（offer 的 variant，由羁绊线设）；只设 c13_request_ursula_*；ship_real 与 prefers_goods 只在 persuade 的变体里读；不读任何 c7_ 旗标，不设 c7_ 旗标。
# 依赖：无改名依赖（ursula、lisbon、antwerp 现成）；技能 negotiation 现成。唯一奖励 counting_tokens 已由 C7 的 bond_esther（A2）与 bond_hinrik_korn 发出，整合时去重（2026-10-24），本请托不再发物品。
# 回忆插画清单：
#   mem-request_ursula-result：烛光下，期票上那行红字后面填上了日子。
#   mem-request_ursula-result_pepper：码头上的秤杆，十五袋胡椒，最后一袋轻了半磅。
# 缺省走向：玩家不来，offer 到期走 timeout（不写见闻）；approach、结清日超时，她另托了人，或者这笔账被记成了坏账，各给一封来信；persuade 没有期限，可以一直等。
# 旗标：终局 done / partial / late；分支 accepted / declined、prefers_goods、saw_pepper、ship_real、bill、share、pepper。

[[tracks]]
key = "request_ursula"
name = "三年的旧账"
kind = "request"
start = "offer"
auto = false
cast = ["ursula"]

# offer · 1563 起 · 安特卫普的账房：一本旧账，一行红字；她列出三条路
[[tracks.chapters]]
key = "offer"
title = "未结"
text = "安特卫普，乌尔苏拉的账房。她把一本三年前的旧账本拍在桌上，指着其中一行红字。“里斯本新街的香料商，三年前赊了我一批铜器，到现在一个斯图弗都没还。来信只说，船还在印度。”我低头看那行字。数目算不上大，她却把账本摊得很开，像是要人当面看清楚。她接着给我列了三条路：拿胡椒抵，拿他船上的股份抵，或者让他重立一张期票，找个靠得住的人作保。“钱不是最要紧的。”她把算筹拨到一边，“交易所里已经有人拿这笔账笑我。”末了她合上账本：“我没输，账还没结呢。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "ursula", text = "在安特卫普她的账房里找到她" }]
when = [{ kind = "date", from = [1563, 2, 1], to = [1574, 12, 31] }, { kind = "age", ge = 17 }, { kind = "age", person = "ursula", ge = 18 }]
deadline = [1574, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "take_it"
text = "接下，去里斯本当面跟他算。"
next = "approach"
effects = [{ kind = "affinity", person = "ursula", value = 2 }, { kind = "flag", flag = "c13_request_ursula_accepted" }]
reply = "她当场抄了一份账目给我，连利钱算到哪一天都写好了。最后一行空着，写着“结清日：＿＿”。“去了就把日子填上。”我把账目折进外衣的内袋，纸角硌着胸口，一路都能摸到。"

[[tracks.chapters.choices]]
key = "ask_which"
text = "接下，先问她：三条路里，她最想要哪一条？"
next = "approach"
effects = [{ kind = "affinity", person = "ursula", value = 2 }, { kind = "flag", flag = "c13_request_ursula_accepted" }, { kind = "flag", flag = "c13_request_ursula_prefers_goods" }]
reply = "“哪条他真会兑，我就要哪条。”她想了想，又补了一句，“胡椒要拿现货，别收他仓里的单子。”我把这句记在账纸边上，她看见了，没说什么。"

[[tracks.chapters.choices]]
key = "decline"
text = "三年的旧账，劝她认了。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_ursula_declined" }]
reply = "她把账本合上：“认了？那叫输。”她没有再看我，把那本账推到桌子里侧，叫伙计送客。伙计替我开门时，她的算筹还在桌上排着，一颗一颗，排的仍是那一行。"

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "ursula", level = "C" }]
text = "乌尔苏拉把账本推过来，手指压在一行红字上，不等我开口就说：“里斯本新街那个香料商，三年前赊了我一批铜器，到现在一个斯图弗都没还。来信只说船还在印度。你来挑错。”口气跟学院里比算题一个样，只是这回她没有笑。她给我列了三条路：拿胡椒抵，拿他船上的股份抵，或者让他重立期票，找个靠得住的人作保。末了她合上账本：“钱不算大，可交易所里已经有人拿这笔账笑我。我没输，账还没结呢。”"

# approach · 1563—1576 · 新街的香料仓：一排鼓起来的麻袋
[[tracks.chapters]]
key = "approach"
title = "空麻袋"
text = "新街的香料仓里堆满了空麻袋，一摞一摞顶到房梁。香料商迎出来，脸上是一副愁容。“王室的胡椒合同拖着不结，”他说，“我的船还压在果阿。谁都欠谁，你说是不是？”临走前乌尔苏拉交代过：“先别喝他的酒，他喝得比谁都快。”我还是坐了下来，接过他倒的酒。他绝口不提铜器的事，说话时眼睛却总往仓库最里头瞟。那里有一排麻袋是鼓的，他挪了挪身子，正好挡住。"
speaker = "captain"
mood = "tense"
at = "lisbon"
when = [{ kind = "date", from = [1563, 2, 1], to = [1576, 2, 24] }, { kind = "alive", person = "ursula", value = true }]
deadline_days = 150
timeout = { next = "failed", effects = [{ kind = "letter", person = "ursula", text = "里斯本那边我另托了人。这笔账，不劳你了。" }, { kind = "affinity", person = "ursula", value = -3 }, { kind = "flag", flag = "c13_request_ursula_late" }] }

[[tracks.chapters.choices]]
key = "check_sacks"
text = "借口找地方坐，去摸一摸最里头那排麻袋。"
next = "persuade_seen"
check = { attr = "commerce", base = 35, per = 6 }
fail = { next = "persuade", effects = [{ kind = "affinity", person = "ursula", value = -2 }], news = "里斯本新街的香料仓门口，一个伙计拦住了外港来的船长，麻袋只许看一眼上头的印记。" }
effects = [{ kind = "affinity", person = "ursula", value = 3 }, { kind = "flag", flag = "c13_request_ursula_saw_pepper" }]
reply = "是胡椒，晒得干透，至少十几袋，袋口扎着他自己的麻绳。我回到桌边，他的酒杯停在半空。“你摸它做什么？”他问，声音比刚才低。"
news = "听说里斯本新街的香料仓里，一个外港的船长借口找座位，摸到了最里头那排麻袋，香料商的酒杯停在半空。"

[[tracks.chapters.choices]]
key = "check_ship"
text = "去印度商馆门口打听，他的船是不是真的压在果阿。"
next = "persuade"
effects = [{ kind = "affinity", person = "ursula", value = 3 }, { kind = "flag", flag = "c13_request_ursula_ship_real" }]
reply = "商馆的书记翻了船期册，手指点着一行字：那条船上个月就回了港，货卸在王室仓库，只是胡椒钱还没结给他。他没说谎，只是没说全。我在门口站了一会儿，才想起该回去见他。"
news = "里斯本印度商馆门口有人说，外港船长问起新街香料商的船，书记翻了船期册，那条船上个月就回了港。"

# persuade · 1563—1576 · 新街的香料仓：他拿不出现钱，只拿得出船股（没有看清麻袋时走到这里）
[[tracks.chapters]]
key = "persuade"
title = "三条路"
text = "第二回见面，香料商把账目摊在桌上，承认欠着，只是“现钱一个也拿不出”。“王室的钱停了，我拿什么还？”他拍着账纸，“船股是有的，等下一趟船回来才值钱。”三条路在我手里，他手上只剩一个拖字。乌尔苏拉的话我记着：“他若拿股份抵，就问船期；他若拿单子抵，就数袋子。”"
speaker = "captain"
mood = "tense"
at = "lisbon"
when = [{ kind = "date", from = [1563, 2, 1], to = [1576, 2, 24] }, { kind = "alive", person = "ursula", value = true }]

