[[tracks.chapters.variants]]
key = "v2_goods"
when = [{ kind = "flag", flag = "c13_request_ursula_prefers_goods" }]
text = "第二回见面，香料商把账目摊在桌上，承认欠着，只是“现钱一个也拿不出”。他顺手推过来两张仓单，都是他自己写的。“王室的钱停了，我拿什么还？”他拍着账纸，“船是有的，等下一趟才回得了港。”我没有去碰那两张单子，她要的是现货，我心里只惦记着仓里那些袋子。"

