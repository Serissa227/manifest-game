news = "里斯本新街的香料仓里，十五袋胡椒按市价写了提货单，外港的船长要亲自运去安特卫普。"

[[tracks.chapters.choices]]
key = "take_share"
text = "收下他的船股，回去让乌尔苏拉自己掂量。"
next = "result_share"
effects = [{ kind = "flag", flag = "c13_request_ursula_share" }]
reply = "他高高兴兴地写了股契，像是卸下一块石头，末了还替我倒了一杯酒。我知道这张纸要等一年才知道值不值钱，折好以后放进了箱子最底下。"
news = "听说里斯本新街的香料商把船股写进一张股契，交给外港的船长，说等那条船回来再算。"

[[tracks.chapters.variants]]
key = "v1_ship"
