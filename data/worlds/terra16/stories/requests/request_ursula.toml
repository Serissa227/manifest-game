# result · 1563—1576 · 安特卫普的账房：期票
[[tracks.chapters]]
key = "result"
title = "结清日"
text = "安特卫普的账房里点着两盏灯。乌尔苏拉把我带回来的期票平放在烛光下，看了很久，像在验一枚假币。“三年了，”她说，“就差这一张纸。”我站在桌边，听她的算筹在桌面上一颗一颗地响。“纸对了，就照规矩办。”她的手指停在那一行红字上，没有落笔，烛花在灯罩里轻轻炸了一下。窗外有人在喊船期，喊的是果阿。乌尔苏拉听见了，手没有停。"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "ursula", text = "回安特卫普她的账房" }]
when = [{ kind = "date", from = [1563, 2, 1], to = [1576, 2, 24] }, { kind = "alive", person = "ursula", value = true }]
