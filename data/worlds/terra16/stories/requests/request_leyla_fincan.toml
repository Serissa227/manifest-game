# 请托：三年的咖啡钱（request_leyla_fincan）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：莱拉·芬詹（leyla_fincan，1540-04-19 生，女），金角湾兵工厂门口咖啡摊家的女儿，替船匠把口述的订单写成字；势力 ottoman，身份档 1。cast：cast/classmates_custom_istanbul_shipyard.toml。
# 类型：说服某人（persuade）。五章：offer（报价）、persuade（书记们的房间）、result（书记认账，她写自己的名字）、result_mother（她当面说出以后的收尾）、result_partial（只讨回一半）；终点 done / failed。
#   说明：简报写的是三章。收尾拆成 result / result_mother / result_partial 三章，是因为“母亲的签名”这一面的旗标由 confess 在本轨道里设，按规则改由 next 分流，不用 requires 门禁；对账失败的 result_partial 同理。
# 报价：T（当面）。auto=false，玩家在兵工厂门口“问请托”（ask:request_leyla_fincan）启动；offer 不写 at，目标是在港里找到她。
#   窗口 1575-01-01 至 1590-06-30，期限到 1590-06-30，超时 next=failed，不写见闻。玩家满 17 岁，她满 18 岁。
#   offer 与 persuade 不写 window／default（它们和 deadline／timeout 同日或更早，审计报“默认分支被超时分支覆盖”）；日期范围写在 when 里，期限写在 deadline／deadline_days 里。
# 进行中：persuade 在 istanbul，期限 60 天；超时走 failed，来信一封，好感 -3，旗标 _late；超时的见闻只在到过伊斯坦布尔的人那里传开。
# 依据·史实背景：1554 年伊斯坦布尔开出头几家咖啡馆，此后在码头、兵工厂一带兴起（正文只写咖啡摊与书记，不写禁令）。
# 依据·原创：莱拉、她家的咖啡摊、四个书记、签名的事、来信。
# 秘密：母亲不识字，签名是莱拉替她练的。只在 persuade 的 confess 选项（情谊 ≥ 30）里由莱拉自己说出；书记只说“签名太整齐”，不替她说破。见闻与来信永远不写这一件。
# 读的旗标：bond_leyla_fincan 的 C 级（offer 的 v1_bond，只读）；c7_tie_new_marietta_filo_leyla_fincan_together（offer 的 v2_lamp，只读，只写隔壁一盏灯，不提人）。不设任何 c7_ 旗标，不写玛丽埃塔与灯坊。
# 设的旗标：c13_request_leyla_fincan_accepted（offer 两种接法）、_declined（回绝）、_counted（offer 对账，分支）、_mother（confess，分支）、_half（对账检定失败，分支）、_late（超时）、_done（完结）、_partial（只讨回一半的完结）。
# 报酬：现金最多 900（只讨回一半 500）；好感最多 +13；名声 +1（只在最好的结局）；回忆 mem-request_leyla_fincan-result；无物品。
# 依赖：港口 istanbul；技能 negotiation（skills.toml）；属性 eloquence（captain.toml）；cast 日程 1554 年起在 istanbul。不依赖 c13_main_ 旗标（她不在主线里）。
