[[tracks.chapters.choices]]
key = "keep"
text = "把信翻到末页，收好"
next = "done"
reply = "末页的墨比前头几页重，像是停笔想过：“师恩是私，纲常是公。骂我的人，也有他们的道理；我的道理，写在那道疏里。”末了只有一句：“腿阴天还疼，不碍事。”信里夹着一张谢礼的银票，折得方方正正。"
