text = "茶铺最里面那张桌子，周砚面前摊着七页纸，字小得像撒了一把芝麻，页角用茶碗压着。他从漳州城下来，鞋帮上还带着泥。他把第一页推过来：“你念字从来不错，这回也别错。”低头理了理纸角，又添了一句：“搜港那天的事，我后来也知道了。”我没接话。他已经翻到了下一页：“蔡阿九，打了三十年鱼。洪家船行拿一张泡烂的契约告他，说他欠一条船。契上泡烂的那几个字，我问遍了当年在场的人，一个一个补出来的。”我念到“蔡某任船一只”，他的手指按在纸上：“且慢，这个字不对。”我头一回在他面前念错了字。“底下有个贝字，是我写挤了。‘任’是承当，‘赁’是租借，船是买的还是租的，全在这一个字上。”他松开手指，“县里已经断了，限蔡阿九三个月交船。”他把七页纸拢齐：“我走旱路到福州要二十几天，赶不上。你的船走海。交到一个肯看完七页的人手里。”"

