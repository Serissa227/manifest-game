hint = "你的字比周砚的还难认"
reply = "我誊了一夜。周砚的字挤，我把每一行拉开，贝字底下留足了地方，补网婆婆那句话单占一行。七页誊成了九页。天亮门房接过去，看了一眼，把它从那一摞里抽出来，单放在窗台上，压了一方砚台：“这份看着舒服。”"
effects = [
  { kind = "affinity", person = "zhou_yan", value = 3 },
  { kind = "flag", flag = "c13_request_zhou_yan_read" },
]

[[tracks.chapters.choices]]
key = "pay_porter"
text = "塞给门房一点钱，请他把这一份放在上面。"
next = "reply"
requires = [{ kind = "cash", ge = 100 }]
hint = "门房的手伸了一半，看了看你的钱袋，又缩回去了。"
reply = "门房收了钱，把七页纸抽出来，放在那一摞的最上面，拍了拍袖子。“要紧的先放上头，规矩。”他说“规矩”两个字的时候没看我。排在我后面那个抱孩子的人，看了一眼那七页纸，又看了一眼我。"
