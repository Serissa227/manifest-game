# 收尾（有人看完了七页）：月港茶铺，他把批回带下来。他以为会说字不对。
[[tracks.chapters]]
key = "reply"
title = "批回"
text = "一个多月后，我在月港上岸，周砚已经在茶铺里等着。他面前压着一张纸，不是七页，是薄薄一张批回，边上盖着衙门的红印。“按察司发回县里重审。”他念给我听，念得很慢，“契内赁字泡损，不足为凭——”念到这里他停了，把批回举到窗光里，手指悬在一个字上。“且慢——”我以为他又要说字不对。他盯着看了好一会儿，才说：“这个字，对了。贝字在底下，一笔不少。”"
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "cheerful"
objectives = [
  { kind = "at", at = "yuegang", text = "回月港茶铺，找周砚" },
  { kind = "wait", days = 35, text = "过一个多月，批回才会下来" },
]
when = [
  { kind = "alive", person = "zhou_yan", value = true },
  { kind = "flag", flag = "c13_request_zhou_yan_first_page", value = false },
]
news = "月港的茶铺里，一个书生拿着福州按察司的批回看了三遍，茶洒在桌上也没顾得上擦。"

