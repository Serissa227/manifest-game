# 七页证词（request_zhou_yan）——请托线，类型：送信（kind=letter），报价模式 V 到访（auto=true，offer 章 at=yuegang，family=c13_offer_yuegang，冷却 20 天）。
# 人物：周砚（zhou_yan，1540-06-25 生），漳州龙溪社学出来的书生，较真，一个字能争到天黑，争完还要跑去街上问人；1568 年起他从漳州城下到月港。cast 见 cast/classmates_zhangzhou.toml。
# 时间：报价 1568-01-01—1590-06-30（月港茶铺），到 1590-06-30 仍没接就走 timeout（不写见闻）；
#       handover 福州（fuzhou）按察司衙门外，60 天期限；reply 回月港茶铺（过 35 天，他把批回带下来）。
#       没有 window 章节：期限与 timeout 已经给出去处。
# 依据（史实）：明代的词讼由州县先断，不服可以往上告；各省按察司下设照磨所，照磨是管文书卷宗的小官；状纸要誊得清楚才会有人看。
#       1567 年隆庆开海以后月港设海澄县，船行、渔户的租船契约纠纷多。
# 原创：渔户蔡阿九、洪家船行、泡烂的赁船契、补网的婆婆那一页证词、福州门房与老照磨。
# 待核：渔户越过州县直接告到按察司在律例上的限制（正文只写“递到按察司”“发回县里重审”，不写条文）；照磨所的具体办事规矩为推想，只写“有一个人把七页看完了”。
# 结构：reply（照磨看完了，或花钱把状纸放在最上面）与 reply_partial（照磨只翻了第一页，批回只写“候查”）用旗标 first_page 分开；
#       引擎的 variants 只换文字、不能换效果，所以两种报酬分成两章。find_clerk 检定失败走 reply_partial 并设 first_page；
#       pay_porter 不设 read 旗标，走 reply（花钱是把状纸放到上面，七页是否被读完，批回里没人说）。
#       offer 的两条 variants 读 bond 与 c7_wandeng_unmasked_known：只多一两句话，不改玩法。
# 读写的旗标：只写 c13_request_zhou_yan_accepted / declined / read / first_page / done / partial / late；
#       读 c7_wandeng_unmasked_known（只读，不设）。不依赖主线旗标。
# 与 C7 的界线：bond_zhou_yan 的结拜帖、写错字的灯、《同窗记》、1567 年重逢的开海账都不在本文件出现；他的日记与心事永远不写，见闻也不写。
# 与金城真的请托（福州琉球馆）两条不相干，按察司只是这一条里的衙门。
# 回忆插画清单：
#   mem-request_zhou_yan-reply：月港茶铺的窗光下，一张盖着红印的薄批回被举起来，一根手指悬在“赁”字上，茶碗里的茶洒了一点。

[[tracks]]
key = "request_zhou_yan"
name = "七页证词"
kind = "request"
start = "offer"
auto = true
cast = ["zhou_yan"]

# 报价：1568 年起，月港茶铺。七页证词，念到一个字被他喊停。
[[tracks.chapters]]
key = "offer"
title = "泡烂的契约"
text = "茶铺最里面那张桌子，周砚面前摊着七页纸，字小得像撒了一把芝麻，页角用茶碗压着。他从漳州城下来，鞋帮上还带着泥。“蔡阿九，打了三十年鱼。洪家船行拿一张泡烂的契约告他，说他欠一条船。”他把第一页推过来，“契上泡烂的那几个字，我问遍了当年在场的人，一个一个补出来的。你念，我听着。”我念到“蔡某任船一只”，他的手指按在纸上：“且慢，这个字不对。底下有个贝字，是我写挤了。‘任’是承当，‘赁’是租借，一条船买的还是租的，全在这一个字上。”他松开手指，“县里已经断了，限蔡阿九三个月交船，我这几页，县里不收。”他把七页纸拢齐，往我这边推：“我走旱路到福州要二十几天，等批回来，船早被拖走了。你的船走海。交到按察司，要交给一个肯看完七页的人手里。”"
at = "yuegang"
cast = ["zhou_yan"]
speaker = "captain"
mood = "tense"
objectives = [{ kind = "at", at = "yuegang", text = "到月港茶铺，找周砚" }]
when = [
  { kind = "date", from = [1568, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "zhou_yan", ge = 18 },
]
family = "c13_offer_yuegang"
family_cooldown_days = 20
deadline = [1590, 6, 30]
timeout = { next = "failed" }

