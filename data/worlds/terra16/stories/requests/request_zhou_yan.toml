# 进行：福州，按察司衙门外。60 天内没到，证词就由别人带去，没有回音。
[[tracks.chapters]]
key = "handover"
title = "照磨的桌子"
text = "福州按察司衙门外，递状的人从照壁排到了街口，有抱孩子的，有扛着一卷田契的。门房把七页纸接过去，翻都没翻，往旁边一摞状纸上一放。那一摞比他的肩膀还高，风一吹，最上面几张就往下滑。“一天看不了十份。”他拿袖子压住纸，“你这七页的，更没人看。放着吧。”放到几时，他没说。墙根下两个代写状纸的书手抬头看了我一眼，又低头去舔笔。东厢有扇窗开着，窗下一张堆满卷宗的桌子，是管文书的照磨的，人还没散衙。"
at = "fuzhou"
cast = ["zhou_yan"]
speaker = "captain"
mood = "tense"
objectives = [{ kind = "at", at = "fuzhou", text = "到福州按察司衙门外" }]
when = [{ kind = "alive", person = "zhou_yan", value = true }]
deadline_days = 60
news = "福州按察司衙门外，递状的人排到街口，有一份七页的证词被人从一摞状纸里抽了出来。"
timeout = { next = "failed", effects = [{ kind = "letter", person = "zhou_yan", text = "证词我托一个去福州的同年带去了。他说递上去了，没回音。——周砚" }, { kind = "affinity", person = "zhou_yan", value = -3 }, { kind = "flag", flag = "c13_request_zhou_yan_late" }] }

[[tracks.chapters.choices]]
key = "find_clerk"
