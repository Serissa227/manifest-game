next = "reply"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "reply_partial", effects = [{ kind = "affinity", person = "zhou_yan", value = -2 }, { kind = "flag", flag = "c13_request_zhou_yan_first_page" }], news = "福州按察司衙门外，一个外港来的船长拦住管文书的照磨说了半天，照磨只翻了第一页，说放着吧。" }
reply = "照磨是个老举人，须发都白了。他听我说一个书生为了几个泡烂的字跑了半个月港，笑了一声，什么也没问，接过七页纸，站在街边就看了起来。看到第四页，补网婆婆那一句话，他停了停，倒回去又看了一遍。“这一份，明天放最上面。”他把纸理齐还给我，“明早来拿个信。”"
effects = [
  { kind = "affinity", person = "zhou_yan", value = 3 },
  { kind = "flag", flag = "c13_request_zhou_yan_read" },
]

[[tracks.chapters.choices]]
key = "fair_copy"
text = "在客栈里把七页誊成一份更清楚的，字大一号、行距宽一分。"
next = "reply"
