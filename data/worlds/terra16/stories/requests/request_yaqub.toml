  { kind = "affinity", person = "yaqub", value = 3 },
  { kind = "flag", flag = "c13_request_yaqub_asked" },
]
reply = "埃丝特听完，没问长短，只把那家人的名字抄进她的账本，抬头说：“我的船往阿尔及尔、非斯都走。有消息，就送到这家来。”"
news = "伊斯坦布尔的塞法迪人街区，织布的那家收了非斯的银子，还托了城里一家商号去打听另一家的下落。"

[[tracks.chapters.choices]]
key = "deliver_only"
text = "照规矩交了银子和信，让他们自己念。"
next = "reply"
effects = [{ kind = "affinity", person = "yaqub", value = 2 }]
reply = "儿子念完了信，老寡妇没说话，只把织机上断了的线接上。梭子又走了起来。过了一会儿，她才让儿子把信拿给她，把折痕一道一道摸过去，说：“那边的人，秤得准，信也折得齐。”"
news = "伊斯坦布尔的塞法迪人街区，织布的老寡妇没说什么，银子秤过，信让儿子念完，织机又响了起来。"

# 三、回信与布边：他下到港口取回信，数单背面多了一行字。
[[tracks.chapters]]
key = "reply"
title = "回信的秤"
text = "得土安码头，雅库布又下到港口来，手里是一封新折的回信，还有那张秤过的数单。数单背面多了一行字：“秤过，一枚不少。”他点点头，才拆信。信纸里夹着一小块布边，窄窄的，织的是细格子，边上还带着织机上的毛刺。“是老寡妇织的，”他把布边放在桌上，“说是给送信的人的。布边上打了个小结，是她自己的记号，让人认得出是哪一家。”"
speaker = "captain"
mood = "tender"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "回到得土安码头，取回信" }]
when = [{ kind = "alive", person = "yaqub", value = true }]
news = "得土安码头边，非斯来的金匠之子拆开一封伊斯坦布尔寄回的信，拆完又把数单翻过来看了一眼。"

[[tracks.chapters.variants]]
key = "v1_asked"
when = [{ kind = "flag", flag = "c13_request_yaqub_asked", value = true }]
text = "得土安码头，雅库布又下到港口来，手里是一封新折的回信，还有那张秤过的数单。数单背面多了一行字：“秤过，一枚不少。”他点点头，才拆信。信里多了一句：埃丝特的商号已经托人往阿尔及尔打听了。信纸里夹着一小块布边，是老寡妇织的，说是给送信的人的。"

