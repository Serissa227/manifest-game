  { kind = "affinity", person = "yaqub", value = 7 },
  { kind = "fame", value = 1 },
  { kind = "memory", memory = "mem-request_yaqub-reply", title = "数单背面的一行" },
  { kind = "flag", flag = "c13_request_yaqub_done" },
]
reply = "他想了想，说那就给最年长的那一家，“他们最想知道那边还好”。钱他照付，又在账本上记了一行，记完才合上。“布边的事我记下了，是谁家的，就给谁。”"
