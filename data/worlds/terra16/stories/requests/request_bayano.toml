text = "半个月后，那个扛夫又借着搬货凑过来。他没看我，把一个打了结的棉布小包塞进我手心。“那一夜兵丁把几个人拦到天亮，沙滩上落下几袋。”他说得很平，“林子里的人都知道了。”说完停了停，问，“下回还靠不靠这个港？”"

[[tracks.chapters.variants]]
