title = "泾阳寄来的草图"
text = "三个月后，盐商又来了，肩上的盐袋换成一只油布筒。筒里是王徵的回信和一张新草图：他照书里的链式水车造了一架，转到半圈，链子就滑，水洒了一地。信上写：“轮周三十三寸，链子一节三寸，我画了十二个齿，数了三遍。你们船上抽舱底水的泵，链子也挂在轮上，怎么就不滑？画给我看。”草图边上落着几个墨点，是他敲笔杆敲出来的。"
