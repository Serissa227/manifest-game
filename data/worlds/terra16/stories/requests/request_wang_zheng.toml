# C13d 请托：看得懂图的矿冶书（request_wang_zheng）。中文，Claude 写。
# 人物：王徵 wang_zheng（本世界线 1516 生，男；陕西泾阳人，做过推官，此时回泾阳家中摆弄齿轮；未受洗；身份档 2 官员／学者）。
# 类型：找东西（find）；4 章 offer → handin → use_book | use_copy。
#   brief 写 3 章（offer、handin、use）。use 的报酬要按“书送了”还是“描了图”拆开（1600／1100），
#   而按旗标给选项加 requires 会被审计机器人报“准备后条件仍不满足”，所以改为在 handin 里按 next 分流：
#   送书 → use_book，描图 → use_copy。两章场景不同（前者他手里有整部书，后者只有五幅描图，轮子是他自己猜的），选项与检定照 brief。
# 报价：来信（L）。auto=true，offer 章 at=tianjin，出面的是陕西盐商，王徵只在信里说话；不写 speaker。
# 窗口：offer 1578-03-01 至 1588-03-31（deadline 即窗口止日，到期走 failed，不写见闻）；
#   handin 到 1588-09-30；use 两章各 180 天。
# 依据·史实：王徵（1571—1644）的《奇器图说》《诸器图说》，本世界线整体提前约 55 年；他自己不通西文，靠图看懂机关；
#   《奇器图说》的图样有取自阿格里科拉《矿冶全书》（1556，巴塞尔）一路的传统，这里平移成“他托人从海外找一部多图的矿冶书”。
#   不写登州监军、不写受洗、不写火器。船上的链泵（链子挂在轮上、底下坠重物）按十六世纪常见的样子写，不点名具体船型。
# 依据·原创：陕西盐商和他的油布筒；第三个齿上的墨圈；轮周三十三寸、一节三寸、画了十二个齿的算式；铜尺；
#   “链子底下坠一块铅、轮上开槽不开齿”的两处改法；盐商把书垫在货包最上头。
# 读的旗标：无（不读 c7_* 与 c13_main_*；王徵没有 C7 线，也不在主线里）。
# 设的旗标：c13_request_wang_zheng_accepted（offer 接下）/ declined（回绝，终局）/ late（超时，终局）/ done（办成，终局）/ partial（折中，终局）；
#   分支：gave（送了书）、traced（描了图）。
# letter：全轨道两封——handin 超时一封（≤120 字）、use_book 的 pump 办成一封（≤300 字，附图描述）；use_copy 的 pump 没有信，结果写在回复里。
# 依赖：港口 tianjin（ports_east_asia.toml 已有）；物品 agricola_basel（items/books_05_commerce.toml；商店文化为 italian／iberian／low_countries，
#   寰宇港口目前对不上，见交付说明）；技能 shipbuilding；人物 wang_zheng（cast/historical_09_liaodong.toml）；势力 ming。
# 回忆插画清单：mem-request_wang_zheng-use，画面：泾阳的灯下，一张草图上第三个齿的墨圈被一道横线划掉，旁边压着一把铜尺。

[[tracks]]
key = "request_wang_zheng"
name = "看得懂图的矿冶书"
kind = "request"
start = "offer"
auto = true
cast = ["wang_zheng"]

# 一、报价：1578 年起，天津码头上，陕西盐商递来一封信和一张草图。
[[tracks.chapters]]
key = "offer"
title = "卡在第三个齿"
text = "天津卸盐的码头上，一个陕西来的盐商守着一排麻袋，见你走近，从怀里掏出一封信，信里夹着一张草图。图上画的是一盘自己会转的磨，齿轮密密匝匝，第三个齿那里被人用墨圈了一个大圈，圈外又描了三道。“泾阳的王老爷托我带的。”盐商抖开信纸，一个字一个字念给你听：“听说西洋有一部讲矿山的书，里头画着怎样把井里的水抽上来。西洋字我不认得。图上的齿轮要是画对了，字我一个不认也看得懂；画错了，认得字也没用。烦你寻一部来。”"
mood = "cheerful"
at = "tianjin"
when = [{ kind = "date", from = [1578, 3, 1] }, { kind = "age", ge = 17 }, { kind = "fame", ge = 5 }]
deadline = [1588, 3, 31]
timeout = { next = "failed" }
family = "c13_offer_tianjin"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "答应，我去找这部书。"
next = "handin"
reply = "盐商把草图折回四折，塞进信里，递到你手上。“王老爷说了，书要图多的那种，字少点不要紧。”他想了想又补一句，“圈着的那个齿你留意些，书里要是有一页能讲通它，就是这一部。”"
effects = [{ kind = "affinity", person = "wang_zheng", value = 2 }, { kind = "flag", flag = "c13_request_wang_zheng_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "这书我找不来。"
next = "failed"
reply = "盐商把草图对折，折到第三个齿那里停了一下，才折过去。“王老爷会自己琢磨出来的，”他把信塞回怀里，“就是慢。”"
effects = [{ kind = "flag", flag = "c13_request_wang_zheng_declined" }]

# 二、交书：书到手以后回天津。盐商问：书是送去，还是让他描。
[[tracks.chapters]]
key = "handin"
title = "满书的木刻图"
text = "盐商早把码头边一只空盐桶擦干净，让你把书放上去。书一翻开，他就没了话：整页整页的木刻，井口的辘轳，水车，一节扣一节的链子，工人弯着腰拉风箱，连矿渣怎么淘都画了出来。他拿沾着盐的手指悬在图上，不敢落下去。“这些字我也不认得。”他抬起头，“王老爷那边，书是送给他，还是让他照着描？描的话，我能找个画工。”"
speaker = "captain"
mood = "cheerful"
at = "tianjin"
when = [{ kind = "alive", person = "wang_zheng", value = true }]
objectives = [{ kind = "item", item = "agricola_basel", qty = 1, text = "带来阿格里科拉的矿冶书" }, { kind = "at", at = "tianjin" }]
deadline = [1588, 9, 30]
timeout = { next = "failed", effects = [{ kind = "affinity", person = "wang_zheng", value = -3 }, { kind = "flag", flag = "c13_request_wang_zheng_late" }, { kind = "letter", person = "wang_zheng", text = "书我等不得，已把第三个齿改成了第四个。磨是转了，转得不大好看。不怪你，路远。" }] }

[[tracks.chapters.choices]]
key = "give"
text = "把书送给王老爷。"
next = "use_book"
reply = "盐商用青布把书包了三层，打了个死结。“路上要走一个多月，”他说，“我把它垫在货包最上头，盐湿了，也湿不到它。”"
effects = [{ kind = "item", item = "agricola_basel", qty = -1 }, { kind = "affinity", person = "wang_zheng", value = 3 }, { kind = "flag", flag = "c13_request_wang_zheng_gave" }]

[[tracks.chapters.choices]]
key = "trace"
text = "书我留着，请画工描下抽水的几幅。"
next = "use_copy"
requires = [{ kind = "cash", ge = 200 }]
hint = "画工一幅图要收多少钱，你心里有数，眼下手头凑不够。"
reply = "画工在空盐桶边坐了一下午，描了五幅：井口的辘轳，整条链子，水车上的斗，水槽，木管。描完他把链子的节数数了又数，一节不少。“王老爷是会数的人，”盐商说，“少一节，他能从信里骂回来。”"
effects = [{ kind = "cash", value = -200 }, { kind = "flag", flag = "c13_request_wang_zheng_traced" }]

# 三之一、送了书：三个月后，盐商带来新草图，轮上画了十二个齿。
[[tracks.chapters]]
