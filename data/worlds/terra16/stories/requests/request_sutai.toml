# 三、结谢礼（粮由长老拉走）：二十天后，老宰桑带着打了结的毛绳回来。
[[tracks.chapters]]
key = "settle"
title = "帐子之间"
text = "二十天后，老宰桑又牵着那两匹马来了，通事跟在后头。马胖了一点，肋条不那么数得清了。他先把一条毛绳递过来，绳上一个结一顶帐子，他一个个点给我看，从头点到尾，没有漏的。通事开口：“帐子一顶没少。太后收了这份粮，也叫人看见她收了。在沈阳，被人看见，也是一种凭据。”老宰桑把一只沉甸甸的布袋放在跳板上，等我说话。"
