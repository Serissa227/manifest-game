key = "settle_taken"
title = "少了一截"
text = "二十天后，老宰桑又牵着那两匹马来了，通事跟在后头。马还是瘦的。他递过来一条毛绳，绳上一个结一顶帐子，点到末尾，一顶没少，可点得很慢，有几个结，手指要停一停。通事开口：“帐子都在。粮过了官里的手，到帐子里的比卸上岸的少了一截，茶只够头两个月。太后还是叫人看见她收了，这就够她在沈阳站得住。”老宰桑把一只扁一些的布袋放在跳板上，没有看我，看着那两匹马。"
