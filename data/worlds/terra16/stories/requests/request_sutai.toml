[[tracks.chapters.choices]]
key = "mongol"
text = "用蒙古话跟长老们当场按帐数分"
next = "settle"
reply = "我蹲下来，用蒙古话问最年长的那位：几顶帐子，几口人。他愣了一下，报出数来，另两位帮着补。我们就在岸上按帐子分，一袋米压一道草绳，一块块砖茶掰开，按帐子摆成一排，赶车的人念着帐主的名字。小官喘着气赶到岸边时，车已经上了土路，岸上只剩几根草绳。"
