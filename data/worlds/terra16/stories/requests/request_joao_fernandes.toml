# 请托：画偏了的暗礁（request_joao_fernandes）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：若昂·费尔南德斯（joao_fernandes，1535-09-17 生；男）。葡萄牙领航员的儿子，在澳门长大，说闽南话；1570 年起常驻长崎，替往返日本的大船领航。
#   身份档 1（匠人、小商），风险中。cast：cast/story_eastasia.toml。
# 类型：去某处（go）。五章：offer（长崎，当面报价）、arrive（五岛水道，测完在平户靠港）、report（回长崎，测过礁边）、report_partial（回长崎，礁边是看水色估的虚线）、
#   report_rough（回长崎，看水色失手擦了底，降为折中）。
#   简报是三章；report 里“两个人测的”原本用 requires 读本轨道自己设的 _sounded 旗标，按契约改成按 next 分流：
#   arrive 的测深锤与绘图两条路去 report，看水色成功去 report_partial，看水色失败（简报：擦了底，降为折中）去 report_rough，各有自己的选项。
#   _sounded 照旧设，只作记录，不作门槛。
#   没有 stage 章，因此没有 window 与 default；简报里 arrive/report 的窗口（到 1579-12-30）不写成 window，由 offer 的日期与 arrive 的期限管住。
# 报价：T（当面）。若昂按日程在长崎（nagasaki，venue dock），auto=false，界面用 ask:request_joao_fernandes 启动；
#   offer 不写 at，objectives 是 person joao_fernandes；窗口 1572-01-01 至 1579-06-30；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：arrive 章 at=hirado，deadline_days=90（同一海区），超时 failed，好感 -3，旗标 _late，来信一封。三个收尾章都不设期限，可以一直等。
# 依据·史实：葡萄牙大船（黑船）的日本航次，从澳门北上，过五岛一带进长崎（1571 年起长崎成为大船的港口）；
#   测深锤底抹牛油、提上来看粘着的泥沙，是当时测深的通行做法；领航员随船带图与针路，收在领航箱里。
# 依据·原创：旧图上画偏的暗礁与去年擦底的小船、天鹅绒外衣与澳门花边、靴子、螃蟹、虚线、黑船的老领航员（不起名）、署名的事。
# 秘密：cast 没写 secret，本请托无须处理。不写源六（C7 线 pair_genroku_joao_fernandes 的事一概不碰，本轨道窗口避开 1571 与 1580）。
#   不写恋爱、不写心动；署名只写“两个人的名”，不写抢功、不写署错名（那是伊莎贝尔·索托的 C7 母题）。
# 读的旗标：无（不读 c7_ 与主线旗标）。
# 设的旗标：c13_request_joao_fernandes_accepted（offer 接下）、_declined（offer 回绝）、_sounded（arrive 测出礁边，只作记录）、_late（arrive 超时）、_done（收尾）。
#   不设任何 c7_ 旗标；不用 relation / tie / bond / heart / title / world / join / leave / start_track / end_track / growth 效果；无 variants。
# 报酬：现金最多 1250（收尾一次；report_partial 的“照实说”付 650；report_rough 是折中，付 650 或 850、不加名声）；好感最多 +13（接下 2 + 测出礁边 3 + 两个名字 8）；名声 +2；
#   回忆 mem-request_joao_fernandes-report（只在 report 的“两个人测的”）。无唯一奖励物品、无技能经验。
#   检定失败（看水色擦了底）好感 -2，去 report_rough；失败与超时不罚钱、不扣物品。
# 依赖：港口 nagasaki、hirado（ports_east_asia.toml）；物品 sounding_lead（items/items_instrument_01.toml，有 shop，只查持有不扣）；
#   技能 cartography（skills.toml）；属性 seamanship；人物 joao_fernandes。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_joao_fernandes-report「新图上的螃蟹礁」：长崎商馆的长桌上摊着一张新海图，礁画得像只趴着的螃蟹，右下角并排签着两个名字，旁边搭着一件天鹅绒外衣。

[[tracks]]
key = "request_joao_fernandes"
name = "画偏了的暗礁"
kind = "request"
start = "offer"
auto = false
cast = ["joao_fernandes"]

# 一、画着深水的地方：长崎码头，若昂摊开一张旧海图。
[[tracks.chapters]]
key = "offer"
title = "画着深水的地方"
text = "长崎的码头上，若昂·费尔南德斯穿着一件新做的天鹅绒外衣，袖口镶着澳门买来的花边，老远就用闽南话招呼你：“食饱未？我的闽南话比葡萄牙话还顺。先卸信，再卸货——你那包信呢？”不等你答，他已经把一张旧海图摊在货箱上，拿两只空酒杯压住卷起来的两角。五岛那段水道，黑船进长崎前非走不可，图上一片淡墨，旁边用葡萄牙文写着“深水”。他拿指甲敲那两个字：“去年一条小船就在这儿擦了底，刮掉一层船板。画这图的人，八成是坐在澳门的酒馆里画的。”他把图转过来对着你：“我要重新测一遍。你测深，我画。图画好了，下回黑船就照它走。”"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "date", from = [1572, 1, 1], to = [1579, 6, 30] }, { kind = "age", ge = 17 }]
objectives = [{ kind = "person", person = "joao_fernandes", text = "在港里找到他" }]
deadline = [1579, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应跟他去五岛测水道。"
next = "arrive"
reply = "他把外衣脱下来，对折两回，叠得比货单还平：“上了船，这件就不穿了。”可脚上那双擦得发亮的长靴，他没换。你多看了一眼，他抬起一只脚：“靴子不一样。靴子是站船头用的。”"
effects = [{ kind = "affinity", person = "joao_fernandes", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_accepted" }]

[[tracks.chapters.choices]]
key = "ask_credit"
text = "先问他：图画好了，署谁的名字？"
next = "arrive"
reply = "他愣了一下，像是从来没人这么问过，随即笑出声：“署两个人的。你的写在前头也行，反正我的字好看。”说着拿笔杆在图的右下角比划了两下，那里还没落一点墨。"
effects = [{ kind = "affinity", person = "joao_fernandes", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "五岛的礁太多，这一趟你不去。"
next = "failed"
reply = "他耸耸肩，把酒杯拿开，海图自己卷了回去。“那我找别人。找不到，就自己划条小船去。”他把图夹在胳膊底下走了，花边袖口在风里一翻一翻。"
effects = [{ kind = "flag", flag = "c13_request_joao_fernandes_declined" }]

# 二、像一只趴着的螃蟹：五岛水道，落潮时测深，测完在平户靠港。
[[tracks.chapters]]
key = "arrive"
title = "像一只趴着的螃蟹"
text = "离平户还有半天的水程，五岛的水道里潮正在落。若昂坐在船头，图板搁在膝上，墨壶用细绳拴在桅杆脚，笔尖悬着，等你报数。前六处跟旧图上的都差不多，他每记一个数就哼一声，嫌当年画图的人运气好。报到第七处，水忽然浅了一半，船底下的颜色也变了。若昂的笔停在半空，低头看图：这里明明写着“深水”，旧图上那处暗礁画得像一只趴着的螃蟹，趴在西边一百多步外。“螃蟹爬了，”他说，“爬到我们船底下来了。得把它的腿一条一条找出来。”"
speaker = "captain"
mood = "tense"
at = "hirado"
when = [{ kind = "alive", person = "joao_fernandes", value = true }]
news = "五岛的水道里，一条船落潮时一锤一锤测水，船头有个穿讲究靴子的葡萄牙人在画图。"
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "joao_fernandes", value = -3 }, { kind = "flag", flag = "c13_request_joao_fernandes_late" }, { kind = "letter", person = "joao_fernandes", text = "我一个人去测了，测到一半起了风。那处礁，还是画偏的。——若昂" }] }

[[tracks.chapters.choices]]
key = "lead"
text = "放测深锤，一锤一锤报数，把礁的边测出来。"
next = "report"
requires = [{ kind = "item", item = "sounding_lead", qty = 1 }]
hint = "船上没有测深锤。拿绳子拴块石头放下去，量不出准数。"
reply = "锤底抹了牛油，每提上来一回都粘着碎珊瑚和黑沙。你报了四十多锤，若昂画了满满一页，墨壶添了两回。礁的边连起来，这回才像一只真螃蟹，趴在水底，腿比旧图上伸得长。"
effects = [{ kind = "affinity", person = "joao_fernandes", value = 3 }, { kind = "flag", flag = "c13_request_joao_fernandes_sounded" }]

[[tracks.chapters.choices]]
key = "chart"
text = "你自己动手，把礁的方位画进他的图。"
next = "report"
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "你没学过量方位，画上去的线连自己都不敢照着走。"
reply = "你拿平户那边的山尖和岛上一棵歪脖子老松各取一道方位，在他的图上落了笔。他也画了一道，跟你的差了两步。两个人在船头争了半天，谁也不让，最后取了中间。他嘟囔说那是你运气好。"
news = "平户靠港的水手说，五岛那边有条船停在礁边半天不走，船长跟一个穿讲究靴子的葡萄牙人为两步远的一道线吵个没完。"
effects = [{ kind = "affinity", person = "joao_fernandes", value = 3 }, { kind = "flag", flag = "c13_request_joao_fernandes_sounded" }]

[[tracks.chapters.choices]]
key = "eye"
text = "看水色判断，大概报个范围。"
next = "report_partial"
check = { attr = "seamanship", base = 20, per = 7 }
reply = "水色从蓝转绿的地方就是礁。你沿着那道颜色报了个范围，他画了一道虚线，画完拿笔杆在虚线上点了点：“先这样。虚线总比画错了强。”"
news = "平户的酒馆里有人说，五岛水道上有条船落潮时专挑水色转绿的地方慢慢走，船头那个葡萄牙人一路画虚线。"
effects = [{ kind = "affinity", person = "joao_fernandes", value = 1 }]
fail = { next = "report_rough", effects = [{ kind = "affinity", person = "joao_fernandes", value = -2 }], news = "平户的酒馆里有人笑，说五岛水道上有条船看水色凑得太近，船底擦了一下，没破，船头那个葡萄牙人的好靴子湿了半截。" }

# 三、是谁测的：回到长崎，礁边测出来了。
[[tracks.chapters]]
key = "report"
title = "是谁测的"
text = "回到长崎，若昂把新图摊在商馆的长桌上，又换上了那件天鹅绒外衣，花边袖口抚得平平的。新画的礁挪到了旧位置东边一百多步，礁边是一道描了两遍的实线，螃蟹的每条腿旁边都注着小字。黑船的领航员是个瘦高的老人，戴着眼镜一个数一个数看下去，看完才抬头：“是谁测的？”若昂没吭声，手指在桌沿上敲了两下，看着你，等你开口。"
speaker = "captain"
mood = "cheerful"
at = "nagasaki"
when = [{ kind = "alive", person = "joao_fernandes", value = true }]
objectives = [{ kind = "person", person = "joao_fernandes", text = "回长崎找他" }]
news = "长崎黑船的领航箱里多了一张新图，五岛那处暗礁挪了位置，图角签了两个名字。"

[[tracks.chapters.choices]]
key = "both_names"
text = "说：两个人测的，两个人画的。"
next = "done"
reply = "领航员点点头，把图卷好，收进了领航箱，箱盖里头一层层贴着历年航次的纸条。若昂在图的右下角签了两个名字，你的在前头。他的字确实好看，花体的大写字母拖出去老长，差点压到螃蟹的一条腿。签完他吹了吹墨：“下回黑船过五岛，船上的人照着我们俩走。”"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "joao_fernandes", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_done" }, { kind = "memory", memory = "mem-request_joao_fernandes-report", title = "新图上的螃蟹礁" }]

[[tracks.chapters.choices]]
key = "his_name"
text = "说：图是他画的，署他的名就行。"
next = "done"
reply = "若昂有点不好意思，嘴上却说：“这可是你说的。”他签了自己的名字，又在旁边画了一只小小的螃蟹，八条腿两只钳，一样不少，指给你看：“这个是你。”领航员看看螃蟹，又看看你，什么也没问，把图收进了领航箱。"
news = "长崎黑船的领航箱里多了一张新图，五岛那处暗礁挪了位置，图角签着若昂的名字，旁边画了只小螃蟹。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "joao_fernandes", value = 5 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_done" }]

# 三之二、虚线那一段：回到长崎，礁边是看水色估的。
[[tracks.chapters]]
key = "report_partial"
title = "虚线那一段"
text = "长崎商馆的长桌上，新图压着旧图，两只螃蟹一东一西，隔着一百多步。新的那只只用一道虚线描了边，周围一个数也没有。若昂又穿回了那件天鹅绒外衣，胳膊肘撑在桌上，花边袖口正好搭住虚线的一头。黑船的老领航员把眼镜往鼻梁上推了推，从旧图看到新图，伸出两根手指把那截袖口拨开，指甲停在虚线上：“是谁测的？这一段，也下过锤？”若昂把袖子收回去，没接话，扭头看你。"
speaker = "captain"
mood = "tense"
at = "nagasaki"
when = [{ kind = "alive", person = "joao_fernandes", value = true }]
objectives = [{ kind = "person", person = "joao_fernandes", text = "回长崎找他" }]
news = "长崎黑船的领航箱里多了一张新图，五岛那处暗礁挪了位置，礁边画的是虚线，图角签着若昂一个人的名字。"

[[tracks.chapters.choices]]
key = "his_name"
text = "说：图是他画的，署他一个人的名就行。"
next = "done"
reply = "画图的人署了名，领航员就不好再追着问锤子的事。若昂松了口气，签名的花体字拖得比平时还长，又在虚线旁边添了一只小小的螃蟹，笔尖朝你一指：“这只是你，报数的。”领航员盯着虚线又看了一会儿，到底没再问，把图收进了领航箱。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "joao_fernandes", value = 5 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_done" }]

[[tracks.chapters.choices]]
key = "honest"
text = "照实说：礁边是看水色估的，没下过锤。"
next = "done"
reply = "领航员把眼镜推上额头：“礁挪了，这个我信。边在哪儿，我叫黑船离它远些。”他只照挪了位置的那一笔付钱。若昂的脸沉了一下，他最恨人说他的图没画完；过了一会儿却笑出来，在虚线旁边用那手好字写上“未下锤”，把笔递给你：“名字你也签一个。虚线是你报的，你也跑不了。”"
news = "长崎黑船的领航箱里多了一张新图，五岛那处暗礁挪了位置，礁边的虚线旁写着“未下锤”三个字。"
effects = [{ kind = "cash", value = 650 }, { kind = "affinity", person = "joao_fernandes", value = 8 }, { kind = "fame", value = 2 }, { kind = "flag", flag = "c13_request_joao_fernandes_done" }]

# 三之三、湿了半截的靴子：回到长崎，看水色失了手，船底擦过一下（折中）。
[[tracks.chapters]]
key = "report_rough"
title = "湿了半截的靴子"
text = "回到长崎，若昂在商馆门口先脱下靴子倒过来磕，靴筒里还留着一道发白的盐印。新图上礁挪到了东边，边上是一道虚线，虚线中间打了个小叉，就是那天船底擦着的地方。黑船的老领航员早从平户来的水手嘴里听说了这件事，拿指甲在小叉上按了按：“擦了底，才画出这么一道？这样的图，我只能先收着。”若昂把靴子往地上一顿，穿了回去：“那一下擦得可准，比四十锤还准。”说完他看你，等你替这张图说句话。"
speaker = "captain"
mood = "tense"
at = "nagasaki"
when = [{ kind = "alive", person = "joao_fernandes", value = true }]
objectives = [{ kind = "person", person = "joao_fernandes", text = "回长崎找他" }]
news = "长崎码头上有人笑若昂：五岛那张新图，礁边只画了虚线，黑船的领航员只肯先收着，他那双好靴子倒先在平户湿过一回。"

[[tracks.chapters.choices]]
key = "his_name"
text = "说：这张图署他的名，我不签。"
next = "done"
reply = "领航员没再说什么，只照挪了位置的那一笔算钱，图卷起来，塞在领航箱最底下。若昂签了名，笔尖在名字旁边悬了一会儿，到底没画螃蟹。“这回不画了，”他说，“它咬过我的靴子。”"
effects = [{ kind = "cash", value = 650 }, { kind = "affinity", person = "joao_fernandes", value = 4 }, { kind = "flag", flag = "c13_request_joao_fernandes_done" }]

[[tracks.chapters.choices]]
key = "the_scrape"
text = "说：那个叉是船底碰出来的，整张图就那一处最准。"
next = "done"
reply = "领航员这才把图拉回去，又看了一遍：“落潮擦底，涨潮也别从这儿抄近路。”他叫若昂在小叉旁边写上日子和潮时，那一处另算了钱。若昂一边写一边嘟囔：“我的靴子，从此躺在黑船的领航箱里了。”写完还是在叉旁边补了一只没有钳子的小螃蟹。"
news = "长崎黑船的领航箱里多了一张五岛的新图，虚线中间有个小叉，旁边注着落潮时船底在这儿擦过一下。"
