# 回月港：船头。白道长只说了一句话，她从头讲了一遍。
[[tracks.chapters]]
key = "home"
title = "从头讲一遍"
text = "回月港的路上，小蛮一直不说话，靠着舷墙看水。白道长没告诉她符打哪儿来，只让她从头讲一遍：头一回卖符是几岁，谁买过，后来那些船回没回来。她讲了小半个时辰，讲到有一条船再没回港，声音低得只剩气。老道士听完，只说了一句：“说清来由，比多烧一张符有用。”船进月港，天妃宫的屋脊露出来，小蛮忽然站到船头，对着满港的帆大声喊：“符挂上，舵还得自己掌！”喊完回头看我，眼睛是亮的：“讲完那一遍，我就不怕了。”"
at = "yuegang"
mood = "tender"
speaker = "captain"
news = "月港天妃宫前的符摊又开张了，卖符的渔家女先问人家去哪儿、几时回，然后才给符。"
when = [{ kind = "alive", person = "xiao_man", value = true }]
objectives = [{ kind = "at", at = "yuegang", text = "把小蛮送回月港" }]

[[tracks.chapters.choices]]
key = "ask_sell"
text = "问她：往后还卖符吗？"
next = "done"
