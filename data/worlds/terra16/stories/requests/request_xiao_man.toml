  { kind = "cash", value = 900 },
  { kind = "affinity", person = "xiao_man", value = 8 },
  { kind = "fame", value = 1 },
  { kind = "flag", flag = "c13_request_xiao_man_done" },
  { kind = "memory", memory = "mem-request_xiao_man-home", title = "船头上喊话的小蛮" },
]
reply = "“卖。”她答得没有一点犹豫，“只是往后买符的人，要先告诉我去哪儿、几时回。问清了，我再给符。”船靠了岸，她付了船钱，又把一张新符塞进我手里：“这张是问过你去哪儿以后才给的，别人的不算。”"

[[tracks.chapters.choices]]
key = "say_nothing"
text = "不问，让她在船头站着。"
next = "done"
effects = [
  { kind = "cash", value = 900 },
  { kind = "affinity", person = "xiao_man", value = 7 },
  { kind = "fame", value = 1 },
  { kind = "flag", flag = "c13_request_xiao_man_done" },
  { kind = "memory", memory = "mem-request_xiao_man-home", title = "船头上喊话的小蛮" },
]
reply = "我没出声，她就那样站着，站到船靠了岸，跳下去，冲天妃宫的方向又吆喝了一嗓子，半条街都听见了。她付了船钱，数得很慢，每一枚都在掌心里翻了个面。码头上头一个来买符的船客，她没急着递，先问了一句：“去哪儿？几时回？”"
