reply = "我先迈进去，回头伸手。她攥住我的袖子，闭着眼迈了一步，睁开眼时已经站在院子里。老道士放下扫帚，请她把符拿出来，一张一张摊在石桌上。"

[[tracks.chapters.choices]]
key = "know_bai"
text = "先进去跟白道长打招呼，请他出来迎一迎。"
