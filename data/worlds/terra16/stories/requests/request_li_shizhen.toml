# 一、报价：宁波药行街，柜台上压着一捆书稿。他的儿子替父亲问两件事：要两块真龙涎，要一个出过远洋的人开口。
[[tracks.chapters]]
key = "offer"
title = "药行里的书稿"
text = "宁波药行街的一家铺子里，柜台上压着一捆用麻绳扎的书稿，压它的是一枚铜戥子的砝码。捆书稿的人说他姓李，蕲州来的，家里世代行医。掌柜朝你这边努了努嘴：“这位的船走远洋。”年轻人转过身来：“家父在写一部大本草，写到龙涎，笔停了。有的书说是龙吐的涎，有的说是海里长的草，还有的说是大鱼的粪。家父一条也不肯抄，说写这几条的人多半抄的上一个人，上一个人又抄的上上一个。来信只有一句：‘不见真物，不下一字。’他要两块真龙涎，还要问问亲眼见过海的人，它到底出在哪里。”"
mood = "tense"
at = "ningbo"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1565, 1, 15], to = [1578, 6, 30] }, { kind = "fame", ge = 5 }]
deadline = [1578, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_ningbo"
family_cooldown_days = 20

[[tracks.chapters.choices]]
key = "accept"
text = "接下，去问，也把龙涎带回来。"
next = "ask"
reply = "他把麻绳解开一半，从书稿中间抽出一页，页边夹着一张纸条，上头只有一行：“龙涎，出何处？”后面三个问号，一个比一个用力，最后一个戳破了纸。“那天晚上家母说，灯油烧了半斤。”他把纸条递给你，“带着，到了地方好问。”"
effects = [{ kind = "affinity", person = "li_shizhen", value = 2 }, { kind = "flag", flag = "c13_request_li_shizhen_accepted" }]

[[tracks.chapters.choices]]
key = "ask_book"
text = "接下，先问问书写到第几卷了。"
next = "ask"
reply = "他苦笑了一下，手掌压在书稿上：“写了这些年了，药一味一味过，过到这里卡住。家里的米缸，排在书稿后头。”他说这话时没有叹气，像说一件早已习惯的事，“等你的消息，家父说不急。家母说，急。”"
effects = [{ kind = "affinity", person = "li_shizhen", value = 2 }, { kind = "flag", flag = "c13_request_li_shizhen_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "回绝，这趟走不了。"
next = "failed"
reply = "他没有争，把麻绳绕回去勒紧了，指节勒得发白。“那我去前头的船行再问。”他说，“家父交代过，被人拒一回，不算丢脸，算多问一家。”掌柜替他把书稿从柜台上挪开，砝码压回了账本。"
effects = [{ kind = "flag", flag = "c13_request_li_shizhen_declined" }]

# 二、马累的海滩：三个人，三种说法，每一种都说得很肯定。
[[tracks.chapters]]
key = "ask"
title = "马累的海滩"
text = "马累的集上，有人把一块灰白的蜡似的东西摆在棕榈叶上卖，不许人上手。海滩上退潮留下一线海草和碎贝，一个年轻渔夫蹲在水边，说龙涎是浪推上岸的，谁捡着都得先报给苏丹：“藏起来也没用，他们会把你家的屋顶掀了找。”往上走几步，老渔夫坐在翻扣的小船上，拍着肚皮：“我亲眼看他们从一条大鱼肚子里剖出来的，臭得我三天吃不下饭。”我又去清真寺，教法官翻开一本阿拉伯文的书，手指压着一行：“海底有泉，水凝成它，浪才送上岸。”三个人都说得斩钉截铁，没有一个肯说“大概”。"
speaker = "captain"
mood = "mystic"
at = "male"
when = [{ kind = "alive", person = "li_shizhen", value = true }]
objectives = [{ kind = "at", at = "male", text = "到马累打听龙涎的来历" }]
deadline_days = 400
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_li_shizhen_late" }, { kind = "affinity", person = "li_shizhen", value = -3 }, { kind = "letter", person = "li_shizhen", text = "家父等了一年多，没等到海上的消息，龙涎一条先写成了“或曰”，空着两行。他说，哪天有真物到手，再改。蕲州李家子代笔。" }] }

[[tracks.chapters.choices]]
key = "fisher"
text = "照老渔夫的话记：大鱼肚子里出来的。"
news = "马累的海滩上，有个外来的船长蹲着听老渔夫比划大鱼的肚子，听说是替海那边一位写书的先生问龙涎的来历。"
next = "deliver"
reply = "老渔夫的两条胳膊从船头比到船尾，嫌不够长，又站起来踮着脚往上够。比划完他自己先笑了，笑得直拍船帮。我把“大鱼腹中所得”写在纸上，旁边注了他的名字和他船上漆的记号。"
