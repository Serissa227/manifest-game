key = "use"
title = "或曰"
text = "过了几个月，李家的儿子又到宁波，药行后院里，一只蓝布包放在药碾边：一封信，一部旧书。信里把我记的话一条条抄了，三种说法并排，每条后头批着两个字，批的全是“存疑”，笔画一个比一个重。“龙涎那一条，家父改了三遍。”他说，“头两遍都想下个断语，划掉了。第三遍，起头写的是‘或曰’。”他把旧书从布里取出来，封皮磨得起了毛：“这是路上给你看的，朱橚的《救荒本草》，嘉靖年间重刻的。家父说，里头的草都画了叶子，画得老实。”"
