# 请托：龙涎是什么（request_li_shizhen）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：李时珍（li_shizhen，1518 生，男），字东璧，号濒湖，蕲州世医；弃举业行医，编一部大本草（1578 年成稿）；势力 ming，身份档 2 学者。
#       cast：cast/historical_06_ming.toml。本人不出场，只在信里说话；信由他的一个儿子带到宁波（儿子不起名）。
# 类型：复合（mixed）——去某处（马累问龙涎的来历）＋送货（两块龙涎香运到宁波）＋收尾（信与旧书）。四章：offer → ask → deliver → use。没有 stage 章，因此没有 window 与 default。
# 报价：L（来信／代理人）。auto=true；offer 在宁波（ningbo），出面的是他的儿子，offer 不写 speaker；请托人只在信里说话。
#       offer 写 family=c13_offer_ningbo、冷却 20 天；deadline 为窗口止日（1578-06-30），timeout 直接 failed，不写见闻。
# 进行中：ask 章 deadline_days=400（跨洋），超时 failed，来信一封，好感 -3，旗标 _late；
#         deliver 章 deadline=1578-12-31，超时 failed，来信一封，好感 -3，旗标 _late；
#         use 章 deadline_days=240（objectives 等 90 天），超时走 done：书寄在药行，旗标 _partial，不付余款、不加名声与技能。
# 依据·史实：李时珍《本草纲目》1578 年成稿（正文不说已刊行，也不写卷次）；书里龙涎一条诸说并存，写作“出西南海洋”一类。
#       马尔代夫是龙涎香的老产地；烧热的针扎龙涎会软化冒烟、松脂掺的假货冒黑烟，是药行里认假货的老办法。
#       朱橚《救荒本草》（1406 年初刻）在嘉靖年间有重刻本，作送给他的旧书（物品 jiuhuang_reprint），不是他自己的书。
# 依据·原创：宁波药行的掌柜与伙计、用麻绳捆的书稿、夹在页边的纸条与三个问号；马累的年轻渔夫、老渔夫的小船、教法官的书
#       （“海底有泉，水凝成它”是书里的说法，正文用教法官的口吻）；“海滩上捡到龙涎要先报苏丹”是当地的说法，正文用渔夫的口吻。
#       龙涎的来历诸说并存（龙吐涎、海草、大鱼的粪、海浪推上岸、海底泉水凝结），不替他下结论。
# 秘密：cast 里李时珍的秘密（吃丹药求长生的事牵涉宫里）本请托不碰，正文与见闻一概不写丹药、宫里与方士。c7 为 none。
# 读的旗标：无（不读 c7_* 与 c13_main_*；本轨道没有主线门禁，对六位主角都说得通）。
# 设的旗标：c13_request_li_shizhen_accepted（offer 两条接法）/ declined（offer 回绝，终局）/ late（ask 或 deliver 超时，终局）/
#       done（use 收尾，终局）/ partial（use 超时，终局）；分支：whale、book（ask 的记法，use 的变体读它）、fake（deliver 教他认松脂）。
#       结构说明：没有任何选项以本轨道设的旗标做 requires，分支只靠 next 与变体。
# 不设任何 c7_ 旗标；不用 relation / tie / bond / heart 效果。
# 报酬：货款 850（龙涎 2 × 基准价 340 × 1.25，deliver 给）、现金 800（deliver）＋800（use）；好感最多 +18（接下 2、ask 3、deliver 最多 5、use 8）；
#       名声 +5、herbal_medicine +30、唯一物品 jiuhuang_reprint（use 收尾给一次）。回忆 mem-request_li_shizhen-use。
# 依赖：港口 ningbo（ports_east_asia.toml）、male（ports_india.toml，市场有龙涎香）；商品 ambergris（goods/05_terra_trade.toml）；
#       物品 jiuhuang_reprint（items/books_06_medicine.toml）；技能 lang_arabic、herbal_medicine（skills.toml）；人物 li_shizhen。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_li_shizhen-use「针尖上的一缕白烟」：宁波药行的后院，一根烧热的针扎进灰白的龙涎，针尖冒出一缕细细的白烟，药行的伙计围成一圈。

