# 请托：不吃东西的小象（request_mali）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：玛莉（mali，1534-02-15 生，女），大城（ayutthaya_port）象厩里的驯象师；身份档 1（匠人）；cast：cast/story_southeast_asia.toml。
# 类型：押运／带人（escort）。三章：offer（报价）、passage（海上两天）、arrive（北大年的码头）。都是普通章，没有 stage、window、default。
# 报价：T（当面）。auto=false，玩家在港里“问请托”（ask:request_mali）启动；offer 章不写 at，objectives 为“在港里找到她”，报价港 ayutthaya_port（B10b 已改名）。
#       offer 写 deadline=1562-12-31、timeout 为 next=failed，不写见闻（没人知道这件事没成）。
# 进行中：passage 章要两天后才出现（wait 2），之后可以一直等；arrive 章 deadline_days=60，超时走 failed，来信一封，好感 -3，旗标 _late。
#       passage 的两条检定都有 fail：失败不罚钱，设分支旗标 _rough，arrive 的变体读它，多写一句“多耽搁了一天”。
# 依据·史实背景：暹罗王家养象、驯象的人在象厩里做活，象用船运去外地是少见的事（正文只写原创的做法，不写具体年份的史事）。
#       待核：北大年王族订象的年份，象在海船上的运法与棚子的样子。
# 依据·原创：玛莉与这头小象、船上帆布搭的棚子、甘蔗与芭蕉叶、码头上躲在她身后的小象、象奴手里那根粗缰绳。
# 秘密：cast 里 1564 年白象之事不在本轨道窗口内，不写；不写恋爱，不写心动。C7 的敦·苏丽线（tie_tun_suri_mali）从 1563 年起，本请托到 1562 年为止，不写敦·苏丽，不读 c7_ 旗标。
# 读的旗标：无。
# 设的旗标：c13_request_mali_accepted（offer 两条接法）、_cane（offer 问了它平时吃什么）、_declined（offer 回绝，终局）、_ate（passage 办成，小象吃了东西）、
#       _rough（passage 检定失败的两条 fail，分支旗标，arrive 变体读）、_done（arrive 两条收尾，终局）、_late（arrive 超时，终局）。
# 报酬：现金 1250（arrive 收尾给一次）、好感最多 +13、名声 +2、回忆 mem-request_mali-arrive（wait 收尾）。不发物品。
# 依赖：港口 ayutthaya_port、pattani（ports_southeast_asia.toml）；人物 mali；属性 stewardship、seamanship（captain 表定下来以后按比例换算）。
#       无主线门禁（gate_main、variant_main 都为空），不写 c13_main_*。
# 回忆插画清单：
#   mem-request_mali-arrive「码头上躲在她身后的小象」：北大年的码头边，一头小象把脑袋抵在驯象师的腰上，象奴站在远处牵着粗缰绳。

[[tracks]]
key = "request_mali"
name = "不吃东西的小象"
kind = "request"
start = "offer"
auto = false
cast = ["mali"]

# 一、它在看你的船：港里找到她，她把小象的事说完。
[[tracks.chapters]]
key = "offer"
title = "它在看你的船"
text = "码头上，一头小象把耳朵扇了两下，又扇了两下。驯象师玛莉站在它前头，眼睛不看象，先看你的船。对人，她向来没那么耐心，问一句答一句，答完就往别处走。“北大年的一位王族订了这头象，我要亲自送过去。”她说，“上回试着牵它上船，它一口甘蔗也不吃，在跳板前头站了半天，谁拉都不动。”她顿了顿，又说：“它不吃，我也不吃。你的船，得让它吃。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "mali", text = "在港里找到她" }]
when = [{ kind = "date", from = [1557, 6, 1], to = [1562, 12, 31] }, { kind = "age", ge = 17 }]
deadline = [1562, 12, 31]
timeout = { next = "failed" }

[[tracks.chapters.choices]]
key = "accept"
text = "答应载她和象去北大年。"
next = "passage"
reply = "她把小象牵到码头上，小象的耳朵扇了两下。她说：“它在看你的船。还没决定。”"
effects = [{ kind = "affinity", person = "mali", value = 2 }, { kind = "flag", flag = "c13_request_mali_accepted" }]

[[tracks.chapters.choices]]
key = "ask_food"
text = "接下，先问它平时吃什么。"
next = "passage"
reply = "“甘蔗、芭蕉叶、它妈妈的声音。”她说完，自己也笑了一下，“前两样你备着。”"
effects = [{ kind = "affinity", person = "mali", value = 2 }, { kind = "flag", flag = "c13_request_mali_accepted" }, { kind = "flag", flag = "c13_request_mali_cane" }]

[[tracks.chapters.choices]]
key = "decline"
text = "象不上我的船，这活不接。"
next = "failed"
reply = "她转身就走，小象跟着她，耳朵扇得很快。"
effects = [{ kind = "flag", flag = "c13_request_mali_declined" }]

# 二、耳朵不扇了：海上第二天起，小象不吃东西；第三天早上它的耳朵不扇了。
[[tracks.chapters]]
key = "passage"
title = "耳朵不扇了"
text = "海上第二天，小象躺在甲板上，帆布搭的棚子罩着它，一口甘蔗也不吃。玛莉坐在它旁边的木箱上，一只手搁在象耳根，也没吃饭。水手们踮着脚从棚子边走过，没人敢大声说话。她没抬头，只说了一句：“别站在它前头。”到了第三天早上，你去看它，小象的耳朵不扇了。"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "mali", value = true }]
objectives = [{ kind = "wait", days = 2, text = "出海两天" }]

[[tracks.chapters.choices]]
key = "care"
text = "叫人在棚子边泼凉水、扇风，让它凉下来。"
next = "arrive"
reply = "中午小象翻了个身，吃了一根甘蔗。玛莉在棚子那头压着嗓子说：“小声点，它在吃东西。”她自己也吃了一口饭，吃完瞪了你一眼，说你的水手泼水泼得太猛了。"
check = { attr = "stewardship", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "mali", value = 3 }, { kind = "flag", flag = "c13_request_mali_ate" }]
fail = { next = "arrive", effects = [{ kind = "affinity", person = "mali", value = -2 }, { kind = "flag", flag = "c13_request_mali_rough" }] }

[[tracks.chapters.choices]]
key = "shore"
text = "靠岸停半天，让它下船踩踩地。"
next = "arrive"
reply = "找到一处能靠的沙滩，小象踩到沙地，耳朵又扇起来了，一口气吃了半捆芭蕉叶。玛莉没说话，把剩下的叶子往它嘴边推了推。"
check = { attr = "seamanship", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "mali", value = 3 }, { kind = "flag", flag = "c13_request_mali_ate" }]
fail = { next = "arrive", effects = [{ kind = "affinity", person = "mali", value = -2 }, { kind = "flag", flag = "c13_request_mali_rough" }] }

# 三、在它耳边说了很久：北大年的码头上，象奴来接，小象往玛莉身后躲。
[[tracks.chapters]]
key = "arrive"
title = "在它耳边说了很久"
text = "北大年的码头上，王族家的象奴已经等在岸边，牵着一根粗缰绳，朝这边招手。小象一见那人，就往玛莉身后躲，前腿一软，把脑袋抵在她的腰上。象奴的脸色不好看，手里的缰绳换了两次手，还是没有上前。码头边上围着一圈看热闹的人，海风带着鱼腥味吹过来，没有一个人出声。玛莉蹲下来，在它耳边说了很久的话，你一句也听不懂。"
speaker = "captain"
mood = "tender"
at = "pattani"
when = [{ kind = "alive", person = "mali", value = true }]
deadline_days = 60
timeout = { next = "failed", effects = [{ kind = "affinity", person = "mali", value = -3 }, { kind = "flag", flag = "c13_request_mali_late" }, { kind = "letter", person = "mali", text = "小象走陆路去了北大年，走了一个月，瘦了一圈。我也是。" }] }
news = "北大年的码头上，大城来的驯象师把一头小象交给王族家的象奴，转身就走，没回头。"

[[tracks.chapters.variants]]
key = "v1_rough_cane"
when = [{ kind = "flag", flag = "c13_request_mali_rough" }, { kind = "flag", flag = "c13_request_mali_cane" }]
text = "北大年的码头上，王族家的象奴已经等在岸边，牵着一根粗缰绳，朝这边招手。这一路多耽搁了一天。小象一见那人，就往玛莉身后躲，前腿一软，把脑袋抵在她的腰上。玛莉下船时瞥了一眼你备的甘蔗，还剩半捆，说你备得太多了，可也没说不对。象奴的脸色不好看，手里的缰绳换了两次手，还是没有上前。码头边上围着一圈看热闹的人，海风带着鱼腥味吹过来，没有一个人出声。玛莉蹲下来，在它耳边说了很久的话，你一句也听不懂。"

