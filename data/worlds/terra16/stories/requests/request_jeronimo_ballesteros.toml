text = "考完那天夜里，老考官没提考题。“你那一问没问到根上，那孩子答得也没到根上。”他说得很慢，“所以我只给了他一个‘可’。”然后他才说出真正的事。他年轻时随船过亚速尔，往西第九天的黄昏，看见过一座岛，岛上有一道烟，第二天就没了。“海图上没有的，我不往纸上画。”他说，“你从安格拉往西开十天，回来当着我的学生，说你看见了什么。”安格拉的码头上，那个鱼贩的儿子已经抱着日志本在等，老考官说，他要他上你的船。"

# 海上：开十天。学徒在船上管日志；没有学徒，你自己记。第九天黄昏的那道暗线，由你选择怎么记。
