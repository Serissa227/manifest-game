# 三甲、回到堺：信是当面交到的。当主的回信是他自己写的。
[[tracks.chapters]]
key = "reply"
title = "少年当主的回信"
text = "回到堺，老家司已经在码头上等着。中村那边托一条商船先你一步捎来了回信，他展开给你看：是当主自己的字，一笔一画带着京里先生教出来的拘谨，中间有个字写错了，涂成一个黑疙瘩，旁边重写。信里说，义父的信他读了三遍。最后一行问：义父可曾说过，土佐的潮水，他还记不记得。老家司把信按原来的折痕叠好，抬头问你：“匣子，是怎么交到当主手里的？”"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "回堺见老家司" }]
deadline_days = 150
timeout = { next = "failed", effects = [{ kind = "flag", flag = "c13_request_ichijo_fusamichi_late" }] }
news = "堺的码头上，京里一条家的老家司收到土佐中村来的回信，站在栈桥边读了一遍又一遍，卸货的人从他身边绕着走。"

[[tracks.chapters.choices]]
key = "truth"
text = "照实说：在栈桥上，当着使者交到了他手里"
next = "done"
news = "堺的码头上，京里一条家的老家司捧着土佐来的回信，贴在额头上哭了一场，旁边卸货的人都停了手。"
reply = "你从河口的两色水说起，说到使者伸出的手，说到少年跳上栈桥的那一下。老家司一句也没插。听完，他把回信贴在额头上，半天没放下来，放下来的时候，纸边湿了一小块。他朝土佐的方向又鞠了一躬。"
effects = [{ kind = "cash", value = 2600 }, { kind = "affinity", person = "ichijo_kanesada", value = 8 }, { kind = "reputation", faction = "ichijo", value = 2 }, { kind = "memory", memory = "mem-request_ichijo_fusamichi-reply", title = "河口的少年当主" }, { kind = "flag", flag = "c13_request_ichijo_fusamichi_done" }, { kind = "letter", person = "ichijo_kanesada", text = "船主足下：河口一别，文匣已启。义父的信，兼定读了三遍，有几处至今不能尽解，意思却是明白的。那日家老的人伸手，足下没有把匣子递过去，兼定记得。日后若再过土佐，可在下田上岸，遣人到中村通报一声。另有一问，家里的人不好问：足下常年走海，土佐的潮水在海上看来，与京里人说的一样么？——一条兼定" }]

[[tracks.chapters.choices]]
key = "tide"
text = "先问他：老关白可还记得土佐的潮水？"
next = "done"
reply = "老家司想了很久。“老爷是中村生的，小小年纪就过继进了京。”他说南边的船一进港，老爷总要打发人去码头问一声潮水，问回来也不说什么。他又把回信展开，看那个涂掉的字。“这一句我答不了。……我替老爷回一封，就写记得。”他说这话的时候，没有看你。"
effects = [{ kind = "cash", value = 2600 }, { kind = "affinity", person = "ichijo_kanesada", value = 8 }, { kind = "reputation", faction = "ichijo", value = 2 }, { kind = "memory", memory = "mem-request_ichijo_fusamichi-reply", title = "河口的少年当主" }, { kind = "flag", flag = "c13_request_ichijo_fusamichi_done" }, { kind = "letter", person = "ichijo_kanesada", text = "船主足下：本家的老家司来信，说义父记得土佐的潮水。兼定不知这话是真是假，也不打算再问。那日正赶上河口涨潮，我叫川船在下田多停了半刻，看海水一寸一寸漫进河里。在京里那些年，没人跟我说过潮水是这样来的。足下的船若再到下田，让人捎个话，兼定下河口来。——一条兼定" }]

# 三乙、回到堺：匣子是家老经手的。回信是右笔代写，只有末尾一行是当主的字。
[[tracks.chapters]]
key = "reply_karo"
title = "花押下面的一行"
text = "回到堺，老家司已在码头上等着。中村那边托商船捎来了回信，他递给你看：整封是右笔的工楷，措辞周到，说本家的文匣已经收到，谢过京里多年的照拂，末尾是当主的名字与花押。只有花押底下多出一行小字，笔画歪斜，一看就不是右笔的手，有个字写错了，涂掉重写：义父可曾说过，土佐的潮水，他还记不记得。老家司用指甲点着那一行，问你：“匣子，是谁交到当主手里的？”"
mood = "tender"
at = "sakai"
objectives = [{ kind = "at", at = "sakai", text = "回堺见老家司" }]
