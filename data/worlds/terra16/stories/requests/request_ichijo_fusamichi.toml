reply = "使者接过纸条，三行字看了两遍，看到“托了谁”那一行，又看末尾的花押，抬头看了你一眼。他认得这个花押。纸条还到你手里，他退开了。少年下了川船，先要过纸条去看：“是本家那位老家司的字。他还拄着杖么？”说完才接过漆匣，又问：“义父最后几天，咳得厉害吗？”"
