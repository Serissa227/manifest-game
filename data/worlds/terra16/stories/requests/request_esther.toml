# C13d 请托：门楣上的记号（request_esther）。中文，Claude 写。
# 人物：埃丝特 esther（1539-06-11 生，女；塞法迪商人家的女儿，生在阿尔及尔，势力 algiers，身份档 2；cast 在 cast/classmates_fez.toml）。
# 类型：去某处（go）；3 章，offer → arrive → report；没有 stage 章。
# 报价：当面（T）。人物在伊斯坦布尔（istanbul）的商号柜台，auto=false，玩家“问请托”（ask:request_esther）启动。offer 章不写 at，objectives 为 person esther。
# 窗口：报价 1570-01-01 至 1577-06-30；马拉加查看与结账到 1578-08-24。
# 进行中：arrive 章 deadline_days=150；超时走 failed，埃丝特寄一封信，好感 -3。offer 章到 1577-06-30 仍未接，走 failed，不写见闻。
# 地点：伊斯坦布尔 istanbul（报价与结账）；马拉加老城 malaga（只看门，不进门，不问人——这是她给你的规矩，她本人不去）。
# 依据：史实背景，1492 年塞法迪人被逐出西班牙；马拉加的老犹太区早已改作他用；1568—1571 年阿尔普哈拉斯的摩里斯科人起事，1570 年以后格拉纳达一带的摩里斯科人被迁散，街上空屋多的写法放在 arrive 章的 variant 里。
#   门楣上的记号（一只鸟，又像一个结）与那张安达卢西亚旧欠据是原创；记号不写成宗教符号，不写宗教裁判所。
# 读的旗标（只读，不设）：bond esther（C 级，offer 章 variant，老同学的口气）；c7_tie_esther_zaynab_together（offer 章 variant，柜台上压着一封非斯来的信，不提名）。
# 设的旗标：c13_request_esther_accepted / declined / match / history / rough / late / done / partial。
# 路线：sketch 检定成功设 match 并走 report_match（自己的两个选项，不靠旗标挡选项）；其余走 report。
# 依赖：B10b 日程：classmates_fez.toml 里埃丝特的日程只写到 1556 年，1570—1577 年在伊斯坦布尔的日程要补（offer 章的 person 目标依赖它）。主线旗标：无。
# 秘密：母亲说漏的老家地名与那张旧欠据的来处，只在 report 章的 debt 选项（情谊 ≥ 30）里由她说出；见闻与来信不写。
# 回忆插画：mem-request_esther-report，发黄的旧欠据背面，细墨线画着门楣：一只鸟，又像一个结。

[[tracks]]
key = "request_esther"
name = "门楣上的记号"
kind = "request"
start = "offer"
auto = false
cast = ["esther"]

# 一、说漏的几个词：1570 年起，埃丝特在伊斯坦布尔的商号柜台，玩家来问。
[[tracks.chapters]]
key = "offer"
title = "说漏的几个词"
text = "埃丝特先把你的路费一枚一枚数出来。杜卡特、阿克切在她嘴里换着念，念得像唱歌，数完推到一边：“路费先留出来，人才走得成。”然后才说事。母亲从不肯说老家在哪儿，可这些年说漏过几个词：一座城，一条往下坡走的街，一口井，门楣上一个小记号。她把这几个词抄在账本最后一页，拼出来，是马拉加。“我只要你看一眼。那条街还在不在，门楣上有没有这个记号。只看，不进门，不问人。”"
speaker = "captain"
mood = "tense"
cast = ["esther"]
when = [{ kind = "date", from = [1570, 1, 1], to = [1577, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "esther", ge = 18 }]
objectives = [{ kind = "person", person = "esther", text = "在港里找到她" }]
deadline = [1577, 6, 30]

[tracks.chapters.timeout]
next = "failed"

[[tracks.chapters.variants]]
key = "v1_old_friend_letter"
when = [{ kind = "bond", person = "esther", level = "C" }, { kind = "flag", flag = "c7_tie_esther_zaynab_together" }]
text = "埃丝特先给你倒了一杯，杯沿还是那只缺了口的，说：“老规矩，你先坐。”然后把你的路费一枚一枚数出来，杜卡特、阿克切在她嘴里换着念，念得像唱歌，数完推到一边：“路费先留出来，人才走得成。”柜台上压着一封非斯来的信，她没让你看，把它往账本底下抽了抽。然后才说事。母亲从不肯说老家在哪儿，可这些年说漏过几个词：一座城，一条往下坡走的街，一口井，门楣上一个小记号。她把这几个词抄在账本最后一页，拼出来，是马拉加。“只看，不进门，不问人。”"

