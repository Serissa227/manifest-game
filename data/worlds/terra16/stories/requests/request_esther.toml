text = "埃丝特先把你的路费一枚一枚数出来。杜卡特、阿克切在她嘴里换着念，念得像唱歌，数完推到一边：“路费先留出来，人才走得成。”柜台上压着一封非斯来的信，她没让你看，把它往账本底下抽了抽。然后才说事。母亲从不肯说老家在哪儿，可这些年说漏过几个词：一座城，一条往下坡走的街，一口井，门楣上一个小记号。她把这几个词抄在账本最后一页，拼出来，是马拉加。“我只要你看一眼。那条街还在不在，门楣上有没有这个记号。只看，不进门，不问人。”"

[[tracks.chapters.choices]]
key = "go_malaga"
text = "接下，去马拉加找那条街。"
next = "arrive"
reply = "她把那个记号描在一张纸上，描得很小，说“像一只鸟，又像一个结”。纸折成四折塞进你手里，她又把账本合上。"
effects = [{ kind = "affinity", person = "esther", value = 2 }, { kind = "flag", flag = "c13_request_esther_accepted" }]

[[tracks.chapters.choices]]
key = "ask_mother"
text = "接下，先问：你母亲知道你要去找吗？"
