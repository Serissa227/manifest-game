# 三a、过急流之前的一瓢：盐税没有被抽过，工钱照数付。
[[tracks.chapters]]
key = "settle"
title = "过急流之前的一瓢"
text = "独木舟装满了，巴兰把货款和工钱一把一把数给你，数得很仔细。数完他又从自己那一份里舀出一瓢东西：可可豆磨成的粉，掺了香草和辣椒，冲上热水，是他亲手调的。“这一瓢是过急流之前调的。”他把木瓢递过来，“回梅里达，我过了急流再调一回，那回要更好。”码头上最后一袋盐扛上了船，船头的缆绳绷得直直的，他站在船尾，等你喝完才肯转身。"
speaker = "captain"
mood = "cheerful"
at = "campeche"
objectives = [{ kind = "at", at = "campeche", text = "在坎佩切的海边" }]
when = [{ kind = "alive", person = "balam", value = true }]
news = "坎佩切的海边，一支装满盐的独木舟商队往内陆去了，领头的坐在船正中间。"

[[tracks.chapters.choices]]
key = "take_gift"
text = "接过那一瓢可可，祝他过急流顺利。"
next = "done"
reply = "你喝得很慢，他也不催，等你把瓢还回去，他才挺着胸上了独木舟，坐在正中间，抓着船帮，冲你挥手。"
effects = [{ kind = "cash", value = 1250 }, { kind = "cash", value = 400 }, { kind = "affinity", person = "balam", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_balam_done" }, { kind = "memory", memory = "mem-request_balam-settle", title = "独木舟正中间的人" }]

[[tracks.chapters.choices]]
key = "price_it"
text = "笑着问他：这一瓢可可，说个价？"
next = "done"
reply = "“不卖。”他头一回说这两个字，自己也愣了一下，然后把木瓢硬塞进你手里，看着你喝完。"
effects = [{ kind = "cash", value = 1250 }, { kind = "cash", value = 400 }, { kind = "affinity", person = "balam", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_balam_done" }, { kind = "memory", memory = "mem-request_balam-settle", title = "独木舟正中间的人" }]

# 三b、抽走的几袋盐：税被抽过，工钱比说好的少，那一瓢照样递过来。
[[tracks.chapters]]
key = "settle_partial"
title = "抽走的几袋盐"
text = "独木舟装满了，巴兰把货款一把一把数给你，工钱却比说好的少了一截。书记抽走的那几袋盐，他说算他自己的账，不让你替他担。数完钱，他从自己那一份里舀出一瓢东西：可可豆磨成的粉，掺了香草和辣椒，冲上热水。“过急流之前调的。”他把木瓢递过来，眼睛一直看着船，没看你。脚夫们把最后一袋盐扛上船，缆绳一根根收紧，船身压得低了些，他还是没回头。"
speaker = "captain"
mood = "tender"
at = "campeche"
objectives = [{ kind = "at", at = "campeche", text = "在坎佩切的海边" }]
when = [{ kind = "alive", person = "balam", value = true }]
news = "坎佩切的海边，一支装满盐的独木舟商队往内陆去了，领头的为官府抽走的几袋盐认了账。"

[[tracks.chapters.choices]]
key = "take_partial"
text = "收下货款，接过那一瓢，工钱的事不提了。"
next = "done"
reply = "他没争，把剩下的钱推过来。“那几袋盐，下回你来坎佩切，我替你记在可可账上。”"
effects = [{ kind = "cash", value = 900 }, { kind = "cash", value = 400 }, { kind = "affinity", person = "balam", value = 4 }, { kind = "flag", flag = "c13_request_balam_partial" }]

[[tracks.chapters.choices]]
key = "ask_partial"
text = "问他：少给的工钱，是不是替那几袋盐垫了？"
next = "done"
reply = "“是。”他说得很轻，“盐是我的，税也是我的。少给你的，下回来坎佩切，我从可可里补上。”"
effects = [{ kind = "cash", value = 900 }, { kind = "cash", value = 400 }, { kind = "affinity", person = "balam", value = 4 }, { kind = "flag", flag = "c13_request_balam_partial" }]
