# C13d 请托：母子与小箱子（故事 2.0，A5 / E37 契约；按 2026-10-12 的 C13d 总决定与任务单分片写）
# 人物：伊内丝·达·科斯塔 ines_costa（1540-07-19 生，cast 在 classmates_antwerp.toml）。里斯本河岸区船票铺的女人，葡萄牙商人团体书记的女儿，少女诗社的另一位创办人。
# 类型与报价：押运／带人（es），4 章。kind=request，auto=false（T 当面）：人物按日程在 lisbon，玩家用“问请托”（ask:request_ines_costa）启动；offer 章不写 at，目标是在港里找到她。
# 窗口：报价 1569-01-01 至 1590-06-30；offer 的 deadline 即窗口止日，到期走 timeout（next=failed，不写见闻）。pickup 起算 60 天，arrive 起算 150 天。
# 依据：史实背景——1560 年代葡萄牙对新基督徒的追查，新基督徒家庭经安特卫普投亲。只作街面上的影子（盯行李的人、“不该出海的东西”），正文与见闻不写机构名、不写宗教名。安特卫普葡萄牙商人团体的账房与汇票，属于当时的商业常识。
#   原创——母子两人、油布小箱子、戴黑帽的人、箱缝里的半张字条与口头禅、舅舅搬去城北、箍桶匠、拉罗谢尔的盐船。
#   待核：无。
# 读写的旗标：设 c13_request_ines_costa_accepted / _asked / _declined / _opened / _halfline / _done / _partial / _late（终局旗标每条只设一面：accepted 为接下，declined、done、partial、late 为结局，opened 与 halfline 为分支）。
#   读 c7_pair_ines_costa_sophie_lemaire_together（offer 的变体，只读，一句，不提人名）与 bond ines_costa 的等级（offer 的变体，只读）。不设任何 c7_ 旗标。
# 依赖：港口 lisbon、antwerp 都是现有港口，无 B10b 改名；无主线门禁（不读 c13_main_*）。
# 缺省走向：不接，寡妇另找船（declined，failed）。接了但 60 天内没到里斯本码头，母子搭盐船去拉罗谢尔，再自己北上（late，failed）。
#   到了海上，母子平安。到了安特卫普，找到舅舅（done，兑满）、找不到人但交给账房（partial，兑一半）；150 天内没到安特卫普，母子在拉罗谢尔下了船、自己北上，玩家收到一封信（late，failed）。
# 回忆插画清单：
#   mem-request_ines_costa-arrive「雨里的小箱子」：安特卫普雨夜的门口，舅舅开门，一只裹着油布的小箱子放在门槛内外之间。

[[tracks]]
key = "request_ines_costa"
name = "母子与小箱子"
kind = "request"
start = "offer"
auto = false
cast = ["ines_costa"]

# 报价：里斯本的船票铺。两张票，一个寡妇，一只不肯让人翻的箱子。
[[tracks.chapters]]
key = "offer"
title = "两张船票"
text = "伊内丝在河岸区的船票铺里把两张票举到窗前，一张一张对着光看，看完才收进袖子。票是替一个寡妇和她十岁的儿子买的，母子要去安特卫普投奔舅舅，行李只有一只裹着油布的小箱子。“码头上这几天总有人盯着谁家的行李，”她说，“有个戴黑帽的，老在问那条船几时开。”她没有多求，只提了一件：路上别让人翻那只小箱子。你问里面是什么，她说是孩子父亲的账，“别的，我没看。”说完，目光移到窗外的海上去了。"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "ines_costa", text = "在里斯本的船票铺里找到她" }]
deadline = [1590, 6, 30]
when = [{ kind = "date", from = [1569, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "ines_costa", ge = 18 }]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_ines_costa_declined" }]

[[tracks.chapters.choices]]
key = "take_them"
text = "让母子俩上我的船，箱子跟人一起走。"
next = "pickup"
effects = [{ kind = "affinity", person = "ines_costa", value = 2 }, { kind = "flag", flag = "c13_request_ines_costa_accepted" }]
reply = "她松了口气，却不肯显出来，只把两张票推回柜台：“船是你的，票就用不上了。路上的面包钱，留给他们娘俩。”她写了几行字，要你交给那位舅舅，折了两折，没有封口。"

[[tracks.chapters.choices]]
key = "ask_chest"
text = "先问清楚：箱子里到底装着什么，我才好替它挡人。"
next = "pickup"
effects = [{ kind = "affinity", person = "ines_costa", value = 2 }, { kind = "flag", flag = "c13_request_ines_costa_accepted" }, { kind = "flag", flag = "c13_request_ines_costa_asked" }]
reply = "她想了很久，说：“再想想。”然后真的没有再提。第二天一早她来码头，把箱子的油布又缠了一道，亲手递到你手里。那一道是缠给你看的。"

[[tracks.chapters.choices]]
key = "decline"
text = "这一趟我走不开，你另找船吧。"
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_ines_costa_declined" }]
reply = "她点点头，没有多问，把两张票又对着光看了一遍，才慢慢收进袖子。“这条船不好找，”她说，“我再想想。”"

# 变体：老同学的口气（bond ≥ C）；柜台上的诗本（读 c7 的 together，只一句，不提人名）。同时满足时取 both。
[[tracks.chapters.variants]]
key = "both"
when = [{ kind = "bond", person = "ines_costa", level = "C" }, { kind = "flag", flag = "c7_pair_ines_costa_sophie_lemaire_together" }]
text = "伊内丝在船票铺里见了你，先说：“你来得正好。”柜台上压着一本只写了一半的诗本。她没再绕弯子，把两张票拍在柜台上：一个寡妇，带着十岁的儿子，要去安特卫普投奔舅舅。码头上这几天有个戴黑帽的，老在问那条船几时开。她求你一件事：路上别让人翻那只小箱子。你问里面是什么，她说是孩子父亲的账，“别的，我没看。”"

