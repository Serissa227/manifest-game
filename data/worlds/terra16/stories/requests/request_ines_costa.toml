hint = "码头上的人说的是荷兰话，你只听得懂“城北”两个字。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "ines_costa", value = 8 }, { kind = "flag", flag = "c13_request_ines_costa_done" }, { kind = "memory", memory = "mem-request_ines_costa-arrive", title = "雨里的小箱子" }, { kind = "letter", person = "ines_costa", text = "船票钱我收回来了，剩下的面包钱，就算我欠你半行诗。" }]
