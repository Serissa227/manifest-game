# 上船：里斯本的码头，天没亮。黑帽子伸手去按搭扣。
[[tracks.chapters]]
key = "pickup"
title = "黑帽子"
text = "天还没亮，伊内丝把灯笼压低，站在跳板脚下，一句话也不说。寡妇抱着小箱子往上走，儿子攥着她的裙子。跳板头上早站着一个戴黑帽的人，自称替港口的公证人办事，要看箱子里有没有“不该出海的东西”。他的手已经按上了搭扣。水手们停了手里的活，都往这边看。伊内丝这才开口，声音压得很低：“他要看的是箱子，不是人。”又说，“别让他碰孩子。”"
at = "lisbon"
speaker = "captain"
mood = "tense"
news = "里斯本码头上，天没亮一条北上的船就开了，跳板头上有个戴黑帽的人站了很久。"
objectives = [{ kind = "at", at = "lisbon", text = "在里斯本的码头上" }]
deadline_days = 60
when = [{ kind = "alive", person = "ines_costa", value = true }, { kind = "date", from = [1569, 1, 1], to = [1590, 12, 31] }]

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "letter", person = "ines_costa", text = "母子俩等不到你的船，搭了一条去拉罗谢尔的盐船，再自己找路北上。箱子还在，人也平安。——伊内丝" }, { kind = "affinity", person = "ines_costa", value = -3 }, { kind = "flag", flag = "c13_request_ines_costa_late" }]
news = "里斯本码头上，一条去拉罗谢尔的盐船天没亮就开了，船上有个寡妇抱着个孩子。"

[[tracks.chapters.choices]]
key = "talk_him_down"
text = "跟他讲船规：上了跳板的货归船长管，要验去港务处验。"
next = "passage"
check = { attr = "eloquence", base = 20, per = 7 }
effects = [{ kind = "affinity", person = "ines_costa", value = 3 }]
fail = { next = "passage", effects = [{ kind = "affinity", person = "ines_costa", value = -2 }, { kind = "flag", flag = "c13_request_ines_costa_opened" }], news = "里斯本码头上，一个戴黑帽的人掀开寡妇的箱盖看了一眼，只见一摞账本，悻悻走了。孩子吓哭了。" }
reply = "他盯着你看了半晌，把手从搭扣上拿开，说：“那就去港务处见。”他走远了，寡妇才把箱子换到另一只手上，那只手一直在抖。伊内丝没有上前，只在跳板脚下轻轻吐出一口气。"

[[tracks.chapters.choices]]
key = "pay_custom"
text = "塞给他一点“码头的规矩”，请他去别处问。"
next = "passage"
requires = [{ kind = "cash", ge = 300 }]
hint = "身上的钱不够这份“码头的规矩”。"
effects = [{ kind = "cash", value = -300 }, { kind = "affinity", person = "ines_costa", value = 3 }]
news = "里斯本码头上，天没亮，有人往戴黑帽的人手里塞了一袋钱，那人就下了跳板。"
reply = "他把钱袋收进袖子，说这条船他今天没看见。孩子从母亲身后探出头，问那个人是不是走了。你说走了，上船吧。"

# 海上第七天：孩子不晕了，纸从箱缝里出来。
[[tracks.chapters]]
key = "passage"
title = "箱缝里的半行"
text = "出海第七天，孩子不晕了，趴在船舷上数海鸟。寡妇把小箱子抱在膝上，第一次跟你说起丈夫：他记账记到最后一天，账上还有安特卫普的人欠他们的钱。她记得伊内丝在码头上说过两句话：“到了海上再看。”“别在港口拆。”说完，寡妇把手指伸进箱缝里，抽出一张纸递过来，纸角已经被手心焐软了。纸上只有半行字，是伊内丝的笔迹，另半行空着。"
speaker = "captain"
mood = "tender"
objectives = [{ kind = "wait", days = 7, text = "出海第七天" }]
when = [{ kind = "alive", person = "ines_costa", value = true }, { kind = "date", from = [1569, 1, 1], to = [1590, 12, 31] }]

[[tracks.chapters.choices]]
key = "read_note"
text = "展开伊内丝的半张字条。"
next = "arrive"
requires = [{ kind = "affinity", person = "ines_costa", ge = 30 }]
hint = "寡妇把纸攥在手心，犹豫了一下又收了回去。伊内丝交代过，这张纸要交给跟她够熟的人。"
effects = [{ kind = "affinity", person = "ines_costa", value = 3 }, { kind = "flag", flag = "c13_request_ines_costa_halfline" }]
reply = "字条上写：“那种书有多重，我知道——我家里也有一本。”后面跟着一句：“剩下半行，归你。”你没有念出声，把纸折好收进怀里。寡妇什么也没问。"

[[tracks.chapters.choices]]
key = "teach_boy"
text = "教孩子认船上的绳结，让他别老盯着那只箱子。"
next = "arrive"
effects = [{ kind = "affinity", person = "ines_costa", value = 2 }]
reply = "孩子学会了两个结，第三个怎么也打不上，急得直咬嘴唇。他母亲在旁边看着，第一次笑了，说他父亲打结也是这么笨。"

# 安特卫普码头：舅舅不在。账房压着伊内丝写好的汇票。
[[tracks.chapters]]
key = "arrive"
title = "舅舅不在码头"
text = "安特卫普码头上没有人来接。葡萄牙商人团体的账房说，那位舅舅半年前搬去了城北，地址只有一个说荷兰话的箍桶匠知道。寡妇抱着箱子站在雨里，儿子拽着她的袖子问，舅舅是不是不要他们了。账房的书记把伊内丝早写好的一张汇票压在桌上，念着她的字：“人送到了，再兑。”又念，“箱子别在门口开。”书记念完，把汇票推到寡妇面前，没有去碰那只箱子。孩子的鞋湿透了，站在台阶上一步也不肯挪。"
at = "antwerp"
speaker = "captain"
mood = "tender"
news = "安特卫普码头上，一个从里斯本来的寡妇带着儿子，在雨里站了半天，后来有人领着他们去了城北。"
objectives = [{ kind = "at", at = "antwerp", text = "在安特卫普的码头上" }]
deadline_days = 150
when = [{ kind = "alive", person = "ines_costa", value = true }, { kind = "date", from = [1569, 1, 1], to = [1590, 12, 31] }]

