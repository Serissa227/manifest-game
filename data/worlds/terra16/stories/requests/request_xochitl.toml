# 三之二、没听懂：那个词只照了音，或者家里人只译出一个大概。
[[tracks.chapters]]
key = "reply_plain"
title = "没听懂的那个词"
text = "驮队头蹲在歇脚处的树荫底下等你。你把老人看了一下午的事说给他听，又把那个词照音念了一遍。他念得不准，念到一半自己先笑出来，记在本子上，说下一趟带上去问她。过了十来天，他又在歇脚处出现，怀里揣着她的回信。信里说，那一根确实是故意放反的，她想知道老人还看不看得出来。纸边蹭着一点黄颜料。"
when = [
  { kind = "alive", person = "xochitl", value = true },
  { kind = "date", to = [1590, 12, 31] },
]
at = "veracruz"
objectives = [{ kind = "at", at = "veracruz", text = "回韦拉克鲁斯的歇脚处等她的回信" }]
news = "韦拉克鲁斯的驮队歇脚处，驮队头从坎佩切回来，又带下一包墨西哥城的东西，油布包了三层。"

[[tracks.chapters.variants]]
key = "partial"
when = [{ kind = "flag", flag = "c13_request_xochitl_partial" }]
text = "驮队头靠着骡子等你。你把家里人的话说给他听：“他说好。”驮队头听得直挠头，说这可译不出什么来。他把那两个字抄在本子的最后一页，抄完又翻回前面，像是还在找别的字。又过了半个月，他带下来她的回信，信角上印着一小块黄颜料。她承认那一根是故意放反的，还问老人到底看不看得出来。"

[[tracks.chapters.variants]]
key = "ruffled"
when = [{ kind = "flag", flag = "c13_request_xochitl_ruffled" }]
text = "驮队头在歇脚处等你。你把码头上那阵海风说给他听，画上有几根细羽翘了起来，被你一根一根压回去。他听得直皱眉，说她要是知道，头一句就是骂你，骂完了还得自己补一根。半个月后，他带下来她的回信，油布上压着一道折痕。信里她承认那一根是故意放反的，还说：“翘起来的那几根，留着。”"

