# 请托：第一幅羽毛画（request_xochitl）。中文，Claude 写。
# 人物：霍奇特尔 xochitl（1540-09-07 生，女）。墨西加辅兵的女儿，母家在梅里达圣克里斯托瓦尔区，世代做羽毛活；1568 年起在墨西哥城的画坊学羽毛画。
# 类型：押运（escort）。托运的是一幅画，不发物品；路上没有检定打断，只在老人面前有两次选择。
#   章节：offer（报价）→ arrive（到坎佩切，老工匠看画）→ reply_words（听懂了，回信）或 reply_plain（没听懂的那一路，回信）；另有 done、failed。
#   收尾分成两章而不是一章加 requires：arrive 的三条路线分别走向听懂与没听懂，路由由 next 决定，变体只换一句话。
# 报价：L（来信）。驮队头是代理人（不新建 cast），在韦拉克鲁斯（veracruz）歇脚处交给你画箱与她的信；auto=true；
#   窗口 1568-01-01 至 1590-06-30；offer 的 deadline 即窗口止日，timeout 直接 failed，不写见闻。family=c13_offer_veracruz，冷却 20 天。
#   名声门槛未设（brief 未列）。
# 依据·史实：墨西加的羽毛工艺（amantecah）；殖民后墨西哥城的画坊继续做圣像与图样；尤卡坦的墨西加辅兵后代与母家的工匠；坎佩切与梅里达之间的海路与陆路。
#   待核的史实（正文一律传闻口吻）：墨西哥城画坊的确切年份与规模。
# 依据·原创：扁平木箱与三层油布、一尺见方的蜂鸟画、老工匠放反的那一根羽毛、驮队头与陆路、孙女替爷爷译话。
# 秘密：她做梦都想去墨西哥城，其实一次也没去过；可伊内斯走不了，她就不走。本请托不碰伊内斯，不写她们怎么去的，见闻不写。
# 读的旗标：c13_main_* 不读（不是主线人物）；bond xochitl（只在 offer 的变体里读，伊希那一路换开头一句）；c7_* 一概不读不设。
# 设的旗标：accepted（接下）、seen（offer 打开看过）、declined（回绝，终局 failed）、words（arrive 听懂）、partial（ask_family 没译清）、
#   ruffled（keep_dry 失败，海风翘起细羽）、late（arrive 超时，终局 failed）、done（reply 收尾，终局 done）。reply_plain 的变体读 partial 与 ruffled。
# 依赖：港口 veracruz、campeche 已存在；人物 xochitl（cast/classmates_merida.toml）；技能 lang_nahuatl（skills.toml）。不依赖 B10b 改名。
# 回忆插画：mem-request_xochitl-reply（放反的那一根羽毛）：韦拉克鲁斯歇脚处，木箱开着一角，一根蜂鸟羽毛换个角度从绿变金。

[[tracks]]
key = "request_xochitl"
name = "第一幅羽毛画"
kind = "request"
start = "offer"
auto = true
cast = ["xochitl"]

# 一、画箱：驮队头在韦拉克鲁斯递来一只木箱和一封信。
[[tracks.chapters]]
key = "offer"
title = "画箱"
text = "韦拉克鲁斯的驮队歇脚处，一头骡子背上卸下一只扁平的木箱，外面包着三层油布。驮队头把箱子放在你脚边，又递过来一封信。“这算什么？墨西哥城的比这大十倍。”他念第一句，自己先笑了一声。信里说，这是她做的第一幅羽毛画，小得可怜。母家梅里达有个老工匠病了，想在死前看一眼。信的末尾她添了一行：“画到了，请你听老人说什么，一个字一个字带回来。他说难看，也带回来。”"
when = [
  { kind = "date", from = [1568, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "xochitl", ge = 18 },
]
at = "veracruz"
objectives = [{ kind = "at", at = "veracruz", text = "在韦拉克鲁斯的驮队歇脚处" }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_veracruz"
family_cooldown_days = 20

[[tracks.chapters.variants]]
