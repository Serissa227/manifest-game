# 三之一、听懂了：纳瓦特语或家里人译出来的那一路，老人的话带得回去。
[[tracks.chapters]]
key = "reply_words"
title = "放反的那一根"
text = "驮队头又在歇脚处等你。你把老人的话一句一句说给他听，他记在本子上，嘴里跟着念了两遍，说下一趟就带上去。他说话的时候一直看着木箱的方向，像是箱子还在他背上。半个月后，他带下来一封她的回信，和画箱一样包着三层油布。信里她写：那一根确实是故意放反的，“我想知道他还看不看得出来。”信纸角上沾着一点黄颜料，没擦干净。"
when = [
  { kind = "alive", person = "xochitl", value = true },
  { kind = "date", to = [1590, 12, 31] },
]
at = "veracruz"
objectives = [{ kind = "at", at = "veracruz", text = "回到韦拉克鲁斯的歇脚处" }]
news = "韦拉克鲁斯的驮队歇脚处，一封墨西哥城来的信里夹着一根蜂鸟羽毛。"

