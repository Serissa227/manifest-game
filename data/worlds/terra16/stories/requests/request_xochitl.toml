effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "xochitl", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_xochitl_done" }, { kind = "memory", memory = "mem-request_xochitl-reply", title = "放反的那一根羽毛" }]

