# 二、老人的手：坎佩切的码头边，老工匠看画。一句墨西加话，听懂与否分两路。
[[tracks.chapters]]
key = "arrive"
title = "老人的手"
text = "坎佩切的码头边，一张草席铺在石头上，老工匠坐在上面，膝上盖着毯子。家里人从梅里达把他抬下来，就为了让他在海边看一眼。你把画箱打开，他的手一下子就不抖了，用指甲轻轻拨动蜂鸟翅膀上的一根羽毛。他说了一句很长的话，你只抓住了其中的一个词。那是墨西加人的话，他说得很慢，像是怕惊着画。"
speaker = "captain"
mood = "sad"
when = [
  { kind = "alive", person = "xochitl", value = true },
  { kind = "date", to = [1590, 12, 31] },
]
at = "campeche"
objectives = [{ kind = "at", at = "campeche", text = "到坎佩切的码头" }]
news = "坎佩切的码头边，梅里达来的老工匠对着一幅小小的羽毛画看了一下午。"
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "xochitl", value = -3 }, { kind = "flag", flag = "c13_request_xochitl_late" }, { kind = "letter", person = "xochitl", text = "画是驮队头走陆路送去的。老人看到了。他说了什么，没人记。——霍奇特尔" }] }

[[tracks.chapters.choices]]
key = "in_nahuatl"
text = "用纳瓦特语请他再说一遍，一字一字记下来。"
next = "reply_words"
requires = [{ kind = "skill", skill = "lang_nahuatl", ge = 60 }]
hint = "你只听出一个“羽毛”"
reply = "他的手停在那根羽毛上，慢慢又说了一遍。“这一根放反了，放反了，光才从下面来。”他笑了，说她是故意的，“我教她的时候，她就爱放反。”我一个字一个字记下来。"
effects = [{ kind = "affinity", person = "xochitl", value = 3 }, { kind = "flag", flag = "c13_request_xochitl_words" }]

[[tracks.chapters.choices]]
