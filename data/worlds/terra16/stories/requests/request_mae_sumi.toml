# 三、北大年的老水手：港口边补网的人，那条船上活下来的两个人之一。
[[tracks.chapters]]
key = "trace"
title = "北大年的老水手"
text = "北大年的港口边，一个老水手蹲在网堆里补网，说的话一半是琉球话，一半是马来话。他是那条使船上活下来的两个人之一，另一个前几年死了，葬在这里。“船是在风里散的。”他手没停，“落水的几个，我到现在还记得他们的名字。”他早就想托人往家里捎个话，可这些年没有一条琉球船来过北大年。“你是头一个拿着名单来问的人。”"
speaker = "captain"
mood = "sad"
at = "pattani"
objectives = [{ kind = "at", at = "pattani", text = "到北大年去" }]
when = [
  { kind = "date", from = [1564, 1, 1], to = [1575, 8, 24] },
  { kind = "alive", person = "mae_sumi", value = true },
]
deadline_days = 90
timeout = { next = "report_partial" }

[[tracks.chapters.choices]]
key = "take_word"
text = "请他把船上每个人最后的样子讲一遍，我一个个记下。"
next = "report"
reply = "他讲了一个下午：谁在风里落了水，谁上岸后病了，谁跟着一条唐人船走了，不知去向。你在名单上每个名字后面，写下一句他说的话。"
news = "北大年港口补网的老水手，讲了一个下午，把那条琉球使船上的人一个个说给远来的船长听。"
effects = [{ kind = "affinity", person = "mae_sumi", value = 3 }]

[[tracks.chapters.choices]]
key = "offer_passage"
text = "问他要不要搭我的船回那霸。"
next = "report"
reply = "他想了很久，摇头。他的孩子在这里，孙子也在这里。他让你把他补网的一根竹梭带回去，交给他姐姐。"
news = "北大年港口补网的老水手，托一个远来的船长往那霸带了一根竹梭，说是给他姐姐的。"
