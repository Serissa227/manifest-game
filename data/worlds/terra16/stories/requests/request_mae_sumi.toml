# 请托：没有回来的使船（request_mae_sumi）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：真栄澄（mae_sumi，1540-12-16 生，女），那霸祝女亲族的女孩，替出海人家写家书；cast 在 cast/classmates_custom_naha_envoy.toml。
#   C7 的 tie_new_kogo_mae_sumi（与小督）与 bond_mae_sumi 不在本文件写；不写小督，不写给京都的信。
# 类型：去某处（go）。五章：offer（报价）、arrive（大城的老掌柜）、trace（北大年的老水手）、report（名簿的落款）、report_partial（半页落款）。终点 done / failed。
# 报价：当面（auto=false，玩家在那霸问她：ask:request_mae_sumi 启动）。offer 不写 at，objectives 为 person；deadline 为 1574-06-30，timeout 直接 failed，不写见闻。
# 窗口：以 when 的 date 条件表达（普通章不写 window）。offer 1564-01-01 至 1574-06-30；arrive 进入后 150 天、trace 进入后 90 天的期限；report 与 report_partial 1564-01-01 至 1575-08-24。
# 依据·史实背景：琉球与暹罗的进贡、贸易往来到 16 世纪中后期渐衰；大城 1569 年被缅军攻陷（只作 arrive 的变体一句）；北大年是南洋的港口。
# 依据·原创：使船的失踪、名簿、大城商馆的老掌柜、河边卖饭的厨子、北大年补网的老水手、竹梭。使船的年份不写数字。
# 依赖：港口 naha（ports_east_asia.toml）、ayutthaya_port 与 pattani（ports_southeast_asia.toml）；技能 lang_ryukyuan（skills.toml）；人物 mae_sumi。B10b：无需改名。主线门禁：无。
# 读的旗标：bond mae_sumi ≥ C（offer 的变体，只改开场）；arrive 的变体只读日期。不读也不设任何 c7_ 旗标。
# 设的旗标：c13_request_mae_sumi_accepted（offer 两条接法）、_declined（offer 回绝，终局）、_families（offer 问“还有人在等吗”，只被 report 的变体读）、_cook（arrive 认出厨子的两条接法）、_passage（trace 问他要不要搭船，只被 report 的变体读）、_late（arrive 超时，终局）、_done（终局）、_partial（终局）。
# 分支结构：arrive 的三条接法都进 trace；trace 的两条接法都进 report，超时进 report_partial。report 与 report_partial 的选项都不写 requires，所以不会卡在别的路径设的旗标上。report 的三个变体按 key 字母序写（v1_both、v2_families、v3_passage），同时成立时取 v1_both，只改文字。
# 秘密：她另抄名字的事一句不写，只写“那条使船的名簿”。见闻不写任何秘密。
# 口头禅：“回来时，也把故事带回来。”只在 offer 章（及其 bond 变体）送你到码头时说一次。
# 报酬：现金最多 1250（只带回厨子的话 800）；好感最多 +16；名声 +1；回忆 mem-request_mae_sumi-report。
# 回忆插画清单：
#   mem-request_mae_sumi-report「名簿上的落款」：祝女家廊下，名簿摊开，整页的名字底下第一次有了一行落款；页角压着一根补网用的竹梭。

[[tracks]]
key = "request_mae_sumi"
name = "没有回来的使船"
kind = "request"
start = "offer"
auto = false
cast = ["mae_sumi"]

# 一、名簿上的一条船：真栄澄在祝女家的廊下等你，名簿翻在那条使船的一页上。
[[tracks.chapters]]
key = "offer"
title = "名簿上的一条船"
text = "真栄澄在祝女家的廊下等你。膝上摊着一本名簿，翻开的那一页，整页的名字下面都没有落款。“那条使船，十年前去暹罗，出了港就再没消息。”她先问你这一趟的风大不大，又问船上有没有带家书，才说到正事。“那霸半个港口的心事，我都知道。这一页，我写不下去。”她请你去大城，到琉球人常去的商馆里问，把问到的名字一个个带回来。送你到码头时，她说：“回来时，也把故事带回来。”"
speaker = "captain"
mood = "tender"
objectives = [{ kind = "person", person = "mae_sumi", text = "在那霸找到她" }]
when = [
  { kind = "date", from = [1564, 1, 1], to = [1574, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "mae_sumi", ge = 18 },
]
deadline = [1574, 6, 30]
timeout = { next = "failed" }

