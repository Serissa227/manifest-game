# 二、大城的老掌柜：商馆里的旧账，河边卖饭的厨子。
[[tracks.chapters]]
key = "arrive"
title = "商馆的老掌柜"
text = "大城河边一排排商馆，琉球人常去的那一间，老掌柜还记得那条使船。船出了湄南河口，遇上风，一路漂到南边去了。“听人讲，有几个人上了北大年的岸。”他说这话时没有抬头，只把旧账本压在手底下。“船上的厨子，当年没上那条船。他病在了大城，就留下来，在河边卖饭。”"
speaker = "captain"
mood = "mystic"
at = "ayutthaya_port"
objectives = [{ kind = "at", at = "ayutthaya_port", text = "到大城去" }]
when = [
  { kind = "date", from = [1564, 1, 1], to = [1575, 8, 24] },
  { kind = "alive", person = "mae_sumi", value = true },
]
deadline_days = 150
timeout = { next = "failed", effects = [{ kind = "affinity", person = "mae_sumi", value = -3 }, { kind = "flag", flag = "c13_request_mae_sumi_late" }, { kind = "letter", person = "mae_sumi", text = "大城来的商人捎话，说商馆换了人，没人记得那条使船了。名簿那一页，我先不写落款。——真栄澄" }] }

[[tracks.chapters.variants]]
key = "v1_fallen"
when = [{ kind = "date", from = [1569, 8, 30] }]
text = "城破以后，大城河边的商馆空了一半，门口还贴着没揭的封条。琉球人常去的那一间，老掌柜还守着。“城破那年，走了很多人。”他说，“剩下的，都是走不动的。”他还记得那条使船，出了湄南河口，遇上风，一路漂到南边去了。“听人讲，有几个人上了北大年的岸。”河边卖饭的那个厨子还在，他当年没上那条船。"

