# C13d 请托：白海的岬角（request_abraham_ortelius）。中文，Claude 写。
# 人物：亚伯拉罕·奥特柳斯 abraham_ortelius（1527-01-01 生，男；安特卫普的地图上色匠与地图商，势力 netherlands，身份档 2）。
#       cast 在 cast/historical_01_europe.toml，日程 1553—1590 在安特卫普（trading_house）。
# 类型：混合（mx）；6 章：offer → desk → voyage → proof →（挑出错）settle / （没挑出）settle_b。没有 stage 章，因此没有 window 与 default。
# 结局分两章而不用 requires 旗标：旗标门禁的选项在无法满足时，分支检查会报错（准备动作里没有设旗标的办法），所以 done 与 partial 各走自己的收尾章。
# 报价：当面（T）。auto=false，玩家“问请托”（ask:request_abraham_ortelius）启动；offer 章不写 at，目标是在他的工作间找到他。
# 规划窗口（不进 TOML）：报价 1568-01-01 至 1569-09-30，逾期走 failed；案头约 1568—1569；白海 1568-05 至 1570-03，期限 240 天；校样 1569-06-01 之后；收尾 1570-05-20 之后。
# 依据：
#   史实——1555 年莫斯科公司成立，圣尼古拉锚地启用，英格兰商站设在那里；1570 年 5 月《寰宇概观》在安特卫普出版；奥特柳斯的工作间、圣路加行会、妹妹安娜替地图上色，都是他这一生的事。
#   原创——请托本身、三种说法对不上的白海岬角、修士与商人的口供、校样上那一处错、英格兰商站的名册。白海岬角的具体地名对应只写“各自的叫法”（待核）。
# 不碰：C7 的彼得与爱尔兰（pair 艾希林×彼得）；不说谁的稿进了图集；冰上的事；cast 里写的那个团体。忧郁只作 desk 章的一句闲笔。
# 读的旗标（只读）：c13_main_lieve（offer 章 variants，主角学生时代在上色坊帮过忙；由主线设）。
# 设的旗标（全部为 c13_request_abraham_ortelius_<事件>）：accepted / declined（offer）；matched（desk）；signed / english（voyage）；late（voyage 超时）；spotted（proof）；done / partial（settle）。
# 依赖：B10b 日程与港口 antwerp、st_nicholas；奖励物 ortelius_antwerp（items/books_03_geography_02.toml）；案头 requires 的 carta_marina_venice（items/books_09_natural_history.toml，只查持有、不扣）；技能 lang_german、cartography；检定属性 eloquence、numeracy。
# 回忆插画：mem-request_abraham_ortelius-settle，工作间里一捆捆刚装订的新书，安娜在窗下给北方那一页上色，桌上摊着校样。

[[tracks]]
key = "request_abraham_ortelius"
name = "白海的岬角"
kind = "request"
start = "offer"
auto = false
cast = ["abraham_ortelius"]

# 一、北边那串问号：1568—1569 年，工作间里，他把白海的事摊给你。
[[tracks.chapters]]
key = "offer"
title = "北边那串问号"
text = "奥特柳斯的工作间在安特卫普圣路加行会附近的一条窄巷里，窗子朝南，光很好。妹妹安娜坐在窗下，给一张地图的海岸线上色，笔尖蘸得很轻。他自己在另一张大图的北边画了一串问号，问号一直拖到纸边。“你来得正好。上个月市政厅的晚宴上，一位伦敦来的大人还问我，白海那边到底有没有岬角。”他把笔搁回砚台上，“英格兰人、尼德兰人、俄国人叫的都不一样。没有名字的岬角，我画了也是瞎画。”他想先跟你对一对案头的几张旧图，再请你去一趟圣尼古拉锚地。"
mood = "cheerful"
when = [{ kind = "age", ge = 17 }, { kind = "date", from = [1568, 1, 1], to = [1569, 9, 30] }, { kind = "alive", person = "abraham_ortelius", value = true }]
objectives = [{ kind = "person", person = "abraham_ortelius", text = "在他的工作间找到他" }]
deadline = [1569, 9, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "lieve"
when = [{ kind = "flag", flag = "c13_main_lieve" }]
text = "奥特柳斯的工作间在安特卫普圣路加行会附近的一条窄巷里。妹妹安娜坐在窗下，给一张地图的海岸线上色。他一见你就笑：“你学生时代来上色坊帮过忙，那会儿你的手就比颜料稳。”说着他在另一张大图的北边画了一串问号，问号拖到了纸边。“白海那一带，英格兰人、尼德兰人、俄国人叫的都不一样。”他想先跟你对一对案头的几张旧图，再请你去一趟圣尼古拉锚地。"

[[tracks.chapters.choices]]
