effects = [{ kind = "flag", flag = "c13_request_abraham_ortelius_declined" }]

# 二、几张打架的旧图：案头，三个名字对一对。
[[tracks.chapters]]
key = "desk"
title = "几张打架的旧图"
text = "几张北方的旧图摊满了桌子。有拉丁文的，有德意志字的，还有一张是手绘的，海岸边抄着几行看不懂的西里尔字母。岬角的名字在图上互相打架：这张叫它一个名字，那张把它挪到了河对岸。奥特柳斯端着杯温啤酒来回踱步。“一个一个对。对不上的空着，别替它瞎编；每个名字都要注明是谁说的。”他前几天没出门，安娜悄悄跟你说，他又犯了那阵子的忧郁，今天才肯下楼。他请你帮他把它们对齐。"
speaker = "captain"
mood = "cheerful"
when = [{ kind = "alive", person = "abraham_ortelius", value = true }]
objectives = [{ kind = "person", person = "abraham_ortelius", text = "去安特卫普找奥特柳斯" }]

[[tracks.chapters.choices]]
key = "carta"
text = "拿出你那部奥劳斯·马格努斯的《海图》，铺在旁边对"
next = "voyage"
requires = [{ kind = "item", item = "carta_marina_venice", qty = 1 }]
hint = "你手里没有那部北方的大图，这一条对不了。"
reply = "你把《海图》铺在桌子另一头，一个岬角一个岬角地对。对到第三处，三种名字原来是同一个地方。奥特柳斯的手指在木版的鲸鱼上停了很久，才挪开。"
effects = [{ kind = "affinity", person = "abraham_ortelius", value = 3 }, { kind = "flag", flag = "c13_request_abraham_ortelius_matched" }]

[[tracks.chapters.choices]]
key = "german"
text = "替他念德意志图上的地名"
next = "voyage"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_german", ge = 60, hard = true }]
hint = "那几个德意志地名你念不出来，念错了他更难对。"
reply = "你从最北的那张念起，念到第四个，他拍了一下桌子。“就是这个！抄手把 Kap 抄成了 Kaap，两张图都照着错的念。”"
effects = [{ kind = "affinity", person = "abraham_ortelius", value = 3 }, { kind = "flag", flag = "c13_request_abraham_ortelius_matched" }]

[[tracks.chapters.choices]]
key = "ask_there"
text = "说你看不懂，直接去白海问。"
next = "voyage"
reply = "他叹了口气，把图往你那边推了推。“看不懂就去问，问到了再回来对。问不到的，就空着。”"

# 三、圣尼古拉锚地的口供：白海，三种说法，要一个肯画押的人。
[[tracks.chapters]]
key = "voyage"
title = "圣尼古拉锚地的口供"
text = "圣尼古拉锚地只有一座修道院、几排仓房，还有英格兰人的商站。木码头边堆着一排鳕鱼桶，几个水手在晒网。你拿着奥特柳斯的单子，挨个问岬角的名字：英格兰商站的通事说一个，修道院的修士说一个，从霍尔莫戈雷来的商人又说一个。三种说法都对不上。奥特柳斯要的是一个肯在记录上画押的人，不然他一个字也不敢印。"
speaker = "captain"
mood = "tense"
at = "st_nicholas"
when = [{ kind = "alive", person = "abraham_ortelius", value = true }]
objectives = [{ kind = "at", at = "st_nicholas", text = "到圣尼古拉锚地去" }]
deadline_days = 240
timeout = { next = "failed", effects = [{ kind = "affinity", person = "abraham_ortelius", value = -3 }, { kind = "flag", flag = "c13_request_abraham_ortelius_late" }, { kind = "letter", person = "abraham_ortelius", text = "白海那一页我先照旧图印了，岬角还是老样子。你要是后来问到了，寄个口信来，我另排一版。" }] }

[[tracks.chapters.choices]]
key = "witness"
text = "请修道院的一位修士当见证人"
next = "proof"
check = { attr = "eloquence", base = 20, per = 7 }
fail = { next = "proof", effects = [{ kind = "affinity", person = "abraham_ortelius", value = -2 }], news = "圣尼古拉锚地的修士只肯口述北方的岬角名字，不肯在记录上画押，说修道院不管这种账。" }
reply = "你把单子摊在修士面前，把每个名字念给他听。他看了很久，手指按着纸角，没有立刻说话。"
effects = [{ kind = "affinity", person = "abraham_ortelius", value = 3 }, { kind = "flag", flag = "c13_request_abraham_ortelius_signed" }]
news = "圣尼古拉锚地的一位修士替船长在岬角名字旁画了十字，说这样记录上有人负责。"

[[tracks.chapters.choices]]
