# 四、挑一处错：安特卫普，校样上北方那一页，他要你挑错。
[[tracks.chapters]]
key = "proof"
title = "挑一处错"
text = "他的工作间里堆着一摞刚刷好的校样，北方那一页上，白海的岬角已经有了名字。页边空着，没有人替这些名字签过字。墨迹还没干透，纸角沾着安娜的手印，旁边压着一罐松节油。奥特柳斯把校样推到你面前：“挑一处错。”书再过几个月就要印了，他说这话时没有笑。"
speaker = "captain"
mood = "tense"
at = "antwerp"
when = [{ kind = "alive", person = "abraham_ortelius", value = true }, { kind = "date", from = [1569, 6, 1] }]

