# 三、两个名字：修士的笔记本。最好的结局给回忆；让他添一段则是另一种结局。
[[tracks.chapters]]
key = "report"
title = "两个名字"
text = "修士的笔记本已经厚得合不拢，每一页都有他自己画的小图。他听你讲，一边听一边记，每种草记两个名字。记到第三种，他的笔停住了，眼睛却亮起来：“那树皮是不是巫师用来害人的？”北边有人这么说过，他想在旁边添一句。笔尖悬在纸上，等你点头。"
