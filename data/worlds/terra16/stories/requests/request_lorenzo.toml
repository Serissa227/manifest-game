# 二、另一种叫法：得土安的安达卢斯人街区，信上的名字在这里不认得。
[[tracks.chapters]]
key = "handover"
title = "另一种叫法"
text = "得土安的安达卢斯人街区，巷子窄得两个人要侧着身子才过得去。门楣上还留着格拉纳达的花样，石头被手摸得发亮。码头上他说：“这是这边的人写给那边的。”又说：“回信要带回来。”我拿着信一家家问，卡斯蒂利亚话的名字，这里的人摇头，有的关上了门。问到第五家，一个老人从门后探出半张脸，看了看我手里的信封，说：“这里的人到了这边，都换回了原来的名字。你得知道他们原来叫什么。”我把信封一封封递过去，他接过来，眯着眼看背面，看完又回头朝门里喊了一声。“先在这儿等着。”"
speaker = "captain"
mood = "sad"
at = "tetouan"
objectives = [{ kind = "at", at = "tetouan", text = "在得土安" }]
when = [{ kind = "alive", person = "lorenzo", value = true }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "lorenzo", value = -3 }, { kind = "flag", flag = "c13_request_lorenzo_late" }, { kind = "letter", person = "lorenzo", text = "信我托修士的船带去了。回信来了三封，有一封只有一个名字。——洛伦索" }] }
news = "得土安的安达卢斯人街区，有人拿着一包马拉加来的信，一家家用原来的名字去问。"

[[tracks.chapters.choices]]
key = "read_names"
text = "看信封背面写信人用阿拉伯字母补写的小字，照着去问。"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
requires = [{ kind = "skill", skill = "lang_arabic", ge = 60, hard = true }]
hint = "信封背面有几行小字，你一个也认不出"
next = "reply_seven"
reply = "信封背面果然有小字，写的是原来的名字。照着它一家家问下来，八封里有七封找到了人，第八封的人家没找到。"
effects = [{ kind = "affinity", person = "lorenzo", value = 3 }, { kind = "flag", flag = "c13_request_lorenzo_seven" }]

[[tracks.chapters.choices]]
