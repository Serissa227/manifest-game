# 请托：海峡两岸的名字（request_lorenzo）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：洛伦索（lorenzo，1540-04-01 生，男），摩里斯科人家的孩子，侯爵府的侍童，在马拉加的码头上替人递信；势力 spain，身份档 1。cast：cast/classmates_seville.toml。
# 类型：送信（letter）。任务单写的是三章，实际是五章：offer（报价）、handover（送到得土安，问名字）、reply_seven（送到七家，当面结账，可以讲那些名字）、reply（托管事的人送回信，当面结账）、reply_few（只认出三家，只送到三家）。
#   多出的几章是引擎的限制：请托不能用本轨道在别的分支上设的旗标做 requires，所以“送到七家”“托人转交”“只送到三家”各自走 next 到自己的终局章；variants 只能改文字，改不了报酬。
# 报价：V（到访）。洛伦索从格拉纳达下到马拉加的港口（malaga），auto=true；窗口 1570-01-01 至 1590-06-30；offer 写 family=c13_offer_malaga，冷却 20 天；玩家满 17 岁、洛伦索满 18 岁。
#   offer 的 deadline 为窗口止日，timeout 直接 failed，不写见闻（没人知道这件事没成）。
# 进行中：handover 章 deadline_days=90，超时走 failed，来信一封，好感 -3，旗标 _late。reply、reply_seven、reply_few 是普通章，可以一直等。
#   handover 没有 stage，所以不写 default；超时的结果由 timeout 承担。
# 依据·史实背景：1568—1571 年阿尔普哈拉斯起义以后，格拉纳达的摩里斯科人被迁散到卡斯蒂利亚各地，也有人渡海去了北非（得土安）；海峡两岸的家人靠商船与赎俘修士带信。迁散只作背景，不写起义的战事。
# 依据·原创：八封信与七家的数目，老人一家家用原来的名字喊门的办法，街坊替不在的人写回的新名字，卖枣子的老太太。
# 待核：卡斯蒂利亚话的名字与阿拉伯话原名之间的对应，正文只写传闻口吻。
# 秘密：夜里读母亲留下的阿拉伯文，正文里他不碰阿拉伯字；见闻一律不写。信封背面的小字是玩家读的（read_names 要 lang_arabic ≥ 60），不是洛伦索读的。
# 读的旗标：bond lorenzo ≥ C（offer 的变体，只读）。不设任何 c7_ 旗标；不写迭戈与诺埃尔（C7），不写“念名字给岸上的家人”（归 bond_lorenzo）。
# 设的旗标：c13_request_lorenzo_accepted（offer 接下）、_declined（offer 回绝）、_seven（送到七家；本轨道内不读，留给之后的变体）、_few（只送到三家）、_late（handover 超时）、_done（reply_seven 与 reply 终局）、_partial（reply_few 终局）。
# 不用 relation / tie / bond / heart 效果；bond 只作条件读取。
# 报酬：工钱最多 1250（只送到三家 700）；好感最多 +13（接下 +2、送到七家 +3、讲述 +8）；名声 +1；回忆 mem-request_lorenzo-reply。无物品奖励。
#   名声与回忆按任务单写在各条终局上；reply_few 的变体只改工钱与终局旗标。
# 依赖：港口 malaga（ports_iberia.toml）、tetouan（ports_north_africa.toml）；技能 lang_arabic（skills.toml）；属性 eloquence；人物 lorenzo。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_lorenzo-reply「只写一个名字的回信」：马拉加的码头上，一封回信背面只写着一个名字，洛伦索把它举到光里，看了很久。

[[tracks]]
key = "request_lorenzo"
name = "海峡两岸的名字"
kind = "request"
start = "offer"
auto = true
cast = ["lorenzo"]

# 一、一包家信：马拉加的码头上，洛伦索从山路下来，第一句就是猜你的来处。
[[tracks.chapters]]
key = "offer"
title = "一包家信"
text = "马拉加的码头上，一个穿旧呢子外套的年轻人从山路上下来，老远就朝我招手。他先笑，笑完说：“让我猜猜，你是打哪儿来的？”没等我答，他自己点了点头：“打海边来的，不是打城里。”说完才把手里的布包往我怀里一塞。包里是一叠信，每封的信封上都写着名字。阿尔普哈拉斯以后，格拉纳达的人家散了，有的被赶去卡斯蒂利亚的村子，有的渡海去了得土安。“这是这边的人写给那边的。”他说，“回信要带回来。有的回信只有一个名字，那也是回信。”"
speaker = "captain"
mood = "sad"
at = "malaga"
objectives = [{ kind = "at", at = "malaga", text = "在马拉加的码头上" }]
when = [{ kind = "date", from = [1570, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "lorenzo", ge = 18 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_malaga"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "bond_c"
when = [{ kind = "bond", person = "lorenzo", level = "C" }]
