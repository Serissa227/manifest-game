# 三a、只有一个名字的回信（送到七家）：洛伦索看着那封只写了名字的回信，玩家替他一家家问过。
[[tracks.chapters]]
key = "reply_seven"
title = "只有一个名字的回信"
text = "马拉加的码头上，洛伦索又下到港口来接我。回信是一包，用绳子捆着，我递过去，他一封一封看信封，看得很慢。看到其中一封，他停住了：信封上只写了一个名字，别的什么也没有。那是第八封信的回信。收信的人没找到，街坊替那个人写了一个名字回来，是他在那边新起的名字。洛伦索把那一封举到光里看了很久，才说：“说明他还在。”"
speaker = "captain"
mood = "tender"
at = "malaga"
objectives = [{ kind = "at", at = "malaga", text = "在马拉加，等洛伦索再下到港口" }]
