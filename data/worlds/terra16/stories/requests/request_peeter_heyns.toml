# 二、河口的夜：书箱已经装上船，出斯海尔德河口的法子由你定。
[[tracks.chapters]]
key = "river"
title = "河口的夜"
text = "斯海尔德河下游两岸的堡垒都换了旗子，夜里河面上的巡船灯一盏接一盏地移，移得很慢，像在数船。书箱已经装上了船，一箱压着一箱，最上面那箱的盖子没钉牢，习字本的边角露在外头。三个女孩挤在箱子中间，最小的那个抱着一只布偶，不肯松手，布偶的一只眼睛已经掉了线。舵手把灯压低，等你开口：这条河口，你打算怎么出去？"
speaker = "captain"
mood = "tense"
cast = ["peeter_heyns"]
at = "antwerp"
when = [{ kind = "alive", person = "peeter_heyns", value = true }]
deadline = [1584, 12, 31]
timeout = { next = "failed", effects = [{ kind = "affinity", person = "peeter_heyns", value = -3 }, { kind = "flag", flag = "c13_request_peeter_heyns_late" }, { kind = "letter", person = "peeter_heyns", text = "河口的事没等到你，我另找了一条船。孩子们平安到了汉堡，书也都在。" }], news = "安特卫普的码头上，一位老校长等了好些日子，最后托人找到一条船，书箱和三个女孩都运走了。" }

