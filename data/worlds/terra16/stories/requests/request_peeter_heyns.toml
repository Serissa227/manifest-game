# 四、一张歪歪的纸条：几个月后，人在别处，信辗转到你手里。
[[tracks.chapters]]
key = "letter"
title = "一张歪歪的纸条"
text = "几个月后，一封信辗转到了你手里，是海恩斯的字，写得比从前急，纸角还溅了几点墨。他说学生们散得像一箱没扣牢盖的书，这本掉在汉堡，那本落在伦敦。他自己也要走了，“月桂树”的招牌带不走，课本带走了，长凳送了人，只剩讲台边那把戒尺，他没舍得扔，装进了箱子。信里还夹着一张纸条，三个女孩合写的，字一个比一个歪，每人写了一行。"
mood = "tender"
when = [{ kind = "alive", person = "peeter_heyns", value = true }]
objectives = [{ kind = "wait", days = 60, text = "等老校长的回信" }]

