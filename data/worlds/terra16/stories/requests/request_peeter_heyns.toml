# C13d 请托：月桂树的书箱（request_peeter_heyns）。中文，Claude 写。
# 人物：彼得·海恩斯 peeter_heyns（1537-01-01 生，男；安特卫普“月桂树”女子法语学校的校长，1555 年开办，势力 netherlands，身份档 1，风险高，现金 1600）。
# 类型：押运／带人（es）；4 章：offer → river → arrive → letter。没有 stage 章，因此没有 window / default。
# 报价：当面（T）。人物按日程在安特卫普（antwerp），auto=false，玩家“问请托”（ask:request_peeter_heyns）启动；offer 章不写 at。
# 窗口：报价 1584-01-15 至 1584-11-30（offer 的 deadline 为 1584-11-30，过期走 timeout，不写见闻）；河口 river 的 deadline 为 1584-12-31（过期走 timeout，见闻在安特卫普）；arrive 进入后 90 天；letter 等 60 天。
# 地点：安特卫普 antwerp（报价与河口）；汉堡 hamburg（到达）。法兰克福与伦敦只在正文里提到，不设章节。
# 依据：史实背景，1584 年帕尔马的人马围住安特卫普，先夺下斯海尔德河两岸的堡垒，9 月起在河上打桩架浮桥（1585 年 2 月合龙）；城破后新教徒大批北迁，海恩斯 1585 年出走（cast 注明行踪留空）。
#   本请托只写 1584 年这一船书与三个寄宿的女孩；浮桥只在 1584-09-01 以后的 bridge 变体里提一句；不写 1585 年合龙与燃烧船（归莉芙主线）。
#   原创：请托本身、三个女孩的样子、河口的军士、汉堡的接应人与教会执事、汉堡码头的人物与地名以外的细节。
# 读的旗标（只读，不设）：c13_main_lieve（offer 的 lieve 变体，主线接口旗标，由 C13 的主线第一章设）；bond ines_costa / ursula（C 级，offer 的变体，只提一句）。
# 设的旗标：c13_request_peeter_heyns_accepted / declined / done / partial / late；分支旗标 c13_request_peeter_heyns_detour（河口的夜里被巡船逼回，绕内河）。
# 依赖：cast/historical_01_europe.toml 的 peeter_heyns（日程 1555-08 至 1584-12，antwerp / trading_house）；技能 lang_german（skills.toml）；检定属性 seamanship / eloquence（captain 表定下后按统一换算）。
# 报酬：现金最多 1600（自付 500 的 pay 选项，另有 1100 的折中）；名声 +2；好感正向合计不超过 13；无物品、无技能、无势力声望；回忆 mem-request_peeter_heyns-arrive。
# 秘密：无。生意人的一面（算术习题是他自己编、自己卖的）只作闲笔，写在 offer 的正文里。
# 口头禅“书箱可以晚到，孩子一天也不能。”全文件只出现一次（offer 的基础正文）；变体不重复。
# 回忆插画：mem-request_peeter_heyns-arrive，汉堡的码头：三个女孩坐在书箱上，最小的那个抱着布偶，远处是一座陌生的钟楼。

[[tracks]]
key = "request_peeter_heyns"
name = "月桂树的书箱"
kind = "request"
start = "offer"
auto = false
cast = ["peeter_heyns"]

# 一、关门前的书箱：1584 年，人物在“月桂树”，玩家来问。
[[tracks.chapters]]
key = "offer"
title = "关门前的书箱"
text = "奥古斯丁街的“月桂树”招牌还挂着，教室里的长凳已经叠到了墙边。海恩斯蹲在箱子旁边，一摞摞地码着课本。箱底垫的是学生的习字本，压在最上面的是他自己编的算术习题，扉页上印着价钱，一分也不打算减。城外的营火一夜比一夜多。三个寄宿的女孩坐在凳子上，一个家在伦敦，一个在汉堡，一个在法兰克福，家里的信都到了，要学校把人送过去。“书箱可以晚到，孩子一天也不能。”他拍掉手上的灰，“送到汉堡，那边有人接。往后的路像这摞课本，一本一本往下交，你的船能去吗？”"
speaker = "peeter_heyns"
mood = "sad"
cast = ["peeter_heyns"]
when = [{ kind = "date", from = [1584, 1, 15], to = [1584, 11, 30] }, { kind = "age", ge = 17 }, { kind = "alive", person = "peeter_heyns", value = true }]
objectives = [{ kind = "person", person = "peeter_heyns", text = "在“月桂树”找到他" }]
deadline = [1584, 11, 30]
timeout = { next = "failed" }

