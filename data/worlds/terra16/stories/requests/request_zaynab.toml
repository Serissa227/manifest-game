# 三之三、吵到一半：税吏只减了一半，盐队仍多交了一截。
[[tracks.chapters]]
key = "result_half"
title = "吵到一半"
text = "几个月后，盐队又到萨累。税吏那一季只肯把双份减去一半，盐队还是多交了一截。管账人带来宰娜卜的话和一小袋金砂，袋口系得很松。他说得很快，像是怕你多想。“首领说，这一行，她只记了一半。”"
speaker = "captain"
mood = "tense"
at = "sale"
