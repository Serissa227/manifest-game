key = "settle_vent"
title = "通风口与木板"
text = "船长最后只肯在舱口挨着水柜的地方开一个通风口，拳头大小，装了铁栅。病号舱还在舱底，布还叠在架上，药箱还钉在舱壁。风从那个口子里一股一股地进来，带着水柜的潮气。贝阿特丽丝仰着头站了一会儿，说：“风能进来，也算一扇窗。”她还是在舱门内侧钉了一块木板，板上什么字也没有。“船回来那天，我得站到这块板跟前，上面写了谁，我一个一个问。”"
