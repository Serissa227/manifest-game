# 三a、名字写在舱门上：炮窗的病号舱，船开前一天。
[[tracks.chapters]]
key = "settle"
title = "名字写在舱门上"
text = "开船前一天，贝阿特丽丝上船看了一回病号舱。二十匹布叠在架上，药箱钉在舱壁，炮窗开着，河风灌进来，吹得她的头发贴在脸上。她没去拨，先在舱门内侧比了比高低，钉上一块木板，板上什么字也没有。“给船医写病人名字的。”她说，“病人是他管，名字该他自己写。”她转过身来，手没有藏，掌心朝上，几道月牙似的指甲印还没褪。她说船回来那天，她要来对这块板。“写上去的人，我要一个一个问他们后来怎么样。”"
speaker = "captain"
mood = "tender"
when = [{ kind = "alive", person = "beatriz_simao", value = true }]
news = "里斯本开往印度的船上多了一个病号舱，舱门内侧钉着一块写名字的木板。"

[[tracks.chapters.choices]]
