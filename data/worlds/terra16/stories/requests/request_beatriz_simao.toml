# 二、舱底：病号舱在最底层，挨着水柜，没有窗。
[[tracks.chapters]]
key = "deliver"
title = "舱底"
text = "棉布和药箱搬上船，船长领你们下到最底层，指给你们病号舱的位置：挨着水柜，一间木板隔出来的小舱，没有一扇窗。贝阿特丽丝站在舱口闻了闻，脸色变了，手心里攥着拳头，指甲印一道一道压在掌纹上。她转向船长：“先把窗打开。这一舱躺十几个人，你算过要多少风？”船长笑了，说舱底哪来的窗。船医在一旁不吭声，可他看着那二十匹布，眼睛是亮的。"
speaker = "captain"
mood = "tense"
at = "lisbon"
when = [{ kind = "alive", person = "beatriz_simao", value = true }]
objectives = [{ kind = "goods", good = "cloth", qty = 20, at = "lisbon", text = "二十匹棉布" }, { kind = "goods", good = "medicine", qty = 3, at = "lisbon", text = "三箱药剂" }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "affinity", person = "beatriz_simao", value = -3 }, { kind = "flag", flag = "c13_request_beatriz_simao_late" }, { kind = "letter", person = "beatriz_simao", text = "那条船开走了，病号舱还在舱底，没有挪。布和药我托人另送了一份，搭下一条去印度的船。——贝阿特丽丝" }], news = "里斯本河上那条去印度的大船开走了，舱底的病号舱没有挪动，窗也没开。" }
news = "里斯本河上一条去印度的大船，把病号舱挪到了有炮窗的那一层，窗开着。"

[[tracks.chapters.choices]]
key = "argue_captain"
