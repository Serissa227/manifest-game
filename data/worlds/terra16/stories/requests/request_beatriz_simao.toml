# 请托：去印度的病号舱（request_beatriz_simao）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：贝阿特丽丝·西芒（beatriz_simao，1540-10-01 生，女），医生家隔壁的姑娘，帮着记看诊的簿子；势力 portugal，身份档 1。cast：cast/classmates_custom_lisbon_medicine.toml。
# 类型：送货（deliver）。三章：offer（报价）、deliver（舱底，交货）、settle（名字写在舱门上）；另有 settle_vent（检定失败的分支：只开通风口，舱位不换）。
#   settle_vent 是引擎的变通：选项的 reply 与变体只能改文字，不能改效果，所以“只开通风口”的结账拆成独立一章，工钱 500 与 partial 旗标写在它自己的选项里。
# 报价：T（当面）。贝阿特丽丝按日程在里斯本（lisbon），auto=false，玩家用 ask:request_beatriz_simao 启动；offer 不写 at，objectives 为 person。
#   窗口 1571-01-01 至 1590-06-30；offer 写 deadline=1590-06-30、timeout=failed，不写见闻。
# 进行中：deliver 的 deadline_days=120，超时走 failed，好感 -3，旗标 _late，来信一封，并写一条见闻（timeout 不写 news 会回落到章的 news，所以单独写）。
#   deliver 的货物目标：棉布 20、药剂 3，在 lisbon 交；所有选项都扣货。
# 依据·史实背景：里斯本去印度的船，回程常有病死的水手；船上照看病人靠修士与船医，舱位最差。
# 依据·原创：病号舱、看诊簿后面的单子、船医、炮窗、舱门内侧的木板。
# 秘密：怕血（cast secret）只通过手心的指甲印让人看见，不解释，不进见闻。
# 读的旗标：bond beatriz_simao 至少 C（offer 的变体，只读）；不读 c7_ 旗标，不设 c7_ 旗标。
# 设的旗标：c13_request_beatriz_simao_accepted（offer 两条接法）、_declined（offer 回绝）、_window（deliver 三条路之一）、_vent（deliver 检定失败）、_done（settle 两条收尾）、_partial（settle_vent 两条收尾）、_late（deliver 超时）。
# 不用 relation / tie / bond / heart 效果；不写 1569 大疫与杜阿尔特，病号舱与病房是两件事。
# 报酬：现金最多 900 + 货款 2550（只开通风口 500 + 2550），好感最多 +13，名声 +1，回忆 mem-request_beatriz_simao-settle（只给最好的结局）。
# 依赖：港口 lisbon；货物 cloth、medicine；技能 herbal_medicine（skills.toml）；属性 stewardship；人物 beatriz_simao。无 B10b 改名；同学线，无 c13_main 门禁。
# 回忆插画清单：
#   mem-request_beatriz_simao-settle「舱门内侧的木板」：船舱里二十匹布叠在架上，炮窗开着，河风灌进来；舱门内侧钉着一块还没写字的木板。

[[tracks]]
key = "request_beatriz_simao"
name = "去印度的病号舱"
kind = "request"
start = "offer"
auto = false
cast = ["beatriz_simao"]

# 一、一船的病号：里斯本，她翻着看诊簿，簿子后面夹着一张单子。
[[tracks.chapters]]
key = "offer"
title = "一船的病号"
text = "医生家后屋的窗关着，一股醋和艾草的味道闷在屋里。贝阿特丽丝一见有人进门，先走过去把窗推开，这才回头问你：“你叫什么？”她手边压着一本看诊的簿子，簿子后面夹着一张单子：去印度的船回来了，一船四百人，病死的名字写了半页。她要给下一条去印度的船备一个病号舱，二十匹干净的棉布，三箱药剂，舱要有窗。“钱我出。”她说，“货要你运来，交到船上。我去跟船长说，他只会叫我回家。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "beatriz_simao", text = "在里斯本医生家的后屋找到她" }]
when = [{ kind = "date", from = [1571, 1, 1], to = [1590, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "beatriz_simao", ge = 18 }]
deadline = [1590, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_bond_c"
when = [{ kind = "bond", person = "beatriz_simao", level = "C" }]
text = "医生家后屋的门一开，贝阿特丽丝抬头先问你：“你叫什么？”问完自己笑出了声，摆摆手：“习惯了。”窗还关着，她没去开，只把手边那本看诊簿往你这边推了推。簿子后面夹着一张单子：去印度的船回来了，一船四百人，病死的名字写了半页。她要给下一条去印度的船备一个病号舱，二十匹干净的棉布，三箱药剂，舱要有窗。“钱我出。”她说，“货要你运来，交到船上。我去跟船长说，他只会叫我回家。”"

[[tracks.chapters.choices]]
key = "take_it"
text = "接下，备齐棉布和药剂，送上那条船。"
