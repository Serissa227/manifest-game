effects = [{ kind = "cash", value = 900 }, { kind = "cash", value = 2550 }, { kind = "affinity", person = "beatriz_simao", value = 8 }, { kind = "fame", value = 1 }, { kind = "flag", flag = "c13_request_beatriz_simao_done" }, { kind = "memory", memory = "mem-request_beatriz_simao-settle", title = "舱门内侧的木板" }]

[[tracks.chapters.choices]]
