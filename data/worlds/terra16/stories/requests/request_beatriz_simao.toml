effects = [{ kind = "affinity", person = "beatriz_simao", value = 2 }, { kind = "flag", flag = "c13_request_beatriz_simao_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "船上的事，让船长去管。"
next = "failed"
