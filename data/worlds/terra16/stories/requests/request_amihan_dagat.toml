effects = [{ kind = "flag", flag = "c13_request_amihan_dagat_declined" }]

# 二、口小肚大：海湾的口子只容一条船过，里头却是深绿的水。你要在礁边量出它的脾气。
[[tracks.chapters]]
key = "arrive"
title = "口小肚大"
text = "那处海湾在宿务南边一天的水路上，口窄得两条小船并排就进不去。里面却宽，水是深绿的。你在口子外头等到水退下去，才看见中间露出一道礁，黑黑的，像一条脊背。渔民比划着说，这里九月的风是从东南来的，正对着口子灌。“这条水路，涨潮才开门。”你想起阿米汉的话，把缆绳系在一块石头上。"
speaker = "captain"
mood = "mystic"
at = "cebu"
objectives = [{ kind = "at", at = "cebu", text = "在宿务" }]
when = [{ kind = "alive", person = "amihan_dagat", value = true }, { kind = "date", from = [1565, 1, 1], to = [1581, 8, 24] }]
deadline_days = 120
timeout = { next = "failed", effects = [{ kind = "letter", person = "amihan_dagat", text = "宿务的渔民又来过一回，比划得更清楚了些。我还是要去量，等明年。——阿米汉" }, { kind = "affinity", person = "amihan_dagat", value = -3 }, { kind = "flag", flag = "c13_request_amihan_dagat_late" }] }
news = "宿务南边一天的水路上，一个口小肚大的海湾，汤都来的船长在口子外守了半个月的潮，说里头的水是深绿的。"

[[tracks.chapters.variants]]
key = "v1_spanish"
when = [{ kind = "date", from = [1565, 4, 27] }]
text = "那处海湾在宿务南边一天的水路上，口窄得两条小船并排就进不去。里面却宽，水是深绿的。宿务港口多了西班牙人的木栅，渔民往南指的时候压低了声音，说南边的海湾“他们还不知道”。你在口子外头等到水退下去，才看见中间露出一道礁，黑黑的。渔民比划着说，这里九月的风是从东南来的，正对着口子灌。你想起阿米汉的话，把缆绳系在一块石头上，等水涨起来。"

[[tracks.chapters.choices]]
key = "chart_bay"
text = "把口子、礁石、里面的水深一点点画成图。"
next = "report"
reply = "我画了两天，口子宽多少、礁在哪里、里面三处最深的地方都标上了。东南风灌进来能到哪里，画了一条虚线；礁后面一处风灌不到的角落，也用圈圈了出来。"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 3 }, { kind = "flag", flag = "c13_request_amihan_dagat_chart" }]
requires = [{ kind = "skill", skill = "cartography", ge = 60 }]
hint = "你量了数，可画出来口子总是歪的"

[[tracks.chapters.choices]]
key = "time_tide"
text = "守一个大潮，记下口子几时开、几时关。"
next = "report"
reply = "我守了半个月的潮，把口子能过船的时辰一天一天记下来，几时开、几时关。又照着口子的样子画了一张图，礁后面有一处东南风灌不到的角落，也被我找到了。"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 3 }, { kind = "flag", flag = "c13_request_amihan_dagat_chart" }]
requires = [{ kind = "skill", skill = "tide_reading", ge = 60 }]
hint = "这里的潮跟汤都不一样，你算不准"

[[tracks.chapters.choices]]
key = "sail_in"
text = "开小船进去转一圈，凭手感量。"
next = "report_partial"
reply = "我在口子上等到涨潮，开小船进去转了一圈，深浅、风向都摸了个大概，有些地方没敢细看，礁边的水我不敢多待，转了一圈就退出来，在船上把看到的画了下来。"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 3 }]
check = { attr = "seamanship", base = 20, per = 7 }
fail = { next = "report_partial", effects = [{ kind = "affinity", person = "amihan_dagat", value = -2 }, { kind = "flag", flag = "c13_request_amihan_dagat_scraped" }] }

# 三（一）：量全了。礁后面那个角落，正好塞得下二十条船。
[[tracks.chapters]]
key = "report"
title = "第二十条船"
text = "阿米汉把你画的海湾铺在船坞的地上，赤着脚蹲在旁边看。看到礁石后面那个角落，她的手指停住了，点了两下。“二十条船，这个角落刚好塞得下。”她抬起头，“最小那条塞最里面，风从口子灌进来，灌不到它。”她把图翻过来，又翻回去，在东南风灌进口子的地方用指甲划了一道。“台风季前得有人带第一趟。船户们不信没去过的地方，你得先开进去，他们才肯跟着。”"
speaker = "captain"
mood = "cheerful"
objectives = [{ kind = "person", person = "amihan_dagat", text = "在汤都找到她" }]
when = [{ kind = "alive", person = "amihan_dagat", value = true }, { kind = "date", from = [1563, 10, 1], to = [1581, 8, 24] }]
news = "汤都河口的小船户们说，台风季要有一处躲风的地方了，图是一个汤都来的船长在宿务南边的海湾量出来的。"

[[tracks.chapters.choices]]
key = "lead_first"
text = "答应台风季前带第一趟。"
next = "done"
reply = "她跳起来，说那就定了。又说那条水路她要给它起个名字，起什么，等第一趟船进去了再说。她付了钱，手还按在图上，不肯松开，过了一会儿才去找钱袋。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "amihan_dagat", value = 8 }, { kind = "fame", value = 1 }, { kind = "skill", skill = "tide_reading", value = 20 }, { kind = "flag", flag = "c13_request_amihan_dagat_done" }, { kind = "memory", memory = "mem-request_amihan_dagat-report", title = "船坞地上的海湾" }]

[[tracks.chapters.choices]]
key = "teach_her"
text = "把潮的时辰教给她，让她自己带。"
next = "done"
reply = "她记得很快，一遍就会，又把我教的时辰报了一遍，报得比我还准。她把几个时辰写在木板背面。她付了钱，说第一趟她自己带，“你下回来，那里该有名字了”。"
effects = [{ kind = "cash", value = 1250 }, { kind = "affinity", person = "amihan_dagat", value = 7 }, { kind = "fame", value = 1 }, { kind = "skill", skill = "tide_reading", value = 20 }, { kind = "flag", flag = "c13_request_amihan_dagat_done" }, { kind = "memory", memory = "mem-request_amihan_dagat-report", title = "船坞地上的海湾" }]

# 三（二）：只量了一半。她说剩下那一半她自己去量。
[[tracks.chapters]]
key = "report_partial"
title = "只量了一半"
text = "阿米汉把图摊在船坞的泥地上，口子的一截画得最细，礁后面却空着。她蹲下去看，看了很久，手指在口子上来回划，没有往礁后面去。“你只进去转了一圈。”她说，“这样也够了。深的地方我知道在哪儿，剩下那一半，我自己去量。”她脚底沾着泥，蹭到图的边上，又赶紧拿袖子去擦。"
speaker = "captain"
mood = "tender"
objectives = [{ kind = "person", person = "amihan_dagat", text = "在汤都找到她" }]
when = [{ kind = "alive", person = "amihan_dagat", value = true }, { kind = "date", from = [1563, 10, 1], to = [1581, 8, 24] }]
news = "宿务南边的海湾只量了一半，汤都河口的阿米汉说剩下那一半她自己去量，台风季前的泊位还没定下来。"

