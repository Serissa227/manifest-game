# 请托：台风天的泊位（request_amihan_dagat）。Claude 写（C13d，2026-10-25），仅中文。
# 人物：阿米汉·达加特（amihan_dagat，1540-02-22 生，女），汤都河口船匠的女儿；势力 luzon，身份档 1。cast：cast/classmates_custom_tondo_datu.toml。
# 类型：去某处（go）。四章：offer（报价）、arrive（宿务南边的海湾）、report（量全了，结账）、report_partial（只量了一半，结账）；终点 done / failed。
#   说明：任务单写三章；“只量了一半”的一支不能靠变体改现金与终局旗标（变体只换文字），所以拆成 report_partial 一章，由 arrive 的 next 路由过去。
# 报价：T（当面）。人物日程常驻汤都（tondo），auto=false，玩家在港里“问请托”（ask:request_amihan_dagat）启动；offer 不写 at，目标是在船坞里找到她。
#   offer 写 deadline=1580-06-30，timeout 走 failed，不写见闻（没人知道这件事没成）。
# 进行中：arrive 是普通章，没有 window 与 default，窗口用 when 的日期条件写；deadline_days=120，超时走 failed，来信一封，好感 -3，旗标 _late。
#   report、report_partial 没有期限；人在汤都，目标是找到她。
# 依据·史实背景：米沙鄢的台风季（七月到十月）；1565 年黎牙实比在宿务立足（变体：1565-04-27 以后，宿务港有西班牙人的木栅）。
#   正文只用渔民的口吻说“南边有个海湾”，不起正式地名，海湾在宿务南边一天的水路。
# 依据·原创：阿米汉与汤都河口的小船户；口小肚大的海湾；落潮时露出的一道礁；东南风正对着口子灌。
#   口头禅“这条水路，涨潮才开门。”只在 arrive 章用一次（变体里改成转述，不再引原话）。
# 秘密：家里靠几条不外传的水道吃饭，她偷记的那一份塞在小船底板下。本文件不碰，见闻一律不写。
# 读的旗标：bond amihan_dagat ≥ C（offer 的变体，只读，老同学的口气）。不读也不设任何 c7_ 旗标。
# 设的旗标：c13_request_amihan_dagat_accepted（offer 两种接法）、_declined（offer 回绝）、
#   分支旗标 _chart（chart_bay 与 time_tide 共用，表示量全了口子与礁）、_scraped（sail_in 检定失败，小船擦了礁）；
#   终局 _done（report）、_partial（report_partial）、_late（arrive 超时）。
# 依赖：港口 tondo、cebu（ports_southeast_asia.toml）；技能 cartography、tide_reading（skills.toml）、属性 seamanship。
#   cast 日程 1554 年起常驻汤都，正文与报价一致，cast 不改。
# 报酬：现金 1250（只量一半 800）；好感最多 +13；名声 +1；技能 tide_reading +20（只一次）；回忆 mem-request_amihan_dagat-report。无物品奖励。
# 回忆插画清单：
#   mem-request_amihan_dagat-report「船坞地上的海湾」：船坞的泥地上铺着一张海湾图，一个赤脚的女船匠蹲在旁边，手指点在礁石后面的角落（只量了一半时，图上礁后面是空的）。
# 窗口（2026-11-01 close-places）：报价与 arrive 由 1563-10-01 起改为 1565-01-01 起——宿务 1565 年才开港，arrive 限期 120 天，1563-10 至 1564-09 接下的请托必然超时。正文不动。

[[tracks]]
key = "request_amihan_dagat"
name = "台风天的泊位"
kind = "request"
start = "offer"
auto = false
cast = ["amihan_dagat"]

# 一、躲风的地方：船坞里裂成两半的小船，她数着板子，托你去量南边的海湾。
[[tracks.chapters]]
key = "offer"
title = "躲风的地方"
text = "汤都河口的船坞里，去年台风打碎的小船还躺在泥地上，裂成两半。阿米汉蹲在旁边，一块板一块板地数，数到一半抬头看见你，也没站起来。“要躲风的船不止这一条。”她说，“这几处泊位，浅的挡不住风，深的又挤不进去。现在落潮，两个时辰以后才涨。”她把手里的木板往地上一扣，赤脚在泥里蹭了蹭。“宿务的渔民说，南边有个海湾，口小肚大，没人用过。你去量。进口多宽，水多深，哪个方向的风会灌进来。量错一样，船就碎在里面。”"
speaker = "captain"
mood = "tense"
objectives = [{ kind = "person", person = "amihan_dagat", text = "在汤都河口的船坞找到她" }]
when = [{ kind = "date", from = [1565, 1, 1], to = [1580, 6, 30] }, { kind = "age", ge = 17 }, { kind = "age", person = "amihan_dagat", ge = 18 }]
deadline = [1580, 6, 30]
timeout = { next = "failed" }

[[tracks.chapters.variants]]
key = "v1_bond"
when = [{ kind = "bond", person = "amihan_dagat", level = "C" }]
text = "汤都河口的船坞里，去年台风打碎的小船还躺在泥地上。阿米汉看见你，把手里那块板放下，说：“螃蟹门你还记得吗？落潮是巷子，涨潮就是另一条水道。”她没等你答，又去数那些裂开的船板。“要躲风的船不止这一条。浅的泊位挡不住风，深的又挤不进去。宿务的渔民说，南边有个海湾，口小肚大，没人用过。你去量。量错一样，船就碎在里面。”"

[[tracks.chapters.choices]]
key = "go_cebu"
text = "接下，去宿务南边量那处海湾。"
next = "arrive"
reply = "她用炭在一块木板上画了个口小肚大的样子，说渔民就是这么比划的。“剩下的，你替我画满。画不满的地方空着，别乱填，下回来我自己看。”"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 2 }, { kind = "flag", flag = "c13_request_amihan_dagat_accepted" }]

[[tracks.chapters.choices]]
