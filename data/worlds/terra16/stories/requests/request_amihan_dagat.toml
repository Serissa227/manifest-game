next = "arrive"
reply = "“十九条，加上我自己那条，一共二十条。”她一条一条报船主的名字，报完了说，最小那条只能坐两个人，“它要是碎了，就是一家人没地方住。”"
effects = [{ kind = "affinity", person = "amihan_dagat", value = 2 }, { kind = "flag", flag = "c13_request_amihan_dagat_accepted" }]

[[tracks.chapters.choices]]
key = "decline"
text = "宿务太远，小船户也划不过去。"
next = "failed"
