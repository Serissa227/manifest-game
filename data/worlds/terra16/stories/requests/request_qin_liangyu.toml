# 三之二、只有两个字（回信只有“平安”）：回宁波，老冉掂了掂那张纸。
[[tracks.chapters]]
key = "reply_short"
title = "两个字的回信"
text = "粮船还没到，老冉仍守着跳板边的老地方。我把那张折成方块的纸递过去，他在手心里掂了掂，打开看了一眼，又叠回去。只有两个字。他没说什么，用油布包了一层，塞进怀里，然后望着我，等我往下说。“就这些？”他问。"
mood = "sad"
