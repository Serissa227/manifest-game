# 三、帐子里的三个名字：回泽拉，念给遗孀听。照名册念完，或者略去一句。
[[tracks.chapters]]
key = "report"
title = "投了那边"
text = "你回到泽拉，老管事带你去见遗孀。帐子里很暗，她坐在矮凳上，手里转着一串旧念珠，没有抬头。你把名册摊在她面前，一个名字一个名字念。旗手，她点了一下头。铁匠，她让你停了一停。念到马夫的时候，你也停了一下，因为那一行字的墨迹比别的淡，像是被人反复摸过。"
at = "zeila"
mood = "sad"
objectives = [{ kind = "at", at = "zeila", text = "回泽拉去见遗孀" }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "bati_del_wambara", value = -3 }, { kind = "flag", flag = "c13_request_bati_del_wambara_late" }, { kind = "letter", person = "bati_del_wambara", text = "遗孀回哈勒尔去了。名册上的事，你若知道了，托泽拉的商人带个口信。——老管事" }] }
news = "泽拉的人说，伊玛目的遗孀听完一个外来船长念的三个名字，在帐子里坐了很久。"
when = [
  { kind = "alive", person = "bati_del_wambara", value = true },
]

