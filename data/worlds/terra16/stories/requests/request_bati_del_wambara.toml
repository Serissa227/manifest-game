# 二、亚丁城下的名册：火枪老兵卖水，名册压在水罐底下。三条路：问记号、陪他一天、买下一页。
[[tracks.chapters]]
key = "search"
title = "火枪老兵的名册"
text = "亚丁城下，火枪老兵如今卖水。他的水车停在城墙根，名册用油布包着，压在一只水罐底下。你翻开，三个名字都在。旗手的名字后面画了一道，是战死。铁匠的名字后面写着“被俘，下落不明”。马夫的名字后面，写的是“投了那边”。"
at = "aden"
speaker = "captain"
mood = "sad"
objectives = [{ kind = "at", at = "aden", text = "到亚丁城下去" }]
when = [{ kind = "alive", person = "bati_del_wambara", value = true }]
deadline_days = 90
timeout = { next = "failed", effects = [{ kind = "affinity", person = "bati_del_wambara", value = -3 }, { kind = "flag", flag = "c13_request_bati_del_wambara_late" }, { kind = "letter", person = "bati_del_wambara", text = "亚丁的消息已经有人先一步带回来了。遗孀说，谢你肯接这件事。——老管事" }] }
news = "亚丁城下卖水的奥斯曼老兵，把一本旧名册给一个外来的船长看了一整天。"

[[tracks.chapters.variants]]
key = "v1_names"
when = [{ kind = "flag", flag = "c13_request_bati_del_wambara_knows_names" }]
text = "亚丁城下，火枪老兵如今卖水。名册用油布包着，压在水罐底下。老管事念过的那三个名字，都在上面。旗手的名字后面画了一道，是战死。铁匠的名字后面写着“被俘，下落不明”。马夫的名字后面，写的是“投了那边”。"

[[tracks.chapters.choices]]
