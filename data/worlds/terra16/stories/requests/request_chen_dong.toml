# 二、藤壶底的船：打退一条之后，另一条被他的巡船堵在岛边。
[[tracks.chapters]]
key = "battle"
title = "藤壶底的船"
text = "两条快船从小岛后头钻出来的时候，陈栋的巡船还落在三里外，船底的藤壶拖得它直不起速。你的炮响过三轮，打退的那条船掉头往外海逃了；另一条没来得及转舵，被巡船从岛的另一侧堵在了礁边。陈栋站在船头，棍子横在身前，一声没喊。他朝逃的那条抬了抬下巴，又朝堵住的那条抬了抬下巴：“哪条？”"
speaker = "captain"
mood = "tense"
when = [{ kind = "alive", person = "chen_dong", value = true }]
objectives = [{ kind = "battle", wins = 1, text = "在外海打退劫船的快船" }]
deadline_days = 90
timeout = { next = "failed", effects = [
  { kind = "affinity", person = "chen_dong", value = -3 },
  { kind = "flag", flag = "c13_request_chen_dong_late" },
  { kind = "letter", person = "chen_dong", text = "那伙人我自己守了一个月，守到一条。剩下的跑了。——陈栋" },
] }

[[tracks.chapters.choices]]
key = "leave_to_him"
text = "让他收拾堵住的那条，我去追逃的。"
next = "after"
check = { attr = "arms", base = 20, per = 7 }
reply = "你追了大半个下午，把逃的那条挤在礁石和浅滩之间，它的舵手终于收了帆。回到岛边，陈栋已经把另一条船上的人一个个绑好，坐成一排。他看看你拖回来的那条，又看看你，把棍子冲你扬了扬：“两条，够交差了。”"
news = "月港外海，一伙劫船的被人打散，镇海卫的巡船一口气押回来两条，码头上看热闹的挤了三层。"
