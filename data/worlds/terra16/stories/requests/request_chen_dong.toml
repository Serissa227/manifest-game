# 请托：先过三棍（request_chen_dong）。Claude 写（C13d，2026-10-24），仅中文。
# 人物：陈栋（chen_dong，1540-05-22 生，男），镇海卫千户之子，龙溪社学同窗；势力 ming，身份档 1。cast：classmates_zhangzhou.toml。
# 类型：打一仗（fight）。三章：offer（报价）、battle（打退劫船）、after（比三棍）；没有 stage 章。
#       offer 有一条不打的路：扮商船把劫船的引到卫所炮口下（seamanship 检定），成功直接进 after，失败被识破、迎战进 battle。
# 报价：V（到访）。人物从镇海卫下到月港（yuegang），auto=true；窗口 1564-01-01 至 1590-06-30（同学重逢 1563 之后开放）。
#       offer 写 family=c13_offer_yuegang、冷却 20 天；deadline 为窗口止日，timeout 直接 failed，不写见闻。
# 进行中：battle 章 deadline_days=90，超时走 failed，来信一封（好感 -3，旗标 _late）。after 章是普通章，可以一直等。
# 依据·史实背景：1560 年代戚继光入闽平倭之后，福建沿海仍有零散海盗劫船；镇海卫的巡船少而慢；1567 年月港开海后商船更多。
#       劫船的是叙事人物，不对应任何史上的海盗。
# 依据·原创：陈栋的巡船与船底的藤壶、借给你的旗、码头东头晒网的空地、白蜡杆的棍、第三棍故意露出的破绽、三招闽南棍法。
#       “先过三棍，再讲道理。”是他的口头禅，全轨道只在 after 章的比棍前用一次（offer 的结尾只说“比三棍”）。
#       比三棍是切磋，不写成真打。“只教过两个人”不说是谁（C7 里的事不在这里讲）。
# 秘密：他早就看穿“林兄”的底细而一个字没漏。只在 offer 的 variants 里读 c7_wandeng_unmasked_known 写一句“你的事，我从来没说过”；
#       kept 时不写，见闻一律不写。
# 读写的旗标：只读 c7_wandeng_unmasked_known（offer 的 variants）；不设任何 c7_ 旗标。
#       写 c13_request_chen_dong_accepted（offer 两条接法，引诱失败也设）、_declined、_lured（引诱成功）、_fought（battle）、
#       _fled（有一条船逃了，after 读它换一句话）、_late（battle 超时）、_done（after 全奖励）、_partial（after 比棍输了半招，奖励打折）。
# 报酬：现金最多 1600（只在 after 给一次）、好感最多 +13、名声 +1、技能 staff_fujian +20（只一次）、回忆 mem-request_chen_dong-after。
#       after 检定失败走折中：现金 1000、好感 +4、技能 +10，不加名声、不给回忆。
# 依赖：港口 yuegang；人物 chen_dong（cast/classmates_zhangzhou.toml）；技能 staff_fujian（skills.toml）。无需 B10b 改名。
# 回忆插画：mem-request_chen_dong-after：月港码头东头的空地，潮退后晒网的木架边，两个人各执一根白蜡棍对着，船户围成半圈。
# 窗口（2026-11-01 close-places）：报价由 1564-01-01 起改为 1567-01-01 起——月港 1567 年才开港，1564—1566 三年走不到；正文不写年份，不动。

[[tracks]]
key = "request_chen_dong"
name = "先过三棍"
kind = "request"
start = "offer"
auto = true
cast = ["chen_dong"]

# 一、追不上的船：月港码头，他拿棍尾磕着船帮上的蚝壳。
[[tracks.chapters]]
key = "offer"
title = "追不上的船"
text = "月港码头的石阶旁泊着镇海卫的巡船，船底的藤壶厚得像一层铜钱。陈栋提着一根齐眉棍站在船边，用棍尾一下一下磕船帮，磕下来的是干掉的蚝壳。“追了三回。”他说，“三回都在浯屿外头丢的。”外海有一伙劫船的，船小，吃水浅，专截从漳州出来的小商船，拿了货就放人，连船都不烧。他又磕了一下：“我这条船，爬得动，追不上。”然后看你：“你的船快。打一仗，或者把他们引到卫所的炮口底下，随你。”顿了顿，棍子往地上一顿：“打完了，跟我比三棍。”"
speaker = "captain"
mood = "tense"
at = "yuegang"
when = [
  { kind = "date", from = [1567, 1, 1], to = [1590, 6, 30] },
  { kind = "age", ge = 17 },
  { kind = "age", person = "chen_dong", ge = 18 },
]
deadline = [1590, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_yuegang"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_old_friend_known"
when = [
  { kind = "bond", person = "chen_dong", level = "C" },
  { kind = "flag", flag = "c7_wandeng_unmasked_known" },
]
text = "月港码头的石阶旁泊着镇海卫的巡船，船底的藤壶厚得像一层铜钱。陈栋提着一根齐眉棍站在船边，用棍尾一下一下磕船帮，磕下来的是干掉的蚝壳。你走近，他没回头：“追了三回，三回都在浯屿外头丢的。”外海有一伙劫船的，船小，吃水浅，专截从漳州出来的小商船，拿了货就放人，连船都不烧。“你的船快。打一仗，或者把他们引到卫所的炮口底下，随你。”他把棍子倒过来，棍头递到你面前，眼睛看着船底的藤壶：“你的事，我从来没说过。你那一棍还没还我，打完了，比三棍。”"

