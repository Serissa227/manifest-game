# 三、三棍：码头东头晒网的空地，第三棍他故意露一个破绽。
[[tracks.chapters]]
key = "after"
title = "空地上的三棍"
text = "回到月港，潮正退，码头东头的空地上还留着晒网的木架。陈栋把一根棍从肩上卸下来，扔过来，你伸手接住，是巡船上的白蜡杆，一头被灶火熏黑了。“先过三棍，再讲道理。”他说。船户们放下手里的活围成半圈，卖鱼丸的把担子也歇在了边上。头两棍他压着打，没留力，你接得手腕发麻。第三棍起手时，他的左肘抬高了半寸，肋下整个空了出来。他的眼睛没动，看的是你的眼睛。"
speaker = "captain"
mood = "cheerful"
at = "yuegang"
when = [{ kind = "alive", person = "chen_dong", value = true }]

[[tracks.chapters.variants]]
key = "v1_lured"
when = [{ kind = "flag", flag = "c13_request_chen_dong_lured" }]
text = "回到月港，镇海卫炮台底下那两声炮还在码头上被人传来传去。陈栋把一根棍从肩上卸下来，扔过来，你伸手接住，是巡船上的白蜡杆，一头被灶火熏黑了。“先过三棍，再讲道理。”他说。你说人是炮打散的，他摇头：“炮打的不算，棍子打的才算。”船户们放下手里的活围成半圈。头两棍他压着打，没留力。第三棍起手时，他的左肘抬高了半寸，肋下整个空了出来。他的眼睛没动，看的是你的眼睛。"

[[tracks.chapters.variants]]
key = "v2_fled"
when = [{ kind = "flag", flag = "c13_request_chen_dong_fled" }]
text = "回到月港，潮正退，码头东头的空地上还留着晒网的木架。陈栋把一根棍从肩上卸下来，扔过来，你伸手接住，是巡船上的白蜡杆，一头被灶火熏黑了。“先过三棍，再讲道理。”他说。船户们放下手里的活围成半圈。头两棍他压着打，打一下问一句：“跑的那条，往哪边去的？”你答一句，他再压一棍。第三棍起手时，他的左肘抬高了半寸，肋下整个空了出来。他的眼睛没动，看的是你的眼睛。"

