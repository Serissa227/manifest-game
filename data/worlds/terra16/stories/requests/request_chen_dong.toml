[[tracks.chapters.choices]]
key = "fight"
text = "接下：出海跟那伙劫船的打一仗。"
next = "battle"
reply = "他点点头，转身从船舱里拎出一面旗，叠得方方正正，边角被烟熏得发黄。“挂上。”他说，“劫船的认得这面旗，一见就跑，一跑，船就散了，你才追得上。”他把旗塞进你手里，拇指在旗角按了一下，那里缝着一块补丁，是上回挨炮留下的。"
