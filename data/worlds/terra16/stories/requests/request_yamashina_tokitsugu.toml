# 三′、结账（座里记了船名）：药种座追到京里讨座钱，言继付了，也还了半天价。
[[tracks.chapters]]
key = "settle_noted"
title = "座里的账簿"
text = "过了二十来天，小者又跑来码头，没开口先叹了口气。言继的回信照旧厚，头一张就数落药种座：座里的人追到京里，把座钱的单子递到了山科家门上。“我跟他还了半天价，还到后来，照座里的规矩付了。规矩是规矩，价是价，我只还价，不还规矩。”夹着的那页日记写：“十二日，阴。海上的人送来人参四斤，根须俱全。药种座来讨钱，付讫。”底下另起一行：“又，小者说，座里的人一翻账簿，此人的脸就跟着往下掉，掉到账簿合上才停。”信末一句：“你的船名，座里的账簿上也有了。下回进堺，怕是要先过一回他们的秤。”"
mood = "cheerful"
at = "sakai"
when = [{ kind = "alive", person = "yamashina_tokitsugu", value = true }]
objectives = [{ kind = "wait", days = 20, text = "等京里那笔座钱的下文" }, { kind = "at", at = "sakai", text = "回到堺" }]
news = "堺的药种座追到京里，向一位公卿家讨四斤朝鲜人参的座钱；听说那位公卿一边掏钱，一边还了半天的价。"
deadline_days = 120

