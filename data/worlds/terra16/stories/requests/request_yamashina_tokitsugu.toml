# 三、结账（座里没记船名）：二十天后小者带来回信，和一页写着“我”的笑话的新日记。
[[tracks.chapters]]
key = "settle"
title = "日记里的一行"
text = "二十天后，那个小者又到了码头，这一回两只草鞋都好好穿在脚上。他带来言继的回信，比头一封还厚，夹着一页新抄的日记，墨迹还亮：“十二日，晴。海上的人送来人参四斤，一根一根都好。”底下另起一行：“又，小者回来说，此人一听我什么都记，慌忙把敞着的衣襟掩上，掩反了，左前——活人穿成了死人的样子。可笑可笑。”回信里说，四斤参已经切了片，摊在檐下的竹匾里晒，邻家的猫来过两回，都被他拿笙赶走了。“你那边怎么说，叫小者原样带回来。我晚上还要记。”"
mood = "cheerful"
at = "sakai"
when = [{ kind = "alive", person = "yamashina_tokitsugu", value = true }]
objectives = [{ kind = "wait", days = 20, text = "等那个小者从京里跑回来" }, { kind = "at", at = "sakai", text = "回到堺" }]
news = "堺的药种座跟一条外来船为四斤朝鲜人参较了半天劲，人参最后一根不少，送进了京里一位公卿家。"
deadline_days = 120

