[[tracks.chapters.choices]]
key = "laugh"
text = "笑着收下，座里那一笔认了。"
next = "done"
reply = "小者这才把那口气叹完，说老爷交代：座里收去的那一份，是从谢仪里匀出来的，请您别嫌薄。下回来京里，先把堺的规矩跟他讲讲清楚，再伸手让他把脉。"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "yamashina_tokitsugu", value = 4 }, { kind = "flag", flag = "c13_request_yamashina_tokitsugu_partial" }]

[[tracks.chapters.choices]]
key = "correct"
text = "请他把账簿那一句改改，给我留点脸。"
next = "done"
check = { attr = "eloquence", base = 35, per = 6 }
reply = "回信来得快，说改了：“又，小者说，座里的人一翻账簿，此人的脸往下掉了一寸，掉到一半，想起这是公卿家的参，又自己提了回去。”小者念完，说厨下的人已经笑过一轮了，谢仪也照座里收走的那一份匀过，薄是薄了些。"
effects = [{ kind = "cash", value = 900 }, { kind = "affinity", person = "yamashina_tokitsugu", value = 6 }, { kind = "flag", flag = "c13_request_yamashina_tokitsugu_partial" }]

