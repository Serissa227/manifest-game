# C13d 请托：日记里的那个价（request_yamashina_tokitsugu）。Claude 写（2026-10-25），仅中文，不配英文覆盖。
# 人物：山科言继 yamashina_tokitsugu（1507 年生，1579 年卒，无 fate；男）。京里的公卿，会配药、吹笙，几十年天天写日记；cast：cast/historical_07_japan.toml（势力 imperial_court）。
#   1558—1578 年日程在京都，不下堺；全轨道只在信里和抄来的日记里说话，出面的是他家的一个年轻小者（无名，不进 cast）。
# 类型：送货（deliver）。brief 三章 offer → deliver → settle；settle 按交货时座里有没有记下船名拆成 settle / settle_noted 两章（见“结构说明”），文件里共四章。终点 done / failed。
# 报价：L（来信）。auto=true，offer 章 at=sakai，speaker 省略；family="c13_offer_sakai"、family_cooldown_days=20。
#   规划窗口（不进 TOML，普通章没有 window）：offer 1558-03-01 至 1578-06-30；deliver 1558-04-01 至 1578-10-31；settle 1558-05-01 至 1578-12-31。
#   offer 的 deadline 为 1578-06-30，timeout 直接 failed，不写见闻；deliver 的 deadline_days=180（釜山到堺，跨一片海）；settle 的 deadline_days=120。
# 依据·史实背景：《言继卿记》里大量记着言继给人配药、买卖药材；朝鲜人参经对马流入日本（docs/research/terra16 的研究笔记）；
#   堺的药种商结成座，外来药材要过座、交座钱，是行规（正文不把药种座写成坏人）。十德是医者、商人常穿的短外衣。
#   “左前”（先掩左襟、右襟压在上面）是给死人穿的掩法，言继的笑话拿这个说事。“天文十年”是 1541 年，在请托窗口之前。
# 依据·原创：小者与他总跑丢的草鞋；日记里“天文十年四月七日，于堺买人参一两，百二十文”那一行（编的，不是《言继卿记》原文）；
#   药种座的两个人、秤杆上烙的座印、账簿；檐下竹匾晒参、拿笙赶猫；宫里咳了一冬的老女房；两句写“我”的笑话。
# 不写的事：即位礼的筹款（澪主线 4），不写言继替朝廷募捐。人物无 secret；按 brief，回信里可以记“我”的笑话。
# 货款：人参 4 斤 × 基准价 230 × 1.25 = 1150，交货那一章三个选项都付（goods 目标在回应时扣货）。
# 报酬：最好的结局（settle 两个选项，检定成败都算）付 1600、技能 herbal_medicine +20、好感 +8（改笑话成功再 +2）、imperial_court 声望 +2、名声 +3、回忆一张；
#   折中（settle_noted）付 900、好感 +4（改笑话成功再 +2）。好感正向合计至多 2+3+8+2=15。唯一奖励物品：无。
# 来信：交货超时一封（≤120 字）；最好的结局里“笑着收下”与“改笑话失败”各一封（互斥），一次游戏至多一封。
# 结构说明：brief 的 settle 要按 clean / noted 拆选项。按本批约定，不用 requires 读本轨道自己设的旗标，改按 next 分章：
#   deliver 的“讲规矩”成功与“分等”去 settle（设 clean），“讲规矩”失败与“交给小者”去 settle_noted（设 noted），两章各两个选项，都没有 requires。
#   检定失败的分支没有回复：“讲规矩”失败（座里记下船名、说下回再算）写进 settle_noted 的正文；settle“改笑话”失败（日记不改）写进那封来信；
#   settle_noted“改笑话”失败写进分支的见闻。
# 超时：deliver 与 settle 超时按总决定 §二各扣好感 3，设 _late；deliver 超时来一封短信，settle 超时不来信。
# 招牌话：信里那一句“价钱我记着，药商也记着——……”全轨道只在 offer 正文出现（mio 变体是同一章的替换文字）。
# 读的旗标：c13_main_mio（offer 的变体 v1_mio，由澪的主线设，尚未写）。不读也不设 c7_ 旗标。
# 设的旗标（c13_request_yamashina_tokitsugu_<事件>）：accepted；终局 declined / done / partial / late；分支 clean、noted。
# 依赖：港口 sakai；商品 ginseng（只有 busan 卖）；技能 herbal_medicine；势力 imperial_court；属性 commerce、eloquence。无需 B10b 改名。
# 回忆插画清单：
#   mem-request_yamashina_tokitsugu-settle「言继卿记里的一行」：京里公家宅子的檐下，竹匾里摊着切片的人参，一只猫蹲在旁边，廊上搁着一支笙和摊开的日记。

[[tracks]]
key = "request_yamashina_tokitsugu"
name = "日记里的那个价"
kind = "request"
start = "offer"
auto = true
cast = ["yamashina_tokitsugu"]

# 一、报价：堺的码头，小者跑丢了一只草鞋，递上一封厚得像账本的信，和一页抄来的日记。
[[tracks.chapters]]
key = "offer"
title = "抄来的一页日记"
text = "堺的码头上，一个年轻的小者从人堆里钻出来，一只草鞋跑丢了也不回头捡。他递上的信厚得像一本账：头一张写京里这几天的雨，第二张写昨夜跟谁下双六输了两局，到第三张才说正事，还夹着一页从日记里抄出来的纸：“天文十年四月七日，雨。于堺买人参一两，百二十文。”“我配一味药，缺的就是这个。托人到堺问价，药商开口便是这一行的三倍。价钱我记着，药商也记着——只是他记的那个数，年年往上涨。”往下整整半页，他替我算什么叫合理：参从釜山来，过对马要交几成，受了潮折几成，船家该赚几分，一笔一笔都算到了。“照这个价结账，你不亏，我也不亏。”末了一行：要朝鲜参，四斤，根须要全。小者在一旁喘着气，光着的那只脚踩在另一只的脚背上。"
mood = "cheerful"
at = "sakai"
when = [{ kind = "date", from = [1558, 3, 1] }, { kind = "age", ge = 17 }]
deadline = [1578, 6, 30]
timeout = { next = "failed" }
family = "c13_offer_sakai"
family_cooldown_days = 20

[[tracks.chapters.variants]]
key = "v1_mio"
when = [{ kind = "flag", flag = "c13_main_mio", value = true }]
text = "堺的码头上，一个年轻的小者从人堆里钻出来，一只草鞋跑丢了也不回头捡。他递上的信厚得像一本账：头一张写京里这几天的雨，第二张写昨夜跟谁下双六输了两局，到第三张才说正事，还夹着一页从日记里抄出来的纸：“天文十年四月七日，雨。于堺买人参一两，百二十文。”“我配一味药，缺的就是这个。托人到堺问价，药商开口便是这一行的三倍。价钱我记着，药商也记着——只是他记的那个数，年年往上涨。”往下整整半页，他替我算什么叫合理：参从釜山来，过对马要交几成，受了潮折几成，船家该赚几分，一笔一笔都算到了。“照这个价结账，你不亏，我也不亏。”末了一行：要朝鲜参，四斤，根须要全。旁边又挤进一句小字：“姬君小时候的脉，我还记得——偏急。”小者在一旁喘着气，光着的那只脚踩在另一只的脚背上。"

[[tracks.chapters.choices]]
key = "accept"
text = "替他从朝鲜带四斤人参来。"
next = "deliver"
reply = "小者把信折好塞回我手里，又从怀里摸出一截炭笔：“老爷让我问您叫什么，晚上要记进日记。”我报了名字，他问是哪几个字，在掌心比画了两遍；又问船叫什么、船上几个人、今天吃过饭没有，说老爷交代过，问得越细越好。问完他才想起那只草鞋，一瘸一拐地回去找。"
effects = [{ kind = "flag", flag = "c13_request_yamashina_tokitsugu_accepted" }, { kind = "affinity", person = "yamashina_tokitsugu", value = 2 }]

[[tracks.chapters.choices]]
key = "decline"
text = "人参的买卖，我不碰。"
next = "failed"
reply = "小者也不多劝，把那页日记抚平，连信一起揣回怀里：“老爷也会记上一笔的。”他朝我鞠了一躬，转身走了几步，又回头看了看我，大概是在记我的长相，好回去一样一样说给老爷听。"
effects = [{ kind = "flag", flag = "c13_request_yamashina_tokitsugu_declined" }]

# 二、交货：人参卸上码头，药种座的两个人提着秤、夹着账簿等在那里。三个选项都交货、都付货款。
[[tracks.chapters]]
key = "deliver"
title = "药种座的秤"
text = "桐木匣从舱里抬上码头，盖子一揭，四斤人参卧在青苔里，根须一根没断，芦头上还带着釜山的土。言继的小者伸手要接，旁边已经过来两个人，一个提秤，一个夹着账簿，都穿素净的十德，先客客气气行了礼。“堺的规矩：外来的药材，先过药种座的秤，交了座里的钱，才进得了町。”提秤的那个把秤杆横过来给我看，杆上烙着座里的印。小者往我身后缩了缩，小声说老爷的信里没写这个。夹账簿的人已经舔湿了笔尖，等我报船名。"
speaker = "captain"
mood = "tense"
at = "sakai"
when = [{ kind = "alive", person = "yamashina_tokitsugu", value = true }]
objectives = [{ kind = "goods", good = "ginseng", qty = 4, at = "sakai", text = "四斤人参运到堺" }]
deadline_days = 180

[tracks.chapters.timeout]
next = "failed"
effects = [{ kind = "flag", flag = "c13_request_yamashina_tokitsugu_late" }, { kind = "affinity", person = "yamashina_tokitsugu", value = -3 }, { kind = "letter", person = "yamashina_tokitsugu", text = "参已经有了：宫里一位女房的兄弟从对马捎来两斤，价比堺的低，比我日记里的高。四斤等不到，两斤也够配。你那一行我没划掉，还在“托海上的人带参”底下，后头没写下文。" }]

[[tracks.chapters.choices]]
key = "argue"
text = "跟他们说明：这是公卿家自己配药用的，不进市面。"
next = "settle"
