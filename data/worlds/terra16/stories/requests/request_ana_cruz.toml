reply = "又过了几个月，骡夫带来一句话：“下一幅，我用那种。”信封里还压着一根小小的蜂鸟羽毛，绿里透着金，和第一封信上的那根一样。"

[[tracks.chapters.choices]]
key = "no_answer"
text = "回信只说：钱收到了，别的不答。"
next = "done"
effects = [
  { kind = "cash", value = 500 },
  { kind = "affinity", person = "ana_cruz", value = 4 },
  { kind = "fame", value = 1 },
  { kind = "flag", flag = "c13_request_ana_cruz_partial" },
]
reply = "骡夫把回信收好，说女主人看信的时候，大概又要等到下午。他问你还有没有别的话要带，你说没有，他就把回信又看了一遍，说这一句够了。"
