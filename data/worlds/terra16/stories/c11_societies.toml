kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "林中的口令"
text = "林子里天还没亮，几棵橡树底下站着几个人，谁也不报名字。知情者先把口令念完，一字一顿，念得很慢，像在数数。念完了，才轮到你把名字写在纸上，纸上没有落款，也没有别人的名字。"
choices = [{ key = "finish", text = "交钱，把名字写上。", reply = "二十五杜卡特交进知情者的手里，他把你的名字念了一遍，又低声把口令再说给你听。你走出林子时，天已经亮了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_vehm_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "vehm", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "hamburg"

