[[tracks.chapters]]
key = "trial"
title = "抄名册"
text = "会里的人把一本旧名册摊在桌上，纸边已经发黄。你要在一天之内把它抄完，字要和原本一模一样，不许多一笔，也不许少一个名字。坐在窗边低头写，抄错一行，就要从头再来。"
choices = [{ key = "finish", text = "交五十杜卡特，抄名册。", reply = "五十杜卡特入了账。你抄下的名册只有名字，没有住址，抄完的草稿当场烧掉，灰撒进了作坊的炉子。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_family_of_love_2_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "family_of_love", ge = 1 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 20 }] }]
at = "antwerp"

