[[tracks.chapters]]
key = "contact"
title = "爱之家"
text = "安特卫普的印刷作坊，每到周日就关得早。城里人都知道，作坊里的几个人照常进教堂，唱的也是本地的圣歌，只在回家后多念一段。亨德里克·尼克拉斯的名字很少有人说出口，书架上却留着他们的小册子，字要凑近了才看得清。"
choices = [{ key = "listen", text = "记下这本书的版式。", reply = "你把那本书的版式记下了：纸是本地的，字很小，书页边上没有印刷商的名字。这种书不卖给生人，要买，得先认得卖书的人。", next = "done", effects = [{ kind = "flag", flag = "c11_society_family_of_love_known", value = true }], requires = [] }]
at = "antwerp"
