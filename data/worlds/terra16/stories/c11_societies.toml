[[tracks.chapters]]
key = "trial"
title = "门外的早晨"
text = "法庭门外的石阶上站了一个早晨。进去的人低着头，出来的人大多不说话，有的人在石阶上停下来，扶着墙吐气。书记让你把每一个被传唤的名字记在纸上，写清时辰，交给他。进门前先交二十五杜卡特，看门人收的名目是门钱。"
choices = [{ key = "finish", text = "站一早晨，记下名字", reply = "二十五杜卡特交给了看门人，他把钱收进围裙里，一句话也没说。你的纸上记满了十一个名字，时辰都写在旁边。书记收下了纸，看了一眼你的袖口，只点了点头。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_inquisition_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "inquisition", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "seville"

