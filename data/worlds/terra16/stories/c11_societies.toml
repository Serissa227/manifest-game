start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "暗室的异象"
text = "暗室里没有窗，只点一盏灯。会里的人要你交上二十五杜卡特，当面把一条异象背给他们听。托莱多敕令里的那些句子不许提，只说你自己看见的。木匣放在桌角，里头已有好几枚银币，叠得很整齐。"
choices = [{ key = "finish", text = "交钱，背出一条异象", reply = "二十五杜卡特放进了木匣。你背了一段自己看见的异象，说有一条白色的路通到海边；屋里的人点了头，没有人笑。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_alumbrados_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "alumbrados", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "seville"

