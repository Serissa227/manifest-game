[[tracks.chapters]]
key = "contact"
title = "金羊毛骑士团"
text = "巴塞罗那主教座堂的诗班席上，挂着一圈骑士的纹章，每一枚下面都有一个名字。一个管钥匙的老人说，这个团是一位公爵在一百多年前立的，里头坐的都是王公和他们的亲信。问到开会的事，他只摇头，说钟声一响，诗班席上就没有外人了。"
choices = [{ key = "listen", text = "记下纹章的样子。", reply = "你看清了纹章的样子，记在本子的空页上。诗班席的木雕上刻着同样的羊毛，骑士们在那里议过什么事，席上的人才知道。", next = "done", effects = [{ kind = "flag", flag = "c11_society_golden_fleece_known", value = true }], requires = [] }]
at = "barcelona"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

