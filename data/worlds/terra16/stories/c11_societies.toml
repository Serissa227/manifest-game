# C11：结社真实试炼；赫尔墨斯七级的材料、行程、检定与失败出口。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[tracks]]
key = "c11_contact_hermetic"
name = "赫尔墨斯圈子"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "书店里的纸条"
text = "威尼斯里亚尔托桥边的一家书店，老板把一张折成四折的纸条夹进你买的希腊语字典里。纸上只有一行拉丁文，和一个画了星的圆圈。老板说，那是给常来买书的人看的，看懂了，店后面没有窗的那间屋子，会有人肯见你。"
choices = [{ key = "listen", text = "收下那张纸条", reply = "你收下纸条，夹进了账本的最后一页。三天后，书店的伙计在你的船舱门口放下一本没有封面的小册，册子里夹着一张威尼斯的街图。", next = "done", effects = [{ kind = "flag", flag = "c11_society_hermetic_known", value = true }], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_hermetic_1"
name = "赫尔墨斯圈子"
kind = "request"
start = "book_one"
auto = false

[[tracks.chapters]]
key = "book_one"
title = "安特卫普"
text = "安特卫普的书店里，一本旧版《神秘哲学》夹着两封信，信纸边缘烧焦了一角。写信的人说自己属于一个“同盟”，同盟的人散在各地，只用书信联络。末尾一句：余事不写，因信件危险。"
choices = [{ key = "hear", text = "买下这两封信", reply = "你付了钱。老板没找零，只用指甲在信纸边上划了一道，划痕正好落在一个字母上。回到船上，你对着烛光看了一夜，那个字母背面显出另一个词。", next = "book_two", effects = [], requires = [] }]
at = "antwerp"
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 0 }, { kind = "fame", ge = 10 }]

[[tracks.chapters]]
key = "book_two"
title = "里斯本"
text = "里斯本的书店开在圣母教堂后街，柜台后面坐着一位老妇人，账本用拉丁文记。她递来一封写给维尔茨堡的信，信封上印着圣雅各修道院的字样，信里只有一串数字，她说那是某种密钥的开头。"
choices = [{ key = "hear", text = "替她捎这封信", reply = "你把信贴身收好。离港那天，老妇人站在码头上，手里握着一枚黄铜小圈，没有挥手。", next = "book_three", effects = [], requires = [] }]
at = "lisbon"

[[tracks.chapters]]
key = "book_three"
title = "威尼斯"
text = "威尼斯的书店老板看了你一眼，递来一张希腊文的请柬。请柬上没有名字，只写着阿尔丁旧印刷所的地址和一个时辰。老板说，席上只说希腊语，听不懂就别去。"
choices = [{ key = "hear", text = "收下这张请柬", reply = "你把请柬折进袖口。当晚你走进阿尔丁旧印刷所的后院，灯已经点上，桌边的人都抬起头来，用希腊语问你从哪里来。", next = "dinner", effects = [], requires = [] }]
at = "venice"

[[tracks.chapters]]
key = "dinner"
title = "晚宴"
text = "阿尔丁新学园的会规写在门后的木牌上：席上只说希腊语，违者罚钱。桌上摆着一块铅样、一册菲奇诺的译本和一盏油灯。要坐下，先得带五块铅来，主人说那是铅字的合金，要拿来铸新字。"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
choices = [{ key = "learning", text = "用希腊语背出开头", reply = "你用希腊语背出《赫尔墨斯文集》的开头，席上的老人点了点头，把一块铅字样本推到你面前，说明天会有人来取。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_1_done", value = true }], requires = [{ kind = "skill", skill = "lang_greek", ge = 1, hard = true }, { kind = "read", work = "corpus_hermeticum" }], check = { attr = "learning", base = 60, per = 5 }, fail = { next = "study", effects = [] } }, { key = "eloquence", text = "用希腊语说一段俏皮话", reply = "你用希腊语讲了一段俏皮话，满桌笑成一团。有人当场让出一把椅子，又从怀里掏出一册旧册子，拍在你面前的桌上。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_1_done", value = true }], requires = [{ kind = "skill", skill = "lang_greek", ge = 1, hard = true }, { kind = "read", work = "corpus_hermeticum" }], check = { attr = "eloquence", base = 60, per = 5 }, fail = { next = "study", effects = [] } }]
at = "venice"
objectives = [{ kind = "goods", good = "lead", qty = 5, at = "venice" }]

[[tracks.chapters]]
key = "study"
title = "补习"
text = "晚宴上你的希腊语卡住了。席上的人没有嘲笑，只把你的名字记进一本小册，说等你把会规抄完、过了七天再来。威尼斯的客栈里，桌上堆着菲奇诺的译本，油灯烧到半夜，你一条一条地念。"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
choices = [{ key = "finish", text = "抄下会规，照着念熟", reply = "你把会规一字一字抄完，又照着念了七遍。第七天清早，有人敲门，把你的请柬又递了一次，这回上面写着一个新的时辰。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_1_done", value = true }], requires = [{ kind = "skill", skill = "lang_greek", ge = 1, hard = true }, { kind = "read", work = "corpus_hermeticum" }] }]
at = "venice"
objectives = [{ kind = "wait", days = 7 }]

[[tracks]]
key = "c11_trial_hermetic_2"
name = "赫尔墨斯圈子"
kind = "request"
start = "tin"
auto = false

[[tracks.chapters]]
key = "tin"
title = "锡的来路"
text = "圈子要的是锡，不问从哪里来。康沃尔的锡从普利茅斯上船，马六甲的锡要在港栈里现买，两条路都能到威尼斯，只是价钱和路上的日子各不相同。"
choices = [{ key = "cornwall", text = "在普利茅斯买下康沃尔的锡", reply = "康沃尔的锡装上了一条英格兰船，锭子上还带着矿坑里的泥。船长说，这一批够圈子用了，路上颠簸久了，锡要用布包紧。", next = "cipher", effects = [], requires = [{ kind = "at", at = "plymouth" }] }, { key = "malacca", text = "在马六甲的货栈买锡", reply = "马六甲的货栈里堆着一排排灰白的锭子，掌柜把价钱压到了圈子能接受的数目。锡装进木箱，箱上贴了一张没有字的纸条。", next = "cipher", effects = [], requires = [{ kind = "at", at = "malacca" }] }]
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 1 }, { kind = "fame", ge = 20 }]

[[tracks.chapters]]
key = "cipher"
title = "写密信"
text = "信纸用威尼斯的粗麻纸，字要写在两行之间的空隙里，再按《隐写术》的表把每个字母挪到第几格。维尔茨堡的人只认得这一套次序。威尼斯的货栈里要先备齐十锭锡，信和锡一同上路。"
choices = [{ key = "write", text = "照隐写术写下密信", reply = "密信写成了，表面只是一封讲生意的家书，字缝里却藏着另一套话。你把它折好，收进贴身的口袋。", next = "deliver", effects = [], requires = [{ kind = "read", work = "trithemius_steganographia" }] }]
at = "venice"
objectives = [{ kind = "goods", good = "tin", qty = 10, at = "venice" }]

[[tracks.chapters]]
key = "deliver"
title = "汉堡的转递"
text = "汉堡的信使行当里有人肯替你转递。密信要在半年之内送到维尔茨堡，送到了，那边会回一个圈子的记号。逾期就得补交费用，信使只看日子，不看人情。"
choices = [{ key = "finish", text = "把密信交给信使", reply = "信使把密信缝进账册的封皮，夹在一队去南方的驿车里。过了几天，维尔茨堡那边回来一句暗语，只有照着次序读的人才认得。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_2_done", value = true }], requires = [] }]
at = "hamburg"
deadline_days = 180
timeout = { next = "late", effects = [] }

[[tracks.chapters]]
key = "late"
title = "误了期限"
text = "信过了期，汉堡的信使不肯轻易收。他说要等满一周，让你照《隐写术》把密钥重新对一遍，再付清转递的银子。这一周里，别离开汉堡。"
choices = [{ key = "finish", text = "补交转递的费用。", reply = "银子数清放在桌上，信使把密信收进了袖口。他说下一班驿车赶得上，只是下一次不能再误期。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_2_done", value = true }, { kind = "cash", value = -100 }], requires = [{ kind = "read", work = "trithemius_steganographia" }, { kind = "cash", ge = 100 }] }]
at = "hamburg"
objectives = [{ kind = "wait", days = 7 }]

[[tracks]]
key = "c11_trial_hermetic_3"
name = "赫尔墨斯圈子"
kind = "request"
start = "stone"
auto = false

[[tracks.chapters]]
key = "stone"
title = "天降石的来路"
text = "天降的石头有两处可找。恩西斯海姆的那块挂在教堂里，看得见，却要先过守教堂人的眼；克雷马的落在麦田里，得先找到那片田。两处随你挑，圈子只要一块。"
choices = [{ key = "ensisheim", text = "去恩西斯海姆的教堂看那块石", reply = "教堂的老人带你进了侧廊，那块黑石挂在铁链上，表面有一道被火燎过的亮纹。你把它的样子画进小册，也记下了它挂的高度。", next = "ensisheim", effects = [], requires = [] }, { key = "crema", text = "去克雷马打听那场雨", reply = "克雷马的人还记得那一夜的雨，有人说石头落在谁家的田里，谁家的狗叫了一宿。你把地名和几个人的名字记下，答应天亮就去找那片田。", next = "crema", effects = [], requires = [] }]
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 2 }, { kind = "fame", ge = 30 }]

[[tracks.chapters]]
key = "ensisheim"
title = "恩西斯海姆的石"
text = "恩西斯海姆的陨石在 1492 年挂进了教堂，据说马克西米利安一世把它当作天意。石头如今还挂在那里，要先看清它，把它的来历报给圈子，才算数。"
choices = [{ key = "bring", text = "交出恩西斯海姆的碎块", reply = "碎块是从挂石的铁链底下扫来的石屑，装进一只铅盒，封口的蜡上印着圈子的小星。守教堂的老人问你是不是来买天意的，你没有答。", next = "battle", effects = [{ kind = "item", item = "fallen_stone", qty = -1 }], requires = [{ kind = "item", item = "fallen_stone", qty = 1 }] }]
at = "venice"
objectives = [{ kind = "discovery", discovery = "fall_ensisheim", reported = true }]

[[tracks.chapters]]
key = "crema"
title = "克雷马的雨"
text = "克雷马的陨石雨下在 1511 年。听说石头落进麦田，老农挖出来卖给了铁匠。得先找到那片田，把它报给当地的官府，圈子才认这块石头的来历。"
choices = [{ key = "bring", text = "交出克雷马的碎块", reply = "碎块交上去，圈子的人用一把小秤称过，分毫不差地记进账里。那片麦田的名字，也抄进了圈子的册子。", next = "battle", effects = [{ kind = "item", item = "fallen_stone", qty = -1 }], requires = [{ kind = "item", item = "fallen_stone", qty = 1 }] }]
at = "venice"
objectives = [{ kind = "discovery", discovery = "fall_crema", reported = true }]

[[tracks.chapters]]
key = "battle"
title = "海上的胜绩"
text = "石头的事说完了，圈子还要看你的手。威尼斯的海面上，龙骑士团的船常在夜里出没；赢下一场海战或决斗，圈子才肯把这一级记在你的名下。"
choices = [{ key = "finish", text = "赢下一场海战或决斗", reply = "海上那一场打得很短，龙骑士团的船挂着红十字退了。圈子的人在威尼斯的码头上替你记了一笔，没有人说多余的话。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_3_done", value = true }], requires = [] }]
at = "venice"
objectives = [{ kind = "battle", wins = 1 }]

[[tracks]]
key = "c11_trial_hermetic_4"
name = "赫尔墨斯圈子"
kind = "request"
start = "copper"
auto = false

[[tracks.chapters]]
key = "copper"
title = "精铜的来路"
text = "精铜要从日本或瑞典来。堺港的商人能备齐十锭，价钱压得低；斯德哥尔摩的铜行背后是法伦的矿场，铜纯，运到威尼斯却要绕过半个欧罗巴。你选哪一处，就在哪里把铜买下。"
choices = [{ key = "japan", text = "在堺港买下精铜", reply = "堺港的铜商把铜锭摆在门板上，一锭一锭敲给你听，声音清脆。他说这些铜从山里的矿上来，在库里放了一冬。", next = "mediate", effects = [], requires = [{ kind = "at", at = "sakai" }] }, { key = "sweden", text = "在斯德哥尔摩买下精铜", reply = "斯德哥尔摩的铜行在港边搭了一座棚，铜锭上压着一面盾，盾里三顶王冠。北方来的水手说，这铜比南边的都硬，敲起来有回声。", next = "mediate", effects = [], requires = [{ kind = "at", at = "stockholm" }] }]
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 3 }, { kind = "fame", ge = 40 }]

[[tracks.chapters]]
key = "mediate"
title = "讲和的请托"
text = "面具铺的塞西莉亚托人递话：伊洛娜前些日子在码头上说了她的不是，两人为一件说不清的旧事闹翻，如今谁也不肯先开口。她想找个中间人去讲明白。伊洛娜只在夜里的酒馆露面，你得找对地方。"
choices = [{ key = "mediate", text = "出面替两人讲和", reply = "你在两人中间坐了一个时辰。塞西莉亚说得急，伊洛娜只听，不接话，最后端起酒杯，说了一句你听不懂的方言。两人的脸色都松了些。", next = "bring", effects = [{ kind = "affinity", person = "cecilia", value = 1 }, { kind = "affinity", person = "ilona", value = 1 }], requires = [{ kind = "skill", skill = "negotiation", ge = 1 }, { kind = "affinity", person = "cecilia", ge = 4 }, { kind = "affinity", person = "ilona", ge = 4 }] }]
at = "venice"

[[tracks.chapters]]
key = "bring"
title = "交付精铜"
text = "讲和之后，圈子要的铜就该交了。十锭精铜要在威尼斯的货栈里验过成色，交付的人站在库房门口，看着铜锭一块块上秤。签字之前，别让铜离开你的视线。"
choices = [{ key = "finish", text = "把精铜交给圈子", reply = "秤杆平了，记账的人在册子上添了一行字，墨还是湿的。威尼斯的圈子里，从此有人在会上替你说话。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_4_done", value = true }], requires = [] }]
at = "venice"
objectives = [{ kind = "goods", good = "copper", qty = 10, at = "venice" }]

[[tracks]]
key = "c11_trial_hermetic_5"
name = "赫尔墨斯圈子"
kind = "request"
start = "mercury"
auto = false

[[tracks.chapters]]
key = "mercury"
title = "阿尔马登的水银"
text = "托莱多的旧书店里，老板压低嗓子说，阿尔马登的水银装在皮袋里，封着王室的印，过了塞维利亚就不归圈子的人管了。他把一张发黄的商路单推到柜台上。"
choices = [{ key = "route", text = "沿骡队的路线去打听", reply = "骡夫认得圈子的暗记，一路替你打听下来：三条路线，两处接货的人。皮袋封着王室的印，过关时最好不要多问。", next = "deliver", effects = [], requires = [] }]
at = "toledo"
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 4 }, { kind = "fame", ge = 50 }]

[[tracks.chapters]]
key = "deliver"
title = "运往亚历山大"
text = "五袋水银沿海路运到亚历山大，港栈的掌柜先看封印，再把每袋掂一掂，嫌其中一袋轻了些。港口的风带着烤面包和海盐的味道，货栈的门一扇扇关上。"
choices = [{ key = "deliver", text = "交付五袋水银", reply = "掌柜点清五袋，封印一个不少，在账册上记了一笔。账上只写了圈子的暗记，没有写你的名字。", next = "riddle", effects = [], requires = [] }]
at = "alexandria"
objectives = [{ kind = "goods", good = "mercury", qty = 5, at = "alexandria" }]

[[tracks.chapters]]
key = "riddle"
title = "地下的风"
text = "《造化之秘》里，一尊石像立在墓道尽头，脚下刻着“在我脚下掘地”。地下的风一起就灭灯，书上说要把灯放进透明的器皿，火才能留住。石板就在火照不到的地方。"
choices = [{ key = "cover", text = "照着书里的话下去", reply = "你照书里的路走下墓道，石像脚下的土果然松软。风把灯吹灭两回，第三回你把灯放进透明的玻璃罩里，石板露出了一角。", next = "weigh", effects = [], requires = [{ kind = "read", work = "creation" }] }]
at = "cairo"

[[tracks.chapters]]
key = "weigh"
title = "石板上的字"
text = "石板的原文要有人一句句比过。圈子里的人给了两个去处：威尼斯那间没有窗的屋子，或者布拉格旧城一家酒馆的地窖，那里的玛格达莱娜有一本拉丁通行本，页边写满了她自己的校语，比对要收钱。"
choices = [{ key = "prague", text = "去布拉格的地窖里比对", reply = "地窖里一股炭灰味。玛格达莱娜把石板的拓片铺在酒桶盖上，和她那本通行本逐行对着念。念到第三行，她停下，说有个字抄错了，笔画收得太快，像是赶工的人写的。她把这一处记进账里，下面一行是你该付的灯油钱。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_5_done", value = true }], requires = [{ kind = "at", at = "prague" }, { kind = "at", at = "prague", person = "magdalena" }] }, { key = "venice", text = "在威尼斯的暗室里比对", reply = "暗室的灯罩下，圈子里一位老人借来一块磨过的水晶，把石板上的刻痕看了又看。他说刻字的人用刀，通行本是拿笔誊的，两种字形本来就不该混在一起。他把结论写进小本，石板的原文算是认了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_5_done", value = true }], requires = [{ kind = "at", at = "venice" }] }]

[[tracks]]
key = "c11_trial_hermetic_6"
name = "赫尔墨斯圈子"
kind = "request"
start = "silver"
auto = false

[[tracks.chapters]]
key = "silver"
title = "银从何来"
text = "圈子要收一批白银入账，得先选定来源。波托西的银从高山的矿场驮下来，成色足，价钱也高。石见的银出自日本的山里，灰吹法是从朝鲜传过去的，银子里还带着一股炭火味。"
choices = [{ key = "potosi", text = "在波托西的银市买进银块", reply = "银市的掮客把一块银锭摆上秤，秤杆压得很低。他说矿工一锤一锤从山里凿出来，成色不掺假。你把银锭的重量记在纸上，回头好向圈子里交代。", next = "trust", effects = [], requires = [{ kind = "at", at = "potosi" }] }, { key = "iwami", text = "在平户买下石见银", reply = "平户的商馆里，石见银装在小袋里，袋口贴着纸条，写着灰吹的日子。商人只收你的钱，不问你要拿它去做什么。这一袋你亲手收进了船舱。", next = "trust", effects = [], requires = [{ kind = "at", at = "hirado" }] }]
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 5 }, { kind = "fame", ge = 60 }]

[[tracks.chapters]]
key = "trust"
title = "威尼斯的银锭"
text = "威尼斯那间没有窗的屋子，在一家玻璃作坊的楼上。你雇了一条驳船把银锭从丽多运进城，码头上没人多看一眼。圈子里一位老人等在楼梯口，看你把银锭一块块码上桌，码完了问，这些银子够不够买一卷海图。"
choices = [{ key = "finish", text = "在威尼斯把五块银锭交出", reply = "老人接过银锭，一块一块敲过，声音清脆。他从柜里取出一册旧账，在空白页上写下你的名字，墨还没干就合上了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_6_done", value = true }], requires = [] }]
at = "venice"
objectives = [{ kind = "goods", good = "silver_ingot", qty = 5, at = "venice" }]

[[tracks]]
key = "c11_trial_hermetic_7"
name = "赫尔墨斯圈子"
kind = "request"
start = "black"
auto = false

[[tracks.chapters]]
key = "black"
title = "黑化之炉"
text = "三步可以在威尼斯圈子自己的玻璃炉上走，也可以去布拉格，玛格达莱娜的炉子安在酒馆底下，楼上的脚步声一直落到炉边。七件印记按次序摆好，铅与银的合金装进封死的瓶子，瓶口只留一根细管出气。火一大，瓶底先裂，玛格达莱娜说烧坏了她照样记账，炭钱照样要收。"
choices = [{ key = "prague", text = "在布拉格的地窖里点火", reply = "炉火一点着，瓶底先泛出灰，再慢慢沉成黑。玛格达莱娜在墙上的账里添了一行，写了颜色和时辰，没写好坏。", next = "white", effects = [], requires = [{ kind = "at", at = "prague" }, { kind = "at", at = "prague", person = "magdalena" }, { kind = "item", item = "emerald_mark_tides", qty = 1 }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "item", item = "emerald_mark_toledo", qty = 1 }, { kind = "item", item = "emerald_mark_cortes", qty = 1 }, { kind = "item", item = "emerald_mark_seal", qty = 1 }, { kind = "item", item = "emerald_mark_solomon", qty = 1 }, { kind = "item", item = "emerald_mark_buddha", qty = 1 }] }, { key = "venice", text = "借威尼斯玻璃炉的余火", reply = "穆拉诺的玻璃炉还烫着，印记的拓片被热气烘得发软，你用一块铜镇纸压住它。黑泥翻上来的时候，炉边的学徒吓得后退了一步。", next = "white", effects = [], requires = [{ kind = "at", at = "venice" }, { kind = "item", item = "emerald_mark_tides", qty = 1 }, { kind = "item", item = "emerald_mark_genoa", qty = 1 }, { kind = "item", item = "emerald_mark_toledo", qty = 1 }, { kind = "item", item = "emerald_mark_cortes", qty = 1 }, { kind = "item", item = "emerald_mark_seal", qty = 1 }, { kind = "item", item = "emerald_mark_solomon", qty = 1 }, { kind = "item", item = "emerald_mark_buddha", qty = 1 }] }]
when = [{ kind = "date", from = [1563, 8, 25] }, { kind = "society", society = "hermetic", ge = 6 }, { kind = "fame", ge = 70 }]

[[tracks.chapters]]
key = "white"
title = "白化待七日"
text = "黑泥瓶要在炉边放满七日，灰白的霜才会从瓶底慢慢起来。看炉的人立下一条规矩：每天早上看一眼，不许开瓶，也不许提前问。七日未满，门外有人来催也不开。"
choices = [{ key = "prague", text = "七日后在布拉格开瓶", reply = "酒馆老板下来催过两回房钱，玛格达莱娜没有应。第七日的清早，瓶底白得像刚洗过的骨粉，她把瓶子换到另一只小炉上。", next = "red", effects = [], requires = [{ kind = "at", at = "prague" }, { kind = "at", at = "prague", person = "magdalena" }] }, { key = "venice", text = "七日后在威尼斯换瓶", reply = "玻璃市场的吵闹隔着窗户传进来，瓶里的白泥在日光下亮得发青。看炉的学徒把它倒进一只细口的杯，杯沿留下一圈白痕，他用指甲刮了刮，没刮掉。", next = "red", effects = [], requires = [{ kind = "at", at = "venice" }] }]
objectives = [{ kind = "wait", days = 7 }]

[[tracks.chapters]]
key = "red"
title = "大功业"
text = "白泥的七日已经放满，颜色从瓶口的边缘慢慢渗出一圈红。这一步最怕手抖，炉火要稳。看炉的人揭开瓶口的布，剩下的，要你自己守着烧。"
choices = [{ key = "prague", text = "在布拉格的地窖里红化", reply = "炉门开了一道缝，红光照到墙上，那里一道道刻着她烧坏过的炉数。瓶底那圈红慢慢铺满了瓶身，玛格达莱娜称了一回，在账上写下分量，旁边又添一笔炭钱。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_7_done", value = true }], requires = [{ kind = "at", at = "prague" }, { kind = "at", at = "prague", person = "magdalena" }] }, { key = "venice", text = "在威尼斯的玻璃炉里红化", reply = "玻璃炉的火一加猛，瓶子里透出红来，像熔了的铜。看炉的老人把瓶子贴在耳边听了一听，说里头有水在走，这一步成了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hermetic_7_done", value = true }], requires = [{ kind = "at", at = "venice" }] }]
objectives = [{ kind = "wait", days = 7 }]

[[tracks]]
key = "c11_contact_santa_maria"
name = "西班牙圣母骑士团"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "西班牙圣母骑士团"
text = "塔里法的码头上，一个老水手把黑袍红斗篷的边角搭在臂上，问你是不是从北边来的。他说海峡上原本有一支骑士团，如今人少得很，名册还在，名字后面画着十字，画着圆圈，还有空着的。"
choices = [{ key = "listen", text = "接过旧名册，翻开看看", reply = "老水手把名册往你手里一塞，指着其中一页上的星徽，说这支分团还在，人不多，都在等人回来认旗。你记下了星徽的样子，他满意地走了。", next = "done", effects = [{ kind = "flag", flag = "c11_society_santa_maria_known", value = true }], requires = [] }]
at = "tarifa"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_santa_maria_1"
name = "西班牙圣母骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "金星学徒"
text = "学徒要在塔里法的旧城堡里，把金星缝上红斗篷的左襟，针脚要密。缝完在城门前站满一夜，守着海峡。入会的五十杜卡特要先交给兄弟，钱不退。"
choices = [{ key = "finish", text = "交五十杜卡特，缝上金星", reply = "金星缝在左襟上，针脚歪了一处，老骑士没有拆。钱落进了钱箱，箱子上的锁是旧的，锁孔里有锈。天亮前你还站在城门口，名册上添了一行字，墨还没干。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_santa_maria_1_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "santa_maria", ge = 0 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 10 }] }]
at = "tarifa"

[[tracks]]
key = "c11_trial_santa_maria_2"
name = "西班牙圣母骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "旧海图同伴"
text = "同伴要照着分团留下的旧海图走一趟：从塔里法出发，沿海岸到拉科鲁尼亚，每个港口都要留下一个签名。先在城门口交五十杜卡特作份子，海图才交到你手里。"
choices = [{ key = "finish", text = "交五十杜卡特，领下旧海图", reply = "五十杜卡特交了出去，兄弟把旧海图折成一块塞进你怀里。图上的港口一个个标着小圈，头一个签名要在塔里法的码头上留。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_santa_maria_2_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "santa_maria", ge = 1 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 20 }] }]
at = "tarifa"

[[tracks]]
key = "c11_contact_christ"
name = "基督骑士团"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "基督骑士团"
text = "里斯本的码头上，一位托马尔来的修士在看卡拉维尔船的帆，帆上的红十字洗得发白。他问你有没有读过王国的海图，又说读过的人都要守口如瓶。"
choices = [{ key = "listen", text = "听他把话说完", reply = "修士说骑士团的团长之位早已并入王室，早年的总督是王子，如今只剩账房替它管着。他把一张海图的边角折起来给你看，说这些都不外传。", next = "done", effects = [{ kind = "flag", flag = "c11_society_christ_known", value = true }], requires = [] }]
at = "lisbon"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_christ_1"
name = "基督骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "抄本学徒"
text = "学徒要抄一份托马尔修道院里的海图，原件不许带出门。抄本要在里斯本的修会房里交上，入会的五十杜卡特同时交给管账的修士。抄完在祭台前把誓词背一遍。"
choices = [{ key = "finish", text = "交上抄本和五十杜卡特", reply = "管账的修士翻了翻抄本，对着光看了一遍，只说了一句：字迹认得。五十杜卡特收进了账房的抽屉，誓词由你自己背完。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_christ_1_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "christ", ge = 0 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 10 }] }]
at = "lisbon"

[[tracks]]
key = "c11_trial_christ_2"
name = "基督骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "押船同伴"
text = "同伴要替修会押一船通行证去果阿。途中不许在任何一座岛上停靠，船上的人不许问箱里是什么。到了果阿，要交回一份完整的航线记录。押船的五十杜卡特先在里斯本交上。"
choices = [{ key = "finish", text = "交五十杜卡特，领下押船的差事", reply = "箱子封着蜡，搬上船时没人说话。五十杜卡特收进了修会的账，船离开里斯本，码头上的修士只点点头，说航线记录到果阿再交。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_christ_2_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "christ", ge = 1 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 20 }] }]
at = "lisbon"

[[tracks]]
key = "c11_contact_hospital"
name = "医院骑士团"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "医院骑士团"
text = "马耳他的救济所门口，一位黑袍上缝着白十字的骑士在搬担架，靴子上沾着海盐。他看见你从港口上来，问你要不要搭把手，担架上躺着一个发烧的水手。"
choices = [{ key = "listen", text = "搭把手，抬到病床上", reply = "担架上的水手烧得厉害，你和骑士一起把他抬进病房。骑士说这一夜救济所记住了你，往后再来，门口不用问话。", next = "done", effects = [{ kind = "flag", flag = "c11_society_hospital_known", value = true }], requires = [] }]
at = "malta"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_hospital_1"
name = "医院骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "赎单"
text = "马耳他的救济所里，床位总是不够。司库要你连着七天照看伤员，换布、喂水，夜里记下谁咽了气。第七天傍晚，一个妇人跪在门廊上，说丈夫被海盗抓走，赎价二十五杜卡特，她凑不齐。司库把赎单推到你面前，说骑士团的账上没有这一笔，只有你的钱袋里有。"
choices = [{ key = "finish", text = "替被俘的人付赎金", reply = "二十五杜卡特从你的钱袋交给了司库。赎单上写着被俘渔夫的名字，你的名字写在最下面，是替付的人。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_hospital_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "hospital", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "malta"

[[tracks]]
key = "c11_contact_dragon"
name = "龙骑士团"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "龙骑士团"
text = "瓦尔纳的码头上，白天撑着黑绸伞的人站在货栈门口，对外商说话，声音不高，句句像在算账。一个男人把伞柄转过来，递给你一枚胸针：一条龙，尾巴绕着脖子成了一个环，背上裂开的地方渗出一个红十字。他问你要不要替人跑一趟夜路，报酬从不先说。"
choices = [{ key = "listen", text = "收下胸针，听他说完", reply = "你收下了那枚胸针。撑伞的男人说，夜里再来，他会告诉你该去哪座城。胸针在你掌心里一直是温的。", next = "done", effects = [{ kind = "flag", flag = "c11_society_dragon_known", value = true }], requires = [] }]
at = "varna"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_dragon_1"
name = "龙骑士团"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "夜里的信"
text = "夜里的掮客在瓦尔纳一间货栈的后屋等你，屋里不点灯，只开了一扇小窗。他要你把一封信从特尔戈维什泰送到锡比乌，路上不许点灯，也不许回头看。先交押金二十五杜卡特，信送到以后才有人来取收条。"
choices = [{ key = "finish", text = "收下信，押上二十五杜卡特", reply = "押金交给了掮客，他把一封蜡封的信塞进你的外套。信封上没有字，封蜡压着一条绕颈的龙。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_dragon_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "dragon", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "varna"

[[tracks]]
key = "c11_contact_benandanti"
name = "本南丹蒂"
kind = "request"
start = "contact"
auto = true

[[tracks.chapters]]
key = "contact"
title = "本南丹蒂"
text = "威尼斯的鱼市上，一个弗留利来的农夫看你一眼，问你是不是带着胎膜出生。他说这种人的灵魂在四季斋日的星期四夜里会离开身子，拿着茴香秆去和恶行者打一场。打赢了，麦子就长得高。旁边卖鳗鱼的女人低声说，城里有人去宗教裁判所报了他们的名字。"
choices = [{ key = "listen", text = "问他夜里的战斗", reply = "你问起夜里的战斗，农夫说出了茴香秆与高粱秆的分法，然后把话头收住，不肯再讲。你记下了他手上的老茧。", next = "done", effects = [{ kind = "flag", flag = "c11_society_benandanti_known", value = true }], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_benandanti_1"
name = "本南丹蒂"
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "麦田的夜"
text = "船把你送到弗留利的河岸，农夫们在麦田边等着。四季斋日的星期四夜里，你要守到天亮，和拿茴香秆的人一起赶走恶行者。进田前先交五十杜卡特，给看田的老妇人，她说这是夜里的酒钱。"
choices = [{ key = "finish", text = "付钱，领一束茴香秆", reply = "五十杜卡特付给了村里的老妇人，她从门后抽出一把茴香秆和一把高粱秆，说夜里要分开拿，不能让它们碰在一起。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_benandanti_1_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "benandanti", ge = 0 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 10 }] }]
at = "venice"

[[tracks]]
