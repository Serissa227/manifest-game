[[tracks.chapters]]
key = "trial"
title = "带胎膜的孩子"
text = "威尼斯的窄巷里，一个女人抱着刚出生的孩子哭。她说孩子是带着胎膜生下来的，城里的人都说这样的孩子夜里会出去。农夫们托人带话，今晚恰好是四季斋日的星期四，要一个同伴替她守这一夜。出门前交五十杜卡特，由传话的人转给产婆。"
choices = [{ key = "finish", text = "替孩子守完这一夜", reply = "五十杜卡特交给了接生的产婆。孩子的呼吸在天亮前平稳下来，母亲把脸埋进被子里，终于睡着了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_benandanti_2_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "benandanti", ge = 1 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 20 }] }]
at = "venice"

