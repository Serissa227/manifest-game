[[tracks.chapters]]
key = "contact"
title = "威斯特伐利亚的秘密法庭"
text = "汉堡的一扇木门上钉着一张传票，纸是新的，钉子却是旧的。上面写着你的名字和一个日子，没有署名。木匠说，这种东西他只在老人嘴里听过：威斯特伐利亚的林子里，从前有自由伯爵露天开庭，案子由知情者办，口令和文书只传给自己人。他师傅还说，自由伯爵的卷宗至今没有烧光。"
choices = [{ key = "listen", text = "记下这个名字。", reply = "你没有撕下那张纸，只把上面的名字和那个日子记在心里。从这以后，汉堡的木匠见了你，会先看一眼门框。", next = "done", effects = [{ kind = "flag", flag = "c11_society_vehm_known", value = true }], requires = [] }]
at = "hamburg"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_vehm_1"
