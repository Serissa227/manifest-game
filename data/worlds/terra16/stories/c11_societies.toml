[[tracks.chapters]]
key = "contact"
title = "夜里的敲门"
text = "威尼斯药铺的后门，一位老妇递给你一包干草药，说是“好会”的人托她带的。她问你家里有没有病倒的牲口，又说整洁的人家夜里会有人来敲门。她的手很凉，指甲缝里却是新鲜的草汁。"
choices = [{ key = "listen", text = "接过草药包", reply = "你接过那包草药。老妇说，好会的人从不走正门，夜里遇到门闩，她们会自己开。包草药的绳子是绿色的，你记住了它。", next = "done", effects = [{ kind = "flag", flag = "c11_society_good_society_known", value = true }], requires = [] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
