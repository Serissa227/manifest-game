[[tracks.chapters]]
key = "contact"
title = "光照派"
text = "塞维利亚的一间布店后屋里，几个人围着一盏灯坐着，谁也不念经。一位织工说，祷告的时候她看见一道光从胸口出来，光里有一条路。城里的修士不喜欢这样的话，宗教裁判所的人却很爱听。她请你坐下，不问你的来历。"
choices = [{ key = "listen", text = "坐下，听她讲光", reply = "你坐了下来。织工没有问你的名字，只说光是从里面来的，不必用别人的嘴去问。你把这句话记在了心里。", next = "done", effects = [{ kind = "flag", flag = "c11_society_alumbrados_known", value = true }], requires = [] }]
at = "seville"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
key = "c11_trial_alumbrados_1"
