[[tracks.chapters]]
key = "contact"
title = "门德斯家族的逃亡网络"
text = "安特卫普的一家香料行后院，有人把一张纸铺在桌上，手指从安特卫普划到威尼斯，又划向东边。问话的人不说自己是谁，只说这一家人从伊比利亚来，如今在别处做生意，要找走过这条路的人。"
choices = [{ key = "listen", text = "记下这条路线。", reply = "你记下了那条路线：安特卫普，翻过阿尔卑斯山，到威尼斯与费拉拉，再往东去伊斯坦布尔。几个驿站的名字你没有写下来，只在心里念了一遍。", next = "done", effects = [{ kind = "flag", flag = "c11_society_mendes_network_known", value = true }], requires = [] }]
at = "antwerp"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

[[tracks]]
