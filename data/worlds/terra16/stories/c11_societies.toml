[[tracks.chapters]]
key = "trial"
title = "印坊的错页"
text = "作坊里挂着一幅刚印好的地图，墨色还没干透。会里的人要你当众交五十杜卡特，然后指出图上的一处错误。你看了半天，才指着河口说，这条河被画反了方向。"
choices = [{ key = "finish", text = "交五十杜卡特，指出错处。", reply = "五十杜卡特交给了账房，账房没有点数。你指出的那处错误被人用刀刮去一层，重新画上了正确的河道。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_family_of_love_1_done", value = true }, { kind = "cash", value = -50 }], requires = [{ kind = "society", society = "family_of_love", ge = 0 }, { kind = "cash", ge = 50 }, { kind = "fame", ge = 10 }] }]
at = "antwerp"

[[tracks]]
