[[tracks.chapters]]
key = "contact"
title = "宗教裁判所"
text = "塞维利亚旧城的石阶上，异端法庭的书记递给你一张名单。名字都有，有几个划了红线，有几个只写了地址。他的袖口沾着墨渍，说话时眼睛不看你，只看你的手。他说最近有个商人会来找你，问你愿不愿意替他把名字记下来。"
choices = [{ key = "listen", text = "看清那条红线", reply = "书记把名单收进袖子里，只说了一句：这个城里的墙，比人的耳朵还多。你记住了那条红线的颜色。", next = "done", effects = [{ kind = "flag", flag = "c11_society_inquisition_known", value = true }], requires = [] }]
at = "seville"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

