kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "黑布木箱"
text = "热那亚港口的夜里，只有一盏灯挂在栈桥的桩子上。掮客把一只包着黑布的木箱放在石台上，说箱子很沉，不许打开，要送到约定的人手里。押金二十五杜卡特，先交，后拿。黑布上有一股海藻和烧过的蜡的味道。"
choices = [{ key = "finish", text = "接过木箱，押上二十五杜卡特", reply = "二十五杜卡特压在灯下的托盘里。木箱比看上去沉，里头轻轻响了一声，你没有打开。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_lilith_daughters_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "lilith_daughters", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "genoa"

