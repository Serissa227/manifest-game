[[tracks.chapters]]
key = "contact"
title = "沿海的夜鸟"
text = "热那亚的盐堆旁，码头的灯早熄了一半。一个女人解开头发披在肩上，面前摆着几块白面包，正卖给赶夜船的水手。港里人都叫她们沿海的夜鸟。她抬头看你，说你的影子比别人的长一截，要小心。"
choices = [{ key = "listen", text = "接过盐，不回头", reply = "你接过盐，走下码头时一声没应。女人说，夜里身后若有人叫你的名字，那多半是海浪在替她说话。你手心里留着一撮盐，咸得发苦。", next = "done", effects = [{ kind = "flag", flag = "c11_society_lilith_daughters_known", value = true }], requires = [] }]
at = "genoa"
when = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 5 }]

