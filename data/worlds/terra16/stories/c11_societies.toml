[[tracks.chapters]]
key = "trial"
title = "诗班席下"
text = "诗班席下没有灯，只有一扇高窗透进来的光。捐箱设在圣坛边上，谁肯出钱，谁就能靠近席位。管事的人不多说话，只等你把钱放进去，然后要你把纹章下面那句拉丁格言念给他听，声音要稳。"
choices = [{ key = "finish", text = "交钱，念出那句话。", reply = "二十五杜卡特落进捐箱，声音很轻。你念出纹章上的那句话，席上一个老人点了点头，把你的名字记进了本子。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_golden_fleece_1_done", value = true }, { kind = "cash", value = -25 }], requires = [{ kind = "society", society = "golden_fleece", ge = 0 }, { kind = "cash", ge = 25 }, { kind = "fame", ge = 10 }] }]
at = "barcelona"

[[tracks]]
