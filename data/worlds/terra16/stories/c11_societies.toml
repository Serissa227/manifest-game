kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "牲口的夜"
text = "会友给了你一个地址，在米兰郊外的一户人家。你要带一剂药剂过去，替病倒的牲口祝福。天亮时它要能站起来，站不起来，会友就不再认你。"
choices = [{ key = "finish", text = "拿药剂去祝福牲口", reply = "药剂用掉了，你把它倒进牲口的水槽，念了三遍祝词。天亮前它站了起来，户主红着眼谢你，会友却没有露面。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_good_society_1_done", value = true }, { kind = "item", item = "herbal_draught", qty = -1 }], requires = [{ kind = "society", society = "good_society", ge = 0 }, { kind = "item", item = "herbal_draught", qty = 1 }, { kind = "fame", ge = 10 }] }]
at = "venice"

[[tracks]]
key = "c11_trial_good_society_2"
name = "东方夫人的\"好会\""
kind = "request"
start = "trial"
auto = false

[[tracks.chapters]]
key = "trial"
title = "伦巴第的夜路"
text = "宗教裁判所的人明天就到村里来。会友说，有一位被指为女巫的妇人必须在那之前离开伦巴第，路上不许停留。她坐在灶边不说话，只问你的鞋子合不合脚。路上你要把药剂交给她，她说夜里喝一口就能睡。"
choices = [{ key = "finish", text = "趁夜把妇人送出伦巴第", reply = "被指为女巫的妇人换上你的斗篷，从后门上了一辆运奶酪的车。你交给她的药剂，她在车上喝了一口就睡了过去，车轮声远了。", next = "done", effects = [{ kind = "flag", flag = "c11_trial_good_society_2_done", value = true }, { kind = "item", item = "herbal_draught", qty = -1 }], requires = [{ kind = "society", society = "good_society", ge = 1 }, { kind = "item", item = "herbal_draught", qty = 1 }, { kind = "fame", ge = 20 }] }]
at = "venice"

