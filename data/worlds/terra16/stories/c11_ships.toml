[[tracks.chapters]]
key = "sighting"
art = "ship_draug_boat"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "礁石旁的半条船"
text = "卑尔根的渔妇说，夜里礁石那边有半截船，船头坐着一团海藻，远看像一颗乱发的脑袋。那团东西会动，只在大雾天靠近岸边。她的表哥见过一回，醒来时手里攥着一把湿海藻。"
choices = [{ key = "record", text = "问她半条船的事", reply = "你记下了渔妇的话，她把头巾系紧，说那团海藻只有在夏天的大雾里才会坐起来。你没有去礁石那边找。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_draug_boat_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "bergen"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_naglfar"
name = "纳吉尔法"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_naglfar"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "冬天的漂船"
text = "哈夫纳夫约杜尔的渡口上，有人压低嗓音说：冬天的海面上会漂来一条船，船板的缝是用死人的指甲填的。船工们在它附近总把指甲剪得干干净净，说落下的一片会被它拾走。渡口的老板把这话当笑话讲，却没有一个人笑。"
choices = [{ key = "record", text = "听完便不再问", reply = "你没有去找那条船，只把这话记在心里。渡口的人见你不再问，便转去说鳕鱼又涨了价。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_naglfar_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "hafnarfjordur"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_ghost_junk"
name = "鬼舶"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_ghost_junk"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "外海的残船"
text = "入夜前，外海漂来一队船影，帆只剩半幅，舵楼塌了一角，斜斜冲着外锚地来。港里有人说是遭难的同行，催着举火相认；老水手却按着火把不撒手，说头一回见的东西，先别急着认亲。"
choices = [{ key = "record", text = "举火，看它应不应", reply = "火光在桅顶晃了三晃，对面黑沉沉的，没有半点回应。船影擦着外锚地漂过去，老水手啐了一口，说它不要人，也不要货。天亮时海上空空的，只剩水面浮着一层灰白的泡沫。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_ghost_junk_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "yuegang"
when = [{ kind = "age", ge = 16 }]
objectives = []
