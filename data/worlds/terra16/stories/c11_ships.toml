[[tracks.chapters]]
key = "acquire"
art = "ship_fausto_quinquereme"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "福斯托的图样"
text = "这条五列桨船停在兵工厂最里边的船台上，是福斯托照古书复原的。管事的人说，它的桨孔排了五层，谁也不敢照着改。若你在威尼斯的名声够硬，管事的人肯让你看一看图样。"
choices = [{ key = "record", text = "让管事翻出图样来。", reply = "管事把图样从柜底抽出来，手上全是灰。纸角上写着福斯托的名字，桨孔的角度一个个标得清楚。兵工厂的人从此可以照着这张纸动手，木料和钱得你自己去凑。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_fausto_quinquereme_known", value = true }, { kind = "item", item = "c11_plan_fausto_quinquereme", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "reputation", faction = "venice", ge = 20 }] }]
