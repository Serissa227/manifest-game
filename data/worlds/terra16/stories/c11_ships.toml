default = { next = "failed", effects = [], news = "威尼斯的酒馆里都在说，福斯托的图样不知落到了谁的手里，那条五列桨船怕是再也造不成了。" }

[[tracks]]
key = "c11_ship_garay_paddle"
name = "加雷的明轮船"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_garay_paddle"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "明轮的试验"
text = "巴塞罗那港里的人说，加雷的明轮船下过一次水，靠五十个人摇轮，回转比桨帆船快。官府的禁令还压在案上，没人敢公开谈它。加雷还缺木料和铁器，他要十批木料、五批铁器，都得在巴塞罗那的船厂交清。"
choices = [{ key = "record", text = "替加雷出钱做试验。", reply = "你把两千枚金币压在加雷的桌上。他数了两遍，说够了。明轮的轴今晚就换，木料和铁器的清单交进了船厂，剩下的木料和铁器你得自己凑齐，运到船台边上。图样夹在试验记录里，他把它递给你时，手还在抖。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_garay_paddle_known", value = true }, { kind = "item", item = "c11_plan_garay_paddle", qty = 1 }, { kind = "cash", value = -2000 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "cash", ge = 2000 }] }]
at = "barcelona"
when = [{ kind = "age", ge = 16 }]
objectives = [{ kind = "goods", good = "timber", qty = 10, at = "barcelona" }, { kind = "goods", good = "ironware", qty = 5, at = "barcelona" }]

[[tracks]]
