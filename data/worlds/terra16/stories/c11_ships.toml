[[tracks]]
key = "c11_ship_syracusia"
name = "叙拉古西亚号"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_syracusia"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "书铺里的希腊文"
text = "亚特兰蒂斯外港的书铺里，有人把一册希腊文的书摊在柜台上，书页边上写满了细密的数字。书铺老板指着其中一行说，这是阿基米德的巨船，读得懂希腊文的人才看得出尺寸。"
# U02：下面的 hard = true 表示这道语言（或结绳）门槛按道理必须先会——读、写、译这种文字靠运气做不到，掷骰规则下照旧锁住。
choices = [{ key = "record", text = "照着希腊文读下去。", reply = "你把那几段慢慢译完，书里的数字一个个对上：铅板的厚度，花园的位置，投石机的臂长。译到末尾，巨船下了水，后来被送给了埃及的国王。书铺老板把图样包进油纸里。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_syracusia_known", value = true }, { kind = "item", item = "c11_plan_syracusia", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "read", work = "athenaeus" }, { kind = "skill", skill = "lang_greek", ge = 2, hard = true }] }]
at = "atlantis_port"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_elven_clipper"
name = "精灵的飞剪"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_elven_clipper"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "船坞的图纸"
text = "银枝的事了结以后，亚特兰蒂斯外港的船坞才肯开门。坞里的老精灵把一卷图纸摊在石台上，线条一笔不抖，船身长宽之比画成六比一。他们说这船顺风时跑起来像飞一样，只是造它的木料、铁料和工钱，都得你自己出。"
choices = [{ key = "record", text = "收下船坞的图纸", reply = "图纸用银线缝了封口，交到你手里。精灵没有道谢，只说船坞的门随时开着，尺寸可以来量。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_elven_clipper_known", value = true }, { kind = "item", item = "c11_plan_elven_clipper", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "flag", flag = "c11_silver_branch_complete", value = true }] }]
at = "atlantis_port"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_jackdaw"
name = "寒鸦号"
kind = "request"
start = "family"
auto = true

[[tracks.chapters]]
key = "family"
art = "ship_jackdaw"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "里贝拉的船坞"
text = "里斯本的码头上，一只寒鸦叼走了你的金币，一路飞进里贝拉的旧船坞。你追进去，老船匠正把一艘扎布拉的骨架拆成木料。他从木料堆里掏出金币还给你，说这是寒鸦欠你的。他的妻子和两个女儿要从门德斯网络走出里斯本，他身边没有别的人可托。"
choices = [{ key = "help", text = "答应替他送人", reply = "老船匠点点头，把一张写着暗号的纸片塞进你袖口。门德斯的人会在约定的夜里来接，你只需把人送到安特卫普。", next = "shelter", effects = [], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "society", society = "mendes_network", ge = 1 }] }]
at = "lisbon"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks.chapters]]
key = "shelter"
art = "ship_jackdaw"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "安特卫普仓库"
text = "安特卫普的接应处是一间堆满布匹的仓库。门德斯的人要五匹呢绒做掩护，货栈的账上得对得上，这一家人才算真的到了。你得把布搬进仓库，过秤、点数，一匹也不能少。"
choices = [{ key = "arrive", text = "把布交给接应人", reply = "布匹点齐，接应的人在账上记了一笔，把一家人的行李搬进仓库里间。你什么也没问，只记住了码头上那只寒鸦的叫声。", next = "handover", effects = [], requires = [] }]
at = "antwerp"
objectives = [{ kind = "goods", good = "cloth", qty = 5, at = "antwerp" }]

[[tracks.chapters]]
key = "handover"
art = "ship_jackdaw"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "改装图"
text = "回到里斯本，老船匠把一卷改装图摊开：船首加一座吊桥，船尾加桨座，帆装重新配过，铜皮要自己打。船尾那行刻字他照样描下来给你看，说是原来的主人刻的，他没舍得磨掉。"
choices = [{ key = "receive", text = "接过改装图", reply = "图纸卷进油布套，船匠用力按了一下你的手背。图样归你了，他说，坞里的工还得等几个月。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_jackdaw_known", value = true }, { kind = "item", item = "legend_ship_plan", qty = 1 }], requires = [] }]
at = "lisbon"

[[tracks]]
