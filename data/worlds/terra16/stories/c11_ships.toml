# C11：取得图纸、见闻与借乘；不可得船永远没有Done取得轨道。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[tracks]]
key = "c11_ship_flying_dutchman"
name = "飞翔的荷兰人"
kind = "request"
start = "letters"
auto = true

[[tracks.chapters]]
key = "letters"
art = "ship_flying_dutchman"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "亡者的信"
text = "荷兰人的小艇靠上里斯本的码头，艇上的人没有下来，只把一叠泡软的信递给你。信封上的字已经褪色，收信的人，多半早已不在了。"
choices = [{ key = "accept", text = "接下这叠信", reply = "信一封封分开，按地址记进账本。有几封被海水泡得粘在一起，你拿小刀一点点挑开，还是挑破了一封的角。", next = "deliver", effects = [], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "lisbon"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks.chapters]]
key = "deliver"
art = "ship_flying_dutchman"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "送达"
text = "信要送到岸上去。岛上的老妇人认出了信封，接过去没有哭，只把最上面那封贴在胸口，问船上的人从哪里来。"
choices = [{ key = "deliver", text = "替荷兰人把信送上岸", reply = "老妇人把信一封封念出声，念到第三封，声音停了一下。小艇在岸边等着，你们没有多留，天黑前就回了船。", next = "ship", effects = [], requires = [] }]
at = "persephone_isle_1"

[[tracks.chapters]]
key = "ship"
art = "ship_flying_dutchman"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "解咒"
text = "诅咒松开了。荷兰人最后看了一眼桅杆，把一卷修船图交到你手里。纸边焦黑，图上的龙骨线却清清楚楚，他说船从此归送信的人。"
choices = [{ key = "receive", text = "收下这卷船图", reply = "修船图折好收进怀里，焦痕蹭在指尖上。里斯本的船匠听说了，连夜把龙骨的尺寸量了一遍。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_flying_dutchman_known", value = true }, { kind = "item", item = "c11_plan_flying_dutchman", qty = 1 }], requires = [] }]
at = "lisbon"

[[tracks]]
key = "c11_ship_solomon_ship"
name = "所罗门之船"
kind = "request"
start = "borrow"
auto = true

[[tracks.chapters]]
key = "borrow"
art = "ship_solomon_ship"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "借乘"
text = "巴勒莫外海的雾里浮出一条船，船身白得像骨头，甲板上不见一个人。书上说，它只载配得上的人。你踏上跳板时，木板是温的。"
choices = [{ key = "borrow", text = "登上这条船", reply = "船开了七天，每天傍晚雾都会合上，早晨又散开。船上没有别的活人，夜里只听见舵柄自己转动。", next = "return", effects = [], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "attr", attr = "honor", ge = 60 }, { kind = "attr", attr = "morality", ge = 60 }] }]
at = "palermo"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks.chapters]]
key = "return"
art = "ship_solomon_ship"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "归还"
text = "七日期满，船在巴勒莫外海慢慢停住，雾从四面退开。舵柄上倒扣着一只杯子，杯底还留着一点红色。你没去碰它，那颜色是酒还是别的，谁也说不清。"
choices = [{ key = "return", text = "把缆绳交还", reply = "你解下缆绳，船身慢慢退进雾里。你带回的只有见过它的样子，船图没有到手。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_solomon_ship_known", value = true }], requires = [] }]
at = "palermo"
objectives = [{ kind = "wait", days = 7 }]

[[tracks]]
key = "c11_ship_skidbladnir"
name = "斯基德布拉德尼尔"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_skidbladnir"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "顺风图"
text = "银枝的事办完，船匠在工坊里摊开一卷羊皮图。图上只画了帆、舵和一个折起来的样子，没有写它该靠哪一片海岸。"
choices = [{ key = "record", text = "带走这卷图", reply = "羊皮边上有一排精灵的字，你念不出，船匠替你念了一遍。之后你的船簿上多了一行：斯基德布拉德尼尔，图纸一张。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_skidbladnir_known", value = true }, { kind = "item", item = "c11_plan_skidbladnir", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "flag", flag = "c11_silver_branch_complete", value = true }] }]
at = "atlantis_port"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_treasure_ship"
name = "四十四丈宝船"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_treasure_ship"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "石桌上的原记"
text = "月港船坞的石桌上，温星槎一页页翻开你带来的过洋牵星图原记，纸边朱笔的改痕被海风吹得发颤。她嘴里念着祖父提过的那条大船，又说龙江厂的老匠手里还留着半张样子。她要先掂一掂你的分量，再谈图。"
choices = [{ key = "record", text = "请她校图，领走船图", reply = "温星槎一页页校过，在末页按下指印，把原记还到你手里，另推来一张折得发软的船图。“后生，图归你，船得自己造。木头和铁，月港的船厂不赊账。”", next = "done", effects = [{ kind = "flag", flag = "c11_ship_treasure_ship_known", value = true }, { kind = "item", item = "c11_plan_treasure_ship", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "item", item = "star_crossing_original", qty = 1 }, { kind = "affinity", person = "wen_xingcha", ge = 8 }] }]
at = "yuegang"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_pati_unus"
name = "帕蒂·乌努斯的巨舰"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_pati_unus"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "扎巴拉的船图"
text = "扎巴拉的老木匠说，淡目岸上搁着一条爪哇大船，船壳一层压一层，中间抹着石灰调的胶泥。1513 年它随帕蒂·乌努斯去攻马六甲，葡萄牙人最大的炮也只在船舷上留下白印子。战败后船被拖上岸，至今派人看守。图纸收在卡林亚玛特女王的账房里，她要先看你的为人。"
choices = [{ key = "record", text = "把图纸收进袖里。", reply = "女王翻过账簿，合上，把一卷图纸推到你面前。木匠们在图纸边上画了三遍线，才肯相信你不是来抢船的。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_pati_unus_known", value = true }, { kind = "item", item = "c11_plan_pati_unus", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "affinity", person = "kalinyamat", ge = 8 }, { kind = "alive", person = "kalinyamat", value = true }] }]
at = "jepara"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_santa_anna"
name = "圣安娜号"
kind = "request"
start = "acquire"
auto = true

[[tracks.chapters]]
key = "acquire"
art = "ship_santa_anna"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "骑士团的老船"
text = "马耳他的港里停着一条老大卡拉克，船身上的漆早掉光了。骑士团的书记官带你下到舱底，指给你看水线以下包着的铅皮：那是为了水密，不是为了挡炮。舱里还有一间小礼拜堂，烛台上积着灰。"
choices = [{ key = "record", text = "请书记官取出图纸。", reply = "书记官从柜里取出一卷发黄的图纸，说骑士团的老船该换个人照看了。你签下收据，船还停在港里，等着你去修。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_santa_anna_known", value = true }, { kind = "item", item = "c11_plan_santa_anna", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "society", society = "hospital", ge = 1 }] }]
at = "malta"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_botafogo"
name = "博塔福戈号"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_botafogo"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "河口的大船"
text = "码头上的人指给你看河口里那条大盖伦，船尾的纹章在日头下晃眼。船身比别的船宽出半截，甲板上的炮口一个挨一个，数都数不清。门房说，要上船得先找船长，可船长这几天不见人影，只让水手在缆绳上晾衣裳。"
choices = [{ key = "record", text = "记下船名与吃水。", reply = "你在小册子上记下船名、船尾的纹章和吃水线的高度。傍晚时它解缆出港，码头上只剩几道缆绳的压痕。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_botafogo_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "lisbon"
when = [{ kind = "age", ge = 16 }]
objectives = []

[[tracks]]
key = "c11_ship_henry_grace"
name = "亨利神恩号"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_henry_grace"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "伍利奇的烟"
text = "你赶到泰晤士河边的时候，伍利奇方向还在冒烟。驳船上的人说，那是亨利八世时造的旗舰，船身高得能压住码头，如今烧成了一截桅杆和几根黑木头。八月的热风把灰吹进了每个人的衣领里。"
choices = [{ key = "record", text = "走近河岸看一看。", reply = "烧焦的木板泡在水里，黑得发亮。驳船的水手捞出一枚大铜钉给你看，说是从甲板的缝里翻出来的。你回头把船的轮廓画在随身的纸上。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_henry_grace_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "london"
when = [{ kind = "age", ge = 16 }, { kind = "date", from = [1553, 8, 1] }]
objectives = []

[[tracks]]
key = "c11_ship_lepanto_galleass"
name = "勒班陀加莱赛战船"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_lepanto_galleass"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "兵工厂的弹痕"
text = "兵工厂的船坞里，几艘加莱赛还带着弹痕。威尼斯人把它们排在阵前，炮位一层压一层，底舱里的人全靠鼓声划桨。老水手摸着船舷上的一个窟窿说，那天风向变了，烟把人眼都糊住了。"
choices = [{ key = "record", text = "问船上的老水手。", reply = "老水手讲了很多。你记下的那几句是：加莱赛在阵前像一排会喷火的墙，底舱里的桨手都是锁着的囚犯。他们的船长已经出港，你没能再问。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_lepanto_galleass_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "venice"
when = [{ kind = "age", ge = 16 }, { kind = "date", from = [1571, 10, 7] }]
objectives = []

[[tracks]]
key = "c11_ship_san_martin"
name = "圣马丁号"
kind = "request"
start = "sighting"
auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_san_martin"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "里斯本的旗舰"
text = "五月的里斯本，码头上堆着饼干桶和火药箱，装船的人一天到晚不歇。西班牙的旗舰圣马丁号停在最里边的泊位，船身高，炮窗密密排着。水手们不让人靠近，只说这船要往北开，去海峡那边打仗。"
choices = [{ key = "record", text = "托人递话给舰上的官员。", reply = "管事的人把你的名帖扔回来，上面只写了一句：这条船的事，不是商人该问的。你的名字被记在了门房的簿子上。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_san_martin_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "lisbon"
when = [{ kind = "age", ge = 16 }, { kind = "date", from = [1588, 5, 1] }]
objectives = []

