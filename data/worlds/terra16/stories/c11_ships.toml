auto = true

[[tracks.chapters]]
key = "sighting"
art = "ship_falkenberg"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "北雾里的船"
text = "卑尔根的码头上，一个老水手喝得半醉，说北边的雾里有条船。船帆是黑的，船尾坐着两个影子，在甲板上掷一副骨骰子。赌注是船长的灵魂。老水手说，你若想追过去，雾会先散，船也跟着没了。"
choices = [{ key = "record", text = "记下老水手的话", reply = "你把这段话记进小册。老水手喝干了杯底，说那条船什么时候再来，谁也说不准。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_falkenberg_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
at = "bergen"
when = [{ kind = "age", ge = 16 }]
objectives = []

