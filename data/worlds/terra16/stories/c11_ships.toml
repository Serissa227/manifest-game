art = "ship_ark_royal"  # 插画 key（art/lore.ts；按当时的时辰与天气挑版本）
title = "伦敦的船坞"
text = "1588 年的春天，伦敦的船坞里，皇家方舟号的船身刷了新漆。船匠说，这船要去迎西班牙人，英格兰的水手都想上它。枢密院的一个文书把你拦在栏杆外，问你有没有印信。"
choices = [{ key = "record", text = "求见管船坞的文书。", reply = "文书翻了翻名册，说皇家方舟号要等女王的旨意才能让外人看。你留下了名帖，他收下了，却没有答应。石阶上的人来来去去，没人多看你一眼。", next = "failed", effects = [{ kind = "flag", flag = "c11_ship_ark_royal_known", value = true }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }] }]
