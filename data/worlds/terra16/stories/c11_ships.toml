title = "散落的笔记"
text = "热那亚的旧书摊上，一叠散页被当作废纸卖。拼在一起，是双层船壳的图：外壳与内壳之间留着一道空隙，旁边标着尺寸。书摊老板说，手里有残页的人拿去船厂比对，就能看出哪一张接哪一张。"
choices = [{ key = "record", text = "拿残页去船厂比对。", reply = "残页在台上摊开，老匠人对着光看纸背的墨迹，把双层的船壳一块块拼了出来。他在空白处写下一行小字，说造船的钱得另外算。图样交到你手里。", next = "done", effects = [{ kind = "flag", flag = "c11_ship_leonardo_double_hull_known", value = true }, { kind = "item", item = "c11_plan_leonardo_double_hull", qty = 1 }], requires = [{ kind = "age", ge = 16 }, { kind = "fame", ge = 15 }, { kind = "item", item = "leonardo_note", qty = 1 }] }]
