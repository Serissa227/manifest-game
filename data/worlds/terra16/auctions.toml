after_loss = "托莱多的钢，名匠亲手开的刃，剑身压弯了能自己弹直。城里学西班牙剑法的年轻贵族把预展的桌子围了三层。若是没抢到，书记会给你得主的名字；帮得主一个忙，剑可以换，也能借你去剑馆试几手。"

