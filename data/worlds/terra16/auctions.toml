# C4 年度重点拍卖。固定月份、会期、数值与抽取权重均为游戏编制。
# 同一 item 每场至多抽一次；预告20天、预展5天，年度按年份和种子抽4–6件。
# 人物均引自 PLUS §2 成年NPC；对应人物表尚待整合，详见 DECISIONS。
# 真伪是后台真相，未鉴定时不得向界面泄露；无玩家寄售。

[[auctions]]
key = "venice_incanto"
name = "国营商船的航次拍租"
port = "venice"
month = 3
days = 3
announcement_days = 20
preview_days = 5
lots_per_session = [4, 6]
consignment = false
basis = "historical"
sources = ["威尼斯参议院的国营商船航次拍租制度（incanto）；1550年代具体航线待核。附带小件器物池、年度日期与个人特许为游戏编制。"]
lore = "元老院的书记先念今年的航线与船期，穿黑袍的贵族一条条认标；舱位拍定了，才轮到穆拉诺的玻璃和书铺送来的阿尔丁本。台下挤着德意志商馆的掌柜、希腊来的雇佣兵，还有替东家抢一格舱位的代理人。"

[[auctions.lots]]
item = "venice_voyage_concession"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "过关省下的税比底价还多，德意志商馆的掌柜们年年为这一格舱位红眼。槌落别家，就问书记是谁中的标——中标的人总缺人押货，替他跑一趟，舱位或转或借，都好商量。"

[[auctions.lots]]
item = "murano_mirror"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "照得出脸上每一道细纹，贵妇们说它比忏悔神父还不留情面；托马索在预展时对着它练了半天鬼脸。没抢到的话，书记会告诉你得主是谁，替人家办成一件事，镜子可以换来，或借去照几天。"

[[auctions.lots]]
item = "venice_glass_cup"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "薄得像一口气吹成的，斟上酒只见酒色不见杯。托马索举手时说是替一位不肯露面的老爷买——是真话还是台词，没人分得清。书记合上簿子会说：“得主的名字在这儿。阁下替他办成一件事，杯子就好谈了。”"

[[auctions.lots]]
item = "murano_beaker"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "杯壁里的白丝是怎么绕进去的，穆拉诺的匠人到死都不肯说；北方来的商人想买一只回去，让自家炉工照着琢磨。落槌的若不是你，书记知道它进了谁家——替那家人跑一趟腿，就有得谈。"

[[auctions.lots]]
item = "murano_bottle"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "塞子磨得严丝合缝，香水铺的老板说，连主人的秘密也漏不出来。城里几位有名的交际花都派了人来竞。输了也别急，书记的簿子上记着得主；替人家了一桩心事，换或借都能开口。"

[[auctions.lots]]
item = "homer_iliad_aldine"
reserve = 933
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "阿尔丁的小开本，揣在袖里就能带上船读。西奥多说这是他祖上的诗，非竞不可——荷马的古希腊话他到底读得懂几句，没人敢问。若被人买走，书记记着得主；替他办件事，书可以借你读完，或拿别的书换。"
from = 1553

[[auctions.lots]]
item = "homer_odyssey_aldine"
reserve = 933
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "水手最爱的那一部：一个人在海上漂了十年，还认得回家的路。托马索说奥德修斯是天下头一个好演员，扮起乞丐来只有老狗认得出。槌落别家，问书记要得主的住处，帮他一回，再求借或换。"
from = 1553

[[auctions.lots]]
item = "pacioli_venice"
reserve = 933
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "账房学徒的圣经：借方贷方两边一对，就知道谁在说谎。阿尔维塞翻到记账那一卷，停了很久——他要对的账，未必都是钱。若被人拍走，书记那儿有得主的名字；替他把一件事办妥，书借得来，也换得来。"
from = 1553

[[auctions.lots]]
item = "portuguese_astrolabe"
reserve = 480
increment = 50
weight = 3
authenticity = "genuine"
after_loss = "一个葡萄牙领航员在里亚尔托欠下一身酒账，拿它抵了债。彼得想把刻度描回安特卫普去，围着它转了一整个上午。没抢到，就去问书记谁买的；替那人办成一件事，借来量几回星，或者干脆换走。"

[[auctions.lots]]
item = "schiavona_master"
reserve = 1600
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "总督卫队里的达尔马提亚人佩的就是这种宽剑；这一把出自名匠，护手正合一只握缰绳的手。西奥多看它的眼神，像在看一匹好马。落在别人手里，书记会告诉你是谁；帮他一个忙，剑可以换，也可以借你佩一阵。"

[[auctions.lots]]
item = "lute"
reserve = 480
increment = 50
weight = 3
authenticity = "genuine"
after_loss = "福森来的德意志琴匠在威尼斯做的，琴腹里还贴着他的签条。托马索一听拨弦就挪不动脚，说剧团缺的正是这一把。若是输了，书记查得到得主；替人家办成一件事，琴可以换，也可以借来弹一季。"

[[auctions.lots]]
item = "flemish_tapestry"
reserve = 1400
increment = 100
weight = 3
authenticity = "genuine"
after_loss = "布鲁塞尔织坊的猎鹿图，翻过阿尔卑斯一路驮来的。大运河边好几座府邸的管家都在心里量自家大厅的墙。被人拍走的话，书记知道它要挂进谁家；替那家办件事，再谈换或借。"

[[auctions.lots]]
item = "unicorn_horn"
reserve = 1400
increment = 100
weight = 1
authenticity = "fake"
after_loss = "据说碰到毒酒会冒汗，药铺老板想刮下粉来卖，一钱粉抵一钱金。台下有人小声说，圣马可的宝库里也收着这样一支。若落到别人手里，书记记着得主；帮他办成一件事，角可以换，或借来请人验一验。"
fake_note = "是北海里一种长牙鲸的牙，冰岛的渔人拿它换铁钉和面粉。包它的油布上有一枚汉萨商号的火漆印——别扔，顺着这枚印，能找到是谁把它卖到南边来的。"

[[auctions.lots]]
item = "xuande_censer"
reserve = 1400
increment = 100
weight = 3
authenticity = "unsure"
after_loss = "威尼斯难得见到大明的铜炉，这一只是从里斯本一路转卖过来的，炉底那几个字满城没人念得全。德意志商馆的一位掌柜说，奥格斯堡的东家点名要它。若被人买走，问书记得主是谁，替他办件事，再谈换来或借看。"

