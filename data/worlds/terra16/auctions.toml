after_loss = "卖家说它是1511年克雷马那场石雨里捡的，一面焦黑，一面像生铁。城里几位守着炉子的先生都来摸过，有一位摸完就没走。若落到别家，书记那儿有得主的住址；替人家办成一件事，石头能换来，或借去称一称。"

[[auctions.lots]]
item = "toledo_rapier_master"
reserve = 1600
increment = 100
weight = 3
