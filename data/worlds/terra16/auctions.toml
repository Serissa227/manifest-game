story_hook = "里贝拉老船匠留下的交接单上写得明白：寒鸦号的改装图被人带去了威尼斯。今年拍租的目录末尾，果然多出一卷不署名的船图。"
after_loss = "兵工厂来的人和阿尔维塞都在预展时把这卷图看了两遍。槌落别家，就向书记讨得主的住址；替对方办成他托的事，原图可以换回来——实在不肯，也得让他点头，许你的船匠照着抄一份。"

