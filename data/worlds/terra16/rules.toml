[voyage_posts]
# H01 岗位与装备在海上的效果（docs/VOYAGE-PLAN.md §2）。同一舰队的在岗航海士与旗舰上的主角取较高者，再与会计等所有者级岗位取较高者。
# “值”：比例类钩子（storm_check、disease_guard、healing、supply_discount、intel_detection、fleet_coordination、melee、duel）按百分点；
# upwind 按度、morale 按天、position_fix 与 steering_precision 按点数（0–100），fog_sailing 的 1 = 抵消 100%。
# 只对玩家舰队生效；关掉后与改动前逐字节一致。以下是各项的上限。
enabled = true
upwind_max = 8               # 顶风死区最多收窄 8 度
fog_max = 100                # 雾天降速（×0.9）最多抵消 100%
storm_max = 60               # 暴风雨的船体损伤与落水货最多 −60%（与秘术的 storm_guard 相乘）
disease_max = 70             # 疾病发生概率最多 −70%
healing_max = 50             # 疾病死亡比例最多 −50%
supply_max = 30              # 粮水日耗最多 −30%
morale_max = 30              # “航行超过 25 天后士气每天 −1”的起点最多推迟 30 天
steering_max = 60            # 触礁、搁浅的损伤最多 −60%（H04 暗礁、H05 登陆读取）
position_max = 50            # 看见港口与地标的距离最多 +50%
intel_per_cell = 5           # 看见别的舰队：每 5 个百分点多看 1 格
intel_cells_max = 4          # 最多多看 4 格（6 格 → 10 格）
coordination_max = 50        # 多船舰队：航速从最慢船向次慢船最多靠拢一半
boarding_max = 100           # 接舷的船员项最多 +100%（melee + duel 的一半）

