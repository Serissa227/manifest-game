fouling_cold_every = 2       # 寒带海区每 2 天 +1
fouling_slow_max = 15        # 附着 100 时航速 −15%（按附着线性）
# ── 帆缆（0–100，100 为完好）：航速 ×(70 + 帆缆 × 30 / 100)%，顶风死区 +(100 − 帆缆) / 10 度 ──
rigging_every = 10           # 每 10 天自然磨损 1 点
rigging_gale_wind = 8        # 风力 ≥ 8 又满帆算“大风满帆”
