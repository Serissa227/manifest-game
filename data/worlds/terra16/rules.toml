tier_gate = { gain_pct = [0, 7, 28, 75], root = [0, 0, 3, 5], bond = [0, 0, 15, 35], rank = [0, 0, 0, 2], tool = [0, 0, 30, 90], gift = [0, 0, 0, 60] }
fee_academy = [1, 2, 4, 9]                            # 学院学费 / 格；家乡按 fee_home_pct% 向上取整
fee_home_pct = 50
job_income = [5, 9, 15, 24]                           # 打工一点的收入，按工种的当前档
job_promote = [0, 8, 20, 40]                          # 晋到第 k 档要的累计点数
job_promote_gain = [0, 0, 40, 120]                    # 另要“交易 + 口才”比开局多
result = { fail_tired = 60, fail_tired_bp = 1500, fail_pct = 50, great_bp = 500, great_mood_bp = 500, great_with_bp = 500, great_pct = 160 }
moment = { chance_pct = 35, pity_weeks = 4, steady_pct = 110, risky_win_pct = 180, risky_lose_pct = 50, risky_fatigue = 5, risky_bond = 2, risky_max_pct = 90, clever_pct = 50, clever_max_pct = 90, clever_cash_per_point = 4 }
illness = { at = 80, base = 70, pct_per_point = 4, weeks = 2, recover = 20, points = 1 }
missions = { merit_done = 12, merit_fail = 5, giver_fail_affinity = 3, due_week = 3 }
ranks = [0, 60, 200, 380]                             # 到见习 / 正式 / 得意 / 免许的勋功线（规格 60/150/260，见任务单需裁决 1）
rank_points = 1                                       # 正式起行动点 +1
reviews = [3, 6, 9, 12]                               # 评定月（第 4 周周末）
score = { craft = [4, 4, 4, 4, 2], root = 3, skill_per = 60, rank = [0, 10, 25, 45], mission = 2, exam_pass = 15, exam_honor = 10, contest = [6, 4, 2], contest_cap = 48, contest_divisor = 2, people_levels = [15, 35, 60, 85], people = [1, 2, 3, 4], marker_per = 2, resolved = 3, voyage = 5, duty_milestone = 2 }
bands = { bing = 100, yi = 300, jia = 400, te = 480 } # 丁 < 100 ≤ 丙 < 300 ≤ 乙 < 400 ≤ 甲 < 480 ≤ 特
savings = { keep_pct = 50, score_per = 200, score_max = 15, keep_max = 1500 }   # keep_max：随身余钱最多 1500 文
capital_value = { crew = 30, food = 3, water = 1, ally = 600, mate = 900, tolerance_pct = 5 }
guarantee = { bands = ["ding", "bing"], amount = 1500, rate_pct = 50 }
