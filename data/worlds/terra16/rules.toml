# H03：天气团（docs/VOYAGE-PLAN.md §4.1）。海区的“暴风雨 / 雾”段落改由 0–2 个会移动的团承载，开进团里才挨风暴、进雾；
# 团外把海区天况降一级（暴风雨 → 雨，雾 → 多云）。只对玩家（含模拟器 bot）的舰队生效，NPC 仍按海区天况。
# 缺省（不写这一段的世界，如经典世界）开关是关的。数值的来历见 docs/drafts/h03-handoff.md。
[weather_cells]
enabled = true
# 风暴团与雾团的半径（格）
radius = [3, 8]
# 飑（普通雨天里一阵急风骤雨，团内风力更大、不伤船）的半径（格）
squall_radius = [2, 4]
# 每天顺着当天的风移动的格数
drift = [1, 3]
# 一个海区同时最多几个风暴团或雾团
max_cells = 2
# 风暴团内的受损概率 = 海区暴风雨当天的受损概率 × 这个百分比（团外不受损，所以团内加倍，不绕的人损耗略少于从前）
storm_hit_pct = 200
# 飑内的风力加成（级）
squall_wind = 3
# 航行视图里，团进入“视野 × 这个倍数”就画出来并提醒
sight_mult = 2
# 世界海图上只画离船这么多格以内的团
chart_range = 15

# H03：海盗按分钟追击（§4.2）。正在追玩家的海盗用自己的船型与当时的风逐分钟走，0.3 格内算追上；
# 连续一整天看不见你就放弃——纵帆船往上风跑、横帆船往下风跑都甩得掉。缺省关闭。
[pursuit]
enabled = true
# 追上的距离（1/256 格；77 ≈ 0.3 格）
contact = 77
# 连续看不见多少分钟就放弃
give_up_minutes = 1440
# 你在雾里时海盗只看得见几格
fog_sight = 3
# 日初离你多远（格）以内的海盗才参与按分钟的追击（性能用）
search = 24

# H06：喊话、结伴与甩掉追击（docs/VOYAGE-PLAN.md §7）。1.5 格以内的船可以喊话：商船换消息、买补给、结伴；海盗买路、
# 虚张声势、开战。按分钟追击的海盗一整天看不见你而放弃时给少量名声。缺省关闭。数值的来历见 docs/drafts/h06-handoff.md。
[hail]
enabled = true
# 能喊话的距离（1/256 格，切比雪夫；384 = 1.5 格）
range = 384
# 向商船买补给：粮、水价的 300%，一次最多 5 天份
supply_price_pct = 300
supply_days_max = 5
# 结伴 5 天；结伴时海盗看你的视野只剩 50%
convoy_days = 5
convoy_sight_pct = 50
# 买路钱：船上货值的 10%，至少 50 金币；之后 10 天它不追你
bribe_pct = 10
bribe_min = 50
truce_days = 10
# 虚张声势：基础 35%，谈判每点 +1%，火力每比对方多一成 +3%（夹在 5%–90%）；输了士气 −10 并当场开战
bluff_bp = 3500
bluff_negotiate_bp = 100
bluff_power_bp = 300
bluff_morale = 10
# 甩掉追击的海盗：名声 +2
escape_fame = 2

# H08：航海日志与到港的航程总结（docs/VOYAGE-PLAN.md §9）。日志条目就是这一程期间的世界日志，界面按种类归集；
# 到港时算一张总结（天数、里程、平均航速、损耗、盈亏）。缺省关闭。
[voyage_log]
enabled = true

# H08：甲板闲话（§9）。航海士对当下的反应，每天至多一句，第二天在航行视图角上冒出来；句子在 voyage/banter.toml。
# 缺省关闭。数值的来历见 docs/drafts/h08-handoff.md。
[banter]
enabled = true
# 命中触发以后真的说一句的概率（万分比）
chance_bp = 6000
# 同一个触发键几天内不再触发；同一句几天内不重复
trigger_cooldown = 3
line_cooldown = 60
# 出海 30 天起算“出海很久”，之后每 15 天再说一回
long_voyage_days = 30
long_voyage_every = 15
# “快到港了”：离看见过的港口 4 格以内、已出海至少 3 天
near_port_cells = 4
near_port_days = 3

# H04：海上所见（§5）。航行视图里远远看得见的小目标：漂流货、残骸、落难的人、鸟群、鱼群、渔船，以及要绕开的海藻带、浮冰、暗礁。
# 每种的样子与结果在 voyage/sightings.toml。缺省关闭。
[sightings]
enabled = true
# 每支在海上的玩家舰队每天生成一个的概率（万分比）；瞭望（IntelDetection）每点再加 intel_bp，封顶 max_bp
daily_bp = 2200
intel_bp = 100
max_bp = 3500
# 放在航向前方多远（格）、偏离航向最多多少度
distance = [2, 5]
cone = 60
# 寿命（天）与同一支舰队同时最多几个
lifetime = 3
max_active = 3
# 离港口几格以内不放
port_clear = 3
# 多近算碰上（1/256 格；128 = 半格）
touch = 128
# 离岸几格以内算“近岸”、几格以外算“远海”（出场条件用）
near_shore = 4
far_shore = 8


# H07：航线规划。舰队的“领航员”岗位有人时，自动领航按“预计用时”寻路（出发当月各海区的风与洋流、
# 本舰队的航速与帆型风角），可选三种偏好：最快、稳妥（避开当月风暴多、海盗多的海区）、沿岸（离岸不超过 N 格）。
# 没有领航员时只有按距离的老办法。每对港口记最短航时；首航与破纪录给少量名声。
# 缺省（不写这一段的世界，如经典世界）开关是关的。数值的来历见 docs/BALANCE.md（H07）。
[routing]
enabled = true
# “沿岸”的离岸格数：离最近的陆地不超过这么多格（一格约 20 角分）算沿岸。
coast_cells = 3
# “沿岸”时，离岸超过上面格数的一步，代价按这个百分比算（2000 = 二十倍，有沿岸的路就走沿岸）。
offshore_pct = 2000
# “稳妥”时，海区当月风暴与海盗的万分点之和每 100 点，步的代价加这么多百分点。
risk_pct_per_100bp = 40
# 航线预览里的提示门槛：海区当月风暴万分点、海盗万分点不低于它就提示。
storm_warn_bp = 1000
pirate_warn_bp = 300
# 首航一对港口、打破航时纪录各给多少名声；航时短于 record_min_days 天的航程只记纪录、不给名声。
first_fame = 1
record_fame = 2
record_min_days = 3

# U02：检定像掷骰。选项 requires 里的 attr / growth / skill 门槛没达到时不再锁死，改成掷一次骰：
# 达到门槛必定成功；差得越多成功率越低，最低 5%；与选项自己的 check 相乘后夹在 5–95%。
# 旗标、物品、关系、年龄、日期、金钱、主角限定、恋爱开放等条件照旧锁住；数值门槛标了 hard = true 的也照旧锁住。
# 缺省（不写这一段的世界，如经典世界）开关是关的。
[story]
soft_requires = true
# 成功率曲线：[差距占门槛的百分比, 成功率%]，按差距递增、成功率不增，中间按直线插值、向下取整。
# 差距 0 一端是“刚差一点”；属性（含评价、品行、成长）一条，技能经验一条。
attr_curve = [[0, 80], [25, 45], [50, 10], [100, 5]]
skill_curve = [[0, 75], [25, 40], [50, 8], [100, 5]]
# 掷骰失败而选项没有 fail 分支时：回到同一节点，这个选项本次不能再选，养成期加这么多疲劳、减这么多心情。
fail_fatigue = 3
fail_mood = -2
# 通用失败的回应文字由 Claude 另写（见仓库根目录 copy-needed-u02.json），空串表示待写。
# 池子里没写时用这一条通用语；这一条也没写时回应为空。
fail_line = "劲儿使足了，还是差那么一截。这一回，只能另想办法。"

# 通用失败语句池：按差得最多的那一项门槛分池——属性按属性组（attr_），评价按评价（rating_），技能按技能种类（skill_）。
# 每个空串是一条待写的语句；补写不改变存档与重放。
