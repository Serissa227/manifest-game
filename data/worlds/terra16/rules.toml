# 葡萄（鲜果）、辣椒（维生素 C 极高）、橄榄（腌渍）、茶（远洋船上常带的叶子）。按顺序先吃排在前面的。
antiscorbutic = ["grapes", "chili", "olives", "tea"]
# ── 常设命令：口粮与节奏 ──
ration_pct = [75, 50]        # 减额 / 半额口粮吃掉的比例
ration_morale = [1, 3]       # 减额 / 半额口粮士气每天 −1 / −3
pace_speed = [-10, 8]        # 从容 −10% / 赶路 +8%
pace_rigging = [50, 200]     # 从容帆缆磨损减半 / 赶路加倍
# ── 船坞刮船底：花费为船价的 0.5%，附着清零 ──
scrape_bp = 50
# ── 改装的联动（改装 key，百分比；舰队按各船平均）──
refit_fouling = [["lead_sheathing", 50], ["white_stuff", 70]]   # 包铅船底附着减半、刷白底漆 ×0.7
refit_leak = [["chain_pump", 50]]                               # 链斗水车进水损失减半
refit_rigging = [["rigging", 70]]                               # 换新帆索帆缆磨损 ×0.7
# ── 船员情绪：怨言（士气 < 30，每次出海一次）→ 怠工（< 15，−20% 航速，回到 20 以上复工）→ 哗变（< 8 连续 3 天）──
grumble_below = 30
slowdown_below = 15
slowdown_until = 20
slowdown_slow = 20
mutiny_below = 8
mutiny_days = 3
promise_days = 12            # 答应“改去最近的港”后 12 天内要靠港，否则士气 −10
promise_morale = 10
# 三个阶段的事件（stories/voyage_crew.toml；这里列出的奇遇不参与每天的随机）
grumble_events = ["crew_grumble_galley", "crew_grumble_watch", "crew_grumble_rumor"]
slowdown_events = ["crew_slowdown_ropes", "crew_slowdown_pumps", "crew_slowdown_silence"]
mutiny_events = ["crew_mutiny_arms", "crew_mutiny_boats", "crew_mutiny_helm"]

# ── H05 岸与锚地（VOYAGE-PLAN §6）──
# 海上手动航行、离陆地 1 格以内时收帆锚泊，派人上岸做差事；产出看锚地周围 1 格的陆格地貌（maps/earth/biomes.txt）
# 与两格内有没有河（maps/earth/fine/rivers.bin、rivers.toml）。粮、水按“天份”算（舰队一天吃喝的量），一律取整。
# 地貌代码：I 冰原 T 苔原 B 针叶林 F 阔叶林 G 草原 M 地中海灌丛 K 干草原 D 荒漠 S 稀树草原 J 雨林 W 湿地 A 高山 V 火山 X 奇异之地
[shore_tasks]
enabled = true
# 汲水：几格内有河算“有河”；要几天 [有河, 没河但地貌有水源（不是荒漠、冰原）]；把水补到够几天（不超过空舱）
river_reach = 2
water_days = [1, 2]
water_fill_days = 60
# 采集狩猎：要几天；每个工作日给几“十分之一天份”的粮（30 = 3 天份），没列的地貌给 0；做完断鲜天数清零
forage_days = 2
forage = { J = 30, F = 25, S = 25, G = 20, M = 20, W = 20, B = 20, X = 15, K = 10, T = 10, A = 10, V = 10 }
# 伐木：要几天；每艘船每个工作日给几份船材（船况规则开着时才有船材）
timber_days = 3
timber = { B = 3, F = 3, J = 3, M = 2, X = 2, W = 1, S = 1 }
# 倾船刮底：要几天（期间不能起航）；陆格高程不超过几才算有滩（冰原不算）
careen_days = 5
careen_relief_max = 3
# 各差事占能干活的人的百分比 [汲水, 采集狩猎, 伐木, 倾船刮底]，每件至少几人；几件可以同时派，人手相加不超过能干活的人
hands_pct = [10, 20, 25, 60]
hands_min = 2
# 采集、伐木每个工作日出事的概率（万分比）：出事走登陆的伤病（受伤 1–2 人、染病士气 −5）
risk_bp = 300
# 避风：收帆锚泊、陆地在上风一侧（风从陆上吹来）时，暴风雨损伤保留的百分比
shelter_keep = 30
# 下网（半帆或收帆时）每天给几“十分之一天份”的粮，按海区气候 [温和, 寒冷, 干燥, 热带]；当天算吃到鲜食
fish = [4, 6, 2, 3]
# 雨天（含暴风雨）每天接几“十分之一天份”的水
rain_tenths = 5

# E02（2026-11-12）：新尺度与月结；旧键保留以支持关闭开关与旧档换算。
[development]
enabled = true
max = 9999
depth_ref = 50
speed_bands = [[1, 8000], [30, 10000], [90, 13000]]
busy_cap_bp = 30000
busy_floor_bp = 2500
specialty_sources = 3
specialty_weight_pct = 300
specialty_max_base = 90
decay_bp = 25
invest_coef = 300
works_cap_pct = 25
event_point_pct = 5
stages = [30, 100, 300, 1000, 3000, 9999]
# Q01 任务引擎。真引导链由 Q03 交付后再打开 guide。
[quests]
enabled = true
guide = true
reveal_days = 180   # 主线种类的轨道最早在“开始日前多少天”进任务日志；0 = 开过才列；范围 0–720

# R10-T04：委托按航程与紧急程度付。
[contracts.v2]
enabled = true
premium_pct = 30            # 相对目的港均衡价的溢价
urgent_pct = 50             # 最急时额外加价的百分比
slack_pct = [150, 300]      # 期限相对参考天数的百分比
ref_speed = 4               # 参考航速（格 / 天）
handling_days = 4           # 买卖与装卸余量（天）
min_cells = 6               # 起运地的最低距离（格）
small_per_month = 1         # 每势力每月前几张为小单
small_value = [1500, 3500]  # 小单目标货值
small_qty = [5, 40]         # 小单件数范围
small_reputation = 3        # 完成小单的声望
pass_days = 90              # 完成后免货档的天数，0 为不给
reward_turnover = true      # 报酬计入贸易成交额
reserve_market = true      # 托运期间目的港不卖这种货
small_min_cells = 1         # 小单起运地的最低距离（格）

# R10-T04：代办与航线的估算账目，不参与结算。
[trade_books]
enabled = true
route_lines = 60            # 满时丢最久没有跑过的一条

# ── H10b 自动驾驶拉直 ──
# 自动驾驶寻到粗格路径后，在细海岸上做视线拉直：从一个拐点出发，沿路径往前找直线看得见的最远一格当下一个拐点，
# 航线变成几段长直线。舵手每分钟瞄准直线上前方 lookahead 远的一点（不再逐格对准格心）。
# 没有细海岸的世界、或 straighten = false 时照旧逐格走；旧存档里在走的折线路径照样走完。
[autopilot]
# 2026-11-12 H10g 后打开：99 条验收航线全部到港，航时最多为旧法的 1.047 倍，每日换向峰值最多 42 次（旧法几百次），开阔水面换舷最多 6.3 次 / 天。
# 博多—府内三行“换向峰值 ≤ 旧法五分之一”不达标是门槛算不通（旧法就只有 1 次，五分之一不足 1 次），规划方裁定按通过算。
# 稳舵（下面的 hold_* 等键）同时用于逐格与拉直两条路，不受这个开关影响。
straighten = true
# 一段直线最多跨多少个路径格（限住视线检查的代价，也让超长的洋面航段中途有拐点可以修正）
max_leg = 48
# 直线离细格的陆至少隔几个细格（一个细格约 1.5 km；0 = 只要求直线压过的细格是水）
clearance = 1
# 舵手瞄准直线上前方多远（1/256 格；256 = 一格）
lookahead = 256
# 一次拉直最多查多少个细格；用完就把剩下的路径照旧逐格走（只防极端情况，正常航线远用不到）
budget = 4000000
# H10b2：逐日冻结出发日及后两日的实际天气估时，任一天比原折线慢超过此百分比就缩短候选弦。
# 0 = 关闭实际天气护栏；范围 0–100。它只筛选拉直候选，不改变寻路或航速公式。
weather_slack_pct = 10
# H10j 起换了意思（原先是 H10b2 的“近岸前视下限”）：转弯的前视半径上限——折点附近的前视收到这个长度以内
# （实取不超过一个细格），离计划线有横偏时再按比例收短，最短 7/256 格；开阔直段仍用 lookahead。
# 单位 1/256 格；0 = 一律用固定前视。
shore_lookahead_min = 64
# H10g：普通改舵至少保持半小时，跨风向换舷至少两小时；安全与到达瞄准点优先。
hold_minutes = 30
tack_hold_minutes = 120
# 有效推进分数至少提高 20% 才作主动改舵；计划线两侧各留一格走廊。
switch_gain_pct = 20
corridor = 256
# 换日风向变化超过 30 度，可立即重选一次。
wind_shift_deg = 30
# H10h：保底 1.2 格/天 = 24 海里/天，约 1 节；只用于自动领航。
creep_speed = 12000
# 自动航行的粮水停船：大于 0 时生效——粮水够用的天数少于 max(本值, 这支舰队航行指令里的警戒线，缺省 7) 就暂停一次，
# 同一程只停这一次；玩家把警戒线设成“不提醒”就不停。0 = 整条规矩不生效。
supplies_stop_days = 2
# H10i：最佳帆舵偏离瞄准方位超过 18 度时，朝瞄准点按净推进抢风；经典世界缺省 0。
beat_angle_deg = 18
# 对水推进按 90% 折算，海流仍照常叠加；以 99 行旧航时与每日大转向次数共同标定。
beat_efficiency_pct = 90

# R10-E03：阶段内容只做加法；资格不生成尚无机制的设施。
[stage_unlocks]
enabled = true
shop_stage = 2
shelf_step = 1
book_stage = 3
book_slots = 4
agency_bonus = [0, 0, 0, 2, 4, 4, 4]
industry_bonus = [0, 0, 0, 0, 1, 2, 3]
eligible = { academy = 4, auction = 5, exchange = 5 }
rumor_after_days = 360

# 隐秘货的限量与远销；具体货物由 G03 内容包入库。
[rare]
enabled = true
month_limit = 30
peak_cells = 300
peak_bp = 35000
buyer_bonus_bp = 2000
saturate = 20
floor_bp = 6000

# R10-U06K3a：见闻张数、识货次数与人物好处。
[upbringing.act.rumor]
per_listen = 1
known_after = 3

[upbringing.act.perk]
