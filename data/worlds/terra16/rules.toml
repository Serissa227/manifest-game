[upbringing.act.review]
opening_provision_days = 10

[pacing]
enabled = true
# 一天里最多新出场几件独立打断（要紧的照出，也占名额；续章不计）。
daily = 2
# 滚动窗口的天数（含今天）。
window_days = 7
# 窗口内“可以等的事”最多出场几件。
window_soft = 3
# 可以等的事最久等几天（一旬）；等满之后不再受窗口上限限制（仍受单日上限）。
