[[societies]]
key = "hermetic"
name = "赫尔墨斯圈子"
secrecy = 60
seat = "venice"
knowledge = "c11_society_hermetic_known"
basis = "extended"
sources = ["史料里没有一个统一的组织：是一群真实人物之间的书信、师承与小团体。核心是**阿格里帕的\"同盟\"**——1507—1508 年他与巴黎的友人立过誓、通密信（\"因信件危险，余事不写\"），事败后写信要\"召集同伴，解除我们同盟的誓言\"（《书信集》卷一第 1—7 封）；成员有波维勒斯、尚皮耶、热尔曼·德·布里、热尔曼·德·加奈、宫廷画家佩雷亚尔与兰杜尔夫。周围是特里特米乌斯（1462—1516，《隐写术》）、帕拉塞尔苏斯（1493—1541）、卡尔达诺父子、波斯特尔（1510—1581）；还有没有章程的菲奇诺\"柏拉图学园\"的余脉与阿尔丁印刷所的\"新学园\"（一张希腊文会规：成员间只说古希腊语，违者罚款）", "docs/TERRA16.md §7；全部往来等级、费用与奖励均为游戏补全。"]
active = [1507, 1700]
allies = ["rosicrucian", "stonemasons"]
enemies = ["dragon", "inquisition"]

