# 寰宇的自由对话离线回话：模型不可用或回话没通过裁决时，人物按玩家这句话的意图回一句（200 字上限）。
# 只表态、不透露情报、不答应任何事；要适合任何人物。可用变量：{person} 人物、{loc} 当下所在地。

rapport = [
  "{person}把茶碗往回推了半寸，笑得不深：“在{loc}也算认得几回，交情可以慢慢攒。今天的话，先说清楚该说的。”",
]

praise = [
  "{person}摆了摆手，像要把这句话挡回去：“话说得好听，手底下的活儿还得看。你要真懂，再来夸我。”",
]

request = [
  "{person}沉吟片刻，指节在桌沿上敲了两下：“你的请求我记下了。容我想想，眼下不敢替你应下什么。”",
]

inquiry = [
  "{person}朝门外扫了一眼：“想打听消息？{loc}这边，眼下没听到什么值得说的。你再等等，有了再来问。”",
]

