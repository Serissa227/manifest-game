# 寰宇的离线议价回话：没有模型时，按玩家的意图随机取一条，由商人对船长说。
# 可用变量：{discount} 折扣（如 3%）、{loc} 港口。

discount = [
  "船长既然开口，看在你常在{loc}跑船的份上，给你让{discount}。别到处声张，行里的人个个眼红。",
  "嘴皮子都磨薄了，我也只能让你{discount}。再压一个子儿，这笔买卖就算了，船长自己掂量。",
]

threat = [
  "拿这套吓唬我？见多了。罢了，让你{discount}，买完赶紧走，别在我铺子门口站着。",
  "在{loc}闹事，官府的人可不瞎。我怕了你，让你{discount}，快把货搬走吧。",
]

bribe = [
  "钱我收下了，懂规矩的船长我喜欢。给你让{discount}，后面的账别跟人提。",
  "嘿，这份心意不轻。让你{discount}，下回有好货先给我留一份，这人情我记下了。",
]

rapport = [
  "你我是老相识了，少说客套。让你{discount}，回头进港别忘了来找我喝茶。",
  "两家铺子隔着半条街，抬头不见低头见。给你让{discount}，传出去别说我小气。",
]

irrelevant = [
  "这话跟买卖不沾边。铺子里一屋子货等着点数，要买要卖，先说来意。",
  "扯远了，船长。想做生意，先把货名和数目报上来；别的话，我一概不接。",
]
