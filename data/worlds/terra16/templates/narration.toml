# 寰宇的历史大事旁白：opening 风声初起、progress 胜负未分、ending 尘埃落定（1600 字上限）。
# 可用变量：{event} 大事名、{outcome} 结局的编年史句子（只在 ending 有内容）；{balance} 是内部数字，正文不用。
# 接了模型时，这几条也作为口吻参照发给模型。

opening = [
  "话说{event}刚起头那阵子，消息还是零零碎碎的。先是一条船上回来的人带了句闲话，接着驿站里传出半截文书，没有谁说得清它会往哪边去。",
  "{event}的风声最初只在几个港口的酒馆里打转。账房把它记进册子，却都只写了一行，留着余地。谁也不肯先下断语，连最爱多嘴的船主都闭了嘴。",
  "海上的事，总是先听见，后看见。{event}的消息顺着船帮一路传开，起初只是一句听说，没人当真，可那句话在码头上已经转过了三道弯。",
]

progress = [
  "{event}还没有个说法。这边攻上一阵，那边守住一阵，两边的消息各说各的，连报信的人都分不清哪句是真的。账房的算盘天天拨，结果还悬着。",
  "{event}正拖在半路上。前头有人咬住不放，后头有人催着收尾，两边都说自己占了上风。码头上的人数着船回来的日子，等着看谁先撑不住。",
  "{event}还在进行，谁输谁赢，眼下谁也说不准。今天的消息和明天的消息常常打架，老于此道的人不急着下注，只一天天盯着水面上的动静。",
]

ending = [
  "{event}的账到这里算是清了。{outcome}消息传到各个港口，喝酒的人举杯，算账的人叹了口气，都说这结果说起来也不算出人意料。",
  "后世的史家翻到{event}这一页，多半要停一停。{outcome}这句话写得平平淡淡，底下压着的船和钱，却不是一行字能写完的。",
  "{event}落了幕，戏台下的人一个一个散去。{outcome}余下的，是各家各户回去自己算的账，还有那些后来没人再提起的名字。",
]
