  "{year}年{month}月，连着几天没人来买金子，屋里只剩黄铜砝码的响声。\n{facts}\n我把小箱子擦了一遍又一遍，擦到发亮，心里还是闷。想讲个笑话给自己听，讲到一半，嗓子就哑了。这个月，先不讲了。\n——{protagonist}",
  "{year}年{month}月，夜里翻开一册旧编年史，对着两行字出了半天的神。\n{facts}\n我想把我们城里的历史自己写下来，不让外乡人替我们写错。写稳了，就让金市和海港彼此照应。这事急不来，可我一直记着。\n——{protagonist}",
]

