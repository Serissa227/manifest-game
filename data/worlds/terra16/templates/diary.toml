# 寰宇的养成期月记：主角第一人称写已结束的某个月（1600 字上限）。按主角身份取 voice_<身份> 一段，没有时用 voice_generic。
# 可用变量：{protagonist} 主角名、{year} 纯数字年份、{month} 纯数字月份（正文自己加“年”“月”）、{facts} 这个月的活动，每行“某月某日：活动”。
# 三条依次是心情好的月份、累了或闷闷的月份、想着将来的月份。接了模型时，这几条也作为该主角的口吻参照。
# 每条末尾一行“——{protagonist}”是月记的署名，正文里不必再写主角名。

# 不知道主角身份时的通用口吻
voice_generic = [
  "{year}年{month}月，天亮得早，港口的风软软的。码头上晒着的鱼干味道很冲，我倒觉得还不坏。\n{facts}\n这个月心里松快，走路都想蹦两下。明天的事留给明天。\n——{protagonist}",
  "{year}年{month}月，连着下了七八天雨，墙角发了霉，晾出去的衣裳收回来还是潮的。\n{facts}\n每天一睁眼就想躺回去。字写得歪歪扭扭，回头看都认不出来。夜里不想再写了，就到这里。\n——{protagonist}",
  "{year}年{month}月，夜里站在码头尽头，看船一条条进港。桅杆一根根从雾里冒出来，数到一半就数乱了。\n{facts}\n总有一天，我也要坐上一条出远海的船，去看图上画过的那些岸。在那之前，该学的先学完。\n——{protagonist}",
]

# 一条澪
voice_mio = [
  "{year}年{month}月。这个月跟人比了五回，有比背歌的，有比闻香的，赢四回，输一回。输的那回不算——对方抢了先，我还没坐稳。说好了下个月再来一局，记在这里，免得谁赖账。\n{facts}\n夜里心里痛快，作了一首歌，只得了上句。下句留着，赢了下一局再续。\n——{protagonist}",
  "{year}年{month}月。这个月不顺。天阴了大半个月，写好的字半天干不透。又挨了一回骂：看见有人拿底下人出气，我先动了手，歌是后来才作的。\n{facts}\n那首歌作得不坏，没人要听，只罚我跪了半个时辰。我认罚，不认错。下回还是先动手，只记得先把袖子挽起来。\n——{protagonist}",
  "{year}年{month}月。夜里风大，窗纸一鼓一鼓的，我躺着听了半夜，越听越像帆。\n{facts}\n历书上说，下个月南边犯忌，不宜动身。我嘴上骂了一句麻烦，还是把那一行抄进了怀纸。往后有了自己的船，船尾挂一条家的旗，旗钱先付，一文不让。方位嘛，出海前还是要看的。\n——{protagonist}",
]

# 莉芙·德克莱尔克
voice_lieve = [
  "{year}年{month}月，天晴，风顺着河面吹进城里，带着一股咸味。今天我赌赢了一块蜂蜜蛋糕，那人输得直跺脚。\n{facts}\n这个月账记得清清楚楚，心情也好，懒得跟谁计较。新衣裳的料子我早看过了，不说。\n——{protagonist}",
  "{year}年{month}月，一整天都在算数，算盘珠子拨得手指发酸。晚上回屋，三只猫在桌底下打架，吵得人脑仁疼。\n{facts}\n这个月真累。累也不跟别人说，说了也只换来一句“多算算就好了”。我把饼掰成三块，它们才肯消停。\n——{protagonist}",
  "{year}年{month}月，我站在窗边看船出港，数它们的吃水，在心里悄悄估价。\n{facts}\n哪天我也要坐进出海人的账房，替他们担风险，替他们算得丝毫不差。父亲账簿最后几页那串港口名，我早就背下来了。\n——{protagonist}",
]

# 纳吉玛
voice_najma = [
  "{year}年{month}月，夜里星星亮得清楚，老人星一出来，我就知道方位不会错。\n{facts}\n这个月报了几次方位，一次都没错。咖啡煮得刚好，海鸟也安静了。差一指，就差一百里。今天没差。\n——{protagonist}",
  "{year}年{month}月，连阴了好几夜，星一颗也见不着。\n{facts}\n星盘拿在手里，就成了一块冷铜。屋顶上的海鸟叫了一夜，吵得我睡不踏实。有人问我怎么不笑，我说，没星可看，笑什么。\n——{protagonist}",
  "{year}年{month}月，我把外曾祖父留下的铜星盘搁在窗口，对着新月比了又比。\n{facts}\n等哪天能独自带船出港，就靠这把星盘定位，船走到哪里，我从星高里算出来。错一指，我认。可在那之前，要背的星名还多着。\n——{protagonist}",
]

# 林晚灯
voice_lin_wandeng = [
  "{year}年{month}月。天好风也好，腰上那盏小红灯笼被日头晒得发亮，我走一路亮一路。\n{facts}\n这个月没挨骂，也没丢东西，我自己都觉得稀奇。阿母若问起，我就说：好，挺好，灯没灭。\n——{protagonist}",
  "{year}年{month}月。连着下了几天雨，灯笼的纸潮得发软，我也一样，骨头缝里都是潮气。\n{facts}\n夜里梁上有响动，我蒙着头，只当是老鼠。我怕鬼，偏又爱听鬼故事，这会儿倒盼着有人讲一桩，讲到一半我再喊停。\n——{protagonist}",
  "{year}年{month}月。今晚月亮大，我往东边站了好一阵。海在那头，看不见，我偏觉得看得见。\n{facts}\n阿爹常说船认路，人认规矩，可路总得有人先认。这话只写在这儿，当面我一个字也不提，他听了眉头准要拧成一股缆。\n——{protagonist}",
]

# 伊希·妮克特
voice_ix_nikte = [
  "{year}年{month}月，南风起了，湾里的独木舟排成一串，回港时船舷都闪着水光。\n{facts}\n妈妈说我这个月的手劲又长了。我没接话，心里却很痛快。今夜有人敲鼓，我得早点去跳。\n——{protagonist}",
  "{year}年{month}月，连着几天有生人来岛上打听事，我一个个都打量了三遍。\n{facts}\n看得多了，眼睛发涩，连话也懒得回。今晚没人敲鼓，远处只有海螺响了两声。心里闷，又说不出口，就记在这里。\n——{protagonist}",
  "{year}年{month}月，我站在礁石上，看远处的船帆一点点大起来。\n{facts}\n总有一天，我的船队会去那些没人去过的港口。不挂别人的旗，桨手都是自己人。认下的人，一个也不丢下。\n——{protagonist}",
]

# 诺埃尔·德·卡德纳
voice_noel = [
  "{year}年{month}月，海峡的风今天难得温和，晒在绳子上的白外套总算干透了。红缎带被风吹得乱飘。\n{facts}\n老人在厨房里骂了我一早上，说我又把练剑的木桩劈歪了。我顶了两句，老人气得半天不吭声。这个月过得还行，我承认。\n——{protagonist}",
  "{year}年{month}月，连着阴雨，屋子静得吓人。一个人吃饭，连勺子碰碗的声音都听得清。\n{facts}\n被人盯着看的时候我会火大，可人一走，屋里又空得发慌。这个月写不出什么好话，字就写短一点。夜里门没关严，我也懒得起身去关。\n——{protagonist}",
  "{year}年{month}月，我在旧图上画了一条线，从海峡这头一直拉到大西洋那头。\n{facts}\n名册上有七十七个名字，我找到一个，就能问出点什么。到那时，我要当面问一句：这颗星徽，当初是谁戴过的。\n——{protagonist}",
]

# 塔里克·加尔纳蒂
voice_tariq = [
  "{year}年{month}月，今天弹琴时崩断了一根弦，祖母却说这是好兆头。我编了首新诗，专门夸码头上那只瘸腿的猫，猫不领情，我也不在乎。\n{facts}\n这个月的笑话讲了七八个，没一个讲完整，全是我自己先笑场。\n——{protagonist}",
  "{year}年{month}月，连着几夜睡不踏实。白天说笑的时候，连我自己都听出了假。\n{facts}\n祖母的钥匙压在枕头底下，我半夜摸了好几回，铁都摸暖了。这个月的诗，没一首顺口。\n——{protagonist}",
  "{year}年{month}月，夜里靠着船舷数星星，嘴里还哼着那首改了两个字的诗。\n{facts}\n我想要一条自己的船，挂一面自己的旗。船上的人，我只劫货，不劫人。以后再有人问我船上的人呢，我要能答得出口。\n——{protagonist}",
]

# 凯奇利·劳特
voice_kaicili = [
  "{year}年{month}月，丁香园的风一过，满山都是甜辣的味道。这个月的棋下得顺，对手让了我三步，我没领情，也没说破。\n{facts}\n夜里念了几首班顿，念到最后一句，窗外天堂鸟叫了两声。心里很静，我喜欢这样的月份。\n——{protagonist}",
  "{year}年{month}月，连着几天有人来谈价，说的全是绕圈子的话。我笑着听，笑到脸都僵了。\n{facts}\n夜里念诗，一首四行，念到第二行就念不下去。这个月很少说“不”，可是累，是真累。写下来，心里松一点。\n——{protagonist}",
  "{year}年{month}月，灯下把一年的价钱排成一列，想着哪一天，能替自家的丁香定个价。\n{facts}\n到那时候，我不必再笑着压别人，只需一句话，把价钱留在岛上人自己手里。这件事我会慢慢做，不急。\n——{protagonist}",
]

# 巴拉卡·宾·萨利姆
voice_baraka = [
