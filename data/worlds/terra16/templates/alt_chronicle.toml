# 寰宇的“另一部编年史”：玩家这条世界线上已结束的某一年的年度总结（1600 字上限）。
# 可用变量：{year} 纯数字年份（正文自己加“年”）、{facts} 当年大事，每行“某事（某月）：实际结局”，与史书不同时附史书原本的结局。

year = [
  "{year}年的卷宗，是后世史家从一箱旧账里翻出来的，这一年的大事有些与史书所记对得上，有些却对不上：\n{facts}\n史书与旧账对不上的地方，多半是这一年的人自己拿了主意。",
  "后世史家翻到{year}年，先皱起眉头，以为是抄录的人把年份写乱了，核对许久，才肯信这些账是对的。\n{facts}\n事情是一件件按着各人的脾气走下来的，没有谁替这一年排好次序。",
  "{year}年的册子不厚，后世的人却常停在这一页上，一看就是半天。\n{facts}\n史书上的{year}年怎么写，这一年的人大多不去管，只照着自己的日子过。",
]
