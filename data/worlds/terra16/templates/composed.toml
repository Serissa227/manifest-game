# 寰宇的离线组合事件原型：未配置模型、超出预算或网络失败时，由生成器按权重挑一个原型，
# 确定性地挑选目标并在范围内取参数，组合出一个事件；同样要经过裁决与内核校验。
# 寰宇眼下只有一个原型：某港某货的本地产量因故减少一成以内，持续半月到一月。
# 可用变量：titles 只能用 {loc}（展开后不超过 20 字）；narratives 可用 {good} 商品、{loc} 地点。
# 叙事 = 出处（sources 中挑一句，不能用变量）+ 叙事句（narratives 中挑一句），合计不超过 200 字。
sources = ["据往来商船捎来的消息，"]

[[archetypes]]
key = "local_supply"
weight = 1
titles = ["{loc}暴雨误工"]
narratives = ["{loc}连下了半个月的暴雨，河堤告急，作坊里和田里的人手都被叫去扛沙包，{good}这阵子只出得了往常的九成。"]
# 倍率 0.90–0.95 不跨过 1，持续 15–30 日。
effects = [{ effect = "supply_shift", goods = [], mult = [0.9, 0.95], days = [15, 30] }]
