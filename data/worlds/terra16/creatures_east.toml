[[creatures]]
key = "coastal_spirits"
name = "牛鬼、濡女、矶女与独脚鬼（도깨비）"
text = "泊船的夜里，礁石上似乎坐着个抱孩子的女人，头发湿得滴水，朝船上招手。九州的水手说千万别应：孩子塞给你，越抱越重，海里的牛鬼就跟着上来了。远处岸上几点鬼火游来游去，朝鲜船工倒说那是馋荞麦糊的精怪。"
basis = "extended"
sources = ["提前：名字见《枕草子》《太平记》与《释谱详节》（1447），海边的故事都是近代采录的地方传说", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["avoid", "ruse"]
outcomes = { avoid = { text = "今晚不系缆，离岸下锚", reply = "照九州的老规矩，缆绳一根也没留在岸上，船退到一箭之外下锚。礁石上的人影后来不见了，可夜里退得太急，锚索缠上了暗礁，第二天费了一整天才解开。", delay_days = 1 }, ruse = { text = "戴上手套去接孩子", reply = "水手长套上两层厚布手套，跳上礁石接过那个襁褓，沉得像抱了一块压舱石。他照九州水手教的，连手套带襁褓一起扔进海里，转身就跑。身后一声闷吼，像牛，又像浪撞进石洞。礁上丢了半捆缆绳，襁褓里裹的是什么，谁也说不清。", cost = { cash = 20 } } }
chance_bp = 15
