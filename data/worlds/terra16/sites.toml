# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 海峡中的火山岛是航路地标，1883年的灾难不提前发生。
# 海峡两岸被古人称为柱子；坐标只是北侧观察点。
# 合恩之名来自1616年；此世界允许提前观察南端海角，图鉴注明后世名称。
# 1553年不能照搬后世全部石城形态；以关隘海岸作标记，晚建部分待事件启用。
# 欧洲命名晚于开局，提前看见水道属于本世界探索；不把原住民海路写成无人之境。
# 叙事区分潮汐与海怪；乞力马扎罗无须把后世欧洲报道写成第一次见到；维苏威不预演1631年的大喷发。
# 大堡礁、麦哲伦海峡、图卢姆、拉帕努伊、南马都尔：当地居民的海上知识与航路早于欧洲来访者，石像不是无主的宝藏。
# 莫西奥图尼亚不用十九世纪外来者后来起的名字；好望角海标不是两大洋严格地理边界的断言；北角不声称是大陆最北点。
