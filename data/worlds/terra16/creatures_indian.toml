# C11：印度洋、阿拉伯与红海；传闻只给见闻，遭遇损失有界，不自动伤害未回应的船。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[creatures]]
key = "turtle_island"
name = "龟岛 / 鲸鱼岛"
text = "《印度奇闻》里说，有船在海上见一座小岛，岛上生了火，岛却一动，原来是一只熟睡的海龟。辛巴达的船也遇见过这样的岛。"
basis = "historical"
sources = ["史/文：布祖格《印度奇闻》第 19 章（10 世纪：乘客为过诺鲁孜节在小岛上点火，岛是一只熟睡的海龟）；辛巴达第一次航行；卡兹维尼", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["avoid", "observe"]
outcomes = { avoid = { text = "不上岛，绕开走", reply = "船长不许在小岛上生火，绕着岛开了一大圈，耽误了一天，才找到一处真正的礁岸。船尾那座岛越退越小，水手们一路没人说话。", delay_days = 1 }, observe = { text = "站在桅下看", reply = "岛背上长着青苔与贝壳，一动不动。船长站在桅杆下看了很久，说那不是石头，是一只睡熟的大龟。", clue = "c11_creature_turtle_island_known" } }
chance_bp = 15
cooldown_days = 180
books = ["qazwini"]
regions = ["south_indian_ocean"]

[[creatures]]
key = "roc"
name = "大鹏"
text = "航海记说，马达加斯加以南的海上，有鸟能用爪子抓起巨石，从高处砸向船。有人说它的蛋能盛下一桶水。船工叫它浮空的山。"
