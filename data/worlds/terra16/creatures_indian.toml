sources = ["史/传：伊本·胡尔达兹比赫（9 世纪：金子多到打狗链）；杜佑《通典》卷一九三（801：海中方石上的树\"总生小儿\"）；比鲁尼（约 1030）；卡兹维尼——女王统治的 1700 座岛，会喊\"瓦克、瓦克\"的树", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe"]
