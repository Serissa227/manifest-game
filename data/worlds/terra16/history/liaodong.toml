# C10：结构、引用、史实与玩法参数；显示正文均为待Claude替换的短占位。
# 仅知年份／月份的条目在窗口末结算；不得把结算末日写成考证日期。

[[ports]]
port = "pidao"
state = "dormant"

[[campaigns]]
key = "liaodong"
name = "辽东战役链"
summary = "建州吞了乌拉，努尔哈赤在赫图阿拉称汗；明廷守着辽东，叶赫、朝鲜、察哈尔各自掂量该靠哪边。从嘉靖三十七年到万历十七年，三十一年里，登州的粮船、牛庄的铳炮、宁波的通事、京里的打点，都能在某一年改写一场仗。可赢了今年的仗，明年的饷银、朝议与天时又把局面拉回去。"
inertia = 25
vars = [{ key = "ming_treasury", name = "明·国库", start = 40, drift = [[1553, 40], [1557, 40], [1566, 25], [1572, 20], [1580, 45], [1584, 30], [1589, 5]] }, { key = "ming_pay", name = "明·边饷", start = 50, drift = [[1553, 50], [1557, 50], [1570, 35], [1576, 20], [1589, 10]] }, { key = "ming_court", name = "明·朝议", start = 40, drift = [[1553, 40], [1557, 40], [1562, 45], [1572, 60], [1582, 35], [1586, 25], [1589, 15]] }, { key = "ming_guns", name = "明·火器", start = 35, drift = [[1553, 35], [1557, 35], [1568, 45], [1578, 30], [1589, 35]] }, { key = "jin_unity", name = "金·统合", start = 70, drift = [[1553, 70], [1557, 70], [1564, 85], [1581, 95]] }, { key = "jin_guns", name = "金·火器", start = 5, drift = [[1553, 5], [1557, 5], [1571, 10], [1576, 20], [1578, 45], [1589, 70]] }, { key = "jin_grain", name = "金·粮", start = 50, drift = [[1553, 50], [1557, 50], [1572, 20], [1580, 60]] }, { key = "famine", name = "灾荒", start = 20, drift = [[1553, 20], [1557, 20], [1573, 40], [1582, 70], [1586, 85]] }, { key = "rebellion", name = "流民", start = 5, drift = [[1553, 5], [1557, 5], [1574, 20], [1585, 60], [1589, 90]] }, { key = "korea", name = "朝鲜", start = 70, drift = [[1553, 70], [1557, 70], [1572, 50], [1582, 10]] }, { key = "chahar", name = "察哈尔", start = 60, drift = [[1553, 60], [1557, 60], [1574, 30], [1579, 0]] }, { key = "ming_catholic", name = "明·天主教", start = 3, drift = [[1553, 3], [1557, 3], [1583, 8], [1589, 5]], court = "ming", idea = "catholic", gates = [{ event = "l20_haicheng_open_seas", outcome = "broad_open_seas", cap = 15 }, { event = "l26_ricci_zhaoqing", outcome = "mission_reaches_capital", cap = 25 }] }, { key = "ming_hui", name = "明·回回", start = 12, drift = [[1553, 12], [1557, 12], [1589, 12]], court = "ming", idea = "hui_learning", gates = [{ event = "l22_rum_tianfang_exchange", outcome = "hui_learning_recognized", cap = 30 }] }, { key = "ming_open", name = "明·开明", start = 35, drift = [[1553, 35], [1557, 35], [1567, 40], [1577, 30], [1579, 15], [1584, 20], [1589, 20]], court = "ming", idea = "open_learning", gates = [{ event = "l20_haicheng_open_seas", outcome = "broad_open_seas", cap = 45 }, { event = "l21_mourning_flogging", outcome = "remonstrance_protected", cap = 35, from = [1577, 11, 30] }, { event = "l24_academy_suppression", outcome = "academies_protected", cap = 25, from = [1579, 9, 22] }] }, { key = "jin_catholic", name = "金·天主教", start = 0, drift = [[1553, 0], [1557, 0], [1589, 0]], court = "jin", idea = "catholic", gates = [{ event = "l25_jin_translation_bureau", outcome = "religious_patronage_edict", cap = 0 }] }, { key = "jin_hui", name = "金·回回", start = 0, drift = [[1553, 0], [1557, 0], [1589, 0]], court = "jin", idea = "hui_learning", gates = [{ event = "l25_jin_translation_bureau", outcome = "religious_patronage_edict", cap = 0 }] }, { key = "jin_open", name = "金·开明", start = 20, drift = [[1553, 20], [1557, 20], [1571, 25], [1574, 30], [1576, 33], [1581, 35], [1589, 35]], court = "jin", idea = "open_learning", gates = [{ event = "l25_jin_translation_bureau", outcome = "religious_patronage_edict", cap = 40 }] }]
ending_event = "l19_beijing_shanhaiguan"
outlooks = [{ key = "ming", name = "明廷", historical = "historical", threshold = 60, priority = ["ming_open", "ming_hui", "ming_catholic"], survives = ["frontier_stalemate", "trade_peace", "jurchen_fragmented"] }, { key = "jin", name = "清廷", historical = "historical", threshold = 60, priority = ["jin_open", "jin_hui", "jin_catholic"], survives = ["early_qing", "qing_enters_pass", "frontier_stalemate", "trade_peace", "dashun_faces_qing"] }]
endings = [{ key = "frontier_stalemate_ming_historical", outcome = "frontier_stalemate", court = "ming", outlook = "historical", text = "宁远的城墙守住了，清军的旗号止步于辽河以东，山海关外的辽西走廊仍插着大明的旗。朝中依旧是深居的皇帝、收紧的言路，月港那道海禁的缝，开了，也只开了那么一道。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_ming_historical" }] }, { key = "frontier_stalemate_ming_catholic", outcome = "frontier_stalemate", court = "ming", outlook = "catholic", text = "关外两军隔河对峙，宁远与锦州的城头架着西洋大铳。京里的钦天监改用西法推历，城中起了天主堂，澳门和月港的洋船进出无碍；言官仍在奏，说夷人的钟声搅了皇城的清静。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_ming_catholic" }] }, { key = "frontier_stalemate_ming_hui_learning", outcome = "frontier_stalemate", court = "ming", outlook = "hui_learning", text = "清军困在辽河以东，辽西走廊的城池一座没丢。西北的贡道年年畅通，鲁迷与天方的使团住进会同馆不肯走，钦天监的回回科掌了历局；陕西的经堂里，学童一边诵经，一边打算盘。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_ming_hui_learning" }] }, { key = "frontier_stalemate_ming_open_learning", outcome = "frontier_stalemate", court = "ming", outlook = "open_learning", text = "清军退守辽河以东，山海关外的防线稳住了。长城以内倒松快了许多：月港之外，宁波、福州也挂起了市舶司的牌子，一条鞭法行到边远州县，书院的讲会重新热闹，言官上疏，不必再先备好棺材。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_ming_open_learning" }] }, { key = "trade_peace_ming_historical", outcome = "trade_peace", court = "ming", outlook = "historical", text = "辽河划成了界，开原、抚顺的马市重开：清国的使者驮来貂皮人参，大明的官员押去绢布铁锅，一如当年对俺答那样。边费省下十之七，只是朝上谁也不肯提那个款字。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_ming_historical" }] }, { key = "trade_peace_ming_catholic", outcome = "trade_peace", court = "ming", outlook = "catholic", text = "边市重开，两家使者往来如邻。京里的热闹在另一头：天主堂的钟声天天响，耶稣会与多明我会的教士为祭祖祀孔的规矩吵得面红耳赤，争执的信一封封漂洋过海，往罗马去。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_ming_catholic" }] }, { key = "trade_peace_ming_hui_learning", outcome = "trade_peace", court = "ming", outlook = "hui_learning", text = "清国的使者每隔几年便进一回京，边市年年开。西边的路也通了：肃州关外驼队不绝，大明与鲁迷国的国书一年一个来回，会同馆里为天方来的使者另辟了一间屋，窗下晾着刚抄好的星表。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_ming_hui_learning" }] }, { key = "trade_peace_ming_open_learning", outcome = "trade_peace", court = "ming", outlook = "open_learning", text = "辽河两岸按期开市，两边的使者互住对方的驿馆。内地的书坊忙起来了，王守仁的文集一版接一版地刻；言官在朝堂上直言，廷杖的架子被收进库房，落了灰。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_ming_open_learning" }] }, { key = "jurchen_fragmented_ming_historical", outcome = "jurchen_fragmented", court = "ming", outlook = "historical", text = "叶赫还在，建州没能把海西、东海诸部拢成一家；辽东的边将照旧扶一部、压一部，敕书照旧卖得出价。大明独存，朝廷里的老毛病也一样不少：天子深居，言路窄，书院在官府眼里总像个是非地。", effects = [{ kind = "flag", flag = "liaodong_ending_jurchen_fragmented_ming_historical" }] }, { key = "jurchen_fragmented_ming_catholic", outcome = "jurchen_fragmented", court = "ming", outlook = "catholic", text = "女真诸部守着自家的寨子，没有一面旗压得住另几面，叶赫的使者仍年年到开原领赏。边事少了，朝廷有闲心读新书：教士译的几何书与世界图，书坊里印了一版又一版，翰林院的老先生翻着，摇头又点头。", effects = [{ kind = "flag", flag = "liaodong_ending_jurchen_fragmented_ming_catholic" }] }, { key = "jurchen_fragmented_ming_hui_learning", outcome = "jurchen_fragmented", court = "ming", outlook = "hui_learning", text = "叶赫、哈达的旧部与建州互相提防，边墙外只有零星劫掠。京师里是另一番光景：回回的医官被请进太医院，西域来的乳香、没药在药铺里论斤卖，嘉峪关外，驼队的铃声日夜不断。", effects = [{ kind = "flag", flag = "liaodong_ending_jurchen_fragmented_ming_hui_learning" }] }, { key = "jurchen_fragmented_ming_open_learning", outcome = "jurchen_fragmented", court = "ming", outlook = "open_learning", text = "女真散在山林里各立寨子，边将不必年年上报军情。省下的边饷有了别的去处：沿海各港的商税入了太仓，书院的讲会开到了县里，言官骂首辅骂得再狠，换来的也只是一纸批答。", effects = [{ kind = "flag", flag = "liaodong_ending_jurchen_fragmented_ming_open_learning" }] }, { key = "early_qing_jin_historical", outcome = "early_qing", court = "jin", outlook = "historical", text = "万历十二年，清军的红衣炮轰开山海关，来得比谁预料的都早。辽东海口流出去的粮船与铳炮，全都进了沈阳的库房；北京城下，明军欠饷已三年，没有人肯替朝廷死守。", effects = [{ kind = "flag", flag = "liaodong_ending_early_qing_jin_historical" }] }, { key = "early_qing_jin_catholic", outcome = "early_qing", court = "jin", outlook = "catholic", text = "清军入关来得太快，随军的炮营里有西洋教士出身的铳师。沈阳的旗人管教士叫玛法，几位贝勒已受洗；进了北京，头一桩事便是划地建堂，钦天监的印也落到了教士手里。", effects = [{ kind = "flag", flag = "liaodong_ending_early_qing_jin_catholic" }] }, { key = "early_qing_jin_hui_learning", outcome = "early_qing", court = "jin", outlook = "hui_learning", text = "清军叩关那一年，明朝旧臣还在争守不守。嘉峪关外的驼队先到了京城：吐鲁番的使节递了贡册，哈密的阿訇受命在城南赁屋讲经，新朝的礼部照旧例拨了米与布。", effects = [{ kind = "flag", flag = "liaodong_ending_early_qing_jin_hui_learning" }] }, { key = "early_qing_jin_open_learning", outcome = "early_qing", court = "jin", outlook = "open_learning", text = "清军过关那年，辽饷还在加派，欠饷的明军开门迎降的不在少数。清廷顺势收了人心：降官留任，都察院、通政司当年便在北京开了衙，连皇帝的奢侈也有人敢当面谏。", effects = [{ kind = "flag", flag = "liaodong_ending_early_qing_jin_open_learning" }] }, { key = "qing_enters_pass_jin_historical", outcome = "qing_enters_pass", court = "jin", outlook = "historical", text = "李自成的人马攻破北京，吴三桂打开山海关，多尔衮的八旗涌进关内。新朝用满洲旧俗管自家，用汉制办六部；喇嘛与和尚的度牒，由皇帝批准，由贝勒登记。", effects = [{ kind = "flag", flag = "liaodong_ending_qing_enters_pass_jin_historical" }] }, { key = "qing_enters_pass_jin_catholic", outcome = "qing_enters_pass", court = "jin", outlook = "catholic", text = "北京城破，吴三桂开关，清军进京。教士跟着八旗的辎重入了城，在城东赁屋，门楣上钉起十字；新朝的国书用满汉两种文字写成，托商船寄往罗马，回信要等上好几年。", effects = [{ kind = "flag", flag = "liaodong_ending_qing_enters_pass_jin_catholic" }] }, { key = "qing_enters_pass_jin_hui_learning", outcome = "qing_enters_pass", court = "jin", outlook = "hui_learning", text = "大顺的人马占了北京，吴三桂放清军进了关。新朝的炮队里添了鲁迷的铳匠，回回商人带着西域的玉与药材进了京，礼部的朝贡册上，吐鲁番与哈密排在了朝鲜的前头。", effects = [{ kind = "flag", flag = "liaodong_ending_qing_enters_pass_jin_hui_learning" }] }, { key = "qing_enters_pass_jin_open_learning", outcome = "qing_enters_pass", court = "jin", outlook = "open_learning", text = "吴三桂开了山海关，清军进了北京。布告贴出来：三饷尽免，汉人衣冠不改，也没有剃发令；都察院的御史当朝参奏贝勒，被参的人竟不敢发作，吏部点名时，满汉的官员排在同一张榜上。", effects = [{ kind = "flag", flag = "liaodong_ending_qing_enters_pass_jin_open_learning" }] }, { key = "frontier_stalemate_jin_historical", outcome = "frontier_stalemate", court = "jin", outlook = "historical", text = "宁远与锦州始终没丢，清军的铁骑年年踏冰西来，年年退回辽东。沈阳的朝廷守着满洲旧俗，投降的汉官编入汉军旗，喇嘛的牒文照旧要先呈御前，再入贝勒的册。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_jin_historical" }] }, { key = "frontier_stalemate_jin_catholic", outcome = "frontier_stalemate", court = "jin", outlook = "catholic", text = "西进的路被堵死在锦州城下，沈阳却添了新鲜事：西洋教士在城南赁屋讲道，又替旗人子弟算天文、校铳尺，祭堂子的老人们路过，总要站住啐一口。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_jin_catholic" }] }, { key = "frontier_stalemate_jin_hui_learning", outcome = "frontier_stalemate", court = "jin", outlook = "hui_learning", text = "锦州的城墙挡着西进的路，沈阳城南的客店却日日住满：驼队卸下毡毯与葡萄干，阿訇在后院开了经堂，教回回的孩子认阿拉伯字。朝廷准他们只教自己人，满洲人里，一直没有人入教。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_jin_hui_learning" }] }, { key = "frontier_stalemate_jin_open_learning", outcome = "frontier_stalemate", court = "jin", outlook = "open_learning", text = "困在辽东，沈阳反倒认真学起了汉制：文馆里译起汉人的兵书与律令，六部开了衙，考场上满汉的子弟坐在同一排。锦州城头的明军望着这边，一时看不出对面算敌还是算邻。", effects = [{ kind = "flag", flag = "liaodong_ending_frontier_stalemate_jin_open_learning" }] }, { key = "trade_peace_jin_historical", outcome = "trade_peace", court = "jin", outlook = "historical", text = "沈阳与北京议定以辽河为界，马市重开，使者第一回住进会同馆，与蒙古人同一条胡同。换回来的缎布、铁锅和米粮，养活了八旗的人口；满洲的旧规矩，一条没改。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_jin_historical" }] }, { key = "trade_peace_jin_catholic", outcome = "trade_peace", court = "jin", outlook = "catholic", text = "边市一开，商队带回的货里多了成箱的西洋书。教士在沈阳的文馆教旗人子弟推算历法，教堂的钟与堂子的神杆在同一座城里并排立着。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_jin_catholic" }] }, { key = "trade_peace_jin_hui_learning", outcome = "trade_peace", court = "jin", outlook = "hui_learning", text = "互市的头一年，沈阳的驼队就比马队还多：吐鲁番、哈密的商人运来和田玉与乳香，鲁迷的铳匠受聘铸炮，文馆里添了一间专译回回历书的屋子。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_jin_hui_learning" }] }, { key = "trade_peace_jin_open_learning", outcome = "trade_peace", court = "jin", outlook = "open_learning", text = "界河两岸按期互市，两国使者往来不断。沈阳趁着太平把汉制办全了：六部、通政司一应俱备，贝勒的子弟入学读书，书坊里刻出了头一批满汉对照的书。", effects = [{ kind = "flag", flag = "liaodong_ending_trade_peace_jin_open_learning" }] }, { key = "dashun_faces_qing_jin_historical", outcome = "dashun_faces_qing", court = "jin", outlook = "historical", text = "北京落进了大顺手里，吴三桂守着山海关，既不降李自成，也不放清军进来。关内一座京城，关外一座沈阳，中间只隔着一道关墙，谁先动，谁就先挨炮。", effects = [{ kind = "flag", flag = "liaodong_ending_dashun_faces_qing_jin_historical" }] }, { key = "dashun_faces_qing_jin_catholic", outcome = "dashun_faces_qing", court = "jin", outlook = "catholic", text = "关内是大顺，关外是清，山海关的城门紧闭。沈阳趁这段空隙练兵，西洋教士教旗人铸出了新炮；有贝勒受了洗，也有贝勒握着弓箭去堂子发誓，说洋人迟早要毁了满洲的根本。", effects = [{ kind = "flag", flag = "liaodong_ending_dashun_faces_qing_jin_catholic" }] }, { key = "dashun_faces_qing_jin_hui_learning", outcome = "dashun_faces_qing", court = "jin", outlook = "hui_learning", text = "大顺占了关内，清守在关外，两边都在争西北。沈阳的使者绕道蒙古草原，去吐鲁番、哈密请回回的将领与鲁迷铳匠；西北的军帐里，有人开始传读沈阳寄来的书信。", effects = [{ kind = "flag", flag = "liaodong_ending_dashun_faces_qing_jin_hui_learning" }] }, { key = "dashun_faces_qing_jin_open_learning", outcome = "dashun_faces_qing", court = "jin", outlook = "open_learning", text = "山海关内外对峙，沈阳反倒腾出手来整顿内政：满汉一体写进诏书，从大顺治下逃出来的汉官在沈阳得了衙门与俸禄，读书人的船一船接一船地进牛庄。", effects = [{ kind = "flag", flag = "liaodong_ending_dashun_faces_qing_jin_open_learning" }] }]
