# B10b：TERRA16 §5.5，经典六 key 保留在前；参数均受引擎钩子上限约束。
# 属性说明以各项实际挂的钩子为准；不带入经典身世问答。
# U02：资质、本领两组的 start 由 1 改为 2——只用于不经养成直接出海的成年创建页（自由航海补建身世）：
# 成年船长每项至少二档，自由点数与单项上限不变，避免出现一排 1；养成开局不用这个起点（见 upbringing/common.toml 的年龄基线）。

[[groups]]
key = "aptitude"
name = "资质"
range = [1, 10]
start = 2
free = 6
creation_cap = 7

[[groups]]
key = "craft"
name = "本领"
range = [1, 10]
start = 2
free = 8
creation_cap = 7

[[groups]]
key = "conduct"
name = "品行"
range = [0, 100]
start = 50
free = 0
creation_cap = 100

