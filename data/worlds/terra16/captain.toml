# H01 新增：瞭望长。只能追加在末尾（任职按岗位的顺序编号存档）。
# 航海 60 → 看见别的舰队远 2 格（基点 1200，每 5 个百分点 1 格，最多 +4 格）；揭开迷雾的半径 +2。
[[roles]]
key = "lookout"
name = "瞭望长"
ability = "navigation"
scope = "fleet"
desc = "桅顶守望：更早看见帆影与天边的动静，雾里也看得远些。"
hooks = [{ hook = "intel_detection", per_point = 20 }, { hook = "fog_reveal", per_point = 1, max = 2 }]
