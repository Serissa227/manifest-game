sources = ["史：当时的人当真的海峡险流——阿尔贝蒂《意大利全志》（1550）、法泽洛《西西里史》（1558）：水流每天在固定的时刻换向，被吞的船要在陶尔米纳的海岸才吐出碎片；岩下的浪声像狗吠", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
