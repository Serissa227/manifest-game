basis = "legend"
sources = ["文/传：《奥德赛》12；7—8 世纪的《怪物之书》第一次写成鱼尾——剧本期的人说 sirena 就是人鱼", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["ruse", "avoid"]
