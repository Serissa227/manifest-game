# C12：海区经纬创作源，供 mapgen 栅格化；不是旧版 world/regions.toml 的像素矩形。
# 整数角分：areas 的每项为[西,南,东,北]，左闭右开、下闭上开；180度接缝拆成两段。
# 全域分区含陆地，mapgen先按海岸掩膜取海格。海区之间严格不重叠；边界是游戏近似，非IHO法定海界。
# navigation 子表逐字段符合B4 parse_navigation；整合时原样序列化为 navigation.toml。A3不会自动读取本子表。
# 方向均为去向：0北/1东北/2东/3东南/4南/5西南/6西/7西北；风的来向显示时加180度。
# 强度为游戏档：0无，1—3弱，4—6中，7—9强，10上限；不是蒲福级或节。流速0—3同为游戏档。
# weather、fog_bp均按1—12月；storm_bp、pirate_bp、fog_bp为基点。概率是首次设计值，不是史料的实测日频率。
# pirate_bp保留0：C12不按纬度编造海盗分布，后续势力与事件数据另行给出。
# 气候仅用现代平均作近似，不倒推出1553逐日天气；封冻按无破冰能力帆船关航抽象。
# 雾与音乐仍为内容字段，B4没有雾概率入口；请勿声称当前引擎已经消费。
schema_version = 1
bounds_arcmin = [-10800, -3600, 10800, 4320]
boundary = "west_south_inclusive"

