# C11：东南亚与太平洋；传闻只给见闻，遭遇损失有界，不自动伤害未回应的船。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[creatures]]
key = "naga"
name = "那伽"
text = "船工说，真腊王宫的金塔里住着一条九头的蛇精，是这块地的土地主。它每夜化成女身去见国王，哪夜不来，国王就要死。"
basis = "historical"
sources = ["史/传：周达观《真腊风土记》（1296—97）——王宫金塔里的九头蛇精\"乃一国之土地主也\"，每夜化成女身与王相会，一夜不现，王的死期就到；占婆美山碑（约 657）的那伽公主（《梁书》的柳叶不是蛇女）", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe"]
outcomes = { observe = { text = "夜里去河边守一守", reply = "守到天亮也没见着什么，只有水鸡在芦苇里叫。岸上的老人听说他守了一夜，摇头说，蛇精不来，国王的日子就到头了。", clue = "c11_creature_naga_known" } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
ports = ["ayutthaya_port"]
when = { night = true }

[[creatures]]
key = "garuda_navel"
name = "迦楼罗与海脐巨树"
text = "回过南洋的人说，大爪哇北边的海里有一棵巨树，树上住着能叼走水牛与大象的迦楼罗。树底的漩涡极大，三四里之内，船都靠不近。"
basis = "historical"
sources = ["史：东爪哇基达尔神庙的浮雕（约 1248）、阿瑜陀耶的王印；皮加费塔（1522）——大爪哇以北的海中巨树上住着能叼走水牛或大象的迦楼罗，四周漩涡极大，船在三四里格内靠不近", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["avoid", "observe"]
outcomes = { avoid = { text = "绕开海脐，改走东水道", reply = "改走东边的水道，多绕了一天。树底下的漩涡声在夜里还听得见，轰轰的，像远处的磨坊。船员们没有人去看它。", delay_days = 1 }, observe = { text = "爬上桅顶看那片黑影", reply = "桅顶上望过去，海中央立着一片黑影，比山还高。有人说那是树，有人说那是鸟张开的翅膀。船走到三四里外便不敢再近，水手们把帆收了一半。", clue = "c11_creature_garuda_navel_known" } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
regions = ["java_sea"]

[[creatures]]
key = "navel_crab"
name = "海脐巨蟹"
text = "马六甲的领航员说，海底有一只大蟹，回洞时海水涨起来，出洞时海水退下去。领航员们都信这个，说算潮水靠的就是它。"
basis = "extended"
sources = ["传：马来的说法（纽博尔德 1839、斯基特 1900 才记下；皮加费塔 1522 年的\"水之脐\"是剧本期的旁证）", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe"]
outcomes = { observe = { text = "问领航员潮水何时换向", reply = "领航员掐着指头算了半天，说蟹该回洞了，让船等到涨潮再过峡。船走得稳，一路没有撞上暗礁。那套算法他不肯讲，只说是祖辈传下来的。", clue = "c11_creature_navel_crab_known" } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
regions = ["malacca"]

[[creatures]]
key = "occolora"
name = "阿科洛罗岛"
