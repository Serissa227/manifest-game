# 寰宇·十六世纪：第九批的成品世界，进入开局列表；不继承经典条目（后端显示文字另抄一份在 texts.toml）。
key = "terra16"
languages = ["zh"]
name = "寰宇·十六世纪"
# 开局选世界时卡片上的一句标语与一段简介（不写时显示通用的兜底话）。
tagline = "先长大，再出海"
blurb = "1553 年的地球：先在家乡与学院度过少年时代，再扬帆驶进史实与传说交织的海洋。"
map = "earth"
hidden = false

[calendar]
era = "公元"
months = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
seasons = [3, 3, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3]
# 每年365天，无闰日；1582年改历仅作叙事。地点的南半球季节留给 C2。

[money]
currency = "金币"

[lore]
summary = "1553年。葡萄牙人借口晾晒货物，第一次在澳门上了岸；月港的私船趁着北风南下；塞维利亚的领航考官还在逐个盘问学徒怎样用星盘。这一年，生于1540年的孩子们十三岁——先在家乡与学院里长大，再扬帆出海，去看一个史实与传说交织的世界。在这里，辽东的烽烟比史书早燃了半个世纪。"
terms = "金币是折合威尼斯杜卡特等金币的账面单位；港市与人物使用本时代称谓；海禁、朝贡、附庸和商人网络不等同现代民族国家关系。史实按真实年代；辽东战役链整体提前约五十五年。后世传说及游戏补全须逐条标明出处与改动。"
taboos = "不贩卖奴隶或鸦片；不将后世技术和制度无标注地提前；不复制受保护作品的专名、角色或文本；不得凭空制造没有出处的历史团体。宗教用品不赋予秘术；历史人物不开放恋爱。"
sourcing = "strict"
allow_original = ["jackdaw"]

