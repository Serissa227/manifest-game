# C2j 文案整理：以下保留原考证或接线说明，不进入玩家正文。
# 达曼原正文：1553年的河口仍属古吉拉特，1559年葡萄牙征服后另开商站。（dormant 至1559）
# 苏拉特原正文：达布蒂河口的织物商港仍属古吉拉特，莫卧儿征服要到1573年。
# 焦尔原正文：上焦尔属艾哈迈德讷格尔，葡萄牙人在下城设堡，不能把两者混成一城。
# 科伦坡原正文：科特王国沿岸的葡萄牙据点经营肉桂，内陆统治并未因此消失。
# 胡格利原正文：1553年尚无后来的葡萄牙商站，1579年以后才按新商埠启用。（dormant 至1579）
# 纳加帕蒂南原正文：科罗曼德尔的纳亚克辖区出产印花棉布，归属按维查耶纳伽尔宗主权表达。
