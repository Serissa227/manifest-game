[[creatures]]
key = "anansi"
name = "造人的大蜘蛛"
text = "埃尔米纳的商人说，黄金海岸很大一部分人相信，人是大蜘蛛阿南西造的。它是个爱讲故事的大蜘蛛，谁能说一个它没听过的故事，它就放谁过去。"
