# C11：非洲；传闻只给见闻，遭遇损失有界，不自动伤害未回应的船。
# 正文仅为中文占位；完整出处要点见独立 target 的 copy-needed.json。

[[creatures]]
key = "senegal_serpent"
name = "塞内加尔河的大蛇"
text = "河口的老船工说，有蛇长到四分之一里格，从湖里爬出来往海里去，一路压坏岸边的芦苇。进了咸水就化了，十年才碰上一次。"
basis = "historical"
sources = ["史：帕谢科·佩雷拉《绿宝石海环行》（约 1505—08）——长到四分之一里格的蛇离开湖泊入海，一路造成破坏，鸟群啄食它极软的肉，到了海里就化在水中，\"大约十年才见一次\"", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe", "avoid"]
outcomes = { observe = { text = "远远看着，不靠近", reply = "远远看清了蛇身的宽窄和游动的方向，还有鸟群追着它啄的那一片水面。账房把这些一条条记进了航海簿。", clue = "c11_creature_senegal_serpent_known" }, avoid = { text = "等它过去再走", reply = "船长让船在河口外抛锚，等蛇从岸边那段水道穿过去才起锚。一直耗到第二天，船上没人再提下河的事。", delay_days = 1 } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
regions = ["cape_verde"]

[[creatures]]
key = "kongo_mermaid"
name = "刚果河的\"鱼女\""
text = "河口的渔户说，水里有个白得像人的半身，露出来对着船笑。那是献给国王的贡品，私下吃了的人要倒大霉。"
basis = "extended"
sources = ["史，提前：杜阿尔特·洛佩斯口述、菲利波·皮加费塔《刚果王国记》（1591）；卡瓦齐（1687）", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe"]
outcomes = { observe = { text = "看着，不伸手", reply = "海牛在浅水里翻了个身，露出灰黑的背，小眼睛几乎看不见。向导说这东西要先献给国王，船上的人只远远看着。", clue = "c11_creature_kongo_mermaid_known" } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
ports = ["mpinda"]

