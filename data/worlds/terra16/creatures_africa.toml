[[creatures]]
key = "madagascar_beasts"
name = "马达加斯加的兽"
text = "马达加斯加东南的湖边，有人说见过人脸的兽，叫特雷特雷，见人就跑。还有耳朵挡住眼睛的曼加尔萨霍克，另有一种叫布雷的，船工说那一定是独角兽。"
basis = "extended"
sources = ["提前：弗拉古尔《马达加斯加大岛史》（1658）——人脸的特雷特雷特雷特雷（多半是已灭绝的巨狐猴）、耳朵挡住眼睛的曼加尔萨霍克、\"那一定是独角兽\"的布雷", "docs/TERRA16.md §9.2；地点近似、概率、费用和有限结果为游戏补全。"]
responses = ["observe", "avoid"]
outcomes = { observe = { text = "躲在石头后看", reply = "湖边的草丛里站起一个人脸的兽，见了人就往湖里跑。本地的向导说，它叫特雷特雷，他们一向不去追。", clue = "c11_creature_madagascar_beasts_known" }, avoid = { text = "绕开湖走", reply = "船绕开了那片湖，多走了一天的水路，才在别处靠岸取水。人脸的兽没有追过来，水手们却觉得背后一直有眼睛在看。", delay_days = 1 } }
chance_bp = 15
cooldown_days = 180
books = ["pliny"]
regions = ["madagascar_east"]

