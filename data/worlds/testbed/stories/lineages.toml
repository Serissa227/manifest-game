# 转化和逆转都必须经真实故事选项。
[[tracks]]
key = "sample_transformation"
name = "测试转化"
kind = "request"
start = "first"
auto = false
[[tracks.chapters]]
key = "first"
title = "测试转化"
text = "这是测试转化故事。"
choices = [{key="accept",text="接受测试传承。",next="done",effects=[{kind="transform",lineage="sample_lineage"}]}]
[[tracks]]
key = "sample_reversal"
name = "测试逆转"
kind = "request"
start = "first"
auto = false
[[tracks.chapters]]
key = "first"
title = "测试逆转"
text = "这是测试逆转故事。"
when = [{kind="lineage",lineage="sample_lineage"}]
choices = [{key="reverse",text="解除测试传承。",next="done",effects=[{kind="transform"}]}]
