# 原创多轨道样例；完整交货目标与相对限期在 E41 扩充，此处用绝对窗口验证缺省分支。

[[tracks]]
key = "request_letters"
name = "港口的书信"
kind = "request"
start = "ask"
auto = false
cast = ["mentor"]
[[tracks.chapters]]
key = "ask"
title = "一件小小的请托"
text = "对方想请你帮忙捎个口信，也愿意听听你的安排。"
at = "test_west"
window = [[1558, 1, 1], [1558, 1, 2]]
[tracks.chapters.default]
next = "failed"
news = "这件请托没能及时接下。"
[[tracks.chapters.choices]]
key = "accept"
text = "我愿意帮忙。"
next = "return"
[[tracks.chapters.choices]]
key = "decline"
text = "我暂时抽不开身。"
next = "failed"
[[tracks.chapters]]
key = "return"
title = "带回消息"
text = "对方等着与你再次碰面。"
at = "test_west"
window = [[1558, 1, 3], [1558, 1, 4]]
[tracks.chapters.default]
next = "failed"
news = "约好的碰面日期过去了。"
[[tracks.chapters.choices]]
key = "finish"
text = "事情已经办妥。"
next = "done"
effects = [{ kind = "affinity", person = "mentor", value = 5 }]
news = "港口的书信有了妥当的着落。"

